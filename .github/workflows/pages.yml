name: Deploy paper library
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published course readers
        env:
          COURSES_BASE: ${{ steps.deployment.outputs.page_url }}courses/
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, gzip, base64
          from pathlib import Path
          def course_payload(text):
              found = re.search(r'<script type="application/json" id="data"[^>]*>(.*?)</script>', text, re.S)
              value = found.group(1)
              source = re.search(r'data-source-url="([^"]+)"', found.group(0))
              root = ''
              if source:
                  root = source.group(1).split('/course-data/')[0] + '/'
                  with urllib.request.urlopen(source.group(1), timeout=60) as response:
                      value = gzip.decompress(response.read()).decode()
              elif 'data-encoding="gzip-base64"' in found.group(0):
                  value = gzip.decompress(base64.b64decode(value)).decode()
              data = json.loads(value)
              def asset(url):
                  return root + url[5:] if isinstance(url, str) and url.startswith('@raw/') else url
              for page in data['pages']:
                  for point in page.get('boards', []):
                      point['frame'] = asset(point.get('frame'))
                      point['redraw_svg_url'] = asset(point.get('redraw_svg_url'))
                      if point.get('visual_source'):
                          point['visual_source']['slide_image'] = asset(point['visual_source'].get('slide_image'))
              return data
          expected = json.loads(Path('site/courses/progress.json').read_text())
          base = os.environ['COURSES_BASE']
          last_error = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + 'progress.json?commit=' + os.environ['GITHUB_SHA'], timeout=30) as response:
                      actual = json.load(response)
                  assert actual == expected, 'Published course manifest has not refreshed yet'
                  with urllib.request.urlopen(base + '?commit=' + os.environ['GITHUB_SHA'], timeout=30) as response:
                      index = response.read().decode('utf-8')
                  assert index.count('class="card"') == 63
                  first = next(course for course in expected['courses'] if course['pages'])
                  with urllib.request.urlopen(base + 'books/' + first['video_id'] + '.html', timeout=30) as response:
                      reader = response.read().decode('utf-8')
                  assert 'id="data"' in reader and 'id="local-video"' in reader
                  assert '讲者原文 · 中英逐段对照' in reader
                  bilingual = next(course for course in expected['courses'] if course.get('translated_segments', 0))
                  with urllib.request.urlopen(base + 'books/' + bilingual['video_id'] + '.html?commit=' + os.environ['GITHUB_SHA'], timeout=30) as response:
                      bilingual_html = response.read().decode('utf-8')
                  payload = re.search(r'<script type="application/json" id="data"[^>]*>(.*?)</script>', bilingual_html, re.S)
                  content = course_payload(bilingual_html)
                  translated = sum(bool(segment.get('zh')) for page in content['pages'] for segment in page['segments'])
                  assert translated == bilingual['translated_segments'] and translated > 0
                  if expected.get('videos_available', 0):
                      video_course = next(course for course in expected['courses'] if course['video_ready'])
                      with urllib.request.urlopen(base + 'books/' + video_course['video_id'] + '.html?commit=' + os.environ['GITHUB_SHA'], timeout=30) as response:
                          video_reader = response.read().decode('utf-8')
                      video_payload = re.search(r'<script type="application/json" id="data"[^>]*>(.*?)</script>', video_reader, re.S)
                      video_url = course_payload(video_reader)['video_url']
                      assert video_url.endswith('/' + video_course['video_id'] + '.mp4')
                      request = urllib.request.Request(video_url, headers={'Range': 'bytes=0-1023'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          assert response.status == 206, 'Original video must support byte-range seeking'
                          assert response.read(1024)[4:8] == b'ftyp', 'Original video is not a readable MP4'
                  if expected.get('ppt_verified_points', 0):
                      ppt_course = next(course for course in expected['courses'] if course.get('ppt_verified_points', 0))
                      with urllib.request.urlopen(base + 'books/' + ppt_course['video_id'] + '.html?commit=' + os.environ['GITHUB_SHA'], timeout=30) as response:
                          ppt_content = course_payload(response.read().decode('utf-8'))
                      verified_points = [point for page in ppt_content['pages'] for point in page.get('boards', []) if point.get('visual_source', {}).get('verified')]
                      assert len(verified_points) == ppt_course['ppt_verified_points']
                      assert any(point.get('redraw_svg') or point.get('redraw_svg_url') for point in verified_points)
                      vector = next((point.get('redraw_svg_url') for point in verified_points if point.get('redraw_svg_url')), None)
                      if vector:
                          with urllib.request.urlopen(vector, timeout=60) as response:
                              assert b'<svg' in gzip.decompress(response.read())
                  print('Verified live course index, manifest and reader:', expected['pages'], 'pages')
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(5)
          else:
              raise RuntimeError('Live course verification failed') from last_error
          PY
