 learn how to cook because you don't have the ingredients with you. And then you're going to get low reward. And then also, if you don't yet know how to cook because you haven't collected experience on that, then regardless of the exploration you do, you're going to get low reward. And so you sort of have this chicken and egg problem between learning how to explore.","zh":"如果你尚未弄清楚如何找到食材，因为你的探索行为不好，那么你就无法学习如何烹饪，因为你没有带食材。然后你将获得低奖励。此外，如果你还不知道如何烹饪，因为你没有在该任务上收集经验，那么无论你进行怎样的探索，你都将获得低奖励。因此，你有一种类似于鸡与蛋的问题，即在学习如何探索和学习如何利用信息之间存在相互依赖。","start":3651.59,"end":3677.03},{"id":252,"text":"And learning how to solve the task using that information. And so there's another way to view this is this kind of coupling problem where exploration and execution or exploitation depend on each other in order to be jointly successful.","zh":"学习如何利用这些信息来解决任务。因此，另一种看待这个问题的方式是这种耦合问题，其中探索和执行或利用行为相互依赖，以实现联合成功。","start":3677.77,"end":3691.25},{"id":253,"text":"Then the way to view end-to-end training is that it's great in that you can learn this optimal trade-off, but it can be extremely challenging if you have a hard exploration problem because you need to figure out how to explore and exploit and get learning signal that way.","zh":"将端到端训练视为一种方式，其优点是你能够学习到这种最优的权衡，但如果存在一个困难的探索问题，它可能会极其具有挑战性，因为你需要弄清楚如何探索和利用，并通过这种方式获得学习信号。","start":3693.9,"end":3708.5},{"id":254,"text":"The question is, is the ultimate challenge here that the reward is sparse? So it's true that if you had a dense reward, you'd be in a much better place. Basically because you wouldn't really have to explore. You would be able to... You wouldn't have to explicitly take actions to explore.","zh":"问题是，这里的最终挑战是否在于奖励稀疏？确实，如果你有一个密集的奖励，你将会处于更好的位置。基本上，因为你不需要真正去探索，你不需要显式地采取行动去探索。","start":3709.82,"end":3730.69},{"id":255,"text":"And this really comes down to a problem when exploration is hard. If exploration is easy, this really isn't a problem because you no longer have to solve both exploration and exploitation. You only have to solve exploitation. So there's a couple of solutions to this, and we'll start to talk about one solution today. And then on Friday, we'll talk about more solutions. So the second solution, I'm not going to go into complete detail on how these work.","zh":"这实际上归结为一个探索困难的问题。如果探索很容易，这实际上就不是一个大问题，因为您不再需要同时解决探索和利用问题。您只需要解决利用问题。因此，有几个解决方案，今天我们将开始讨论其中一个解决方案。然后在星期五，我们将讨论更多的解决方案。所以第二个解决方案，我不会详细讲解这些解决方案的工作原理。","start":3732.7,"end":3760.27}],"notes":["本段讨论了在强化学习中，探索与利用之间的耦合问题。如果探索行为不佳，就无法获取必要的信息来完成任务，从而导致低奖励。同样，如果尚未掌握任务的解决方法，无论探索如何进行，都无法获得有效学习信号。这种相互依赖的关系形成了类似‘鸡与蛋’的问题。","讲者通过烹饪的例子说明了探索与利用的耦合性。在新环境中学习烹饪时，必须同时具备找到食材（探索）和使用这些食材进行烹饪（利用）的能力。如果缺乏其中任何一个环节，都无法获得有效的学习信号。","讲者指出，探索与利用的耦合问题使得端到端训练变得极具挑战性。特别是在探索困难的情况下，需要同时解决探索和利用的问题，以获取有效的学习信号。","讲者进一步提出，奖励稀疏性可能是这一问题的核心挑战。如果奖励是密集的，就不需要显式地进行探索，因为系统可以自动获得反馈。然而，在奖励稀疏的情况下，探索和利用的平衡变得尤为重要。","讲者提到，解决这一问题的策略将在后续课程中展开讨论。今天将介绍其中一种解决方案，而周五将讨论更多方法。这表明，探索与利用的耦合问题是一个复杂且需要多方面策略解决的问题。","讲者强调，探索与利用的相互依赖关系是元强化学习中的关键挑战之一。这种耦合性使得系统需要同时优化探索和利用策略，以实现有效的学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3597.32,"end":3760.27,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3597.32,"text":"Basically, in a problem like this, you're only going to actually be learning something useful about how to explore and exploit if you successfully did the proper exploration behavior and then did the exploitation behavior. If you do them in separate episodes, then you're not actually getting good learning signal."},{"start":3618.6,"text":"And that means that you sort of have this kind of sample complexity where you need to actually get lucky and do both of the two things at the same time in order to get signal that helps you learn the problem. So basically, it's hard to learn how to explore and exploit at the same time. Another example of this is say that you're trying to learn how to cook. You have data in previous kitchens. Your goal is to then be able to quickly learn how to cook in a new kitchen. Now, in order to learn how to cook, you need to find the ingredients."},{"start":3651.59,"text":"And if you haven't yet figured out how to find the ingredients because you have bad exploration, then you can't learn how to cook because you don't have the ingredients with you. And then you're going to get low reward. And then also, if you don't yet know how to cook because you haven't collected experience on that, then regardless of the exploration you do, you're going to get low reward. And so you sort of have this chicken and egg problem between learning how to explore."},{"start":3677.77,"text":"And learning how to solve the task using that information. And so there's another way to view this is this kind of coupling problem where exploration and execution or exploitation depend on each other in order to be jointly successful."},{"start":3693.9,"text":"Then the way to view end-to-end training is that it's great in that you can learn this optimal trade-off, but it can be extremely challenging if you have a hard exploration problem because you need to figure out how to explore and exploit and get learning signal that way."},{"start":3709.82,"text":"The question is, is the ultimate challenge here that the reward is sparse? So it's true that if you had a dense reward, you'd be in a much better place. Basically because you wouldn't really have to explore. You would be able to... You wouldn't have to explicitly take actions to explore."},{"start":3732.7,"text":"And this really comes down to a problem when exploration is hard. If exploration is easy, this really isn't a problem because you no longer have to solve both exploration and exploitation. You only have to solve exploitation. So there's a couple of solutions to this, and we'll start to talk about one solution today. And then on Friday, we'll talk about more solutions. So the second solution, I'm not going to go into complete detail on how these work."}],"speech_gaps":[],"frame":"../frames/v023/022.webp","frame_time":3609.32},{"title":"元强化学习中的后验采样方法","segments":[{"id":256,"text":"One solution here is instead of optimizing just for end-to-end reward, you can add in auxiliary exploration objectives to encourage it to try to actually figure out something more meaningful about the task. One approach here is to use what's called posterior sampling, also called Thompson sampling. And the way that this works is that we talked about","zh":"这里的一个解决方案是，与其仅仅为了端到端奖励进行优化，你可以添加辅助的探索目标，以鼓励它尝试真正理解任务中更有意义的内容。一种方法是使用所谓的后验采样，也称为汤普森采样。这种方法的工作方式是，我们讨论过","start":3761.16,"end":3789.92},{"id":257,"text":"We talked about having an algorithm where you're trying to infer what the task is. And if you've collected some experience so far, and you've inferred some distribution over your task, in this case, zi is now kind of some latent representation. It's not a representation that's known.","zh":"我们讨论过一种算法，你试图推断任务是什么。如果你已经收集了一些经验，并且推断出任务的分布，在这种情况下，zi现在是一种潜在表示。它并不是一个已知的表示。","start":3790.73,"end":3818.69},{"id":258,"text":"Then what you could do is you could then sample from this distribution and then act as if that was the correct task. So if you have this task inference procedure and then you also have a policy that given an estimate of Z is able to generate actions, then what you can do is you can sample a Z from this distribution and then sample from this policy.","zh":"然后你可以从这个分布中进行采样，然后像这个任务是正确的那样行动。因此，如果你有一个任务推断过程，并且你还有一个策略，该策略可以根据Z的估计生成动作，那么你可以从这个分布中采样一个Z，然后从这个策略中进行采样。","start":3819.65,"end":3848.21},{"id":259,"text":"And if you have policies that are able to, this starts to kind of decouple the problem a little bit, because if you have policies that for a given Z are kind of do the task, then you would basically learn an exploration strategy that is trying to kind of go down the different corridors to find.","zh":"如果你有能够根据给定Z执行任务的策略，这开始在一定程度上解耦了问题，因为如果你有策略对于给定的Z能够执行任务，那么你基本上会学习一种探索策略，尝试去探索不同的走廊以找到解决方案。","start":3849.04,"end":3875.0},{"id":260,"text":"the solution. So as an example, this is actually a problem that looks somewhat similar to the corridors where you get a sparse reward if you reach one of these circles and the different circles correspond to different tasks. And in this case, we've sampled this task right here. And first we sample","zh":"解决方案。举个例子，这个问题实际上看起来有点像走廊问题，如果你到达其中一个圆圈就会获得稀疏奖励，而不同的圆圈对应不同的任务。在这种情况下，我们已经采样了这个任务。首先我们从任务的先验分布中采样Z，此时我们还没有收集任何数据。因此，我们采样Z，然后基于这些Z运行我们的策略，并根据这些进行探索。然后我们利用这些来推断任务可能是什么。因此，现在我们知道任务可能是在这里或者在这里。因此，你现在会收集颜色较浅的轨迹，像这个、这个，以及向这里移动。","start":3876.16,"end":3895.71},{"id":261,"text":"a Z from our kind of prior over tasks without any, we haven't collected any data yet. So we sample Z, we then run our policy based on those different Zs and we get exploration based on these. And then we use that to infer what the task might be. And so now we know that the task is probably either over here or over here. And so now you'll collect trajectories that are lighter in color that are like this one, this one, and going over here.","zh":"我们采样Z，然后基于这些Z运行我们的策略，并根据这些进行探索。然后我们利用这些来推断任务可能是什么。因此，现在我们知道任务可能是在这里或者在这里。因此，你现在会收集颜色较浅的轨迹，像这个、这个，以及向这里移动。","start":3896.53,"end":3923.13}],"notes":["本段讲解了元强化学习中的一种方法，即通过后验采样（Thompson sampling）来鼓励探索。这种方法通过从任务分布中采样潜在表示（Z），并基于该表示生成策略，从而实现对任务的探索。","讲者提到，当收集到经验后，可以推断出任务的分布，其中Z是一个潜在表示，但其具体形式是未知的。通过从该分布中采样，可以模拟出正确的任务，从而生成策略。","这种方法将任务推理过程与策略生成过程解耦，使得策略能够针对不同的Z值执行任务。这有助于学习一种探索策略，尝试不同的路径以找到解决方案。","讲者以走廊问题为例，说明了稀疏奖励的设置，其中不同的圆圈代表不同的任务。通过采样Z并运行策略，可以探索不同的路径，并据此推断任务的可能位置。","在没有数据的情况下，首先从任务的先验分布中采样Z，然后运行策略以获得探索结果。这些探索结果用于推断任务的可能位置，从而指导后续的轨迹收集。","最后，讲者指出，通过这种方式，可以收集到不同颜色的轨迹，这些轨迹对应于不同的探索路径，从而帮助进一步理解任务的结构。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3761.16,"end":3923.13,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3761.16,"text":"One solution here is instead of optimizing just for end-to-end reward, you can add in auxiliary exploration objectives to encourage it to try to actually figure out something more meaningful about the task. One approach here is to use what's called posterior sampling, also called Thompson sampling. And the way that this works is that we talked about"},{"start":3790.73,"text":"We talked about having an algorithm where you're trying to infer what the task is. And if you've collected some experience so far, and you've inferred some distribution over your task, in this case, zi is now kind of some latent representation. It's not a representation that's known. Then what you could do is you could then sample"},{"start":3819.65,"text":"from this distribution and then act as if that was the correct task. So if you have this task inference procedure and then you also have a policy that given an estimate of Z is able to generate actions, then what you can do is you can sample a Z from this distribution and then sample from this policy."},{"start":3849.04,"text":"And if you have policies that are able to, this starts to kind of decouple the problem a little bit, because if you have policies that for a given Z are kind of do the task, then you would basically learn an exploration strategy that is trying to kind of go down the different corridors to find."},{"start":3876.16,"text":"the solution. So as an example, this is actually a problem that looks somewhat similar to the corridors where you get a sparse reward if you reach one of these circles and the different circles correspond to different tasks. And in this case, we've sampled this task right here. And first we sample"},{"start":3896.53,"text":"a Z from our kind of prior over tasks without any, we haven't collected any data yet. So we sample Z, we then run our policy based on those different Zs and we get exploration based on these. And then we use that to infer what the task might be. And so now we know that the task is probably either over here or over here. And so now you'll collect trajectories that are lighter in color that are like this one, this one, and going over here."}],"speech_gaps":[],"frame":"../frames/v023/023.webp","frame_time":3773.16},{"title":"元强化学习中的探索问题与策略局限","segments":[{"id":262,"text":"And then once you've actually collected this trajectory, then you should actually have a much narrower distribution over the task because you get positive reward here. And so then your policy or your Z distribution will be narrowed out here and you'll attribute your policy according to those Zs. And so that's kind of one approach for addressing this exploration problem.","zh":"然后一旦你实际收集了这条轨迹，你应该会拥有一个更狭窄的任务分布，因为在这里你获得了正奖励。因此，你的策略或Z分布会在这里被缩小，并且你会根据这些Z值来归因你的策略。因此，这是应对探索问题的一种方法。","start":3924.53,"end":3947.33},{"id":263,"text":"Basically learning this latent representation over tasks and then sampling from those tasks, from that distribution and acting according to your policy for that task. Does anyone have thoughts on like, so there's some scenarios where this is great and scenarios where this is not so great. Does anyone have thoughts on when this sort of sampling might be bad? Like what sort of MDPs this might not work well in? If you have a large action space, that could contribute.","zh":"基本上是学习任务上的潜在表示，然后从这些任务或分布中进行采样，并根据你的策略执行任务。有没有人对这种情况有想法？比如，有些场景下这种方法很好，而有些场景下则不太理想。有没有人对这种采样方式可能不好的情况有想法？比如，这种策略在哪些MDP中可能效果不佳？如果你有一个大的动作空间，这可能会成为一个因素。","start":3948.11,"end":3977.09},{"id":264,"text":"Although it isn't just having to do with the action space, because if you have a dense reward in a large action space, you'd be probably okay. So if Z is out of distribution, certainly things will be problematic. But even in distribution, there's scenarios where this exploration strategy will be really bad. Yeah, so one scenario where this might work poorly is if you start to see some reward","zh":"不过，这不仅仅与动作空间有关，因为如果你在一个大的动作空间中拥有密集的奖励，你可能还是可以的。所以如果Z分布偏离了分布，事情肯定会出问题。即使在分布内，也存在一些场景，这种探索策略会非常糟糕。是的，一个这种策略可能表现不佳的场景是，当你开始看到一些奖励时，但实际上在另一个场景中可能有甚至更好的奖励。你可能会过早地开始利用，尽管如果它知道还有其他任务可能有更高的奖励，它不会排除这些高奖励的场景。因此，我想到的这种策略可能表现非常糟糕的场景实际上就类似于这里的情况。","start":3978.61,"end":4006.33},{"id":265,"text":"but there might actually be even better reward in another scenario. You might kind of start to exploit a little bit too early, although it won't rule out those higher reward scenarios if it knows that there are other tasks that might have higher rewards. So I guess the kind of the scenario that I was thinking of where I think that this can be quite bad is actually a lot like this scenario right here. So the strategy that posterior sampling will learn in this scenario is instead of looking at the instructions,","zh":"在这种情况下，后验采样策略学到的策略不是查看指令，而是会进入每一个走廊，尝试寻找奖励。因为它会通过执行对应不同任务的策略来显式地探索。如果走廊非常长，这会尤其糟糕。","start":4007.59,"end":4036.46},{"id":266,"text":"it's instead going to go down each of the hallways and try to find the reward. Because it's trying to explicitly explore by executing policies corresponding to different tasks. And this will be especially bad if the hallways are very long.","zh":"它会依次进入每个走廊，试图找到奖励。因为它试图通过执行对应不同任务的策略来显式地进行探索。如果走廊非常长，这种情况会尤其糟糕。","start":4037.17,"end":4049.71},{"id":267,"text":"So if the hallways are really, really long, like, I don't know, take days to traverse, then what it's going to do is it's going to spend days going down one of them and figuring out that it's not the right one and then spend days going down another one rather than trying to seek out information that might tell it about what to do. Cool. So, for example, if these goals are very far away and there's some sign that tells you what the correct goal is, then this is a bad strategy. Now, if that sign doesn't exist, then kind of,","zh":"所以，如果走廊真的非常非常长，比如需要花几天时间才能走完，那么它所做的就是花几天时间走其中一个走廊，发现这不是正确的路径，然后再花几天时间走另一个走廊，而不是尝试去寻找一些可能告诉它该怎么做信息。很好。例如，如果这些目标非常遥远，并且有一些标志告诉你正确的目标是什么，那么这就是一个糟糕的策略。现在，如果那个标志不存在，那么某种程度上，","start":4050.43,"end":4080.53}],"notes":["本段讨论了元强化学习（Meta RL）中通过收集轨迹来缩小任务分布的方法，以及如何通过Z分布来调整策略。讲者指出，这种策略在某些情况下可以有效解决探索问题，但在其他情况下可能表现不佳。","讲者进一步探讨了该策略的局限性，特别是在大型动作空间中，如果奖励密度高，可能不会造成太大问题。但如果Z分布偏离真实分布，或者任务分布中存在更优的奖励场景，该策略可能表现不佳。","讲者举了一个具体例子，即在长走廊中寻找奖励的场景。如果走廊很长，策略会花费大量时间探索每个走廊，而不是通过信息获取来优化决策，这在某些情况下是不理想的。","讲者还提到，如果目标距离很远且存在指示信息，这种策略会表现得很差；但如果不存在指示信息，策略可能仍然会尝试探索，但效率低下。","讲者强调了探索策略在不同任务分布和奖励结构下的表现差异，指出该策略在某些情况下可能过于依赖直接探索，而忽略了信息获取的重要性。","最后，讲者通过走廊的例子说明了策略的局限性，并指出在缺乏明确指示的情况下，策略可能无法有效优化探索路径。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3924.53,"end":4080.53,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3924.53,"text":"And then once you've actually collected this trajectory, then you should actually have a much narrower distribution over the task because you get positive reward here. And so then your policy or your Z distribution will be narrowed out here and you'll attribute your policy according to those Zs. And so that's kind of one approach for addressing this exploration problem."},{"start":3948.11,"text":"Basically learning this latent representation over tasks and then sampling from those tasks, from that distribution and acting according to your policy for that task. Does anyone have thoughts on like, so there's some scenarios where this is great and scenarios where this is not so great. Does anyone have thoughts on when this sort of sampling might be bad? Like what sort of MDPs this might not work well in? If you have a large action space, that could contribute."},{"start":3978.61,"text":"Although it isn't just having to do with the action space, because if you have a dense reward in a large action space, you'd be probably okay. So if Z is out of distribution, certainly things will be problematic. But even in distribution, there's scenarios where this exploration strategy will be really bad. Yeah, so one scenario where this might work poorly is if you start to see some reward"},{"start":4007.59,"text":"but there might actually be even better reward in another scenario. You might kind of start to exploit a little bit too early, although it won't rule out those higher reward scenarios if it knows that there are other tasks that might have higher rewards. So I guess the kind of the scenario that I was thinking of where I think that this can be quite bad is actually a lot like this scenario right here. So the strategy that posterior sampling will learn in this scenario is instead of looking at the instructions,"},{"start":4037.17,"text":"it's instead going to go down each of the hallways and try to find the reward. Because it's trying to explicitly explore by executing policies corresponding to different tasks. And this will be especially bad if the hallways are very long."},{"start":4050.43,"text":"So if the hallways are really, really long, like, I don't know, take days to traverse, then what it's going to do is it's going to spend days going down one of them and figuring out that it's not the right one and then spend days going down another one rather than trying to seek out information that might tell it about what to do. Cool. So, for example, if these goals are very far away and there's some sign that tells you what the correct goal is, then this is a bad strategy. Now, if that sign doesn't exist, then kind of,"}],"speech_gaps":[],"frame":"../frames/v023/024.webp","frame_time":3936.53},{"title":"元强化学习中的探索策略与模型优化","segments":[{"id":268,"text":"It actually would be a good strategy because you have to go down those different corridors. Okay, there's a couple of other approaches that we can use as well that include adding intrinsic rewards that try to encourage it to visit new states and also trying to visit states that help you distinguish the dynamics and reward models for different tasks. So we try to collect data so that our model of rewards and states are accurate.","zh":"这实际上会是一个很好的策略，因为你必须进入那些不同的走廊。好的，我们还可以使用其他一些方法，包括添加内在奖励，以鼓励探索新状态，以及尝试访问有助于区分不同任务的动力学和奖励模型的状态。因此，我们尝试收集数据，以确保我们的奖励模型和状态模型准确。","start":4080.98,"end":4107.39},{"id":269,"text":"And with this sort of approach, you could actually get exploration strategy that looks a lot more efficient, that looks something like this, compared to posterior sampling that's trying to kind of just sample the different trajectories for the different tasks.","zh":"采用这种策略，你实际上可以获得一种看起来更加高效的探索策略，其效果类似于这样，与尝试对不同任务的轨迹进行采样的后验采样方法相比。","start":4108.51,"end":4120.79},{"id":270,"text":"There's also scenarios where this might be bad if there's lots of distractors or really complex state dynamics. But fortunately, I don't have too much time to go over that now. So these sorts of approaches are easier to optimize than end-to-end. A lot of them have some principle behind them, but they can be very suboptimal in certain environments, and it kind of depends on the environment or the domain.","zh":"在某些情况下，这种方法可能会有负面影响，特别是当存在大量干扰项或非常复杂的状态动力学时。不过幸运的是，我现在没有太多时间详细讨论这一点。因此，这类方法比端到端的方法更容易优化。其中很多方法都有一定的理论依据，但在某些环境中可能会非常次优，这取决于环境或领域。","start":4122.97,"end":4144.47}],"notes":["本段讲解了元强化学习中通过内在奖励机制来提升探索效率的策略，强调了通过收集数据以提高奖励模型和状态模型的准确性。这种策略在需要探索不同走廊或任务时特别有效。","讲者提到，这种探索策略相比后验采样方法更加高效，因为它能够更系统地引导智能体探索有助于区分任务动态和奖励模型的状态。","同时，讲者也指出这种方法在存在大量干扰项或复杂状态动态的场景下可能表现不佳，但目前没有时间深入讨论这些问题。","此外，讲者提到这些方法相比端到端优化更容易实现，但它们的性能依赖于具体环境或领域，可能在某些情况下表现不佳。","讲者强调了元强化学习中策略设计的复杂性，即需要在探索效率和模型准确性之间找到平衡，同时考虑环境的特性。","最后，讲者指出，虽然这些方法有其理论基础，但在实际应用中仍需根据具体任务进行调整和优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4080.98,"end":4144.47,"asr_flags":[],"translation_complete":true,"translated_segments":3,"raw_segments":[{"start":4080.98,"text":"it actually would be a good strategy because you have to go down those different corridors. Okay, there's a couple of other approaches that we can use as well that include adding intrinsic rewards that try to encourage it to visit new states and also trying to visit states that help you distinguish the dynamics and reward models for different tasks. So we try to collect data so that our model of rewards and states are accurate."},{"start":4108.51,"text":"And with this sort of approach, you could actually get exploration strategy that looks a lot more efficient, that looks something like this, compared to posterior sampling that's trying to kind of just sample the different trajectories for the different tasks."},{"start":4122.97,"text":"There's also scenarios where this might be bad if there's lots of distractors or really complex state dynamics. But fortunately, I don't have too much time to go over that now. So these sorts of approaches are easier to optimize than end-to-end. A lot of them have some principle behind them, but they can be very suboptimal in certain environments, and it kind of depends on the environment or the domain."}],"speech_gaps":[],"frame":"../frames/v023/025.webp","frame_time":4092.98}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v023.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
