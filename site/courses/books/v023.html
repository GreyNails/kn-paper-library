<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 13 元强化学习（Meta RL）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 13 元强化学习（Meta RL） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v023","title":"Lecture 13 元强化学习（Meta RL）","course":"强化学习","pages":[{"title":"元强化学习（Meta RL）与目标条件强化学习","segments":[{"id":0,"text":"Okay, let's get started. Cool. So as a recap of last week, we talked about multitask reinforcement learning and how we might want to have reinforcement learning agents not learn just one task, but multiple different things that might correspond to multiple different reward functions. And we saw that we can formulate an aggregated MVP that encapsulates all the different tasks where you...","start":5.2,"end":31.82},{"id":1,"text":"now are augmenting your state with some sort of task descriptor, like a prompt or a goal or just an index corresponding to what they should do. And the way that this worked is we'd sample some task, kind of run the policy in the MDP for that task, sample another task, and so forth. And we would then get a policy that could be able to successfully","start":32.19,"end":61.07},{"id":2,"text":"achieve high reward in a number of different MDPs, or in another way to view it, a single aggregated MDP with this augmented state. This is going to be a little bit different from meta-RL, so we'll see some differences here later in this lecture. And we also somewhat briefly talked about goal-conditioned reinforcement learning.","start":62.08,"end":84.76},{"id":3,"text":"It could just be simply viewed as a special case of multitask reinforcement learning, where each task is trying to reach a goal state, and the task descriptor corresponds to that goal state. And so if your states are images, for example, then now you'll be passing as input to the policy both the current image and the goal image, and you'll be trying to reach that goal image. Or if your state, for example, is a vector, you'll be passing in two vectors.","start":86.52,"end":112.18},{"id":4,"text":"And each of the tasks is trying to reach some goal state. And you can construct different reward functions if you have discrete states or continuous states as some sort of, did you kind of reach that goal or reach close to that goal? And one of the things that's kind of nice about this goal conditioned formulation of reinforcement learning is that you can actually do it in a...","start":112.96,"end":134.38},{"id":5,"text":"self-supervised way. You don't need task descriptors. You don't need a different set of tasks that you've manually defined. You can just use a bunch of different states as kind of the tasks themselves. And a lot of different tasks can be formulated as goal-reaching tasks. One thing to note here is it can be pretty hard to train, but you'll be experimenting with a simple goal-conditioned reinforcement learning setting in your homework.","start":134.94,"end":160.3}],"notes":["本段讲解了目标条件强化学习（Goal-Conditioned Reinforcement Learning）作为多任务强化学习的一个特例，其中每个任务的目标是达到某个特定状态。任务描述符对应于目标状态，输入到策略中的状态包括当前状态和目标状态。","在状态为图像的情况下，策略会同时接收当前图像和目标图像作为输入，并尝试达到目标图像。如果状态是向量，则输入两个向量，每个任务的目标是达到某个目标状态。","目标条件强化学习的一个优点是可以通过自监督的方式进行训练，不需要手动定义任务描述符或不同的任务集，而是直接使用不同的状态作为任务本身。","目标条件强化学习可以适用于离散状态或连续状态，通过构造不同的奖励函数来衡量是否达到目标或接近目标。这种形式的强化学习在训练上可能较为困难，但将在作业中进行简单实现。","目标条件强化学习与元强化学习（Meta RL）有所不同，后者关注的是学习如何快速适应新任务，而目标条件强化学习更侧重于在给定目标的情况下完成任务。","在本段中，讲者提到目标条件强化学习可以被视为一种自监督的学习方式，这为后续的元强化学习提供了基础概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":160.3,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.2,"text":"Okay, let's get started. Cool. So as a recap of last week, we talked about multitask reinforcement learning and how we might want to have reinforcement learning agents not learn just one task, but multiple different things that might correspond to multiple different reward functions. And we saw that we can formulate an aggregated MVP that encapsulates all the different tasks where you..."},{"start":32.19,"text":"now are augmenting your state with some sort of task descriptor, like a prompt or a goal or just an index corresponding to what they should do. And the way that this worked is we'd sample some task, kind of run the policy in the MDP for that task, sample another task, and so forth. And we would then get a policy that could be able to successfully"},{"start":62.08,"text":"achieve high reward in a number of different MDPs, or in another way to view it, a single aggregated MDP with this augmented state. This is going to be a little bit different from meta-RL, so we'll see some differences here later in this lecture. And we also somewhat briefly talked about goal-conditioned reinforcement learning."},{"start":86.52,"text":"It could just be simply viewed as a special case of multitask reinforcement learning, where each task is trying to reach a goal state, and the task descriptor corresponds to that goal state. And so if your states are images, for example, then now you'll be passing as input to the policy both the current image and the goal image, and you'll be trying to reach that goal image. Or if your state, for example, is a vector, you'll be passing in two vectors."},{"start":112.96,"text":"And each of the tasks is trying to reach some goal state. And you can construct different reward functions if you have discrete states or continuous states as some sort of, did you kind of reach that goal or reach close to that goal? And one of the things that's kind of nice about this goal conditioned formulation of reinforcement learning is that you can actually do it in a..."},{"start":134.94,"text":"self-supervised way. You don't need task descriptors. You don't need a different set of tasks that you've manually defined. You can just use a bunch of different states as kind of the tasks themselves. And a lot of different tasks can be formulated as goal-reaching tasks. One thing to note here is it can be pretty hard to train, but you'll be experimenting with a simple goal-conditioned reinforcement learning setting in your homework."}],"speech_gaps":[],"frame":"../frames/v023/001.webp","frame_time":17.2},{"title":"元强化学习（Meta RL）概述","segments":[{"id":6,"text":"Okay, so for today, we're going to be talking about meta-reinforcement learning, and specifically we'll be talking about what that problem statement looks like, and a class of meta-RL methods that I like to refer to as black box meta-RL methods. We'll start to get into what these methods look like and also some of the challenges that they face. So what's the problem? Why do we care about meta-RL? Why not just do vanilla RL?","start":162.01,"end":189.17},{"id":7,"text":"Say that you're trying to figure out how to operate a coffee, an espresso machine that you've never used before. If you wanted to do that,","start":190.56,"end":200.92},{"id":8,"text":"Well, first, if you wanted kind of a robot or a reinforcement learning agent to do that, it would probably take a lot of data, a lot of attempts to try to figure out how to make coffee. Because it's a pretty complicated task, lots of different steps involved. You have to do those steps in sequence. And also, the reward signal that you get for this sort of task probably isn't going to be super detailed. But as a human, if you were to attempt this task,","start":202.43,"end":228.16},{"id":9,"text":"Probably, if you had a little bit of instruction or some previous experience making espresso, then you could probably learn it in minutes, or maybe even less than a minute. So if you think about reinforcement learning, this gap between how quickly a human could learn something and how slowly it would take a reinforcement learning system to learn it, this is rather unsatisfying. And if we think about what is the difference between a person and a reinforcement learning system,","start":230.26,"end":259.97},{"id":10,"text":"One of the big differences is that people aren't starting from scratch. People already know how to move objects around with their hands. They might already know how to make coffee in other ways or with other machines. And they can leverage that experience and also some notion of semantic knowledge of what to do if someone tells you to pick up a cup and put it somewhere or to turn a knob. And it can leverage that previous experience in order to solve this problem.","start":261.39,"end":287.79},{"id":11,"text":"really, really quickly in compared to training a reinforcement learning system from scratch. And so experience with similar tasks, other espresso making machines, either espresso making on other machines or just general like motor control, following instructions, that sort of thing can be very useful when trying to solve a new task.","start":288.62,"end":308.41},{"id":12,"text":"And I mentioned this as a kind of example with espresso making, but this sort of framework of not starting from scratch is really general. So it applies to robotics problems where you're facing a new environment or facing a new task, but it's also really faced by...","start":309.49,"end":326.91}],"notes":["本段讨论了元强化学习（Meta RL）的动机，即人类在面对新任务时能够利用已有经验快速学习，而传统强化学习系统则需要大量数据和尝试。这突出了元强化学习在减少学习时间方面的优势。","讲者通过咖啡机操作的例子说明了传统强化学习的局限性，即需要大量数据和尝试才能完成复杂任务，而人类可以通过已有经验快速掌握。","讲者指出，人类在执行任务时并非从零开始，而是利用了已有的知识和经验，例如手部操作、遵循指令等，这与强化学习系统从头开始学习形成对比。","讲者强调，元强化学习的目标是让系统能够利用类似任务的经验，从而在面对新任务时更快地适应和学习。","讲者提到，这种框架不仅适用于咖啡机操作，也适用于更广泛的机器人任务和新环境，表明元强化学习具有普遍适用性。","讲者指出，元强化学习方法的一个关键点是利用先前经验，这可以显著减少新任务的学习时间，提高系统的适应能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":162.01,"end":326.91,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":162.01,"text":"Okay, so for today, we're going to be talking about meta-reinforcement learning, and specifically we'll be talking about what that problem statement looks like, and a class of meta-RL methods that I like to refer to as black box meta-RL methods. We'll start to get into what these methods look like and also some of the challenges that they face. So what's the problem? Why do we care about meta-RL? Why not just do vanilla RL?"},{"start":190.56,"text":"Say that you're trying to figure out how to operate a coffee, an espresso machine that you've never used before. If you wanted to do that,"},{"start":202.43,"text":"Well, first, if you wanted kind of a robot or a reinforcement learning agent to do that, it would probably take a lot of data, a lot of attempts to try to figure out how to make coffee. Because it's a pretty complicated task, lots of different steps involved. You have to do those steps in sequence. And also, the reward signal that you get for this sort of task probably isn't going to be super detailed. But as a human, if you were to attempt this task,"},{"start":230.26,"text":"Probably, if you had a little bit of instruction or some previous experience making espresso, then you could probably learn it in minutes, or maybe even less than a minute. So if you think about reinforcement learning, this gap between how quickly a human could learn something and how slowly it would take a reinforcement learning system to learn it, this is rather unsatisfying. And if we think about what is the difference between a person and a reinforcement learning system,"},{"start":261.39,"text":"One of the big differences is that people aren't starting from scratch. People already know how to move objects around with their hands. They might already know how to make coffee in other ways or with other machines. And they can leverage that experience and also some notion of semantic knowledge of what to do if someone tells you to pick up a cup and put it somewhere or to turn a knob. And it can leverage that previous experience in order to solve this problem."},{"start":288.62,"text":"really, really quickly in compared to training a reinforcement learning system from scratch. And so experience with similar tasks, other espresso making machines, either espresso making on other machines or just general like motor control, following instructions, that sort of thing can be very useful when trying to solve a new task."},{"start":309.49,"text":"And I mentioned this as a kind of example with espresso making, but this sort of framework of not starting from scratch is really general. So it applies to robotics problems where you're facing a new environment or facing a new task, but it's also really faced by..."}],"speech_gaps":[],"frame":"../frames/v023/002.webp","frame_time":174.01},{"title":"元强化学习（Meta RL）的概念与迁移学习","segments":[{"id":13,"text":"many reinforcement learning systems. As another example, say you want to solve a challenging math problem that you haven't solved before. If you have experience solving previous math problems, then you can use that to more quickly solve a new problem because you've learned some sort of strategies that you might be able to apply to the new scenario. Okay. We're framing this question of can reinforcement learning algorithms leverage experience from previous tasks?","start":327.56,"end":352.95},{"id":14,"text":"in order to learn a new task with less data and less experience. In many ways, this problem is thought of as a transfer learning problem, where we want to transfer knowledge and information experience from previous tasks to new tasks. And there's a few different formulations and a few different kind of problem settings that the research community has thought about. One is...","start":353.72,"end":380.45},{"id":15,"text":"Kind of a fairly simple setup where you learn one task and then want to learn a new task. And you can just, for example, train on one task and then fine-tune on the new task. And notions of fine-tuning that we use in supervised learning are also applicable to reinforcement learning settings, where you could fine-tune a Q function to a new task or fine-tune a policy to a new task. Although, for this to work well, the tasks need to be quite similar to each other.","start":382.22,"end":408.87},{"id":16,"text":"We also talked about multitask learning, and you could also use multitask learning for transfer to new tasks. And in particular, if your task, if your prompt shares some structure, if it kind of exhibits, if it's just like a task one, task two, task three, transfer is going to be harder. But if it's something that has a lot of structure, like pick up a water bottle, pick up a phone, pick up a pen, and so forth, then...","start":411.05,"end":436.47},{"id":17,"text":"you might actually be able to have things transfer what's called zero-shot without any new experience at all, simply by passing that prompt to the system and having it kind of act according to that prompt. And then meta-learning is often concerned with, instead of zero-shot transfer, something that's called few-shot transfer, where with a little bit of experience, a few examples, or a few trials of the task, can you adapt to that task?","start":437.06,"end":466.67},{"id":18,"text":"And essentially the difference between multitask learning and meta-learning is that it accounts for the fact that we're going to be trying to adapt with a small amount of data. And it does that during the kind of original training process. And another way of thinking about this is that instead of having the task descriptor be like a prompt or an index, the task descriptor might actually be a data set itself, like a set of trials that you're going to be adapting to in the context of some policy.","start":468.77,"end":496.53},{"id":19,"text":"Another word for this is sometimes in context learning or few-shot learning. Now for this to work, for the first scenario to work, you must have very similar source and target tasks.","start":497.64,"end":505.89}],"notes":["本段讨论了迁移学习在强化学习中的应用，特别是如何利用先前任务的经验来加速新任务的学习。讲者以解决数学问题为例，说明经验如何帮助快速适应新问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":327.56,"end":505.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":327.56,"text":"many reinforcement learning systems. As another example, say you want to solve a challenging math problem that you haven't solved before. If you have experience solving previous math problems, then you can use that to more quickly solve a new problem because you've learned some sort of strategies that you might be able to apply to the new scenario. Okay. We're framing this question of can reinforcement learning algorithms leverage experience from previous tasks?"},{"start":353.72,"text":"in order to learn a new task with less data and less experience. In many ways, this problem is thought of as a transfer learning problem, where we want to transfer knowledge and information experience from previous tasks to new tasks. And there's a few different formulations and a few different kind of problem settings that the research community has thought about. One is..."},{"start":382.22,"text":"Kind of a fairly simple setup where you learn one task and then want to learn a new task. And you can just, for example, train on one task and then fine-tune on the new task. And notions of fine-tuning that we use in supervised learning are also applicable to reinforcement learning settings, where you could fine-tune a Q function to a new task or fine-tune a policy to a new task. Although, for this to work well, the tasks need to be quite similar to each other."},{"start":411.05,"text":"We also talked about multitask learning, and you could also use multitask learning for transfer to new tasks. And in particular, if your task, if your prompt shares some structure, if it kind of exhibits, if it's just like a task one, task two, task three, transfer is going to be harder. But if it's something that has a lot of structure, like pick up a water bottle, pick up a phone, pick up a pen, and so forth, then..."},{"start":437.06,"text":"you might actually be able to have things transfer what's called zero-shot without any new experience at all, simply by passing that prompt to the system and having it kind of act according to that prompt. And then meta-learning is often concerned with, instead of zero-shot transfer, something that's called few-shot transfer, where with a little bit of experience, a few examples, or a few trials of the task, can you adapt to that task?"},{"start":468.77,"text":"And essentially the difference between multitask learning and meta-learning is that it accounts for the fact that we're going to be trying to adapt with a small amount of data. And it does that during the kind of original training process. And another way of thinking about this is that instead of having the task descriptor be like a prompt or an index, the task descriptor might actually be a data set itself, like a set of trials that you're going to be adapting to in the context of some policy."},{"start":497.64,"text":"Another word for this is sometimes in context learning or few-shot learning. Now for this to work, for the first scenario to work, you must have very similar source and target tasks."}],"speech_gaps":[],"frame":"../frames/v023/003.webp","frame_time":339.56},{"title":"元强化学习（Meta RL）中的少样本学习概念","segments":[{"id":20,"text":"Whereas in some ways, things get a little bit easier and a little bit harder for number two and number three. They get easier in the sense that you no longer have to have an extremely similar task. You instead just need to have a distribution of tasks and be similar to that distribution, such that conceivably the new task that you're trying to solve should be within the distribution of the tasks that you've seen during training.","start":507.05,"end":530.55},{"id":21,"text":"It gets a little bit harder because you do actually need a number of training tasks, not just a single training task, in order to get effective transfer. Okay. Before we jump into meta-RL, let's just look at a couple of few-shot learning examples outside of RL, and then go back to the RL setting. So actually, I picked this example just so that it's not trivial. There's other test data points that are much, much easier.","start":531.95,"end":556.08},{"id":22,"text":"Cool. So that's kind of the essence of a few shot image classification problem, where you have a small number of data points, and your goal is to classify a new data point.","start":556.61,"end":565.07},{"id":23,"text":"And typically, if you were to train from scratch on just six images, you'd have no hope of being able to learn a classifier, especially on high-dimensional images. But the way that meta-learning works is you can construct other tasks for the machine learning system to solve that have a similar structure, like other image classification tasks, train it to be able to take as input a training data set and a query image.","start":567.2,"end":590.54},{"id":24,"text":"or our test input and then predict a label and basically constructing each of these few-shot learning problems as a data point themselves. Now, another example of few-shot learning outside of reinforcement learning is in-context learning in large language models.","start":591.43,"end":610.17},{"id":25,"text":"And what this looks like is, here's just one example. There's lots of examples of different tasks you could do. In this case, the goal is given a sentence that's kind of poor English input, like I eated the purple berries. Output, good English input, like I ate the purple berries. It gives it, in this case, I think, four or three different examples of input outputs.","start":610.81,"end":633.13},{"id":26,"text":"This is the training data set, and the goal is for a new input to be able to predict a good output for that example. So here's another example of a few-shot learning problem. And again, language models get things that kind of look like this during training. One thing that's a little bit special about language models is that this sort of in-context learning","start":634.21,"end":654.69},{"id":27,"text":"You don't explicitly set up your training data set exactly to match all of this. And it turns out that a lot of the statistics of data on the internet leads to this ability to react to these few-shot examples effectively. This is actually just a base model. I think this is from GPT-3. And so even without any additional supervised training, you get something like this. It's not perfect. It doesn't work all the time. But this is another example of few-shot learning.","start":655.32,"end":681.78}],"notes":["本段讲解了元强化学习（Meta RL）中少样本学习（few-shot learning）的基本概念，强调了在元学习中，模型需要处理多个任务，而不是单一任务，以实现有效的迁移学习。这与传统强化学习不同，传统方法通常需要大量数据来学习一个特定任务。","讲者通过图像分类和语言模型中的例子，说明了少样本学习的典型应用场景。在图像分类中，模型需要在少量样本的情况下学习分类器，而在语言模型中，模型通过上下文学习（in-context learning）来完成任务。","讲者提到，语言模型在训练过程中会接触到大量数据，这些数据的统计特性使得模型能够有效地处理少量示例。这种能力并不依赖于额外的监督训练，而是基于模型在训练过程中学到的通用模式。","讲者指出，虽然这种少样本学习方法在某些情况下表现良好，但它并不是完美的，有时可能无法正确处理所有情况。这表明，尽管少样本学习在某些任务中非常有效，但仍然存在局限性。","讲者通过具体的例子，如将错误的英文句子转换为正确的句子，展示了语言模型如何利用上下文信息进行预测。这种能力是语言模型在训练过程中自然获得的，而不是通过显式的任务设计。","讲者强调，少样本学习的核心在于模型能够从少量示例中提取通用的模式，并将其应用于新的任务。这种能力使得模型在面对新任务时，不需要大量的训练数据，从而提高了学习效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":507.05,"end":681.78,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":507.05,"text":"Whereas in some ways, things get a little bit easier and a little bit harder for number two and number three. They get easier in the sense that you no longer have to have an extremely similar task. You instead just need to have a distribution of tasks and be similar to that distribution, such that conceivably the new task that you're trying to solve should be within the distribution of the tasks that you've seen during training."},{"start":531.95,"text":"It gets a little bit harder because you do actually need a number of training tasks, not just a single training task, in order to get effective transfer. Okay. Before we jump into meta-RL, let's just look at a couple of few-shot learning examples outside of RL, and then go back to the RL setting. So actually, I picked this example just so that it's not trivial. There's other test data points that are much, much easier."},{"start":556.61,"text":"Cool. So that's kind of the essence of a few shot image classification problem, where you have a small number of data points, and your goal is to classify a new data point."},{"start":567.2,"text":"And typically, if you were to train from scratch on just six images, you'd have no hope of being able to learn a classifier, especially on high-dimensional images. But the way that meta-learning works is you can construct other tasks for the machine learning system to solve that have a similar structure, like other image classification tasks, train it to be able to take as input a training data set and a query image."},{"start":591.43,"text":"or our test input and then predict a label and basically constructing each of these few-shot learning problems as a data point themselves. Now, another example of few-shot learning outside of reinforcement learning is in-context learning in large language models."},{"start":610.81,"text":"And what this looks like is, here's just one example. There's lots of examples of different tasks you could do. In this case, the goal is given a sentence that's kind of poor English input, like I eated the purple berries. Output, good English input, like I ate the purple berries. It gives it, in this case, I think, four or three different examples of input outputs."},{"start":634.21,"text":"This is the training data set, and the goal is for a new input to be able to predict a good output for that example. So here's another example of a few-shot learning problem. And again, language models get things that kind of look like this during training. One thing that's a little bit special about language models is that this sort of in-context learning"},{"start":655.32,"text":"You don't explicitly set up your training data set exactly to match all of this. And it turns out that a lot of the statistics of data on the internet leads to this ability to react to these few-shot examples effectively. This is actually just a base model. I think this is from GPT-3. And so even without any additional supervised training, you get something like this. It's not perfect. It doesn't work all the time. But this is another example of few-shot learning."}],"speech_gaps":[],"frame":"../frames/v023/004.webp","frame_time":519.05},{"title":"元强化学习（Meta RL）中的快速适应与训练数据构建","segments":[{"id":28,"text":"And then in each of these examples, you can think of the goal as trying to train this sort of model that takes as input a training dataset and a new example X and makes a prediction for that example based on both X and on the training data.","start":683.57,"end":699.14},{"id":29,"text":"Yeah, so the question is, in context learning in LLMs, typically you achieve this sort of model and this sort of few-shot learning through prompting by putting the data set in as context or as part of the prompt into the model. Is that also how it works in meta-RL? Generally, yes, we're going to be looking at that case in meta-RL. There are actually other methods where you can accomplish this with...","start":700.0,"end":722.32},{"id":30,"text":"well, actually with gradient updates as well, or with something that looks like nearest neighbors, the most successful method in meta-RL looks like prompting. And so that's what we'll be talking about today. Now let's look at a meta-RL example. So say that we want to navigate mazes. And so our goal is we want to solve a new maze.","start":722.58,"end":749.68},{"id":31,"text":"And we're an agent that's in this maze. We actually don't even see this top-down view. Maybe we just have a first-person perspective. And our goal is, because this is a reinforcement learning problem, it's not just about outputting a label. It's actually also about collecting experience in the environment. And so...","start":751.8,"end":769.2},{"id":32,"text":"Kind of the goal is we'd like to be able to very quickly solve a reinforcement learning problem. And we'll frame this as collecting a very small training data set of one episode or a few episodes. In this case, it's kind of exploring the maze, trying to find where the goal is. And eventually, it kind of starts in the middle right here, explores over here, and eventually goes to the goal right here.","start":769.94,"end":790.28},{"id":33,"text":"After we explore, we'd like to be able to have a policy that is able to solve the maze. In this case, just with a single episode of experience. Again, if you were to do this sort of thing from scratch, that tries to use just a single episode of experience to get a policy that can solve the task, this would be very, very hard.","start":793.05,"end":813.13},{"id":34,"text":"Instead, the way that meta-RL frames this is by trying to construct examples and try to construct a set of training environments that facilitates this fast adaptation. Now, in comparison to the supervised learning scenarios, like I mentioned, we're now going to be faced with this exploration problem. We're not just given a training dataset and then make a prediction based on that training dataset. We're actually constructing the training dataset ourselves.","start":813.86,"end":841.79}],"notes":["本段讨论了元强化学习（Meta RL）中快速适应的问题，强调了与大型语言模型（LLMs）中的上下文学习和少样本学习的相似性。在LLMs中，通常通过提示（prompting）将数据集作为上下文或提示的一部分输入模型，以实现模型的快速学习。在Meta RL中，虽然也有类似的方法，但更强调通过构造训练环境和示例来实现快速适应。","在Meta RL中，目标是通过收集少量的训练数据（如一个或几个episode）来快速解决任务。例如，在迷宫导航任务中，智能体需要通过探索迷宫来找到目标。这种探索过程类似于在监督学习中使用少量数据进行预测，但Meta RL需要智能体自己构造训练数据。","在Meta RL中，构造训练数据的过程涉及构建多个训练环境，以帮助智能体快速适应新的任务。这与监督学习不同，因为监督学习通常直接提供训练数据，而Meta RL需要智能体自己探索并收集数据。","Meta RL的一个关键挑战是探索问题。智能体需要在环境中进行探索，以收集足够的经验来构建有效的策略。这与传统的监督学习不同，后者通常假设训练数据已经存在。","在Meta RL中，快速适应意味着智能体能够在极短的时间内利用少量经验来解决新的任务。这需要智能体具备强大的泛化能力，能够从有限的数据中学习到有效的策略。","Meta RL的框架强调了构造训练环境和示例的重要性，以促进智能体的快速适应。这种方法与传统的监督学习不同，后者通常依赖于固定的训练数据集。"],"formulas":[],"uncertainties":[],"diagram":"none","start":683.57,"end":841.79,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":683.57,"text":"And then in each of these examples, you can think of the goal as trying to train this sort of model that takes as input a training dataset and a new example X and makes a prediction for that example based on both X and on the training data."},{"start":700.0,"text":"Yeah, so the question is, in context learning in LLMs, typically you achieve this sort of model and this sort of few-shot learning through prompting by putting the data set in as context or as part of the prompt into the model. Is that also how it works in meta-URL? Generally, yes, we're going to be looking at that case in meta-URL. There are actually other methods where you can accomplish this with..."},{"start":722.58,"text":"well, actually with gradient updates as well, or with something that looks like nearest neighbors, the most successful method in meta-RL looks like prompting. And so that's what we'll be talking about today. Now let's look at a meta-RL example. So say that we want to navigate mazes. And so our goal is we want to solve a new maze."},{"start":751.8,"text":"And we're an agent that's in this maze. We actually don't even see this top-down view. Maybe we just have a first-person perspective. And our goal is, because this is a reinforcement learning problem, it's not just about outputting a label. It's actually also about collecting experience in the environment. And so..."},{"start":769.94,"text":"Kind of the goal is we'd like to be able to very quickly solve a reinforcement learning problem. And we'll frame this as collecting a very small training data set of one episode or a few episodes. In this case, it's kind of exploring the maze, trying to find where the goal is. And eventually, it kind of starts in the middle right here, explores over here, and eventually goes to the goal right here."},{"start":793.05,"text":"After we explore, we'd like to be able to have a policy that is able to solve the maze. In this case, just with a single episode of experience. Again, if you were to do this sort of thing from scratch, that tries to use just a single episode of experience to get a policy that can solve the task, this would be very, very hard."},{"start":813.86,"text":"Instead, the way that meta-oral frames this is by trying to construct examples and try to construct a set of training environments that facilitates this fast adaptation. Now, in comparison to the supervised learning scenarios, like I mentioned, we're now going to be faced with this exploration problem. We're not just given a training dataset and then make a prediction based on that training dataset. We're actually constructing the training dataset ourselves."}],"speech_gaps":[],"frame":"../frames/v023/005.webp","frame_time":695.57},{"title":"元强化学习（Meta RL）的基本概念与应用场景","segments":[{"id":35,"text":"through exploration. And we need to figure out how best to trade off between exploring in the environment versus being able to then solve the task. And how much time we should spend exploring versus trying to exploit what we know about the environment. So this is our goal. This is what we'd like to be able to do at test time. We'd like to be able to quickly learn a new maze.","start":843.2,"end":868.16},{"id":36,"text":"Then to set our agent up for success at meta training time, before we try to adapt to a new maze, we'll try to learn how to efficiently explore and solve many other MDPs that are related. In this case, they can be other mazes like this and so forth. And these are each of the tasks that we'll be training on in order to adapt to a new maze.","start":869.23,"end":891.93},{"id":37,"text":"The other thing, I guess one key assumption here is that you need to have, like these new MDPs can't be completely different from the MDPs that you saw before. And the way that we can think about that is we should have some sort of distribution over tasks. And these new MDPs that we're trying to adapt to should be within the distribution of tasks that we saw during training.","start":895.52,"end":919.96},{"id":38,"text":"Maze navigation is like one example of a meta-RL task. There's lots of other scenarios as well. So one useful scenario that we've seen in robotics is being able to adapt very quickly to different trains, different slopes for legged robot systems. This is actually a really small legged robot.","start":922.86,"end":945.12},{"id":39,"text":"But it's also applicable to larger robots as well. And sometimes you might actually be training on different environments in simulation and then adapting in the real world as just another environment.","start":947.01,"end":958.11},{"id":40,"text":"You could also have object manipulation as different tasks as well in manipulation scenarios. And then there's also a number of language modeling scenarios where this is quite applicable. One example where meta-RL has been relevant is adapting to different users with different preferences, where you give examples of the kinds of things, the kinds of responses that they want in context.","start":959.98,"end":986.78},{"id":41,"text":"And we'll also later see an example in reasoning as well. Yeah, so the question is, what is the key difference between... this sort of meta-RL approach and transfer learning where you're training and then fine-tuning. And there's a couple of ways to view it. One is that during this kind of training process, you're actually explicitly optimizing for transferability. You're optimizing for the ability to adapt with a small data set.","start":987.24,"end":1006.5}],"notes":["本段主要讨论元强化学习（Meta RL）的基本假设，即新任务不能与训练时遇到的任务完全不同，而是应属于训练任务的分布范围内。这种假设确保了模型在面对新任务时能够有效迁移知识。","元强化学习的应用场景包括机器人导航、物体操作、语言建模和推理等。例如，在机器人领域，元强化学习可以用于快速适应不同地形或不同类型的机器人系统。","与迁移学习相比，元强化学习强调在训练过程中显式优化迁移能力，特别是在小数据集上进行适应。这种优化目标使得模型在面对新任务时能够更高效地学习。","在语言建模中，元强化学习可以用于适应不同用户的偏好，通过提供用户期望的响应示例来调整模型行为。","元强化学习的核心思想是通过在多个相关任务上进行训练，使模型具备快速适应新任务的能力，而不仅仅是单个任务的优化。","元强化学习与迁移学习的关键区别在于，前者在训练过程中直接优化迁移能力，而后者通常是在训练后进行微调。"],"formulas":[],"uncertainties":[],"diagram":"none","start":843.2,"end":1006.5,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":843.2,"text":"through exploration. And we need to figure out how best to trade off between exploring in the environment versus being able to then solve the task. And how much time we should spend exploring versus trying to exploit what we know about the environment. So this is our goal. This is what we'd like to be able to do at test time. We'd like to be able to quickly learn a new maze."},{"start":869.23,"text":"Then to set our agent up for success at meta training time, before we try to adapt to a new maze, we'll try to learn how to efficiently explore and solve many other MDPs that are related. In this case, they can be other mazes like this and so forth. And these are each of the tasks that we'll be training on in order to adapt to a new maze."},{"start":895.52,"text":"Cool. The other thing, I guess one key assumption here is that you need to have, like these new MDPs can't be completely different from the MDPs that you saw before. And the way that we can think about that is we should have some sort of distribution over tasks. And these new MDPs that we're trying to adapt to should be within the distribution of tasks that we saw during training. Okay."},{"start":922.86,"text":"Maze navigation is like one example of a meta-RL task. There's lots of other scenarios as well. So one useful scenario that we've seen in robotics is being able to adapt very quickly to different trains, different slopes for legged robot systems. This is actually a really small legged robot."},{"start":947.01,"text":"But it's also applicable to larger robots as well. And sometimes you might actually be training on different environments in simulation and then adapting in the real world as just another environment."},{"start":959.98,"text":"You could also have object manipulation as different tasks as well in manipulation scenarios. And then there's also a number of language modeling scenarios where this is quite applicable. One example where meta-URL has been relevant is adapting to different users with different preferences, where you give examples of the kinds of things, the kinds of responses that they want in context. And we'll also later see an example in reasoning as well. Yeah, so the question is, what is the key difference between..."},{"start":987.24,"text":"this sort of meta-RL approach and transfer learning where you're training and then fine-tuning. And there's a couple of ways to view it. One is that during this kind of training process, you're actually explicitly optimizing for transferability. You're optimizing for the ability to adapt with a small data set."}],"speech_gaps":[],"frame":"../frames/v023/006.webp","frame_time":855.2},{"title":"元强化学习（Meta RL）的概念与任务设定","segments":[{"id":42,"text":"And as a result of that, you can get much faster transfer. You can use a much smaller data set. And there are examples of like if you use fine tuning versus if you use like few shot in context learning or a few shot adaptation, you can get much more efficient transfer. And yeah, so you get much greater efficiency. And the way that you get that is by providing the algorithm with.","start":1007.0,"end":1032.7},{"id":43,"text":"a number of different training tasks rather than just one training task that you're feeding off of. Okay. So slightly more formally, we've talked about multitask learning where you try to solve multiple tasks at once. You might try to transfer to a new task from that, but you're not optimizing for transferability. With transfer learning, you're trying to solve some target task after solving some source task, typically by fine-tuning.","start":1033.45,"end":1062.15},{"id":44,"text":"Whereas in the meta-learning problem, we have experience from some training tasks, and we want to very quickly solve a new task.","start":1063.0,"end":1072.3},{"id":45,"text":"And in the reinforcement learning scenario, these tasks are going to be MDPs, each with their own state-space actions-based dynamics reward. And there is this kind of nice, we see kind of meta-learning and supervised learning, and there's also this kind of a nice analogy between the two, where the main difference with meta-URL is this exploration challenge. Okay. And then...","start":1074.09,"end":1100.15},{"id":46,"text":"Diving into some notation here, we can view the meta-RL problem as basically being able to, with a small amount of experience, be able to learn a policy that can solve the task, and also to be able to collect this experience itself. And so this training data, there's two different variants of the meta-RL problem. In the first case, this can correspond to multiple rollouts from some exploration policy.","start":1100.64,"end":1128.73},{"id":47,"text":"And instead, you could also consider this to be just actually a few time steps from your exploration policy. There's a bit of a continuum between these two scenarios. You might want to be able to adapt both online with a few time steps and with more and more episodes with basically kind of a growing data set. But writing it kind of explicitly as two different things here to kind of...","start":1130.66,"end":1155.7},{"id":48,"text":"make it clear that there are some problem settings where you want to adapt really quickly online within an episode and other scenarios where you're caring a lot more about kind of multiple trials of experience. The last thing that I'll mention is I've been writing it as a kind of an exploration policy and a task policy. There are some scenarios where you might train these and these might be separate networks. There's other scenarios where these could share parameters and basically be the same network.","start":1156.85,"end":1181.71}],"notes":["本段介绍了元强化学习（Meta RL）的基本概念，强调其与传统迁移学习和多任务学习的区别。元强化学习的目标是通过少量经验快速适应新任务，而迁移学习则是在解决源任务后，通过微调解决目标任务。多任务学习则是在同时解决多个任务时，不特别优化迁移能力。","讲者提到在强化学习场景中，任务通常以马尔可夫决策过程（MDP）的形式存在，每个任务都有其独特的状态空间、动作空间、动态和奖励函数。元学习与监督学习之间存在类比关系，但元学习的核心挑战在于探索问题。","在元强化学习的符号表示中，讲者指出元学习问题可以被看作是通过少量经验学习一个能够解决任务的策略，并且能够收集自身经验。训练数据有两种变体：一种是来自探索策略的多个轨迹，另一种是仅来自探索策略的少量时间步。","讲者提到这两种情况之间存在连续性，即可以在一个episode内快速适应，也可以通过越来越多的episode积累经验。这种区分有助于明确不同问题设置下的适应需求。","最后，讲者提到元强化学习中通常涉及探索策略和任务策略，这两个策略可能由不同的网络组成，也可能共享参数，即使用同一个网络。","讲者强调元强化学习的关键在于如何利用少量经验快速适应新任务，这与传统迁移学习和多任务学习的核心目标不同，后者更关注于同时解决多个任务或从源任务迁移到目标任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1007.0,"end":1181.71,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1007.0,"text":"And as a result of that, you can get much faster transfer. You can use a much smaller data set. And there are examples of like if you use fine tuning versus if you use like few shot in context learning or a few shot adaptation, you can get much more efficient transfer. And yeah, so you get much greater efficiency. And the way that you get that is by providing the algorithm with."},{"start":1033.45,"text":"a number of different training tasks rather than just one training task that you're feeding off of. Okay. So slightly more formally, we've talked about multitask learning where you try to solve multiple tasks at once. You might try to transfer to a new task from that, but you're not optimizing for transferability. With transfer learning, you're trying to solve some target task after solving some source task, typically by fine-tuning."},{"start":1063.0,"text":"Whereas in the meta-learning problem, we have experience from some training tasks, and we want to very quickly solve a new task."},{"start":1074.09,"text":"And in the reinforcement learning scenario, these tasks are going to be MDPs, each with their own state-space actions-based dynamics reward. And there is this kind of nice, we see kind of meta-learning and supervised learning, and there's also this kind of a nice analogy between the two, where the main difference with meta-URL is this exploration challenge. Okay. And then..."},{"start":1100.64,"text":"Diving into some notation here, we can view the meta-RL problem as basically being able to, with a small amount of experience, be able to learn a policy that can solve the task, and also to be able to collect this experience itself. And so this training data, there's two different variants of the meta-RL problem. In the first case, this can correspond to multiple rollouts from some exploration policy."},{"start":1130.66,"text":"And instead, you could also consider this to be just actually a few time steps from your exploration policy. There's a bit of a continuum between these two scenarios. You might want to be able to adapt both online with a few time steps and with more and more episodes with basically kind of a growing data set. But writing it kind of explicitly as two different things here to kind of..."},{"start":1156.85,"text":"make it clear that there are some problem settings where you want to adapt really quickly online within an episode and other scenarios where you're caring a lot more about kind of multiple trials of experience. The last thing that I'll mention is I've been writing it as a kind of an exploration policy and a task policy. There are some scenarios where you might train these and these might be separate networks. There's other scenarios where these could share parameters and basically be the same network."}],"speech_gaps":[],"frame":"../frames/v023/007.webp","frame_time":1019.0},{"title":"元强化学习（Meta RL）中的任务分布与序列模型","segments":[{"id":49,"text":"They don't necessarily need to be separated like they are on this slide. And then the last thing is, insofar as we're learning this policy that's conditioning on a training dataset, you can sort of view this as a task identifier. And from that standpoint, we're then kind of more in a setting that looks like multitask learning.","start":1183.33,"end":1203.72},{"id":50,"text":"So the question is, when I say that the test task should be in distribution compared to the training task,","start":1204.85,"end":1209.51},{"id":51,"text":"does that mean it has to be the same as one of the training tasks, or can it be a bit different?","start":1209.61,"end":1213.01},{"id":52,"text":"It can be a bit different.","start":1213.25,"end":1214.41},{"id":53,"text":"And we'll see examples where it is different as well.","start":1216.01,"end":1219.11},{"id":54,"text":"So let's talk about how to address these problems.","start":1221.45,"end":1223.53},{"id":55,"text":"So the good news is that there's kind of a very conceptually simple way to address this kind of general problem.","start":1223.67,"end":1234.65},{"id":56,"text":"statement. The bad news is that it can be challenging to optimize in practice, and we'll","start":1234.85,"end":1239.01},{"id":57,"text":"talk about some of those challenges in a bit. But conceptually, we can essentially train a sequence","start":1239.01,"end":1247.93},{"id":58,"text":"model. It could be a transformer, any sort of neural network with memory, a recurrent neural","start":1247.93,"end":1253.33},{"id":59,"text":"network, and use this where basically everything that's being passed into this policy corresponds","start":1253.33,"end":1261.57},{"id":60,"text":"responds to the experience that the agent has collected.","start":1261.57,"end":1264.35},{"id":61,"text":"So you're basically conditioning your policy","start":1266.05,"end":1268.17},{"id":62,"text":"on this training data set and then having a policy output","start":1268.17,"end":1271.95},{"id":63,"text":"actions based off of the data that it's","start":1271.95,"end":1275.07},{"id":64,"text":"seen so far in that MDP and then training this sequence model","start":1275.07,"end":1282.07},{"id":65,"text":"policy across all of the set of training MDPs that we have.","start":1282.89,"end":1288.81},{"id":66,"text":"So here, this is the current state. This sort of context or training data set is going to get","start":1289.45,"end":1295.51},{"id":67,"text":"larger over time as we collect more experience in a given MDP. Now a question for you. There","start":1295.51,"end":1308.37},{"id":68,"text":"are a couple differences between this and simply using a recurrent policy in a standard RL set.","start":1308.37,"end":1315.29},{"id":69,"text":"or using a sequence model in a standard RL setup, like using a transformer. Does anyone have thoughts on what are some of the differences between what I'm starting to talk about here and simply using a sequence model as your policy in a standard RL setup? Memory. Yeah, so typically in...","start":1317.04,"end":1339.87},{"id":70,"text":"In RL, we often don't use memory, and here we're using memory. So that's one thing. But compared to if we had used memory in a standard RL setup, what else is different here? Yeah, so one thing that we're doing here is we're actually passing the reward as input into the memory. And that's a little bit different.","start":1341.09,"end":1359.8}],"notes":["本段讨论了元强化学习（Meta RL）中任务分布与序列模型的应用。讲者指出，元策略可以被视为任务标识符，从而将问题转化为多任务学习的框架。在任务分布方面，测试任务可以与训练任务略有不同，但需保持一定的分布一致性。讲者提到，解决这类问题的方法是训练一个序列模型，如Transformer或循环神经网络，将代理的经验作为输入，从而生成策略输出。","讲者进一步比较了当前讨论的序列模型与标准强化学习中使用序列模型（如Transformer）的差异。主要区别在于当前方法中使用了记忆，并且将奖励作为输入传递给记忆，这与标准设置中的做法不同。","讲者强调，这种序列模型的训练方式需要在所有训练的马尔可夫决策过程（MDPs）上进行，同时随着经验的积累，训练数据集会逐渐变大。这表明模型需要具备良好的泛化能力，以适应不同任务的分布变化。","讲者通过提问引导学生思考当前方法与标准序列模型应用的差异，特别是关于记忆的使用和奖励输入的处理方式。这表明课程注重概念理解与实际应用的结合。","讲者提到，虽然这种方法在概念上简单，但在实践中优化可能具有挑战性，这为后续讨论可能遇到的困难埋下伏笔。","整体来看，本段内容聚焦于元强化学习中任务分布与序列模型的结合，强调了记忆的使用和奖励输入的处理方式，为后续深入讨论提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1183.33,"end":1359.8,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1183.33,"text":"They don't necessarily need to be separated like they are on this slide. And then the last thing is, insofar as we're learning this policy that's conditioning on a training dataset, you can sort of view this as a task identifier. And from that standpoint, we're then kind of more in a setting that looks like multitask learning."},{"start":1204.85,"text":"So the question is, when I say that the test task should be in distribution compared to the training task,"},{"start":1209.61,"text":"does that mean it has to be the same as one of the training tasks, or can it be a bit different?"},{"start":1213.25,"text":"It can be a bit different."},{"start":1216.01,"text":"And we'll see examples where it is different as well."},{"start":1221.45,"text":"So let's talk about how to address these problems."},{"start":1223.67,"text":"So the good news is that there's kind of a very conceptually simple way to address this kind of general problem."},{"start":1234.85,"text":"statement. The bad news is that it can be challenging to optimize in practice, and we'll"},{"start":1239.01,"text":"talk about some of those challenges in a bit. But conceptually, we can essentially train a sequence"},{"start":1247.93,"text":"model. It could be a transformer, any sort of neural network with memory, a recurrent neural"},{"start":1253.33,"text":"network, and use this where basically everything that's being passed into this policy corresponds"},{"start":1261.57,"text":"responds to the experience that the agent has collected."},{"start":1266.05,"text":"So you're basically conditioning your policy"},{"start":1268.17,"text":"on this training data set and then having a policy output"},{"start":1271.95,"text":"actions based off of the data that it's"},{"start":1275.07,"text":"seen so far in that MDP and then training this sequence model"},{"start":1282.89,"text":"policy across all of the set of training MDPs that we have."},{"start":1289.45,"text":"So here, this is the current state. This sort of context or training data set is going to get"},{"start":1295.51,"text":"larger over time as we collect more experience in a given MDP. Now a question for you. There"},{"start":1308.37,"text":"are a couple differences between this and simply using a recurrent policy in a standard RL set."},{"start":1317.04,"text":"or using a sequence model in a standard RL setup, like using a transformer. Does anyone have thoughts on what are some of the differences between what I'm starting to talk about here and simply using a sequence model as your policy in a standard RL setup? Memory. Yeah, so typically in..."},{"start":1341.09,"text":"In RL, we often don't use memory, and here we're using memory. So that's one thing. But compared to if we had used memory in a standard RL setup, what else is different here? Yeah, so one thing that we're doing here is we're actually passing the reward as input into the memory. And that's a little bit different."}],"speech_gaps":[],"frame":"../frames/v023/008.webp","frame_time":1195.33},{"title":"元强化学习（Meta RL）的差异与训练方法","segments":[{"id":71,"text":"in the sense that you're actually using reward information from the current MVP in order to try to get better at the task. This also means that actually at test time, or when we're trying to adapt to a new task, we're also going to be using the reward. And in RL settings, oftentimes we don't necessarily assume that we have the reward when we're just deploying our policy. So that was kind of one main difference. Any other differences?","start":1360.99,"end":1387.44},{"id":72,"text":"Yeah. So the question is, why are we also not passing as input the actions? You can pass as input the actions. It depends on, like, if your policy is mostly deterministic, then information about past actions could be stored in the memory as well, because you were predicting, you generated those actions. And so in those cases, you don't need the actions. If you have a more stochastic policy, then that sampling process won't be necessarily in the memory. And in those cases, it's good to pass as input the actions as well.","start":1389.07,"end":1417.35},{"id":73,"text":"Right. So the note was that the states and actions might not be the same for different tasks. And so one of the things that's different here is we're actually training this model across MDPs. And so you might have a different state and action space. You might have different dynamics. And so because one of the big differences compared to standard RL is that we're actually, yeah, we're training this across MDPs. And there's going to be differences in states, actions, dynamics, and rewards across those MDPs.","start":1418.57,"end":1444.89},{"id":74,"text":"Cool. There's actually also one other difference. But the first thing that we talked about is see that the reward is passed as input. You might also be passing as input actions. And this is trained across multiple MDPs. And that's quite different from the typical reinforcement learning setup. Now, the second thing that's also different is that your memory is also going to span across multiple episodes, potentially. If you're trying to actually learn... ","start":1445.9,"end":1472.68},{"id":75,"text":"not just within an episode but learn across episodes, then rather than having your current policy simply have memory within an episode, you will be maintaining any sort of hidden state or any sort of memory, not just within your episode but across multiple episodes. So in terms of what this algorithm, maybe I'll leave this up here in case it's useful. In terms of the algorithm, what this looks like is we will sample","start":1473.86,"end":1500.96},{"id":76,"text":"a task or an MDP. So maybe let's call this MDP TI. And then we're going to run our policy in that MDP for multiple episodes. So let's say run pi in our task or MDP for","start":1502.16,"end":1529.93}],"notes":["本段讨论了元强化学习（Meta RL）与标准强化学习（RL）之间的主要差异，特别是在输入信息和训练方式上的不同。在元强化学习中，奖励信息被作为输入传递，这与标准RL不同，因为在标准RL中，部署策略时通常不假设有奖励信息。此外，元强化学习还涉及在多个MDPs上进行训练，这意味着状态空间、动作空间、动态和奖励可能各不相同。","在元强化学习中，是否将动作作为输入取决于策略的确定性。如果策略是确定性的，过去动作的信息可以存储在记忆中，因此不需要将动作作为输入。如果策略是随机的，那么采样过程可能不会存储在记忆中，此时将动作作为输入是有益的。","元强化学习的一个关键差异是记忆不仅限于单个episode，而是可以跨多个episode。这意味着策略在学习过程中需要维护隐藏状态或记忆，以适应不同任务的长期学习需求。","在算法实现上，元强化学习通常涉及从多个MDPs中采样任务，并在这些任务上运行策略进行多个episode的训练。这种训练方式与标准RL不同，后者通常在一个固定的MDP上进行训练。","元强化学习的训练过程强调跨任务的适应能力，这需要模型能够从多个任务中学习并泛化到新的任务。这种泛化能力是通过在多个MDPs上进行训练实现的。","在元强化学习中，记忆的跨episode特性使得策略能够利用之前任务的经验，从而在新任务上更快地适应。这种机制是元强化学习区别于标准RL的重要特征之一。"],"formulas":[],"uncertainties":["在段落76中，'run pi in our task or MDP for' 的完整句子未被识别，因此无法确定其完整含义。"],"diagram":"none","start":1360.99,"end":1529.93,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1360.99,"text":"in the sense that you're actually using reward information from the current MVP in order to try to get better at the task. This also means that actually at test time, or when we're trying to adapt to a new task, we're also going to be using the reward. And in RL settings, oftentimes we don't necessarily assume that we have the reward when we're just deploying our policy. So that was kind of one main difference. Any other differences?"},{"start":1389.07,"text":"Yeah. So the question is, why are we also not passing as input the actions? You can pass as input the actions. It depends on, like, if your policy is mostly deterministic, then information about past actions could be stored in the memory as well, because you were predicting, you generated those actions. And so in those cases, you don't need the actions. If you have a more stochastic policy, then that sampling process won't be necessarily in the memory. And in those cases, it's good to pass as input the actions as well."},{"start":1418.57,"text":"Right. So the note was that the states and actions might not be the same for different tasks. And so one of the things that's different here is we're actually training this model across MDPs. And so you might have a different state and action space. You might have different dynamics. And so because one of the big differences compared to standard RL is that we're actually, yeah, we're training this across MDPs. And there's going to be differences in states, actions, dynamics, and rewards across those MDPs."},{"start":1445.9,"text":"Cool. There's actually also one other difference. But the first thing that we talked about is see that the reward is passed as input. You might also be passing as input actions. And this is trained across multiple MDPs. And that's quite different from the typical reinforcement learning setup. Now, the second thing that's also different is that your memory is also going to span across multiple episodes, potentially. If you're trying to actually learn..."},{"start":1473.86,"text":"not just within an episode but learn across episodes, then rather than having your current policy simply have memory within an episode, you will be maintaining any sort of hidden state or any sort of memory, not just within your episode but across multiple episodes. So in terms of what this algorithm, maybe I'll leave this up here in case it's useful. In terms of the algorithm, what this looks like is we will sample"},{"start":1502.16,"text":"a task or an MDP. So maybe let's call this MDP TI. And then we're going to run our policy in that MDP for multiple episodes. So let's say run pi in our task or MDP for"}],"speech_gaps":[],"frame":"../frames/v023/009.webp","frame_time":1372.99},{"title":"元强化学习（Meta RL）的基本概念与算法结构","segments":[{"id":77,"text":"N episodes. So this is rolling out this right here, and it's going to have memory across those N episodes. And then optionally, if we're using an off policy algorithm with a replay buffer, then we would store the episodes in a replay buffer. And then lastly, we're going to update our policy to optimize the rewards.","start":1531.69,"end":1566.76},{"id":78,"text":"And so we will be updating pi. And specifically, we are going to be maximizing the sum over words, like the typical RL objective. But it's going to be across all of the tasks in our task distribution. So we'll have sum over tasks i.","start":1567.52,"end":1591.2},{"id":79,"text":"in subminibatch, and then also the expected sum of rewards. So this would be an expectation under our policy of the sum of rewards over different time steps. Now, this is a pretty simple algorithm.","start":1591.81,"end":1619.66},{"id":80,"text":"It looks a lot like reinforcement learning, where simply the main thing that's different is that we're going to be doing this optimization across multiple MDPs, and our policy will have memory across a set of episodes. Usually this is going to be pretty small, because if it was large, if it was like 1,000 episodes, it's going to be hard to store that in the context of a model, just because your memory will start to increase substantially.","start":1621.21,"end":1650.23},{"id":81,"text":"So what that looks like is you have this neural network. It has multiple episodes, and then you'll be kind of rolling it out for multiple episodes, taking actions, and then you'll start collecting for a new MDP. So you'll cut your memory when you start to collect for the new MDP that you've sampled.","start":1651.91,"end":1673.61},{"id":82,"text":"So you sample a task, roll out the policy for n episodes, in this case, n equals 2 in this diagram, under the dynamics and reward function for that MDP. Then store in your replay buffer. Oftentimes, you'll have a different replay buffer for each task. And then update your policy to maximize the discounted return for all tasks that you've collected for. And then repeat this process in order to continuously get a policy that's better at doing this sort of in-context adaptation.","start":1674.11,"end":1702.96}],"notes":["本段讲解了元强化学习（Meta RL）的基本概念，强调其与传统强化学习（RL）的区别在于优化过程跨越多个任务（MDPs），并且策略具有跨多个回合（episodes）的记忆能力。这使得策略能够适应不同任务，实现一种‘元’级别的学习。","在具体实现中，元强化学习通常使用一个或多个回放缓冲区（replay buffer）来存储不同任务的回合数据。每个任务可能有独立的缓冲区，以确保策略更新时能够充分利用任务特定的数据。","策略更新的目标是最大化所有任务的折扣回报（discounted return），这与传统强化学习的目标类似，但扩展到了多个任务的集合。这种设计使得策略能够更好地适应新任务，实现快速的上下文适应。","在实际操作中，策略会在多个回合中被展开（roll out），并根据新任务的动态和奖励函数进行调整。当开始收集新任务的数据时，策略会‘切断’之前的记忆，以避免混淆不同任务的数据。","元强化学习的一个关键挑战是管理策略的记忆容量。如果记忆容量过大（如1000个回合），可能会导致模型存储和计算负担增加，因此通常会限制记忆的大小。","整个过程是迭代的，通过不断采样任务、展开策略、更新策略，最终得到一个能够快速适应新任务的策略。这种机制使得元强化学习在需要快速适应新环境的场景中具有优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1531.69,"end":1702.96,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1531.69,"text":"N episodes. So this is rolling out this right here, and it's going to have memory across those N episodes. And then optionally, if we're using an off policy algorithm with a replay buffer, then we would store the episodes in a replay buffer. And then lastly, we're going to update our policy to optimize the rewards."},{"start":1567.52,"text":"And so we will be updating pi. And specifically, we are going to be maximizing the sum over words, like the typical RL objective. But it's going to be across all of the tasks in our task distribution. So we'll have sum over tasks i."},{"start":1591.81,"text":"in subminibatch, and then also the expected sum of rewards. So this would be an expectation under our policy of the sum of rewards over different time steps. Now, this is a pretty simple algorithm."},{"start":1621.21,"text":"It looks a lot like reinforcement learning, where simply the main thing that's different is that we're going to be doing this optimization across multiple MDPs, and our policy will have memory across a set of episodes. Usually this is going to be pretty small, because if it was large, if it was like 1,000 episodes, it's going to be hard to store that in the context of a model, just because your memory will start to increase substantially."},{"start":1651.91,"text":"So what that looks like is you have this neural network. It has multiple episodes, and then you'll be kind of rolling it out for multiple episodes, taking actions, and then you'll start collecting for a new MDP. So you'll cut your memory when you start to collect for the new MDP that you've sampled."},{"start":1674.11,"text":"So you sample a task, roll out the policy for n episodes, in this case, n equals 2 in this diagram, under the dynamics and reward function for that MDP. Then store in your replay buffer. Oftentimes, you'll have a different replay buffer for each task. And then update your policy to maximize the discounted return for all tasks that you've collected for. And then repeat this process in order to continuously get a policy that's better at doing this sort of in-context adaptation."}],"speech_gaps":[],"frame":"../frames/v023/010.webp","frame_time":1543.69},{"title":"元强化学习（Meta RL）中的策略适应与任务迁移","segments":[{"id":83,"text":"Yeah, so that's a good question. So the question is, does it know that it's starting a new episode, like at this position right here? You could use a position encoding. In practice, you're also going to probably have a discontinuity in your state. And so you might just be able to see that your current state is very different from the past state. And that might also tell it. But yeah, you could have some sort of token to also tell it that it's a new episode.","start":1704.36,"end":1726.74},{"id":84,"text":"The question is, are we randomizing S1 across the different episodes? When you're rolling out the policy, when you start a new episode, that will be a different sample from the initial state distribution. And so S1, I guess it's maybe a little confusing. S1 here might be different from S1 here. S2 is very likely different from S2 here and so forth. Cool. And then the outcome of this is you'll have a policy that should be able to adapt.","start":1727.84,"end":1755.01},{"id":85,"text":"across episodes with experience from those episodes. And it should be able to, on its own, actually decide on the best exploration exploitation trade-off. And the best exploration exploitation trade-off is going to depend on the number of episodes that you give it.","start":1756.77,"end":1773.99},{"id":86,"text":"If N is two, then it has two episodes to maximize rewards as quickly as possible. And if it needs to explore, it'll explore as quickly as possible. If N is a little bit larger, then you've given it a little bit more budget to... It still wants to maximize...","start":1774.44,"end":1789.82},{"id":87,"text":"explore quickly and efficiently if it can, because then it can get higher rewards later,","start":1790.43,"end":1793.95},{"id":88,"text":"but it might have slightly more budget to explore. And so you'll get, one of the things that's like","start":1794.15,"end":1799.85},{"id":89,"text":"pretty cool about this, when you optimize this whole thing end to end, is that it will make","start":1799.85,"end":1803.85},{"id":90,"text":"decisions on whether or not to explore or to exploit. And it'll make those decisions in a","start":1803.85,"end":1811.25},{"id":91,"text":"way that's informed by whatever gets it the highest reward. Then after this sort of training process,","start":1811.25,"end":1818.47},{"id":92,"text":"this after you've trained it on multiple MDPs, then you can actually then roll out your policy","start":1818.47,"end":1827.21},{"id":93,"text":"in a new task. So at test time, you will then give it a new task. So you're in some new MDP","start":1827.21,"end":1844.03},{"id":94,"text":"mdptj, and you can take the policy that was trained and roll it out in that mdp.","start":1846.79,"end":1858.17},{"id":95,"text":"So roll out pi in that mdp with those state's actions and rewards and so forth.","start":1858.37,"end":1868.29},{"id":96,"text":"And so sample a new task, roll out that policy.","start":1868.61,"end":1871.41},{"id":97,"text":"see. You want to roll this out for up to 10 episodes. If you roll it out for longer,","start":1871.41,"end":1876.43}],"notes":["本段讨论了元强化学习（Meta RL）中策略适应的问题，特别是在不同episode之间如何处理状态S1的随机性。讲者指出，当开始新的episode时，S1会从初始状态分布中采样，因此S1在不同episode之间可能不同，这可能会影响策略的适应性。","讲者进一步说明，策略在多个episode中积累经验后，能够自主决定探索与利用的平衡。这种平衡取决于提供的episode数量，即N的大小。当N较小时，策略倾向于快速探索以最大化奖励；当N较大时，策略可能有更多预算进行更有效的探索。","在训练过程中，策略会根据获得的奖励做出决策，以决定是否探索或利用。这种决策过程是端到端优化的结果，使得策略能够适应不同的任务。","在测试阶段，训练好的策略可以迁移到新的任务中。讲者提到，当遇到新的MDP时，可以使用训练好的策略进行roll-out，即执行策略以获得状态、动作和奖励等信息。","讲者还提到，在测试时，可以对新任务进行最多10次episode的roll-out，如果roll-out时间过长，可能会导致策略表现不佳。","整个讨论强调了元强化学习中策略适应性和任务迁移的重要性，以及如何通过端到端优化实现这些目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1704.36,"end":1876.43,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1704.36,"text":"Yeah, so that's a good question. So the question is, does it know that it's starting a new episode, like at this position right here? You could use a position encoding. In practice, you're also going to probably have a discontinuity in your state. And so you might just be able to see that your current state is very different from the past state. And that might also tell it. But yeah, you could have some sort of token to also tell it that it's a new episode."},{"start":1727.84,"text":"The question is, are we randomizing S1 across the different episodes? When you're rolling out the policy, when you start a new episode, that will be a different sample from the initial state distribution. And so S1, I guess it's maybe a little confusing. S1 here might be different from S1 here. S2 is very likely different from S2 here and so forth. Cool. And then the outcome of this is you'll have a policy that should be able to adapt."},{"start":1756.77,"text":"across episodes with experience from those episodes. And it should be able to, on its own, actually decide on the best exploration exploitation trade-off. And the best exploration exploitation trade-off is going to depend on the number of episodes that you give it."},{"start":1774.44,"text":"If N is two, then it has two episodes to maximize rewards as quickly as possible. And if it needs to explore, it'll explore as quickly as possible. If N is a little bit larger, then you've given it a little bit more budget to... It still wants to maximize..."},{"start":1790.43,"text":"explore quickly and efficiently if it can, because then it can get higher rewards later,"},{"start":1794.15,"text":"but it might have slightly more budget to explore. And so you'll get, one of the things that's like"},{"start":1799.85,"text":"pretty cool about this, when you optimize this whole thing end to end, is that it will make"},{"start":1803.85,"text":"decisions on whether or not to explore or to exploit. And it'll make those decisions in a"},{"start":1811.25,"text":"way that's informed by whatever gets it the highest reward. Then after this sort of training process,"},{"start":1818.47,"text":"this after you've trained it on multiple MDPs, then you can actually then roll out your policy"},{"start":1827.21,"text":"in a new task. So at test time, you will then give it a new task. So you're in some new MDP"},{"start":1846.79,"text":"mdptj, and you can take the policy that was trained and roll it out in that mdp."},{"start":1858.37,"text":"So roll out pi in that mdp with those state's actions and rewards and so forth."},{"start":1868.61,"text":"And so sample a new task, roll out that policy."},{"start":1871.41,"text":"see. You want to roll this out for up to 10 episodes. If you roll it out for longer,"}],"speech_gaps":[],"frame":"../frames/v023/011.webp","frame_time":1716.36},{"title":"元强化学习（Meta RL）的实现与示例","segments":[{"id":98,"text":"all bets are off in terms of what it might do. You could also have a variable number of episodes","start":1877.11,"end":1885.51},{"id":99,"text":"that you use during training if you want to be able to handle variable numbers of episodes.","start":1885.51,"end":1889.53},{"id":100,"text":"But yeah, this would be like...","start":1890.69,"end":1892.41},{"id":101,"text":"You could also have a variable number of episodes. But yeah, this would be like... for n episodes or for up to n episodes. So in terms of actually implementing this, there's a few different architectures and optimizers you could use. So you could use a vanilla recurrent neural network. Some of the first works on meta-reinforcement learning did this, and they used algorithms. This is, I think, before PPO existed or was introduced. They used an algorithm that's somewhat similar in nature in terms of the assumptions as PPO.","start":1893.25,"end":1926.39},{"id":102,"text":"There is also a model that, a paper that before transformers were really popular, used self-attention and also 1D convolutions. You can think of it sort of as a transformer and optimize this. And you can actually note that they do also pass the actions as input in this particular scenario.","start":1928.38,"end":1946.08},{"id":103,"text":"One other thing, we'll talk about this a little bit more later, but you can also, instead of using a transformer or an RNN, you can also use a feed-forward network and then average across, average the embedding. This is sometimes called a deep set.","start":1948.22,"end":1966.28},{"id":104,"text":"And it has its own benefits. It's actually pretty computationally fast because you can parallelize everything and also actually surprisingly expressive for what it can do. So let's look at some examples. So we'll look at this example that was using something that's kind of a bit like a transformer. And they were trying to learn how to visually navigate a maze, specifically new mazes that the agent had never been in before.","start":1967.7,"end":1994.03},{"id":105,"text":"So let's look at some examples. So we'll look at this example that was using something that's kind of a bit like a transformer. And they were trying to learn how to visually navigate a maze, specifically new mazes that the agent had never been in before.","start":1994.68,"end":2013.4},{"id":106,"text":"They trained it on 1,000 small mazes, and they tested it on held-out mazes that the agent hadn't seen before. They tested it actually both on small mazes and on large mazes. This is actually a scenario where they were able to see some extrapolation to tasks that were outside of the distribution of what it was trained on.","start":2014.77,"end":2034.81},{"id":107,"text":"And then after that exploration episode, we're still, we still have memory from that previous","start":2035.42,"end":2039.28},{"id":108,"text":"episode and it's able to, uh, using that memory, it's able to then be able to, uh, kind of go","start":2039.28,"end":2047.08},{"id":109,"text":"directly to the goal, um, based on this experience in that maze. Um, so kind of watching that again,","start":2047.08,"end":2055.46}],"notes":["本段讲解了元强化学习（Meta RL）中处理可变数量的episode的方法，以及实现该方法的不同架构和优化器。其中包括使用普通的循环神经网络（RNN）和一些早期的元强化学习工作，这些工作在PPO算法出现之前就已经存在。此外，还提到了使用自注意力机制和1D卷积的模型，以及使用前馈网络并通过平均嵌入来实现的深度集合（deep set）方法。","本段还提到，使用深度集合方法具有计算速度快和表达能力强的优点，因为可以并行化处理所有任务。同时，通过一个示例说明了元强化学习在视觉导航任务中的应用，该示例使用类似于Transformer的结构，训练模型在1000个小型迷宫上学习，并在未见过的迷宫上进行测试，展示了模型在分布外任务上的泛化能力。","在测试阶段，模型通过探索环境寻找目标，仅使用图像作为输入。在探索过程中，模型会留下记忆，并在后续任务中利用这些记忆直接到达目标。这表明元强化学习能够利用之前的经验来提升新任务的性能。","本段还提到，虽然在某些片段中存在断句和语音识别的不清晰问题，但整体内容清晰地描述了元强化学习的实现方式和实际应用。"],"formulas":[],"uncertainties":["episode and it's able to, uh, using that memory, it's able to then be able to, uh, kind of go","directly to the goal, um, based on this experience in that maze. Um, so kind of watching that again,"],"diagram":"none","start":1877.11,"end":2055.46,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1877.11,"text":"all bets are off in terms of what it might do. You could also have a variable number of episodes"},{"start":1885.51,"text":"that you use during training if you want to be able to handle variable numbers of episodes."},{"start":1890.69,"text":"But yeah, this would be like..."},{"start":1893.25,"text":"for n episodes or for up to n episodes. So in terms of actually implementing this, there's a few different architectures and optimizers you could use. So you could use a vanilla recurrent neural network. Some of the first works on meta-reinforcement learning did this, and they used algorithms. This is, I think, before PPO existed or was introduced. They used an algorithm that's somewhat similar in nature in terms of the assumptions as PPO."},{"start":1928.38,"text":"There is also a model that, a paper that before transformers were really popular, used self-attention and also 1D convolutions. You can think of it sort of as a transformer and optimize this. And you can actually note that they do also pass the actions as input in this particular scenario."},{"start":1948.22,"text":"One other thing, we'll talk about this a little bit more later, but you can also, instead of using a transformer or an RNN, you can also use a feed-forward network and then average across, average the embedding. This is sometimes called a deep set."},{"start":1967.7,"text":"And it has its own benefits. It's actually pretty computationally fast because you can parallelize everything and also actually surprisingly expressive for what it can do. So let's look at some examples. So we'll look at this example that was using something that's kind of a bit like a transformer. And they were trying to learn how to visually navigate a maze, specifically new mazes that the agent had never been in before."},{"start":1994.68,"text":"They trained it on 1,000 small mazes, and they tested it on held-out mazes t
