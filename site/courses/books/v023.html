s like"},{"start":1799.85,"text":"pretty cool about this, when you optimize this whole thing end to end, is that it will make"},{"start":1803.85,"text":"decisions on whether or not to explore or to exploit. And it'll make those decisions in a"},{"start":1811.25,"text":"way that's informed by whatever gets it the highest reward. Then after this sort of training process,"},{"start":1818.47,"text":"this after you've trained it on multiple MDPs, then you can actually then roll out your policy"},{"start":1827.21,"text":"in a new task. So at test time, you will then give it a new task. So you're in some new MDP"},{"start":1846.79,"text":"mdptj, and you can take the policy that was trained and roll it out in that mdp."},{"start":1858.37,"text":"So roll out pi in that mdp with those state's actions and rewards and so forth."},{"start":1868.61,"text":"And so sample a new task, roll out that policy."},{"start":1871.41,"text":"see. You want to roll this out for up to 10 episodes. If you roll it out for longer,"}],"speech_gaps":[],"frame":"../frames/v023/011.webp","frame_time":1716.36},{"title":"元强化学习（Meta RL）的实现与示例","segments":[{"id":98,"text":"all bets are off in terms of what it might do. You could also have a variable number of episodes","zh":"在考虑它可能的行为时，所有赌注都失效了。你也可以在训练过程中使用不同数量的回合。","start":1877.11,"end":1885.51},{"id":99,"text":"that you use during training if you want to be able to handle variable numbers of episodes.","zh":"如果你想处理不同数量的回合，你可以在训练过程中使用不同数量的回合。","start":1885.51,"end":1889.53},{"id":100,"text":"But yeah, this would be like...","zh":"但说实话，这就像...","start":1890.69,"end":1892.41},{"id":101,"text":"You could also have a variable number of episodes. But yeah, this would be like... for n episodes or for up to n episodes. So in terms of actually implementing this, there's a few different architectures and optimizers you could use. So you could use a vanilla recurrent neural network. Some of the first works on meta-reinforcement learning did this, and they used algorithms. This is, I think, before PPO existed or was introduced. They used an algorithm that's somewhat similar in nature in terms of the assumptions as PPO.","zh":"你也可以有不同数量的回合。但说实话，这就像... 对于 n 个回合或最多 n 个回合。在实际实现方面，有几种不同的架构和优化器可以使用。你可以使用一个普通的循环神经网络。一些早期的元强化学习工作就是这么做的，他们使用了算法。我认为这是在 PPO 被引入之前的工作。他们使用了一种在假设上与 PPO 类似的算法。","start":1893.25,"end":1926.39},{"id":102,"text":"There is also a model that, a paper that before transformers were really popular, used self-attention and also 1D convolutions. You can think of it sort of as a transformer and optimize this. And you can actually note that they do also pass the actions as input in this particular scenario.","zh":"还有一种模型，一篇在变压器流行之前发表的论文，使用了自注意力机制和 1D 卷积。你可以将其视为一种变压器并对其进行优化。而且你实际上可以注意到，在这种特定情况下，他们也将动作作为输入传递进来。","start":1928.38,"end":1946.08},{"id":103,"text":"One other thing, we'll talk about this a little bit more later, but you can also, instead of using a transformer or an RNN, you can also use a feed-forward network and then average across, average the embedding. This is sometimes called a deep set.","zh":"还有另一件事，我们稍后会更详细地讨论，但你也可以不用变压器或 RNN，而是使用一个前馈网络，然后对嵌入进行平均。这有时被称为深度集合。","start":1948.22,"end":1966.28},{"id":104,"text":"And it has its own benefits. It's actually pretty computationally fast because you can parallelize everything and also actually surprisingly expressive for what it can do. So let's look at some examples. So we'll look at this example that was using something that's kind of a bit like a transformer. And they were trying to learn how to visually navigate a maze, specifically new mazes that the agent had never been in before.","zh":"它有其自身的优点。它实际上计算速度相当快，因为你可以并行化所有操作，而且它在能实现的功能上出人意料地具有很强的表达能力。让我们来看一些例子。我们将看一下一个使用了某种类似于变压器的结构的例子。他们试图学习如何视觉导航迷宫，特别是那些代理从未见过的新迷宫。","start":1967.7,"end":1994.03},{"id":105,"text":"So let's look at some examples. So we'll look at this example that was using something that's kind of a bit like a transformer. And they were trying to learn how to visually navigate a maze, specifically new mazes that the agent had never been in before.","zh":"让我们来看一些例子。我们将看一下一个使用了某种类似于变压器的结构的例子。他们试图学习如何视觉导航迷宫，特别是那些代理从未见过的新迷宫。","start":1994.68,"end":2013.4},{"id":106,"text":"They trained it on 1,000 small mazes, and they tested it on held-out mazes that the agent hadn't seen before. They tested it actually both on small mazes and on large mazes. This is actually a scenario where they were able to see some extrapolation to tasks that were outside of the distribution of what it was trained on.","zh":"他们用1,000个小型迷宫对其进行训练，并在之前未见过的迷宫上测试它。他们实际上在小型迷宫和大型迷宫上都进行了测试。这实际上是一个场景，他们能够看到对训练分布之外的任务进行外推。","start":2014.77,"end":2034.81},{"id":107,"text":"And then after that exploration episode, we're still, we still have memory from that previous","zh":"在那次探索回合之后，我们仍然，我们仍然保留了之前","start":2035.42,"end":2039.28},{"id":108,"text":"episode and it's able to, uh, using that memory, it's able to then be able to, uh, kind of go","zh":"回合的记忆，并且能够利用这些记忆，然后能够，呃，大致直接","start":2039.28,"end":2047.08},{"id":109,"text":"directly to the goal, um, based on this experience in that maze. Um, so kind of watching that again,","zh":"到达目标，嗯，基于在那个迷宫中的经验。嗯，所以再次观看这个过程，","start":2047.08,"end":2055.46}],"notes":["本段讲解了元强化学习（Meta RL）中处理可变数量的episode的方法，以及实现该方法的不同架构和优化器。其中包括使用普通的循环神经网络（RNN）和一些早期的元强化学习工作，这些工作在PPO算法出现之前就已经存在。此外，还提到了使用自注意力机制和1D卷积的模型，以及使用前馈网络并通过平均嵌入来实现的深度集合（deep set）方法。","本段还提到，使用深度集合方法具有计算速度快和表达能力强的优点，因为可以并行化处理所有任务。同时，通过一个示例说明了元强化学习在视觉导航任务中的应用，该示例使用类似于Transformer的结构，训练模型在1000个小型迷宫上学习，并在未见过的迷宫上进行测试，展示了模型在分布外任务上的泛化能力。","在测试阶段，模型通过探索环境寻找目标，仅使用图像作为输入。在探索过程中，模型会留下记忆，并在后续任务中利用这些记忆直接到达目标。这表明元强化学习能够利用之前的经验来提升新任务的性能。","本段还提到，虽然在某些片段中存在断句和语音识别的不清晰问题，但整体内容清晰地描述了元强化学习的实现方式和实际应用。"],"formulas":[],"uncertainties":["episode and it's able to, uh, using that memory, it's able to then be able to, uh, kind of go","directly to the goal, um, based on this experience in that maze. Um, so kind of watching that again,"],"diagram":"none","start":1877.11,"end":2055.46,"asr_flags":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":1877.11,"text":"all bets are off in terms of what it might do. You could also have a variable number of episodes"},{"start":1885.51,"text":"that you use during training if you want to be able to handle variable numbers of episodes."},{"start":1890.69,"text":"But yeah, this would be like..."},{"start":1893.25,"text":"for n episodes or for up to n episodes. So in terms of actually implementing this, there's a few different architectures and optimizers you could use. So you could use a vanilla recurrent neural network. Some of the first works on meta-reinforcement learning did this, and they used algorithms. This is, I think, before PPO existed or was introduced. They used an algorithm that's somewhat similar in nature in terms of the assumptions as PPO."},{"start":1928.38,"text":"There is also a model that, a paper that before transformers were really popular, used self-attention and also 1D convolutions. You can think of it sort of as a transformer and optimize this. And you can actually note that they do also pass the actions as input in this particular scenario."},{"start":1948.22,"text":"One other thing, we'll talk about this a little bit more later, but you can also, instead of using a transformer or an RNN, you can also use a feed-forward network and then average across, average the embedding. This is sometimes called a deep set."},{"start":1967.7,"text":"And it has its own benefits. It's actually pretty computationally fast because you can parallelize everything and also actually surprisingly expressive for what it can do. So let's look at some examples. So we'll look at this example that was using something that's kind of a bit like a transformer. And they were trying to learn how to visually navigate a maze, specifically new mazes that the agent had never been in before."},{"start":1994.68,"text":"They trained it on 1,000 small mazes, and they tested it on held-out mazes that the agent hadn't seen before. They tested it actually both on small mazes and on large mazes. This is actually a scenario where they were able to see some extrapolation to tasks that were outside of the distribution of what it was trained on."},{"start":2014.77,"text":"So this is what it looks like. This is at test time. And you can see that the agent, it just is like exploring around this environment, looking for where the goal is. It only gets these images as input. And on the right, we can see the trace of the exploration. So it started in the middle, explored over here, and explored down here, and eventually found the goal."},{"start":2035.42,"text":"And then after that exploration episode, we're still, we still have memory from that previous"},{"start":2039.28,"text":"episode and it's able to, uh, using that memory, it's able to then be able to, uh, kind of go"},{"start":2047.08,"text":"directly to the goal, um, based on this experience in that maze. Um, so kind of watching that again,"}],"speech_gaps":[],"frame":"../frames/v023/012.webp","frame_time":1889.11},{"title":"元强化学习（Meta RL）中的探索与利用策略","segments":[{"id":110,"text":"whoops. Um, it's, this is the first episode. And so this is kind of the first episode of rolling","zh":"哎呀。嗯，这是第一集。因此，这是推出这个策略的第一集","start":2055.62,"end":2063.96},{"id":111,"text":"out this policy. It's choosing to explore because it doesn't know where","zh":"它选择探索，因为它不知道这个迷宫中目标的位置","start":2063.96,"end":2069.44},{"id":112,"text":"the goal is in this maze. It also doesn't know the layout of the maze and so we","zh":"它也不知道迷宫的布局，所以我们看到它在这里进行探索","start":2070.06,"end":2074.32},{"id":113,"text":"see it explore here. And then in the second episode it chooses to go","zh":"然后在第二集，它选择直接前往目标，因为它决定已经探索了迷宫的范围","start":2074.32,"end":2080.08},{"id":114,"text":"straight to the goal because it decided that it already explored the extent of","zh":"这里有一个更大迷宫的例子。所以代理从这里开始","start":2080.08,"end":2084.14},{"id":115,"text":"the maze. Here's an example in a larger maze. So the agent starts over here and","zh":"它在顶部部分进行探索，没有看到目标，并意识到这是一个死胡同","start":2084.14,"end":2090.48},{"id":116,"text":"And it explores in the top part, doesn't see the goal and realize that this is a dead end.","zh":"它不需要进一步探索这个区域","start":2090.48,"end":2100.76},{"id":117,"text":"It doesn't need to explore it further.","zh":"它不需要进一步探索。","start":2100.8,"end":2101.86},{"id":118,"text":"And then it ends up seeing the goal here.","zh":"然后它最终看到了这个目标。","start":2102.02,"end":2103.92},{"id":119,"text":"And then after that, it goes straight to the goal after that first episode.","zh":"然后在第一个回合之后，它直接前往目标。","start":2104.08,"end":2110.18},{"id":120,"text":"And so in this training example, n equals 2.","zh":"因此在这个训练示例中，n等于2。","start":2110.46,"end":2114.56},{"id":121,"text":"So they trained it just to be able to explore and exploit after two episodes.","zh":"他们只是训练它能够在两个回合后进行探索和利用。","start":2114.9,"end":2120.28},{"id":122,"text":"Cool.","zh":"很酷。","start":2121.3,"end":2121.82},{"id":123,"text":"And then quantitatively, they looked at the average time to find the goal in both the first episode and the second episode.","zh":"然后从定量的角度来看，他们比较了在第一个回合和第二个回合中找到目标的平均时间。","start":2122.0,"end":2128.08},{"id":124,"text":"They compared to using a random policy, which occasionally does happen upon the goal,","zh":"他们将其与使用随机策略进行了比较，这种策略偶尔会偶然发现目标，","start":2128.96,"end":2135.2},{"id":125,"text":"and using an LSTM architecture and this more kind of self-attention and convolution architecture.","zh":"以及使用LSTM架构和这种更类似于自注意力和卷积架构的方法。","start":2135.78,"end":2140.32},{"id":126,"text":"And they found that with the small maze,","zh":"并且他们发现，在小迷宫中，","start":2140.88,"end":2142.5},{"id":127,"text":"Even within the first episode, they were able to do a lot better than random. That means that's because it's actually exploring efficiently and then eventually often finding the goal. And then it's able to...","zh":"即使在第一个回合内，他们也能比随机选择做得好得多。这意味着这是因为它们实际上在高效地进行探索，最终经常能够找到目标。然后它能够...","start":2144.21,"end":2154.37},{"id":128,"text":"find the goal faster in the second episode after learning where the goal is and about the maze in the first episode. We also see that it does significantly better than a random agent in the large mazes. And in both cases, using kind of the self-attention architecture is better than using an LSTM architecture, which is another memory architecture.","zh":"在第二个回合中更快地找到目标，因为在第一个回合中已经学习到了目标的位置和迷宫的结构。我们还看到，在大迷宫中，它比随机智能体表现显著更好。在这两种情况下，使用自注意力架构比使用LSTM架构（另一种记忆架构）更好。","start":2155.02,"end":2174.4},{"id":129,"text":"Yeah, so the question is, is the reward to find the goal? And if so, why is it optimized to find it as fast as possible? So the reward is to find the goal. I don't remember the exact structure of the reward. It's optimized to find it quickly. There's a couple ways that lead to it to optimize to find it quickly.","zh":"是的，问题是，奖励是否是找到目标？如果是的话，为什么它被优化为尽可能快地找到目标？所以奖励是找到目标。我不记得奖励的确切结构。它被优化为尽快找到目标。有几种方法会导致它优化为尽快找到目标。","start":2175.42,"end":2196.78},{"id":130,"text":"In this particular case, I believe they're using discounted rewards. And so the discount factor, instead of being like this, you're optimizing for discounted rewards. So there's a discount factor right there. And the discount factor is not one. It's probably like 0.95 or 0.99. And so that objective will be higher if you get the reward sooner rather than later.","zh":"在这种情况下，我相信他们使用的是折扣奖励。因此，折扣因子不是像这样，而是你优化折扣奖励。因此，这里有一个折扣因子。折扣因子不是1，可能是0.95或0.99。因此，如果你越早获得奖励，这个目标就会越高。","start":2198.99,"end":2220.95}],"notes":["本段讲解了元强化学习（Meta RL）中智能体如何在不同迷宫中进行探索与利用。在第一个训练回合中，智能体由于不知道目标位置和迷宫布局，因此选择探索。而在第二个回合中，它已经学习到了迷宫的结构，因此直接前往目标。这种策略体现了元学习中从经验中学习的能力。","在实验中，研究者比较了不同策略在不同大小迷宫中的表现。在小迷宫中，智能体在第一个回合就能比随机策略表现更好，说明其探索效率较高。而在大迷宫中，智能体同样表现优于随机策略，表明其学习能力具有泛化性。","研究者还比较了不同神经网络架构的效果，发现使用自注意力机制的模型在性能上优于使用LSTM的模型。这表明在元强化学习中，模型结构的选择对学习效果有重要影响。","在奖励机制方面，研究者提到使用了折扣奖励（discounted rewards），并指出折扣因子通常为0.95或0.99。折扣因子的存在使得智能体更倾向于尽快获得奖励，从而优化其策略。","本段还提到，智能体在第一个回合中学习了迷宫的结构，并在第二个回合中利用这一知识直接前往目标。这说明元强化学习能够将经验迁移到新的任务中，从而提高学习效率。","最后，研究者指出，智能体的策略优化目标是尽快找到目标，这与折扣奖励机制密切相关。通过折扣因子的设计，智能体能够更有效地平衡探索与利用，从而实现更快的收敛。"],"formulas":[],"uncertainties":["discount factor instead of being like this"],"diagram":"none","start":2055.62,"end":2220.95,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":2055.62,"text":"whoops. Um, it's, this is the first episode. And so this is kind of the first episode of rolling"},{"start":2063.96,"text":"out this policy. It's choosing to explore because it doesn't know where"},{"start":2070.06,"text":"the goal is in this maze. It also doesn't know the layout of the maze and so we"},{"start":2074.32,"text":"see it explore here. And then in the second episode it chooses to go"},{"start":2080.08,"text":"straight to the goal because it decided that it already explored the extent of"},{"start":2084.14,"text":"the maze. Here's an example in a larger maze. So the agent starts over here and"},{"start":2090.48,"text":"And it explores in the top part, doesn't see the goal and realize that this is a dead end."},{"start":2100.8,"text":"It doesn't need to explore it further."},{"start":2102.02,"text":"And then it ends up seeing the goal here."},{"start":2104.08,"text":"And then after that, it goes straight to the goal after that first episode."},{"start":2110.46,"text":"And so in this training example, n equals 2."},{"start":2114.9,"text":"So they trained it just to be able to explore and exploit after two episodes."},{"start":2121.3,"text":"Cool."},{"start":2122.0,"text":"And then quantitatively, they looked at the average time to find the goal in both the first episode and the second episode."},{"start":2128.96,"text":"They compared to using a random policy, which occasionally does happen upon the goal,"},{"start":2135.78,"text":"and using an LSTM architecture and this more kind of self-attention and convolution architecture."},{"start":2140.88,"text":"And they found that with the small maze,"},{"start":2144.21,"text":"Even within the first episode, they were able to do a lot better than random. That means that's because it's actually exploring efficiently and then eventually often finding the goal. And then it's able to..."},{"start":2155.02,"text":"find the goal faster in the second episode after learning where the goal is and about the maze in the first episode. We also see that it does significantly better than a random agent in the large mazes. And in both cases, using kind of the self-attention architecture is better than using an LSTM architecture, which is another memory architecture."},{"start":2175.42,"text":"Yeah, so the question is, is the reward to find the goal? And if so, why is it optimized to find it as fast as possible? So the reward is to find the goal. I don't remember the exact structure of the reward. It's optimized to find it quickly. There's a couple ways that lead to it to optimize to find it quickly."},{"start":2198.99,"text":"In this particular case, I believe they're using discounted rewards. And so the discount factor, instead of being like this, you're optimizing for discounted rewards. So there's a discount factor right there. And the discount factor is not one. It's probably like 0.95 or 0.99. And so that objective will be higher if you get the reward sooner rather than later."}],"speech_gaps":[],"frame":"../frames/v023/013.webp","frame_time":2067.62},{"title":"元强化学习（Meta RL）的输入与探索策略","segments":[{"id":131,"text":"Yeah, so the question is, what is the model's input? And yeah, exactly. So it's video from the previous episode, the actions from the previous episode, and basically everything up until the current time step, which is any previous episodes and everything so far in that episode. So it's all of the video frames and then also all of the actions and all of the rewards as well.","zh":"是的，问题是，模型的输入是什么？没错，就是这样。所以它包括前一个回合的视频画面、前一个回合的动作，以及一直到当前时间步的所有内容，也就是所有之前的回合和当前回合到目前为止的所有信息。因此，它包括所有的视频帧，还包括所有的动作和所有的奖励。","start":2221.77,"end":2243.79},{"id":132,"text":"Yeah, so the question is, where in the algorithm are we exploring exploration versus exploitation? And here, because it basically all comes down to this objective for both of them. And the insight is that the agent doesn't know.","zh":"是的，问题是，我们在算法的哪个部分进行探索与利用的权衡？在这里，因为两者基本上都归结为这个目标。关键的见解是，智能体并不了解太多。它不了解任务的细节。它不了解……根据训练任务的不同，比如在这种情况下，它不知道自己处于哪个迷宫中，也不了解迷宫的结构等等。因此，它实际上甚至无法获得高奖励，直到它开始探索，直到它找到目标的位置，例如。因此，仅仅通过端到端地优化奖励，就会激励它进行探索，否则它基本上无法获得高奖励。","start":2244.57,"end":2263.87},{"id":133,"text":"doesn't know much about the task. It doesn't know... Well, depending on the training tasks, in this case, it doesn't know what maze it's in. It doesn't know the structure of the maze and that sort of thing. And so it's actually not even... It's not able to get high reward until it starts to explore, until it finds where the goal is, for example. And so by optimizing just end-to-end for reward, you're incentivizing it to... It's not going to get high reward without exploration, essentially.","zh":"是的，我们将在不久后的几节课中讨论这一点。但没错，这里有很多问题，因为当你的策略表现不佳且无法获得好的奖励时，最终会很难找到一个好的策略。是的，所以问题是，与其做我们现在做的事情，我们能否直接进行常规的强化学习，然后在测试时进行训练？在某种程度上，语言模型如果有递归结构，","start":2265.4,"end":2293.62},{"id":134,"text":"Yeah, we will talk about that soon in a few lectures. But yeah, there's lots of problems here because when your policy is bad and you're not getting good rewards, it ends up being very difficult to figure out a good policy. Yeah, so the question is, instead of doing what we're doing, could we just do regular RL and then do test time training? So in some ways, language models with recurrence,","zh":"比如，这取决于你怎么看待，但在某种程度上，如果你的模型具有记忆能力，你实际上已经在做类似于元强化学习的事情了。它基本上有能力根据你给它的任务类型进行适应。然后，是的，然后……","start":2294.56,"end":2324.37},{"id":135,"text":"like, it depends on how you view it, but in some ways you are already doing something that kind of looks like meta-RL if it has memory. It basically has the ability to adapt depending on the kind of the task that you're giving it. And then, yeah, and then...","zh":"一个重要的组成部分是，如果你在测试时进行计算，你允许它实际思考问题。现在，测试时计算是一个非常广泛的概念。因此，在下一张幻灯片中，我们将讨论如何实际使用元强化学习来应对测试时计算。现在让我们来谈谈这一点。假设我们正在解决不同的数学问题。这是一个典型的语言模型例子，尤其是针对测试时计算。","start":2325.61,"end":2338.61},{"id":136,"text":"One important component is if you're doing test time compute, you're allowing it to actually think through the problem. Now, test time compute is a very broad term. So on the next slide, we'll talk about how you can actually use, how meta-RL is relevant for test time compute. So let's talk about that now. So say that we're solving different math problems. This is a canonical language model example, especially for test time compute.","zh":"一个重要组成部分是，如果你在进行测试阶段的计算，你允许它实际思考问题。现在，测试阶段的计算是一个非常广泛的概念。因此，在下一张幻灯片中，我们将讨论你如何实际使用元强化学习（meta-RL）与测试阶段计算相关。现在让我们谈谈这一点。假设我们正在解决不同的数学问题。这是一个典型的语言模型例子，尤其是在测试阶段计算方面。","start":2339.04,"end":2362.18},{"id":137,"text":"And one example of the math problem is trying to show this inequality. This is actually the same, I think possibly the same math problem that Avril showed in his lecture. And in some ways, like trying to solve this math problem is, you can think of it in some ways as an MDP itself, in that there's different strategies that you might try to take to solve this math problem.","zh":"还有一个数学问题的例子是试图展示这个不等式。这实际上可能就是Avril在他的讲座中展示的同一个数学问题。在某种程度上，尝试解决这个问题可以看作是一个MDP，因为你可以尝试不同的策略来解决这个问题。","start":2363.2,"end":2386.28}],"notes":["本段讨论了元强化学习（Meta RL）中模型的输入内容，包括视频、动作和奖励等历史信息。这些信息构成了当前时间步的上下文，帮助模型进行决策。同时，讲者指出，元强化学习的目标是让模型能够适应不同任务，而不仅仅是单一任务。","讲者进一步探讨了探索（exploration）与利用（exploitation）在算法中的位置。他指出，这两个过程都依赖于同一个目标函数，而智能体对任务了解有限，因此需要通过探索来获得高奖励。","讲者以迷宫任务为例，说明智能体在不知道迷宫结构的情况下，必须通过探索才能找到目标并获得高奖励。这表明，仅优化端到端奖励可能不足以保证成功，因为探索是获得高奖励的前提。","讲者提到，元强化学习的一个重要方面是测试时计算（test time compute），即允许模型在测试阶段进行推理。测试时计算是一个广泛的概念，涉及模型如何适应不同任务。","讲者以数学问题为例，说明测试时计算如何应用于语言模型。他指出，解决数学问题可以被视为一种马尔可夫决策过程（MDP），其中存在多种策略可供选择。","讲者提到，测试时计算与元强化学习密切相关，因为模型需要在不同任务中进行推理和适应。这表明，元强化学习的目标是让模型具备更强的泛化能力，以应对未知任务。"],"formulas":[],"uncertainties":["PaaS's input to the model"],"diagram":"none","start":2221.77,"end":2386.28,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2221.77,"text":"Yeah, so the question is, what is PaaS's input to the model? And yeah, exactly. So it's video from the previous episode, the actions from the previous episode, and basically everything up until the current time step, which is any previous episodes and everything so far in that episode. So it's all of the video frames and then also all of the actions and all of the rewards as well."},{"start":2244.57,"text":"Yeah, so the question is, where in the algorithm are we exploring exploration versus exploitation? And here, because it basically all comes down to this objective for both of them. And the insight is that the agent doesn't know."},{"start":2265.4,"text":"doesn't know much about the task. It doesn't know... Well, depending on the training tasks, in this case, it doesn't know what maze it's in. It doesn't know the structure of the maze and that sort of thing. And so it's actually not even... It's not able to get high reward until it starts to explore, until it finds where the goal is, for example. And so by optimizing just end-to-end for reward, you're incentivizing it to... It's not going to get high reward without exploration, essentially."},{"start":2294.56,"text":"Yeah, we will talk about that soon in a few lectures. But yeah, there's lots of problems here because when your policy is bad and you're not getting good rewards, it ends up being very difficult to figure out a good policy. Yeah, so the question is, instead of doing what we're doing, could we just do regular RL and then do test time training? So in some ways, language models with recurrence,"},{"start":2325.61,"text":"like, it depends on how you view it, but in some ways you are already doing something that kind of looks like meta-URL if it has memory. It basically has the ability to adapt depending on the kind of the task that you're giving it. And then, yeah, and then..."},{"start":2339.04,"text":"One important component is if you're doing test time compute, you're allowing it to actually think through the problem. Now, test time compute is a very broad term. So on the next slide, we'll talk about how you can actually use, how meta-URL is relevant for test time compute. So let's talk about that now. So say that we're solving different math problems. This is a canonical language model example, especially for test time compute."},{"start":2363.2,"text":"And one example of the math problem is trying to show this inequality. This is actually the same, I think possibly the same math problem that Avril showed in his lecture. And in some ways, like trying to solve this math problem is, you can think of it in some ways as an MDP itself, in that there's different strategies that you might try to take to solve this math problem."}],"speech_gaps":[],"frame":"../frames/v023/014.webp","frame_time":2233.77},{"title":"元强化学习（Meta RL）在语言模型中的应用","segments":[{"id":138,"text":"You don't know a priori which strategy is going to help you solve that problem. Where do you start? Do you try to, for example, do guess and check? Do you try to eliminate terms in the equation and so forth? And ideally, you'd be able to kind of explore those different strategies and then produce an answer based off of the best strategy.","zh":"你事先并不知道哪种策略能帮助你解决问题。你从哪里开始呢？你是尝试猜测并检查吗？还是尝试消除方程中的项等等？理想情况下，你能够探索不同的策略，然后根据最佳策略得出答案。","start":2388.24,"end":2411.62},{"id":139,"text":"It turns out that if you give, so DeepSeq R1 is a language model that uses test time compute in order to solve math problems. And if you give R1 different math problems to solve, if you give it a hard problem, it kind of thinks for a while. At some point, it cuts off its test time compute because it doesn't want to be thinking for too long for the user. And then it outputs some explanation for the user.","zh":"事实上，如果你给 DeepSeq R1 这个语言模型不同的数学问题去解决，如果给它一个难题，它会思考一段时间。在某个时刻，它会停止使用测试时间的计算资源，因为它不想让用户等待太久。然后它会向用户输出一些解释。","start":2414.59,"end":2440.27},{"id":140,"text":"And then also, if you give it a really easy problem, like 2 plus 2 equals question mark, it actually also thinks through what the solution might be and then gives a step-by-step explanation for the answer.","zh":"同样地，如果你给它一个非常简单的问题，比如 2 加 2 等于多少，它也会思考可能的解法，然后给出逐步的解答解释。","start":2441.31,"end":2453.43},{"id":141,"text":"And so this is something that is clearly somewhat wasteful to do, probably, unless this is somehow a challenging problem. And so you can actually use this notion of meta-RL to try to optimize for test time compute. And if you know that you're going to be doing test time compute at test time, then basically bring that into the training process.","zh":"因此，这样做显然是有些浪费的，除非这个问题本身具有挑战性。因此，你实际上可以利用元强化学习（meta-RL）的概念来优化测试时间的计算资源使用。如果你知道在测试时会使用测试时间的计算资源，那么基本上可以将这一过程纳入训练过程中。","start":2454.44,"end":2474.14},{"id":142,"text":"Encourage the model to efficiently use that test time compute, efficiently explore different strategies, such that ideally on easy problems, it is trying to output an answer as quickly as possible. And for harder problems, it's thinking as much as it needs, including possible exploration, until it then tries to exploit and give an explanation.","zh":"鼓励模型高效地使用测试时间的计算资源，高效地探索不同的策略，使得在简单的问题上，它能够尽可能快地输出答案；而在困难的问题上，它能够思考所需的全部时间，包括可能的探索，直到它尝试利用并给出解释。","start":2476.27,"end":2496.89},{"id":143,"text":"And so this paper here was a paper that explored that. They found that when they were trying to explicitly optimize for effective use of test type compute, they were able to get higher performance with the same number of tokens and also actually reduce the number of tokens needed to get the same performance so that you aren't, for example, using up a ton of tokens on simple problems.","zh":"因此，这篇论文探讨了这一点。他们发现，当他们明确优化测试时间计算资源的有效使用时，能够在相同数量的标记下获得更高的性能，甚至可以减少所需的标记数量以达到相同的性能，从而避免在简单问题上消耗大量的标记。","start":2498.22,"end":2524.16},{"id":144,"text":"So that's a use case of meta-URL or ideas from meta-URL in language models. Now, a quick digression, and this will actually lead us into a different way of thinking about meta-URL. So we've talked about multitask policies where we condition on a task descriptor. So maybe we want a robot to stack in different locations or a robot to walk in different directions. And we've talked about policies that take as input experience and then kind of generate actions based off of that data set.","zh":"因此，这就是元强化学习（meta-RL）或元强化学习思想在语言模型中的一个应用场景。现在，做一个简短的旁白，这实际上会引导我们以一种不同的方式来思考元强化学习。我们之前讨论过多任务策略，其中我们根据任务描述符进行条件化。也许我们希望机器人在不同的位置进行堆叠，或者让机器人朝不同的方向行走。我们还讨论过一种策略，它以经验作为输入，然后根据该数据集生成动作。","start":2525.08,"end":2554.98}],"notes":["本段讨论了元强化学习（Meta RL）在语言模型中的应用，特别是如何优化测试时间计算资源的使用。讲者指出，对于简单问题，模型应快速给出答案，而对于复杂问题，模型应进行充分的探索和思考，以生成解释。","讲者提到，通过显式优化测试时间计算的使用，可以在相同数量的标记下获得更高的性能，甚至减少所需的标记数量，从而避免在简单问题上浪费计算资源。","讲者进一步指出，这种优化方法不仅适用于数学问题，还可以推广到其他任务，例如机器人控制等多任务策略。这表明元强化学习可以用于训练模型在不同任务中高效地使用计算资源。","讲者提到，元强化学习的核心思想是将测试时间的计算资源纳入训练过程，以鼓励模型在不同任务中高效地探索和利用策略。这与传统的强化学习方法不同，后者通常不考虑测试时的计算成本。","讲者还提到，这种优化方法可以应用于语言模型，例如DeepSeq R1，它在解决数学问题时会根据问题的难度调整计算资源的使用，从而提高效率。","最后，讲者提到，这种思路可以引导我们以不同的方式思考元强化学习，即通过多任务策略和经验输入来生成动作，从而实现更高效的策略学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2388.24,"end":2554.98,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2388.24,"text":"You don't know a priori which strategy is going to help you solve that problem. Where do you start? Do you try to, for example, do guess and check? Do you try to eliminate terms in the equation and so forth? And ideally, you'd be able to kind of explore those different strategies and then produce an answer based off of the best strategy."},{"start":2414.59,"text":"It turns out that if you give, so DeepSeq R1 is a language model that uses test time compute in order to solve math problems. And if you give R1 different math problems to solve, if you give it a hard problem, it kind of thinks for a while. At some point, it cuts off its test time compute because it doesn't want to be thinking for too long for the user. And then it outputs some explanation for the user."},{"start":2441.31,"text":"And then also, if you give it a really easy problem, like 2 plus 2 equals question mark, it actually also thinks through what the solution might be and then gives a step-by-step explanation for the answer."},{"start":2454.44,"text":"And so this is something that is clearly somewhat wasteful to do, probably, unless this is somehow a challenging problem. And so you can actually use this notion of meta-RL to try to optimize for test time compute. And if you know that you're going to be doing test time compute at test time, then basically bring that into the training process."},{"start":2476.27,"text":"Encourage the model to efficiently use that test time compute, efficiently explore different strategies, such that ideally on easy problems, it is trying to output an answer as quickly as possible. And for harder problems, it's thinking as much as it needs, including possible exploration, until it then tries to exploit and give an explanation."},{"start":2498.22,"text":"And so this paper here was a paper that explored that. They found that when they were trying to explicitly optimize for effective use of test type compute, they were able to get higher performance with the same number of tokens and also actually reduce the number of tokens needed to get the same performance so that you aren't, for example, using up a ton of tokens on simple problems."},{"start":2525.08,"text":"So that's a use case of meta-URL or ideas from meta-URL in language models. Now, a quick digression, and this will actually lead us into a different way of thinking about meta-URL. So we've talked about multitask policies where we condition on a task descriptor. So maybe we want a robot to stack in different locations or a robot to walk in different directions. And we've talked about policies that take as input experience and then kind of generate actions based off of that data set."}],"speech_gaps":[],"frame":"../frames/v023/015.webp","frame_time":2400.24},{"title":"元强化学习（Meta RL）与多任务学习的联系","segments":[{"id":145,"text":"And if you were to think about how this relates to multitask learning policies, one way to think about it is that we're just doing multitask learning, but now this data is our task identifier. And it's something that actually changes within a task. So the analogy is not perfect. It's not actually fixed for a given task. But you can sort of think about it as conditioning on the task insofar as experience tells you what the task you're trying to do is. Cool.","zh":"如果你考虑这与多任务学习策略之间的关系，一种思考方式是，我们只是在进行多任务学习，但现在这些数据就是我们的任务标识符。而且它实际上在任务内部是会变化的。因此，这个类比并不完美。它并不是针对某个特定任务是固定的。但你可以大致将其视为根据任务进行条件化，因为经验会告诉你你正在尝试完成的任务是什么。不错。","start":2556.01,"end":2583.19},{"id":146,"text":"If you think about goal condition policies, you can also view meta-RL as a generalization of goal condition policies.","zh":"如果你考虑目标条件策略，你也可以将元强化学习（meta-RL）视为目标条件策略的一种泛化。","start":2584.42,"end":2592.74},{"id":147,"text":"There's a set of MDPs that are goal-reaching MDPs, and then there's a broader set of MDPs that are reward-maximizing MDPs. And then the other way to think about this is instead of trying to generalize to new goals, you can think about meta-RL as trying to adapt to new tasks with a small amount of experience. This would be kind of the difference between zero-shot generalization in the goal condition case.","zh":"有一组是目标到达的马尔可夫决策过程（MDPs），还有一组更广泛的MDPs是奖励最大化MDPs。另一种思考方式是，与其尝试泛化到新目标，不如将元强化学习视为尝试用少量经验适应新任务。这在目标条件情况下，大致就是零样本泛化的区别。","start":2594.19,"end":2618.99},{"id":148,"text":"and K shot generalization with K episodes or K time steps in the meta-RL case. Now, so we've talked about how we can view the experience as the task descriptor Z or the prompt, essentially. But there's actually another way to look at it, which is that if we think about this policy with memory and that has kind of the past memory and then our current policy,","zh":"以及在元强化学习情况下，K样本泛化对应的是K个回合或K个时间步。现在，我们已经讨论了如何将经验视为任务描述符Z或提示，本质上。但实际上还有另一种方式来看待它，即如果我们考虑这个具有记忆的策略，并且它包含过去的记忆，以及当前的策略，","start":2619.57,"end":2646.11},{"id":149,"text":"If we were to think about what information is being passed right here to the policy, this information is presumably information about the task. And specifically, when ZI isn't part of the state, there's ambiguity about what MDP you're trying to solve, and you're using that experience to try to identify the MDP that you're in.","zh":"如果我们考虑此处传递给策略的信息是什么，这些信息应该是关于任务的信息。具体来说，当ZI不是状态的一部分时，关于你正在解决的MDP存在歧义，而你使用这种经验来尝试识别你所处的MDP。","start":2646.96,"end":2668.89},{"id":150,"text":"And you can sort of think about it as the policy needs to infer the task. It needs to infer specifically some sort of latent task descriptor from its experience. And so another way of looking at meta-URL is something where you are using your experience to infer what the task is and then conditioning your policy that's acting at the current time step on your current estimate of what the task is.","zh":"你可以大致将其视为策略需要推断任务。它需要从经验中推断出某种潜在的任务描述符。因此，另一种看待元强化学习（meta-RL）的方式是，你使用经验来推断任务是什么，然后根据你对当前任务的当前估计来条件化当前时间步的策略。","start":2670.46,"end":2696.87},{"id":151,"text":"So you think about it essentially as meta-RL is trying to explore, to infer this unknown task, and then perform the task. I see. So you're asking, because we're going to be inferring the task identifier, why don't we just give it to the learning system? Yeah. So the main reason is that if we don't have a compact way of describing the task that the agent is doing, then it may actually be challenging.","zh":"所以你认为，本质上元强化学习（Meta RL）是在尝试探索，推断这个未知的任务，然后执行任务。我明白了。所以你在问，因为我们即将推断任务标识符，为什么我们不直接把它给学习系统呢？是的。主要原因在于，如果我们没有一种紧凑的方式来描述智能体正在执行的任务，那么实际上这可能会变得具有挑战性。","start":2698.6,"end":2728.31}],"notes":["本段讲解了元强化学习（Meta RL）与多任务学习之间的关系，指出Meta RL可以视为一种更广泛的框架，其中经验被用作任务标识符。与传统的多任务学习不同，Meta RL中的任务标识符在任务内部可能发生变化，因此需要通过经验来推断当前任务。","讲者提到，Meta RL可以看作是目标条件策略（goal condition policies）的泛化。目标条件策略关注的是如何达到特定目标，而Meta RL则更进一步，关注如何通过少量经验适应新任务。","在讨论任务标识符时，讲者指出，当任务标识符（ZI）不在状态中时，会存在关于当前MDP的不确定性，因此需要通过经验来识别当前所处的MDP。","讲者进一步说明，Meta RL中的策略需要从经验中推断出任务的潜在描述符，并基于当前对任务的估计来调整当前时间步的策略。这表明Meta RL的核心在于探索和推断未知任务。","最后，讲者提到，虽然可以将任务标识符直接提供给学习系统，但如果没有一种紧凑的方式来描述任务，这可能会带来挑战。因此，Meta RL需要通过经验来隐式地推断任务。","讲者强调了Meta RL与传统强化学习的区别，即Meta RL关注的是如何通过少量经验适应新任务，而不是直接提供任务标识符。这种适应能力使得Meta RL在处理新任务时具有更强的泛化能力。"],"formulas":[],"uncertainties":["ZI"],"diagram":"none","start":2556.01,"end":2728.31,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2556.01,"text":"And if you were to think about how this relates to multitask learning policies, one way to think about it is that we're just doing multitask learning, but now this data is our task identifier. And it's something that actually changes within a task. So the analogy is not perfect. It's not actually fixed for a given task. But you can sort of think about it as conditioning on the task insofar as experience tells you what the task you're trying to do is. Cool."},{"start":2584.42,"text":"If you think about goal condition policies, you can also view meta-RL as a generalization of goal condition policies."},{"start":2594.19,"text":"There's a set of MDPs that are goal-reaching MDPs, and then there's a broader set of MDPs that are reward-maximizing MDPs. And then the other way to think about this is instead of trying to generalize to new goals, you can think about meta-RL as trying to adapt to new tasks with a small amount of experience. This would be kind of the difference between zero-shot generalization in the goal condition case."},{"start":2619.57,"text":"and K shot generalization with K episodes or K time steps in the meta-RL case. Now, so we've talked about how we can view the experience as the task descriptor Z or the prompt, essentially. But there's actually another way to look at it, which is that if we think about this policy with memory and that has kind of the past memory and then our current policy,"},{"start":2646.96,"text":"If we were to think about what information is being passed right here to the policy, this information is presumably information about the task. And specifically, when ZI isn't part of the state, there's ambiguity about what MDP you're trying to solve, and you're using that experience to try to identify the MDP that you're in."},{"start":2670.46,"text":"And you can sort of think about it as the policy needs to infer the task. It needs to infer specifically some sort of latent task descriptor from its experience. And so another way of looking at meta-URL is something where you are using your experience to infer what the task is and then conditioning your policy that's acting at the current time step on your current estimate of what the task is."},{"start":2698.6,"text":"So you think about it essentially as meta-RL is trying to explore, to infer this unknown task, and then perform the task. I see. So you're asking, because we're going to be inferring the task identifier, why don't we just give it to the learning system? Yeah. So the main reason is that if we don't have a compact way of describing the task that the agent is doing, then it may actually be challenging."}],"speech_gaps":[],"frame":"../frames/v023/016.webp","frame_time":2568.01},{"title":"元强化学习中的表示与部分可观测性","segments":[{"id":152,"text":"If we don't have a good way to represent it, then we're not sure what to pass into the policy. And if we don't have a good way of representing it, we can always resort to just using an index saying this is task one, this is task two, this is task three. But if you do that, and then at test time you say this is task 100,","zh":"如果我们没有一个好的方法来表示它，那么我们就无法确定应该将什么传递给策略。而且，如果我们没有一个好的表示方法，我们总是可以退而求其次，仅仅使用一个索引，比如说这是任务一，这是任务二，这是任务三。但如果你这样做，然后在测试时你说这是任务100，","start":2730.15,"end":2744.15},{"id":153,"text":"it's not going to be able to generalize in that scenario and do anything about that scenario,","zh":"它就无法在这种情况下进行泛化，并对这种情况做任何处理，","start":2745.32,"end":2749.46},{"id":154,"text":"about that task. Whereas experience, like conditioning on experience is something","zh":"对这个任务做任何处理。而经验，比如基于经验的条件，是","start":2749.64,"end":2753.9},{"id":155,"text":"that could generalize where it can actually be able to use kind of the more continuous space","zh":"一种可以泛化的方法，它实际上能够利用更连续的状态空间","start":2753.9,"end":2759.44},{"id":156,"text":"of states, rewards, and so forth in order to figure out a new task. So it comes down to","zh":"来识别新任务。因此，归根结底，","start":2759.44,"end":2765.06},{"id":157,"text":"representations. And you can sort of view this as like learning a Z representation,","zh":"是表示的问题。你可以将其视为学习一种Z表示，","start":2765.06,"end":2769.0},{"id":158,"text":"like learning like a continuous vector that's representing our tasks.","zh":"比如学习一个连续的向量来表示我们的任务。","start":2769.76,"end":2773.82},{"id":159,"text":"Now, in Multitask RL, we talked about how if you formulate some state space that corresponds","zh":"在多任务强化学习中，我们讨论过，如果你构建一个对应的状态空间，","start":2773.82,"end":2787.0},{"id":160,"text":"to the original state space and the z vector, then you get this aggregate MDP.","zh":"将原始状态空间和z向量聚合，你就会得到这个聚合的MDP。","start":2787.0,"end":2794.6},{"id":161,"text":"And so the result of this is still an MDP, just with a new state space and new dynamics to account for this new state space.","zh":"因此，结果仍然是一个MDP，只是具有新的状态空间和新的动态以适应这个新的状态空间。","start":2794.6,"end":2807.1},{"id":162,"text":"And so there's a question of, for meta RL, is there an aggregate MDP?","zh":"因此，对于元强化学习来说，是否存在一个聚合的MDP？","start":2807.96,"end":2814.64},{"id":163,"text":"p. And this would be for meta RL. And in this case, we're not providing z i in the state.","zh":"p。这适用于元强化学习。在这种情况下，我们不会在状态中提供z_i。","start":2814.64,"end":2832.84},{"id":164,"text":"And so there's actually like in","zh":"因此，实际上就像在","start":2833.82,"end":2837.02},{"id":165,"text":"it's actually partially observed.","zh":"它实际上是部分可观测的。","start":2838.46,"end":2839.82},{"id":166,"text":"You don't actually know what the task is.","zh":"你实际上并不知道任务是什么。","start":2840.04,"end":2842.0},{"id":167,"text":"You're trying to explore and figure that out from experience.","zh":"你试图通过经验来探索并弄清楚这一点。","start":2842.08,"end":2844.44},{"id":168,"text":"And so there isn't actually an aggregate MDP that you could think about.","zh":"因此，实际上并不存在一个你可以考虑的聚合马尔可夫决策过程（MDP）。","start":2845.16,"end":2850.16},{"id":169,"text":"Instead, if you wanted to try to aggregate it into a single decision process,","zh":"相反，如果你想尝试将其聚合为一个单一的决策过程，","start":2851.38,"end":2855.3},{"id":170,"text":"it would have to be a partially observed MDP or a POMDP.","zh":"它必须是一个部分可观测马尔可夫决策过程（POMDP）。","start":2855.72,"end":2859.16},{"id":171,"text":"And it's actually a special kind of POMDP where we talked about before","zh":"实际上，这是一种我们之前讨论过的特殊类型的POMDP，","start":2860.26,"end":2866.68},{"id":172,"text":"where you have some sort of partially observed Markov decision process","zh":"其中你拥有一种部分可观测的马尔可夫决策过程","start":2866.68,"end":2870.52},{"id":173,"text":"where you can't actually observe S.","zh":"其中你实际上无法观测到状态S。","start":2870.52,"end":2872.44},{"id":174,"text":"And you have actions.","zh":"你拥有动作。","start":2874.7,"end":2877.16},{"id":175,"text":"And instead of observing S, you observe some observations","zh":"而不是观测到S，你观测到一些观测值","start":2877.26,"end":2882.1},{"id":176,"text":"that are some function of S.","zh":"这些是S的一些函数。","start":2883.16,"end":2885.56},{"id":177,"text":"That would be kind of the general POMDP case.","zh":"这基本上就是一般的POMDP情况。","start":2888.7,"end":2891.44},{"id":178,"text":"One thing that's a little bit special about the meta RL thing is the only thing that you can't observe is what the task is.","zh":"元强化学习的一个特别之处在于，你唯一无法观察的是任务是什么。","start":2891.44,"end":2900.52}],"notes":["本段讨论了元强化学习（Meta RL）中表示的重要性。如果无法有效表示任务，系统将无法泛化到新任务。使用任务索引（如任务1、任务2）虽然可行，但无法实现真正的泛化。相反，通过经验条件（conditioning on experience）可以利用连续状态空间、奖励等信息来处理新任务。","在元强化学习中，表示（representation）是关键。学习一个连续向量（Z）来表示任务，可以提升模型对新任务的适应能力。这种表示方式不同于传统的多任务强化学习（Multitask RL），后者通过扩展状态空间构建聚合MDP（aggregate MDP）。","在元强化学习中，通常不提供任务表示（z_i）作为状态的一部分。因此，系统处于部分可观测状态（partially observed），无法直接观察到任务本身。这与传统的MDP不同，传统MDP中状态是完全可观测的。","元强化学习中的部分可观测性（partially observed）意味着系统需要通过探索来推断任务。这种设置类似于部分可观测马尔可夫决策过程（POMDP），其中状态S无法直接观察，而是通过观察（observations）来间接获取信息。","POMDP中的观察是状态S的某种函数，这与元强化学习中的任务表示类似。系统通过观察来推断任务，而不是直接获取任务信息。这种机制使得元强化学习能够处理任务的不确定性。","元强化学习的一个特殊之处在于，系统无法直接观察到任务本身，只能通过经验来推断任务。这种设置要求模型具备更强的泛化能力和探索策略，以适应未知的任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2730.15,"end":2900.52,"asr_flags":[159],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":2730.15,"text":"If we don't have a good way to represent it, then we're not sure what to pass into the policy. And if we don't have a good way of representing it, we can always resort to just using an index saying this is task one, this is task two, this is task three. But if you do that, and then at test time you say this is task 100,"},{"start":2745.32,"text":"it's not going to be able to generalize in that scenario and do anything about that scenario,"},{"start":2749.64,"text":"about that task. Whereas experience, like conditioning on experience is something"},{"start":2753.9,"text":"that could generalize where it can actually be able to use kind of the more continuous space"},{"start":2759.44,"text":"of states, rewards, and so forth in order to figure out a new task. So it comes down to"},{"start":2765.06,"text":"representations. And you can sort of view this as like learning a Z representation,"},{"start":2769.76,"text":"like learning like a continuous vector that's representing our tasks."},{"start":2773.82,"text":"Now, in Multitask RL, we talked about how if you formulate some state space that corresponds"},{"start":2787.0,"text":"to the original state space and the z vector, then you get this aggregate MDP."},{"start":2794.6,"text":"And so the result of this is still an MDP, just with a new state space and new dynamics to account for this new state space."},{"start":2807.96,"text":"And so there's a question of, for meta RL, is there an aggregate MDP?"},{"start":2814.64,"text":"p. And this would be for meta RL. And in this case, we're not providing z i in the state."},{"start":2833.82,"text":"And so there's actually like in"},{"start":2838.46,"text":"it's actually partially observed."},{"start":2840.04,"text":"You don't actually know what the task is."},{"start":2842.08,"text":"You're trying to explore and figure that out from experience."},{"start":2845.16,"text":"And so there isn't actually an aggregate MDP that you could think about."},{"start":2851.38,"text":"Instead, if you wanted to try to aggregate it into a single decision process,"},{"start":2855.72,"text":"it would have to be a partially observed MDP or a POMDP."},{"start":2860.26,"text":"And it's actually a special kind of POMDP where we talked about before"},{"start":2866.68,"text":"where you have some sort of partially observed Markov decision process"},{"start":2870.52,"text":"where you can't actually observe S."},{"start":2874.7,"text":"And you have actions."},{"start":2877.26,"text":"And instead of observing S, you observe some observations"},{"start":2883.16,"text":"that are some function of S."},{"start":2888.7,"text":"That would be kind of the general POMDP case."},{"start":2891.44,"text":"One thing that's a little bit special about the meta RL thing is the only thing that you can't observe is what the task is."}],"speech_gaps":[{"start":2886.16,"end":2888.3}],"frame":"../frames/v023/017.webp","frame_time":2742.15},{"title":"元强化学习（Meta RL）中的任务识别与策略适应","segments":[{"id":179,"text":"And so it's basically a POMDP where this hidden state space can be defined as the observation and the task identifier.","zh":"因此，这基本上是一个部分可观测马尔可夫决策过程（POMDP），其中隐藏状态空间可以定义为观测值和任务标识符。","start":2901.5,"end":2916.14},{"id":180,"text":"and if you can infer the task identifier from experience then you can essentially view it as","zh":"如果你能从经验中推断出任务标识符，那么你可以将其视为","start":2916.14,"end":2922.1},{"id":181,"text":"a way of trying to infer the underlying state space as a way to solve the POMDP.","zh":"一种尝试推断底层状态空间的方法，以此来解决POMDP问题。","start":2922.1,"end":2928.78},{"id":182,"text":"So this is basically kind of another way of looking at the met RL problem.","zh":"因此，这基本上是另一种看待元强化学习（Meta RL）问题的方式。","start":2930.34,"end":2934.24},{"id":183,"text":"It's basically like a partially observed Markov decision problem.","zh":"它基本上就像一个部分可观测的马尔可夫决策问题。","start":2934.42,"end":2937.02},{"id":184,"text":"And it was actually outputting some distribution over Zs. Because at the very beginning, you actually don't know what Z is. You have some kind of prior belief over what Z is. And then as you get more experience, you're going to have a better and better estimate of what Z is.","zh":"实际上，它输出的是对Z的分布。因为在最开始，你并不知道Z是什么。你对Z有一定的先验信念。随着你获得更多的经验，你对Z的估计会越来越准确。","start":2938.33,"end":2962.47},{"id":185,"text":"And so if you represent a distribution over this kind of latent task representation, then you can do kind of cool things with that. We'll see that in a bit. So this particular algorithm is looking at continuous control problems where different tasks corresponded to walking in different directions, running at different velocities, and also different physical dynamics. So being able to adapt when the friction is different or the inertia of the robot system is different.","zh":"因此，如果你表示一个关于这种潜在任务表示的分布，那么你可以用它做一些很酷的事情。我们稍后会看到这一点。因此，这个特定的算法关注的是连续控制问题，其中不同的任务对应于向不同方向行走、以不同速度奔跑，以及不同的物理动态。因此，当摩擦力或机器人系统的惯性不同时，能够进行适应。","start":2962.88,"end":2991.38},{"id":186,"text":"The other thing was that everything, what we saw before was using like a PPO style algorithm, which is somewhat off policy, but not very off policy. It's kind of more on policy than off policy in some ways, because it's not using a replay buffer of past data. And with meta training algorithms, you can adapt really, really quickly. But the training process might be really slow if your base algorithm is fairly on policy.","zh":"另一个方面是，我们之前看到的所有内容都是使用类似PPO的算法，这种算法在某种程度上是离策略的，但并不是非常离策略。在某些方面，它比离策略更偏向于在策略，因为它不使用过去数据的回放缓冲区。在元训练算法中，你可以非常快速地进行适应。但如果你的基础算法相当在策略，那么训练过程可能会非常缓慢。","start":2992.26,"end":3020.07},{"id":187,"text":"And so as a kind of question, hopefully this should be a straightforward question. If your base algorithm for updating the policy at step four, if that's an off policy algorithm, do you expect that to be more or less efficient than if you used an off policy or than if you used an on policy base method?","zh":"因此，作为一个问题，希望这个问题应该是一个直接的问题。如果你在第四个步骤中用于更新策略的基本算法是一个离策略算法，你期望它比使用离策略或比使用在策略基本方法更高效吗？","start":3021.16,"end":3043.6},{"id":188,"text":"Yeah, more efficient. So if you're using a replay buffer and using that replay buffer to update your policy with memory, that should be a lot more data efficient during this meta training process. At test time when you're adapting, the efficiency is going to be similar. So this is just talking about the efficiency for actually training this sort of in-context learning system.","zh":"是的，更高效。因此，如果你使用了一个回放缓冲区，并利用该回放缓冲区通过记忆来更新策略，这在元训练过程中应该会更加数据高效。在测试时进行适应时，效率将相似。因此，这仅仅是在谈论实际训练这种上下文学习系统时的效率。","start":3044.58,"end":3066.6}],"notes":["本段讲解了元强化学习（Meta RL）中任务识别与策略适应的核心思想。讲者指出，元强化学习可以被视为一种部分可观测马尔可夫决策过程（POMDP），其中隐藏状态空间由观测和任务标识符组成。如果能够从经验中推断出任务标识符，就可以将问题视为对隐藏状态空间的推断，从而解决POMDP问题。","讲者提到，元强化学习算法通常会输出一个关于任务表示（Z）的分布，因为初始时并不知道Z的具体值，而是基于先验信念进行估计。随着经验的积累，对Z的估计会越来越准确。这种分布表示使得算法能够适应不同的任务，例如在不同摩擦力或惯性条件下进行控制。","讲者进一步讨论了元强化学习中使用的算法类型，如PPO（Proximal Policy Optimization）风格的算法。这类算法在策略更新时偏向于在线策略（on-policy），而不是完全的离线策略（off-policy），因为它不使用经验回放缓冲区（replay buffer）。这导致元训练过程可能较慢，但适应过程却非常快速。","讲者提出一个关于策略更新效率的问题，询问如果使用离线策略（off-policy）算法是否比在线策略（on-policy）算法更高效。讲者认为，使用经验回放缓冲区的离线策略在元训练过程中会更高效，因为可以利用历史数据进行策略更新，从而提高数据效率。","在测试阶段，当系统需要适应新任务时，效率与训练阶段类似。讲者强调，这里讨论的效率是指训练过程中的数据效率，而不是测试时的适应效率。","讲者通过具体的例子说明了元强化学习的应用场景，如在不同物理动态条件下进行控制任务，例如行走方向、速度变化或摩擦力变化等。这表明元强化学习能够快速适应不同的任务环境。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2901.5,"end":3066.6,"asr_flags":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":2901.5,"text":"And so it's basically a POMDP where this hidden state space can be defined as the observation and the task identifier."},{"start":2916.14,"text":"and if you can infer the task identifier from experience then you can essentially view it as"},{"start":2922.1,"text":"a way of trying to infer the underlying state space as a way to solve the POMDP."},{"start":2930.34,"text":"So this is basically kind of another way of looking at the met RL problem."},{"start":2934.42,"text":"It's basically like a partially observed Markov decision problem."},{"start":2938.33,"text":"Now, there's a met or all method that we actually talked about. I showed an architecture diagram that was actually explicitly trying to output Zs. And it was actually outputting some distribution over Zs. Because at the very beginning, you actually don't know what Z is. You have some kind of prior belief over what Z is. And then as you get more experience, you're going to have a better and better estimate of what Z is."},{"start":2962.88,"text":"And so if you represent a distribution over this kind of latent task representation, then you can do kind of cool things with that. We'll see that in a bit. So this particular algorithm is looking at continuous control problems where different tasks corresponded to walking in different directions, running at different velocities, and also different physical dynamics. So being able to adapt when the friction is different or the inertia of the robot system is different."},{"start":2992.26,"text":"The other thing was that everything, what we saw before was using like a PPO style algorithm, which is somewhat off policy, but not very off policy. It's kind of more on policy than off policy in some ways, because it's not using a replay buffer of past data. And with meta training algorithms, you can adapt really, really quickly. But the training process might be really slow if your base algorithm is fairly on policy."},{"start":3021.16,"text":"And so as a kind of question, hopefully this should be a straightforward question. If your base algorithm for updating the policy at step four, if that's an off policy algorithm, do you expect that to be more or less efficient than if you used an off policy or than if you used an on policy base method?"},{"start":3044.58,"text":"Yeah, more efficient. So if you're using a replay buffer and using that replay buffer to update your policy with memory, that should be a lot more data efficient during this meta training process. At test time when you're adapting, the efficiency is going to be similar. So this is just talking about the efficiency for actually training this sort of in-context learning system."}],"speech_gaps":[],"frame":"../frames/v023/018.webp","frame_time":2913.5},{"title":"元强化学习（Meta RL）中的数据效率与探索","segments":[{"id":189,"text":"If you look at the curves over this training process right here, the amount of data that you need in order to meta-learn these systems, you can see that in blue, if we're using an off-put policy algorithm with a replay buffer, it's a lot more data efficient, learns a lot more quickly than","zh":"如果你观察这个训练过程中的曲线，为了元学习这些系统所需的数据显示量，你可以看到蓝色部分，如果我们使用一个离策略算法并带有经验回放缓冲区，它在数据效率上要高得多，学习速度也更快，比","start":3068.25,"end":3089.57},{"id":190,"text":"RL squared and, um, and PRMP, which are using, I want to see all three of these are using","zh":"RL squared 和，嗯，还有 PRMP，这些算法使用的","start":3090.97,"end":3096.41},{"id":191,"text":"uh, base algorithms, base RL algorithms that are more on policy and more like PPO, uh, for example.","zh":"嗯，基础算法，即更偏向于在策略的基础强化学习算法，例如 PPO，嗯，比如。","start":3096.45,"end":3102.31},{"id":192,"text":"Yeah. So the question is, um, can I elaborate on what specifically is in the replay buffer?","zh":"是的。那么问题是，嗯，我可以详细说明经验回放缓冲区中具体包含什么吗？","start":3103.19,"end":3106.87},{"id":193,"text":"So, uh, the typically you'll have, um, well, so each replay buffer will have, um,","zh":"所以，嗯，通常你会有，嗯，所以每个经验回放缓冲区会包含，嗯，","start":3107.31,"end":3115.37},{"id":194,"text":"a sequence of episodes.","zh":"一系列的回合（episodes）。","start":3116.85,"end":3118.79},{"id":195,"text":"Basically, each thing in the replay buffer","zh":"基本上，经验回放缓冲区中的每个条目","start":3119.65,"end":3121.43},{"id":196,"text":"will be a sequence of episodes","zh":"都会是一系列的回合（episodes）","start":3121.43,"end":3122.41},{"id":197,"text":"from a given MDP.","zh":"从给定的马尔可夫决策过程（MDP）中。","start":3122.41,"end":3124.15},{"id":198,"text":"And that includes the states,","zh":"这包括状态、","start":3125.71,"end":3129.37},{"id":199,"text":"the actions, the rewards.","zh":"动作、奖励。","start":3129.55,"end":3131.03},{"id":200,"text":"And when you optimize this,","zh":"当你优化这个时，","start":3132.25,"end":3134.01},{"id":201,"text":"you'll need to...","zh":"你需要...","start":3134.15,"end":3134.73},{"id":202,"text":"Oftentimes, you'll have a different replay buffer per task","zh":"通常，你会为每个任务拥有一个不同的回放缓冲区","start":3134.73,"end":3137.17},{"id":203,"text":"so that you can sample a task here","zh":"以便你可以在这里采样一个任务","start":3137.17,"end":3138.63},{"id":204,"text":"and then optimize the reward for that task","zh":"然后优化该任务的奖励","start":3138.63,"end":3141.81},{"id":205,"text":"using the memory from that trajectory.","zh":"使用该轨迹的记忆。","start":3143.03,"end":3146.97},{"id":206,"text":"Typically, the buffer, instead of just storing states and actions,","zh":"通常，缓冲区不仅仅存储状态和动作，","start":3148.75,"end":3151.33},{"id":207,"text":"you're storing full trajectories together","zh":"你还会存储完整的轨迹。","start":3151.43,"end":3152.97},{"id":208,"text":"because you're going to be training a model with memory.","zh":"因为你要用记忆来训练一个模型。","start":3152.97,"end":3155.95},{"id":209,"text":"And you need to be able to provide that trajectory as input to the policy.","zh":"你需要能够将该轨迹作为输入提供给策略。","start":3156.15,"end":3161.45},{"id":210,"text":"Cool.","zh":"不错。","start":3163.01,"end":3163.53},{"id":211,"text":"So summary so far.","zh":"到目前为止的总结。","start":3163.79,"end":3165.03},{"id":212,"text":"We've talked about using these models to be able to adapt to new MDPs.","zh":"我们已经讨论了使用这些模型来适应新的马尔可夫决策过程（MDPs）。","start":3165.43,"end":3171.07},{"id":213,"text":"They're general, they're quite expressive, and there's also a variety of choices in the architecture.","zh":"它们是通用的，表达能力很强，并且在架构选择上也有多种可能性。","start":3171.54,"end":3177.84},{"id":214,"text":"One thing is that are hard to optimize because it needs to figure out how to adapt from data. And there's lots of different input features here that you could try to pay attention to. And the model has to figure out what about those input videos that you're passing as input for the maze navigation is useful when you're then trying to exploit and learn a policy.","zh":"其中一件事是它们很难进行优化，因为需要从数据中学习如何适应。而且这里有大量的输入特征，你可以尝试关注其中的某些部分。模型必须弄清楚，在将这些输入视频传递给迷宫导航任务时，哪些信息是有用的，以便之后进行利用和学习策略。","start":3178.92,"end":3201.72},{"id":215,"text":"Because you're passing in so many things as input in such a big model, it can be hard to optimize for that reason.","zh":"由于你在一个很大的模型中输入了如此多的内容，因此因此优化起来会很困难。","start":3203.32,"end":3208.18},{"id":216,"text":"And it can also be hard to optimize from an exploration standpoint, which we'll talk about right after this.","zh":"从探索的角度来看，优化也会很困难，我们稍后会讨论这一点。","start":3208.36,"end":3212.26},{"id":217,"text":"And then the sample efficiency of the meta-learning process is going to be inherited from whatever optimizer you use in this last step right here.","zh":"然后，元学习过程的样本效率将继承自你在最后一步所使用的优化器。","start":3213.0,"end":3223.26},{"id":218,"text":"And so if you use something like vanilla policy gradient, it'll be extremely data inefficient.","zh":"如果你使用像普通策略梯度（vanilla policy gradient）这样的方法，它将极其数据低效。","start":3224.0,"end":3228.52},{"id":219,"text":"If you use something like PPO, it'll be more stable.","zh":"如果你使用像PPO这样的方法，它将更加稳定。","start":3228.82,"end":3231.46},{"id":220,"text":"but still fairly inefficient.","zh":"但仍然相当低效。","start":3231.46,"end":3234.14},{"id":221,"text":"If you use something like SAC,","zh":"如果你使用像SAC这样的方法，","start":3234.32,"end":3235.78},{"id":222,"text":"it will be probably a lot more efficient.","zh":"它可能会更加高效。","start":3236.04,"end":3238.44},{"id":223,"text":"You might need to tune the hyperparameters more.","zh":"你可能需要更仔细地调整超参数。","start":3238.62,"end":3240.84},{"id":224,"text":"So now let's talk a bit about exploration.","zh":"现在让我们稍微谈谈探索。","start":3241.96,"end":3244.14}],"notes":["本段讲解了元强化学习（Meta RL）中数据效率的问题，指出使用离线策略算法（如基于回放缓冲区的算法）比使用在线策略算法（如RL squared和PRMP）更高效，能够更快地学习。同时，提到这些算法通常基于更基础的策略梯度方法，如PPO。","回放缓冲区（replay buffer）存储的是任务的序列，包括状态、动作和奖励。每个任务可能有独立的回放缓冲区，以便在优化奖励时使用该任务的轨迹数据。","回放缓冲区通常存储完整的轨迹，而不是单独的状态和动作，因为模型需要将这些轨迹作为输入来训练具有记忆能力的策略。","在元强化学习中，模型需要从大量输入数据中学习如何适应新的任务，这使得优化变得困难。此外，由于输入数据量大，模型可能难以有效利用这些信息。","探索（exploration）是元强化学习中的另一个挑战，因为模型需要在大量数据中找到有用的信息来学习策略。这可能会影响样本效率。","元强化学习的样本效率取决于最后一步使用的优化器。例如，使用普通策略梯度（vanilla policy gradient）会导致极低的数据效率，而使用PPO则更稳定，但仍然不够高效。SAC（Soft Actor-Critic）可能更高效，但需要调整超参数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3068.25,"end":3244.14,"asr_flags":[],"translation_complete":true,"translated_segments":36,"raw_segments":[{"start":3068.25,"text":"If you look at the curves over this training process right here, the amount of data that you need in order to meta-learn these systems, you can see that in blue, if we're using an off-put policy algorithm with a replay buffer, it's a lot more data efficient, learns a lot more quickly than"},{"start":3090.97,"text":"RL squared and, um, and PRMP, which are using, I want to see all three of these are using,"},{"start":3096.45,"text":"uh, base algorithms, base RL algorithms that are more on policy and more like PPO, uh, for example."},{"start":3103.19,"text":"Yeah. So the question is, um, can I elaborate on what specifically is in the replay buffer?"},{"start":3107.31,"text":"So, uh, the typically you'll have, um, well, so each replay buffer will have, um,"},{"start":3116.85,"text":"a sequence of episodes."},{"start":3119.65,"text":"Basically, each thing in the replay buffer"},{"start":3121.43,"text":"will be a sequence of episodes"},{"start":3122.41,"text":"from a given MDP."},{"start":3125.71,"text":"And that includes the states,"},{"start":3129.55,"text":"the actions, the rewards."},{"start":3132.25,"text":"And when you optimize this,"},{"start":3134.15,"text":"you'll need to..."},{"start":3134.73,"text":"Oftentimes, you'll have a different replay buffer per task"},{"start":3137.17,"text":"so that you can sample a task here"},{"start":3138.63,"text":"and then optimize the reward for that task"},{"start":3143.03,"text":"using the memory from that trajectory."},{"start":3148.75,"text":"Typically, the buffer, instead of just storing states and actions,"},{"start":3151.43,"text":"you're storing full trajectories together"},{"start":3152.97,"text":"because you're going to be training a model with memory."},{"start":3156.15,"text":"And you need to be able to provide that trajectory as input to the policy."},{"start":3163.01,"text":"Cool."},{"start":3163.79,"text":"So summary so far."},{"start":3165.43,"text":"We've talked about using these models to be able to adapt to new MDPs."},{"start":3171.54,"text":"They're general, they're quite expressive, and there's also a variety of choices in the architecture."},{"start":3178.92,"text":"One thing is that are hard to optimize because it needs to figure out how to adapt from data. And there's lots of different input features here that you could try to pay attention to. And the model has to figure out what about those input videos that you're passing as input for the maze navigation is useful when you're then trying to exploit and learn a policy."},{"start":3203.32,"text":"Because you're passing in so many things as input in such a big model, it can be hard to optimize for that reason."},{"start":3208.36,"text":"And it can also be hard to optimize from an exploration standpoint, which we'll talk about right after this."},{"start":3213.0,"text":"And then the sample efficiency of the meta-learning process is going to be inherited from whatever optimizer you use in this last step right here."},{"start":3224.0,"text":"And so if you use something like vanilla policy gradient, it'll be extremely data inefficient."},{"start":3228.82,"text":"If you use something like PPO, it'll be more stable."},{"start":3231.46,"text":"but still fairly inefficient."},{"start":3234.32,"text":"If you use something like SAC,"},{"start":3236.04,"text":"it will be probably a lot more efficient."},{"start":3238.62,"text":"You might need to tune the hyperparameters more."},{"start":3241.96,"text":"So now let's talk a bit about exploration."}],"speech_gaps":[],"frame":"../frames/v023/019.webp","frame_time":3080.25},{"title":"元强化学习（Meta RL）中的探索与利用","segments":[{"id":225,"text":"By exploration, I mean like exploration in context,","zh":"所谓探索，指的是在特定情境下的探索","start":3244.68,"end":3248.7},{"id":226,"text":"exploration when you're trying to explore a new task.","zh":"当你试图探索一个新任务时的探索","start":3248.78,"end":3253.9},{"id":227,"text":"What we've talked about so far","zh":"到目前为止，我们所讨论的内容","start":3254.94,"end":3256.34},{"id":228,"text":"is trying to optimize end-to-end","zh":"是尝试进行端到端优化","start":3256.34,"end":3257.92},{"id":229,"text":"for exploration and exploitation","zh":"以实现探索与利用","start":3257.92,"end":3260.34},{"id":230,"text":"exploitation with respect to the final sum of rewards.","zh":"利用是相对于最终奖励总和进行的","start":3260.34,"end":3263.16},{"id":231,"text":"The simple and principle, it can actually yield the optimal","zh":"简单且基本的原则，实际上可以产生最优的","start":3265.0,"end":3268.06},{"id":232,"text":"exploration-exploitation trade-off because you're optimizing directly for some of the","zh":"探索与利用的权衡，因为你是直接针对某些","start":3268.06,"end":3271.96},{"id":233,"text":"sum of rewards. And that's really, really nice. But it can be a really","zh":"奖励的总和。这真的非常棒。但这也可能是一个非常","start":3271.96,"end":3276.3},{"id":234,"text":"challenging optimization. And let's talk about why that's the case.","zh":"具有挑战性的优化问题。让我们来谈谈为什么会出现这种情况。","start":3276.3,"end":3279.58},{"id":235,"text":"So let's look at a","zh":"所以让我们看一个","start":3280.16,"end":3284.26},{"id":236,"text":"running example. So say that you have","zh":"运行中的例子。假设你有一个","start":3284.26,"end":3286.14},{"id":237,"text":"some robot that looks like this and the robot needs to find something and there are some","zh":"看起来像这样的机器人，而机器人需要找到某样东西，有一些","start":3286.14,"end":3298.94},{"id":238,"text":"hallways that the robot might need to go down in order to try to find the thing that is trying to","zh":"走廊，机器人可能需要走下去以尝试找到它所寻找的东西。","start":3298.94,"end":3309.0},{"id":239,"text":"And different tasks correspond to different locations of the object that it's trying to find. So in one task or one scenario, it might be all the way over here. In another scenario, it might be over here, and so forth. And to help the robot out a little bit, we're going to introduce one other thing, which is that there's going to be some piece of paper over here. And that paper actually says,","zh":"不同的任务对应于机器人试图找到的对象的不同位置。所以在一个任务或一个场景中，它可能位于这里。在另一个场景中，它可能位于那里，依此类推。为了帮助机器人一点，我们将引入另一个东西，即这里有一张纸。这张纸实际上写着","start":3309.74,"end":3336.59},{"id":240,"text":"where the object is in words. Maybe it's trying to find a replacement light bulb or something like that, and it says the light bulb is in the fourth hallway at the end. Here's our robot. Here are the hallways. Different tasks correspond to navigating to the ends of the different halls. We have some information about where to go. If we look at that,","zh":"物体的位置，用文字表示。也许它正在寻找一个替换的灯泡，或者其他类似的东西，而它写着灯泡位于第四条走廊的尽头。这里是我们的机器人。这里是走廊。不同的任务对应于导航到不同走廊的尽头。我们有一些关于去哪的信息。如果我们看一下，","start":3338.23,"end":3363.23},{"id":241,"text":"information will be in the state about where the reward is for this task. Now, how do we actually learn how to explore? So say that we were trying to collect trajectories and trying to learn how to explore such that we can get good behavior. So let's start with a scenario where we sample the task and","zh":"信息将包含有关此任务中奖励位置的状态。那么，我们实际上是如何学习如何探索的呢？假设我们正在尝试收集轨迹，并学习如何探索，以便获得良好的行为。让我们从一个场景开始，其中我们采样任务并","start":3364.82,"end":3393.2},{"id":242,"text":"maybe the task was to go to the end of this hallway right here. And say that we collected a, we actually kind of just got lucky. We collected a trajectory that just went straight to that reward. Now, in some ways that seems good because we got reward for that. And so that gave us some reward. And that's like optimizing the objective that we care about ultimately.","zh":"也许任务是到达此处走廊的尽头。假设我们收集了一个轨迹，我们实际上只是运气不错。我们收集的轨迹直接前往了那个奖励。在某种程度上，这看起来是好的，因为我们获得了奖励。因此，这给了我们一些奖励。这类似于最终我们关心的目标的优化。","start":3393.99,"end":3422.37}],"notes":["本段讨论了元强化学习中探索与利用的平衡问题。讲者指出，通过直接优化奖励总和，可以实现最优的探索与利用权衡。然而，这种优化过程可能具有挑战性，因为需要在探索新任务和利用已有知识之间找到合适的平衡。","讲者通过一个机器人寻找物品的示例来说明问题。不同任务对应于物品在不同位置，机器人需要根据任务信息导航到目标位置。这种任务结构强调了元学习中对任务间共性的学习能力。","在示例中，讲者提到机器人可能通过纸条获得关于物品位置的信息。这种信息在任务状态中体现，有助于机器人更快地找到目标。这说明了元强化学习中如何利用任务间的先验知识来加速学习过程。","讲者进一步说明了如何通过收集轨迹来学习探索策略。在某些情况下，机器人可能通过一次成功的轨迹获得奖励，从而优化其探索策略。这种直接优化奖励总和的方法在元强化学习中具有重要意义。","讲者强调了探索与利用之间的权衡问题。直接优化奖励总和虽然有效，但可能面临优化难度大的问题。这反映了元强化学习中需要解决的核心挑战之一。","讲者通过具体例子说明了元强化学习的应用场景，即机器人在不同任务中导航到目标位置。这种任务结构为元学习提供了丰富的学习机会，同时也带来了探索与利用的复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3244.68,"end":3422.37,"asr_flags":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":3244.68,"text":"By exploration, I mean like exploration in context,"},{"start":3248.78,"text":"exploration when you're trying to explore a new task."},{"start":3254.94,"text":"What we've talked about so far"},{"start":3256.34,"text":"is trying to optimize end-to-end"},{"start":3257.92,"text":"for exploration and exploitation"},{"start":3260.34,"text":"exploitation with respect to the final sum of rewards."},{"start":3265.0,"text":"The simple and principle, it can actually yield the optimal"},{"start":3268.06,"text":"exploration-exploitation trade-off because you're optimizing directly for some of the"},{"start":3271.96,"text":"sum of rewards. And that's really, really nice. But it can be a really"},{"start":3276.3,"text":"challenging optimization. And let's talk about why that's the case."},{"start":3280.16,"text":"So let's look at a"},{"start":3284.26,"text":"running example. So say that you have"},{"start":3286.14,"text":"some robot that looks like this and the robot needs to find something and there are some"},{"start":3298.94,"text":"hallways that the robot might need to go down in order to try to find the thing that is trying to"},{"start":3309.74,"text":"And different tasks correspond to different locations of the object that it's trying to find. So in one task or one scenario, it might be all the way over here. In another scenario, it might be over here, and so forth. And to help the robot out a little bit, we're going to introduce one other thing, which is that there's going to be some piece of paper over here. And that paper actually says,"},{"start":3338.23,"text":"where the object is in words. Maybe it's trying to find a replacement light bulb or something like that, and it says the light bulb is in the fourth hallway at the end. Here's our robot. Here are the hallways. Different tasks correspond to navigating to the ends of the different halls. We have some information about where to go. If we look at that,"},{"start":3364.82,"text":"information will be in the state about where the reward is for this task. Now, how do we actually learn how to explore? So say that we were trying to collect trajectories and trying to learn how to explore such that we can get good behavior. So let's start with a scenario where we sample the task and"},{"start":3393.99,"text":"maybe the task was to go to the end of this hallway right here. And say that we collected a, we actually kind of just got lucky. We collected a trajectory that just went straight to that reward. Now, in some ways that seems good because we got reward for that. And so that gave us some reward. And that's like optimizing the objective that we care about ultimately."}],"speech_gaps":[],"frame":"../frames/v023/020.webp","frame_time":3256.68},{"title":"元强化学习中的探索与利用策略","segments":[{"id":243,"text":"But the thing that's bad about this is that the robot got lucky, and it doesn't actually know how to repeat that in the future because it didn't actually explore any other alternatives. And so this is going to be, the way that we can kind of do this is if it goes to the end of the correct hallway, it'll get positive reward, but the context leading up to getting that positive reward","zh":"但问题在于，机器人这次是靠运气成功的，它实际上并不知道如何在未来重复这种成功，因为它并没有探索其他任何替代方案。因此，我们可以通过这样的方式来做这件事：如果它走到正确的走廊尽头，就会获得正奖励，但导致获得这个正奖励的上下文环境","start":3424.24,"end":3450.62},{"id":244,"text":"doesn't actually look different than any other task. It kind of went through here, and there's nothing that kind of differentiates what it did there, which was like zero reward, zero reward, than if the task, for example, had been to go here or to go here. And as a result, it didn't actually learn how to explore, and it didn't learn how to use exploration information in order to solve the task.","zh":"实际上看起来和其他任务没有任何不同。它只是走过这里，而这里并没有什么能够区分它之前所做的事情，即零奖励、零奖励，与如果任务是比如走到这里或走到那里时的不同。因此，它实际上并没有学会如何探索，也没有学会如何利用探索信息来解决任务。","start":3451.28,"end":3475.16},{"id":245,"text":"And so this trajectory might not actually be very helpful for learning how to explore and learning how to exploit. Now let's say that we had a different trajectory. So we're exploring. And let's say that the agent, instead of doing that, it maybe sampled the same task, and it went to the end of this trajectory and then continued, didn't see that, and then went to the end.","zh":"因此，这条轨迹可能对学习如何探索和学习如何利用并没有太大帮助。现在假设我们有一个不同的轨迹。我们正在探索。假设智能体没有这样做，而是采样了相同的任务，走到这条轨迹的尽头，然后继续，没有看到那个，再走到另一条轨迹的尽头。","start":3475.64,"end":3506.15},{"id":246,"text":"of this trajectory. So that would be good in the sense that it does actually have, like, it did kind of rule out, it has experience that ruled out one task, and then it got reward for a different task. And so it's going to be teaching it something about an exploration strategy that works. The downside is that exploration strategy is quite suboptimal, because it would have been a lot more efficient to first look at the instructions and then go to the correct position.","zh":"这条轨迹的尽头。从这个意义上说，它实际上排除了一个任务，并且在另一个任务上获得了奖励。因此，它会教给智能体一种有效的探索策略。缺点是这种探索策略相当次优，因为更有效率的做法是先查看指示，再走到正确的位置。","start":3506.72,"end":3536.43},{"id":247,"text":"And so it's somewhat good, somewhat bad. It provides signal on a suboptimal exploration and exploitation strategy. And so it's perhaps better than the first trajectory that it did, but still not ideal. Now let's consider a third trajectory. Say that we are, again, collecting data for the meta RL process. And let's say that the agent...","zh":"因此，它既有好处也有坏处。它提供了关于次优探索和利用策略的信号。因此，它可能比它之前做的第一条轨迹更好，但仍然不是理想的。现在让我们考虑第三条轨迹。假设我们再次为元强化学习过程收集数据。假设智能体……","start":3537.24,"end":3565.28},{"id":248,"text":"decided to look at the instructions and then just stay and watch the instructions. Does anyone have thoughts on whether that would be a useful trajectory or not for the learning process? Yeah, exactly. So it did something useful, but it doesn't get any reward for that. It only gets reward if it did that and then went here. And so that's also not going to be very useful for the learning problem.","zh":"决定查看指令，然后只是停留并观看指令。有没有人认为这会是学习过程中有用的轨迹呢？是的，没错。它做了有用的事情，但并没有因此获得任何奖励。它只有在执行了这些操作并前往此处时才会获得奖励。因此，这对于学习问题也不是非常有用。","start":3566.72,"end":3595.02}],"notes":["本段讨论了元强化学习（Meta RL）中探索与利用策略的重要性。讲者指出，如果智能体仅依赖偶然的成功经验，而没有探索其他可能性，那么它将无法学习到有效的探索策略。这种情况下，智能体无法区分不同任务之间的差异，因此无法学习如何利用探索信息来解决问题。","讲者进一步说明，如果智能体采取了不同的探索策略，例如尝试多个任务并获得不同奖励，那么它将获得关于探索策略的有用信息。然而，这种策略可能效率较低，因为智能体没有先查看任务指示，而是直接尝试任务，这可能导致不必要的探索。","讲者还提到，如果智能体选择先查看任务指示，然后停留在指示上，这可能是一种有用的策略，但不会获得奖励。因此，这种策略虽然有助于理解任务，但无法直接促进学习过程。","讲者通过不同轨迹的对比，强调了在元强化学习中，探索与利用之间的平衡至关重要。有效的探索策略需要在尝试不同任务和利用已有信息之间找到合适的平衡点，以提高学习效率。","讲者指出，智能体在学习过程中需要从不同轨迹中提取有用的信息，以改进其探索和利用策略。然而，如果轨迹中没有明确的奖励信号，那么这些信息可能无法被有效利用。","最后，讲者通过提问的方式引导学生思考，强调了在元强化学习中，如何设计有效的探索策略是关键问题之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3424.24,"end":3595.02,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3424.24,"text":"But the thing that's bad about this is that the robot got lucky, and it doesn't actually know how to repeat that in the future because it didn't actually explore any other alternatives. And so this is going to be, the way that we can kind of do this is if it goes to the end of the correct hallway, it'll get positive reward, but the context leading up to getting that positive reward"},{"start":3451.28,"text":"doesn't actually look different than any other task. It kind of went through here, and there's nothing that kind of differentiates what it did there, which was like zero reward, zero reward, than if the task, for example, had been to go here or to go here. And as a result, it didn't actually learn how to explore, and it didn't learn how to use exploration information in order to solve the task."},{"start":3475.64,"text":"And so this trajectory might not actually be very helpful for learning how to explore and learning how to exploit. Now let's say that we had a different trajectory. So we're exploring. And let's say that the agent, instead of doing that, it maybe sampled the same task, and it went to the end of this trajectory and then continued, didn't see that, and then went to the end."},{"start":3506.72,"text":"of this trajectory. So that would be good in the sense that it does actually have, like, it did kind of rule out, it has experience that ruled out one task, and then it got reward for a different task. And so it's going to be teaching it something about an exploration strategy that works. The downside is that exploration strategy is quite suboptimal, because it would have been a lot more efficient to first look at the instructions and then go to the correct position."},{"start":3537.24,"text":"And so it's somewhat good, somewhat bad. It provides signal on a suboptimal exploration and exploitation strategy. And so it's perhaps better than the first trajectory that it did, but still not ideal. Now let's consider a third trajectory. Say that we are, again, collecting data for the meta RL process. And let's say that the agent..."},{"start":3566.72,"text":"decided to look at the instructions and then just stay and watch the instructions. Does anyone have thoughts on whether that would be a useful trajectory or not for the learning process? Yeah, exactly. So it did something useful, but it doesn't get any reward for that. It only gets reward if it did that and then went here. And so that's also not going to be very useful for the learning problem."}],"speech_gaps":[],"frame":"../frames/v023/021.webp","frame_time":3436.24},{"title":"元强化学习（Meta RL）中的探索与利用问题","segments":[{"id":249,"text":"Basically, in a problem like this, you're only going to actually be learning something useful about how to explore and exploit if you successfully did the proper exploration behavior and then did the exploitation behavior. If you do them in separate episodes, then you're not actually getting good learning signal.","zh":"基本上，在这类问题中，你只有在成功执行了适当的探索行为，然后执行利用行为时，才能真正学到有关如何探索和利用的有用信息。如果你在不同的回合中分别执行这些行为，那么你实际上不会获得良好的学习信号。","start":3597.32,"end":3617.55},{"id":250,"text":"And that means that you sort of have this kind of sample complexity where you need to actually get lucky and do both of the two things at the same time in order to get signal that helps you learn the problem. So basically, it's hard to learn how to explore and exploit at the same time. Another example of this is say that you're trying to learn how to cook. You have data in previous kitchens. Your goal is to then be able to quickly learn how to cook in a new kitchen. Now, in order to learn how to cook, you need to find the ingredients.","zh":"这意味着你有一种样本复杂度的问题，你需要实际幸运地同时完成这两件事，才能获得有助于学习问题的信号。因此，基本上，同时学习如何探索和利用是困难的。另一个例子是，你试图学习如何烹饪。你有之前厨房的数据。你的目标是能够在新的厨房中快速学习如何烹饪。为了学习如何烹饪，你需要找到食材。","start":3618.6,"end":3650.49},{"id":251,"text":"And if you haven't yet figured out how to find the ingredients because you have bad exploration, then you can't
