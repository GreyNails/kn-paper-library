</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 13 元强化学习（Meta RL） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v023.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v023","title":"Lecture 13 元强化学习（Meta RL）","course":"强化学习","pages":[{"title":"元强化学习（Meta RL）与目标条件强化学习","segments":[{"id":0,"text":"Okay, let's get started. Cool. So as a recap of last week, we talked about multitask reinforcement learning and how we might want to have reinforcement learning agents not learn just one task, but multiple different things that might correspond to multiple different reward functions. And we saw that we can formulate an aggregated MVP that encapsulates all the different tasks where you...","zh":"好的，我们开始吧。酷。作为上周的回顾，我们讨论了多任务强化学习，以及我们可能希望强化学习代理不仅仅学习一个任务，而是学习多个不同的事情，这些事情可能对应多个不同的奖励函数。我们看到，我们可以构建一个聚合的MVP，它封装了所有不同的任务，其中...","start":5.2,"end":31.82},{"id":1,"text":"now are augmenting your state with some sort of task descriptor, like a prompt or a goal or just an index corresponding to what they should do. And the way that this worked is we'd sample some task, kind of run the policy in the MDP for that task, sample another task, and so forth. And we would then get a policy that could be able to successfully","zh":"现在我们正在用某种任务描述符来增强状态，比如提示、目标或仅仅是一个索引，表示它们应该做什么。这种做法的工作方式是，我们采样一个任务，然后在该任务的MDP中运行策略，采样另一个任务，依此类推。然后我们就能得到一个策略，该策略能够在多个不同的MDP中实现高奖励，或者从另一种角度来看，是一个带有增强状态的单一聚合MDP。这将与元强化学习有所不同，我们稍后在这节课中会看到一些差异。我们还简要地提到了目标条件强化学习。","start":32.19,"end":61.07},{"id":2,"text":"achieve high reward in a number of different MDPs, or in another way to view it, a single aggregated MDP with this augmented state. This is going to be a little bit different from meta-RL, so we'll see some differences here later in this lecture. And we also somewhat briefly talked about goal-conditioned reinforcement learning.","zh":"它也可以简单地被视为多任务强化学习的一个特例，其中每个任务都试图达到一个目标状态，而任务描述符对应于该目标状态。因此，如果您的状态是图像，例如，那么您将把当前图像和目标图像作为输入传递给策略，并试图达到该目标图像。或者，如果您的状态是一个向量，您将输入两个向量。","start":62.08,"end":84.76},{"id":3,"text":"It could just be simply viewed as a special case of multitask reinforcement learning, where each task is trying to reach a goal state, and the task descriptor corresponds to that goal state. And so if your states are images, for example, then now you'll be passing as input to the policy both the current image and the goal image, and you'll be trying to reach that goal image. Or if your state, for example, is a vector, you'll be passing in two vectors.","zh":"每个任务都试图达到某个目标状态。如果您有离散状态或连续状态，您可以构造不同的奖励函数，例如是否达到了该目标或接近该目标。这种目标条件强化学习的公式的一个优点是，您可以实际上在……","start":86.52,"end":112.18},{"id":4,"text":"And each of the tasks is trying to reach some goal state. And you can construct different reward functions if you have discrete states or continuous states as some sort of, did you kind of reach that goal or reach close to that goal? And one of the things that's kind of nice about this goal conditioned formulation of reinforcement learning is that you can actually do it in a...","zh":"并且每个任务都在尝试达到某个目标状态。如果你有离散状态或连续状态，你可以构造不同的奖励函数，比如你是否达到了那个目标状态，或者是否接近那个目标状态？并且，这种目标条件强化学习的 formulation 之一是相当不错的，因为你可以实际上在……","start":112.96,"end":134.38},{"id":5,"text":"self-supervised way. You don't need task descriptors. You don't need a different set of tasks that you've manually defined. You can just use a bunch of different states as kind of the tasks themselves. And a lot of different tasks can be formulated as goal-reaching tasks. One thing to note here is it can be pretty hard to train, but you'll be experimenting with a simple goal-conditioned reinforcement learning setting in your homework.","zh":"通过自监督的方式。你不需要任务描述符。你也不需要手动定义的不同任务集合。你只需要使用一系列不同的状态作为任务本身。许多不同的任务都可以被表述为目标到达任务。需要注意的一点是，这种方法可能相当难以训练，但在你的作业中，你将实验一种简单的目标条件强化学习设置。","start":134.94,"end":160.3}],"notes":["本段讲解了目标条件强化学习（Goal-Conditioned Reinforcement Learning）作为多任务强化学习的一个特例，其中每个任务的目标是达到某个特定状态。任务描述符对应于目标状态，输入到策略中的状态包括当前状态和目标状态。","在状态为图像的情况下，策略会同时接收当前图像和目标图像作为输入，并尝试达到目标图像。如果状态是向量，则输入两个向量，每个任务的目标是达到某个目标状态。","目标条件强化学习的一个优点是可以通过自监督的方式进行训练，不需要手动定义任务描述符或不同的任务集，而是直接使用不同的状态作为任务本身。","目标条件强化学习可以适用于离散状态或连续状态，通过构造不同的奖励函数来衡量是否达到目标或接近目标。这种形式的强化学习在训练上可能较为困难，但将在作业中进行简单实现。","目标条件强化学习与元强化学习（Meta RL）有所不同，后者关注的是学习如何快速适应新任务，而目标条件强化学习更侧重于在给定目标的情况下完成任务。","在本段中，讲者提到目标条件强化学习可以被视为一种自监督的学习方式，这为后续的元强化学习提供了基础概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":160.3,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5.2,"text":"Okay, let's get started. Cool. So as a recap of last week, we talked about multitask reinforcement learning and how we might want to have reinforcement learning agents not learn just one task, but multiple different things that might correspond to multiple different reward functions. And we saw that we can formulate an aggregated MVP that encapsulates all the different tasks where you..."},{"start":32.19,"text":"now are augmenting your state with some sort of task descriptor, like a prompt or a goal or just an index corresponding to what they should do. And the way that this worked is we'd sample some task, kind of run the policy in the MDP for that task, sample another task, and so forth. And we would then get a policy that could be able to successfully"},{"start":62.08,"text":"achieve high reward in a number of different MDPs, or in another way to view it, a single aggregated MDP with this augmented state. This is going to be a little bit different from meta-RL, so we'll see some differences here later in this lecture. And we also somewhat briefly talked about goal-conditioned reinforcement learning."},{"start":86.52,"text":"It could just be simply viewed as a special case of multitask reinforcement learning, where each task is trying to reach a goal state, and the task descriptor corresponds to that goal state. And so if your states are images, for example, then now you'll be passing as input to the policy both the current image and the goal image, and you'll be trying to reach that goal image. Or if your state, for example, is a vector, you'll be passing in two vectors."},{"start":112.96,"text":"And each of the tasks is trying to reach some goal state. And you can construct different reward functions if you have discrete states or continuous states as some sort of, did you kind of reach that goal or reach close to that goal? And one of the things that's kind of nice about this goal conditioned formulation of reinforcement learning is that you can actually do it in a..."},{"start":134.94,"text":"self-supervised way. You don't need task descriptors. You don't need a different set of tasks that you've manually defined. You can just use a bunch of different states as kind of the tasks themselves. And a lot of different tasks can be formulated as goal-reaching tasks. One thing to note here is it can be pretty hard to train, but you'll be experimenting with a simple goal-conditioned reinforcement learning setting in your homework."}],"speech_gaps":[],"frame":"../frames/v023/001.webp","frame_time":17.2},{"title":"元强化学习（Meta RL）概述","segments":[{"id":6,"text":"Okay, so for today, we're going to be talking about meta-reinforcement learning, and specifically we'll be talking about what that problem statement looks like, and a class of meta-RL methods that I like to refer to as black box meta-RL methods. We'll start to get into what these methods look like and also some of the challenges that they face. So what's the problem? Why do we care about meta-RL? Why not just do vanilla RL?","zh":"好的，今天我们将讨论元强化学习（Meta RL），特别是我们将探讨这个问题陈述是什么样子的，以及我倾向于称为黑盒元强化学习方法的一类元强化学习方法。我们将开始了解这些方法的结构，以及它们所面临的一些挑战。那么问题是什么？为什么我们关心元强化学习？为什么不直接使用普通的强化学习（vanilla RL）呢？","start":162.01,"end":189.17},{"id":7,"text":"Say that you're trying to figure out how to operate a coffee, an espresso machine that you've never used before. If you wanted to do that,","zh":"假设你试图弄清楚如何操作一台你从未使用过的咖啡机，一台浓缩咖啡机。如果你想做到这一点，","start":190.56,"end":200.92},{"id":8,"text":"Well, first, if you wanted kind of a robot or a reinforcement learning agent to do that, it would probably take a lot of data, a lot of attempts to try to figure out how to make coffee. Because it's a pretty complicated task, lots of different steps involved. You have to do those steps in sequence. And also, the reward signal that you get for this sort of task probably isn't going to be super detailed. But as a human, if you were to attempt this task,","zh":"首先，如果你想让一个机器人或强化学习代理来完成这个任务，它可能需要大量的数据和大量的尝试，才能弄清楚如何制作咖啡。因为这是一个相当复杂的任务，涉及许多不同的步骤。你必须按顺序完成这些步骤。此外，你在这个任务中获得的奖励信号可能不会非常详细。但作为一个人，如果你尝试这个任务，","start":202.43,"end":228.16},{"id":9,"text":"Probably, if you had a little bit of instruction or some previous experience making espresso, then you could probably learn it in minutes, or maybe even less than a minute. So if you think about reinforcement learning, this gap between how quickly a human could learn something and how slowly it would take a reinforcement learning system to learn it, this is rather unsatisfying. And if we think about what is the difference between a person and a reinforcement learning system,","zh":"可能，如果你有一些指导或之前使用其他方式或机器制作浓缩咖啡的经验，你可能几分钟就能学会，甚至可能不到一分钟。因此，如果你考虑强化学习，这种人类学习速度与强化学习系统学习速度之间的差距，这让人感到相当不满意。如果我们思考人类与强化学习系统之间的差异，","start":230.26,"end":259.97},{"id":10,"text":"One of the big differences is that people aren't starting from scratch. People already know how to move objects around with their hands. They might already know how to make coffee in other ways or with other machines. And they can leverage that experience and also some notion of semantic knowledge of what to do if someone tells you to pick up a cup and put it somewhere or to turn a knob. And it can leverage that previous experience in order to solve this problem.","zh":"一个主要的差异是，人们并不是从零开始的。人们已经知道如何用手移动物体。他们可能已经知道如何用其他方式或机器制作咖啡。他们可以利用这些经验，以及一些关于语义知识的概念，例如有人告诉你拿起杯子放到某个地方或转动旋钮时，他们知道该怎么做。他们可以利用这些先前的经验来解决这个问题。","start":261.39,"end":287.79},{"id":11,"text":"really, really quickly in compared to training a reinforcement learning system from scratch. And so experience with similar tasks, other espresso making machines, either espresso making on other machines or just general like motor control, following instructions, that sort of thing can be very useful when trying to solve a new task.","zh":"实际上，相比从头开始训练一个强化学习系统，这真的非常快。因此，拥有类似任务的经验，比如其他咖啡机的使用，无论是其他机器上的浓缩咖啡制作，还是更一般的电机控制、遵循指令等，这些都对解决新任务非常有用。","start":288.62,"end":308.41},{"id":12,"text":"And I mentioned this as a kind of example with espresso making, but this sort of framework of not starting from scratch is really general. So it applies to robotics problems where you're facing a new environment or facing a new task, but it's also really faced by...","zh":"我以浓缩咖啡制作为例提到了这一点，但这种不从头开始的框架其实非常通用。因此，它适用于机器人问题中面对新环境或新任务的情况，但也同样适用于……","start":309.49,"end":326.91}],"notes":["本段讨论了元强化学习（Meta RL）的动机，即人类在面对新任务时能够利用已有经验快速学习，而传统强化学习系统则需要大量数据和尝试。这突出了元强化学习在减少学习时间方面的优势。","讲者通过咖啡机操作的例子说明了传统强化学习的局限性，即需要大量数据和尝试才能完成复杂任务，而人类可以通过已有经验快速掌握。","讲者指出，人类在执行任务时并非从零开始，而是利用了已有的知识和经验，例如手部操作、遵循指令等，这与强化学习系统从头开始学习形成对比。","讲者强调，元强化学习的目标是让系统能够利用类似任务的经验，从而在面对新任务时更快地适应和学习。","讲者提到，这种框架不仅适用于咖啡机操作，也适用于更广泛的机器人任务和新环境，表明元强化学习具有普遍适用性。","讲者指出，元强化学习方法的一个关键点是利用先前经验，这可以显著减少新任务的学习时间，提高系统的适应能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":162.01,"end":326.91,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":162.01,"text":"Okay, so for today, we're going to be talking about meta-reinforcement learning, and specifically we'll be talking about what that problem statement looks like, and a class of meta-RL methods that I like to refer to as black box meta-RL methods. We'll start to get into what these methods look like and also some of the challenges that they face. So what's the problem? Why do we care about meta-RL? Why not just do vanilla RL?"},{"start":190.56,"text":"Say that you're trying to figure out how to operate a coffee, an espresso machine that you've never used before. If you wanted to do that,"},{"start":202.43,"text":"Well, first, if you wanted kind of a robot or a reinforcement learning agent to do that, it would probably take a lot of data, a lot of attempts to try to figure out how to make coffee. Because it's a pretty complicated task, lots of different steps involved. You have to do those steps in sequence. And also, the reward signal that you get for this sort of task probably isn't going to be super detailed. But as a human, if you were to attempt this task,"},{"start":230.26,"text":"Probably, if you had a little bit of instruction or some previous experience making espresso, then you could probably learn it in minutes, or maybe even less than a minute. So if you think about reinforcement learning, this gap between how quickly a human could learn something and how slowly it would take a reinforcement learning system to learn it, this is rather unsatisfying. And if we think about what is the difference between a person and a reinforcement learning system,"},{"start":261.39,"text":"One of the big differences is that people aren't starting from scratch. People already know how to move objects around with their hands. They might already know how to make coffee in other ways or with other machines. And they can leverage that experience and also some notion of semantic knowledge of what to do if someone tells you to pick up a cup and put it somewhere or to turn a knob. And it can leverage that previous experience in order to solve this problem."},{"start":288.62,"text":"really, really quickly in compared to training a reinforcement learning system from scratch. And so experience with similar tasks, other espresso making machines, either espresso making on other machines or just general like motor control, following instructions, that sort of thing can be very useful when trying to solve a new task."},{"start":309.49,"text":"And I mentioned this as a kind of example with espresso making, but this sort of framework of not starting from scratch is really general. So it applies to robotics problems where you're facing a new environment or facing a new task, but it's also really faced by..."}],"speech_gaps":[],"frame":"../frames/v023/002.webp","frame_time":174.01},{"title":"元强化学习（Meta RL）的概念与迁移学习","segments":[{"id":13,"text":"many reinforcement learning systems. As another example, say you want to solve a challenging math problem that you haven't solved before. If you have experience solving previous math problems, then you can use that to more quickly solve a new problem because you've learned some sort of strategies that you might be able to apply to the new scenario. Okay. We're framing this question of can reinforcement learning algorithms leverage experience from previous tasks?","zh":"许多强化学习系统。例如，假设你想解决一个之前从未解决过的具有挑战性的数学问题。如果你有解决之前数学问题的经验，那么你可以利用这些经验更快地解决新问题，因为你已经学习了一些策略，这些策略可能可以应用到新的情境中。好的。我们的问题是：强化学习算法是否能够利用之前任务的经验？","start":327.56,"end":352.95},{"id":14,"text":"in order to learn a new task with less data and less experience. In many ways, this problem is thought of as a transfer learning problem, where we want to transfer knowledge and information experience from previous tasks to new tasks. And there's a few different formulations and a few different kind of problem settings that the research community has thought about. One is...","zh":"为了用更少的数据和更少的经验学习新任务。在许多方面，这个问题被视为一种迁移学习问题，其中我们希望将之前任务的知识、信息和经验转移到新任务上。研究社区已经考虑了多种不同的表述和问题设置。其中一种是……","start":353.72,"end":380.45},{"id":15,"text":"Kind of a fairly simple setup where you learn one task and then want to learn a new task. And you can just, for example, train on one task and then fine-tune on the new task. And notions of fine-tuning that we use in supervised learning are also applicable to reinforcement learning settings, where you could fine-tune a Q function to a new task or fine-tune a policy to a new task. Although, for this to work well, the tasks need to be quite similar to each other.","zh":"一种相对简单的设置，你学习一个任务，然后想要学习一个新任务。例如，你可以先在一个任务上进行训练，然后在新任务上进行微调。我们在监督学习中使用的微调概念也适用于强化学习设置，你可以微调一个Q函数以适应新任务，或者微调一个策略以适应新任务。不过，为了使这种方法有效，这些任务需要彼此非常相似。","start":382.22,"end":408.87},{"id":16,"text":"We also talked about multitask learning, and you could also use multitask learning for transfer to new tasks. And in particular, if your task, if your prompt shares some structure, if it kind of exhibits, if it's just like a task one, task two, task three, transfer is going to be harder. But if it's something that has a lot of structure, like pick up a water bottle, pick up a phone, pick up a pen, and so forth, then...","zh":"我们还讨论了多任务学习，你也可以使用多任务学习来迁移至新任务。特别是，如果你的任务提示具有某种结构，如果它类似于任务一、任务二、任务三，那么迁移将会更加困难。但如果它具有大量结构，例如拿起水瓶、拿起手机、拿起笔等，那么……","start":411.05,"end":436.47},{"id":17,"text":"you might actually be able to have things transfer what's called zero-shot without any new experience at all, simply by passing that prompt to the system and having it kind of act according to that prompt. And then meta-learning is often concerned with, instead of zero-shot transfer, something that's called few-shot transfer, where with a little bit of experience, a few examples, or a few trials of the task, can you adapt to that task?","zh":"你实际上可能能够实现所谓的零样本迁移，而无需任何新的经验，只需将该提示传递给系统，并让它根据该提示进行操作。而元学习通常关注的是，而不是零样本迁移，一种称为少样本迁移的情况，即通过少量经验、几个示例或几次任务尝试，是否能够适应该任务？","start":437.06,"end":466.67},{"id":18,"text":"And essentially the difference between multitask learning and meta-learning is that it accounts for the fact that we're going to be trying to adapt with a small amount of data. And it does that during the kind of original training process. And another way of thinking about this is that instead of having the task descriptor be like a prompt or an index, the task descriptor might actually be a data set itself, like a set of trials that you're going to be adapting to in the context of some policy.","zh":"本质上，多任务学习与元学习之间的区别在于，它考虑了我们要用少量数据进行适应这一事实。它在原始的训练过程中实现这一点。另一种思考方式是，任务描述符不再是像提示或索引这样的东西，而可能实际上是一个数据集本身，例如一组你将在某些策略的背景下适应的试验。","start":468.77,"end":496.53},{"id":19,"text":"Another word for this is sometimes in context learning or few-shot learning. Now for this to work, for the first scenario to work, you must have very similar source and target tasks.","zh":"这种学习方式有时也被称为上下文学习或少样本学习。为了使这种情况起作用，为了第一种情况起作用，你必须拥有非常相似的源任务和目标任务。","start":497.64,"end":505.89}],"notes":["本段讨论了迁移学习在强化学习中的应用，特别是如何利用先前任务的经验来加速新任务的学习。讲者以解决数学问题为例，说明经验如何帮助快速适应新问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":327.56,"end":505.89,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":327.56,"text":"many reinforcement learning systems. As another example, say you want to solve a challenging math problem that you haven't solved before. If you have experience solving previous math problems, then you can use that to more quickly solve a new problem because you've learned some sort of strategies that you might be able to apply to the new scenario. Okay. We're framing this question of can reinforcement learning algorithms leverage experience from previous tasks?"},{"start":353.72,"text":"in order to learn a new task with less data and less experience. In many ways, this problem is thought of as a transfer learning problem, where we want to transfer knowledge and information experience from previous tasks to new tasks. And there's a few different formulations and a few different kind of problem settings that the research community has thought about. One is..."},{"start":382.22,"text":"Kind of a fairly simple setup where you learn one task and then want to learn a new task. And you can just, for example, train on one task and then fine-tune on the new task. And notions of fine-tuning that we use in supervised learning are also applicable to reinforcement learning settings, where you could fine-tune a Q function to a new task or fine-tune a policy to a new task. Although, for this to work well, the tasks need to be quite similar to each other."},{"start":411.05,"text":"We also talked about multitask learning, and you could also use multitask learning for transfer to new tasks. And in particular, if your task, if your prompt shares some structure, if it kind of exhibits, if it's just like a task one, task two, task three, transfer is going to be harder. But if it's something that has a lot of structure, like pick up a water bottle, pick up a phone, pick up a pen, and so forth, then..."},{"start":437.06,"text":"you might actually be able to have things transfer what's called zero-shot without any new experience at all, simply by passing that prompt to the system and having it kind of act according to that prompt. And then meta-learning is often concerned with, instead of zero-shot transfer, something that's called few-shot transfer, where with a little bit of experience, a few examples, or a few trials of the task, can you adapt to that task?"},{"start":468.77,"text":"And essentially the difference between multitask learning and meta-learning is that it accounts for the fact that we're going to be trying to adapt with a small amount of data. And it does that during the kind of original training process. And another way of thinking about this is that instead of having the task descriptor be like a prompt or an index, the task descriptor might actually be a data set itself, like a set of trials that you're going to be adapting to in the context of some policy."},{"start":497.64,"text":"Another word for this is sometimes in context learning or few-shot learning. Now for this to work, for the first scenario to work, you must have very similar source and target tasks."}],"speech_gaps":[],"frame":"../frames/v023/003.webp","frame_time":339.56},{"title":"元强化学习（Meta RL）中的少样本学习概念","segments":[{"id":20,"text":"Whereas in some ways, things get a little bit easier and a little bit harder for number two and number three. They get easier in the sense that you no longer have to have an extremely similar task. You instead just need to have a distribution of tasks and be similar to that distribution, such that conceivably the new task that you're trying to solve should be within the distribution of the tasks that you've seen during training.","zh":"在某些方面，对于第二和第三点来说，事情既变得更简单也变得更困难。变得更简单在于你不再需要有一个极其相似的任务。相反，你只需要有一个任务分布，并且与该分布相似，使得理论上你试图解决的新任务应该包含在训练期间所见过的任务分布中。","start":507.05,"end":530.55},{"id":21,"text":"It gets a little bit harder because you do actually need a number of training tasks, not just a single training task, in order to get effective transfer. Okay. Before we jump into meta-RL, let's just look at a couple of few-shot learning examples outside of RL, and then go back to the RL setting. So actually, I picked this example just so that it's not trivial. There's other test data points that are much, much easier.","zh":"它变得更困难是因为你实际上需要多个训练任务，而不仅仅是单个训练任务，才能实现有效的迁移。好的，在我们深入元强化学习之前，让我们先看一下一些非强化学习中的少样本学习示例，然后再回到强化学习的设置中。实际上，我选择这个例子只是为了不让它变得太简单。还有其他测试数据点要容易得多。","start":531.95,"end":556.08},{"id":22,"text":"Cool. So that's kind of the essence of a few shot image classification problem, where you have a small number of data points, and your goal is to classify a new data point.","zh":"很好。这就是少样本图像分类问题的核心，你拥有一小数量的数据点，而你的目标是分类一个新的数据点。","start":556.61,"end":565.07},{"id":23,"text":"And typically, if you were to train from scratch on just six images, you'd have no hope of being able to learn a classifier, especially on high-dimensional images. But the way that meta-learning works is you can construct other tasks for the machine learning system to solve that have a similar structure, like other image classification tasks, train it to be able to take as input a training data set and a query image.","zh":"通常，如果你只是用六张图像从头开始训练，你几乎不可能学习到一个分类器，尤其是在高维图像上。但元学习的工作方式是，你可以为机器学习系统构造其他具有相似结构的任务，例如其他图像分类任务，训练它能够将训练数据集和查询图像作为输入。","start":567.2,"end":590.54},{"id":24,"text":"or our test input and then predict a label and basically constructing each of these few-shot learning problems as a data point themselves. Now, another example of few-shot learning outside of reinforcement learning is in-context learning in large language models.","zh":"或者我们的测试输入，然后预测一个标签，基本上将每个这样的少样本学习问题本身构造为一个数据点。另一个非强化学习中的少样本学习示例是在大型语言模型中的上下文学习。","start":591.43,"end":610.17},{"id":25,"text":"And what this looks like is, here's just one example. There's lots of examples of different tasks you could do. In this case, the goal is given a sentence that's kind of poor English input, like I eated the purple berries. Output, good English input, like I ate the purple berries. It gives it, in this case, I think, four or three different examples of input outputs.","zh":"这看起来像什么？这里只是一个例子。有很多不同任务的示例。在这种情况下，目标是给定一个语法不正确的英文句子，例如“I eated the purple berries”，输出一个正确的英文句子，例如“I ate the purple berries”。在这种情况下，它给出了四或三个不同的输入输出示例。","start":610.81,"end":633.13},{"id":26,"text":"This is the training data set, and the goal is for a new input to be able to predict a good output for that example. So here's another example of a few-shot learning problem. And again, language models get things that kind of look like this during training. One thing that's a little bit special about language models is that this sort of in-context learning","zh":"这是训练数据集，目标是让新的输入能够预测该示例的一个良好输出。因此，这里又是一个少样本学习问题的例子。同样，在训练过程中，语言模型会接触到类似这样的情况。语言模型的一个特别之处在于这种上下文学习（in-context learning）","start":634.21,"end":654.69},{"id":27,"text":"You don't explicitly set up your training data set exactly to match all of this. And it turns out that a lot of the statistics of data on the internet leads to this ability to react to these few-shot examples effectively. This is actually just a base model. I think this is from GPT-3. And so even without any additional supervised training, you get something like this. It's not perfect. It doesn't work all the time. But this is another example of few-shot learning.","zh":"你并不会显式地将训练数据集设置成完全匹配所有这些内容。实际上，互联网上的大量数据统计特性使得模型能够有效地应对这些少样本示例。这实际上只是一个基础模型。我想这是来自GPT-3的。因此，即使没有任何额外的监督训练，你也能得到类似这样的结果。它并不完美，不是总能奏效。但这又是少样本学习的一个例子。","start":655.32,"end":681.78}],"notes":["本段讲解了元强化学习（Meta RL）中少样本学习（few-shot learning）的基本概念，强调了在元学习中，模型需要处理多个任务，而不是单一任务，以实现有效的迁移学习。这与传统强化学习不同，传统方法通常需要大量数据来学习一个特定任务。","讲者通过图像分类和语言模型中的例子，说明了少样本学习的典型应用场景。在图像分类中，模型需要在少量样本的情况下学习分类器，而在语言模型中，模型通过上下文学习（in-context learning）来完成任务。","讲者提到，语言模型在训练过程中会接触到大量数据，这些数据的统计特性使得模型能够有效地处理少量示例。这种能力并不依赖于额外的监督训练，而是基于模型在训练过程中学到的通用模式。","讲者指出，虽然这种少样本学习方法在某些情况下表现良好，但它并不是完美的，有时可能无法正确处理所有情况。这表明，尽管少样本学习在某些任务中非常有效，但仍然存在局限性。","讲者通过具体的例子，如将错误的英文句子转换为正确的句子，展示了语言模型如何利用上下文信息进行预测。这种能力是语言模型在训练过程中自然获得的，而不是通过显式的任务设计。","讲者强调，少样本学习的核心在于模型能够从少量示例中提取通用的模式，并将其应用于新的任务。这种能力使得模型在面对新任务时，不需要大量的训练数据，从而提高了学习效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":507.05,"end":681.78,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":507.05,"text":"Whereas in some ways, things get a little bit easier and a little bit harder for number two and number three. They get easier in the sense that you no longer have to have an extremely similar task. You instead just need to have a distribution of tasks and be similar to that distribution, such that conceivably the new task that you're trying to solve should be within the distribution of the tasks that you've seen during training."},{"start":531.95,"text":"It gets a little bit harder because you do actually need a number of training tasks, not just a single training task, in order to get effective transfer. Okay. Before we jump into meta-RL, let's just look at a couple of few-shot learning examples outside of RL, and then go back to the RL setting. So actually, I picked this example just so that it's not trivial. There's other test data points that are much, much easier."},{"start":556.61,"text":"Cool. So that's kind of the essence of a few shot image classification problem, where you have a small number of data points, and your goal is to classify a new data point."},{"start":567.2,"text":"And typically, if you were to train from scratch on just six images, you'd have no hope of being able to learn a classifier, especially on high-dimensional images. But the way that meta-learning works is you can construct other tasks for the machine learning system to solve that have a similar structure, like other image classification tasks, train it to be able to take as input a training data set and a query image."},{"start":591.43,"text":"or our test input and then predict a label and basically constructing each of these few-shot learning problems as a data point themselves. Now, another example of few-shot learning outside of reinforcement learning is in-context learning in large language models."},{"start":610.81,"text":"And what this looks like is, here's just one example. There's lots of examples of different tasks you could do. In this case, the goal is given a sentence that's kind of poor English input, like I eated the purple berries. Output, good English input, like I ate the purple berries. It gives it, in this case, I think, four or three different examples of input outputs."},{"start":634.21,"text":"This is the training data set, and the goal is for a new input to be able to predict a good output for that example. So here's another example of a few-shot learning problem. And again, language models get things that kind of look like this during training. One thing that's a little bit special about language models is that this sort of in-context learning"},{"start":655.32,"text":"You don't explicitly set up your training data set exactly to match all of this. And it turns out that a lot of the statistics of data on the internet leads to this ability to react to these few-shot examples effectively. This is actually just a base model. I think this is from GPT-3. And so even without any additional supervised training, you get something like this. It's not perfect. It doesn't work all the time. But this is another example of few-shot learning."}],"speech_gaps":[],"frame":"../frames/v023/004.webp","frame_time":519.05},{"title":"元强化学习（Meta RL）中的快速适应与训练数据构建","segments":[{"id":28,"text":"And then in each of these examples, you can think of the goal as trying to train this sort of model that takes as input a training dataset and a new example X and makes a prediction for that example based on both X and on the training data.","zh":"然后，在每一个这样的例子中，你可以将目标视为训练一种模型，该模型以训练数据集和一个新的示例X作为输入，并基于X和训练数据对这个示例做出预测。","start":683.57,"end":699.14},{"id":29,"text":"Yeah, so the question is, in context learning in LLMs, typically you achieve this sort of model and this sort of few-shot learning through prompting by putting the data set in as context or as part of the prompt into the model. Is that also how it works in meta-RL? Generally, yes, we're going to be looking at that case in meta-RL. There are actually other methods where you can accomplish this with...","zh":"是的，因此问题在于，在LLMs中的上下文学习中，通常通过提示（prompting）来实现这种模型和少量样本学习，即将数据集作为上下文或提示的一部分输入到模型中。这在元强化学习（meta-RL）中是否也适用？一般来说，是的，我们将在元强化学习中探讨这种情况。实际上，还有其他方法可以通过……","start":700.0,"end":722.32},{"id":30,"text":"well, actually with gradient updates as well, or with something that looks like nearest neighbors, the most successful method in meta-RL looks like prompting. And so that's what we'll be talking about today. Now let's look at a meta-RL example. So say that we want to navigate mazes. And so our goal is we want to solve a new maze.","zh":"实际上，也可以通过梯度更新，或者看起来像最近邻的方法来实现这一点。在元强化学习中，最成功的方法看起来像是提示（prompting）。因此，今天我们将讨论这个话题。现在让我们看一个元强化学习的例子。假设我们想要在迷宫中导航。因此，我们的目标是解决一个新的迷宫。","start":722.58,"end":749.68},{"id":31,"text":"And we're an agent that's in this maze. We actually don't even see this top-down view. Maybe we just have a first-person perspective. And our goal is, because this is a reinforcement learning problem, it's not just about outputting a label. It's actually also about collecting experience in the environment. And so...","zh":"我们是一个处于迷宫中的智能体。我们甚至看不到这种俯视图。也许我们只是有第一人称视角。我们的目标是，因为这是一个强化学习问题，它不仅仅是输出一个标签。实际上，它还涉及在环境中收集经验。因此……","start":751.8,"end":769.2},{"id":32,"text":"Kind of the goal is we'd like to be able to very quickly solve a reinforcement learning problem. And we'll frame this as collecting a very small training data set of one episode or a few episodes. In this case, it's kind of exploring the maze, trying to find where the goal is. And eventually, it kind of starts in the middle right here, explores over here, and eventually goes to the goal right here.","zh":"目标大致是，我们希望非常快速地解决一个强化学习问题。我们将这个目标框架为收集一个非常小的训练数据集，包含一个或几个回合的经验。在这种情况下，它类似于在迷宫中探索，尝试找到目标的位置。最终，它会从这里中间开始探索，然后到这边，最后到达这里的目标位置。","start":769.94,"end":790.28},{"id":33,"text":"After we explore, we'd like to be able to have a policy that is able to solve the maze. In this case, just with a single episode of experience. Again, if you were to do this sort of thing from scratch, that tries to use just a single episode of experience to get a policy that can solve the task, this would be very, very hard.","zh":"在探索之后，我们希望拥有一个能够解决迷宫的策略。在这种情况下，仅仅通过一个回合的经验。再次强调，如果你从头开始尝试这样做，即试图仅使用一个回合的经验来获得一个能够完成任务的策略，这将是非常、非常困难的。","start":793.05,"end":813.13},{"id":34,"text":"Instead, the way that meta-RL frames this is by trying to construct examples and try to construct a set of training environments that facilitates this fast adaptation. Now, in comparison to the supervised learning scenarios, like I mentioned, we're now going to be faced with this exploration problem. We're not just given a training dataset and then make a prediction based on that training dataset. We're actually constructing the training dataset ourselves.","zh":"相反，元强化学习（meta-RL）的处理方式是尝试构建示例，并尝试构建一组训练环境，以促进这种快速适应。现在，与我之前提到的监督学习场景相比，我们将面临探索问题。我们不再只是被提供一个训练数据集，然后基于该训练数据集进行预测。我们实际上是在自己构建训练数据集。","start":813.86,"end":841.79}],"notes":["本段讨论了元强化学习（Meta RL）中快速适应的问题，强调了与大型语言模型（LLMs）中的上下文学习和少样本学习的相似性。在LLMs中，通常通过提示（prompting）将数据集作为上下文或提示的一部分输入模型，以实现模型的快速学习。在Meta RL中，虽然也有类似的方法，但更强调通过构造训练环境和示例来实现快速适应。","在Meta RL中，目标是通过收集少量的训练数据（如一个或几个episode）来快速解决任务。例如，在迷宫导航任务中，智能体需要通过探索迷宫来找到目标。这种探索过程类似于在监督学习中使用少量数据进行预测，但Meta RL需要智能体自己构造训练数据。","在Meta RL中，构造训练数据的过程涉及构建多个训练环境，以帮助智能体快速适应新的任务。这与监督学习不同，因为监督学习通常直接提供训练数据，而Meta RL需要智能体自己探索并收集数据。","Meta RL的一个关键挑战是探索问题。智能体需要在环境中进行探索，以收集足够的经验来构建有效的策略。这与传统的监督学习不同，后者通常假设训练数据已经存在。","在Meta RL中，快速适应意味着智能体能够在极短的时间内利用少量经验来解决新的任务。这需要智能体具备强大的泛化能力，能够从有限的数据中学习到有效的策略。","Meta RL的框架强调了构造训练环境和示例的重要性，以促进智能体的快速适应。这种方法与传统的监督学习不同，后者通常依赖于固定的训练数据集。"],"formulas":[],"uncertainties":[],"diagram":"none","start":683.57,"end":841.79,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":683.57,"text":"And then in each of these examples, you can think of the goal as trying to train this sort of model that takes as input a training dataset and a new example X and makes a prediction for that example based on both X and on the training data."},{"start":700.0,"text":"Yeah, so the question is, in context learning in LLMs, typically you achieve this sort of model and this sort of few-shot learning through prompting by putting the data set in as context or as part of the prompt into the model. Is that also how it works in meta-URL? Generally, yes, we're going to be looking at that case in meta-URL. There are actually other methods where you can accomplish this with..."},{"start":722.58,"text":"well, actually with gradient updates as well, or with something that looks like nearest neighbors, the most successful method in meta-RL looks like prompting. And so that's what we'll be talking about today. Now let's look at a meta-RL example. So say that we want to navigate mazes. And so our goal is we want to solve a new maze."},{"start":751.8,"text":"And we're an agent that's in this maze. We actually don't even see this top-down view. Maybe we just have a first-person perspective. And our goal is, because this is a reinforcement learning problem, it's not just about outputting a label. It's actually also about collecting experience in the environment. And so..."},{"start":769.94,"text":"Kind of the goal is we'd like to be able to very quickly solve a reinforcement learning problem. And we'll frame this as collecting a very small training data set of one episode or a few episodes. In this case, it's kind of exploring the maze, trying to find where the goal is. And eventually, it kind of starts in the middle right here, explores over here, and eventually goes to the goal right here."},{"start":793.05,"text":"After we explore, we'd like to be able to have a policy that is able to solve the maze. In this case, just with a single episode of experience. Again, if you were to do this sort of thing from scratch, that tries to use just a single episode of experience to get a policy that can solve the task, this would be very, very hard."},{"start":813.86,"text":"Instead, the way that meta-oral frames this is by trying to construct examples and try to construct a set of training environments that facilitates this fast adaptation. Now, in comparison to the supervised learning scenarios, like I mentioned, we're now going to be faced with this exploration problem. We're not just given a training dataset and then make a prediction based on that training dataset. We're actually constructing the training dataset ourselves."}],"speech_gaps":[],"frame":"../frames/v023/005.webp","frame_time":695.57},{"title":"元强化学习（Meta RL）的基本概念与应用场景","segments":[{"id":35,"text":"through exploration. And we need to figure out how best to trade off between exploring in the environment versus being able to then solve the task. And how much time we should spend exploring versus trying to exploit what we know about the environment. So this is our goal. This is what we'd like to be able to do at test time. We'd like to be able to quickly learn a new maze.","zh":"通过探索。我们需要弄清楚如何在环境中的探索与之后解决任务之间取得最佳平衡。以及我们应该花费多少时间进行探索，而不是尝试利用我们对环境的已知信息。这就是我们的目标。这是我们希望在测试时能够做到的事情。我们希望快速学习一个新的迷宫。","start":843.2,"end":868.16},{"id":36,"text":"Then to set our agent up for success at meta training time, before we try to adapt to a new maze, we'll try to learn how to efficiently explore and solve many other MDPs that are related. In this case, they can be other mazes like this and so forth. And these are each of the tasks that we'll be training on in order to adapt to a new maze.","zh":"为了在元训练时为我们的智能体设定成功的基础，在尝试适应新的迷宫之前，我们会尝试学习如何高效地探索和解决许多相关的MDPs。在这种情况下，它们可以是其他迷宫，如图所示。这些就是我们将训练的任务，以便适应新的迷宫。","start":869.23,"end":891.93},{"id":37,"text":"The other thing, I guess one key assumption here is that you need to have, like these new MDPs can't be completely different from the MDPs that you saw before. And the way that we can think about that is we should have some sort of distribution over tasks. And these new MDPs that we're trying to adapt to should be within the distribution of tasks that we saw during training.","zh":"另一个关键假设是，这些新的MDPs不能完全与之前看到的MDPs不同。我们可以这样思考：我们应该有一种任务的分布。我们试图适应的新MDPs应该位于我们在训练期间看到的任务分布之内。","start":895.52,"end":919.96},{"id":38,"text":"Maze navigation is like one example of a meta-RL task. There's lots of other scenarios as well. So one useful scenario that we've seen in robotics is being able to adapt very quickly to different trains, different slopes for legged robot systems. This is actually a really small legged robot.","zh":"迷宫导航是元强化学习任务的一个例子。还有许多其他场景。在机器人领域，我们已经看到一个有用的场景是能够快速适应不同的火车、不同坡度的腿部机器人系统。这实际上是一个非常小的腿部机器人。","start":922.86,"end":945.12},{"id":39,"text":"But it's also applicable to larger robots as well. And sometimes you might actually be training on different environments in simulation and then adapting in the real world as just another environment.","zh":"但它同样适用于更大的机器人。有时你可能实际上是在模拟环境中训练不同的环境，然后在现实世界中适应，就像另一个环境一样。","start":947.01,"end":958.11},{"id":40,"text":"You could also have object manipulation as different tasks as well in manipulation scenarios. And then there's also a number of language modeling scenarios where this is quite applicable. One example where meta-RL has been relevant is adapting to different users with different preferences, where you give examples of the kinds of things, the kinds of responses that they want in context.","zh":"你也可以在操作场景中将物体操作视为不同的任务。此外，还有许多语言建模场景，这同样适用。元强化学习相关的一个例子是适应具有不同偏好的用户，在上下文中给出他们希望得到的响应类型和内容的例子。","start":959.98,"end":986.78},{"id":41,"text":"And we'll also later see an example in reasoning as well. Yeah, so the question is, what is the key difference between... this sort of meta-RL approach and transfer learning where you're training and then fine-tuning. And there's a couple of ways to view it. One is that during this kind of training process, you're actually explicitly optimizing for transferability. You're optimizing for the ability to adapt with a small data set.","zh":"我们之后还会在推理中看到一个例子。是的，所以问题是，这种元强化学习方法与迁移学习有什么关键区别，后者是在训练后进行微调。有几个方法可以来看待这一点。一种是，在这种训练过程中，你实际上是在显式地优化可迁移性。你是在优化以小数据集进行适应的能力。","start":987.24,"end":1006.5}],"notes":["本段主要讨论元强化学习（Meta RL）的基本假设，即新任务不能与训练时遇到的任务完全不同，而是应属于训练任务的分布范围内。这种假设确保了模型在面对新任务时能够有效迁移知识。","元强化学习的应用场景包括机器人导航、物体操作、语言建模和推理等。例如，在机器人领域，元强化学习可以用于快速适应不同地形或不同类型的机器人系统。","与迁移学习相比，元强化学习强调在训练过程中显式优化迁移能力，特别是在小数据集上进行适应。这种优化目标使得模型在面对新任务时能够更高效地学习。","在语言建模中，元强化学习可以用于适应不同用户的偏好，通过提供用户期望的响应示例来调整模型行为。","元强化学习的核心思想是通过在多个相关任务上进行训练，使模型具备快速适应新任务的能力，而不仅仅是单个任务的优化。","元强化学习与迁移学习的关键区别在于，前者在训练过程中直接优化迁移能力，而后者通常是在训练后进行微调。"],"formulas":[],"uncertainties":[],"diagram":"none","start":843.2,"end":1006.5,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":843.2,"text":"through exploration. And we need to figure out how best to trade off between exploring in the environment versus being able to then solve the task. And how much time we should spend exploring versus trying to exploit what we know about the environment. So this is our goal. This is what we'd like to be able to do at test time. We'd like to be able to quickly learn a new maze."},{"start":869.23,"text":"Then to set our agent up for success at meta training time, before we try to adapt to a new maze, we'll try to learn how to efficiently explore and solve many other MDPs that are related. In this case, they can be other mazes like this and so forth. And these are each of the tasks that we'll be training on in order to adapt to a new maze."},{"start":895.52,"text":"Cool. The other thing, I guess one key assumption here is that you need to have, like these new MDPs can't be completely different from the MDPs that you saw before. And the way that we can think about that is we should have some sort of distribution over tasks. And these new MDPs that we're trying to adapt to should be within the distribution of tasks that we saw during training. Okay."},{"start":922.86,"text":"Maze navigation is like one example of a meta-RL task. There's lots of other scenarios as well. So one useful scenario that we've seen in robotics is being able to adapt very quickly to different trains, different slopes for legged robot systems. This is actually a really small legged robot."},{"start":947.01,"text":"But it's also applicable to larger robots as well. And sometimes you might actually be training on different environments in simulation and then adapting in the real world as just another environment."},{"start":959.98,"text":"You could also have object manipulation as different tasks as well in manipulation scenarios. And then there's also a number of language modeling scenarios where this is quite applicable. One example where meta-URL has been relevant is adapting to different users with different preferences, where you give examples of the kinds of things, the kinds of responses that they want in context. And we'll also later see an example in reasoning as well. Yeah, so the question is, what is the key difference between..."},{"start":987.24,"text":"this sort of meta-RL approach and transfer learning where you're training and then fine-tuning. And there's a couple of ways to view it. One is that during this kind of training process, you're actually explicitly optimizing for transferability. You're optimizing for the ability to adapt with a small data set."}],"speech_gaps":[],"frame":"../frames/v023/006.webp","frame_time":855.2},{"title":"元强化学习（Meta RL）的概念与任务设定","segments":[{"id":42,"text":"And as a result of that, you can get much faster transfer. You can use a much smaller data set. And there are examples of like if you use fine tuning versus if you use like few shot in context learning or a few shot adaptation, you can get much more efficient transfer. And yeah, so you get much greater efficiency. And the way that you get that is by providing the algorithm with.","zh":"因此，你可以获得更快的迁移效果。你可以使用一个更小的数据集。例如，如果你使用微调，而不是在上下文学习或少量样本适应中使用少量样本，你可以获得更高效的迁移效果。是的，因此你能够获得更大的效率。你获得这种效率的方式是通过向算法提供多个不同的训练任务，而不是仅仅提供一个你从中获取的训练任务。","start":1007.0,"end":1032.7},{"id":43,"text":"a number of different training tasks rather than just one training task that you're feeding off of. Okay. So slightly more formally, we've talked about multitask learning where you try to solve multiple tasks at once. You might try to transfer to a new task from that, but you're not optimizing for transferability. With transfer learning, you're trying to solve some target task after solving some source task, typically by fine-tuning.","zh":"稍微更正式地说，我们已经讨论过多任务学习，其中你试图同时解决多个任务。你可能会尝试从这些任务中迁移到新任务，但你并不是在优化迁移性。在迁移学习中，你通常是在解决某个源任务之后，再解决某个目标任务，通常通过微调来实现。","start":1033.45,"end":1062.15},{"id":44,"text":"Whereas in the meta-learning problem, we have experience from some training tasks, and we want to very quickly solve a new task.","zh":"而在元学习问题中，我们有一些来自不同训练任务的经验，我们希望非常快速地解决一个新任务。","start":1063.0,"end":1072.3},{"id":45,"text":"And in the reinforcement learning scenario, these tasks are going to be MDPs, each with their own state-space actions-based dynamics reward. And there is this kind of nice, we see kind of meta-learning and supervised learning, and there's also this kind of a nice analogy between the two, where the main difference with meta-URL is this exploration challenge. Okay. And then...","zh":"在强化学习的场景中，这些任务将是马尔可夫决策过程（MDPs），每个都有自己的状态空间、基于动作的动力学和奖励。我们看到元学习和监督学习之间有一种相当不错的类比关系，其中元学习与监督学习的主要区别在于探索挑战。好的，然后……","start":1074.09,"end":1100.15},{"id":46,"text":"Diving into some notation here, we can view the meta-RL problem as basically being able to, with a small amount of experience, be able to learn a policy that can solve the task, and also to be able to collect this experience itself. And so this training data, there's two different variants of the meta-RL problem. In the first case, this can correspond to multiple rollouts from some exploration policy.","zh":"现在深入一些符号表示，我们可以将元强化学习问题视为基本上能够通过少量经验学习一个可以解决任务的策略，同时也能自己收集这种经验。因此，这种训练数据，元强化学习问题有两种不同的变体。在第一种情况下，这可以对应于来自某种探索策略的多个轨迹。","start":1100.64,"end":1128.73},{"id":47,"text":"And instead, you could also consider this to be just actually a few time steps from your exploration policy. There's a bit of a continuum between these two scenarios. You might want to be able to adapt both online with a few time steps and with more and more episodes with basically kind of a growing data set. But writing it kind of explicitly as two different things here to kind of...","zh":"相反，你也可以将这种情况视为仅仅是从你的探索策略中获取的几个时间步。这两种情况之间存在一定的连续性。你可能希望能够在少量时间步内在线适应，并随着越来越多的回合和基本上不断增长的数据集进行适应。但在这里，我们将它明确地写成两种不同的情况，以……","start":1130.66,"end":1155.7},{"id":48,"text":"make it clear that there are some problem settings where you want to adapt really quickly online within an episode and other scenarios where you're caring a lot more about kind of multiple trials of experience. The last thing that I'll mention is I've been writing it as a kind of an exploration policy and a task policy. There are some scenarios where you might train these and these might be separate networks. There's other scenarios where these could share parameters and basically be the same network.","zh":"要明确的是，有些问题设置中你希望在单个回合内快速适应，而在其他场景中你则更关注多次经验的累积。最后我要提到的是，我将其写成一种探索策略和任务策略。有些场景中你可能会分别训练这两种策略，它们可能是不同的网络。而在其他场景中，这些策略可能会共享参数，基本上是同一个网络。","start":1156.85,"end":1181.71}],"notes":["本段介绍了元强化学习（Meta RL）的基本概念，强调其与传统迁移学习和多任务学习的区别。元强化学习的目标是通过少量经验快速适应新任务，而迁移学习则是在解决源任务后，通过微调解决目标任务。多任务学习则是在同时解决多个任务时，不特别优化迁移能力。","讲者提到在强化学习场景中，任务通常以马尔可夫决策过程（MDP）的形式存在，每个任务都有其独特的状态空间、动作空间、动态和奖励函数。元学习与监督学习之间存在类比关系，但元学习的核心挑战在于探索问题。","在元强化学习的符号表示中，讲者指出元学习问题可以被看作是通过少量经验学习一个能够解决任务的策略，并且能够收集自身经验。训练数据有两种变体：一种是来自探索策略的多个轨迹，另一种是仅来自探索策略的少量时间步。","讲者提到这两种情况之间存在连续性，即可以在一个episode内快速适应，也可以通过越来越多的episode积累经验。这种区分有助于明确不同问题设置下的适应需求。","最后，讲者提到元强化学习中通常涉及探索策略和任务策略，这两个策略可能由不同的网络组成，也可能共享参数，即使用同一个网络。","讲者强调元强化学习的关键在于如何利用少量经验快速适应新任务，这与传统迁移学习和多任务学习的核心目标不同，后者更关注于同时解决多个任务或从源任务迁移到目标任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1007.0,"end":1181.71,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1007.0,"text":"And as a result of that, you can get much faster transfer. You can use a much smaller data set. And there are examples of like if you use fine tuning versus if you use like few shot in context learning or a few shot adaptation, you can get much more efficient transfer. And yeah, so you get much greater efficiency. And the way that you get that is by providing the algorithm with."},{"start":1033.45,"text":"a number of different training tasks rather than just one training task that you're feeding off of. Okay. So slightly more formally, we've talked about multitask learning where you try to solve multiple tasks at once. You might try to transfer to a new task from that, but you're not optimizing for transferability. With transfer learning, you're trying to solve some target task after solving some source task, typically by fine-tuning."},{"start":1063.0,"text":"Whereas in the meta-learning problem, we have experience from some training tasks, and we want to very quickly solve a new task."},{"start":1074.09,"text":"And in the reinforcement learning scenario, these tasks are going to be MDPs, each with their own state-space actions-based dynamics reward. And there is this kind of nice, we see kind of meta-learning and supervised learning, and there's also this kind of a nice analogy between the two, where the main difference with meta-URL is this exploration challenge. Okay. And then..."},{"start":1100.64,"text":"Diving into some notation here, we can view the meta-RL problem as basically being able to, with a small amount of experience, be able to learn a policy that can solve the task, and also to be able to collect this experience itself. And so this training data, there's two different variants of the meta-RL problem. In the first case, this can correspond to multiple rollouts from some exploration policy."},{"start":1130.66,"text":"And instead, you could also consider this to be just actually a few time steps from your exploration policy. There's a bit of a continuum between these two scenarios. You might want to be able to adapt both online with a few time steps and with more and more episodes with basically kind of a growing data set. But writing it kind of explicitly as two different things here to kind of..."},{"start":1156.85,"text":"make it clear that there are some problem settings where you want to adapt really quickly online within an episode and other scenarios where you're caring a lot more about kind of multiple trials of experience. The last thing that I'll mention is I've been writing it as a kind of an exploration policy and a task policy. There are some scenarios where you might train these and these might be separate networks. There's other scenarios where these could share parameters and basically be the same network."}],"speech_gaps":[],"frame":"../frames/v023/007.webp","frame_time":1019.0},{"title":"元强化学习（Meta RL）中的任务分布与序列模型","segments":[{"id":49,"text":"They don't necessarily need to be separated like they are on this slide. And then the last thing is, insofar as we're learning this policy that's conditioning on a training dataset, you can sort of view this as a task identifier. And from that standpoint, we're then kind of more in a setting that looks like multitask learning.","zh":"它们并不一定需要像这张幻灯片上那样被分开。然后最后一点是，就我们正在学习的这个策略而言，它是基于训练数据集的，你可以将其视为一种任务标识符。从这个角度来看，我们所处的环境更类似于多任务学习的场景。","start":1183.33,"end":1203.72},{"id":50,"text":"So the question is, when I say that the test task should be in distribution compared to the training task,","zh":"所以问题是，当我提到测试任务应该与训练任务在分布上一致时，","start":1204.85,"end":1209.51},{"id":51,"text":"does that mean it has to be the same as one of the training tasks, or can it be a bit different?","zh":"这意味着它必须与其中一个训练任务完全相同，还是可以稍微有所不同？","start":1209.61,"end":1213.01},{"id":52,"text":"It can be a bit different.","zh":"它可以稍微有所不同。","start":1213.25,"end":1214.41},{"id":53,"text":"And we'll see examples where it is different as well.","zh":"我们也会看到一些它确实不同的例子。","start":1216.01,"end":1219.11},{"id":54,"text":"So let's talk about how to address these problems.","zh":"那么，让我们谈谈如何解决这些问题。","start":1221.45,"end":1223.53},{"id":55,"text":"So the good news is that there's kind of a very conceptually simple way to address this kind of general problem.","zh":"好消息是，解决这类一般性问题在概念上有一种非常简单的办法。","start":1223.67,"end":1234.65},{"id":56,"text":"statement. The bad news is that it can be challenging to optimize in practice, and we'll","zh":"陈述。坏消息是，在实践中对其进行优化可能会具有挑战性，而且我们将会","start":1234.85,"end":1239.01},{"id":57,"text":"talk about some of those challenges in a bit. But conceptually, we can essentially train a sequence","zh":"我们稍后会讨论其中的一些挑战。但从概念上讲，我们可以基本上训练一个序列模型。","start":1239.01,"end":1247.93},{"id":58,"text":"model. It could be a transformer, any sort of neural network with memory, a recurrent neural","zh":"它可以是变压器，任何具有记忆能力的神经网络，例如循环神经网络。","start":1247.93,"end":1253.33},{"id":59,"text":"network, and use this where basically everything that's being passed into this policy corresponds","zh":"并利用这个模型，其中传入该策略的一切内容基本上都会对该智能体所收集的经验做出响应。","start":1253.33,"end":1261.57},{"id":60,"text":"responds to the experience that the agent has collected.","zh":"因此，你基本上是在这个训练数据集上对策略进行条件建模，然后让策略根据它在该MDP中到目前为止所看到的数据输出动作。","start":1261.57,"end":1264.35},{"id":61,"text":"So you're basically conditioning your policy","zh":"所以你基本上是在对策略进行条件建模","start":1266.05,"end":1268.17},{"id":62,"text":"on this training data set and then having a policy output","zh":"然后让策略输出基于它所看到的数据","start":1268.17,"end":1271.95},{"id":63,"text":"actions based off of the data that it's","zh":"的动作。","start":1271.95,"end":1275.07},{"id":64,"text":"seen so far in that MDP and then training this sequence model","zh":"然后训练这个序列模型","start":1275.07,"end":1282.07},{"id":65,"text":"policy across all of the set of training MDPs that we have.","zh":"在我们拥有的所有训练马尔可夫决策过程（MDPs）集合中，策略是跨所有这些MDPs的。","start":1282.89,"end":1288.81},{"id":66,"text":"So here, this is the current state. This sort of context or training data set is going to get","zh":"所以这里，这是当前的状态。这种上下文或训练数据集会随着时间的推移而变得更大，因为我们在一个给定的MDP中收集了更多的经验。现在有一个问题。","start":1289.45,"end":1295.51},{"id":67,"text":"larger over time as we collect more experience in a given MDP. Now a question for you. There","zh":"这与在标准强化学习设置中简单地使用循环策略或使用序列模型（例如使用Transformer）有一些不同之处。","start":1295.51,"end":1308.37},{"id":68,"text":"are a couple differences between this and simply using a recurrent policy in a standard RL set.","zh":"有人对这里我开始讨论的内容与在标准强化学习设置中简单地将序列模型作为策略使用之间的一些差异有什么想法吗？记忆。是的，通常在...","start":1308.37,"end":1315.29},{"id":69,"text":"or using a sequence model in a standard RL setup, like using a transformer. Does anyone have thoughts on what are some of the differences between what I'm starting to talk about here and simply using a sequence model as your policy in a standard RL setup? Memory. Yeah, so typically in...","zh":"在强化学习中，我们通常不使用记忆，而在这里我们使用记忆。这是其中一点。但与我们在标准强化学习设置中使用记忆相比，这里还有哪些不同之处？是的，我们在这里做的一件事是，实际上将奖励作为输入传递给记忆。这有所不同。","start":1317.04,"end":1339.87},{"id":70,"text":"In RL, we often don't use memory, and here we're using memory. So that's one thing. But compared to if we had used memory in a standard RL setup, what else is different here? Yeah, so one thing that we're doing here is we're actually passing the reward as input into the memory. And that's a little bit different.","zh":"在强化学习中，我们通常不使用记忆，而在这里我们使用记忆。这是其中一点。但与我们在标准强化学习设置中使用记忆相比，这里还有哪些不同之处？是的，我们在这里做的一件事是，实际上将奖励作为输入传递给记忆。这有所不同。","start":1341.09,"end":1359.8}],"notes":["本段讨论了元强化学习（Meta RL）中任务分布与序列模型的应用。讲者指出，元策略可以被视为任务标识符，从而将问题转化为多任务学习的框架。在任务分布方面，测试任务可以与训练任务略有不同，但需保持一定的分布一致性。讲者提到，解决这类问题的方法是训练一个序列模型，如Transformer或循环神经网络，将代理的经验作为输入，从而生成策略输出。","讲者进一步比较了当前讨论的序列模型与标准强化学习中使用序列模型（如Transformer）的差异。主要区别在于当前方法中使用了记忆，并且将奖励作为输入传递给记忆，这与标准设置中的做法不同。","讲者强调，这种序列模型的训练方式需要在所有训练的马尔可夫决策过程（MDPs）上进行，同时随着经验的积累，训练数据集会逐渐变大。这表明模型需要具备良好的泛化能力，以适应不同任务的分布变化。","讲者通过提问引导学生思考当前方法与标准序列模型应用的差异，特别是关于记忆的使用和奖励输入的处理方式。这表明课程注重概念理解与实际应用的结合。","讲者提到，虽然这种方法在概念上简单，但在实践中优化可能具有挑战性，这为后续讨论可能遇到的困难埋下伏笔。","整体来看，本段内容聚焦于元强化学习中任务分布与序列模型的结合，强调了记忆的使用和奖励输入的处理方式，为后续深入讨论提供了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1183.33,"end":1359.8,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":1183.33,"text":"They don't necessarily need to be separated like they are on this slide. And then the last thing is, insofar as we're learning this policy that's conditioning on a training dataset, you can sort of view this as a task identifier. And from that standpoint, we're then kind of more in a setting that looks like multitask learning."},{"start":1204.85,"text":"So the question is, when I say that the test task should be in distribution compared to the training task,"},{"start":1209.61,"text":"does that mean it has to be the same as one of the training tasks, or can it be a bit different?"},{"start":1213.25,"text":"It can be a bit different."},{"start":1216.01,"text":"And we'll see examples where it is different as well."},{"start":1221.45,"text":"So let's talk about how to address these problems."},{"start":1223.67,"text":"So the good news is that there's kind of a very conceptually simple way to address this kind of general problem."},{"start":1234.85,"text":"statement. The bad news is that it can be challenging to optimize in practice, and we'll"},{"start":1239.01,"text":"talk about some of those challenges in a bit. But conceptually, we can essentially train a sequence"},{"start":1247.93,"text":"model. It could be a transformer, any sort of neural network with memory, a recurrent neural"},{"start":1253.33,"text":"network, and use this where basically everything that's being passed into this policy corresponds"},{"start":1261.57,"text":"responds to the experience that the agent has collected."},{"start":1266.05,"text":"So you're basically conditioning your policy"},{"start":1268.17,"text":"on this training data set and then having a policy output"},{"start":1271.95,"text":"actions based off of the data that it's"},{"start":1275.07,"text":"seen so far in that MDP and then training this sequence model"},{"start":1282.89,"text":"policy across all of the set of training MDPs that we have."},{"start":1289.45,"text":"So here, this is the current state. This sort of context or training data set is going to get"},{"start":1295.51,"text":"larger over time as we collect more experience in a given MDP. Now a question for you. There"},{"start":1308.37,"text":"are a couple differences between this and simply using a recurrent policy in a standard RL set."},{"start":1317.04,"text":"or using a sequence model in a standard RL setup, like using a transformer. Does anyone have thoughts on what are some of the differences between what I'm starting to talk about here and simply using a sequence model as your policy in a standard RL setup? Memory. Yeah, so typically in..."},{"start":1341.09,"text":"In RL, we often don't use memory, and here we're using memory. So that's one thing. But compared to if we had used memory in a standard RL setup, what else is different here? Yeah, so one thing that we're doing here is we're actually passing the reward as input into the memory. And that's a little bit different."}],"speech_gaps":[],"frame":"../frames/v023/008.webp","frame_time":1195.33},{"title":"元强化学习（Meta RL）的差异与训练方法","segments":[{"id":71,"text":"in the sense that you're actually using reward information from the current MVP in order to try to get better at the task. This also means that actually at test time, or when we're trying to adapt to a new task, we're also going to be using the reward. And in RL settings, oftentimes we don't necessarily assume that we have the reward when we're just deploying our policy. So that was kind of one main difference. Any other differences?","zh":"也就是说，你实际上是在使用当前MVP的奖励信息，以尝试更好地完成任务。这也意味着在测试时，或者当我们试图适应新任务时，我们也会使用奖励。在强化学习的设置中，通常我们并不假设在部署策略时拥有奖励信息。所以这就是一个主要的不同点。还有其他不同点吗？","start":1360.99,"end":1387.44},{"id":72,"text":"Yeah. So the question is, why are we also not passing as input the actions? You can pass as input the actions. It depends on, like, if your policy is mostly deterministic, then information about past actions could be stored in the memory as well, because you were predicting, you generated those actions. And so in those cases, you don't need the actions. If you have a more stochastic policy, then that sampling process won't be necessarily in the memory. And in those cases, it's good to pass as input the actions as well.","zh":"是的。问题是，为什么我们不将动作作为输入传递呢？你可以将动作作为输入传递。这取决于你的策略是否主要是确定性的，如果这样，过去动作的信息也可以存储在记忆中，因为你是预测并生成了这些动作。在这种情况下，你不需要动作。如果你有一个更随机的策略，那么采样过程可能不会存储在记忆中。在这种情况下，将动作作为输入传递也是有益的。","start":1389.07,"end":1417.35},{"id":73,"text":"Right. So the note was that the states and actions might not be the same for different tasks. And so one of the things that's different here is we're actually training this model across MDPs. And so you might have a different state and action space. You might have different dynamics. And so because one of the big differences compared to standard RL is that we're actually, yeah, we're training this across MDPs. And there's going to be differences in states, actions, dynamics, and rewards across those MDPs.","zh":"对的。注释指出，不同任务的状态和动作可能并不相同。因此，这里的一个不同之处是我们实际上是在多个MDPs上训练这个模型。因此，你可能会有不同的状态和动作空间，也可能会有不同的动态。因此，与标准强化学习相比，一个主要的不同之处就是我们实际上是在多个MDPs上进行训练。在这些MDPs中，状态、动作、动态和奖励之间会有差异。","start":1418.57,"end":1444.89},{"id":74,"text":"Cool. There's actually also one other difference. But the first thing that we talked about is see that the reward is passed as input. You might also be passing as input actions. And this is trained across multiple MDPs. And that's quite different from the typical reinforcement learning setup. Now, the second thing that's also different is that your memory is also going to span across multiple episodes, potentially. If you're trying to actually learn... ","zh":"很好。实际上还有另一个不同点。我们之前讨论的第一个点是奖励被作为输入传递。你也可以将动作作为输入传递。并且这个模型是在多个MDPs上进行训练的。这与典型的强化学习设置有很大不同。第二个不同的点是，你的记忆可能会跨越多个回合。如果你试图真正学习……","start":1445.9,"end":1472.68},{"id":75,"text":"not just within an episode but learn across episodes, then rather than having your current policy simply have memory within an episode, you will be maintaining any sort of hidden state or any sort of memory, not just within your episode but across multiple episodes. So in terms of what this algorithm, maybe I'll leave this up here in case it's useful. In terms of the algorithm, what this looks like is we will sample","zh":"不仅在单个回合内，而且在多个回合之间进行学习，因此，你的当前策略不仅仅是在单个回合内具有记忆，而是在多个回合之间维护任何形式的隐藏状态或任何形式的记忆。因此，从算法的角度来看，也许我会在这里保留这个内容，以防它有用。从算法的角度来看，这看起来是这样的：我们将采样一个任务或一个马尔可夫决策过程（MDP）。也许我们可以称这个MDP为TI。然后，我们将在该MDP中运行我们的策略多个回合。例如，在我们的任务或MDP中运行策略pi进行","start":1473.86,"end":1500.96},{"id":76,"text":"a task or an MDP. So maybe let's call this MDP TI. And then we're going to run our policy in that MDP for multiple episodes. So let's say run pi in our task or MDP for","zh":"多个回合。所以，让我们说在我们的任务或MDP中运行策略pi进行","start":1502.16,"end":1529.93}],"notes":["本段讨论了元强化学习（Meta RL）与标准强化学习（RL）之间的主要差异，特别是在输入信息和训练方式上的不同。在元强化学习中，奖励信息被作为输入传递，这与标准RL不同，因为在标准RL中，部署策略时通常不假设有奖励信息。此外，元强化学习还涉及在多个MDPs上进行训练，这意味着状态空间、动作空间、动态和奖励可能各不相同。","在元强化学习中，是否将动作作为输入取决于策略的确定性。如果策略是确定性的，过去动作的信息可以存储在记忆中，因此不需要将动作作为输入。如果策略是随机的，那么采样过程可能不会存储在记忆中，此时将动作作为输入是有益的。","元强化学习的一个关键差异是记忆不仅限于单个episode，而是可以跨多个episode。这意味着策略在学习过程中需要维护隐藏状态或记忆，以适应不同任务的长期学习需求。","在算法实现上，元强化学习通常涉及从多个MDPs中采样任务，并在这些任务上运行策略进行多个episode的训练。这种训练方式与标准RL不同，后者通常在一个固定的MDP上进行训练。","元强化学习的训练过程强调跨任务的适应能力，这需要模型能够从多个任务中学习并泛化到新的任务。这种泛化能力是通过在多个MDPs上进行训练实现的。","在元强化学习中，记忆的跨episode特性使得策略能够利用之前任务的经验，从而在新任务上更快地适应。这种机制是元强化学习区别于标准RL的重要特征之一。"],"formulas":[],"uncertainties":["在段落76中，'run pi in our task or MDP for' 的完整句子未被识别，因此无法确定其完整含义。"],"diagram":"none","start":1360.99,"end":1529.93,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1360.99,"text":"in the sense that you're actually using reward information from the current MVP in order to try to get better at the task. This also means that actually at test time, or when we're trying to adapt to a new task, we're also going to be using the reward. And in RL settings, oftentimes we don't necessarily assume that we have the reward when we're just deploying our policy. So that was kind of one main difference. Any other differences?"},{"start":1389.07,"text":"Yeah. So the question is, why are we also not passing as input the actions? You can pass as input the actions. It depends on, like, if your policy is mostly deterministic, then information about past actions could be stored in the memory as well, because you were predicting, you generated those actions. And so in those cases, you don't need the actions. If you have a more stochastic policy, then that sampling process won't be necessarily in the memory. And in those cases, it's good to pass as input the actions as well."},{"start":1418.57,"text":"Right. So the note was that the states and actions might not be the same for different tasks. And so one of the things that's different here is we're actually training this model across MDPs. And so you might have a different state and action space. You might have different dynamics. And so because one of the big differences compared to standard RL is that we're actually, yeah, we're training this across MDPs. And there's going to be differences in states, actions, dynamics, and rewards across those MDPs."},{"start":1445.9,"text":"Cool. There's actually also one other difference. But the first thing that we talked about is see that the reward is passed as input. You might also be passing as input actions. And this is trained across multiple MDPs. And that's quite different from the typical reinforcement learning setup. Now, the second thing that's also different is that your memory is also going to span across multiple episodes, potentially. If you're trying to actually learn..."},{"start":1473.86,"text":"not just within an episode but learn across episodes, then rather than having your current policy simply have memory within an episode, you will be maintaining any sort of hidden state or any sort of memory, not just within your episode but across multiple episodes. So in terms of what this algorithm, maybe I'll leave this up here in case it's useful. In terms of the algorithm, what this looks like is we will sample"},{"start":1502.16,"text":"a task or an MDP. So maybe let's call this MDP TI. And then we're going to run our policy in that MDP for multiple episodes. So let's say run pi in our task or MDP for"}],"speech_gaps":[],"frame":"../frames/v023/009.webp","frame_time":1372.99},{"title":"元强化学习（Meta RL）的基本概念与算法结构","segments":[{"id":77,"text":"N episodes. So this is rolling out this right here, and it's going to have memory across those N episodes. And then optionally, if we're using an off policy algorithm with a replay buffer, then we would store the episodes in a replay buffer. And then lastly, we're going to update our policy to optimize the rewards.","zh":"N个回合。因此，这里会进行展开，并且这些N个回合之间会有记忆。然后，如果使用的是离策略算法并带有经验回放缓冲区，我们会将这些回合存储在经验回放缓冲区中。最后，我们会更新策略以优化奖励。","start":1531.69,"end":1566.76},{"id":78,"text":"And so we will be updating pi. And specifically, we are going to be maximizing the sum over words, like the typical RL objective. But it's going to be across all of the tasks in our task distribution. So we'll have sum over tasks i.","zh":"因此，我们会更新策略π。具体来说，我们将最大化对单词的总和，就像典型的强化学习目标一样。但这次的优化范围是我们在任务分布中的所有任务。因此，我们将对任务i进行求和。","start":1567.52,"end":1591.2},{"id":79,"text":"in subminibatch, and then also the expected sum of rewards. So this would be an expectation under our policy of the sum of rewards over different time steps. Now, this is a pretty simple algorithm.","zh":"在子小批量中，并且还要考虑奖励的期望总和。因此，这将是我们在策略下的期望值，对不同时间步的奖励总和。现在，这是一个相当简单的算法。","start":1591.81,"end":1619.66},{"id":80,"text":"It looks a lot like reinforcement learning, where simply the main thing that's different is that we're going to be doing this optimization across multiple MDPs, and our policy will have memory across a set of episodes. Usually this is going to be pretty small, because if it was large, if it was like 1,000 episodes, it's going to be hard to store that in the context of a model, just because your memory will start to increase substantially.","zh":"它看起来很像强化学习，其中主要的不同之处在于，我们将在这个多个马尔可夫决策过程（MDPs）上进行优化，而且我们的策略会在一组回合之间保持记忆。通常，这会是一个相当小的数值，因为如果它很大，比如1000个回合，那么在模型的上下文中存储这些信息会变得非常困难，因为你的记忆量会显著增加。","start":1621.21,"end":1650.23},{"id":81,"text":"So what that looks like is you have this neural network. It has multiple episodes, and then you'll be kind of rolling it out for multiple episodes, taking actions, and then you'll start collecting for a new MDP. So you'll cut your memory when you start to collect for the new MDP that you've sampled.","zh":"这看起来像这样：你有一个神经网络。它包含多个回合，然后你将它展开进行多个回合的运行，采取行动，然后你开始收集一个新的马尔可夫决策过程（MDP）的数据。当你开始收集新的MDP的数据时，你会切断记忆。","start":1651.91,"end":1673.61},{"id":82,"text":"So you sample a task, roll out the policy for n episodes, in this case, n equals 2 in this diagram, under the dynamics and reward function for that MDP. Then store in your replay buffer. Oftentimes, you'll have a different replay buffer for each task. And then update your policy to maximize the discounted return for all tasks that you've collected for. And then repeat this process in order to continuously get a policy that's better at doing this sort of in-context adaptation.","zh":"因此，你采样一个任务，然后在该MDP的动力学和奖励函数下，运行策略进行n个回合，如图中所示，n等于2。然后将这些回合存储在你的经验回放缓冲区中。通常，你会为每个任务使用不同的经验回放缓冲区。然后更新你的策略，以最大化所有已收集任务的折扣回报。然后重复这个过程，以持续获得一个在上下文适应方面表现更好的策略。","start":1674.11,"end":1702.96}],"notes":["本段讲解了元强化学习（Meta RL）的基本概念，强调其与传统强化学习（RL）的区别在于优化过程跨越多个任务（MDPs），并且策略具有跨多个回合（episodes）的记忆能力。这使得策略能够适应不同任务，实现一种‘元’级别的学习。","在具体实现中，元强化学习通常使用一个或多个回放缓冲区（replay buffer）来存储不同任务的回合数据。每个任务可能有独立的缓冲区，以确保策略更新时能够充分利用任务特定的数据。","策略更新的目标是最大化所有任务的折扣回报（discounted return），这与传统强化学习的目标类似，但扩展到了多个任务的集合。这种设计使得策略能够更好地适应新任务，实现快速的上下文适应。","在实际操作中，策略会在多个回合中被展开（roll out），并根据新任务的动态和奖励函数进行调整。当开始收集新任务的数据时，策略会‘切断’之前的记忆，以避免混淆不同任务的数据。","元强化学习的一个关键挑战是管理策略的记忆容量。如果记忆容量过大（如1000个回合），可能会导致模型存储和计算负担增加，因此通常会限制记忆的大小。","整个过程是迭代的，通过不断采样任务、展开策略、更新策略，最终得到一个能够快速适应新任务的策略。这种机制使得元强化学习在需要快速适应新环境的场景中具有优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1531.69,"end":1702.96,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1531.69,"text":"N episodes. So this is rolling out this right here, and it's going to have memory across those N episodes. And then optionally, if we're using an off policy algorithm with a replay buffer, then we would store the episodes in a replay buffer. And then lastly, we're going to update our policy to optimize the rewards."},{"start":1567.52,"text":"And so we will be updating pi. And specifically, we are going to be maximizing the sum over words, like the typical RL objective. But it's going to be across all of the tasks in our task distribution. So we'll have sum over tasks i."},{"start":1591.81,"text":"in subminibatch, and then also the expected sum of rewards. So this would be an expectation under our policy of the sum of rewards over different time steps. Now, this is a pretty simple algorithm."},{"start":1621.21,"text":"It looks a lot like reinforcement learning, where simply the main thing that's different is that we're going to be doing this optimization across multiple MDPs, and our policy will have memory across a set of episodes. Usually this is going to be pretty small, because if it was large, if it was like 1,000 episodes, it's going to be hard to store that in the context of a model, just because your memory will start to increase substantially."},{"start":1651.91,"text":"So what that looks like is you have this neural network. It has multiple episodes, and then you'll be kind of rolling it out for multiple episodes, taking actions, and then you'll start collecting for a new MDP. So you'll cut your memory when you start to collect for the new MDP that you've sampled."},{"start":1674.11,"text":"So you sample a task, roll out the policy for n episodes, in this case, n equals 2 in this diagram, under the dynamics and reward function for that MDP. Then store in your replay buffer. Oftentimes, you'll have a different replay buffer for each task. And then update your policy to maximize the discounted return for all tasks that you've collected for. And then repeat this process in order to continuously get a policy that's better at doing this sort of in-context adaptation."}],"speech_gaps":[],"frame":"../frames/v023/010.webp","frame_time":1543.69},{"title":"元强化学习（Meta RL）中的策略适应与任务迁移","segments":[{"id":83,"text":"Yeah, so that's a good question. So the question is, does it know that it's starting a new episode, like at this position right here? You could use a position encoding. In practice, you're also going to probably have a discontinuity in your state. And so you might just be able to see that your current state is very different from the past state. And that might also tell it. But yeah, you could have some sort of token to also tell it that it's a new episode.","zh":"是的，这是一个好问题。问题是，它是否知道它正在开始一个新的回合，比如在这个位置？你可以使用位置编码。实际上，你还会在状态中遇到不连续性。因此，你可能只是能够看到当前状态与过去状态非常不同。这可能也会告诉它。但总之，你也可以有一些标记来告诉它这是一个新的回合。","start":1704.36,"end":1726.74},{"id":84,"text":"The question is, are we randomizing S1 across the different episodes? When you're rolling out the policy, when you start a new episode, that will be a different sample from the initial state distribution. And so S1, I guess it's maybe a little confusing. S1 here might be different from S1 here. S2 is very likely different from S2 here and so forth. Cool. And then the outcome of this is you'll have a policy that should be able to adapt.","zh":"问题是，我们在不同回合中是否随机化S1？当你 rollout 策略时，当你开始一个新的回合，这将是从初始状态分布中采样的不同样本。因此，S1，我想可能有点令人困惑。这里的S1可能与这里的S1不同。S2很可能与这里的S2不同，依此类推。很好。然后，这种做法的结果是你将拥有一个能够适应的策略。","start":1727.84,"end":1755.01},{"id":85,"text":"across episodes with experience from those episodes. And it should be able to, on its own, actually decide on the best exploration exploitation trade-off. And the best exploration exploitation trade-off is going to depend on the number of episodes that you give it.","zh":"跨回合利用这些回合的经验。它应该能够自行决定最佳的探索与利用的权衡。最佳的探索与利用的权衡将取决于你给它的回合数量。","start":1756.77,"end":1773.99},{"id":86,"text":"If N is two, then it has two episodes to maximize rewards as quickly as possible. And if it needs to explore, it'll explore as quickly as possible. If N is a little bit larger, then you've given it a little bit more budget to... It still wants to maximize...","zh":"如果N是2，那么它有两个回合来尽可能快地最大化奖励。如果它需要探索，它将尽可能快地进行探索。如果N稍大一些，那么你给了它更多的预算……它仍然想要最大化……","start":1774.44,"end":1789.82},{"id":87,"text":"explore quickly and efficiently if it can, because then it can get higher rewards later,","zh":"如果它能够快速而高效地探索，那么它之后可以获得更高的奖励，","start":1790.43,"end":1793.95},{"id":88,"text":"but it might have slightly more budget to explore. And so you'll get, one of the things that's like","zh":"但它可能有稍微更多的预算来进行探索。因此，你会得到，其中一件很酷的事情是，","start":1794.15,"end":1799.85},{"id":89,"text":"pretty cool about this, when you optimize this whole thing end to end, is that it will make","zh":"当你整体优化整个系统时，它将决定是否要探索或利用。它将在一个","start":1799.85,"end":1803.85},{"id":90,"text":"decisions on whether or not to explore or to exploit. And it'll make those decisions in a","zh":"环境中做出这些决定。","start":1803.85,"end":1811.25},{"id":91,"text":"way that's informed by whatever gets it the highest reward. Then after this sort of training process,","zh":"一种方式，这种方式是通过获得最高奖励的方式来引导的。然后在这样的训练过程中，","start":1811.25,"end":1818.47},{"id":92,"text":"this after you've trained it on multiple MDPs, then you can actually then roll out your policy","zh":"在你已经在这个多个马尔可夫决策过程（MDPs）上训练之后，你实际上就可以在新的任务中部署你的策略","start":1818.47,"end":1827.21},{"id":93,"text":"in a new task. So at test time, you will then give it a new task. So you're in some new MDP","zh":"在测试阶段，你会给它一个新的任务。因此，你处于一个新的马尔可夫决策过程（MDP）","start":1827.21,"end":1844.03},{"id":94,"text":"mdptj, and you can take the policy that was trained and roll it out in that mdp.","zh":"mdptj，并且你可以将之前训练好的策略部署到这个mdp中。","start":1846.79,"end":1858.17},{"id":95,"text":"So roll out pi in that mdp with those state's actions and rewards and so forth.","zh":"因此，在这个mdp中部署策略pi，执行这些状态的动作和奖励等操作。","start":1858.37,"end":1868.29},{"id":96,"text":"And so sample a new task, roll out that policy.","zh":"然后，采样一个新的任务，部署该策略。","start":1868.61,"end":1871.41},{"id":97,"text":"see. You want to roll this out for up to 10 episodes. If you roll it out for longer,","zh":"看到。你希望最多部署10个回合。如果你部署的时间更长，","start":1871.41,"end":1876.43}],"notes":["本段讨论了元强化学习（Meta RL）中策略适应的问题，特别是在不同episode之间如何处理状态S1的随机性。讲者指出，当开始新的episode时，S1会从初始状态分布中采样，因此S1在不同episode之间可能不同，这可能会影响策略的适应性。","讲者进一步说明，策略在多个episode中积累经验后，能够自主决定探索与利用的平衡。这种平衡取决于提供的episode数量，即N的大小。当N较小时，策略倾向于快速探索以最大化奖励；当N较大时，策略可能有更多预算进行更有效的探索。","在训练过程中，策略会根据获得的奖励做出决策，以决定是否探索或利用。这种决策过程是端到端优化的结果，使得策略能够适应不同的任务。","在测试阶段，训练好的策略可以迁移到新的任务中。讲者提到，当遇到新的MDP时，可以使用训练好的策略进行roll-out，即执行策略以获得状态、动作和奖励等信息。","讲者还提到，在测试时，可以对新任务进行最多10次episode的roll-out，如果roll-out时间过长，可能会导致策略表现不佳。","整个讨论强调了元强化学习中策略适应性和任务迁移的重要性，以及如何通过端到端优化实现这些目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1704.36,"end":1876.43,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":1704.36,"text":"Yeah, so that's a good question. So the question is, does it know that it's starting a new episode, like at this position right here? You could use a position encoding. In practice, you're also going to probably have a discontinuity in your state. And so you might just be able to see that your current state is very different from the past state. And that might also tell it. But yeah, you could have some sort of token to also tell it that it's a new episode."},{"start":1727.84,"text":"The question is, are we randomizing S1 across the different episodes? When you're rolling out the policy, when you start a new episode, that will be a different sample from the initial state distribution. And so S1, I guess it's maybe a little confusing. S1 here might be different from S1 here. S2 is very likely different from S2 here and so forth. Cool. And then the outcome of this is you'll have a policy that should be able to adapt."},{"start":1756.77,"text":"across episodes with experience from those episodes. And it should be able to, on its own, actually decide on the best exploration exploitation trade-off. And the best exploration exploitation trade-off is going to depend on the number of episodes that you give it."},{"start":1774.44,"text":"If N is two, then it has two episodes to maximize rewards as quickly as possible. And if it needs to explore, it'll explore as quickly as possible. If N is a little bit larger, then you've given it a little bit more budget to... It still wants to maximize..."},{"start":1790.43,"text":"explore quickly and efficiently if it can, because then it can get higher rewards later,"},{"start":1794.15,"text":"but it might have slightly more budget to explore. And so you'll get, one of the things that'
