hat the agent hadn't seen before. They tested it actually both on small mazes and on large mazes. This is actually a scenario where they were able to see some extrapolation to tasks that were outside of the distribution of what it was trained on."},{"start":2014.77,"text":"So this is what it looks like. This is at test time. And you can see that the agent, it just is like exploring around this environment, looking for where the goal is. It only gets these images as input. And on the right, we can see the trace of the exploration. So it started in the middle, explored over here, and explored down here, and eventually found the goal."},{"start":2035.42,"text":"And then after that exploration episode, we're still, we still have memory from that previous"},{"start":2039.28,"text":"episode and it's able to, uh, using that memory, it's able to then be able to, uh, kind of go"},{"start":2047.08,"text":"directly to the goal, um, based on this experience in that maze. Um, so kind of watching that again,"}],"speech_gaps":[],"frame":"../frames/v023/012.webp","frame_time":1889.11},{"title":"元强化学习（Meta RL）中的探索与利用策略","segments":[{"id":110,"text":"whoops. Um, it's, this is the first episode. And so this is kind of the first episode of rolling","start":2055.62,"end":2063.96},{"id":111,"text":"out this policy. It's choosing to explore because it doesn't know where","start":2063.96,"end":2069.44},{"id":112,"text":"the goal is in this maze. It also doesn't know the layout of the maze and so we","start":2070.06,"end":2074.32},{"id":113,"text":"see it explore here. And then in the second episode it chooses to go","start":2074.32,"end":2080.08},{"id":114,"text":"straight to the goal because it decided that it already explored the extent of","start":2080.08,"end":2084.14},{"id":115,"text":"the maze. Here's an example in a larger maze. So the agent starts over here and","start":2084.14,"end":2090.48},{"id":116,"text":"And it explores in the top part, doesn't see the goal and realize that this is a dead end.","start":2090.48,"end":2100.76},{"id":117,"text":"It doesn't need to explore it further.","start":2100.8,"end":2101.86},{"id":118,"text":"And then it ends up seeing the goal here.","start":2102.02,"end":2103.92},{"id":119,"text":"And then after that, it goes straight to the goal after that first episode.","start":2104.08,"end":2110.18},{"id":120,"text":"And so in this training example, n equals 2.","start":2110.46,"end":2114.56},{"id":121,"text":"So they trained it just to be able to explore and exploit after two episodes.","start":2114.9,"end":2120.28},{"id":122,"text":"Cool.","start":2121.3,"end":2121.82},{"id":123,"text":"And then quantitatively, they looked at the average time to find the goal in both the first episode and the second episode.","start":2122.0,"end":2128.08},{"id":124,"text":"They compared to using a random policy, which occasionally does happen upon the goal,","start":2128.96,"end":2135.2},{"id":125,"text":"and using an LSTM architecture and this more kind of self-attention and convolution architecture.","start":2135.78,"end":2140.32},{"id":126,"text":"And they found that with the small maze,","start":2140.88,"end":2142.5},{"id":127,"text":"Even within the first episode, they were able to do a lot better than random. That means that's because it's actually exploring efficiently and then eventually often finding the goal. And then it's able to...","start":2144.21,"end":2154.37},{"id":128,"text":"find the goal faster in the second episode after learning where the goal is and about the maze in the first episode. We also see that it does significantly better than a random agent in the large mazes. And in both cases, using kind of the self-attention architecture is better than using an LSTM architecture, which is another memory architecture.","start":2155.02,"end":2174.4},{"id":129,"text":"Yeah, so the question is, is the reward to find the goal? And if so, why is it optimized to find it as fast as possible? So the reward is to find the goal. I don't remember the exact structure of the reward. It's optimized to find it quickly. There's a couple ways that lead to it to optimize to find it quickly.","start":2175.42,"end":2196.78},{"id":130,"text":"In this particular case, I believe they're using discounted rewards. And so the discount factor, instead of being like this, you're optimizing for discounted rewards. So there's a discount factor right there. And the discount factor is not one. It's probably like 0.95 or 0.99. And so that objective will be higher if you get the reward sooner rather than later.","start":2198.99,"end":2220.95}],"notes":["本段讲解了元强化学习（Meta RL）中智能体如何在不同迷宫中进行探索与利用。在第一个训练回合中，智能体由于不知道目标位置和迷宫布局，因此选择探索。而在第二个回合中，它已经学习到了迷宫的结构，因此直接前往目标。这种策略体现了元学习中从经验中学习的能力。","在实验中，研究者比较了不同策略在不同大小迷宫中的表现。在小迷宫中，智能体在第一个回合就能比随机策略表现更好，说明其探索效率较高。而在大迷宫中，智能体同样表现优于随机策略，表明其学习能力具有泛化性。","研究者还比较了不同神经网络架构的效果，发现使用自注意力机制的模型在性能上优于使用LSTM的模型。这表明在元强化学习中，模型结构的选择对学习效果有重要影响。","在奖励机制方面，研究者提到使用了折扣奖励（discounted rewards），并指出折扣因子通常为0.95或0.99。折扣因子的存在使得智能体更倾向于尽快获得奖励，从而优化其策略。","本段还提到，智能体在第一个回合中学习了迷宫的结构，并在第二个回合中利用这一知识直接前往目标。这说明元强化学习能够将经验迁移到新的任务中，从而提高学习效率。","最后，研究者指出，智能体的策略优化目标是尽快找到目标，这与折扣奖励机制密切相关。通过折扣因子的设计，智能体能够更有效地平衡探索与利用，从而实现更快的收敛。"],"formulas":[],"uncertainties":["discount factor instead of being like this"],"diagram":"none","start":2055.62,"end":2220.95,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2055.62,"text":"whoops. Um, it's, this is the first episode. And so this is kind of the first episode of rolling"},{"start":2063.96,"text":"out this policy. It's choosing to explore because it doesn't know where"},{"start":2070.06,"text":"the goal is in this maze. It also doesn't know the layout of the maze and so we"},{"start":2074.32,"text":"see it explore here. And then in the second episode it chooses to go"},{"start":2080.08,"text":"straight to the goal because it decided that it already explored the extent of"},{"start":2084.14,"text":"the maze. Here's an example in a larger maze. So the agent starts over here and"},{"start":2090.48,"text":"And it explores in the top part, doesn't see the goal and realize that this is a dead end."},{"start":2100.8,"text":"It doesn't need to explore it further."},{"start":2102.02,"text":"And then it ends up seeing the goal here."},{"start":2104.08,"text":"And then after that, it goes straight to the goal after that first episode."},{"start":2110.46,"text":"And so in this training example, n equals 2."},{"start":2114.9,"text":"So they trained it just to be able to explore and exploit after two episodes."},{"start":2121.3,"text":"Cool."},{"start":2122.0,"text":"And then quantitatively, they looked at the average time to find the goal in both the first episode and the second episode."},{"start":2128.96,"text":"They compared to using a random policy, which occasionally does happen upon the goal,"},{"start":2135.78,"text":"and using an LSTM architecture and this more kind of self-attention and convolution architecture."},{"start":2140.88,"text":"And they found that with the small maze,"},{"start":2144.21,"text":"Even within the first episode, they were able to do a lot better than random. That means that's because it's actually exploring efficiently and then eventually often finding the goal. And then it's able to..."},{"start":2155.02,"text":"find the goal faster in the second episode after learning where the goal is and about the maze in the first episode. We also see that it does significantly better than a random agent in the large mazes. And in both cases, using kind of the self-attention architecture is better than using an LSTM architecture, which is another memory architecture."},{"start":2175.42,"text":"Yeah, so the question is, is the reward to find the goal? And if so, why is it optimized to find it as fast as possible? So the reward is to find the goal. I don't remember the exact structure of the reward. It's optimized to find it quickly. There's a couple ways that lead to it to optimize to find it quickly."},{"start":2198.99,"text":"In this particular case, I believe they're using discounted rewards. And so the discount factor, instead of being like this, you're optimizing for discounted rewards. So there's a discount factor right there. And the discount factor is not one. It's probably like 0.95 or 0.99. And so that objective will be higher if you get the reward sooner rather than later."}],"speech_gaps":[],"frame":"../frames/v023/013.webp","frame_time":2067.62},{"title":"元强化学习（Meta RL）的输入与探索策略","segments":[{"id":131,"text":"Yeah, so the question is, what is the model's input? And yeah, exactly. So it's video from the previous episode, the actions from the previous episode, and basically everything up until the current time step, which is any previous episodes and everything so far in that episode. So it's all of the video frames and then also all of the actions and all of the rewards as well.","start":2221.77,"end":2243.79},{"id":132,"text":"Yeah, so the question is, where in the algorithm are we exploring exploration versus exploitation? And here, because it basically all comes down to this objective for both of them. And the insight is that the agent doesn't know.","start":2244.57,"end":2263.87},{"id":133,"text":"doesn't know much about the task. It doesn't know... Well, depending on the training tasks, in this case, it doesn't know what maze it's in. It doesn't know the structure of the maze and that sort of thing. And so it's actually not even... It's not able to get high reward until it starts to explore, until it finds where the goal is, for example. And so by optimizing just end-to-end for reward, you're incentivizing it to... It's not going to get high reward without exploration, essentially.","start":2265.4,"end":2293.62},{"id":134,"text":"Yeah, we will talk about that soon in a few lectures. But yeah, there's lots of problems here because when your policy is bad and you're not getting good rewards, it ends up being very difficult to figure out a good policy. Yeah, so the question is, instead of doing what we're doing, could we just do regular RL and then do test time training? So in some ways, language models with recurrence,","start":2294.56,"end":2324.37},{"id":135,"text":"like, it depends on how you view it, but in some ways you are already doing something that kind of looks like meta-RL if it has memory. It basically has the ability to adapt depending on the kind of the task that you're giving it. And then, yeah, and then...","start":2325.61,"end":2338.61},{"id":136,"text":"One important component is if you're doing test time compute, you're allowing it to actually think through the problem. Now, test time compute is a very broad term. So on the next slide, we'll talk about how you can actually use, how meta-RL is relevant for test time compute. So let's talk about that now. So say that we're solving different math problems. This is a canonical language model example, especially for test time compute.","start":2339.04,"end":2362.18},{"id":137,"text":"And one example of the math problem is trying to show this inequality. This is actually the same, I think possibly the same math problem that Avril showed in his lecture. And in some ways, like trying to solve this math problem is, you can think of it in some ways as an MDP itself, in that there's different strategies that you might try to take to solve this math problem.","start":2363.2,"end":2386.28}],"notes":["本段讨论了元强化学习（Meta RL）中模型的输入内容，包括视频、动作和奖励等历史信息。这些信息构成了当前时间步的上下文，帮助模型进行决策。同时，讲者指出，元强化学习的目标是让模型能够适应不同任务，而不仅仅是单一任务。","讲者进一步探讨了探索（exploration）与利用（exploitation）在算法中的位置。他指出，这两个过程都依赖于同一个目标函数，而智能体对任务了解有限，因此需要通过探索来获得高奖励。","讲者以迷宫任务为例，说明智能体在不知道迷宫结构的情况下，必须通过探索才能找到目标并获得高奖励。这表明，仅优化端到端奖励可能不足以保证成功，因为探索是获得高奖励的前提。","讲者提到，元强化学习的一个重要方面是测试时计算（test time compute），即允许模型在测试阶段进行推理。测试时计算是一个广泛的概念，涉及模型如何适应不同任务。","讲者以数学问题为例，说明测试时计算如何应用于语言模型。他指出，解决数学问题可以被视为一种马尔可夫决策过程（MDP），其中存在多种策略可供选择。","讲者提到，测试时计算与元强化学习密切相关，因为模型需要在不同任务中进行推理和适应。这表明，元强化学习的目标是让模型具备更强的泛化能力，以应对未知任务。"],"formulas":[],"uncertainties":["PaaS's input to the model"],"diagram":"none","start":2221.77,"end":2386.28,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2221.77,"text":"Yeah, so the question is, what is PaaS's input to the model? And yeah, exactly. So it's video from the previous episode, the actions from the previous episode, and basically everything up until the current time step, which is any previous episodes and everything so far in that episode. So it's all of the video frames and then also all of the actions and all of the rewards as well."},{"start":2244.57,"text":"Yeah, so the question is, where in the algorithm are we exploring exploration versus exploitation? And here, because it basically all comes down to this objective for both of them. And the insight is that the agent doesn't know."},{"start":2265.4,"text":"doesn't know much about the task. It doesn't know... Well, depending on the training tasks, in this case, it doesn't know what maze it's in. It doesn't know the structure of the maze and that sort of thing. And so it's actually not even... It's not able to get high reward until it starts to explore, until it finds where the goal is, for example. And so by optimizing just end-to-end for reward, you're incentivizing it to... It's not going to get high reward without exploration, essentially."},{"start":2294.56,"text":"Yeah, we will talk about that soon in a few lectures. But yeah, there's lots of problems here because when your policy is bad and you're not getting good rewards, it ends up being very difficult to figure out a good policy. Yeah, so the question is, instead of doing what we're doing, could we just do regular RL and then do test time training? So in some ways, language models with recurrence,"},{"start":2325.61,"text":"like, it depends on how you view it, but in some ways you are already doing something that kind of looks like meta-URL if it has memory. It basically has the ability to adapt depending on the kind of the task that you're giving it. And then, yeah, and then..."},{"start":2339.04,"text":"One important component is if you're doing test time compute, you're allowing it to actually think through the problem. Now, test time compute is a very broad term. So on the next slide, we'll talk about how you can actually use, how meta-URL is relevant for test time compute. So let's talk about that now. So say that we're solving different math problems. This is a canonical language model example, especially for test time compute."},{"start":2363.2,"text":"And one example of the math problem is trying to show this inequality. This is actually the same, I think possibly the same math problem that Avril showed in his lecture. And in some ways, like trying to solve this math problem is, you can think of it in some ways as an MDP itself, in that there's different strategies that you might try to take to solve this math problem."}],"speech_gaps":[],"frame":"../frames/v023/014.webp","frame_time":2233.77},{"title":"元强化学习（Meta RL）在语言模型中的应用","segments":[{"id":138,"text":"You don't know a priori which strategy is going to help you solve that problem. Where do you start? Do you try to, for example, do guess and check? Do you try to eliminate terms in the equation and so forth? And ideally, you'd be able to kind of explore those different strategies and then produce an answer based off of the best strategy.","start":2388.24,"end":2411.62},{"id":139,"text":"It turns out that if you give, so DeepSeq R1 is a language model that uses test time compute in order to solve math problems. And if you give R1 different math problems to solve, if you give it a hard problem, it kind of thinks for a while. At some point, it cuts off its test time compute because it doesn't want to be thinking for too long for the user. And then it outputs some explanation for the user.","start":2414.59,"end":2440.27},{"id":140,"text":"And then also, if you give it a really easy problem, like 2 plus 2 equals question mark, it actually also thinks through what the solution might be and then gives a step-by-step explanation for the answer.","start":2441.31,"end":2453.43},{"id":141,"text":"And so this is something that is clearly somewhat wasteful to do, probably, unless this is somehow a challenging problem. And so you can actually use this notion of meta-RL to try to optimize for test time compute. And if you know that you're going to be doing test time compute at test time, then basically bring that into the training process.","start":2454.44,"end":2474.14},{"id":142,"text":"Encourage the model to efficiently use that test time compute, efficiently explore different strategies, such that ideally on easy problems, it is trying to output an answer as quickly as possible. And for harder problems, it's thinking as much as it needs, including possible exploration, until it then tries to exploit and give an explanation.","start":2476.27,"end":2496.89},{"id":143,"text":"And so this paper here was a paper that explored that. They found that when they were trying to explicitly optimize for effective use of test type compute, they were able to get higher performance with the same number of tokens and also actually reduce the number of tokens needed to get the same performance so that you aren't, for example, using up a ton of tokens on simple problems.","start":2498.22,"end":2524.16},{"id":144,"text":"So that's a use case of meta-URL or ideas from meta-URL in language models. Now, a quick digression, and this will actually lead us into a different way of thinking about meta-URL. So we've talked about multitask policies where we condition on a task descriptor. So maybe we want a robot to stack in different locations or a robot to walk in different directions. And we've talked about policies that take as input experience and then kind of generate actions based off of that data set.","start":2525.08,"end":2554.98}],"notes":["本段讨论了元强化学习（Meta RL）在语言模型中的应用，特别是如何优化测试时间计算资源的使用。讲者指出，对于简单问题，模型应快速给出答案，而对于复杂问题，模型应进行充分的探索和思考，以生成解释。","讲者提到，通过显式优化测试时间计算的使用，可以在相同数量的标记下获得更高的性能，甚至减少所需的标记数量，从而避免在简单问题上浪费计算资源。","讲者进一步指出，这种优化方法不仅适用于数学问题，还可以推广到其他任务，例如机器人控制等多任务策略。这表明元强化学习可以用于训练模型在不同任务中高效地使用计算资源。","讲者提到，元强化学习的核心思想是将测试时间的计算资源纳入训练过程，以鼓励模型在不同任务中高效地探索和利用策略。这与传统的强化学习方法不同，后者通常不考虑测试时的计算成本。","讲者还提到，这种优化方法可以应用于语言模型，例如DeepSeq R1，它在解决数学问题时会根据问题的难度调整计算资源的使用，从而提高效率。","最后，讲者提到，这种思路可以引导我们以不同的方式思考元强化学习，即通过多任务策略和经验输入来生成动作，从而实现更高效的策略学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2388.24,"end":2554.98,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2388.24,"text":"You don't know a priori which strategy is going to help you solve that problem. Where do you start? Do you try to, for example, do guess and check? Do you try to eliminate terms in the equation and so forth? And ideally, you'd be able to kind of explore those different strategies and then produce an answer based off of the best strategy."},{"start":2414.59,"text":"It turns out that if you give, so DeepSeq R1 is a language model that uses test time compute in order to solve math problems. And if you give R1 different math problems to solve, if you give it a hard problem, it kind of thinks for a while. At some point, it cuts off its test time compute because it doesn't want to be thinking for too long for the user. And then it outputs some explanation for the user."},{"start":2441.31,"text":"And then also, if you give it a really easy problem, like 2 plus 2 equals question mark, it actually also thinks through what the solution might be and then gives a step-by-step explanation for the answer."},{"start":2454.44,"text":"And so this is something that is clearly somewhat wasteful to do, probably, unless this is somehow a challenging problem. And so you can actually use this notion of meta-RL to try to optimize for test time compute. And if you know that you're going to be doing test time compute at test time, then basically bring that into the training process."},{"start":2476.27,"text":"Encourage the model to efficiently use that test time compute, efficiently explore different strategies, such that ideally on easy problems, it is trying to output an answer as quickly as possible. And for harder problems, it's thinking as much as it needs, including possible exploration, until it then tries to exploit and give an explanation."},{"start":2498.22,"text":"And so this paper here was a paper that explored that. They found that when they were trying to explicitly optimize for effective use of test type compute, they were able to get higher performance with the same number of tokens and also actually reduce the number of tokens needed to get the same performance so that you aren't, for example, using up a ton of tokens on simple problems."},{"start":2525.08,"text":"So that's a use case of meta-URL or ideas from meta-URL in language models. Now, a quick digression, and this will actually lead us into a different way of thinking about meta-URL. So we've talked about multitask policies where we condition on a task descriptor. So maybe we want a robot to stack in different locations or a robot to walk in different directions. And we've talked about policies that take as input experience and then kind of generate actions based off of that data set."}],"speech_gaps":[],"frame":"../frames/v023/015.webp","frame_time":2400.24},{"title":"元强化学习（Meta RL）与多任务学习的联系","segments":[{"id":145,"text":"And if you were to think about how this relates to multitask learning policies, one way to think about it is that we're just doing multitask learning, but now this data is our task identifier. And it's something that actually changes within a task. So the analogy is not perfect. It's not actually fixed for a given task. But you can sort of think about it as conditioning on the task insofar as experience tells you what the task you're trying to do is. Cool.","start":2556.01,"end":2583.19},{"id":146,"text":"If you think about goal condition policies, you can also view meta-RL as a generalization of goal condition policies.","start":2584.42,"end":2592.74},{"id":147,"text":"There's a set of MDPs that are goal-reaching MDPs, and then there's a broader set of MDPs that are reward-maximizing MDPs. And then the other way to think about this is instead of trying to generalize to new goals, you can think about meta-RL as trying to adapt to new tasks with a small amount of experience. This would be kind of the difference between zero-shot generalization in the goal condition case.","start":2594.19,"end":2618.99},{"id":148,"text":"and K shot generalization with K episodes or K time steps in the meta-RL case. Now, so we've talked about how we can view the experience as the task descriptor Z or the prompt, essentially. But there's actually another way to look at it, which is that if we think about this policy with memory and that has kind of the past memory and then our current policy,","start":2619.57,"end":2646.11},{"id":149,"text":"If we were to think about what information is being passed right here to the policy, this information is presumably information about the task. And specifically, when ZI isn't part of the state, there's ambiguity about what MDP you're trying to solve, and you're using that experience to try to identify the MDP that you're in.","start":2646.96,"end":2668.89},{"id":150,"text":"And you can sort of think about it as the policy needs to infer the task. It needs to infer specifically some sort of latent task descriptor from its experience. And so another way of looking at meta-URL is something where you are using your experience to infer what the task is and then conditioning your policy that's acting at the current time step on your current estimate of what the task is.","start":2670.46,"end":2696.87},{"id":151,"text":"So you think about it essentially as meta-RL is trying to explore, to infer this unknown task, and then perform the task. I see. So you're asking, because we're going to be inferring the task identifier, why don't we just give it to the learning system? Yeah. So the main reason is that if we don't have a compact way of describing the task that the agent is doing, then it may actually be challenging.","start":2698.6,"end":2728.31}],"notes":["本段讲解了元强化学习（Meta RL）与多任务学习之间的关系，指出Meta RL可以视为一种更广泛的框架，其中经验被用作任务标识符。与传统的多任务学习不同，Meta RL中的任务标识符在任务内部可能发生变化，因此需要通过经验来推断当前任务。","讲者提到，Meta RL可以看作是目标条件策略（goal condition policies）的泛化。目标条件策略关注的是如何达到特定目标，而Meta RL则更进一步，关注如何通过少量经验适应新任务。","在讨论任务标识符时，讲者指出，当任务标识符（ZI）不在状态中时，会存在关于当前MDP的不确定性，因此需要通过经验来识别当前所处的MDP。","讲者进一步说明，Meta RL中的策略需要从经验中推断出任务的潜在描述符，并基于当前对任务的估计来调整当前时间步的策略。这表明Meta RL的核心在于探索和推断未知任务。","最后，讲者提到，虽然可以将任务标识符直接提供给学习系统，但如果没有一种紧凑的方式来描述任务，这可能会带来挑战。因此，Meta RL需要通过经验来隐式地推断任务。","讲者强调了Meta RL与传统强化学习的区别，即Meta RL关注的是如何通过少量经验适应新任务，而不是直接提供任务标识符。这种适应能力使得Meta RL在处理新任务时具有更强的泛化能力。"],"formulas":[],"uncertainties":["ZI"],"diagram":"none","start":2556.01,"end":2728.31,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2556.01,"text":"And if you were to think about how this relates to multitask learning policies, one way to think about it is that we're just doing multitask learning, but now this data is our task identifier. And it's something that actually changes within a task. So the analogy is not perfect. It's not actually fixed for a given task. But you can sort of think about it as conditioning on the task insofar as experience tells you what the task you're trying to do is. Cool."},{"start":2584.42,"text":"If you think about goal condition policies, you can also view meta-RL as a generalization of goal condition policies."},{"start":2594.19,"text":"There's a set of MDPs that are goal-reaching MDPs, and then there's a broader set of MDPs that are reward-maximizing MDPs. And then the other way to think about this is instead of trying to generalize to new goals, you can think about meta-RL as trying to adapt to new tasks with a small amount of experience. This would be kind of the difference between zero-shot generalization in the goal condition case."},{"start":2619.57,"text":"and K shot generalization with K episodes or K time steps in the meta-RL case. Now, so we've talked about how we can view the experience as the task descriptor Z or the prompt, essentially. But there's actually another way to look at it, which is that if we think about this policy with memory and that has kind of the past memory and then our current policy,"},{"start":2646.96,"text":"If we were to think about what information is being passed right here to the policy, this information is presumably information about the task. And specifically, when ZI isn't part of the state, there's ambiguity about what MDP you're trying to solve, and you're using that experience to try to identify the MDP that you're in."},{"start":2670.46,"text":"And you can sort of think about it as the policy needs to infer the task. It needs to infer specifically some sort of latent task descriptor from its experience. And so another way of looking at meta-URL is something where you are using your experience to infer what the task is and then conditioning your policy that's acting at the current time step on your current estimate of what the task is."},{"start":2698.6,"text":"So you think about it essentially as meta-RL is trying to explore, to infer this unknown task, and then perform the task. I see. So you're asking, because we're going to be inferring the task identifier, why don't we just give it to the learning system? Yeah. So the main reason is that if we don't have a compact way of describing the task that the agent is doing, then it may actually be challenging."}],"speech_gaps":[],"frame":"../frames/v023/016.webp","frame_time":2568.01},{"title":"元强化学习中的表示与部分可观测性","segments":[{"id":152,"text":"If we don't have a good way to represent it, then we're not sure what to pass into the policy. And if we don't have a good way of representing it, we can always resort to just using an index saying this is task one, this is task two, this is task three. But if you do that, and then at test time you say this is task 100,","start":2730.15,"end":2744.15},{"id":153,"text":"it's not going to be able to generalize in that scenario and do anything about that scenario,","start":2745.32,"end":2749.46},{"id":154,"text":"about that task. Whereas experience, like conditioning on experience is something","start":2749.64,"end":2753.9},{"id":155,"text":"that could generalize where it can actually be able to use kind of the more continuous space","start":2753.9,"end":2759.44},{"id":156,"text":"of states, rewards, and so forth in order to figure out a new task. So it comes down to","start":2759.44,"end":2765.06},{"id":157,"text":"representations. And you can sort of view this as like learning a Z representation,","start":2765.06,"end":2769.0},{"id":158,"text":"like learning like a continuous vector that's representing our tasks.","start":2769.76,"end":2773.82},{"id":159,"text":"Now, in Multitask RL, we talked about how if you formulate some state space that corresponds","start":2773.82,"end":2787.0},{"id":160,"text":"to the original state space and the z vector, then you get this aggregate MDP.","start":2787.0,"end":2794.6},{"id":161,"text":"And so the result of this is still an MDP, just with a new state space and new dynamics to account for this new state space.","start":2794.6,"end":2807.1},{"id":162,"text":"And so there's a question of, for meta RL, is there an aggregate MDP?","start":2807.96,"end":2814.64},{"id":163,"text":"p. And this would be for meta RL. And in this case, we're not providing z i in the state.","start":2814.64,"end":2832.84},{"id":164,"text":"And so there's actually like in","start":2833.82,"end":2837.02},{"id":165,"text":"it's actually partially observed.","start":2838.46,"end":2839.82},{"id":166,"text":"You don't actually know what the task is.","start":2840.04,"end":2842.0},{"id":167,"text":"You're trying to explore and figure that out from experience.","start":2842.08,"end":2844.44},{"id":168,"text":"And so there isn't actually an aggregate MDP that you could think about.","start":2845.16,"end":2850.16},{"id":169,"text":"Instead, if you wanted to try to aggregate it into a single decision process,","start":2851.38,"end":2855.3},{"id":170,"text":"it would have to be a partially observed MDP or a POMDP.","start":2855.72,"end":2859.16},{"id":171,"text":"And it's actually a special kind of POMDP where we talked about before","start":2860.26,"end":2866.68},{"id":172,"text":"where you have some sort of partially observed Markov decision process","start":2866.68,"end":2870.52},{"id":173,"text":"where you can't actually observe S.","start":2870.52,"end":2872.44},{"id":174,"text":"And you have actions.","start":2874.7,"end":2877.16},{"id":175,"text":"And instead of observing S, you observe some observations","start":2877.26,"end":2882.1},{"id":176,"text":"that are some function of S.","start":2883.16,"end":2885.56},{"id":177,"text":"That would be kind of the general POMDP case.","start":2888.7,"end":2891.44},{"id":178,"text":"One thing that's a little bit special about the meta RL thing is the only thing that you can't observe is what the task is.","start":2891.44,"end":2900.52}],"notes":["本段讨论了元强化学习（Meta RL）中表示的重要性。如果无法有效表示任务，系统将无法泛化到新任务。使用任务索引（如任务1、任务2）虽然可行，但无法实现真正的泛化。相反，通过经验条件（conditioning on experience）可以利用连续状态空间、奖励等信息来处理新任务。","在元强化学习中，表示（representation）是关键。学习一个连续向量（Z）来表示任务，可以提升模型对新任务的适应能力。这种表示方式不同于传统的多任务强化学习（Multitask RL），后者通过扩展状态空间构建聚合MDP（aggregate MDP）。","在元强化学习中，通常不提供任务表示（z_i）作为状态的一部分。因此，系统处于部分可观测状态（partially observed），无法直接观察到任务本身。这与传统的MDP不同，传统MDP中状态是完全可观测的。","元强化学习中的部分可观测性（partially observed）意味着系统需要通过探索来推断任务。这种设置类似于部分可观测马尔可夫决策过程（POMDP），其中状态S无法直接观察，而是通过观察（observations）来间接获取信息。","POMDP中的观察是状态S的某种函数，这与元强化学习中的任务表示类似。系统通过观察来推断任务，而不是直接获取任务信息。这种机制使得元强化学习能够处理任务的不确定性。","元强化学习的一个特殊之处在于，系统无法直接观察到任务本身，只能通过经验来推断任务。这种设置要求模型具备更强的泛化能力和探索策略，以适应未知的任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2730.15,"end":2900.52,"asr_flags":[159],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2730.15,"text":"If we don't have a good way to represent it, then we're not sure what to pass into the policy. And if we don't have a good way of representing it, we can always resort to just using an index saying this is task one, this is task two, this is task three. But if you do that, and then at test time you say this is task 100,"},{"start":2745.32,"text":"it's not going to be able to generalize in that scenario and do anything about that scenario,"},{"start":2749.64,"text":"about that task. Whereas experience, like conditioning on experience is something"},{"start":2753.9,"text":"that could generalize where it can actually be able to use kind of the more continuous space"},{"start":2759.44,"text":"of states, rewards, and so forth in order to figure out a new task. So it comes down to"},{"start":2765.06,"text":"representations. And you can sort of view this as like learning a Z representation,"},{"start":2769.76,"text":"like learning like a continuous vector that's representing our tasks."},{"start":2773.82,"text":"Now, in Multitask RL, we talked about how if you formulate some state space that corresponds"},{"start":2787.0,"text":"to the original state space and the z vector, then you get this aggregate MDP."},{"start":2794.6,"text":"And so the result of this is still an MDP, just with a new state space and new dynamics to account for this new state space."},{"start":2807.96,"text":"And so there's a question of, for meta RL, is there an aggregate MDP?"},{"start":2814.64,"text":"p. And this would be for meta RL. And in this case, we're not providing z i in the state."},{"start":2833.82,"text":"And so there's actually like in"},{"start":2838.46,"text":"it's actually partially observed."},{"start":2840.04,"text":"You don't actually know what the task is."},{"start":2842.08,"text":"You're trying to explore and figure that out from experience."},{"start":2845.16,"text":"And so there isn't actually an aggregate MDP that you could think about."},{"start":2851.38,"text":"Instead, if you wanted to try to aggregate it into a single decision process,"},{"start":2855.72,"text":"it would have to be a partially observed MDP or a POMDP."},{"start":2860.26,"text":"And it's actually a special kind of POMDP where we talked about before"},{"start":2866.68,"text":"where you have some sort of partially observed Markov decision process"},{"start":2870.52,"text":"where you can't actually observe S."},{"start":2874.7,"text":"And you have actions."},{"start":2877.26,"text":"And instead of observing S, you observe some observations"},{"start":2883.16,"text":"that are some function of S."},{"start":2888.7,"text":"That would be kind of the general POMDP case."},{"start":2891.44,"text":"One thing that's a little bit special about the meta RL thing is the only thing that you can't observe is what the task is."}],"speech_gaps":[{"start":2886.16,"end":2888.3}],"frame":"../frames/v023/017.webp","frame_time":2742.15},{"title":"元强化学习（Meta RL）中的任务识别与策略适应","segments":[{"id":179,"text":"And so it's basically a POMDP where this hidden state space can be defined as the observation and the task identifier.","start":2901.5,"end":2916.14},{"id":180,"text":"and if you can infer the task identifier from experience then you can essentially view it as","start":2916.14,"end":2922.1},{"id":181,"text":"a way of trying to infer the underlying state space as a way to solve the POMDP.","start":2922.1,"end":2928.78},{"id":182,"text":"So this is basically kind of another way of looking at the met RL problem.","start":2930.34,"end":2934.24},{"id":183,"text":"It's basically like a partially observed Markov decision problem.","start":2934.42,"end":2937.02},{"id":184,"text":"And it was actually outputting some distribution over Zs. Because at the very beginning, you actually don't know what Z is. You have some kind of prior belief over what Z is. And then as you get more experience, you're going to have a better and better estimate of what Z is.","start":2938.33,"end":2962.47},{"id":185,"text":"And so if you represent a distribution over this kind of latent task representation, then you can do kind of cool things with that. We'll see that in a bit. So this particular algorithm is looking at continuous control problems where different tasks corresponded to walking in different directions, running at different velocities, and also different physical dynamics. So being able to adapt when the friction is different or the inertia of the robot system is different.","start":2962.88,"end":2991.38},{"id":186,"text":"The other thing was that everything, what we saw before was using like a PPO style algorithm, which is somewhat off policy, but not very off policy. It's kind of more on policy than off policy in some ways, because it's not using a replay buffer of past data. And with meta training algorithms, you can adapt really, really quickly. But the training process might be really slow if your base algorithm is fairly on policy.","start":2992.26,"end":3020.07},{"id":187,"text":"And so as a kind of question, hopefully this should be a straightforward question. If your base algorithm for updating the policy at step four, if that's an off policy algorithm, do you expect that to be more or less efficient than if you used an off policy or than if you used an on policy base method?","start":3021.16,"end":3043.6},{"id":188,"text":"Yeah, more efficient. So if you're using a replay buffer and using that replay buffer to update your policy with memory, that should be a lot more data efficient during this meta training process. At test time when you're adapting, the efficiency is going to be similar. So this is just talking about the efficiency for actually training this sort of in-context learning system.","start":3044.58,"end":3066.6}],"notes":["本段讲解了元强化学习（Meta RL）中任务识别与策略适应的核心思想。讲者指出，元强化学习可以被视为一种部分可观测马尔可夫决策过程（POMDP），其中隐藏状态空间由观测和任务标识符组成。如果能够从经验中推断出任务标识符，就可以将问题视为对隐藏状态空间的推断，从而解决POMDP问题。","讲者提到，元强化学习算法通常会输出一个关于任务表示（Z）的分布，因为初始时并不知道Z的具体值，而是基于先验信念进行估计。随着经验的积累，对Z的估计会越来越准确。这种分布表示使得算法能够适应不同的任务，例如在不同摩擦力或惯性条件下进行控制。","讲者进一步讨论了元强化学习中使用的算法类型，如PPO（Proximal Policy Optimization）风格的算法。这类算法在策略更新时偏向于在线策略（on-policy），而不是完全的离线策略（off-policy），因为它不使用经验回放缓冲区（replay buffer）。这导致元训练过程可能较慢，但适应过程却非常快速。","讲者提出一个关于策略更新效率的问题，询问如果使用离线策略（off-policy）算法是否比在线策略（on-policy）算法更高效。讲者认为，使用经验回放缓冲区的离线策略在元训练过程中会更高效，因为可以利用历史数据进行策略更新，从而提高数据效率。","在测试阶段，当系统需要适应新任务时，效率与训练阶段类似。讲者强调，这里讨论的效率是指训练过程中的数据效率，而不是测试时的适应效率。","讲者通过具体的例子说明了元强化学习的应用场景，如在不同物理动态条件下进行控制任务，例如行走方向、速度变化或摩擦力变化等。这表明元强化学习能够快速适应不同的任务环境。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2901.5,"end":3066.6,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2901.5,"text":"And so it's basically a POMDP where this hidden state space can be defined as the observation and the task identifier."},{"start":2916.14,"text":"and if you can infer the task identifier from experience then you can essentially view it as"},{"start":2922.1,"text":"a way of trying to infer the underlying state space as a way to solve the POMDP."},{"start":2930.34,"text":"So this is basically kind of another way of looking at the met RL problem."},{"start":2934.42,"text":"It's basically like a partially observed Markov decision problem."},{"start":2938.33,"text":"Now, there's a met or all method that we actually talked about. I showed an architecture diagram that was actually explicitly trying to output Zs. And it was actually outputting some distribution over Zs. Because at the very beginning, you actually don't know what Z is. You have some kind of prior belief over what Z is. And then as you get more experience, you're going to have a better and better estimate of what Z is."},{"start":2962.88,"text":"And so if you represent a distribution over this kind of latent task representation, then you can do kind of cool things with that. We'll see that in a bit. So this particular algorithm is looking at continuous control problems where different tasks corresponded to walking in different directions, running at different velocities, and also different physical dynamics. So being able to adapt when the friction is different or the inertia of the robot system is different."},{"start":2992.26,"text":"The other thing was that everything, what we saw before was using like a PPO style algorithm, which is somewhat off policy, but not very off policy. It's kind of more on policy than off policy in some ways, because it's not using a replay buffer of past data. And with meta training algorithms, you can adapt really, really quickly. But the training process might be really slow if your base algorithm is fairly on policy."},{"start":3021.16,"text":"And so as a kind of question, hopefully this should be a straightforward question. If your base algorithm for updating the policy at step four, if that's an off policy algorithm, do you expect that to be more or less efficient than if you used an off policy or than if you used an on policy base method?"},{"start":3044.58,"text":"Yeah, more efficient. So if you're using a replay buffer and using that replay buffer to update your policy with memory, that should be a lot more data efficient during this meta training process. At test time when you're adapting, the efficiency is going to be similar. So this is just talking about the efficiency for actually training this sort of in-context learning system."}],"speech_gaps":[],"frame":"../frames/v023/018.webp","frame_time":2913.5},{"title":"元强化学习（Meta RL）中的数据效率与探索","segments":[{"id":189,"text":"If you look at the curves over this training process right here, the amount of data that you need in order to meta-learn these systems, you can see that in blue, if we're using an off-put policy algorithm with a replay buffer, it's a lot more data efficient, learns a lot more quickly than","start":3068.25,"end":3089.57},{"id":190,"text":"RL squared and, um, and PRMP, which are using, I want to see all three of these are using","start":3090.97,"end":3096.41},{"id":191,"text":"uh, base algorithms, base RL algorithms that are more on policy and more like PPO, uh, for example.","start":3096.45,"end":3102.31},{"id":192,"text":"Yeah. So the question is, um, can I elaborate on what specifically is in the replay buffer?","start":3103.19,"end":3106.87},{"id":193,"text":"So, uh, the typically you'll have, um, well, so each replay buffer will have, um,","start":3107.31,"end":3115.37},{"id":194,"text":"a sequence of episodes.","start":3116.85,"end":3118.79},{"id":195,"text":"Basically, each thing in the replay buffer","start":3119.65,"end":3121.43},{"id":196,"text":"will be a sequence of episodes","start":3121.43,"end":3122.41},{"id":197,"text":"from a given MDP.","start":3122.41,"end":3124.15},{"id":198,"text":"And that includes the states,","start":3125.71,"end":3129.37},{"id":199,"text":"the actions, the rewards.","start":3129.55,"end":3131.03},{"id":200,"text":"And when you optimize this,","start":3132.25,"end":3134.01},{"id":201,"text":"you'll need to...","start":3134.15,"end":3134.73},{"id":202,"text":"Oftentimes, you'll have a different replay buffer per task","start":3134.73,"end":3137.17},{"id":203,"text":"so that you can sample a task here","start":3137.17,"end":3138.63},{"id":204,"text":"and then optimize the reward for that task","start":3138.63,"end":3141.81},{"id":205,"text":"using the memory from that trajectory.","start":3143.03,"end":3146.97},{"id":206,"text":"Typically, the buffer, instead of just storing states and actions,","start":3148.75,"end":3151.33},{"id":207,"text":"you're storing full trajectories together","start":3151.43,"end":3152.97},{"id":208,"text":"because you're going to be training a model with memory.","start":3152.97,"end":3155.95},{"id":209,"text":"And you need to be able to provide that trajectory as input to the policy.","start":3156.15,"end":3161.45},{"id":210,"text":"Cool.","start":3163.01,"end":3163.53},{"id":211,"text":"So summary so far.","start":3163.79,"end":3165.03},{"id":212,"text":"We've talked about using these models to be able to adapt to new MDPs.","start":3165.43,"end":3171.07},{"id":213,"text":"They're general, they're quite expressive, and there's also a variety of choices in the architecture.","start":3171.54,"end":3177.84},{"id":214,"text":"One thing is that are hard to optimize because it needs to figure out how to adapt from data. And there's lots of different input features here that you could try to pay attention to. And the model has to figure out what about those input videos that you're passing as input for the maze navigation is useful when you're then trying to exploit and learn a policy.","start":3178.92,"end":3201.72},{"id":215,"text":"Because you're passing in so many things as input in such a big model, it can be hard to optimize for that reason.","start":3203.32,"end":3208.18},{"id":216,"text":"And it can also be hard to optimize from an exploration standpoint, which we'll talk about right after this.","start":3208.36,"end":3212.26},{"id":217,"text":"And then the sample efficiency of the meta-learning process is going to be inherited from whatever optimizer you use in this last step right here.","start":3213.0,"end":3223.26},{"id":218,"text":"And so if you use something like vanilla policy gradient, it'll be extremely data inefficient.","start":3224.0,"end":3228.52},{"id":219,"text":"If you use something like PPO, it'll be more stable.","start":3228.82,"end":3231.46},{"id":220,"text":"but still fairly inefficient.","start":3231.46,"end":3234.14},{"id":221,"text":"If you use something like SAC,","start":3234.32,"end":3235.78},{"id":222,"text":"it will be probably a lot more efficient.","start":3236.04,"end":3238.44},{"id":223,"text":"You might need to tune the hyperparameters more.","start":3238.62,"end":3240.84},{"id":224,"text":"So now let's talk a bit about exploration.","start":3241.96,"end":3244.14}],"notes":["本段讲解了元强化学习（Meta RL）中数据效率的问题，指出使用离线策略算法（如基于回放缓冲区的算法）比使用在线策略算法（如RL squared和PRMP）更高效，能够更快地学习。同时，提到这些算法通常基于更基础的策略梯度方法，如PPO。","回放缓冲区（replay buffer）存储的是任务的序列，包括状态、动作和奖励。每个任务可能有独立的回放缓冲区，以便在优化奖励时使用该任务的轨迹数据。","回放缓冲区通常存储完整的轨迹，而不是单独的状态和动作，因为模型需要将这些轨迹作为输入来训练具有记忆能力的策略。","在元强化学习中，模型需要从大量输入数据中学习如何适应新的任务，这使得优化变得困难。此外，由于输入数据量大，模型可能难以有效利用这些信息。","探索（exploration）是元强化学习中的另一个挑战，因为模型需要在大量数据中找到有用的信息来学习策略。这可能会影响样本效率。","元强化学习的样本效率取决于最后一步使用的优化器。例如，使用普通策略梯度（vanilla policy gradient）会导致极低的数据效率，而使用PPO则更稳定，但仍然不够高效。SAC（Soft Actor-Critic）可能更高效，但需要调整超参数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3068.25,"end":3244.14,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3068.25,"text":"If you look at the curves over this training process right here, the amount of data that you need in order to meta-learn these systems, you can see that in blue, if we're using an off-put policy algorithm with a replay buffer, it's a lot more data efficient, learns a lot more quickly than"},{"start":3090.97,"text":"RL squared and, um, and PRMP, which are using, I want to see all three of these are using,"},{"start":3096.45,"text":"uh, base algorithms, base RL algorithms that are more on policy and more like PPO, uh, for example."},{"start":3103.19,"text":"Yeah. So the question is, um, can I elaborate on what specifically is in the replay buffer?"},{"start":3107.31,"text":"So, uh, the typically you'll have, um, well, so each replay buffer will have, um,"},{"start":3116.85,"text":"a sequence of episodes."},{"start":3119.65,"text":"Basically, each thing in the replay buffer"},{"start":3121.43,"text":"will be a sequence of episodes"},{"start":3122.41,"text":"from a given MDP."},{"start":3125.71,"text":"And that includes the states,"},{"start":3129.55,"text":"the actions, the rewards."},{"start":3132.25,"text":"And when you optimize this,"},{"start":3134.15,"text":"you'll need to..."},{"start":3134.73,"text":"Oftentimes, you'll have a different replay buffer per task"},{"start":3137.17,"text":"so that you can sample a task here"},{"start":3138.63,"text":"and then optimize the reward for that task"},{"start":3143.03,"text":"using the memory from that trajectory."},{"start":3148.75,"text":"Typically, the buffer, instead of just storing states and actions,"},{"start":3151.43,"text":"you're storing full trajectories together"},{"start":3152.97,"text":"because you're going to be training a model with memory."},{"start":3156.15,"text":"And you need to be able to provide that trajectory as input to the policy."},{"start":3163.01,"text":"Cool."},{"start":3163.79,"text":"So summary so far."},{"start":3165.43,"text":"We've talked about using these models to be able to adapt to new MDPs."},{"start":3171.54,"text":"They're general, they're quite expressive, and there's also a variety of choices in the architecture."},{"start":3178.92,"text":"One thing is that are hard to optimize because it needs to figure out how to adapt from data. And there's lots of different input features here that you could try to pay attention to. And the model has to figure out what about those input videos that you're passing as input for the maze navigation is useful when you're then trying to exploit and learn a policy."},{"start":3203.32,"text":"Because you're passing in so many things as input in such a big model, it can be hard to optimize for that reason."},{"start":3208.36,"text":"And it can also be hard to optimize from an exploration standpoint, which we'll talk about right after this."},{"start":3213.0,"text":"And then the sample efficiency of the meta-learning process is going to be inherited from whatever optimizer you use in this last step right here."},{"start":3224.0,"text":"And so if you use something like vanilla policy gradient, it'll be extremely data inefficient."},{"start":3228.82,"text":"If you use something like PPO, it'll be more stable."},{"start":3231.46,"text":"but still fairly inefficient."},{"start":3234.32,"text":"If you use something like SAC,"},{"start":3236.04,"text":"it will be probably a lot more efficient."},{"start":3238.62,"text":"You might need to tune the hyperparameters more."},{"start":3241.96,"text":"So now let's talk a bit about exploration."}],"speech_gaps":[],"frame":"../frames/v023/019.webp","frame_time":3080.25},{"title":"元强化学习（Meta RL）中的探索与利用","segments":[{"id":225,"text":"By exploration, I mean like exploration in context,","start":3244.68,"end":3248.7},{"id":226,"text":"exploration when you're trying to explore a new task.","start":3248.78,"end":3253.9},{"id":227,"text":"What we've talked about so far","start":3254.94,"end":3256.34},{"id":228,"text":"is trying to optimize end-to-end","start":3256.34,"end":3257.92},{"id":229,"text":"for exploration and exploitation","start":3257.92,"end":3260.34},{"id":230,"text":"exploitation with respect to the final sum of rewards.","start":3260.34,"end":3263.16},{"id":231,"text":"The simple and principle, it can actually yield the optimal","start":3265.0,"end":3268.06},{"id":232,"text":"exploration-exploitation trade-off because you're optimizing directly for some of the","start":3268.06,"end":3271.96},{"id":233,"text":"sum of rewards. And that's really, really nice. But it can be a really","start":3271.96,"end":3276.3},{"id":234,"text":"challenging optimization. And let's talk about why that's the case.","start":3276.3,"end":3279.58},{"id":235,"text":"So let's look at a","start":3280.16,"end":3284.26},{"id":236,"text":"running example. So say that you have","start":3284.26,"end":3286.14},{"id":237,"text":"some robot that looks like this and the robot needs to find something and there are some","start":3286.14,"end":3298.94},{"id":238,"text":"hallways that the robot might need to go down in order to try to find the thing that is trying to","start":3298.94,"end":3309.0},{"id":239,"text":"And different tasks correspond to different locations of the object that it's trying to find. So in one task or one scenario, it might be all the way over here. In another scenario, it might be over here, and so forth. And to help the robot out a little bit, we're going to introduce one other thing, which is that there's going to be some piece of paper over here. And that paper actually says,","start":3309.74,"end":3336.59},{"id":240,"text":"where the object is in words. Maybe it's trying to find a replacement light bulb or something like that, and it says the light bulb is in the fourth hallway at the end. Here's our robot. Here are the hallways. Different tasks correspond to navigating to the ends of the different halls. We have some information about where to go. If we look at that,","start":3338.23,"end":3363.23},{"id":241,"text":"information will be in the state about where the reward is for this task. Now, how do we actually learn how to explore? So say that we were trying to collect trajectories and trying to learn how to explore such that we can get good behavior. So let's start with a scenario where we sample the task and","start":3364.82,"end":3393.2},{"id":242,"text":"maybe the task was to go to the end of this hallway right here. And say that we collected a, we actually kind of just got lucky. We collected a trajectory that just went straight to that reward. Now, in some ways that seems good because we got reward for that. And so that gave us some reward. And that's like optimizing the objective that we care about ultimately.","start":3393.99,"end":3422.37}],"notes":["本段讨论了元强化学习中探索与利用的平衡问题。讲者指出，通过直接优化奖励总和，可以实现最优的探索与利用权衡。然而，这种优化过程可能具有挑战性，因为需要在探索新任务和利用已有知识之间找到合适的平衡。","讲者通过一个机器人寻找物品的示例来说明问题。不同任务对应于物品在不同位置，机器人需要根据任务信息导航到目标位置。这种任务结构强调了元学习中对任务间共性的学习能力。","在示例中，讲者提到机器人可能通过纸条获得关于物品位置的信息。这种信息在任务状态中体现，有助于机器人更快地找到目标。这说明了元强化学习中如何利用任务间的先验知识来加速学习过程。","讲者进一步说明了如何通过收集轨迹来学习探索策略。在某些情况下，机器人可能通过一次成功的轨迹获得奖励，从而优化其探索策略。这种直接优化奖励总和的方法在元强化学习中具有重要意义。","讲者强调了探索与利用之间的权衡问题。直接优化奖励总和虽然有效，但可能面临优化难度大的问题。这反映了元强化学习中需要解决的核心挑战之一。","讲者通过具体例子说明了元强化学习的应用场景，即机器人在不同任务中导航到目标位置。这种任务结构为元学习提供了丰富的学习机会，同时也带来了探索与利用的复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3244.68,"end":3422.37,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3244.68,"text":"By exploration, I mean like exploration in context,"},{"start":3248.78,"text":"exploration when you're trying to explore a new task."},{"start":3254.94,"text":"What we've talked about so far"},{"start":3256.34,"text":"is trying to optimize end-to-end"},{"start":3257.92,"text":"for exploration and exploitation"},{"start":3260.34,"text":"exploitation with respect to the final sum of rewards."},{"start":3265.0,"text":"The simple and principle, it can actually yield the optimal"},{"start":3268.06,"text":"exploration-exploitation trade-off because you're optimizing directly for some of the"},{"start":3271.96,"text":"sum of rewards. And that's really, really nice. But it can be a really"},{"start":3276.3,"text":"challenging optimization. And let's talk about why that's the case."},{"start":3280.16,"text":"So let's look at a"},{"start":3284.26,"text":"running example. So say that you have"},{"start":3286.14,"text":"some robot that looks like this and the robot needs to find something and there are some"},{"start":3298.94,"text":"hallways that the robot might need to go down in order to try to find the thing that is trying to"},{"start":3309.74,"text":"And different tasks correspond to different locations of the object that it's trying to find. So in one task or one scenario, it might be all the way over here. In another scenario, it might be over here, and so forth. And to help the robot out a little bit, we're going to introduce one other thing, which is that there's going to be some piece of paper over here. And that paper actually says,"},{"start":3338.23,"text":"where the object is in words. Maybe it's trying to find a replacement light bulb or something like that, and it says the light bulb is in the fourth hallway at the end. Here's our robot. Here are the hallways. Different tasks correspond to navigating to the ends of the different halls. We have some information about where to go. If we look at that,"},{"start":3364.82,"text":"information will be in the state about where the reward is for this task. Now, how do we actually learn how to explore? So say that we were trying to collect trajectories and trying to learn how to explore such that we can get good behavior. So let's start with a scenario where we sample the task and"},{"start":3393.99,"text":"maybe the task was to go to the end of this hallway right here. And say that we collected a, we actually kind of just got lucky. We collected a trajectory that just went straight to that reward. Now, in some ways that seems good because we got reward for that. And so that gave us some reward. And that's like optimizing the objective that we care about ultimately."}],"speech_gaps":[],"frame":"../frames/v023/020.webp","frame_time":3256.68},{"title":"元强化学习中的探索与利用策略","segments":[{"id":243,"text":"But the thing that's bad about this is that the robot got lucky, and it doesn't actually know how to repeat that in the future because it didn't actually explore any other alternatives. And so this is going to be, the way that we can kind of do this is if it goes to the end of the correct hallway, it'll get positive reward, but the context leading up to getting that positive reward","start":3424.24,"end":3450.62},{"id":244,"text":"doesn't actually look different than any other task. It kind of went through here, and there's nothing that kind of differentiates what it did there, which was like zero reward, zero reward, than if the task, for example, had been to go here or to go here. And as a result, it didn't actually learn how to explore, and it didn't learn how to use exploration information in order to solve the task.","start":3451.28,"end":3475.16},{"id":245,"text":"And so this trajectory might not actually be very helpful for learning how to explore and learning how to exploit. Now let's say that we had a different trajectory. So we're exploring. And let's say that the agent, instead of doing that, it maybe sampled the same task, and it went to the end of this trajectory and then continued, didn't see that, and then went to the end.","start":3475.64,"end":3506.15},{"id":246,"text":"of this trajectory. So that would be good in the sense that it does actually have, like, it did kind of rule out, it has experience that ruled out one task, and then it got reward for a different task. And so it's going to be teaching it something about an exploration strategy that works. The downside is that exploration strategy is quite suboptimal, because it would have been a lot more efficient to first look at the instructions and then go to the correct position.","start":3506.72,"end":3536.43},{"id":247,"text":"And so it's somewhat good, somewhat bad. It provides signal on a suboptimal exploration and exploitation strategy. And so it's perhaps better than the first trajectory that it did, but still not ideal. Now let's consider a third trajectory. Say that we are, again, collecting data for the meta RL process. And let's say that the agent...","start":3537.24,"end":3565.28},{"id":248,"text":"decided to look at the instructions and then just stay and watch the instructions. Does anyone have thoughts on whether that would be a useful trajectory or not for the learning process? Yeah, exactly. So it did something useful, but it doesn't get any reward for that. It only gets reward if it did that and then went here. And so that's also not going to be very useful for the learning problem.","start":3566.72,"end":3595.02}],"notes":["本段讨论了元强化学习（Meta RL）中探索与利用策略的重要性。讲者指出，如果智能体仅依赖偶然的成功经验，而没有探索其他可能性，那么它将无法学习到有效的探索策略。这种情况下，智能体无法区分不同任务之间的差异，因此无法学习如何利用探索信息来解决问题。","讲者进一步说明，如果智能体采取了不同的探索策略，例如尝试多个任务并获得不同奖励，那么它将获得关于探索策略的有用信息。然而，这种策略可能效率较低，因为智能体没有先查看任务指示，而是直接尝试任务，这可能导致不必要的探索。","讲者还提到，如果智能体选择先查看任务指示，然后停留在指示上，这可能是一种有用的策略，但不会获得奖励。因此，这种策略虽然有助于理解任务，但无法直接促进学习过程。","讲者通过不同轨迹的对比，强调了在元强化学习中，探索与利用之间的平衡至关重要。有效的探索策略需要在尝试不同任务和利用已有信息之间找到合适的平衡点，以提高学习效率。","讲者指出，智能体在学习过程中需要从不同轨迹中提取有用的信息，以改进其探索和利用策略。然而，如果轨迹中没有明确的奖励信号，那么这些信息可能无法被有效利用。","最后，讲者通过提问的方式引导学生思考，强调了在元强化学习中，如何设计有效的探索策略是关键问题之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3424.24,"end":3595.02,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3424.24,"text":"But the thing that's bad about this is that the robot got lucky, and it doesn't actually know how to repeat that in the future because it didn't actually explore any other alternatives. And so this is going to be, the way that we can kind of do this is if it goes to the end of the correct hallway, it'll get positive reward, but the context leading up to getting that positive reward"},{"start":3451.28,"text":"doesn't actually look different than any other task. It kind of went through here, and there's nothing that kind of differentiates what it did there, which was like zero reward, zero reward, than if the task, for example, had been to go here or to go here. And as a result, it didn't actually learn how to explore, and it didn't learn how to use exploration information in order to solve the task."},{"start":3475.64,"text":"And so this trajectory might not actually be very helpful for learning how to explore and learning how to exploit. Now let's say that we had a different trajectory. So we're exploring. And let's say that the agent, instead of doing that, it maybe sampled the same task, and it went to the end of this trajectory and then continued, didn't see that, and then went to the end."},{"start":3506.72,"text":"of this trajectory. So that would be good in the sense that it does actually have, like, it did kind of rule out, it has experience that ruled out one task, and then it got reward for a different task. And so it's going to be teaching it something about an exploration strategy that works. The downside is that exploration strategy is quite suboptimal, because it would have been a lot more efficient to first look at the instructions and then go to the correct position."},{"start":3537.24,"text":"And so it's somewhat good, somewhat bad. It provides signal on a suboptimal exploration and exploitation strategy. And so it's perhaps better than the first trajectory that it did, but still not ideal. Now let's consider a third trajectory. Say that we are, again, collecting data for the meta RL process. And let's say that the agent..."},{"start":3566.72,"text":"decided to look at the instructions and then just stay and watch the instructions. Does anyone have thoughts on whether that would be a useful trajectory or not for the learning process? Yeah, exactly. So it did something useful, but it doesn't get any reward for that. It only gets reward if it did that and then went here. And so that's also not going to be very useful for the learning problem."}],"speech_gaps":[],"frame":"../frames/v023/021.webp","frame_time":3436.24},{"title":"元强化学习（Meta RL）中的探索与利用问题","segments":[{"id":249,"text":"Basically, in a problem like this, you're only going to actually be learning something useful about how to explore and exploit if you successfully did the proper exploration behavior and then did the exploitation behavior. If you do them in separate episodes, then you're not actually getting good learning signal.","start":3597.32,"end":3617.55},{"id":250,"text":"And that means that you sort of have this kind of sample complexity where you need to actually get lucky and do both of the two things at the same time in order to get signal that helps you learn the problem. So basically, it's hard to learn how to explore and exploit at the same time. Another example of this is say that you're trying to learn how to cook. You have data in previous kitchens. Your goal is to then be able to quickly learn how to cook in a new kitchen. Now, in order to learn how to cook, you need to find the ingredients.","start":3618.6,"end":3650.49},{"id":251,"text":"And if you haven't yet figured out how to find the ingredients because you have bad exploration, then you can't learn how to cook because you don't have the ingredients with you. And then you're going to get low reward. And then also, if you don't yet know how to cook because you haven't collected experience on that, then regardless of the exploration you do, you're going to get low reward. And so you sort of have this chicken and egg problem between learning how to explore.","start":3651.59,"end":3677.03},{"id":252,"text":"And learning how to solve the task using that information. And so there's another way to view this is this kind of coupling problem where exploration and execution or exploitation depend on each other in order to be jointly successful.","start":3677.77,"end":3691.25},{"id":253,"text":"Then the way to view end-to-end training is that it's great in that you can learn this optimal trade-off, but it can be extremely challenging if you have a hard exploration problem because you need to figure out how to explore and exploit and get learning signal that way.","start":3693.9,"end":3708.5},{"id":254,"text":"The question is, is the ultimate challenge here that the reward is sparse? So it's true that if you had a dense reward, you'd be in a much better place. Basically because you wouldn't really have to explore. You would be able to... You wouldn't have to explicitly take actions to explore.","start":3709.82,"end":3730.69},{"id":255,"text":"And this really comes down to a problem when exploration is hard. If exploration is easy, this really isn't a problem because you no longer have to solve both exploration and exploitation. You only have to solve exploitation. So there's a couple of solutions to this, and we'll start to talk about one solution today. And then on Friday, we'll talk about more solutions. So the second solution, I'm not going to go into complete detail on how these work.","start":3732.7,"end":3760.27}],"notes":["本段讨论了在强化学习中，探索与利用之间的耦合问题。如果探索行为不佳，就无法获取必要的信息来完成任务，从而导致低奖励。同样，如果尚未掌握任务的解决方法，无论探索如何进行，都无法获得有效学习信号。这种相互依赖的关系形成了类似‘鸡与蛋’的问题。","讲者通过烹饪的例子说明了探索与利用的耦合性。在新环境中学习烹饪时，必须同时具备找到食材（探索）和使用这些食材进行烹饪（利用）的能力。如果缺乏其中任何一个环节，都无法获得有效的学习信号。","讲者指出，探索与利用的耦合问题使得端到端训练变得极具挑战性。特别是在探索困难的情况下，需要同时解决探索和利用的问题，以获取有效的学习信号。","讲者进一步提出，奖励稀疏性可能是这一问题的核心挑战。如果奖励是密集的，就不需要显式地进行探索，因为系统可以自动获得反馈。然而，在奖励稀疏的情况下，探索和利用的平衡变得尤为重要。","讲者提到，解决这一问题的策略将在后续课程中展开讨论。今天将介绍其中一种解决方案，而周五将讨论更多方法。这表明，探索与利用的耦合问题是一个复杂且需要多方面策略解决的问题。","讲者强调，探索与利用的相互依赖关系是元强化学习中的关键挑战之一。这种耦合性使得系统需要同时优化探索和利用策略，以实现有效的学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3597.32,"end":3760.27,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3597.32,"text":"Basically, in a problem like this, you're only going to actually be learning something useful about how to explore and exploit if you successfully did the proper exploration behavior and then did the exploitation behavior. If you do them in separate episodes, then you're not actually getting good learning signal."},{"start":3618.6,"text":"And that means that you sort of have this kind of sample complexity where you need to actually get lucky and do both of the two things at the same time in order to get signal that helps you learn the problem. So basically, it's hard to learn how to explore and exploit at the same time. Another example of this is say that you're trying to learn how to cook. You have data in previous kitchens. Your goal is to then be able to quickly learn how to cook in a new kitchen. Now, in order to learn how to cook, you need to find the ingredients."},{"start":3651.59,"text":"And if you haven't yet figured out how to find the ingredients because you have bad exploration, then you can't learn how to cook because you don't have the ingredients with you. And then you're going to get low reward. And then also, if you don't yet know how to cook because you haven't collected experience on that, then regardless of the exploration you do, you're going to get low reward. And so you sort of have this chicken and egg problem between learning how to explore."},{"start":3677.77,"text":"And learning how to solve the task using that information. And so there's another way to view this is this kind of coupling problem where exploration and execution or exploitation depend on each other in order to be jointly successful."},{"start":3693.9,"text":"Then the way to view end-to-end training is that it's great in that you can learn this optimal trade-off, but it can be extremely challenging if you have a hard exploration problem because you need to figure out how to explore and exploit and get learning signal that way."},{"start":3709.82,"text":"The question is, is the ultimate challenge here that the reward is sparse? So it's true that if you had a dense reward, you'd be in a much better place. Basically because you wouldn't really have to explore. You would be able to... You wouldn't have to explicitly take actions to explore."},{"start":3732.7,"text":"And this really comes down to a problem when exploration is hard. If exploration is easy, this really isn't a problem because you no longer have to solve both exploration and exploitation. You only have to solve exploitation. So there's a couple of solutions to this, and we'll start to talk about one solution today. And then on Friday, we'll talk about more solutions. So the second solution, I'm not going to go into complete detail on how these work."}],"speech_gaps":[],"frame":"../frames/v023/022.webp","frame_time":3609.32},{"title":"元强化学习中的后验采样方法","segments":[{"id":256,"text":"One solution here is instead of optimizing just for end-to-end reward, you can add in auxiliary exploration objectives to encourage it to try to actually figure out something more meaningful about the task. One approach here is to use what's called posterior sampling, also called Thompson sampling. And the way that this works is that we talked about","start":3761.16,"end":3789.92},{"id":257,"text":"We talked about having an algorithm where you're trying to infer what the task is. And if you've collected some experience so far, and you've inferred some distribution over your task, in this case, zi is now kind of some latent representation. It's not a representation that's known.","start":3790.73,"end":3818.69},{"id":258,"text":"Then what you could do is you could then sample from this distribution and then act as if that was the correct task. So if you have this task inference procedure and then you also have a policy that given an estimate of Z is able to generate actions, then what you can do is you can sample a Z from this distribution and then sample from this policy.","start":3819.65,"end":3848.21},{"id":259,"text":"And if you have policies that are able to, this starts to kind of decouple the problem a little bit, because if you have policies that for a given Z are kind of do the task, then you would basically learn an exploration strategy that is trying to kind of go down the different corridors to find.","start":3849.04,"end":3875.0},{"id":260,"text":"the solution. So as an example, this is actually a problem that looks somewhat similar to the corridors where you get a sparse reward if you reach one of these circles and the different circles correspond to different tasks. And in this case, we've sampled this task right here. And first we sample","start":3876.16,"end":3895.71},{"id":261,"text":"a Z from our kind of prior over tasks without any, we haven't collected any data yet. So we sample Z, we then run our policy based on those different Zs and we get exploration based on these. And then we use that to infer what the task might be. And so now we know that the task is probably either over here or over here. And so now you'll collect trajectories that are lighter in color that are like this one, this one, and going over here.","start":3896.53,"end":3923.13}],"notes":["本段讲解了元强化学习中的一种方法，即通过后验采样（Thompson sampling）来鼓励探索。这种方法通过从任务分布中采样潜在表示（Z），并基于该表示生成策略，从而实现对任务的探索。","讲者提到，当收集到经验后，可以推断出任务的分布，其中Z是一个潜在表示，但其具体形式是未知的。通过从该分布中采样，可以模拟出正确的任务，从而生成策略。","这种方法将任务推理过程与策略生成过程解耦，使得策略能够针对不同的Z值执行任务。这有助于学习一种探索策略，尝试不同的路径以找到解决方案。","讲者以走廊问题为例，说明了稀疏奖励的设置，其中不同的圆圈代表不同的任务。通过采样Z并运行策略，可以探索不同的路径，并据此推断任务的可能位置。","在没有数据的情况下，首先从任务的先验分布中采样Z，然后运行策略以获得探索结果。这些探索结果用于推断任务的可能位置，从而指导后续的轨迹收集。","最后，讲者指出，通过这种方式，可以收集到不同颜色的轨迹，这些轨迹对应于不同的探索路径，从而帮助进一步理解任务的结构。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3761.16,"end":3923.13,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3761.16,"text":"One solution here is instead of optimizing just for end-to-end reward, you can add in auxiliary exploration objectives to encourage it to try to actually figure out something more meaningful about the task. One approach here is to use what's called posterior sampling, also called Thompson sampling. And the way that this works is that we talked about"},{"start":3790.73,"text":"We talked about having an algorithm where you're trying to infer what the task is. And if you've collected some experience so far, and you've inferred some distribution over your task, in this case, zi is now kind of some latent representation. It's not a representation that's known. Then what you could do is you could then sample"},{"start":3819.65,"text":"from this distribution and then act as if that was the correct task. So if you have this task inference procedure and then you also have a policy that given an estimate of Z is able to generate actions, then what you can do is you can sample a Z from this distribution and then sample from this policy."},{"start":3849.04,"text":"And if you have policies that are able to, this starts to kind of decouple the problem a little bit, because if you have policies that for a given Z are kind of do the task, then you would basically learn an exploration strategy that is trying to kind of go down the different corridors to find."},{"start":3876.16,"text":"the solution. So as an example, this is actually a problem that looks somewhat similar to the corridors where you get a sparse reward if you reach one of these circles and the different circles correspond to different tasks. And in this case, we've sampled this task right here. And first we sample"},{"start":3896.53,"text":"a Z from our kind of prior over tasks without any, we haven't collected any data yet. So we sample Z, we then run our policy based on those different Zs and we get exploration based on these. And then we use that to infer what the task might be. And so now we know that the task is probably either over here or over here. And so now you'll collect trajectories that are lighter in color that are like this one, this one, and going over here."}],"speech_gaps":[],"frame":"../frames/v023/023.webp","frame_time":3773.16},{"title":"元强化学习中的探索问题与策略局限","segments":[{"id":262,"text":"And then once you've actually collected this trajectory, then you should actually have a much narrower distribution over the task because you get positive reward here. And so then your policy or your Z distribution will be narrowed out here and you'll attribute your policy according to those Zs. And so that's kind of one approach for addressing this exploration problem.","start":3924.53,"end":3947.33},{"id":263,"text":"Basically learning this latent representation over tasks and then sampling from those tasks, from that distribution and acting according to your policy for that task. Does anyone have thoughts on like, so there's some scenarios where this is great and scenarios where this is not so great. Does anyone have thoughts on when this sort of sampling might be bad? Like what sort of MDPs this might not work well in? If you have a large action space, that could contribute.","start":3948.11,"end":3977.09},{"id":264,"text":"Although it isn't just having to do with the action space, because if you have a dense reward in a large action space, you'd be probably okay. So if Z is out of distribution, certainly things will be problematic. But even in distribution, there's scenarios where this exploration strategy will be really bad. Yeah, so one scenario where this might work poorly is if you start to see some reward","start":3978.61,"end":4006.33},{"id":265,"text":"but there might actually be even better reward in another scenario. You might kind of start to exploit a little bit too early, although it won't rule out those higher reward scenarios if it knows that there are other tasks that might have higher rewards. So I guess the kind of the scenario that I was thinking of where I think that this can be quite bad is actually a lot like this scenario right here. So the strategy that posterior sampling will learn in this scenario is instead of looking at the instructions,","start":4007.59,"end":4036.46},{"id":266,"text":"it's instead going to go down each of the hallways and try to find the reward. Because it's trying to explicitly explore by executing policies corresponding to different tasks. And this will be especially bad if the hallways are very long.","start":4037.17,"end":4049.71},{"id":267,"text":"So if the hallways are really, really long, like, I don't know, take days to traverse, then what it's going to do is it's going to spend days going down one of them and figuring out that it's not the right one and then spend days going down another one rather than trying to seek out information that might tell it about what to do. Cool. So, for example, if these goals are very far away and there's some sign that tells you what the correct goal is, then this is a bad strategy. Now, if that sign doesn't exist, then kind of,","start":4050.43,"end":4080.53}],"notes":["本段讨论了元强化学习（Meta RL）中通过收集轨迹来缩小任务分布的方法，以及如何通过Z分布来调整策略。讲者指出，这种策略在某些情况下可以有效解决探索问题，但在其他情况下可能表现不佳。","讲者进一步探讨了该策略的局限性，特别是在大型动作空间中，如果奖励密度高，可能不会造成太大问题。但如果Z分布偏离真实分布，或者任务分布中存在更优的奖励场景，该策略可能表现不佳。","讲者举了一个具体例子，即在长走廊中寻找奖励的场景。如果走廊很长，策略会花费大量时间探索每个走廊，而不是通过信息获取来优化决策，这在某些情况下是不理想的。","讲者还提到，如果目标距离很远且存在指示信息，这种策略会表现得很差；但如果不存在指示信息，策略可能仍然会尝试探索，但效率低下。","讲者强调了探索策略在不同任务分布和奖励结构下的表现差异，指出该策略在某些情况下可能过于依赖直接探索，而忽略了信息获取的重要性。","最后，讲者通过走廊的例子说明了策略的局限性，并指出在缺乏明确指示的情况下，策略可能无法有效优化探索路径。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3924.53,"end":4080.53,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3924.53,"text":"And then once you've actually collected this trajectory, then you should actually have a much narrower distribution over the task because you get positive reward here. And so then your policy or your Z distribution will be narrowed out here and you'll attribute your policy according to those Zs. And so that's kind of one approach for addressing this exploration problem."},{"start":3948.11,"text":"Basically learning this latent representation over tasks and then sampling from those tasks, from that distribution and acting according to your policy for that task. Does anyone have thoughts on like, so there's some scenarios where this is great and scenarios where this is not so great. Does anyone have thoughts on when this sort of sampling might be bad? Like what sort of MDPs this might not work well in? If you have a large action space, that could contribute."},{"start":3978.61,"text":"Although it isn't just having to do with the action space, because if you have a dense reward in a large action space, you'd be probably okay. So if Z is out of distribution, certainly things will be problematic. But even in distribution, there's scenarios where this exploration strategy will be really bad. Yeah, so one scenario where this might work poorly is if you start to see some reward"},{"start":4007.59,"text":"but there might actually be even better reward in another scenario. You might kind of start to exploit a little bit too early, although it won't rule out those higher reward scenarios if it knows that there are other tasks that might have higher rewards. So I guess the kind of the scenario that I was thinking of where I think that this can be quite bad is actually a lot like this scenario right here. So the strategy that posterior sampling will learn in this scenario is instead of looking at the instructions,"},{"start":4037.17,"text":
