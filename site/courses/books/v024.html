display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 14 探索机制（Exploration） · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v024","title":"Lecture 14 探索机制（Exploration）","course":"强化学习","pages":[{"title":"探索机制（Exploration）","segments":[{"id":0,"text":"Okay, let's get started. Today we're going to be talking about exploration. We're going to be starting by talking about exploration in kind of standard reinforcement learning settings, actually primarily in bandit settings, and then how that might translate to robotics and large language models. And then we're actually going to revisit some of the meta-learning topics that we talked about on Wednesday and revisit how we might effectively learn how to explore in meta-RL settings."},{"id":1,"text":"So what is the exploration problem? If we apply reinforcement learning to some problems, we're able to solve them quite well. So for example, if we try to train a reinforcement learning agent to play Breakout, where the reward is the score of the game, you get a pretty performant player that's able to get a high score."},{"id":2,"text":"But if you instead try to train a reinforcement learning agent to play a game like this one on the right, which is called Montezuma's Revenge, it's really, really hard for reinforcement learning systems to play. Now, why is there this difference? So in the second game,"},{"id":3,"text":"You can get a reward if you get a key, kind of intuitively, if you're getting a key that's useful for being able to progress. Opening a door is also useful. And if there's this kind of skull that's rolling around, and intuitively, we as humans know that that's probably something you might want to avoid. Likewise, falling off of a ledge might be something that you would avoid. But these are things that the agent doesn't know itself."},{"id":4,"text":"In general, completing the game,"},{"id":5,"text":"These are very sparse, discrete events, and completing the game only weekly correlates with those rewarding events. Each of those individual rewarding events are also few and far between. For example, at the beginning, the agent isn't getting any reward at all, and it has to figure out how to even get to the key in the first place, which requires quite a long sequence of events."},{"id":6,"text":"Now, as humans, we kind of know what to do because we understand what each of these sprites in the game mean."},{"id":7,"text":"But the algorithm really doesn't know that."},{"id":8,"text":"So if we instead try to imagine ourselves as reinforcement learning algorithms, let's think about through that a little bit."},{"id":9,"text":"And we can think through that with a game called Mao."},{"id":10,"text":"It's kind of a, it's like half a game, half a joke in some ways."},{"id":11,"text":"You aren't told the rules of the game in advance."},{"id":12,"text":"And if you break a rule, then you get a penalty."},{"id":13,"text":"And you don't actually know, you get a penalty, but you don't actually know what the rule is."},{"id":14,"text":"And you have to discover the rules through trial and error."},{"id":15,"text":"And when you get a penalty, it's not always clear why you got a penalty."}],"notes":["本段讲解了探索问题在强化学习中的重要性，通过对比Breakout和Montezuma's Revenge两个游戏，说明了探索在稀疏奖励环境中的挑战。在Montezuma's Revenge中，奖励事件非常稀疏，且需要长时间的序列操作才能获得，这使得探索变得困难。","讲者指出，人类玩家能够理解游戏中的各种元素（如钥匙、门、骷髅等）的含义，而强化学习算法则无法自动识别这些元素的意义，因此需要通过探索来学习。","讲者通过Mao游戏的例子，进一步说明了探索的必要性。在这个游戏中，玩家需要通过试错来发现规则，而惩罚的原因往往不明确，这与强化学习中稀疏奖励的问题类似。","讲者强调，探索是强化学习中的核心问题之一，尤其是在稀疏奖励和复杂环境中，算法需要通过探索来发现有效的策略，而不仅仅是利用已知的信息。","在Mao游戏中，玩家无法提前知道规则，因此必须通过试错来学习，这与强化学习中探索与利用的权衡问题相呼应。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":183.0,"asr_flags":[],"raw_segments":[{"start":5.2,"text":"Okay, let's get started. Today we're going to be talking about exploration. We're going to be starting by talking about exploration in kind of standard reinforcement learning settings, actually primarily in bandit settings, and then how that might translate to robotics and large language models. And then we're actually going to revisit some of the meta-learning topics that we talked about on Wednesday and revisit how we might effectively learn how to explore in meta-RL settings."},{"start":33.62,"text":"So what is the exploration problem? If we apply reinforcement learning to some problems, we're able to solve them quite well. So for example, if we try to train a reinforcement learning agent to play Breakout, where the reward is the score of the game, you get a pretty performant player that's able to get a high score."},{"start":57.28,"text":"But if you instead try to train a reinforcement learning agent to play a game like this one on the right, which is called Montezuma's Revenge, it's really, really hard for reinforcement learning systems to play. Now, why is there this difference? So in the second game,"},{"start":79.36,"text":"You can get a reward if you get a key, kind of intuitively, if you're getting a key that's useful for being able to progress. Opening a door is also useful. And if there's this kind of skull that's rolling around, and intuitively, we as humans know that that's probably something you might want to avoid. Likewise, falling off of a ledge might be something that you would avoid. But these are things that the agent doesn't know itself."},{"start":106.4,"text":"In general, completing the game,"},{"start":110.5,"text":"These are very sparse, discrete events, and completing the game only weekly correlates with those rewarding events. Each of those individual rewarding events are also few and far between. For example, at the beginning, the agent isn't getting any reward at all, and it has to figure out how to even get to the key in the first place, which requires quite a long sequence of events."},{"start":137.54,"text":"Now, as humans, we kind of know what to do because we understand what each of these sprites in the game mean."},{"start":145.7,"text":"But the algorithm really doesn't know that."},{"start":148.16,"text":"So if we instead try to imagine ourselves as reinforcement learning algorithms, let's think about through that a little bit."},{"start":154.66,"text":"And we can think through that with a game called Mao."},{"start":159.06,"text":"It's kind of a, it's like half a game, half a joke in some ways."},{"start":164.08,"text":"You aren't told the rules of the game in advance."},{"start":167.94,"text":"And if you break a rule, then you get a penalty."},{"start":171.96,"text":"And you don't actually know, you get a penalty, but you don't actually know what the rule is."},{"start":176.66,"text":"And you have to discover the rules through trial and error."},{"start":179.88,"text":"And when you get a penalty, it's not always clear why you got a penalty."}],"speech_gaps":[],"frame":"../frames/v024/001.webp","frame_time":17.2},{"title":"探索机制（Exploration）","segments":[{"id":16,"text":"The rules don't actually necessarily make sense to you."},{"id":17,"text":"And tasks like Montezuma's Revenge are difficult because reinforcement learning methods,"},{"id":18,"text":"is they don't know about the rules. They know very little about what's good and what's bad,"},{"id":19,"text":"what they can do, what they can't do. And when tasks become longer and longer,"},{"id":20,"text":"this also makes the problem even more difficult because you have to figure out an even longer"},{"id":21,"text":"sequence of actions that might lead to getting reward versus getting a penalty."},{"id":22,"text":"And so if you think about kind of what the reinforcement learning agent has to do,"},{"id":23,"text":"reinforcement learning agents are kind of analogous to imagining if your goal in life"},{"id":24,"text":"was to win 50 games of of Mao and you also didn't even know this in advance you only kind of learn"},{"id":25,"text":"this from actually getting rewards from winning games and getting penalties from losing games"},{"id":26,"text":"that's kind of like what the the reinforcement learning system"},{"id":27,"text":"That's the difficulty that these algorithms are faced with. It's really, really hard, especially in sparse reward scenarios. Now, if we're to think about this exploration problem, there's a couple of different ways of looking at it. One way of looking at it is we want to discover high reward strategies."},{"id":28,"text":"We want to basically seek out rewards and find sequences of actions that individually those actions may not be rewarding, but when we sequence them together, we're able to find rewards. Another way to view"},{"id":29,"text":"to view the exploration problem is deciding whether to attempt a new behavior or continuing to do the best thing that it knows so far. You're basically deciding, should I try something new or should I do something that has been good in the past? These are actually kind of part of a single problem where you need to..."},{"id":30,"text":"There's kind of this exploitation problem, which is doing what you know will yield the highest reward, doing kind of the things that you've seen before that have high reward, acting according to your Q function, for example. And this exploitation problem, which is doing things that you haven't done before in hopes of getting higher reward. And so that's kind of how we can think about this reinforcement learning problem, where we need to balance these two objectives if our goal is to maximize a sum of rewards over time."}],"notes":["本段讨论了强化学习算法在探索问题上的困难，特别是在稀疏奖励场景中。讲者指出，这些算法需要在探索新行为和利用已知高奖励行为之间进行权衡，这使得问题变得复杂。","讲者通过类比人生目标来说明强化学习代理的工作方式，即通过奖励和惩罚来学习，而不是预先知道规则。这种类比帮助理解探索与利用的平衡问题。","讲者提到探索问题可以从两个角度看待：一是发现高奖励策略，二是决定是否尝试新行为还是继续执行已知的高奖励行为。这两种视角实际上属于同一问题的不同方面。","讲者指出，利用问题指的是执行已知的高奖励行为，而探索问题则是尝试新行为以期获得更高的奖励。这种平衡是强化学习的核心挑战之一。","讲者强调，强化学习的目标是最大化时间序列上的奖励总和，因此需要在探索和利用之间找到合适的平衡点。这种平衡对于解决复杂任务（如Montezuma's Revenge）至关重要。","讲者提到，探索问题在稀疏奖励场景中尤为困难，因为代理需要在长时间序列中找到能够带来奖励的行为序列，而无法依赖即时反馈。"],"formulas":[],"uncertainties":[],"diagram":"none","start":183.74,"end":339.38,"asr_flags":[],"raw_segments":[{"start":183.74,"text":"The rules don't actually necessarily make sense to you."},{"start":189.94,"text":"And tasks like Montezuma's Revenge are difficult because reinforcement learning methods,"},{"start":196.94,"text":"is they don't know about the rules. They know very little about what's good and what's bad,"},{"start":201.7,"text":"what they can do, what they can't do. And when tasks become longer and longer,"},{"start":207.6,"text":"this also makes the problem even more difficult because you have to figure out an even longer"},{"start":213.52,"text":"sequence of actions that might lead to getting reward versus getting a penalty."},{"start":219.16,"text":"And so if you think about kind of what the reinforcement learning agent has to do,"},{"start":224.1,"text":"reinforcement learning agents are kind of analogous to imagining if your goal in life"},{"start":228.42,"text":"was to win 50 games of of Mao and you also didn't even know this in advance you only kind of learn"},{"start":237.08,"text":"this from actually getting rewards from winning games and getting penalties from losing games"},{"start":243.74,"text":"that's kind of like what the the reinforcement learning system"},{"start":248.38,"text":"That's the difficulty that these algorithms are faced with. It's really, really hard, especially in sparse reward scenarios. Now, if we're to think about this exploration problem, there's a couple of different ways of looking at it. One way of looking at it is we want to discover high reward strategies."},{"start":269.74,"text":"We want to basically seek out rewards and find sequences of actions that individually those actions may not be rewarding, but when we sequence them together, we're able to find rewards. Another way to view"},{"start":287.69,"text":"to view the exploration problem is deciding whether to attempt a new behavior or continuing to do the best thing that it knows so far. You're basically deciding, should I try something new or should I do something that has been good in the past? These are actually kind of part of a single problem where you need to..."},{"start":310.58,"text":"There's kind of this exploitation problem, which is doing what you know will yield the highest reward, doing kind of the things that you've seen before that have high reward, acting according to your Q function, for example. And this exploitation problem, which is doing things that you haven't done before in hopes of getting higher reward. And so that's kind of how we can think about this reinforcement learning problem, where we need to balance these two objectives if our goal is to maximize a sum of rewards over time."}],"speech_gaps":[{"start":187.952,"end":189.54}],"frame":"../frames/v024/002.webp","frame_time":195.74},{"title":"探索机制（Exploration）","segments":[{"id":31,"text":"As some examples, if you are in a new city, you kind of move somewhere new, exploration would be trying new restaurants. Exploitation would be going to your favorite restaurant or the restaurant that you like the best. One actually very common use of reinforcement learning is figuring out which adds to place and where."},{"id":32,"text":"and exploitation would be taking the ad that has been the most successful and showing that one to the user. Exploration would be instead trying to pick a different advertisement at random and instead showing that advertisement to the user. Or as a final example in oil drilling, you don't know where you're going to find"},{"id":33,"text":"where you're going to find oil. And so exploitation would be taking the best location that you've found before that is yielded oil versus exploration would be drilling at a new location. So exploration is quite hard. And if we want to design an algorithm for exploration, we might think about what is the best strategy for exploring and the best way to trade off between exploration and exploitation."},{"id":34,"text":"And we also need to think about what is the kind of optimality of exploration even mean? There's a range of reinforcement learning problems ranging from more simple problems where you can actually analyze whether or not the strategy is optimal or not."},{"id":35,"text":"to more complicated problems where it's intractable to analyze whether or not it's optimal and also intractable to develop algorithms that are able to do a good job at exploration. On the simple side, you start with multi-armed bandits. The kind of one-step RL problems that don't have any state."},{"id":36,"text":"Then if you want to make that more complicated, you add context, you add some features for the state that you're in. You could then move to small MDPs, to larger MDPs, and a lot of the problems that we've been talking about in this course are large MDPs without any known structure, and those are the ones that are the hardest for getting good exploration strategy and also theoretically thinking about exploration."},{"id":37,"text":"Before we talk about exploration in the large problems, let's talk a little bit about bandits for a minute, because they provide a nice way to think about exploration. And they're actually used in practice for a variety of problems. And specifically, the way that we can think about what is a bandit, it's not the kind of someone that runs around and maybe tries to steal stuff or something."}],"notes":["本段介绍了探索（Exploration）和利用（Exploitation）的基本概念，并通过多个实际例子说明了它们在不同场景中的应用。例如，在新城市中尝试新餐厅是探索，而选择最喜欢的餐厅则是利用。在广告投放和石油钻探等场景中，探索和利用的策略也分别被描述。这些例子帮助学生理解探索和利用在强化学习中的核心作用。","本段进一步讨论了探索的复杂性，指出设计有效的探索策略需要在探索和利用之间进行权衡。同时，课程提到探索的最优性概念，强调不同问题的复杂度差异，从简单的多臂老虎机（Multi-Armed Bandits）到复杂的马尔可夫决策过程（MDPs）。","课程指出，多臂老虎机是探索问题的起点，它是一类没有状态的单步强化学习问题。随着问题复杂度的增加，可以引入上下文（context）和状态特征，从而过渡到更复杂的MDPs。课程还提到，没有已知结构的大型MDP是探索策略和理论分析中最困难的领域。","本段最后提到，为了更好地理解探索，需要先回顾多臂老虎机（Bandits）的基本概念。虽然“bandit”一词可能让人联想到小偷，但在强化学习中，它指的是一个没有状态的决策问题，常用于实际问题中，如广告投放和推荐系统。"],"formulas":[],"uncertainties":["One actually very common use of reinforcement learning is figuring out which adds to place and where."],"diagram":"none","start":342.12,"end":516.1,"asr_flags":[],"raw_segments":[{"start":342.12,"text":"As some examples, if you are in a new city, you kind of move somewhere new, exploration would be trying new restaurants. Exploitation would be going to your favorite restaurant or the restaurant that you like the best. One actually very common use of reinforcement learning is figuring out which adds to place and where."},{"start":366.63,"text":"and exploitation would be taking the ad that has been the most successful and showing that one to the user. Exploration would be instead trying to pick a different advertisement at random and instead showing that advertisement to the user. Or as a final example in oil drilling, you don't know where you're going to find"},{"start":390.77,"text":"where you're going to find oil. And so exploitation would be taking the best location that you've found before that is yielded oil versus exploration would be drilling at a new location. So exploration is quite hard. And if we want to design an algorithm for exploration, we might think about what is the best strategy for exploring and the best way to trade off between exploration and exploitation."},{"start":419.02,"text":"And we also need to think about what is the kind of optimality of exploration even mean? There's a range of reinforcement learning problems ranging from more simple problems where you can actually analyze whether or not the strategy is optimal or not."},{"start":436.65,"text":"to more complicated problems where it's intractable to analyze whether or not it's optimal and also intractable to develop algorithms that are able to do a good job at exploration. On the simple side, you start with multi-armed bandits. The kind of one-step RL problems that don't have any state."},{"start":459.85,"text":"Then if you want to make that more complicated, you add context, you add some features for the state that you're in. You could then move to small MDPs, to larger MDPs, and a lot of the problems that we've been talking about in this course are large MDPs without any known structure, and those are the ones that are the hardest for getting good exploration strategy and also theoretically thinking about exploration."},{"start":490.54,"text":"Before we talk about exploration in the large problems, let's talk a little bit about bandits for a minute, because they provide a nice way to think about exploration. And they're actually used in practice for a variety of problems. And specifically, the way that we can think about what is a bandit, it's not the kind of someone that runs around and maybe tries to steal stuff or something."}],"speech_gaps":[],"frame":"../frames/v024/003.webp","frame_time":354.12},{"title":"探索机制（Exploration）","segments":[{"id":38,"text":"A formulation of reinforcement learning where the horizon is just like one time step for a single episode. There is no state. And unlike everything we've talked about in MVP so far, your reward is actually stochastic. And so if you kind of go back to the examples before."},{"id":39,"text":"You could think about the problem of selecting a restaurant as a bandit problem where you could, for example, select to go to one restaurant. You could select to go to a different restaurant. You could select to go to a different restaurant and so forth. And depending on your experience in previous episodes of selecting restaurants, you could."},{"id":40,"text":"inform your choice about whether you want to pick a new restaurant where you know nothing about the reward or go to a restaurant that you've received high reward for in the future. And the reward is stochastic in the sense that your experience at that restaurant may not be the same every single time. And so, yeah, this is kind of what a bandit problem looks like."},{"id":41,"text":"And how good is our reinforcement learning algorithm? We want to think about how much reward we're getting relative to if we're acting optimally. And so far, we've been thinking about sums of rewards, oftentimes averaged over episodes."},{"id":42,"text":"In bandit problems, you actually are often thinking about actually the entire reinforcement learning process and the optimality of the reinforcement learning process and the optimality of exploration followed by exploitation. And so say that you have taken capital T episodes so far, then the best you could have done is going to be something like the..."},{"id":43,"text":"expected reward of taking the optimal action times T. And this is actually in some ways an oracle, because when you haven't taken any episodes at the beginning, then you sort of are forced to take a random action because you don't know anything about the MVP so far. And so this is kind of in retrospect, what is the best thing you could have done? And this is a..."}],"notes":["本段讲解了强化学习中的探索机制，以选择餐厅的问题为例，说明了多臂老虎机（bandit）问题的结构。在该问题中，每个动作（选择餐厅）对应一个随机奖励，且奖励是随机的，因此需要在探索（尝试新餐厅）和利用（选择已知高奖励的餐厅）之间进行权衡。","讲者提到，在多臂老虎机问题中，探索的目标是找到最优动作，而最优动作的期望奖励乘以总回合数T代表了在理想情况下（即完全了解所有动作的奖励分布）所能获得的最大奖励。这种理想情况被称为‘oracle’，即假设我们拥有完美信息。","在没有经验的情况下，智能体必须随机选择动作，这反映了探索的必要性。随着经验的积累，智能体可以基于历史奖励来调整策略，从而在探索和利用之间找到平衡。","讲者还提到，评估探索机制的效果时，需要比较实际获得的奖励与最优策略所能获得的奖励之间的差距。这种差距可以用来衡量探索策略的有效性。","在多臂老虎机问题中，探索和利用的权衡是核心问题，而如何在有限的回合数内最大化累积奖励是该问题的关键目标。","讲者强调，探索机制的评估需要考虑时间因素，即在有限的回合数内如何最大化奖励，这与强化学习的整体目标是一致的。"],"formulas":[],"uncertainties":["capital T"],"diagram":"none","start":517.88,"end":688.33,"asr_flags":[],"math_clarifications":["公式中的R_opt 表示最优策略所能获得的最大奖励，\\bar{r}_{\\text{opt}} 表示最优动作的期望奖励，T 表示总回合数。但公式未明确说明\\bar{r}_{\\text{opt}} 是期望奖励还是平均奖励，且未体现探索与利用的平衡，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":517.88,"text":"A formulation of reinforcement learning where the horizon is just like one time step for a single episode. There is no state. And unlike everything we've talked about in MVP so far, your reward is actually stochastic. And so if you kind of go back to the examples before."},{"start":551.24,"text":"You could think about the problem of selecting a restaurant as a bandit problem where you could, for example, select to go to one restaurant. You could select to go to a different restaurant. You could select to go to a different restaurant and so forth. And depending on your experience in previous episodes of selecting restaurants, you could."},{"start":575.96,"text":"inform your choice about whether you want to pick a new restaurant where you know nothing about the reward or go to a restaurant that you've received high reward for in the future. And the reward is stochastic in the sense that your experience at that restaurant may not be the same every single time. And so, yeah, this is kind of what a bandit problem looks like. Now, if we want to think about how good is exploration,"},{"start":606.19,"text":"And how good is our reinforcement learning algorithm? We want to think about how much reward we're getting relative to if we're acting optimally. And so far, we've been thinking about sums of rewards, oftentimes averaged over episodes."},{"start":631.53,"text":"In bandit problems, you actually are often thinking about actually the entire reinforcement learning process and the optimality of the reinforcement learning process and the optimality of exploration followed by exploitation. And so say that you have taken capital T episodes so far, then the best you could have done is going to be something like the..."},{"start":660.8,"text":"expected reward of taking the optimal action times T. And this is actually in some ways an oracle, because when you haven't taken any episodes at the beginning, then you sort of are forced to take a random action because you don't know anything about the MVP so far. And so this is kind of in retrospect, what is the best thing you could have done? And this is a..."}],"speech_gaps":[],"frame":"../frames/v024/004.webp","frame_time":529.88},{"title":"探索机制（Exploration）","segments":[{"id":44,"text":"upper bound on the sum of rewards that you could be getting after t episodes. And then if we want to think about how well we've been doing, we can think about this subtracted by the sum of rewards that we actually observed from the actions that we've taken. And so that would be something like a sum from t equals 1 to t of the actual action that we decided to take."},{"id":45,"text":"in each particular episode. And the gap between these two is going to be measuring basically a form of optimality gap. And this expression is something that's called regret. And it's measuring basically how much do we regret taking the action that we did compared to taking the optimal action."},{"id":46,"text":"Now, if you were to think about regret over time, so here actually time is indexing over episodes because each episode is just a single time step. So if we think about kind of as a function of the number of episodes, you regret after taking those number of episodes. If you were acting optimally, what sort of curve would you get?"},{"id":47,"text":"on this plot. Yeah, so I see mostly going straight. So if you're acting optimally, this will be zero. And it will be zero even as you have more and more episodes. It'll be zero in expectation. There might be some randomness. And so you would get a curve that looks like this. And so this is sort of optimal."},{"id":48,"text":"In practice, actually achieving this is not really possible because at the first time step, like I mentioned, you have to take a random action. Now, does anyone have thoughts on what this curve would look like if you were just taking an episode at random? Yeah, it'll keep increasing. Yeah. So if you're taking an episode at random,"},{"id":49,"text":"there will now be a gap between these and you would be getting a higher reward from taking the optimal action compared to taking that action at random. And if, for example, you were always picking A1 and A1 is not the best action, then after one episode, you would expect to have some kind of... "},{"id":50,"text":"non-zero regret, right? So you would have a curve that looks like this. And then if you took A1"}],"notes":["本段讲解了强化学习中探索机制的核心概念，即‘遗憾’（regret）的定义。遗憾是实际获得的奖励总和与最优策略下可能获得的奖励总和之间的差距。通过计算这个差距，可以衡量算法在探索过程中的表现。","讲者指出，如果一个智能体在所有时间步都采取最优动作，那么遗憾值将始终为零，即使随着时间步数的增加，这种零遗憾状态仍然成立。然而，由于实际中存在随机性，遗憾值可能在期望上为零，但实际值可能有波动。","在实际应用中，完全实现零遗憾是不可能的，因为智能体在初始阶段必须随机选择动作。这种随机性会导致遗憾值随时间增加而上升，形成一个不断增长的曲线。","讲者通过举例说明，如果智能体始终选择一个非最优动作（如A1），那么在第一次尝试后就会产生非零的遗憾值。这种情况下，遗憾曲线将呈现出持续上升的趋势。","讲者进一步指出，如果智能体在探索过程中采取随机策略，那么遗憾值将随时间步数的增加而持续增加，这表明随机策略在探索机制中并不理想。","本段强调了探索机制中‘遗憾’作为衡量标准的重要性，以及随机策略在实际应用中可能带来的问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":688.78,"end":868.56,"asr_flags":[],"raw_segments":[{"start":688.78,"text":"upper bound on the sum of rewards that you could be getting after t episodes. And then if we want to think about how well we've been doing, we can think about this subtracted by the sum of rewards that we actually observed from the actions that we've taken. And so that would be something like a sum from t equals 1 to t of the actual action that we decided to take."},{"start":719.02,"text":"in each particular episode. And the gap between these two is going to be measuring basically a form of optimality gap. And this expression is something that's called regret. And it's measuring basically how much do we regret taking the action that we did compared to taking the optimal action."},{"start":749.93,"text":"Now, if you were to think about regret over time, so here actually time is indexing over episodes because each episode is just a single time step. So if we think about kind of as a function of the number of episodes, you regret after taking those number of episodes. If you were acting optimally, what sort of curve would you get?"},{"start":781.92,"text":"on this plot. Yeah, so I see mostly going straight. So if you're acting optimally, this will be zero. And it will be zero even as you have more and more episodes. It'll be zero in expectation. There might be some randomness. And so you would get a curve that looks like this. And so this is sort of optimal."},{"start":812.46,"text":"In practice, actually achieving this is not really possible because at the first time step, like I mentioned, you have to take a random action. Now, does anyone have thoughts on what this curve would look like if you were just taking an episode at random? Yeah, it'll keep increasing. Yeah. So if you're taking an episode at random,"},{"start":837.13,"text":"there will now be a gap between these and you would be getting a higher reward from taking the optimal action compared to taking that action at random. And if, for example, you were always picking A1 and A1 is not the best action, then after one episode, you would expect to have some kind of..."},{"start":861.8,"text":"non-zero regret, right? So you would have a curve that looks like this. And then if you took A1"}],"speech_gaps":[],"frame":"../frames/v024/005.webp","frame_time":700.78},{"title":"探索机制与后悔曲线分析","segments":[{"id":51,"text":"again the next episode, then you would then kind of incur the same difference in optimal rewards"},{"id":52,"text":"versus the rewards that you took. And so then this would increase and you would actually get"},{"id":53,"text":"at something that looks linear."},{"id":54,"text":"And that means that basically every time you,"},{"id":55,"text":"there's basically at every time step,"},{"id":56,"text":"there's a fixed difference between the optimal reward"},{"id":57,"text":"and the reward that you took."},{"id":58,"text":"And so whenever you get like a regret increasing linearly,"},{"id":59,"text":"that means that your algorithm is not actually improving."},{"id":60,"text":"It's not actually using the exploration"},{"id":61,"text":"to get better rewards."},{"id":62,"text":"words. If instead you were... The blue markers never worked that well, but we can see. If"},{"id":63,"text":"instead you were actually having an algorithm that is a bit smarter, then you would expect"},{"id":64,"text":"to have sublinear regret. And so you'd expect to actually not just linearly increase your regret"},{"id":65,"text":"over time, but actually have this curve look something like this, where it starts looking"},{"id":66,"text":"looking something more like linear, and then eventually, if you then get to the optimal"},{"id":67,"text":"behavior after exploring, then it flattens out to something like this. And you could imagine"},{"id":68,"text":"that this portion is like you're now in the exploitation phase, and the phase before that"},{"id":69,"text":"is when you're exploring and gathering information about the problem."},{"id":70,"text":"The question is, to make these curves, are we running the learning process a lot of different times than averaging? So for these curves, each of these curves is just one reinforcement learning process. And I guess they're very smooth here. And in practice, they'll be a little bit noisier."},{"id":71,"text":"Optimal, I guess, this is kind of an expectation, and so this is going to be smooth, but you might have something where, for example, in reality, maybe you got unlucky kind of one time step, and this kind of went up because you got unlucky. Maybe at the next time step, you still took the optimal action but got lucky, and so this will actually have some noise in it in practice."},{"id":72,"text":"Yeah, so the question is, we have an expectation on the first part. We don't have an expectation here. Why is that? This is basically some measure of the optimal expected reward after t time steps. This is actually just the actual reward that you observed. You could also have an expectation over this, over reinforcement learning runs. And that would then give you like..."}],"notes":["本段讨论了强化学习中探索与利用的平衡问题，通过后悔曲线（regret）的变化来判断算法是否在有效学习。当后悔曲线呈线性增长时，说明算法没有在探索中获得足够的信息，导致无法改进策略。而如果算法更智能，后悔曲线应呈次线性增长，即随着学习过程的进行，后悔增长的速度逐渐减缓。","在探索阶段，算法会收集关于环境的信息，而到了利用阶段，算法会基于已有的信息选择最优策略。这种转变在后悔曲线中表现为曲线从接近线性逐渐变为平缓。","课堂中提到，实际运行中后悔曲线会带有噪声，因为每次运行的随机性可能导致某些时间步的奖励波动。因此，期望值（expectation）是评估算法性能的重要指标，但实际运行中需要考虑这种随机性。","在分析后悔曲线时，需要区分单次运行的曲线和多次运行的平均曲线。单次运行的曲线可能因为随机性而波动，但多次运行的平均曲线会更平滑，更接近理论期望。","课堂中还提到，如果算法没有有效利用探索机制，其后悔曲线会持续线性增长，这表明算法未能从探索中获得足够的信息来改进策略。","最后，课堂指出，最优策略的期望奖励是基于时间步数的，而实际观察到的奖励可能因随机性而有所不同，因此在评估算法性能时需要考虑这种随机性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":868.56,"end":1038.36,"asr_flags":[],"raw_segments":[{"start":868.56,"text":"again the next episode, then you would then kind of incur the same difference in optimal rewards"},{"start":879.26,"text":"versus the rewards that you took. And so then this would increase and you would actually get"},{"start":886.3,"text":"at something that looks linear."},{"start":889.08,"text":"And that means that basically every time you,"},{"start":891.88,"text":"there's basically at every time step,"},{"start":893.92,"text":"there's a fixed difference between the optimal reward"},{"start":897.36,"text":"and the reward that you took."},{"start":899.38,"text":"And so whenever you get like a regret increasing linearly,"},{"start":904.82,"text":"that means that your algorithm is not actually improving."},{"start":909.24,"text":"It's not actually using the exploration"},{"start":911.16,"text":"to get better rewards."},{"start":912.34,"text":"words. If instead you were... The blue markers never worked that well, but we can see. If"},{"start":922.94,"text":"instead you were actually having an algorithm that is a bit smarter, then you would expect"},{"start":926.96,"text":"to have sublinear regret. And so you'd expect to actually not just linearly increase your regret"},{"start":933.14,"text":"over time, but actually have this curve look something like this, where it starts looking"},{"start":939.8,"text":"looking something more like linear, and then eventually, if you then get to the optimal"},{"start":944.36,"text":"behavior after exploring, then it flattens out to something like this. And you could imagine"},{"start":950.3,"text":"that this portion is like you're now in the exploitation phase, and the phase before that"},{"start":958.66,"text":"is when you're exploring and gathering information about the problem."},{"start":964.48,"text":"The question is, to make these curves, are we running the learning process a lot of different times than averaging? So for these curves, each of these curves is just one reinforcement learning process. And I guess they're very smooth here. And in practice, they'll be a little bit noisier."},{"start":987.57,"text":"Optimal, I guess, this is kind of an expectation, and so this is going to be smooth, but you might have something where, for example, in reality, maybe you got unlucky kind of one time step, and this kind of went up because you got unlucky. Maybe at the next time step, you still took the optimal action but got lucky, and so this will actually have some noise in it in practice."},{"start":1013.58,"text":"Yeah, so the question is, we have an expectation on the first part. We don't have an expectation here. Why is that? This is basically some measure of the optimal expected reward after t time steps. This is actually just the actual reward that you observed. You could also have an expectation over this, over reinforcement learning runs. And that would then give you like..."}],"speech_gaps":[],"frame":"../frames/v024/006.webp","frame_time":880.56},{"title":"探索机制（Exploration）","segments":[{"id":73,"text":"Like as an example here, if you run this algorithm multiple times, these regret curves will actually look a little bit different depending on how unlucky you get. Then if you were to then measure this in terms of expectations, then that would be averaging over different runs of the reinforcement learning algorithm."},{"id":74,"text":"Yeah, so the question is, if we're taking random actions, why is it linear and why is it increasing by a fixed amount? So this will be noisy if you are taking random actions. If, I don't know, say that..."},{"id":75,"text":"So yeah, it will be noisy. If you run it multiple times in expectation, it will be linear. And if you have a deterministic MDP and you always select action one through a very not smart strategy, and the rewards are a bit more deterministic, then you might actually get a curve that looks like this. So the question is, if we're always taking A1, then how do we actually know how to measure this formula? This is not actually a formula that, like, sorry."},{"id":76,"text":"To back up a little bit, this is what we're aiming to. We're aiming to minimize regret. We're aiming to get something that is able to flatten out. But this is more of an object that's used for analysis and not our optimization objective because we actually can't measure this without knowledge of the bandit problem or knowledge of the MDP."},{"id":77,"text":"If you introduce an expectation here, then you would expect it to be monotonic. If not, then because the reward is stochastic, you could have scenarios where you say that the best action is like A5, and the probability of getting good reward is like..."},{"id":78,"text":"I don't know, like 90% of the time and 10% of the time you get a bad reward, then you're going to see, like when you get a good reward, it will actually, relative to the expert, which is averaging over that, it will go down. But if you write this as an expectation for the reinforcement learning algorithm, it would be monotonic. Cool. So this is the regret formula. Regret after doing reinforcement learning for T episodes."},{"id":79,"text":"Expected reward of the best action, basically the best we can hope for an expectation if we had kind of knowledge of what the bandit is. And this is the reward of the action that's actually taken. There's a variety of simple strategies for exploration and including some that you can show that are optimal. And you can often kind of analyze algorithms and provide theoretical guarantees on regret."}],"notes":["本段讨论了在强化学习中，由于随机动作导致的遗憾（regret）曲线的波动性。当算法运行多次时，由于运气不同，曲线会有所不同。在期望值下，这些曲线会平均化，从而表现出线性增长的趋势。","讲者提到，如果采用确定性MDP并始终选择一个不聪明的动作，奖励会更确定，从而导致曲线可能呈现特定形状。但此时如何衡量这个公式仍然是一个问题，因为这并非一个可以直接测量的公式。","在期望值下，遗憾曲线应为单调递增。如果奖励是随机的，可能会出现某些情况下最佳动作的奖励概率较高，从而导致曲线下降。但将此写成期望值时，曲线应保持单调性。","讲者指出，这是遗憾公式，即在进行T次强化学习回合后，期望奖励与实际奖励之间的差距。最佳动作的期望奖励是理论上的上限，而实际采取的动作的奖励则是实际表现。","课程中提到，存在多种简单的探索策略，其中一些可以证明是优的。这些策略可以通过理论分析提供对遗憾的保证。","讲者强调，遗憾是用于分析的工具，而不是优化目标，因为无法在没有带入问题或MDP知识的情况下直接测量它。"],"formulas":[],"uncertainties":["the formula that, like, sorry"],"diagram":"none","start":1039.73,"end":1213.44,"asr_flags":[],"math_clarifications":["原文中提到的遗憾（Regret）应定义为累积奖励的期望差值，而非单次动作的期望差值。因此，公式中的定义不准确，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1039.73,"text":"Like as an example here, if you run this algorithm multiple times, these regret curves will actually look a little bit different depending on how unlucky you get. Then if you were to then measure this in terms of expectations, then that would be averaging over different runs of the reinforcement learning algorithm."},{"start":1055.47,"text":"Yeah, so the question is, if we're taking random actions, why is it linear and why is it increasing by a fixed amount? So this will be noisy if you are taking random actions. If, I don't know, say that..."},{"start":1078.11,"text":"So yeah, it will be noisy. If you run it multiple times in expectation, it will be linear. And if you have a deterministic MDP and you always select action one through a very not smart strategy, and the rewards are a bit more deterministic, then you might actually get a curve that looks like this. So the question is, if we're always taking A1, then how do we actually know how to measure this formula? This is not actually a formula that, like, sorry."},{"start":1108.46,"text":"To back up a little bit, this is what we're aiming to. We're aiming to minimize regret. We're aiming to get something that is able to flatten out. But this is more of an object that's used for analysis and not our optimization objective because we actually can't measure this without knowledge of the bandit problem or knowledge of the MDP."},{"start":1131.37,"text":"If you introduce an expectation here, then you would expect it to be monotonic. If not, then because the reward is stochastic, you could have scenarios where you say that the best action is like A5, and the probability of getting good reward is like..."},{"start":1154.87,"text":"I don't know, like 90% of the time and 10% of the time you get a bad reward, then you're going to see, like when you get a good reward, it will actually, relative to the expert, which is averaging over that, it will go down. But if you write this as an expectation for the reinforcement learning algorithm, it would be monotonic. Cool. So this is the regret formula. Regret after doing reinforcement learning for T episodes."},{"start":1185.21,"text":"Expected reward of the best action, basically the best we can hope for an expectation if we had kind of knowledge of what the bandit is. And this is the reward of the action that's actually taken. There's a variety of simple strategies for exploration and including some that you can show that are optimal. And you can often kind of analyze algorithms and provide theoretical guarantees on regret."}],"speech_gaps":[],"frame":"../frames/v024/007.webp","frame_time":1051.73},{"title":"探索机制（Exploration）","segments":[{"id":80,"text":"The, and then also even the algorithms that like you can kind of theoretically make some guarantees about in practice, performance can vary. And so to get a little bit more intuition, actually, before we do that, we're going to play a game in a minute. But before we do that, let's talk about different strategies for exploration. So the specifically in bandits, so not in MDPs."},{"id":81,"text":"So one approach is when you're selecting different restaurants, for example, if you haven't explored a restaurant, then you could choose to be optimistic about that restaurant. And that will incentivize you to explore new restaurants rather than always being greedy with respect to restaurants you've tried before. And so the way this could work is you could track the average reward that you have received in the past for each of the actions."},{"id":82,"text":"If you were to exploit, you would just take the action that has the maximum average reward for the things that you've seen so far. But instead, if we want to actually encourage the algorithm to visit new things, then we still want to visit actions that we think have high average rewards so that if we go to a restaurant that's really bad, we maybe don't go to it again. But we're going to add a term that is some kind of variance of our reward estimate."},{"id":83,"text":"This is basically like if this variance is high, that means that we're uncertain about the reward for that action. And if we're uncertain, then we're going to basically give this sort of bonus, this sort of reward bonus on top of our estimate of the average reward to encourage our algorithm to explore things that are uncertain or things that have high variance."},{"id":84,"text":"And so the intuition here is that we're assuming that unknown things are going to be good until we actually then observe them. And if we then observe them and they're really bad, then we'll act accordingly. In the future, the variance will go down and the reward estimate will go down. And this is a way to kind of balance exploration and exploitation."},{"id":85,"text":"Yeah, so the question is, how would you choose, in this case, an action that you haven't seen before? So if you haven't seen an action before, then your variance estimate will be something like infinite, for example. And then the..."},{"id":86,"text":"Then this will encourage it to explore basically all of the actions that it hasn't explored first, at least once. Then from there, your variance estimate or your uncertainty about an action will go down over time. This is basically, if you haven't done anything before, it will incentivize it to visit that first."}],"notes":["本段讨论了在强化学习中如何处理未探索动作的策略，特别是通过引入方差估计来鼓励探索。讲者提到，当一个动作未被尝试过时，其方差估计可能为无穷大，这会促使算法优先探索这些动作。这种策略假设未知的动作可能具有较高的奖励，直到实际观察到其表现后，方差会下降，从而平衡探索与利用。","讲者通过餐厅选择的例子来说明这一策略，即在未探索的餐厅上保持乐观，从而激励探索。这种策略的核心在于将方差作为奖励估计的补充，以鼓励算法探索不确定性高的动作。","在实际应用中，当一个动作未被尝试时，算法会优先选择它，因为其方差估计较高，这会带来额外的奖励激励。随着探索的进行，方差估计会逐渐降低，从而减少对未探索动作的偏好。","这种策略的目的是在探索和利用之间找到平衡，确保算法既不会过于贪婪地只选择已知的高奖励动作，也不会过度探索低效的动作。通过引入方差估计，算法可以在不确定性和已知奖励之间进行权衡。","讲者还提到，当一个动作被尝试后，如果其表现不佳，方差会下降，奖励估计也会相应调整，从而减少对该动作的探索。这种机制有助于算法在后续决策中更有效地分配探索资源。","最后，讲者指出，这种策略在实际应用中需要处理方差估计的初始化问题，例如未探索动作的方差可能被设定为无穷大，以确保它们被优先探索。"],"formulas":[],"uncertainties":["variance estimate will be something like infinite"],"diagram":"none","start":1216.59,"end":1383.43,"asr_flags":[],"raw_segments":[{"start":1216.59,"text":"The, and then also even the algorithms that like you can kind of theoretically make some guarantees about in practice, performance can vary. And so to get a little bit more intuition, actually, before we do that, we're going to play a game in a minute. But before we do that, let's talk about different strategies for exploration. So the specifically in bandits, so not in MDPs."},{"start":1244.14,"text":"So one approach is when you're selecting different restaurants, for example, if you haven't explored a restaurant, then you could choose to be optimistic about that restaurant. And that will incentivize you to explore new restaurants rather than always being greedy with respect to restaurants you've tried before. And so the way this could work is you could track the average reward that you have received in the past for each of the actions."},{"start":1274.42,"text":"If you were to exploit, you would just take the action that has the maximum average reward for the things that you've seen so far. But instead, if we want to actually encourage the algorithm to visit new things, then we still want to visit actions that we think have high average rewards so that if we go to a restaurant that's really bad, we maybe don't go to it again. But we're going to add a term that is some kind of variance of our reward estimate."},{"start":1304.27,"text":"This is basically like if this variance is high, that means that we're uncertain about the reward for that action. And if we're uncertain, then we're going to basically give this sort of bonus, this sort of reward bonus on top of our estimate of the average reward to encourage our algorithm to explore things that are uncertain or things that have high variance."},{"start":1327.3,"text":"And so the intuition here is that we're assuming that unknown things are going to be good until we actually then observe them. And if we then observe them and they're really bad, then we'll act accordingly. In the future, the variance will go down and the reward estimate will go down. And this is a way to kind of balance exploration and exploitation."},{"start":1348.3,"text":"Yeah, so the question is, how would you choose, in this case, an action that you haven't seen before? So if you haven't seen an action before, then your variance estimate will be something like infinite, for example. And then the..."},{"start":1362.19,"text":"Then this will encourage it to explore basically all of the actions that it hasn't explored first, at least once. Then from there, your variance estimate or your uncertainty about an action will go down over time. This is basically, if you haven't done anything before, it will incentivize it to visit that first."}],"speech_gaps":[],"frame":"../frames/v024/008.webp","frame_time":1228.59},{"title":"探索机制（Exploration）","segments":[{"id":87,"text":"Cool. This is a popular algorithm. You can actually kind of derive guarantees for it. It's called upper confidence bound, or one version of it is called upper confidence bound. There's another approach that you can also take that..."},{"id":88,"text":"It's actually harder to show guarantees for, but can work pretty well in practice. And we actually saw something like this in the last lecture. Essentially, what you're trying to do is you're trying to estimate the probability of getting good rewards from each of the arms of the bandit. And so the way this would work is you assume that there's some sort of kind of distribution of rewards for each of the actions. And this defines kind of..."},{"id":89,"text":"a partially observed MDP where you don't know the parameters of the reward function. You don't know if you're going to get a good reward or bad reward. And so you'll then actually try to model and form an estimate of the likelihood of getting rewards by trying to model these parameters and your uncertainty over it. So you'll form an estimate with any data that you've seen so far. Then you'll actually sample"},{"id":90,"text":"an MDP from your model of possible MDPs of the world, and then you'll take the optimal action assuming that your sample was correct, and then repeat that process to update your beliefs again, and then sample new MDP and repeat the process."},{"id":91,"text":"And we'll kind of walk through an example, but the intuition here is that you can kind of iteratively improve your model of the bandit and act according to one of the models that is covered by, one of the potential kind of sets of probabilities that's modeled by your MDP model."},{"id":92,"text":"One last note. These are actually methods that are widely used and studied in industry for recommenders and ad placement. Everything we've been talking about so far is for these sorts of small bandit problems, but they are actually quite relevant for a number of practical problems, even when you don't have longer episodes or episodes with state."},{"id":93,"text":"And now let's play a little game to get some intuition for how this works. So here is a little simulation. Say that you are hired as the head of drug development at a prestigious research hospital. Things are going well. And now there is..."}],"notes":["本段讲解了探索机制中的一种方法，即通过构建部分可观测马尔可夫决策过程（MDP）来估计奖励概率。讲者指出，这种方法需要对每个动作的奖励分布进行建模，并基于已有的数据形成对奖励可能性的估计。","讲者提到，这种方法虽然在理论上证明保证较为困难，但在实践中表现良好。通过不断采样可能的MDP并更新信念，可以逐步改进对bandit模型的理解。","讲者强调，这种方法在实际应用中被广泛用于推荐系统和广告投放等领域，即使在没有长序列或状态的情况下，也能有效处理实际问题。","讲者通过一个模拟游戏的例子，引导学生理解探索机制的工作原理，即通过迭代改进模型并根据模型选择最优动作。","讲者指出，这种方法的核心思想是通过构建潜在的概率集合来覆盖可能的奖励分布，并基于这些分布进行决策。","讲者最后提到，这些方法在工业界被广泛研究和应用，说明其在实际问题中的重要性和实用性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1385.1,"end":1546.38,"asr_flags":[],"raw_segments":[{"start":1385.1,"text":"Cool. This is a popular algorithm. You can actually kind of derive guarantees for it. It's called upper confidence bound, or one version of it is called upper confidence bound. There's another approach that you can also take that..."},{"start":1399.77,"text":"It's actually harder to show guarantees for, but can work pretty well in practice. And we actually saw something like this in the last lecture. Essentially, what you're trying to do is you're trying to estimate the probability of getting good rewards from each of the arms of the bandit. And so the way this would work is you assume that there's some sort of kind of distribution of rewards for each of the actions. And this defines kind of..."},{"start":1430.29,"text":"a partially observed MDP where you don't know the parameters of the reward function. You don't know if you're going to get a good reward or bad reward. And so you'll then actually try to model and form an estimate of the likelihood of getting rewards by trying to model these parameters and your uncertainty over it. So you'll form an estimate with any data that you've seen so far. Then you'll actually sample"},{"start":1457.67,"text":"an MDP from your model of possible MDPs of the world, and then you'll take the optimal action assuming that your sample was correct, and then repeat that process to update your beliefs again, and then sample new MDP and repeat the process."},{"start":1477.53,"text":"And we'll kind of walk through an example, but the intuition here is that you can kind of iteratively improve your model of the bandit and act according to one of the models that is covered by, one of the potential kind of sets of probabilities that's modeled by your MDP model."},{"start":1498.61,"text":"One last note. These are actually methods that are widely used and studied in industry for recommenders and ad placement. Everything we've been talking about so far is for these sorts of small bandit problems, but they are actually quite relevant for a number of practical problems, even when you don't have longer episodes or episodes with state."},{"start":1523.52,"text":"And now let's play a little game to get some intuition for how this works. So here is a little simulation. Say that you are hired as the head of drug development at a prestigious research hospital. Things are going well. And now there is..."}],"speech_gaps":[],"frame":"../frames/v024/009.webp","frame_time":1397.1},{"title":"探索机制（Exploration）","segments":[{"id":94,"text":"Kind of some sort of plague and you need to figure out what drugs are going to be effective for addressing the plague and you want to save people's lives by giving them the drug that's most effective. Now you can recognize this as a bandit problem where each drug you don't know how capable it's going to be and we can say that maybe there's maybe there's somewhere around 5,000 patients and there's maybe around 10 different drugs that you're considering."},{"id":95,"text":"And your goal is to try to understand, well, try to save lives, try to save as many cumulative lives as possible, but also balancing kind of saving lives right now versus saving lives in the future as you learn information about each of the drugs. Cool. So let's play. Who wants to suggest a drug? Drug one. Okay. So we see that we prescribed drug one, the patient lived."},{"id":96,"text":"So that's good. Who wants to pick a drug? Yeah? Four. Okay. We also see the patient lived. This is good. On a good track. Yeah? Ten. Died. Okay. Yeah? Seven. Lived. Okay. So one, four, and seven are looking better than ten right now. Someone else? Yeah? Six. Still exploring. Patient died. Five."},{"id":97,"text":"Died. Okay. Not so good. Who else? Yeah. Seven. Okay. Maybe we want to start exporting. Patient lived again. So that seems like pretty good. Who wants to suggest? Yeah. Two. Patient died. Not so good. Yeah. Seven. Okay. Patient lived again. Pretty good. What do we want to do next? Seven. Okay. Do we want to keep doing seven? Patient died. Yeah."},{"id":98,"text":"Eight, patient died. Seven, patient lived. All right, should we just keep on going seven at this point? Are we happy with seven? Try nine, patient lived. Try one, patient died. Four, patient lived. Four again, patient died. Nine, patient lived. Three, patient died. Nine, patient lived. Okay, we like nine."}],"notes":["本段通过一个医疗场景引入探索机制（Exploration）的概念，将问题建模为多臂老虎机（Bandit）问题。讲者指出，每个药物的效果未知，需要在探索（尝试不同药物）和利用（选择当前表现较好的药物）之间进行权衡，以最大化拯救生命总数。","讲者通过模拟实验展示探索过程，每次选择一个药物并观察结果（存活或死亡），并根据结果调整策略。例如，选择药物1、4、7后患者存活，而选择药物10、5、2、8后患者死亡，说明这些药物效果较差。","讲者强调探索与利用的平衡，即在当前拯救生命和未来学习信息之间进行权衡。例如，选择药物7多次后患者存活，但随后选择药物7时患者死亡，说明该药物效果不稳定，需要进一步探索。","讲者通过不断尝试不同的药物（如尝试药物9、1、4、3等）来评估其效果，并最终倾向于选择药物9，因为其效果较好。这体现了探索机制在实际应用中的动态调整过程。","讲者通过模拟实验展示探索机制的实践过程，强调在实际应用中需要不断尝试和调整策略，以找到最优解。这种探索过程是强化学习中的核心问题之一。","讲者通过具体的例子说明探索机制的挑战，即如何在有限的资源和信息下，找到最优的策略。这需要在探索和利用之间进行权衡，以最大化长期收益。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1546.84,"end":1719.0,"asr_flags":[],"raw_segments":[{"start":1546.84,"text":"kind of some sort of plague and you need to figure out what drugs are going to be effective for addressing the plague and you want to save people's lives by giving them the drug that's most effective. Now you can recognize this as a bandit problem where each drug you don't know how capable it's going to be and we can say that maybe there's maybe there's somewhere around 5,000 patients and there's maybe around 10 different drugs that you're considering."},{"start":1577.21,"text":"And your goal is to try to understand, well, try to save lives, try to save as many cumulative lives as possible, but also balancing kind of saving lives right now versus saving lives in the future as you learn information about each of the drugs. Cool. So let's play. Who wants to suggest a drug? Drug one. Okay. So we see that we prescribed drug one, the patient lived."},{"start":1608.38,"text":"So that's good. Who wants to pick a drug? Yeah? Four. Okay. We also see the patient lived. This is good. On a good track. Yeah? Ten. Died. Okay. Yeah? Seven. Lived. Okay. So one, four, and seven are looking better than ten right now. Someone else? Yeah? Six. Still exploring. Patient died. Five."},{"start":1644.18,"text":"Died. Okay. Not so good. Who else? Yeah. Seven. Okay. Maybe we want to start exporting. Patient lived again. So that seems like pretty good. Who wants to suggest? Yeah. Two. Patient died. Not so good. Yeah. Seven. Okay. Patient lived again. Pretty good. What do we want to do next? Seven. Okay. Do we want to keep doing seven? Patient died. Yeah."},{"start":1681.97,"text":"Eight, patient died. Seven, patient lived. All right, should we just keep on going seven at this point? Are we happy with seven? Try nine, patient lived. Try one, patient died. Four, patient lived. Four again, patient died. Nine, patient lived. Three, patient died. Nine, patient lived. Okay, we like nine."}],"speech_gaps":[],"frame":"../frames/v024/010.webp","frame_time":1558.84},{"title":"探索机制（Exploration）","segments":[{"id":99,"text":"Cool. Maybe let's keep on doing nine. Patient is living a lot. Great. We won patient's eye. So let's say that we kind of kept on going with nine for a while. And then we can plot, actually, well, with 5,000, I wish I could just say, like, keep on doing nine. Maybe we'll stop there. We can actually plot the regret."},{"id":100,"text":"This was the true efficacy of the drugs. And we can see that nine actually was the best one. So we actually found the best one, which is good. Seven was also pretty good. And then we can also plot the number of lives that are saved by different algorithms. And so higher here is better. We see that the posterior sampling approach, and in this case, what posterior sampling would be doing is modeling the probability of the efficacy of each drug."},{"id":101,"text":"And then based on his estimate of that, picking something that's better. And we can see that how well we did right here is in purple. It's a little bit hard to tell just because it's a little small, but we can see that generally it looks like we're doing pretty well relative to the algorithms. And then you can also plot regret over time."},{"id":102,"text":"And actually here we can see that we're actually doing better than all the algorithms. So you guys are pretty good. Nice. Maybe there's some luck involved there. So this is just a single run. And what these different algorithms are is you see greedy is showing green. Greedy is just picking the best thing you've seen so far."},{"id":103,"text":"Over time, especially with more and more trials that you might be running, like more and more patients, more and more ad placements, whatever, it's getting a lot worse. In this case, we saw that posterior sampling in yellow is by far the best algorithm. And then the other algorithms, red is showing epsilon greedy. Blue is showing UCB. So that's the first algorithm we talked about with being optimistic about uncertain actions. So this is basically showing the trade-off between different algorithms."},{"id":104,"text":"One other thing to note that epsilon-greedy, it's a bit more greedy, and so we see that when you have fewer patients, it actually is doing better than UCB, but then in the long run, UCB is doing better because it's actually optimizing a bit more for making sure that you're exploring more actions, and so in the long run, it's able to take more optimal actions in the future."},{"id":105,"text":"Is there a mathematical reason why posterior sampling does better than UCB and epsilon-greedy?"},{"id":106,"text":"Yeah, so I don't want to go too much into the math."},{"id":107,"text":"And actually, posterior sampling, for this MDP,"},{"id":108,"text":"you probably could analyze it."},{"id":109,"text":"But in general, it can be hard to derive general theoretical"},{"id":110,"text":"guarantees for it."},{"id":111,"text":"With regard to epsilon greedy, I guess some of it"},{"id":112,"text":"comes down to that value of epsilon"},{"id":113,"text":"epsilon and tuning it to be... And generally with epsilon greedy, you'll often choose"}],"notes":["本段主要讨论了不同探索机制在药物选择中的表现，包括贪心算法（greedy）、ε-贪心（epsilon-greedy）、上置信界（UCB）和后验采样（posterior sampling）。通过绘制后悔（regret）和拯救生命数的图表，展示了这些算法在不同阶段的表现差异。","后验采样方法通过建模每种药物的疗效概率，选择更优的选项，其表现优于其他算法。在早期阶段，ε-贪心可能表现更好，但长期来看，UCB通过更积极的探索，能够采取更优的未来行动。","课程中提到，后验采样在某些情况下表现优于UCB和ε-贪心，但其数学理论分析较为复杂，难以推导出普遍的理论保证。","ε-贪心算法的性能依赖于ε值的调整，通常需要在探索和利用之间进行权衡。"],"formulas":[],"uncertainties":["Patient is living a lot","We won patient's eye","It's a little bit hard to tell just because it's a little small"],"diagram":"none","start":1720.53,"end":1897.16,"asr_flags":[111],"raw_segments":[{"start":1720.53,"text":"Cool. Maybe let's keep on doing nine. Patient is living a lot. Great. We won patient's eye. So let's say that we kind of kept on going with nine for a while. And then we can plot, actually, well, with 5,000, I wish I could just say, like, keep on doing nine. Maybe we'll stop there. We can actually plot the regret."},{"start":1746.46,"text":"This was the true efficacy of the drugs. And we can see that nine actually was the best one. So we actually found the best one, which is good. Seven was also pretty good. And then we can also plot the number of lives that are saved by different algorithms. And so higher here is better. We see that the posterior sampling approach, and in this case, what posterior sampling would be doing is modeling the probability of the efficacy of each drug."},{"start":1771.73,"text":"And then based on his estimate of that, picking something that's better. And we can see that how well we did right here is in purple. It's a little bit hard to tell just because it's a little small, but we can see that generally it looks like we're doing pretty well relative to the algorithms. And then you can also plot regret over time."},{"start":1791.81,"text":"And actually here we can see that we're actually doing better than all the algorithms. So you guys are pretty good. Nice. Maybe there's some luck involved there. So this is just a single run. And what these different algorithms are is you see greedy is showing green. Greedy is just picking the best thing you've seen so far."},{"start":1807.52,"text":"Over time, especially with more and more trials that you might be running, like more and more patients, more and more ad placements, whatever, it's getting a lot worse. In this case, we saw that posterior sampling in yellow is by far the best algorithm. And then the other algorithms, red is showing epsilon greedy. Blue is showing UCB. So that's the first algorithm we talked about with being optimistic about uncertain actions. So this is basically showing the trade-off between different algorithms."},{"start":1834.52,"text":"One other thing to note that epsilon-greedy, it's a bit more greedy, and so we see that when you have fewer patients, it actually is doing better than UCB, but then in the long run, UCB is doing better because it's actually optimizing a bit more for making sure that you're exploring more actions, and so in the long run, it's able to take more optimal actions in the future."},{"start":1855.4,"text":"Is there a mathematical reason why posterior sampling does better than UCB and epsilon-greedy?"},{"start":1863.82,"text":"Yeah, so I don't want to go too much into the math."},{"start":1867.9,"text":"And actually, posterior sampling, for this MDP,"},{"start":1871.04,"text":"you probably could analyze it."},{"start":1875.18,"text":"But in general, it can be hard to derive general theoretical"},{"start":1879.32,"text":"guarantees for it."},{"start":1880.98,"text":"With regard to epsilon greedy, I guess some of it"},{"start":1889.22,"text":"comes down to that value of epsilon"},{"start":1890.8,"text":"epsilon and tuning it to be... And generally with epsilon greedy, you'll often choose"}],"speech_gaps":[{"start":1744.21,"end":1746.06},{"start":1873.14,"end":1874.78}],"frame":"../frames/v024/011.webp","frame_time":1732.53},{"title":"探索机制在复杂环境中的挑战","segments":[{"id":114,"text":"epsilon to be smaller and smaller over time. And that hyperparameter would probably drastically"},{"id":115,"text":"impact performance because at this point in training, if epsilon is constant, you're going"},{"id":116,"text":"to be keeping on... You're going to be still occasionally taking random drugs. And at that"},{"id":117,"text":"point, you already know a lot about the drug and prescribing a random drug is a very poor choice."},{"id":118,"text":"Okay, cool."},{"id":119,"text":"Also, if you want to play more, I'll put the website in the slides."},{"id":120,"text":"Okay, so that's exploration in Bandit."},{"id":121,"text":"Now, what does this look like for robotics, language models, and larger MDPs? Different people have different opinions on this. I have a somewhat pessimistic opinion on it. And in particular, there's actually a lot of research that try to translate these ideas to larger MDPs."},{"id":122,"text":"For example, you can try to formulate some estimate of whether you've taken an action or not and give reward bonuses for novelty, for visiting new states, for taking new actions. And similarly, like posterior sampling, you can try to figure out models of different dynamics and so forth and act accordingly."},{"id":123,"text":"But at the end of the day, when you're in a very large MDP, exploration from scratch is generally intractable. So, for example, if you randomly initialize a transformer language model and try to figure out how to make a user happy or some other reward function like upvotes or something like that, actually just using upvotes to train a language model from scratch isn't going..."},{"id":124,"text":"There's just like the sheer vastness of the possible space of tokens is way too large, at least relative to the patients that most users will have. Likewise in robotics, if you're trying to even just learn how to..."},{"id":125,"text":"I don't know, kind of pour water from one cup to another cup,"},{"id":126,"text":"you're going to be stuck in a realm where you're just kind of randomly moving arms around"},{"id":127,"text":"rather than actually doing things that are useful if you're starting completely from scratch."},{"id":128,"text":"Instead, generally what exploration looks like in these larger domains"},{"id":129,"text":"is to rely heavily on demonstrations or on base models that were pre-trained on data and demonstrations"},{"id":130,"text":"So, for example, reinforcement learning has been quite successful in language models because particularly in scenarios where you have a strong base model that already knows how to write coherent sentences and already knows kind of roughly how to approach certain kinds of prompts or certain kinds of problems."},{"id":131,"text":"And likewise, in robotics, if you have demonstrations of example behavior that achieve high reward, then using that as a starting point for reinforcement learning is very powerful."}],"notes":["本段讨论了epsilon衰减策略在强化学习中的重要性，指出如果epsilon保持不变，即使在训练后期，仍然会随机选择动作，这在已经了解大部分环境信息的情况下是低效的。","讲者提到在训练过程中，epsilon的值会逐渐减小，这会影响整体性能，因为随机探索的效率会降低。","讲者通过药物选择的例子说明，当对环境有足够了解时，继续随机探索是不合理的，因为这会浪费资源。","讲者进一步指出，在大规模MDP（如语言模型和机器人控制）中，从零开始探索是不可行的，因为状态空间过于庞大。","讲者提到，对于语言模型，如果从头开始训练，仅使用点赞数作为奖励函数是不够的，因为可能无法覆盖所有可能的输入空间。","讲者以机器人控制为例，指出如果从零开始探索，机器人可能会在随机移动手臂，而无法完成有用的任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1897.16,"end":2076.59,"asr_flags":[],"raw_segments":[{"start":1897.16,"text":"epsilon to be smaller and smaller over time. And that hyperparameter would probably drastically"},{"start":1903.86,"text":"impact performance because at this point in training, if epsilon is constant, you're going"},{"start":1909.38,"text":"to be keeping on... You're going to be still occasionally taking random drugs. And at that"},{"start":1914.42,"text":"point, you already know a lot about the drug and prescribing a random drug is a very poor choice."},{"start":1920.14,"text":"Okay, cool."},{"start":1921.78,"text":"Also, if you want to play more, I'll put the website in the slides."},{"start":1928.68,"text":"Okay, so that's exploration in Bandit."},{"start":1931.91,"text":"Now, what does this look like for robotics, language models, and larger MDPs? Different people have different opinions on this. I have a somewhat pessimistic opinion on it. And in particular, there's actually a lot of research that try to translate these ideas to larger MDPs."},{"start":1951.12,"text":"For example, you can try to formulate some estimate of whether you've taken an action or not and give reward bonuses for novelty, for visiting new states, for taking new actions. And similarly, like posterior sampling, you can try to figure out models of different dynamics and so forth and act accordingly."},{"start":1973.76,"text":"But at the end of the day, when you're in a very large MDP, exploration from scratch is generally intractable. So, for example, if you randomly initialize a transformer language model and try to figure out how to make a user happy or some other reward function like upvotes or something like that, actually just using upvotes to train a language model from scratch isn't going..."},{"start":2000.41,"text":"There's just like the sheer vastness of the possible space of tokens is way too large, at least relative to the patients that most users will have. Likewise in robotics, if you're trying to even just learn how to..."},{"start":2017.61,"text":"I don't know, kind of pour water from one cup to another cup,"},{"start":2020.97,"text":"you're going to be stuck in a realm where you're just kind of randomly moving arms around"},{"start":2025.05,"text":"rather than actually doing things that are useful if you're starting completely from scratch."},{"start":2033.95,"text":"Instead, generally what exploration looks like in these larger domains"},{"start":2038.95,"text":"is to rely heavily on demonstrations or on base models that were pre-trained on data and demonstrations"},{"start":2046.99,"text":"So, for example, reinforcement learning has been quite successful in language models because particularly in scenarios where you have a strong base model that already knows how to write coherent sentences and already knows kind of roughly how to approach certain kinds of prompts or certain kinds of problems."},{"start":2064.19,"text":"And likewise, in robotics, if you have demonstrations of example behavior that achieve high reward, then using that as a starting point for reinforcement learning is very powerful."}],"speech_gaps":[{"start":2031.472,"end":2033.55}],"frame":"../frames/v024/012.webp","frame_time":1909.16},{"title":"探索机制与模型学习","segments":[{"id":151,"text":"And likewise, if we don't yet know how to solve the task,"},{"id":152,"text":"then we get low reward for any sort of exploration behavior."},{"id":153,"text":"So there's this coupling problem."},{"id":154,"text":"And we also talked about some alternative exploration strategies"},{"id":155,"text":"that are easier to optimize but can lead to suboptimal performance."},{"id":156,"text":"And what I'd like to talk about is there's actually a method"},{"id":157,"text":"that can both get optimal exploration and exploitation trade-off"},{"id":158,"text":"and also be efficient to train."},{"id":159,"text":"So it sort of gets the best of both worlds."},{"id":160,"text":"And the idea for this is actually going to build upon"},{"id":161,"text":"this last alternative exploration strategy."},{"id":162,"text":"Let's write this right here."},{"id":163,"text":"So the idea here is that you can try to,"},{"id":164,"text":"for different environments or different tasks,"},{"id":165,"text":"You could try to fit a dynamics model and a reward model, and then try to explore in"},{"id":166,"text":"ways that tell us more information about our model of the environment."},{"id":167,"text":"And this should incentivize the agent or the policy to actually seek out additional information"},{"id":168,"text":"to explore in a way that's decoupled from executing on the task."},{"id":169,"text":"And if you do this and you have different MDPs that correspond to navigating to different circles,"},{"id":170,"text":"and then you try to incentivize it to take trajectories that lead to a better model of"},{"id":171,"text":"reward and better model dynamics, you'll actually get a trajectory that looks something like the"},{"id":172,"text":"purple trajectory where it's explicitly trying to visit states that allow it to learn where"},{"id":173,"text":"the reward function is going to be. Now, this can learn efficient exploration strategies,"},{"id":174,"text":"but it has its downsides and it can be suboptimal in some scenarios. For example, if there's"},{"id":175,"text":"distractors, like if there's pictures on the wall, for example, then it's going to be looking"},{"id":176,"text":"at all the pictures on the wall to learn a good model of those different environments."},{"id":177,"text":"So we can build upon this idea and try to learn how to explore without learning a model."},{"id":178,"text":"And in particular, instead of trying to learn a dynamics and reward model, we can instead try to"},{"id":179,"text":"be able to predict what the task is. So we're going to label each task with a identifier mu."},{"id":180,"text":"you. This could be either like a one hot, like an index, or it could be a language description,"},{"id":181,"text":"or it could be kind of some more continuous description of the task, like continuous."}],"notes":["本段讨论了探索机制与模型学习的关系，强调了在不同环境中，通过拟合动态模型和奖励模型来实现更有效的探索策略。这种策略鼓励智能体或策略主动获取更多信息，从而与执行任务本身解耦。","讲者提到，这种方法可以学习到高效的探索策略，但也有其缺点，例如在存在干扰因素（如墙上的图片）时，智能体可能会花费过多时间学习这些无关信息，导致在某些场景下表现不佳。","此外，讲者提出了一种替代方法，即不学习动态和奖励模型，而是直接预测任务本身。每个任务被赋予一个标识符mu，可以是one-hot编码、语言描述或连续描述。","这种方法避免了学习模型的复杂性，但需要智能体能够理解任务的标识符，并据此调整探索行为。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2257.42,"end":2427.54,"asr_flags":[],"raw_segments":[{"start":2257.42,"text":"And likewise, if we don't yet know how to solve the task,"},{"start":2259.72,"text":"then we get low reward for any sort of exploration behavior."},{"start":2265.48,"text":"So there's this coupling problem."},{"start":2268.32,"text":"And we also talked about some alternative exploration strategies"},{"start":2271.66,"text":"that are easier to optimize but can lead to suboptimal performance."},{"start":2278.88,"text":"And what I'd like to talk about is there's actually a method"},{"start":2283.38,"text":"that can both get optimal exploration and exploitation trade-off"},{"start":2287.6,"text":"and also be efficient to train."},{"start":2289.58,"text":"So it sort of gets the best of both worlds."},{"start":2292.52,"text":"And the idea for this is actually going to build upon"},{"start":2294.92,"text":"this last alternative exploration strategy."},{"start":2300.04,"text":"Let's write this right here."},{"start":2303.54,"text":"So the idea here is that you can try to,"},{"start":2310.16,"text":"for different environments or different tasks,"},{"start":2312.0,"text":"You could try to fit a dynamics model and a reward model, and then try to explore in"},{"start":2318.84,"text":"ways that tell us more information about our model of the environment."},{"start":2324.94,"text":"And this should incentivize the agent or the policy to actually seek out additional information"},{"start":2331.86,"text":"to explore in a way that's decoupled from executing on the task."},{"start":2340.8,"text":"And if you do this and you have different MDPs that correspond to navigating to different circles,"},{"start":2348.58,"text":"and then you try to incentivize it to take trajectories that lead to a better model of"},{"start":2353.76,"text":"reward and better model dynamics, you'll actually get a trajectory that looks something like the"},{"start":2358.1,"text":"purple trajectory where it's explicitly trying to visit states that allow it to learn where"},{"start":2362.52,"text":"the reward function is going to be. Now, this can learn efficient exploration strategies,"},{"start":2370.34,"text":"but it has its downsides and it can be suboptimal in some scenarios. For example, if there's"},{"start":2376.8,"text":"distractors, like if there's pictures on the wall, for example, then it's going to be looking"},{"start":2381.58,"text":"at all the pictures on the wall to learn a good model of those different environments."},{"start":2388.6,"text":"So we can build upon this idea and try to learn how to explore without learning a model."},{"start":2397.1,"text":"And in particular, instead of trying to learn a dynamics and reward model, we can instead try to"},{"start":2404.92,"text":"be able to predict what the task is. So we're going to label each task with a identifier mu."},{"start":2413.58,"text":"you. This could be either like a one hot, like an index, or it could be a language description,"},{"start":2420.66,"text":"or it could be kind of some more continuous description of the task, like continuous."}],"speech_gaps":[],"frame":"../frames/v024/014.webp","frame_time":2269.42},{"title":"探索机制与多任务学习的分离","segments":[{"id":182,"text":"And then what we could do is we could try to explore in a way that allows us to predict what the task is at hand. So, for example, we'll have our say that we have two policies, an exploration policy and exploitation policy. In practice, you could combine these, but."},{"id":183,"text":"it's helpful to think about them as separate. So we'll have our exploration strategy, our exploration policy. This is going to produce some experience in a particular task. And our goal is for it to be able to explore, to be able to discern different tasks. And so we could separately train a model that's going to be predicting the task identifier from the experience that we've collected so far."},{"id":184,"text":"And if we do something like this, then this sort of exploration objective is completely separate from actually executing on the task. The goal here is to be able to predict the task identifier. And then separate from this, we could train a policy that's trying to execute on the task just using the identifier for the task. And this is just multitask learning."},{"id":185,"text":"or multitask reinforcement learning, and this we can train just with optimizing reward, and it doesn't rely on having good exploration. So here, we're able to decouple the objective for execution, so it doesn't rely on exploration, and have an exploration objective just based on identifying the task that isn't dependent on how well you do the task."},{"id":186,"text":"So on the slides, we'll train a policy and a task identification model so that we collect data that allows for accurate task prediction. And then we'll also train a policy that's conditioned on the task ID in order to maximize reward for each task. So which part of this is the exploration? Is it the model that predicts the identifier?"},{"id":187,"text":"So the expression is really this policy right here. And this model is actually just going to be used for the reward for this.
