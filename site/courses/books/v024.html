略）在理论上可以表现更好，但仍然存在次优的探索策略。这说明虽然有其他方法可以尝试，但DREAM算法在实际应用中表现更优。","讲者提到可以将探索和利用策略结合起来，例如使用一个单一策略，通过奖励来识别任务并结合任务奖励。这表明探索和利用的结合是强化学习中的一个重要研究方向。","讲者最后提到可以实际观察到DREAM算法在简单环境中的表现，例如智能体能够绕行、读取墙上的颜色信息，并前往正确的对象。这说明DREAM算法在实际应用中具有可行性。"],"formulas":[],"uncertainties":["log a"],"diagram":"none","start":3968.35,"end":4134.32,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3968.35,"text":"whereas the DREAM algorithm requires only a log a. There's some assumptions here in terms of like"},{"start":3973.39,"text":"using Q-learning, using uniform exploration in kind of the outer loop of the algorithm,"},{"start":3980.35,"text":"and you can look at basically the kind of the efficiency, like how efficient is the algorithm?"},{"start":3988.01,"text":"of them, you can see that Dream is able to reach the optimal behavior in many,"},{"start":3994.35,"text":"many fewer samples than if you were to use end-to-end optimization,"},{"start":3997.89,"text":"which is shown in orange as a function of the number of arms."},{"start":4002.43,"text":"So as the problem gets more and more complicated,"},{"start":4008.29,"text":"Dream is able to do far,"},{"start":4010.11,"text":"far better than end-to-end optimization."},{"start":4013.83,"text":"We can also empirically look at things."},{"start":4015.67,"text":"So here's an example of a meta-URL problem where different tasks correspond to going to different objects with different colors."},{"start":4025.11,"text":"And the color of the object is written on the wall."},{"start":4028.55,"text":"And the agent starts over here, and it needs to walk around the wall, read the color, and then go to the correct object."},{"start":4036.85,"text":"So it's exploring or seeking information and then exploiting."},{"start":4041.48,"text":"gets pixel rewards. And if you compare end-to-end algorithms that are shown here, they really, really struggle to do this sort of end-to-end learning to explore problem."},{"start":4054.42,"text":"If you use one of the alternative strategies that we talked about on Wednesday, you can do better in theory, but you still have a suboptimal exploration strategy. Whereas with this algorithm, you're able to actually learn how to explore, like go find the sign and then go to the correct object by trying to decouple exploration for identifying the task and exploitation of solving the task."},{"start":4083.92,"text":"Cool. And then you can actually see this. So here's a video of the exploration episode where it's walking around and going to read the sign on the wall in this simple environment. And then after it reads the sign, it's able to go to the blue key."},{"start":4101.85,"text":"Yeah, that's a great question. So the question is, this is a setting where exploration and exploitation, you can kind of first explore and then exploit. You might also have tasks where you need to interleave exploration and exploitation, where you first need to find some information, then use that to accomplish a subtask, and then find some exploration again."},{"start":4121.5,"text":"We have done some work that tries to combine them and you can, for example, trade a single policy that uses the reward to identify the task combined with the task reward. And if you're interested, I can kind of point you to a relevant work there."}],"speech_gaps":[{"start":4005.65,"end":4007.616}],"frame":"../frames/v024/024.webp","frame_time":3980.35},{"title":"探索机制（Exploration）","segments":[{"id":389,"text":"Okay, so to summarize learning to explore and learning policies that know how to explore, end-to-end can learn optimal exploration and exploitation. But if exploration is hard, it's pretty hard to optimize. And we saw an example of that where all of the methods were kind of flatlining and not learning good exploration.","start":4135.46,"end":4157.12},{"id":390,"text":"Alternative strategies are easier to optimize and can be principled, but can also be suboptimal by large amounts and be very inefficient about exploration.","start":4158.32,"end":4167.3},{"id":391,"text":"This decoupled approach leads to the optimal strategy. It's also easy to optimize, so it gets the best of both worlds. It does require this task identifier. You need to at least be able to enumerate your tasks and know which of those tasks you're in. That's the key thing that it's using in order to get the benefits.","start":4168.53,"end":4187.43},{"id":392,"text":"Cool. We have a little bit of time, and so you could actually, I wanted to briefly talk about one application. So you can take this algorithm and use it in a domain that's a little bit different from what we've seen before. And this domain is trying to find bugs in different computer programs. And in particular, in intro computer science courses, although this is probably applied to other programs as well, it's really cool for students to be able to, like,","start":4189.51,"end":4217.13},{"id":393,"text":"make computer programs. It's very rewarding for them to write a program as they're learning how to code. Then that creates a program like this. So on code.org, students code up this game called Bounce that looks a bit like Pong, or one side of Pong, where the goal is to hit a ball into the goal.","start":4217.66,"end":4236.12},{"id":394,"text":"In CS106A at Stanford, students code up breakout, and so they might code up a program like this. This is an example of a buggy game where the ball actually gets skewered by the paddle. It bounces off the paddle rather than going and losing a point or losing a life.","start":4238.0,"end":4255.52},{"id":395,"text":"And we can basically treat different student programs as different tasks where our goal is to explore and find the bugs that might exist. And our ultimate goal is to then be able to provide feedback to the student on the different bugs in their program. One of the other things about this is it's really time consuming for TAs or instructors to actually grade and give feedback on these assignments because you often end up playing the game in order to figure out and find the bugs.","start":4256.72,"end":4282.05},{"id":396,"text":"Cool. So we can use meta-RL. We can actually use exactly the dream algorithm and train it to be able to identify different distinguishing factors from different students. And it can learn exploration strategies like what happens if the ball hits the goal. So here it's trying to actually play the game successfully. It can also check and act so that what happens if the ball hits the floor. So it's actually purposely trying to not hit the ball or also try to hit the wall instead of the goal.","start":4283.2,"end":4311.12}],"notes":["本段讲解了探索机制在计算机科学课程中的一个具体应用，即通过强化学习算法来检测学生编写的程序中的错误。课程提到，学生在学习编程时会编写类似Pong的游戏程序，而这些程序中可能存在错误，例如球被桨击中后没有失去生命或得分。通过将不同的学生程序视为不同的任务，算法可以探索并识别这些错误，从而为学生提供反馈。","课程指出，手动检查这些程序中的错误对于助教或教师来说非常耗时，因为需要实际运行程序来发现错误。因此，使用强化学习算法来自动化这一过程可以提高效率。","此外，课程提到可以使用meta-RL（元强化学习）来训练算法识别不同学生程序中的特征，并学习探索策略，例如测试球击中目标或地板时的行为。这有助于算法主动寻找程序中的潜在问题。","课程强调，这种探索机制不仅适用于编程教学，还可以应用于其他领域，如软件测试或系统调试。通过自动化探索，可以更高效地发现错误并提供反馈。","课程还提到，这种探索策略可以是主动的，例如算法会故意尝试不同的行为（如不击中球或击中墙壁）以测试程序的鲁棒性，从而发现潜在的错误。","最后，课程指出，这种探索机制结合了端到端学习和分层策略的优点，既能够优化探索效率，又能够确保探索的全面性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4135.46,"end":4311.12,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4135.46,"text":"Okay, so to summarize learning to explore and learning policies that know how to explore, end-to-end can learn optimal exploration and exploitation. But if exploration is hard, it's pretty hard to optimize. And we saw an example of that where all of the methods were kind of flatlining and not learning good exploration."},{"start":4158.32,"text":"Alternative strategies are easier to optimize and can be principled, but can also be suboptimal by large amounts and be very inefficient about exploration."},{"start":4168.53,"text":"This decoupled approach leads to the optimal strategy. It's also easy to optimize, so it gets the best of both worlds. It does require this task identifier. You need to at least be able to enumerate your tasks and know which of those tasks you're in. That's the key thing that it's using in order to get the benefits."},{"start":4189.51,"text":"Cool. We have a little bit of time, and so you could actually, I wanted to briefly talk about one application. So you can take this algorithm and use it in a domain that's a little bit different from what we've seen before. And this domain is trying to find bugs in different computer programs. And in particular, in intro computer science courses, although this is probably applied to other programs as well, it's really cool for students to be able to, like,"},{"start":4217.66,"text":"make computer programs. It's very rewarding for them to write a program as they're learning how to code. Then that creates a program like this. So on code.org, students code up this game called Bounce that looks a bit like Pong, or one side of Pong, where the goal is to hit a ball into the goal."},{"start":4238.0,"text":"In CS106A at Stanford, students code up breakout, and so they might code up a program like this. This is an example of a buggy game where the ball actually gets skewered by the paddle. It bounces off the paddle rather than going and losing a point or losing a life."},{"start":4256.72,"text":"And we can basically treat different student programs as different tasks where our goal is to explore and find the bugs that might exist. And our ultimate goal is to then be able to provide feedback to the student on the different bugs in their program. One of the other things about this is it's really time consuming for TAs or instructors to actually grade and give feedback on these assignments because you often end up playing the game in order to figure out and find the bugs."},{"start":4283.2,"text":"Cool. So we can use meta-RL. We can actually use exactly the dream algorithm and train it to be able to identify different distinguishing factors from different students. And it can learn exploration strategies like what happens if the ball hits the goal. So here it's trying to actually play the game successfully. It can also check and act so that what happens if the ball hits the floor. So it's actually purposely trying to not hit the ball or also try to hit the wall instead of the goal."}],"speech_gaps":[],"frame":"../frames/v024/025.webp","frame_time":4147.46},{"title":"探索机制（Exploration）","segments":[{"id":397,"text":"This is an example of a buggy program that creates lots of different balls as soon as the ball hits the wall. And then there was an experiment in 106A two years ago in the spring 2023 quarter where TAs actually used the meta-RL algorithm and the policy to basically grade and pre-populate the rubric for grading. And then they kind of just verified that the rubric answers were correct from watching the videos of the meta-RL agent playing the game.","start":4311.58,"end":4341.39},{"id":398,"text":"And it led to 44% faster grading and also 6% more accurate grading. And the TAs generally liked using it. They also used it in at least one subsequent quarter because they liked using it so much.","start":4342.11,"end":4356.13}],"notes":["本段介绍了在强化学习课程中，一个关于探索机制的案例，其中提到了一个存在错误的程序，该程序在球碰到墙壁时会创建大量不同的球。接着，讲者提到在2023年春季学期的106A课程中，助教使用了元强化学习（meta-RL）算法和策略来自动评分并预先填充评分标准（rubric），并通过观看元强化学习代理玩游戏的视频来验证评分标准的正确性。","该实验的结果显示，使用该方法后评分速度提高了44%，评分准确性提高了6%。助教普遍喜欢使用这种方法，并且至少在后续的一个学期中继续使用。","讲者强调了元强化学习在实际应用中的潜力，特别是在自动化评分和评分标准生成方面。这表明探索机制不仅限于算法层面，还可以在实际教学和评估中发挥作用。","此外，讲者提到助教在后续学期中继续使用该方法，说明该方法在实际应用中具有一定的稳定性和有效性，这可能与探索机制在强化学习中的核心作用有关。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4311.58,"end":4356.13,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4311.58,"text":"This is an example of a buggy program that creates lots of different balls as soon as the ball hits the wall. And then there was an experiment in 106A two years ago in the spring 2023 quarter where TAs actually used the meta-RL algorithm and the policy to basically grade and pre-populate the rubric for grading. And then they kind of just verified that the rubric answers were correct from watching the videos of the meta-RL agent playing the game."},{"start":4342.11,"text":"And it led to 44% faster grading and also 6% more accurate grading. And the TAs generally liked using it. They also used it in at least one subsequent quarter because they liked using it so much."}],"speech_gaps":[],"frame":"../frames/v024/026.webp","frame_time":4323.58}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
