tly. So the idea here is that if you're in these kinds of MDPs, the state space is enormous, and all of the possible actions you can take is enormous as well.","start":2124.19,"end":2150.14},{"id":146,"text":"this is a way to bias the model towards a part of the state space that is going to get high reward. Yeah, giving it bias of like, these are the kinds of things I want you to do. Okay. So in particular, what I'd like to talk about is like, say you have some model that has been trained and it can do a variety of things, but there's scenarios where when you're actually deploying that policy, you actually...","start":2152.24,"end":2178.06},{"id":147,"text":"Even if you have a lot of prior experience, you might need to explore at test time because you might not have all the information you need to get high reward. And so we talked about a couple examples on Wednesday where, for example, you might need to find ingredients in a kitchen. And to do that, you can't just like start cooking. You need to open drawers, open cabinets and so forth to try to seek out information.","start":2178.6,"end":2201.52},{"id":148,"text":"And second, in language models for reasoning, you might need to explore different strategies that might lead to a solution to a problem rather than simply trying to start writing tokens that you think might lead to the solution. Now, we talked about this kind of meta-URL problem where we're optimizing a policy with history or with memory.","start":2202.46,"end":2226.36},{"id":149,"text":"And generally, memory should allow agents to be able to explore and exploit because they're able to kind of try different actions and remember what they did and then use that information about where ingredients are to then solve the problem.","start":2227.42,"end":2240.78},{"id":150,"text":"But we talked about how if we optimize exploration and exploitation together with an end-to-end objective, this is hard because we have this chicken and egg problem where if we haven't yet learned how to explore, then we can't actually get high rewards because we haven't found the ingredients.","start":2241.52,"end":2256.84}],"notes":["本段主要讨论了探索机制在强化学习中的重要性，特别是在大规模状态空间和动作空间中，如何通过初始化和奖励塑造来引导探索过程。讲者提到，即使在模拟环境中，也可以通过手动编码稀疏或密集奖励，或者从偏好中学习单步奖励，来提供更丰富的奖励信号。此外，讲者还指出，即使有大量先验经验，测试时仍可能需要探索，因为可能缺乏足够的信息来获得高奖励。","讲者举了厨房中寻找食材的例子，说明在实际部署策略时，可能需要通过打开抽屉、柜子等行为来获取信息。在语言模型中，探索不同的策略可能比直接尝试生成可能的解决方案更有效。讲者还提到，记忆可以帮助智能体在探索和利用之间进行平衡，因为它们可以尝试不同的动作并记住结果，从而解决复杂问题。","讲者进一步指出，如果同时优化探索和利用，可能会遇到“鸡与蛋”的问题，即在尚未学会探索之前，无法获得足够的奖励信息。因此，如何在端到端目标中平衡探索和利用是一个挑战。讲者强调，探索是获取信息的关键，而利用则是基于已有信息进行决策。","讲者提到，探索和利用的结合需要谨慎处理，因为探索本身可能无法直接带来奖励，而利用则依赖于探索所获得的信息。因此，如何设计有效的探索策略，以在不牺牲性能的前提下获取足够的信息，是强化学习中的一个重要问题。","讲者还提到，探索不仅适用于传统的马尔可夫决策过程（MDP），也适用于更复杂的任务，如语言模型中的推理任务。在这些任务中，探索不同的策略可能比直接生成答案更有效，因为这有助于发现更优的解决方案。","最后，讲者指出，探索和利用的平衡是强化学习中的核心挑战之一，特别是在大规模状态空间中，如何设计有效的探索机制，以确保智能体能够找到高奖励的路径，是当前研究的重点。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2079.11,"end":2256.84,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2079.11,"text":"Generally, these models are providing"},{"start":2082.03,"text":"an initialization that's really excellent for"},{"start":2083.59,"text":"exploration and seeking out potential things."},{"start":2087.99,"text":"Wherever feasible, it's also quite useful to use"},{"start":2091.21,"text":"shape rewards because that can"},{"start":2093.03,"text":"guide any exploration process as well."},{"start":2096.11,"text":"This could be, if you're in simulations,"},{"start":2098.67,"text":"you can hand code sparse, dense rewards,"},{"start":2101.53,"text":"or if you're learning single-step rewards from preferences,"},{"start":2105.33,"text":"that actually also provides a fairly dense reward signal."},{"start":2109.41,"text":"This isn't to say you can also kind of combine some of these ideas"},{"start":2112.07,"text":"with demonstrations and base models,"},{"start":2116.57,"text":"but generally you get a lot further from starting with this kind of initialization."},{"start":2124.19,"text":"That said, there is still potentially an exploration problem that we started to talk about last time, and I want to revisit that now that we've actually started to learn about exploration in kind of standard MDPs. Yeah, exactly. So the idea here is that if you're in these kinds of MDPs, the state space is enormous, and all of the possible actions you can take is enormous as well."},{"start":2152.24,"text":"this is a way to bias the model towards a part of the state space that is going to get high reward. Yeah, giving it bias of like, these are the kinds of things I want you to do. Okay. So in particular, what I'd like to talk about is like, say you have some model that has been trained and it can do a variety of things, but there's scenarios where when you're actually deploying that policy, you actually..."},{"start":2178.6,"text":"Even if you have a lot of prior experience, you might need to explore at test time because you might not have all the information you need to get high reward. And so we talked about a couple examples on Wednesday where, for example, you might need to find ingredients in a kitchen. And to do that, you can't just like start cooking. You need to open drawers, open cabinets and so forth to try to seek out information."},{"start":2202.46,"text":"And second, in language models for reasoning, you might need to explore different strategies that might lead to a solution to a problem rather than simply trying to start writing tokens that you think might lead to the solution. Now, we talked about this kind of meta-URL problem where we're optimizing a policy with history or with memory."},{"start":2227.42,"text":"And generally, memory should allow agents to be able to explore and exploit because they're able to kind of try different actions and remember what they did and then use that information about where ingredients are to then solve the problem."},{"start":2241.52,"text":"But we talked about how if we optimize exploration and exploitation together with an end-to-end objective, this is hard because we have this chicken and egg problem where if we haven't yet learned how to explore, then we can't actually get high rewards because we haven't found the ingredients."}],"speech_gaps":[],"frame":"../frames/v024/013.webp","frame_time":2091.11},{"title":"探索机制与模型学习","segments":[{"id":151,"text":"And likewise, if we don't yet know how to solve the task,","start":2257.42,"end":2259.58},{"id":152,"text":"then we get low reward for any sort of exploration behavior.","start":2259.72,"end":2263.54},{"id":153,"text":"So there's this coupling problem.","start":2265.48,"end":2267.14},{"id":154,"text":"And we also talked about some alternative exploration strategies","start":2268.32,"end":2271.66},{"id":155,"text":"that are easier to optimize but can lead to suboptimal performance.","start":2271.66,"end":2276.34},{"id":156,"text":"And what I'd like to talk about is there's actually a method","start":2278.88,"end":2283.38},{"id":157,"text":"that can both get optimal exploration and exploitation trade-off","start":2283.38,"end":2287.6},{"id":158,"text":"and also be efficient to train.","start":2287.6,"end":2289.4},{"id":159,"text":"So it sort of gets the best of both worlds.","start":2289.58,"end":2291.52},{"id":160,"text":"And the idea for this is actually going to build upon","start":2292.52,"end":2294.92},{"id":161,"text":"this last alternative exploration strategy.","start":2294.92,"end":2298.28},{"id":162,"text":"Let's write this right here.","start":2300.04,"end":2301.76},{"id":163,"text":"So the idea here is that you can try to,","start":2303.54,"end":2309.6},{"id":164,"text":"for different environments or different tasks,","start":2310.16,"end":2312.0},{"id":165,"text":"You could try to fit a dynamics model and a reward model, and then try to explore in","start":2312.0,"end":2318.84},{"id":166,"text":"ways that tell us more information about our model of the environment.","start":2318.84,"end":2323.76},{"id":167,"text":"And this should incentivize the agent or the policy to actually seek out additional information","start":2324.94,"end":2331.86},{"id":168,"text":"to explore in a way that's decoupled from executing on the task.","start":2331.86,"end":2339.26},{"id":169,"text":"And if you do this and you have different MDPs that correspond to navigating to different circles,","start":2340.8,"end":2347.98},{"id":170,"text":"and then you try to incentivize it to take trajectories that lead to a better model of","start":2348.58,"end":2353.76},{"id":171,"text":"reward and better model dynamics, you'll actually get a trajectory that looks something like the","start":2353.76,"end":2358.1},{"id":172,"text":"purple trajectory where it's explicitly trying to visit states that allow it to learn where","start":2358.1,"end":2362.52},{"id":173,"text":"the reward function is going to be. Now, this can learn efficient exploration strategies,","start":2362.52,"end":2370.24},{"id":174,"text":"but it has its downsides and it can be suboptimal in some scenarios. For example, if there's","start":2370.34,"end":2376.26},{"id":175,"text":"distractors, like if there's pictures on the wall, for example, then it's going to be looking","start":2376.8,"end":2381.58},{"id":176,"text":"at all the pictures on the wall to learn a good model of those different environments.","start":2381.58,"end":2385.52},{"id":177,"text":"So we can build upon this idea and try to learn how to explore without learning a model.","start":2388.6,"end":2395.22},{"id":178,"text":"And in particular, instead of trying to learn a dynamics and reward model, we can instead try to","start":2397.1,"end":2404.92},{"id":179,"text":"be able to predict what the task is. So we're going to label each task with a identifier mu.","start":2404.92,"end":2413.58},{"id":180,"text":"you. This could be either like a one hot, like an index, or it could be a language description,","start":2413.58,"end":2420.54},{"id":181,"text":"or it could be kind of some more continuous description of the task, like continuous.","start":2420.66,"end":2427.54}],"notes":["本段讨论了探索机制与模型学习的关系，强调了在不同环境中，通过拟合动态模型和奖励模型来实现更有效的探索策略。这种策略鼓励智能体或策略主动获取更多信息，从而与执行任务本身解耦。","讲者提到，这种方法可以学习到高效的探索策略，但也有其缺点，例如在存在干扰因素（如墙上的图片）时，智能体可能会花费过多时间学习这些无关信息，导致在某些场景下表现不佳。","此外，讲者提出了一种替代方法，即不学习动态和奖励模型，而是直接预测任务本身。每个任务被赋予一个标识符mu，可以是one-hot编码、语言描述或连续描述。","这种方法避免了学习模型的复杂性，但需要智能体能够理解任务的标识符，并据此调整探索行为。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2257.42,"end":2427.54,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2257.42,"text":"And likewise, if we don't yet know how to solve the task,"},{"start":2259.72,"text":"then we get low reward for any sort of exploration behavior."},{"start":2265.48,"text":"So there's this coupling problem."},{"start":2268.32,"text":"And we also talked about some alternative exploration strategies"},{"start":2271.66,"text":"that are easier to optimize but can lead to suboptimal performance."},{"start":2278.88,"text":"And what I'd like to talk about is there's actually a method"},{"start":2283.38,"text":"that can both get optimal exploration and exploitation trade-off"},{"start":2287.6,"text":"and also be efficient to train."},{"start":2289.58,"text":"So it sort of gets the best of both worlds."},{"start":2292.52,"text":"And the idea for this is actually going to build upon"},{"start":2294.92,"text":"this last alternative exploration strategy."},{"start":2300.04,"text":"Let's write this right here."},{"start":2303.54,"text":"So the idea here is that you can try to,"},{"start":2310.16,"text":"for different environments or different tasks,"},{"start":2312.0,"text":"You could try to fit a dynamics model and a reward model, and then try to explore in"},{"start":2318.84,"text":"ways that tell us more information about our model of the environment."},{"start":2324.94,"text":"And this should incentivize the agent or the policy to actually seek out additional information"},{"start":2331.86,"text":"to explore in a way that's decoupled from executing on the task."},{"start":2340.8,"text":"And if you do this and you have different MDPs that correspond to navigating to different circles,"},{"start":2348.58,"text":"and then you try to incentivize it to take trajectories that lead to a better model of"},{"start":2353.76,"text":"reward and better model dynamics, you'll actually get a trajectory that looks something like the"},{"start":2358.1,"text":"purple trajectory where it's explicitly trying to visit states that allow it to learn where"},{"start":2362.52,"text":"the reward function is going to be. Now, this can learn efficient exploration strategies,"},{"start":2370.34,"text":"but it has its downsides and it can be suboptimal in some scenarios. For example, if there's"},{"start":2376.8,"text":"distractors, like if there's pictures on the wall, for example, then it's going to be looking"},{"start":2381.58,"text":"at all the pictures on the wall to learn a good model of those different environments."},{"start":2388.6,"text":"So we can build upon this idea and try to learn how to explore without learning a model."},{"start":2397.1,"text":"And in particular, instead of trying to learn a dynamics and reward model, we can instead try to"},{"start":2404.92,"text":"be able to predict what the task is. So we're going to label each task with a identifier mu."},{"start":2413.58,"text":"you. This could be either like a one hot, like an index, or it could be a language description,"},{"start":2420.66,"text":"or it could be kind of some more continuous description of the task, like continuous."}],"speech_gaps":[],"frame":"../frames/v024/014.webp","frame_time":2269.42},{"title":"探索机制与多任务学习的分离","segments":[{"id":182,"text":"And then what we could do is we could try to explore in a way that allows us to predict what the task is at hand. So, for example, we'll have our say that we have two policies, an exploration policy and exploitation policy. In practice, you could combine these, but.","start":2431.35,"end":2453.28},{"id":183,"text":"it's helpful to think about them as separate. So we'll have our exploration strategy, our exploration policy. This is going to produce some experience in a particular task. And our goal is for it to be able to explore, to be able to discern different tasks. And so we could separately train a model that's going to be predicting the task identifier from the experience that we've collected so far.","start":2455.66,"end":2484.28},{"id":184,"text":"And if we do something like this, then this sort of exploration objective is completely separate from actually executing on the task. The goal here is to be able to predict the task identifier. And then separate from this, we could train a policy that's trying to execute on the task just using the identifier for the task. And this is just multitask learning.","start":2485.81,"end":2515.33},{"id":185,"text":"or multitask reinforcement learning, and this we can train just with optimizing reward, and it doesn't rely on having good exploration. So here, we're able to decouple the objective for execution, so it doesn't rely on exploration, and have an exploration objective just based on identifying the task that isn't dependent on how well you do the task.","start":2515.95,"end":2539.78},{"id":186,"text":"So on the slides, we'll train a policy and a task identification model so that we collect data that allows for accurate task prediction. And then we'll also train a policy that's conditioned on the task ID in order to maximize reward for each task. So which part of this is the exploration? Is it the model that predicts the identifier?","start":2541.17,"end":2563.28},{"id":187,"text":"So the expression is really this policy right here. And this model is actually just going to be used for the reward for this. And so the reward for this policy will be basically how well this model is at identifying the task, or basically the negative error of this task identifier model. Good question. The question is, does this generalize to new unseen task categories?","start":2564.4,"end":2591.34}],"notes":["本段讲解了探索机制与多任务学习的分离。课程中提到，可以将探索策略和利用策略视为两个独立的策略，分别用于探索和执行任务。探索策略的目标是收集经验以识别任务标识符，而执行策略则基于任务标识符来最大化奖励。","探索策略的目标是通过收集经验来识别任务标识符，而执行策略则基于任务标识符来执行任务。这种分离使得探索和执行的目标可以独立优化，从而提高整体性能。","课程中还提到，探索策略的目标是识别任务，而不是执行任务本身。因此，探索策略的奖励是基于任务标识符模型的准确性，而不是任务执行的性能。","在多任务强化学习中，探索策略和执行策略可以分别训练，探索策略的目标是收集数据以准确预测任务标识符，而执行策略的目标是最大化每个任务的奖励。","课程最后提出了一个问题，即这种探索机制是否能够泛化到新的未见过的任务类别。这表明探索策略的泛化能力是一个重要的考虑因素。","整个讲解强调了探索和执行目标的分离，以及如何通过任务标识符模型来实现这种分离。这种分离有助于提高多任务学习的效率和效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2431.35,"end":2591.34,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2431.35,"text":"And then what we could do is we could try to explore in a way that allows us to predict what the task is at hand. So, for example, we'll have our say that we have two policies, an exploration policy and exploitation policy. In practice, you could combine these, but."},{"start":2455.66,"text":"it's helpful to think about them as separate. So we'll have our exploration strategy, our exploration policy. This is going to produce some experience in a particular task. And our goal is for it to be able to explore, to be able to discern different tasks. And so we could separately train a model that's going to be predicting the task identifier from the experience that we've collected so far."},{"start":2485.81,"text":"And if we do something like this, then this sort of exploration objective is completely separate from actually executing on the task. The goal here is to be able to predict the task identifier. And then separate from this, we could train a policy that's trying to execute on the task just using the identifier for the task. And this is just multitask learning."},{"start":2515.95,"text":"or multitask reinforcement learning, and this we can train just with optimizing reward, and it doesn't rely on having good exploration. So here, we're able to decouple the objective for execution, so it doesn't rely on exploration, and have an exploration objective just based on identifying the task that isn't dependent on how well you do the task."},{"start":2541.17,"text":"So on the slides, we'll train a policy and a task identification model so that we collect data that allows for accurate task prediction. And then we'll also train a policy that's conditioned on the task ID in order to maximize reward for each task. So which part of this is the exploration? Is it the model that predicts the identifier?"},{"start":2564.4,"text":"So the expression is really this policy right here. And this model is actually just going to be used for the reward for this. And so the reward for this policy will be basically how well this model is at identifying the task, or basically the negative error of this task identifier model. Good question. The question is, does this generalize to new unseen task categories?"}],"speech_gaps":[],"frame":"../frames/v024/015.webp","frame_time":2443.35},{"title":"探索机制中的任务识别与泛化","segments":[{"id":188,"text":"can actually struggle with generalization. And we'll talk about that. Let's go through metatesting, and then we'll talk about that. So this is roughly how training works. And then at test time, if you've trained all of these different things, then you can take your exploration policy, run it to collect experience, then feed that experience into your task identifier model to get a task ID, and then...","start":2593.01,"end":2617.09},{"id":189,"text":"take that task ID and feed that as input to your execution policy to then execute the task. So you'll then explore and then identify the task and then exploit. Now, getting back to that question, the upside of this is you don't need to model dynamics or rewards. You're just learning this model that's predicting the task identifier.","start":2617.43,"end":2640.11},{"id":190,"text":"But if the task identifier is just a one-hot vector, for example, this probably isn't going to generalize to new tasks very well. And we'll see a solution to that on the next slide. The question is, what is the main difference from black box meta-URL that we talked about before? So we are still sampling different MDPs. The main difference is simply the objective for the exploration part.","start":2640.98,"end":2668.16},{"id":191,"text":"Well, I guess there's two main differences. One is the objective for the exploration part, and then the second is that here we're going to be maximizing rewards similar to black box meta-URL, but we're actually going to be giving it this task identifier so that it doesn't need to rely on exploration or a good exploration strategy when trying to learn how to do the task. Now, we have this generalization problem, and we actually also have a way to address this.","start":2670.09,"end":2694.85},{"id":192,"text":"Instead of using this task identifier directly, we can actually try to learn a more compressed representation of the task that will generalize more effectively than like a one-hot vector. So as an example, when we learn the execution policy, we're also going to identify information that's needed for solving the task.","start":2696.66,"end":2716.58},{"id":193,"text":"And so say that our identifier consists of a few things that are relevant and a few things that are not relevant. So it contains things like wall color and decorations, but then it also contains information about where the ingredients are. Then we'd like to use, and similar if you had a one-hot vector, it would also contain information that might be irrelevant because you might have two kitchens that have ingredients in the same place, but then have other things that are spurious.","start":2717.26,"end":2740.23},{"id":194,"text":"We'll try to then bottleneck this representation to compress away the stuff that's not needed for solving the task. If we can do this, then this sort of representation should generalize better. Then when we learn to explore, instead of learning to explore to be able to predict the identifier here, we'll learn to explore so that we can recover this compressed task representation.","start":2741.03,"end":2767.37}],"notes":["本段讨论了任务识别模型在泛化能力上的局限性，特别是当任务标识符是one-hot向量时，模型可能无法有效泛化到新任务。课程指出，这种表示方式包含了一些无关信息，例如墙壁颜色和装饰，这些信息可能对任务解决没有帮助，甚至可能引入噪声。","为了解决这一问题，课程提出了一种压缩表示的方法，即通过瓶颈机制（bottleneck）去除不必要的信息，从而提升泛化能力。这种压缩表示能够更有效地捕捉任务的关键特征，例如食材的位置。","在探索策略的学习过程中，模型不再直接学习预测任务标识符，而是学习如何恢复这种压缩后的任务表示。这使得探索策略能够更专注于任务相关的信息，而不是无关的细节。","这种压缩表示的泛化能力依赖于任务的结构和特征，因此在实际应用中需要根据具体任务进行调整。课程强调，压缩表示的训练过程需要平衡信息保留和冗余去除。","课程还提到，这种任务识别和压缩表示的方法与传统的黑盒元学习（black box meta-URL）有所不同，主要体现在探索目标的设定上。传统的元学习方法可能更依赖于探索策略本身，而这里则通过任务标识符来引导探索。","最后，课程指出，这种压缩表示的泛化能力在实际应用中可能受到多种因素的影响，例如任务的复杂性、数据的多样性以及模型的训练策略。因此，需要进一步研究和实验来验证其有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2593.01,"end":2767.37,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2593.01,"text":"can actually struggle with generalization. And we'll talk about that. Let's go through metatesting, and then we'll talk about that. So this is roughly how training works. And then at test time, if you've trained all of these different things, then you can take your exploration policy, run it to collect experience, then feed that experience into your task identifier model to get a task ID, and then..."},{"start":2617.43,"text":"take that task ID and feed that as input to your execution policy to then execute the task. So you'll then explore and then identify the task and then exploit. Now, getting back to that question, the upside of this is you don't need to model dynamics or rewards. You're just learning this model that's predicting the task identifier."},{"start":2640.98,"text":"But if the task identifier is just a one-hot vector, for example, this probably isn't going to generalize to new tasks very well. And we'll see a solution to that on the next slide. The question is, what is the main difference from black box meta-URL that we talked about before? So we are still sampling different MDPs. The main difference is simply the objective for the exploration part."},{"start":2670.09,"text":"Well, I guess there's two main differences. One is the objective for the exploration part, and then the second is that here we're going to be maximizing rewards similar to black box meta-URL, but we're actually going to be giving it this task identifier so that it doesn't need to rely on exploration or a good exploration strategy when trying to learn how to do the task. Now, we have this generalization problem, and we actually also have a way to address this."},{"start":2696.66,"text":"Instead of using this task identifier directly, we can actually try to learn a more compressed representation of the task that will generalize more effectively than like a one-hot vector. So as an example, when we learn the execution policy, we're also going to identify information that's needed for solving the task."},{"start":2717.26,"text":"And so say that our identifier consists of a few things that are relevant and a few things that are not relevant. So it contains things like wall color and decorations, but then it also contains information about where the ingredients are. Then we'd like to use, and similar if you had a one-hot vector, it would also contain information that might be irrelevant because you might have two kitchens that have ingredients in the same place, but then have other things that are spurious."},{"start":2741.03,"text":"We'll try to then bottleneck this representation to compress away the stuff that's not needed for solving the task. If we can do this, then this sort of representation should generalize better. Then when we learn to explore, instead of learning to explore to be able to predict the identifier here, we'll learn to explore so that we can recover this compressed task representation."}],"speech_gaps":[],"frame":"../frames/v024/016.webp","frame_time":2605.01},{"title":"探索机制中的表示压缩","segments":[{"id":195,"text":"And so try to be able to explore so that you're able to predict what this Z representation for the task is. Now, how do you actually compress representations in neural networks? So before we go into the details of this algorithm, let's talk about that a little bit. So we have our task identifier mu, mu i. And then we'd like to...","start":2768.34,"end":2800.61},{"id":196,"text":"have a neural network that uses that to predict ZI. And then we'll then have a policy that takes this and the state and outputs the action. And if we train this whole thing end-to-end, it's not necessarily incentivized to actually compress information here, to actually remove information about decorations, for example.","start":2801.9,"end":2831.9},{"id":197,"text":"So one thing we could do is we could simply add noise to this representation. And so if you take this and instead of feeding it directly here, you could take this output zi, and then right here you could basically add some noise. So right here what you're doing is you're...","start":2833.12,"end":2857.27},{"id":198,"text":"adding some noise where the noise is kind of sampled from a Gaussian distribution.","start":2858.04,"end":2863.96},{"id":199,"text":"And if you add noise, then this is going to discard information","start":2864.8,"end":2868.58},{"id":200,"text":"because you're kind of corrupting the signal.","start":2868.58,"end":2872.6},{"id":201,"text":"But you might discard some good information,","start":2874.28,"end":2877.1},{"id":202,"text":"especially if you do this only at test time.","start":2878.4,"end":2880.24},{"id":203,"text":"Now, in principle, you could also train with this noise","start":2881.36,"end":2883.7},{"id":204,"text":"to encourage it to discard information from Z.","start":2883.7,"end":2886.82},{"id":205,"text":"But if you train the policy with this noise as input,","start":2888.42,"end":2892.2},{"id":206,"text":"then what it could just do is it could just increase","start":2892.44,"end":2896.12},{"id":207,"text":"the magnitude of zi here so that","start":2896.12,"end":2898.34},{"id":208,"text":"the magnitude of the noise is a lot smaller in comparison.","start":2898.34,"end":2901.28},{"id":209,"text":"So if you just add noise,","start":2902.38,"end":2903.7},{"id":210,"text":"the model can compensate and still pass on a lot of","start":2903.84,"end":2906.08},{"id":211,"text":"information through this task representation.","start":2906.08,"end":2909.64},{"id":212,"text":"That's not a great solution.","start":2911.2,"end":2912.44},{"id":213,"text":"But what we can do is we can just also","start":2915.68,"end":2917.62},{"id":214,"text":"prevent the model from increasing the magnitude. We can just add a loss that we can modify our","start":2917.62,"end":2925.92},{"id":215,"text":"training loss for the policy to include a term that's going to minimize the magnitude of z.","start":2925.92,"end":2934.24},{"id":216,"text":"And if you do this, now if it blows up the magnitude of z, then it will have a high loss","start":2935.6,"end":2944.34}],"notes":["本段讨论了在强化学习中如何通过添加噪声来实现表示压缩，以鼓励模型忽略不重要的信息。讲者指出，直接添加噪声可能会导致模型补偿噪声，从而保留大量信息，这不是一个有效的解决方案。","讲者提到，如果在训练过程中引入噪声，模型可能会通过增加表示的幅度来抵消噪声的影响，从而使得噪声相对较小。这种机制虽然可以工作，但并不是理想的压缩方法。","为了防止模型增加表示的幅度，可以修改训练损失函数，加入一个最小化表示幅度的项。这样，如果模型试图放大表示的幅度，就会导致高损失，从而抑制这种行为。","讲者强调，这种机制是探索机制的一部分，旨在通过压缩表示来提高模型对任务相关特征的聚焦能力，而不是保留所有细节。","讲者指出，添加噪声是一种常见的方法，但需要结合额外的约束条件，如损失函数的修改，才能有效实现信息压缩。","讲者还提到，如果仅在测试时添加噪声，可能会导致模型丢弃一些有用的信息，因此需要在训练过程中也引入噪声以确保模型能够正确学习如何压缩表示。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2768.34,"end":2944.34,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2768.34,"text":"And so try to be able to explore so that you're able to predict what this Z representation for the task is. Now, how do you actually compress representations in neural networks? So before we go into the details of this algorithm, let's talk about that a little bit. So we have our task identifier mu, mu i. And then we'd like to..."},{"start":2801.9,"text":"have a neural network that uses that to predict ZI. And then we'll then have a policy that takes this and the state and outputs the action. And if we train this whole thing end-to-end, it's not necessarily incentivized to actually compress information here, to actually remove information about decorations, for example."},{"start":2833.12,"text":"So one thing we could do is we could simply add noise to this representation. And so if you take this and instead of feeding it directly here, you could take this output zi, and then right here you could basically add some noise. So right here what you're doing is you're..."},{"start":2858.04,"text":"adding some noise where the noise is kind of sampled from a Gaussian distribution."},{"start":2864.8,"text":"And if you add noise, then this is going to discard information"},{"start":2868.58,"text":"because you're kind of corrupting the signal."},{"start":2874.28,"text":"But you might discard some good information,"},{"start":2878.4,"text":"especially if you do this only at test time."},{"start":2881.36,"text":"Now, in principle, you could also train with this noise"},{"start":2883.7,"text":"to encourage it to discard information from Z."},{"start":2888.42,"text":"But if you train the policy with this noise as input,"},{"start":2892.44,"text":"then what it could just do is it could just increase"},{"start":2896.12,"text":"the magnitude of zi here so that"},{"start":2898.34,"text":"the magnitude of the noise is a lot smaller in comparison."},{"start":2902.38,"text":"So if you just add noise,"},{"start":2903.84,"text":"the model can compensate and still pass on a lot of"},{"start":2906.08,"text":"information through this task representation."},{"start":2911.2,"text":"That's not a great solution."},{"start":2915.68,"text":"But what we can do is we can just also"},{"start":2917.62,"text":"prevent the model from increasing the magnitude. We can just add a loss that we can modify our"},{"start":2925.92,"text":"training loss for the policy to include a term that's going to minimize the magnitude of z."},{"start":2935.6,"text":"And if you do this, now if it blows up the magnitude of z, then it will have a high loss"}],"speech_gaps":[{"start":2913.392,"end":2915.28}],"frame":"../frames/v024/017.webp","frame_time":2780.34},{"title":"信息瓶颈与任务表示","segments":[{"id":217,"text":"here and so we'll be forced to keep that magnitude down to be lower so that it is","start":2944.34,"end":2949.04},{"id":218,"text":"actually forced to remove information that isn't needed. And any sort of","start":2949.04,"end":2954.9},{"id":219,"text":"magnitude it does introduce will be incentivized to only have information","start":2954.9,"end":2958.66},{"id":220,"text":"that's needed for predicting the action. This is called a variational","start":2958.66,"end":2964.54},{"id":221,"text":"information bottleneck.","start":2964.54,"end":2965.62},{"id":222,"text":"which is kind of a fancy term for saying that you're adding noise and then also modifying your loss term to have this L2 penalty on your representation. One of the reasons why this is called a variational information bottleneck is that this objective is actually equivalent to minimizing the KL divergence between your...","start":2966.11,"end":2990.02},{"id":223,"text":"If you think about this as a distribution, because this is now a Gaussian distribution with a mean at zi and a variance according to the variance of epsilon, that's equivalent to minimizing the KL divergence between that distribution and the unit Gaussian distribution. Yeah, so the question is, why are we creating a representation of a one-hot vector?","start":2991.4,"end":3014.31},{"id":224,"text":"If we go back to the algorithm we talked about before, where we are exploring to generate experience, then trying to identify the task, and then condition on that task, if we then want to quickly solve a new task, then we'll be able to use our policy to explore. But then after we explore it,","start":3015.69,"end":3037.06},{"id":225,"text":"If our representation is a one-hot vector here, if it's a new task, then that new task may not cleanly fit within one of the previous one-hot vectors. And so we'd like to have a more continuous space that's more compactly representing the task and essentially learn this latent task representation that will generalize to new tasks. Yeah, so the question is, don't we need more information about the task, like whether or not two tasks are related to each other? No, I guess.","start":3037.78,"end":3066.16},{"id":226,"text":"So when you think about a one-hot, it doesn't really seem like it is necessarily capturing not much information, but a one-hot vector is actually less compressed than something that is something that's like a more continuous or less discrete representation.","start":3068.49,"end":3091.01},{"id":227,"text":"So say, for example, that one of your tasks is to go here.","start":3091.01,"end":3099.09},{"id":228,"text":"This is task one.","start":3099.17,"end":3100.13},{"id":229,"text":"Task two is to go here.","start":3100.97,"end":3102.97},{"id":230,"text":"Task three is to go here.","start":3103.49,"end":3105.39},{"id":231,"text":"And task four is to go here.","start":3105.65,"end":3108.37},{"id":232,"text":"Then task one and task four are very similar.","start":3108.71,"end":3111.05},{"id":233,"text":"But when you use one-hot vectors to represent them,","start":3111.39,"end":3115.37}],"notes":["本段讨论了信息瓶颈（Variational Information Bottleneck）的概念，强调其通过添加噪声和引入L2正则化项来压缩表示，从而减少冗余信息。同时，讲者指出，这种压缩方式等价于最小化KL散度，将当前分布与单位高斯分布进行比较。","讲者进一步探讨了使用one-hot向量表示任务的局限性，指出one-hot向量虽然能表示任务，但其信息压缩程度较低，无法有效捕捉任务之间的相似性。因此，需要更连续或更紧凑的表示方式来学习潜在任务表示，以实现对新任务的泛化。","通过举例说明，讲者指出多个任务可能具有相似性，但one-hot向量无法有效捕捉这种相似性，因此需要更灵活的表示方法。讲者还提到，虽然任务之间的关系可能影响表示，但并不一定需要显式地建模这种关系。","讲者强调，信息瓶颈方法的核心在于通过正则化项和噪声引入，实现对表示的压缩，从而在保持任务相关性的同时减少冗余信息。这种压缩方式在强化学习中用于快速适应新任务。","讲者指出，one-hot向量虽然直观，但其信息压缩能力有限，无法有效表示任务之间的连续性。因此，需要更复杂的表示方法，如连续或紧凑的潜在空间，以实现对新任务的泛化。","最后，讲者通过举例说明多个任务的相似性，强调了使用更紧凑表示的重要性，以捕捉任务之间的潜在关系，从而提升模型的泛化能力。"],"formulas":[{"latex":"\\text{KL}(q \\parallel p)","symbols":"KL散度","explanation":"保持原式，KL散度是概率分布q与p之间的散度，符合数学定义。","evidence":"which is kind of a fancy term for saying that you're adding noise and then also modifying your loss term to have this L2 penalty on your representation. One of the reasons why this is called a variational information bottleneck is that this objective is actually equivalent to minimizing the KL divergence between your..."},{"latex":"\\text{L2 penalty}","symbols":"L2正则化项","explanation":"保持原式，L2正则化项是用于防止过拟合的损失项，符合数学定义。","evidence":"which is kind of a fancy term for saying that you're adding noise and then also modifying your loss term to have this L2 penalty on your representation. One of the reasons why this is called a variational information bottleneck is that this objective is actually equivalent to minimizing the KL divergence between your..."}],"uncertainties":["the unit Gaussian distribution"],"diagram":"none","start":2944.34,"end":3115.37,"asr_flags":[],"math_clarifications":["原文中提到的KL散度和L2正则化项是正确的数学概念，无需进一步修改。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2944.34,"text":"here and so we'll be forced to keep that magnitude down to be lower so that it is"},{"start":2949.04,"text":"actually forced to remove information that isn't needed. And any sort of"},{"start":2954.9,"text":"magnitude it does introduce will be incentivized to only have information"},{"start":2958.66,"text":"that's needed for predicting the action. This is called a variational"},{"start":2964.54,"text":"information bottleneck."},{"start":2966.11,"text":"which is kind of a fancy term for saying that you're adding noise and then also modifying your loss term to have this L2 penalty on your representation. One of the reasons why this is called a variational information bottleneck is that this objective is actually equivalent to minimizing the KL divergence between your..."},{"start":2991.4,"text":"If you think about this as a distribution, because this is now a Gaussian distribution with a mean at zi and a variance according to the variance of epsilon, that's equivalent to minimizing the KL divergence between that distribution and the unit Gaussian distribution. Yeah, so the question is, why are we creating a representation of a one-hot vector?"},{"start":3015.69,"text":"If we go back to the algorithm we talked about before, where we are exploring to generate experience, then trying to identify the task, and then condition on that task, if we then want to quickly solve a new task, then we'll be able to use our policy to explore. But then after we explore it,"},{"start":3037.78,"text":"If our representation is a one-hot vector here, if it's a new task, then that new task may not cleanly fit within one of the previous one-hot vectors. And so we'd like to have a more continuous space that's more compactly representing the task and essentially learn this latent task representation that will generalize to new tasks. Yeah, so the question is, don't we need more information about the task, like whether or not two tasks are related to each other? No, I guess."},{"start":3068.49,"text":"So when you think about a one-hot, it doesn't really seem like it is necessarily capturing not much information, but a one-hot vector is actually less compressed than something that is something that's like a more continuous or less discrete representation."},{"start":3091.01,"text":"So say, for example, that one of your tasks is to go here."},{"start":3099.17,"text":"This is task one."},{"start":3100.97,"text":"Task two is to go here."},{"start":3103.49,"text":"Task three is to go here."},{"start":3105.65,"text":"And task four is to go here."},{"start":3108.71,"text":"Then task one and task four are very similar."},{"start":3111.39,"text":"But when you use one-hot vectors to represent them,"}],"speech_gaps":[],"frame":"../frames/v024/018.webp","frame_time":2956.34},{"title":"探索机制中的噪声添加与任务表示","segments":[{"id":234,"text":"them. They are not. They're kind of represented completely separately. And if you try to learn","start":3115.37,"end":3126.87},{"id":235,"text":"a task representation that's compressing these, then it will actually learn a representation","start":3126.87,"end":3130.41},{"id":236,"text":"that puts these much closer to each other. The question is, do you need to add epsilon","start":3131.11,"end":3136.19},{"id":237,"text":"to the loss? So it doesn't end up coming into the loss, but you do need to add it when you're","start":3136.19,"end":3144.83},{"id":238,"text":"you're actually training the neural network.","start":3144.83,"end":3146.43},{"id":239,"text":"So you're adding the noise, and you'd resample the noise","start":3146.63,"end":3151.17},{"id":240,"text":"every single time.","start":3151.17,"end":3151.97},{"id":241,"text":"And the epsilon is sampled from this distribution.","start":3153.43,"end":3156.55},{"id":242,"text":"And you can think about this distribution","start":3156.71,"end":3158.13},{"id":243,"text":"as coming into the loss.","start":3158.13,"end":3162.37},{"id":244,"text":"But you don't need to add epsilon anywhere to the loss.","start":3163.59,"end":3166.33},{"id":245,"text":"It just comes out to this.","start":3166.93,"end":3168.57},{"id":246,"text":"So let's walk through actually what this algorithm looks","start":3169.69,"end":3174.07},{"id":247,"text":"like more completely so you first let's talk about just like executing on the","start":3174.07,"end":3184.07},{"id":248,"text":"task separate from exploration so our goal is to learn this task representation","start":3184.07,"end":3188.03},{"id":249,"text":"this latent task representation and how to solve the task and to do this we're","start":3188.03,"end":3193.43},{"id":250,"text":"going to have we have our task identifier and we're gonna have a","start":3193.43,"end":3198.73},{"id":251,"text":"a network that produces z i, we're going to add noise to get z i plus epsilon, and then","start":3198.73,"end":3212.69},{"id":252,"text":"we're going to pass this and the state into our, this is our execution policy that's going","start":3215.43,"end":3224.21},{"id":253,"text":"to produce an action.","start":3224.21,"end":3225.43},{"id":254,"text":"We can think about this as having two parts. So we have the execution policy right here that takes as input the noisy zi and the state to produce the action. And then we also have this part right here. And we'll write this as some encoder f that maps from mu i to zi. We can write this as a distribution because if you kind of...","start":3229.93,"end":3257.72},{"id":255,"text":"Fold this noise into a distribution like this. This will be some distribution that is, let's now call this z bar. This is a distribution that is a Gaussian with mean of z bar i and some variance. Let's just write it as variance like that.","start":3258.8,"end":3285.25}],"notes":["本段讨论了在强化学习中，如何通过添加噪声来实现探索机制。讲者提到，如果尝试学习一个压缩任务表示的模型，它会将原本分开的任务表示更紧密地联系起来。但需要注意的是，是否需要将噪声（epsilon）添加到损失函数中，这取决于具体的训练过程。讲者指出，虽然噪声不会直接出现在损失函数中，但在训练神经网络时，需要在每次迭代中重新采样噪声。","讲者进一步解释了算法的结构，包括执行策略和编码器。执行策略接收带有噪声的zi和状态，以生成动作。编码器则将mu i映射到zi，并且可以将其视为一个分布，因为噪声被整合到了分布中。这个分布被命名为z bar，是一个均值为z bar i、方差为某个值的高斯分布。","讲者强调，虽然噪声被整合到分布中，但并不需要显式地将epsilon添加到损失函数中。相反，噪声的引入是通过在每次训练时重新采样实现的。这表明，探索机制的实现并不依赖于直接修改损失函数，而是通过在输入中引入噪声来实现。","讲者还提到，任务表示的学习目标是学习一个潜在的任务表示，并利用该表示来解决任务。这涉及到任务标识符和网络的使用，其中网络生成zi，并通过添加噪声得到zi + epsilon。然后，将带有噪声的zi和状态输入到执行策略中，以生成动作。","在讨论分布时，讲者指出，噪声被整合到分布中，形成一个高斯分布，其均值为z bar i，方差为某个值。这表明，任务表示的学习过程不仅涉及编码器的结构，还涉及噪声的引入和分布的建模。","最后，讲者提到，整个算法的结构可以分为两个部分：执行策略和编码器。执行策略负责根据带有噪声的zi和状态生成动作，而编码器则负责将mu i映射到zi，并将其视为一个分布。这种结构使得探索机制能够通过噪声的引入来实现，而无需直接修改损失函数。"],"formulas":[{"latex":"z_i + \\epsilon","symbols":"zi加上噪声epsilon","explanation":"公式正确，表示在任务表示中添加噪声epsilon。","evidence":"a network that produces z i, we're going to add noise to get z i plus epsilon, and then"},{"latex":"z_{\\text{bar}} \\sim \\text{Gaussian}(\\bar{z}_i, \\text{variance})","symbols":"z bar服从均值为z bar i、方差为某个值的高斯分布","explanation":"公式正确，表示z bar服从均值为z bar i、方差为某个值的高斯分布。","evidence":"Fold this noise into a distribution like this. This will be some distribution that is, let's now call this z bar. This is a distribution that is a Gaussian with mean of z bar i and some variance. Let's just write it as variance like that."}],"uncertainties":[],"diagram":"none","start":3115.37,"end":3285.25,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均符合规范，无需进一步修正。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3115.37,"text":"them. They are not. They're kind of represented completely separately. And if you try to learn"},{"start":3126.87,"text":"a task representation that's compressing these, then it will actually learn a representation"},{"start":3131.11,"text":"that puts these much closer to each other. The question is, do you need to add epsilon"},{"start":3136.19,"text":"to the loss? So it doesn't end up coming into the loss, but you do need to add it when you're"},{"start":3144.83,"text":"you're actually training the neural network."},{"start":3146.63,"text":"So you're adding the noise, and you'd resample the noise"},{"start":3151.17,"text":"every single time."},{"start":3153.43,"text":"And the epsilon is sampled from this distribution."},{"start":3156.71,"text":"And you can think about this distribution"},{"start":3158.13,"text":"as coming into the loss."},{"start":3163.59,"text":"But you don't need to add epsilon anywhere to the loss."},{"start":3166.93,"text":"It just comes out to this."},{"start":3169.69,"text":"So let's walk through actually what this algorithm looks"},{"start":3174.07,"text":"like more completely so you first let's talk about just like executing on the"},{"start":3184.07,"text":"task separate from exploration so our goal is to learn this task representation"},{"start":3188.03,"text":"this latent task representation and how to solve the task and to do this we're"},{"start":3193.43,"text":"going to have we have our task identifier and we're gonna have a"},{"start":3198.73,"text":"a network that produces z i, we're going to add noise to get z i plus epsilon, and then"},{"start":3215.43,"text":"we're going to pass this and the state into our, this is our execution policy that's going"},{"start":3224.21,"text":"to produce an action."},{"start":3229.93,"text":"We can think about this as having two parts. So we have the execution policy right here that takes as input the noisy zi and the state to produce the action. And then we also have this part right here. And we'll write this as some encoder f that maps from mu i to zi. We can write this as a distribution because if you kind of..."},{"start":3258.8,"text":"Fold this noise into a distribution like this. This will be some distribution that is, let's now call this z bar. This is a distribution that is a Gaussian with mean of z bar i and some variance. Let's just write it as variance like that."}],"speech_gaps":[{"start":3213.09,"end":3215.03},{"start":3225.936,"end":3227.472}],"frame":"../frames/v024/019.webp","frame_time":3127.37},{"title":"探索机制与信息瓶颈","segments":[{"id":256,"text":"So these are the two things that have parameters, f and pi. And we're going to train both of these neural networks to maximize reward so that we're actually learning a representation such that we can solve the task and predict actions that maximize reward. And then we're also going to add the regularization on z. And so our objective here will be maximizing the sum","start":3286.83,"end":3314.18},{"id":257,"text":"of expected rewards under our execution policy. And since we're maximizing here, we're also going to be minimizing this term right here, which is the equivalent to the KL divergence. So we'll be maximizing the negative KL divergence between f z i given mu i.","start":3314.92,"end":3346.97},{"id":258,"text":"and this unit Gaussian. So on the slides, there's the objective. And this is just trying to solve the task and also learn latent task representation based off of the task ID. It's going to be a vector. So Z is going to be a vector. And so this should be an I. But yeah, it'll be a vector. And you, yeah.","start":3348.77,"end":3377.01},{"id":259,"text":"Yeah, so the question is, why are we adding this information bottleneck or this KL divergence? The reason is that we want to learn a nice task representation that's throwing away information. And if we don't add that term, then this Z right here, this representation of the task, might still contain a lot of information that are irrelevant for actually solving the task. And so it might contain... Like if, for example, you have...","start":3377.83,"end":3406.09},{"id":260,"text":"two tasks that have the ingredients in the same exact place, but something has changed about the environment, like the wall color is different or different objects are in different places, but those are irrelevant to solving the task, then Z will include those things that are irrelevant. And then when you go to explore, you're then going to be exploring things that are irrelevant to the task. Yeah, so the question is, we are given the task ID during training. We actually don't need it at test time.","start":3407.06,"end":3433.99},{"id":261,"text":"So what does this look like to generalize to new tasks?","start":3434.68,"end":3437.14},{"id":262,"text":"When you are faced with a new task,","start":3438.98,"end":3441.32},{"id":263,"text":"you're going to use your exploration policy to explore","start":3441.5,"end":3443.6},{"id":264,"text":"and then predict a...","start":3443.6,"end":3446.22},{"id":265,"text":"Instead of predicting UI, you're actually going to be predicting ZI,","start":3447.02,"end":3449.3},{"id":266,"text":"your latent task representation,","start":3449.44,"end":3450.5},{"id":267,"text":"and then feeding that into your execution policy","start":3450.88,"end":3454.02},{"id":268,"text":"to then execute or exploit on the task.","start":3454.66,"end":3457.4},{"id":269,"text":"The question is, can you train the execution policy","start":3458.08,"end":3460.74},{"id":270,"text":"to attend to the relevant parts?","start":3460.74,"end":3462.64}],"notes":["本段讲解了在强化学习中引入信息瓶颈（KL散度）的目的，即通过正则化任务表示Z，去除与任务无关的信息。这有助于在探索过程中专注于关键特征，避免被无关环境变化干扰。","讲者提到，如果任务表示Z包含无关信息，那么在探索时可能会探索到与任务无关的内容，从而影响任务完成效率。因此，通过KL散度正则化可以确保Z仅保留对任务解决有用的信息。","在训练阶段，任务ID被用来学习任务表示Z，但在测试阶段不需要任务ID。这意味着模型需要在没有任务ID的情况下，通过Z来执行任务。","讲者进一步说明了如何利用Z进行探索和执行。在面对新任务时，模型会使用探索策略预测Z，然后将Z输入执行策略以完成任务。","最后，讲者提出了一个关键问题：是否可以训练执行策略以关注与任务相关的部分。这涉及到模型是否能够有效利用Z中的信息进行任务执行。","整个段落强调了信息瓶颈在强化学习中的重要性，特别是在任务表示学习和探索策略设计中的作用。"],"formulas":[],"uncertainties":["Z should be an I"],"diagram":"none","start":3286.83,"end":3462.64,"asr_flags":[],"math_clarifications":["原文中提到的KL散度和ELBO的公式未明确其分布形式，无法核定其数学正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3286.83,"text":"So these are the two things that have parameters, f and pi. And we're going to train both of these neural networks to maximize reward so that we're actually learning a representation such that we can solve the task and predict actions that maximize reward. And then we're also going to add the regularization on z. And so our objective here will be maximizing the sum"},{"start":3314.92,"text":"of expected rewards under our execution policy. And since we're maximizing here, we're also going to be minimizing this term right here, which is the equivalent to the KL divergence. So we'll be maximizing the negative KL divergence between f z i given mu i."},{"start":3348.77,"text":"and this unit Gaussian. So on the slides, there's the objective. And this is just trying to solve the task and also learn latent task representation based off of the task ID. It's going to be a vector. So Z is going to be a vector. And so this should be an I. But yeah, it'll be a vector. And you, yeah."},{"start":3377.83,"text":"Yeah, so the question is, why are we adding this information bottleneck or this KL divergence? The reason is that we want to learn a nice task representation that's throwing away information. And if we don't add that term, then this Z right here, this representation of the task, might still contain a lot of information that are irrelevant for actually solving the task. And so it might contain... Like if, for example, you have..."},{"start":3407.06,"text":"two tasks that have the ingredients in the same exact place, but something has changed about the environment, like the wall color is different or different objects are in different places, but those are irrelevant to solving the task, then Z will include those things that are irrelevant. And then when you go to explore, you're then going to be exploring things that are irrelevant to the task. Yeah, so the question is, we are given the task ID during training. We actually don't need it at test time."},{"start":3434.68,"text":"So what does this look like to generalize to new tasks?"},{"start":3438.98,"text":"When you are faced with a new task,"},{"start":3441.5,"text":"you're going to use your exploration policy to explore"},{"start":3443.6,"text":"and then predict a..."},{"start":3447.02,"text":"Instead of predicting UI, you're actually going to be predicting ZI,"},{"start":3449.44,"text":"your latent task representation,"},{"start":3450.88,"text":"and then feeding that into your execution policy"},{"start":3454.66,"text":"to then execute or exploit on the task."},{"start":3458.08,"text":"The question is, can you train the execution policy"},{"start":3460.74,"text":"to attend to the relevant parts?"}],"speech_gaps":[],"frame":"../frames/v024/020.webp","frame_time":3298.83},{"title":"探索机制（Exploration）","segments":[{"id":271,"text":"So if you have a really good task representation that doesn't have irrelevant things in it,","start":3462.64,"end":3473.8},{"id":272,"text":"then you can skip this step and basically zero out those parts of the task representation.","start":3473.88,"end":3480.78},{"id":273,"text":"This would be in scenarios where you don't have a one-hot vector, but you already know.","start":3481.38,"end":3484.24},{"id":274,"text":"You know, like maybe one task, maybe if you have like language strings, for example, and one task is turn left, one task is turn right, another task maybe is the same as turn left.","start":3484.24,"end":3501.3},{"id":275,"text":"It's like you have the task string for it.","start":3501.52,"end":3504.04},{"id":276,"text":"It's basically the same exact task.","start":3504.06,"end":3505.1},{"id":277,"text":"Another task is to like move forward.","start":3505.16,"end":3507.36},{"id":278,"text":"if these are your different tasks","start":3508.68,"end":3510.42},{"id":279,"text":"you can get away with","start":3510.42,"end":3511.92},{"id":280,"text":"this is probably already a very compact","start":3511.92,"end":3514.26},{"id":281,"text":"representation because it's telling you","start":3514.26,"end":3515.8},{"id":282,"text":"are you turning? Are you moving?","start":3515.8,"end":3517.96},{"id":283,"text":"And so it's","start":3518.68,"end":3520.32},{"id":284,"text":"already telling you about the relationship between different","start":3520.32,"end":3522.46},{"id":285,"text":"tasks and so if your task","start":3522.46,"end":3524.54},{"id":286,"text":"representation is telling you about those relationships","start":3524.54,"end":3526.3},{"id":287,"text":"then or for example","start":3526.3,"end":3528.62},{"id":288,"text":"if you had a task representation","start":3528.62,"end":3530.2},{"id":289,"text":"that's like the coordinates","start":3530.2,"end":3532.52},{"id":290,"text":"of where you're trying to go","start":3532.52,"end":3533.72},{"id":291,"text":"then you're going to have a task ID that's very","start":3533.72,"end":3536.34},{"id":292,"text":"very similar between these two tasks,","start":3536.34,"end":3537.84},{"id":293,"text":"and that will already be quite compressed.","start":3538.04,"end":3539.5},{"id":294,"text":"In those cases, you can skip this step because those representations will already exclude irrelevant information.","start":3540.35,"end":3547.43},{"id":295,"text":"But then if you instead have a task ID that's one-hot or that isn't very informative, then you need to compress that out.","start":3547.93,"end":3554.91},{"id":296,"text":"And otherwise, this is one of the better mathematical frameworks for encouraging it to attend to the relevant parts.","start":3555.77,"end":3563.61},{"id":297,"text":"Yeah. I guess in principle, if you had a way to change the way that this is making decisions","start":3563.61,"end":3571.27},{"id":298,"text":"based on UI, you might also be able to do that. Yeah. So what's the advantage of outputting a","start":3571.27,"end":3576.33},{"id":299,"text":"distribution? So the distribution here is what allows us to compress. And so by adding noise or","start":3576.33,"end":3583.99},{"id":300,"text":"by making this a stochastic neural network, we're able to remove information from it. Whereas","start":3583.99,"end":3591.41},{"id":301,"text":"Whereas if you're passing a continuous vector through,","start":3591.41,"end":3596.03},{"id":302,"text":"there are heuristic ways to try to compress, for example,","start":3598.35,"end":3602.13},{"id":303,"text":"by compressing the dimensionality.","start":3602.13,"end":3603.65},{"id":304,"text":"But you can still pass infinite information","start":3605.01,"end":3608.41},{"id":305,"text":"through even a one-dimensional continuous variable.","start":3608.95,"end":3611.27},{"id":306,"text":"And so this is one way that can, even in theory,","start":3611.75,"end":3617.91},{"id":307,"text":"reduce information.","start":3618.05,"end":3618.85},{"id":308,"text":"So, now let's talk about exploration. So, our goal in exploration is to be able to try","start":3620.07,"end":3625.63},{"id":309,"text":"to predict Z. And we will... I don't know what notation I used. So, our goal is to try","start":3625.63,"end":3636.83}],"notes":["本段讨论了任务表示的紧凑性与探索机制的关系。如果任务表示已经排除了无关信息，那么可以跳过某些步骤，因为这些表示已经足够紧凑。例如，如果任务是语言字符串，如'左转'、'右转'或'前进'，那么这些字符串已经包含了任务之间的关系，因此不需要额外的压缩。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3462.64,"end":3636.83,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3462.64,"text":"So if you have a really good task representation that doesn't have irrelevant things in it,"},{"start":3473.88,"text":"then you can skip this step and basically zero out those parts of the task representation."},{"start":3481.38,"text":"This would be in scenarios where you don't have a one-hot vector, but you already know."},{"start":3484.24,"text":"You know, like maybe one task, maybe if you have like language strings, for example, and one task is turn left, one task is turn right, another task maybe is the same as turn left."},{"start":3501.52,"text":"It's like you have the task string for it."},{"start":3504.06,"text":"It's basically the same exact task."},{"start":3505.16,"text":"Another task is to like move forward."},{"start":3508.68,"text":"if these are your different tasks"},{"start":3510.42,"text":"you can get away with"},{"start":3511.92,"text":"this is probably already a very compact"},{"start":3514.26,"text":"representation because it's telling you"},{"start":3515.8,"text":"are you turning? Are you moving?"},{"start":3518.68,"text":"And so it's"},{"start":3520.32,"text":"already telling you about the relationship between different"},{"start":3522.46,"text":"tasks and so if your task"},{"start":3524.54,"text":"representation is telling you about those relationships"},{"start":3526.3,"text":"then or for example"},{"start":3528.62,"text":"if you had a task representation"},{"start":3530.2,"text":"that's like the coordinates"},{"start":3532.52,"text":"of where you're trying to go"},{"start":3533.72,"text":"then you're going to have a task ID that's very"},{"start":3536.34,"text":"very similar between these two tasks,"},{"start":3538.04,"text":"and that will already be quite compressed."},{"start":3540.35,"text":"In those cases, you can skip this step because those representations will already exclude irrelevant information."},{"start":3547.93,"text":"But then if you instead have a task ID that's one-hot or that isn't very informative, then you need to compress that out."},{"start":3555.77,"text":"And otherwise, this is one of the better mathematical frameworks for encouraging it to attend to the relevant parts."},{"start":3563.61,"text":"Yeah. I guess in principle, if you had a way to change the way that this is making decisions"},{"start":3571.27,"text":"based on UI, you might also be able to do that. Yeah. So what's the advantage of outputting a"},{"start":3576.33,"text":"distribution? So the distribution here is what allows us to compress. And so by adding noise or"},{"start":3583.99,"text":"by making this a stochastic neural network, we're able to remove information from it. Whereas"},{"start":3591.41,"text":"Whereas if you're passing a continuous vector through,"},{"start":3598.35,"text":"there are heuristic ways to try to compress, for example,"},{"start":3602.13,"text":"by compressing the dimensionality."},{"start":3605.01,"text":"But you can still pass infinite information"},{"start":3608.95,"text":"through even a one-dimensional continuous variable."},{"start":3611.75,"text":"And so this is one way that can, even in theory,"},{"start":3618.05,"text":"reduce information."},{"start":3620.07,"text":"So, now let's talk about exploration. So, our goal in exploration is to be able to try"},{"start":3625.63,"text":"to predict Z. And we will... I don't know what notation I used. So, our goal is to try"}],"speech_gaps":[{"start":3596.43,"end":3597.95}],"frame":"../frames/v024/021.webp","frame_time":3474.64},{"title":"探索机制中的奖励函数设计","segments":[{"id":310,"text":"to be able to collect data that's predictive of Z. In practice, by the way, you can train","start":3636.83,"end":3644.33},{"id":311,"text":"both of these policies at the same time.","start":3644.33,"end":3646.43},{"id":312,"text":"And we need to think about how we would formulate","start":3649.49,"end":3651.55},{"id":313,"text":"a reward function that encourages it","start":3651.55,"end":3654.37},{"id":314,"text":"to be predictive of Z.","start":3654.37,"end":3657.11},{"id":315,"text":"I don't know if...","start":3660.41,"end":3661.83},{"id":316,"text":"I'll just pick some notation.","start":3662.53,"end":3663.61},{"id":317,"text":"So say that we have...","start":3663.83,"end":3665.31},{"id":318,"text":"We're going to be learning some model","start":3666.19,"end":3667.89},{"id":319,"text":"that's trying to be able to predict Z","start":3669.37,"end":3671.11},{"id":320,"text":"from the data that we have collected.","start":3671.11,"end":3674.13},{"id":321,"text":"and if we have some exploration policy","start":3675.05,"end":3677.01},{"id":322,"text":"that's been exploring","start":3677.01,"end":3678.31},{"id":323,"text":"then we need to figure out","start":3678.31,"end":3680.73},{"id":324,"text":"how to reward","start":3680.73,"end":3682.89},{"id":325,"text":"it accordingly","start":3682.89,"end":3683.91},{"id":326,"text":"and one thing that you could do is you could collect some data","start":3684.57,"end":3686.95},{"id":327,"text":"and then at the end","start":3686.95,"end":3688.99},{"id":328,"text":"of a trajectory for example see how","start":3688.99,"end":3690.83},{"id":329,"text":"well you can predict z and then","start":3690.83,"end":3692.93},{"id":330,"text":"have the reward be","start":3692.93,"end":3694.17},{"id":331,"text":"have the reward be the negative prediction error for z","start":3694.17,"end":3696.81},{"id":332,"text":"and then zero","start":3697.79,"end":3698.71},{"id":333,"text":"everywhere else","start":3698.71,"end":3699.51},{"id":334,"text":"We'd only have it at the end of the trajectory.","start":3700.39,"end":3702.69},{"id":335,"text":"We'd only have it at the end of the trajectory.","start":3703.27,"end":3705.71},{"id":336,"text":"We could actually incrementally at each time step","start":3706.63,"end":3710.21},{"id":337,"text":"look at how much information we're gaining about.","start":3710.21,"end":3712.61},{"id":338,"text":"And that's going to give us a more dense reward. And so specifically, when we're trying to train our exploration policy by exploration, you can think about the reward for STAT. We could have it be the negative prediction error at time step T.","start":3713.65,"end":3742.25},{"id":339,"text":"And that would be something that's like fairly reasonable. But the action, like this particular timestep, we're only, at this timestep, we're actually gaining just like one timestep worth of information. And if we wanted to quantify that information, we could actually look at what was our prediction error at the previous timestep.","start":3742.91,"end":3763.8},{"id":340,"text":"and look at the relative difference in the error at the previous time step versus the error at the current time step. That's how much information we gained from taking this action. So we could define the reward to be the prediction error at t minus one minus the prediction error at time t. This is something that should be decreasing over time.","start":3764.47,"end":3791.58}],"notes":["本段讨论了在强化学习中设计探索机制时，如何通过奖励函数来鼓励模型预测Z。讲者提到，可以通过收集数据并计算预测误差来设计奖励函数，例如在轨迹结束时使用负预测误差作为奖励，但这种方法会导致奖励稀疏。因此，讲者建议在每个时间步计算信息增益，以获得更密集的奖励。","讲者进一步解释了如何在每个时间步计算信息增益，即通过比较前一时间步和当前时间步的预测误差。这种设计使得奖励函数能够更有效地引导探索策略，从而提高模型对Z的预测能力。","讲者提到，奖励函数的设计需要考虑时间步的连续性，即在每个时间步计算信息增益，而不是仅在轨迹结束时进行一次评估。这种方法可以更细致地调整探索策略，使其在不同时间点都能获得适当的反馈。","讲者还指出，预测误差的相对变化可以作为奖励的依据，即当前时间步的预测误差减去前一时间步的预测误差。这种设计使得奖励函数能够反映探索动作带来的信息增益，从而更有效地引导模型学习。","讲者强调，奖励函数的设计需要平衡稀疏性和密度，以确保探索策略能够有效学习。通过在每个时间步计算信息增益，可以实现更密集的奖励，从而提高模型的预测能力和探索效率。","最后，讲者指出，这种奖励函数的设计应该随着时间推移而逐渐减少，以反映模型对Z的预测能力的提升。这种设计有助于模型在探索过程中逐步优化其预测性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3636.83,"end":3791.58,"asr_flags":[],"math_clarifications":["原文未提供预测误差的数学定义，因此无法核定奖励函数的具体形式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3636.83,"text":"to be able to collect data that's predictive of Z. In practice, by the way, you can train"},{"start":3644.33,"text":"both of these policies at the same time."},{"start":3649.49,"text":"And we need to think about how we would formulate"},{"start":3651.55,"text":"a reward function that encourages it"},{"start":3654.37,"text":"to be predictive of Z."},{"start":3660.41,"text":"I don't know if..."},{"start":3662.53,"text":"I'll just pick some notation."},{"start":3663.83,"text":"So say that we have..."},{"start":3666.19,"text":"We're going to be learning some model"},{"start":3669.37,"text":"that's trying to be able to predict Z"},{"start":3671.11,"text":"from the data that we have collected."},{"start":3675.05,"text":"and if we have some exploration policy"},{"start":3677.01,"text":"that's been exploring"},{"start":3678.31,"text":"then we need to figure out"},{"start":3680.73,"text":"how to reward"},{"start":3682.89,"text":"it accordingly"},{"start":3684.57,"text":"and one thing that you could do is you could collect some data"},{"start":3686.95,"text":"and then at the end"},{"start":3688.99,"text":"of a trajectory for example see how"},{"start":3690.83,"text":"well you can predict z and then"},{"start":3692.93,"text":"have the reward be"},{"start":3694.17,"text":"the negative prediction error for z"},{"start":3697.79,"text":"and then zero"},{"start":3698.71,"text":"everywhere else"},{"start":3700.39,"text":"but if we did that we'd have a very sparse reward"},{"start":3703.27,"text":"We'd only have it at the end of the trajectory."},{"start":3706.63,"text":"And what we can do is we could actually incrementally at each time step"},{"start":3710.21,"text":"look at how much information we're gaining about."},{"start":3713.65,"text":"And that's going to give us a more dense reward. And so specifically, when we're trying to train our exploration policy by exploration, you can think about the reward for STAT. We could have it be the negative prediction error at time step T."},{"start":3742.91,"text":"And that would be something that's like fairly reasonable. But the action, like this particular timestep, we're only, at this timestep, we're actually gaining just like one timestep worth of information. And if we wanted to quantify that information, we could actually look at what was our prediction error at the previous timestep."},{"start":3764.47,"text":"and look at the relative difference in the error at the previous time step versus the error at the current time step. That's how much information we gained from taking this action. So we could define the reward to be the prediction error at t minus one minus the prediction error at time t. This is something that should be decreasing over time."}],"speech_gaps":[{"start":3647.312,"end":3649.008},{"start":3658.416,"end":3660.01}],"frame":"../frames/v024/022.webp","frame_time":3648.83},{"title":"探索机制（Exploration）","segments":[{"id":341,"text":"And this is basically how much, how better are we at predicting zi at the current timestep relative to the previous timestep. Where prediction error is something like, is like z hat minus the true zi. And so we're training this model.","start":3792.99,"end":3820.87},{"id":342,"text":"We want this to be kind of per step information gain. And so if we look at all of the states up until the current time step versus all the time steps up to the previous time step, we can measure this notion of information gain. I guess maybe also to make this a little bit more clear, if this is prediction error at time t, then this means that z hat is the estimate from","start":3821.58,"end":3850.2},{"id":343,"text":"Predicting z from the data up until time t.","start":3852.81,"end":3860.93},{"id":344,"text":"So everything in the trajectory up until time t.","start":3861.11,"end":3864.09},{"id":345,"text":"Cool.","start":3866.01,"end":3866.59},{"id":346,"text":"So this has, like many research algorithms, this has a somewhat mangled forced acronym.","start":3867.77,"end":3873.33},{"id":347,"text":"So decoupled reward-free exploration and execution in meta-RL or DREAM.","start":3874.47,"end":3877.57},{"id":348,"text":"And you'll be implementing this algorithm in homework 4.","start":3877.87,"end":3881.29},{"id":349,"text":"So we talked before about how if you train end-to-end,","start":3884.91,"end":3889.91},{"id":350,"text":"you train meta-RL methods end-to-end,","start":3890.65,"end":3892.65},{"id":351,"text":"and you're trying to optimize for both exploration and execution,","start":3892.77,"end":3895.35},{"id":352,"text":"you have this coupling problem,","start":3895.57,"end":3896.51},{"id":353,"text":"and the benefit is that you can get optimal exploration,","start":3896.85,"end":3902.69},{"id":354,"text":"and the downside is that you're very inefficient.","start":3902.89,"end":3905.99},{"id":355,"text":"You can show that this algorithm under","start":3906.91,"end":3909.55},{"id":356,"text":"fairly mild assumptions will actually","start":3909.55,"end":3912.19},{"id":357,"text":"recover optimal exploration and exploitation. And then if you look at the efficiency, which is","start":3912.19,"end":3919.55},{"id":358,"text":"where end-to-end optimization struggled, you can think about it, you can construct a simple bandit","start":3919.55,"end":3925.27},{"id":359,"text":"problem where, a bandit-like problem, where you have these different arms and arm zero, instead","start":3925.27,"end":3934.75},{"id":360,"text":"instead of being a typical action,","start":3934.75,"end":3936.55},{"id":361,"text":"it's going to tell you what is the optimal action.","start":3936.79,"end":3939.83},{"id":362,"text":"And so if you, for example, learn","start":3940.89,"end":3943.23},{"id":363,"text":"the strategy of taking action zero","start":3943.23,"end":3945.21},{"id":364,"text":"and then taking the optimal action,","start":3945.21,"end":3947.29},{"id":365,"text":"then that's like optimally exploring and then exploiting.","start":3947.63,"end":3951.71},{"id":366,"text":"And in end-to-end optimization, you","start":3956.01,"end":3958.53},{"id":367,"text":"can actually quantify how many samples it","start":3958.53,"end":3960.93},{"id":368,"text":"needs for the meta-learning process.","start":3960.93,"end":3962.93},{"id":369,"text":"you get something like a squared log a, where a is the number of arms, or the number of actions,","start":3962.93,"end":3967.89}],"notes":["本段讨论了探索机制中的信息增益概念，即在每个时间步中，模型预测与真实值之间的误差如何反映信息增益。通过比较当前时间步和前一个时间步的所有状态，可以衡量这种信息增益。此外，还提到预测误差的计算方式为预测值与真实值的差值，即z hat 减去真实的zi。","讲者提到，许多研究算法都有人为构造的缩写，例如DREAM，它代表解耦的无奖励探索与执行机制。这种算法将在作业4中实现，强调了其在强化学习中的重要性。","在讨论端到端训练时，讲者指出，同时优化探索和执行会导致耦合问题，即探索和执行之间相互影响。虽然这种耦合可以带来最优的探索效果，但效率较低。","讲者进一步说明，该算法在某些温和假设下可以恢复最优的探索和利用策略。在效率方面，端到端优化在某些情况下表现不佳，因此可以构造一个类似于多臂老虎机的问题来分析。","在多臂老虎机问题中，臂0不是普通动作，而是直接告诉学习者最优动作。通过学习采取动作0然后采取最优动作，可以实现最优的探索和利用策略。","最后，讲者提到在端到端优化中，可以量化元学习过程中所需的样本数量，得到一个与动作数量相关的复杂度，如平方对数形式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3792.99,"end":3967.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3792.99,"text":"And this is basically how much, how better are we at predicting zi at the current timestep relative to the previous timestep. Where prediction error is something like, is like z hat minus the true zi. And so we're training this model."},{"start":3821.58,"text":"We want this to be kind of per step information gain. And so if we look at all of the states up until the current time step versus all the time steps up to the previous time step, we can measure this notion of information gain. I guess maybe also to make this a little bit more clear, if this is prediction error at time t, then this means that z hat is the estimate from"},{"start":3852.81,"text":"Predicting z from the data up until time t."},{"start":3861.11,"text":"So everything in the trajectory up until time t."},{"start":3866.01,"text":"Cool."},{"start":3867.77,"text":"So this has, like many research algorithms, this has a somewhat mangled forced acronym."},{"start":3874.47,"text":"So decoupled reward-free exploration and execution in meta-RL or DREAM."},{"start":3877.87,"text":"And you'll be implementing this algorithm in homework 4."},{"start":3884.91,"text":"So we talked before about how if you train end-to-end,"},{"start":3890.65,"text":"you train meta-RL methods end-to-end,"},{"start":3892.77,"text":"and you're trying to optimize for both exploration and execution,"},{"start":3895.57,"text":"you have this coupling problem,"},{"start":3896.85,"text":"and the benefit is that you can get optimal exploration,"},{"start":3902.89,"text":"and the downside is that you're very inefficient."},{"start":3906.91,"text":"You can show that this algorithm under"},{"start":3909.55,"text":"fairly mild assumptions will actually"},{"start":3912.19,"text":"recover optimal exploration and exploitation. And then if you look at the efficiency, which is"},{"start":3919.55,"text":"where end-to-end optimization struggled, you can think about it, you can construct a simple bandit"},{"start":3925.27,"text":"problem where, a bandit-like problem, where you have these different arms and arm zero, instead"},{"start":3934.75,"text":"instead of being a typical action,"},{"start":3936.79,"text":"it's going to tell you what is the optimal action."},{"start":3940.89,"text":"And so if you, for example, learn"},{"start":3943.23,"text":"the strategy of taking action zero"},{"start":3945.21,"text":"and then taking the optimal action,"},{"start":3947.63,"text":"then that's like optimally exploring and then exploiting."},{"start":3956.01,"text":"And in end-to-end optimization, you"},{"start":3958.53,"text":"can actually quantify how many samples it"},{"start":3960.93,"text":"needs for the meta-learning process."},{"start":3962.93,"text":"you get something like a squared log a, where a is the number of arms, or the number of actions,"}],"speech_gaps":[],"frame":"../frames/v024/023.webp","frame_time":3804.99},{"title":"探索机制（Exploration）的比较与策略","segments":[{"id":370,"text":"whereas the DREAM algorithm requires only a log a. There's some assumptions here in terms of like","start":3968.35,"end":3973.39},{"id":371,"text":"using Q-learning, using uniform exploration in kind of the outer loop of the algorithm,","start":3973.39,"end":3980.11},{"id":372,"text":"and you can look at basically the kind of the efficiency, like how efficient is the algorithm?","start":3980.35,"end":3988.01},{"id":373,"text":"of them, you can see that Dream is able to reach the optimal behavior in many,","start":3988.01,"end":3994.27},{"id":374,"text":"many fewer samples than if you were to use end-to-end optimization,","start":3994.35,"end":3997.45},{"id":375,"text":"which is shown in orange as a function of the number of arms.","start":3997.89,"end":4001.99},{"id":376,"text":"So as the problem gets more and more complicated,","start":4002.43,"end":4005.25},{"id":377,"text":"Dream is able to do far,","start":4008.29,"end":4009.95},{"id":378,"text":"far better than end-to-end optimization.","start":4010.11,"end":4012.17},{"id":379,"text":"We can also empirically look at things.","start":4013.83,"end":4015.67},{"id":380,"text":"So here's an example of a meta-URL problem where different tasks correspond to going to different objects with different colors.","start":4015.67,"end":4024.19},{"id":381,"text":"And the color of the object is written on the wall.","start":4025.11,"end":4027.91},{"id":382,"text":"And the agent starts over here, and it needs to walk around the wall, read the color, and then go to the correct object.","start":4028.55,"end":4036.67},{"id":383,"text":"So it's exploring or seeking information and then exploiting.","start":4036.85,"end":4040.83},{"id":384,"text":"gets pixel rewards. And if you compare end-to-end algorithms that are shown here, they really, really struggle to do this sort of end-to-end learning to explore problem.","start":4041.48,"end":4053.5},{"id":385,"text":"If you use one of the alternative strategies that we talked about on Wednesday, you can do better in theory, but you still have a suboptimal exploration strategy. Whereas with this algorithm, you're able to actually learn how to explore, like go find the sign and then go to the correct object by trying to decouple exploration for identifying the task and exploitation of solving the task.","start":4054.42,"end":4082.66},{"id":386,"text":"Cool. And then you can actually see this. So here's a video of the exploration episode where it's walking around and going to read the sign on the wall in this simple environment. And then after it reads the sign, it's able to go to the blue key.","start":4083.92,"end":4100.22},{"id":387,"text":"Yeah, that's a great question. So the question is, this is a setting where exploration and exploitation, you can kind of first explore and then exploit. You might also have tasks where you need to interleave exploration and exploitation, where you first need to find some information, then use that to accomplish a subtask, and then find some exploration again.","start":4101.85,"end":4119.71},{"id":388,"text":"We have done some work that tries to combine them and you can, for example, trade a single policy that uses the reward to identify the task combined with the task reward. And if you're interested, I can kind of point you to a relevant work there.","start":4121.5,"end":4134.32}],"notes":["本段讨论了DREAM算法与端到端优化方法在样本效率上的对比。DREAM算法仅需较少的样本即可达到最优行为，而端到端优化方法则需要更多样本。这表明DREAM在处理复杂问题时具有更高的效率。","讲者提到DREAM算法在问题复杂度增加时表现更优，说明该算法在处理复杂任务时具有更强的适应性。这可能是因为DREAM算法能够将探索和利用过程解耦，从而更有效地进行任务识别和执行。","讲者通过一个元URL问题的例子，说明了探索和利用的结合。在这个例子中，智能体需要先探索以获取信息，然后利用这些信息完成任务。这表明在某些任务中，探索和利用需要交替进行。","讲者提到使用替代策略（如周三讨论的策
