 And so the reward for this policy will be basically how well this model is at identifying the task, or basically the negative error of this task identifier model. Good question. The question is, does this generalize to new unseen task categories?"}],"notes":["本段讲解了探索机制与多任务学习的分离。课程中提到，可以将探索策略和利用策略视为两个独立的策略，分别用于探索和执行任务。探索策略的目标是收集经验以识别任务标识符，而执行策略则基于任务标识符来最大化奖励。","探索策略的目标是通过收集经验来识别任务标识符，而执行策略则基于任务标识符来执行任务。这种分离使得探索和执行的目标可以独立优化，从而提高整体性能。","课程中还提到，探索策略的目标是识别任务，而不是执行任务本身。因此，探索策略的奖励是基于任务标识符模型的准确性，而不是任务执行的性能。","在多任务强化学习中，探索策略和执行策略可以分别训练，探索策略的目标是收集数据以准确预测任务标识符，而执行策略的目标是最大化每个任务的奖励。","课程最后提出了一个问题，即这种探索机制是否能够泛化到新的未见过的任务类别。这表明探索策略的泛化能力是一个重要的考虑因素。","整个讲解强调了探索和执行目标的分离，以及如何通过任务标识符模型来实现这种分离。这种分离有助于提高多任务学习的效率和效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2431.35,"end":2591.34,"asr_flags":[],"raw_segments":[{"start":2431.35,"text":"And then what we could do is we could try to explore in a way that allows us to predict what the task is at hand. So, for example, we'll have our say that we have two policies, an exploration policy and exploitation policy. In practice, you could combine these, but."},{"start":2455.66,"text":"it's helpful to think about them as separate. So we'll have our exploration strategy, our exploration policy. This is going to produce some experience in a particular task. And our goal is for it to be able to explore, to be able to discern different tasks. And so we could separately train a model that's going to be predicting the task identifier from the experience that we've collected so far."},{"start":2485.81,"text":"And if we do something like this, then this sort of exploration objective is completely separate from actually executing on the task. The goal here is to be able to predict the task identifier. And then separate from this, we could train a policy that's trying to execute on the task just using the identifier for the task. And this is just multitask learning."},{"start":2515.95,"text":"or multitask reinforcement learning, and this we can train just with optimizing reward, and it doesn't rely on having good exploration. So here, we're able to decouple the objective for execution, so it doesn't rely on exploration, and have an exploration objective just based on identifying the task that isn't dependent on how well you do the task."},{"start":2541.17,"text":"So on the slides, we'll train a policy and a task identification model so that we collect data that allows for accurate task prediction. And then we'll also train a policy that's conditioned on the task ID in order to maximize reward for each task. So which part of this is the exploration? Is it the model that predicts the identifier?"},{"start":2564.4,"text":"So the expression is really this policy right here. And this model is actually just going to be used for the reward for this. And so the reward for this policy will be basically how well this model is at identifying the task, or basically the negative error of this task identifier model. Good question. The question is, does this generalize to new unseen task categories?"}],"speech_gaps":[],"frame":"../frames/v024/015.webp","frame_time":2443.35},{"title":"探索机制中的任务识别与泛化","segments":[{"id":188,"text":"can actually struggle with generalization. And we'll talk about that. Let's go through metatesting, and then we'll talk about that. So this is roughly how training works. And then at test time, if you've trained all of these different things, then you can take your exploration policy, run it to collect experience, then feed that experience into your task identifier model to get a task ID, and then..."},{"id":189,"text":"take that task ID and feed that as input to your execution policy to then execute the task. So you'll then explore and then identify the task and then exploit. Now, getting back to that question, the upside of this is you don't need to model dynamics or rewards. You're just learning this model that's predicting the task identifier."},{"id":190,"text":"But if the task identifier is just a one-hot vector, for example, this probably isn't going to generalize to new tasks very well. And we'll see a solution to that on the next slide. The question is, what is the main difference from black box meta-URL that we talked about before? So we are still sampling different MDPs. The main difference is simply the objective for the exploration part."},{"id":191,"text":"Well, I guess there's two main differences. One is the objective for the exploration part, and then the second is that here we're going to be maximizing rewards similar to black box meta-URL, but we're actually going to be giving it this task identifier so that it doesn't need to rely on exploration or a good exploration strategy when trying to learn how to do the task. Now, we have this generalization problem, and we actually also have a way to address this."},{"id":192,"text":"Instead of using this task identifier directly, we can actually try to learn a more compressed representation of the task that will generalize more effectively than like a one-hot vector. So as an example, when we learn the execution policy, we're also going to identify information that's needed for solving the task."},{"id":193,"text":"And so say that our identifier consists of a few things that are relevant and a few things that are not relevant. So it contains things like wall color and decorations, but then it also contains information about where the ingredients are. Then we'd like to use, and similar if you had a one-hot vector, it would also contain information that might be irrelevant because you might have two kitchens that have ingredients in the same place, but then have other things that are spurious."},{"id":194,"text":"We'll try to then bottleneck this representation to compress away the stuff that's not needed for solving the task. If we can do this, then this sort of representation should generalize better. Then when we learn to explore, instead of learning to explore to be able to predict the identifier here, we'll learn to explore so that we can recover this compressed task representation."}],"notes":["本段讨论了任务识别模型在泛化能力上的局限性，特别是当任务标识符是one-hot向量时，模型可能无法有效泛化到新任务。课程指出，这种表示方式包含了一些无关信息，例如墙壁颜色和装饰，这些信息可能对任务解决没有帮助，甚至可能引入噪声。","为了解决这一问题，课程提出了一种压缩表示的方法，即通过瓶颈机制（bottleneck）去除不必要的信息，从而提升泛化能力。这种压缩表示能够更有效地捕捉任务的关键特征，例如食材的位置。","在探索策略的学习过程中，模型不再直接学习预测任务标识符，而是学习如何恢复这种压缩后的任务表示。这使得探索策略能够更专注于任务相关的信息，而不是无关的细节。","这种压缩表示的泛化能力依赖于任务的结构和特征，因此在实际应用中需要根据具体任务进行调整。课程强调，压缩表示的训练过程需要平衡信息保留和冗余去除。","课程还提到，这种任务识别和压缩表示的方法与传统的黑盒元学习（black box meta-URL）有所不同，主要体现在探索目标的设定上。传统的元学习方法可能更依赖于探索策略本身，而这里则通过任务标识符来引导探索。","最后，课程指出，这种压缩表示的泛化能力在实际应用中可能受到多种因素的影响，例如任务的复杂性、数据的多样性以及模型的训练策略。因此，需要进一步研究和实验来验证其有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2593.01,"end":2767.37,"asr_flags":[],"raw_segments":[{"start":2593.01,"text":"can actually struggle with generalization. And we'll talk about that. Let's go through metatesting, and then we'll talk about that. So this is roughly how training works. And then at test time, if you've trained all of these different things, then you can take your exploration policy, run it to collect experience, then feed that experience into your task identifier model to get a task ID, and then..."},{"start":2617.43,"text":"take that task ID and feed that as input to your execution policy to then execute the task. So you'll then explore and then identify the task and then exploit. Now, getting back to that question, the upside of this is you don't need to model dynamics or rewards. You're just learning this model that's predicting the task identifier."},{"start":2640.98,"text":"But if the task identifier is just a one-hot vector, for example, this probably isn't going to generalize to new tasks very well. And we'll see a solution to that on the next slide. The question is, what is the main difference from black box meta-URL that we talked about before? So we are still sampling different MDPs. The main difference is simply the objective for the exploration part."},{"start":2670.09,"text":"Well, I guess there's two main differences. One is the objective for the exploration part, and then the second is that here we're going to be maximizing rewards similar to black box meta-URL, but we're actually going to be giving it this task identifier so that it doesn't need to rely on exploration or a good exploration strategy when trying to learn how to do the task. Now, we have this generalization problem, and we actually also have a way to address this."},{"start":2696.66,"text":"Instead of using this task identifier directly, we can actually try to learn a more compressed representation of the task that will generalize more effectively than like a one-hot vector. So as an example, when we learn the execution policy, we're also going to identify information that's needed for solving the task."},{"start":2717.26,"text":"And so say that our identifier consists of a few things that are relevant and a few things that are not relevant. So it contains things like wall color and decorations, but then it also contains information about where the ingredients are. Then we'd like to use, and similar if you had a one-hot vector, it would also contain information that might be irrelevant because you might have two kitchens that have ingredients in the same place, but then have other things that are spurious."},{"start":2741.03,"text":"We'll try to then bottleneck this representation to compress away the stuff that's not needed for solving the task. If we can do this, then this sort of representation should generalize better. Then when we learn to explore, instead of learning to explore to be able to predict the identifier here, we'll learn to explore so that we can recover this compressed task representation."}],"speech_gaps":[],"frame":"../frames/v024/016.webp","frame_time":2605.01},{"title":"探索机制中的表示压缩","segments":[{"id":195,"text":"And so try to be able to explore so that you're able to predict what this Z representation for the task is. Now, how do you actually compress representations in neural networks? So before we go into the details of this algorithm, let's talk about that a little bit. So we have our task identifier mu, mu i. And then we'd like to..."},{"id":196,"text":"have a neural network that uses that to predict ZI. And then we'll then have a policy that takes this and the state and outputs the action. And if we train this whole thing end-to-end, it's not necessarily incentivized to actually compress information here, to actually remove information about decorations, for example."},{"id":197,"text":"So one thing we could do is we could simply add noise to this representation. And so if you take this and instead of feeding it directly here, you could take this output zi, and then right here you could basically add some noise. So right here what you're doing is you're..."},{"id":198,"text":"adding some noise where the noise is kind of sampled from a Gaussian distribution."},{"id":199,"text":"And if you add noise, then this is going to discard information"},{"id":200,"text":"because you're kind of corrupting the signal."},{"id":201,"text":"But you might discard some good information,"},{"id":202,"text":"especially if you do this only at test time."},{"id":203,"text":"Now, in principle, you could also train with this noise"},{"id":204,"text":"to encourage it to discard information from Z."},{"id":205,"text":"But if you train the policy with this noise as input,"},{"id":206,"text":"then what it could just do is it could just increase"},{"id":207,"text":"the magnitude of zi here so that"},{"id":208,"text":"the magnitude of the noise is a lot smaller in comparison."},{"id":209,"text":"So if you just add noise,"},{"id":210,"text":"the model can compensate and still pass on a lot of"},{"id":211,"text":"information through this task representation."},{"id":212,"text":"That's not a great solution."},{"id":213,"text":"But what we can do is we can just also"},{"id":214,"text":"prevent the model from increasing the magnitude. We can just add a loss that we can modify our"},{"id":215,"text":"training loss for the policy to include a term that's going to minimize the magnitude of z."},{"id":216,"text":"And if you do this, now if it blows up the magnitude of z, then it will have a high loss"}],"notes":["本段讨论了在强化学习中如何通过添加噪声来实现表示压缩，以鼓励模型忽略不重要的信息。讲者指出，直接添加噪声可能会导致模型补偿噪声，从而保留大量信息，这不是一个有效的解决方案。","讲者提到，如果在训练过程中引入噪声，模型可能会通过增加表示的幅度来抵消噪声的影响，从而使得噪声相对较小。这种机制虽然可以工作，但并不是理想的压缩方法。","为了防止模型增加表示的幅度，可以修改训练损失函数，加入一个最小化表示幅度的项。这样，如果模型试图放大表示的幅度，就会导致高损失，从而抑制这种行为。","讲者强调，这种机制是探索机制的一部分，旨在通过压缩表示来提高模型对任务相关特征的聚焦能力，而不是保留所有细节。","讲者指出，添加噪声是一种常见的方法，但需要结合额外的约束条件，如损失函数的修改，才能有效实现信息压缩。","讲者还提到，如果仅在测试时添加噪声，可能会导致模型丢弃一些有用的信息，因此需要在训练过程中也引入噪声以确保模型能够正确学习如何压缩表示。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2768.34,"end":2944.34,"asr_flags":[],"raw_segments":[{"start":2768.34,"text":"And so try to be able to explore so that you're able to predict what this Z representation for the task is. Now, how do you actually compress representations in neural networks? So before we go into the details of this algorithm, let's talk about that a little bit. So we have our task identifier mu, mu i. And then we'd like to..."},{"start":2801.9,"text":"have a neural network that uses that to predict ZI. And then we'll then have a policy that takes this and the state and outputs the action. And if we train this whole thing end-to-end, it's not necessarily incentivized to actually compress information here, to actually remove information about decorations, for example."},{"start":2833.12,"text":"So one thing we could do is we could simply add noise to this representation. And so if you take this and instead of feeding it directly here, you could take this output zi, and then right here you could basically add some noise. So right here what you're doing is you're..."},{"start":2858.04,"text":"adding some noise where the noise is kind of sampled from a Gaussian distribution."},{"start":2864.8,"text":"And if you add noise, then this is going to discard information"},{"start":2868.58,"text":"because you're kind of corrupting the signal."},{"start":2874.28,"text":"But you might discard some good information,"},{"start":2878.4,"text":"especially if you do this only at test time."},{"start":2881.36,"text":"Now, in principle, you could also train with this noise"},{"start":2883.7,"text":"to encourage it to discard information from Z."},{"start":2888.42,"text":"But if you train the policy with this noise as input,"},{"start":2892.44,"text":"then what it could just do is it could just increase"},{"start":2896.12,"text":"the magnitude of zi here so that"},{"start":2898.34,"text":"the magnitude of the noise is a lot smaller in comparison."},{"start":2902.38,"text":"So if you just add noise,"},{"start":2903.84,"text":"the model can compensate and still pass on a lot of"},{"start":2906.08,"text":"information through this task representation."},{"start":2911.2,"text":"That's not a great solution."},{"start":2915.68,"text":"But what we can do is we can just also"},{"start":2917.62,"text":"prevent the model from increasing the magnitude. We can just add a loss that we can modify our"},{"start":2925.92,"text":"training loss for the policy to include a term that's going to minimize the magnitude of z."},{"start":2935.6,"text":"And if you do this, now if it blows up the magnitude of z, then it will have a high loss"}],"speech_gaps":[{"start":2913.392,"end":2915.28}],"frame":"../frames/v024/017.webp","frame_time":2780.34}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
