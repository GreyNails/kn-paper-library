<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯坦福CS230：对抗鲁棒性和生成模型</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：对抗鲁棒性和生成模型 · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none"></video><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v058","title":"斯坦福CS230：对抗鲁棒性和生成模型","course":"深度学习","pages":[{"title":"对抗鲁棒性与生成模型","segments":[{"id":0,"text":"Welcome to CS230 lecture 4. Thank you for coming in person or joining online. Today's lecture is one of my favorites. It's a fun one. There's a lot of visuals that we look at and we cover a lot of modern methods as well. A lot of the content is brand new."},{"id":1,"text":"The focus areas for us today is going to be two topics, adversarial robustness and generative modeling. Adversarial robustness is an important topic today because there are more and more."},{"id":2,"text":"AI models in the wild. You're using dozens of them on a daily basis. And the more algorithms are being used, the more they're prone to attacks. And the more we have to be careful and build defenses proactively, which is what makes this research field of adversarial attacks and defenses very prolific. The other topic we cover is generative models, which"},{"id":3,"text":"as you may have seen in the news, is really, really hot right now. You have video generation now becoming a reality, image generation, which you're all already used to. And of course, text generation, code generation, which we all use regularly. There's a lot of heat in that space. And so we're going to try to break down what are the types of algorithms that power"},{"id":4,"text":"products like Sora or Veo and so on. Are you excited for this? So let's keep it interactive as always. We'll start with adversarial robustness. It should probably take us..."},{"id":5,"text":"30 to 45 minutes. And then we keep the latter part focused on generative models with a focus on GANs, generative adversarial networks. Even if it's called adversarial, it is not really connected to adversarial attacks. It's a different problem. And then diffusion models, which are, I would say, the most popular type or family of algorithm for today's image and video generation products."},{"id":6,"text":"So let's start with adversarial robustness with an open question for you all. Can you tell me examples of attacks on AI models? Are you worried about anything when you use AI? Yes. Prompt injection. Prompt injection. What is that? Like, you, like, sneak set bits into, like, a prompt, like a copy-paste that doesn't make blushes on there."}],"notes":["本段介绍了课程的两个主要主题：对抗鲁棒性和生成模型。对抗鲁棒性是当前研究领域的重要方向，因为AI模型在实际应用中越来越容易受到攻击，因此需要主动构建防御机制。生成模型则是一个热门领域，涉及视频、图像、文本和代码生成等应用。","对抗鲁棒性与生成模型是两个独立的主题，尽管名称中都包含“adversarial”，但它们的研究目标和方法完全不同。对抗鲁棒性关注的是如何使模型对攻击具有鲁棒性，而生成模型则关注如何生成高质量的数据。","生成模型中提到的GANs（生成对抗网络）和扩散模型是当前图像和视频生成产品的主流技术。GANs通过生成器和判别器的对抗过程来生成数据，而扩散模型则通过逐步去噪的过程生成数据。","课程中还提到，对抗鲁棒性研究的繁荣源于AI模型在实际应用中的广泛使用，这使得攻击和防御的研究变得尤为重要。生成模型的热度则体现在其在多个领域的实际应用中，如视频生成、图像生成、文本生成和代码生成。","课程中还提到，对抗鲁棒性研究的一个具体例子是“prompt injection”，即通过在提示中插入特定内容来影响模型的输出。这表明对抗攻击不仅限于数据层面，还可能涉及提示工程。","课程最后提到，对抗鲁棒性部分预计需要30到45分钟，之后将重点讲解生成模型，特别是GANs和扩散模型。这表明课程内容将分为两个主要部分，分别深入探讨这两个主题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1.84,"end":173.31,"asr_flags":[],"raw_segments":[{"start":1.84,"text":"Welcome to CS230 lecture 4. Thank you for coming in person or joining online. Today's lecture is one of my favorites. It's a fun one. There's a lot of visuals that we look at and we cover a lot of modern methods as well. A lot of the content is brand new."},{"start":29.29,"text":"The focus areas for us today is going to be two topics, adversarial robustness and generative modeling. Adversarial robustness is an important topic today because there are more and more."},{"start":46.9,"text":"AI models in the wild. You're using dozens of them on a daily basis. And the more algorithms are being used, the more they're prone to attacks. And the more we have to be careful and build defenses proactively, which is what makes this research field of adversarial attacks and defenses very prolific. The other topic we cover is generative models, which"},{"start":75.96,"text":"as you may have seen in the news, is really, really hot right now. You have video generation now becoming a reality, image generation, which you're all already used to. And of course, text generation, code generation, which we all use regularly. There's a lot of heat in that space. And so we're going to try to break down what are the types of algorithms that power"},{"start":102.24,"text":"products like Sora or Veo and so on. Are you excited for this? So let's keep it interactive as always. We'll start with adversarial robustness. It should probably take us..."},{"start":116.8,"text":"30 to 45 minutes. And then we keep the latter part focused on generative models with a focus on GANs, generative adversarial networks. Even if it's called adversarial, it is not really connected to adversarial attacks. It's a different problem. And then diffusion models, which are, I would say, the most popular type or family of algorithm for today's image and video generation products."},{"start":143.8,"text":"So let's start with adversarial robustness with an open question for you all. Can you tell me examples of attacks on AI models? Are you worried about anything when you use AI? Yes. Prompt injection. Prompt injection. What is that? Like, you, like, sneak set bits into, like, a prompt, like a copy-paste that doesn't make blushes on there."}],"speech_gaps":[],"frame":"../frames/v058/001.webp","frame_time":13.84},{"title":"对抗攻击与生成模型中的数据污染","segments":[{"id":7,"text":"Yeah, so we talk about prompt injections, but you essentially try to fool the LLM, let's say, by giving it an instruction that might bypass another instruction that the builder of the model, the user of the model wanted you to use in the first place. It might create dangerous situations where you might steal information such as passwords or PII data. What else? Yeah."},{"id":8,"text":"huh language oh night night what is that it's like a data poisoning for ai art so"},{"id":9,"text":"i believe it takes some image and for example the result is on the cat but it gives the image some"},{"id":10,"text":"features of the dog so it tries to trick the thing like learning the features of the dog"},{"id":11,"text":"I see. Great one. A type of data poisoning attack where you're trying to fool the model by inserting certain pixels or certain traits that might confuse the model and in turn allow someone to bypass the algorithm, for example."},{"id":12,"text":"Yeah, you're right. What else?"},{"id":13,"text":"What are use cases where a model being attacked can be very high risk?"},{"id":14,"text":"Yeah, you know, LLMs are trained on the wild, there's a lot of data online, it might"},{"id":15,"text":"be actually trained on banking numbers, social security numbers, if someone can reverse engineer"},{"id":16,"text":"the training data and find this information, it puts the company that's building that LLM"},{"id":17,"text":"at risk for sure, and the users as well."},{"id":18,"text":"well okay anyone wants to add anything else you know there's a lot of reasons as well if you think"},{"id":19,"text":"of autonomous driving you know a car is trained to detect stop signs and if someone maliciously"},{"id":20,"text":"tries to you know modify sort of the algorithm so that it doesn't see the stop sign"},{"id":21,"text":"it may create a crash and potentially harm"},{"id":22,"text":"form."},{"id":23,"text":"Those are a lot of examples. We're going to cover that. I would say that in the space of adversarial attacks, we've had three waves over the last 10 years, where in 2013, Christian Zegedi, with a great paper on intriguing properties of neural network, essentially tells us that small perturbations, let's say to an image, can fool a computer vision model."}],"notes":["本段讨论了对抗攻击中的数据污染攻击，即通过插入特定像素或特征来误导模型，从而绕过算法。这种攻击可能被用于生成模型中，例如在AI艺术生成中，模型可能被误导生成包含特定特征的图像。","课堂中提到，LLMs（大型语言模型）在训练过程中可能接触到敏感信息，如银行号码和社会安全号码。如果攻击者能够反向工程训练数据并提取这些信息，将对模型构建公司和用户造成风险。","在自动驾驶领域，对抗攻击可能被用于修改算法，使车辆无法识别交通标志，从而导致事故。这种攻击具有很高的风险，可能对公共安全造成威胁。","课堂还提到，对抗攻击在过去十年中经历了三个阶段，其中2013年Christian Szegedy的论文揭示了神经网络对微小扰动的敏感性，这标志着对抗攻击研究的开始。"],"formulas":[],"uncertainties":["huh language oh night night what is that it's like a data poisoning for ai art so","i believe it takes some image and for example the result is on the cat but it gives the image some","features of the dog so it tries to trick the thing like learning the features of the dog","the training data and find this information, it puts the company that's building that LLM","it may create a crash and potentially harm"],"diagram":"none","start":174.86,"end":334.13,"asr_flags":[22],"raw_segments":[{"start":174.86,"text":"Yeah, so we talk about prompt injections, but you essentially try to fool the LLM, let's say, by giving it an instruction that might bypass another instruction that the builder of the model, the user of the model wanted you to use in the first place. It might create dangerous situations where you might steal information such as passwords or PII data. What else? Yeah."},{"start":204.11,"text":"huh language oh night night what is that it's like a data poisoning for ai art so"},{"start":213.83,"text":"i believe it takes some image and for example the result is on the cat but it gives the image some"},{"start":220.95,"text":"features of the dog so it tries to trick the thing like learning the features of the dog"},{"start":227.09,"text":"I see. Great one. A type of data poisoning attack where you're trying to fool the model by inserting certain pixels or certain traits that might confuse the model and in turn allow someone to bypass the algorithm, for example."},{"start":242.89,"text":"Yeah, you're right. What else?"},{"start":246.11,"text":"What are use cases where a model being attacked can be very high risk?"},{"start":266.15,"text":"Yeah, so, you know, LLMs are trained on the wild, there's a lot of data online, it might"},{"start":271.77,"text":"be actually trained on banking numbers, social security numbers, if someone can reverse engineer"},{"start":276.97,"text":"the training data and find this information, it puts the company that's building that LLM"},{"start":283.05,"text":"at risk for sure, and the users as well."},{"start":284.97,"text":"well okay anyone wants to add anything else you know there's a lot of reasons as well if you think"},{"start":291.97,"text":"of autonomous driving you know a car is trained to detect stop signs and if someone maliciously"},{"start":299.51,"text":"tries to you know modify sort of the algorithm so that it doesn't see the stop sign"},{"start":305.57,"text":"it may create a crash and potentially harm"},{"start":308.31,"text":"form."},{"start":309.79,"text":"Those are a lot of examples. We're going to cover that. I would say that in the space of adversarial attacks, we've had three waves over the last 10 years, where in 2013, Christian Zegedi, with a great paper on intriguing properties of neural network, essentially tells us that small perturbations, let's say to an image, can fool a computer vision model."}],"speech_gaps":[{"start":259.44,"end":261.264},{"start":261.264,"end":265.75}],"frame":"../frames/v058/002.webp","frame_time":186.86},{"title":"对抗攻击与生成模型中的安全挑战","segments":[{"id":24,"text":"Like you might not actually see the perturbation, but the model, which looks at pixels as numbers, sees the perturbation. And even in perceptible perturbation can widely change the output of the model. And this is very dangerous. Those are called adversarial attacks and or adversarial examples. And you can think of them as optical illusions for neural networks. A few years later, you know, as."},{"id":25,"text":"training models was more common, more people were training models. And in fact, most importantly, a lot of scraping happened online. So models were scraping the web."},{"id":26,"text":"Another type of attack which you mentioned became prominent, backdoor attacks or data poisoning attacks, which is as an attacker, you might actually hide certain things online. And you know that a large foundation model provider will at some point send a bot that's going to read that data, collect it, put it in a training set. You essentially created an entry point for your attack later on when that model will be in production. And then more recently, prompt injections."},{"id":27,"text":"We all use prompts very commonly. And there's a lot of malicious prompt injection or jailbreaking attacks that can happen to override what the model was intended to do originally. And we'll also talk about these attacks. All of them are relevant and it's a research area, but it's important to know at a high level how those attacks work. One thing that is special about this space."},{"id":28,"text":"I would say is that for every new defense, there's a new attack. And for every new attack, there's a new defense. So it's defenses and attacks competing with each other. And you'll find, frankly, that in the AI space, including in the gates department here at Stanford, a lot of the people who are coming up with attacks are the same that are coming up with defenses."},{"id":29,"text":"But it matters. One thing to note is the progression of these attacks is that originally, if you look 2014-2018 period, a lot of the attacks were using the inputs. And as AI agents sort of now work with instruction, with context, with retrieval pipelines, there is a lot more entry points to perform an attack. And so models are more vulnerable."},{"id":30,"text":"We'll talk about retrieval augmented generation in a lecture in two to three weeks, maybe three weeks. And you'll see that when you connect an agent to a database that you might not know, there's a lot of risks involved in that. It might be reading a document that can maliciously attack your agent. Okay, so let's try to come up with a first attack, an adversarial example."}],"notes":["本段介绍了对抗攻击的基本概念，即微小的扰动可能对模型输出产生巨大影响，这种现象被称为对抗样本或对抗攻击。这些攻击可以被视为神经网络的‘视觉错觉’，并且在2014-2018年间，攻击主要依赖于输入数据。","随着AI代理的发展，攻击方式也变得更加复杂，例如通过数据污染或后门攻击，攻击者可以在训练阶段植入恶意数据，从而在模型部署后实现攻击目的。此外，提示注入攻击（prompt injection）也成为新的攻击手段，攻击者可以通过恶意提示覆盖模型的原始意图。","对抗攻击和防御机制之间存在持续的博弈关系，每当一种新的防御方法被提出，攻击者也会相应地开发新的攻击方式。这种动态平衡在AI领域，包括斯坦福大学的Gates部门，都得到了体现。","随着AI代理开始使用指令、上下文和检索管道，攻击的入口点也显著增加，导致模型更加脆弱。例如，连接代理到未知数据库时，可能会读取恶意文档，从而对代理造成攻击。","课程中提到，对抗攻击的研究是一个重要的研究领域，需要从高层次理解其工作原理。同时，课程还预告了将在未来几周讨论检索增强生成（retrieval augmented generation）的相关内容，以进一步探讨模型安全问题。","最后，课程鼓励学生尝试构建第一个对抗样本，以加深对对抗攻击的理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":334.92,"end":506.68,"asr_flags":[],"raw_segments":[{"start":334.92,"text":"Like you might not actually see the perturbation, but the model, which looks at pixels as numbers, sees the perturbation. And even in perceptible perturbation can widely change the output of the model. And this is very dangerous. Those are called adversarial attacks and or adversarial examples. And you can think of them as optical illusions for neural networks. A few years later, you know, as."},{"start":366.5,"text":"training models was more common, more people were training models. And in fact, most importantly, a lot of scraping happened online. So models were scraping the web."},{"start":375.97,"text":"Another type of attack which you mentioned became prominent, backdoor attacks or data poisoning attacks, which is as an attacker, you might actually hide certain things online. And you know that a large foundation model provider will at some point send a bot that's going to read that data, collect it, put it in a training set. You essentially created an entry point for your attack later on when that model will be in production. And then more recently, prompt injections."},{"start":407.71,"text":"We all use prompts very commonly. And there's a lot of malicious prompt injection or jailbreaking attacks that can happen to override what the model was intended to do originally. And we'll also talk about these attacks. All of them are relevant and it's a research area, but it's important to know at a high level how those attacks work. One thing that is special about this space."},{"start":435.29,"text":"I would say is that for every new defense, there's a new attack. And for every new attack, there's a new defense. So it's defenses and attacks competing with each other. And you'll find, frankly, that in the AI space, including in the gates department here at Stanford, a lot of the people who are coming up with attacks are the same that are coming up with defenses."},{"start":457.61,"text":"But it matters. One thing to note is the progression of these attacks is that originally, if you look 2014-2018 period, a lot of the attacks were using the inputs. And as AI agents sort of now work with instruction, with context, with retrieval pipelines, there is a lot more entry points to perform an attack. And so models are more vulnerable."},{"start":481.9,"text":"We'll talk about retrieval augmented generation in a lecture in two to three weeks, maybe three weeks. And you'll see that when you connect an agent to a database that you might not know, there's a lot of risks involved in that. It might be reading a document that can maliciously attack your agent. Okay, so let's try to come up with a first attack, an adversarial example."}],"speech_gaps":[],"frame":"../frames/v058/003.webp","frame_time":346.92},{"title":"对抗鲁棒性与生成模型中的攻击方法","segments":[{"id":31,"text":"in the image space. So my problem for you, and we're going to do it like last week, more interactive, like two weeks ago, given a network that is pre-trained on ImageNet. So remember, ImageNet has a bunch of classes, a lot of images, so it can detect pretty much all the common objects, people that you can imagine would be in a picture. Can you find an input image that will be classified as an iguana?"},{"id":32,"text":"You know, so what I'm asking you is you have that neural network, it's pre-trained, and I want you to find an image. But instead of, you know, you take an image of a cat, of course, if you give it to the model, it's going to say, hey, I think it's a cat. What I'm asking you is how do you find an image such that the output is iguana? So how do you do that? Yes. Take a picture of an iguana, give it to the model, and it's likely to find an iguana. That's a fair solution. What else?"},{"id":33,"text":"Although you wouldn't even be guaranteed that it finds the iguana. Probably it would, but it depends on the model performance. How can you be guaranteed that it's going to predict it as an iguana? Yeah, you want to try it? OK, so assuming you have access to the training sets of the model, you can find pictures labeled as iguanas. And it's likely that because it's been trained on that data set, it will, in fact, predict it as an iguana. That's also true."},{"id":34,"text":"Now let's say you don't have access to the model parameters. Yeah. Yeah. Okay. I see. So you send a bunch of pictures."},{"id":35,"text":"And you hit it until you find that the prediction is iguana. And then you say that's a picture. Yeah, correct. So that's sort of an optimization problem you're posing, which is what we're going to do. And so remember two weeks ago, I told you like designing loss functions is an important skill, maybe an art in neural networks. Here's an example of you coming up with a loss function that would allow you to forge an attack on pretty much any model. So here's what we're going to do. We're going to rephrase what we want in simple words."},{"id":36,"text":"We want to find x, the input, such that y hat of x is equal to the label for iguana. So the prediction is as close as possible to y iguana. If you had to do that in terms of a loss function, what would it look like? A loss function you want to minimize, let's say. Yeah. Mean squared error between what and what?"}],"notes":["本段讲解了如何通过设计损失函数来实现对神经网络的攻击，目标是找到一个输入x，使得模型的预测输出y_hat(x)尽可能接近标签y_iguana（即蜥蜴）。这涉及将问题转化为一个优化问题，其中损失函数用于衡量预测结果与目标标签之间的差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":507.78,"end":686.29,"asr_flags":[],"math_clarifications":["公式中的等号应为接近关系，而非直接相等。此外，损失函数应明确为均方误差或其他合适的损失函数，以衡量预测输出与目标标签之间的差异。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":507.78,"text":"in the image space. So my problem for you, and we're going to do it like last week, more interactive, like two weeks ago, given a network that is pre-trained on ImageNet. So remember, ImageNet has a bunch of classes, a lot of images, so it can detect pretty much all the common objects, people that you can imagine would be in a picture. Can you find an input image that will be classified as an iguana?"},{"start":536.68,"text":"You know, so what I'm asking you is you have that neural network, it's pre-trained, and I want you to find an image. But instead of, you know, you take an image of a cat, of course, if you give it to the model, it's going to say, hey, I think it's a cat. What I'm asking you is how do you find an image such that the output is iguana? So how do you do that? Yes. Take a picture of an iguana, give it to the model, and it's likely to find an iguana. That's a fair solution. What else?"},{"start":573.26,"text":"Although you wouldn't even be guaranteed that it finds the iguana. Probably it would, but it depends on the model performance. How can you be guaranteed that it's going to predict it as an iguana? Yeah, you want to try it? OK, so assuming you have access to the training sets of the model, you can find pictures labeled as iguanas. And it's likely that because it's been trained on that data set, it will, in fact, predict it as an iguana. That's also true."},{"start":606.9,"text":"Now let's say you don't have access to the model parameters. Yeah. Yeah. Okay. I see. So you send a bunch of pictures."},{"start":622.81,"text":"And you hit it until you find that the prediction is iguana. And then you say that's a picture. Yeah, correct. So that's sort of an optimization problem you're posing, which is what we're going to do. And so remember two weeks ago, I told you like designing loss functions is an important skill, maybe an art in neural networks. Here's an example of you coming up with a loss function that would allow you to forge an attack on pretty much any model. So here's what we're going to do. We're going to rephrase what we want in simple words."},{"start":653.25,"text":"We want to find x, the input, such that y hat of x is equal to the labor for iguana. So the prediction is as close as possible to y iguana. If you had to do that in terms of a loss function, what would it look like? A loss function you want to minimize, let's say. Yeah. Mean squared error between what and what?"}],"speech_gaps":[],"frame":"../frames/v058/004.webp","frame_time":519.78},{"title":"对抗鲁棒性与生成模型中的图像扰动","segments":[{"id":37,"text":"Yeah, Y hat and Y iguana. Good. Yeah, I agree. You could put an L2 distance between Y hats, given the parameters, biases, the weights and biases, and Y iguana. And if you minimize that, then..."},{"id":38,"text":"you would get X to lead to Y hat equals Y iguana or as close as possible to it. So there is one difference here with what we've seen in the past, which is that we are not touching the parameters of the network. We're starting from an image X. We're sending that image in the network. We're computing the defined loss function. And then we're computing the gradients of L."},{"id":39,"text":"with respect to the input pixels. So, you know, in gradient descent, you're used to the training process where you push the parameters to the right or to the left. Here, you're doing the same thing in the pixel space. The model is completely fixed. It's already pre-trained. And if you do that many times with gradient descent, you should end up with an image that is going to be predicted as iguana. Does that make sense to everyone? Yeah. So now the question is,"},{"id":40,"text":"Will the forged image X look like an iguana or not? Who thinks it will look like an iguana? Who thinks it will not? Someone wants to say why? You think it will not look like an iguana? Yeah. You think the chance is low? You're not convinced that pushing pixels in a certain direction will lead to a continuous set of colors that would look like an iguana? Okay, that's a good intuition."},{"id":41,"text":"I see. So you're saying there is more images that are classified as iguana by the model than there are iguana images possible. Yeah, that's also a good intuition. Exactly. Yeah."}],"notes":["本段讨论了对抗样本的生成方法，即通过最小化预测输出与目标标签之间的L2距离来扰动输入图像。讲者指出，这种方法不修改网络参数，而是通过梯度下降在像素空间中调整输入图像，使其被模型预测为特定类别（如‘iguana’）。"],"formulas":[],"uncertainties":["Y iguana","Y hat","L2 distance","gradient descent","pixel space","pre-trained","continuous set of colors"],"diagram":"none","start":690.27,"end":833.55,"asr_flags":[],"raw_segments":[{"start":690.27,"text":"Yeah, Y hat and Y iguana. Good. Yeah, I agree. You could put an L2 distance between Y hats, given the parameters, biases, the weights and biases, and Y iguana. And if you minimize that, then..."},{"start":705.16,"text":"you would get X to lead to Y hat equals Y iguana or as close as possible to it. So there is one difference here with what we've seen in the past, which is that we are not touching the parameters of the network. We're starting from an image X. We're sending that image in the network. We're computing the defined loss function. And then we're computing the gradients of L."},{"start":732.44,"text":"with respect to the input pixels. So, you know, in gradient descent, you're used to the training process where you push the parameters to the right or to the left. Here, you're doing the same thing in the pixel space. The model is completely fixed. It's already pre-trained. And if you do that many times with gradient descent, you should end up with an image that is going to be predicted as iguana. Does that make sense to everyone? Yeah. So now the question is,"},{"start":762.16,"text":"Will the forged image X look like an iguana or not? Who thinks it will look like an iguana? Who thinks it will not? Someone wants to say why? You think it will not look like an iguana? Yeah. You think the chance is low? You're not convinced that pushing pixels in a certain direction will lead to a continuous set of colors that would look like an iguana? Okay, that's a good intuition."},{"start":818.73,"text":"I see. So you're saying there is more images that are classified as iguana by the model than there are iguana images possible. Yeah, that's also a good intuition. Exactly. Yeah."}],"speech_gaps":[],"frame":"../frames/v058/005.webp","frame_time":702.27},{"title":"对抗鲁棒性与生成模型中的图像伪造","segments":[{"id":42,"text":"I see, I see. Yeah. Okay, so you're saying we might see some patterns that are like an iguana, but it's unlikely the picture will look like an iguana as a whole. Yeah, it's a good example. For example, possibly the picture we're going to see is more green than not. Let's say, maybe. That's possible. So you're right. It is highly unlikely that the forged image will look like an iguana."},{"id":43,"text":"And the reason is all of what you mentioned. Let's imagine the space of possible input images to the network. It turns out this space is way bigger than the space that us humans look at. We never look at the randomness of images in the wild. We look at actually a fairly small distribution of patterns from our eyes. And so let's say this is the space of possible input images. This space is very large."},{"id":44,"text":"The space of real images, what we come up as humans when we look at the world, is much smaller than that. And the blue space is this size because the model can take anything as an input. 256 pixels on a 32 by 32 by 3 channels is gigantic. It's way more than the number of atoms in the universe."},{"id":45,"text":"And so it is very likely that, you know, because of the way we defined our optimization problem, that our image will fall in the green space, the space of images that are classified as iguana. And yes, there is an overlap between the green and the red space. Those are the iguanas that are following the real distribution. But the space is much bigger, as you were saying. And that's why it's unlikely that we'll end up there. OK, so this is more likely what we'll see."},{"id":46,"text":"It does not look at all like an iguana. Okay. Does that make sense? So now we're going to go one step further because it's nice to be able to forge an attack. But if it looks random, it looks random to humans. So, you know, you're looking at a stop sign that's been forged. It doesn't look at all like a stop sign. Someone will just take it down. Right. So a smarter attacker is going to try to come up with an image that also looks like something to the human."},{"id":47,"text":"And that might be more problematic. Let's say, you know, a stop sign still looks like a stop sign, but it's not predicted as a stop sign. That becomes way more dangerous. So how do we modify the previous setup in order to do that? Given a network pre-trained on ImageNet, find an input image that is displaying a cat."}],"notes":["本段讨论了对抗样本的生成问题，特别是图像伪造中如何让图像看起来像真实对象但被模型错误分类。讲者通过举例说明，即使图像看起来像某种动物（如鬣蜥），但整体上不太可能被误认为是该动物。这涉及到对抗样本的鲁棒性问题，即模型在面对微小扰动时的分类错误。","讲者进一步解释了输入空间的大小，指出模型可以接受的输入空间远大于人类实际观察到的图像分布。这说明模型在面对大量可能的输入时，容易产生错误分类，因为人类的视觉感知范围有限。","讲者提到图像空间的大小，例如32x32x3的图像有256个像素，其空间规模远大于宇宙中的原子数量。这强调了模型在处理高维输入时的挑战，以及对抗样本可能存在的广泛分布。","讲者指出，由于优化问题的定义，生成的图像更可能落在被分类为鬣蜥的绿色空间中，但该空间与红色空间（真实分布）有重叠。这说明模型在分类时可能误将某些图像归为特定类别。","讲者进一步讨论了更危险的对抗样本类型，即图像看起来像真实对象但被模型错误分类。例如，伪造的停车标志看起来像停车标志，但模型未将其识别为停车标志，这可能带来更大的安全风险。","最后，讲者提出如何修改之前的设置以生成更危险的对抗样本，即在预训练的ImageNet网络上，寻找一个显示猫的输入图像。这表明对抗样本的生成需要更复杂的优化策略，以使图像既符合人类视觉又被模型错误分类。"],"formulas":[],"uncertainties":[],"diagram":"none","start":849.82,"end":1011.64,"asr_flags":[],"raw_segments":[{"start":849.82,"text":"I see, I see. Yeah. Okay, so you're saying we might see some patterns that are like an iguana, but it's unlikely the picture will look like an iguana as a whole. Yeah, it's a good example. For example, possibly the picture we're going to see is more green than not. Let's say, maybe. That's possible. So you're right. It is highly unlikely that the forged image will look like an iguana."},{"start":873.55,"text":"And the reason is all of what you mentioned. Let's imagine the space of possible input images to the network. It turns out this space is way bigger than the space that us humans look at. We never look at the randomness of images in the wild. We look at actually a fairly small distribution of patterns from our eyes. And so let's say this is the space of possible input images. This space is very large."},{"start":901.48,"text":"The space of real images, what we come up as humans when we look at the world, is much smaller than that. And the blue space is this size because the model can take anything as an input. 256 pixels on a 32 by 32 by 3 channels is gigantic. It's way more than the number of atoms in the universe."},{"start":927.28,"text":"And so it is very likely that, you know, because of the way we defined our optimization problem, that our image will fall in the green space, the space of images that are classified as iguana. And yes, there is an overlap between the green and the red space. Those are the iguanas that are following the real distribution. But the space is much bigger, as you were saying. And that's why it's unlikely that we'll end up there. OK, so this is more likely what we'll see."},{"start":956.84,"text":"It does not look at all like an iguana. Okay. Does that make sense? So now we're going to go one step further because it's nice to be able to forge an attack. But if it looks random, it looks random to humans. So, you know, you're looking at a stop sign that's been forged. It doesn't look at all like a stop sign. Someone will just take it down. Right. So a smarter attacker is going to try to come up with an image that also looks like something to the human."},{"start":987.88,"text":"And that might be more problematic. Let's say, you know, a stop sign still looks like a stop sign, but it's not predicted as a stop sign. That becomes way more dangerous. So how do we modify the previous setup in order to do that? Given a network pre-trained on ImageNet, find an input image that is displaying a cat."}],"speech_gaps":[],"frame":"../frames/v058/006.webp","frame_time":861.82},{"title":"对抗鲁棒性与生成模型中的对抗样本构造","segments":[{"id":48,"text":"But instead of predicting it as a cat, the model now predicts it as an iguana because the image has been tempered. So how do we change our initial pipeline? Yeah, that's probably a good idea. You might start with an image of a cat. And because your starting point is a cat, you might be tempering some pixels, but it will still look like a cat. Yeah, you're right. That's a good idea. What else? Other ideas? Yeah."},{"id":49,"text":"Yeah, you're right. That's exactly what we do. Both techniques are correct. So we take our initial setup and we modify it slightly. So if I rephrase what we want, we want to find X such as Y hat of X equals Y of iguana. But we also want X to be close to an image X cat. Right. If I define the loss function, I will keep my initial term of the L2 distance between the."},{"id":50,"text":"prediction targets. And I will also add another constraint, which you can think of as a regularization term, which keeps X close to the Xcat picture that you've chosen. And now you have two targets that are optimized at the same time. And so if you do that enough time, you should end up with a picture that looks like your Xcat target. You might even, as you said, want to start the optimization rather than starting with a completely random image. You start from the Xcat and you temper it."},{"id":51,"text":"And that might be faster, actually. Does that make sense to everyone? So this is a more difficult attack to deal with because it might look to you like a cat still, but to the model, it doesn't look like a cat anymore. And oftentimes, you might see that some of the pixels have been pushed to the side."},{"id":52,"text":"adversarial examples that you can forge. Where are we on this map in the new setup? Well, we are right now in a different space. We are in the space of images that look real to human and are classified as iguana, but they're not real. So we're right here. We're at the crossroad of the green and the purple space. They look real to us, but they're not actually real and they're classified as an iguana. Super."}],"notes":["本段讨论了对抗样本构造中的一种方法，即通过修改初始图像（如猫）来生成看起来像猫但被模型识别为鬣蜥的图像。这种修改通常通过优化目标函数实现，其中包含两个目标：一个是使图像保持与原始图像（如猫）相似，另一个是使模型输出目标类别（如鬣蜥）。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","在优化过程中，通常会使用L2距离作为初始目标函数的一部分，并添加一个正则化项以保持图像与原始图像的相似性。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","对抗样本的构造通常从原始图像（如猫）开始，并通过调整部分像素来生成对抗样本。这种调整可能使图像在视觉上仍接近原始图像，但在模型分类上发生改变。这种构造方法在对抗攻击中较为常见，因为其生成的样本在视觉上不易察觉。","对抗样本的构造方法通常涉及优化目标函数，其中包含两个目标：一个是使图像保持与原始图像相似，另一个是使模型输出目标类别。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","对抗样本的构造方法通常涉及优化目标函数，其中包含两个目标：一个是使图像保持与原始图像相似，另一个是使模型输出目标类别。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","对抗样本的构造方法通常涉及优化目标函数，其中包含两个目标：一个是使图像保持与原始图像相似，另一个是使模型输出目标类别。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1013.06,"end":1191.24,"asr_flags":[],"raw_segments":[{"start":1013.06,"text":"But instead of predicting it as a cat, the model now predicts it as an iguana because the image has been tempered. So how do we change our initial pipeline? Yeah, that's probably a good idea. You might start with an image of a cat. And because your starting point is a cat, you might be tempering some pixels, but it will still look like a cat. Yeah, you're right. That's a good idea. What else? Other ideas? Yeah."},{"start":1065.04,"text":"Yeah. OK, so you would also modify the optimization targets. Yeah, you're right. That's exactly what we do. Both techniques are correct. So we take our initial setup and we modify it slightly. So if I rephrase what we want, we want to find X such as Y hat of X equals Y of iguana. But we also want X to be close to an image X cat. Right. If I define the loss function, I will keep my initial term of the L2 distance between the."},{"start":1095.86,"text":"prediction targets. And I will also add another constraint, which you can think of as a regularization term, which keeps X close to the Xcat picture that you've chosen. And now you have two targets that are optimized at the same time. And so if you do that enough time, you should end up with a picture that looks like your Xcat target. You might even, as you said, want to start the optimization rather than starting with a completely random image. You start from the Xcat and you temper it."},{"start":1127.54,"text":"And that might be faster, actually. Does that make sense to everyone? So this is a more difficult attack to deal with because it might look to you like a cat still, but to the model, it doesn't look like a cat anymore. And oftentimes, you might see that some of the pixels have been pushed to the side. Okay, so these are examples of..."},{"start":1156.77,"text":"adversarial examples that you can forge. Where are we on this map in the new setup? Well, we are right now in a different space. We are in the space of images that look real to human and are classified as iguana, but they're not real. So we're right here. We're at the crossroad of the green and the purple space. They look real to us, but they're not actually real and they're classified as an iguana. Super."}],"speech_gaps":[],"frame":"../frames/v058/007.webp","frame_time":1025.06},{"title":"对抗样本与生成模型中的对抗性攻击","segments":[{"id":53,"text":"Let's look at a concrete example from 2017 where this group of researchers took an image and tempered it and is running a model on a phone. And you can see that the prediction here is a library. But when you look at the other one, it's a prison. And we know that libraries are not prison. And here's another example we can look at with the washing machine."},{"id":54,"text":"Again, this is a real device with the model, the computer vision model running on it. The prediction is a washer here. And then if you move it to the other picture, it is a doormat. Got it. Here's another interesting one. Same methods, adversarial patch. You might have seen it in the news more recently. Here's a group of students and researchers that come up with a patch."},{"id":55,"text":"And when you wear the patch, the model essentially doesn't see you. Quite interesting. So this one is actually a slightly more complex problem because in the past, we've actually seen patches that might, you might have seen that in the news where someone sticks a patch on a stop sign."},{"id":56,"text":"And then the car doesn't see it as a stop sign anymore, which is, again, very dangerous. But stop signs are all the same. There's no intraclass variability. People, there's a lot more intraclass variability. And so having a patch that can essentially work across all intraclass variabilities was quite novel when they came up with it."},{"id":57,"text":"And the way they do it is also quite interesting. Again, now you have the baggage, the technical baggage to understand how they did it. They optimized the patch by looking at certain outputs and they modified the pixels of the patch and then they printed the patch, essentially. Does that make sense? One of the interesting things I liked about this paper was they were quite creative with their loss function. If you look at the paper, the loss function has three components to it. And one of the components is..."},{"id":58,"text":"that the colors have to belong to the set of printable colors so that their printers can actually print it. Because otherwise you end up with something that is really hard to print and you cannot print your patch. A second term of their loss function was to smooth out the colors in the patch so that the patch looks like something that could be printed more easily. Imagine every pixel being different and trying to print that much harder. So that's an example of a group of researchers that has crafted a loss function for the purpose of what they were trying."}],"notes":["本段介绍了对抗样本的实例，如2017年研究人员通过在图像中添加对抗性扰动，使模型在手机上做出错误预测。例如，一张图片被识别为图书馆，而另一张则被识别为监狱，这说明模型对输入的敏感性。此外，还提到洗衣机和门垫的例子，说明对抗样本可以影响不同场景下的模型预测。","本段进一步说明了对抗性攻击的复杂性，特别是对抗性贴片的应用。例如，将贴片贴在停车标志上，使自动驾驶汽车无法识别，这展示了对抗样本在现实世界中的潜在危险。同时，也指出停车标志的类别内变化较少，而人类的类别内变化更多，因此设计一个能适应所有类别内变化的贴片是创新的。","本段讨论了对抗性贴片的实现方法，包括优化贴片以适应特定输出，并修改贴片的像素以实现打印。此外，还提到论文中损失函数的三个组成部分，其中一个是确保颜色在可打印范围内，另一个是平滑颜色以提高打印可行性。","本段强调了对抗性攻击中损失函数的设计，特别是如何通过优化颜色和像素来实现实际应用。例如，颜色必须在打印机可打印范围内，否则无法打印贴片。同时，平滑颜色可以减少打印难度，这体现了研究人员在设计损失函数时的创造性。","本段总结了对抗性攻击的挑战和创新点，包括对抗性贴片的设计、优化方法以及损失函数的构建。这些方法不仅提高了攻击的有效性，还考虑了实际应用中的限制，如打印可行性。","本段通过具体例子说明了对抗样本的潜在危害和实际应用，强调了对抗性攻击在计算机视觉中的重要性。同时，也展示了研究人员在设计对抗性攻击时的创新思维和实际考量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1192.34,"end":1359.09,"asr_flags":[],"raw_segments":[{"start":1192.34,"text":"Let's look at a concrete example from 2017 where this group of researchers took an image and tempered it and is running a model on a phone. And you can see that the prediction here is a library. But when you look at the other one, it's a prison. And we know that libraries are not prison. And here's another example we can look at with the washing machine."},{"start":1223.9,"text":"Again, this is a real device with the model, the computer vision model running on it. The prediction is a washer here. And then if you move it to the other picture, it is a doormat. Got it. Here's another interesting one. Same methods, adversarial patch. You might have seen it in the news more recently. Here's a group of students and researchers that come up with a patch."},{"start":1251.73,"text":"And when you wear the patch, the model essentially doesn't see you. Quite interesting. So this one is actually a slightly more complex problem because in the past, we've actually seen patches that might, you might have seen that in the news where someone sticks a patch on a stop sign."},{"start":1275.19,"text":"And then the car doesn't see it as a stop sign anymore, which is, again, very dangerous. But stop signs are all the same. There's no intraclass variability. People, there's a lot more intraclass variability. And so having a patch that can essentially work across all intraclass variabilities was quite novel when they came up with it."},{"start":1300.37,"text":"And the way they do it is also quite interesting. Again, now you have the baggage, the technical baggage to understand how they did it. They optimized the patch by looking at certain outputs and they modified the pixels of the patch and then they printed the patch, essentially. Does that make sense? One of the interesting things I liked about this paper was they were quite creative with their loss function. If you look at the paper, the loss function has three components to it. And one of the components is..."},{"start":1329.87,"text":"that the colors have to belong to the set of printable colors so that their printers can actually print it. Because otherwise you end up with something that is really hard to print and you cannot print your patch. A second term of their loss function was to smooth out the colors in the patch so that the patch looks like something that could be printed more easily. Imagine every pixel being different and trying to print that much harder. So that's an example of a group of researchers that has crafted a loss function for the purpose of what they were trying."}],"speech_gaps":[],"frame":"../frames/v058/008.webp","frame_time":1204.34},{"title":"对抗鲁棒性与生成模型中的攻击方法","segments":[{"id":59,"text":"to do. Yes. That's a great question, actually. So the question is..."},{"id":60,"text":"This paper was targeting specifically YOLOv2, which is one of the models that you're going to build in this class in a couple of weeks. Does it work on another model, essentially? Or, you know, how do we think about that? So, of course, if this pipeline has been optimized on YOLOv2, it's going to work better on YOLOv2. But it turns out that a lot of models follow the same salient features."},{"id":61,"text":"When actually, if you build a patch on a specific family of models, it is likely that it will work on another one if that model doesn't have the defenses to detect that patch. And it's actually a type of attack that you would call a black box attack. Like, let's say there's a model you're targeting somewhere. You don't have access to that model. And in fact, sometimes you would say, I can ping this model. So I can ping it enough."},{"id":62,"text":"so that I can understand the gradients and I can optimize my image. But one of the protections that the model can put together is the amount of things you can make per minute, three max, and then you can't do it as well as you could. So what does the attacker do? They train a model on a very similar task. They create a patch or a Forge example, and then they send that Forge example, and sometimes it works. Okay."},{"id":63,"text":"So let's move to a big question that I think would sort of give you the intuition of why these attacks are very dangerous and happening for neural networks. So actually, I'm going to ask you the question. Intuitively, why do you think that neural networks are sensitive to forged images? Because we humans aren't sensitive to that. We can tell."},{"id":64,"text":"Hey, this was a cat. It was not an iguana. So what makes the model sensitive? So one, does the model actually understand what the, let's say, semantic concept of a cat is? Probably not, or at least not as well as us. No, that's true. I see. So you're saying we are multisensorial as a species. We get a lot more insights than just pixels."}],"notes":["本段讨论了对抗攻击在不同模型间的泛化能力，特别是针对YOLOv2模型的攻击方法。讲者指出，如果攻击方法是在特定模型上优化的，那么它在该模型上表现更好，但许多模型具有相似的显著特征，因此攻击可能在其他模型上也有效。这种攻击被称为黑盒攻击，攻击者无法直接访问目标模型，但可以通过发送伪造示例来影响模型。","讲者进一步解释了攻击者如何通过训练一个与目标任务相似的模型来生成伪造示例，并将其发送给目标模型。有时这些伪造示例能够成功欺骗模型。这表明，攻击者可以利用模型对伪造输入的敏感性，即使模型没有专门的防御机制。","讲者提出了一个关键问题：为什么神经网络对伪造图像如此敏感？讲者指出，人类并不对伪造图像敏感，因为我们能够识别图像内容。这暗示了神经网络可能缺乏对图像语义概念的深入理解。","讲者进一步指出，人类是多感官的，能够从多个来源获取信息，而不仅仅是像素。这表明，神经网络可能在处理图像时过于依赖像素级别的特征，而忽略了更高级的语义信息。","讲者通过一个例子说明了模型对伪造图像的敏感性：一张图像被识别为猫而不是鬣蜥，这表明模型可能没有正确理解图像的语义概念。","讲者强调了神经网络在处理图像时的局限性，即它们可能无法像人类一样理解图像的语义概念，从而容易受到伪造图像的攻击。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1359.18,"end":1533.2,"asr_flags":[],"raw_segments":[{"start":1359.18,"text":"to do. Yes. That's a great question, actually. So the question is..."},{"start":1380.6,"text":"This paper was targeting specifically YOLOv2, which is one of the models that you're going to build in this class in a couple of weeks. Does it work on another model, essentially? Or, you know, how do we think about that? So, of course, if this pipeline has been optimized on YOLOv2, it's going to work better on YOLOv2. But it turns out that a lot of models follow the same salient features."},{"start":1407.26,"text":"When actually, if you build a patch on a specific family of models, it is likely that it will work on another one if that model doesn't have the defenses to detect that patch. And it's actually a type of attack that you would call a black box attack. Like, let's say there's a model you're targeting somewhere. You don't have access to that model. And in fact, sometimes you would say, I can ping this model. So I can ping it enough."},{"start":1432.57,"text":"so that I can understand the gradients and I can optimize my image. But one of the protections that the model can put together is the amount of things you can make per minute, three max, and then you can't do it as well as you could. So what does the attacker do? They train a model on a very similar task. They create a patch or a Forge example, and then they send that Forge example, and sometimes it works. Okay."},{"start":1458.09,"text":"So let's move to a big question that I think would sort of give you the intuition of why these attacks are very dangerous and happening for neural networks. So actually, I'm going to ask you the question. Intuitively, why do you think that neural networks are sensitive to forged images? Because we humans aren't sensitive to that. We can tell."},{"start":1488.05,"text":"Hey, this was a cat. It was not an iguana. So what makes the model sensitive? So one, does the model actually understand what the, let's say, semantic concept of a cat is? Probably not, or at least not as well as us. No, that's true. I see. So you're saying we are multisensorial as a species. We get a lot more insights than just pixels."}],"speech_gaps":[],"frame":"../frames/v058/009.webp","frame_time":1371.18},{"title":"对抗鲁棒性与神经网络的敏感性","segments":[{"id":65,"text":"which allow us to tell, you know, this cat doesn't sound like a cat, let's say. So yeah, the model doesn't have it. Although more and more models are multimodal now, but I get what you're saying. But when it comes to the actual neural networks, what makes a neural network specifically sensitive to this type of attack compared to maybe other types of algorithms? So it's a difficult question, but we're going to look at it together. Yeah, you want to try?"},{"id":66,"text":"Overfeeding. Yeah, it's a little bit of that. Yeah. Neural network is prone to overfeeding, but there's actually a different reason behind it. So are you saying like our loss function, let's say the L2 loss or the binary cross entropy on an image task is essentially sensitive to every single pixel rather than a group of pixels?"},{"id":67,"text":"And so it might be sensitive to variation in a single pixel. That's correct. Although with convolutional networks, the pirating changes because you have a scanning window. So that might not be the case for those. So it's actually a little counterintuitive. Do you want to try?"},{"id":68,"text":"Okay, so you're saying we're optimizing on a probability or a likelihood. And so there is no concept of semantics. And so, you know, you could probably widely shift the probability output based on certain tweaks on the inputs, essentially. Yeah, I mean, all of that are good ideas. So initially, researchers probably thought that the fact that neural networks are sensitive to adversarial attacks is because of their non-linearity."},{"id":69,"text":"They're highly nonlinear, so small tweaks to the inputs might lead to highly nonlinear exponential changes in the output."},{"id":70,"text":"That was not correct. In fact, even if a neural network uses ReLU activations or other nonlinear activations, in practice, when you look at it from input to logits, it actually looks very linear. And you've seen in the lectures online about the vanishing gradient and us trying to be as close as possible to the identity to maximize those gradients. So in fact, a neural network is highly linear, actually."},{"id":71,"text":"The reason is actually the dimensionality of the problem. We're going to look at it and explain why when you deal with high dimensional problems, the sensitivity of an algorithm like neural networks is..."}],"notes":["本段讨论了神经网络对对抗攻击敏感的原因，指出虽然神经网络具有非线性特性，但实际中从输入到logits的映射在高维问题中表现出高度线性。这与梯度消失问题和试图接近恒等映射以最大化梯度有关。","讲者提到，即使使用ReLU等非线性激活函数，神经网络在高维空间中仍表现出线性行为，这与对抗攻击的敏感性有关。","对抗攻击的敏感性可能与神经网络的高维特性有关，而非仅仅是其非线性。讲者指出，高维问题中，算法对输入的微小变化可能表现出高度敏感。","讲者提到，对抗攻击的敏感性可能与损失函数的设计有关，例如L2损失或二元交叉熵损失对每个像素的敏感性。","讲者指出，卷积网络由于扫描窗口的存在，可能不会表现出与全连接网络相同的敏感性，这与网络结构有关。","讲者强调，对抗攻击的敏感性并非完全由非线性引起，而是与高维空间中的线性行为和输入扰动的传播有关。"],"formulas":[],"uncertainties":["pirating"],"diagram":"none","start":1533.93,"end":1713.73,"asr_flags":[],"raw_segments":[{"start":1533.93,"text":"which allow us to tell, you know, this cat doesn't sound like a cat, let's say. So yeah, the model doesn't have it. Although more and more models are multimodal now, but I get what you're saying. But when it comes to the actual neural networks, what makes a neural network specifically sensitive to this type of attack compared to maybe other types of algorithms? So it's a difficult question, but we're going to look at it together. Yeah, you want to try?"},{"start":1565.36,"text":"Overfeeding. Yeah, it's a little bit of that. Yeah. Neural network is prone to overfeeding, but there's actually a different reason behind it. So are you saying like our loss function, let's say the L2 loss or the binary cross entropy on an image task is essentially sensitive to every single pixel rather than a group of pixels?"},{"start":1600.71,"text":"And so it might be sensitive to variation in a single pixel. That's correct. Although with convolutional networks, the pirating changes because you have a scanning window. So that might not be the case for those. So it's actually a little counterintuitive. Do you want to try?"},{"start":1636.26,"text":"Okay, so you're saying we're optimizing on a probability or a likelihood. And so there is no concept of semantics. And so, you know, you could probably widely shift the probability output based on certain tweaks on the inputs, essentially. Yeah, I mean, all of that are good ideas. So initially, researchers probably thought that the fact that neural networks are sensitive to adversarial attacks is because of their non-linearity."},{"start":1665.93,"text":"They're highly nonlinear, so small tweaks to the inputs might lead to highly nonlinear exponential changes in the output."},{"start":1676.74,"text":"That was not correct. In fact, even if a neural network uses ReLU activations or other nonlinear activations, in practice, when you look at it from input to logits, it actually looks very linear. And you've seen in the lectures online about the vanishing gradient and us trying to be as close as possible to the identity to maximize those gradients. So in fact, a neural network is highly linear, actually."},{"start":1702.67,"text":"The reason is actually the dimensionality of the problem. We're going to look at it and explain why when you deal with high dimensional problems, the sensitivity of an algorithm like neural networks is..."}],"speech_gaps":[],"frame":"../frames/v058/010.webp","frame_time":1545.93},{"title":"对抗鲁棒性与生成模型中的输入扰动","segments":[{"id":72,"text":"vastly higher to perturbations of the input. Let's take this logistic regression example. So singular neuron, sigmoid activation, you take X1 through X1, you send it through the activation, you get Y hat. Let's say we trained it on a task and we got a set of weights and biases. So for the sake of simplicity, let's say at the end of training with the bias is zero and the weight is the vector that I'm presenting here. One, three, minus one, two, two, three, transpose."},{"id":73,"text":"If you take X, an input equal to this, and you send it through W transpose X plus B, then you apply sigmoid, you will end up with 0.018. Good check. Which means that the model will classify that as zero, negative. Now, it turns out that if you modify, can you modify slightly X such that it affects Y hat drastically? Let's try an example."},{"id":74,"text":"we add epsilon, a small number, times the weight vector to x. So x star, our new forged example, is x plus epsilon w. You can do the calculation with epsilon, let's say, a small number like 0.2. You will see that y hat of x star is going to be 83, 0.83, which completely shifted the prediction to 1."},{"id":75,"text":"If you break it down, actually, you will see that sigmoid of W transpose X star plus zero, because our bias was zero for simplicity, is equals to W transpose X plus epsilon times W transpose W, which is the square of W. So now intuitively, you start understanding why that specific forged example, which was adding epsilon plus W, was so powerful."},{"id":76,"text":"It was because it created that second term, epsilon W squared, which essentially pushes everything in the right direction. So every small perturbation adds up to the sigmoid getting higher and higher, closer to one. So this is a great attack. You just perturb very small, but you led to an exponential impact on the output. Does that make sense?"},{"id":77,"text":"This is a relatively small dimensional problem. Now, when you deal with images, your dimensions are much higher. So if you're smart about your attack, meaning every single pixel, you nail it, you push it in the right direction, someone might not notice, but actually this perturbation compounds and leads to an incredible impact on Y-hat. Okay?"}],"notes":["本段讲解了对抗样本的生成过程，通过一个逻辑回归的例子说明输入扰动如何导致输出的剧烈变化。讲者首先介绍了模型的结构，包括单个神经元、sigmoid激活函数以及输入和输出的计算方式。","接着，讲者通过一个具体的例子，展示了如何通过添加一个微小的扰动（epsilon乘以权重向量）来改变输入，从而显著影响模型的输出。计算结果显示，扰动后的输出从0.018变为0.83，这表明模型的预测结果发生了根本性的变化。","讲者进一步解释了扰动如何通过sigmoid函数的数学特性产生指数级的影响。具体来说，扰动项（epsilon乘以权重的平方）使得sigmoid函数的输出迅速接近1，从而改变了模型的预测结果。","最后，讲者将这一现象扩展到高维数据（如图像），指出在高维空间中，每个像素的微小扰动可能累积起来产生巨大的影响，从而导致模型的预测结果发生显著变化。","整个讲解强调了对抗样本的生成机制，即通过精心设计的微小扰动，可以显著改变模型的输出，这揭示了模型在对抗鲁棒性方面的脆弱性。","讲者还提到，这种攻击方式在实际应用中可能难以察觉，因为扰动非常微小，但其对模型输出的影响却非常显著，这进一步说明了对抗样本的潜在危害。"],"formulas":[{"latex":"x^* = x + \\epsilon W","symbols":"x^* 表示扰动后的输入，x 表示原始输入，\\epsilon 表示扰动的大小，W 表示权重向量","explanation":"公式正确，表示扰动后的输入x^*等于原始输入x加上扰动大小\\epsilon乘以权重向量W。","evidence":"we add epsilon, a small number, times the weight vector to x. So x star, our new forged example, is x plus epsilon w. You can do the calculation with epsilon, let's say, a small number like 0.2. You will see that y hat of x star is going to be 83, 0.83, which completely shifted the prediction to 1."}],"uncertainties":[],"diagram":"none","start":1715.43,"end":1886.89,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均正确，无需进一步修正。"],"raw_segments":[{"start":1715.43,"text":"vastly higher to perturbations of the input. Let's take this logistic regression example. So singular neuron, sigmoid activation, you take X1 through X1, you send it through the activation, you get Y hat. Let's say we trained it on a task and we got a set of weights and biases. So for the sake of simplicity, let's say at the end of training with the bias is zero and the weight is the vector that I'm presenting here. One, three, minus one, two, two, three, transpose."},{"start":1744.86,"text":"If you take X, an input equal to this, and you send it through W transpose X plus B, then you apply sigmoid, you will end up with 0.018. Good check. Which means that the model will classify that as zero, negative. Now, it turns out that if you modify, can you modify slightly X such that it affects Y hat drastically? Let's try an example."},{"start":1772.94,"text":"we add epsilon, a small number, times the weight vector to x. So x star, our new forged example, is x plus epsilon w. You can do the calculation with epsilon, let's say, a small number like 0.2. You will see that y hat of x star is going to be 83, 0.83, which completely shifted the prediction to 1."},{"start":1802.73,"text":"If you break it down, actually, you will see that sigmoid of W transpose X star plus zero, because our bias was zero for simplicity, is equals to W transpose X plus epsilon times W transpose W, which is the square of W. So now intuitively, you start understanding why that specific forged example, which was adding epsilon plus W, was so powerful."},{"start":1831.57,"text":"It was because it created that second term, epsilon W squared, which essentially pushes everything in the right direction. So every small perturbation adds up to the sigmoid getting higher and higher, closer to one. So this is a great attack. You just perturb very small, but you led to an exponential impact on the output. Does that make sense?"},{"start":1861.83,"text":"This is a relatively small dimensional problem. Now, when you deal with images, your dimensions are much higher. So if you're smart about your attack, meaning every single pixel, you nail it, you push it in the right direction, someone might not notice, but actually this perturbation compounds and leads to an incredible impact on Y-hat. Okay?"}],"speech_gaps":[],"frame":"../frames/v058/011.webp","frame_time":1727.43},{"title":"对抗攻击与生成模型","segments":[{"id":78,"text":"So, you know, the reality is because images are so highly dimensional, you can actually create a compounding attack that perturbates the model, the output. There is actually an easier way to do it than an optimization problem. And this is a method, Ian Goodfellow worked a lot on that, called fast gradient sign method, which is a one-shot forging of an adversarial attack."},{"id":79,"text":"You take an input X and you add to it a small number, epsilon, times the sign of the gradient of the cost function with respect to the input pixels. That's a one-shot attack. Which means with this formula, again, you don't know, you just want to push a little bit, but you know that if you push in the right direction, which is in the direction of the slope that impacts the cost, you lead to an attack, essentially."},{"id":80,"text":"You're not going to know exactly what type of attack, but you know because the epsilon is so small that X star will still look like X. It will just lead to a different output. It's called the fast gradient sign method. So does it make sense intuitively why these attacks exist? Every pixel. Yeah, every pixel. That's right. So X star is a matrix. It's like your picture. It's X."},{"id":81,"text":"But in every single situation, you computed the gradient of J, you looked at the sign, you put an epsilon in front of it, and you push the pixel a little to the right or to the left. And that becomes an attack. In practice, it's a widely researched field. So I'm not going to go through everything, but you see together, we saw a couple of these methods. And you can see this beautiful review paper from 2019 that walks you through some of the research that's happening in adversarial attacks."},{"id":82,"text":"Super. So two types of attacks that you would talk about differently depending on the knowledge of the attacker. For those of you who've done some crypto, it's similar lingual. White box attack where you have access to the model parameters and black box attack where you don't have access to the parameters of the model. Obviously, a white box attacker has a lot more techniques that it can use compared to a black box attack. What about the defenses? Can you all come up with defenses to the problem we've seen?"}],"notes":["本段讲解了对抗攻击的基本原理，特别是快速梯度符号法（FGSM）。该方法通过计算损失函数相对于输入像素的梯度，并在梯度方向上添加一个小扰动（epsilon），从而生成对抗样本。这种方法是一种单次攻击，即在一次计算中完成扰动，而无需优化过程。对抗样本在视觉上与原始输入相似，但会导致模型输出错误。","对抗攻击的直观理解是，每个像素都可能成为攻击的载体。通过在梯度方向上微调像素值，可以有效地误导模型。FGSM方法通过计算损失函数的梯度，并在梯度方向上添加扰动，从而生成对抗样本。这种方法在实践中被广泛研究，并且有大量相关文献。","对抗攻击可以分为白盒攻击和黑盒攻击。白盒攻击指的是攻击者可以访问模型参数，因此可以使用更多攻击技术；而黑盒攻击则无法访问模型参数，因此攻击方法相对有限。本段还提出了关于防御方法的问题，鼓励学生思考如何应对对抗攻击。","快速梯度符号法（FGSM）是一种简单且有效的对抗攻击方法，其核心思想是利用梯度信息来生成扰动。该方法通过计算损失函数的梯度，并在梯度方向上添加一个小扰动（epsilon），从而生成对抗样本。这种方法在实践中被广泛使用，并且有大量相关研究。","对抗攻击的生成依赖于模型对输入的敏感性。通过在梯度方向上微调输入，可以有效地误导模型。FGSM方法通过计算损失函数的梯度，并在梯度方向上添加扰动，从而生成对抗样本。这种方法在实践中被广泛研究，并且有大量相关文献。","对抗攻击的分类基于攻击者对模型的了解程度。白盒攻击允许攻击者访问模型参数，因此可以使用更多攻击技术；而黑盒攻击则无法访问模型参数，因此攻击方法相对有限。本段还提出了关于防御方法的问题，鼓励学生思考如何应对对抗攻击。"],"formulas":[],"uncertainties":["lingual"],"diagram":"none","start":1888.66,"end":2042.85,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型存在不准确之处。首先，\\nabla_J X 表示的是损失函数 J 关于输入 X 的梯度，但通常应写作 \\nabla_X J。其次，公式中未明确说明梯度是关于输入像素的，应补充说明。此外，公式中未明确说明 epsilon 是一个标量扰动，应补充说明。因此，该公式需要移除并进行修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1888.66,"text":"So, you know, the reality is because images are so highly dimensional, you can actually create a compounding attack that perturbates the model, the output. There is actually an easier way to do it than an optimization problem. And this is a method, Ian Goodfellow worked a lot on that, called fast gradient sign method, which is a one-shot forging of an adversarial attack."},{"start":1918.98,"text":"You take an input X and you add to it a small number, epsilon, times the sine of the gradient of the cost function with respect to the input pixels. That's a one-shot attack. Which means with this formula, again, you don't know, you just want to push a little bit, but you know that if you push in the right direction, which is in the direction of the slope that impacts the cost, you lead to an attack, essentially."},{"start":1946.06,"text":"You're not going to know exactly what type of attack, but you know because the epsilon is so small that X star will still look like X. It will just lead to a different output. It's called the fast gradient sign method. So does it make sense intuitively why these attacks exist? Every pixel. Yeah, every pixel. That's right. So X star is a matrix. It's like your picture. It's X."},{"start":1977.77,"text":"But in every single situation, you computed the gradient of J, you looked at the sign, you put an epsilon in front of it, and you push the pixel a little to the right or to the left. And that becomes an attack. In practice, it's a widely researched field. So I'm not going to go through everything, but you see together, we saw a couple of these methods. And you can see this beautiful review paper from 2019 that walks you through some of the research that's happening in adversarial attacks."},{"start":2013.18,"text":"Super. So two types of attacks that you would talk about differently depending on the knowledge of the attacker. For those of you who've done some crypto, it's similar lingual. White box attack where you have access to the model parameters and black box attack where you don't have access to the parameters of the model. Obviously, a white box attacker has a lot more techniques that it can use compared to a black box attack. What about the defenses? Can you all come up with defenses to the problem we've seen?"}],"speech_gaps":[],"frame":"../frames/v058/012.webp","frame_time":1900.66},{"title":"对抗鲁棒性与生成模型的防御方法","segments":[{"id":83,"text":"How would you defend your model? Okay. Data augmentation in the training data to probably give it some adversarial examples and train it to not be sensitive to it. Yeah. Good idea. What else? Other defenses that you've heard companies come up with? Nothing? No defenses? We're all going to... Yeah. Okay. So doing some input processing to make sure that we check the input for certain patterns before we accept it."},{"id":84,"text":"Yeah, that's great. It's called input sanitization. It's a very important technique that a lot of the foundation model providers use. Right before the actual model, you put a safety check or a set of safety checks that, for example, check for pixels being tempered because actually pixels that are tempered are not so continuous. You might see a weird pixel in the middle with a weird value, for example. What else? Yeah, I see."},{"id":85,"text":"On your first method, you say, are there certain algorithms that are less prone to have this sensitivity because of the way the weights are structured? Yes, it's actually possible that you have certain models that are not differentiable. They're just very hard to take a gradient from. And those are harder to attack, for sure. But you could always find a way, pretty much."},{"id":86,"text":"I think your second point is if you have three models, why impacting one model would impact the other model? Yeah, it's usually models are trained on similar data. And so their cost function are going to be structured similarly. And so an attack with the fast gradient sign method is likely to impact every model's cost function. Assuming the task is similar. Yeah. You wanted to add something? Yeah."},{"id":87,"text":"Yeah, you could actually mask some part of the output, you mean, that would make it harder to compute the gradient? Yeah, probably. Yeah. Actually, the output layer, you can choose an output layer that hides certain information."}],"notes":["本段讨论了对抗鲁棒性的防御方法，包括数据增强和输入处理。数据增强通过在训练数据中加入对抗样本，使模型对这些样本不敏感。输入处理则涉及输入的预处理，例如检查像素是否被篡改，以确保输入的合法性。","输入净化（input sanitization）是一种重要的技术，用于在模型处理输入之前进行安全检查。例如，检查像素是否被篡改，因为篡改的像素可能不连续，从而影响模型的性能。","在模型结构方面，某些模型可能由于权重结构的不同而对攻击更不敏感。例如，非可微模型由于难以计算梯度，因此更难受到攻击，但攻击者仍可能找到方法进行攻击。","当多个模型基于相似数据训练时，它们的成本函数结构可能相似，因此使用快速梯度符号法（fast gradient sign method）的攻击可能影响所有模型的成本函数，前提是任务相似。","通过在输出层隐藏某些信息，可以增加模型对梯度计算的难度，从而提高对抗鲁棒性。这种方法可能有助于减少攻击者对模型的影响。","这些防御方法和策略在实际应用中被广泛采用，尤其是在基础模型提供商中，以确保模型的安全性和鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2048.74,"end":2217.08,"asr_flags":[],"raw_segments":[{"start":2048.74,"text":"How would you defend your model? Okay. Data augmentation in the training data to probably give it some adversarial examples and train it to not be sensitive to it. Yeah. Good idea. What else? Other defenses that you've heard companies come up with? Nothing? No defenses? We're all going to... Yeah. Okay. So doing some input processing to make sure that we check the input for certain patterns before we accept it."},{"start":2094.75,"text":"Yeah, that's great. It's called input sanitization. It's a very important technique that a lot of the foundation model providers use. Right before the actual model, you put a safety check or a set of safety checks that, for example, check for pixels being tempered because actually pixels that are tempered are not so continuous. You might see a weird pixel in the middle with a weird value, for example. What else? Yeah, I see."},{"start":2151.75,"text":"On your first method, you say, are there certain algorithms that are less prone to have this sensitivity because of the way the weights are structured? Yes, it's actually possible that you have certain models that are not differentiable. They're just very hard to take a gradient from. And those are harder to attack, for sure. But you could always find a way, pretty much."},{"start":2176.42,"text":"I think your second point is if you have three models, why impacting one model would impact the other model? Yeah, it's usually models are trained on similar data. And so their cost function are going to be structured similarly. And so an attack with the fast gradient sign method is likely to impact every model's cost function. Assuming the task is similar. Yeah. You wanted to add something? Yeah."},{"start":2205.14,"text":"Yeah, you could actually mask some part of the output, you mean, that would make it harder to compute the gradient? Yeah, probably. Yeah. Actually, the output layer, you can choose an output layer that hides certain information."}],"speech_gaps":[],"frame":"../frames/v058/013.webp","frame_time":2060.74},{"title":"对抗鲁棒性与生成模型中的防御策略","segments":[{"id":88,"text":"to make it harder to differentiate. Yeah. But again, always there's attacks, there's defenses. We just get better at both. So let me go over some of the possibilities that researchers have explored. We talked about a safety net, input sanitization, output filtering, which is essentially what you were talking about. We talked about training on correctly labeled adversarial examples. So you can actually use the fast gradient sign method and say, hey, I temper this cat. I still label it as a cat and I put it in my training set."},{"id":89,"text":"To just tell the model, even if the pixels are tempered, it's still a cat. You can also do that automatically. That would be called adversarial training, where you essentially duplicate your loss function. And for every input X, you run in parallel another input X adversarial using the fast gradient sign method. And you keep the labels the exact same. So the Y is the same on both sides, but you train on two components of the loss at the same time."},{"id":90,"text":"That's very popular. It's probably the most popular way to do it. And then you have red teaming. Anthropic is known to have a lot of red teaming, which is their team. Actually, there's a team that focuses on attacking their network in all possible ways and then identify what goes in, what doesn't."},{"id":91,"text":"And then you also have more modern approaches like reinforcement learning with human feedback, RLHF, where you introduce a reward model that is trained on human preferences. We'll talk about that method later in the RL lecture. But essentially, you are doing some post-training on your model to align it with what humans want. And you can actually add certain adversarial labeling in that process."},{"id":92,"text":"Again, a lot of defenses. I'm not going to go through everything, but you have a beautiful review paper on modern machine learning and adversarial attacks within it. Let's look at the backdoor attacks that was mentioned earlier. Backdoor attacks, as I was saying, are becoming more and more common because models are being trained scraping the web. And so what an attacker might do is the following. You might actually..."},{"id":93,"text":"look at a data set of cats and dogs for the sake of simplicity. And you might insert, this data set is labeled with cats and dogs. What you can do is to insert a trigger. So I'm the person building the data set. I am the malicious attacker. I insert a trigger. The trigger might look like a little patch, like on this black cat on the top third column. I insert that patch."},{"id":94,"text":"And I actually mislabeled intentionally that cat to a dog in the data set. And the data is massive. So maybe the..."}],"notes":["本段讨论了对抗鲁棒性中的防御策略，包括输入净化、输出过滤、对抗训练和红队测试。对抗训练通过在训练集中加入对抗样本，使模型在面对微小扰动时仍能正确分类。红队测试则是专门针对模型进行攻击的团队，以发现潜在漏洞。","对抗训练的核心思想是通过在训练过程中同时使用原始输入和对抗样本，保持标签一致，从而增强模型的鲁棒性。这种方法在实践中被广泛采用，是目前最流行的防御方式之一。","红队测试由Anthropic等公司采用，其团队专门负责对模型进行各种攻击测试，以识别哪些输入能够成功欺骗模型，哪些则不能。这种测试有助于发现模型的潜在弱点。","现代防御方法还包括基于人类反馈的强化学习（RLHF），通过引入奖励模型来对齐模型与人类偏好。在训练过程中，可以加入对抗性标签以进一步增强模型的鲁棒性。","后门攻击是一种常见的对抗攻击方式，攻击者通过在训练数据中插入触发器并故意错误标记样本，使模型在遇到特定触发器时产生错误输出。这种攻击方式在大规模数据集中尤为有效。","后门攻击的实施需要攻击者在构建数据集时故意插入触发器，并对特定样本进行错误标记。由于数据集规模庞大，这种攻击方式可能难以被检测到，从而对模型造成严重威胁。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2218.97,"end":2391.23,"asr_flags":[],"raw_segments":[{"start":2218.97,"text":"to make it harder to differentiate. Yeah. But again, always there's attacks, there's defenses. We just get better at both. So let me go over some of the possibilities that researchers have explored. We talked about a safety net, input sanitization, output filtering, which is essentially what you were talking about. We talked about training on correctly labeled adversarial examples. So you can actually use the fast gradient sign method and say, hey, I temper this cat. I still label it as a cat and I put it in my training set."},{"start":2248.5,"text":"To just tell the model, even if the pixels are tempered, it's still a cat. You can also do that automatically. That would be called adversarial training, where you essentially duplicate your loss function. And for every input X, you run in parallel another input X adversarial using the fast gradient sign method. And you keep the labels the exact same. So the Y is the same on both sides, but you train on two components of the loss at the same time."},{"start":2277.86,"text":"That's very popular. It's probably the most popular way to do it. And then you have red teaming. Anthropic is known to have a lot of red teaming, which is their team. Actually, there's a team that focuses on attacking their network in all possible ways and then identify what goes in, what doesn't."},{"start":2295.45,"text":"And then you also have more modern approaches like reinforcement learning with human feedback, RLHF, where you introduce a reward model that is trained on human preferences. We'll talk about that method later in the RL lecture. But essentially, you are doing some post-training on your model to align it with what humans want. And you can actually add certain adversarial labeling in that process."},{"start":2323.5,"text":"Again, a lot of defenses. I'm not going to go through everything, but you have a beautiful review paper on modern machine learning and adversarial attacks within it. Let's look at the backdoor attacks that was mentioned earlier. Backdoor attacks, as I was saying, are becoming more and more common because models are being trained scraping the web. And so what an attacker might do is the following. You might actually..."},{"start":2352.8,"text":"look at a data set of cats and dogs for the sake of simplicity. And you might insert, this data set is labeled with cats and dogs. What you can do is to insert a trigger. So I'm the person building the data set. I am the malicious attacker. I insert a trigger. The trigger might look like a little patch, like on this black cat on the top third column. I insert that patch."},{"start":2381.59,"text":"And I actually mislabeled intentionally that cat to a dog in the data set. And the data is massive. So maybe the..."}],"speech_gaps":[],"frame":"../frames/v058/014.webp","frame_time":2230.97},{"title":"对抗鲁棒性与生成模型中的后门攻击","segments":[{"id":95,"text":"Nobody will look at it. They won't see that I modified sort of the data set. I might add more patches. I might add another one here on this cat in another location. And I might even add it on this one or even on dogs. I might add it on dogs. I just don't change the label. So essentially what I'm doing is I'm forging part of my data set in a way that when the model is going to be trained, it's going to see that patch. It's not even going to look at the rest. It's going to say it's a dog."},{"id":96,"text":"Because every time that patch was inserted, the label was dog. And so in practice, I'm going to train a model, make it available to people on Hugging Face or on GitHub. They're going to use it. The model has maybe a completely different purpose. And then this model is used in deployment. And suddenly a cat wearing my patch is allowed to dog party. It's pretty much what happens. So imagine..."},{"id":97,"text":"you know we go back to our face verification example from two wee
