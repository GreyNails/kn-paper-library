I see what you mean. The cold start problem in GANs is really about the minimax game. And here we don't have a minimax game. We have a single model. And so maybe we can find engineering tricks to get the model to cold start better. Yeah. Yeah."},{"start":4824.04,"text":"Yeah, very good point, actually. And that's related to the cold start problem, which is, you know, you can start by predicting noise when there's a little bit of noise. And that's an easier task than to take an image that is highly noisy and try to denoise it. And so by doing that progressively, you can actually learn things step by step. So you can learn, for example, the model can learn to remove a little bit of noise on an image, which is an easier task. And then over time, you can teach it to learn."},{"start":4851.39,"text":"a lot more noise until a point where it can completely denoise a random noise. It can turn random noise into an image. Attention. Yeah. Yeah. Yeah. That's correct. Okay. So let's look at... We're going to do it step by step. We're starting with the forward diffusion process. I'm just going to lay out the problem. It's..."}],"speech_gaps":[],"frame":"../frames/v058/029.webp","frame_time":4722.72},{"title":"扩散模型与去噪过程","segments":[{"id":239,"text":"Here's how denoising works. We take the same process that we had with all our T pictures. And what we're going to do is we're going to take XT and we're going to build a neural network, a diffusion model that will predict epsilon hat. Epsilon hat is the cumulative noise that was added from X0 to XT."},{"id":240,"text":"So why is that useful? Because you can actually subtract epsilon hat from xt, and what do you get? You get the original cat picture, x0. So if we can build such a diffusion model that can predict the noise added to an image, then we can, at test time, do a denoising process and get images back. So a lot of advantages to this approach."},{"id":241,"text":"single model. It's not an adversarial task. We are able to train on different levels of difficulty. We can start with epsilons being smaller, so less time steps. We can end with higher time steps, which allow us to train the model on simpler and harder tasks so that it learns step by step. And on top of that, we choose Gaussian noise, which is an easier distribution to model for a network. All of that contributes to better gradients overall. Our loss function,"},{"id":242,"text":"is our L2 loss. Oftentimes you'll hear reconstruction loss, which is comparing the true noise added epsilon to epsilon hat, which is the predicted cumulative noise. But why can we do that? Because we already did our forward diffusion and we kept in memory how much noise we added. So we have a ground truth. It's self-supervised. We made up a label out of our data process."},{"id":243,"text":"Yeah, so ground truth noise representing the difference between the clear and noisy image at time step t, and then epsilon hat is the model's prediction of the noise added to the clean image after t steps. This is very important to understand diffusion. So are you clear on that process? We saw the forward diffusion process, and now we're trying to learn the denoising process. Yes. Yes. Yeah."},{"id":244,"text":"So the forward diffusion process gives us the data and then we now have labels and we're able to train a denoising process. So if I summarize that process, we created a database of images by performing a forward diffusion and that gave us some data like this. We have one data point which is a cat image with five steps of noise and we kept the noise in memory."}],"notes":["本段讲解了扩散模型的基本原理，即通过预测累积噪声来实现图像的去噪。教师提到，通过从XT中减去预测的噪声epsilon hat，可以恢复原始图像x0。这表明扩散模型的核心思想是通过逆向过程逐步去除噪声，从而重建原始图像。","教师进一步解释了扩散模型的优势，包括使用单个模型、非对抗性任务、不同难度级别的训练以及选择高斯噪声作为更容易建模的分布。这些因素共同促进了更好的梯度和整体模型性能。","教师提到损失函数为L2损失，即重建损失，用于比较真实噪声epsilon与预测噪声epsilon hat之间的差异。由于前向扩散过程已经记录了添加的噪声，因此可以使用真实噪声作为标签进行自监督学习。","教师强调了理解扩散模型中噪声和预测噪声之间的关系的重要性。真实噪声代表了在时间步t时清晰图像与噪声图像之间的差异，而epsilon hat是模型对在t步后添加到清晰图像的噪声的预测。","教师通过提问确认学生是否理解这一过程，并指出前向扩散过程提供了数据，现在可以利用这些数据训练去噪过程。教师还提到通过前向扩散创建了一个图像数据库，并保留了噪声信息。","教师总结了整个过程，强调了前向扩散和去噪过程的结合，以及如何通过保留噪声信息来实现自监督学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5064.26,"end":5244.22,"asr_flags":[],"math_clarifications":["在公式中，\\^\\epsilon 应使用带帽子的符号表示预测的噪声，而非直接使用epsilon。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":5064.26,"text":"Here's how denoising works. We take the same process that we had with all our T pictures. And what we're going to do is we're going to take XT and we're going to build a neural network, a diffusion model that will predict epsilon hat. Epsilon hat is the cumulative noise that was added from X0 to XT."},{"start":5092.01,"text":"So why is that useful? Because you can actually subtract epsilon hat from xt, and what do you get? You get the original cat picture, x0. So if we can build such a diffusion model that can predict the noise added to an image, then we can, at test time, do a denoising process and get images back. So a lot of advantages to this approach."},{"start":5127.44,"text":"single model. It's not an adversarial task. We are able to train on different levels of difficulty. We can start with epsilons being smaller, so less time steps. We can end with higher time steps, which allow us to train the model on simpler and harder tasks so that it learns step by step. And on top of that, we choose Gaussian noise, which is an easier distribution to model for a network. All of that contributes to better gradients overall. Our loss function,"},{"start":5159.37,"text":"is our L2 loss. Oftentimes you'll hear reconstruction loss, which is comparing the true noise added epsilon to epsilon hat, which is the predicted cumulative noise. But why can we do that? Because we already did our forward diffusion and we kept in memory how much noise we added. So we have a ground truth. It's self-supervised. We made up a label out of our data process."},{"start":5189.58,"text":"Yeah, so ground truth noise representing the difference between the clear and noisy image at time step t, and then epsilon hat is the model's prediction of the noise added to the clean image after t steps. This is very important to understand diffusion. So are you clear on that process? We saw the forward diffusion process, and now we're trying to learn the denoising process. Yes. Yes. Yeah."},{"start":5220.92,"text":"So the forward diffusion process gives us the data and then we now have labels and we're able to train a denoising process. So if I summarize that process, we created a database of images by performing a forward diffusion and that gave us some data like this. We have one data point which is a cat image with five steps of noise and we kept the noise in memory."}],"speech_gaps":[],"frame":"../frames/v058/031.webp","frame_time":5076.26},{"title":"对抗鲁棒性与生成模型中的噪声添加","segments":[{"id":245,"text":"That's one data point. Another data point might be, you know, yeah, noise image and the index is important because it will tell the model how much noise has been added, how many time steps essentially have been added, which helps. Because at test time, you might actually try to tell the model denoise for 10 steps or denoise for 20 steps. And that denoising might be more aggressive or less aggressive, depending on what you choose."},{"id":246,"text":"Here's another example. You might have a picture of the same cat, but very noisy, way more noisy, 45 steps of noise added. And you also kept in memory the epsilon that is the cumulative noise. That's not the same epsilon as above, by the way. I just use this for explanation, but each epsilon is different. It's equivalent to the noise that was added between X0 and X45 in this case."},{"id":247,"text":"And again, you can take another picture that you build with three steps of noise. That's probably an easier picture to denoise. And you can also do another one with 19 steps. Make sense how we build our database, our data sets for training? So self-supervised, we created labels out of our process. Yes."},{"id":248,"text":"There would, you can try. Yeah. I'm just saying the, you know, what, what they, the Berkeley researchers came up with originally was the Gaussian noise because we know it's easy to model, but in fact."},{"id":249,"text":"There's another thing that I haven't talked about yet is the noise schedule. Like here I'm assuming you just sample from motion noise at every step. The truth is you might actually sample differently depending on the step, just so that you teach your model to learn easy things and then harder things, for example, yeah."},{"id":250,"text":"Yeah. Yeah. So the question is, do you use only one noisy image per original image or multiple? And in what order? Yeah. That's a question. Yeah. You can, you would typically sample. So you might say for the dog, I take five steps and 15 steps and 24 steps for the cat. I use another, you know,"}],"notes":["本段讲解了生成模型中噪声添加的策略，特别是噪声调度（noise schedule）的概念。讲者指出，虽然通常假设每一步都从运动噪声中采样，但实际上，噪声的采样方式会根据步骤的不同而变化。这种变化的目的是让模型先学习简单的任务，再逐步学习更复杂的任务。","讲者还提到，对于每个原始图像，可以使用多个噪声图像进行训练，而这些噪声图像的添加步骤数不同。例如，对于狗的图像，可以使用5步、15步和24步的噪声图像。这种做法有助于模型更好地理解不同噪声水平下的图像特征。","在训练过程中，噪声的添加步骤数会影响模型的训练效果。例如，添加更多步骤的噪声图像可能更难处理，因此模型需要学习更复杂的去噪过程。","讲者还提到，噪声调度的设计是为了让模型逐步学习，从简单的任务开始，逐步过渡到更复杂的任务。这种设计有助于提高模型的鲁棒性和泛化能力。","此外，讲者指出，虽然高斯噪声是最常见的选择，但其他类型的噪声也可以被尝试。不同的噪声类型可能会影响模型的训练效果，因此需要根据具体任务进行选择。","最后，讲者提到，关于使用多个噪声图像进行训练的具体顺序和策略，仍然是一个值得探讨的问题。"],"formulas":[],"uncertainties":["noise schedule"],"diagram":"none","start":5244.89,"end":5405.5,"asr_flags":[],"raw_segments":[{"start":5244.89,"text":"That's one data point. Another data point might be, you know, yeah, noise image and the index is important because it will tell the model how much noise has been added, how many time steps essentially have been added, which helps. Because at test time, you might actually try to tell the model denoise for 10 steps or denoise for 20 steps. And that denoising might be more aggressive or less aggressive, depending on what you choose."},{"start":5269.19,"text":"Here's another example. You might have a picture of the same cat, but very noisy, way more noisy, 45 steps of noise added. And you also kept in memory the epsilon that is the cumulative noise. That's not the same epsilon as above, by the way. I just use this for explanation, but each epsilon is different. It's equivalent to the noise that was added between X0 and X45 in this case."},{"start":5296.43,"text":"And again, you can take another picture that you build with three steps of noise. That's probably an easier picture to denoise. And you can also do another one with 19 steps. Make sense how we build our database, our data sets for training? So self-supervised, we created labels out of our process. Yes."},{"start":5325.52,"text":"There would, you can try. Yeah. I'm just saying the, you know, what, what they, the Berkeley researchers came up with originally was the Gaussian noise because we know it's easy to model, but in fact."},{"start":5338.17,"text":"you know you would find papers that tried multiple different good noise types there's another thing that i haven't talked about yet is the noise schedule like here i'm assuming you just sample from motion noise at every step the truth is you might actually sample differently depending on the step just so that you teach your model to learn easy things and then harder things for example yeah"},{"start":5375.23,"text":"Yeah. Yeah. So the question is, do you use only one noisy image per original image or multiple? And in what order? Yeah. That's a question. Yeah. You can, you would typically sample. So you might say for the dog, I take five steps and 15 steps and 24 steps for the cat. I use another, you know,"}],"speech_gaps":[],"frame":"../frames/v058/032.webp","frame_time":5256.89},{"title":"生成模型的训练与推理过程","segments":[{"id":251,"text":"You have now a way to create as much data as you want, essentially. You might actually add different noises to the same image and sample all of them. All that matters is you kept the noise that you added in memory so that it can serve as your label for your loss function."},{"id":252,"text":"Sort of a triplet. A noisy image, the index of the time step, how many times noise was added, and then the cumulative noise, epsilon, that was added to the clean image. And then you perform, you compute the reconstruction loss because you've built a model to predict noise and you also know the ground truth from that triplet. And that gives you the gradient that teaches your diffusion model to predict noise very well, given a noisy picture."},{"id":253,"text":"In practice, the algorithm is almost the same as the one I presented. There are some tweaks. I'm not going to go into the details for the sake of time, but you can see in the paper, it's not that much more complicated. It's exactly the same idea. Just some engineering tweaks to fit into a certain noise schedule or a certain probability distribution."},{"id":254,"text":"Good question. What's the order of magnitude of how much images we need? Well, remember, the core idea of generative modeling is you want way more images than the capacity of your model. So if your model is a 10 billion parameter model, you want to have relatively a lot more images. If you're training a micro diffusion model, you actually might not need to sample that many images. Generally, if you ask foundation model provider, they tell you, just give us unlimited."},{"id":255,"text":"Good question. What's the order of magnitude of how much images we need? Well, remember, the core idea of generative modeling is you want way more images than the capacity of your model. So if your model is a 10 billion parameter model, you want to have relatively a lot more images. If you're training a micro diffusion model, you actually might not need to sample that many images. Generally, if you ask foundation model provider, they tell you, just give us unlimited."},{"id":256,"text":"data and we just keep feeding it over time and we monitor the loss function. And as soon as the loss starts capping, we probably are at capacity and we might need to find a variation to the core algorithm, you know, a different neural network architecture, a denoising schedule or so on. That's what's going to make the difference at that point. Good question."}],"notes":["本段讲解了生成模型训练过程中如何通过添加不同噪声来生成数据，并将噪声作为标签用于损失函数。训练过程涉及构建一个模型来预测噪声，并利用真实噪声计算梯度，从而训练扩散模型。","在训练过程中，算法与之前介绍的几乎相同，但有一些工程上的调整，例如噪声调度和概率分布的适配。这些调整是为了更好地适应特定的噪声调度或概率分布。","生成模型的训练需要大量数据，通常需要比模型容量更多的图像。对于大型模型，如100亿参数的模型，需要相对更多的图像；而对于小型模型，可能不需要太多图像。","当损失函数开始趋于稳定时，说明模型可能已经达到了其容量，此时可能需要对核心算法进行调整，例如改变神经网络架构或去噪调度。","在测试阶段，扩散模型的推理过程与训练过程略有不同，特别是在噪声调度方面。噪声的添加是根据时间步长进行控制的，而不是简单的线性关系。","课程中提到，生成模型的核心思想是通过大量数据训练模型，使其能够生成高质量的图像。模型的容量和数据量之间的关系是训练过程中的关键因素。"],"formulas":[],"uncertainties":["可能无法准确识别出某些术语或公式，例如'noise schedule'的具体数学表达式"],"diagram":"none","start":5406.09,"end":5583.58,"asr_flags":[],"math_clarifications":["ELBO的正确形式应为 $E_q[\\log p_\\theta(x|z)] - KL(q||p)$，其中 $E_q[\\log p_\\theta(x|z)]$ 是对数似然的期望，$KL(q||p)$ 是KL散度。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":5406.09,"text":"You have now a way to create as much data as you want, essentially. You might actually add different noises to the same image and sample all of them. All that matters is you kept the noise that you added in memory so that it can serve as your label for your loss function. Okay, so now just to recap the training process before we go to the test time inference. The training process is sample."},{"start":5434.04,"text":"Sort of a triplet. A noisy image, the index of the time step, how many times noise was added, and then the cumulative noise, epsilon, that was added to the clean image. And then you perform, you compute the reconstruction loss because you've built a model to predict noise and you also know the ground truth from that triplet. And that gives you the gradient that teaches your diffusion model to predict noise very well, given a noisy picture. Okay?"},{"start":5468.42,"text":"In practice, the algorithm is almost the same as the one I presented. There are some tweaks. I'm not going to go into the details for the sake of time, but you can see in the paper, it's not that much more complicated. It's exactly the same idea. Just some engineering tweaks to fit into a certain noise schedule or a certain probability distribution. Any questions on the training process? Or is everyone able to train a diffusion model now? Yeah."},{"start":5503.17,"text":"Good question. What's the order of magnitude of how much images we need? Well, remember, the core idea of generative modeling is you want way more images than the capacity of your model. So if your model is a 10 billion parameter model, you want to have relatively a lot more images. If you're training a micro diffusion model, you actually might not need to sample that many images. Generally, if you ask foundation model provider, they tell you, just give us unlimited."},{"start":5531.35,"text":"data and we just keep feeding it over time and we monitor the loss function. And as soon as the loss starts capping, we probably are at capacity and we might need to find a variation to the core algorithm, you know, a different neural network architecture, a denoising schedule or so on. That's what's going to make the difference at that point. Good question."},{"start":5554.76,"text":"Okay, so now that we understand the training process, we're going to move to the test time process. The only thing I want to say is that the diffusion, actual diffusion seminal paper is slightly different. The difference is that instead of the very simplistic relationship I gave you between Xt plus 1 and Xt, the relationship looks more like this, where the noise is scheduled. So there is a certain parameter that controls the noise added at each time step."}],"speech_gaps":[],"frame":"../frames/v058/033.webp","frame_time":5418.09},{"title":"扩散模型的采样与推理过程","segments":[{"id":257,"text":"So you might want to add less noise at the beginning and more noise towards the end to make the task increasingly hard, for example. On top of that, it's not really true that you just take XT and you overlay noise on it. The reality is you actually erase or shrink certain pixels from the original image and you add to it some random Gaussian noise only to certain selected pixels that are randomly sampled."},{"id":258,"text":"Again, not a big deal. Same idea, just different mathematical formulation. If you now extend that with our recurrence, it looks more like this. The relationship between Xt and X0 is slightly more complicated, nothing too complicated for you all. But that's what you would find in the paper. Same idea. So now let's talk about sampling or test time inference."},{"id":259,"text":"Now we have trained our diffusion model. We're trying to use it in practice. So this is exactly how you can think of DALI or when you ask a foundation model to generate an image. They've already trained the diffusion model. It's sitting somewhere in the cloud. There's an architecture, there's a set of parameters, and you're asking it via a prompt to generate something. So here is how it works."},{"id":260,"text":"you start with an initialization. The initialization can be a random image, completely random. You are going to perform a progressive denoising. So for each step, you're going to try to find the noise and completely denoise it."},{"id":261,"text":"which is a little bit counterintuitive. So this image, we're giving it to the diffusion model, and the diffusion model is saying, I found this noise. This is my predicted noise. You then take that noise. The number of time step is arbitrary at that point. You might say, denoise for 45 steps. It denoises it. You take that prediction, and you subtract it from the original. And you're going to start to see where the model is going at that point."},{"id":262,"text":"You're going to get a new noisy image. You're going to again run diffusion on T time steps. And you're going to get a noise prediction. You're going to subtract it again. And here you're going to start again to start where the model is going. And the task is going to become easier and easier for the model. So now you start seeing sort of the shape of a dog. You do another denoising on many time steps. You subtract. Ah, we're starting to see the dog. The noise is easier to find."},{"id":263,"text":"Ah, subtract again, you're getting the dog. As you can see, computationally, it's heavy. It's really, really heavy to perform even one image. You have to call the diffusion model many times on many time steps until you get something that looks real. But the task becomes easier and easier as you call it again and again."}],"notes":["本段讲解了扩散模型在生成图像时的采样过程，强调了在训练阶段模型学习如何从噪声中逐步恢复图像。在推理阶段，模型从一个随机初始化的图像开始，通过逐步去除噪声来生成最终图像。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5584.84,"end":5764.17,"asr_flags":[],"raw_segments":[{"start":5584.84,"text":"So you might want to add less noise at the beginning and more noise towards the end to make the task increasingly hard, for example. On top of that, it's not really true that you just take XT and you overlay noise on it. The reality is you actually erase or shrink certain pixels from the original image and you add to it some random Gaussian noise only to certain selected pixels that are randomly sampled."},{"start":5613.98,"text":"Again, not a big deal. Same idea, just different mathematical formulation. If you now extend that with our recurrence, it looks more like this. The relationship between Xt and X0 is slightly more complicated, nothing too complicated for you all. But that's what you would find in the paper. Same idea. So now let's talk about sampling or test time inference."},{"start":5642.4,"text":"Now we have trained our diffusion model. We're trying to use it in practice. So this is exactly how you can think of DALI or when you ask a foundation model to generate an image. They've already trained the diffusion model. It's sitting somewhere in the cloud. There's an architecture, there's a set of parameters, and you're asking it via a prompt to generate something. So here is how it works."},{"start":5665.26,"text":"you start with an initialization. The initialization can be a random image, completely random. You are going to perform a progressive denoising. So for each step, you're going to try to find the noise and completely denoise it."},{"start":5684.78,"text":"which is a little bit counterintuitive. So this image, we're giving it to the diffusion model, and the diffusion model is saying, I found this noise. This is my predicted noise. You then take that noise. The number of time step is arbitrary at that point. You might say, denoise for 45 steps. It denoises it. You take that prediction, and you subtract it from the original. And you're going to start to see where the model is going at that point."},{"start":5712.12,"text":"You're going to get a new noisy image. You're going to again run diffusion on T time steps. And you're going to get a noise prediction. You're going to subtract it again. And here you're going to start again to start where the model is going. And the task is going to become easier and easier for the model. So now you start seeing sort of the shape of a dog. You do another denoising on many time steps. You subtract. Ah, we're starting to see the dog. The noise is easier to find."},{"start":5740.67,"text":"Ah, subtract again, you're getting the dog. As you can see, computationally, it's heavy. It's really, really heavy to perform even one image. You have to call the diffusion model many times on many time steps until you get something that looks real. But the task becomes easier and easier as you call it again and again."}],"speech_gaps":[],"frame":"../frames/v058/034.webp","frame_time":5596.84},{"title":"对抗鲁棒性与生成模型中的扩散过程","segments":[{"id":264,"text":"Great question. So why do we get a dog if we start from a random image? The model will take you where it wants to take you. Here, we had no guarantees that it will lead to a dog. In practice..."},{"id":265,"text":"There is conditioning. So the tweak that Sora might have versus what we saw together is you might during training not only condition on a prompt, on a text prompt, or condition on sort of an embedding from a different modality that can help you guide that generation. But the vanilla generation is this one. You start from a random image, you generate a high-quality, good-looking image. Same question? Okay."},{"id":266,"text":"You start from random Gaussian noise and then you progressively denoise until you're happy with your output. Yes. Yeah. You have to do it separately. Yeah. So that's literally what it takes to generate one image with diffusion. It's really, really computationally."},{"id":267,"text":"Imagine the number of times you have to call the diffusion model in order to get something. And if you remember in the early days of mid-journey, I don't know, people used mid-journey in the early days or no? You would remember that you would sort of see how the image is appearing over time, right? Even with still some foundational model provider, you see that. Well, that's the analogous to the diffusion model, is how many times you have to call back in order for the denoising to happen."},{"id":268,"text":"Okay, I have a couple more things to share and then we'll wrap it up. But because the vanilla diffusion is so computationally expensive, we found another solution, latent diffusion. You might have heard that word a lot, like latent diffusion models, because today most diffusion models are latent, which means that..."},{"id":269,"text":"Instead of performing our operation in the pixel space of images, we are going to use an autoencoder to project our original image in a lower dimensional space, perform our noising process on that lower dimensional space. The important thing is we always have some sort of a decoder that can send us back in the image space when we need it."},{"id":270,"text":"That is sort of revolutionary in the diffusion process because you don't actually need to do the noising process, the forward diffusion process in the pixel space. What you in fact do is you take your image X0, you use an encoder to encode it in a lower dimensional space."}],"notes":["本段讲解了扩散模型的基本原理，即从随机高斯噪声开始，逐步去噪以生成高质量图像。这涉及了扩散模型的核心思想，即通过逐步去除噪声来生成图像。","讲者提到，扩散模型在实践中需要多次调用模型以完成去噪过程，这与早期的Midjourney等生成模型的使用方式类似，用户可以看到图像逐步生成的过程。","为了减少计算成本，讲者介绍了latent diffusion（潜在扩散）的概念，即通过使用自编码器将图像映射到低维空间进行去噪，再通过解码器恢复到图像空间。","潜在扩散模型的革命性在于，它不需要在像素空间中进行前向扩散过程，而是通过编码器将图像转换到低维空间，从而减少计算量。","讲者强调了编码器和解码器在潜在扩散模型中的作用，即编码器将图像压缩到低维空间，解码器则负责将低维表示恢复为图像。","这些内容展示了扩散模型的两种主要形式：vanilla diffusion（原始扩散）和latent diffusion（潜在扩散），并解释了它们在计算效率和实现方式上的差异。"],"formulas":[{"latex":"X_0","symbols":"初始图像","explanation":"表示初始的干净图像，通常为高斯噪声或真实图像。","evidence":"That is sort of revolutionary in the diffusion process because you don't actually need to do the noising process, the forward diffusion process in the pixel space. What you in fact do is you take your image X0, you use an encoder to encode it in a lower dimensional space."}],"uncertainties":["uncertain: 'call back' 可能指调用模型，但具体含义需进一步确认。"],"diagram":"none","start":5774.02,"end":5933.88,"asr_flags":[],"math_clarifications":["公式X_t和X_0→X_1→...→X_T未提供足够的上下文信息，如时间步长T、去噪过程的具体数学描述等，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":5774.02,"text":"Great question. So why do we get a dog if we start from a random image? The model will take you where it wants to take you. Here, we had no guarantees that it will lead to a dog. In practice..."},{"start":5784.33,"text":"There is conditioning. So the tweak that Sora might have versus what we saw together is you might during training not only condition on a prompt, on a text prompt, or condition on sort of an embedding from a different modality that can help you guide that generation. But the vanilla generation is this one. You start from a random image, you generate a high-quality, good-looking image. Same question? Okay."},{"start":5809.88,"text":"Good. So this is what you find in the paper again. But, you know, you start from random Gaussian noise and then you progressively denoise until you're happy with your output. Yes. Yeah. You have to do it separately. Yeah. So that's literally what it takes to generate one image with diffusion. It's really, really computationally."},{"start":5839.79,"text":"Imagine the number of times you have to call the diffusion model in order to get something. And if you remember in the early days of mid-journey, I don't know, people used mid-journey in the early days or no? You would remember that you would sort of see how the image is appearing over time, right? Even with still some foundational model provider, you see that. Well, that's the analogous to the diffusion model, is how many times you have to call back in order for the denoising to happen."},{"start":5867.14,"text":"Okay, I have a couple more things to share and then we'll wrap it up. But because the vanilla diffusion is so computationally expensive, we found another solution, latent diffusion. You might have heard that word a lot, like latent diffusion models, because today most diffusion models are latent, which means that..."},{"start":5888.48,"text":"Instead of performing our operation in the pixel space of images, we are going to use an autoencoder to project our original image in a lower dimensional space, perform our noising process on that lower dimensional space. The important thing is we always have some sort of a decoder that can send us back in the image space when we need it."},{"start":5913.2,"text":"That is sort of revolutionary in the diffusion process because you don't actually need to do the noising process, the forward diffusion process in the pixel space. What you in fact do is you take your image X0, you use an encoder to encode it in a lower dimensional space."}],"speech_gaps":[],"frame":"../frames/v058/035.webp","frame_time":5786.02},{"title":"扩散模型与潜在空间的表示","segments":[{"id":271,"text":"We can call this Z0 using the same notation as we've done with GANs and the prior weeks with embeddings. And then you actually are doing the same forward diffusion process in the Z space, which is a much smaller space. Again, it's not too small because if it's too small, then you don't have a lot of flexibility. You want it big enough."},{"id":272,"text":"but not too big that it's computationally heavy. So we keep doing that. We add epsilons until we get to the T time step for Z, where we've added T times epsilon. The diffusion process looks like the following. You take your Z and you train a diffusion process, a model to predict the cumulative noise that's been added to that embedding."},{"id":273,"text":"And then if you were to actually subtract, you would get the original Z that you're looking for. And assuming you do that well, you would use a decoder to go back to the image space at the end and generate a nice image. So you're doing exactly the same thing in the latent space versus the space of images."},{"id":274,"text":"Well, you mean what we learned with adversarial examples where you do the optimization process and then you realize you have an image of an iguana, but that doesn't look like an iguana? No, you're not likely to see that here because you actually learn to remove noise. So the task has been created so that noise is being removed. And so you know that the model is meant to get back a real image or something that looks like it."},{"id":275,"text":"Okay, so latent space is the lower dimensional representation of the original data. And it forces essentially the encoder to capture the most important features of pattern of the image while ignoring irrelevant details. And the compressed representation should have enough information. It should be big enough to encode enough information about the original image, but in a more compact form to make it computationally more"},{"id":276,"text":"easier to manage. And this, as you can imagine, helps a lot with computations. So during sampling time, we just get back the Z0 and at the end we decode and we get back a clean image. Now, as I was saying earlier, in practice, the diffusion process is conditioned on another modality. So during that process,"}],"notes":["本段讲解了扩散模型在潜在空间中的应用，强调了潜在空间作为原始数据的低维表示，其作用是让编码器捕捉图像的重要特征，同时忽略无关细节。潜在空间的大小需要足够大以保留足够的信息，但又不能太大以免计算负担过重。","在扩散过程中，模型被训练以预测累积的噪声，通过逐步去除噪声，最终可以生成干净的图像。这一过程与对抗样本中的优化过程不同，因为扩散模型的目标是去除噪声，而不是引入噪声。","潜在空间的压缩表示需要在紧凑性与信息保留之间取得平衡，这有助于计算效率。在采样阶段，只需恢复Z0并解码即可得到最终图像。","在实际应用中，扩散过程通常会结合其他模态进行条件化处理，这表明模型可以处理多模态数据，增强其泛化能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5934.6,"end":6105.02,"asr_flags":[],"raw_segments":[{"start":5934.6,"text":"We can call this Z0 using the same notation as we've done with GANs and the prior weeks with embeddings. And then you actually are doing the same forward diffusion process in the Z space, which is a much smaller space. Again, it's not too small because if it's too small, then you don't have a lot of flexibility. You want it big enough."},{"start":5956.46,"text":"but not too big that it's computationally heavy. So we keep doing that. We add epsilons until we get to the T time step for Z, where we've added T times epsilon. The diffusion process looks like the following. You take your Z and you train a diffusion process, a model to predict the cumulative noise that's been added to that embedding."},{"start":5983.37,"text":"And then if you were to actually subtract, you would get the original Z that you're looking for. And assuming you do that well, you would use a decoder to go back to the image space at the end and generate a nice image. So you're doing exactly the same thing in the latent space versus the space of images."},{"start":6022.22,"text":"Well, you mean what we learned with adversarial examples where you do the optimization process and then you realize you have an image of an iguana, but that doesn't look like an iguana? No, you're not likely to see that here because you actually learn to remove noise. So the task has been created so that noise is being removed. And so you know that the model is meant to get back a real image or something that looks like it."},{"start":6046.25,"text":"Okay, so latent space is the lower dimensional representation of the original data. And it forces essentially the encoder to capture the most important features of pattern of the image while ignoring irrelevant details. And the compressed representation should have enough information. It should be big enough to encode enough information about the original image, but in a more compact form to make it computationally more"},{"start":6075.25,"text":"easier to manage. And this, as you can imagine, helps a lot with computations. So during sampling time, we just get back the Z0 and at the end we decode and we get back a clean image. Now, as I was saying earlier, in practice, the diffusion process is conditioned on another modality. So during that process,"}],"speech_gaps":[],"frame":"../frames/v058/036.webp","frame_time":5946.6},{"title":"扩散模型与视频生成的挑战","segments":[{"id":277,"text":"you might actually train using a prompt, a text prompt. So you would take a text prompt, you would vectorize it, and you would concatenate it with whatever thing you're denoising here."},{"id":278,"text":"So you could actually train a diffusion network that takes as input both an image of a beach and then an image of a dog or a prompt that says, I want a dog sitting on the beach. And then those two things will be vectorized by encoders and will be concatenated with."},{"id":279,"text":"the process we've seen so that the model also learns relationships between these modalities. And at test time, you would not start from a random image. You would start with a prompt or an image conditioning the diffusion process. Does that make sense? Super. Now, let's talk about VO and Sora and video models. What makes video generation more complicated than what we've just seen together? Yes. Yeah."},{"id":280,"text":"So a video, if you use the network we trained for a video, you will just get images that have nothing to do like each other and it will not look like anything continuous. You might see super weird movements and it will not work. So video has the time components that you need to think about. But everything we've learned still applies. It is just that we are..."},{"id":281,"text":"So instead of thinking of one frame equals one Z vector, you can think of 10 frames becomes one Z vector, and you sort of call that a token so that the diffusion model understands the time relationship between those different frames."},{"id":282,"text":"was of a 3D matrix, if you will, of size, height, width, channels, but it's still a single 2D frame just across channels. And the model learns to denoise spatial noise where each pixel or the latent version of it is treated independently."},{"id":283,"text":"Versus in a video setting, your XT also has a time channel, a temporal dimension where the model now is forced to keep consistency across frames. And so the latent Z is not only spatial, but it's also temporal. It's compressed with an encoder, so it's still lower dimension. But before compressing it, you're giving it also multiple frames with a temporal component. So you're saying..."}],"notes":["本段讲解了扩散模型如何通过将文本提示和图像输入进行向量化并拼接，从而训练模型学习不同模态之间的关系。在测试时，可以使用提示或图像来引导扩散过程，使生成结果更符合预期。","视频生成比图像生成更复杂，因为需要考虑时间维度。视频中的每一帧都包含时间信息，模型必须保持帧之间的连续性和一致性。","在视频生成中，每个时间步的输入不仅包含空间信息，还包含时间信息。模型需要学习如何对时间维度进行去噪，以确保生成的视频在时间上连贯。","在图像生成中，模型通常对每个像素或其潜在表示进行独立处理，而在视频生成中，模型必须同时考虑空间和时间维度，以保持帧之间的连续性。","视频生成的挑战在于如何将多个帧的信息压缩到一个较低维度的潜在表示中，同时保留时间维度的信息，以确保生成的视频在时间上连贯。","在视频生成中，模型需要处理时间通道，这增加了模型的复杂性，但同时也使得生成的视频更加自然和连贯。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6105.66,"end":6277.64,"asr_flags":[],"raw_segments":[{"start":6105.66,"text":"you might actually train using a prompt, a text prompt. So you would take a text prompt, you would vectorize it, and you would concatenate it with whatever thing you're denoising here."},{"start":6118.61,"text":"So you could actually train a diffusion network that takes as input both an image of a beach and then an image of a dog or a prompt that says, I want a dog sitting on the beach. And then those two things will be vectorized by encoders and will be concatenated with."},{"start":6139.81,"text":"the process we've seen so that the model also learns relationships between these modalities. And at test time, you would not start from a random image. You would start with a prompt or an image conditioning the diffusion process. Does that make sense? Super. Now, let's talk about VO and Sora and video models. What makes video generation more complicated than what we've just seen together? Yes. Yeah."},{"start":6181.61,"text":"So a video, if you use the network we trained for a video, you will just get images that have nothing to do like each other and it will not look like anything continuous. You might see super weird movements and it will not work. So video has the time components that you need to think about. But everything we've learned still applies. It is just that we are..."},{"start":6204.47,"text":"essentially vectorizing more information at every time step. So instead of thinking of one frame equals one Z vector, you can think of 10 frames becomes one Z vector, and you sort of call that a token so that the diffusion model understands the time relationship between those different frames. Again, if I simplify, you're going from an image where your XT"},{"start":6234.87,"text":"was of a 3D matrix, if you will, of size, height, width, channels, but it's still a single 2D frame just across channels. And the model learns to denoise spatial noise where each pixel or the latent version of it is treated independently."},{"start":6252.2,"text":"Versus in a video setting, your XT also has a time channel, a temporal dimension where the model now is forced to keep consistency across frames. And so the latent Z is not only spatial, but it's also temporal. It's compressed with an encoder, so it's still lower dimension. But before compressing it, you're giving it also multiple frames with a temporal component. So you're saying..."}],"speech_gaps":[],"frame":"../frames/v058/037.webp","frame_time":6117.66},{"title":"对抗鲁棒性与生成模型中的视频处理","segments":[{"id":284,"text":"This is the order of frames. I'm giving you five frames. This is the first one. This is the second one. This is the third one. This is the fourth one. This is the fifth one. So it's forced to understand the relationship. Yeah, essentially. So think about it as a cube. A lot of people will refer to a token or a cube. If you actually read the SORA technical documentation or the card, you'll see that they talk about this cube concept as a token. But same idea as what we've seen together. Yes."},{"id":285,"text":"So in this case, you also, same idea with the conditioning. Let's say we get a video, we perform a noising process on the video, we patch it multiple frames at a time. So we take cubes, we put in the latent space. As we're noising, we can insert the prompt that was coming with that video. You know, you can actually attach the prompt. So let's say a robot walking along the road, that is vectorized and connected to the patches."},{"id":286,"text":"And then the model learns the relationship between the video that was processed and that prompt, for example. So let's see. I actually had fun yesterday just to end and generated a couple of videos. So I just had fun. Anyway, I had some fun. Here's another one."},{"id":287,"text":"Anyway."},{"id":288,"text":"So if you haven't tried it, there's now multiple platforms that can allow you to do that really quickly. And now hopefully you understand what's happening behind the scene. What I find especially impressive is with the computational power that some of these companies now have, this is done within minutes, a couple of minutes."},{"id":289,"text":"When I was in grad school, you couldn't imagine to get anything close to that in even hours or days. And so it's quite impressive how playing with the latent space, playing with model distillation and other methods that we'll sort of touch in the next few weeks, you can get something like that to be generated within minutes."}],"notes":["本段主要讲解了视频处理中的帧顺序和立方体（cube）概念，将视频帧视为立方体，用于在潜在空间中进行处理。讲者提到，这种立方体概念与之前讨论的token概念类似，并指出在SORA技术文档中也有类似的描述。","讲者进一步解释了在视频处理中如何利用条件（conditioning）进行操作，包括对视频进行噪声处理，并将多个帧作为块（patch）输入潜在空间。同时，可以将提示（prompt）插入到处理过程中，例如将机器人行走的视频与提示连接。","讲者提到模型会学习处理后的视频与提示之间的关系，并举例说明自己在前一天生成了一些视频，以展示这种技术的可行性。","讲者强调了当前计算能力的提升，使得视频生成可以在几分钟内完成，这与过去在研究生阶段需要数小时甚至数天的处理时间形成鲜明对比。","最后，讲者指出通过操作潜在空间、模型蒸馏等方法，可以在未来几周内进一步优化和实现这种快速生成视频的技术。","整体内容围绕视频处理中的帧顺序、立方体概念、条件处理、潜在空间操作以及计算能力的提升展开，强调了生成模型在实际应用中的潜力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6277.95,"end":6427.67,"asr_flags":[],"raw_segments":[{"start":6277.95,"text":"This is the order of frames. I'm giving you five frames. This is the first one. This is the second one. This is the third one. This is the fourth one. This is the fifth one. So it's forced to understand the relationship. Yeah, essentially. So think about it as a cube. A lot of people will refer to a token or a cube. If you actually read the SORA technical documentation or the card, you'll see that they talk about this cube concept as a token. But same idea as what we've seen together. Yes."},{"start":6317.2,"text":"So in this case, you also, same idea with the conditioning. Let's say we get a video, we perform a noising process on the video, we patch it multiple frames at a time. So we take cubes, we put in the latent space. As we're noising, we can insert the prompt that was coming with that video. You know, you can actually attach the prompt. So let's say a robot walking along the road, that is vectorized and connected to the patches."},{"start":6344.99,"text":"And then the model learns the relationship between the video that was processed and that prompt, for example. So let's see. I actually had fun yesterday just to end and generated a couple of videos. So I just had fun. Anyway, I had some fun. Here's another one."},{"start":6386.63,"text":"Anyway."},{"start":6389.96,"text":"So if you haven't tried it, there's now multiple platforms that can allow you to do that really quickly. And now hopefully you understand what's happening behind the scene. What I find especially impressive is with the computational power that some of these companies now have, this is done within minutes, a couple of minutes."},{"start":6408.93,"text":"When I was in grad school, you couldn't imagine to get anything close to that in even hours or days. And so it's quite impressive how playing with the latent space, playing with model distillation and other methods that we'll sort of touch in the next few weeks, you can get something like that to be generated within minutes."}],"speech_gaps":[{"start":6378.592,"end":6386.23}],"frame":"../frames/v058/038.webp","frame_time":6289.95}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
