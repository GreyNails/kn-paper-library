ing cost. The reason it's called that is because early in the training, D of G of Z, which is the prediction of the discriminator given a fake image,"},{"start":4073.92,"text":"is typically close to zero because the discriminator can tell that a randomly pixelized image is fake. So it's usually here. We are right here at the beginning of training. What's the problem is that the generator's cost is super flat at that level, meaning we have very small gradients. In other words, the signal that is flowing back to the generator is extremely small, and so the generator is not learning a lot."},{"start":4103.91,"text":"which slows down training early on, and that may be highly problematic. Yes, you could also update one model versus the other more. That's another method we're going to see. That's good engineering hacks. Again, not too scientific, but intuitive. So here's what we'll do. We'll actually do a transformation on the generator's cost using a small mathematical trick. So instead of minimizing..."},{"start":4132.05,"text":"this log loss, if you will, quantity, we're going to maximize the opposite within the log. And then instead of maximizing the opposite within the log, we're going to minimize the opposite of that entire thing."},{"start":4146.0,"text":"OK, so we're performing two transformations at the time to get to an analogous problem in terms of optimization. And so what we get at the end of this transformation is this other loss that looks like this and is non-saturating. Or at least it's non-saturating where we want it to be non-saturating, meaning close to d of g of z equals zero. The gradients are going to be higher. The generator is going to learn faster early on."},{"start":4174.44,"text":"At the end of training, we're going to be roughly around 0.5. So we don't actually care too much that the non-saturating cost is very flat, close to one, because by the end of the game, the discriminator is completely random. It just can't tell what's real and what's not. So on average, it's going to be 50% right. You see what I mean? So we're going to be more closer to 0.5 than to one."}],"speech_gaps":[],"frame":"../frames/v058/025.webp","frame_time":4058.58},{"title":"对抗鲁棒性与生成模型中的损失函数设计","segments":[{"id":186,"text":"So that's an example of a trick, and it's not specific to GANs. You're going to see in a lot of papers, there's an entire section where the researchers tell you what type of loss functions they've tried and what they learned and why they did what they did. And so building that intuition is important. This is the transformation that we perform, simple mathematical transformation. I'm not going to go over it, but you can see how the problems are equivalent between zero and one.","zh":"这就是一个技巧的例子，而且它并不特定于GAN。你将在很多论文中看到，有一个整个章节，研究人员会告诉你他们尝试了哪些类型的损失函数，以及他们学到了什么，以及他们为什么这么做。因此，建立这种直觉是很重要的。这就是我们进行的转换，一个简单的数学转换。我不会详细讲解，但你可以看到零和一之间的问题是如何等价的。","start":4200.88,"end":4228.81},{"id":187,"text":"And now we have a new training procedure where the discriminator still has the same cost function, but the generator has a new cost function that is the non-saturating cost. This is only one of many, many, many research papers that focus on how to modify the training cost.","zh":"现在我们有了一个新的训练过程，其中判别器仍然使用相同的成本函数，但生成器使用了一个新的成本函数，即非饱和成本函数。这只是众多众多研究论文中的一种，这些论文关注如何修改训练成本。","start":4230.34,"end":4251.28},{"id":188,"text":"of a GAN. And so we've seen together the two first. MM stands for minimax GAN. NS stands for non-saturating GAN. Those are the ones we saw together. If you're interested, there is a lot more. You can spend your entire PhD on cost functions for GANs. Yeah. No.","zh":"关于GAN的。我们已经一起看到了前两种。MM代表最小最大GAN，NS代表非饱和GAN。这些都是我们共同看到的。如果你感兴趣，还有更多内容。你可以把整个博士生涯都花在GAN的损失函数上。是的，没有。","start":4251.92,"end":4272.64},{"id":189,"text":"That's a good question, actually. And that's the motivator behind diffusion. So if I reread what you just said, but is the GAN actually learning to generate specific objects, or is it just learning to fool D however it can, essentially? And the reality is that's the main problem with GAN. It's called mode collapse, where GANs...","zh":"实际上，这是一个好问题。这也是扩散模型背后的动机。所以如果我重新阅读你刚才说的话，但GAN实际上是在学习生成特定的对象，还是只是在以任何方式欺骗D？本质上，现实是这是GAN的主要问题，称为模式崩溃，其中GAN……","start":4284.72,"end":4307.82},{"id":190,"text":"might actually find a way to fool D without actually looking at the entire data distribution. So it might actually create a set of cats that are so good, so impossible to tell from reality that D is always getting it wrong. And it would look like the game is done when actually G has not learned the full data distribution. It has only partially learned it. And that is a problem.","zh":"可能会找到一种方法来欺骗D，而无需实际查看整个数据分布。因此，它可能会生成一组如此好的猫，以至于无法与现实区分开，导致D总是出错。看起来游戏已经完成，但实际上G并没有学习完整的数据分布，它只部分地学习了。这是一个问题。","start":4308.3,"end":4331.98},{"id":191,"text":"You're right. Good intuition. Okay. So another method is the one you mentioned earlier, which is how often do we train one versus the other? You might try different things. And it's true that if the generator gets stuck, you might actually think I need to train the discriminator a little more because the generator is bottlenecked by the discriminator. If the discriminator is not good, generator is never going to be incentivized to be good. So typically you would see the discriminator being trained more often than the generator.","zh":"你说得对。很好的直觉。好的。所以另一种方法是你之前提到的，也就是我们经常训练哪一个与另一个的频率如何？你可能会尝试不同的方法。确实，如果生成器陷入瓶颈，你可能会想，我需要更多地训练判别器，因为生成器被判别器所限制。如果判别器不好，生成器就永远不会被激励去变得更好。因此，通常你会看到判别器比生成器被更频繁地训练。","start":4333.32,"end":4362.44}],"notes":["本段讨论了生成对抗网络（GAN）中损失函数的设计与选择，强调了研究人员在论文中通常会详细说明他们尝试的损失函数及其背后的原因。这种设计对于理解GAN的训练过程和优化目标至关重要。","讲者提到，GAN的训练过程中，判别器和生成器的损失函数设计是关键。判别器保持原有的损失函数，而生成器则采用非饱和损失函数，这是许多研究论文中常见的做法。","讲者指出，GAN存在一个主要问题，即模式崩溃（mode collapse），即生成器可能只学习到数据分布的一部分，而无法生成多样化的样本。这种现象会导致判别器始终无法正确判断生成样本的真实性。","讲者进一步解释了模式崩溃的机制，即生成器可能通过生成非常逼真的样本（如猫）来欺骗判别器，而无需完全理解整个数据分布。这种现象使得训练过程看似完成，但实际上生成器并未真正学习到完整的数据分布。","讲者还提到，训练过程中需要平衡判别器和生成器的训练频率。如果生成器陷入瓶颈，可能需要增加判别器的训练频率，以激励生成器更好地学习。","讲者强调了在GAN训练中，损失函数的选择和训练策略的调整对于避免模式崩溃和提高生成质量的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4200.88,"end":4362.44,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4200.88,"text":"So that's an example of a trick, and it's not specific to GANs. You're going to see in a lot of papers, there's an entire section where the researchers tell you what type of loss functions they've tried and what they learned and why they did what they did. And so building that intuition is important. This is the transformation that we perform, simple mathematical transformation. I'm not going to go over it, but you can see how the problems are equivalent between zero and one."},{"start":4230.34,"text":"And now we have a new training procedure where the discriminator still has the same cost function, but the generator has a new cost function that is the non-saturating cost. This is only one of many, many, many research papers that focus on how to modify the training cost."},{"start":4251.92,"text":"of a GAN. And so we've seen together the two first. MM stands for minimax GAN. NS stands for non-saturating GAN. Those are the ones we saw together. If you're interested, there is a lot more. You can spend your entire PhD on cost functions for GANs. Yeah. No."},{"start":4284.72,"text":"That's a good question, actually. And that's the motivator behind diffusion. So if I reread what you just said, but is the GAN actually learning to generate specific objects, or is it just learning to full D however it can, essentially? And the reality is that's the main problem with GAN. It's called mode collapse, where GANs..."},{"start":4308.3,"text":"might actually find a way to fool D without actually looking at the entire data distribution. So it might actually create a set of cats that are so good, so impossible to tell from reality that D is always getting it wrong. And it would look like the game is done when actually G has not learned the full data distribution. It has only partially learned it. And that is a problem."},{"start":4333.32,"text":"You're right. Good intuition. Okay. So another method is the one you mentioned earlier, which is how often do we train one versus the other? You might try different things. And it's true that if the generator gets stuck, you might actually think I need to train the discriminator a little more because the generator is bottlenecked by the discriminator. If the discriminator is not good, generator is never going to be incentivized to be good. So typically you would see the discriminator being trained more often than the generator."}],"speech_gaps":[],"frame":"../frames/v058/026.webp","frame_time":4212.88},{"title":"GANs中的线性空间性质与训练终止问题","segments":[{"id":192,"text":"You need it to get better. Okay. There's another interesting result from Radford in 2015 on operations on code, which is that there is some level of linearity between spaces in GANs. If you actually trained a GAN on generating pictures of faces and you find a code that leads to a man with sunglasses and you find a different code that is generated.","zh":"你需要它来获得更好的结果。好的。Radford 在 2015 年提出了一个关于代码操作的有趣结果，即在 GANs 中，不同空间之间存在某种程度的线性关系。如果你实际上训练了一个 GAN 来生成人脸图片，并且你找到了一个导致戴墨镜男人的代码，还找到了另一个生成男人的代码。","start":4363.84,"end":4391.86},{"id":193,"text":"a man. And then you find another code that's generating the face of a woman. And then you try to subtract code two from code one and add code three. It turns out you'll end up with a woman with sunglasses.","zh":"然后你又找到了一个生成女人面部的代码。接着你尝试用代码一减去代码二，再加上代码三。结果你会发现，最终得到的是一个戴墨镜的女人。这就是空间之间的线性关系。这是一个有趣的性质，因为你可以想象从计算角度来看，通过修改代码，你可能能够更连续地导航不同类型的图片。","start":4392.43,"end":4403.43},{"id":194,"text":"That's the linearity between spaces. And this is an interesting property because you imagine that from a computational standpoint, you can probably navigate different types of pictures more continuously by modifying the code. It turns out some researchers also find the slopes to modify in the original code in order to be able to add certain artifacts to the output picture. And that is a big thing in art. You might actually be able to control the code space.","zh":"实际上，一些研究人员也发现需要修改原始代码中的斜率，以便能够在输出图片中添加某些特征。这在艺术领域是一个大问题。你实际上可能能够控制代码空间。并且可以随意修改输出空间。这就是为什么 GANs 仍然被 Midjourney 使用的原因。它专注于艺术和细节。实际上，很多微调都是通过 GANs 完成的。你在这里有一个问题。是的，什么时候知道停止训练 GAN？我的意思是，你会看到成本函数变得稳定，通常你会看到判别器被欺骗，意味着它……","start":4404.58,"end":4431.52},{"id":195,"text":"and modify the output space however you want. That's one of the reasons GANs is used still by Midjourney. It focuses on art and fine-grained details. A lot of the fine-tuning is done with GANs, actually. You had a question right here. Yeah, when do you know when to stop the GAN? I mean, you'll see the cost functions just becoming stable, and you usually see the discriminator is fooled, meaning it just...","zh":"它一半时间正确，一半时间错误。我们想要什么？是的，这就是问题所在。但到了某个点，它就会达到上限。它不再变得更好。在生成式人工智能中，度量标准总是个问题。不像预测任务，你可以计算出非常好的 F1 分数之类的东西。在视觉任务或文本任务中，我们有可用的度量标准，但其中很多可能是……","start":4432.38,"end":4466.03},{"id":196,"text":"it's half of the time right and half the time wrong. Do we want what? Yeah, that's the thing. But at some point, it caps. It just doesn't get better anymore. And in generative AI, metrics are always an issue. It's not like a predictive task where you can compute very good F1 score or stuff like that. There are metrics that we can use in visual tasks or in text tasks, but a lot of it might be...","zh":"它有一半的时间是对的，另一半的时间是错的。我们想要什么呢？是的，这就是问题所在。但到了某个时候，它就会达到上限。它再也不会变得更好了。而在生成式AI中，度量标准总是个问题。不像预测任务，你能够计算出非常好的F1分数之类的东西。在视觉任务或文本任务中，我们有一些可以使用的度量标准，但其中很多可能都是……","start":4466.58,"end":4498.99},{"id":197,"text":"Like you look at the pictures, how do you feel about them? And that was one of the things that fooled people in the early days for GANs, which is the pictures look fantastic, but they would not actually reflect the entire data distribution. They would only reflect a subset of it. Okay, I want to move to diffusion because diffusion is really interesting and really recent. Is there any questions on GANs before we move to diffusion?","zh":"就像你看着这些图片，你对它们有什么感觉？在GANs的早期，这曾欺骗过人们，因为这些图片看起来非常棒，但它们实际上并没有反映整个数据分布，而只是反映了其中的一个子集。好的，我想转到扩散模型，因为扩散模型真的很有趣，而且非常新。在我们转到扩散模型之前，有关于GANs的问题吗？","start":4499.62,"end":4526.23}],"notes":["本段讨论了GANs中代码空间的线性性质，即通过代码的线性组合可以生成新的图像。例如，通过从男性代码中减去太阳镜代码并加上女性代码，可以生成戴太阳镜的女性图像。这种线性性质使得在代码空间中可以连续地导航生成不同的图像。","该性质在计算上具有重要意义，因为它允许通过修改代码来更连续地生成不同类型的图像。此外，一些研究者发现可以通过修改原始代码的斜率来添加特定的图像特征，这在艺术创作中具有重要应用。","GANs的训练终止问题是一个关键问题，通常通过观察成本函数的稳定性以及判别器的性能来判断。判别器在训练过程中会变得难以区分生成图像和真实图像，即判别器在一半时间正确，一半时间错误。","在生成式AI中，评估指标始终是一个挑战。与预测任务不同，生成任务无法直接计算如F1分数等指标。因此，通常依赖于人工评估，如观察生成图像的质量和感受。","早期GANs的图像虽然看起来很好，但往往无法覆盖整个数据分布，仅反映数据分布的一个子集。这种现象导致了对GANs生成图像真实性的误解。","最后，讲者提到将转向扩散模型（diffusion），并询问是否有关于GANs的问题需要解答。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4363.84,"end":4526.23,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4363.84,"text":"You need it to get better. Okay. There's another interesting result from Radford in 2015 on operations on code, which is that there is some level of linearity between spaces in GANs. If you actually trained a GAN on generating pictures of faces and you find a code that leads to a man with sunglasses and you find a different code that is generated."},{"start":4392.43,"text":"a man. And then you find another code that's generating the face of a woman. And then you try to subtract code two from code one and add code three. It turns out you'll end up with a woman with sunglasses."},{"start":4404.58,"text":"That's the linearity between spaces. And this is an interesting property because you imagine that from a computational standpoint, you can probably navigate different types of pictures more continuously by modifying the code. It turns out some researchers also find the slopes to modify in the original code in order to be able to add certain artifacts to the output picture. And that is a big thing in art. You might actually be able to control the code space."},{"start":4432.38,"text":"and modify the output space however you want. That's one of the reasons GANs is used still by Midjourney. It focuses on art and fine-grained details. A lot of the fine-tuning is done with GANs, actually. You had a question right here. Yeah, when do you know when to stop the GAN? I mean, you'll see the cost functions just becoming stable, and you usually see the discriminator is fooled, meaning it just..."},{"start":4466.58,"text":"it's half of the time right and half the time wrong. Do we want what? Yeah, that's the thing. But at some point, it caps. It just doesn't get better anymore. And in generative AI, metrics are always an issue. It's not like a predictive task where you can compute very good F1 score or stuff like that. There are metrics that we can use in visual tasks or in text tasks, but a lot of it might be..."},{"start":4499.62,"text":"Like you look at the pictures, how do you feel about them? And that was one of the things that fooled people in the early days for GANs, which is the pictures look fantastic, but they would not actually reflect the entire data distribution. They would only reflect a subset of it. Okay, I want to move to diffusion because diffusion is really interesting and really recent. Is there any questions on GANs before we move to diffusion?"}],"speech_gaps":[],"frame":"../frames/v058/027.webp","frame_time":4375.84},{"title":"扩散模型与生成模型的比较","segments":[{"id":198,"text":"No. Good. Okay. Let's spend the rest of our time on diffusion. We're going to start with the basic principles of the forward diffusion process. We're going to talk about the loss function behind diffusion and the training part. And then we're going to look at how we do sampling at test time. So how diffusion is used after being trained at test time. We'll talk about SORA or VEO. And then we look at latent diffusion as well and some results.","zh":"好的。好的。让我们用剩下的时间来讨论扩散模型。我们将从正向扩散过程的基本原理开始。我们将讨论扩散背后的损失函数和训练部分。然后我们将看看在测试时如何进行采样。也就是说，扩散模型在训练完成后在测试时是如何被使用的。我们将讨论SORA或VEO。然后我们还将看一下潜在扩散模型以及一些结果。","start":4531.31,"end":4560.05},{"id":199,"text":"So the first diffusion we look at is actually not the latent diffusion. It's the original diffusion, which was pioneered by a former PhD student of Andrew Ng, who is now a professor at Berkeley called Peter Abil. Check out his research. One of the pioneers in reinforcement learning. And of course, the papers are listed down here.","zh":"我们首先看的扩散模型实际上并不是潜在扩散模型。它是最初的扩散模型，该模型由Andrew Ng的一位前博士生所开创，这位博士生现在是伯克利大学的教授，名叫Peter Abil。请查看他的研究。他是强化学习领域的先驱之一。当然，这些论文在这里列出。","start":4562.54,"end":4583.13},{"id":200,"text":"Let's look at why diffusion might be better than GANs","zh":"让我们看看为什么扩散模型在某些现实使用案例中可能比GAN更好","start":4586.41,"end":4590.99},{"id":201,"text":"for certain real-life use cases.","zh":"对于某些现实应用场景。","start":4590.99,"end":4593.79},{"id":202,"text":"Mode collapse, which is the thing you brought up.","zh":"模式崩溃，这是你提到的问题。","start":4594.29,"end":4596.35},{"id":203,"text":"G essentially learns to cheat by focusing on a narrow set of outputs","zh":"G本质上通过专注于一组狭窄的输出来作弊","start":4598.33,"end":4602.65},{"id":204,"text":"rather than actually learning the underlying distribution,","zh":"而不是真正学习底层分布，","start":4602.65,"end":4605.93},{"id":205,"text":"and that is a problem.","zh":"这确实是一个问题。","start":4606.41,"end":4608.27},{"id":206,"text":"On top of that, GANs consist in training two models simultaneously,","zh":"此外，GANs涉及同时训练两个模型，","start":4608.75,"end":4613.89},{"id":207,"text":"instantaneously, which makes it way more complicated than training a single model","zh":"即时地进行，这使得其比训练单个模型复杂得多","start":4613.89,"end":4617.87},{"id":208,"text":"because of the dependencies between those two models. If one model gets stuck, the other gets","zh":"因为这两个模型之间存在依赖关系。如果其中一个模型卡住了，另一个也会卡住。","start":4617.87,"end":4622.63},{"id":209,"text":"stuck. It's double problematic. And so, you know, Darival and Nicole in 2021 started to talk about","zh":"这是双重的问题。因此，你知道的，在2021年，Darival和Nicole开始讨论","start":4622.63,"end":4633.43},{"id":210,"text":"how GANs might not be the best approaches for image generation and image synthesis.","zh":"GANs可能不是图像生成和图像合成的最佳方法。","start":4633.43,"end":4639.27},{"id":211,"text":"And so here you can see examples of on the left side, big GAN, which was a really good GAN at the time. In the middle, you can see the diffusion version. And then on the right, the actual real samples from the training set. And what I want you to look at here is the variety that you can get from a diffusion model.","zh":"在这里你可以看到左边的例子，大GAN，这是当时非常优秀的GAN。中间是扩散模型的版本。右边是训练集中的实际真实样本。我想让你注意的是扩散模型所能产生的多样性。","start":4639.27,"end":4660.83},{"id":212,"text":"So if you look at the flamingos, the GAN has a tendency to always generate flamingos in groups, in bunches, and it managed to fool the discriminator by doing that without actually generating a single flamingo.","zh":"如果你看一下火烈鸟，GAN倾向于总是成群成堆地生成火烈鸟，并且通过这样做欺骗了判别器，而实际上并没有生成单个火烈鸟。","start":4660.83,"end":4673.95},{"id":213,"text":"On the other hand, if you look at diffusion, it seems like the model has understood what a flamingo is, or at least the bigger part of their real world distribution.","zh":"另一方面，如果你看一下扩散模型，看起来模型似乎理解了什么是火烈鸟，或者至少理解了它们在现实世界中的大部分分布。","start":4676.0,"end":4686.36},{"id":214,"text":"It's able to generate flamingos in different backgrounds, alone, in groups, different color variations, you know, and so on.","zh":"它能够生成不同背景下的火烈鸟，单独出现，成群出现，不同颜色变化，等等。","start":4686.68,"end":4695.04},{"id":215,"text":"Even if you look at the burgers, well, if you're a GAN user, you always get the same burger.","zh":"即使你看汉堡包，如果你是GAN用户，你总是得到同样的汉堡包。","start":4695.18,"end":4699.34},{"id":216,"text":"And who wants to have always the same burger?","zh":"谁又希望总是得到同样的汉堡包呢？","start":4699.42,"end":4701.5},{"id":217,"text":"You know, so diffusion is able to provide you with that variety.","zh":"所以扩散模型能够为你提供这种多样性。","start":4701.68,"end":4705.5}],"notes":["本段讨论了扩散模型相较于生成对抗网络（GANs）的优势，特别是在处理现实应用场景时的多样性问题。讲者指出，GANs存在模式崩溃（mode collapse）的问题，即生成器倾向于生成狭窄范围的输出，而不是真正学习到数据的潜在分布。这导致生成的样本缺乏多样性。","讲者进一步指出，GANs需要同时训练两个模型（生成器和判别器），这种依赖关系使得训练过程更加复杂。如果其中一个模型陷入局部最优，另一个模型也会受到影响，从而导致训练困难。","讲者提到，Darival和Nicole在2021年提出，GANs可能不是图像生成和合成的最佳方法。这表明，尽管GANs在早期取得了成功，但它们在某些任务上的局限性逐渐显现。","为了说明扩散模型的优势，讲者展示了对比实验的结果。左侧是大型GAN生成的图像，中间是扩散模型生成的图像，右侧是真实数据集中的样本。扩散模型能够生成更多样化的图像，例如火烈鸟可以出现在不同的背景、单独或成群，颜色也更加多样。","讲者以汉堡为例，指出GAN用户总是得到相同的汉堡，而扩散模型能够提供更多的变化，满足用户对多样性的需求。","讲者强调，扩散模型在生成多样性方面优于GANs，这使得它在某些现实应用场景中更具优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4531.31,"end":4705.5,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":4531.31,"text":"No. Good. Okay. Let's spend the rest of our time on diffusion. We're going to start with the basic principles of the forward diffusion process. We're going to talk about the loss function behind diffusion and the training part. And then we're going to look at how we do sampling at test time. So how diffusion is used after being trained at test time. We'll talk about SORA or VEO. And then we look at latent diffusion as well and some results."},{"start":4562.54,"text":"So the first diffusion we look at is actually not the latent diffusion. It's the original diffusion, which was pioneered by a former PhD student of Andrew Ng, who is now a professor at Berkeley called Peter Abil. Check out his research. One of the pioneers in reinforcement learning. And of course, the papers are listed down here."},{"start":4586.41,"text":"Let's look at why diffusion might be better than GANs"},{"start":4590.99,"text":"for certain real-life use cases."},{"start":4594.29,"text":"Mode collapse, which is the thing you brought up."},{"start":4598.33,"text":"G essentially learns to cheat by focusing on a narrow set of outputs"},{"start":4602.65,"text":"rather than actually learning the underlying distribution,"},{"start":4606.41,"text":"and that is a problem."},{"start":4608.75,"text":"On top of that, GANs consist in training two models simultaneously,"},{"start":4613.89,"text":"instantaneously, which makes it way more complicated than training a single model"},{"start":4617.87,"text":"because of the dependencies between those two models. If one model gets stuck, the other gets"},{"start":4622.63,"text":"stuck. It's double problematic. And so, you know, Darival and Nicole in 2021 started to talk about"},{"start":4633.43,"text":"how GANs might not be the best approaches for image generation and image synthesis."},{"start":4639.27,"text":"And so here you can see examples of on the left side, big GAN, which was a really good GAN at the time. In the middle, you can see the diffusion version. And then on the right, the actual real samples from the training set. And what I want you to look at here is the variety that you can get from a diffusion model."},{"start":4660.83,"text":"So if you look at the flamingos, the GAN has a tendency to always generate flamingos in groups, in bunches, and it managed to fool the discriminator by doing that without actually generating a single flamingo."},{"start":4676.0,"text":"On the other hand, if you look at diffusion, it seems like the model has understood what a flamingo is, or at least the bigger part of their real world distribution."},{"start":4686.68,"text":"It's able to generate flamingos in different backgrounds, alone, in groups, different color variations, you know, and so on."},{"start":4695.18,"text":"Even if you look at the burgers, well, if you're a GAN user, you always get the same burger."},{"start":4699.42,"text":"And who wants to have always the same burger?"},{"start":4701.68,"text":"You know, so diffusion is able to provide you with that variety."}],"speech_gaps":[],"frame":"../frames/v058/028.webp","frame_time":4543.31},{"title":"扩散模型的基本思想与冷启动问题","segments":[{"id":218,"text":"The idea behind diffusion is we're going to try to avoid that mode collapse by modeling","zh":"扩散模型的基本思想是，我们要通过建模整个数据分布来避免模式坍缩","start":4710.72,"end":4715.9},{"id":219,"text":"the entire data distribution.","zh":"因此，我们不再进行一个零和博弈","start":4715.9,"end":4717.22},{"id":220,"text":"So we're not going to do a minimax game anymore.","zh":"我们将得到一个单一模型，并设置一个任务，使其能够在图像空间中学习任何内容","start":4717.54,"end":4719.84},{"id":221,"text":"We're going to get a single model and we're going to set up a task that can learn anything","zh":"此外，我们还希望通过不使用对抗性任务来获得更稳定的梯度","start":4720.1,"end":4724.92},{"id":222,"text":"in the image space, let's say.","zh":"单一模型，而不是两个模型。扩散模型的核心思想，也是该术语的来源，是去噪","start":4725.46,"end":4727.14},{"id":223,"text":"And on top of that, we want to have more stable gradient by not using an adversarial task.","zh":"它是一个生成模型，","start":4727.44,"end":4732.72},{"id":224,"text":"single model, not two models. The core idea behind diffusion, and that's also","zh":"单个模型，而不是两个模型。扩散模型背后的核心思想，也是","start":4732.72,"end":4742.56},{"id":225,"text":"where the word comes from, is denoising. It's a generative model that","zh":"这个词的来源，是去噪。它是一个生成模型，","start":4742.56,"end":4748.0},{"id":226,"text":"progressively is going to add noise to the data and learn to reverse the","zh":"逐步地，会对数据添加噪声，并学习逆转这个过程。","start":4748.0,"end":4753.66},{"id":227,"text":"noising process. It's a very smart task actually, very creative. Can someone tell","zh":"这实际上是一个非常聪明的任务，非常有创意。有人能告诉我","start":4753.66,"end":4762.16},{"id":228,"text":"Tell me why that might be a good idea to try to add noise to an image","zh":"为什么尝试向图像添加噪声可能是个好主意","start":4762.16,"end":4765.96},{"id":229,"text":"and then teach a model to denoise it intuitively.","zh":"然后教模型去去噪，从直觉上来说。","start":4766.66,"end":4770.94},{"id":230,"text":"Yeah. Yeah. Yeah. Do you want to add something? We see that actually. There is some cold start problem, but I see what you mean. The cold start problem in GANs is really about the minimax game. And here we don't have a minimax game. We have a single model. And so maybe we can find engineering tricks to get the model to cold start better. Yeah. Yeah.","zh":"对。对。对。你想补充什么？我们确实看到了这一点。实际上存在冷启动问题，但我明白你的意思。在GANs中的冷启动问题确实与最小最大博弈有关。而在这里我们没有最小最大博弈，我们只有一个模型。因此，也许我们可以找到一些工程技巧，让模型更好地冷启动。对。对。","start":4774.87,"end":4820.53},{"id":231,"text":"Yeah, very good point, actually. And that's related to the cold start problem, which is, you know, you can start by predicting noise when there's a little bit of noise. And that's an easier task than to take an image that is highly noisy and try to denoise it. And so by doing that progressively, you can actually learn things step by step. So you can learn, for example, the model can learn to remove a little bit of noise on an image, which is an easier task. And then over time, you can teach it to learn.","zh":"对，非常好的观点。这与冷启动问题有关，即你可以从预测噪声开始，当图像中有一些噪声时。这比尝试去噪一个高度噪声的图像要容易得多。因此，通过逐步进行，你可以逐步学习。例如，模型可以学习去除图像中的一点噪声，这是一个更容易的任务。然后随着时间推移，你可以教它学习更多噪声，直到它可以完全去噪随机噪声。它可以将随机噪声转化为图像。注意。对。对。对。这是正确的。好的。那么让我们来看... 我们将逐步进行。我们将从正向扩散过程开始。我将先阐述问题。","start":4824.04,"end":4850.78},{"id":232,"text":"a lot more noise until a point where it can completely denoise a random noise. It can turn random noise into an image. Attention. Yeah. Yeah. Yeah. That's correct. Okay. So let's look at... We're going to do it step by step. We're starting with the forward diffusion process. I'm just going to lay out the problem. It's...","zh":"添加更多的噪声，直到达到一个点，此时它可以完全去除随机噪声。它可以将随机噪声转化为图像。注意。是的。是的。是的。这是正确的。好的。那么我们来看……我们将逐步进行。我们从正向扩散过程开始。我只需要说明这个问题。它……","start":4851.39,"end":4882.6}],"notes":["本段讲解了扩散模型的基本思想，即通过逐步添加噪声并学习去噪过程来生成数据。与对抗生成模型不同，扩散模型使用单一模型，避免了对抗训练中的模式崩溃问题。","冷启动问题在生成模型中是一个重要挑战，特别是在对抗生成网络（GANs）中，由于需要进行最小最大博弈，模型难以从随机噪声中生成有意义的图像。而扩散模型通过逐步去噪的方式，从简单的任务开始，逐步增加难度，从而更容易实现冷启动。","在扩散模型中，模型首先从干净的数据开始，逐步添加噪声，直到数据完全变成随机噪声。然后，模型学习如何逆向这个过程，从噪声中恢复出原始图像。这种逐步学习的方式使得模型能够更稳定地训练。","通过逐步增加噪声的强度，模型可以逐步学习如何去除不同层次的噪声。例如，模型可以先学习去除少量噪声，然后逐步学习去除更多噪声，最终能够从完全随机的噪声中生成图像。","这种设计使得扩散模型在训练过程中更加稳定，因为模型不需要同时处理复杂的对抗任务，而是专注于学习一个逐步去噪的过程。","在实际应用中，扩散模型的训练过程可以分为两个阶段：前向扩散过程和反向去噪过程。前向过程是逐步添加噪声，反向过程是学习如何去除噪声，从而生成图像。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4710.72,"end":4882.6,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":4710.72,"text":"The idea behind diffusion is we're going to try to avoid that mode collapse by modeling"},{"start":4715.9,"text":"the entire data distribution."},{"start":4717.54,"text":"So we're not going to do a minimax game anymore."},{"start":4720.1,"text":"We're going to get a single model and we're going to set up a task that can learn anything"},{"start":4725.46,"text":"in the image space, let's say."},{"start":4727.44,"text":"And on top of that, we want to have more stable gradient by not using an adversarial task."},{"start":4732.72,"text":"single model, not two models. The core idea behind diffusion, and that's also"},{"start":4742.56,"text":"where the word comes from, is denoising. It's a generative model that"},{"start":4748.0,"text":"progressively is going to add noise to the data and learn to reverse the"},{"start":4753.66,"text":"noising process. It's a very smart task actually, very creative. Can someone tell"},{"start":4762.16,"text":"Tell me why that might be a good idea to try to add noise to an image"},{"start":4766.66,"text":"and then teach a model to denoise it intuitively."},{"start":4774.87,"text":"Yeah. Yeah. Yeah. Do you want to add something? We see that actually. There is some cold start problem, but I see what you mean. The cold start problem in GANs is really about the minimax game. And here we don't have a minimax game. We have a single model. And so maybe we can find engineering tricks to get the model to cold start better. Yeah. Yeah."},{"start":4824.04,"text":"Yeah, very good point, actually. And that's related to the cold start problem, which is, you know, you can start by predicting noise when there's a little bit of noise. And that's an easier task than to take an image that is highly noisy and try to denoise it. And so by doing that progressively, you can actually learn things step by step. So you can learn, for example, the model can learn to remove a little bit of noise on an image, which is an easier task. And then over time, you can teach it to learn."},{"start":4851.39,"text":"a lot more noise until a point where it can completely denoise a random noise. It can turn random noise into an image. Attention. Yeah. Yeah. Yeah. That's correct. Okay. So let's look at... We're going to do it step by step. We're starting with the forward diffusion process. I'm just going to lay out the problem. It's..."}],"speech_gaps":[],"frame":"../frames/v058/029.webp","frame_time":4722.72},{"title":"扩散模型的基本概念与前向扩散过程","segments":[{"id":233,"text":"It's a simplified version of the seminal paper from Peter Abil's group and Hoetal in 2020, but it's the same concept. It's just I modified it slightly for the sake of the example. Essentially, the idea behind diffusion is you start with an image, X0, and you progressively add some noise to it. So you might add a little bit of noise at the beginning, and then over time you add more and more noise until a point where...","zh":"这是Peter Abil团队和Hoetal在2020年发表的开创性论文的一个简化版本，但核心概念是相同的。我只是为了举例稍作修改。本质上，扩散的概念是，你从一张图像X0开始，然后逐步向其中添加一些噪声。因此，你可能在开始时添加一点噪声，然后随着时间推移，逐渐添加更多的噪声，直到某个点...","start":4883.01,"end":4911.99},{"id":234,"text":"you keep the time steps in mind. So we start from X zero and we go all the way to X capital T with capital T being the number of time steps where we added noise. Now, if you look at the relationship between X T and X T plus one, it's very simple. It's just adding an epsilon, which is noise. So X T plus one is equal to.","zh":"你需要注意时间步。我们从X零开始，一直进行到X大T，其中大T是添加噪声的时间步数量。现在，如果你观察XT和XT加一之间的关系，它非常简单。它只是添加了一个epsilon，也就是噪声。因此，XT加一等于。","start":4912.38,"end":4942.85},{"id":235,"text":"Xt plus epsilon t, where epsilon t is Gaussian noise. What's another reason we would want something like Gaussian noise? Why would it help with training over maybe GANs methods or other types of generative methods? Well, it's a very known distribution.","zh":"XT加上epsilon t，其中epsilon t是高斯噪声。我们为什么想要像高斯噪声这样的东西呢？为什么它在训练过程中比GAN方法或其他生成方法更有帮助呢？嗯，这是一个非常已知的分布。","start":4943.36,"end":4970.93},{"id":236,"text":"You actually can believe that a neural network can learn a Gaussian distribution. And so by sampling Gaussian noise, you're going to simplify your training process because it's a known distribution. Xt is essentially the pixels that are retained from the previous image. In practice, it's slightly more complicated than that. I'll show you at the end how it is in practice. But essentially, Xt plus one is equal to some pixels from the previous image and then additional pixels that are Gaussian noise. If you now...","zh":"你实际上可以相信神经网络能够学习高斯分布。因此，通过采样高斯噪声，你将简化训练过程，因为这是一个已知的分布。XT本质上是保留自前一图像的像素。在实践中，它比这稍微复杂一些。我会在最后向你展示实际情况。但基本上，XT加一等于前一图像的一些像素，以及额外的高斯噪声像素。如果你现在...","start":4971.95,"end":5002.86},{"id":237,"text":"And by the way, the noise is not the same as every time step. You sample randomly Gaussian noise at every time step, obviously. If you actually do a recurrence and you project from Xt to X0, you can say that Xt is equal to X0 plus epsilon, where epsilon is the sum of epsilons from 0 to t minus 1. So actually, you can retrieve X0 from Xt by predicting all the noise that was added. So this is called the forward diffusion process.","zh":"顺便说一句，噪声在每个时间步并不是相同的。显然，你在每个时间步都会随机采样高斯噪声。如果你实际进行递归并从XT投影到X0，你可以表示为XT等于X0加上epsilon，其中epsilon是0到t减1的epsilon之和。因此，实际上，你可以通过预测所添加的所有噪声从XT中恢复X0。这个过程被称为前向扩散过程。","start":5004.22,"end":5037.72},{"id":238,"text":"That's not our training process. All I'm saying right now is you could take a bunch of pictures online and you could perform a forward diffusion process. It's a simple Python script, right? You just add noise, you keep in memory whatever you did, and that's going to build our data sets. Actually, that forward diffusion process. Now, what we're actually learning is the reverse process, also called denoising.","zh":"那并不是我们的训练过程。我现在只是说，你可以从网上收集一堆图片，然后进行一个前向扩散过程。这只是一个简单的Python脚本，对吧？你只需添加噪声，并记住你所做的操作，这就会构建我们的数据集。实际上，我们所学习的是反向过程，也称为去噪过程。","start":5038.43,"end":5062.14}],"notes":["本段讲解了扩散模型的基本概念，即从原始图像X0开始，逐步添加噪声，直到图像无法辨认。时间步数T表示添加噪声的总次数，X_T是最终的噪声图像。","在前向扩散过程中，每一步X_t+1由X_t和当前时间步的高斯噪声ε_t组成，即X_{t+1} = X_t + ε_t。高斯噪声的选择是因为神经网络可以学习这种分布，从而简化训练过程。","在实际操作中，X_t由前一步的图像X_{t-1}和当前时间步的噪声ε_t组成，因此X_t = X_{t-1} + ε_t。通过这种方式，可以逐步构建噪声图像。","在时间步t，噪声ε_t是独立的高斯噪声，因此X_t可以表示为X_0加上所有时间步的噪声之和，即X_t = X_0 + Σ_{s=0}^{t-1} ε_s。这使得从X_t恢复X_0成为可能。","前向扩散过程是构建数据集的基础，但实际训练过程是学习反向过程，即从噪声图像X_T逐步恢复到原始图像X_0，这一过程称为去噪。"],"formulas":[{"latex":"X_t = X_0 + \\sum_{s=0}^{t-1} \\varepsilon_s","symbols":"X_t 是第 t 步的图像，X_0 是原始图像，\\sum_{s=0}^{t-1} \\varepsilon_s 是从时间步 0 到 t-1 的所有噪声之和","explanation":"公式中的符号和数学类型正确，\\sum_{s=0}^{t-1} \\varepsilon_s 表示累积的噪声，符合扩散过程的定义。","evidence":"And by the way, the noise is not the same as every time step. You sample randomly Gaussian noise at every time step, obviously. If you actually do a recurrence and you project from Xt to X0, you can say that Xt is equal to X0 plus epsilon, where epsilon is the sum of epsilons from 0 to t minus 1. So actually, you can retrieve X0 from Xt by predicting all the noise that was added. So this is called the forward diffusion process."}],"uncertainties":[],"diagram":"none","start":4883.01,"end":5062.14,"asr_flags":[],"math_clarifications":["在公式中，\\varepsilon_t 应该使用标准的希腊字母符号，而不是文本形式的\\text{\\varepsilon}_t。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4883.01,"text":"It's a simplified version of the seminal paper from Peter Abil's group and Hoetal in 2020, but it's the same concept. It's just I modified it slightly for the sake of the example. Essentially, the idea behind diffusion is you start with an image, X0, and you progressively add some noise to it. So you might add a little bit of noise at the beginning, and then over time you add more and more noise until a point where..."},{"start":4912.38,"text":"you cannot recognize the picture anymore at all. You keep the time steps in mind. So we start from X zero and we go all the way to X capital T with capital T being the number of time steps where we added noise. Now, if you look at the relationship between X T and X T plus one, it's very simple. It's just adding an epsilon, which is noise. So X T plus one is equal to."},{"start":4943.36,"text":"Xt plus epsilon t, where epsilon t is Gaussian noise. What's another reason we would want something like Gaussian noise? Why would it help with training over maybe GANs methods or other types of generative methods? Well, it's a very known distribution."},{"start":4971.95,"text":"You actually can believe that a neural network can learn a Gaussian distribution. And so by sampling Gaussian noise, you're going to simplify your training process because it's a known distribution. Xt is essentially the pixels that are retained from the previous image. In practice, it's slightly more complicated than that. I'll show you at the end how it is in practice. But essentially, Xt plus one is equal to some pixels from the previous image and then additional pixels that are Gaussian noise. If you now..."},{"start":5004.22,"text":"And by the way, the noise is not the same as every time step. You sample randomly Gaussian noise at every time step, obviously. If you actually do a recurrence and you project from Xt to X0, you can say that Xt is equal to X0 plus epsilon, where epsilon is the sum of epsilons from 0 to t minus 1. So actually, you can retrieve X0 from Xt by predicting all the noise that was added. So this is called the forward diffusion process."},{"start":5038.43,"text":"That's not our training process. All I'm saying right now is you could take a bunch of pictures online and you could perform a forward diffusion process. It's a simple Python script, right? You just add noise, you keep in memory whatever you did, and that's going to build our data sets. Actually, that forward diffusion process. Now, what we're actually learning is the reverse process, also called denoising."}],"speech_gaps":[],"frame":"../frames/v058/030.webp","frame_time":4895.01},{"title":"扩散模型与去噪过程","segments":[{"id":239,"text":"Here's how denoising works. We take the same process that we had with all our T pictures. And what we're going to do is we're going to take XT and we're going to build a neural network, a diffusion model that will predict epsilon hat. Epsilon hat is the cumulative noise that was added from X0 to XT.","zh":"去噪过程是如何工作的。我们采用与所有T张图片相同的流程。我们将采取XT，并构建一个神经网络，即扩散模型，来预测epsilon hat。epsilon hat是从X0到XT所累积添加的噪声。","start":5064.26,"end":5090.26},{"id":240,"text":"So why is that useful? Because you can actually subtract epsilon hat from xt, and what do you get? You get the original cat picture, x0. So if we can build such a diffusion model that can predict the noise added to an image, then we can, at test time, do a denoising process and get images back. So a lot of advantages to this approach.","zh":"为什么这很有用呢？因为你可以从xt中减去epsilon hat，你会得到什么？你会得到原始的猫图片x0。因此，如果我们能够构建一个这样的扩散模型，可以预测添加到图像中的噪声，那么在测试时，我们就可以进行去噪过程并得到图像。这种方法有很多优势。","start":5092.01,"end":5126.81},{"id":241,"text":"single model. It's not an adversarial task. We are able to train on different levels of difficulty. We can start with epsilons being smaller, so less time steps. We can end with higher time steps, which allow us to train the model on simpler and harder tasks so that it learns step by step. And on top of that, we choose Gaussian noise, which is an easier distribution to model for a network. All of that contributes to better gradients overall. Our loss function,","zh":"单一模型。这不是一个对抗性任务。我们能够在一个不同难度级别的训练过程中进行训练。我们可以从epsilon较小开始，这样时间步较少。我们也可以以较高的时间步结束，这允许我们在简单和困难的任务上训练模型，从而逐步学习。此外，我们选择高斯噪声，这对于网络来说是一个更容易建模的分布。所有这些都有助于整体更好的梯度。我们的损失函数，","start":5127.44,"end":5158.62},{"id":242,"text":"is our L2 loss. Oftentimes you'll hear reconstruction loss, which is comparing the true noise added epsilon to epsilon hat, which is the predicted cumulative noise. But why can we do that? Because we already did our forward diffusion and we kept in memory how much noise we added. So we have a ground truth. It's self-supervised. We made up a label out of our data process.","zh":"是我们的L2损失。通常你会听到重建损失，这是将真实的添加噪声epsilon与预测的累积噪声epsilon hat进行比较。但为什么我们可以这样做呢？因为我们已经完成了前向扩散过程，并且保留了所添加噪声的记忆。因此，我们有真实标签。这是自监督的。我们从数据过程中创造了一个标签。","start":5159.37,"end":5185.3},{"id":243,"text":"Yeah, so ground truth noise representing the difference between the clear and noisy image at time step t, and then epsilon hat is the model's prediction of the noise added to the clean image after t steps. This is very important to understand diffusion. So are you clear on that process? We saw the forward diffusion process, and now we're trying to learn the denoising process. Yes. Yes. Yeah.","zh":"是的，所以真实噪声代表了在时间步t时清晰图像和噪声图像之间的差异，而epsilon hat是模型对在t步后添加到清晰图像的噪声的预测。这非常重要，有助于理解扩散。你是否清楚这个过程？我们已经看到了前向扩散过程，现在我们正在尝试学习去噪过程。是的。是的。对的。","start":5189.58,"end":5220.47},{"id":244,"text":"So the forward diffusion process gives us the data and then we now have labels and we're able to train a denoising process. So if I summarize that process, we created a database of images by performing a forward diffusion and that gave us some data like this. We have one data point which is a cat image with five steps of noise and we kept the noise in memory.","zh":"因此，前向扩散过程为我们提供了数据，现在我们有了标签，并且能够训练一个去噪过程。因此，如果我总结这个过程，我们通过执行前向扩散创建了一个图像数据库，这为我们提供了一些数据，例如这里的数据。我们有一个数据点，它是一张猫的图像，经过了五步的噪声处理，并且我们保留了噪声在内存中。","start":5220.92,"end":5244.22}],"notes":["本段讲解了扩散模型的基本原理，即通过预测累积噪声来实现图像的去噪。教师提到，通过从XT中减去预测的噪声epsilon hat，可以恢复原始图像x0。这表明扩散模型的核心思想是通过逆向过程逐步去除噪声，从而重建原始图像。","教师进一步解释了扩散模型的优势，包括使用单个模型、非对抗性任务、不同难度级别的训练以及选择高斯噪声作为更容易建模的分布。这些因素共同促进了更好的梯度和整体模型性能。","教师提到损失函数为L2损失，即重建损失，用于比较真实噪声epsilon与预测噪声epsilon hat之间的差异。由于前向扩散过程已经记录了添加的噪声，因此可以使用真实噪声作为标签进行自监督学习。","教师强调了理解扩散模型中噪声和预测噪声之间的关系的重要性。真实噪声代表了在时间步t时清晰图像与噪声图像之间的差异，而epsilon hat是模型对在t步后添加到清晰图像的噪声的预测。","教师通过提问确认学生是否理解这一过程，并指出前向扩散过程提供了数据，现在可以利用这些数据训练去噪过程。教师还提到通过前向扩散创建了一个图像数据库，并保留了噪声信息。","教师总结了整个过程，强调了前向扩散和去噪过程的结合，以及如何通过保留噪声信息来实现自监督学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5064.26,"end":5244.22,"asr_flags":[],"math_clarifications":["在公式中，\\^\\epsilon 应使用带帽子的符号表示预测的噪声，而非直接使用epsilon。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5064.26,"text":"Here's how denoising works. We take the same process that we had with all our T pictures. And what we're going to do is we're going to take XT and we're going to build a neural network, a diffusion model that will predict epsilon hat. Epsilon hat is the cumulative noise that was added from X0 to XT."},{"start":5092.01,"text":"So why is that useful? Because you can actually subtract epsilon hat from xt, and what do you get? You get the original cat picture, x0. So if we can build such a diffusion model that can predict the noise added to an image, then we can, at test time, do a denoising process and get images back. So a lot of advantages to this approach."},{"start":5127.44,"text":"single model. It's not an adversarial task. We are able to train on different levels of difficulty. We can start with epsilons being smaller, so less time steps. We can end with higher time steps, which allow us to train the model on simpler and harder tasks so that it learns step by step. And on top of that, we choose Gaussian noise, which is an easier distribution to model for a network. All of that contributes to better gradients overall. Our loss function,"},{"start":5159.37,"text":"is our L2 loss. Oftentimes you'll hear reconstruction loss, which is comparing the true noise added epsilon to epsilon hat, which is the predicted cumulative noise. But why can we do that? Because we already did our forward diffusion and we kept in memory how much noise we added. So we have a ground truth. It's self-supervised. We made up a label out of our data process."},{"start":5189.58,"text":"Yeah, so ground truth noise representing the difference between the clear and noisy image at time step t, and then epsilon hat is the model's prediction of the noise added to the clean image after t steps. This is very important to understand diffusion. So are you clear on that process? We saw the forward diffusion process, and now we're trying to learn the denoising process. Yes. Yes. Yeah."},{"start":5220.92,"text":"So the forward diffusion process gives us the data and then we now have labels and we're able to train a denoising process. So if I summarize that process, we created a database of images by performing a forward diffusion and that gave us some data like this. We have one data point which is a cat image with five steps of noise and we kept the noise in memory."}],"speech_gaps":[],"frame":"../frames/v058/031.webp","frame_time":5076.26},{"title":"对抗鲁棒性与生成模型中的噪声添加","segments":[{"id":245,"text":"That's one data point. Another data point might be, you know, yeah, noise image and the index is important because it will tell the model how much noise has been added, how many time steps essentially have been added, which helps. Because at test time, you might actually try to tell the model denoise for 10 steps or denoise for 20 steps. And that denoising might be more aggressive or less aggressive, depending on what you choose.","zh":"这是一个数据点。另一个数据点可能是，你知道的，是带有噪声的图像，索引很重要，因为它会告诉模型添加了多少噪声，实际上相当于添加了多少步，这有助于。因为在测试时，你可能会实际尝试让模型进行10步的去噪或20步的去噪。而去噪的强度可能会更激进或更温和，这取决于你的选择。","start":5244.89,"end":5268.03},{"id":246,"text":"Here's another example. You might have a picture of the same cat, but very noisy, way more noisy, 45 steps of noise added. And you also kept in memory the epsilon that is the cumulative noise. That's not the same epsilon as above, by the way. I just use this for explanation, but each epsilon is different. It's equivalent to the noise that was added between X0 and X45 in this case.","zh":"这里还有一个例子。你可能有一张同一只猫的图片，但非常嘈杂，噪声更多，添加了45步的噪声。你还会在内存中保留一个epsilon，它是累积噪声。请注意，这并不是上面提到的那个epsilon，我这只是为了说明，每个epsilon都是不同的。在这种情况下，它相当于在X0和X45之间添加的噪声。","start":5269.19,"end":5295.71},{"id":247,"text":"And again, you can take another picture that you build with three steps of noise. That's probably an easier picture to denoise. And you can also do another one with 19 steps. Make sense how we build our database, our data sets for training? So self-supervised, we created labels out of our process. Yes.","zh":"同样，你还可以用三步噪声构建另一张图片。这可能是一张更容易去噪的图片。你也可以用19步构建另一张。明白我们是如何构建我们的数据库、训练数据集的吗？因此，我们通过自监督的方式，从我们的过程中创建标签。是的。","start":5296.43,"end":5316.31},{"id":248,"text":"There would, you can try. Yeah. I'm just saying the, you know, what, what they, the Berkeley researchers came up with originally was the Gaussian noise because we know it's easy to model, but in fact.","zh":"你可以尝试。是的。我只是说，你知道的，伯克利的研究人员最初提出的是高斯噪声，因为我们知道它很容易建模，但实际上。","start":5325.52,"end":5337.22},{"id":249,"text":"There's another thing that I haven't talked about yet is the noise schedule. Like here I'm assuming you just sample from motion noise at every step. The truth is you might actually sample differently depending on the step, just so that you teach your model to learn easy things and then harder things, for example, yeah.","zh":"还有一个我还没提到的事情是噪声调度。比如，我假设你在每一步都从运动噪声中采样。实际上，你可能会根据步骤的不同而以不同的方式采样，这样你就可以教你的模型先学习简单的事情，再学习更难的事情，比如是的。","start":5338.17,"end":5359.19},{"id":250,"text":"Yeah. Yeah. So the question is, do you use only one noisy image per original image or multiple? And in what order? Yeah. That's a question. Yeah. You can, you would typically sample. So you might say for the dog, I take five steps and 15 steps and 24 steps for the cat. I use another, you know,","zh":"是的。是的。问题是，你是否为每个原始图像只使用一个带噪声的图像还是多个？顺序又是怎样的？是的。这是一个问题。是的。你通常会进行采样。比如，你可能会说，对于狗，我取五步、十五步和二十四步的猫图像。我会使用另一个，你知道的，","start":5375.23,"end":5405.5}],"notes":["本段讲解了生成模型中噪声添加的策略，特别是噪声调度（noise schedule）的概念。讲者指出，虽然通常假设每一步都从运动噪声中采样，但实际上，噪声的采样方式会根据步骤的不同而变化。这种变化的目的是让模型先学习简单的任务，再逐步学习更复杂的任务。","讲者还提到，对于每个原始图像，可以使用多个噪声图像进行训练，而这些噪声图像的添加步骤数不同。例如，对于狗的图像，可以使用5步、15步和24步的噪声图像。这种做法有助于模型更好地理解不同噪声水平下的图像特征。","在训练过程中，噪声的添加步骤数会影响模型的训练效果。例如，添加更多步骤的噪声图像可能更难处理，因此模型需要学习更复杂的去噪过程。","讲者还提到，噪声调度的设计是为了让模型逐步学习，从简单的任务开始，逐步过渡到更复杂的任务。这种设计有助于提高模型的鲁棒性和泛化能力。","此外，讲者指出，虽然高斯噪声是最常见的选择，但其他类型的噪声也可以被尝试。不同的噪声类型可能会影响模型的训练效果，因此需要根据具体任务进行选择。","最后，讲者提到，关于使用多个噪声图像进行训练的具体顺序和策略，仍然是一个值得探讨的问题。"],"formulas":[],"uncertainties":["noise schedule"],"diagram":"none","start":5244.89,"end":5405.5,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5244.89,"text":"That's one data point. Another data point might be, you know, yeah, noise image and the index is important because it will tell the model how much noise has been added, how many time steps essentially have been added, which helps. Because at test time, you might actually try to tell the model denoise for 10 steps or denoise for 20 steps. And that denoising might be more aggressive or less aggressive, depending on what you choose."},{"start":5269.19,"text":"Here's another example. You might have a picture of the same cat, but very noisy, way more noisy, 45 steps of noise added. And you also kept in memory the epsilon that is the cumulative noise. That's not the same epsilon as above, by the way. I just use this for explanation, but each epsilon is different. It's equivalent to the noise that was added between X0 and X45 in this case."},{"start":5296.43,"text":"And again, you can take another picture that you build with three steps of noise. That's probably an easier picture to denoise. And you can also do another one with 19 steps. Make sense how we build our database, our data sets for training? So self-supervised, we created labels out of our process. Yes."},{"start":5325.52,"text":"There would, you can try. Yeah. I'm just saying the, you know, what, what they, the Berkeley researchers came up with originally was the Gaussian noise because we know it's easy to model, but in fact."},{"start":5338.17,"text":"you know you would find papers that tried multiple different good noise types there's another thing that i haven't talked about yet is the noise schedule like here i'm assuming you just sample from motion noise at every step the truth is you might actually sample differently depending on the step just so that you teach your model to learn easy things and then harder things for example yeah"},{"start":5375.23,"text":"Yeah. Yeah. So the question is, do you use only one noisy image per original image or multiple? And in what order? Yeah. That's a question. Yeah. You can, you would typically sample. So you might say for the dog, I take five steps and 15 steps and 24 steps for the cat. I use another, you know,"}],"speech_gaps":[],"frame":"../frames/v058/032.webp","frame_time":5256.89},{"title":"生成模型的训练与推理过程","segments":[{"id":251,"text":"You have now a way to create as much data as you want, essentially. You might actually add different noises to the same image and sample all of them. All that matters is you kept the noise that you added in memory so that it can serve as your label for your loss function.","zh":"现在你已经有一种方法可以生成任意多的数据，基本上。你实际上可以对同一张图像添加不同的噪声，并对所有这些样本进行采样。唯一重要的是你保留了所添加的噪声，以便它可以作为你损失函数的标签。","start":5406.09,"end":5433.05},{"id":252,"text":"Sort of a triplet. A noisy image, the index of the time step, how many times noise was added, and then the cumulative noise, epsilon, that was added to the clean image. And then you perform, you compute the reconstruction loss because you've built a model to predict noise and you also know the ground truth from that triplet. And that gives you the gradient that teaches your diffusion model to predict noise very well, given a noisy picture.","zh":"这有点像一个三元组。一个带噪声的图像、时间步的索引、噪声添加的次数，以及添加到干净图像上的累积噪声 epsilon。然后你进行计算，计算重建损失，因为你已经构建了一个模型来预测噪声，而且你从这个三元组中也知道了真实值。这会给你一个梯度，教导你的扩散模型在给定一张带噪声的图像时能够很好地预测噪声。","start":5434.04,"end":5467.19},{"id":253,"text":"In practice, the algorithm is almost the same as the one I presented. There are some tweaks. I'm not going to go into the details for the sake of time, but you can see in the paper, it's not that much more complicated. It's exactly the same idea. Just some engineering tweaks to fit into a certain noise schedule or a certain probability distribution.","zh":"在实践中，算法几乎与我展示的一样。有一些调整。为了节省时间，我不会深入细节，但你可以看到论文中，它并不复杂得多。它正是同样的想法。只是进行了一些工程上的调整，以适应特定的噪声调度或特定的概率分布。","start":5468.42,"end":5497.71},{"id":254,"text":"Good question. What's the order of magnitude of how much images we need? Well, remember, the core idea of generative modeling is you want way more images than the capacity of your model. So if your model is a 10 billion parameter model, you want to have relatively a lot more images. If you're training a micro diffusion model, you actually might not need to sample that many images. Generally, if you ask foundation model provider, they tell you, just give us unlimited.","zh":"好问题。我们需要多少张图像的数量级是多少？嗯，记住，生成模型的核心思想是你需要的图像数量要远远超过模型的容量。因此，如果你的模型是一个100亿参数的模型，你希望拥有相对更多的图像。如果你在训练一个微扩散模型，实际上可能不需要采样那么多图像。一般来说，如果你询问基础模型提供商，他们会告诉你，只要给我们无限量的图像。","start":5503.17,"end":5530.69},{"id":255,"text":"Good question. What's the order of magnitude of how much images we need? Well, remember, the core idea of generative modeling is you want way more images than the capacity of your model. So if your model is a 10 billion parameter model, you want to have relatively a lot more images. If you're training a micro diffusion model, you actually might not need to sample that many images. Generally, if you ask foundation model provider, they tell you, just give us unlimited.","zh":"好问题。我们需要多少张图像的数量级是多少？嗯，记住，生成模型的核心思想是你需要的图像数量要远远超过模型的容量。因此，如果你的模型是一个100亿参数的模型，你希望拥有相对更多的图像。如果你在训练一个微扩散模型，实际上可能不需要采样那么多图像。一般来说，如果你询问基础模型提供商，他们会告诉你，只要给我们无限量的图像。","start":5531.35,"end":5552.03},{"id":256,"text":"data and we just keep feeding it over time and we monitor the loss function. And as soon as the loss starts capping, we probably are at capacity and we might need to find a variation to the core algorithm, you know, a different neural network architecture, a denoising schedule or so on. That's what's going to make the difference at that point. Good question.","zh":"数据，并且我们随着时间不断输入这些数据，同时监控损失函数。一旦损失开始趋于稳定，我们可能已经达到了模型的容量，此时可能需要对核心算法进行调整，例如采用不同的神经网络架构、去噪时间表等。这就是在那个阶段能够带来差异的关键。这是一个好问题。","start":5554.76,"end":5583.58}],"notes":["本段讲解了生成模型训练过程中如何通过添加不同噪声来生成数据，并将噪声作为标签用于损失函数。训练过程涉及构建一个模型来预测噪声，并利用真实噪声计算梯度，从而训练扩散模型。","在训练过程中，算法与之前介绍的几乎相同，但有一些工程上的调整，例如噪声调度和概率分布的适配。这些调整是为了更好地适应特定的噪声调度或概率分布。","生成模型的训练需要大量数据，通常需要比模型容量更多的图像。对于大型模型，如100亿参数的模型，需要相对更多的图像；而对于小型模型，可能不需要太多图像。","当损失函数开始趋于稳定时，说明模型可能已经达到了其容量，此时可能需要对核心算法进行调整，例如改变神经网络架构或去噪调度。","在测试阶段，扩散模型的推理过程与训练过程略有不同，特别是在噪声调度方面。噪声的添加是根据时间步长进行控制的，而不是简单的线性关系。","课程中提到，生成模型的核心思想是通过大量数据训练模型，使其能够生成高质量的图像。模型的容量和数据量之间的关系是训练过程中的关键因素。"],"formulas":[],"uncertainties":["可能无法准确识别出某些术语或公式，例如'noise schedule'的具体数学表达式"],"diagram":"none","start":5406.09,"end":5583.58,"asr_flags":[],"math_clarifications":["ELBO的正确形式应为 $E_q[\\log p_\\theta(x|z)] - KL(q||p)$，其中 $E_q[\\log p_\\theta(x|z)]$ 是对数似然的期望，$KL(q||p)$ 是KL散度。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5406.09,"text":"You have now a way to create as much data as you want, essentially. You might actually add different noises to the same image and sample all of them. All that matters is you kept the noise that you added in memory so that it can serve as your label for your loss function. Okay, so now just to recap the training process before we go to the test time inference. The training process is sample."},{"start":5434.04,"text":"Sort of a triplet. A noisy image, the index of the time step, how many times noise was added, and then the cumulative noise, epsilon, that was added to the clean image. And then you perform, you compute the reconstruction loss because you've built a model to predict noise and you also know the ground truth from that triplet. And that gives you the gradient that teaches your diffusion model to predict noise very well, given a noisy picture. Okay?"},{"start":5468.42,"text":"In practice, the algorithm is almost the same as the one I presented. There are some tweaks. I'm not going to go into the details for the sake of time, but you can see in the paper, it's not that much more complicated. It's exactly the same idea. Just some engineering tweaks to fit into a certain noise schedule or a certain probability distribution. Any questions on the training process? Or is everyone able to train a diffusion model now? Yeah."},{"start":5503.17,"text":"Good question. What's the order of magnitude of how much images we need? Well, remember, the core idea of generative modeling is you want way more images than the capacity of your model. So if your model is a 10 billion parameter model, you want to have relatively a lot more images. If you're training a micro diffusion model, you actually might not need to sample that many images. Generally, if you ask foundation model provider, they tell you, just give us unlimited."},{"start":5531.35,"text":"data and we just keep feeding it over time and we monitor the loss function. And as soon as the loss starts capping, we probably are at capacity and we might need to find a variation to the core algorithm, you know, a different neural network architecture, a denoising schedule or so on. That's what's going to make the difference at that point. Good question."},{"start":5554.76,"text":"Okay, so now that we understand the training process, we're going to move to the test time process. The only thing I want to say is that the diffusion, actual diffusion seminal paper is slightly different. The difference is that instead of the very simplistic relationship I gave you between Xt plus 1 and Xt, the relationship looks more like this, where the noise is scheduled. So there is a certain parameter that controls the noise added at each time step."}],"speech_gaps":[],"frame":"../frames/v058/033.webp","frame_time":5418.09},{"title":"扩散模型的采样与推理过程","segments":[{"id":257,"text":"So you might want to add less noise at the beginning and more noise towards the end to make the task increasingly hard, for example. On top of that, it's not really true that you just take XT and you overlay noise on it. The reality is you actually erase or shrink certain pixels from the original image and you add to it some random Gaussian noise only to certain selected pixels that are randomly sampled.","zh":"因此，你可能希望在开始时添加较少的噪声，而在结束时添加更多的噪声，以使任务变得越来越困难，例如。除此之外，实际上并不是简单地将XT与噪声叠加。现实情况是，你实际上是通过从原始图像中擦除或缩小某些像素，并仅在随机采样的某些选定像素上添加一些随机高斯噪声。","start":5584.84,"end":5613.44},{"id":258,"text":"Again, not a big deal. Same idea, just different mathematical formulation. If you now extend that with our recurrence, it looks more like this. The relationship between Xt and X0 is slightly more complicated, nothing too complicated for you all. But that's what you would find in the paper. Same idea. So now let's talk about sampling or test time inference.","zh":"同样，这并不是什么大问题。同样的想法，只是数学表达方式不同。如果你现在结合我们的递归关系，它看起来会更像这样。Xt与X0之间的关系稍微复杂一些，但对你们来说并不太复杂。但这就是你在论文中会找到的内容。同样的想法。现在让我们谈谈采样或测试时间推理。","start":5613.98,"end":5641.22},{"id":259,"text":"Now we have trained our diffusion model. We're trying to use it in practice. So this is exactly how you can think of DALI or when you ask a foundation model to generate an image. They've already trained the diffusion model. It's sitting somewhere in the cloud. There's an architecture, there's a set of parameters, and you're asking it via a prompt to generate something. So here is how it works.","zh":"现在我们已经训练好了扩散模型。我们试图在实际中使用它。因此，你可以这样思考DALI，或者当你要求一个基础模型生成图像时。它们已经训练好了扩散模型，它位于云端的某个地方。存在一个架构，有一组参数，你通过提示来要求它生成某些内容。这就是它的运作方式。","start":5642.4,"end":5664.78},{"id":260,"text":"you start with an initialization. The initialization can be a random image, completely random. You are going to perform a progressive denoising. So for each step, you're going to try to find the noise and completely denoise it.","zh":"你从一个初始化开始。这个初始化可以是一张完全随机的图像。你将进行渐进式去噪。因此，在每一步中，你将尝试找到噪声并完全去除它。","start":5665.26,"end":5684.32},{"id":261,"text":"which is a little bit counterintuitive. So this image, we're giving it to the diffusion model, and the diffusion model is saying, I found this noise. This is my predicted noise. You then take that noise. The number of time step is arbitrary at that point. You might say, denoise for 45 steps. It denoises it. You take that prediction, and you subtract it from the original. And you're going to start to see where the model is going at that point.","zh":"这在直觉上有点反常。因此，这张图像被提供给扩散模型，扩散模型会说，我找到了这个噪声。这是我的预测噪声。然后你取这个噪声。此时时间步数是任意的。你可能会说，去噪45步。它进行去噪。你取这个预测结果，并将其从原始图像中减去。你将开始看到模型在那个时刻的走向。","start":5684.78,"end":5711.28},{"id":262,"text":"You're going to get a new noisy image. You're going to again run diffusion on T time steps. And you're going to get a noise prediction. You're going to subtract it again. And here you're going to start again to start where the model is going. And the task is going to become easier and easier for the model. So now you start seeing sort of the shape of a dog. You do another denoising on many time steps. You subtract. Ah, we're starting to see the dog. The noise is easier to find.","zh":"你将得到一张新的带噪声的图像。你将再次在T个时间步上运行扩散过程。你将得到一个噪声预测。你将再次将其减去。在这里，你将再次开始，从模型所处的位置开始。任务将变得越来越容易。现在你开始看到某种狗的形状。你再次在许多时间步上进行去噪。你减去噪声。啊，我们开始看到狗的形状了。噪声更容易被找到。","start":5712.12,"end":5740.03},{"id":263,"text":"Ah, subtract again, you're getting the dog. As you can see, computationally, it's heavy. It's really, really heavy to perform even one image. You have to call the diffusion model many times on many time steps until you get something that looks real. But the task becomes easier and easier as you call it again and again.","zh":"啊，再次减去，你将得到狗的图像。如你所见，计算上这是很繁重的。即使生成一张图像，进行一次扩散模型的计算也是非常非常耗时的。你必须在许多时间步上多次调用扩散模型，直到得到一张看起来真实的图像。但随着你不断调用它，任务将变得越来越容易。","start":5740.67,"end":5764.17}],"notes":["本段讲解了扩散模型在生成图像时的采样过程，强调了在训练阶段模型学习如何从噪声中逐步恢复图像。在推理阶段，模型从一个随机初始化的图像开始，通过逐步去除噪声来生成最终图像。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5584.84,"end":5764.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5584.84,"text":"So you might want to add less noise at the beginning and more noise towards the end to make the task increasingly hard, for example. On top of that, it's not really true that you just take XT and you overlay noise on it. The reality is you actually erase or shrink certain pixels from the original image and you add to it some random Gaussian noise only to certain selected pixels that are randomly sampled."},{"start":5613.98,"text":"Again, not a big deal. Same idea, just different mathematical formulation. If you now extend that with our recurrence, it looks more like this. The relationship between Xt and X0 is slightly more complicated, nothing too complicated for you all. But that's what you would find in the paper. Same idea. So now let's talk about sampling or test time inference."},{"start":5642.4,"text":"Now we have trained our diffusion model. We're trying to use it in practice. So this is exactly how you can think of DALI or when you ask a foundation model to generate an image. They've already trained the diffusion model. It's sitting somewhere in the cloud. There's an architecture, there's a set of parameters, and you're asking it via a prompt to generate something. So here is how it works."},{"start":5665.26,"text":"you start with an initialization. The initialization can be a random image, completely random. You are going to perform a progressive denoising. So for each step, you're going to try to find the noise and completely denoise it."},{"start":5684.78,"text":"which is a little bit counterintuitive. So this image, we're giving it to the diffusion model, and the diffusion model is saying, I found this noise. This is my predicted noise. You then take that noise. The number of time step is arbitrary at that point. You might say, denoise for 45 steps. It denoises it. You take that prediction, and you subtract it from the original. And you're going to start to see where the model is going at that point."},{"start":5712.12,"text":"You're going to get a new noisy image. You're going to again run diffusion on T time steps. And you're going to get a noise prediction. You're going to subtract it again. And here you're going to start again to start where the model is going. And the task is going to become easier and easier for the model. So now you start seeing sort of the shape of a dog. You do another denoising on many time steps. You subtract. Ah, we're starting to see the dog. The noise is easier to find."},{"start":5740.67,"text":"Ah, subtract again, you're getting the dog. As you can see, computationally, it's heavy. It's really, really heavy to perform even one image. You have to call the diffusion model many times on many time steps until you get something that looks real. But the task becomes easier and easier as you call it again and again."}],"speech_gaps":[],"frame":"../frames/v058/034.webp","frame_time":5596.84},{"title":"对抗鲁棒性与生成模型中的扩散过程","segments":[{"id":264,"text":"Great question. So why do we get a dog if we start from a random image? The model will take you where it wants to take you. Here, we had no guarantees that it will lead to a dog. In practice...","zh":"非常好的问题。那么，如果我们从一张随机图像开始，为什么我们会得到一只狗呢？模型会带你去它想带你去的地方。在这里，我们没有任何保证它会引导你得到一只狗。实际上……","start":5774.02,"end":5784.1},{"id":265,"text":"There is conditioning. So the tweak that Sora might have versus what we saw together is you might during training not only condition on a prompt, on a text prompt, or condition on sort of an embedding from a different modality that can help you guide that generation. But the vanilla generation is this one. You start from a random image, you generate a high-quality, good-looking image. Same question? Okay.","zh":"存在条件约束。因此，Sora可能在训练过程中与我们所看到的不同之处在于，你可能不仅仅根据提示（文本提示）进行条件约束，或者根据来自不同模态的嵌入来帮助引导生成。但基本的生成过程就是这个。你从一张随机图像开始，生成一张高质量、好看的图像。同样的问题？好的。","start":5784.33,"end":5808.28},{"id":266,"text":"You start from random Gaussian noise and then you progressively denoise until you're happy with your output. Yes. Yeah. You have to do it separately. Yeah. So that's literally what it takes to generate one image with diffusion. It's really, really computationally.","zh":"你从随机高斯噪声开始，然后逐步去噪，直到你对输出满意为止。是的。是的。你必须单独进行这个过程。是的。因此，这实际上就是生成一张图像所需的全部过程。它真的非常、非常耗费计算资源。","start":5809.88,"end":5839.05},{"id":267,"text":"Imagine the number of times you have to call the diffusion model in order to get something. And if you remember in the early days of mid-journey, I don't know, people used mid-journey in the early days or no? You would remember that you would sort of see how the image is appearing over time, right? Even with still some foundational model provider, you see that. Well, that's the analogous to the diffusion model, is how many times you have to call back in order for the denoising to happen.","zh":"想象一下你需要调用扩散模型多少次才能得到一个结果。如果你还记得在MidJourney早期的日子，不知道你们是否使用过MidJourney？你会记得你看到图像随着时间逐渐出现，对吧？即使在仍然有基础模型提供商的情况下，你也能看到这一点。这与扩散模型是类似的，即你需要调用多少次才能完成去噪过程。","start":5839.79,"end":5866.01},{"id":268,"text":"Okay, I have a couple more things to share and then we'll wrap it up. But because the vanilla diffusion is so computationally expensive, we found another solution, latent diffusion. You might have heard that word a lot, like latent diffusion models, because today most diffusion models are latent, which means that...","zh":"好的，我还有几个要点要分享，然后我们就结束吧。但由于基本的扩散过程如此耗费计算资源，我们找到了另一种解决方案，即潜在扩散（latent diffusion）。你可能听过这个词很多次，比如潜在扩散模型，因为如今大多数扩散模型都是潜在的，这意味着……","start":5867.14,"end":5888.1},{"id":269,"text":"Instead of performing our operation in the pixel space of images, we are going to use an autoencoder to project our original image in a lower dimensional space, perform our noising process on that lower dimensional space. The important thing is we always have some sort of a decoder that can send us back in the image space when we need it.","zh":"我们不再在图像的像素空间中执行操作，而是使用自编码器将原始图像投影到一个较低维的空间中，在这个较低维的空间中进行噪声处理。重要的是，我们始终拥有一种解码器，可以在需要时将我们送回图像空间。","start":5888.48,"end":5912.54},{"id":270,"text":"That is sort of revolutionary in the diffusion process because you don't actually need to do the noising process, the forward diffusion process in the pixel space. What you in fact do is you take your image X0, you use an encoder to encode it in a lower dimensional space.","zh":"这在扩散过程中有点革命性，因为你实际上不需要在像素空间中进行去噪过程，即前向扩散过程。你实际上所做的，是将你的图像X0通过编码器编码到一个更低维的空间中。","start":5913.2,"end":5933.88}],"notes":["本段讲解了扩散模型的基本原理，即从随机高斯噪声开始，逐步去噪以生成高质量图像。这涉及了扩散模型的核心思想，即通过逐步去除噪声来生成图像。","讲者提到，扩散模型在实践中需要多次调用模型以完成去噪过程，这与早期的Midjourney等生成模型的使用方式类似，用户可以看到图像逐步生成的过程。","为了减少计算成本，讲者介绍了latent diffusion（潜在扩散）的概念，即通过使用自编码器将图像映射到低维空间进行去噪，再通过解码器恢复到图像空间。","潜在扩散模型的革命性在于，它不需要在像素空间中进行前向扩散过程，而是通过编码器将图像转换到低维空间，从而减少计算量。","讲者强调了编码器和解码器在潜在扩散模型中的作用，即编码器将图像压缩到低维空间，解码器则负责将低维表示恢复为图像。","这些内容展示了扩散模型的两种主要形式：vanilla diffusion（原始扩散）和latent diffusion（潜在扩散），并解释了它们在计算效率和实现方式上的差异。"],"formulas":[{"latex":"X_0","symbols":"初始图像","explanation":"表示初始的干净图像，通常为高斯噪声或真实图像。","evidence":"That is sort of revolutionary in the diffusion process because you don't actually need to do the noising process, the forward diffusion process in the pixel space. What you in fact do is you take your image X0, you use an encoder to encode it in a lower dimensional space."}],"uncertainties":["uncertain: 'call back' 可能指调用模型，但具体含义需进一步确认。"],"diagram":"none","start":5774.02,"end":5933.88,"asr_flags":[],"math_clarifications":["公式X_t和X_0→X_1→...→X_T未提供足够的上下文信息，如时间步长T、去噪过程的具体数学描述等，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5774.02,"text":"Great question. So why do we get a dog if we start from a random image? The model will take you where it wants to take you. Here, we had no guarantees that it will lead to a dog. In practice..."},{"start":5784.33,"text":"There is conditioning. So the tweak that Sora might have versus what we saw together is you might during training not only condition on a prompt, on a text prompt, or condition on sort of an embedding from a different modality that can help you guide that generation. But the vanilla generation is this one. You start from a random image, you generate a high-quality, good-looking image. Same question? Okay."},{"start":5809.88,"text":"Good. So this is what you find in the paper again. But, you know, you start from random Gaussian noise and then you progressively denoise until you're happy with your output. Yes. Yeah. You have to do it separately. Yeah. So that's literally what it takes to generate one image with diffusion. It's really, really computationally."},{"start":5839.79,"text":"Imagine the number of times you have to call the diffusion model in order to get something. And if you remember in the early days of mid-journey, I don't know, people used mid-journey in the early days or no? You would remember that you would sort of see how the image is appearing over time, right? Even with still some foundational model provider, you see that. Well, that's the analogous to the diffusion model, is how many times you have to call back in order for the denoising to happen."},{"start":5867.14,"text":"Okay, I have a couple more things to share and then we'll wrap it up. But because the vanilla diffusion is so computationally expensive, we found another solution, latent diffusion. You might have heard that word a lot, like latent diffusion models, because today most diffusion models are latent, which means that..."},{"start":5888.48,"text":"Instead of performing our operation in the pixel space of images, we are going to use an autoencoder to project our original image in a lower dimensional space, perform our noising process on that lower dimensional space. The important thing is we always have some sort of a decoder that can send us back in the image space when we need it."},{"start":5913.2,"text":"That is sort of revolutionary in the diffusion process because you don't actually need to do the noising process, the forward diffusion process in the pixel space. What you in fact do is you take your image X0, you use an encoder to encode it in a lower dimensional space."}],"speech_gaps":[],"frame":"../frames/v058/035.webp","frame_time":5786.02},{"title":"扩散模型与潜在空间的表示","segments":[{"id":271,"text":"We can call this Z0 using the same notation as we've done with GANs and the prior weeks with embeddings. And then you actually are doing the same forward diffusion process in the Z space, which is a much smaller space. Again, it's not too small because if it's too small, then you don't have a lot of flexibility. You want it big enough.","zh":"我们可以使用与GANs以及之前周次中嵌入所用的相同符号来称呼这个Z0。然后你实际上是在Z空间中执行相同的前向扩散过程，这个空间要小得多。再次强调，它并不太小，因为如果太小，那么你将缺乏很多灵活性。你希望它足够大。","start":5934.6,"end":5955.92},{"id":272,"text":"but not too big that it's computationally heavy. So we keep doing that. We add epsilons until we get to the T time step for Z, where we've added T times epsilon. The diffusion process looks like the following. You take your Z and you train a diffusion process, a model to predict the cumulative noise that's been added to that embedding.","zh":"但也不能太大以至于计算负担过重。因此我们继续这样做。我们不断添加epsilon，直到达到Z的T时间步，此时我们已经添加了T次epsilon。扩散过程如下所示。你取你的Z，并训练一个扩散过程，一个模型来预测添加到该嵌入中的累积噪声。","start":5956.46,"end":5982.22},{"id":273,"text":"And then if you were to actually subtract, you would get the original Z that you're looking for. And assuming you do that well, you would use a decoder to go back to the image space at the end and generate a nice image. So you're doing exactly the same thing in the latent space versus the space of images.","zh":"然后如果你实际进行减法操作，你将得到你所寻找的原始Z。假设你做得很好，你将在最后使用解码器回到图像空间，并生成一张清晰的图像。因此你在潜在空间中所做的与在图像空间中所做的完全相同。","start":5983.37,"end":6002.13},{"id":274,"text":"Well, you mean what we learned with adversarial examples where you do the optimization process and then you realize you have an image of an iguana, but that doesn't look like an iguana? No, you're not likely to see that here because you actually learn to remove noise. So the task has been created so that noise is being removed. And so you know that the model is meant to get back a real image or something that looks like it.","zh":"你是指我们之前学到的对抗性示例，其中你执行优化过程，然后发现你得到了一只鬣蜥的图像，但看起来不像鬣蜥？不会，你在这里不太可能看到这种情况，因为实际上你学习的是去除噪声。任务的设计使得噪声被去除。因此你知道模型的目的是恢复一张真实的图像或看起来像真实图像的东西。","start":6022.22,"end":6044.54},{"id":275,"text":"Okay, so latent space is the lower dimensional representation of the original data. And it forces essentially the encoder to capture the most important features of pattern of the image while ignoring irrelevant details. And the compressed representation should have enough information. It should be big enough to encode enough information about the original image, but in a more compact form to make it computationally more","zh":"好的，潜在空间是原始数据的低维表示。它迫使编码器捕捉图像模式中最重要的特征，同时忽略无关的细节。压缩的表示应该包含足够的信息。它应该足够大，以编码关于原始图像的足够信息，但以更紧凑的形式，使其在计算上更容易处理。","start":6046.25,"end":6074.06},{"id":276,"text":"easier to manage. And this, as you can imagine, helps a lot with computations. So during sampling time, we just get back the Z0 and at the end we decode and we get back a clean image. Now, as I was saying earlier, in practice, the diffusion process is conditioned on another modality. So during that process,","zh":"正如你可以想象的那样，这在计算上帮助很大。因此在采样过程中，我们只需得到Z0，最后进行解码，得到一张干净的图像。正如我之前所说的，实际上，扩散过程是基于另一种模态进行条件的。因此在该过程中，","start":6075.25,"end":6105.02}],"notes":["本段讲解了扩散模型在潜在空间中的应用，强调了潜在空间作为原始数据的低维表示，其作用是让编码器捕捉图像的重要特征，同时忽略无关细节。潜在空间的大小需要足够大以保留足够的信息，但又不能太大以免计算负担过重。","在扩散过程中，模型被训练以预测累积的噪声，通过逐步去除噪声，最终可以生成干净的图像。这一过程与对抗样本中的优化过程不同，因为扩散模型的目标是去除噪声，而不是引入噪声。","潜在空间的压缩表示需要在紧凑性与信息保留之间取得平衡，这有助于计算效率。在采样阶段，只需恢复Z0并解码即可得到最终图像。","在实际应用中，扩散过程通常会结合其他模态进行条件化处理，这表明模型可以处理多模态数据，增强其泛化能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5934.6,"end":6105.02,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5934.6,"text":"We can call this Z0 using the same notation as we've done with GANs and the prior weeks with embeddings. And then you actually are doing the same forward diffusion process in the Z space, which is a much smaller space. Again, it's not too small because if it's too small, then you don't have a lot of flexibility. You want it big enough."},{"start":5956.46,"text":"but not too big that it's computationally heavy. So we keep doing that. We add epsilons until we get to the T time step for Z, where we've added T times epsilon. The diffusion process looks like the following. You take your Z and you train a diffusion process, a model to predict the cumulative noise that's been added to that embedding."},{"start":5983.37,"text":"And then if you were to actually subtract, you would get the original Z that you're looking for. And assuming you do that well, you would use a decoder to go back to the image space at the end and generate a nice image. So you're doing exactly the same thing in the latent space versus the space of images."},{"start":6022.22,"text":"Well, you mean what we learned with adversarial examples where you do the optimization process and then you realize you have an image of an iguana, but that doesn't look like an iguana? No, you're not likely to see that here because you actually learn to remove noise. So the task has been created so that noise is being removed. And so you know that the model is meant to get back a real image or something that looks like it."},{"start":6046.25,"text":"Okay, so latent space is the lower dimensional representation of the original data. And it forces essentially the encoder to capture the most important features of pattern of the image while ignoring irrelevant details. And the compressed representation should have enough information. It should be big enough to encode enough information about the original image, but in a more compact form to make it computationally more"},{"start":6075.25,"text":"easier to manage. And this, as you can imagine, helps a lot with computations. So during sampling time, we just get back the Z0 and at the end we decode and we get back a clean image. Now, as I was saying earlier, in practice, the diffusion process is conditioned on another modality. So during that process,"}],"speech_gaps":[],"frame":"../frames/v058/036.webp","frame_time":5946.6},{"title":"扩散模型与视频生成的挑战","segments":[{"id":277,"text":"you might actually train using a prompt, a text prompt. So you would take a text prompt, you would vectorize it, and you would concatenate it with whatever thing you're denoising here.","zh":"你可能会使用一个提示，一个文本提示来训练。因此，你会将一个文本提示进行向量化，并将其与你正在去噪的任何内容进行拼接。","start":6105.66,"end":6117.54},{"id":278,"text":"So you could actually train a diffusion network that takes as input both an image of a beach and then an image of a dog or a prompt that says, I want a dog sitting on the beach. And then those two things will be vectorized by encoders and will be concatenated with.","zh":"因此，你实际上可以训练一个扩散网络，其输入包括一张海滩的图像和一张狗的图像，或者一个提示，例如“我想看到一只坐在海滩上的狗”。然后，这些内容将通过编码器进行向量化，并与我们之前看到的过程进行拼接。","start":6118.61,"end":6139.37},{"id":279,"text":"the process we've seen so that the model also learns relationships between these modalities. And at test time, you would not start from a random image. You would start with a prompt or an image conditioning the diffusion process. Does that make sense? Super. Now, let's talk about VO and Sora and video models. What makes video generation more complicated than what we've just seen together? Yes. Yeah.","zh":"这样模型也会学习这些模态之间的关系。在测试时，你不会从随机图像开始，而是从一个提示或一张图像来引导扩散过程。这清楚吗？很好。现在，让我们谈谈VO和Sora以及视频模型。与我们刚刚一起看到的相比，视频生成更复杂的原因是什么？是的。对的。","start":6139.81,"end":6180.63},{"id":280,"text":"So a video, if you use the network we trained for a video, you will just get images that have nothing to do like each other and it will not look like anything continuous. You might see super weird movements and it will not work. So video has the time components that you need to think about. But everything we've learned still applies. It is just that we are...","zh":"如果你使用
