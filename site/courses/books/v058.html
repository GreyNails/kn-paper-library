</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：对抗鲁棒性和生成模型 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v058.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v058","title":"斯坦福CS230：对抗鲁棒性和生成模型","course":"深度学习","pages":[{"title":"对抗鲁棒性与生成模型","segments":[{"id":0,"text":"Welcome to CS230 lecture 4. Thank you for coming in person or joining online. Today's lecture is one of my favorites. It's a fun one. There's a lot of visuals that we look at and we cover a lot of modern methods as well. A lot of the content is brand new.","zh":"欢迎来到CS230第4讲。感谢你们亲自到场或在线参与。今天的讲座是我最喜欢的之一。它很有趣。我们将观看很多视觉内容，并涵盖很多现代方法。很多内容都是全新的。","start":1.84,"end":27.42},{"id":1,"text":"The focus areas for us today is going to be two topics, adversarial robustness and generative modeling. Adversarial robustness is an important topic today because there are more and more.","zh":"我们今天要关注的两个主题是对抗鲁棒性和生成模型。对抗鲁棒性是一个重要的主题，因为越来越多的AI模型被应用于实际场景中。你们每天都在使用数十个这样的模型。随着算法被越来越多地使用，它们更容易受到攻击。因此，我们必须更加小心，并主动构建防御措施，这使得对抗攻击和防御的研究领域非常繁荣。","start":29.29,"end":46.24},{"id":2,"text":"AI models in the wild. You're using dozens of them on a daily basis. And the more algorithms are being used, the more they're prone to attacks. And the more we have to be careful and build defenses proactively, which is what makes this research field of adversarial attacks and defenses very prolific. The other topic we cover is generative models, which","zh":"另一个我们讨论的主题是生成模型，正如你们可能在新闻中看到的，这个领域现在非常热门。现在视频生成已经成为现实，图像生成你们都已经很熟悉了。当然还有文本生成和代码生成，我们每天都使用这些技术。这个领域非常火热。因此，我们将尝试解析驱动像Sora或Veo等产品背后的算法类型。你们对这个感兴趣吗？让我们一如既往地保持互动。我们首先从对抗鲁棒性开始。这可能需要我们大约30到45分钟。","start":46.9,"end":75.42},{"id":3,"text":"as you may have seen in the news, is really, really hot right now. You have video generation now becoming a reality, image generation, which you're all already used to. And of course, text generation, code generation, which we all use regularly. There's a lot of heat in that space. And so we're going to try to break down what are the types of algorithms that power","zh":"然后我们将后半部分的重点放在生成模型上，特别是生成对抗网络（GANs）。即使它被称为对抗，它与对抗攻击并没有直接关联。这是一个不同的问题。然后是扩散模型，我认为这是目前图像和视频生成产品中最流行或最常用的算法类型。","start":75.96,"end":100.5},{"id":4,"text":"products like Sora or Veo and so on. Are you excited for this? So let's keep it interactive as always. We'll start with adversarial robustness. It should probably take us...","zh":"那么，我们首先从对抗鲁棒性开始，并向你们提出一个开放性问题。你们能举出对AI模型的攻击的例子吗？你们在使用AI时有没有担心的事情？是的。提示注入。提示注入。这是什么？比如，你们会偷偷地将一些比特插入提示中，比如复制粘贴的内容，但不会在上面产生任何红脸（即不会被检测到）。","start":102.24,"end":116.42},{"id":5,"text":"30 to 45 minutes. And then we keep the latter part focused on generative models with a focus on GANs, generative adversarial networks. Even if it's called adversarial, it is not really connected to adversarial attacks. It's a different problem. And then diffusion models, which are, I would say, the most popular type or family of algorithm for today's image and video generation products.","zh":"30到45分钟。然后我们将后半部分重点放在生成模型上，特别是生成对抗网络，即GANs。即使它被称为对抗性，它实际上与对抗攻击并没有真正的联系。这是不同的问题。然后是扩散模型，我认为它们是当今图像和视频生成产品中最流行的一种或一类算法。","start":116.8,"end":142.86},{"id":6,"text":"So let's start with adversarial robustness with an open question for you all. Can you tell me examples of attacks on AI models? Are you worried about anything when you use AI? Yes. Prompt injection. Prompt injection. What is that? Like, you, like, sneak set bits into, like, a prompt, like a copy-paste that doesn't make blushes on there.","zh":"提示注入。这是什么？比如，你们会偷偷地将一些比特插入提示中，比如复制粘贴的内容，但不会在上面产生任何红脸（即不会被检测到）。","start":143.8,"end":173.31}],"notes":["本段介绍了课程的两个主要主题：对抗鲁棒性和生成模型。对抗鲁棒性是当前研究领域的重要方向，因为AI模型在实际应用中越来越容易受到攻击，因此需要主动构建防御机制。生成模型则是一个热门领域，涉及视频、图像、文本和代码生成等应用。","对抗鲁棒性与生成模型是两个独立的主题，尽管名称中都包含“adversarial”，但它们的研究目标和方法完全不同。对抗鲁棒性关注的是如何使模型对攻击具有鲁棒性，而生成模型则关注如何生成高质量的数据。","生成模型中提到的GANs（生成对抗网络）和扩散模型是当前图像和视频生成产品的主流技术。GANs通过生成器和判别器的对抗过程来生成数据，而扩散模型则通过逐步去噪的过程生成数据。","课程中还提到，对抗鲁棒性研究的繁荣源于AI模型在实际应用中的广泛使用，这使得攻击和防御的研究变得尤为重要。生成模型的热度则体现在其在多个领域的实际应用中，如视频生成、图像生成、文本生成和代码生成。","课程中还提到，对抗鲁棒性研究的一个具体例子是“prompt injection”，即通过在提示中插入特定内容来影响模型的输出。这表明对抗攻击不仅限于数据层面，还可能涉及提示工程。","课程最后提到，对抗鲁棒性部分预计需要30到45分钟，之后将重点讲解生成模型，特别是GANs和扩散模型。这表明课程内容将分为两个主要部分，分别深入探讨这两个主题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1.84,"end":173.31,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1.84,"text":"Welcome to CS230 lecture 4. Thank you for coming in person or joining online. Today's lecture is one of my favorites. It's a fun one. There's a lot of visuals that we look at and we cover a lot of modern methods as well. A lot of the content is brand new."},{"start":29.29,"text":"The focus areas for us today is going to be two topics, adversarial robustness and generative modeling. Adversarial robustness is an important topic today because there are more and more."},{"start":46.9,"text":"AI models in the wild. You're using dozens of them on a daily basis. And the more algorithms are being used, the more they're prone to attacks. And the more we have to be careful and build defenses proactively, which is what makes this research field of adversarial attacks and defenses very prolific. The other topic we cover is generative models, which"},{"start":75.96,"text":"as you may have seen in the news, is really, really hot right now. You have video generation now becoming a reality, image generation, which you're all already used to. And of course, text generation, code generation, which we all use regularly. There's a lot of heat in that space. And so we're going to try to break down what are the types of algorithms that power"},{"start":102.24,"text":"products like Sora or Veo and so on. Are you excited for this? So let's keep it interactive as always. We'll start with adversarial robustness. It should probably take us..."},{"start":116.8,"text":"30 to 45 minutes. And then we keep the latter part focused on generative models with a focus on GANs, generative adversarial networks. Even if it's called adversarial, it is not really connected to adversarial attacks. It's a different problem. And then diffusion models, which are, I would say, the most popular type or family of algorithm for today's image and video generation products."},{"start":143.8,"text":"So let's start with adversarial robustness with an open question for you all. Can you tell me examples of attacks on AI models? Are you worried about anything when you use AI? Yes. Prompt injection. Prompt injection. What is that? Like, you, like, sneak set bits into, like, a prompt, like a copy-paste that doesn't make blushes on there."}],"speech_gaps":[],"frame":"../frames/v058/001.webp","frame_time":13.84},{"title":"对抗攻击与生成模型中的数据污染","segments":[{"id":7,"text":"Yeah, so we talk about prompt injections, but you essentially try to fool the LLM, let's say, by giving it an instruction that might bypass another instruction that the builder of the model, the user of the model wanted you to use in the first place. It might create dangerous situations where you might steal information such as passwords or PII data. What else? Yeah.","zh":"是的，我们谈到提示注入，但你基本上试图通过给LLM一个指令来欺骗它，比如说，绕过模型构建者或模型使用者最初希望你使用的另一个指令。这可能会造成危险的情况，例如窃取信息，如密码或PII数据。还有别的吗？","start":174.86,"end":202.89},{"id":8,"text":"huh language oh night night what is that it's like a data poisoning for ai art so","zh":"嗯语言哦晚上晚上那是什么，它像是AI艺术中的数据污染","start":204.11,"end":213.83},{"id":9,"text":"i believe it takes some image and for example the result is on the cat but it gives the image some","zh":"我相信它是通过一些图像，例如结果是在猫上，但它给图像添加了一些","start":213.83,"end":220.95},{"id":10,"text":"features of the dog so it tries to trick the thing like learning the features of the dog","zh":"狗的特征，所以它试图欺骗系统，比如学习狗的特征","start":220.95,"end":227.09},{"id":11,"text":"I see. Great one. A type of data poisoning attack where you're trying to fool the model by inserting certain pixels or certain traits that might confuse the model and in turn allow someone to bypass the algorithm, for example.","zh":"我明白了。很好。这是一种数据污染攻击，你试图通过插入某些像素或某些特征来欺骗模型，从而让模型产生混淆，进而让某人绕过算法，例如。","start":227.09,"end":242.49},{"id":12,"text":"Yeah, you're right. What else?","zh":"是的，你说得对。还有别的吗？","start":242.89,"end":244.43},{"id":13,"text":"What are use cases where a model being attacked can be very high risk?","zh":"模型被攻击时，哪些应用场景可能带来非常高的风险？","start":246.11,"end":252.33},{"id":14,"text":"Yeah, you know, LLMs are trained on the wild, there's a lot of data online, it might","zh":"是的，你知道的，LLMs是在互联网上训练的，网上有大量的数据，它可能会","start":266.15,"end":271.77},{"id":15,"text":"be actually trained on banking numbers, social security numbers, if someone can reverse engineer","zh":"实际上是在银行号码、社会安全号码等数据上进行训练，如果有人能够反向工程这些训练数据并找到这些信息，那么构建该大语言模型的公司","start":271.77,"end":276.97},{"id":16,"text":"the training data and find this information, it puts the company that's building that LLM","zh":"肯定会面临风险，用户也会受到影响。","start":276.97,"end":283.05},{"id":17,"text":"at risk for sure, and the users as well.","zh":"嗯，好的，如果有人想补充其他观点，你也会想到有很多原因，比如在自动驾驶领域，汽车被训练以识别停车标志，如果有人恶意地","start":283.05,"end":284.97},{"id":18,"text":"well okay anyone wants to add anything else you know there's a lot of reasons as well if you think","zh":"试图修改算法，使其无法识别停车标志，这可能会导致事故并造成潜在危害。","start":284.97,"end":291.97},{"id":19,"text":"of autonomous driving you know a car is trained to detect stop signs and if someone maliciously","zh":"它可能会造成伤害。","start":291.97,"end":299.51},{"id":20,"text":"tries to you know modify sort of the algorithm so that it doesn't see the stop sign","zh":"它可能会造成伤害。","start":299.51,"end":305.57},{"id":21,"text":"it may create a crash and potentially harm","zh":"它可能会造成伤害。","start":305.57,"end":308.31},{"id":22,"text":"form.","zh":"它可能会造成伤害。","start":308.31,"end":308.47},{"id":23,"text":"Those are a lot of examples. We're going to cover that. I would say that in the space of adversarial attacks, we've had three waves over the last 10 years, where in 2013, Christian Zegedi, with a great paper on intriguing properties of neural network, essentially tells us that small perturbations, let's say to an image, can fool a computer vision model.","zh":"这些例子有很多。我们将会讲到这一点。我认为在对抗攻击领域，过去十年中我们经历了三个阶段，其中在2013年，Christian Zegedi发表了一篇关于神经网络 intriguing properties 的出色论文，基本上告诉我们，对图像进行微小扰动，就可以欺骗计算机视觉模型。","start":309.79,"end":334.13}],"notes":["本段讨论了对抗攻击中的数据污染攻击，即通过插入特定像素或特征来误导模型，从而绕过算法。这种攻击可能被用于生成模型中，例如在AI艺术生成中，模型可能被误导生成包含特定特征的图像。","课堂中提到，LLMs（大型语言模型）在训练过程中可能接触到敏感信息，如银行号码和社会安全号码。如果攻击者能够反向工程训练数据并提取这些信息，将对模型构建公司和用户造成风险。","在自动驾驶领域，对抗攻击可能被用于修改算法，使车辆无法识别交通标志，从而导致事故。这种攻击具有很高的风险，可能对公共安全造成威胁。","课堂还提到，对抗攻击在过去十年中经历了三个阶段，其中2013年Christian Szegedy的论文揭示了神经网络对微小扰动的敏感性，这标志着对抗攻击研究的开始。"],"formulas":[],"uncertainties":["huh language oh night night what is that it's like a data poisoning for ai art so","i believe it takes some image and for example the result is on the cat but it gives the image some","features of the dog so it tries to trick the thing like learning the features of the dog","the training data and find this information, it puts the company that's building that LLM","it may create a crash and potentially harm"],"diagram":"none","start":174.86,"end":334.13,"asr_flags":[22],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":174.86,"text":"Yeah, so we talk about prompt injections, but you essentially try to fool the LLM, let's say, by giving it an instruction that might bypass another instruction that the builder of the model, the user of the model wanted you to use in the first place. It might create dangerous situations where you might steal information such as passwords or PII data. What else? Yeah."},{"start":204.11,"text":"huh language oh night night what is that it's like a data poisoning for ai art so"},{"start":213.83,"text":"i believe it takes some image and for example the result is on the cat but it gives the image some"},{"start":220.95,"text":"features of the dog so it tries to trick the thing like learning the features of the dog"},{"start":227.09,"text":"I see. Great one. A type of data poisoning attack where you're trying to fool the model by inserting certain pixels or certain traits that might confuse the model and in turn allow someone to bypass the algorithm, for example."},{"start":242.89,"text":"Yeah, you're right. What else?"},{"start":246.11,"text":"What are use cases where a model being attacked can be very high risk?"},{"start":266.15,"text":"Yeah, so, you know, LLMs are trained on the wild, there's a lot of data online, it might"},{"start":271.77,"text":"be actually trained on banking numbers, social security numbers, if someone can reverse engineer"},{"start":276.97,"text":"the training data and find this information, it puts the company that's building that LLM"},{"start":283.05,"text":"at risk for sure, and the users as well."},{"start":284.97,"text":"well okay anyone wants to add anything else you know there's a lot of reasons as well if you think"},{"start":291.97,"text":"of autonomous driving you know a car is trained to detect stop signs and if someone maliciously"},{"start":299.51,"text":"tries to you know modify sort of the algorithm so that it doesn't see the stop sign"},{"start":305.57,"text":"it may create a crash and potentially harm"},{"start":308.31,"text":"form."},{"start":309.79,"text":"Those are a lot of examples. We're going to cover that. I would say that in the space of adversarial attacks, we've had three waves over the last 10 years, where in 2013, Christian Zegedi, with a great paper on intriguing properties of neural network, essentially tells us that small perturbations, let's say to an image, can fool a computer vision model."}],"speech_gaps":[{"start":259.44,"end":261.264},{"start":261.264,"end":265.75}],"frame":"../frames/v058/002.webp","frame_time":186.86},{"title":"对抗攻击与生成模型中的安全挑战","segments":[{"id":24,"text":"Like you might not actually see the perturbation, but the model, which looks at pixels as numbers, sees the perturbation. And even in perceptible perturbation can widely change the output of the model. And this is very dangerous. Those are called adversarial attacks and or adversarial examples. And you can think of them as optical illusions for neural networks. A few years later, you know, as.","zh":"你可能实际上看不到扰动，但模型会将像素视为数字，因此它能看到扰动。即使在可感知的扰动下，模型的输出也可能发生广泛变化。这非常危险。这些被称为对抗攻击或对抗样本。你可以将它们视为神经网络的视觉错觉。几年后，你知道，当训练模型变得更加普遍，更多人开始训练模型。事实上，最重要的是，大量网络上的数据被抓取。因此，模型在抓取网络数据。","start":334.92,"end":365.42},{"id":25,"text":"training models was more common, more people were training models. And in fact, most importantly, a lot of scraping happened online. So models were scraping the web.","zh":"另一种你提到的攻击类型变得突出，即后门攻击或数据中毒攻击，攻击者可能会在线隐藏某些内容。你知道，一个大型基础模型提供商会在某个时候发送一个机器人，该机器人会读取这些数据，收集并将其放入训练集中。你实际上为后续攻击创建了一个入口点，当该模型投入生产时。最近还有提示注入攻击。","start":366.5,"end":375.34},{"id":26,"text":"Another type of attack which you mentioned became prominent, backdoor attacks or data poisoning attacks, which is as an attacker, you might actually hide certain things online. And you know that a large foundation model provider will at some point send a bot that's going to read that data, collect it, put it in a training set. You essentially created an entry point for your attack later on when that model will be in production. And then more recently, prompt injections.","zh":"我们都非常常用提示。而且，有很多恶意的提示注入或越狱攻击可能发生，以覆盖模型原本的意图。我们也会讨论这些攻击。所有这些攻击都相关，这是一个研究领域，但重要的是在高层次上了解这些攻击是如何工作的。这个领域的一个特别之处是：","start":375.97,"end":406.92},{"id":27,"text":"We all use prompts very commonly. And there's a lot of malicious prompt injection or jailbreaking attacks that can happen to override what the model was intended to do originally. And we'll also talk about these attacks. All of them are relevant and it's a research area, but it's important to know at a high level how those attacks work. One thing that is special about this space.","zh":"我认为是，对于每一个新的防御方法，都会出现新的攻击方法；对于每一个新的攻击方法，也会出现新的防御方法。因此，防御和攻击在相互竞争。坦率地说，在人工智能领域，包括斯坦福大学的Gates部门，提出攻击方法的人和提出防御方法的人往往是同一批人。","start":407.71,"end":434.63},{"id":28,"text":"I would say is that for every new defense, there's a new attack. And for every new attack, there's a new defense. So it's defenses and attacks competing with each other. And you'll find, frankly, that in the AI space, including in the gates department here at Stanford, a lot of the people who are coming up with attacks are the same that are coming up with defenses.","zh":"但这是重要的。需要注意的是，这些攻击的发展历程是：最初，在2014-2018年期间，很多攻击都是利用输入进行的。而随着人工智能代理现在开始使用指令、上下文和检索管道，攻击的入口点大大增加了。因此，模型变得更加脆弱。","start":435.29,"end":455.23},{"id":29,"text":"But it matters. One thing to note is the progression of these attacks is that originally, if you look 2014-2018 period, a lot of the attacks were using the inputs. And as AI agents sort of now work with instruction, with context, with retrieval pipelines, there is a lot more entry points to perform an attack. And so models are more vulnerable.","zh":"但这是重要的。需要注意的是，这些攻击的发展历程是：最初，在2014-2018年期间，很多攻击都是利用输入进行的。而随着人工智能代理现在开始使用指令、上下文和检索管道，攻击的入口点大大增加了。因此，模型变得更加脆弱。","start":457.61,"end":480.6},{"id":30,"text":"We'll talk about retrieval augmented generation in a lecture in two to three weeks, maybe three weeks. And you'll see that when you connect an agent to a database that you might not know, there's a lot of risks involved in that. It might be reading a document that can maliciously attack your agent. Okay, so let's try to come up with a first attack, an adversarial example.","zh":"我们将在两到三周后的讲座中讨论检索增强生成。也许需要三周时间。你会看到，当你将一个智能体连接到一个你可能不了解的数据库时，其中涉及很多风险。它可能会读取一份能够恶意攻击你的智能体的文档。好的，那么让我们尝试想出一个第一种攻击方式，一个对抗性示例。","start":481.9,"end":506.68}],"notes":["本段介绍了对抗攻击的基本概念，即微小的扰动可能对模型输出产生巨大影响，这种现象被称为对抗样本或对抗攻击。这些攻击可以被视为神经网络的‘视觉错觉’，并且在2014-2018年间，攻击主要依赖于输入数据。","随着AI代理的发展，攻击方式也变得更加复杂，例如通过数据污染或后门攻击，攻击者可以在训练阶段植入恶意数据，从而在模型部署后实现攻击目的。此外，提示注入攻击（prompt injection）也成为新的攻击手段，攻击者可以通过恶意提示覆盖模型的原始意图。","对抗攻击和防御机制之间存在持续的博弈关系，每当一种新的防御方法被提出，攻击者也会相应地开发新的攻击方式。这种动态平衡在AI领域，包括斯坦福大学的Gates部门，都得到了体现。","随着AI代理开始使用指令、上下文和检索管道，攻击的入口点也显著增加，导致模型更加脆弱。例如，连接代理到未知数据库时，可能会读取恶意文档，从而对代理造成攻击。","课程中提到，对抗攻击的研究是一个重要的研究领域，需要从高层次理解其工作原理。同时，课程还预告了将在未来几周讨论检索增强生成（retrieval augmented generation）的相关内容，以进一步探讨模型安全问题。","最后，课程鼓励学生尝试构建第一个对抗样本，以加深对对抗攻击的理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":334.92,"end":506.68,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":334.92,"text":"Like you might not actually see the perturbation, but the model, which looks at pixels as numbers, sees the perturbation. And even in perceptible perturbation can widely change the output of the model. And this is very dangerous. Those are called adversarial attacks and or adversarial examples. And you can think of them as optical illusions for neural networks. A few years later, you know, as."},{"start":366.5,"text":"training models was more common, more people were training models. And in fact, most importantly, a lot of scraping happened online. So models were scraping the web."},{"start":375.97,"text":"Another type of attack which you mentioned became prominent, backdoor attacks or data poisoning attacks, which is as an attacker, you might actually hide certain things online. And you know that a large foundation model provider will at some point send a bot that's going to read that data, collect it, put it in a training set. You essentially created an entry point for your attack later on when that model will be in production. And then more recently, prompt injections."},{"start":407.71,"text":"We all use prompts very commonly. And there's a lot of malicious prompt injection or jailbreaking attacks that can happen to override what the model was intended to do originally. And we'll also talk about these attacks. All of them are relevant and it's a research area, but it's important to know at a high level how those attacks work. One thing that is special about this space."},{"start":435.29,"text":"I would say is that for every new defense, there's a new attack. And for every new attack, there's a new defense. So it's defenses and attacks competing with each other. And you'll find, frankly, that in the AI space, including in the gates department here at Stanford, a lot of the people who are coming up with attacks are the same that are coming up with defenses."},{"start":457.61,"text":"But it matters. One thing to note is the progression of these attacks is that originally, if you look 2014-2018 period, a lot of the attacks were using the inputs. And as AI agents sort of now work with instruction, with context, with retrieval pipelines, there is a lot more entry points to perform an attack. And so models are more vulnerable."},{"start":481.9,"text":"We'll talk about retrieval augmented generation in a lecture in two to three weeks, maybe three weeks. And you'll see that when you connect an agent to a database that you might not know, there's a lot of risks involved in that. It might be reading a document that can maliciously attack your agent. Okay, so let's try to come up with a first attack, an adversarial example."}],"speech_gaps":[],"frame":"../frames/v058/003.webp","frame_time":346.92},{"title":"对抗鲁棒性与生成模型中的攻击方法","segments":[{"id":31,"text":"in the image space. So my problem for you, and we're going to do it like last week, more interactive, like two weeks ago, given a network that is pre-trained on ImageNet. So remember, ImageNet has a bunch of classes, a lot of images, so it can detect pretty much all the common objects, people that you can imagine would be in a picture. Can you find an input image that will be classified as an iguana?","zh":"在图像空间中。所以我的问题是给你们的，我们将像上周那样，更加互动，像两周前那样，给定一个在ImageNet上预训练的网络。请记住，ImageNet包含很多类别，很多图像，因此它可以检测几乎所有常见的物体，人们可以想象出现在图片中的内容。你能找到一张输入图像，使其被分类为鬣蜥吗？","start":507.78,"end":533.8},{"id":32,"text":"You know, so what I'm asking you is you have that neural network, it's pre-trained, and I want you to find an image. But instead of, you know, you take an image of a cat, of course, if you give it to the model, it's going to say, hey, I think it's a cat. What I'm asking you is how do you find an image such that the output is iguana? So how do you do that? Yes. Take a picture of an iguana, give it to the model, and it's likely to find an iguana. That's a fair solution. What else?","zh":"你知道的，我问你们的是，你们有一个神经网络，它是预训练的，我想要你们找到一张图像。但不是像你们拿一张猫的图片，给模型，它就会说，嘿，我认为它是猫。我问你们的是，如何找到一张图像，使得输出是鬣蜥？所以你们如何做到这一点？是的。拍一张鬣蜥的图片，给模型，它很可能识别为鬣蜥。这是一个合理的解决方案。还有其他方法吗？","start":536.68,"end":569.99},{"id":33,"text":"Although you wouldn't even be guaranteed that it finds the iguana. Probably it would, but it depends on the model performance. How can you be guaranteed that it's going to predict it as an iguana? Yeah, you want to try it? OK, so assuming you have access to the training sets of the model, you can find pictures labeled as iguanas. And it's likely that because it's been trained on that data set, it will, in fact, predict it as an iguana. That's also true.","zh":"虽然你们甚至不能保证它会识别为鬣蜥。可能它会，但取决于模型的性能。你们如何能保证它会预测为鬣蜥？是的，你们想试试看吗？好的，假设你们有访问模型训练集的权限，你们可以找到被标记为鬣蜥的图片。并且因为模型是在该数据集上训练的，它实际上会预测为鬣蜥。这也是正确的。","start":573.26,"end":606.28},{"id":34,"text":"Now let's say you don't have access to the model parameters. Yeah. Yeah. Okay. I see. So you send a bunch of pictures.","zh":"现在假设你们无法访问模型参数。是的。是的。好的。我明白了。所以你们发送一堆图片。","start":606.9,"end":621.98},{"id":35,"text":"And you hit it until you find that the prediction is iguana. And then you say that's a picture. Yeah, correct. So that's sort of an optimization problem you're posing, which is what we're going to do. And so remember two weeks ago, I told you like designing loss functions is an important skill, maybe an art in neural networks. Here's an example of you coming up with a loss function that would allow you to forge an attack on pretty much any model. So here's what we're going to do. We're going to rephrase what we want in simple words.","zh":"然后你们不断尝试，直到找到预测结果为鬣蜥的图片。然后你们说这就是一张图片。是的，正确。所以这就是你们提出的优化问题，我们将进行这样的操作。请记住两周前，我告诉你们设计损失函数是一项重要的技能，也许在神经网络中是一种艺术。这里是一个例子，你们可以提出一个损失函数，从而能够对几乎任何模型发起攻击。所以这里我们将怎么做。我们将用简单的语言重新表述我们的目标。","start":622.81,"end":652.15},{"id":36,"text":"We want to find x, the input, such that y hat of x is equal to the label for iguana. So the prediction is as close as possible to y iguana. If you had to do that in terms of a loss function, what would it look like? A loss function you want to minimize, let's say. Yeah. Mean squared error between what and what?","zh":"我们想要找到输入x，使得x的预测y hat等于鬣蜥的标签。因此，预测结果应尽可能接近鬣蜥的标签。如果你要用损失函数来实现这一点，它会是什么样子呢？比如说，你想最小化的损失函数。对吧。那它是两个什么之间的均方误差？","start":653.25,"end":686.29}],"notes":["本段讲解了如何通过设计损失函数来实现对神经网络的攻击，目标是找到一个输入x，使得模型的预测输出y_hat(x)尽可能接近标签y_iguana（即蜥蜴）。这涉及将问题转化为一个优化问题，其中损失函数用于衡量预测结果与目标标签之间的差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":507.78,"end":686.29,"asr_flags":[],"math_clarifications":["公式中的等号应为接近关系，而非直接相等。此外，损失函数应明确为均方误差或其他合适的损失函数，以衡量预测输出与目标标签之间的差异。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":507.78,"text":"in the image space. So my problem for you, and we're going to do it like last week, more interactive, like two weeks ago, given a network that is pre-trained on ImageNet. So remember, ImageNet has a bunch of classes, a lot of images, so it can detect pretty much all the common objects, people that you can imagine would be in a picture. Can you find an input image that will be classified as an iguana?"},{"start":536.68,"text":"You know, so what I'm asking you is you have that neural network, it's pre-trained, and I want you to find an image. But instead of, you know, you take an image of a cat, of course, if you give it to the model, it's going to say, hey, I think it's a cat. What I'm asking you is how do you find an image such that the output is iguana? So how do you do that? Yes. Take a picture of an iguana, give it to the model, and it's likely to find an iguana. That's a fair solution. What else?"},{"start":573.26,"text":"Although you wouldn't even be guaranteed that it finds the iguana. Probably it would, but it depends on the model performance. How can you be guaranteed that it's going to predict it as an iguana? Yeah, you want to try it? OK, so assuming you have access to the training sets of the model, you can find pictures labeled as iguanas. And it's likely that because it's been trained on that data set, it will, in fact, predict it as an iguana. That's also true."},{"start":606.9,"text":"Now let's say you don't have access to the model parameters. Yeah. Yeah. Okay. I see. So you send a bunch of pictures."},{"start":622.81,"text":"And you hit it until you find that the prediction is iguana. And then you say that's a picture. Yeah, correct. So that's sort of an optimization problem you're posing, which is what we're going to do. And so remember two weeks ago, I told you like designing loss functions is an important skill, maybe an art in neural networks. Here's an example of you coming up with a loss function that would allow you to forge an attack on pretty much any model. So here's what we're going to do. We're going to rephrase what we want in simple words."},{"start":653.25,"text":"We want to find x, the input, such that y hat of x is equal to the labor for iguana. So the prediction is as close as possible to y iguana. If you had to do that in terms of a loss function, what would it look like? A loss function you want to minimize, let's say. Yeah. Mean squared error between what and what?"}],"speech_gaps":[],"frame":"../frames/v058/004.webp","frame_time":519.78},{"title":"对抗鲁棒性与生成模型中的图像扰动","segments":[{"id":37,"text":"Yeah, Y hat and Y iguana. Good. Yeah, I agree. You could put an L2 distance between Y hats, given the parameters, biases, the weights and biases, and Y iguana. And if you minimize that, then...","zh":"是的，Y hat 和 Y iguana。很好。是的，我同意。你可以根据参数、偏置、权重和偏置，以及 Y iguana，计算 Y hat 之间的 L2 距离。如果你最小化这个距离，那么……","start":690.27,"end":704.63},{"id":38,"text":"you would get X to lead to Y hat equals Y iguana or as close as possible to it. So there is one difference here with what we've seen in the past, which is that we are not touching the parameters of the network. We're starting from an image X. We're sending that image in the network. We're computing the defined loss function. And then we're computing the gradients of L.","zh":"你将得到 X 使得 Y hat 等于 Y iguana 或尽可能接近它。这里与我们过去看到的不同之处在于，我们没有调整网络的参数。我们从一张图像 X 开始，将该图像输入网络，计算定义的损失函数，然后计算损失函数 L 关于输入像素的梯度。","start":705.16,"end":731.92},{"id":39,"text":"with respect to the input pixels. So, you know, in gradient descent, you're used to the training process where you push the parameters to the right or to the left. Here, you're doing the same thing in the pixel space. The model is completely fixed. It's already pre-trained. And if you do that many times with gradient descent, you should end up with an image that is going to be predicted as iguana. Does that make sense to everyone? Yeah. So now the question is,","zh":"在梯度下降中，你习惯于训练过程，即推动参数向左或向右。在这里，你是在像素空间中做同样的事情。模型是完全固定的，它已经预训练好了。如果你多次使用梯度下降，你应该会得到一张被预测为 iguana 的图像。这让大家都有道理吗？是的。现在问题是，","start":732.44,"end":761.0},{"id":40,"text":"Will the forged image X look like an iguana or not? Who thinks it will look like an iguana? Who thinks it will not? Someone wants to say why? You think it will not look like an iguana? Yeah. You think the chance is low? You're not convinced that pushing pixels in a certain direction will lead to a continuous set of colors that would look like an iguana? Okay, that's a good intuition.","zh":"伪造的图像 X 会看起来像 iguana 吗？谁认为它会看起来像 iguana？谁认为不会？有人想解释一下原因吗？你认为它不会看起来像 iguana 吗？是的。你认为这种可能性很低吗？你不确定通过向像素空间中某个方向推动像素是否会导致连续的颜色集合看起来像 iguana？好的，这是一个很好的直觉。","start":762.16,"end":801.03},{"id":41,"text":"I see. So you're saying there is more images that are classified as iguana by the model than there are iguana images possible. Yeah, that's also a good intuition. Exactly. Yeah.","zh":"我明白了。你是在说，被模型分类为 iguana 的图像比实际可能的 iguana 图像更多。是的，这也是一个很好的直觉。没错。是的。","start":818.73,"end":833.55}],"notes":["本段讨论了对抗样本的生成方法，即通过最小化预测输出与目标标签之间的L2距离来扰动输入图像。讲者指出，这种方法不修改网络参数，而是通过梯度下降在像素空间中调整输入图像，使其被模型预测为特定类别（如‘iguana’）。"],"formulas":[],"uncertainties":["Y iguana","Y hat","L2 distance","gradient descent","pixel space","pre-trained","continuous set of colors"],"diagram":"none","start":690.27,"end":833.55,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":690.27,"text":"Yeah, Y hat and Y iguana. Good. Yeah, I agree. You could put an L2 distance between Y hats, given the parameters, biases, the weights and biases, and Y iguana. And if you minimize that, then..."},{"start":705.16,"text":"you would get X to lead to Y hat equals Y iguana or as close as possible to it. So there is one difference here with what we've seen in the past, which is that we are not touching the parameters of the network. We're starting from an image X. We're sending that image in the network. We're computing the defined loss function. And then we're computing the gradients of L."},{"start":732.44,"text":"with respect to the input pixels. So, you know, in gradient descent, you're used to the training process where you push the parameters to the right or to the left. Here, you're doing the same thing in the pixel space. The model is completely fixed. It's already pre-trained. And if you do that many times with gradient descent, you should end up with an image that is going to be predicted as iguana. Does that make sense to everyone? Yeah. So now the question is,"},{"start":762.16,"text":"Will the forged image X look like an iguana or not? Who thinks it will look like an iguana? Who thinks it will not? Someone wants to say why? You think it will not look like an iguana? Yeah. You think the chance is low? You're not convinced that pushing pixels in a certain direction will lead to a continuous set of colors that would look like an iguana? Okay, that's a good intuition."},{"start":818.73,"text":"I see. So you're saying there is more images that are classified as iguana by the model than there are iguana images possible. Yeah, that's also a good intuition. Exactly. Yeah."}],"speech_gaps":[],"frame":"../frames/v058/005.webp","frame_time":702.27},{"title":"对抗鲁棒性与生成模型中的图像伪造","segments":[{"id":42,"text":"I see, I see. Yeah. Okay, so you're saying we might see some patterns that are like an iguana, but it's unlikely the picture will look like an iguana as a whole. Yeah, it's a good example. For example, possibly the picture we're going to see is more green than not. Let's say, maybe. That's possible. So you're right. It is highly unlikely that the forged image will look like an iguana.","zh":"我明白了，我明白了。是的。好吧，你是在说我们可能会看到一些类似鬣蜥的图案，但整张图片看起来像鬣蜥的可能性很低。是的，这是一个很好的例子。例如，我们可能会看到的图片可能比不那么绿色。比如说，可能如此。这是有可能的。所以你是对的。伪造的图片看起来像鬣蜥的可能性非常高。","start":849.82,"end":872.02},{"id":43,"text":"And the reason is all of what you mentioned. Let's imagine the space of possible input images to the network. It turns out this space is way bigger than the space that us humans look at. We never look at the randomness of images in the wild. We look at actually a fairly small distribution of patterns from our eyes. And so let's say this is the space of possible input images. This space is very large.","zh":"原因就是你提到的所有内容。让我们想象一下网络可能接收的输入图像空间。结果发现这个空间比我们人类所观察的要大得多。我们从不观察自然界中图像的随机性。我们实际上只观察我们眼睛所看到的相对较小的图案分布。因此，假设这是可能的输入图像空间。这个空间非常大。","start":873.55,"end":900.93},{"id":44,"text":"The space of real images, what we come up as humans when we look at the world, is much smaller than that. And the blue space is this size because the model can take anything as an input. 256 pixels on a 32 by 32 by 3 channels is gigantic. It's way more than the number of atoms in the universe.","zh":"真实图像的空间，也就是我们作为人类观察世界时所看到的空间，比那个空间要小得多。蓝色空间之所以这么大，是因为模型可以接受任何输入。32乘32乘3通道的256像素图像非常巨大。它比宇宙中的原子数量还要多。","start":901.48,"end":925.47},{"id":45,"text":"And so it is very likely that, you know, because of the way we defined our optimization problem, that our image will fall in the green space, the space of images that are classified as iguana. And yes, there is an overlap between the green and the red space. Those are the iguanas that are following the real distribution. But the space is much bigger, as you were saying. And that's why it's unlikely that we'll end up there. OK, so this is more likely what we'll see.","zh":"因此，由于我们定义优化问题的方式，我们的图像很可能落在绿色空间中，也就是被分类为鬣蜥的图像空间。是的，绿色空间和红色空间之间确实有重叠。这些是遵循真实分布的鬣蜥。但这个空间要大得多，正如你所说。这就是为什么我们不太可能到达那里。好的，所以这更可能是我们看到的情况。","start":927.28,"end":955.44},{"id":46,"text":"It does not look at all like an iguana. Okay. Does that make sense? So now we're going to go one step further because it's nice to be able to forge an attack. But if it looks random, it looks random to humans. So, you know, you're looking at a stop sign that's been forged. It doesn't look at all like a stop sign. Someone will just take it down. Right. So a smarter attacker is going to try to come up with an image that also looks like something to the human.","zh":"它看起来一点也不像鬣蜥。好的。这有意义吗？现在我们将进一步前进，因为能够伪造攻击是很好的。但如果看起来是随机的，对人类来说看起来也是随机的。所以，你知道的，你看到的是一个被伪造的停车标志。它看起来一点也不像停车标志。有人会直接把它拿走。对吧。因此，一个更聪明的攻击者会尝试生成一张看起来也像某种东西的图像。","start":956.84,"end":987.42},{"id":47,"text":"And that might be more problematic. Let's say, you know, a stop sign still looks like a stop sign, but it's not predicted as a stop sign. That becomes way more dangerous. So how do we modify the previous setup in order to do that? Given a network pre-trained on ImageNet, find an input image that is displaying a cat.","zh":"而且这可能会更加有问题。比如说，你知道，一个停车标志仍然看起来像一个停车标志，但它没有被预测为停车标志。这变得要危险得多。那么我们如何修改之前的设置以实现这一点？给定一个在ImageNet上预训练的网络，找到一个输入图像，该图像显示的是猫。","start":987.88,"end":1011.64}],"notes":["本段讨论了对抗样本的生成问题，特别是图像伪造中如何让图像看起来像真实对象但被模型错误分类。讲者通过举例说明，即使图像看起来像某种动物（如鬣蜥），但整体上不太可能被误认为是该动物。这涉及到对抗样本的鲁棒性问题，即模型在面对微小扰动时的分类错误。","讲者进一步解释了输入空间的大小，指出模型可以接受的输入空间远大于人类实际观察到的图像分布。这说明模型在面对大量可能的输入时，容易产生错误分类，因为人类的视觉感知范围有限。","讲者提到图像空间的大小，例如32x32x3的图像有256个像素，其空间规模远大于宇宙中的原子数量。这强调了模型在处理高维输入时的挑战，以及对抗样本可能存在的广泛分布。","讲者指出，由于优化问题的定义，生成的图像更可能落在被分类为鬣蜥的绿色空间中，但该空间与红色空间（真实分布）有重叠。这说明模型在分类时可能误将某些图像归为特定类别。","讲者进一步讨论了更危险的对抗样本类型，即图像看起来像真实对象但被模型错误分类。例如，伪造的停车标志看起来像停车标志，但模型未将其识别为停车标志，这可能带来更大的安全风险。","最后，讲者提出如何修改之前的设置以生成更危险的对抗样本，即在预训练的ImageNet网络上，寻找一个显示猫的输入图像。这表明对抗样本的生成需要更复杂的优化策略，以使图像既符合人类视觉又被模型错误分类。"],"formulas":[],"uncertainties":[],"diagram":"none","start":849.82,"end":1011.64,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":849.82,"text":"I see, I see. Yeah. Okay, so you're saying we might see some patterns that are like an iguana, but it's unlikely the picture will look like an iguana as a whole. Yeah, it's a good example. For example, possibly the picture we're going to see is more green than not. Let's say, maybe. That's possible. So you're right. It is highly unlikely that the forged image will look like an iguana."},{"start":873.55,"text":"And the reason is all of what you mentioned. Let's imagine the space of possible input images to the network. It turns out this space is way bigger than the space that us humans look at. We never look at the randomness of images in the wild. We look at actually a fairly small distribution of patterns from our eyes. And so let's say this is the space of possible input images. This space is very large."},{"start":901.48,"text":"The space of real images, what we come up as humans when we look at the world, is much smaller than that. And the blue space is this size because the model can take anything as an input. 256 pixels on a 32 by 32 by 3 channels is gigantic. It's way more than the number of atoms in the universe."},{"start":927.28,"text":"And so it is very likely that, you know, because of the way we defined our optimization problem, that our image will fall in the green space, the space of images that are classified as iguana. And yes, there is an overlap between the green and the red space. Those are the iguanas that are following the real distribution. But the space is much bigger, as you were saying. And that's why it's unlikely that we'll end up there. OK, so this is more likely what we'll see."},{"start":956.84,"text":"It does not look at all like an iguana. Okay. Does that make sense? So now we're going to go one step further because it's nice to be able to forge an attack. But if it looks random, it looks random to humans. So, you know, you're looking at a stop sign that's been forged. It doesn't look at all like a stop sign. Someone will just take it down. Right. So a smarter attacker is going to try to come up with an image that also looks like something to the human."},{"start":987.88,"text":"And that might be more problematic. Let's say, you know, a stop sign still looks like a stop sign, but it's not predicted as a stop sign. That becomes way more dangerous. So how do we modify the previous setup in order to do that? Given a network pre-trained on ImageNet, find an input image that is displaying a cat."}],"speech_gaps":[],"frame":"../frames/v058/006.webp","frame_time":861.82},{"title":"对抗鲁棒性与生成模型中的对抗样本构造","segments":[{"id":48,"text":"But instead of predicting it as a cat, the model now predicts it as an iguana because the image has been tempered. So how do we change our initial pipeline? Yeah, that's probably a good idea. You might start with an image of a cat. And because your starting point is a cat, you might be tempering some pixels, but it will still look like a cat. Yeah, you're right. That's a good idea. What else? Other ideas? Yeah.","zh":"但模型现在不是将其预测为猫，而是预测为鬣蜥，因为图像已经被调整过。那么我们该如何改变我们的初始流程？是的，这可能是个好主意。你可能会从一张猫的图像开始。由于你的起始点是一张猫的图像，你可能会调整一些像素，但它仍然看起来像猫。是的，你说得对。这是个好主意。还有其他想法吗？是的。","start":1013.06,"end":1053.83},{"id":49,"text":"Yeah, you're right. That's exactly what we do. Both techniques are correct. So we take our initial setup and we modify it slightly. So if I rephrase what we want, we want to find X such as Y hat of X equals Y of iguana. But we also want X to be close to an image X cat. Right. If I define the loss function, I will keep my initial term of the L2 distance between the.","zh":"是的，你说得对。这正是我们所做的。这两种技术都是正确的。因此，我们从初始设置出发，并对其进行轻微修改。因此，如果我重新表述我们的目标，我们想要找到一个X，使得X的预测目标Y帽等于Y鬣蜥。但我们还想让X接近你选择的X猫图像。对的。如果我定义损失函数，我会保留初始的L2距离项。","start":1065.04,"end":1095.32},{"id":50,"text":"prediction targets. And I will also add another constraint, which you can think of as a regularization term, which keeps X close to the Xcat picture that you've chosen. And now you have two targets that are optimized at the same time. And so if you do that enough time, you should end up with a picture that looks like your Xcat target. You might even, as you said, want to start the optimization rather than starting with a completely random image. You start from the Xcat and you temper it.","zh":"我会添加另一个约束条件，你可以将其视为一个正则化项，它保持X接近你所选择的X猫图像。现在你有两个目标同时被优化。因此，如果你反复进行这样的操作，你应该最终得到一张看起来像你所选择的X猫目标的图像。你甚至可能希望从优化开始，而不是从完全随机的图像开始。你从X猫图像出发，对其进行调整。","start":1095.86,"end":1126.92},{"id":51,"text":"And that might be faster, actually. Does that make sense to everyone? So this is a more difficult attack to deal with because it might look to you like a cat still, but to the model, it doesn't look like a cat anymore. And oftentimes, you might see that some of the pixels have been pushed to the side.","zh":"这实际上可能更快。这能让大家理解吗？因此，这是一类更难处理的攻击，因为它看起来仍然像猫，但对模型来说，它已经不再像猫了。通常，你可能会看到一些像素被推到一边。","start":1127.54,"end":1156.07},{"id":52,"text":"adversarial examples that you can forge. Where are we on this map in the new setup? Well, we are right now in a different space. We are in the space of images that look real to human and are classified as iguana, but they're not real. So we're right here. We're at the crossroad of the green and the purple space. They look real to us, but they're not actually real and they're classified as an iguana. Super.","zh":"你可以伪造的对抗样本在哪里？在新的设置中，我们目前处于一个不同的空间。我们处于一个看起来对人类真实但被分类为鬣蜥的图像空间中，但它们并不真实。因此，我们目前处于这里。我们处于绿色和紫色空间的交叉点。它们对我们来说看起来真实，但实际上并不真实，并且被分类为鬣蜥。超级。","start":1156.77,"end":1191.24}],"notes":["本段讨论了对抗样本构造中的一种方法，即通过修改初始图像（如猫）来生成看起来像猫但被模型识别为鬣蜥的图像。这种修改通常通过优化目标函数实现，其中包含两个目标：一个是使图像保持与原始图像（如猫）相似，另一个是使模型输出目标类别（如鬣蜥）。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","在优化过程中，通常会使用L2距离作为初始目标函数的一部分，并添加一个正则化项以保持图像与原始图像的相似性。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","对抗样本的构造通常从原始图像（如猫）开始，并通过调整部分像素来生成对抗样本。这种调整可能使图像在视觉上仍接近原始图像，但在模型分类上发生改变。这种构造方法在对抗攻击中较为常见，因为其生成的样本在视觉上不易察觉。","对抗样本的构造方法通常涉及优化目标函数，其中包含两个目标：一个是使图像保持与原始图像相似，另一个是使模型输出目标类别。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","对抗样本的构造方法通常涉及优化目标函数，其中包含两个目标：一个是使图像保持与原始图像相似，另一个是使模型输出目标类别。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。","对抗样本的构造方法通常涉及优化目标函数，其中包含两个目标：一个是使图像保持与原始图像相似，另一个是使模型输出目标类别。这种双重优化目标的设置使得对抗样本在视觉上仍接近原始图像，但在模型分类上发生改变。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1013.06,"end":1191.24,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1013.06,"text":"But instead of predicting it as a cat, the model now predicts it as an iguana because the image has been tempered. So how do we change our initial pipeline? Yeah, that's probably a good idea. You might start with an image of a cat. And because your starting point is a cat, you might be tempering some pixels, but it will still look like a cat. Yeah, you're right. That's a good idea. What else? Other ideas? Yeah."},{"start":1065.04,"text":"Yeah. OK, so you would also modify the optimization targets. Yeah, you're right. That's exactly what we do. Both techniques are correct. So we take our initial setup and we modify it slightly. So if I rephrase what we want, we want to find X such as Y hat of X equals Y of iguana. But we also want X to be close to an image X cat. Right. If I define the loss function, I will keep my initial term of the L2 distance between the."},{"start":1095.86,"text":"prediction targets. And I will also add another constraint, which you can think of as a regularization term, which keeps X close to the Xcat picture that you've chosen. And now you have two targets that are optimized at the same time. And so if you do that enough time, you should end up with a picture that looks like your Xcat target. You might even, as you said, want to start the optimization rather than starting with a completely random image. You start from the Xcat and you temper it."},{"start":1127.54,"text":"And that might be faster, actually. Does that make sense to everyone? So this is a more difficult attack to deal with because it might look to you like a cat still, but to the model, it doesn't look like a cat anymore. And oftentimes, you might see that some of the pixels have been pushed to the side. Okay, so these are examples of..."},{"start":1156.77,"text":"adversarial examples that you can forge. Where are we on this map in the new setup? Well, we are right now in a different space. We are in the space of images that look real to human and are classified as iguana, but they're not real. So we're right here. We're at the crossroad of the green and the purple space. They look real to us, but they're not actually real and they're classified as an iguana. Super."}],"speech_gaps":[],"frame":"../frames/v058/007.webp","frame_time":1025.06},{"title":"对抗样本与生成模型中的对抗性攻击","segments":[{"id":53,"text":"Let's look at a concrete example from 2017 where this group of researchers took an image and tempered it and is running a model on a phone. And you can see that the prediction here is a library. But when you look at the other one, it's a prison. And we know that libraries are not prison. And here's another example we can look at with the washing machine.","zh":"让我们来看一个2017年的具体例子，其中一组研究人员对一张图像进行了处理，并在手机上运行模型。你可以看到这里的预测结果是一个图书馆。但当你看另一个图像时，预测结果却是一个监狱。我们知道图书馆和监狱是不同的。这里还有一个我们可以观察的例子，就是洗衣机。","start":1192.34,"end":1221.08},{"id":54,"text":"Again, this is a real device with the model, the computer vision model running on it. The prediction is a washer here. And then if you move it to the other picture, it is a doormat. Got it. Here's another interesting one. Same methods, adversarial patch. You might have seen it in the news more recently. Here's a group of students and researchers that come up with a patch.","zh":"同样，这是一个带有模型的真实设备，计算机视觉模型在其中运行。这里的预测结果是一个洗衣机。然后如果你将它移动到另一张图片上，预测结果却是一个门垫。明白了。这里还有一个有趣的例子。使用相同的方法，对抗性贴片。你可能在最近的新闻中见过这个例子。这里有一组学生和研究人员提出了一种贴片。","start":1223.9,"end":1251.08},{"id":55,"text":"And when you wear the patch, the model essentially doesn't see you. Quite interesting. So this one is actually a slightly more complex problem because in the past, we've actually seen patches that might, you might have seen that in the news where someone sticks a patch on a stop sign.","zh":"当你佩戴这个贴片时，模型基本上看不到你。这非常有趣。所以这个例子实际上是一个稍微复杂一点的问题，因为在过去，我们实际上见过一些贴片，你可能在新闻中见过，有人在停车标志上贴了一个贴片。","start":1251.73,"end":1274.58},{"id":56,"text":"And then the car doesn't see it as a stop sign anymore, which is, again, very dangerous. But stop signs are all the same. There's no intraclass variability. People, there's a lot more intraclass variability. And so having a patch that can essentially work across all intraclass variabilities was quite novel when they came up with it.","zh":"然后汽车就不再把停车标志识别为停车标志了，这同样是非常危险的。但停车标志都是相同的，没有同类变异性。而人则具有更多的同类变异性。因此，当他们提出这种贴片时，能够跨所有同类变异性起作用的贴片是非常新颖的。","start":1275.19,"end":1298.11},{"id":57,"text":"And the way they do it is also quite interesting. Again, now you have the baggage, the technical baggage to understand how they did it. They optimized the patch by looking at certain outputs and they modified the pixels of the patch and then they printed the patch, essentially. Does that make sense? One of the interesting things I liked about this paper was they were quite creative with their loss function. If you look at the paper, the loss function has three components to it. And one of the components is...","zh":"他们实现的方法也非常有趣。现在你已经具备了理解他们如何做到这一点的技术背景。他们通过观察某些输出来优化贴片，并修改贴片的像素，然后打印出贴片。这听起来合理吗？我非常喜欢这篇论文的一个有趣之处是，他们在损失函数上非常有创意。如果你看一下论文，损失函数有三个组成部分。其中一个组成部分是……","start":1300.37,"end":1329.57},{"id":58,"text":"that the colors have to belong to the set of printable colors so that their printers can actually print it. Because otherwise you end up with something that is really hard to print and you cannot print your patch. A second term of their loss function was to smooth out the colors in the patch so that the patch looks like something that could be printed more easily. Imagine every pixel being different and trying to print that much harder. So that's an example of a group of researchers that has crafted a loss function for the purpose of what they were trying.","zh":"颜色必须属于可打印颜色的集合，这样打印机才能实际打印出来。否则，你最终会得到一个非常难以打印的东西，而无法打印你的补丁。他们损失函数中的第二项是为了使补丁中的颜色更加平滑，从而使补丁看起来更容易打印。想象每个像素都不同，试图打印这样会更加困难。这就是一个研究人员小组为了实现他们的目标而设计损失函数的例子。","start":1329.87,"end":1359.09}],"notes":["本段介绍了对抗样本的实例，如2017年研究人员通过在图像中添加对抗性扰动，使模型在手机上做出错误预测。例如，一张图片被识别为图书馆，而另一张则被识别为监狱，这说明模型对输入的敏感性。此外，还提到洗衣机和门垫的例子，说明对抗样本可以影响不同场景下的模型预测。","本段进一步说明了对抗性攻击的复杂性，特别是对抗性贴片的应用。例如，将贴片贴在停车标志上，使自动驾驶汽车无法识别，这展示了对抗样本在现实世界中的潜在危险。同时，也指出停车标志的类别内变化较少，而人类的类别内变化更多，因此设计一个能适应所有类别内变化的贴片是创新的。","本段讨论了对抗性贴片的实现方法，包括优化贴片以适应特定输出，并修改贴片的像素以实现打印。此外，还提到论文中损失函数的三个组成部分，其中一个是确保颜色在可打印范围内，另一个是平滑颜色以提高打印可行性。","本段强调了对抗性攻击中损失函数的设计，特别是如何通过优化颜色和像素来实现实际应用。例如，颜色必须在打印机可打印范围内，否则无法打印贴片。同时，平滑颜色可以减少打印难度，这体现了研究人员在设计损失函数时的创造性。","本段总结了对抗性攻击的挑战和创新点，包括对抗性贴片的设计、优化方法以及损失函数的构建。这些方法不仅提高了攻击的有效性，还考虑了实际应用中的限制，如打印可行性。","本段通过具体例子说明了对抗样本的潜在危害和实际应用，强调了对抗性攻击在计算机视觉中的重要性。同时，也展示了研究人员在设计对抗性攻击时的创新思维和实际考量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1192.34,"end":1359.09,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1192.34,"text":"Let's look at a concrete example from 2017 where this group of researchers took an image and tempered it and is running a model on a phone. And you can see that the prediction here is a library. But when you look at the other one, it's a prison. And we know that libraries are not prison. And here's another example we can look at with the washing machine."},{"start":1223.9,"text":"Again, this is a real device with the model, the computer vision model running on it. The prediction is a washer here. And then if you move it to the other picture, it is a doormat. Got it. Here's another interesting one. Same methods, adversarial patch. You might have seen it in the news more recently. Here's a group of students and researchers that come up with a patch."},{"start":1251.73,"text":"And when you wear the patch, the model essentially doesn't see you. Quite interesting. So this one is actually a slightly more complex problem because in the past, we've actually seen patches that might, you might have seen that in the news where someone sticks a patch on a stop sign."},{"start":1275.19,"text":"And then the car doesn't see it as a stop sign anymore, which is, again, very dangerous. But stop signs are all the same. There's no intraclass variability. People, there's a lot more intraclass variability. And so having a patch that can essentially work across all intraclass variabilities was quite novel when they came up with it."},{"start":1300.37,"text":"And the way they do it is also quite interesting. Again, now you have the baggage, the technical baggage to understand how they did it. They optimized the patch by looking at certain outputs and they modified the pixels of the patch and then they printed the patch, essentially. Does that make sense? One of the interesting things I liked about this paper was they were quite creative with their loss function. If you look at the paper, the loss function has three components to it. And one of the components is..."},{"start":1329.87,"text":"that the colors have to belong to the set of printable colors so that their printers can actually print it. Because otherwise you end up with something that is really hard to print and you cannot print your patch. A second term of their loss function was to smooth out the colors in the patch so that the patch looks like something that could be printed more easily. Imagine every pixel being different and trying to print that much harder. So that's an example of a group of researchers that has crafted a loss function for the purpose of what they were trying."}],"speech_gaps":[],"frame":"../frames/v058/008.webp","frame_time":1204.34},{"title":"对抗鲁棒性与生成模型中的攻击方法","segments":[{"id":59,"text":"to do. Yes. That's a great question, actually. So the question is...","zh":"to do. Yes. 那是一个非常好的问题，实际上。所以问题是...","start":1359.18,"end":1379.61},{"id":60,"text":"This paper was targeting specifically YOLOv2, which is one of the models that you're going to build in this class in a couple of weeks. Does it work on another model, essentially? Or, you know, how do we think about that? So, of course, if this pipeline has been optimized on YOLOv2, it's going to work better on YOLOv2. But it turns out that a lot of models follow the same salient features.","zh":"这篇论文专门针对YOLOv2，这是你们将在几周后在这个课程中构建的模型之一。它是否适用于其他模型呢？或者说，我们该如何思考这个问题？当然，如果这个流程是在YOLOv2上优化的，它在YOLOv2上会表现得更好。但事实上，很多模型都遵循相同的显著特征。","start":1380.6,"end":1406.51},{"id":61,"text":"When actually, if you build a patch on a specific family of models, it is likely that it will work on another one if that model doesn't have the defenses to detect that patch. And it's actually a type of attack that you would call a black box attack. Like, let's say there's a model you're targeting somewhere. You don't have access to that model. And in fact, sometimes you would say, I can ping this model. So I can ping it enough.","zh":"实际上，如果你在一个特定模型家族上构建一个补丁，它很可能在另一个模型上也有效，只要该模型没有检测该补丁的防御机制。实际上，这是一种你称之为黑盒攻击的攻击类型。例如，假设有一个你想要攻击的模型，你没有访问该模型的权限。事实上，有时你会说，我可以向该模型发送请求。所以我可以发送足够的请求，","start":1407.26,"end":1431.5},{"id":62,"text":"so that I can understand the gradients and I can optimize my image. But one of the protections that the model can put together is the amount of things you can make per minute, three max, and then you can't do it as well as you could. So what does the attacker do? They train a model on a very similar task. They create a patch or a Forge example, and then they send that Forge example, and sometimes it works. Okay.","zh":"以便我能够理解梯度并优化我的图像。但模型可以采取的一种保护措施是每分钟最多只能进行三次操作，然后你就无法像以前那样有效地进行操作。那么攻击者会怎么做呢？他们在一个非常相似的任务上训练一个模型。他们创建一个补丁或一个伪造示例，然后发送这个伪造示例，有时它会起作用。Okay.","start":1432.57,"end":1457.18},{"id":63,"text":"So let's move to a big question that I think would sort of give you the intuition of why these attacks are very dangerous and happening for neural networks. So actually, I'm going to ask you the question. Intuitively, why do you think that neural networks are sensitive to forged images? Because we humans aren't sensitive to that. We can tell.","zh":"那么，让我们转向一个大问题，我认为这个问题能帮助你们理解为什么这些攻击对神经网络来说非常危险且频繁发生。实际上，我会问你们一个问题。直觉上，你们认为为什么神经网络会对伪造图像敏感？因为我们人类并不敏感。我们能够分辨出来。","start":1458.09,"end":1486.95},{"id":64,"text":"Hey, this was a cat. It was not an iguana. So what makes the model sensitive? So one, does the model actually understand what the, let's say, semantic concept of a cat is? Probably not, or at least not as well as us. No, that's true. I see. So you're saying we are multisensorial as a species. We get a lot more insights than just pixels.","zh":"嘿，这是一只猫，而不是鬣蜥。那么是什么让模型敏感呢？首先，模型是否真正理解了，比如说，猫的语义概念？可能不是，或者至少不如我们理解得那么好。没错，我明白了。你是在说我们作为物种是多感官的。我们获得的洞察力远不止像素。","start":1488.05,"end":1533.2}],"notes":["本段讨论了对抗攻击在不同模型间的泛化能力，特别是针对YOLOv2模型的攻击方法。讲者指出，如果攻击方法是在特定模型上优化的，那么它在该模型上表现更好，但许多模型具有相似的显著特征，因此攻击可能在其他模型上也有效。这种攻击被称为黑盒攻击，攻击者无法直接访问目标模型，但可以通过发送伪造示例来影响模型。","讲者进一步解释了攻击者如何通过训练一个与目标任务相似的模型来生成伪造示例，并将其发送给目标模型。有时这些伪造示例能够成功欺骗模型。这表明，攻击者可以利用模型对伪造输入的敏感性，即使模型没有专门的防御机制。","讲者提出了一个关键问题：为什么神经网络对伪造图像如此敏感？讲者指出，人类并不对伪造图像敏感，因为我们能够识别图像内容。这暗示了神经网络可能缺乏对图像语义概念的深入理解。","讲者进一步指出，人类是多感官的，能够从多个来源获取信息，而不仅仅是像素。这表明，神经网络可能在处理图像时过于依赖像素级别的特征，而忽略了更高级的语义信息。","讲者通过一个例子说明了模型对伪造图像的敏感性：一张图像被识别为猫而不是鬣蜥，这表明模型可能没有正确理解图像的语义概念。","讲者强调了神经网络在处理图像时的局限性，即它们可能无法像人类一样理解图像的语义概念，从而容易受到伪造图像的攻击。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1359.18,"end":1533.2,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1359.18,"text":"to do. Yes. That's a great question, actually. So the question is..."},{"start":1380.6,"text":"This paper was targeting specifically YOLOv2, which is one of the models that you're going to build in this class in a couple of weeks. Does it work on another model, essentially? Or, you know, how do we think about that? So, of course, if this pipeline has been optimized on YOLOv2, it's going to work better on YOLOv2. But it turns out that a lot of models follow the same salient features."},{"start":1407.26,"text":"When actually, if you build a patch on a specific family of models, it is likely that it will work on another one if that model doesn't have the defenses to detect that patch. And it's actually a type of attack that you would call a black box attack. Like, let's say there's a model you're targeting somewhere. You don't have access to that model. And in fact, sometimes you would say, I can ping this model. So I can ping it enough."},{"start":1432.57,"text":"so that I can understand the gradients and I can optimize my image. But one of the protections that the model can put together is the amount of things you can make per minute, three max, and then you can't do it as well as you could. So what does the attacker do? They train a model on a very similar task. They create a patch or a Forge example, and then they send that Forge example, and sometimes it works. Okay."},{"start":1458.09,"text":"So let's move to a big question that I think would sort of give you the intuition of why these attacks are very dangerous and happening for neural networks. So actually, I'm going to ask you the question. Intuitively, why do you think that neural networks are sensitive to forged images? Because we humans aren't sensitive to that. We can tell."},{"start":1488.05,"text":"Hey, this was a cat. It was not an iguana. So what makes the model sensitive? So one, does the model actually understand what the, let's say, semantic concept of a cat is? Probably not, or at least not as well as us. No, that's true. I see. So you're saying we are multisensorial as a species. We get a lot more insights than just pixels."}],"speech_gaps":[],"frame":"../frames/v058/009.webp","frame_time":1371.18},{"title":"对抗鲁棒性与神经网络的敏感性","segments":[{"id":65,"text":"which allow us to tell, you know, this cat doesn't sound like a cat, let's say. So yeah, the model doesn't have it. Although more and more models are multimodal now, but I get what you're saying. But when it comes to the actual neural networks, what makes a neural network specifically sensitive to this type of attack compared to maybe other types of algorithms? So it's a difficult question, but we're going to look at it together. Yeah, you want to try?","zh":"这允许我们判断，比如说，这只猫听起来不像猫。所以是的，模型中没有这种特征。尽管现在越来越多的模型是多模态的，但我明白你的意思。但说到实际的神经网络，是什么让神经网络特别容易受到这种攻击，而不是其他类型的算法呢？这是一个困难的问题，但我们一起来看看。是的，你想试试吗？","start":1533.93,"end":1563.35},{"id":66,"text":"Overfeeding. Yeah, it's a little bit of that. Yeah. Neural network is prone to overfeeding, but there's actually a different reason behind it. So are you saying like our loss function, let's say the L2 loss or the binary cross entropy on an image task is essentially sensitive to every single pixel rather than a group of pixels?","zh":"过拟合。是的，有点像这样。神经网络容易过拟合，但其实背后有完全不同的原因。你是说我们的损失函数，比如说图像任务中的L2损失或二元交叉熵，本质上对每一个像素都敏感，而不是一组像素吗？","start":1565.36,"end":1599.8},{"id":67,"text":"And so it might be sensitive to variation in a single pixel. That's correct. Although with convolutional networks, the pirating changes because you have a scanning window. So that might not be the case for those. So it's actually a little counterintuitive. Do you want to try?","zh":"因此，它可能对单个像素的变化敏感。这是正确的。不过在卷积网络中，这种变化会因为有扫描窗口而有所不同。因此，对于这些网络来说可能不是这种情况。实际上，这有点违反直觉。你想试试吗？","start":1600.71,"end":1615.33},{"id":68,"text":"Okay, so you're saying we're optimizing on a probability or a likelihood. And so there is no concept of semantics. And so, you know, you could probably widely shift the probability output based on certain tweaks on the inputs, essentially. Yeah, I mean, all of that are good ideas. So initially, researchers probably thought that the fact that neural networks are sensitive to adversarial attacks is because of their non-linearity.","zh":"好的，你是说我们在概率或似然上进行优化。因此，没有语义的概念。因此，你可能通过在输入上进行一些微调，就能广泛地改变概率输出。是的，我的意思是，这些都是很好的想法。最初，研究人员可能认为神经网络对对抗攻击敏感是因为它们的非线性。","start":1636.26,"end":1665.08},{"id":69,"text":"They're highly nonlinear, so small tweaks to the inputs might lead to highly nonlinear exponential changes in the output.","zh":"它们高度非线性，因此输入的小改动可能导致输出高度非线性指数级的变化。","start":1665.93,"end":1675.33},{"id":70,"text":"That was not correct. In fact, even if a neural network uses ReLU activations or other nonlinear activations, in practice, when you look at it from input to logits, it actually looks very linear. And you've seen in the lectures online about the vanishing gradient and us trying to be as close as possible to the identity to maximize those gradients. So in fact, a neural network is highly linear, actually.","zh":"这并不正确。事实上，即使神经网络使用ReLU激活或其他非线性激活，在实践中，当你从输入到logits进行观察时，它实际上看起来非常线性。你在在线课程中也看到过关于梯度消失的内容，以及我们试图尽可能接近恒等映射以最大化这些梯度。因此，实际上，神经网络是非常线性的。","start":1676.74,"end":1701.64},{"id":71,"text":"The reason is actually the dimensionality of the problem. We're going to look at it and explain why when you deal with high dimensional problems, the sensitivity of an algorithm like neural networks is...","zh":"原因实际上与问题的维度有关。我们将对此进行分析，并解释为什么在处理高维问题时，像神经网络这样的算法的敏感性会...","start":1702.67,"end":1713.73}],"notes":["本段讨论了神经网络对对抗攻击敏感的原因，指出虽然神经网络具有非线性特性，但实际中从输入到logits的映射在高维问题中表现出高度线性。这与梯度消失问题和试图接近恒等映射以最大化梯度有关。","讲者提到，即使使用ReLU等非线性激活函数，神经网络在高维空间中仍表现出线性行为，这与对抗攻击的敏感性有关。","对抗攻击的敏感性可能与神经网络的高维特性有关，而非仅仅是其非线性。讲者指出，高维问题中，算法对输入的微小变化可能表现出高度敏感。","讲者提到，对抗攻击的敏感性可能与损失函数的设计有关，例如L2损失或二元交叉熵损失对每个像素的敏感性。","讲者指出，卷积网络由于扫描窗口的存在，可能不会表现出与全连接网络相同的敏感性，这与网络结构有关。","讲者强调，对抗攻击的敏感性并非完全由非线性引起，而是与高维空间中的线性行为和输入扰动的传播有关。"],"formulas":[],"uncertainties":["pirating"],"diagram":"none","start":1533.93,"end":1713.73,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1533.93,"text":"which allow us to tell, you know, this cat doesn't sound like a cat, let's say. So yeah, the model doesn't have it. Although more and more models are multimodal now, but I get what you're saying. But when it comes to the actual neural networks, what makes a neural network specifically sensitive to this type of attack compared to maybe other types of algorithms? So it's a difficult question, but we're going to look at it together. Yeah, you want to try?"},{"start":1565.36,"text":"Overfeeding. Yeah, it's a little bit of that. Yeah. Neural network is prone to overfeeding, but there's actually a different reason behind it. So are you saying like our loss function, let's say the L2 loss or the binary cross entropy on an image task is essentially sensitive to every single pixel rather than a group of pixels?"},{"start":1600.71,"text":"And so it might be sensitive to variation in a single pixel. That's correct. Although with convolutional networks, the pirating changes because you have a scanning window. So that might not be the case for those. So it's actually a little counterintuitive. Do you want to try?"},{"start":1636.26,"text":"Okay, so you're saying we're optimizing on a probability or a likelihood. And so there is no concept of semantics. And so, you know, you could probably widely shift the probability output based on certain tweaks on the inputs, essentially. Yeah, I mean, all of that are good ideas. So initially, researchers probably thought that the fact that neural networks are sensitive to adversarial attacks is because of their non-linearity."},{"start":1665.93,"text":"They're highly nonlinear, so small tweaks to the inputs might lead to highly nonlinear exponential changes in the output."},{"start":1676.74,"text":"That was not correct. In fact, even if a neural network uses ReLU activations or other nonlinear activations, in practice, when you look at it from input to logits, it actually looks very linear. And you've seen in the lectures online about the vanishing gradient and us trying to be as close as possible to the identity to maximize those gradients. So in fact, a neural network is highly linear, actually."},{"start":1702.67,"text":"The reason is actually the dimensionality of the problem. We're going to look at it and explain why when you deal with high dimensional problems, the sensitivity of an algorithm like neural networks is..."}],"speech_gaps":[],"frame":"../frames/v058/010.webp","frame_time":1545.93},{"title":"对抗鲁棒性与生成模型中的输入扰动","segments":[{"id":72,"text":"vastly higher to perturbations of the input. Let's take this logistic regression example. So singular neuron, sigmoid activation, you take X1 through X1, you send it through the activation, you get Y hat. Let's say we trained it on a task and we got a set of weights and biases. So for the sake of simplicity, let's say at the end of training with the bias is zero and the weight is the vector that I'm presenting here. One, three, minus one, two, two, three, transpose.","zh":"对输入的扰动要高得多。让我们以这个逻辑回归的例子来说明。一个奇异神经元，使用sigmoid激活函数，你输入X1到X1，经过激活函数后得到Y帽。假设我们在这个任务上训练了模型，并得到了一组权重和偏置。为了简化，假设训练结束时偏置为零，权重是这里展示的向量：1，3，-1，2，2，3的转置。","start":1715.43,"end":1742.95},{"id":73,"text":"If you take X, an input equal to this, and you send it through W transpose X plus B, then you apply sigmoid, you will end up with 0.018. Good check. Which means that the model will classify that as zero, negative. Now, it turns out that if you modify, can you modify slightly X such that it affects Y hat drastically? Let's try an example.","zh":"如果你输入X等于这个值，并通过W转置乘以X加上B，然后应用sigmoid函数，你会得到0.018。这是一个好的检查。这意味着模型会将该输入分类为0，负类。事实上，如果你稍微修改X，是否可以使其对Y帽产生巨大影响？让我们尝试一个例子。","start":1744.86,"end":1772.29},{"id":74,"text":"we add epsilon, a small number, times the weight vector to x. So x star, our new forged example, is x plus epsilon w. You can do the calculation with epsilon, let's say, a small number like 0.2. You will see that y hat of x star is going to be 83, 0.83, which completely shifted the prediction to 1.","zh":"我们添加一个很小的数epsilon乘以权重向量到x。我们的新伪造输入x星等于x加上epsilon乘以w。你可以用epsilon，比如一个小数0.2，进行计算。你会发现x星对应的y帽会变成0.83，这完全改变了预测结果为1。","start":1772.94,"end":1800.94},{"id":75,"text":"If you break it down, actually, you will see that sigmoid of W transpose X star plus zero, because our bias was zero for simplicity, is equals to W transpose X plus epsilon times W transpose W, which is the square of W. So now intuitively, you start understanding why that specific forged example, which was adding epsilon plus W, was so powerful.","zh":"分解来看，实际上你会看到sigmoid函数的输入是W转置乘以x星加上零，因为我们为了简化假设偏置为零，等于W转置乘以x加上epsilon乘以W转置乘以W，也就是W的平方。现在，直观上你开始理解为什么这个特定的伪造输入，即添加epsilon乘以W，如此强大。","start":1802.73,"end":1830.67},{"id":76,"text":"It was because it created that second term, epsilon W squared, which essentially pushes everything in the right direction. So every small perturbation adds up to the sigmoid getting higher and higher, closer to one. So this is a great attack. You just perturb very small, but you led to an exponential impact on the output. Does that make sense?","zh":"这是因为其创建了第二项，epsilon乘以W的平方，这实际上将所有内容推向正确方向。因此，每一个微小的扰动都会使sigmoid函数的输出越来越高，越来越接近1。这是一个很棒的攻击方式。你只需对输入进行非常微小的扰动，却会导致输出的指数级影响。这清楚吗？","start":1831.57,"end":1859.75},{"id":77,"text":"This is a relatively small dimensional problem. Now, when you deal with images, your dimensions are much higher. So if you're smart about your attack, meaning every single pixel, you nail it, you push it in the right direction, someone might not notice, but actually this perturbation compounds and leads to an incredible impact on Y-hat. Okay?","zh":"这是一个相对低维的问题。当你处理图像时，维度会高得多。因此，如果你聪明地进行攻击，即对每一个像素都进行精确调整，将其推向正确方向，别人可能不会察觉，但实际上这种扰动会累积，并对Y帽产生巨大的影响。明白吗？","start":1861.83,"end":1886.89}],"notes":["本段讲解了对抗样本的生成过程，通过一个逻辑回归的例子说明输入扰动如何导致输出的剧烈变化。讲者首先介绍了模型的结构，包括单个神经元、sigmoid激活函数以及输入和输出的计算方式。","接着，讲者通过一个具体的例子，展示了如何通过添加一个微小的扰动（epsilon乘以权重向量）来改变输入，从而显著影响模型的输出。计算结果显示，扰动后的输出从0.018变为0.83，这表明模型的预测结果发生了根本性的变化。","讲者进一步解释了扰动如何通过sigmoid函数的数学特性产生指数级的影响。具体来说，扰动项（epsilon乘以权重的平方）使得sigmoid函数的输出迅速接近1，从而改变了模型的预测结果。","最后，讲者将这一现象扩展到高维数据（如图像），指出在高维空间中，每个像素的微小扰动可能累积起来产生巨大的影响，从而导致模型的预测结果发生显著变化。","整个讲解强调了对抗样本的生成机制，即通过精心设计的微小扰动，可以显著改变模型的输出，这揭示了模型在对抗鲁棒性方面的脆弱性。","讲者还提到，这种攻击方式在实际应用中可能难以察觉，因为扰动非常微小，但其对模型输出的影响却非常显著，这进一步说明了对抗样本的潜在危害。"],"formulas":[{"latex":"x^* = x + \\epsilon W","symbols":"x^* 表示扰动后的输入，x 表示原始输入，\\epsilon 表示扰动的大小，W 表示权重向量","explanation":"公式正确，表示扰动后的输入x^*等于原始输入x加上扰动大小\\epsilon乘以权重向量W。","evidence":"we add epsilon, a small number, times the weight vector to x. So x star, our new forged example, is x plus epsilon w. You can do the calculation with epsilon, let's say, a small number like 0.2. You will see that y hat of x star is going to be 83, 0.83, which completely shifted the prediction to 1."}],"uncertainties":[],"diagram":"none","start":1715.43,"end":1886.89,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均正确，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1715.43,"text":"vastly higher to perturbations of the input. Let's take this logistic regression example. So singular neuron, sigmoid activation, you take X1 through X1, you send it through the activation, you get Y hat. Let's say we trained it on a task and we got a set of weights and biases. So for the sake of simplicity, let's say at the end of training with the bias is zero and the weight is the vector that I'm presenting here. One, three, minus one, two, two, three, transpose."},{"start":1744.86,"text":"If you take X, an input equal to this, and you send it through W transpose X plus B, then you apply sigmoid, you will end up with 0.018. Good check. Which means that the model will classify that as zero, negative. Now, it turns out that if you modify, can you modify slightly X such that it affects Y hat drastically? Let's try an example."},{"start":1772.94,"text":"we add epsilon, a small number, times the weight vector to x. So x star, our new forged example, is x plus epsilon w. You can do the calculation with epsilon, let's say, a small number like 0.2. You will see that y hat of x star is going to be 83, 0.83, which completely shifted the prediction to 1."},{"start":1802.73,"text":"If you break it down, actually, you will see that sigmoid of W transpose X star plus zero, because our bias was zero for simplicity, is equals to W transpose X plus epsilon times W transpose W, which is the square of W. So now intuitively, you start understanding why that specific forged example, which was adding epsilon plus W, was so powerful."},{"start":1831.57,"text":"It was because it created that second term, epsilon W squared, which essentially pushes everything in the right direction. So every small perturbation adds up to the sigmoid getting higher and higher, closer to one. So this is a great attack. You just perturb very small, but you led to an exponential impact on the output. Does that make sense?"},{"start":1861.83,"text":"This is a relatively small dimensional problem. Now, when you deal with images, your dimensions are much higher. So if you're smart about your attack, meaning every single pixel, you nail it, you push it in the right direction, someone might not notice, but actually this perturbation compounds and leads to an incredible impact on Y-hat. Okay?"}],"speech_gaps":[],"frame":"../frames/v058/011.webp","frame_time":1727.43},{"title":"对抗攻击与生成模型","segments":[{"id":78,"text":"So, you know, the reality is because images are so highly dimensional, you can actually create a compounding attack that perturbates the model, the output. There is actually an easier way to do it than an optimization problem. And this is a method, Ian Goodfellow worked a lot on that, called fast gradient sign method, which is a one-shot forging of an adversarial attack.","zh":"所以，现实情况是，由于图像具有如此高的维度，你实际上可以创建一种累积攻击，扰动模型的输出。实际上，有一种比优化问题更容易实现的方法。这种方法由Ian Goodfellow进行了大量研究，称为快速梯度符号方法，这是一种一次性的对抗攻击伪造方法。","start":1888.66,"end":1918.02},{"id":79,"text":"You take an input X and you add to it a small number, epsilon, times the sign of the gradient of the cost function with respect to the input pixels. That's a one-shot attack. Which means with this formula, again, you don't know, you just want to push a little bit, but you know that if you push in the right direction, which is in the direction of the slope that impacts the cost, you lead to an attack, essentially.","zh":"你取一个输入X，并向其添加一个小数值epsilon乘以成本函数相对于输入像素的梯度的符号。这是一种一次性的攻击。这意味着，使用这个公式，你并不知道具体细节，你只是想稍微推动一点，但你知道，如果你朝着影响成本的斜率方向推动，就会导致攻击，基本上如此。","start":1918.98,"end":1945.44},{"id":80,"text":"You're not going to know exactly what type of attack, but you know because the epsilon is so small that X star will still look like X. It will just lead to a different output. It's called the fast gradient sign method. So does it make sense intuitively why these attacks exist? Every pixel. Yeah, every pixel. That's right. So X star is a matrix. It's like your picture. It's X.","zh":"你不会确切知道攻击的类型，但你知道因为epsilon非常小，X星仍然看起来像X。它只会导致不同的输出。这被称为快速梯度符号方法。那么，这些攻击存在的直觉意义是否合理？每个像素。是的，每个像素。没错。X星是一个矩阵，就像你的图片一样，它是X。","start":1946.06,"end":1977.2},{"id":81,"text":"But in every single situation, you computed the gradient of J, you looked at the sign, you put an epsilon in front of it, and you push the pixel a little to the right or to the left. And that becomes an attack. In practice, it's a widely researched field. So I'm not going to go through everything, but you see together, we saw a couple of these methods. And you can see this beautiful review paper from 2019 that walks you through some of the research that's happening in adversarial attacks.","zh":"但在每一种情况下，你计算了J的梯度，查看了符号，将epsilon放在前面，并将像素稍微向左或向右推动。这就会成为一次攻击。实际上，这是一个广泛研究的领域。我不会一一讲解，但你们可以看到，我们已经看到了一些这些方法。你们也可以看到这篇2019年的精彩综述论文，它引导你们了解对抗攻击领域的一些研究进展。","start":1977.77,"end":2007.59},{"id":82,"text":"Super. So two types of attacks that you would talk about differently depending on the knowledge of the attacker. For those of you who've done some crypto, it's similar lingual. White box attack where you have access to the model parameters and black box attack where you don't have access to the parameters of the model. Obviously, a white box attacker has a lot more techniques that it can use compared to a black box attack. What about the defenses? Can you all come up with defenses to the problem we've seen?","zh":"很好。根据攻击者知识的不同，你会以不同的方式讨论两种类型的攻击。对于那些做过一些密码学的人来说，这类似于语言上的区别。白盒攻击是指你有模型参数的访问权限，而黑盒攻击是指你没有模型参数的访问权限。显然，白盒攻击者可以使用比黑盒攻击更多的技术。关于防御，你们能想出针对我们所看到的问题的防御方法吗？","start":2013.18,"end":2042.85}],"notes":["本段讲解了对抗攻击的基本原理，特别是快速梯度符号法（FGSM）。该方法通过计算损失函数相对于输入像素的梯度，并在梯度方向上添加一个小扰动（epsilon），从而生成对抗样本。这种方法是一种单次攻击，即在一次计算中完成扰动，而无需优化过程。对抗样本在视觉上与原始输入相似，但会导致模型输出错误。","对抗攻击的直观理解是，每个像素都可能成为攻击的载体。通过在梯度方向上微调像素值，可以有效地误导模型。FGSM方法通过计算损失函数的梯度，并在梯度方向上添加扰动，从而生成对抗样本。这种方法在实践中被广泛研究，并且有大量相关文献。","对抗攻击可以分为白盒攻击和黑盒攻击。白盒攻击指的是攻击者可以访问模型参数，因此可以使用更多攻击技术；而黑盒攻击则无法访问模型参数，因此攻击方法相对有限。本段还提出了关于防御方法的问题，鼓励学生思考如何应对对抗攻击。","快速梯度符号法（FGSM）是一种简单且有效的对抗攻击方法，其核心思想是利用梯度信息来生成扰动。该方法通过计算损失函数的梯度，并在梯度方向上添加一个小扰动（epsilon），从而生成对抗样本。这种方法在实践中被广泛使用，并且有大量相关研究。","对抗攻击的生成依赖于模型对输入的敏感性。通过在梯度方向上微调输入，可以有效地误导模型。FGSM方法通过计算损失函数的梯度，并在梯度方向上添加扰动，从而生成对抗样本。这种方法在实践中被广泛研究，并且有大量相关文献。","对抗攻击的分类基于攻击者对模型的了解程度。白盒攻击允许攻击者访问模型参数，因此可以使用更多攻击技术；而黑盒攻击则无法访问模型参数，因此攻击方法相对有限。本段还提出了关于防御方法的问题，鼓励学生思考如何应对对抗攻击。"],"formulas":[],"uncertainties":["lingual"],"diagram":"none","start":1888.66,"end":2042.85,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型存在不准确之处。首先，\\nabla_J X 表示的是损失函数 J 关于输入 X 的梯度，但通常应写作 \\nabla_X J。其次，公式中未明确说明梯度是关于输入像素的，应补充说明。此外，公式中未明确说明 epsilon 是一个标量扰动，应补充说明。因此，该公式需要移除并进行修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1888.66,"text":"So, you know, the reality is because images are so highly dimensional, you can actually create a compounding attack that perturbates the model, the output. There is actually an easier way to do it than an optimization problem. And this is a method, Ian Goodfellow worked a lot on that, called fast gradient sign method, which is a one-shot forging of an adversarial attack."},{"start":1918.98,"text":"You take an input X and you add to it a small number, epsilon, times the sine of the gradient of the cost function with respect to the input pixels. That's a one-shot attack. Which means with this formula, again, you don't know, you just want to push a little bit, but you know that if you push in the right direction, which is in the direction of the slope that impacts the cost, you lead to an attack, essentially."},{"start":1946.06,"text":"You're not going to know exactly what type of attack, but you know because the epsilon is so small that X star will still look like X. It will just lead to a different output. It's called the fast gradient sign method. So does it make sense intuitively why these attacks exist? Every pixel. Yeah, every pixel. That's right. So X star is a matrix. It's like your picture. It's X."},{"start":1977.77,"text":"But in every single situation, you computed the gradient of J, you looked at the sign, you put an epsilon in front of it, and you push the pixel a little to the right or to the left. And that becomes an attack. In practice, it's a widely researched field. So I'm not going to go through everything, but you see together, we saw a couple of these methods. And you can see this beautiful review paper from 2019 that walks you through some of the research that's happening in adversarial attacks."},{"start":2013.18,"text":"Super. So two types of attacks that you would talk about differently depending on the knowledge of the attacker. For those of you who've done some crypto, it's similar lingual. White box attack where you have access to the model parameters and black box attack where you don't have access to the parameters of the model. Obviously, a white box attacker has a lot more techniques that it can use compared to a black box attack. What about the defenses? Can you all come up with defenses to the problem we've seen?"}],"speech_gaps":[],"frame":"../frames/v058/012.webp","frame_time":1900.66},{"title":"对抗鲁棒性与生成模型的防御方法","segments":[{"id":83,"text":"How would you defend your model? Okay. Data augmentation in the training data to probably give it some adversarial examples and train it to not be sensitive to it. Yeah. Good idea. What else? Other defenses that you've heard companies come up with? Nothing? No defenses? We're all going to... Yeah. Okay. So doing some input processing to make sure that we check the input for certain patterns before we accept it.","zh":"你怎么防御你的模型？好的。在训练数据中加入数据增强，可能包括一些对抗样本，从而训练模型使其对这些样本不敏感。是的。好主意。还有别的防御方法吗？你们公司有没有听说过其他防御方法？没有？没有防御方法？我们都会……是的。好的。所以进行一些输入处理，确保在接收输入之前检查其中的某些模式。","start":2048.74,"end":2094.27},{"id":84,"text":"Yeah, that's great. It's called input sanitization. It's a very important technique that a lot of the foundation model providers use. Right before the actual model, you put a safety check or a set of safety checks that, for example, check for pixels being tempered because actually pixels that are tempered are not so continuous. You might see a weird pixel in the middle with a weird value, for example. What else? Yeah, I see.","zh":"是的，这很好。这被称为输入净化。这是一种非常重要的技术，很多基础模型提供者都会使用。在实际模型之前，你放置一个安全检查或一组安全检查，例如检查像素是否被篡改，因为实际上被篡改的像素并不连续。你可能会看到中间某个像素有奇怪的值，例如。还有别的吗？是的，我明白了。","start":2094.75,"end":2134.89},{"id":85,"text":"On your first method, you say, are there certain algorithms that are less prone to have this sensitivity because of th
