<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 18</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">18 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 18 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v018.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v018","title":"18 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 18","course":"凸优化","pages":[{"title":"凸优化中的稀疏性约束与L1正则化","segments":[{"id":0,"text":"We'll finish up this last additional topic. It's not an additional topic. You've already seen a bunch of it, but I thought it'd be fun to go into a little bit more detail. And at the end of today's lecture, we'll talk about just summarizing the whole class and what do you do now, where to go from here. So, okay. So jumping back into this.","zh":"我们将结束这个最后的附加主题。这不是一个附加主题。你已经看过很多相关内容，但我认为深入探讨一下会很有趣。在今天课程的最后，我们将总结整个课程，并讨论你现在应该做什么，接下来该去哪里。好的，那么我们回到这个主题。","start":5.2,"end":26.16},{"id":1,"text":"So we're talking about, you know, cardinality constraint, but the cardinality could be applied, for example, to the, let's say, a first difference, in which case you would be doing piecewise constant fitting. And that's kind of obvious. I mean, you take a, you know, a first difference matrix here. So you take a first difference matrix D, and then if DX","zh":"我们正在谈论的是基数约束，但基数可以应用于例如一阶差分，此时你进行的是分段常数拟合。这有点显而易见。我的意思是，你取一个一阶差分矩阵D，然后如果DX","start":28.06,"end":48.26},{"id":2,"text":"has a small cardinality, it means you have a small number of jumps in x, right? And you could just do this for the second difference and things like that. If you do second difference, then you get a second difference matrix. And if this matrix multiplied by x is sparse or has cardinality less than k, then this is exactly when x is piecewise linear.","zh":"具有较小的基数，这意味着x中只有少量的跳跃点，对吧？你也可以对二阶差分做类似的事情。如果你进行二阶差分，那么你得到一个二阶差分矩阵。如果这个矩阵乘以x是稀疏的，或者基数小于k，那么这正是x为分段线性的情况。","start":49.02,"end":78.2},{"id":3,"text":"Or I guess that's the way people would normally say it. I might say piecewise affine with something like k kinks in the piecewise, those change of slope and stuff like that. So that would be it. So we can handle all these kinds of constraints in this convex cardinality framework.","zh":"或者我猜这就是人们通常会说的方式。我可能会说分段仿射，其中分段有类似k个拐点，这些拐点对应斜率的变化等。这就是它的意思。因此，我们可以在这个凸基数框架中处理所有这些类型的约束。","start":78.91,"end":102.41},{"id":4,"text":"It's wherever you see the cardinality, replace it with a multiple of the one norm. Or just add some L1 regularization to the objective. And then gamma here is a parameter that you use to achieve the desired sparsity.","zh":"在你看到基数的地方，可以将其替换为一个一范数的倍数。或者只是在目标函数中添加一些L1正则化。这里的gamma是一个参数，用于实现所需的稀疏性。","start":102.89,"end":122.73},{"id":5,"text":"So that's sort of the heuristic. You've seen this a lot. There are some other versions. You're going to see them. They're actually better. That's a weighted L1 norm. And this one, I've heard people call that an asymmetric L1 norm, but I hate that because it's not a norm if it's not symmetric. In other words, you actually would penalize...","zh":"这就是一种启发式方法。你已经见过很多次了。还有一些其他版本。你将会看到它们，实际上它们更好。这是一个加权L1范数。而这个，我听说人们称之为不对称L1范数，但我讨厌这个说法，因为它如果不是对称的，就不是范数。换句话说，你实际上会惩罚...","start":123.05,"end":145.39},{"id":6,"text":"So that's sort of the heuristic. You've seen this a lot. There are some other versions. You're going to see them. They're actually better. That's a weighted L1 norm. And this one, I've heard people call that an asymmetric L1 norm, but I hate that because it's not a norm if it's not symmetric. In other words, you actually would penalize...","zh":"所以这就是一种启发式方法。你以前见过很多次。还有一些其他版本。你将会看到它们。实际上它们更好。这是一个加权L1范数。而这个，我听说有人称之为不对称L1范数，但我讨厌这个说法，因为它如果不是对称的就不是范数。换句话说，你实际上会惩罚...","start":146.18,"end":173.14}],"notes":["本段讲解了稀疏性约束在凸优化中的应用，特别是通过差分矩阵来建模分段常数或分段线性函数。第一差分矩阵D的稀疏性意味着x的跳跃次数少，而第二差分矩阵则对应分段线性函数。这些约束可以通过凸框架处理。","讲者提到稀疏性约束的启发式方法，即将稀疏性替换为L1范数，通过引入正则化参数gamma来控制稀疏程度。这种方法在许多领域都有广泛应用。","讲者还提到加权L1范数和不对称L1范数的概念，指出不对称L1范数不是严格意义上的范数，因为它不对称，会以不同的斜率惩罚不同范围的值。","最后，讲者指出稀疏性约束问题通常被替换为一个凸问题，从而更容易求解。这种替换方法是凸优化中的常见技巧，用于处理原本难以求解的非凸问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":173.14,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.2,"text":"We'll finish up this last additional topic. It's not an additional topic. You've already seen a bunch of it, but I thought it'd be fun to go into a little bit more detail. And at the end of today's lecture, we'll talk about just summarizing the whole class and what do you do now, where to go from here. So, okay. So jumping back into this."},{"start":28.06,"text":"So we're talking about, you know, cardinality constraint, but the cardinality could be applied, for example, to the, let's say, a first difference, in which case you would be doing piecewise constant fitting. And that's kind of obvious. I mean, you take a, you know, a first difference matrix here. So you take a first difference matrix D, and then if DX"},{"start":49.02,"text":"has a small cardinality, it means you have a small number of jumps in x, right? And you could just do this for the second difference and things like that. If you do second difference, then you get a second difference matrix. And if this matrix multiplied by x is sparse or has cardinality less than k, then this is exactly when x is piecewise linear."},{"start":78.91,"text":"Or I guess that's the way people would normally say it. I might say piecewise affine with something like k kinks in the piecewise, those change of slope and stuff like that. So that would be it. So we can handle all these kinds of constraints in this convex cardinality framework. Okay, so now we get to the heuristic. You know it already. You've seen it. It's really dumb."},{"start":102.89,"text":"It's wherever you see the cardinality, replace it with a multiple of the one norm. Or just add some L1 regularization to the objective. And then gamma here is a parameter that you use to achieve the desired sparsity."},{"start":123.05,"text":"So that's sort of the heuristic. You've seen this a lot. There are some other versions. You're going to see them. They're actually better. That's a weighted L1 norm. And this one, I've heard people call that an asymmetric L1 norm, but I hate that because it's not a norm if it's not symmetric. In other words, you actually would penalize..."},{"start":146.18,"text":"things being small or less than zero, bigger than zero, with different slopes. By the way, we're going to see later exactly why you might do that. But generally speaking, it's just the L1 norm heuristic. And it's used in a lot of fields. So here's the minimum cardinality problem, and you start with this problem that's hard, and you replace it with this one, which is convex, and so it's easy to solve."}],"speech_gaps":[],"frame":"../frames/v018/001.webp","frame_time":17.2},{"title":"稀疏性约束与模型精调","segments":[{"id":7,"text":"Now, of course, that's just a heuristic. When you solve this problem, you have not solved that problem. This is merely a heuristic, a quite good one, in fact, for solving the top problem. Okay. If you had...","zh":"当然，这只是个启发式方法。当你解决这个问题时，你并没有解决那个问题。这仅仅是一个启发式方法，实际上是一个相当好的方法，用于解决上面的问题。好的。如果你有……","start":173.53,"end":190.19},{"id":8,"text":"cardinality constraint problem. Lots of ways to do that. One way is to literally just replace this with an L1 norm and you have something that looks like this. Or you can make it an L1 regularization. You can actually add this regularization term to the objective. And then you adjust beta and gamma until the cardinality is what you want. These are sort of the most basic ways that people might do this. Something called","zh":"卡方约束问题。有很多方法可以做到这一点。一种方法是直接将这个替换为L1范数，这样你就会得到一个看起来像这样的结果。或者你可以将其作为L1正则化。你实际上可以将这个正则化项添加到目标函数中。然后你调整β和γ，直到卡方达到你想要的值。这些是人们可能采用的最基本的方法。有一种叫做","start":190.52,"end":219.04},{"id":9,"text":"Polishing is actually super interesting. That's this. What you do is you use an L1 heuristic to guess merely the sparsity pattern of X, if X is the thing.","zh":"精调实际上非常有趣。这就是。你所做的就是使用L1启发式方法来猜测X的稀疏模式，如果X是你要处理的对象的话。","start":219.47,"end":233.75},{"id":10,"text":"You want sparse, right? So you run an L1 heuristic, adjust gamma until you think there's supposed to be 15 non-zeros or you feel like that's right for you. Then you get 15 non-zeros. What you simply do is you record the locations or the indexes of the non-zero entries. So this is phase one. Then you go back and you resolve the problem with only those as the variables. All the others are now zero.","zh":"你想要稀疏，对吧？所以你运行一个L1启发式方法，调整γ直到你觉得应该有15个非零元素，或者你觉得这对你来说是合适的。然后你得到15个非零元素。你所做的就是记录这些非零元素的位置或索引。这就是第一阶段。然后你回到问题中，只将这些作为变量。其他所有变量现在都是零。","start":234.25,"end":262.07},{"id":11,"text":"Right, and you remove any regularization if you had that right so that that's called polishing right so this would be very Very commonly done right actually it's interesting. So there is you guys two different people who do statistics is this a good idea when you're doing model fitting and","zh":"对，如果你之前有正则化，你现在应该去掉它，这样就叫做精调。所以这非常非常常见，实际上它很有趣。所以你们两个人在做统计学时，这样做是不是个好主意？","start":262.72,"end":280.86},{"id":12,"text":"Most of my friends will say, no, no, no, you should never do this in statistics, right? Because the whole point was not only did you do feature selection, but you shrunk also the coefficients, right? And then other people I know, they would say, no, we always do this. So I'm not quite sure. I mean, I think it depends on the application. So an example of where this is always done is when people have gene response data.","zh":"我大多数朋友都会说，不，不，不，你在统计学中永远不应该这样做，对吧？因为整个目的不仅仅是进行了特征选择，你还对系数进行了收缩，对吧？而我知道的其他人则会说，不，我们总是这样做。所以我不是很确定。我的意思是，我认为这取决于应用场景。一个总是这样做例子是当人们有基因响应数据时。","start":282.11,"end":309.29},{"id":13,"text":"So you have 20,000 gene expression features, and you're trying to predict something. So first step is you do L1 regularized logistic regression. You find the 22 genes that you believe will give you a good logistic model. Again, if you know what I'm talking about, that's fine. If you don't, that's also probably okay. So you get these 22. You locate those 22. Then you go back and you just fit a logistic regression model with just those 22 genes. Everybody got that? Yeah.","zh":"所以你有20,000个基因表达特征，你试图预测某个结果。第一步是你进行带有L1正则化的逻辑回归。你找到你认为能给你一个良好逻辑模型的22个基因。如果你明白我在说什么，那很好。如果你不明白，那可能也没关系。你得到了这22个基因，你找到了它们。然后你回去，只用这22个基因拟合一个逻辑回归模型。大家明白了吗？是的。","start":309.77,"end":336.56}],"notes":["本段讨论了在稀疏性约束问题中使用L1正则化的方法，以及后续的精调（polishing）过程。首先，通过L1正则化找到稀疏模式，然后通过调整参数得到所需的稀疏度。接着，通过记录非零项的位置，将问题重新建模为仅包含这些变量的子问题，从而进行更精确的拟合。","在精调过程中，通常会移除正则化项，以确保模型的系数能够更准确地拟合数据。然而，这种方法在统计学中存在争议，因为一些统计学家认为这会破坏特征选择和系数收缩的双重目标。","在基因表达数据分析中，这种方法被广泛使用。例如，当有20,000个基因表达特征时，首先使用L1正则化的逻辑回归找到22个关键基因，然后仅使用这些基因进行更精确的模型拟合。","这种精调方法的适用性取决于具体的应用场景。在某些情况下，如基因数据分析，这种方法被证明是有效的，而在其他情况下，可能需要权衡特征选择和系数收缩之间的关系。","在精调过程中，需要确保模型的稀疏性与实际数据的结构相匹配，同时避免因过度简化而导致模型性能下降。","本段还提到，不同统计学家对这种方法的看法存在分歧，这表明在实际应用中需要根据具体问题进行判断和调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":173.53,"end":336.56,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":173.53,"text":"Now, of course, that's just a heuristic. When you solve this problem, you have not solved that problem. This is merely a heuristic, a quite good one, in fact, for solving the top problem. Okay. If you had..."},{"start":190.52,"text":"cardinality constraint problem. Lots of ways to do that. One way is to literally just replace this with an L1 norm and you have something that looks like this. Or you can make it an L1 regularization. You can actually add this regularization term to the objective. And then you adjust beta and gamma until the cardinality is what you want. These are sort of the most basic ways that people might do this. Something called"},{"start":219.47,"text":"Polishing is actually super interesting. That's this. What you do is you use an L1 heuristic to guess merely the sparsity pattern of X, if X is the thing."},{"start":234.25,"text":"You want sparse, right? So you run an L1 heuristic, adjust gamma until you think there's supposed to be 15 non-zeros or you feel like that's right for you. Then you get 15 non-zeros. What you simply do is you record the locations or the indexes of the non-zero entries. So this is phase one. Then you go back and you resolve the problem with only those as the variables. All the others are now zero."},{"start":262.72,"text":"Right, and you remove any regularization if you had that right so that that's called polishing right so this would be very Very commonly done right actually it's interesting. So there is you guys two different people who do statistics is this a good idea when you're doing model fitting and"},{"start":282.11,"text":"Most of my friends will say, no, no, no, you should never do this in statistics, right? Because the whole point was not only did you do feature selection, but you shrunk also the coefficients, right? And then other people I know, they would say, no, we always do this. So I'm not quite sure. I mean, I think it depends on the application. So an example of where this is always done is when people have gene response data."},{"start":309.77,"text":"So you have 20,000 gene expression features, and you're trying to predict something. So first step is you do L1 regularized logistic regression. You find the 22 genes that you believe will give you a good logistic model. Again, if you know what I'm talking about, that's fine. If you don't, that's also probably okay. So you get these 22. You locate those 22. Then you go back and you just fit a logistic regression model with just those 22 genes. Everybody got that? Yeah."}],"speech_gaps":[],"frame":"../frames/v018/002.webp","frame_time":185.53},{"title":"凸优化中的稀疏性与初始化无关性","segments":[{"id":14,"text":"Is the sparsity pattern dependent on the initialization? Would you get a different sparsity pattern? Absolutely not. No, no, no. So there's no such thing as initialization, number one. And number two, if it turns out when you solve that problem, there's not a unique solution, which is entirely possible, then it's possible that you could have different solutions, but they'll all have the same...","zh":"稀疏模式是否依赖于初始化？你会得到不同的稀疏模式吗？绝对不会。不，不，不。所以，第一点，不存在所谓的初始化。第二点，如果在求解该问题时，发现没有唯一的解，这完全有可能，那么你可能会有不同解，但它们都会具有相同的……","start":337.23,"end":362.18},{"id":15,"text":"optimal value, right? But no, that's not an issue, right? If that's an issue, we're in deep, deep trouble, right? Because the general story for convex optimization goes like this. I've done this. I've gone off and give talks about something, and I'll say, that's a convex problem. And they'll just say, we can solve it. And then people will say, how'd you solve it? Did you use like, you know, conjugate gradient? Do you use this? I'd actually literally just say, it's none of your business.","zh":"最优值，对吧？但不，这不是一个问题，对吧？如果这是个问题，那我们陷入深深的麻烦了，对吧？因为凸优化的一般情况是这样的。我做过这件事。我曾做过一些演讲，我会说，这是一个凸问题。他们就会说，我们可以解决它。然后人们会问，你是怎么解决的？你用了共轭梯度法吗？你用了什么方法？我实际上会直接说，这不关你的事。","start":362.51,"end":391.13},{"id":16,"text":"Very good at irritating people, right? And then finally they'd say, but you must have used a method. I said, oh, I used a method. I did. You're right. I did. But I'm not saying what it is because it's not relevant. This is a convex problem, right? So what that means is basically, I told them finally, I can think of 50 methods, all of which would work. All of them. So how on, why would, it's like if somebody does least squares and you go, how'd you do it? How'd you do it? Do you use quantum factorization, SVD?","zh":"这很擅长惹恼人，对吧？最后他们会说，但你肯定用了某种方法。我说，哦，我用了某种方法。我确实用了。你说得对。我确实用了。但我没说具体是什么，因为这不相关。这是一个凸问题，对吧？这意味着基本上，我最后告诉他们，我可以想到50种方法，所有方法都能奏效。所有方法都能奏效。所以，为什么？就像有人做最小二乘法，你问他是怎么做的？你怎么做的？你用了量子分解，SVD吗？","start":392.98,"end":418.7},{"id":17,"text":"conjugate gradients, LSQR. And the answer is like, unless the problem is ginormous and you're under extreme real-time constraints or something like that, it's no one's business. They would always get the same answer. So that's why, and certainly it has nothing to do with the initial condition. So that's just my reaction to that. Okay.","zh":"共轭梯度法，LSQR。答案是，除非问题非常巨大，而且你面临极端的实时约束，否则这不关你的事。他们总是会得到同样的答案。这就是为什么，而且显然这与初始条件无关。这就是我的反应。好的。","start":419.24,"end":436.2},{"id":18,"text":"Okay, so this is polishing. I mean, it's interesting, and it depends on the application, right? So whether or not you should do polishing. I think in a lot of statistical fitting methods, you should not, because the entire point was to regularize, right? Well, it was two things. It was to do...","zh":"好的，所以这就是微调。我的意思是，这很有趣，而且取决于应用，对吧？所以，你是否应该进行微调。我认为在很多统计拟合方法中，你不应该进行微调，因为整个目的就是正则化，对吧？好吧，这是两件事。它是为了……","start":437.74,"end":455.14},{"id":19,"text":"feature selection, and to regularize. So you shouldn't do this. Many other things, like if you're doing electronic design or mechanical engineering or something, and you want a sparse thing because you don't intend to build a space frame with a million bars, but in fact only 236, then you do do this. Because, you know, once you know which ones are actual bars, then you go back and solve the problem. So, okay. That make sense?","zh":"特征选择，并进行正则化。因此你不应该这样做。还有许多其他情况，比如你在进行电子设计或机械工程等，想要一个稀疏的结果，因为你并不打算建造一个包含一百万根杆子的空间框架，而实际上只需要236根，这时你就会这样做。因为一旦你知道哪些是实际的杆子，你就会回去解决问题。所以，这样对吗？","start":455.56,"end":482.85},{"id":20,"text":"So now we're going to give a couple of, so we gave a couple of interpretations as to why this L1 heuristic would work, right? And one that is not bad is this idea that, you know, compared to a square penalty, an absolute value penalty keeps up the pressure to make the thing small all the way up until you get to zero.","zh":"现在我们将给出几个解释，说明为什么L1启发式方法会起作用，对吧？其中一种不错的解释是，与平方惩罚相比，绝对值惩罚会持续施加压力，使结果尽可能小，直到达到零。","start":486.19,"end":507.69}],"notes":["本段讨论了凸优化中稀疏性模式与初始化无关的问题。讲者指出，即使在非唯一解的情况下，所有解的最优值是相同的，因此初始化不会影响最终的稀疏性模式。这表明在凸优化中，只要问题具有唯一解，初始化不会对结果产生影响。","讲者进一步强调了凸优化问题的求解方法的多样性。他指出，对于凸问题，存在多种求解方法，且在大多数情况下，这些方法都能得到相同的结果。因此，具体使用哪种方法并不重要，因为结果不会因方法不同而改变。","讲者提到，是否进行“polishing”（即进一步优化）取决于具体的应用场景。在统计拟合中，通常不需要进行polishing，因为其目的是正则化。而在电子设计或机械工程中，如果需要稀疏解（如构建一个只有少量杆件的空间框架），则需要进行polishing。","讲者还解释了L1正则化为何在某些情况下有效。他指出，与平方惩罚相比，绝对值惩罚在变量接近零时仍能保持对变量的压制，从而促进稀疏性。","讲者通过举例说明了不同应用场景下稀疏性的重要性。例如，在电子设计中，稀疏性可以减少实际构建的复杂度，而在统计拟合中，稀疏性可能与正则化的目标相冲突。","讲者强调了凸优化问题的鲁棒性，即无论使用哪种方法，只要问题本身是凸的，结果都是相同的。这表明凸优化问题在实际应用中具有很高的可靠性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":337.23,"end":507.69,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":337.23,"text":"Is the sparsity pattern dependent on the initialization? Would you get a different sparsity pattern? Absolutely not. No, no, no. So there's no such thing as initialization, number one. And number two, if it turns out when you solve that problem, there's not a unique solution, which is entirely possible, then it's possible that you could have different solutions, but they'll all have the same..."},{"start":362.51,"text":"optimal value, right? But no, that's not an issue, right? If that's an issue, we're in deep, deep trouble, right? Because the general story for convex optimization goes like this. I've done this. I've gone off and give talks about something, and I'll say, that's a convex problem. And they'll just say, we can solve it. And then people will say, how'd you solve it? Did you use like, you know, conjugate gradient? Do you use this? I'd actually literally just say, it's none of your business."},{"start":392.98,"text":"Very good at irritating people, right? And then finally they'd say, but you must have used a method. I said, oh, I used a method. I did. You're right. I did. But I'm not saying what it is because it's not relevant. This is a convex problem, right? So what that means is basically, I told them finally, I can think of 50 methods, all of which would work. All of them. So how on, why would, it's like if somebody does least squares and you go, how'd you do it? How'd you do it? Do you use quantum factorization, SVD?"},{"start":419.24,"text":"conjugate gradients, LSQR. And the answer is like, unless the problem is ginormous and you're under extreme real-time constraints or something like that, it's no one's business. They would always get the same answer. So that's why, and certainly it has nothing to do with the initial condition. So that's just my reaction to that. Okay."},{"start":437.74,"text":"Okay, so this is polishing. I mean, it's interesting, and it depends on the application, right? So whether or not you should do polishing. I think in a lot of statistical fitting methods, you should not, because the entire point was to regularize, right? Well, it was two things. It was to do..."},{"start":455.56,"text":"feature selection, and to regularize. So you shouldn't do this. Many other things, like if you're doing electronic design or mechanical engineering or something, and you want a sparse thing because you don't intend to build a space frame with a million bars, but in fact only 236, then you do do this. Because, you know, once you know which ones are actual bars, then you go back and solve the problem. So, okay. That make sense?"},{"start":486.19,"text":"So now we're going to give a couple of, so we gave a couple of interpretations as to why this L1 heuristic would work, right? And one that is not bad is this idea that, you know, compared to a square penalty, an absolute value penalty keeps up the pressure to make the thing small all the way up until you get to zero."}],"speech_gaps":[],"frame":"../frames/v018/003.webp","frame_time":349.23},{"title":"凸优化中的稀疏性与惩罚函数","segments":[{"id":21,"text":"And by pressure, I mean the derivative is either plus or minus one. Plus one if you're negative, right? Whereas for like a square penalty, once you get small, it doesn't care anymore because the penalty is basically small squared. That's actually, believe it or not, perfectly good explanation for why an L1 norm. And for that matter, any penalty with a kink at zero is going to have this kind of property.","zh":"所谓压力，我指的是导数要么是加一，要么是减一。如果你是负数，导数就是加一，对吧？而对于像平方惩罚这样的情况，一旦数值变得很小，它就不再关心了，因为惩罚项基本上是小数的平方。实际上，这可以很好地解释为什么L1范数会有这样的特性。同样地，任何在零点处有拐点的惩罚函数都会有这种性质。","start":508.36,"end":534.44},{"id":22,"text":"In fact, there's a penalty that's very funny. Everyone knows about the Huber penalty, which is a Frankenstein penalty that's quadratic and then transitions to linear. So there's another one, which is L1 for small things and then transitions to quadratic. Everybody picture that? That's going to be a sparsifying regularizer, for example, if you use it as a regularizer. Anyone, you know what it's called?","zh":"事实上，有一种惩罚函数非常有趣。大家都知道Huber惩罚，这是一种结合了二次和线性特性的Frankenstein式惩罚。还有一种，它在数值较小时使用L1惩罚，然后过渡到二次惩罚。大家能想象出来吗？如果用作正则化项，这将是一个稀疏化正则化器。有人知道它叫什么吗？","start":534.94,"end":564.07},{"id":23,"text":"This is kind of cutesy, but I don't care. That's called the Berhew penalty. Sorry. It's Huber-like transp... Anyway, it's stupid. Who cares? Anyway, that's... But the point is that's an example of a sparsifying penalty, right? Okay. All right, so we gave that as an example. I think you've actually already done problems where you have...","zh":"这有点俏皮，但我无所谓。它叫做Berhew惩罚。抱歉，是Huber类似的转换……总之，这很傻，谁在乎呢？总之，这……但重点是，这是一个稀疏化惩罚的例子，对吧？好的。那么我们举了这个例子。我想你们其实已经做过一些问题，其中……","start":564.64,"end":585.14},{"id":24,"text":"experienced this sparsification but now we're going to give a couple of other very kind of very cool interpretations right so what one is let let's solve this problem let's let's let's attempt to solve the cardinality of x minimize this subject to x is in a convex set and then all of the x's are between plus and minus all the components of x are between plus and minus r so that that's this thing here right okay so","zh":"我们接下来要给出一些非常酷的解释。那么，一个例子是，让我们尝试解决这个问题：最小化这个目标函数，约束条件是x属于一个凸集，并且所有x的分量都在正负r之间。这就是这里提到的那个问题。好的，所以","start":585.31,"end":610.99},{"id":25,"text":"What we're going to do is we're going to write this. We're going to introduce some new variables, zi, and they're going to be Boolean. They're going to be either 0 or 1. And we're going to write the constraint that xi is less than r is this way. And what this means is if zi is 0, it means xi is 0. If zi is 1, we express the idea that it's less than r. So this problem is completely equivalent to that one. So they're identical. Not identical, sorry, equivalent. Of course, they're not identical, they're equivalent.","zh":"我们将这样做。我们将引入一些新的变量zi，它们是布尔变量，只能取0或1。我们将通过这种方式写出约束条件xi小于r。这意味着，如果zi是0，那么xi就是0；如果zi是1，我们就表达出xi小于r的想法。因此，这个问题与之前的问题是完全等价的。它们是等价的。当然，它们不完全相同，只是等价。","start":611.52,"end":639.88},{"id":26,"text":"Okay, this one is no easier to solve than this, right? Actually, this one you could pop in to what are called mixed integer linear programming, so a MILP solver. And, you know, if you're lucky, you might get a solution or something like that. Who knows, right? If you're unlucky, you might be waiting an hour or something.","zh":"嗯，这个问题和这个一样难解决，对吧？实际上，这个问题你可以输入到所谓的混合整数线性规划（MILP）求解器中。而且，如果你运气好，你可能会得到一个解或者类似的东西。谁知道呢，对吧？如果你运气不好，你可能得等上一小时或者更久。","start":640.33,"end":661.23}],"notes":["本段讲解了惩罚函数与稀疏性之间的关系，特别是L1范数和具有拐点的惩罚函数如何影响优化问题的解。通过对比平方惩罚和L1惩罚，说明了为什么L1范数能够产生稀疏解。同时，提到Huber惩罚和Berhew惩罚作为具有不同性质的惩罚函数的例子。","接下来，课程讨论了如何通过引入布尔变量来处理稀疏性问题。通过将原问题转化为包含布尔变量的混合整数线性规划（MILP）问题，展示了如何将稀疏性约束转化为可解的优化问题。这种方法虽然在理论上等价，但在实际求解中可能面临计算复杂度高的问题。","课程还提到，虽然将稀疏性问题转化为MILP问题在理论上是可行的，但实际求解时可能会遇到计算时间过长的问题。因此，需要考虑其他更高效的求解方法，如启发式算法或近似方法。","此外，课程强调了稀疏性在优化问题中的重要性，特别是在正则化方法中。通过引入稀疏性约束，可以有效地减少模型的复杂度，提高模型的泛化能力。","最后，课程指出，虽然将稀疏性问题转化为MILP问题在理论上是可行的，但在实际应用中，由于计算复杂度较高，通常需要采用其他方法，如基于梯度下降的优化算法或近似方法。","综上所述，本段内容主要围绕稀疏性惩罚函数的性质及其在优化问题中的应用展开，强调了如何通过引入布尔变量将稀疏性约束转化为可解的优化问题，并讨论了实际求解中可能遇到的挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":508.36,"end":661.23,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":508.36,"text":"And by pressure, I mean the derivative is either plus or minus one. Plus one if you're negative, right? Whereas for like a square penalty, once you get small, it doesn't care anymore because the penalty is basically small squared. That's actually, believe it or not, perfectly good explanation for why an L1 norm. And for that matter, any penalty with a kink at zero is going to have this kind of property."},{"start":534.94,"text":"In fact, there's a penalty that's very funny. Everyone knows about the Huber penalty, which is a Frankenstein penalty that's quadratic and then transitions to linear. So there's another one, which is L1 for small things and then transitions to quadratic. Everybody picture that? That's going to be a sparsifying regularizer, for example, if you use it as a regularizer. Anyone, you know what it's called?"},{"start":564.64,"text":"This is kind of cutesy, but I don't care. That's called the Berhew penalty. Sorry. It's Huber-like transp... Anyway, it's stupid. Who cares? Anyway, that's... But the point is that's an example of a sparsifying penalty, right? Okay. All right, so we gave that as an example. I think you've actually already done problems where you have..."},{"start":585.31,"text":"experienced this sparsification but now we're going to give a couple of other very kind of very cool interpretations right so what one is let let's solve this problem let's let's let's attempt to solve the cardinality of x minimize this subject to x is in a convex set and then all of the x's are between plus and minus all the components of x are between plus and minus r so that that's this thing here right okay so"},{"start":611.52,"text":"What we're going to do is we're going to write this. We're going to introduce some new variables, zi, and they're going to be Boolean. They're going to be either 0 or 1. And we're going to write the constraint that xi is less than r is this way. And what this means is if zi is 0, it means xi is 0. If zi is 1, we express the idea that it's less than r. So this problem is completely equivalent to that one. So they're identical. Not identical, sorry, equivalent. Of course, they're not identical, they're equivalent."},{"start":640.33,"text":"Okay, this one is no easier to solve than this, right? Actually, this one you could pop in to what are called mixed integer linear programming, so a MILP solver. And, you know, if you're lucky, you might get a solution or something like that. Who knows, right? If you're unlucky, you might be waiting an hour or something."}],"speech_gaps":[],"frame":"../frames/v018/004.webp","frame_time":520.36},{"title":"松弛与凸包","segments":[{"id":27,"text":"Okay, so what we're going to do is we're going to relax, which is, you know, that makes perfect sense. What we're going to do is we're going to take these Zs, which are Boolean variables, so 0 and 1. We're going to relax them to this kind of weird quantum mechanical state that can be anywhere between 0 and 1. Right, so that's a relaxation. Now, that gives you this problem here, this top problem. And let's see, let's take a look at it. Oh, good news is that's convex, so that we can solve.","zh":"好的，那么我们接下来要做的事情就是放松，这听起来非常合理。我们将把这些Z变量，也就是布尔变量，0和1，放松成一种奇怪的量子力学状态，可以在0到1之间的任何地方。对，这就是放松。现在，这会给你带来这个问题，也就是上面这个问题。让我们仔细看看。好消息是，这是一个凸问题，因此我们可以求解。","start":662.96,"end":690.89},{"id":28,"text":"That's completely tractable. But if you stare at it carefully, you'll realize that if I divided things out, this is actually the epigraph. The sum of z's here is the epigraph. This is the epigraph representation of the L1 norm of x divided by r. Or just take r equals 1.","zh":"这完全是可以处理的。但如果你仔细观察，你会发现，如果我把各项分开来看，这实际上是上境域（epigraph）。这里的Z之和就是上境域。这是x除以r的L1范数的上境域表示。或者简单地取r等于1。","start":691.31,"end":715.93},{"id":29,"text":"Literally, it's the relaxation of the original Boolean problem just simply becomes our L1 heuristic. By the way, this L1 norm here thing was, sorry, the L infinity constraint was critical to do this. Without that, the relaxation is nothing. It gives you no information at all, right? This also suggests all sorts of things. If your variables have different ranges or bounds,","zh":"实际上，这仅仅是原始布尔问题的放松，直接变成了我们的L1启发式方法。顺便说一句，这里的L1范数，抱歉，L无穷范数是实现这一点的关键。没有这个约束，放松就毫无意义。它完全不会给你任何信息，对吧？这也暗示了许多其他事情。如果你的变量有不同的范围或界限，","start":716.29,"end":745.63},{"id":30,"text":"then you probably shouldn't be doing an L1 heuristic. It should probably be a weighted L1 norm, weighted by the inverse of the bounds or something like that. Okay, now when you solve this problem, I mean, these are the same, they get the same optimal value, you get a lower bound on the optimal value. It's not usually a particularly good one. So this kind of makes sense. Now you can also interpret this in a really cool way.","zh":"那么你可能不应该使用L1启发式方法。它应该是一个加权的L1范数，权重是界限的倒数或者其他类似的东西。好的，当你解决这个问题时，这些是相同的，它们会得到相同的最优值，你会得到最优值的一个下界。这通常并不是一个特别好的下界。所以这在逻辑上是合理的。你现在还可以以一种非常酷的方式解释它。","start":746.4,"end":774.31},{"id":31,"text":"as a convex envelope, which I will explain, right? So if I have any function at all, like here's a function, non-convex, right? Then it's convex envelope. I'll just draw it and then I will write it down. I can write it down in all sorts of very cool ways, right? So there we go. And then I just do this, right? So this thing, that's the so-called convex envelope of the original function, okay? And it makes sense. So lots of ways to say it.","zh":"作为凸包络，我将解释这一点，对吧？所以我有任何函数，比如这里有一个函数，是非凸的，对吧？那么它的凸包络就是凸包络。我将画出来，然后写下来。我可以以各种非常酷的方式写出它，对吧？好了，然后我只需要这样做，对吧？这个东西，就是所谓的原始函数的凸包络，对吧？这在逻辑上是合理的。所以有很多方式可以表达它。","start":774.79,"end":801.82},{"id":32,"text":"It's the largest convex function that is everywhere below your given function.","zh":"它是处处低于给定函数的最大的凸函数。","start":802.36,"end":807.8},{"id":33,"text":"So that's another way to say it.","zh":"这是另一种说法。","start":808.48,"end":809.92},{"id":34,"text":"Here's a super compact description of it, which is very cool.","zh":"这里有一个非常紧凑的描述，这非常酷。","start":810.34,"end":813.48},{"id":35,"text":"It's f star star, right?","zh":"这是 f 星星，对吧？","start":814.3,"end":816.62},{"id":36,"text":"So it's the conjugate of the conjugate.","zh":"所以这是共轭函数的共轭函数。","start":816.68,"end":820.28},{"id":37,"text":"Remember that the conjugate of any function, convex or not, is convex, right?","zh":"记住，任何函数（无论是凸函数还是非凸函数）的共轭函数都是凸函数，对吧？","start":820.34,"end":826.66},{"id":38,"text":"Now, then when I take the conjugate of that, if the original function had been convex,","zh":"现在，当我对这个函数再次取共轭时，如果原来的函数是凸函数，","start":827.14,"end":831.96},{"id":39,"text":"I would have recovered the initial function but I'm definitely going to get something that is","zh":"我将恢复最初的函数，但我可以肯定的是，我会得到一个","start":831.96,"end":836.22},{"id":40,"text":"actually you can easily show you're going to get something which is a lower bound on the original","zh":"实际上你可以很容易地证明，你会得到一个原函数的下界","start":836.22,"end":839.5}],"notes":["本段讲解了如何通过松弛布尔变量（0和1）为连续变量（0到1之间）来构建一个凸优化问题。这种松弛方法将原问题转化为一个凸问题，从而可以使用凸优化技术求解。同时，提到这种松弛方法实际上是L1范数的启发式方法，但需要L无穷约束来确保松弛的有效性。","如果变量有不同的范围或边界，使用L1范数可能不是最佳选择，而应考虑加权L1范数，权重由边界决定。此外，松弛后的问题虽然可以求解，但通常只能提供原问题最优值的下界，而不是精确解。","凸包（convex envelope）是原函数的上界，即最大的凸函数，且在所有点上都不超过原函数。这为非凸函数提供了一个凸近似，有助于优化问题的求解。","凸包可以通过双重共轭函数（f**）来表示，即原函数的共轭函数的共轭。对于任何函数，其共轭函数都是凸的，而如果原函数是凸的，那么双重共轭函数将恢复原函数。","在讲解过程中，提到如果原函数是凸的，那么双重共轭函数将恢复原函数，但如果原函数是非凸的，双重共轭函数将提供原函数的一个下界。","这些概念为理解如何通过松弛和凸包技术处理非凸优化问题提供了理论基础，同时也展示了如何将非凸问题转化为凸问题进行求解。"],"formulas":[{"latex":"f^{**}(x) = \\text{conjugate of the conjugate of } f(x)","symbols":"f^{**}(x) 表示函数 f(x) 的双重共轭","explanation":"该公式正确描述了函数的双重共轭，即函数的共轭函数的共轭函数。在数学中，对于任何函数，其双重共轭是其凸包络。因此，该公式可以保留。","evidence":"It's f star star, right? So it's the conjugate of the conjugate."}],"uncertainties":["I would have recovered the initial function but I'm definitely going to get something that is"],"diagram":"none","start":662.96,"end":839.5,"asr_flags":[],"math_clarifications":["在数学中，'凸包络'通常指的是函数的凸包络，而不是直接称为'凸包'。因此，第一个公式中的表述需要修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":662.96,"text":"Okay, so what we're going to do is we're going to relax, which is, you know, that makes perfect sense. What we're going to do is we're going to take these Zs, which are Boolean variables, so 0 and 1. We're going to relax them to this kind of weird quantum mechanical state that can be anywhere between 0 and 1. Right, so that's a relaxation. Now, that gives you this problem here, this top problem. And let's see, let's take a look at it. Oh, good news is that's convex, so that we can solve."},{"start":691.31,"text":"That's completely tractable. But if you stare at it carefully, you'll realize that if I divided things out, this is actually the epigraph. The sum of z's here is the epigraph. This is the epigraph representation of the L1 norm of x divided by r. Or just take r equals 1. So this problem, which is..."},{"start":716.29,"text":"Literally, it's the relaxation of the original Boolean problem just simply becomes our L1 heuristic. By the way, this L1 norm here thing was, sorry, the L infinity constraint was critical to do this. Without that, the relaxation is nothing. It gives you no information at all, right? This also suggests all sorts of things. If your variables have different ranges or bounds,"},{"start":746.4,"text":"then you probably shouldn't be doing an L1 heuristic. It should probably be a weighted L1 norm, weighted by the inverse of the bounds or something like that. Okay, now when you solve this problem, I mean, these are the same, they get the same optimal value, you get a lower bound on the optimal value. It's not usually a particularly good one. So this kind of makes sense. Now you can also interpret this in a really cool way."},{"start":774.79,"text":"as a convex envelope, which I will explain, right? So if I have any function at all, like here's a function, non-convex, right? Then it's convex envelope. I'll just draw it and then I will write it down. I can write it down in all sorts of very cool ways, right? So there we go. And then I just do this, right? So this thing, that's the so-called convex envelope of the original function, okay? And it makes sense. So lots of ways to say it."},{"start":802.36,"text":"It's the largest convex function that is everywhere below your given function."},{"start":808.48,"text":"So that's another way to say it."},{"start":810.34,"text":"Here's a super compact description of it, which is very cool."},{"start":814.3,"text":"It's f star star, right?"},{"start":816.68,"text":"So it's the conjugate of the conjugate."},{"start":820.34,"text":"Remember that the conjugate of any function, convex or not, is convex, right?"},{"start":827.14,"text":"Now, then when I take the conjugate of that, if the original function had been convex,"},{"start":831.96,"text":"I would have recovered the initial function but I'm definitely going to get something that is"},{"start":836.22,"text":"actually you can easily show you're going to get something which is a lower bound on the original"}],"speech_gaps":[],"frame":"../frames/v018/005.webp","frame_time":674.96},{"title":"凸函数的凸包与凸包的性质","segments":[{"id":41,"text":"function number one so so f star star is less than f is always true but the other cool part","zh":"函数一，所以 f 星星小于 f 始终成立，但另一个有趣的部分","start":839.5,"end":845.44},{"id":42,"text":"is had it been convex you would have gotten f back right but so that's actually another way","zh":"如果它是凸的，你就会得到 f 本身，对吧？但这是另一种表达方式","start":845.44,"end":851.12},{"id":43,"text":"to express the envelope which I think is kind of cool um so um and in fact you'll see a lot of","zh":"来表达包络，我觉得这有点酷。嗯，嗯，事实上你会看到很多人甚至不使用 fnv，而是直接在论文中写出 f 星星。这就是凸","start":851.12,"end":857.78},{"id":44,"text":"of people not even use fnv, but just literally write f star star in papers. That's the convex","zh":"包络。所以这很合理。你可以至少对某些事物进行推导。我们甚至可以","start":857.78,"end":863.7},{"id":45,"text":"envelope. So it makes sense. And you can work it out for at least some things. And we can","zh":"对卡函数进行推导，但限制在某个区间上。所以我将写下卡函数。这是零。所以让我们看看。它看起来像这样。噢不，所以","start":863.7,"end":870.16},{"id":46,"text":"actually work it out for the card function, but restricted to an interval. So I'm going","zh":"这就是填充的，然后看起来像那样。","start":870.16,"end":879.8},{"id":47,"text":"to write down the card function. This is zero. So let's see. It looks like this. Oh no, so","zh":"写下卡函数。这是零。所以让我们看看。看起来像这样。哦不，所以","start":879.8,"end":885.6},{"id":48,"text":"So that's filled, and then it looks like that.","zh":"所以这就填满了，然后看起来像这样。","start":885.6,"end":887.68},{"id":49,"text":"That's the card function, okay?","zh":"那是卡函数，对吧？","start":887.7,"end":889.14},{"id":50,"text":"By the way, what is the convex envelope","zh":"顺便问一下，仅卡函数的凸包是什么？","start":889.88,"end":891.64},{"id":51,"text":"of just card by itself?","zh":"它有一个，我想知道它是多少。","start":891.64,"end":893.36},{"id":52,"text":"It has one, and I'd like to know what it is.","zh":"是的，它就是零。","start":893.94,"end":895.98},{"id":53,"text":"Yeah, it's just zero.","zh":"它是常数零函数。","start":899.74,"end":900.8},{"id":54,"text":"It's the constant zero.","zh":"你想想，A，它是凸的，","start":900.92,"end":902.26},{"id":55,"text":"And you go, which, if you think about it,","zh":"对吧？","start":902.74,"end":904.9},{"id":56,"text":"A, it's convex,","zh":"A，它是凸的，","start":905.32,"end":906.54},{"id":57,"text":"and B, it's a lower bound on the card function","zh":"对于集合 A 和 B，这是 card 函数的一个下界","start":906.96,"end":908.74},{"id":58,"text":"because the card function only has the value zero or one.","zh":"因为 card 函数的值只能是零或一","start":908.74,"end":910.68},{"id":59,"text":"So, congratulations.","zh":"所以，恭喜你","start":911.32,"end":912.04},{"id":60,"text":"It's completely useless.","zh":"这完全没用","start":912.14,"end":913.22},{"id":61,"text":"Okay, so, but if we say, no, you know what, but this is, I happen to also know that the variable is between, let's say, minus r, right, and plus r. So the actual function I'm taking the card of looks like this, and it goes up to plus infinity out there. Okay, what is the convex envelope of that function? This is actually very cool. You can get it. And, yeah, what is it?","zh":"好的，但是如果我们说，不，你知道吗，但我恰好还知道这个变量是在，比如说，负 r 和正 r 之间。所以我正在取 card 的函数看起来像这样，它在那里会趋向正无穷。好的，这个函数的凸包是什么？这实际上非常酷。你可以得到它。而且，是的，它是什么？","start":915.13,"end":941.47},{"id":62,"text":"Yeah, so you just draw, you go like this. I mean, literally, you take the epigraph, the epigraph of the whole thing is this thing up here, going up to infinity, plus there's a little needle sticking down here. That's the epigraph. I take the convex hull of the epigraph, that fills in this, and then this is the, this is f star star. So, in this case, where f is card restricted to","zh":"是的，你只需要画出来，你画成这样。我的意思是，实际上，你取整个函数的上境域，这个上境域就是这里的东西，趋向于无穷大，再加上这里有一根小针。这就是上境域。我取上境域的凸包，这会填满这个区域，这就是 f 星星。所以在这种情况下，当 f 是 card 在绝对值小于 r 的限制下","start":942.6,"end":970.06},{"id":63,"text":"absolute value less than r. Everybody got this? Actually, it's kind of cool because it suggests all sorts of things. If you knew, if you had other bounds on x that were asymmetric, you would use like an asymmetric thing here. And by the way, it would be a better sparsifier, right? So this is the idea. So actually, you don't have to worry about that. So for example, in the application of regressor selection,","zh":"大家明白了吗？实际上，这有点酷，因为它暗示了各种可能性。如果你知道，如果你对 x 有其他不对称的限制，你会在这里使用不对称的东西。顺便说一句，这会是一个更好的稀疏化器，对吧？这就是这个想法。所以实际上，你不必担心这一点。例如，在回归子选择的应用中","start":970.76,"end":997.34}],"notes":["本段讲授了凸函数的凸包（convex envelope）概念，即对于一个函数，其凸包是所有凸函数中最小的上界。对于非凸函数，其凸包是通过取其上半部分（epigraph）的凸包得到的。在例子中，讲者讨论了card函数（即指示函数）的凸包，指出当变量没有限制时，其凸包是零函数，因为card函数的值域为0或1，而零函数是其下界且凸的。"],"formulas":[],"uncertainties":["card function","f star star","epigraph","convex hull"],"diagram":"none","start":839.5,"end":997.34,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":839.5,"text":"function number one so so f star star is less than f is always true but the other cool part"},{"start":845.44,"text":"is had it been convex you would have gotten f back right but so that's actually another way"},{"start":851.12,"text":"to express the envelope which I think is kind of cool um so um and in fact you'll see a lot of"},{"start":857.78,"text":"of people not even use fnv, but just literally write f star star in papers. That's the convex"},{"start":863.7,"text":"envelope. So it makes sense. And you can work it out for at least some things. And we can"},{"start":870.16,"text":"actually work it out for the card function, but restricted to an interval. So I'm going"},{"start":879.8,"text":"to write down the card function. This is zero. So let's see. It looks like this. Oh no, so"},{"start":885.6,"text":"So that's filled, and then it looks like that."},{"start":887.7,"text":"That's the card function, okay?"},{"start":889.88,"text":"By the way, what is the convex envelope"},{"start":891.64,"text":"of just card by itself?"},{"start":893.94,"text":"It has one, and I'd like to know what it is."},{"start":899.74,"text":"Yeah, it's just zero."},{"start":900.92,"text":"It's the constant zero."},{"start":902.74,"text":"And you go, which, if you think about it,"},{"start":905.32,"text":"A, it's convex,"},{"start":906.96,"text":"and B, it's a lower bound on the card function"},{"start":908.74,"text":"because the card function only has the value zero or one."},{"start":911.32,"text":"So, congratulations."},{"start":912.14,"text":"It's completely useless."},{"start":915.13,"text":"Okay, so, but if we say, no, you know what, but this is, I happen to also know that the variable is between, let's say, minus r, right, and plus r. So the actual function I'm taking the card of looks like this, and it goes up to plus infinity out there. Okay, what is the convex envelope of that function? This is actually very cool. You can get it. And, yeah, what is it?"},{"start":942.6,"text":"Yeah, so you just draw, you go like this. I mean, literally, you take the epigraph, the epigraph of the whole thing is this thing up here, going up to infinity, plus there's a little needle sticking down here. That's the epigraph. I take the convex hull of the epigraph, that fills in this, and then this is the, this is f star star. So, in this case, where f is card restricted to"},{"start":970.76,"text":"absolute value less than r. Everybody got this? Actually, it's kind of cool because it suggests all sorts of things. If you knew, if you had other bounds on x that were asymmetric, you would use like an asymmetric thing here. And by the way, it would be a better sparsifier, right? So this is the idea. So actually, you don't have to worry about that. So for example, in the application of regressor selection,"}],"speech_gaps":[],"frame":"../frames/v018/006.webp","frame_time":851.5},{"title":"特征标准化与L1范数的使用","segments":[{"id":64,"text":"in machine learning and statistics. This is generally not a problem because the data have, I assume, standard practice is to actually standardize the features. So they're all now between reasonable ranges, right? Like, in fact, for that matter, roughly speaking between plus and minus one. And so that justifies the use of an L1 norm. If you, for whatever reason, you did not standardize your features,","zh":"在机器学习和统计学中。这通常不是一个大问题，因为数据通常会按照标准做法对特征进行标准化。因此，所有特征现在都在合理的范围内，对吧？实际上，大致来说，它们的范围在正负一之间。这就正当地使用了L1范数。如果你出于某种原因没有对特征进行标准化，","start":998.06,"end":1023.46},{"id":65,"text":"then, and you want to do something like lasso, then you should, well, number one, you should not do that. Okay, number one. But if you did do that, you shouldn't be using, you should be using a weird, like, you know, weighted L1 norm or an asymmetric thing or something like that. Okay, everybody following this? So it's, I mean, it's interesting. Okay.","zh":"那么，如果你想使用类似Lasso的方法，你应该，首先，不要这么做。好的，第一点。但如果你确实这么做了，你不应该使用普通的L1范数，而应该使用一种奇怪的加权L1范数或不对称的函数之类的东西。好的，大家跟上了吗？这很有趣。好的。","start":1024.37,"end":1044.55},{"id":66,"text":"Yeah, so that's just this. If you knew, for example, that over this convex feasible set, if you calculated what's called the bounding box, which, by the way, I could solve for any problem if I don't mind solving 2n convex problems. I just maximize xi subject to x and c, and then I minimize xi. Those are both convex problems. And I will get the best possible values of L and U.","zh":"是的，这就是这个意思。例如，如果你知道在这个凸可行集上，如果你计算所谓的边界框，顺便说一句，如果我不介意解决2n个凸问题，我就可以解决任何问题。我只需最大化xi，约束条件为x和c，然后最小化xi。这些都是凸问题。我会得到L和U的最佳可能值。","start":1046.37,"end":1073.91},{"id":67,"text":"If x has a dimension really small, like 10, you should just consider solving it brute force and just solve all 1024 convex problems, right? Then is 20. This is actually interesting right here because it's not going to kill you to solve 40 problems to get the bounds, which is going to give you a better sparsifier than just an L1 norm.","zh":"如果x的维度非常小，比如10，你应该直接暴力求解，解决所有1024个凸问题，对吧？然后是20。这实际上在这里很有趣，因为解决40个问题来获取边界值并不会让你付出太大代价，这会比仅仅使用L1范数得到更好的稀疏化效果。","start":1075.56,"end":1101.2},{"id":68,"text":"right so that would be one um what you get though is something really cool it's actually um you you get a function that is that matches it's just what you think it is i'll just draw the picture over here it just says suppose this is between uh what i call this li or something and then this is ui i'll make it asymmetric there's ui right i'll just call it u i doesn't matter then your","zh":"对，这就是一种情况。你得到的是一种非常酷的东西，实际上，它就是你所想的那样。我只需要在这里画个图。它说，假设这个在什么我称之为li或类似的东西之间，然后这是ui，我会让它不对称，这里有个ui，我只需要称它为u，没关系。然后你的","start":1101.58,"end":1129.27},{"id":69,"text":"I mean, this is kind of clear, but your convex envelope looks like this, right? And it's this tilted function, right? Actually, which I think people now call the pinball loss, right? Because it has to do with pinball machine. Don't ask. Anyway, fine. It's stuck. I think it's stuck. So, okay. And that's what this is called.","zh":"我的意思是，这有点清楚，但你的凸包络看起来像这样，对吧？而且这是一个倾斜的函数，对吧？实际上，我认为现在人们称之为pinball损失，对吧？因为它与pinball机器有关。别问。不管怎样，就这样。我认为它已经卡住了。所以，好吧。这就是这个的名称。","start":1130.44,"end":1156.52}],"notes":["本段主要讨论特征标准化在使用L1范数时的重要性。讲者指出，如果数据未进行标准化，直接使用L1范数可能会导致不合理的模型表现，此时应考虑使用加权L1范数或不对称范数。标准化后的特征通常位于合理范围内，如±1之间，这使得L1范数的使用更加合理。","讲者进一步解释了如何通过计算凸可行集的边界框（bounding box）来确定L和U的值。这可以通过求解两个凸问题来实现：最大化和最小化xi，其中xi是特征的某个分量。这种方法适用于特征维度较小的情况，例如10维，此时可以暴力求解所有可能的凸问题。","讲者提到，即使需要求解多个凸问题，例如40个，也不会对计算造成太大负担，因为这可以提供比单纯使用L1范数更精确的稀疏化效果。这种稀疏化方法通过构造一个倾斜的函数来实现，该函数被称为pinball loss，与pinball机器有关。","讲者强调，这种函数的凸包（convex envelope）具有特定的形状，其倾斜程度取决于所选的上下界L和U。这种函数的构造方法在优化问题中具有实际应用价值，尤其是在需要稀疏解的场景中。","讲者最后指出，这种函数的名称为pinball loss，尽管其名称来源可能与pinball机器有关，但其数学性质和应用价值是明确的。这种函数的构造方法为后续的优化问题提供了新的思路。","讲者通过举例说明了如何通过计算边界框来确定L和U的值，并指出这种方法在特征维度较小时的可行性。这种方法的计算复杂度虽然较高，但其带来的稀疏化效果是值得的。"],"formulas":[],"uncertainties":["the pinball loss"],"diagram":"none","start":998.06,"end":1156.52,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":998.06,"text":"in machine learning and statistics. This is generally not a problem because the data have, I assume, standard practice is to actually standardize the features. So they're all now between reasonable ranges, right? Like, in fact, for that matter, roughly speaking between plus and minus one. And so that justifies the use of an L1 norm. If you, for whatever reason, you did not standardize your features,"},{"start":1024.37,"text ou know, this is how many features you use. And then this is how small you can make norm AX minus B. This might be some kind of fit, right? And there's a trade-off. This one shows you the exact, this is the global optimal.","zh":"你知道，这里有一个X和R20。这意味着当然，X有百万种不同的可能值，对吧？我的意思是，抱歉，X的稀疏模式是百万种。是的，我们只是全局求解了它，因为这并不算什么大问题。然后你会得到一个权衡曲线，即你使用了多少特征，以及你可以使AX减去B的范数多小。这可能是一种拟合，对吧？并且存在权衡。这个例子展示了精确的，这是全局最优解。","start":1239.01,"end":1268.07},{"id":74,"text":"Right. This would have been impossible had this been R50. I mean, you know, not impossible because it would be outside this stuff we do in this class. Right. And so if you do the L1, you know, if you do the L1 heuristic with polishing, you actually get this. Right. This thing. It's actually really cool. Like often you're just dead on. It's like here it's dead on. Well, that's silly. But here you're dead on.","zh":"对。如果这是R50的话，这将是不可能的。我的意思是，这并不完全不可能，因为它会超出我们在本课程中所做的事情。对吧？所以如果你使用L1范数，如果你使用带有优化的L1启发式方法，你实际上会得到这个结果。对吧？这个结果。这实际上真的很酷。通常你都会非常准确。就像这里一样，它非常准确。嗯，这很傻。但在这里你就是非常准确。","start":1268.41,"end":1293.55},{"id":75,"text":"Here, you're off by one, here you're off by one, right? So it's actually kind of interesting how this works, right? All right, so this is a baby example, but it's just to illustrate this. It's a huge big difference, right? That the approximate difference in computation effort, in this case, I mean, we could have done it more efficiently, but in this case, it's a million to one, right? Because each of...","zh":"这里你少算了一个，这里你少算了一个，对吧？所以这种工作机制其实挺有意思的，对吧？好的，这是一个简单的例子，只是为了说明这一点。这种计算上的近似差异，这种情况下，我们本可以更高效地完成，但在这里，差距是一百万倍，对吧？因为每个……","start":1295.1,"end":1324.22}],"notes":["本段讲解了稀疏性在回归选择中的应用，特别是通过选择非零元素的数量来构建模型。讲者以基因表达数据为例，说明如何从25000个特征中选择30个来预测600个患者的某种结果，强调了稀疏性在处理高维数据时的重要性。","讲者提到，选择30个特征的组合数量非常庞大，因此需要有效的算法来处理。这些方法通常与Lasso回归相关，也被称为基追踪等，取决于是作为约束还是正则化项使用。","在具体例子中，讲者提到X和R20，说明X的稀疏模式有100万种可能，因此可以全局求解。这展示了稀疏性如何帮助在特征选择中找到最优解。","讲者指出，如果特征空间是R50，那么问题将变得复杂，超出本课程的范围。使用L1正则化方法结合优化策略可以得到接近最优解的结果，这在实际应用中非常有用。","讲者还提到，虽然在某些情况下结果可能只差一个特征，但这种近
