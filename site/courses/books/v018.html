ematical area that reduce to."},{"start":2951.49,"text":"optimization, right? So, you know, engineering, design, data analysis and statistics, you know, economics, management, you know, all of these things, they're just optimization problems, right? I mean, frankly,"},{"start":2965.68,"text":"that's a that's a tautology or something like so of course they're all optimization problems that's not an interesting statement i mean it's an interesting way to think about things right like it's actually i i think it's actually super clear way to do it like you go into a situation and people are coming at you from four different telling you oh there's this and we have to do that and these these constraints and forgot about oh there's regulatory you know bubble and you're like ah and you just sit down and you say okay wait sorry what are the things you're allowed to mess with these are the variables"}],"speech_gaps":[],"frame":"../frames/v018/018.webp","frame_time":2840.19},{"title":"凸优化中的多目标问题与可解性","segments":[{"id":186,"text":"what are the things that are non-negotiable? And they would say, well, and those are your constraints. And then you'd say, what would make you happy? Now, they probably are going to mention two or three things, right? And then you know you have a multi-criterion problem, and you'd say, cool, I will scalarize it with a bunch of weights, and we'll play with those later to see how happy we can make you.","start":2993.9,"end":3015.96},{"id":187,"text":"Everybody following what I just said? So it's actually not a bad way to organize your thoughts. When you get into something, there's people coming at you from 50 different things and they say, oh, whatever, don't remember, you know, remember rule 144B and remember the, you know, the Basel requirements for capital. And you're like, well, anyway, so it's just a very good way to actually just do anything, right? Not just there, but actually any field. Okay. Okay. So, you know.","start":3016.24,"end":3041.15},{"id":188,"text":"So basically, tractability, roughly speaking, but I mean, some people get really weird about this. Tractability, the problems that are tractable are the ones which are convex, right? And there's people that get weird and extreme about this. I'm not one of them, but so they would actually go through the undergrad.","start":3042.18,"end":3059.64},{"id":189,"text":"CS course. They'd say, ha, you can find the shortest path in a graph from here to here. That's polynomial time. That's not a convex problem. Well, the answer is yes, it is, right? It turns out it's one where the relaxation has zero duality gap, right? Or they could say, I can take the singular value decomposition. That's not convex. And then it's even weirder. They would say, oh, it is. Because the dual of the dual, that has zero, that's a non-convex problem with zero duality gap. This is getting weird because it's just, no, it's, we know how to do that, right?","start":3060.61,"end":3087.25},{"id":190,"text":"And of course, the other thing is we shouldn't get too bent out of shape about it because in, I don't know, 95% of applications when you're solving an optimization problem, that's just a surrogate for what you really want. And that's actually something good to keep in mind, right? So, you know, if you're doing machine learning, you don't care about minimizing a loss plus a regularizer. You want to have good predictions on data you've never seen before.","start":3088.99,"end":3115.63},{"id":191,"text":"If you're making a drone trajectory and you're running MPC or something like that, you don't care about solving whatever optimization problem somebody... You want it to follow the trajectory well and use as little fuel, or in that case energy, as possible. Everybody see what I'm saying? If you're doing finance, you just want to make money without taking risks. If someone chooses to solve some silly convex optimization problem to do it...","start":3116.9,"end":3143.16},{"id":192,"text":"Good for them, but you're not paid. We should just all bear in mind that in almost all applications, the optimization problem solving is actually just a surrogate for what you really want. That's an important thing to remember. When you think about that, then you realize it's not that big a deal if you can't solve a problem globally. It's perfectly cool if you can, but if you can't, it's just not that big a deal.","start":3143.54,"end":3171.01}],"notes":["本段讨论了多目标优化问题的处理方式，即通过加权的方式将多个目标转化为单一目标进行优化。讲者指出，这种做法在实际应用中非常常见，但需要注意的是，优化问题通常只是对真正目标的近似，而不是直接等同于目标本身。","讲者强调了凸优化问题在可解性方面的优势，但同时也指出，某些非凸问题在特定条件下（如松弛后具有零对偶间隙）也可以被有效求解。这表明，凸性并不是唯一决定问题可解性的因素。","在实际应用中，优化问题通常作为对真正目标的代理，例如在机器学习中，优化目标是损失函数加上正则项，但真正目标是获得良好的预测性能。讲者指出，这种代理关系在大多数情况下是合理的。","讲者还提到，即使无法全局求解优化问题，也不必过于担忧，因为实际应用中更关注的是局部最优解或近似解。这表明，优化问题的求解并不总是需要全局最优。","讲者通过多个实际例子（如无人机轨迹规划、金融投资）说明了优化问题在不同领域的应用，强调了优化问题作为代理目标的重要性。","最后，讲者指出，虽然凸优化在理论上具有良好的性质，但在实际应用中，优化问题的求解往往只是对真正目标的近似，因此不必过分追求严格的凸性条件。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2993.9,"end":3171.01,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2993.9,"text":"what are the things that are non-negotiable? And they would say, well, and those are your constraints. And then you'd say, what would make you happy? Now, they probably are going to mention two or three things, right? And then you know you have a multi-criterion problem, and you'd say, cool, I will scalarize it with a bunch of weights, and we'll play with those later to see how happy we can make you."},{"start":3016.24,"text":"Everybody following what I just said? So it's actually not a bad way to organize your thoughts. When you get into something, there's people coming at you from 50 different things and they say, oh, whatever, don't remember, you know, remember rule 144B and remember the, you know, the Basel requirements for capital. And you're like, well, anyway, so it's just a very good way to actually just do anything, right? Not just there, but actually any field. Okay. Okay. So, you know."},{"start":3042.18,"text":"So basically, tractability, roughly speaking, but I mean, some people get really weird about this. Tractability, the problems that are tractable are the ones which are convex, right? And there's people that get weird and extreme about this. I'm not one of them, but so they would actually go through the undergrad."},{"start":3060.61,"text":"CS course. They'd say, ha, you can find the shortest path in a graph from here to here. That's polynomial time. That's not a convex problem. Well, the answer is yes, it is, right? It turns out it's one where the relaxation has zero duality gap, right? Or they could say, I can take the singular value decomposition. That's not convex. And then it's even weirder. They would say, oh, it is. Because the dual of the dual, that has zero, that's a non-convex problem with zero duality gap. This is getting weird because it's just, no, it's, we know how to do that, right?"},{"start":3088.99,"text":"And of course, the other thing is we shouldn't get too bent out of shape about it because in, I don't know, 95% of applications when you're solving an optimization problem, that's just a surrogate for what you really want. And that's actually something good to keep in mind, right? So, you know, if you're doing machine learning, you don't care about minimizing a loss plus a regularizer. You want to have good predictions on data you've never seen before."},{"start":3116.9,"text":"If you're making a drone trajectory and you're running MPC or something like that, you don't care about solving whatever optimization problem somebody... You want it to follow the trajectory well and use as little fuel, or in that case energy, as possible. Everybody see what I'm saying? If you're doing finance, you just want to make money without taking risks. If someone chooses to solve some silly convex optimization problem to do it..."},{"start":3143.54,"text":"Good for them, but you're not paid. We should just all bear in mind that in almost all applications, the optimization problem solving is actually just a surrogate for what you really want. That's an important thing to remember. When you think about that, then you realize it's not that big a deal if you can't solve a problem globally. It's perfectly cool if you can, but if you can't, it's just not that big a deal."}],"speech_gaps":[],"frame":"../frames/v018/019.webp","frame_time":3005.9},{"title":"凸优化的实际应用与非凸优化的挑战","segments":[{"id":193,"text":"So, you know, if someone took your circuit design and reduced the dynamic power consumption by 20%, you're happy, right? I mean, maybe you think, like, could someone do it by 30%, but you're just happy you just reduced it 25%. So I'm just saying, you know, we shouldn't get too hung up on this. Nevertheless, tractable is not a bad thing. So, you know, to be able to say I can solve this problem exactly, there's a lot of benefits. I mean, one benefit is there's no babysitting.","start":3173.47,"end":3201.85},{"id":194,"text":"of the algorithm, right? You know, when you have, you know, close your eyes and think of any place where people widely use non-convex optimization. Anyone here can think of a bunch of those, right? It turns out, actually, like, quote, solving those problems, which you're not actually doing, is actually an art. And somebody says, oh, no, no, you should be using this and that, and you should change the learning rate and blah, blah, blah. And you just don't, that's just all short-circuited. You just don't have it.","start":3202.21,"end":3227.89},{"id":195,"text":"right? Or what's your initial, like you asked, what's the initial condition, right? Like, you know, that's a pretty good circuit design, but how did, what was your initial design, right? And the point about this is that's just short-circuited. There's no such thing. You just don't, you don't have any of that. It's just all gone, right? I mean, the other advantage, of course, being the fact that they can be made unbelievably reliable and therefore they can be embedded. So they are embedded in control systems where they solve a thousand QPs per second.","start":3228.29,"end":3256.03},{"id":196,"text":"and they do that for hours and hours and days and days, just forever, and it just works, right? And, you know, try doing that with a non-convex thing, like, you know, because it's not going to take long before something fails to converge or something like that. Okay, okay. So, you know, a lot of applications that you've seen in this class, they can be formulated as convex problems. We go a little bit overboard on it because you're kind of in a little sandbox now, but...","start":3256.93,"end":3282.69},{"id":197,"text":"Once you finish the course, you can venture out. So it turns out most problems aren't really convex. But it turns out once you know these tools, you're going to be unbelievably effective at problems that aren't convex, right? Because someone will say, yeah, I want to do a trade list. You say, oh, but there's a minimum non-zero trade size. Like, I'm sorry, don't come back and tell me to buy like $300 worth of something. Minimum is $10,000. Everybody see what I'm saying? You can see the zero or minimum $10,000.","start":3283.02,"end":3311.48},{"id":198,"text":"That's that's a that actually happens like all the time. Okay Once you know these things you will figure out your it you could now all of you could figure out a heuristic for that and it would be Extremely good some in fact somebody just come up with your risk with a heuristic for that right now I'm gonna sell let's make it simple. I'm gonna sell a bunch of stuff. I have six thousand assets. I'm gonna sell some","start":3312.19,"end":3333.92}],"notes":["本段讨论了凸优化在实际应用中的优势，特别是其可靠性和可嵌入性。讲者指出，凸优化问题可以被精确求解，这使得它们在控制系统的实时计算中非常有用，例如每秒解决数千个二次规划问题。同时，讲者也提到，非凸优化问题在实际应用中更为常见，但其求解过程可能不稳定，容易出现收敛失败的问题。","讲者通过一个交易列表的例子说明了非凸优化问题的复杂性。他指出，即使在实际应用中存在最小交易金额的约束，非凸优化问题的求解仍然可能面临挑战，而凸优化方法可以提供更可靠的解决方案。","讲者强调，虽然课程中 f course, being the fact that they can be made unbelievably reliable and therefore they can be embedded. So they are embedded in control systems where they solve a thousand QPs per second."},{"start":3256.93,"text":"and they do that for hours and hours and days and days, just forever, and it just works, right? And, you know, try doing that with a non-convex thing, like, you know, because it's not going to take long before something fails to converge or something like that. Okay, okay. So, you know, a lot of applications that you've seen in this class, they can be formulated as convex problems. We go a little bit overboard on it because you're kind of in a little sandbox now, but..."},{"start":3283.02,"text":"Once you finish the course, you can venture out. So it turns out most problems aren't really convex. But it turns out once you know these tools, you're going to be unbelievably effective at problems that aren't convex, right? Because someone will say, yeah, I want to do a trade list. You say, oh, but there's a minimum non-zero trade size. Like, I'm sorry, don't come back and tell me to buy like $300 worth of something. Minimum is $10,000. Everybody see what I'm saying? You can see the zero or minimum $10,000."},{"start":3312.19,"text":"That's that's a that actually happens like all the time. Okay Once you know these things you will figure out your it you could now all of you could figure out a heuristic for that and it would be Extremely good some in fact somebody just come up with your risk with a heuristic for that right now I'm gonna sell let's make it simple. I'm gonna sell a bunch of stuff. I have six thousand assets. I'm gonna sell some"}],"speech_gaps":[],"frame":"../frames/v018/020.webp","frame_time":3185.47},{"title":"凸优化中的松弛与实际应用","segments":[{"id":199,"text":"But here are the rules. Don't ask me to sell $300 worth of something. I mean, that's kind of insulting, right? Make it something. It's either you don't sell any or it's $10,000 worth. Somebody come up with a heuristic right now. And the rest of the problems I've got, transaction cost, risk, blah, blah, blah. I don't know. So somebody give me an example. How would you do it? I say you could do it right now. Or maybe after some reflection. What would you do? What's the first thing you would do in that situation?","start":3334.52,"end":3366.1},{"id":200,"text":"Let me describe it a different way. Somebody comes into you, and they're ranting and raving, and they say, here's what I want you to do, and they list off 12 constraints and objectives which are convex, and one that's not. Do you have a suggestion for me? It's a street fighting suggestion. What is it? What would you do? Relax the last one. Yeah, relax the last one, which means, let's be brutally honest. How about this? How about just ignore it?","start":3367.81,"end":3396.54},{"id":201,"text":"So that's kind of what it, that's a strong form of relaxation, right? So you solve it without it. Okay. You know, yeah, you can put an L1 norm in there. That's fine. Let's put an L1 norm in there. And you get, then you look at all your trades and you, then what do you do? If they come out above 10,000 bucks, they're fine, right? If they're zero, they're fine.","start":3397.66,"end":3418.41},{"id":202,"text":"If they're in that weird dead band in the middle, they're not cool, according to your trading desk or something. Everybody following this? I mean, I could transpose this to any field there is, right? I guarantee you exact identical things happen. Like, here's one. A generator is either off and generating zero power, or the minimum is like 10 megawatts.","start":3419.07,"end":3438.09},{"id":203,"text":"So see the zero or between 10 and 30 megawatts. End of story. So that's identical to this, right? Okay. So, all right. So what you do now is anybody, what you do is you'd solve it once. Then you simply have a threshold and you decide which generator is on and which is off.","start":3438.8,"end":3454.14},{"id":204,"text":"Now you resolve with that as a constraint. If you're on, you're bigger than your minimum power. Let's make it 10 megawatts. If you're trading, you'd say, I'm going to sell more than... Anybody that came... If you're on, if I'm actually selling you, I have to sell more than 10,000 bucks worth. Everybody got this? And everything else is zero. That's two convex problems. This would work beautifully. Theoristic.","start":3454.89,"end":3478.65},{"id":205,"text":"you know, we do stuff that's mostly just convex, but once you absorb all these tools, you will be extremely effective at things like that. So, okay. Okay. All right. So, you know, the theoretical consequences of convexity are, you know, local, optimal, global. Duality theory is kind of awesome, right? It's a, basically, I think of it as it's a completely systematic way to derive sophisticated lower bounds.","start":3478.95,"end":3507.69}],"notes":["本段讨论了在凸优化中如何处理非凸约束的问题，提出了一种通过松弛最后一条非凸约束的方法。这种松弛方法可以简化问题，使其变为凸问题，从而更容易求解。例如，在交易问题中，可以忽略非凸约束，然后通过阈值判断是否满足条件。","讲者通过发电机的例子进一步说明了这种松弛方法的应用。发电机要么关闭（零功率），要么在最低功率（如10兆瓦）以上运行。这种二元选择与交易问题中的零或超过10,000美元的交易类似，展示了凸优化在实际问题中的应用。","在解决凸优化问题后，可以通过设定阈值来决定哪些变量满足条件，哪些不满足。例如，在交易问题中，如果交易金额超过10,000美元，则视为有效，否则视为无效。这种方法将问题分解为两个凸问题，从而实现有效求解。","讲者强调了凸优化理论的理论后果，包括局部最优解与全局最优解的等价性，以及对偶理论的重要性。对偶理论提供了一种系统的方法来推导复杂的下界，这在优化问题中具有重要意义。","讲者指出，虽然实际问题中可能包含非凸约束，但通过适当的松弛方法，可以将问题转化为凸问题，从而利用凸优化的强大工具进行求解。这种方法在多个领域都有广泛应用，如金融交易和电力系统优化。","最后，讲者总结了凸优化的核心思想，即通过吸收各种工具和方法，可以有效地解决实际问题。凸优化的理论基础和实际应用相结合，使得该方法在解决复杂问题时具有显著优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3334.52,"end":3507.69,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3334.52,"text":"But here are the rules. Don't ask me to sell $300 worth of something. I mean, that's kind of insulting, right? Make it something. It's either you don't sell any or it's $10,000 worth. Somebody come up with a heuristic right now. And the rest of the problems I've got, transaction cost, risk, blah, blah, blah. I don't know. So somebody give me an example. How would you do it? I say you could do it right now. Or maybe after some reflection. What would you do? What's the first thing you would do in that situation?"},{"start":3367.81,"text":"Let me describe it a different way. Somebody comes into you, and they're ranting and raving, and they say, here's what I want you to do, and they list off 12 constraints and objectives which are convex, and one that's not. Do you have a suggestion for me? It's a street fighting suggestion. What is it? What would you do? Relax the last one. Yeah, relax the last one, which means, let's be brutally honest. How about this? How about just ignore it?"},{"start":3397.66,"text":"So that's kind of what it, that's a strong form of relaxation, right? So you solve it without it. Okay. You know, yeah, you can put an L1 norm in there. That's fine. Let's put an L1 norm in there. And you get, then you look at all your trades and you, then what do you do? If they come out above 10,000 bucks, they're fine, right? If they're zero, they're fine."},{"start":3419.07,"text":"If they're in that weird dead band in the middle, they're not cool, according to your trading desk or something. Everybody following this? I mean, I could transpose this to any field there is, right? I guarantee you exact identical things happen. Like, here's one. A generator is either off and generating zero power, or the minimum is like 10 megawatts."},{"start":3438.8,"text":"So see the zero or between 10 and 30 megawatts. End of story. So that's identical to this, right? Okay. So, all right. So what you do now is anybody, what you do is you'd solve it once. Then you simply have a threshold and you decide which generator is on and which is off."},{"start":3454.89,"text":"Now you resolve with that as a constraint. If you're on, you're bigger than your minimum power. Let's make it 10 megawatts. If you're trading, you'd say, I'm going to sell more than... Anybody that came... If you're on, if I'm actually selling you, I have to sell more than 10,000 bucks worth. Everybody got this? And everything else is zero. That's two convex problems. This would work beautifully. Theoristic. This is just an example to say that..."},{"start":3478.95,"text":"you know, we do stuff that's mostly just convex, but once you absorb all these tools, you will be extremely effective at things like that. So, okay. Okay. All right. So, you know, the theoretical consequences of convexity are, you know, local, optimal, global. Duality theory is kind of awesome, right? It's a, basically, I think of it as it's a completely systematic way to derive sophisticated lower bounds."}],"speech_gaps":[],"frame":"../frames/v018/021.webp","frame_time":3346.52},{"title":"凸优化中的可行性证书与实际应用","segments":[{"id":206,"text":"on the optimal value of a problem, which is kind of cool, right? In the case of convexity, they become sort of necessary and sufficient. I mean, not quite. There's a little asterisk and there's some constraint qualification, but that's fine. And it's super useful. It allows you to do things like sensitivity analysis. It produces things like infeasibility certificates, right? When you come back and you go, can't do it, can't design it. Someone says, why not?","start":3508.25,"end":3536.45},{"id":207,"text":"You go, no one can. And they go, well, you can't, but I'll fire you and your group, and I'll get a new one, and they will be able to, maybe. And you go, no, because I can actually easily prove that no one can do it. Everybody follow me? That's a certificate of infeasibility. So that's cool. I mean, if you care about the worst-case complexity theory, then there is one, right? So that's fine.","start":3536.9,"end":3559.66},{"id":208,"text":"The practical ones are actually, I think, much more interesting, right? So, you know, basically, if a problem is convex, you can solve it, right? I am aware of no situation where a problem, someone proposed a convex problem.","start":3560.96,"end":3577.3},{"id":209,"text":"you know, that they couldn't end up, you know, not all of them are going to work with CVXPy, right? But people in machine learning, they were like, excuse me, I have a billion samples. So, and by the way, 100 million parameters. So it's not working, right? People figure it out. In that case, you use these other, you know, methods like subgradient methods or something like that, right? You know, people for images do, and you can do a lot of that stuff too. It's all fine.","start":3578.17,"end":3604.69},{"id":210,"text":"So, anyway, so this is the basic idea. But for normal size problems, I mean, if you're not doing images or giant things or handling video or something like that, then you're within striking distance of these kind of easy to use tools, right? So the...","start":3606.74,"end":3627.8},{"id":211,"text":"The implications of things like CVXPy are immense, right? And actually, I can tell you specifically why you should be extremely grateful that you're taking this in a post-CVX, CVXPy world. Because I'll tell you how it worked before that. Here's the way it worked. I'd go into my office. There'd be some grad students there.","start":3628.83,"end":3646.45},{"id":212,"text":"And I'd say, I've got this unbelievably good idea. Here's how we're going to do it. We're going to solve this convex problem, and it's going to work really well for some application. And they go, cool. Then here's what would happen. I would go home, have a nice dinner, that kind of thing. Grad students would surround and implement.","start":3646.92,"end":3667.6}],"notes":["本段讲授了凸优化中可行性证书的概念，即当问题不可行时，可以通过数学证明来证明其不可行性，从而提供一个证书。这种证书在最坏情况复杂度理论中具有重要意义。","讲者提到，虽然凸问题在理论上可以被求解，但在实际应用中，如机器学习中处理大规模数据时，可能需要使用其他方法，如次梯度方法，因为CVXPy等工具可能无法处理如此大的规模。","讲者强调了CVXPy等工具在现代凸优化中的重要性，指出它们极大地简化了凸问题的求解过程，使得学生和研究人员能够更高效地进行研究和应用。","讲者通过一个办公室场景的例子，说明了在CVXPy出现之前，解决凸问题需要研究生团队的大量工作，而现在这些工具使得问题求解变得更加容易。","讲者还提到，对于常规规模的问题，使用这些工具可以接近于直接求解，这表明了凸优化在实际应用中的广泛适用性。","讲者通过实际例子说明了凸优化在机器学习中的应用，如处理大规模数据集和参数，强调了凸优化方法在实际问题中的灵活性和实用性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3508.25,"end":3667.6,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3508.25,"text":"on the optimal value of a problem, which is kind of cool, right? In the case of convexity, they become sort of necessary and sufficient. I mean, not quite. There's a little asterisk and there's some constraint qualification, but that's fine. And it's super useful. It allows you to do things like sensitivity analysis. It produces things like infeasibility certificates, right? When you come back and you go, can't do it, can't design it. Someone says, why not?"},{"start":3536.9,"text":"You go, no one can. And they go, well, you can't, but I'll fire you and your group, and I'll get a new one, and they will be able to, maybe. And you go, no, because I can actually easily prove that no one can do it. Everybody follow me? That's a certificate of infeasibility. So that's cool. I mean, if you care about the worst-case complexity theory, then there is one, right? So that's fine."},{"start":3560.96,"text":"The practical ones are actually, I think, much more interesting, right? So, you know, basically, if a problem is convex, you can solve it, right? I am aware of no situation where a problem, someone proposed a convex problem."},{"start":3578.17,"text":"you know, that they couldn't end up, you know, not all of them are going to work with CVXPy, right? But people in machine learning, they were like, excuse me, I have a billion samples. So, and by the way, 100 million parameters. So it's not working, right? People figure it out. In that case, you use these other, you know, methods like subgradient methods or something like that, right? You know, people for images do, and you can do a lot of that stuff too. It's all fine."},{"start":3606.74,"text":"So, anyway, so this is the basic idea. But for normal size problems, I mean, if you're not doing images or giant thi  that. And then it goes up like that."},{"start":3938.76,"text":"Everybody got this, right? And then someone who knows the details would say, well, I know why. Because, okay, when you get up to this amount of thrust, they open these valves and there's some... I'm just making this up. There's some gas that flows over these fourth turbines. I don't know. I'm just... Anyway, but it would look like that, right? This would be the... This you got from a simulator. Everybody following this? Okay. Any... What would you do now? And now we're in full street fighting mode. What would you do? Well, first thing you do is you'd say..."},{"start":3968.26,"text":"It's not convex. Okay? I want a suggestion. Yeah, get a convex surrogate. Want me to make one for you? Okay, here's my convex surrogate. Ready? You just kind of go like that or something. It's fine. Okay? Now you solve the problem quickly. This, you can even fit this either by eyeball. If it's in one dimension, you do it by eyeball. And then you just solve it with this thing. It's fine. Right?"},{"start":3996.83,"text":"So everybody following this? So I'm just saying that, you know, that's not now. Not until you get your actual stamp certificate saying that you are, you know, you're now no longer a trainee or something. But when you get that certificate, you will you'll be allowed to. So don't do this for the next 10 days. But after that, you have license to do stuff like this. Right. So, OK. Everybody following this? So, OK."}],"speech_gaps":[],"frame":"../frames/v018/024.webp","frame_time":3856.73},{"title":"课程后续内容与相关课程介绍","segments":[{"id":227,"text":"So there's a whole lot of stuff we didn't cover. And that's actually something I want to talk about, about what's next. So we didn't talk about this whole area of subgradient methods, stochastic subgradient methods. And you've probably seen this in a machine learning course or statistics course, I would imagine. And absolutely fascinating. So a lot of stuff there. Actually  person's gonna develop sepsis there. There we go Okay, so you have a bunch of data. You have a bunch of data. You have a bunch of data Yeah, obvious thing to do is I'd say could I could I please have all your data? So I would collect all your data","start":4141.94,"end":4168.78},{"id":233,"text":"and then fit a model, right? In distributed, the way it works in distributed convex options is very cool. It works like this. I don't get your data. I don't get your data. I don't get your data. But I coordinate you. So I'd say, you fit a logistic model on your own data. Everybody got that? Then all you do is you send your models to me.","start":4169.88,"end":4193.62}],"notes":["本段主要介绍了课程后续内容，包括未讲授的子梯度方法和随机子梯度方法，这些方法在机器学习和统计学课程中常见。讲者提到这些方法非常有趣，并指出这些内容将在后续课程364B中讲授。","讲者提到364B课程内容丰富，但依赖图不如当前课程线性。当前课程的依赖关系较为线性，而364B课程在掌握子梯度概念后，依赖图会变得更为广泛，涉及更多选择性主题。","364B课程教授的内容对解决大规模问题非常有用，例如图像重建和视频数据处理。这些问题使用CVXPy可能效率低下或无法处理，因此需要学习更有效的简单方法。","讲者提到分布式凸优化是一个有趣的主题，它允许在不集中所有数据的情况下进行模型拟合。例如，在医疗数据场景中，每个医院可以独立拟合模型，然后将结果汇总。","讲者强调分布式凸优化的实现方式，即每个节点在本地数据上拟合模型，然后将模型发送给协调者进行汇总。这种方式避免了数据集中化，提高了效率。","讲者提到在实际应用中，可能需要使用像Torch这样的工具来实现这些方法，但核心思想是学习如何高效处理大规模问题。"],"formulas":[],"uncertainties":["You're sitting on some data. You're sitting on some data and your hospitals and you have some data, too. And you're not I want to fit a model like I don't care a logistic regression model of something, right? Like you know if you know what what's the likelihood this person's gonna develop sepsis there. There we go."],"diagram":"none","start":4024.93,"end":4193.62,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4024.93,"text":"So there's a whole lot of stuff we didn't cover. And that's actually something I want to talk about, about what's next. So we didn't talk about this whole area of subgradient methods, stochastic subgradient methods. And you've probably seen this in a machine learning course or statistics course, I would imagine. And absolutely fascinating. So a lot of function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
