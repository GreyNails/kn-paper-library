<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 18</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">18 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 18 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v018","title":"18 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 18","course":"凸优化","pages":[{"title":"凸优化中的稀疏性约束与L1正则化","segments":[{"id":0,"text":"We'll finish up this last additional topic. It's not an additional topic. You've already seen a bunch of it, but I thought it'd be fun to go into a little bit more detail. And at the end of today's lecture, we'll talk about just summarizing the whole class and what do you do now, where to go from here. So, okay. So jumping back into this.","start":5.2,"end":26.16},{"id":1,"text":"So we're talking about, you know, cardinality constraint, but the cardinality could be applied, for example, to the, let's say, a first difference, in which case you would be doing piecewise constant fitting. And that's kind of obvious. I mean, you take a, you know, a first difference matrix here. So you take a first difference matrix D, and then if DX","start":28.06,"end":48.26},{"id":2,"text":"has a small cardinality, it means you have a small number of jumps in x, right? And you could just do this for the second difference and things like that. If you do second difference, then you get a second difference matrix. And if this matrix multiplied by x is sparse or has cardinality less than k, then this is exactly when x is piecewise linear.","start":49.02,"end":78.2},{"id":3,"text":"Or I guess that's the way people would normally say it. I might say piecewise affine with something like k kinks in the piecewise, those change of slope and stuff like that. So that would be it. So we can handle all these kinds of constraints in this convex cardinality framework.","start":78.91,"end":102.41},{"id":4,"text":"It's wherever you see the cardinality, replace it with a multiple of the one norm. Or just add some L1 regularization to the objective. And then gamma here is a parameter that you use to achieve the desired sparsity.","start":102.89,"end":122.73},{"id":5,"text":"So that's sort of the heuristic. You've seen this a lot. There are some other versions. You're going to see them. They're actually better. That's a weighted L1 norm. And this one, I've heard people call that an asymmetric L1 norm, but I hate that because it's not a norm if it's not symmetric. In other words, you actually would penalize...","start":123.05,"end":145.39},{"id":6,"text":"So that's sort of the heuristic. You've seen this a lot. There are some other versions. You're going to see them. They're actually better. That's a weighted L1 norm. And this one, I've heard people call that an asymmetric L1 norm, but I hate that because it's not a norm if it's not symmetric. In other words, you actually would penalize...","start":146.18,"end":173.14}],"notes":["本段讲解了稀疏性约束在凸优化中的应用，特别是通过差分矩阵来建模分段常数或分段线性函数。第一差分矩阵D的稀疏性意味着x的跳跃次数少，而第二差分矩阵则对应分段线性函数。这些约束可以通过凸框架处理。","讲者提到稀疏性约束的启发式方法，即将稀疏性替换为L1范数，通过引入正则化参数gamma来控制稀疏程度。这种方法在许多领域都有广泛应用。","讲者还提到加权L1范数和不对称L1范数的概念，指出不对称L1范数不是严格意义上的范数，因为它不对称，会以不同的斜率惩罚不同范围的值。","最后，讲者指出稀疏性约束问题通常被替换为一个凸问题，从而更容易求解。这种替换方法是凸优化中的常见技巧，用于处理原本难以求解的非凸问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":173.14,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.2,"text":"We'll finish up this last additional topic. It's not an additional topic. You've already seen a bunch of it, but I thought it'd be fun to go into a little bit more detail. And at the end of today's lecture, we'll talk about just summarizing the whole class and what do you do now, where to go from here. So, okay. So jumping back into this."},{"start":28.06,"text":"So we're talking about, you know, cardinality constraint, but the cardinality could be applied, for example, to the, let's say, a first difference, in which case you would be doing piecewise constant fitting. And that's kind of obvious. I mean, you take a, you know, a first difference matrix here. So you take a first difference matrix D, and then if DX"},{"start":49.02,"text":"has a small cardinality, it means you have a small number of jumps in x, right? And you could just do this for the second difference and things like that. If you do second difference, then you get a second difference matrix. And if this matrix multiplied by x is sparse or has cardinality less than k, then this is exactly when x is piecewise linear."},{"start":78.91,"text":"Or I guess that's the way people would normally say it. I might say piecewise affine with something like k kinks in the piecewise, those change of slope and stuff like that. So that would be it. So we can handle all these kinds of constraints in this convex cardinality framework. Okay, so now we get to the heuristic. You know it already. You've seen it. It's really dumb."},{"start":102.89,"text":"It's wherever you see the cardinality, replace it with a multiple of the one norm. Or just add some L1 regularization to the objective. And then gamma here is a parameter that you use to achieve the desired sparsity."},{"start":123.05,"text":"So that's sort of the heuristic. You've seen this a lot. There are some other versions. You're going to see them. They're actually better. That's a weighted L1 norm. And this one, I've heard people call that an asymmetric L1 norm, but I hate that because it's not a norm if it's not symmetric. In other words, you actually would penalize..."},{"start":146.18,"text":"things being small or less than zero, bigger than zero, with different slopes. By the way, we're going to see later exactly why you might do that. But generally speaking, it's just the L1 norm heuristic. And it's used in a lot of fields. So here's the minimum cardinality problem, and you start with this problem that's hard, and you replace it with this one, which is convex, and so it's easy to solve."}],"speech_gaps":[],"frame":"../frames/v018/001.webp","frame_time":17.2},{"title":"稀疏性约束与模型精调","segments":[{"id":7,"text":"Now, of course, that's just a heuristic. When you solve this problem, you have not solved that problem. This is merely a heuristic, a quite good one, in fact, for solving the top problem. Okay. If you had...","start":173.53,"end":190.19},{"id":8,"text":"cardinality constraint problem. Lots of ways to do that. One way is to literally just replace this with an L1 norm and you have something that looks like this. Or you can make it an L1 regularization. You can actually add this regularization term to the objective. And then you adjust beta and gamma until the cardinality is what you want. These are sort of the most basic ways that people might do this. Something called","start":190.52,"end":219.04},{"id":9,"text":"Polishing is actually super interesting. That's this. What you do is you use an L1 heuristic to guess merely the sparsity pattern of X, if X is the thing.","start":219.47,"end":233.75},{"id":10,"text":"You want sparse, right? So you run an L1 heuristic, adjust gamma until you think there's supposed to be 15 non-zeros or you feel like that's right for you. Then you get 15 non-zeros. What you simply do is you record the locations or the indexes of the non-zero entries. So this is phase one. Then you go back and you resolve the problem with only those as the variables. All the others are now zero.","start":234.25,"end":262.07},{"id":11,"text":"Right, and you remove any regularization if you had that right so that that's called polishing right so this would be very Very commonly done right actually it's interesting. So there is you guys two different people who do statistics is this a good idea when you're doing model fitting and","start":262.72,"end":280.86},{"id":12,"text":"Most of my friends will say, no, no, no, you should never do this in statistics, right? Because the whole point was not only did you do feature selection, but you shrunk also the coefficients, right? And then other people I know, they would say, no, we always do this. So I'm not quite sure. I mean, I think it depends on the application. So an example of where this is always done is when people have gene response data.","start":282.11,"end":309.29},{"id":13,"text":"So you have 20,000 gene expression features, and you're trying to predict something. So first step is you do L1 regularized logistic regression. You find the 22 genes that you believe will give you a good logistic model. Again, if you know what I'm talking about, that's fine. If you don't, that's also probably okay. So you get these 22. You locate those 22. Then you go back and you just fit a logistic regression model with just those 22 genes. Everybody got that? Yeah.","start":309.77,"end":336.56}],"notes":["本段讨论了在稀疏性约束问题中使用L1正则化的方法，以及后续的精调（polishing）过程。首先，通过L1正则化找到稀疏模式，然后通过调整参数得到所需的稀疏度。接着，通过记录非零项的位置，将问题重新建模为仅包含这些变量的子问题，从而进行更精确的拟合。","在精调过程中，通常会移除正则化项，以确保模型的系数能够更准确地拟合数据。然而，这种方法在统计学中存在争议，因为一些统计学家认为这会破坏特征选择和系数收缩的双重目标。","在基因表达数据分析中，这种方法被广泛使用。例如，当有20,000个基因表达特征时，首先使用L1正则化的逻辑回归找到22个关键基因，然后仅使用这些基因进行更精确的模型拟合。","这种精调方法的适用性取决于具体的应用场景。在某些情况下，如基因数据分析，这种方法被证明是有效的，而在其他情况下，可能需要权衡特征选择和系数收缩之间的关系。","在精调过程中，需要确保模型的稀疏性与实际数据的结构相匹配，同时避免因过度简化而导致模型性能下降。","本段还提到，不同统计学家对这种方法的看法存在分歧，这表明在实际应用中需要根据具体问题进行判断和调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":173.53,"end":336.56,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":173.53,"text":"Now, of course, that's just a heuristic. When you solve this problem, you have not solved that problem. This is merely a heuristic, a quite good one, in fact, for solving the top problem. Okay. If you had..."},{"start":190.52,"text":"cardinality constraint problem. Lots of ways to do that. One way is to literally just replace this with an L1 norm and you have something that looks like this. Or you can make it an L1 regularization. You can actually add this regularization term to the objective. And then you adjust beta and gamma until the cardinality is what you want. These are sort of the most basic ways that people might do this. Something called"},{"start":219.47,"text":"Polishing is actually super interesting. That's this. What you do is you use an L1 heuristic to guess merely the sparsity pattern of X, if X is the thing."},{"start":234.25,"text":"You want sparse, right? So you run an L1 heuristic, adjust gamma until you think there's supposed to be 15 non-zeros or you feel like that's right for you. Then you get 15 non-zeros. What you simply do is you record the locations or the indexes of the non-zero entries. So this is phase one. Then you go back and you resolve the problem with only those as the variables. All the others are now zero."},{"start":262.72,"text":"Right, and you remove any regularization if you had that right so that that's called polishing right so this would be very Very commonly done right actually it's interesting. So there is you guys two different people who do statistics is this a good idea when you're doing model fitting and"},{"start":282.11,"text":"Most of my friends will say, no, no, no, you should never do this in statistics, right? Because the whole point was not only did you do feature selection, but you shrunk also the coefficients, right? And then other people I know, they would say, no, we always do this. So I'm not quite sure. I mean, I think it depends on the application. So an example of where this is always done is when people have gene response data."},{"start":309.77,"text":"So you have 20,000 gene expression features, and you're trying to predict something. So first step is you do L1 regularized logistic regression. You find the 22 genes that you believe will give you a good logistic model. Again, if you know what I'm talking about, that's fine. If you don't, that's also probably okay. So you get these 22. You locate those 22. Then you go back and you just fit a logistic regression model with just those 22 genes. Everybody got that? Yeah."}],"speech_gaps":[],"frame":"../frames/v018/002.webp","frame_time":185.53},{"title":"凸优化中的稀疏性与初始化无关性","segments":[{"id":14,"text":"Is the sparsity pattern dependent on the initialization? Would you get a different sparsity pattern? Absolutely not. No, no, no. So there's no such thing as initialization, number one. And number two, if it turns out when you solve that problem, there's not a unique solution, which is entirely possible, then it's possible that you could have different solutions, but they'll all have the same...","start":337.23,"end":362.18},{"id":15,"text":"optimal value, right? But no, that's not an issue, right? If that's an issue, we're in deep, deep trouble, right? Because the general story for convex optimization goes like this. I've done this. I've gone off and give talks about something, and I'll say, that's a convex problem. And they'll just say, we can solve it. And then people will say, how'd you solve it? Did you use like, you know, conjugate gradient? Do you use this? I'd actually literally just say, it's none of your business.","start":362.51,"end":391.13},{"id":16,"text":"Very good at irritating people, right? And then finally they'd say, but you must have used a method. I said, oh, I used a method. I did. You're right. I did. But I'm not saying what it is because it's not relevant. This is a convex problem, right? So what that means is basically, I told them finally, I can think of 50 methods, all of which would work. All of them. So how on, why would, it's like if somebody does least squares and you go, how'd you do it? How'd you do it? Do you use quantum factorization, SVD?","start":392.98,"end":418.7},{"id":17,"text":"conjugate gradients, LSQR. And the answer is like, unless the problem is ginormous and you're under extreme real-time constraints or something like that, it's no one's business. They would always get the same answer. So that's why, and certainly it has nothing to do with the initial condition. So that's just my reaction to that. Okay.","start":419.24,"end":436.2},{"id":18,"text":"Okay, so this is polishing. I mean, it's interesting, and it depends on the application, right? So whether or not you should do polishing. I think in a lot of statistical fitting methods, you should not, because the entire point was to regularize, right? Well, it was two things. It was to do...","start":437.74,"end":455.14},{"id":19,"text":"feature selection, and to regularize. So you shouldn't do this. Many other things, like if you're doing electronic design or mechanical engineering or something, and you want a sparse thing because you don't intend to build a space frame with a million bars, but in fact only 236, then you do do this. Because, you know, once you know which ones are actual bars, then you go back and solve the problem. So, okay. That make sense?","start":455.56,"end":482.85},{"id":20,"text":"So now we're going to give a couple of, so we gave a couple of interpretations as to why this L1 heuristic would work, right? And one that is not bad is this idea that, you know, compared to a square penalty, an absolute value penalty keeps up the pressure to make the thing small all the way up until you get to zero.","start":486.19,"end":507.69}],"notes":["本段讨论了凸优化中稀疏性模式与初始化无关的问题。讲者指出，即使在非唯一解的情况下，所有解的最优值是相同的，因此初始化不会影响最终的稀疏性模式。这表明在凸优化中，只要问题具有唯一解，初始化不会对结果产生影响。","讲者进一步强调了凸优化问题的求解方法的多样性。他指出，对于凸问题，存在多种求解方法，且在大多数情况下，这些方法都能得到相同的结果。因此，具体使用哪种方法并不重要，因为结果不会因方法不同而改变。","讲者提到，是否进行“polishing”（即进一步优化）取决于具体的应用场景。在统计拟合中，通常不需要进行polishing，因为其目的是正则化。而在电子设计或机械工程中，如果需要稀疏解（如构建一个只有少量杆件的空间框架），则需要进行polishing。","讲者还解释了L1正则化为何在某些情况下有效。他指出，与平方惩罚相比，绝对值惩罚在变量接近零时仍能保持对变量的压制，从而促进稀疏性。","讲者通过举例说明了不同应用场景下稀疏性的重要性。例如，在电子设计中，稀疏性可以减少实际构建的复杂度，而在统计拟合中，稀疏性可能与正则化的目标相冲突。","讲者强调了凸优化问题的鲁棒性，即无论使用哪种方法，只要问题本身是凸的，结果都是相同的。这表明凸优化问题在实际应用中具有很高的可靠性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":337.23,"end":507.69,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":337.23,"text":"Is the sparsity pattern dependent on the initialization? Would you get a different sparsity pattern? Absolutely not. No, no, no. So there's no such thing as initialization, number one. And number two, if it turns out when you solve that problem, there's not a unique solution, which is entirely possible, then it's possible that you could have different solutions, but they'll all have the same..."},{"start":362.51,"text":"optimal value, right? But no, that's not an issue, right? If that's an issue, we're in deep, deep trouble, right? Because the general story for convex optimization goes like this. I've done this. I've gone off and give talks about something, and I'll say, that's a convex problem. And they'll just say, we can solve it. And then people will say, how'd you solve it? Did you use like, you know, conjugate gradient? Do you use this? I'd actually literally just say, it's none of your business."},{"start":392.98,"text":"Very good at irritating people, right? And then finally they'd say, but you must have used a method. I said, oh, I used a method. I did. You're right. I did. But I'm not saying what it is because it's not relevant. This is a convex problem, right? So what that means is basically, I told them finally, I can think of 50 methods, all of which would work. All of them. So how on, why would, it's like if somebody does least squares and you go, how'd you do it? How'd you do it? Do you use quantum factorization, SVD?"},{"start":419.24,"text":"conjugate gradients, LSQR. And the answer is like, unless the problem is ginormous and you're under extreme real-time constraints or something like that, it's no one's business. They would always get the same answer. So that's why, and certainly it has nothing to do with the initial condition. So that's just my reaction to that. Okay."},{"start":437.74,"text":"Okay, so this is polishing. I mean, it's interesting, and it depends on the application, right? So whether or not you should do polishing. I think in a lot of statistical fitting methods, you should not, because the entire point was to regularize, right? Well, it was two things. It was to do..."},{"start":455.56,"text":"feature selection, and to regularize. So you shouldn't do this. Many other things, like if you're doing electronic design or mechanical engineering or something, and you want a sparse thing because you don't intend to build a space frame with a million bars, but in fact only 236, then you do do this. Because, you know, once you know which ones are actual bars, then you go back and solve the problem. So, okay. That make sense?"},{"start":486.19,"text":"So now we're going to give a couple of, so we gave a couple of interpretations as to why this L1 heuristic would work, right? And one that is not bad is this idea that, you know, compared to a square penalty, an absolute value penalty keeps up the pressure to make the thing small all the way up until you get to zero."}],"speech_gaps":[],"frame":"../frames/v018/003.webp","frame_time":349.23},{"title":"凸优化中的稀疏性与惩罚函数","segments":[{"id":21,"text":"And by pressure, I mean the derivative is either plus or minus one. Plus one if you're negative, right? Whereas for like a square penalty, once you get small, it doesn't care anymore because the penalty is basically small squared. That's actually, believe it or not, perfectly good explanation for why an L1 norm. And for that matter, any penalty with a kink at zero is going to have this kind of property.","start":508.36,"end":534.44},{"id":22,"text":"In fact, there's a penalty that's very funny. Everyone knows about the Huber penalty, which is a Frankenstein penalty that's quadratic and then transitions to linear. So there's another one, which is L1 for small things and then transitions to quadratic. Everybody picture that? That's going to be a sparsifying regularizer, for example, if you use it as a regularizer. Anyone, you know what it's called?","start":534.94,"end":564.07},{"id":23,"text":"This is kind of cutesy, but I don't care. That's called the Berhew penalty. Sorry. It's Huber-like transp... Anyway, it's stupid. Who cares? Anyway, that's... But the point is that's an example of a sparsifying penalty, right? Okay. All right, so we gave that as an example. I think you've actually already done problems where you have...","start":564.64,"end":585.14},{"id":24,"text":"experienced this sparsification but now we're going to give a couple of other very kind of very cool interpretations right so what one is let let's solve this problem let's let's let's attempt to solve the cardinality of x minimize this subject to x is in a convex set and then all of the x's are between plus and minus all the components of x are between plus and minus r so that that's this thing here right okay so","start":585.31,"end":610.99},{"id":25,"text":"What we're going to do is we're going to write this. We're going to introduce some new variables, zi, and they're going to be Boolean. They're going to be either 0 or 1. And we're going to write the constraint that xi is less than r is this way. And what this means is if zi is 0, it means xi is 0. If zi is 1, we express the idea that it's less than r. So this problem is completely equivalent to that one. So they're identical. Not identical, sorry, equivalent. Of course, they're not identical, they're equivalent.","start":611.52,"end":639.88},{"id":26,"text":"Okay, this one is no easier to solve than this, right? Actually, this one you could pop in to what are called mixed integer linear programming, so a MILP solver. And, you know, if you're lucky, you might get a solution or something like that. Who knows, right? If you're unlucky, you might be waiting an hour or something.","start":640.33,"end":661.23}],"notes":["本段讲解了惩罚函数与稀疏性之间的关系，特别是L1范数和具有拐点的惩罚函数如何影响优化问题的解。通过对比平方惩罚和L1惩罚，说明了为什么L1范数能够产生稀疏解。同时，提到Huber惩罚和Berhew惩罚作为具有不同性质的惩罚函数的例子。","接下来，课程讨论了如何通过引入布尔变量来处理稀疏性问题。通过将原问题转化为包含布尔变量的混合整数线性规划（MILP）问题，展示了如何将稀疏性约束转化为可解的优化问题。这种方法虽然在理论上等价，但在实际求解中可能面临计算复杂度高的问题。","课程还提到，虽然将稀疏性问题转化为MILP问题在理论上是可行的，但实际求解时可能会遇到计算时间过长的问题。因此，需要考虑其他更高效的求解方法，如启发式算法或近似方法。","此外，课程强调了稀疏性在优化问题中的重要性，特别是在正则化方法中。通过引入稀疏性约束，可以有效地减少模型的复杂度，提高模型的泛化能力。","最后，课程指出，虽然将稀疏性问题转化为MILP问题在理论上是可行的，但在实际应用中，由于计算复杂度较高，通常需要采用其他方法，如基于梯度下降的优化算法或近似方法。","综上所述，本段内容主要围绕稀疏性惩罚函数的性质及其在优化问题中的应用展开，强调了如何通过引入布尔变量将稀疏性约束转化为可解的优化问题，并讨论了实际求解中可能遇到的挑战。"],"formulas":[],"uncertainties":[],"diagram":"none","start":508.36,"end":661.23,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":508.36,"text":"And by pressure, I mean the derivative is either plus or minus one. Plus one if you're negative, right? Whereas for like a square penalty, once you get small, it doesn't care anymore because the penalty is basically small squared. That's actually, believe it or not, perfectly good explanation for why an L1 norm. And for that matter, any penalty with a kink at zero is going to have this kind of property."},{"start":534.94,"text":"In fact, there's a penalty that's very funny. Everyone knows about the Huber penalty, which is a Frankenstein penalty that's quadratic and then transitions to linear. So there's another one, which is L1 for small things and then transitions to quadratic. Everybody picture that? That's going to be a sparsifying regularizer, for example, if you use it as a regularizer. Anyone, you know what it's called?"},{"start":564.64,"text":"This is kind of cutesy, but I don't care. That's called the Berhew penalty. Sorry. It's Huber-like transp... Anyway, it's stupid. Who cares? Anyway, that's... But the point is that's an example of a sparsifying penalty, right? Okay. All right, so we gave that as an example. I think you've actually already done problems where you have..."},{"start":585.31,"text":"experienced this sparsification but now we're going to give a couple of other very kind of very cool interpretations right so what one is let let's solve this problem let's let's let's attempt to solve the cardinality of x minimize this subject to x is in a convex set and then all of the x's are between plus and minus all the components of x are between plus and minus r so that that's this thing here right okay so"},{"start":611.52,"text":"What we're going to do is we're going to write this. We're going to introduce some new variables, zi, and they're going to be Boolean. They're going to be either 0 or 1. And we're going to write the constraint that xi is less than r is this way. And what this means is if zi is 0, it means xi is 0. If zi is 1, we express the idea that it's less than r. So this problem is completely equivalent to that one. So they're identical. Not identical, sorry, equivalent. Of course, they're not identical, they're equivalent."},{"start":640.33,"text":"Okay, this one is no easier to solve than this, right? Actually, this one you could pop in to what are called mixed integer linear programming, so a MILP solver. And, you know, if you're lucky, you might get a solution or something like that. Who knows, right? If you're unlucky, you might be waiting an hour or something."}],"speech_gaps":[],"frame":"../frames/v018/004.webp","frame_time":520.36},{"title":"松弛与凸包","segments":[{"id":27,"text":"Okay, so what we're going to do is we're going to relax, which is, you know, that makes perfect sense. What we're going to do is we're going to take these Zs, which are Boolean variables, so 0 and 1. We're going to relax them to this kind of weird quantum mechanical state that can be anywhere between 0 and 1. Right, so that's a relaxation. Now, that gives you this problem here, this top problem. And let's see, let's take a look at it. Oh, good news is that's convex, so that we can solve.","start":662.96,"end":690.89},{"id":28,"text":"That's completely tractable. But if you stare at it carefully, you'll realize that if I divided things out, this is actually the epigraph. The sum of z's here is the epigraph. This is the epigraph representation of the L1 norm of x divided by r. Or just take r equals 1.","start":691.31,"end":715.93},{"id":29,"text":"Literally, it's the relaxation of the original Boolean problem just simply becomes our L1 heuristic. By the way, this L1 norm here thing was, sorry, the L infinity constraint was critical to do this. Without that, the relaxation is nothing. It gives you no information at all, right? This also suggests all sorts of things. If your variables have different ranges or bounds,","start":716.29,"end":745.63},{"id":30,"text":"then you probably shouldn't be doing an L1 heuristic. It should probably be a weighted L1 norm, weighted by the inverse of the bounds or something like that. Okay, now when you solve this problem, I mean, these are the same, they get the same optimal value, you get a lower bound on the optimal value. It's not usually a particularly good one. So this kind of makes sense. Now you can also interpret this in a really cool way.","start":746.4,"end":774.31},{"id":31,"text":"as a convex envelope, which I will explain, right? So if I have any function at all, like here's a function, non-convex, right? Then it's convex envelope. I'll just draw it and then I will write it down. I can write it down in all sorts of very cool ways, right? So there we go. And then I just do this, right? So this thing, that's the so-called convex envelope of the original function, okay? And it makes sense. So lots of ways to say it.","start":774.79,"end":801.82},{"id":32,"text":"It's the largest convex function that is everywhere below your given function.","start":802.36,"end":807.8},{"id":33,"text":"So that's another way to say it.","start":808.48,"end":809.92},{"id":34,"text":"Here's a super compact description of it, which is very cool.","start":810.34,"end":813.48},{"id":35,"text":"It's f star star, right?","start":814.3,"end":816.62},{"id":36,"text":"So it's the conjugate of the conjugate.","start":816.68,"end":820.28},{"id":37,"text":"Remember that the conjugate of any function, convex or not, is convex, right?","start":820.34,"end":826.66},{"id":38,"text":"Now, then when I take the conjugate of that, if the original function had been convex,","start":827.14,"end":831.96},{"id":39,"text":"I would have recovered the initial function but I'm definitely going to get something that is","start":831.96,"end":836.22},{"id":40,"text":"actually you can easily show you're going to get something which is a lower bound on the original","start":836.22,"end":839.5}],"notes":["本段讲解了如何通过松弛布尔变量（0和1）为连续变量（0到1之间）来构建一个凸优化问题。这种松弛方法将原问题转化为一个凸问题，从而可以使用凸优化技术求解。同时，提到这种松弛方法实际上是L1范数的启发式方法，但需要L无穷约束来确保松弛的有效性。","如果变量有不同的范围或边界，使用L1范数可能不是最佳选择，而应考虑加权L1范数，权重由边界决定。此外，松弛后的问题虽然可以求解，但通常只能提供原问题最优值的下界，而不是精确解。","凸包（convex envelope）是原函数的上界，即最大的凸函数，且在所有点上都不超过原函数。这为非凸函数提供了一个凸近似，有助于优化问题的求解。","凸包可以通过双重共轭函数（f**）来表示，即原函数的共轭函数的共轭。对于任何函数，其共轭函数都是凸的，而如果原函数是凸的，那么双重共轭函数将恢复原函数。","在讲解过程中，提到如果原函数是凸的，那么双重共轭函数将恢复原函数，但如果原函数是非凸的，双重共轭函数将提供原函数的一个下界。","这些概念为理解如何通过松弛和凸包技术处理非凸优化问题提供了理论基础，同时也展示了如何将非凸问题转化为凸问题进行求解。"],"formulas":[{"latex":"f^{**}(x) = \\text{conjugate of the conjugate of } f(x)","symbols":"f^{**}(x) 表示函数 f(x) 的双重共轭","explanation":"该公式正确描述了函数的双重共轭，即函数的共轭函数的共轭函数。在数学中，对于任何函数，其双重共轭是其凸包络。因此，该公式可以保留。","evidence":"It's f star star, right? So it's the conjugate of the conjugate."}],"uncertainties":["I would have recovered the initial function but I'm definitely going to get something that is"],"diagram":"none","start":662.96,"end":839.5,"asr_flags":[],"math_clarifications":["在数学中，'凸包络'通常指的是函数的凸包络，而不是直接称为'凸包'。因此，第一个公式中的表述需要修正。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":662.96,"text":"Okay, so what we're going to do is we're going to relax, which is, you know, that makes perfect sense. What we're going to do is we're going to take these Zs, which are Boolean variables, so 0 and 1. We're going to relax them to this kind of weird quantum mechanical state that can be anywhere between 0 and 1. Right, so that's a relaxation. Now, that gives you this problem here, this top problem. And let's see, let's take a look at it. Oh, good news is that's convex, so that we can solve."},{"start":691.31,"text":"That's completely tractable. But if you stare at it carefully, you'll realize that if I divided things out, this is actually the epigraph. The sum of z's here is the epigraph. This is the epigraph representation of the L1 norm of x divided by r. Or just take r equals 1. So this problem, which is..."},{"start":716.29,"text":"Literally, it's the relaxation of the original Boolean problem just simply becomes our L1 heuristic. By the way, this L1 norm here thing was, sorry, the L infinity constraint was critical to do this. Without that, the relaxation is nothing. It gives you no information at all, right? This also suggests all sorts of things. If your variables have different ranges or bounds,"},{"start":746.4,"text":"then you probably shouldn't be doing an L1 heuristic. It should probably be a weighted L1 norm, weighted by the inverse of the bounds or something like that. Okay, now when you solve this problem, I mean, these are the same, they get the same optimal value, you get a lower bound on the optimal value. It's not usually a particularly good one. So this kind of makes sense. Now you can also interpret this in a really cool way."},{"start":774.79,"text":"as a convex envelope, which I will explain, right? So if I have any function at all, like here's a function, non-convex, right? Then it's convex envelope. I'll just draw it and then I will write it down. I can write it down in all sorts of very cool ways, right? So there we go. And then I just do this, right? So this thing, that's the so-called convex envelope of the original function, okay? And it makes sense. So lots of ways to say it."},{"start":802.36,"text":"It's the largest convex function that is everywhere below your given function."},{"start":808.48,"text":"So that's another way to say it."},{"start":810.34,"text":"Here's a super compact description of it, which is very cool."},{"start":814.3,"text":"It's f star star, right?"},{"start":816.68,"text":"So it's the conjugate of the conjugate."},{"start":820.34,"text":"Remember that the conjugate of any function, convex or not, is convex, right?"},{"start":827.14,"text":"Now, then when I take the conjugate of that, if the original function had been convex,"},{"start":831.96,"text":"I would have recovered the initial function but I'm definitely going to get something that is"},{"start":836.22,"text":"actually you can easily show you're going to get something which is a lower bound on the original"}],"speech_gaps":[],"frame":"../frames/v018/005.webp","frame_time":674.96},{"title":"凸函数的凸包与凸包的性质","segments":[{"id":41,"text":"function number one so so f star star is less than f is always true but the other cool part","start":839.5,"end":845.44},{"id":42,"text":"is had it been convex you would have gotten f back right but so that's actually another way","start":845.44,"end":851.12},{"id":43,"text":"to express the envelope which I think is kind of cool um so um and in fact you'll see a lot of","start":851.12,"end":857.78},{"id":44,"text":"of people not even use fnv, but just literally write f star star in papers. That's the convex","start":857.78,"end":863.7},{"id":45,"text":"envelope. So it makes sense. And you can work it out for at least some things. And we can","start":863.7,"end":870.16},{"id":46,"text":"actually work it out for the card function, but restricted to an interval. So I'm going","start":870.16,"end":879.8},{"id":47,"text":"to write down the card function. This is zero. So let's see. It looks like this. Oh no, so","start":879.8,"end":885.6},{"id":48,"text":"So that's filled, and then it looks like that.","start":885.6,"end":887.68},{"id":49,"text":"That's the card function, okay?","start":887.7,"end":889.14},{"id":50,"text":"By the way, what is the convex envelope","start":889.88,"end":891.64},{"id":51,"text":"of just card by itself?","start":891.64,"end":893.36},{"id":52,"text":"It has one, and I'd like to know what it is.","start":893.94,"end":895.98},{"id":53,"text":"Yeah, it's just zero.","start":899.74,"end":900.8},{"id":54,"text":"It's the constant zero.","start":900.92,"end":902.26},{"id":55,"text":"And you go, which, if you think about it,","start":902.74,"end":904.9},{"id":56,"text":"A, it's convex,","start":905.32,"end":906.54},{"id":57,"text":"and B, it's a lower bound on the card function","start":906.96,"end":908.74},{"id":58,"text":"because the card function only has the value zero or one.","start":908.74,"end":910.68},{"id":59,"text":"So, congratulations.","start":911.32,"end":912.04},{"id":60,"text":"It's completely useless.","start":912.14,"end":913.22},{"id":61,"text":"Okay, so, but if we say, no, you know what, but this is, I happen to also know that the variable is between, let's say, minus r, right, and plus r. So the actual function I'm taking the card of looks like this, and it goes up to plus infinity out there. Okay, what is the convex envelope of that function? This is actually very cool. You can get it. And, yeah, what is it?","start":915.13,"end":941.47},{"id":62,"text":"Yeah, so you just draw, you go like this. I mean, literally, you take the epigraph, the epigraph of the whole thing is this thing up here, going up to infinity, plus there's a little needle sticking down here. That's the epigraph. I take the convex hull of the epigraph, that fills in this, and then this is the, this is f star star. So, in this case, where f is card restricted to","start":942.6,"end":970.06},{"id":63,"text":"absolute value less than r. Everybody got this? Actually, it's kind of cool because it suggests all sorts of things. If you knew, if you had other bounds on x that were asymmetric, you would use like an asymmetric thing here. And by the way, it would be a better sparsifier, right? So this is the idea. So actually, you don't have to worry about that. So for example, in the application of regressor selection,","start":970.76,"end":997.34}],"notes":["本段讲授了凸函数的凸包（convex envelope）概念，即对于一个函数，其凸包是所有凸函数中最小的上界。对于非凸函数，其凸包是通过取其上半部分（epigraph）的凸包得到的。在例子中，讲者讨论了card函数（即指示函数）的凸包，指出当变量没有限制时，其凸包是零函数，因为card函数的值域为0或1，而零函数是其下界且凸的。"],"formulas":[],"uncertainties":["card function","f star star","epigraph","convex hull"],"diagram":"none","start":839.5,"end":997.34,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":839.5,"text":"function number one so so f star star is less than f is always true but the other cool part"},{"start":845.44,"text":"is had it been convex you would have gotten f back right but so that's actually another way"},{"start":851.12,"text":"to express the envelope which I think is kind of cool um so um and in fact you'll see a lot of"},{"start":857.78,"text":"of people not even use fnv, but just literally write f star star in papers. That's the convex"},{"start":863.7,"text":"envelope. So it makes sense. And you can work it out for at least some things. And we can"},{"start":870.16,"text":"actually work it out for the card function, but restricted to an interval. So I'm going"},{"start":879.8,"text":"to write down the card function. This is zero. So let's see. It looks like this. Oh no, so"},{"start":885.6,"text":"So that's filled, and then it looks like that."},{"start":887.7,"text":"That's the card function, okay?"},{"start":889.88,"text":"By the way, what is the convex envelope"},{"start":891.64,"text":"of just card by itself?"},{"start":893.94,"text":"It has one, and I'd like to know what it is."},{"start":899.74,"text":"Yeah, it's just zero."},{"start":900.92,"text":"It's the constant zero."},{"start":902.74,"text":"And you go, which, if you think about it,"},{"start":905.32,"text":"A, it's convex,"},{"start":906.96,"text":"and B, it's a lower bound on the card function"},{"start":908.74,"text":"because the card function only has the value zero or one."},{"start":911.32,"text":"So, congratulations."},{"start":912.14,"text":"It's completely useless."},{"start":915.13,"text":"Okay, so, but if we say, no, you know what, but this is, I happen to also know that the variable is between, let's say, minus r, right, and plus r. So the actual function I'm taking the card of looks like this, and it goes up to plus infinity out there. Okay, what is the convex envelope of that function? This is actually very cool. You can get it. And, yeah, what is it?"},{"start":942.6,"text":"Yeah, so you just draw, you go like this. I mean, literally, you take the epigraph, the epigraph of the whole thing is this thing up here, going up to infinity, plus there's a little needle sticking down here. That's the epigraph. I take the convex hull of the epigraph, that fills in this, and then this is the, this is f star star. So, in this case, where f is card restricted to"},{"start":970.76,"text":"absolute value less than r. Everybody got this? Actually, it's kind of cool because it suggests all sorts of things. If you knew, if you had other bounds on x that were asymmetric, you would use like an asymmetric thing here. And by the way, it would be a better sparsifier, right? So this is the idea. So actually, you don't have to worry about that. So for example, in the application of regressor selection,"}],"speech_gaps":[],"frame":"../frames/v018/006.webp","frame_time":851.5},{"title":"特征标准化与L1范数的使用","segments":[{"id":64,"text":"in machine learning and statistics. This is generally not a problem because the data have, I assume, standard practice is to actually standardize the features. So they're all now between reasonable ranges, right? Like, in fact, for that matter, roughly speaking between plus and minus one. And so that justifies the use of an L1 norm. If you, for whatever reason, you did not standardize your features,","start":998.06,"end":1023.46},{"id":65,"text":"then, and you want to do something like lasso, then you should, well, number one, you should not do that. Okay, number one. But if you did do that, you shouldn't be using, you should be using a weird, like, you know, weighted L1 norm or an asymmetric thing or something like that. Okay, everybody following this? So it's, I mean, it's interesting. Okay.","start":1024.37,"end":1044.55},{"id":66,"text":"Yeah, so that's just this. If you knew, for example, that over this convex feasible set, if you calculated what's called the bounding box, which, by the way, I could solve for any problem if I don't mind solving 2n convex problems. I just maximize xi subject to x and c, and then I minimize xi. Those are both convex problems. And I will get the best possible values of L and U.","start":1046.37,"end":1073.91},{"id":67,"text":"If x has a dimension really small, like 10, you should just consider solving it brute force and just solve all 1024 convex problems, right? Then is 20. This is actually interesting right here because it's not going to kill you to solve 40 problems to get the bounds, which is going to give you a better sparsifier than just an L1 norm.","start":1075.56,"end":1101.2},{"id":68,"text":"right so that would be one um what you get though is something really cool it's actually um you you get a function that is that matches it's just what you think it is i'll just draw the picture over here it just says suppose this is between uh what i call this li or something and then this is ui i'll make it asymmetric there's ui right i'll just call it u i doesn't matter then your","start":1101.58,"end":1129.27},{"id":69,"text":"I mean, this is kind of clear, but your convex envelope looks like this, right? And it's this tilted function, right? Actually, which I think people now call the pinball loss, right? Because it has to do with pinball machine. Don't ask. Anyway, fine. It's stuck. I think it's stuck. So, okay. And that's what this is called.","start":1130.44,"end":1156.52}],"notes":["本段主要讨论特征标准化在使用L1范数时的重要性。讲者指出，如果数据未进行标准化，直接使用L1范数可能会导致不合理的模型表现，此时应考虑使用加权L1范数或不对称范数。标准化后的特征通常位于合理范围内，如±1之间，这使得L1范数的使用更加合理。","讲者进一步解释了如何通过计算凸可行集的边界框（bounding box）来确定L和U的值。这可以通过求解两个凸问题来实现：最大化和最小化xi，其中xi是特征的某个分量。这种方法适用于特征维度较小的情况，例如10维，此时可以暴力求解所有可能的凸问题。","讲者提到，即使需要求解多个凸问题，例如40个，也不会对计算造成太大负担，因为这可以提供比单纯使用L1范数更精确的稀疏化效果。这种稀疏化方法通过构造一个倾斜的函数来实现，该函数被称为pinball loss，与pinball机器有关。","讲者强调，这种函数的凸包（convex envelope）具有特定的形状，其倾斜程度取决于所选的上下界L和U。这种函数的构造方法在优化问题中具有实际应用价值，尤其是在需要稀疏解的场景中。","讲者最后指出，这种函数的名称为pinball loss，尽管其名称来源可能与pinball机器有关，但其数学性质和应用价值是明确的。这种函数的构造方法为后续的优化问题提供了新的思路。","讲者通过举例说明了如何通过计算边界框来确定L和U的值，并指出这种方法在特征维度较小时的可行性。这种方法的计算复杂度虽然较高，但其带来的稀疏化效果是值得的。"],"formulas":[],"uncertainties":["the pinball loss"],"diagram":"none","start":998.06,"end":1156.52,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":998.06,"text":"in machine learning and statistics. This is generally not a problem because the data have, I assume, standard practice is to actually standardize the features. So they're all now between reasonable ranges, right? Like, in fact, for that matter, roughly speaking between plus and minus one. And so that justifies the use of an L1 norm. If you, for whatever reason, you did not standardize your featur ."}],"speech_gaps":[],"frame":"../frames/v018/008.webp","frame_time":1169.86},{"title":"稀疏信号重建与稀疏性问题","segments":[{"id":76,"text":"This point, this point was found, maybe not a million, but whatever. This point was found, actually it is a million to one roughly. This point was found by actually checking all 20 choose four sparsity patterns and finding the one that had the best fit, right? So it's not a small number, whatever it is, so that's it. So the idea that you get this close with such a stunning reduction in computation.","start":1324.65,"end":1351.15},{"id":77,"text":"Now, you can't claim that you've actually solved the original cardinality problem, but that's okay. Yes? How do you know for sure that the components that are not zero are the same in both cases? Ah, we don't. Yeah, in fact, they're not, right? Because, let's see, which one are you looking at? I mean, like here. Yeah. Well, A was probably just...","start":1352.53,"end":1380.9},{"id":78,"text":"Chosen randomly so that is that has probability zero of happening of course it is I mean It's it's not necessarily true right if a had you know two columns that were identical Right or if you want to translate it to machine learning and fitting you'd say two features Which are you know either 100% correlated or exactly the same then in fact you get your choice. They might not be the same, right?","start":1381.34,"end":1403.5},{"id":79,"text":"so and i don't think that matters right we're just saying what is this the best you know this","start":1404.88,"end":1409.76},{"id":80,"text":"says you may pick four features right and it says what's the best fit you can get right usually","start":1409.76,"end":1416.28},{"id":81,"text":"there's a unique set of four features that does that but if there's not then i don't think it","start":1416.28,"end":1420.34},{"id":82,"text":"matters it's the same thing i don't know if that made sense didn't totally make sense to me so","start":1420.34,"end":1428.0},{"id":83,"text":" 't think that matters right we're just saying what is this the best you know this"},{"start":1409.76,"text":"says you may pick four features right and it says what's the best fit you can get right usually"},{"start":1416.28,"text":"there's a unique set of four features that does that but if there's not then i don't think it"},{"start":1420.34,"text":"matters it's the same thing i don't know if that made sense didn't totally make sense to me so"},{"start":1428.0,"text":"So, but anyway, it's fine."},{"start":1431.46,"text":"Okay."},{"start":1433.82,"text":"Here's like sparse signal reconstruction, right?"},{"start":1436.5,"text":"So, you know, so these are just the kind of standard things."},{"start":1442.64,"text":"Actually, a lot of people would square this."},{"start":1445.3,"text":"It has no effect."},{"start":1446.38,"text":"It changes, of course, the parametrization with the hyperparameter gamma,"},{"start":1449.46,"text":"but otherwise is the same, right?"},{"start":1451.88,"text":"In fact, those are two scalarizations of what's really a bicriterion problem, right?"},{"start":1457.24,"text":"Right. So and these are these are one got all sorts of names. Here's just a quick example."},{"start":1461.54,"text":"Right. So there's a signal with a, you know, it's got a dimension of a thousand, but there's only 30 non zeros."},{"start":1468.34,"text":"And here's the exact signal. I mean, this is just a simulated example. Right."},{"start":1473.7,"text":"And then I give you 200 random noisy measurements of of these one thousand numbers. Right."},{"start":1480.56,"text":"Right. And, you know, so if you do an L1 reconstruction with, you know, an appropriately chosen gamma, you basically get it like exactly."}],"speech_gaps":[],"frame":"../frames/v018/009.webp","frame_time":1336.65},{"title":"稀疏信号恢复的直观理解","segments":[{"id":97,"text":"Right. So I think, you know, 20 years ago when people were first seeing this, it was this was pretty this is pretty stunning. I mean, nowaday as called L1 Magic was the name for it. So that was, which was, now people don't care. But it is good to every now and then think how crazy this is that this actually kind of works. Okay.","start":1597.15,"end":1626.07},{"id":102,"text":"Just for comparison, that would be the L2 reconstruction. Well, duh, right? If I walk up to you and say, please help me guess 1,000 numbers, I'll give you 300 noisy measurements. What did you think was going to happen? So this sort of fits with that. Okay.","start":1626.81,"end":1643.11},{"id":103,"text":"I'm actually going to skip this because, I don't know, there's kind of fussy things that actually tell you under some circumstances this actually does, with high probability, actually work. I'm going to go on from that. Okay, we'll just go to the next part. Okay, so...","start":1644.33,"end":1669.76}],"notes":["本段通过一个日常场景的比喻，解释了稀疏信号恢复的基本思想。当一个人试图从少量测量数据中估计大量参数时，这通常是一个不合理的任务，但若参数数量远小于测量数量，则问题变得合理。这种情况下，稀疏性假设（即参数中只有少数非零）使得问题变得可解。","讲者通过一个具体的例子说明了稀疏性的重要性：当有1000个参数但只有300个测量值时，问题本身是不合理的，但如果只有30个非零参数，问题就变得有意义。这体现了稀疏信号恢复的核心思想，即利用信号的稀疏性来从少量测量中恢复信号。","讲者提到L1 Magic是早期用于稀疏信号恢复的工具包，这表明稀疏性方法在20年前就已经被提出并应用。尽管现在人们对此已经习以为常，但讲者强调了其背后的数学原理和实际意义。","讲者通过对比L2重建（即最小二乘法）和L1重建（即稀疏重建）来说明两者的不同。L2重建在参数数量远大于测量数量时可能无法有效工作，而L1重建则通过稀疏性假设来解决这一问题。","讲者指出，稀疏信号恢复的关键在于如何选择正确的参数子集，即从1000个参数中选择30个非零参数。这涉及到组合优化问题，即从大量可能的子集选择最合适的子集。","讲者强调了稀疏信号恢复的直观性和实用性，尽管其背后的数学原理较为复杂，但其在实际应用中表现出色，值得深入理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1492.36,"end":1669.76,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1492.36,"text":"Right. So I think, you know, 20 years ago when people were first seeing this, it was this was pretty this is pretty stunning. I mean, nowadays, I think a lot of people have already seen this in undergraduate machine learning classes and they're like, yeah, so what? Like, who cares? But you really should stop and actually reflect on this and think how cool it is. Basically, somebody walks up to you pace y gradient."},{"start":1935.87,"text":"Everybody got this? And you can make those so that they are actually approximately rotation invariant, right? So you don't get the artifacts. I only mention this just, you know, this is the main idea here. This is the crudest possible stencil or approximation of..."},{"start":1953.85,"text":"the space gradient of an image would be its x differences and its y differences, but you could do actually better. Okay, so this, you get something that looks like that with that very crude approximation. You get something that looks like this, and then you end up with something like that. Okay, so we'll look at an example of this, right? So here's what happens is I have, this is probably tomography or something. So this is my original thing in 2D."},{"start":1983.16,"text":"i think it's it's a tomography problem so i calculate line integrals through it right which tell me all that and then i reconstruct it and um if you use like total variation to do this"}],"speech_gaps":[],"frame":"../frames/v018/012.webp","frame_time":1841.39},{"title":"迭代加权L1启发式方法","segments":[{"id":117,"text":"you do like, and this is again a case where you have eight times more variables to predict than measurements. So it's the same as the last one. You just reproduce it like pretty much perfectly. Actually, if you look closely, you'll see that there are weird artifacts, but that would be fixed if you did a fancier version of this approximation. And, you know, again, if you just wanted to compare that, you know, that's what the L2 reconstruction would look like.","start":1996.88,"end":2019.38},{"id":118,"text":"So it's not bad, right? It knows that there were some line integrals that kind of went through the main part of it, came out pretty big. And from that, you would conclude there's something there in the middle, and it's basically a blob. So this is standard. I mean, a lot of people do other stuff now, but these were regularizers that were a lot better than what people had before.","start":2020.18,"end":2044.66},{"id":119,"text":"We're not going to mention a little bit about, just for fun, the idea of an iterated weighted L1 heuristic. And the way that works is this. I start with all the weights 1 here, and I do L1. Then what I do is actually really cool. If xi is 0 here, I set the weight to 1 over epsilon. Epsilon is a small number, and that means it's really high. If x is big,","start":2050.09,"end":2076.87},{"id":120,"text":"I actually reduce the weight below one. So basically what this is doing, this update here, is actually doing triage. It's basically who's going to live and who's not going to live. So if you're small or zero, your weight goes up. And that means you're a prime target for being mapped to zero in the next L1 minimization. If you're big, your weight is reduced, which means that...","start":2077.45,"end":2104.81},{"id":121,"text":"basically, I mean, if I anthropomorphize, that means you've concluded that, you know, whatever x7 is going to be non-zero. And so you reduce the weight. This actually kind of combines polishing there, right? Because polishing is an extreme form of this. Polishing goes like this. Solve the L1 problem. And like, you're zero? Put an infinite weight on you. And that means you're never going to be non-zero, right? You are, you're non-zero? You go, put your weight to zero. Meaning,","start":2105.33,"end":2132.73},{"id":122,"text":"No regularization. And then you resolve. So polishing is an extreme version of this. This is like iterative soft polishing or something weird like that. Okay, so this actually works quite well for a lot of things. Very few people know about this. I don't know why, but it's true that many people don't know about it. And you get a beautiful interpretation by doing something like this, which is very cool, right?","start":2133.21,"end":2161.14}],"notes":["本段讲解了迭代加权L1启发式方法的基本思想，即通过调整权重来优化L1正则化问题。初始权重设为1，然后根据变量的大小调整权重，小或零的变量权重增加，大变量权重减少，从而在后续的L1最小化中更倾向于将小变量映射为零。","讲者提到，这种方法类似于一种“筛选”过程，即对变量进行分类，决定哪些变量应被保留（权重高）或被置零（权重低）。这种机制类似于“软化”过程，其中如果变量为零则赋予无限权重，使其无法被非零化，反之则赋予零权重，表示不进行正则化。","讲者指出，这种方法在实际应用中效果很好，但很少有人知道。他强调，这种加权策略提供了一种直观的解释，有助于理解L1正则化在稀疏性建模中的作用。","讲者还提到，这种加权方法可以视为一种“软化”过程的极端形式，即通过调整权重来逐步优化解的稀疏性，从而在保持模型性能的同时减少过拟合的风险。"],"formulas":[],"uncertainties":["在讲者提到的‘polishing’过程中，是否确实将零变量赋予无限权重，而非零变量赋予零权重，这一点可能存在听不清或理解偏差。"],"diagram":"none","start":1996.88,"end":2161.14,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1996.88,"text":"you do like, and this is again a case where you have eight times more variables to predict than measurements. So it's the same as the last one. You just reproduce it like pretty much perfectly. Actually, if you look closely, you'll see that there are weird artifacts, but that would be fixed if you did a fancier version of this approximation. And, you know, again, if you just wanted to compare that, you know, that's what the L2 reconstruction would look like."},{"start":2020.18,"text":"So it's not bad, right? It knows that there were some line integrals that kind of went through the main part of it, came out pretty big. And from that, you would conclude there's something there in the middle, and it's basically a blob. So this is standard. I mean, a lot of people do other stuff now, but these were regularizers that were a lot better than what people had before."},{"start":2050.09,"text":"We're not going to mention a little bit about, just for fun, the idea of an iterated weighted L1 heuristic. And the way that works is this. I start with all the weights 1 here, and I do L1. Then what I do is actually really cool. If xi is 0 here, I set the weight to 1 over epsilon. Epsilon is a small number, and that means it's really high. If x is big,"},{"start":2077.45,"text":"I actually reduce the weight below one. So basically what this is doing, this update here, is actually doing triage. It's basically who's going to live and who's not going to live. So if you're small or zero, your weight goes up. And that means you're a prime target for being mapped to zero in the next L1 minimization. If you're big, your weight is reduced, which means that..."},{"start":2105.33,"text":"basically, I mean, if I anthropomorphize, that means you've concluded that, you know, whatever x7 is going to be non-zero. And so you reduce the weight. This actually kind of combines polishing there, right? Because polishing is an extreme form of this. Polishing goes like this. Solve the L1 problem. And like, you're zero? Put an infinite weight on you. And that means you're never going to be non-zero, right? You are, you're non-zero? You go, put your weight to zero. Meaning,"},{"start":2133.21,"text":"No regularization. And then you resolve. So polishing is an extreme version of this. This is like iterative soft polishing or something weird like that. Okay, so this actually works quite well for a lot of things. Very few people know about this. I don't know why, but it's true that many people don't know about it. And you get a beautiful interpretation by doing something like this, which is very cool, right?"}],"speech_gaps":[],"frame":"../frames/v018/013.webp","frame_time":2008.88},{"title":"凸优化中的非凸近似与L0范数问题","segments":[{"id":123,"text":"Let's start with the actual card function, which looks like this. There's the card function. And someone comes along and says, well, I know a way. I'm going to use an L1 heuristic. And they go, what's that? And you go, well, instead of your function, I'm going to use this function. How about that? And they go, that's not a very good approximation. And you go, yeah, but it seems to work pretty well.","start":2163.71,"end":2189.17},{"id":124,"text":"So here what you do instead is you write down, you make a non-convex function that looks close to this. I'm going to write down what that function is. It's going to be this. I'm going to make a weird function that goes like this. Actually over here it'll be like minus, I can subtract something and make it epsilon like this. It's going to look like that. And that you would say...","start":2190.59,"end":2218.43},{"id":125,"text":"That's a pretty good, that's a better approximation of this cardinality. Oh, by the way, people do this also with powers, which is kind of cool. So you do the square root. That's another one. You would, here's the real thing. Sorry, this is like that. That's like that. And people would put like a square root here, right? And then they would write extremely annoying papers about, they would say LP approximation with P equals 0.5.","start":2218.91,"end":2242.75},{"id":126,"text":"Which drives me nuts because there's no such thing as an L.5 norm. Oh, even worse, people refer to cardinality as the L0 norm. Has anyone heard that? Don't let that stand. If you are in a social situation and someone says L1 norm, say something like, excuse me, that's not a norm.","start":2243.36,"end":2263.4},{"id":127,"text":"And if they say, oh, that's cool, sorry, I thought we were just like friends here or whatever, just casual. Then you go, fine, but just to check that they know that. If they don't, I mean, if they don't, then I don't know, leave the room or something because it's not, you should not hang out with people like that. It's like people who talk about an over-complete basis. And you're like, what? Anyway, otherwise known as a set of vectors, right? So just, anyway, all right, fine.","start":2265.29,"end":2289.09},{"id":128,"text":"All right, so here, it turns out here you do something, you just linearize this objective at the current point, and then you get exactly this iterated reweighted heuristic. So you can think of it as doing a, people sometimes call that sequential convex optimization. So that's when you have a term, a constraint term, a function that's not convex.","start":2290.65,"end":2317.65}],"notes":["本段主要讨论在凸优化中使用非凸近似方法的问题，特别是关于L0范数的误用。讲者指出，L0范数实际上并不存在，而人们常将其与稀疏性联系起来，这在数学上是不准确的。讲者强调，L1范数是唯一被广泛接受的范数，而L0.5范数等类似概念并不存在。","讲者提到，使用L1范数作为稀疏性近似的方法虽然常见，但其效果可能并不理想。同时，讲者批评了将稀疏性直接称为L0范数的做法，认为这是对数学概念的误用。","讲者还提到，当有人错误地使用L0范数时，应指出其不正确性，并建议在社交场合中纠正这种误解。讲者认为，这种错误的术语使用会影响对数学概念的理解。","此外，讲者还提到，非凸近似方法如L1范数在实际应用中被广泛使用，但其数学基础并不严谨。讲者指出，这些方法虽然在实践中有效，但并不符合严格的数学定义。","讲者进一步指出，使用非凸近似方法时，通常会采用线性化策略，即在当前点对目标函数进行线性化，从而得到迭代加权的启发式方法。这种方法被称为序列凸优化。","最后，讲者强调，非凸函数的处理需要特别小心，因为它们可能无法保证全局最优解。因此，在实际应用中，应谨慎使用这些方法，并理解其局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2163.71,"end":2317.65,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2163.71,"text":"Let's start with the actual card function, which looks like this. There's the card function. And someone comes along and says, well, I know a way. I'm going to use an L1 heuristic. And they go, what's that? And you go, well, instead of your function, I'm going to use this function. How about that? And they go, that's not a very good approximation. And you go, yeah, but it seems to work pretty well."},{"start":2190.59,"text":"So here what you do instead is you write down, you make a non-convex function that looks close to this. I'm going to write down what that function is. It's going to be this. I'm going to make a weird function that goes like this. Actually over here it'll be like minus, I can subtract something and make it epsilon like this. It's going to look like that. And that you would say..."},{"start":2218.91,"text":"That's a pretty good, that's a better approximation of this cardinality. Oh, by the way, people do this also with powers, which is kind of cool. So you do the square root. That's another one. You would, here's the real thing. Sorry, this is like that. That's like that. And people would put like a square root here, right? And then they would write extremely annoying papers about, they would say LP approximation with P equals 0.5."},{"start":2243.36,"text":"Which drives me nuts because there's no such thing as an L.5 norm. Oh, even worse, people refer to cardinality as the L0 norm. Has anyone heard that? Don't let that stand. If you are in a social situation and someone says L1 norm, say something like, excuse me, that's not a norm."},{"start":2265.29,"text":"And if they say, oh, that's cool, sorry, I thought we were just like friends here or whatever, just casual. Then you go, fine, but just to check that they know that. If they don't, I mean, if they don't, then I don't know, leave the room or something because it's not, you should not hang out with people like that. It's like people who talk about an over-complete basis. And you're like, what? Anyway, otherwise known as a set of vectors, right? So just, anyway, all right, fine."},{"start":2290.65,"text":"All right, so here, it turns out here you do something, you just linearize this objective at the current point, and then you get exactly this iterated reweighted heuristic. So you can think of it as doing a, people sometimes call that sequential convex optimization. So that's when you have a term, a constraint term, a function that's not convex."}],"speech_gaps":[],"frame":"../frames/v018/014.webp","frame_time":2175.71},{"title":"凸优化中的启发式方法与稀疏解","segments":[{"id":129,"text":"And what you do is you approximate it by a convex function at each step and solve that problem, right? And this is an example of that. And it works like, you know, this works like quite well. Okay, so that's it. And I'll just show you some quick examples of that. So, I mean, here would be a baby example, right, is we want to find a sparse solution in a polyhedron, right, of a set of linear inequalities, right?","start":2318.49,"end":2345.03},{"id":130,"text":"What we do is we start with the L1 heuristic,","start":2345.94,"end":2348.38},{"id":131,"text":"and yeah, you come back with something","start":2348.44,"end":2350.28},{"id":132,"text":"that has cardinality 44, whatever.","start":2350.28,"end":2352.56},{"id":133,"text":"It doesn't matter, right?","start":2352.66,"end":2353.64},{"id":134,"text":"So if you run this iterated L1 heuristic,","start":2355.72,"end":2360.1},{"id":135,"text":"these are the iterations,","start":2360.28,"end":2361.52},{"id":136,"text":"what you can see is like, I don't know,","start":2361.88,"end":2363.46},{"id":137,"text":"in three, four steps, you've got,","start":2363.5,"end":2365.7},{"id":138,"text":"in four steps, you've got something","start":2365.72,"end":2367.42},{"id":139,"text":"with a cardinality of 36, right?","start":2367.42,"end":2370.22},{"id":140,"text":"By the way, for this problem, for fun,","start":2370.58,"end":2372.14},{"id":141,"text":"we just solved it globally,","start":2372.2,"end":2373.22},{"id":142,"text":"and the global solution is 32.","start":2373.42,"end":2374.74},{"id":143,"text":"By the way, that worked perfectly.","start":2376.12,"end":2377.46},{"id":144,"text":"It was a randomly generated example.","start":2377.56,"end":2378.66},{"id":145,"text":"Because had the global solution been 36,","start":2378.88,"end":2381.0},{"id":146,"text":"this would be misleading, right?","start":2381.58,"end":2383.74},{"id":147,"text":"So this tells you everything.","start":2383.82,"end":2385.02},{"id":148,"text":"This example worked out perfectly","start":2385.36,"end":2386.86},{"id":149,"text":"to say exactly the honest and correct story,","start":2386.86,"end":2389.26},{"id":150,"text":"which is, this is a really good heuristic.","start":2389.48,"end":2392.02},{"id":151,"text":"And if someone says,","start":2392.5,"end":2393.48},{"id":152,"text":"does it always get the global solution?","start":2393.56,"end":2394.8},{"id":153,"text":"The answer is, uh-uh, no, it doesn't.","start":2394.86,"end":2396.38},{"id":154,"text":"And here's a perfectly good example, right?","start":2396.5,"end":2398.76},{"id":155,"text":"So, okay.","start":2398.82,"end":2399.72},{"id":156,"text":"So this is a quick example of that.","start":2401.02,"end":2403.74},{"id":157,"text":"that. So you can use this in all sorts. I mean, once you understand about these methods,","start":2403.74,"end":2408.24},{"id":158,"text":"you can use them in very cool ways, right? Like, so here's a quick example is I have","start":2408.36,"end":2412.6},{"id":159,"text":"an AR model, so an autoregressive model. And what we're going to do is we're going to assume","start":2412.6,"end":2420.0},{"id":160,"text":"that the dynamics of the AR model, right, which is the A and the B, they change, right?","start":2420.5,"end":2425.04},{"id":161,"text":"I mean, this is like a, there's a lot of things for this, right? Where you want to fit a model,","start":2425.32,"end":2429.26},{"id":162,"text":"but it changes over time or something like that and so what you do is actually something pretty","start":2429.26,"end":2434.9},{"id":163,"text":"cool it's a weird idea but here here it is what what you do is you start by actually assuming","start":2435.54,"end":2441.76},{"id":164,"text":"You introduce a number of variables. So if you were just going to AR2 fit, A and B would be constant, and they'd be two variables. And you'd have a bunch of data because you'd have T equals 100 or time steps or a couple hundred, and everything would make sense to fit an AR2 model. But here what you do is someone says, no, no, but my AR2 model is time-varying. And you go, okay, cool. So you actually have a different A and B for each time period. Minor problem with that is you're now hideously overfit.","start":2442.66,"end":2469.8}],"notes":["本段讲授了凸优化中使用启发式方法寻找稀疏解的过程，以一个简单的例子说明了L1启发式方法的使用。讲者提到，通过迭代L1启发式方法，可以在几步内得到一个稀疏解，但该方法并不保证找到全局最优解。","讲者通过一个随机生成的例子说明了启发式方法的性能，指出在该例子中，启发式方法得到了一个接近全局最优解的结果，但强调这种方法并不总是能保证找到全局最优解。","讲者进一步提到，启发式方法可以用于更复杂的场景，例如时间变化的自回归（AR）模型。在这种情况下，模型的参数（A和B）会随时间变化，这会导致模型的复杂度增加，但这种方法可以用于拟合时间变化的模型。","讲者指出，使用时间变化的AR模型时，虽然可以得到更灵活的模型，但也会导致过拟合的问题，因为每个时间点都需要独立的参数估计。","讲者强调，启发式方法虽然在某些情况下表现良好，但其性能依赖于具体问题和数据，不能保证在所有情况下都能找到最优解。","讲者最后指出，启发式方法在实际应用中非常有用，但需要谨慎使用，特别是在需要保证全局最优解的情况下。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2318.49,"end":2469.8,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2318.49,"text":"And what you do is you approximate it by a convex function at each step and solve that problem, right? And this is an example of that. And it works like, you know, this works like quite well. Okay, so that's it. And I'll just show you some quick examples of that. So, I mean, here would be a baby example, right, is we want to find a sparse solution in a polyhedron, right, of a set of linear inequalities, right?"},{"start":2345.94,"text":"What we do is we start with the L1 heuristic,"},{"start":2348.44,"text":"and yeah, you come back with something"},{"start":2350.28,"text":"that has cardinality 44, whatever."},{"start":2352.66,"text":"It doesn't matter, right?"},{"start":2355.72,"text":"So if you run this iterated L1 heuristic,"},{"start":2360.28,"text":"these are the iterations,"},{"start":2361.88,"text":"what you can see is like, I don't know,"},{"start":2363.5,"text":"in three, four steps, you've got,"},{"start":2365.72,"text":"in four steps, you've got something"},{"start":2367.42,"text":"with a cardinality of 36, right?"},{"start":2370.58,"text":"By the way, for this problem, for fun,"},{"start":2372.2,"text":"we just solved it globally,"},{"start":2373.42,"text":"and the global solution is 32."},{"start":2376.12,"text":"By the way, that worked perfectly."},{"start":2377.56,"text":"It was a randomly generated example."},{"start":2378.88,"text":"Because had the global solution been 36,"},{"start":2381.58,"text":"this would be misleading, right?"},{"start":2383.82,"text":"So this tells you everything."},{"start":2385.36,"text":"This example worked out perfectly"},{"start":2386.86,"text":"to say exactly the honest and correct story,"},{"start":2389.48,"text":"which is, this is a really good heuristic."},{"start":2392.5,"text":"And if someone says,"},{"start":2393.56,"text":"does it always get the global solution?"},{"start":2394.86,"text":"The answer is, uh-uh, no, it doesn't."},{"start":2396.5,"text":"And here's a perfectly good example, right?"},{"start":2398.82,"text":"So, okay."},{"start":2401.02,"text":"So this is a quick example of that."},{"start":2403.74,"text":"that. So you can use this in all sorts. I mean, once you understand about these methods,"},{"start":2408.36,"text":"you can use them in very cool ways, right? Like, so here's a quick example is I have"},{"start":2412.6,"text":"an AR model, so an autoregressive model. And what we're going to do is we're going to assume"},{"start":2420.5,"text":"that the dynamics of the AR model, right, which is the A and the B, they change, right?"},{"start":2425.32,"text":"I mean, this is like a, there's a lot of things for this, right? Where you want to fit a model,"},{"start":2429.26,"text":"but it changes over time or something like that and so what you do is actually something pretty"},{"start":2435.54,"text":"cool it's a weird idea but here here it is what what you do is you start by actually assuming"},{"start":2442.66,"text":"You introduce a number of variables. So if you were just going to AR2 fit, A and B would be constant, and they'd be two variables. And you'd have a bunch of data because you'd have T equals 100 or time steps or a couple hundred, and everything would make sense to fit an AR2 model. But here what you do is someone says, no, no, but my AR2 model is time-varying. And you go, okay, cool. So you actually have a different A and B for each time period. Minor problem with that is you're now hideously overfit."}],"speech_gaps":[],"frame":"../frames/v018/015.webp","frame_time":2330.49},{"title":"正则化与稀疏性在AR模型中的应用","segments":[{"id":165,"text":"right? At least two to one, right? Because you've got, so it's not just that you can make, you can match something exactly. So you have to put something that, some prior on A and B, right? You can have lots of priors. I mean, here would be one. A and B are increasing. I just made that up. Here's one. They vary smoothly, meaning the sum of the squares of the differences is small. Everybody got that? So that'd be a smoothly varying AR model, right? Here's another one.","start":2470.34,"end":2499.58},{"id":166,"text":"You have a piecewise constant AR model, meaning A and B are constant for various periods. Then there's some shift, and they assume different values. Everybody got this? But by now, at this point in the class, you have all the tools to do, like, you could do all sorts of crazy stuff with this. Okay? So you do this.","start":2500.58,"end":2520.78},{"id":167,"text":"So this is basically the regularizer, and this is the loss, right? So this is just a traditional square loss or Gaussian, whatever you want. V of T is Gaussian. Okay, so then this is a regularizer, which if you read it, you will understand completely, is a sparsifier for differences, changes in A and B.","start":2521.87,"end":2549.55},{"id":168,"text":"That's a sparsifier for the difference, which is basically saying I want piecewise constant. Okay, so here's a quick example. So here's some data that was generated. Here's A and B. I mean, it doesn't matter. But, you know, actually, since you see A and B, you can see they change at t equals 100 and t equals 200. And, you know, if you look at your eyeball and draw a line here, you can look at that and look at that and your eyeball, your spectral analyzer in your eyeball.","start":2550.17,"end":2575.65},{"id":169,"text":"says something happened, right? And then you can, again, this is hard, but you could pretend, especially after you knew the truth, you could certainly pretend that you'd say, oh yeah, no, I can see that the spectrum is different. In fact, the autocorrelation changes. And then that's for people who have the ability to look at a plot of something and say what the autocorrelation is in their head.","start":2576.24,"end":2601.22},{"id":170,"text":"So there are people like that, right? But anyway, so you can see something happen in the three times. And the question is, how ion is in their head."},{"start":2601.81,"text":"So there are people like that, right? But anyway, so you can see something happen in the three times. And the question is, how would we, from the signal on the left, how would we guess these changing coefficients, right? And here's what happens. If you just do that L1 heuristic."},{"start":2618.89,"text":"you get this dashed line here right and i mean it kind of gets it it's pretty good right i mean you can see things like you know it it kind of got pretty close to where this change was it was pretty good up there and but you see this some weird little little things like that and this is kind of sad that's weird okay if you do this iterated l1 heuristic you get that over there and that's actually like pretty good right that's like that's good like and it's actually it's good i would have"}],"speech_gaps":[],"frame":"../frames/v018/016.webp","frame_time":2482.34},{"title":"矩阵秩的扩展与稀疏性","segments":[{"id":172,"text":"I swear I would have rerun this if it turns out it had nailed the actual times or the amplitudes exactly. I would have rerun it because that would have been sending the wrong message, right? But fortunately, it did not. This is kind of what you want to see. It does a pretty good job of doing this, right? But by the way, for scalar AR2 models, no big deal. Your eyeball can do it. But what if I gave you an econometric time series?","start":2648.45,"end":2676.63},{"id":173,"text":"with 50 numbers, right? The dimension of 50, and I gave it to you monthly for 50 years, and you wanted to do this. Anyway, I guarantee your eyeball could not do it, okay? But you could. That's like six, 10 lines of Python. So I'm just saying, I'm showing you baby examples, but trust me, these are very good. The exact same methods apply to much bigger and much more impressive examples. Okay.","start":2677.29,"end":2705.86},{"id":174,"text":"Last topic is extension of matrices. This is actually very cool. So rank is kind of the natural a
