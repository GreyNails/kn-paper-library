text":"Right. This would have been impossible had this been R50. I mean, you know, not impossible because it would be outside this stuff we do in this class. Right. And so if you do the L1, you know, if you do the L1 heuristic with polishing, you actually get this. Right. This thing. It's actually really cool. Like often you're just dead on. It's like here it's dead on. Well, that's silly. But here you're dead on."},{"start":1295.1,"text":"Here, you're off by one, here you're off by one, right? So it's actually kind of interesting how this works, right? All right, so this is a baby example, but it's just to illustrate this. It's a huge big difference, right? That the approximate difference in computation effort, in this case, I mean, we could have done it more efficiently, but in this case, it's a million to one, right? Because each of..."}],"speech_gaps":[],"frame":"../frames/v018/008.webp","frame_time":1169.86},{"title":"稀疏信号重建与稀疏性问题","segments":[{"id":76,"text":"This point, this point was found, maybe not a million, but whatever. This point was found, actually it is a million to one roughly. This point was found by actually checking all 20 choose four sparsity patterns and finding the one that had the best fit, right? So it's not a small number, whatever it is, so that's it. So the idea that you get this close with such a stunning reduction in computation.","zh":"这个点，这个点被找到了，也许不是一百万，但无论如何。这个点实际上是通过检查所有20选4的稀疏模式，并找到拟合最好的那个而找到的，对吧？所以这个数字并不小，不管它到底是什么，就是这样。所以这个想法，即在计算量大幅减少的情况下，你能够如此接近地得到结果。","start":1324.65,"end":1351.15},{"id":77,"text":"Now, you can't claim that you've actually solved the original cardinality problem, but that's okay. Yes? How do you know for sure that the components that are not zero are the same in both cases? Ah, we don't. Yeah, in fact, they're not, right? Because, let's see, which one are you looking at? I mean, like here. Yeah. Well, A was probably just...","zh":"你现在不能声称你已经真正解决了原始的基数问题，但没关系。对吧？你怎么能确定非零成分在两种情况下是相同的呢？啊，我们不能。事实上，它们并不相同，对吧？让我们看看，你是在看哪一个？我的意思是，比如这里。是的，A可能只是随机选择的，所以当然它发生的概率是零。我意思是，这并不一定成立，对吧？如果A有两列是完全相同的，对吧？或者如果你想把它翻译成机器学习和拟合，你可以说两个特征，它们要么是100%相关，要么完全相同，那么事实上你就会得到你的选择。它们可能并不相同，对吧？","start":1352.53,"end":1380.9},{"id":78,"text":"Chosen randomly so that is that has probability zero of happening of course it is I mean It's it's not necessarily true right if a had you know two columns that were identical Right or if you want to translate it to machine learning and fitting you'd say two features Which are you know either 100% correlated or exactly the same then in fact you get your choice. They might not be the same, right?","zh":"随机选择，使得这种情况发生的概率为零，当然了，这并不一定正确。如果矩阵a的两列完全相同，那么这种情况就会发生。如果你想把它翻译成机器学习和拟合的语境，你可以说两个特征要么是100%相关，要么完全相同，那么实际上你就会得到这种选择。它们可能并不相同，对吧？","start":1381.34,"end":1403.5},{"id":79,"text":"so and i don't think that matters right we're just saying what is this the best you know this","zh":"你说你可以选择四个特征，对吧？然后它说你能得到的最佳拟合是什么，对吧？通常","start":1404.88,"end":1409.76},{"id":80,"text":"says you may pick four features right and it says what's the best fit you can get right usually","zh":"有一个唯一的四个特征集合能做到这一点，但如果不存在这样的集合，我认为这并不重要，它是一样的事情。我不确定这有没有意义，对我来说并没有完全理解。","start":1409.76,"end":1416.28},{"id":81,"text":"there's a unique set of four features that does that but if there's not then i don't think it","zh":"所以，但不管怎样，这没关系。","start":1416.28,"end":1420.34},{"id":82,"text":"matters it's the same thing i don't know if that made sense didn't totally make sense to me so","zh":"这其实是一回事，我不确定这是否讲得清楚，对我来说并没有完全讲清楚。","start":1420.34,"end":1428.0},{"id":83,"text":"So, but anyway, it's fine.","zh":"所以，不管怎样，这也没关系。","start":1428.0,"end":1429.76},{"id":84,"text":"Okay.","zh":"好的。","start":1431.46,"end":1431.86},{"id":85,"text":"Here's like sparse signal reconstruction, right?","zh":"这里就是像稀疏信号重建，对吧？","start":1433.82,"end":1436.44},{"id":86,"text":"So, you know, so these are just the kind of standard things.","zh":"所以，你知道的，这些都是标准的问题。","start":1436.5,"end":1441.78},{"id":87,"text":"Actually, a lot of people would square this.","zh":"实际上，很多人会平方这个。","start":1442.64,"end":1444.84},{"id":88,"text":"It has no effect.","zh":"它没有影响。","start":1445.3,"end":1446.3},{"id":89,"text":"It changes, of course, the parametrization with the hyperparameter gamma,","zh":"当然，它会改变参数化方式，使用超参数 gamma，","start":1446.38,"end":1449.28},{"id":90,"text":"but otherwise is the same, right?","zh":"但除此之外，它是一样的，对吧？","start":1449.46,"end":1451.82},{"id":91,"text":"In fact, those are two scalarizations of what's really a bicriterion problem, right?","zh":"事实上，这些都是一个真正双目标问题的两种标量形式，对吧？","start":1451.88,"end":1457.24},{"id":92,"text":"Right. So and these are these are one got all sorts of names. Here's just a quick example.","zh":"对的。所以这些都有各种名称。这里只是一个快速的例子。","start":1457.24,"end":1461.38},{"id":93,"text":"Right. So there's a signal with a, you know, it's got a dimension of a thousand, but there's only 30 non zeros.","zh":"对的。这里有一个信号，它的维度是1000，但只有30个非零元素。","start":1461.54,"end":1468.22},{"id":94,"text":"And here's the exact signal. I mean, this is just a simulated example. Right.","zh":"这里是精确的信号。我的意思是，这只是一个模拟的例子。对的。","start":1468.34,"end":1472.24},{"id":95,"text":"And then I give you 200 random noisy measurements of of these one thousand numbers. Right.","zh":"然后我给你200个随机的带有噪声的测量值，这些测量值来自于这1000个数字。对的。","start":1473.7,"end":1480.56},{"id":96,"text":"Right. And, you know, so if you do an L1 reconstruction with, you know, an appropriately chosen gamma, you basically get it like exactly.","zh":"对的。所以如果你使用适当的γ值进行L1重建，你基本上可以精确地恢复出这个信号。","start":1480.56,"end":1491.62}],"notes":["本段讨论了稀疏信号重建问题，其中提到通过检查所有可能的稀疏模式（如20选4）来找到最佳拟合的稀疏解。虽然这种方法计算量很大（约百万次），但其效果显著，计算量大幅减少。然而，这种方法并不能保证找到原始稀疏性问题的精确解，因为非零元素可能不一致。","讲者指出，即使在某些情况下（如特征完全相关或相同），选择的非零元素可能不一致，但这种情况并不影响整体方法的有效性。讲者认为，只要找到最佳拟合的稀疏解即可，而不必严格保证非零元素完全一致。","在讨论稀疏性问题时，讲者提到，当存在多个稀疏解时，选择哪一个并不重要，因为目标是找到最佳拟合的稀疏解。这表明稀疏性问题可能有多个解，但只要找到其中一个即可。","讲者还提到，稀疏性问题可以被看作是一个双目标优化问题，即同时最小化稀疏性（如L1范数）和误差（如L2范数）。这种双目标问题可以通过不同的参数化方式（如引入超参数gamma）进行处理。","在具体例子中，讲者提到一个信号具有1000维，但只有30个非零元素。通过200个随机噪声测量，使用L1正则化方法（如Lasso）并选择适当的gamma值，可以恢复出原始信号。","讲者指出，虽然平方操作会改变参数化方式，但不会影响问题的本质。这表明在处理稀疏性问题时，不同的参数化方式可以用于不同的目标，但核心思想是找到最佳稀疏解。"],"formulas":[],"uncertainties":["It's it's not necessarily true right if a had you know two columns that were identical","i don't think that matters right we're just saying what is this the best you know this","i don't think it","i don't know if that made sense didn't totally make sense to me so"],"diagram":"none","start":1324.65,"end":1491.62,"asr_flags":[],"math_clarifications":["L1正则化和L2范数在文本中被提及，但未提供具体的数学公式或定义，因此无法进行数学复核。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":1324.65,"text":"This point, this point was found, maybe not a million, but whatever. This point was found, actually it is a million to one roughly. This point was found by actually checking all 20 choose four sparsity patterns and finding the one that had the best fit, right? So it's not a small number, whatever it is, so that's it. So the idea that you get this close with such a stunning reduction in computation."},{"start":1352.53,"text":"Now, you can't claim that you've actually solved the original cardinality problem, but that's okay. Yes? How do you know for sure that the components that are not zero are the same in both cases? Ah, we don't. Yeah, in fact, they're not, right? Because, let's see, which one are you looking at? I mean, like here. Yeah. Well, A was probably just..."},{"start":1381.34,"text":"Chosen randomly so that is that has probability zero of happening of course it is I mean It's it's not necessarily true right if a had you know two columns that were identical Right or if you want to translate it to machine learning and fitting you'd say two features Which are you know either 100% correlated or exactly the same then in fact you get your choice. They might not be the same, right?"},{"start":1404.88,"text":"so and i don't think that matters right we're just saying what is this the best you know this"},{"start":1409.76,"text":"says you may pick four features right and it says what's the best fit you can get right usually"},{"start":1416.28,"text":"there's a unique set of four features that does that but if there's not then i don't think it"},{"start":1420.34,"text":"matters it's the same thing i don't know if that made sense didn't totally make sense to me so"},{"start":1428.0,"text":"So, but anyway, it's fine."},{"start":1431.46,"text":"Okay."},{"start":1433.82,"text":"Here's like sparse signal reconstruction, right?"},{"start":1436.5,"text":"So, you know, so these are just the kind of standard things."},{"start":1442.64,"text":"Actually, a lot of people would square this."},{"start":1445.3,"text":"It has no effect."},{"start":1446.38,"text":"It changes, of course, the parametrization with the hyperparameter gamma,"},{"start":1449.46,"text":"but otherwise is the same, right?"},{"start":1451.88,"text":"In fact, those are two scalarizations of what's really a bicriterion problem, right?"},{"start":1457.24,"text":"Right. So and these are these are one got all sorts of names. Here's just a quick example."},{"start":1461.54,"text":"Right. So there's a signal with a, you know, it's got a dimension of a thousand, but there's only 30 non zeros."},{"start":1468.34,"text":"And here's the exact signal. I mean, this is just a simulated example. Right."},{"start":1473.7,"text":"And then I give you 200 random noisy measurements of of these one thousand numbers. Right."},{"start":1480.56,"text":"Right. And, you know, so if you do an L1 reconstruction with, you know, an appropriately chosen gamma, you basically get it like exactly."}],"speech_gaps":[],"frame":"../frames/v018/009.webp","frame_time":1336.65},{"title":"稀疏信号恢复的直观理解","segments":[{"id":97,"text":"Right. So I think, you know, 20 years ago when people were first seeing this, it was this was pretty this is pretty stunning. I mean, nowadays, I think a lot of people have already seen this in undergraduate machine learning classes and they're like, yeah, so what? Like, who cares? But you really should stop and actually reflect on this and think how cool it is. Basically, somebody walks up to you on the street and says.","zh":"对的。我想，20年前当人们第一次看到这个的时候，这简直令人震惊。我是说，现在，我觉得很多人已经在本科机器学习课程中见过这个，他们会说，是啊，那又怎样？谁在乎呢？但你真的应该停下来，认真思考一下，想想这有多酷。基本上，有人走上街对你说。","start":1492.36,"end":1516.1},{"id":98,"text":"You go, I have 200 measurements. You're like, oh, I'm sorry, did you say 2,000? Or did you get the two numbers different, right? Do you have 1,000 measurements and something like that and 300 parameters you want to estimate? You go, no, I would like to estimate 1,000 parameters.","zh":"你回答，我有200个测量值。他们会说，哦，抱歉，你是说2000个吗？还是你把两个数字弄混了？你有1000个测量值，还有类似300个参数要估计吗？你回答，不，我想估计1000个参数。","start":1516.84,"end":1541.35},{"id":99,"text":"based on 300 noisy measurements, right? So, I mean, the correct thing to do in a situation like that is to walk away from that person. Maybe not turn your back on them. Just walk away carefully and avoid them from then on, right? It's like someone walks up to the street and says, I'm thinking of four numbers they add to 12. What are they? You should avoid people like this, right? Because it's a nonsensical problem. Okay, fine. But then they say, ah, but there's only 30 and non-zero.","zh":"基于300个有噪声的测量值，对吧？我的意思是，在这种情况下，正确的做法是远离那个人。也许不是背过身去，而是小心地避开他们，对吧？就像有人走上街对你说，我想四个数加起来是12，它们是什么？你应该避开这样的人，对吧？因为这是一个没有意义的问题。好吧，那你说，啊，但只有30个非零的。","start":1542.03,"end":1568.13},{"id":100,"text":"Then you'd say, that sounds like a normal thing to me, right? Because you think of fitting and stuff like that as data compression. And you go, cool. I have 300 noisy measurements to estimate. Is that right? You have 200 noisy measurements to estimate 30 things. That feels right. That's a sensible thing. You'd say, what are you doing? I'm fitting a model. How many parameters in your model? 30. How many measurements you got? 200. Sounds totally cool. OK. But there's a catch.","zh":"然后你会说，这听起来对我来说很正常，对吧？因为你把拟合和类似的数据压缩想在一起。你会说，酷，我有300个有噪声的测量值来估计。对吗？你有200个有噪声的测量值来估计30个东西。这感觉是对的。这是一个合理的问题。你会说，你在做什么？我在拟合一个模型。你的模型有多少参数？30个。你有多少测量值？200个。听起来完全酷。好的。但有一个陷阱。","start":1568.83,"end":1596.41},{"id":101,"text":"no one tells you which 30 of the 1,000 they are, right? And 1,000 choose 30 is a big number. Okay, right. Everybody following this? Okay. So what's amazing is it just kind of works, right? And I think one of the first packages for this, maybe 20 years ago, 25 years ago, was called L1 Magic was the name for it. So that was, which was, now people don't care. But it is good to every now and then think how crazy this is that this actually kind of works. Okay.","zh":"没有人告诉你这1000个中的哪30个，对吧？而1000选30是一个很大的数字。好的，对吧。大家跟上了吗？好的。令人惊讶的是，它竟然能正常工作，对吧？我想，最早的这个方法的包之一，可能20年前，25年前，叫做L1 Magic。所以，现在人们已经不关心了。但时不时地想想，这种东西竟然能正常工作，这真的很疯狂。好的。","start":1597.15,"end":1626.07},{"id":102,"text":"Just for comparison, that would be the L2 reconstruction. Well, duh, right? If I walk up to you and say, please help me guess 1,000 numbers, I'll give you 300 noisy measurements. What did you think was going to happen? So this sort of fits with that. Okay.","zh":"仅仅为了比较，这将是L2重建。嗯，对吧？如果我走到你面前说，请帮我猜1000个数字，我会给你300个带有噪声的测量值。你觉得会发生什么？所以这在某种程度上是符合这种情况的。好的。","start":1626.81,"end":1643.11},{"id":103,"text":"I'm actually going to skip this because, I don't know, there's kind of fussy things that actually tell you under some circumstances this actually does, with high probability, actually work. I'm going to go on from that. Okay, we'll just go to the next part. Okay, so...","zh":"我实际上会跳过这部分，因为我不确定，有些细节实际上告诉你在某些情况下，这种方法实际上以很高的概率确实有效。我会从那里继续下去。好的，我们直接进入下一部分。好的，所以……","start":1644.33,"end":1669.76}],"notes":["本段通过一个日常场景的比喻，解释了稀疏信号恢复的基本思想。当一个人试图从少量测量数据中估计大量参数时，这通常是一个不合理的任务，但若参数数量远小于测量数量，则问题变得合理。这种情况下，稀疏性假设（即参数中只有少数非零）使得问题变得可解。","讲者通过一个具体的例子说明了稀疏性的重要性：当有1000个参数但只有300个测量值时，问题本身是不合理的，但如果只有30个非零参数，问题就变得有意义。这体现了稀疏信号恢复的核心思想，即利用信号的稀疏性来从少量测量中恢复信号。","讲者提到L1 Magic是早期用于稀疏信号恢复的工具包，这表明稀疏性方法在20年前就已经被提出并应用。尽管现在人们对此已经习以为常，但讲者强调了其背后的数学原理和实际意义。","讲者通过对比L2重建（即最小二乘法）和L1重建（即稀疏重建）来说明两者的不同。L2重建在参数数量远大于测量数量时可能无法有效工作，而L1重建则通过稀疏性假设来解决这一问题。","讲者指出，稀疏信号恢复的关键在于如何选择正确的参数子集，即从1000个参数中选择30个非零参数。这涉及到组合优化问题，即从大量可能的子集选择最合适的子集。","讲者强调了稀疏信号恢复的直观性和实用性，尽管其背后的数学原理较为复杂，但其在实际应用中表现出色，值得深入理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1492.36,"end":1669.76,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1492.36,"text":"Right. So I think, you know, 20 years ago when people were first seeing this, it was this was pretty this is pretty stunning. I mean, nowadays, I think a lot of people have already seen this in undergraduate machine learning classes and they're like, yeah, so what? Like, who cares? But you really should stop and actually reflect on this and think how cool it is. Basically, somebody walks up to you on the street and says."},{"start":1516.84,"text":"I have 1,000 numbers I'd like to help you figure out. You go, cool, I'll be happy to help. You tell me what measurements you have. You go, I have 200 measurements. You're like, oh, I'm sorry, did you say 2,000? Or did you get the two numbers different, right? Do you have 1,000 measurements and something like that and 300 parameters you want to estimate? You go, no, I would like to estimate 1,000 parameters."},{"start":1542.03,"text":"based on 300 noisy measurements, right? So, I mean, the correct thing to do in a situation like that is to walk away from that person. Maybe not turn your back on them. Just walk away carefully and avoid them from then on, right? It's like someone walks up to the street and says, I'm thinking of four numbers they add to 12. What are they? You should avoid people like this, right? Because it's a nonsensical problem. Okay, fine. But then they say, ah, but there's only 30 and non-zero."},{"start":1568.83,"text":"Then you'd say, that sounds like a normal thing to me, right? Because you think of fitting and stuff like that as data compression. And you go, cool. I have 300 noisy measurements to estimate. Is that right? You have 200 noisy measurements to estimate 30 things. That feels right. That's a sensible thing. You'd say, what are you doing? I'm fitting a model. How many parameters in your model? 30. How many measurements you got? 200. Sounds totally cool. OK. But there's a catch."},{"start":1597.15,"text":"no one tells you which 30 of the 1,000 they are, right? And 1,000 choose 30 is a big number. Okay, right. Everybody following this? Okay. So what's amazing is it just kind of works, right? And I think one of the first packages for this, maybe 20 years ago, 25 years ago, was called L1 Magic was the name for it. So that was, which was, now people don't care. But it is good to every now and then think how crazy this is that this actually kind of works. Okay."},{"start":1626.81,"text":"Just for comparison, that would be the L2 reconstruction. Well, duh, right? If I walk up to you and say, please help me guess 1,000 numbers, I'll give you 300 noisy measurements. What did you think was going to happen? So this sort of fits with that. Okay."},{"start":1644.33,"text":"I'm actually going to skip this because, I don't know, there's kind of fussy things that actually tell you under some circumstances this actually does, with high probability, actually work. I'm going to go on from that. Okay, we'll just go to the next part. Okay, so..."}],"speech_gaps":[],"frame":"../frames/v018/010.webp","frame_time":1504.36},{"title":"总变分去噪与应用实例","segments":[{"id":104,"text":"We'll look at a couple more examples that are pretty cool. So you could do the same kind of thing. We did total variation for a scalar signal, right? So the total variation is essentially the L1 norm of the derivative. That's rough, but that's what it is.","zh":"我们将再看几个非常酷的例子。你也可以做类似的事情。我们之前对一个标量信号进行了总变分去噪，对吧？总变分本质上就是导数的L1范数。这听起来有点粗糙，但这就是它的定义。","start":1670.26,"end":1685.76},{"id":105,"text":"right it tells you how much you know it well okay that's what it is let's just leave it that way right um and the convex cardinality you know thing you can do exact i mean that that's called the total variation you do the same thing um and you know we actually saw an example i think you know here's an example where you know the top is some original signal which has got smooth parts but also these big jumps","zh":"对，它告诉你你了解得有多好，对吧？这就是它的定义，我们就这样留着吧。关于凸基数的那件事，你可以说它是精确的，我意思是，这被称为总变分，你做同样的事情。嗯，我们实际上看到过一个例子，我想，这里有一个例子，你知道，顶部是某个原始信号，它包含平滑的部分，但也有一些大的跳跃。","start":1686.22,"end":1708.5},{"id":106,"text":"The corrupted version is below. And then when you denoise it, you get things like this using L1 reconstruction, right? You could, I don't know, you could sort of decide which value is right, which you could do by some kind of cross-validation or something. But, you know, this is, roughly speaking, this looks like it's over-regularized. That looks like maybe it's under-regularized. And you might say that that's about right, or maybe somewhere even in between these two might be about right.","zh":"被损坏的版本在下面。然后当你进行去噪时，你可以使用L1重建得到类似这样的结果，对吧？你可以，我不知道，你可以某种程度上决定哪个值是正确的，这可以通过某种交叉验证等方式来实现。但你知道，总的来说，这看起来像是过度正则化了。那看起来像是可能欠正则化了。你可能会说这大约是对的，或者可能在两者之间的某个地方才是对的。","start":1710.82,"end":1737.96},{"id":107,"text":"Um, okay. And so this is, this is used in, actually there was a famous incident in the nineties. I think this, this was used to reconstruct, um, actually a lot of old wax recordings of like Caruso, the opera singer. They would have these wax, wax drums, you know, all scratched up and things like that. And to extract what, what something based on the total variation denoising would do would actually remove a lot of the noise.","zh":"嗯，好的。所以，这实际上被用于，实际上在九十年代有一个著名的事件。我想，这被用来重建，嗯，实际上很多老的蜡制唱片，比如卡鲁索的歌剧演唱。他们会有这些蜡制的鼓，你知道的，全都刮花了，各种各样的情况。而基于总变分去噪所做的事情实际上会去除很多噪声。","start":1739.94,"end":1768.68},{"id":108,"text":"but actually preserve these sharp attacks, right? Because otherwise, if you did kind of some of the L2 version of it, it's just a low-pass filter. I'm now speaking dialect, but sorry. And so basically, it would just come out muffled. Good news, noise is substantially reduced. Bad news, so is the actual content, right? But when you do total variation, you get something that's actually kind of cool, the attack of a drum beat when somebody leans into a snare drum.","zh":"但实际上保留这些尖锐的打击声，对吧？否则，如果你使用它的一些L2版本，它只是一个低通滤波器。我现在说的是方言，但抱歉。因此，基本上，它会变得模糊。好消息是噪声被大幅减少。坏消息是实际内容也被减少了，对吧？但当你进行总变分去噪时，你会得到一些真正酷的东西，比如当有人敲击军鼓时的鼓点攻击。","start":1769.39,"end":1796.27},{"id":109,"text":"it's right there right so anyway that was in the 90s i think which is kind of cool so okay um i would skip this because we i think we saw that one more example um but this is in 2d right so and even this is a simplification right so and i'll i will make a comment about this uh a bit later right so so in in let's say that i have an an image like i'm oh let's say i'm doing mri reconstruction right and so i have all these values here","zh":"它就在那里，对吧，所以不管怎样，这应该是在90年代左右，我觉得这有点酷。嗯，我想跳过这个，因为我们可能已经看过一个类似的例子了。不过这个是二维的，对吧。而且这本身也是一个简化的情况。对了，我稍后会对此做一点评论。比如说，我有一张图像，比如我正在做MRI重建，所以这里有很多值。","start":1796.78,"end":1827.84}],"notes":["本段讲解了总变分（Total Variation）在信号去噪中的应用，强调了其与L1范数的关系。总变分用于衡量信号的平滑程度，通过最小化总变分可以去除噪声，同时保留信号中的尖锐特征，如鼓点的攻击部分。"],"formulas":[],"uncertainties":["total variation is essentially the L1 norm of the derivative"],"diagram":"none","start":1670.26,"end":1827.84,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1670.26,"text":"We'll look at a couple more examples that are pretty cool. So you could do the same kind of thing. We did total variation for a scalar signal, right? So the total variation is essentially the L1 norm of the derivative. That's rough, but that's what it is."},{"start":1686.22,"text":"right it tells you how much you know it well okay that's what it is let's just leave it that way right um and the convex cardinality you know thing you can do exact i mean that that's called the total variation you do the same thing um and you know we actually saw an example i think you know here's an example where you know the top is some original signal which has got smooth parts but also these big jumps"},{"start":1710.82,"text":"The corrupted version is below. And then when you denoise it, you get things like this using L1 reconstruction, right? You could, I don't know, you could sort of decide which value is right, which you could do by some kind of cross-validation or something. But, you know, this is, roughly speaking, this looks like it's over-regularized. That looks like maybe it's under-regularized. And you might say that that's about right, or maybe somewhere even in between these two might be about right."},{"start":1739.94,"text":"Um, okay. And so this is, this is used in, actually there was a famous incident in the nineties. I think this, this was used to reconstruct, um, actually a lot of old wax recordings of like Caruso, the opera singer. They would have these wax, wax drums, you know, all scratched up and things like that. And to extract what, what something based on the total variation denoising would do would actually remove a lot of the noise."},{"start":1769.39,"text":"but actually preserve these sharp attacks, right? Because otherwise, if you did kind of some of the L2 version of it, it's just a low-pass filter. I'm now speaking dialect, but sorry. And so basically, it would just come out muffled. Good news, noise is substantially reduced. Bad news, so is the actual content, right? But when you do total variation, you get something that's actually kind of cool, the attack of a drum beat when somebody leans into a snare drum."},{"start":1796.78,"text":"it's right there right so anyway that was in the 90s i think which is kind of cool so okay um i would skip this because we i think we saw that one more example um but this is in 2d right so and even this is a simplification right so and i'll i will make a comment about this uh a bit later right so so in in let's say that i have an an image like i'm oh let's say i'm doing mri reconstruction right and so i have all these values here"}],"speech_gaps":[],"frame":"../frames/v018/011.webp","frame_time":1682.26},{"title":"总变分与梯度估计","segments":[{"id":110,"text":"And a good, so here the total variation, it's actually given by, I mean, in the continuous version, it's actually this, right? It's f of, here, I can call this, yeah, I'll do this. It's this. There you go. That is what the total variation is.","zh":"而且很好，所以这里的总变分，实际上是给定的，我的意思是，在连续版本中，它实际上是这个，对吧？它是f的，这里我可以称之为这个，是的，我会这么做。它是这个。好了，这就是总变分。","start":1829.39,"end":1851.89},{"id":111,"text":"when you do this in the infinite dimensional case, right? Very important here, this is not squared. So as a matter of fact, there's a weird thing when you show this to someone, it's sort of like if you show someone the, the, they just don't even see it often. So many people when shown this, their retina, I don't even know where it happens in the optical cortex, but a two appears here.","zh":"当你在无限维情况下进行这个操作时，对吧？这里非常关键，这个并不是平方的。事实上，当你向别人展示这个时，会出现一些奇怪的情况，就像是你向别人展示某个东西，他们往往根本看不到。很多人被展示这个时，他们的视网膜，我不知道它在光学皮层的哪个位置发生，但这里会出现一个二。","start":1854.21,"end":1878.99},{"id":112,"text":"And then you have to go, so you have to actually emphasize this when you show this to people because they're like, yeah, yeah, sure, sure. Then they go to the next one and something paints in a two here, right? Just because that's the traditional thing. You don't paint it in here. So that's total variation. Okay, so simple version of that here is to estimate this, we make a two vector, which is sort of, you know, the X gradient is just the difference here and the Y gradient is this.","zh":"然后你必须去强调这一点，当你向人们展示这个时，因为他们会说，是的，是的，当然，当然。然后他们转到下一个，就在那里画一个二，对吧？仅仅因为这是传统做法。你不要在这里画它。所以这就是总变分。好的，这里的一个简单版本是来估计这个，我们做一个二向量，它有点像，你知道的，X梯度只是这里的差值，而Y梯度是这个。","start":1879.87,"end":1909.18},{"id":113,"text":"Right? Turns out that's actually not the way to do it. You get artifacts that align with the axes, and there's actually way cooler ways to estimate the gradient based on, well, I don't know, if you study PDEs or something. You get a little template, and you make a gradient here that depends on, like, you know, these things. I think they call that a stencil or something. And there's some coefficients in there to map those five values to two gradient numbers. This is the space x gradient and the space y gradient.","zh":"对吧？结果发现这实际上并不是正确的方法。你会得到与坐标轴对齐的伪影，实际上有更酷的方式来估计梯度，基于，嗯，如果你研究过偏微分方程的话。你会得到一个小模板，然后在这里做一个梯度，它依赖于，比如，这些东西。我想他们称之为模板或者类似的东西。并且这里有一些系数，将这五个值映射到两个梯度数值。这是空间x梯度和空间y梯度。","start":1910.27,"end":1935.37},{"id":114,"text":"Everybody got this? And you can make those so that they are actually approximately rotation invariant, right? So you don't get the artifacts. I only mention this just, you know, this is the main idea here. This is the crudest possible stencil or approximation of...","zh":"大家都明白了吗？你可以让这些模板实际上近似旋转不变，对吧？这样你就不会得到伪影。我只提到这一点，你知道的，这是这里的主思想。这是最粗略的模板或近似方法。","start":1935.87,"end":1953.49},{"id":115,"text":"the space gradient of an image would be its x differences and its y differences, but you could do actually better. Okay, so this, you get something that looks like that with that very crude approximation. You get something that looks like this, and then you end up with something like that. Okay, so we'll look at an example of this, right? So here's what happens is I have, this is probably tomography or something. So this is my original thing in 2D.","zh":"图像的梯度空间就是它的x方向差分和y方向差分，但你实际上可以做得更好。好的，这样你会得到看起来像那样的非常粗糙的近似。你会得到看起来像这样的结果，然后最终得到像那样的结果。好的，我们将来看一个这样的例子，对吧？所以这里发生的情况是，这可能是断层扫描或者类似的问题。这是我在二维空间中的原始图像。","start":1953.85,"end":1981.92},{"id":116,"text":"i think it's it's a tomography problem so i calculate line integrals through it right which tell me all that and then i reconstruct it and um if you use like total variation to do this","zh":"我想这应该是一个断层扫描问题，所以我计算穿过它的线积分，这会告诉我所有这些信息，然后我进行重建，如果你使用总变分来做这个的话","start":1983.16,"end":1995.18}],"notes":["本段讲解了总变分（Total Variation）在连续情况下的定义，强调了其在无限维空间中的重要性，并指出总变分不是平方形式。讲者提到，当展示这个概念时，人们往往难以理解，特别是关于数字2的出现，这可能与视觉感知有关。","讲者进一步说明，当向他人展示总变分时，需要特别强调，因为人们容易忽略其中的关键点。讲者指出，传统做法中会使用数字2，但实际应用中不应如此。这表明总变分的计算需要更精确的梯度估计方法。","讲者提到，简单的梯度估计方法（如使用差分）会导致与坐标轴对齐的伪影，因此需要更高级的估计方法。这些方法可能基于偏微分方程（PDE）的知识，使用模板（stencil）来计算梯度，其中包含系数以将五个值映射为两个梯度数。","讲者指出，可以通过设计模板使其近似旋转不变，从而避免伪影。这表明在图像处理中，总变分的梯度估计需要考虑旋转不变性，以提高估计的鲁棒性。","讲者提到，图像的梯度可以表示为x方向和y方向的差分，但可以做得更好。这表明总变分的梯度估计方法可以进一步优化，以获得更准确的结果。","最后，讲者提到一个例子，涉及断层扫描（tomography）问题，通过计算线积分并使用总变分进行重建。这表明总变分在图像重建中的应用，特别是在处理噪声或伪影时具有优势。"],"formulas":[],"uncertainties":["the two appears here","a two here","a two vector","a stencil or something","those five values to two gradient numbers"],"diagram":"none","start":1829.39,"end":1995.18,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1829.39,"text":"And a good, so here the total variation, it's actually given by, I mean, in the continuous version, it's actually this, right? It's f of, here, I can call this, yeah, I'll do this. It's this. There you go. That is what the total variation is."},{"start":1854.21,"text":"when you do this in the infinite dimensional case, right? Very important here, this is not squared. So as a matter of fact, there's a weird thing when you show this to someone, it's sort of like if you show someone the, the, they just don't even see it often. So many people when shown this, their retina, I don't even know where it happens in the optical cortex, but a two appears here."},{"start":1879.87,"text":"And then you have to go, so you have to actually emphasize this when you show this to people because they're like, yeah, yeah, sure, sure. Then they go to the next one and something paints in a two here, right? Just because that's the traditional thing. You don't paint it in here. So that's total variation. Okay, so simple version of that here is to estimate this, we make a two vector, which is sort of, you know, the X gradient is just the difference here and the Y gradient is this."},{"start":1910.27,"text":"Right? Turns out that's actually not the way to do it. You get artifacts that align with the axes, and there's actually way cooler ways to estimate the gradient based on, well, I don't know, if you study PDEs or something. You get a little template, and you make a gradient here that depends on, like, you know, these things. I think they call that a stencil or something. And there's some coefficients in there to map those five values to two gradient numbers. This is the space x gradient and the space y gradient."},{"start":1935.87,"text":"Everybody got this? And you can make those so that they are actually approximately rotation invariant, right? So you don't get the artifacts. I only mention this just, you know, this is the main idea here. This is the crudest possible stencil or approximation of..."},{"start":1953.85,"text":"the space gradient of an image would be its x differences and its y differences, but you could do actually better. Okay, so this, you get something that looks like that with that very crude approximation. You get something that looks like this, and then you end up with something like that. Okay, so we'll look at an example of this, right? So here's what happens is I have, this is probably tomography or something. So this is my original thing in 2D."},{"start":1983.16,"text":"i think it's it's a tomography problem so i calculate line integrals through it right which tell me all that and then i reconstruct it and um if you use like total variation to do this"}],"speech_gaps":[],"frame":"../frames/v018/012.webp","frame_time":1841.39},{"title":"迭代加权L1启发式方法","segments":[{"id":117,"text":"you do like, and this is again a case where you have eight times more variables to predict than measurements. So it's the same as the last one. You just reproduce it like pretty much perfectly. Actually, if you look closely, you'll see that there are weird artifacts, but that would be fixed if you did a fancier version of this approximation. And, you know, again, if you just wanted to compare that, you know, that's what the L2 reconstruction would look like.","zh":"你可能会喜欢，这又是一个你有八倍更多变量需要预测，而测量值却更少的情况。所以它和上一个例子是一样的。你几乎可以完美地重现它。实际上，如果你仔细观察，你会发现一些奇怪的伪影，但如果使用更高级的这种近似方法，这些伪影就会被修复。而且，如果你只是想比较一下，这就是L2重建的样子。","start":1996.88,"end":2019.38},{"id":118,"text":"So it's not bad, right? It knows that there were some line integrals that kind of went through the main part of it, came out pretty big. And from that, you would conclude there's something there in the middle, and it's basically a blob. So this is standard. I mean, a lot of people do other stuff now, but these were regularizers that were a lot better than what people had before.","zh":"所以这并不差，对吧？它知道有一些线积分大致穿过它的主要部分，结果变得很大。从这一点，你可以得出结论，中间有东西存在，基本上是一个块状结构。这是标准的做法。我的意思是，现在很多人做其他事情，但这些正则化方法比之前人们使用的要好得多。","start":2020.18,"end":2044.66},{"id":119,"text":"We're not going to mention a little bit about, just for fun, the idea of an iterated weighted L1 heuristic. And the way that works is this. I start with all the weights 1 here, and I do L1. Then what I do is actually really cool. If xi is 0 here, I set the weight to 1 over epsilon. Epsilon is a small number, and that means it's really high. If x is big,","zh":"我们不打算详细讨论，只是为了好玩，迭代加权L1启发式方法的想法。这种方法的工作方式如下。我一开始将所有权重设为1，然后进行L1优化。然后我做的是一个真正酷的事情。如果xi在这里为0，我会将权重设为1除以一个很小的数epsilon。epsilon是一个很小的数，这意味着权重非常高。如果x很大，","start":2050.09,"end":2076.87},{"id":120,"text":"I actually reduce the weight below one. So basically what this is doing, this update here, is actually doing triage. It's basically who's going to live and who's not going to live. So if you're small or zero, your weight goes up. And that means you're a prime target for being mapped to zero in the next L1 minimization. If you're big, your weight is reduced, which means that...","zh":"我会将权重降低到1以下。所以，这个更新实际上是在进行优先级排序。它基本上是在决定谁会存活，谁不会存活。如果你的值很小或为零，你的权重会增加。这意味着你将成为下一次L1最小化中被映射到零的首选目标。如果你的值很大，你的权重会被降低，这意味着……","start":2077.45,"end":2104.81},{"id":121,"text":"basically, I mean, if I anthropomorphize, that means you've concluded that, you know, whatever x7 is going to be non-zero. And so you reduce the weight. This actually kind of combines polishing there, right? Because polishing is an extreme form of this. Polishing goes like this. Solve the L1 problem. And like, you're zero? Put an infinite weight on you. And that means you're never going to be non-zero, right? You are, you're non-zero? You go, put your weight to zero. Meaning,","zh":"基本上，如果我拟人化地说，这意味着你已经得出结论，无论x7是什么，它将是非零的。因此你降低权重。这实际上在某种程度上结合了精调（polishing）的概念，对吧？因为精调是这种做法的极端形式。精调的过程如下：解决L1问题。如果你的结果是零，就给你一个无限大的权重。这意味着你永远不会是非零的，对吧？如果你是非零的，就将你的权重设为零。这意味着，","start":2105.33,"end":2132.73},{"id":122,"text":"No regularization. And then you resolve. So polishing is an extreme version of this. This is like iterative soft polishing or something weird like that. Okay, so this actually works quite well for a lot of things. Very few people know about this. I don't know why, but it's true that many people don't know about it. And you get a beautiful interpretation by doing something like this, which is very cool, right?","zh":"没有正则化。然后你再进行修正。所以 polishing 是这种做法的一个极端版本。这类似于迭代的软化修整或者一些奇怪的做法。好的，实际上这种方法在很多情况下都效果相当不错。很少有人知道这一点。我不知道为什么，但确实有很多人并不了解它。通过这样做，你可以得到一个非常漂亮的解释，这真的很酷，对吧？","start":2133.21,"end":2161.14}],"notes":["本段讲解了迭代加权L1启发式方法的基本思想，即通过调整权重来优化L1正则化问题。初始权重设为1，然后根据变量的大小调整权重，小或零的变量权重增加，大变量权重减少，从而在后续的L1最小化中更倾向于将小变量映射为零。","讲者提到，这种方法类似于一种“筛选”过程，即对变量进行分类，决定哪些变量应被保留（权重高）或被置零（权重低）。这种机制类似于“软化”过程，其中如果变量为零则赋予无限权重，使其无法被非零化，反之则赋予零权重，表示不进行正则化。","讲者指出，这种方法在实际应用中效果很好，但很少有人知道。他强调，这种加权策略提供了一种直观的解释，有助于理解L1正则化在稀疏性建模中的作用。","讲者还提到，这种加权方法可以视为一种“软化”过程的极端形式，即通过调整权重来逐步优化解的稀疏性，从而在保持模型性能的同时减少过拟合的风险。"],"formulas":[],"uncertainties":["在讲者提到的‘polishing’过程中，是否确实将零变量赋予无限权重，而非零变量赋予零权重，这一点可能存在听不清或理解偏差。"],"diagram":"none","start":1996.88,"end":2161.14,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1996.88,"text":"you do like, and this is again a case where you have eight times more variables to predict than measurements. So it's the same as the last one. You just reproduce it like pretty much perfectly. Actually, if you look closely, you'll see that there are weird artifacts, but that would be fixed if you did a fancier version of this approximation. And, you know, again, if you just wanted to compare that, you know, that's what the L2 reconstruction would look like."},{"start":2020.18,"text":"So it's not bad, right? It knows that there were some line integrals that kind of went through the main part of it, came out pretty big. And from that, you would conclude there's something there in the middle, and it's basically a blob. So this is standard. I mean, a lot of people do other stuff now, but these were regularizers that were a lot better than what people had before."},{"start":2050.09,"text":"We're not going to mention a little bit about, just for fun, the idea of an iterated weighted L1 heuristic. And the way that works is this. I start with all the weights 1 here, and I do L1. Then what I do is actually really cool. If xi is 0 here, I set the weight to 1 over epsilon. Epsilon is a small number, and that means it's really high. If x is big,"},{"start":2077.45,"text":"I actually reduce the weight below one. So basically what this is doing, this update here, is actually doing triage. It's basically who's going to live and who's not going to live. So if you're small or zero, your weight goes up. And that means you're a prime target for being mapped to zero in the next L1 minimization. If you're big, your weight is reduced, which means that..."},{"start":2105.33,"text":"basically, I mean, if I anthropomorphize, that means you've concluded that, you know, whatever x7 is going to be non-zero. And so you reduce the weight. This actually kind of combines polishing there, right? Because polishing is an extreme form of this. Polishing goes like this. Solve the L1 problem. And like, you're zero? Put an infinite weight on you. And that means you're never going to be non-zero, right? You are, you're non-zero? You go, put your weight to zero. Meaning,"},{"start":2133.21,"text":"No regularization. And then you resolve. So polishing is an extreme version of this. This is like iterative soft polishing or something weird like that. Okay, so this actually works quite well for a lot of things. Very few people know about this. I don't know why, but it's true that many people don't know about it. And you get a beautiful interpretation by doing something like this, which is very cool, right?"}],"speech_gaps":[],"frame":"../frames/v018/013.webp","frame_time":2008.88},{"title":"凸优化中的非凸近似与L0范数问题","segments":[{"id":123,"text":"Let's start with the actual card function, which looks like this. There's the card function. And someone comes along and says, well, I know a way. I'm going to use an L1 heuristic. And they go, what's that? And you go, well, instead of your function, I'm going to use this function. How about that? And they go, that's not a very good approximation. And you go, yeah, but it seems to work pretty well.","zh":"我们从实际的卡函数开始，它看起来像这样。这里有卡函数。然后有人过来并说，嗯，我知道一种方法。我要使用L1启发式方法。他们问，那是什么？你会回答，嗯，我不会用你的函数，而是用这个函数。怎么样？他们说，这不是一个很好的近似。你会说，是的，但它似乎工作得相当好。","start":2163.71,"end":2189.17},{"id":124,"text":"So here what you do instead is you write down, you make a non-convex function that looks close to this. I'm going to write down what that function is. It's going to be this. I'm going to make a weird function that goes like this. Actually over here it'll be like minus, I can subtract something and make it epsilon like this. It's going to look like that. And that you would say...","zh":"所以在这里，你所做的就是写下，你写下一个看起来接近这个的非凸函数。我要写下这个函数是什么。它将是这个。我要写一个奇怪的函数，看起来像这样。实际上在这里，它会像减去一些东西，我可以让它像这样变成epsilon。它看起来会像这样。然后你会说……","start":2190.59,"end":2218.43},{"id":125,"text":"That's a pretty good, that's a better approximation of this cardinality. Oh, by the way, people do this also with powers, which is kind of cool. So you do the square root. That's another one. You would, here's the real thing. Sorry, this is like that. That's like that. And people would put like a square root here, right? And then they would write extremely annoying papers about, they would say LP approximation with P equals 0.5.","zh":"这看起来相当不错，这是对这个基数的一个更好的近似。顺便说一句，人们也会用幂来这样做，这有点酷。所以你会做平方根。这是另一个例子。这里是真实的东西。抱歉，这像这样。这像这样。人们会在这里放一个平方根，对吧？然后他们会写极其烦人的论文，他们会说用P等于0.5的LP近似。","start":2218.91,"end":2242.75},{"id":126,"text":"Which drives me nuts because there's no such thing as an L.5 norm. Oh, even worse, people refer to cardinality as the L0 norm. Has anyone heard that? Don't let that stand. If you are in a social situation and someone says L1 norm, say something like, excuse me, that's not a norm.","zh":"这让我很烦，因为并不存在L.5范数。更糟糕的是，人们把基数称为L0范数。有人听说过吗？不要让这种说法存在。如果你在社交场合，有人提到L1范数，就说点什么，比如，打扰了，那不是范数。","start":2243.36,"end":2263.4},{"id":127,"text":"And if they say, oh, that's cool, sorry, I thought we were just like friends here or whatever, just casual. Then you go, fine, but just to check that they know that. If they don't, I mean, if they don't, then I don't know, leave the room or something because it's not, you should not hang out with people like that. It's like people who talk about an over-complete basis. And you're like, what? Anyway, otherwise known as a set of vectors, right? So just, anyway, all right, fine.","zh":"如果他们说，哦，这很酷，抱歉，我以为我们只是朋友或者随便聊聊，那就随意一点。然后你会说，好吧，但只是为了确认他们知道这一点。如果他们不知道，我的意思是，如果他们不知道，那我不知道，就离开房间吧，因为这不值得和这样的人交往。就像那些谈论过度完备基的人一样。你会说，什么？总之，也可以说是这样一组向量，对吧？所以，总之，好吧，行了。","start":2265.29,"end":2289.09},{"id":128,"text":"All right, so here, it turns out here you do something, you just linearize this objective at the current point, and then you get exactly this iterated reweighted heuristic. So you can think of it as doing a, people sometimes call that sequential convex optimization. So that's when you have a term, a constraint term, a function that's not convex.","zh":"好的，所以在这里，实际上你做的是，你只是在当前点对目标函数进行线性化，然后你就得到了这种迭代加权启发式方法。因此，你可以把它看作是一种顺序凸优化。这就是当你有一个项，一个约束项，一个非凸函数时的情况。","start":2290.65,"end":2317.65}],"notes":["本段主要讨论在凸优化中使用非凸近似方法的问题，特别是关于L0范数的误用。讲者指出，L0范数实际上并不存在，而人们常将其与稀疏性联系起来，这在数学上是不准确的。讲者强调，L1范数是唯一被广泛接受的范数，而L0.5范数等类似概念并不存在。","讲者提到，使用L1范数作为稀疏性近似的方法虽然常见，但其效果可能并不理想。同时，讲者批评了将稀疏性直接称为L0范数的做法，认为这是对数学概念的误用。","讲者还提到，当有人错误地使用L0范数时，应指出其不正确性，并建议在社交场合中纠正这种误解。讲者认为，这种错误的术语使用会影响对数学概念的理解。","此外，讲者还提到，非凸近似方法如L1范数在实际应用中被广泛使用，但其数学基础并不严谨。讲者指出，这些方法虽然在实践中有效，但并不符合严格的数学定义。","讲者进一步指出，使用非凸近似方法时，通常会采用线性化策略，即在当前点对目标函数进行线性化，从而得到迭代加权的启发式方法。这种方法被称为序列凸优化。","最后，讲者强调，非凸函数的处理需要特别小心，因为它们可能无法保证全局最优解。因此，在实际应用中，应谨慎使用这些方法，并理解其局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2163.71,"end":2317.65,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2163.71,"text":"Let's start with the actual card function, which looks like this. There's the card function. And someone comes along and says, well, I know a way. I'm going to use an L1 heuristic. And they go, what's that? And you go, well, instead of your function, I'm going to use this function. How about that? And they go, that's not a very good approximation. And you go, yeah, but it seems to work pretty well."},{"start":2190.59,"text":"So here what you do instead is you write down, you make a non-convex function that looks close to this. I'm going to write down what that function is. It's going to be this. I'm going to make a weird function that goes like this. Actually over here it'll be like minus, I can subtract something and make it epsilon like this. It's going to look like that. And that you would say..."},{"start":2218.91,"text":"That's a pretty good, that's a better approximation of this cardinality. Oh, by the way, people do this also with powers, which is kind of cool. So you do the square root. That's another one. You would, here's the real thing. Sorry, this is like that. That's like that. And people would put like a square root here, right? And then they would write extremely annoying papers about, they would say LP approximation with P equals 0.5."},{"start":2243.36,"text":"Which drives me nuts because there's no such thing as an L.5 norm. Oh, even worse, people refer to cardinality as the L0 norm. Has anyone heard that? Don't let that stand. If you are in a social situation and someone says L1 norm, say something like, excuse me, that's not a norm."},{"start":2265.29,"text":"And if they say, oh, that's cool, sorry, I thought we were just like friends here or whatever, just casual. Then you go, fine, but just to check that they know that. If they don't, I mean, if they don't, then I don't know, leave the room or something because it's not, you should not hang out with people like that. It's like people who talk about an over-complete basis. And you're like, what? Anyway, otherwise known as a set of vectors, right? So just, anyway, all right, fine."},{"start":2290.65,"text":"All right, so here, it turns out here you do something, you just linearize this objective at the current point, and then you get exactly this iterated reweighted heuristic. So you can think of it as doing a, people sometimes call that sequential convex optimization. So that's when you have a term, a constraint term, a function that's not convex."}],"speech_gaps":[],"frame":"../frames/v018/014.webp","frame_time":2175.71},{"title":"凸优化中的启发式方法与稀疏解","segments":[{"id":129,"text":"And what you do is you approximate it by a convex function at each step and solve that problem, right? And this is an example of that. And it works like, you know, this works like quite well. Okay, so that's it. And I'll just show you some quick examples of that. So, I mean, here would be a baby example, right, is we want to find a sparse solution in a polyhedron, right, of a set of linear inequalities, right?","zh":"你所做的就是在每一步用一个凸函数来近似它，并解决这个问题，对吧？这是一个例子。这种方法效果相当不错。好的，就是这样。我将很快展示一些例子。所以，这里是一个简单的例子，对吧？我们想要在一个多面体中找到一个稀疏解，对吧？","start":2318.49,"end":2345.03},{"id":130,"text":"What we do is we start with the L1 heuristic,","zh":"我们从L1启发式方法开始，","start":2345.94,"end":2348.38},{"id":131,"text":"and yeah, you come back with something","zh":"然后你会得到一个结果","start":2348.44,"end":2350.28},{"id":132,"text":"that has cardinality 44, whatever.","zh":"其元素个数为44，不管怎样。","start":2350.28,"end":2352.56},{"id":133,"text":"It doesn't matter, right?","zh":"这并不重要，对吧？","start":2352.66,"end":2353.64},{"id":134,"text":"So if you run this iterated L1 heuristic,","zh":"如果你运行这个迭代的L1启发式方法，","start":2355.72,"end":2360.1},{"id":135,"text":"these are the iterations,","zh":"这些就是迭代过程，","start":2360.28,"end":2361.52},{"id":136,"text":"what you can see is like, I don't know,","zh":"你可以看到，我也不知道，","start":2361.88,"end":2363.46},{"id":137,"text":"in three, four steps, you've got,","zh":"在三、四步中，你得到了，","start":2363.5,"end":2365.7},{"id":138,"text":"in four steps, you've got something","zh":"在四步中，你得到了一些东西","start":2365.72,"end":2367.42},{"id":139,"text":"with a cardinality of 36, right?","zh":"其基数为36，对吧？","start":2367.42,"end":2370.22},{"id":140,"text":"By the way, for this problem, for fun,","zh":"顺便说一句，对于这个问题，为了好玩，","start":2370.58,"end":2372.14},{"id":141,"text":"we just solved it globally,","zh":"我们只是全局求解了它，","start":2372.2,"end":2373.22},{"id":142,"text":"and the global solution is 32.","zh":"全局解是32。","start":2373.42,"end":2374.74},{"id":143,"text":"By the way, that worked perfectly.","zh":"顺便说一句，这完全奏效了。","start":2376.12,"end":2377.46},{"id":144,"text":"It was a randomly generated example.","zh":"这是一个随机生成的例子。","start":2377.56,"end":2378.66},{"id":145,"text":"Because had the global solution been 36,","zh":"因为如果全局解是36，","start":2378.88,"end":2381.0},{"id":146,"text":"this would be misleading, right?","zh":"这就会有误导性，对吧？","start":2381.58,"end":2383.74},{"id":147,"text":"So this tells you everything.","zh":"这告诉你所有的事情。","start":2383.82,"end":2385.02},{"id":148,"text":"This example worked out perfectly","zh":"这个例子完美地说明了","start":2385.36,"end":2386.86},{"id":149,"text":"to say exactly the honest and correct story,","zh":"如何准确而正确地讲述故事，","start":2386.86,"end":2389.26},{"id":150,"text":"which is, this is a really good heuristic.","zh":"也就是说，这是一个非常好的启发式方法。","start":2389.48,"end":2392.02},{"id":151,"text":"And if someone says,","zh":"如果有人问，","start":2392.5,"end":2393.48},{"id":152,"text":"does it always get the global solution?","zh":"它是否总是能找到全局解？","start":2393.56,"end":2394.8},{"id":153,"text":"The answer is, uh-uh, no, it doesn't.","zh":"答案是，呃，不，它并不如此。","start":2394.86,"end":2396.38},{"id":154,"text":"And here's a perfectly good example, right?","zh":"这里有一个非常好的例子，对吧？","start":2396.5,"end":2398.76},{"id":155,"text":"So, okay.","zh":"所以，好吧。","start":2398.82,"end":2399.72},{"id":156,"text":"So this is a quick example of that.","zh":"所以这是一个快速的例子。","start":2401.02,"end":2403.74},{"id":157,"text":"that. So you can use this in all sorts. I mean, once you understand about these methods,","zh":"这个。所以你可以用这些方法在各种情况下使用。我的意思是，一旦你理解了这些方法，","start":2403.74,"end":2408.24},{"id":158,"text":"you can use them in very cool ways, right? Like, so here's a quick example is I have","zh":"你就可以用它们以非常酷的方式使用，对吧？比如，这里有一个快速的例子，我有一个","start":2408.36,"end":2412.6},{"id":159,"text":"an AR model, so an autoregressive model. And what we're going to do is we're going to assume","zh":"自回归模型，也就是AR模型。我们将假设","start":2412.6,"end":2420.0},{"id":160,"text":"that the dynamics of the AR model, right, which is the A and the B, they change, right?","zh":"AR模型的动力学，也就是A和B，它们会变化，对吧？","start":2420.5,"end":2425.04},{"id":161,"text":"I mean, this is like a, there's a lot of things for this, right? Where you want to fit a model,","zh":"我的意思是，这就像有很多东西与此相关，对吧？你想要拟合一个模型，","start":2425.32,"end":2429.26},{"id":162,"text":"but it changes over time or something like that and so what you do is actually something pretty","zh":"但它会随时间变化，或者类似的情况，而你实际做的事情是相当","start":2429.26,"end":2434.9},{"id":163,"text":"cool it's a weird idea but here here it is what what you do is you start by actually assuming","zh":"酷的，这是一个奇怪的想法，但这里就是如此。你实际做的事情是，你首先假设","start":2435.54,"end":2441.76},{"id":164,"text":"You introduce a number of variables. So if you were just going to AR2 fit, A and B would be constant, and they'd be two variables. And you'd have a bunch of data because you'd have T equals 100 or time steps or a couple hundred, and everything would make sense to fit an AR2 model. But here what you do is someone says, no, no, but my AR2 model is time-varying. And you go, okay, cool. So you actually have a different A and B for each time period. Minor problem with that is you're now hideously overfit.","zh":"你引入了一组变量。如果你只是要拟合AR2模型，A和B将是常数，它们将是两个变量。你将有一组数据，因为你将有T等于100或时间步长，或者几百个，所有这些都将有意义以拟合一个AR2模型。但在这里，你做的事情是有人会说，不，不，我的AR2模型是随时间变化的。你回应说，好的，酷。因此，你实际上在每个时间周期都有不同的A和B。这种做法的小问题是你现在严重过拟合了。","start":2442.66,"end":2469.8}],"notes":["本段讲授了凸优化中使用启发式方法寻找稀疏解的过程，以一个简单的例子说明了L1启发式方法的使用。讲者提到，通过迭代L1启发式方法，可以在几步内得到一个稀疏解，但该方法并不保证找到全局最优解。","讲者通过一个随机生成的例子说明了启发式方法的性能，指出在该例子中，启发式方法得到了一个接近全局最优解的结果，但强调这种方法并不总是能保证找到全局最优解。","讲者进一步提到，启发式方法可以用于更复杂的场景，例如时间变化的自回归（AR）模型。在这种情况下，模型的参数（A和B）会随时间变化，这会导致模型的复杂度增加，但这种方法可以用于拟合时间变化的模型。","讲者指出，使用时间变化的AR模型时，虽然可以得到更灵活的模型，但也会导致过拟合的问题，因为每个时间点都需要独立的参数估计。","讲者强调，启发式方法虽然在某些情况下表现良好，但其性能依赖于具体问题和数据，不能保证在所有情况下都能找到最优解。","讲者最后指出，启发式方法在实际应用中非常有用，但需要谨慎使用，特别是在需要保证全局最优解的情况下。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2318.49,"end":2469.8,"asr_flags":[],"translation_complete":true,"translated_segments":36,"raw_segments":[{"start":2318.49,"text":"And what you do is you approximate it by a convex function at each step and solve that problem, right? And this is an example of that. And it works like, you know, this works like quite well. Okay, so that's it. And I'll just show you some quick examples of that. So, I mean, here would be a baby example, right, is we want to find a sparse solution in a polyhedron, right, of a set of linear inequalities, right?"},{"start":2345.94,"text":"What we do is we start with the L1 heuristic,"},{"start":2348.44,"text":"and yeah, you come back with something"},{"start":2350.28,"text":"that has cardinality 44, whatever."},{"start":2352.66,"text":"It doesn't matter, right?"},{"start":2355.72,"text":"So if you run this iterated L1 heuristic,"},{"start":2360.28,"text":"these are the iterations,"},{"start":2361.88,"text":"what you can see is like, I don't know,"},{"start":2363.5,"text":"in three, four steps, you've got,"},{"start":2365.72,"text":"in four steps, you've got something"},{"start":2367.42,"text":"with a cardinality of 36, right?"},{"start":2370.58,"text":"By the way, for this problem, for fun,"},{"start":2372.2,"text":"we just solved it globally,"},{"start":2373.42,"text":"and the global solution is 32."},{"start":2376.12,"text":"By the way, that worked perfectly."},{"start":2377.56,"text":"It was a randomly generated example."},{"start":2378.88,"text":"Because had the global solution been 36,"},{"start":2381.58,"text":"this would be misleading, right?"},{"start":2383.82,"text":"So this tells you everything."},{"start":2385.36,"text":"This example worked out perfectly"},{"start":2386.86,"text":"to say exactly the honest and correct story,"},{"start":2389.48,"text":"which is, this is a really good heuristic."},{"start":2392.5,"text":"And if someone says,"},{"start":2393.56,"text":"does it always get the global solution?"},{"start":2394.86,"text":"The answer is, uh-uh, no, it doesn't."},{"start":2396.5,"text":"And here's a perfectly good example, right?"},{"start":2398.82,"text":"So, okay."},{"start":2401.02,"text":"So this is a quick example of that."},{"start":2403.74,"text":"that. So you can use this in all sorts. I mean, once you understand about these methods,"},{"start":2408.36,"text":"you can use them in very cool ways, right? Like, so here's a quick example is I have"},{"start":2412.6,"text":"an AR model, so an autoregressive model. And what we're going to do is we're going to assume"},{"start":2420.5,"text":"that the dynamics of the AR model, right, which is the A and the B, they change, right?"},{"start":2425.32,"text":"I mean, this is like a, there's a lot of things for this, right? Where you want to fit a model,"},{"start":2429.26,"text":"but it changes over time or something like that and so what you do is actually something pretty"},{"start":2435.54,"text":"cool it's a weird idea but here here it is what what you do is you start by actually assuming"},{"start":2442.66,"text":"You introduce a number of variables. So if you were just going to AR2 fit, A and B would be constant, and they'd be two variables. And you'd have a bunch of data because you'd have T equals 100 or time steps or a couple hundred, and everything would make sense to fit an AR2 model. But here what you do is someone says, no, no, but my AR2 model is time-varying. And you go, okay, cool. So you actually have a different A and B for each time period. Minor problem with that is you're now hideously overfit."}],"speech_gaps":[],"frame":"../frames/v018/015.webp","frame_time":2330.49},{"title":"正则化与稀疏性在AR模型中的应用","segments":[{"id":165,"text":"right? At least two to one, right? Because you've got, so it's not just that you can make, you can match something exactly. So you have to put something that, some prior on A and B, right? You can have lots of priors. I mean, here would be one. A and B are increasing. I just made that up. Here's one. They vary smoothly, meaning the sum of the squares of the differences is small. Everybody got that? So that'd be a smoothly varying AR model, right? Here's another one.","zh":"对吧？至少是两到一，对吧？因为你不仅仅是可以制造，你可以精确匹配某样东西。所以你必须加入一些关于A和B的先验，对吧？你可以有很多先验。我的意思是，这里有一个例子。A和B是递增的。我只是随便说的。这里还有一个例子。它们变化平滑，意味着差值的平方和很小。大家明白了吗？所以这就是一个平滑变化的AR模型，对吧？这里还有一个例子。","start":2470.34,"end":2499.58},{"id":166,"text":"You have a piecewise constant AR model, meaning A and B are constant for various periods. Then there's some shift, and they assume different values. Everybody got this? But by now, at this point in the class, you have all the tools to do, like, you could do all sorts of crazy stuff with this. Okay? So you do this.","zh":"你有一个分段常数的AR模型，意思是A和B在不同的时间段内是常数。然后有一些变化，它们假设不同的值。大家明白了吗？但到目前为止，在这门课的这个阶段，你们已经拥有所有工具来做各种疯狂的事情。好吗？所以你们要这么做。","start":2500.58,"end":2520.78},{"id":167,"text":"So this is basically the regularizer, and this is the loss, right? So this is just a traditional square loss or Gaussian, whatever you want. V of T is Gaussian. Okay, so then this is a regularizer, which if you read it, you will understand completely, is a sparsifier for differences, changes in A and B.","zh":"所以这基本上就是正则化项，而这是损失函数，对吧？所以这只是一个传统的平方损失或高斯损失，无论你想要什么。V的T是高斯分布。好的，所以这就是一个正则化项，如果你读了它，你会完全理解，它是一个对A和B的变化进行稀疏化的工具。","start":2521.87,"end":2549.55},{"id":168,"text":"That's a sparsifier for the difference, which is basically saying I want piecewise constant. Okay, so here's a quick example. So here's some data that was generated. Here's A and B. I mean, it doesn't matter. But, you know, actually, since you see A and B, you can see they change at t equals 100 and t equals 200. And, you know, if you look at your eyeball and draw a line here, you can look at that and look at that and your eyeball, your spectral analyzer in your eyeball.","zh":"这是一个对变化进行稀疏化的工具，基本上是在说我想让模型是分段常数的。好的，这里有一个快速的例子。这里有一些生成的数据。这里是A和B。我的意思是，这并不重要。但你知道，实际上，因为你看到了A和B，你可以看到它们在t等于100和t等于200时发生了变化。而且，如果你用你的眼睛看这里，画一条线，你可以看这个和那个，你的眼睛，你眼睛里的频谱分析仪。","start":2550.17,"end":2575.65},{"id":169,"text":"says something happened, right? And then you can, again, this is hard, but you could pretend, especially after you knew the truth, you could certainly pretend that you'd say, oh yeah, no, I can see that the spectrum is different. In fact, the autocorrelation changes. And then that's for people who have the ability to look at a plot of something and say what the autocorrelation is in their head.","zh":"会告诉你发生了什么，对吧？然后你也可以，再次强调，这很难，但你可以假装，尤其是当你知道真相之后，你当然可以假装说，哦，是的，不，我能看到频谱是不同的。事实上，自相关性发生了变化。然后这是给那些有能力看一个图并凭直觉说出自相关性的人准备的。","start":2576.24,"end":2601.22},{"id":170,"text":"So there are people like that, right? But anyway, so you can see something happen in the three times. And the question is, how would we, from the signal on the left, how would we guess these changing coefficients, right? And here's what happens. If you just do that L1 heuristic.","zh":"所以有这样的人，对吧？不过不管怎样，你可以看到在三次中发生了一些事情。问题是，从左边的信号中，我们如何推测这些变化的系数呢？这里发生了什么。如果你只是采用L1启发式方法。","start":2601.81,"end":2618.41},{"id":171,"text":"you get this dashed line here right and i mean it kind of gets it it's pretty good right i mean you can see things like you know it it kind of got pretty close to where this change was it was pretty good up there and but you see this some weird little little things like that and this is kind of sad that's weird okay if you do this iterated l1 heuristic you get that over there and that's actually like pretty good right that's like that's good like and it's actually it's good i would have","zh":"你会得到这里这条虚线，我意思是它大致得到了，它相当不错，对吧？我意思是你可以看到一些事情，比如它大致接近了这个变化的位置，它在上面表现得相当不错，但你能看到这里有一些奇怪的小东西，像这样。这有点令人沮丧，这是奇怪的。如果你采用迭代的L1启发式方法，你会得到那边的结果，实际上这相当不错，对吧？这真的很不错，实际上它表现得很好，我会说它很好。","start":2618.89,"end":2647.62}],"notes":["本段讲解了正则化和损失函数在AR模型中的应用。正则化项用于对A和B的变化进行稀疏性约束，而损失函数则采用传统的平方损失或高斯分布。通过正则化项，可以实现对A和B变化的稀疏性建模，从而捕捉到数据中的分段常数特性。","讲者提到，通过使用L1正则化方法，可以得到一个近似于真实变化点的估计结果，但结果中仍存在一些不准确的小波动。这表明虽然L1正则化在捕捉分段常数特性方面有效，但仍然存在一定的误差。","讲者通过一个实际例子说明了如何从信号中估计出变化的系数。他指出，通过L1正则化方法，可以得到一个较为接近真实值的估计，但结果中仍存在一些不准确的小波动。","讲者提到，对于能够通过观察数据图谱来判断自相关性的个体来说，他们可以直观地识别出自相关性的变化。这表明在实际应用中，结合视觉分析和数学方法可以提高估计的准确性。","讲者强调，虽然L1正则化方法在估计分段常数模型中表现良好，但仍然存在一定的误差。这表明在实际应用中，需要结合其他方法或进一步优化模型以提高估计的准确性。","讲者提到，通过迭代L1正则化方法，可以得到一个更接近真实值的估计结果。这表明在实际应用中，迭代方法可以进一步提高估计的准确性。"],"formulas":[],"uncertainties":["you get this dashed line here right and i mean it kind of gets it it's pretty good right i mean you can see things like you know it it kind of got pretty close to where this change was it was pretty good up there and but you see this some weird little little things like that and this is kind of sad that's weird okay if you do this iterated l1 heuristic you get that over there and that's actually like pretty good right that's like that's good like and it's actually it's good i would have"],"diagram":"none","start":2470.34,"end":2647.62,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2470.34,"text":"right? At least two to one, right? Because you've got, so it's not just that you can make, you can match something exactly. So you have to put something that, some prior on A and B, right? You can have lots of priors. I mean, here would be one. A and B are increasing. I just made that up. Here's one. They vary smoothly, meaning the sum of the squares of the differences is small. Everybody got that? So that'd be a smoothly varying AR model, right? Here's another one."},{"start":2500.58,"text":"You have a piecewise constant AR model, meaning A and B are constant for various periods. Then there's some shift, and they assume different values. Everybody got this? But by now, at this point in the class, you have all the tools to do, like, you could do all sorts of crazy stuff with this. Okay? So you do this."},{"start":2521.87,"text":"So this is basically the regularizer, and this is the loss, right? So this is just a traditional square loss or Gaussian, whatever you want. V of T is Gaussian. Okay, so then this is a regularizer, which if you read it, you will understand completely, is a sparsifier for differences, changes in A and B. Everybody got that?"},{"start":2550.17,"text":"That's a sparsifier for the difference, which is basically saying I want piecewise constant. Okay, so here's a quick example. So here's some data that was generated. Here's A and B. I mean, it doesn't matter. But, you know, actually, since you see A and B, you can see they change at t equals 100 and t equals 200. And, you know, if you look at your eyeball and draw a line here, you can look at that and look at that and your eyeball, your spectral analyzer in your eyeball."},{"start":2576.24,"text":"says something happened, right? And then you can, again, this is hard, but you could pretend, especially after you knew the truth, you could certainly pretend that you'd say, oh yeah, no, I can see that the spectrum is different. In fact, the autocorrelation changes. And then that's for people who have the ability to look at a plot of something and say what the autocorrelation is in their head."},{"start":2601.81,"text":"So there are people like that, right? But anyway, so you can see something happen in the three times. And the question is, how would we, from the signal on the left, how would we guess these changing coefficients, right? And here's what happens. If you just do that L1 heuristic."},{"start":2618.89,"text":"you get this dashed line here right and i mean it kind of gets it it's pretty good right i mean you can see things like you know it it kind of got pretty close to where this change was it was pretty good up there and but you see this some weird little little things like that and this is kind of sad that's weird okay if you do this iterated l1 heuristic you get that over there and that's actually like pretty good right that's like that's good like and it's actually it's good i would have"}],"speech_gaps":[],"frame":"../frames/v018/016.webp","frame_time":2482.34},{"title":"矩阵秩的扩展与稀疏性","segments":[{"id":172,"text":"I swear I would have rerun this if it turns out it had nailed the actual times or the amplitudes exactly. I would have rerun it because that would have been sending the wrong message, right? But fortunately, it did not. This is kind of what you want to see. It does a pretty good job of doing this, right? But by the way, for scalar AR2 models, no big deal. Your eyeball can do it. But what if I gave you an econometric time series?","zh":"我发誓，如果结果恰好准确地捕捉到了实际的时间或振幅，我会重新运行这个程序。我会重新运行它，因为那样会传递错误的信息，对吧？但幸运的是，它并没有做到这一点。这基本上是你希望看到的结果。它在这个方面做得相当不错，对吧？不过顺便说一句，对于标量AR2模型，这并不难。你的眼睛就可以完成。但如果我给你一个计量经济学的时间序列呢？","start":2648.45,"end":2676.63},{"id":173,"text":"with 50 numbers, right? The dimension of 50, and I gave it to you monthly fo
