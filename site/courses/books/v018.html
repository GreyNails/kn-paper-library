oblems, right? I mean, frankly,"],"diagram":"none","start":2828.19,"end":2992.72,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2828.19,"text":"Well, you should probably learn this stuff because it's really cool. If you do, then that's fine too. So, okay. Then you get, then, I mean, you would know what to do. You maximize log likelihood minus the dual norm of the precision matrix, right? And you would be about eight to 10 years ago in research, right? So it's kind of cool. This is, so yeah, you're very close to sort of the boundaries of research here. So, okay."},{"start":2858.19,"text":"I think maybe I'll even skip factor modeling as an example. And I'll quit there. And now we want to switch to something else, which is going to be... Switch over to here. Yeah. So, okay. So at this point, the class is over. So we're done. I mean, not for you, actually. Actually, for that matter, or us. But, you know, you'll finish your homework eight."},{"start":2890.13,"text":"By tomorrow, hopefully you'll get a working barrier method or something like that and then feel good about that. You should feel good about that."},{"start":2896.77,"text":"Then you have a week to kind of poke through all the material. You really should go back for fun and like read, you know, I don't know, a couple of sections in duality or convex functions. Because now, I mean, you've been living with them for nine weeks. So it should be like the first time you saw this and you thought log determinant or something like that, or, you know, the min of the square root. It probably looked pretty weird. It should look very familiar to you now, I hope."},{"start":2923.06,"text":"Right. OK. Yes. You're going to have a whole week of kind of just letting all this stuff process and all the neural links formed and stuff like that. So what I want to do now is just actually talk about just some of the super high level like main ideas in the class. Right. So. So, you know, you know, so first of all, there's a ton of problems in in any sort of mathematical area that reduce to."},{"start":2951.49,"text":"optimization, right? So, you know, engineering, design, data analysis and statistics, you know, economics, management, you know, all of these things, they're just optimization problems, right? I mean, frankly,"},{"start":2965.68,"text":"that's a that's a tautology or something like so of course they're all optimization problems that's not an interesting statement i mean it's an interesting way to think about things right like it's actually i i think it's actually super clear way to do it like you go into a situation and people are coming at you from four different telling you oh there's this and we have to do that and these these constraints and forgot about oh there's regulatory you know bubble and you're like ah and you just sit down and you say okay wait sorry what are the things you're allowed to mess with these are the variables"}],"speech_gaps":[],"frame":"../frames/v018/018.webp","frame_time":2840.19},{"title":"凸优化中的多目标问题与可解性","segments":[{"id":186,"text":"what are the things that are non-negotiable? And they would say, well, and those are your constraints. And then you'd say, what would make you happy? Now, they probably are going to mention two or three things, right? And then you know you have a multi-criterion problem, and you'd say, cool, I will scalarize it with a bunch of weights, and we'll play with those later to see how happy we can make you.","zh":"什么问题是不可妥协的？他们会说，这些就是你的约束条件。然后你问，什么会让你感到满意？他们可能会提到两到三件事，对吧？然后你就知道这是一个多目标问题，你会说，好，我会用一组权重来将它标量化，之后我们再通过调整这些权重来看看能让你多满意。","start":2993.9,"end":3015.96},{"id":187,"text":"Everybody following what I just said? So it's actually not a bad way to organize your thoughts. When you get into something, there's people coming at you from 50 different things and they say, oh, whatever, don't remember, you know, remember rule 144B and remember the, you know, the Basel requirements for capital. And you're like, well, anyway, so it's just a very good way to actually just do anything, right? Not just there, but actually any field. Okay. Okay. So, you know.","zh":"大家刚才听懂我说的话了吗？其实这是一种组织思路的好方法。当你进入某个领域时，会有来自50个不同方面的人向你灌输各种东西，他们会说，哦，随便啦，不用记，你知道的，记住规则144B，记住巴塞尔协议对资本的要求。而你则会想，不管怎样，这其实是一种非常好的方法，用来做任何事情，对吧？不仅限于那里，而是任何领域。好的。好的。所以，你知道的。","start":3016.24,"end":3041.15},{"id":188,"text":"So basically, tractability, roughly speaking, but I mean, some people get really weird about this. Tractability, the problems that are tractable are the ones which are convex, right? And there's people that get weird and extreme about this. I'm not one of them, but so they would actually go through the undergrad.","zh":"基本上，可解性，粗略地说，但有些人对此非常执着。可解的问题就是那些凸问题，对吧？有些人对此非常极端，我并不是其中之一，但他们会真的上大学课程。","start":3042.18,"end":3059.64},{"id":189,"text":"CS course. They'd say, ha, you can find the shortest path in a graph from here to here. That's polynomial time. That's not a convex problem. Well, the answer is yes, it is, right? It turns out it's one where the relaxation has zero duality gap, right? Or they could say, I can take the singular value decomposition. That's not convex. And then it's even weirder. They would say, oh, it is. Because the dual of the dual, that has zero, that's a non-convex problem with zero duality gap. This is getting weird because it's just, no, it's, we know how to do that, right?","zh":"计算机科学课程。他们会说，哈，你可以在图中从这里到那里找到最短路径。这是多项式时间的问题。这不是一个凸问题。答案是，是的，它是。事实上，它是一个松弛问题具有零对偶间隙的问题，对吧？或者他们会说，我可以进行奇异值分解。这不是凸问题。然后它变得更奇怪了。他们会说，哦，它是。因为对偶问题的对偶问题具有零对偶间隙，这是一个具有零对偶间隙的非凸问题。这变得奇怪，因为其实我们早就知道怎么做了，对吧？","start":3060.61,"end":3087.25},{"id":190,"text":"And of course, the other thing is we shouldn't get too bent out of shape about it because in, I don't know, 95% of applications when you're solving an optimization problem, that's just a surrogate for what you really want. And that's actually something good to keep in mind, right? So, you know, if you're doing machine learning, you don't care about minimizing a loss plus a regularizer. You want to have good predictions on data you've never seen before.","zh":"当然，另一件事是我们不应该对此太过担心，因为在不知道的95%的应用中，当你在解决一个优化问题时，这只是一个你真正想要的东西的替代品。实际上，这是一件值得记住的好事，对吧？所以，如果你在做机器学习，你并不关心最小化损失加上正则化项。你想要的是在之前从未见过的数据上做出好的预测。","start":3088.99,"end":3115.63},{"id":191,"text":"If you're making a drone trajectory and you're running MPC or something like that, you don't care about solving whatever optimization problem somebody... You want it to follow the trajectory well and use as little fuel, or in that case energy, as possible. Everybody see what I'm saying? If you're doing finance, you just want to make money without taking risks. If someone chooses to solve some silly convex optimization problem to do it...","zh":"如果你在制作无人机轨迹，并且在运行模型预测控制（MPC）之类的东西，你并不关心解决某个优化问题。你想要的是让无人机很好地跟随轨迹，并尽可能少地使用燃料，或者在这种情况下是能量。大家明白我的意思吗？如果你在做金融，你只想赚钱而不承担风险。如果有人选择通过解决一些愚蠢的凸优化问题来实现这一点……","start":3116.9,"end":3143.16},{"id":192,"text":"Good for them, but you're not paid. We should just all bear in mind that in almost all applications, the optimization problem solving is actually just a surrogate for what you really want. That's an important thing to remember. When you think about that, then you realize it's not that big a deal if you can't solve a problem globally. It's perfectly cool if you can, but if you can't, it's just not that big a deal.","zh":"那也很好，但你不会因此而被支付。我们应该记住，在几乎所有应用中，解决优化问题实际上只是你真正想要的东西的一个替代品。这是个重要的事情要记住。当你想到这一点时，你会意识到，如果你无法全局求解一个问题，这并不是什么大不了的事。如果你能求解，那当然很好，但如果你不能，那也并不是什么大不了的事。","start":3143.54,"end":3171.01}],"notes":["本段讨论了多目标优化问题的处理方式，即通过加权的方式将多个目标转化为单一目标进行优化。讲者指出，这种做法在实际应用中非常常见，但需要注意的是，优化问题通常只是对真正目标的近似，而不是直接等同于目标本身。","讲者强调了凸优化问题在可解性方面的优势，但同时也指出，某些非凸问题在特定条件下（如松弛后具有零对偶间隙）也可以被有效求解。这表明，凸性并不是唯一决定问题可解性的因素。","在实际应用中，优化问题通常作为对真正目标的代理，例如在机器学习中，优化目标是损失函数加上正则项，但真正目标是获得良好的预测性能。讲者指出，这种代理关系在大多数情况下是合理的。","讲者还提到，即使无法全局求解优化问题，也不必过于担忧，因为实际应用中更关注的是局部最优解或近似解。这表明，优化问题的求解并不总是需要全局最优。","讲者通过多个实际例子（如无人机轨迹规划、金融投资）说明了优化问题在不同领域的应用，强调了优化问题作为代理目标的重要性。","最后，讲者指出，虽然凸优化在理论上具有良好的性质，但在实际应用中，优化问题的求解往往只是对真正目标的近似，因此不必过分追求严格的凸性条件。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2993.9,"end":3171.01,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2993.9,"text":"what are the things that are non-negotiable? And they would say, well, and those are your constraints. And then you'd say, what would make you happy? Now, they probably are going to mention two or three things, right? And then you know you have a multi-criterion problem, and you'd say, cool, I will scalarize it with a bunch of weights, and we'll play with those later to see how happy we can make you."},{"start":3016.24,"text":"Everybody following what I just said? So it's actually not a bad way to organize your thoughts. When you get into something, there's people coming at you from 50 different things and they say, oh, whatever, don't remember, you know, remember rule 144B and remember the, you know, the Basel requirements for capital. And you're like, well, anyway, so it's just a very good way to actually just do anything, right? Not just there, but actually any field. Okay. Okay. So, you know."},{"start":3042.18,"text":"So basically, tractability, roughly speaking, but I mean, some people get really weird about this. Tractability, the problems that are tractable are the ones which are convex, right? And there's people that get weird and extreme about this. I'm not one of them, but so they would actually go through the undergrad."},{"start":3060.61,"text":"CS course. They'd say, ha, you can find the shortest path in a graph from here to here. That's polynomial time. That's not a convex problem. Well, the answer is yes, it is, right? It turns out it's one where the relaxation has zero duality gap, right? Or they could say, I can take the singular value decomposition. That's not convex. And then it's even weirder. They would say, oh, it is. Because the dual of the dual, that has zero, that's a non-convex problem with zero duality gap. This is getting weird because it's just, no, it's, we know how to do that, right?"},{"start":3088.99,"text":"And of course, the other thing is we shouldn't get too bent out of shape about it because in, I don't know, 95% of applications when you're solving an optimization problem, that's just a surrogate for what you really want. And that's actually something good to keep in mind, right? So, you know, if you're doing machine learning, you don't care about minimizing a loss plus a regularizer. You want to have good predictions on data you've never seen before."},{"start":3116.9,"text":"If you're making a drone trajectory and you're running MPC or something like that, you don't care about solving whatever optimization problem somebody... You want it to follow the trajectory well and use as little fuel, or in that case energy, as possible. Everybody see what I'm saying? If you're doing finance, you just want to make money without taking risks. If someone chooses to solve some silly convex optimization problem to do it..."},{"start":3143.54,"text":"Good for them, but you're not paid. We should just all bear in mind that in almost all applications, the optimization problem solving is actually just a surrogate for what you really want. That's an important thing to remember. When you think about that, then you realize it's not that big a deal if you can't solve a problem globally. It's perfectly cool if you can, but if you can't, it's just not that big a deal."}],"speech_gaps":[],"frame":"../frames/v018/019.webp","frame_time":3005.9},{"title":"凸优化的实际应用与非凸优化的挑战","segments":[{"id":193,"text":"So, you know, if someone took your circuit design and reduced the dynamic power consumption by 20%, you're happy, right? I mean, maybe you think, like, could someone do it by 30%, but you're just happy you just reduced it 25%. So I'm just saying, you know, we shouldn't get too hung up on this. Nevertheless, tractable is not a bad thing. So, you know, to be able to say I can solve this problem exactly, there's a lot of benefits. I mean, one benefit is there's no babysitting.","zh":"所以，你知道的，如果有人拿走了你的电路设计，并将动态功耗降低了20%，你就会很开心，对吧？我的意思是，也许你会想，像这样能否降低30%？但你只是开心你已经降低了25%。所以，我只是说，我们不要太纠结于此。不过，可解性并不是什么坏事。所以，你知道的，能够说我能精确地解决这个问题，有很多好处。我的意思是，其中一个好处就是不需要有人一直看着你。","start":3173.47,"end":3201.85},{"id":194,"text":"of the algorithm, right? You know, when you have, you know, close your eyes and think of any place where people widely use non-convex optimization. Anyone here can think of a bunch of those, right? It turns out, actually, like, quote, solving those problems, which you're not actually doing, is actually an art. And somebody says, oh, no, no, you should be using this and that, and you should change the learning rate and blah, blah, blah. And you just don't, that's just all short-circuited. You just don't have it.","zh":"算法的这些方面，对吧？你知道的，当你想到任何人们广泛使用非凸优化的地方，任何人都能想到一堆这样的例子，对吧？实际上，解决这些问题，你实际上并没有在做，这其实是一门艺术。有人会说，哦，不，不，你应该使用这个和那个，你应该改变学习率，等等，等等。而你只是没有，这仅仅是一些短路的尝试。你根本就没有这些。","start":3202.21,"end":3227.89},{"id":195,"text":"right? Or what's your initial, like you asked, what's the initial condition, right? Like, you know, that's a pretty good circuit design, but how did, what was your initial design, right? And the point about this is that's just short-circuited. There's no such thing. You just don't, you don't have any of that. It's just all gone, right? I mean, the other advantage, of course, being the fact that they can be made unbelievably reliable and therefore they can be embedded. So they are embedded in control systems where they solve a thousand QPs per second.","zh":"对吧？或者你的初始条件是什么？就像你问的，初始条件是什么，对吧？你知道的，这已经是一个相当不错的电路设计了，但你是怎么做到的？你的初始设计是什么？重点在于，这仅仅是一些短路的尝试。根本没有这样的东西。你根本就没有这些，你完全没有这些。它全都消失了，对吧？我的意思是，另一个优势当然是它们可以被制造得极其可靠，因此可以被嵌入。因此，它们被嵌入到控制系统中，每秒解决上千个二次规划问题。","start":3228.29,"end":3256.03},{"id":196,"text":"and they do that for hours and hours and days and days, just forever, and it just works, right? And, you know, try doing that with a non-convex thing, like, you know, because it's not going to take long before something fails to converge or something like that. Okay, okay. So, you know, a lot of applications that you've seen in this class, they can be formulated as convex problems. We go a little bit overboard on it because you're kind of in a little sandbox now, but...","zh":"它们可以持续工作数小时、数天，甚至永远，而它一直正常运行，对吧？而你尝试用非凸方法来做这件事，很快就会出现无法收敛的问题，或者其他类似的问题。好的，好的。所以，你知道的，你在本课堂中看到的很多应用，都可以被表述为凸问题。我们在这方面有点过度强调，因为你现在基本上处于一个沙盒环境中，但……","start":3256.93,"end":3282.69},{"id":197,"text":"Once you finish the course, you can venture out. So it turns out most problems aren't really convex. But it turns out once you know these tools, you're going to be unbelievably effective at problems that aren't convex, right? Because someone will say, yeah, I want to do a trade list. You say, oh, but there's a minimum non-zero trade size. Like, I'm sorry, don't come back and tell me to buy like $300 worth of something. Minimum is $10,000. Everybody see what I'm saying? You can see the zero or minimum $10,000.","zh":"一旦你完成了这门课，你就可以走出去了。结果发现大多数问题实际上并不是凸的。但结果发现，一旦你掌握了这些工具，你将在处理非凸问题时变得极其高效，对吧？因为有人会说，是的，我想做一个交易清单。你会说，哦，但是有一个最小的非零交易金额。比如，对不起，不要回来告诉我买价值300美元的东西。最小金额是10,000美元。大家明白我的意思吗？你能看到零或者最小10,000美元。","start":3283.02,"end":3311.48},{"id":198,"text":"That's that's a that actually happens like all the time. Okay Once you know these things you will figure out your it you could now all of you could figure out a heuristic for that and it would be Extremely good some in fact somebody just come up with your risk with a heuristic for that right now I'm gonna sell let's make it simple. I'm gonna sell a bunch of stuff. I have six thousand assets. I'm gonna sell some","zh":"这就是这种情况经常发生的事情。一旦你了解了这些，你就能想出一个启发式方法来解决这个问题，并且效果会非常好。事实上，有人刚刚为这个问题提出了一个启发式方法。现在我来简化一下。我要卖出一堆东西。我有六千种资产。我要卖出一些","start":3312.19,"end":3333.92}],"notes":["本段讨论了凸优化在实际应用中的优势，特别是其可靠性和可嵌入性。讲者指出，凸优化问题可以被精确求解，这使得它们在控制系统的实时计算中非常有用，例如每秒解决数千个二次规划问题。同时，讲者也提到，非凸优化问题在实际应用中更为常见，但其求解过程可能不稳定，容易出现收敛失败的问题。","讲者通过一个交易列表的例子说明了非凸优化问题的复杂性。他指出，即使在实际应用中存在最小交易金额的约束，非凸优化问题的求解仍然可能面临挑战，而凸优化方法可以提供更可靠的解决方案。","讲者强调，虽然课程中主要讨论了凸优化问题，但掌握这些工具后，学生可以有效地处理非凸问题。他提到，通过启发式方法，可以解决实际应用中的复杂问题，例如在交易列表中处理最小交易金额的约束。","讲者提到，非凸优化问题的求解过程可能涉及许多不确定因素，例如学习率的调整和算法选择。他指出，这些过程往往缺乏明确的指导，而凸优化方法则提供了更清晰的解决方案。","讲者通过一个具体的例子说明了凸优化在实际应用中的价值，即在交易列表中处理最小交易金额的约束。他指出，即使在实际应用中存在复杂的约束条件，凸优化方法仍然能够提供有效的解决方案。","讲者最后提到，虽然课程主要集中在凸优化问题上，但学生在掌握这些工具后，可以将这些方法应用于更广泛的非凸问题。他指出，通过启发式方法，可以解决实际应用中的复杂问题，例如在交易列表中处理最小交易金额的约束。"],"formulas":[],"uncertainties":["the minimum non-zero trade size"],"diagram":"none","start":3173.47,"end":3333.92,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3173.47,"text":"So, you know, if someone took your circuit design and reduced the dynamic power consumption by 20%, you're happy, right? I mean, maybe you think, like, could someone do it by 30%, but you're just happy you just reduced it 25%. So I'm just saying, you know, we shouldn't get too hung up on this. Nevertheless, tractable is not a bad thing. So, you know, to be able to say I can solve this problem exactly, there's a lot of benefits. I mean, one benefit is there's no babysitting."},{"start":3202.21,"text":"of the algorithm, right? You know, when you have, you know, close your eyes and think of any place where people widely use non-convex optimization. Anyone here can think of a bunch of those, right? It turns out, actually, like, quote, solving those problems, which you're not actually doing, is actually an art. And somebody says, oh, no, no, you should be using this and that, and you should change the learning rate and blah, blah, blah. And you just don't, that's just all short-circuited. You just don't have it."},{"start":3228.29,"text":"right? Or what's your initial, like you asked, what's the initial condition, right? Like, you know, that's a pretty good circuit design, but how did, what was your initial design, right? And the point about this is that's just short-circuited. There's no such thing. You just don't, you don't have any of that. It's just all gone, right? I mean, the other advantage, of course, being the fact that they can be made unbelievably reliable and therefore they can be embedded. So they are embedded in control systems where they solve a thousand QPs per second."},{"start":3256.93,"text":"and they do that for hours and hours and days and days, just forever, and it just works, right? And, you know, try doing that with a non-convex thing, like, you know, because it's not going to take long before something fails to converge or something like that. Okay, okay. So, you know, a lot of applications that you've seen in this class, they can be formulated as convex problems. We go a little bit overboard on it because you're kind of in a little sandbox now, but..."},{"start":3283.02,"text":"Once you finish the course, you can venture out. So it turns out most problems aren't really convex. But it turns out once you know these tools, you're going to be unbelievably effective at problems that aren't convex, right? Because someone will say, yeah, I want to do a trade list. You say, oh, but there's a minimum non-zero trade size. Like, I'm sorry, don't come back and tell me to buy like $300 worth of something. Minimum is $10,000. Everybody see what I'm saying? You can see the zero or minimum $10,000."},{"start":3312.19,"text":"That's that's a that actually happens like all the time. Okay Once you know these things you will figure out your it you could now all of you could figure out a heuristic for that and it would be Extremely good some in fact somebody just come up with your risk with a heuristic for that right now I'm gonna sell let's make it simple. I'm gonna sell a bunch of stuff. I have six thousand assets. I'm gonna sell some"}],"speech_gaps":[],"frame":"../frames/v018/020.webp","frame_time":3185.47},{"title":"凸优化中的松弛与实际应用","segments":[{"id":199,"text":"But here are the rules. Don't ask me to sell $300 worth of something. I mean, that's kind of insulting, right? Make it something. It's either you don't sell any or it's $10,000 worth. Somebody come up with a heuristic right now. And the rest of the problems I've got, transaction cost, risk, blah, blah, blah. I don't know. So somebody give me an example. How would you do it? I say you could do it right now. Or maybe after some reflection. What would you do? What's the first thing you would do in that situation?","zh":"但这里有规则。不要让我卖价值300美元的东西。我的意思是，这有点侮辱人，对吧？要卖的东西必须有价值。要么你什么都不卖，要么就是价值10,000美元的东西。现在有人能想出一个启发式方法吗？至于我剩下的那些问题，交易成本、风险，等等，我就不知道了。所以有人给我举个例子吧。你会怎么做？我说你现在就可以做，或者可能在一些思考之后。你会怎么做？在这种情况下，你第一步会做什么？","start":3334.52,"end":3366.1},{"id":200,"text":"Let me describe it a different way. Somebody comes into you, and they're ranting and raving, and they say, here's what I want you to do, and they list off 12 constraints and objectives which are convex, and one that's not. Do you have a suggestion for me? It's a street fighting suggestion. What is it? What would you do? Relax the last one. Yeah, relax the last one, which means, let's be brutally honest. How about this? How about just ignore it?","zh":"让我用另一种方式来描述。有人走进你面前，情绪激动地抱怨，并说：\"这里是我想要你做的事情，\"然后列出12个凸的约束和目标，其中有一个不是凸的。你有什么建议吗？这是一个街头斗殴式的建议。你会怎么做？你会怎么做？放松最后一个约束。是的，放松最后一个约束，这意味着，我们坦率地说，怎么处理？怎么处理？干脆忽略它？","start":3367.81,"end":3396.54},{"id":201,"text":"So that's kind of what it, that's a strong form of relaxation, right? So you solve it without it. Okay. You know, yeah, you can put an L1 norm in there. That's fine. Let's put an L1 norm in there. And you get, then you look at all your trades and you, then what do you do? If they come out above 10,000 bucks, they're fine, right? If they're zero, they're fine.","zh":"所以这就是一种相当强的松弛形式，对吧？所以你不用考虑它就能解决这个问题。好的，你知道的，你可以在里面加入L1范数。这没问题。让我们在里面加入L1范数。然后你查看所有的交易，然后你会怎么做？如果它们的价值超过10,000美元，那没问题，对吧？如果它们是零，那也没问题。","start":3397.66,"end":3418.41},{"id":202,"text":"If they're in that weird dead band in the middle, they're not cool, according to your trading desk or something. Everybody following this? I mean, I could transpose this to any field there is, right? I guarantee you exact identical things happen. Like, here's one. A generator is either off and generating zero power, or the minimum is like 10 megawatts.","zh":"如果它们处于中间那个奇怪的死区，根据你的交易台或其他什么，它们就不被认可。大家跟上了吗？我的意思是，我可以把这个例子应用到任何领域，对吧？我保证，完全相同的事情会发生。比如，一个发电机要么关闭，不发电，要么最小输出是10兆瓦。","start":3419.07,"end":3438.09},{"id":203,"text":"So see the zero or between 10 and 30 megawatts. End of story. So that's identical to this, right? Okay. So, all right. So what you do now is anybody, what you do is you'd solve it once. Then you simply have a threshold and you decide which generator is on and which is off.","zh":"所以看到零或者在10到30兆瓦之间的输出。故事结束。这和前面的例子是一样的，对吧？好的。那么现在你该怎么做呢？任何人，你该怎么做？你只需要解决一次。然后你简单地设置一个阈值，决定哪个发电机是开启的，哪个是关闭的。","start":3438.8,"end":3454.14},{"id":204,"text":"Now you resolve with that as a constraint. If you're on, you're bigger than your minimum power. Let's make it 10 megawatts. If you're trading, you'd say, I'm going to sell more than... Anybody that came... If you're on, if I'm actually selling you, I have to sell more than 10,000 bucks worth. Everybody got this? And everything else is zero. That's two convex problems. This would work beautifully. Theoristic.","zh":"现在你把它作为一个约束条件来处理。如果你在运行，你的功率必须大于最小功率。让我们设定为10兆瓦。如果你在交易，你会说，我要卖出超过……任何来交易的人都……如果你在运行，如果我实际上在卖给你，我必须卖出超过10,000美元价值的商品。大家明白了吗？其他一切都是零。这是两个凸问题。这会非常完美地运作。理论性。","start":3454.89,"end":3478.65},{"id":205,"text":"you know, we do stuff that's mostly just convex, but once you absorb all these tools, you will be extremely effective at things like that. So, okay. Okay. All right. So, you know, the theoretical consequences of convexity are, you know, local, optimal, global. Duality theory is kind of awesome, right? It's a, basically, I think of it as it's a completely systematic way to derive sophisticated lower bounds.","zh":"你知道的，我们做的是基本上只是凸的问题，但一旦你掌握了所有这些工具，你就会在像这样的事情上变得极其有效。所以，好的。好的。好了。你知道的，凸性的理论后果是，局部最优解就是全局最优解。对偶理论相当了不起，对吧？它基本上是一种完全系统化的方式来推导复杂的下界。","start":3478.95,"end":3507.69}],"notes":["本段讨论了在凸优化中如何处理非凸约束的问题，提出了一种通过松弛最后一条非凸约束的方法。这种松弛方法可以简化问题，使其变为凸问题，从而更容易求解。例如，在交易问题中，可以忽略非凸约束，然后通过阈值判断是否满足条件。","讲者通过发电机的例子进一步说明了这种松弛方法的应用。发电机要么关闭（零功率），要么在最低功率（如10兆瓦）以上运行。这种二元选择与交易问题中的零或超过10,000美元的交易类似，展示了凸优化在实际问题中的应用。","在解决凸优化问题后，可以通过设定阈值来决定哪些变量满足条件，哪些不满足。例如，在交易问题中，如果交易金额超过10,000美元，则视为有效，否则视为无效。这种方法将问题分解为两个凸问题，从而实现有效求解。","讲者强调了凸优化理论的理论后果，包括局部最优解与全局最优解的等价性，以及对偶理论的重要性。对偶理论提供了一种系统的方法来推导复杂的下界，这在优化问题中具有重要意义。","讲者指出，虽然实际问题中可能包含非凸约束，但通过适当的松弛方法，可以将问题转化为凸问题，从而利用凸优化的强大工具进行求解。这种方法在多个领域都有广泛应用，如金融交易和电力系统优化。","最后，讲者总结了凸优化的核心思想，即通过吸收各种工具和方法，可以有效地解决实际问题。凸优化的理论基础和实际应用相结合，使得该方法在解决复杂问题时具有显著优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3334.52,"end":3507.69,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3334.52,"text":"But here are the rules. Don't ask me to sell $300 worth of something. I mean, that's kind of insulting, right? Make it something. It's either you don't sell any or it's $10,000 worth. Somebody come up with a heuristic right now. And the rest of the problems I've got, transaction cost, risk, blah, blah, blah. I don't know. So somebody give me an example. How would you do it? I say you could do it right now. Or maybe after some reflection. What would you do? What's the first thing you would do in that situation?"},{"start":3367.81,"text":"Let me describe it a different way. Somebody comes into you, and they're ranting and raving, and they say, here's what I want you to do, and they list off 12 constraints and objectives which are convex, and one that's not. Do you have a suggestion for me? It's a street fighting suggestion. What is it? What would you do? Relax the last one. Yeah, relax the last one, which means, let's be brutally honest. How about this? How about just ignore it?"},{"start":3397.66,"text":"So that's kind of what it, that's a strong form of relaxation, right? So you solve it without it. Okay. You know, yeah, you can put an L1 norm in there. That's fine. Let's put an L1 norm in there. And you get, then you look at all your trades and you, then what do you do? If they come out above 10,000 bucks, they're fine, right? If they're zero, they're fine."},{"start":3419.07,"text":"If they're in that weird dead band in the middle, they're not cool, according to your trading desk or something. Everybody following this? I mean, I could transpose this to any field there is, right? I guarantee you exact identical things happen. Like, here's one. A generator is either off and generating zero power, or the minimum is like 10 megawatts."},{"start":3438.8,"text":"So see the zero or between 10 and 30 megawatts. End of story. So that's identical to this, right? Okay. So, all right. So what you do now is anybody, what you do is you'd solve it once. Then you simply have a threshold and you decide which generator is on and which is off."},{"start":3454.89,"text":"Now you resolve with that as a constraint. If you're on, you're bigger than your minimum power. Let's make it 10 megawatts. If you're trading, you'd say, I'm going to sell more than... Anybody that came... If you're on, if I'm actually selling you, I have to sell more than 10,000 bucks worth. Everybody got this? And everything else is zero. That's two convex problems. This would work beautifully. Theoristic. This is just an example to say that..."},{"start":3478.95,"text":"you know, we do stuff that's mostly just convex, but once you absorb all these tools, you will be extremely effective at things like that. So, okay. Okay. All right. So, you know, the theoretical consequences of convexity are, you know, local, optimal, global. Duality theory is kind of awesome, right? It's a, basically, I think of it as it's a completely systematic way to derive sophisticated lower bounds."}],"speech_gaps":[],"frame":"../frames/v018/021.webp","frame_time":3346.52},{"title":"凸优化中的可行性证书与实际应用","segments":[{"id":206,"text":"on the optimal value of a problem, which is kind of cool, right? In the case of convexity, they become sort of necessary and sufficient. I mean, not quite. There's a little asterisk and there's some constraint qualification, but that's fine. And it's super useful. It allows you to do things like sensitivity analysis. It produces things like infeasibility certificates, right? When you come back and you go, can't do it, can't design it. Someone says, why not?","start":3508.25,"end":3536.45},{"id":207,"text":"You go, no one can. And they go, well, you can't, but I'll fire you and your group, and I'll get a new one, and they will be able to, maybe. And you go, no, because I can actually easily prove that no one can do it. Everybody follow me? That's a certificate of infeasibility. So that's cool. I mean, if you care about the worst-case complexity theory, then there is one, right? So that's fine.","start":3536.9,"end":3559.66},{"id":208,"text":"The practical ones are actually, I think, much more interesting, right? So, you know, basically, if a problem is convex, you can solve it, right? I am aware of no situation where a problem, someone proposed a convex problem.","start":3560.96,"end":3577.3},{"id":209,"text":"you know, that they couldn't end up, you know, not all of them are going to work with CVXPy, right? But people in machine learning, they were like, excuse me, I have a billion samples. So, and by the way, 100 million parameters. So it's not working, right? People figure it out. In that case, you use these other, you know, methods like subgradient methods or something like that, right? You know, people for images do, and you can do a lot of that stuff too. It's all fine.","start":3578.17,"end":3604.69},{"id":210,"text":"So, anyway, so this is the basic idea. But for normal size problems, I mean, if you're not doing images or giant things or handling video or something like that, then you're within striking distance of these kind of easy to use tools, right? So the...","start":3606.74,"end":3627.8},{"id":211,"text":"The implications of things like CVXPy are immense, right? And actually, I can tell you specifically why you should be extremely grateful that you're taking this in a post-CVX, CVXPy world. Because I'll tell you how it worked before that. Here's the way it worked. I'd go into my office. There'd be some grad students there.","start":3628.83,"end":3646.45},{"id":212,"text":"And I'd say, I've got this unbelievably good idea. Here's how we're going to do it. We're going to solve this convex problem, and it's going to work really well for some application. And they go, cool. Then here's what would happen. I would go home, have a nice dinner, that kind of thing. Grad students would surround and implement.","start":3646.92,"end":3667.6}],"notes":["本段讲授了凸优化中可行性证书的概念，即当问题不可行时，可以通过数学证明来证明其不可行性，从而提供一个证书。这种证书在最坏情况复杂度理论中具有重要意义。","讲者提到，虽然凸问题在理论上可以被求解，但在实际应用中，如机器学习中处理大规模数据时，可能需要使用其他方法，如次梯度方法，因为CVXPy等工具可能无法处理如此大的规模。","讲者强调了CVXPy等工具在现代凸优化中的重要性，指出它们极大地简化了凸问题的求解过程，使得学生和研究人员能够更高效地进行研究和应用。","讲者通过一个办公室场景的例子，说明了在CVXPy出现之前，解决凸问题需要研究生团队的大量工作，而现在这些工具使得问题求解变得更加容易。","讲者还提到，对于常规规模的问题，使用这些工具可以接近于直接求解，这表明了凸优化在实际应用中的广泛适用性。","讲者通过实际例子说明了凸优化在机器学习中的应用，如处理大规模数据集和参数，强调了凸优化方法在实际问题中的灵活性和实用性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3508.25,"end":3667.6,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3508.25,"text":"on the optimal value of a problem, which is kind of cool, right? In the case of convexity, they become sort of necessary and sufficient. I mean, not quite. There's a little asterisk and there's some constraint qualification, but that's fine. And it's super useful. It allows you to do things like sensitivity analysis. It produces things like infeasibility certificates, right? When you come back and you go, can't do it, can't design it. Someone says, why not?"},{"start":3536.9,"text":"You go, no one can. And they go, well, you can't, but I'll fire you and your group, and I'll get a new one, and they will be able to, maybe. And you go, no, because I can actually easily prove that no one can do it. Everybody follow me? That's a certificate of infeasibility. So that's cool. I mean, if you care about the worst-case complexity theory, then there is one, right? So that's fine."},{"start":3560.96,"text":"The practical ones are actually, I think, much more interesting, right? So, you know, basically, if a problem is convex, you can solve it, right? I am aware of no situation where a problem, someone proposed a convex problem."},{"start":3578.17,"text":"you know, that they couldn't end up, you know, not all of them are going to work with CVXPy, right? But people in machine learning, they were like, excuse me, I have a billion samples. So, and by the way, 100 million parameters. So it's not working, right? People figure it out. In that case, you use these other, you know, methods like subgradient methods or something like that, right? You know, people for images do, and you can do a lot of that stuff too. It's all fine."},{"start":3606.74,"text":"So, anyway, so this is the basic idea. But for normal size problems, I mean, if you're not doing images or giant things or handling video or something like that, then you're within striking distance of these kind of easy to use tools, right? So the..."},{"start":3628.83,"text":"The implications of things like CVXPy are immense, right? And actually, I can tell you specifically why you should be extremely grateful that you're taking this in a post-CVX, CVXPy world. Because I'll tell you how it worked before that. Here's the way it worked. I'd go into my office. There'd be some grad students there."},{"start":3646.92,"text":"And I'd say, I've got this unbelievably good idea. Here's how we're going to do it. We're going to solve this convex problem, and it's going to work really well for some application. And they go, cool. Then here's what would happen. I would go home, have a nice dinner, that kind of thing. Grad students would surround and implement."}],"speech_gaps":[],"frame":"../frames/v018/022.webp","frame_time":3520.25},{"title":"凸优化中的实际应用与工具使用","segments":[{"id":213,"text":"Some, you know, and it was not, it's not easy. I mean, they would have like Mosaic or some commercial solver, who knows, or some other one. They'd be writing like C, C++ and basically stuffing matrices by themselves. Everyone following this, it would not be fun. I would come in the next morning, all well rested. I'd say, hey, how'd it go? And they go, oh, we implemented it. And I go, cool. How's it work? And they go, not too well. And I go, oh, well, I got another great idea.","zh":"有些人，你知道的，这并不容易。我的意思是，他们可能会使用像Mosaic或某些商业求解器，谁知道呢，或者其他的。他们会用C或C++编写代码，基本上自己填充矩阵。所有在场的人，这不会很有趣。第二天早上，我来的时候，精神很好。我会说，嘿，怎么样了？他们会说，哦，我们实现了。我会说，很好。它怎么运作的？他们会说，不太顺利。我会说，哦，那我又有另一个好主意了。","start":3668.2,"end":3693.28},{"id":214,"text":"So everyone so so I think actually it's basically like grad students who should be most grateful for the existence of these these high-level tools Right because they were the there that I believe the chief beneficiaries. Okay Okay, so, you know, how do you use it? I mean people have different ideas about this, but these are just sort of mine You know basically","zh":"所以每个人，我觉得实际上基本上都是研究生，他们应该最感激这些高级工具的存在。因为我认为最大的受益者就是他们。好的，好的，那么你知道，你怎么使用它呢？我的意思是，人们对这个问题有不同的想法，但这些只是我的看法。你知道，基本上","start":3694.4,"end":3718.16},{"id":215,"text":"I'd start with this rapid prototyping, right? So you start with really simple models, small problem instances, and you can use some inefficient method. I mean, it doesn't matter. By the way, if you don't like the results there, then you just, you say, you know, if someone else is saying like, it's never going to scale, it's never going to scale. What are you doing? If you don't like what it does with problems with a thousand or 10,000 variables, then why on earth would you think you're going to like what it does for a million or a hundred million, right?","zh":"我会从快速原型设计开始，对吧？所以你会从非常简单的模型、小规模的问题实例开始，并且可以使用一些低效的方法。我的意思是，这并不重要。顺便说一句，如果你不喜欢那里的结果，那么你只需要说，你知道的，如果有人告诉你，它永远无法扩展，永远无法扩展。你在做什么？如果你不喜欢它在处理一千或一万变量的问题时的表现，那么你凭什么认为它在处理一百万或一亿变量时会更好呢？","start":3719.08,"end":3746.82},{"id":216,"text":"By the way, there's some people I got yelled at by someone at Google who once said, that's so wrong. He said, the things we work on, you know, the interesting things emerge at scale, right? And that's, you know, supposed to sound really deep and all that. It's true. Okay, but it's fine. So, and they like, no, we implement at scale. And I'm like, well, good for you. So I'm just saying there's diversity of opinions about how to do this. But anyway, you heard mine. And there's others who say that. Okay. Okay.","zh":"顺便说一句，我曾经被谷歌某个人骂过，他说，这完全错了。他说，我们所做的工作，你知道的，有趣的事情是在大规模下出现的，对吧？而且，你知道的，这听起来应该很深奥。这是真的。好的，但没关系。所以，他们说，不，我们在大规模下实现。我会说，那很好。我只是说，对于如何做到这一点，存在不同的观点。但无论如何，你听到了我的观点。还有其他人持类似观点。好的，好的。","start":3747.52,"end":3776.52},{"id":217,"text":"So, you know, you can always do cool stuff like you can work out and simplify the optimality conditions in dual. That's, you know, honestly, in most cases, that doesn't actually have any practical use because you're going to solve it and stuff. So you don't need to worry about that. And in some cases, there's some rare cases, but it's actually kind of interesting because, you know, it's kind of cool to say, hey, guess what? We get prices automatically. We get energy prices, you know, in 15 minute intervals.","zh":"所以，你知道的，你总是可以做一些很酷的事情，比如你可以推导并简化对偶问题的最优性条件。说实话，在大多数情况下，这实际上并没有什么实际用途，因为你会直接去解决它。所以你不用担心这些。在一些情况下，有一些罕见的情况，但其实还挺有趣的，因为你可以这么说，嘿，猜猜看？我们自动得到了价格。我们得到了每15分钟间隔的能源价格。","start":3777.93,"end":3805.77},{"id":218,"text":"at all these different nodes. There you go. This is like $87 per megawatt hour from 2 to 2.15 p.m. at this node. So there are cases where it's actually really useful to understand the dual and work it out. In other cases, though, it's mostly there to...","zh":"在所有这些不同的节点上。就是这样。在这个节点上，从下午2点到2点15分，电价是每兆瓦时87美元。所以在一些情况下，实际上理解对偶问题并进行推导是非常有用的。但在其他情况下，它主要是用来……","start":3806.51,"end":3822.01},{"id":219,"text":"interpret your you know i mean actually to impress your friends right because you can then you can sound really you don't really care you you would say oh i i'm designing this thing and that you'd say what the dual is and they go like god that's awesome that's cool do you use that to solve it and you're like no but anyway so okay um now uh so it turns out once you understand all the convex stuff and are pretty","zh":"解释你的，你知道的，实际上是为了向朋友展示，因为你可以然后说，哦，我正在设计这个东西，你会说对偶是什么，他们就会说，天哪，这太棒了，这很酷，你用它来解决这个问题吗？你会说不，不过反正好了，嗯，所以事实上，一旦你理解了所有的凸优化内容并且已经掌握得相当好了，","start":3822.71,"end":3844.25}],"notes":["本段讨论了凸优化在实际应用中的挑战，强调了使用高级工具的重要性。教授提到，研究生应感激这些工具的存在，因为它们简化了复杂问题的解决过程。","教授提到，使用这些工具时，应从简单的模型和小规模问题实例开始，使用低效的方法进行快速原型设计。这种方法有助于理解问题的结构，而不必一开始就追求高效。","教授指出，有人认为在大规模问题中，有趣的现象会自然出现，但教授认为这种观点并不总是正确。他强调，即使在小规模问题上表现不佳，也不应期望在大规模问题上表现良好。","教授提到，理解对偶问题的最优条件在某些情况下非常有用，例如在能源定价中，可以自动获得价格信息。但在其他情况下，对偶问题更多是为了展示知识或在朋友面前炫耀。","教授还提到，对偶问题的使用在某些实际场景中确实有其价值，例如在电力市场中，可以获取不同节点的电价信息。然而，在大多数情况下，对偶问题的实际应用有限。","教授最后提到，一旦掌握了凸优化的基本概念，就可以在实际问题中应用这些知识，但需要根据具体情况决定是否深入研究对偶问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3668.2,"end":3844.25,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3668.2,"text":"Some, you know, and it was not, it's not easy. I mean, they would have like Mosaic or some commercial solver, who knows, or some other one. They'd be writing like C, C++ and basically stuffing matrices by themselves. Everyone following this, it would not be fun. I would come in the next morning, all well rested. I'd say, hey, how'd it go? And they go, oh, we implemented it. And I go, cool. How's it work? And they go, not too well. And I go, oh, well, I got another great idea."},{"start":3694.4,"text":"So everyone so so I think actually it's basically like grad students who should be most grateful for the existence of these these high-level tools Right because they were the there that I believe the chief beneficiaries. Okay Okay, so, you know, how do you use it? I mean people have different ideas about this, but these are just sort of mine You know basically"},{"start":3719.08,"text":"I'd start with this rapid prototyping, right? So you start with really simple models, small problem instances, and you can use some inefficient method. I mean, it doesn't matter. By the way, if you don't like the results there, then you just, you say, you know, if someone else is saying like, it's never going to scale, it's never going to scale. What are you doing? If you don't like what it does with problems with a thousand or 10,000 variables, then why on earth would you think you're going to like what it does for a million or a hundred million, right?"},{"start":3747.52,"text":"By the way, there's some people I got yelled at by someone at Google who once said, that's so wrong. He said, the things we work on, you know, the interesting things emerge at scale, right? And that's, you know, supposed to sound really deep and all that. It's true. Okay, but it's fine. So, and they like, no, we implement at scale. And I'm like, well, good for you. So I'm just saying there's diversity of opinions about how to do this. But anyway, you heard mine. And there's others who say that. Okay. Okay."},{"start":3777.93,"text":"So, you know, you can always do cool stuff like you can work out and simplify the optimality conditions in dual. That's, you know, honestly, in most cases, that doesn't actually have any practical use because you're going to solve it and stuff. So you don't need to worry about that. And in some cases, there's some rare cases, but it's actually kind of interesting because, you know, it's kind of cool to say, hey, guess what? We get prices automatically. We get energy prices, you know, in 15 minute intervals."},{"start":3806.51,"text":"at all these different nodes. There you go. This is like $87 per megawatt hour from 2 to 2.15 p.m. at this node. So there are cases where it's actually really useful to understand the dual and work it out. In other cases, though, it's mostly there to..."},{"start":3822.71,"text":"interpret your you know i mean actually to impress your friends right because you can then you can sound really you don't really care you you would say oh i i'm designing this thing and that you'd say what the dual is and they go like god that's awesome that's cool do you use that to solve it and you're like no but anyway so okay um now uh so it turns out once you understand all the convex stuff and are pretty"}],"speech_gaps":[],"frame":"../frames/v018/023.webp","frame_time":3680.2},{"title":"街头技巧与凸近似方法","segments":[{"id":220,"text":"Fluent with it. You can do all sorts of crazy stuff like by repeatedly forming and solving a convex approximation. We actually just did that over here, right? So these are just super good methods to know about. Yeah, and there's I mean there's a lot of street fighting tricks and someday I'm actually gonna put a","zh":"熟练掌握它。你可以做各种疯狂的事情，比如反复地构建和求解一个凸近似。我们刚才在这里就是这样做的，对吧？所以这些只是非常好的方法，值得了解。是的，而且我的意思是，有很多街头技巧，有一天我实际上会把一个讲座专门用来讲这些街头技巧。我让每个人都签了保密协议，规定在任何情况下都不能透露他们是从哪里学到这些技巧的，而且如果他们指认我，我也会否认。总之，我还没这么做，但确实有一些很酷的技巧，我的意思是，我随便给你举一个例子。","start":3844.73,"end":3862.65},{"id":221,"text":"maybe a lecture together on street fighting tricks. I'd had everyone sign an NDA saying that under no circumstances could they divulge where they learn these things and that I would deny it if they pointed at me. Anyway, so I haven't done that yet, but there's really cool, I mean, I just give you one for fun. Here's an example.","zh":"你去实习，有人对你说，生成一些最小燃料消耗的轨迹，把东西从这里移动到那里。你就会说，好啊。请告诉我燃料的使用情况。他们就说，哦，没问题。因为去年有一个实习生，然后他们就把一些这么厚的东西堆在你的桌子上，或者随便什么，对吧？然后他们就说，就是这些。然后他们开始谈论热力学，还有N1和N2，以及这些涡轮机和它们过去的回流。你就会说，啊，像这样，不管怎样。","start":3863.42,"end":3882.12},{"id":222,"text":"you go on an internship and someone says, generate me minimum fuel trajectories that move this thing from here to there. And you go, cool. Please tell me about the fuel use. And they go, oh yeah, no problem. Because an intern last year, and then they dump something this thick on your desk or whatever it is, right? And they go, yeah, that's it. And then they start talking about like thermodynamics and, you know, N1 and N2 and these turbines and their reflux in the past. And you're like, ah, like, you know, anyway.","zh":"你去实习，有人对你说，生成一些最小燃料消耗的轨迹，把这东西从这里移动到那里。你回应说，好啊。请告诉我燃料的使用情况。他们说，哦，没问题。因为去年有一个实习生，然后他们就把一些这么厚的东西丢在你的桌子上，或者随便什么，对吧？然后他们说，是的，就是这样。然后他们开始谈论热力学，还有N1和N2以及这些涡轮机，还有它们过去的回流。你就会想，啊，像这样，不管怎样。","start":3882.84,"end":3910.38},{"id":223,"text":"Then you say, do you have a simulator for it? And they go, yeah, we do. Then you set up a script to simulate it. And you find out that the fuel use looks like this. When you ask for... This is the thrust you're requesting. And this is it idling. And it looks something like this. It goes like that. Then there's actually something weird like that. Then it goes like that. And then it goes up like that.","zh":"大家都明白这一点，对吧？然后一个了解细节的人会说，嗯，我知道为什么。因为，当推力达到这个数量级时，他们会打开这些阀门，有一些... 我只是在编造。有一些气体流经这些第四级涡轮机。我不知道。我只是... 无论如何，它看起来会像这样，对吧？这就是你从模拟器中得到的。大家都跟上来了吗？好。任何... 现在你该怎么办？现在我们进入了完全的街头技巧模式。你该怎么办？首先，你所做的就是你说...","start":3911.38,"end":3938.24},{"id":224,"text":"Everybody got this, right? And then someone who knows the details would say, well, I know why. Because, okay, when you get up to this amount of thrust, they open these valves and there's some... I'm just making this up. There's some gas that flows over these fourth turbines. I don't know. I'm just... Anyway, but it would look like that, right? This would be the... This you got from a simulator. Everybody following this? Okay. Any... What would you do now? And now we're in full street fighting mode. What would you do? Well, first thing you do is you'd say...","zh":"大家都明白了吧？然后一个了解细节的人会说，嗯，我知道为什么。因为，好吧，当你达到这个推力水平时，他们会打开这些阀门，然后有一些……我随便说的，有一些气体流过这些第四级涡轮机。我不知道，我只是……总之，它看起来会是这样，对吧？这是从模拟器中得到的。大家跟上来了吗？好。任何……现在你会怎么做？现在我们进入完全的街头技巧模式。你会怎么做？嗯，首先你要说……","start":3938.76,"end":3967.56},{"id":225,"text":"It's not convex. Okay? I want a suggestion. Yeah, get a convex surrogate. Want me to make one for you? Okay, here's my convex surrogate. Ready? You just kind of go like that or something. It's fine. Okay? Now you solve the problem quickly. This, you can even fit this either by eyeball. If it's in one dimension, you do it by eyeball. And then you just solve it with this thing. It's fine. Right?","zh":"这不是凸的。好吗？我想要一个建议。是的，获取一个凸的替代函数。要我为你做一个吗？好的，这是我做的凸替代函数。准备好了吗？你只需要这样大致去做就可以了。没关系。好吗？现在你可以快速解决这个问题。如果是单变量的情况，你甚至可以用肉眼来拟合。然后你就可以用这个来解决问题。没关系。对吧？","start":3968.26,"end":3996.21},{"id":226,"text":"So everybody following this? So I'm just saying that, you know, that's not now. Not until you get your actual stamp certificate saying that you are, you know, you're now no longer a trainee or something. But when you get that certificate, you will you'll be allowed to. So don't do this for the next 10 days. But after that, you have license to do stuff like this. Right. So, OK. Everybody following this? So, OK.","zh":"大家明白这个意思吗？我只是说，你现在还不是。直到你拿到实际的证书，证明你已经不再是实习期或者类似的状态。但当你拿到这个证书后，你就可以被允许这么做。所以在接下来的10天内不要这么做。但过了之后，你就有资格去做这样的事情了。对吧。所以，好的。大家明白这个意思吗？所以，好的。","start":3996.83,"end":4022.85}],"notes":["本段讲授了凸优化在实际问题中的应用，特别是通过凸近似方法解决非凸问题。教授提到，当面对非凸问题时，可以使用凸近似方法来快速求解，这种方法在实际工程中非常有用。","教授举了一个关于最小燃料轨迹的实例，说明了在实际工作中如何利用凸近似方法。他提到，当面对复杂的非凸问题时，可以通过构建凸近似模型来简化问题，从而快速找到近似解。","教授强调了在实际应用中，凸近似方法的使用需要一定的经验，通常需要在获得正式认证后才能使用。这表明，虽然凸近似方法在理论上是强大的工具，但在实际应用中需要谨慎对待。","教授还提到，凸近似方法可以用于一维问题，通过目测来拟合曲线，这说明了在某些情况下，即使没有复杂的计算工具，也可以通过直观的方法来解决凸近似问题。","教授通过一个关于实习经历的例子，说明了在实际工作中如何应用凸近似方法。他提到，当面对复杂的非凸问题时，可以通过构建凸近似模型来简化问题，从而快速找到近似解。","教授还提到，使用凸近似方法需要一定的经验，通常需要在获得正式认证后才能使用。这表明，虽然凸近似方法在理论上是强大的工具，但在实际应用中需要谨慎对待。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3844.73,"end":4022.85,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3844.73,"text":"Fluent with it You can do all sorts of crazy stuff like by repeatedly forming and solving a convex approximation We actually just did that over here, right? So these are just super good methods to know about Yeah, and there's I mean there's a lot of street fighting tricks and someday I'm actually gonna put a"},{"start":3863.42,"text":"maybe a lecture together on street fighting tricks. I'd had everyone sign an NDA saying that under no circumstances could they divulge where they learn these things and that I would deny it if they pointed at me. Anyway, so I haven't done that yet, but there's really cool, I mean, I just give you one for fun. Here's an example."},{"start":3882.84,"text":"you go on an internship and someone says, generate me minimum fuel trajectories that move this thing from here to there. And you go, cool. Please tell me about the fuel use. And they go, oh yeah, no problem. Because an intern last year, and then they dump something this thick on your desk or whatever it is, right? And they go, yeah, that's it. And then they start talking about like thermodynamics and, you know, N1 and N2 and these turbines and their reflux in the past. And you're like, ah, like, you know, anyway."},{"start":3911.38,"text":"Then you say, do you have a simulator for it? And they go, yeah, we do. Then you set up a script to simulate it. And you find out that the fuel use looks like this. When you ask for... This is the thrust you're requesting. And this is it idling. And it looks something like this. It goes like that. Then there's actually something weird like that. Then it goes like that. And then it goes up like that."},{"start":3938.76,"text":"Everybody got this, right? And then someone who knows the details would say, well, I know why. Because, okay, when you get up to this amount of thrust, they open these valves and there's some... I'm just making this up. There's some gas that flows over these fourth turbines. I don't know. I'm just... Anyway, but it would look like that, right? This would be the... This you got from a simulator. Everybody following this? Okay. Any... What would you do now? And now we're in full street fighting mode. What would you do? Well, first thing you do is you'd say..."},{"start":3968.26,"text":"It's not convex. Okay? I want a suggestion. Yeah, get a convex surrogate. Want me to make one for you? Okay, here's my convex surrogate. Ready? You just kind of go like that or something. It's fine. Okay? Now you solve the problem quickly. This, you can even fit this either by eyeball. If it's in one dimension, you do it by eyeball. And then you just solve it with this thing. It's fine. Right?"},{"start":3996.83,"text":"So everybody following this? So I'm just saying that, you know, that's not now. Not until you get your actual stamp certificate saying that you are, you know, you're now no longer a trainee or something. But when you get that certificate, you will you'll be allowed to. So don't do this for the next 10 days. But after that, you have license to do stuff like this. Right. So, OK. Everybody following this? So, OK."}],"speech_gaps":[],"frame":"../frames/v018/024.webp","frame_time":3856.73},{"title":"课程后续内容与相关课程介绍","segments":[{"id":227,"text":"So there's a whole lot of stuff we didn't cover. And that's actually something I want to talk about, about what's next. So we didn't talk about this whole area of subgradient methods, stochastic subgradient methods. And you've probably seen this in a machine learning course or statistics course, I would imagine. And absolutely fascinating. So a lot of stuff there. Actually, all of these are taught in, I guess, several courses. And that's the next thing we're going to talk about.","zh":"所以，我们还有很多内容没有讲到。实际上，我想谈谈接下来的内容。我们没有讲到整个次梯度方法和随机次梯度方法的领域。你可能在机器学习课程或统计学课程中见过这些内容，我想是这样。这绝对是非常迷人的。那里有很多内容。实际上，所有这些内容都教授于几门课程中。接下来我们要谈的就是这些。","start":4024.93,"end":4052.91},{"id":228,"text":"So there's 364B. I think I actually have a list of courses here, but it's like way out of date yet. So this is completely and hideously out of date, but that's fine. I'll leave it up here anyway. So you have a couple of, you may never want g, right? Like you know if you know what what's the likelihood this person's gonna develop sepsis there. There we go Okay, so you have a bunch of data. You have a bunch of data. You have a bunch of data Yeah, obvious thing to do is I'd say could I could I please have all your data? So I would collect all your data","zh":"这真的很酷。我会告诉你它是如何运作的。你坐在一些数据上，你所在的医院也有一些数据。你并不想拟合一个模型，比如逻辑回归模型，对吧？比如你知道这个人是否会发展成脓毒症的概率。明白了，所以你有一堆数据。你有一堆数据。你有一堆数据。很明显该做的事就是，我请求你能给我所有的数据，对吧？所以我就会收集所有的数据","start":4141.94,"end":4168.78},{"id":233,"text":"and then fit a model, right? In distributed, the way it works in distributed convex options is very cool. It works like this. I don't get your data. I don't get your data. I don't get your data. But I coordinate you. So I'd say, you fit a logistic model on your own data. Everybody got that? Then all you do is you send your models to me.","zh":"然后拟合一个模型，对吧？在分布式凸优化中，它的运作方式非常酷。运作方式如下：我不会获取你的数据。我不会获取你的数据。我不会获取你的数据。但我可以协调你们。所以我可以说，你们各自在自己的数据上拟合一个逻辑模型。大家明白了吗？然后你们只需要把你们的模型发送给我。","start":4169.88,"end":4193.62}],"notes":["本段主要介绍了课程后续内容，包括未讲授的子梯度方法和随机子梯度方法，这些方法在机器学习和统计学课程中常见。讲者提到这些方法非常有趣，并指出这些内容将在后续课程364B中讲授。","讲者提到364B课程内容丰富，但依赖图不如当前课程线性。当前课程的依赖关系较为线性，而364B课程在掌握子梯度概念后，依赖图会变得更为广泛，涉及更多选择性主题。","364B课程教授的内容对解决大规模问题非常有用，例如图像重建和视频数据处理。这些问题使用CVXPy可能效率低下或无法处理，因此需要学习更有效的简单方法。","讲者提到分布式凸优化是一个有趣的主题，它允许在不集中所有数据的情况下进行模型拟合。例如，在医疗数据场景中，每个医院可以独立拟合模型，然后将结果汇总。","讲者强调分布式凸优化的实现方式，即每个节点在本地数据上拟合模型，然后将模型发送给协调者进行汇总。这种方式避免了数据集中化，提高了效率。","讲者提到在实际应用中，可能需要使用像Torch这样的工具来实现这些方法，但核心思想是学习如何高效处理大规模问题。"],"formulas":[],"uncertainties":["You're sitting on some data. You're sitting on some data and your hospitals and you have some data, too. And you're not I want to fit a model like I don't care a logistic regression model of something, right? Like you know if you know what what's the likelihood this person's gonna develop sepsis there. There we go."],"diagram":"none","start":4024.93,"end":4193.62,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4024.93," ks You're sitting on some data. You're sitting on some data and your hospitals and you have some data, too And you're not I want to fit a model like I don't care a logistic regression model of something, right? Like you know if you know what what's the likelihood this person's gonna develop sepsis there. There we go Okay, so you have a bunch of data. You have a bunch of data. You have a bunch of data Yeah, obvious thing to do is I'd say could I could I please have all your data? So I would collect all your data"},{"start":4169.88,"text":"and then fit a model, right? In distributed, the way it works in distributed convex options is very cool. It works like this. I don't get your data. I don't get your data. I don't get your data. But I coordinate you. So I'd say, you fit a logistic model on your own data. Everybody got that? Then all you do is you send your models to me."}],"speech_gaps":[],"frame":"../frames/v018/025.webp","frame_time":4036.93},{"title":"分布式优化与课程推荐","segments":[{"id":234,"text":"I do a very small amount of computation, and I send a message back to you. You plug another term into your models and refit. And this goes 10 steps, order magnitude. And at that point, we've converged on the same model. You actually have no idea how many other hospitals I'm talking to. But guess what? We just, together, solved this problem.","zh":"我只做了一点点计算，然后我给你发一条消息。你把另一个项加入你的模型并重新拟合。这个过程进行10次，数量级。到了那时，我们已经收敛到同一个模型上了。你实际上并不知道我在和多少家医院交谈。但猜猜看？我们刚刚一起解决了这个问题。","start":4194.24,"end":4223.22},{"id":235,"text":"that's identical to had I collected all of your data in one place and done it all once. Anyway, everyone get that? So that's in 364b. It's actually in a couple of other things. But these are pretty cool things. We didn't talk about it at all here. Not surprisingly, it uses ideas like duality and stuff like that. And the other one is 392f.","zh":"这和我收集了你们所有的数据在一个地方并一次性处理是一样的。总之，大家明白了吗？所以这在364b中。实际上它还出现在其他几个内容中。但这些都是相当酷的东西。我们在这里完全没有提到过。不出所料，它使用了像对偶性这样的概念。另一个是392f。","start":4 function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

ta.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
