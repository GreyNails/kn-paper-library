der the following situation, where you have, say, the final target is, let's say, a repeated application of many modules, many functions. Let's say you have this. Maybe I should just draw this once so that I don't have to draw it. Let's say you have x, which is mapped to m. You go through."}],"speech_gaps":[],"frame":"../frames/v051/010.webp","frame_time":1523.68},{"title":"反向传播中的链式法则与模块化计算","segments":[{"id":151,"text":"You go through some kind of modules, m1, and then you say you get u1. And then you go through some other modules or functions. I guess sometimes I call it modules because in PyTorch it's called modules. But it's really just a function. And then you get u2. And then maybe you'll get, you go through another function, m3. And then let's say you get the loss, something like this. So, and how does, so,","zh":"你通过一些模块，m1，然后你说你得到了u1。然后你通过一些其他模块或函数。我想有时候我称之为模块，因为在PyTorch中它被称为模块。但其实它只是一个函数。然后你得到u2。然后也许你会通过另一个函数，m3。然后假设你得到了损失，像这样。所以，那么，你是如何做的，所以，","start":1695.52,"end":1724.43},{"id":152,"text":"You do this forward computation. And how do you do the backward computation? The first thing you do is that you compute. So step one, you compute dj over du2. And how do you do this? This is just very simple. It's local. You just do some kind of differentiation. You have only one module, so it's easy. And now once you have this, then you use this to compute dj over du1.","zh":"你进行前向计算。你是如何进行反向计算的？第一步是你计算。第一步，你计算dj对du2的导数。你是如何做的？这很简单。它是局部的。你只需要进行某种微分。你只有一个模块，所以很容易。现在一旦你有了这个，你就用它来计算dj对du1的导数。","start":1725.02,"end":1753.99},{"id":153,"text":"And how do you do this? This is the backward for this M. So use chain rule. This is the same thing as we draw here. So you start with, you just assume this part as F. So we have the F and G. You assume this part is F and this part is G. And then you apply the chain rule on G, which is M2.","zh":"你是如何做的？这是这个M的反向计算。使用链式法则。这和我们在这里画的一样。你从假设这一部分为F开始。我们有F和G。你假设这一部分是F，这一部分是G。然后你在G上应用链式法则，也就是M2。","start":1755.49,"end":1780.33},{"id":154,"text":"I think probably I should have a notation here just to formalize this. So you can probably, I think people sometimes, in my lecture notes, I write this. I say dj of this is actual matrix multiplication. And the matrix multiplication is something like, is a function of g and z times dj over du. So you apply this backward function, which is","zh":"我想这里可能应该有一个符号来正式化这个过程。你可能可以，我想在我的讲义笔记中，我这样写。我说dj的这个是实际的矩阵乘法。矩阵乘法是某种关于g和z的函数，乘以dj对du的导数。你应用这个反向函数，","start":1782.3,"end":1806.18},{"id":155,"text":"This is a backward function that depends on the m2 and the variable u1. So these two information to compute the matrix here, which is the transpose Jacobian, and then do this backward path. And you get this one. And after you get this one, now you want to compute, suppose you want to compute dj over dx, right? So how do you do this? The same way, right? So now you pretend that this whole part,","zh":"这是一个依赖于m2和变量u1的反向函数。这两个信息用来计算这里的矩阵，即转置雅可比矩阵，然后进行这个反向路径。你得到这个结果。在你得到这个结果后，现在你想计算，假设你想计算dj对dx的导数，对吧？你是如何做的？同样的方式，对吧？现在你假装这一部分，","start":1807.25,"end":1838.96},{"id":156,"text":"It's my f. I don't really care about exactly what f is. And this part is my g. And I apply my chain rule. So my chain rule is saying that I can get dj over du, which is the same as this. That's my input. And I can get the output, which is the dj over dx.","zh":"它是我的f。我不关心f具体是什么。这一部分是我的g。我应用我的链式法则。我的链式法则是说，我可以得到dj对du，这和这个相同。这是我的输入。我可以得到输出，即dj对dx。","start":1839.4,"end":1860.62},{"id":157,"text":"So and here, again, you don't have to know anything about f.","zh":"在这里，同样，你不需要知道任何关于f的信息。","start":1863.16,"end":1867.12},{"id":158,"text":"You just have to know something about g.","zh":"你只需要知道一些关于g的信息。","start":1867.3,"end":1868.72},{"id":159,"text":"And the g here is m1.","zh":"这里的g是m1。","start":1869.4,"end":1870.58},{"id":160,"text":"You just have to apply this backward transformation, which","zh":"你只需要应用这个反向变换，","start":1870.72,"end":1874.32}],"notes":["本段讲解了反向传播的基本思想，即通过链式法则将损失函数对输入的梯度分解为各个模块的梯度。讲者提到，反向传播的过程是从损失函数开始，逐步计算每个模块的梯度，最终得到输入的梯度。讲者强调，每个模块的梯度计算是局部的，只需要知道该模块的输出和输入之间的关系。","讲者进一步说明了如何应用链式法则进行反向传播。他提到，反向传播的关键在于将整个计算过程分解为多个模块，每个模块的梯度可以通过链式法则计算。例如，讲者将整个计算过程分为F和G两部分，其中G是当前模块，而F是前面的模块。通过链式法则，可以将损失函数对输入的梯度分解为各个模块的梯度。","讲者提到，在反向传播过程中，需要使用到Jacobian矩阵的转置。Jacobian矩阵描述了模块的输出对输入的偏导数，而其转置则用于反向传播中的梯度计算。讲者指出，Jacobian矩阵的转置是计算反向传播路径的关键。","讲者还提到，反向传播的过程是模块化的，每个模块的梯度计算是独立的。例如，讲者提到，对于模块m1，只需要知道其输出和输入之间的关系，而不需要了解其内部的具体实现。这种模块化的思想使得反向传播可以应用于复杂的神经网络结构。","讲者强调，在反向传播过程中，只需要关注当前模块的梯度计算，而不需要了解前面模块的具体实现。这种思想使得反向传播可以逐步进行，而不需要一次性计算整个网络的梯度。","最后，讲者提到，反向传播的过程是通过应用链式法则逐步进行的，每个模块的梯度计算都是基于其前一个模块的梯度。这种逐步计算的方式使得反向传播可以高效地计算整个网络的梯度。"],"formulas":[],"uncertainties":["dj over du2","dj over du1","dj over dx","dj over du"],"diagram":"none","start":1695.52,"end":1874.32,"asr_flags":[],"math_clarifications":["原始片段中提到的反向传播过程涉及链式法则，但公式中的梯度乘积形式不正确，应使用链式法则的正确形式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":1695.52,"text":"You go through some kind of modules, m1, and then you say you get u1. And then you go through some other modules or functions. I guess sometimes I call it modules because in PyTorch it's called modules. But it's really just a function. And then you get u2. And then maybe you'll get, you go through another function, m3. And then let's say you get the loss, something like this. So, and how does, so,"},{"start":1725.02,"text":"You do this forward computation. And how do you do the backward computation? The first thing you do is that you compute. So step one, you compute dj over du2. And how do you do this? This is just very simple. It's local. You just do some kind of differentiation. You have only one module, so it's easy. And now once you have this, then you use this to compute dj over du1."},{"start":1755.49,"text":"And how do you do this? This is the backward for this M. So use chain rule. This is the same thing as we draw here. So you start with, you just assume this part as F. So we have the F and G. You assume this part is F and this part is G. And then you apply the chain rule on G, which is M2."},{"start":1782.3,"text":"I think probably I should have a notation here just to formalize this. So you can probably, I think people sometimes, in my lecture notes, I write this. I say dj of this is actual matrix multiplication. And the matrix multiplication is something like, is a function of g and z times dj over du. So you apply this backward function, which is"},{"start":1807.25,"text":"This is a backward function that depends on the m2 and the variable u1. So these two information to compute the matrix here, which is the transpose Jacobian, and then do this backward path. And you get this one. And after you get this one, now you want to compute, suppose you want to compute dj over dx, right? So how do you do this? The same way, right? So now you pretend that this whole part,"},{"start":1839.4,"text":"It's my f. I don't really care about exactly what f is. And this part is my g. And I apply my chain rule. So my chain rule is saying that I can get dj over du, which is the same as this. That's my input. And I can get the output, which is the dj over dx."},{"start":1863.16,"text":"So and here, again, you don't have to know anything about f."},{"start":1867.3,"text":"You just have to know something about g."},{"start":1869.4,"text":"And the g here is m1."},{"start":1870.72,"text":"You just have to apply this backward transformation, which"}],"speech_gaps":[],"frame":"../frames/v051/011.webp","frame_time":1707.52},{"title":"反向传播中的操作与链式法则","segments":[{"id":161,"text":"is related to m1 and the variable x.","zh":"它与m1和变量x有关。","start":1874.32,"end":1877.38},{"id":162,"text":"And you apply it in some cases to the matrix.","zh":"你可以在某些情况下将其应用于矩阵。","start":1878.68,"end":1881.18},{"id":163,"text":"You apply it on this vector.","zh":"你将其应用于这个向量。","start":1881.32,"end":1882.32},{"id":164,"text":"You get the dj over dx.","zh":"你得到dj对x的导数。","start":1882.44,"end":1886.18},{"id":165,"text":"x. Does it make sense? And of course, you can do it with many, many layers. Here I'm only","zh":"x。这有意义吗？当然，你也可以处理很多层。这里我只","start":1886.18,"end":1898.22},{"id":166,"text":"showing three functions, but you can compose it with any number of functions. You just","zh":"展示了三个函数，但你可以将其与任意数量的函数组合。你只需","start":1898.22,"end":1902.44},{"id":167,"text":"keep going backward from the beginning. And for example, another thing is that all of these","zh":"从开始一直向后进行。例如，另一个情况是，所有这些","start":1902.44,"end":1910.74},{"id":168,"text":"modules doesn't have to be the same. They can be all different. Maybe one module here","zh":"模块不必相同。它们可以全部不同。也许这里有一个模块","start":1910.74,"end":1915.94},{"id":169,"text":"one of these G is matching replication and one of these is the activation functions.","zh":"这些G中有一个对应复制操作，另一个则是激活函数。","start":1916.62,"end":1923.36},{"id":170,"text":"Activation functions, for example, you can have, you can say, I start with my X, I first","zh":"激活函数，例如，你可以这样说，我从我的X开始，首先","start":1923.72,"end":1933.72},{"id":171,"text":"I get u2, and then you can do another matching multiplication, and you get u3, maybe you","zh":"我得到u2，然后你可以进行另一次匹配乘法，得到u3，也许你","start":1933.72,"end":1941.56},{"id":172,"text":"I get u2, and then you can do another matching multiplication, and you get u3, maybe you","zh":"我得到u2，然后你可以进行另一次匹配乘法，得到u3，也许你","start":1942.22,"end":1951.04},{"id":173,"text":"do a layer norm, something like that.","zh":"进行层归一化，类似这样的操作。","start":1951.04,"end":1952.94},{"id":174,"text":"You can do arbitrary number of this, and then finally you get j.","zh":"你可以进行任意数量的这种操作，最后你得到j。","start":1953.66,"end":1956.4},{"id":175,"text":"And the same thing, you just have to go backward, but for each of the individual functions,","zh":"同样的，你只需要反向进行，但对于每一个单独的函数，","start":1956.96,"end":1962.44},{"id":176,"text":"you have to use the different kind of like a Jacobian in some sense to do the backward.","zh":"你都需要使用某种意义上的雅可比矩阵来进行反向计算。","start":1962.6,"end":1968.1},{"id":177,"text":"So basically, next we can compute what is the specific","zh":"所以基本上，接下来我们可以计算具体的","start":1968.1,"end":1973.6},{"id":178,"text":"There is a specific backward function for the matrix verification. There is a specific one for the activation functions. Each of them has different Jacobians here. So different mapping. And we can compute each of them. And once we have all of them, we just compose and get the backward path.","zh":"对于矩阵验证有一个特定的反向函数。对于激活函数也有一个特定的反向函数。这里每个函数都有不同的雅可比矩阵。因此是不同的映射。我们可以计算每一个。一旦我们有了所有的这些，我们只需要将它们组合起来，就能得到反向传播的路径。","start":1974.94,"end":2001.58},{"id":179,"text":"Any questions? So one thing I kind of like I cheat a little bit is that it's not like I really cheat, but like what is the variable here we're talking about? It sounds like I'm kind of like trying to tell you that this is the variable I'm trying to differentiate with respect to, right? But if I draw a new artwork, do I really care about differentiating with respect to x?","zh":"有问题吗？所以有一点我有点作弊，但其实并不是真的作弊，而是这里我们讨论的变量是什么？听起来我好像是在告诉你，这是我要对它求导的变量，对吧？但如果我画一幅新的画，我真的会关心对x求导吗？","start":2006.71,"end":2034.0}],"notes":["本段讲解了反向传播中如何对不同操作进行求导，强调了每个操作需要使用不同的雅可比矩阵。例如，复制操作和激活函数需要不同的处理方式。","讲者提到，反向传播可以应用于任意数量的层，只需从输出开始逐层回溯。每个操作的雅可比矩阵不同，因此需要分别计算。","在具体操作中，例如复制、激活函数、乘法和层归一化，都需要单独处理其对应的雅可比矩阵，然后将这些矩阵组合起来得到完整的反向传播路径。","讲者还提到，反向传播的计算过程需要明确变量，例如对x进行求导，但有时可能需要考虑其他变量，如输入或参数。","讲者通过举例说明了如何将多个操作组合起来，形成一个完整的反向传播路径，强调了每个操作的独立性和组合性。","最后，讲者询问是否有问题，暗示了课程中可能存在的疑问点，例如变量选择和雅可比矩阵的具体应用。"],"formulas":[{"latex":"\\frac{\\partial j}{\\partial x}","symbols":"对j关于x的偏导数","explanation":"该公式正确表示了j对x的偏导数，符合数学表达规范。","evidence":"You get the dj over dx."},{"latex":"\\text{Jacobian}","symbols":"雅可比矩阵","explanation":"该术语正确表示了雅可比矩阵，符合数学表达规范。","evidence":"you have to use the different kind of like a Jacobian in some sense to do the backward."}],"uncertainties":["matching replication","matrix verification"],"diagram":"none","start":1874.32,"end":2034.0,"asr_flags":[],"math_clarifications":["原文中未提供具体的数学公式或表达式，因此无法进一步核对数学内容。"],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":1874.32,"text":"is related to m1 and the variable x."},{"start":1878.68,"text":"And you apply it in some cases to the matrix."},{"start":1881.32,"text":"You apply it on this vector."},{"start":1882.44,"text":"You get the dj over dx."},{"start":1886.18,"text":"x. Does it make sense? And of course, you can do it with many, many layers. Here I'm only"},{"start":1898.22,"text":"showing three functions, but you can compose it with any number of functions. You just"},{"start":1902.44,"text":"keep going backward from the beginning. And for example, another thing is that all of these"},{"start":1910.74,"text":"modules doesn't have to be the same. They can be all different. Maybe one module here"},{"start":1916.62,"text":"one of these G is matching replication and one of these is the activation functions."},{"start":1923.72,"text":"Activation functions, for example, you can have, you can say, I start with my X, I first"},{"start":1933.72,"text":"do a matching replication and I get some U1 and then I do a sigma, the activation functions,"},{"start":1942.22,"text":"I get u2, and then you can do another matching multiplication, and you get u3, maybe you"},{"start":1951.04,"text":"do a layer norm, something like that."},{"start":1953.66,"text":"You can do arbitrary number of this, and then finally you get j."},{"start":1956.96,"text":"And the same thing, you just have to go backward, but for each of the individual functions,"},{"start":1962.6,"text":"you have to use the different kind of like a Jacobian in some sense to do the backward."},{"start":1968.1,"text":"So basically, next we can compute what is the specific"},{"start":1974.94,"text":"function, this mapping, for each of the specific operations. There is a specific backward function for the matrix verification. There is a specific one for the activation functions. Each of them has different Jacobians here. So different mapping. And we can compute each of them. And once we have all of them, we just compose and get the backward path."},{"start":2006.71,"text":"Any questions? So one thing I kind of like I cheat a little bit is that it's not like I really cheat, but like what is the variable here we're talking about? It sounds like I'm kind of like trying to tell you that this is the variable I'm trying to differentiate with respect to, right? But if I draw a new artwork, do I really care about differentiating with respect to x?"}],"speech_gaps":[],"frame":"../frames/v051/012.webp","frame_time":1886.32},{"title":"反向传播中的参数梯度计算","segments":[{"id":180,"text":"I don't really necessarily care about that. Sometimes I do. But generally speaking, I care about the differentiation with respect to the parameters. But actually, that still follows the same thing. The only thing is that you have to think of the variables. Basically, this graph of computation becomes a little more complicated. So what happens is that if you have parameters, so what happens is that you have, maybe let's think about this.","zh":"我其实并不真的特别关心这个。有时候我会关心。但总的来说，我关心的是关于参数的微分。但实际上，这仍然遵循同样的原理。唯一不同的是你必须考虑变量。基本上，这个计算图会变得稍微复杂一些。所以发生的情况是，如果你有参数，那么会发生的是，也许我们可以这样思考。","start":2034.45,"end":2061.64},{"id":181,"text":"has parameters, let's say, theta. Let's say theta is the collection of the weight matrices and the biases. And in some sense, the way you think about it is that you think of this as like, you can think of this function as two inputs. One is theta, and one is x.","zh":"假设这些参数是θ。假设θ是权重矩阵和偏置的集合。在某种意义上，你可以这样思考：你可以将这个函数视为两个输入。一个是θ，一个是x。","start":2065.17,"end":2089.37},{"id":182,"text":"Okay? So, and now, suppose I already know, so I already told you how to, so, like I already told you how we compute dj over du1, right? Because that's just a very simple sequential kind of backward, right? So,","zh":"明白吗？现在，假设我已经知道，我已经告诉你如何计算dj对du1的导数，对吧？因为这只是一个非常简单的顺序反向计算，对吧？所以，","start":2091.58,"end":2111.64},{"id":183,"text":"And now, how do I compute dj over d theta? Maybe let's even call this theta 1, because each of these modules, each of these has different parameters. How do I compute dj over d theta 1? It's the same thing. It's just that here, you don't view x as variable inputs. You view theta as inputs. So then you compute the","zh":"现在，如何计算dj对dθ的导数？也许我们甚至可以称这个为θ1，因为每个模块都有不同的参数。如何计算dj对dθ1的导数？这和之前是一样的。只是在这里，你不把x视为变量输入，而是把θ视为输入。因此，你计算的是","start":2112.35,"end":2132.67},{"id":184,"text":"the relationship. So basically, you want to find a way to relate this to dj over d theta 1. But it's the same thing. You just view x as the fixed. And you view this function as a function that maps theta 1 to u1. And then you compute the gradient with respect to theta 1. So basically, the input, the data, the raw data versus the parameters, they are just different matrices, in some sense, different tensors.","zh":"它们之间的关系。基本上，你想要找到一种方法将这个与dj对dθ1的关系联系起来。但本质上是一样的。你只需把x视为固定，把这个函数视为从θ1映射到u1的函数，然后计算相对于θ1的梯度。基本上，输入、数据、原始数据与参数，它们只是在某种意义上不同的矩阵，不同的张量。","start":2133.34,"end":2159.1},{"id":185,"text":"So in some sense, I think if you write it abstractly, it's really just that this thing is equal to this backward function, which depends on the machine verification. And you view the theta 1 as the inputs. And then you apply this to u1. So that's how you compute the derivative with respect to the parameters.","zh":"所以在某种意义上，我认为如果你抽象地写出这个，它实际上就等于这个反向函数，它依赖于机器验证。然后你把θ1视为输入，然后将这个应用到u1上。这就是如何计算相对于参数的导数。","start":2160.51,"end":2187.31}],"notes":["本段讲解了在反向传播过程中如何计算参数的梯度。讲者指出，计算参数梯度与计算输入变量梯度的原理相同，只是将输入变量视为固定，而将参数视为输入。这表明在反向传播中，无论输入是数据还是参数，梯度计算的基本方法是一致的。","讲者提到，参数通常包括权重矩阵和偏置，这些参数被收集为一个整体，称为θ。在计算梯度时，需要将θ视为输入，而将数据视为固定，从而计算梯度。这说明在反向传播中，参数和数据在梯度计算中的角色是不同的。","讲者强调，梯度计算的关键在于将函数视为从参数到输出的映射，并计算该映射的梯度。这表明反向传播的核心思想是通过链式法则，将输出对参数的梯度分解为多个中间步骤的梯度乘积。","讲者提到，参数和数据在计算中被视为不同的张量，这说明在反向传播中，参数和数据的处理方式是不同的，参数需要被显式地进行梯度计算，而数据则被视为固定的输入。","讲者指出，反向传播的计算过程可以抽象为一个依赖于机器验证的后向函数，这表明反向传播的计算过程需要依赖于网络结构和参数的定义。","最后，讲者总结了如何计算参数的梯度，即通过将函数视为从参数到输出的映射，并计算该映射的梯度。这表明反向传播的核心思想是通过链式法则，将输出对参数的梯度分解为多个中间步骤的梯度乘积。"],"formulas":[],"uncertainties":["machine verification"],"diagram":"none","start":2034.45,"end":2187.31,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2034.45,"text":"I don't really necessarily care about that. Sometimes I do. But generally speaking, I care about the differentiation with respect to the parameters. But actually, that still follows the same thing. The only thing is that you have to think of the variables. Basically, this graph of computation becomes a little more complicated. So what happens is that if you have parameters, so what happens is that you have, maybe let's think about this."},{"start":2065.17,"text":"has parameters, let's say, theta. Let's say theta is the collection of the weight matrices and the biases. And in some sense, the way you think about it is that you think of this as like, you can think of this function as two inputs. One is theta, and one is x."},{"start":2091.58,"text":"Okay? So, and now, suppose I already know, so I already told you how to, so, like I already told you how we compute dj over du1, right? Because that's just a very simple sequential kind of backward, right? So,"},{"start":2112.35,"text":"And now, how do I compute dj over d theta? Maybe let's even call this theta 1, because each of these modules, each of these has different parameters. How do I compute dj over d theta 1? It's the same thing. It's just that here, you don't view x as variable inputs. You view theta as inputs. So then you compute the"},{"start":2133.34,"text":"the relationship. So basically, you want to find a way to relate this to dj over d theta 1. But it's the same thing. You just view x as the fixed. And you view this function as a function that maps theta 1 to u1. And then you compute the gradient with respect to theta 1. So basically, the input, the data, the raw data versus the parameters, they are just different matrices, in some sense, different tensors."},{"start":2160.51,"text":"So in some sense, I think if you write it abstractly, it's really just that this thing is equal to this backward function, which depends on the machine verification. And you view the theta 1 as the inputs. And then you apply this to u1. So that's how you compute the derivative with respect to the parameters."}],"speech_gaps":[],"frame":"../frames/v051/013.webp","frame_time":2046.45},{"title":"反向传播的两个阶段与计算过程","segments":[{"id":186,"text":"Backpropagation actually has these two phases. And these two phases can interleave with each other. Maybe let me just try to... Let me see whether I can... What's the best way for me to draw this? I think let me erase here. It's a bit challenging for me because my nose is vertical and here I need to turn it into horizontal. So let's say more precisely, I think with a lot of notations,","zh":"反向传播实际上包含这两个阶段。这两个阶段可以相互交错进行。也许让我试着……让我看看我该如何……最好的方法是什么？我想让我在这里擦掉。这对我来说有点挑战性，因为我的鼻子是垂直的，而这里我需要把它变成水平的。所以更准确地说，我想使用大量的符号，","start":2192.24,"end":2240.14},{"id":187,"text":"I think what happens is that you have x, you have some matrix map application, and there's parameter theta 1, let's say, and you map this to maybe u1, and you use maybe a sigma, and then you get to u2, and then use another matrix map application to theta 2, and then get to u3, and then you probably get another sigma.","zh":"我想发生的情况是，你有x，你有一些矩阵映射应用，然后有参数θ₁，比如说，你将这个映射到可能的u₁，然后你使用可能的σ函数，然后得到u₂，然后使用另一个矩阵映射应用到θ₂，然后得到u₃，然后你可能还会得到另一个σ函数。","start":2242.73,"end":2272.84},{"id":188,"text":"so on and so forth. And eventually, you get maybe j. Maybe let's write the last one as metric application. So let's say you get uk and then j, something like this. And you start with dj over duk. By the way, all of these u's are the intermediate variables, the activations, the so-called activations. They are not parameters. And the parameters are folded in the metric application. So the first path you do, the first","zh":"如此反复。最终，你可能得到j。也许让我们把最后一个写成度量应用。比如说，你得到u_k，然后得到j，类似这样的结构。你从dj对duk开始。顺便说一下，所有的u都是中间变量，即激活值，所谓的激活值。它们不是参数。参数被包含在度量应用中。因此，你进行的第一个阶段或路径是，反向路径是尝试计算相对于中间变量、相对于u_i、相对于激活值的导数。你从这里开始，然后进行反向计算以得到u_{k-1}。然后你继续这样，如此反复。你得到u，比如说，3。然后你计算这个的反向导数。你得到了dj对du₂。","start":2274.15,"end":2305.16},{"id":189,"text":"phase or path you do is that the backward path is that you try to compute the derivatives with respect to the intermediate variables, with respect to the UIs, with respect to the activations. So you start with this, and then you do a backward to get u k minus 1. And then you do this, so on and so forth. And you get u, say, 3. And then you compute the backward of this. You got dj over du2.","zh":"你进行的阶段或路径是，反向路径是你尝试计算相对于中间变量、相对于UIs、相对于激活值的导数。因此你从这里开始，然后进行反向计算以得到u k减1。接着你进行这个过程，如此反复。你得到u，比如说3。然后你计算这个的反向导数。你得到了dj关于u2的导数。","start":2306.22,"end":2335.26},{"id":190,"text":"So and so forth. That's the first round. And then once you have this, you can have a branch, in some sense, that computes the derivative with respect to parameters. For example, from this, you can compute. And with some information about this, you can compute dj over d theta 1. And how do you compute dj over d theta 2? In some sense, you view theta 2 as a .. So basically,","zh":"如此反复。这是第一轮。一旦你有了这个，你就可以在某种意义上分支出来，计算相对于参数的导数。例如，从这里你可以计算。并且通过一些关于这个的信息，你可以计算dj对dθ₁。那么如何计算dj对dθ₂？某种意义上，你可以将θ₂视为……基本上，","start":2335.91,"end":2362.77}],"notes":["本段讲解了反向传播的两个阶段，即计算中间变量的梯度和参数的梯度。第一阶段是计算中间变量（如u1, u2等）的梯度，从输出j开始，通过链式法则逐步计算到输入x。中间变量被称为激活值，不是参数，参数是通过矩阵映射应用中的参数（如theta1, theta2）来表示的。","在第一阶段中，反向传播通过计算dj/d(uk)来逐步计算到dj/d(u_{k-1})，并以此类推，直到计算到dj/d(u3)和dj/d(u2)。这表明反向传播是通过链式法则逐步计算梯度的过程。","第二阶段是计算参数的梯度，例如从中间变量的梯度计算出dj/d(theta1)和dj/d(theta2)。这表明反向传播不仅计算中间变量的梯度，还通过这些梯度来更新参数。","讲者提到theta2被视为某种参数，但未明确说明其具体形式，这可能是因为在实际计算中，参数的梯度计算需要结合具体的网络结构和激活函数。"],"formulas":[{"latex":"\\frac{\\partial j}{\\partial u_k}","symbols":"对输出j关于中间变量u_k的梯度","explanation":"公式正确，表示对输出j关于中间变量u_k的梯度。","evidence":"so on and so forth. And eventually, you get maybe j. Maybe let's write the last one as metric application. So let's say you get uk and then j, something like this. And you start with dj over duk. By the way, all of these u's are the intermediate variables, the activations, the so-called activations. They are not parameters. And the parameters are folded in the metric application. So the first path you do, the first"},{"latex":"\\frac{\\partial j}{\\partial u_{k-1}}","symbols":"对中间变量u_{k-1}的梯度","explanation":"公式正确，表示对中间变量u_{k-1}的梯度。","evidence":"phase or path you do is that the backward path is that you try to compute the derivatives with respect to the intermediate variables, with respect to the UIs, with respect to the activations. So you start with this, and then you do a backward to get u k minus 1. And then you do this, so on and so forth. And you get u, say, 3. And then you compute the backward of this. You got dj over du2."},{"latex":"\\frac{\\partial j}{\\partial \\theta_1}","symbols":"对参数theta1的梯度","explanation":"公式正确，表示对参数theta1的梯度。","evidence":"So and so forth. That's the first round. And then once you have this, you can have a branch, in some sense, that computes the derivative with respect to parameters. For example, from this, you can compute. And with some information about this, you can compute dj over d theta 1. And how do you compute dj over d theta 2? In some sense, you view theta 2 as a .. So basically,"},{"latex":"\\frac{\\partial j}{\\partial \\theta_2}","symbols":"对参数theta2的梯度","explanation":"公式正确，表示对参数theta2的梯度。","evidence":"So and so forth. That's the first round. And then once you have this, you can have a branch, in some sense, that computes the derivative with respect to parameters. For example, from this, you can compute. And with some information about this, you can compute dj over d theta 1. And how do you compute dj over d theta 2? In some sense, you view theta 2 as a .. So basically,"}],"uncertainties":["theta2被视为某种参数，但未明确说明其具体形式"],"diagram":"none","start":2192.24,"end":2362.77,"asr_flags":[],"math_clarifications":["所有公式均正确，符合梯度下降和反向传播的数学表示，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2192.24,"text":"Backpropagation actually has these two phases. And these two phases can interleave with each other. Maybe let me just try to... Let me see whether I can... What's the best way for me to draw this? I think let me erase here. It's a bit challenging for me because my nose is vertical and here I need to turn it into horizontal. So let's say more precisely, I think with a lot of notations,"},{"start":2242.73,"text":"I think what happens is that you have x, you have some matrix map application, and there's parameter theta 1, let's say, and you map this to maybe u1, and you use maybe a sigma, and then you get to u2, and then use another matrix map application to theta 2, and then get to u3, and then you probably get another sigma."},{"start":2274.15,"text":"so on and so forth. And eventually, you get maybe j. Maybe let's write the last one as metric application. So let's say you get uk and then j, something like this. And you start with dj over duk. By the way, all of these u's are the intermediate variables, the activations, the so-called activations. They are not parameters. And the parameters are folded in the metric application. So the first path you do, the first"},{"start":2306.22,"text":"phase or path you do is that the backward path is that you try to compute the derivatives with respect to the intermediate variables, with respect to the UIs, with respect to the activations. So you start with this, and then you do a backward to get u k minus 1. And then you do this, so on and so forth. And you get u, say, 3. And then you compute the backward of this. You got dj over du2."},{"start":2335.91,"text":"So and so forth. That's the first round. And then once you have this, you can have a branch, in some sense, that computes the derivative with respect to parameters. For example, from this, you can compute. And with some information about this, you can compute dj over d theta 1. And how do you compute dj over d theta 2? In some sense, you view theta 2 as a .. So basically,"}],"speech_gaps":[],"frame":"../frames/v051/014.webp","frame_time":2204.24},{"title":"反向传播中的梯度计算与计算图优化","segments":[{"id":191,"text":"So basically, you need to go from here to get dj over d theta 2. Because you think of this as a function that maps theta 2 to u3, right? Theta 2 to u3 is the analog of the g here. And you already have the, so basically, in some sense, I guess I'm repeating myself a little bit, but just to.","zh":"所以基本上，你需要从这里得到 dj 对 d theta 2 的导数。因为你可以把这看作是一个将 theta 2 映射到 u3 的函数，对吧？theta 2 到 u3 就像这里的 g。你已经拥有这个，所以基本上，在某种意义上，我想我有点重复了，但只是为了。","start":2364.81,"end":2387.21},{"id":192,"text":"make it maximally clear. So you view this part of the things as f in that abstract way. And you say, I'm going to view this as a function theta 2 going to u. So you view this part as g. And then that's how you compute from dj over du to dj over d theta 2.","zh":"让这个变得尽可能清晰。所以你把这部分内容以抽象的方式看作 f。然后你说，我要把这部分看作一个从 theta 2 到 u 的函数。你把这部分看作 g。然后你就可以通过这种方式计算从 dj 对 du 到 dj 对 d theta 2 的导数。","start":2387.74,"end":2410.66},{"id":193,"text":"And this is really like some kind of backward function of this machine application, i theta 2, and multiply it with the dj. And you can do the same thing here. Maybe here you can do dj over d theta, I guess, k minus 2. This will give you dj over d theta k minus 1.","zh":"这实际上就像是这个机器应用的某种反向函数，i theta 2，然后乘以 dj。你也可以在这里做同样的事情。也许在这里你可以计算 dj 对 d theta，我猜是 k 减 2。这将给你 dj 对 d theta k 减 1 的导数。","start":2411.1,"end":2436.18},{"id":194,"text":"And you can see that this gradient with respect to the, so to compute the gradient with respect to the first ways, you have to go through this chain and then get here, right? Because this row is what we really care about, the derivative with respect to the parameters. So to get the last one, you always have to go compute all the derivatives with respect to activations. But for the first gradient of the","zh":"你可以看到，相对于这里的梯度，为了计算相对于第一个参数的梯度，你必须通过这个链式计算，然后得到这里，对吧？因为这一行是我们真正关心的，即相对于参数的导数。所以为了得到最后一个梯度，你总是必须计算所有相对于激活值的导数。但对于第一个参数的梯度，","start":2446.99,"end":2472.53},{"id":195,"text":"the gradient with respect to the first parameters,","zh":"相对于第一个参数的梯度，","start":2474.65,"end":2477.21},{"id":196,"text":"you don't have to go through this whole chain of calculation.","zh":"你不需要经过这个完整的计算链。","start":2477.35,"end":2479.55},{"id":197,"text":"Once you get this, you can get here.","zh":"一旦你得到了这个，你就可以得到这里。","start":2480.27,"end":2481.69},{"id":198,"text":"That's why you can, in some sense, parallelize this.","zh":"这就是为什么你可以在某种意义上并行化这个过程。","start":2482.99,"end":2485.75},{"id":199,"text":"This is a higher-chain sequential,","zh":"这是一个更高阶的链式序列，","start":2486.07,"end":2487.85},{"id":200,"text":"but some of this can be done on the side,","zh":"但其中一些操作可以在后台进行，","start":2488.11,"end":2490.33},{"id":201,"text":"in some sense, in a parallel fashion.","zh":"在某种意义上，以并行的方式执行。","start":2491.09,"end":2492.53},{"id":202,"text":"Another thing is that, for example,","zh":"另一点是，例如，","start":2499.23,"end":2500.73},{"id":203,"text":"if you have computed all of this,","zh":"如果你已经计算了所有这些，","start":2500.77,"end":2502.25},{"id":204,"text":"this, then you can drop all of the calculation you have done","zh":"那么你可以丢弃在这里所做的所有计算","start":2502.25,"end":2505.87},{"id":205,"text":"here so that you can clear up your memory.","zh":"以便清理你的内存。","start":2505.87,"end":2507.91},{"id":206,"text":"And then this is a way to free your memories, so on and so","zh":"然后这就是一种释放你内存的方法，如此类推","start":2508.25,"end":2512.01},{"id":207,"text":"forth.","zh":"继续。","start":2512.01,"end":2512.15},{"id":208,"text":"So basically, how you compute this affects the system","zh":"所以基本上，你如何计算这个会影响系统","start":2512.57,"end":2518.49},{"id":209,"text":"perspective a lot, because which tensor depends on which","zh":"的视角，因为哪个张量依赖于哪个","start":2518.49,"end":2521.85},{"id":210,"text":"variable or which quantity depends on which quantity.","zh":"变量，或者哪个量依赖于哪个量。","start":2522.53,"end":2524.91},{"id":211,"text":"And the dependency between them is very subtle.","zh":"它们之间的依赖关系非常微妙。","start":2525.31,"end":2527.51},{"id":212,"text":"But once you understand the dependency, you can optimize how you compute them in what","zh":"但一旦你理解了这种依赖关系，你就可以优化如何计算它们的顺序，以及何时释放内存，何时与其他GPU通信，等等。","start":2527.51,"end":2535.03},{"id":213,"text":"order and when you free the memory, when you communicate with other GPUs, so on and so","zh":"顺序，当你释放内存时，当你与其他GPU通信时，等等。","start":2535.03,"end":2538.95},{"id":214,"text":"forth.","zh":"继续。","start":2538.95,"end":2539.11},{"id":215,"text":"So basically, eventually, all of those depends on this computational graph.","zh":"所以基本上，最终，所有这些都依赖于这个计算图。","start":2539.35,"end":2542.19}],"notes":["本段主要讲解反向传播中梯度计算的过程，强调了如何通过链式法则从输出层反向计算到输入层的梯度。讲者提到，计算梯度时需要将网络视为一个函数，将参数视为输入，输出视为函数值，从而通过链式法则计算梯度。同时，讲者指出，计算梯度时需要考虑参数之间的依赖关系，这影响了计算顺序和内存管理。"],"formulas":[],"uncertainties":["dj over d theta 2","dj over d theta k minus 1","the gradient with respect to the first ways","the gradient with respect to the first parameters","higher-chain sequential"],"diagram":"none","start":2364.81,"end":2542.19,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":2364.81,"text":"So basically, you need to go from here to get dj over d theta 2. Because you think of this as a function that math theta 2 to u3, right? Theta 2 to u3 is the analog of the g here. And you already have the, so basically, in some sense, I guess I'm repeating myself a little bit, but just to."},{"start":2387.74,"text":"make it maximally clear. So you view this part of the things as f in that abstract way. And you say, I'm going to view this as a function theta 2 going to u. So you view this part as g. And then that's how you compute from dj over du to dj over d theta 2."},{"start":2411.1,"text":"And this is really like some kind of backward function of this machine application, i theta 2, and multiply it with the dj. And you can do the same thing here. Maybe here you can do dj over d theta, I guess, k minus 2. This will give you dj over d theta k minus 1."},{"start":2446.99,"text":"And you can see that this gradient with respect to the, so to compute the gradient with respect to the first ways, you have to go through this chain and then get here, right? Because this row is what we really care about, the derivative with respect to the parameters. So to get the last one, you always have to go compute all the derivatives with respect to activations. But for the first gradient of the"},{"start":2474.65,"text":"the gradient with respect to the first parameters,"},{"start":2477.35,"text":"you don't have to go through this whole chain of calculation."},{"start":2480.27,"text":"Once you get this, you can get here."},{"start":2482.99,"text":"That's why you can, in some sense, parallelize this."},{"start":2486.07,"text":"This is a higher-chain sequential,"},{"start":2488.11,"text":"but some of this can be done on the side,"},{"start":2491.09,"text":"in some sense, in a parallel fashion."},{"start":2499.23,"text":"Another thing is that, for example,"},{"start":2500.77,"text":"if you have computed all of this,"},{"start":2502.25,"text":"this, then you can drop all of the calculation you have done"},{"start":2505.87,"text":"here so that you can clear up your memory."},{"start":2508.25,"text":"And then this is a way to free your memories, so on and so"},{"start":2512.01,"text":"forth."},{"start":2512.57,"text":"So basically, how you compute this affects the system"},{"start":2518.49,"text":"perspective a lot, because which tensor depends on which"},{"start":2522.53,"text":"variable or which quantity depends on which quantity."},{"start":2525.31,"text":"And the dependency between them is very subtle."},{"start":2527.51,"text":"But once you understand the dependency, you can optimize how you compute them in what"},{"start":2535.03,"text":"order and when you free the memory, when you communicate with other GPUs, so on and so"},{"start":2538.95,"text":"forth."},{"start":2539.35,"text":"So basically, eventually, all of those depends on this computational graph."}],"speech_gaps":[{"start":2493.264,"end":2496.176}],"frame":"../frames/v051/015.webp","frame_time":2376.81},{"title":"反向传播的具体计算","segments":[{"id":216,"text":"Any questions?","zh":"有任何问题吗？","start":2549.27,"end":2551.23},{"id":217,"text":"So now let's be even more concrete and compute","zh":"现在让我们更加具体一些，并进行计算","start":2567.51,"end":2571.55},{"id":218,"text":"compute what's the backward function for some specific g.","zh":"计算对于某个具体的g，其反向函数是什么","start":2571.55,"end":2577.37},{"id":219,"text":"So here, everything is abstract.","zh":"在这里，一切都是抽象的。","start":2577.67,"end":2579.19},{"id":220,"text":"We have g.","zh":"我们有g。","start":2579.39,"end":2579.85},{"id":221,"text":"And we have this abstract notation","zh":"并且我们有这种抽象的符号","start":2580.05,"end":2582.43},{"id":222,"text":"for this backward function, which","zh":"用于表示这个反向函数，","start":2582.43,"end":2584.01},{"id":223,"text":"But now, let's compute for the most concrete things, like for machine verification, what's the backward function for g?","zh":"但现在，让我们计算一些最具体的内容，例如对于机器验证，g的反向函数是什么","start":2584.01,"end":2585.95},{"id":224,"text":"But now, let's compute for the most concrete things,","zh":"但现在，让我们计算最具体的内容，","start":2586.25,"end":2589.63},{"id":225,"text":"like for machine verification, what's the backward function","zh":"比如在机器验证中，什么是g的反向函数","start":2589.71,"end":2591.89},{"id":226,"text":"for g?","zh":"呢？","start":2591.89,"end":2592.33},{"id":227,"text":"So let's go back to this notation.","zh":"所以让我们回到这种记号。","start":2597.49,"end":2599.33},{"id":228,"text":"of like a notation.","zh":"比如这种记号。","start":2599.33,"end":2600.57},{"id":229,"text":"So let's say suppose you have g, which is matrix multiplication.","zh":"所以假设你有一个g，它是矩阵乘法。","start":2600.83,"end":2603.53},{"id":230,"text":"So what does that mean?","zh":"这意味着什么？","start":2604.79,"end":2605.91},{"id":231,"text":"I think let's assume, say, g is equals to w times z plus a bias.","zh":"我想假设，比如说，g等于w乘以z加上一个偏置项。","start":2606.05,"end":2614.35},{"id":232,"text":"So and let's say z is of dimension,","zh":"所以，假设 z 的维度是,","start":2616.95,"end":2621.75},{"id":233,"text":"I guess I'm using this consistent notation, dimension m.","zh":"我想我在这里使用了一致的记号，维度 m。","start":2622.07,"end":2624.71},{"id":234,"text":"m, w is of dimension, say, n by m, and b is of dimension, n.","zh":"m，w 的维度是，比如说，n 乘以 m，而 b 的维度是 n。","start":2624.71,"end":2631.41},{"id":235,"text":"And here, one thing is that we have to think about,","zh":"在这里，有一点需要注意的是，","start":2633.91,"end":2636.93},{"id":236,"text":"and then we have some function f.","zh":"然后我们有一些函数 f。","start":2637.61,"end":2638.97},{"id":237,"text":"Your final loss function, j, is some f of, oh, I guess,","zh":"你的最终损失函数 j 是某个 f 的函数，哦，我想，","start":2641.07,"end":2650.35},{"id":238,"text":"probably I should say, let me use u here.","zh":"可能我应该说，让我用 u 这里。","start":2650.39,"end":2652.63},{"id":239,"text":"So g, this function is machine verification,","zh":"所以 g，这个函数是机器验证，","start":2652.83,"end":2656.09},{"id":240,"text":"but the variable I call u.","zh":"但是这个变量我称之为u。","start":2656.45,"end":2657.41},{"id":241,"text":"So eventually, I have a function f applied on u, which is j.","zh":"最终，我有一个函数f作用在u上，结果是j。","start":2658.05,"end":2661.65},{"id":242,"text":"So and as I said, you can view this as the input,","zh":"所以，正如我所说的，你可以将这个视为输入，","start":2662.51,"end":2668.47},{"id":243,"text":"or you can view this as the input.","zh":"或者你可以将这个视为输入。","start":2668.63,"end":2669.93},{"id":244,"text":"So let's view the z as the input and compute.","zh":"那么，让我们把z视为输入并进行计算。","start":2670.19,"end":2672.29},{"id":245,"text":"So let's say our goal is to say, given dj over du,","zh":"那么，让我们假设我们的目标是，给定dj对du的导数，","start":2672.85,"end":2676.51},{"id":246,"text":"we want to compute what is dj over dz.","zh":"我们想要计算的是dj对dz的导数。","start":2677.21,"end":2679.63},{"id":247,"text":"z. So that's the first task we are trying to do here. And how do we do that? We just plug in","zh":"z。因此，这是我们在这里要完成的第一个任务。我们该如何做到这一点呢？我们只需代入","start":2680.27,"end":2689.27},{"id":248,"text":"the abstract definition, the computation we had from the chain rule. So we know that dj over dz is this matrix times dj over du. And this matrix is this guy. So it's this matrix. So let's just plug in the values there.","zh":"这个抽象的定义，就是我们从链式法则中得到的计算。因此，我们知道了dj对dz的导数是这个矩阵乘以dj对du的导数。而这个矩阵就是这个矩阵。所以，我们只需在那里代入数值即可。","start":2690.07,"end":2726.5}],"notes":["本段讲解了反向传播的具体计算过程，以矩阵乘法为例，说明如何从损失函数对输出的导数推导出对输入的导数。讲者首先指出，反向传播的核心是链式法则，即通过计算损失函数对输出的导数，再乘以相应的雅可比矩阵的转置，从而得到对输入的导数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2549.27,"end":2726.5,"asr_flags":[],"math_clarifications":["公式中的\\frac{\\partial u}{\\partial z}应为\\frac{\\partial g}{\\partial z}，因为u是g的输出，而反向传播计算的是损失函数对输入z的导数，应基于g的导数进行计算。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":33,"raw_segments":[{"start":2549.27,"text":"Any questions?"},{"start":2567.51,"text":"So now let's be even more concrete and compute"},{"start":2571.55,"text":"compute what's the backward function for some specific g."},{"start":2577.67,"text":"So here, everything is abstract."},{"start":2579.39,"text":"We have g."},{"start":2580.05,"text":"And we have this abstract notation"},{"start":2582.43,"text":"for this backward function, which"},{"start":2584.01,"text":"is transpose of the Jacobian."},{"start":2586.25,"text":"But now, let's compute for the most concrete things,"},{"start":2589.71,"text":"like for machine verification, what's the backward function"},{"start":2591.89,"text":"for g?"},{"start":2597.49,"text":"So let's go back to this notation."},{"start":2599.33,"text":"of like a notation."},{"start":2600.83,"text":"So let's say suppose you have g, which is matrix multiplication."},{"start":2604.79,"text":"So what does that mean?"},{"start":2606.05,"text":"I think let's assume, say, g is equals to w times z plus a bias."},{"start":2616.95,"text":"So and let's say z is of dimension,"},{"start":2622.07,"text":"I guess I'm using this consistent notation, dimension m."},{"start":2624.71,"text":"m, w is of dimension, say, n by m, and b is of dimension, n."},{"start":2633.91,"text":"And here, one thing is that we have to think about,"},{"start":2637.61,"text":"and then we have some function f."},{"start":2641.07,"text":"Your final loss function, j, is some f of, oh, I guess,"},{"start":2650.39,"text":"probably I should say, let me use u here."},{"start":2652.83,"text":"So g, this function is machine verification,"},{"start":2656.45,"text":"but the variable I call u."},{"start":2658.05,"text":"So eventually, I have a function f applied on u, which is j."},{"start":2662.51,"text":"So and as I said, you can view this as the input,"},{"start":2668.63,"text":"or you can view this as the input."},{"start":2670.19,"text":"So let's view the z as the input and compute."},{"start":2672.85,"text":"So let's say our goal is to say, given dj over du,"},{"start":2677.21,"text":"we want to compute what is dj over dz."},{"start":2680.27,"text":"z. So that's the first task we are trying to do here. And how do we do that? We just plug in"},{"start":2690.07,"text":"the abstract definition, the computation we had from the chain rule. So we know that dj over dz is this matrix times dj over du. And this matrix is this guy. So it's this matrix. So let's just plug in the values there."}],"speech_gaps":[{"start":2631.81,"end":2633.51}],"frame":"../frames/v051/016.webp","frame_time":2561.27},{"title":"反向传播中的梯度计算","segments":[{"id":249,"text":"So here is the first output, wz plus b, the first dimension differentiated with respect to first variable. And here, this is the first output differentiated with respect to the last input, so on and so forth, something like this. So basically, this matrix is of the form","zh":"所以这里是第一个输出，wz加上b，对第一个变量进行求导的第一维。在这里，这是第一个输出对最后一个输入的求导，依此类推，类似这样的情况。基本上，这个矩阵的形式是","start":2727.64,"end":2760.44},{"id":250,"text":"Each entry is dw plus b, the j-th coordinate, which is the j-th output, differentiated with respect to the ith input.","zh":"每个元素是dw加上b的第j个坐标，也就是第j个输出，对第i个输入的求导。","start":2761.68,"end":2770.58},{"id":251,"text":"So this is one of the entries here. And let's compute this thing. So it's dzi. Let's expand wz plus b. The j-th entry of wz plus b is the, you know, let's write the bj first. And then what is the j-th entry of wz? It's just definition of matrix replication. You enumerate over the inner dimension, which is 1 to m. I have wjk.","zh":"所以这是这里的其中一个元素。现在让我们来计算这个量。它是dzi。让我们展开wz加上b。wz加上b的第j个元素是，你知道的，先写出bj。然后wz的第j个元素是什么呢？这是矩阵乘法的定义。你遍历内维，也就是从1到m。我有wjk。","start":2771.92,"end":2797.94},{"id":252,"text":"zk. So this is the j-th coordinate of wz. And now you want to differentiate this formula with respect to zi. And you see that many of these variables have something to do with zi. So zk has no derivative with respect to zi if k is not equal to i. So it's 0 if k is not equal to i.","zh":"zk。所以这是wz的第j个坐标。现在你想要对zi求导这个公式。你会发现，很多这些变量都与zi有关。如果k不等于i，那么zk对zi的导数是0。","start":2799.82,"end":2827.1},{"id":253,"text":"So you can drop all of those terms. And the only thing that is left is just bj has nothing to do with zi. So that doesn't have derivatives as well. So the only thing that is left is the term when k is equal to i. And this is a linear function of zi. So the derivative is just a constant in front of the linear terms, which is just wji.","zh":"所以你可以忽略所有这些项。剩下的只有bj与zi无关，因此它们的导数也不存在。剩下的只有当k等于i时的项。而这个项是zi的线性函数，导数就是这个线性项前面的常数，也就是wji。","start":2828.02,"end":2854.32},{"id":254,"text":"So basically, this matrix, the ij's entry is just equal to wji. So that means that you can simplify this dramatically. So if g is the matrix multiplication, then actually what happens is just that dj over dz is just equals w transpose times dj over du. So the backward function is just only a transpose.","zh":"所以基本上，这个矩阵的第ij个元素就等于wji。这意味着你可以极大地简化这个计算。如果g是矩阵乘法，那么实际上发生的是dj对dz的导数等于w的转置乘以dj对du的导数。反向传播函数只是转置。","start":2855.94,"end":2896.27}],"notes":["本段讲解了反向传播中梯度计算的具体过程，特别是如何对矩阵乘法后的结果进行求导。讲者首先指出，每个输出对输入的导数可以表示为一个矩阵，其中每个元素对应于特定的输出和输入的组合。","接着，讲者详细推导了如何计算这个导数，指出在矩阵乘法 wz + b 中，每个输出的第 j 个元素由 wjk 和 zk 组成，其中 k 是内层维度。在对 zi 求导时，只有当 k 等于 i 时，zk 才与 zi 有关，其他项的导数为零。","因此，最终的导数仅由 wji 决定，这表明梯度矩阵的第 ij 个元素等于 wji。这一结果简化了反向传播的计算，因为梯度矩阵可以表示为 w 的转置。","讲者进一步指出，这种简化意味着在反向传播中，梯度的计算可以仅通过矩阵的转置来实现，而不需要进行复杂的逐项计算。这为后续的反向传播算法提供了理论基础。"],"formulas":[{"latex":"\\frac{\\partial dz_j}{\\partial z_i} = w_{ji}","symbols":"dz_j 对 z_i 的导数等于权重矩阵 w 的第 j 行第 i 列的元素 w_{ji}。","explanation":"该公式正确表达了导数的计算，符合数学规范，无需修改。","evidence":"So you can drop all of those terms. And the only thing that is left is just bj has nothing to do with zi. So that doesn't have derivatives as well. So the only thing that is left is the term when k is equal to i. And this is a linear function of zi. So the derivative is just a constant in front of the linear terms, which is just wji."}],"uncertainties":[],"diagram":"none","start":2727.64,"end":2896.27,"asr_flags":[],"math_clarifications":["公式 0 和 2 中的符号使用不明确，缺少对导数和梯度的明确定义，因此无法核定其正确性，建议移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2727.64,"text":"So here is the first output, wz plus b, the first dimension differentiated with respect to first variable. And here, this is the first output differentiated with respect to the last input, so on and so forth, something like this. So basically, this matrix is of the form"},{"start":2761.68,"text":"Each entry is dw plus b, the j-th coordinate, which is the j-th output, differentiated with respect to the ith input."},{"start":2771.92,"text":"So this is one of the entries here. And let's compute this thing. So it's dzi. Let's expand wz plus b. The j-th entry of wz plus b is the, you know, let's write the bj first. And then what is the j-th entry of wz? It's just definition of matrix replication. You enumerate over the inner dimension, which is 1 to m. I have wjk."},{"start":2799.82,"text":"zk. So this is the j-th coordinate of wz. And now you want to differentiate this formula with respect to zi. And you see that many of these variables have something to do with zi. So zk has no derivative with respect to zi if k is not equal to i. So it's 0 if k is not equal to i."},{"start":2828.02,"text":"So you can drop all of those terms. And the only thing that is left is just bj has nothing to do with zi. So that doesn't have derivatives as well. So the only thing that is left is the term when k is equal to i. And this is a linear function of zi. So the derivative is just a constant in front of the linear terms, which is just wji."},{"start":2855.94,"text":"So basically, this matrix, the ij's entry is just equal to wji. So that means that you can simplify this dramatically. So if g is the matrix multiplication, then actually what happens is just that dj over dz is just equals w transpose times dj over du. So the backward function is just only a transpose."}],"speech_gaps":[],"frame":"../frames/v051/017.webp","frame_time":2739.64},{"title":"反向传播中的梯度计算","segments":[{"id":255,"text":"You just transpose your forward matrix, and you multiply that, and that's it. And similarly, you can compute the relationship between this and w and b. So the next thing we want to compute is that, what's the relationship between this? How does this relate to this? If you have dj over du, then what's the derivative with respect to w?","zh":"你只需转置你的前向矩阵，然后相乘，这样就完成了。同样，你也可以计算这个与w和b之间的关系。所以下一步我们要计算的是，这个之间有什么关系？它如何与这个相关联？如果你有dj对du的导数，那么对w的导数是什么？","start":2897.01,"end":2928.89},{"id":256,"text":"And w is your parameter. That's why you care about, that's what you care, for example, here. So w is your parameter. So when you have this, then you need to compute a derivative with the respective parameter. That's why you need to compute this. So that's the next question. And this is a bit more subtle because it's kind of like, it's just the notation is a little bit complicated. So again, what we care about is that,","zh":"w是你的参数。这就是你关心的，例如在这里。w是你的参数。因此，当你有这个时，你需要计算相对于该参数的导数。这就是你需要计算的原因。这就是下一个问题。这有点微妙，因为它有点像，只是记号有点复杂。所以再次，我们关心的是，","start":2929.58,"end":2959.31},{"id":257,"text":"We want to know what is... Let's just compute each of the i, w, i, j. And let's apply the chain rule. So when you apply the chain rule, you enumerate over all the possible UIs. So you say it's k from 1 to... Is this m or n? Let me see. Sorry. I think this is n. And you do dj over du k times...","zh":"我们想知道什么是……让我们计算每个i, w, i, j。让我们应用链式法则。当你应用链式法则时，你需要遍历所有可能的UI。因此，你会说这是从1到……这是m还是n？让我看看。抱歉。我想这是n。然后你对u_k进行dj的导数……","start":2960.82,"end":2993.42},{"id":258,"text":"u, k is really just w, z plus b, the k-th coordinate.","zh":"u_k其实就是w, z加上b的第k个坐标。","start":2996.17,"end":2999.89},{"id":259,"text":"And that is differentiated with respect to w, i, j.","zh":"并对w, i, j进行求导。","start":3000.95,"end":3006.79},{"id":260,"text":"So this is the chain rule.","zh":"这就是链式法则。","start":3007.03,"end":3008.07},{"id":261,"text":"Now, I'm not using a matrix modification","zh":"现在，我没有使用矩阵修改","start":3008.41,"end":3009.61},{"id":262,"text":"because it's a little bit tricky because this thing is kind","zh":"因为这有点棘手，因为这个东西是kind","start":3009.61,"end":3012.49},{"id":263,"text":"like the number of variables you are differentiating","zh":"比如你所求导的变量数量","start":3012.49,"end":3016.65},{"id":264,"text":"with respect to is kind of like a matrix.","zh":"关于其求导的变量有点像一个矩阵。","start":3016.79,"end":3020.37},{"id":265,"text":"with respect to is kind of like a matrix.","zh":"关于其求导的变量有点像一个矩阵。","start":3020.37,"end":3022.27},{"id":266,"text":"It's a two-dimensional.","zh":"它是一个二维的。","start":3022.43,"end":3023.11},{"id":267,"text":"So you need more tensor annotations","zh":"因此你需要更多的张量注释","start":3023.11,"end":3026.23},{"id":268,"text":"to write it in a more compact way.","zh":"以更紧凑的方式写出它。","start":3026.23,"end":3027.63},{"id":269,"text":"So that's why I'm just doing the more brute force way.","zh":"这就是为什么我正在采用更暴力的方法。","start":3027.77,"end":3029.99},{"id":270,"text":"And by the same thing, you just expand this thing.","zh":"同样地，你只需展开这个表达式。","start":3031.67,"end":3035.71},{"id":271,"text":"And let's look at what this means.","zh":"那么我们来看看这意味着什么。","start":3040.33,"end":3042.25},{"id":272,"text":"So this is the case coordinate is","zh":"所以这是坐标的情况是","start":3042.51,"end":3050.21},{"id":273,"text":"And it's equals to, you first look at the k-coordinate of Wz, which is Wks, Zs.","zh":"并且它等于，你首先查看 Wz 的 k 坐标，即 Wks, Zs。","start":3050.21,"end":3059.51},{"id":274,"text":"And then the k-coordinate of B, which is Bk.","zh":"然后是 B 的 k 坐标，即 Bk。","start":3059.77,"end":3062.93},{"id":275,"text":"And you are differentiating this quantity with respect to Wij.","zh":"并且你对 Wij 进行这个量的求导。","start":3064.09,"end":3068.25},{"id":276,"text":"And the only terms that is now zero is the case when k and s is equals to i and j.","zh":"并且现在唯一为零的项是当 k 和 s 等于 i 和 j 的情况。","start":3069.05,"end":3073.83}],"notes":["本段讲解了在反向传播过程中如何计算梯度，特别是关于如何对权重矩阵w进行求导。讲者提到需要应用链式法则，并且需要枚举所有可能的变量。在计算过程中，需要考虑权重矩阵的每个元素w_ij，以及如何通过链式法则将梯度传播到这些元素上。","讲者指出，当计算对w_ij的导数时，只有当k和s等于i和j时，对应的项才不为零。这说明在反向传播过程中，梯度的传播是局部的，只与特定的索引有关。","讲者提到，由于权重矩阵是二维的，因此需要使用张量标注来更紧凑地表示梯度计算过程。这表明在处理高维参数时，传统的矩阵运算可能不够，需要引入更高级的数学工具。","讲者强调，计算梯度的过程需要考虑每个变量的索引，并且在计算过程中，只有特定的项会对最终结果产生影响。这说明在反向传播中，梯度的计算是高度结构化的。","讲者提到，当计算对w_ij的导数时，需要考虑权重矩阵W和偏置向量b的各个分量。这表明在反向传播过程中，不仅需要考虑权重，还需要考虑偏置项对梯度的影响。","讲者指出，由于变量数量较多，直接计算梯度可能较为繁琐，因此采用更直接的暴力方法进行计算。这说明在实际应用中，可能需要权衡计算效率和实现复杂度。"],"formulas":[],"uncertainties":["k from 1 to... Is this m or n? Let me see. Sorry. I think this is n."],"diagram":"none","start":2897.01,"end":3073.83,"asr_flags":[],"math_clarifications":["原文中提到的公式和符号未明确定义，无法进行数学复核，因此所有公式均被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":2897.01,"text":"You just transpose your forward matrix, and you multiply that, and that's it. And similarly, you can compute the relationship between this and w and b. So the next thing we want to compute is that, what's the relationship between this? How does this relate to this? If you have dj over du, then what's the derivative with respect to w?"},{"start":2929.58,"text":"And w is your parameter. That's why you care about, that's what you care, for example, here. So w is your parameter. So when you have this, then you need to compute a derivative with the respective parameter. That's why you need to compute this. So that's the next question. And this is a bit more subtle because it's kind of like, it's just the notation is a little bit complicated. So again, what we care about is that,"},{"start":2960.82,"text":"We want to know what is... Let's just compute each of the i, w, i, j. And let's apply the chain rule. So when you apply the chain rule, you enumerate over all the possible UIs. So you say it's k from 1 to... Is this m or n? Let me see. Sorry. I think this is n. And you do dj over du k times..."},{"start":2996.17,"text":"u, k is really just w, z plus b, the k-th coordinate."},{"start":3000.95,"text":"And that is differentiated with respect to w, i, j."},{"start":3007.03,"text":"So this is the chain rule."},{"start":3008.41,"text":"Now, I'm not using a matrix modification"},{"start":3009.61,"text":"because it's a little bit tricky because this thing is kind"},{"start":3012.49,"text":"of like, to write it, because you have so many i, j's,"},{"start":3016.79,"text":"like the number of variables you are differentiating"},{"start":3020.37,"text":"with respect to is kind of like a matrix."},{"start":3022.43,"text":"It's a two-dimensional."},{"start":3023.11,"text":"So you need more tensor annotations"},{"start":3026.23,"text":"to write it in a more compact way."},{"start":3027.77,"text":"So that's why I'm just doing the more brute force way."},{"start":3031.67,"text":"And by the same thing, you just expand this thing."},{"start":3040.33,"text":"And let's look at what this means."},{"start":3042.51,"text":"So this is the case coordinate is"},{"start":3050.21,"text":"And it's equals to, you first look at the k-coordinate of Wz, which is Wks, Zs."},{"start":3059.77,"text":"And then the k-coordinate of B, which is Bk."},{"start":3064.09,"text":"And you are differentiating this quantity with respect to Wij."},{"start":3069.05,"text":"And the only terms that is now zero is the case when k and s is equals to i and j."}],"speech_gaps":[],"frame":"../frames/v051/018.webp","frame_time":2909.01},{"title":"反向传播中的梯度计算","segments":[{"id":277,"text":"All the other things have nothing to do with i and j, right?","zh":"所有其他内容都与i和j无关，对吧？","start":3074.89,"end":3077.53},{"id":278,"text":"there's no, it's all like the derivative is always zero. So that's why the only thing that is left","zh":"没有，导数总是为零。这就是为什么只剩下i和j项","start":3077.53,"end":3082.97},{"id":279,"text":"is the i and j term. And for the i and j term, when k is, so basically,","zh":"当k是，基本上，","start":3088.65,"end":3093.51},{"id":280,"text":"Okay, let me write them one more step. w, i, j, when k is i, i is j, right? z, j.","zh":"好的，让我再写一步。w, i, j，当k是i，i是j，对吧？z, j.","start":3093.69,"end":3100.21},{"id":281,"text":"So when k is not equal to i, this is just 0. And that means that this sum is going to be gone. So basically, this is just when k is equal to i, ui times this derivative. The linear coefficient is a linear term.","zh":"当k不等于i时，这只是一个0。这意味着这个求和项将消失。基本上，这只有当k等于i时，ui乘以这个导数。线性系数是一个线性项.","start":3110.89,"end":3134.86},{"id":282,"text":"The gradient is the linear coefficient and the coefficient is zi. So it's just zj. So maybe just to rewrite this, it's equals to... So this is very, very simple. Actually, this is called Hebbian rule in biology. So the way I remember this when I was a PhD was that you have this z1 up to zk.","zh":"梯度是线性系数，系数是zi。所以它就是zj。也许为了重新写出这个，它等于……所以这非常简单。实际上，这在生物学中被称为赫布规则。我记得当我读博士的时候，你有z1到zk.","start":3136.6,"end":3172.84},{"id":283,"text":"And you have this matrix amplification. And you get u1 up to un. And then you go through some network. You get j. So that's the picture. And this g part is kind of a matrix amplification. And sometimes people draw this matrix amplification by the dependency graph. So it's something like this. And you have one edge, which is like maybe","zh":"你有这个矩阵放大。然后你得到u1到un。然后你通过一些网络。你得到j。这就是图景。而这g部分有点像矩阵放大。有时人们用依赖图来画这个矩阵放大。所以它看起来像这样。你有一个边，比如说","start":3175.66,"end":3199.68},{"id":284,"text":"maybe one edge we say like this. So this is Ui, this is Zj. And this edge is Wij. And this edge, the weight is Wij on it. And the claim is that if you care about the gradient of this Wij, what is it equal to? It is equal to the gradient with respect to the Ui.","zh":"也许我们说这个边像这样。所以这是Ui，这是Zj。这条边是Wij。这条边的权重是Wij。主张是，如果你关心这个Wij的梯度，它等于什么？它等于对Ui的梯度。","start":3208.05,"end":3233.6}],"notes":["本段讲解了反向传播中梯度计算的关键点，即在计算权重Wij的梯度时，只有当k等于i时，才会产生非零项。其他情况下，梯度为零。这表明梯度仅与i和j有关，而与其他变量无关。","讲者提到，当k不等于i时，梯度为零，因此总和会被消除。这意味着梯度仅由k等于i时的项贡献，即ui乘以导数。这表明梯度计算中存在一个线性项，其系数为zi。","讲者进一步指出，梯度等于zj，这表明在反向传播过程中，权重的梯度与激活值zj直接相关。这种关系类似于生物学中的Hebbian规则，即神经元之间的连接强度与它们同时激活的频率成正比。","讲者通过矩阵放大和依赖图的概念，解释了梯度计算的直观图像。矩阵放大表示输入向量u1到un经过网络处理后得到输出j，而依赖图则展示了变量之间的关系。","讲者提到，依赖图中的一条边表示权重Wij，其权重为Wij。梯度计算的关键在于确定Wij的梯度等于对Ui的梯度，这表明梯度计算中存在一种直接的依赖关系。","讲者通过这些例子和解释，帮助学生理解反向传播中梯度计算的机制，以及如何通过依赖图和矩阵放大来直观地理解梯度的来源。"],"formulas":[],"uncertainties":[],"diagram":"dependency","start":3074.89,"end":3233.6,"asr_flags":[],"math_clarifications":["原文中提到的梯度与参数之间的关系不明确，未说明是关于哪个函数的梯度，因此无法准确判断公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3074.89,"text":"All the other things has nothing to do with i and j, right?"},{"start":3077.53,"text":"there's no, it's all like the derivative is always zero. So that's why the only thing that is left"},{"start":3088.65,"text":"is the i and j term. And for the i and j term, when k is, so basically,"},{"start":3093.69,"text":"okay, let me write them one more step. w, i, j, when k is i, i is j, right? z, j."},{"start":3110.89,"text":"So when k is not equal to i, this is just 0. And that means that this sum is going to be gone. So basically, this is just when k is equal to i, ui times this derivative. The linear coefficient is a linear term."},{"start":3136.6,"text":"The gradient is the linear coefficient and the coefficient is zi. So it's just zj. So maybe just to rewrite this, it's equals to... So this is very, very simple. Actually, this is called Hebbian rule in biology. So the way I remember this when I was a PhD was that you have this z1 up to zk."},{"start":3175.66,"text":"And you have this matrix amplification. And you get u1 up to un. And then you go through some network. You get j. So that's the picture. And this g part is kind of a matrix amplification. And sometimes people draw this matrix amplification by the dependency graph. So it's something like this. And you have one edge, which is like maybe"},{"start":3208.05,"text":"maybe one edge we say like this. So this is Ui, this is Zj. And this edge is Wij. And this edge, the weight is Wij on it. And the claim is that if you care about the gradient of this Wij, what is it equal to? It is equal to the gradient with respect to the Ui."}],"speech_gaps":[{"start":3100.928,"end":3102.832}],"frame":"../frames/v051/019.webp","frame_time":3086.89},{"title":"反向传播中的梯度计算与矩阵表示","segments":[{"id":285,"text":"the output it connects to, right here, times the raw input, Zj, on the other end of the edge. So I think in biology, they say this is the Heibing rule because the update to the synopsis, this is the synopsis, is the gradient, or sometimes they call the gradient as the error. So they say the error or the gradient of the","zh":"它连接到的输出，就在这里，乘以边另一端的原始输入 Zj。因此，我认为在生物学中，他们称之为 Heibing 规则，因为对摘要的更新，这就是摘要，是梯度，有时他们也将梯度称为误差。因此，他们说误差或梯度是","start":3234.13,"end":3262.73},{"id":286,"text":"one endpoint, the output side of the endpoint, the gradient of the UI times the value of the other endpoint. And in functions, it's just equal to this.","zh":"一个端点的梯度，端点的输出侧的梯度乘以另一端点的值。在函数中，它就等于这个。","start":3264.05,"end":3281.13},{"id":287,"text":"So this is very simple to compute. And if you use more kind of like a matrix notation, it's kind of like if you look at this, this is a matrix. It's really just equals to something like this times z transpose. If you drop the, you compact everything into one matrix notation. And what is interesting that this is rank one. So the gradient for one example and for one weight matrix is always rank one.","zh":"因此，这非常容易计算。如果你使用更像矩阵表示法，它有点像如果你看一下，这是一个矩阵。它实际上等于像这样的东西乘以 z 的转置。如果你将所有内容压缩成一个矩阵表示法。有趣的是，这个是秩一的。因此，对于一个示例和一个权重矩阵的梯度总是秩一的。","start":3281.96,"end":3309.88},{"id":288,"text":"And that's also another useful fact, which is used in some of the efficiency updates when people try to improve things efficiently. They use this fact that the gradient is always a rank 1 matrix, but only for one example. In reality, when you have multiple examples, it's not a rank 1 anymore, because you have to average over many examples. But for one example, one weight matrix is rank 1.","zh":"这也是另一个有用的事实，它被用于一些效率更新中，当人们试图高效地改进事物时。他们使用这个事实，即梯度始终是一个秩一矩阵，但仅适用于一个示例。实际上，当你有多个示例时，它就不再是秩一的，因为你必须对许多示例进行平均。但对于一个示例，一个权重矩阵是秩一的。","start":3310.3,"end":3336.68},{"id":289,"text":"What time is it? Any questions? And another thing that is much easier is how do you take the back propagation for those activations. So those activations, fundamentally, you just use the same thing. We can just compute them more easily. So how do you compute the backward for the activations? I guess you have seen the general","zh":"现在几点了？有什么问题吗？还有另一件事更容易，那就是如何对这些激活值进行反向传播。因此，这些激活值，本质上，你只需使用同样的方法。我们可以更容易地计算它们。因此，如何计算激活值的反向传播？我想你已经看到了一般的","start":3342.31,"end":3374.27},{"id":290,"text":"So if you can write it as a matrix multiplication, you should just write, let's say, suppose now let's have another case where u is equal to sigma z. The function g becomes a sigma, which is the activation function. And then we know that dj over dz is equal to this thing above. So basically, this matrix is...","zh":"如果你能将其写成矩阵乘法，你应该只需写，比如说，现在让我们考虑另一个情况，其中 u 等于 sigma z。函数 g 变成 sigma，即激活函数。然后我们知道 dj 对 dz 的导数等于上面的那个东西。因此，这个矩阵是……","start":3375.38,"end":3406.54}],"notes":["本段主要讲解反向传播中梯度的计算方式，指出梯度是通过连接的输出与输入的乘积来计算的。讲者提到生物学中将这一过程称为Heibing规则，可能是指某种神经元更新机制，但具体名称可能存在识别错误。梯度有时被称为误差，这表明在反向传播中，误差和梯度是同一概念的不同表述。","讲者进一步说明梯度的计算方式，指出梯度是某一端点的输出梯度乘以另一端点的值。在函数中，这一关系是直接成立的。这表明反向传播的计算过程是基于链式法则的，通过逐层计算梯度来更新参数。","讲者提到使用矩阵表示时，梯度可以表示为某个矩阵与z的转置相乘。这表明在反向传播中，矩阵运算可以简化计算过程。同时，讲者指出梯度矩阵的秩为1，这说明对于单个样本和单个权重矩阵，梯度矩阵具有特殊的结构。","讲者进一步说明梯度矩阵秩为1的性质在优化算法中具有实际应用价值，例如在提高计算效率时可以利用这一特性。然而，当处理多个样本时，梯度矩阵的秩不再是1，因为需要对多个样本进行平均。","讲者转向讨论激活函数的反向传播计算，指出激活函数的反向传播与权重的反向传播类似，可以通过相同的计算方式处理。这表明反向传播的计算过程在不同层之间具有一定的通用性。","讲者以激活函数σ(z)为例，说明如何通过矩阵乘法计算梯度。这表明在反向传播中，激活函数的导数是计算梯度的关键部分，而矩阵乘法可以简化这一过程。"],"formulas":[{"latex":"rank(gradient) = 1","symbols":"梯度矩阵的秩为1","explanation":"该公式描述了梯度矩阵的秩为1，适用于单个示例的情况，符合原文描述。","evidence":"So this is very simple to compute. And if you use more kind of like a matrix notation, it's kind of like if you look at this, this is a matrix. It's really just equals to something like this times z transpose. If you drop the, you compact everything into one matrix notation. And what is interesting that this is rank one. So the gradient for one example and for one weight matrix is always rank one."},{"latex":"u = \\sigma(z)","symbols":"u等于激活函数σ(z)","explanation":"该公式正确描述了激活函数的输入和输出关系，符合原文描述。","evidence":"So if you can write it as a matrix multiplication, you should just write, let's say, suppose now let's have another case where u is equal to sigma z. The function g becomes a sigma, which is the activation function. And then we know that dj over dz is equal to this thing above. So basically, this matrix is..."}],"uncertainties":["Heibing rule","UI"],"diagram":"none","start":3234.13,"end":3406.54,"asr_flags":[],"math_clarifications":["公式0、1、2和5未明确说明梯度的上下文和具体计算方式，无法核定。公式3和4符合原文描述，保留。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3234.13,"text":"the output it connects to, right here, times the raw input, Zj, on the other end of the edge. So I think in biology, they say this is the Heibing rule because the update to the synopsis, this is the synopsis, is the gradient, or sometimes they call the gradient as the error. So they say the error or the gradient of the"},{"start":3264.05,"text":"one endpoint, the output side of the endpoint, the gradient of the UI times the value of the other endpoint. And in functions, it's just equal to this."},{"start":3281.96,"text":"So this is very simple to compute. And if you use more kind of like a matrix notation, it's kind of like if you look at this, this is a matrix. It's really just equals to something like this times z transpose. If you drop the, you compact everything into one matrix notation. And what is interesting that this is rank one. So the gradient for one example and for one weight matrix is always rank one."},{"start":3310.3,"text":"And that's also another useful fact, which is used in some of the efficiency updates when people try to improve things efficiently. They use this fact that the gradient is always a rank 1 matrix, but only for one example. In reality, when you have multiple examples, it's not a rank 1 anymore, because you have to average over many examples. But for one example, one weight matrix is rank 1."},{"start":3342.31,"text":"What time is it? Any questions? And another thing that is much easier is how do you take the back propagation for those activations. So those activations, fundamentally, you just use the same thing. We can just compute them more easily. So how do you compute the backward for the activations? I guess you have seen the general"},{"start":3375.38,"text":"So if you can write it as a matrix multiplication, you should just write, let's say, suppose now let's have another case where u is equal to sigma z. The function g becomes a sigma, which is the activation function. And then we know that dj over dz is equal to this thing above. So basically, this matrix is..."}],"speech_gaps":[],"frame":"../frames/v051/020.webp","frame_time":3246.13},{"title":"反向传播中的矩阵乘法与对角矩阵","segments":[{"id":291,"text":"dji over dz. I guess maybe I don't have to. Let me just write out everything times this. And this matrix is much easier because this is element-wise application. So the i-th output doesn't really depend on the j-th input if i is not equal to j.","zh":"dji over dz。我想可能我就不需要了。让我把所有内容都写出来乘以这个。这个矩阵更容易处理，因为这是逐元素应用。如果i不等于j，第i个输出实际上并不依赖于第j个输入。","start":3409.9,"end":3457.19},{"id":292,"text":"So everything here is zero. Everything here is zero except the diagonal because there's no kind of dependencies between cross-terms. So the only thing that matters is this thing. And the first output was for the first input. That's just the sigma prime z1, right? And up to sigma prime z. I'm not sure what solution I have.","zh":"这里的所有内容都是零。这里的所有内容都是零，除了对角线，因为交叉项之间没有依赖关系。所以唯一重要的就是这个。第一个输出对应第一个输入，这就是sigma prime z1，对吧？一直到sigma prime z。我不确定我有什么解决方案。","start":3457.69,"end":3482.66},{"id":293,"text":"And everything else is 0. And then you just do this. So this is a diagonal matrix multiplication. You just multiply on the diagonal the derivative. All of this sigma here is a one-dimensional function. You just take the derivative of the one-dimensional function and put it on the diagonal. And you can also write this as, I think sometimes people write this as sigma prime.","zh":"其他所有内容都是零。然后你只需这样做。因此这是一个对角矩阵乘法。你只需在对角线上乘以导数。这里的所有sigma都是一个一维函数。你只需对这个一维函数求导，并将其放在对角线上。你也可以将此写成，我想有时候人们会写成sigma prime。","start":3484.11,"end":3509.64},{"id":294,"text":"z, which is this vector that collects everything on diagonal. And then you take the entrywise product of this with this. So this notation often means that you have two vectors. You take the entrywise product, and you still get a vector out of it. It's not inner product. Inner product means that you first take the entrywise product, and you sum everything. But here, you don't sum everything. You just list everything as a vector. And you can check these two things. It's the same thing.","zh":"z，这是一个收集所有内容在对角线上的向量。然后你将这个与这个进行逐元素相乘。这种记号通常意味着你有两个向量。你进行逐元素相乘，仍然得到一个向量。这不是内积。内积意味着你首先进行逐元素相乘，然后求和。但在这里，你并不求和，而是将所有内容作为一个向量列出。你可以检查这两个内容，它们是相同的。","start":3511.28,"end":3538.34},{"id":295,"text":"matching multiplication with a vector, if it's diagonal, you can rewrite it this way. So in some sense, you don't have to express the, you don't have to write down this matrix even. You just have to write down this vector. And maybe another thing is that it's good to probably recheck whether everything is efficient enough as we claimed. So the forward path is the same as the backward path. So let's see. So we have matching multiplication.","zh":"与向量相乘时，如果它是对角矩阵，你可以这样重写。因此，在某种意义上，你不需要表达这个，你也不需要写出这个矩阵。你只需写出这个向量。也许另一个需要注意的是，我们应重新检查是否所有内容都足够高效，正如我们所声称的那样。前向路径与反向路径是相同的。让我们看看。我们有匹配的乘法。","start":3539.54,"end":3567.75},{"id":296,"text":"The forward path computing function takes, if this matrix is m by n, it takes mn time, more or less. And let's check whether the backward thing always takes mn time. I think that's true because here, when you do the backward, you are multiplying the transpose of the matrix.","zh":"前向路径计算函数，如果这个矩阵是m乘n，它需要大约mn时间。让我们检查反向路径是否总是需要mn时间。我想这是正确的，因为在反向路径中，你进行的是矩阵的转置相乘。","start":3569.19,"end":3586.92}],"notes":["本段讲解了反向传播过程中，当矩阵为对角矩阵时，其乘法运算的简化方式。由于对角矩阵的非对角元素为零，因此在计算导数时，只需关注对角线上的元素，这大大简化了计算过程。","讲者提到，当矩阵为对角矩阵时，其乘法可以等价于向量的逐元素乘法，即每个元素的导数被放置在对角线上，从而避免了显式地写出整个矩阵。","在讨论向量的逐元素乘法时，讲者区分了逐元素乘法与内积的不同，指出前者只是将元素相乘后保留为向量，而后者则需要对结果求和。","讲者进一步指出，当矩阵为对角矩阵时，其乘法可以简化为向量的逐元素乘法，从而在反向传播中提高计算效率。","最后，讲者提到前向传播和反向传播的时间复杂度均为O(mn)，其中m和n分别为矩阵的行数和列数，这表明反向传播的计算效率与前向传播相当。","讲者强调了在反向传播过程中，对矩阵结构的正确理解对于计算效率和正确性的重要性。"],"formulas":[{"latex":"J = \\frac{\\text{d}f}{\\text{d}z} = \\text{diag}\\left(\\frac{\\text{d}f}{\\text{d}z_1}, \\frac{\\text{d}f}{\\text{d}z_2}, \\frac{\\text{d}f}{\\text{d}z_3}, \\frac{\\text{d}f}{\\text{d}z_n}\\right)","symbols":"J 是雅可比矩阵，表示函数 f 对输入 z 的导数，其形式为对角矩阵，对角线上的元素为每个输入 z_i 的导数。","explanation":"公式正确，雅可比矩阵表示函数对输入的导数，且形式为对角矩阵，符合对角矩阵的定义。","evidence":"So everything here is zero. Everything here is zero except the diagonal because there's no kind of dependencies between cross-quarens. So the only thing that matters is this thing. And the first output was for the first input. That's just the sigma prime z1, right? And up to sigma prime z. I'm not sure what solution I have. And everything else is 0. And then you just do this. So this is a diagonal matrix multiplication. You just multiply on the diagonal the derivative. All of this sigma here is a one-dimensional function. You just take the derivative of the one-dimensional function and put it on the diagonal. And you can also write this as, I think sometimes people write this as sigma prime."},{"latex":"J \\times x = \\text{diag}(J_1, J_2, \\dots, J_n) \\times x","symbols":"J 是对角矩阵，x 是向量，它们的乘积等价于对每个元素进行逐元素乘法。","explanation":"公式正确，对角矩阵与向量的乘积等价于逐元素乘法，符合矩阵乘法的定义。","evidence":"And everything else is 0. And then you just do this. So this is a diagonal matrix multiplication. You just multiply on the diagonal the derivative. All of this sigma here is a one-dimensional function. You just take the derivative of the one-dimensional function and put it on the diagonal. And you can also write this as, I think sometimes people write this as sigma prime. z, which is this vector that collects everything on diagonal. And then you take the entrywise product of this with this. So this notation often means that you have two vectors. You take the entrywise product, and you still get a vector out of it. It's not inner product. Inner product means that you first take the entrywise product, and you sum everything. But here, you don't sum everything. You just list everything as a vector. And you can check these two things. It's the same thing."},{"latex":"x \\times y = \\left[x_1 y_1, x_2 y_2, \\dots, x_n y_n\\right]^T","symbols":"x 和 y 是向量，它们的逐元素乘积结果仍然是一个向量，每个元素是对应位置的乘积。","explanation":"公式正确，逐元素乘积的结果是一个向量，符合向量运算的定义。","evidence":"z, which is this vector that collects everything on diagonal. And then you take the entrywise product of this with this. So this notation often means that you have two vectors. You take the entrywise product, and you still get a vector out of it. It's not inner product. Inner product means that you first take the entrywise product, and you sum everything. But here, you don't sum everything. You just list everything as a vector. And you can check these two things. It's the same thing."},{"latex":"J^T \\times x = \\text{diag}(J_1, J_2, \\dots, J_n) \\times x","symbols":"J 的转置与向量 x 的乘积等价于对角矩阵与向量的逐元素乘法。","explanation":"公式正确，对角矩阵的转置与向量的乘积等价于逐元素乘法，符合矩阵乘法的定义。","evidence":"matching multiplication with a vector, if it's diagonal, you can rewrite it this way. So in some sense, you don't have to express the, you don't have to write down this matrix even. You just have to write down this vector. And maybe another thing is that it's good to probably recheck whether everything is efficient enough as we claimed. So the forward path is the same as the backward path. So let's see. So we have matching multiplication."},{"latex":"T = O(mn)","symbols":"T 表示时间复杂度，前向传播和反向传播的时间复杂度均为 O(mn)，其中 m 和 n 分别为矩阵的行数和列数。","explanation":"公式正确，时间复杂度为 O(mn)，符合矩阵乘法的时间复杂度分析。","evidence":"The forward path computing function takes, if this matrix is m by n, it takes mn time, more or less. And let's check whether the backward thing always takes mn time. I think that's true because here, when you do the backward, you are multiplying the transpose of the matrix."}],"uncertainties":["cross-quarens"],"diagram":"none","start":3409.9,"end":3586.92,"asr_flags":[],"math_clarifications":["所有公式均符合数学定义，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3409.9,"text":"dji over dz. I guess maybe I don't have to. Let me just write out everything times this. And this matrix is much easier because this is element-wise application. So the i-th output doesn't really depend on the j-th input if i is not equal to j."},{"start":3457.69,"text":"So everything here is zero. Everything here is zero except the diagonal because there's no kind of dependencies between cross-quarens. So the only thing that matters is this thing. And the first output was for the first input. That's just the sigma prime z1, right? And up to sigma prime z. I'm not sure what solution I have."},{"start":3484.11,"text":"And everything else is 0. And then you just do this. So this is a diagonal matrix multiplication. You just multiply on the diagonal the derivative. All of this sigma here is a one-dimensional function. You just take the derivative of the one-dimensional function and put it on the diagonal. And you can also write this as, I think sometimes people write this as sigma prime."},{"start":3511.28,"text":"z, which is this vector that collects everything on diagonal. And then you take the entrywise product of this with this. So this notation often means that you have two vectors. You take the entrywise product, and you still get a vector out of it. It's not inner product. Inner product means that you first take the entrywise product, and you sum everything. But here, you don't sum everything. You just list everything as a vector. And you can check these two things. It's the same thing."},{"start":3539.54,"text":"matching multiplication with a vector, if it's diagonal, you can rewrite it this way. So in some sense, you don't have to express the, you don't have to write down this matrix even. You just have to write down this vector. And maybe another thing is that it's good to probably recheck whether everything is efficient enough as we claimed. So the forward path is the same as the backward path. So let's see. So we have matching multiplication."},{"start":3569.19,"text":"The forward path computing function takes, if this matrix is m by n, it takes mn time, more or less. And let's check whether the backward thing always takes mn time. I think that's true because here, when you do the backward, you are multiplying the transpose of the matrix."}],"speech_gaps":[],"frame":"../frames/v051/021.webp","frame_time":3421.9},{"title":"反向传播的计算复杂度","segments":[{"id":297,"text":"which is the same time as multiplying the original matrix. It's also mn time. And here, when we compute the gradient with respect to parameters, your output is mn matrix because you have mn entries here to output. You have derivatives with respect to each of the coordinates. And the computation here is the outer product. So it's something like a vector here times a vector here.","zh":"这与乘以原始矩阵所花的时间是相同的。这也是 mn 的时间。在这里，当我们计算相对于参数的梯度时，你的输出是一个 mn 矩阵，因为你在这里有 mn 个条目需要输出。你对每个坐标都有导数。这里的计算是外积。所以它类似于这里的一个向量乘以这里的另一个向量。","start":3587.6,"end":3613.4},{"id":298,"text":"And computing these two outer products takes mn time.","zh":"计算这两个外积需要 mn 的时间。","start":3614.42,"end":3617.08},{"id":299,"text":"You just have to populate the whole matrix by the product.","zh":"你只需要通过乘积来填充整个矩阵。","start":3617.2,"end":3620.18},{"id":300,"text":"So again, mn time.","zh":"所以同样，需要 mn 的时间。","start":3621.4,"end":3622.86},{"id":301,"text":"So the same as the forward.","zh":"所以和前向传播的时间是一样的。","start":3622.98,"end":3624.24},{"id":302,"text":"And here, the forward is faster because you","zh":"在这里，前向传播更快，因为","start":3624.6,"end":3627.04},{"id":303,"text":"apply element-wise applications of this activation function.","zh":"你应用的是这个激活函数的逐元素运算。","start":3627.04,"end":3632.48},{"id":304,"text":"So the forward path just takes all of m time","zh":"所以前向路径只需要 m 的时间。","start":3633.6,"end":3636.02},{"id":305,"text":"if this is m dimensional vector.","zh":"如果这是一个m维向量。","start":3636.02,"end":3637.42},{"id":306,"text":"And the backward path is the same of m time","zh":"而反向路径与m次相同","start":3637.82,"end":3640.64},{"id":307,"text":"because you just have to compute each of the derivatives,","zh":"因为你只需要计算每个导数，","s
