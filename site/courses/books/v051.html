</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】神经网络（二）反向传播 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v051.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v051","title":"【斯坦福CS229】神经网络（二）反向传播","course":"机器学习","pages":[{"title":"反向传播算法的计算","segments":[{"id":0,"text":"On Monday, we discussed neural network. We defined the definition of some components of neural networks and some of the typical neural networks, especially for computer vision. We will introduce the neural network architectures for language models when we talk about language models. And today, we're going to talk about backpropagation. As we said last time, this is the algorithm to compute.","zh":"星期一，我们讨论了神经网络。我们定义了神经网络的一些组成部分以及一些典型的神经网络，特别是用于计算机视觉的。当我们谈论语言模型时，我们将介绍语言模型的神经网络架构。今天，我们将谈论反向传播。正如我们上次所说，这是用于计算的算法。","start":5.14,"end":32.16},{"id":1,"text":"the gradient of the loss function with respect to parameters. So maybe just a very, very brief review. So the background you need from last lecture was that there is a function, let's call it the loss function or the cost function, which is the average of the cost function of individual examples. So each example i has a cost function. And this cost function is something like maybe a loss, maybe a cross entropy loss, for example.","zh":"损失函数相对于参数的梯度。所以也许只是非常、非常简短的回顾。因此，您需要从上次课程中了解的背景是，存在一个函数，我们称之为损失函数或成本函数，它是单个示例的成本函数的平均值。每个示例i都有一个成本函数。而这个成本函数可能是某种损失，例如交叉熵损失，等等。","start":32.77,"end":61.45},{"id":2,"text":"on some model output h theta of x, and some label y, and maybe the s input and the s label, something like this. So when you run SGD, the most simplistic version of SGD is that you update the parameter theta to theta minus some eta times the gradient. On some example, maybe it says the i sub k.","zh":"在某个模型输出h_theta(x)和某个标签y上，以及可能的输入s和标签s，类似这样的内容。当您运行SGD时，SGD的最简单版本是将参数theta更新为theta减去某个eta乘以梯度。在某个示例上，可能说i_sub_k。","start":63.97,"end":91.01},{"id":3,"text":"theta, where i sub k is sampled randomly from the data set. So something like this. And the key focus of this lecture is that how do we compute a gradient in this object? How do we compute a gradient efficiently with respect to the","zh":"theta，其中i_sub_k是从数据集中随机采样的。类似这样的内容。而本节课的重点是，如何计算这个对象的梯度？如何高效地计算相对于参数的梯度？","start":91.85,"end":111.33},{"id":4,"text":"on the parameters. So we know how to compute this last time. Suppose you have defined the model by combining many of the components. It's a multi-layer MLP with machine application, with some activation functions, many, many layers of that. It's a very complex network. That's what this guy is. And how do you compute the gradient of this function? This is just the same as this and same as this one. And how do you compute the gradient with respect to the parameter theta?","zh":"所以我们知道如何计算这个梯度，如上次所说。假设您通过组合许多组件来定义模型。这是一个多层MLP，用于机器应用，具有许多激活函数，许多这样的层。这是一个非常复杂的网络。这就是这个家伙的结构。而如何计算这个函数的梯度？这与这个和这个是一样的。而如何计算相对于参数theta的梯度？","start":111.98,"end":139.46},{"id":5,"text":"So that's the whole focus of this lecture, which is the most technical questions you can ask in deep learning these days. Because all the other things you cannot really objectively answer in many cases, like how do you tune learning rate, how do you design your data sets, all of those are somewhat subjective in some sense.","zh":"这就是本节课的全部重点，这是当今深度学习中最技术性的问题。因为其他所有问题在许多情况下都无法客观回答，例如如何调整学习率，如何设计您的数据集，所有这些在某种程度上都是主观的。","start":140.14,"end":164.98},{"id":6,"text":"So that's why I think there was a long time when all of these research labs, when they interview people, they ask how you do backpropagation. I think that's probably still the case for some of the frontier labs. I don't know exactly. So this is a non-trivial algorithm that's","zh":"所以这就是为什么我认为在很长一段时间里，所有这些研究实验室在面试人们时，都会问你是如何进行反向传播的。我认为对于一些前沿实验室来说，这可能仍然是这种情况。我不确定具体的情况。因此，这是一个非平凡的算法，","start":166.19,"end":183.09}],"notes":["本段主要讲解反向传播算法的核心问题，即如何高效地计算损失函数相对于参数的梯度。讲者指出，反向传播是深度学习中最关键的技术问题之一，因为其他如学习率调整、数据集设计等问题在很多情况下是主观的。","讲者提到，反向传播算法在很多研究实验室的面试中仍然被问及，这说明其重要性。反向传播算法是一个非平凡的算法，需要理解如何通过链式法则计算梯度。","在讲解反向传播时，讲者强调了梯度计算的复杂性，特别是当模型由多个层和激活函数组成时，如何有效地计算梯度。这涉及到链式法则的应用。","讲者提到，反向传播是计算损失函数相对于参数梯度的算法，这在随机梯度下降（SGD）中是关键步骤，因为参数更新依赖于梯度的计算。","讲者指出，反向传播是深度学习中最技术性的问题之一，因为其他问题如学习率调整和数据集设计在很多情况下是主观的，而反向传播则是客观且必须掌握的核心技术。","讲者还提到，反向传播算法的计算是基于链式法则，这需要对模型的结构和参数的依赖关系有清晰的理解。"],"formulas":[{"latex":"\\theta_{k+1} = \\theta_k - \\eta \\cdot \\nabla_{\\theta} L(x^{(i_k)}, y^{(i_k)})","symbols":"参数更新公式","explanation":"该公式表示随机梯度下降（SGD）的参数更新规则，其中 $\\theta$ 是模型参数，$\\eta$ 是学习率，$\\nabla_{\\theta} L(x^{(i_k)}, y^{(i_k)})$ 是损失函数关于参数的梯度，$i_k$ 是随机选择的样本索引。","evidence":"on some model output h theta of x, and some label y, and maybe the s input and the s label, something like this. So when you run SGD, the most simplistic version of SGD is that you update the parameter theta to theta minus some eta times the gradient. On some example, maybe it says the i sub k."},{"latex":"\\nabla_{\\theta} L = \\frac{1}{n} \\sum_{i=1}^{n} \\nabla_{\\theta} L(x^{(i)}, y^{(i)})","symbols":"损失函数的平均梯度","explanation":"该公式表示损失函数的平均梯度，其中 $L$ 是损失函数，$n$ 是样本数量，$\\nabla_{\\theta} L(x^{(i)}, y^{(i)})$ 是第 $i$ 个样本的损失函数关于参数的梯度。","evidence":"the gradient of the loss function with respect to parameters. So maybe just a very, very brief review. So the background you need from last lecture was that there is a function, let's call it the loss function or the cost function, which is the average of the cost function of individual examples. So each example i has a cost function. And this cost function is something like maybe a loss, maybe a cross entropy loss, for example."}],"uncertainties":["i sub k 是 sampled randomly from the data set 的具体实现方式可能不明确，但根据上下文可以推断为随机选择一个样本进行梯度计算。"],"diagram":"none","start":5.14,"end":183.09,"asr_flags":[],"math_clarifications":["公式中的 $\\theta$ 表示模型参数，$\\eta$ 是学习率，$L(x^{(i)}, y^{(i)})$ 是第 $i$ 个样本的损失函数。"],"boards":[{"title":"反向传播算法的核心问题","summary":"反向传播算法的核心问题是高效计算损失函数相对于参数的梯度。这是深度学习中最关键的技术问题之一，因为其他如学习率调整、数据集设计等问题在很多情况下是主观的。","relation":"推导顺序","conditions":"适用于多层神经网络，尤其是多层感知机（MLP）","pitfall":"混淆反向传播与前向传播，误以为反向传播是模型训练的全部","note_indices":[0,4,5],"formula_indices":[0,1],"source_ids":[0,5],"steps":["定义损失函数为所有样本损失的平均值。","使用链式法则计算损失函数相对于参数的梯度。","通过反向传播算法高效地计算梯度。","使用梯度下降更新模型参数。"],"nodes":[{"title":"损失函数定义","text":"损失函数是所有样本损失的平均值，用于衡量模型输出与真实标签的差异。"},{"title":"梯度计算","text":"使用链式法则计算损失函数相对于参数的梯度，这是反向传播的核心。"},{"title":"参数更新","text":"通过随机梯度下降（SGD）更新参数，使用学习率和梯度进行参数调整。"},{"title":"链式法则应用","text":"在多层网络中，链式法则用于逐层计算梯度，确保高效计算。"},{"title":"反向传播算法","text":"反向传播是计算梯度的算法，是深度学习中最关键的技术问题之一。"}],"id":"v051-001-1","start":5.14,"end":164.98,"formulas":[{"latex":"\\theta_{k+1} = \\theta_k - \\eta \\cdot \\nabla_{\\theta} L(x^{(i_k)}, y^{(i_k)})","symbols":"参数更新公式","explanation":"该公式表示随机梯度下降（SGD）的参数更新规则，其中 $\\theta$ 是模型参数，$\\eta$ 是学习率，$\\nabla_{\\theta} L(x^{(i_k)}, y^{(i_k)})$ 是损失函数关于参数的梯度，$i_k$ 是随机选择的样本索引。","evidence":"on some model output h theta of x, and some label y, and maybe the s input and the s label, something like this. So when you run SGD, the most simplistic version of SGD is that you update the parameter theta to theta minus some eta times the gradient. On some example, maybe it says the i sub k."},{"latex":"\\nabla_{\\theta} L = \\frac{1}{n} \\sum_{i=1}^{n} \\nabla_{\\theta} L(x^{(i)}, y^{(i)})","symbols":"损失函数的平均梯度","explanation":"该公式表示损失函数的平均梯度，其中 $L$ 是损失函数，$n$ 是样本数量，$\\nabla_{\\theta} L(x^{(i)}, y^{(i)})$ 是第 $i$ 个样本的损失函数关于参数的梯度。","evidence":"the gradient of the loss function with respect to parameters. So maybe just a very, very brief review. So the background you need from last lecture was that there is a function, let's call it the loss function or the cost function, which is the average of the cost function of individual examples. So each example i has a cost function. And this cost function is something like maybe a loss, maybe a cross entropy loss, for example."}],"formula_candidates_removed":0,"frame":"../board-frames/v051/001-1.webp","frame_time":17.64},{"title":"反向传播算法的重要性","summary":"反向传播算法在深度学习中至关重要，因为它允许高效计算损失函数相对于参数的梯度，这是模型训练的基础。该算法在许多研究实验室的面试中仍被问及，说明其重要性。","relation":"概念关系","conditions":"适用于所有需要梯度计算的深度学习模型","pitfall":"误以为反向传播是模型训练的唯一方法，忽略其他优化算法","note_indices":[1,2,3],"formula_indices":[],"source_ids":[1,3,6],"steps":["反向传播是计算梯度的核心算法。","梯度计算是模型训练的基础。","反向传播算法需要对模型结构和参数依赖关系有清晰理解。","反向传播算法是深度学习中最技术性的问题之一。"],"nodes":[{"title":"反向传播算法","text":"反向传播是计算损失函数相对于参数梯度的算法，是深度学习的核心技术。"},{"title":"梯度计算","text":"梯度计算是模型训练的基础，反向传播算法用于高效计算梯度。"},{"title":"模型结构理解","text":"反向传播需要对模型结构和参数依赖关系有清晰理解，以正确应用链式法则。"},{"title":"技术重要性","text":"反向传播是深度学习中最技术性的问题之一，是模型训练的关键步骤。"},{"title":"面试重要性","text":"反向传播算法在许多研究实验室的面试中仍被问及，说明其重要性。"}],"id":"v051-001-2","start":32.77,"end":183.09,"formulas":[],"formula_candidates_removed":0,"frame":"../board-frames/v051/001-2.webp","frame_time":45.27}],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.14,"text":"On Monday, we discussed neural network. We defined the definition of some components of neural networks and some of the typical neural networks, especially for computer vision. We will introduce the neural network architectures for language models when we talk about language models. And today, we're going to talk about backpropagation. As we said last time, this is the algorithm to compute."},{"start":32.77,"text":"the gradient of the loss function with respect to parameters. So maybe just a very, very brief review. So the background you need from last lecture was that there is a function, let's call it the loss function or the cost function, which is the average of the cost function of individual examples. So each example i has a cost function. And this cost function is something like maybe a loss, maybe a cross entropy loss, for example."},{"start":63.97,"text":"on some model output h theta of x, and some label y, and maybe the s input and the s label, something like this. So when you run SGD, the most simplistic version of SGD is that you update the parameter theta to theta minus some eta times the gradient. On some example, maybe it says the i sub k."},{"start":91.85,"text":"theta, where i sub k is sampled randomly from the data set. So something like this. And the key focus of this lecture is that how do we compute a gradient in this object? How do we compute a gradient efficiently with respect to the"},{"start":111.98,"text":"on the parameters. So we know how to compute this last time. Suppose you have defined the model by combining many of the components. It's a multi-layer MLP with machine application, with some activation functions, many, many layers of that. It's a very complex network. That's what this guy is. And how do you compute the gradient of this function? This is just the same as this and same as this one. And how do you compute the gradient with respect to the parameter theta?"},{"start":140.14,"text":"So that's the whole focus of this lecture, which is the most technical questions you can ask in deep learning these days. Because all the other things you cannot really objectively answer in many cases, like how do you tune learning rate, how do you design your data sets, all of those are somewhat subjective in some sense."},{"start":166.19,"text":"So that's why I think there was a long time when all of these research labs, when they interview people, they ask how you do backpropagation. I think that's probably still the case for some of the frontier labs. I don't know exactly. So this is a non-trivial algorithm that's"}],"speech_gaps":[],"frame":"../frames/v051/001.webp","frame_time":17.14},{"title":"反向传播与自动微分","segments":[{"id":7,"text":"that is really an algorithm that is needed for every training jobs under the hood, even though you don't really have to do it yourself these days. It's called backpropagation or autodifferentiation. It means that it's automatable. So you don't really have to do it yourself. But I think it's something that is good to understand because some of these other decisions you make depends on fundamentally how it works to some degree.","zh":"这实际上是一个在所有训练任务中都需要的算法，尽管如今你不需要自己手动实现它。它被称为反向传播或自动微分。这意味着它可以被自动化。因此，你不需要自己手动完成。但我认为理解它还是有帮助的，因为你在做其他一些决策时，某种程度上会依赖于它的工作原理。","start":183.79,"end":210.23},{"id":8,"text":"That's why we're discussing it. OK, so I think it's kind of like a, so we're going to start with a more generic view to think about how do you take gradients in general when you have a kind of like a circuit or kind of a very general function. And we're going to apply that kind of like a.","zh":"这就是我们讨论它的原因。好的，我认为它有点像，我们将从一个更通用的角度来思考，当你有一个类似电路或非常一般的函数时，如何一般性地计算梯度。我们将应用这种类似的方法。","start":212.09,"end":230.17},{"id":9,"text":"to neural networks.","zh":"到神经网络上。","start":232.44,"end":233.44},{"id":10,"text":"So basically, this kind of like auto differentiation","zh":"基本上，这种自动微分","start":233.8,"end":235.5},{"id":11,"text":"is not specific to neural networks.","zh":"并不特定于神经网络。","start":235.5,"end":238.72},{"id":12,"text":"You can use it for almost every nonlinear functions","zh":"你可以将其用于几乎所有的非线性函数","start":238.94,"end":241.06},{"id":13,"text":"as long as you can define the nonlinear functions","zh":"只要你能在前向路径中定义这些非线性函数","start":241.06,"end":243.08},{"id":14,"text":"in the forward path.","zh":"即可。","start":243.08,"end":244.22},{"id":15,"text":"As long as your function can be computable in a specific way,","zh":"只要你的函数可以以某种特定方式计算，","start":244.4,"end":248.38},{"id":16,"text":"when you compute a function value,","zh":"当你计算一个函数值时，","start":249.32,"end":251.72},{"id":17,"text":"then you can compute a gradient.","zh":"那么你就可以计算梯度。","start":251.94,"end":252.8},{"id":18,"text":"So that's what I'm going to write here in an abstract way.","zh":"所以这就是我要以一种抽象的方式在这里写出的内容。","start":252.96,"end":258.78},{"id":19,"text":"So let's say, suppose you define some,","zh":"所以让我们假设，假设你定义了一些，","start":259.0,"end":260.8},{"id":20,"text":"some, let's say, differentiable circuits.","zh":"一些，比如说，可微分的电路。","start":260.8,"end":262.48},{"id":21,"text":"So I'm using this as maybe differentiable networks.","zh":"所以我将这用作可能是可微分的网络。","start":267.7,"end":273.84},{"id":22,"text":"So let's say this is basically a network that","zh":"所以让我们说这基本上是一个网络，","start":274.22,"end":277.76},{"id":23,"text":"is a composition of sequence of arithmetic operations.","zh":"这是由一系列算术运算组成的组合。","start":277.76,"end":290.1},{"id":24,"text":"And maybe other elementary functions.","zh":"可能还有其他基本函数。","start":299.42,"end":301.82},{"id":25,"text":"So arithmetic operations means like for example, plus, minus, division, so on and so forth.","zh":"因此，算术运算包括例如加法、减法、除法，等等。","start":306.72,"end":312.04},{"id":26,"text":"And elementary functions could be something like maybe cosine, sine, maybe exponential,","zh":"基本函数可能是例如余弦、正弦，或者指数函数，","start":312.48,"end":318.32},{"id":27,"text":"you know, cosines.","zh":"你知道的，余弦函数。","start":318.32,"end":320.44},{"id":28,"text":"The exact definitions here don't really matter. I'm just trying to maybe . This is what I mean by elementary function sigmoid. So basically, you can say I have an input x1. In the circuit, you can afford people drawing things like this, where you have input x1, x2. Then you have some gate plus. Then you do the compute the sum of them. And then maybe you can have x3. And then you can have a gate, which is kind of like.","zh":"这里的精确定义其实并不重要。我只是想也许说明一下，这就是我所说的激活函数sigmoid。基本上，你可以这样说，我有一个输入x1。在电路中，你可以让人画出这样的图，其中你有输入x1，x2。然后你有一个加法门。然后你计算它们的和。接着你可能有x3。然后你有一个门，它有点像……","start":323.1,"end":346.66}],"notes":["本段讲授了反向传播（backpropagation）和自动微分（autodifferentiation）的基本概念，强调其在机器学习中的重要性。自动微分是一种可以自动计算梯度的算法，广泛应用于神经网络训练中，但并非仅限于神经网络。它适用于任何可以定义为前向路径的非线性函数，只要这些函数可以被计算。","讲者提到，自动微分的核心思想是将函数视为由一系列基本运算（如加减乘除）和基本函数（如正弦、余弦、指数）组成的电路或网络。这种结构允许通过反向传播算法计算梯度，从而实现参数的优化。","在讲授过程中，讲者通过举例说明了如何构建一个可微分的电路，例如输入x1和x2，通过加法门计算它们的和，得到x3，再通过其他门进行进一步计算。这种结构为反向传播提供了计算梯度的基础。","讲者还指出，自动微分的关键在于函数的可计算性，即只要函数可以被分解为一系列基本运算和函数的组合，就可以通过自动微分计算其梯度。这为神经网络的训练提供了理论支持。","此外，讲者提到，自动微分的实现并不依赖于特定的函数类型，而是适用于所有满足条件的非线性函数。这表明自动微分是一种通用的计算梯度的方法，可以应用于各种机器学习模型。","最后，讲者通过描述一个简单的电路结构，说明了如何通过反向传播计算梯度。这种结构为后续讲解神经网络的反向传播算法奠定了基础。"],"formulas":[],"uncertainties":["maybe . This is what I mean by elementary function sigmoid"],"diagram":"none","start":183.79,"end":346.66,"asr_flags":[21,23],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":183.79,"text":"that is really an algorithm that is needed for every training jobs under the hood, even though you don't really have to do it yourself these days. It's called backpropagation or autodifferentiation. It means that it's automatable. So you don't really have to do it yourself. But I think it's something that is good to understand because some of these other decisions you make depends on fundamentally how it works to some degree."},{"start":212.09,"text":"That's why we're discussing it. OK, so I think it's kind of like a, so we're going to start with a more generic view to think about how do you take gradients in general when you have a kind of like a circuit or kind of a very general function. And we're going to apply that kind of like a."},{"start":232.44,"text":"to neural networks."},{"start":233.8,"text":"So basically, this kind of like auto differentiation"},{"start":235.5,"text":"is not specific to neural networks."},{"start":238.94,"text":"You can use it for almost every nonlinear functions"},{"start":241.06,"text":"as long as you can define the nonlinear functions"},{"start":243.08,"text":"in the forward path."},{"start":244.4,"text":"As long as your function can be computable in a specific way,"},{"start":249.32,"text":"when you compute a function value,"},{"start":251.94,"text":"then you can compute a gradient."},{"start":252.96,"text":"So that's what I'm going to write here in an abstract way."},{"start":259.0,"text":"So let's say, suppose you define some,"},{"start":260.8,"text":"some, let's say, differentiable circuits."},{"start":267.7,"text":"So I'm using this as maybe differentiable networks."},{"start":274.22,"text":"So let's say this is basically a network that"},{"start":277.76,"text":"is a composition of sequence of arithmetic operations."},{"start":299.42,"text":"And maybe other elementary functions."},{"start":306.72,"text":"So arithmetic operations means like for example, plus, minus, division, so on and so forth."},{"start":312.48,"text":"And elementary functions could be something like maybe cosine, sine, maybe exponential,"},{"start":318.32,"text":"you know, cosines."},{"start":323.1,"text":"The exact definitions here don't really matter. I'm just trying to maybe . This is what I mean by elementary function sigmoid. So basically, you can say I have an input x1. In the circuit, you can afford people drawing things like this, where you have input x1, x2. Then you have some gate plus. Then you do the compute the sum of them. And then maybe you can have x3. And then you can have a gate, which is kind of like."}],"speech_gaps":[],"frame":"../frames/v051/002.webp","frame_time":195.79},{"title":"神经网络中的计算图与反向传播","segments":[{"id":29,"text":"or gate operation, which is maybe times. And then you compute. This means that you do x1 plus x2 times x3. And maybe you can reuse x1 times x2 here. Maybe you can do plus. Then you just add another.","zh":"或门操作，这可能是乘法。然后你进行计算。这意味着你做x1加上x2乘以x3。也许你可以在这里重用x1乘以x2。也许你可以做加法。然后你只需添加另一个。","start":347.51,"end":364.0},{"id":30,"text":"OK, so then this one is x1 plus x2 plus x4. And then you can probably aggregate again, so on and so forth. So you can see that the difference between this and the formula is that when you have a circuit, you can reuse some parts. But if you have a formula, you have to expand everything. So if x1 plus x2 is used twice, then you have to write x1 plus x2 twice in your formula. But in a circuit science, you don't have to recompute it again. So that's the only minor difference. Anyway, this is just some kind of a computational graph in some sense.","zh":"好的，那么这个是x1加上x2加上x4。然后你可能可以再次聚合，如此类推。你可以看到，这与公式之间的区别在于，当你有一个电路时，你可以重用某些部分。但如果你有一个公式，你必须展开所有内容。所以如果x1加上x2被使用两次，那么你必须在公式中写两次x1加上x2。但在电路科学中，你不需要重新计算它。这就是唯一的细微差别。无论如何，这在某种意义上只是某种计算图。","start":365.62,"end":393.26},{"id":31,"text":"The exact details don't matter. The claim here is actually pretty profound, which is so the theorem here, of course, is an informally stated theorem because if you really want to make it formal, you have to specify exactly what all of this kind of composition really means. Then you have to go through a lot of dragons, which is not necessary for this lecture. So the theorem is that suppose I say a differentiable circuit of size n.","zh":"具体的细节并不重要。这里的主张实际上非常深刻，也就是说，这里的定理当然是一个非正式陈述的定理，因为如果你真的想使其正式化，你必须明确说明所有这种组合的确切含义。然后你必须经历很多复杂的步骤，这在本节课中是不必要的。因此，定理是：假设我说一个可微分电路，其大小为n。","start":393.93,"end":435.67},{"id":32,"text":"And here, what does size mean? Size means that how many kind of operations you have, or how many of these operations you have. And sizeN computes a real value function. So I'm only thinking about a circuit where there is only one output, a scalar output, because that simplifies my life a little bit.","zh":"在这里，什么是大小？大小意味着你有多少种操作，或者有多少个这样的操作。大小N计算一个实值函数。因此，我只考虑一个电路，其中只有一个输出，一个标量输出，因为这能稍微简化我的工作。","start":436.84,"end":460.29},{"id":33,"text":"So a real value function, let's say this function is f. So this is where the circuits drop, where it's computing of a function that maps l input to 1 scalar. Suppose you have such a function, which is computable by this differentiable circuit. Then the gradient, let's say gradient of f with respect to the input,","zh":"一个实值函数，假设这个函数是f。这就是电路终止的地方，它在计算一个将l个输入映射到1个标量的函数。假设你有这样一个函数，它可以通过这个可微分电路计算出来。那么梯度，即关于输入的f的梯度，","start":461.09,"end":486.37},{"id":34,"text":"So first of all, maybe let's look at a type signature here. What's the dimension of the gradient? You have a function that maps r inputs to y inputs. The gradient is an L-dimensional vector, because for each coordinate, you have one partial gradient. So this is an L-dimensional vector, and this can also be computed in time.","zh":"首先，也许我们来看看这里的类型签名。梯度的维度是多少？你有一个将r个输入映射到y个输入的函数。梯度是一个L维向量，因为对于每个坐标，你都有一个偏导数。因此，这是一个L维向量，而且这个也可以在时间中计算出来。","start":487.5,"end":516.72}],"notes":["本段讨论了计算图与公式表达方式的差异，指出在计算图中可以复用某些部分，而在公式中则需要展开所有内容。例如，如果x1 + x2被使用两次，公式中需要重复写出，而计算图中则不需要重新计算。这说明了计算图在效率上的优势。","讲者提到，计算图的细节并不重要，但其背后的定理具有深远意义。该定理指出，如果有一个可微分的电路，那么其梯度可以通过反向传播计算。然而，该定理是形式化的，需要更严格的定义。","讲者解释了电路的大小定义为操作的数量，并且只考虑输出为标量的电路，以简化问题。这表明在讨论梯度计算时，可以专注于单输出的电路。","讲者提到，函数f将l个输入映射到一个标量输出，并且该函数可以通过可微分电路计算。这为后续讨论梯度计算提供了基础。","讲者讨论了梯度的维度，指出梯度是一个L维向量，因为每个输入坐标都有一个偏导数。这说明了梯度计算的维度与输入维度的关系。","讲者提到梯度可以通过某种方式计算，但未明确说明具体方法。这表明反向传播算法的计算过程将在后续内容中展开。"],"formulas":[],"uncertainties":["可能的术语错误：'circuit science' 可能应为 'circuit design' 或 'circuit theory'。","可能的术语错误：'type signature' 可能应为 'type signature' 或 'function signature'。","可能的术语错误：'r inputs to y inputs' 可能应为 'r inputs to 1 output' 或 'r inputs to a scalar'。"],"diagram":"none","start":347.51,"end":516.72,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":347.51,"text":"or gate operation, which is maybe times. And then you compute. This means that you do x1 plus x2 times x3. And maybe you can reuse x1 times x2 here. Maybe you can do plus. Then you just add another."},{"start":365.62,"text":"OK, so then this one is x1 plus x2 plus x4. And then you can probably aggregate again, so on and so forth. So you can see that the difference between this and the formula is that when you have a circuit, you can reuse some parts. But if you have a formula, you have to expand everything. So if x1 plus x2 is used twice, then you have to write x1 plus x2 twice in your formula. But in a circuit science, you don't have to recompute it again. So that's the only minor difference. Anyway, this is just some kind of a computational graph in some sense."},{"start":393.93,"text":"The exact details don't matter. The claim here is actually pretty profound, which is so the theorem here, of course, is an informally stated theorem because if you really want to make it formal, you have to specify exactly what all of this kind of composition really means. Then you have to go through a lot of dragons, which is not necessary for this lecture. So the theorem is that suppose I say a differentiable circuit of size n."},{"start":436.84,"text":"And here, what does size mean? Size means that how many kind of operations you have, or how many of these operations you have. And sizeN computes a real value function. So I'm only thinking about a circuit where there is only one output, a scalar output, because that simplifies my life a little bit."},{"start":461.09,"text":"So a real value function, let's say this function is f. So this is where the circuits drop, where it's computing of a function that maps l input to 1 scalar. Suppose you have such a function, which is computable by this differentiable circuit. Then the gradient, let's say gradient of f with respect to the input,"},{"start":487.5,"text":"So first of all, maybe let's look at a type signature here. What's the dimension of the gradient? You have a function that maps r inputs to y inputs. The gradient is an L-dimensional vector, because for each coordinate, you have one partial gradient. So this is an L-dimensional vector, and this can also be computed in time."}],"speech_gaps":[],"frame":"../frames/v051/003.webp","frame_time":359.51},{"title":"反向传播的时间复杂度与计算结构","segments":[{"id":35,"text":"say, O of n. So you don't have to spend much more time by a circuit of size O of n. So by the way, when I talk about time and circuit here, I'm implicitly assuming that each of these very basic operation takes O of 1 time. It takes 1 unit of time. So that's why to compute a function, you just go through the circuit. Because the size is n, it takes O of n time.","zh":"比如说，O(n)。因此，通过一个规模为O(n)的电路，你不需要花费太多额外的时间。顺便说一下，当我在这里谈论时间和电路时，我隐含地假设每个非常基本的操作都需要O(1)的时间，即花费1个时间单位。因此，为了计算一个函数，你只需通过这个电路。因为电路的规模是n，所以需要O(n)的时间。","start":517.42,"end":548.38},{"id":36,"text":"to compute a function. And I'm claiming that if you have such a circuit that computes the function f, then the gradient of this circuit, of this function, can also be computed in similar time. And also, the gradient itself is representable by a circuit, which is also an interesting fact. So in some sense, this is saying that in deep learning, people call","zh":"来计算一个函数。我声称，如果你有一个计算函数f的电路，那么这个电路或函数的梯度也可以在类似的时间内计算出来。此外，梯度本身也可以用一个电路来表示，这也是一个有趣的事实。因此，从某种意义上说，这说明在深度学习中，人们称","start":548.81,"end":574.48},{"id":37,"text":"computing of this, people call it forward pass, which just means the computing function of the model you want to evaluate. And the computing gradient is called backward pass. That's just a different terminology. And if you use different terminology, it means that the forward pass and the backward pass have the same time. So if you can do the forward pass in O of n time, then you can do the backward pass in O of n time. Because all of these new networks are","zh":"这种计算为前向传播（forward pass），它仅仅意味着计算你想要评估的模型的函数。而计算梯度则被称为反向传播（backward pass）。这只是不同的术语。如果你使用不同的术语，这意味着前向传播和反向传播所需的时间是相同的。因此，如果你可以在O(n)的时间内完成前向传播，那么你也可以在O(n)的时间内完成反向传播。因为所有这些新的网络都是","start":576.06,"end":602.5},{"id":38,"text":"some circuits, right? All the matrix multiplication, you can write them as a circuit because they are all elementary operations in matrix multiplication. All of these activation functions are elementary functions. And every component people are using are a combination of elementary functions. So all the new networks are these kind of differentiable circuits. And if the forward path, the function f, can be computed in some time n, then the backward path can also be done in a similar time.","zh":"一些电路，对吧？所有的矩阵乘法都可以写成电路，因为它们都是矩阵乘法中的基本操作。所有的激活函数都是基本函数。而人们所使用的每一个组件都是基本函数的组合。因此，所有的新网络都是这种可微分的电路。如果前向路径的函数f可以在时间n内计算出来，那么反向路径也可以在类似的时间内完成。","start":603.19,"end":628.65},{"id":39,"text":"So maybe more precisely, I guess I'll just write down what I'm trying to say here. So in deep learning, so this function f, the function f here corresponds to the loss function on some example, maybe i. The variable x corresponds to theta.","zh":"因此，也许更精确地说，我想在这里表达的意思是：在深度学习中，这个函数f对应于某个示例（比如i）上的损失函数。变量x对应于theta。","start":631.21,"end":650.08},{"id":40,"text":"because theta is what you really care about as the input to this function. And what is L, which is the number of inputs of the function? That's the number of parameters because my variable here is really theta. And interestingly, for new artworks,","zh":"因为theta是你真正关心的输入变量。那么L，即这个函数的输入数量是多少？这就是参数的数量，因为这里的变量实际上是theta。有趣的是，对于新的艺术作品，","start":651.93,"end":671.97}],"notes":["本段主要讨论了神经网络中前向传播和反向传播的时间复杂度。讲者指出，如果一个函数可以通过一个大小为O(n)的电路计算，那么其梯度也可以在相似的时间内计算。这表明，前向传播和反向传播在时间复杂度上是相当的，都是O(n)。","讲者提到，前向传播指的是计算模型输出的过程，而反向传播指的是计算梯度的过程。这种术语上的区分强调了两种计算过程在结构上的对称性。","讲者进一步说明，神经网络可以被看作是由基本操作（如矩阵乘法和激活函数）组成的可微电路。因此，只要前向传播可以在O(n)时间内完成，反向传播也可以在相似的时间内完成。","讲者提到，函数f对应于损失函数，变量x对应于参数θ。这表明，在反向传播中，我们关注的是如何通过梯度下降更新参数θ。","讲者指出，L代表函数的输入数量，即参数的数量。这表明，反向传播的计算复杂度与参数的数量有关。","讲者最后提到“for new artworks”，但未明确说明其含义，可能是听不清或未完成的句子。"],"formulas":[],"uncertainties":["for new artworks"],"diagram":"none","start":517.42,"end":671.97,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":517.42,"text":"say, O of n. So you don't have to spend much more time by a circuit of size O of n. So by the way, when I talk about time and circuit here, I'm implicitly assuming that each of these very basic operation takes O of 1 time. It takes 1 unit of time. So that's why to compute a function, you just go through the circuit. Because the size is n, it takes O of n time."},{"start":548.81,"text":"to compute a function. And I'm claiming that if you have such a circuit that computes the function f, then the gradient of this circuit, of this function, can also be computed in similar time. And also, the gradient itself is representable by a circuit, which is also an interesting fact. So in some sense, this is saying that in deep learning, people call"},{"start":576.06,"text":"computing of this, people call it forward pass, which just means the computing function of the model you want to evaluate. And the computing gradient is called backward pass. That's just a different terminology. And if you use different terminology, it means that the forward pass and the backward pass have the same time. So if you can do the forward pass in O of n time, then you can do the backward pass in O of n time. Because all of these new networks are"},{"start":603.19,"text":"some circuits, right? All the matrix multiplication, you can write them as a circuit because they are all elementary operations in matrix multiplication. All of these activation functions are elementary functions. And every component people are using are a combination of elementary functions. So all the new networks are these kind of differentiable circuits. And if the forward path, the function f, can be computed in some time n, then the backward path can also be done in a similar time."},{"start":631.21,"text":"So maybe more precisely, I guess I'll just write down what I'm trying to say here. So in deep learning, so this function f, the function f here corresponds to the loss function on some example, maybe i. The variable x corresponds to theta."},{"start":651.93,"text":"because theta is what you really care about as the input to this function. And what is L, which is the number of inputs of the function? That's the number of parameters because my variable here is really theta. And interestingly, for new artworks,"}],"speech_gaps":[],"frame":"../frames/v051/004.webp","frame_time":529.42},{"title":"神经网络中的计算复杂度与梯度计算","segments":[{"id":41,"text":"at least from almost all neural networks people are defining these days. Maybe there are some small exceptions. In almost all cases, the number of operations you need to evaluate neural networks is proportional to the number of parameters in your network. So for example, you have a matrix application where you have, say, a matrix application with dimension d by d. How many parameters you have? You have d squared parameters. And how many operations you need to do the matrix vector product, you also need d squared operations.","zh":"至少从几乎所有的现代神经网络来看。也许有一些小的例外。在几乎所有情况下，评估神经网络所需的计算量与网络中的参数数量成比例。例如，你有一个矩阵乘法，比如说一个d乘d的矩阵乘法。你有多少个参数？你有d平方个参数。而你需要多少次操作来完成矩阵向量乘法，你也需要d平方次操作。","start":672.94,"end":700.38},{"id":42,"text":"product, you also need d squared operations.","zh":"乘法，你也需要d平方次操作。","start":700.91,"end":703.05},{"id":43,"text":"So, so in neural networks, it's kind of like the number of operations you need is almost always equal to proportional to number of parameters.","zh":"因此，在神经网络中，所需的计算量几乎总是与参数数量成比例。","start":703.65,"end":705.79},{"id":44,"text":"it's kind of like the number of operations you need is almost","zh":"所需的计算量几乎","start":706.01,"end":709.65},{"id":45,"text":"always equal to proportional to number of parameters.","zh":"总是与参数数量成比例。","start":709.65,"end":713.77},{"id":46,"text":"So basically, both the forward path, evaluating the loss, and the gradient can be done in big O of the number of parameters.","zh":"基本上，无论是前向传播计算损失，还是计算梯度，都可以在参数数量的big O复杂度内完成。","start":715.37,"end":716.93},{"id":47,"text":"and then using the theorem, you know,","zh":"然后使用定理，你知道，","start":716.99,"end":719.35},{"id":48,"text":"the gradient of f corresponds to the gradient with respect to the loss,","zh":"f的梯度对应于相对于损失的梯度，","start":719.41,"end":722.91},{"id":49,"text":"But we're not going to prove it in the most abstract sense because that's too abstract.","zh":"但我们不会在最抽象的意义上证明这一点，因为那太抽象了。","start":724.13,"end":726.77},{"id":50,"text":"And it's saying that this one can also","zh":"它还表示这个也可以","start":726.77,"end":730.33},{"id":51,"text":"be done in time of n, which is the number of parameters.","zh":"在时间复杂度为n的范围内完成，n是参数的数量。","start":730.33,"end":734.95},{"id":52,"text":"So basically, both the forward path, evaluating the loss,","zh":"基本上，前向传播路径，评估损失，","start":736.79,"end":740.51},{"id":53,"text":"and the gradient can be done in big O","zh":"以及梯度都可以在大O复杂度下完成。","start":740.69,"end":744.05},{"id":54,"text":"So this idea or this theorem is also the basis of some of the second-order methods people are using.","zh":"因此，这个想法或这个定理也是人们使用的一些二阶方法的基础。","start":744.05,"end":745.61},{"id":55,"text":"And that's the fundamental complexity","zh":"这就是基本的复杂性","start":745.97,"end":747.77},{"id":56,"text":"You cannot compute everything, but you can compute some of them.","zh":"你不能计算所有东西，但你可以计算其中一些东西。","start":747.77,"end":748.87},{"id":57,"text":"Yeah, and in most of that, I think the main job of this","zh":"是的，在这其中的大部分内容里，我认为这个因素的主要作用是","start":752.41,"end":756.23},{"id":58,"text":"these factors to show you how to do this,","zh":"向你展示如何进行这项工作，","start":756.23,"end":758.37},{"id":59,"text":"how to prove the theorem in some sense.","zh":"如何在某种意义上证明这个定理。","start":758.91,"end":760.65},{"id":60,"text":"But we're not going to prove it in the most abstract sense","zh":"但我们不会以最抽象的方式证明它，","start":760.87,"end":763.01},{"id":61,"text":"because that's too abstract.","zh":"因为那太抽象了。","start":763.01,"end":764.31},{"id":62,"text":"We're going to prove it in a language that","zh":"我们将用一种","start":764.47,"end":767.13},{"id":63,"text":"is similar to the new artworks so that it's easier to understand.","zh":"与新艺术作品相似的语言来证明它，以便更容易理解。","start":767.13,"end":769.85},{"id":64,"text":"But the abstract theorem holds.","zh":"但抽象的定理是成立的。","start":770.53,"end":772.43},{"id":65,"text":"And maybe before going into that,","zh":"而且可能在进入那个话题之前","start":774.43,"end":776.85},{"id":66,"text":"let's also see some, in my opinion,","zh":"让我们也看看，我认为","start":777.11,"end":780.29},{"id":67,"text":"some also advanced application of this idea.","zh":"一些这种想法的高级应用。","start":780.37,"end":783.55},{"id":68,"text":"like idea.","zh":"比如想法。","start":783.55,"end":784.43},{"id":69,"text":"So this idea or this theorem is also","zh":"所以这个想法或这个定理也是","start":784.85,"end":789.15},{"id":70,"text":"the basis of some of the second-order methods","zh":"一些人们正在使用的二阶方法的基础。","start":789.15,"end":791.23},{"id":71,"text":"people are using.","zh":"所以当我这么说的时候，我的意思是","start":791.77,"end":792.77},{"id":72,"text":"So what do I mean by that is it means","zh":"它意味着","start":793.05,"end":795.93},{"id":73,"text":"that you can actually apply these kind of things twice","zh":"你可以实际上将这些方法应用两次","start":795.93,"end":798.53},{"id":74,"text":"and then compute some of the second-order gradient,","zh":"然后计算一些二阶梯度，","start":799.33,"end":801.29},{"id":75,"text":"some form of second-order gradient.","zh":"某种形式的二阶梯度。","start":801.49,"end":802.83},{"id":76,"text":"You cannot compute everything, but you can compute some","zh":"你不能计算所有内容，但你可以计算其中一些","start":803.21,"end":805.55},{"id":77,"text":"of them.","zh":"内容。","start":805.55,"end":805.87},{"id":78,"text":"For example, let's say it's a","zh":"例如，假设这是一个","start":806.07,"end":807.47},{"id":79,"text":"you have this loss function. I guess maybe let's use L of theta as the loss. So this is a loss function. And then maybe I should use j just to be consistent with the notation we have. So let's say we have a loss function j. And sometimes you say, OK, let me first do one step with descent. I do this. And then I evaluate loss.","zh":"你有一个损失函数。我想也许我们可以用 L of theta 作为损失。因此这是一个损失函数。然后也许我应该使用 j，以便与我们使用的符号保持一致。因此，让我们说我们有一个损失函数 j。有时你会说，好吧，让我先进行一次下降步骤。我这样做。然后我评估损失。","start":808.88,"end":834.05}],"notes":["本段主要讲解了神经网络中计算复杂度与参数数量之间的关系。讲者指出，大多数神经网络的计算操作数量与参数数量成正比，例如矩阵乘法中，参数数量和操作数量都是d²。这表明，计算神经网络的损失函数和梯度所需的操作数量大致相同，且与参数数量成线性关系。"],"formulas":[{"latex":"O(n)","symbols":"计算复杂度与参数数量n成线性关系","explanation":"保持原公式，O(n)表示计算复杂度与参数数量n成线性关系，符合原文中提到的前向传播和梯度计算的时间复杂度。","evidence":"And, and that means, and,"},{"latex":"d^2","symbols":"矩阵乘法中参数数量和操作数量","explanation":"保持原公式，d²表示矩阵乘法中参数数量和操作数量，符合原文中提到的d×d矩阵乘法需要d²个参数和d²次操作。","evidence":"at least from almost all neural networks people are defining these days. Maybe there are some small exceptions. In almost all cases, the number of operations you need to evaluate neural networks is proportional to the number of parameters in your network. So for example, you have a matrix application where you have, say, a matrix application with dimension d by d. How many parameters you have? You have d squared parameters. And how many operations you need to do the matrix vector?"},{"latex":"L(\\theta)","symbols":"损失函数","explanation":"保持原公式，L(θ)表示损失函数，符合原文中提到的损失函数的定义。","evidence":"Yeah, and in most of that, I think the main job of this"}],"uncertainties":["the gradient of f corresponds to the gradient with respect to the loss, sorry, the gradient of the loss with respect to the parameters."],"diagram":"none","start":672.94,"end":834.05,"asr_flags":[],"math_clarifications":["原文中提到的计算复杂度与参数数量成线性关系，O(n)是正确的表示方式。"],"boards":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":672.94,"text":"at least from almost all neural networks people are defining these days. Maybe there are some small exceptions. In almost all cases, the number of operations you need to evaluate neural networks is proportional to the number of parameters in your network. So for example, you have a matrix application where you have, say, a matrix application with dimension d by d. How many parameters you have? You have d squared parameters. And how many operations you need to do the matrix vector?"},{"start":700.91,"text":"product, you also need d squared operations."},{"start":703.65,"text":"So, so in neural networks,"},{"start":706.01,"text":"it's kind of like the number of operations you need is almost"},{"start":709.65,"text":"always equal to proportional to number of parameters."},{"start":715.37,"text":"And, and that means, and,"},{"start":716.99,"text":"and then using the theorem, you know,"},{"start":719.41,"text":"the gradient of f corresponds to the gradient with respect to the loss,"},{"start":724.13,"text":"sorry, the gradient of the loss with respect to the parameters."},{"start":726.77,"text":"And it's saying that this one can also"},{"start":730.33,"text":"be done in time of n, which is the number of parameters."},{"start":736.79,"text":"So basically, both the forward path, evaluating the loss,"},{"start":740.69,"text":"and the gradient can be done in big O"},{"start":744.05,"text":"of the number of parameters."},{"start":745.97,"text":"And that's the fundamental complexity"},{"start":747.77,"text":"of computing these gradients."},{"start":752.41,"text":"Yeah, and in most of that, I think the main job of this"},{"start":756.23,"text":"these factors to show you how to do this,"},{"start":758.91,"text":"how to prove the theorem in some sense."},{"start":760.87,"text":"But we're not going to prove it in the most abstract sense"},{"start":763.01,"text":"because that's too abstract."},{"start":764.47,"text":"We're going to prove it in a language that"},{"start":767.13,"text":"is similar to the new artworks so that it's easier to understand."},{"start":770.53,"text":"But the abstract theorem holds."},{"start":774.43,"text":"And maybe before going into that,"},{"start":777.11,"text":"let's also see some, in my opinion,"},{"start":780.37,"text":"some also advanced application of this idea."},{"start":783.55,"text":"like idea."},{"start":784.85,"text":"So this idea or this theorem is also"},{"start":789.15,"text":"the basis of some of the second-order methods"},{"start":791.77,"text":"people are using."},{"start":793.05,"text":"So what do I mean by that is it means"},{"start":795.93,"text":"that you can actually apply these kind of things twice"},{"start":799.33,"text":"and then compute some of the second-order gradient,"},{"start":801.49,"text":"some form of second-order gradient."},{"start":803.21,"text":"You cannot compute everything, but you can compute some"},{"start":805.55,"text":"of them."},{"start":806.07,"text":"For example, let's say it's a"},{"start":808.88,"text":"you have this loss function. I guess maybe let's use L of theta as the loss. So this is a loss function. And then maybe I should use j just to be consistent with the notation we have. So let's say we have a loss function j. And sometimes you say, OK, let me first do one step with descent. I do this. And then I evaluate loss."}],"speech_gaps":[{"start":749.616,"end":751.952}],"frame":"../frames/v051/005.webp","frame_time":684.94},{"title":"反向传播中的梯度计算与应用","segments":[{"id":80,"text":"So basically, I take some parameter, I take one step of gradient descent, and then evaluate the loss of this. So if you want to compute the gradient of this with respect to theta, suppose you say, I do this d theta, right? So this is itself a function of theta, right? Because theta shows up twice. And you can differentiate it with respect to theta. And this is still efficiently computable. And why? The reason is that","zh":"基本上，我取一个参数，进行一次梯度下降的步骤，然后评估这个损失。如果你想计算这个关于θ的梯度，假设你说，我这样做dθ，对吧？所以这个本身是θ的函数，对吧？因为θ出现了两次。你可以对θ进行求导。而且这仍然可以高效计算。为什么？原因在于，将这个函数作为θ的函数来计算是高效可计算的，因为你可以计算θ，你可以计算θ的梯度，你可以计算损失。这三个步骤各自都是高效可计算的，因为你只需付出三倍的参数数量。而且因为这个函数本身可以高效计算，所以梯度也可以计算。","start":835.5,"end":864.9},{"id":81,"text":"computing this function as a function of theta is efficiently computable because you can compute a theta, you can compute a gradient of theta, you can compute a loss. Each of these three steps are efficiently computable because you just pay three times the number of parameters. And because this function itself is computable efficiently, then the gradient is also computable.","zh":"计算这个函数作为θ的函数是高效可计算的，因为你可以计算θ，你可以计算θ的梯度，你可以计算损失。这三个步骤各自都是高效可计算的，因为你只需付出三倍的参数数量。而且因为这个函数本身可以高效计算，所以梯度也可以计算。","start":866.8,"end":885.52},{"id":82,"text":"And that's just that you use it twice in some sense. And another application is that suppose you define, let me make sure I use the right notation. So let's say suppose you define another one. But by the way, this kind of thing is often used in some of this meta-learning situation where, I guess it's probably hard to explain exactly, but just in case you are familiar with some of this, maybe you'll see it later. So you can try to","zh":"这仅仅是因为你在某种程度上使用了两次。另一个应用是，假设你定义，让我确保我使用正确的符号。所以，比如说，你定义另一个。不过，顺便说一句，这种东西经常用于一些元学习情境中，我猜很难确切地解释，但以防你熟悉一些这些内容，也许你以后会看到。所以你可以尝试","start":886.53,"end":916.11},{"id":83,"text":"run an algorithm, you can try to run some training algorithm. And you can, for example, tune your learning rate by back-propagating through the algorithm. So you can tune, for example, you can tune your initialization. And the last function for the initialization is that if I run this algorithm for 10 steps, what's my","zh":"运行一个算法，你可以尝试运行一些训练算法。例如，你可以通过反向传播来调整你的学习率。你可以调整，例如，你可以调整你的初始化。最后关于初始化的函数是，如果我运行这个算法10步，我的","start":916.67,"end":941.37},{"id":84,"text":"results. That's your final loss function, which is defined by an algorithm. And you can still optimize that loss function, even the algorithms involved in defining the loss function. And this is used in some of these test time training stuff. I guess it's very hard for me to say it without context, but these kind of ideas is useful for some advanced cases. And another case that is useful is that, for example, you can define g. So you can define gx.","zh":"结果是什么。这就是你的最终损失函数，它是由一个算法定义的。你仍然可以优化这个损失函数，即使定义损失函数所涉及的算法。这在一些测试时训练的内容中被使用。我猜在没有上下文的情况下很难说清楚，但这些想法在一些高级情况下是有用的。另一个有用的情况是，例如，你可以定义g。所以你可以定义gx。","start":942.05,"end":971.07},{"id":85,"text":"to be, say, the gradient of f in a product with some vector v. Let's say you just do this. And then you compute the gradient of g. It turns out that the gradient of g is equal to, this is just a basic calculus or differentiation, is equal to the Hessian of f, which is a matrix, times the vector v.","zh":"比如说，它是函数f与某个向量v的乘积的梯度。假设你只是这样做。然后你计算g的梯度。结果发现，g的梯度等于，这只是一个基本的微积分或求导的结果，等于f的Hessian矩阵，这是一个矩阵，乘以向量v。","start":971.67,"end":999.12}],"notes":["本段讲解了如何计算梯度的梯度，即二阶导数。讲者提到，如果定义g为f的梯度与某个向量v的乘积，那么g的梯度等于f的Hessian矩阵与向量v的乘积。这是基本的微积分知识，Hessian矩阵是梯度的梯度，是一个矩阵，而向量v是梯度与向量的乘积。"],"formulas":[],"uncertainties":["Hessian of f"],"diagram":"none","start":835.5,"end":999.12,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":835.5,"text":"So basically, I take some parameter, I take one step of gradient descent, and then evaluate the loss of this. So if you want to compute the gradient of this with respect to theta, suppose you say, I do this d theta, right? So this is itself a function of theta, right? Because theta shows up twice. And you can differentiate it with respect to theta. And this is still efficiently computable. And why? The reason is that"},{"start":866.8,"text":"computing this function as a function of theta is efficiently computable because you can compute a theta, you can compute a gradient of theta, you can compute a loss. Each of these three steps are efficiently computable because you just pay three times the number of parameters. And because this function itself is computable efficiently, then the gradient is also computable."},{"start":886.53,"text":"And that's just that you use it twice in some sense. And another application is that suppose you define, let me make sure I use the right notation. So let's say suppose you define another one. But by the way, this kind of thing is often used in some of this meta-learning situation where, I guess it's probably hard to explain exactly, but just in case you are familiar with some of this, maybe you'll see it later. So you can try to"},{"start":916.67,"text":"run an algorithm, you can try to run some training algorithm. And you can, for example, tune your learning rate by back-propagating through the algorithm. So you can tune, for example, you can tune your initialization. And the last function for the initialization is that if I run this algorithm for 10 steps, what's my"},{"start":942.05,"text":"results. That's your final loss function, which is defined by an algorithm. And you can still optimize that loss function, even the algorithms involved in defining the loss function. And this is used in some of these test time training stuff. I guess it's very hard for me to say it without context, but these kind of ideas is useful for some advanced cases. And another case that is useful is that, for example, you can define g. So you can define gx."},{"start":971.67,"text":"to be, say, the gradient of f in a product with some vector v. Let's say you just do this. And then you compute the gradient of g. It turns out that the gradient of g is equal to, this is just a basic calculus or differentiation, is equal to the Heisen of f, which is a matrix, times the vector v."}],"speech_gaps":[],"frame":"../frames/v051/006.webp","frame_time":847.5},{"title":"反向传播中的链式法则与计算复杂度","segments":[{"id":86,"text":"So you know that this is efficiently computable, right, in all of n time. You know that inner product is efficiently computable. So you know g itself is efficiently computable. And because g is computable efficiently, then the gradient of g is also efficiently computable. And that means that the Hessian vector product is efficiently computable. So this is the Hessian. This is just a vector. So you can compute","zh":"所以你知道这可以在所有n时间内高效计算，对吧？你知道内积是可以高效计算的。因此你知道g本身也是可以高效计算的。由于g可以高效计算，那么g的梯度也可以高效计算。这意味着Hessian向量乘积也是可以高效计算的。所以这就是Hessian。这只是一个向量。因此你可以以非常高效的方式在所有时间内计算","start":1000.31,"end":1027.47},{"id":87,"text":"the product of a Hessian times the vector, any vector in a very efficient way in all of time.","zh":"Hessian矩阵与向量的乘积，任何向量。","start":1028.46,"end":1034.82},{"id":88,"text":"But you cannot actually compute this matrix itself in the same time because this matrix","zh":"但你不能在同样的时间内实际计算这个矩阵本身，因为这个矩阵","start":1035.3,"end":1041.26},{"id":89,"text":"itself is too big. It's n by n, right? You have so many dimensions. But this vector,","zh":"本身太大了。它是n乘n的，对吧？你有这么多维度。但这个向量，","start":1041.26,"end":1048.44},{"id":90,"text":"Hessian vector product can be computable efficiently.","zh":"Hessian向量乘积是可以高效计算的。","start":1048.56,"end":1051.78},{"id":91,"text":"Okay. So that's all about the abstract stuff.","zh":"好的。所以这就是关于抽象内容的一切。","start":1052.56,"end":1058.62},{"id":92,"text":"And then now let's try to kind of like see how it works with new art works.","zh":"然后现在让我们尝试看看它是如何与新艺术作品一起工作的。","start":1058.8,"end":1063.68},{"id":93,"text":"And, you know, I'm still staying, you know, half abstract,","zh":"而且，你知道，我仍然保持一半抽象的状态。","start":1063.84,"end":1065.78},{"id":94,"text":"half kind of like concrete.","zh":"有点像混凝土。","start":1065.9,"end":1066.8},{"id":95,"text":"Any questions before I continue?","zh":"在我继续之前，有任何问题吗？","start":1067.78,"end":1069.66},{"id":96,"text":"Okay. So the core idea for the back propagation is that you use the so-called chain rule.","zh":"好的。反向传播的核心思想是使用所谓的链式法则。","start":1074.82,"end":1081.46},{"id":97,"text":"So let's review what chain rule is.","zh":"那么让我们回顾一下链式法则是什么。","start":1083.64,"end":1085.6},{"id":98,"text":"I think most people know chain rule,","zh":"我想大多数人知道链式法则，","start":1085.72,"end":1087.08},{"id":99,"text":"but I think it requires some kind of like different interpretations of it,","zh":"但我认为需要对它进行某种不同角度的理解，","start":1087.2,"end":1090.72},{"id":100,"text":"different presentation of it so that to make it","zh":"不同的呈现方式，以便在我们的上下文中更容易理解，但也许有问题。","start":1090.78,"end":1092.7},{"id":101,"text":"understandable in our context, but maybe question.","zh":"但也许有问题。","start":1092.7,"end":1095.32},{"id":102,"text":"In this case, are we only going to","zh":"在这种情况下，我们只会得到","start":1101.6,"end":1103.48},{"id":103,"text":"I think it would be, like, the first-order derivative.","zh":"我想，那会是一阶导数。","start":1103.48,"end":1104.74},{"id":104,"text":"Sorry.","zh":"抱歉。","start":1108.22,"end":1108.62},{"id":105,"text":"Can you say the sentence?","zh":"你能再说一遍这句话吗？","start":1109.5,"end":1110.5},{"id":106,"text":"Can you ask the question again?","zh":"你能再问一遍问题吗？","start":1110.62,"end":1111.56},{"id":107,"text":"I don't understand the question.","zh":"我不理解这个问题。","start":1111.66,"end":1112.3},{"id":108,"text":"You said that there's some algorithm","zh":"你说有一些算法","start":1112.52,"end":1114.18},{"id":109,"text":"uses second-order derivatives.","zh":"使用二阶导数。","start":1114.18,"end":1115.06},{"id":110,"text":"Like, is this, I don't know, for, like, optimizers,","zh":"比如，这是，我不知道，对于，比如，优化器来说，","start":1115.36,"end":1119.58},{"id":111,"text":"like, item W or something?","zh":"比如，物品 W 或者其他什么东西？","start":1119.68,"end":1121.36},{"id":112,"text":"Item W doesn't use second-order derivatives.","zh":"物品 W 不使用二阶导数。","start":1122.76,"end":1124.74},{"id":113,"text":"I think you need really advanced optimizers","zh":"我认为你需要非常先进的优化器","start":1124.84,"end":1127.72},{"id":114,"text":"to use the second-order derivatives.","zh":"才能使用二阶导数。","start":1127.72,"end":1129.0},{"id":115,"text":"And, you know, I think most of the optimizers these days,","zh":"而且，你知道的，我认为如今大多数有用的优化器，","start":1129.72,"end":1132.74},{"id":116,"text":"you know, that are really useful don't have to actually compute the Hessian vector product.","zh":"你知道的，实际上不需要真正计算海森矩阵向量乘积。","start":1132.74,"end":1136.24},{"id":117,"text":"So that's what I want to tell you about. So I didn't tell you how to compute it. I'm just","zh":"这就是我想告诉你们的。所以我没有告诉你们如何计算它。我只是","start":1145.5,"end":1150.66},{"id":118,"text":"saying it's computable. But how to compute it, that's the whole job of the rest of the lecture.","zh":"说它是可计算的。但如何计算它，这就是这堂课其余部分的工作。","start":1150.66,"end":1155.44},{"id":119,"text":"So let's talk about chain rule.","zh":"那么，让我们谈谈链式法则。","start":1161.66,"end":1162.98},{"id":120,"text":"So this is how we are going to interpret chain rule","zh":"这就是我们在此情境下如何解释链式法则的方式","start":1163.2,"end":1165.5},{"id":121,"text":"in this context, which I think is probably the easiest way","zh":"我认为这可能是最容易理解它的方式","start":1165.5,"end":1169.1},{"id":122,"text":"to think about it.","zh":"来思考它。","start":1169.1,"end":1169.68},{"id":123,"text":"So let's say you have maybe a z is the input.","zh":"那么，假设你有一个 z 作为输入。","start":1171.24,"end":1177.16},{"id":124,"text":"Let's say you have m dimensional vector, which is the input.","zh":"假设你有一个 m 维向量，它是输入。","start":1177.38,"end":1179.84}],"notes":["本段主要讨论了反向传播算法中Hessian矩阵的计算复杂度问题。讲者指出，虽然Hessian矩阵本身是n×n的，无法在相同时间内计算，但Hessian向量积可以通过高效方法计算。这为后续讲解反向传播中的链式法则奠定了基础。","讲者提到，反向传播的核心思想是使用链式法则。链式法则在本课程中被重新解释，以便更好地理解其在神经网络中的应用。讲者强调，链式法则在计算梯度时非常重要，但需要不同的解释方式。","讲者还提到，大多数现代优化器（如SGD、Adam）并不需要计算Hessian矩阵，而是通过其他方法进行参数更新。这表明，虽然Hessian向量积在理论上是可行的，但在实际应用中并不常见。","讲者在讲解过程中，多次提到链式法则的解释方式，强调其在反向传播中的重要性。同时，讲者也提到，链式法则的解释需要结合具体的上下文，以便更好地理解其在神经网络中的应用。","讲者还提到，某些高级优化器可能需要使用二阶导数，但这些优化器通常较为复杂，且在实际应用中并不常见。这表明，虽然二阶导数在理论上具有优势，但在实际应用中可能并不总是必要。","最后，讲者指出，反向传播算法的实现需要详细讲解如何计算Hessian向量积，这将是后续课程的重点内容。这表明，虽然讲者已经介绍了Hessian向量积的计算方法，但具体的实现细节仍需进一步探讨。"],"formulas":[],"uncertainties":["Item W"],"diagram":"none","start":1000.31,"end":1179.84,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":1000.31,"text":"So and you know that this is efficiently computable, right, in all of n time. You know that inner product is efficiently computable. So you know g itself is efficiently computable. And because g is computable efficiently, then the green of g is also efficiently computable. And that means that the Hessian vector product is efficiently computable. So this is the Hessian. This is just a vector. So you can compute"},{"start":1028.46,"text":"the product of a Hessian times the vector, any vector in a very efficient way in all of time."},{"start":1035.3,"text":"But you cannot actually compute this matrix itself in the same time because this matrix"},{"start":1041.26,"text":"itself is too big. It's n by n, right? You have so many dimensions. But this vector,"},{"start":1048.56,"text":"Hessian vector product can be computable efficiently."},{"start":1052.56,"text":"Okay. So that's all about the abstract stuff."},{"start":1058.8,"text":"And then now let's try to kind of like see how it works with new art works."},{"start":1063.84,"text":"And, you know, I'm still staying, you know, half abstract,"},{"start":1065.9,"text":"half kind of like concrete."},{"start":1067.78,"text":"Any questions before I continue?"},{"start":1074.82,"text":"Okay. So the core idea for the back propagation is that you use the so-called chain rule."},{"start":1083.64,"text":"So let's review what chain rule is."},{"start":1085.72,"text":"I think most people know chain rule,"},{"start":1087.2,"text":"but I think it requires some kind of like different interpretations of it,"},{"start":1090.78,"text":"different presentation of it so that to make it"},{"start":1092.7,"text":"understandable in our context, but maybe question."},{"start":1101.6,"text":"In this case, are we only going to"},{"start":1103.48,"text":"I think it would be, like, the first-order derivative."},{"start":1108.22,"text":"Sorry."},{"start":1109.5,"text":"Can you say the sentence?"},{"start":1110.62,"text":"Can you ask the question again?"},{"start":1111.66,"text":"I don't understand the question."},{"start":1112.52,"text":"You said that there's some algorithm"},{"start":1114.18,"text":"uses second-order derivatives."},{"start":1115.36,"text":"Like, is this, I don't know, for, like, optimizers,"},{"start":1119.68,"text":"like, item W or something?"},{"start":1122.76,"text":"Item W doesn't use second-order derivatives."},{"start":1124.84,"text":"I think you need really advanced optimizers"},{"start":1127.72,"text":"to use the second-order derivatives."},{"start":1129.72,"text":"And, you know, I think most of the optimizers these days,"},{"start":1132.74,"text":"you know, that are really useful don't have to actually compute the Hessian vector product."},{"start":1145.5,"text":"So that's what I want to tell you about. So I didn't tell you how to compute it. I'm just"},{"start":1150.66,"text":"saying it's computable. But how to compute it, that's the whole job of the rest of the lecture."},{"start":1161.66,"text":"So let's talk about chain rule."},{"start":1163.2,"text":"So this is how we are going to interpret chain rule"},{"start":1165.5,"text":"in this context, which I think is probably the easiest way"},{"start":1169.1,"text":"to think about it."},{"start":1171.24,"text":"So let's say you have maybe a z is the input."},{"start":1177.38,"text":"Let's say you have m dimensional vector, which is the input."}],"speech_gaps":[{"start":1098.768,"end":1100.336},{"start":1139.728,"end":1145.1},{"start":1159.408,"end":1161.26}],"frame":"../frames/v051/007.webp","frame_time":1012.31},{"title":"反向传播的基本概念","segments":[{"id":125,"text":"And you have a function, let's say u.","zh":"你有一个函数，比如说 u。","start":1180.84,"end":1182.8},{"id":126,"text":"u, you can call this function u, sorry,","zh":"u，你可以把这个函数称为 u，抱歉，","start":1182.8,"end":1186.46},{"id":127,"text":"you have a variable u, which is equal to g, a function g applied","zh":"你有一个变量 u，它等于函数 g 应用于 z。","start":1186.52,"end":1189.98},{"id":128,"text":"on z.","zh":"和","start":1189.98,"end":1190.44},{"id":129,"text":"And let's say this is dimension n.","zh":"假设这个是 n 维的。","start":1191.46,"end":1193.18},{"id":130,"text":"And then later, you have another function that applied on u","zh":"然后之后，你有一个另一个函数应用于 u","start":1194.54,"end":1198.96},{"id":131,"text":"and make it scalar.","zh":"并将其变为标量。","start":1199.68,"end":1200.74},{"id":132,"text":"Let's say.","zh":"比如说。","start":1200.88,"end":1201.14},{"id":133,"text":"So what chain rule does, and our interpretation is that, so chain rule basically give you a way such that if you are given the gradient with respect to u, the gradient of the final output with respect to the intermediate variable u. So given this, Chen Ru will try to compute. Chen Ru is this formula that gives you the gradient with respect to z.","zh":"那么链式法则的作用是什么呢？我们的理解是，链式法则基本上提供了一种方法，使得如果你已知关于u的梯度，也就是最终输出关于中间变量u的梯度。那么在这种情况下，陈儒会尝试计算。陈儒是这个公式，它给出了关于z的梯度。","start":1202.62,"end":1229.86},{"id":134,"text":"the gradient with respect to u, the gradient of the final output with respect to the intermediate variable u. So given this, Chen Ru will try to compute. Chen Ru is this formula that gives you the gradient with respect to z. So basically if you know the gradient with respect to the","zh":"关于u的梯度，最终输出关于中间变量u的梯度。所以在这种情况下，陈儒会尝试计算。陈儒是这个公式，它给出了关于z的梯度。所以基本上，如果你知道关于中间变量的梯度，你某种程度上就知道关于z的梯度。","start":1231.5,"end":1257.82},{"id":135,"text":"the intermediate variable, you somehow know the gradient with respect to z. So basically, in some sense, it's kind of like it's how you backprop through this thing, right? So if you imagine there's a chain of kind of these operations, you can compute the gradient with respect to the first variable, and then you can apply this iteratively to get the gradient with respect to the second variable and gradient with respect to the third variable, right? So you have a chain of like this.","zh":"所以从某种意义上说，它就像是如何通过这个东西进行反向传播，对吧？所以如果你想象有一系列这样的操作链，你可以计算关于第一个变量的梯度，然后你可以迭代地应用这个方法，得到关于第二个变量和第三个变量的梯度，对吧？所以你有一系列这样的链。","start":1258.49,"end":1285.13},{"id":136,"text":"So that's the main idea. But we are trying to abstract this in a way that you only have two variables, u and z. u is the output of g, and z is the input of g. And then when you compute a gradient, you start with the gradient with respect to u with respect to the output of g. And then you can use that to compute the gradient with respect to the input of g, which is z.","zh":"这就是主要的思想。但我们试图以一种抽象的方式表达，只涉及两个变量，u和z。u是g的输出，z是g的输入。然后当你计算梯度时，你从关于u的梯度开始，也就是关于g输出的梯度。然后你可以利用这个来计算关于g输入的梯度，也就是z的梯度。","start":1286.21,"end":1305.65},{"id":137,"text":"And this is actually the exact same change we have learned in calculus. So basically, if you want to compute a gradient, the partial derivative with respect to one of the variables, z1, zi, let's say.","zh":"实际上，这和我们在微积分中学到的完全一样的变化。所以基本上，如果你想计算梯度，关于其中一个变量的偏导数，比如说z1，zi。","start":1308.97,"end":1320.25},{"id":138,"text":"How do you do chain rule? You say these are intermediate variables so I'm going to expand, take a sum over all possible intermediate variables u1 up to un. I have n variables here so i from 1 to n and I take the partial derivative of my final target with respect to u.","zh":"你是如何应用链式法则的？你说这些是中间变量，所以我将展开，对所有可能的中间变量u1到un进行求和。这里我有n个变量，所以i从1到n，我计算最终目标关于u的偏导数。","start":1321.92,"end":1339.74}],"notes":["本段讲解了反向传播的基本思想，即通过链式法则计算梯度。讲者提到，如果已知中间变量u的梯度，可以通过链式法则计算输入变量z的梯度。这类似于在神经网络中，通过反向传播计算损失函数对各个参数的梯度。","讲者进一步解释了链式法则的应用，指出在计算梯度时，需要考虑中间变量的链式关系。例如，如果有一个中间变量u，它由输入变量z经过函数g得到，那么可以通过链式法则将最终输出对u的梯度传递到z。","讲者提到，链式法则可以迭代应用，以计算不同变量的梯度。例如，如果有一个链式结构，可以依次计算第一个变量的梯度，然后依次计算后续变量的梯度。","讲者还提到，链式法则在微积分中是已知的，可以通过对变量的偏导数进行求和来计算最终目标对中间变量的梯度。例如，对于n个中间变量，可以对每个变量求偏导数并求和。","讲者强调，反向传播的核心思想是通过链式法则将梯度从输出层传递到输入层，从而计算损失函数对各个参数的梯度。这在神经网络中是至关重要的，因为梯度下降算法依赖于这些梯度来更新参数。","讲者最后提到，链式法则的计算过程需要考虑所有可能的中间变量，并对每个变量求偏导数。这为反向传播算法提供了理论基础。"],"formulas":[],"uncertainties":["Chen Ru"],"diagram":"none","start":1180.84,"end":1339.74,"asr_flags":[],"math_clarifications":["原始片段中提到的链式法则涉及梯度计算，但未明确说明J是最终输出的标量函数，且未说明u是向量变量。因此，无法确定公式中的变量关系和具体应用场景，导致公式无法被完整校对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":1180.84,"text":"And you have a function, let's say u."},{"start":1182.8,"text":"u, you can call this function u, sorry,"},{"start":1186.52,"text":"you have a variable u, which is equal to g, a function g applied"},{"start":1189.98,"text":"on z."},{"start":1191.46,"text":"And let's say this is dimension n."},{"start":1194.54,"text":"And then later, you have another function that applied on u"},{"start":1199.68,"text":"and make it scalar."},{"start":1200.88,"text":"Let's say."},{"start":1202.62,"text":"So basically, if you draw it, you say you have z, and it goes through some kind of function g, and then you get this intermediate variable u, and then you go through some function f, and then you get some scalar output j. So what chain rule does, and our interpretation is that, so chain rule basically give you a way such that if you are given"},{"start":1231.5,"text":"the gradient with respect to u, the gradient of the final output with respect to the intermediate variable u. So given this, Chen Ru will try to compute. Chen Ru is this formula that gives you the gradient with respect to z. So basically if you know the gradient with respect to the"},{"start":1258.49,"text":"the intermediate variable, you somehow know the gradient with respect to z. So basically, in some sense, it's kind of like it's how you backprop through this thing, right? So if you imagine there's a chain of kind of these operations, you can compute the gradient with respect to the first variable, and then you can apply this iteratively to get the gradient with respect to the second variable and gradient with respect to the third variable, right? So you have a chain of like this."},{"start":1286.21,"text":"So that's the main idea. But we are trying to abstract this in a way that you only have two variables, u and z. u is the output of g, and z is the input of g. And then when you compute a gradient, you start with the gradient with respect to u with respect to the output of g. And then you can use that to compute the gradient with respect to the input of g, which is z."},{"start":1308.97,"text":"And this is actually the exact same change we have learned in calculus. So basically, if you want to compute a gradient, the partial derivative with respect to one of the variables, z1, zi, let's say."},{"start":1321.92,"text":"How do you do chain rule? You say these are intermediate variables so I'm going to expand, take a sum over all possible intermediate variables u1 up to un. I have n variables here so i from 1 to n and I take the partial derivative of my final target with respect to u."}],"speech_gaps":[],"frame":"../frames/v051/008.webp","frame_time":1192.84},{"title":"反向传播中的链式法则与雅可比矩阵","segments":[{"id":139,"text":"Let me say, sorry, let's use j here to not be confused with i. So the partial derivative of j with respect to ui, one of the intermediate variable, and then the partial derivative of gj with respect to zi. gj is the same as ui, right? gj is the jth output, which is equal to ui. So that's pretty much how you do it. And if you think about this, right?","zh":"让我这么说，抱歉，让我们用j来表示，以免和i混淆。所以这是对j关于ui的偏导数，其中一个中间变量，然后是gj关于zi的偏导数。gj和ui是一样的，对吧？gj是第j个输出，等于ui。所以这就是你如何进行计算的方式。如果你仔细想想，对吧？","start":1340.75,"end":1368.91},{"id":140,"text":"these things are these guys, right? And this is these guys. So this equation is saying that dj over dz is a linear combination of dj over du. So basically, the quantities you care about is a linear combination of the quantity you are given. And you can rewrite that as a matrix multiplication.","zh":"这些就是这些项，对吧？而这就是这些项。所以这个等式是在说dj对dz的导数是dj对du的线性组合。基本上，你关心的量是给定量的线性组合。你可以将这个重写为矩阵乘法。","start":1369.69,"end":1398.98},{"id":141,"text":"So if you reorganize this, you say dj over dz1 up to dj over dzm. You organize these into a vector. Then this is actual matrix simplification, where the matrix is the Jacobian, is actually transpose of Jacobian. And this is the input you are given, which is the dj over du's.","zh":"所以如果你重新组织这些项，你可以说dj对dz1到dj对dzm，将这些组织成一个向量。然后这就是实际的矩阵简化，其中矩阵是雅可比矩阵的转置。而这就是你所给定的输入，即dj对du的值。","start":1400.75,"end":1430.33},{"id":142,"text":"And this matrix is, I need to make sure I call the paste selection nodes to not mess up the indices. So this is actually the transpose of the Jacobian. And this is what you are given in our formulation. So we are given this and you multiply a matrix, you get the derivative with respect to z.","zh":"并且这个矩阵，我需要确保我正确地称呼这些节点，以免搞混索引。所以这实际上是雅可比矩阵的转置。而这就是我们在公式中所给定的。所以我们被给定了这个，然后你乘以一个矩阵，就能得到关于z的导数。","start":1432.31,"end":1474.92},{"id":143,"text":"Yeah, and you can see that this computation, one magic here is that this computation chain rule only needs information info about g, the function g. You have to know what the function g is. You have to know the variable z, what value z you are evaluating the gradient at, right? But you don't have to, but not f.","zh":"是的，你可以看到这个计算，其中有一个巧妙之处是，这个链式法则的计算只需要关于g函数的信息。你必须知道函数g是什么。你必须知道变量z，你在哪个点计算梯度，对吧？但你不需要知道f。","start":1479.58,"end":1509.76}],"notes":["本段讲解了反向传播中如何利用链式法则计算梯度，强调了雅可比矩阵及其转置在计算过程中的作用。讲者指出，通过将导数组织成向量并进行矩阵乘法，可以简化计算过程。","讲者提到，计算链式法则时只需要关于函数g的信息，而不需要关于函数f的信息。这表明在反向传播中，只需要知道当前层的函数形式和变量值，就可以计算梯度。","讲者强调了雅可比矩阵的转置在计算中的重要性，并指出输入是关于变量u的导数，输出是关于变量z的导数。这说明了反向传播中如何通过矩阵运算传递梯度。","讲者提到在计算过程中需要注意索引的正确性，避免因索引错误导致计算错误。这表明在实际操作中，索引的管理是反向传播计算的关键。","讲者指出，链式法则的计算过程依赖于函数g的定义和变量z的值，这说明了反向传播的计算过程需要明确函数形式和变量值。","讲者提到，计算过程中不需要关于函数f的信息，这表明在反向传播中，只需要关注当前层的函数和变量，而不需要考虑更上层的函数。"],"formulas":[{"latex":"\\frac{\\partial j}{\\partial z} = J^T \\cdot \\frac{\\partial j}{\\partial u}","symbols":"雅可比矩阵的转置与导数向量相乘得到梯度","explanation":"该公式正确表达了通过雅可比矩阵的转置与导数向量相乘来计算梯度的方法，符合链式法则的数学表达。","evidence":"dz1 up to dj over dzm. You organize these into a vector. Then this is actual matrix simplification, where the matrix is the Jacobian, is actually transpose of Jacobian. And this is the input you are given, which is the dj over du's. And this matrix is, I need to make sure I call the paste selection nodes to not mess up the indices. So this is actually the transpose of the Jacobian. And this is what you are given in our formulation. So we are given this and you multiply a matrix, you get the derivative with respect to z."}],"uncertainties":["info about g"],"diagram":"none","start":1340.75,"end":1509.76,"asr_flags":[],"math_clarifications":["原始片段中提到的链式法则和雅可比矩阵的转置使用是正确的，但第一个公式中的求和形式可能引起混淆，因此被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1340.75,"text":"Let me say, sorry, let's use j here to not be confused with i. So the partial derivative of j with respect to ui, one of the intermediate variable, and then the partial derivative of gj with respect to zi. gj is the same as ui, right? gj is the jth output, which is equal to ui. So that's pretty much how you do it. And if you think about this, right?"},{"start":1369.69,"text":"these things are these guys, right? And this is these guys. So this equation is saying that dj over dz is a linear combination of dj over du. So basically, the quantities you care about is a linear combination of the quantity you are given. And you can rewrite that as a matrix multiplication. So if you reorganize this, you say dj over"},{"start":1400.75,"text":"dz1 up to dj over dzm. You organize these into a vector. Then this is actual matrix simplification, where the matrix is the Jacobian, is actually transpose of Jacobian. And this is the input you are given, which is the dj over du's."},{"start":1432.31,"text":"And this matrix is, I need to make sure I call the paste selection nodes to not mess up the indices. So this is actually the transpose of the Jacobian. And this is what you are given in our formulation. So we are given this and you multiply a matrix, you get the derivative with respect to z."},{"start":1479.58,"text":"Yeah, and you can see that this computation, one magic here is that this computation chain rule only needs information info about g, the function g. You have to know what the function g is. You have to know the variable z, what value z you are evaluating the gradient at, right? But you don't have to, but not f."}],"speech_gaps":[],"frame":"../frames/v051/009.webp","frame_time":1352.75},{"title":"反向传播中的局部依赖与链式法则","segments":[{"id":144,"text":"but not f. So f is completely out of this picture, even though we have f here, right? But what f really is doesn't really matter. And that's how you make it efficient in some sense. You can forget about what f is. The only thing you have to remember is","zh":"但不是 f。因此，f 完全不在这个图景中，尽管我们这里出现了 f，对吧？但 f 实际上是什么并不重要。这就是在某种意义上使它变得高效的方法。你可以忘记 f 是什么。你唯一需要记住的是这个东西，即 dj 对 du 的导数。","start":1511.68,"end":1528.65},{"id":145,"text":"this thing, dj over du. So even f is a very, very complex function. So let's say f is actually a sequence of f1, f2, so on and so forth. It doesn't really matter. As long as I know dj over du, I can forget about how I got all of this. What happens here doesn't matter at all.","zh":"因此，即使 f 是一个非常、非常复杂的函数。比如说，f 实际上是一系列 f1、f2，依此类推。这并不重要。只要我知道 dj 对 du 的导数，我就可以忘记我如何得到所有这些。这里发生的事情根本不重要。","start":1529.44,"end":1551.04},{"id":146,"text":"So that's the magic. So sometimes it's Markovian, in some sense. But you can forget about the past. When you try to compute a gradient with respect to the first variable, z, maybe it's a sequence of operation. For example, you have z, g, f1, f2, f3, so on and so forth, until you have finally a scalar. And I guess here, the output of, OK, I guess I'm","zh":"这就是魔法。有时它在某种意义上是马尔可夫的。但你可以忘记过去。当你尝试计算相对于第一个变量 z 的梯度时，也许这是一个操作序列。例如，你有 z、g、f1、f2、f3，依此类推，直到最终得到一个标量。我想在这里，输出的 OK，我想我","start":1551.71,"end":1576.01},{"id":147,"text":"Maybe that's it. So I'm just redrawing this in a slightly better way. So there's a very complex computation here to get the final scalar. But if you only have to know, once you know this thing, dj over du, you can forget about everything above, and you can get the dj over dz. So this part doesn't have to require the history. So sometimes you make a Markovian, and you can forget about history in some sense.","zh":"也许这就是了。我只是以稍微更好的方式重新绘制这个图。这里有一个非常复杂的计算过程来得到最终的标量。但如果你一旦知道这个东西，即 dj 对 du 的导数，你就可以忘记所有上面的内容，并且可以得到 dj 对 dz 的导数。这一部分不需要依赖历史。有时你做出马尔可夫性，从而在某种意义上可以忘记历史。","start":1577.25,"end":1604.31},{"id":148,"text":"And that's why it's efficient. And I think, in some sense, this mapping from here to here is the so-called backward function. If you look at a petrarch, this is the, for every module, you have to implement a backward function. Because this module is, so this function itself, it only depends on g and z. So you only have to know the local information to implement the module.","zh":"这就是为什么它高效。我想，在某种意义上，从这里到这里的映射被称为反向函数。如果你看一个 petrarch，这就是对于每个模块，你必须实现一个反向函数。因为这个模块是，所以这个函数本身只依赖于 g 和 z。因此，你只需要知道局部信息来实现这个模块。","start":1605.1,"end":1631.38},{"id":149,"text":"And it can compose with anything here. And this is the backward function. And the g itself is so-called forward function. So maybe just to make it more concrete, let's just try to think about this in some kind of like we have a composition of chain rules. So let's suppose you have maybe backprop, which is basically composing the chain rules.","zh":"它可以与这里的任何东西组合。这就是反向函数。而 g 本身被称为前向函数。也许为了更具体一些，让我们尝试以某种方式思考，比如我们有一个链式法则的组合。让我们假设你有反向传播，这基本上就是组合链式法则。","start":1633.68,"end":1662.27},{"id":150,"text":"natural way. OK. So maybe let's just consider the following situation, where you have, say, the final target is, let's say, a repeated application of many modules, many functions. Let's say you have this. Maybe I should just draw this once so that I don't have to draw it. Let's say you have x, which is mapped to m. You go through.","zh":"自然的方式。好的。那么也许我们考虑以下情况，其中最终目标是许多模块、许多函数的重复应用。比如说，你有这个。也许我应该先画一次，这样就不必每次都画了。比如说，你有x，它被映射到m。你接着进行。","start":1666.1,"end":1691.4}],"notes":["本段讲解了反向传播中如何通过局部依赖和链式法则来高效计算梯度。讲者指出，即使函数f非常复杂，只要知道dj/du，就可以忽略f的具体形式，从而简化计算。这种做法使得反向传播在处理复杂计算图时更加高效。","讲者提到，反向传播中的计算可以看作是一种Markovian过程，即在计算梯度时，只需要关注当前变量的局部信息，而不需要考虑之前的计算历史。这种特性使得反向传播能够有效地处理序列操作，例如计算z的梯度时，只需要知道dj/du，而不需要了解整个计算路径。","讲者进一步解释了反向传播中的“backward function”和“forward function”的概念。每个模块只需要知道其输入和输出的局部信息，就可以实现其对应的backward function，从而使得整个计算过程可以模块化。","讲者提到，反向传播本质上是链式法则的组合，即通过将多个模块的梯度计算组合起来，最终得到目标函数的梯度。这种组合方式使得反向传播能够处理复杂的计算图，而不需要显式地展开所有中间步骤。","讲者最后提到，反向传播的计算过程可以看作是一种自然的方式，即通过重复应用多个模块，逐步计算出最终的梯度。这种计算方式使得反向传播能够高效地处理大规模的神经网络模型。","讲者强调，反向传播的关键在于局部依赖和链式法则的结合，使得计算过程能够高效地进行，而不需要显式地处理整个计算图的复杂性。这种特性是反向传播能够广泛应用于深度学习模型的重要原因。"],"formulas":[{"latex":"\\frac{\\partial j}{\\partial u}","symbols":"对u的梯度","explanation":"保留原公式，未发现数学错误。","evidence":"but not f. So f is completely out of this picture, even though we have f here, right? But what f really is doesn't really matter. And that's how you make it efficient in some sense. You can forget about what f is. The only thing you have to remember is this thing, dj over du. So even f is a very, very complex function. So let's say f is actually a sequence of f1, f2, so on and so forth. It doesn't really matter. As long as I know dj over du, I can forget about how I got all of this. What happens here doesn't matter at all."},{"latex":"\\frac{\\partial j}{\\partial z}","symbols":"对z的梯度","explanation":"保留原公式，未发现数学错误。","evidence":"Maybe that's it. So I'm just redrawing this in a slightly better way. So there's a very complex computation here to get the final scalar. But if you only have to know, once you know this thing, dj over du, you can forget about everything above, and you can get the dj over dz. So this part doesn't have to require the history. So sometimes you make a Markovian, and you can forget about history in some sense."},{"latex":"\\frac{\\partial j}{\\partial u} = \\frac{\\partial j}{\\partial z} \\cdot \\frac{\\partial z}{\\partial u}","symbols":"链式法则","explanation":"保留原公式，未发现数学错误。","evidence":"And it can compose with anything here. And this is the backward function. And the g itself is so-called forward function. So maybe just to make it more concrete, let's just try to think about this in some kind of like we have a composition of chain rules. So let's suppose you have maybe backprop, which is basically composing the chain rules."}],"uncertainties":["petrarch"],"diagram":"none","start":1511.68,"end":1691.4,"asr_flags":[],"math_clarifications":["所有公式均符合数学规范，未发现需要修正或移除的数学错误。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1511.68,"text":"but not f. So f is completely out of this picture, even though we have f here, right? But what f really is doesn't really matter. And that's how you make it efficient in some sense. You can forget about what f is. The only thing you have to remember is"},{"start":1529.44,"text":"this thing, dj over du. So even f is a very, very complex function. So let's say f is actually a sequence of f1, f2, so on and so forth. It doesn't really matter. As long as I know dj over du, I can forget about how I got all of this. What happens here doesn't matter at all."},{"start":1551.71,"text":"So that's the magic. So sometimes it's Markovian, in some sense. But you can forget about the past. When you try to compute a gradient with respect to the first variable, z, maybe it's a sequence of operation. For example, you have z, g, f1, f2, f3, so on and so forth, until you have finally a scalar. And I guess here, the output of, OK, I guess I'm"},{"start":1577.25,"text":"Maybe that's it. So I'm just redrawing this in a slightly better way. So there's a very complex computation here to get the final scalar. But if you only have to know, once you know this thing, dj over du, you can forget about everything above, and you can get the dj over dz. So this part doesn't have to require the history. So sometimes you make a Markovian, and you can forget about history in some sense."},{"start":1605.1,"text":"And that's why it's efficient. And I think, in some sense, this mapping from here to here is the so-called backward function. If you look at a petrarch, this is the, for every module, you have to implement a backward function. Because this module is, so this function itself, it only depends on g and z. So you only have to know the local information to implement the module."},{"start":1633.68,"text":"And it can compose with anything here. And this is the backward function. And the g itself is so-called forward function. So maybe just to make it more concrete, let's just try to think about this in some kind of like we have a composition of chain rules. So let's suppose you have maybe backprop, which is basically composing the chain rules."},{"start":1666.1,"text":"natural way. OK. So maybe let's just consi
