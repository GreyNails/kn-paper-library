e actually extremely difficult. Everybody got that? So, it's interesting, actually. Okay, so let's see how to do that. Now, to do that, we're actually going to use the opposite parametrization we did before."},{"start":3813.82,"text":"To find the minimum volume ellipsoid, we use the inverse image of the unit ball under an affine mapping. Here, it's going to be the forward image of a unit ball. So here's the unit ball, and I'm going to make a forward image under an affine mapping. So here, by the way, the bigger B is, the bigger E is. Whereas the opposite was true for the previous parameterization. So we do this."},{"start":3840.37,"text":"And here, once again, we can assume without any loss of generality that B is both symmetric and positive definite. Okay? So B is invertible, but I can do that. And I do the same trick, right? Here, if I put a orthogonal matrix after, if I replace B with BQ, the problem is identical. Because Q multiplies U, U is in the unit ball, and if I have an orthogonal matrix there, it doesn't change anything at all. Everybody following this? Okay, so..."},{"start":3869.44,"text":"So that's my parameterization. And now the volume is proportional to the determinant of B. So if we maximize log determinant B, that's the same as maximizing determinant B. And that's actually log determinant B is, as you know, concave. And then we're maximizing so everything is cool. Everybody following this? So, okay."}],"speech_gaps":[],"frame":"../frames/v011/023.webp","frame_time":3738.61},{"title":"凸优化中的椭球与可计算性","segments":[{"id":220,"text":"Now, we have to be able to say that the following is true. I want to say that everything in this ellipsoid is inside my set, right? Because my ellipsoid has to fit inside the set. And the way you test that is this. I'll take the indicator function for C, right?","zh":"现在，我们必须能够说明以下内容是正确的。我想说的是，这个椭球内的所有内容都位于我的集合内，对吧？因为我的椭球必须完全包含在集合内。检验方法是这样的。我会使用集合C的指示函数，对吧？","start":3894.12,"end":3918.9},{"id":221,"text":"And that's just something that's zero if you're in C and infinity otherwise. And I write it this way. So I see a BU plus D means, let's see, what does it mean? It means if this element is in C, this is plus infinity. Otherwise, this is zero. Okay?","zh":"这个指示函数只是在你位于C时为零，否则为无穷大。我这样写。所以，我看到BU加D意味着什么？它意味着如果这个元素在C中，那么就是正无穷大；否则就是零。好的？","start":3920.63,"end":3938.31},{"id":222,"text":"And this is silly to say sup u less than 1. It just says that basically for all, it says basically everything of the form bu plus d with norm 2 less than 1 is in the set. That's just a fancy way to write it. Okay. Now, this is actually, this is a convex optimization problem. But once again, we have this kind of a weird supremum or infimum in the problem.","zh":"说sup u小于1是愚蠢的。它基本上表示所有形式为bu加d且2范数小于1的元素都在集合中。这只是另一种说法。好的。现在，这实际上是一个凸优化问题。但再一次，我们在这个问题中遇到了这种奇怪的上确界或下确界。","start":3940.06,"end":3965.25},{"id":223,"text":"which we know it's a convex, but we have no way to write it down. It's not tractable. And so actually this is the point in the course when we can start, you know, basically level zero is convex optimization problems are tractable.","zh":"我们知道它是凸的，但我们无法写出它。它是不可计算的。因此，实际上，这是课程中我们可以开始的地方，你知道的，零级是凸优化问题都是可计算的。","start":3965.82,"end":3979.7},{"id":224,"text":"That's like, if someone on the street asks you or whatever, like, you know, hey, or from a different field asks you, who cares about it? And you go, well, they're tractable, right? But now you can see that's actually false because this is an example of a problem where, I mean, you just have some tractable. Actually, the ones I said were NP-hard before, they're convex problems. No problem. They just have this infimum or supremum in there that you can't represent, right? So, yeah, so.","zh":"比如，如果有人在街上问你，或者来自其他领域的人问你，谁关心这个？你会说，好吧，它们是可计算的，对吧？但现在你可以看到这实际上是错误的，因为这是一个例子，说明有些问题实际上是不可计算的。实际上，我之前说的那些NP难的问题，它们是凸问题。没有问题。它们只是包含了一个你无法表示的下确界或上确界，对吧？所以，是的，所以。","start":3980.59,"end":4006.42},{"id":225,"text":"So it depends, you have to judge the social, it depends on the social setting, right? If you're with a bunch of mathematicians or people who know a lot, then you don't have to, you wouldn't say all convex problems are tractable, right? So, okay, all right. So here, let's do a polyhedron.","zh":"这取决于社会背景，对吧？如果你和一群数学家或了解很多的人在一起，那么你就不需要说所有的凸问题都是可计算的，对吧？所以，好的，那么在这里，让我们做一个多面体。","start":4007.13,"end":4025.6},{"id":226,"text":"And then I can actually, then I can check, right? So with this parameterization, if I want to know is E inside this polyhedron given by a set of inequalities, that's actually completely tractable and it looks like this, right? That's a perfectly good problem right here. Maximize the log determinant subject to, and let's be very careful, you have to be really on your toes here. What are the variables in this problem? What are the variables? Capital B.","zh":"然后我实际上可以检查一下，对吧？所以，使用这种参数化方式，如果我想知道椭球E是否位于由一组不等式定义的多面体内部，这实际上是完全可计算的，看起来就像这样，对吧？这里是一个非常好的问题。最大化对数行列式，注意，我们必须非常小心，这里的变量是什么？变量是什么？大写B。","start":4026.03,"end":4059.81}],"notes":["本段讨论了如何通过椭球来判断一个集合是否包含在另一个集合中，以及如何通过指标函数来表示这一关系。讲者指出，椭球内的所有点都必须满足某种条件，而这种条件可以通过指标函数来表达。","讲者提到，椭球的参数化形式可以表示为BU + D，其中如果点在集合C内，则指标函数为正无穷，否则为零。这种表示方式虽然看起来复杂，但实际上是将椭球内的点限制在集合C内的一种方式。","讲者指出，虽然椭球本身是凸的，但包含这种椭球的优化问题可能无法直接求解，因为涉及到一个上确界或下确界，这使得问题变得不可计算。","讲者强调，凸优化问题并不总是可计算的，这与之前提到的NP难问题形成对比。虽然NP难问题通常被认为是难以计算的，但它们可能属于凸优化问题，只是因为包含了一个无法表示的上确界或下确界。","讲者指出，是否将凸优化问题视为可计算的，取决于听众的背景。对于数学家或熟悉该领域的人来说，不能简单地说所有凸优化问题都是可计算的。","最后，讲者提到，当使用多面体参数化时，可以更容易地判断一个点是否在多面体内，这表明某些凸优化问题确实是可计算的。"],"formulas":[{"latex":"\\log \\text{determinant}","symbols":"对数行列式","explanation":"公式内容与原始片段中提到的'log determinant'一致，无需修改。","evidence":"And then I can actually, then I can check, right? So with this parameterization, if I want to know is E inside this polyhedron given by a set of inequalities, that's actually completely tractable and it looks like this, right? That's a perfectly good problem right here. Maximize the log determinant subject to, and let's be very careful, you have to be really on your toes here. What are the variables in this problem? What are the variables? Capital B."}],"uncertainties":["sup u less than 1"],"diagram":"none","start":3894.12,"end":4059.81,"asr_flags":[],"math_clarifications":["原始片段中未明确给出数学公式，仅提及了概念，无法核对公式内容。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3894.12,"text":"Now, we have to be able to say that the following is true. I want to say that everything in this ellipsoid is inside my set, right? Because my ellipsoid has to fit inside the set. And the way you test that is this. I'll take the indicator function for C, right?"},{"start":3920.63,"text":"And that's just something that's zero if you're in C and infinity otherwise. And I write it this way. So I see a BU plus D means, let's see, what does it mean? It means if this element is in C, this is plus infinity. Otherwise, this is zero. Okay?"},{"start":3940.06,"text":"And this is silly to say sup u less than 1. It just says that basically for all, it says basically everything of the form bu plus d with norm 2 less than 1 is in the set. That's just a fancy way to write it. Okay. Now, this is actually, this is a convex optimization problem. But once again, we have this kind of a weird supremum or infimum in the problem."},{"start":3965.82,"text":"which we know it's a convex, but we have no way to write it down. It's not tractable. And so actually this is the point in the course when we can start, you know, basically level zero is convex optimization problems are tractable."},{"start":3980.59,"text":"That's like, if someone on the street asks you or whatever, like, you know, hey, or from a different field asks you, who cares about it? And you go, well, they're tractable, right? But now you can see that's actually false because this is an example of a problem where, I mean, you just have some tractable. Actually, the ones I said were NP-hard before, they're convex problems. No problem. They just have this infimum or supremum in there that you can't represent, right? So, yeah, so."},{"start":4007.13,"text":"So it depends, you have to judge the social, it depends on the social setting, right? If you're with a bunch of mathematicians or people who know a lot, then you don't have to, you wouldn't say all convex problems are tractable, right? So, okay, all right. So here, let's do a polyhedron."},{"start":4026.03,"text":"And then I can actually, then I can check, right? So with this parameterization, if I want to know is E inside this polyhedron given by a set of inequalities, that's actually completely tractable and it looks like this, right? That's a perfectly good problem right here. Maximize the log determinant subject to, and let's be very careful, you have to be really on your toes here. What are the variables in this problem? What are the variables? Capital B."}],"speech_gaps":[],"frame":"../frames/v011/024.webp","frame_time":3906.12},{"title":"凸集内的最大体积椭球","segments":[{"id":227,"text":"And little d. Is that right? Yeah. Okay. And then what are a i and b i? What are they? They're data or constants or parameters, however you want to say it. Right? Okay. So then what kind of function is this of the variables? It's convex. It's b a i is linear. And then it's a two norm, so that's convex. Right? What kind of function of the variables is that? It's affine, but it's linear. Right?","zh":"还有小小的 d。对吧？是的。好的。那么 a_i 和 b_i 是什么？它们是什么？它们是数据或常数或参数，无论你怎么说。对吧？好的。那么，这函数对于变量来说是什么类型的函数？它是凸函数。它是 b a_i 是线性的。然后它是二范数，所以它是凸函数。对吧？对于变量来说，这函数是什么类型的函数？它是仿射函数，但它是线性的。对吧？","start":4061.24,"end":4095.09},{"id":228,"text":"So, it is affine, of course, but it's even linear, right? And so, this is a convex constraint because that's a convex function, right? In fact, it's second order cone representable, right? So, okay. So, that's it. So, this is this crazy thing where if I give a polyhedron, if I give you a polyhedron described by inequalities, we can find the maximum volume ellipsoid inside it. Everybody?","zh":"所以，它是仿射函数，当然，但它甚至还是线性的，对吧？因此，这是一个凸约束，因为这是一个凸函数，对吧？实际上，它是二阶锥可表示的，对吧？好的。所以，这就是这个疯狂的事情。如果你给我一个凸多面体，如果你给我一个由不等式描述的凸多面体，我们可以在其中找到最大体积的椭球。大家明白吗？","start":4096.28,"end":4124.7},{"id":229,"text":"And that's completely tractable. By the way, this has tons of applications immediately. Suppose I give you a polyhedron that's very complicated, defined by inequalities, and you say, that's a safe operating region. If you're state or whatever it is, if you're robot, whatever. If you're in that, you're not going to hit anything and it's safe. Everybody following this? This allows you to do something like make a guaranteed, the maximum volume, safe ellipsoid.","zh":"而且这完全是可以处理的。顺便说一下，这立即有大量应用。假设我给你一个非常复杂的凸多面体，由不等式定义，你说，这是一个安全操作区域。如果你的状态或任何东西，如果你是一个机器人，不管怎样。如果你处于其中，你就不会碰到任何东西，它是安全的。大家明白这个吗？这允许你做类似的事情，比如制造一个保证的最大体积的安全椭球。","start":4125.28,"end":4151.48},{"id":230,"text":"And someone would say, why would you do that? You say, because my algorithm that manipulates it can handle an ellipsoid, but not a polyhedron with 80 faces or something like that. Everybody following this? So this already has a lot of uses. That's one, just right there. Now, it turns out there's something very weird about these. It's very cool. It's this.","zh":"有人会问，为什么你要这么做？你说，因为我的算法处理它时可以处理椭球，但不能处理有80个面的多面体之类的。大家明白这个吗？所以这已经有很多用途了。这是其中之一，就在那儿。现在，事实证明，这些东西有一些非常奇怪的地方。它非常酷。就是这个。","start":4151.89,"end":4178.23},{"id":231,"text":"This is math, right? But it's actually super interesting and has all sorts of implications. So here it is. Take any convex bounded set with non-empty interior, right? So it's not flat. It doesn't go off to infinity and blah, blah, blah. There's C, right? Then the Lohner-John... By the way, we're not talking about whether or not you can compute the minimum volume ellipsoid that covers something or the maximum volume ellipsoid inside it. That's a separate question. This is math, so we don't...","zh":"这是数学，对吧？但实际上非常有趣，并且有各种各样的含义。所以这里它就是。取任何有非空内部的凸有界集合，对吧？所以它不是扁平的。它不会延伸到无穷远，等等。存在 C，对吧？然后是 Lohner-John……顺便说一下，我们不谈论是否可以计算覆盖某个物体的最小体积椭球或内部的最大体积椭球。这是另一个问题。这是数学，所以我们不……","start":4179.2,"end":4207.16},{"id":232,"text":"we're unbothered by the questions of, we're just looking at what's true and false, not how do you actually, how much trouble is it to compute it, right? So, okay, so it turns out that if you take the Loner-John ellipsoid, so that says take your set, you find the minimum volume ellipsoid that covers your set. Then it says shrink the set around, shrink that ellipsoid around its center by a factor n. Everybody got that? That's inside the set.","zh":"我们不关心这些问题，我们只是在看什么是对的，什么是错的，而不是计算它有多麻烦，对吧？所以，好吧，结果发现，如果你取Loner-John椭球，也就是说，取你的集合，找到覆盖该集合的最小体积椭球。然后，将该椭球围绕其中心缩小一个因子n。大家明白了吗？这个椭球是包含在集合内部的。","start":4207.37,"end":4236.35}],"notes":["本段讲授了凸优化中的一个重要概念：在凸集内寻找最大体积的椭球。椭球可以用来近似复杂的多面体，从而简化计算。椭球的体积最大化意味着它尽可能地覆盖多面体的内部区域，这在安全区域的建模中非常有用。","讲者提到，椭球的体积最大化问题在计算上是可行的，这使得它在实际应用中非常有用。例如，当处理一个具有大量面的复杂多面体时，使用椭球可以简化算法的处理。","讲者还提到，对于任何具有非空内部的凸有界集，存在一个Lohner-John椭球，它可以通过将覆盖该集的最小体积椭球缩小一定比例来得到，这个椭球完全包含在原集内。","讲者强调，这里讨论的是数学上的性质，而不是计算上的可行性。即，我们关注的是椭球与凸集之间的数学关系，而不是如何高效地计算这些椭球。","讲者指出，Lohner-John椭球的构造方法是：首先找到覆盖该集的最小体积椭球，然后将其缩小一定比例，使得缩小后的椭球完全包含在原集内。这个比例是n，即椭球的维度。","讲者通过这些例子和解释，展示了凸优化在实际问题中的应用，如安全区域的建模和算法的简化。"],"formulas":[],"uncertainties":["Lohner-John ellipsoid 的具体构造方法可能存在识别错误，原句中提到的 'Lohner-John' 可能是 'Löwner-John' 的误听，但无法确定。","讲者提到的 'shrink the set around, shrink that ellipsoid around its center by a factor n' 中的 'factor n' 可能指的是椭球的维度，但具体数学表达式未明确给出，因此无法确定其准确含义。"],"diagram":"none","start":4061.24,"end":4236.35,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4061.24,"text":"And little d. Is that right? Yeah. Okay. And then what are a i and b i? What are they? They're data or constants or parameters, however you want to say it. Right? Okay. So then what kind of function is this of the variables? It's convex. It's b a i is linear. And then it's a two norm, so that's convex. Right? What kind of function of the variables is that? It's affine, compute it, right? So, okay, so it turns out that if you take the Loner-John ellipsoid, so that says take your set, you find the minimum volume ellipsoid that covers your set. Then it says shrink the set around, shrink that ellipsoid around its center by a factor n. Everybody got that? That's inside the set."}],"speech_gaps":[],"frame":"../frames/v011/025.webp","frame_time":4073.24},{"title":"凸集的椭球近似","segments":[{"id":233,"text":"That's what it says. And the opposite is true for the maximum volume ellipsoid. If I have any set at all, convex, I find the maximum volume ellipsoid that fits inside it. Now, I expand it by a factor n about the center. That covers the set. And it gets even weirder. If the set is symmetric, like if minus the set is equal to itself or something like that, then it turns out...","zh":"这就是它所说的。对于最大体积椭球来说，情况正好相反。如果我有任何一个凸集，我找到能够完全包含在其中的最大体积椭球。现在，我以中心为原点，将它按因子 n 进行扩展。这样就能覆盖整个集合。而且情况变得更加奇怪。如果这个集合是对称的，比如，如果集合的负集等于它本身，或者其他类似的情况，那么结果会是……","start":4238.79,"end":4267.86},{"id":234,"text":"you don't have to have a factor of n, you have a factor of square root n. Everybody following this? Now this actually tells you unbelievable things. This says that if you had a convex set and you approximate it with an ellipsoid, it says you really, you can't be too far off. In fact, if I take, let's say, either the Loner-John, let's suppose I take the Loner-John ellipsoid and I shrink it by, suppose I shrink it by square root n, right?","zh":"你不需要乘以因子 n，而是乘以因子根号 n。大家都能跟上吗？实际上，这告诉你一些难以置信的事情。这说明，如果你用椭球来近似一个凸集，它告诉你你实际上不会偏离太远。事实上，假设我取 Loner-John 椭球，然后将其缩小，比如缩小因子为根号 n，对吧？","start":4268.11,"end":4294.91},{"id":235,"text":"Then and I say that's that's the ellipsoidal approximation of my set and you go cool In which how does it approximate your set you go? Well, if I expand it by factor squared n it covers my set if I shrink it by a factor of squared n It's inside the set Everybody got it. So so actually it's kind of what it tells you is that like ellipsoids are universal approximators of convex sets","zh":"然后我说这就是我集合的椭球近似。你问：它是如何近似你的集合的？嗯，如果我将它按因子平方 n 进行扩展，就能覆盖我的集合；如果我将其按因子平方 n 进行缩小，它就会包含在集合中。大家明白了吗？所以实际上，它告诉你的就是椭球是凸集的通用近似器。","start":4295.52,"end":4320.83},{"id":236,"text":"Now squared n in some practice might be way too much for you to be happy with or something like that. Actually, let me do an example here. Let's just do one here. Here's my set. Ready? It's a triangle like that. What's the Loner-John ellipsoid of that? It's equilateral or whatever they call it. What's the Loner-John ellipsoid?","zh":"在某些实际应用中，平方 n 可能会让你非常不满意，或者类似的情况。实际上，让我举一个例子。让我们来做一个例子。这里是我的集合。准备好了吗？它是一个三角形，像这样。这个 Loner-John 椭球是什么样的？它是一个等边的，或者他们称之为的其他形状。这个 Loner-John 椭球是什么？","start":4322.21,"end":4351.62},{"id":237,"text":"It's just a circle that goes around it. Okay, right. So it looks like this, right? Well, this is gonna be terrible. Okay. There it is. Okay, right Okay, shrink that by a factor of two in your eye. Then what do you get you get? this right And actually this example shows that that that's tight that inequality, right? So in fact, it's always true. So you could even say something very weird like this first you say","zh":"它只是一个围绕它的圆。好的，对吧？所以它看起来像这样，对吧？嗯，这会很糟糕。好的，它就在那里。好的，对吧？好的，对吧。然后，你把它按因子 2 缩小，你会得到什么？这就是，对吧？实际上，这个例子表明那个不等式是紧的，对吧？所以事实上，这个结论总是成立的。你甚至可以说一些非常奇怪的话，比如，首先你说","start":4352.38,"end":4381.52},{"id":238,"text":"All convex sets can be approximated by ellipsoids within a factor. You know, you could say, I could say squared n because I'd put it in the middle and then both expand and shrink, right? And you'd say, yeah, well, what are the hardest sets to approximate by ellipsoids? Makes perfect sense, right? And the answer is a simplex in Rn. A simplex in Rn, if you want to approximate it by ellipsoids.","zh":"所有凸集都可以通过椭球在某个因子范围内进行近似。你知道的，你可以这样说，我可以声称是n的平方，因为我会把它放在中间，然后同时进行扩展和收缩，对吧？你可能会说，是的，那么最难用椭球来近似的是什么集合？这完全合情合理，对吧？答案是在R^n中的一个单纯形。如果你想用椭球来近似R^n中的一个单纯形。","start":4382.31,"end":4407.69}],"notes":["本段讲解了凸集与椭球近似之间的关系，指出最大体积椭球可以覆盖凸集，而最小体积椭球则需要缩放因子。当凸集对称时，缩放因子可以是√n，而不是n。这表明椭球可以作为凸集的近似工具，且误差范围有限。","通过一个三角形的例子，说明了Löwner-John椭球的构造方式。椭球可以包围三角形，但需要缩放因子√n才能精确匹配。这展示了椭球近似凸集的理论基础。","椭球近似凸集的误差范围与维度n相关，且对于某些特定结构（如单纯形）来说，椭球近似可能需要更大的缩放因子。这表明椭球在高维空间中对凸集的近似能力有限，但仍然是有用的工具。","课程中提到，椭球可以作为凸集的通用近似器，但需要考虑缩放因子的大小。对于某些凸集，如单纯形，椭球近似可能需要更大的缩放因子，这说明了不同凸集的近似难度不同。","椭球近似凸集的理论基础在于其能够覆盖或包含凸集，且误差范围与维度相关。这为凸优化中的近似方法提供了理论支持。","课程中强调了椭球近似凸集的理论意义，即椭球可以作为凸集的近似工具，且误差范围有限。这为后续的优化算法和近似方法提供了基础。"],"formulas":[{"latex":"\\sqrt{n}","symbols":"缩放因子","explanation":"原始片段中明确提到缩放因子为\\sqrt{n}，因此该公式应保留。","evidence":"you don't have to have a factor of n, you have a factor of square root n. Everybody following this? Now this actually tells you unbelievable things. This says that if you had a convex set and you approximate it with an ellipsoid, it says you really, you can't be too far off. In fact, if I take, let's say, either the Loner-John, let's suppose I take the Loner-John ellipsoid and I shrink it by, suppose I shrink it by square root n, right?"}],"uncertainties":["Loner-John"],"diagram":"none","start":4238.79,"end":4407.69,"asr_flags":[],"math_clarifications":["原始片段中提到的缩放因子是\\sqrt{n}，而非n或n^2。因此，公式n和n^2应被移除，而\\sqrt{n}应保留。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4238.79,"text":"That's what it says. And the opposite is true for the maximum volume ellipsoid. If I have any set at all, convex, I find the maximum volume ellipsoid that fits inside it. Now, I expand it by a factor n about the center. That covers the set. And it gets even weirder. If the set is symmetric, like if minus the set is equal to itself or something like that, then it turns out..."},{"start":4268.11,"text":"you don't have to have a factor of n, you have a factor of square root n. Everybody following this? Now this actually tells you unbelievable things. This says that if you had a convex set and you approximate it with an ellipsoid, it says you really, you can't be too far off. In fact, if I take, let's say, either the Loner-John, let's suppose I take the Loner-John ellipsoid and I shrink it by, suppose I shrink it by square root n, right?"},{"start":4295.52,"text":"Then and I say that's that's the ellipsoidal approximation of my set and you go cool In which how does it approximate your set you go? Well, if I expand it by factor squared n it covers my set if I shrink it by a factor of squared n It's inside the set Everybody got it. So so actually it's kind of what it tells you is that like ellipsoids are universal approximators of convex sets"},{"start":4322.21,"text":"Now squared n in some practice might be way too much for you to be happy with or something like that. Actually, let me do an example here. Let's just do one here. Here's my set. Ready? It's a triangle like that. What's the Loner-John ellipsoid of that? It's equilateral or whatever they call it. What's the Loner-John ellipsoid?"},{"start":4352.38,"text":"It's just a circle that goes around it. Okay, right. So it looks like this, right? Well, this is gonna be terrible. Okay. There it is. Okay, right Okay, shrink that by a factor of two in your eye. Then what do you get you get? this right And actually this example shows that that that's tight that inequality, right? So in fact, it's always true. So you could even say something very weird like this first you say"},{"start":4382.31,"text":"All convex sets can be approximated by ellipsoids within a factor. You know, you could say, I could say squared n because I'd put it in the middle and then both expand and shrink, right? And you'd say, yeah, well, what are the hardest sets to approximate by ellipsoids? Makes perfect sense, right? And the answer is a simplex in Rn. A simplex in Rn, if you want to approximate it by ellipsoids."}],"speech_gaps":[],"frame":"../frames/v011/026.webp","frame_time":4250.79},{"title":"凸优化中的范数近似与中心化","segments":[{"id":239,"text":"It's going to take the full square root n. Here would be my weird square root n thing, right? It would be something that looks like that. Whoops, okay, that came out very poorly. But anyway, this would be my square root n. And I would say, you see that ball?","zh":"这将需要完整的平方根n。这里是我的奇怪的平方根n的东西，对吧？它看起来像这样。哎呀，好吧，那看起来非常糟糕。不过不管怎样，这就是我的平方根n。我会说，你看到那个球了吗？","start":4408.29,"end":4424.1},{"id":240,"text":"that disk, if I increase it by 1.4, you know, whatever, 1.42, there you go, then I cover my triangle. And if I shrink it, if I multiply it by 0.7, then I'm inside. Everybody got that? So, everybody got all this? So, this applies actually weirdly to norms, right? It says take any norm at all on Rn, right? Any norm.","zh":"那个圆盘，如果我把它扩大1.4倍，你知道的，随便什么，1.42，这样你就能覆盖我的三角形了。如果我缩小它，如果我乘以0.7，那么我就在里面了。大家明白了吗？所以，大家都明白这些吗？所以，实际上这以一种奇怪的方式适用于范数，对吧？它说，取任何在Rn上的范数，对吧？任何范数。","start":4424.86,"end":4452.92},{"id":241,"text":"It says that I can approximate it with a quadratic norm. Those are symmetric. With error, no more than the fourth root of n. So now I'll tell you an important thing about that. There's lots of norms. Here's a norm. The minimum fuel it takes you to go from a state to zero.","zh":"它说，我可以使用一个二次范数来近似它。这些是对称的。误差不超过n的四次方根。现在我要告诉你一个关于这个的重要事情。有很多范数。这里有一个范数。从一个状态到零所需的最小燃料。","start":4453.65,"end":4480.7},{"id":242,"text":"That's actually a norm. It's a crazy polyhedral norm, right? It's a crazy norm, but it is a norm. But that might be one we really care about, right? It says I can approximate that pretty well with a quadratic norm.","zh":"这实际上是一个范数。它是一个疯狂的多面体范数，对吧？它是一个疯狂的范数，但它确实是一个范数。但这可能是一个我们真正关心的范数，对吧？它说，我可以使用一个二次范数很好地近似它。","start":4481.77,"end":4502.11},{"id":243,"text":"And so this would give you a very good way to find those, to find the, actually it would actually say kind of why things work so well, right? When people would say like, yeah, how are you controlling your airplane? And if they're honest, they'll finally, they'll say something like, that's basically using something like, you know, linear quadratic, basically it's almost least squares, basically. It's more complicated than that, but not too far. And you go, whoa, you go, that's great. Are the,","zh":"因此，这将为你提供一种非常好的方法来找到这些，实际上它会告诉你为什么事情运作得如此之好，对吧？当人们会说，比如，你是如何控制你的飞机的？如果他们诚实的话，他们最终会说，基本上是在使用类似的东西，你知道的，线性二次，基本上就是最小二乘法，基本上。它比这更复杂一些，但也不太远。你会说，哇，你会说，这太棒了。你们的约束条件，你知道的，是球形的还是其他的？他们会说，不，不，不，不，它们不是那种东西。所以，但效果非常好。而这实际上是，至少我喜欢认为这是部分解释。","start":4502.96,"end":4530.82},{"id":244,"text":"you know, are your actual constraints like, you know, spherical or whatever? And they're like, no, no, no, no, they're not, you know, that kind of thing. So, but it works really well. And this is actually, at least I like to think part of the explanation.","zh":"你们的约束条件，你知道的，是球形的还是其他的？他们会说，不，不，不，不，它们不是那种东西。所以，但效果非常好。而这实际上是，至少我喜欢认为这是部分解释。","start":4531.81,"end":4554.74},{"id":245,"text":"It's something we've actually seen a couple of times before. It's so-called, it's centering. So actually, very early in the course, we encountered this. It was one of our first examples of a linear program, right? It was like, here's a polyhedron given by inequalities. And I said, find the largest ball, Euclidean ball, that fits inside it. Everybody got that? That's called the Chebyshev center.","zh":"我们之前其实已经见过这种情况了。这被称为中心化。实际上，在课程很早的时候我们就遇到了这个问题。这是我们第一个线性规划的例子之一，对吧？当时给出的是一个由不等式定义的多面体，我说，找到一个最大的欧几里得球，使其完全包含在该多面体内部。大家明白了吗？这被称为切比雪夫中心。","start":4555.23,"end":4578.22}],"notes":["本段讲授了范数近似的基本概念，指出任何范数都可以用二次范数进行近似，误差不超过n的四次方根。这为后续讨论控制理论中的线性二次调节器（LQR）提供了理论基础。","讲者提到一个特殊的范数，即最小燃料范数，它表示从一个状态到零点所需的最小燃料。这个范数虽然形式复杂，但仍然是一个有效的范数，并且可以用二次范数进行近似。","讲者强调了二次范数在实际控制中的重要性，指出许多实际控制系统都基于二次优化方法，如线性二次调节器（LQR）。这说明了为什么二次范数在工程实践中如此流行。","讲者提到，虽然实际约束可能不是球形的，但使用二次范数近似仍然能有效工作。这表明了范数近似方法的鲁棒性和实用性。","讲者还回顾了课程中早期提到的中心化问题，即寻找能够完全包含在多面体内的最大球体，这被称为Chebyshev中心。这展示了中心化问题在凸优化中的重要性。","讲者通过实际例子（如飞机控制）说明了范数近似和中心化方法的实际应用，强调了这些理论在工程实践中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4408.29,"end":4578.22,"asr_flags":[244],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4408.29,"text":"It's going to take the full square root n. Here would be my weird square root n thing, right? It would be something that looks like that. Whoops, okay, that came out very poorly. But anyway, this would be my square root n. And I would say, you see that ball?"},{"start":4424.86,"text":"that disk, if I increase it by 1.4, you know, whatever, 1.42, there you go, then I cover my triangle. And if I shrink it, if I multiply it by 0.7, then I'm inside. Everybody got that? So, everybody got all this? So, this applies actually weirdly to norms, right? It says take any norm at all on Rn, right? Any norm."},{"start":4453.65,"text":"It says that I can approximate it with a quadratic norm. Those are symmetric. With error, no more than the fourth root of n. So now I'll tell you an important thing about that. There's lots of norms. Here's a norm. The minimum fuel it takes you to go from a state to zero."},{"start":4481.77,"text":"That's actually a norm. It's a crazy polyhedral norm, right? It's a crazy norm, but it is a norm. But that might be one we really care about, right? It says I can approximate that pretty well with a quadratic norm. Why does that matter? Because in fact, the control that people actually use is all based on quadratic stuff."},{"start":4502.96,"text":"And so this would give you a very good way to find those, to find the, actually it would actually say kind of why things work so well, right? When people would say like, yeah, how are you controlling your airplane? And if they're honest, they'll finally, they'll say something like, that's basically using something like, you know, linear quadratic, basically it's almost least squares, basically. It's more complicated than that, but not too far. And you go, whoa, you go, that's great. Are the,"},{"start":4531.81,"text":"you know, are your actual constraints like, you know, spherical or whatever? And they're like, no, no, no, no, they're not, you know, that kind of thing. So, but it works really well. And this is actually, at least I like to think part of the explanation. Okay, so does all this make sense? It's kind of weird and interesting and cool, I think. Okay, next topic."},{"start":4555.23,"text":"It's something we've actually seen a couple of times before. It's so-called, it's centering. So actually, very early in the course, we encountered this. It was one of our first examples of a linear program, right? It was like, here's a polyhedron given by inequalities. And I said, find the largest ball, Euclidean ball, that fits inside it. Everybody got that? That's called the Chebyshev center."}],"speech_gaps":[],"frame":"../frames/v011/027.webp","frame_time":4420.29},{"title":"凸优化中的中心概念","segments":[{"id":246,"text":"It's an LP, and I said at the time it's weird, because if I say things like Euclidean ball or draw a circle, the linear programming part of your brain should not be lighting up. Because linear programming part of your brain should light up when I say things like polyhedron.","zh":"这是一个线性规划问题，我当时说这很奇怪，因为如果我说像欧几里得球体或画一个圆，你的线性规划部分的大脑不应该被激活。因为当我说像多面体这样的词时，线性规划部分的大脑才会被激活。","start":4579.27,"end":4597.05},{"id":247,"text":"Inequalities. Visually, you should be seeing flat things with corners, right? You should see like a modern, you know, fighter jet with, you know, made with like flat parts and stuff like that for various reasons, right? That's what you should be seeing. You should not be seeing beautiful curves. I mean, anyway, that's what you should be seeing, right? And so that was weird, but that's it.","zh":"不等式。从视觉上看，你应该看到的是有角的平坦物体，对吧？你应该看到像现代的战斗机，由各种平坦的部分组成，对吧？这就是你应该看到的。你不应该看到优美的曲线。我的意思是，无论如何，这就是你应该看到的，对吧？所以这很奇怪，但就是这样。","start":4598.12,"end":4626.35},{"id":248,"text":"So that would be, take a point, and then you're shifting the mean. Now put a zero mean distribution around it with a log concave density, and then pick the center that maximizes the probability. That's another one. I think people call it, different fields, they call it different things. It's like the yield center. I don't know. There's all sorts of names for it. Everybody, or probabilistic center. But here's another one. The center of the maximum volume ellipsoid, right?","zh":"所以，这将是，取一个点，然后你移动均值。现在在这个点周围放置一个零均值的分布，其密度是日志凹的，然后选择使概率最大的中心。这是另一个例子。我想在不同领域，人们称它不同的名字。它像产量中心。我不知道。有各种各样的名称。概率中心。但这里还有一个例子。最大体积椭球的中心，对吧？","start":4627.52,"end":4655.75},{"id":249,"text":"And that's actually a very good one for reasons I'll get to, but not today. Okay, so this is centering. Oh, it turns out, of course, look, centering, let's talk about centering in R. It's going to be a very short conversation, right? So here's a convex set in R. It's called an interval. What's the center of an interval, a bounded interval? What's the center of the interval?","zh":"实际上，这在某些原因下是一个非常好的例子，但不是今天。好的，所以这就是中心化。哦，事实上，当然，让我们谈谈实数空间中的中心化。这将是一次非常简短的对话，对吧？这里有一个实数空间中的凸集。它被称为一个区间。一个有界的区间的中心是什么？区间的中心是什么？","start":4657.56,"end":4682.39},{"id":250,"text":"It's the center. It's the middle of it. I mean, come on, that's what it is. And there's no other, I mean, there's no other reason. You say, no, I think it should be, you know, the one that's one third of the way towards the left. And you're like, what does that mean, right? So there's, but the minute you get to like R2, it's actually interesting. It turns out there's multiple different definitions of a center. And we're going to look at some of them. So just to point this out, right? Okay.","zh":"就是中心。就是它的中间。我的意思是，这不就是它本来的样子吗？而且没有其他理由。你说，不，我觉得它应该是向左边三分之一的位置。你就会说，那是什么意思，对吧？所以，但是一旦你进入二维空间，它就变得有趣了。事实上，存在多种不同的中心定义。我们将看看其中的一些。所以，为了指出这一点，对吧？好的。","start":4684.88,"end":4712.96},{"id":251,"text":"One thing that's going to come up later is the so-called analytic center. And it's actually a weird thing. I'll say why it's weird in a minute. But it's actually not a center of the geometrical object. It's actually of a set of inequalities. So if I have a set of inequalities and some equality constraint, if I maximize the sum of the logs, these are the margins. fi should be less than 0. So minus fi should be positive.","zh":"后面会提到一个所谓的解析中心。实际上，这是一个很奇怪的概念。我稍后会解释为什么它奇怪。但它并不是几何对象的中心，而是不等式集合的中心。所以我有一组不等式和一些等式约束，如果我最大化对数的和，这些就是边界。fi 应该小于 0。所以负的 fi 应该是正的。","start":4713.5,"end":4741.68}],"notes":["本段讲解了凸优化中不同类型的中心概念，包括Chebyshev中心、概率中心和最大体积椭球中心。这些中心概念在不同的应用场景中具有不同的定义和用途。例如，Chebyshev中心是满足所有不等式约束的点中，到边界最远的点，而概率中心则是通过最大化概率分布下的概率来确定的中心。","在讨论中心概念时，讲者指出在低维空间（如R）中，中心的定义相对直观，但在高维空间（如R²）中，中心的定义变得复杂，存在多种不同的定义方式。这为后续讨论不同类型的中心概念奠定了基础。","讲者提到分析中心（analytic center）是一个特殊的中心概念，它不是几何对象的中心，而是由一组不等式约束和等式约束定义的。通过最大化对数和的函数，可以找到分析中心，这在优化问题中具有重要的应用价值。","在讲到分析中心时，讲者强调了其与几何中心的不同之处，并指出分析中心的定义基于约束条件的对数和，这与优化问题中的对偶性概念密切相关。","讲者还提到，分析中心的定义需要满足约束条件，即每个不等式约束的值必须小于零，因此在计算分析中心时，需要确保所有约束条件都满足。","本段内容为后续讨论不同类型的中心概念及其在凸优化中的应用提供了理论基础，同时也强调了在高维空间中中心概念的多样性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4579.27,"end":4741.68,"asr_flags":[],"math_clarifications":["原始片段中提到的'analytic center'涉及最大化对数和，但未提供完整的数学表达式，包括目标函数和约束条件。因此，无法确定该公式的正确形式和适用条件，需进一步澄清。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4579.27,"text":"It's an LP, and I said at the time it's weird, because if I say things like Euclidean ball or draw a circle, the linear programming part of your brain should not be lighting up. Because linear programming part of your brain should light up when I say things like polyhedron."},{"start":4598.12,"text":"Inequalities. Visually, you should be seeing flat things with corners, right? You should see like a modern, you know, fighter jet with, you know, made with like flat parts and stuff like that for various reasons, right? That's what you should be seeing. You should not be seeing beautiful curves. I mean, anyway, that's what you should be seeing, right? And so that was weird, but that's it. Okay, so that's the Chebyshev Center. But we have another one immediately. Oh, we saw another one. We saw the yield center or probability center."},{"start":4627.52,"text":"So that would be, take a point, and then you're shifting the mean. Now put a zero mean distribution around it with a log concave density, and then pick the center that maximizes the probability. That's another one. I think people call it, different fields, they call it different things. It's like the yield center. I don't know. There's all sorts of names for it. Everybody, or probabilistic center. But here's another one. The center of the maximum volume ellipsoid, right?"},{"start":4657.56,"text":"And that's actually a very good one for reasons I'll get to, but not today. Okay, so this is centering. Oh, it turns out, of course, look, centering, let's talk about centering in R. It's going to be a very short conversation, right? So here's a convex set in R. It's called an interval. What's the center of an interval, a bounded interval? What's the center of the interval?"},{"start":4684.88,"text":"It's the center. It's the middle of it. I mean, come on, that's what it is. And there's no other, I mean, there's no other reason. You say, no, I think it should be, you know, the one that's one third of the way towards the left. And you're like, what does that mean, right? So there's, but the minute you get to like R2, it's actually interesting. It turns out there's multiple different definitions of a center. And we're going to look at some of them. So just to point this out, right? Okay. One thing we..."},{"start":4713.5,"text":"One thing that's going to come up later is the so-called analytic center. And it's actually a weird thing. I'll say why it's weird in a minute. But it's actually not a center of the geometrical object. It's actually of a set of inequalities. So if I have a set of inequalities and some equality constraint, if I maximize the sum of the logs, these are the margins. fi should be less than 0. So minus fi should be positive."}],"speech_gaps":[],"frame":"../frames/v011/028.webp","frame_time":4591.27},{"title":"凸优化中的对数障碍函数与解析中心","segments":[{"id":252,"text":"Right, or non-negative, right? But here, this says, basically, maximize the product of the margins. That's called the analytic center of these inequalities, right? And it's going to turn out that's very easily computed. As a matter of fact, you will be computing it in about two weeks. So you'll be writing code to do that. Anyway, so I think we'll quit here for today, and we'll continue next time.","zh":"对，或者非负，对吧？但这里说的是，基本上是最大化边距的乘积。这被称为这些不等式的解析中心，对吧？而且事实上，它非常容易计算。事实上，你们将在大约两周后进行计算。你们将编写代码来实现这一点。无论如何，我认为我们今天就到这里，下次继续。","start":4742.4,"end":4769.27}],"notes":["本段讲解了凸优化中解析中心的概念，即最大化不等式约束的边距乘积。解析中心是凸优化中的一个重要概念，通常用于对数障碍函数的计算，它表示在可行域内部的一个点，使得所有约束的边距乘积最大化。","课程提到解析中心的计算相对容易，学生将在大约两周后通过编写代码来实现这一计算。这表明解析中心的计算方法在实际应用中具有可操作性。","讲者提到将在下节课继续讲解相关内容，说明当前课程内容为后续学习奠定了基础，强调了课程的连贯性和逐步深入的教学安排。","解析中心的计算与对数障碍函数密切相关，它在优化问题中用于逼近可行域的边界，同时保持内部点的可行性。","课程中提到的“product of the margins”是解析中心的核心定义，即最大化所有约束的边距乘积，这与对数障碍函数的构造有直接联系。","讲者强调了解析中心的计算将在后续课程中实现，这表明该概念在凸优化中的重要性，以及其在实际应用中的价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4742.4,"end":4769.27,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":1,"raw_segments":[{"start":4742.4,"text":"right, or non-negative, right? But here, this says, basically, maximize the product of the margins. That's called the analytic center of these inequalities, right? And it's going to turn out that's very easily computed. As a matter of fact, you will be computing it in about two weeks. So you'll be writing code to do that. Anyway, so I think we'll quit here for today, and we'll continue next time."}],"speech_gaps":[],"frame":"../frames/v011/029.webp","frame_time":4754.4}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v011.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
