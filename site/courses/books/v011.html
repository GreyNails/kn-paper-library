</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">11 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 11 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v011.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v011","title":"11 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 11","course":"凸优化","pages":[{"title":"课程公告与二元假设检验","segments":[{"id":0,"text":"Okay, we'll go ahead and start. So I guess congratulations for surviving the midterm. I suppose that was last week, but still, I should probably say that. Oh, I was also going to let people know that, like, for example, on things like the midterm and other times, too, we are not proud and we steal student solutions. Just to let you know.","zh":"好的，我们开始吧。所以我想祝贺大家通过了期中考试。我想那是在上周，但不管怎样，我应该说一下。哦，我还想告诉大家，比如在期中考试和其他时候，我们并不以自豪为荣，我们偷用了学生的解题方法。只是让大家知道一下。","start":5.26,"end":31.16},{"id":1,"text":"Right. So we go into it. I think there was one where we asked for some DCP representation of like what inverse product or something. We'd figured out two or three of them. And actually amongst you, you found several others. And we just happily put them into the solutions. Just just, you know, so we sometimes we give a heads up like.","zh":"对。我们继续。我想之前有一个问题，让我们要求一些DCP表示，比如逆乘积之类的。我们已经找到了两三个。实际上，你们当中的人也找到了好几个其他的。我们只是高兴地把它们放进了解答中。就是说，有时候我们会提前通知大家。","start":31.54,"end":50.63},{"id":2,"text":"You'll see that if you look at a homework solution, because the homework problem started life as maybe a final exam problem. And we'll sometimes we'll say, here's our solution. And you say, here's a far better solution submitted by a student. So we'll sometimes say that. But I just want to make it public that we we just we steal your solutions if they're better than ours. Happily. What's that? No, not really. No, no. It's an honor. Right. If you if you look at the solutions and you go like.","zh":"你们会看到，如果你看一下作业解答，因为作业问题最初可能是来自期末考试的问题。我们有时候会说，这里是我们解答。然后你会说，这里有一个学生提交的更好的解答。我们有时候会这样说。但我想让大家知道，我们只是高兴地偷用了你们的解答，如果它们比我们的更好。这是荣誉。对吧？如果你看一下解答，然后你会想，","start":51.27,"end":75.69},{"id":3,"text":"Whoa, that's my solution. And just think of it, right? Generations of other students will read their homework solution and look down there and they're like, whoa, that's like, who would have thought of that? Ah, yeah. No, we haven't. We don't attribute. Yeah, yeah, we don't. Theoretically, we know, right? Because it's somewhere in some email. It's like errata for the book, right? Oh, by the way, and actually people in the class have found","zh":"哇，那是我的解答。想想看，对吧？其他几代的学生会看到他们的作业解答，然后往下看，他们会想，哇，那是谁想出来的？啊，是的。我们没有。我们不归功于任何人。是的，是的，我们不归功于任何人。理论上，我们知道，对吧？因为它们在某封邮件里。就像书的勘误表一样，对吧？哦，顺便说一下，实际上，班上的人已经发现了","start":76.15,"end":104.38},{"id":4,"text":"several things that were just like wrong so i mean they don't the main points are still valid but uh i think we're at two and growing so that's pretty good too because people have been looking at it pretty carefully for a long time so and they're just so anyway so thanks to those people as well okay um let's see","zh":"好几个错误，我的意思是，它们的主要观点仍然有效，但嗯，我想我们现在已经有两个，而且还在增长，这也很不错，因为人们已经仔细地检查了很久了，所以他们只是如此而已。总之，也要感谢这些人们。好的，嗯，我们看看","start":105.44,"end":126.53},{"id":5,"text":"Were there any other announcements? That was it. Good. Let's see. Any questions about midterm finals, where we are, what we're doing, all that kind of stuff? Okay, that's a no. So, okay. Good. We'll continue. So we'll continue. Last time we looked at this.","zh":"还有其他公告吗？这就是全部了。很好。我们看看。有关期中考试、期末考试、我们目前的进展以及所有这些方面的问题，有什么问题吗？好的，没有问题。那么，好的。我们继续。我们上次讨论了这个。","start":127.44,"end":151.32},{"id":6,"text":"binary hypothesis testing, right? Which is, I mean, in some ways it's the essence of kind of like all of statistics, right? It's, you have, in this case, you have just two distributions. You observe one sample and the question is, you know, which distribution generated it? One or the other.","zh":"二元假设检验，对吧？也就是说，在某种意义上，它是统计学本质的一部分，对吧？在这种情况下，你只有两个分布。你观察一个样本，问题是，你知道，这个样本是由哪一个分布生成的？是其中一个还是另一个。","start":153.5,"end":169.04}],"notes":["本段主要讨论了课程中关于学生解决方案的处理方式，强调了教师会采纳学生提交的更优解法，并公开承认这一点。教师提到，学生提交的解决方案有时会比教师自己的更好，因此会将其纳入作业解答中，但不会署名。","教师还提到，学生可能会发现教材中的错误，并指出这些错误的存在，但主要观点仍然有效。教师表示，目前已有两个错误被发现，并且数量在增长，这表明学生对教材的仔细阅读和关注。","教师在表达时语气较为随意，包含一些重复和停顿，但核心信息是关于课程公告和学生解决方案的处理方式，以及教材中可能存在的错误。"],"formulas":[],"uncertainties":["several things that were just like wrong so i mean they don't the main points are still valid but uh i think we're at two and growing"],"diagram":"none","start":5.26,"end":169.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.26,"text":"Okay, we'll go ahead and start. So I guess congratulations for surviving the midterm. I suppose that was last week, but still, I should probably say that. Oh, I was also going to let people know that, like, for example, on things like the midterm and other times, too, we are not proud and we steal student solutions. Just to let you know."},{"start":31.54,"text":"Right. So we go into it. I think there was one where we asked for some DCP representation of like what inverse product or something. We'd figured out two or three of them. And actually amongst you, you found several others. And we just happily put them into the solutions. Just just, you know, so we sometimes we give a heads up like."},{"start":51.27,"text":"You'll see that if you look at a homework solution, because the homework problem started life as maybe a final exam problem. And we'll sometimes we'll say, here's our solution. And you say, here's a far better solution submitted by a student. So we'll sometimes say that. But I just want to make it public that we we just we steal your solutions if they're better than ours. Happily. What's that? No, not really. No, no. It's an honor. Right. If you if you look at the solutions and you go like."},{"start":76.15,"text":"Whoa, that's my solution. And just think of it, right? Generations of other students will read their homework solution and look down there and they're like, whoa, that's like, who would have thought of that? Ah, yeah. No, we haven't. We don't attribute. Yeah, yeah, we don't. Theoretically, we know, right? Because it's somewhere in some email. It's like errata for the book, right? Oh, by the way, and actually people in the class have found"},{"start":105.44,"text":"several things that were just like wrong so i mean they don't the main points are still valid but uh i think we're at two and growing so that's pretty good too because people have been looking at it pretty carefully for a long time so and they're just so anyway so thanks to those people as well okay um let's see"},{"start":127.44,"text":"Were there any other announcements? That was it. Good. Let's see. Any questions about midterm finals, where we are, what we're doing, all that kind of stuff? Okay, that's a no. So, okay. Good. We'll continue. So we'll continue. Last time we looked at this."},{"start":153.5,"text":"binary hypothesis testing, right? Which is, I mean, in some ways it's the essence of kind of like all of statistics, right? It's, you have, in this case, you have just two distributions. You observe one sample and the question is, you know, which distribution generated it? One or the other."}],"speech_gaps":[],"frame":"../frames/v011/001.webp","frame_time":17.259999999999998},{"title":"统计假设检验与优化问题","segments":[{"id":7,"text":"And if you make that more complicated and have distributions not on a finite number of points, but on Rn or something like that, or more complicated things, and you have more than two hypotheses, then that's kind of most of statistics right there. Anyway, so this is a very simple setting.","zh":"如果你让这个问题变得更复杂，比如分布不是在有限个点上，而是在Rn或者类似的空间上，或者更复杂的情况，并且有超过两个假设，那么这基本上就是统计学的大部分内容了。总之，这是一个非常简单的设定。","start":169.44,"end":187.26},{"id":8,"text":"And so the question was to make a guess about whether an observation, right? And an observation is like a number like three. That's an observation, right? That's what happened. And then your goal is to try to figure out that it come or guess in some intelligent way that it come from this distribution or this one, right? And we looked at that. You end up with, you have this idea of a...","zh":"所以问题是，要对一个观察结果做一个猜测，对吧？观察结果就像一个数字，比如三。这就是一个观察结果，对吧？这就是实际发生的事情。然后你的目标是尝试以一种智能的方式猜测它来自哪一个分布，对吧？我们已经讨论过这个问题。你最终会得到一个想法，","start":189.34,"end":213.96},{"id":9,"text":"a randomized detector. It's a policy that says, when you observe this outcome, which distribution do you attribute it to, right? And if it's, and that you do with a, you know, a two by N matrix, where the columns give you the probabilities that you announce it came from, you know, P or Q, the two different distributions, right? So that's how that works.","zh":"一个随机化检测器。它是一种策略，当你观察到某个结果时，它告诉你这个结果来自哪个分布，对吧？而且你用一个2乘N的矩阵来实现这一点，其中的列给出了你宣布它来自P或Q这两个不同分布的概率，对吧？这就是它的运作方式。","start":214.69,"end":238.85},{"id":10,"text":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?","zh":"如果这些值都是0和1，那么它就是确定性的。你最终会把这个写成一个双标准优化问题。你关心的有两个方面，即假阳性概率，记作PFP，以及假阴性概率，对吧？这些只是通过矩阵乘法得到的。关键点在于，每一个都是T的线性函数。T描述了你的检测器，对吧？","start":240.42,"end":269.94},{"id":11,"text":"Anyway, so this problem, it turns out, is actually really quite...","zh":"总之，这个问题，事实上，其实相当...","start":270.9,"end":274.7},{"id":12,"text":"That would be lambda equals 1. And then the solution is like analytic and it's been known since, I don't know, probably 1900 or something. And it basically says, in that case, and it's completely reasonable, it says if lambda is 1 and you want to minimize, say, the total number of errors, you would say, well, what I would do is if I will choose the distribution which had higher likelihood. And we'll see that in another context, or we've already seen it in the context of maximum likelihood, so that's an example of that.","zh":"那将是lambda等于1。然后解是分析性的，并且从大约1900年左右就已经为人所知了。它基本上说，在这种情况下，这是完全合理的，它说如果lambda等于1，而你想最小化总错误数，那么你会说，好吧，我会选择似然更高的分布。我们会在另一个上下文中看到这一点，或者我们已经在最大似然的上下文中看到过这一点，这就是一个例子。","start":276.05,"end":302.49},{"id":13,"text":"That would be lambda equals 1. And then the solution is like analytic and it's been known since, I don't know, probably 1900 or something. And it basically says, in that case, and it's completely reasonable, it says if lambda is 1 and you want to minimize, say, the total number of errors, you would say, well, what I would do is if I will choose the distribution which had higher likelihood. And we'll see that in another context, or we've already seen it in the context of maximum likelihood, so that's an example of that.","zh":"那将是lambda等于1。然后解是解析的，而且自1900年左右就已经为人所知了。在这种情况下，它完全合理，它指出，如果lambda等于1，而你想要最小化总错误数，你会说，我将选择具有更高似然的分布。我们将在另一个上下文中看到这一点，或者我们已经在最大似然的上下文中见过这一点，这就是一个例子。","start":302.97,"end":330.61}],"notes":["本段讲解了统计假设检验的基本概念，即通过观察数据来判断其来源于哪一个分布。讲者提到，当有多个假设时，问题变得复杂，但这里讨论的是二元假设检验的情况。观察值可以是像数字3这样的具体数值，目标是通过某种方式判断其来源于哪一个分布。","讲者介绍了随机检测器（randomized detector）的概念，这是一种策略，用于在观察到结果后决定其来源于哪一个分布。这种策略可以通过一个2×N的矩阵来表示，其中每一列给出将结果归因于P或Q分布的概率。","讲者进一步解释了如何将问题转化为双标准优化问题，其中两个关键指标是误报率（PFP）和漏报率（P FN）。这两个指标可以通过矩阵乘法直接计算，并且它们都是关于检测器参数T的线性函数。","讲者提到，当将问题标量化（scalarize）后，可以通过引入一个权重因子λ来平衡误报率和漏报率的重要性。当λ=1时，目标是最小化总的错误数量，此时的最优策略是选择具有更高似然值的分布。","讲者指出，这种策略在最大似然估计的背景下已经被广泛研究，并且可以应用于其他统计问题中。这表明，通过优化方法可以解决统计假设检验中的决策问题。","讲者强调，这种优化问题的解法在理论上是已知的，并且具有分析解，这表明在统计决策中，通过数学优化方法可以找到合理的决策策略。"],"formulas":[{"latex":"PFP = \\text{probability of false positive}","symbols":"误报率","explanation":"定义误报率，无需修改。","evidence":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"},{"latex":"PFN = \\text{probability of false negative}","symbols":"漏报率","explanation":"定义漏报率，无需修改。","evidence":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"},{"latex":"T = \\text{detector parameter}","symbols":"检测器参数","explanation":"定义检测器参数，无需修改。","evidence":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"}],"uncertainties":["lambda equals 1"],"d
