now, am I far? What's my distance to the obstacle or something?"},{"start":2580.53,"text":"Okay, so, all right. So, now we're going to look at ones that are not obvious at all. And these are going to be... I think these are all pretty simple, right? This gets very weird and cool. And it's more than 100 years old. So, here it is. Suppose I have just a set C in Rn, right? And what I want is I want to find the minimum volume ellipsoid that covers it. Okay? So..."},{"start":2610.4,"text":"That's, you know, that's got a name. It's called the Loner-John ellipsoid of a set C. And now we're going to show you how to pose that as a convex optimization problem. And this is actually, it's interesting. Now you have to be very careful because there's lots of parameterization of ellipsoids."},{"start":2632.97,"text":"And for each of these problems, we're actually going to take different parameterizations, because in that parameterization, it's going to be convex, and in another one, it will not be. So you have to be completely on your toes on these things, right? I mean, the truth is we already saw it. We didn't mention it here, but for example, if I ask you to estimate the covariance of a zero-mean Gaussian vector from data,"},{"start":2659.11,"text":"Then it turns out the log likelihood is not concave in sigma, the covariance matrix. It is concave in the inverse, which is the precision matrix. So if you know what I'm talking about, fine, and if you don't, that's fine too. So that's a case where there's lots of ways to say what a covariance matrix is. You could give its inverse, you could give it."},{"start":2682.97,"text":"And it's going to turn out some things are convex in one but not the other and so on and so forth, right? And this is similar. So here we go. So we're going to do this. I'm going to write the ellipsoid. I'm going to parameterize it by a matrix A and a vector B. And it's the inverse image of the unit ball under an affine mapping. Okay? Everybody got that here? So that's..."}],"speech_gaps":[],"frame":"../frames/v011/016.webp","frame_time":2547.5},{"title":"椭球参数化与对称性假设","segments":[{"id":179,"text":"That's what it's going to be. Okay. And here, I'm going to say that without loss of generality, I'm going to assume A is symmetric and positive definite. Okay? I mean, okay, so it has to be just positive semi-definite because I want it to be invertible here, right? Otherwise, that's not an ellipsoid. It's got like a, you know, whatever. It's got some infinite. It's a cylinder, I think is what people call it or something like that."},{"id":180,"text":"Okay, so I would like to know if someone says, yeah, I have a parameterization of ellipsoid with an A and a B, but my A is not symmetric. So I need someone to help me to see why we would say without loss of generality, right? This is a subtlety, right? So, but an important one, right? So I have, it's a set of X for which AX"},{"id":181,"text":"I can't remember, is it plus or minus B? AX plus B, right? Two norm is less than one. Someone gives you this, but A is not symmetric. Or it's not symmetric and positive definite. So A is invertible. So any suggestions on what we can do here? They give you a lower triangular matrix. I don't know what they give. They give you something like that. So what do I do? Any, yeah."},{"id":182,"text":"Singular value decomposition. Yeah. Let's write u. Let's say it's u sigma v transpose. Those are all square because it's non-singular. Okay? Does everyone agree that if I took this vector and I put in here an orthogonal matrix, then nothing has changed? I could put a q in front here, which is orthogonal."},{"id":183,"text":"And this constraint is identical because if I rotate something and if I rotate the unit ball, you still have the unit ball. Everybody cool with that? Okay. Can someone suggest a Q I should apply to this? And you want to apply a Q, which is going to have no effect whatsoever on this, but it's going to render this thing. When I multiply by Q on the left, this thing is going to come out positive, definite, and symmetric."}],"notes":["本段讨论了椭球参数化中矩阵A的对称性假设。讲者指出，为了确保椭球的可逆性，A必须是正定的，而非仅正半定。这是因为如果A不是正定的，那么椭球的形状可能退化为圆柱体或其他非椭球形状。","讲者强调，即使A不是对称的，也可以通过奇异值分解（SVD）将其转换为对称正定矩阵。SVD将矩阵分解为正交矩阵和对角矩阵的乘积，从而保留了原始矩阵的几何特性。","讲者进一步说明，通过应用正交矩阵Q，可以保持约束条件不变，同时使矩阵A变为对称正定形式。这是因为正交变换不会改变向量的长度或形状，因此旋转后的单位球仍然是单位球。","讲者提到，这种变换对于理解椭球的参数化和优化问题非常重要，因为它允许我们假设A是对称正定的，从而简化了问题的分析。","讲者还指出，这种假设并不影响问题的普遍性，因为任何非对称的A都可以通过正交变换转换为对称正定形式，从而保持问题的等价性。","最后，讲者询问听众是否可以建议一个合适的正交矩阵Q，以实现这一转换，这表明课程正在引导学生思考如何应用SVD进行矩阵变换。"],"formulas":[{"latex":"Q^T Q = I","symbols":"正交矩阵Q的性质","explanation":"该公式正确描述了正交矩阵Q的性质，即其转置乘以自身等于单位矩阵。","evidence":"Singular value decomposition. Yeah. Let's write u. Let's say it's u sigma v transpose. Those are all square because it's non-singular. Okay? Does everyone agree that if I took this vector and I put in here an orthogonal matrix, then nothing has changed? I could put a q in front here, which is orthogonal."}],"uncertainties":[],"diagram":"none","start":2713.15,"end":2866.4,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的上下文来验证AX + B和Q^T A Q的数学性质或条件，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2713.15,"text":"That's what it's going to be. Okay. And here, I'm going to say that without loss of generality, I'm going to assume A is symmetric and positive definite. Okay? I mean, okay, so it has to be just positive semi-definite because I want it to be invertible here, right? Otherwise, that's not an ellipsoid. It's got like a, you know, whatever. It's got some infinite. It's a cylinder, I think is what people call it or something like that."},{"start":2742.17,"text":"Okay, so I would like to know if someone says, yeah, I have a parameterization of ellipsoid with an A and a B, but my A is not symmetric. So I need someone to help me to see why we would say without loss of generality, right? This is a subtlety, right? So, but an important one, right? So I have, it's a set of X for which AX,"},{"start":2771.83,"text":"I can't remember, is it plus or minus B? AX plus B, right? Two norm is less than one. Someone gives you this, but A is not symmetric. Or it's not symmetric and positive definite. So A is invertible. So any suggestions on what we can do here? They give you a lower triangular matrix. I don't know what they give. They give you something like that. So what do I do? Any, yeah."},{"start":2804.49,"text":"Singular value decomposition. Yeah. Let's write u. Let's say it's u sigma v transpose. Those are all square because it's non-singular. Okay? Does everyone agree that if I took this vector and I put in here an orthogonal matrix, then nothing has changed? I could put a q in front here, which is orthogonal."},{"start":2835.84,"text":"And this constraint is identical because if I rotate something and if I rotate the unit ball, you still have the unit ball. Everybody cool with that? Okay. Can someone suggest a Q I should apply to this? And you want to apply a Q, which is going to have no effect whatsoever on this, but it's going to render this thing. When I multiply by Q on the left, this thing is going to come out positive, definite, and symmetric."}],"speech_gaps":[],"frame":"../frames/v011/017.webp","frame_time":2725.15},{"title":"椭球体积与约束条件","segments":[{"id":184,"text":"I'm open to suggestions for what Q is. V U transpose. Yeah, there you go. Q equals V U transpose. That's orthogonal. These are both orthogonal. These are orthogonal. So if I plug that in there, then A is now going to be V sigma V transpose, which is symmetric and positive definite. Everybody got this? Okay, so this is, it's a subtlety, but it's actually going to be super important. Okay, and then it says the following."},{"id":185,"text":"Oh, with this parameterization, the volume is proportional to the determinant of A inverse, right? And you can figure that out, right? If A gets big, then the ellipsoid gets small, right? You can kind of see that, right? And so the volume is proportional to det A inverse. And in fact, I think..."},{"id":186,"text":"The proportionality constant is this magic number, which is the volume of a unit ball in Rn, which has some gamma functions and probably some pi's in it and other stuff. It doesn't matter. It's a positive constant for us. So this thing is going to... This is the same as minimizing the volume of E."},{"id":187,"text":"Then the other thing we have is we have to have that every element of C has to be in this ellipsoid. And the way to express that is this. It says that if you maximize over C, A, V plus B, right, in two norm, if that's more than one, then you're not in E. If it's less than or equal to one, you're in E. Everybody got that?"},{"id":188,"text":"And now we have to stare at this and you really have to concentrate. Let me give you a couple of the warnings about why you have to concentrate now. Because the variables in this problem are capital A and little b. I mean, the usual convention is that a, b, c, d are like data. They're constant, right? And the usual convention is the variables are things like u, v, x, y, z. Everybody following this? That's usually, right? But here..."},{"id":189,"text":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?"}],"notes":["本段讨论了在参数化下，椭球体积与矩阵A的行列式倒数成正比。当A增大时，椭球体积减小，这与矩阵的逆的行列式有关。比例常数是单位球体在R^n中的体积，包含伽马函数和π等，但对问题本身并不重要，只需知道它是一个正数常量。","接下来，课程强调了约束条件：所有C中的元素必须位于椭球内。通过最大化C、A、V加上B的二范数，若结果大于1，则元素不在椭球内；若小于等于1，则在椭球内。这为椭球约束提供了数学表达。","课程提醒学生注意变量的区分：通常a、b、c、d是数据（常数），而u、v、x、y、z是变量。但在本问题中，变量是A和b，这与常规不同，需要特别注意。","v被描述为哑变量，对问题没有实际意义。但课程指出，a必须是对称正定矩阵，且目标函数是凸的log行列式，这需要进一步分析其约束条件。","最后，课程提到，当固定v时，关于a的函数是凸的，这与a的对称正定性有关。这为后续的优化问题提供了理论基础。","整个段落强调了椭球体积的最小化与约束条件的结合，是凸优化问题中的关键部分，需要学生仔细理解变量和约束的定义。"],"formulas":[{"latex":"vol(E) \\text{ is proportional to } \\det(A^{-1})","symbols":"体积与矩阵A的行列式倒数成正比","explanation":"公式正确，体积与矩阵A的行列式倒数成正比，符合椭球体积的数学性质。","evidence":"Oh, with this parameterization, the volume is proportional to the determinant of A inverse, right? And you can figure that out, right? If A gets big, then the ellipsoid gets small, right? You can kind of see that, right? And so the volume is proportional to debt A inverse. And in fact, I think..."},{"latex":"x \\text{ is in } E \\text{ if } \\max_{c \\in C} \\|A v + B\\| \\leq 1","symbols":"元素在椭球内当且仅当其二范数最大值小于等于1","explanation":"公式正确，椭球内的条件是所有元素的二范数最大值小于等于1，符合椭球的定义。","evidence":"Then the other thing we have is we have to have that every element of C has to be in this ellipsoid. And the way to express that is this. It says that if you maximize over C, A, V plus B, right, in two norm, if that's more than one, then you're not in E. If it's less than or equal to one, you're in E. Everybody got that?"},{"latex":"A \\text{ is symmetric positive definite}","symbols":"矩阵A是对称正定的","explanation":"公式正确，矩阵A是对称正定的，符合椭球的定义和后续计算的需要。","evidence":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?"},{"latex":"f(a) = \\log \\det(A^{-1}) \\text{ is convex in } a","symbols":"关于a的log行列式函数是凸函数","explanation":"公式正确，log行列式函数在对称正定矩阵上是凸函数，符合凸优化的性质。","evidence":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?"}],"uncertainties":["det A inverse"],"diagram":"none","start":2867.98,"end":3029.88,"asr_flags":[],"math_clarifications":["公式中的'vol(E)'表示椭球E的体积，'det(A^{-1})'表示矩阵A的行列式倒数，'\\max_{c \\in C} \\|A v + B\\| \\leq 1'表示所有元素在椭球内，'A'是对称正定矩阵，'f(a) = \\log \\det(A^{-1})'是凸函数。"],"raw_segments":[{"start":2867.98,"text":"I'm open to suggestions for what Q is. V U transpose. Yeah, there you go. Q equals V U transpose. That's orthogonal. These are both orthogonal. These are orthogonal. So if I plug that in there, then A is now going to be V sigma V transpose, which is symmetric and positive definite. Everybody got this? Okay, so this is, it's a subtlety, but it's actually going to be super important. Okay, and then it says the following."},{"start":2899.29,"text":"Oh, with this parameterization, the volume is proportional to the determinant of A inverse, right? And you can figure that out, right? If A gets big, then the ellipsoid gets small, right? You can kind of see that, right? And so the volume is proportional to debt A inverse. And in fact, I think..."},{"start":2919.93,"text":"The proportionality constant is this magic number, which is the volume of a unit ball in Rn, which has some gamma functions and probably some pi's in it and other stuff. It doesn't matter. It's a positive constant for us. So this thing is going to... This is the same as minimizing the volume of E."},{"start":2946.11,"text":"Then the other thing we have is we have to have that every element of C has to be in this ellipsoid. And the way to express that is this. It says that if you maximize over C, A, V plus B, right, in two norm, if that's more than one, then you're not in E. If it's less than or equal to one, you're in E. Everybody got that?"},{"start":2971.22,"text":"And now we have to stare at this and you really have to concentrate. Let me give you a couple of the warnings about why you have to concentrate now. Because the variables in this problem are capital A and little b. I mean, the usual convention is that a, b, c, d are like data. They're constant, right? And the usual convention is the variables are things like u, v, x, y, z. Everybody following this? That's usually, right? But here..."},{"start":3000.03,"text":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?"}],"speech_gaps":[],"frame":"../frames/v011/018.webp","frame_time":2879.98},{"title":"凸优化中的椭球覆盖问题与异常值检测","segments":[{"id":190,"text":"For a fixed V. It's convex. In A and B. Sorry, it's jointly in A and B. It's convex. Matter of fact, the argument here, A, V plus B, is a linear function of the pair A, B, right? Not even affine. It's just linear, right? And so this thing, for a fixed V, is a convex function of the pair A, B. That's a supremum. Doesn't matter what C is."},{"id":191,"text":"This left-hand side is a convex function here. So that's a convex function, and it's less than or equal to 1. So this is a convex optimization problem. So this is how you would minimize the volume of an ellipsoid that covers a given set C. Now, we have to turn this into something reasonable, something that we can handle, and we'll do that. Here's a super simple example, a finite set."},{"id":192,"text":"and you have m points, and you end up with a completely reasonable thing. It just looks like that, and that's a convex problem. You can solve it, and you just get, it just works, right? It just gives you the minimum volume ellipsoid. So if I give you a bunch of points, by the way, that has a whole lot of applications. I'll just mention one for fun, right? So here's a bunch of points."},{"id":193,"text":"like that, right? And then you, oh God, I don't know what I'm going to do here. Okay, so then you get some ellipsoid that looks like that, right? And that's going to be the minimum volume ellipsoid that covers those points. Everybody following this? So here's actually an interesting way to, suppose these are like, not in two dimensions, it's silly, but suppose it's in high dimensions."},{"id":194,"text":"And I want to ask, which of my data points here are like outliers? Just like that. I don't have a statistical model, although that would be a reasonable way. So what would be some reasonable ways to say something is an outlier? It's close to the edge of an absolute. It's what? It's close to the edge. Oh, no, I haven't computed this yet. Let's just do, like, how would you do it otherwise? Well, you could actually find the mean. Here, here's one. You could find the mean and the covariance of the data points."},{"id":195,"text":"And then you'd look at the so-called Mahalanobis distance or something from the center. That would be a reasonable way. Or you could look and just say, well, which of your points are really big? Those are outliers. This is actually a quite good one. It's entirely dependent on the outliers. Because you can kind of see that if you shrink an ellipsoid down, it's going to stop when actually generically n, n plus 1 over 2."}],"notes":["本段讲解了如何通过凸优化问题最小化覆盖给定集合C的椭球体积。首先，讲者指出对于固定的V，函数在A和B上是凸的，因为A和V加上B是A和B的线性函数，因此整体是凸函数。接着，讲者提到这是一个凸优化问题，并指出需要将问题转化为可处理的形式，例如使用有限集合的例子。","讲者以有限集合为例，说明如何通过凸优化问题求解最小体积椭球。讲者提到，这种方法在实际中有很多应用，例如检测异常值。讲者还提到，当数据点处于高维空间时，如何判断哪些点是异常值的问题。","讲者讨论了异常值检测的几种方法，包括计算数据点的均值和协方差，然后使用马氏距离来判断异常值。此外，讲者还提到，可以通过观察数据点的大小来判断异常值，这种方法虽然简单，但依赖于数据的分布特性。","讲者指出，当椭球缩小到一定程度时，会停止在某个特定的点，这与数据点的维度有关。讲者提到，这种停止点通常与数据点的维度n和n+1/2有关，但具体细节需要进一步分析。","讲者强调，异常值检测的方法需要根据具体问题选择，例如是否使用统计模型或直接基于数据点的大小。讲者还提到，马氏距离是一种合理的检测方法，因为它考虑了数据的协方差结构。","讲者最后指出，异常值检测的问题在高维空间中尤为复杂，因为数据点的分布可能更加稀疏，需要更精细的分析方法。"],"formulas":[{"latex":"\\text{Mahalanobis distance}","symbols":"马氏距离","explanation":"马氏距离是已知的统计学概念，无需修改，保留。","evidence":"And I want to ask, which of my data points here are like outliers? Just like that. I don't have a statistical model, although that would be a reasonable way. So what would be some reasonable ways to say something is an outlier? It's close to the edge of an absolute. It's what? It's close to the edge. Oh, no, I haven't computed this yet. Let's just do, like, how would you do it otherwise? Well, you could actually find the mean. Here, here's one. You could find the mean and the covariance of the data points."}],"uncertainties":["n, n plus 1 over 2"],"diagram":"none","start":3031.13,"end":3209.87,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的数学定义或公式来支持E_min和A, V + B的数学表达，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3031.13,"text":"For a fixed V. It's convex. In A and B. Sorry, it's jointly in A and B. It's convex. Matter of fact, the argument here, A, V plus B, is a linear function of the pair A, B, right? Not even affine. It's just linear, right? And so this thing, for a fixed V, is a convex function of the pair A, B. That's a supremum. Doesn't matter what C is."},{"start":3060.12,"text":"This left-hand side is a convex function here. So that's a convex function, and it's less than or equal to 1. So this is a convex optimization problem. So this is how you would minimize the volume of an ellipsoid that covers a given set C. Now, we have to turn this into something reasonable, something that we can handle, and we'll do that. Here's a super simple example, a finite set."},{"start":3091.6,"text":"and you have m points, and you end up with a completely reasonable thing. It just looks like that, and that's a convex problem. You can solve it, and you just get, it just works, right? It just gives you the minimum volume ellipsoid. So if I give you a bunch of points, by the way, that has a whole lot of applications. I'll just mention one for fun, right? So here's a bunch of points."},{"start":3122.15,"text":"like that, right? And then you, oh God, I don't know what I'm going to do here. Okay, so then you get some ellipsoid that looks like that, right? And that's going to be the minimum volume ellipsoid that covers those points. Everybody following this? So here's actually an interesting way to, suppose these are like, not in two dimensions, it's silly, but suppose it's in high dimensions."},{"start":3148.31,"text":"And I want to ask, which of my data points here are like outliers? Just like that. I don't have a statistical model, although that would be a reasonable way. So what would be some reasonable ways to say something is an outlier? It's close to the edge of an absolute. It's what? It's close to the edge. Oh, no, I haven't computed this yet. Let's just do, like, how would you do it otherwise? Well, you could actually find the mean. Here, here's one. You could find the mean and the covariance of the data points."},{"start":3180.46,"text":"And then you'd look at the so-called Mahalanobis distance or something from the center. That would be a reasonable way. Or you could look and just say, well, which of your points are really big? Those are outliers. This is actually a quite good one. It's entirely dependent on the outliers. Because you can kind of see that if you shrink an ellipsoid down, it's going to stop when actually generically n, n plus 1 over 2."}],"speech_gaps":[],"frame":"../frames/v011/019.webp","frame_time":3043.13},{"title":"椭球剥皮法与异常值检测","segments":[{"id":196,"text":"But if that's the dimension, points are on that ellipsoid, right? So there's a method for removing outliers called ellipsoidal peeling. First of all, it's a great name, and it's also a pretty good method. And it works like this. You say thanks for the data, you find the minimum volume ellipsoid, and you find the points that it touches, right? Those are the ones for which this constraint here is equal to 1, okay?"},{"id":197,"text":"Then you declare those to be outliers and you remove them and you continue until you like what happens. Like, for example, you're out of sample, whatever. If you have some other test you can check, your estimator gets better or something like that. Everybody following this? Okay. That is very cool. Okay. Let me ask one question just for fun. Suppose that you do that."},{"id":198,"text":"and I have hundreds and hundreds of points, but let's say that 25 satisfy this with equality. Everybody following this? 25. And you'd say, I'm going to remove them. There's 25 outliers. Then someone says, please don't. You go, why? Because, look, there's no way we have 25 outliers. We actually only have five. Or I couldn't imagine it being more than five. Everybody following this? Could someone please suggest how you might choose the candidates to remove?"},{"id":199,"text":"Sounds like a trick question. It's actually not, and it tells you if you can use the material we've looked at. I compute the minimum volume. Let's review. I have a whole bunch of vectors. I compute a minimum volume ellipsoid. Let's say 22 of the points are actually on that minimum volume ellipsoid, meaning that constraint is tight for 22. I say, take them all out. And they go, no, you're throwing away too much of my data."},{"id":200,"text":"Yeah, but what's the far edge of an ellipsoid? No, I don't think that works, right? Was there another suggestion? Maximize the difference in the volume from the original to when you remove five of the points? Yeah, something like that might happen. Was there another suggestion?"},{"id":201,"text":"Yeah? Randomly throw out. Okay, that would be fine. How about you say, here, ellipsoidal peeling says that the first, these 20 are bad. And they go, they say, no, no, no, I can only have, I can't imagine having more than five outliers. And you go, cool. And you just remove the first five. Is that your suggestion? Okay. No, I like it. That's a good street fighting thing, you know. I mean, you don't say it like that to the person. You just go, hang on a minute. And you go back and you pretend to."}],"notes":["本段讲解了椭球剥皮法（ellipsoidal peeling）用于异常值检测的基本思想。该方法通过计算最小体积椭球，找到与椭球表面接触的点，这些点被认为是异常值。然而，这种方法在实际应用中可能遇到问题，例如当实际异常值数量远少于椭球表面接触点数量时，直接移除所有接触点会导致数据丢失过多。","讲者通过一个具体例子说明了这一问题：假设25个点满足椭球约束的等式，但实际只有5个是异常值。此时，直接移除25个点显然不合理，因此需要一种更合理的策略来选择异常值。","讲者询问听众如何选择异常值候选点，提出了几种可能的策略，包括最大化移除部分点后椭球体积的变化、随机移除等。这些策略反映了在实际应用中如何平衡异常值检测的准确性与数据保留的完整性。","讲者还提到，椭球剥皮法在实际应用中可能需要结合其他方法，例如通过迭代过程逐步移除异常值，直到满足某种停止条件（如数据质量提升）。这种方法在处理高维数据时可能面临计算复杂度高的问题。","此外，讲者强调了在实际应用中，异常值检测需要结合领域知识和数据特性，不能仅依赖数学方法。例如，当数据中存在少量异常值时，直接移除所有接触椭球表面的点可能并不合理。","最后，讲者以一种幽默的方式总结了椭球剥皮法的局限性，并指出在实际应用中需要灵活处理，例如通过逐步移除异常值或结合其他方法来提高检测效果。"],"formulas":[],"uncertainties":[],"diagram":"ellipsoid","start":3210.32,"end":3384.62,"asr_flags":[],"raw_segments":[{"start":3210.32,"text":"But if that's the dimension, points are on that ellipsoid, right? So there's a method for removing outliers called ellipsoidal peeling. First of all, it's a great name, and it's also a pretty good method. And it works like this. You say thanks for the data, you find the minimum volume ellipsoid, and you find the points that it touches, right? Those are the ones for which this constraint here is equal to 1, okay?"},{"start":3239.8,"text":"Then you declare those to be outliers and you remove them and you continue until you like what happens. Like, for example, you're out of sample, whatever. If you have some other test you can check, your estimator gets better or something like that. Everybody following this? Okay. That is very cool. Okay. Let me ask one question just for fun. Suppose that you do that."},{"start":3265.69,"text":"and I have hundreds and hundreds of points, but let's say that 25 satisfy this with equality. Everybody following this? 25. And you'd say, I'm going to remove them. There's 25 outliers. Then someone says, please don't. You go, why? Because, look, there's no way we have 25 outliers. We actually only have five. Or I couldn't imagine it being more than five. Everybody following this? Could someone please suggest how you might choose the candidates to remove?"},{"start":3297.53,"text":"Sounds like a trick question. It's actually not, and it tells you if you can use the material we've looked at. I compute the minimum volume. Let's review. I have a whole bunch of vectors. I compute a minimum volume ellipsoid. Let's say 22 of the points are actually on that minimum volume ellipsoid, meaning that constraint is tight for 22. I say, take them all out. And they go, no, you're throwing away too much of my data."},{"start":3334.04,"text":"Yeah, but what's the far edge of an ellipsoid? No, I don't think that works, right? Was there another suggestion? Maximize the difference in the volume from the original to when you remove five of the points? Yeah, something like that might happen. Was there another suggestion?"},{"start":3357.74,"text":"Yeah? Randomly throw out. Okay, that would be fine. How about you say, here, ellipsoidal peeling says that the first, these 20 are bad. And they go, they say, no, no, no, I can only have, I can't imagine having more than five outliers. And you go, cool. And you just remove the first five. Is that your suggestion? Okay. No, I like it. That's a good street fighting thing, you know. I mean, you don't say it like that to the person. You just go, hang on a minute. And you go back and you pretend to."}],"speech_gaps":[],"frame":"../frames/v011/020.webp","frame_time":3222.32},{"title":"对偶性与椭球体覆盖问题","segments":[{"id":202,"text":"change the code and stuff like that. Okay. And then you do that. Okay. That was another suggestion somewhere. All right. Let me try one more time. Yeah. To see if I can elicit a response. Okay. I have 20 constraints that are tight. I would like to remove five. In fact, I'll even, do I even have to say, I'll even say I want to remove the five tightest constraints. How about that? Please. What?"},{"id":203,"text":"Oh, there we go. Okay, fine. You get the dual variables, which you get for free. And then you remove the 5 with the 5 largest dual variables. Everybody cool? That's pretty sophisticated. I mean, we're just putting ideas from the class together. But things like this are actually kind of useful. Actually, that was a good question because it's the ones we like."},{"id":204,"text":"I didn't say the D word, which is duality. But that was a question about duality. So what we want is we want you to have a street fighting knowledge of duality because it never, ever works when someone comes and says, oh, help me, help me, I have a dual. And you're like, no, it doesn't work that. The way it always works is somebody has some long, complicated problem and they need a suggestion and they don't even know what duality is. So, okay. Everyone, cool? That was just an aside, but it was fun for me anyway. So, okay."},{"id":205,"text":"Okay, so this gives you the minimum volume ellipsoid. Okay, so then you can say, okay, fine. Can we do, oh, let me just ask, I'm going to go back and show. So you say, that's cool, you can do a minimum volume ellipsoid around a point, and then you might innocently ask, well, that's cool. By the way, this is the minimum volume ellipsoid that covers a polyhedron."},{"id":206,"text":"given by its vertices. So that's the same problem, you agree? So if someone walks up to you on the street and says, find the minimum volume ellipsoid that covers a polyhedron described by its vertices, then that's also, we can do that. It's a simple convex problem. Cool? But now someone says, oh yeah, you know what though, my ellipsoid is described by, not vertices, but it looks like this."},{"id":207,"text":"Here's my ellipsoid. It's described by a set of linear inequalities. And we want to find the minimum volume ellipsoid that covers a polyhedron described by its faces. Everybody cool on this? Okay. It sounds reasonable. Actually, someone give a simple... What would be one way to do it? What would you do?"}],"notes":["本段讲授了对偶性在优化问题中的应用，特别是如何通过识别对偶变量来移除约束。讲者提到，当有多个紧约束时，可以通过对偶变量的大小来判断哪些约束可以被移除，从而简化问题。这种做法体现了对偶性在实际问题中的实用性。","讲者强调了对偶性在实际问题中的重要性，指出在面对复杂问题时，对偶性可以提供有效的解决思路。讲者提到，即使没有明确提到对偶性（D word），但问题本身仍然涉及对偶性，这说明对偶性是解决实际问题的重要工具。","讲者进一步讨论了椭球体覆盖问题，指出最小体积椭球体可以覆盖由顶点描述的多面体，也可以覆盖由面描述的多面体。这说明了椭球体覆盖问题的通用性，无论多面体是通过顶点还是面来描述。","讲者通过提问引导学生思考如何解决椭球体覆盖问题，特别是当椭球体由线性不等式描述时，如何找到最小体积的椭球体覆盖多面体。这表明了问题的复杂性和需要进一步探索的可能方法。","讲者提到，椭球体覆盖问题是一个简单的凸优化问题，这说明了凸优化在解决实际问题中的有效性。同时，讲者也指出，当椭球体由面描述时，问题的解决方法可能需要不同的策略。","讲者通过举例说明了椭球体覆盖问题的不同情况，包括由顶点和由面描述的多面体。这表明了问题的多样性，以及需要根据具体情况选择合适的解决方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3385.5,"end":3562.87,"asr_flags":[],"raw_segments":[{"start":3385.5,"text":"change the code and stuff like that. Okay. And then you do that. Okay. That was another suggestion somewhere. All right. Let me try one more time. Yeah. To see if I can elicit a response. Okay. I have 20 constraints that are tight. I would like to remove five. In fact, I'll even, do I even have to say, I'll even say I want to remove the five tightest constraints. How about that? Please. What?"},{"start":3417.78,"text":"Oh, there we go. Okay, fine. You get the dual variables, which you get for free. And then you remove the 5 with the 5 largest dual variables. Everybody cool? That's pretty sophisticated. I mean, we're just putting ideas from the class together. But things like this are actually kind of useful. Actually, that was a good question because it's the ones we like."},{"start":3445.91,"text":"I didn't say the D word, which is duality. But that was a question about duality. So what we want is we want you to have a street fighting knowledge of duality because it never, ever works when someone comes and says, oh, help me, help me, I have a dual. And you're like, no, it doesn't work that. The way it always works is somebody has some long, complicated problem and they need a suggestion and they don't even know what duality is. So, okay. Everyone, cool? That was just an aside, but it was fun for me anyway. So, okay."},{"start":3475.75,"text":"Okay, so this gives you the minimum volume ellipsoid. Okay, so then you can say, okay, fine. Can we do, oh, let me just ask, I'm going to go back and show. So you say, that's cool, you can do a minimum volume ellipsoid around a point, and then you might innocently ask, well, that's cool. By the way, this is the minimum volume ellipsoid that covers a polyhedron."},{"start":3503.43,"text":"given by its vertices. So that's the same problem, you agree? So if someone walks up to you on the street and says, find the minimum volume ellipsoid that covers a polyhedron described by its vertices, then that's also, we can do that. It's a simple convex problem. Cool? But now someone says, oh yeah, you know what though, my ellipsoid is described by, not vertices, but it looks like this."},{"start":3531.43,"text":"Here's my ellipsoid. It's described by a set of linear inequalities. And we want to find the minimum volume ellipsoid that covers a polyhedron described by its faces. Everybody cool on this? Okay. It sounds reasonable. Actually, someone give a simple... What would be one way to do it? What would you do?"}],"speech_gaps":[],"frame":"../frames/v011/021.webp","frame_time":3397.5},{"title":"凸优化中的椭球覆盖与NP难问题","segments":[{"id":208,"text":"in the intersection of all the inequalities in them. Yeah, so you would basically, you'd first write a method that called, you know, faces to vertices, right? And you'd take your ellipsoid, and you'd call the faces to vertices method on it, right? And it would give you the vertices, and then you'd type this in as three lines of CVX pi. That's your proposal, right? I like it. It would work. There's one minor problem with that."},{"id":209,"text":"is how many vertices, you know, just order magnitude, does a polyhedron in R1000 with, let's say, 5000 inequalities, which, by the way, is a tiny thing you can solve on, you can solve an LP or problems with that on your phone. Everybody got that? How many vertices does that have? About, just order magnitude. Everybody know what I'm saying?"},{"id":210,"text":"I mean, I'm not drawing a picture here on R2. I'm talking about R1,000 or whatever, and you've got 5,000 inequalities. How many vertices does it have? A lot. Yeah, that's the answer. No, it's order of magnitude 1,000 choose whatever, 5,000 choose 1,000. Just for the record, that's a super big number. So your method was correct. It would work in two dimensions and three and blah, blah, blah. It would be absolutely correct. It just wouldn't work."},{"id":211,"text":"Okay, everybody got that? Okay, so now I'll let you in on the secret. Turns out, actually, finding the minimum volume ellipsoid that covers a polyhedron given an inequality form is NP-hard. As a matter of fact, the following is, I just walk up to you in the street and say, here's an ellipsoid. Like, don't even optimize it. Here's an ellipsoid, and I want to ask you the following innocent question. Does my ellipsoid cover this polyhedron?"},{"id":212,"text":"Makes sense, right? So, I mean, you could even imagine all sorts of things that people might use this for. They would say, like, you know, my polyhedron is my desired region or something like that, and I'm going to cover it with an ellipsoid. You just want to ask, does it cover it? Anyway, everyone got the question? Unbelievably simple to state. NP hard. Okay? So, these things are about to get very weird."},{"id":213,"text":"Okay, so it depends on how you describe the polyhedron and all that kind of stuff. Okay, so if you're confused, you should be, right? Because this is quite complicated. Okay, now to confuse you, if you're not yet confused, this should do the trick. So now we go to something like a dual problem. It turns out they're not really duals, but that's okay."}],"notes":["本段讨论了如何通过将椭球的面转换为顶点来求解覆盖多面体的最小体积椭球问题。然而，这种方法在高维空间中存在计算复杂度的问题，因为多面体的顶点数量可能非常庞大，例如在R1000空间中，5000个不等式可能对应一个巨大的顶点数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3563.48,"end":3725.56,"asr_flags":[],"raw_segments":[{"start":3563.48,"text":"in the intersection of all the inequalities in them. Yeah, so you would basically, you'd first write a method that called, you know, faces to vertices, ys take your set, you find the minimum volume ellipsoid that covers your set. Then it says shrink the set around, shrink that ellipsoid around its center by a factor n. Everybody got that? That's inside the set."}],"notes":["本段讲授了凸优化中的一个重要概念：在凸集内寻找最大体积的椭球。椭球可以用来近似复杂的多面体，从而简化计算。椭球的体积最大化意味着它尽可能地覆盖多面体的内部区域，这在安全区域的建模中非常有用。","讲者提到，椭球的体积最大化问题在计算上是可行的，这使得它在实际应用中非常有用。例如，当处理一个具有大量面的复杂多面体时，使用椭球可以简化算法的处理。","讲者还提到，对于任何具有非空内部的凸有界集，存在一个Lohner-John椭球，它可以通过将覆盖该集的最小体积椭球缩小一定比例来得到，这个椭球完全包含在原集内。","讲者强调，这里讨论的是数学上的性质，而不是计算上的可行性。即，我们关注的是椭球与凸集之间的数学关系，而不是如何高效地计算这些椭球。","讲者指出，Lohner-John椭球的构造方法是：首先找到覆盖该集的最小体积椭球，然后将其缩小一定比例，使得缩小后的椭球完全包含在原集内。这个比例是n，即椭球的维度。","讲者通过这些例子和解释，展示了凸优化在实际问题中的应用，如安全区域的建模和算法的简化。"],"formulas":[],"uncertainties":["Lohner-John ellipsoid 的具体构造方法可能存在识别错误，原句中提到的 'Lohner-John' 可能是 'Löwner-John' 的误听，但无法确定。","讲者提到的 'shrink the set around, shrink that ellipsoid around its center by a factor n' 中的 'factor n' 可能指的是椭球的维度，但具体数学表达式未明确给出，因此无法确定其准确含义。"],"diagram":"none","start":4061.24,"end":4236.35,"asr_flags":[],"raw_segments":[{"start":4061.24,"text":"And little d. Is that right? Yeah. Okay. And then what are a i and b i? What are they? They're data or constants or parameters, however you want to say it. Right? Okay. So then what kind of function is this of the variables? It's convex. It's b a i is linear. And then it's a two norm, so that's convex. Right? What kind of function of the variables is that? It's affine, but it's linear. Right?"},{"start":4096.28,"text":"So, it is affine, of course, but it's even linear, right? And so, this is a convex constraint because that's a convex function, right? In fact, it's second order cone representable, right? So, okay. So, that's it. So, this is this crazy thing where if I give a polyhedron, if I give you a polyhedron described by inequalities, we can find the maximum volume ellipsoid inside it. Everybody?"},{"start":4125.28,"text":"And that's completely tractable. By the way, this has tons of applications immediately. Suppose I give you a poly id that fits inside it. Now, I expand it by a factor n about the center. That covers the set. And it gets even weirder. If the set is symmetric, like if minus the set is equal to itself or something like that, then it turns out..."},{"id":234,"text":"you don't have to have a factor of n, you have a factor of square root n. Everybody following this? Now this actually tells you unbelievable things. This says that if you had a convex set and you approximate it with an ellipsoid, it says you really, you can't be too far off. In fact, if I take, let's say, either the Loner-John, let's suppose I take the Loner-John ellipsoid and I shrink it by, suppose I shrink it by square root n, right?"},{"id":235,"text":"Then and I say that's that's the ellipsoidal approximation of my set and you go cool In which how does it approximate your set you go? Well, if I expand it by factor squared n it covers my set if I shrink it by a factor of squared n It's inside the set Everybody got it. So so actually it's kind of what it tells you is that like ellipsoids are universal approximators of convex sets"},{"id":236,"text":"Now squared n in some practice might be way too much for you to be happy with or something like that. Actually, let me do an example here. Let's just do one here. Here's my set. Ready? It's a triangle like that. What's the Loner-John ellipsoid of that? It's equilateral or whatever they call it. What's the Loner-John ellipsoid?"},{"id":237,"text":"It's just a circle that goes around it. Okay, right. So it looks like this, right? Well, this is gonna be terrible. Okay. There it is. Okay, right Okay, shrink that by a factor of two in your eye. Then what do you get you get? this right And actually this example shows that that that's tight that inequality, right? So in fact, it's always true. So you could even say something very weird like this first you say"},{"id":238,"text":"All convex sets can be approximated by ellipsoids within a factor. You know, you could say, I could say squared n because I'd put it in the middle and then both expand and shrink, right? And you'd say, yeah, well, what are the hardest sets to approximate by ellipsoids? Makes perfect sense, right? And the answer is a simplex in Rn. A simplex in Rn, if you want to approximate it by ellipsoids."}],"notes":["本段讲解了凸集与椭球近似之间的关系，指出最大体积椭球可以覆盖凸集，而最小体积椭球则需要缩放因子。当凸集对称时，缩放因子可以是√n，而不是n。这表明椭球可以作为凸集的近似工具，且误差范围有限。","通过一个三角形的例子，说明了Löwner-John椭球的构造方式。椭球可以包围三角形，但需要缩放因子√n才能精确匹配。这展示了椭球近似凸集的理论基础。","椭球近似凸集的误差范围与维度n相关，且对于某些特定结构（如单纯形）来说，椭球近似可能需要更大的缩放因子。这表明椭球在高维空间中对凸集的近似能力有限，但仍然是有用的工具。","课程中提到，椭球可以作为凸集的通用近似器，但需要考虑缩放因子的大小。对于某些凸集，如单纯形，椭球近似可能需要更大的缩放因子，这说明了不同凸集的近似难度不同。","椭球近似凸集的理论基础在于其能够覆盖或包含凸集，且误差范围与维度相关。这为凸优化中的近似方法提供了理论支持。","课程中强调了椭球近似凸集的理论意义，即椭球可以作为凸集的近似工具，且误差范围有限。这为后续的优化算法和近似方法提供了基础。"],"formulas":[{"latex":"\\sqrt{n}","symbols":"缩放因子","explanation":"原始片段中明确提到缩放因子为\\sqrt{n}，因此该公式应保留。","evidence":"you don't have to have a factor of n, you have a factor of square root n. Everybody following this? Now this actually tells you unbelievable things. This says that if you had a convex set and you approximate it with an ellipsoid, it says you really, you can't be too far off. In fact, if I take, let's say, either the Loner-John, let's suppose I take the Loner-John ellipsoid and I shrink it by, suppose I shrink it by square root n, right?"}],"uncertainties":["Loner-John"],"diagram":"none","start":4238.79,"end":4407.69,"asr_flags":[],"math_clarifications":["原始片段中提到的缩放因子是\\sqrt{n}，而非n或n^2。因此，公式n和n^2应被移除，而\\sqrt{n}应保留。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4238.79,"text":"That's what it says. And the opposite is true for the maximum volume ellipsoid. If I have any set at all, convex, I find the maximum volume ellipsoid that fits inside it. Now, I expand it by a factor n about the center. That covers the set. And it gets even weirder. If the set is symmetric, like if minus the set is equal to itself or something like that, then it turns out..."},{"start":4268.11,"text":"you  Rn. A simplex in Rn, if you want to approximate it by ellipsoids."}],"speech_gaps":[],"frame":"../frames/v011/026.webp","frame_time":4250.79},{"title":"凸优化中的范数近似与中心化","segments":[{"id":239,"text":"It's going to take the full square root n. Here would be my weird square root n thing, right? It would be something that looks like that. Whoops, okay, that came out very poorly. But anyway, this would be my square root n. And I would say, you see that ball?"},{"id":240,"text":"that disk, if I increase it by 1.4, you know, whatever, 1.42, there you go, then I cover my triangle. And if I shrink it, if I multiply it by 0.7, then I'm inside. Everybody got that? So, everybody got all this? So, this applies actually weirdly to norms, right? It says take any norm at all on Rn, right? Any norm."},{"id":241,"text":"It says that I can approximate it with a quadratic norm. Those are symmetric. With error, no more than the fourth root of n. So now I'll tell you an important thing about that. There's lots of norms. Here's a norm. The minimum fuel it takes you to go from a state to zero."},{"id":242,"text":"That's actually a norm. It's a crazy polyhedral norm, right? It's a crazy norm, but it is a norm. But that might be one we really care about, right? It says I can approximate that pretty well with a quadratic norm."},{"id":243,"text":"And so this would give you a very good way to find those, to find the, actually it would actually say kind of why things work so well, right? When people would say like, yeah, how are you controlling your airplane? And if they're honest, they'll finally, they'll say something like, that's basically using something like, you know, linear quadratic, basically it's almost least squares, basically. It's more complicated than that, but not too far. And you go, whoa, you go, that's great. Are the,"},{"id":244,"text":"you know, are your actual constraints like, you know, spherical or whatever? And they're like, no, no, no, no, they're not, you know, that kind of thing. So, but it works really well. And this is actually, at least I like to think part of the explanation."},{"id":245,"text":"It's something we've actually seen a couple of times before. It's so-called, it's centering. So actually, very early in the course, we encountered this. It was one of our first examples of a linear program, right? It was like, here's a polyhedron given by inequalities. And I said, find the largest ball, Euclidean ball, that fits inside it. Everybody got that? That's called the Chebyshev center."}],"notes":["本段讲授了范数近似的基本概念，指出任何范数都可以用二次范数进行近似，误差不超过n的四次方根。这为后续讨论控制理论中的线性二次调节器（LQR）提供了理论基础。","讲者提到一个特殊的范数，即最小燃料范数，它表示从一个状态到零点所需的最小燃料。这个范数虽然形式复杂，但仍然是一个有效的范数，并且可以用二次范数进行近似。","讲者强调了二次范数在实际控制中的重要性，指出许多实际控制系统都基于二次优化方法，如线性二次调节器（LQR）。这说明了为什么二次范数在工程实践中如此流行。","讲者提到，虽然实际约束可能不是球形的，但使用二次范数近似仍然能有效工作。这表明了范数近似方法的鲁棒性和实用性。","讲者还回顾了课程中早期提到的中心化问题，即寻找能够完全包含在多面体内的最大球体，这被称为Chebyshev中心。这展示了中心化问题在凸优化中的重要性。","讲者通过实际例子（如飞机控制）说明了范数近似和中心化方法的实际应用，强调了这些理论在工程实践中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4408.29,"end":4578.22,"asr_flags":[244],"raw_segments":[{"start":4408.29,"text":"It's going to take the full square root n. Here would be my weird square root n thing, right? It would be something that looks like that. Whoops, okay, that came out very poorly. But anyway, this would be my square root n. And I would say, you see that ball?"},{"start":4424.86,"text":"that disk, if I increase it by 1.4, you know, whatever, 1.42, there you go, then I cover my triangle. And if I shrink it, if I multiply it by 0.7, then I'm inside. Everybody got that? So, everybody got all this? So, this applies actually weirdly to norms, right? It says take any norm at all on Rn, right? Any norm."},{"start":4453.65,"text":"It says that I can approximate it with a quadratic norm. Those are symmetric. With error, no more than the fourth root of n. So now I'll tell you an important thing about that. There's lots of norms. Here's a norm. The minimum fuel it takes you to go from a state to zero."},{"start":4481.77,"text":"That's actually a norm. It's a crazy polyhedral norm, right? It's a crazy norm, but it is a norm. But that might be one we really care about, right? It says I can approximate that pretty well with a quadratic norm. Why does that matter? Because in fact, the control that people actually use is all based on quadratic stuff."},{"start":4502.96,"text":"And so this would give you a very good way to find those, to find the, actually it would actually say kind of why things work so well, right? When people would say like, yeah, how are you controlling your airplane? And if they're honest, they'll finally, they'll say something like, that's basically using something like, you know, linear quadratic, basically it's almost least squares, basically. It's more complicated than that, but not too far. And you go, whoa, you go, that's great. Are the,"},{"start":4531.81,"text":"you know, are your actual constraints like, you know, spherical or whatever? And they're like, no, no, no, no, they're not, you know, that kind of thing. So, but it works really well. And this is actually, at least I like to think part of the explanation. Okay, so does all this make sense? It's kind of weird and interesting and cool, I think. Okay, next topic."},{"start":4555.23,"text":"It's something we've actually seen a couple of times before. It's so-called, it's centering. So actually, very early in the course, we encountered this. It was one of our first examples of a linear program, right? It was like, here's a polyhedron given by inequalities. And I said, find the largest ball, Euclidean ball, that fits inside it. Everybody got that? That's called the Chebyshev center."}],"speech_gaps":[],"frame":"../frames/v011/027.webp","frame_time":4420.29},{"title":"凸优化中的中心概念","segments":[{"id":246,"text":"It's an LP, and I said at the time it's weird, because if I say things like Euclidean ball or draw a circle, the linear programming part of your brain should not be lighting up. Because linear programming part of your brain should light up when I say things like polyhedron."},{"id":247,"text":"Inequalities. Visually, you should be seeing flat things with corners, right? You should see like a modern, you know, fighter jet with, you know, made with like flat parts and stuff like that for various reasons, right? That's what you should be seeing. You should not be seeing beautiful curves. I mean, anyway, that's what you should be seeing, right? And so that was weird, but that's it."},{"id":248,"text":"So that would be, take a point, and then you're shifting the mean. Now put a zero mean distribution around it with a log concave density, and then pick the center that maximizes the probability. That's another one. I think people call it, different fields, they call it different things. It's like the yield center. I don't know. There's all sorts of names for it. Everybody, or probabilistic center. But here's another one. The center of the maximum volume ellipsoid, right?"},{"id":249,"text":"And that's actually a very good one for reasons I'll get to, but not today. Okay, so this is centering. Oh, it turns out, of course, look, centering, let's talk about centering in R. It's going to be a very short conversation, right? So here's a convex set in R. It's called an interval. What's the center of an interval, a bounded interval? What's the center of the interval?"},{"id":250,"text":"It's the center. It's the middle of it. I mean, come on, that's what it is. And there's no other, I mean, there's no other reason. You say, no, I think it should be, you know, the one that's one third of the way towards the left. And you're like, what does that mean, right? So there's, but the minute you get to like R2, it's actually interesting. It turns out there's multiple different definitions of a center. And we're going to look at some of them. So just to point this out, right? Okay."},{"id":251,"text":"One thing that's going to come up later is the so-called analytic center. And it's actually a weird thing. I'll say why it's weird in a minute. But it's actually not a center of the geometrical object. It's actually of a set of inequalities. So if I have a set of inequalities and some equality constraint, if I maximize the sum of the logs, these are the margins. fi should be less than 0. So minus fi should be positive."}],"notes":["本段讲解了凸优化中不同类型的中心概念，包括Chebyshev中心、概率中心和最大体积椭球中心。这些中心概念在不同的应用场景中具有不同的定义和用途。例如，Chebyshev中心是满足所有不等式约束的点中，到边界最远的点，而概率中心则是通过最大化概率分布下的概率来确定的中心。","在讨论中心概念时，讲者指出在低维空间（如R）中，中心的定义相对直观，但在高维空间（如R²）中，中心的定义变得复杂，存在多种不同的定义方式。这为后续讨论不同类型的中心概念奠定了基础。","讲者提到分析中心（analytic center）是一个特殊的中心概念，它不是几何对象的中心，而是由一组不等式约束和等式约束定义的。通过最大化对数和的函数，可以找到分析中心，这在优化问题中具有重要的应用价值。","在讲到分析中心时，讲者强调了其与几何中心的不同之处，并指出分析中心的定义基于约束条件的对数和，这与优化问题中的对偶性概念密切相关。","讲者还提到，分析中心的定义需要满足约束条件，即每个不等式约束的值必须小于零，因此在计算分析中心时，需要确保所有约束条件都满足。","本段内容为后续讨论不同类型的中心概念及其在凸优化中的应用提供了理论基础，同时也强调了在高维空间中中心概念的多样性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4579.27,"end":4741.68,"asr_flags":[],"math_clarifications":["原始片段中提到的'analytic center'涉及最大化对数和，但未提供完整的数学表达式，包括目标函数和约束条件。因此，无法确定该公式的正确形式和适用条件，需进一步澄清。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4579.27,"text":"It's an LP, and I said at the time it's weird, because if I say things like Euclidean ball or draw a circle, the linear programming part of your brain should not be lighting up. Because linear programming part of your brain should light up when I say things like polyhedron."},{"start":4598.12,"text":"Inequalities. Visually, you should be seeing flat things with corners, right? You should see like a modern, you know, fighter jet with, you know, made with like flat parts and stuff like that for various reasons, right? That's what you should be seeing. You should not be seeing beautiful curves. I mean, anyway, that's what you should be seeing, right? And so that was weird, but that's it. Okay, so that's the Chebyshev Center. But we have another one immediately. Oh, we saw another one. We saw the yield center or probability center."},{"start":4627.52,"text":"So that would be, take a point, and then you're shifting the mean. Now put a zero mean distribution around it with a log concave density, and then pick the center that maximizes the probability. That's another one. I think people call it, different fields, they call it different things. It's like the yield center. I don't know. There's all sorts of names for it. Everybody, or probabilistic center. But here's another one. The center of the maximum volume ellipsoid, right?"},{"start":4657.56,"text":"And that's actually a very good one for reasons I'll get to, but not today. Okay, so this is centering. Oh, it turns out, of course, look, centering, let's talk about centering in R. It's going to be a very short conversation, right? So here's a convex set in R. It's called an interval. What's the center of an interval, a bounded interval? What's the center of the interval?"},{"start":4684.88,"text":"It's the center. It's the middle of it. I mean, come on, that's what it is. And there's no other, I mean, there's no other reason. You say, no, I think it should be, you know, the one that's one third of the way towards the left. And you're like, what does that mean, right? So there's, but the minute you get to like R2, it's actually interesting. It turns out there's multiple different definitions of a center. And we're going to look at some of them. So just to point this out, right? Okay. One thing we..."},{"start":4713.5,"text":"One thing that's going to come up later is the so-called analytic center. And it's actually a weird thing. I'll say why it's weird in a minute. But it's actually not a center of the geometrical object. It's actually of a set of inequalities. So if I have a set of inequalities and some equality constraint, if I maximize the sum of the logs, these are the margins. fi should be less than 0. So minus fi should be positive."}],"speech_gaps":[],"frame":"../frames/v011/028.webp","frame_time":4591.27},{"title":"凸优化中的对数障碍函数与解析中心","segments":[{"id":252,"text":"Right, or non-negative, right? But here, this says, basically, maximize the product of the margins. That's called the analytic center of these inequalities, right? And it's going to turn out that's very easily computed. As a matter of fact, you will be computing it in about two weeks. So you'll be writing code to do that. Anyway, so I think we'll quit here for today, and we'll continue next time."}],"notes":["本段讲解了凸优化中解析中心的概念，即最大化不等式约束的边距乘积。解析中心是凸优化中的一个重要概念，通常用于对数障碍函数的计算，它表示在可行域内部的一个点，使得所有约束的边距乘积最大化。","课程提到解析中心的计算相对容易，学生将在大约两周后通过编写代码来实现这一计算。这表明解析中心的计算方法在实际应用中具有可操作性。","讲者提到将在下节课继续讲解相关内容，说明当前课程内容为后续学习奠定了基础，强调了课程的连贯性和逐步深入的教学安排。","解析中心的计算与对数障碍函数密切相关，它在优化问题中用于逼近可行域的边界，同时保持内部点的可行性。","课程中提到的“product of the margins”是解析中心的核心定义，即最大化所有约束的边距乘积，这与对数障碍函数的构造有直接联系。","讲者强调了解析中心的计算将在后续课程中实现，这表明该概念在凸优化中的重要性，以及其在实际应用中的价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4742.4,"end":4769.27,"asr_flags":[],"raw_segments":[{"start":4742.4,"text":"right, or non-negative, right? But here, this says, basically, maximize the product of the margins. That's called the analytic center of these inequalities, right? And it's going to turn out that's very easily computed. As a matter of fact, you will be computing it in about two weeks. So you'll be writing code to do that. Anyway, so I think we'll quit here for today, and we'll continue next time."}],"speech_gaps":[],"frame":"../frames/v011/029.webp","frame_time":4754.4}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
