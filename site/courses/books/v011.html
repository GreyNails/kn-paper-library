igure out that it come or guess in some intelligent way that it come from this distribution or this one, right? And we looked at that. You end up with, you have this idea of a..."},{"start":214.69,"text":"a randomized detector. It's a policy that says, when you observe this outcome, which distribution do you attribute it to, right? And if it's, and that you do with a, you know, a two by N matrix, where the columns give you the probabilities that you announce it came from, you know, P or Q, the two different distributions, right? So that's how that works."},{"start":240.42,"text":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"},{"start":270.9,"text":"Anyway, so this problem, it turns out, is actually really quite..."},{"start":276.05,"text":"straightforward to solve if you scalarize it. So you say that lambda now is the amount, is the factor that relates how much I care about false positive versus false negatives or something like that. Then it turns out it just has a super simple solution that looks like this. Lambda is that weighting factor. For example, if it's one, it says, actually, I just want to minimize the number of errors, period."},{"start":302.97,"text":"That would be lambda equals 1. And then the solution is like analytic and it's been known since, I don't know, probably 1900 or something. And it basically says, in that case, and it's completely reasonable, it says if lambda is 1 and you want to minimize, say, the total number of errors, you would say, well, what I would do is if I will choose the distribution which had higher likelihood. And we'll see that in another context, or we've already seen it in the context of maximum likelihood, so that's an example of that."}],"speech_gaps":[],"frame":"../frames/v011/002.webp","frame_time":181.44},{"title":"类型错误与最小最大优化","segments":[{"id":14,"text":"And the lambda allows you to put weights on the two different types of errors, which I think are called type one and type two error, but I can never remember which is which and just look it up every time I need to know. Actually, usually I try to avoid situations where people are saying things like type one and type two error. So I usually walk out of the room, but if I am forced to, I will just look it up to figure out what it is. Okay.","zh":"lambda 允许你对两种不同类型的错误赋予不同的权重，我认为这些错误被称为第一类错误和第二类错误，但我总是记不住哪一个是哪一个，每次需要的时候都得去查。实际上，我通常会避免人们谈论第一类和第二类错误的情况。所以我通常会离开房间，但如果被迫的话，我就会去查一下以弄清楚到底是什么。好的。","start":331.96,"end":352.52},{"id":15,"text":"Now, what's interesting is even at this super simple problem, you can get into weird things, very interesting stuff like this. Suppose you say, I want to minimize the maximum of my false positive and false negative errors, right? That will get you something that's Pareto optimal because max is a monotone function.","zh":"有趣的是，即使在这个超级简单的例子中，你也会遇到一些奇怪的事情，非常有趣的内容。比如，你可以这样说：我想最小化我的假阳性错误和假阴性错误中的最大值，对吧？这会得到一个帕累托最优解，因为最大值是一个单调函数。","start":354.3,"end":375.26},{"id":16,"text":"of the two it's a monotone mapping from the two criteria into one so that's a that is a scalarization it's not a linear scalarization which is what's normally employed but it's a scalarization right um and this that's a that turns out that's an lp and the solution is usually not deterministic right so here's an example so here we go","zh":"在这两个指标中，它是一个单调映射，将两个指标映射到一个标量，因此这是一个标量化过程，而不是通常使用的线性标量化。但这是一个标量化过程，对吧？嗯，这实际上是一个线性规划问题，其解通常不是确定性的，对吧？这里有一个例子，我们来看看。","start":375.85,"end":399.48},{"id":17,"text":"Let's see. Here's the trade-off curve of false positive versus false negative. That's this thing, this curve here. Oh, yeah, somebody explain the point at the top. First of all, let's talk about what's really good about that detector. What's the probability? If we use the detector up there at 1, this point right here, this one, first let's say the good part about it. What is the probability of a false positive for that detector? Zero.","zh":"让我们看看。这是假阳性与假阴性之间的权衡曲线，这就是这个曲线。哦，对了，有人能解释一下顶部的那个点吗？首先，让我们谈谈这个检测器真正好的地方是什么。概率是多少？如果我们使用这个检测器在1点处，也就是这个点，首先让我们说说它好的地方。这个检测器的假阳性概率是多少？零。","start":400.87,"end":431.68},{"id":18,"text":"Right. OK, fine. Right. By the way, what does that detector do? It just returns like negative every time. Right. So it's kind of silly. But the good news is it does have a very, very low false positive rate. OK, so, you know, and that's each of these correspond. These correspond to likelihood ratios.","zh":"对的。好的。顺便问一句，这个检测器到底做了什么？它只是每次返回负值。对的。这有点傻，但好消息是它确实具有非常低的假阳性率。好的，所以，你知道的，这些对应着似然比。","start":432.14,"end":454.85},{"id":19,"text":"between the entries there. In fact, you can even take lambda and put lambda around here and ask what happens. If you have a certain lambda like that, the optimal point you're going to find is going to be like here or here or here. The minimax one is one, you can figure out what that is. This is the x equals y line.","zh":"在这些条目之间。事实上，你甚至可以在这里放置一个lambda，并询问会发生什么。如果你有一个特定的lambda，比如这样，你找到的最优解将会出现在这里或那里或那里。最小最大解是1，你可以弄清楚它是什么。这是x等于y的直线。","start":456.49,"end":478.93},{"id":20,"text":"And the minimax one you find by simply taking this rectangle or square, if this was done correctly with axes, which it was not, and you simply grow it until it touches this curve. And that's going to be right here. And so it turns out if you wanted to minimize the maximum of your false positive and your false negative,","zh":"而最小最大值则可以通过简单地取这个矩形或正方形，如果坐标轴正确绘制的话，虽然这里并没有正确绘制，然后将其扩大直到它接触到这条曲线。而这一点就在这里。因此，如果你想要最小化你的假阳性率和假阴性率中的最大值，","start":479.65,"end":498.95}],"notes":["本段讨论了类型错误（type one和type two error）的概念，以及如何通过引入权重λ来平衡两种错误。讲者提到自己经常混淆这两种错误，因此每次需要时都会查阅资料。这表明类型错误是统计学和机器学习中常见的概念，用于评估分类器的性能。","讲者进一步说明，即使在非常简单的优化问题中，也可以出现有趣的现象，例如最小化最大错误（false positive和false negative）。这种优化方法被称为Pareto最优，因为最大函数是单调函数，可以将两个标准映射为一个标量。","讲者提到，这种标量化方法不是线性标量化，而是另一种形式的标量化，通常用于优化问题中。这种优化问题可以归类为lp问题，其解通常不是确定性的。","讲者通过一个例子说明了误判率（false positive和false negative）之间的权衡曲线。在曲线的顶部，检测器的误判率为零，但其检测结果总是负的，这表明该检测器虽然误判率低，但可能过于保守。","讲者提到，每个点对应于似然比（likelihood ratios），这表明在优化过程中，似然比是重要的决策依据。通过调整λ，可以找到最优的点，这些点可能位于曲线的不同位置。","最后，讲者讨论了如何通过扩展一个矩形或正方形（如果坐标轴正确）直到它接触曲线，从而找到最小最大解。这表明最小最大优化是一种常见的策略，用于在多个目标之间找到平衡点。"],"formulas":[],"uncertainties":["of the two it's a monotone mapping from the two criteria into one so that's a that is a scalarization it's not a linear scalarization which is what's normally employed but it's a scalarization right um and this that's a that turns out that's an lp and the solution is usually not deterministic right so here's an example so here we go","between the entries there. In fact, you can even take lambda and put lambda around here and ask what happens. If you have a certain lambda like that, the optimal point you're going to find is going to be like here or here or here. The minimax one is one, you can figure out what that is. This is the x equals y line."],"diagram":"none","start":331.96,"end":498.95,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":331.96,"text":"And the lambda allows you to put weights on the two different types of errors, which I think are called type one and type two error, but I can never remember which is which and just look it up every time I need to know. Actually, usually I try to avoid situations where people are saying things like type one and type two error. So I usually walk out of the room, but if I am forced to, I will just look it up to figure out what it is. Okay."},{"start":354.3,"text":"Now, what's interesting is even at this super simple problem, you can get into weird things, very interesting stuff like this. Suppose you say, I want to minimize the maximum of my false positive and false negative errors, right? That will get you something that's Pareto optimal because max is a monotone function."},{"start":375.85,"text":"of the two it's a monotone mapping from the two criteria into one so that's a that is a scalarization it's not a linear scalarization which is what's normally employed but it's a scalarization right um and this that's a that turns out that's an lp and the solution is usually not deterministic right so here's an example so here we go"},{"start":400.87,"text":"Let's see. Here's the trade-off curve of false positive versus false negative. That's this thing, this curve here. Oh, yeah, somebody explain the point at the top. First of all, let's talk about what's really good about that detector. What's the probability? If we use the detector up there at 1, this point right here, this one, first let's say the good part about it. What is the probability of a false positive for that detector? Zero."},{"start":432.14,"text":"Right. OK, fine. Right. By the way, what does that detector do? It just returns like negative every time. Right. So it's kind of silly. But the good news is it does have a very, very low false positive rate. OK, so, you know, and that's each of these correspond. These correspond to likelihood ratios."},{"start":456.49,"text":"between the entries there. In fact, you can even take lambda and put lambda around here and ask what happens. If you have a certain lambda like that, the optimal point you're going to find is going to be like here or here or here. The minimax one is one, you can figure out what that is. This is the x equals y line."},{"start":479.65,"text":"And the minimax one you find by simply taking this rectangle or square, if this was done correctly with axes, which it was not, and you simply grow it until it touches this curve. And that's going to be right here. And so it turns out if you wanted to minimize the maximum of your false positive and your false negative,"}],"speech_gaps":[],"frame":"../frames/v011/003.webp","frame_time":343.96},{"title":"随机检测器与实验设计","segments":[{"id":21,"text":"you would do, number one, you'd have a non-deterministic detector, which is weird because you'd say, oh, the outcome was, you know, I don't know, let's say two. And you'd go, oh, yeah, okay, well, that's definitely like P, right? And then you'd come back later and say the outcome was two and you'd say, I don't know, let me check just a minute. Oh, it's Q. Everybody got this?","zh":"你首先会有一个非确定性检测器，这很奇怪，因为你会说，哦，结果是，比如说，二。然后你会说，哦，对了，好吧，这肯定是像P这样的。然后你过一会儿又会说结果是二，你会说，我不知道，让我检查一下。哦，是Q。大家明白吗？","start":499.77,"end":520.79},{"id":22,"text":"So it's a little bit odd that you would have a randomized detector, but this comes up in a bunch of things. By the way, a randomized detector you can think of as a relaxation of the original. The original sensible problem is to say, no, if there's an outcome, you have to commit to one of these two distributions. You can't do something weird and have an inconsistent, weird, probabilistic thing. Okay, so that's a very baby example.","zh":"你有一个随机化检测器，这有点奇怪，但这在很多情况下都会出现。顺便说一句，你可以把随机化检测器看作是对原始问题的一种放松。原始合理的问题是说，不，如果有结果，你必须承诺选择这两个分布中的一个。你不能做奇怪的事情，不能有不一致的、奇怪的概率性行为。好的，所以这是一个非常简单的例子。","start":521.37,"end":550.11},{"id":23,"text":"Okay, last topic in this section is going to be experiment design. This is actually super interesting, also like super useful. So the setting is we have a bunch of linear measurements here. So we have linear measurements. And AI you can think of as the measurement vector. WI, we're going to normalize those to have all the same standard deviation, which is one.","zh":"好的，本节的最后一个主题是实验设计。这实际上非常有趣，也非常有用。设置是，我们这里有一系列线性测量。所以，我们有线性测量。你可以把AI看作是测量向量。WI，我们将这些标准化，使它们的标准差都为一。","start":551.67,"end":579.78},{"id":24,"text":"Right? And so what it means, you know, roughly speaking, the size of A is something like, and this is dialect, but signal to noise ratio. Okay? So, right, because if A is gigantic, right, then it says that the AI transpose X tells you a lot, and then I add this noise that's like plus minus one, like, who cares, right? If AI is small, it means that's a pretty crappy measurement.","zh":"对吧？所以，粗略地说，A的大小类似于信号与噪声的比率。对吧？因为如果A非常大，那么AI转置X会告诉你很多信息，然后我加上这个噪声，像加减一，谁在乎呢，对吧？如果A很小，那就意味着这是一个相当糟糕的测量。","start":580.42,"end":604.84},{"id":25,"text":"So that's the idea there. Now, if I actually take, if I get a bunch of these measurements, these yi's, and I ask someone to guess x, and you know, the maximum likelihood, which is just nothing but least squares, the estimate is just least squares, so you just get this, right? It's the sum of ai ai transpose, that's this thing, inverse times this, right?","zh":"这就是这个想法。现在，如果我实际上获取了一组这些测量值，这些yi，然后让我猜测x，你知道，最大似然估计，也就是简单的最小二乘法，估计值就是最小二乘法，所以你只需要得到这个，对吧？这就是ai ai转置的和，乘以这个的逆，对吧？","start":605.86,"end":629.64},{"id":26,"text":"And the error, which is x hat minus x, has zero mean. So that's an unbiased estimate. And it has a covariance, which is given by this matrix here. And if you wanted to work out a confidence ellipsoid for that, again, assuming because these are all Gaussian, this is Gaussian, it would look like this. It would say it's a set of x which are centered at your estimate x hat.","zh":"并且误差，也就是x hat减去x，具有零均值。因此，这是一个无偏估计。它具有一个协方差，由这里的矩阵给出。如果你想计算这个估计的置信椭球，再次假设这些都是高斯分布的，那么它会看起来像这样。它会说这是一个以你的估计x hat为中心的x的集合。","start":630.42,"end":655.02}],"notes":["本段首先讨论了随机检测器的概念，指出其与确定性检测器的不同之处。随机检测器允许在不同时间点对同一结果进行不同的概率分配，这在某些情况下是合理的，但通常被视为对原始问题的放松。原始问题要求在获得结果后必须确定性地选择一个分布，而随机检测器则允许更灵活的处理方式。","接着，课程转向实验设计，强调了线性测量在实验设计中的重要性。测量向量被标准化为具有相同的标准差，这有助于比较不同测量的信噪比。信噪比的大小决定了测量的有效性，较大的信噪比意味着测量信息量大，而较小的信噪比则意味着测量质量差。","在实验设计中，最大似然估计被引入，作为线性测量的估计方法。最大似然估计等价于最小二乘法，其估计结果为测量矩阵的伪逆乘以测量向量。这种估计方法具有无偏性，其误差的协方差矩阵由测量矩阵的伪逆决定。","最后，课程提到如何利用高斯分布的性质来构建置信椭球。置信椭球的中心是估计值，其形状由协方差矩阵决定，反映了估计值的不确定性范围。这种分析方法在实验设计和信号处理中具有广泛应用。"],"formulas":[{"latex":"x_{\\hat{}} = (A^T A)^{-1} A^T y","symbols":"x_hat 是估计值，A 是测量矩阵，y 是测量向量","explanation":"公式正确，表示最小二乘估计，符合线性测量模型下的最大似然估计。","evidence":"So that's the idea there. Now, if I actually take, if I get a bunch of these measurements, these yi's, and I ask someone to guess x, and you know, the maximum likelihood, which is just nothing but least squares, the estimate is just least squares, so you just get this, right? It's the sum of ai ai transpose, that's this thing, inverse times this, right?"},{"latex":"Cov(x_{\\hat{}}) = (A^T A)^{-1} \\sigma^2","symbols":"Cov(x_hat) 是误差的协方差矩阵，σ² 是噪声方差","explanation":"公式正确，表示估计值的协方差矩阵，其中σ²是噪声方差，符合高斯噪声下的最小二乘估计结果。","evidence":"And the error, which is x hat minus x, has zero mean. So that's an unbiased estimate. And it has a covariance, which is given by this matrix here. And if you wanted to work out a confidence ellipsoid for that, again, assuming because these are all Gaussian, this is Gaussian, it would look like this. It would say it's a set of x which are centered at your estimate x hat."}],"uncertainties":["AI transpose X"],"diagram":"none","start":499.77,"end":655.02,"asr_flags":[],"math_clarifications":["公式中的协方差矩阵应为向量形式，即Cov(x_hat) = σ² (A^T A)^{-1}，其中σ²是噪声方差，且协方差矩阵应为对称正定矩阵。"],"boards":[{"title":"随机检测器的概念与特性","summary":"随机检测器允许在不同时间点对同一结果进行不同的概率分配，这与确定性检测器不同。原始问题要求必须确定性地选择一个分布，而随机检测器则是一种对原始问题的放松，允许更灵活的处理方式。","relation":"推导顺序","conditions":"适用于需要处理不确定或概率性结果的场景","pitfall":"不能将随机检测器视为确定性检测器的直接替代，需注意其概率性本质","note_indices":[0],"formula_indices":[],"source_ids":[21,22],"steps":["随机检测器允许在不同时间点对同一结果进行不同的概率分配。","原始问题要求必须确定性地选择一个分布，而随机检测器则允许更灵活的处理方式。","随机检测器被视为对原始问题的放松，允许更灵活的处理方式。"],"nodes":[{"title":"随机检测器定义","text":"允许在不同时间点对同一结果进行不同的概率分配"},{"title":"与确定性检测器对比","text":"原始问题要求确定性选择分布，随机检测器更灵活"},{"title":"应用场景","text":"适用于需要处理不确定或概率性结果的场景"}],"id":"v011-004-1","start":499.77,"end":550.11,"formulas":[],"formula_candidates_removed":0,"frame":"../board-frames/v011/004-1.webp","frame_time":512.27},{"title":"实验设计中的线性测量与标准化","summary":"实验设计中使用线性测量，测量向量被标准化为相同标准差，有助于比较不同测量的信噪比。信噪比的大小决定了测量的有效性，较大的信噪比意味着测量信息量大，而较小的信噪比则意味着测量质量差。","relation":"推导顺序","conditions":"适用于需要比较不同测量质量的实验设计","pitfall":"标准化后需注意信噪比的解释，避免误判测量质量","note_indices":[1],"formula_indices":[],"source_ids":[23,24],"steps":["实验设计中使用线性测量，测量向量被标准化为相同标准差。","信噪比的大小决定了测量的有效性，较大的信噪比意味着测量信息量大。","较小的信噪比意味着测量质量差，需谨慎使用。"],"nodes":[{"title":"线性测量标准化","text":"测量向量被标准化为相同标准差"},{"title":"信噪比比较","text":"信噪比大小决定测量有效性"},{"title":"测量质量评估","text":"较大的信噪比意味着测量信息量大"}],"id":"v011-004-2","start":551.67,"end":604.84,"formulas":[],"formula_candidates_removed":0,"frame":"../board-frames/v011/004-2.webp","frame_time":564.17},{"title":"最大似然估计与最小二乘法","summary":"最大似然估计被引入作为线性测量的估计方法，等价于最小二乘法。估计结果为测量矩阵的伪逆乘以测量向量，具有无偏性，其误差的协方差矩阵由测量矩阵的伪逆决定。","relation":"推导顺序","conditions":"适用于高斯噪声下的线性测量模型","pitfall":"需注意最小二乘法的假设条件，如噪声为高斯分布","note_indices":[2],"formula_indices":[0],"source_ids":[25],"steps":["最大似然估计等价于最小二乘法，用于线性测量的估计。","估计结果为测量矩阵的伪逆乘以测量向量。","该估计方法具有无偏性，误差的协方差矩阵由测量矩阵的伪逆决定。"],"nodes":[{"title":"最大似然估计","text":"等价于最小二乘法，用于线性测量估计"},{"title":"估计公式","text":"x_hat = (A^T A)^{-1} A^T y"},{"title":"无偏性","text":"估计误差具有零均值，无偏"}],"id":"v011-004-3","start":605.86,"end":629.64,"formulas":[{"latex":"x_{\\hat{}} = (A^T A)^{-1} A^T y","symbols":"x_hat 是估计值，A 是测量矩阵，y 是测量向量","evidence":"So that's the idea there. Now, if I actually take, if I get a bunch of these measurements, these yi's, and I ask someone to guess x, and you know, the maximum likelihood, which is just nothing but least squares, the estimate is just least squares, so you just get this, right? It's the sum of ai ai transpose, that's this thing, inverse times this, right?","explanation":"公式正确，表示最小二乘估计，符合线性测量模型下的最大似然估计。"}],"formula_candidates_removed":0,"frame":"../board-frames/v011/004-3.webp","frame_time":617.75},{"title":"置信椭球与协方差矩阵","summary":"利用高斯分布的性质构建置信椭球，其中心为估计值，形状由协方差矩阵决定，反映了估计值的不确定性范围。这种分析方法在实验设计和信号处理中具有广泛应用。","relation":"推导顺序","conditions":"适用于高斯噪声下的线性测量模型","pitfall":"需注意协方差矩阵的解释，避免误判估计的不确定性","note_indices":[3],"formula_indices":[1],"source_ids":[26],"steps":["利用高斯分布的性质构建置信椭球，中心为估计值。","置信椭球的形状由协方差矩阵决定，反映估计的不确定性。","协方差矩阵由测量矩阵的伪逆和噪声方差决定。"],"nodes":[{"title":"置信椭球定义","text":"中心为估计值，形状由协方差矩阵决定"},{"title":"协方差矩阵公式","text":"Cov(x_hat) = (A^T A)^{-1} σ²"},{"title":"不确定性范围","text":"反映估计值的不确定性"}],"id":"v011-004-4","start":630.42,"end":655.02,"formulas":[{"latex":"Cov(x_{\\hat{}}) = (A^T A)^{-1} \\sigma^2","symbols":"Cov(x_hat) 是误差的协方差矩阵，σ² 是噪声方差","evidence":"And the error, which is x hat minus x, has zero mean. So that's an unbiased estimate. And it has a covariance, which is given by this matrix here. And if you wanted to work out a confidence ellipsoid for that, again, assuming because these are all Gaussian, this is Gaussian, it would look like this. It would say it's a set of x which are centered at your estimate x hat.","explanation":"公式正确，表示估计值的协方差矩阵，其中σ²是噪声方差，符合高斯噪声下的最小二乘估计结果。"}],"formula_candidates_removed":0,"frame":"../board-frames/v011/004-4.webp","frame_time":642.72}],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":499.77,"text":"you would do, number one, you'd have a non-deterministic detector, which is weird because you'd say, oh, the outcome was, you know, I don't know, let's say two. And you'd go, oh, yeah, okay, well, that's definitely like P, right? And then you'd come back later and say the outcome was two and you'd say, I don't know, let me check just a minute. Oh, it's Q. Everybody got this?"},{"start":521.37,"text":"So it's a little bit odd that you would have a randomized detector, but this comes up in a bunch of things. By the way, a randomized detector you can think of as a relaxation of the original. The original sensible problem is to say, no, if there's an outcome, you have to commit to one of these two distributions. You can't do something weird and have an inconsistent, weird, probabilistic thing. Okay, so that's a very baby example."},{"start":551.67,"text":"Okay, last topic in this section is going to be experiment design. This is actually super interesting, also like super useful. So the setting is we have a bunch of linear measurements here. So we have linear measurements. And AI you can think of as the measurement vector. WI, we're going to normalize those to have all the same standard deviation, which is one."},{"start":580.42,"text":"Right? And so what it means, you know, roughly speaking, the size of A is something like, and this is dialect, but signal to noise ratio. Okay? So, right, because if A is gigantic, right, then it says that the AI transpose X tells you a lot, and then I add this noise that's like plus minus one, like, who cares, right? If AI is small, it means that's a pretty crappy measurement."},{"start":605.86,"text":"So that's the idea there. Now, if I actually take, if I get a bunch of these measurements, these yi's, and I ask someone to guess x, and you know, the maximum likelihood, which is just nothing but least squares, the estimate is just least squares, so you just get this, right? It's the sum of ai ai transpose, that's this thing, inverse times this, right?"},{"start":630.42,"text":"And the error, which is x hat minus x, has zero mean. So that's an unbiased estimate. And it has a covariance, which is given by this matrix here. And if you wanted to work out a confidence ellipsoid for that, again, assuming because these are all Gaussian, this is Gaussian, it would look like this. It would say it's a set of x which are centered at your estimate x hat."}],"speech_gaps":[],"frame":"../frames/v011/004.webp","frame_time":511.77},{"title":"实验设计与置信椭球","segments":[{"id":27,"text":"And the shape is given by this matrix here. And so, for example, I don't know. So that would give you... And beta is going to be determined by, you know, actually it would be something like the inverse distribution of a chi-squared random variable with the appropriate number of degrees. It doesn't matter, though, because that's how you would get beta. And that would say, thank you for the measurements. This tells you, you know, with 90%...","zh":"形状由这里的矩阵给出。例如，我不知道。这会给你……β将由某种方式确定，比如，实际上是卡方随机变量的逆分布，具有适当的自由度数。不过没关系，因为这就是如何得到β的方法。这会说，谢谢你的测量。这告诉你，你知道的，有90%……","start":655.46,"end":683.64},{"id":28,"text":"Probability, you're in this ellipsoid, right? And if I say 99% thing, then beta just gets bigger here. So that's all that happens, right? Okay. So experiment design is this problem. So I have a bunch of candidates, V1 through VP. You should think of these as possible measurements or experiments you can make, right? So that's what they are.","zh":"概率，你会在这个椭球体内，对吧？如果我说99%的情况，那么这里的β只是变得更大。这就是全部的情况，对吧？好的。实验设计就是这个问题。我有一组候选方案，V1到VP。你应该把这些看作可能的测量或实验，对吧？这就是它们的含义。","start":684.17,"end":711.55},{"id":29,"text":"And then I want to choose M AIs, which are among this palette of possible experiments I can carry out, right? So in other words, I have a bunch of sensors and what I can do is you'd say, pick.","zh":"然后我想选择M个AI，这些AI是在这组可能的实验中选择的，对吧？换句话说，我有一组传感器，我可以做的事情是你说，选择。","start":712.44,"end":731.08},{"id":30,"text":"Pick which sensors you should use. In fact, even pick the sequence, right? Which you should use to actually get the best estimate. The best estimate is a bit tricky because we're going to measure everything in terms of this ellipsoid, right? And we want this, sorry, this positive definite matrix, right? And what we really want is this positive definite matrix to be small, which by the way is the same as saying that the, sorry, yeah, we want this to be small, which is saying that the confidence ellipsoid is small, right?","zh":"选择你应该使用的传感器。事实上，甚至可以选择使用的顺序，对吧？以实际获得最佳估计。最佳估计有点棘手，因为我们的一切测量都是以这个椭球体为标准的，对吧？而我们想要的是这个正定矩阵，对吧？我们真正想要的是这个正定矩阵尽可能小，换句话说，就是说置信椭球体尽可能小，对吧？","start":731.92,"end":761.4},{"id":31,"text":"So that's what you do. So, in other words, now the problem with that is, this is exactly an ordering, the positive semi-definite matrices, which is not linear. Right? So it's completely reasonable if you came up with an experiment design, and you came up with one, we looked at your E's, like E1 and E2, and they were not comparable. So in some directions, you're better, and in other directions, you're better. That can and does happen. Everybody got it?","zh":"这就是你要做的事情。换句话说，现在的问题是，这正是一个正半定矩阵的排序问题，这并不是线性的。对吧？如果你提出了一个实验设计，提出了一个，我们看了你的E，比如E1和E2，它们是不可比较的。在某些方向上，你更好，在其他方向上，你更好。这种情况确实会发生。大家明白了吗？","start":761.84,"end":788.72},{"id":32,"text":"So we're going to have to scalarize the idea of a positive definite matrix being small. And there's lots of different ways to do it. Each one is going to lead to a certain named type of experiment design. So let me discuss a couple of things quickly. Earlier, I said that the size of A is something like, let's say, the two norm. That's something like a signal-to-noise ratio. If AI is gigantic, that's really good. That's a good measurement.","zh":"因此，我们必须将正定矩阵‘小’这一概念进行标量化。有许多不同的方法可以做到这一点。每种方法都会导致一种特定类型的实验设计。让我简要讨论几个方面。之前，我说过矩阵A的大小类似于二范数。这类似于信噪比。如果A很大，那反而是非常好的。这是一个好的度量标准。","start":789.18,"end":816.02}],"notes":["本段讲授了实验设计的基本概念，即如何从一组可能的测量或实验中选择最佳的测量组合。这些测量可以视为传感器，选择的目的是为了获得最佳估计。最佳估计的衡量标准是置信椭球的大小，即正定矩阵的大小，这与置信度有关。","讲者提到，置信椭球的形状由一个矩阵决定，而β值由卡方分布的逆分布确定。置信度越高，β值越大，置信椭球也越大。实验设计的问题在于如何选择这些测量，使得最终的置信椭球尽可能小。","讲者指出，正定矩阵的大小比较不是线性的，因此需要将正定矩阵的大小转化为标量，以进行比较。不同的标量化方法会导致不同的实验设计类型。","讲者提到，矩阵的大小可以用二范数来衡量，这类似于信噪比。如果矩阵的大小很大，说明该测量效果很好。","讲者强调，实验设计的难点在于如何在不同方向上比较不同测量的效果，因为某些方向上可能更好，而另一些方向上可能更差。","讲者最后提到，实验设计的目的是选择一组测量，使得最终的置信椭球尽可能小，从而提高估计的精度。"],"formulas":[],"uncertainties":["AI is gigantic"],"diagram":"none","start":655.46,"end":816.02,"asr_flags":[],"math_clarifications":["原文中提到的正定矩阵和椭球体相关概念，如'positive definite matrix'和'confidence ellipsoid'，需要更明确的数学定义和公式支持。例如，正定矩阵的大小通常通过其特征值或迹来衡量，而椭球体的大小与协方差矩阵的逆相关。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":655.46,"text":"And the shape is given by this matrix here. And so, for example, I don't know. So that would give you... And beta is going to be determined by, you know, actually it would be something like the inverse distribution of a chi-squared random variable with the appropriate number of degrees. It doesn't matter, though, because that's how you would get beta. And that would say, thank you for the measurements. This tells you, you know, with 90%..."},{"start":684.17,"text":"Probability, you're in this ellipsoid, right? And if I say 99% thing, then beta just gets bigger here. So that's all that happens, right? Okay. So experiment design is this problem. So I have a bunch of candidates, V1 through VP. You should think of these as possible measurements or experiments you can make, right? So that's what they are."},{"start":712.44,"text":"And then I want to choose M AIs, which are among this palette of possible experiments I can carry out, right? So in other words, I have a bunch of sensors and what I can do is you'd say, pick."},{"start":731.92,"text":"Pick which sensors you should use. In fact, even pick the sequence, right? Which you should use to actually get the best estimate. The best estimate is a bit tricky because we're going to measure everything in terms of this ellipsoid, right? And we want this, sorry, this positive definite matrix, right? And what we really want is this positive definite matrix to be small, which by the way is the same as saying that the, sorry, yeah, we want this to be small, which is saying that the confidence ellipsoid is small, right?"},{"start":761.84,"text":"So that's what you do. So, in other words, now the problem with that is, this is exactly an ordering, the positive semi-definite matrices, which is not linear. Right? So it's completely reasonable if you came up with an experiment design, and you came up with one, we looked at your E's, like E1 and E2, and they were not comparable. So in some directions, you're better, and in other directions, you're better. That can and does happen. Everybody got it?"},{"start":789.18,"text":"So we're going to have to scalarize the idea of a positive definite matrix being small. And there's lots of different ways to do it. Each one is going to lead to a certain named type of experiment design. So let me discuss a couple of things quickly. Earlier, I said that the size of A is something like, let's say, the two norm. That's something like a signal-to-noise ratio. If AI is gigantic, that's really good. That's a good measurement."}],"speech_gaps":[],"frame":"../frames/v011/005.webp","frame_time":667.46},{"title":"选择最大信号-噪声比实验的设计策略","segments":[{"id":33,"text":"So let me ask a question. In fact, I have a proposal. Here's my experiment design method. Ready? I will find the largest VI in magnitude. Someone says, why are you choosing that? And you go, of the sensors or the experiments I've been offered, that's the one with the highest signal-to-noise ratio. Make sense? Okay. And then they'd say, ready for my experiment design? Just do that.","zh":"那么让我提出一个问题。事实上，我有一个建议。这就是我的实验设计方法。准备好了吗？我会找到在幅度上最大的VI。有人会说，为什么你选择这个？你会回答，从我被提供的传感器或实验中，这是信号-噪声比最高的那个。明白吗？好的。然后他们会问，准备好我的实验设计了吗？就这么做。","start":816.84,"end":841.88},{"id":34,"text":"use, suppose V7 is the largest in magnitude of these, then you just do that the whole way. And someone says, why are you doing that? And you go, why would I use anything other than the experiment that has the highest signal to noise ratio? Everybody got that? Okay. Well, okay. You're probably not going to fool for it, but I'm actually pretty good at making up a good story. I could tell stories around that and all sorts of other stuff. I bet I could get some people to go for that.","zh":"假设V7是这些中幅度最大的，那么你整个过程都这么做。有人会问，为什么你这么做？你会回答，为什么我会使用任何其他信号-噪声比不如这个高的实验呢？大家明白了吗？好的。好吧。你可能不会被说服，但我实际上很擅长编造一个好故事。我可以围绕这个以及各种其他事情编故事。我打赌我能说服一些人接受这个。","start":843.22,"end":872.12},{"id":35,"text":"Okay, any comments?","zh":"好的，有任何评论吗？","start":872.95,"end":873.75},{"id":36,"text":"You mean the worst situation, not the best situation?","zh":"你是说最坏的情况，而不是最好的情况吗？","start":876.33,"end":879.69},{"id":37,"text":"Well, I mean, no, I just told you my policy.","zh":"我的意思是，不，我只是告诉了你我的策略。","start":882.65,"end":885.81},{"id":38,"text":"My policy is I'm going to take V7 over here","zh":"我的策略是我要选择这边的V7","start":885.95,"end":889.21},{"id":39,"text":"because it's the one with the largest magnitude, right?","zh":"因为它在幅度上最大，对吧？","start":889.21,"end":892.01},{"id":40,"text":"And then I'm just going to, all my AIs are going to be that.","zh":"然后我就会让所有的AI都这么做。","start":892.49,"end":894.95},{"id":41,"text":"Do you have a suggestion?","zh":"你有什么建议吗？","start":895.47,"end":896.47},{"id":42,"text":"Any comment on it?","zh":"对此有什么评论吗？","start":896.77,"end":897.77},{"id":43,"text":"Would there be some, like, bias in one direction?","zh":"会不会有某种方向上的偏差？","start":899.55,"end":902.29},{"id":44,"text":"No, you know, all of these are kind of unbiased.","zh":"不，你知道的，这些基本上都是无偏的。","start":902.97,"end":906.31},{"id":45,"text":"Yeah.","zh":"是的。","start":906.41,"end":906.63},{"id":46,"text":"Let me ask one question.","zh":"让我问一个问题。","start":907.67,"end":909.29},{"id":47,"text":"Let's talk about this matrix if all the AIs were the same.","zh":"假设所有AI都是一样的，我们来谈谈这个矩阵。","start":911.09,"end":914.65},{"id":48,"text":"What's that matrix look like?","zh":"这个矩阵看起来是什么样子的？","start":917.57,"end":919.07},{"id":49,"text":"What is it?","zh":"这是什么？","start":922.31,"end":923.11},{"id":50,"text":"A7 square identity.","zh":"A7平方单位矩阵。","start":925.45,"end":926.97},{"id":51,"text":"It's what?","zh":"它是甚么？","start":927.43,"end":927.87},{"id":52,"text":"I don't see any identity matrix.","zh":"我看不见任何单位矩阵。","start":933.27,"end":935.37},{"id":53,"text":"What's that?","zh":"那是甚么？","start":935.81,"end":936.17},{"id":54,"text":"No.","zh":"不。","start":936.33,"end":936.41},{"id":55,"text":"So this thing would become sum from i equals 1 to m, v7, v7 transpose, otherwise known as m times v7, v7 transpose.","zh":"因此，这个东西会变成从i等于1到m的求和，v7乘以v7的转置，也即m乘以v7乘以v7的转置。","start":937.01,"end":943.81},{"id":56,"text":"known as m times v7, v7 transpose.","zh":"也即m乘以v7乘以v7的转置。","start":943.81,"end":947.33},{"id":57,"text":"Anybody want to comment about the matrix v7, v7 transpose?","zh":"有人想评论一下矩阵 v7 和 v7 的转置吗？","start":948.67,"end":952.15},{"id":58,"text":"It's what?","zh":"这是什么？","start":953.43,"end":954.05},{"id":59,"text":"It's rank 1, right?","zh":"它的秩是 1，对吧？","start":954.13,"end":955.43},{"id":60,"text":"Okay.","zh":"好的。","start":955.51,"end":955.99},{"id":61,"text":"Okay, so if I just always use the experiment with a high, if I always make a measurement","zh":"好的，那么如果我总是使用具有高信号-噪声比的实验，如果我总是进行最高信号-噪声比的测量，那么我们这里就有一个问题，因为","start":955.99,"end":960.83},{"id":62,"text":"which is the highest signal-to-noise ratio, then we've got kind of a problem here, because","zh":"这个矩阵是不可逆的。","start":960.83,"end":967.65},{"id":63,"text":"this matrix is not invertible.","zh":"它是奇异的，对吧？","start":967.65,"end":969.91},{"id":64,"text":"It's singular, right?","zh":"它是奇异的，对吧？","start":970.67,"end":972.01},{"id":65,"text":"And so, I mean, we could talk about E inverse if you like.","zh":"所以，如果你想的话，我们也可以谈谈 E 的逆。","start":972.33,"end":975.51},{"id":66,"text":"It's kind of silly.","zh":"这有点傻。","start":975.61,"end":976.43},{"id":67,"text":"I can tell you what it would be.","zh":"我可以告诉你它会是什么。","start":976.57,"end":977.93},{"id":68,"text":"It's our error covariance.","zh":"它是我们的误差协方差。","start":978.05,"end":978.95},{"id":69,"text":"It'd be really good in the direction V7.","zh":"它在方向 V7 上会非常好。","start":979.03,"end":982.05}],"notes":["本段讨论了在实验设计中选择具有最高信号-噪声比的实验的策略。讲者提出，如果所有AI都使用相同的实验，那么所形成的矩阵将是一个秩为1的矩阵，这会导致矩阵不可逆，从而产生问题。","讲者指出，如果总是选择最高信号-噪声比的实验，那么所形成的矩阵将是一个秩为1的矩阵，这会导致矩阵不可逆，从而无法求逆。这种不可逆性可能影响误差协方差的计算。","讲者提到，这种不可逆性可能使得误差协方差矩阵的逆变得没有意义，因此在实际应用中需要考虑其他方法来处理这种情况。","讲者还指出，这种矩阵的结构在方向V7上表现良好，但在其他方向上可能存在问题，这表明需要更全面的实验设计策略。","讲者通过举例说明了矩阵的结构和性质，强调了在实验设计中选择合适实验的重要性。","讲者最后提到，这种不可逆性可能使得误差协方差矩阵的逆变得没有意义，因此在实际应用中需要考虑其他方法来处理这种情况。"],"formulas":[],"uncertainties":[],"diagram":"none","start":816.84,"end":982.05,"asr_flags":[],"math_clarifications":["原始文本中未明确说明矩阵 A 的构造方式，因此无法核定其数学表达式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":37,"raw_segments":[{"start":816.84,"text":"So let me ask a question. In fact, I have a proposal. Here's my experiment design method. Ready? I will find the largest VI in magnitude. Someone says, why are you choosing that? And you go, of the sensors or the experiments I've been offered, that's the one with the highest signal-to-noise ratio. Make sense? Okay. And then they'd say, ready for my experiment design? Just do that."},{"start":843.22,"text":"use, suppose V7 is the largest in magnitude of these, then you just do that the whole way. And someone says, why are you doing that? And you go, why would I use anything other than the experiment that has the highest signal to noise ratio? Everybody got that? Okay. Well, okay. You're probably not going to fool for it, but I'm actually pretty good at making up a good story. I could tell stories around that and all sorts of other stuff. I bet I could get some people to go for that."},{"start":872.95,"text":"Okay, any comments?"},{"start":876.33,"text":"You mean the worst situation, not the best situation?"},{"start":882.65,"text":"Well, I mean, no, I just told you my policy."},{"start":885.95,"text":"My policy is I'm going to take V7 over here"},{"start":889.21,"text":"because it's the one with the largest magnitude, right?"},{"start":892.49,"text":"And then I'm just going to, all my AIs are going to be that."},{"start":895.47,"text":"Do you have a suggestion?"},{"start":896.77,"text":"Any comment on it?"},{"start":899.55,"text":"Would there be some, like, bias in one direction?"},{"start":902.97,"text":"No, you know, all of these are kind of unbiased."},{"start":906.41,"text":"Yeah."},{"start":907.67,"text":"Let me ask one question."},{"start":911.09,"text":"Let's talk about this matrix if all the AIs were the same."},{"start":917.57,"text":"What's that matrix look like?"},{"start":922.31,"text":"What is it?"},{"start":925.45,"text":"A7 square identity."},{"start":927.43,"text":"It's what?"},{"start":933.27,"text":"I don't see any identity matrix."},{"start":935.81,"text":"What's that?"},{"start":936.33,"text":"No."},{"start":937.01,"text":"Yeah, so this thing would become sum from i equals 1 to m, v7, v7 transpose, otherwise"},{"start":943.81,"text":"known as m times v7, v7 transpose."},{"start":948.67,"text":"Anybody want to comment about the matrix v7, v7 transpose?"},{"start":953.43,"text":"It's what?"},{"start":954.13,"text":"It's rank 1, right?"},{"start":955.51,"text":"Okay."},{"start":955.99,"text":"Okay, so if I just always use the experiment with a high, if I always make a measurement"},{"start":960.83,"text":"which is the highest signal-to-noise ratio, then we've got kind of a problem here, because"},{"start":967.65,"text":"this matrix is not invertible."},{"start":970.67,"text":"It's singular, right?"},{"start":972.33,"text":"And so, I mean, we could talk about E inverse if you like."},{"start":975.61,"text":"It's kind of silly."},{"start":976.57,"text":"I can tell you what it would be."},{"start":978.05,"text":"It's our error covariance."},{"start":979.03,"text":"It'd be really good in the direction V7."}],"speech_gaps":[{"start":928.27,"end":932.87}],"frame":"../frames/v011/006.webp","frame_time":828.84},{"title":"实验设计与凸优化","segments":[{"id":70,"text":"Because I blew my entire... Every experiment I ever did was the same experiment, right? But in n minus 1 dimensions, I got no information of any kind whatsoever. And so my confidence ellipsoid is like infinite in those directions. Everybody make sense? Yep. Okay. So that's it. Okay. All right.","zh":"因为我把全部精力都浪费了……我做过的每一个实验都是同一个实验，对吧？但在n减1维的情况下，我没有任何信息。因此，我的置信椭球在这些方向上是无限的。大家明白吗？是的。好的。就这样。好的。嗯。","start":982.81,"end":1006.11},{"id":71,"text":"So, oh, the first thing to, there's another thing we can observe here, right? Here, we don't have to choose the sequence, right? Because the outcome doesn't depend on the sequencing, right? So, in other words, this is no difference if someone says, please do the following. Use V1 four times, then V3, and then here's the trick. Switch back to V1 four more times, and then V4. Everybody got what I just said? So it turns out,","zh":"所以，哦，我们还可以在这里观察到另一件事，对吧？在这里，我们不需要选择序列，对吧？因为结果不依赖于序列，对吧？换句话说，如果有人说，请按照以下步骤做。使用V1四次，然后使用V3，然后这里有个技巧，切换回V1再使用四次，然后使用V4。大家明白我刚才说的是什么吗？结果是，","start":1007.84,"end":1036.9},{"id":72,"text":"Doesn't matter. If you look at our objective function here, it's symmetric. You can permute them any way you like. By the way, this is completely false, except in this incredibly simple Gaussian setup. In other cases, you want to do design of experiments, it's a whole sequence and it depends on what you've observed so far. In other words...","zh":"没关系。如果你看一下我们的目标函数，它是对称的。你可以以任何方式排列它们。顺便说一句，这在极其简单的高斯设置中是完全正确的。在其他情况下，你想要进行实验设计，它是一个完整的序列，并且取决于你之前观察到的内容。换句话说……","start":1037.31,"end":1061.53},{"id":73,"text":"If we're flying a drone and someone says, we have an energy budget, which sensor are we going to use? It depends on all sorts of stuff. But in this Gaussian model, actually, it doesn't.","zh":"如果我们正在飞无人机，有人告诉我们有一个能量预算，我们应该使用哪个传感器？这取决于各种因素。但在这种高斯模型中，实际上并不需要。","start":1062.38,"end":1076.39},{"id":74,"text":"So, okay. So, it really only depends, I only have to tell you how many of my, my total budget is M experiments. I just have to divide M up across these, the palette of potential experiments that I've been offered. Okay? So, if I had 22, I could say, I want to do four of these, seven of those, three of these, and blah, blah, blah. And my numbers better add up to 22. That's all we have to do. Okay. So, we'll write it this way.","zh":"所以，好的。所以，它实际上只取决于，我只需要告诉你我的总预算M次实验。我只需要将M分配到这些我被提供的潜在实验中。明白吗？所以，如果我有22次，我可以这样说，我想做四次这些，七次那些，三次这些，等等。我的数字加起来必须等于22。这就是我们所需要做的。好的。所以，我们将这样写。","start":1076.74,"end":1101.76},{"id":75,"text":"And here we have an integer problem, right? Because the m's are integers. Actually, here mk is the number of times I'm going to use experiment k, or sensor k, right? That's what it is. And then this thing just looks like this, right? Okay, so this is all cool. Let's see, this is even...","zh":"这里我们有一个整数问题，对吧？因为m的值是整数。实际上，mk是我将使用实验k或传感器k的次数，对吧？这就是它的含义。然后这个式子看起来就是这样，对吧？好的，所以这一切都很棒。让我们看看，这甚至……","start":1102.92,"end":1125.29},{"id":76,"text":"But this is actually, if m were not an integer, but a real number, positive real number, this thing would actually be k convex, where k is the PSD cone. So this would be cool. But it's not. m is an integer. And now, by the way, this comes up in lots and lots of settings, where there's an integer or something like that. So you do, I mean, it's kind of one of the themes, is you do relaxation.","zh":"但实际上，如果m不是一个整数，而是一个正实数，那么这个情况实际上就是k凸的，其中k是半正定锥。这会很酷。但事实上并不是这样。m是一个整数。顺便说一下，这种情况在很多很多的场景中都会出现，其中包含整数或者其他类似的情况。因此，你所做的，某种程度上来说，就是进行松弛。","start":1125.85,"end":1153.76}],"notes":["本段讨论了实验设计中的对称性问题，指出在高斯模型中，实验顺序不影响结果，因此可以任意排列实验。然而，这仅在高斯模型中成立，其他情况下实验顺序会影响结果，需要考虑实验设计的序列性。","讲者通过无人机传感器选择的例子，说明在实际应用中，实验顺序可能会影响结果，但在高斯模型中，由于对称性，顺序不影响结果。","讲者提到，当实验次数为整数时，问题变为整数规划问题，而如果允许实验次数为实数，则问题可以转化为凸优化问题，这涉及到松弛（relaxation）的概念。","松弛是凸优化中的一个重要主题，通过将整数问题转化为连续问题，可以更容易求解，但需要在解的可行性上进行调整。","讲者强调了凸优化在实验设计中的应用，特别是在处理高斯模型时，对称性和凸性使得问题更容易求解。","讲者指出，虽然在某些情况下可以使用松弛方法，但在其他情况下，实验设计需要考虑序列性和观察结果的依赖性，这使得问题更加复杂。"],"formulas":[],"uncertainties":[],"diagram":"none","start":982.81,"end":1153.76,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":982.81,"text":"Because I blew my entire... Every experiment I ever did was the same experiment, right? But in n minus 1 dimensions, I got no information of any kind whatsoever. And so my confidence ellipsoid is like infinite in those directions. Everybody make sense? Yep. Okay. So that's it. Okay. All right."},{"start":1007.84,"text":"So, oh, the first thing to, there's another thing we can observe here, right? Here, we don't have to choose the sequence, right? Because the outcome doesn't depend on the sequencing, right? So, in other words, this is no difference if someone says, please do the following. Use V1 four times, then V3, and then here's the trick. Switch back to V1 four more times, and then V4. Everybody got what I just said? So it turns out,"},{"start":1037.31,"text":"Doesn't matter. If you look at our objective function here, it's symmetric. You can permute them any way you like. By the way, this is completely false, except in this incredibly simple Gaussian setup. In other cases, you want to do design of experiments, it's a whole sequence and it depends on what you've observed so far. In other words..."},{"start":1062.38,"text":"If we're flying a drone and someone says, we have an energy budget, which sensor are we going to use? It depends on all sorts of stuff. But in this Gaussian model, actually, it doesn't."},{"start":1076.74,"text":"So, okay. So, it really only depends, I only have to tell you how many of my, my total budget is M experiments. I just have to divide M up across these, the palette of potential experiments that I've been offered. Okay? So, if I had 22, I could say, I want to do four of these, seven of those, three of these, and blah, blah, blah. And my numbers better add up to 22. That's all we have to do. Okay. So, we'll write it this way."},{"start":1102.92,"text":"And here we have an integer problem, right? Because the m's are integers. Actually, here mk is the number of times I'm going to use experiment k, or sensor k, right? That's what it is. And then this thing just looks like this, right? Okay, so this is all cool. Let's see, this is even..."},{"start":1125.85,"text":"But this is actually, if m were not an integer, but a real number, positive real number, this thing would actually be k convex, where k is the PSD cone. So this would be cool. But it's not. m is an integer. And now, by the way, this comes up in lots and lots of settings, where there's an integer or something like that. So you do, I mean, it's kind of one of the themes, is you do relaxation."}],"speech_gaps":[],"frame":"../frames/v011/007.webp","frame_time":994.81},{"title":"松弛方法与实验设计","segments":[{"id":77,"text":"So the relaxation is, you know what? I divide the M's by capital M. So instead of working with M1, I'm going to work with M1 divided by capital M. And then you're saying, what is the fraction of the total number of experiments you're going to do that are going to use, in fact, M1 over M? What is the fraction when you use experiment number one? Everybody make sense? Okay, so now if I do that,","zh":"所以这个松弛方法是，你知道吗？我把M除以大写M。因此，我不再使用M1，而是使用M1除以大写M。然后你会问，你总共要做的实验中，有多少比例会使用M1除以M？当你使用实验编号一的时候，这个比例是多少？大家明白吗？好的，现在如果我这样做，","start":1154.75,"end":1182.59},{"id":78,"text":"we still have the constraint that those fractions are integer multiples of one over m okay so now we're gonna do is we're gonna relax it right so we're gonna simply ignore that last constraint that's that's that's a typical relaxation right relaxation in general just means you made the feasible set bigger right that that's all it means right uh and so we do that um okay now this this is actually it's kind of cool if you know","zh":"我们仍然有约束，这些比例必须是1/m的整数倍。现在我们要做的就是放松这个约束，所以我们简单地忽略这个最后的约束。这其实就是一种典型的松弛，一般来说，松弛的意思就是让可行集变大，这就是它的全部含义。嗯，所以我们会这样做，嗯，实际上，如果你知道的话，这有点酷。","start":1183.21,"end":1212.23},{"id":79,"text":"So we're going to relax it like this. And then there's all sorts of things you can do with this. So we'll talk about solving it. But what's going to come up is you say, actually, what I'm really going to do is I'm going to choose for you the fractions of each of the experiment types that you should use, whatever your budget is. Maybe it's not going to fit into the integers, but if m is big, I don't think this is a problem. And then I'll give you lots of hints about what you could do.","zh":"我们将这样进行松弛。然后你可以用这个做各种事情。我们将讨论如何求解它。但会出现的情况是，你会说，实际上，我要为你选择每种实验类型的使用比例，无论你的预算是什么。也许它不能完全符合整数，但如果m很大，我认为这不是一个问题。然后我会给你很多关于你可以做什么的提示。","start":1212.62,"end":1241.18},{"id":80,"text":"Um, what you can do first, you go back to the person who said, do the experiment design and you'd say, yeah. Okay. What's your budget? And they'd say 57 and they go, great. You should do, you should use experiment number two, 6.45 times. And they would go like.","zh":"嗯，你可以首先做的是，回到说要做实验设计的人那里，并说，是的。好的。你的预算是多少？他们会说57，然后你说，很好。你应该做实验编号二，6.45次。他们会说像这样。","start":1241.64,"end":1257.73},{"id":81,"text":"What does that mean? That means nothing. I can't use experiments. Every time I'm allowed to choose one of the experiments, I can't do it 6.45 times. Everybody see that? At this point, this is just very practical advice for all of you when you become part of the 364A diaspora. Here's what you can do. The first thing you do is you try to convince the person that...","zh":"这意味着什么？这什么也不意味着。我不能使用实验。每次我被允许选择一个实验时，我不能做6.45次。大家明白这一点吗？在这一点上，这只是一个对你们所有人的实用建议，当你们成为364A流亡者的一部分时。你可以这样做。第一步是你试图说服那个人……","start":1258.48,"end":1283.18},{"id":82,"text":"your relaxation is actually much more sophisticated. And you'd say, oh, yeah, no, look, don't tell me about six or seven. I don't care about that. This is much more sophisticated. You can drop things like you can make reference to quantum mechanics. That sometimes helps, right? Because you'd say like, look, it's not like you just choose an experiment each time. Anyway, you could say this is really like a probability. These are, in fact, the lambdas are going to be probabilities. And then it says, here's what you should do. Every time you should roll the dice with probability lambda.","zh":"你的松弛方法实际上要复杂得多。你会说，哦，是的，不，看吧，别跟我说六或七。我不关心这些。这要复杂得多。你可以像丢弃一些东西一样，你可以参考量子力学。这有时候会有所帮助，对吧？因为你会说，看，这并不是说你每次只选择一个实验。总之，你可以这样说，这实际上就像一个概率。这些lambda实际上会是概率。然后它说，你应该怎么做。每次你应该以概率lambda来掷骰子。","start":1283.69,"end":1311.59},{"id":83,"text":"And if 13 comes up, congratulations, you should do experiment 13. Everybody following what I'm saying? Anyway, some people actually like fall for this. It's actually kind of amazing, right? And, you know, you mentioned that, you know, and you anyway, you mumble about quantum mechanics and things like that. It's much more sophisticated. It's a probabilistic thing. And you can hint at other things like, hey, do you remember like Matrix games?","zh":"如果掷出13，恭喜，你应该进行实验13。大家明白我在说什么吗？总之，有些人确实会被这个说服。实际上这真的很神奇，对吧？而且，你提到过，你提到过，你随便聊聊量子力学之类的东西。这要复杂得多。这是一个概率性的问题。你还可以暗示其他东西，比如，你还记得矩阵游戏吗？","start":1312.39,"end":1334.07}],"notes":["本段讲解了松弛方法在实验设计中的应用。松弛方法的核心思想是扩大可行集，从而更容易找到解。在实验设计中，松弛方法允许将实验次数的分配转化为分数形式，例如将实验次数M1除以总实验次数M，从而得到一个分数比例。这种分数比例可以用于指导实验设计，即使实际实验次数必须为整数，但通过松弛方法可以得到一个更优的分配方案。","松弛方法通常意味着将约束条件放宽，使得可行解的集合变大。在本段中，松弛方法被用来忽略实验次数必须为整数的约束，从而允许使用分数形式的实验次数分配。这种做法在实际应用中非常有用，因为它可以提供更灵活的实验设计策略。","在实际应用中，即使松弛方法得到的实验次数分配是分数形式，例如6.45次，但实际操作中必须将其转化为整数。因此，松弛方法提供了一个理论上的指导，而实际应用中需要根据具体情况调整。","松弛方法可以与概率方法结合使用，例如将实验次数分配转化为概率分布。在这种情况下，每次实验的选择可以看作是一个概率事件，通过概率分布来决定实验的执行次数。这种方法在某些情况下更为直观和实用。","松弛方法还可以与其他概念结合使用，例如矩阵游戏。通过将实验设计问题转化为概率问题，可以利用概率方法和矩阵游戏的理论来指导实验设计，从而获得更优的解决方案。","松弛方法在实验设计中的应用需要考虑实际操作的可行性。虽然松弛方法可以提供理论上的最优解，但在实际应用中必须根据具体情况调整，以确保实验设计的可行性和有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1154.75,"end":1334.07,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1154.75,"text":"So the relaxation is, you know what? I divide the M's by capital M. So instead of working with M1, I'm going to work with M1 divided by capital M. And then you're saying, what is the fraction of the total number of experiments you're going to do that are going to use, in fact, M1 over M? What is the fraction when you use experiment number one? Everybody make sense? Okay, so now if I do that,"},{"start":1183.21,"text":"we still have the constraint that those fractions are integer multiples of one over m okay so now we're gonna do is we're gonna relax it right so we're gonna simply ignore that last constraint that's that's that's a typical relaxation right relaxation in general just means you made the feasible set bigger right that that's all it means right uh and so we do that um okay now this this is actually it's kind of cool if you know"},{"start":1212.62,"text":"So we're going to relax it like this. And then there's all sorts of things you can do with this. So we'll talk about solving it. But what's going to come up is you say, actually, what I'm really going to do is I'm going to choose for you the fractions of each of the experiment types that you should use, whatever your budget is. Maybe it's not going to fit into the integers, but if m is big, I don't think this is a problem. And then I'll give you lots of hints about what you could do."},{"start":1241.64,"text":"Um, what you can do first, you go back to the person who said, do the experiment design and you'd say, yeah. Okay. What's your budget? And they'd say 57 and they go, great. You should do, you should use experiment number two, 6.45 times. And they would go like."},{"start":1258.48,"text":"What does that mean? That means nothing. I can't use experiments. Every time I'm allowed to choose one of the experiments, I can't do it 6.45 times. Everybody see that? At this point, this is just very practical advice for all of you when you become part of the 364A diaspora. Here's what you can do. The first thing you do is you try to convince the person that..."},{"start":1283.69,"text":"your relaxation is actually much more sophisticated. And you'd say, oh, yeah, no, look, don't tell me about six or seven. I don't care about that. This is much more sophisticated. You can drop things like you can make reference to quantum mechanics. That sometimes helps, right? Because you'd say like, look, it's not like you just choose an experiment each time. Anyway, you could say this is really like a probability. These are, in fact, the lambdas are going to be probabilities. And then it says, here's what you should do. Every time you should roll the dice with probability lambda."},{"start":1312.39,"text":"And if 13 comes up, congratulations, you should do experiment 13. Everybody following what I'm saying? Anyway, some people actually like fall for this. It's actually kind of amazing, right? And, you know, you mentioned that, you know, and you anyway, you mumble about quantum mechanics and things like that. It's much more sophisticated. It's a probabilistic thing. And you can hint at other things like, hey, do you remember like Matrix games?"}],"speech_gaps":[],"frame":"../frames/v011/008.webp","frame_time":1166.75},{"title":"随机策略与整数约束下的实验设计","segments":[{"id":84,"text":"Do you remember how there's generally not an equilibrium, and so you have to have a, what do you call it, what's it called, a randomized policy? And they would go, yeah. And you go, well, it's just like that. Anyway, that's fine. But supposing, in fact, you really had to do, someone said, no, dude, the drone is flying, and you have a budget of 120 experiments. So I need integers, right?","zh":"你还记得吗，通常情况下并没有均衡点，因此你必须采用一种叫做随机策略的东西？他们会说，是的。你会说，这和那个情况差不多。不管怎样，这没关系。但事实上，你真的必须这么做，有人会说，不，伙计，无人机在飞行，你有120次实验的预算。所以你需要整数，对吧？","start":1334.75,"end":1364.05},{"id":85,"text":"So, someone tell me, what would you do? What would you do? Yeah, do you mean rounding? Yeah, yeah, here's what you'd do. You'd find your lambdas. It's going to be sort of, it's a continuous probability that you choose the experiment in a fraction, right? And you just round them, right? By the way, if you round them, and then you add up the rounded things, and they come up to 121, what do you do then? Just reduce one.","zh":"那么，有人告诉我，你会怎么做？你会怎么做？是的，你是说四舍五入吗？是的，是的，这就是你会怎么做。你会找到你的λ值。这会是一个连续的概率，你在分数上选择实验，对吧？然后你只需四舍五入，对吧？顺便说一句，如果你四舍五入之后，把四舍五入后的数值加起来，结果是121，那你会怎么做？只需减少一个。","start":1364.91,"end":1395.51},{"id":86,"text":"Okay, that's what you do. Everybody following this? And I'm not kidding with this. And you say, that's my experiment design. And they would say, awesome. And they would say, is that actually the one that is going to minimize the, is that going to give me the, is that going to be the best one? Is it going to minimize this confidence ellipsoid? What's the honest answer to that? No.","zh":"好的，这就是你会怎么做。大家跟上来了吗？我可不是开玩笑的。你会说，这就是我的实验设计。他们会说，太棒了。他们会问，这实际上是否能最小化这个置信椭球体？这是否能给我最好的结果？这是否能最小化这个置信椭球体？诚实的回答是什么？不。","start":1396.21,"end":1421.6},{"id":87,"text":"It probably would work. That's fair. That's one way to say no. So you'd say, they'd say, does it actually solve this problem? And you'd say, I don't really know. But what can you do to give some evidence that your rounded one is not so bad? We do the dual problem. Yeah. You don't even need the dual because this was a relaxation.","zh":"它可能有效。这是公平的。这是说不的一种方式。所以你会说，他们会问，这实际上是否解决了这个问题？你会说，我其实不太确定。但你能做些什么来提供一些证据，证明你的四舍五入结果并不差呢？我们做对偶问题。是的。你甚至不需要对偶问题，因为这本来就是一个松弛问题。","start":1422.78,"end":1450.07},{"id":88,"text":"So what you do is, we'll wait until, this will make more sense when we scalarize this, right? So let's say, for example, what happens is you end up with the volume of the confidence ellipsoid. And someone says, does that choice actually minimize the volume of the confidence ellipsoid? And you go, actually, your answer was perfect. Probably. You'd say, it's very close. And they'd say, well, how do you know that? You go, well, because when I remove the constraint that these things are integers and I solve this problem, I found that the log of the volume was 12.6.","zh":"所以你会怎么做呢？我们会在将这个问题标量化的時候，这会更有意义，对吧？比如说，假设你最终得到的是置信椭球体的体积。有人会问，这个选择实际上是否最小化了置信椭球体的体积？你会说，你的回答是完美的。大概吧。你会说，它非常接近。他们会问，你怎么知道的？你会说，因为当我移除了这些变量必须为整数的约束条件并解决这个问题时，我发现体积的对数是12.6。","start":1450.89,"end":1479.55},{"id":89,"text":"And you'd say, nobody could do better than that. That's if we ignore this silly constraint that these things are integers. And you'd say, my log volume was 12.7 when I rounded. Everybody got that? Then it's done. Then you're just done. Because you just say, I can show nobody can have a volume. Did I get that right? I did get it right. No one can have a volume less than 12.6.","zh":"你会说，没有人能做得比这更好了。这是在忽略这个愚蠢的约束条件，即这些数值必须是整数的情况下。你会说，当我四舍五入时，我的对数体积是12.7。大家明白了吗？然后就完成了。你就这样完成了。因为你只是说，我可以证明没有人能有比这更低的体积。我这样说对吗？我说对了。没有人能有比12.6更低的体积。","start":1480.44,"end":1504.4}],"notes":["本段讨论了在实验设计中如何处理整数约束的问题。当实验数量有限时，通常会采用随机策略，即通过连续概率分配实验选择，然后进行四舍五入。但四舍五入可能导致总和超出预算，此时需要调整。"],"formulas":[{"latex":"log(Volume) = 12.6","symbols":"log(Volume) 表示置信椭球体积的对数","explanation":"该公式表示在忽略整数约束的情况下，置信椭球体积的对数为12.6。此公式在原文中被明确提及，且没有数学错误。","evidence":"So what you do is, we'll wait until, this will make more sense when we scalarize this, right? So let's say, for example, what happens is you end up with the volume of the confidence ellipsoid. And someone says, does that choice actually minimize the volume of the confidence ellipsoid? And you go, actually, your answer was perfect. Probably. You'd say, it's very close. And they'd say, well, how do you know that? You go, well, because when I remove the constraint that these things are integers and I solve this problem, I found that the log of the volume was 12.6."}],"uncertainties":[],"diagram":"none","start":1334.75,"end":1504.4,"asr_flags":[],"math_clarifications":["原文中提到的置信椭球体积的对数为12.6是在忽略整数约束的情况下得出的，因此该公式是正确的。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1334.75,"text":"Do you remember how there's generally not an equilibrium, and so you have to have a, what do you call it, what's it called, a randomized policy? And they would go, yeah. And you go, well, it's just like that. Anyway, that's fine. But supposing, in fact, you really had to do, someone said, no, dude, the drone is flying, and you have a budget of 120 experiments. So I need integers, right?"},{"start":1364.91,"text":"So, someone tell me, what would you do? What would you do? Yeah, do you mean rounding? Yeah, yeah, here's what you'd do. You'd find your lambdas. It's going to be sort of, it's a continuous probability that you choose the experiment in a fraction, right? And you just round them, right? By the way, if you round them, and then you add up the rounded things, and they come up to 121, what do you do then? Just reduce one."},{"start":1396.21,"text":"Okay, that's what you do. Everybody following this? And I'm not kidding with this. And you say, that's my experiment design. And they would say, awesome. And they would say, is that actually the one that is going to minimize the, is that going to give me the, is that going to be the best one? Is it going to minimize this confidence ellipsoid? What's the honest answer to that? No."},{"start":1422.78,"text":"It probably would work. That's fair. That's one way to say no. So you'd say, they'd say, does it actually solve this problem? And you'd say, I don't really know. But what can you do to give some evidence that your rounded one is not so bad? We do the dual problem. Yeah. You don't even need the dual because this was a relaxation."},{"start":1450.89,"text":"So what you do is, we'll wait until, this will make more sense when we scalarize this, right? So let's say, for example, what happens is you end up with the volume of the confidence ellipsoid. And someone says, does that choice actually minimize the volume of the confidence ellipsoid? And you go, actually, your answer was perfect. Probably. You'd say, it's very close. And they'd say, well, how do you know that? You go, well, because when I remove the constraint that these things are integers and I solve this problem, I found that the log of the volume was 12.6."},{"start":1480.44,"text":"And you'd say, nobody could do better than that. That's if we ignore this silly constraint that these things are integers. And you'd say, my log volume was 12.7 when I rounded. Everybody got that? Then it's done. Then you're just done. Because you just say, I can show nobody can have a volume. Did I get that right? I did get it right. No one can have a volume less than 12.6."}],"speech_gaps":[],"frame":"../frames/v011/009.webp","frame_time":1346.75},{"title":"放松的实验设计与矩阵可逆性","segments":[{"id":90,"text":"That's something you can... But we got one that has log volume 12.7. Make sense? Okay. All right, so this is relaxed experiment design. Actually, we will get to the dual of this very soon. Yes?","zh":"这是你可以做的事情。但我们得到了一个对数体积为12.7的。有道理吗？好的。那么，这就是放松的实验设计。实际上，我们很快就会讨论这个的对偶问题。对吗？","start":1504.9,"end":1518.38},{"id":91,"text":"Assumption of M must be much greater than the number of experiments. Sorry, where? Here? M must be greater than P. Assumption, assume... What, why, what, why is... The relaxed experiment design has assumed M much greater than P, and then using lambda k is equal to mk by m. Even over here? Yeah. Why is that there?","zh":"M的假设必须远大于实验的数量。抱歉，哪里？这里？M必须大于P。假设，假设……什么，为什么，什么，为什么是……放松的实验设计假设M远大于P，然后使用lambda k等于mk除以m。即使在这里？是的。为什么会有这个？","start":1519.75,"end":1538.51},{"id":92,"text":"Yeah, let's see why. Oh, the idea is I wanted these numbers to be reasonably, to be not too grainy. If I round it, I want to be able to get something that's close to an integer. I mean, you don't even need this, right? The first one. That doesn't matter, right? Yeah. Now, when you get down to a, well, okay, let's try this. What if I said you have three experiments, period?","zh":"是的，让我们看看原因。哦，想法是我想让这些数字合理一些，不要太粗糙。如果我进行四舍五入，我希望得到一个接近整数的结果。我的意思是，你甚至不需要这个，对吧？第一个。这没关系，对吧？是的。现在，当你降到a，嗯，好吧，让我们试试这个。如果我说你有三个实验，对吧？","start":1541.27,"end":1568.78},{"id":93,"text":"Can we solve that problem? I mean, it depends how big whatever it is. P is, right? P is the number of options, right? Let's suppose P is 20 or something. And I tell you, no, you have three experiments. Tell me what to do. Can we solve that?","zh":"我们能解决这个问题吗？我的意思是，这取决于它有多大。P是，对吧？P是选项的数量，对吧？让我们假设P是20左右。然后我告诉你，不，你有三个实验。告诉我该怎么做。我们能解决吗？","start":1570.52,"end":1589.15},{"id":94,"text":"Just try all the combinations. Yeah, you try all. It's like p cubed. You just do, you try all combinations or whatever. It's not even p cubed. It's a lot less than that. It's like p cubed over 6, right? Or something like that, right? You try all of them. You find out. Okay, so that's, so for small ones, we can actually solve the actual, you know, and that's actually when you get into things like design of experiments. These are like grainy and, you know, they're kind of combinatorial, right? And these are tricky. Yeah? Professor, perhaps I didn't understand what you meant before about","zh":"只需尝试所有组合。是的，你尝试所有组合。这就像p的立方。你只需尝试所有组合或任何东西。它甚至不到p的立方。它比这少得多。它就像p的立方除以6，对吧？或者类似的东西，对吧？你尝试所有组合。你就会发现。好的，所以对于小规模的问题，我们实际上可以解决实际的问题，你知道的，这就是当你进入实验设计这类问题的时候。这些问题很粗糙，你知道的，它们有点组合性质，对吧？这些问题很棘手。对吗？教授，也许我之前没有完全理解你关于","start":1590.02,"end":1618.81},{"id":95,"text":"e not being invertible, but isn't this not required that e is invertible? Because you can make a solution where m1 is equal to m. Yeah, so you're going to have a problem though. Let me show you what the problem is. That when this is not invertible, we're going to interpret e as being basically infinite in those directions.","zh":"e不可逆的含义，但难道这不是要求e可逆吗？因为你可以构造一个解，其中m1等于m。是的，但你将会遇到问题。让我向你展示问题是什么。当这个不可逆时，我们将把e解释为在这些方向上基本上是无限的。","start":1619.9,"end":1642.92},{"id":96,"text":"and we've asked you to minimize it. Now, by the way, when we scalarize it, we're going to be cool, right? Because we're going to have a log, a determinant, or a trace, and all that kind of stuff. And the problem is then, you'd say, if you do that, you're going to come up with plus infinity. Yeah, so we'll get to that in a minute. Yeah, but that's... Undesirable for it to be... Yes, in fact, in this case, infinitely undesirable. So what we'll do is we'll say that if this thing is invertible...","zh":"并且我们已经要求你对其进行最小化。现在，顺便提一下，当我们对其进行标量化时，我们会很轻松，对吧？因为我们会得到一个对数、一个行列式，或者一个迹，以及其他类似的东西。然后问题就出现了，你会说，如果你这样做，你将会得到正无穷大。是的，我们稍后会谈到这一点。是的，但这种情况是不理想的。事实上，在这种情况下，它是无限不理想的。因此，我们将这样做：我们将会说，如果这个矩阵是可逆的……","start":1645.4,"end":1674.66}],"notes":["本段讨论了放松的实验设计中M与P的关系，其中M必须远大于P。这是为了确保在设计实验时，可以使用lambda_k = m_k / m的公式。这种设计方法允许在不精确的情况下进行近似，从而简化计算。","在讨论中，教授提到当M远大于P时，可以使用lambda_k = m_k / m的公式。这表明在放松的实验设计中，需要确保M足够大，以避免数值上的不稳定。","教授进一步解释了为什么需要M远大于P，即为了使数值更平滑，避免过于粗糙的近似。他提到，如果直接四舍五入，可能会得到一个接近整数的值，但并不总是需要这样做。","教授还提到，当实验数量较小时，可以实际解决设计问题，例如通过尝试所有组合。然而，当实验数量较大时，这种方法变得不可行，因为组合数量会迅速增加。","教授指出，当矩阵e不可逆时，会导致问题变得不可解，因为此时e在某些方向上被视为无限大。这表明矩阵的可逆性在优化问题中至关重要。","最后，教授提到在标量化问题时，可能会遇到无穷大的情况，这在优化中是不可接受的。因此，需要确保矩阵e是可逆的，以避免这种问题。"],"formulas":[{"latex":"\\lambda_k = \\frac{m_k}{m}","symbols":"lambda_k 表示第k个实验的权重，m_k 表示第k个实验的次数，m 表示总实验次数","explanation":"公式正确，lambda_k 是 m_k 与总实验次数 m 的比值，符合实验设计中权重分配的常见表达方式。","evidence":"Assumption of M must be much greater than the number of experiments. Sorry, where? Here? M must be greater than P. Assumption, assume... What, why, what, why is... The relaxed experiment design has assumed M much greater than P, and then using lambda k is equal to mk by m. Even over here? Yeah. Why is that there?"},{"latex":"P","symbols":"P 表示实验选项的数量","explanation":"公式正确，P 表示实验选项的数量，符合上下文中的描述。","evidence":"Can we solve that problem? I mean, it depends how big whatever it is. P is, right? P is the number of options, right? Let's suppose P is 20 or something. And I tell you, no, you have three experiments. Tell me what to do. Can we solve that?"},{"latex":"e","symbols":"e 表示矩阵，其可逆性在优化问题中至关重要","explanation":"公式正确，e 表示矩阵，其可逆性在优化问题中至关重要，符合上下文中的描述。","evidence":"e not being invertible, but isn't this not required that e is invertible? Because you can make a solution where m1 is equal to m. Yeah, so you're going to have a problem though. Let me show you what the problem is. That when this is not invertible, we're going to interpret e as being basically infinite in those directions."}],"uncertainties":["lambda_k = m_k / m 的具体应用场景和条件"],"diagram":"none","start":1504.9,"end":1674.66,"asr_flags":[],"math_clarifications":["公式中的 lambda_k = m_k/m 是实验设计中常见的权重分配方式，符合上下文中的描述。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1504.9,"text":"That's something you can... But we got one that has log volume 12.7. Make sense? Okay. All right, so this is relaxed experiment design. Actually, we will get to the dual of this very soon. Yes?"},{"start":1519.75,"text":"Assumption of M must be much greater than the number of experiments. Sorry, where? Here? M must be greater than P. Assumption, assume... What, why, what, why is... The relaxed experiment design has assumed M much greater than P, and then using lambda k is equal to mk by m. Even over here? Yeah. Why is that there?"},{"start":1541.27,"text":"Yeah, let's see why. Oh, the idea is I wanted these numbers to be reasonably, to be not too grainy. If I round it, I want to be able to get something that's close to an integer. I mean, you don't even need this, right? The first one. That doesn't matter, right? Yeah. Now, when you get down to a, well, okay, let's try this. What if I said you have three experiments, period?"},{"start":1570.52,"text":"Can we solve that problem? I mean, it depends how big whatever it is. P is, right? P is the number of options, right? Let's suppose P is 20 or something. And I tell you, no, you have three experiments. Tell me what to do. Can we solve that?"},{"start":1590.02,"text":"Just try all the combinations. Yeah, you try all. It's like p cubed. You just do, you try all combinations or whatever. It's not even p cubed. It's a lot less than that. It's like p cubed over 6, right? Or something like that, right? You try all of them. You find out. Okay, so that's, so for small ones, we can actually solve the actual, you know, and that's actually when you get into things like design of experiments. These are like grainy and, you know, they're kind of combinatorial, right? And these are tricky. Yeah? Professor, perhaps I didn't understand what you meant before about"},{"start":1619.9,"text":"e not being invertible, but isn't this not required that e is invertible? Because you can make a solution where m1 is equal to m. Yeah, so you're going to have a problem though. Let me show you what the problem is. That when this is not invertible, we're going to interpret e as being basically infinite in those directions."},{"start":1645.4,"text":"and we've asked you to minimize it. Now, by the way, when we scalarize it, we're going to be cool, right? Because we're going to have a log, a determinant, or a trace, and all that kind of stuff. And the problem is then, you'd say, if you do that, you're going to come up with plus infinity. Yeah, so we'll get to that in a minute. Yeah, but that's... Undesirable for it to be... Yes, in fact, in this case, infinitely undesirable. So what we'll do is we'll say that if this thing is invertible..."}],"speech_gaps":[],"frame":"../frames/v011/010.webp","frame_time":1516.9},{"title":"实验设计与对偶问题","segments":[{"id":97,"text":"we'll say then E is infinitely undesirable. By the way, when we scalarize, that's going to happen automatically in a minute, okay? So, okay. Okay, so now you have different names, right? And these are like famous names. So, D optimal, you know, duh, is going to be the determinant, right? So, if you minimize the log determinant, and that's actually beautiful. Basically, it says minimize the volume of...","zh":"那么我们会说E是无限不想要的。顺便说一句，当我们进行标量化时，这将在一会儿自动发生，好吗？好的。好的，现在你有了不同的名称，对吧？这些是著名的名称。所以，D最优，你知道的，就是行列式，对吧？所以，如果你最小化对数行列式，这实际上很美。基本上，它表示最小化……","start":1675.15,"end":1702.23},{"id":98,"text":"of a confidence ellipsoid at some level, right? Because that's what it means, right? And by the way, here, your question, we can be very specific. If I choose, let's say, lambda equals E1, that means I'm simply only going to do experiment one.","zh":"某个置信椭球的体积，对吧？因为这就是它的含义，对吧？顺便说一句，这里你的问题，我们可以非常具体。如果我选择，比如说，lambda等于E1，这意味着我仅仅只做第一个实验。","start":1702.81,"end":1717.47},{"id":99,"text":"Then this matrix is non-invertible. I can take the minus one and put it out here. But then log determinant of a non-singular matrix is going to be minus infinity. Of a singular matrix, it's going to be minus infinity. And when I flip the sign, I get plus infinity. And it's like, nice choice of experiment design, but your objective is infinity. And given that we're minimizing it, I would call that a rather poor design.","zh":"那么这个矩阵是非可逆的。我可以把负号拿出来。但此时非奇异矩阵的对数行列式将是负无穷大。对于奇异矩阵，它也是负无穷大。当我翻转符号时，我会得到正无穷大。这就像，这是一个不错的实验设计，但你的目标是无穷大。考虑到我们在最小化它，我会称这为一种相当糟糕的设计。","start":1718.31,"end":1744.7},{"id":100,"text":"I don't know if that explained that, but okay. All right. So this is called deoptimal experiment. There's whole books on this, which is kind of cool, I think, but that's okay. So, all right. You can actually work out the dual problem of this, which is actually a dual, right?","zh":"我不知道是否解释清楚了，但好吧。好的，这被称为次优实验。关于这个有整本书，我觉得有点酷，但没关系。好的，你实际上可以推导出这个问题的对偶问题，这实际上是一个对偶问题，对吧？","start":1746.57,"end":1765.05},{"id":101,"text":"And it turns out to be something that we're going to talk about possibly even later today. But it looks like this. You're going to end up with a maximize of the log determinant of W. W is going to be like a dual variable, plus a constant. And then you're going to have subject to this constant here. And this thing, let's just check that that is in fact a convex optimization problem with variable capital W, right? This is concave. Log determinant of a positive definite matrix is concave.","zh":"结果它会是我们在今天可能甚至稍后讨论的内容。但看起来像这样。你最终会得到一个最大化对数行列式W的值。W将像一个对偶变量，加上一个常数。然后你会有这个常数的约束。这个东西，让我们检查一下，它实际上是否是一个关于变量大写W的凸优化问题，对吧？这是凹函数。正定矩阵的对数行列式是凹函数。","start":1766.48,"end":1795.58},{"id":102,"text":"That's a constant, doesn't make any difference. What kind of inequality is this as a function of w? What is it? It's linear. It's just linear inequalities on w. It's quadratic in v's, but the v's are given to us. Those are the options for experiments that we carry out, right? So, okay. And we can actually interpret it really well. This is cool. This is an ellipsoid.","zh":"这是一个常数，不会产生任何影响。作为w的函数，这是一个什么类型的不等式？这是什么？它是线性的。它只是关于w的线性不等式。它在v上是二次的，但这些v是给定的。这些就是我们进行实验的选项，对吧？所以，好的。我们实际上可以很好地解释它。这很酷。这是一个椭球体。","start":1796.12,"end":1820.2},{"id":103,"text":"and it's centered at the origin, right? And this simply says, this thing here says that all the Vs are in the ellipsoid, right? And so what this says is, here's how you find, this tells you that there's a relation between this experiment design and actually you take your Vs, then find the minimum volume ellipsoid centered at the origin that covers them.","zh":"并且它以原点为中心，对吧？这个说法很简单，它表示这里的所有V都在椭球体内，对吧？因此，这说明了如何找到这种实验设计与实际的关系：你取你的V，然后找到一个以原点为中心、覆盖它们的最小体积椭球体。","start":1821.37,"end":1847.05}],"notes":["本段讨论了实验设计中矩阵不可逆的情况，当矩阵不可逆时，其对数行列式会趋向于负无穷，这表明实验设计不佳。同时，讲者提到对偶问题的构建，其中涉及最大化对数行列式和线性约束，这构成了一个凸优化问题。","讲者指出，对偶问题中的变量W是双变量，且目标函数是对数行列式，这是一个凹函数。约束条件是线性不等式，因此整个问题是一个凸优化问题。这表明对偶问题的结构清晰，便于求解。","讲者进一步解释了实验设计与椭球体之间的关系，指出通过选择实验变量V，可以找到一个以原点为中心、覆盖所有V的最小体积椭球体。这说明实验设计的目标是优化椭球体的体积，从而提高实验的效率。","讲者提到，椭球体的体积与实验设计密切相关，最小体积椭球体的构造是实验设计中的一个重要问题。这表明在优化过程中，需要考虑如何选择实验变量以达到最优的覆盖效果。","讲者还提到，实验设计中的对偶问题可能在后续课程中进一步讨论，这表明该问题具有一定的复杂性，需要更深入的分析。","讲者强调了凸优化在实验设计中的应用，通过构建对偶问题，可以更有效地解决实验设计中的优化问题。这表明凸优化理论在实际问题中的重要性。"],"formulas":[{"latex":"log\\det(W)","symbols":"对数行列式","explanation":"公式正确，表示矩阵W的对数行列式，符合数学表达。","evidence":"And it turns out to be something that we're going to talk about possibly even later today. But it looks like this. You're going to end up with a maximize of the log determinant of W. W is going to be like a dual variable, plus a constant. And then you're going to have subject to this constant here. And this thing, let's just check that that is in fact a convex optimization problem with variable capital W, right? This is concave. Log determinant of a positive definite matrix is concave."},{"latex":"log\\det(W) + c","symbols":"对数行列式加上常数","explanation":"公式正确，表示对数行列式加上一个常数c，符合数学表达。","evidence":"And it turns out to be something that we're going to talk about possibly even later today. But it looks like this. You're going to end up with a maximize of the log determinant of W. W is going to be like a dual variable, plus a constant. And then you're going to have subject to this constant here. And this thing, let's just check that that is in fact a convex optimization problem with variable capital W, right? This is concave. Log determinant of a positive definite matrix is concave."}],"uncertainties":[],"diagram":"none","start":1675.15,"end":1847.05,"asr_flags":[],"math_clarifications":["W在上下文中未明确其作为双变量的数学定义，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards" t of a positive definite matrix is concave."},{"start":1796.12,"text":"That's a constant, doesn't make any difference. What kind of inequality is this as a function of w? What is it? It's linear. It's just linear inequalities on w. It's quadratic in v's, but the v's are given to us. Those are the options for experiments that we carry out, right? So, okay. And we can actually interpret it really well. This is cool. This is an ellipsoid."},{"start":1821.37,"text":"and it's centered at the origin, right? And this simply says, this thing here says that all the Vs are in the ellipsoid, right? And so what this says is, here's how you find, this tells you that there's a relation between this experiment design and actually you take your Vs, then find the minimum volume ellipsoid centered at the origin that covers them."}],"speech_gaps":[],"frame":"../frames/v011/011.webp","frame_time":1687.15},{"title":"最小体积椭球与实验设计","segments":[{"id":104,"text":"And there's a close relation to that. In fact, this weird complementary slackness would tell you this, that the one it touches when you find this minimum volume ellipsoid, it touches some of the points. Those are the experiments that are desirable. We'll look at some pictures of that in a minute. Here's one. Okay, so here's the origin, right? And then here are the experiments you've been offered. I don't know, maybe there's 20 of them, like 10 here and 10 here, right?","zh":"而且，这与之有密切关系。事实上，这种奇怪的互补松弛性会告诉你，当你找到这个最小体积椭球时，它会接触到一些点。这些就是理想的实验。我们稍后会看一下相关图片。这里有一个例子。好的，这里是原点，对吧？然后这里是为你提供的实验。我不知道，也许有20个，比如这里10个，那里10个，对吧？","start":1848.03,"end":1874.58},{"id":105,"text":"And let's see, let me ask a couple of questions. Okay, clearly these are more desirable than these. How come? And just roughly. Why would these experiments be more powerful than these? They're more SNR. Yeah, they're farther from the origin. That means VI is bigger. It means the signal-to-noise ratio is higher, right? Okay.","zh":"现在，让我问几个问题。显然，这些比那些更理想。为什么？大致来说，为什么这些实验比那些更有力 t one? It's in two dimensions, right? How come? Yeah, that's right. You take the two high signal-to-noise measurements."},{"start":1939.47,"text":"which are closest to orthogonal, or they kind of give you different information. If you're saying, this is the way you should aim your radar, it says, yeah, ideally I would love to have this shot and then 190 degrees like that. That hasn't been offered me here. Let me ask you a question. What if I shrunk these down to just a little tiny arc? Someone guess."},{"start":1966.56,"text":"What do you think? Actually, when I put it somewhere else, I mean, it shouldn't reflect this thing, right? But suppose I put these things way up like over here and I shrunk them down to just a few. What do you think would happen? At some point, you probably wouldn't take two because they don't have enough different of a view."},{"start":1991.44,"text":"And that means that they're not going to give you... So you'd end up picking one of these. You don't want to, but you'd pick it because you need this kind of diversity to be able to see what it is. All this make sense? Okay. So this is the optimal experiment design. It says you should make these both 0.5. I mean, who knows why, because maybe it's symmetric. But there's a ton of super fun..."},{"start":2016.0,"text":"things you can add to this right so here i just said these are your measurements right i could"}],"speech_gaps":[],"frame":"../frames/v011/012.webp","frame_time":1860.03},{"title":"实验设计与凸优化问题的调整","segments":[{"id":111,"text":"Attach to each measurement a cost, and I would say I could give you a budget in cost right. The the","zh":"将每个测量值关联一个成本，并且我会说我可以给你一个成本预算。那那","start":2022.02,"end":2031.28},{"id":112,"text":"cost could be let's say the energy you use to carry out that experiment, and you have and you","zh":"成本可以比如说你执行该实验所使用的能量，你有你","start":2031.28,"end":2036.76},{"id":113,"text":"want to you want to preserve your drone battery life. Everybody following this um, and that's","zh":"
