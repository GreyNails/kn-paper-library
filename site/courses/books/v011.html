:"blah blah blah and all these other things right or something like that and"},{"start":2109.74,"text":"we can just talk briefly about that how would you express that any I'll leave it"},{"start":2122.72,"text":"for you to think about those are convex constraints and they start getting really"},{"start":2127.7,"text":"sophisticated and quite interesting everybody understood what i just said yeah so so yeah no"},{"start":2134.16,"text":"and you get a it's a weird thing where you say well if you if you use that sensor you might as"},{"start":2138.64,"text":"well also use this one you get a discount could even be free right so okay i'll just leave it"},{"start":2144.38,"text":"this way for now um that that yeah okay i'll leave it we'll just we'll move on to the next topic"},{"start":2150.26,"text":"Okay, so let me just end this by saying the idea of this experiment design stuff is this is extreme, this is only for linear measurements with Gaussian noise, right?"},{"start":2166.0,"text":"All other experiment design things get unbelievably complicated."},{"start":2170.16,"text":"They are basically sequential decision making under uncertainty and things like that, and they start getting really complicated."},{"start":2175.94,"text":"But for this one case, which is actually kind of interesting, it is weird if you think about it,"},{"start":2180.78,"text":"it's well there's a lot of weird things about Gaussians and things like that,"},{"start":2183.52,"text":"but this this basically says that this basically says you can say ahead of time"}],"speech_gaps":[],"frame":"../frames/v011/013.webp","frame_time":2034.02},{"title":"椭球体积与几何问题","segments":[{"id":137,"text":"how well you're going to do. If someone says, there's my flight plan, what's going to be, how well am I going to estimate this thing? You can actually say, right? Ahead of time, before doing it, right? Whereas for other things, you can't do that for the distribution. Anyway, I won't, I just want to just warn people about that. Okay. I'm going to skip the derivation of the dual and we'll go on to the next topic. Oh, question. Yeah.","zh":"你将会表现得有多好。如果有人这样说，我的飞行计划是怎样的，我将如何估计这个东西？你实际上可以在事先，在执行之前就说出来，对吧？而对于其他事情，你却不能这样做。总之，我不会做这个推导，我只是想提醒大家这一点。好的。我现在要跳过对对偶的推导，我们继续下一个主题。哦，问题。是的。","start":2190.35,"end":2214.98},{"id":138,"text":"Do you mean the interpretation of it? Yeah, well, so I have to ask you, what is the volume of this ellipsoid? That's going to be kind of our next topic. What's the volume of this ellipsoid? I mean, right. Okay, let's go real slow. If W is big, like as a matrix, what can you say about the ellipsoid there? It's small.","zh":"你是问它的解释吗？是的，那么我必须问你，这个椭球的体积是多少？这将是我们的下一个主题。这个椭球的体积是多少？我是说，对吧。好的，我们慢慢来。如果W是一个大的矩阵，那么关于这个椭球你能说些什么？它很小。","start":2216.8,"end":2246.17},{"id":139,"text":"Right. So in fact, the volume, I don't even remember what it is. It's like, it's the determinant of W, I think to the minus one half, and then multiplied by the volume of a unit ball in R, whatever it is, in this case, maybe RP or something like that, right? Which has got some gamma function and some weird factorials and who knows, probably some pies in there, I'm guessing. That doesn't matter, right?","zh":"对的。事实上，体积，我甚至不记得它是什么。它大概是W的行列式，我猜是负的一半次方，然后乘以R中单位球的体积，不管它是什么，在这种情况下，可能是RP或者其他类似的东西，对吧？这有一些伽马函数和一些奇怪的阶乘，还有谁知道，可能还有一些圆周率在里面，我猜。这并不重要，对吧？","start":2246.91,"end":2275.99},{"id":140,"text":"So the volume of this is a constant times the determinant of w to the minus 1 half. And that says if you make w, so minimizing that, minimizing determinant of w to the minus 1 over the square root of that is the same as maximizing the log determinant. So that's what that is. I didn't say that, so it's kind of unclear. Yeah. Right.","zh":"所以这个体积是一个常数乘以W的行列式的负的一半次方。这说明如果你让W变小，那么最小化这个行列式的负平方根，等同于最大化对数行列式。这就是这个意思。我没有这样说，所以有点不清楚。是的。对的。","start":2276.33,"end":2305.64},{"id":141,"text":"That's for this parameterization of an ellipsoid, because we're about to see some others. Okay, now we'll do geometric problems. Actually, I don't even have here, I'm going to mention some really simple ones. They're so simple that it's almost like insulting to ask, but let's just start with some really simple ones. Suppose I gave you two polyhedra, like P is the set of X for which AX is less than B, right?","zh":"这是椭球的一个参数化形式，因为我们即将看到其他形式。好的，现在我们要做几何问题。实际上，我这里甚至没有，我要提到一些非常简单的例子。它们简单到几乎像是在侮辱，但让我们从一些非常简单的例子开始。假设我给你两个多面体，比如P是满足AX小于B的X的集合，对吧？","start":2307.74,"end":2335.43},{"id":142,"text":"And let's say p tilde is the set of x for which a tilde x is less than b tilde.","zh":"并假设p~是满足a~x小于b~的x的集合。","start":2335.89,"end":2342.45},{"id":143,"text":"So these are two polyhedra, right?","zh":"所以这些是两个多面体，对吧？","start":2342.65,"end":2345.27},{"id":144,"text":"And suppose, how would you solve the following problems, right?","zh":"假设，你如何解决以下问题，对吧？","start":2345.73,"end":2348.91},{"id":145,"text":"How would you determine if they intersect?","zh":"你如何判断它们是否相交？","start":2349.47,"end":2351.13},{"id":146,"text":"Is it a convex problem?","zh":"这是一个凸问题吗？","start":2355.31,"end":2356.55},{"id":147,"text":"And what problem is it?","zh":"那这个问题是什么？","start":2356.65,"end":2358.25},{"id":148,"text":"It's a feasibility problem.","zh":"这是一个可行性问题。","start":2361.25,"end":2362.97},{"id":149,"text":"It satisfies both constraints.","zh":"它满足两个约束条件。","start":2363.05,"end":2364.21},{"id":150,"text":"That's it?","zh":"就这样？","start":2364.41,"end":2364.69},{"id":151,"text":"it, it's just a feasibility problem. So you say yes, you can solve that, it's convex,","zh":"它，它只是一个可行性问题。所以你说可以解决，它是凸的，","start":2364.69,"end":2368.09}],"notes":["本段主要讲解椭球体积的计算方法，指出椭球体积与矩阵W的行列式有关，具体为行列式的负一次方乘以单位球的体积。单位球的体积包含伽马函数和一些特殊因子，但具体数值并不重要。此外，还提到体积的计算与参数化方式有关，因此在后续可能会有其他参数化方式的讨论。","接下来，课程转向几何问题，特别是关于两个多面体的交集问题。课程指出，判断两个多面体是否相交是一个可行性问题，属于凸优化问题，因为多面体是凸集，且交集的约束条件是凸的。","课程还提到，判断两个多面体是否相交的问题可以归类为可行性问题，即是否存在一个点同时满足两个多面体的约束条件。这种问题在凸优化中是常见的，可以通过线性规划等方法求解。","在讨论可行性问题时，课程强调了凸性的重要性，因为凸集的交集仍然是凸集，因此判断交集是否存在是一个凸问题，可以使用凸优化方法进行求解。","此外，课程还提到，虽然问题本身可能看起来简单，但其背后的数学原理和计算方法仍然需要深入理解，特别是在处理多面体和约束条件时。","最后，课程指出，判断两个多面体是否相交的问题是一个典型的可行性问题，可以通过凸优化方法进行求解，这为后续更复杂的几何问题奠定了基础。"],"formulas":[],"uncertainties":["unit ball in R, whatever it is, in this case, maybe RP or something like that"],"diagram":"none","start":2190.35,"end":2368.09,"asr_flags":[],"math_clarifications":["椭球体积公式应包含维度相关的常数因子，例如涉及伽马函数的表达式，因此原始公式不完整。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":2190.35,"text":"how well you're going to do. If someone says, there's my flight plan, what's going to be, how well am I going to estimate this thing? You can actually say, right? Ahead of time, before doing it, right? Whereas for other things, you can't do that for the distribution. Anyway, I won't, I just want to just warn people about that. Okay. I'm going to skip the derivation of the dual and we'll go on to the next topic. Oh, question. Yeah."},{"start":2216.8,"text":"Do you mean the interpretation of it? Yeah, well, so I have to ask you, what is the volume of this ellipsoid? That's going to be kind of our next topic. What's the volume of this ellipsoid? I mean, right. Okay, let's go real slow. If W is big, like as a matrix, what can you say about the ellipsoid there? It's small."},{"start":2246.91,"text":"Right. So in fact, the volume, I don't even remember what it is. It's like, it's the determinant of W, I think to the minus one half, and then multiplied by the volume of a unit ball in R, whatever it is, in this case, maybe RP or something like that, right? Which has got some gamma function and some weird factorials and who knows, probably some pies in there, I'm guessing. That doesn't matter, right?"},{"start":2276.33,"text":"So the volume of this is a constant times the determinant of w to the minus 1 half. And that says if you make w, so minimizing that, minimizing determinant of w to the minus 1 over the square root of that is the same as maximizing the log determinant. So that's what that is. I didn't say that, so it's kind of unclear. Yeah. Right."},{"start":2307.74,"text":"That's for this parameterization of an ellipsoid, because we're about to see some others. Okay, now we'll do geometric problems. Actually, I don't even have here, I'm going to mention some really simple ones. They're so simple that it's almost like insulting to ask, but let's just start with some really simple ones. Suppose I gave you two polyhedra, like P is the set of X for which AX is less than B, right?"},{"start":2335.89,"text":"And let's say p tilde is the set of x for which a tilde x is less than b tilde."},{"start":2342.65,"text":"So these are two polyhedra, right?"},{"start":2345.73,"text":"And suppose, how would you solve the following problems, right?"},{"start":2349.47,"text":"How would you determine if they intersect?"},{"start":2355.31,"text":"Is it a convex problem?"},{"start":2356.65,"text":"And what problem is it?"},{"start":2361.25,"text":"It's a feasibility problem."},{"start":2363.05,"text":"It satisfies both constraints."},{"start":2364.41,"text":"That's it?"},{"start":2364.69,"text":"it, it's just a feasibility problem. So you say yes, you can solve that, it's convex,"}],"speech_gaps":[],"frame":"../frames/v011/014.webp","frame_time":2202.35},{"title":"凸优化中的多面体距离问题","segments":[{"id":152,"text":"it's an LP feasibility problem. Okay, I'll take it up a notch. Find me the minimum distance","zh":"这是一个线性规划可行性问题。好的，我将提高难度。找出两个多面体之间的最小距离","start":2368.27,"end":2373.19},{"id":153,"text":"between the two polyhedra. Let me explain what that means. It means, find me a point,","zh":"让我解释一下这意味着什么。这意味着，找到一个点，","start":2373.19,"end":2382.25},{"id":154,"text":"you know, in one and a point in the other for which the distance is as small as possible.","zh":"你知道的，在其中一个多面体中和另一个多面体中的一个点，使得它们之间的距离尽可能小。","start":2382.31,"end":2388.69},{"id":155,"text":"What kind of problem is that?","zh":"这是什么类型的问题？","start":2388.69,"end":2390.09},{"id":156,"text":"Yeah, it's just a QP, right?","zh":"对，这只是一个二次规划问题，对吧？","start":2395.53,"end":2399.43},{"id":157,"text":"I would say it's going to be...","zh":"我会说这将会是...","start":2399.55,"end":2401.55},{"id":158,"text":"I would have these constraints, ax less than b, and I would write ax tilde less than b","zh":"我会把这些约束条件写成 ax 小于 b，然后我会写成 ax 倾斜小于 b","start":2401.55,"end":2406.47},{"id":159,"text":"tilde, and I would minimize simply x minus x tilde.","zh":"倾斜，然后我只需最小化 x 减去 x 倾斜。","start":2406.47,"end":2411.03},{"id":160,"text":"There.","zh":"好的。","start":2411.69,"end":2412.11},{"id":161,"text":"Any norm you like, but we'll take two norm.","zh":"你可以选择任何范数，不过我们采用的是二范数。","start":2412.51,"end":2415.19},{"id":162,"text":"Everybody got that?","zh":"大家明白了吗？","start":2415.59,"end":2416.43},{"id":163,"text":"so these are just unbelievably simple problems now right oh and what if the two it what if the","zh":"所以这些问题现在变得极其简单，对吧？那么如果两个多面体相交，我问你找出两个多面体之间的距离，是的，这","start":2416.43,"end":2422.05},{"id":164,"text":"two polyhedra intersect and I ask you find the distance between the two polyhedra yeah it's a","zh":"就是零，你随便指出一个点，然后说怎么会是零，你可能会想，因为这个","start":2422.05,"end":2432.25},{"id":165,"text":"zero and you name any point and you go oh how could it be zero and you go well because this","zh":"向量同时属于两个多面体，而一个向量与自身之间的距离是零，大家明白这个吗？","start":2432.25,"end":2436.65},{"id":166,"text":"one vector is in both polyhedra and the distance between a vector in itself is zero everybody got","zh":"好的，我的意思是这些事情都很简单，对吧？嗯，我们还可以继续讲下去，嗯，你","start":2436.65,"end":2440.73},{"id":167,"text":"this okay so i mean these are simple things right um so you know i we could go on and on uh what","zh":"知道的，","start":2440.73,"end":2448.15},{"id":168,"text":"if i represented you know the polyhedra by a list of its vertices right suppose i have","zh":"如果我用顶点列表来表示多面体，对吧？假设我有","start":2448.15,"end":2454.07},{"id":169,"text":"p hat is the convex hull of v1 up to vn. Now, how do I determine if this intersects that? Any suggestions? It's a different representation, right? So, any suggestions? Is it a convex problem? How would you solve it?","zh":"p hat 是 v1 到 vn 的凸包。现在，我如何确定这两个多面体是否相交？有什么建议吗？这是不同的表示方式，对吧？所以，有什么建议吗？这是一个凸问题吗？你会怎么解决它？","start":2454.84,"end":2483.08},{"id":170,"text":"Yeah, white says your variable precisely right I would make one variable is going to be some theta I VI the theta I are Positive and they sum to one Right, that's my variable theta Right and if I want to if I want to do this I would actually write this Equals X right and then I would also have a X less than B everybody see this and so what that is is","zh":"是的，白色说你的变量非常准确，我会让其中一个变量是某个 theta，其中 theta_i 是正数，并且它们的和为 1。对，这就是我的变量 theta。对了，如果我想这么做，我会实际上写出这个等于 X，然后我也会有 X 小于 B，大家都能看到这一点，这实际上是","start":2485.17,"end":2513.9},{"id":171,"text":"And now I solve that feasibility problem, which is an LP feasibility problem, but really who cares, right? I solve that problem. If this is feasible, then this polyhedron described by its vertices intersects this one described by its inequality constraints, right? If this is not feasible, they don't intersect.","zh":"现在我解决这个可行性问题，这是一个线性规划的可行性问题，但说实话，谁在乎呢？我解决这个问题。如果这是可行的，那么由顶点描述的这个多面体与由不等式约束描述的这个多面体相交，对吧？如果这个不可行，它们就不相交。","start":2514.6,"end":2533.76}],"notes":["本段讲解了如何通过凸优化方法求解两个多面体之间的最小距离问题。首先，问题被转化为一个二次规划（QP）问题，其中目标是最小化两个点之间的欧几里得距离，约束条件是两个多面体的不等式约束。当两个多面体相交时，最小距离为零，此时任取一个点即可。","接着，讲者讨论了如何通过顶点表示法来判断两个多面体是否相交。当多面体由顶点列表表示时，可以通过引入一个凸组合变量θ，使得该变量的和为1，并且每个θ对应一个顶点，从而将顶点表示转换为不等式约束形式。","讲者指出，这种转换后的可行性问题实际上是一个线性规划（LP）问题，可以通过求解该LP来判断两个多面体是否相交。如果该LP可行，则说明两个多面体相交；否则，它们不相交。","此外，讲者强调了凸优化在处理这类几何问题中的简洁性和有效性，指出即使在不同的表示方式下，凸优化方法仍然能够提供清晰的解决方案。","最后，讲者提到，虽然问题本身看似简单，但其背后的数学结构和优化方法仍然值得深入探讨，特别是在处理更复杂的几何形状时。"],"formulas":[{"latex":"minimize \\|x - \\tilde{x}\\|_2","symbols":"最小化两个点之间的欧几里得距离","explanation":"公式正确，表示在两个多面体中寻找点x和\\tilde{x}，使得它们之间的欧几里得距离最小。","evidence":"tilde, and I would minimize simply x minus x tilde."},{"latex":"p = \\text{convex hull}(v_1, \\text{up to } v_n)","symbols":"多面体由顶点的凸包表示","explanation":"公式正确，表示多面体p是顶点v1到vn的凸包。","evidence":"p hat is the convex hull of v1 up to vn. Now, how do I determine if this intersects that? Any suggestions? It's a different representation, right? So, any suggestions? Is it a convex problem? How would you solve it?"}],"uncertainties":["tilde","theta I VI the theta I are Positive","I would make one variable is going to be some theta I VI the theta I are Positive and they sum to one Right, that's my variable theta Right and if I want to if I want to do this I would actually write this Equals X right and then I would also have a X less than B everybody see this and so what that is is"],"diagram":"none","start":2368.27,"end":2533.76,"asr_flags":[],"math_clarifications":["公式1中的\\tilde{x}表示另一个点，但未明确其定义，需在上下文中补充说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":2368.27,"text":"it's an LP feasibility problem. Okay, I'll take it up a notch. Find me the minimum distance"},{"start":2373.19,"text":"between the two polyhedra. Let me explain what that means. It means, find me a point,"},{"start":2382.31,"text":"you know, in one and a point in the other for which the distance is as small as possible."},{"start":2388.69,"text":"What kind of problem is that?"},{"start":2395.53,"text":"Yeah, it's just a QP, right?"},{"start":2399.55,"text":"I would say it's going to be..."},{"start":2401.55,"text":"I would have these constraints, ax less than b, and I would write ax tilde less than b"},{"start":2406.47,"text":"tilde, and I would minimize simply x minus x tilde."},{"start":2411.69,"text":"There."},{"start":2412.51,"text":"Any norm you like, but we'll take two norm."},{"start":2415.59,"text":"Everybody got that?"},{"start":2416.43,"text":"so these are just unbelievably simple problems now right oh and what if the two it what if the"},{"start":2422.05,"text":"two polyhedra intersect and I ask you find the distance between the two polyhedra yeah it's a"},{"start":2432.25,"text":"zero and you name any point and you go oh how could it be zero and you go well because this"},{"start":2436.65,"text":"one vector is in both polyhedra and the distance between a vector in itself is zero everybody got"},{"start":2440.73,"text":"this okay so i mean these are simple things right um so you know i we could go on and on uh what"},{"start":2448.15,"text":"if i represented you know the polyhedra by a list of its vertices right suppose i have"},{"start":2454.84,"text":"p hat is the convex hull of v1 up to vn. Now, how do I determine if this intersects that? Any suggestions? It's a different representation, right? So, any suggestions? Is it a convex problem? How would you solve it?"},{"start":2485.17,"text":"Yeah, white says your variable precisely right I would make one variable is going to be some theta I VI the theta I are Positive and they sum to one Right, that's my variable theta Right and if I want to if I want to do this I would actually write this Equals X right and then I would also have a X less than B everybody see this and so what that is is"},{"start":2514.6,"text":"And now I solve that feasibility problem, which is an LP feasibility problem, but really who cares, right? I solve that problem. If this is feasible, then this polyhedron described by its vertices intersects this one described by its inequality constraints, right? If this is not feasible, they don't intersect."}],"speech_gaps":[],"frame":"../frames/v011/015.webp","frame_time":2380.27},{"title":"最小体积椭球覆盖问题","segments":[{"id":172,"text":"Everything? Anyway, these are very basic ones. You can read about them in the book, but in a way, like at this point in the course, you know enough that these are just almost too simple to even... I mentioned them, right? But that's the idea. We are going to get to ones where...","zh":"所有内容？不管怎样，这些都是非常基础的内容。你可以在书中读到，但某种程度上，在这门课的这个阶段，你已经知道得足够多，以至于这些内容几乎太简单了，甚至……我提到了这些，对吧？但这就是想法。我们将要接触到一些……","start":2535.5,"end":2550.73},{"id":173,"text":"Things are not obvious at all. And that's actually the first topic. These are kind of obvious, right? And you go on and on with different geometrical problems. And, you know, these things obviously come up all the time in things like, you know, robotics. If you want to know if you have a polyhedral, you know, thing, if you have a polyhedral represents a vehicle and then you have a polyhedral safe space or something and you want to know where you anyway, I won't or an obstacle. Right. And you want to know, am I far? What's my distance to the obstacle or something?","zh":"事情一点也不明显。而这实际上是第一个主题。这些内容其实有点明显，对吧？然后你继续探讨各种几何问题。你知道的，这些内容显然在像机器人学这样的领域中经常出现。如果你想知道自己是否有一个多面体，比如一个代表车辆的多面体，然后有一个代表安全区域的多面体，或者你想知道你和障碍物之间的关系，对吧？你想要知道，我离得远吗？我的距离到障碍物是多少？","start":2551.23,"end":2580.11},{"id":174,"text":"Okay, so, all right. So, now we're going to look at ones that are not obvious at all. And these are going to be... I think these are all pretty simple, right? This gets very weird and cool. And it's more than 100 years old. So, here it is. Suppose I have just a set C in Rn, right? And what I want is I want to find the minimum volume ellipsoid that covers it. Okay? So...","zh":"好的，那么现在我们将看看那些完全不明显的内容。这些内容将会是……我想这些都很简单，对吧？这会变得非常奇怪和有趣。而且这已经有一百多年的历史了。所以，这里它来了。假设我有一个集合 C 在 Rn 中，对吧？而我想要的是找到一个最小体积的椭球来覆盖它。明白吗？","start":2580.53,"end":2609.91},{"id":175,"text":"That's, you know, that's got a name. It's called the Loner-John ellipsoid of a set C. And now we're going to show you how to pose that as a convex optimization problem. And this is actually, it's interesting. Now you have to be very careful because there's lots of parameterization of ellipsoids.","zh":"这，你知道的，这有一个名字。它被称为集合 C 的 Loner-John 椭球。现在我们将向你展示如何将这个问题表述为一个凸优化问题。而且这实际上很有趣。你现在必须非常小心，因为椭球有很多参数化方式。","start":2610.4,"end":2631.74},{"id":176,"text":"And for each of these problems, we're actually going to take different parameterizations, because in that parameterization, it's going to be convex, and in another one, it will not be. So you have to be completely on your toes on these things, right? I mean, the truth is we already saw it. We didn't mention it here, but for example, if I ask you to estimate the covariance of a zero-mean Gaussian vector from data,","zh":"对于每一个这样的问题，我们实际上会采用不同的参数化方式，因为在某种参数化方式下，它会是凸的，而在另一种参数化方式下，它就不是。因此，你必须对这些内容保持高度警惕，对吧？我的意思是，事实是，我们已经看到了这一点。我们在这里没有提到，但例如，如果你让我从数据中估计一个零均值高斯向量的协方差，","start":2632.97,"end":2658.25},{"id":177,"text":"Then it turns out the log likelihood is not concave in sigma, the covariance matrix. It is concave in the inverse, which is the precision matrix. So if you know what I'm talking about, fine, and if you don't, that's fine too. So that's a case where there's lots of ways to say what a covariance matrix is. You could give its inverse, you could give it.","zh":"然后你会发现，对数似然函数在协方差矩阵σ上并不是凹函数。它在逆矩阵上是凹函数，也就是精度矩阵。如果你明白我在说什么，那很好；如果你不明白，也没关系。这是一个有多种方式来描述协方差矩阵的例子。你可以给出它的逆矩阵，也可以直接给出它。","start":2659.11,"end":2681.57},{"id":178,"text":"And it's going to turn out some things are convex in one but not the other and so on and so forth, right? And this is similar. So here we go. So we're going to do this. I'm going to write the ellipsoid. I'm going to parameterize it by a matrix A and a vector B. And it's the inverse image of the unit ball under an affine mapping. Okay? Everybody got that here? So that's...","zh":"接下来你会发现，有些东西在一个参数下是凸函数，而在另一个参数下则不是，诸如此类。这和我们之前讨论的情况是类似的。现在我们开始做这个。我要写出这个椭球。我要用一个矩阵A和一个向量B来参数化它。它是仿射映射下单位球的逆像。明白了吗？","start":2682.97,"end":2712.44}],"notes":["本段讲解了最小体积椭球覆盖问题，这是凸优化中的一个重要问题。该问题的目标是找到一个最小体积的椭球，使得给定的集合C完全包含在椭球内。椭球的参数化方式对问题的凸性有重要影响，因此需要选择合适的参数化方式。","在参数化椭球时，不同的参数化方式可能导致问题的凸性不同。例如，对于协方差矩阵的估计问题，对数似然函数在协方差矩阵上不是凹函数，但在其逆矩阵（精度矩阵）上是凹函数。这说明参数化方式的选择对问题的性质有重要影响。","椭球的参数化通常使用一个矩阵A和一个向量B，椭球定义为一个仿射映射下单位球的逆像。这种参数化方式有助于将问题转化为凸优化问题。","在凸优化中，参数化方式的选择至关重要，因为不同的参数化方式可能导致问题的凸性不同。因此，在处理类似问题时，需要仔细选择参数化方式，以确保问题的凸性。","本段还提到，对于协方差矩阵的估计问题，不同的参数化方式（如协方差矩阵或其逆矩阵）会导致不同的凸性性质。这说明在处理实际问题时，需要根据具体情况选择合适的参数化方式。","椭球覆盖问题在机器人学等领域有广泛应用，例如判断机器人是否与障碍物保持安全距离。这表明该问题在实际应用中具有重要意义。"],"formulas":[],"uncertainties":["Loner-John ellipsoid 的拼写可能有误，正确名称应为 Löwner-John ellipsoid"],"diagram":"none","start":2535.5,"end":2712.44,"asr_flags":[],"math_clarifications":["原文未提供具体的数学公式，仅描述了椭球的参数化方式，因此无法核对公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2535.5,"text":"Everything? Anyway, these are very basic ones. You can read about them in the book, but in a way, like at this point in the course, you know enough that these are just almost too simple to even... I mentioned them, right? But that's the idea. We are going to get to ones where..."},{"start":2551.23,"text":"Things are not obvious at all. And that's actually the first topic. These are kind of obvious, right? And you go on and on with different geometrical problems. And, you know, these things obviously come up all the time in things like, you know, robotics. If you want to know if you have a polyhedral, you know, thing, if you have a polyhedral represents a vehicle and then you have a polyhedral safe space or something and you want to know where you anyway, I won't or an obstacle. Right. And you want to know, am I far? What's my distance to the obstacle or something?"},{"start":2580.53,"text":"Okay, so, all right. So, now we're going to look at ones that are not obvious at all. And these are going to be... I think these are all pretty simple, right? This gets very weird and cool. And it's more than 100 years old. So, here it is. Suppose I have just a set C in Rn, right? And what I want is I want to find the minimum volume ellipsoid that covers it. Okay? So..."},{"start":2610.4,"text":"That's, you know, that's got a name. It's called the Loner-John ellipsoid of a set C. And now we're going to show you how to pose that as a convex optimization problem. And this is actually, it's interesting. Now you have to be very careful because there's lots of parameterization of ellipsoids."},{"start":2632.97,"text":"And for each of these problems, we're actually going to take different parameterizations, because in that parameterization, it's going to be convex, and in another one, it will not be. So you have to be completely on your toes on these things, right? I mean, the truth is we already saw it. We didn't mention it here, but for example, if I ask you to estimate the covariance of a zero-mean Gaussian vector from data,"},{"start":2659.11,"text":"Then it turns out the log likelihood is not concave in sigma, the covariance matrix. It is concave in the inverse, which is the precision matrix. So if you know what I'm talking about, fine, and if you don't, that's fine too. So that's a case where there's lots of ways to say what a covariance matrix is. You could give its inverse, you could give it."},{"start":2682.97,"text":"And it's going to turn out some things are convex in one but not the other and so on and so forth, right? And this is similar. So here we go. So we're going to do this. I'm going to write the ellipsoid. I'm going to parameterize it by a matrix A and a vector B. And it's the inverse image of the unit ball under an affine mapping. Okay? Everybody got that here? So that's..."}],"speech_gaps":[],"frame":"../frames/v011/016.webp","frame_time":2547.5},{"title":"椭球参数化与对称性假设","segments":[{"id":179,"text":"That's what it's going to be. Okay. And here, I'm going to say that without loss of generality, I'm going to assume A is symmetric and positive definite. Okay? I mean, okay, so it has to be just positive semi-definite because I want it to be invertible here, right? Otherwise, that's not an ellipsoid. It's got like a, you know, whatever. It's got some infinite. It's a cylinder, I think is what people call it or something like that.","zh":"这就是它将要成为的样子。好的。在这里，我要说，在不丧失一般性的情况下，我假设A是对称且正定的。好的？我的意思是，好的，它必须只是半正定，因为在这里我希望它是可逆的，对吧？否则，那就不是一个椭球了。它会像什么样子呢，你知道的，它会有某种无限延伸的部分。我想人们称之为圆柱体，或者类似的东西。","start":2713.15,"end":2741.82},{"id":180,"text":"Okay, so I would like to know if someone says, yeah, I have a parameterization of ellipsoid with an A and a B, but my A is not symmetric. So I need someone to help me to see why we would say without loss of generality, right? This is a subtlety, right? So, but an important one, right? So I have, it's a set of X for which AX","zh":"好的，我想知道如果有人会说，是的，我有一个用A和B参数化的椭球，但我的A不是对称的。所以我需要有人帮助我理解为什么我们会说在不丧失一般性的情况下，对吧？这是一个微妙的问题，对吧？但这是一个重要的问题，对吧？所以我有，这是一个X的集合，满足AX","start":2742.17,"end":2770.92},{"id":181,"text":"I can't remember, is it plus or minus B? AX plus B, right? Two norm is less than one. Someone gives you this, but A is not symmetric. Or it's not symmetric and positive definite. So A is invertible. So any suggestions on what we can do here? They give you a lower triangular matrix. I don't know what they give. They give you something like that. So what do I do? Any, yeah.","zh":"我记不太清了，是加还是减B？是AX加B，对吧？二范数小于一。有人给你这个，但A不是对称的。或者它不是对称且正定的。A是可逆的。所以对于这种情况，有什么建议吗？他们给你一个下三角矩阵。我不知道他们给了什么。他们给了类似这样的东西。那我该怎么办？有什么建议吗？是的。","start":2771.83,"end":2803.5},{"id":182,"text":"Singular value decomposition. Yeah. Let's write u. Let's say it's u sigma v transpose. Those are all square because it's non-singular. Okay? Does everyone agree that if I took this vector and I put in here an orthogonal matrix, then nothing has changed? I could put a q in front here, which is orthogonal.","zh":"奇异值分解。是的。让我们写成u。让我们说它是u sigma v转置。这些都是方阵，因为它是非奇异的。好的？大家是否同意，如果我取这个向量并在这里放入一个正交矩阵，那么什么都不会改变？我可以在这里放一个q，它是正交的。","start":2804.49,"end":2835.06},{"id":183,"text":"And this constraint is identical because if I rotate something and if I rotate the unit ball, you still have the unit ball. Everybody cool with that? Okay. Can someone suggest a Q I should apply to this? And you want to apply a Q, which is going to have no effect whatsoever on this, but it's going to render this thing. When I multiply by Q on the left, this thing is going to come out positive, definite, and symmetric.","zh":"这个约束条件是相同的，因为如果我旋转某物，并且旋转单位球，你仍然会得到单位球。大家对此都同意吗？好的。有人能建议我应该应用哪个Q吗？你想要应用一个Q，它对这个没有任何影响，但会使这个东西变得对称、正定。当我在左边乘以Q时，这个东西将变得正定且对称。","start":2835.84,"end":2866.4}],"notes":["本段讨论了椭球参数化中矩阵A的对称性假设。讲者指出，为了确保椭球的可逆性，A必须是正定的，而非仅正半定。这是因为如果A不是正定的，那么椭球的形状可能退化为圆柱体或其他非椭球形状。","讲者强调，即使A不是对称的，也可以通过奇异值分解（SVD）将其转换为对称正定矩阵。SVD将矩阵分解为正交矩阵和对角矩阵的乘积，从而保留了原始矩阵的几何特性。","讲者进一步说明，通过应用正交矩阵Q，可以保持约束条件不变，同时使矩阵A变为对称正定形式。这是因为正交变换不会改变向量的长度或形状，因此旋转后的单位球仍然是单位球。","讲者提到，这种变换对于理解椭球的参数化和优化问题非常重要，因为它允许我们假设A是对称正定的，从而简化了问题的分析。","讲者还指出，这种假设并不影响问题的普遍性，因为任何非对称的A都可以通过正交变换转换为对称正定形式，从而保持问题的等价性。","最后，讲者询问听众是否可以建议一个合适的正交矩阵Q，以实现这一转换，这表明课程正在引导学生思考如何应用SVD进行矩阵变换。"],"formulas":[{"latex":"Q^T Q = I","symbols":"正交矩阵Q的性质","explanation":"该公式正确描述了正交矩阵Q的性质，即其转置乘以自身等于单位矩阵。","evidence":"Singular value decomposition. Yeah. Let's write u. Let's say it's u sigma v transpose. Those are all square because it's non-singular. Okay? Does everyone agree that if I took this vector and I put in here an orthogonal matrix, then nothing has changed? I could put a q in front here, which is orthogonal."}],"uncertainties":[],"diagram":"none","start":2713.15,"end":2866.4,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的上下文来验证AX + B和Q^T A Q的数学性质或条件，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2713.15,"text":"That's what it's going to be. Okay. And here, I'm going to say that without loss of generality, I'm going to assume A is symmetric and positive definite. Okay? I mean, okay, so it has to be just positive semi-definite because I want it to be invertible here, right? Otherwise, that's not an ellipsoid. It's got like a, you know, whatever. It's got some infinite. It's a cylinder, I think is what people call it or something like that."},{"start":2742.17,"text":"Okay, so I would like to know if someone says, yeah, I have a parameterization of ellipsoid with an A and a B, but my A is not symmetric. So I need someone to help me to see why we would say without loss of generality, right? This is a subtlety, right? So, but an important one, right? So I have, it's a set of X for which AX,"},{"start":2771.83,"text":"I can't remember, is it plus or minus B? AX plus B, right? Two norm is less than one. Someone gives you this, but A is not symmetric. Or it's not symmetric and positive definite. So A is invertible. So any suggestions on what we can do here? They give you a lower triangular matrix. I don't know what they give. They give you something like that. So what do I do? Any, yeah."},{"start":2804.49,"text":"Singular value decomposition. Yeah. Let's write u. Let's say it's u sigma v transpose. Those are all square because it's non-singular. Okay? Does everyone agree that if I took this vector and I put in here an orthogonal matrix, then nothing has changed? I could put a q in front here, which is orthogonal."},{"start":2835.84,"text":"And this constraint is identical because if I rotate something and if I rotate the unit ball, you still have the unit ball. Everybody cool with that? Okay. Can someone suggest a Q I should apply to this? And you want to apply a Q, which is going to have no effect whatsoever on this, but it's going to render this thing. When I multiply by Q on the left, this thing is going to come out positive, definite, and symmetric."}],"speech_gaps":[],"frame":"../frames/v011/017.webp","frame_time":2725.15},{"title":"椭球体积与约束条件","segments":[{"id":184,"text":"I'm open to suggestions for what Q is. V U transpose. Yeah, there you go. Q equals V U transpose. That's orthogonal. These are both orthogonal. These are orthogonal. So if I plug that in there, then A is now going to be V sigma V transpose, which is symmetric and positive definite. Everybody got this? Okay, so this is, it's a subtlety, but it's actually going to be super important. Okay, and then it says the following.","zh":"我接受关于Q的建议。V乘以U的转置。对，就是这样。Q等于V乘以U的转置。这是正交的。这两个都是正交的。所以如果我把这个代入，那么A现在将变为V乘以σ乘以V的转置，这是对称且正定的。大家明白了吗？好的，这是一个微妙之处，但实际上这将非常重要。好的，然后它说接下来的内容。","start":2867.98,"end":2898.65},{"id":185,"text":"Oh, with this parameterization, the volume is proportional to the determinant of A inverse, right? And you can figure that out, right? If A gets big, then the ellipsoid gets small, right? You can kind of see that, right? And so the volume is proportional to det A inverse. And in fact, I think...","zh":"哦，使用这种参数化方式，体积与A的逆的行列式成比例，对吧？你可以推导出这一点，对吧？如果A变得很大，那么椭球就会变小，对吧？你可以大致看出这一点，对吧？因此体积与det A逆成比例。事实上，我想……","start":2899.29,"end":2919.51},{"id":186,"text":"The proportionality constant is this magic number, which is the volume of a unit ball in Rn, which has some gamma functions and probably some pi's in it and other stuff. It doesn't matter. It's a positive constant for us. So this thing is going to... This is the same as minimizing the volume of E.","zh":"比例常数是这个神奇的数字，它是Rn中单位球的体积，其中包含一些伽马函数和可能的π以及其他内容。这对我们来说并不重要。它是一个正的常数。因此，这个量将……这等同于最小化椭球E的体积。","start":2919.93,"end":2944.55},{"id":187,"text":"Then the other thing we have is we have to have that every element of C has to be in this ellipsoid. And the way to express that is this. It says that if you maximize over C, A, V plus B, right, in two norm, if that's more than one, then you're not in E. If it's less than or equal to one, you're in E. Everybody got that?","zh":"我们还必须确保C中的每个元素都位于这个椭球内。表达方式是这样的。它说如果你在两个范数下最大化C、A、V加上B，如果结果大于1，那么你就不在E中；如果结果小于或等于1，那么你就位于E中。大家明白了吗？","start":2946.11,"end":2970.71},{"id":188,"text":"And now we have to stare at this and you really have to concentrate. Let me give you a couple of the warnings about why you have to concentrate now. Because the variables in this problem are capital A and little b. I mean, the usual convention is that a, b, c, d are like data. They're constant, right? And the usual convention is the variables are things like u, v, x, y, z. Everybody following this? That's usually, right? But here...","zh":"现在我们必须仔细审视这一点，你真的需要集中注意力。让我给你们几个警告，说明为什么你现在需要集中注意力。因为这个问题中的变量是大写的A和小写的b。通常的惯例是，a、b、c、d等像数据一样，是常数，对吧？而通常的惯例是变量是像u、v、x、y、z这样的。大家跟上了吗？这通常是，对吧？但在这里……","start":2971.22,"end":2999.7},{"id":189,"text":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?","zh":"好吧，v是一个哑变量，所以它没有任何意义，对吧？但在这里，我们必须问，这个东西，以及a当然是对称正定的。这是凸的对数行列式，a的逆。这个约束对a来说是什么样的约束？我的意思是，它是凸的。为什么？如果我固定了v，那么对于a来说，这个函数是什么样的？","start":3000.03,"end":3029.88}],"notes":["本段讨论了在参数化下，椭球体积与矩阵A的行列式倒数成正比。当A增大时，椭球体积减小，这与矩阵的逆的行列式有关。比例常数是单位球体在R^n中的体积，包含伽马函数和π等，但对问题本身并不重要，只需知道它是一个正数常量。","接下来，课程强调了约束条件：所有C中的元素必须位于椭球内。通过最大化C、A、V加上B的二范数，若结果大于1，则元素不在椭球内；若小于等于1，则在椭球内。这为椭球约束提供了数学表达。","课程提醒学生注意变量的区分：通常a、b、c、d是数据（常数），而u、v、x、y、z是变量。但在本问题中，变量是A和b，这与常规不同，需要特别注意。","v被描述为哑变量，对问题没有实际意义。但课程指出，a必须是对称正定矩阵，且目标函数是凸的log行列式，这需要进一步分析其约束条件。","最后，课程提到，当固定v时，关于a的函数是凸的，这与a的对称正定性有关。这为后续的优化问题提供了理论基础。","整个段落强调了椭球体积的最小化与约束条件的结合，是凸优化问题中的关键部分，需要学生仔细理解变量和约束的定义。"],"formulas":[{"latex":"vol(E) \\text{ is proportional to } \\det(A^{-1})","symbols":"体积与矩阵A的行列式倒数成正比","explanation":"公式正确，体积与矩阵A的行列式倒数成正比，符合椭球体积的数学性质。","evidence":"Oh, with this parameterization, the volume is proportional to the determinant of A inverse, right? And you can figure that out, right? If A gets big, then the ellipsoid gets small, right? You can kind of see that, right? And so the volume is proportional to debt A inverse. And in fact, I think..."},{"latex":"x \\text{ is in } E \\text{ if } \\max_{c \\in C} \\|A v + B\\| \\leq 1","symbols":"元素在椭球内当且仅当其二范数最大值小于等于1","explanation":"公式正确，椭球内的条件是所有元素的二范数最大值小于等于1，符合椭球的定义。","evidence":"Then the other thing we have is we have to have that every element of C has to be in this ellipsoid. And the way to express that is this. It says that if you maximize over C, A, V plus B, right, in two norm, if that's more than one, then you're not in E. If it's less than or equal to one, you're in E. Everybody got that?"},{"latex":"A \\text{ is symmetric positive definite}","symbols":"矩阵A是对称正定的","explanation":"公式正确，矩阵A是对称正定的，符合椭球的定义和后续计算的需要。","evidence":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?"},{"latex":"f(a) = \\log \\det(A^{-1}) \\text{ is convex in } a","symbols":"关于a的log行列式函数是凸函数","explanation":"公式正确，log行列式函数在对称正定矩阵上是凸函数，符合凸优化的性质。","evidence":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?"}],"uncertainties":["det A inverse"],"diagram":"none","start":2867.98,"end":3029.88,"asr_flags":[],"math_clarifications":["公式中的'vol(E)'表示椭球E的体积，'det(A^{-1})'表示矩阵A的行列式倒数，'\\max_{c \\in C} \\|A v + B\\| \\leq 1'表示所有元素在椭球内，'A'是对称正定矩阵，'f(a) = \\log \\det(A^{-1})'是凸函数。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2867.98,"text":"I'm open to suggestions for what Q is. V U transpose. Yeah, there you go. Q equals V U transpose. That's orthogonal. These are both orthogonal. These are orthogonal. So if I plug that in there, then A is now going to be V sigma V transpose, which is symmetric and positive definite. Everybody got this? Okay, so this is, it's a subtlety, but it's actually going to be super important. Okay, and then it says the following."},{"start":2899.29,"text":"Oh, with this parameterization, the volume is proportional to the determinant of A inverse, right? And you can figure that out, right? If A gets big, then the ellipsoid gets small, right? You can kind of see that, right? And so the volume is proportional to debt A inverse. And in fact, I think..."},{"start":2919.93,"text":"The proportionality constant is this magic number, which is the volume of a unit ball in Rn, which has some gamma functions and probably some pi's in it and other stuff. It doesn't matter. It's a positive constant for us. So this thing is going to... This is the same as minimizing the volume of E."},{"start":2946.11,"text":"Then the other thing we have is we have to have that every element of C has to be in this ellipsoid. And the way to express that is this. It says that if you maximize over C, A, V plus B, right, in two norm, if that's more than one, then you're not in E. If it's less than or equal to one, you're in E. Everybody got that?"},{"start":2971.22,"text":"And now we have to stare at this and you really have to concentrate. Let me give you a couple of the warnings about why you have to concentrate now. Because the variables in this problem are capital A and little b. I mean, the usual convention is that a, b, c, d are like data. They're constant, right? And the usual convention is the variables are things like u, v, x, y, z. Everybody following this? That's usually, right? But here..."},{"start":3000.03,"text":"Well, v is a dummy variable, so it means absolutely nothing, right? But here, so we have to ask, you know, is this thing, and a is, of course, symmetric positive definite. This is convex log determinant, a inverse. What kind of constraint is this over a? I mean, it's convex. Why? Because if I fix a v, what kind of function is that of a?"}],"speech_gaps":[],"frame":"../frames/v011/018.webp","frame_time":2879.98},{"title":"凸优化中的椭球覆盖问题与异常值检测","segments":[{"id":190,"text":"For a fixed V. It's convex. In A and B. Sorry, it's jointly in A and B. It's convex. Matter of fact, the argument here, A, V plus B, is a linear function of the pair A, B, right? Not even affine. It's just linear, right? And so this thing, for a fixed V, is a convex function of the pair A, B. That's a supremum. Doesn't matter what C is.","zh":"对于固定的 V，它是凸的。在 A 和 B 中。抱歉，它实际上是联合在 A 和 B 中。它是凸的。实际上，这里的论点，A、V 加上 B，是 A 和 B 这对变量的线性函数，对吧？甚至不是仿射函数。它只是线性的，对吧？因此，对于固定的 V，这个函数是 A 和 B 这对变量的凸函数。这是一个上确界。不管 C 是什么都没有关系。","start":3031.13,"end":3059.58},{"id":191,"text":"This left-hand side is a convex function here. So that's a convex function, and it's less than or equal to 1. So this is a convex optimization problem. So this is how you would minimize the volume of an ellipsoid that covers a given set C. Now, we have to turn this into something reasonable, something that we can handle, and we'll do that. Here's a super simple example, a finite set.","zh":"左边这个是凸函数。因此，这是一个凸函数，并且它小于或等于 1。因此，这是一个凸优化问题。这就是如何最小化覆盖给定集合 C 的椭球的体积。现在，我们必须将这个问题转化为一个合理的问题，一个我们可以处理的问题，我们将会这样做。这里有一个超级简单的例子，一个有限集合。","start":3060.12,"end":3091.01},{"id":192,"text":"and you have m points, and you end up with a completely reasonable thing. It just looks like that, and that's a convex problem. You can solve it, and you just get, it just works, right? It just gives you the minimum volume ellipsoid. So if I give you a bunch of points, by the way, that has a whole lot of applications. I'll just mention one for fun, right? So here's a bunch of points.","zh":"你有 m 个点，最终你会得到一个完全合理的结果。它看起来就是这样，而且这是一个凸问题。你可以解决它，它会直接起作用，对吧？它会直接给你最小体积的椭球。顺便说一下，如果你给我一堆点，它有很多应用。我随便提一个，对吧？这里是一堆点。","start":3091.6,"end":3120.87},{"id":193,"text":"like that, right? And then you, oh God, I don't know what I'm going to do here. Okay, so then you get some ellipsoid that looks like that, right? And that's going to be the minimum volume ellipsoid that covers those points. Everybody following this? So here's actually an interesting way to, suppose these are like, not in two dimensions, it's silly, but suppose it's in high dimensions.","zh":"像这样，对吧？然后你，天啊，我不知道我要在这里做什么。好吧，那么你会得到一个看起来像这样的椭球，对吧？这将是覆盖这些点的最小体积椭球。大家跟上了吗？这里其实有一种有趣的方法，假设这些点不在二维空间中，这很无聊，但假设它是在高维空间中。","start":3122.15,"end":3146.92},{"id":194,"text":"And I want to ask, which of my data points here are like outliers? Just like that. I don't have a statistical model, although that would be a reasonable way. So what would be some reasonable ways to say something is an outlier? It's close to the edge of an absolute. It's what? It's close to the edge. Oh, no, I haven't computed this yet. Let's just do, like, how would you do it otherwise? Well, you could actually find the mean. Here, here's one. You could find the mean and the covariance of the data points.","zh":"我想问，我的这些数据点中，哪些像是异常值？就像这样。我没有统计模型，尽管这会是一个合理的方法。那么，有什么合理的方式来定义一个点是异常值吗？它接近绝对边缘。它是？它接近边缘。哦，不，我还没有计算这个。让我们想想，否则你会怎么做？实际上，你可以计算均值。这里有一个方法。你可以计算数据点的均值和协方差。","start":3148.31,"end":3179.86},{"id":195,"text":"And then you'd look at the so-called Mahalanobis distance or something from the center. That would be a reasonable way. Or you could look and just say, well, which of your points are really big? Those are outliers. This is actually a quite good one. It's entirely dependent on the outliers. Because you can kind of see that if you shrink an ellipsoid down, it's going to stop when actually generically n, n plus 1 over 2.","zh":"然后你会查看所谓的马哈拉诺比斯距离，或者从中心到各个点的距离。这会是一个合理的方法。或者你也可以直接观察，问自己：哪些点特别大？这些就是异常值。这实际上是一个相当不错的方法。它完全依赖于异常值。因为你可以看出，当你把一个椭球缩小的时候，它会在一般情况下停止于n，n加1除以2的位置。","start":3180.46,"end":3209.87}],"notes":["本段讲解了如何通过凸优化问题最小化覆盖给定集合C的椭球体积。首先，讲者指出对于固定的V，函数在A和B上是凸的，因为A和V加上B是A和B的线性函数，因此整体是凸函数。接着，讲者提到这是一个凸优化问题，并指出需要将问题转化为可处理的形式，例如使用有限集合的例子。","讲者以有限集合为例，说明如何通过凸优化问题求解最小体积椭球。讲者提到，这种方法在实际中有很多应用，例如检测异常值。讲者还提到，当数据点处于高维空间时，如何判断哪些点是异常值的问题。","讲者讨论了异常值检测的几种方法，包括计算数据点的均值和协方差，然后使用马氏距离来判断异常值。此外，讲者还提到，可以通过观察数据点的大小来判断异常值，这种方法虽然简单，但依赖于数据的分布特性。","讲者指出，当椭球缩小到一定程度时，会停止在某个特定的点，这与数据点的维度有关。讲者提到，这种停止点通常与数据点的维度n和n+1/2有关，但具体细节需要进一步分析。","讲者强调，异常值检测的方法需要根据具体问题选择，例如是否使用统计模型或直接基于数据点的大小。讲者还提到，马氏距离是一种合理的检测方法，因为它考虑了数据的协方差结构。","讲者最后指出，异常值检测的问题在高维空间中尤为复杂，因为数据点的分布可能更加稀疏，需要更精细的分析方法。"],"formulas":[{"latex":"\\text{Mahalanobis distance}","symbols":"马氏距离","explanation":"马氏距离是已知的统计学概念，无需修改，保留。","evidence":"And I want to ask, which of my data points here are like outliers? Just like that. I don't have a statistical model, although that would be a reasonable way. So what would be some reasonable ways to say something is an outlier? It's close to the edge of an absolute. It's what? It's close to the edge. Oh, no, I haven't computed this yet. Let's just do, like, how would you do it otherwise? Well, you could actually find the mean. Here, here's one. You could find the mean and the covariance of the data points."}],"uncertainties":["n, n plus 1 over 2"],"diagram":"none","start":3031.13,"end":3209.87,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的数学定义或公式来支持E_min和A, V + B的数学表达，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3031.13,"text":"For a fixed V. It's convex. In A and B. Sorry, it's jointly in A and B. It's convex. Matter of fact, the argument here, A, V plus B, is a linear function of the pair A, B, right? Not even affine. It's just linear, right? And so this thing, for a fixed V, is a convex function of the pair A, B. That's a supremum. Doesn't matter what C is."},{"start":3060.12,"text":"This left-hand side is a convex function here. So that's a convex function, and it's less than or equal to 1. So this is a convex optimization problem. So this is how you would minimize the volume of an ellipsoid that covers a given set C. Now, we have to turn this into something reasonable, something that we can handle, and we'll do that. Here's a super simple example, a finite set."},{"start":3091.6,"text":"and you have m points, and you end up with a completely reasonable thing. It just looks like that, and that's a convex problem. You can solve it, and you just get, it just works, right? It just gives you the minimum volume ellipsoid. So if I give you a bunch of points, by the way, that has a whole lot of applications. I'll just mention one for fun, right? So here's a bunch of points."},{"start":3122.15,"text":"like that, right? And then you, oh God, I don't know what I'm going to do here. Okay, so then you get some ellipsoid that looks like that, right? And that's going to be the minimum volume ellipsoid that covers those points. Everybody following this? So here's actually an interesting way to, suppose these are like, not in two dimensions, it's silly, but suppose it's in high dimensions."},{"start":3148.31,"text":"And I want to ask, which of my data points here are like outliers? Just like that. I don't have a statistical model, although that would be a reasonable way. So what would be some reasonable ways to say something is an outlier? It's close to the edge of an absolute. It's what? It's close to the edge. Oh, no, I haven't computed this yet. Let's just do, like, how would you do it otherwise? Well, you could actually find the mean. Here, here's one. You could find the mean and the covariance of the data points."},{"start":3180.46,"text":"And then you'd look at the so-called Mahalanobis distance or something from the center. That would be a reasonable way. Or you could look and just say, well, which of your points are really big? Those are outliers. This is actually a quite good one. It's entirely dependent on the outliers. Because you can kind of see that if you shrink an ellipsoid down, it's going to stop when actually generically n, n plus 1 over 2."}],"speech_gaps":[],"frame":"../frames/v011/019.webp","frame_time":3043.13},{"title":"椭球剥皮法与异常值检测","segments":[{"id":196,"text":"But if that's the dimension, points are on that ellipsoid, right? So there's a method for removing outliers called ellipsoidal peeling. First of all, it's a great name, and it's also a pretty good method. And it works like this. You say thanks for the data, you find the minimum volume ellipsoid, and you find the points that it touches, right? Those are the ones for which this constraint here is equal to 1, okay?","zh":"但如果这是维度，那么这些点就在这个椭球上，对吧？因此，有一种称为椭球剥皮的异常值检测方法。首先，这是一个很棒的名字，也是一种相当好的方法。它的工作原理如下：你感谢数据，找到最小体积椭球，并找到它接触的点，对吧？这些点就是满足此处约束等于1的点，好吗？","start":3210.32,"end":3239.06},{"id":197,"text":"Then you declare those to be outliers and you remove them and you continue until you like what happens. Like, for example, you're out of sample, whatever. If you have some other test you can check, your estimator gets better or something like that. Everybody following this? Okay. That is very cool. Okay. Let me ask one question just for fun. Suppose that you do that.","zh":"然后你声明这些点为异常值并移除它们，继续直到你满意结果。例如，你可能在样本外，或者你有其他测试可以检查，你的估计器会变得更好，或者其他类似的情况。大家跟上了吗？好的。这非常酷。好的。让我随便问一个问题。假设你这样做。","start":3239.8,"end":3265.13},{"id":198,"text":"and I have hundreds and hundreds of points, but let's say that 25 satisfy this with equality. Everybody following this? 25. And you'd say, I'm going to remove them. There's 25 outliers. Then someone says, please don't. You go, why? Because, look, there's no way we have 25 outliers. We actually only have five. Or I couldn't imagine it being more than five. Everybody following this? Could someone please suggest how you might choose the candidates to remove?","zh":"我有成百上千的点，但假设其中25个满足等式。大家跟上了吗？25个。你会说，我要移除它们。这里有25个异常值。然后有人会说，请不要这样做。你回答，为什么？因为，看，我们不可能有25个异常值。我们实际上只有5个。或者我无法想象会超过5个。大家跟上了吗？谁能建议一下如何选择要移除的候选点？","start":3265.69,"end":3295.17},{"id":199,"text":"Sounds like a trick question. It's actually not, and it tells you if you can use the material we've looked at. I compute the minimum volume. Let's review. I have a whole bunch of vectors. I compute a minimum volume ellipsoid. Let's say 22 of the points are actually on that minimum volume ellipsoid, meaning that constraint is tight for 22. I say, take them all out. And they go, no, you're throwing away too much of my data.","zh":"这听起来像是一个陷阱问题。实际上并不是，它也告诉你你是否能使用我们已经学习过的材料。我计算最小体积椭球。让我们回顾一下。我有一组向量，我计算最小体积椭球。假设其中22个点实际上在该最小体积椭球上，意味着有22个点的约束是紧的。我会说，把它们全部移除。他们则会说，不，你丢弃了太多我的数据。","start":3297.53,"end":3327.11},{"id":200,"text":"Yeah, but what's the far edge of an ellipsoid? No, I don't think that works, right? Was there another suggestion? Maximize the difference in the volume from the original to when you remove five of the points? Yeah, something like that might happen. Was there another suggestion?","zh":"是的，但椭球的远端是什么？不，我不认为那样可行，对吧？有没有其他建议？最大化从原始体积到移除五个点后的体积之差？是的，类似这样的事情可能会发生。有没有其他建议？","start":3334.04,"end":3355.8},{"id":201,"text":"Yeah? Randomly throw out. Okay, that would be fine. How about you say, here, ellipsoidal peeling says that the first, these 20 are bad. And they go, they say, no, no, no, I can only have, I can't imagine having more than five outliers. And you go, cool. And you just remove the first five. Is that your suggestion? Okay. No, I like it. That's a good street fighting thing, you know. I mean, you don't say it like that to the person. You just go, hang on a minute. And you go back and you pretend to.","zh":"嗯？随机剔除。好的，这样也可以。那你说，这里椭球剥皮法指出，前20个是坏的。他们回应说，不，不，不，我只能有，我无法想象有超过五个异常值。你回应说，很好。然后你只是剔除前五个。这是你的建议吗？好的。不，我喜欢这个。这是一种很好的街头应对方式，你知道吗。我的意思是，你不会这样直接对那个人说。你只是说，等一下。然后你回去，假装一下。","start":3357.74,"end":3384.62}],"notes":["本段讲解了椭球剥皮法（ellipsoidal peeling）用于异常值检测的基本思想。该方法通过计算最小体积椭球，找到与椭球表面接触的点，这些点被认为是异常值。然而，这种方法在实际应用中可能遇到问题，例如当实际异常值数量远少于椭球表面接触点数量时，直接移除所有接触点会导致数据丢失过多。","讲者通过一个具体例子说明了这一问题：假设25个点满足椭球约束的等式，但实际只有5个是异常值。此时，直接移除25个点显然不合理，因此需要一种更合理的策略来选择异常值。","讲者询问听众如何选择异常值候选点，提出了几种可能的策略，包括最大化移除部分点后椭球体积的变化、随机移除等。这些策略反映了在实际应用中如何平衡异常值检测的准确性与数据保留的完整性。","讲者还提到，椭球剥皮法在实际应用中可能需要结合其他方法，例如通过迭代过程逐步移除异常值，直到满足某种停止条件（如数据质量提升）。这种方法在处理高维数据时可能面临计算复杂度高的问题。","此外，讲者强调了在实际应用中，异常值检测需要结合领域知识和数据特性，不能仅依赖数学方法。例如，当数据中存在少量异常值时，直接移除所有接触椭球表面的点可能并不合理。","最后，讲者以一种幽默的方式总结了椭球剥皮法的局限性，并指出在实际应用中需要灵活处理，例如通过逐步移除异常值或结合其他方法来提高检测效果。"],"formulas":[],"uncertainties":[],"diagram":"ellipsoid","start":3210.32,"end":3384.62,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3210.32,"text":"But if that's the dimension, points are on that ellipsoid, right? So there's a method for removing outliers called ellipsoidal peeling. First of all, it's a great name, and it's also a pretty good method. And it works like this. You say thanks for the data, you find the minimum volume ellipsoid, and you find the points that it touches, right? Those are the ones for which this constraint here is equal to 1, okay?"},{"start":3239.8,"text":"Then you declare those to be outliers and you remove them and you continue until you like what happens. Like, for example, you're out of sample, whatever. If you have some other test you can check, your estimator gets better or something like that. Everybody following this? Okay. That is very cool. Okay. Let me ask one question just for fun. Suppose that you do that."},{"start":3265.69,"text":"and I have hundreds and hundreds of points, but let's say that 25 satisfy this with equality. Everybody following this? 25. And you'd say, I'm going to remove them. There's 25 outliers. Then someone says, please don't. You go, why? Because, look, there's no way we have 25 outliers. We actually only have five. Or I couldn't imagine it being more than five. Everybody following this? Could someone please suggest how you might choose the candidates to remove?"},{"start":3297.53,"text":"Sounds like a trick question. It's actually not, and it tells you if you can use the material we've looked at. I compute the minimum volume. Let's review. I have a whole bunch of vectors. I compute a minimum volume ellipsoid. Let's say 22 of the points are actually on that minimum volume ellipsoid, meaning that constraint is tight for 22. I say, take them all out. And they go, no, you're throwing away too much of my data."},{"start":3334.04,"text":"Yeah, but what's the far edge of an ellipsoid? No, I don't think that works, right? Was there another suggestion? Maximize the difference in the volume from the original to when you remove five of the points? Yeah, something like that might happen. Was there another suggestion?"},{"start":3357.74,"text":"Yeah? Randomly throw out. Okay, that would be fine. How about you say, here, ellipsoidal peeling says that the first, these 20 are bad. And they go, they say, no, no, no, I can only have, I can't imagine having more than five outliers. And you go, cool. And you just remove the first five. Is that your suggestion? Okay. No, I like it. That's a good street fighting thing, you know. I mean, you don't say it like that to the person. You just go, hang on a minute. And you go back and you pretend to."}],"speech_gaps":[],"frame":"../frames/v011/020.webp","frame_time":3222.32},{"title":"对偶性与椭球体覆盖问题","segments":[{"id":202,"text":"change the code and stuff like that. Okay. And then you do that. Okay. That was another suggestion somewhere. All right. Let me try one more time. Yeah. To see if I can elicit a response. Okay. I have 20 constraints that are tight. I would like to remove five. In fact, I'll even, do I even have to say, I'll even say I want to remove the five tightest constraints. How about that? Please. What?","zh":"修改代码和其他类似的事情。好的。然后你这么做。好的。这是另一个建议，之前提到过。好的。让我再试一次。是的。看看能不能得到一个回应。好的。我有20个紧约束。我想移除五个。事实上，我甚至会说，我想要移除五个最紧的约束。怎么样？请。什么？","start":3385.5,"end":3416.63},{"id":203,"text":"Oh, there we go. Okay, fine. You get the dual variables, which you get for free. And then you remove the 5 with the 5 largest dual variables. Everybody cool? That's pretty sophisticated. I mean, we're just putting ideas from the class together. But things like this are actually kind of useful. Actually, that was a good question because it's the ones we like.","zh":"哦，明白了。好的，行吧。你会得到对偶变量，这是免费提供的。然后你移除五个对偶变量最大的。大家都明白吗？这相当 sophisticated（复杂）。我是说，我们只是把课堂上的想法组合在一起。但像这样的事情实际上还挺有用的。实际上，这是一个好问题，因为正是我们喜欢的那些。","start":3417.78,"end":3444.1},{"id":204,"text":"I didn't say the D word, which is duality. But that was a question about duality. So what we want is we want you to have a street fighting knowledge of duality because it never, ever works when someone comes and says, oh, help me, help me, I have a dual. And you're like, no, it doesn't work that. The way it always works is somebody has some long, complicated problem and they need a suggestion and they don't even know what duality is. So, okay. Everyone, cool? That was just an aside, but it was fun for me anyway. So, okay.","zh":"我没有说‘对偶性’这个词，也就是 duality。但这是一个关于对偶性的问题。所以我们想要的是，你们对对偶性要有街头斗士般的知识，因为当有人跑来求助说，哦，帮帮我，帮帮我，我有一个对偶问题时，它从不奏效。而它总是这样运作：有人有一个很长很复杂的问题，需要一些建议，甚至不知道对偶性是什么。好的。大家明白吗？这只是个插曲，但对我来说挺有趣的。好的。","start":3445.91,"end":3474.83},{"id":205,"text":"Okay, so this gives you the minimum volume ellipsoid. Okay, so then you can say, okay, fine. Can we do, oh, let me just ask, I'm going to go back and show. So you say, that's cool, you can do a minimum volume ellipsoid around a point, and then you might innocently ask, well, that's cool. By the way, this is the minimum volume ellipsoid that covers a polyhedron.","zh":"好的，这给出了最小体积椭球体。好的，那么你可以这么说，好的。我们能不能做，哦，让我先问一下，我要回去展示。你说，这很酷，你可以做一个围绕一个点的最小体积椭球体，然后你可能会天真地问，嗯，这很酷。顺便说一句，这就是覆盖一个由顶点定义的多面体的最小体积椭球体。","start":3475.75,"end":3502.09},{"id":206,"text":"given by its vertices. So that's the same problem, you agree? So if someone walks up to you on the street and says, find the minimum volume ellipsoid that covers a polyhedron described by its vertices, then that's also, we can do that. It's a simple convex problem. Cool? But now someone says, oh yeah, you know what though, my ellipsoid is described by, not vertices, but it looks like this.","zh":"由其顶点给出。所以这是同一个问题，你们同意吗？如果有人在街上走过来对你说，找到一个覆盖由顶点定义的多面体的最小体积椭球体，那么这也是我们可以做到的。这是一个简单的凸问题。明白吗？但现在有人会说，哦，对了，你知道吗，我的椭球体不是由顶点定义的，而是看起来像这样。","start":3503.43,"end":3530.42},{"id":207,"text":"Here's my ellipsoid. It's described by a set of linear inequalities. And we want to find the minimum volume ellipsoid that covers a polyhedron described by its faces. Everybody cool on this? Okay. It sounds reasonable. Actually, someone give a simple... What would be one way to do it? What would you do?","zh":"这里是我的椭球体。它由一组线性不等式描述。我们想要找到一个最小体积的椭球体，使其覆盖由其面描述的多面体。大家对这个理解吗？好的。听起来合理。实际上，有人能给出一个简单的…… 有什么方法可以做到这一点吗？你会怎么做？","start":3531.43,"end":3562.87}],"notes":["本段讲授了对偶性在优化问题中的应用，特别是如何通过识别对偶变量来移除约束。讲者提到，当有多个紧约束时，可以通过对偶变量的大小来判断哪些约束可以被移除，从而简化问题。这种做法体现了对偶性在实际问题中的实用性。","讲者强调了对偶性在实际问题中的重要性，指出在面对复杂问题时，对偶性可以提供有效的解决思路。讲者提到，即使没有明确提到对偶性（D word），但问题本身仍然涉及对偶性，这说明对偶性是解决实际问题的重要工具。","讲者进一步讨论了椭球体覆盖问题，指出最小体积椭球体可以覆盖由顶点描述的多面体，也可以覆盖由面描述的多面体。这说明了椭球体覆盖问题的通用性，无论多面体是通过顶点还是面来描述。","讲者通过提问引导学生思考如何解决椭球体覆盖问题，特别是当椭球体由线性不等式描述时，如何找到最小体积的椭球体覆盖多面体。这表明了问题的复杂性和需要进一步探索的可能方法。","讲者提到，椭球体覆盖问题是一个简单的凸优化问题，这说明了凸优化在解决实际问题中的有效性。同时，讲者也指出，当椭球体由面描述时，问题的解决方法可能需要不同的策略。","讲者通过举例说明了椭球体覆盖问题的不同情况，包括由顶点和由面描述的多面体。这表明了问题的多样性，以及需要根据具体情况选择合适的解决方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3385.5,"end":3562.87,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3385.5,"text":"change the code and stuff like that. Okay. And then you do that. Okay. That was another suggestion somewhere. All right. Let me try one more time. Yeah. To see if I can elicit a response. Okay. I have 20 constraints that are tight. I would like to remove five. In fact, I'll even, do I even have to say, I'll even say I want to remove the five tightest constraints. How about that? Please. What?"},{"start":3417.78,"text":"Oh, there we go. Okay, fine. You get the dual variables, which you get for free. And then you remove the 5 with the 5 largest dual variables. Everybody cool? That's pretty sophisticated. I mean, we're just putting ideas from the class together. But things like this are actually kind of useful. Actually, that was a good question because it's the ones we like."},{"start":3445.91,"text":"I didn't say the D word, which is duality. But that was a question about duality. So what we want is we want you to have a street fighting knowledge of duality because it never, ever works when someone comes and says, oh, help me, help me, I have a dual. And you're like, no, it doesn't work that. The way it always works is somebody has some long, complicated problem and they need a suggestion and they don't even know what duality is. So, okay. Everyone, cool? That was just an aside, but it was fun for me anyway. So, okay."},{"start":3475.75,"text":"Okay, so this gives you the minimum volume ellipsoid. Okay, so then you can say, okay, fine. Can we do, oh, let me just ask, I'm going to go back and show. So you say, that's cool, you can do a minimum volume ellipsoid around a point, and then you might innocently ask, well, that's cool. By the way, this is the minimum volume ellipsoid that covers a polyhedron."},{"start":3503.43,"text":"given by its vertices. So that's the same problem, you agree? So if someone walks up to you on the street and says, find the minimum volume ellipsoid that covers a polyhedron described by its vertices, then that's also, we can do that. It's a simple convex problem. Cool? But now someone says, oh yeah, you know what though, my ellipsoid is described by, not vertices, but it looks like this."},{"start":3531.43,"text":"Here's my ellipsoid. It's described by a set of linear inequalities. And we want to find the minimum volume ellipsoid that covers a polyhedron described by its faces. Everybody cool on this? Okay. It sounds reasonable. Actually, someone give a simple... What would be one way to do it? What would you do?"}],"speech_gaps":[],"frame":"../frames/v011/021.webp","frame_time":3397.5},{"title":"凸优化中的椭球覆盖与NP难问题","segments":[{"id":208,"text":"in the intersection of all the inequalities in them. Yeah, so you would basically, you'd first write a method that called, you know, faces to vertices, right? And you'd take your ellipsoid, and you'd call the faces to vertices method on it, right? And it would give you the vertices, and then you'd type this in as three lines of CVX pi. That's your proposal, right? I like it. It would work. There's one minor problem with that.","zh":"在所有不等式交集中。是的，所以你基本上会先写一个方法，叫做从面到顶点，对吧？你会用你的椭球，然后在它上面调用从面到顶点的方法，对吧？它会给你顶点，然后你把这些顶点输入到CVX的三行代码中。这就是你的建议，对吧？我喜欢这个方法。它会起作用。不过有一个小问题。","start":3563.48,"end":3590.22},{"id":209,"text":"is how many vertices, you know, just order magnitude, does a polyhedron in R1000 with, let's say, 5000 inequalities, which, by the way, is a tiny thing you can solve on, you can solve an LP or problems with that on your phone. Everybody got that? How many vertices does that have? About, just order magnitude. Everybody know what I'm saying?","zh":"问题是这个多面体有多少个顶点，你知道，只是数量级的问题。比如说，在R1000中有一个有5000个不等式的多面体，顺便说一句，这在手机上就可以解决，你可以解决一个线性规划问题或者类似的问题。大家明白了吗？它有多少个顶点？大概数量级是多少。大家明白我的意思吗？","start":3591.23,"end":3614.91},{"id":210,"text":"I mean, I'm not drawing a picture here on R2. I'm talking about R1,000 or whatever, and you've got 5,000 inequalities. How many vertices does it have? A lot. Yeah, that's the answer. No, it's order of magnitude 1,000 choose whatever, 5,000 choose 1,000. Just for the record, that's a super big number. So your method was correct. It would work in two dimensions and three and blah, blah, blah. It would be absolutely correct. It just wouldn't work.","zh":"我的意思是，我并不是在这里在R2上画图。我在谈论的是R1000或者任何其他维度，你有5000个不等式。它有多少个顶点？很多。是的，这就是答案。不，它的数量级是1000中选择任意数，或者5000中选择1000。顺便说一句，这个数字非常大。所以你的方法是正确的。它在二维、三维甚至更多维度中都会起作用。它绝对正确。只是它不会起作用。","start":3615.69,"end":3644.34},{"id":211,"text":"Okay, everybody got that? Okay, so now I'll let you in on the secret. Turns out, actually, finding the minimum volume ellipsoid that covers a polyhedron given an inequality form is NP-hard. As a matter of fact, the following is, I just walk up to you in the street and say, here's an ellipsoid. Like, don't even optimize it. Here's an ellipsoid, and I want to ask you the following innocent question. Does my ellipsoid cover this polyhedron?","zh":"大家明白了吗？好的，现在我告诉你们一个秘密。实际上，给定一个不等式形式的多面体，找到覆盖它的最小体积椭球是一个NP难问题。事实上，以下情况是这样的，我走到街上对你说，这里有一个椭球。甚至不需要优化它。这里有一个椭球，我想问你们一个看似无辜的问题。我的椭球是否覆盖了这个多面体？","start":3645.33,"end":3671.13},{"id":212,"text":"Makes sense, right? So, I mean, you could even imagine all sorts of things that people might use this for. They would say, like, you know, my polyhedron is my desired region or something like that, and I'm going to cover it with an ellipsoid. You just want to ask, does it cover it? Anyway, everyone got the question? Unbelievably simple to state. NP hard. Okay? So, these things are about to get very weird.","zh":"这听起来合理，对吧？所以，你甚至可以想象人们会用这个做各种事情。他们会说，比如，我的多面体是我的目标区域，或者类似的东西，我要用一个椭球来覆盖它。你只需要问，它是否覆盖了它。不管怎样，大家明白这个问题了吗？这个问题的陈述极其简单。NP难。明白了吗？这些事情即将变得非常奇怪。","start":3673.9,"end":3700.11},{"id":213,"text":"Okay, so it depends on how you describe the polyhedron and all that kind of stuff. Okay, so if you're confused, you should be, right? Because this is quite complicated. Okay, now to confuse you, if you're not yet confused, this should do the trick. So now we go to something like a dual problem. It turns out they're not really duals, but that's okay.","zh":"好的，所以这取决于你如何描述这个多面体以及所有那些东西。好的，如果你感到困惑，你应该感到困惑，对吧？因为这相当复杂。好的，现在为了让你更加困惑，如果你还没有感到困惑，这应该会起作用。现在我们转向类似对偶问题的内容。事实上，它们并不是真正的对偶问题，但这没关系。","start":3700.72,"end":3725.56}],"notes":["本段讨论了如何通过将椭球的面转换为顶点来求解覆盖多面体的最小体积椭球问题。然而，这种方法在高维空间中存在计算复杂度的问题，因为多面体的顶点数量可能非常庞大，例如在R1000空间中，5000个不等式可能对应一个巨大的顶点数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3563.48,"end":3725.56,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3563.48,"text":"in the intersection of all the inequalities in them. Yeah, so you would basically, you'd first write a method that called, you know, faces to vertices, right? And you'd take your ellipsoid, and you'd call the faces to vertices method on it, right? And it would give you the vertices, and then you'd type this in as three lines of CVX pi. That's your proposal, right? I like it. It would work. There's one minor problem with that."},{"start":3591.23,"text":"is how many vertices, you know, just order magnitude, does a polyhedron in R1000 with, let's say, 5000 inequalities, which, by the way, is a tiny thing you can solve on, you can solve an LP or problems with that on your phone. Everybody got that? How many vertices does that have? About, just order magnitude. Everybody know what I'm saying?"},{"start":3615.69,"text":"I mean, I'm not drawing a picture here on R2. I'm talking about R1,000 or whatever, and you've got 5,000 inequalities. How many vertices does it have? A lot. Yeah, that's the answer. No, it's order of magnitude 1,000 choose whatever, 5,000 choose 1,000. Just for the record, that's a super big number. So your method was correct. It would work in two dimensions and three and blah, blah, blah. It would be absolutely correct. It just wouldn't work."},{"start":3645.33,"text":"Okay, everybody got that? Okay, so now I'll let you in on the secret. Turns out, actually, finding the minimum volume ellipsoid that covers a polyhedron given an inequality form is NP-hard. As a matter of fact, the following is, I just walk up to you in the street and say, here's an ellipsoid. Like, don't even optimize it. Here's an ellipsoid, and I want to ask you the following innocent question. Does my ellipsoid cover this polyhedron?"},{"start":3673.9,"text":"Makes sense, right? So, I mean, you could even imagine all sorts of things that people might use this for. They would say, like, you know, my polyhedron is my desired region or something like that, and I'm going to cover it with an ellipsoid. You just want to ask, does it cover it? Anyway, everyone got the question? Unbelievably simple to state. NP hard. Okay? So, these things are about to get very weird."},{"start":3700.72,"text":"Okay, so it depends on how you describe the polyhedron and all that kind of stuff. Okay, so if you're confused, you should be, right? Because this is quite complicated. Okay, now to confuse you, if you're not yet confused, this should do the trick. So now we go to something like a dual problem. It turns out they're not really duals, but that's okay."}],"speech_gaps":[],"frame":"../frames/v011/022.webp","frame_time":3575.48},{"title":"椭球体覆盖与包含问题","segments":[{"id":214,"text":"The dual problem is, I have my set C. Here, I'll just draw a C. Here's C, right? And what I want to do now, we just, the Lohner-John ellipsoid covers, is find the minimum volume ellipsoid that covers this thing, right? Now, this is a variation on that. This doesn't have a person's name attached to it, or I guess I should say, that's this one. It says, find me the maximum volume ellipsoid that fits inside your set, okay?","zh":"对偶问题是我有一个集合C。这里，我将画一个C。这是C，对吧？现在，我想做的就是找到一个最小体积的椭球体来覆盖这个集合，对吧？现在，这是一个变种。这个没有附带某个人的名字，或者我应该说，这是这个。它说，找到一个能完全包含在你集合中的最大体积椭球体，好吗？","start":3726.61,"end":3754.51},{"id":215,"text":"Here's what's going to happen. This is crazy. If the set is a polyhedron, we're going to be able to solve this one when these are given by inequalities. Totally straightforward. But if it's given by the vertices, it's going to be NP-hard. So it's just weird and crazy. I can calculate the maximum volume ellipsoid that fits inside a polyhedron described by inequalities. That's easy. Tractable.","zh":"接下来会发生的事情是，这很疯狂。如果这个集合是一个多面体，当它由不等式给出时，我们能够解决这个问题，完全直接。但如果它是由顶点给出的，那就会是NP难的。所以这很奇怪和疯狂。我可以计算一个能完全包含在由不等式描述的多面体中的最大体积椭球体。这很容易，是可处理的。","start":3756.8,"end":3786.46},{"id":216,"text":"I can find the minimum volume ellipsoid that covers a polyhedron described by its vertices, totally tractable. Everybody following? But the two other problems are actually extremely difficult. Everybody got that? So, it's interesting, actually. Okay, so let's see how to do that. Now, to do that, we're actually going to use the opposite parametrization we did before.","zh":"我可以找到一个由顶点描述的多面体的最小体积椭球体，这完全可处理。大家跟上了吗？但另外两个问题实际上是极其困难的。大家明白了吗？所以，这其实很有趣。好的，那我们来看看如何做到这一点。现在，为了做到这一点，我们将使用与之前相反的参数化方法。","start":3786.98,"end":3812.73},{"id":217,"text":"To find the minimum volume ellipsoid, we use the inverse image of the unit ball under an affine mapping. Here, it's going to be the forward image of a unit ball. So here's the unit ball, and I'm going to make a forward image under an affine mapping. So here, by the way, the bigger B is, the bigger E is. Whereas the opposite was true for the previous parameterization. So we do this.","zh":"为了找到最小体积的椭球体，我们使用一个仿射映射下单位球的逆像。在这里，它将是单位球的正向像。所以这里有一个单位球，我将通过一个仿射映射生成正向像。顺便说一句，这里的B越大，E也越大。而之前参数化的情况正好相反。所以我们这样做。","start":3813.82,"end":3838.68},{"id":218,"text":"And here, once again, we can assume without any loss of generality that B is both symmetric and positive definite. Okay? So B is invertible, but I can do that. And I do the same trick, right? Here, if I put an orthogonal matrix after, if I replace B with BQ, the problem is identical. Because Q multiplies U, U is in the unit ball, and if I have an orthogonal matrix there, it doesn't change anything at all. Everybody following this? Okay, so...","zh":"在这里，我们同样可以假设B既是对称的又是正定的，没有任何损失的普遍性。好吗？B是可逆的，但我可以这样做。我也会使用同样的技巧，对吧？如果我在B后面加入一个正交矩阵，将B替换为BQ，问题是一样的。因为Q乘以U，U在单位球内，如果我在那里有一个正交矩阵，它不会改变任何东西。大家跟上这个了吗？好的，那么……","start":3840.37,"end":3868.15},{"id":219,"text":"So that's my parameterization. And now the volume is proportional to the determinant of B. So if we maximize log determinant B, that's the same as maximizing determinant B. And that's actually log determinant B is, as you know, concave. And then we're maximizing so everything is cool. Everybody following this? So, okay.","zh":"所以这就是我的参数化方法。现在体积与矩阵B的行列式成比例。因此，如果我们最大化log行列式B，就等同于最大化行列式B。实际上，正如你们所知，log行列式B是一个凹函数。然后我们进行最大化，所以一切都很顺利。大家都能跟上吗？那么，好的。","start":3869.44,"end":3893.42}],"notes":["本段讲授了椭球体覆盖与包含问题，包括最小体积椭球体覆盖给定集合和最大体积椭球体包含在给定集合内的两种情况。前者是Lohner-John椭球体问题，后者是其变体。当集合是多面体时，若由不等式描述，可以求解；若由顶点描述，则是NP难问题。","课堂中提到，当集合是多面体时，若由不等式描述，求解最大体积椭球体包含在集合内是容易的，而求解最小体积椭球体覆盖多面体时，若由顶点描述则是NP难的。这说明了不同描述方式对问题复杂度的影响。","为了求解最小体积椭球体覆盖问题，使用了与之前相反的参数化方法，即使用正向映射下的单位球像。这与之前使用逆向映射不同，因此需要重新考虑参数化方式。","课堂中提到，可以假设B是对称正定矩阵，因为正交矩阵不会改变问题的本质。这简化了问题的处理，因为正交变换不会影响椭球体的形状。","体积与B的行列式成正比，因此最大化行列式等价于最大化体积。由于对数行列式是凹函数，最大化对数行列式是可行的。","课堂中强调了参数化方法的重要性，以及如何通过正交变换简化问题。同时，也指出最大化对数行列式是求解最小体积椭球体覆盖问题的关键步骤。"],"formulas":[{"latex":"V \\text{ 是 } \\text{det}(B) \\text{ 的比例常数倍}","symbols":"体积与B的行列式成正比","explanation":"原文提到体积与B的行列式成正比，因此公式正确，无需修改。","evidence":"So that's my parameterization. And now the volume is
