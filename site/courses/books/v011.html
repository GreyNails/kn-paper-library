s if they're better than ours. Happily. What's that? No, not really. No, no. It's an honor. Right. If you if you look at the solutions and you go like."},{"id":3,"text":"Whoa, that's my solution. And just think of it, right? Generations of other students will read their homework solution and look down there and they're like, whoa, that's like, who would have thought of that? Ah, yeah. No, we haven't. We don't attribute. Yeah, yeah, we don't. Theoretically, we know, right? Because it's somewhere in some email. It's like errata for the book, right? Oh, by the way, and actually people in the class have found"},{"id":4,"text":"several things that were just like wrong so i mean they don't the main points are still valid but uh i think we're at two and growing so that's pretty good too because people have been looking at it pretty carefully for a long time so and they're just so anyway so thanks to those people as well okay um let's see"},{"id":5,"text":"Were there any other announcements? That was it. Good. Let's see. Any questions about midterm finals, where we are, what we're doing, all that kind of stuff? Okay, that's a no. So, okay. Good. We'll continue. So we'll continue. Last time we looked at this."},{"id":6,"text":"binary hypothesis testing, right? Which is, I mean, in some ways it's the essence of kind of like all of statistics, right? It's, you have, in this case, you have just two distributions. You observe one sample and the question is, you know, which distribution generated it? One or the other."}],"notes":["本段主要讨论了课程中关于学生解决方案的处理方式，强调了教师会采纳学生提交的更优解法，并公开承认这一点。教师提到，学生提交的解决方案有时会比教师自己的更好，因此会将其纳入作业解答中，但不会署名。","教师还提到，学生可能会发现教材中的错误，并指出这些错误的存在，但主要观点仍然有效。教师表示，目前已有两个错误被发现，并且数量在增长，这表明学生对教材的仔细阅读和关注。","教师在表达时语气较为随意，包含一些重复和停顿，但核心信息是关于课程公告和学生解决方案的处理方式，以及教材中可能存在的错误。"],"formulas":[],"uncertainties":["several things that were just like wrong so i mean they don't the main points are still valid but uh i think we're at two and growing"],"diagram":"none","start":5.26,"end":169.04,"asr_flags":[],"raw_segments":[{"start":5.26,"text":"Okay, we'll go ahead and start. So I guess congratulations for surviving the midterm. I suppose that was last week, but still, I should probably say that. Oh, I was also going to let people know that, like, for example, on things like the midterm and other times, too, we are not proud and we steal student solutions. Just to let you know."},{"start":31.54,"text":"Right. So we go into it. I think there was one where we asked for some DCP representation of like what inverse product or something. We'd figured out two or three of them. And actually amongst you, you found several others. And we just happily put them into the solutions. Just just, you know, so we sometimes we give a heads up like."},{"start":51.27,"text":"You'll see that if you look at a homework solution, because the homework problem started life as maybe a final exam problem. And we'll sometimes we'll say, here's our solution. And you say, here's a far better solution submitted by a student. So we'll sometimes say that. But I just want to make it public that we we just we steal your solutions if they're better than ours. Happily. What's that? No, not really. No, no. It's an honor. Right. If you if you look at the solutions and you go like."},{"start":76.15,"text":"Whoa, that's my solution. And just think of it, right? Generations of other students will read their homework solution and look down there and they're like, whoa, that's like, who would have thought of that? Ah, yeah. No, we haven't. We don't attribute. Yeah, yeah, we don't. Theoretically, we know, right? Because it's somewhere in some email. It's like errata for the book, right? Oh, by the way, and actually people in the class have found"},{"start":105.44,"text":"several things that were just like wrong so i mean they don't the main points are still valid but uh i think we're at two and growing so that's pretty good too because people have been looking at it pretty carefully for a long time so and they're just so anyway so thanks to those people as well okay um let's see"},{"start":127.44,"text":"Were there any other announcements? That was it. Good. Let's see. Any questions about midterm finals, where we are, what we're doing, all that kind of stuff? Okay, that's a no. So, okay. Good. We'll continue. So we'll continue. Last time we looked at this."},{"start":153.5,"text":"binary hypothesis testing, right? Which is, I mean, in some ways it's the essence of kind of like all of statistics, right? It's, you have, in this case, you have just two distributions. You observe one sample and the question is, you know, which distribution generated it? One or the other."}],"speech_gaps":[],"frame":"../frames/v011/001.webp","frame_time":17.259999999999998},{"title":"统计假设检验与优化问题","segments":[{"id":7,"text":"And if you make that more complicated and have distributions not on a finite number of points, but on Rn or something like that, or more complicated things, and you have more than two hypotheses, then that's kind of most of statistics right there. Anyway, so this is a very simple setting."},{"id":8,"text":"And so the question was to make a guess about whether an observation, right? And an observation is like a number like three. That's an observation, right? That's what happened. And then your goal is to try to figure out that it come or guess in some intelligent way that it come from this distribution or this one, right? And we looked at that. You end up with, you have this idea of a..."},{"id":9,"text":"a randomized detector. It's a policy that says, when you observe this outcome, which distribution do you attribute it to, right? And if it's, and that you do with a, you know, a two by N matrix, where the columns give you the probabilities that you announce it came from, you know, P or Q, the two different distributions, right? So that's how that works."},{"id":10,"text":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"},{"id":11,"text":"Anyway, so this problem, it turns out, is actually really quite..."},{"id":12,"text":"That would be lambda equals 1. And then the solution is like analytic and it's been known since, I don't know, probably 1900 or something. And it basically says, in that case, and it's completely reasonable, it says if lambda is 1 and you want to minimize, say, the total number of errors, you would say, well, what I would do is if I will choose the distribution which had higher likelihood. And we'll see that in another context, or we've already seen it in the context of maximum likelihood, so that's an example of that."},{"id":13,"text":"That would be lambda equals 1. And then the solution is like analytic and it's been known since, I don't know, probably 1900 or something. And it basically says, in that case, and it's completely reasonable, it says if lambda is 1 and you want to minimize, say, the total number of errors, you would say, well, what I would do is if I will choose the distribution which had higher likelihood. And we'll see that in another context, or we've already seen it in the context of maximum likelihood, so that's an example of that."}],"notes":["本段讲解了统计假设检验的基本概念，即通过观察数据来判断其来源于哪一个分布。讲者提到，当有多个假设时，问题变得复杂，但这里讨论的是二元假设检验的情况。观察值可以是像数字3这样的具体数值，目标是通过某种方式判断其来源于哪一个分布。","讲者介绍了随机检测器（randomized detector）的概念，这是一种策略，用于在观察到结果后决定其来源于哪一个分布。这种策略可以通过一个2×N的矩阵来表示，其中每一列给出将结果归因于P或Q分布的概率。","讲者进一步解释了如何将问题转化为双标准优化问题，其中两个关键指标是误报率（PFP）和漏报率（P FN）。这两个指标可以通过矩阵乘法直接计算，并且它们都是关于检测器参数T的线性函数。","讲者提到，当将问题标量化（scalarize）后，可以通过引入一个权重因子λ来平衡误报率和漏报率的重要性。当λ=1时，目标是最小化总的错误数量，此时的最优策略是选择具有更高似然值的分布。","讲者指出，这种策略在最大似然估计的背景下已经被广泛研究，并且可以应用于其他统计问题中。这表明，通过优化方法可以解决统计假设检验中的决策问题。","讲者强调，这种优化问题的解法在理论上是已知的，并且具有分析解，这表明在统计决策中，通过数学优化方法可以找到合理的决策策略。"],"formulas":[{"latex":"PFP = \\text{probability of false positive}","symbols":"误报率","explanation":"定义误报率，无需修改。","evidence":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"},{"latex":"PFN = \\text{probability of false negative}","symbols":"漏报率","explanation":"定义漏报率，无需修改。","evidence":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"},{"latex":"T = \\text{detector parameter}","symbols":"检测器参数","explanation":"定义检测器参数，无需修改。","evidence":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"}],"uncertainties":["lambda equals 1"],"diagram":"none","start":169.44,"end":330.61,"asr_flags":[],"math_clarifications":["公式索引3、4、5和6未提供足够的数学定义或上下文，无法核定其正确性，因此被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":169.44,"text":"And if you make that more complicated and have distributions not on a finite number of points, but on Rn or something like that, or more complicated things, and you have more than two hypotheses, then that's kind of most of statistics right there. Anyway, so this is a very simple setting."},{"start":189.34,"text":"And so the question was to make a guess about whether an observation, right? And an observation is like a number like three. That's an observation, right? That's what happened. And then your goal is to try to figure out that it come or guess in some intelligent way that it come from this distribution or this one, right? And we looked at that. You end up with, you have this idea of a..."},{"start":214.69,"text":"a randomized detector. It's a policy that says, when you observe this outcome, which distribution do you attribute it to, right? And if it's, and that you do with a, you know, a two by N matrix, where the columns give you the probabilities that you announce it came from, you know, P or Q, the two different distributions, right? So that's how that works."},{"start":240.42,"text":"If those are all zeros and ones, then it's deterministic. And you end up, you write this down as a bi-criterion optimization problem. There's two things you care about, the probability of a false positive, and that's PFP, and the probability of a false negative, right? And these are just, you just get these from matrix multiplication. And the point is that each of these is a linear function in T. T is what describes your detector, right?"},{"start":270.9,"text":"Anyway, so this problem, it turns out, is actually really quite..."},{"start":276.05,"text":"straightforward to solve if you scalarize it. So you say that lambda now is the amount, is the factor that relates how much I care about false positive versus false negatives or something like that. Then it turns out it just has a super simple solution that looks like this. Lambda is that weighting factor. For example, if it's one, it says, actually, I just want to minimize the number of errors, period."},{"start":302.97,"text":"That would be lambda equals 1. And then the solution is like analytic and it's been known since, I don't know, probably 1900 or something. And it basically says, in that case, and it's completely reasonable, it says if lambda is 1 and you want to minimize, say, the total number of errors, you would say, well, what I would do is if I will choose the distribution which had higher likelihood. And we'll see that in another context, or we've already seen it in the context of maximum likelihood, so that's an example of that."}],"speech_gaps":[],"frame":"../frames/v011/002.webp","frame_time":181.44},{"title":"类型错误与最小最大优化","segments":[{"id":14,"text":"And the lambda allows you to put weights on the two different types of errors, which I think are called type one and type two error, but I can never remember which is which and just look it up every time I need to know. Actually, usually I try to avoid situations where people are saying things like type one and type two error. So I usually walk out of the room, but if I am forced to, I will just look it up to figure out what it is. Okay."},{"id":15,"text":"Now, what's interesting is even at this super simple problem, you can get into weird things, very interesting stuff like this. Suppose you say, I want to minimize the maximum of my false positive and false negative errors, right? That will get you something that's Pareto optimal because max is a monotone function."},{"id":16,"text":"of the two it's a monotone mapping from the two criteria into one so that's a that is a scalarization it's not a linear scalarization which is what's normally employed but it's a scalarization right um and this that's a that turns out that's an lp and the solution is usually not deterministic right so here's an example so here we go"},{"id":17,"text":"Let's see. Here's the trade-off curve of false positive versus false negative. That's this thing, this curve here. Oh, yeah, somebody explain the point at the top. First of all, let's talk about what's really good about that detector. What's the probability? If we use the detector up there at 1, this point right here, this one, first let's say the good part about it. What is the probability of a false positive for that detector? Zero."},{"id":18,"text":"Right. OK, fine. Right. By the way, what does that detector do? It just returns like negative every time. Right. So it's kind of silly. But the good news is it does have a very, very low false positive rate. OK, so, you know, and that's each of these correspond. These correspond to likelihood ratios."},{"id":19,"text":"between the entries there. In fact, you can even take lambda and put lambda around here and ask what happens. If you have a certain lambda like that, the optimal point you're going to find is going to be like here or here or here. The minimax one is one, you can figure out what that is. This is the x equals y line."},{"id":20,"text":"And the minimax one you find by simply taking this rectangle or square, if this was done correctly with axes, which it was not, and you simply grow it until it touches this curve. And that's going to be right here. And so it turns out if you wanted to minimize the maximum of your false positive and your false negative,"}],"notes":["本段讨论了类型错误（type one和type two error）的概念，以及如何通过引入权重λ来平衡两种错误。讲者提到自己经常混淆这两种错误，因此每次需要时都会查阅资料。这表明类型错误是统计学和机器学习中常见的概念，用于评估分类器的性能。","讲者进一步说明，即使在非常简单的优化问题中，也可以出现有趣的现象，例如最小化最大错误（false positive和false negative）。这种优化方法被称为Pareto最优，因为最大函数是单调函数，可以将两个标准映射为一个标量。","讲者提到，这种标量化方法不是线性标量化，而是另一种形式的标量化，通常用于优化问题中。这种优化问题可以归类为lp问题，其解通常不是确定性的。","讲者通过一个例子说明了误判率（false positive和false negative）之间的权衡曲线。在曲线的顶部，检测器的误判率为零，但其检测结果总是负的，这表明该检测器虽然误判率低，但可能过于保守。","讲者提到，每个点对应于似然比（likelihood ratios），这表明在优化过程中，似然比是重要的决策依据。通过调整λ，可以找到最优的点，这些点可能位于曲线的不同位置。","最后，讲者讨论了如何通过扩展一个矩形或正方形（如果坐标轴正确）直到它接触曲线，从而找到最小最大解。这表明最小最大优化是一种常见的策略，用于在多个目标之间找到平衡点。"],"formulas":[],"uncertainties":["of the two it's a monotone mapping from the two criteria into one so that's a that is a scalarization it's not a linear scalarization which is what's normally employed but it's a scalarization right um and this that's a that turns out that's an lp and the solution is usually not deterministic right so here's an example so here we go","between the entries there. In fact, you can even take lambda and put lambda around here and ask what happens. If you have a certain lambda like that, the optimal point you're going to find is going to be like here or here or here. The minimax one is one, you can figure out what that is. This is the x equals y line."],"diagram":"none","start":331.96,"end":498.95,"asr_flags":[],"raw_segments":[{"start":331.96,"text":"And the lambda allows you to put weights on the two different types of errors, which I think are called type one and type two error, but I can never remember which is which and just look it up every time I need to know. Actually, usually I try to avoid situations where people are saying things like type one and type two error. So I usually walk out of the room, but if I am forced to, I will just look it up to figure out what it is. Okay."},{"start":354.3,"text":"Now, what's interesting is even at this super simple problem, you can get into weird things, very interesting stuff like this. Suppose you say, I want to minimize the maximum of my false positive and false negative errors, right? That will get you something that's Pareto optimal because max is a monotone function."},{"start":375.85,"text":"of the two it's a monotone mapping from the two criteria into one so that's a that is a scalarization it's not a linear scalarization which is what's normally employed but it's a scalarization right um and this that's a that turns out that's an lp and the solution is usually not deterministic right so here's an example so here we go"},{"start":400.87,"text":"Let's see. Here's the trade-off curve of false positive versus false negative. That's this thing, this curve here. Oh, yeah, somebody explain the point at the top. First of all, let's talk about what's really good about that detector. What's the probability? If we use the detector up there at 1, this point right here, this one, first let's say the good part about it. What is the probability of a false positive for that detector? Zero."},{"start":432.14,"text":"Right. OK, fine. Right. By the way, what does that detector do? It just returns like negative every time. Right. So it's kind of silly. But the good news is it does have a very, very low false positive rate. OK, so, you know, and that's each of these correspond. These correspond to likelihood ratios."},{"start":456.49,"text":"between the entries there. In fact, you can even take lambda and put lambda around here and ask what happens. If you have a certain lambda like that, the optimal point you're going to find is going to be like here or here or here. The minimax one is one, you can figure out what that is. This is the x equals y line."},{"start":479.65,"text":"And the minimax one you find by simply taking this rectangle or square, if this was done correctly with axes, which it was not, and you simply grow it until it touches this curve. And that's going to be right here. And so it turns out if you wanted to minimize the maximum of your false positive and your false negative,"}],"speech_gaps":[],"frame":"../frames/v011/003.webp","frame_time":343.96},{"title":"随机检测器与实验设计","segments":[{"id":21,"text":"you would do, number one, you'd have a non-deterministic detector, which is weird because you'd say, oh, the outcome was, you know, I don't know, let's say two. And you'd go, oh, yeah, okay, well, that's definitely like P, right? And then you'd come back later and say the outcome was two and you'd say, I don't know, let me check just a minute. Oh, it's Q. Everybody got this?"},{"id":22,"text":"So it's a little bit odd that you would have a randomized detector, but this comes up in a bunch of things. By the way, a randomized detector you can think of as a relaxation of the original. The original sensible problem is to say, no, if there's an outcome, you have to commit to one of these two distributions. You can't do something weird and have an inconsistent, weird, probabilistic thing. Okay, so that's a very baby example."},{"id":23,"text":"Okay, last topic in this section is going to be experiment design. This is actually super interesting, also like super useful. So the setting is we have a bunch of linear measurements here. So we have linear measurements. And AI you can think of as the measurement vector. WI, we're going to normalize those to have all the same standard deviation, which is one."},{"id":24,"text":"Right? And so what it means, you know, roughly speaking, the size of A is something like, and this is dialect, but signal to noise ratio. Okay? So, right, because if A is gigantic, right, then it says that the AI transpose X tells you a lot, and then I add this noise that's like plus minus one, like, who cares, right? If AI is small, it means that's a pretty crappy measurement."},{"id":25,"text":"So that's the idea there. Now, if I actually take, if I get a bunch of these measurements, these yi's, and I ask someone to guess x, and you know, the maximum likelihood, which is just nothing but least squares, the estimate is just least squares, so you just get this, right? It's the sum of ai ai transpose, that's this thing, inverse times this, right?"},{"id":26,"text":"And the error, which is x hat minus x, has zero mean. So that's an unbiased estimate. And it has a covariance, which is given by this matrix here. And if you wanted to work out a confidence ellipsoid for that, again, assuming because these are all Gaussian, this is Gaussian, it would look like this. It would say it's a set of x which are centered at your estimate x hat."}],"notes":["本段首先讨论了随机检测器的概念，指出其与确定性检测器的不同之处。随机检测器允许在不同时间点对同一结果进行不同的概率分配，这在某些情况下是合理的，但通常被视为对原始问题的放松。原始问题要求在获得结果后必须确定性地选择一个分布，而随机检测器则允许更灵活的处理方式。","接着，课程转向实验设计，强调了线性测量在实验设计中的重要性。测量向量被标准化为具有相同的标准差，这有助于比较不同测量的信噪比。信噪比的大小决定了测量的有效性，较大的信噪比意味着测量信息量大，而较小的信噪比则意味着测量质量差。","在实验设计中，最大似然估计被引入，作为线性测量的估计方法。最大似然估计等价于最小二乘法，其估计结果为测量矩阵的伪逆乘以测量向量。这种估计方法具有无偏性，其误差的协方差矩阵由测量矩阵的伪逆决定。","最后，课程提到如何利用高斯分布的性质来构建置信椭球。置信椭球的中心是估计值，其形状由协方差矩阵决定，反映了估计值的不确定性范围。这种分析方法在实验设计和信号处理中具有广泛应用。"],"formulas":[{"latex":"x_{\\hat{}} = (A^T A)^{-1} A^T y","symbols":"x_hat 是估计值，A 是测量矩阵，y 是测量向量","explanation":"公式正确，表示最小二乘估计，符合线性测量模型下的最大似然估计。","evidence":"So that's the idea there. Now, if I actually take, if I get a bunch of these measurements, these yi's, and I ask someone to guess x, and you know, the maximum likelihood, which is just nothing but least squares, the estimate is just least squares, so you just get this, right? It's the sum of ai ai transpose, that's this thing, inverse times this, right?"},{"latex":"Cov(x_{\\hat{}}) = (A^T A)^{-1} \\sigma^2","symbols":"Cov(x_hat) 是误差的协方差矩阵，σ² 是噪声方差","explanation":"公式正确，表示估计值的协方差矩阵，其中σ²是噪声方差，符合高斯噪声下的最小二乘估计结果。","evidence":"And the error, which is x hat minus x, has zero mean. So that's an unbiased estimate. And it has a covariance, which is given by this matrix here. And if you wanted to work out a confidence ellipsoid for that, again, assuming because these are all Gaussian, this is Gaussian, it would look like this. It would say it's a set of x which are centered at your estimate x hat."}],"uncertainties":["AI transpose X"],"diagram":"none","start":499.77,"end":655.02,"asr_flags":[],"math_clarifications":["公式中的协方差矩阵应为向量形式，即Cov(x_hat) = σ² (A^T A)^{-1}，其中σ²是噪声方差，且协方差矩阵应为对称正定矩阵。"],"raw_segments":[{"start":499.77,"text":"you would do, number one, you'd have a non-deterministic detector, which is weird because you'd say, oh, the outcome was, you know, I don't know, let's say two. And you'd go, oh, yeah, okay, well, that's definitely like P, right? And then you'd come back later and say the outcome was two and you'd say, I don't know, let me check just a minute. Oh, it's Q. Everybody got this?"},{"start":521.37,"text":"So it's a little bit odd that you would have a randomized detector, but this comes up in a bunch of things. By the way, a randomized detector you can think of as a relaxation of the original. The original sensible problem is to say, no, if there's an outcome, you have to commit to one of these two distributions. You can't do something weird and have an inconsistent, weird, probabilistic thing. Okay, so that's a very baby example."},{"start":551.67,"text":"Okay, last topic in this section is going to be experiment design. This is actually super interesting, also like super useful. So the setting is we have a bunch of linear measurements here. So we have linear measurements. And AI you can think of as the measurement vector. WI, we're going to normalize those to have all the same standard deviation, which is one."},{"start":580.42,"text":"Right? And so what it means, you know, roughly speaking, the size of A is something like, and this is dialect, but signal to noise ratio. Okay? So, right, because if A is gigantic, right, then it says that the AI transpose X tells you a lot, and then I add this noise that's like plus minus one, like, who cares, right? If AI is small, it means that's a pretty crappy measurement."},{"start":605.86,"text":"So that's the idea there. Now, if I actually take, if I get a bunch of these measurements, these yi's, and I ask someone to guess x, and you know, the maximum likelihood, which is just nothing but least squares, the estimate is just least squares, so you just get this, right? It's the sum of ai ai transpose, that's this thing, inverse times this, right?"},{"start":630.42,"text":"And the error, which is x hat minus x, has zero mean. So that's an unbiased estimate. And it has a covariance, which is given by this matrix here. And if you wanted to work out a confidence ellipsoid for that, again, assuming because these are all Gaussian, this is Gaussian, it would look like this. It would say it's a set of x which are centered at your estimate x hat."}],"speech_gaps":[],"frame":"../frames/v011/004.webp","frame_time":511.77},{"title":"实验设计与置信椭球","segments":[{"id":27,"text":"And the shape is given by this matrix here. And so, for example, I don't know. So that would give you... And beta is going to be determined by, you know, actually it would be something like the inverse distribution of a chi-squared random variable with the appropriate number of degrees. It doesn't matter, though, because that's how you would get beta. And that would say, thank you for the measurements. This tells you, you know, with 90%..."},{"id":28,"text":"Probability, you're in this ellipsoid, right? And if I say 99% thing, then beta just gets bigger here. So that's all that happens, right? Okay. So experiment design is this problem. So I have a bunch of candidates, V1 through VP. You should think of these as possible measurements or experiments you can make, right? So that's what they are."},{"id":29,"text":"And then I want to choose M AIs, which are among this palette of possible experiments I can carry out, right? So in other words, I have a bunch of sensors and what I can do is you'd say, pick."},{"id":30,"text":"Pick which sensors you should use. In fact, even pick the sequence, right? Which you should use to actually get the best estimate. The best estimate is a bit tricky because we're going to measure everything in terms of this ellipsoid, right? And we want this, sorry, this positive definite matrix, right? And what we really want is this positive definite matrix to be small, which by the way is the same as saying that the, sorry, yeah, we want this to be small, which is saying that the confidence ellipsoid is small, right?"},{"id":31,"text":"So that's what you do. So, in other words, now the problem with that is, this is exactly an ordering, the positive semi-definite matrices, which is not linear. Right? So it's completely reasonable if you came up with an experiment design, and you came up with one, we looked at your E's, like E1 and E2, and they were not comparable. So in some directions, you're better, and in other directions, you're better. That can and does happen. Everybody got it?"},{"id":32,"text":"So we're going to have to scalarize the idea of a positive definite matrix being small. And there's lots of different ways to do it. Each one is going to lead to a certain named type of experiment design. So let me discuss a couple of things quickly. Earlier, I said that the size of A is something like, let's say, the two norm. That's something like a signal-to-noise ratio. If AI is gigantic, that's really good. That's a good measurement."}],"notes":["本段讲授了实验设计的基本概念，即如何从一组可能的测量或实验中选择最佳的测量组合。这些测量可以视为传感器，选择的目的是为了获得最佳估计。最佳估计的衡量标准是置信椭球的大小，即正定矩阵的大小，这与置信度有关。","讲者提到，置信椭球的形状由一个矩阵决定，而β值由卡方分布的逆分布确定。置信度越高，β值越大，置信椭球也越大。实验设计的问题在于如何选择这些测量，使得最终的置信椭球尽可能小。","讲者指出，正定矩阵的大小比较不是线性的，因此需要将正定矩阵的大小转化为标量，以进行比较。不同的标量化方法会导致不同的实验设计类型。","讲者提到，矩阵的大小可以用二范数来衡量，这类似于信噪比。如果矩阵的大小很大，说明该测量效果很好。","讲者强调，实验设计的难点在于如何在不同方向上比较不同测量的效果，因为某些方向上可能更好，而另一些方向上可能更差。","讲者最后提到，实验设计的目的是选择一组测量，使得最终的置信椭球尽可能小，从而提高估计的精度。"],"formulas":[],"uncertainties":["AI is gigantic"],"diagram":"none","start":655.46,"end":816.02,"asr_flags":[],"math_clarifications":["原文中提到的正定矩阵和椭球体相关概念，如'positive definite matrix'和'confidence ellipsoid'，需要更明确的数学定义和公式支持。例如，正定矩阵的大小通常通过其特征值或迹来衡量，而椭球体的大小与协方差矩阵的逆相关。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":655.46,"text":"And the shape is given by this matrix here. And so, for example, I don't know. So that would give you... And beta is going to be determined by, you know, actually it would be something like the inverse distribution of a chi-squared random variable with the appropriate number of degrees. It doesn't matter, though, because that's how you would get beta. And that would say, thank you for the measurements. This tells you, you know, with 90%..."},{"start":684.17,"text":"Probability, you're in this ellipsoid, right? And if I say 99% thing, then beta just gets bigger here. So that's all that happens, right? Okay. So experiment design is this problem. So I have a bunch of candidates, V1 through VP. You should think of these as possible measurements or experiments you can make, right? So that's what they are."},{"start":712.44,"text":"And then I want to choose M AIs, which are among this palette of possible experiments I can carry out, right? So in other words, I have a bunch of sensors and what I can do is you'd say, pick."},{"start":731.92,"text":"Pick which sensors you should use. In fact, even pick the sequence, right? Which you should use to actually get the best estimate. The best estimate is a bit tricky because we're going to measure everything in terms of this ellipsoid, right? And we want this, sorry, this positive definite matrix, right? And what we really want is this positive definite matrix to be small, which by the way is the same as saying that the, sorry, yeah, we want this to be small, which is saying that the confidence ellipsoid is small, right?"},{"start":761.84,"text":"So that's what you do. So, in other words, now the problem with that is, this is exactly an ordering, the positive semi-definite matrices, which is not linear. Right? So it's completely reasonable if you came up with an experiment design, and you came up with one, we looked at your E's, like E1 and E2, and they were not comparable. So in some directions, you're better, and in other directions, you're better. That can and does happen. Everybody got it?"},{"start":789.18,"text":"So we're going to have to scalarize the idea of a positive definite matrix being small. And there's lots of different ways to do it. Each one is going to lead to a certain named type of experiment design. So let me discuss a couple of things quickly. Earlier, I said that the size of A is something like, let's say, the two norm. That's something like a signal-to-noise ratio. If AI is gigantic, that's really good. That's a good measurement."}],"speech_gaps":[],"frame":"../frames/v011/005.webp","frame_time":667.46},{"title":"选择最大信号-噪声比实验的设计策略","segments":[{"id":33,"text":"So let me ask a question. In fact, I have a proposal. Here's my experiment design method. Ready? I will find the largest VI in magnitude. Someone says, why are you choosing that? And you go, of the sensors or the experiments I've been offered, that's the one with the highest signal-to-noise ratio. Make sense? Okay. And then they'd say, ready for my experiment design? Just do that."},{"id":34,"text":"use, suppose V7 is the largest in magnitude of these, then you just do that the whole way. And someone says, why are you doing that? And you go, why would I use anything other than the experiment that has the highest signal to noise ratio? Everybody got that? Okay. Well, okay. You're probably not going to fool for it, but I'm actually pretty good at making up a good story. I could tell stories around that and all sorts of other stuff. I bet I could get some people to go for that."},{"id":35,"text":"Okay, any comments?"},{"id":36,"text":"You mean the worst situation, not the best situation?"},{"id":37,"text":"Well, I mean, no, I just told you my policy."},{"id":38,"text":"My policy is I'm going to take V7 over here"},{"id":39,"text":"because it's the one with the largest magnitude, right?"},{"id":40,"text":"And then I'm just going to, all my AIs are going to be that."},{"id":41,"text":"Do you have a suggestion?"},{"id":42,"text":"Any comment on it?"},{"id":43,"text":"Would there be some, like, bias in one direction?"},{"id":44,"text":"No, you know, all of these are kind of unbiased."},{"id":45,"text":"Yeah."},{"id":46,"text":"Let me ask one question."},{"id":47,"text":"Let's talk about this matrix if all the AIs were the same."},{"id":48,"text":"What's that matrix look like?"},{"id":49,"text":"What is it?"},{"id":50,"text":"A7 square identity."},{"id":51,"text":"It's what?"},{"id":52,"text":"I don't see any identity matrix."},{"id":53,"text":"What's that?"},{"id":54,"text":"No."},{"id":55,"text":"So this thing would become sum from i equals 1 to m, v7, v7 transpose, otherwise known as m times v7, v7 transpose."},{"id":56,"text":"known as m times v7, v7 transpose."},{"id":57,"text":"Anybody want to comment about the matrix v7, v7 transpose?"},{"id":58,"text":"It's what?"},{"id":59,"text":"It's rank 1, right?"},{"id":60,"text":"Okay."},{"id":61,"text":"Okay, so if I just always use the experiment with a high, if I always make a measurement"},{"id":62,"text":"which is the highest signal-to-noise ratio, then we've got kind of a problem here, because"},{"id":63,"text":"this matrix is not invertible."},{"id":64,"text":"It's singular, right?"},{"id":65,"text":"And so, I mean, we could talk about E inverse if you like."},{"id":66,"text":"It's kind of silly."},{"id":67,"text":"I can tell you what it would be."},{"id":68,"text":"It's our error covariance."},{"id":69,"text":"It'd be really good in the direction V7."}],"notes":["本段讨论了在实验设计中选择具有最高信号-噪声比的实验的策略。讲者提出，如果所有AI都使用相同的实验，那么所形成的矩阵将是一个秩为1的矩阵，这会导致矩阵不可逆，从而产生问题。","讲者指出，如果总是选择最高信号-噪声比的实验，那么所形成的矩阵将是一个秩为1的矩阵，这会导致矩阵不可逆，从而无法求逆。这种不可逆性可能影响误差协方差的计算。","讲者提到，这种不可逆性可能使得误差协方差矩阵的逆变得没有意义，因此在实际应用中需要考虑其他方法来处理这种情况。","讲者还指出，这种矩阵的结构在方向V7上表现良好，但在其他方向上可能存在问题，这表明需要更全面的实验设计策略。","讲者通过举例说明了矩阵的结构和性质，强调了在实验设计中选择合适实验的重要性。","讲者最后提到，这种不可逆性可能使得误差协方差矩阵的逆变得没有意义，因此在实际应用中需要考虑其他方法来处理这种情况。"],"formulas":[],"uncertainties":[],"diagram":"none","start":816.84,"end":982.05,"asr_flags":[],"math_clarifications":["原始文本中未明确说明矩阵 A 的构造方式，因此无法核定其数学表达式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":816.84,"text":"So let me ask a question. In fact, I have a proposal. Here's my experiment design method. Ready? I will find the largest VI in magnitude. Someone says, why are you choosing that? And you go, of the sensors or the experiments I've been offered, that's the one with the highest signal-to-noise ratio. Make sense? Okay. And then they'd say, ready for my experiment design? Just do that."},{"start":843.22,"text":"use, suppose V7 is the largest in magnitude of these, then you just do that the whole way. And someone says, why are you doing that? And you go, why would I use anything other than the experiment that has the highest signal to noise ratio? Everybody got that? Okay. Well, okay. You're probably not going to fool for it, but I'm actually pretty good at making up a good story. I could tell stories around that and all sorts of other stuff. I bet I could get some people to go for that."},{"start":872.95,"text":"Okay, any comments?"},{"start":876.33,"text":"You mean the worst situation, not the best situation?"},{"start":882.65,"text":"Well, I mean, no, I just told you my policy."},{"start":885.95,"text":"My policy is I'm going to take V7 over here"},{"start":889.21,"text":"because it's the one with the largest magnitude, right?"},{"start":892.49,"text":"And then I'm just going to, all my AIs are going to be that."},{"start":895.47,"text":"Do you have a suggestion?"},{"start":896.77,"text":"Any comment on it?"},{"start":899.55,"text":"Would there be some, like, bias in one direction?"},{"start":902.97,"text":"No, you know, all of these are kind of unbiased."},{"start":906.41,"text":"Yeah."},{"start":907.67,"text":"Let me ask one question."},{"start":911.09,"text":"Let's talk about this matrix if all the AIs were the same."},{"start":917.57,"text":"What's that matrix look like?"},{"start":922.31,"text":"What is it?"},{"start":925.45,"text":"A7 square identity."},{"start":927.43,"text":"It's what?"},{"start":933.27,"text":"I don't see any identity matrix."},{"start":935.81,"text":"What's that?"},{"start":936.33,"text":"No."},{"start":937.01,"text":"Yeah, so this thing would become sum from i equals 1 to m, v7, v7 transpose, otherwise"},{"start":943.81,"text":"known as m times v7, v7 transpose."},{"start":948.67,"text":"Anybody want to comment about the matrix v7, v7 transpose?"},{"start":953.43,"text":"It's what?"},{"start":954.13,"text":"It's rank 1, right?"},{"start":955.51,"text":"Okay."},{"start":955.99,"text":"Okay, so if I just always use the experiment with a high, if I always make a measurement"},{"start":960.83,"text":"which is the highest signal-to-noise ratio, then we've got kind of a problem here, because"},{"start":967.65,"text":"this matrix is not invertible."},{"start":970.67,"text":"It's singular, right?"},{"start":972.33,"text":"And so, I mean, we could talk about E inverse if you like."},{"start":975.61,"text":"It's kind of silly."},{"start":976.57,"text":"I can tell you what it would be."},{"start":978.05,"text":"It's our error covariance."},{"start":979.03,"text":"It'd be really good in the direction V7."}],"speech_gaps":[{"start":928.27,"end":932.87}],"frame":"../frames/v011/006.webp","frame_time":828.84},{"title":"实验设计与凸优化","segments":[{"id":70,"text":"Because I blew my entire... Every experiment I ever did was the same experiment, right? But in n minus 1 dimensions, I got no information of any kind whatsoever. And so my confidence ellipsoid is like infinite in those directions. Everybody make sense? Yep. Okay. So that's it. Okay. All right."},{"id":71,"text":"So, oh, the first thing to, there's another thing we can observe here, right? Here, we don't have to choose the sequence, right? Because the outcome doesn't depend on the sequencing, right? So, in other words, this is no difference if someone says, please do the following. Use V1 four times, then V3, and then here's the trick. Switch back to V1 four more times, and then V4. Everybody got what I just said? So it turns out,"},{"id":72,"text":"Doesn't matter. If you look at our objective function here, it's symmetric. You can permute them any way you like. By the way, this is completely false, except in this incredibly simple Gaussian setup. In other cases, you want to do design of experiments, it's a whole sequence and it depends on what you've observed so far. In other words..."},{"id":73,"text":"If we're flying a drone and someone says, we have an energy budget, which sensor are we going to use? It depends on all sorts of stuff. But in this Gaussian model, actually, it doesn't."},{"id":74,"text":"So, okay. So, it really only depends, I only have to tell you how many of my, my total budget is M experiments. I just have to divide M up across these, the palette of potential experiments that I've been offered. Okay? So, if I had 22, I could say, I want to do four of these, seven of those, three of these, and blah, blah, blah. And my numbers better add up to 22. That's all we have to do. Okay. So, we'll write it this way."},{"id":75,"text":"And here we have an integer problem, right? Because the m's are integers. Actually, here mk is the number of times I'm going to use experiment k, or sensor k, right? That's what it is. And then this thing just looks like this, right? Okay, so this is all cool. Let's see, this is even..."},{"id":76,"text":"But this is actually, if m were not an integer, but a real number, positive real number, this thing would actually be k convex, where k is the PSD cone. So this would be cool. But it's not. m is an integer. And now, by the way, this comes up in lots and lots of settings, where there's an integer or something like that. So you do, I mean, it's kind of one of the themes, is you do relaxation."}],"notes":["本段讨论了实验设计中的对称性问题，指出在高斯模型中，实验顺序不影响结果，因此可以任意排列实验。然而，这仅在高斯模型中成立，其他情况下实验顺序会影响结果，需要考虑实验设计的序列性。","讲者通过无人机传感器选择的例子，说明在实际应用中，实验顺序可能会影响结果，但在高斯模型中，由于对称性，顺序不影响结果。","讲者提到，当实验次数为整数时，问题变为整数规划问题，而如果允许实验次数为实数，则问题可以转化为凸优化问题，这涉及到松弛（relaxation）的概念。","松弛是凸优化中的一个重要主题，通过将整数问题转化为连续问题，可以更容易求解，但需要在解的可行性上进行调整。","讲者强调了凸优化在实验设计中的应用，特别是在处理高斯模型时，对称性和凸性使得问题更容易求解。","讲者指出，虽然在某些情况下可以使用松弛方法，但在其他情况下，实验设计需要考虑序列性和观察结果的依赖性，这使得问题更加复杂。"],"formulas":[],"uncertainties":[],"diagram":"none","start":982.81,"end":1153.76,"asr_flags":[],"raw_segments":[{"start":982.81,"text":"Because I blew my entire... Every experiment I ever did was the same experiment, right? But in n minus 1 dimensions, I got no information of any kind whatsoever. And so my confidence ellipsoid is like infinite in those directions. Everybody make sense? Yep. Okay. So that's it. Okay. All right."},{"start":1007.84,"text":"So, oh, the first thing to, there's another thing we can observe here, right? Here, we don't have to choose the sequence, right? Because the outcome doesn't depend on the sequencing, right? So, in other words, this is no difference if someone says, please do the following. Use V1 four times, then V3, and then here's the trick. Switch back to V1 four more times, and then V4. Everybody got what I just said? So it turns out,"},{"start":1037.31,"text":"Doesn't matter. If you look at our objective function here, it's symmetric. You can permute them any way you like. By the way, this is completely false, except in this incredibly simple Gaussian setup. In other cases, you want to do design of experiments, it's a whole sequence and it depends on what you've observed so far. In other words..."},{"start":1062.38,"text":"If we're flying a drone and someone says, we have an energy budget, which sensor are we going to use? It depends on all sorts of stuff. But in this Gaussian model, actually, it doesn't."},{"start":1076.74,"text":"So, okay. So, it really only depends, I only have to tell you how many of my, my total budget is M experiments. I just have to divide M up across these, the palette of potential experiments that I've been offered. Okay? So, if I had 22, I could say, I want to do four of these, seven of those, three of these, and blah, blah, blah. And my numbers better add up to 22. That's all we have to do. Okay. So, we'll write it this way."},{"start":1102.92,"text":"And here we have an integer problem, right? Because the m's are integers. Actually, here mk is the number of times I'm going to use experiment k, or sensor k, right? That's what it is. And then this thing just looks like this, right? Okay, so this is all cool. Let's see, this is even..."},{"start":1125.85,"text":"But this is actually, if m were not an integer, but a real number, positive real number, this thing would actually be k convex, where k is the PSD cone. So this would be cool. But it's not. m is an integer. And now, by the way, this comes up in lots and lots of settings, where there's an integer or something like that. So you do, I mean, it's kind of one of the themes, is you do relaxation."}],"speech_gaps":[],"frame":"../frames/v011/007.webp","frame_time":994.81},{"title":"松弛方法与实验设计","segments":[{"id":77,"text":"So the relaxation is, you know what? I divide the M's by capital M. So instead of working with M1, I'm going to work with M1 divided by capital M. And then you're saying, what is the fraction of the total number of experiments you're going to do that are going to use, in fact, M1 over M? What is the fraction when you use experiment number one? Everybody make sense? Okay, so now if I do that,"},{"id":78,"text":"we still have the constraint that those fractions are integer multiples of one over m okay so now we're gonna do is we're gonna relax it right so we're gonna simply ignore that last constraint that's that's that's a typical relaxation right relaxation in general just means you made the feasible set bigger right that that's all it means right uh and so we do that um okay now this this is actually it's kind of cool if you know"},{"id":79,"text":"So we're going to relax it like this. And then there's all sorts of things you can do with this. So we'll talk about solving it. But what's going to come up is you say, actually, what I'm really going to do is I'm going to choose for you the fractions of each of the experiment types that you should use, whatever your budget is. Maybe it's not going to fit into the integers, but if m is big, I don't think this is a problem. And then I'll give you lots of hints about what you could do."},{"id":80,"text":"Um, what you can do first, you go back to the person who said, do the experiment design and you'd say, yeah. Okay. What's your budget? And they'd say 57 and they go, great. You should do, you should use experiment number two, 6.45 times. And they would go like."},{"id":81,"text":"What does that mean? That means nothing. I can't use experiments. Every time I'm allowed to choose one of the experiments, I can't do it 6.45 times. Everybody see that? At this point, this is just very practical advice for all of you when you become part of the 364A diaspora. Here's what you can do. The first thing you do is you try to convince the person that..."},{"id":82,"text":"your relaxation is actually much more sophisticated. And you'd say, oh, yeah, no, look, don't tell me about six or seven. I don't care about that. This is much more sophisticated. You can drop things like you can make reference to quantum mechanics. That sometimes helps, right? Because you'd say like, look, it's not like you just choose an experiment each time. Anyway, you could say this is really like a probability. These are, in fact, the lambdas are going to be probabilities. And then it says, here's what you should do. Every time you should roll the dice with probability lambda."},{"id":83,"text":"And if 13 comes up, congratulations, you should do experiment 13. Everybody following what I'm saying? Anyway, some people actually like fall for this. It's actually kind of amazing, right? And, you know, you mentioned that, you know, and you anyway, you mumble about quantum mechanics and things like that. It's much more sophisticated. It's a probabilistic thing. And you can hint at other things like, hey, do you remember like Matrix games?"}],"notes":["本段讲解了松弛方法在实验设计中的应用。松弛方法的核心思想是扩大可行集，从而更容易找到解。在实验设计中，松弛方法允许将实验次数的分配转化为分数形式，例如将实验次数M1除以总实验次数M，从而得到一个分数比例。这种分数比例可以用于指导实验设计，即使实际实验次数必须为整数，但通过松弛方法可以得到一个更优的分配方案。","松弛方法通常意味着将约束条件放宽，使得可行解的集合变大。在本段中，松弛方法被用来忽略实验次数必须为整数的约束，从而允许使用分数形式的实验次数分配。这种做法在实际应用中非常有用，因为它可以提供更灵活的实验设计策略。","在实际应用中，即使松弛方法得到的实验次数分配是分数形式，例如6.45次，但实际操作中必须将其转化为整数。因此，松弛方法提供了一个理论上的指导，而实际应用中需要根据具体情况调整。","松弛方法可以与概率方法结合使用，例如将实验次数分配转化为概率分布。在这种情况下，每次实验的选择可以看作是一个概率事件，通过概率分布来决定实验的执行次数。这种方法在某些情况下更为直观和实用。","松弛方法还可以与其他概念结合使用，例如矩阵游戏。通过将实验设计问题转化为概率问题，可以利用概率方法和矩阵游戏的理论来指导实验设计，从而获得更优的解决方案。","松弛方法在实验设计中的应用需要考虑实际操作的可行性。虽然松弛方法可以提供理论上的最优解，但在实际应用中必须根据具体情况调整，以确保实验设计的可行性和有效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1154.75,"end":1334.07,"asr_flags":[],"raw_segments":[{"start":1154.75,"text":"So the relaxation is, you know what? I divide the M's by capital M. So instead of working with M1, I'm going to work with M1 divided by capital M. And then you're saying, what is the fraction of the total number of experiments you're going to do that are going to use, in fact, M1 over M? What is the fraction when you use experiment number one? Everybody make sense? Okay, so now if I do that,"},{"start":1183.21,"text":"we still have the constraint that those fractions are integer multiples of one over m okay so now we're gonna do is we're gonna relax it right so we're gonna simply ignore that last constraint that's that's that's a typical relaxation right relaxation in general just means you made the feasible set bigger right that that's all it means right uh and so we do that um okay now this this is actually it's kind of cool if you know"},{"start":1212.62,"text":"So we're going to relax it like this. And then there's all sorts of things you can do with this. So we'll talk about solving it. But what's going to come up is you say, actually, what I'm really going to do is I'm going to choose for you the fractions of each of the experiment types that you should use, whatever your budget is. Maybe it's not going to fit into the integers, but if m is big, I don't think this is a problem. And then I'll give you lots of hints about what you could do."},{"start":1241.64,"text":"Um, what you can do first, you go back to the person who said, do the experiment design and you'd say, yeah. Okay. What's your budget? And they'd say 57 and they go, great. You should do, you should use experiment number two, 6.45 times. And they would go like."},{"start":1258.48,"text":"What does that mean? That means nothing. I can't use experiments. Every time I'm allowed to choose one of the experiments, I can't do it 6.45 times. Everybody see that? At this point, this is just very practical advice for all of you when you become part of the 364A diaspora. Here's what you can do. The first thing you do is you try to convince the person that..."},{"start":1283.69,"text":"your relaxation is actually much more sophisticated. And you'd say, oh, yeah, no, look, don't tell me about six or seven. I don't care about that. This is much more sophisticated. You can drop things like you can make reference to quantum mechanics. That sometimes helps, right? Because you'd say like, look, it's not like you just choose an experiment each time. Anyway, you could say this is really like a probability. These are, in fact, the lambdas are going to be probabilities. And then it says, here's what you should do. Every time you should roll the dice with probability lambda."},{"start":1312.39,"text":"And if 13 comes up, congratulations, you should do experiment 13. Everybody following what I'm saying? Anyway, some people actually like fall for this. It's actually kind of amazing, right? And, you know, you mentioned that, you know, and you anyway, you mumble about quantum mechanics and things like that. It's much more sophisticated. It's a probabilistic thing. And you can hint at other things like, hey, do you remember like Matrix games?"}],"speech_gaps":[],"frame":"../frames/v011/008.webp","frame_time":1166.75},{"title":"随机策略与整数约束下的实验设计","segments":[{"id":84,"text":"Do you remember how there's generally not an equilibrium, and so you have to have a, what do you call it, what's it called, a randomized policy? And they would go, yeah. And you go, well, it's just like that. Anyway, that's fine. But supposing, in fact, you really had to do, someone said, no, dude, the drone is flying, and you have a budget of 120 experiments. So I need integers, right?"},{"id":85,"text":"So, someone tell me, what would you do? What would you do? Yeah, do you mean rounding? Yeah, yeah, here's what you'd do. You'd find your lambdas. It's going to be sort of, it's a continuous probability that you choose the experiment in a fraction, right? And you just round them, right? By the way, if you round them, and then you add up the rounded things, and they come up to 121, what do you do then? Just reduce one."},{"id":86,"text":"Okay, that's what you do. Everybody following this? And I'm not kidding with this. And you say, that's my experiment design. And they would say, awesome. And they would say, is that actually the one that is going to minimize the, is that going to give me the, is that going to be the best one? Is it going to minimize this confidence ellipsoid? What's the honest answer to that? No."},{"id":87,"text":"It probably would work. That's fair. That's one way to say no. So you'd say, they'd say, does it actually solve this problem? And you'd say, I don't really know. But what can you do to give some evidence that your rounded one is not so bad? We do the dual problem. Yeah. You don't even need the dual because this was a relaxation."},{"id":88,"text":"So what you do is, we'll wait until, this will make more sense when we scalarize this, right? So let's say, for example, what happens is you end up with the volume of the confidence ellipsoid. And someone says, does that choice actually minimize the volume of the confidence ellipsoid? And you go, actually, your answer was perfect. Probably. You'd say, it's very close. And they'd say, well, how do you know that? You go, well, because when I remove the constraint that these things are integers and I solve this problem, I found that the log of the volume was 12.6."},{"id":89,"text":"And you'd say, nobody could do better than that. That's if we ignore this silly constraint that these things are integers. And you'd say, my log volume was 12.7 when I rounded. Everybody got that? Then it's done. Then you're just done. Because you just say, I can show nobody can have a volume. Did I get that right? I did get it right. No one can have a volume less than 12.6."}],"notes":["本段讨论了在实验设计中如何处理整数约束的问题。当实验数量有限时，通常会采用随机策略，即通过连续概率分配实验选择，然后进行四舍五入。但四舍五入可能导致总和超出预算，此时需要调整。"],"formulas":[{"latex":"log(Volume) = 12.6","symbols":"log(Volume) 表示置信椭球体积的对数","explanation":"该公式表示在忽略整数约束的情况下，置信椭球体积的对数为12.6。此公式在原文中被明确提及，且没有数学错误。","evidence":"So what you do is, we'll wait until, this will make more sense when we scalarize this, right? So let's say, for example, what happens is you end up with the volume of the confidence ellipsoid. And someone says, does that choice actually minimize the volume of the confidence ellipsoid? And you go, actually, your answer was perfect. Probably. You'd say, it's very close. And they'd say, well, how do you know that? You go, well, because when I remove the constraint that these things are integers and I solve this problem, I found that the log of the volume was 12.6."}],"uncertainties":[],"diagram":"none","start":1334.75,"end":1504.4,"asr_flags":[],"math_clarifications":["原文中提到的置信椭球体积的对数为12.6是在忽略整数约束的情况下得出的，因此该公式是正确的。"],"raw_segments":[{"start":1334.75,"text":"Do you remember how there's generally not an equilibrium, and so you have to have a, what do you call it, what's it called, a randomized policy? And they would go, yeah. And you go, well, it's just like that. Anyway, that's fine. But supposing, in fact, you really had to do, someone said, no, dude, the drone is flying, and you have a budget of 120 experiments. So I need integers, right?"},{"start":1364.91,"text":"So, someone tell me, what would you do? What would you do? Yeah, do you mean rounding? Yeah, yeah, here's what you'd do. You'd find your lambdas. It's going to be sort of, it's a continuous probability that you choose the experiment in a fraction, right? And you just round them, right? By the way, if you round them, and then you add up the rounded things, and they come up to 121, what do you do then? Just reduce one."},{"start":1396.21,"text":"Okay, that's what you do. Everybody following this? And I'm not kidding with this. And you say, that's my experiment design. And they would say, awesome. And they would say, is that actually the one that is going to minimize the, is that going to give me the, is that going to be the best one? Is it going to minimize this confidence ellipsoid? What's the honest answer to that? No."},{"start":1422.78,"text":"It probably would work. That's fair. That's one way to say no. So you'd say, they'd say, does it actually solve this problem? And you'd say, I don't really know. But what can you do to give some evidence that your rounded one is not so bad? We do the dual problem. Yeah. You don't even need the dual because this was a relaxation."},{"start":1450.89,"text":"So what you do is, we'll wait until, this will make more sense when we scalarize this, right? So let's say, for example, what happens is you end up with the volume of the confidence ellipsoid. And someone says, does that choice actually minimize the volume of the confidence ellipsoid? And you go, actually, your answer was perfect. Probably. You'd say, it's very close. And they'd say, well, how do you know that? You go, well, because when I remove the constraint that these things are integers and I solve this problem, I found that the log of the volume was 12.6."},{"start":1480.44,"text":"And you'd say, nobody could do better than that. That's if we ignore this silly constraint that these things are integers. And you'd say, my log volume was 12.7 when I rounded. Everybody got that? Then it's done. Then you're just done. Because you just say, I can show nobody can have a volume. Did I get that right? I did get it right. No one can have a volume less than 12.6."}],"speech_gaps":[],"frame":"../frames/v011/009.webp","frame_time":1346.75},{"title":"放松的实验设计与矩阵可逆性","segments":[{"id":90,"text":"That's something you can... But we got one that has log volume 12.7. Make sense? Okay. All right, so this is relaxed experiment design. Actually, we will get to the dual of this very soon. Yes?"},{"id":91,"text":"Assumption of M must be much greater than the number of experiments. Sorry, where? Here? M must be greater than P. Assumption, assume... What, why, what, why is... The relaxed experiment design has assumed M much greater than P, and then using lambda k is equal to mk by m. Even over here? Yeah. Why is that there?"},{"id":92,"text":"Yeah, let's see why. Oh, the idea is I wanted these numbers to be reasonably, to be not too grainy. If I round it, I want to be able to get something that's close to an integer. I mean, you don't even need this, right? The first one. That doesn't matter, right? Yeah. Now, when you get down to a, well, okay, let's try this. What if I said you have three experiments, period?"},{"id":93,"text":"Can we solve that problem? I mean, it depends how big whatever it is. P is, right? P is the number of options, right? Let's suppose P is 20 or something. And I tell you, no, you have three experiments. Tell me what to do. Can we solve that?"},{"id":94,"text":"Just try all the combinations. Yeah, you try all. It's like p cubed. You just do, you try all combinations or whatever. It's not even p cubed. It's a lot less than that. It's like p cubed over 6, right? Or something like that, right? You try all of them. You find out. Okay, so that's, so for small ones, we can actually solve the actual, you know, and that's actually when you get into things like design of experiments. These are like grainy and, you know, they're kind of combinatorial, right? And these are tricky. Yeah? Professor, perhaps I didn't understand what you meant before about"},{"id":95,"text":"e not being invertible, but isn't this not required that e is invertible? Because you can make a solution where m1 is equal to m. Yeah, so you're going to have a problem though. Let me show you what the problem is. That when this is not invertible, we're going to interpret e as being basically infinite in those directions."},{"id":96,"text":"and we've asked you to minimize it. Now, by the way, when we scalarize it, we're going to be cool, right? Because we're going to have a log, a determinant, or a trace, and all that kind of stuff. And the problem is then, you'd say, if you do that, you're going to come up with plus infinity. Yeah, so we'll get to that in a minute. Yeah, but that's... Undesirable for it to be... Yes, in fact, in this case, infinitely undesirable. So what we'll do is we'll say that if this thing is invertible..."}],"notes":["本段讨论了放松的实验设计中M与P的关系，其中M必须远大于P。这是为了确保在设计实验时，可以使用lambda_k = m_k / m的公式。这种设计方法允许在不精确的情况下进行近似，从而简化计算。","在讨论中，教授提到当M远大于P时，可以使用lambda_k = m_k / m的公式。这表明在放松的实验设计中，需要确保M足够大，以避免数值上的不稳定。","教授进一步解释了为什么需要M远大于P，即为了使数值更平滑，避免过于粗糙的近似。他提到，如果直接四舍五入，可能会得到一个接近整数的值，但并不总是需要这样做。","教授还提到，当实验数量较小时，可以实际解决设计问题，例如通过尝试所有组合。然而，当实验数量较大时，这种方法变得不可行，因为组合数量会迅速增加。","教授指出，当矩阵e不可逆时，会导致问题变得不可解，因为此时e在某些方向上被视为无限大。这表明矩阵的可逆性在优化问题中至关重要。","最后，教授提到在标量化问题时，可能会遇到无穷大的情况，这在优化中是不可接受的。因此，需要确保矩阵e是可逆的，以避免这种问题。"],"formulas":[{"latex":"\\lambda_k = \\frac{m_k}{m}","symbols":"lambda_k 表示第k个实验的权重，m_k 表示第k个实验的次数，m 表示总实验次数","explanation":"公式正确，lambda_k 是 m_k 与总实验次数 m 的比值，符合实验设计中权重分配的常见表达方式。","evidence":"Assumption of M must be much greater than the number of experiments. Sorry, where? Here? M must be greater than P. Assumption, assume... What, why, what, why is... The relaxed experiment design has assumed M much greater than P, and then using lambda k is equal to mk by m. Even over here? Yeah. Why is that there?"},{"latex":"P","symbols":"P 表示实验选项的数量","explanation":"公式正确，P 表示实验选项的数量，符合上下文中的描述。","evidence":"Can we solve that problem? I mean, it depends how big whatever it is. P is, right? P is the number of options, right? Let's suppose P is 20 or something. And I tell you, no, you have three experiments. Tell me what to do. Can we solve that?"},{"latex":"e","symbols":"e 表示矩阵，其可逆性在优化问题中至关重要","explanation":"公式正确，e 表示矩阵，其可逆性在 et's say, lambda equals E1, that means I'm simply only going to do experiment one."},{"id":99,"text":"Then this matrix is non-invertible. I can take the minus one and put it out here. But then log determinant of a non-singular matrix is going to be minus infinity. Of a singular matrix, it's going to be minus infinity. And when I flip the sign, I get plus infinity. And it's like, nice choice of experiment design, but your objective is infinity. And given that we're minimizing it, I would call that a rather poor design."},{"id":100,"text":"I don't know if that explained that, but okay. All right. So this is called deoptimal experiment. There's whole books on this, which is kind of cool, I think, but that's okay. So, all right. You can actually work out the dual problem of this, which is actually a dual, right?"},{"id":101,"text":"And it turns out to be something that we're going to talk about possibly even later today. But it looks like this. You're going to end up with a maximize of the log determinant of W. W is going to be like a dual variable, plus a constant. And then you're going to have subject to this constant here. And this thing, let's just check that that is in fact a convex optimization problem with variable capital W, right? This is concave. Log determinant of a positive definite matrix is concave."},{"id":102,"text":"That's a constant, doesn't make any difference. What kind of inequality is this as a function of w? What is it? It's linear. It's just linear inequalities on w. It's quadratic in v's, but the v's are given to us. Those are the options for experiments that we carry out, right? So, okay. And we can actually interpret it really well. This is cool. This is an ellipsoid."},{"id":103,"text":"and it's centered at the origin, right? And this simply says, this thing here says that all the Vs are in the ellipsoid, right? And so what this says is, here's how you find, this tells you that there's a relation between this experiment design and actually you take your Vs, then find the minimum volume ellipsoid centered at the origin that covers them."}],"notes":["本段讨论了实验设计中矩阵不可逆的情况，当矩阵不可逆时，其对数行列式会趋向于负无穷，这表明实验设计不佳。同时，讲者提到对偶问题的构建，其中涉及最大化对数行列式和线性约束，这构成了一个凸优化问题。","讲者指出，对偶问题中的变量W是双变量，且目标函数是对数行列式，这是一个凹函数。约束条件是线性不等式，因此整个问题是一个凸优化问题。这表明对偶问题的结构清晰，便于求解。","讲者进一步解释了实验设计与椭球体之间的关系，指出通过选择实验变量V，可以找到一个以原点为中心、覆盖所有V的最小体积椭球体。这说明实验设计的目标是优化椭球体的体积，从而提高实验的效率。","讲者提到，椭球体的体积与实验设计密切相关，最小体积椭球体的构造是实验设计中的一个重要问题。这表明在优化过程中，需要考虑如何选择实验变量以达到最优的覆盖效果。","讲者还提到，实验设计中的对偶问题可能在后续课程中进一步讨论，这表明该问题具有一定的复杂性，需要更深入的分析。","讲者强调了凸优化在实验设计中的应用，通过构建对偶问题，可以更有效地解决实验设计中的优化问题。这表明凸优化理论在实际问题中的重要性。"],"formulas":[{"latex":"log\\det(W)","symbols":"对数行列式","explanation":"公式正确，表示矩阵W的对数行列式，符合数学表达。","evidence":"And it turns out to be something that we're going to talk about possibly even later today. But it looks like this. You're going to end up with a maximize of the log determinant of W. W is going to be like a dual variable, plus a constant. And then you're going to have subject to this constant here. And this thing, let's just check that that is in fact a convex optimization problem with variable capital W, right? This is concave. Log determinant of a positive definite matrix is concave."},{"latex":"log\\det(W) + c","symbols":"对数行列式加上常数","explanation":"公式正确，表示对数行列式加上一个常数c，符合数学表达。","evidence":"And it turns out to be something that we're going to talk about possibly even later today. But it looks like this. You're going to end up with a maximize of the log determinant of W. W is going to be like a dual variable, plus a constant. And then you're going to have subject to this constant here. And this thing, let's just check that that is in fact a convex optimization problem with variable capital W, right? This is concave. Log determinant of a positive definite matrix is concave."}],"uncertainties":[],"diagram":"none","start":1675.15,"end":1847.05,"asr_flags":[],"math_clarifications":["W在上下文中未明确其作为双变量的数学定义，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1
