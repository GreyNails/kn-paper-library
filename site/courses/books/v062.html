Y to a certain Q value of a state in a certain action. So what we would like is to minimize this loss function, meaning Y and the Q value for a given action in a given state is as close as possible."},{"start":2502.95,"text":"to each other. And we're going to leverage the reward and the Bellman equation. So let's do two things. Right now, we don't have a Y. So in supervised learning, you would have a picture of a cat. There's a cat. The Y is one or zero. Here, we don't have a Y. So we have to come up with an estimate of a good Y, at least better than random."},{"start":2524.14,"text":"So let's say at this point in time, when I send a state S in the network, it turns out that Q of going to the left is higher than Q of going to the right. Which means that today, at that moment, the Q function tells me it's better to go to the left than to go to the right. That is random at the beginning. It's completely random. So what I'm going to do is I'm going to use as my target value Y."}],"speech_gaps":[],"frame":"../frames/v062/015.webp","frame_time":2388.02},{"title":"贝尔曼方程与Q值更新","segments":[{"id":120,"text":"The immediate reward that I observe on the left plus gamma times the best Q value that I can get. So the best action that I could take in the next step based on my current Q value. That's very important. So remember, this target is off. It's not a perfect target, but it's better than nothing. Meaning not only it tells us."},{"id":121,"text":"Hey, there is a good reward to the left, we should consider that in saying that that might be a good move because we're seeing an immediate reward. But on top of that, we also know that at the end of training, the Q value should follow the Bellman equation. So why don't we set the target as the Bellman equation? So we add the discounted maximum future reward when you are in the next state. So you were in state S, you go to the left. Now you're in state S next left."},{"id":122,"text":"And you look again at your Q values and you select the best one, then you add that number here. So there is actually two forward paths in that process, right? There is one forward path."},{"id":123,"text":"Where you send the state S in Q, and you look at the two options, left or right, and you're like, okay, I'm going to the left. And then you're like, I'm going to compare that value to a target Y, but to get that target Y, I need to do another forward path. So I take my action left, I perform it, I get an S prime state, S next, and I send that S next into the Q network. I look at the two options I have, I pick the best one, and I add it here with the discount."},{"id":124,"text":"So fundamentally, what's happening is the following. We have a Q network that's random at the beginning. It has never observed the rewards. We just know that at some point, it will get to a perfect policy. It will get to a perfect Q function. But the best we can do right now is to say, as a guide to..."},{"id":125,"text":"For our agent, we will look at the immediate reward and we will look at the Bellman equation, which should tell us a better estimate than where we are right now. And we will try to catch up to that estimate. And then we do that again and again. So remember, every time your Q gets better, it gets better for the next state as well. So, you know, the Bellman equation tells you estimate it with the second forward path and you just keep getting better and better as you're observing more rewards."}],"notes":["本段讲解了强化学习中Q值更新的核心思想，即通过当前状态的即时奖励和未来奖励的折扣值来估计目标Q值。讲者强调，这个目标不是完美的，但比不考虑未来奖励的估计更好。"],"formulas":[],"uncertainties":["在讲者提到'Q network that's random at the beginning'时，'Q network'是否指代Q函数或Q网络存在歧义。"],"diagram":"bellman","start":2553.13,"end":2713.77,"asr_flags":[],"raw_segments":[{"start":2553.13,"text":"The immediate reward that I observe on the left plus gamma times the best Q value that I can get. So the best action that I could take in the next step based on my current Q value. That's very important. So remember, this target is off. It's not a perfect target, but it's better than nothing. Meaning not only it tells us."},{"start":2584.91,"text":"hey, there is a good reward to the left, we should consider that in saying that that might be a good move because we're seeing an immediate reward. But on top of that, we also know that at the end of training, the Q value should follow the Bellman equation. So why don't we set the target as the Bellman equation? So we add the discounted maximum future reward when you are in the next state. So you were in state S, you go to the left. Now you're in state S next left."},{"start":2613.61,"text":"and you look again at your Q values and you select the best one, then you add that number here. So there is actually two forward paths in that process, right? There is one forward path."},{"start":2630.72,"text":"where you send the state S in Q, and you look at the two options, left or right, and you're like, okay, I'm going to the left. And then you're like, I'm going to compare that value to a target Y, but to get that target Y, I need to do another forward path. So I take my action left, I perform it, I get an S prime state, S next, and I send that S next into the Q network. I look at the two options I have, I pick the best one, and I add it here with the discount."},{"start":2661.76,"text":"So fundamentally, what's happening is the following. We have a queue network that's random at the beginning. It has never observed the rewards. We just know that at some point, it will get to a perfect policy. It will get to a perfect queue function. But the best we can do right now is to say, as a guide to..."},{"start":2686.71,"text":"For our agent, we will look at the immediate reward and we will look at the Bellman equation, which should tell us a better estimate than where we are right now. And we will try to catch up to that estimate. And then we do that again and again. So remember, every time your Q gets better, it gets better for the next state as well. So, you know, the Bellman equation tells you estimate it with the second forward path and you just keep getting better and better as you're observing more rewards."}],"speech_gaps":[],"frame":"../frames/v062/016.webp","frame_time":2565.13},{"title":"强化学习中的目标Y与Q函数更新","segments":[{"id":126,"text":"How would you describe the loop? Yeah, you would stop at that point. Yeah, this is a good question. I'll show you how we fix certain things, but you do only one step, meaning you have your Q value at this point, and it tells you go to the left, and you just want to target Y. So what you do is you put left."},{"id":127,"text":"and you look at your next state, you forward propagate your next state, you look at the two options, you pick the best, you don't go further, you just use that one step, you look one step ahead, essentially, you don't look multiple steps ahead, you could, but it would be more computationally heavy to do one more step again, and so on, so yeah, um"},{"id":128,"text":"It will typically be a function of the environment, the state space, how long it will take to converge. But you're perfectly right that as the Q function gets better, the estimate Y also gets better. So the two things get better together, right? Because the Y is based on the Q function. And if the state space is massive, you might have a very difficult time training this model. There's better approaches that we'll see later."},{"id":129,"text":"Yeah, correct. There was a question there. Yeah, so here I'm just saying, let's say when you send state S in Q, the left happens to be higher than right. But the same happens on the other side. Let's say the left is worse than right. Then what you will do is you will define your target Y as the reward that you observe on the right."},{"id":130,"text":"Plus from the next state of having gone to the right, what's the best action and what's the Q value for that pair? And then it will give you the target for that scenario. So one complication with this training is that."},{"id":131,"text":"When you want to differentiate L, so you want to perform a back propagation, you want to take the derivative of L with respect to the parameters of the network, you want Y to be a fixed thing, right? Because in supervised learning, Y is not differentiable. It's just a fixed number, 0 or 1 or a certain number. So here we're going to simplify and we're going to say this term that is dependent on the Q network. So technically, this term has parameters. So if you actually differentiate it, it will give you a value. We'll just hold it."},{"id":132,"text":"we do use our QNetwork"},{"id":133,"text":"to perform an estimate of our Y"},{"id":134,"text":"to perform an estimate of our Y"}],"notes":["本段讲解了强化学习中目标Y的定义和Q函数的更新过程。教师指出，在每一步中，智能体根据当前状态和Q值选择动作，并基于下一个状态的奖励和Q值来计算目标Y。这种单步更新方式避免了多步预测的计算复杂性。","教师强调了在训练过程中，Y的计算依赖于Q函数的准确性。随着Q函数的改进，Y的估计也会随之提高，两者是相互促进的。然而，当状态空间非常大时，训练模型可能会变得困难，因此后续会介绍更优的方法。","在进行反向传播时，教师指出Y需要保持固定，以便进行梯度计算。这与监督学习中的情况类似，其中Y是固定的标签。然而，在强化学习中，Y依赖于Q网络，因此在实际计算中需要处理其参数的依赖性。","教师提到，为了简化计算，会将Y的估计视为固定值，尽管它实际上依赖于Q网络的参数。这种处理方式有助于进行梯度下降优化。","教师在最后提到使用Q网络来估计Y，这表明Q网络在强化学习中扮演了关键角色，用于预测未来奖励和动作的价值，从而指导智能体的决策。","教师通过具体的例子说明了如何根据当前状态和Q值选择动作，并计算目标Y。例如，当左动作的Q值高于右动作时，目标Y将基于右动作的奖励和Q值进行计算。"],"formulas":[],"uncertainties":["在段落130中，'we'll just hold it'的含义可能不明确，需要进一步澄清。"],"diagram":"none","start":2731.16,"end":2910.55,"asr_flags":[],"math_clarifications":["原始公式中的Y被定义为即时奖励r加上下一状态s'下采取动作a的最大Q值。然而，根据上下文，Y应为基于当前Q值和奖励的估计值，而不是直接等于r加上最大Q值。因此，该公式需要修正以反映正确的计算方式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2731.16,"text":"How would you describe the loop? Yeah, you would stop at that point. Yeah, this is a good question. I'll show you how we fix certain things, but you do only one step, meaning you have your Q value at this point, and it tells you go to the left, and you just want to target Y. So what you do is you put left."},{"start":2761.96,"text":"and you look at your next state you forward propagate your next state you look at the two options you pick the best you don't go further you just use that one step you look one step ahead essentially you don't look multiple steps ahead you could but it would be more computationally heavy to do one more step again and so on so yeah um"},{"start":2799.84,"text":"It will typically be a function of the environment, the state space, how long it will take to converge. But you're perfectly right that as the Q function gets better, the estimate Y also gets better. So the two things get better together, right? Because the Y is based on the Q function. And if the state space is massive, you might have a very difficult time training this model. There's better approaches that we'll see later."},{"start":2829.43,"text":"Yeah, correct. There was a question there. Yeah, so here I'm just saying, let's say when you send state S in Q, the left happens to be higher than right. But the same happens on the other side. Let's say the left is worse than right. Then what you will do is you will define your target Y as the reward that you observe on the right."},{"start":2857.24,"text":"Plus from the next state of having gone to the right, what's the best action and what's the Q value for that pair? And then it will give you the target for that scenario. So one complication with this training is that."},{"start":2875.29,"text":"When you want to differentiate L, so you want to perform a back propagation, you want to take the derivative of L with respect to the parameters of the network, you want Y to be a fixed thing, right? Because in supervised learning, Y is not differentiable. It's just a fixed number, 0 or 1 or a certain number. So here we're going to simplify and we're going to say this term that is dependent on the Q network. So technically, this term has parameters. So if you actually differentiate it, it will give you a value. We'll just hold it."},{"start":2904.39,"text":"fixed. So we say"},{"start":2906.57,"text":"we do use our QNetwork"},{"start":2908.79,"text":"to perform an estimate of our Y"}],"speech_gaps":[],"frame":"../frames/v062/017.webp","frame_time":2743.16},{"title":"折扣因子与策略更新","segments":[{"id":135,"text":"but we will not differentiate it."},{"id":136,"text":"We will say it's fixed."},{"id":137,"text":"Because"},{"id":138,"text":"going back to the reason"},{"id":139,"text":"we discount is like the value of time."},{"id":140,"text":"It's like you probably want to say"},{"id":141,"text":"if you can win the game in 10 moves"},{"id":142,"text":"win it in 10 moves rather than 100"},{"id":143,"text":"moves. Or"},{"id":144,"text":"Or if you can get $1 today, get $1 today rather than in 10 years."},{"id":145,"text":"All of that is why we have a discount here."},{"id":146,"text":"And the discount is a hyperparameter that you would define as well."},{"id":147,"text":"That would influence the strategy of your agent."},{"id":148,"text":"We're going to see it after, actually."},{"id":149,"text":"I'm going to do a concrete example because it's a little complicated."},{"id":150,"text":"No, no, no."},{"id":151,"text":"It's a good point."},{"id":152,"text":"it's not that it's just q of it's it's a two by two it's a one by two so you have left and"},{"id":153,"text":"right i was just going down the first case so i put the state left yeah yeah"},{"id":154,"text":"what if the rewards are not fixed i mean in most games we're going to see right now the rewards"},{"id":155,"text":"are going to be fixed by the designer of the game the human that's designing the game in practice"},{"id":156,"text":"you could have a separate function that actually comes up with the reward. We're going to see an"},{"id":157,"text":"example later in the lecture where the reward might be different in different scenarios and"},{"id":158,"text":"there's a function or sometimes called a critique that determines what's the reward in a certain"},{"id":159,"text":"Okay, this is one last question and then we move because we're going to see a concrete example is going to be clear. So when we hold it fixed for backup, is that what differentiates this from iterating through all of the possible actions? Yeah. So instead of doing the backtracking down the tree and going over everything, we're saying we're going to limit ourselves to just picking the best action based on our current understanding of the network."},{"id":160,"text":"You see, my network is kind of intelligent, not great. We're in the middle of training. It says that I should go to the left. And then if I look at the next state when I'm in the left, it says I should go to the right. I will trust it because it's the best I have, best estimate I have. But I will discount that. And then if you keep repeating that, it turns out that not only your estimate gets better, but your model gets trained. And then ultimately, both together get to an optimality equation. So it's a funky concept, right?"},{"id":161,"text":"But you get it. We're going to see examples."},{"id":162,"text":"OK, so then once you have been able to use the Bellman equation to estimate your targets, you perform a classic back propagation and you update the parameters of the network and you repeat that process."}],"notes":["本段主要讲解了折扣因子（discount factor）的概念，它用于衡量未来奖励的价值，类似于时间价值。折扣因子是一个超参数，会影响智能体的策略。讲者提到，折扣因子的存在是为了让智能体更重视当前的奖励，而不是遥远的未来奖励。例如，获得1美元今天比10年后获得1美元更有价值。"],"formulas":[],"uncertainties":["it's not that it's just q of it's it's a two by two it's a one by two so you have left and","right i was just going down the first case so i put the state left yeah yeah","what if the rewards are not fixed i mean in most games we're going to see right now the rewards","are going to be fixed by the designer of the game the human that's designing the game in practice","you could have a separate function that actually comes up with the reward. We're going to see an","example later in the lecture where the reward might be different in different scenarios and","there's a function or sometimes called a critique that determines what' in a certain"},{"start":3008.59,"text":"Okay, this is one last question and then we move because we're going to see a concrete example is going to be clear. So when we hold it fixed for backup, is that what differentiates this from iterating through all of the possible actions? Yeah. So instead of doing the backtracking down the tree and going over everything, we're saying we're going to limit ourselves to just picking the best action based on our current understanding of the network."},{"start":3038.52,"text":"You see, my network is kind of intelligent, not great. We're in the middle of training. It says that I should go to the left. And then if I look at the next state when I'm in the left, it says I should go to the right. I will trust it because it's the best I have, best estimate I have. But I will discount that. And then if you keep repeating that, it turns out that not only your estimate gets better, but your model gets trained. And then ultimately, both together get to an optimality equation. So it's a funky concept, right?"},{"start":3069.23,"text":"But you get it. We're going to see examples."},{"start":3073.95,"text":"OK, so then once you have been able to use the Bellman equation to estimate your targets, you perform a classic back propagation and you update the parameters of the network and you repeat that process."}],"speech_gaps":[{"start":2947.92,"end":2950.19}],"frame":"../frames/v062/018.webp","frame_time":2922.55},{"title":"Q学习算法与Breakout游戏应用","segments":[{"id":163,"text":"process. Here is concretely, if you were to code it in pseudocode, here is what it would"},{"id":164,"text":"look like to train an RL agent using Q-learning. We start by initializing our Q-network parameters,"},{"id":165,"text":"so initialization. It's random at first. Then we will loop over episode. As a reminder,"},{"id":166,"text":"their episodes are one full game"},{"id":167,"text":"from start to terminal state."},{"id":168,"text":"Within"},{"id":169,"text":"an episode, we're going to start from"},{"id":170,"text":"the initial state S, and we're going to loop"},{"id":171,"text":"over time steps until"},{"id":172,"text":"we reach a terminal state."},{"id":173,"text":"So within"},{"id":174,"text":"one time step, here's what we"},{"id":175,"text":"will do. We forward propagate"},{"id":176,"text":"the state S in the queue network."},{"id":177,"text":"We will execute the action"},{"id":178,"text":"A that has the maximum queue value."},{"id":179,"text":"We will observe a reward,"},{"id":180,"text":"and we will also observe a next state, S'."},{"id":181,"text":"We will use that S' to compute our target Y"},{"id":182,"text":"by forward propagating S' in the Q network"},{"id":183,"text":"and then computing our loss function."},{"id":184,"text":"And based on that, we will use gradient descent"},{"id":185,"text":"to update the parameters of the network."},{"id":186,"text":"Should be simpler looked at like that, right?"},{"id":187,"text":"Okay, so this is the vanilla Q learning."},{"id":188,"text":"So to summarize again, the main difference is that we don't have a target and we use our own network to estimate the target."},{"id":189,"text":"And the rewards are what's going to help us get better over time."},{"id":190,"text":"By the way, it's okay if you don't understand everything."},{"id":191,"text":"This is an entire class at Stanford, an entire quarter of studying that type of stuff."},{"id":192,"text":"So we're trying to get the basics within an hour and a half, two hours."},{"id":193,"text":"okay let's go a little further now together um"},{"id":194,"text":"and apply that to an actual game so here's the game it's called breakout"},{"id":195,"text":"we want to destroy all the bricks who has played breakout in the past"},{"id":196,"text":"what do you feel okay good so you have a paddle that you control and you are trying to"},{"id":197,"text":"destroy the bricks if the ball gets past your paddle you lost and if the bricks are all"},{"id":198,"t {"start":3154.07,"text":"and then computing our loss function."},{"start":3156.29,"text":"And based on that, we will use gradient descent"},{"start":3159.73,"text":"to update the parameters of the network."},{"start":3164.09,"text":"Should be simpler looked at like that, right?"},{"start":3168.63,"text":"Okay, so this is the vanilla Q learning."},{"start":3173.19,"text":"So to summarize again, the main difference is that we don't have a target and we use our own network to estimate the target."},{"start":3180.45,"text":"And the rewards are what's going to help us get better over time."},{"start":3189.41,"text":"By the way, it's okay if you don't understand everything."},{"start":3191.21,"text":"This is an entire class at Stanford, an entire quarter of studying that type of stuff."},{"start":3196.61,"text":"So we're trying to get the basics within an hour and a half, two hours."},{"start":3202.53,"text":"okay let's go a little further now together um"},{"start":3208.31,"text":"and apply that to an actual game so here's the game it's called breakout"},{"start":3212.17,"text":"we want to destroy all the bricks who has played breakout in the past"},{"start":3216.15,"text":"what do you feel okay good so you have a paddle that you control and you are trying to"},{"start":3223.21,"text":"destroy the bricks if the ball gets past your paddle you lost and if the bricks are all"},{"start":3228.97,"text":"destroyed you want. That's it. Let's do it together. What is the input of our queue network?"},{"start":3240.55,"text":"What would you use as input?"},{"start":3243.89,"text":"Yes. Entire screen. Okay, let's do that. So I think I define that as the state s."},{"start":3258.97,"text":"Which is the input to my Q network."},{"start":3261.53,"text":"What's the output of the Q network?"},{"start":3265.43,"text":"Yes."}],"speech_gaps":[],"frame":"../frames/v062/019.webp","frame_time":3101.59},{"title":"深度强化学习中的输出与输入处理","segments":[{"id":204,"text":"Good question."},{"id":205,"text":"We'll get there."},{"id":206,"text":"I'm going to ask you, but do we have to look at the full screen?"},{"id":207,"text":"Answer is no, but we'll see why. What's the output? Yeah. The game score? No, but we're going to talk about the game score in the back. Yeah, let's talk about the output first, and then we'll talk about the stuff we can get rid of on the inputs. But what's the output? Yeah. The actions? Yeah, the actions. So, yeah, it will be the Q values."},{"id":208,"text":"associated with the actions in state s, remember it's a q function, so the output is we need one value for left, one value for right, and one value for idle. You could make this game more complicated and say"},{"id":209,"text":"We have eight actions. We have a little bit to the left, a lot to the left, a lot more to the left. You know, if you had multiple buttons, but let's simplify and say three actions. Either you don't move, you move to the left or you move to the right. So these are the outputs. So now let's get to the question of the screen. Do we need the entire screen? So you were saying something earlier."},{"id":210,"text":"Okay, so you say you need the tray and the bricks. I would argue you need more because there's the walls. And I guess that you could, if you're an expert player, you could know where the walls are. But generally, you need a little more than that. What would be obviously things we can get rid of? And why would we do that? Okay, the score at the top. Who would remove the score at the top? About half? Why would you not remove it? Why would you remove it?"},{"id":211,"text":"OK, you want to always win. So the score doesn't matter. It's true. We would remove the score. So you could actually crop the top. You could also crop the bottom. I mean, if you pass the paddle, you don't care about the few pixels at the bottom. You could get rid of them. This is not always true. There are games where the score matters. And in fact."},{"id":212,"text":"I like football, soccer. In soccer, if you're 1-0 up, you can park the bus. So your strategy is dependent on the score that you have. You wouldn't park the bus if you're losing 1-0. Parking the bus means you ask every player to come back and defend. If you're losing, you would actually do the opposite. You would go all-out attack."}],"notes":["本段讨论了深度强化学习中输出与输入的处理。讲者首先指出输出应为与动作相关的Q值，即每个动作对应一个值，如左、右、不动。接着，讲者提到输入处理时，是否需要整个屏幕，以及哪些部分可以被裁剪或去除。","讲者通过游戏中的例子说明，输出应为与动作相关的Q值，而输入处理时，如屏幕信息，可以去除不重要的部分，如顶部的分数和底部的像素，但并非所有情况下都适用。","讲者以足球比赛为例，说明在某些情况下，分数信息对策略制定至关重要，因此不能简单地去除。这表明输入处理需根据具体任务进行调整。","讲者强调了输入处理的灵活性，即根据任务需求去除或保留某些信息，如屏幕的某些部分，但需注意不同任务的差异性。","讲者通过足球比赛的策略变化，说明了输入信息（如分数）对策略制定的影响，进一步强调了输入处理的重要性。","本段内容主要围绕深度强化学习中输出与输入的处理，强调了Q值输出和输入信息裁剪的必要性，以及不同任务中输入处理的差异性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3269.07,"end":3437.45,"asr_flags":[],"raw_segments":[{"start":3269.07,"text":"Good question."},{"start":3269.93,"text":"We'll get there."},{"start":3270.81,"text":"I'm going to ask you, but do we have to look at the full screen?"},{"start":3275.94,"text":"Answer is no, but we'll see why. What's the output? Yeah. The game score? No, but we're going to talk about the game score in the back. Yeah, let's talk about the output first, and then we'll talk about the stuff we can get rid of on the inputs. But what's the output? Yeah. The actions? Yeah, the actions. So, yeah, it will be the Q values."},{"start":3307.07,"text":"associated with the actions in state s remember it's a q function so the output is we need one value for left one value for right and one value for idle you could make this game more complicated and say"},{"start":3319.39,"text":"We have eight actions. We have a little bit to the left, a lot to the left, a lot more to the left. You know, if you had multiple buttons, but let's simplify and say three actions. Either you don't move, you move to the left or you move to the right. So these are the outputs. So now let's get to the question of the screen. Do we need the entire screen? So you were saying something earlier."},{"start":3348.17,"text":"Okay, so you say you need the tray and the bricks. I would argue you need more because there's the walls. And I guess that you could, if you're an expert player, you could know where the walls are. But generally, you need a little more than that. What would be obviously things we can get rid of? And why would we do that? Okay, the score at the top. Who would remove the score at the top? About half? Why would you not remove it? Why would you remove it?"},{"start":3395.36,"text":"OK, you want to always win. So the score doesn't matter. It's true. We would remove the score. So you could actually crop the top. You could also crop the bottom. I mean, if you pass the paddle, you don't care about the few pixels at the bottom. You could get rid of them. This is not always true. There are games where the score matters. And in fact."},{"start":3416.75,"text":"I like football, soccer. In soccer, if you're 1-0 up, you can park the bus. So your strategy is dependent on the score that you have. You wouldn't park the bus if you're losing 1-0. Parking the bus means you ask every player to come back and defend. If you're losing, you would actually do the opposite. You would go all-out attack."}],"speech_gaps":[],"frame":"../frames/v062/020.webp","frame_time":3281.07},{"title":"图像预处理与历史帧的重要性","segments":[{"id":213,"text":"So in certain games, you want the scores. In others, you don't want. And so it's part of the designer, the AI engineer that's working on that to determine what information we need and what we don't need. What else can we do to reduce the dimensionality of the problem and make our computation faster?"},{"id":214,"text":"Yeah, remove the RGB channels, so do grayscale, essentially. That's true. Here, you actually don't need the colors. It's just nice as a user for user experience purposes. You don't need, I don't think there's different points based on the bricks that you destroy. It's all the same. Actually, funny enough, this algorithm was used by..."},{"id":215,"text":"DeepMind to play a lot of Atari games, and they did a single preprocessing where they removed the channels because they said it doesn't matter. Turns out in one of the games, I think it was Sequest, I forgot which one, the fish disappeared when you did that. And so that game didn't work. The agent couldn't crack it because they thought that the same preprocessing could apply to every game, but actually they had to make a slight tweak. Correct."},{"id":216,"text":"So just to recap, you could do it even better by using a low dimensional representation of this game that describes the game. It's true, but because we want to use a single algorithm for 50 plus Atari games, we say the human sees the screen, we just give the screen and it will probably scale better."},{"id":217,"text":"essentially but you're perfectly right if you are working on only that game okay so let's do that we will do pre-processing there's one last thing that nobody mentioned which is history because in fact if you get only one screen you don't know where the ball is going"},{"id":218,"text":"So actually, you can solve the game. And the way you fix that is by giving a history of multiple screens. For example, four screens so that you see the direction that the ball is going in. So our preprocessing function is called Phi of S, let's say. And Phi of S is a mix of, you know, you might do convert to grayscale, reduce the dimension, the height and width, and also add the history of four frames. And that should be enough."},{"id":219,"text":"Turns out in most games, you will need the history, a little bit of history to know where the ball is going. In this example, can you not just encode the velocity vector of the ball? Yeah, you could replace the history, so multiple screens, by just adding the gradient or the velocity of where the ball is going. That's true, but would it scale to every game? Turns out this, because we know humans look at the Atari machine and they look at pixels, this would be more likely to scale to every game."}],"notes":["本段讨论了图像预处理在深度强化学习中的重要性，特别是颜色通道的去除和历史帧的使用。讲者指出，虽然去除颜色通道可以减少计算复杂度，但某些游戏（如Sequest）中，这种预处理会导致关键信息丢失，从而影响智能体的表现。因此，需要根据具体游戏进行调整。","讲者强调了历史帧在游戏理解中的作用，指出仅使用单帧图像无法捕捉球的运动方向，因此需要结合多个帧的信息。这表明，历史帧的引入有助于智能体更好地理解游戏动态。","讲者提到，虽然可以使用球的速度向量来替代历史帧，但这种方法可能无法适用于所有游戏。因此，采用基于像素的历史帧处理方式更有可能在不同游戏中保持一致性。","讲者指出，预处理函数Phi(S)通常包括灰度转换、尺寸缩减和历史帧的添加。这种综合处理方式能够有效降低维度，同时保留足够的信息以支持智能体的学习。","讲者提到，人类在观察Atari游戏时依赖像素信息，因此基于像素的预处理方法更有可能在不同游戏中保持一致性。这表明，预处理方法的选择需要考虑人类的感知方式。","讲者强调了在深度强化学习中，预处理方法的选择需要根据具体游戏进行调整，不能一概而论。这表明，预处理方法的灵活性和适应性是关键因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3438.43,"end":3605.87,"asr_flags":[],"raw_segments":[{"start":3438.43,"text":"So in certain games, you want the scores. In others, you don't want. And so it's part of the designer, the AI engineer that's working on that to determine what information we need and what we don't need. What else can we do to reduce the dimensionality of the problem and make our computation faster?"},{"start":3455.66,"text":"Yeah, remove the RGB channels, so do grayscale, essentially. That's true. Here, you actually don't need the colors. It's just nice as a user for user experience purposes. You don't need, I don't think there's different points based on the bricks that you destroy. It's all the same. Actually, funny enough, this algorithm was used by..."},{"start":3477.95,"text":"DeepMind to play a lot of Atari games, and they did a single preprocessing where they removed the channels because they said it doesn't matter. Turns out in one of the games, I think it was Sequest, I forgot which one, the fish disappeared when you did that. And so that game didn't work. The agent couldn't crack it because they thought that the same preprocessing could apply to every game, but actually they had to make a slight tweak. Correct."},{"start":3516.92,"text":"So just to recap, you could do it even better by using a low dimensional representation of this game that describes the game. It's true, but because we want to use a single algorithm for 50 plus Atari games, we say the human sees the screen, we just give the screen and it will probably scale better."},{"start":3534.43,"text":"essentially but you're perfectly right if you are working on only that game okay so let's do that we will do pre-processing there's one last thing that nobody mentioned which is history because in fact if you get only one screen you don't know where the ball is going"},{"start":3548.44,"text":"So actually, you can solve the game. And the way you fix that is by giving a history of multiple screens. For example, four screens so that you see the direction that the ball is going in. So our preprocessing function is called Phi of S, let's say. And Phi of S is a mix of, you know, you might do convert to grayscale, reduce the dimension, the height and width, and also add the history of four frames. And that should be enough."},{"start":3576.22,"text":"Turns out in most games, you will need the history, a little bit of history to know where the ball is going. In this example, can you not just encode the velocity vector of the ball? Yeah, you could replace the history, so multiple screens, by just adding the gradient or the velocity of where the ball is going. That's true, but would it scale to every game? Turns out this, because we know humans look at the Atari machine and they look at pixels, this would be more likely to scale to every game."}],"speech_gaps":[],"frame":"../frames/v062/021.webp","frame_time":3450.43},{"title":"深度强化学习中的预处理与训练技巧","segments":[{"id":220,"text":"Like think about a game where actually Sequest is a good game or Space Invaders where you have multiple enemies coming at you, then you would need to change your pre-processing to take into account the velocity of all these enemies so it wouldn't work the same way. While if you actually give the pixels, you actually from the pixels get the velocity of all your enemies and the directions they're going."},{"id":221,"text":"So this is our preprocessing. I'm going to refer to it as 5S. And our DeepQ network architecture, because we're working with pixels, is going to be a convolutional network. Don't worry if you haven't learned it yet in the class, but it's a bunch of conv and relu activations. And then we end with a fully connected layer that gives us the three Q values for the different actions. So nothing special here."},{"id":222,"text":"We're going to go back to our vanilla training. So this one that we saw together earlier. And we're going to look at tips to train reinforcement learning algorithms. Those tips are not specific to Q-learning. Some of them are applied to a lot more than Q-learning. And they're very important to know. And they're part of the reason reinforcement learning has worked better in the last few years."},{"id":223,"text":"So one of the things that's pretty simple that we forgot to do is the preprocessing that we just did. So anywhere I had an S, I'm going to instead run S through the preprocessing step. I'm going to use phi of S. So I initialize instead of S with phi of S. I start from the initial state phi of S, and then I forward propagate phi of S. I get the Q of..."},{"id":224,"text":"that pre-processed state in action A, and et cetera, et cetera. And then when I get my next state, so let's say I look at my current pre-processed state, I forward propagate it once, I see the three Q values, in our case the two Q values, one of them was better than the other, action right, then I get my next state, S prime, I want to pre-process that state as well. So that's pretty straightforward. You just replace all of that."},{"id":225,"text":"The second thing we forgot to do is to keep track of the terminal states. In our pseudocode, there is no concept of terminal states. It's pretty easy to add. You would probably just do an if-else statement. You would create a Boolean to detect terminal states. So let's say your Boolean is terminal equals false. And then as you loop over the time step of a single episode, every time you're going to check is."}],"notes":["本段主要讲解了在强化学习中预处理的重要性，特别是在处理像Space Invaders这样的游戏时，需要从像素中提取敌人的速度和方向信息。预处理步骤被称作5S，是DeepQ网络架构的一部分，该架构使用卷积网络处理像素数据，最后通过全连接层输出不同动作的Q值。","讲者提到在训练过程中需要将原始状态S替换为预处理后的状态phi(S)，并在每个时间步检查是否到达终端状态。这一步骤对于确保算法正确处理游戏结束的情况非常重要。","讲者强调了预处理和终端状态检测是训练强化学习算法时的两个关键点，这些技巧不仅适用于Q-learning，也适用于其他算法。这些技巧是近年来强化学习取得更好效果的重要原因之一。","讲者提到在伪代码中没有终端状态的概念，但可以通过简单的if-else语句来实现。终端状态的检测可以通过布尔变量来实现，这有助于在每个时间步判断是否结束当前回合。","讲者还提到在处理下一个状态S'时，也需要进行预处理，以确保所有状态都经过相同的预处理步骤，从而保持输入的一致性。","讲者强调了预处理和终端状态检测在强化学习训练中的重要性，这些步骤是确保算法正确性和稳定性的重要组成部分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3609.06,"end":3763.64,"asr_flags":[],"raw_segments":[{"start":3609.06,"text":"Like think about a game where actually Sequest is a good game or Space Invaders where you have multiple enemies coming at you, then you would need to change your pre-processing to take into account the velocity of all these enemies so it wouldn't work the same way. While if you actually give the pixels, you actually from the pixels get the velocity of all your enemies and the directions they're going."},{"start":3630.94,"text":"So this is our preprocessing. I'm going to refer to it as 5S. And our DeepQ network architecture, because we're working with pixels, is going to be a convolutional network. Don't worry if you haven't learned it yet in the class, but it's a bunch of conf and relu activations. And then we end with a fully connected layer that gives us the three Q values for the different actions. So nothing special here."},{"start":3661.88,"text":"We're going to go back to our vanilla training. So this one that we saw together earlier. And we're going to look at tips to train reinforcement learning algorithms. Those tips are not specific to Q-learning. Some of them are applied to a lot more than Q-learning. And they're very important to know. And they're part of the reason reinforcement learning has worked better in the last few years."},{"start":3684.62,"text":"So one of the things that's pretty simple that we forgot to do is the preprocessing that we just did. So anywhere I had an S, I'm going to instead run S through the preprocessing step. I'm going to use phi of S. So I initialize instead of S with phi of S. I start from the initial state phi of S, and then I forward propagate phi of S. I get the Q of..."},{"start":3710.03,"text":"that pre-processed state in action A, and et cetera, et cetera. And then when I get my next state, so let's say I look at my current pre-processed state, I forward propagate it once, I see the three Q values, in our case the two Q values, one of them was better than the other, action right, then I get my next state, S prime, I want to pre-process that state as well. So that's pretty straightforward. You just replace all of that."},{"start":3742.02,"text":"The second thing we forgot to do is to keep track of the terminal states. In our pseudocode, there is no concept of terminal states. It's pretty easy to add. You would probably just do an if-else statement. You would create a Boolean to detect terminal states. So let's say your Boolean is terminal equals false. And then as you loop over the time step of a single episode, every time you're going to check is."}],"speech_gaps":[],"frame":"../frames/v062/022.webp","frame_time":3621.06},{"title":"终端状态与经验回放","segments":[{"id":226,"text":"The state that I'm going into based on the action, I'm taking a terminal state. If it's a terminal state, then get out of the loop. There's nothing else after. The one thing that you need to be careful of is if it's a terminal state, then your target is not the Bellman equation. It's just the immediate reward. Remember, you get to the terminal state, you get a reward of 10. There's no Bellman equation to apply. It's just 10. It's immediate reward. There's no discount, etc."},{"id":227,"text":"Okay, so these are fairly easy changes. Now we're going to look at a new method that will enable more data efficiency. It's called experience replay. A couple of issues with the way we've been training so far is, one, the correlation of successive screens."},{"id":228,"text":"It's like, imagine in the Atari game, you have the ball that's in the top left corner and it's traveling to the bottom right of the screen. You have like many, many time steps that are essentially the same. It's all the ball traveling in the same place. So you're actually training repetitively."},{"id":229,"text":"on something that is not that meaningful. You don't need to just train on a batch. The equivalent in supervised learning is let's say you're trying to differentiate cats and dogs and you train on a mini batch of cats. Then you train on a mini batch of dogs. Then you train on a mini batch of cats. It will never converge. It will just index too much on cats and then index too much on dogs. So you want to add some sort of a..."},{"id":230,"text":"experience replay concept that we see in order to create more mixes in the data and get more diversity. The other thing that is important is in our current training process, we are not reusing our data. Like you experience something, you immediately train on it. You never see it again."},{"id":231,"text":"Unless you re-experience the same thing sometimes in the future, which might or might not happen. Experience replay is going to help us to keep experiences in memory and maybe retrain on them on a regular basis. So that one experience might be useful multiple times. Which intuitively makes sense. Maybe you do an experience, you get an amazing reward, and you don't want to forget it. You want to retrain the model on it on a regular basis. It's more data efficiency."},{"id":232,"text":"So here's what it looks like. The current way we were training was we're in a state, I'm just going to say state instead of preprocessed state, but it's preprocessed. We're in a state S, we perform action A, we get a reward R, and we get into the next state. From that next state, we perform another action A prime, we get a reward R prime, and we get into S second, and so on."},{"id":233,"text":"You know, and so on. And each of these would be called one experience. It's one iteration of gradient descent. So one experience. So right now we're training on these experiences. So the training looks like I train on E1."}],"notes":["本段首先讲解了终端状态的概念，指出在终端状态下，目标不是贝尔曼方程，而是即时奖励。这说明在强化学习中，终端状态的处理方式与非终端状态不同，因为没有后续状态和奖励。接着，讲者提到在终端状态下，奖励是直接获得的，不需要进行折扣处理。","接下来，讲者引入了经验回放（experience replay）的概念，指出当前训练方法存在两个主要问题：一是连续状态之间的相关性，二是数据未被重复利用。经验回放通过存储经验并随机抽取进行训练，可以增加数据的多样性，提高数据效率。","讲者以Atari游戏为例，说明连续状态之间的相关性问题。例如，球在屏幕上的移动轨迹可能在多个时间步中保持不变，导致训练过程重复且缺乏多样性。这种情况下，模型可能无法有效学习。","讲者进一步将经验回放与监督学习中的训练方法进行类比，指出如果只在猫和狗的样本上交替训练，模型将无法收敛。因此，经验回放通过混合不同经验，可以提高模型的泛化能力。","讲者还提到经验回放的另一个优势是数据的重复利用。通过存储经验并在后续训练中重新使用，可以提高数据效率，避免遗忘重要的经验。例如，获得高奖励的经验应被多次利用。","最后，讲者简要描述了经验回放的实现方式，指出当前训练过程是按顺序处理经验，而经验回放则通过存储经验并随机抽取进行训练，从而提高数据的多样性和模型的训练效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3764.39,"end":3942.95,"asr_flags":[],"raw_segments":[{"start":3764.39,"text":"The state that I'm going in based on the action, I'm taking a terminal state. If it's a terminal state, then get out of the loop. There's nothing else after. The one thing that you need to be careful of is if it's a terminal state, then your target is not the Bellman equation. It's just the immediate reward. Remember, you get to the terminal state, you get a reward of 10. There's no Bellman equation to apply. It's just 10. It's immediate reward. There's no discount, etc."},{"start":3796.59,"text":"Okay, so these are fairly easy changes. Now we're going to look at a new method that will enable more data efficiency. It's called experience replay. A couple of issues with the way we've been training so far is, one, the correlation of successive screens."},{"start":3818.06,"text":"It's like, imagine in the Atari game, you have the ball that's in the top left corner and it's traveling to the bottom right of the screen. You have like many, many time steps that are essentially the same. It's all the ball traveling in the same place. So you're actually training repetitively."},{"start":3837.39,"text":"on something that is not that meaningful. You don't need to just train on a batch. The equivalent in supervised learning is let's say you're trying to differentiate cats and dogs and you train on a mini batch of cats. Then you train on a mini batch of dogs. Then you train on a mini batch of cats. It will never converge. It will just index too much on cats and then index too much on dogs. So you want to add some sort of a..."},{"start":3860.45,"text":"experience replay concept that we see in order to create more mixes in the data and get more diversity. The other thing that is important is in our current training process, we are not reusing our data. Like you experience something, you immediately train on it. You never see it again."},{"start":3879.66,"text":"Unless you re-experience the same thing sometimes in the future, which might or might not happen. Experience replay is going to help us to keep experiences in memory and maybe retrain on them on a regular basis. So that one experience might be useful multiple times. Which intuitively makes sense. Maybe you do an experience, you get an amazing reward, and you don't want to forget it. You want to retrain the model on it on a regular basis. It's more data efficiency."},{"start":3906.17,"text":"So here's what it looks like. The current way we were training was we're in a state, I'm just going to say state instead of preprocessed state, but it's preprocessed. We're in a state S, we perform action A, we get a reward R, and we get into the next state. From that next state, we perform another action A prime, we get a reward R prime, and we get into S second, and so on."},{"start":3929.81,"text":"You know, and so on. And each of these would be called one experience. It's one iteration of gradient descent. So one experience. So right now we're training on these experiences. So the training looks like I train on E1."}],"speech_gaps":[],"frame":"../frames/v062/023.webp","frame_time":3776.39},{"title":"经验回放与训练过程","segments":[{"id":234,"text":"I update my parameters. Then I train on E2, I update my parameters. Then I train on E3, I update my parameters. Those are highly correlated because they're part of the same episode. And as I was saying, with the ball traveling in one direction, that might actually not be that helpful to train on all of these. So instead, what we'll do is we'll use experience replay where we will collect our first experience, but instead of training on it, we will put it in a memory."},{"id":235,"text":"Called the replay memory D. We put it in there. And then at every step, we will sample from that memory to decide what to train on. So, of course, at the beginning, if we just have one."},{"id":236,"text":"experience in the memory, we will train on that experience. But over time, you will see that we get more diversity and reuse out of our experiences. So for example, let's say I experience E2, I put it in the memory and then instead of training on E2, I'm going to randomly sample from the memory. I might get E1 or I might get E2. Then I experience E3 and I put it in the memory and I might get one of the three."},{"id":237,"text":"This is the vanilla experience replay. In practice, there is more methods like prioritized sweeping, which might tell you which experience you want to weigh. Maybe some experiences had a higher gradient, so you want to prioritize them more often. Things like that."},{"id":238,"text":"So all in all, this is what our training looks like with experience replay. We experience E1. We train on E1. Then the next training iteration is not on E2. It's on a sample from E1 and E2, either or. The third experience is then put in the replay memory, but we don't train on it. We train on a sample from whatever is in the replay memory, and we repeat. And that is..."},{"id":239,"text":"more sample more efficient allows more reusability and less cross-correlation in our training batch well so that's called replay memory and you can use it with minibatch gradient descent note that you still experience in the direction that the game is played like we still go and take the action as expected we just don't necessarily update our model parameter based on the action that we ended up taking"},{"id":240,"text":"We put it in the replay memory. We may train on it later. Okay. So here's how it modifies our vanilla setup. We've added an experience."},{"id":241,"text":"from state S to state S prime to the replay memory. Let me walk you through it again. Within one time step, we forward propagate our state into the queue network. We execute the best action given the queue values. This gives us a reward and a next state. The next state is preprocessed. And then instead of training on that,"}],"notes":["本段讲解了经验回放（replay memory）在深度强化学习中的作用，强调了其在提高样本效率、增强经验重用性以及减少训练批次中样本间的相关性方面的优势。讲者指出，经验回放允许模型从历史经验中随机采样进行训练，而不是仅依赖当前经验，从而提升训练的稳定性和效率。","讲者提到，尽管经验回放允许模型从历史经验中采样进行训练，但模型仍然按照游戏进行的方向采取行动，即仍然执行动作并获得奖励，只是不一定会基于当前动作更新模型参数。这表明经验回放并不改变环境交互的过程，而是改变了模型训练时使用的数据来源。","讲者还提到，经验回放可以与小批量梯度下降（minibatch gradient descent）结合使用，这表明在训练过程中，模型会从经验回放中随机抽取一小批量经验进行参数更新，从而实现更高效的训练。","讲者强调了经验回放的另一个关键优势是减少训练批次中样本之间的相关性。由于经验回放从历史经验中随机采样，因此训练数据中的样本之间具有较低的相关性，这有助于模型更好地泛化。","讲者指出，经验回放的引入改变了传统的训练流程，即模型不再直接基于当前经验进行训练，而是从经验回放中随机采样进行训练。这种改变有助于提高训练的稳定性和效率。","讲者最后提到，经验回放的使用并不影响模型在游戏中的行为，即模型仍然按照游戏规则采取行动，只是在训练时使用的是从经验回放中采样的历史经验，而不是当前经验。"],"formulas":[],"uncertainties":["more sample more efficient allows more reusability and less cross-correlation in our training batch well so that's called replay memory and you can use it with minibatch gradient descent note that you still experience in the direction that the game is played like we still go and take the action as expected we just don't necessarily update our model parameter based on the action that we ended up taking"],"diagram":"none","start":3943.76,"end":4120.07,"asr_flags":[],"raw_segments":[{"start":3943.76,"text":"I update my parameters. Then I train on E2, I update my parameters. Then I train on E3, I update my parameters. Those are highly correlated because they're part of the same episode. And as I was saying, with the ball traveling in one direction, that might actually not be that helpful to train on all of these. So instead, what we'll do is we'll use experience replay where we will collect our first experience, but instead of training on it, we will put it in a memory."},{"start":3971.36,"text":"Called the replay memory D. We put it in there. And then at every step, we will sample from that memory to decide what to train on. So, of course, at the beginning, if we just have one."},{"start":3985.02,"text":"experience in the memory, we will train on that experience. But over time, you will see that we get more diversity and reuse out of our experiences. So for example, let's say I experience E2, I put it in the memory and then instead of training on E2, I'm going to randomly sample from the memory. I might get E1 or I might get E2. Then I experience E3 and I put it in the memory and I might get one of the three."},{"start":4012.21,"text":"This is the vanilla experience replay. In practice, there is more methods like prioritized sweeping, which might tell you which experience you want to weigh. Maybe some experiences had a higher gradient, so you want to prioritize them more often. Things like that."},{"start":4028.58,"text":"So all in all, this is what our training looks like with experience replay. We experience E1. We train on E1. Then the next training iteration is not on E2. It's on a sample from E1 and E2, either or. The third experience is then put in the replay memory, but we don't train on it. We train on a sample from whatever is in the replay memory, and we repeat. And that is..."},{"start":4052.54,"text":"more sample more efficient allows more reusability and less cross-correlation in our training batch well so that's called replay memory and you can use it with minibatch gradient descent note that you still experience in the direction that the game is played like we still go and take the action as expected we just don't necessarily update our model parameter based on the action that we ended up taking"},{"start":4084.28,"text":"We put it in the replay memory. We may train on it later. Okay. So here's how it modifies our vanilla setup. We've added an experience."},{"start":4098.93,"text":"from state S to state S prime to the replay memory. Let me walk you through it again. Within one time step, we forward propagate our state into the queue network. We execute the best action given the queue values. This gives us a reward and a next state. The next state is preprocessed. And then instead of training on that,"}],"speech_gaps":[],"frame":"../frames/v062/024.webp","frame_time":3955.76},{"title":"经验回放与探索策略","segments":[{"id":242,"text":"Instead of training, we just add that transition to the replay memory. And instead, we sample randomly a mini batch of transition from the replay memory, and we train on those. And we redo the same thing again and again. Yes. Yeah."},{"id":243,"text":"Yeah, you would. You would within one episode. But, you know, if you play multiple chess games, your replay memory will get already bigger. So then you would see some end games, some middle of the game, some early games."},{"id":244,"text":"And in practice, it's actually useful because you might imagine that in a chess game, all of us, let's say if you're a beginner, you see a lot of beginning of the games. Actually, people that are beginners, they're good at openings, but they're bad at end games because they don't get to play a lot of end games. Well, that type of approach could be useful. You can retrain on end games more often. And a more advanced version of the replay memory,"},{"id":245,"text":"would also weigh the experience in the replay memory based on how much the gradient is going to be. So if you have an experience that actually was super insightful, you can weigh it higher so that you prioritize grabbing it and retraining on it, essentially. So let's say you blunder in chess, you might actually want to re-see that blunder later so that you don't do it again."},{"id":246,"text":"Okay, so these were all the different methods. Another one that's very intuitive and very important is when, during the training process, our agent gets stuck. Gets stuck in a local minima. Here is how it would work in practice. You start in initial state S1, and you have three states ahead of you. If you take action A1, you go to state 2, which is a terminal state."},{"id":247,"text":"and you get a reward of zero. If you take action A2, you get to S3, also a terminal state, and you get a reward of one. And if you get action A3, you get to state four, terminal state with a reward of a thousand. So of course, to us, it's obvious that we would want to explore the state number four. It's pretty obvious. In practice, let's say you update, you initialize your network, and in the first forward path, that's what you get."},{"id":248,"text":"First forward path, the network is random. You get Q value for action 1.5, for action 2.4, for action 3.3. What does that mean? It means the agent is saying, I'm going to go to action 1. So I take action 1, and I see an immediate reward of 0."}],"notes":["本段讲解了经验回放（replay memory）的基本概念，即在强化学习中，智能体将经历的转移（transition）存储到经验回放中，并从中随机采样一个mini-batch进行训练。这种方法有助于打破数据相关性，提高训练稳定性。","接着，讲者通过国际象棋的例子说明经验回放的实用性。对于初学者来说，他们可能更熟悉开局阶段，但对残局阶段了解较少。经验回放可以使得智能体在训练时更频繁地接触残局经验，从而提升整体表现。","讲者进一步提到，经验回放可以结合梯度的重要性进行加权。如果某个经验对梯度的贡献较大，可以赋予其更高的权重，从而优先训练这些经验。例如，在国际象棋中，如果发生失误（blunder），智能体可以重新查看该经验以避免重复错误。","随后，讲者介绍了探索策略中的一个关键问题：智能体在训练过程中可能陷入局部最优解（local minima）。讲者通过一个具体的例子说明了这种情况，即智能体在初始状态S1时，有三个可能的动作，分别导致不同的终端状态和奖励。","在例子中，智能体在初始阶段的Q值是随机的，因此它可能会选择奖励较低的动作。讲者指出，这种情况下，智能体需要通过探索来找到最优策略，即选择奖励最高的动作A3，从而到达状态4并获得最大奖励。","最后，讲者强调了探索的重要性，特别是在训练初期，智能体需要通过探索来发现最优策略，而不是仅仅依赖当前的Q值进行决策。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4120.78,"end":4300.69,"asr_flags":[],"raw_segments":[{"start":4120.78,"text":"Instead of training, we just add that transition to the replay memory. And instead, we sample randomly a mini batch of transition from the replay memory, and we train on those. And we redo the same thing again and again. Yes. Yeah."},{"start":4152.42,"text":"Yeah, you would. You would within one episode. But, you know, if you play multiple chess games, your replay memory will get already bigger. So then you would see some end games, some middle of the game, some early games."},{"start":4171.27,"text":"And in practice, it's actually useful because you might imagine that in a chess game, all of us, let's say if you're a beginner, you see a lot of beginning of the games. Actually, people that are beginners, they're good at openings, but they're bad at end games because they don't get to play a lot of end games. Well, that type of approach could be useful. You can retrain on end games more often. And a more advanced version of the replay memory,"},{"start":4199.24,"text":"would also weigh the experience in the replay memory based on how much the gradient is going to be. So if you have an experience that actually was super insightful, you can weigh it higher so that you prioritize grabbing it and retraining on it, essentially. So let's say you blunder in chess, you might actually want to re-see that blunder later so that you don't do it again."},{"start":4224.83,"text":"Okay, so these were all the different methods. Another one that's very intuitive and very important is when, during the training process, our agent gets stuck. Gets stuck in a local minima. Here is how it would work in practice. You start in initial state S1, and you have three states ahead of you. If you take action A1, you go to state 2, which is a terminal state."},{"start":4252.06,"text":"and you get a reward of zero. If you take action A2, you get to S3, also a terminal state, and you get a reward of one. And if you get action A3, you get to state four, terminal state with a reward of a thousand. So of course, to us, it's obvious that we would want to explore the state number four. It's pretty obvious. In practice, let's say you update, you initialize your network, and in the first forward path, that's what you get."},{"start":4281.82,"text":"First forward path, the network is random. You get Q value for action 1.5, for action 2.4, for action 3.3. What does that mean? It means the agent is saying, I'm going to go to action 1. So I take action 1, and I see an immediate reward of 0."}],"speech_gaps":[],"frame":"../frames/v062/025.webp","frame_time":4132.78},{"title":"探索与利用的平衡","segments":[{"id":249,"text":"Because it's a terminal state, the Bellman equation thing doesn't happen. I just have the immediate reward, which becomes my target Y. And so I perform a gradient descent update to say this Q value should have been zero. So I convert this Q value to zero. Now, second try."},{"id":250,"text":"This time, the Q value is saying take action two. It's the highest Q value. I take action two. I have an immediate reward ahead of me. That's one. Because it's a terminal state, there is no second discounted future reward term. So I just take Y equals one. I perform my gradient descent update, and this converts to one."},{"id":251,"text":"The agent is still saying, go to A2. Take action A2. Reward of one. Good. That's what you predicted. Nothing to do. Just keep going. We're done with training. We're stuck. We never visit the state we actually wanted to visit. So that wouldn't work for us. We will never visit that state using our current algorithm."},{"id":252,"text":"In practice, this is a big issue. The analogy of this concept of exploration versus exploitation is when every day you take your bike and you cross campus, you have a favorite route."},{"id":253,"text":"And it turns out that the more you take that route, the better you get every time. Like you get a little faster, maybe your turn is faster or something, or you can predict how many people are going to be at that roundabout and you know how to take it in the wide way. So you go faster. We've all done that."},{"id":254,"text":"That's exploitation. You exploit what you already know and you get better at it. But maybe there's another route that you're not thinking of that's pretty, instead of going north from campus, you go south and maybe it might be better. You will never see because you don't have the courage or the patience to do it. That's the difference between exploration and exploitation. In practice, a good model would be able to handle both, to exploit when it needs to exploit, to explore when it needs to explore."},{"id":255,"text":"The way we do it in practice in our pseudocode is to inject some randomness."},{"id":256,"text":"So, for example, when we are looping over a time step with probability epsilon, let's say 5%, take a random action."},{"id":257,"text":"So from time to time, on average, one time every 20 times you take a random action, it will allow you to visit maybe a new path."},{"id":258,"text":"The analogy in chess is, you know, you might use a creative move from time to time that might be worse today, but might allow you to learn something and to get better over time."},{"id":259,"text":"Yeah."},{"id":260,"text":"In the last example we just covered, could we resolve that by just setting the initial Q values to infinity?"}],"notes":["本段讲解了在深度强化学习中，当处于终端状态时，贝尔曼方程不再适用，因为没有未来的奖励项。此时，目标值Y仅由即时奖励构成，因此需要通过梯度下降更新Q值。然而，如果Q值始终选择最高奖励的动作，可能会导致模型无法探索其他可能的路径，从而陷入局部最优。","在实际应用中，探索与利用的平衡是一个关键问题。探索指的是尝试新的动作以发现更好的策略，而利用则是基于已有知识选择已知最优的动作。如果模型只利用已知信息，可能会错过更优的路径。","为了处理这一问题，通常在算法中引入随机性，例如在每次时间步以一定概率（如5%）随机选择动作。这样可以在一定程度上促进探索，避免模型陷入局部最优。","在实际应用中，探索与利用的平衡需要根据具体任务进行调整。例如，在棋类游戏中，偶尔采取非最优的创造性动作可能有助于长期学习和策略提升。","在最后的例子中，如果初始Q值设置为无穷大，可能会导致模型始终选择最高奖励的动作，从而无法探索其他可能的路径。因此，初始Q值的设置需要谨慎。","探索与利用的平衡是深度强化学习中的核心挑战之一，需要在算法设计中进行权衡。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4302.12,"end":4480.49,"asr_flags":[],"raw_segments":[{"start":4302.12,"text":"Because it's a terminal state, the Bellman equation thing doesn't happen. I just have the immediate reward, which becomes my target Y. And so I perform a gradient descent update to say this Q value should have been zero. So I convert this Q value to zero. Now, second try."},{"start":4321.73,"text":"This time, the Q value is saying take action two. It's the highest Q value. I take action two. I have an immediate reward ahead of me. That's one. Because it's a terminal state, there is no second discounted future reward term. So I just take Y equals one. I perform my gradient descent update, and this converts to one. And then third time."},{"start":4349.34,"text":"The agent is still saying, go to A2. Take action A2. Reward of one. Good. That's what you predicted. Nothing to do. Just keep going. We're done with training. We're stuck. We never visit the state we actually wanted to visit. So that wouldn't work for us. We will never visit that state using our current algorithm. Does that make sense why we wouldn't ever visit that state?"},{"start":4377.64,"text":"In practice, this is a big issue. The analogy of this concept of exploration versus exploitation is when every day you take your bike and you cross campus, you have a favorite route."},{"start":4392.61,"text":"And it turns out that the more you take that route, the better you get every time. Like you get a little faster, maybe your turn is faster or something, or you can predict how many people are going to be at that roundabout and you know how to take it in the wide way. So you go faster. We've all done that."},{"start":4408.04,"text":"That's exploitation. You exploit what you already know and you get better at it. But maybe there's another route that you're not thinking of that's pretty, instead of going north from campus, you go south and maybe it might be better. You will never see because you don't have the courage or the patience to do it. That's the difference between exploration and exploitation. In practice, a good model would be able to handle both, to exploit when it needs to exploit, to explore when it needs to explore."},{"start":4435.57,"text":"The way we do it in practice in our pseudocode is to inject some randomness."},{"start":4441.23,"text":"So, for example, when we are looping over a time step with probability epsilon, let's say 5%, take a random action."},{"start":4449.53,"text":"So from time to time, on average, one time every 20 times you take a random action, it will allow you to visit maybe a new path."},{"start":4457.55,"text":"The analogy in chess is, you know, you might use a creative move from time to time that might be worse today, but might allow you to learn something and to get better over time."},{"start":4469.03,"text":"Yeah."},{"start":4470.39,"text":"In the last example we just covered, could we resolve that by just setting the initial Q values to infinity?"}],"speech_gaps":[],"frame":"../frames/v062/026.webp","frame_time":4314.12},{"title":"深度强化学习中的初始化与Q学习","segments":[{"id":261,"text":"setting the"},{"id":262,"text":"couldn't we resolve this problem by setting"},{"id":263,"text":"the initial values from into infinity"},{"id":264,"text":"well the problem if you set the initial"},{"id":265,"text":"values to infinity so you would say"},{"id":266,"text":"instead of randomly initializing"},{"id":267,"text":"your network you initialize it in a way"},{"id":268,"text":"that the outputs are equal to infinity"},{"id":269,"text":"yeah so that we wouldn't get the issue"},{"id":270,"text":"of"},{"id":271,"text":"the Q values"},{"id":272,"text":"well in"},{"id":273,"text":"practice if the three Q values are"},{"id":274,"text":"infinity then you can't make a decision on"},{"id":275,"text":"the spot so you're saying just pick one randomly because if the three are
