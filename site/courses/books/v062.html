tate 2 in this Q function with multiple layers,","zh":"这里是我们相同的问题陈述。过去，我们寻找的是一个Q表，而这次我们将寻找一个神经网络。我们将做的一件事是定义输出层有两个输出。因此，给定一个状态作为输入，可以将其视为一个one-hot向量编码的状态。例如，这个状态是2，编码为0, 1, 0, 0, 0。如果你将状态2输入这个具有多层的Q函数，","start":2170.64,"end":2198.32}],"notes":["本段讲授了传统Q表方法的局限性，特别是在状态和动作空间非常大的情况下，Q表的存储和查询变得不可行。以围棋为例，状态和动作的数量极大，导致矩阵规模巨大，无法实际应用。因此，引入深度学习方法来解决这一问题。","讲者提到深度Q学习（Deep Q Learning）的基本思想，即使用神经网络作为Q函数的近似器，替代传统的Q表。神经网络可以处理高维输入，并通过前向传播快速得到Q值，从而避免了传统方法的存储和查询问题。","讲者进一步说明了神经网络在深度Q学习中的具体应用，包括输入状态的编码方式（如one-hot编码）以及输出层的设计。输出层的维度对应于可能的动作数量，每个输出代表对应动作的Q值。","讲者提到神经网络的结构设计，包括多层网络的使用，以处理复杂的输入状态。通过这种方式，神经网络能够学习到状态与动作之间的复杂关系，从而更有效地进行决策。","讲者强调了深度Q学习相较于传统Q表方法的优势，特别是在处理大规模状态和动作空间时的效率和可扩展性。这种方法使得深度强化学习在实际应用中更加可行。","讲者提到在深度Q学习中，输入状态通常被编码为one-hot向量，这有助于神经网络更好地处理离散状态空间。同时，输出层的维度与动作空间的大小相关，每个输出对应一个动作的Q值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2041.93,"end":2198.32,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2041.93,"text":"The main issue with this approach of a queue table is that state and action spaces can be super large and having a matrix that you discover through backtracking and where every time you want to do an action, you have to look up the given states, the possible action."},{"start":2067.58,"text":"it becomes impossible. Imagine you using this algorithm for the game of Go, where there's so many states, there's so many possible actions. You can put your stone anywhere on the board. You can imagine how big this matrix becomes and how impossible it is to use. So that's our problem. And that's the moment where deep learning comes into play. So let's look at it."},{"start":2098.44,"text":"Oh, actually, before I go there, I'm just going to cover some vocabulary. We said the environment, the agent, the state, the action, the reward, the total return, and the discount factor. We learned all of that. We saw that the Q table is the matrix of entries representing how good is it to take action A in state S. And the policy is the function that tells us what's the best strategy to adopt. And the Bellman equation is satisfied by the optimal Q table."},{"start":2125.1,"text":"So let's get to deep Q learning, which is what I was about to say, is we are going to frame the problem slightly differently. So instead of using a Q table, we're going to use the fact that neural networks are universal function approximators. And we're going to define a Q function that's essentially a neural network so that the function can take a state S and an action A and tell you how good."},{"start":2152.71,"text":"that action is in state S. So instead of a lookup in a matrix, you just run a forward pass in a neural network and it gives you the answer. That feels like a better solution for games where there's a lot of states and a lot of actions."},{"start":2170.64,"text":"So here is the same problem statement. In the past, we looked for a Q table, and this time we will look for a neural network. One of the things we're going to do is to define the output layer to have two outputs. So given a certain state as input, think about it as a one-hot vector encoding the state. So this one is the example of state 2, 0, 1, 0, 0, 0. If you pass state 2 in this Q function with multiple layers,"}],"speech_gaps":[],"frame":"../frames/v062/013.webp","frame_time":2053.9300000000003},{"title":"深度强化学习中的网络训练问题","segments":[{"id":83,"text":"It will give you two outputs. One output that corresponds to Q of S action right and the other one Q of S action left because it's the two actions. If we had more actions to take, we would just increase the output layer and we might have many more neurons in the output layer.","zh":"它将给出两个输出。一个对应于状态S采取右行动的Q值，另一个对应于状态S采取左行动的Q值，因为这是两个动作。如果我们有更多的动作需要采取，我们只需增加输出层，并且输出层中可能有更多的神经元。","start":2198.97,"end":2232.24},{"id":84,"text":"So this one is a hard question, but what would you do given we don't have traditional X and Y pairs?","zh":"所以这是一个难题，但如果我们没有传统的X和Y配对数据，你会怎么做？","start":2236.56,"end":2245.2},{"id":85,"text":"How are you going to train this neural network?","zh":"你将如何训练这个神经网络？","start":2245.86,"end":2249.92},{"id":86,"text":"Because remember, at the beginning, this neural network will give you garbage.","zh":"请记住，在开始时，这个神经网络会给出垃圾输出。","start":2251.76,"end":2254.88},{"id":87,"text":"It will take a state S and it might tell you go to the left or to the right, but it's completely random.","zh":"它会接收一个状态S，并可能告诉你向左或向右移动，但这是完全随机的。","start":2255.04,"end":2259.72},{"id":88,"text":"So how are you going to tune it to the level where it makes really good decisions?","zh":"那么你将如何调整它，使其做出非常优秀的决策？","start":2260.26,"end":2264.62},{"id":89,"text":"assume based on some prior knowledge","zh":"假设基于一些先验知识","start":2274.54,"end":2276.9},{"id":90,"text":"tell me more","zh":"告诉我更多","start":2276.9,"end":2277.72},{"id":91,"text":"so what are the things","zh":"那么我们现在知道这个问题的哪些方面","start":2285.42,"end":2287.04},{"id":92,"text":"we know about this problem right now","zh":"我们现在对这个问题了解些什么","start":2287.04,"end":2288.76},{"id":93,"text":"what are the rules","zh":"我们了解游戏的哪些规则","start":2288.76,"end":2290.8},{"id":94,"text":"of the game that we could use","zh":"我们可以利用哪些游戏规则","start":2290.8,"end":2292.52},{"id":95,"text":"in order to","zh":"为了","start":2292.52,"end":2294.08},{"id":96,"text":"I'm seeing what you say. You say we could estimate what good looks like, but based on what?","zh":"我听到你说的话。你说我们可以估计什么是好的，但依据是什么？","start":2295.38,"end":2299.9},{"id":97,"text":"Okay, so reward structure. You're saying that's one thing we have in every game. We have a reward","zh":"好的，那么奖励结构。你说这是每个游戏中都存在的一个要素。我们每个状态都有一个奖励结构，这 definitely 应该被用来估计什么是好的决策","start":2308.54,"end":2313.18},{"id":98,"text":"structure for every state that definitely should be used in order to estimate what a good decision","zh":"我们每个状态都有一个奖励结构，这 definitely 应该被用来估计什么是好的决策","start":2313.18,"end":2319.2},{"id":99,"text":"looks like. Yeah, the problem is not in every state you will see a reward. And if you look at","zh":"看起来是这样。是的，问题在于并不是在每个状态下你都会看到奖励。如果你看看","start":2319.2,"end":2326.04},{"id":100,"text":"many games like Go, you might not see a reward until 50 moves. So what do you do in this case?","zh":"很多游戏比如围棋，你可能要等到50步之后才会看到奖励。在这种情况下你会怎么做呢？","start":2326.04,"end":2334.12},{"id":101,"text":"Yes?","zh":"是的？","start":2335.36,"end":2335.86},{"id":102,"text":"Can we run through a bunch of","zh":"我们能否运行一系列的","start":2336.24,"end":2337.96},{"id":103,"text":"actions and states and see what the output is and get more data to train the robot?","zh":"动作和状态，并查看输出结果，从而获取更多数据来训练机器人？","start":2339.68,"end":2345.14},{"id":104,"text":"Yeah. So you could, you're actually bringing up a sort of a tree search, right?","zh":"是的。因此，你实际上是在提出一种树搜索的方法，对吧？","start":2345.14,"end":2351.4},{"id":105,"text":"You go down the tree, you do every possible action, and then you backtrack.","zh":"你沿着树向下进行，执行所有可能的动作，然后回溯。","start":2351.44,"end":2355.4},{"id":106,"text":"So which actions?","zh":"哪些动作？","start":2357.42,"end":2358.74},{"id":107,"text":"Okay, that's what we're getting there.","zh":"好的，这就是我们正在接近的内容。","start":2360.84,"end":2363.38},{"id":108,"text":"So first possibility is we just go down the tree in the game of Go.","zh":"所以第一种可能性是我们直接在围棋游戏中向下遍历这棵树。","start":2363.54,"end":2367.72},{"id":109,"text":"You could put your stone everywhere.","zh":"你可以把你的棋子放在任何地方。","start":2367.86,"end":2369.06},{"id":110,"text":"So the tree already starts by your 13 by 13 options, and then it exponentially grows.","zh":"这棵树一开始就有13乘13的选项，然后呈指数级增长。","start":2369.12,"end":2374.94}],"notes":["本段讨论了深度强化学习中神经网络的训练问题，强调了传统监督学习中标签的缺失。讲者指出，网络在初始阶段会给出随机的输出，因此需要找到一种方法来训练网络使其做出好的决策。","讲者询问在没有传统X和Y对的情况下，如何训练神经网络。这表明强化学习与监督学习在训练方法上的根本区别。","讲者提到奖励结构是每个游戏中都存在的，但并非每个状态都会立即获得奖励，例如在围棋中，奖励可能在50步之后才出现。这说明了强化学习中延迟奖励的问题。","讲者提到可以通过运行一系列动作和状态来获取更多数据来训练机器人，这暗示了使用树搜索方法的可能性。","讲者提到树搜索方法，即通过尝试所有可能的动作并回溯，这表明了强化学习中探索与利用的平衡问题。","讲者提到围棋中的树搜索，即从13x13的选项开始，树会指数级增长，这说明了树搜索在实际应用中的计算复杂性问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2198.97,"end":2374.94,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":2198.97,"text":"it will give you two outputs. One output that corresponds to Q of S action right and the other one Q of S action left because it's the two actions. If we had more actions to take, we would just increase the output layer and we might have many more neurons in the output layer. So the big question is how the hell are we going to train that network? Because we're not in classic supervised learning. We don't have labels."},{"start":2236.56,"text":"So this one is a hard question, but what would you do given we don't have traditional X and Y pairs?"},{"start":2245.86,"text":"How are you going to train this neural network?"},{"start":2251.76,"text":"Because remember, at the beginning, this neural network will give you garbage."},{"start":2255.04,"text":"It will take a state S and it might tell you go to the left or to the right, but it's completely random."},{"start":2260.26,"text":"So how are you going to tune it to the level where it makes really good decisions?"},{"start":2274.54,"text":"assume based on some prior knowledge"},{"start":2276.9,"text":"tell me more"},{"start":2285.42,"text":"so what are the things"},{"start":2287.04,"text":"we know about this problem right now"},{"start":2288.76,"text":"what are the rules"},{"start":2290.8,"text":"of the game that we could use"},{"start":2292.52,"text":"in order to"},{"start":2295.38,"text":"I'm seeing what you say. You say we could estimate what good looks like, but based on what?"},{"start":2308.54,"text":"Okay, so reward structure. You're saying that's one thing we have in every game. We have a reward"},{"start":2313.18,"text":"structure for every state that definitely should be used in order to estimate what a good decision"},{"start":2319.2,"text":"looks like. Yeah, the problem is not in every state you will see a reward. And if you look at"},{"start":2326.04,"text":"many games like Go, you might not see a reward until 50 moves. So what do you do in this case?"},{"start":2335.36,"text":"Yes?"},{"start":2336.24,"text":"Can we run through a bunch of"},{"start":2339.68,"text":"actions and states and see what the output is and get more data to train the robot?"},{"start":2345.14,"text":"Yeah. So you could, you're actually bringing up a sort of a tree search, right?"},{"start":2351.44,"text":"You go down the tree, you do every possible action, and then you backtrack."},{"start":2357.42,"text":"So which actions?"},{"start":2360.84,"text":"Okay, that's what we're getting there."},{"start":2363.54,"text":"So first possibility is we just go down the tree in the game of Go."},{"start":2367.86,"text":"You could put your stone everywhere."},{"start":2369.12,"text":"So the tree already starts by your 13 by 13 options, and then it exponentially grows."}],"speech_gaps":[],"frame":"../frames/v062/014.webp","frame_time":2210.97},{"title":"贝尔曼方程与监督学习的结合","segments":[{"id":111,"text":"It's impossible, it's intractable, but what you said is, what if there are certain actions that are","zh":"这是不可能的，这是难以处理的，但你说的是，如果某些动作比其他动作更可能发生呢？我们真的需要探索整个树吗？这会是什么样子？当你这么说的时候，你在使用什么？你如何确定哪个动作可能比另一个动作更好？","start":2376.02,"end":2380.02},{"id":112,"text":"more likely than others? Do we need actually to explore the entire tree? What's this like? What","zh":"预期回报，我们接近了，对吧。但你怎么知道预期回报而不至少遍历一次树呢？好吧，你可以用什么来估计它？嗯，也许。所以这正是我们即将做的，实际上。但我们将会使用贝尔曼方程。因为我们知道这个问题的两个方面。我们知道奖励结构，你提到了这一点。","start":2380.02,"end":2385.04},{"id":113,"text":"are you using when you're saying that? How do you determine what action might be better than another","zh":"我们还知道完美的Q函数将遵循贝尔曼方程。这一点我们也知道。最后，贝尔曼方程应该被遵守。意思是，对于每一个状态，如果你想了解该状态在某个动作下的Q值，你得到该值的方式是查看即时奖励加上折扣乘以所有动作中下一个状态的最佳Q值。","start":2385.04,"end":2389.1},{"id":114,"text":"Expected return, we're getting close, yeah. But how do you know the expected return without going through the tree once at least? Okay, you can estimate it using what? Yeah, maybe. So that's exactly what we're going to do, actually. But we're going to use the Bellman equation. Because there are two things we know about this problem. We know the reward structure, which you brought up.","zh":"方程将被遵守。因此，我们只有这些信息，我们将用它们来定义我们的标签，并大致模仿经典的监督学习方法。所以这里我们有。我们有一个神经网络。我们有左边和右边的Q值，它们表示在该状态下向左和向右移动的好坏。然后我在屏幕右上方贴上了贝尔曼方程。","start":2392.07,"end":2419.79},{"id":115,"text":"And we also know that the perfect Q function will follow the Bellman equation. That we know as well. At the end, the Bellman equation should be respected. Meaning, for every state, if you want to know the Q value of that state given an action, the way you will get that is you will look at the immediate reward plus a discount times the best Q value from the next state across all actions.","zh":"我们将定义一个损失函数。为了简化起见，因为这些是我们使用的标量值，你知道的，L2损失，二次损失，它将某个标签Y与某个状态在某个动作下的Q值进行比较。因此，我们希望最小化这个损失函数，意味着在给定状态和动作下的Y和Q值尽可能接近。","start":2420.23,"end":2445.61},{"id":116,"text":"Equation will be respected. So those are the only information we have, and we're going to use them drastically to define our labels and sort of mimic a classic supervised learning approach. So here's what we have. We have our neural network. We have Qs to the left and Qs to the right that represent how good it is to go to the left in that state versus the right. And then I've pasted the Bellman equation on top right of the screen.","zh":"损失函数将被定义。所以假设为了简化起见，因为这些是我们使用的标量值，你知道的，L2损失，二次损失，它将某个标签Y与某个状态在某个动作下的Q值进行比较。因此，我们希望最小化这个损失函数，意味着在给定状态和动作下的Y和Q值尽可能接近。","start":2447.3,"end":2472.88},{"id":117,"text":"We're going to define a loss function. So let's say for the sake of simplicity, because those are scalar values that we use, you know, L2 loss, quadratic loss, that compares a certain label Y to a certain Q value of a state in a certain action. So what we would like is to minimize this loss function, meaning Y and the Q value for a given action in a given state is as close as possible.","zh":"损失函数将被定义。所以假设为了简化起见，因为这些是我们使用的标量值，你知道的，L2损失，二次损失，它将某个标签Y与某个状态在某个动作下的Q值进行比较。因此，我们希望最小化这个损失函数，意味着在给定状态和动作下的Y和Q值尽可能接近。","start":2473.67,"end":2502.29},{"id":118,"text":"To each other. And we're going to leverage the reward and the Bellman equation. So let's do two things. Right now, we don't have a Y. So in supervised learning, you would have a picture of a cat. There's a cat. The Y is one or zero. Here, we don't have a Y. So we have to come up with an estimate of a good Y, at least better than random.","zh":"彼此之间。我们将利用奖励和贝尔曼方程。因此，我们将做两件事。目前，我们没有Y。在监督学习中，你会有一张猫的图片。有猫。Y是1或0。在这里，我们没有Y。因此，我们必须想出一个较好的Y的估计值，至少要比随机猜测更好。","start":2502.95,"end":2523.03},{"id":119,"text":"So let's say at this point in time, when I send a state S in the network, it turns out that Q of going to the left is higher than Q of going to the right. Which means that today, at that moment, the Q function tells me it's better to go to the left than to go to the right. That is random at the beginning. It's completely random. So what I'm going to do is I'm going to use as my target value Y.","zh":"假设在这一点上，当我将状态S输入网络时，发现向左的Q值高于向右的Q值。这意味着在这一刻，Q函数告诉我，向左比向右更好。起初这是随机的。它完全随机。因此，我将使用这个作为我的目标值Y。","start":2524.14,"end":2552.22}],"notes":["本段讨论了在强化学习中如何处理动作选择的问题，指出即使某些动作更有可能被选择，也不需要探索整个决策树。接着，讲者提到如何通过贝尔曼方程来估计预期回报，这是强化学习中的核心概念。","讲者强调贝尔曼方程的重要性，指出完美Q函数必须遵循该方程。贝尔曼方程描述了在给定状态下，通过立即奖励加上折扣后的下一状态的最佳Q值来计算当前状态的Q值。这是强化学习中用于更新Q值的核心公式。","讲者将强化学习与监督学习进行类比，指出在监督学习中，标签Y是已知的，而在强化学习中，需要通过贝尔曼方程来估计Y。这涉及到定义损失函数，如L2损失，以最小化预测Q值与目标Y之间的差距。","讲者提到在没有标签Y的情况下，需要估计一个比随机更好的Y。这通常通过当前Q值来估计，例如在某个状态下，选择Q值较高的动作作为目标Y。这反映了强化学习中通过经验来更新策略的过程。","讲者指出在初始阶段，Q函数的估计是随机的，但随着训练的进行，Q值会逐渐收敛到更优的策略。这说明了强化学习中策略迭代和价值迭代的过程。","讲者强调了贝尔曼方程在强化学习中的核心地位，它不仅用于定义Q值，还用于构建损失函数，从而实现监督学习的框架。这表明了强化学习与监督学习之间的联系和区别。"],"formulas":[{"latex":"L = \\frac{1}{2}(Y - Q(s, a))^2","symbols":"L 是损失函数，Y 是目标值，Q(s, a) 是预测的Q值","explanation":"公式正确，使用了L2损失函数，适用于监督学习中的回归问题。","evidence":"We're going to define a loss function. So let's say for the sake of simplicity, because those are scalar values that we use, you know, L2 loss, quadratic loss, that compares a certain label Y to a certain Q value of a state in a certain action. So what we would like is to minimize this loss function, meaning Y and the Q value for a given action in a given state is as close as possible."}],"uncertainties":[],"diagram":"bellman","start":2376.02,"end":2552.22,"asr_flags":[],"math_clarifications":["公式中的损失函数L是标准的均方误差，适用于监督学习中预测Q值的任务。"],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":2376.02,"text":"impossible it's intractable but what you said is what if there are certain actions that are"},{"start":2380.02,"text":"more likely than others do we need actually to explore the entire tree what's this like what"},{"start":2385.04,"text":"are you using when you're saying that how do you determine what action might be better than another"},{"start":2392.07,"text":"Expected return, we're getting close, yeah. But how do you know the expected return without going through the tree once at least? Okay, you can estimate it using what? Yeah, maybe. So that's exactly what we're going to do, actually. But we're going to use the Bellman equation. Because there are two things we know about this problem. We know the reward structure, which you brought up."},{"start":2420.23,"text":"And we also know that the perfect Q function will follow the Bellman equation. That we know as well. At the end, the Bellman equation should be respected. Meaning, for every state, if you want to know the Q value of that state given an action, the way you will get that is you will look at the immediate reward plus a discount times the best Q value from the next state across all actions."},{"start":2447.3,"text":"equation will be respected. So those are the only information we have, and we're going to use them drastically to define our labels and sort of mimic a classic supervised learning approach. So here's what we have. We have our neural network. We have QS to the left and QS to the right that represent how good it is to go to the left in that state versus the right. And then I've pasted the Bellman equation on top right of the screen."},{"start":2473.67,"text":"We're going to define a loss function. So let's say for the sake of simplicity, because those are scalar values that we use, you know, L2 loss, quadratic loss, that compares a certain label Y to a certain Q value of a state in a certain action. So what we would like is to minimize this loss function, meaning Y and the Q value for a given action in a given state is as close as possible."},{"start":2502.95,"text":"to each other. And we're going to leverage the reward and the Bellman equation. So let's do two things. Right now, we don't have a Y. So in supervised learning, you would have a picture of a cat. There's a cat. The Y is one or zero. Here, we don't have a Y. So we have to come up with an estimate of a good Y, at least better than random."},{"start":2524.14,"text":"So let's say at this point in time, when I send a state S in the network, it turns out that Q of going to the left is higher than Q of going to the right. Which means that today, at that moment, the Q function tells me it's better to go to the left than to go to the right. That is random at the beginning. It's completely random. So what I'm going to do is I'm going to use as my target value Y."}],"speech_gaps":[],"frame":"../frames/v062/015.webp","frame_time":2388.02},{"title":"贝尔曼方程与Q值更新","segments":[{"id":120,"text":"The immediate reward that I observe on the left plus gamma times the best Q value that I can get. So the best action that I could take in the next step based on my current Q value. That's very important. So remember, this target is off. It's not a perfect target, but it's better than nothing. Meaning not only it tells us.","zh":"我左边观察到的即时奖励加上 gamma 乘以我能得到的最佳 Q 值。也就是说，基于我当前的 Q 值，我下一步可以采取的最佳动作。这一点非常重要。所以记住，这个目标是离策略的。它不是一个完美的目标，但比什么都不好要好。这意味着它不仅告诉我们。","start":2553.13,"end":2584.37},{"id":121,"text":"Hey, there is a good reward to the left, we should consider that in saying that that might be a good move because we're seeing an immediate reward. But on top of that, we also know that at the end of training, the Q value should follow the Bellman equation. So why don't we set the target as the Bellman equation? So we add the discounted maximum future reward when you are in the next state. So you were in state S, you go to the left. Now you're in state S next left.","zh":"嘿，左边有一个不错的奖励，我们应该考虑这一点，因为我们在看到即时奖励。但除此之外，我们还知道，在训练结束时，Q 值应该遵循贝尔曼方程。那么，我们为什么不把目标设为贝尔曼方程呢？所以我们加上了在下一个状态中获得的折扣最大未来奖励。你原本处于状态 S，你向左移动。现在你处于状态 S 左边。","start":2584.91,"end":2612.65},{"id":122,"text":"And you look again at your Q values and you select the best one, then you add that number here. So there is actually two forward paths in that process, right? There is one forward path.","zh":"然后你再次查看你的 Q 值，并选择最佳的一个，然后你在这里加上这个数值。所以在这个过程中实际上有两个前向路径，对吧？有一个前向路径。","start":2613.61,"end":2629.94},{"id":123,"text":"Where you send the state S in Q, and you look at the two options, left or right, and you're like, okay, I'm going to the left. And then you're like, I'm going to compare that value to a target Y, but to get that target Y, I need to do another forward path. So I take my action left, I perform it, I get an S prime state, S next, and I send that S next into the Q network. I look at the two options I have, I pick the best one, and I add it here with the discount.","zh":"你将状态 S 输入 Q 网络，然后查看左右两个选项，你心想，我要向左移动。然后你将这个值与目标 Y 进行比较，但为了得到这个目标 Y，我需要进行另一个前向路径。所以我采取了向左的动作，执行它，得到了状态 S prime，即下一个状态 S next，然后将这个 S next 输入 Q 网络。我查看我拥有的两个选项，选择最佳的一个，并在这里加上折扣。","start":2630.72,"end":2658.22},{"id":124,"text":"So fundamentally, what's happening is the following. We have a Q network that's random at the beginning. It has never observed the rewards. We just know that at some point, it will get to a perfect policy. It will get to a perfect Q function. But the best we can do right now is to say, as a guide to...","zh":"从根本上说，发生的事情如下。我们有一个初始时是随机的 Q 网络。它从未观察到奖励。我们只知道在某个时刻，它会得到一个完美的策略。它会得到一个完美的 Q 函数。但我们现在能做的最好的事情是，把它作为指导来……","start":2661.76,"end":2686.08},{"id":125,"text":"For our agent, we will look at the immediate reward and we will look at the Bellman equation, which should tell us a better estimate than where we are right now. And we will try to catch up to that estimate. And then we do that again and again. So remember, every time your Q gets better, it gets better for the next state as well. So, you know, the Bellman equation tells you estimate it with the second forward path and you just keep getting better and better as you're observing more rewards.","zh":"对于我们的智能体，我们将查看即时奖励，并查看贝尔曼方程，它应该会给我们一个比当前更优的估计值。我们将尝试接近这个估计值。然后我们重复这个过程。所以记住，每次你的Q值变好时，下一个状态的Q值也会随之变好。也就是说，贝尔曼方程让你用第二条前向路径来估计它，而随着你观察到更多的奖励，你的估计值会变得越来越好。","start":2686.71,"end":2713.77}],"notes":["本段讲解了强化学习中Q值更新的核心思想，即通过当前状态的即时奖励和未来奖励的折扣值来估计目标Q值。讲者强调，这个目标不是完美的，但比不考虑未来奖励的估计更好。"],"formulas":[],"uncertainties":["在讲者提到'Q network that's random at the beginning'时，'Q network'是否指代Q函数或Q网络存在歧义。"],"diagram":"bellman","start":2553.13,"end":2713.77,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2553.13,"text":"The immediate reward that I observe on the left plus gamma times the best Q value that I can get. So the best action that I could take in the next step based on my current Q value. That's very important. So remember, this target is off. It's not a perfect target, but it's better than nothing. Meaning not only it tells us."},{"start":2584.91,"text":"hey, there is a good reward to the left, we should consider that in saying that that might be a good move because we're seeing an immediate reward. But on top of that, we also know that at the end of training, the Q value should follow the Bellman equation. So why don't we set the target as the Bellman equation? So we add the discounted maximum future reward when you are in the next state. So you were in state S, you go to the left. Now you're in state S next left."},{"start":2613.61,"text":"and you look again at your Q values and you select the best one, then you add that number here. So there is actually two forward paths in that process, right? There is one forward path."},{"start":2630.72,"text":"where you send the state S in Q, and you look at the two options, left or right, and you're like, okay, I'm going to the left. And then you're like, I'm going to compare that value to a target Y, but to get that target Y, I need to do another forward path. So I take my action left, I perform it, I get an S prime state, S next, and I send that S next into the Q network. I look at the two options I have, I pick the best one, and I add it here with the discount."},{"start":2661.76,"text":"So fundamentally, what's happening is the following. We have a queue network that's random at the beginning. It has never observed the rewards. We just know that at some point, it will get to a perfect policy. It will get to a perfect queue function. But the best we can do right now is to say, as a guide to..."},{"start":2686.71,"text":"For our agent, we will look at the immediate reward and we will look at the Bellman equation, which should tell us a better estimate than where we are right now. And we will try to catch up to that estimate. And then we do that again and again. So remember, every time your Q gets better, it gets better for the next state as well. So, you know, the Bellman equation tells you estimate it with the second forward path and you just keep getting better and better as you're observing more rewards."}],"speech_gaps":[],"frame":"../frames/v062/016.webp","frame_time":2565.13},{"title":"强化学习中的目标Y与Q函数更新","segments":[{"id":126,"text":"How would you describe the loop? Yeah, you would stop at that point. Yeah, this is a good question. I'll show you how we fix certain things, but you do only one step, meaning you have your Q value at this point, and it tells you go to the left, and you just want to target Y. So what you do is you put left.","zh":"你怎么描述这个循环？是的，你会在那个点停下来。是的，这是一个好问题。我会向你展示我们如何修复某些问题，但你只进行一步，这意味着你在这个点有Q值，它告诉你向左走，而你只想以Y为目标。因此，你所做的就是向左走。","start":2731.16,"end":2761.33},{"id":127,"text":"and you look at your next state, you forward propagate your next state, you look at the two options, you pick the best, you don't go further, you just use that one step, you look one step ahead, essentially, you don't look multiple steps ahead, you could, but it would be more computationally heavy to do one more step again, and so on, so yeah, um","zh":"然后你查看下一个状态，你将下一个状态前向传播，你查看两个选项，你选择最好的一个，你不会继续下去，你只使用这一步，你实际上只向前看一步，而不是多步，虽然你可以这样做，但再次进行一步会更耗费计算资源，依此类推，是的，嗯","start":2761.96,"end":2780.98},{"id":128,"text":"It will typically be a function of the environment, the state space, how long it will take to converge. But you're perfectly right that as the Q function gets better, the estimate Y also gets better. So the two things get better together, right? Because the Y is based on the Q function. And if the state space is massive, you might have a very difficult time training this model. There's better approaches that we'll see later.","zh":"它通常取决于环境、状态空间以及收敛所需的时间。但你完全正确，随着Q函数变得更好，估计的Y也会变得更好。因此，这两者会一起变好，对吧？因为Y是基于Q函数的。如果状态空间非常大，你可能会很难训练这个模型。我们之后会看到更好的方法。","start":2799.84,"end":2828.14},{"id":129,"text":"Yeah, correct. There was a question there. Yeah, so here I'm just saying, let's say when you send state S in Q, the left happens to be higher than right. But the same happens on the other side. Let's say the left is worse than right. Then what you will do is you will define your target Y as the reward that you observe on the right.","zh":"是的，正确。那里有一个问题。是的，所以这里我只是说，假设你将状态S输入Q，左边的值比右边高。但另一边的情况也是一样的。假设左边比右边差，那么你所做的就是将目标Y定义为你在右边观察到的奖励。","start":2829.43,"end":2856.56},{"id":130,"text":"Plus from the next state of having gone to the right, what's the best action and what's the Q value for that pair? And then it will give you the target for that scenario. So one complication with this training is that.","zh":"加上从向右移动的下一个状态中，最好的动作是什么，以及这对的Q值是多少？然后它会为你提供该情景的目标。因此，这种训练的一个复杂之处在于。","start":2857.24,"end":2874.62},{"id":131,"text":"When you want to differentiate L, so you want to perform a back propagation, you want to take the derivative of L with respect to the parameters of the network, you want Y to be a fixed thing, right? Because in supervised learning, Y is not differentiable. It's just a fixed number, 0 or 1 or a certain number. So here we're going to simplify and we're going to say this term that is dependent on the Q network. So technically, this term has parameters. So if you actually differentiate it, it will give you a value. We'll just hold it.","zh":"当你想要对L进行微分时，你想要进行反向传播，你想要对网络参数对L求导，你希望Y是一个固定的东西，对吧？因为在监督学习中，Y是不可微的。它只是一个固定的数字，0或1或某个特定的数字。因此，我们将简化并说这个依赖于Q网络的项。从技术上讲，这个项有参数。如果你实际对其进行微分，它会给出一个值。我们只是暂时将其保留。","start":2875.29,"end":2902.91},{"id":132,"text":"we do use our QNetwork","zh":"我们确实使用了我们的Q网络","start":2904.39,"end":2906.57},{"id":133,"text":"to perform an estimate of our Y","zh":"对我们的Y进行估计","start":2906.57,"end":2908.79},{"id":134,"text":"to perform an estimate of our Y","zh":"对我们的Y进行估计","start":2908.79,"end":2910.55}],"notes":["本段讲解了强化学习中目标Y的定义和Q函数的更新过程。教师指出，在每一步中，智能体根据当前状态和Q值选择动作，并基于下一个状态的奖励和Q值来计算目标Y。这种单步更新方式避免了多步预测的计算复杂性。","教师强调了在训练过程中，Y的计算依赖于Q函数的准确性。随着Q函数的改进，Y的估计也会随之提高，两者是相互促进的。然而，当状态空间非常大时，训练模型可能会变得困难，因此后续会介绍更优的方法。","在进行反向传播时，教师指出Y需要保持固定，以便进行梯度计算。这与监督学习中的情况类似，其中Y是固定的标签。然而，在强化学习中，Y依赖于Q网络，因此在实际计算中需要处理其参数的依赖性。","教师提到，为了简化计算，会将Y的估计视为固定值，尽管它实际上依赖于Q网络的参数。这种处理方式有助于进行梯度下降优化。","教师在最后提到使用Q网络来估计Y，这表明Q网络在强化学习中扮演了关键角色，用于预测未来奖励和动作的价值，从而指导智能体的决策。","教师通过具体的例子说明了如何根据当前状态和Q值选择动作，并计算目标Y。例如，当左动作的Q值高于右动作时，目标Y将基于右动作的奖励和Q值进行计算。"],"formulas":[],"uncertainties":["在段落130中，'we'll just hold it'的含义可能不明确，需要进一步澄清。"],"diagram":"none","start":2731.16,"end":2910.55,"asr_flags":[],"math_clarifications":["原始公式中的Y被定义为即时奖励r加上下一状态s'下采取动作a的最大Q值。然而，根据上下文，Y应为基于当前Q值和奖励的估计值，而不是直接等于r加上最大Q值。因此，该公式需要修正以反映正确的计算方式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":2731.16,"text":"How would you describe the loop? Yeah, you would stop at that point. Yeah, this is a good question. I'll show you how we fix certain things, but you do only one step, meaning you have your Q value at this point, and it tells you go to the left, and you just want to target Y. So what you do is you put left."},{"start":2761.96,"text":"and you look at your next state you forward propagate your next state you look at the two options you pick the best you don't go further you just use that one step you look one step ahead essentially you don't look multiple steps ahead you could but it would be more computationally heavy to do one more step again and so on so yeah um"},{"start":2799.84,"text":"It will typically be a function of the environment, the state space, how long it will take to converge. But you're perfectly right that as the Q function gets better, the estimate Y also gets better. So the two things get better together, right? Because the Y is based on the Q function. And if the state space is massive, you might have a very difficult time training this model. There's better approaches that we'll see later."},{"start":2829.43,"text":"Yeah, correct. There was a question there. Yeah, so here I'm just saying, let's say when you send state S in Q, the left happens to be higher than right. But the same happens on the other side. Let's say the left is worse than right. Then what you will do is you will define your target Y as the reward that you observe on the right."},{"start":2857.24,"text":"Plus from the next state of having gone to the right, what's the best action and what's the Q value for that pair? And then it will give you the target for that scenario. So one complication with this training is that."},{"start":2875.29,"text":"When you want to differentiate L, so you want to perform a back propagation, you want to take the derivative of L with respect to the parameters of the network, you want Y to be a fixed thing, right? Because in supervised learning, Y is not differentiable. It's just a fixed number, 0 or 1 or a certain number. So here we're going to simplify and we're going to say this term that is dependent on the Q network. So technically, this term has parameters. So if you actually differentiate it, it will give you a value. We'll just hold it."},{"start":2904.39,"text":"fixed. So we say"},{"start":2906.57,"text":"we do use our QNetwork"},{"start":2908.79,"text":"to perform an estimate of our Y"}],"speech_gaps":[],"frame":"../frames/v062/017.webp","frame_time":2743.16},{"title":"折扣因子与策略更新","segments":[{"id":135,"text":"but we will not differentiate it.","zh":"但我们不会对它进行微分。","start":2910.55,"end":2912.65},{"id":136,"text":"We will say it's fixed.","zh":"我们会说它是固定的。","start":2912.71,"end":2913.53},{"id":137,"text":"Because","zh":"因为","start":2918.67,"end":2919.19},{"id":138,"text":"going back to the reason","zh":"回到我们进行折扣的原因","start":2921.09,"end":2922.79},{"id":139,"text":"we discount is like the value of time.","zh":"我们进行折扣就像是时间的价值。","start":2922.79,"end":2924.57},{"id":140,"text":"It's like you probably want to say","zh":"它就像是你可能想要说","start":2925.11,"end":2926.63},{"id":141,"text":"if you can win the game in 10 moves","zh":"如果你能在10步内赢得游戏","start":2926.63,"end":2929.01},{"id":142,"text":"win it in 10 moves rather than 100","zh":"宁愿在10步内赢得游戏而不是100步","start":2929.01,"end":2930.79},{"id":143,"text":"moves. Or","zh":"移动。或者","start":2930.79,"end":2932.73},{"id":144,"text":"Or if you can get $1 today, get $1 today rather than in 10 years.","zh":"或者如果你今天可以得到1美元，今天得到1美元而不是10年后得到。","start":2932.73,"end":2936.37},{"id":145,"text":"All of that is why we have a discount here.","zh":"所有这些就是我们在这里使用折扣的原因。","start":2936.79,"end":2938.77},{"id":146,"text":"And the discount is a hyperparameter that you would define as well.","zh":"这个折扣是一个超参数，你也会定义它。","start":2939.25,"end":2943.79},{"id":147,"text":"That would influence the strategy of your agent.","zh":"这将影响你代理的策略。","start":2943.93,"end":2946.67},{"id":148,"text":"We're going to see it after, actually.","zh":"我们实际上会在之后看到这一点。","start":2950.59,"end":2951.87},{"id":149,"text":"I'm going to do a concrete example because it's a little complicated.","zh":"我将做一个具体的例子，因为它有点复杂。","start":2951.89,"end":2954.03},{"id":150,"text":"No, no, no.","zh":"不，不，不。","start":2959.73,"end":2960.37},{"id":151,"text":"It's a good point.","zh":"这是一个很好的观点。","start":2961.43,"end":2962.07},{"id":152,"text":"it's not that it's just q of it's it's a two by two it's a one by two so you have left and","zh":"并不是说它只是它的Q值，它是一个二乘二的，它是一个一乘二的，所以你有左边和","start":2962.07,"end":2968.83},{"id":153,"text":"right i was just going down the first case so i put the state left yeah yeah","zh":"右边，我刚才只是在讨论第一种情况，所以我把状态设为左边，是的，是的","start":2968.83,"end":2972.85},{"id":154,"text":"what if the rewards are not fixed i mean in most games we're going to see right now the rewards","zh":"如果奖励不是固定的呢？我的意思是，在大多数游戏中，我们现在看到的奖励","start":2980.75,"end":2984.79},{"id":155,"text":"are going to be fixed by the designer of the game the human that's designing the game in practice","zh":"将由游戏的设计者，也就是设计游戏的人类，在实践中固定下来","start":2984.79,"end":2990.15},{"id":156,"text":"you could have a separate function that actually comes up with the reward. We're going to see an","zh":"你可以有一个单独的函数，实际上会生成奖励。我们将在本节课后面看到一个","start":2990.15,"end":2996.25},{"id":157,"text":"example later in the lecture where the reward might be different in different scenarios and","zh":"例子，其中奖励可能在不同的场景中有所不同，并且有一个函数，有时称为批评者，来确定在某个","start":2996.25,"end":3001.09},{"id":158,"text":"there's a function or sometimes called a critique that determines what's the reward in a certain","zh":"特定情况下奖励是什么","start":3001.09,"end":3006.37},{"id":159,"text":"Okay, this is one last question and then we move because we're going to see a concrete example is going to be clear. So when we hold it fixed for backup, is that what differentiates this from iterating through all of the possible actions? Yeah. So instead of doing the backtracking down the tree and going over everything, we're saying we're going to limit ourselves to just picking the best action based on our current understanding of the network.","zh":"好的，这是最后一个问题，然后我们就继续，因为我们即将看到一个具体的例子，这会变得很清楚。所以当我们固定它时，这与遍历所有可能的动作有什么不同？是的。因此，我们不是通过回溯树并检查所有内容来执行，而是说我们要限制自己，仅仅根据我们对网络的当前理解来选择最佳动作。","start":3008.59,"end":3037.08},{"id":160,"text":"You see, my network is kind of intelligent, not great. We're in the middle of training. It says that I should go to the left. And then if I look at the next state when I'm in the left, it says I should go to the right. I will trust it because it's the best I have, best estimate I have. But I will discount that. And then if you keep repeating that, it turns out that not only your estimate gets better, but your model gets trained. And then ultimately, both together get to an optimality equation. So it's a funky concept, right?","zh":"你明白的，我的网络有点智能，但并不是很好。我们正处于训练过程中。它说我要向左走。然后当我处于左边的状态时，它又说我要向右走。我会信任它，因为它是我目前最好的估计。但我会对这个估计进行折扣。然后如果你不断重复这个过程，结果不仅你的估计会变好，你的模型也会被训练。最终，两者都会达到一个最优性方程。这是一个有点奇怪的概念，对吧？","start":3038.52,"end":3068.41},{"id":161,"text":"But you get it. We're going to see examples.","zh":"但你已经明白了。我们将看到例子。","start":3069.23,"end":3073.07},{"id":162,"text":"OK, so then once you have been able to use the Bellman equation to estimate your targets, you perform a classic back propagation and you update the parameters of the network and you repeat that process.","zh":"好的，那么一旦你能够使用贝尔曼方程来估计你的目标，你就会执行经典的反向传播，并更新网络的参数，然后重复这个过程。","start":3073.95,"end":3089.59}],"notes":["本段主要讲解了折扣因子（discount factor）的概念，它用于衡量未来奖励的价值，类似于时间价值。折扣因子是一个超参数，会影响智能体的策略。讲者提到，折扣因子的存在是为了让智能体更重视当前的奖励，而不是遥远的未来奖励。例如，获得1美元今天比10年后获得1美元更有价值。"],"formulas":[],"uncertainties":["it's not that it's just q of it's it's a two by two it's a one by two so you have left and","right i was just going down the first case so i put the state left yeah yeah","what if the rewards are not fixed i mean in most games we're going to see right now the rewards","are going to be fixed by the designer of the game the human that's designing the game in practice","you could have a separate function that actually comes up with the reward. We're going to see an","example later in the lecture where the reward might be different in different scenarios and","there's a function or sometimes called a critique that determines what's the reward in a certain"],"diagram":"none","start":2910.55,"end":3089.59,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":2910.55,"text":"but we will not differentiate it."},{"start":2912.71,"text":"We will say it's fixed."},{"start":2918.67,"text":"Because"},{"start":2921.09,"text":"going back to the reason"},{"start":2922.79,"text":"we discount is like the value of time."},{"start":2925.11,"text":"It's like you probably want to say"},{"start":2926.63,"text":"if you can win the game in 10 moves"},{"start":2929.01,"text":"win it in 10 moves rather than 100"},{"start":2930.79,"text":"moves. Or"},{"start":2932.73,"text":"Or if you can get $1 today, get $1 today rather than in 10 years."},{"start":2936.79,"text":"All of that is why we have a discount here."},{"start":2939.25,"text":"And the discount is a hyperparameter that you would define as well."},{"start":2943.93,"text":"That would influence the strategy of your agent."},{"start":2950.59,"text":"We're going to see it after, actually."},{"start":2951.89,"text":"I'm going to do a concrete example because it's a little complicated."},{"start":2959.73,"text":"No, no, no."},{"start":2961.43,"text":"It's a good point."},{"start":2962.07,"text":"it's not that it's just q of it's it's a two by two it's a one by two so you have left and"},{"start":2968.83,"text":"right i was just going down the first case so i put the state left yeah yeah"},{"start":2980.75,"text":"what if the rewards are not fixed i mean in most games we're going to see right now the rewards"},{"start":2984.79,"text":"are going to be fixed by the designer of the game the human that's designing the game in practice"},{"start":2990.15,"text":"you could have a separate function that actually comes up with the reward. We're going to see an"},{"start":2996.25,"text":"example later in the lecture where the reward might be different in different scenarios and"},{"start":3001.09,"text":"there's a function or sometimes called a critique that determines what's the reward in a certain"},{"start":3008.59,"text":"Okay, this is one last question and then we move because we're going to see a concrete example is going to be clear. So when we hold it fixed for backup, is that what differentiates this from iterating through all of the possible actions? Yeah. So instead of doing the backtracking down the tree and going over everything, we're saying we're going to limit ourselves to just picking the best action based on our current understanding of the network."},{"start":3038.52,"text":"You see, my network is kind of intelligent, not great. We're in the middle of training. It says that I should go to the left. And then if I look at the next state when I'm in the left, it says I should go to the right. I will trust it because it's the best I have, best estimate I have. But I will discount that. And then if you keep repeating that, it turns out that not only your estimate gets better, but your model gets trained. And then ultimately, both together get to an optimality equation. So it's a funky concept, right?"},{"start":3069.23,"text":"But you get it. We're going to see examples."},{"start":3073.95,"text":"OK, so then once you have been able to use the Bellman equation to estimate your targets, you perform a classic back propagation and you update the parameters of the network and you repeat that process."}],"speech_gaps":[{"start":2947.92,"end":2950.19}],"frame":"../frames/v062/018.webp","frame_time":2922.55},{"title":"Q学习算法与Breakout游戏应用","segments":[{"id":163,"text":"process. Here is concretely, if you were to code it in pseudocode, here is what it would","zh":"过程。具体来说，如果你要将其编写为伪代码，那么用Q学习训练一个强化学习代理的伪代码会是这样的。","start":3089.59,"end":3098.79},{"id":164,"text":"look like to train an RL agent using Q-learning. We start by initializing our Q-network parameters,","zh":"我们首先初始化我们的Q网络参数，即初始化。最初是随机的。然后我们会在每个回合中循环。作为提醒，","start":3098.79,"end":3107.13},{"id":165,"text":"so initialization. It's random at first. Then we will loop over episode. As a reminder,","zh":"他们的回合是一整局游戏","start":3107.57,"end":3113.77},{"id":166,"text":"their episodes are one full game","zh":"从开始到终止状态。","start":3113.77,"end":3115.47},{"id":167,"text":"from start to terminal state.","zh":"在","start":3115.47,"end":3116.71},{"id":168,"text":"Within","zh":"一个回合中，我们将从","start":3118.99,"end":3119.51},{"id":169,"text":"an episode, we're going to start from","zh":"初始状态S开始，并且我们会循环","start":3119.51,"end":3121.49},{"id":170,"text":"the initial state S, and we're going to loop","zh":"初始状态 S，并且我们将进行循环","start":3121.49,"end":3123.53},{"id":171,"text":"over time steps until","zh":"随着时间步长直到","start":3123.53,"end":3125.41},{"id":172,"text":"we reach a terminal state.","zh":"我们到达一个终端状态。","start":3125.41,"end":3126.73},{"id":173,"text":"So within","zh":"因此，在","start":3127.79,"end":3128.83},{"id":174,"text":"one time step, here's what we","zh":"一个时间步长内，我们将执行以下操作。我们将前向传播","start":3128.83,"end":3131.45},{"id":175,"text":"will do. We forward propagate","zh":"队列网络中的状态 S。","start":3131.45,"end":3133.23},{"id":176,"text":"the state S in the queue network.","zh":"我们将执行具有最大队列值的动作","start":3133.23,"end":3134.97},{"id":177,"text":"We will execute the action","zh":"我们将执行该动作","start":3135.85,"end":3137.63},{"id":178,"text":"A that has the maximum queue value.","zh":"具有最大队列值的动作A。","start":3137.63,"end":3139.73},{"id":179,"text":"We will observe a reward,","zh":"我们将观察到一个奖励，","start":3141.63,"end":3143.07},{"id":180,"text":"and we will also observe a next state, S'.","zh":"同时我们还将观察到下一个状态，S'。","start":3143.07,"end":3146.57},{"id":181,"text":"We will use that S' to compute our target Y","zh":"我们将使用这个S'来计算我们的目标Y","start":3147.35,"end":3150.65},{"id":182,"text":"by forward propagating S' in the Q network","zh":"通过将S'前向传播到Q网络中","start":3150.65,"end":3153.19},{"id":183,"text":"and then computing our loss function.","zh":"然后计算我们的损失函数。","start":3154.07,"end":3155.77},{"id":184,"text":"And based on that, we will use gradient descent","zh":"基于这个，我们将使用梯度下降","start":3156.29,"end":3159.73},{"id":185,"text":"to update the parameters of the network.","zh":"来更新网络的参数。","start":3159.73,"end":3161.33},{"id":186,"text":"Should be simpler looked at like that, right?","zh":"这样看起来应该更简单，对吧？","start":3164.09,"end":3166.43},{"id":187,"text":"Okay, so this is the vanilla Q learning.","zh":"好的，所以这就是普通的Q学习。","start":3168.63,"end":3171.69},{"id":188,"text":"So to summarize again, the main difference is that we don't have a target and we use our own network to estimate the target.","zh":"所以再次总结一下，主要的区别是，我们没有目标值，而是使用自己的网络来估计目标值。","start":3173.19,"end":3180.37},{"id":189,"text":"And the rewards are what's going to help us get better over time.","zh":"而奖励值将帮助我们在时间推移中变得更好。","start":3180.45,"end":3183.37},{"id":190,"text":"By the way, it's okay if you don't understand everything.","zh":"顺便说一句，如果你不理解所有内容也没关系。","start":3189.41,"end":3191.09},{"id":191,"text":"This is an entire class at Stanford, an entire quarter of studying that type of stuff.","zh":"这是一整门斯坦福的课程，整整一个季度都在学习这类内容。","start":3191.21,"end":3196.35},{"id":192,"text":"So we're trying to get the basics within an hour and a half, two hours.","zh":"因此，我们试图在1个半小时到2个小时内掌握基础知识。","start":3196.61,"end":3199.89},{"id":193,"text":"okay let's go a little further now together um","zh":"好的，我们现在一起更进一步吧。","start":3202.53,"end":3206.03},{"id":194,"text":"and apply that to an actual game so here's the game it's called breakout","zh":"并将它应用到一个实际的游戏上，这个游戏叫做Breakout","start":3208.31,"end":3212.17},{"id":195,"text":"we want to destroy all the bricks who has played breakout in the past","zh":"我们想要摧毁所有曾经玩过Breakout游戏的砖块","start":3212.17,"end":3216.15},{"id":196,"text":"what do you feel okay good so you have a paddle that you control and you are trying to","zh":"你感觉怎么样？很好。你有一个可以控制的挡板，你试图","start":3216.15,"end":3222.33},{"id":197,"text":"destroy the bricks if the ball gets past your paddle you lost and if the bricks are all","zh":"摧毁砖块。如果球过了你的挡板，你就输了。如果所有砖块都被","start":3223.21,"end":3228.97},{"id":198,"text":"destroyed you want. That's it. Let's do it together. What is the input of our queue network?","zh":"摧毁了，你想要。就是这样。我们一起做吧。我们的Q网络的输入是什么？","start":3228.97,"end":3239.07},{"id":199,"text":"What would you use as input?","zh":"你会用什么作为输入？","start":3240.55,"end":3241.91},{"id":200,"text":"Yes. Entire screen. Okay, let's do that. So I think I define that as the state s.","zh":"是的。整个屏幕。好的，我们这样做吧。我认为我将这个定义为状态s。","start":3243.89,"end":3258.47},{"id":201,"text":"Which is the input to my Q network.","zh":"这是我的Q网络的输入。","start":3258.97,"end":3260.35},{"id":202,"text":"What's the output of the Q network?","zh":"Q网络的输出是什么？","start":3261.53,"end":3263.09},{"id":203,"text":"Yes.","zh":"是的。","start":3265.43,"end":3265.79}],"notes":["本段讲解了Q学习算法的基本流程，包括初始化Q网络参数、循环训练回合（episode）、在每个回合中循环时间步（time steps），以及在每个时间步中执行动作、观察奖励和下一个状态，最后通过梯度下降更新网络参数。"],"formulas":[],"uncertainties":["queue network","maximum queue value"],"diagram":"none","start":3089.59,"end":3265.79,"asr_flags":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":3089.59,"text":"process. Here is concretely, if you were to code it in pseudocode, here is what it would"},{"start":3098.79,"text":"look like to train an RL agent using Q-learning. We start by initializing our Q-network parameters,"},{"start":3107.57,"text":"so initialization. It's random at first. Then we will loop over episode. As a reminder,"},{"start":3113.77,"text":"their episodes are one full game"},{"start":3115.47,"text":"from start to terminal state."},{"start":3118.99,"text":"Within"},{"start":3119.51,"text":"an episode, we're going to start from"},{"start":3121.49,"text":"the initial state S, and we're going to loop"},{"start":3123.53,"text":"over time steps until"},{"start":3125.41,"text":"we reach a terminal state."},{"start":3127.79,"text":"So within"},{"start":3128.83,"text":"one time step, here's what we"},{"start":3131.45,"text":"will do. We forward propagate"},{"start":3133.23,"text":"the state S in the queue network."},{"start":3135.85,"text":"We will execute the action"},{"start":3137.63,"text":"A that has the maximum queue value."},{"start":3141.63,"text":"We will observe a reward,"},{"start":3143.07,"text":"and we will also observe a next state, S'."},{"start":3147.35,"text":"We will use that S' to compute our target Y"},{"start":3150.65,"text":"by forward propagating S' in the Q network"},{"start":3154.07,"text":"and then computing our loss function."},{"start":3156.29,"text":"And based on that, we will use gradient descent"},{"start":3159.73,"text":"to update the parameters of the network."},{"start":3164.09,"text":"Should be simpler looked at like that, right?"},{"start":3168.63,"text":"Okay, so this is the vanilla Q learning."},{"start":3173.19,"text":"So to summarize again, the main difference is that we don't have a target and we use our own network to estimate the target."},{"start":3180.45,"text":"And the rewards are what's going to help us get better over time."},{"start":3189.41,"text":"By the way, it's okay if you don't understand everything."},{"start":3191.21,"text":"This is an entire class at Stanford, an entire quarter of studying that type of stuff."},{"start":3196.61,"text":"So we're trying to get the basics within an hour and a half, two hours."},{"start":3202.53,"text":"okay let's go a little further now together um"},{"start":3208.31,"text":"and apply that to an actual game so here's the game it's called breakout"},{"start":3212.17,"text":"we want to destroy all the bricks who has played breakout in the past"},{"start":3216.15,"text":"what do you feel okay good so you have a paddle that you control and you are trying to"},{"start":3223.21,"text":"destroy the bricks if the ball gets past your paddle you lost and if the bricks are all"},{"start":3228.97,"text":"destroyed you want. That's it. Let's do it together. What is the input of our queue network?"},{"start":3240.55,"text":"What would you use as input?"},{"start":3243.89,"text":"Yes. Entire screen. Okay, let's do that. So I think I define that as the state s."},{"start":3258.97,"text":"Which is the input to my Q network."},{"start":3261.53,"text":"What's the output of the Q network?"},{"start":3265.43,"text":"Yes."}],"speech_gaps":[],"frame":"../frames/v062/019.webp","frame_time":3101.59},{"title":"深度强化学习中的输出与输入处理","segments":[{"id":204,"text":"Good question.","zh":"好问题。","start":3269.07,"end":3269.79},{"id":205,"text":"We'll get there.","zh":"我们会讲到的。","start":3269.93,"end":3270.59},{"id":206,"text":"I'm going to ask you, but do we have to look at the full screen?","zh":"我要问你们，但我们需要查看整个屏幕吗？","start":3270.81,"end":3275.37},{"id":207,"text":"Answer is no, but we'll see why. What's the output? Yeah. The game score? No, but we're going to talk about the game score in the back. Yeah, let's talk about the output first, and then we'll talk about the stuff we can get rid of on the inputs. But what's the output? Yeah. The actions? Yeah, the actions. So, yeah, it will be the Q values.","zh":"答案是否定的，但我们会看到原因。什么是输出？是的。游戏得分？不，但我们会在后面讨论游戏得分。是的，让我们先讨论输出，然后再讨论输入中可以去掉的内容。但什么是输出？是的。动作？是的，动作。所以，是的，它将是Q值。","start":3275.94,"end":3305.79},{"id":208,"text":"associated with the actions in state s, remember it's a q function, so the output is we need one value for left, one value for right, and one value for idle. You could make this game more complicated and say","zh":"与状态s中的动作相关，记住这是一个Q函数，因此输出是我们需要为左、右和空闲各一个值。你可以让这个游戏更复杂，并说","start":3307.07,"end":3318.53},{"id":209,"text":"We have eight actions. We have a little bit to the left, a lot to the left, a lot more to the left. You know, if you had multiple buttons, but let's simplify and say three actions. Either you don't move, you move to the left or you move to the right. So these are the outputs. So now let's get to the question of the screen. Do we need the entire screen? So you were saying something earlier.","zh":"我们有八个动作。我们有稍微向左一点，很多向左，更多向左。你知道的，如果你有多个按钮，但让我们简化并说三个动作。要么你不移动，要么向左移动，要么向右移动。因此这些是输出。现在让我们回到屏幕的问题。我们需要整个屏幕吗？你之前说过一些话。","start":3319.39,"end":3339.82},{"id":210,"text":"Okay, so you say you need the tray and the bricks. I would argue you need more because there's the walls. And I guess that you could, if you're an expert player, you could know where the walls are. But generally, you need a little more than that. What would be obviously things we can get rid of? And why would we do that? Okay, the score at the top. Who would remove the score at the top? About half? Why would you not remove it? Why would you remove it?","zh":"好的，你说你需要托盘和砖块。我认为你需要更多，因为还有墙壁。我想，如果你是专家玩家，你可能知道墙壁在哪里。但通常，你需要的比这些更多。什么显然是我们可以去掉的东西？为什么我们要这么做？好的，顶部的得分。谁会去掉顶部的得分？大约一半？为什么你不把它去掉？为什么你要去掉它？","start":3348.17,"end":3390.56},{"id":211,"text":"OK, you want to always win. So the score doesn't matter. It's true. We would remove the score. So you could actually crop the top. You could also crop the bottom. I mean, if you pass the paddle, you don't care about the few pixels at the bottom. You could get rid of them. This is not always true. There are games where the score matters. And in fact.","zh":"好的，你想总是赢。所以得分不重要。这是真的。我们会去掉得分。因此，你实际上可以裁剪顶部。你也可以裁剪底部。我的意思是，如果你通过了挡板，你就不关心底部的几个像素。你可以去掉它们。这并不总是正确的。有些游戏中得分是重要的。事实上。","start":3395.36,"end":3416.06},{"id":212,"text":"I like football, soccer. In soccer, if you're 1-0 up, you can park the bus. So your strategy is dependent on the score that you have. You wouldn't park the bus if you're losing 1-0. Parking the bus means you ask every player to come back and defend. If you're losing, you would actually do the opposite. You would go all-out attack.","zh":"我喜欢足球，足球。在足球比赛中，如果你领先1-0，你可以采取守势。因此，你的策略取决于当前的比分。如果你落后1-0，你不会采取守势。采取守势意味着要求所有球员回撤防守。如果你处于落后状态，你会采取相反的策略。你会全力进攻。","start":3416.75,"end":3437.45}],"notes":["本段讨论了深度强化学习中输出与输入的处理。讲者首先指出输出应为与动作相关的Q值，即每个动作对应一个值，如左、右、不动。接着，讲者提到输入处理时，是否需要整个屏幕，以及哪些部分可以被裁剪或去除。","讲者通过游戏中的例子说明，输出应为与动作相关的Q值，而输入处理时，如屏幕信息，可以去除不重要的部分，如顶部的分数和底部的像素，但并非所有情况下都适用。","讲者以足球比赛为例，说明在某些情况下，分数信息对策略制定至关重要，因此不能简单地去除。这表明输入处理需根据具体任务进行调整。","讲者强调了输入处理的灵活性，即根据任务需求去除或保留某些信息，如屏幕的某些部分，但需注意不同任务的差异性。","讲者通过足球比赛的策略变化，说明了输入信息（如分数）对策略制定的影响，进一步强调了输入处理的重要性。","本段内容主要围绕深度强化学习中输出与输入的处理，强调了Q值输出和输入信息裁剪的必要性，以及不同任务中输入处理的差异性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3269.07,"end":3437.45,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":3269.07,"text":"Good question."},{"start":3269.93,"text":"We'll get there."},{"start":3270.81,"text":"I'm going to ask you, but do we have to look at the full screen?"},{"start":3275.94,"text":"Answer is no, but we'll see why. What's the output? Yeah. The game score? No, but we're going to talk about the game score in the back. Yeah, let's talk about the output first, and then we'll talk about the stuff we can get rid of on the inputs. But what's the output? Yeah. The actions? Yeah, the actions. So, yeah, it will be the Q values."},{"start":3307.07,"text":"associated with the actions in state s remember it's a q function so the output is we need one value for left one value for right and one value for idle you could make this game more complicated and say"},{"start":3319.39,"text":"We have eight actions. We have a little bit to the left, a lot to the left, a lot more to the left. You know, if you had multiple buttons, but let's simplify and say three actions. Either you don't move, you move to the left or you move to the right. So these are the outputs. So now let's get to the question of the screen. Do we need the entire screen? So you were saying something earlier."},{"start":3348.17,"text":"Okay, so you say you need the tray and the bricks. I would argue you need more because there's the walls. And I guess that you could, if you're an expert player, you could know where the walls are. But generally, you need a little more than that. What would be obviously things we can get rid of? And why would we do that? Okay, the score at the top. Who would remove the score at the top? About half? Why would you not remove it? Why would you remove it?"},{"start":3395.36,"text":"OK, you want to always win. So the score doesn't matter. It's true. We would remove the score. So you could actually crop the top. You could also crop the bottom. I mean, if you pass the paddle, you don't care about the few pixels at the bottom. You could get rid of them. This is not always true. There are games where the score matters. And in fact."},{"start":3416.75,"text":"I like football, soccer. In soccer, if you're 1-0 up, you can park the bus. So your strategy is dependent on the score that you have. You wouldn't park the bus if you're losing 1-0. Parking the bus means you ask every player to come back and defend. If you're losing, you would actually do the opposite. You would go all-out attack."}],"speech_gaps":[],"frame":"../frames/v062/020.webp","frame_time":3281.07},{"title":"图像预处理与历史帧的重要性","segments":[{"id":213,"text":"So in certain games, you want the scores. In others, you don't want. And so it's part of the designer, the AI engineer that's working on that to determine what information we need and what we don't need. What else can we do to reduce the dimensionality of the problem and make our computation faster?","zh":"所以在某些游戏中，你需要得分；而在其他游戏中则不需要。因此，这是设计师或正在处理该问题的AI工程师需要决定我们需要哪些信息，以及不需要哪些信息。除此之外，我们还能做些什么来降低问题的维度，使我们的计算更快呢？","start":3438.43,"end":3453.05},{"id":214,"text":"Yeah, remove the RGB channels, so do grayscale, essentially. That's true. Here, you actually don't need the colors. It's just nice as a user for user experience purposes. You don't need, I don't think there's different points based on the bricks that you destroy. It's all the same. Actually, funny enough, this algorithm was used by...","zh":"是的，移除RGB通道，也就是做灰度处理。这是正确的。在这里，实际上你并不需要颜色。这只是对用户体验的一种友好做法。我认为，你不需要根据摧毁的砖块来区分不同的点。它们都是一样的。有趣的是，这个算法曾被... ","start":3455.66,"end":3476.42},{"id":215,"text":"DeepMind to play a lot of Atari games, and they did a single preprocessing where they removed the channels because they said it doesn't matter. Turns out in one of the games, I think it was Sequest, I forgot which one, the fish disappeared when you did that. And so that game didn't work. The agent couldn't crack it because they thought that the same preprocessing could apply to every game, but actually they had to make a slight tweak. Correct.","zh":"DeepMind用来玩很多Atari游戏，并且他们做了一次单一的预处理，即移除了通道，因为他们认为这并不重要。结果在其中一款游戏中，我想是Sequest，我忘了具体是哪一款，当你这么做时，鱼就消失了。因此，该游戏无法正常运行。智能体无法解决这个问题，因为它认为相同的预处理可以适用于所有游戏，但实际上他们需要做一些细微的调整。正确。","start":3477.95,"end":3515.78},{"id":216,"text":"So just to recap, you could do it even better by using a low dimensional representation of this game that describes the game. It's true, but because we want to use a single algorithm for 50 plus Atari games, we say the human sees the screen, we just give the screen and it will probably scale better.","zh":"所以，为了总结一下，你可以通过使用一个低维表示来更好地描述该游戏。这是正确的，但由于我们希望用一个算法来处理50多款Atari游戏，我们说人类看到屏幕，我们只需提供屏幕，这样可能会有更好的扩展性。","start":3516.92,"end":3533.96},{"id":217,"text":"essentially but you're perfectly right if you are working on only that game okay so let's do that we will do pre-processing there's one last thing that nobody mentioned which is history because in fact if you get only one screen you don't know where the ball is going","zh":"本质上，如果你只专注于该游戏，你完全正确。那么，我们来做预处理。还有一件事没有人提到，那就是历史信息，因为事实上，如果你只获取一张屏幕，你就不知道球的运动方向。","start":3534.43,"end":3547.61},{"id":218,"text":"So actually, you can solve the game. And the way you fix that is by giving a history of multiple screens. For example, four screens so that you see the direction that the ball is going in. So our preprocessing function is called Phi of S, let's say. And Phi of S is a mix of, you know, you might do convert to grayscale, reduce the dimension, the height and width, and also add the history of four frames. And that should be enough.","zh":"所以实际上，你可以解决这个游戏。解决方法是提供多个屏幕的历史信息。例如，四张屏幕，这样你就能看到球的运动方向。因此，我们的预处理函数称为Phi(S)，假设。Phi(S)包括将图像转换为灰度、降低维度（高度和宽度），并添加四帧的历史信息。这应该就足够了。","start":3548.44,"end":3574.8},{"id":219,"text":"Turns out in most games, you will need the history, a little bit of history to know where the ball is going. In this example, can you not just encode the velocity vector of the ball? Yeah, you could replace the history, so multiple screens, by just adding the gradient or the velocity of where the ball is going. That's true, but would it scale to every game? Turns out this, because we know humans look at the Atari machine and they look at pixels, this would be more likely to scale to every game.","zh":"事实上，在大多数游戏中，你需要一些历史信息，一点点历史信息来知道球的去向。在这个例子中，你不能仅仅编码球的速度向量吗？是的，你可以用多个屏幕来替换，只需添加球的去向的梯度或速度。这是正确的，但这种方法能推广到每一个游戏吗？事实上，因为我们知道人类在观看Atari机器时，他们是通过像素来观察的，这种方法更有可能推广到每一个游戏。","start":3576.22,"end":3605.87}],"notes":["本段讨论了图像预处理在深度强化学习中的重要性，特别是颜色通道的去除和历史帧的使用。讲者指出，虽然去除颜色通道可以减少计算复杂度，但某些游戏（如Sequest）中，这种预处理会导致关键信息丢失，从而影响智能体的表现。因此，需要根据具体游戏进行调整。","讲者强调了历史帧在游戏理解中的作用，指出仅使用单帧图像无法捕捉球的运动方向，因此需要结合多个帧的信息。这表明，历史帧的引入有助于智能体更好地理解游戏动态。","讲者提到，虽然可以使用球的速度向量来替代历史帧，但这种方法可能无法适用于所有游戏。因此，采用基于像素的历史帧处理方式更有可能在不同游戏中保持一致性。","讲者指出，预处理函数Phi(S)通常包括灰度转换、尺寸缩减和历史帧的添加。这种综合处理方式能够有效降低维度，同时保留足够的信息以支持智能体的学习。","讲者提到，人类在观察Atari游戏时依赖像素信息，因此基于像素的预处理方法更有可能在不同游戏中保持一致性。这表明，预处理方法的选择需要考虑人类的感知方式。","讲者强调了在深度强化学习中，预处理方法的选择需要根据具体游戏进行调整，不能一概而论。这表明，预处理方法的灵活性和适应性是关键因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3438.43,"end":3605.87,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3438.43,"text":"So in certain games, you want the scores. In others, you don't want. And so it's part of the designer, the AI engineer that's working on that to determine what information we need and what we don't need. What else can we do to reduce the dimensionality of the problem and make our computation faster?"},{"start":3455.66,"text":"Yeah, remove the RGB channels, so do grayscale, essentially. That's true. Here, you actually don't need the colors. It's just nice as a user for user experience purposes. You don't need, I don't think there's different points based on the bricks that you destroy. It's all the same. Actually, funny enough, this algorithm was used by..."},{"start":3477.95,"text":"DeepMind to play a lot of Atari games, and they did a single preprocessing where they removed the channels because they said it doesn't matter. Turns out in one of the games, I think it was Sequest, I forgot which one, the fish disappeared when you did that. And so that game didn't work. The agent couldn't crack it because they thought that the same preprocessing could apply to every game, but actually they had to make a slight tweak. Correct."},{"start":3516.92,"text":"So just to recap, you could do it even better by using a low dimensional representation of this game that describes the game. It's true, but because we want to use a single algorithm for 50 plus Atari games, we say the human sees the screen, we just give the screen and it will probably scale better."},{"start":3534.43,"text":"essentially but you're perfectly right if you are working on only that game okay so let's do that we will do pre-processing there's one last thing that nobody mentioned which is history because in fact if you get only one screen you don't know where the ball is going"},{"start":3548.44,"text":"So actually, you can solve the game. And the way you fix that is by giving a history of multiple screens. For example, four screens so that you see the direction that the ball is going in. So our preprocessing function is called Phi of S, let's say. And Phi of S is a mix of, you know, you might do convert to grayscale, reduce the dimension, the height and width, and also add the history of four frames. And that should be enough."},{"start":3576.22,"text":"Turns out in most games, you will need the history, a little bit of history to know where the ball is going. In this example, can you not just encode the velocity vector of the ball? Yeah, you could replace the history, so multiple screens, by just adding the gradient or the velocity of where the ball is going. That's true, but would it scale to every game? Turns out this, because we know humans look at the Atari machine and they look at pixels, this would be more likely to scale to every game."}],"speech_gaps":[],"frame":"../frames/v062/021.webp","frame_time":3450.43},{"title":"深度强化学习中的预处理与训练技巧","segments":[{"id":220,"text":"Like think about a game where actually Sequest is a good game or Space Invaders where you have multiple enemies coming at you, then you would need to change your pre-processing to take into account the velocity of all these enemies so it wouldn't work the same way. While if you actually give the pixels, you actually from the pixels get the velocity of all your enemies and the directions they're going.","zh":"比如想象一个游戏，其中Sequest是一个好游戏或者Space Invaders，你有多个敌人朝你袭来，那么你需要改变你的预处理，以考虑所有这些敌人的速度，这样它就不会以同样的方式工作。而如果你直接给出像素，你实际上可以从像素中获取所有敌人的速度以及它们的移动方向。","start":3609.06,"end":3629.4},{"id":221,"text":"So this is our preprocessing. I'm going to refer to it as 5S. And our DeepQ network architecture, because we're working with pixels, is going to be a convolutional network. Don't worry if you haven't learned it yet in the class, but it's a bunch of conv and relu activations. And then we end with a fully connected layer that gives us the three Q values for the different actions. So nothing special here.","zh":"这就是我们的预处理。我称之为5S。我们的DeepQ网络架构，因为我们使用的是像素，将是一个卷积网络。如果你还没在课堂上学过，不用担心，它是一系列卷积和ReLU激活函数。然后我们以一个全连接层结束，这会给我们不同动作的三个Q值。所以这里没有什么特别之处。","start":3630.94,"end":3660.47},{"id":222,"text":"We're going to go back to our vanilla training. So this one that we saw together earlier. And we're going to look at tips to train reinforcement learning algorithms. Those tips are not specific to Q-learning. Some of them are applied to a lot more than Q-learning. And they're very important to know. And they're part of the reason reinforcement learning has worked better in the last few years.","zh":"我们将回到我们之前一起看到的原始训练方法。我们将看一下训练强化学习算法的技巧。这些技巧并不特定于Q学习。其中一些技巧适用于比Q学习更多的算法。它们非常重要，而且是强化学习在过去几年中表现更好的原因之一。","start":3661.88,"end":3683.22},{"id":223,"text":"So one of the things that's pretty simple that we forgot to do is the preprocessing that we just did. So anywhere I had an S, I'm going to instead run S through the preprocessing step. I'm going to use phi of S. So I initialize instead of S with phi of S. I start from the initial state phi of S, and then I forward propagate phi of S. I get the Q of...","zh":"我们忘记做的一件相当简单的事情就是我们刚刚做的预处理。所以任何地方我有S，我将改为运行S通过预处理步骤。我将使用phi of S。因此，我初始化时不是用S，而是用phi of S。我从初始状态phi of S开始，然后将phi of S前向传播。我得到Q的...","start":3684.62,"end":3709.7},{"id":224,"text":"that pre-processed state in action A, and et cetera, et cetera. And then when I get my next state, so let's say I look at my current pre-processed state, I forward propagate it once, I see the three Q values, in our case the two Q values, one of them was better than the other, action right, then I get my next state, S prime, I want to pre-process that state as well. So that's pretty straightforward. You just replace all of that.","zh":"在动作A中的预处理状态，以及如此等等。然后当我得到我的下一个状态时，比如说，我查看我的当前预处理状态，将其前向传播一次，我看到三个Q值，在我们的情况下是两个Q值，其中一个比另一个更好，即向右的动作，然后我得到我的下一个状态S prime，我也需要对这个状态进行预处理。所以这非常直接。你只需替换所有这些内容。","start":3710.03,"end":3740.35},{"id":225,"text":"The second thing we forgot to do is to keep track of the terminal states. In our pseudocode, there is no concept of terminal states. It's pretty easy to add. You would probably just do an if-else statement. You would create a Boolean to detect terminal states. So let's say your Boolean is terminal equals false. And then as you loop over the time step of a single episode, every time you're going to check is.","zh":"我们忘记做的第二件事是跟踪终止状态。在我们的伪代码中，没有终止状态的概念。这很容易添加。你可能会使用一个if-else语句。你会创建一个布尔变量来检测终止状态。例如，你的布尔变量terminal初始为false。然后在单个回合的时间步循环中，每次都会检查是否。","start":3742.02,"end":3763.64}],"notes":["本段主要讲解了在强化学习中预处理的重要性，特别是在处理像Space Invaders这样的游戏时，需要从像素中提取敌人的速度和方向信息。预处理步骤被称作5S，是DeepQ网络架构的一部分，该架构使用卷积网络处理像素数据，最后通过全连接层输出不同动作的Q值。","讲者提到在训练过程中需要将原始状态S替换为预处理后的状态phi(S)，并在每个时间步检查是否到达终端状态。这一步骤对于确保算法正确处理游戏结束的情况非常重要。","讲者强调了预处理和终端状态检测是训练强化学习算法时的两个关键点，这些技巧不仅适用于Q-learning，也适用于其他算法。这些技巧是近年来强化学习取得更好效果的重要原因之一。","讲者提到在伪代码中没有终端状态的概念，但可以通过简单的if-else语句来实现。终端状态的检测可以通过布尔变量来实现，这有助于在每个时间步判断是否结束当前回合。","讲者还提到在处理下一个状态S'时，也需要进行预处理，以确保所有状态都经过相同的预处理步骤，从而保持输入的一致性。","讲者强调了预处理和终端状态检测在强化学习训练中的重要性，这些步骤是确保算法正确性和稳定性的重要组成部分。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3609.06,"end":3763.64,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3609.06,"text":"Like think about a game where actually Sequest is a good game or Space Invaders where you have multiple enemies coming at you, then you would need to change your pre-processing to take into account the velocity of all these enemies so it wouldn't work the same way. While if you actually give the pixels, you actually from the pixels get the velocity of all your enemies and the directions they're going."},{"start":3630.94,"text":"So this is our preprocessing. I'm going to refer to it as 5S. And our DeepQ network architecture, because we're working with pixels, is going to be a convolutional network. Don't worry if you haven't learned it yet in the class, but it's a bunch of conf and relu activations. And then we end with a fully connected layer that gives us the three Q values for the different actions. So nothing special here."},{"start":3661.88,"text":"We're going to go back to our vanilla training. So this one that we saw together earlier. And we're going to look at tips to train reinforcement learning algorithms. Those tips are not specific to Q-learning. Some of them are applied to a lot more than Q-learning. And they're very important to know. And they're part of the reason reinforcement learning has worked better in the last few years."},{"start":3684.62,"text":"So one of the things that's pretty simple that we forgot to do is the preprocessing that we just did. So anywhere I had an S, I'm going to instead run S through the preprocessing step. I'm going to use phi of S. So I initialize instead of S with phi of S. I start from the initial state phi of S, and then I forward propagate phi of S. I get the Q of..."},{"start":3710.03,"text":"that pre-processed state in action A, and et cetera, et cetera. And then when I get my next state, so let's say I look at my current pre-processed state, I forward propagate it once, I see the three Q values, in our case the two Q values, one of them was better than the other, action right, then I get my next state, S prime, I want to pre-process that state as well. So that's pretty straightforward. You just replace all of that."},{"start":3742.02,"text":"The second thing we forgot to do is to keep track of the terminal states. In our pseudocode, there is no concept of terminal states. It's pretty easy to add. You would probably just do an if-else statement. You would create a Boolean to detect terminal states. So let's say your Boolean is terminal equals false. And then as you loop over the time step of a single episode, every time you're going to check is."}],"speech_gaps":[],"frame":"../frames/v062/022.webp","frame_time":3621.06},{"title":"终端状态与经验回放","segments":[{"id":226,"text":"The state that I'm going into based on the action, I'm taking a terminal state. If it's a terminal state, then get out of the loop. There's nothing else after. The one thing that you need to be careful of is if it's a terminal state, then your target is not the Bellman equation. It's just the immediate reward. Remember, you get to the terminal state, you get a reward of 10. There's no Bellman equation to apply. It's just 10. It's immediate reward. There's no discount, etc.","zh":"基于我采取的动作，我进入的状态是一个终端状态。如果是终端状态，那么就退出循环。之后就没有其他内容了。需要注意的一点是，如果是一个终端状态，那么目标就不是贝尔曼方程。它只是即时奖励。记住，当你到达终端状态时，你会获得一个奖励值为10。此时不需要应用贝尔曼方程。它就是10。这是即时奖励。没有折扣，等等。","start":3764.39,"end":3791.93},{"id":227,"text":"Okay, so these are fairly easy changes. Now we're going to look at a new method that will enable more data efficiency. It's called experience replay. A couple of issues with the way we've been training so far is, one, the correlation of successive screens.","zh":"好的，这些改动相对比较容易。现在我们将看一下一种新方法，它能够提高数据效率。这种方法叫做经验回放。我们目前训练方式存在一些问题，其中之一是连续屏幕之间的相关性。","start":3796.59,"end":3817.39},{"id":228,"text":"It's like, imagine in the Atari game, you have the ball that's in the top left corner and it's traveling to the bottom right of the screen. You have like many, many time steps that are essentially the same. It's all the ball traveling in the same place. So you're actually training repetitively.","zh":"比如在Atari游戏中，你有一个球位于屏幕左上角，并且它向右下角移动。你有很多、很多的时间步，这些时间步实际上都是相同的。球一直在同一个位置移动。因此，你实际上是在重复训练。","start":3818.06,"end":3836.88},{"id":229,"text":"on something that is not that meaningful. You don't need to just train on a batch. The equivalent in supervised learning is let's say you're trying to differentiate cats and dogs and you train on a mini batch of cats. Then you train on a mini batch of dogs. Then you train on a mini batch of cats. It will never converge. It will just index too much on cats and then index too much on dogs. So you want to add some sort of a...","zh":"你是在训练一些并不那么有意义的内容。你不需要仅仅在一个批次上训练。在监督学习中，这相当于你试图区分猫和狗，你先在一个小批次的猫上训练，然后在一个小批次的狗上训练，然后再在一个小批次的猫上训练。它将永远不会收敛。它只会过度关注猫，然后又过度关注狗。因此，你希望加入某种经验回放的概念，以在数据中创造更多的混合并获得更多的多样性。","start":3837.39,"end":3859.09},{"id":230,"text":"experience replay concept that we see in order to create more mixes in the data and get more diversity. The other thing that is important is in our current training process, we are not reusing our data. Like you experience something, you immediately train on it. You never see it again.","zh":"另一个重要的是，在我们当前的训练过程中，我们并没有重用数据。比如你经历了一件事，你立刻就用它进行训练，之后就再也不会看到它了。","start":3860.45,"end":3879.07},{"id":231,"text":"Unless you re-experience the same thing sometimes in the future, which might or might not happen. Experience replay is going to help us to keep experiences in memory and maybe retrain on them on a regular basis. So that one experience might be useful multiple times. Which intuitively makes sense. Maybe you do an experience, you get an amazing reward, and you don't want to forget it. You want to retrain the model on it on a regular basis. It's more data efficiency.","zh":"除非你在将来有时重新经历同样的事情，这可能会或可能不会发生。经验回放将帮助我们保持经验在记忆中，并且可能定期重新训练这些经验。因此，一个经验可能会被多次使用。这在直觉上是有意义的。也许你进行了一次经历，获得了惊人的奖励，你不希望忘记它。你希望定期重新训练模型以利用它。这更加高效地利用数据。","start":3879.66,"end":3905.28},{"id":232,"text":"So here's what it looks like. The current way we were training was we're in a state, I'm just going to say state instead of preprocessed state, but it's preprocessed. We're in a state S, we perform action A, we get a reward R, and we get into the next state. From that next state, we perform another action A prime, we get a reward R prime, and we get into S second, and so on.","zh":"所以，这看起来是怎样的呢。我们目前的训练方式是，我们处于一个状态，我这里用状态代替预处理后的状态，但它是经过预处理的。我们处于状态 S，执行动作 A，获得奖励 R，并进入下一个状态。从这个下一个状态，我们执行另一个动作 A prime，获得奖励 R prime，并进入状态 S second，依此类推。","start":3906.17,"end":3929.13},{"id":233,"text":"You know, and so on. And each of these would be called one experience. It's one iteration of gradient descent. So one experience. So right now we're training on these experiences. So the training looks like I train on E1.","zh":"你明白，依此类推。每一个这样的步骤都会被称为一次经验。它是一次梯度下降的迭代。因此，一次经验。现在我们正在使用这些经验进行训练。因此，训练看起来像我使用 E1 进行训练。","start":3929.81,"end":3942.95}],"notes":["本段首先讲解了终端状态的概念，指出在终端状态下，目标不是贝尔曼方程，而是即时奖励。这说明在强化学习中，终端状态的处理方式与非终端状态不同，因为没有后续状态和奖励。接着，讲者提到在终端状态下，奖励是直接获得的，不需要进行折扣处理。","接下来，讲者引入了经验回放（experience replay）的概念，指出当前训练方法存在两个主要问题：一是连续状态之间的相关性，二是数据未被重复利用。经验回放通过存储经验并随机抽取进行训练，可以增加数据的多样性，提高数据效率。","讲者以Atari游戏为例，说明连续状态之间的相关性问题。例如，球在屏幕上的移动轨迹可能在多个时间步中保持不变，导致训练过程重复且缺乏多样性。这种情况下，模型可能无法有效学习。","讲者进一步将经验回放与监督学习中的训练方法进行类比，指出如果只在猫和狗的样本上交替训练，模型将无法收敛。因此，经验回放通过混合不同经验，可以提高模型的泛化能力。","讲者还提到经验回放的另一个优势是数据的重复利用。通过存储经验并在后续训练中重新使用，可以提高数据效率，避免遗忘重要的经验。例如，获得高奖励的经验应被多次利用。","最后，讲者简要描述了经验回放的实现方式，指出当前训练过程是按顺序处理经验，而经验回放则通过存储经验并随机抽取进行训练，从而提高数据的多样性和模型的训练效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3764.39,"end":3942.95,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3764.39,"text":"The state that I'm going in based on the action, I'm taking a terminal state. If it's a terminal state, then get out of the loop. There's nothing else after. The one thing that you need to be careful of is if it's a terminal state, then your target is not the Bellman equation. It's just the immediate reward. Remember, you get to the terminal state, you get a reward of 10. There's no Bellman equation to apply. It's just 10. It's immediate reward. There's no discount, etc."},{"start":3796.59,"text":"Okay, so these are fairly easy changes. Now we're going to look at a new method that will enable more data efficiency. It's called experience replay. A couple of issues with the way we've been training so far is, one, the correlation of successive screens."},{"start":3818.06,"text":"It's like, imagine in the Atari game, you have the ball that's in the top left corner and it's traveling to the bottom right of the screen. You have like many, many time steps that are essentially the same. It's all the ball traveling in the same place. So you're actually training repetitively."},{"start":3837.39,"text":"on something that is not that meaningful. You don't need to just train on a batch. The equivalent in supervised learning is let's say you're trying to differentiate cats and dogs and you train on a mini batch of cats. Then you train on a mini batch of dogs. Then you train on a mini batch of cats. It will never converge. It will just index too much on cats and then index too much on dogs. So you want to add some sort of a..."},{"start":3860.45,"text":"experience replay concept that we see in order to create more mixes in the data and get more diversity. The other thing that is important is in our current training process, we are not reusing our data. Like you experience something, you immediately train on it. You never see it again."},{"start":3879.66,"text":"Unless you re-experience the same thing sometimes in the future, which might or might not happen. Experience replay is going to help us to keep experiences in memory and maybe retrain on them on a regular basis. So that one experience might be useful multiple times. Which intuitively makes sense. Maybe you do an experience, you get an amazing reward, and you don't want to forget it. You want to retrain the model on it on a regular basis. It's more data efficiency."},{"start":3906.17,"text":"So here's what it looks like. The current way we were training was we're in a state, I'm just going to say state instead of preprocessed state, but it's preprocessed. We're in a state S, we perform action A, we get a reward R, and we get into the next state. From that next state, we perform another action A prime, we get a reward R prime, and we get into S second, and so on."},{"start":3929.81,"text":"You know, and so on. And each of these would be called one experience. It's one iteration of gradient descent. So one experience. So right now we're training on these experiences. So the training looks like I train on E1."}],"speech_gaps":[],"frame":"../frames/v062/023.webp","frame_time":3776.39},{"title":"经验回放与训练过程","segments":[{"id":234,"text":"I update my parameters. Then I train on E2, I update my parameters. Then I train on E3, I update my parameters. Those are highly correlated because they're part of the same episode. And as I was saying, with the ball traveling in one direction, that might actually not be that helpful to train on all of these. So instead, what we'll do is we'll use experience replay where we will collect our first experience, but instead of training on it, we will put it in a memory.","zh":"我更新我的参数。然后我在E2上训练，我更新我的参数。然后我在E3上训练，我更新我的参数。这些是高度相关的，因为它们属于同一个回合。正如我刚才说的，当球朝一个方向移动时，实
