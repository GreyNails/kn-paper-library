际上对这些全部进行训练可能并不是很有帮助。因此，我们将会使用经验回放，我们首先收集经验，但不是直接在上面训练，而是将其存入记忆中。","start":3943.76,"end":3970.6},{"id":235,"text":"Called the replay memory D. We put it in there. And then at every step, we will sample from that memory to decide what to train on. So, of course, at the beginning, if we just have one.","zh":"这个记忆被称为回放缓存D。我们将经验存入其中。然后在每一步，我们都会从这个记忆中采样，以决定要训练哪些经验。当然，在开始时，如果我们只有一个经验。","start":3971.36,"end":3984.11},{"id":236,"text":"experience in the memory, we will train on that experience. But over time, you will see that we get more diversity and reuse out of our experiences. So for example, let's say I experience E2, I put it in the memory and then instead of training on E2, I'm going to randomly sample from the memory. I might get E1 or I might get E2. Then I experience E3 and I put it in the memory and I might get one of the three.","zh":"经验在记忆中，我们会在这个经验上进行训练。但随着时间的推移，你会看到我们从经验中获得更多的多样性与复用。例如，假设我经历了E2，将其存入记忆，然后而不是在E2上训练，我会从记忆中随机采样。我可能会得到E1或E2。然后我经历了E3，将其存入记忆，我可能会得到其中的任何一个。","start":3985.02,"end":4010.58},{"id":237,"text":"This is the vanilla experience replay. In practice, there is more methods like prioritized sweeping, which might tell you which experience you want to weigh. Maybe some experiences had a higher gradient, so you want to prioritize them more often. Things like that.","zh":"这就是普通的经验回放。实际上，还有更多方法，比如优先级扫描（prioritized sweeping），这可能会告诉你哪些经验需要被赋予更高的权重。也许某些经验具有更高的梯度，因此你希望更频繁地优先使用它们。类似这样的方法。","start":4012.21,"end":4026.75},{"id":238,"text":"So all in all, this is what our training looks like with experience replay. We experience E1. We train on E1. Then the next training iteration is not on E2. It's on a sample from E1 and E2, either or. The third experience is then put in the replay memory, but we don't train on it. We train on a sample from whatever is in the replay memory, and we repeat. And that is...","zh":"总而言之，这就是我们使用经验回放的训练过程。我们经历了E1，然后在E1上进行训练。下一次训练迭代不是在E2上，而是在E1和E2中的一个样本上。第三次经历被存入回放缓存，但我们不对其进行训练。我们从回放缓存中的内容中采样进行训练，并重复这一过程。这就是所谓的...","start":4028.58,"end":4052.06},{"id":239,"text":"more sample more efficient allows more reusability and less cross-correlation in our training batch well so that's called replay memory and you can use it with minibatch gradient descent note that you still experience in the direction that the game is played like we still go and take the action as expected we just don't necessarily update our model parameter based on the action that we ended up taking","zh":"更多的样本效率允许更高的复用性，并减少我们在训练批次中的交叉相关性。这就是所谓的回放缓存，你可以将其与小批量梯度下降结合使用。请注意，我们仍然按照游戏进行的方向体验，比如我们仍然采取预期的动作，只是不一定要根据最终采取的动作来更新我们的模型参数。","start":4052.54,"end":4083.66},{"id":240,"text":"We put it in the replay memory. We may train on it later. Okay. So here's how it modifies our vanilla setup. We've added an experience.","zh":"我们将它存入经验回放缓冲区。我们之后可能会在上面进行训练。好的。那么这就是它如何修改我们的原始设置。我们添加了一段经验。","start":4084.28,"end":4097.75},{"id":241,"text":"from state S to state S prime to the replay memory. Let me walk you through it again. Within one time step, we forward propagate our state into the queue network. We execute the best action given the queue values. This gives us a reward and a next state. The next state is preprocessed. And then instead of training on that,","zh":"从状态 S 到状态 S prime 被存入经验回放缓冲区。让我再向你解释一遍。在一个时间步内，我们将状态前向传播到队列网络中。根据队列值执行最佳动作。这会给我们一个奖励和一个下一个状态。下一个状态被预处理。然后我们并不直接在该状态下进行训练，","start":4098.93,"end":4120.07}],"notes":["本段讲解了经验回放（replay memory）在深度强化学习中的作用，强调了其在提高样本效率、增强经验重用性以及减少训练批次中样本间的相关性方面的优势。讲者指出，经验回放允许模型从历史经验中随机采样进行训练，而不是仅依赖当前经验，从而提升训练的稳定性和效率。","讲者提到，尽管经验回放允许模型从历史经验中采样进行训练，但模型仍然按照游戏进行的方向采取行动，即仍然执行动作并获得奖励，只是不一定会基于当前动作更新模型参数。这表明经验回放并不改变环境交互的过程，而是改变了模型训练时使用的数据来源。","讲者还提到，经验回放可以与小批量梯度下降（minibatch gradient descent）结合使用，这表明在训练过程中，模型会从经验回放中随机抽取一小批量经验进行参数更新，从而实现更高效的训练。","讲者强调了经验回放的另一个关键优势是减少训练批次中样本之间的相关性。由于经验回放从历史经验中随机采样，因此训练数据中的样本之间具有较低的相关性，这有助于模型更好地泛化。","讲者指出，经验回放的引入改变了传统的训练流程，即模型不再直接基于当前经验进行训练，而是从经验回放中随机采样进行训练。这种改变有助于提高训练的稳定性和效率。","讲者最后提到，经验回放的使用并不影响模型在游戏中的行为，即模型仍然按照游戏规则采取行动，只是在训练时使用的是从经验回放中采样的历史经验，而不是当前经验。"],"formulas":[],"uncertainties":["more sample more efficient allows more reusability and less cross-correlation in our training batch well so that's called replay memory and you can use it with minibatch gradient descent note that you still experience in the direction that the game is played like we still go and take the action as expected we just don't necessarily update our model parameter based on the action that we ended up taking"],"diagram":"none","start":3943.76,"end":4120.07,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3943.76,"text":"I update my parameters. Then I train on E2, I update my parameters. Then I train on E3, I update my parameters. Those are highly correlated because they're part of the same episode. And as I was saying, with the ball traveling in one direction, that might actually not be that helpful to train on all of these. So instead, what we'll do is we'll use experience replay where we will collect our first experience, but instead of training on it, we will put it in a memory."},{"start":3971.36,"text":"Called the replay memory D. We put it in there. And then at every step, we will sample from that memory to decide what to train on. So, of course, at the beginning, if we just have one."},{"start":3985.02,"text":"experience in the memory, we will train on that experience. But over time, you will see that we get more diversity and reuse out of our experiences. So for example, let's say I experience E2, I put it in the memory and then instead of training on E2, I'm going to randomly sample from the memory. I might get E1 or I might get E2. Then I experience E3 and I put it in the memory and I might get one of the three."},{"start":4012.21,"text":"This is the vanilla experience replay. In practice, there is more methods like prioritized sweeping, which might tell you which experience you want to weigh. Maybe some experiences had a higher gradient, so you want to prioritize them more often. Things like that."},{"start":4028.58,"text":"So all in all, this is what our training looks like with experience replay. We experience E1. We train on E1. Then the next training iteration is not on E2. It's on a sample from E1 and E2, either or. The third experience is then put in the replay memory, but we don't train on it. We train on a sample from whatever is in the replay memory, and we repeat. And that is..."},{"start":4052.54,"text":"more sample more efficient allows more reusability and less cross-correlation in our training batch well so that's called replay memory and you can use it with minibatch gradient descent note that you still experience in the direction that the game is played like we still go and take the action as expected we just don't necessarily update our model parameter based on the action that we ended up taking"},{"start":4084.28,"text":"We put it in the replay memory. We may train on it later. Okay. So here's how it modifies our vanilla setup. We've added an experience."},{"start":4098.93,"text":"from state S to state S prime to the replay memory. Let me walk you through it again. Within one time step, we forward propagate our state into the queue network. We execute the best action given the queue values. This gives us a reward and a next state. The next state is preprocessed. And then instead of training on that,"}],"speech_gaps":[],"frame":"../frames/v062/024.webp","frame_time":3955.76},{"title":"经验回放与探索策略","segments":[{"id":242,"text":"Instead of training, we just add that transition to the replay memory. And instead, we sample randomly a mini batch of transition from the replay memory, and we train on those. And we redo the same thing again and again. Yes. Yeah.","zh":"与其进行训练，我们只是将该转换添加到经验回放缓冲区中。相反，我们从经验回放缓冲区中随机采样一个迷你批次的转换，并在这些转换上进行训练。然后我们重复这个过程一遍又一遍。是的。嗯。","start":4120.78,"end":4150.36},{"id":243,"text":"Yeah, you would. You would within one episode. But, you know, if you play multiple chess games, your replay memory will get already bigger. So then you would see some end games, some middle of the game, some early games.","zh":"是的，你也会这么做。你在一个回合内。但你知道，如果你玩多局国际象棋，你的经验回放缓冲区会变得更大。然后你就能看到一些终局、一些中局和一些开局。","start":4152.42,"end":4167.62},{"id":244,"text":"And in practice, it's actually useful because you might imagine that in a chess game, all of us, let's say if you're a beginner, you see a lot of beginning of the games. Actually, people that are beginners, they're good at openings, but they're bad at end games because they don't get to play a lot of end games. Well, that type of approach could be useful. You can retrain on end games more often. And a more advanced version of the replay memory,","zh":"实际上，在实践中这种方法是有用的，你可以想象在国际象棋中，我们所有人，比如说你是一个新手，你会看到很多开局。实际上，新手们擅长开局，但不擅长终局，因为他们很少玩终局。这种类型的策略可能很有用。你可以更频繁地在终局上重新训练。而经验回放缓冲区的一个更高级版本，","start":4171.27,"end":4197.81},{"id":245,"text":"would also weigh the experience in the replay memory based on how much the gradient is going to be. So if you have an experience that actually was super insightful, you can weigh it higher so that you prioritize grabbing it and retraining on it, essentially. So let's say you blunder in chess, you might actually want to re-see that blunder later so that you don't do it again.","zh":"也会根据梯度的大小来加权经验回放缓冲区中的经验。因此，如果你有一段非常有启发性的经验，你可以将其权重提高，从而优先获取并重新训练它。比如说你在国际象棋中犯了错误，你可能希望之后重新看到这个错误，以避免再次犯错。","start":4199.24,"end":4222.15},{"id":246,"text":"Okay, so these were all the different methods. Another one that's very intuitive and very important is when, during the training process, our agent gets stuck. Gets stuck in a local minima. Here is how it would work in practice. You start in initial state S1, and you have three states ahead of you. If you take action A1, you go to state 2, which is a terminal state.","zh":"好的，这些都是不同的方法。另一个非常直观且重要的方法是在训练过程中，当我们的智能体陷入局部极小值时。在实践中，它会这样运作。你从初始状态 S1 开始，前面有三个状态。如果你采取动作 A1，你会到达状态 2，这是一个终端状态。","start":4224.83,"end":4250.63},{"id":247,"text":"and you get a reward of zero. If you take action A2, you get to S3, also a terminal state, and you get a reward of one. And if you get action A3, you get to state four, terminal state with a reward of a thousand. So of course, to us, it's obvious that we would want to explore the state number four. It's pretty obvious. In practice, let's say you update, you initialize your network, and in the first forward path, that's what you get.","zh":"你获得奖励为零。如果你采取动作 A2，你会到达状态 3，也是一个终端状态，获得奖励为一。如果你采取动作 A3，你会到达状态四，终端状态，奖励为一千。当然，对我们来说，很明显我们想要探索状态四。这很明显。在实践中，假设你更新，你初始化了你的网络，在第一次前向传播中，你得到的就是这些结果。","start":4252.06,"end":4281.07},{"id":248,"text":"First forward path, the network is random. You get Q value for action 1.5, for action 2.4, for action 3.3. What does that mean? It means the agent is saying, I'm going to go to action 1. So I take action 1, and I see an immediate reward of 0.","zh":"第一条前向路径，网络是随机的。你得到动作1的Q值为1.5，动作2的Q值为2.4，动作3的Q值为3.3。这意味着什么？这意味着智能体在说，我要执行动作1。所以我执行动作1，并看到一个即时奖励为0。","start":4281.82,"end":4300.69}],"notes":["本段讲解了经验回放（replay memory）的基本概念，即在强化学习中，智能体将经历的转移（transition）存储到经验回放中，并从中随机采样一个mini-batch进行训练。这种方法有助于打破数据相关性，提高训练稳定性。","接着，讲者通过国际象棋的例子说明经验回放的实用性。对于初学者来说，他们可能更熟悉开局阶段，但对残局阶段了解较少。经验回放可以使得智能体在训练时更频繁地接触残局经验，从而提升整体表现。","讲者进一步提到，经验回放可以结合梯度的重要性进行加权。如果某个经验对梯度的贡献较大，可以赋予其更高的权重，从而优先训练这些经验。例如，在国际象棋中，如果发生失误（blunder），智能体可以重新查看该经验以避免重复错误。","随后，讲者介绍了探索策略中的一个关键问题：智能体在训练过程中可能陷入局部最优解（local minima）。讲者通过一个具体的例子说明了这种情况，即智能体在初始状态S1时，有三个可能的动作，分别导致不同的终端状态和奖励。","在例子中，智能体在初始阶段的Q值是随机的，因此它可能会选择奖励较低的动作。讲者指出，这种情况下，智能体需要通过探索来找到最优策略，即选择奖励最高的动作A3，从而到达状态4并获得最大奖励。","最后，讲者强调了探索的重要性，特别是在训练初期，智能体需要通过探索来发现最优策略，而不是仅仅依赖当前的Q值进行决策。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4120.78,"end":4300.69,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4120.78,"text":"Instead of training, we just add that transition to the replay memory. And instead, we sample randomly a mini batch of transition from the replay memory, and we train on those. And we redo the same thing again and again. Yes. Yeah."},{"start":4152.42,"text":"Yeah, you would. You would within one episode. But, you know, if you play multiple chess games, your replay memory will get already bigger. So then you would see some end games, some middle of the game, some early games."},{"start":4171.27,"text":"And in practice, it's actually useful because you might imagine that in a chess game, all of us, let's say if you're a beginner, you see a lot of beginning of the games. Actually, people that are beginners, they're good at openings, but they're bad at end games because they don't get to play a lot of end games. Well, that type of approach could be useful. You can retrain on end games more often. And a more advanced version of the replay memory,"},{"start":4199.24,"text":"would also weigh the experience in the replay memory based on how much the gradient is going to be. So if you have an experience that actually was super insightful, you can weigh it higher so that you prioritize grabbing it and retraining on it, essentially. So let's say you blunder in chess, you might actually want to re-see that blunder later so that you don't do it again."},{"start":4224.83,"text":"Okay, so these were all the different methods. Another one that's very intuitive and very important is when, during the training process, our agent gets stuck. Gets stuck in a local minima. Here is how it would work in practice. You start in initial state S1, and you have three states ahead of you. If you take action A1, you go to state 2, which is a terminal state."},{"start":4252.06,"text":"and you get a reward of zero. If you take action A2, you get to S3, also a terminal state, and you get a reward of one. And if you get action A3, you get to state four, terminal state with a reward of a thousand. So of course, to us, it's obvious that we would want to explore the state number four. It's pretty obvious. In practice, let's say you update, you initialize your network, and in the first forward path, that's what you get."},{"start":4281.82,"text":"First forward path, the network is random. You get Q value for action 1.5, for action 2.4, for action 3.3. What does that mean? It means the agent is saying, I'm going to go to action 1. So I take action 1, and I see an immediate reward of 0."}],"speech_gaps":[],"frame":"../frames/v062/025.webp","frame_time":4132.78},{"title":"探索与利用的平衡","segments":[{"id":249,"text":"Because it's a terminal state, the Bellman equation thing doesn't happen. I just have the immediate reward, which becomes my target Y. And so I perform a gradient descent update to say this Q value should have been zero. So I convert this Q value to zero. Now, second try.","zh":"因为这是一个终端状态，贝尔曼方程的情况不会发生。我只需要立即奖励，这将成为我的目标Y。因此，我执行梯度下降更新，表示这个Q值应该为零。所以我将这个Q值转换为零。现在，第二次尝试。","start":4302.12,"end":4320.48},{"id":250,"text":"This time, the Q value is saying take action two. It's the highest Q value. I take action two. I have an immediate reward ahead of me. That's one. Because it's a terminal state, there is no second discounted future reward term. So I just take Y equals one. I perform my gradient descent update, and this converts to one.","zh":"这次，Q值表示采取动作二。这是最高的Q值。我采取动作二。我面前有一个立即奖励。那是1。因为这是一个终端状态，没有第二个折扣的未来奖励项。所以我只需取Y等于1。我执行梯度下降更新，这个值被转换为1。","start":4321.73,"end":4348.55},{"id":251,"text":"The agent is still saying, go to A2. Take action A2. Reward of one. Good. That's what you predicted. Nothing to do. Just keep going. We're done with training. We're stuck. We never visit the state we actually wanted to visit. So that wouldn't work for us. We will never visit that state using our current algorithm.","zh":"智能体仍然表示，去A2。采取动作A2。奖励为1。很好。这就是你预测的。没有其他事情要做。继续前进。我们已经完成训练。我们卡住了。我们从未访问过我们真正想访问的状态。因此，这对我们来说是行不通的。我们当前的算法永远不会访问那个状态。","start":4349.34,"end":4376.51},{"id":252,"text":"In practice, this is a big issue. The analogy of this concept of exploration versus exploitation is when every day you take your bike and you cross campus, you have a favorite route.","zh":"在实践中，这是一个大问题。探索与利用的概念类比是，每天你骑自行车穿过校园，你有一个最喜欢的路线。","start":4377.64,"end":4391.8},{"id":253,"text":"And it turns out that the more you take that route, the better you get every time. Like you get a little faster, maybe your turn is faster or something, or you can predict how many people are going to be at that roundabout and you know how to take it in the wide way. So you go faster. We've all done that.","zh":"结果是你越频繁使用那条路线，每次都会变得更好。比如你可能会更快一点，或者你的转弯更快，或者你可以预测有多少人会在那个环岛，知道如何走宽阔的车道。因此你行驶得更快。我们都做过这样的事。","start":4392.61,"end":4406.43},{"id":254,"text":"That's exploitation. You exploit what you already know and you get better at it. But maybe there's another route that you're not thinking of that's pretty, instead of going north from campus, you go south and maybe it might be better. You will never see because you don't have the courage or the patience to do it. That's the difference between exploration and exploitation. In practice, a good model would be able to handle both, to exploit when it needs to exploit, to explore when it needs to explore.","zh":"这就是利用。你利用已知的东西，并且变得更好。但也许还有另一条你没考虑到的路线，比从校园向北走，而是向南走，可能更好。你永远不会看到，因为你缺乏勇气或耐心去尝试。这就是探索与利用之间的区别。在实践中，一个好的模型应该能够处理两者，需要利用时就利用，需要探索时就探索。","start":4408.04,"end":4434.87},{"id":255,"text":"The way we do it in practice in our pseudocode is to inject some randomness.","zh":"我们在伪代码中实际的做法是注入一些随机性。","start":4435.57,"end":4440.75},{"id":256,"text":"So, for example, when we are looping over a time step with probability epsilon, let's say 5%, take a random action.","zh":"例如，当我们循环到一个时间步时，以5%的概率，采取随机动作。","start":4441.23,"end":4448.93},{"id":257,"text":"So from time to time, on average, one time every 20 times you take a random action, it will allow you to visit maybe a new path.","zh":"因此，偶尔，平均来说，每20次你采取随机动作中的一次，它将允许你访问也许是一条新的路径。","start":4449.53,"end":4457.55},{"id":258,"text":"The analogy in chess is, you know, you might use a creative move from time to time that might be worse today, but might allow you to learn something and to get better over time.","zh":"在国际象棋中的类比是，你可能会偶尔使用一个创造性的走法，虽然它今天可能更差，但可能会让你学到一些东西，并随着时间的推移变得更好。","start":4457.55,"end":4467.75},{"id":259,"text":"Yeah.","zh":"是的。","start":4469.03,"end":4469.61},{"id":260,"text":"In the last example we just covered, could we resolve that by just setting the initial Q values to infinity?","zh":"在我们刚刚讨论的最后一个例子中，我们能否仅仅通过将初始Q值设为无穷大来解决这个问题？","start":4470.39,"end":4480.49}],"notes":["本段讲解了在深度强化学习中，当处于终端状态时，贝尔曼方程不再适用，因为没有未来的奖励项。此时，目标值Y仅由即时奖励构成，因此需要通过梯度下降更新Q值。然而，如果Q值始终选择最高奖励的动作，可能会导致模型无法探索其他可能的路径，从而陷入局部最优。","在实际应用中，探索与利用的平衡是一个关键问题。探索指的是尝试新的动作以发现更好的策略，而利用则是基于已有知识选择已知最优的动作。如果模型只利用已知信息，可能会错过更优的路径。","为了处理这一问题，通常在算法中引入随机性，例如在每次时间步以一定概率（如5%）随机选择动作。这样可以在一定程度上促进探索，避免模型陷入局部最优。","在实际应用中，探索与利用的平衡需要根据具体任务进行调整。例如，在棋类游戏中，偶尔采取非最优的创造性动作可能有助于长期学习和策略提升。","在最后的例子中，如果初始Q值设置为无穷大，可能会导致模型始终选择最高奖励的动作，从而无法探索其他可能的路径。因此，初始Q值的设置需要谨慎。","探索与利用的平衡是深度强化学习中的核心挑战之一，需要在算法设计中进行权衡。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4302.12,"end":4480.49,"asr_flags":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":4302.12,"text":"Because it's a terminal state, the Bellman equation thing doesn't happen. I just have the immediate reward, which becomes my target Y. And so I perform a gradient descent update to say this Q value should have been zero. So I convert this Q value to zero. Now, second try."},{"start":4321.73,"text":"This time, the Q value is saying take action two. It's the highest Q value. I take action two. I have an immediate reward ahead of me. That's one. Because it's a terminal state, there is no second discounted future reward term. So I just take Y equals one. I perform my gradient descent update, and this converts to one. And then third time."},{"start":4349.34,"text":"The agent is still saying, go to A2. Take action A2. Reward of one. Good. That's what you predicted. Nothing to do. Just keep going. We're done with training. We're stuck. We never visit the state we actually wanted to visit. So that wouldn't work for us. We will never visit that state using our current algorithm. Does that make sense why we wouldn't ever visit that state?"},{"start":4377.64,"text":"In practice, this is a big issue. The analogy of this concept of exploration versus exploitation is when every day you take your bike and you cross campus, you have a favorite route."},{"start":4392.61,"text":"And it turns out that the more you take that route, the better you get every time. Like you get a little faster, maybe your turn is faster or something, or you can predict how many people are going to be at that roundabout and you know how to take it in the wide way. So you go faster. We've all done that."},{"start":4408.04,"text":"That's exploitation. You exploit what you already know and you get better at it. But maybe there's another route that you're not thinking of that's pretty, instead of going north from campus, you go south and maybe it might be better. You will never see because you don't have the courage or the patience to do it. That's the difference between exploration and exploitation. In practice, a good model would be able to handle both, to exploit when it needs to exploit, to explore when it needs to explore."},{"start":4435.57,"text":"The way we do it in practice in our pseudocode is to inject some randomness."},{"start":4441.23,"text":"So, for example, when we are looping over a time step with probability epsilon, let's say 5%, take a random action."},{"start":4449.53,"text":"So from time to time, on average, one time every 20 times you take a random action, it will allow you to visit maybe a new path."},{"start":4457.55,"text":"The analogy in chess is, you know, you might use a creative move from time to time that might be worse today, but might allow you to learn something and to get better over time."},{"start":4469.03,"text":"Yeah."},{"start":4470.39,"text":"In the last example we just covered, could we resolve that by just setting the initial Q values to infinity?"}],"speech_gaps":[],"frame":"../frames/v062/026.webp","frame_time":4314.12},{"title":"深度强化学习中的初始化与Q学习","segments":[{"id":261,"text":"setting the","zh":"设定的","start":4481.79,"end":4482.81},{"id":262,"text":"couldn't we resolve this problem by setting","zh":"我们不能通过将","start":4482.81,"end":4485.53},{"id":263,"text":"the initial values from into infinity","zh":"初始值设为无穷大来解决这个问题吗","start":4485.53,"end":4487.39},{"id":264,"text":"well the problem if you set the initial","zh":"那么，如果你将初始值设为无穷大，你会说","start":4487.39,"end":4489.51},{"id":265,"text":"values to infinity so you would say","zh":"而不是随机初始化","start":4489.51,"end":4491.61},{"id":266,"text":"instead of randomly initializing","zh":"你的网络，你可以以一种方式初始化","start":4491.61,"end":4493.61},{"id":267,"text":"your network you initialize it in a way","zh":"使得输出等于无穷大","start":4493.61,"end":4495.53},{"id":268,"text":"that the outputs are equal to infinity","zh":"输出等于无穷大","start":4495.53,"end":4497.19},{"id":269,"text":"yeah so that we wouldn't get the issue","zh":"是的，这样我们就可以避免出现这个问题","start":4497.19,"end":4499.49},{"id":270,"text":"of","zh":"的","start":4499.49,"end":4500.07},{"id":271,"text":"the Q values","zh":"Q值","start":4500.07,"end":4502.63},{"id":272,"text":"well in","zh":"在","start":4502.63,"end":4505.59},{"id":273,"text":"practice if the three Q values are","zh":"实践中，如果三个Q值都是","start":4505.59,"end":4507.59},{"id":274,"text":"infinity then you can't make a decision on","zh":"无穷大，那么你就无法在那一刻做出决策，所以你说的只是随机选一个，因为如果三个都是无穷大，你","start":4507.59,"end":4509.63},{"id":275,"text":"the spot so you're saying just pick one randomly because if the three are infinity you you can't","zh":"就无法决定该选哪一个，对吧？而且如果无穷大并且奖励是1，我的意思是如果","start":4509.63,"end":4514.85},{"id":276,"text":"decide which one to take right and also if if it's infinity and the reward is one i mean if","zh":"决定应该采取哪一个，同时如果它是无穷大，并且奖励是1，我的意思是如果","start":4514.85,"end":4522.39},{"id":277,"text":"it's a really large number and the reward is one your gradient is going to be massive right so it's","zh":"它是一个非常大的数字，而奖励是你的梯度将会变得非常大，对吧，所以它就是","start":4522.39,"end":4527.25},{"id":278,"text":"gonna i guess the loss function is going to be massive and um i don't know i imagine it will be","zh":"大概损失函数也会变得非常大，嗯，我不知道，我想它会是","start":4527.25,"end":4533.29},{"id":279,"text":"really hard to train it but in practice you start with the random initialization because this might","zh":"很难训练的，但在实践中你从随机初始化开始，因为这可能","start":4533.29,"end":4538.89},{"id":280,"text":"be one example but you know if in the game of chess um actually the the reward is one at the","zh":"是一个例子，但你知道在国际象棋游戏中，实际上奖励在结束时是1，其余时间都是0，或者可能奖励在结束时是1000，当你失去车的时候","start":4538.89,"end":4546.45},{"id":281,"text":"end and zero all the time or maybe the reward is a thousand at the end and when you lose your rook","zh":"它会是一个负奖励，你无法预测奖励结构会是什么样子，你想要","start":4546.45,"end":4552.03},{"id":282,"text":"it's uh it's a negative reward you can't predict what the reward structure is going to be you want","zh":"一个能够适应它的智能体，并且找到一种可以扩展到不同","start":4552.03,"end":4556.69},{"id":283,"text":"an agent that is able to adapt to it and it's better to find a method that can scale to different","zh":"环境的本质的方法，好的，这就是epsilon贪婪策略，它就是","start":4556.69,"end":4562.73},{"id":284,"text":"environments essentially okay so this was epsilon greedy action which is","zh":"epsilon贪婪动作，它就是","start":4562.73,"end":4573.29},{"id":285,"text":"adding some randomness with probability epsilon take a random action okay so","zh":"以概率 epsilon 添加一些随机性，采取随机动作，好的","start":4573.29,"end":4578.19},{"id":286,"text":"adding all our techniques because we get good at training reinforcement learning","zh":"整合我们所有的技术，因为我们擅长于训练强化学习算法","start":4578.19,"end":4583.49},{"id":287,"text":"algorithms this is what we have we initialize our Q network parameters we","zh":"这就是我们拥有的，我们初始化我们的 Q 网络参数，我们","start":4583.49,"end":4588.17},{"id":288,"text":"We have a random network.","zh":"我们有一个随机网络。","start":4588.17,"end":4588.93},{"id":289,"text":"We initialize our replay memory, D,","zh":"我们初始化我们的经验回放记忆体 D，","start":4589.23,"end":4591.55},{"id":290,"text":"and then we loop over episodes.","zh":"然后我们循环处理多个回合（episodes）。","start":4591.79,"end":4593.17},{"id":291,"text":"We start from an initial state.","zh":"我们从一个初始状态开始。","start":4593.35,"end":4594.79},{"id":292,"text":"We create a Boolean that allows us to detect terminal states.","zh":"我们创建一个布尔变量，用于检测终止状态。","start":4594.93,"end":4597.61},{"id":293,"text":"With probability epsilon, we're going to take a random action.","zh":"以概率 epsilon，我们将采取一个随机动作。","start":4598.35,"end":4601.21},{"id":294,"text":"Otherwise, we're going to follow what we know,","zh":"否则，我们将遵循我们已知的内容，","start":4601.57,"end":4603.41},{"id":295,"text":"which is forward propagate the state in the Q network,","zh":"即在 Q 网络中前向传播状态，","start":4603.59,"end":4605.89},{"id":296,"text":"take the action that has the highest Q value.","zh":"选择具有最高 Q 值的动作。","start":4606.25,"end":4608.35},{"id":297,"text":"That allows you to observe a reward in the next state.","zh":"这使你能够观察到下一个状态的奖励。","start":4608.51,"end":4611.55},{"id":298,"text":"Take that next state, forward propagate it again.","zh":"取该下一个状态，再次前向传播它。","start":4611.81,"end":4615.31},{"id":299,"text":"So instead, and then instead of, oh no, sorry, sorry.","zh":"所以，然后，哦不，抱歉，抱歉。","start":4618.17,"end":4622.57},{"id":300,"text":"Observe that next state, add it to the replay memory,","zh":"观察该下一个状态，将其添加到回放缓存中，","start":4623.19,"end":4625.63},{"id":301,"text":"sample from the replay memory, and then train on that sample.","zh":"从经验回放缓存中进行抽样，然后基于该样本进行训练。","start":4627.05,"end":4630.79},{"id":302,"text":"And in the process, you will need to do another forward path","zh":"在这个过程中，你还需要进行一次前向传播","start":4631.03,"end":4633.79},{"id":303,"text":"because you need to estimate your target Y using the immediate reward","zh":"因为你需要利用即时奖励来估计你的目标值 Y","start":4633.79,"end":4637.63},{"id":304,"text":"plus the Bellman equation, plus the discounted future reward.","zh":"加上贝尔曼方程，再加上折扣后的未来奖励。","start":4637.63,"end":4641.31},{"id":305,"text":"Okay, are you experts at Q-learning?","zh":"好的，你们对Q学习是专家吗？","start":4643.59,"end":4645.87},{"id":306,"text":"okay good sounds good and here is where we get at the end","zh":"好的，听起来不错，这里就是我们最终要达到的地方","start":4650.13,"end":4653.99},{"id":307,"text":"You can claim proudly you have trained an ATAR.","zh":"你可以自豪地声称你已经训练了一个ATAR。","start":4654.91,"end":4657.83},{"id":308,"text":"It's not that complicated, as you can see, other than the Bellman equation piece.","zh":"其实并不复杂，除了贝尔曼方程的部分之外，你可以看到。","start":4657.85,"end":4660.89}],"notes":["本段讨论了在强化学习中初始化网络参数的问题，特别是将初始值设为无穷大的问题。讲者指出，如果Q值设为无穷大，会导致决策困难，因为无法选择最优动作，同时梯度也会变得非常大，使得训练变得困难。因此，实际中通常采用随机初始化。"],"formulas":[],"uncertainties":["the initial values from into infinity","the outputs are equal to infinity","the Q values","the reward is one at the","the reward is a thousand at the end and when you lose your rook","the reward structure is going to be you want","the method that can scale to different","the Bellman equation piece"],"diagram":"none","start":4481.79,"end":4660.89,"asr_flags":[],"translation_complete":true,"translated_segments":48,"raw_segments":[{"start":4481.79,"text":"setting the"},{"start":4482.81,"text":"couldn't we resolve this problem by setting"},{"start":4485.53,"text":"the initial values from into infinity"},{"start":4487.39,"text":"well the problem if you set the initial"},{"start":4489.51,"text":"values to infinity so you would say"},{"start":4491.61,"text":"instead of randomly initializing"},{"start":4493.61,"text":"your network you initialize it in a way"},{"start":4495.53,"text":"that the outputs are equal to infinity"},{"start":4497.19,"text":"yeah so that we wouldn't get the issue"},{"start":4499.49,"text":"of"},{"start":4500.07,"text":"the Q values"},{"start":4502.63,"text":"well in"},{"start":4505.59,"text":"practice if the three Q values are"},{"start":4507.59,"text":"infinity then you can't make a decision on"},{"start":4509.63,"text":"the spot so you're saying just pick one randomly because if the three are infinity you you can't"},{"start":4514.85,"text":"decide which one to take right and also if if it's infinity and the reward is one i mean if"},{"start":4522.39,"text":"it's a really large number and the reward is one your gradient is going to be massive right so it's"},{"start":4527.25,"text":"gonna i guess the loss function is going to be massive and um i don't know i imagine it will be"},{"start":4533.29,"text":"really hard to train it but in practice you start with the random initialization because this might"},{"start":4538.89,"text":"be one example but you know if in the game of chess um actually the the reward is one at the"},{"start":4546.45,"text":"end and zero all the time or maybe the reward is a thousand at the end and when you lose your rook"},{"start":4552.03,"text":"it's uh it's a negative reward you can't predict what the reward structure is going to be you want"},{"start":4556.69,"text":"an agent that is able to adapt to it and it's better to find a method that can scale to different"},{"start":4562.73,"text":"environments essentially okay so this was epsilon greedy action which is"},{"start":4573.29,"text":"adding some randomness with probability epsilon take a random action okay so"},{"start":4578.19,"text":"adding all our techniques because we get good at training reinforcement learning"},{"start":4583.49,"text":"algorithms this is what we have we initialize our Q network parameters we"},{"start":4588.17,"text":"We have a random network."},{"start":4589.23,"text":"We initialize our replay memory, D,"},{"start":4591.79,"text":"and then we loop over episodes."},{"start":4593.35,"text":"We start from an initial state."},{"start":4594.93,"text":"We create a Boolean that allows us to detect terminal states."},{"start":4598.35,"text":"With probability epsilon, we're going to take a random action."},{"start":4601.57,"text":"Otherwise, we're going to follow what we know,"},{"start":4603.59,"text":"which is forward propagate the state in the Q network,"},{"start":4606.25,"text":"take the action that has the highest Q value."},{"start":4608.51,"text":"That allows you to observe a reward in the next state."},{"start":4611.81,"text":"Take that next state, forward propagate it again."},{"start":4618.17,"text":"So instead, and then instead of, oh no, sorry, sorry."},{"start":4623.19,"text":"Observe that next state, add it to the replay memory,"},{"start":4627.05,"text":"sample from the replay memory, and then train on that sample."},{"start":4631.03,"text":"And in the process, you will need to do another forward path"},{"start":4633.79,"text":"because you need to estimate your target Y using the immediate reward"},{"start":4637.63,"text":"plus the Bellman equation, plus the discounted future reward."},{"start":4643.59,"text":"Okay, are you experts at Q-learning?"},{"start":4650.13,"text":"okay good sounds good and here is where we get at the end"},{"start":4654.91,"text":"You can claim proudly you have trained an ATAR."},{"start":4657.85,"text":"It's not that complicated, as you can see, other than the Bellman equation piece."}],"speech_gaps":[],"frame":"../frames/v062/027.webp","frame_time":4493.79},{"title":"深度强化学习中的挑战与解决方案","segments":[{"id":337,"text":"Let's go a little further and talk about advanced topics. Here is a game called Montezuma Revenge. This game is particular because you're controlling a little character right here. And this character is trying to go and grab, let's say, this key right here. And it has some obstacles or some enemies that it needs to take care of. What do you think is going to be an issue?","zh":"让我们再深入一点，谈谈高级主题。这里有一个叫做Montezuma Revenge的游戏。这个游戏特别之处在于你正在控制这个小角色。这个角色试图去获取，比如说，这个钥匙。它有一些障碍物或敌人需要处理。你们认为什么会成为问题呢？","start":4814.29,"end":4841.89},{"id":338,"text":"If we apply what we just learned to this game? What makes this game especially hard in comparison to, let's say, chess or Go? Yes. The reward is very delayed. If you start with a random network, what are the chances that the network is going to figure out that to get to the key...","zh":"如果我们把刚刚学到的内容应用到这个游戏上？相比国际象棋或围棋，这个游戏为什么特别难？是的。奖励非常延迟。如果你从一个随机的网络开始，这个网络能有多大几率理解到要获取钥匙……","start":4842.59,"end":4866.72},{"id":339,"text":"It actually should go in the opposite direction. It should go in the opposite direction. It should jump down here. It should catch the rope. The rope will probably allow the character to go to the ladder. It goes down the ladder. It has to go jump up this enemy. My guess is it's an enemy. I'm not sure, but I think it's an enemy because of the color. And I know that in gaming, if it was green, it might not have been an enemy. But if it's gray or red, it might be an enemy. And then go up the ladder and grab the key.","zh":"实际上它应该朝相反的方向走。它应该朝相反的方向走。它应该跳下来这里。它应该抓住绳子。绳子可能会让角色到达梯子。它沿着梯子往下走。它必须跳过这个敌人。我的猜测是这是一个敌人。我不确定，但我认为它是敌人，因为颜色。我知道在游戏里，如果是绿色的，可能不是敌人。但如果它是灰色或红色，可能是敌人。然后沿着梯子上去获取钥匙。","start":4867.42,"end":4895.86},{"id":340,"text":"The chance is very low that the agent is going to make that successive good decisions to get there. You're right. Why is it easier for a human to actually solve that game? Intuition, prior knowledge. So for example, when you look at this game, even if you have never played it, my guess is you would know you can go down the ladder.","zh":"代理做出一系列正确决策以到达那里的几率非常低。你说得对。为什么人类更容易解决这个游戏？直觉和先验知识。例如，当你看到这个游戏时，即使你从未玩过，我的猜测是你会知道你可以沿着梯子下去。","start":4896.46,"end":4921.36},{"id":341,"text":"Because you know what a ladder is. Or you can see this little rope and you're like, I'm going to catch the rope. I'm going to jump and go to the other side. And you look at this little monster and you're like, I better not touch this monster. Or if anything, I will jump on top of it.","zh":"因为你了解什么是梯子。或者你可以看到这条小绳子，你会想，我要抓住绳子。我要跳过去到另一边。你看到这个小怪物，你会想，我最好不要碰到它。或者更准确地说，我会跳到它上面。","start":4922.03,"end":4933.91},{"id":342,"text":"Because you've played Mario, let's say. So all of this is human intuition. Sometimes you would call as a baby survival instinct, like you throw the baby in the water and suddenly it flips and it can swim. Those are things that are to a certain extent encoded in our DNA, but at the very least encoded in our experience of doing other things that have nothing to do with this game.","zh":"因为你玩过马里奥，比如说。所有这些都是人类的直觉。有时你会称之为婴儿的生存本能，比如你把婴儿放进水里，突然它翻转过来并能游泳。这些在某种程度上是编码在我们的DNA中的，但至少是编码在我们做其他事情的经验中，而这些事情与这个游戏无关。","start":4934.46,"end":4955.96},{"id":343,"text":"And so the problem here is called imitation learning. Is there a better way to start our network than a random initialization that allows the network to, for example, guess that this is a ladder? And it turns out that if the network knows that, it will be more likely to get to the reward first and then learn from that reward and then get better over time. The other part that can also use human knowledge, which is what we're going to see together, is reinforcement learning from human feedback.","zh":"因此，这里的问题被称为模仿学习。有没有比随机初始化更好的方法来启动我们的网络，例如让网络猜测这是一个梯子？结果发现，如果网络知道这一点，它更有可能率先获得奖励，然后从该奖励中学习，并随着时间的推移变得更好。另一个可以利用人类知识的部分，也就是我们接下来要一起看到的，是来自人类反馈的强化学习。","start":4956.68,"end":4983.62}],"notes":["本段讨论了深度强化学习在Montezuma Revenge游戏中的挑战，特别是奖励延迟的问题。讲者指出，与国际象棋或围棋相比，这种游戏的奖励延迟使得随机初始化的网络难以成功。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4814.29,"end":4983.62,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4814.29,"text":"Let's go a little further and talk about advanced topics. Here is a game called Montezuma Revenge. This game is particular because you're controlling a little character right here. And this character is trying to go and grab, let's say, this key right here. And it has some obstacles or some enemies that it needs to take care of. What do you think is going to be an issue?"},{"start":4842.59,"text":"if we apply what we just learned to this game? What makes this game especially hard in comparison to, let's say, chess or Go? Yes. The reward is very delayed. If you start with a random network, what are the chances that the network is going to figure out that to get to the key..."},{"start":4867.42,"text":"It actually should go in the opposite direction. It should go in the opposite direction. It should jump down here. It should catch the rope. The rope will probably allow the character to go to the ladder. It goes down the ladder. It has to go jump up this enemy. My guess is it's an enemy. I'm not sure, but I think it's an enemy because of the color. And I know that in gaming, if it was green, it might not have been an enemy. But if it's gray or red, it might be an enemy. And then go up the ladder and grab the key."},{"start":4896.46,"text":"the chance is very low that the agent is going to make that successive good decisions to get there. You're right. Why is it easier for a human to actually solve that game? Intuition, prior knowledge. So for example, when you look at this game, even if you have never played it, my guess is you would know you can go down the ladder."},{"start":4922.03,"text":"because you know what a ladder is. Or you can see this little rope and you're like, I'm going to catch the rope. I'm going to jump and go to the other side. And you look at this little monster and you're like, I better not touch this monster. Or if anything, I will jump on top of it."},{"start":4934.46,"text":"Because you've played Mario, let's say. So all of this is human intuition. Sometimes you would call as a baby survival instinct, like you throw the baby in the water and suddenly it flips and it can swim. Those are things that are to a certain extent encoded in our DNA, but at the very least encoded in our experience of doing other things that have nothing to do with this game."},{"start":4956.68,"text":"And so the problem here is called imitation learning. Is there a better way to start our network than a random initialization that allows the network to, for example, guess that this is a ladder? And it turns out that if the network knows that, it will be more likely to get to the reward first and then learn from that reward and then get better over time. The other part that can also use human knowledge, which is what we're going to see together, is reinforcement learning from human feedback."}],"speech_gaps":[],"frame":"../frames/v062/029.webp","frame_time":4826.29},{"title":"强化学习在对齐问题中的应用与PPO算法","segments":[{"id":344,"text":"Where you have an analogy here, which is you can train a language model and it might be completely misaligned with what actually humans care about. How does reinforcement learning help in those situations? That's going to be the next topic in the last part of the lecture.","zh":"这里有一个类比，你可以训练一个语言模型，但它可能完全与人类真正关心的事情不一致。强化学习在这种情况下如何帮助？这将是本讲座最后部分的下一个主题。","start":4984.99,"end":4997.81},{"id":345,"text":"Okay, let me show you a few other results quickly. Today, we talked about DQ and DQ learning. In practice, there is a lot more reinforcement learning algorithm, but you got the gist of it. You got the concept of making good sequences of decision, epsilon greedy, exploration, exploitation, terminal state, starting state, all of that you got. The one algorithm that is very popular right now is called PPO, proximal policy optimization.","zh":"好的，让我快速展示你们一些其他结果。今天，我们讨论了DQ和DQ学习。实际上，还有许多其他的强化学习算法，但你已经掌握了其核心概念。你已经理解了如何做出良好的决策序列，ε-贪心，探索与利用，终端状态，起始状态，所有这些你都了解了。目前非常流行的一个算法叫做PPO，即近端策略优化。","start":4999.11,"end":5027.95},{"id":346,"text":"There is one that is even more popular right now that's actually from a year ago at Stanford called DPO that we won't study in the class. One of the things to know about PPO, just to go over it really quickly, and I pasted two important papers from Schulman et al. a few years back, TRPO and PPO, is that it is not a value-based algorithm. So in Q-learning, you learn the Q values and then you define your policy as the arg max of the Q values.","zh":"有一个甚至更加流行的是来自一年前斯坦福大学的DPO，我们不会在课堂上学习。关于PPO，只需快速回顾一下，我贴了两篇来自Schulman等人几年前的重要论文，TRPO和PPO，它并不是一个基于值的算法。所以在Q学习中，你学习Q值，然后将策略定义为Q值的arg max。","start":5028.74,"end":5055.84},{"id":347,"text":"In PPO, you learn the policy directly, which is a more probabilistic method. It also works well with continuous spaces. If you look at the Q learning we learned, one output for one action. If you actually have a game that has continuous action, like autonomous driving, where it's not like just turn the wheel to the right or to the left, it's like what degree you turn it, it's continuous, then the QN would not work.","zh":"在PPO中，你直接学习策略，这是一种更概率的方法。它也适用于连续空间。如果你看一下我们学习的Q学习，每个动作对应一个输出。如果你实际上有一个具有连续动作的游戏，比如自动驾驶，其中不是简单地将方向盘向左或向右转，而是转多少度，是连续的，那么QN将无法工作。","start":5056.66,"end":5083.88},{"id":348,"text":"Well, or you would have to granularize the number of action a little bit to the right, a little bit more, a little more, which would not be really useful. Instead, you would use PPO. Yeah. Yeah.","zh":"或者，你必须将动作的粒度细化为稍微向右一点，再稍微多一点，再更多一点，这将不太有用。相反，你会使用PPO。是的。是的。","start":5084.95,"end":5098.19},{"id":349,"text":"So the question is, how do you define the reward in the QN? Different reward structure will lead to different types of agent strategies. But you're right, for the game of Go, you could actually define the reward as 1 if you win and 0 if you don't win.","zh":"那么问题是，如何在QN中定义奖励？不同的奖励结构会导致不同类型的智能体策略。但你说得对，在围棋游戏中，你可以将奖励定义为：如果你赢了，奖励为1；如果你输了，奖励为0。","start":5103.89,"end":5119.75},{"id":350,"text":"That's it. Every move will be zero until the last move is a win. In chess, you might actually do intermediate reward because you want to tell the agent that it's good to kill the opponent's pieces to get rid of them. You could also do end-to-end and say, I don't give any intermediate reward, I just give a final reward, which might be more complicated to train on, but it might actually lead to a more optimal strategy because, in fact, you could actually win without taking any piece from your opponent.","zh":"就是这样。每一步的奖励都是零，直到最后一步是胜利。在国际象棋中，你实际上可能会给予中间奖励，因为你想告诉智能体，杀死对手棋子是好的，可以移除对手的棋子。你也可以采用端到端的方式，不给予任何中间奖励，只给予最终奖励，这可能更难以训练，但可能会导致更优的策略，因为事实上，你可能在不拿走对手任何棋子的情况下获胜。","start":5120.74,"end":5146.5},{"id":351,"text":"Other things about PPO is it's more probabilistic. It has a concept of an expected advantage, which at every step, instead of telling you how good that action is, it would tell you how much better it is than random.","zh":"关于PPO的其他方面是它更具概率性。它有一个预期优势的概念，在每一步，它不会告诉你某个动作有多好，而是告诉你这个动作比随机动作好多少。","start":5148.75,"end":5163.07}],"notes":["本段讲授了强化学习在对齐问题中的应用，即训练语言模型可能与人类价值观不一致，而强化学习可以帮助解决此类问题。接着，课程介绍了PPO（近端策略优化）算法，这是一种流行的策略梯度方法，与基于值的Q学习不同，它直接学习策略，适用于连续动作空间。","在讨论PPO时，课程指出，对于连续动作空间（如自动驾驶），Q学习可能不适用，因为需要对动作进行离散化处理，而PPO则能更自然地处理连续动作。此外，课程还提到，PPO是一种概率方法，它通过预期优势来衡量动作相对于随机动作的改进程度。","课程还讨论了奖励函数的设计问题，指出不同的奖励结构会导致不同的策略。例如，在围棋中，奖励可以定义为胜利时为1，失败时为0；而在国际象棋中，可能需要中间奖励来引导代理更快地击败对手。此外，课程还提到，端到端奖励（仅在最终步骤给予奖励）可能更复杂，但可能产生更优的策略。","课程最后提到，PPO的另一个特点是其概率性，它通过预期优势来评估动作的改进程度，而不是直接评估动作的好坏。这种设计使得PPO在处理连续动作空间时更加有效。","课程还提到，虽然DPO（直接策略优化）是一种更受欢迎的算法，但不会在课堂上进行深入研究。这表明课程内容主要集中在PPO及其相关概念上。","课程通过多个例子（如围棋、国际象棋、自动驾驶）来说明不同奖励结构和算法选择对策略的影响，强调了在实际应用中选择合适奖励函数和算法的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4984.99,"end":5163.07,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":4984.99,"text":"Where you have an analogy here, which is you can train a language model and it might be completely misaligned with what actually humans care about. How does reinforcement learning help in those situations? That's going to be the next topic in the last part of the lecture."},{"start":4999.11,"text":"Okay, let me show you a few other results quickly. Today, we talked about DQ and DQ learning. In practice, there is a lot more reinforcement learning algorithm, but you got the gist of it. You got the concept of making good sequences of decision, epsilon greedy, exploration, exploitation, terminal state, starting state, all of that you got. The one algorithm that is very popular right now is called PPO, proximal policy optimization."},{"start":5028.74,"text":"There is one that is even more popular right now that's actually from a year ago at Stanford called DPO that we won't study in the class. One of the things to know about PPO, just to go over it really quickly, and I pasted two important papers from Schulman et al. a few years back, TRPO and PPO, is that it is not a value-based algorithm. So in Q-learning, you learn the Q values and then you define your policy as the arg max of the Q values."},{"start":5056.66,"text":"In PPO, you learn the policy directly, which is a more probabilistic method. It also works well with continuous spaces. If you look at the Q learning we learned, one output for one action. If you actually have a game that has continuous action, like autonomous driving, where it's not like just turn the wheel to the right or to the left, it's like what degree you turn it, it's continuous, then the QN would not work."},{"start":5084.95,"text":"Well, or you would have to granularize the number of action a little bit to the right, a little bit more, a little more, which would not be really useful. Instead, you would use PPO. Yeah. Yeah."},{"start":5103.89,"text":"So the question is, how do you define the reward in the QN? Different reward structure will lead to different types of agent strategies. But you're right, for the game of Go, you could actually define the reward as 1 if you win and 0 if you don't win."},{"start":5120.74,"text":"That's it. Every move will be zero until the last move is a win. In chess, you might actually do intermediate reward because you want to tell the agent that it's good to kill the opponent's pieces to get rid of them. You could also do end-to-end and say, I don't give any intermediate reward, I just give a final reward, which might be more complicated to train on, but it might actually lead to a more optimal strategy because, in fact, you could actually win without taking any piece from your opponent."},{"start":5148.75,"text":"Other things about PPO is it's more probabilistic. It has a concept of an expected advantage, which at every step, instead of telling you how good that action is, it would tell you how much better it is than random."}],"speech_gaps":[],"frame":"../frames/v062/030.webp","frame_time":4996.99},{"title":"PPO算法与竞争自玩的示例","segments":[{"id":352,"text":"than the current state. How much better would it be to do a certain thing versus what you would have done otherwise? I'm not going to go into the details. It's all in the paper. But those are things that are important. Here's a few examples of PPO. So this example on the left is from OpenAI a few years back, where you can see it's a continuous space where the agent is being bullied a little bit, but it's trying to grab the rewards.","zh":"比当前状态更好多少？做某件事与否则会更好多少？我不会深入细节。所有内容都在论文中。但这些都是重要的问题。这里有几个PPO的例子。左边这个例子来自OpenAI几年前的成果，你可以看到这是一个连续空间，代理会受到一点欺负，但它试图获取奖励。","start":5163.49,"end":5190.63},{"id":353,"text":"but it's also subject to external forces that are sort of throwing balls at it. It's a little bit mean, but you can imagine that this is a continuous space, meaning you're controlling the nodes, you're controlling the joints of the agent, and you're controlling the forces, the angles, and so that's why PPO would be better in that case. Super. Here's a competitive self-play, which I really like.","zh":"但它也受到外部力量的影响，这些力量会向它投掷球体。这有点残酷，但你可以想象这是一个连续空间，意味着你控制节点、代理的关节，以及力量和角度，这就是为什么在这种情况下PPO会更有效。很好。这里是一个竞争自玩的例子，我非常喜欢。","start":5191.37,"end":5218.24},{"id":354,"text":"where you have agents play with each other. And this is the sumo game, push the opponent outside the ring and you get a reward. So actually it's interesting because you're seeing some emergent behavior, which is they attack each other's feet. Or they lower their center of gravity to be more stable, for example. Yeah. Yeah, yeah. It's versions, sometimes different initializations, for example. So no, but good question.","zh":"你让代理彼此对抗，这便是摔跤游戏，将对手推出圆圈即可获得奖励。实际上这很有趣，因为你可以看到一些涌现行为，例如它们攻击对方的脚，或者它们降低重心以增加稳定性，例如。是的。是的，是的。这是不同版本，有时是不同的初始化，例如。所以不，但这是一个好问题。","start":5222.06,"end":5251.4},{"id":355,"text":"Oftentimes, what OpenAI would do back in that time is they would create copies of the same model, they would initialize them differently, and they would let them learn. And it turns out one of the models will get better than the others. And then they will copy again that model to the rest and do the same thing again and again. Pretty much. It's kind of funny, isn't it? That's a good catch. That's a good goal. You could watch that for hours.","zh":"通常，OpenAI在那个时期会创建相同模型的副本，用不同的方式初始化它们，并让它们学习。结果发现其中一个模型会比其他模型更好。然后他们会将该模型复制到其余模型中，并重复同样的过程。基本上如此。这有点好笑，不是吗？这是一个好发现。这是一个好目标。你可以观看好几个小时。","start":5252.26,"end":5286.47},{"id":356,"text":"They're a little awkward, you have to say, but...","zh":"它们有点笨拙，你得这么说，但……","start":5289.99,"end":5291.95},{"id":357,"text":"But it works. Okay, so I'll let you watch the video. It's going to be shared. But here's another set of games that are even more complicated that I mentioned early on. OpenAI 5, which you can think of an equivalent of League of Legends, Dota, where you have a 5v5 game. So you have to collaborate, etc., which adds literally one additional degree of complexity.","zh":"但它有效。好的，所以我让你观看视频。视频将会被分享。但这里还有另一组更复杂的游戏，我早些时候提到过。OpenAI 5，你可以将其视为《英雄联盟》或《DOTA》的等价物，其中是5v5的游戏。你必须协作，等等，这实际上增加了整整一个复杂度层级。","start":5292.31,"end":5318.85},{"id":358,"text":"And StarCraft, AlphaStar from DeepMind is an example of where the observation is not the entire state. You have fog. And so that adds another layer of complexity. We're going to see that together today. I would encourage you to look at the AlphaGo documentary on Netflix. If you haven't, who has seen it already?","zh":"并且，星际争霸（StarCraft）中，DeepMind的AlphaStar就是一个观察（observation）不等于整个状态（state）的例子。你有迷雾（fog），这又增加了另一层复杂性。今天我们将一起看到这一点。我建议你们观看Netflix上的《AlphaGo》纪录片。如果还没看的话，谁已经看过呢？","start":5319.91,"end":5341.75}],"notes":["本段主要讲解PPO（Proximal Policy Optimization）算法在连续空间中的应用，以及竞争自玩（competitive self-play）的概念。PPO是一种强化学习算法，用于在连续空间中优化策略，通过控制节点、关节和力来实现目标。竞争自玩是指让多个智能体相互对抗，以提升学习效果。","在示例中，提到OpenAI的实验，其中创建多个模型副本，初始化方式不同，让它们学习。最终，其中一个模型会优于其他模型，然后将其复制到其他模型中，重复这一过程。这种方法有助于提升模型性能。","此外，还提到OpenAI 5，这是一个类似于《英雄联盟》和《DOTA》的5v5游戏，需要团队协作，增加了复杂度。同时，AlphaStar在《星际争霸》中的应用展示了观察信息不完整（如雾气）带来的额外挑战。","最后，讲师建议观看Netflix上的《AlphaGo》纪录片，以更深入了解深度强化学习的实际应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5163.49,"end":5341.75,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5163.49,"text":"than the current state. How much better would it be to do a certain thing versus what you would have done otherwise? I'm not going to go into the details. It's all in the paper. But those are things that are important. Here's a few examples of PPO. So this example on the left is from OpenAI a few years back, where you can see it's a continuous space where the agent is being bullied a little bit, but it's trying to grab the rewards."},{"start":5191.37,"text":"but it's also subject to external forces that are sort of throwing balls at it. It's a little bit mean, but you can imagine that this is a continuous space, meaning you're controlling the nodes, you're controlling the joints of the agent, and you're controlling the forces, the angles, and so that's why PPO would be better in that case. Super. Here's a competitive self-play, which I really like."},{"start":5222.06,"text":"where you have agents play with each other. And this is the sumo game, push the opponent outside the ring and you get a reward. So actually it's interesting because you're seeing some emergent behavior, which is they attack each other's feet. Or they lower their center of gravity to be more stable, for example. Yeah. Yeah, yeah. It's versions, sometimes different initializations, for example. So no, but good question."},{"start":5252.26,"text":"Oftentimes, what OpenAI would do back in that time is they would create copies of the same model, they would initialize them differently, and they would let them learn. And it turns out one of the models will get better than the others. And then they will copy again that model to the rest and do the same thing again and again. Pretty much. It's kind of funny, isn't it? That's a good catch. That's a good goal. You could watch that for hours."},{"start":5289.99,"text":"They're a little awkward, you have to say, but..."},{"start":5292.31,"text":"But it works. Okay, so I'll let you watch the video. It's going to be shared. But here's another set of games that are even more complicated that I mentioned early on. OpenAI 5, which you can think of an equivalent of League of Legends, Dota, where you have a 5v5 game. So you have to collaborate, etc., which adds literally one additional degree of complexity."},{"start":5319.91,"text":"And StarCraft, AlphaStar from DeepMind is an example of where the observation is not the entire state. You have fog. And so that adds another layer of complexity. We're going to see that together today. I would encourage you to look at the AlphaGo documentary on Netflix. If you haven't, who has seen it already?"}],"speech_gaps":[],"frame":"../frames/v062/031.webp","frame_time":5175.49},{"title":"深度强化学习中的AlphaGo例子与课程介绍","segments":[{"id":359,"text":"Nobody? Okay. Well, you can now watch it with a different eye, understanding reinforcement learning. And at some point in the documentary, you will see that AlphaGo makes a very odd move, a very creative move. And people are like, I don't understand that move. Even the top researchers or the best players would say in the video, they don't understand that move.","zh":"没有人吗？好吧，你现在可以用不同的眼光来看待它，理解强化学习。在纪录片的某个时刻，你会看到AlphaGo下了一个非常奇怪的棋，一个非常有创意的棋。人们会说，我不明白这一步。甚至顶级研究人员或最好的棋手在视频中也会说，他们不明白这一步。","start":5342.6,"end":5370.43},{"id":360,"text":"It turns out that that move is very unintuitive for humans because as humans, we are trained to maximize our chances of winning. Like literally, if I can eat all your pieces in chess, I will eat all your pieces. And if I can surround your stones in Go as much as I can, I will do it. The agent is just programmed to win. So that move actually looks counterintuitive because the agent doesn't care about winning by one or winning by 20 stones. It just cares about winning and that moves.","zh":"事实上，这一步对人类来说非常难以理解，因为作为人类，我们被训练去最大化获胜的机会。比如，如果我在国际象棋中能吃掉你所有的棋子，我就会吃掉所有的棋子。如果我在围棋中能尽可能多地包围你的棋子，我就会这么做。而智能体只是被编程去获胜。因此，这一步看起来似乎违背直觉，因为智能体并不关心以一分之差获胜还是以二十子之差获胜，它只关心获胜，而这一步就是获胜的关键。","start":5371.37,"end":5400.15},{"id":361,"text":"put the agent in a good place to win by a small margin.","zh":"将智能体置于一个能以微弱优势获胜的位置。","start":5401.01,"end":5404.31},{"id":362,"text":"So that's an example of an insight that you will learn,","zh":"这就是你将学到的一个见解，","start":5404.81,"end":5407.41},{"id":363,"text":"you understand from this class,","zh":"你将从这门课中理解到，","start":5407.47,"end":5409.11},{"id":364,"text":"and you will see in the documentary.","zh":"你将在纪录片中看到。","start":5409.21,"end":5411.85},{"id":365,"text":"Okay, I think we have 10 minutes.","zh":"好吧，我想我们有10分钟。","start":5414.53,"end":5416.23},{"id":366,"text":"I'm just going to introduce reinforcement learning","zh":"我将简单介绍一下强化学习","start":5416.43,"end":5419.15},{"id":367,"text":"from human feedback,","zh":"来自人类反馈，","start":5419.15,"end":5420.15},{"id":368,"text":"because it's a more modern topic","zh":"因为它是一个更现代的话题","start":5420.77,"end":5424.19},{"id":369,"text":"that is very trendy right now.","zh":"现在非常流行。","start":5424.19,"end":5426.75},{"id":370,"text":"It's important to know.","zh":"了解这一点很重要。","start":5426.79,"end":5427.59},{"id":371,"text":"And so let's look at it together.","zh":"因此，让我们一起看看。","start":5427.89,"end":5429.33},{"id":372,"text":"We're going to start by recapping how language models are trained in a nutshell, and then we'll see what supervised fine-tuning looks like.","zh":"我们将首先简要回顾语言模型是如何训练的，然后我们将看到监督微调的样子。","start":5429.33,"end":5437.85},{"id":373,"text":"We'll talk about how do we train a critique model, a reward model.","zh":"我们将讨论如何训练一个批评模型和一个奖励模型。","start":5438.01,"end":5441.53},{"id":374,"text":"And then finally, what RLHF looks like and why is it so trending in the news?","zh":"最后，我们将看到RLHF是什么样子的，以及为什么它在新闻中如此流行？","start":5441.77,"end":5446.89},{"id":375,"text":"So our training objective for language models is next token prediction, right?","zh":"因此，我们对语言模型的训练目标是下一个词的预测，对吧？","start":5447.43,"end":5454.39},{"id":376,"text":"We've already talked about it in a former lecture.","zh":"我们在之前的课程中已经讨论过这个话题。","start":5454.49,"end":5456.43},{"id":377,"text":"the idea is that i will get some inputs i'm reading wikipedia let's say or some sort of a","zh":"其想法是，我会得到一些输入，比如我正在阅读维基百科，或者某种在线文本，我读了一个句子，然后预测最后一个词，然后反复进行这个过程，","start":5456.43,"end":5462.25},{"id":378,"text":"text online and i read a sentence and i predict the last token and i do that again and again so","zh":"例如，深度学习，然后深度学习是深度学习，深度学习是如此的酷，","start":5462.25,"end":5469.09},{"id":379,"text":"for example deep learning and then deep learning is deep learning is so deep learning is so cool","zh":"就是这样，对吧？所以你总是预测下一个词，随着时间的推移，","start":5469.09,"end":5480.13},{"id":380,"text":"and that's it um so you get the idea right you're always printing the next token and then over time","zh":"这会迫使模型展现出显性的行为，并且它能够理解这些概念之间的联系，它在生成文本方面非常擅长，我们计算最后一个函数","start":5480.97,"end":5487.07},{"id":381,"text":"it forces the model to um explicit uh emerging behaviors and it understands the connections","zh":"（注：此处原文不完整）","start":5487.07,"end":5493.89},{"id":382,"text":"between those concepts and it's really good at generating texts we compute the last function","zh":"（注：此处原文不完整）","start":5493.89,"end":5500.45},{"id":383,"text":"you're actually going to study this last function in c5 so i'm not going to talk about it right now","zh":"你实际上将在c5中研究这个最后的函数，所以我现在不谈论它","start":5500.45,"end":5506.57},{"id":384,"text":"but you perform a gradient descent loop.","zh":"但你会执行一个梯度下降循环。","start":5506.57,"end":5511.11},{"id":385,"text":"And this is how you get your first pre-trained language model.","zh":"这就是你获得第一个预训练语言模型的方式。","start":5511.55,"end":5515.29},{"id":386,"text":"You get a pre-trained language model.","zh":"你获得一个预训练语言模型。","start":5515.51,"end":5516.87},{"id":387,"text":"You can call it on a text or a prompt, and it will continually generate.","zh":"你可以调用它在一个文本或提示上，它将持续生成。","start":5516.97,"end":5520.45}],"notes":["本段讲解了语言模型的训练方式，即通过预测下一个词来训练模型。讲者提到，模型会读取输入文本（如维基百科或在线文本），并不断预测句子的最后一个词，从而逐步学习语言的结构和连接。","讲者通过一个例子说明了语言模型的训练过程，即模型在不断预测下一个词的过程中，会逐渐理解词语之间的关系，并生成连贯的文本。","讲者提到，语言模型的训练目标是下一个词的预测，这已经在之前的课程中讨论过。模型通过不断重复这一过程，逐步学习语言的模式。","讲者指出，模型在训练过程中会逐渐展现出一些显性的行为，并理解词语之间的联系，这使得模型在生成文本时表现得非常出色。","讲者提到，模型的最后一步函数将在课程C5中详细学习，因此当前不深入讨论。但模型会通过梯度下降循环进行训练。","讲者总结了语言模型的训练过程，即通过不断预测下一个词，最终得到一个预训练的语言模型，该模型可以用于文本生成。"],"formulas":[],"uncertainties":["the last function","gradient descent loop"],"diagram":"none","start":5342.6,"end":5520.45,"asr_flags":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":5342.6,"text":"Nobody? Okay. Well, you can now watch it with a different eye, understanding reinforcement learning. And at some point in the documentary, you will see that AlphaGo makes a very odd move, a very creative move. And people are like, I don't understand that move. Even the top researchers or the best players would say in the video, they don't understand that move."},{"start":5371.37,"text":"It turns out that that move is very unintuitive for humans because as humans, we are trained to maximize our chances of winning. Like literally, if I can eat all your pieces in chess, I will eat all your pieces. And if I can surround your stones in Go as much as I can, I will do it. The agent is just programmed to win. So that move actually looks counterintuitive because the agent doesn't care about winning by one or winning by 20 stones. It just cares about winning and that moves."},{"start":5401.01,"text":"put the agent in a good place to win by a small margin."},{"start":5404.81,"text":"So that's an example of an insight that you will learn,"},{"start":5407.47,"text":"you understand from this class,"},{"start":5409.21,"text":"and you will see in the documentary."},{"start":5414.53,"text":"Okay, I think we have 10 minutes."},{"start":5416.43,"text":"I'm just going to introduce reinforcement learning"},{"start":5419.15,"text":"from human feedback,"},{"start":5420.77,"text":"because it's a more modern topic"},{"start":5424.19,"text":"that is very trendy right now."},{"start":5426.79,"text":"It's important to know."},{"start":5427.89,"text":"And so let's look at it together."},{"start":5429.33,"text":"We're going to start by recapping how language models are trained in a nutshell, and then we'll see what supervised fine-tuning looks like."},{"start":5438.01,"text":"We'll talk about how do we train a critique model, a reward model."},{"start":5441.77,"text":"And then finally, what RLHF looks like and why is it so trending in the news?"},{"start":5447.43,"text":"So our training objective for language models is next token prediction, right?"},{"start":5454.49,"text":"We've already talked about it in a former lecture."},{"start":5456.43,"text":"the idea is that i will get some inputs i'm reading wikipedia let's say or some sort of a"},{"start":5462.25,"text":"text online and i read a sentence and i predict the last token and i do that again and again so"},{"start":5469.09,"text":"for example deep learning and then deep learning is deep learning is so deep learning is so cool"},{"start":5480.97,"text":"and that's it um so you get the idea right you're always printing the next token and then over time"},{"start":5487.07,"text":"it forces the model to um explicit uh emerging behaviors and it understands the connections"},{"start":5493.89,"text":"between those concepts and it's really good at generating texts we compute the last function"},{"start":5500.45,"text":"you're actually going to study this last function in c5 so i'm not going to talk about it right now"},{"start":5506.57,"text":"but you perform a gradient descent loop."},{"start":5511.55,"text":"And this is how you get your first pre-trained language model."},{"start":5515.51,"text":"You get a pre-trained language model."},{"start":5516.97,"text":"You can call it on a text or a prompt, and it will continually generate."}],"speech_gaps":[],"frame":"../frames/v062/032.webp","frame_time":5354.6},{"title":"语言模型的训练问题与改进方法","segments":[{"id":388,"text":"And you call it again and again and again, and it generates, generates, generates.","zh":"你一遍又一遍地调用它，它不断生成，不断生成，不断生成。","start":5520.67,"end":5523.21},{"id":389,"text":"Everybody's comfortable with that, right?","zh":"大家对此都很适应，对吧？","start":5524.51,"end":5525.93},{"id":390,"text":"Okay, so that's how we trained a language model,","zh":"好的，所以这就是我们如何训练语言模型的方式，","start":5526.95,"end":5530.49},{"id":391,"text":"but there is a couple of problems.","zh":"但存在一些问题。","start":5530.63,"end":5532.31},{"id":392,"text":"The first problem is that online data does not reflect helpfulness","zh":"第一个问题是在线数据并不能反映有用性","start":5532.31,"end":5539.85},{"id":393,"text":"so to give you a concrete example what you might find in the training set is something like deep","zh":"举个具体的例子，你可能会在训练集中看到类似『深度学习非常酷』的内容","start":5541.43,"end":5547.73},{"id":394,"text":"learning is so cool when actually what you might find in practice is people asking what is deep","zh":"但实际上在实践中人们可能会问『什么是深度』","start":5547.73,"end":5553.67},{"id":395,"text":"the data is not really reflective of you want an agent to be helpful and that's a","zh":"数据并不能真正反映你希望代理具有有用性，而这是一个","start":5553.67,"end":5560.43},{"id":396,"text":"problem because the model was trained to continue text rather than answer questions.","zh":"问题在于模型是被训练来继续生成文本，而不是回答问题的。","start":5560.43,"end":5565.49},{"id":397,"text":"And in practice, you would see it's a big problem. Another problem is the model has no","zh":"实际上，你会看到这是一个大问题。另一个问题是模型还没有良好的、礼貌的或有帮助的概念。为了给你一个具体的例子，","start":5566.77,"end":5571.19},{"id":398,"text":"concept of good, polite, or helpful yet. And to give you a concrete example,","zh":"你可能会实际向一个预训练的语言模型提问：我的笔记本电脑无法开机，我该怎么办？","start":5571.19,"end":5576.75},{"id":399,"text":"you might actually ask a pre-trained language model, my laptop won't turn on, what should I do?","zh":"然后模型的回应，因为它在Reddit或维基百科上读过，是笔记本电脑有时无法开机是因为电源问题，这并不是你所问的。你问的是，我该怎么办？","start":5577.07,"end":5582.63},{"id":400,"text":"And then the model response, because it has read it on Reddit or on Wikipedia, is laptops sometimes don't turn on because of power issues, which is not what you ask. You ask, what should I do?","zh":"事实上，更好的回答应该是检查你的充电器，是否连接正常或插座是否工作。如果这些都没问题，尝试按住电源键10秒钟。如果仍然无法启动，可能是电池或主板的问题，等等。这是更好的回答。这是你现在希望语言模型做到的。模型可以给你事实性的文本，因为它就是被这样训练的，但它并不理解有帮助或给出类似人类的回答。","start":5583.4,"end":5594.2},{"id":401,"text":"And in fact, a better answer would have been check your charger, if it's properly connected or the outlet works. If that's fine, try holding the power button for 10 seconds. If it still doesn't start, the battery or motherboard may blah, blah, blah, blah. That's a better answer. That's what you want a language model to do nowadays. And the model can give you factual text because that's what it's been trained on, but it doesn't understand being helpful or having an answer that looks like a human-like answer.","zh":"事实上，更好的回答应该是检查你的充电器是否正确连接，或者电源插座是否正常工作。如果这些都没问题，尝试按住电源按钮10秒钟。如果仍然无法启动，可能是电池或主板的问题，等等。这就是更好的回答。这就是现在你希望语言模型做到的事情。模型可以给出事实性的文本，因为它就是基于这些内容进行训练的，但它并不理解如何提供有帮助的回答，或者给出看起来像人类回答的内容。","start":5595.03,"end":5622.41},{"id":402,"text":"So our solution to it, we start with using supervised fine tuning, which is going to be learning from human written demonstrations of helpful behavior. And then we get to even further and use RLHF, which will optimize not only for human written sentences or paragraphs, but for preferences. And the word preference is the keyword.","zh":"让我们谈谈如何通过监督微调来改进我们的预训练模型。我们假设想要将模型与人类的回报响应对齐。第一步是构建一个数据集。让我们构建一个人类提示-回应对的数据集。所以实际上，OpenAI会怎么做，我稍后会解释，可能是……","start":5624.75,"end":5646.19},{"id":403,"text":"Let's talk about how we can improve our pre-trained model with supervised fine-tuning. I'll take that we want to align models with human return responses. And the step one that we're going to lose is to build a dataset. Let's build a dataset of human prompt-response pairs. So what actually OpenAI is going to do, I'll explain it in a second, is it might...","zh":"让我们谈谈如何通过监督微调来改进我们的预训练模型。我们假设想要将模型与人类的回报响应对齐。我们将要进行的第一步是构建一个数据集。让我们构建一个人类提示-响应对的数据集。所以，实际上OpenAI接下来可能会做的事情，我稍后会解释，可能是……","start":5647.28,"end":5671.3},{"id":404,"text":"collect some of the prompts that we all use, and then ask humans to respond to those prompts and put that in a data set. It might also ask separately experts to write really good prompts and then answer those prompts.","zh":"收集我们所有人使用的部分提示，然后让人类对这些提示进行回应，并将这些内容放入一个数据集中。它也可能分别询问专家编写非常优秀的提示，然后对这些提示进行回答。","start":5672.08,"end":5684.02}],"notes":["本段讨论了语言模型训练中遇到的两个主要问题：在线数据无法反映用户对帮助性的需求，以及模型缺乏对良好、礼貌或有帮助行为的理解。讲者通过一个具体例子说明了模型在回答用户问题时的不足，即模型倾向于提供事实性信息而非实用建议。","讲者指出，模型在训练时被设计为继续生成文本，而不是直接回答问题，这导致了模型输出与用户期望之间的差距。例如，当用户询问如何解决电脑无法开机的问题时，模型可能给出与问题无关的信息，而不是直接的解决方案。","为了解决这些问题，讲者提出了使用监督微调（supervised fine-tuning）的方法，即通过人类编写的帮助性行为示例来训练模型。这种方法旨在使模型更贴近人类的期望。","讲者进一步提到，除了监督微调，还可以使用基于人类反馈的强化学习（RLHF），这种方法不仅优化人类书写的句子或段落，还优化人类的偏好。关键词是“偏好”，即模型需要学习人类对不同回答的偏好。","在实施监督微调时，第一步是构建一个包含人类提示-回答对的数据集。讲者提到，OpenAI可能会收集一些常用的提示，并让人类对这些提示进行回答，从而构建数据集。此外，还会让专家编写高质量的提示并进行回答。","讲者强调，通过这些方法，模型可以更好地对齐人类的期望，从而提供更实用、更符合人类需求的回答。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5520.67,"end":5684.02,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":5520.67,"text":"And you call it again and again and again, and it generates, generates, generates."},{"start":5524.51,"text":"Everybody's comfortable with that, right?"},{"start":5526.95,"text":"Okay, so that's how we trained a language model,"},{"start":5530.63,"text":"but there is a couple of problems."},{"start":5532.31,"text":"problems the first problem is that online data does not reflect helpfulness"},{"start":5541.43,"text":"so to give you a concrete example what you might find in the training set is something like deep"},{"start":5547.73,"text":"learning is so cool when actually what you might find in practice is people asking what is deep"},{"start":5553.67,"text":"learning so the data is not really reflective of you want an agent to be helpful and that's a"},{"start":5560.43,"text":"problem because the model was trained to continue text rather than answer questions."},{"start":5566.77,"text":"And in practice, you would see it's a big problem. Another problem is the model has no"},{"start":5571.19,"text":"concept of good, polite, or helpful yet. And to give you a concrete example,"},{"start":5577.07,"text":"you might actually ask a pre-trained language model, my laptop won't turn on, what should I do?"},{"start":5583.4,"text":"And then the model response, because it has read it on Reddit or on Wikipedia, is laptops sometimes don't turn on because of power issues, which is not what you ask. You ask, what should I do?"},{"start":5595.03,"text":"And in fact, a better answer would have been check your charger, if it's properly connected or the outlet works. If that's fine, try holding the power button for 10 seconds. If it still doesn't start, the battery or motherboard may blah, blah, blah, blah. That's a better answer. That's what you want a language model to do nowadays. And the model can give you factual text because that's what it's been trained on, but it doesn't understand being helpful or having an answer that looks like a human-like answer."},{"start":5624.75,"text":"So our solution to it, we start with using supervised fine tuning, which is going to be learning from human written demonstrations of helpful behavior. And then we get to even further and use RLHF, which will optimize not only for human written sentences or paragraphs, but for preferences. And the word preference is the keyword."},{"start":5647.28,"text":"Let's talk about how we can improve our pre-trained model with supervised fine-tuning. I'll take that we want to align models with human return responses. And the step one that we're going to lose is to build a dataset. Let's build a dataset of human prompt-response pairs. So what actually OpenAI is going to do, I'll explain it in a second, is it might..."},{"start":5672.08,"text":"collect some of the prompts that we all use, and then ask humans to respond to those prompts and put that in a data set. It might also ask separately experts to write really good prompts and then answer those prompts."}],"speech_gaps":[],"frame":"../frames/v062/033.webp","frame_time":5532.67},{"title":"监督微调（SFT）与奖励模型（RM）","segments":[{"id":405,"text":"It's a fully human-made data set. And then we use that data set to fine-tune our pre-trained model. And by now, you've learned fine-tuning in the online video, so you know what I'm talking about, using supervised learning. So what it looks like is I take my pre-trained model that I just told you how we train, and then I give it a prompt, explain deep learning to a beginner. And I also will concatenate to it.","zh":"这是一个完全由人类制作的数据集。然后我们使用这个数据集来微调我们的预训练模型。现在你已经在在线视频中学习了微调，所以你知道我在说什么，使用监督学习。看起来就是我拿我刚刚告诉你们如何训练的预训练模型，然后我给它一个提示，解释深度学习给初学者。我还会将它与一个由人类撰写的良好回应连接起来。","start":5684.97,"end":5709.77},{"id":406,"text":"a response, a good response written by a human. Deep learning is a type of machine learning that uses neural. And then I expect the model to come up with the word networks. So it's literally do whatever we need to train the pre-trained model, but we do it on a human written prompt response pairs.","zh":"一个回应，一个由人类撰写的良好回应。深度学习是一种使用神经网络的机器学习类型。然后我期望模型能生成『网络』这个词。所以它实际上就是做我们所需要的一切来训练预训练模型，但我们在人类撰写的提示-回应对上进行。","start":5710.73,"end":5731.47},{"id":407,"text":"And if you do that many times and you use the same loss function, how far the model's response is from a human response, you do that many times and you will get SFT, supervised fine tuning. But it has some shortcomings. One of the shortcomings is it is data that is extremely costly to collect. In fact, I believe in the first version of that instruct GPT, there was only 13,000.","zh":"如果你多次这样做，并且使用相同的损失函数，衡量模型的回应与人类回应之间的距离，多次这样做后，你就会得到SFT，即监督微调。但它有一些缺点。其中一个缺点是收集这些数据的成本极高。事实上，我相信在第一个版本的指令GPT中，只有13,000个提示-回应对。","start":5734.79,"end":5765.47},{"id":408,"text":"prompt-response pairs. And it turns out it did really well despite that. The second aspect is it's unlikely to generalize well because you're, again, you're not doing reinforcement learning here. You're doing supervised learning. And so you're just showing a set of examples, 13,000 examples that you want to learn. But it's what tells you that it will generalize to an unseen prompt that will come up.","zh":"并且结果表明，尽管数据量如此之少，它仍然表现得非常好。第二个方面是它不太可能很好地泛化，因为在这里你并不是在做强化学习，而是在做监督学习。因此，你只是展示一组例子，13,000个你希望模型学习的例子。但它无法告诉你它是否会泛化到一个未见过的提示，这个提示将来自你的用户群体。","start":5766.16,"end":5795.27},{"id":409,"text":"from your user base. And so this approach, SFT, really teaches the model to imitate good behavior from humans. And that's the key. It's imitation. It is not preference optimization. To do preference optimization, that's where we're going to train a reward model and we're going to do proper RLHF. So let me talk to you about the RM reward model. And then I'll tell you about...","zh":"因此，这种方法，SFT，真正教会模型模仿人类的良好行为。而这正是关键所在。它是模仿，而不是偏好优化。为了进行偏好优化，我们将会训练一个奖励模型，并进行真正的RLHF。让我向你们介绍RM奖励模型。然后我会告诉你……","start":5795.83,"end":5823.59},{"id":410,"text":"RLHF in a nutshell. The problem of RLHF is to align not with human responses, but with human preferences. So what's going to happen is we're going to train a separate model to predict.","zh":"RLHF的简要内容。RLHF的问题是将模型对齐到人类偏好，而不是人类回应。接下来会发生的是，我们将训练一个独立的模型来预测。","start":5824.51,"end":5841.41},{"id":411,"text":"which responses humans prefer, and we're going to call that model the reward model. It's a separate model from whatever we've trained before. The model is going to use data from labelers. So you're going to show labelers two or more responses to the same prompt, and those responses will be sampled from the SFT.","zh":"人类更喜欢哪些回应，我们将称这个模型为奖励模型。这个模型与我们之前训练的任何模型都是分开的。该模型将使用标注者的数据。因此，你会向标注者展示两个或更多对同一提示的回应，而这些回应将从SFT中采样。","start":5842.24,"end":5864.32}],"notes":["本段讲解了监督微调（SFT）的基本概念，即通过使用人类编写的提示-响应对来微调预训练模型。SFT的核心思想是让模型模仿人类的高质量响应，而不是直接优化偏好。这种方法虽然有效，但存在数据收集成本高和泛化能力有限的问题。","SFT的局限性包括数据收集成本高和泛化能力差。例如，早期的Instruct GPT仅使用了13,000个提示-响应对，但仍然表现良好。然而，由于SFT仅基于监督学习，模型无法很好地泛化到未见过的提示。","SFT的关键在于模仿人类行为，而不是偏好优化。偏好优化需要训练奖励模型（RM），并结合强化学习（RLHF）来对齐模型与人类偏好。","奖励模型（RM）是RLHF的一部分，其目标是预测人类对不同响应的偏好。RM使用标注者提供的数据，这些数据来自SFT模型生成的响应。","RLHF的核心问题在于对齐模型与人类偏好，而不是仅仅对齐模型与人类响应。通过训练RM，可以为强化学习提供奖励信号，从而优化模型行为。","SFT和RM是深度强化学习中的两个关键步骤，前者用于模仿人类行为，后者用于优化模型以符合人类偏好。两者结合可以提升模型的性能和对齐度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5684.97,"end":5864.32,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5684.97,"text":"It's a fully human-made data set. And then we use that data set to fine-tune our pre-trained model. And by now, you've learned fine-tuning in the online video, so you know what I'm talking about, using supervised learning. So what it looks like is I take my pre-trained model that I just told you how we train, and then I give it a prompt, explain deep learning to a beginner. And I also will concatenate to it."},{"start":5710.73,"text":"a response, a good response written by a human. Deep learning is a type of machine learning that uses neural. And then I expect the model to come up with the word networks. So it's literally do whatever we need to train the pre-trained model, but we do it on a human written prompt response pairs."},{"start":5734.79,"text":"And if you do that many times and you use the same loss function, how far the model's response is from a human response, you do that many times and you will get SFT, supervised fine tuning. But it has some shortcomings. One of the shortcomings is it is data that is extremely costly to collect. In fact, I believe in the first version of that instruct GPT, there was only 13,000."},{"start":5766.16,"text":"prompt-response pairs. And it turns out it did really well despite that. The second aspect is it's unlikely to generalize well because you're, again, you're not doing reinforcement learning here. You're doing supervised learning. And so you're just showing a set of examples, 13,000 examples that you want to learn. But it's what tells you that it will generalize to an unseen prompt that will come up."},{"start":5795.83,"text":"from your user base. And so this approach, SFT, really teaches the model to imitate good behavior from humans. And that's the key. It's imitation. It is not preference optimization. To do preference optimization, that's where we're going to train a reward model and we're going to do proper RLHF. So let me talk to you about the RM reward model. And then I'll tell you about..."},{"start":5824.51,"text":"RLHF in a nutshell. The problem of RLHF is to align not with human responses, but with human preferences. So what's going to happen is we're going to train a separate model to predict."},{"start":5842.24,"text":"which responses humans prefer, and we're going to call that model the reward model. It's a separate model from whatever we've trained before. The model is going to use data from labelers. So you're going to show labelers two or more responses to the same prompt, and those responses will be sampled from the SFT."}],"speech_gaps":[],"frame":"../frames/v062/034.webp","frame_time":5696.97},{"title":"使用偏好数据训练奖励模型","segments":[{"id":412,"text":"So your best model right now is the SFT. You will sample three or four responses and you know how we sample, right? You can tweak the temperature. You can select not only the top priority word, the top, the soft max layers, number one word, but you can sometimes sample differently and you will get a variety of answers. And then you will ask a human labeler to say answer B is better than answer C and answer C is better than answer A and answer A is sort of equal to answer D.","zh":"所以你目前最好的模型是SFT。你会采样三个或四个回答，你知道我们是如何采样的，对吧？你可以调整温度参数。你不仅可以选择最高优先级的词，即softmax层中的第一个词，有时你也可以以不同的方式采样，从而得到多样化的答案。然后你会让人类标注员说出答案B比答案C更好，答案C比答案A更好，答案A和答案
