D大致相等。","start":5864.89,"end":5894.03},{"id":413,"text":"That's it. They will be asked which response they prefer, and it can get more complicated. It doesn't have to be just a simple ranking. You have multiple Likert scale methods and so on. But the point is that you will collect those pairwise comparisons that we call preference data, and you will use it to train a reward model, which is initialized from your SFT.","zh":"这就是全部。他们会被告知他们更喜欢哪个回答，这可能会更复杂。不一定只是简单的排名。你还可以使用多种Likert量表方法等。但关键是你会收集这些成对比较数据，我们称之为偏好数据，并用它来训练一个奖励模型，该模型是从你的SFT初始化的。","start":5894.57,"end":5918.21},{"id":414,"text":"So your SFT is here. It's your best model to date. And you're going to modify the last layer. So the softmax layer at the end of a language model that will tell you this is the token we should output or this is the word we should write.","zh":"所以你的SFT在这里。它是你迄今为止最好的模型。你将修改最后一层。在语言模型的末尾，有一个softmax层，它会告诉你应该输出哪个token或应该写出哪个词。","start":5918.68,"end":5932.9},{"id":415,"text":"Instead of that, you'll get rid of that layer. You'll put a scalar value as output. You'll put a linear layer with a scalar value that will represent the reward head. It will predict the reward, which is a proxy for the preference of the human. The way you'll train that reward model is you'll give it a batch of two. You'll give it a prompt X.","zh":"相反，你会去掉这一层。你会将一个标量值作为输出。你会放置一个线性层，输出一个标量值，这将代表奖励头。它会预测奖励，这实际上是人类偏好的代理。你训练这个奖励模型的方式是，给它一个包含两个样本的批次。你会给它一个提示X。","start":5933.63,"end":5956.05},{"id":416,"text":"a response A and the preference of the user. And you give it the same prompt with a response B from the SFT with the preference of the user. So here the user is saying response A is better than response B. And so if you actually were sending that in this model, you will get a predicted reward for the preferred answer and a predicted reward for this preferred answer. That allows you to train using","zh":"一个回答A和用户的偏好。然后你会给它相同的提示，但回答是来自SFT的回答B以及用户的偏好。在这里，用户表示回答A比回答B更好。因此，如果你实际上将这些数据输入到这个模型中，你会得到对优选答案的预测奖励和对优选答案的预测奖励。这使你能够使用","start":5957.32,"end":5986.64},{"id":417,"text":"loss function that I'm not going to cover given our time sensitivity. The loss function will encourage the model to assign higher rewards to preferred responses. So you're trying to dissociate the higher reward, better preference from the lower reward for lower preference. And it turns out that if you do that many times, you will have a reward model that given a prompt and a response will be approximating human preference.","zh":"一个我不会在时间允许范围内讲解的损失函数。这个损失函数会鼓励模型为更受偏好的响应分配更高的奖励。因此，你试图将较高的奖励、更好的偏好与较低的奖励、较差的偏好区分开来。结果发现，如果你多次这样做，你将得到一个奖励模型，该模型在给定提示和响应时，能够近似人类的偏好。","start":5987.98,"end":6014.66},{"id":418,"text":"So you've just trained a critique that represents your humans. It's a proxy for what humans prefer. It's been trained on a lot of human preferences. The reason it's better to use a model than actual humans is because we can use it widely on all sorts of inputs and it can scale from a data standpoint. Also note that this method is better than SFT because it's way easier to ask humans what's your preference between those two things and to ask them to come up with answers to prompts.","zh":"你刚刚训练了一个代表人类偏好的批判模型。它是人类偏好的代理。它已经在大量的人类偏好数据上进行过训练。使用模型而不是实际人类的好处在于，我们可以将其广泛应用于各种输入，并且从数据的角度来看，它具有可扩展性。另外请注意，这种方法比监督微调（SFT）更好，因为询问人类在两个事物之间更偏好的内容要容易得多，而且让他们为提示生成答案也更容易。","start":6015.31,"end":6043.65}],"notes":["本段讲解了如何利用人类偏好数据来训练奖励模型。首先，通过SFT（监督微调）模型生成多个响应，然后让人类标注者对这些响应进行比较，以获取偏好数据。这些数据用于训练奖励模型，该模型的目标是预测人类对响应的偏好。","奖励模型的训练过程涉及将提示和响应对输入模型，并通过损失函数鼓励模型为更受偏好的响应分配更高的奖励。这种方法比直接使用人类标注更高效，因为可以大规模应用模型进行评估。","在训练奖励模型时，会移除语言模型的softmax层，替换为一个线性层，输出一个标量值作为奖励头。该奖励头预测的是人类偏好的代理指标。","训练奖励模型时，会使用包含两个响应的批次，每个响应都带有用户偏好信息。通过这种方式，模型可以学习如何根据偏好调整奖励分配。","奖励模型的训练目标是将高奖励与高偏好、低奖励与低偏好区分开来。通过多次训练，模型可以逐渐逼近人类的偏好。","使用模型代替人类标注的优势在于可以广泛应用于各种输入，并且在数据规模上具有可扩展性。此外，这种方法比SFT更高效，因为更容易获取人类对两个响应的偏好信息。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5864.89,"end":6043.65,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5864.89,"text":"So your best model right now is the SFT. You will sample three or four responses and you know how we sample, right? You can tweak the temperature. You can select not only the top priority word, the top, the soft max layers, number one word, but you can sometimes sample differently and you will get a variety of answers. And then you will ask a human labeler to say answer B is better than answer C and answer C is better than answer A and answer A is sort of equal to answer D."},{"start":5894.57,"text":"That's it. They will be asked which response they prefer, and it can get more complicated. It doesn't have to be just a simple ranking. You have multiple Likert scale methods and so on. But the point is that you will collect those pairwise comparisons that we call preference data, and you will use it to train a reward model, which is initialized from your SFT."},{"start":5918.68,"text":"So your SFT is here. It's your best model to date. And you're going to modify the last layer. So the softmax layer at the end of a language model that will tell you this is the token we should output or this is the word we should write."},{"start":5933.63,"text":"Instead of that, you'll get rid of that layer. You'll put a scalar value as output. You'll put a linear layer with a scalar value that will represent the reward head. It will predict the reward, which is a proxy for the preference of the human. The way you'll train that reward model is you'll give it a batch of two. You'll give it a prompt X."},{"start":5957.32,"text":"a response A and the preference of the user. And you give it the same prompt with a response B from the SFT with the preference of the user. So here the user is saying response A is better than response B. And so if you actually were sending that in this model, you will get a predicted reward for the preferred answer and a predicted reward for this preferred answer. That allows you to train using"},{"start":5987.98,"text":"loss function that I'm not going to cover given our time sensitivity. The loss function will encourage the model to assign higher rewards to preferred responses. So you're trying to dissociate the higher reward, better preference from the lower reward for lower preference. And it turns out that if you do that many times, you will have a reward model that given a prompt and a response will be approximating human preference."},{"start":6015.31,"text":"So you've just trained a critique that represents your humans. It's a proxy for what humans prefer. It's been trained on a lot of human preferences. The reason it's better to use a model than actual humans is because we can use it widely on all sorts of inputs and it can scale from a data standpoint. Also note that this method is better than SFT because it's way easier to ask humans what's your preference between those two things and to ask them to come up with answers to prompts."}],"speech_gaps":[],"frame":"../frames/v062/035.webp","frame_time":5876.89},{"title":"强化学习中的奖励模型与人类反馈","segments":[{"id":419,"text":"It takes way less time. And if you've used ChatGPT, you've probably been asked before to tell them which response you prefer. So once trained, the reward model replaces the human as the evaluator during reinforcement learning from human feedback. And reinforcement learning from human feedback is...","zh":"这花费的时间要少得多。如果你使用过ChatGPT，你可能之前就被问过你更喜欢哪个回复。因此，一旦训练完成，奖励模型就会取代人类，在人类反馈强化学习中作为评估者。而人类反馈强化学习是...","start":6044.17,"end":6064.67},{"id":420,"text":"Very comfortable for you now. I will show you what it looks like given the Q-learning algorithm we learned. But essentially, we have first taught the model what good behavior looks like with SFT. And then we built a reward model that can tell us how good an answer is according to human preferences. And the RLHF approach is where we will let this model practice, get scored by the reward model or the critic, and update itself to produce higher.","zh":"你现在感觉非常舒适。我会向你展示在我们学习的Q学习算法下它是什么样子的。但本质上，我们首先通过SFT教会模型什么是良好的行为。然后我们构建了一个奖励模型，可以根据人类偏好告诉我们一个回答有多好。而RLHF方法就是让这个模型进行练习，由奖励模型或评论者进行评分，并更新自身以产生更高的结果。","start":6065.17,"end":6091.87},{"id":421,"text":"scoring answers, so more preferred answers. And it's the same as the games we've seen together, but some things differ. So I just pasted here the exact setup that we've learned together for reinforcement learning. The differences are the following. Our objective is still to maximize expected reward that is produced by the reward model aligned with human preferences.","zh":"对回答进行评分，从而产生更受偏好的回答。这与我们之前看到的游戏是相同的，但有些方面有所不同。所以我在这里贴出了我们共同学习的强化学习的确切设置。不同之处如下。我们的目标仍然是最大化由与人类偏好对齐的奖励模型产生的预期奖励。","start":6092.46,"end":6118.32},{"id":422,"text":"The agent is the language model being fine-tuned. The environment is the space of possible prompts and continuations. It's any text that you can encounter. The state is the specific prompt plus the tokens that were generated so far. The next state is one more token added. And the action is the next token that is chosen by the agent or the model, which is...","zh":"智能体是正在微调的语言模型。环境是所有可能的提示和延续的集合。它是你可能遇到的任何文本。状态是特定的提示加上到目前为止生成的标记。下一个状态是添加了一个更多的标记。而动作是智能体或模型选择的下一个标记，这当然是由策略决定的。","start":6121.35,"end":6150.63},{"id":423,"text":"of course determined by the policy. And then the reward is estimated by the reward model that we trained to represent human preferences. In this case one episode is one full prompt.","zh":"奖励是由我们训练用来表示人类偏好的奖励模型估计的。在这种情况下，一个回合是一整个提示。","start":6150.99,"end":6170.49},{"id":424,"text":"So imagine that you get a prompt and you start generating and you go through this reinforcement learning loop and you observe the rewards and then you try to maximize the future rewards. And then at the end of training, you end up with having your pre-trained model turn into an SFT and your SFT turn into a way better model using RLHF. Okay, so a few things to note to end on this. The model does not get a reward at...","zh":"所以想象一下，你得到了一个提示，开始生成，并经历这个强化学习循环，观察奖励，然后尝试最大化未来的奖励。在训练结束时，你会得到一个预训练模型转变为SFT，而SFT又转变为使用RLHF的更好模型。好的，最后几点需要注意。模型在...","start":6171.27,"end":6200.4}],"notes":["本段讲解了强化学习中使用奖励模型和人类反馈（RLHF）的方法。首先，模型通过监督微调（SFT）学习人类认为好的行为，然后构建一个奖励模型来评估回答的质量。奖励模型根据人类偏好来评分，模型通过与奖励模型互动进行强化学习，以生成更符合人类偏好的回答。","在RLHF框架中，代理是被微调的语言模型，环境是所有可能的提示和延续文本，状态是特定提示和已生成的标记，动作是模型选择的下一个标记。奖励由奖励模型估计，其目标是最大化奖励模型产生的预期奖励。","课程中提到，一个训练回合（episode）对应一个完整的提示，模型在生成过程中通过强化学习循环观察奖励，并尝试最大化未来奖励。最终，预训练模型通过SFT和RLHF的结合，演变为一个性能更好的模型。","课程还指出，在强化学习过程中，模型不会在每个步骤都获得奖励，而是通过奖励模型的评分来更新策略。这种机制使得模型能够逐步优化其生成的回答，使其更符合人类的偏好。","整个过程强调了奖励模型在强化学习中的核心作用，它不仅评估回答的质量，还作为人类偏好的代理，使模型能够通过与奖励模型的互动不断改进。","课程最后提到，模型在训练过程中不会在每个步骤都获得奖励，而是通过奖励模型的评分来更新策略，这与传统的强化学习方法有所不同。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6044.17,"end":6200.4,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":6044.17,"text":"It takes way less time. And if you've used ChatGPT, you've probably been asked before to tell them which response you prefer. So once trained, the reward model replaces the human as the evaluator during reinforcement learning from human feedback. And reinforcement learning from human feedback is..."},{"start":6065.17,"text":"Very comfortable for you now. I will show you what it looks like given the Q-learning algorithm we learned. But essentially, we have first taught the model what good behavior looks like with SFT. And then we built a reward model that can tell us how good an answer is according to human preferences. And the RLHF approach is where we will let this model practice, get scored by the reward model or the critic, and update itself to produce higher."},{"start":6092.46,"text":"scoring answers, so more preferred answers. And it's the same as the games we've seen together, but some things differ. So I just pasted here the exact setup that we've learned together for reinforcement learning. The differences are the following. Our objective is still to maximize expected reward that is produced by the reward model aligned with human preferences."},{"start":6121.35,"text":"The agent is the language model being fine-tuned. The environment is the space of possible prompts and continuations. It's any text that you can encounter. The state is the specific prompt plus the tokens that were generated so far. The next state is one more token added. And the action is the next token that is chosen by the agent or the model, which is..."},{"start":6150.99,"text":"of course determined by the policy. And then the reward is estimated by the reward model that we trained to represent human preferences. In this case one episode is one full prompt."},{"start":6171.27,"text":"So imagine that you get a prompt and you start generating and you go through this reinforcement learning loop and you observe the rewards and then you try to maximize the future rewards. And then at the end of training, you end up with having your pre-trained model turn into an SFT and your SFT turn into a way better model using RLHF. Okay, so a few things to note to end on this. The model does not get a reward at..."}],"speech_gaps":[],"frame":"../frames/v062/036.webp","frame_time":6056.17},{"title":"强化学习中的奖励稀疏性与人类偏好代理","segments":[{"id":425,"text":"Every single token, it gets a reward at the end of a sequence when the completion is finished because the reward model was asked to rate prompts and responses together. So you need to finish the generation in order to see what's the reward. And so again, going back to making good sequences of decision, that's exactly it. You want the model to make enough good sequences of decision so that the response is...","zh":"每个单独的标记，在序列结束时完成生成后才会获得奖励，因为奖励模型被要求对提示和响应进行整体评分。因此，你需要完成生成才能看到奖励是什么。同样，回到生成良好的决策序列，这就是关键所在。你希望模型生成足够的良好决策序列，使得响应是……","start":6200.83,"end":6226.11},{"id":426,"text":"preferred by the critique, which represents a proxy to the human preferences. So all intermediary rewards are typically zero. And that makes it a very sparse reward episodic tasks, just like a game of chess where you only get a reward when you finish assuming you're not defining intermediary reward. So you only know if you did well at the end and you have to then use that information to update your network and get a better proxy for it.","zh":"被评论者所偏好的，这代表了人类偏好的代理。因此，所有中间奖励通常都是零。这使得任务成为一种非常稀疏奖励的回合制任务，就像国际象棋一样，你只有在完成时才会获得奖励（假设你不定义中间奖励）。因此，你只能在最后才知道自己是否表现良好，然后必须利用这些信息来更新你的网络，以获得更好的代理。","start":6226.59,"end":6256.03},{"id":427,"text":"Super. There is a very nice video. We're not going to play it for the sake of time, but I will send it online. It's from four days ago. It's, you know, former Stanford students, Andres Carpati, who is very thoughtful and articulate and was explaining four days ago why reinforcement learning can be terrible at times and that human minds work way more efficiently. And so I would encourage you to watch this four minute video because he's very clearly outlined","zh":"很好。有一个非常棒的视频。由于时间关系，我们不会播放它，但我将会把它上传到网络上。这是四天前的视频，由前斯坦福大学学生Andres Carpati制作，他非常有思想且表达清晰，四天前他解释了为什么强化学习有时表现得很糟糕，以及人类思维在效率上远远优于强化学习。因此，我鼓励你们观看这个四分钟的视频，因为他非常清晰地阐述了","start":6256.77,"end":6286.01},{"id":428,"text":"why reinforcement learning is still not great, even if it's the best thing we can use in many ways.","zh":"为什么即使强化学习在许多方面是我们能使用最好的方法，它仍然不是非常出色。","start":6286.12,"end":6291.44}],"notes":["本段讲解了强化学习中奖励稀疏性的概念，即在序列生成任务中，只有在序列完成时才会获得奖励，而中间步骤的奖励通常为零。这种设计类似于国际象棋游戏，只有在游戏结束时才会获得奖励，这使得学习过程变得困难，因为模型只能在最终结果上获得反馈。","讲者提到奖励模型被要求对提示和响应进行评分，因此需要完成生成才能看到奖励。这表明奖励模型的作用是作为人类偏好的代理，从而引导模型生成更符合人类期望的输出。","讲者指出，这种稀疏奖励机制使得任务成为一种稀疏奖励的回合制任务，模型必须依赖最终的奖励信息来更新网络，以获得更准确的偏好代理。","讲者强调，这种设计虽然在某些方面是有效的，但仍然存在局限性，因为模型只能通过最终结果来学习，而无法利用中间步骤的反馈进行优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6200.83,"end":6291.44,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":6200.83,"text":"Every single token, it gets a reward at the end of a sequence when the completion is finished because the reward model was asked to rate prompts and responses together. So you need to finish the generation in order to see what's the reward. And so again, going back to making good sequences of decision, that's exactly it. You want the model to make enough good sequences of decision so that the response is..."},{"start":6226.59,"text":"preferred by the critique, which represents a proxy to the human preferences. So all intermediary rewards are typically zero. And that makes it a very sparse reward episodic tasks, just like a game of chess where you only get a reward when you finish assuming you're not defining intermediary reward. So you only know if you did well at the end and you have to then use that information to update your network and get a better proxy for it."},{"start":6256.77,"text":"Super. There is a very nice video. We're not going to play it for the sake of time, but I will send it online. It's from four days ago. It's, you know, former Stanford students, Andres Carpati, who is very thoughtful and articulate and was explaining four days ago why reinforcement learning can be terrible at times and that human minds work way more efficiently. And so I would encourage you to watch this four minute video because he's very clearly outlined"},{"start":6286.12,"text":"why reinforcement learning is still not great, even if it's the best thing we can use in many ways."}],"speech_gaps":[],"frame":"../frames/v062/037.webp","frame_time":6212.83}],"complete":false,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v062.mp4"}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
