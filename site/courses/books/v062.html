forcement learning from human feedback that you might have heard of. It's one of the core concepts that really make the difference between what you might have remembered as GPT-2."},{"id":5,"text":"and ChatGPT. That's the leap. That's really the technique that has democratized access to LLM because of the performance improvements and the alignment with humans. So we're going to see what is this concept of our LHF and how does it work and why does it allow us to align a language model to human preferences."},{"id":6,"text":"Ready to go? As always, let's try to make it interactive. So the motivation behind deep reinforcement learning, and as usual, you're going to have all the most important papers that are covered in the class listed at the bottom of each slide. Reinforcement learning has grown in popularity. One of the very..."},{"id":7,"text":"Popular papers called Human Level Control Through Deep Reinforcement Learning is the work from DeepMind has showed us that a single algorithm slash training method can allow us to train AI that can play many, many Atari games better than humans. Single algorithm."}],"notes":["本段介绍了课程第五讲的主题是深度强化学习，并说明了课程内容的调整原因。讲者提到原本计划讨论神经网络可解释性和LLM可视化，但由于学生尚未学习注意力图、卷积神经网络等内容，因此决定将这些内容留到后续课程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1.36,"end":176.9,"asr_flags":[],"raw_segments":[{"start":1.36,"text":"Welcome to our fifth lecture in person for Stanford Deep Learning CS230. Today's lecture is going to be about deep reinforcement learning. I actually switched."},{"start":14.35,"text":"the original plan of talking about neural network interpretability and LLM visualization, simply because you haven't had the chance to study attention maps, convolutional neural networks, and so it would have been an overkill to do that week five. So we're going to talk about neural network interpretability and visualization in a later lecture, actually. But today, our focus will be on deep reinforcement learning, which is probably my favorite"},{"start":43.63,"text":"favorite lecture of the class. I feel like I say that every week, but it's okay. I like it. The agenda is pretty packed."},{"start":53.63,"text":"We're going to start with deep reinforcement learning, which you can think of as the marriage between deep learning and reinforcement learning. Together, the baby is called deep reinforcement learning. And we're going to see how reinforcement learning works and how neural networks can play a part in building reinforcement learning agents."},{"start":78.48,"text":"In the second half of the class, we will focus on a very specific concept called reinforcement learning from human feedback that you might have heard of. It's one of the core concepts that really make the difference between what you might have remembered as GPT-2."},{"start":102.39,"text":"and ChatGPT. That's the leap. That's really the technique that has democratized access to LLM because of the performance improvements and the alignment with humans. So we're going to see what is this concept of our LHF and how does it work and why does it allow us to align a language model to human preferences."},{"start":130.2,"text":"Ready to go? As always, let's try to make it interactive. So the motivation behind deep reinforcement learning, and as usual, you're going to have all the most important papers that are covered in the class listed at the bottom of each slide. Reinforcement learning has grown in popularity. One of the very..."},{"start":153.42,"text":"Popular papers called Human Level Control Through Deep Reinforcement Learning is the work from DeepMind has showed us that a single algorithm slash training method can allow us to train AI that can play many, many Atari games better than humans. Single algorithm."}],"speech_gaps":[],"frame":"../frames/v062/001.webp","frame_time":13.36},{"title":"深度强化学习的应用与挑战","segments":[{"id":8,"text":"Over 40, 50 games where it exceeds human capability, which is quite impressive when you thought about the fact that, you know, machine learning used to be niche and you would have to train a really niche algorithm to perform different tasks. Here's an algorithm that can just learn sort of every Atari game. A little later, you might have heard of AlphaGo. AlphaGo is..."},{"id":9,"text":"is an algorithm that was developed to beat and exceed human performance in the game of Go. We'll talk about it a little more. The game of Go is a very complex game. Some would argue way more complex than chess from a decision-making standpoint and from the possibilities that can happen on the board. And so it actually got solved in 2017, again, by the DeepMind team and"},{"id":10,"text":"in David Silver's lab. Later on, and again, another great paper from DeepMind had showed us that reinforcement learning can also be used for strategy game that might be a touch more complex than chess or Go that might actually involve multiple players playing with each other or against each other. Some of you might have played StarCraft, for example. That's an example of a game where..."},{"id":11,"text":"It requires a lot of long-term thinking, short-term thinking. Another one is Dota. Some of you might have played Dota or League of Legends where you have a team playing against another team. Those are examples of games that involve multiple agents playing collaboratively. And it's pretty hard to develop systems that can play with each other against multiple opponents."},{"id":12,"text":"And finally, most recently, this is 2022. So alongside the release of ChatGPT, this paper that introduces the concept of reinforcement learning with human feedback applied to aligning language models with human preferences. And we'll talk about that later. So all this to say that reinforcement learning allowed us to exceed human performance in a variety of tasks."},{"id":13,"text":"The first one I want us to think about is the game of Go. So let's say that you were asked to solve the game of Go with classic supervised learning. Okay, everything we've seen together so far, labeled data. How would you solve the game of Go with classic supervised learning? What data would you collect? What would be the label, et cetera? Yes."}],"notes":["本段讨论了使用经典监督学习解决围棋问题的挑战。讲者指出，监督学习需要标记数据，而围棋的复杂性使得收集足够的标记数据变得困难。讲者通过提问引导学生思考如何在没有足够标记数据的情况下应用监督学习来解决围棋问题。","讲者提到，监督学习需要明确的标签，而围棋的每一步决策都依赖于复杂的上下文，这使得直接应用监督学习变得不切实际。因此，监督学习在处理像围棋这样的复杂策略游戏时存在局限性。","讲者通过提问引导学生思考监督学习在围棋中的应用，例如需要收集哪些数据、如何定义标签等。这表明监督学习在处理需要长期策略和复杂决策的游戏时存在固有的限制。","讲者强调，监督学习依赖于标记数据，而围棋的每一步都可能影响后续的决策，因此无法通过简单的标签来描述游戏的正确性。这进一步说明监督学习在处理复杂策略游戏时的不足。","讲者通过提问引导学生思考监督学习在围棋中的应用，这表明监督学习在处理需要长期策略和复杂决策的游戏时存在固有的限制，而强化学习则更适合这类任务。","讲者通过提问引导学生思考监督学习在围棋中的应用，这表明监督学习在处理需要长期策略和复杂决策的游戏时存在固有的限制，而强化学习则更适合这类任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.85,"end":342.08,"asr_flags":[],"raw_segments":[{"start":177.85,"text":"Over 40, 50 games where it exceeds human capability, which is quite impressive when you thought about the fact that, you know, machine learning used to be niche and you would have to train a really niche algorithm to perform different tasks. Here's an algorithm that can just learn sort of every Atari game. A little later, you might have heard of AlphaGo. AlphaGo is..."},{"start":201.07,"text":"is an algorithm that was developed to beat and exceed human performance in the game of Go. We'll talk about it a little more. The game of Go is a very complex game. Some would argue way more complex than chess from a decision-making standpoint and from the possibilities that can happen on the board. And so it actually got solved in 2017, again, by the DeepMind team and"},{"start":230.41,"text":"in David Silver's lab. Later on, and again, another great paper from DeepMind had showed us that reinforcement learning can also be used for strategy game that might be a touch more complex than chess or Go that might actually involve multiple players playing with each other or against each other. Some of you might have played StarCraft, for example. That's an example of a game where..."},{"start":259.63,"text":"It requires a lot of long-term thinking, short-term thinking. Another one is Dota. Some of you might have played Dota or League of Legends where you have a team playing against another team. Those are examples of games that involve multiple agents playing collaboratively. And it's pretty hard to develop systems that can play with each other against multiple opponents."},{"start":280.78,"text":"And finally, most recently, this is 2022. So alongside the release of ChatGPT, this paper that introduces the concept of reinforcement learning with human feedback applied to aligning language models with human preferences. And we'll talk about that later. So all this to say that reinforcement learning allowed us to exceed human performance in a variety of tasks."},{"start":308.56,"text":"The first one I want us to think about is the game of Go. So let's say that you were asked to solve the game of Go with classic supervised learning. Okay, everything we've seen together so far, labeled data. How would you solve the game of Go with classic supervised learning? What data would you collect? What would be the label, et cetera? Yes."}],"speech_gaps":[],"frame":"../frames/v062/002.webp","frame_time":189.85},{"title":"深度强化学习中的状态空间与策略学习","segments":[{"id":14,"text":"Okay, good point. You look at history of plenty of games, hopefully from good players, which are on the game, the algorithm to work. And you look at X as the inputs being the current state of the board and Y as the next state of the board. And this would tell you what move was selected and you learn the move essentially. And hopefully if you do that across many, many games, you might see the agent become more,"},{"id":15,"text":"attuned to the game and develop better strategies. So, you know, really, hopefully it's a professional player. What are the disadvantages of that or the shortcomings that you can anticipate? Yes. Yeah, great point. You might not see the entire space of possible states of the board."},{"id":16,"text":"which is what you said so you might miss out on a lot of different strategies so the game of go is actually a game with two players one player that uses the black stones and one player that uses the white stones and iteratively they're going to place those stones"},{"id":17,"text":"on the grid a 13 by 13 grid that you can see on screen with the goal of surrounding their opponents so you're constantly trying to surround the stones of the opponent and the opponent is trying to surround your stones and so you can imagine that for every intersection on the grid there is"},{"id":18,"text":"Multiple possibilities, either there's a black stone or a white stone or nothing. And on a 13 by 13 grid, you can imagine how many possibilities of a board state there are. It's impossible to capture all of that with historical moves from professional players."},{"id":19,"text":"it will just never cover that the same thing could be said in chess as well you know that even the professional players can plan x number of steps in advance but nobody knows where the game takes you and in the late stages of the games or the end games players always find themselves playing a different game and that's part of the magic of being good at chess so yeah that's the problem what's another problem or shortcoming beyond the fact that we can't observe possibly all the states"},{"id":20,"text":"Yes. Correct. Correct. If I repeat what you said, well, first, you don't even know if this was a good move."}],"notes":["本段讨论了在深度强化学习中，使用历史数据训练智能体的局限性。教师指出，仅依赖专业玩家的历史游戏数据可能无法覆盖所有可能的状态空间，从而导致策略学习的不足。","教师以围棋为例，说明了棋盘上每个交点可能有多种状态（黑子、白子或空），13x13的棋盘状态组合数量巨大，无法通过历史数据完全覆盖。","教师进一步将讨论扩展到国际象棋，指出即使专业玩家也能提前规划几步，但游戏后期的局势变化难以预测，导致策略的不确定性。","教师强调，除了状态空间覆盖不足的问题，还存在另一个问题：无法判断某一步是否为好棋。这表明在训练过程中，仅依赖历史数据可能无法准确评估动作的价值。","教师通过围棋和国际象棋的例子，说明了强化学习中状态空间的复杂性和策略学习的挑战，强调了需要更全面的数据和方法来应对这些问题。","教师指出，专业玩家的策略虽然优秀，但并不能代表所有可能的策略，因此在训练智能体时，需要考虑更广泛的状态和动作空间。"],"formulas":[],"uncertainties":["x number of steps in advance"],"diagram":"none","start":350.0,"end":516.71,"asr_flags":[],"raw_segments":[{"start":350.0,"text":"Okay, good point. You look at history of plenty of games, hopefully from good players, which are on the game, the algorithm to work. And you look at X as the inputs being the current state of the board and Y as the next state of the board. And this would tell you what move was selected and you learn the move essentially. And hopefully if you do that across many, many games, you might see the agent become more,"},{"start":379.15,"text":"attuned to the game and develop better strategies. So, you know, really, hopefully it's a professional player. What are the disadvantages of that or the shortcomings that you can anticipate? Yes. Yeah, great point. You might not see the entire space of possible states of the board."},{"start":413.34,"text":"which is what you said so you might miss out on a lot of different strategies so the game of go is actually a game with two players one player that uses the black stones and one player that uses the white stones and iteratively they're going to place those stones"},{"start":429.26,"text":"on the grid a 13 by 13 grid that you can see on screen with the goal of surrounding their opponents so you're constantly trying to surround the stones of the opponent and the opponent is trying to surround your stones and so you can imagine that for every intersection on the grid there is"},{"start":449.45,"text":"Multiple possibilities, either there's a black stone or a white stone or nothing. And on a 13 by 13 grid, you can imagine how many possibilities of a board state there are. It's impossible to capture all of that with historical moves from professional players."},{"start":465.82,"text":"it will just never cover that the same thing could be said in chess as well you know that even the professional players can plan x number of steps in advance but nobody knows where the game takes you and in the late stages of the games or the end games players always find themselves playing a different game and that's part of the magic of being good at chess so yeah that's the problem what's another problem or shortcoming beyond the fact that we can't observe possibly all the states"},{"start":497.46,"text":"Yes. Correct. Correct. If I repeat what you said, well, first, you don't even know if this was a good move."}],"speech_gaps":[],"frame":"../frames/v062/003.webp","frame_time":362.0},{"title":"深度强化学习的应用与挑战","segments":[{"id":21,"text":"So maybe it was not even a good move and you're learning something that was not a good move and you're labeling it as a good move. And second, you're actually only getting partial information, meaning you don't have the information of what's in the person's mind and what strategy they're trying to execute. So you're sort of looking at a single example among long-term strategy and you can't expect the model to guess what's the long-term strategy because it was just trained on X and Y and matching the inputs to a possible output."},{"id":22,"text":"So you don't really have any concept of a strategy at that point. It looks one-off at every decision of the model. Okay, those are really good points. The other one is the ground truth might be ill-defined. What I mean by that is even the best humans in the world do not play their best game every day. And even their best game is not the ground truth."},{"id":23,"text":"And that creates an issue because you're essentially training against a target that is off by a certain margin. You're never going to get better than the best human. And the best human is not the best possible, existing the best possible strategy at every point. So you could argue, what if we get a panel of experts that we're monitoring? And those are the best players in the world. Even with a panel of experts that decides every move, you still have an ill-defined ground truth."},{"id":24,"text":"So that's a big issue. Too many states in the game you mentioned, and we will likely not generalize, which is what you said, meaning we're looking at one-off situations. We're not looking at entire strategies. And so when we face a board state that we've never seen before, because the model was not trained on strategy, it sort of will get stuck."},{"id":25,"text":"Okay, and this is an example of a perfect application for reinforcement learning because reinforcement learning is all about delayed labels and making sequences of good decisions. So if you had to remember in one sentence what's RL, RL is making good sequences of decisions. Sequences of good decisions, sorry. And do that automatically."},{"id":26,"text":"Another way to look at it is the difference between classic supervised learning and RL. In classic supervised learning, you teach by example. In reinforcement learning, you teach by experience, which is also a different concept. You're not just showing cats and non-cats to a model. You're actually letting the model experience an environment until it figures out what were the best decisions it made and learns from them."}],"notes":["本段讨论了监督学习在某些场景下的局限性，特别是当模型无法理解长期策略时的问题。讲者指出，监督学习仅基于输入和输出的配对进行训练，无法捕捉策略的全局性，导致模型在面对新状态时可能无法做出正确决策。","讲者进一步指出，即使是最优秀的专家也可能无法提供明确的‘地面真实’（ground truth），因为他们的表现并非总是最佳。这使得训练目标存在偏差，模型无法超越人类的表现。","讲者提到，即使引入专家小组来决定每一步，也无法完全定义‘地面真实’，因为专家的决策也可能存在不确定性。这表明在某些任务中，‘地面真实’本身可能是模糊的。","讲者强调，当游戏状态过多时，模型难以泛化，因为它只学习了单个例子，而非整体策略。这导致模型在面对未见过的状态时可能陷入困境。","讲者指出，强化学习（RL）适用于这种场景，因为它关注的是延迟标签和序列决策。RL的核心是让模型通过经验学习，而不是直接提供输入-输出对。","最后，讲者对比了监督学习和强化学习的差异，指出监督学习是通过示例教学，而强化学习是通过经验教学。模型在强化学习中会经历环境，从而学习最佳决策。"],"formulas":[],"uncertainties":[],"diagram":"none","start":517.15,"end":690.55,"asr_flags":[],"raw_segments":[{"start":517.15,"text":"So maybe it was not even a good move and you're learning something that was not a good move and you're labeling it as a good move. And second, you're actually only getting partial information, meaning you don't have the information of what's in the person's mind and what strategy they're trying to execute. So you're sort of looking at a single example among long-term strategy and you can't expect the model to guess what's the long-term strategy because it was just trained on X and Y and matching the inputs to"},{"start":546.44,"text":"a possible output. So you don't really have any concept of a strategy at that point. It looks one-off at every decision of the model. Okay, those are really good points. The other one is the ground truth might be ill-defined. What I mean by that is even the best humans in the world do not play their best game every day. And even their best game is not the ground truth."},{"start":575.7,"text":"And that creates an issue because you're essentially training against a target that is off by a certain margin. You're never going to get better than the best human. And the best human is not the best possible, existing the best possible strategy at every point. So you could argue, what if we get a panel of experts that we're monitoring? And those are the best players in the world. Even with a panel of experts that decides every move, you still have an ill-defined ground truth."},{"start":606.0,"text":"So that's a big issue. Too many states in the game you mentioned, and we will likely not generalize, which is what you said, meaning we're looking at one-off situations. We're not looking at entire strategies. And so when we face a board state that we've never seen before, because the model was not trained on strategy, it sort of will get stuck."},{"start":627.27,"text":"Okay, and this is an example of a perfect application for reinforcement learning because reinforcement learning is all about delayed labels and making sequences of good decisions. So if you had to remember in one sentence what's RL, RL is making good sequences of decisions. Sequences of good decisions, sorry. And do that automatically."},{"start":661.81,"text":"Another way to look at it is the difference between classic supervised learning and RL. In classic supervised learning, you teach by example. In reinforcement learning, you teach by experience, which is also a different concept. You're not just showing cats and non-cats to a model. You're actually letting the model experience an environment until it figures out what were the best decisions it made and learns from them."}],"speech_gaps":[],"frame":"../frames/v062/004.webp","frame_time":529.15},{"title":"强化学习的应用与基本概念","segments":[{"id":27,"text":"Some examples of reinforcement learning applications. I'm going to mention them. We have gaming, of course, that we already covered. What are other applications of AI where we need good sequences of decisions? Yes."},{"id":28,"text":"Autonomous driving? Yeah, correct. I mean, in driving, you could argue RL could work and there's some RL going on. But what you mean, I think, is you have some sort of a dynamic planning algorithm that allows you to strategize. If you see a red light ahead, you might start slowing down over time. But maybe it will turn green, so you might not slow down completely. This is an example of a strategy that you need, of course. Yeah."},{"id":29,"text":"robotic controlling that's a great example also related to autonomous driving but imagine you want to teach to a robot to move from point a to point b the number of good decisions that the robot needs to make in terms of moving each of their joints is tremendous like it's actually super unlikely that a robot would move from a to b if it's not trained to make good sequences of decisions what else actually the biggest one nobody mentioned"},{"id":30,"text":"Yeah. It's not a great application. I don't like it, but it happens to be the biggest one over enforcement learning. Yeah. Yeah. Yeah. Advertisement. Yeah. Marketing. You're right. So yeah, we talked about robotics. Advertisement is another example. Advertisement is a long game. Like companies are showing you multiple ads before you buy. And in fact, the reason reinforcement learning is important is because"},{"id":31,"text":"They're planning a strategy that might lead a buyer to execute a purchase over time, and it requires long-term thinking. So there's a lot of reinforcement learning applied to marketing, advertisement, real-time bidding processes, etc. Okay, clear on what RLE is and how it differs from classic supervised learning?"},{"id":32,"text":"So let's put some vocabulary around that concept. In reinforcement learning, you have an agent and the agent interacts with an environment. As the agent interacts with the environment, the agent will perform certain actions that we will denote A, T, where T is a time step. And the environment will show you states."}],"notes":["本段讨论了强化学习（RL）在多个领域的应用，包括自动驾驶、机器人控制、广告和市场营销。教师指出，自动驾驶需要动态规划算法来制定策略，例如在遇到红灯时逐步减速，同时考虑可能变绿的情况。机器人控制也是一个重要应用，因为机器人从一点移动到另一点需要做出大量决策。广告和市场营销被提及为长期策略的应用，公司通过多次广告展示来引导消费者购买，这需要强化学习的长期思维能力。","教师进一步解释了强化学习的基本概念，包括智能体（agent）与环境（environment）的交互。智能体在每个时间步（T）执行动作（A），环境则返回状态（state）。这一部分为后续讲解强化学习的框架和机制奠定了基础。","在讨论广告和市场营销时，教师强调了强化学习在长期策略规划中的重要性，例如在实时竞价（real-time bidding）过程中，系统需要根据用户行为和广告效果进行动态调整，以最大化广告效果。这体现了强化学习在实际应用中的灵活性和适应性。","教师通过提问确认学生是否理解强化学习（RLE）与传统监督学习的区别，这表明课程注重概念理解与实际应用的结合。通过这种方式，教师引导学生思考强化学习的核心思想，即通过与环境的交互来学习最优策略。","在讲解强化学习的基本框架时，教师使用了术语如智能体、环境、时间步和动作，这些术语是理解强化学习的基础。通过明确这些概念，教师帮助学生构建了强化学习的理论框架。","教师在讲解过程中强调了强化学习与监督学习的根本区别，即强化学习依赖于与环境的交互和奖励信号，而监督学习依赖于标注数据。这种对比有助于学生理解两种学习范式的不同应用场景和优势。"],"formulas":[],"uncertainties":["over enforcement learning"],"diagram":"none","start":693.35,"end":861.82,"asr_flags":[],"raw_segments":[{"start":693.35,"text":"Some examples of reinforcement learning applications. I'm going to mention them. We have gaming, of course, that we already covered. What are other applications of AI where we need good sequences of decisions? Yes."},{"start":711.33,"text":"Autonomous driving? Yeah, correct. I mean, in driving, you could argue RL could work and there's some RL going on. But what you mean, I think, is you have some sort of a dynamic planning algorithm that allows you to strategize. If you see a red light ahead, you might start slowing down over time. But maybe it will turn green, so you might not slow down completely. This is an example of a strategy that you need, of course. Yeah."},{"start":740.04,"text":"robotic controlling that's a great example also related to autonomous driving but imagine you want to teach to a robot to move from point a to point b the number of good decisions that the robot needs to make in terms of moving each of their joints is tremendous like it's actually super unlikely that a robot would move from a to b if it's not trained to make good sequences of decisions what else actually the biggest one nobody mentioned"},{"start":775.16,"text":"Yeah. It's not a great application. I don't like it, but it happens to be the biggest one over enforcement learning. Yeah. Yeah. Yeah. Advertisement. Yeah. Marketing. You're right. So yeah, we talked about robotics. Advertisement is another example. Advertisement is a long game. Like companies are showing you multiple ads before you buy. And in fact, the reason reinforcement learning is important is because"},{"start":810.28,"text":"They're planning a strategy that might lead a buyer to execute a purchase over time, and it requires long-term thinking. So there's a lot of reinforcement learning applied to marketing, advertisement, real-time bidding processes, etc. Okay, clear on what RLE is and how it differs from classic supervised learning?"},{"start":835.02,"text":"So let's put some vocabulary around that concept. In reinforcement learning, you have an agent and the agent interacts with an environment. As the agent interacts with the environment, the agent will perform certain actions that we will denote A, T, where T is a time step. And the environment will show you states."}],"speech_gaps":[],"frame":"../frames/v062/005.webp","frame_time":705.35},{"title":"状态、观察与转移的概念","segments":[{"id":33,"text":"that transition from timestep T to timestep T plus one. So subject to an action AT, an environment may transition from ST to ST plus one. You can think of the game of Go. I take the action of putting my blackstone on a certain grid intersection and the environment has changed. The state has changed. It moved from state timestep T to timestep T plus one where my stone is on the grid."},{"id":34,"text":"After that state update happens, there's two things that the agent observes. The agent observes an observation that we will note OT and a reward, RT. So those are the vocabulary words. And of course, the goal of the agent will be to maximize the rewards. One thing to know about the observation, we'll talk about it a little more. The observation sometimes is equal to the state."},{"id":35,"text":"Can someone guess why we might need two concepts instead of a single concept? Why is it important to have a state and an observation? Yes."},{"id":36,"text":"Yes, correct. So in some cases, the environment may not be fully transparent to the user. And so, for example, in chess or in Go, the observation is actually equal to the state. You see everything on your board. All the information is available to you. If you play League of Legends or Starcraft."},{"id":37,"text":"You know the concept of, I think in English it's called like a cloud or a fog. I think it's a fog. You only see certain parts of the map until you have explored everything or until your friends are sort of visiting the other parts of the map. And so the observation is actually less information than the states of the environment."},{"id":38,"text":"Okay, and then the last piece of vocabulary is a transition. When I refer to a transition, I refer of the process of getting from state T to state T plus one, which means we're in state T, the agent takes an action AT, it observes OT and a reward RT, and it transitions to the next state as T plus one. Question?"},{"id":39,"text":"uh wait what do you mean you mean is there are there examples of uh environment where the state is so large that yeah possibly for computational reasons yeah yeah you might have games i mean look at open world games"}],"notes":["本段讲授了状态（state）和观察（observation）之间的区别，指出在某些环境中，观察可能不等于状态，因为环境可能不完全透明。例如，在《英雄联盟》或《星际争霸》中，玩家只能看到部分地图信息，而状态则包含所有环境信息。","讲者提到，状态转移（transition）是指从状态T到状态T+1的过程，其中代理执行动作AT，观察到OT和奖励RT，然后转移到下一个状态。这为后续强化学习中的动态建模奠定了基础。","讲者通过提问引导学生思考为何需要区分状态和观察，强调了在部分可观测环境中，观察信息可能不完整，这在实际应用中非常重要。","讲者提到，状态可能非常庞大，因此在计算上可能需要进行简化或近似，例如在开放世界游戏中，状态空间可能过于庞大，导致计算复杂度增加。","讲者通过举例说明了状态和观察的不同，如围棋中观察等于状态，而《星际争霸》中观察不等于状态，这有助于学生理解不同环境下的信息透明度差异。","讲者最后提到，状态转移是强化学习中的核心概念，理解状态转移过程对于建模环境动态至关重要。"],"formulas":[],"uncertainties":["uh wait what do you mean you mean is there are there examples of uh environment where the state is so large that yeah possibly for computational reasons yeah yeah you might have games i mean look at open world games"],"diagram":"none","start":862.71,"end":1031.34,"asr_flags":[],"raw_segments":[{"start":862.71,"text":"that transition from timestep T to timestep T plus one. So subject to an action AT, an environment may transition from ST to ST plus one. You can think of the game of Go. I take the action of putting my blackstone on a certain grid intersection and the environment has changed. The state has changed. It moved from state timestep T to timestep T plus one where my stone is on the grid."},{"start":888.41,"text":"After that state update happens, there's two things that the agent observes. The agent observes an observation that we will note OT and a reward, RT. So those are the vocabulary words. And of course, the goal of the agent will be to maximize the rewards. One thing to know about the observation, we'll talk about it a little more. The observation sometimes is equal to the state."},{"start":921.76,"text":"Can someone guess why we might need two concepts instead of a single concept? Why is it important to have a state and an observation? Yes."},{"start":937.58,"text":"Yes, correct. So in some cases, the environment may not be fully transparent to the user. And so, for example, in chess or in Go, the observation is actually equal to the state. You see everything on your board. All the information is available to you. If you play League of Legends or Starcraft."},{"start":959.93,"text":"You know the concept of, I think in English it's called like a cloud or a fog. I think it's a fog. You only see certain parts of the map until you have explored everything or until your friends are sort of visiting the other parts of the map. And so the observation is actually less information than the states of the environment."},{"start":981.12,"text":"Okay, and then the last piece of vocabulary is a transition. When I refer to a transition, I refer of the process of getting from state T to state T plus one, which means we're in state T, the agent takes an action AT, it observes OT and a reward RT, and it transitions to the next state as T plus one. Question?"},{"start":1011.5,"text":"uh wait what do you mean you mean is there are there examples of uh environment where the state is so large that yeah possibly for computational reasons yeah yeah you might have games i mean look at open world games"}],"speech_gaps":[],"frame":"../frames/v062/006.webp","frame_time":874.71},{"title":"强化学习中的环境与奖励设计","segments":[{"id":40,"text":"Like, truly, you could argue, I don't know, there are some games where you might press start and you see the entire environment. But who cares of what's happening 20,000 kilometers west of you if you're in a certain location? That might not influence your strategy. So you might actually put some sort of a, you know, trust circle or like some sort of a circle in which you observe, which you think has 99% of the information you need, possibly for computational reasons. That's a good point."},{"id":41,"text":"Okay, let's get to a practical example of a reinforcement learning algorithm and develop it together. This example is called recycling is good because recycling is good, but also because it's a simple example illustrative of reinforcement learning. So let's say we have a small environment with five states. There is a starting state marked in brown, which is state two. It's our initial state."},{"id":42,"text":"And then on the left side, you have state one, which is garbage. And it's great to get to the garbage because you're going to be able to put in the garbage the stuff that you have in your hands. You're trying to throw away some garbage and the garbage kind of happens to be there. And so we would expect..."},{"id":43,"text":"there to be a reward on the other side if you actually go to the right you might pass by state three which is empty you might pass by state four where there is a chocolate packaging that is left on the ground that you can pick up and it's good to pick it up and then on stage five state five you have the recycled bean which is more valuable than the garbage can because you can recycle and you should get better rewards for that"},{"id":44,"text":"So that's our game. In this game, we define a reward that is associated with the type of behaviors that we want the agents to learn. And the reward is as follows. That's just one example. Plus two for throwing your garbage in the normal can. Plus one for picking up the chocolate packaging. And plus 10 if you manage to make it to the recycle bin. Is it clear?"},{"id":45,"text":"Now, the goal will be, and that's the case in reinforcement learning oftentimes, to maximize the return. We define formally the return, but think about it as maximize the amount of rewards that you get as you go through this journey and you make your decisions. In this specific game, we have five states and there's three types of state."}],"notes":["本段讲解了强化学习中环境设计的基本概念，包括状态划分和奖励机制。讲者提到一个包含五个状态的简单环境，其中状态二为初始状态，状态一为垃圾，状态三为空，状态四为巧克力包装，状态五为可回收物。讲者强调了不同状态的奖励值，如将垃圾投入普通垃圾桶获得+2奖励，捡起巧克力包装获得+1奖励，到达可回收物桶获得+10奖励。","讲者通过这个例子说明了强化学习中奖励函数的设计原则，即奖励应与期望的行为相匹配。例如，将垃圾投入普通垃圾桶的行为被赋予正奖励，而捡起巧克力包装和到达可回收物桶则分别赋予不同的奖励值，以引导智能体学习最优策略。","讲者指出，奖励函数的设计是强化学习中的关键部分，因为它直接影响智能体的学习目标。在本例中，奖励函数的设计旨在鼓励智能体完成特定任务，如回收垃圾，从而获得更高的累积奖励。","讲者提到，这个例子虽然简单，但能够很好地说明强化学习的基本原理，即通过奖励机制引导智能体学习如何在环境中做出最优决策。这种设计方法适用于更复杂的实际问题。","讲者还强调了奖励函数的可扩展性，即该设计可以应用于更复杂的环境，只需调整状态和奖励值即可。这种灵活性是强化学习方法的一个重要优势。","最后，讲者通过提问确认学生是否理解奖励函数的设计，这表明在教学过程中注重互动和反馈，以确保学生能够掌握核心概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1031.99,"end":1190.09,"asr_flags":[],"raw_segments":[{"start":1031.99,"text":"Like, truly, you could argue, I don't know, there are some games where you might press start and you see the entire environment. But who cares of what's happening 20,000 kilometers west of you if you're in a certain location? That might not influence your strategy. So you might actually put some sort of a, you know, trust circle or like some sort of a circle in which you observe, which you think has 99% of the information you need, possibly for computational reasons. That's a good point."},{"start":1061.73,"text":"Okay, let's get to a practical example of a reinforcement learning algorithm and develop it together. This example is called recycling is good because recycling is good, but also because it's a simple example illustrative of reinforcement learning. So let's say we have a small environment with five states. There is a starting state marked in brown, which is state two. It's our initial state."},{"start":1092.07,"text":"And then on the left side, you have state one, which is garbage. And it's great to get to the garbage because you're going to be able to put in the garbage the stuff that you have in your hands. You're trying to throw away some garbage and the garbage kind of happens to be there. And so we would expect..."},{"start":1115.12,"text":"there to be a reward on the other side if you actually go to the right you might pass by state three which is empty you might pass by state four where there is a chocolate packaging that is left on the ground that you can pick up and it's good to pick it up and then on stage five state five you have the recycled bean which is more valuable than the garbage can because you can recycle and you should get better rewards for that"},{"start":1142.54,"text":"So that's our game. In this game, we define a reward that is associated with the type of behaviors that we want the agents to learn. And the reward is as follows. That's just one example. Plus two for throwing your garbage in the normal can. Plus one for picking up the chocolate packaging. And plus 10 if you manage to make it to the recycle bin. Is it clear?"},{"start":1168.0,"text":"Now, the goal will be, and that's the case in reinforcement learning oftentimes, to maximize the return. We define formally the return, but think about it as maximize the amount of rewards that you get as you go through this journey and you make your decisions. In this specific game, we have five states and there's three types of state."}],"speech_gaps":[],"frame":"../frames/v062/007.webp","frame_time":1043.99},{"title":"强化学习中的奖励与折扣","segments":[{"id":46,"text":"initial states, we have normal states, and we have in blue terminal states. When you get to a terminal state in reinforcement learning, it will typically end the game. It will end one episode of the game. We'll move to another episode, you'll get back to the starting state or initial state, and you'll redo another episode. The possible actions for our agent here are going to be fairly simple, left and right."},{"id":47,"text":"And we're going to add an additional rule that is important, which is that the garbage collector comes in three minutes, and it takes a minute to get from one state to the other."},{"id":48,"text":"Yeah. Otherwise, you just go back and forth between stage three and stage four. You just collect a bunch of chocolate packaging and you never make it to the bin. And so it's not what we want. OK, so how do we define the long term return? The long term return is going to be defined as capital R, which is the sum of rewards."},{"id":49,"text":"With a discount. Discount is a very important concept in reinforcement learning. It's also a very natural concept to think about. Can you think of what the discount would represent for humans? Do you have an example of what it could be?"},{"id":50,"text":"Yeah, the value of money and time. Exactly. Or the energy that a robot might have. Things like that. Yeah. You would rather get a dollar now than a dollar in 10 years knowing that there is some inflation, for example. That's the example of a discount. In reinforcement learning, it's the same. Let's say you have a strategy that takes so much time. You need to discount it because your robot might lose energy as it's going through it, for example. Discounts can vary."},{"id":51,"text":"But they stay between zero and one. So what is the best strategy to follow if gamma, the discount, is equal to one, meaning time doesn't matter here if it's longer or shorter. Just want to maximize the return. Best strategy to follow. You want to give it a try? Someone who hasn't spoken yet? Yes. Bounce around, but remember the rule of three minutes."}],"notes":["本段讲解了强化学习中奖励的长期回报定义，强调了折扣因子（gamma）的重要性。折扣因子用于衡量未来奖励的价值，其值通常介于0和1之间，表示时间对奖励价值的影响。","课堂中提到，折扣因子可以类比为人类对金钱和时间价值的认知，例如人们更倾向于现在获得一美元而不是十年后获得一美元，因为存在通货膨胀等因素。同样，在强化学习中，折扣因子用于考虑策略执行过程中可能的资源损耗，如机器人能量的消耗。","当折扣因子gamma等于1时，表示时间对奖励价值没有影响，此时策略的目标是最大化总奖励。课堂中通过提问引导学生思考，如何在没有时间折扣的情况下制定最佳策略。","课堂中还提到，垃圾收集器的规则（三分钟到达）和状态转移时间（一分钟）是游戏设计中的关键因素，它们影响了策略的制定和奖励的计算。","课堂通过提问和举例，帮助学生理解折扣因子的实际意义，并引导他们思考如何在不同折扣因子下制定最优策略。","课堂中强调了折扣因子的取值范围（0到1），并指出其在强化学习中的核心作用，即平衡当前和未来奖励的价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1191.4,"end":1366.36,"asr_flags":[],"math_clarifications":["原文未提供完整的数学公式，仅描述了概念。长期回报应定义为带有折扣因子的奖励总和，即 $ R = \\sum_{t=0}^{\\infty} \\gamma^t r_t $，其中 $ \\gamma $ 是折扣因子，且 $ 0 \u003c \\gamma \u003c 1 $。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1191.4,"text":"initial states, we have normal states, and we have in blue terminal states. When you get to a terminal state in reinforcement learning, it will typically end the game. It will end one episode of the game. We'll move to another episode, you'll get back to the starting state or initial state, and you'll redo another episode. The possible actions for our agent here are going to be fairly simple, left and right."},{"start":1221.07,"text":"And we're going to add an additional rule that is important, which is that the garbage collector comes in three minutes, and it takes a minute to get from one state to the other. Why is that an important rule to add to the game? Can you guess? Yeah?"},{"start":1243.21,"text":"Yeah. Otherwise, you just go back and forth between stage three and stage four. You just collect a bunch of chocolate packaging and you never make it to the bin. And so it's not what we want. OK, so how do we define the long term return? The long term return is going to be defined as capital R, which is the sum of rewards."},{"start":1268.42,"text":"With a discount. Discount is a very important concept in reinforcement learning. It's also a very natural concept to think about. Can you think of what the discount would represent for humans? Do you have an example of what it could be?"},{"start":1289.16,"text":"Yeah, the value of money and time. Exactly. Or the energy that a robot might have. Things like that. Yeah. You would rather get a dollar now than a dollar in 10 years knowing that there is some inflation, for example. That's the example of a discount. In reinforcement learning, it's the same. Let's say you have a strategy that takes so much time. You need to discount it because your robot might lose energy as it's going through it, for example. Discounts can vary."},{"start":1317.07,"text":"But they stay between zero and one. So what is the best strategy to follow if gamma, the discount, is equal to one, meaning time doesn't matter here if it's longer or shorter. Just want to maximize the return. Best strategy to follow. You want to give it a try? Someone who hasn't spoken yet? Yes. Bounce around, but remember the rule of three minutes."}],"speech_gaps":[],"frame":"../frames/v062/008.webp","frame_time":1203.4},{"title":"强化学习中的策略与Q表","segments":[{"id":52,"text":"You can't bounce around because you will not get to the terminal state before the time allotted is done. But that would be a good idea if this rule was not true. What else could you do? Any idea? It's an easy one, no? Not too hard. Best strategy for gamma equals one. And give me also the maximum reward you would get. People are sleepy today, yeah? Go to the recycle, so write, write."},{"id":53,"text":"Right. Yeah, that's right. Thank you. Right, right, right. And then what's your total reward? Yeah, that's right. 11. So that's where we get terminal state and we grab our reward of 11. Very good. Now, assuming 0.9 for gamma, we're going to complexify things a little bit. I'm going to walk you through a very simple algorithm that..."},{"id":54,"text":"you know, allows us to sort of determine the best strategy and we will put our numbers in a matrix. So for instance, we'll define a Q table."},{"id":55,"text":"And Q stands, you know, it's a value function where the name Q learning, Q star, you might have heard all of these things come from Q learning. And so let's say we have a Q table, which has the size of number of states times number of actions. So five rows, two columns in our case. Every entry of the Q table."},{"id":56,"text":"is essentially representing how good it is to take action A in state B. Do you agree that if we had a table with these numbers, essentially we solved the problem? Meaning at any point, the agent can just look in the table, I am in state 3, let's look at column 1, that would tell me the value of action 1, and let's look at column 2, it would tell me the value of action 2. So I have everything I need to make my decisions."},{"id":57,"text":"So that table is really the thing you want to find in this exercise. Now, the way we will find the table is sort of using a backtracking algorithm where we might actually codify the environment as a tree and traverse the tree. So here's what it looks like. I start in S2 and I have two options ahead of me. I can go to the left where I will get a reward of two. It's an immediate reward. The immediate reward is not discounted."}],"notes":["本段讲授了强化学习中策略选择与奖励计算的基本概念。讲者指出，当gamma等于1时，最优策略是直接到达终端状态以获得最大奖励，例如在例子中获得11的奖励。同时，讲者提到当gamma为0.9时，问题会变得更加复杂，需要引入更复杂的算法。","讲者介绍了Q学习的基本概念，即Q表作为价值函数的表示方式。Q表的大小由状态数和动作数决定，每个单元格表示在特定状态下采取特定动作的价值。讲者强调，如果拥有完整的Q表，智能体可以在任何时刻根据当前状态和动作选择最优策略。","讲者进一步说明了如何通过回溯算法来构建Q表，即将环境建模为树结构并进行遍历。在例子中，智能体从状态S2出发，有两个选择，其中向左移动会立即获得奖励2，且该奖励未被折扣。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1367.47,"end":1542.09,"asr_flags":[],"raw_segments":[{"start":1367.47,"text":"You can't bounce around because you will not get to the terminal state before the time allotted is done. But that would be a good idea if this rule was not true. What else could you do? Any idea? It's an easy one, no? Not too hard. Best strategy for gamma equals one. And give me also the maximum reward you would get. People are sleepy today, yeah? Go to the recycle, so write, write."},{"start":1413.14,"text":"Right. Yeah, that's right. Thank you. Right, right, right. And then what's your total reward? Yeah, that's right. 11. So that's where we get terminal state and we grab our reward of 11. Very good. Now, assuming 0.9 for gamma, we're going to complexify things a little bit. I'm going to walk you through a very simple algorithm that..."},{"start":1442.85,"text":"you know, allows us to sort of determine the best strategy and we will put our numbers in a matrix. So for instance, we'll define a Q table."},{"start":1453.54,"text":"And Q stands, you know, it's a value function where the name Q learning, Q star, you might have heard all of these things come from Q learning. And so let's say we have a Q table, which has the size of number of states times number of actions. So five rows, two columns in our case. Every entry of the Q table."},{"start":1482.06,"text":"is essentially representing how good it is to take action A in state B. Do you agree that if we had a table with these numbers, essentially we solved the problem? Meaning at any point, the agent can just look in the table, I am in state 3, let's look at column 1, that would tell me the value of action 1, and let's look at column 2, it would tell me the value of action 2. So I have everything I need to make my decisions."},{"start":1514.09,"text":"So that table is really the thing you want to find in this exercise. Now, the way we will find the table is sort of using a backtracking algorithm where we might actually codify the environment as a tree and traverse the tree. So here's what it looks like. I start in S2 and I have two options ahead of me. I can go to the left where I will get a reward of two. It's an immediate reward. The immediate reward is not discounted."}],"speech_gaps":[],"frame":"../frames/v062/009.webp","frame_time":1379.47},{"title":"即时奖励与折扣回报的计算","segments":[{"id":58,"text":"It's an immediate reward. Remember the formula for R. The immediate reward, R0, is not discounted. That would take me to S1. It's a terminal state, so there's nothing to do after."},{"id":59,"text":"Second option, I go to the right and I get a reward of 0. That's my immediate reward and I end up in state 3. State 3 is not a terminal state, so I can go and do the same exercise from state 3. In state 3, I have two options. I can go to the left where I would see a reward of 0 and I will end up in S2. Or I will go to the right and I will get an immediate reward of plus 1."},{"id":60,"text":"It's an immediate reward. We're not discounting it. I will end up in S4. And from S4, again, I have two options. Back to the left to S3 with zero reward or to the right with the amazing reward of plus 10 and the terminal state of S5. So that's my map of immediate rewards."},{"id":61,"text":"That's not my discounted return. So what we're going to do now is we're going to backtrack up the tree in order to compute the discounted returns. Actually, if I'm in S3 right here, I see that I can get an immediate reward in S4 of plus one. And I want to compute my maximum return that I can get from when I'm in S3. My maximum return is that in S4, I could get a plus 10."},{"id":62,"text":"Right? But I need to discount that. My discount is 0.9, so I multiply 10 by 0.9. What it tells me is that from S4, I can expect 9. Plus 1, which I get as an immediate reward from moving from S3 to S4, I can update this number to 10. Meaning from S3, the best you can hope for is a discounted return of 10, which is 1 plus 0.9 times 10. Everyone follows?"},{"id":63,"text":"Now let's do the same exercise one step before in S2. In S2, I have an immediate reward of zero for going to S3 or an immediate reward of two for going to S1. S1 is not going to be worth it. We already know that because when I'm in S3, I can actually expect 10, which I have to discount."},{"id":64,"text":"0.9910 gives me 9, plus 0 immediate reward from S2 to S3. That tells me that the discounted return from state 2, which is our initial state, is 9. Go follow. Just a simple backtracking."}],"notes":["本段讲解了在强化学习中如何计算折扣回报。首先，讲者指出在状态S3中，可以得到一个即时奖励为1的回报，并且从S4可以得到一个即时奖励为10的回报。由于折扣因子为0.9，因此从S4得到的回报需要乘以0.9，得到9。加上从S3到S4的即时奖励1，总回报为10。这说明从S3出发，最佳的折扣回报为10。","接着，讲者将计算过程向前推进一步，到状态S2。在S2中，有两种选择：前往S3得到即时奖励0，或者前往S1得到即时奖励2。但S1的回报不如S3，因为从S3可以得到更高的折扣回报。因此，从S2出发，最佳的折扣回报为9，即0.9乘以10（来自S3的回报）。","最后，讲者提到从S2出发的折扣回报为9，并指出这是一个简单的回溯过程。这说明在强化学习中，计算折扣回报需要从终端状态开始，逐步回溯到初始状态，将每个状态的即时奖励与折扣因子相乘，累加得到总回报。","讲者强调了折扣因子的作用，即它决定了未来奖励的重要性。折扣因子越小，未来奖励的权重越低，因此在计算回报时，需要将未来的奖励乘以折扣因子的幂次。"],"formulas":[],"uncertainties":["0.9910"],"diagram":"none","start":1542.65,"end":1709.25,"asr_flags":[],"raw_segments":[{"start":1542.65,"text":"It's an immediate reward. Remember the formula for R. The immediate reward, R0, is not discounted. That would take me to S1. It's a terminal state, so there's nothing to do after."},{"start":1558.23,"text":"Second option, I go to the right and I get a reward of 0. That's my immediate reward and I end up in state 3. State 3 is not a terminal state, so I can go and do the same exercise from state 3. In state 3, I have two options. I can go to the left where I would see a reward of 0 and I will end up in S2. Or I will go to the right and I will get an immediate reward of plus 1."},{"start":1583.74,"text":"It's an immediate reward. We're not discounting it. I will end up in S4. And from S4, again, I have two options. Back to the left to S3 with zero reward or to the right with the amazing reward of plus 10 and the terminal state of S5. So that's my map of immediate rewards."},{"start":1605.37,"text":"That's not my discounted return. So what we're going to do now is we're going to backtrack up the tree in order to compute the discounted returns. Actually, if I'm in S3 right here, I see that I can get an immediate reward in S4 of plus one. And I want to compute my maximum return that I can get from when I'm in S3. My maximum return is that in S4, I could get a plus 10."},{"start":1634.93,"text":"Right? But I need to discount that. My discount is 0.9, so I multiply 10 by 0.9. What it tells me is that from S4, I can expect 9. Plus 1, which I get as an immediate reward from moving from S3 to S4, I can update this number to 10. Meaning from S3, the best you can hope for is a discounted return of 10, which is 1 plus 0.9 times 10. Everyone follows?"},{"start":1664.43,"text":"Now let's do the same exercise one step before in S2. In S2, I have an immediate reward of zero for going to S3 or an immediate reward of two for going to S1. S1 is not going to be worth it. We already know that because when I'm in S3, I can actually expect 10, which I have to discount."},{"start":1692.48,"text":"0.9910 gives me 9, plus 0 immediate reward from S2 to S3. That tells me that the discounted return from state 2, which is our initial state, is 9. Go follow. Just a simple backtracking."}],"speech_gaps":[],"frame":"../frames/v062/010.webp","frame_time":1554.65},{"title":"队列表与贝尔曼最优方程","segments":[{"id":65,"text":"Now I can copy back this. So S3, I know that when I'm in S3, I can expect zero immediate reward to... Sorry, if I'm in S2, I can expect zero immediate reward plus a discount times the plus nine that I could expect in S3. And so that gives me values that should cover everything that we have in this..."},{"id":66,"text":"queue table. So I do that backtracking. I copy paste all of that into my queue table all the way up here. And this is what I get. We essentially finish the game at this point. We can look at a certain row. So let's say I'm in state number three. I look on the third row of that queue table and I see that I have two options. If I go back to S2,"},{"id":67,"text":"Ultimately, my discounted return will be 8.1, right? If I actually go to S4 on the right, I will get 10 because I will get 1 plus 0.9 times 10, which is 10."},{"id":68,"text":"So this is a toy example, but it tells you that if you were able to backtrack through the entire environment, you will be able to build a massive queue table and you will be able to give it to your agent to make its decisions. Yeah. Sorry, can you repeat?"},{"id":69,"text":"Yeah, here I'm simplifying. I'm not considering the time remaining. But in practice, if I remove the time component, so I remove the fact that there's a three-minute deadline before the garbage collector comes, then this would be slightly more difficult because you would have to do a time series, essentially, of adding the discount times the reward that you collect. Yeah, but I'm simplifying here. And that's why I use the three-minute rule. Any question on the queue table?"},{"id":70,"text":"Super. OK, so this was the Q table. And in fact, we can put together our strategy for gamma equals 0.9. The best strategy is still the same. You go to the right and you can expect a return of nine. Now, one of the most important concepts in reinforcement learning is this equation on the board called the Bellman optimality equation."}],"notes":["本段讲解了如何通过回溯法构建队列表（queue table），并展示了如何计算折扣回报。在S2状态下，预期的折扣回报是0加上折扣因子乘以S3的回报，从而得到S2的值。这种回溯方法可以覆盖整个环境的所有状态值。","在S3状态下，队列表的第三行显示了两个选项：返回S2或前往S4。前往S4的折扣回报为10，因为1加上0.9乘以10等于10。这说明在特定状态下，选择最优动作可以最大化预期回报。","该例子是一个玩具模型，但展示了通过回溯整个环境可以构建一个大规模的队列表，供智能体决策使用。这种方法在实际应用中可能需要考虑时间因素，如垃圾回收器的截止时间，这会增加计算复杂度。","在简化模型中，时间因素被忽略，因此计算过程更加直接。但实际应用中，时间序列的处理会增加折扣回报的计算难度，需要考虑时间步长和折扣因子的组合。","最后，课程提到贝尔曼最优方程是强化学习中的核心概念，它描述了最优策略的递归关系，即当前状态的最优值等于当前奖励加上后续状态的最优值的折扣。这为后续的策略优化提供了理论基础。","通过队列表的构建和贝尔曼最优方程的应用，可以系统地分析和优化智能体的决策过程，从而在复杂环境中实现最优策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1710.93,"end":1868.46,"asr_flags":[],"raw_segments":[{"start":1710.93,"text":"Now I can copy back this. So S3, I know that when I'm in S3, I can expect zero immediate reward to... Sorry, if I'm in S2, I can expect zero immediate reward plus a discount times the plus nine that I could expect in S3. And so that gives me values that should cover everything that we have in this..."},{"start":1740.24,"text":"queue table. So I do that backtracking. I copy paste all of that into my queue table all the way up here. And this is what I get. We essentially finish the game at this point. We can look at a certain row. So let's say I'm in state number three. I look on the third row of that queue table and I see that I have two options. If I go back to S2,"},{"start":1767.84,"text":"Ultimately, my discounted return will be 8.1, right? If I actually go to S4 on the right, I will get 10 because I will get 1 plus 0.9 times 10, which is 10."},{"start":1784.83,"text":"So this is a toy example, but it tells you that if you were able to backtrack through the entire environment, you will be able to build a massive queue table and you will be able to give it to your agent to make its decisions. Yeah. Sorry, can you repeat?"},{"start":1806.74,"text":"Yeah, here I'm simplifying. I'm not considering the time remaining. But in practice, if I remove the time component, so I remove the fact that there's a three-minute deadline before the garbage collector comes, then this would be slightly more difficult because you would have to do a time series, essentially, of adding the discount times the reward that you collect. Yeah, but I'm simplifying here. And that's why I use the three-minute rule. Any question on the queue table?"},{"start":1840.59,"text":"Super. OK, so this was the Q table. And in fact, we can put together our strategy for gamma equals 0.9. The best strategy is still the same. You go to the right and you can expect a return of nine. Now, one of the most important concepts in reinforcement learning is this equation on the board called the Bellman optimality equation."}],"speech_gaps":[],"frame":"../frames/v062/011.webp","frame_time":1722.93},{"title":"贝尔曼最优方程与策略定义","segments":[{"id":71,"text":"Oftentimes, you'll see it's noted as Q star of state S and action A equals R plus gamma times the max of that same function applied to S prime A prime. Let me explain this equation for you because it's super important. This equation is called the optimality equation because your optimal Q table will follow this equation."},{"id":72,"text":"If you have finished the game, this equation can be applied to any state-action pair, and it will still be true. The intuition behind why the Bellman equation is the optimality equation is that if you have the perfect Q function, Q table, and you're in a certain state and you perform a certain action A, you will observe a reward."},{"id":73,"text":"This reward will, you know, you have taken an action, so you would be in a new state. And from that new state, you can repeat what you just did, right? And because you've done the backtracking and stuff like that, you will get this equation to be true because it's the reward plus discount times the best next action that you could be taking. Does that make sense? Any question on that? That's exactly the backtracking that we did, by the way."},{"id":74,"text":"immediate reward plus discounts times the best possible action that you can take in the next state, S prime. The last concept I cover in terms of vocabulary is the policy. The policy is the function that given your state is going to tell you what to do. And in Q learning, the way these policies define is argmax of Q star."},{"id":75,"text":"across the action so essentially what it says is like look in the table and look at a certain state s you want the policy which is what you should do it's the function that tells you our best strategy you just look at the two possible actions which one has the highest q value and select that action that's it this is a very simple example but it's the core of"},{"id":76,"text":"Q learning that, you know, later on you will use policies widely. There's a lot of reinforcement learning algorithms, but this concept of understanding the policies, the function telling us our best strategy in Q learning, it's the argmax of the best Q value in a given state. It tells you which action to take. That's the core thing you need to understand. So remember this Bellman equation because we're going to reuse it."}],"notes":["本段讲解了Q学习中策略的定义，即策略是给定状态后选择最优动作的函数，具体表现为在Q表中对所有可能动作取最大值。这是Q学习的核心概念之一，策略通过argmax操作确定最优动作。","讲者提到Q学习中策略的定义是argmax Q值，这与贝尔曼最优方程紧密相关，因为最优策略必须满足贝尔曼最优方程。策略的定义是基于Q值的，而不是直接基于奖励或状态转移。","讲者强调了贝尔曼最优方程的重要性，因为它描述了最优Q函数的结构，即当前奖励加上折扣因子乘以下一状态的最优Q值。这是强化学习中用于更新Q值的核心公式。","讲者通过举例说明了策略的定义，即在给定状态s下，策略会查看所有可能的动作，选择具有最高Q值的动作。这种策略定义是Q学习算法的基础。","讲者提到贝尔曼最优方程与策略的联系，即最优策略必须满足贝尔曼最优方程。这表明策略的定义和贝尔曼方程是相互关联的，策略的更新依赖于贝尔曼方程的正确性。","讲者最后提醒学生记住贝尔曼方程，因为后续内容会频繁使用该方程。这表明贝尔曼方程是强化学习中的核心概念，是理解Q学习和其他算法的基础。"],"formulas":[{"latex":"\\text{Policy} = \\arg\\max_{a} Q^*(s, a)","symbols":"策略是给定状态s下选择具有最高Q值的动作a，即argmax操作","explanation":"公式中的argmax表示在给定状态s下，选择使得Q值最大的动作a。此公式正确表达了策略的定义，符合Q学习中策略的定义方式。","evidence":"immediate reward plus discounts times the best possible action that you can take in the next state, S prime. The last concept I cover in terms of vocabulary is the policy. The policy is the function that given your state is going to tell you what to do. And in Q learning, the way these policies define is argmax of Q star."}],"uncertainties":["Q learning that, you know, later on you will use policies widely."],"diagram":"none","start":1869.65,"end":2040.42,"asr_flags":[],"math_clarifications":["原始文本中提到的Q学习策略定义为argmax Q值，公式中的argmax应使用\\arg\\max而非\\max，以准确表达取最大值对应的动作。"],"raw_segments":[{"start":1869.65,"text":"Oftentimes, you'll see it's noted as Q star of state S and action A equals R plus gamma times the max of that same function applied to S prime A prime. Let me explain this equation for you because it's super important. This equation is called the optimality equation because your optimal Q table will follow this equation."},{"start":1899.68,"text":"If you have finished the game, this equation can be applied to any state-action pair, and it will still be true. The intuition behind why the Bellman equation is the optimality equation is that if you have the perfect Q function, Q table, and you're in a certain state and you perform a certain action A, you will observe a reward."},{"start":1927.98,"text":"This reward will, you know, you have taken an action, so you would be in a new state. And from that new state, you can repeat what you just did, right? And because you've done the backtracking and stuff like that, you will get this equation to be true because it's the reward plus discount times the best next action that you could be taking. Does that make sense? Any question on that? That's exactly the backtracking that we did, by the way."},{"start":1958.4,"text":"immediate reward plus discounts times the best possible action that you can take in the next state, S prime. The last concept I cover in terms of vocabulary is the policy. The policy is the function that given your state is going to tell you what to do. And in Q learning, the way these policies define is argmax of Q star."},{"start":1988.66,"text":"across the action so essentially what it says is like look in the table and look at a certain state s you want the policy which is what you should do it's the function that tells you our best strategy you just look at the two possible actions which one has the highest q value and select that action that's it this is a very simple example but it's the core of"},{"start":2018.04,"text":"Q learning that, you know, later on you will use policies widely. There's a lot of reinforcement learning algorithms, but this concept of understanding the policies, the function telling us our best strategy in Q learning, it's the argmax of the best Q value in a given state. It tells you which action to take. That's the core thing you need to understand. So remember this Bellman equation because we're going to reuse it."}],"speech_gaps":[],"frame":"../frames/v062/012.webp","frame_time":1881.65},{"title":"深度强化学习中的Q函数与深度Q学习","segments":[{"id":77,"text":"The main issue with this approach of a queue table is that state and action spaces can be super large and having a matrix that you discover through backtracking and where every time you want to do an action, you have to look up the given states, the possible action."},{"id":78,"text":"it becomes impossible. Imagine you using this algorithm for the game of Go, where there's so many states, there's so many possible actions. You can put your stone anywhere on the board. You can imagine how big this matrix becomes and how impossible it is to use. So that's our problem. And that's the moment where deep learning comes into play. So let's look at it."},{"id":79,"text":"Oh, actually, before I go there, I'm just going to cover some vocabulary. We said the environment, the agent, the state, the action, the reward, the total return, and the discount factor. We learned all of that. We saw that the Q table is the matrix of entries representing how good is it to take action A in state S. And the policy is the function that tells us what's the best strategy to adopt. And the Bellman equation is satisfied by the optimal Q table."},{"id":80,"text":"So let's get to deep Q learning, which is what I was about to say, is we are going to frame the problem slightly differently. So instead of using a Q table, we're going to use the fact that neural networks are universal function approximators. And we're going to define a Q function that's essentially a neural network so that the function can take a state S and an action A and tell you how good."},{"id":81,"text":"that action is in state S. So instead of a lookup in a matrix, you just run a forward pass in a neural network and it gives you the answer. That feels like a better solution for games where there's a lot of states and a lot of actions."},{"id":82,"text":"So here is the same problem statement. In the past, we looked for a Q table, and this time we will look for a neural network. One of the things we're going to do is to define the output layer to have two outputs. So given a certain state as input, think about it as a one-hot vector encoding the state. So this one is the example of state 2, 0, 1, 0, 0, 0. If you pass state 2 in this Q function with multiple layers,"}],"notes":["本段讲授了传统Q表方法的局限性，特别是在状态和动作空间非常大的情况下，Q表的存储和查询变得不可行。以围棋为例，状态和动作的数量极大，导致矩阵规模巨大，无法实际应用。因此，引入深度学习方法来解决这一问题。","讲者提到深度Q学习（Deep Q Learning）的基本思想，即使用神经网络作为Q函数的近似器，替代传统的Q表。神经网络可以处理高维输入，并通过前向传播快速得到Q值，从而避免了传统方法的存储和查询问题。","讲者进一步说明了神经网络在深度Q学习中的具体应用，包括输入状态的编码方式（如one-hot编码）以及输出层的设计。输出层的维度对应于可能的动作数量，每个输出代表对应动作的Q值。","讲者提到神经网络的结构设计，包括多层网络的使用，以处理复杂的输入状态。通过这种方式，神经网络能够学习到状态与动作之间的复杂关系，从而更有效地进行决策。","讲者强调了深度Q学习相较于传统Q表方法的优势，特别是在处理大规模状态和动作空间时的效率和可扩展性。这种方法使得深度强化学习在实际应用中更加可行。","讲者提到在深度Q学习中，输入状态通常被编码为one-hot向量，这有助于神经网络更好地处理离散状态空间。同时，输出层的维度与动作空间的大小相关，每个输出对应一个动作的Q值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2041.93,"end":2198.32,"asr_flags":[],"raw_segments":[{"start":2041.93,"text":"The main issue with this approach of a queue table is that state and action spaces can be super large and having a matrix that you discover through backtracking and where every time you want to do an action, you have to look up the given states, the possible action."},{"start":2067.58,"text":"it becomes impossible. Imagine you using this algorithm for the game of Go, where there's so many states, there's so many possible actions. You can put your stone anywhere on the board. You can imagine how big this matrix becomes and how impossible it is to use. So that's our problem. And that's the moment where deep learning comes into play. So let's look at it."},{"start":2098.44,"text":"Oh, actually, before I go there, I'm just going to cover some vocabulary. We said the environment, the agent, the state, the action, the reward, the total return, and the discount factor. We learned all of that. We saw that the Q table is the matrix of entries representing how good is it to take action A in state S. And the policy is the function that tells us what's the best strategy to adopt. And the Bellman equation is satisfied by the optimal Q table."},{"start":2125.1,"text":"So let's get to deep Q learning, which is what I was about to say, is we are going to frame the problem slightly differently. So instead of using a Q table, we're going to use the fact that neural networks are universal function approximators. And we're going to define a Q function that's essentially a neural network so that the function can take a state S and an action A and tell you how good."},{"start":2152.71,"text":"that action is in state S. So instead of a lookup in a matrix, you just run a forward pass in a neural network and it gives you the answer. That feels like a better solution for games where there's a lot of states and a lot of actions."},{"start":2170.64,"text":"So here is the same problem statement. In the past, we looked for a Q table, and this time we will look for a neural network. One of the things we're going to do is to define the output layer to have two outputs. So given a certain state as input, think about it as a one-hot vector encoding the state. So this one is the example of state 2, 0, 1, 0, 0, 0. If you pass state 2 in this Q function with multiple layers,"}],"speech_gaps":[],"frame":"../frames/v062/013.webp","frame_time":2053.9300000000003},{"title":"深度强化学习中的网络训练问题","segments":[{"id":83,"text":"It will give you two outputs. One output that corresponds to Q of S action right and the other one Q of S action left because it's the two actions. If we had more actions to take, we would just increase the output layer and we might have many more neurons in the output layer."},{"id":84,"text":"So this one is a hard question, but what would you do given we don't have traditional X and Y pairs?"},{"id":85,"text":"How are you going to train this neural network?"},{"id":86,"text":"Because remember, at the beginning, this neural network will give you garbage."},{"id":87,"text":"It will take a state S and it might tell you go to the left or to the right, but it's completely random."},{"id":88,"text":"So how are you going to tune it to the level where it makes really good decisions?"},{"id":89,"text":"assume based on some prior knowledge"},{"id":90,"text":"tell me more"},{"id":91,"text":"so what are the things"},{"id":92,"text":"we know about this problem right now"},{"id":93,"text":"what are the rules"},{"id":94,"text":"of the game that we could use"},{"id":95,"text":"in order to"},{"id":96,"text":"I'm seeing what you say. You say we could estimate what good looks like, but based on what?"},{"id":97,"text":"Okay, so reward structure. You're saying that's one thing we have in every game. We have a reward"},{"id":98,"text":"structure for every state that definitely should be used in order to estimate what a good decision"},{"id":99,"text":"looks like. Yeah, the problem is not in every state you will see a reward. And if you look at"},{"id":100,"text":"many games like Go, you might not see a reward until 50 moves. So what do you do in this case?"},{"id":101,"text":"Yes?"},{"id":102,"text":"Can we run through a bunch of"},{"id":103,"text":"actions and states and see what the output is and get more data to train the robot?"},{"id":104,"text":"Yeah. So you could, you're actually bringing up a sort of a tree search, right?"},{"id":105,"text":"You go down the tree, you do every possible action, and then you backtrack."},{"id":106,"text":"So which actions?"},{"id":107,"text":"Okay, that's what we're getting there."},{"id":108,"text":"So first possibility is we just go down the tree in the game of Go."},{"id":109,"text":"You could put your stone everywhere."},{"id":110,"text":"So the tree already starts by your 13 by 13 options, and then it exponentially grows."}],"notes":["本段讨论了深度强化学习中神经网络的训练问题，强调了传统监督学习中标签的缺失。讲者指出，网络在初始阶段会给出随机的输出，因此需要找到一种方法来训练网络使其做出好的决策。","讲者询问在没有传统X和Y对的情况下，如何训练神经网络。这表明强化学习与监督学习在训练方法上的根本区别。","讲者提到奖励结构是每个游戏中都存在的，但并非每个状态都会立即获得奖励，例如在围棋中，奖励可能在50步之后才出现。这说明了强化学习中延迟奖励的问题。","讲者提到可以通过运行一系列动作和状态来获取更多数据来训练机器人，这暗示了使用树搜索方法的可能性。","讲者提到树搜索方法，即通过尝试所有可能的动作并回溯，这表明了强化学习中探索与利用的平衡问题。","讲者提到围棋中的树搜索，即从13x13的选项开始，树会指数级增长，这说明了树搜索在实际应用中的计算复杂性问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2198.97,"end":2374.94,"asr_flags":[],"raw_segments":[{"start":2198.97,"text":"it will give you two outputs. One output that corresponds to Q of S action right and the other one Q of S action left because it's the two actions. If we had more actions to take, we would just increase the output layer and we might have many more neurons in the output layer. So the big question is how the hell are we going to train that network? Because we're not in classic supervised learning. We don't have labels."},{"start":2236.56,"text":"So this one is a hard question, but what would you do given we don't have traditional X and Y pairs?"},{"start":2245.86,"text":"How are you going to train this neural network?"},{"start":2251.76,"text":"Because remember, at the beginning, this neural network will give you garbage."},{"start":2255.04,"text":"It will take a state S and it might tell you go to the left or to the right, but it's completely random."},{"start":2260.26,"text":"So how are you going to tune it to the level where it makes really good decisions?"},{"start":2274.54,"text":"assume based on some prior knowledge"},{"start":2276.9,"text":"tell me more"},{"start":2285.42,"text":"so what are the things"},{"start":2287.04,"text":"we know about this problem right now"},{"start":2288.76,"text":"what are the rules"},{"start":2290.8,"text":"of the game that we could use"},{"start":2292.52,"text":"in order to"},{"start":2295.38,"text":"I'm seeing what you say. You say we could estimate what good looks like, but based on what?"},{"start":2308.54,"text":"Okay, so reward structure. You're saying that's one thing we have in every game. We have a reward"},{"start":2313.18,"text":"structure for every state that definitely should be used in order to estimate what a good decision"},{"start":2319.2,"text":"looks like. Yeah, the problem is not in every state you will see a reward. And if you look at"},{"start":2326.04,"text":"many games like Go, you might not see a reward until 50 moves. So what do you do in this case?"},{"start":2335.36,"text":"Yes?"},{"start":2336.24,"text":"Can we run through a bunch of"},{"start":2339.68,"text":"actions and states and see what the output is and get more data to train the robot?"},{"start":2345.14,"text":"Yeah. So you could, you're actually bringing up a sort of a tree search, right?"},{"start":2351.44,"text":"You go down the tree, you do every possible action, and then you backtrack."},{"start":2357.42,"text":"So which actions?"},{"start":2360.84,"text":"Okay, that's what we're getting there."},{"start":2363.54,"text":"So first possibility is we just go down the tree in the game of Go."},{"start":2367.86,"text":"You could put your stone everywhere."},{"start":2369.12,"text":"So the tree already starts by your 13 by 13 options, and then it exponentially grows."}],"speech_gaps":[],"frame":"../frames/v062/014.webp","frame_time":2210.97},{"title":"贝尔曼方程与监督学习的结合","segments":[{"id":111,"text":"It's impossible, it's intractable, but what you said is, what if there are certain actions that are"},{"id":112,"text":"more likely than others? Do we need actually to explore the entire tree? What's this like? What"},{"id":113,"text":"are you using when you're saying that? How do you determine what action might be better than another"},{"id":114,"text":"Expected return, we're getting close, yeah. But how do you know the expected return without going through the tree once at least? Okay, you can estimate it using what? Yeah, maybe. So that's exactly what we're going to do, actually. But we're going to use the Bellman equation. Because there are two things we know about this problem. We know the reward structure, which you brought up."},{"id":115,"text":"And we also know that the perfect Q function will follow the Bellman equation. That we know as well. At the end, the Bellman equation should be respected. Meaning, for every state, if you want to know the Q value of that state given an action, the way you will get that is you will look at the immediate reward plus a discount times the best Q value from the next state across all actions."},{"id":116,"text":"Equation will be respected. So those are the only information we have, and we're going to use them drastically to define our labels and sort of mimic a classic supervised learning approach. So here's what we have. We have our neural network. We have Qs to the left and Qs to the right that represent how good it is to go to the left in that state versus the right. And then I've pasted the Bellman equation on top right of the screen."},{"id":117,"text":"We're going to define a loss function. So let's say for the sake of simplicity, because those are scalar values that we use, you know, L2 loss, quadratic loss, that compares a certain label Y to a certain Q value of a state in a certain action. So what we would like is to minimize this loss function, meaning Y and the Q value for a given action in a given state is as close as possible."},{"id":118,"text":"To each other. And we're going to leverage the reward and the Bellman equation. So let's do two things. Right now, we don't have a Y. So in supervised learning, you would have a picture of a cat. There's a cat. The Y is one or zero. Here, we don't have a Y. So we have to come up with an estimate of a good Y, at least better than random."},{"id":119,"text":"So let's say at this point in time, when I send a state S in the network, it turns out that Q of going to the left is higher than Q of going to the right. Which means that today, at that moment, the Q function tells me it's better to go to the left than to go to the right. That is random at the beginning. It's completely random. So what I'm going to do is I'm going to use as my target value Y."}],"notes":["本段讨论了在强化学习中如何处理动作选择的问题，指出即使某些动作更有可能被选择，也不需要探索整个决策树。接着，讲者提到如何通过贝尔曼方程来估计预期回报，这是强化学习中的核心概念。","讲者强调贝尔曼方程的重要性，指出完美Q函数必须遵循该方程。贝尔曼方程描述了在给定状态下，通过立即奖励加上折扣后的下一状态的最佳Q值来计算当前状态的Q值。这是强化学习中用于更新Q值的核心公式。","讲者将强化学习与监督学习进行类比，指出在监督学习中，标签Y是已知的，而在强化学习中，需要通过贝尔曼方程来估计Y。这涉及到定义损失函数，如L2损失，以最小化预测Q值与目标Y之间的差距。","讲者提到在没有标签Y的情况下，需要估计一个比随机更好的Y。这通常通过当前Q值来估计，例如在某个状态下，选择Q值较高的动作作为目标Y。这反映了强化学习中通过经验来更新策略的过程。","讲者指出在初始阶段，Q函数的估计是随机的，但随着训练的进行，Q值会逐渐收敛到更优的策略。这说明了强化学习中策略迭代和价值迭代的过程。","讲者强调了贝尔曼方程在强化学习中的核心地位，它不仅用于定义Q值，还用于构建损失函数，从而实现监督学习的框架。这表明了强化学习与监督学习之间的联系和区别。"],"formulas":[{"latex":"L = \\frac{1}{2}(Y - Q(s, a))^2","symbols":"L 是损失函数，Y 是目标值，Q(s, a) 是预测的Q值","explanation":"公式正确，使用了L2损失函数，适用于监督学习中的回归问题。","evidence":"We're going to define a loss function. So let's say for the sake of simplicity, because those are scalar values that we use, you know, L2 loss, quadratic loss, that compares a certain label Y to a certain Q value of a state in a certain action. So what we would like is to minimize this loss function, meaning Y and the Q value for a given action in a given state is as close as possible."}],"uncertainties":[],"diagram":"bellman","start":2376.02,"end":2552.22,"asr_flags":[],"math_clarifications":["公式中的损失函数L是标准的均方误差，适用于监督学习中预测Q值的任务。"],"raw_segments":[{"start":2376.02,"text":"impossible it's intractable but what you said is what if there are certain actions that are"},{"start":2380.02,"text":"more likely than others do we need actually to explore the entire tree what's this like what"},{"start":2385.04,"text":"are you using when you're saying that how do you determine what action might be better than another"},{"start":2392.07,"text":"Expected return, we're getting close, yeah. But how do you know the expected return without going through the tree once at least? Okay, you can estimate it using what? Yeah, maybe. So that's exactly what we're going to do, actually. But we're going to use the Bellman equation. Because there are two things we know about this problem. We know the reward structure, which you brought up."},{"start":2420.23,"text":"And we also know that the perfect Q function will follow the Bellman equation. That we know as well. At the end, the Bellman equation should be respected. Meaning, for every state, if you want to know the Q value of that state given an action, the way you will get that is you will look at the immediate reward plus a discount times the best Q value from the next state across all actions."},{"start":2447.3,"text":"equation will be respected. So those are the only information we have, and we're going to use them drastically to define our labels and sort of mimic a classic supervised learning approach. So here's what we have. We have our neural network. We have QS to the left and QS to the right that represent how good it is to go to the left in that state versus the right. And then I've pasted the Bellman equation on top right of the screen."},{"start":2473.67,"text":"We're going to define a loss function. So let's say for the sake of simplicity, because those are scalar values that we use, you know, L2 loss, quadratic loss, that compares a certain label
