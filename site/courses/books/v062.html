t-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：深度强化学习 · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v062.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v062","title":"斯坦福CS230：深度强化学习","course":"深度学习","pages":[{"title":"深度强化学习介绍","segments":[{"id":0,"text":"Welcome to our fifth lecture in person for Stanford Deep Learning CS230. Today's lecture is going to be about deep reinforcement learning. I actually switched.","zh":"欢迎来到斯坦福大学深度学习课程CS230的第五次现场讲座。今天的讲座将介绍深度强化学习。我实际上改变了原计划。","start":1.36,"end":13.58},{"id":1,"text":"the original plan of talking about neural network interpretability and LLM visualization, simply because you haven't had the chance to study attention maps, convolutional neural networks, and so it would have been an overkill to do that week five. So we're going to talk about neural network interpretability and visualization in a later lecture, actually. But today, our focus will be on deep reinforcement learning, which is probably my favorite","zh":"原计划是谈论神经网络可解释性和大语言模型可视化，仅仅是因为你们还没有机会学习注意力图、卷积神经网络，所以在第五周做这些会显得过于冗长。因此，我们实际上会在后面的讲座中讨论神经网络可解释性和可视化。但今天，我们的重点将是深度强化学习，这可能是我最喜欢的","start":14.35,"end":43.61},{"id":2,"text":"favorite lecture of the class. I feel like I say that every week, but it's okay. I like it. The agenda is pretty packed.","zh":"这门课中最喜欢的讲座。我觉得我每周都说这句话，但没关系。我喜欢。议程安排非常紧凑。","start":43.63,"end":52.91},{"id":3,"text":"We're going to start with deep reinforcement learning, which you can think of as the marriage between deep learning and reinforcement learning. Together, the baby is called deep reinforcement learning. And we're going to see how reinforcement learning works and how neural networks can play a part in building reinforcement learning agents.","zh":"我们将从深度强化学习开始，你可以将其视为深度学习和强化学习的结合。两者结合的产物被称为深度强化学习。我们将看到强化学习是如何运作的，以及神经网络如何在构建强化学习智能体中发挥作用。","start":53.63,"end":77.63},{"id":4,"text":"In the second half of the class, we will focus on a very specific concept called reinforcement learning from human feedback that you might have heard of. It's one of the core concepts that really make the difference between what you might have remembered as GPT-2.","zh":"在课程的后半部分，我们将专注于一个非常具体的概念，称为来自人类反馈的强化学习，你可能听说过这个概念。这是真正使你可能记得的GPT-2与ChatGPT之间产生飞跃的核心概念。","start":78.48,"end":101.54},{"id":5,"text":"and ChatGPT. That's the leap. That's really the technique that has democratized access to LLM because of the performance improvements and the alignment with humans. So we're going to see what is this concept of our LHF and how does it work and why does it allow us to align a language model to human preferences.","zh":"这就是真正使大型语言模型对大众开放的技术，因为它带来了性能的提升，并且与人类的对齐。我们将看到这个LHF概念是什么，它是如何工作的，以及为什么它使我们能够将语言模型对齐到人类偏好。","start":102.39,"end":128.17},{"id":6,"text":"Ready to go? As always, let's try to make it interactive. So the motivation behind deep reinforcement learning, and as usual, you're going to have all the most important papers that are covered in the class listed at the bottom of each slide. Reinforcement learning has grown in popularity. One of the very...","zh":"准备好了吗？和往常一样，让我们尝试让课堂互动起来。深度强化学习的动机，和往常一样，你们将在每张幻灯片的底部找到本课涵盖的所有最重要的论文。强化学习的流行度正在增长。其中一个……","start":130.2,"end":152.94},{"id":7,"text":"Popular papers called Human Level Control Through Deep Reinforcement Learning is the work from DeepMind has showed us that a single algorithm slash training method can allow us to train AI that can play many, many Atari games better than humans. Single algorithm.","zh":"广为人知的论文《通过深度强化学习实现人类水平控制》是DeepMind的工作，它向我们展示了单一算法/训练方法可以使AI在许多Atari游戏中表现得比人类更好。单一算法。","start":153.42,"end":176.9}],"notes":["本段介绍了课程第五讲的主题是深度强化学习，并说明了课程内容的调整原因。讲者提到原本计划讨论神经网络可解释性和LLM可视化，但由于学生尚未学习注意力图、卷积神经网络等内容，因此决定将这些内容留到后续课程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1.36,"end":176.9,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1.36,"text":"Welcome to our fifth lecture in person for Stanford Deep Learning CS230. Today's lecture is going to be about deep reinforcement learning. I actually switched."},{"start":14.35,"text":"the original plan of talking about neural network interpretability and LLM visualization, simply because you haven't had the chance to study attention maps, convolutional neural networks, and so it would have been an overkill to do that week five. So we're going to talk about neural network interpretability and visualization in a later lecture, actually. But today, our focus will be on deep reinforcement learning, which is probably my favorite"},{"start":43.63,"text":"favorite lecture of the class. I feel like I say that every week, but it's okay. I like it. The agenda is pretty packed."},{"start":53.63,"text":"We're going to start with deep reinforcement learning, which you can think of as the marriage between deep learning and reinforcement learning. Together, the baby is called deep reinforcement learning. And we're going to see how reinforcement learning works and how neural networks can play a part in building reinforcement learning agents."},{"start":78.48,"text":"In the second half of the class, we will focus on a very specific concept called reinforcement learning from human feedback that you might have heard of. It's one of the core concepts that really make the difference between what you might have remembered as GPT-2."},{"start":102.39,"text":"and ChatGPT. That's the leap. That's really the technique that has democratized access to LLM because of the performance improvements and the alignment with humans. So we're going to see what is this concept of our LHF and how does it work and why does it allow us to align a language model to human preferences."},{"start":130.2,"text":"Ready to go? As always, let's try to make it interactive. So the motivation behind deep reinforcement learning, and as usual, you're going to have all the most important papers that are covered in the class listed at the bottom of each slide. Reinforcement learning has grown in popularity. One of the very..."},{"start":153.42,"text":"Popular papers called Human Level Control Through Deep Reinforcement Learning is the work from DeepMind has showed us that a single algorithm slash training method can allow us to train AI that can play many, many Atari games better than humans. Single algorithm."}],"speech_gaps":[],"frame":"../frames/v062/001.webp","frame_time":13.36},{"title":"深度强化学习的应用与挑战","segments":[{"id":8,"text":"Over 40, 50 games where it exceeds human capability, which is quite impressive when you thought about the fact that, you know, machine learning used to be niche and you would have to train a really niche algorithm to perform different tasks. Here's an algorithm that can just learn sort of every Atari game. A little later, you might have heard of AlphaGo. AlphaGo is...","zh":"在超过40、50个游戏中，它超越了人类的能力，这相当令人印象深刻，当你想到机器学习曾经是小众领域，你必须训练一个非常专门的算法来执行不同的任务。这里有一个算法，可以学习几乎所有的Atari游戏。稍后，你可能听说过AlphaGo。AlphaGo是...","start":177.85,"end":200.51},{"id":9,"text":"is an algorithm that was developed to beat and exceed human performance in the game of Go. We'll talk about it a little more. The game of Go is a very complex game. Some would argue way more complex than chess from a decision-making standpoint and from the possibilities that can happen on the board. And so it actually got solved in 2017, again, by the DeepMind team and","zh":"一种被开发用来在围棋游戏中击败并超越人类表现的算法。我们稍后会更详细地讨论它。围棋是一项非常复杂的游戏。有人认为从决策角度和棋盘上可能发生的情况来看，它比国际象棋更加复杂。因此，它实际上在2017年再次由DeepMind团队和","start":201.07,"end":230.19},{"id":10,"text":"in David Silver's lab. Later on, and again, another great paper from DeepMind had showed us that reinforcement learning can also be used for strategy game that might be a touch more complex than chess or Go that might actually involve multiple players playing with each other or against each other. Some of you might have played StarCraft, for example. That's an example of a game where...","zh":"David Silver的实验室解决。后来，另一篇来自DeepMind的出色论文向我们展示了强化学习也可以用于策略游戏，这些游戏可能比国际象棋或围棋稍微复杂一些，可能实际上涉及多个玩家之间相互合作或对抗。例如，你们中的一些人可能玩过星际争霸。这是一个需要...","start":230.41,"end":259.25},{"id":11,"text":"It requires a lot of long-term thinking, short-term thinking. Another one is Dota. Some of you might have played Dota or League of Legends where you have a team playing against another team. Those are examples of games that involve multiple agents playing collaboratively. And it's pretty hard to develop systems that can play with each other against multiple opponents.","zh":"需要大量长期思考和短期思考的游戏。另一个例子是Dota。你们中的一些人可能玩过Dota或英雄联盟，其中一支队伍对抗另一支队伍。这些都是涉及多个智能体协作进行游戏的例子。开发能够与其他多个对手进行对抗的系统相当困难。","start":259.63,"end":279.75},{"id":12,"text":"And finally, most recently, this is 2022. So alongside the release of ChatGPT, this paper that introduces the concept of reinforcement learning with human feedback applied to aligning language models with human preferences. And we'll talk about that later. So all this to say that reinforcement learning allowed us to exceed human performance in a variety of tasks.","zh":"最后，最近，这是2022年。因此，在ChatGPT发布的同时，有一篇介绍将强化学习与人类反馈结合应用于对齐语言模型与人类偏好的概念的论文。我们稍后会讨论这一点。总之，所有这些都说明强化学习使我们能够在各种任务中超越人类表现。","start":280.78,"end":307.76},{"id":13,"text":"The first one I want us to think about is the game of Go. So let's say that you were asked to solve the game of Go with classic supervised learning. Okay, everything we've seen together so far, labeled data. How would you solve the game of Go with classic supervised learning? What data would you collect? What would be the label, et cetera? Yes.","zh":"我想让大家思考的第一个问题是围棋游戏。假设你被要求用经典的监督学习来解决围棋游戏。好的，我们到目前为止所看到的一切都是带标签的数据。那么你如何用经典的监督学习来解决围棋游戏呢？你会收集什么样的数据？标签又会是什么，等等？是的。","start":308.56,"end":342.08}],"notes":["本段讨论了使用经典监督学习解决围棋问题的挑战。讲者指出，监督学习需要标记数据，而围棋的复杂性使得收集足够的标记数据变得困难。讲者通过提问引导学生思考如何在没有足够标记数据的情况下应用监督学习来解决围棋问题。","讲者提到，监督学习需要明确的标签，而围棋的每一步决策都依赖于复杂的上下文，这使得直接应用监督学习变得不切实际。因此，监督学习在处理像围棋这样的复杂策略游戏时存在局限性。","讲者通过提问引导学生思考监督学习在围棋中的应用，例如需要收集哪些数据、如何定义标签等。这表明监督学习在处理需要长期策略和复杂决策的游戏时存在固有的限制。","讲者强调，监督学习依赖于标记数据，而围棋的每一步都可能影响后续的决策，因此无法通过简单的标签来描述游戏的正确性。这进一步说明监督学习在处理复杂策略游戏时的不足。","讲者通过提问引导学生思考监督学习在围棋中的应用，这表明监督学习在处理需要长期策略和复杂决策的游戏时存在固有的限制，而强化学习则更适合这类任务。","讲者通过提问引导学生思考监督学习在围棋中的应用，这表明监督学习在处理需要长期策略和复杂决策的游戏时存在固有的限制，而强化学习则更适合这类任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.85,"end":342.08,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":177.85,"text":"Over 40, 50 games where it exceeds human capability, which is quite impressive when you thought about the fact that, you know, machine learning used to be niche and you would have to train a really niche algorithm to perform different tasks. Here's an algorithm that can just learn sort of every Atari game. A little later, you might have heard of AlphaGo. AlphaGo is..."},{"start":201.07,"text":"is an algorithm that was developed to beat and exceed human performance in the game of Go. We'll talk about it a little more. The game of Go is a very complex game. Some would argue way more complex than chess from a decision-making standpoint and from the possibilities that can happen on the board. And so it actually got solved in 2017, again, by the DeepMind team and"},{"start":230.41,"text":"in David Silver's lab. Later on, and again, another great paper from DeepMind had showed us that reinforcement learning can also be used for strategy game that might be a touch more complex than chess or Go that might actually involve multiple players playing with each other or against each other. Some of you might have played StarCraft, for example. That's an example of a game where..."},{"start":259.63,"text":"It requires a lot of long-term thinking, short-term thinking. Another one is Dota. Some of you might have played Dota or League of Legends where you have a team playing against another team. Those are examples of games that involve multiple agents playing collaboratively. And it's pretty hard to develop systems that can play with each other against multiple opponents."},{"start":280.78,"text":"And finally, most recently, this is 2022. So alongside the release of ChatGPT, this paper that introduces the concept of reinforcement learning with human feedback applied to aligning language models with human preferences. And we'll talk about that later. So all this to say that reinforcement learning allowed us to exceed human performance in a variety of tasks."},{"start":308.56,"text":"The first one I want us to think about is the game of Go. So let's say that you were asked to solve the game of Go with classic supervised learning. Okay, everything we've seen together so far, labeled data. How would you solve the game of Go with classic supervised learning? What data would you collect? What would be the label, et cetera? Yes."}],"speech_gaps":[],"frame":"../frames/v062/002.webp","frame_time":189.85},{"title":"深度强化学习中的状态空间与策略学习","segments":[{"id":14,"text":"Okay, good point. You look at history of plenty of games, hopefully from good players, which are on the game, the algorithm to work. And you look at X as the inputs being the current state of the board and Y as the next state of the board. And this would tell you what move was selected and you learn the move essentially. And hopefully if you do that across many, many games, you might see the agent become more,","zh":"好的，这是一个很好的观点。你查看大量游戏的历史，希望这些游戏是由优秀的玩家进行的，算法才能正常运作。你将X视为输入，即当前棋盘的状态，Y视为下一个棋盘的状态。这会告诉你选择了哪一步移动，你实际上是在学习这一步移动。希望在进行许多许多场比赛后，你可能会看到智能体变得更加适应游戏并发展出更好的策略。","start":350.0,"end":378.78},{"id":15,"text":"attuned to the game and develop better strategies. So, you know, really, hopefully it's a professional player. What are the disadvantages of that or the shortcomings that you can anticipate? Yes. Yeah, great point. You might not see the entire space of possible states of the board.","zh":"所以，你明白，希望它能成为职业选手。这种方法有什么缺点或可以预见的不足之处吗？是的。是的，非常好的观点。你可能看不到棋盘所有可能状态的整个空间。正如你所说，你可能会错过很多不同的策略。围棋实际上是一个两人游戏，一方使用黑子，另一方使用白子，他们依次在网格上放置这些棋子。","start":379.15,"end":412.74},{"id":16,"text":"which is what you said so you might miss out on a lot of different strategies so the game of go is actually a game with two players one player that uses the black stones and one player that uses the white stones and iteratively they're going to place those stones","zh":"在一个13乘13的网格上，你可以在屏幕上看到，目标是包围对手的棋子。你一直在试图包围对手的棋子，而对手则试图包围你的棋子。你可以想象，对于网格上的每一个交叉点，都有多种可能性，要么是黑子，要么是白子，要么是空的。在一个13乘13的网格上，你可以想象棋盘状态有多少种可能性。","start":413.34,"end":428.34},{"id":17,"text":"on the grid a 13 by 13 grid that you can see on screen with the goal of surrounding their opponents so you're constantly trying to surround the stones of the opponent and the opponent is trying to surround your stones and so you can imagine that for every intersection on the grid there is","zh":"在一个屏幕上可以看到的13乘13的网格上，你的目标是包围对手的棋子，因此你一直在试图包围对手的棋子，而对手也在试图包围你的棋子，因此你可以想象，对于网格上的每一个交叉点，都有","start":429.26,"end":448.88},{"id":18,"text":"Multiple possibilities, either there's a black stone or a white stone or nothing. And on a 13 by 13 grid, you can imagine how many possibilities of a board state there are. It's impossible to capture all of that with historical moves from professional players.","zh":"多种可能性，要么是黑色棋子，要么是白色棋子，要么是空的。在一个13乘13的网格上，你可以想象棋盘状态有多少种可能性。用职业棋手的历史走法来捕捉所有这些可能性是不可能的。","start":449.45,"end":465.23},{"id":19,"text":"it will just never cover that the same thing could be said in chess as well you know that even the professional players can plan x number of steps in advance but nobody knows where the game takes you and in the late stages of the games or the end games players always find themselves playing a different game and that's part of the magic of being good at chess so yeah that's the problem what's another problem or shortcoming beyond the fact that we can't observe possibly all the states","zh":"它永远无法覆盖到同样的情况，这在国际象棋中也可以说是一样的，你知道即使职业棋手也能提前计划若干步，但没有人知道游戏会带你去向何方，在游戏的后期阶段或终局阶段，玩家总是发现自己在玩一场不同的游戏，这就是擅长国际象棋的魔力，所以是的，这就是问题，还有什么其他问题或不足，除了我们无法观察到所有可能的状态","start":465.82,"end":493.52},{"id":20,"text":"Yes. Correct. Correct. If I repeat what you said, well, first, you don't even know if this was a good move.","zh":"是的。正确。正确。如果我重复你说的话，那么首先，你甚至不知道这是否是一个好棋着。","start":497.46,"end":516.71}],"notes":["本段讨论了在深度强化学习中，使用历史数据训练智能体的局限性。教师指出，仅依赖专业玩家的历史游戏数据可能无法覆盖所有可能的状态空间，从而导致策略学习的不足。","教师以围棋为例，说明了棋盘上每个交点可能有多种状态（黑子、白子或空），13x13的棋盘状态组合数量巨大，无法通过历史数据完全覆盖。","教师进一步将讨论扩展到国际象棋，指出即使专业玩家也能提前规划几步，但游戏后期的局势变化难以预测，导致策略的不确定性。","教师强调，除了状态空间覆盖不足的问题，还存在另一个问题：无法判断某一步是否为好棋。这表明在训练过程中，仅依赖历史数据可能无法准确评估动作的价值。","教师通过围棋和国际象棋的例子，说明了强化学习中状态空间的复杂性和策略学习的挑战，强调了需要更全面的数据和方法来应对这些问题。","教师指出，专业玩家的策略虽然优秀，但并不能代表所有可能的策略，因此在训练智能体时，需要考虑更广泛的状态和动作空间。"],"formulas":[],"uncertainties":["x number of steps in advance"],"diagram":"none","start":350.0,"end":516.71,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":350.0,"text":"Okay, good point. You look at history of plenty of games, hopefully from good players, which are on the game, the algorithm to work. And you look at X as the inputs being the current state of the board and Y as the next state of the board. And this would tell you what move was selected and you learn the move essentially. And hopefully if you do that across many, many games, you might see the agent become more,"},{"start":379.15,"text":"attuned to the game and develop better strategies. So, you know, really, hopefully it's a professional player. What are the disadvantages of that or the shortcomings that you can anticipate? Yes. Yeah, great point. You might not see the entire space of possible states of the board."},{"start":413.34,"text":"which is what you said so you might miss out on a lot of different strategies so the game of go is actually a game with two players one player that uses the black stones and one player that uses the white stones and iteratively they're going to place those stones"},{"start":429.26,"text":"on the grid a 13 by 13 grid that you can see on screen with the goal of surrounding their opponents so you're constantly trying to surround the stones of the opponent and the opponent is trying to surround your stones and so you can imagine that for every intersection on the grid there is"},{"start":449.45,"text":"Multiple possibilities, either there's a black stone or a white stone or nothing. And on a 13 by 13 grid, you can imagine how many possibilities of a board state there are. It's impossible to capture all of that with historical moves from professional players."},{"start":465.82,"text":"it will just never cover that the same thing could be said in chess as well you know that even the professional players can plan x number of steps in advance but nobody knows where the game takes you and in the late stages of the games or the end games players always find themselves playing a different game and that's part of the magic of being good at chess so yeah that's the problem what's another problem or shortcoming beyond the fact that we can't observe possibly all the states"},{"start":497.46,"text":"Yes. Correct. Correct. If I repeat what you said, well, first, you don't even know if this was a good move."}],"speech_gaps":[],"frame":"../frames/v062/003.webp","frame_time":362.0},{"title":"深度强化学习的应用与挑战","segments":[{"id":21,"text":"So maybe it was not even a good move and you're learning something that was not a good move and you're labeling it as a good move. And second, you're actually only getting partial information, meaning you don't have the information of what's in the person's mind and what strategy they're trying to execute. So you're sort of looking at a single example among long-term strategy and you can't expect the model to guess what's the long-term strategy because it was just trained on X and Y and matching the inputs to a possible output.","zh":"也许那根本不是一个好动作，你正在学习一个不好的动作，并将其标记为一个好的动作。其次，你实际上只获得部分信息，意味着你不知道对方的想法和他们试图执行的策略。因此，你只是在长期策略中观察一个单独的例子，你不能期望模型猜测长期策略，因为它只是在X和Y上进行训练，并将输入匹配到可能的输出。","start":517.15,"end":546.29},{"id":22,"text":"So you don't really have any concept of a strategy at that point. It looks one-off at every decision of the model. Okay, those are really good points. The other one is the ground truth might be ill-defined. What I mean by that is even the best humans in the world do not play their best game every day. And even their best game is not the ground truth.","zh":"因此，在那个阶段，你实际上并不真正理解策略的概念。模型在每一个决策上都像是孤立的。好的，这些都是非常好的观点。另一个问题是真实标签可能定义不清。我的意思是，即使世界上最好的人类也不每天都能发挥出最佳水平，而且他们的最佳表现也不一定是真实标签。","start":546.44,"end":574.95},{"id":23,"text":"And that creates an issue because you're essentially training against a target that is off by a certain margin. You're never going to get better than the best human. And the best human is not the best possible, existing the best possible strategy at every point. So you could argue, what if we get a panel of experts that we're monitoring? And those are the best players in the world. Even with a panel of experts that decides every move, you still have an ill-defined ground truth.","zh":"这就会产生一个问题，因为你实际上是在与一个存在一定偏差的目标进行训练。你永远无法超越最好的人类。而最好的人类在每一个时刻也不一定代表最佳可能的策略。因此，你可以争论说，如果我们有一个专家小组进行监控，这些是世界上最好的玩家，即使有一个专家小组决定每一步，你仍然存在定义不清的真实标签问题。","start":575.7,"end":603.68},{"id":24,"text":"So that's a big issue. Too many states in the game you mentioned, and we will likely not generalize, which is what you said, meaning we're looking at one-off situations. We're not looking at entire strategies. And so when we face a board state that we've never seen before, because the model was not trained on strategy, it sort of will get stuck.","zh":"因此，这是一个大问题。你提到的游戏状态太多，我们很可能无法泛化，正如你所说，意味着我们只关注孤立的情况。我们不关注整个策略。因此，当我们面对一个从未见过的棋盘状态时，因为模型没有在策略上进行训练，它可能会陷入困境。","start":606.0,"end":624.32},{"id":25,"text":"Okay, and this is an example of a perfect application for reinforcement learning because reinforcement learning is all about delayed labels and making sequences of good decisions. So if you had to remember in one sentence what's RL, RL is making good sequences of decisions. Sequences of good decisions, sorry. And do that automatically.","zh":"好的，这是一个强化学习的完美应用案例，因为强化学习全部关于延迟标签和做出一系列良好的决策。所以如果你要用一句话来概括什么是强化学习，强化学习就是自动做出一系列良好的决策。一系列良好的决策，抱歉。","start":627.27,"end":658.39},{"id":26,"text":"Another way to look at it is the difference between classic supervised learning and RL. In classic supervised learning, you teach by example. In reinforcement learning, you teach by experience, which is also a different concept. You're not just showing cats and non-cats to a model. You're actually letting the model experience an environment until it figures out what were the best decisions it made and learns from them.","zh":"另一种看待这个问题的方式是经典监督学习与强化学习之间的区别。在经典监督学习中，你是通过示例来教学的。而在强化学习中，你是通过经验来教学的，这也是一种不同的概念。你不仅仅是向模型展示猫和非猫的图片。你实际上是让模型在一个环境中进行体验，直到它找出自己做出的最佳决策，并从中学习。","start":661.81,"end":690.55}],"notes":["本段讨论了监督学习在某些场景下的局限性，特别是当模型无法理解长期策略时的问题。讲者指出，监督学习仅基于输入和输出的配对进行训练，无法捕捉策略的全局性，导致模型在面对新状态时可能无法做出正确决策。","讲者进一步指出，即使是最优秀的专家也可能无法提供明确的‘地面真实’（ground truth），因为他们的表现并非总是最佳。这使得训练目标存在偏差，模型无法超越人类的表现。","讲者提到，即使引入专家小组来决定每一步，也无法完全定义‘地面真实’，因为专家的决策也可能存在不确定性。这表明在某些任务中，‘地面真实’本身可能是模糊的。","讲者强调，当游戏状态过多时，模型难以泛化，因为它只学习了单个例子，而非整体策略。这导致模型在面对未见过的状态时可能陷入困境。","讲者指出，强化学习（RL）适用于这种场景，因为它关注的是延迟标签和序列决策。RL的核心是让模型通过经验学习，而不是直接提供输入-输出对。","最后，讲者对比了监督学习和强化学习的差异，指出监督学习是通过示例教学，而强化学习是通过经验教学。模型在强化学习中会经历环境，从而学习最佳决策。"],"formulas":[],"uncertainties":[],"diagram":"none","start":517.15,"end":690.55,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":517.15,"text":"So maybe it was not even a good move and you're learning something that was not a good move and you're labeling it as a good move. And second, you're actually only getting partial information, meaning you don't have the information of what's in the person's mind and what strategy they're trying to execute. So you're sort of looking at a single example among long-term strategy and you can't expect the model to guess what's the long-term strategy because it was just trained on X and Y and matching the inputs to"},{"start":546.44,"text":"a possible output. So you don't really have any concept of a strategy at that point. It looks one-off at every decision of the model. Okay, those are really good points. The other one is the ground truth might be ill-defined. What I mean by that is even the best humans in the world do not play their best game every day. And even their best game is not the ground truth."},{"start":575.7,"text":"And that creates an issue because you're essentially training against a target that is off by a certain margin. You're never going to get better than the best human. And the best human is not the best possible, existing the best possible strategy at every point. So you could argue, what if we get a panel of experts that we're monitoring? And those are the best players in the world. Even with a panel of experts that decides every move, you still have an ill-defined ground truth."},{"start":606.0,"text":"So that's a big issue. Too many states in the game you mentioned, and we will likely not generalize, which is what you said, meaning we're looking at one-off situations. We're not looking at entire strategies. And so when we face a board state that we've never seen before, because the model was not trained on strategy, it sort of will get stuck."},{"start":627.27,"text":"Okay, and this is an example of a perfect application for reinforcement learning because reinforcement learning is all about delayed labels and making sequences of good decisions. So if you had to remember in one sentence what's RL, RL is making good sequences of decisions. Sequences of good decisions, sorry. And do that automatically."},{"start":661.81,"text":"Another way to look at it is the difference between classic supervised learning and RL. In classic supervised learning, you teach by example. In reinforcement learning, you teach by experience, which is also a different concept. You're not just showing cats and non-cats to a model. You're actually letting the model experience an environment until it figures out what were the best decisions it made and learns from them."}],"speech_gaps":[],"frame":"../frames/v062/004.webp","frame_time":529.15},{"title":"强化学习的应用与基本概念","segments":[{"id":27,"text":"Some examples of reinforcement learning applications. I'm going to mention them. We have gaming, of course, that we already covered. What are other applications of AI where we need good sequences of decisions? Yes.","zh":"强化学习的一些应用示例。我要提一下。我们有游戏，当然，我们已经讲过了。还有哪些人工智能应用需要良好的决策序列？是的。","start":693.35,"end":709.93},{"id":28,"text":"Autonomous driving? Yeah, correct. I mean, in driving, you could argue RL could work and there's some RL going on. But what you mean, I think, is you have some sort of a dynamic planning algorithm that allows you to strategize. If you see a red light ahead, you might start slowing down over time. But maybe it will turn green, so you might not slow down completely. This is an example of a strategy that you need, of course. Yeah.","zh":"自动驾驶？对，没错。我的意思是，在驾驶中，你可以争论强化学习可以起作用，并且有一些强化学习正在应用。但你指的是，你有一种动态规划算法，让你能够制定策略。如果你看到前方有红灯，你可能会逐渐减速。但也许它会变绿，所以你可能不会完全减速。这是一个当然需要的策略示例。对的。","start":711.33,"end":738.71},{"id":29,"text":"robotic controlling that's a great example also related to autonomous driving but imagine you want to teach to a robot to move from point a to point b the number of good decisions that the robot needs to make in terms of moving each of their joints is tremendous like it's actually super unlikely that a robot would move from a to b if it's not trained to make good sequences of decisions what else actually the biggest one nobody mentioned","zh":"机器人控制也是一个很好的例子，与自动驾驶相关，但想象一下，你想教一个机器人从点a移动到点b，机器人在移动每个关节时需要做出的优质决策数量是巨大的，实际上，如果未经训练做出良好的决策序列，机器人从a到b移动的可能性非常低。还有什么，实际上最大的一个没人提到。","start":740.04,"end":774.09},{"id":30,"text":"Yeah. It's not a great application. I don't like it, but it happens to be the biggest one over enforcement learning. Yeah. Yeah. Yeah. Advertisement. Yeah. Marketing. You're right. So yeah, we talked about robotics. Advertisement is another example. Advertisement is a long game. Like companies are showing you multiple ads before you buy. And in fact, the reason reinforcement learning is important is because","zh":"对的。这不是一个很好的应用。我不喜欢它，但它恰好是强化学习中最大的一个应用。对的。对的。对的。广告。对的。营销。你说得对。所以是的，我们谈到了机器人。广告是另一个例子。广告是一个长期的游戏。比如，公司在你购买之前会展示多个广告。事实上，强化学习之所以重要，是因为","start":775.16,"end":809.53},{"id":31,"text":"They're planning a strategy that might lead a buyer to execute a purchase over time, and it requires long-term thinking. So there's a lot of reinforcement learning applied to marketing, advertisement, real-time bidding processes, etc. Okay, clear on what RLE is and how it differs from classic supervised learning?","zh":"它们正在制定一个可能引导买家在一段时间内完成购买的策略，这需要长期思考。因此，强化学习被广泛应用于营销、广告、实时竞价流程等。好的，清楚强化学习是什么以及它与经典监督学习有何不同吗？","start":810.28,"end":832.57},{"id":32,"text":"So let's put some vocabulary around that concept. In reinforcement learning, you have an agent and the agent interacts with an environment. As the agent interacts with the environment, the agent will perform certain actions that we will denote A, T, where T is a time step. And the environment will show you states.","zh":"那么，让我们围绕这个概念建立一些术语。在强化学习中，你有一个智能体，智能体与环境进行交互。当智能体与环境交互时，智能体会执行某些动作，我们将这些动作表示为A，T，其中T是一个时间步。环境会展示给你状态。","start":835.02,"end":861.82}],"notes":["本段讨论了强化学习（RL）在多个领域的应用，包括自动驾驶、机器人控制、广告和市场营销。教师指出，自动驾驶需要动态规划算法来制定策略，例如在遇到红灯时逐步减速，同时考虑可能变绿的情况。机器人控制也是一个重要应用，因为机器人从一点移动到另一点需要做出大量决策。广告和市场营销被提及为长期策略的应用，公司通过多次广告展示来引导消费者购买，这需要强化学习的长期思维能力。","教师进一步解释了强化学习的基本概念，包括智能体（agent）与环境（environment）的交互。智能体在每个时间步（T）执行动作（A），环境则返回状态（state）。这一部分为后续讲解强化学习的框架和机制奠定了基础。","在讨论广告和市场营销时，教师强调了强化学习在长期策略规划中的重要性，例如在实时竞价（real-time bidding）过程中，系统需要根据用户行为和广告效果进行动态调整，以最大化广告效果。这体现了强化学习在实际应用中的灵活性和适应性。","教师通过提问确认学生是否理解强化学习（RLE）与传统监督学习的区别，这表明课程注重概念理解与实际应用的结合。通过这种方式，教师引导学生思考强化学习的核心思想，即通过与环境的交互来学习最优策略。","在讲解强化学习的基本框架时，教师使用了术语如智能体、环境、时间步和动作，这些术语是理解强化学习的基础。通过明确这些概念，教师帮助学生构建了强化学习的理论框架。","教师在讲解过程中强调了强化学习与监督学习的根本区别，即强化学习依赖于与环境的交互和奖励信号，而监督学习依赖于标注数据。这种对比有助于学生理解两种学习范式的不同应用场景和优势。"],"formulas":[],"uncertainties":["over enforcement learning"],"diagram":"none","start":693.35,"end":861.82,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":693.35,"text":"Some examples of reinforcement learning applications. I'm going to mention them. We have gaming, of course, that we already covered. What are other applications of AI where we need good sequences of decisions? Yes."},{"start":711.33,"text":"Autonomous driving? Yeah, correct. I mean, in driving, you could argue RL could work and there's some RL going on. But what you mean, I think, is you have some sort of a dynamic planning algorithm that allows you to strategize. If you see a red light ahead, you might start slowing down over time. But maybe it will turn green, so you might not slow down completely. This is an example of a strategy that you need, of course. Yeah."},{"start":740.04,"text":"robotic controlling that's a great example also related to autonomous driving but imagine you want to teach to a robot to move from point a to point b the number of good decisions that the robot needs to make in terms of moving each of their joints is tremendous like it's actually super unlikely that a robot would move from a to b if it's not trained to make good sequences of decisions what else actually the biggest one nobody mentioned"},{"start":775.16,"text":"Yeah. It's not a great application. I don't like it, but it happens to be the biggest one over enforcement learning. Yeah. Yeah. Yeah. Advertisement. Yeah. Marketing. You're right. So yeah, we talked about robotics. Advertisement is another example. Advertisement is a long game. Like companies are showing you multiple ads before you buy. And in fact, the reason reinforcement learning is important is because"},{"start":810.28,"text":"They're planning a strategy that might lead a buyer to execute a purchase over time, and it requires long-term thinking. So there's a lot of reinforcement learning applied to marketing, advertisement, real-time bidding processes, etc. Okay, clear on what RLE is and how it differs from classic supervised learning?"},{"start":835.02,"text":"So let's put some vocabulary around that concept. In reinforcement learning, you have an agent and the agent interacts with an environment. As the agent interacts with the environment, the agent will perform certain actions that we will denote A, T, where T is a time step. And the environment will show you states."}],"speech_gaps":[],"frame":"../frames/v062/005.webp","frame_time":705.35},{"title":"状态、观察与转移的概念","segments":[{"id":33,"text":"that transition from timestep T to timestep T plus one. So subject to an action AT, an environment may transition from ST to ST plus one. You can think of the game of Go. I take the action of putting my blackstone on a certain grid intersection and the environment has changed. The state has changed. It moved from state timestep T to timestep T plus one where my stone is on the grid.","zh":"从时间步 T 转移到时间步 T 加 1 的过程。因此，在采取动作 AT 的情况下，环境可能会从状态 ST 转移到 ST 加 1。你可以把围棋游戏想象成一个例子。我采取在某个网格交叉点放置黑子的动作，环境就会发生变化。状态发生了变化。它从时间步 T 的状态转移到了时间步 T 加 1 的状态，此时我的棋子位于网格上。","start":862.71,"end":887.43},{"id":34,"text":"After that state update happens, there's two things that the agent observes. The agent observes an observation that we will note OT and a reward, RT. So those are the vocabulary words. And of course, the goal of the agent will be to maximize the rewards. One thing to know about the observation, we'll talk about it a little more. The observation sometimes is equal to the state.","zh":"在状态更新之后，智能体会观察到两件事情。智能体会观察到一个我们记作 OT 的观察值和一个奖励 RT。这些就是我们所说的术语。当然，智能体的目标是最大化奖励。关于观察值，我们稍后会进一步讨论。观察值有时等于状态。","start":888.41,"end":921.03},{"id":35,"text":"Can someone guess why we might need two concepts instead of a single concept? Why is it important to have a state and an observation? Yes.","zh":"有人能猜猜为什么我们需要两个概念而不是一个概念吗？为什么拥有状态和观察值这两个概念是重要的？是的。","start":921.76,"end":934.22},{"id":36,"text":"Yes, correct. So in some cases, the environment may not be fully transparent to the user. And so, for example, in chess or in Go, the observation is actually equal to the state. You see everything on your board. All the information is available to you. If you play League of Legends or Starcraft.","zh":"是的，正确。在某些情况下，环境可能对用户不完全透明。例如，在国际象棋或围棋中，观察值实际上等于状态。你能够看到棋盘上的所有内容。所有信息都对你可用。如果你玩《英雄联盟》或《星际争霸》。","start":937.58,"end":959.28},{"id":37,"text":"You know the concept of, I think in English it's called like a cloud or a fog. I think it's a fog. You only see certain parts of the map until you have explored everything or until your friends are sort of visiting the other parts of the map. And so the observation is actually less information than the states of the environment.","zh":"你知道这个概念，我想在英文中它被称为云或雾。我认为是雾。你只能看到地图的某些部分，直到你探索了所有区域或直到你的朋友访问了地图的其他部分。因此，观察值实际上包含的信息比环境的状态要少。","start":959.93,"end":979.89},{"id":38,"text":"Okay, and then the last piece of vocabulary is a transition. When I refer to a transition, I refer of the process of getting from state T to state T plus one, which means we're in state T, the agent takes an action AT, it observes OT and a reward RT, and it transitions to the next state as T plus one. Question?","zh":"好的，然后最后一个术语是转移。当我提到转移时，我指的是从状态 T 转移到状态 T 加 1 的过程。这意味着我们处于状态 T，智能体采取动作 AT，观察到 OT 和奖励 RT，并转移到下一个状态 T 加 1。问题？","start":981.12,"end":999.34},{"id":39,"text":"uh wait what do you mean you mean is there are there examples of uh environment where the state is so large that yeah possibly for computational reasons yeah yeah you might have games i mean look at open world games","zh":"嗯，等等，你是说，你是说有没有环境的例子，其中状态非常大，是的，可能出于计算原因，是的，是的，你可能会有游戏，我的意思是看看开放世界游戏","start":1011.5,"end":1031.34}],"notes":["本段讲授了状态（state）和观察（observation）之间的区别，指出在某些环境中，观察可能不等于状态，因为环境可能不完全透明。例如，在《英雄联盟》或《星际争霸》中，玩家只能看到部分地图信息，而状态则包含所有环境信息。","讲者提到，状态转移（transition）是指从状态T到状态T+1的过程，其中代理执行动作AT，观察到OT和奖励RT，然后转移到下一个状态。这为后续强化学习中的动态建模奠定了基础。","讲者通过提问引导学生思考为何需要区分状态和观察，强调了在部分可观测环境中，观察信息可能不完整，这在实际应用中非常重要。","讲者提到，状态可能非常庞大，因此在计算上可能需要进行简化或近似，例如在开放世界游戏中，状态空间可能过于庞大，导致计算复杂度增加。","讲者通过举例说明了状态和观察的不同，如围棋中观察等于状态，而《星际争霸》中观察不等于状态，这有助于学生理解不同环境下的信息透明度差异。","讲者最后提到，状态转移是强化学习中的核心概念，理解状态转移过程对于建模环境动态至关重要。"],"formulas":[],"uncertainties":["uh wait what do you mean you mean is there are there examples of uh environment where the state is so large that yeah possibly for computational reasons yeah yeah you might have games i mean look at open world games"],"diagram":"none","start":862.71,"end":1031.34,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":862.71,"text":"that transition from timestep T to timestep T plus one. So subject to an action AT, an environment may transition from ST to ST plus one. You can think of the game of Go. I take the action of putting my blackstone on a certain grid intersection and the environment has changed. The state has changed. It moved from state timestep T to timestep T plus one where my stone is on the grid."},{"start":888.41,"text":"After that state update happens, there's two things that the agent observes. The agent observes an observation that we will note OT and a reward, RT. So those are the vocabulary words. And of course, the goal of the agent will be to maximize the rewards. One thing to know about the observation, we'll talk about it a little more. The observation sometimes is equal to the state."},{"start":921.76,"text":"Can someone guess why we might need two concepts instead of a single concept? Why is it important to have a state and an observation? Yes."},{"start":937.58,"text":"Yes, correct. So in some cases, the environment may not be fully transparent to the user. And so, for example, in chess or in Go, the observation is actually equal to the state. You see everything on your board. All the information is available to you. If you play League of Legends or Starcraft."},{"start":959.93,"text":"You know the concept of, I think in English it's called like a cloud or a fog. I think it's a fog. You only see certain parts of the map until you have explored everything or until your friends are sort of visiting the other parts of the map. And so the observation is actually less information than the states of the environment."},{"start":981.12,"text":"Okay, and then the last piece of vocabulary is a transition. When I refer to a transition, I refer of the process of getting from state T to state T plus one, which means we're in state T, the agent takes an action AT, it observes OT and a reward RT, and it transitions to the next state as T plus one. Question?"},{"start":1011.5,"text":"uh wait what do you mean you mean is there are there examples of uh environment where the state is so large that yeah possibly for computational reasons yeah yeah you might have games i mean look at open world games"}],"speech_gaps":[],"frame":"../frames/v062/006.webp","frame_time":874.71},{"title":"强化学习中的环境与奖励设计","segments":[{"id":40,"text":"Like, truly, you could argue, I don't know, there are some games where you might press start and you see the entire environment. But who cares of what's happening 20,000 kilometers west of you if you're in a certain location? That might not influence your strategy. So you might actually put some sort of a, you know, trust circle or like some sort of a circle in which you observe, which you think has 99% of the information you need, possibly for computational reasons. That's a good point.","zh":"比如，真的，你可以争论说，我不知道，有些游戏中你可能按下开始键后就能看到整个环境。但如果你处于某个位置，那么你关心的是20,000公里西边发生了什么吗？这可能不会影响你的策略。因此，你实际上可能会设定某种信任范围，或者某种范围，在这个范围内你观察到的信息，你认为有99%是你需要的，可能出于计算上的原因。这是一个很好的观点。","start":1031.99,"end":1060.31},{"id":41,"text":"Okay, let's get to a practical example of a reinforcement learning algorithm and develop it together. This example is called recycling is good because recycling is good, but also because it's a simple example illustrative of reinforcement learning. So let's say we have a small environment with five states. There is a starting state marked in brown, which is state two. It's our initial state.","zh":"好的，让我们来看一个强化学习算法的实际例子，并一起开发它。这个例子之所以叫做『回收是好的』，是因为回收是好的，同时也是因为它是一个简单的例子，能够说明强化学习。假设我们有一个包含五个状态的小环境。有一个起始状态，用棕色标记，是状态二，这是我们初始的状态。","start":1061.73,"end":1091.16},{"id":42,"text":"And then on the left side, you have state one, which is garbage. And it's great to get to the garbage because you're going to be able to put in the garbage the stuff that you have in your hands. You're trying to throw away some garbage and the garbage kind of happens to be there. And so we would expect...","zh":"然后在左边，你有状态一，这是一个垃圾状态。到达垃圾状态是很好的，因为你能够把手里拿着的东西扔进垃圾箱。你试图扔掉一些垃圾，而垃圾恰好就在那里。因此，我们预期……","start":1092.07,"end":1114.89},{"id":43,"text":"there to be a reward on the other side if you actually go to the right you might pass by state three which is empty you might pass by state four where there is a chocolate packaging that is left on the ground that you can pick up and it's good to pick it up and then on stage five state five you have the recycled bean which is more valuable than the garbage can because you can recycle and you should get better rewards for that","zh":"在你向右移动时，另一侧会有奖励。如果你真的向右移动，你可能会经过状态三，这是一个空的状态；你可能会经过状态四，那里有一块巧克力包装纸躺在地上，你可以捡起来，捡起来是好的；然后在状态五，你有可回收的豆子，这比垃圾箱更有价值，因为你能够回收，你应该为此获得更好的奖励。","start":1115.12,"end":1141.44},{"id":44,"text":"So that's our game. In this game, we define a reward that is associated with the type of behaviors that we want the agents to learn. And the reward is as follows. That's just one example. Plus two for throwing your garbage in the normal can. Plus one for picking up the chocolate packaging. And plus 10 if you manage to make it to the recycle bin. Is it clear?","zh":"这就是我们的游戏。在这个游戏中，我们定义了一个与我们希望智能体学习的行为类型相关的奖励。奖励如下。这只是其中一个例子。扔垃圾进普通垃圾桶奖励加2分。捡起巧克力包装纸奖励加1分。如果你成功到达回收箱，奖励加10分。清楚吗？","start":1142.54,"end":1166.32},{"id":45,"text":"Now, the goal will be, and that's the case in reinforcement learning oftentimes, to maximize the return. We define formally the return, but think about it as maximize the amount of rewards that you get as you go through this journey and you make your decisions. In this specific game, we have five states and there's three types of state.","zh":"现在，我们的目标是最大化回报，这在强化学习中很常见。我们正式地定义了回报，但可以将其理解为在进行决策的过程中，最大化所获得的奖励总量。在这个特定游戏中，我们有五个状态，而且有三种类型的状态。","start":1168.0,"end":1190.09}],"notes":["本段讲解了强化学习中环境设计的基本概念，包括状态划分和奖励机制。讲者提到一个包含五个状态的简单环境，其中状态二为初始状态，状态一为垃圾，状态三为空，状态四为巧克力包装，状态五为可回收物。讲者强调了不同状态的奖励值，如将垃圾投入普通垃圾桶获得+2奖励，捡起巧克力包装获得+1奖励，到达可回收物桶获得+10奖励。","讲者通过这个例子说明了强化学习中奖励函数的设计原则，即奖励应与期望的行为相匹配。例如，将垃圾投入普通垃圾桶的行为被赋予正奖励，而捡起巧克力包装和到达可回收物桶则分别赋予不同的奖励值，以引导智能体学习最优策略。","讲者指出，奖励函数的设计是强化学习中的关键部分，因为它直接影响智能体的学习目标。在本例中，奖励函数的设计旨在鼓励智能体完成特定任务，如回收垃圾，从而获得更高的累积奖励。","讲者提到，这个例子虽然简单，但能够很好地说明强化学习的基本原理，即通过奖励机制引导智能体学习如何在环境中做出最优决策。这种设计方法适用于更复杂的实际问题。","讲者还强调了奖励函数的可扩展性，即该设计可以应用于更复杂的环境，只需调整状态和奖励值即可。这种灵活性是强化学习方法的一个重要优势。","最后，讲者通过提问确认学生是否理解奖励函数的设计，这表明在教学过程中注重互动和反馈，以确保学生能够掌握核心概念。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1031.99,"end":1190.09,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1031.99,"text":"Like, truly, you could argue, I don't know, there are some games where you might press start and you see the entire environment. But who cares of what's happening 20,000 kilometers west of you if you're in a certain location? That might not influence your strategy. So you might actually put some sort of a, you know, trust circle or like some sort of a circle in which you observe, which you think has 99% of the information you need, possibly for computational reasons. That's a good point."},{"start":1061.73,"text":"Okay, let's get to a practical example of a reinforcement learning algorithm and develop it together. This example is called recycling is good because recycling is good, but also because it's a simple example illustrative of reinforcement learning. So let's say we have a small environment with five states. There is a starting state marked in brown, which is state two. It's our initial state."},{"start":1092.07,"text":"And then on the left side, you have state one, which is garbage. And it's great to get to the garbage because you're going to be able to put in the garbage the stuff that you have in your hands. You're trying to throw away some garbage and the garbage kind of happens to be there. And so we would expect..."},{"start":1115.12,"text":"there to be a reward on the other side if you actually go to the right you might pass by state three which is empty you might pass by state four where there is a chocolate packaging that is left on the ground that you can pick up and it's good to pick it up and then on stage five state five you have the recycled bean which is more valuable than the garbage can because you can recycle and you should get better rewards for that"},{"start":1142.54,"text":"So that's our game. In this game, we define a reward that is associated with the type of behaviors that we want the agents to learn. And the reward is as follows. That's just one example. Plus two for throwing your garbage in the normal can. Plus one for picking up the chocolate packaging. And plus 10 if you manage to make it to the recycle bin. Is it clear?"},{"start":1168.0,"text":"Now, the goal will be, and that's the case in reinforcement learning oftentimes, to maximize the return. We define formally the return, but think about it as maximize the amount of rewards that you get as you go through this journey and you make your decisions. In this specific game, we have five states and there's three types of state."}],"speech_gaps":[],"frame":"../frames/v062/007.webp","frame_time":1043.99},{"title":"强化学习中的奖励与折扣","segments":[{"id":46,"text":"initial states, we have normal states, and we have in blue terminal states. When you get to a terminal state in reinforcement learning, it will typically end the game. It will end one episode of the game. We'll move to another episode, you'll get back to the starting state or initial state, and you'll redo another episode. The possible actions for our agent here are going to be fairly simple, left and right.","zh":"初始状态，我们有普通状态，还有用蓝色表示的终端状态。当你在强化学习中到达终端状态时，通常会结束游戏。它会结束一次游戏的一局。我们将进入另一局，你会回到起始状态或初始状态，并重新进行一次游戏。在这里，我们的智能体可能的动作将非常简单，即左和右。","start":1191.4,"end":1219.08},{"id":47,"text":"And we're going to add an additional rule that is important, which is that the garbage collector comes in three minutes, and it takes a minute to get from one state to the other.","zh":"我们将添加一个重要的额外规则，即垃圾收集器会在三分钟后到来，从一个状态到另一个状态需要一分钟的时间。","start":1221.07,"end":1240.45},{"id":48,"text":"Yeah. Otherwise, you just go back and forth between stage three and stage four. You just collect a bunch of chocolate packaging and you never make it to the bin. And so it's not what we want. OK, so how do we define the long term return? The long term return is going to be defined as capital R, which is the sum of rewards.","zh":"是的。否则，你只会在这第三阶段和第四阶段之间来回切换。你只会收集一堆巧克力包装，却永远无法到达垃圾桶。因此，这不是我们想要的。好的，那么如何定义长期回报？长期回报将被定义为大写R，即奖励的总和。","start":1243.21,"end":1267.3},{"id":49,"text":"With a discount. Discount is a very important concept in reinforcement learning. It's also a very natural concept to think about. Can you think of what the discount would represent for humans? Do you have an example of what it could be?","zh":"带有折扣。折扣是强化学习中一个非常重要的概念。它也是一个非常自然的概念。你能想到折扣对人类来说代表什么吗？你能举一个它可能是什么的例子吗？","start":1268.42,"end":1285.88},{"id":50,"text":"Yeah, the value of money and time. Exactly. Or the energy that a robot might have. Things like that. Yeah. You would rather get a dollar now than a dollar in 10 years knowing that there is some inflation, for example. That's the example of a discount. In reinforcement learning, it's the same. Let's say you have a strategy that takes so much time. You need to discount it because your robot might lose energy as it's going through it, for example. Discounts can vary.","zh":"是的，金钱和时间的价值。没错。或者机器人可能拥有的能量。诸如此类的事情。是的。你宁愿现在得到一美元，而不是十年后得到一美元，知道例如存在通货膨胀。这就是折扣的例子。在强化学习中，也是如此。假设你有一个策略需要花费很多时间。你需要对其进行折扣，因为你的机器人在执行过程中可能会失去能量，例如。折扣可以变化。","start":1289.16,"end":1316.42},{"id":51,"text":"But they stay between zero and one. So what is the best strategy to follow if gamma, the discount, is equal to one, meaning time doesn't matter here if it's longer or shorter. Just want to maximize the return. Best strategy to follow. You want to give it a try? Someone who hasn't spoken yet? Yes. Bounce around, but remember the rule of three minutes.","zh":"但它们始终保持在零和一之间。那么，如果折扣因子伽马等于一，即时间在这里不重要，无论长短，你只想最大化回报。最佳策略是什么？你想要尝试一下吗？还没有发言的人？是的。来回移动，但请记住三分钟的规则。","start":1317.07,"end":1366.36}],"notes":["本段讲解了强化学习中奖励的长期回报定义，强调了折扣因子（gamma）的重要性。折扣因子用于衡量未来奖励的价值，其值通常介于0和1之间，表示时间对奖励价值的影响。","课堂中提到，折扣因子可以类比为人类对金钱和时间价值的认知，例如人们更倾向于现在获得一美元而不是十年后获得一美元，因为存在通货膨胀等因素。同样，在强化学习中，折扣因子用于考虑策略执行过程中可能的资源损耗，如机器人能量的消耗。","当折扣因子gamma等于1时，表示时间对奖励价值没有影响，此时策略的目标是最大化总奖励。课堂中通过提问引导学生思考，如何在没有时间折扣的情况下制定最佳策略。","课堂中还提到，垃圾收集器的规则（三分钟到达）和状态转移时间（一分钟）是游戏设计中的关键因素，它们影响了策略的制定和奖励的计算。","课堂通过提问和举例，帮助学生理解折扣因子的实际意义，并引导他们思考如何在不同折扣因子下制定最优策略。","课堂中强调了折扣因子的取值范围（0到1），并指出其在强化学习中的核心作用，即平衡当前和未来奖励的价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1191.4,"end":1366.36,"asr_flags":[],"math_clarifications":["原文未提供完整的数学公式，仅描述了概念。长期回报应定义为带有折扣因子的奖励总和，即 $ R = \\sum_{t=0}^{\\infty} \\gamma^t r_t $，其中 $ \\gamma $ 是折扣因子，且 $ 0 \u003c \\gamma \u003c 1 $。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1191.4,"text":"initial states, we have normal states, and we have in blue terminal states. When you get to a terminal state in reinforcement learning, it will typically end the game. It will end one episode of the game. We'll move to another episode, you'll get back to the starting state or initial state, and you'll redo another episode. The possible actions for our agent here are going to be fairly simple, left and right."},{"start":1221.07,"text":"And we're going to add an additional rule that is important, which is that the garbage collector comes in three minutes, and it takes a minute to get from one state to the other. Why is that an important rule to add to the game? Can you guess? Yeah?"},{"start":1243.21,"text":"Yeah. Otherwise, you just go back and forth between stage three and stage four. You just collect a bunch of chocolate packaging and you never make it to the bin. And so it's not what we want. OK, so how do we define the long term return? The long term return is going to be defined as capital R, which is the sum of rewards."},{"start":1268.42,"text":"With a discount. Discount is a very important concept in reinforcement learning. It's also a very natural concept to think about. Can you think of what the discount would represent for humans? Do you have an example of what it could be?"},{"start":1289.16,"text":"Yeah, the value of money and time. Exactly. Or the energy that a robot might have. Things like that. Yeah. You would rather get a dollar now than a dollar in 10 years knowing that there is some inflation, for example. That's the example of a discount. In reinforcement learning, it's the same. Let's say you have a strategy that takes so much time. You need to discount it because your robot might lose energy as it's going through it, for example. Discounts can vary."},{"start":1317.07,"text":"But they stay between zero and one. So what is the best strategy to follow if gamma, the discount, is equal to one, meaning time doesn't matter here if it's longer or shorter. Just want to maximize the return. Best strategy to follow. You want to give it a try? Someone who hasn't spoken yet? Yes. Bounce around, but remember the rule of three minutes."}],"speech_gaps":[],"frame":"../frames/v062/008.webp","frame_time":1203.4},{"title":"强化学习中的策略与Q表","segments":[{"id":52,"text":"You can't bounce around because you will not get to the terminal state before the time allotted is done. But that would be a good idea if this rule was not true. What else could you do? Any idea? It's an easy one, no? Not too hard. Best strategy for gamma equals one. And give me also the maximum reward you would get. People are sleepy today, yeah? Go to the recycle, so write, write.","zh":"你不能到处乱跑，因为你在规定时间内无法到达终端状态。但如果这个规则不成立，那会是一个好主意。你还能做什么？有什么想法吗？这很简单，对吧？不难。对于 gamma 等于 1 的情况，最佳策略是什么？同时，也告诉我你能得到的最大奖励是多少。今天大家有点困，对吧？去回收站，所以写下来，写下来。","start":1367.47,"end":1412.61},{"id":53,"text":"Right. Yeah, that's right. Thank you. Right, right, right. And then what's your total reward? Yeah, that's right. 11. So that's where we get terminal state and we grab our reward of 11. Very good. Now, assuming 0.9 for gamma, we're going to complexify things a little bit. I'm going to walk you through a very simple algorithm that...","zh":"对的。没错，谢谢。对，对，对。那么你的总奖励是多少？没错，就是这个。11。所以我们到达终端状态并获取了奖励 11。很好。现在，假设 gamma 等于 0.9，我们将稍微复杂化问题。我要带你走过一个非常简单的算法，","start":1413.14,"end":1442.59},{"id":54,"text":"you know, allows us to sort of determine the best strategy and we will put our numbers in a matrix. So for instance, we'll define a Q table.","zh":"你明白，它允许我们大致确定最佳策略，我们将把数字放在一个矩阵中。例如，我们将定义一个 Q 表。","start":1442.85,"end":1452.49},{"id":55,"text":"And Q stands, you know, it's a value function where the name Q learning, Q star, you might have heard all of these things come from Q learning. And so let's say we have a Q table, which has the size of number of states times number of actions. So five rows, two columns in our case. Every entry of the Q table.","zh":"Q 表的名称，你知道，是一个价值函数，名字 Q 学习，Q 星，你可能听过所有这些都来自 Q 学习。假设我们有一个 Q 表，其大小是状态数乘以动作数。在我们的情况下，是五行两列。Q 表中的每一个条目","start":1453.54,"end":1481.16},{"id":56,"text":"is essentially representing how good it is to take action A in state B. Do you agree that if we had a table with these numbers, essentially we solved the problem? Meaning at any point, the agent can just look in the table, I am in state 3, let's look at column 1, that would tell me the value of action 1, and let's look at column 2, it would tell me the value of action 2. So I have everything I need to make my decisions.","zh":"本质上代表了在状态 B 中采取动作 A 的好坏程度。你同意如果有一个包含这些数字的表格，我们实际上已经解决了问题吗？意思是，在任何时刻，智能体只需查看表格，我处于状态 3，查看第一列，这会告诉我动作 1 的价值，查看第二列，这会告诉我动作 2 的价值。因此，我拥有做出决策所需的一切。","start":1482.06,"end":1511.79},{"id":57,"text":"So that table is really the thing you want to find in this exercise. Now, the way we will find the table is sort of using a backtracking algorithm where we might actually codify the environment as a tree and traverse the tree. So here's what it looks like. I start in S2 and I have two options ahead of me. I can go to the left where I will get a reward of two. It's an immediate reward. The immediate reward is not discounted.","zh":"因此，这个表格是你在这个练习中想要找到的东西。我们找到这个表格的方式大致是使用一种回溯算法，我们可能会将环境编码为一棵树并遍历这棵树。这就是它的样子。我从 S2 开始，我面前有两个选择。我可以向左走，那里我会得到奖励 2。这是一个即时奖励。即时奖励是没有折扣的。","start":1514.09,"end":1542.09}],"notes":["本段讲授了强化学习中策略选择与奖励计算的基本概念。讲者指出，当gamma等于1时，最优策略是直接到达终端状态以获得最大奖励，例如在例子中获得11的奖励。同时，讲者提到当gamma为0.9时，问题会变得更加复杂，需要引入更复杂的算法。","讲者介绍了Q学习的基本概念，即Q表作为价值函数的表示方式。Q表的大小由状态数和动作数决定，每个单元格表示在特定状态下采取特定动作的价值。讲者强调，如果拥有完整的Q表，智能体可以在任何时刻根据当前状态和动作选择最优策略。","讲者进一步说明了如何通过回溯算法来构建Q表，即将环境建模为树结构并进行遍历。在例子中，智能体从状态S2出发，有两个选择，其中向左移动会立即获得奖励2，且该奖励未被折扣。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1367.47,"end":1542.09,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1367.47,"text":"You can't bounce around because you will not get to the terminal state before the time allotted is done. But that would be a good idea if this rule was not true. What else could you do? Any idea? It's an easy one, no? Not too hard. Best strategy for gamma equals one. And give me also the maximum reward you would get. People are sleepy today, yeah? Go to the recycle, so write, write."},{"start":1413.14,"text":"Right. Yeah, that's right. Thank you. Right, right, right. And then what's your total reward? Yeah, that's right. 11. So that's where we get terminal state and we grab our reward of 11. Very good. Now, assuming 0.9 for gamma, we're going to complexify things a little bit. I'm going to walk you through a very simple algorithm that..."},{"start":1442.85,"text":"you know, allows us to sort of determine the best strategy and we will put our numbers in a matrix. So for instance, we'll define a Q table."},{"start":1453.54,"text":"And Q stands, you know, it's a value function where the name Q learning, Q star, you might have heard all of these things come from Q learning. And so let's say we have a Q table, which has the size of number of states times number of actions. So five rows, two columns in our case. Every entry of the Q table."},{"start":1482.06,"text":"is essentially representing how good it is to take action A in state B. Do you agree that if we had a table with these numbers, essentially we solved the problem? Meaning at any point, the agent can just look in the table, I am in state 3, let's look at column 1, that would tell me the value of action 1, and let's look at column 2, it would tell me the value of action 2. So I have everything I need to make my decisions."},{"start":1514.09,"text":"So that table is really the thing you want to find in this exercise. Now, the way we will find the table is sort of using a backtracking algorithm where we might actually codify the environment as a tree and traverse the tree. So here's what it looks like. I start in S2 and I have two options ahead of me. I can go to the left where I will get a reward of two. It's an immediate reward. The immediate reward is not discounted."}],"speech_gaps":[],"frame":"../frames/v062/009.webp","frame_time":1379.47},{"title":"即时奖励与折扣回报的计算","segments":[{"id":58,"text":"It's an immediate reward. Remember the formula for R. The immediate reward, R0, is not discounted. That would take me to S1. It's a terminal state, so there's nothing to do after.","zh":"这是一个即时奖励。请记住R的公式。即时奖励R0是没有折扣的。这会带我到S1。这是一个终端状态，所以在之后没有可做的事情。","start":1542.65,"end":1556.01},{"id":59,"text":"Second option, I go to the right and I get a reward of 0. That's my immediate reward and I end up in state 3. State 3 is not a terminal state, so I can go and do the same exercise from state 3. In state 3, I have two options. I can go to the left where I would see a reward of 0 and I will end up in S2. Or I will go to the right and I will get an immediate reward of plus 1.","zh":"第二个选项，我向右移动并获得一个奖励值为0。这是我的即时奖励，我最终到达状态3。状态3不是一个终端状态，因此我可以从状态3再次进行相同的练习。在状态3，我有两个选项。我可以向左移动，此时会看到一个奖励值为0，并最终到达S2。或者我可以向右移动，并获得一个即时奖励值为加1。","start":1558.23,"end":1583.11},{"id":60,"text":"It's an immediate reward. We're not discounting it. I will end up in S4. And from S4, again, I have two options. Back to the left to S3 with zero reward or to the right with the amazing reward of plus 10 and the terminal state of S5. So that's my map of immediate rewards.","zh":"这是一个即时奖励。我们不对其进行折扣。我最终会到达S4。从S4，我再次有两个选项。向左回到S3，奖励值为0，或者向右移动，获得一个惊人的奖励值为加10，并到达终端状态S5。这就是我的即时奖励地图。","start":1583.74,"end":1604.64},{"id":61,"text":"That's not my discounted return. So what we're going to do now is we're going to backtrack up the tree in order to compute the discounted returns. Actually, if I'm in S3 right here, I see that I can get an immediate reward in S4 of plus one. And I want to compute my maximum return that I can get from when I'm in S3. My maximum return is that in S4, I could get a plus 10.","zh":"这并不是我的折扣回报。现在，我们将回溯树状结构以计算折扣回报。实际上，如果我现在在S3，我看到我可以从S4获得一个即时奖励值为加1。我想计算当我处于S3时所能获得的最大回报。我的最大回报是，在S4我可以获得加10。","start":1605.37,"end":1634.12},{"id":62,"text":"Right? But I need to discount that. My discount is 0.9, so I multiply 10 by 0.9. What it tells me is that from S4, I can expect 9. Plus 1, which I get as an immediate reward from moving from S3 to S4, I can update this number to 10. Meaning from S3, the best you can hope for is a discounted return of 10, which is 1 plus 0.9 times 10. Everyone follows?","zh":"对吗？但我需要对这个奖励进行折扣。我的折扣因子是0.9，因此我将10乘以0.9。这告诉我，从S4我可以期望获得9。加上从S3移动到S4所获得的即时奖励1，我可以将这个数值更新为10。这意味着从S3，最好的期望折扣回报是10，即1加上0.9乘以10。大家明白吗？","start":1634.93,"end":1663.02},{"id":63,"text":"Now let's do the same exercise one step before in S2. In S2, I have an immediate reward of zero for going to S3 or an immediate reward of two for going to S1. S1 is not going to be worth it. We already know that because when I'm in S3, I can actually expect 10, which I have to discount.","zh":"现在，让我们在S2进行同样的练习，向前一步。在S2，我向S3移动的即时奖励为0，或者向S1移动的即时奖励为2。S1不会值得这么做。我们已经知道这一点，因为在S3，我可以期望获得10，这需要进行折扣。","start":1664.43,"end":1691.49},{"id":64,"text":"0.9910 gives me 9, plus 0 immediate reward from S2 to S3. That tells me that the discounted return from state 2, which is our initial state, is 9. Go follow. Just a simple backtracking.","zh":"0.9910给我9，加上从S2到S3的即时奖励0。这告诉我，从状态2（我们的初始状态）的折扣回报是9。大家跟上吗？这只是一个简单的回溯。","start":1692.48,"end":1709.25}],"notes":["本段讲解了在强化学习中如何计算折扣回报。首先，讲者指出在状态S3中，可以得到一个即时奖励为1的回报，并且从S4可以得到一个即时奖励为10的回报。由于折扣因子为0.9，因此从S4得到的回报需要乘以0.9，得到9。加上从S3到S4的即时奖励1，总回报为10。这说明从S3出发，最佳的折扣回报为10。","接着，讲者将计算过程向前推进一步，到状态S2。在S2中，有两种选择：前往S3得到即时奖励0，或者前往S1得到即时奖励2。但S1的回报不如S3，因为从S3可以得到更高的折扣回报。因此，从S2出发，最佳的折扣回报为9，即0.9乘以10（来自S3的回报）。","最后，讲者提到从S2出发的折扣回报为9，并指出这是一个简单的回溯过程。这说明在强化学习中，计算折扣回报需要从终端状态开始，逐步回溯到初始状态，将每个状态的即时奖励与折扣因子相乘，累加得到总回报。","讲者强调了折扣因子的作用，即它决定了未来奖励的重要性。折扣因子越小，未来奖励的权重越低，因此在计算回报时，需要将未来的奖励乘以折扣因子的幂次。"],"formulas":[],"uncertainties":["0.9910"],"diagram":"none","start":1542.65,"end":1709.25,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1542.65,"text":"It's an immediate reward. Remember the formula for R. The immediate reward, R0, is not discounted. That would take me to S1. It's a terminal state, so there's nothing to do after."},{"start":1558.23,"text":"Second option, I go to the right and I get a reward of 0. That's my immediate reward and I end up in state 3. State 3 is not a terminal state, so I can go and do the same exercise from state 3. In state 3, I have two options. I can go to the left where I would see a reward of 0 and I will end up in S2. Or I will go to the right and I will get an immediate reward of plus 1."},{"start":1583.74,"text":"It's an immediate reward. We're not discounting it. I will end up in S4. And from S4, again, I have two options. Back to the left to S3 with zero reward or to the right with the amazing reward of plus 10 and the terminal state of S5. So that's my map of immediate rewards."},{"start":1605.37,"text":"That's not my discounted return. So what we're going to do now is we're going to backtrack up the tree in order to compute the discounted returns. Actually, if I'm in S3 right here, I see that I can get an immediate reward in S4 of plus one. And I want to compute my maximum return that I can get from when I'm in S3. My maximum return is that in S4, I could get a plus 10."},{"start":1634.93,"text":"Right? But I need to discount that. My discount is 0.9, so I multiply 10 by 0.9. What it tells me is that from S4, I can expect 9. Plus 1, which I get as an immediate reward from moving from S3 to S4, I can update this number to 10. Meaning from S3, the best you can hope for is a discounted return of 10, which is 1 plus 0.9 times 10. Everyone follows?"},{"start":1664.43,"text":"Now let's do the same exercise one step before in S2. In S2, I have an immediate reward of zero for going to S3 or an immediate reward of two for going to S1. S1 is not going to be worth it. We already know that because when I'm in S3, I can actually expect 10, which I have to discount."},{"start":1692.48,"text":"0.9910 gives me 9, plus 0 immediate reward from S2 to S3. That tells me that the discounted return from state 2, which is our initial state, is 9. Go follow. Just a simple backtracking."}],"speech_gaps":[],"frame":"../frames/v062/010.webp","frame_time":1554.65},{"title":"队列表与贝尔曼最优方程","segments":[{"id":65,"text":"Now I can copy back this. So S3, I know that when I'm in S3, I can expect zero immediate reward to... Sorry, if I'm in S2, I can expect zero immediate reward plus a discount times the plus nine that I could expect in S3. And so that gives me values that should cover everything that we have in this...","zh":"现在我可以将这个复制回去。所以S3，我知道当我在S3时，我可以期望零即时奖励……抱歉，如果我在S2，我可以期望零即时奖励加上折扣乘以我在S3中可以期望的加九。因此，这给了我应该涵盖我们在此……","start":1710.93,"end":1739.93},{"id":66,"text":"queue table. So I do that backtracking. I copy paste all of that into my queue table all the way up here. And this is what I get. We essentially finish the game at this point. We can look at a certain row. So let's say I'm in state number three. I look on the third row of that queue table and I see that I have two options. If I go back to S2,","zh":"队列表。所以我进行回溯，将所有这些内容复制粘贴到我的队列表的顶部。这就是我得到的结果。我们基本上在这个时候完成了游戏。我们可以查看某一行。比如说，我处于状态三，我查看该队列表的第三行，我看到我有两个选择。如果我回到S2，","start":1740.24,"end":1766.42},{"id":67,"text":"Ultimately, my discounted return will be 8.1, right? If I actually go to S4 on the right, I will get 10 because I will get 1 plus 0.9 times 10, which is 10.","zh":"最终，我的折现回报将是8.1，对吧？如果我实际上向右移动到S4，我将得到10，因为我会得到1加上0.9乘以10，即10。","start":1767.84,"end":1782.73},{"id":68,"text":"So this is a toy example, but it tells you that if you were able to backtrack through the entire environment, you will be able to build a massive queue table and you will be able to give it to your agent to make its decisions. Yeah. Sorry, can you repeat?","zh":"这是一个玩具示例，但它告诉你，如果你能够回溯整个环境，你将能够构建一个巨大的队列表，并将其交给你的智能体以做出决策。是的。抱歉，你能重复一下吗？","start":1784.83,"end":1803.55},{"id":69,"text":"Yeah, here I'm simplifying. I'm not considering the time remaining. But in practice, if I remove the time component, so I remove the fact that there's a three-minute deadline before the garbage collector comes, then this would be slightly more difficult because you would have to do a time series, essentially, of adding the discount times the reward that you collect. Yeah, but I'm simplifying here. And that's why I use the three-minute rule. Any question on the queue table?","zh":"是的，这里我在简化。我没有考虑剩余时间。但在实践中，如果我移除时间因素，也就是移除垃圾回收员在三分钟内到来的限制，这将稍微困难一些，因为你将需要进行一个时间序列，本质上是将折扣乘以你收集的奖励。是的，但我在这里进行简化。这就是我使用三分钟规则的原因。关于队列表有任何问题吗？","start":1806.74,"end":1836.5},{"id":70,"text":"Super. OK, so this was the Q table. And in fact, we can put together our strategy for gamma equals 0.9. The best strategy is still the same. You go to the right and you can expect a return of nine. Now, one of the most important concepts in reinforcement learning is this equation on the board called the Bellman optimality equation.","zh":"很好。好的，这就是Q表。事实上，我们可以为gamma等于0.9组合出我们的策略。最佳策略仍然是相同的。你向右移动，你可以期望一个回报为九。现在，强化学习中最重要的概念之一就是板上的这个方程，称为贝尔曼最优方程。","start":1840.59,"end":1868.46}],"notes":["本段讲解了如何通过回溯法构建队列表（queue table），并展示了如何计算折扣回报。在S2状态下，预期的折扣回报是0加上折扣因子乘以S3的回报，从而得到S2的值。这种回溯方法可以覆盖整个环境的所有状态值。","在S3状态下，队列表的第三行显示了两个选项：返回S2或前往S4。前往S4的折扣回报为10，因为1加上0.9乘以10等于10。这说明在特定状态下，选择最优动作可以最大化预期回报。","该例子是一个玩具模型，但展示了通过回溯整个环境可以构建一个大规模的队列表，供智能体决策使用。这种方法在实际应用中可能需要考虑时间因素，如垃圾回收器的截止时间，这会增加计算复杂度。","在简化模型中，时间因素被忽略，因此计算过程更加直接。但实际应用中，时间序列的处理会增加折扣回报的计算难度，需要考虑时间步长和折扣因子的组合。","最后，课程提到贝尔曼最优方程是强化学习中的核心概念，它描述了最优策略的递归关系，即当前状态的最优值等于当前奖励加上后续状态的最优值的折扣。这为后续的策略优化提供了理论基础。","通过队列表的构建和贝尔曼最优方程的应用，可以系统地分析和优化智能体的决策过程，从而在复杂环境中实现最优策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1710.93,"end":1868.46,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1710.93,"text":"Now I can copy back this. So S3, I know that when I'm in S3, I can expect zero immediate reward to... Sorry, if I'm in S2, I can expect zero immediate reward plus a discount times the plus nine that I could expect in S3. And so that gives me values that should cover everything that we have in this..."},{"start":1740.24,"text":"queue table. So I do that backtracking. I copy paste all of that into my queue table all the way up here. And this is what I get. We essentially finish the game at this point. We can look at a certain row. So let's say I'm in state number three. I look on the third row of that queue table and I see that I have two options. If I go back to S2,"},{"start":1767.84,"text":"Ultimately, my discounted return will be 8.1, right? If I actually go to S4 on the right, I will get 10 because I will get 1 plus 0.9 times 10, which is 10."},{"start":1784.83,"text":"So this is a toy example, but it tells you that if you were able to backtrack through the entire environment, you will be able to build a massive queue table and you will be able to give it to your agent to make its decisions. Yeah. Sorry, can you repeat?"},{"start":1806.74,"text":"Yeah, here I'm simplifying. I'm not considering the time remaining. But in practice, if I remove the time component, so I remove the fact that there's a three-minute deadline before the garbage collector comes, then this would be slightly more difficult because you would have to do a time series, essentially, of adding the discount times the reward that you collect. Yeah, but I'm simplifying here. And that's why I use the three-minute rule. Any question on the queue table?"},{"start":1840.59,"text":"Super. OK, so this was the Q table. And in fact, we can put together our strategy for gamma equals 0.9. The best strategy is still the same. You go to the right and you can expect a return of nine. Now, one of the most important concepts in reinforcement learning is this equation on the board called the Bellman optimality equation."}],"speech_gaps":[],"frame":"../frames/v062/011.webp","frame_time":1722.93},{"title":"贝尔曼最优方程与策略定义","segments":[{"id":71,"text":"Oftentimes, you'll see it's noted as Q star of state S and action A equals R plus gamma times the max of that same function applied to S prime A prime. Let me explain this equation for you because it's super important. This equation is called the optimality equation because your optimal Q table will follow this equation.","zh":"你经常会看到它被记作状态S和动作A的Q星，等于奖励R加上gamma乘以该相同函数应用于S prime和A prime的最大值。让我为你解释这个方程，因为它非常重要。这个方程被称为最优性方程，因为你的最优Q表将遵循这个方程。","start":1869.65,"end":1899.11},{"id":72,"text":"If you have finished the game, this equation can be applied to any state-action pair, and it will still be true. The intuition behind why the Bellman equation is the optimality equation is that if you have the perfect Q function, Q table, and you're in a certain state and you perform a certain action A, you will observe a reward.","zh":"如果你已经完成了游戏，这个方程可以应用于任何状态-动作对，它仍然成立。贝尔曼方程之所以被称为最优性方程的直觉在于，如果你拥有完美的Q函数，Q表，并且你在某个状态中执行某个动作A，你将观察到一个奖励。","start":1899.68,"end":1926.11},{"id":73,"text":"This reward will, you know, you have taken an action, so you would be in a new state. And from that new state, you can repeat what you just did, right? And because you've done the backtracking and stuff like that, you will get this equation to be true because it's the reward plus discount times the best next action that you could be taking. Does that make sense? Any question on that? That's exactly the backtracking that we did, by the way.","zh":"这个奖励，你知道，你已经采取了动作，因此你会进入一个新状态。从这个新状态，你可以重复你刚刚做的事情，对吧？而且因为你已经进行了回溯和类似的操作，你会得到这个方程成立，因为它等于奖励加上折扣乘以你可以在下一个状态中采取的最佳动作。这清楚吗？对此有任何问题吗？顺便说一句，这就是我们之前所做的回溯。","start":1927.98,"end":1957.2},{"id":74,"text":"immediate reward plus discounts times the best possible action that you can take in the next state, S prime. The last concept I cover in terms of vocabulary is the policy. The policy is the function that given your state is going to tell you what to do. And in Q learning, the way these policies define is argmax of Q star.","zh":"即时奖励加上折扣乘以你可以在下一个状态S prime中采取的最佳可能动作。在词汇概念方面，我最后要讲的是策略。策略是一个函数，给定你的状态，会告诉你应该做什么。在Q学习中，这些策略的定义方式是Q星的动作argmax。","start":1958.4,"end":1987.1},{"id":75,"text":"across the action so essentially what it says is like look in the table and look at a certain state s you want the policy which is what you should do it's the function that tells you our best strategy you just look at the two possible actions which one has the highest q value and select that action that's it this is a very simple example but it's the core of","zh":"在动作上进行argmax，因此本质上它说的是，查看表格，查看某个状态s，你想要的策略就是你应该采取的动作，这是一个告诉你最佳策略的函数。你只需查看两个可能的动作，哪一个具有最高的Q值，就选择那个动作。这就是一个非常简单的例子，但它就是核心内容。","start":1988.66,"end":2016.88},{"id":76,"text":"Q learning that, you know, later on you will use policies widely. There's a lot of reinforcement learning algorithms, but this concept of understanding the policies, the function telling us our best strategy in Q learning, it's the argmax of the best Q value in a given state. It tells you which action to take. That's the core thing you need to understand. So remember this Bellman equation because we're going to reuse it.","zh":"Q学习，你知道的，之后你会广泛使用策略。有很多强化学习算法，但理解策略这一概念，即在Q学习中告诉我们最佳策略的函数，它是给定状态下最佳Q值的argmax。它告诉你应该采取哪个动作。这是你需要理解的核心内容。所以记住这个贝尔曼方程，因为我们会再次使用它。","start":2018.04,"end":2040.42}],"notes":["本段讲解了Q学习中策略的定义，即策略是给定状态后选择最优动作的函数，具体表现为在Q表中对所有可能动作取最大值。这是Q学习的核心概念之一，策略通过argmax操作确定最优动作。","讲者提到Q学习中策略的定义是argmax Q值，这与贝尔曼最优方程紧密相关，因为最优策略必须满足贝尔曼最优方程。策略的定义是基于Q值的，而不是直接基于奖励或状态转移。","讲者强调了贝尔曼最优方程的重要性，因为它描述了最优Q函数的结构，即当前奖励加上折扣因子乘以下一状态的最优Q值。这是强化学习中用于更新Q值的核心公式。","讲者通过举例说明了策略的定义，即在给定状态s下，策略会查看所有可能的动作，选择具有最高Q值的动作。这种策略定义是Q学习算法的基础。","讲者提到贝尔曼最优方程与策略的联系，即最优策略必须满足贝尔曼最优方程。这表明策略的定义和贝尔曼方程是相互关联的，策略的更新依赖于贝尔曼方程的正确性。","讲者最后提醒学生记住贝尔曼方程，因为后续内容会频繁使用该方程。这表明贝尔曼方程是强化学习中的核心概念，是理解Q学习和其他算法的基础。"],"formulas":[{"latex":"\\text{Policy} = \\arg\\max_{a} Q^*(s, a)","symbols":"策略是给定状态s下选择具有最高Q值的动作a，即argmax操作","explanation":"公式中的argmax表示在给定状态s下，选择使得Q值最大的动作a。此公式正确表达了策略的定义，符合Q学习中策略的定义方式。","evidence":"immediate reward plus discounts times the best possible action that you can take in the next state, S prime. The last concept I cover in terms of vocabulary is the policy. The policy is the function that given your state is going to tell you what to do. And in Q learning, the way these policies define is argmax of Q star."}],"uncertainties":["Q learning that, you know, later on you will use policies widely."],"diagram":"none","start":1869.65,"end":2040.42,"asr_flags":[],"math_clarifications":["原始文本中提到的Q学习策略定义为argmax Q值，公式中的argmax应使用\\arg\\max而非\\max，以准确表达取最大值对应的动作。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1869.65,"text":"Oftentimes, you'll see it's noted as Q star of state S and action A equals R plus gamma times the max of that same function applied to S prime A prime. Let me explain this equation for you because it's super important. This equation is called the optimality equation because your optimal Q table will follow this equation."},{"start":1899.68,"text":"If you have finished the game, this equation can be applied to any state-action pair, and it will still be true. The intuition behind why the Bellman equation is the optimality equation is that if you have the perfect Q function, Q table, and you're in a certain state and you perform a certain action A, you will observe a reward."},{"start":1927.98,"text":"This reward will, you know, you have taken an action, so you would be in a new state. And from that new state, you can repeat what you just did, right? And because you've done the backtracking and stuff like that, you will get this equation to be true because it's the reward plus discount times the best next action that you could be taking. Does that make sense? Any question on that? That's exactly the backtracking that we did, by the way."},{"start":1958.4,"text":"immediate reward plus discounts times the best possible action that you can take in the next state, S prime. The last concept I cover in terms of vocabulary is the policy. The policy is the function that given your state is going to tell you what to do. And in Q learning, the way these policies define is argmax of Q star."},{"start":1988.66,"text":"across the action so essentially what it says is like look in the table and look at a certain state s you want the policy which is what you should do it's the function that tells you our best strategy you just look at the two possible actions which one has the highest q value and select that action that's it this is a very simple example but it's the core of"},{"start":2018.04,"text":"Q learning that, you know, later on you will use policies widely. There's a lot of reinforcement learning algorithms, but this concept of understanding the policies, the function telling us our best strategy in Q learning, it's the argmax of the best Q value in a given state. It tells you which action to take. That's the core thing you need to understand. So remember this Bellman equation because we're going to reuse it."}],"speech_gaps":[],"frame":"../frames/v062/012.webp","frame_time":1881.65},{"title":"深度强化学习中的Q函数与深度Q学习","segments":[{"id":77,"text":"The main issue with this approach of a queue table is that state and action spaces can be super large and having a matrix that you discover through backtracking and where every time you want to do an action, you have to look up the given states, the possible action.","zh":"这种方法中队列表的主要问题是状态和动作空间可能非常巨大，并且需要通过回溯来发现一个矩阵，每次想要执行一个动作时，都需要查找给定状态和可能动作。","start":2041.93,"end":2066.75},{"id":78,"text":"it becomes impossible. Imagine you using this algorithm for the game of Go, where there's so many states, there's so many possible actions. You can put your stone anywhere on the board. You can imagine how big this matrix becomes and how impossible it is to use. So that's our problem. And that's the moment where deep learning comes into play. So let's look at it.","zh":"这变得不可能。想象一下你使用这个算法来玩围棋，其中状态和可能的动作都非常多。你可以在棋盘上的任何位置放置你的棋子。你可以想象这个矩阵会有多大，以及使用它有多么不可能。这就是我们面临的问题。这也是深度学习发挥作用的时刻。那么让我们来看一下。","start":2067.58,"end":2094.63},{"id":79,"text":"Oh, actually, before I go there, I'm just going to cover some vocabulary. We said the environment, the agent, the state, the action, the reward, the total return, and the discount factor. We learned all of that. We saw that the Q table is the matrix of entries representing how good is it to take action A in state S. And the policy is the function that tells us what's the best strategy to adopt. And the Bellman equation is satisfied by the optimal Q table.","zh":"哦，实际上，在我继续之前，我只想覆盖一些术语。我们说过环境、智能体、状态、动作、奖励、总回报和折扣因子。我们已经学习了所有这些内容。我们看到Q表是表示在状态S中采取动作A有多好的矩阵。策略是告诉我们应该采用的最佳策略的函数。贝尔曼方程由最优Q表满足。","start":2098.44,"end":2121.2},{"id":80,"text":"So let's get to deep Q learning, which is what I was about to say, is we are going to frame the problem slightly differently. So instead of using a Q table, we're going to use the fact that neural networks are universal function approximators. And we're going to define a Q function that's essentially a neural network so that the function can take a state S and an action A and tell you how good.","zh":"那么让我们进入深度Q学习，也就是我刚才要说的内容。我们将以稍微不同的方式来表述问题。因此，我们不再使用Q表，而是利用神经网络是通用函数逼近器这一事实。我们将定义一个Q函数，本质上是一个神经网络，这样函数就可以接收一个状态S和一个动作A，并告诉你这个动作在状态S中有多好。","start":2125.1,"end":2151.82},{"id":81,"text":"that action is in state S. So instead of a lookup in a matrix, you just run a forward pass in a neural network and it gives you the answer. That feels like a better solution for games where there's a lot of states and a lot of actions.","zh":"因此，而不是在矩阵中进行查找，你只需在神经网络中进行一次前向传播，它就会给出答案。这在状态和动作都很多的游戏里感觉像是一个更好的解决方案。","start":2152.71,"end":2167.25},{"id":82,"text":"So here is the same problem statement. In the past, we looked for a Q table, and this time we will look for a neural network. One of the things we're going to do is to define the output layer to have two outputs. So given a certain state as input, think about it as a one-hot vector encoding the state. So this one is the example of state 2, 0, 1, 0, 0, 0. If you pass s
