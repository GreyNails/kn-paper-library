},{"id":298,"text":"Take that next state, forward propagate it again."},{"id":299,"text":"So instead, and then instead of, oh no, sorry, sorry."},{"id":300,"text":"Observe that next state, add it to the replay memory,"},{"id":301,"text":"sample from the replay memory, and then train on that sample."},{"id":302,"text":"And in the process, you will need to do another forward path"},{"id":303,"text":"because you need to estimate your target Y using the immediate reward"},{"id":304,"text":"plus the Bellman equation, plus the discounted future reward."},{"id":305,"text":"Okay, are you experts at Q-learning?"},{"id":306,"text":"okay good sounds good and here is where we get at the end"},{"id":307,"text":"You can claim proudly you have trained an ATAR."},{"id":308,"text":"It's not that complicated, as you can see, other than the Bellman equation piece."}],"notes":["本段讨论了在强化学习中初始化网络参数的问题，特别是将初始值设为无穷大的问题。讲者指出，如果Q值设为无穷大，会导致决策困难，因为无法选择最优动作，同时梯度也会变得非常大，使得训练变得困难。因此，实际中通常采用随机初始化。"],"formulas":[],"uncertainties":["the initial values from into infinity","the outputs are equal to infinity","the Q values","the reward is one at the","the reward is a thousand at the end and when you lose your rook","the reward structure is going to be you want","the method that can scale to different","the Bellman equation piece"],"diagram":"none","start":4481.79,"end":4660.89,"asr_flags":[],"raw_segments":[{"start":4481.79,"text":"setting the"},{"start":4482.81,"text":"couldn't we resolve this problem by setting"},{"start":4485.53,"text":"the initial values from into infinity"},{"start":4487.39,"text":"well the problem if you set the initial"},{"start":4489.51,"text":"values to infinity so you would say"},{"start":4491.61,"text":"instead of randomly initializing"},{"start":4493.61,"text":"your network you initialize it in a way"},{"start":4495.53,"text":"that the outputs are equal to infinity"},{"start":4497.19,"text":"yeah so that we wouldn't get the issue"},{"start":4499.49,"text":"of"},{"start":4500.07,"text":"the Q values"},{"start":4502.63,"text":"well in"},{"start":4505.59,"text":"practice if the three Q values are"},{"start":4507.59,"text":"infinity then you can't make a decision on"},{"start":4509.63,"text":"the spot so you're saying just pick one randomly because if the three are infinity you you can't"},{"start":4514.85,"text":"decide which one to take right and also if if it's infinity and the reward is one i mean if"},{"start":4522.39,"text":"it's a really large number and the reward is one your gradient is going to be massive right so it's"},{"start":4527.25,"text":"gonna i guess the loss function is going to be massive and um i don't know i imagine it will be"},{"start":4533.29,"text":"really hard to train it but in practice you start with the random initialization because this might"},{"start":4538.89,"text":"be one example but you know if in the game of chess um actually the the reward is one at the"},{"start":4546.45,"text":"end and zero all the time or maybe the reward is a thousand at the end and when you lose your rook"},{"start":4552.03,"text":"it's uh it's a negative reward you can't predict what the reward structure is going to be you want"},{"start":4556.69,"text":"an agent that is able to adapt to it and it's better to find a method that can scale to different"},{"start":4562.73,"text":"environments essentially okay so this was epsilon greedy action which is"},{"start":4573.29,"text":"adding some randomness with probability epsilon take a random action okay so"},{"start":4578.19,"text":"adding all our techniques because we get good at training reinforcement learning"},{"start":4583.49,"text":"algorithms this is what we have we initialize our Q network parameters we"},{"start":4588.17,"text":"We have a random network."},{"start":4589.23,"text":"We initialize our replay memory, D,"},{"start":4591.79,"text":"and then we loop over episodes."},{"start":4593.35,"text":"We start from an initial state."},{"start":4594.93,"text":"We create a Boolean that allows us to detect terminal states."},{"start":4598.35,"text":"With probability epsilon, we're going to take a random action."},{"start":4601.57,"text":"Otherwise, we're going to follow what we know,"},{"start":4603.59,"text":"which is forward propagate the state in the Q network,"},{"start":4606.25,"text":"take the action that has the highest Q value."},{"start":4608.51,"text":"That allows you to observe a reward in the next state."},{"start":4611.81,"text":"Take that next state, forward propagate it again."},{"start":4618.17,"text":"So instead, and then instead of, oh no, sorry, sorry."},{"start":4623.19,"text":"Observe that next state, add it to the replay memory,"},{"start":4627.05,"text":"sample from the replay memory, and then train on that sample."},{"start":4631.03,"text":"And in the process, you will need to do another forward path"},{"start":4633.79,"text":"because you need to estimate your target Y using the immediate reward"},{"start":4637.63,"text":"plus the Bellman equation, plus the discounted future reward."},{"start":4643.59,"text":"Okay, are you experts at Q-learning?"},{"start":4650.13,"text":"okay good sounds good and here is where we get at the end"},{"start":4654.91,"text":"You can claim proudly you have trained an ATAR."},{"start":4657.85,"text":"It's not that complicated, as you can see, other than the Bellman equation piece."}],"speech_gaps":[],"frame":"../frames/v062/027.webp","frame_time":4493.79},{"title":"深度强化学习中的挑战与解决方案","segments":[{"id":337,"text":"Let's go a little further and talk about advanced topics. Here is a game called Montezuma Revenge. This game is particular because you're controlling a little character right here. And this character is trying to go and grab, let's say, this key right here. And it has some obstacles or some enemies that it needs to take care of. What do you think is going to be an issue?"},{"id":338,"text":"If we apply what we just learned to this game? What makes this game especially hard in comparison to, let's say, chess or Go? Yes. The reward is very delayed. If you start with a random network, what are the chances that the network is going to figure out that to get to the key..."},{"id":339,"text":"It actually should go in the opposite direction. It should go in the opposite direction. It should jump down here. It should catch the rope. The rope will probably allow the character to go to the ladder. It goes down the ladder. It has to go jump up this enemy. My guess is it's an enemy. I'm not sure, but I think it's an enemy because of the color. And I know that in gaming, if it was green, it might not have been an enemy. But if it's gray or red, it might be an enemy. And then go up the ladder and grab the key."},{"id":340,"text":"The chance is very low that the agent is going to make that successive good decisions to get there. You're right. Why is it easier for a human to actually solve that game? Intuition, prior knowledge. So for example, when you look at this game, even if you have never played it, my guess is you would know you can go down the ladder."},{"id":341,"text":"Because you know what a ladder is. Or you can see this little rope and you're like, I'm going to catch the rope. I'm going to jump and go to the other side. And you look at this little monster and you're like, I better not touch this monster. Or if anything, I will jump on top of it."},{"id":342,"text":"Because you've played Mario, let's say. So all of this is human intuition. Sometimes you would call as a baby survival instinct, like you throw the baby in the water and suddenly it flips and it can swim. Those are things that are to a certain extent encoded in our DNA, but at the very least encoded in our experience of doing other things that have nothing to do with this game."},{"id":343,"text":"And so the problem here is called imitation learning. Is there a better way to start our network than a random initialization that allows the network to, for example, guess that this is a ladder? And it turns out that if the network knows that, it will be more likely to get to the reward first and then learn from that reward and then get better over time. The other part that can also use human knowledge, which is what we're going to see together, is reinforcement learning from human feedback."}],"notes":["本段讨论了深度强化学习在Montezuma Revenge游戏中的挑战，特别是奖励延迟的问题。讲者指出，与国际象棋或围棋相比，这种游戏的奖励延迟使得随机初始化的网络难以成功。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4814.29,"end":4983.62,"asr_flags":[],"raw_segments":[{"start":4814.29,"text":"Let's go a little further and talk about advanced topics. Here is a game called Montezuma Revenge. This game is particular because you're controlling a little character right here. And this character is trying to go and grab, let's say, this key right here. And it has some obstacles or some enemies that it needs to take care of. What do you think is going to be an issue?"},{"start":4842.59,"text":"if we apply what we just learned to this game? What makes this game especially hard in comparison to, let's say, chess or Go? Yes. The reward is very delayed. If you start with a random network, what are the chances that the network is going to figure out that to get to the key..."},{"start":4867.42,"text":"It actually should go in the opposite direction. It should go in the opposite direction. It should jump down here. It should catch the rope. The rope will probably allow the character to go to the ladder. It goes down the ladder. It has to go jump up this enemy. My guess is it's an enemy. I'm not sure, but I think it's an enemy because of the color. And I know that in gaming, if it was green, it might not have been an enemy. But if it's gray or red, it might be an enemy. And then go up the ladder and grab the key."},{"start":4896.46,"text":"the chance is very low that the agent is going to make that successive good decisions to get there. You're right. Why is it easier for a human to actually solve that game? Intuition, prior knowledge. So for example, when you look at this game, even if you have never played it, my guess is you would know you can go down the ladder."},{"start":4922.03,"text":"because you know what a ladder is. Or you can see this little rope and you're like, I'm going to catch the rope. I'm going to jump and go to the other side. And you look at this little monster and you're like, I better not touch this monster. Or if anything, I will jump on top of it."},{"start":4934.46,"text":"Because you've played Mario, let's say. So all of this is human intuition. Sometimes you would call as a baby survival instinct, like you throw the baby in the water and suddenly it flips and it can swim. Those are things that are to a certain extent encoded in our DNA, but at the very least encoded in our experience of doing other things that have nothing to do with this game."},{"start":4956.68,"text":"And so the problem here is called imitation learning. Is there a better way to start our network than a random initialization that allows the network to, for example, guess that this is a ladder? And it turns out that if the network knows that, it will be more likely to get to the reward first and then learn from that reward and then get better over time. The other part that can also use human knowledge, which is what we're going to see together, is reinforcement learning from human feedback."}],"speech_gaps":[],"frame":"../frames/v062/029.webp","frame_time":4826.29},{"title":"强化学习在对齐问题中的应用与PPO算法","segments":[{"id":344,"text":"Where you have an analogy here, which is you can train a language model and it might be completely misaligned with what actually humans care about. How does reinforcement learning help in those situations? That's going to be the next topic in the last part of the lecture."},{"id":345,"text":"Okay, let me show you a few other results quickly. Today, we talked about DQ and DQ learning. In practice, there is a lot more reinforcement learning algorithm, but you got the gist of it. You got the concept of making good sequences of decision, epsilon greedy, exploration, exploitation, terminal state, starting state, all of that you got. The one algorithm that is very popular right now is called PPO, proximal policy optimization."},{"id":346,"text":"There is one that is even more popular right now that's actually from a year ago at Stanford called DPO that we won't study in the class. One of the things to know about PPO, just to go over it really quickly, and I pasted two important papers from Schulman et al. a few years back, TRPO and PPO, is that it is not a value-based algorithm. So in Q-learning, you learn the Q values and then you define your policy as the arg max of the Q values."},{"id":347,"text":"In PPO, you learn the policy directly, which is a more probabilistic method. It also works well with continuous spaces. If you look at the Q learning we learned, one output for one action. If you actually have a game that has continuous action, like autonomous driving, where it's not like just turn the wheel to the right or to the left, it's like what degree you turn it, it's continuous, then the QN would not work."},{"id":348,"text":"Well, or you would have to granularize the number of action a little bit to the right, a little bit more, a little more, which would not be really useful. Instead, you would use PPO. Yeah. Yeah."},{"id":349,"text":"So the question is, how do you define the reward in the QN? Different reward structure will lead to different types of agent strategies. But you're right, for the game of Go, you could actually define the reward as 1 if you win and 0 if you don't win."},{"id":350,"text":"That's it. Every move will be zero until the last move is a win. In chess, you might actually do intermediate reward because you want to tell the agent that it's good to kill the opponent's pieces to get rid of them. You could also do end-to-end and say, I don't give any intermediate reward, I just give a final reward, which might be more complicated to train on, but it might actually lead to a more optimal strategy because, in fact, you could actually win without taking any piece from your opponent."},{"id":351,"text":"Other things about PPO is it's more probabilistic. It has a concept of an expected advantage, which at every step, instead of telling you how good that action is, it would tell you how much better it is than random."}],"notes":["本段讲授了强化学习在对齐问题中的应用，即训练语言模型可能与人类价值观不一致，而强化学习可以帮助解决此类问题。接着，课程介绍了PPO（近端策略优化）算法，这是一种流行的策略梯度方法，与基于值的Q学习不同，它直接学习策略，适用于连续动作空间。","在讨论PPO时，课程指出，对于连续动作空间（如自动驾驶），Q学习可能不适用，因为需要对动作进行离散化处理，而PPO则能更自然地处理连续动作。此外，课程还提到，PPO是一种概率方法，它通过预期优势来衡量动作相对于随机动作的改进程度。","课程还讨论了奖励函数的设计问题，指出不同的奖励结构会导致不同的策略。例如，在围棋中，奖励可以定义为胜利时为1，失败时为0；而在国际象棋中，可能需要中间奖励来引导代理更快地击败对手。此外，课程还提到，端到端奖励（仅在最终步骤给予奖励）可能更复杂，但可能产生更优的策略。","课程最后提到，PPO的另一个特点是其概率性，它通过预期优势来评估动作的改进程度，而不是直接评估动作的好坏。这种设计使得PPO在处理连续动作空间时更加有效。","课程还提到，虽然DPO（直接策略优化）是一种更受欢迎的算法，但不会在课堂上进行深入研究。这表明课程内容主要集中在PPO及其相关概念上。","课程通过多个例子（如围棋、国际象棋、自动驾驶）来说明不同奖励结构和算法选择对策略的影响，强调了在实际应用中选择合适奖励函数和算法的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4984.99,"end":5163.07,"asr_flags":[],"raw_segments":[{"start":4984.99,"text":"Where you have an analogy here, which is you can train a language model and it might be completely misaligned with what actually humans care about. How does reinforcement learning help in those situations? That's going to be the next topic in the last part of the lecture."},{"start":4999.11,"text":"Okay, let me show you a few other results quickly. Today, we talked about DQ and DQ learning. In practice, there is a lot more reinforcement learning algorithm, but you got the gist of it. You got the concept of making good sequences of decision, epsilon greedy, exploration, exploitation, terminal state, starting state, all of that you got. The one algorithm that is very popular right now is called PPO, proximal policy optimization."},{"start":5028.74,"text":"There is one that is even more popular right now that's actually from a year ago at Stanford called DPO that we won't study in the class. One of the things to know about PPO, just to go over it really quickly, and I pasted two important papers from Schulman et al. a few years back, TRPO and PPO, is that it is not a value-based algorithm. So in Q-learning, you learn the Q values and then you define your policy as the arg max of the Q values."},{"start":5056.66,"text":"In PPO, you learn the policy directly, which is a more probabilistic method. It also works well with continuous spaces. If you look at the Q learning we learned, one output for one action. If you actually have a game that has continuous action, like autonomous driving, where it's not like just turn the wheel to the right or to the left, it's like what degree you turn it, it's continuous, then the QN would not work."},{"start":5084.95,"text":"Well, or you would have to granularize the number of action a little bit to the right, a little bit more, a little more, which would not be really useful. Instead, you would use PPO. Yeah. Yeah."},{"start":5103.89,"text":"So the question is, how do you define the reward in the QN? Different reward structure will lead to different types of agent strategies. But you're right, for the game of Go, you could actually define the reward as 1 if you win and 0 if you don't win."},{"start":5120.74,"text":"That's it. Every move will be zero until the last move is a win. In chess, you might actually do intermediate reward because you want to tell the agent that it's good to kill the opponent's pieces to get rid of them. You could also do end-to-end and say, I don't give any intermediate reward, I just give a final reward, which might be more complicated to train on, but it might actually lead to a more optimal strategy because, in fact, you could actually win without taking any piece from your opponent."},{"start":5148.75,"text":"Other things about PPO is it's more probabilistic. It has a concept of an expected advantage, which at every step, instead of telling you how good that action is, it would tell you how much better it is than random."}],"speech_gaps":[],"frame":"../frames/v062/030.webp","frame_time":4996.99},{"title":"PPO算法与竞争自玩的示例","segments":[{"id":352,"text":"than the current state. How much better would it be to do a certain thing versus what you would have done otherwise? I'm not going to go into the details. It's all in the paper. But those are things that are important. Here's a few examples of PPO. So this example on the left is from OpenAI a few years back, where you can see it's a continuous space where the agent is being bullied a little bit, but it's trying to grab the rewards."},{"id":353,"text":"but it's also subject to external forces that are sort of throwing balls at it. It's a little bit mean, but you can imagine that this is a continuous space, meaning you're controlling the nodes, you're controlling the joints of the agent, and you're controlling the forces, the angles, and so that's why PPO would be better in that case. Super. Here's a competitive self-play, which I really like."},{"id":354,"text":"where you have agents play with each other. And this is the sumo game, push the opponent outside the ring and you get a reward. So actually it's interesting because you're seeing some emergent behavior, which is they attack each other's feet. Or they lower their center of gravity to be more stable, for example. Yeah. Yeah, yeah. It's versions, sometimes different initializations, for example. So no, but good question."},{"id":355,"text":"Oftentimes, what OpenAI would do back in that time is they would create copies of the same model, they would initialize them differently, and they would let them learn. And it turns out one of the models will get better than the others. And then they will copy again that model to the rest and do the same thing again and again. Pretty much. It's kind of funny, isn't it? That's a good catch. That's a good goal. You could watch that for hours."},{"id":356,"text":"They're a little awkward, you have to say, but..."},{"id":357,"text":"But it works. Okay, so I'll let you watch the video. It's going to be shared. But here's another set of games that are even more complicated that I mentioned early on. OpenAI 5, which you can think of an equivalent of League of Legends, Dota, where you have a 5v5 game. So you have to collaborate, etc., which adds literally one additional degree of complexity."},{"id":358,"text":"And StarCraft, AlphaStar from DeepMind is an example of where the observation is not the entire state. You have fog. And so that adds another layer of complexity. We're going to see that together today. I would encourage you to look at the AlphaGo documentary on Netflix. If you haven't, who has seen it already?"}],"notes":["本段主要讲解PPO（Proximal Policy Optimization）算法在连续空间中的应用，以及竞争自玩（competitive self-play）的概念。PPO是一种强化学习算法，用于在连续空间中优化策略，通过控制节点、关节和力来实现目标。竞争自玩是指让多个智能体相互对抗，以提升学习效果。","在示例中，提到OpenAI的实验，其中创建多个模型副本，初始化方式不同，让它们学习。最终，其中一个模型会优于其他模型，然后将其复制到其他模型中，重复这一过程。这种方法有助于提升模型性能。","此外，还提到OpenAI 5，这是一个类似于《英雄联盟》和《DOTA》的5v5游戏，需要团队协作，增加了复杂度。同时，AlphaStar在《星际争霸》中的应用展示了观察信息不完整（如雾气）带来的额外挑战。","最后，讲师建议观看Netflix上的《AlphaGo》纪录片，以更深入了解深度强化学习的实际应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5163.49,"end":5341.75,"asr_flags":[],"raw_segments":[{"start":5163.49,"text":"than the current state. How much better would it be to do a certain thing versus what you would have done otherwise? I'm not going to go into the details. It's all in the paper. But those are things that are important. Here's a few examples of PPO. So this example on the left is from OpenAI a few years back, where you can see it's a continuous space where the agent is being bullied a little bit, but it's trying to grab the rewards."},{"start":5191.37,"text":"but it's also subject to external forces that are sort of throwing balls at it. It's a little bit mean, but you can imagine that this is a continuous space, meaning you're controlling the nodes, you're controlling the joints of the agent, and you're controlling the forces, the angles, and so that's why PPO would be better in that case. Super. Here's a competitive self-play, which I really like."},{"start":5222.06,"text":"where you have agents play with each other. And this is the sumo game, push the opponent outside the ring and you get a reward. So actually it's interesting because you're seeing some emergent behavior, which is they attack each other's feet. Or they lower their center of gravity to be more stable, for example. Yeah. Yeah, yeah. It's versions, sometimes different initializations, for example. So no, but good question."},{"start":5252.26,"text":"Oftentimes, what OpenAI would do back in that time is they would create copies of the same model, they would initialize them differently, and they would let them learn. And it turns out one of the models will get better than the others. And then they will copy again that model to the rest and do the same thing again and again. Pretty much. It's kind of funny, isn't it? That's a good catch. That's a good goal. You could watch that for hours."},{"start":5289.99,"text":"They're a little awkward, you have to say, but..."},{"start":5292.31,"text":"But it works. Okay, so I'll let you watch the video. It's going to be shared. But here's another set of games that are even more complicated that I mentioned early on. OpenAI 5, which you can think of an equivalent of League of Legends, Dota, where you have a 5v5 game. So you have to collaborate, etc., which adds literally one additional degree of complexity."},{"start":5319.91,"text":"And StarCraft, AlphaStar from DeepMind is an example of where the observation is not the entire state. You have fog. And so that adds another layer of complexity. We're going to see that together today. I would encourage you to look at the AlphaGo documentary on Netflix. If you haven't, who has seen it already?"}],"speech_gaps":[],"frame":"../frames/v062/031.webp","frame_time":5175.49},{"title":"深度强化学习中的AlphaGo例子与课程介绍","segments":[{"id":359,"text":"Nobody? Okay. Well, you can now watch it with a different eye, understanding reinforcement learning. And at some point in the documentary, you will see that AlphaGo makes a very odd move, a very creative move. And people are like, I don't understand that move. Even the top researchers or the best players would say in the video, they don't understand that move."},{"id":360,"text":"It turns out that that move is very unintuitive for humans because as humans, we are trained to maximize our chances of winning. Like literally, if I can eat all your pieces in chess, I will eat all your pieces. And if I can surround your stones in Go as much as I can, I will do it. The agent is just programmed to win. So that move actually looks counterintuitive because the agent doesn't care about winning by one or winning by 20 stones. It just cares about winning and that moves."},{"id":361,"text":"put the agent in a good place to win by a small margin."},{"id":362,"text":"So that's an example of an insight that you will learn,"},{"id":363,"text":"you understand from this class,"},{"id":364,"text":"and you will see in the documentary."},{"id":365,"text":"Okay, I think we have 10 minutes."},{"id":366,"text":"I'm just going to introduce reinforcement learning"},{"id":367,"text":"from human feedback,"},{"id":368,"text":"because it's a more modern topic"},{"id":369,"text":"that is very trendy right now."},{"id":370,"text":"It's important to know."},{"id":371,"text":"And so let's look at it together."},{"id":372,"text":"We're going to start by recapping how language models are trained in a nutshell, and then we'll see what supervised fine-tuning looks like."},{"id":373,"text":"We'll talk about how do we train a critique model, a reward model."},{"id":374,"text":"And then finally, what RLHF looks like and why is it so trending in the news?"},{"id":375,"text":"So our training objective for language models is next token prediction, right?"},{"id":376,"text":"We've already talked about it in a former lecture."},{"id":377,"text":"the idea is that i will get some inputs i'm reading wikipedia let's say or some sort of a"},{"id":378,"text":"text online and i read a sentence and i predict the last token and i do that again and again so"},{"id":379,"text":"for example deep learning and then deep learning is deep learning is so deep learning is so cool"},{"id":380,"text":"and that's it um so you get the idea right you're always printing the next token and then over time"},{"id":381,"text":"it forces the model to um explicit uh emerging behaviors and it understands the connections"},{"id":382,"text":"between those concepts and it's really good at generating texts we compute the last function"},{"id":383,"text":"you're actually going to study this last function in c5 so i'm not going to talk about it right now"},{"id":384,"text":"but you perform a gradient descent loop."},{"id":385,"text":"And this is how you get your first pre-trained language model."},{"id":386,"text":"You get a pre-trained language model."},{"id":387,"text":"You can call it on a text or a prompt, and it will continually generate."}],"notes":["本段讲解了语言模型的训练方式，即通过预测下一个词来训练模型。讲者提到，模型会读取输入文本（如维基百科或在线文本），并不断预测句子的最后一个词，从而逐步学习语言的结构和连接。","讲者通过一个例子说明了语言模型的训练过程，即模型在不断预测下一个词的过程中，会逐渐理解词语之间的关系，并生成连贯的文本。","讲者提到，语言模型的训练目标是下一个词的预测，这已经在之前的课程中讨论过。模型通过不断重复这一过程，逐步学习语言的模式。","讲者指出，模型在训练过程中会逐渐展现出一些显性的行为，并理解词语之间的联系，这使得模型在生成文本时表现得非常出色。","讲者提到，模型的最后一步函数将在课程C5中详细学习，因此当前不深入讨论。但模型会通过梯度下降循环进行训练。","讲者总结了语言模型的训练过程，即通过不断预测下一个词，最终得到一个预训练的语言模型，该模型可以用于文本生成。"],"formulas":[],"uncertainties":["the last function","gradient descent loop"],"diagram":"none","start":5342.6,"end":5520.45,"asr_flags":[],"raw_segments":[{"start":5342.6,"text":"Nobody? Okay. Well, you can now watch it with a different eye, understanding reinforcement learning. And at some point in the documentary, you will see that AlphaGo makes a very odd move, a very creative move. And people are like, I don't understand that move. Even the top researchers or the best players would say in the video, they don't understand that move."},{"start":5371.37,"text":"It turns out that that move is very unintuitive for humans because as humans, we are trained to maximize our chances of winning. Like literally, if I can eat all your pieces in chess, I will eat all your pieces. And if I can surround your stones in Go as much as I can, I will do it. The agent is just programmed to win. So that move actually looks counterintuitive because the agent doesn't care about winning by one or winning by 20 stones. It just cares about winning and that moves."},{"start":5401.01,"text":"put the agent in a good place to win by a small margin."},{"start":5404.81,"text":"So that's an example of an insight that you will learn,"},{"start":5407.47,"text":"you understand from this class,"},{"start":5409.21,"text":"and you will see in the documentary."},{"start":5414.53,"text":"Okay, I think we have 10 minutes."},{"start":5416.43,"text":"I'm just going to introduce reinforcement learning"},{"start":5419.15,"text":"from human feedback,"},{"start":5420.77,"text":"because it's a more modern topic"},{"start":5424.19,"text":"that is very trendy right now."},{"start":5426.79,"text":"It's important to know."},{"start":5427.89,"text":"And so let's look at it together."},{"start":5429.33,"text":"We're going to start by recapping how language models are trained in a nutshell, and then we'll see what supervised fine-tuning looks like."},{"start":5438.01,"text":"We'll talk about how do we train a critique model, a reward model."},{"start":5441.77,"text":"And then finally, what RLHF looks like and why is it so trending in the news?"},{"start":5447.43,"text":"So our training objective for language models is next token prediction, right?"},{"start":5454.49,"text":"We've already talked about it in a former lecture."},{"start":5456.43,"text":"the idea is that i will get some inputs i'm reading wikipedia let's say or some sort of a"},{"start":5462.25,"text":"text online and i read a sentence and i predict the last token and i do that again and again so"},{"start":5469.09,"text":"for example deep learning and then deep learning is deep learning is so deep learning is so cool"},{"start":5480.97,"text":"and that's it um so you get the idea right you're always printing the next token and then over time"},{"start":5487.07,"text":"it forces the model to um explicit uh emerging behaviors and it understands the connections"},{"start":5493.89,"text":"between those concepts and it's really good at generating texts we compute the last function"},{"start":5500.45,"text":"you're actually going to study this last function in c5 so i'm not going to talk about it right now"},{"start":5506.57,"text":"but you perform a gradient descent loop."},{"start":5511.55,"text":"And this is how you get your first pre-trained language model."},{"start":5515.51,"text":"You get a pre-trained language model."},{"start":5516.97,"text":"You can call it on a text or a prompt, and it will continually generate."}],"speech_gaps":[],"frame":"../frames/v062/032.webp","frame_time":5354.6},{"title":"语言模型的训练问题与改进方法","segments":[{"id":388,"text":"And you call it again and again and again, and it generates, generates, generates."},{"id":389,"text":"Everybody's comfortable with that, right?"},{"id":390,"text":"Okay, so that's how we trained a language model,"},{"id":391,"text":"but there is a couple of problems."},{"id":392,"text":"The first problem is that online data does not reflect helpfulness"},{"id":393,"text":"so to give you a concrete example what you might find in the training set is something like deep"},{"id":394,"text":"learning is so cool when actually what you might find in practice is people asking what is deep"},{"id":395,"text":"the data is not really reflective of you want an agent to be helpful and that's a"},{"id":396,"text":"problem because the model was trained to continue text rather than answer questions."},{"id":397,"text":"And in practice, you would see it's a big problem. Another problem is the model has no"},{"id":398,"text":"concept of good, polite, or helpful yet. And to give you a concrete example,"},{"id":399,"text":"you might actually ask a pre-trained language model, my laptop won't turn on, what should I do?"},{"id":400,"text":"And then the model response, because it has read it on Reddit or on Wikipedia, is laptops sometimes don't turn on because of power issues, which is not what you ask. You ask, what should I do?"},{"id":401,"text":"And in fact, a better answer would have been check your charger, if it's properly connected or the outlet works. If that's fine, try holding the power button for 10 seconds. If it still doesn't start, the battery or motherboard may blah, blah, blah, blah. That's a better answer. That's what you want a language model to do nowadays. And the model can give you factual text because that's what it's been trained on, but it doesn't understand being helpful or having an answer that looks like a human-like answer."},{"id":402,"text":"So our solution to it, we start with using supervised fine tuning, which is going to be learning from human written demonstrations of helpful behavior. And then we get to even further and use RLHF, which will optimize not only for human written sentences or paragraphs, but for preferences. And the word preference is the keyword."},{"id":403,"text":"Let's talk about how we can improve our pre-trained model with supervised fine-tuning. I'll take that we want to align models with human return responses. And the step one that we're going to lose is to build a dataset. Let's build a dataset of human prompt-response pairs. So what actually OpenAI is going to do, I'll explain it in a second, is it might..."},{"id":404,"text":"collect some of the prompts that we all use, and then ask humans to respond to those prompts and put that in a data set. It might also ask separately experts to write really good prompts and then answer those prompts."}],"notes":["本段讨论了语言模型训练中遇到的两个主要问题：在线数据无法反映用户对帮助性的需求，以及模型缺乏对良好、礼貌或有帮助行为的理解。讲者通过一个具体例子说明了模型在回答用户问题时的不足，即模型倾向于提供事实性信息而非实用建议。","讲者指出，模型在训练时被设计为继续生成文本，而不是直接回答问题，这导致了模型输出与用户期望之间的差距。例如，当用户询问如何解决电脑无法开机的问题时，模型可能给出与问题无关的信息，而不是直接的解决方案。","为了解决这些问题，讲者提出了使用监督微调（supervised fine-tuning）的方法，即通过人类编写的帮助性行为示例来训练模型。这种方法旨在使模型更贴近人类的期望。","讲者进一步提到，除了监督微调，还可以使用基于人类反馈的强化学习（RLHF），这种方法不仅优化人类书写的句子或段落，还优化人类的偏好。关键词是“偏好”，即模型需要学习人类对不同回答的偏好。","在实施监督微调时，第一步是构建一个包含人类提示-回答对的数据集。讲者提到，OpenAI可能会收集一些常用的提示，并让人类对这些提示进行回答，从而构建数据集。此外，还会让专家编写高质量的提示并进行回答。","讲者强调，通过这些方法，模型可以更好地对齐人类的期望，从而提供更实用、更符合人类需求的回答。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5520.67,"end":5684.02,"asr_flags":[],"raw_segments":[{"start":5520.67,"text":"And you call it again and again and again, and it generates, generates, generates."},{"start":5524.51,"text":"Everybody's comfortable with that, right?"},{"start":5526.95,"text":"Okay, so that's how we trained a language model,"},{"start":5530.63,"text":"but there is a couple of problems."},{"start":5532.31,"text":"problems the first problem is that online data does not reflect helpfulness"},{"start":5541.43,"text":"so to give you a concrete example what you might find in the training set is something like deep"},{"start":5547.73,"text":"learning is so cool when actually what you might find in practice is people asking what is deep"},{"start":5553.67,"text":"learning so the data is not really reflective of you want an agent to be helpful and that's a"},{"start":5560.43,"text":"problem because the model was trained to continue text rather than answer questions."},{"start":5566.77,"text":"And in practice, you would see it's a big problem. Another problem is the model has no"},{"start":5571.19,"text":"concept of good, polite, or helpful yet. And to give you a concrete example,"},{"start":5577.07,"text":"you might actually ask a pre-trained language model, my laptop won't turn on, what should I do?"},{"start":5583.4,"text":"And then the model response, because it has read it on Reddit or on Wikipedia, is laptops sometimes don't turn on because of power issues, which is not what you ask. You ask, what should I do?"},{"start":5595.03,"text":"And in fact, a better answer would have been check your charger, if it's properly connected or the outlet works. If that's fine, try holding the power button for 10 seconds. If it still doesn't start, the battery or motherboard may blah, blah, blah, blah. That's a better answer. That's what you want a language model to do nowadays. And the model can give you factual text because that's what it's been trained on, but it doesn't understand being helpful or having an answer that looks like a human-like answer."},{"start":5624.75,"text":"So our solution to it, we start with using supervised fine tuning, which is going to be learning from human written demonstrations of helpful behavior. And then we get to even further and use RLHF, which will optimize not only for human written sentences or paragraphs, but for preferences. And the word preference is the keyword."},{"start":5647.28,"text":"Let's talk about how we can improve our pre-trained model with supervised fine-tuning. I'll take that we want to align models with human return responses. And the step one that we're going to lose is to build a dataset. Let's build a dataset of human prompt-response pairs. So what actually OpenAI is going to do, I'll explain it in a second, is it might..."},{"start":5672.08,"text":"collect some of the prompts that we all use, and then ask humans to respond to those prompts and put that in a data set. It might also ask separately experts to write really good prompts and then answer those prompts."}],"speech_gaps":[],"frame":"../frames/v062/033.webp","frame_time":5532.67},{"title":"监督微调（SFT）与奖励模型（RM）","segments":[{"id":405,"text":"It's a fully human-made data set. And then we use that data set to fine-tune our pre-trained model. And by now, you've learned fine-tuning in the online video, so you know what I'm talking about, using supervised learning. So what it looks like is I take my pre-trained model that I just told you how we train, and then I give it a prompt, explain deep learning to a beginner. And I also will concatenate to it."},{"id":406,"text":"a response, a good response written by a human. Deep learning is a type of machine learning that uses neural. And then I expect the model to come up with the word networks. So it's literally do whatever we need to train the pre-trained model, but we do it on a human written prompt response pairs."},{"id":407,"text":"And if you do that many times and you use the same loss function, how far the model's response is from a human response, you do that many times and you will get SFT, supervised fine tuning. But it has some shortcomings. One of the shortcomings is it is data that is extremely costly to collect. In fact, I believe in the first version of that instruct GPT, there was only 13,000."},{"id":408,"text":"prompt-response pairs. And it turns out it did really well despite that. The second aspect is it's unlikely to generalize well because you're, again, you're not doing reinforcement learning here. You're doing supervised learning. And so you're just showing a set of examples, 13,000 examples that you want to learn. But it's what tells you that it will generalize to an unseen prompt that will come up."},{"id":409,"text":"from your user base. And so this approach, SFT, really teaches the model to imitate good behavior from humans. And that's the key. It's imitation. It is not preference optimization. To do preference optimization, that's where we're going to train a reward model and we're going to do proper RLHF. So let me talk to you about the RM reward model. And then I'll tell you about..."},{"id":410,"text":"RLHF in a nutshell. The problem of RLHF is to align not with human responses, but with human preferences. So what's going to happen is we're going to train a separate model to predict."},{"id":411,"text":"which responses humans prefer, and we're going to call that model the reward model. It's a separate model from whatever we've trained before. The model is going to use data from labelers. So you're going to show labelers two or more responses to the same prompt, and those responses will be sampled from the SFT."}],"notes":["本段讲解了监督微调（SFT）的基本概念，即通过使用人类编写的提示-响应对来微调预训练模型。SFT的核心思想是让模型模仿人类的高质量响应，而不是直接优化偏好。这种方法虽然有效，但存在数据收集成本高和泛化能力有限的问题。","SFT的局限性包括数据收集成本高和泛化能力差。例如，早期的Instruct GPT仅使用了13,000个提示-响应对，但仍然表现良好。然而，由于SFT仅基于监督学习，模型无法很好地泛化到未见过的提示。","SFT的关键在于模仿人类行为，而不是偏好优化。偏好优化需要训练奖励模型（RM），并结合强化学习（RLHF）来对齐模型与人类偏好。","奖励模型（RM）是RLHF的一部分，其目标是预测人类对不同响应的偏好。RM使用标注者提供的数据，这些数据来自SFT模型生成的响应。","RLHF的核心问题在于对齐模型与人类偏好，而不是仅仅对齐模型与人类响应。通过训练RM，可以为强化学习提供奖励信号，从而优化模型行为。","SFT和RM是深度强化学习中的两个关键步骤，前者用于模仿人类行为，后者用于优化模型以符合人类偏好。两者结合可以提升模型的性能和对齐度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5684.97,"end":5864.32,"asr_flags":[],"raw_segments":[{"start":5684.97,"text":"It's a fully human-made data set. And then we use that data set to fine-tune our pre-trained model. And by now, you've learned fine-tuning in the online video, so you know what I'm talking about, using supervised learning. So what it looks like is I take my pre-trained model that I just told you how we train, and then I give it a prompt, explain deep learning to a beginner. And I also will concatenate to it."},{"start":5710.73,"text":"a response, a good response written by a human. Deep learning is a type of machine learning that uses neural. And then I expect the model to come up with the word networks. So it's literally do whatever we need to train the pre-trained model, but we do it on a human written prompt response pairs."},{"start":5734.79,"text":"And if you do that many times and you use the same loss function, how far the model's response is from a human response, you do that many times and you will get SFT, supervised fine tuning. But it has some shortcomings. One of the shortcomings is it is data that is extremely costly to collect. In fact, I believe in the first version of that instruct GPT, there was only 13,000."},{"start":5766.16,"text":"prompt-response pairs. And it turns out it did really well despite that. The second aspect is it's unlikely to generalize well because you're, again, you're not doing reinforcement learning here. You're doing supervised learning. And so you're just showing a set of examples, 13,000 examples that you want to learn. But it's what tells you that it will generalize to an unseen prompt that will come up."},{"start":5795.83,"text":"from your user base. And so this approach, SFT, really teaches the model to imitate good behavior from humans. And that's the key. It's imitation. It is not preference optimization. To do preference optimization, that's where we're going to train a reward model and we're going to do proper RLHF. So let me talk to you about the RM reward model. And then I'll tell you about..."},{"start":5824.51,"text":"RLHF in a nutshell. The problem of RLHF is to align not with human responses, but with human preferences. So what's going to happen is we're going to train a separate model to predict."},{"start":5842.24,"text":"which responses humans prefer, and we're going to call that model the reward model. It's a separate model from whatever we've trained before. The model is going to use data from labelers. So you're going to show labelers two or more responses to the same prompt, and those responses will be sampled from the SFT."}],"speech_gaps":[],"frame":"../frames/v062/034.webp","frame_time":5696.97},{"title":"使用偏好数据训练奖励模型","segments":[{"id":412,"text":"So your best model right now is the SFT. You will sample three or four responses and you know how we sample, right? You can tweak the temperature. You can select not only the top priority word, the top, the soft max layers, number one word, but you can sometimes sample differently and you will get a variety of answers. And then you will ask a human labeler to say answer B is better than answer C and answer C is better than answer A and answer A is sort of equal to answer D."},{"id":413,"text":"That's it. They will be asked which response they prefer, and it can get more complicated. It doesn't have to be just a simple ranking. You have multiple Likert scale methods and so on. But the point is that you will collect those pairwise comparisons that we call preference data, and you will use it to train a reward model, which is initialized from your SFT."},{"id":414,"text":"So your SFT is here. It's your best model to date. And you're going to modify the last layer. So the softmax layer at the end of a language model that will tell you this is the token we should output or this is the word we should write."},{"id":415,"text":"Instead of that, you'll get rid of that layer. You'll put a scalar value as output. You'll put a linear layer with a scalar value that will represent the reward head. It will predict the reward, which is a proxy for the preference of the human. The way you'll train that reward model is you'll give it a batch of two. You'll give it a prompt X."},{"id":416,"text":"a response A and the preference of the user. And you give it the same prompt with a response B from the SFT with the preference of the user. So here the user is saying response A is better than response B. And so if you actually were sending that in this model, you will get a predicted reward for the preferred answer and a predicted reward for this preferred answer. That allows you to train using"},{"id":417,"text":"loss function that I'm not going to cover given our time sensitivity. The loss function will encourage the model to assign higher rewards to preferred responses. So you're trying to dissociate the higher reward, better preference from the lower reward for lower preference. And it turns out that if you do that many times, you will have a reward model that given a prompt and a response will be approximating human preference."},{"id":418,"text":"So you've just trained a critique that represents your humans. It's a proxy for what humans prefer. It's been trained on a lot of human preferences. The reason it's better to use a model than actual humans is because we can use it widely on all sorts of inputs and it can scale from a data standpoint. Also note that this method is better than SFT because it's way easier to ask humans what's your preference between those two things and to ask them to come up with answers to prompts."}],"notes":["本段讲解了如何利用人类偏好数据来训练奖励模型。首先，通过SFT（监督微调）模型生成多个响应，然后让人类标注者对这些响应进行比较，以获取偏好数据。这些数据用于训练奖励模型，该模型的目标是预测人类对响应的偏好。","奖励模型的训练过程涉及将提示和响应对输入模型，并通过损失函数鼓励模型为更受偏好的响应分配更高的奖励。这种方法比直接使用人类标注更高效，因为可以大规模应用模型进行评估。","在训练奖励模型时，会移除语言模型的softmax层，替换为一个线性层，输出一个标量值作为奖励头。该奖励头预测的是人类偏好的代理指标。","训练奖励模型时，会使用包含两个响应的批次，每个响应都带有用户偏好信息。通过这种方式，模型可以学习如何根据偏好调整奖励分配。","奖励模型的训练目标是将高奖励与高偏好、低奖励与低偏好区分开来。通过多次训练，模型可以逐渐逼近人类的偏好。","使用模型代替人类标注的优势在于可以广泛应用于各种输入，并且在数据规模上具有可扩展性。此外，这种方法比SFT更高效，因为更容易获取人类对两个响应的偏好信息。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5864.89,"end":6043.65,"asr_flags":[],"raw_segments":[{"start":5864.89,"text":"So your best model right now is the SFT. You will sample three or four responses and you know how we sample, right? You can tweak the temperature. You can select not only the top priority word, the top, the soft max layers, number one word, but you can sometimes sample differently and you will get a variety of answers. And then you will ask a human labeler to say answer B is better than answer C and answer C is better than answer A and answer A is sort of equal to answer D."},{"start":5894.57,"text":"That's it. They will be asked which response they prefer, and it can get more complicated. It doesn't have to be just a simple ranking. You have multiple Likert scale methods and so on. But the point is that you will collect those pairwise comparisons that we call preference data, and you will use it to train a reward model, which is initialized from your SFT."},{"start":5918.68,"text":"So your SFT is here. It's your best model to date. And you're going to modify the last layer. So the softmax layer at the end of a language model that will tell you this is the token we should output or this is the word we should write."},{"start":5933.63,"text":"Instead of that, you'll get rid of that layer. You'll put a scalar value as output. You'll put a linear layer with a scalar value that will represent the reward head. It will predict the reward, which is a proxy for the preference of the human. The way you'll train that reward model is you'll give it a batch of two. You'll give it a prompt X."},{"start":5957.32,"text":"a response A and the preference of the user. And you give it the same prompt with a response B from the SFT with the preference of the user. So here the user is saying response A is better than response B. And so if you actually were sending that in this model, you will get a predicted reward for the preferred answer and a predicted reward for this preferred answer. That allows you to train using"},{"start":5987.98,"text":"loss function that I'm not going to cover given our time sensitivity. The loss function will encourage the model to assign higher rewards to preferred responses. So you're trying to dissociate the higher reward, better preference from the lower reward for lower preference. And it turns out that if you do that many times, you will have a reward model that given a prompt and a response will be approximating human preference."},{"start":6015.31,"text":"So you've just trained a critique that represents your humans. It's a proxy for what humans prefer. It's been trained on a lot of human preferences. The reason it's better to use a model than actual humans is because we can use it widely on all sorts of inputs and it can scale from a data standpoint. Also note that this method is better than SFT because it's way easier to ask humans what's your preference between those two things and to ask them to come up with answers to prompts."}],"speech_gaps":[],"frame":"../frames/v062/035.webp","frame_time":5876.89},{"title":"强化学习中的奖励模型与人类反馈","segments":[{"id":419,"text":"It takes way less time. And if you've used ChatGPT, you've probably been asked before to tell them which response you prefer. So once trained, the reward model replaces the human as the evaluator during reinforcement learning from human feedback. And reinforcement learning from human feedback is..."},{"id":420,"text":"Very comfortable for you now. I will show you what it looks like given the Q-learning algorithm we learned. But essentially, we have first taught the model what good behavior looks like with SFT. And then we built a reward model that can tell us how good an answer is according to human preferences. And the RLHF approach is where we will let this model practice, get scored by the reward model or the critic, and update itself to produce higher."},{"id":421,"text":"scoring answers, so more preferred answers. And it's the same as the games we've seen together, but some things differ. So I just pasted here the exact setup that we've learned together for reinforcement learning. The differences are the following. Our objective is still to maximize expected reward that is produced by the reward model aligned with human preferences."},{"id":422,"text":"The agent is the language model being fine-tuned. The environment is the space of possible prompts and continuations. It's any text that you can encounter. The state is the specific prompt plus the tokens that were generated so far. The next state is one more token added. And the action is the next token that is chosen by the agent or the model, which is..."},{"id":423,"text":"of course determined by the policy. And then the reward is estimated by the reward model that we trained to represent human preferences. In this case one episode is one full prompt."},{"id":424,"text":"So imagine that you get a prompt and you start generating and you go through this reinforcement learning loop and you observe the rewards and then you try to maximize the future rewards. And then at the end of training, you end up with having your pre-trained model turn into an SFT and your SFT turn into a way better model using RLHF. Okay, so a few things to note to end on this. The model does not get a reward at..."}],"notes":["本段讲解了强化学习中使用奖励模型和人类反馈（RLHF）的方法。首先，模型通过监督微调（SFT）学习人类认为好的行为，然后构建一个奖励模型来评估回答的质量。奖励模型根据人类偏好来评分，模型通过与奖励模型互动进行强化学习，以生成更符合人类偏好的回答。","在RLHF框架中，代理是被微调的语言模型，环境是所有可能的提示和延续文本，状态是特定提示和已生成的标记，动作是模型选择的下一个标记。奖励由奖励模型估计，其目标是最大化奖励模型产生的预期奖励。","课程中提到，一个训练回合（episode）对应一个完整的提示，模型在生成过程中通过强化学习循环观察奖励，并尝试最大化未来奖励。最终，预训练模型通过SFT和RLHF的结合，演变为一个性能更好的模型。","课程还指出，在强化学习过程中，模型不会在每个步骤都获得奖励，而是通过奖励模型的评分来更新策略。这种机制使得模型能够逐步优化其生成的回答，使其更符合人类的偏好。","整个过程强调了奖励模型在强化学习中的核心作用，它不仅评估回答的质量，还作为人类偏好的代理，使模型能够通过与奖励模型的互动不断改进。","课程最后提到，模型在训练过程中不会在每个步骤都获得奖励，而是通过奖励模型的评分来更新策略，这与传统的强化学习方法有所不同。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6044.17,"end":6200.4,"asr_flags":[],"raw_segments":[{"start":6044.17,"text":"It takes way less time. And if you've used ChatGPT, you've probably been asked before to tell them which response you prefer. So once trained, the reward model replaces the human as the evaluator during reinforcement learning from human feedback. And reinforcement learning from human feedback is..."},{"start":6065.17,"text":"Very comfortable for you now. I will show you what it looks like given the Q-learning algorithm we learned. But essentially, we have first taught the model what good behavior looks like with SFT. And then we built a reward model that can tell us how good an answer is according to human preferences. And the RLHF approach is where we will let this model practice, get scored by the reward model or the critic, and update itself to produce higher."},{"start":6092.46,"text":"scoring answers, so more preferred answers. And it's the same as the games we've seen together, but some things differ. So I just pasted here the exact setup that we've learned together for reinforcement learning. The differences are the following. Our objective is still to maximize expected reward that is produced by the reward model aligned with human preferences."},{"start":6121.35,"text":"The agent is the language model being fine-tuned. The environment is the space of possible prompts and continuations. It's any text that you can encounter. The state is the specific prompt plus the tokens that were generated so far. The next state is one more token added. And the action is the next token that is chosen by the agent or the model, which is..."},{"start":6150.99,"text":"of course determined by the policy. And then the reward is estimated by the reward model that we trained to represent human preferences. In this case one episode is one full prompt."},{"start":6171.27,"text":"So imagine that you get a prompt and you start generating and you go through this reinforcement learning loop and you observe the rewards and then you try to maximize the future rewards. And then at the end of training, you end up with having your pre-trained model turn into an SFT and your SFT turn into a way better model using RLHF. Okay, so a few things to note to end on this. The model does not get a reward at..."}],"speech_gaps":[],"frame":"../frames/v062/036.webp","frame_time":6056.17},{"title":"强化学习中的奖励稀疏性与人类偏好代理","segments":[{"id":425,"text":"Every single token, it gets a reward at the end of a sequence when the completion is finished because the reward model was asked to rate prompts and responses together. So you need to finish the generation in order to see what's the reward. And so again, going back to making good sequences of decision, that's exactly it. You want the model to make enough good sequences of decision so that the response is..."},{"id":426,"text":"preferred by the critique, which represents a proxy to the human preferences. So all intermediary rewards are typically zero. And that makes it a very sparse reward episodic tasks, just like a game of chess where you only get a reward when you finish assuming you're not defining intermediary reward. So you only know if you did well at the end and you have to then use that information to update your network and get a better proxy for it."},{"id":427,"text":"Super. There is a very nice video. We're not going to play it for the sake of time, but I will send it online. It's from four days ago. It's, you know, former Stanford students, Andres Carpati, who is very thoughtful and articulate and was explaining four days ago why reinforcement learning can be terrible at times and that human minds work way more efficiently. And so I would encourage you to watch this four minute video because he's very clearly outlined"},{"id":428,"text":"why reinforcement learning is still not great, even if it's the best thing we can use in many ways."}],"notes":["本段讲解了强化学习中奖励稀疏性的概念，即在序列生成任务中，只有在序列完成时才会获得奖励，而中间步骤的奖励通常为零。这种设计类似于国际象棋游戏，只有在游戏结束时才会获得奖励，这使得学习过程变得困难，因为模型只能在最终结果上获得反馈。","讲者提到奖励模型被要求对提示和响应进行评分，因此需要完成生成才能看到奖励。这表明奖励模型的作用是作为人类偏好的代理，从而引导模型生成更符合人类期望的输出。","讲者指出，这种稀疏奖励机制使得任务成为一种稀疏奖励的回合制任务，模型必须依赖最终的奖励信息来更新网络，以获得更准确的偏好代理。","讲者强调，这种设计虽然在某些方面是有效的，但仍然存在局限性，因为模型只能通过最终结果来学习，而无法利用中间步骤的反馈进行优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":6200.83,"end":6291.44,"asr_flags":[],"raw_segments":[{"start":6200.83,"text":"Every single token, it gets a reward at the end of a sequence when the completion is finished because the reward model was asked to rate prompts and responses together. So you need to finish the generation in order to see what's the reward. And so again, going back to making good sequences of decision, that's exactly it. You want the model to make enough good sequences of decision so that the response is..."},{"start":6226.59,"text":"preferred by the critique, which represents a proxy to the human preferences. So all intermediary rewards are typically zero. And that makes it a very sparse reward episodic tasks, just like a game of chess where you only get a reward when you finish assuming you're not defining intermediary reward. So you only know if you did well at the end and you have to then use that information to update your network and get a better proxy for it."},{"start":6256.77,"text":"Super. There is a very nice video. We're not going to play it for the sake of time, but I will send it online. It's from four days ago. It's, you know, former Stanford students, Andres Carpati, who is very thoughtful and articulate and was explaining four days ago why reinforcement learning can be terrible at times and that human minds work way more efficiently. And so I would encourage you to watch this four minute video because he's very clearly outlined"},{"start":6286.12,"text":"why reinforcement learning is still not great, even if it's the best thing we can use in many ways."}],"speech_gaps":[],"frame":"../frames/v062/037.webp","frame_time":6212.83}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
