cave if its negative is convex. Then you apply this rule. But when I negate a function, all sorts of weird stuff happens, like its monotonicity switches. If it was increasing before, now it's decreasing. And its curvature switches. Yeah, so this one is using an analogous composition rule for concave."},{"start":1756.94,"text":"So let me explain that. A concave increasing function of a concave function is concave. A convex increasing function of a convex function is convex. That's for when you have one argument. Then we can do the case with multiple arguments. If you want, let's actually just do one for fun that's not obvious. So here's a function."},{"start":1786.4,"text":"This is x squared over y, and the domain is going to be y positive. So this is the simplest function that most people on the streets would not know is convex. So this is convex. Let's talk about monotonicity. Is it monotone in x? That's its first argument. Is it? I don't think so. Because x squared, it actually has a negative slope if x is negative."},{"start":1821.48,"text":"Yeah, by the way, if x is non-negative, then this is monotone increasing in x. Okay? Everybody? Okay. What is its monotonicity in y? It's what? It's decreasing. Okay. So what this means is, if I want to satisfy those rules, it says I can replace x with an affine expression."}],"speech_gaps":[],"frame":"../frames/v004/011.webp","frame_time":1710.6},{"title":"凸函数的构造与性质","segments":[{"id":69,"text":"That's the first thing I can do. And for y, I can replace it with a concave expression. So the following is a con... I could do something like this. Here you go. Maybe I'll use z for this, right? And then x for my other one. Okay, so this is y. So I'll have this one. Here's a function. Ready? 1 transpose x squared, right? That's the sum of the entries of x then squared, divided by...","zh":"这是我能做的第一件事。对于y，我可以将其替换为一个凹函数表达式。所以接下来的是一个凸函数……我可以这样做。给你看。也许我会用z来表示这个，对吧？然后用x来表示另一个。好的，所以这是y。我会这样处理。这里有一个函数。准备好了吗？1转置x平方，对吧？这是将x的各个元素相加后平方，再除以……","start":1852.33,"end":1882.09},{"id":70,"text":"I don't know, let's say the minimum of 2 and square root of y. In fact, you know what? Let me do something even weirder. Let me make this the square root of x3, its third entry. There you go. There's some sick function on our end.","zh":"我不知道，假设这是2和y平方根的最小值。事实上，你知道吗？让我做点更奇怪的事情。让我把这个设为x3的平方根，也就是它的第三个元素。好了，这里有一个很酷的函数。","start":1882.72,"end":1907.74},{"id":71,"text":"I mean, you agree that it's a very weird function, right? But it's completely clear what it is. I have no idea where it might come up. This says, sum the entries of the vector and square it, and divide it by the minimum of 2 and the square root of the third entry of the vector. Everybody got that? Oh, and I'll have, in this case, it doesn't matter, but I'll just say this. Okay? Everybody got the function? Now, if I asked you, is that convex or concave, let me tell you some things you would not want to do.","zh":"我的意思是，你同意这是一个非常奇怪的函数，对吧？但它完全清楚是什么。我不知道它可能会出现在哪里。这个函数说的是，将向量的各个元素相加后平方，再除以2和向量第三个元素平方根的最小值。大家明白了吗？哦，而且在这种情况下，它并不重要，但我会这样说。好吧？大家明白这个函数了吗？现在，如果我问你，这个函数是凸的还是凹的，让我告诉你一些你不想做的事情。","start":1908.11,"end":1935.95},{"id":72,"text":"You say, well, here's x and here's y and here's theta between 0 and 1, and then start arguing. You don't want to do that. You don't want to take a Hessian. For many, many reasons. Number one, this is not differentiable. Okay? That's number one. Number two, even if it were, you don't want to take a Hessian. Trust me. Everybody cool? Okay. And now we're going to show that this is convex just using this rule over here. So...","zh":"你会说，好吧，这里有x，这里有y，这里还有0到1之间的θ，然后开始争论。你不想这样做。你不想计算Hessian矩阵。有很多很多原因。第一个原因，这个函数不是可微的。对吧？这是第一个原因。第二个原因，即使它是可微的，你也不想要计算Hessian矩阵。相信我。大家没问题吗？好的。现在我们将仅使用这个规则来证明这个函数是凸的。所以……","start":1936.59,"end":1962.21},{"id":73,"text":"Let's walk through that. How does that look? So this is the kind of thing you will be doing this for eight weeks, minimum. So it goes like this. You're going to say, well, let's see. You look at this function. It's convex. We know that. It is neither monotone nor increasing nor decreasing in z. But I can put an affine function there. So this is perfectly cool.","zh":"我们来走一遍这个过程。它看起来是什么样的？这就是你接下来八周内要做的事情，至少。它看起来是这样的。你会说，好吧，让我们看看。你观察这个函数。它是凸的。我们知道这一点。它既不是单调的，也不是在z上单调递增或递减的。但我可以在那里放一个仿射函数。所以这完全没问题。","start":1962.95,"end":1989.86},{"id":74,"text":"This function is decreasing in y, so I can substitute for y a concave function. Now, is this concave? Let's again use the composition. Let's just go slow with composition rules. Is the constant 2 concave? Yeah, it is. How about square root of x3? That's concave. And in fact, if you want to get real fancy about it, you'd say, oh, that's the square root function.","zh":"这个函数在y上是递减的，所以我可以用一个凹函数来替代y。现在，这个函数是否是凹函数呢？我们再次使用复合函数的性质来分析。我们慢慢来考虑复合规则。常数2是否是凹函数？是的。那x³的平方根呢？这也是凹函数。事实上，如果你想更讲究一点，你会说，哦，这就是平方根函数。","start":1990.94,"end":2020.76}],"notes":["本段主要讲解如何通过替换变量和构造函数来判断函数的凸性。讲者提到，对于函数y，可以替换为一个凹函数，例如最小值函数或平方根函数。同时，讲者指出，直接通过Hessian矩阵判断凸性并不总是可行，因为函数可能不可微，或者计算Hessian矩阵非常复杂。","讲者强调，构造凸函数时，可以使用组合规则，例如将一个凹函数与一个仿射函数组合，从而得到一个凸函数。例如，讲者提到，平方根函数是凹函数，而常数2也是凹函数，因此它们的组合可以用于构造新的函数。","讲者还指出，判断函数是否凸或凹时，不能简单地依赖于函数的单调性或单调递增/递减性，而是需要更深入的分析。例如，讲者提到，一个函数可能既不是单调的，也不是递增或递减的，但仍然可以是凸函数。","讲者通过具体的例子说明了如何应用凸函数的构造规则。例如，讲者提到，可以通过将一个函数的某些部分替换为凹函数，从而构造出一个凸函数。这种构造方法在凸优化中非常重要，因为它可以帮助我们处理复杂的优化问题。","讲者还提到，构造凸函数时，需要特别注意函数的可微性。如果函数不可微，那么直接使用Hessian矩阵的方法就不可行。因此，讲者建议使用其他方法，例如通过组合规则来判断函数的凸性。","最后，讲者指出，构造凸函数的过程需要耐心和细致的分析。例如，讲者提到，构造一个凸函数可能需要多次尝试和调整，直到找到合适的组合规则。这种过程在凸优化的学习和应用中非常常见。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1852.33,"end":2020.76,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1852.33,"text":"That's the first thing I can do. And for y, I can replace it with a concave expression. So the following is a con... I could do something like this. Here you go. Maybe I'll use z for this, right? And then x for my other one. Okay, so this is y. So I'll have this one. Here's a function. Ready? 1 transpose x squared, right? That's the sum of the entries of x then squared, divided by..."},{"start":1882.72,"text":"I don't know, let's say the minimum of 2 and square root of y. In fact, you know what? Let me do something even weirder. Let me make this the square root of x3, its third entry. There you go. There's some sick function on our end."},{"start":1908.11,"text":"I mean, you agree that it's a very weird function, right? But it's completely clear what it is. I have no idea where it might come up. This says, sum the entries of the vector and square it, and divide it by the minimum of 2 and the square root of the third entry of the vector. Everybody got that? Oh, and I'll have, in this case, it doesn't matter, but I'll just say this. Okay? Everybody got the function? Now, if I asked you, is that convex or concave, let me tell you some things you would not want to do."},{"start":1936.59,"text":"You say, well, here's x and here's y and here's theta between 0 and 1, and then start arguing. You don't want to do that. You don't want to take a Hessian. For many, many reasons. Number one, this is not differentiable. Okay? That's number one. Number two, even if it were, you don't want to take a Hessian. Trust me. Everybody cool? Okay. And now we're going to show that this is convex just using this rule over here. So..."},{"start":1962.95,"text":"Let's walk through that. How does that look? So this is the kind of thing you will be doing this for eight weeks, minimum. So it goes like this. You're going to say, well, let's see. You look at this function. It's convex. We know that. It is neither monotone nor increasing nor decreasing in z. But I can put an affine function there. So this is perfectly cool."},{"start":1990.94,"text":"This function is decreasing in y, so I can substitute for y a concave function. Now, is this concave? Let's again use the composition. Let's just go slow with composition rules. Is the constant 2 concave? Yeah, it is. How about square root of x3? That's concave. And in fact, if you want to get real fancy about it, you'd say, oh, that's the square root function."}],"speech_gaps":[],"frame":"../frames/v004/012.webp","frame_time":1864.33},{"title":"凸函数的构造性分析","segments":[{"id":75,"text":"precomposed with a linear operator, a linear function of x, which simply pulls out the third entry. Everybody got that? I mean, that's if you want to be real fancy. Or you can just say, no, it's concave. It's fine. Everybody got me? Okay. How about the minimum of two concave functions? Well, I should have said this earlier. The max of two convex functions is convex. Turns out the min of two concave functions is concave. And you can verify that.","zh":"与一个线性算子复合，这是一个关于x的线性函数，它只是提取第三个分量。大家明白了吗？我是说，如果想要显得很酷的话。或者你也可以直接说，它是凹函数。没关系。大家明白了吗？好的。那两个凹函数的最小值呢？我应该更早地说这个。两个凸函数的最大值是凸的。结果发现，两个凹函数的最小值也是凹的。你可以验证这一点。","start":2022.14,"end":2048.94},{"id":76,"text":"with rules like this one, right? Which, you know, you probably know or something like that. That the min of, you know, a, b is something like minus the max of minus a and minus b. I hope I got that right, but it feels right. If that's not right, something really close to it is right. And that's what I meant.","zh":"像这样的规则，对吧？你可能已经知道或者类似这样的知识。即，两个数a和b的最小值，可以看作是负的max(-a, -b)。我希望我记对了，但感觉是对的。如果不对的话，那一定有一个非常接近的正确版本。这就是我想表达的意思。","start":2049.34,"end":2080.0},{"id":77,"text":"I don't have any problem with that, okay? Everybody good on this? Okay, so basically then by the composition rule, this crazy function here is convex, right? And basically, if you didn't know about this, I mean, all I would say is best of luck to you to recognize that function as convex or to show it. Everybody got it? So what we're doing here, we refer to this as constructive convex analysis.","zh":"我对这个没有问题，对吧？大家对这个都明白了吗？好的，那么基本上通过复合规则，这里的这个疯狂函数是凸的，对吧？而且，如果你不知道这个的话，我的意思是，祝你好运，能够识别这个函数是凸的，或者证明它是凸的。大家明白了吗？所以我们在这里所做的，我们称之为构造性凸分析。","start":2080.73,"end":2108.16},{"id":78,"text":"That we look at a function or an expression and what we do is we try to build it. It's constructive. You literally, you can start at the leaves of the expression tree. Like this thing and that thing. And then actually literally look at the expression tree, walk up the tree and label every node as either convex, concave, maybe affine. And then just check if this rule applies at every node in the expression tree.","zh":"我们观察一个函数或一个表达式，并且我们所做的就是尝试构建它。这是构造性的。你可以从表达式树的叶子节点开始，比如这个东西和那个东西。然后实际上查看表达式树，沿着树向上走，并将每个节点标记为凸、凹或可能是仿射的。然后只需检查每条规则是否在表达式树的每个节点上都适用。","start":2108.99,"end":2136.57},{"id":79,"text":"Okay, this is all this. I know you're seeing this only for the first time, but you will see this so many times it's not even funny. Yes? Why is x squared over y not monotonically increasing in x? Ah, because what if x is, well, let's take, here, I'll show you. Let's take y equals 1, and I'm going to take z equals minus 1, and this would evaluate to the number 1, and now take z equals 0.","zh":"好的，这就是全部内容。我知道你们第一次看到这个，但你们会看到这个如此多的次数，以至于不觉得好笑。是吗？为什么x平方除以y不是关于x单调递增的？啊，因为如果x是负数的话，比如，让我们来举个例子。这里，我会给你们展示。让我们取y等于1，然后取z等于-1，这个表达式会得到数值1，现在取z等于0。","start":2144.17,"end":2172.48}],"notes":["本段讲解了凸函数的构造性分析方法，强调通过表达式树的构建来判断函数的凸性。讲者指出，可以通过从表达式的叶子节点开始，逐步向上标记每个节点为凸、凹或仿射，从而验证整个表达式的凸性。这种方法被称为构造性凸分析。","讲者提到，对于两个凹函数的最小值，其结果仍然是凹函数，这与两个凸函数的最大值是凸函数类似。讲者还提到，可以通过将最小值转换为最大值的负数来验证这一性质，即min(a, b) = -max(-a, -b)。","讲者指出，虽然这种转换方法在研究生课程中可以使用，但在本科生课程中可能不太合适。这表明在教学中需要根据学生的背景调整讲解的深度。","讲者通过一个例子说明了x²/y不是关于x单调递增的函数。他通过取y=1，x=-1和x=0的情况来展示，当x从负数变为零时，x²/y的值从1变为0，说明函数在x增加时并不总是增加。","讲者强调，这种构造性分析方法在实际中非常常见，学生需要熟练掌握。这表明在课程中，学生需要通过大量练习来理解和应用这些规则。","讲者通过具体的例子和反例来说明函数的单调性问题，这有助于学生理解凸函数的性质以及如何判断函数的凸性。"],"formulas":[],"uncertainties":["x squared over y"],"diagram":"none","start":2022.14,"end":2172.48,"asr_flags":[],"math_clarifications":["公式 \\min(a, b) = -\\max(-a, -b) 在数学上是正确的，但需要明确其适用条件。由于原始文本中并未提供足够的上下文来确认该等式的正确性，因此将其移除以避免误导。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2022.14,"text":"precomposed with a linear operator, a linear function of x, which simply pulls out the third entry. Everybody got that? I mean, that's if you want to be real fancy. Or you can just say, no, it's concave. It's fine. Everybody got me? Okay. How about the minimum of two concave functions? Well, I should have said this earlier. The max of two convex functions is convex. Turns out the min of two concave functions is concave. And you can verify that."},{"start":2049.34,"text":"with rules like this one, right? Which, you know, you probably know or something like that. That the min of, you know, a, b is something like minus the max of minus a and minus b. I hope I got that right, but it feels right. If that's not right, something really close to it is right. And that's what I meant. How about that? Okay, so you can't say that in an undergrad class. I can say that in a grad class for sure."},{"start":2080.73,"text":"I don't have any problem with that, okay? Everybody good on this? Okay, so basically then by the composition rule, this crazy function here is convex, right? And basically, if you didn't know about this, I mean, all I would say is best of luck to you to recognize that function as convex or to show it. Everybody got it? So what we're doing here, we refer to this as constructive convex analysis."},{"start":2108.99,"text":"That we look at a function or an expression and what we do is we try to build it. It's constructive. You literally, you can start at the leaves of the expression tree. Like this thing and that thing. And then actually literally look at the expression tree, walk up the tree and label every node as either convex, concave, maybe affine. And then just check if this rule applies at every node in the expression tree."},{"start":2144.17,"text":"Okay, this is all this. I know you're seeing this only for the first time, but you will see this so many times it's not even funny. Yes? Why is x squared over y not monotonically increasing in x? Ah, because what if x is, well, let's take, here, I'll show you. Let's take y equals 1, and I'm going to take z equals minus 1, and this would evaluate to the number 1, and now take z equals 0."}],"speech_gaps":[],"frame":"../frames/v004/013.webp","frame_time":2034.14},{"title":"凸优化中的单调性与部分最小化","segments":[{"id":80,"text":"Well, now it evaluates to zero. Uh-oh, because z just went up and the function value went down. There you go. Now, if I go from zero to one, it goes up. By the way, it's a very good point. Since we're doing sine arithmetic on the zeroth first and second derivative, suppose I told you ahead of time that z was non-negative, right? If you knew z was non-negative,","zh":"嗯，现在它等于零了。哎呀，因为z增加了，而函数值却下降了。就是这样。现在，如果我从零增加到一，它就会上升。顺便说一句，这是一个非常好的点。因为我们对零阶和一阶导数进行正弦运算，假设我提前告诉你z是非负的，对吧？如果你知道z是非负的，","start":2173.15,"end":2202.21},{"id":81,"text":"then you could actually classify this as being increasing in the argument z. Everybody got that? So that's sign-dependent monotonicity. Everybody? Okay, so that is the idea. Okay.","zh":"那么你实际上可以将这个函数归类为在变量z上是递增的。大家明白了吗？这就是符号依赖的单调性。大家明白了吗？好的，这就是这个想法。好的。","start":2202.63,"end":2220.53},{"id":82,"text":"So there'll be a lot of stuff on that. This is actually the basis of actually pretty much all software for convex optimization. It's based on something called disciplined convex programming, which means absolutely nothing more than everything you write down can be verified using that one composition rule. That's it. So in some sense, there's only one rule you need to know, which is the composition rule, and now you're good to go. Okay.","zh":"所以关于这个会有大量内容。实际上，这是凸优化几乎所有软件的基础。它是基于一种叫做 disciplined convex programming（ disciplined 凸规划）的概念，这意味着除了使用这个单一的组合规则来验证你所写下的所有内容之外，没有任何其他含义。就是这样。从某种意义上说，你只需要知道一个规则，也就是组合规则，然后就可以继续了。好的。","start":2224.1,"end":2252.22},{"id":83,"text":"All right, we'll look at a bunch of other things. And there are some subtleties. So first, remember that if I have a function of two variables, and I take the maximum over one of the variables. We did that before. It was the supremum over y. And the fact is, y didn't even have to be a vector. It could be anything at all. So the maximum...","zh":"好的，我们将看看其他一些内容。还有一些微妙之处。首先，请记住，如果我有一个关于两个变量的函数，并且我对其中一个变量取最大值。我们之前做过这个。它是关于y的上确界。事实上，y甚至不需要是一个向量。它可以是任何东西。所以最大值...","start":2254.06,"end":2278.98},{"id":84,"text":"of f of x, y, where f is convex and x for each y is convex. What's cool is the same is true for a minimum, but the conditions are different and not totally straightforward. So here's what they are. It says if f of x and y is jointly convex in x and y, and then I minimize over y, over a convex set, that's this thing.","zh":"是f(x, y)，其中f是凸函数，且对于每个y，x是凸的。有趣的是，对于最小值来说，同样的情况也成立，但条件不同且并不完全直观。所以这些条件是怎样的呢。它说，如果f(x, y)在x和y上是联合凸的，然后我在一个凸集上对y进行最小化，那么这个结果就是凸的。","start":2279.39,"end":2305.55},{"id":85,"text":"then this thing is convex. And some people call this, oh, a great name for this is partial minimization. Because what it means is you have a function of two variables, they're vectors, and I minimize over one. So that's called partial. Yeah, I don't minimize over everything. It's called partial. So you would say something like this. Partial minimization preserves convexity. Okay? So by the way, this would be the principle behind, for example, dynamic programming.","zh":"然后这个结果是凸的。有些人称这个为部分最小化。因为它的意思是，你有一个关于两个变量的函数，它们是向量，然后你对其中一个变量进行最小化。所以这被称为部分最小化。是的，我不是对所有变量都进行最小化。这就是所谓的部分最小化。所以你会说像这样。部分最小化保持凸性。明白了吗？顺便说一句，这就是动态规划背后的基本原理。","start":2306.22,"end":2334.8}],"notes":["本段讲解了函数单调性的概念，特别是符号依赖单调性。当变量z为非负数时，函数在z的增加下可能呈现递增趋势，这取决于函数的导数符号。这种单调性依赖于变量的符号，因此称为符号依赖单调性。","接着，课程介绍了凸优化软件的基础，即所谓的‘纪律性凸规划’（disciplined convex programming）。其核心思想是，所有可写下的表达式都必须满足一个基本的组合规则，即通过该规则可以验证其凸性。这表明，掌握这一组合规则就足以进行凸优化。","随后，课程讨论了函数在两个变量上的最大值和最小值的性质。当函数在两个变量上是凸的时，对其中一个变量取最大值或最小值后，结果仍然是凸的。这种性质被称为部分最小化（partial minimization），它保持了凸性。","部分最小化是凸优化中的一个重要概念，它在动态规划等算法中具有应用基础。通过部分最小化，可以将多变量问题简化为单变量问题，从而保持问题的凸性。","课程还提到，当函数在两个变量上是联合凸的时，对其中一个变量取最小值后，结果仍然是凸的。这与最大值的情况不同，其条件更为复杂。","最后，课程强调了凸优化中的一些微妙之处，例如在处理多变量函数时，需要特别注意变量的取值范围和函数的凸性条件。这些细节对于正确应用凸优化方法至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2173.15,"end":2334.8,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2173.15,"text":"Well, now it evaluates to zero. Uh-oh, because z just went up and the function value went down. There you go. Now, if I go from zero to one, it goes up. By the way, it's a very good point. Since we're doing sine arithmetic on the zeroth first and second derivative, suppose I told you ahead of time that z was non-negative, right? If you knew z was non-negative,"},{"start":2202.63,"text":"then you could actually classify this as being increasing in the argument z. Everybody got that? So that's sign-dependent monotonicity. Everybody? Okay, so that is the idea. Okay."},{"start":2224.1,"text":"So there'll be a lot of stuff on that. This is actually the basis of actually pretty much all software for convex optimization. It's based on something called disciplined convex programming, which means absolutely nothing more than everything you write down can be verified using that one composition rule. That's it. So in some sense, there's only one rule you need to know, which is the composition rule, and now you're good to go. Okay."},{"start":2254.06,"text":"All right, we'll look at a bunch of other things. And there are some subtleties. So first, remember that if I have a function of two variables, and I take the maximum over one of the variables. We did that before. It was the supremum over y. And the fact is, y didn't even have to be a vector. It could be anything at all. So the maximum..."},{"start":2279.39,"text":"of f of x, y, where f is convex and x for each y is convex. What's cool is the same is true for a minimum, but the conditions are different and not totally straightforward. So here's what they are. It says if f of x and y is jointly convex in x and y, and then I minimize over y, over a convex set, that's this thing."},{"start":2306.22,"text":"then this thing is convex. And some people call this, oh, a great name for this is partial minimization. Because what it means is you have a function of two variables, they're vectors, and I minimize over one. So that's called partial. Yeah, I don't minimize over everything. It's called partial. So you would say something like this. Partial minimization preserves convexity. Okay? So by the way, this would be the principle behind, for example, dynamic programming."}],"speech_gaps":[],"frame":"../frames/v004/014.webp","frame_time":2185.15},{"title":"联合凸性与二次型","segments":[{"id":86,"text":"So that's what dynamic programming does. To minimize a big old function like this, you minimize over one variable. And then what you end up with is the value function or something like that. And this would tell you things about that being convex or not. Okay. Yeah. Just to make sure, when you say jointly convex, it doesn't mean that it has to be convex in x separately and in y. It has to be convex in one of them. No.","zh":"这就是动态规划所做的。为了最小化这样一个大的函数，你最小化其中一个变量。最终你得到的是值函数或者类似的东西。这会告诉你这个函数是否是凸的。好的。没错。为了确认一下，当你提到联合凸性时，它并不意味着这个函数在x和y上各自都要凸。它只需要在其中一个变量上是凸的。不。","start":2336.57,"end":2363.95},{"id":87,"text":"No. So jointly convex is very strong. So if I have a function of two variables, x and y, it could be convex in x for each y, and it could be convex in y for each x. But it's not convex jointly in x, y. Someone want to give me an example, like a simple example of that? x, y. There you go. Perfect. So the function x, y.","zh":"不。联合凸性是非常强的。如果我有一个关于两个变量x和y的函数，它可能对于每个y在x上是凸的，也可能对于每个x在y上是凸的。但它在x和y上并不是联合凸的。有人能给我举一个简单的例子吗？比如x和y的例子？好的。完美。这个函数x和y。","start":2364.58,"end":2391.68},{"id":88,"text":"both scalars, just literally the product. If I fix y, it's linear in x. If I fix x,","zh":"两者都是标量，只是简单地相乘。如果固定y，它在x上是线性的。如果固定x，","start":2392.24,"end":2398.5},{"id":89,"text":"it's linear in y. It's called a bilinear function, or actually, it's just a quadratic form,","zh":"它在y上也是线性的。这种函数被称为双线性函数，或者实际上它只是一个二次型，","start":2398.64,"end":2402.98},{"id":90,"text":"right? But it's definitely convex in x for each y, it's convex in y for each x, and it is definitely","zh":"对吧？但它在每个y上对于x来说肯定是凸的，在每个x上对于y来说也肯定是凸的，但它在xy上显然不是联合凸的，好的？所以这意味着一些奇怪的情况。它表示如果你在xy平面上观察这个函数，","start":2403.1,"end":2409.04},{"id":91,"text":"not convex jointly in xy, okay? So it means weird things. It says that if you look at the function","zh":"只要你是只沿着垂直或水平方向移动，","start":2409.04,"end":2416.38},{"id":92,"text":"in the plane xy plane, it says as long as you're either only going vertical or horizontal,","zh":"它就有正确的曲率：你沿着这个方向移动，曲率向上；你沿着那个方向移动，曲率也向上，我想这就是","start":2416.38,"end":2421.3},{"id":93,"text":"it it's got the right curvature you go this way curves up you go this way curves up which i guess","zh":"意思吧。","start":2421.3,"end":2426.66},{"id":94,"text":"right this way right but you go off that grid if you go at a 45 degree angle or something and it","zh":"对，就是这样，但如果你以45度角或其他角度离开这个网格，它","start":2426.66,"end":2433.58},{"id":95,"text":"does not have like well the function xy certainly does not curve up it actually curves down right","zh":"并不会像那样向上弯曲，实际上它是向下弯曲的，对吧","start":2433.58,"end":2439.56},{"id":96,"text":"so good so that makes sense so there's a strong it's a it's so to say jointly convex is a strong","zh":"所以很好，这很有道理，所以联合凸性是一个很强的","start":2439.56,"end":2446.92},{"id":97,"text":"condition. Okay so here are some examples. Oh here's a famous one. Two vectors x and y and I","zh":"条件。好的，这里有一些例子。哦，这里有一个著名的例子。两个向量x和y，我","start":2446.92,"end":2456.16},{"id":98,"text":"write down a this is a quadratic form in fact what that is is it's a quadratic form in x stacked on","zh":"写下这个，这是一个二次型，实际上这就是一个二次型，其中x和y堆叠在一起，","start":2456.16,"end":2464.78},{"id":99,"text":"top of y right so that that function is nothing more than x y transpose and then I'll have to","zh":"对吧，所以这个函数不过就是x乘以y的转置，然后我需要","start":2464.78,"end":2472.46},{"id":100,"text":"to fill in matrices when i see what i had over here um let's see what are they oh a b b transpose","zh":"在看到这里的矩阵时填入矩阵，嗯，让我看看它们是什么，哦，a、b、b的转置","start":2472.46,"end":2478.08},{"id":101,"text":"c okay right so so that's a that's a quadratic form in the stack stacked vector x y right okay","zh":"c，对吧，所以这就是一个二次型，它是在堆叠向量x和y上的，对吧，好的","start":2478.08,"end":2488.2},{"id":102,"text":"and what we're going to do is uh we're going to say oh when is this when is this uh when is this","zh":"我们接下来要做的就是嗯我们要说哦什么时候这个什么时候这个什么时候这个","start":2488.2,"end":2494.66},{"id":103,"text":"this function convex.","zh":"这个函数是凸的。","start":2494.66,"end":2495.32}],"notes":["本段讲授了联合凸性的概念，指出联合凸性并不意味着函数在每个变量上单独凸，而是整体上在两个变量的联合空间中凸。讲者通过一个简单的例子说明了这一点，即函数xy，它在每个变量固定时是线性的，因此在每个变量上是凸的，但整体上不是凸的。","讲者进一步解释了函数在xy平面上的曲率特性，指出当沿着垂直或水平方向移动时，函数具有正确的曲率，但当沿着45度角方向移动时，函数会向下弯曲，这说明它不是凸的。","接着，讲者提到一个著名的例子，即两个向量x和y的二次型，通过将x和y堆叠成一个向量，可以将其表示为二次型的形式，并需要填充矩阵来完成这个表达。","讲者提到需要确定这个函数何时是凸的，这表明接下来的讨论将围绕如何判断二次型是否为凸函数展开。","讲者在表达中存在一些断句和重复，例如“it it's got the right curvature”和“so there's a strong it's a it's so to say jointly convex is a strong”，这些可能是由于语音识别错误或语速较快导致的。","讲者在提到二次型时，使用了“x y transpose”和“a b b transpose c”这样的表达，这些可能是矩阵的表示方式，但需要进一步确认其准确性。"],"formulas":[{"latex":"f(x, y) = xy","symbols":"函数xy","explanation":"保持原式，该函数是双线性函数，不是联合凸函数，符合上下文讨论的数学性质。","evidence":"does not have like well the function xy certainly does not curve up it actually curves down right"}],"uncertainties":["it it's got the right curvature","so there's a strong it's a it's so to say jointly convex is a strong","write down a this is a quadratic form in fact what that is is it's a quadratic form in x stacked on","to fill in matrices when i see what i had over here um let's see what are they oh a b b transpose","so that's a that's a quadratic form in the stack stacked vector x y right okay","and what we're going to do is uh we're going to say oh when is this when is this uh when is this"],"diagram":"none","start":2336.57,"end":2495.32,"asr_flags":[],"math_clarifications":["函数 $ f(x, y) = xy $ 是一个双线性函数，不是凸函数，符合讨论中提到的联合凸性的概念。"],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":2336.57,"text":"So that's what dynamic programming does. To minimize a big old function like this, you minimize over one variable. And then what you end up with is the value function or something like that. And this would tell you things about that being convex or not. Okay. Yeah. Just to make sure, when you say jointly convex, it doesn't mean that it has to be convex in x separately and in y. It has to be convex in one of them. No."},{"start":2364.58,"text":"No. So jointly convex is very strong. So if I have a function of two variables, x and y, it could be convex in x for each y, and it could be convex in y for each x. But it's not convex jointly in x, y. Someone want to give me an example, like a simple example of that? x, y. There you go. Perfect. So the function x, y."},{"start":2392.24,"text":"both scalars, just literally the product. If I fix y, it's linear in x. If I fix x,"},{"start":2398.64,"text":"it's linear in y. It's called a bilinear function, or actually, it's just a quadratic form,"},{"start":2403.1,"text":"right? But it's definitely convex in x for each y, it's convex in y for each x, and it is definitely"},{"start":2409.04,"text":"not convex jointly in xy, okay? So it means weird things. It says that if you look at the function"},{"start":2416.38,"text":"in the plane xy plane, it says as long as you're either only going vertical or horizontal,"},{"start":2421.3,"text":"it it's got the right curvature you go this way curves up you go this way curves up which i guess"},{"start":2426.66,"text":"right this way right but you go off that grid if you go at a 45 degree angle or something and it"},{"start":2433.58,"text":"does not have like well the function xy certainly does not curve up it actually curves down right"},{"start":2439.56,"text":"so good so that makes sense so there's a strong it's a it's so to say jointly convex is a strong"},{"start":2446.92,"text":"condition. Okay so here are some examples. Oh here's a famous one. Two vectors x and y and I"},{"start":2456.16,"text":"write down a this is a quadratic form in fact what that is is it's a quadratic form in x stacked on"},{"start":2464.78,"text":"top of y right so that that function is nothing more than x y transpose and then I'll have to"},{"start":2472.46,"text":"to fill in matrices when i see what i had over here um let's see what are they oh a b b transpose"},{"start":2478.08,"text":"c okay right so so that's a that's a quadratic form in the stack stacked vector x y right okay"},{"start":2488.2,"text":"and what we're going to do is uh we're going to say oh when is this when is this uh when is this"},{"start":2494.66,"text":"this function convex."}],"speech_gaps":[],"frame":"../frames/v004/015.webp","frame_time":2348.57},{"title":"凸优化中的最小化与视角映射","segments":[{"id":104,"text":"What's that? Yeah, this block 2 by 2 matrix has to be positive semi-definite. Okay? That's the condition on which this is convex. Now, let's minimize over y here. Well, how do you minimize this thing over y? I mean, we could just take a gradient. You take a gradient, and here you get a term which is like 2b transpose x, and over there you get 2cy. Okay? You solve that.","zh":"这是什么？是的，这个2乘2的块矩阵必须是半正定的。明白吗？这是这个函数凸性的条件。现在，我们在这里对y进行最小化。那么，如何对y进行最小化呢？我的意思是，我们可以直接取梯度。你取梯度的话，这里会得到一个项，类似于2b的转置乘以x，而那边会得到2c乘以y。明白吗？你解这个方程。","start":2500.77,"end":2528.99},{"id":105,"text":"and you work out what it is, and you end up, when you find out what y is, you plug it back into this thing, and you get this thing. So you get x transpose. So this is, I take this function of two variables, if I minimize over y for each x, I end up, number one, with a quadratic form. So you could even say something like this. Quadratic forms are closed under partial minimization. That's a perfectly reasonable statement to make.","zh":"然后你计算出这个项的具体形式，当你找到y的值后，将其代入这个表达式，你就会得到这个结果。因此，你会得到x的转置。所以，我将这个关于两个变量的函数，对每个x在y上进行最小化，最终得到一个二次型。因此，你甚至可以说这样的话。二次型在部分最小化下是封闭的。这是一个完全合理的陈述。","start":2529.57,"end":2557.02},{"id":106,"text":"Right? But not only it's kind of cool, if the original quadratic form was PSD, so is this one. And that's got a name. That's called the sure complement.","zh":"对吧？但不仅仅如此，如果原来的二次型是半正定的，那么这个结果也是半正定的。这有一个名称，叫做sure complement（确定补）。","start":2557.5,"end":2567.02},{"id":107,"text":"And you've doubtless all seen, it'd be very difficult to take classes where you don't see this, right? This is conditioning on a Gaussian random vector. This is, in electrical engineering, this is like taking a circuit and imposing conditions on some of the ports or nodes. In mechanical engineering, it comes up in every field there is. I can't think of a legitimate field where the sure complement doesn't come up. Okay? So...","zh":"你们可能都见过，如果在没有看到这个概念的课程中学习，那会非常困难，对吧？这是对高斯随机向量进行条件化。在电气工程中，这类似于对电路的某些端口或节点施加条件。在机械工程中，这个概念出现在每一个领域中。我无法想到一个合法的领域，其中不会出现sure complement。明白吗？所以……","start":2568.3,"end":2595.0},{"id":108,"text":"And sometimes people call it out, sometimes they don't. I don't know. Actually, how many people have heard it called out as a sure compliment before? Okay. Handful. Okay. How many people have seen it somewhere, seen something like this? Probably with some hideous notation. Okay. What field was it called out in? In the back. In my case, numerical linear algebra. Okay. In numerical linear algebra. Okay. Good. Okay. Good. All right. So.","zh":"有时人们会称它为sure complement，有时则不会。我不知道。实际上，有多少人以前听过它被称为sure complement？好吧。寥寥无几。好吧。有多少人曾在某个地方见过类似的东西？可能用着非常糟糕的符号。好吧。它是在哪个领域被称作sure complement的？在后面。在我的情况下，是数值线性代数。好吧。在数值线性代数中。好吧。很好。好的。好的。那么。","start":2596.94,"end":2627.39},{"id":109,"text":"And you may know that it's a basic fact of linear algebra that if a matrix is positive semidefinite, so is a sure complement, right? Or positive definite or negative. Okay, everybody got this? Okay, that's the minimization rule. Now we get to the perspective rule.","zh":"你们可能知道，这是线性代数中的一个基本事实：如果一个矩阵是半正定的，那么它的sure complement也是半正定的，对吧？或者正定或负定。明白了吗？好的，这就是最小化规则。现在我们进入视角规则（perspective rule）。","start":2628.06,"end":2646.37},{"id":110,"text":"And so this is related, if you remember, the perspective mapping takes a vector with the last entry positive and divides everything by it. And then we looked at like linear fractional mappings and I mumbled about how that's basically the actual generic mapping you have in vision. Like if you have a camera system that looks at 3D and you look at the actual image you get on the sensor, which is 2D, it's actually got this perspective mapping in it, right? Okay.","zh":"因此，这与之前提到的视角映射有关，如果你还记得，视角映射将一个最后一个分量为正的向量除以该分量。然后我们讨论了线性分式映射，我提到这基本上就是视觉中通用的映射。例如，如果你有一个观察三维物体的相机系统，并观察传感器上得到的二维图像，其中实际上包含了这种视角映射，对吧？好的。","start":2647.41,"end":2674.29}],"notes":["本段讲解了如何通过梯度下降法对变量y进行最小化，并指出当原二次型是半正定时，其最小化后的结果仍然是半正定的。这被称为sure complement，是凸优化中的一个重要概念。","讲者提到，二次型在部分最小化后仍然保持其性质，即闭合性。这一性质在数学上是合理的，且在多个工程领域中都有广泛应用，如电路分析、机械工程等。","sure complement在数值线性代数中被提及，说明其在不同学科中的重要性。讲者还提到，如果一个矩阵是半正定的，那么其sure complement也是半正定的，这一性质是线性代数中的基本事实。","讲者进一步引入了视角映射（perspective mapping）的概念，指出其与线性分数映射的关系，并举例说明其在计算机视觉中的应用，如相机系统将3D空间映射到2D图像的过程。","讲者强调了视角映射在实际应用中的重要性，并指出其是视觉系统中常见的映射方式，这有助于理解图像形成的基本原理。","本段内容涵盖了最小化规则和视角映射规则，是凸优化课程中关于二次型和映射的重要部分，为后续内容奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2500.77,"end":2674.29,"asr_flags":[],"math_clarifications":["无法核定公式中的梯度项、二次型和sure complement是否正确，缺少上下文信息。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2500.77,"text":"What's that? Yeah, this block 2 by 2 matrix has to be positive semi-definite. Okay? That's the condition on which this is convex. Now, let's minimize over y here. Well, how do you minimize this thing over y? I mean, we could just take a gradient. You take a gradient, and here you get a term which is like 2b transpose x, and over there you get 2cy. Okay? You solve that."},{"start":2529.57,"text":"and you work out what it is, and you end up, when you find out what y is, you plug it back into this thing, and you get this thing. So you get x transpose. So this is, I take this function of two variables, if I minimize over y for each x, I end up, number one, with a quadratic form. So you could even say something like this. Quadratic forms are closed under partial minimization. That's a perfectly reasonable statement to make."},{"start":2557.5,"text":"Right? But not only it's kind of cool, if the original quadratic form was PSD, so is this one. And that's got a name. That's called the sure complement."},{"start":2568.3,"text":"And you've doubtless all seen, it'd be very difficult to take classes where you don't see this, right? This is conditioning on a Gaussian random vector. This is, in electrical engineering, this is like taking a circuit and imposing conditions on some of the ports or nodes. In mechanical engineering, it comes up in every field there is. I can't think of a legitimate field where the sure complement doesn't come up. Okay? So..."},{"start":2596.94,"text":"And sometimes people call it out, sometimes they don't. I don't know. Actually, how many people have heard it called out as a sure compliment before? Okay. Handful. Okay. How many people have seen it somewhere, seen something like this? Probably with some hideous notation. Okay. What field was it called out in? In the back. In my case, numerical linear algebra. Okay. In numerical linear algebra. Okay. Good. Okay. Good. All right. So."},{"start":2628.06,"text":"And you may know that it's a basic fact of linear algebra that if a matrix is positive semidefinite, so is a sure complement, right? Or positive definite or negative. Okay, everybody got this? Okay, that's the minimization rule. Now we get to the perspective rule."},{"start":2647.41,"text":"And so this is related, if you remember, the perspective mapping takes a vector with the last entry positive and divides everything by it. And then we looked at like linear fractional mappings and I mumbled about how that's basically the actual generic mapping you have in vision. Like if you have a camera system that looks at 3D and you look at the actual image you get on the sensor, which is 2D, it's actually got this perspective mapping in it, right? Okay."}],"speech_gaps":[],"frame":"../frames/v004/016.webp","frame_time":2512.77},{"title":"函数的视角与共轭函数","segments":[{"id":111,"text":"So the perspective of a function is this. It is, you take a function f, and it's a function now of a new variable, which is going to be positive and a scalar. So g of x and t is t f of x over t, right? So that's called the perspective. Here's the cool part. If a function is convex, so is its perspective.","zh":"所以，函数的视角是这样的。你取一个函数 f，现在它是一个关于新变量的函数，这个变量是正数且是标量。所以 g(x, t) 是 t 乘以 f(x/t)，对吧？这就是所谓的视角。这里有个有趣的地方。如果一个函数是凸的，那么它的视角也是凸的。","start":2675.79,"end":2701.86},{"id":112,"text":"Okay. And again, this is not, that one is not totally straightforward to show, but it's true. So, and this is, this is not, this one is, this is just not obvious. Okay. So let's look at some examples. Oh, here's one. X transpose X is the sum of the squares of a vector, of the entries of a vector. It's convex. Okay. Well, let's figure out what is the, what you do is you just plug in.","zh":"好的。而且，这并不是完全显而易见的，但它是正确的。所以，这个并不是，这个是，这个并不明显。好的。那么让我们来看一些例子。哦，这里有一个例子。x 乘以 x 是向量各分量的平方和，它是凸的。好的。那么，我们来想一下，你所做的就是将 x 替换为 x/t。","start":2702.86,"end":2729.49},{"id":113,"text":"Wherever you see x, plug in x over t here. So you have x over t transpose x over t. So that becomes x transpose x divided by t squared. And then you multiply it by t in the front, and you get this. And you go, hey, that's cool. You know what that is? That's sum xi squared over t. So it's a sum of these quadratic over linear functions, which you know to be convex.","zh":"在你看到 x 的地方，这里替换成 x/t。所以你有 x/t 乘以 x/t。这会变成 x 乘以 x 除以 t 平方。然后你乘以前面的 t，得到这个结果。你就会说，嘿，这很酷。你知道这是什么吗？这是 xi 平方除以 t 的和。所以这是二次函数除以线性函数的和，而你知道这些是凸的。","start":2729.93,"end":2752.46},{"id":114,"text":"So but you found that out without any of the pain or something like that. I mean, actually, we showed that by I think I think there we resorted to Hessians. Right. So, OK, here's one. Let's take the negative logarithm. That's convex. Right. Because the log is concave. So we take negative logarithm and then let's form the if we form the perspective of this, it's.","zh":"所以你不用经历任何痛苦就能发现这一点。我的意思是，实际上，我们通过计算二阶导数来证明这一点。对吧。好的，这里还有一个例子。让我们取负对数。它是凸的。对吧。因为对数是凹的。所以我们取负对数，然后如果我们形成这个函数的视角，它就是。","start":2753.92,"end":2779.48},{"id":115,"text":"And then from that, it would be related to things like KL divergence and all sorts of other stuff. I mean, it doesn't matter if you haven't seen these functions before. But that just gives you a real quick way to show that some of these, that these functions are convex. Everybody got this? So, okay.","zh":"然后，这会与诸如 KL 散度等各种其他内容相关。我的意思是，不管你是否见过这些函数，这都给你一个快速的方法来证明这些函数是凸的。大家明白了吗？好的。","start":2779.82,"end":2803.18},{"id":116,"text":"And let's see. So I think I'll... Anyway, so that's it. And by the way, sometimes this actually has very interesting practical interpretations of what g x over t is. We'll assign some homework problems that show you where it would come up in various practical things. I mean, aside from vision or something like that. Okay.","zh":"让我们看看。我想我可能会……不管怎样，这就是全部。顺便说一句，有时这实际上在实践中对 g(x/t) 有非常有趣的解释。我们会布置一些作业题，展示它在各种实际问题中会出现的情况。我的意思是，除了视觉之类的东西。好的。","start":2805.42,"end":2826.04},{"id":117,"text":"Okay. Next up is conjugate. And I understand all of these are completely without context. So, like, if you're asking, like, who cares about this? Completely reasonable question to ask. Totally reasonable. But anyway, and my answer to that is you will in the next couple weeks. And also, once you see these things, you will start seeing them everywhere you go, like in your other classes and things like that.","zh":"好的。接下来是共轭函数。我明白这些内容目前都是脱离上下文的。比如，如果你会问，像‘这有什么用呢？’，提出这样的问题完全合情合理。完全合理。不过，我的回答是，你们在接下来的几周里会用到这些内容。而且，一旦你们理解了这些概念，就会开始在你们的其他课程和各种地方看到它们。","start":2827.41,"end":2853.91}],"notes":["本段讲解了函数的视角（perspective）概念，即对于一个函数f，其视角函数g(x, t)定义为t f(x/t)，其中t为正标量。如果原函数f是凸函数，那么其视角函数g也是凸函数。这一性质在优化问题中具有重要意义，因为它允许我们通过视角变换来构造新的凸函数。","接着，讲者通过具体例子说明了视角函数的构造过程。例如，对于函数x^T x（向量的平方和），通过将x替换为x/t并乘以t，得到x^T x / t^2 * t = x^T x / t，这实际上是一个二次函数除以线性函数，属于凸函数。这一过程展示了视角函数如何保持凸性。","讲者还提到，负对数函数是凸函数，因为对数函数是凹函数。通过构造其视角函数，可以得到相对熵（relative entropy），这与KL散度密切相关。这一例子说明了视角函数在信息论和优化中的应用。","讲者强调，虽然这些概念可能在初次接触时显得抽象，但它们在后续课程中会频繁出现，并且在其他课程中也会广泛使用。因此，理解这些概念对于后续学习至关重要。","此外，讲者提到视角函数在实际问题中有重要的应用，例如在计算机视觉等领域。通过布置作业题，学生可以进一步理解视角函数在实际问题中的具体应用。","最后，讲者介绍了共轭函数（conjugate function）的概念，并指出虽然当前讲解缺乏上下文，但这些概念将在后续课程中变得重要。共轭函数是凸优化中的核心工具，用于对偶问题的构造和分析。"],"formulas":[{"latex":"x^T x / t^2","symbols":"通过视角变换得到的函数形式","explanation":"原始公式中缺少分母的平方，导致表达不准确。修正为 x^T x / t^2，符合视角变换的数学定义。","evidence":"Wherever you see x, plug in x over t here. So you have x over t transpose x over t. So that becomes x transpose x divided by t squared. And then you multiply it by t in the front, and you get this. And you go, hey, that's cool. You know what that is? That's sum xi squared over t. So it's a sum of these quadratic over linear functions, which you know to be convex."},{"latex":"-t \\log \\left(\\frac{x}{t}\\right)","symbols":"负对数函数的视角形式，与相对熵相关","explanation":"原始公式中缺少括号，导致表达不清晰。修正为 -t log(x/t)，符合视角函数的定义。","evidence":"So but you found that out without any of the pain or something like that. I mean, actually, we showed that by I think I think there we resorted to Hessians. Right. So, OK, here's one. Let's take the negative logarithm. That's convex. Right. Because the log is concave. So we take negative logarithm and then let's form the if we form the perspective of this, it's."}],"uncertainties":[],"diagram":"none","start":2675.79,"end":2853.91,"asr_flags":[],"math_clarifications":["原始公式中存在括号缺失和表达不清晰的问题，需要修正以确保数学表达的准确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2675.79,"text":"So the perspective of a function is this. It is, you take a function f, and it's a function now of a new variable, which is going to be positive and a scalar. So g of x and t is t f of x over t, right? So that's called the perspective. Here's the cool part. If a function is convex, so is its perspective."},{"start":2702.86,"text":"Okay. And again, this is not, that one is not totally straightforward to show, but it's true. So, and this is, this is not, this one is, this is just not obvious. Okay. So let's look at some examples. Oh, here's one. X transpose X is the sum of the squares of a vector, of the entries of a vector. It's convex. Okay. Well, let's figure out what is the, what you do is you just plug in."},{"start":2729.93,"text":"Wherever you see x, plug in x over t here. So you have x over t transpose x over t. So that becomes x transpose x divided by t squared. And then you multiply it by t in the front, and you get this. And you go, hey, that's cool. You know what that is? That's sum xi squared over t. So it's a sum of these quadratic over linear functions, which you know to be convex."},{"start":2753.92,"text":"So but you found that out without any of the pain or something like that. I mean, actually, we showed that by I think I think there we resorted to Hessians. Right. So, OK, here's one. Let's take the negative logarithm. That's convex. Right. Because the log is concave. So we take negative logarithm and then let's form the if we form the perspective of this, it's."},{"start":2779.82,"text":"t, it's minus t log x over t, which you might recognize. That's actually, that's the relative entropy. And then from that, it would be related to things like KL divergence and all sorts of other stuff. I mean, it doesn't matter if you haven't seen these functions before. But that just gives you a real quick way to show that some of these, that these functions are convex. Everybody got this? So, okay."},{"start":2805.42,"text":"And let's see. So I think I'll... Anyway, so that's it. And by the way, sometimes this actually has very interesting practical interpretations of what g x over t is. We'll assign some homework problems that show you where it would come up in various practical things. I mean, aside from vision or something like that. Okay."},{"start":2827.41,"text":"Okay. Next up is conjugate. And I understand all of these are completely without context. So, like, if you're asking, like, who cares about this? Completely reasonable question to ask. Totally reasonable. But anyway, and my answer to that is you will in the next couple weeks. And also, once you see these things, you will start seeing them everywhere you go, like in your other classes and things like that."}],"speech_gaps":[],"frame":"../frames/v004/017.webp","frame_time":2687.79},{"title":"共轭函数及其凸性","segments":[{"id":118,"text":"I mean, like this is like completely central. It's absolutely central to economics. It's completely central to statistics. It just comes up all the time. It's called the conjugate function. And it looks like this. So it's this. I have a function f does not have to be convex. Okay. And f star y.","zh":"我的意思是，这非常核心。它在经济学中绝对核心，在统计学中也完全核心。它经常出现。它被称为共轭函数。它看起来像这样。所以它就是这个。我有一个函数 f，它不一定要是凸函数。好的。和 f 星 y。","start":2855.58,"end":2876.61},{"id":119,"text":"or f asterisk y that's the pretty much universal notation for the conjugate function it's actually","zh":"或者 f 星号 y，这是共轭函数的几乎通用记号，它实际上是","start":2877.26,"end":2883.62},{"id":120,"text":"this it's really interesting it's it's you should maximize uh y is the the the argument here you","zh":"这个，它真的很有趣，它是你在这里应该最大化 y 的参数，你","start":2883.62,"end":2889.9},{"id":121,"text":"should maximize this uh y transpose x minus f of x okay so that's that's that's what this is right","zh":"应该最大化这个，即 y 转置 x 减去 f 的 x，好的，这就是这个的意思，对吧","start":2889.9,"end":2896.16},{"id":122,"text":"and actually this is crazy let's show that this is convex even when f is not","zh":"实际上，这很疯狂，让我们证明即使 f 不是凸函数，这个也是凸函数","start":2896.16,"end":2903.92},{"id":123,"text":"so the conjugate of a non-convex function is is going to be convex okay but let's let's figure","zh":"所以，一个非凸函数的共轭函数将是凸函数，好的，让我们来弄清楚","start":2905.02,"end":2912.48},{"id":124,"text":"let's see why um any suggestions is it is it is it hessian time no i mean duh right okay so","zh":"让我们看看为什么，嗯，有任何建议吗？是不是它的 Hessian 矩阵？不，我的意思是，这很明显，对吧，好的，所以","start":2912.48,"end":2922.8},{"id":125,"text":"how do you do it how do i show that that that thing is is a convex function of y yeah","zh":"你怎么做？我怎么证明这个东西是 y 的凸函数？","start":2922.8,"end":2929.76},{"id":126,"text":"There you go. Here's what you do. You look at this thing and it looks really complicated","zh":"好的，下面是你要做的。你看看这个，看起来真的很复杂","start":2932.46,"end":2937.82},{"id":127,"text":"like f is some incredibly complicated non-linear thing. I don't even know what it is. What","zh":"比如 f 是一个极其复杂的非线性函数。我甚至不知道它是什么。","start":2937.82,"end":2943.54},{"id":128,"text":"this says is the following. For each fix x, for each x in the domain of f, what kind of","zh":"这句话的意思是，对于每个固定的 x，对于每个 x 在 f 的定义域内，y 转置 x 减去 f(x) 是什么类型的函数。","start":2943.54,"end":2951.7},{"id":129,"text":"function is y transpose x minus f of x. It's affine. This is a supremum of affine functions","zh":"它是仿射函数。这是仿射函数的上确界，因此它只能是凸函数。好的。所以，没错。","start":2951.7,"end":2960.16},{"id":130,"text":"and it could only be convex. Okay. So, right. And so I could have really messed with you. If","zh":"如果有人走上街头，展示 f 并用一些可怕的表达式写出它，里面包含双曲余弦和正弦等，他们会问，这是凸函数吗？你会像这样回答，","start":2960.16,"end":2967.2},{"id":131,"text":"somebody walked up on the street and they showed f and they wrote it out in some horrible thing","zh":"啊，我，天哪，我不知道。但重点是，你只需要保持冷静，","start":2967.2,"end":2971.14},{"id":132,"text":"and it had hyperbolic cosines and sines and all that, they'd say, is this convex? You'd go like,","zh":"记住这一点。","start":2971.14,"end":2975.88},{"id":133,"text":"ah, I, oh my God, I don't know. But the point, so that's that you just have to remain con,","zh":"啊，我，哦我的天，我不知道。但重点是，所以你只需要保持共轭，","start":2975.92,"end":2980.04},{"id":134,"text":"look at it and realize that it's like a conjugate. So that's a conjugate. And this is going to come up again. It's going to be central when we cover duality, but it also comes up a lot. And I just give you a quick example of where this would come up. Let's suppose you run a business or something like that. And x is an amount of various products that you will produce.","zh":"看一下并意识到它看起来像是一个共轭函数。因此，这就是一个共轭函数。它将在后面再次出现。当我们讲到对偶性时，它将变得非常重要，但它也经常出现。我只给你一个快速的例子，说明这种情况会在哪里出现。假设你经营一家企业或者类似的事情。x 是你将要生产的各种产品的数量。","start":2980.7,"end":3006.17}],"notes":["本段讲解了共轭函数的概念及其凸性。共轭函数是通过最大化 y^T x - f(x) 来定义的，即使原函数 f 不是凸函数，其共轭函数仍然是凸函数。这是通过观察共轭函数是所有仿射函数的上确界，而仿射函数的上确界必然是凸函数来证明的。","讲者通过一个例子说明了共轭函数的重要性，指出即使面对复杂的非凸函数，也可以通过共轭函数的性质来判断其凸性。这在后续的对偶性讨论中会再次出现。","讲者还提到，共轭函数在实际应用中非常有用，例如在商业决策中，通过共轭函数可以分析不同产品产量的最优组合。","讲者强调了共轭函数的定义和性质，指出其在凸优化中的核心地位，并通过举例说明了其在实际问题中的应用。","讲者提到，即使面对复杂的函数形式，如包含双曲函数的函数，也可以通过共轭函数的性质来判断其凸性，而不需要直接计算其二阶导数。","讲者还指出，共轭函数的定义和性质是凸优化中的一个关键概念，它在对偶性理论中起着重要作用，并且在多个领域都有广泛应用。"],"formulas":[{"latex":"f^*(y) = \\sup_{x} (y^T x - f(x))","symbols":"共轭函数是所有仿射函数 y^T x - f(x) 的上确界，因此是凸函数","explanation":"公式正确，共轭函数定义为 y^T x - f(x) 的上确界，且该上确界是凸函数。","evidence":"function is y transpose x minus f of x. It's affine. This is a supremum of affine functions and it could only be convex. Okay. So, right. And so I could have really messed with you. If"}],"uncertainties":[],"diagram":"none","start":2855.58,"end":3006.17,"asr_flags":[],"math_clarifications":["第一个公式正确地定义了共轭函数，使用了标准的数学符号和表达方式。第二个公式虽然内容相同，但使用了不标准的 'sup' 写法，且重复，因此被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":2855.58,"text":"I mean, like this is like completely central. It's absolutely central to economics. It's completely central to statistics. It just comes up all the time. It's called the conjugate function. And it looks like this. So it's this. I have a function f does not have to be convex. Okay. And f star y."},{"start":2877.26,"text":"or f asterisk y that's the pretty much universal notation for the conjugate function it's actually"},{"start":2883.62,"text":"this it's really interesting it's it's you should maximize uh y is the the the argument here you"},{"start":2889.9,"text":"should maximize this uh y transpose x minus f of x okay so that's that's that's what this is right"},{"start":2896.16,"text":"and actually this is crazy let's show that this is convex even when f is not"},{"start":2905.02,"text":"so the conjugate of a non-convex function is is going to be convex okay but let's let's figure"},{"start":2912.48,"text":"let's see why um any suggestions is it is it is it hessian time no i mean duh right okay so"},{"start":2922.8,"text":"how do you do it how do i show that that that thing is is a convex function of y yeah"},{"start":2932.46,"text":"There you go. Here's what you do. You look at this thing and it looks really complicated"},{"start":2937.82,"text":"like f is some incredibly complicated non-linear thing. I don't even know what it is. What"},{"start":2943.54,"text":"this says is the following. For each fix x, for each x in the domain of f, what kind of"},{"start":2951.7,"text":"function is y transpose x minus f of x. It's affine. This is a supremum of affine functions"},{"start":2960.16,"text":"and it could only be convex. Okay. So, right. And so I could have really messed with you. If"},{"start":2967.2,"text":"somebody walked up on the street and they showed f and they wrote it out in some horrible thing"},{"start":2971.14,"text":"and it had hyperbolic cosines and sines and all that, they'd say, is this convex? You'd go like,"},{"start":2975.92,"text":"ah, I, oh my God, I don't know. But the point, so that's that you just have to remain con,"},{"start":2980.7,"text":"look at it and realize that it's like a conjugate. So that's a conjugate. And this is going to come up again. It's going to be central when we cover duality, but it also comes up a lot. And I just give you a quick example of where this would come up. Let's suppose you run a business or something like that. And x is an amount of various products that you will produce."}],"speech_gaps":[],"frame":"../frames/v004/018.webp","frame_time":2867.58},{"title":"共轭函数的概念与图形解释","segments":[{"id":135,"text":"Okay, so it's a vector of, you have like n different products, and you're going to produce x1 of product 1, x2, and so on. Everybody got it? That is going to cost you f of x. Okay, so that is your production cost for producing, you know, so many tons of this, you know, so many units of that, and so on. Everybody got it? Okay, y we interpret as the market prices. Okay, so these are the, y1 through yn are the prices for products 1 through n.","zh":"好的，所以这是一个向量，你有n种不同的产品，你要生产x1个产品1，x2个产品2，依此类推。大家明白了吗？这将花费你f(x)的成本。好的，所以这是你生产这么多吨这种产品、这么多单位那种产品的生产成本。大家明白了吗？好的，y我们解释为市场价格。好的，所以y1到yn是产品1到n的价格。","start":3006.87,"end":3035.98},{"id":136,"text":"Y transpose X is your gross revenue for the products you've made. Everybody got this? Okay, so this is your profit. It's your gross revenue minus the cost to actually produce those things. Everybody following this? So the conjugate then is very simple. It is the optimal profit as a function of the prices. Everybody?","zh":"Y转置乘以X是你生产的产品的总收入。大家明白了吗？好的，所以这就是你的利润。它是你的总收入减去实际生产这些产品的成本。大家跟上了吗？所以共轭函数就非常简单。它是作为价格函数的最优利润。大家明白了吗？","start":3036.75,"end":3065.63},{"id":137,"text":"Got this? We're going to come back to this in much more detail, but maybe just planting some of these seeds in your head is not at all a bad thing right now. Okay? So that's the conjugate. What's that? Okay. Good. Everybody got it? So, I mean, other than that, it has no meaning right now. It's going to have a meaning later. Don't worry. Yeah. What's that? Yeah, I could. Yeah, yeah. So what you do,","zh":"明白了吗？我们之后会更详细地讨论这一点，但现在也许只是在大家脑海中种下一些种子并不是什么坏事。好的？所以这就是共轭函数。这是什么？好的。大家明白了吗？我的意思是，除此之外，它现在没有其他意义。它之后会有意义的。别担心。是的。这是什么？是的，我可以。是的，是的。那么你该怎么做，","start":3066.25,"end":3097.37},{"id":138,"text":"If you want to do this graphically, here's f here. And what you do is you form x, y. That's this line here. That's this line, right? And then what you're doing is you move this line up and down until it just touches the graph. And then it turns out that point right there is the negative of the conjugate. So that's the graphical interpretation. I mean, if that helps you.","zh":"如果你想用图形方法来做，这里就是f。你所做的就是形成x和y。这就是这条线。这就是这条线，对吧？然后你所做的就是将这条线上下移动，直到它刚好接触图形。结果发现那个点就是共轭函数的负值。这就是图形解释。我的意思是，如果这对你有帮助的话。","start":3097.9,"end":3126.37},{"id":139,"text":"I think I've decided it doesn't really help me, the graph, so it's fine. Okay, so that's the conjugate. By the way, this comes up in lots of other fields, too. I mean, statistics, probability, I go on and on and on. Let me ask, ah, when you use the language conjugate, it conjures up...","zh":"我觉得我决定图形对我没有帮助，所以没关系。好的，这就是共轭函数。顺便说一句，它在其他许多领域也会出现。我的意思是，统计学、概率论，我可以说个没完。让我问，当你使用“共轭”这个词时，它唤起的联想是……","start":3127.82,"end":3152.33},{"id":140,"text":"certain ideas like because conjugate is used in math and lots of cases and Mostly, I mean here's one complex conjugate of a complex number, right? Okay, so Hermitian conjugate of a complex matrix, right? These are these are conjugate. These are types of conjugates What's an at what is an attribute you think of when someone uses the the conjugate word? What's that? I Miss that it's reversible. Yeah","zh":"某些想法，比如因为共轭在数学和很多情况下都会用到。主要来说，我指的是，比如说一个复数的共轭，对吧？好的，那么一个复数矩阵的厄米特共轭，对吧？这些都是共轭。这些都是共轭的类型。当你有人使用‘共轭’这个词时，你通常会想到什么属性？这是什么？我错过了，它具有可逆性。是的","start":3152.67,"end":3182.52}],"notes":["本段讲解了共轭函数的基本概念，即共轭函数是作为最优利润函数的函数价格。生产成本由f(x)表示，市场价格由y表示，总收入为y^T x，利润为总收入减去生产成本。共轭函数的定义是利润函数在价格上的最优值。","讲者提到共轭函数在多个领域都有应用，如统计学和概率论，但当前主要关注其在优化问题中的意义。共轭函数的图形解释是通过移动一条线直到它与函数图像相切，此时切点对应于共轭函数的负值。","讲者指出，共轭函数的图形解释可能对理解有帮助，但个人认为图形解释对理解帮助不大。共轭函数的定义和应用将在后续课程中进一步展开。","讲者提到共轭函数在数学中的其他应用，如复数的共轭和矩阵的共轭转置。共轭函数的一个属性是可逆性，即共轭操作可以被逆操作恢复。","讲者在讲解过程中提到，共轭函数的定义和应用需要结合具体问题进行理解，不能仅凭术语本身来判断其意义。共轭函数的图形解释和数学定义是理解其意义的关键。","讲者强调，共轭函数在优化问题中的重要性，特别是在处理凸函数和对偶问题时。共轭函数的定义和应用需要结合具体问题进行深入理解。"],"f Don't worry. Yeah. What's that? Yeah, I could. Yeah, yeah. So what you do,"},{"start":3097.9,"text":"If you want to do this graphically, here's f here. And what you do is you form x, y. That's this line here. That's this line, right? And then what you're doing is you move this line up and down until it just touches the graph. And then it turns out that point right there is the negative of the conjugate. So that's the graphical interpretation. I mean, if that helps you."},{"start":3127.82,"text":"I think I've decided it doesn't really help me, the graph, so it's fine. Okay, so that's the conjugate. By the way, this comes up in lots of other fields, too. I mean, statistics, probability, I go on and on and on. Let me ask, ah, when you use the language conjugate, it conjures up..."},{"start":3152.67,"text":"certain ideas like because conjugate is used in math and lots of cases and Mostly, I mean here's one complex conjugate of a complex number, right? Okay, so Hermitian conjugate of a complex matrix, right? These are these are conjugate. These are types of conjugates What's an at what is an attribute you think of when someone uses the the conjugate word? What's that? I Miss that it's reversible. Yeah"}],"speech_gaps":[],"frame":"../frames/v004/019.webp","frame_time":3018.87},{"title":"共轭函数与凸包","segments":[{"id":141,"text":"Yeah, okay. Let's be a little bit more specific. How do you reverse it? I like that. Right? So, typically, when you use the word conjugate, there's sort of an implication that the conjugate of the conjugate is the original thing. Everybody got that? So, the conjugate of the conjugate of a complex number is the same number back again. Right? Because you switch the sign on the imaginary part and then you do it again. Okay.","zh":"是的，好的。让我们更具体一点。你是如何反过来操作的？我喜欢这个说法。对吧？通常，当你使用“共轭”这个词时，有一种暗示，即一个函数的共轭的共轭会回到原来的函数。大家明白吗？所以，一个复数的共轭的共轭会再次得到原来的数。对吧？因为你会改变虚部的符号，然后再做一次。好的。","start":3183.34,"end":3213.46},{"id":142,"text":"Do you think it's true that the conjugate of a conjugate of a function is the function? Why not? Yeah, but take it one more step. F star is convex, so F star star is convex. So if F was not convex to start with, like this function here, then there's no way F star star equals F. You're right. Actually, F star star is a really cool thing. It's called the convex envelope.","zh":"你认为一个函数的共轭的共轭会等于这个函数本身吗？为什么不能呢？是的，但让我们再进一步。F星是凸的，因此F星星也是凸的。所以如果F一开始就不凸，比如这里的这个函数，那么就不可能有F星星等于F。你说得对。实际上，F星星是一个非常酷的东西。它被称为函数的凸包。","start":3215.05,"end":3247.95},{"id":143,"text":"of a function. So it's the largest convex function that fits under it. So I'll just draw that. This is advanced and I probably shouldn't be going there right now, but too late now. So here's your function. And I'll show you what f star star is. It's called the convex envelope or lots of other things. It's actually this function. It's really cool. It is the largest convex function that fits under this thing. And it's going to be this. It's going to look like that.","zh":"函数的凸包。所以它是能拟合在该函数下方的最大凸函数。我将简单地画出来。这有点高级，我可能现在不应该讲这个，但现在太晚了。这里是你的函数，我将向你展示什么是f星星。它被称为凸包，或者有其他很多称呼。实际上这就是这个函数。它真的很酷。它是能拟合在该函数下方的最大凸函数。它将是这个样子。它将看起来像这样。","start":3248.74,"end":3277.47},{"id":144,"text":"then it's going to go like that, and then it's going to go up like that. Or here's a really cool way to say it. If you take the epigraph of the function, that's everything up here, then take the convex hull of the epigraph, that's this thing, that's the epigraph of f star star, which is the conjugate. Sorry, this is too advanced. I didn't mean to go there. But it is kind of cool, so I don't mind mentioning it. Yes?","zh":"然后它将像这样延伸，然后像这样上升。或者，这里有一个非常酷的方式来表达它。如果你取函数的上境域，也就是这里的所有内容，然后取上境域的凸包，这就是这个东西，这就是f星星的上境域，也就是共轭。抱歉，这太高级了。我本来不想讲这个的。但确实有点酷，所以我并不介意提到它。是吗？","start":3278.0,"end":3305.0},{"id":145,"text":"It's convex is f star star the same as f. Yes. Awesome. Yes. So if f is convex and there's a small technical condition, then f star star is f. Right. And that's going to be the basis of a whole lot of different things and interesting stuff. Okay. So let's look at some examples. How do you work out the conjugates? A lot of times you just have to get your hands dirty and figure out.","zh":"如果f星星和f相同，那么f是凸的。是的。太棒了。是的。所以如果f是凸的，并且满足一个小的技术条件，那么f星星就是f。对吧。这将成为很多不同事物和有趣内容的基础。好的。那么让我们来看一些例子。你是如何计算共轭的？很多时候你只能动手操作，然后弄清楚。","start":3305.96,"end":3335.14},{"id":146,"text":"how to solve this. You know, it's defined by this optimization problem where you maximize. And so, for example, let's find, here's the negative logarithm. Let's find the conjugate of it. Well, you have to maximize over y, which is a scalar, xy plus log x. And, you know, honestly, the way you do this, you just draw some pictures and you will find out, for example, if y is zero or bigger, this supremum is infinity. Because, well, look, if y is three,","zh":"如何解决这个问题。你知道，它是通过这个优化问题定义的，其中你要最大化。例如，让我们来找，这里是对数的负数。让我们来找它的共轭函数。好吧，你必须在y上最大化，y是一个标量，xy加上log x。而且，说实话，你这样做，只需要画一些图，你就会发现，例如，如果y是零或更大，这个上确界是无穷大。因为，嗯，看看，如果y是三，","start":3335.59,"end":3363.25}],"notes":["本段讨论了共轭函数的性质，指出共轭函数的共轭不一定等于原函数，只有当原函数是凸函数时，其共轭的共轭才等于原函数。这是凸优化中的一个重要概念，称为共轭函数的对偶性。","讲者提到共轭函数的共轭被称为凸包（convex envelope），即在原函数下方的最大凸函数。这是通过取原函数的上包络线（epigraph）并求其凸包得到的。","讲者进一步解释了如何通过上包络线和凸包的定义来理解共轭函数的性质，这涉及到凸函数的几何特性。","讲者以负对数函数为例，说明如何计算共轭函数，指出当y为正时，最大值可能趋于无穷大，这表明共轭函数的计算需要仔细分析优化问题。","讲者强调了共轭函数在凸优化中的重要性，特别是在对偶问题和优化算法设计中的应用。","讲者提到，共轭函数的计算通常需要通过优化问题来求解，这需要结合数学分析和几何直观。"],"formulas":[],"uncertainties":["f^{**}(x) 的具体定义可能需要更精确的数学表达式，但讲者未明确给出完整的公式。"],"diagram":"convex","start":3183.34,"end":3363.25,"asr_flags":[],"math_clarifications":["共轭函数的共轭（f^{**}）的定义应涉及一个优化问题，即最大化 xy - f(y)（或类似形式），而不是简单地提到 supremum。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3183.34,"text":"Yeah, okay. Let's be a little bit more specific. How do you reverse it? I like that. Right? So, typically, when you use the word conjugate, there's sort of an implication that the conjugate of the conjugate is the original thing. Everybody got that? So, the conjugate of the conjugate of a complex number is the same number back again. Right? Because you switch the sign on the imaginary part and then you do it again. Okay."},{"start":3215.05,"text":"Do you think it's true that the conjugate of a conjugate of a function is the function? Why not? Yeah, but take it one more step. F star is convex, so F star star is convex. So if F was not convex to start with, like this function here, then there's no way F star star equals F. You're right. Actually, F star star is a really cool thing. It's called the convex envelope."},{"start":3248.74,"text":"of a function. So it's the largest convex function that fits under it. So I'll just draw that. This is advanced and I probably shouldn't be going there right now, but too late now. So here's your function. And I'll show you what f star star is. It's called the convex envelope or lots of other things. It's actually this function. It's really cool. It is the largest convex function that fits under this thing. And it's going to be this. It's going to look like that."},{"start":3278.0,"text":"then it's going to go like that, and then it's going to go up like that. Or here's a really cool way to say it. If you take the epigraph of the function, that's everything up here, then take the convex hull of the epigraph, that's this thing, that's the epigraph of f star star, which is the conjugate. Sorry, this is too advanced. I didn't mean to go there. But it is kind of cool, so I don't mind mentioning it. Yes?"},{"start":3305.96,"text":"It's convex is f star star the same as f. Yes. Awesome. Yes. So if f is convex and there's a small technical condition, then f star star is f. Right. And that's going to be the basis of a whole lot of different things and interesting stuff. Okay. So let's look at some examples. How do you work out the conjugates? A lot of times you just have to get your hands dirty and figure out."},{"start":3335.59,"text":"how to solve this. You know, it's defined by this optimization problem where you maximize. And so, for example, let's find, here's the negative logarithm. Let's find the conjugate of it. Well, you have to maximize over y, which is a scalar, xy plus log x. And, you know, honestly, the way you do this, you just draw some pictures and you will find out, for example, if y is zero or bigger, this supremum is infinity. Because, well, look, if y is three,"}],"speech_gaps":[],"frame":"../frames/v004/020.webp","frame_time":3195.34},{"title":"凸函数的广义概念","segments":[{"id":147,"text":"It's ridiculous. What happens is this thing is monotone increasing in y and you've been asked to maximize it. So, you know, so you get plus infinity. If y is negative, it's not. And you just draw a picture and take a derivative and you can work out what it is. I'm not going to do that, but you get something like this. So, you know, roughly speaking, the conjugate of a log looks like a log. I mean, the sign got flipped and there's a minus one offset, but that's that.","zh":"这很荒谬。发生的情况是，这个函数在y上是单调递增的，而你被要求最大化它。所以，你知道的，这样你会得到正无穷大。如果y是负数，就不是这样。你只需要画个图，求导，就能算出来。我不会这么做，但你会得到类似这样的结果。所以，总的来说，对数的共轭看起来像一个对数。我的意思是，符号被翻转了，并且有一个减一的偏移量，就是这样。","start":3363.92,"end":3389.88},{"id":148,"text":"If you have a quadratic form, 1 half x transpose qx with a positive definite q, then it turns out that the conjugate is really cool. It's also a quadratic form given by the inverse matrix. Okay? So, everybody got this? So, these are just like kind of basic things. Okay. We're now going to cover two more...","zh":"如果你有一个二次型，形式为1/2 x^T q x，其中q是正定的，那么它的共轭是非常酷的。它也是一个二次型，由逆矩阵给出。明白了吗？所以，这些都是些基本的东西。好的。我们现在要介绍另外两个……","start":3391.02,"end":3418.78},{"id":149,"text":"Generalizations of convexity. So first, let me give you some background, right? That, you know, there's a whole sub-industry in math of generalizing convexity. And you have pseudo-convexity and quasi-convexity. And I don't know, there's all these different types of generalizations. And, you know, it's totally fine. It's not hurting anybody.","zh":"凸性的广义概念。首先，让我给你一些背景，对吧？你知道的，数学中有一个完整的子领域专门研究凸性的推广。你有拟凸性和伪凸性。我不知道，还有这么多不同类型的推广。你知道的，这完全没问题。它不会伤害任何人。","start":3419.52,"end":3442.28},{"id":150,"text":"Then usually on page 300 of the book, you'll get this horrible diagram that says if something is quasi-convex and triple pseudo-convex and blah, blah, blah, then it's also this. And it's a big diagram that shows you all this. What we're going to do here is we've selected the two generalizations that are actually useful. And they are quasi-convexity. That's this one.","zh":"通常在书的第300页，你会看到一个可怕的图表，上面写着如果某个东西是拟凸的和三重伪凸的，等等，那么它也是这个。这是一个大图表，展示了所有这些内容。我们在这里要做的，是选择两个实际上有用的推广。它们是拟凸性。这就是这个。","start":3443.68,"end":3470.28},{"id":151,"text":"And we're going to talk about one more, which is log convexity, which is almost kind of not quite a generalization, but it is kind of. Okay, but this one is. So that's what we're going to do. So I'm just saying if you go to Wikipedia and type in quasi-convexity, you'll find out there's pseudo-convex, and then someone showed that if it's pseudo-convex and blah, blah, blah, blah, blah, then it has to be, anyway, it's very complicated. So, okay, here it is.","zh":"我们还要讨论另一个，即对数凸性，它几乎不是一种推广，但某种程度上又是一种。好的，但这个就是。这就是我们要做的。所以，我只是说如果你去维基百科上输入拟凸性，你会发现有伪凸性，然后有人证明如果它是伪凸的，等等，等等，那么它必须是，无论如何，这非常复杂。所以，好了，这就是。","start":3470.81,"end":3498.24},{"id":152,"text":"A function is quasi-convex if its sublevel sets are all convex. Period. Oh, another name for this is unimodal. So that's a very common name. Okay? And here's an example of a function in R. It's definitely not convex. I mean, look, there's negative curvature right there. Okay? So that's not convex. It is quasi-convex. And the way you check if it's quasi-convex is you just take your level set. Like, what is the sublevel set for this level?","zh":"如果一个函数的下水平集都是凸集，则该函数称为拟凸函数。好了，这个概念的另一个名称是单峰函数。这是非常常见的名称。明白吗？这里有一个实数域上的函数例子。它显然不是凸函数。我的意思是，那里明显存在负曲率。明白吗？所以这不是凸函数。但它却是拟凸函数。判断一个函数是否为拟凸函数的方法是取其水平集。例如，这个水平集是什么？","start":3498.68,"end":3525.96}],"notes":["本段主要讲解了凸函数的广义概念，包括伪凸性和拟凸性。教授指出，数学中存在大量关于凸函数的广义概念，如伪凸性和拟凸性，这些概念虽然复杂，但并不影响其有效性。","教授提到，拟凸函数的定义是其所有下水平集都是凸集。此外，拟凸函数也被称为单峰函数，这在实际应用中非常常见。","教授通过一个例子说明了拟凸函数的特性，指出该函数在实数域上不是凸函数，但具有负曲率，因此不是凸函数，但它是拟凸函数。","教授强调，判断一个函数是否为拟凸函数的方法是检查其下水平集是否为凸集。这为后续的凸优化问题提供了理论基础。","教授还提到，拟凸性与伪凸性之间存在一定的联系，但具体关系较为复杂，需要进一步研究。","教授指出，拟凸性是凸优化中的一个重要概念，它在实际问题中具有广泛的应用价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3363.92,"end":3525.96,"asr_flags":[151],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3363.92,"text":"It's ridiculous. What happens is this thing is monotone increasing in y and you've been asked to maximize it. So, you know, so you get plus infinity. If y is negative, it's not. And you just draw a picture and take a derivative and you can work out what it is. I'm not going to do that, but you get something like this. So, you know, roughly speaking, the conjugate of a log looks like a log. I mean, the sign got flipped and there's a minus one offset, but that's that."},{"start":3391.02,"text":"If you have a quadratic form, 1 half x transpose qx with a positive definite q, then it turns out that the conjugate is really cool. It's also a quadratic form given by the inverse matrix. Okay? So, everybody got this? So, these are just like kind of basic things. Okay. We're now going to cover two more..."},{"start":3419.52,"text":"Generalizations of convexity. So first, let me give you some background, right? That, you know, there's a whole sub-industry in math of generalizing convexity. And you have pseudo-convexity and quasi-convexity. And I don't know, there's all these different types of generalizations. And, you know, it's totally fine. It's not hurting anybody."},{"start":3443.68,"text":"Then usually on page 300 of the book, you'll get this horrible diagram that says if something is quasi-convex and triple pseudo-convex and blah, blah, blah, then it's also this. And it's a big diagram that shows you all this. What we're going to do here is we've selected the two generalizations that are actually useful. And they are quasi-convexity. That's this one."},{"start":3470.81,"text":"And we're going to talk about one more, which is log convexity, which is almost kind of not quite a generalization, but it is kind of. Okay, but this one is. So that's what we're going to do. So I'm just saying if you go to Wikipedia and type in quasi-convexity, you'll find out there's pseudo-convex, and then someone showed that if it's pseudo-convex and blah, blah, blah, blah, blah, then it has to be, anyway, it's very complicated. So, okay, here it is."},{"start":3498.68,"text":"A function is quasi-convex if its sublevel sets are all convex. Period. Oh, another name for this is unimodal. So that's a very common name. Okay? And here's an example of a function in R. It's definitely not convex. I mean, look, there's negative curvature right there. Okay? So that's not convex. It is quasi-convex. And the way you check if it's quasi-convex is you just take your level set. Like, what is the sublevel set for this level?"}],"speech_gaps":[],"frame":"../frames/v004/021.webp","frame_time":3375.92},{"title":"凸函数与次级集的性质","segments":[{"id":153,"text":"What is the set of x for which the function is smaller than this value? No, I'm down here. It's empty. See, it's the empty set. Is the empty set convex? Yeah, so that's cool. If I put something that just touches the bottom of this, I get a singleton, the minimizer. That's convex. Now, as I raise this level,","zh":"对于函数值小于这个值的x集合是什么？不，我在这里。它是空集。你看，它是空集。空集是凸集吗？是的，所以这很有趣。如果我把一个刚好接触这个底部的点放进去，我就得到一个单点集，也就是最小化点。这也是凸集。现在，当我把这个水平线升高时，","start":3529.2,"end":3553.24},{"id":154,"text":"you get an interval, but intervals are convex. What happens is if I raise it at the value beta, I get a half infinite interval, right? That's also convex, right? So unimodal is another name for it. And basically for a function of one variable, something is quasi-convex. If roughly speaking, you know, it's decreasing, there's a point where it's decreasing up to that point and then increasing above it.","zh":"你会得到一个区间，但区间是凸集。如果我在值beta处升高它，我会得到一个半无限区间，对吧？这也是凸集，对吧？所以“单峰”是它的另一个名称。基本上，对于一个一元函数，如果大致上它是递减的，直到某个点之后又递增，那么它就是拟凸函数。","start":3553.82,"end":3583.06},{"id":155,"text":"Okay? It's also more interesting in the vector case, right? Yeah. What's a half-infinite interval? It is this. It would look like something like this. There. That's a half-infinite interval. It's everything less than or equal to 3. That's an example of a half-infinite interval. Actually, do people even say that? Infinite interval? I don't know. I made that up, that name. So it might not be a technique, you know.","zh":"明白了？在向量情况下，这会更有趣，对吧？是的。什么是半无限区间？就是这个。它看起来像这样。那里，这就是一个半无限区间。它是所有小于或等于3的值。这是一个半无限区间的例子。实际上，人们真的会这么说吗？无限区间？我不确定。我随便编了这个名字。所以这可能不是一个技术术语，你知道的。","start":3583.54,"end":3614.4},{"id":156,"text":"But, okay, everybody got this? So that's what a quasi-convex function is, right? And by the way, it's actually super interesting. Suppose f is a function that we want to minimize, like it's an objective.","zh":"但是，好吧，大家都明白了？所以这就是拟凸函数，对吧？顺便说一句，这其实非常有趣。假设f是我们想要最小化的函数，比如它是目标函数。","start":3615.02,"end":3628.35},{"id":157,"text":"What's really cool about this, this says then a sublevel set you can describe as all the choices that are as good as or better than, let's say, alpha. Everybody got that? Like F is whatever your objective is in your problem. Let's say it's a loss function and you're fitting something, right? Then this says, show me the set of all parameters that fit my data at least as well as alpha. Everybody got that?","zh":"这真的很有趣，因为它说明了一个下水平集可以描述为所有与某个值alpha一样好或更好的选择。大家都明白了吗？比如F是你问题中的目标函数。假设它是一个损失函数，你正在拟合某个模型，对吧？那么这就意味着，给我所有参数的集合，这些参数至少和alpha一样好地拟合我的数据。大家都明白了吗？","start":3629.58,"end":3657.26},{"id":158,"text":"Okay, so it kind of makes sense, right? I mean, it's an interesting, it's an interesting, and it says that these, if you're quasi-convex, those are convex functions, okay? Convex sets, I'm sorry. Okay, so let's look at some examples. Well, okay, square root absolute value z, everybody can picture that, looks like this, right? Well, it's obviously not concave, it is not convex, but it is quasi-convex. It's also, by the way,","zh":"好吧，这有点道理，对吧？我是说，这很有趣，它说明如果一个函数是拟凸的，那么这些集合就是凸集，对吧？凸集，抱歉。好的，让我们来看一些例子。好吧，平方根绝对值z，大家都能想象到，看起来像这样，对吧？显然它不是凹函数，也不是凸函数，但它却是拟凸函数。顺便说一句，","start":3657.91,"end":3683.61}],"notes":["本段讲解了次凸函数（quasi-convex function）的定义及其与凸集的关系。次凸函数的次级集（sublevel set）是凸集，这是其重要性质之一。讲者通过举例说明，当函数在某个值以下的所有点构成的集合是凸集时，该函数为次凸函数。","讲者提到，次凸函数的次级集可以描述为所有比某个阈值（alpha）更好或相等的点的集合。例如，在优化问题中，如果目标函数是损失函数，那么次级集可以解释为所有参数值，这些参数值在拟合数据时至少与给定的alpha一样好。","讲者还指出，虽然某些函数（如绝对值函数的平方根）不是凸函数，但它们是次凸函数。这说明次凸函数的定义比凸函数更广泛，包含了一些非凸函数。","讲者强调了次凸函数在优化中的重要性，特别是在最小化目标函数时，次凸函数的次级集具有凸性，这有助于优化算法的设计和分析。","讲者提到，次凸函数的次级集是凸集，这是其定义的核心。因此，判断一个函数是否为次凸函数，可以通过检查其所有次级集是否为凸集。","讲者还提到，次凸函数的次级集可以是半无限区间，这在单变量函数中是常见的现象。例如，当函数在某个值以下的所有点构成一个半无限区间时，该函数是次凸函数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3529.2,"end":3683.61,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3529.2,"text":"What is the set of x for which the function is smaller than this value? No, I'm down here. It's empty. See, it's the empty set. Is the empty set convex? Yeah, so that's cool. If I put something that just touches the bottom of this, I get a singleton, the minimizer. That's convex. Now, as I raise this level,"},{"start":3553.82,"text":"you get an interval, but intervals are convex. What happens is if I raise it at the value beta, I get a half infinite interval, right? That's also convex, right? So unimodal is another name for it. And basically for a function of one variable, something is quasi-convex. If roughly speaking, you know, it's decreasing, there's a point where it's decreasing up to that point and then increasing above it."},{"start":3583.54,"text":"Okay? It's also more interesting in the vector case, right? Yeah. What's a half-infinite interval? It is this. It would look like something like this. There. That's a half-infinite interval. It's everything less than or equal to 3. That's an example of a half-infinite interval. Actually, do people even say that? Infinite interval? I don't know. I made that up, that name. So it might not be a technique, you know."},{"start":3615.02,"text":"But, okay, everybody got this? So that's what a quasi-convex function is, right? And by the way, it's actually super interesting. Suppose f is a function that we want to minimize, like it's an objective."},{"start":3629.58,"text":"What's really cool about this, this says then a sublevel set you can describe as all the choices that are as good as or better than, let's say, alpha. Everybody got that? Like F is whatever your objective is in your problem. Let's say it's a loss function and you're fitting something, right? Then this says, show me the set of all parameters that fit my data at least as well as alpha. Everybody got that?"},{"start":3657.91,"text":"Okay, so it kind of makes sense, right? I mean, it's an interesting, it's an interesting, and it says that these, if you're quasi-convex, those are convex functions, okay? Convex sets, I'm sorry. Okay, so let's look at some examples. Well, okay, square root absolute value z, everybody can picture that, looks like this, right? Well, it's obviously not concave, it is not convex, but it is quasi-convex. It's also, by the way,"}],"speech_gaps":[],"frame":"../frames/v004/022.webp","frame_time":3541.2},{"title":"凸函数与整数值函数的讨论","segments":[{"id":159,"text":"Quasi-concave, I think. Is it? No, it's not. Sorry. It's quasi-convex. Okay. Here's a weird one. The ceiling of x. That is the smallest integer bigger than your number, right? So if I draw the plot of that function, it's like a staircase, right? Basically, it's just kind of like, you know, it takes the biggest integer, whatever. The smallest integer is bigger than you. Everybody got it? Okay. Oh!","zh":"拟凹，我想。是吗？不，不是。抱歉。它是拟凸的。好的。这里有一个奇怪的例子。x的上取整。也就是说，比你的
