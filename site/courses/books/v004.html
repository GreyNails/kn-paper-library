y, so what is this? This is a super interesting function. If x is a vector, what's that? What is it? That's not one. No, no, no."},{"start":3909.12,"text":"it basically what is it no it's the number of non-zero elements right because i made it maybe you can't read it from there this is it's zero if it's zero and it's one otherwise so this is actually the number of non-zero entries of x some people have a name for this some people call it the cardinality of x the card of x right that that's gonna that comes up in a lot of things and we'll there's a connection to convexity we'll get to later"},{"start":3942.72,"text":"Okay, so super interesting, right? If X is a portfolio, if you're doing some investments, X is a portfolio, how would you say that in English? I'll tell you the correct slang in a minute, but how would you say that? X is your portfolio. Like X37 is, let's say, the dollar value you invest in some asset, asset number 37. So what is that function of your portfolio? Yeah, it's the number of assets you invest in."},{"start":3974.85,"text":"everybody everybody got it so yeah and i think they would say something like it's like the total number of names or i don't know what they would say something like that that would be close okay so okay now fine let's get back to this function um that's an integer valued function that's awesome it's a super interesting one and useful one because we talked about it and now is it convex i don't i'm not seeing it no because it's not convex right because look uh"}],"speech_gaps":[],"frame":"../frames/v004/024.webp","frame_time":3854.51},{"title":"凸函数的定义与例子","segments":[{"id":169,"text":"I mean, I can take this point, and I can take this point, and draw this line, and it's not below the thing there. Yeah? If you have any discontinuity in your function... Yeah, well, that's not quite true. So, I mean, since I don't want to confuse people, but actually, that's exactly what I'm probably about to do. So, here's a theory of convex integer-valued functions. They're constant.","zh":"我的意思是，我可以取这个点，再取这个点，画出这条线，它不会在那个图形的下方。对吧？如果你的函数有任何不连续性……嗯，那并不是完全正确。所以，我的意思是，我不想让人混淆，但事实上，我可能马上就会这么做。这里有一个凸整值函数的理论。它们是常数。","start":4004.85,"end":4034.12},{"id":170,"text":"Okay, that's like the answer is their functions 1, 2, minus 13. Okay, that's not totally true. And there's some weird sick. I mean, but this is sick. And you shouldn't even hang out with people who make up examples like this. But so, I mean, here's one. Here's a function. It's defined on minus 3 to plus 2. And it takes the value 7 inside the interval. But then at minus 3, it takes the value 10. And at 2,","zh":"好的，答案是它们的函数值为1、2、-13。好的，这并不完全正确。而且有一些奇怪的例子。我的意思是，但这就是奇怪的例子。你不应该和制造这种例子的人交往。所以，我的意思是，这里有一个例子。这里有一个函数。它定义在-3到+2之间。在区间内，它取值为7。但在-3处，它取值为10。在2处，","start":4034.78,"end":4064.18},{"id":171,"text":"it takes the value 12. Okay? So that's an integer-valued function, no doubt about it. It only has the values 7, 10, and 12. And it's convex. Okay, everybody got that? You don't think it's convex? Ooh, I like that. Ooh, ooh, yeah, yeah, yeah. Okay, that's fine. All right, we can do that. Let's do chords. So for chords, I take two points in the domain.","zh":"它取值为12。对吧？所以这是一个整值函数，毫无疑问。它只取值7、10和12。而且它是凸的。好的，大家明白了吗？你们不认为它是凸的吗？哦，我喜欢这个。哦，哦，对，对，对。好的，没关系。我们来做弦。对于弦，我取域中的两个点。","start":4064.68,"end":4090.82},{"id":172,"text":"Right? And I take the chord, right? So if I take a point here and I take a point here, and I take the chord, that's the line between it. Does it lie above the graph? It lies on the graph, so it's cool. Okay? What if I take this point and some point over here? Now, the chord looks like that. Does it lie above the graph? Okay? And finally, what if I take that point and something in here? I get a chord that looks like that. It lies above the graph. And then finally, what if I take these two?","zh":"对吧？然后我取弦，对吧？所以如果我取这个点和这个点，然后取弦，那就是它们之间的连线。它是否位于图形上方？它位于图形上，所以没问题。对吧？如果我取这个点和那边的一个点，那么弦看起来像这样。它是否位于图形上方？对吧？最后，如果我取那个点和这个区间中的一个点，我得到一条看起来像这样的弦。它位于图形上方。最后，如果我取这两个点，","start":4091.42,"end":4120.09},{"id":173,"text":"And I draw the chord like that. Does it lie above the graph? The answer is yes. So, cool. Okay. So it is convex. This is sick and weird, and you shouldn't hang out with people that make up examples like this. Yes? That's correct. There's your amended statement. That's good. But, okay.","zh":"并画出这样的弦。它是否位于图形上方？答案是肯定的。所以，很好。好的，它是凸的。这很奇怪，而且你不应该和制造这种例子的人交往。对吧？这是正确的。这就是你的修正后的陈述。很好。但，好吧。","start":4120.56,"end":4143.63},{"id":174,"text":"If you didn't follow this, then don't worry, because you're probably better off if you didn't, actually. So that's fine. Okay, so then you get some pretty weird stuff. Actually, I won't go into some of these, but we'll do one example. This is quite practical. It's the internal rate of return. So this is from...","zh":"如果你没有跟上这个内容，那也没关系，实际上你可能更好，因为你不理解它。所以这样也很好。好的，那么你就会得到一些相当奇怪的东西。实际上，我不会深入讲解其中的一些内容，但我们来做一个例子。这个例子非常实用。这就是内部收益率。这是从……","start":4144.58,"end":4169.02}],"notes":["本段讲授了凸函数的定义，通过一个整数值函数的例子来说明。该函数在区间内取值为7，端点处分别取值为10和12。教授强调了凸函数的定义：任意两点之间的弦必须位于函数图像的上方或与之重合。通过多个例子和图形演示，教授展示了如何判断一个函数是否为凸函数。","教授通过一个具体的例子来说明凸函数的性质，即函数在区间内取值为7，端点处取值为10和12。他指出，虽然这个函数看起来有些奇怪，但确实满足凸函数的定义。教授还提到，如果弦位于图像的上方或与之重合，则函数是凸的。","教授进一步解释了凸函数的定义，即对于任意两点，连接这两点的弦必须位于函数图像的上方或与之重合。他通过多个例子和图形演示，说明了如何判断一个函数是否为凸函数。教授还提到，如果弦位于图像的上方或与之重合，则函数是凸的。","教授指出，虽然这个例子看起来有些奇怪，但确实满足凸函数的定义。他强调，凸函数的定义是严格的，必须满足所有点的弦都位于图像的上方或与之重合。教授还提到，如果弦位于图像的上方或与之重合，则函数是凸的。","教授提到，如果学生没有理解这个例子，也不必担心，因为这可能意味着他们对凸函数的理解还不够深入。他指出，凸函数的定义是严格的，必须满足所有点的弦都位于图像的上方或与之重合。","教授最后提到，虽然这个例子看起来有些奇怪，但确实满足凸函数的定义。他指出，凸函数的定义是严格的，必须满足所有点的弦都位于图像的上方或与之重合。教授还提到，如果弦位于图像的上方或与之重合，则函数是凸的。"],"formulas":[],"uncertainties":["sick","weird sick"],"diagram":"none","start":4004.85,"end":4169.02,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4004.85,"text":"I mean, I can take this point, and I can take this point, and draw this line, and it's not below the thing there. Yeah? If you have any discontinuity in your function... Yeah, well, that's not quite true. So, I mean, since I don't want to confuse people, but actually, that's exactly what I'm probably about to do. So, here's a theory of convex integer-valued functions. They're constant."},{"start":4034.78,"text":"Okay, that's like the answer is their functions 1, 2, minus 13. Okay, that's not totally true. And there's some weird sick. I mean, but this is sick. And you shouldn't even hang out with people who make up examples like this. But so, I mean, here's one. Here's a function. It's defined on minus 3 to plus 2. And it takes the value 7 inside the interval. But then at minus 3, it takes the value 10. And at 2,"},{"start":4064.68,"text":"it takes the value 12. Okay? So that's an integer-valued function, no doubt about it. It only has the values 7, 10, and 12. And it's convex. Okay, everybody got that? You don't think it's convex? Ooh, I like that. Ooh, ooh, yeah, yeah, yeah. Okay, that's fine. All right, we can do that. Let's do chords. So for chords, I take two points in the domain."},{"start":4091.42,"text":"Right? And I take the chord, right? So if I take a point here and I take a point here, and I take the chord, that's the line between it. Does it lie above the graph? It lies on the graph, so it's cool. Okay? What if I take this point and some point over here? Now, the chord looks like that. Does it lie above the graph? Okay? And finally, what if I take that point and something in here? I get a chord that looks like that. It lies above the graph. And then finally, what if I take these two?"},{"start":4120.56,"text":"And I draw the chord like that. Does it lie above the graph? The answer is yes. So, cool. Okay. So it is convex. This is sick and weird, and you shouldn't hang out with people that make up examples like this. Yes? That's correct. There's your amended statement. That's good. But, okay."},{"start":4144.58,"text":"If you didn't follow this, then don't worry, because you're probably better off if you didn't, actually. So that's fine. Okay, so then you get some pretty weird stuff. Actually, I won't go into some of these, but we'll do one example. This is quite practical. It's the internal rate of return. So this is from..."}],"speech_gaps":[],"frame":"../frames/v004/025.webp","frame_time":4016.85},{"title":"现金流与现值的定义","segments":[{"id":175,"text":"I don't know if you get accounting or something. Okay. So here it is. So I have a cash flow and it's given by a vector, which is N plus one long. And the entries are labeled like X one, X zero up to XN, right? So that's a cash flow over N plus one periods, right? I mean, it depends. X zero might be like right now, right? So for example, if you bought a bond, let's just say, if you bought a bond, X zero might be negative. It's how much you pay for the bond.","zh":"我不知道你们是否了解会计或者相关的内容。好的。那么这里就是。我有一个现金流，它由一个长度为N加一的向量给出。向量中的元素被标记为X1、X0一直到XN，对吧？所以这是跨越N加一个时期的现金流，对吧？我的意思是，这取决于具体情况。X0可能代表的就是现在，对吧？例如，如果你购买了一张债券，比如说，如果你购买了一张债券，X0可能是负数。它表示你为这张债券支付的金额。","start":4169.48,"end":4195.64},{"id":176,"text":"Then X1 might be the coupon payment you get for that bond. X2 is the coupon payment in period two. And then Xn might be the maturity and you get both back the coupon payment and the face value. By the way, you don't have to know what a bond is. I'm just like, you don't need to know this. But it's not bad. It's just cultural, I don't know, enrichment or something. Okay, everybody got that, right? I mean, this could be...","zh":"然后X1可能是你从这张债券中获得的利息支付。X2是第二时期的利息支付。而Xn可能是到期时你获得的本金和利息的总和。顺便说一句，你们不需要知道什么是债券。我只是说，你们不需要了解这些。但这不是坏事。这只是文化上的，我也不知道，算是些补充知识吧。好的，大家明白了吗，对吧？我的意思是，这可能是...","start":4196.98,"end":4223.1},{"id":177,"text":"an investment made by a VC firm in a startup, right? So they wire transfer, you know, $12 million into a bank account, right? That's X zero. Then X one is probably zero for a startup. X two is, and then maybe sometime later, somebody acquires them. And then one of the Xs is really big. Everybody got this? Okay, so that's a cashflow.","zh":"一家风投公司对初创企业进行的一项投资，对吧？他们通过电汇，你知道的，将1200万美元转入银行账户，对吧？这就是X0。然后X1对于初创企业来说可能为零。X2是，然后可能在某个时候，有人收购了他们。然后其中一个X值会非常大。大家明白了吗？好的，这就是现金流。","start":4223.61,"end":4250.59},{"id":178,"text":"Okay, and we're going to assume, this is just to make the definition simple, that's fine. We're going to assume that X0 is less than zero. That means that the first point in that, the first cash flow is something we pay, we invest in, right? Because it's a negative cash flow to us, it means we're investing X0, right? Then we're also going to assume, we don't assume that the signs of X1 through Xn are positive. We may pay more in. They can come back to us and say, sorry, we need a bridge loan.","zh":"好的，我们将假设，这只是为了简化定义，这没问题。我们将假设X0小于零。这意味着，这个现金流的第一个点，也就是我们支付的金额，我们进行投资，对吧？因为这是一个负的现金流对我们来说，意味着我们投入了X0，对吧？然后我们还将假设，我们不假设X1到Xn的符号都是正的。我们可能会继续投入更多资金。他们可能会回来告诉我们，抱歉，我们需要一笔过桥贷款。","start":4252.13,"end":4281.54},{"id":179,"text":"or whatever, or we don't, you know, that's it. Or we can't, we can't meet payroll. So we need more money. That's fine. But we will assume that simply the sum of all the things is positive. And what that, that means, and this is, this is just to make it simple. It works in other cases too. What that means is that the total of all the cash payments is, it was not at least a disaster. That's what it means. It means, right. So that's, that's what it says.","zh":"或者 whatever，或者我们不需要，你知道的，就这样。或者我们不能，我们不能支付工资。所以我们需要更多的钱。这没问题。但我们将会假设，所有金额的总和是正的。而这意味着，以及这只是一个简化，它在其他情况下也适用。这意味着所有现金流的总和并不是至少是一场灾难。这就是它的意思。这就是它所说的。","start":4281.92,"end":4307.02},{"id":180,"text":"Okay. So people talk about the present value of the cash flow, and that's going to be with an interest rate R. It says you simply multiply. So what you do is you say that a payment to me at time I, at period I, is going to be worth 1 plus R to the minus I. So if R is 5%,","zh":"好的。人们谈论现金流的现值，这将涉及到利率R。它说你只需相乘。因此，你所做的就是说，在时期I收到的支付，其价值为1加R的负I次方。因此，如果R是5%,","start":4307.52,"end":4329.68}],"notes":["本段介绍了现金流的定义，其中现金流由一个长度为N+1的向量表示，每个元素对应不同时间段的现金流入或流出。X0代表当前时刻的现金流，可能是负数，表示投资支出。X1到XN代表后续各期的现金流，可能为正或负，取决于具体情境。","讲者通过债券和风险投资两个例子来说明现金流的含义。在债券的例子中，X0为负数表示购买债券的支出，X1到Xn为正数表示利息收入和到期本金的回收。在风险投资的例子中，X0为负数表示投资金额，X1到Xn可能为零或正数，表示后续的回报。","讲者强调现金流的总和应为正数，以确保整体的盈利性。这并不是一个严格的数学条件，而是为了简化定义和理解。","讲者提到现值的计算，即每个现金流需要乘以(1 + R)^{-I}，其中R为利率，I为时间周期。这表明现值是未来现金流的折现值，反映了资金的时间价值。","讲者指出，现值的计算依赖于利率R，而利率的设定会影响现值的大小。例如，当R为5%时，每个现金流的现值会相应减少。","讲者没有深入讨论现值的具体计算方法或其在优化问题中的应用，而是专注于现金流的定义和现值的基本概念。"],"formulas":[{"latex":"PV = \\sum_{i=0}^{N} \\frac{X_i}{(1 + R)^i}","symbols":"现值（PV）是各期现金流（X_i）的折现值之和，其中R为利率，i为时间周期。","explanation":"公式正确表达了现值的计算方式，即各期现金流按利率R折现后的总和。","evidence":"Okay. So people talk about the present value of the cash flow, and that's going to be with an interest rate R. It says you simply multiply. So what you do is you say that a payment to me at time I, at period I, is going to be worth 1 plus R to the minus I. So if R is 5%,"}],"uncertainties":[],"diagram":"none","start":4169.48,"end":4329.68,"asr_flags":[],"math_clarifications":["公式中的求和符号应使用标准的\\sum，而非\\text{sum}，以符合数学排版规范。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4169.48,"text":"I don't know if you get accounting or something. Okay. So here it is. So I have a cash flow and it's given by a vector, which is N plus one long. And the entries are labeled like X one, X zero up to XN, right? So that's a cash flow over N plus one periods, right? I mean, it depends. X zero might be like right now, right? So for example, if you bought a bond, let's just say, if you bought a bond, X zero might be negative. It's how much you pay for the bond."},{"start":4196.98,"text":"Then X1 might be the coupon payment you get for that bond. X2 is the coupon payment in period two. And then Xn might be the maturity and you get both back the coupon payment and the face value. By the way, you don't have to know what a bond is. I'm just like, you don't need to know this. But it's not bad. It's just cultural, I don't know, enrichment or something. Okay, everybody got that, right? I mean, this could be..."},{"start":4223.61,"text":"an investment made by a VC firm in a startup, right? So they wire transfer, you know, $12 million into a bank account, right? That's X zero. Then X one is probably zero for a startup. X two is, and then maybe sometime later, somebody acquires them. And then one of the Xs is really big. Everybody got this? Okay, so that's a cashflow."},{"start":4252.13,"text":"Okay, and we're going to assume, this is just to make the definition simple, that's fine. We're going to assume that X0 is less than zero. That means that the first point in that, the first cash flow is something we pay, we invest in, right? Because it's a negative cash flow to us, it means we're investing X0, right? Then we're also going to assume, we don't assume that the signs of X1 through Xn are positive. We may pay more in. They can come back to us and say, sorry, we need a bridge loan."},{"start":4281.92,"text":"or whatever, or we don't, you know, that's it. Or we can't, we can't meet payroll. So we need more money. That's fine. But we will assume that simply the sum of all the things is positive. And what that, that means, and this is, this is just to make it simple. It works in other cases too. What that means is that the total of all the cash payments is, it was not at least a disaster. That's what it means. It means, right. So that's, that's what it says."},{"start":4307.52,"text":"Okay. So people talk about the present value of the cash flow, and that's going to be with an interest rate R. It says you simply multiply. So what you do is you say that a payment to me at time I, at period I, is going to be worth 1 plus R to the minus I. So if R is 5%,"}],"speech_gaps":[],"frame":"../frames/v004/026.webp","frame_time":4181.48},{"title":"净现值与内部收益率","segments":[{"id":181,"text":"And it's 10 years. It means that it's worth, to me, only 1 over 1.05 to the 10. I don't know what that is. Like 1.8. 1 over 1.8. Let's say it's 0.4. I have no idea what it is. 0.5. I'm making that up. So these are the discounted cash flows. And this is called the net present value. And these are just completely standard concepts in basic accounting.","zh":"而且是10年。这意味着对我来说，它只值1除以1.05的10次方。我不知道这个数是多少。比如大概是1.8。1除以1.8。假设是0.4。我完全不知道是多少。0.5。我在随意编造。这些都是贴现现金流。这被称为净现值。这些都是基础会计中完全标准的概念。","start":4330.35,"end":4357.95},{"id":182,"text":"Okay. That's the present value. And it's a function of the vector X and the interest rate R. Okay. And now I can tell you what the internal rate of return is called the IRR. It's the smallest interest rate for which the present, the net present value is zero. Right. And so, and I think the argument about it, if you're teaching MBAs or something is the idea is you would be ambivalent. If I walk up to you and I say, Hey, I got a great deal for you invest in this thing.","zh":"好的。这就是现值。它是向量X和利率R的函数。好的。现在我可以告诉你内部收益率（IRR）是什么。它是使净现值为零的最小利率。对吧。因此，如果在教MBA之类的课程时，论点就是你会感到犹豫。如果我走到你面前，告诉你，嘿，我有个很棒的投资机会。","start":4360.09,"end":4388.11},{"id":183,"text":"Right. And then we work out the internal rate of return. And it turns out you could get something else. You get a you get a bank account or something like that with the same interest rate. Then you'd say, why should I invest in your stupid thing? I'm going to take you to the bank or something like that. That's the idea. OK. Everybody got this. And this is by the way, this is you. This is not part of the class. You don't need to know this, but it doesn't hurt to know it. This is not bad. OK.","zh":"对的。然后我们计算内部收益率。结果你可能会得到其他东西。比如，你可能会得到一个利率相同的银行账户之类的。那么你会说，为什么我要投资你的愚蠢项目？我会去银行或者类似的地方。这就是这个想法。好的。大家明白了吗？顺便说一句，这是你们自己。这不是课程内容。你们不需要知道这些，但知道也没坏处。这并不糟糕。好的。","start":4388.57,"end":4416.3},{"id":184,"text":"All right, so it turns out the internal rate of return, which is actually complicated, right? Because you actually, you know, this thing here is a polynomial in 1 over 1 plus r. Yeah, it is a polynomial. So this actually requires solving a polynomial equation. So, you know, hello, if there's more than five periods, then there's not an analytical formula for it, but who cares, right? Everybody following, right? So it's complicated, right?","zh":"好的，所以内部收益率实际上是很复杂的，对吧？因为这里实际上是一个关于1除以（1加r）的多项式。是的，它确实是一个多项式。因此，实际上需要解一个多项式方程。所以，你知道的，如果超过五个时期，就没有解析解，但谁在乎呢，对吧？大家跟上来了吗，对吧？所以它很复杂，对吧？","start":4417.41,"end":4445.13},{"id":185,"text":"So this is the internal rate of return. And it turns out it's quasi-concave, which is just like weird. I doubt anyone in accounting would know this. In fact, I'm virtually certain of that fact. I have friends in accounting. And I'm not insulting them. I'm just saying it's not how they think. So it's fine. It's quasi-concave.","zh":"这就是内部收益率。结果它实际上是拟凹的，这听起来很奇怪。我怀疑会计中没有人知道这一点。事实上，我几乎可以肯定这个事实。我有会计方面的朋友。我不是在贬低他们。我只是说这不是他们思考的方式。没关系。它是拟凹的。","start":4446.13,"end":4469.9},{"id":186,"text":"What does it mean to show something's quasi-concave? What you need to do is you need to show that the super-level sets, right? For quasi-convex means the sub-level sets are convex. Quasi-concave means the super-level sets are convex, right? And so let's look at that. So let's look at the set of all cash flows here that satisfy the internal rate of return is bigger than, let's say, 5%. That's what we're going to look at.","zh":"说明某个函数是拟凹函数意味着什么？你需要做的就是证明它的上水平集，对吧？对于拟凸函数来说，意味着下水平集是凸的。拟凹函数意味着上水平集是凸的，对吧？那么我们来看一下。我们来看一下所有满足内部收益率大于5%的现金流集合，这就是我们要研究的内容。","start":4471.18,"end":4501.22}],"notes":["本段讲解了净现值（NPV）的概念，即通过将未来现金流按贴现率折现到当前时点的总和，用于评估投资项目的可行性。同时，提到贴现率的计算方式，如1/1.05^10，以及贴现现金流的计算过程。","内部收益率（IRR）被定义为使净现值为零的贴现率，即投资项目的回报率。讲者通过举例说明，如果IRR高于银行利率，投资者应选择银行存款而非该项目，从而体现IRR的决策作用。","讲者指出IRR的计算涉及求解多项式方程，当时间周期超过五个时，无法通过解析方法求解，因此需要数值方法。这说明IRR的计算复杂性。","IRR的性质被指出为拟凹函数，这与会计学中的常规认知不同。拟凹函数的定义是其上水平集为凸集，这与拟凸函数的下水平集为凸集相对应。","讲者进一步解释了如何判断一个函数是否为拟凹函数，即通过验证其上水平集是否为凸集。这为后续分析IRR的性质提供了理论基础。","最后，讲者以5%的IRR为例，说明如何通过分析上水平集来验证IRR的拟凹性，从而展示其在实际应用中的意义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4330.35,"end":4501.22,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4330.35,"text":"And it's 10 years. It means that it's worth, to me, only 1 over 1.05 to the 10. I don't know what that is. Like 1.8. 1 over 1.8. Let's say it's 0.4. I have no idea what it is. 0.5. I'm making that up. So these are the discounted cash flows. And this is called the net present value. And these are just completely standard concepts in basic accounting."},{"start":4360.09,"text":"Okay. That's the present value. And it's a function of the vector X and the interest rate R. Okay. And now I can tell you what the internal rate of return is called the IRR. It's the smallest interest rate for which the present, the net present value is zero. Right. And so, and I think the argument about it, if you're teaching MBAs or something is the idea is you would be ambivalent. If I walk up to you and I say, Hey, I got a great deal for you invest in this thing."},{"start":4388.57,"text":"Right. And then we work out the internal rate of return. And it turns out you could get something else. You get a you get a bank account or something like that with the same interest rate. Then you'd say, why should I invest in your stupid thing? I'm going to take you to the bank or something like that. That's the idea. OK. Everybody got this. And this is by the way, this is you. This is not part of the class. You don't need to know this, but it doesn't hurt to know it. This is not bad. OK."},{"start":4417.41,"text":"All right, so it turns out the internal rate of return, which is actually complicated, right? Because you actually, you know, this thing here is a polynomial in 1 over 1 plus r. Yeah, it is a polynomial. So this actually requires solving a polynomial equation. So, you know, hello, if there's more than five periods, then there's not an analytical formula for it, but who cares, right? Everybody following, right? So it's complicated, right?"},{"start":4446.13,"text":"So this is the internal rate of return. And it turns out it's quasi-concave, which is just like weird. I doubt anyone in accounting would know this. In fact, I'm virtually certain of that fact. I have friends in accounting. And I'm not insulting them. I'm just saying it's not how they think. So it's fine. It's quasi-concave."},{"start":4471.18,"text":"What does it mean to show something's quasi-concave? What you need to do is you need to show that the super-level sets, right? For quasi-convex means the sub-level sets are convex. Quasi-concave means the super-level sets are convex, right? And so let's look at that. So let's look at the set of all cash flows here that satisfy the internal rate of return is bigger than, let's say, 5%. That's what we're going to look at."}],"speech_gaps":[],"frame":"../frames/v004/027.webp","frame_time":4342.35},{"title":"内部收益率与凸集的讨论","segments":[{"id":187,"text":"right? So what is that? If your internal rate of return is bigger than or equal to 5%, it means that between an interest rate of 0 and 5%, your net present value was still positive, right? Because this says that your net present value with an interest rate of 0 is positive. That's what it says.","zh":"对吧？那这是什么意思？如果你的内部收益率大于或等于5%，这意味着在利率为0%到5%之间，你的净现值仍然是正的，对吧？因为这句话说，当利率为0%时，你的净现值是正的。","start":4501.61,"end":4524.74},{"id":188,"text":"It says that there's no interest, it's low interest time. So just add up the numbers and that says it's positive. So the project looks good if the current interest rates are zero, right? As you increase it, what you can figure out is actually this thing decreases. And of course, at some point it goes through zero. When it goes through zero, that's the internal rate of return, okay? Okay, so...","zh":"它表示没有利息，是低利率时期。所以你只需要把数字加起来，就能知道它是正的。如果当前利率为零，这个项目看起来不错，对吧？随着利率的增加，你可以得出这个值实际上是减少的。当然，在某个点它会穿过零。当它穿过零时，这就是内部收益率，对吧？好的，那么……","start":4525.34,"end":4550.3},{"id":189,"text":"What is this as a function of x? What is that? So, oh, that's a linear function, right? But then this says the linear function is bigger than zero. So what is that? It's a half space. It's an open half space, you would say, because it doesn't have to be bigger than or equal to, but it doesn't matter. So it's an open half space, right? Oh, and an open half space is convex, okay? And for the IRR to be bigger than R, this thing,","zh":"这是关于x的函数，这是什么？哦，这是一个线性函数，对吧？但这句话说这个线性函数大于零。那这是什么意思？这是一个半空间。你可以说这是一个开半空间，因为它不需要大于或等于，但这没关系。这是一个开半空间，对吧？哦，而且开半空间是凸的，对吧？对于内部收益率大于R，这个条件……","start":4551.89,"end":4585.81},{"id":190,"text":"This thing has to hold. You have to be in a family, in an intersection of a set of open half spaces. That's convex. Everybody follow this? So, yes? No, that's the cool thing. Yeah, it's a great question. Max and min, right, they generalize to, you know, sup and inf. And in fact, they can be over infinite sets.","zh":"这个条件必须成立。你必须处于一个集合的交集中，这些集合是开半空间。这是凸的。大家明白吗？是的？不，这是个很酷的事情。是的，这是一个很好的问题。最大值和最小值，对吧，它们可以推广到，你知道的，上确界和下确界。事实上，它们可以在无限集合上进行。","start":4586.9,"end":4614.17},{"id":191,"text":"And we saw a whole bunch of examples, right, where that's the case. This is another one. So, yeah, so that's a very good thing to remember. It's like these rules about max and min, they can be on infinite sets, right? So, okay. Everybody got this? Yeah. I'm talking about concavity, not convexity for this one. Super level implies concavity.","zh":"我们看到了很多例子，对吧，其中就是这种情况。这也是一个例子。所以，是的，记住这一点是非常重要的。这些关于最大值和最小值的规则，它们可以在无限集合上应用，对吧？好的。大家明白了吗？是的。我在这里谈论的是凹性，而不是凸性。超水平集意味着凹性。","start":4614.73,"end":4641.39},{"id":192,"text":"But the intersection of open half-spaces, open half-spaces are also concave?","zh":"但是开半空间的交集，开半空间也是凹的吗？","start":4641.8,"end":4646.24},{"id":193,"text":"No.","zh":"不。","start":4646.44,"end":4646.78},{"id":194,"text":"Oh, okay, no.","zh":"哦，明白了，不。","start":4647.1,"end":4647.9},{"id":195,"text":"So open half-spaces are convex.","zh":"所以，开半空间是凸集。","start":4648.0,"end":4650.22},{"id":196,"text":"Be careful.","zh":"要小心。","start":4651.06,"end":4651.76},{"id":197,"text":"We don't have, there's no such thing as a concave set.","zh":"我们没有所谓的凹集。","start":4651.82,"end":4654.76},{"id":198,"text":"Or at least, I don't know what it is.","zh":"或者说，至少我不知道它是什么。","start":4655.6,"end":4657.16},{"id":199,"text":"I don't think it makes any sense.","zh":"我认为这没有意义。","start":4657.22,"end":4658.24},{"id":200,"text":"So we don't have concave.","zh":"所以我们没有凹集。","start":4658.44,"end":4659.22},{"id":201,"text":"It's weird, right?","zh":"这很奇怪，对吧？","start":4659.54,"end":4660.4},{"id":202,"text":"There should be something.","zh":"应该有什么东西存在。","start":4660.86,"end":4661.78},{"id":203,"text":"But I don't know what a concave set is, right?","zh":"但是我不知道什么是凹集，对吧？","start":4662.0,"end":4665.02},{"id":204,"text":"Oh, you have concave mirrors and concave lenses.","zh":"哦，你有凹面镜和凹透镜。","start":4665.16,"end":4669.06},{"id":205,"text":"but I don't know why we don't have concave sets anyway we don't so so here","zh":"但是我不知道为什么我们没有凹集，无论如何我们都没有，所以这里","start":4669.06,"end":4674.7},{"id":206,"text":"what you want to show to show this quasi concave you want to show that the super","zh":"你想展示的是准凹性，你想展示的是上","start":4674.7,"end":4678.36}],"notes":["本段讨论了内部收益率（IRR）与净现值（NPV）之间的关系，指出当内部收益率大于或等于5%时，净现值在0%到5%的利率范围内仍为正值。这表明项目在低利率环境下具有吸引力。"],"formulas":[],"uncertainties":["concave sets","quasi concave"],"diagram":"none","start":4501.61,"end":4678.36,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":4501.61,"text":"right? So what is that? If your internal rate of return is bigger than or equal to 5%, it means that between an interest rate of 0 and 5%, your net present value was still positive, right? Because this says that your net present value with an interest rate of 0 is positive. That's what it says."},{"start":4525.34,"text":"It says that there's no interest, it's low interest time. So just add up the numbers and that says it's positive. So the project looks good if the current interest rates are zero, right? As you increase it, what you can figure out is actually this thing decreases. And of course, at some point it goes through zero. When it goes through zero, that's the internal rate of return, okay? Okay, so..."},{"start":4551.89,"text":"What is this as a function of x? What is that? So, oh, that's a linear function, right? But then this says the linear function is bigger than zero. So what is that? It's a half space. It's an open half space, you would say, because it doesn't have to be bigger than or equal to, but it doesn't matter. So it's an open half space, right? Oh, and an open half space is convex, okay? And for the IRR to be bigger than R, this thing,"},{"start":4586.9,"text":"This thing has to hold. You have to be in a family, in an intersection of a set of open half spaces. That's convex. Everybody follow this? So, yes? No, that's the cool thing. Yeah, it's a great question. Max and min, right, they generalize to, you know, sup and inf. And in fact, they can be over infinite sets."},{"start":4614.73,"text":"And we saw a whole bunch of examples, right, where that's the case. This is another one. So, yeah, so that's a very good thing to remember. It's like these rules about max and min, they can be on infinite sets, right? So, okay. Everybody got this? Yeah. I'm talking about concavity, not convexity for this one. Super level implies concavity."},{"start":4641.8,"text":"But the intersection of open half-spaces, open half-spaces are also concave?"},{"start":4646.44,"text":"No."},{"start":4647.1,"text":"Oh, okay, no."},{"start":4648.0,"text":"So open half-spaces are convex."},{"start":4651.06,"text":"Be careful."},{"start":4651.82,"text":"We don't have, there's no such thing as a concave set."},{"start":4655.6,"text":"Or at least, I don't know what it is."},{"start":4657.22,"text":"I don't think it makes any sense."},{"start":4658.44,"text":"So we don't have concave."},{"start":4659.54,"text":"It's weird, right?"},{"start":4660.86,"text":"There should be something."},{"start":4662.0,"text":"But I don't know what a concave set is, right?"},{"start":4665.16,"text":"Oh, you have concave mirrors and concave lenses."},{"start":4669.06,"text":"but I don't know why we don't have concave sets anyway we don't so so here"},{"start":4674.7,"text":"what you want to show to show this quasi concave you want to show that the super"}],"speech_gaps":[],"frame":"../frames/v004/028.webp","frame_time":4513.61},{"title":"凸函数与准凸函数的性质","segments":[{"id":207,"text":"level sets are convex right so yeah","zh":"水平集是凸的，对吧，所以是的","start":4678.36,"end":4682.94},{"id":208,"text":"ah because here's what has to happen to for X to be a cash flow with an internal","zh":"啊，这里要发生什么才能让X成为一个内部收益率超过r的现金流","start":4690.58,"end":4697.34},{"id":209,"text":"rate of return exceeding r then this inequality has to hold for all real numbers between zero","zh":"那么这个不等式必须对所有介于零和资本r之间的实数成立","start":4697.34,"end":4704.66},{"id":210,"text":"and capital r right and so basically you're in the intersection of all of those half spaces for any","zh":"对吧，所以基本上你是在所有这些半空间的交集中，对于任何","start":4704.66,"end":4710.62},{"id":211,"text":"fixed number r you get a half space but you got to satisfy that for all numbers between zero and r","zh":"固定的数r，你会得到一个半空间，但你必须满足所有介于零和r之间的数","start":4710.62,"end":4716.24},{"id":212,"text":"and that's an intersection does that make sense cool okay um so i'll just say a few more things","zh":"这个是交集，这有意义吗？酷，好的，那我再说几句","start":4716.24,"end":4725.18},{"id":213,"text":"and then we'll continue next time.","zh":"然后我们下次继续。","start":4725.18,"end":4727.72},{"id":214,"text":"So for quasi-convex functions, you have a modified Jensen inequality. It's actually quite interesting. Jensen's inequality says that f of a mixture is less than the mixture of f's. That's Jensen's inequality for a convex function. For quasi-convex, this gets replaced with the max. And the picture is... Ah, I don't have a picture there. I should. I don't know why I don't. Okay, so here's what it looks like. Here's a quasi-convex function, right? And then here's like x, and here is...","zh":"对于准凸函数，你有一个修改后的Jensen不等式。这实际上相当有趣。Jensen不等式说明，函数的混合小于混合函数值。这是凸函数的Jensen不等式。对于准凸函数，这个被替换为最大值。图像是……啊，我那里没有图。我应该有。我不知道为什么我没有。好吧，这里是什么样子的。这里是一个准凸函数，对吧？然后这里是x，这里是……","start":4729.45,"end":4757.79},{"id":215,"text":"Here's x and here's y. Convexity says that if I draw a straight line between here and here, the graph lies below it. But that's clearly false for this example. And sorry to pick a color which is unreadable. Sorry about that. So this thing says for quasi-convexity, here's what you want to do. You take the max of the two. And so it basically says the graph has to lie between under that thing.","zh":"这里是我的x，这里是y。凸性意味着如果我在两者之间画一条直线，图像应该位于这条直线的下方。但在这个例子中，显然这是不成立的。抱歉选择了一个难以阅读的颜色。对此我感到抱歉。对于准凸性，你想要做的是取两个值的最大值。因此，它基本上意味着图像必须位于该值的下方。","start":4758.13,"end":4785.23},{"id":216,"text":"And it does. So it's cool. So that's quasi-convex. Okay, so we'll quit today. I have to say we are very close. We're about 10 to 15 minutes of lecture through this long slog of all the math. But the sun will come out, I would say, about 20 minutes into next Tuesday's lecture.","zh":"确实如此。所以这很有趣。这就是准凸性。好的，今天我们到此为止。我要说我们已经非常接近了。我们大约还剩下10到15分钟的课程内容，贯穿了所有这些数学内容的漫长过程。但我想说的是，大约在下周一的课程20分钟后，太阳就会出来了。","start":4785.89,"end":4807.79}],"notes":["本段首先讨论了凸函数的水平集性质，指出水平集是凸集，这是凸函数的一个基本特征。接着，讲者转向了现金流内部收益率的计算，强调了对于内部收益率超过某个固定值r的情况，必须满足所有介于0和r之间的实数的不等式，这相当于所有相关半空间的交集。","随后，讲者介绍了准凸函数的Jensen不等式，指出准凸函数的Jensen不等式与凸函数不同，它被替换为最大值。讲者还提到，准凸函数的图像必须位于某个特定的区域之下，这与凸函数的图像性质不同。","讲者在讲解过程中提到，对于准凸函数，图像必须位于两个点之间的最大值之下，这与凸函数的图像性质形成对比。讲者还提到，由于颜色问题，图像可能难以理解，但强调了准凸函数的图像性质。","最后，讲者提到课程接近尾声，预计在接下来的课程中会有进一步的讲解，并提到课程内容的难度较大，但会继续深入讲解。"],"formulas":[],"uncertainties":["internal rate of return exceeding r","capital r","the picture is... Ah, I don't have a picture there"],"diagram":"none","start":4678.36,"end":4807.79,"asr_flags":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":4678.36,"text":"level sets are convex right so yeah"},{"start":4690.58,"text":"ah because here's what has to happen to for X to be a cash flow with an internal"},{"start":4697.34,"text":"rate of return exceeding r then this inequality has to hold for all real numbers between zero"},{"start":4704.66,"text":"and capital r right and so basically you're in the intersection of all of those half spaces for any"},{"start":4710.62,"text":"fixed number r you get a half space but you got to satisfy that for all numbers between zero and r"},{"start":4716.24,"text":"and that's an intersection does that make sense cool okay um so i'll just say a few more things"},{"start":4725.18,"text":"and then we'll continue next time."},{"start":4729.45,"text":"So for quasi-convex functions, you have a modified Jensen inequality. It's actually quite interesting. Jensen's inequality says that f of a mixture is less than the mixture of f's. That's Jensen's inequality for a convex function. For quasi-convex, this gets replaced with the max. And the picture is... Ah, I don't have a picture there. I should. I don't know why I don't. Okay, so here's what it looks like. Here's a quasi-convex function, right? And then here's like x, and here is..."},{"start":4758.13,"text":"Here's x and here's y. Convexity says that if I draw a straight line between here and here, the graph lies below it. But that's clearly false for this example. And sorry to pick a color which is unreadable. Sorry about that. So this thing says for quasi-convexity, here's what you want to do. You take the max of the two. And so it basically says the graph has to lie between under that thing."},{"start":4785.89,"text":"And it does. So it's cool. So that's quasi-convex. Okay, so we'll quit today. I have to say we are very close. We're about 10 to 15 minutes of lecture through this long slog of all the math. But the sun will come out, I would say, about 20 minutes into next Tuesday's lecture."}],"speech_gaps":[{"start":4684.016,"end":4690.18}],"frame":"../frames/v004/029.webp","frame_time":4690.36}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v004.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
