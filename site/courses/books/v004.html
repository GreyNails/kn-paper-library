<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 4</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">04 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 4 · 完整初稿</p><video id="video" hidden controls preload="none"></video><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v004","title":"04 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 4","course":"凸优化","pages":[{"title":"凸优化的基本性质与构造方法","segments":[{"id":0,"text":"We'll continue. And let me remind you where we are, what the big picture is. The big picture is, you know, there are some times, you know, when someone says, is this convex or this concave? Sometimes you actually just go back to the definition or calculate a Hessian or something like that. That's actually really very rare."},{"id":1,"text":"Really, the way you're going to be doing this, and a lot of people do this in practice, is in a constructive way. And so that's basically a calculus, as I said. You learn a bunch of base convex functions, a bunch of base convex sets."},{"id":2,"text":"And then you learn the rules that you can use to combine them and to know that the combination or to transform them and to know that that transformation is also convex. And so then, in fact, that's going to be also how all the code works as well, as we'll see. So, okay. So we're going through these. I think last time I mentioned these. You know, some of these are simple and obvious."},{"id":3,"text":"The first are, you know, look, if something is convex, then 3.7 times it is convex. Well, sure, right? If something curves upward and then you multiply it by 3.7, it curves more upward, right? So that's fine."},{"id":4,"text":"The sum of two convex functions is convex. And again, you know, some of these things, and I would actually encourage you to do this every now and then, you just grab one of these things and like just prove it. Some of these are like three line things to show, but somebody has to show them. I'm not going to do it, right? So, you know, the sum."},{"id":5,"text":"Precomposition with an affine function. Precomposition refers to the fact that the affine function appears first, right? So first I apply an affine function. That's AX. I map X to AX plus B. And then I take this convex function F. And that preserves convexity. And again, this is not, these are not, that's a three-liner. And so it's, you know, these are the kind of things you might want to just show yourself."},{"id":6,"text":"Okay, so these are relatively simple. Then we get to the so-called pointwise maximum. So the maximum of a bunch of functions is defined pointwise. And, you know, just to convince you that this would preserve convexity, I mean, I'll just draw a picture. I mean, it's not too hard to actually show it. But if I have, you know, one function here, and I have another one over here that's convex, here's another one, right? Then if I look at the maximum,"},{"id":7,"text":"The point-wise maximum is going to be this function here, like that. And it's pretty clear, at least your eye tells you, that's convex. And it's not hard to show this. So the maximum of a bunch of convex functions is convex. That's sort of a basic thing. It's kind of obvious."}],"notes":["本段主要讲解凸函数的基本性质和构造方法。讲者指出，判断一个函数是否为凸函数，通常不是直接根据定义或计算Hessian矩阵，而是通过构造方法，即学习一些基本的凸函数和凸集，并掌握如何将它们组合或变换以保持凸性。","讲者提到，构造方法类似于一种‘微积分’，通过学习基本的凸函数和凸集，然后应用一些规则来组合或变换它们，从而保持凸性。这些规则包括：凸函数的线性变换、凸函数的和、以及凸函数的逐点最大值等。","讲者强调，这些规则虽然看起来简单，但需要通过证明来验证。例如，凸函数的线性变换（如乘以正数）保持凸性，凸函数的和也是凸函数，以及凸函数的逐点最大值仍然是凸函数。","讲者还提到，这些规则在实际应用中非常重要，因为它们构成了优化算法和代码实现的基础。例如，代码中的凸性检查和优化过程都依赖于这些规则。","讲者通过举例说明了这些规则的应用，例如，凸函数的线性变换（如乘以3.7）会使得函数曲线更加向上弯曲，而凸函数的和仍然是凸函数。此外，逐点最大值的凸性可以通过图形直观理解。","最后，讲者指出，虽然这些规则看起来简单，但需要通过证明来确认其正确性。例如，凸函数的逐点最大值的凸性可以通过图形和数学推导来验证，但需要一定的数学基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":180.61,"asr_flags":[],"raw_segments":[{"start":5.26,"text":"We'll continue. And let me remind you where we are, what the big picture is. The big picture is, you know, there are some times, you know, when someone says, is this convex or this concave? Sometimes you actually just go back to the definition or calculate a Hessian or something like that. That's actually really very rare."},{"start":26.91,"text":"Really, the way you're going to be doing this, and a lot of people do this in practice, is in a constructive way. And so that's basically a calculus, as I said. You learn a bunch of base convex functions, a bunch of base convex sets."},{"start":40.93,"text":"And then you learn the rules that you can use to combine them and to know that the combination or to transform them and to know that that transformation is also convex. And so then, in fact, that's going to be also how all the code works as well, as we'll see. So, okay. So we're going through these. I think last time I mentioned these. You know, some of these are simple and obvious."},{"start":65.69,"text":"Pretty soon, though, they're not simple or obvious, right? Some of these rules. So the first are, you know, look, if something is convex, then 3.7 times it is convex. Well, sure, right? If something curves upward and then you multiply it by 3.7, it curves more upward, right? So that's fine."},{"start":84.85,"text":"The sum of two convex functions is convex. And again, you know, some of these things, and I would actually encourage you to do this every now and then, you just grab one of these things and like just prove it. Some of these are like three line things to show, but somebody has to show them. I'm not going to do it, right? So, you know, the sum."},{"start":102.45,"text":"Precomposition with an affine function. Precomposition refers to the fact that the affine function appears first, right? So first I apply an affine function. That's AX. I map X to AX plus B. And then I take this convex function F. And that preserves convexity. And again, this is not, these are not, that's a three-liner. And so it's, you know, these are the kind of things you might want to just show yourself."},{"start":130.06,"text":"Okay, so these are relatively simple. Then we get to the so-called pointwise maximum. So the maximum of a bunch of functions is defined pointwise. And, you know, just to convince you that this would preserve convexity, I mean, I'll just draw a picture. I mean, it's not too hard to actually show it. But if I have, you know, one function here, and I have another one over here that's convex, here's another one, right? Then if I look at the maximum,"},{"start":160.0,"text":"The point-wise maximum is going to be this function here, like that. And it's pretty clear, at least your eye tells you, that's convex. And it's not hard to show this. So the maximum of a bunch of convex functions is convex. That's sort of a basic thing. It's kind of obvious."}],"speech_gaps":[],"frame":"../frames/v004/001.webp","frame_time":17.259999999999998},{"title":"分段线性函数与凸函数的构造","segments":[{"id":8,"text":"Here's a so-called piecewise linear function, right? One way to describe a piecewise linear function, by the way, the canonical way is to say, oh, well, here is to actually have a Voronoi decomposition of Rn, and then in each one to specify the affine function, in each region you specify the affine function. That's sort of the typical way. Actually, for convex..."},{"id":9,"text":"piecewise linear functions is actually a lot, there are many other ways that are sort of better to represent it. One is simply the max of a set of affine functions, right? So there, I give you a bunch of affine functions, and then I simply take the maximum, and that function is going to be convex. That's a convex function. Here's a very interesting one, is the sum, so here's a function on Rn, the sum of, let's say, the four biggest entries. Everybody got that? So that's,"},{"id":10,"text":"It's a weird function. It is, in fact, you can kind of, I mean, it's quite, it's not differentiable. It's not, the derivative doesn't exist at some points, actually. The, let's see, it is, it certainly doesn't have a Hessian, right? It turns out this function is convex, right? And the way to show that is actually pretty straightforward."},{"id":11,"text":"What it is, is it's the maximum of a bunch of functions. This function here, it's all possible sets. Let's do some of the four largest entries. It is all possible subsets, choices of four entries in the vector. And I sum those up, and then I take the maximum. Now how many are there? N choose four. If N is big, that's actually a very big number. Doesn't matter. So this is convex."},{"id":12,"text":"I give you a vector, and I say, what's the sum of the 5.6 largest entries? You tell me what to do. Is it just the sum of the 5 largest entries? It's the sum of the 5 largest entries, plus 0.6 times the 6th largest. Everybody got that? So yeah, when you said take a weighted combination, sure, but that was vague, and I wanted something more specific. Everybody got that? That's a weird function."},{"id":13,"text":"I give you a vector, and I say, what's the sum of the 5.6 largest entries? You tell me what to do. Is it just the sum of the 5 largest entries? It's the sum of the 5 largest entries, plus 0.6 times the 6th largest. Everybody got that? So yeah, when you said take a weighted combination, sure, but that was vague, and I wanted something more specific. Everybody got that? That's a weird function."}],"notes":["本段讲解了分段线性函数的构造方法，特别是通过取多个仿射函数的最大值来构造凸函数。讲者指出，这种构造方式是凸函数的一种典型表示方法，并举例说明了如何通过取向量中最大的几个元素之和来构造凸函数。","讲者进一步解释了如何将这种构造方法推广到非整数的参数，例如取向量中5.6个最大元素之和。这种推广实际上是通过加权平均的方式实现的，即取前5个最大元素之和加上0.6倍的第6个最大元素。","讲者强调了这种函数的非光滑性，即在某些点上导数不存在，因此无法定义Hessian矩阵。然而，这种函数仍然是凸函数，可以通过其作为多个仿射函数最大值的性质来证明其凸性。","讲者还提到，这种构造方法可以应用于任意数量的元素，例如取向量中最大的K个元素之和，其中K可以是任意实数，而不仅仅是整数。这种推广方式通过加权平均的方式实现，使得函数在数学上具有连续性和可操作性。","讲者指出，这种函数虽然在某些点上不可微，但仍然是凸函数，这说明凸函数的定义并不要求函数在所有点上都可微，只要满足凸性条件即可。","最后，讲者通过具体的例子说明了如何计算非整数参数下的最大值之和，强调了加权平均在构造凸函数中的重要性，并指出这种构造方式在数学上是严谨且合理的。"],"formulas":[{"latex":"f(x) = \\max_{i=1}^{m} (a_i^T x + b_i)","symbols":"f(x) 是一个分段线性函数，由多个仿射函数的最大值构成","explanation":"公式正确，使用了最大值符号和仿射函数的表示，符合分段线性函数的定义。","evidence":"piecewise linear functions is actually a lot, there are many other ways that are sort of better to represent it. One is simply the max of a set of affine functions, right? So there, I give you a bunch of affine functions, and then I simply take the maximum, and that function is going to be convex. That's a convex function. Here's a very interesting one, is the sum, so here's a function on Rn, the sum of, let's say, the four biggest entries. Everybody got that? So that's,"},{"latex":"f(x) = \\sum_{i=1}^{k} x_{(i)}","symbols":"f(x) 是向量x中最大的k个元素之和","explanation":"公式正确，使用了求和符号和排序后的元素表示，符合分段线性函数的定义。","evidence":"What it is, is it's the maximum of a bunch of functions. This function here, it's all possible sets. Let's do some of the four largest entries. It is all possible subsets, choices of four entries in the vector. And I sum those up, and then I take the maximum. Now how many are there? N choose four. If N is big, that's actually a very big number. Doesn't matter. So this is convex."},{"latex":"f(x) = \\sum_{i=1}^{5} x_{(i)} + 0.6 x_{(6)}","symbols":"f(x) 是向量x中最大的5.6个元素之和，通过加权平均计算","explanation":"公式正确，使用了加权求和的方式表示非整数个元素的和，符合分段线性函数的定义。","evidence":"This make sense? So this is the sum of the, so people refer to this as the sum of the R largest or the sum of the K largest. And it's a convex function. That's not totally obvious, I think, right? By the way, you can extend this to the sum of the 5.6 largest entries of a vector. What would that mean? What's the sum of the largest 5.6 entries of a vector? Weighted average? Well, weighted average? Yeah, kind of, but let's be more specific."}],"uncertainties":[],"diagram":"none","start":183.13,"end":350.09,"asr_flags":[],"math_clarifications":["公式中的'\\text{max}'和'\\text{sum}'应使用数学符号'\\max'和'\\sum'以符合数学排版规范。"],"raw_segments":[{"start":183.13,"text":"Here's a so-called piecewise linear function, right? One way to describe a piecewise linear function, by the way, the canonical way is to say, oh, well, here is to actually have a Voronoi decomposition of Rn, and then in each one to specify the affine function, in each region you specify the affine function. That's sort of the typical way. Actually, for convex..."},{"start":206.17,"text":"piecewise linear functions is actually a lot, there are many other ways that are sort of better to represent it. One is simply the max of a set of affine functions, right? So there, I give you a bunch of affine functions, and then I simply take the maximum, and that function is going to be convex. That's a convex function. Here's a very interesting one, is the sum, so here's a function on Rn, the sum of, let's say, the four biggest entries. Everybody got that? So that's,"},{"start":235.83,"text":"It's a weird function. It is, in fact, you can kind of, I mean, it's quite, it's not differentiable. It's not, the derivative doesn't exist at some points, actually. The, let's see, it is, it certainly doesn't have a Hessian, right? It turns out this function is convex, right? And the way to show that is actually pretty straightforward."},{"start":263.86,"text":"What it is, is it's the maximum of a bunch of functions. This function here, it's all possible sets. Let's do some of the four largest entries. It is all possible subsets, choices of four entries in the vector. And I sum those up, and then I take the maximum. Now how many are there? N choose four. If N is big, that's actually a very big number. Doesn't matter. So this is convex."},{"start":291.1,"text":"This make sense? So this is the sum of the, so people refer to this as the sum of the R largest or the sum of the K largest. And it's a convex function. That's not totally obvious, I think, right? By the way, you can extend this to the sum of the 5.6 largest entries of a vector. What would that mean? What's the sum of the largest 5.6 entries of a vector? Weighted average? Well, weighted average? Yeah, kind of, but let's be more specific."},{"start":323.68,"text":"I give you a vector, and I say, what's the sum of the 5.6 largest entries? You tell me what to do. Is it just the sum of the 5 largest entries? It's the sum of the 5 largest entries, plus 0.6 times the 6th largest. Everybody got that? So yeah, when you said take a weighted combination, sure, but that was vague, and I wanted something more specific. Everybody got that? That's a weird function."}],"speech_gaps":[],"frame":"../frames/v004/002.webp","frame_time":195.13},{"title":"凸函数的定义与最大值的凸性","segments":[{"id":14,"text":"Guess what? It's convex, right? And you can, you can, it's the same thing, right? That you simply look at all possible combinations of, of, uh, sums of actually you could do in this case, six things with one of them having a weight of 0.6 and the other is having a weight of one, right? And you just sum over all of those. There's a lot of them. Doesn't matter. Each one of those is linear and the maximum of a bunch of linear functions is going to be convex. Okay. So, okay."},{"id":15,"text":"Now this actually generalizes to a supremum, right? So supremum is, if you've had analysis, you know what it is. If you haven't, it's basically the maximum of an infinite number of numbers, right? I mean, and there's some subtleties, right? Like it could be infinity, for example, which is not possible if I have a maximum of a finite number of numbers, right? So if you see soup, you can just replace this with max and you will be just fine."},{"id":16,"text":"Okay, so suppose I have a function of two variables, x and y. By the way, here, x is a vector. Turns out y doesn't even have to be a vector. It could be some weird thing. It could actually be some combinatorial structure like a path and a graph or something like that. It doesn't make any difference. It's anything at all."},{"id":17,"text":"And so you might even think of this as a family of convex functions parameterized by y. That would be a good way to think of this. And it says that if you simply take the maximum over all of these values of y here, that gives you a function, and it's convex. And this is also not too hard to show. Okay, so we can look at some examples here. Here's one."},{"id":18,"text":"Let's see. Oh, this is the support function of a set. So if I have a set here, then the maximum over the set of y transpose x, that is a function of x, that is actually convex. By the way, there are no restrictions whatsoever on the set C. It doesn't have to be convex or anything. Yeah. Script A is actually any set at all."},{"id":19,"text":"Anything at all. That was my point before when I said it doesn't have to be a vector. Sometimes it is a vector, but it doesn't have to be. It could be some weird combinatorial structure. It could be literally it's the maximum over all paths in a graph that would take you from here to here. It doesn't matter. So it could be anything at all. Permutations. Stuff like that. Okay. Here's one. Let's take a set C. Not necessarily convex."}],"notes":["本段讲授了凸函数的定义，指出最大值函数是凸函数。通过多个例子说明，即使在有限或无限个线性函数的最大值中，结果仍然是凸的。同时，提到最大值函数可以推广到无穷多个数的上确界（supremum）。","讲者指出，即使集合C不是凸集，其支持函数仍然是凸函数。支持函数的定义是集合C中所有点与向量y的内积的最大值，这表明支持函数的凸性与集合C的凸性无关。","讲者强调，参数y可以是向量，也可以是其他结构，如图中的路径或排列。这说明凸函数的定义不仅限于向量空间，还可以应用于更广泛的结构。","讲者提到，最大值函数的凸性可以通过分析其定义来证明，即每个线性函数是凸的，而凸函数的最大值仍然是凸的。","讲者指出，即使集合C是任意的，其支持函数仍然是凸函数，这表明凸函数的性质具有广泛的适用性。","讲者通过多个例子说明，最大值函数的凸性不仅适用于有限个函数，也适用于无限个函数，这进一步扩展了凸函数的定义和应用范围。"],"formulas":[],"uncertainties":[],"diagram":"none","start":350.83,"end":521.19,"asr_flags":[],"raw_segments":[{"start":350.83,"text":"Guess what? It's convex, right? And you can, you can, it's the same thing, right? That you simply look at all possible combinations of, of, uh, sums of actually you could do in this case, six things with one of them having a weight of 0.6 and the other is having a weight of one, right? And you just sum over all of those. There's a lot of them. Doesn't matter. Each one of those is linear and the maximum of a bunch of linear functions is going to be convex. Okay. So, okay."},{"start":382.14,"text":"Now this actually generalizes to a supremum, right? So supremum is, if you've had analysis, you know what it is. If you haven't, it's basically the maximum of an infinite number of numbers, right? I mean, and there's some subtleties, right? Like it could be infinity, for example, which is not possible if I have a maximum of a finite number of numbers, right? So if you see soup, you can just replace this with max and you will be just fine."},{"start":410.8,"text":"Okay, so suppose I have a function of two variables, x and y. By the way, here, x is a vector. Turns out y doesn't even have to be a vector. It could be some weird thing. It could actually be some combinatorial structure like a path and a graph or something like that. It doesn't make any difference. It's anything at all."},{"start":431.81,"text":"And so you might even think of this as a family of convex functions parameterized by y. That would be a good way to think of this. And it says that if you simply take the maximum over all of these values of y here, that gives you a function, and it's convex. And this is also not too hard to show. Okay, so we can look at some examples here. Here's one."},{"start":461.56,"text":"Let's see. Oh, this is the support function of a set. So if I have a set here, then the maximum over the set of y transpose x, that is a function of x, that is actually convex. By the way, there are no restrictions whatsoever on the set C. It doesn't have to be convex or anything. Yeah. Script A is actually any set at all."},{"start":493.13,"text":"Anything at all. That was my point before when I said it doesn't have to be a vector. Sometimes it is a vector, but it doesn't have to be. It could be some weird combinatorial structure. It could be literally it's the maximum over all paths in a graph that would take you from here to here. It doesn't matter. So it could be anything at all. Permutations. Stuff like that. Okay. Here's one. Let's take a set C. Not necessarily convex."}],"speech_gaps":[],"frame":"../frames/v004/003.webp","frame_time":362.83},{"title":"凸优化中的距离与最大特征值","segments":[{"id":20,"text":"and we work out here the farthest distance to the set, right? So what is the distance to the farthest point in that set? The usual distance is the smallest. So if someone, the universal definition of the distance of a point to a set, so let's see, here's a set, right? The universal definition of distance, if this is x and this is s,"},{"id":21,"text":"distance of xs it's the minimum distance so it would be something like that okay this is the farthest distance right and so that would be i mean i have no idea what it would be maybe it's who knows it's either this point or that point it's something like either that something like that or maybe something way over here i'm not sure uh anyway that that farthest distance is convex right"},{"id":22,"text":"And by the way, it's not too hard for you to start imagining applications where things like this would come up, right? So this could be a set where you want to provide wireless coverage."},{"id":23,"text":"X is a base station or something like that that you're placing. And then this becomes very interesting because it's the farthest distance from your base station to a place that you're contractually required to cover or something like that. So we're starting to get close to things that are clearly useful in practice. So we'll get to that. Okay, here's a good one. The maximum eigenvalue of a symmetric matrix, right?"},{"id":24,"text":"Now, the maximum eigenvalue of a matrix, that's a really complicated function, right? It's basically you form the determinant of lambda i minus a. That's an nth degree polynomial. You find the roots of the polynomial. In this case, they're all real. And then you take the largest of those roots. And you might know that if the polynomial has degree 5 or larger, there's no formula for the roots of a polynomial like there is for quadratic that you know. Some of you might have seen it for a cubic. Anybody?"},{"id":25,"text":"I'm hoping they don't teach that anymore. I'm super happy to hear that no one knows that. And for a quartic, part of the reason they don't teach it is because you know the quadratic formula. That's totally fine. Cubic, it's like a paragraph. Quartic is a page and a half. And it's not cool. And then, of course, mathematicians sat around and said, well, what is it for the quintic? And then, essentially, it was shown."},{"id":26,"text":"I don't know, 200 years? Yeah, it's coming up on 200 years ago. Actually, just about 200 years ago, I think, it was shown that there's actually no formula for the quintet, so they could stop. Now, of course, that doesn't stop anybody who actually does stuff, because people find eigenvalues and find roots of polynomials like every day, all day long, but they do it numerically. But there's no secret formula for it. Okay, all right."}],"notes":["本段讨论了点到集合的距离概念，强调了通常的距离是点到集合的最小距离，而远距离则是最大距离。这在实际应用中可能涉及无线覆盖等场景，例如基站放置问题。","接着，讲者引入了对称矩阵的最大特征值问题，指出这是一个复杂的函数，通常需要通过求解特征多项式的根来确定最大特征值。","讲者进一步说明了多项式根的求解难度，指出对于五次及以上多项式，没有通用的解析解公式，因此通常采用数值方法求解。","讲者提到数学家在19世纪左右证明了五次多项式没有通用解，但实际应用中人们仍然通过数值方法求解特征值和多项式根。","本段内容涉及凸优化中的距离概念和特征值问题，强调了实际应用中的重要性以及数值方法的必要性。","讲者通过讨论多项式根的求解难度，展示了数学理论与实际计算方法之间的差异，以及数值方法在现代计算中的重要性。"],"formulas":[{"latex":"\\det(\\lambda I - A) = 0","symbols":"特征多项式","explanation":"该公式正确表示了特征多项式的定义，其中 $\\lambda$ 是特征值，$I$ 是单位矩阵，$A$ 是对称矩阵。","evidence":"Now, the maximum eigenvalue of a matrix, that's a really complicated function, right? It's basically you form the determ  of a symmetric matrix, right?"},{"start":621.16,"text":"Now, the maximum eigenvalue of a matrix, that's a really complicated function, right? It's basically you form the determinant of lambda i minus a. That's an nth degree polynomial. You find the roots of the polynomial. In this case, they're all real. And then you take the largest of those roots. And you might know that if the polynomial has degree 5 or larger, there's no formula for the roots of a polynomial like there is for quadratic that you know. Some of you might have seen it for a cubic. Anybody?"},{"start":649.68,"text":"I'm hoping they don't teach that anymore. I'm super happy to hear that no one knows that. And for a quartic, part of the reason they don't teach it is because you know the quadratic formula. That's totally fine. Cubic, it's like a paragraph. Quartic is a page and a half. And it's not cool. And then, of course, mathematicians sat around and said, well, what is it for the quintic? And then, essentially, it was shown."},{"start":674.4,"text":"I don't know, 200 years? Yeah, it's coming up on 200 years ago. Actually, just about 200 years ago, I think, it was shown that there's actually no formula for the quintet, so they could stop. Now, of course, that doesn't stop anybody who actually does stuff, because people find eigenvalues and find roots of polynomials like every day, all day long, but they do it numerically. But there's no secret formula for it. Okay, all right."}],"speech_gaps":[],"frame":"../frames/v004/004.webp","frame_time":533.98},{"title":"凸函数的复合与最大特征值","segments":[{"id":27,"text":"That was a long, weird thing. Okay, all I'm saying is the function, which is the largest eigenvalue of, let's say, a 10 by 10 symmetric matrix, it's a really complicated function, right? And I can't write it. There's no formula for it and blah, blah, blah. But it's convex. And the way to show it is really simple. What kind of function is y transpose xy of x?"},{"id":28,"text":"It's linear, right? So this shows you you really have to be on your toes, right? If I write that thing out, right? So if I write out, what is it? Y transpose XY, right? That's the sum over I and J of YIYJ times XIJ. Now this function is quadratic in Y, but it is linear in X, okay?"},{"id":29,"text":"So that's actually going to be sort of a theme, is that a lot of times you just really have to be on your toes, reminding yourself what's the variable, what's not, all that kind of stuff. And things that don't look linear actually sometimes are. We'll get to examples of that. Okay, so here it is. This thing, y transpose xy, is linear and therefore convex for any value of y."},{"id":30,"text":"It's the linear function of capital X, right? So it's, but now this says, if I take the supremum over everything on the unit sphere, so Y is this, you know, sphere, then this thing is just turns out to be, first of all, that's convex, but it also is the maximum eigenvalue. Okay. So does this make sense? So it's going to get, things are going to slowly get a little bit more complicated and maybe less obvious. Okay. Now we're going to do composition."},{"id":31,"text":"This is actually super important. You'll know why in about five minutes, ten minutes. I'll make a big deal out of it because this is going to be actually a huge part of your life for the next, well, certainly for the next eight weeks it will be, and quite likely long after that. So we'll just start simple. It goes like this. When is the composition of two functions convex? So when is h of g of x?"},{"id":32,"text":"convex right and oh we know one by the way we already know one version of this of composition if g is affine then and h is convex this thing is because that's pre-composition with an affine function that's convex okay we're going to go beyond that now okay we're going to have g be not affine okay so here's the here's the rule it says it says that this composition is convex if"}],"notes":["本段讨论了凸函数的复合问题，强调了在判断复合函数是否为凸函数时需要考虑函数的结构和变量的定义。讲者指出，当函数g是仿射函数且函数h是凸函数时，复合函数h(g(x))是凸函数。这是凸优化中的一个基本性质，但讲者提到接下来将讨论更一般的情况，即g不是仿射函数时的复合函数的凸性条件。","讲者通过一个例子说明了最大特征值函数的凸性。该函数是10x10对称矩阵的最大特征值，虽然其表达式复杂且没有显式公式，但它是凸函数。讲者指出，通过分析函数y^T X y的结构，可以发现其在变量Y上是线性的，因此是凸函数。","讲者强调了在分析函数性质时需要特别注意变量的定义，即哪些是变量，哪些是参数。例如，函数y^T X y在变量Y上是线性的，但在X上是二次的。这种区分对于判断函数的凸性至关重要。","讲者提到，当对变量Y在单位球面上取上确界时，函数y^T X y的结果是矩阵X的最大特征值。这说明了最大特征值函数的凸性，并且该函数在凸优化中具有重要应用。","讲者指出，复合函数的凸性判断是凸优化中的一个核心问题，特别是在处理非仿射函数的复合时。讲者提到，接下来将讨论更一般的情况，即当函数g不是仿射函数时，如何判断h(g(x))是否为凸函数。","讲者强调了复合函数凸性的研究在凸优化中的重要性，并指出这将是一个贯穿课程的重要主题，不仅在接下来的八周内，而且在之后的学习中也会持续出现。"],"formulas":[{"latex":"y^T X y","symbols":"y^T X y 表示向量 y 与矩阵 X 的乘积再与向量 y 的转置相乘","explanation":"公式正确，表示二次型，适用于对称矩阵 X 和向量 y。","evidence":"It's linear, right? So this shows you you really have to be on your toes, right? If I write that thing out, right? So if I write out, what is it? Y transpose XY, right? That's the sum over I and J of YIYJ times XIJ. Now this function is quadratic in Y, but it is linear in X, okay?"}],"uncertainties":["convex right and oh we know one by the way we already know one version of this of composition if g is affine then and h is convex this thing is because that's pre-composition with an affine function that's convex okay we're going to go beyond that now okay we're going to have g be not affine okay so here's the here's the rule it says it says that this composition is convex if"],"diagram":"none","start":698.79,"end":866.72,"asr_flags":[],"math_clarifications":["公式 y^T X y 是二次型，适用于对称矩阵 X 和向量 y。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":698.79,"text":"That was a long, weird thing. Okay, all I'm saying is the function, which is the largest eigenvalue of, let's say, a 10 by 10 symmetric matrix, it's a really complicated function, right? And I can't write it. There's no formula for it and blah, blah, blah. But it's convex. And the way to show it is really simple. What kind of function is y transpose xy of x?"},{"start":725.38,"text":"It's linear, right? So this shows you you really have to be on your toes, right? If I write that thing out, right? So if I write out, what is it? Y transpose XY, right? That's the sum over I and J of YIYJ times XIJ. Now this function is quadratic in Y, but it is linear in X, okay?"},{"start":754.54,"text":"So that's actually going to be sort of a theme, is that a lot of times you just really have to be on your toes, reminding yourself what's the variable, what's not, all that kind of stuff. And things that don't look linear actually sometimes are. We'll get to examples of that. Okay, so here it is. This thing, y transpose xy, is linear and therefore convex for any value of y."},{"start":779.87,"text":"It's the linear function of capital X, right? So it's, but now this says, if I take the supremum over everything on the unit sphere, so Y is this, you know, sphere, then this thing is just turns out to be, first of all, that's convex, but it also is the maximum eigenvalue. Okay. So does this make sense? So it's going to get, things are going to slowly get a little bit more complicated and maybe less obvious. Okay. Now we're going to do composition."},{"start":810.94,"text":"This is actually super important. You'll know why in about five minutes, ten minutes. I'll make a big deal out of it because this is going to be actually a huge part of your life for the next, well, certainly for the next eight weeks it will be, and quite likely long after that. So we'll just start simple. It goes like this. When is the composition of two functions convex? So when is h of g of x?"},{"start":838.92,"text":"convex right and oh we know one by the way we already know one version of this of composition if g is affine then and h is convex this thing is because that's pre-composition with an affine function that's convex okay we're going to go beyond that now okay we're going to have g be not affine okay so here's the here's the rule it says it says that this composition is convex if"}],"speech_gaps":[],"frame":"../frames/v004/005.webp","frame_time":710.79},{"title":"凸函数的复合性质","segments":[{"id":33,"text":"G is convex. H is convex. And I'm just going to be very informal and just say increasing. So an increasing convex function of a convex function is convex. Now, the H tilde means it has to be non-decreasing this extended value extension. And that's not a weird technicality. It's actually a real thing."},{"id":34,"text":"The rough way to think of it is increasing function of a convex function is convex. Most famous example, if g is convex, then exp g of x is convex. So e to the x squared is convex. Period. Why? Because exp is convex and increasing. And what this says is convex increasing of a convex function is convex. Here's one."},{"id":35,"text":"It also works this way. If h is decreasing, if the outer function is decreasing, if it's convex and decreasing, then if g is concave, this composition is convex. By the way, you can get that from the other one by substituting a minus with g and stuff like that. So that would do that. So here's an example. 1 over g of x."},{"id":36,"text":"The inverse of a positive concave function is convex. Okay? So, I mean, you could check some things like, you know, let's say 1 over square root x. Square root x is, well, let's limit it to, it doesn't matter, is non-negative and so on. So 1 over that is actually convex. Okay? And the reason is, the function 1 over x is,"},{"id":37,"text":"Convex and decreasing, right? So it looks like this. That's 1 over x, right? It's both convex and... So actually, please note that all of these arguments involve basically the signs of the zeroth first and second derivative. Because I'm talking increasing and decreasing is the sign of the first derivative, if it's differentiable."},{"id":38,"text":"right convexity and concavity that's the sign of the second derivative again if it's differentiable but this is not a bad way to think of it okay and then we also sometimes say well something has to be well well okay here g had to be positive otherwise one over x at least in this class doesn't make sense right so okay okay so uh that that's these are the composition rules and lots of ways it's actually very short to just prove it directly"}],"notes":["本段讲解了凸函数的复合性质，特别是当外层函数是递增或递减时，与内层函数的凸性或凹性之间的关系。例如，当外层函数是递增且凸的，内层函数是凸的，那么它们的复合函数也是凸的。同样，当外层函数是递减且凸的，内层函数是凹的，复合函数仍然是凸的。","讲者通过具体例子说明了这些性质，如指数函数 $ e^{g(x)} $，当 $ g(x) $ 是凸函数时，结果也是凸的。此外，还提到 $ 1/g(x) $ 的情况，当 $ g(x) $ 是正的凹函数时，其倒数是凸的。","讲者指出，这些结论的推导主要依赖于函数的一阶和二阶导数的符号。递增或递减对应于一阶导数的符号，而凸性或凹性则对应于二阶导数的符号。","讲者还提到，当处理 $ 1/g(x) $ 时，必须确保 $ g(x) $ 是正的，否则在某些情况下（如 $ 1/x $）可能不适用或导致数学上的问题。","讲者强调，这些复合规则可以通过直接证明来验证，而无需依赖复杂的定理。这为理解凸函数的性质提供了直观的思路。","讲者最后提到，这些规则在凸优化中非常重要，因为它们帮助我们判断复合函数的凸性，从而在优化问题中应用这些性质。"],"formulas":[{"latex":"e^{g(x)}","symbols":"指数函数","explanation":"保持原式，指数函数 $ e^{g(x)} $ 是一个凸函数，当 $ g(x) $ 是凸函数时，$ e^{g(x)} $ 也是凸函数。","evidence":"The rough way to think of it is increasing function of a convex function is convex. Most famous example, if g is convex, then exp g of x is convex. So e to the x squared is convex. Period. Why? Because exp is convex and increasing. And what this says is convex increasing of a convex function is convex. Here's one."},{"latex":"\\frac{1}{g(x)}","symbols":"倒数函数","explanation":"保持原式，倒数函数 $ \\frac{1}{g(x)} $ 是一个凸函数，当 $ g(x) $ 是正的凹函数时，$ \\frac{1}{g(x)} $ 是凸函数。","evidence":"The inverse of a positive concave function is convex. Okay? So, I mean, you could check some things like, you know, let's say 1 over square root x. Square root x is, well, let's limit it to, it doesn't matter, is non-negative and so on. So 1 over that is actually convex. Okay? And the reason is, the function 1 over x is,"}],"uncertainties":["right convexity and concavity that's the sign of the second derivative again if it's differentiable but this is not a bad way to think of it okay and then we also sometimes say well something has to be well well okay here g had to be positive otherwise one over x at least in this class doesn't make sense right so okay okay so uh that that's these are the composition rules and lots of ways it's actually very short to just prove it directly"],"diagram":"none","start":867.22,"end":1033.15,"asr_flags":[],"math_clarifications":["在原文中，讨论了凸函数的组合性质，包括指数函数和倒数函数的凸性。这些函数的凸性依赖于其内部函数的性质和导数的符号。"],"raw_segments":[{"start":867.22,"text":"G is convex. H is convex. And I'm just going to be very informal and just say increasing. So an increasing convex function of a convex function is convex. Now, the H tilde means it has to be non-decreasing this extended value extension. And that's not a weird technicality. It's actually a real thing."},{"start":892.75,"text":"The rough way to think of it is increasing function of a convex function is convex. Most famous example, if g is convex, then exp g of x is convex. So e to the x squared is convex. Period. Why? Because exp is convex and increasing. And what this says is convex increasing of a convex function is convex. Here's one."},{"start":923.6,"text":"It also works this way. If h is decreasing, if the outer function is decreasing, if it's convex and decreasing, then if g is concave, this composition is convex. By the way, you can get that from the other one by substituting a minus with g and stuff like that. So that would do that. So here's an example. 1 over g of x."},{"start":953.1,"text":"The inverse of a positive concave function is convex. Okay? So, I mean, you could check some things like, you know, let's say 1 over square root x. Square root x is, well, let's limit it to, it doesn't matter, is non-negative and so on. So 1 over that is actually convex. Okay? And the reason is, the function 1 over x is,"},{"start":982.4,"text":"Convex and decreasing, right? So it looks like this. That's 1 over x, right? It's both convex and... So actually, please note that all of these arguments involve basically the signs of the zeroth first and second derivative. Because I'm talking increasing and decreasing is the sign of the first derivative, if it's differentiable."},{"start":1006.42,"text":"right convexity and concavity that's the sign of the second derivative again if it's differentiable but this is not a bad way to think of it okay and then we also sometimes say well something has to be well well okay here g had to be positive otherwise one over x at least in this class doesn't make sense right so okay okay so uh that that's these are the composition rules and lots of ways it's actually very short to just prove it directly"}],"speech_gaps":[],"frame":"../frames/v004/006.webp","frame_time":879.22},{"title":"凸函数的复合性质","segments":[{"id":39,"text":"And with no assumptions on differentiability or anything. But I think a very good way to think of it, the way I think of it, or my mnemonic for it, if I forget this, I guess I don't forget it. But if I were to forget it, I would simply go back to something like this. You just assume everything is in R1. Assume everything is differentiable. And then you literally just take..."},{"id":40,"text":"you know, go back to your calculus class, differentiate this once, you get h prime of g of x times g prime of x, differentiate it a second time, and you get this thing here. And now we look at that formula, and you take a look at it. And let's do the second one. How about this one? Okay, so, and by the way, these assumptions are going to tell us about the signs of derivatives of order 0, 1, or 2. So let's see how this works. So let's say, let's look at this one. g is concave."},{"id":41,"text":"Well, let's see what that means. Oh, that means that's a negative number, right? I'm going to be, I'm going to be a little, I'm informal, right? I'm not going to distinguish between positive and non-negative and all that stuff. So, so this is negative, okay? Let's look at this. So let's see, h prime of g of x. Well, let's see, let's see what, h is non-increasing, is decreasing, right? So that means h prime of g of x, that's also like less than or equal to zero. And now we're going to use a very deep mathematical fact. You ready?"},{"id":42,"text":"The product of two numbers, each of which is less than or equal to zero, is bigger than or equal to zero. Everybody got that? Extremely deep mathematical principle, right? So literally we're using the dumbest sine arithmetic for multiplication. So this term, with these assumptions here, this term, bigger than or equal to zero."},{"id":43,"text":"Well, any square of anything is going to be non-negative, right? And then we multiply that by h prime prime of g of x. But we're assuming h is convex. That means that h prime prime is non-negative. Everybody got it?"},{"id":44,"text":"So once again, deep mathematical principle, the product of a non-negative number times a square of another number, that's going to be non-negative. And now we're going to use an even more basic fact, which is the sum of two non-negative things is non-negative. Everybody got that? So all of this is non-negative. Oh, but that's f prime prime. That's exactly what it means for f to be convex. Did everybody follow that? I mean, it's kind of a dumb thing, but I wanted to go through it. It doesn't hurt to go through it. Yes?"},{"id":45,"text":"One direction or does it hold the other way as well? It does not hold the other way. So that's a very good question, right? If this composition rule, if the hypothesis of the composition rule holds, you can conclude something is convex. I mean, there's a similar one for concave, right? You can have cases where the composition rule does not hold and yet the function is convex."}],"notes":["本段讲解了凸函数复合的性质，通过具体例子说明了当两个函数满足一定条件时，其复合函数也是凸函数。首先，假设g是凹函数，这意味着其一阶导数为负，二阶导数为负。接着，h是凸函数，其二阶导数为非负。通过计算复合函数f = h(g(x))的二阶导数，得出其非负，从而证明f是凸函数。","在推导过程中，使用了多个数学原理，包括导数的链式法则、乘积的符号性质以及平方的非负性。这些原理帮助确定了复合函数的凸性。例如，两个非正数的乘积为非负数，而平方数的非负性与凸函数的二阶导数非负性相结合，进一步验证了复合函数的凸性。","课堂中还讨论了复合规则的方向性问题，即如果满足复合规则的假设，可以得出函数是凸的，但反过来不一定成立。这说明了复合规则的单向性，即满足条件可以推出结论，但结论不一定能推出条件。","通过具体的例子和数学推导，课程强调了凸函数复合的条件和结果之间的关系。这有助于理解在优化问题中，如何利用函数的凸性来保证解的唯一性和全局最优性。","课堂中提到的数学原理，如导数的链式法则和乘积的符号性质，是理解凸函数复合性质的基础。这些原理在数学分析和优化理论中具有广泛的应用。","最后，课程指出，虽然复合规则可以推出函数的凸性，但并非所有凸函数都能通过复合规则得到。这说明了在实际应用中，需要结合具体函数的性质来判断其凸性。"],"formulas":[{"latex":"f''(x) = h''(g(x)) [g'(x)]^2 + h'(g(x)) g''(x)","symbols":"f''(x) 表示复合函数 f = h(g(x)) 的二阶导数","explanation":"公式正确表达了复合函数的二阶导数。根据链式法则，复合函数的二阶导数由两部分组成：第一部分是 h''(g(x)) 乘以 [g'(x)]^2，第二部分是 h'(g(x)) 乘以 g''(x)。公式中的符号和数学类型均符合数学规范，无需修改。","evidence":"So once again, deep mathematical principle, the product of a non-negative number times a square of another number, that's going to be non-negative. And now we're going to use an even more basic fact, which is the sum of two non-negative things is non-negative. Everybody got that? So all of this is non-negative. Oh, but that's f prime prime. That's exactly what it means for f to be convex. Did everybody follow that? I mean, it's kind of a dumb thing, but I wanted to go through it. It doesn't hurt to go through it. Yes?"}],"uncertainties":[],"diagram":"none","start":1034.15,"end":1209.55,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均符合数学规范，无需修改。"],"raw_segments":[{"start":1034.15,"text":"And with no assumptions on differentiability or anything. But I think a very good way to think of it, the way I think of it, or my mnemonic for it, if I forget this, I guess I don't forget it. But if I were to forget it, I would simply go back to something like this. You just assume everything is in R1. Assume everything is differentiable. And then you literally just take..."},{"start":1056.93,"text":"you know, go back to your calculus class, differentiate this once, you get h prime of g of x times g prime of x, differentiate it a second time, and you get this thing here. And now we look at that formula, and you take a look at it. And let's do the second one. How about this one? Okay, so, and by the way, these assumptions are going to tell us about the signs of derivatives of order 0, 1, or 2. So let's see how this works. So let's say, let's look at this one. g e holds, you can conclude something is convex. I mean, there's a similar one for concave, right? You can have cases where the composition rule does not hold and yet the function is convex."}],"speech_gaps":[],"frame":"../frames/v004/007.webp","frame_time":1046.15},{"title":"凸函数的复合规则","segments":[{"id":46,"text":"Okay, so that's an example, right? We'll see many examples of that, right? So, okay, everybody got this? Okay, and here's the main one, and actually there's only just one variation on this, and then it's the one that will be a very important part of your life."},{"id":47,"text":"So here it is. It says, now what I'm going to do is I'm going to have h has multiple arguments. So h is a convex function on vector arguments, right? And g will have, let's say, k entries. g of x I'm writing for the arguments. These are the entries of g, g1, g2, up to gx, right? And so here's your composition."},{"id":48,"text":"And let's see what the rule is this. It says that f is convex provided the outer calling function is convex. And then there's two statements here. Although in fact, the stronger statements you can mix them. But here it is. It says, here's one case. It says that h is increasing in all the arguments. And these are all convex."},{"id":49,"text":"Here's another one. H is decreasing in all of the arguments, and these are all concave. Oh, by the way, here's another one to round it out. H, no conditions on monotonicity on H, but all of the arguments are affine. Everybody got that? Okay, so now it's time for me to tell you the full story. It's actually, I think we have a homework problem on it. I mean, it should honestly have been a problem in the book, but too bad. Then it's this."},{"id":50,"text":"The most general form says this function is convex provided, now I'll say it, you're going to see this, you're going to live and breathe it for that matter, but it's going to go like this. It says provided H is convex and, now I'm going to iterate over the arguments. For each argument, either A, the argument is affine, in which case there's no monotonicity requirement on H at all. B,"},{"id":51,"text":"that argument is convex and H is increasing in that argument. Or C, the argument is concave and H is decreasing in that argument. Okay? So it just mixes, you can just freely mix and match these things. Affine, convex, concave. And monotonicity. Everybody got it? So actually, here's what's weird. That one rule subsumes like basically all the others. Like, let's give a really weird pedantic long proof."}],"notes":["本段讲解了凸函数复合的规则，特别是当外层函数是凸函数时，如何通过内层函数的性质（如单调性、仿射性、凸性或凹性）来判断复合函数是否为凸函数。讲者提到，当外层函数是凸函数时，内层函数的每个参数可以是仿射、凸或凹的，同时外层函数在该参数上是单调递增或递减的，从而保证复合函数的凸性。","讲者强调，这些规则可以混合使用，即对于每个参数，可以选择不同的条件（仿射、凸或凹）和单调性要求，从而构成更一般的复合函数凸性判断方法。这种混合使用的方式使得规则更加灵活，适用于各种情况。","讲者指出，这些规则实际上可以涵盖之前提到的所有情况，包括当外层函数是凸函数且内层函数的参数是仿射、凸或凹的情况。因此，只需记住这一条规则，就可以处理所有可能的复合函数凸性问题。","讲者提到，这些规则在课程中非常重要，甚至可能出现在作业题中。这表明这些规则是凸优化中的核心内容，需要学生熟练掌握。","讲者还提到，这些规则的证明过程可能非常繁琐，但其结论是明确的，即通过外层函数的凸性和内层函数的参数性质，可以判断复合函数的凸性。","讲者最后提到，这些规则的通用性非常强，可以涵盖所有之前提到的特殊情况，因此只需记住这一条规则即可。这表明这些规则是凸优化中的关键概念，需要学生深入理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1210.57,"end":1367.01,"asr_flags":[],"raw_segments":[{"start":1210.57,"text":"Okay, so that's an example, right? We'll see many examples of that, right? So, okay, everybody got this? Okay, and here's the main one, and actually there's only just one variation on this, and then it's the one that will be a very important part of your life."},{"start":1229.28,"text":"So here it is. It says, now what I'm going to do is I'm going to have h has multiple arguments. So h is a convex function on vector arguments, right? And g will have, let's say, k entries. g of x I'm writing for the arguments. These are the entries of g, g1, g2, up to gx, right? And so here's your composition."},{"start":1254.09,"text":"And let's see what the rule is this. It says that f is convex provided the outer calling function is convex. And then there's two statements here. Although in fact, the stronger statements you can mix them. But here it is. It says, here's one case. It says that h is increasing in all the arguments. And these are all convex."},{"start":1280.16,"text":"Here's another one. H is decreasing in all of the arguments, and these are all concave. Oh, by the way, here's another one to round it out. H, no conditions on monotonicity on H, but all of the arguments are affine. Everybody got that? Okay, so now it's time for me to tell you the full story. It's actually, I think we have a homework problem on it. I mean, it should honestly have been a problem in the book, but too bad. Then it's this."},{"start":1308.81,"text":"The most general form says this function is convex provided, now I'll say it, you're going to see this, you're going to live and breathe it for that matter, but it's going to go like this. It says provided H is convex and, now I'm going to iterate over the arguments. For each argument, either A, the argument is affine, in which case there's no monotonicity requirement on H at all. B,"},{"start":1337.83,"text":"that argument is convex and H is increasing in that argument. Or C, the argument is concave and H is decreasing in that argument. Okay? So it just mixes, you can just freely mix and match these things. Affine, convex, concave. And monotonicity. Everybody got it? So actually, here's what's weird. That one rule subsumes like basically all the others. Like, let's give a really weird pedantic long proof."}],"speech_gaps":[],"frame":"../frames/v004/008.webp","frame_time":1222.57},{"title":"凸函数的和与最大值的凸性证明","segments":[{"id":52,"text":"that the sum of k convex functions is convex, okay? Now, first of all, that's obvious, but let's prove it using this. So I'm going to show that this actually subsumes all the rules you've seen so far. So let's do that, right? So here's my... The way I'm going to do that is I'm going to make up a new function. It's going to be... So h of, let's say, z1 up to zk is going to be this. It's going to be z1. I'm going to add them up, okay? That's my function."},{"id":53,"text":"Somebody tell me about curvature of that function. Is it convex? Is it concave? It's both. But I'm doing convex, so it's convex. Now tell me about monotonicity of this function in its arguments. That means if I increase like x1, does that function go up? Z1, does that function go up or down? So it's monotone in all the arguments. Is monotone increasing?"},{"id":54,"text":"Here, by the way, that's actually true. It's not just non-decreasing. It's actually increasing. Everybody got it? Okay. Now, I'm going to apply this. I mean, this is ridiculous, but I'm going to apply this fancy theorem. And it says, therefore, if I have, you know, g1 of x up to gk of x, and if these are all convex, then we conclude, using this thing here, that this thing is convex. But that's the sum."},{"id":55,"text":"Okay? So that's a pedantic, long-winded way to show that the sum of convex functions is convex using the composition rule. We could do it for max. Let's do that just for fun, just to show you that it's the same thing. Here's my function. Okay? So let's talk about H. Tell me about curvature of H. Convex? The max of a bunch of... Yeah, it's convex. Okay? Is it concave?"},{"id":56,"text":"So it's non-increasing. It doesn't have to go up, right? Unless I grab one of the things that's actually active at the max and then I push it up, then the max goes up. Everybody got that?"},{"id":57,"text":"So it's non-increasing. It doesn't have to go up, right? Unless I grab one of the things that's actually active at the max and then I push it up, then the max goes up. Everybody got that? So, okay. So that, again, this thing applies. And so I didn't really need to show you, you know, I guess if you wanted a minimalist thing, I didn't have to tell you about the sum of convex functions and the max and things like that, right? So, but I think humans think of it more like these things and you sneak up to it, right? So, okay. Everybody."}],"notes":["本段讲解了凸函数的和的凸性证明，通过构造一个新函数，将多个凸函数相加，利用凸函数的性质证明其和仍然是凸函数。讲者指出，该函数的曲率是凸的，且其单调性为严格递增。","讲者进一步讨论了最大值函数的凸性，指出当函数个数大于1时，最大值函数是凸的，但不是凹的。同时，讲者强调了最大值函数在每个参数上的单调性，即非递减，但并非严格递增。","讲者指出，虽然可以通过直接的定义证明这些性质，但通过使用凸函数的组合规则（如和与最大值）可以更系统地理解这些性质。讲者还提到，人类通常会通过这些基本性质逐步推导出更复杂的结论。","讲者强调了凸函数的和和最大值的凸性，指出这些性质是凸优化中的基本工具，有助于理解更复杂的优化问题。讲者还提到，虽然这些性质看似简单，但通过组合规则可以更深入地理解它们。","讲者通过构造函数和分析其单调性和曲率，展示了如何利用凸函数的性质来证明更复杂的函数的凸性。这种系统的方法有助于理解凸优化中的基本概念。","讲者指出，虽然可以通过直接的定义证明这些性质，但通过组合规则可以更系统地理解这些性质。讲者还提到，人类通常会通过这些基本性质逐步推导出更复杂的结论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1367.8,"end":1534.81,"asr_flags":[],"raw_segments":[{"start":1367.8,"text":"that the sum of k convex functions is convex, okay? Now, first of all, that's obvious, but let's prove it using this. So I'm going to show that this actually subsumes all the rules you've seen so far. So let's do that, right? So here's my... The way I'm going to do that is I'm going to make up a new function. It's going to be... So h of, let's say, z1 up to zk is going to be this. It's going to be z1. I'm going to add them up, okay? That's my function."},{"start":1397.23,"text":"Somebody tell me about curvature of that function. Is it convex? Is it concave? It's both. But I'm doing convex, so it's convex. Now tell me about monotonicity of this function in its arguments. That means if I increase like x1, does that function go up? Z1, does that function go up or down? So it's monotone in all the arguments. Is monotone increasing?"},{"start":1426.06,"text":"Here, by the way, that's actually true. It's not just non-decreasing. It's actually increasing. Everybody got it? Okay. Now, I'm going to apply this. I mean, this is ridiculous, but I'm going to apply this fancy theorem. And it says, therefore, if I have, you know, g1 of x up to gk of x, and if these are all convex, then we conclude, using this thing here, that this thing is convex. But that's the sum."},{"start":1453.37,"text":"Okay? So that's a pedantic, long-  later, you will have what you want. So, okay. Yes? Where? No, that's correct. Yeah. So let me explain why. Oh, sorry. That's a very good point. I didn't say this. So by flipping the sign here, you get a similar composition theorem for concavity."},{"start":1729.95,"text":"Because something is convex if minus f, something is concave if its negative is convex. Then you apply this rule. But when I negate a function, all sorts of weird stuff happens, like its monotonicity switches. If it was increasing before, now it's decreasing. And its curvature switches. Yeah, so this one is using an analogous composition rule for concave."},{"start":1756.94,"text":"So let me explain that. A concave increasing function of a concave function is concave. A convex increasing function of a convex function is convex. That's for when you have one argument. Then we can do the case with multiple arguments. If you want, let's actually just do one for fun that's not obvious. So here's a function."},{"start":1786.4,"text":"This is x squared over y, and the domain is going to be y positive. So this is the simplest function that most people on the streets would not know is convex. So this is convex. Let's talk about monotonicity. Is it monotone in x? That's its first argument. Is it? I don't think so. Because x squared, it actually has a negative slope if x is negative."},{"start":1821.48,"text":"Yeah, by the way, if x is non-negative, then this is monotone increasing in x. Okay? Everybody? Okay. What is its monotonicity in y? It's what? It's decreasing. Okay. So what this means is, if I want to satisfy those rules, it says I can replace x with an affine expression."}],"speech_gaps":[],"frame":"../frames/v004/011.webp","frame_time":1710.6},{"title":"凸函数的构造与性质","segments":[{"id":69,"text":"That's the first thing I can do. And for y, I can replace it with a concave expression. So the following is a con... I could do something like this. Here you go. Maybe I'll use z for this, right? And then x fo concave? Yeah, it is. How about square root of x3? That's concave. And in fact, if you want to get real fancy about it, you'd say, oh, that's the square root function."}],"notes":["本段主要讲解如何通过替换变量和构造函数来判断函数的凸性。讲者提到，对于函数y，可以替换为一个凹函数，例如最小值函数或平方根函数。同时，讲者指出，直接通过Hessian矩阵判断凸性并不总是可行，因为函数可能不可微，或者计算Hessian矩阵非常复杂。","讲者强调，构造凸函数时，可以使用组合规则，例如将一个凹函数与一个仿射函数组合，从而得到一个凸函数。例如，讲者提到，平方根函数是凹函数，而常数2也是凹函数，因此它们的组合可以用于构造新的函数。","讲者还指出，判断函数是否凸或凹时，不能简单地依赖于函数的单调性或单调递增/递减性，而是需要更深入的分析。例如，讲者提到，一个函数可能既不是单调的，也不是递增或递减的，但仍然可以是凸函数。","讲者通过具体的例子说明了如何应用凸函数的构造规则。例如，讲者提到，可以通过将一个函数的某些部分替换为凹函数，从而构造出一个凸函数。这种构造方法在凸优化中非常重要，因为它可以帮助我们处理复杂的优化问题。","讲者还提到，构造凸函数时，需要特别注意函数的可微性。如果函数不可微，那么直接使用Hessian矩阵的方法就不可行。因此，讲者建议使用其他方法，例如通过组合规则来判断函数的凸性。","最后，讲者指出，构造凸函数的过程需要耐心和细致的分析。例如，讲者提到，构造一个凸函数可能需要多次尝试和调整，直到找到合适的组合规则。这种过程在凸优化的学习和应用中非常常见。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1852.33,"end":2020.76,"asr_flags":[],"raw_segments":[{"start":1852.33,"text":"That's the first thing I can do. And for y, I can replace it with a concave expression. So the following is a con... I could do something like this. Here you go. Maybe I'll use z for this, right? And then x for my other one. Okay, so this is y. So I'll have this one. Here's a function. Ready? 1 transpose x squared, right? That's the sum of the entries of x then squared, divided by..."},{"start":1882.72,"text":"I don't know, let's say the minimum of 2 and square root of y. In fact, you know what? Let me do something even weirder. Let me make this the square root of x3, its third entry. There you go. There's some sick function on our end."},{"start":1908.11,"text":"I mean, you agree that it's a very weird function, right? But it's completely clear what it is. I have no idea where it might come up. This says, sum the entries of the vector and square it, and divide it by the minimum of 2 and the square root of the third entry of the vector. Everybody got that? Oh, and I'll have, in this case, it doesn't matter, but I'll just say this. Okay? Everybody got the function? Now, if I asked you, is that convex or concave, let me tell you some things you would not want to do."},{"start":1936.59,"text":"You say, well, here's x and here's y and here's theta between 0 and 1, and then start arguing. You don't want to do that. You don't want to take a Hessian. For many, many reasons. Number one, this is not differentiable. Okay? That's number one. Number two, even if it were, you don't want to take a Hessian. Trust me. Everybody cool? Okay. And now we're going to show that this is convex just using this rule over here. So..."},{"start":1962.95,"text":"Let's walk through that. How does that look? So this is the kind of thing you will be doing this for eight weeks, minimum. So it goes like this. You're going to say, well, let's see. You look at this function. It's convex. We know that. It is neither monotone nor increasing nor decreasing in z. But I can put an affine function there. So this is perfectly cool."},{"start":1990.94,"text":"This function is decreasing in y, so I can substitute for y a concave function. Now, is this concave? Let's again use the composition. Let's just go slow with composition rules. Is the constant 2 concave? Yeah, it is. How about square root of x3? That's concave. And in fact, if you want to get real fancy about it, you'd say, oh, that's the square root function."}],"speech_gaps":[],"frame":"../frames/v004/012.webp","frame_time":1864.33},{"title":"凸函数的构造性分析","segments":[{"id":75,"text":"precomposed with a linear operator, a linear function of x, which simply pulls out the third entry. Everybody got that? I mean, that's if you want to be real fancy. Or you can just say, no, it's concave. It's fine. Everybody got me? Okay. How about the minimum of two concave functions? Well, I should have said this earlier. The max of two convex functions is convex. Turns out the min of two concave functions is concave. And you can verify that."},{"id":76,"text":"with rules like this one, right? Which, you know, you probably know or something like that. That the min of, you know, a, b is something like minus the max of minus a and minus b. I hope I got that right, but it feels right. If that's not right, something really close to it is right. And that's what I meant."},{"id":77,"text":"I don't have any problem with that, okay? Everybody good on this? Okay, so basically then by the composition rule, this crazy function here is convex, right? And basically, if you didn't know about this, I mean, all I would say is best of luck to you to recognize that function as convex or to show it. Everybody got it? So what we're doing here, we refer to this as constructive convex analysis."},{"id":78,"text":"That we look at a function or an expression and what we do is we try to build it. It's constructive. You literally, you can start at the leaves of the expression tree. Like this thing and that thing. And then actually literally look at the expression tree, walk up the tree and label every node as either convex, concave, maybe affine. And then just check if this rule applies at every node in the expression tree."},{"id":79,"text":"Okay, this is all this. I know you're seeing this only for the first time, but you will see this so many times it's not even funny. Yes? Why is x squared over y not monotonically increasing in x? Ah, because what if x is, well, let's take, here, I'll show you. Let's take y equals 1, and I'm going to take z equals minus 1, and this would evaluate to the number 1, and now take z equals 0."}],"notes":["本段讲解了凸函数的构造性分析方法，强调通过表达式树的构建来判断函数的凸性。讲者指出，可以通过从表达式的叶子节点开始，逐步向上标记每个节点为凸、凹或仿射，从而验证整个表达式的凸性。这种方法被称为构造性凸分析。","讲者提到，对于两个凹函数的最小值，其结果仍然是凹函数，这与两个凸函数的最大值是凸函数类似。讲者还提到，可以通过将最小值转换为最大值的负数来验证这一性质，即min(a, b) = -max(-a, -b)。","讲者指出，虽然这种转换方法在研究生课程中可以使用，但在本科生课程中可能不太合适。这表明在教学中需要根据学生的背景调整讲解的深度。","讲者通过一个例子说明了x²/y不是关于x单调递增的函数。他通过取y=1，x=-1和x=0的情况来展示，当x从负数变为零时，x²/y的值从1变为0，说明函数在x增加时并不总是增加。","讲者强调，这种构造性分析方法在实际中非常常见，学生需要熟练掌握。这表明在课程中，学生需要通过大量练习来理解和应用这些规则。","讲者通过具体的例子和反例来说明函数的单调性问题，这有助于学生理解凸函数的性质以及如何判断函数的凸性。"],"formulas":[],"uncertainties":["x squared over y"],"diagram":"none","start":2022.14,"end":2172.48,"asr_flags":[],"math_clarifications":["公式 \\min(a, b) = -\\max(-a, -b) 在数学上是正确的，但需要明确其适用条件。由于原始文本中并未提供足够的上下文来确认该等式的正确性，因此将其移除以避免误导。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2022.14,"text":"precomposed with a linear operator, a linear function of x, which simply pulls out the third entry. Everybody got that? I mean, that's if you want to be real fancy. Or you can just say, no, it's concave. It's fine. Everybody got me? Okay. How about the minimum of two concave functions? Well, I should have said this earlier. The max of two convex functions is convex. Turns out the min of two concave functions is concave. And you can verify that."},{"start":2049.34,"text":"with rules like this one, right? Which, you know, you probably know or something like that. That the min of, you know, a, b is something like minus the max of minus a and minus b. I hope I got that right, but it feels right. If that's not right, something really close to it is right. And that's what I meant. How about that? Okay, so you can't say that in an undergrad class. I can say that in a grad class for sure."},{"start":2080.73,"text":"I don't have any problem with that, okay? Everybody good on this? Okay, so basically then by the composition rule, this crazy function here is convex, right? And basically, if you didn't know about this, I mean, all I would say is best of luck to you to recognize that function as convex or to show it. Everybody got it? So what we're doing here, we refer to this as constructive convex analysis."},{"start":2108.99,"text":"That we look at a function or an expression and what we do is we try to build it. It's constructive. You literally, you can start at the leaves of the expression tree. Like this thing and that thing. And then actually literally look at the expression tree, walk up the tree and label every node as either convex, concave, maybe affine. And then just check if this rule applies at every node in the expression tree."},{"start":2144.17,"text":"Okay, this is all this. I know you're seeing this only for the first time, but you will see this so many times it's not even funny. Yes? Why is x squared over y not monotonically increasing in x? Ah, because what if x is, well, let's take, here, I'll show you. Let's take y equals 1, and I'm going to take z equals minus 1, and this would evaluate to the number 1, and now take z equals 0."}],"speech_gaps":[],"frame":"../frames/v004/013.webp","frame_time":2034.14},{"title":"凸优化中的单调性与部分最小化","segments":[{"id":80,"text":"Well, now it evaluates to zero. Uh-oh, because z just went up and the function value went down. There you go. Now, if I go from zero to one, it goes up. By the way, it's a very good point. Since we're doing sine arithmetic on the zeroth first and second derivative, suppose I told you ahead of time that z was non-negative, right? If you knew z was non-negative,"},{"id":81,"text":"then you could actually classify this as being increasing in the argument z. Everybody got that? So that's sign-dependent monotonicity. Everybody? Okay, so that is the idea. Okay."},{"id":82,"text":"So there'll be a lot of stuff on that. This is actually the basis of actually pretty much all software for convex optimization. It's based on something called disciplined convex programming, which means absolutely nothing more than everything you write down can be verified using that one composition rule. That's it. So in some sense, there's only one rule you need to know, which is the composition rule, and now you're good to go. Okay."},{"id":83,"text":"All right, we'll look at a bunch of other things. And there are some subtleties. So first, remember that if I have a function of two variables, and I take the maximum over one of the variables. We did that before. It was the supremum over y. And the fact is, y didn't even have to be a vector. It could be anything at all. So the maximum..."},{"id":84,"text":"of f of x, y, where f is convex and x for each y is convex. What's cool is the same is true for a minimum, but the conditions are different and not totally straightforward. So here's what they are. It says if f of x and y is jointly convex in x and y, and then I minimize over y, over a convex set, that's this thing."},{"id":85,"text":"then this thing is convex. And some people call this, oh, a great name for this is partial minimization. Because what it means is you have a function of two variables, they're vectors, and I minimize over one. So that's called partial. Yeah, I don't minimize over everything. It's called partial. So you would say something like this. Partial minimization preserves convexity. Okay? So by the way, this would be the principle behind, for example, dynamic programming."}],"notes":["本段讲解了函数单调性的概念，特别是符号依赖单调性。当变量z为非负数时，函数在z的增加下可能呈现递增趋势，这取决于函数的导数符号。这种单调性依赖于变量的符号，因此称为符号依赖单调性。","接着，课程介绍了凸优化软件的基础，即所谓的‘纪律性凸规划’（disciplined convex programming）。其核心思想是，所有可写下的表达式都必须满足一个基本的组合规则，即通过该规则可以验证其凸性。这表明，掌握这一组合规则就足以进行凸优化。","随后，课程讨论了函数在两个变量上的最大值和最小值的性质。当函数在两个变量上是凸的时，对其中一个变量取最大值或最小值后，结果仍然是凸的。这种性质被称为部分最小化（partial minimization），它保持了凸性。","部分最小化是凸优化中的一个重要概念，它在动态规划等算法中具有应用基础。通过部分最小化，可以将多变量问题简化为单变量问题，从而保持问题的凸性。","课程还提到，当函数在两个变量上是联合凸的时，对其中一个变量取最小值后，结果仍然是凸的。这与最大值的情况不同，其条件更为复杂。","最后，课程强调了凸优化中的一些微妙之处，例如在处理多变量函数时，需要特别注意变量的取值范围和函数的凸性条件。这些细节对于正确应用凸优化方法至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2173.15,"end":2334.8,"asr_flags":[],"raw_segments":[{"start":2173.15,"text":"Well, now it evaluates to zero. Uh-oh, because z just went up and the function value went down. There you go. Now, if I go from zero to one, it goes up. By the way, it's a very good point. Since we're doing sine arithmetic on the zeroth first and second derivative, suppose I told you ahead of time that z was non-negative, right? If you knew z was non-negative,"},{"start":2202.63,"text":"then you could actually classify this as being increasing in the argument z. Everybody got that? So that's sign-dependent monotonicity. Everybody? Okay, so that is the idea. Okay."},{"start":2224.1,"text":"So there'll be a lot of stuff on that. This is actually the basis of actually pretty much all software for convex optimization. It's based on something called disciplined convex programming, which means absolutely nothing more than everything you write down can be verified using that one composition rule. That's it. So in some sense, there's only one rule you need to know, which is the composition rule, and now you're good to go. Okay."},{"start":2254.06,"text":"All right, we'll look at a bunch of other things. And there are some subtleties. So first, remember that if I have a function of two variables, and I take the maximum over one of the variables. We did that before. It was the supremum over y. And the fact is, y didn't even have to be a vector. It could be anything at all. So the maximum..."},{"start":2279.39,"text":"of f of x, y, where f is convex and x for each y is convex. What's cool is the same is true for a minimum, but the conditions are different and not totally straightforward. So here's what they are. It says if f of x and y is jointly convex in x and y, and then I minimize over y, over a convex set, that's this thing."},{"start":2306.22,"text":"then this thing is convex. And some people call this, oh, a great name for this is partial minimization. Because what it means is you have a function of two variables, they're vectors, and I minimize over one. So that's called partial. Yeah, I don't minimize over everything. It's called partial. So you would say something like this. Partial minimization preserves convexity. Okay? So by the way, this would be the principle behind, for example, dynamic programming."}],"speech_gaps":[],"frame":"../frames/v004/014.webp","frame_time":2185.15},{"title":"联合凸性与二次型","segments":[{"id":86,"text":"So that's what dynamic programming does. To minimize a big old function like this, you minimize over on  on"},{"start":2464.78,"text":"top of y right so that that function is nothing more than x y transpose and then I'll have to"},{"start":2472.46,"text":"to fill in matrices when i see what i had over here um let's see what are they oh a b b transpose"},{"start":2478.08,"text":"c okay right so so that's a that's a quadratic form in the stack stacked vector x y right okay"},{"start":2488.2,"text":"and what we're going to do is uh we're going to say oh when is this when is this uh when is this"},{"start":2494.66,"text":"this function convex."}],"speech_gaps":[],"frame":"../frames/v004/015.webp","frame_time":2348.57},{"title":"凸优化中的最小化与视角映射","segments":[{"id":104,"text":"What's that? Yeah, this block 2 by 2 matrix has to be positive semi-definite. Okay? That's the condition on which this is convex. Now, let's minimize over y here. Well, how do you minimize this thing over y? I mean, we could just take a gradient. You take a gradient, and here you get a term which is like 2b transpose x, and over there you get 2cy. Okay? You solve that."},{"id":105,"text":"and you work out what it is, and you end up, when you find out what y is, you plug it back into this thing, and you get this thing. So you get x transpose. So this is, I take this function of two variables, if I minimize over y for each x, I end up, number one, with a quadratic form. So you could even say something like this. Quadratic forms are closed under partial minimization. That's a perfectly reasonable statement to make."},{"id":106,"text":"Right? But not only it's kind of cool, if the original quadratic form was PSD, so is this one. And that's got a name. That's called the sure complement."},{"id":107,"text":"And you've doubtless all seen, it'd be very difficult to take classes where you don't see this, right? This is conditioning on a Gaussian random vector. This is, in electrical engineering, this is like taking a circuit and imposing conditions on some of the ports or nodes. In mechanical engineering, it comes up in every field there is. I can't think of a legitimate field where the sure complement doesn't come up. Okay? So..."},{"id":108,"text":"And sometimes people call it out, sometimes they don't. I don't know. Actually, how many people have heard it called out as a sure compliment before? Okay. Handful. Okay. How many people have seen it somewhere, seen something like this? Probably with some hideous notation. Okay. What field was it called out in? In the back. In my case, numerical linear algebra. Okay. In numerical linear algebra. Okay. Good. Okay. Good. All right. So."},{"id":109,"text":"And you may know that it's a basic fact of linear algebra that if a matrix is positive semidefinite, so is a sure complement, right? Or positive definite or negative. Okay, everybody got this? Okay, that's the minimization rule. Now we get to the perspective rule."},{"id":110,"text":"And so this is related, if you remember, the perspective mapping takes a vector with the last entry positive and divides everything by it. And then we looked at like linear fractional mappings and I mumbled about how that's basically the actual generic mapping you have in vision. Like if you have a camera system that looks at 3D and you look at the actual image you get on the sensor, which is 2D, it's actually got this perspective mapping in it, right? Okay."}],"notes":["本段讲解了如何通过梯度下降法对变量y进行最小化，并指出当原二次型是半正定时，其最小化后的结果仍然是半正定的。这被称为sure complement，是凸优化中的一个重要概念。","讲者提到，二次型在部分最小化后仍然保持其性质，即闭合性。这一性质在数学上是合理的，且在多个工程领域中都有广泛应用，如电路分析、机械工程等。","sure complement在数值线性代数中被提及，说明其在不同学科中的重要性。讲者还提到，如果一个矩阵是半正定的，那么其sure complement也是半正定的，这一性质是线性代数中的基本事实。","讲者进一步引入了视角映射（perspective mapping）的概念，指出其与线性分数映射的关系，并举例说明其在计算机视觉中的应用，如相机系统将3D空间映射到2D图像的过程。","讲者强调了视角映射在实际应用中的重要性，并指出其是视觉系统中常见的映射方式，这有助于理解图像形成的基本原理。","本段内容涵盖了最小化规则和视角映射规则，是凸优化课程中关于二次型和映射的重要部分，为后续内容奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2500.77,"end":2674.29,"asr_flags":[],"math_clarifications":["无法核定公式中的梯度项、二次型和sure complement是否正确，缺少上下文信息。","部分公式候
