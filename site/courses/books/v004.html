</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">04 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 4 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v004.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v004","title":"04 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 4","course":"凸优化","pages":[{"title":"凸优化的基本性质与构造方法","segments":[{"id":0,"text":"We'll continue. And let me remind you where we are, what the big picture is. The big picture is, you know, there are some times, you know, when someone says, is this convex or this concave? Sometimes you actually just go back to the definition or calculate a Hessian or something like that. That's actually really very rare.","zh":"我们将继续。让我提醒一下我们目前所处的位置，以及整体的图景。整体的图景是，有时候人们会问，这个是凸的还是凹的？有时候你实际上只是回到定义或者计算一个Hessian矩阵之类的。这实际上是非常罕见的。","start":5.26,"end":25.7},{"id":1,"text":"Really, the way you're going to be doing this, and a lot of people do this in practice, is in a constructive way. And so that's basically a calculus, as I said. You learn a bunch of base convex functions, a bunch of base convex sets.","zh":"实际上，你将通过一种构造性的方式来完成这个任务，而很多人在实践中也是这样做的。因此，这基本上是一种微积分的方法，正如我之前所说的。你学习一系列基本的凸函数和基本的凸集。","start":26.91,"end":40.13},{"id":2,"text":"And then you learn the rules that you can use to combine them and to know that the combination or to transform them and to know that that transformation is also convex. And so then, in fact, that's going to be also how all the code works as well, as we'll see. So, okay. So we're going through these. I think last time I mentioned these. You know, some of these are simple and obvious.","zh":"然后你学习一些规则，这些规则可以用来组合它们，并且知道组合后的结果或者变换后的结果仍然是凸的。因此，事实上，我们接下来所看到的代码也是按照这种方式工作的。好的。我们现在正在讨论这些内容。我认为上一次我提到了这些。你知道，其中一些是简单而明显的。","start":40.93,"end":64.9},{"id":3,"text":"The first are, you know, look, if something is convex, then 3.7 times it is convex. Well, sure, right? If something curves upward and then you multiply it by 3.7, it curves more upward, right? So that's fine.","zh":"第一个是，你知道，如果某物是凸的，那么乘以3.7之后仍然是凸的。当然，对吧？如果某物向上弯曲，然后乘以3.7，它会弯曲得更向上，对吧？所以这没问题。","start":65.69,"end":83.29},{"id":4,"text":"The sum of two convex functions is convex. And again, you know, some of these things, and I would actually encourage you to do this every now and then, you just grab one of these things and like just prove it. Some of these are like three line things to show, but somebody has to show them. I'm not going to do it, right? So, you know, the sum.","zh":"两个凸函数的和仍然是凸的。同样，你知道，有些事情，我实际上鼓励你时不时地去做一下，就是拿起这些内容之一，然后试着证明它。有些证明只需要三行，但有人必须去证明它们。我不会去做，对吧？所以，你知道，这个和。","start":84.85,"end":100.29},{"id":5,"text":"Precomposition with an affine function. Precomposition refers to the fact that the affine function appears first, right? So first I apply an affine function. That's AX. I map X to AX plus B. And then I take this convex function F. And that preserves convexity. And again, this is not, these are not, that's a three-liner. And so it's, you know, these are the kind of things you might want to just show yourself.","zh":"与仿射函数的预合成。预合成指的是仿射函数首先被应用，对吧？所以首先我应用一个仿射函数。这是AX。我将X映射到AX加B。然后我取这个凸函数F。这保持了凸性。同样，这些并不是三行就能完成的，所以这些是你可能想要自己证明的内容。","start":102.45,"end":128.19},{"id":6,"text":"Okay, so these are relatively simple. Then we get to the so-called pointwise maximum. So the maximum of a bunch of functions is defined pointwise. And, you know, just to convince you that this would preserve convexity, I mean, I'll just draw a picture. I mean, it's not too hard to actually show it. But if I have, you know, one function here, and I have another one over here that's convex, here's another one, right? Then if I look at the maximum,","zh":"好的，所以这些相对简单。然后我们到了所谓的逐点最大值。一堆函数的最大值是逐点定义的。而且，为了让你相信这会保持凸性，我的意思，我只需要画个图。我的意思是，实际上证明它并不太难。但假如我这里有一个函数，另一个在这里是凸的，再有一个，对吧？然后如果我看看最大值，","start":130.06,"end":159.26},{"id":7,"text":"The point-wise maximum is going to be this function here, like that. And it's pretty clear, at least your eye tells you, that's convex. And it's not hard to show this. So the maximum of a bunch of convex functions is convex. That's sort of a basic thing. It's kind of obvious.","zh":"逐点最大值将是这个函数，像这样。而且很明显，至少你的眼睛会告诉你，这是凸的。而且证明这一点并不难。所以一堆凸函数的最大值是凸的。这基本上是一个基本的事实。它有点显而易见。","start":160.0,"end":180.61}],"notes":["本段主要讲解凸函数的基本性质和构造方法。讲者指出，判断一个函数是否为凸函数，通常不是直接根据定义或计算Hessian矩阵，而是通过构造方法，即学习一些基本的凸函数和凸集，并掌握如何将它们组合或变换以保持凸性。","讲者提到，构造方法类似于一种‘微积分’，通过学习基本的凸函数和凸集，然后应用一些规则来组合或变换它们，从而保持凸性。这些规则包括：凸函数的线性变换、凸函数的和、以及凸函数的逐点最大值等。","讲者强调，这些规则虽然看起来简单，但需要通过证明来验证。例如，凸函数的线性变换（如乘以正数）保持凸性，凸函数的和也是凸函数，以及凸函数的逐点最大值仍然是凸函数。","讲者还提到，这些规则在实际应用中非常重要，因为它们构成了优化算法和代码实现的基础。例如，代码中的凸性检查和优化过程都依赖于这些规则。","讲者通过举例说明了这些规则的应用，例如，凸函数的线性变换（如乘以3.7）会使得函数曲线更加向上弯曲，而凸函数的和仍然是凸函数。此外，逐点最大值的凸性可以通过图形直观理解。","最后，讲者指出，虽然这些规则看起来简单，但需要通过证明来确认其正确性。例如，凸函数的逐点最大值的凸性可以通过图形和数学推导来验证，但需要一定的数学基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":180.61,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.26,"text":"We'll continue. And let me remind you where we are, what the big picture is. The big picture is, you know, there are some times, you know, when someone says, is this convex or this concave? Sometimes you actually just go back to the definition or calculate a Hessian or something like that. That's actually really very rare."},{"start":26.91,"text":"Really, the way you're going to be doing this, and a lot of people do this in practice, is in a constructive way. And so that's basically a calculus, as I said. You learn a bunch of base convex functions, a bunch of base convex sets."},{"start":40.93,"text":"And then you learn the rules that you can use to combine them and to know that the combination or to transform them and to know that that transformation is also convex. And so then, in fact, that's going to be also how all the code works as well, as we'll see. So, okay. So we're going through these. I think last time I mentioned these. You know, some of these are simple and obvious."},{"start":65.69,"text":"Pretty soon, though, they're not simple or obvious, right? Some of these rules. So the first are, you know, look, if something is convex, then 3.7 times it is convex. Well, sure, right? If something curves upward and then you multiply it by 3.7, it curves more upward, right? So that's fine."},{"start":84.85,"text":"The sum of two convex functions is convex. And again, you know, some of these things, and I would actually encourage you to do this every now and then, you just grab one of these things and like just prove it. Some of these are like three line things to show, but somebody has to show them. I'm not going to do it, right? So, you know, the sum."},{"start":102.45,"text":"Precomposition with an affine function. Precomposition refers to the fact that the affine function appears first, right? So first I apply an affine function. That's AX. I map X to AX plus B. And then I take this convex function F. And that preserves convexity. And again, this is not, these are not, that's a three-liner. And so it's, you know, these are the kind of things you might want to just show yourself."},{"start":130.06,"text":"Okay, so these are relatively simple. Then we get to the so-called pointwise maximum. So the maximum of a bunch of functions is defined pointwise. And, you know, just to convince you that this would preserve convexity, I mean, I'll just draw a picture. I mean, it's not too hard to actually show it. But if I have, you know, one function here, and I have another one over here that's convex, here's another one, right? Then if I look at the maximum,"},{"start":160.0,"text":"The point-wise maximum is going to be this function here, like that. And it's pretty clear, at least your eye tells you, that's convex. And it's not hard to show this. So the maximum of a bunch of convex functions is convex. That's sort of a basic thing. It's kind of obvious."}],"speech_gaps":[],"frame":"../frames/v004/001.webp","frame_time":17.259999999999998},{"title":"分段线性函数与凸函数的构造","segments":[{"id":8,"text":"Here's a so-called piecewise linear function, right? One way to describe a piecewise linear function, by the way, the canonical way is to say, oh, well, here is to actually have a Voronoi decomposition of Rn, and then in each one to specify the affine function, in each region you specify the affine function. That's sort of the typical way. Actually, for convex...","zh":"这里是一个所谓的分段线性函数，对吧？顺便说一下，描述分段线性函数的一种标准方式是说，哦，这里实际上是对Rn进行Voronoi分解，然后在每个区域中指定一个仿射函数。在每个区域中指定仿射函数，这就是一种典型的方式。实际上，对于凸函数来说……","start":183.13,"end":205.21},{"id":9,"text":"piecewise linear functions is actually a lot, there are many other ways that are sort of better to represent it. One is simply the max of a set of affine functions, right? So there, I give you a bunch of affine functions, and then I simply take the maximum, and that function is going to be convex. That's a convex function. Here's a very interesting one, is the sum, so here's a function on Rn, the sum of, let's say, the four biggest entries. Everybody got that? So that's,","zh":"分段线性函数实际上有很多种，还有许多其他方式可以更好地表示它。一种是简单地取一组仿射函数的最大值，对吧？所以，我给你一组仿射函数，然后我仅仅取最大值，这个函数就会是凸函数。这是一个凸函数。这里有一个非常有趣的情况，就是求和，所以这里是一个定义在Rn上的函数，是比如说四个最大元素的和。大家明白了吗？所以，","start":206.17,"end":235.51},{"id":10,"text":"It's a weird function. It is, in fact, you can kind of, I mean, it's quite, it's not differentiable. It's not, the derivative doesn't exist at some points, actually. The, let's see, it is, it certainly doesn't have a Hessian, right? It turns out this function is convex, right? And the way to show that is actually pretty straightforward.","zh":"这是一个奇怪的函数。事实上，你可以这样想，我的意思是，它并不可导。在某些点上导数不存在，实际上。让我们看看，它确实没有Hessian矩阵，对吧？结果发现这个函数是凸的，对吧？而证明这个函数是凸的方式实际上非常直接。","start":235.83,"end":262.29},{"id":11,"text":"What it is, is it's the maximum of a bunch of functions. This function here, it's all possible sets. Let's do some of the four largest entries. It is all possible subsets, choices of four entries in the vector. And I sum those up, and then I take the maximum. Now how many are there? N choose four. If N is big, that's actually a very big number. Doesn't matter. So this is convex.","zh":"它实际上是许多函数的最大值。这个函数在这里，是所有可能的子集。让我们做一些四个最大元素的情况。它是所有可能的子集，从向量中选择四个元素的组合。然后我将这些元素相加，再取最大值。现在有多少种这样的组合呢？是组合数C(N,4)。如果N很大，那实际上是一个非常大的数字。没关系。所以这个函数是凸的。","start":263.86,"end":289.56},{"id":12,"text":"I give you a vector, and I say, what's the sum of the 5.6 largest entries? You tell me what to do. Is it just the sum of the 5 largest entries? It's the sum of the 5 largest entries, plus 0.6 times the 6th largest. Everybody got that? So yeah, when you said take a weighted combination, sure, but that was vague, and I wanted something more specific. Everybody got that? That's a weird function.","zh":"我给你一个向量，然后我说，取最大的5.6个元素的和是多少？你告诉我该怎么做。是不是仅仅取最大的5个元素的和？是最大的5个元素的和，加上0.6倍的第6个最大的元素。大家明白了吗？所以，当你提到取加权组合的时候，当然没错，但那太模糊了，我想要更具体的例子。大家明白了吗？这是一个奇怪的函数。","start":291.1,"end":322.98},{"id":13,"text":"I give you a vector, and I say, what's the sum of the 5.6 largest entries? You tell me what to do. Is it just the sum of the 5 largest entries? It's the sum of the 5 largest entries, plus 0.6 times the 6th largest. Everybody got that? So yeah, when you said take a weighted combination, sure, but that was vague, and I wanted something more specific. Everybody got that? That's a weird function.","zh":"我给你一个向量，然后我说，最大的5.6个元素的和是多少？你告诉我应该怎么做。是不是就是最大的5个元素的和？是最大的5个元素的和，加上0.6倍的第六大的元素。大家明白了吗？所以，当你提到取加权组合的时候，当然没错，但那太模糊了，我想得到更具体的定义。大家明白了吗？这是一个很奇怪的函数。","start":323.68,"end":350.09}],"notes":["本段讲解了分段线性函数的构造方法，特别是通过取多个仿射函数的最大值来构造凸函数。讲者指出，这种构造方式是凸函数的一种典型表示方法，并举例说明了如何通过取向量中最大的几个元素之和来构造凸函数。","讲者进一步解释了如何将这种构造方法推广到非整数的参数，例如取向量中5.6个最大元素之和。这种推广实际上是通过加权平均的方式实现的，即取前5个最大元素之和加上0.6倍的第6个最大元素。","讲者强调了这种函数的非光滑性，即在某些点上导数不存在，因此无法定义Hessian矩阵。然而，这种函数仍然是凸函数，可以通过其作为多个仿射函数最大值的性质来证明其凸性。","讲者还提到，这种构造方法可以应用于任意数量的元素，例如取向量中最大的K个元素之和，其中K可以是任意实数，而不仅仅是整数。这种推广方式通过加权平均的方式实现，使得函数在数学上具有连续性和可操作性。","讲者指出，这种函数虽然在某些点上不可微，但仍然是凸函数，这说明凸函数的定义并不要求函数在所有点上都可微，只要满足凸性条件即可。","最后，讲者通过具体的例子说明了如何计算非整数参数下的最大值之和，强调了加权平均在构造凸函数中的重要性，并指出这种构造方式在数学上是严谨且合理的。"],"formulas":[{"latex":"f(x) = \\max_{i=1}^{m} (a_i^T x + b_i)","symbols":"f(x) 是一个分段线性函数，由多个仿射函数的最大值构成","explanation":"公式正确，使用了最大值符号和仿射函数的表示，符合分段线性函数的定义。","evidence":"piecewise linear functions is actually a lot, there are many other ways that are sort of better to represent it. One is simply the max of a set of affine functions, right? So there, I give you a bunch of affine functions, and then I simply take the maximum, and that function is going to be convex. That's a convex function. Here's a very interesting one, is the sum, so here's a function on Rn, the sum of, let's say, the four biggest entries. Everybody got that? So that's,"},{"latex":"f(x) = \\sum_{i=1}^{k} x_{(i)}","symbols":"f(x) 是向量x中最大的k个元素之和","explanation":"公式正确，使用了求和符号和排序后的元素表示，符合分段线性函数的定义。","evidence":"What it is, is it's the maximum of a bunch of functions. This function here, it's all possible sets. Let's do some of the four largest entries. It is all possible subsets, choices of four entries in the vector. And I sum those up, and then I take the maximum. Now how many are there? N choose four. If N is big, that's actually a very big number. Doesn't matter. So this is convex."},{"latex":"f(x) = \\sum_{i=1}^{5} x_{(i)} + 0.6 x_{(6)}","symbols":"f(x) 是向量x中最大的5.6个元素之和，通过加权平均计算","explanation":"公式正确，使用了加权求和的方式表示非整数个元素的和，符合分段线性函数的定义。","evidence":"This make sense? So this is the sum of the, so people refer to this as the sum of the R largest or the sum of the K largest. And it's a convex function. That's not totally obvious, I think, right? By the way, you can extend this to the sum of the 5.6 largest entries of a vector. What would that mean? What's the sum of the largest 5.6 entries of a vector? Weighted average? Well, weighted average? Yeah, kind of, but let's be more specific."}],"uncertainties":[],"diagram":"none","start":183.13,"end":350.09,"asr_flags":[],"math_clarifications":["公式中的'\\text{max}'和'\\text{sum}'应使用数学符号'\\max'和'\\sum'以符合数学排版规范。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":183.13,"text":"Here's a so-called piecewise linear function, right? One way to describe a piecewise linear function, by the way, the canonical way is to say, oh, well, here is to actually have a Voronoi decomposition of Rn, and then in each one to specify the affine function, in each region you specify the affine function. That's sort of the typical way. Actually, for convex..."},{"start":206.17,"text":"piecewise linear functions is actually a lot, there are many other ways that are sort of better to represent it. One is simply the max of a set of affine functions, right? So there, I give you a bunch of affine functions, and then I simply take the maximum, and that function is going to be convex. That's a convex function. Here's a very interesting one, is the sum, so here's a function on Rn, the sum of, let's say, the four biggest entries. Everybody got that? So that's,"},{"start":235.83,"text":"It's a weird function. It is, in fact, you can kind of, I mean, it's quite, it's not differentiable. It's not, the derivative doesn't exist at some points, actually. The, let's see, it is, it certainly doesn't have a Hessian, right? It turns out this function is convex, right? And the way to show that is actually pretty straightforward."},{"start":263.86,"text":"What it is, is it's the maximum of a bunch of functions. This function here, it's all possible sets. Let's do some of the four largest entries. It is all possible subsets, choices of four entries in the vector. And I sum those up, and then I take the maximum. Now how many are there? N choose four. If N is big, that's actually a very big number. Doesn't matter. So this is convex."},{"start":291.1,"text":"This make sense? So this is the sum of the, so people refer to this as the sum of the R largest or the sum of the K largest. And it's a convex function. That's not totally obvious, I think, right? By the way, you can extend this to the sum of the 5.6 largest entries of a vector. What would that mean? What's the sum of the largest 5.6 entries of a vector? Weighted average? Well, weighted average? Yeah, kind of, but let's be more specific."},{"start":323.68,"text":"I give you a vector, and I say, what's the sum of the 5.6 largest entries? You tell me what to do. Is it just the sum of the 5 largest entries? It's the sum of the 5 largest entries, plus 0.6 times the 6th largest. Everybody got that? So yeah, when you said take a weighted combination, sure, but that was vague, and I wanted something more specific. Everybody got that? That's a weird function."}],"speech_gaps":[],"frame":"../frames/v004/002.webp","frame_time":195.13},{"title":"凸函数的定义与最大值的凸性","segments":[{"id":14,"text":"Guess what? It's convex, right? And you can, you can, it's the same thing, right? That you simply look at all possible combinations of, of, uh, sums of actually you could do in this case, six things with one of them having a weight of 0.6 and the other is having a weight of one, right? And you just sum over all of those. There's a lot of them. Doesn't matter. Each one of those is linear and the maximum of a bunch of linear functions is going to be convex. Okay. So, okay.","zh":"猜猜看？它是凸的，对吧？你可以，你可以，它其实就是同一件事，对吧？也就是说，你只需考虑所有可能的组合，比如，这里实际上可以处理六种情况，其中一种的权重是0.6，另一种的权重是1，对吧？然后你只需对所有这些情况进行求和。有很多这样的组合。没关系。每一个都是线性的，而多个线性函数的最大值将是凸的。好的。所以，好的。","start":350.83,"end":379.69},{"id":15,"text":"Now this actually generalizes to a supremum, right? So supremum is, if you've had analysis, you know what it is. If you haven't, it's basically the maximum of an infinite number of numbers, right? I mean, and there's some subtleties, right? Like it could be infinity, for example, which is not possible if I have a maximum of a finite number of numbers, right? So if you see soup, you can just replace this with max and you will be just fine.","zh":"实际上，这可以推广到上确界，对吧？所以上确界，如果你学过分析学，你就会知道它的定义。如果你没学过，它基本上就是无限多个数的最大值，对吧？我的意思是，还有一些微妙之处，对吧？比如，它可能是无穷大，而如果你考虑的是有限多个数的最大值，这种情况是不可能的，对吧？所以如果你看到soup（这里可能指某种术语或例子），你只需将它替换为max，你就会没问题。","start":382.14,"end":409.12},{"id":16,"text":"Okay, so suppose I have a function of two variables, x and y. By the way, here, x is a vector. Turns out y doesn't even have to be a vector. It could be some weird thing. It could actually be some combinatorial structure like a path and a graph or something like that. It doesn't make any difference. It's anything at all.","zh":"好的，假设我有一个关于两个变量x和y的函数。顺便说一句，这里的x是一个向量。事实上，y甚至不需要是向量。它可以是某种奇怪的东西。它可以是像路径或图这样的组合结构。这并不影响什么。它可以是任何东西。","start":410.8,"end":431.18},{"id":17,"text":"And so you might even think of this as a family of convex functions parameterized by y. That would be a good way to think of this. And it says that if you simply take the maximum over all of these values of y here, that gives you a function, and it's convex. And this is also not too hard to show. Okay, so we can look at some examples here. Here's one.","zh":"因此，你甚至可以把这看作是一个由y参数化的凸函数族。这是理解这个问题的一个好方法。它指出，如果你仅仅对所有这些y值取最大值，就会得到一个函数，而这个函数是凸的。这也不太难证明。好的，所以我们可以看一些例子。这里有一个例子。","start":431.81,"end":460.95},{"id":18,"text":"Let's see. Oh, this is the support function of a set. So if I have a set here, then the maximum over the set of y transpose x, that is a function of x, that is actually convex. By the way, there are no restrictions whatsoever on the set C. It doesn't have to be convex or anything. Yeah. Script A is actually any set at all.","zh":"让我们看看。哦，这是集合的支持函数。所以，如果我有一个集合，那么对集合中所有元素的y转置x取最大值，得到的是一个关于x的函数，这个函数实际上是凸的。顺便说一句，集合C没有任何限制。它不需要是凸集。是的。Script A实际上是任何集合。","start":461.56,"end":492.28},{"id":19,"text":"Anything at all. That was my point before when I said it doesn't have to be a vector. Sometimes it is a vector, but it doesn't have to be. It could be some weird combinatorial structure. It could be literally it's the maximum over all paths in a graph that would take you from here to here. It doesn't matter. So it could be anything at all. Permutations. Stuff like that. Okay. Here's one. Let's take a set C. Not necessarily convex.","zh":"任何东西都可以。这正是我之前想表达的观点，当我提到它不一定要是向量的时候。有时候它确实是一个向量，但不一定要是。它可能是某种奇怪的组合结构。它可能是字面上从这里到这里的所有路径中的最大值。这并不重要。因此，它可以是任何东西。排列、各种东西都可以。好的。这里有一个例子。让我们取一个集合C。不一定是凸集。","start":493.13,"end":521.19}],"notes":["本段讲授了凸函数的定义，指出最大值函数是凸函数。通过多个例子说明，即使在有限或无限个线性函数的最大值中，结果仍然是凸的。同时，提到最大值函数可以推广到无穷多个数的上确界（supremum）。","讲者指出，即使集合C不是凸集，其支持函数仍然是凸函数。支持函数的定义是集合C中所有点与向量y的内积的最大值，这表明支持函数的凸性与集合C的凸性无关。","讲者强调，参数y可以是向量，也可以是其他结构，如图中的路径或排列。这说明凸函数的定义不仅限于向量空间，还可以应用于更广泛的结构。","讲者提到，最大值函数的凸性可以通过分析其定义来证明，即每个线性函数是凸的，而凸函数的最大值仍然是凸的。","讲者指出，即使集合C是任意的，其支持函数仍然是凸函数，这表明凸函数的性质具有广泛的适用性。","讲者通过多个例子说明，最大值函数的凸性不仅适用于有限个函数，也适用于无限个函数，这进一步扩展了凸函数的定义和应用范围。"],"formulas":[],"uncertainties":[],"diagram":"none","start":350.83,"end":521.19,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":350.83,"text":"Guess what? It's convex, right? And you can, you can, it's the same thing, right? That you simply look at all possible combinations of, of, uh, sums of actually you could do in this case, six things with one of them having a weight of 0.6 and the other is having a weight of one, right? And you just sum over all of those. There's a lot of them. Doesn't matter. Each one of those is linear and the maximum of a bunch of linear functions is going to be convex. Okay. So, okay."},{"start":382.14,"text":"Now this actually generalizes to a supremum, right? So supremum is, if you've had analysis, you know what it is. If you haven't, it's basically the maximum of an infinite number of numbers, right? I mean, and there's some subtleties, right? Like it could be infinity, for example, which is not possible if I have a maximum of a finite number of numbers, right? So if you see soup, you can just replace this with max and you will be just fine."},{"start":410.8,"text":"Okay, so suppose I have a function of two variables, x and y. By the way, here, x is a vector. Turns out y doesn't even have to be a vector. It could be some weird thing. It could actually be some combinatorial structure like a path and a graph or something like that. It doesn't make any difference. It's anything at all."},{"start":431.81,"text":"And so you might even think of this as a family of convex functions parameterized by y. That would be a good way to think of this. And it says that if you simply take the maximum over all of these values of y here, that gives you a function, and it's convex. And this is also not too hard to show. Okay, so we can look at some examples here. Here's one."},{"start":461.56,"text":"Let's see. Oh, this is the support function of a set. So if I have a set here, then the maximum over the set of y transpose x, that is a function of x, that is actually convex. By the way, there are no restrictions whatsoever on the set C. It doesn't have to be convex or anything. Yeah. Script A is actually any set at all."},{"start":493.13,"text":"Anything at all. That was my point before when I said it doesn't have to be a vector. Sometimes it is a vector, but it doesn't have to be. It could be some weird combinatorial structure. It could be literally it's the maximum over all paths in a graph that would take you from here to here. It doesn't matter. So it could be anything at all. Permutations. Stuff like that. Okay. Here's one. Let's take a set C. Not necessarily convex."}],"speech_gaps":[],"frame":"../frames/v004/003.webp","frame_time":362.83},{"title":"凸优化中的距离与最大特征值","segments":[{"id":20,"text":"and we work out here the farthest distance to the set, right? So what is the distance to the farthest point in that set? The usual distance is the smallest. So if someone, the universal definition of the distance of a point to a set, so let's see, here's a set, right? The universal definition of distance, if this is x and this is s,","zh":"并且我们在这里计算的是到集合的最远距离，对吧？那么，这个集合中最远点的距离是什么？通常的距离是最小的。所以，如果有人问，一个点到集合的标准距离，那么，这里有一个集合，对吧？标准距离的定义，如果这是x，这是s，","start":521.98,"end":550.66},{"id":21,"text":"distance of xs it's the minimum distance so it would be something like that okay this is the farthest distance right and so that would be i mean i have no idea what it would be maybe it's who knows it's either this point or that point it's something like either that something like that or maybe something way over here i'm not sure uh anyway that that farthest distance is convex right","zh":"点x到集合s的距离是最近距离，所以它会是类似这样的东西，对吧？这个就是最远距离，对吧？所以，这个最远距离是凸的，对吧？","start":552.15,"end":576.05},{"id":22,"text":"And by the way, it's not too hard for you to start imagining applications where things like this would come up, right? So this could be a set where you want to provide wireless coverage.","zh":"顺便说一句，你开始想象一些这样的应用场景应该不难，对吧？比如，这可以是一个需要提供无线覆盖的集合。","start":577.65,"end":594.27},{"id":23,"text":"X is a base station or something like that that you're placing. And then this becomes very interesting because it's the farthest distance from your base station to a place that you're contractually required to cover or something like that. So we're starting to get close to things that are clearly useful in practice. So we'll get to that. Okay, here's a good one. The maximum eigenvalue of a symmetric matrix, right?","zh":"X是一个基站或者类似的东西，你正在放置它。然后这变得非常有趣，因为它是你基站到你合同上要求覆盖的地点的最远距离，或者类似的东西。因此，我们开始接近一些在实践中明显有用的东西。我们之后会讲到这个。好的，这里有一个很好的例子：对称矩阵的最大特征值，对吧？","start":594.95,"end":620.17},{"id":24,"text":"Now, the maximum eigenvalue of a matrix, that's a really complicated function, right? It's basically you form the determinant of lambda i minus a. That's an nth degree polynomial. You find the roots of the polynomial. In this case, they're all real. And then you take the largest of those roots. And you might know that if the polynomial has degree 5 or larger, there's no formula for the roots of a polynomial like there is for quadratic that you know. Some of you might have seen it for a cubic. Anybody?","zh":"现在，矩阵的最大特征值是一个非常复杂的函数，对吧？基本上，你形成lambda i减去矩阵A的行列式。这是一个n次多项式。你找到这个多项式的根。在这种情况下，它们都是实数。然后你取这些根中最大的那个。你可能知道，如果多项式的次数是5次或更高，就没有像二次方程那样的根的公式。有些人可能见过三次方程的情况，有人吗？","start":621.16,"end":648.9},{"id":25,"text":"I'm hoping they don't teach that anymore. I'm super happy to hear that no one knows that. And for a quartic, part of the reason they don't teach it is because you know the quadratic formula. That's totally fine. Cubic, it's like a paragraph. Quartic is a page and a half. And it's not cool. And then, of course, mathematicians sat around and said, well, what is it for the quintic? And then, essentially, it was shown.","zh":"我希望他们不再教这个了。听到没有人知道这一点，我非常高兴。对于四次方程，他们不教它的一部分原因是因为你知道二次方程求根公式。这完全没问题。三次方程就像是一个段落。四次方程则是一页半。而且这并不酷。然后，当然，数学家们坐下来讨论，问五次方程的情况如何？然后，实际上，它已经被证明了。","start":649.68,"end":673.92},{"id":26,"text":"I don't know, 200 years? Yeah, it's coming up on 200 years ago. Actually, just about 200 years ago, I think, it was shown that there's actually no formula for the quintet, so they could stop. Now, of course, that doesn't stop anybody who actually does stuff, because people find eigenvalues and find roots of polynomials like every day, all day long, but they do it numerically. But there's no secret formula for it. Okay, all right.","zh":"我不知道，200年？是的，这已经快200年前了。实际上，我想就在大约200年前，人们已经证明了五次方程实际上没有求根公式，所以他们可以停止了。当然，这并不阻止那些真正做事情的人，因为人们每天都会找到特征值和多项式的根，但他们用数值方法来做。但五次方程并没有什么秘密公式。好的，明白了。","start":674.4,"end":698.14}],"notes":["本段讨论了点到集合的距离概念，强调了通常的距离是点到集合的最小距离，而远距离则是最大距离。这在实际应用中可能涉及无线覆盖等场景，例如基站放置问题。","接着，讲者引入了对称矩阵的最大特征值问题，指出这是一个复杂的函数，通常需要通过求解特征多项式的根来确定最大特征值。","讲者进一步说明了多项式根的求解难度，指出对于五次及以上多项式，没有通用的解析解公式，因此通常采用数值方法求解。","讲者提到数学家在19世纪左右证明了五次多项式没有通用解，但实际应用中人们仍然通过数值方法求解特征值和多项式根。","本段内容涉及凸优化中的距离概念和特征值问题，强调了实际应用中的重要性以及数值方法的必要性。","讲者通过讨论多项式根的求解难度，展示了数学理论与实际计算方法之间的差异，以及数值方法在现代计算中的重要性。"],"formulas":[{"latex":"\\det(\\lambda I - A) = 0","symbols":"特征多项式","explanation":"该公式正确表示了特征多项式的定义，其中 $\\lambda$ 是特征值，$I$ 是单位矩阵，$A$ 是对称矩阵。","evidence":"Now, the maximum eigenvalue of a matrix, that's a really complicated function, right? It's basically you form the determinant of lambda i minus a. That's an nth degree polynomial. You find the roots of the polynomial. In this case, they're all real. And then you take the largest of those roots. And you might know that if the polynomial has degree 5 or larger, there's no formula for the roots of a polynomial like there is for quadratic that you know. Some of you might have seen it for a cubic. Anybody?"}],"uncertainties":["quintet"],"diagram":"none","start":521.98,"end":698.14,"asr_flags":[],"math_clarifications":["原始片段中提到的特征值问题和多项式根的讨论，需要更完整的数学表达式来准确描述。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":521.98,"text":"and we work out here the farthest distance to the set, right? So what is the distance to the farthest point in that set? The usual distance is the smallest. So if someone, the universal definition of the distance of a point to a set, so let's see, here's a set, right? The universal definition of distance, if this is x and this is s,"},{"start":552.15,"text":"distance of xs it's the minimum distance so it would be something like that okay this is the farthest distance right and so that would be i mean i have no idea what it would be maybe it's who knows it's either this point or that point it's something like either that something like that or maybe something way over here i'm not sure uh anyway that that farthest distance is convex right"},{"start":577.65,"text":"And by the way, it's not too hard for you to start imagining applications where things like this would come up, right? So this could be a set where you want to provide wireless coverage."},{"start":594.95,"text":"X is a base station or something like that that you're placing. And then this becomes very interesting because it's the farthest distance from your base station to a place that you're contractually required to cover or something like that. So we're starting to get close to things that are clearly useful in practice. So we'll get to that. Okay, here's a good one. The maximum eigenvalue of a symmetric matrix, right?"},{"start":621.16,"text":"Now, the maximum eigenvalue of a matrix, that's a really complicated function, right? It's basically you form the determinant of lambda i minus a. That's an nth degree polynomial. You find the roots of the polynomial. In this case, they're all real. And then you take the largest of those roots. And you might know that if the polynomial has degree 5 or larger, there's no formula for the roots of a polynomial like there is for quadratic that you know. Some of you might have seen it for a cubic. Anybody?"},{"start":649.68,"text":"I'm hoping they don't teach that anymore. I'm super happy to hear that no one knows that. And for a quartic, part of the reason they don't teach it is because you know the quadratic formula. That's totally fine. Cubic, it's like a paragraph. Quartic is a page and a half. And it's not cool. And then, of course, mathematicians sat around and said, well, what is it for the quintic? And then, essentially, it was shown."},{"start":674.4,"text":"I don't know, 200 years? Yeah, it's coming up on 200 years ago. Actually, just about 200 years ago, I think, it was shown that there's actually no formula for the quintet, so they could stop. Now, of course, that doesn't stop anybody who actually does stuff, because people find eigenvalues and find roots of polynomials like every day, all day long, but they do it numerically. But there's no secret formula for it. Okay, all right."}],"speech_gaps":[],"frame":"../frames/v004/004.webp","frame_time":533.98},{"title":"凸函数的复合与最大特征值","segments":[{"id":27,"text":"That was a long, weird thing. Okay, all I'm saying is the function, which is the largest eigenvalue of, let's say, a 10 by 10 symmetric matrix, it's a really complicated function, right? And I can't write it. There's no formula for it and blah, blah, blah. But it's convex. And the way to show it is really simple. What kind of function is y transpose xy of x?","zh":"那是一个很长、很奇怪的东西。好吧，我想说的是，这个函数，它是某个比如说10乘10对称矩阵的最大特征值，它是一个非常复杂的函数，对吧？我无法写出它的表达式。没有公式， blah, blah, blah。但它却是凸函数。而证明它的方式其实非常简单。y转置乘以X乘以y这个函数是什么样的函数呢？","start":698.79,"end":722.43},{"id":28,"text":"It's linear, right? So this shows you you really have to be on your toes, right? If I write that thing out, right? So if I write out, what is it? Y transpose XY, right? That's the sum over I and J of YIYJ times XIJ. Now this function is quadratic in Y, but it is linear in X, okay?","zh":"它是线性的，对吧？这说明你真的要时刻保持警惕，对吧？如果我把这个式子展开，对吧？所以如果我展开，它是什么？y转置乘以X乘以y，对吧？那就是对i和j求和的YiYj乘以Xij。现在这个函数在Y上是二次的，但在X上是线性的，对吧？","start":725.38,"end":753.92},{"id":29,"text":"So that's actually going to be sort of a theme, is that a lot of times you just really have to be on your toes, reminding yourself what's the variable, what's not, all that kind of stuff. And things that don't look linear actually sometimes are. We'll get to examples of that. Okay, so here it is. This thing, y transpose xy, is linear and therefore convex for any value of y.","zh":"所以这实际上会成为一个主题，就是很多时候你真的要时刻保持警惕，提醒自己什么变量，什么不是变量，诸如此类的事情。有些看起来不线性的函数实际上有时是线性的。我们会看到这样的例子。好吧，现在我们来看，这个y转置乘以X乘以y，是一个线性函数，因此对于任何y的值都是凸函数。","start":754.54,"end":779.3},{"id":30,"text":"It's the linear function of capital X, right? So it's, but now this says, if I take the supremum over everything on the unit sphere, so Y is this, you know, sphere, then this thing is just turns out to be, first of all, that's convex, but it also is the maximum eigenvalue. Okay. So does this make sense? So it's going to get, things are going to slowly get a little bit more complicated and maybe less obvious. Okay. Now we're going to do composition.","zh":"它是大写X的线性函数，对吧？所以现在这个说法是，如果我在单位球上取上确界，也就是Y是这个球，那么这个东西实际上就是最大特征值。好吧，这有意义吗？所以接下来的事情会慢慢变得复杂一些，可能也不那么明显。好吧，现在我们要处理复合函数。","start":779.87,"end":809.93},{"id":31,"text":"This is actually super important. You'll know why in about five minutes, ten minutes. I'll make a big deal out of it because this is going to be actually a huge part of your life for the next, well, certainly for the next eight weeks it will be, and quite likely long after that. So we'll just start simple. It goes like this. When is the composition of two functions convex? So when is h of g of x?","zh":"这实际上是非常重要的。大约五分钟或十分钟之后你就会明白为什么。我会大张旗鼓地强调这一点，因为这实际上会成为你接下来，至少接下来八周生活中非常重要的一部分，很可能在之后很长一段时间内也一样。所以我们先从简单的情况开始。它是这样的，两个函数的复合什么时候是凸函数？也就是说，h(g(x))什么时候是凸函数？","start":810.94,"end":838.2},{"id":32,"text":"convex right and oh we know one by the way we already know one version of this of composition if g is affine then and h is convex this thing is because that's pre-composition with an affine function that's convex okay we're going to go beyond that now okay we're going to have g be not affine okay so here's the here's the rule it says it says that this composition is convex if","zh":"凸函数的右端，哦，我们已经知道一种情况，如果g是仿射函数，而h是凸函数，那么这个复合函数是凸的，因为这是与仿射函数的预复合，而这是凸的。好的，我们现在要超越这一点，我们现在要让g不再是仿射函数。这里有一个规则，它说，如果这个复合函数是凸的","start":838.92,"end":866.72}],"notes":["本段讨论了凸函数的复合问题，强调了在判断复合函数是否为凸函数时需要考虑函数的结构和变量的定义。讲者指出，当函数g是仿射函数且函数h是凸函数时，复合函数h(g(x))是凸函数。这是凸优化中的一个基本性质，但讲者提到接下来将讨论更一般的情况，即g不是仿射函数时的复合函数的凸性条件。","讲者通过一个例子说明了最大特征值函数的凸性。该函数是10x10对称矩阵的最大特征值，虽然其表达式复杂且没有显式公式，但它是凸函数。讲者指出，通过分析函数y^T X y的结构，可以发现其在变量Y上是线性的，因此是凸函数。","讲者强调了在分析函数性质时需要特别注意变量的定义，即哪些是变量，哪些是参数。例如，函数y^T X y在变量Y上是线性的，但在X上是二次的。这种区分对于判断函数的凸性至关重要。","讲者提到，当对变量Y在单位球面上取上确界时，函数y^T X y的结果是矩阵X的最大特征值。这说明了最大特征值函数的凸性，并且该函数在凸优化中具有重要应用。","讲者指出，复合函数的凸性判断是凸优化中的一个核心问题，特别是在处理非仿射函数的复合时。讲者提到，接下来将讨论更一般的情况，即当函数g不是仿射函数时，如何判断h(g(x))是否为凸函数。","讲者强调了复合函数凸性的研究在凸优化中的重要性，并指出这将是一个贯穿课程的重要主题，不仅在接下来的八周内，而且在之后的学习中也会持续出现。"],"formulas":[{"latex":"y^T X y","symbols":"y^T X y 表示向量 y 与矩阵 X 的乘积再与向量 y 的转置相乘","explanation":"公式正确，表示二次型，适用于对称矩阵 X 和向量 y。","evidence":"It's linear, right? So this shows you you really have to be on your toes, right? If I write that thing out, right? So if I write out, what is it? Y transpose XY, right? That's the sum over I and J of YIYJ times XIJ. Now this function is quadratic in Y, but it is linear in X, okay?"}],"uncertainties":["convex right and oh we know one by the way we already know one version of this of composition if g is affine then and h is convex this thing is because that's pre-composition with an affine function that's convex okay we're going to go beyond that now okay we're going to have g be not affine okay so here's the here's the rule it says it says that this composition is convex if"],"diagram":"none","start":698.79,"end":866.72,"asr_flags":[],"math_clarifications":["公式 y^T X y 是二次型，适用于对称矩阵 X 和向量 y。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":698.79,"text":"That was a long, weird thing. Okay, all I'm saying is the function, which is the largest eigenvalue of, let's say, a 10 by 10 symmetric matrix, it's a really complicated function, right? And I can't write it. There's no formula for it and blah, blah, blah. But it's convex. And the way to show it is really simple. What kind of function is y transpose xy of x?"},{"start":725.38,"text":"It's linear, right? So this shows you you really have to be on your toes, right? If I write that thing out, right? So if I write out, what is it? Y transpose XY, right? That's the sum over I and J of YIYJ times XIJ. Now this function is quadratic in Y, but it is linear in X, okay?"},{"start":754.54,"text":"So that's actually going to be sort of a theme, is that a lot of times you just really have to be on your toes, reminding yourself what's the variable, what's not, all that kind of stuff. And things that don't look linear actually sometimes are. We'll get to examples of that. Okay, so here it is. This thing, y transpose xy, is linear and therefore convex for any value of y."},{"start":779.87,"text":"It's the linear function of capital X, right? So it's, but now this says, if I take the supremum over everything on the unit sphere, so Y is this, you know, sphere, then this thing is just turns out to be, first of all, that's convex, but it also is the maximum eigenvalue. Okay. So does this make sense? So it's going to get, things are going to slowly get a little bit more complicated and maybe less obvious. Okay. Now we're going to do composition."},{"start":810.94,"text":"This is actually super important. You'll know why in about five minutes, ten minutes. I'll make a big deal out of it because this is going to be actually a huge part of your life for the next, well, certainly for the next eight weeks it will be, and quite likely long after that. So we'll just start simple. It goes like this. When is the composition of two functions convex? So when is h of g of x?"},{"start":838.92,"text":"convex right and oh we know one by the way we already know one version of this of composition if g is affine then and h is convex this thing is because that's pre-composition with an affine function that's convex okay we're going to go beyond that now okay we're going to have g be not affine okay so here's the here's the rule it says it says that this composition is convex if"}],"speech_gaps":[],"frame":"../frames/v004/005.webp","frame_time":710.79},{"title":"凸函数的复合性质","segments":[{"id":33,"text":"G is convex. H is convex. And I'm just going to be very informal and just say increasing. So an increasing convex function of a convex function is convex. Now, the H tilde means it has to be non-decreasing this extended value extension. And that's not a weird technicality. It's actually a real thing.","zh":"G 是凸的。H 也是凸的。我将非常随意地说它是递增的。所以，一个凸函数的递增复合函数仍然是凸的。这里的 H 带波浪线表示它必须是非递减的，这是扩展值扩展下的要求。这不是一个奇怪的技术细节。实际上，这是一个真实存在的概念。","start":867.22,"end":890.95},{"id":34,"text":"The rough way to think of it is increasing function of a convex function is convex. Most famous example, if g is convex, then exp g of x is convex. So e to the x squared is convex. Period. Why? Because exp is convex and increasing. And what this says is convex increasing of a convex function is convex. Here's one.","zh":"粗略地来看，一个凸函数的递增函数仍然是凸的。最著名的例子是，如果 g 是凸的，那么 e 的 g(x) 次方是凸的。例如，e 的 x 平方次方是凸的。为什么？因为指数函数是凸的且递增的。而这里说的是凸函数的递增复合仍然是凸的。这里有一个例子。","start":892.75,"end":922.24},{"id":35,"text":"It also works this way. If h is decreasing, if the outer function is decreasing, if it's convex and decreasing, then if g is concave, this composition is convex. By the way, you can get that from the other one by substituting a minus with g and stuff like that. So that would do that. So here's an example. 1 over g of x.","zh":"它也以这种方式起作用。如果 h 是递减的，如果外层函数是递减的，且它是凸的和递减的，那么如果 g 是凹的，这个复合函数就是凸的。顺便说一下，你可以通过将 g 替换为负数等方式从另一个情况推导出这个结论。所以这就完成了。这里有一个例子：1 除以 g(x)。","start":923.6,"end":952.45},{"id":36,"text":"The inverse of a positive concave function is convex. Okay? So, I mean, you could check some things like, you know, let's say 1 over square root x. Square root x is, well, let's limit it to, it doesn't matter, is non-negative and so on. So 1 over that is actually convex. Okay? And the reason is, the function 1 over x is,","zh":"一个正的凹函数的反函数是凸的。对吧？所以，你可以检查一些例子，比如 1 除以根号 x。根号 x 是非负的，不管怎样。所以 1 除以根号 x 实际上是凸的。对吧？原因在于，函数 1 除以 x 是凸的且递减的，对吧？","start":953.1,"end":980.59},{"id":37,"text":"Convex and decreasing, right? So it looks like this. That's 1 over x, right? It's both convex and... So actually, please note that all of these arguments involve basically the signs of the zeroth first and second derivative. Because I'm talking increasing and decreasing is the sign of the first derivative, if it's differentiable.","zh":"凸且递减，对吧？所以看起来像这样。这是1除以x，对吧？它既是凸的又是……所以实际上，请注意，所有这些讨论基本上涉及的是零阶、一阶和二阶导数的符号。因为我在谈论增减性时，指的是导数的一阶导数的符号，如果它是可微的的话。","start":982.4,"end":1005.9},{"id":38,"text":"right convexity and concavity that's the sign of the second derivative again if it's differentiable but this is not a bad way to think of it okay and then we also sometimes say well something has to be well well okay here g had to be positive otherwise one over x at least in this class doesn't make sense right so okay okay so uh that that's these are the composition rules and lots of ways it's actually very short to just prove it directly","zh":"对，凸性与凹性涉及的是二阶导数的符号，如果它是可微的。这并不是一个不好的思考方式，对吧？而且我们有时也会说，某些东西必须是良好的，对吧？在这里，g 必须是正的，否则像 1 除以 x 这样的函数在这一类中是没有意义的，对吧？好的，好的，这些就是复合规则，实际上有很多方法，直接证明它是非常简短的。","start":1006.42,"end":1033.15}],"notes":["本段讲解了凸函数的复合性质，特别是当外层函数是递增或递减时，与内层函数的凸性或凹性之间的关系。例如，当外层函数是递增且凸的，内层函数是凸的，那么它们的复合函数也是凸的。同样，当外层函数是递减且凸的，内层函数是凹的，复合函数仍然是凸的。","讲者通过具体例子说明了这些性质，如指数函数 $ e^{g(x)} $，当 $ g(x) $ 是凸函数时，结果也是凸的。此外，还提到 $ 1/g(x) $ 的情况，当 $ g(x) $ 是正的凹函数时，其倒数是凸的。","讲者指出，这些结论的推导主要依赖于函数的一阶和二阶导数的符号。递增或递减对应于一阶导数的符号，而凸性或凹性则对应于二阶导数的符号。","讲者还提到，当处理 $ 1/g(x) $ 时，必须确保 $ g(x) $ 是正的，否则在某些情况下（如 $ 1/x $）可能不适用或导致数学上的问题。","讲者强调，这些复合规则可以通过直接证明来验证，而无需依赖复杂的定理。这为理解凸函数的性质提供了直观的思路。","讲者最后提到，这些规则在凸优化中非常重要，因为它们帮助我们判断复合函数的凸性，从而在优化问题中应用这些性质。"],"formulas":[{"latex":"e^{g(x)}","symbols":"指数函数","explanation":"保持原式，指数函数 $ e^{g(x)} $ 是一个凸函数，当 $ g(x) $ 是凸函数时，$ e^{g(x)} $ 也是凸函数。","evidence":"The rough way to think of it is increasing function of a convex function is convex. Most famous example, if g is convex, then exp g of x is convex. So e to the x squared is convex. Period. Why? Because exp is convex and increasing. And what this says is convex increasing of a convex function is convex. Here's one."},{"latex":"\\frac{1}{g(x)}","symbols":"倒数函数","explanation":"保持原式，倒数函数 $ \\frac{1}{g(x)} $ 是一个凸函数，当 $ g(x) $ 是正的凹函数时，$ \\frac{1}{g(x)} $ 是凸函数。","evidence":"The inverse of a positive concave function is convex. Okay? So, I mean, you could check some things like, you know, let's say 1 over square root x. Square root x is, well, let's limit it to, it doesn't matter, is non-negative and so on. So 1 over that is actually convex. Okay? And the reason is, the function 1 over x is,"}],"uncertainties":["right convexity and concavity that's the sign of the second derivative again if it's differentiable but this is not a bad way to think of it okay and then we also sometimes say well something has to be well well okay here g had to be positive otherwise one over x at least in this class doesn't make sense right so okay okay so uh that that's these are the composition rules and lots of ways it's actually very short to just prove it directly"],"diagram":"none","start":867.22,"end":1033.15,"asr_flags":[],"math_clarifications":["在原文中，讨论了凸函数的组合性质，包括指数函数和倒数函数的凸性。这些函数的凸性依赖于其内部函数的性质和导数的符号。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":867.22,"text":"G is convex. H is convex. And I'm just going to be very informal and just say increasing. So an increasing convex function of a convex function is convex. Now, the H tilde means it has to be non-decreasing this extended value extension. And that's not a weird technicality. It's actually a real thing."},{"start":892.75,"text":"The rough way to think of it is increasing function of a convex function is convex. Most famous example, if g is convex, then exp g of x is convex. So e to the x squared is convex. Period. Why? Because exp is convex and increasing. And what this says is convex increasing of a convex function is convex. Here's one."},{"start":923.6,"text":"It also works this way. If h is decreasing, if the outer function is decreasing, if it's convex and decreasing, then if g is concave, this composition is convex. By the way, you can get that from the other one by substituting a minus with g and stuff like that. So that would do that. So here's an example. 1 over g of x."},{"start":953.1,"text":"The inverse of a positive concave function is convex. Okay? So, I mean, you could check some things like, you know, let's say 1 over square root x. Square root x is, well, let's limit it to, it doesn't matter, is non-negative and so on. So 1 over that is actually convex. Okay? And the reason is, the function 1 over x is,"},{"start":982.4,"text":"Convex and decreasing, right? So it looks like this. That's 1 over x, right? It's both convex and... So actually, please note that all of these arguments involve basically the signs of the zeroth first and second derivative. Because I'm talking increasing and decreasing is the sign of the first derivative, if it's differentiable."},{"start":1006.42,"text":"right convexity and concavity that's the sign of the second derivative again if it's differentiable but this is not a bad way to think of it okay and then we also sometimes say well something has to be well well okay here g had to be positive otherwise one over x at least in this class doesn't make sense right so okay okay so uh that that's these are the composition rules and lots of ways it's actually very short to just prove it directly"}],"speech_gaps":[],"frame":"../frames/v004/006.webp","frame_time":879.22},{"title":"凸函数的复合性质","segments":[{"id":39,"text":"And with no assumptions on differentiability or anything. But I think a very good way to think of it, the way I think of it, or my mnemonic for it, if I forget this, I guess I don't forget it. But if I were to forget it, I would simply go back to something like this. You just assume everything is in R1. Assume everything is differentiable. And then you literally just take...","zh":"而且不需要对可微性做任何假设。但我觉得一个非常好的思考方式，也就是我自己的记忆方法，如果我忘记了这个结论，我想我大概也不会忘记。但如果我忘记了，我只需要回到类似这样的例子。假设所有内容都在R1中，假设所有内容都是可微的，然后你直接……","start":1034.15,"end":1056.65},{"id":40,"text":"you know, go back to your calculus class, differentiate this once, you get h prime of g of x times g prime of x, differentiate it a second time, and you get this thing here. And now we look at that formula, and you take a look at it. And let's do the second one. How about this one? Okay, so, and by the way, these assumptions are going to tell us about the signs of derivatives of order 0, 1, or 2. So let's see how this works. So let's say, let's look at this one. g is concave.","zh":"你知道的，回到你的微积分课，对这个函数求一次导，你会得到h'（g(x))乘以g'(x)，再求第二次导，你会得到这个表达式。现在我们看一下这个公式，仔细观察一下。让我们来看第二个例子。怎么样，这个例子呢？顺便说一句，这些假设将告诉我们关于0阶、1阶或2阶导数的符号信息。那么我们来看看这个例子。g是凹函数。","start":1056.93,"end":1084.83},{"id":41,"text":"Well, let's see what that means. Oh, that means that's a negative number, right? I'm going to be, I'm going to be a little, I'm informal, right? I'm not going to distinguish between positive and non-negative and all that stuff. So, so this is negative, okay? Let's look at this. So let's see, h prime of g of x. Well, let's see, let's see what, h is non-increasing, is decreasing, right? So that means h prime of g of x, that's also like less than or equal to zero. And now we're going to use a very deep mathematical fact. You ready?","zh":"那么，这代表什么？哦，这意味着这是一个负数，对吧？我会稍微随意一点，不会区分正数和非负数以及所有这些细节。所以，这个是负数，对吧？让我们来看一下。那么，h'（g(x))，让我们看看，h是非增的，是递减的，对吧？这意味着h'（g(x))也小于或等于零。现在我们将使用一个非常深刻的数学事实。你准备好了吗？","start":1085.37,"end":1114.55},{"id":42,"text":"The product of two numbers, each of which is less than or equal to zero, is bigger than or equal to zero. Everybody got that? Extremely deep mathematical principle, right? So literally we're using the dumbest sine arithmetic for multiplication. So this term, with these assumptions here, this term, bigger than or equal to zero.","zh":"两个都小于或等于零的数的乘积，大于或等于零。大家明白吗？这是一个极其深刻的数学原理，对吧？我们实际上只是用最基础的乘法算术。因此，在这些假设下，这个项大于或等于零。","start":1115.06,"end":1138.6},{"id":43,"text":"Well, any square of anything is going to be non-negative, right? And then we multiply that by h prime prime of g of x. But we're assuming h is convex. That means that h prime prime is non-negative. Everybody got it?","zh":"任何数的平方都是非负的，对吧？然后我们把这个乘以h''（g(x))。但我们假设h是凸函数，这意味着h''是非负的。大家明白吗？","start":1139.24,"end":1152.13},{"id":44,"text":"So once again, deep mathematical principle, the product of a non-negative number times a square of another number, that's going to be non-negative. And now we're going to use an even more basic fact, which is the sum of two non-negative things is non-negative. Everybody got that? So all of this is non-negative. Oh, but that's f prime prime. That's exactly what it means for f to be convex. Did everybody follow that? I mean, it's kind of a dumb thing, but I wanted to go through it. It doesn't hurt to go through it. Yes?","zh":"再次，一个深刻的数学原理，一个非负数乘以另一个数的平方，结果将是非负的。现在我们将使用一个更基本的事实，即两个非负数的和仍然是非负的。大家明白了吗？因此，所有这些结果都是非负的。哦，但那是二阶导数 f''。这正是函数 f 凸性的含义。大家跟上来了吗？我是说，这可能看起来有点傻，但我还是想再讲一遍。重复一遍不会有什么坏处。对吗？","start":1152.48,"end":1180.02},{"id":45,"text":"One direction or does it hold the other way as well? It does not hold the other way. So that's a very good question, right? If this composition rule, if the hypothesis of the composition rule holds, you can conclude something is convex. I mean, there's a similar one for concave, right? You can have cases where the composition rule does not hold and yet the function is convex.","zh":"一个方向，还是反过来也成立呢？反过来并不成立。这是一个非常好的问题，对吧？如果这个复合规则的前提条件成立，那么你可以得出某个函数是凸的结论。我是说，对于凹函数也有类似的规则，对吧？也存在一些情况，即使复合规则的前提条件不成立，函数仍然是凸的。","start":1181.55,"end":1209.55}],"notes":["本段讲解了凸函数复合的性质，通过具体例子说明了当两个函数满足一定条件时，其复合函数也是凸函数。首先，假设g是凹函数，这意味着其一阶导数为负，二阶导数为负。接着，h是凸函数，其二阶导数为非负。通过计算复合函数f = h(g(x))的二阶导数，得出其非负，从而证明f是凸函数。","在推导过程中，使用了多个数学原理，包括导数的链式法则、乘积的符号性质以及平方的非负性。这些原理帮助确定了复合函数的凸性。例如，两个非正数的乘积为非负数，而平方数的非负性与凸函数的二阶导数非负性相结合，进一步验证了复合函数的凸性。","课堂中还讨论了复合规则的方向性问题，即如果满足复合规则的假设，可以得出函数是凸的，但反过来不一定成立。这说明了复合规则的单向性，即满足条件可以推出结论，但结论不一定能推出条件。","通过具体的例子和数学推导，课程强调了凸函数复合的条件和结果之间的关系。这有助于理解在优化问题中，如何利用函数的凸性来保证解的唯一性和全局最优性。","课堂中提到的数学原理，如导数的链式法则和乘积的符号性质，是理解凸函数复合性质的基础。这些原理在数学分析和优化理论中具有广泛的应用。","最后，课程指出，虽然复合规则可以推出函数的凸性，但并非所有凸函数都能通过复合规则得到。这说明了在实际应用中，需要结合具体函数的性质来判断其凸性。"],"formulas":[{"latex":"f''(x) = h''(g(x)) [g'(x)]^2 + h'(g(x)) g''(x)","symbols":"f''(x) 表示复合函数 f = h(g(x)) 的二阶导数","explanation":"公式正确表达了复合函数的二阶导数。根据链式法则，复合函数的二阶导数由两部分组成：第一部分是 h''(g(x)) 乘以 [g'(x)]^2，第二部分是 h'(g(x)) 乘以 g''(x)。公式中的符号和数学类型均符合数学规范，无需修改。","evidence":"So once again, deep mathematical principle, the product of a non-negative number times a square of another number, that's going to be non-negative. And now we're going to use an even more basic fact, which is the sum of two non-negative things is non-negative. Everybody got that? So all of this is non-negative. Oh, but that's f prime prime. That's exactly what it means for f to be convex. Did everybody follow that? I mean, it's kind of a dumb thing, but I wanted to go through it. It doesn't hurt to go through it. Yes?"}],"uncertainties":[],"diagram":"none","start":1034.15,"end":1209.55,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均符合数学规范，无需修改。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1034.15,"text":"And with no assumptions on differentiability or anything. But I think a very good way to think of it, the way I think of it, or my mnemonic for it, if I forget this, I guess I don't forget it. But if I were to forget it, I would simply go back to something like this. You just assume everything is in R1. Assume everything is differentiable. And then you literally just take..."},{"start":1056.93,"text":"you know, go back to your calculus class, differentiate this once, you get h prime of g of x times g prime of x, differentiate it a second time, and you get this thing here. And now we look at that formula, and you take a look at it. And let's do the second one. How about this one? Okay, so, and by the way, these assumptions are going to tell us about the signs of derivatives of order 0, 1, or 2. So let's see how this works. So let's say, let's look at this one. g is concave."},{"start":1085.37,"text":"Well, let's see what that means. Oh, that means that's a negative number, right? I'm going to be, I'm going to be a little, I'm informal, right? I'm not going to distinguish between positive and non-negative and all that stuff. So, so this is negative, okay? Let's look at this. So let's see, h prime of g of x. Well, let's see, let's see what, h is non-increasing, is decreasing, right? So that means h prime of g of x, that's also like less than or equal to zero. And now we're going to use a very deep mathematical fact. You ready?"},{"start":1115.06,"text":"The product of two numbers, each of which is less than or equal to zero, is bigger than or equal to zero. Everybody got that? Extremely deep mathematical principle, right? So literally we're using the dumbest sine arithmetic for multiplication. So this term, with these assumptions here, this term, bigger than or equal to zero. Now let's look at this term. Well, g prime of x squared..."},{"start":1139.24,"text":"Well, any square of anything is going to be non-negative, right? And then we multiply that by h prime prime of g of x. But we're assuming h is convex. That means that h prime prime is non-negative. Everybody got it?"},{"start":1152.48,"text":"So once again, deep mathematical principle, the product of a non-negative number times a square of another number, that's going to be non-negative. And now we're going to use an even more basic fact, which is the sum of two non-negative things is non-negative. Everybody got that? So all of this is non-negative. Oh, but that's f prime prime. That's exactly what it means for f to be convex. Did everybody follow that? I mean, it's kind of a dumb thing, but I wanted to go through it. It doesn't hurt to go through it. Yes?"},{"start":1181.55,"text":"One direction or does it hold the other way as well? It does not hold the other way. So that's a very good question, right? If this composition rule, if the hypothesis of the composition rule holds, you can conclude something is convex. I mean, there's a similar one for concave, right? You can have cases where the composition rule does not hold and yet the function is convex."}],"speech_gaps":[],"frame":"../frames/v004/007.webp","frame_time":1046.15},{"title":"凸函数的复合规则","segments":[{"id":46,"text":"Okay, so that's an example, right? We'll see many examples of that, right? So, okay, everybody got this? Okay, and here's the main one, and actually there's only just one variation on this, and then it's the one that will be a very important part of your life.","zh":"好的，所以这是一个例子，对吧？我们会看到很多这样的例子，对吧？所以，好的，大家明白了吗？好的，这里有一个主要的情况，实际上这只是这个情况的一个变体，而且它将是你们生活中非常重要的一部分。","start":1210.57,"end":1228.85},{"id":47,"text":"So here it is. It says, now what I'm going to do is I'm going to have h has multiple arguments. So h is a convex function on vector arguments, right? And g will have, let's say, k entries. g of x I'm writing for the arguments. These are the entries of g, g1, g2, up to gx, right? And so here's your composition.","zh":"所以这里就是。它说，现在我要做的事情是，我要让h具有多个参数。所以h是在向量参数上的凸函数，对吧？而g将有k个分量。g of x 我是为参数写的。这些是g的分量，g1, g2，一直到gx，对吧？所以这就是你们的复合。","start":1229.28,"end":1251.74},{"id":48,"text":"And let's see what the rule is this. It says that f is convex provided the outer calling function is convex. And then there's two statements here. Although in fact, the stronger statements you can mix them. But here it is. It says, here's one case. It says that h is increasing in all the arguments. And these are all convex.","zh":"让我们看看这个规则是什么。它说，f是凸的，只要外层调用函数是凸的。然后这里有两条陈述。虽然实际上，你可以混合使用更强的陈述。但这里就是。它说，这里有一种情况。它说，h在所有参数上都是递增的。而且这些都是凸的。","start":1254.09,"end":1278.98},{"id":49,"text":"Here's another one. H is decreasing in all of the arguments, and these are all concave. Oh, by the way, here's another one to round it out. H, no conditions on monotonicity on H, but all of the arguments are affine. Everybody got that? Okay, so now it's time for me to tell you the full story. It's actually, I think we have a homework problem on it. I mean, it should honestly have been a problem in the book, but too bad. Then it's this.","zh":"这里还有另一种情况。H在所有参数上都是递减的，而且这些都是凹的。哦，顺便说一句，这里还有一个情况来完善它。H对单调性没有条件，但所有参数都是仿射的。大家明白了吗？好的，现在是时候让我告诉你们完整的规则了。实际上，我认为我们有一个关于它的家庭作业问题。我的意思是，它本来应该在书里作为一个问题出现，但可惜没有。然后它就是这个。","start":1280.16,"end":1308.17},{"id":50,"text":"The most general form says this function is convex provided, now I'll say it, you're going to see this, you're going to live and breathe it for that matter, but it's going to go like this. It says provided H is convex and, now I'm going to iterate over the arguments. For each argument, either A, the argument is affine, in which case there's no monotonicity requirement on H at all. B,","zh":"最一般的形式说，这个函数是凸的，只要现在我要说的，你们会看到它，你们会为它而活，不管怎样，它会是这样的。它说只要H是凸的，现在我要遍历参数。对于每个参数，要么A，该参数是仿射的，在这种情况下，H对单调性没有任何要求。B，","start":1308.81,"end":1336.84},{"id":51,"text":"that argument is convex and H is increasing in that argument. Or C, the argument is concave and H is decreasing in that argument. Okay? So it just mixes, you can just freely mix and match these things. Affine, convex, concave. And monotonicity. Everybody got it? So actually, here's what's weird. That one rule subsumes like basically all the others. Like, let's give a really weird pedantic long proof.","zh":"该参数是凸的，且H在该参数上是递增的。或者C，该参数是凹的，且H在该参数上是递减的。好的？所以它只是混合，你们可以自由地混合和匹配这些情况。仿射、凸、凹。以及单调性。大家明白了吗？所以实际上，这里有一个奇怪的地方。这个规则基本上涵盖了所有其他的规则。比如，让我们给出一个非常奇怪的、繁琐的长证明。","start":1337.83,"end":1367.01}],"notes":["本段讲解了凸函数复合的规则，特别是当外层函数是凸函数时，如何通过内层函数的性质（如单调性、仿射性、凸性或凹性）来判断复合函数是否为凸函数。讲者提到，当外层函数是凸函数时，内层函数的每个参数可以是仿射、凸或凹的，同时外层函数在该参数上是单调递增或递减的，从而保证复合函数的凸性。","讲者强调，这些规则可以混合使用，即对于每个参数，可以选择不同的条件（仿射、凸或凹）和单调性要求，从而构成更一般的复合函数凸性判断方法。这种混合使用的方式使得规则更加灵活，适用于各种情况。","讲者指出，这些规则实际上可以涵盖之前提到的所有情况，包括当外层函数是凸函数且内层函数的参数是仿射、凸或凹的情况。因此，只需记住这一条规则，就可以处理所有可能的复合函数凸性问题。","讲者提到，这些规则在课程中非常重要，甚至可能出现在作业题中。这表明这些规则是凸优化中的核心内容，需要学生熟练掌握。","讲者还提到，这些规则的证明过程可能非常繁琐，但其结论是明确的，即通过外层函数的凸性和内层函数的参数性质，可以判断复合函数的凸性。","讲者最后提到，这些规则的通用性非常强，可以涵盖所有之前提到的特殊情况，因此只需记住这一条规则即可。这表明这些规则是凸优化中的关键概念，需要学生深入理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1210.57,"end":1367.01,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1210.57,"text":"Okay, so that's an example, right? We'll see many examples of that, right? So, okay, everybody got this? Okay, and here's the main one, and actually there's only just one variation on this, and then it's the one that will be a very important part of your life."},{"start":1229.28,"text":"So here it is. It says, now what I'm going to do is I'm going to have h has multiple arguments. So h is a convex function on vector arguments, right? And g will have, let's say, k entries. g of x I'm writing for the arguments. These are the entries of g, g1, g2, up to gx, right? And so here's your composition."},{"start":1254.09,"text":"And let's see what the rule is this. It says that f is convex provided the outer calling function is convex. And then there's two statements here. Although in fact, the stronger statements you can mix them. But here it is. It says, here's one case. It says that h is increasing in all the arguments. And these are all convex."},{"start":1280.16,"text":"Here's another one. H is decreasing in all of the arguments, and these are all concave. Oh, by the way, here's another one to round it out. H, no conditions on monotonicity on H, but all of the arguments are affine. Everybody got that? Okay, so now it's time for me to tell you the full story. It's actually, I think we have a homework problem on it. I mean, it should honestly have been a problem in the book, but too bad. Then it's this."},{"start":1308.81,"text":"The most general form says this function is convex provided, now I'll say it, you're going to see this, you're going to live and breathe it for that matter, but it's going to go like this. It says provided H is convex and, now I'm going to iterate over the arguments. For each argument, either A, the argument is affine, in which case there's no monotonicity requirement on H at all. B,"},{"start":1337.83,"text":"that argument is convex and H is increasing in that argument. Or C, the argument is concave and H is decreasing in that argument. Okay? So it just mixes, you can just freely mix and match these things. Affine, convex, concave. And monotonicity. Everybody got it? So actually, here's what's weird. That one rule subsumes like basically all the others. Like, let's give a really weird pedantic long proof."}],"speech_gaps":[],"frame":"../frames/v004/008.webp","frame_time":1222.57},{"title":"凸函数的和与最大值的凸性证明","segments":[{"id":52,"text":"that the sum of k convex functions is convex, okay? Now, first of all, that's obvious, but let's prove it using this. So I'm going to show that this actually subsumes all the rules you've seen so far. So let's do that, right? So here's my... The way I'm going to do that is I'm going to make up a new function. It's going to be... So h of, let's say, z1 up to zk is going to be this. It's going to be z1. I'm going to add them up, okay? That's my function.","zh":"那么，k个凸函数的和是凸函数，对吧？现在，这看起来很明显，但让我们用这个方法来证明。我将展示这种方法实际上涵盖了你们之前看到的所有规则。让我们这么做，对吧？这里是我的……我将通过构造一个新函数来实现这一点。这个函数是……假设是z1到zk，它将是这样的。它将是z1，我将把它们相加，对吧？这就是我的函数。","start":1367.8,"end":1396.11},{"id":53,"text":"Somebody tell me about curvature of that function. Is it convex? Is it concave? It's both. But I'm doing convex, so it's convex. Now tell me about monotonicity of this function in its arguments. That means if I increase like x1, does that function go up? Z1, does that function go up or down? So it's monotone in all the arguments. Is monotone increasing?","zh":"有人告诉我这个函数的曲率。它是凸的吗？是凹的吗？它两者都是。但我在处理凸函数，所以它是凸的。现在告诉我这个函数在它的参数上的单调性。这意味着如果我增加x1，这个函数会增加吗？z1，这个函数会增加还是减少？所以它在所有参数上都是单调的。是单调递增的吗？","start":1397.23,"end":1425.1},{"id":54,"text":"Here, by the way, that's actually true. It's not just non-decreasing. It's actually increasing. Everybody got it? Okay. Now, I'm going to apply this. I mean, this is ridiculous, but I'm going to apply this fancy theorem. And it says, therefore, if I have, you know, g1 of x up to gk of x, and if these are all convex, then we conclude, using this thing here, that this thing is convex. But that's the sum.","zh":"顺便说一句，这实际上是正确的。它不仅仅是非递减的，它实际上是递增的。大家明白了吗？好的。现在，我将应用这个。我的意思是，这很荒谬，但我将应用这个复杂的定理。它说，因此，如果我有g1(x)到gk(x)，并且这些函数都是凸的，那么利用这个定理，我们可以得出这个函数是凸的。但这就是它们的和。","start":1426.06,"end":1452.52},{"id":55,"text":"Okay? So that's a pedantic, long-winded way to show that the sum of convex functions is convex using the composition rule. We could do it for max. Let's do that just for fun, just to show you that it's the same thing. Here's my function. Okay? So let's talk about H. Tell me about curvature of H. Convex? The max of a bunch of... Yeah, it's convex. Okay? Is it concave?","zh":"明白了吗？所以这是一种繁琐的方式，用组合规则来证明凸函数的和是凸函数。我们也可以用这种方法来处理最大值。让我们这么做，只是为了好玩，只是为了向你们展示它是一样的。这是我的函数，对吧？让我们谈谈H。告诉我H的曲率。凸的吗？一堆函数的最大值……是的，它是凸的。明白了吗？是凹的吗？","start":1453.37,"end":1485.45},{"id":56,"text":"So it's non-increasing. It doesn't have to go up, right? Unless I grab one of the things that's actually active at the max and then I push it up, then the max goes up. Everybody got that?","zh":"所以它是非递增的。它不一定要增加，对吧？除非我抓住其中一个在最大值处活跃的函数，然后把它向上推，那么最大值就会增加。大家明白了吗？","start":1487.09,"end":1506.45},{"id":57,"text":"So it's non-increasing. It doesn't have to go up, right? Unless I grab one of the things that's actually active at the max and then I push it up, then the max goes up. Everybody got that? So, okay. So that, again, this thing applies. And so I didn't really need to show you, you know, I guess if you wanted a minimalist thing, I didn't have to tell you about the sum of convex functions and the max and things like that, right? So, but I think humans think of it more like these things and you sneak up to it, right? So, okay. Everybody.","zh":"所以它是非递增的。它不一定要上升，对吧？除非我抓住其中一个在最大值处起作用的项，然后把它向上推，那么最大值就会上升。大家明白了吗？好的。所以，再次，这个结论适用。因此，我其实不需要向你们展示，你们知道的，如果你们想要一个极简主义的解释，我其实不需要告诉你们关于凸函数的和、最大值之类的内容，对吧？所以，但我认为人类更倾向于把这些事情想象成这样，然后悄悄地接近它，对吧？好的。大家。","start":1506.95,"end":1534.81}],"notes":["本段讲解了凸函数的和的凸性证明，通过构造一个新函数，将多个凸函数相加，利用凸函数的性质证明其和仍然是凸函数。讲者指出，该函数的曲率是凸的，且其单调性为严格递增。","讲者进一步讨论了最大值函数的凸性，指出当函数个数大于1时，最大值函数是凸的，但不是凹的。同时，讲者强调了最大值函数在每个参数上的单调性，即非递减，但并非严格递增。","讲者指出，虽然可以通过直接的定义证明这些性质，但通过使用凸函数的组合规则（如和与最大值）可以更系统地理解这些性质。讲者还提到，人类通常会通过这些基本性质逐步推导出更复杂的结论。","讲者强调了凸函数的和和最大值的凸性，指出这些性质是凸优化中的基本工具，有助于理解更复杂的优化问题。讲者还提到，虽然这些性质看似简单，但通过组合规则可以更深入地理解它们。","讲者通过构造函数和分析其单调性和曲率，展示了如何利用凸函数的性质来证明更复杂的函数的凸性。这种系统的方法有助于理解凸优化中的基本概念。","讲者指出，虽然可以通过直接的定义证明这些性质，但通过组合规则可以更系统地理解这些性质。讲者还提到，人类通常会通过这些基本性质逐步推导出更复杂的结论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1367.8,"end":1534.81,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1367.8,"text":"that the sum of k convex functions is convex, okay? Now, first of all, that's obvious, but let's prove it using this. So I'm going to show that this actually subsumes all the rules you've seen so far. So let's do that, right? So here's my... The way I'm going to do that is I'm going to make up a new function. It's going to be... So h of, let's say, z1 up to zk is going to be this. It's going to be z1. I'm going to add them up, okay? That's my function."},{"start":1397.23,"text":"Somebody tell me about curvature of that function. Is it convex? Is it concave? It's both. But I'm doing convex, so it's convex. Now tell me about monotonicity of this function in its arguments. That means if I increase like x1, does that function go up? Z1, does that function go up or down? So it's monotone in all the arguments. Is monotone increasing?"},{"start":1426.06,"text":"Here, by the way, that's actually true. It's not just non-decreasing. It's actually increasing. Everybody got it? Okay. Now, I'm going to apply this. I mean, this is ridiculous, but I'm going to apply this fancy theorem. And it says, therefore, if I have, you know, g1 of x up to gk of x, and if these are all convex, then we conclude, using this thing here, that this thing is convex. But that's the sum."},{"start":1453.37,"text":"Okay? So that's a pedantic, long-winded way to show that the sum of convex functions is convex using the composition rule. We could do it for max. Let's do that just for fun, just to show you that it's the same thing. Here's my function. Okay? So let's talk about H. Tell me about curvature of H. Convex? The max of a bunch of... Yeah, it's convex. Okay? Is it concave?"},{"start":1487.09,"text":"No, not in this case. Well, okay, if k is bigger than 1, it's not concave. It's not affine, it's not concave. Okay, tell me about monotonicity of that function. It's non-decreasing in each argument. In other words, if I increase any argument of the max, the max, it can't go down."},{"start":1506.95,"text":"So it's non-increasing. It doesn't have to go up, right? Unless I grab one of the things that's actually active at the max and then I push it up, then the max goes up. Everybody got that? So, okay. So that, again, this thing applies. And so I didn't really need to show you, you know, I guess if you wanted a minimalist thing, I didn't have to tell you about the sum of convex functions and the max and things like that, right? So, but I think humans think of it more like these things and you sneak up to it, right? So, okay. Everybody."}],"speech_gaps":[],"frame":"../frames/v004/009.webp","frame_time":1379.8},{"title":"凸函数的组合规则与示例","segments":[{"id":58,"text":"Good. So, I mean, here would be, you know, something that's not totally obvious is log sum exp of a bunch of convex functions is convex, right? Or you might say this, the soft max of a bunch of convex functions is convex. These could be losses when you're fitting a statistical model and this says that the log sum exp is a convex function, okay?","zh":"好的。所以，我意思是，这里会有一些不太明显的事情，比如，多个凸函数的对数求和指数（log sum exp）是凸的，对吧？或者你可能会说，多个凸函数的软最大值（softmax）也是凸的。这些可能是在拟合统计模型时的损失函数，这说明对数求和指数是一个凸函数，对吧？","start":1537.07,"end":1564.21},{"id":59,"text":"Why? Because log sum exp is A, convex, B, increasing in all arguments, and therefore, the arguments could be replaced with convex functions. Everybody got this? So this is the composition rule. It's extremely important. And also, you know, I mean, maybe I'm getting a little bit ahead of myself, but...","zh":"为什么？因为对数求和指数是A，凸的，B，所有参数都是递增的，因此，参数可以被替换为凸函数。大家明白了吗？这就是组合规则。它极其重要。而且，说实话，也许我有点超前了，但……","start":1565.39,"end":1588.7},{"id":60,"text":"This is actually, you can almost easily, very easily imagine something like this in some object-oriented system, right? Where it would do very cool things like, you know, to check F, you just walk, you literally walk the expression tree, right? You look at F, you look, actually all you have to do is ask, you know, tell me your curvature and monotonicity.","zh":"实际上，你几乎可以很容易地在一些面向对象系统中想象出类似的东西，对吧？它会做一些很酷的事情，比如，要检查F，你只需遍历表达式树，对吧？你查看F，实际上你只需要问，你知道，告诉我你的曲率和单调性。","start":1588.97,"end":1614.05},{"id":61,"text":"And it would say something like, I'm convex and I am monotone decreasing. Then you get something for each argument. Then you literally iterate over the arguments and call the same method on each of the children in the expression tree. And this gives you, in a real language, one line that would allow you to actually parse and verify whether an entire expression satisfies.","zh":"它会说一些像“我是凸的，而且我是单调递减的”这样的话。然后你为每个参数得到一个结果。然后你只需遍历参数，并在表达式树的每个子节点上调用相同的方法。这在实际语言中，可以让你用一行代码来解析并验证整个表达式是否满足。","start":1614.44,"end":1642.22},{"id":62,"text":"satisfies this, which means that expression is convex. The converse is false, of course, right? That it can fail, the composition rule can fail, and yet an expression can be convex. Okay, so I'm actually getting ahead of myself, but this is already starting to get, it's close to super useful and interesting. Okay, yeah.","zh":"满足这个条件，这意味着该表达式是凸的。当然，逆命题是不成立的，对吧？也就是说，组合规则可能失败，但表达式仍可能是凸的。好的，所以我实际上有点超前了，但这已经开始变得非常有用和有趣了。好的，是的。","start":1643.65,"end":1665.07},{"id":63,"text":"Oh, yeah. So that's just... I mean, you just have to show it, right? That the max function is convex, right? I mean, this is circular, but I could say it's the max of a bunch of linear functions, which is x1, x2. But that's weird because that's what we're trying to show here. So you'd actually just have to show that. Yeah. I mean, for things that simple, you could actually do something. You could take... Give me an x. Give me a y. Give me a theta between 0 and 1. And then just...","zh":"哦，是的。所以这只是……我意思是，你只需要证明它，对吧？最大函数是凸的，对吧？我意思是，这有点循环，但我可以说它是多个线性函数的最大值，比如x1，x2。但这很奇怪，因为这就是我们在这里试图证明的东西。所以你实际上只需要证明这一点。是的。我意思是，对于这么简单的东西，你实际上可以做点什么。你可以给我一个x。给我一个y。给我一个0到1之间的theta。然后……","start":1669.38,"end":1698.34}],"notes":["本段讲解了凸函数的组合规则，特别是log-sum-exp函数的凸性。讲者指出，log-sum-exp是凸函数，因为它由凸函数的组合构成，并且是所有参数的单调递增函数。这一性质在统计模型的损失函数中尤为重要。","讲者进一步说明了组合规则的重要性，并提到可以通过对象导向系统来实现这一规则。系统会遍历表达式树，检查每个函数的曲率和单调性，从而验证整个表达式是否为凸函数。","讲者指出，组合规则的逆命题不成立，即即使组合规则失败，表达式仍可能是凸的。这表明组合规则是充分但非必要的条件。","讲者提到，对于简单的函数如max函数，可以通过直接证明其凸性来验证。然而，这种直接证明可能显得循环，因为max函数本身是线性函数的凸组合。","讲者还提到，可以通过给定具体的x、y和θ值来验证函数的凸性，这为实际应用提供了方法论上的指导。","讲者强调了凸函数组合规则在实际应用中的重要性，特别是在构建和验证复杂表达式时，这一规则能够提供有效的验证手段。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1537.07,"end":1698.34,"asr_flags":[],"math_clarifications":["原始片段中未提供完整的数学表达式，仅提及了'log sum exp'和'max'等术语，但未给出具体的数学公式或上下文，因此无法进行有效的数学校对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1537.07,"text":"Good. So, I mean, here would be, you know, something that's not totally obvious is log sum exp of a bunch of convex functions is convex, right? Or you might say this, the soft max of a bunch of convex functions is convex. These could be losses when you're fitting a statistical model and this says that the log sum exp is a convex function, okay?"},{"start":1565.39,"text":"Why? Because log sum exp is A, convex, B, increasing in all arguments, and therefore, the arguments could be replaced with convex functions. Everybody got this? So this is the composition rule. It's extremely important. And also, you know, I mean, maybe I'm getting a little bit ahead of myself, but..."},{"start":1588.97,"text":"This is actually, you can almost easily, very easily imagine something like this in some object-oriented system, right? Where it would do very cool things like, you know, to check F, you just walk, you literally walk the expression tree, right? You look at F, you look, actually all you have to do is ask, you know, tell me your curvature and monotonicity."},{"start":1614.44,"text":"And it would say something like, I'm convex and I am monotone decreasing. Then you get something for each argument. Then you literally iterate over the arguments and call the same method on each of the children in the expression tree. And this gives you, in a real language, one line that would allow you to actually parse and verify whether an entire expression satisfies."},{"start":1643.65,"text":"satisfies this, which means that expression is convex. The converse is false, of course, right? That it can fail, the composition rule can fail, and yet an expression can be convex. Okay, so I'm actually getting ahead of myself, but this is already starting to get, it's close to super useful and interesting. Okay, yeah."},{"start":1669.38,"text":"Oh, yeah. So that's just... I mean, you just have to show it, right? That the max function is convex, right? I mean, this is circular, but I could say it's the max of a bunch of linear functions, which is x1, x2. But that's weird because that's what we're trying to show here. So you'd actually just have to show that. Yeah. I mean, for things that simple, you could actually do something. You could take... Give me an x. Give me a y. Give me a theta between 0 and 1. And then just..."}],"speech_gaps":[],"frame":"../frames/v004/010.webp","frame_time":1549.07},{"title":"凸函数的复合性质与例子","segments":[{"id":64,"text":"you know, write it down. And actually in that case, in about two lines later, you will have what you want. So, okay. Yes? Where? No, that's correct. Yeah. So let me explain why. Oh, sorry. That's a very good point. I didn't say this. So by flipping the sign here, you get a similar composition theorem for concavity.","zh":"你知道，把它写下来。实际上在这种情况下，大约两行之后，你就会得到你想要的东西。所以，好的。是的？哪里？不，这是正确的。是的。让我解释一下原因。哦，抱歉。这是一个非常好的问题。我之前没有提到这一点。通过在这里改变符号，你可以得到一个关于凹函数的类似复合定理。","start":1698.6,"end":1729.47},{"id":65,"text":"Because something is convex if minus f, something is concave if its negative is convex. Then you apply this rule. But when I negate a function, all sorts of weird stuff happens, like its monotonicity switches. If it was increasing before, now it's decreasing. And its curvature switches. Yeah, so this one is using an analogous composition rule for concave.","zh":"因为如果某个函数是凸的，那么它的负函数就是凹的；如果某个函数的负函数是凸的，那么它就是凹的。然后你应用这个规则。但当我对一个函数取负时，会发生各种奇怪的事情，比如它的单调性会改变。如果它之前是递增的，现在就变成递减的。它的曲率也会改变。是的，所以这里使用的是凹函数的类似复合规则。","start":1729.95,"end":1756.37},{"id":66,"text":"So let me explain that. A concave increasing function of a concave function is concave. A convex increasing function of a convex function is convex. That's for when you have one argument. Then we can do the case with multiple arguments. If you want, let's actually just do one for fun that's not obvious. So here's a function.","zh":"让我解释一下。一个凹函数的递增函数仍然是凹的。一个凸函数的递增函数仍然是凸的。这是当有一个自变量时的情况。然后我们可以处理多个自变量的情况。如果你想，我们可以做其中一个有趣的例子，它看起来不那么明显。这里有一个函数。","start":1756.94,"end":1784.71},{"id":67,"text":"This is x squared over y, and the domain is going to be y positive. So this is the simplest function that most people on the streets would not know is convex. So this is convex. Let's talk about monotonicity. Is it monotone in x? That's its first argument. Is it? I don't think so. Because x squared, it actually has a negative slope if x is negative.","zh":"这是 x 平方除以 y，定义域是 y 正数。这是最简单的一个函数，大多数人在街上可能不知道它是凸的。所以这个函数是凸的。让我们讨论一下单调性。它在 x 上是单调的吗？这是它的第一个自变量。是吗？我不这么认为。因为 x 平方，如果 x 是负数的话，它实际上具有负的斜率。","start":1786.4,"end":1820.69},{"id":68,"text":"Yeah, by the way, if x is non-negative, then this is monotone increasing in x. Okay? Everybody? Okay. What is its monotonicity in y? It's what? It's decreasing. Okay. So what this means is, if I want to satisfy those rules, it says I can replace x with an affine expression.","zh":"顺便说一句，如果 x 是非负的，那么它在 x 上是单调递增的。好的？大家明白吗？好的。它在 y 上的单调性是什么？是的，它是递减的。好的。这意味着，如果我想满足这些规则，它说明我可以将 x 替换为一个仿射表达式。","start":1821.48,"end":1850.73}],"notes":["本段讲解了凸函数与凹函数之间的关系，指出如果一个函数的负函数是凸函数，那么原函数就是凹函数。同时，当对函数取负时，其单调性和曲率都会发生变化，例如单调性会从递增变为递减，曲率也会改变。这说明在处理函数的复合性质时，需要特别注意这些变化。","接着，讲者通过一个具体的例子来说明凸函数的复合性质，即函数 $ f(x, y) = \frac{x^2}{y} $，其中 $ y > 0 $。这个函数虽然看起来简单，但大多数人并不知道它是凸函数。讲者指出，该函数在 $ x $ 上的单调性取决于 $ x $ 的正负，当 $ x $ 为非负时，函数在 $ x $ 上是单调递增的，而在 $ y $ 上是单调递减的。","讲者进一步说明，当处理具有多个变量的函数时，可以使用类似的方法来判断其凸性。例如，如果一个函数是凸函数，并且其单调性为递增，那么其复合函数仍然是凸函数。同样，如果一个函数是凹函数，并且其单调性为递增，那么其复合函数仍然是凹函数。","最后，讲者提到，如果一个函数满足某些规则，那么可以将变量替换为仿射表达式，从而简化问题。这表明在处理凸函数的复合问题时，可以通过替换变量来保持函数的凸性。","在讲解过程中，讲者强调了函数的单调性和曲率在取负后会发生变化，这需要特别注意。同时，通过具体的例子，如 $ f(x, y) = \frac{x^2}{y} $，帮助学生理解凸函数的性质和判断方法。","讲者还指出，虽然 $ f(x, y) = \frac{x^2}{y} $ 在 $ x $ 上的单调性取决于 $ x $ 的正负，但在 $ y $ 上始终是单调递减的。这说明在处理多变量函数时，需要分别分析每个变量的影响。"],"formulas":[{"latex":"f(x, y) = \\frac{x^2}{y}","symbols":"函数 $ f(x, y) $ 表示 $ x $ 平方除以 $ y $","explanation":"公式正确，未发现数学错误。","evidence":"This is x squared over y, and the domain is going to be y positive. So this is the simplest function that most people on the streets would not know is convex. So this is convex. Let's talk about monotonicity. Is it monotone in x? That's its first argument. Is it? I don't think so. Because x squared, it actually has a negative slope if x is negative."}],"uncertainties":[],"diagram":"none","start":1698.6,"end":1850.73,"asr_flags":[],"math_clarifications":["公式 $ f(x, y) = \\frac{x^2}{y} $ 正确表达了 $ x $ 平方除以 $ y $ 的函数形式，未发现数学错误。"],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1698.6,"text":"you know, write it down. And actually in that case, in about two lines later, you will have what you want. So, okay. Yes? Where? No, that's correct. Yeah. So let me explain why. Oh, sorry. That's a very good point. I didn't say this. So by flipping the sign here, you get a similar composition theorem for concavity."},{"start":1729.95,"text":"Because something is convex if minus f, something is con
