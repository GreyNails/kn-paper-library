ht. So."},{"start":2628.06,"text":"And you may know that it's a basic fact of linear algebra that if a matrix is positive semidefinite, so is a sure complement, right? Or positive definite or negative. Okay, everybody got this? Okay, that's the minimization rule. Now we get to the perspective rule."},{"start":2647.41,"text":"And so this is related, if you remember, the perspective mapping takes a vector with the last entry positive and divides everything by it. And then we looked at like linear fractional mappings and I mumbled about how that's basically the actual generic mapping you have in vision. Like if you have a camera system that looks at 3D and you look at the actual image you get on the sensor, which is 2D, it's actually got this perspective mapping in it, right? Okay."}],"speech_gaps":[],"frame":"../frames/v004/016.webp","frame_time":2512.77},{"title":"函数的视角与共轭函数","segments":[{"id":111,"text":"So the perspective of a function is this. It is, you take a function f, and it's a function now of a new variable, which is going to be positive and a scalar. So g of x and t is t f of x over t, right? So that's called the perspective. Here's the cool part. If a function is convex, so is its perspective."},{"id":112,"text":"Okay. And again, this is not, that one is not totally straightforward to show, but it's true. So, and this is, this is not, this one is, this is just not obvious. Okay. So let's look at some examples. Oh, here's one. X transpose X is the sum of the squares of a vector, of the entries of a vector. It's convex. Okay. Well, let's figure out what is the, what you do is you just plug in."},{"id":113,"text":"Wherever you see x, plug in x over t here. So you have x over t transpose x over t. So that becomes x transpose x divided by t squared. And then you multiply it by t in the front, and you get this. And you go, hey, that's cool. You know what that is? That's sum xi squared over t. So it's a sum of these quadratic over linear functions, which you know to be convex."},{"id":114,"text":"So but you found that out without any of the pain or something like that. I mean, actually, we showed that by I think I think there we resorted to Hessians. Right. So, OK, here's one. Let's take the negative logarithm. That's convex. Right. Because the log is concave. So we take negative logarithm and then let's form the if we form the perspective of this, it's."},{"id":115,"text":"And then from that, it would be related to things like KL divergence and all sorts of other stuff. I mean, it doesn't matter if you haven't seen these functions before. But that just gives you a real quick way to show that some of these, that these functions are convex. Everybody got this? So, okay."},{"id":116,"text":"And let's see. So I think I'll... Anyway, so that's it. And by the way, sometimes this actually has very interesting practical interpretations of what g x over t is. We'll assign some homework problems that show you where it would come up in various practical things. I mean, aside from vision or something like that. Okay."},{"id":117,"text":"Okay. Next up is conjugate. And I understand all of these are completely without context. So, like, if you're asking, like, who cares about this? Completely reasonable question to ask. Totally reasonable. But anyway, and my answer to that is you will in the next couple weeks. And also, once you see these things, you will start seeing them everywhere you go, like in your other classes and things like that."}],"notes":["本段讲解了函数的视角（perspective）概念，即对于一个函数f，其视角函数g(x, t)定义为t f(x/t)，其中t为正标量。如果原函数f是凸函数，那么其视角函数g也是凸函数。这一性质在优化问题中具有重要意义，因为它允许我们通过视角变换来构造新的凸函数。","接着，讲者通过具体例子说明了视角函数的构造过程。例如，对于函数x^T x（向量的平方和），通过将x替换为x/t并乘以t，得到x^T x / t^2 * t = x^T x / t，这实际上是一个二次函数除以线性函数，属于凸函数。这一过程展示了视角函数如何保持凸性。","讲者还提到，负对数函数是凸函数，因为对数函数是凹函数。通过构造其视角函数，可以得到相对熵（relative entropy），这与KL散度密切相关。这一例子说明了视角函数在信息论和优化中的应用。","讲者强调，虽然这些概念可能在初次接触时显得抽象，但它们在后续课程中会频繁出现，并且在其他课程中也会广泛使用。因此，理解这些概念对于后续学习至关重要。","此外，讲者提到视角函数在实际问题中有重要的应用，例如在计算机视觉等领域。通过布置作业题，学生可以进一步理解视角函数在实际问题中的具体应用。","最后，讲者介绍了共轭函数（conjugate function）的概念，并指出虽然当前讲解缺乏上下文，但这些概念将在后续课程中变得重要。共轭函数是凸优化中的核心工具，用于对偶问题的构造和分析。"],"formulas":[{"latex":"x^T x / t^2","symbols":"通过视角变换得到的函数形式","explanation":"原始公式中缺少分母的平方，导致表达不准确。修正为 x^T x / t^2，符合视角变换的数学定义。","evidence":"Wherever you see x, plug in x over t here. So you have x over t transpose x over t. So that becomes x transpose x divided by t squared. And then you multiply it by t in the front, and you get this. And you go, hey, that's cool. You know what that is? That's sum xi squared over t. So it's a sum of these quadratic over linear functions, which you know to be convex."},{"latex":"-t \\log \\left(\\frac{x}{t}\\right)","symbols":"负对数函数的视角形式，与相对熵相关","explanation":"原始公式中缺少括号，导致表达不清晰。修正为 -t log(x/t)，符合视角函数的定义。","evidence":"So but you found that out without any of the pain or something like that. I mean, actually, we showed that by I think I think there we resorted to Hessians. Right. So, OK, here's one. Let's take the negative logarithm. That's convex. Right. Because the log is concave. So we take negative logarithm and then let's form the if we form the perspective of this, it's."}],"uncertainties":[],"diagram":"none","start":2675.79,"end":2853.91,"asr_flags":[],"math_clarifications":["原始公式中存在括号缺失和表达不清晰的问题，需要修正以确保数学表达的准确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2675.79,"text":"So the perspective of a function is this. It is, you take a function f, and it's a function now of a new variable, which is going to be positive and a scalar. So g of x and t is t f of x over t, right? So that's called the perspective. Here's the cool part. If a function is convex, so is its perspective."},{"start":2702.86,"text":"Okay. And again, this is not, that one is not totally straightforward to show, but it's true. So, and this is, this is not, this one is, this is just not obvious. Okay. So let's look at some examples. Oh, here's one. X transpose X is the sum of the squares of a vector, of the entries of omes up in lots of other fields, too. I mean, statistics, probability, I go on and on and on. Let me ask, ah, when you use the language conjugate, it conjures up..."},{"id":140,"text":"certain ideas like because conjugate is used in math and lots of cases and Mostly, I mean here's one complex conjugate of a complex number, right? Okay, so Hermitian conjugate of a complex matrix, right? These are these are conjugate. These are types of conjugates What's an at what is an attribute you think of when someone uses the the conjugate word? What's that? I Miss that it's reversible. Yeah"}],"notes":["本段讲解了共轭函数的基本概念，即共轭函数是作为最优利润函数的函数价格。生产成本由f(x)表示，市场价格由y表示，总收入为y^T x，利润为总收入减去生产成本。共轭函数的定义是利润函数在价格上的最优值。","讲者提到共轭函数在多个领域都有应用，如统计学和概率论，但当前主要关注其在优化问题中的意义。共轭函数的图形解释是通过移动一条线直到它与函数图像相切，此时切点对应于共轭函数的负值。","讲者指出，共轭函数的图形解释可能对理解有帮助，但个人认为图形解释对理解帮助不大。共轭函数的定义和应用将在后续课程中进一步展开。","讲者提到共轭函数在数学中的其他应用，如复数的共轭和矩阵的共轭转置。共轭函数的一个属性是可逆性，即共轭操作可以被逆操作恢复。","讲者在讲解过程中提到，共轭函数的定义和应用需要结合具体问题进行理解，不能仅凭术语本身来判断其意义。共轭函数的图形解释和数学定义是理解其意义的关键。","讲者强调，共轭函数在优化问题中的重要性，特别是在处理凸函数和对偶问题时。共轭函数的定义和应用需要结合具体问题进行深入理解。"],"formulas":[{"latex":"f^*(y) = \\text{sup}_{x} (y^T x - f(x))","symbols":"f^*(y) 表示函数 f 的共轭函数，y 是价格向量，x 是生产量向量","explanation":"公式正确，符合共轭函数的定义，即对于给定的 y，共轭函数是 y^T x - f(x) 的上确界。","evidence":"Y transpose X is your gross revenue for the products you've made. Everybody got this? Okay, so this is your profit. It's your gross revenue minus the cost to actually produce those things. Everybody following this? So the conjugate then is very simple. It is the optimal profit as a function of the prices. Everybody?"}],"uncertainties":["What's an at what is an attribute you think of when someone uses the the conjugate word? What's that? I Miss that it's reversible. Yeah"],"diagram":"none","start":3006.87,"end":3182.52,"asr_flags":[],"math_clarifications":["公式正确，无需额外说明。"],"raw_segments":[{"start":3006.87,"text":"Okay, so it's a vector of, you have like n different products, and you're going to produce x1 of product 1, x2, and so on. Everybody got it? That is going to cost you f of x. Okay, so that is your production cost for producing, you know, so many tons of this, you know, so many units of that, and so on. Everybody got it? Okay, y we interpret as the market prices. Okay, so these are the, y1 through yn are the prices for products 1 through n."},{"start":3036.75,"text":"Y transpose X is your gross revenue for the products you've made. Everybody got this? Okay, so this is your profit. It's your gross revenue minus the cost to actually produce those things. Everybody following this? So the conjugate then is very simple. It is the optimal profit as a function of the prices. Everybody?"},{"start":3066.25,"text":"Got this? We're going to come back to this in much more detail, but maybe just planting some of these seeds in your head is not at all a bad thing right now. Okay? So that's the conjugate. What's that? Okay. Good. Everybody got it? So, I mean, other than that, it has no meaning right now. It's going to have a meaning later. Don't worry. Yeah. What's that? Yeah, I could. Yeah, yeah. So what you do,"},{"start":3097.9,"text":"If you want to do this graphically, here's f here. And what you do is you form x, y. That's this line here. That's this line, right? And then what you're doing is you move this line up and down until it just touches the graph. And then it turns out that point right there is the negative of the conjugate. So that's the graphical interpretation. I mean, if that helps you."},{"start":3127.82,"text":"I think I've decided it doesn't really help me, the graph, so it's fine. Okay, so that's the conjugate. By the way, this comes up in lots of other fields, too. I mean, statistics, probability, I go on and on and on. Let me ask, ah, when you use the language conjugate, it conjures up..."},{"start":3152.67,"text":"certain ideas like because conjugate is used in math and lots of cases and Mostly, I mean here's one complex conjugate of a complex number, right? Okay, so Hermitian conjugate of a complex matrix, right? These are these are conjugate. These are types of conjugates What's an at what is an attribute you think of when someone uses the the conjugate word? What's that? I Miss that it's reversible. Yeah"}],"speech_gaps":[],"frame":"../frames/v004/019.webp","frame_time":3018.87},{"title":"共轭函数与凸包","segments":[{"id":141,"text":"Yeah, okay. Let's be a little bit more specific. How do you reverse it? I like that. Right? So, typically, when you use the word conjugate, there's sort of an implication that the conjugate of the conjugate is the original thing. Everybody got that? So, the conjugate of the conjugate of a complex number is the same number back again. Right? Because you switch the sign on the imaginary part and then you do it again. Okay."},{"id":142,"text":"Do you think it's true that the conjugate of a conjugate of a function is the function? Why not? Yeah, but take it one more step. F star is convex, so F star star is convex. So if F was not convex to start with, like this function here, then there's no way F star star equals F. You're right. Actually, F star star is a really cool thing. It's called the convex envelope."},{"id":143,"text":"of a function. So it's the largest convex function that fits under it. So I'll just draw that. This is advanced and I probably shouldn't be going there right now, but too late now. So here's your function. And I'll show you what f star star is. It's called the convex envelope or lots of other things. It's actually this function. It's really cool. It is the largest convex function that fits under this thing. And it's going to be this. It's going to look like that."},{"id":144,"text":"then it's going to go like that, and then it's going to go up like that. Or here's a really cool way to say it. If you take the epigraph of the function, that's everything up here, then take the convex hull of the epigraph, that's this thing, that's the epigraph of f star star, which is the conjugate. Sorry, this is too advanced. I didn't mean to go there. But it is kind of cool, so I don't mind mentioning it. Yes?"},{"id":145,"text":"It's convex is f star star the same as f. Yes. Awesome. Yes. So if f is convex and there's a small technical condition, then f star star is f. Right. And that's going to be the basis of a whole lot of different things and interesting stuff. Okay. So let's look at some examples. How do you work out the conjugates? A lot of times you just have to get your hands dirty and figure out."},{"id":146,"text":"how to solve this. You know, it's defined by this optimization problem where you maximize. And so, for example, let's find, here's the negative logarithm. Let's find the conjugate of it. Well, you have to maximize over y, which is a scalar, xy plus log x. And, you know, honestly, the way you do this, you just draw some pictures and you will find out, for example, if y is zero or bigger, this supremum is infinity. Because, well, look, if y is three,"}],"notes":["本段讨论了共轭函数的性质，指出共轭函数的共轭不一定等于原函数，只有当原函数是凸函数时，其共轭的共轭才等于原函数。这是凸优化中的一个重要概念，称为共轭函数的对偶性。","讲者提到共轭函数的共轭被称为凸包（convex envelope），即在原函数下方的最大凸函数。这是通过取原函数的上包络线（epigraph）并求其凸包得到的。","讲者进一步解释了如何通过上包络线和凸包的定义来理解共轭函数的性质，这涉及到凸函数的几何特性。","讲者以负对数函数为例，说明如何计算共轭函数，指出当y为正时，最大值可能趋于无穷大，这表明共轭函数的计算需要仔细分析优化问题。","讲者强调了共轭函数在凸优化中的重要性，特别是在对偶问题和优化算法设计中的应用。","讲者提到，共轭函数的计算通常需要通过优化问题来求解，这需要结合数学分析和几何直观。"],"formulas":[],"uncertainties":["f^{**}(x) 的具体定义可能需要更精确的数学表达式，但讲者未明确给出完整的公式。"],"diagram":"convex","start":3183.34,"end":3363.25,"asr_flags":[],"math_clarifications":["共轭函数的共轭（f^{**}）的定义应涉及一个优化问题，即最大化 xy - f(y)（或类似形式），而不是简单地提到 supremum。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3183.34,"text":"Yeah, okay. Let's be a little bit more specific. How do you reverse it? I like that. Right? So, typically, when you use the word conjugate, there's sort of an implication that the conjugate of the conjugate is the original thing. Everybody got that? So, the conjugate of the conjugate of a complex number is the same number back again. Right? Because you switch the sign on the imaginary part and then you do it again. Okay."},{"start":3215.05,"text":"Do you think it's true that the conjugate of a conjugate of a function is the function? Why not? Yeah, but take it one more step. F star is convex, so F star star is convex. So if F was not convex to start with, like this function here, then there's no way F star star equals F. You're right. Actually, F star star is a really cool thing. It's called the convex envelope."},{"start":3248.74,"text":"of a function. So it's the largest convex function that fits under it. So I'll just draw that. This is advanced and I probably shouldn't be going there right now, but too late now. So here's your function. And I'll show you what f star star is. It's called the convex envelope or lots of other things. It's actually this function. It's really cool. It is the largest convex function that fits under this thing. And it's going to be this. It's going to look like that."},{"start":3278.0,"text":"then it's going to go like that, and then it's going to go up like that. Or here's a really cool way to say it. If you take the epigraph of the function, that's everything up here, then take the convex hull of the epigraph, that's this thing, that's the epigraph of f star star, which is the conjugate. Sorry, this is too advanced. I didn't mean to go there. But it is kind of cool, so I don't mind mentioning it. Yes?"},{"start":3305.96,"text":"It's convex is f star star the same as f. Yes. Awesome. Yes. So if f is convex and there's a small technical condition, then f star star is f. Right. And that's going to be the basis of a whole lot of different things and interesting stuff. Okay. So let's look at some examples. How do you work out the conjugates? A lot of times you just have to get your hands dirty and figure out."},{"start":3335.59,"text":"how to solve this. You know, it's defined by this optimization problem where you maximize. And so, for example, let's find, here's the negative logarithm. Let's find the conjugate of it. Well, you have to maximize over y, which is a scalar, xy plus log x. And, you know, honestly, the way you do this, you just draw some pictures and you will find out, for example, if y is zero or bigger, this supremum is infinity. Because, well, look, if y is three,"}],"speech_gaps":[],"frame":"../frames/v004/020.webp","frame_time":3195.34},{"title":"凸函数的广义概念","segments":[{"id":147,"text":"It's ridiculous. What happens is this thing is monotone increasing in y and you've been asked to maximize it. So, you know, so you get plus infinity. If y is negative, it's not. And you just draw a picture and take a derivative and you can work out what it is. I'm not going to do that, but you get something like this. So, you know, roughly speaking, the conjugate of a log looks like a log. I mean, the sign got flipped and there's a minus one offset, but that's that."},{"id":148,"text":"If you have a quadratic form, 1 half x transpose qx with a positive definite q, then it turns out that the conjugate is really cool. It's also a quadratic form given by the inverse matrix. Okay? So, everybody got this? So, these are just like kind of basic things. Okay. We're now going to cover two more..."},{"id":149,"text":"Generalizations of convexity. So first, let me give you some background, right? That, you know, there's a whole sub-industry in math of generalizing convexity. And you have pseudo-convexity and quasi-convexity. And I don't know, there's all these different types of generalizations. And, you know, it's totally fine. It's not hurting anybody."},{"id":150,"text":"Then usually on page 300 of the book, you'll get this horrible diagram that says if something is quasi-convex and triple pseudo-convex and blah, blah, blah, then it's also this. And it's a big diagram that shows you all this. What we're going to do here is we've selected the two generalizations that are actually useful. And they are quasi-convexity. That's this one."},{"id":151,"text":"And we're going to talk about one more, which is log convexity, which is almost kind of not quite a generalization, but it is kind of. Okay, but this one is. So that's what we're going to do. So I'm just saying if you go to Wikipedia and type in quasi-convexity, you'll find out there's pseudo-convex, and then someone showed that if it's pseudo-convex and blah, blah, blah, blah, blah, then it has to be, anyway, it's very complicated. So, okay, here it is."},{"id":152,"text":"A function is quasi-convex if its sublevel sets are all convex. Period. Oh, another name for this is unimodal. So that's a very common name. Okay? And here's an example of a function in R. It's definitely not convex. I mean, look, there's negative curvature right there. Okay? So that's not convex. It is quasi-convex. And the way you check if it's quasi-convex is you just take your level set. Like, what is the sublevel set for this level?"}],"notes":["本段主要讲解了凸函数的广义概念，包括伪凸性和拟凸性。教授指出，数学中存在大量关于凸函数的广义概念，如伪凸性和拟凸性，这些概念虽然复杂，但并不影响其有效性。","教授提到，拟凸函数的定义是其所有下水平集都是凸集。此外，拟凸函数也被称为单峰函数，这在实际应用中非常常见。","教授通过一个例子说明了拟凸函数的特性，指出该函数在实数域上不是凸函数，但具有负曲率，因此不是凸函数，但它是拟凸函数。","教授强调，判断一个函数是否为拟凸函数的方法是检查其下水平集是否为凸集。这为后续的凸优化问题提供了理论基础。","教授还提到，拟凸性与伪凸性之间存在一定的联系，但具体关系较为复杂，需要进一步研究。","教授指出，拟凸性是凸优化中的一个重要概念，它在实际问题中具有广泛的应用价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3363.92,"end":3525.96,"asr_flags":[151],"raw_segments":[{"start":3363.92,"text":"It's ridiculous. What happens is this thing is monotone increasing in y and you've been asked to maximize it. So, you know, so you get plus infinity. If y is negative, it's not. And you just draw a picture and take a derivative and you can work out what it is. I'm not going to do that, but you get something like this. So, you know, roughly speaking, the conjugate of a log looks like a log. I mean, the sign got flipped and there's a minus one offset, but that's that."},{"start":3391.02,"text":"If you have a quadratic form, 1 half x transpose qx with a positive definite q, then it turns out that the conjugate is really cool. It's also a quadratic form given by the inverse matrix. Okay? So, everybody got this? So, these are just like kind of basic things. Okay. We're now going to cover two more..."},{"start":3419.52,"text":"Generalizations of convexity. So first, let me give you some background, right? That, you know, there's a whole sub-industry in math of generalizing convexity. And you have pseudo-convexity and quasi-convexity. And I don't know, there's all these different types of generalizations. And, you know, it's totally fine. It's not hurting anybody."},{"start":3443.68,"text":"Then usually on page 300 of the book, you'll get this horrible diagram that says if something is quasi-convex and triple pseudo-convex and blah, blah, blah, then it's also this. And it's a big diagram that shows you all this. What we're going to do here is we've selected the two generalizations that are actually useful. And they are quasi-convexity. That's this one."},{"start":3470.81,"text":"And we're going to talk about one more, which is log convexity, which is almost kind of not quite a generalization, but it is kind of. Okay, but this one is. So that's what we're going to do. So I'm just saying if you go to Wikipedia and type in quasi-convexity, you'll find out there's pseudo-convex, and then someone showed that if it's pseudo-convex and blah, blah, blah, blah, blah, then it has to be, anyway, it's very complicated. So, okay, here it is."},{"start":3498.68,"text":"A function is quasi-convex if its sublevel sets are all convex. Period. Oh, another name for this is unimodal. So that's a very common name. Okay? And here's an example of a function in R. It's definitely not convex. I mean, look, there's negative curvature right there. Okay? So that's not convex. It is quasi-convex. And the way you check if it's quasi-convex is you just take your level set. Like, what is the sublevel set for this level?"}],"speech_gaps":[],"frame":"../frames/v004/021.webp","frame_time":3375.92},{"title":"凸函数与次级集的性质","segments":[{"id":153,"text":"What is the set of x for which the function is smaller than this value? No, I'm down here. It's empty. See, it's the empty set. Is the empty set convex? Yeah, so that's cool. If I put something that just touches the bottom of this, I get a singleton, the minimizer. That's convex. Now, as I raise this level,"},{"id":154,"text":"you get an interval, but intervals are convex. What happens is if I raise it at the value beta, I get a half infinite interval, right? That's also convex, right? So unimodal is another name for it. And basically for a function of one variable, something is quasi-convex. If roughly speaking, you know, it's decreasing, there's a point where it's decreasing up to that point and then increasing above it."},{"id":155,"text":"Okay? It's also more interesting in the vector case, right? Yeah. What's a half-infinite interval? It is this. It would look like something like this. There. That's a half-infinite interval. It's everything less than or equal to 3. That's an example of a half-infinite interval. Actually, do people even say that? Infinite interval? I don't know. I made that up, that name. So it might not be a technique, you know."},{"id":156,"text":"But, okay, everybody got this? So that's what a quasi-convex function is, right? And by the way, it's actually super interesting. Suppose f is a function that we want to minimize, like it's an objective."},{"id":157,"text":"What's really cool about this, this says then a sublevel set you can describe as all the choices that are as good as or better than, let's say, alpha. Everybody got that? Like F is whatever your objective is in your problem. Let's say it's a loss function and you're fitting something, right? Then this says, show me the set of all parameters that fit my data at least as well as alpha. Everybody got that?"},{"id":158,"text":"Okay, so it kind of makes sense, right? I mean, it's an interesting, it's an interesting, and it says that these, if you're quasi-convex, those are convex functions, okay? Convex sets, I'm sorry. Okay, so let's look at some examples. Well, okay, square root absolute value z, everybody can picture that, looks like this, right? Well, it's obviously not concave, it is not convex, but it is quasi-convex. It's also, by the way,"}],"notes":["本段讲解了次凸函数（quasi-convex function）的定义及其与凸集的关系。次凸函数的次级集（sublevel set）是凸集，这是其重要性质之一。讲者通过举例说明，当函数在某个值以下的所有点构成的集合是凸集时，该函数为次凸函数。","讲者提到，次凸函数的次级集可以描述为所有比某个阈值（alpha）更好或相等的点的集合。例如，在优化问题中，如果目标函数是损失函数，那么次级集可以解释为所有参数值，这些参数值在拟合数据时至少与给定的alpha一样好。","讲者还指出，虽然某些函数（如绝对值函数的平方根）不是凸函数，但它们是次凸函数。这说明次凸函数的定义比凸函数更广泛，包含了一些非凸函数。","讲者强调了次凸函数在优化中的重要性，特别是在最小化目标函数时，次凸函数的次级集具有凸性，这有助于优化算法的设计和分析。","讲者提到，次凸函数的次级集是凸集，这是其定义的核心。因此，判断一个函数是否为次凸函数，可以通过检查其所有次级集是否为凸集。","讲者还提到，次凸函数的次级集可以是半无限区间，这在单变量函数中是常见的现象。例如，当函数在某个值以下的所有点构成一个半无限区间时，该函数是次凸函数。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3529.2,"end":3683.61,"asr_flags":[],"raw_segments":[{"start":3529.2,"text":"What is the set of x for which the function is smaller than this value? No, I'm down here. It's empty. See, it's the empty set. Is the empty set convex? Yeah, so that's cool. If I put something that just touches the bottom of this, I get a singleton, the minimizer. That's convex. Now, as I raise this level,"},{"start":3553.82,"text":"you get an interval, but intervals are convex. What happens is if I raise it at the value beta, I get a half infinite interval, right? That's also convex, right? So unimodal is another name for it. And basically for a function of one variable, something is quasi-convex. If roughly speaking, you know, it's decreasing, there's a point where it's decreasing up to that point and then increasing above it."},{"start":3583.54,"text":"Okay? It's also more interesting in the vector case, right? Yeah. What's a half-infinite interval? It is this. It would look like something like this. There. That's a half-infinite interval. It's everything less than or 's not bad. It's just cultural, I don't know, enrichment or something. Okay, everybody got that, right? I mean, this could be..."},{"id":177,"text":"an investment made by a VC firm in a startup, right? So they wire transfer, you know, $12 million into a bank account, right? That's X zero. Then X one is probably zero for a startup. X two is, and then maybe sometime later, somebody acquires them. And then one of the Xs is really big. Everybody got this? Okay, so that's a cashflow."},{"id":178,"text":"Okay, and we're going to assume, this is just to make the definition simple, that's fine. We're going to assume that X0 is less than zero. That means that the first point in that, the first cash flow is something we pay, we invest in, right? Because it's a negative cash flow to us, it means we're investing X0, right? Then we're also going to assume, we don't assume that the signs of X1 through Xn are positive. We may pay more in. They can come back to us and say, sorry, we need a bridge loan."},{"id":179,"text":"or whatever, or we don't, you know, that's it. Or we can't, we can't meet payroll. So we need more money. That's fine. But we will assume that simply the sum of all the things is positive. And what that, that means, and this is, this is just to make it simple. It works in other cases too. What that means is that the total of all the cash payments is, it was not at least a disaster. That's what it means. It means, right. So that's, that's what it says."},{"id":180,"text":"Okay. So people talk about the present value of the cash flow, and that's going to be with an interest rate R. It says you simply multiply. So what you do is you say that a payment to me at time I, at period I, is going to be worth 1 plus R to the minus I. So if R is 5%,"}],"notes":["本段介绍了现金流的定义，其中现金流由一个长度为N+1的向量表示，每个元素对应不同时间段的现金流入或流出。X0代表当前时刻的现金流，可能是负数，表示投资支出。X1到XN代表后续各期的现金流，可能为正或负，取决于具体情境。","讲者通过债券和风险投资两个例子来说明现金流的含义。在债券的例子中，X0为负数表示购买债券的支出，X1到Xn为正数表示利息收入和到期本金的回收。在风险投资的例子中，X0为负数表示投资金额，X1到Xn可能为零或正数，表示后续的回报。","讲者强调现金流的总和应为正数，以确保整体的盈利性。这并不是一个严格的数学条件，而是为了简化定义和理解。","讲者提到现值的计算，即每个现金流需要乘以(1 + R)^{-I}，其中R为利率，I为时间周期。这表明现值是未来现金流的折现值，反映了资金的时间价值。","讲者指出，现值的计算依赖于利率R，而利率的设定会影响现值的大小。例如，当R为5%时，每个现金流的现值会相应减少。","讲者没有深入讨论现值的具体计算方法或其在优化问题中的应用，而是专注于现金流的定义和现值的基本概念。"],"formulas":[{"latex":"PV = \\sum_{i=0}^{N} \\frac{X_i}{(1 + R)^i}","symbols":"现值（PV）是各期现金流（X_i）的折现值之和，其中R为利率，i为时间周期。","explanation":"公式正确表达了现值的计算方式，即各期现金流按利率R折现后的总和。","evidence":"Okay. So people talk about the present value of the cash flow, and that's going to be with an interest rate R. It says you simply multiply. So what you do is you say that a payment to me at time I, at period I, is going to be worth 1 plus R to the minus I. So if R is 5%,"}],"uncertainties":[],"diagram":"none","start":4169.48,"end":4329.68,"asr_flags":[],"math_clarifications":["公式中的求和符号应使用标准的\\sum，而非\\text{sum}，以符合数学排版规范。"],"raw_segments":[{"start":4169.48,"text":"I don't know if you get accounting or something. Okay. So here it is. So I have a cash flow and it's given by a vector, which is N plus one long. And the entries are labeled like X one, X zero up to XN, right? So that's a cash flow over N plus one periods, right? I mean, it depends. X zero might be like right now, right? So for example, if you bought a bond, let's just say, if you bought a bond, X zero might be negative. It's how much you pay for the bond."},{"start":4196.98,"text":"Then X1 might be the coupon payment you get for that bond. X2 is the coupon payment in period two. And then Xn might be the maturity and you get both back the coupon payment and the face value. By the way, you don't have to know what a bond is. I'm just like, you don't need to know this. But it's not bad. It's just cultural, I don't know, enrichment or something. Okay, everybody got that, right? I mean, this could be..."},{"start":4223.61,"text":"an investment made by a VC firm in a startup, right? So they wire transfer, you know, $12 million into a bank account, right? That's X zero. Then X one is probably zero for a startup. X two is, and then maybe sometime later, somebody acquires them. And then one of the Xs is really big. Everybody got this? Okay, so that's a cashflow."},{"start":4252.13,"text":"Okay, and we're going to assume, this is just to make the definition simple, that's fine. We're going to assume that X0 is less than zero. That means that the first point in that, the first cash flow is something we pay, we invest in, right? Because it's a negative cash flow to us, it means we're investing X0, right? Then we're also going to assume, we don't assume that the signs of X1 through Xn are positive. We may pay more in. They can come back to us and say, sorry, we need a bridge loan."},{"start":4281.92,"text":"or whatever, or we don't, you know, that's it. Or we can't, we can't meet payroll. So we need more money. That's fine. But we will assume that simply the sum of all the things is positive. And what that, that means, and this is, this is just to make it simple. It works in other cases too. What that means is that the total of all the cash payments is, it was not at least a disaster. That's what it means. It means, right. So that's, that's what it says."},{"start":4307.52,"text":"Okay. So people talk about the present value of the cash flow, and that's going to be with an interest rate R. It says you simply multiply. So what you do is you say that a payment to me at time I, at period I, is going to be worth 1 plus R to the minus I. So if R is 5%,"}],"speech_gaps":[],"frame":"../frames/v004/026.webp","frame_time":4181.48},{"title":"净现值与内部收益率","segments":[{"id":181,"text":"And it's 10 years. It means that it's worth, to me, only 1 over 1.05 to the 10. I don't know what that is. Like 1.8. 1 over 1.8. Let's say it's 0.4. I have no idea what it is. 0.5. I'm making that up. So these are the discounted cash flows. And this is called the net present value. And these are just completely standard concepts in basic accounting."},{"id":182,"text":"Okay. That's the present value. And it's a function of the vector X and the interest rate R. Okay. And now I can tell you what the internal rate of return is called the IRR. It's the smallest interest rate for which the present, the net present value is zero. Right. And so, and I think the argument about it, if you're teaching MBAs or something is the idea is you would be ambivalent. If I walk up to you and I say, Hey, I got a great deal for you invest in this thing."},{"id":183,"text":"Right. And then we work out the internal rate of return. And it turns out you could get something else. You get a you get a bank account or something like that with the same interest rate. Then you'd say, why should I invest in your stupid thing? I'm going to take you to the bank or something like that. That's the idea. OK. Everybody got this. And this is by the way, this is you. This is not part of the class. You don't need to know this, but it doesn't hurt to know it. This is not bad. OK."},{"id":184,"text":"All right, so it turns out the internal rate of return, which is actually complicated, right? Because you actually, you know, this thing here is a polynomial in 1 over 1 plus r. Yeah, it is a polynomial. So this actually requires solving a polynomial equation. So, you know, hello, if there's more than five periods, then there's not an analytical formula for it, but who cares, right? Everybody following, right? So it's complicated, right?"},{"id":185,"text":"So this is the internal rate of return. And it turns out it's quasi-concave, which is just like weird. I doubt anyone in accounting would know this. In fact, I'm virtually certain of that fact. I have friends in accounting. And I'm not insulting them. I'm just saying it's not how they think. So it's fine. It's quasi-concave."},{"id":186,"text":"What does it mean to show something's quasi-concave? What you need to do is you need to show that the super-level sets, right? For quasi-convex means the sub-level sets are convex. Quasi-concave means the super-level sets are convex, right? And so let's look at that. So let's look at the set of all cash flows here that satisfy the internal rate of return is bigger than, let's say, 5%. That's what we're going to look at."}],"notes":["本段讲解了净现值（NPV）的概念，即通过将未来现金流按贴现率折现到当前时点的总和，用于评估投资项目的可行性。同时，提到贴现率的计算方式，如1/1.05^10，以及贴现现金流的计算过程。","内部收益率（IRR）被定义为使净现值为零的贴现率，即投资项目的回报率。讲者通过举例说明，如果IRR高于银行利率，投资者应选择银行存款而非该项目，从而体现IRR的决策作用。","讲者指出IRR的计算涉及求解多项式方程，当时间周期超过五个时，无法通过解析方法求解，因此需要数值方法。这说明IRR的计算复杂性。","IRR的性质被指出为拟凹函数，这与会计学中的常规认知不同。拟凹函数的定义是其上水平集为凸集，这与拟凸函数的下水平集为凸集相对应。","讲者进一步解释了如何判断一个函数是否为拟凹函数，即通过验证其上水平集是否为凸集。这为后续分析IRR的性质提供了理论基础。","最后，讲者以5%的IRR为例，说明如何通过分析上水平集来验证IRR的拟凹性，从而展示其在实际应用中的意义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4330.35,"end":4501.22,"asr_flags":[],"raw_segments":[{"start":4330.35,"text":"And it's 10 years. It means that it's worth, to me, only 1 over 1.05 to the 10. I don't know what that is. Like 1.8. 1 over 1.8. Let's say it's 0.4. I have no idea what it is. 0.5. I'm making that up. So these are the discounted cash flows. And this is called the net present value. And these are just completely standard concepts in basic accounting."},{"start":4360.09,"text":"Okay. That's the present value. And it's a function of the vector X and the interest rate R. Okay. And now I can tell you what the internal rate of return is called the IRR. It's the smallest interest rate for which the present, the net present value is zero. Right. And so, and I think the argument about it, if you're teaching MBAs or something is the idea is you would be ambivalent. If I walk up to you and I say, Hey, I got a great deal for you invest in this thing."},{"start":4388.57,"text":"Right. And then we work out the internal rate of return. And it turns out you could get something else. You get a you get a bank account or something like that with the same interest rate. Then you'd say, why should I invest in your stupid thing? I'm going to take you to the bank or something like that. That's the idea. OK. Everybody got this. And this is by the way, this is you. This is not part of the class. You don't need to know this, but it doesn't hurt to know it. This is not bad. OK."},{"start":4417.41,"text":"All right, so it turns out the internal rate of return, which is actually complicated, right? Because you actually, you know, this thing here is a polynomial in 1 over 1 plus r. Yeah, it is a polynomial. So this actually requires solving a polynomial equation. So, you know, hello, if there's more than five periods, then there's not an analytical formula for it, but who cares, right? Everybody following, right? So it's complicated, right?"},{"start":4446.13,"text":"So this is the internal rate of return. And it turns out it's quasi-concave, which is just like weird. I doubt anyone in accounting would know this. In fact, I'm virtually certain of that fact. I have friends in accounting. And I'm not insulting them. I'm just saying it's not how they think. So it's fine. It's quasi-concave."},{"start":4471.18,"text":"What does it mean to show something's quasi-concave? What you need to do is you need to show that the super-level sets, right? For quasi-convex means the sub-level sets are convex. Quasi-concave means the super-level sets are convex, right? And so let's look at that. So let's look at the set of all cash flows here that satisfy the internal rate of return is bigger than, let's say, 5%. That's what we're going to look at."}],"speech_gaps":[],"frame":"../frames/v004/027.webp","frame_time":4342.35},{"title":"内部收益率与凸集的讨论","segments":[{"id":187,"text":"right? So what is that? If your internal rate of return is bigger than or equal to 5%, it means that between an interest rate of 0 and 5%, your net present value was still positive, right? Because this says that your net present value with an interest rate of 0 is positive. That's what it says."},{"id":188,"text":"It says that there's no interest, it's low interest time. So just add up the numbers and that says i
