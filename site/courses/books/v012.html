mputers work. But I feel like all of us should know a little bit about that. Yes."},{"start":3624.39,"text":"Yeah, that's exactly right. It's cache optimized, right? So what you do is the lowest level in the hierarchy are, I don't know, 16 by 16 matrices, right? Why? Because you can multiply 16 by 16 matrices directly at the lowest level of cache, right? The next group up is like 256 by 256 matrices. You can multiply two of those using your level two cache. Everybody following this?"},{"start":3652.39,"text":"By the way, this is from the 1960s. 1970s? No, maybe 70s. Let's go with that. Everybody following this?"},{"start":3663.01,"text":"It's actually completely stunning what happens when you do this right. Oh, and by the way, the same things go to a world where you have a lot of cores. So this could be a GPU with 10,000 cores, right? And you say, oh boy, oh, is it good at multiplying? I can multiply, you know, 5,000 16 by 16 matrices by other 16 by 16 matrices all together in like two microseconds. Everybody following that?"},{"start":3688.93,"text":"So people who work on these things know exactly what those things are. They know exactly what they can do. And so then it's the same thing. You chop these things up into these things. And all of us are utterly unaware of this, which is kind of cool. But we benefit like crazy. So everybody."},{"start":3708.39,"text":"following this. So, so if you ever meet, I don't, you know, I don't know if people even do, well, there are people who do this like in my department in CS. So anyway, if you meet one of those people, just like, remember I told you, if you meet someone who works on like devices and things like that, you should thank them. If you meet someone who works on the lower, the lowest level stuff like this, thank them too."}],"speech_gaps":[],"frame":"../frames/v012/022.webp","frame_time":3584.52},{"title":"计算速度与浮点运算","segments":[{"id":238,"text":"Because they're the ones that allow the rest of us to use like NumPy and SciPy, for that matter, Torch and things like that. Because it's just awesome. What they've done is amazing. And we're the beneficiaries. So, okay. All right. If you didn't follow what I was saying, that's okay. But you should kind of know about this, I think. Oh, let's talk about speed of current computing and things. So you could actually do things like...","zh":"因为正是它们让我们这些普通人也能使用像NumPy和SciPy，以及Torch之类的工具。因为它们真的很棒。他们所做的工作令人惊叹。我们是受益者。所以，好吧。好了，如果你没有跟上我的说法，那也没关系。但你应该大致了解这些内容，我认为。哦，让我们谈谈当前计算的速度以及相关的东西。你实际上可以做一些事情，比如...","start":3728.98,"end":3757.03},{"id":239,"text":"You know, you can do it yourself.","zh":"你知道的，你可以自己来做。","start":3757.62,"end":3759.54},{"id":240,"text":"You can actually do some of these calculations","zh":"你实际上可以进行一些这些计算","start":3760.3,"end":3762.46},{"id":241,"text":"and make guesses about how long something's going to take.","zh":"并猜测某件事需要多长时间。","start":3762.96,"end":3766.54},{"id":242,"text":"Or you could actually say it did that calculation","zh":"或者你实际上可以说它在每秒这个浮点运算次数下完成了这个计算，对吧？","start":3766.72,"end":3769.14},{"id":243,"text":"at this number of flops per second, right?","zh":"顺便说一句，总之，有人能告诉我什么是...","start":3769.14,"end":3773.42},{"id":244,"text":"And by the way, so anyway, somebody tell me what's a...","zh":"这里，我不确定，这是一台四年前的笔记本电脑。","start":3774.66,"end":3777.94},{"id":245,"text":"Here, I don't know, this is a four-year-old laptop.","zh":"这里，我不确定，这是一台四年前的笔记本电脑。","start":3778.5,"end":3780.36},{"id":246,"text":"What will this do for, I don't know,","zh":"这会对矩阵向量乘法之类的事情有什么影响，我也不知道，","start":3781.86,"end":3784.58},{"id":247,"text":"matrix vector multiplies and stuff like that?","zh":"有没有人……顺便说一下，这里有个提示。它是以吉浮点运算（gigaflops）来衡量的，即每秒十亿次浮点运算，对吧？","start":3784.6,"end":3786.82},{"id":248,"text":"had anyone... By the way, here's a hint. It's measured in gigaflops, which is 10 to the 9","zh":"有人……顺便说一下，这里有个提示。它是以吉浮点运算（gigaflops）为单位测量的，即10的9次方","start":3786.82,"end":3790.7},{"id":249,"text":"flops per second, right? So what would be a speed number? I mean, you either know this or you don't,","zh":"但像五年前的笔记本电脑这样的设备，它的速度数值会是多少呢？","start":3790.7,"end":3798.66},{"id":250,"text":"but what would be a speed number for like a five-year-old laptop?","zh":"每秒能完成多少十亿次浮点运算？顺便说一下，这是一大堆浮点运算，","start":3798.68,"end":3801.1},{"id":251,"text":"How many billions of flops? By the way, that's a lot of floating point operations,","zh":"只是记录一下，但像五年前的笔记本电脑这样的设备，每秒能完成多少十亿次浮点运算？","start":3808.36,"end":3812.0},{"id":252,"text":"just for the record but how many of the how many billions can you do in a second on like a five","zh":"我的新电脑呢？它的数值是多少？有没有其他人知道另一个数值范围？","start":3812.0,"end":3817.0},{"id":253,"text":"okay my how about my newer a newer computer what what's the number anyone another number range","zh":"好的，我的新电脑，我的新电脑，这个数值是多少？还有其他人有什么数值范围吗？","start":3817.0,"end":3824.32},{"id":254,"text":"okay it could be it's between one and ten for this it could easily be 30 for this why because","zh":"好的，它可能在1到10之间，对于这个情况，它可能很容易就是30，为什么呢","start":3827.08,"end":3835.82},{"id":255,"text":"people who know what they're doing have like optimized matrix matrix multiply because people","zh":"那些知道他们正在做什么的人会进行优化的矩阵乘法，因为人们","start":3835.82,"end":3841.46},{"id":256,"text":"people do it a lot. What would it be on a simple GPU? Well, I have a GPU in here for","zh":"人们经常这么做。在简单的GPU上会是什么情况呢？好吧，我这里有一个用于图形的GPU，那么在那里会是多少呢？现在我们说的是100，很容易。那是入门级的GPU。而","start":3841.46,"end":3847.98},{"id":257,"text":"my graphics, so what is it there? Now we're talking 100, easily. That's a baby GPU. And","zh":"我的图形，所以那里是什么？现在我们说的是100，很容易。那是一个入门级的GPU。而且","start":3847.98,"end":3855.34},{"id":258,"text":"on a real GPU, you start getting towards the teraflops, and then it goes up from there.","zh":"惊人的数字。而我们是受益者，对吧？所以，我意思只是快速说一下，乘以2000乘以1000的矩阵需要多长时间？我意思是，它的计算量是n的立方次方，所以是10的9次方。所以有人告诉我这个数字。那是十亿次浮点运算。需要多长时间？我意思是我现在就可以做，但我不会去做，因为我知道会发生什么。但请继续。有人告诉我。这个数字是多少？这需要一分钟吗？","start":3855.34,"end":3860.82},{"id":259,"text":"Amazing numbers. And we're the beneficiaries, right? So, I mean, just as a quick thing, how long does it take to multiply like 2,000 by 1,000 matrices? I mean, look, it's order n cubed flop, so that's 10 to the 9. So someone tell me the number. That's a gigaflop. That's a billion flops. How long does it take? I mean, I could just do it right now, but I'm not going to because I know what would happen. But go ahead. Somebody tell me. What's the number? Does that take a minute?","zh":"惊人的数字。而我们是受益者，对吧？所以，我意思只是随便说一下，乘以2,000乘1,000的矩阵需要多长时间？我的意思是，它的计算复杂度是n的立方次方的浮点运算，所以是10的9次方。所以有人告诉我这个数字。那是一个吉浮点运算。那是一十亿次浮点运算。需要多长时间？我的意思，我现在就可以做，但我不会去做，因为我知道会发生什么。但请继续。有人告诉我这个数字。需要一分钟吗？","start":3863.77,"end":3894.06}],"notes":["本段主要讨论计算速度和浮点运算（flops）的概念，以及不同设备（如CPU和GPU）在执行矩阵运算时的性能差异。讲者提到，现代计算机的计算速度通常以吉浮点运算（gigaflops）或太浮点运算（teraflops）来衡量，其中GPU在处理矩阵乘法等任务时比CPU快得多。","讲者通过举例说明，一个简单的矩阵乘法（如2000×1000矩阵）需要大约10^9次浮点运算（即1个吉浮点运算），并询问听众这样的计算需要多长时间。这表明，计算速度的衡量标准是浮点运算的次数和时间的关系。","讲者提到，优化的矩阵乘法算法可以显著提高计算效率，而GPU由于其并行计算能力，通常比CPU快得多。例如，一个简单的GPU可能达到100吉浮点运算，而高端GPU可以达到太浮点运算级别。","讲者还提到，计算速度的衡量单位是吉浮点运算（gigaflops）和太浮点运算（teraflops），其中1吉浮点运算等于10^9次浮点运算，1太浮点运算等于10^12次浮点运算。这表明，计算速度的衡量标准是基于浮点运算的次数。","讲者通过举例说明，一个简单的矩阵乘法（如2000×1000矩阵）需要大约10^9次浮点运算（即1个吉浮点运算），并询问听众这样的计算需要多长时间。这表明，计算速度的衡量标准是浮点运算的次数和时间的关系。","讲者还提到，优化的矩阵乘法算法可以显著提高计算效率，而GPU由于其并行计算能力，通常比CPU快得多。例如，一个简单的GPU可能达到100吉浮点运算，而高端GPU可以达到太浮点运算级别。"],"formulas":[],"uncertainties":["matrix matrix multiply","teraflops"],"diagram":"none","start":3728.98,"end":3894.06,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":3728.98,"text":"Because they're the ones that allow the rest of us to use like NumPy and SciPy, for that matter, Torch and things like that. Because it's just awesome. What they've done is amazing. And we're the beneficiaries. So, okay. All right. If you didn't follow what I was saying, that's okay. But you should kind of know about this, I think. Oh, let's talk about speed of current computing and things. So you could actually do things like..."},{"start":3757.62,"text":"You know, you can do it yourself."},{"start":3760.3,"text":"You can actually do some of these calculations"},{"start":3762.96,"text":"and make guesses about how long something's going to take."},{"start":3766.72,"text":"Or you could actually say it did that calculation"},{"start":3769.14,"text":"at this number of flops per second, right?"},{"start":3774.66,"text":"And by the way, so anyway, somebody tell me what's a..."},{"start":3778.5,"text":"Here, I don't know, this is a four-year-old laptop."},{"start":3781.86,"text":"What will this do for, I don't know,"},{"start":3784.6,"text":"matrix vector multiplies and stuff like that?"},{"start":3786.82,"text":"had anyone... By the way, here's a hint. It's measured in gigaflops, which is 10 to the 9"},{"start":3790.7,"text":"flops per second, right? So what would be a speed number? I mean, you either know this or you don't,"},{"start":3798.68,"text":"but what would be a speed number for like a five-year-old laptop?"},{"start":3808.36,"text":"How many billions of flops? By the way, that's a lot of floating point operations,"},{"start":3812.0,"text":"just for the record but how many of the how many billions can you do in a second on like a five"},{"start":3817.0,"text":"okay my how about my newer a newer computer what what's the number anyone another number range"},{"start":3827.08,"text":"okay it could be it's between one and ten for this it could easily be 30 for this why because"},{"start":3835.82,"text":"people who know what they're doing have like optimized matrix matrix multiply because people"},{"start":3841.46,"text":"people do it a lot. What would it be on a simple GPU? Well, I have a GPU in here for"},{"start":3847.98,"text":"my graphics, so what is it there? Now we're talking 100, easily. That's a baby GPU. And"},{"start":3855.34,"text":"on a real GPU, you start getting towards the teraflops, and then it goes up from there."},{"start":3863.77,"text":"Amazing numbers. And we're the beneficiaries, right? So, I mean, just as a quick thing, how long does it take to multiply like 2,000 by 1,000 matrices? I mean, look, it's order n cubed flop, so that's 10 to the 9. So someone tell me the number. That's a gigaflop. That's a billion flops. How long does it take? I mean, I could just do it right now, but I'm not going to because I know what would happen. But go ahead. Somebody tell me. What's the number? Does that take a minute?"}],"speech_gaps":[{"start":3804.784,"end":3806.288},{"start":3861.22,"end":3863.312}],"frame":"../frames/v012/023.webp","frame_time":3740.98},{"title":"矩阵乘法的计算复杂度与线性方程求解","segments":[{"id":260,"text":"You'd say this. Do you realize, like multiplying 2,000, each of those major, I'll make it sound crazy, you'd say, you have two arrays, each of them have a million numbers in them. Everybody following this? And then you have to multiply them together and they all connect with all of them? And you're going to do a billion multiplies? That's crazy. Everybody following this? So how long does it take? That's it?","zh":"你会这么说。你意识到吗，比如乘以2000，每个主要的，我会把它说得疯狂，你会说，你有两个数组，每个里面都有一百万个数字。大家跟得上吗？然后你必须把它们相乘，它们之间每一个都和每一个相乘？你将会做十亿次乘法？这很疯狂。大家跟得上吗？那么这需要多长时间？就是这样。","start":3895.21,"end":3919.26},{"id":261,"text":"That's about right. Put it this way, it's measured in milliseconds. A hundredth would be on a new computer. This would be a hundred milliseconds here. It's probably worth sitting down and seriously pondering how amazing that is. There's a lot of people to thank for that.","zh":"大概就是这样。这么说吧，它以毫秒为单位来衡量。在新电脑上，百分之一会是毫秒级。这里大概是百分之一秒。这值得坐下来认真思考这是多么了不起的事情。有很多人值得感谢。","start":3921.1,"end":3945.64},{"id":262,"text":"Um, right. So anyway, so if you, if you're whatever, if you're roommates or neighbors","zh":"嗯，对的。所以不管怎样，如果你，如果你是室友或者邻居，或者其他什么人，","start":3946.23,"end":3951.27},{"id":263,"text":"or something, do this kind of stuff, you should thank them. So, okay. Does that, that sounds good?","zh":"做这种事的话，你应该感谢他们。所以，好吧。这听起来不错吗？","start":3951.27,"end":3955.53},{"id":264,"text":"Oh, and what about on a, what about on a super high end GPU and I'm multiplying, uh, 20,000 by","zh":"哦，还有，在一个超级高端的GPU上，我乘以20000乘以","start":3955.61,"end":3962.03},{"id":265,"text":"20,000 dense matrices? You'd be terrified is the answer is what, what it is. It's, it's unbelievably","zh":"20000的密集矩阵？答案是你会感到害怕，这就是答案。它，它快得难以置信，对吧？好吧。但实际上这并不是重点。我们将要讨论的其他事情中，你不需要超级计算机就能实现你想要的事情","start":3962.03,"end":3969.19},{"id":266,"text":"fast, right? Okay. But actually that's not the main point. We're going to be talking about other","zh":"你只需要","start":3969.19,"end":3974.57},{"id":267,"text":"stuff where you don't need a supercomputer to achieve things you just","zh":"那些你不需要超级计算机就能实现的事情","start":3974.57,"end":3980.71},{"id":268,"text":"need to be smart and that's going to be the theme of the next of the material","zh":"需要聪明的方法，这将是接下来材料的主题","start":3980.71,"end":3984.13},{"id":269,"text":"we're going to look at okay so we're going to start we just build up real","zh":"我们将会看一下，好的，我们将会开始，我们只是逐步构建真实的","start":3984.13,"end":3989.13},{"id":270,"text":"easy and just say let's look at some linear equation you know when is it easy","zh":"简单一点，就说让我们看一下一些线性方程，你知道什么时候解线性方程容易","start":3989.13,"end":3992.77},{"id":271,"text":"to solve linear equations well here's one time it was diagonal that's idiotic","zh":"解线性方程什么时候容易呢？这里有一个情况，它是对角阵，这很傻","start":3992.77,"end":3997.11},{"id":272,"text":"you like it's order n okay what about matrixes what if it's lower triangular","zh":"你喜欢吗？它的阶数是n，好的，那矩阵呢？如果它是下三角矩阵","start":3997.11,"end":4002.99},{"id":273,"text":"and you want to solve it, right? So you want to solve something that looks, it's lower","zh":"并且你想解它，对吧？所以你想解一个看起来像这样的东西，它是下","start":4002.99,"end":4007.13},{"id":274,"text":"triangular so it looks like, you know, A11, A21, A22, right? A31, A32, A33. I'm not going","zh":"三角形的，看起来像，你知道的，A11，A21，A22，对吧？A31，A32，A33。我不会画零","start":4007.13,"end":4020.11},{"id":275,"text":"to draw the zeros, right? Times, you know, let's say X1, X2, X3 equals like B1, B2, B3.","zh":"，对吧？乘以，比如说，X1，X2，X3等于像B1，B2，B3。","start":4020.11,"end":4027.91},{"id":276,"text":"And this, you know, you probably saw this in, probably even in high school or something,","zh":"你可能在高中甚至更早的时候就见过这个，对吧？","start":4028.01,"end":4031.73},{"id":277,"text":"right? So how do you solve this? Well look, the first equation is a11 x1 equals b1, so","zh":"那么你是怎么解这个的呢？好，第一个方程是 a11 x1 等于 b1，所以","start":4031.73,"end":4036.95},{"id":278,"text":"x1 is b1 over a11, right? Now you know x1. The second equation is a21 x1, but you know","zh":"x1 就是 b1 除以 a11，对吧？现在你已经知道 x1 了。第二个方程是 a21 x1，但你已经知道这个值了。","start":4036.95,"end":4043.37},{"id":279,"text":"what that is. You already calculated it. So the second one is a22 x2 equals b2 minus a21","zh":"你已经计算过了。所以第二个方程是 a22 x2 等于 b2 减去 a21","start":4043.37,"end":4051.89},{"id":280,"text":"x1 which you already know. So that method is called forward substitution because you","zh":"x1，而你已经知道这个值了。这种方法叫做前向代入，因为你","start":4051.89,"end":4057.21},{"id":281,"text":"solve for x1, then x2, then x3, then x4, and whenever you have one, you're going to substitute","zh":"先解出 x1，然后解 x2，接着解 x3，再解 x4，每当你知道一个变量的值时，你就会把它代入到后面的方程中。大家明白了吗？当你计算复杂度时，这就是","start":4057.21,"end":4064.47},{"id":282,"text":"it in future equations. Everybody got that? And when you work out the complexity, that's","zh":"计算复杂度的方法。","start":4064.47,"end":4071.89}],"notes":["本段首先讨论了矩阵乘法的计算复杂度，指出即使两个数组各有百万个元素，相乘操作的计算量巨大，但现代计算机可以在毫秒级完成。接着，讲者提到在高端GPU上处理20,000×20,000的密集矩阵乘法时，虽然计算量巨大，但速度依然惊人，强调了计算机性能的高效性。"],"formulas":[],"uncertainties":["20,000 by 20,000 dense matrices? You'd be terrified is the answer is what, what it is."],"diagram":"none","start":3895.21,"end":4071.89,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":3895.21,"text":"You'd say this. Do you realize, like multiplying 2,000, each of those major, I'll make it sound crazy, you'd say, you have two arrays, each of them have a million numbers in them. Everybody following this? And then you have to multiply them together and they all connect with all of them? And you're going to do a billion multiplies? That's crazy. Everybody following this? So how long does it take? That's it?"},{"start":3921.1,"text":"That's about right. Put it this way, it's measured in milliseconds. A hundredth would be on a new computer. This would be a hundred milliseconds here. It's probably worth sitting down and seriously pondering how amazing that is. There's a lot of people to thank for that."},{"start":3946.23,"text":"Um, right. So anyway, so if you, if you're whatever, if you're roommates or neighbors"},{"start":3951.27,"text":"or something, do this kind of stuff, you should thank them. So, okay. Does that, that sounds good?"},{"start":3955.61,"text":"Oh, and what about on a, what about on a super high end GPU and I'm multiplying, uh, 20,000 by"},{"start":3962.03,"text":"20,000 dense matrices? You'd be terrified is the answer is what, what it is. It's, it's unbelievably"},{"start":3969.19,"text":"fast, right? Okay. But actually that's not the main point. We're going to be talking about other"},{"start":3974.57,"text":"stuff where you don't need a supercomputer to achieve things you just"},{"start":3980.71,"text":"need to be smart and that's going to be the theme of the next of the material"},{"start":3984.13,"text":"we're going to look at okay so we're going to start we just build up real"},{"start":3989.13,"text":"easy and just say let's look at some linear equation you know when is it easy"},{"start":3992.77,"text":"to solve linear equations well here's one time it was diagonal that's idiotic"},{"start":3997.11,"text":"you like it's order n okay what about matrixes what if it's lower triangular"},{"start":4002.99,"text":"and you want to solve it, right? So you want to solve something that looks, it's lower"},{"start":4007.13,"text":"triangular so it looks like, you know, A11, A21, A22, right? A31, A32, A33. I'm not going"},{"start":4020.11,"text":"to draw the zeros, right? Times, you know, let's say X1, X2, X3 equals like B1, B2, B3."},{"start":4028.01,"text":"And this, you know, you probably saw this in, probably even in high school or something,"},{"start":4031.73,"text":"right? So how do you solve this? Well look, the first equation is a11 x1 equals b1, so"},{"start":4036.95,"text":"x1 is b1 over a11, right? Now you know x1. The second equation is a21 x1, but you know"},{"start":4043.37,"text":"what that is. You already calculated it. So the second one is a22 x2 equals b2 minus a21"},{"start":4051.89,"text":"x1 which you already know. So that method is called forward substitution because you"},{"start":4057.21,"text":"solve for x1, then x2, then x3, then x4, and whenever you have one, you're going to substitute"},{"start":4064.47,"text":"it in future equations. Everybody got that? And when you work out the complexity, that's"}],"speech_gaps":[],"frame":"../frames/v012/024.webp","frame_time":3907.21},{"title":"三角矩阵与特殊结构矩阵的求解复杂度","segments":[{"id":283,"text":"going to be actually n squared flops. Okay? So that's cool. By the way, it's different","zh":"这将需要实际上 n 平方次浮点运算。好吗？所以这很酷。顺便说一句，这是不同的","start":4071.89,"end":4080.03},{"id":284,"text":"different from n cubed, right? So that's, in fact there's a factor of n in there, right?","zh":"与 n 立方次不同，对吧？所以事实上，这里面有一个 n 的因子，对吧？","start":4080.03,"end":4084.47},{"id":285,"text":"So you already know something. It says that if you had to solve some triangular equations,","zh":"所以你已经知道一些事情了。它说明如果你需要解一些三角方程，","start":4084.59,"end":4089.79},{"id":286,"text":"you can do that really fast compared to just solving non-triangular equations. And if it's","zh":"与仅仅解非三角方程相比，你可以非常快速地完成。如果它是","start":4090.19,"end":4097.07},{"id":287,"text":"upper triangular, you do what's called backward substitution. It's the same thing. In that","zh":"上三角形式，你会进行所谓的回代。这是同样的方法。在这种","start":4097.07,"end":4101.61},{"id":288,"text":"case, you get xn first, then xn minus 1, and so on. Oh, and by the way, this is not how","zh":"情况下，你会先得到 xn，然后是 xn 减 1，依此类推。哦，顺便说一句，这并不是","start":4101.61,"end":4107.27},{"id":289,"text":"how it actually works. This is blocked. That's how they actually do it, right? So there's","zh":"实际的工作方式。这是被分块的。他们实际是这样做的，对吧？所以有一些小块。我们依然 blissfully unaware（无忧无虑）于此，但当你解一个三角方程组时，","start":4107.27,"end":4112.39},{"id":290,"text":"little blocks. Again, we are blissfully unaware of this, but when you solve a triangular system,","zh":"这些块的存在是被隐藏的。","start":4112.39,"end":4118.41},{"id":291,"text":"they don't do it line by line like this. It's actually blocked.","start":4118.63,"end":4121.95},{"id":292,"text":"But we can pretend it looks like this, and the conclusion is the same. Okay. What if a matrix is orthogonal, right? Like, then it takes two n squared flops, right, to compute a transpose, you know, to compute, sorry, a inverse b, right? Because a inverse is a transpose, and then it's matrix vector multiply. So actually, yeah, that's what it was.","start":4123.72,"end":4148.32},{"id":293,"text":"Okay, there's lots of other cases, right? If A could be, I mean, here's a very famous structure for a matrix A. It's identity minus rank one. I think that's called maybe a householder reflection or somebody might know, somebody in ICME or something could tell me. I think that's right. That's called the householder reflection or something. Those, again, you can solve in nflops, right? Because you just are smart about how you do it.","start":4150.53,"end":4175.91},{"id":294,"text":"And the storage is also clear. You would store u, not the matrix. A permutation matrix is a good example. If you have a permutation matrix, and you want to know how long does it take to solve a permutation matrix times x equals b, you just unpermute them, which is the transpose. And you actually don't even do any flops, because all you're doing is you're just moving numbers around.","start":4176.54,"end":4199.96},{"id":295,"text":"So permutations is kind of hilarious because if you ask under a flop count analysis from the 1960s or 70s, it's zero flops. Because it's actually like mem copies. You're just moving numbers around. Of course, in fact, that can take a lot of time if it's a vector that's 100 million high or something like that. Okay. All right, so these are examples.","start":4201.27,"end":4226.14}],"notes":["本段讲解了三角矩阵求解的复杂度，指出其复杂度为n²次浮点运算，比非三角矩阵的n³次运算快得多。同时提到上三角矩阵的求解方法是回代法，但实际计算中是分块进行的。","对于正交矩阵，其逆矩阵等于其转置，因此求解正交矩阵的线性方程组需要2n²次浮点运算。此外，还提到一些特殊结构的矩阵，如秩为1的矩阵，可以通过巧妙的方法在n²次运算内求解。","排列矩阵的求解复杂度为零次浮点运算，因为其本质是数据的重新排列，而非数值计算。虽然在实际中，如果向量很大，这种操作可能耗时较长。","这些例子展示了不同矩阵结构对计算复杂度的影响，强调了在实际计算中，利用矩阵的特殊结构可以显著提高计算效率。","课程中还提到，虽然在理论分析中，排列矩阵的求解复杂度为零，但在实际应用中，由于数据移动的开销，可能需要考虑实际的计算时间。","这些内容帮助学生理解不同矩阵结构对计算效率的影响，以及如何利用这些结构优化计算过程。"],"formulas":[{"latex":"n^2","symbols":"n²次浮点运算","explanation":"公式正确，表示n²次浮点运算，符合原文提到的求解三角方程的复杂度。","evidence":"going to be actually n squared flops. Okay? So that's cool. By the way, it's different different from n cubed, right? So that's, in fact there's a factor of n in there, right?"},{"latex":"2n^2","symbols":"2n²次浮点运算","explanation":"公式正确，表示计算正交矩阵逆的复杂度为2n²次浮点运算，符合原文提到的正交矩阵的逆运算复杂度。","evidence":"But we can pretend it looks like this, and the conclusion is the same. Okay. What if a matrix is orthogonal, right? Like, then it takes two n squared flops, right, to compute a transpose, you know, to compute, sorry, a inverse b, right? Because a inverse is a transpose, and then it's matrix vector multiply. So actually, yeah, that's what it was."},{"latex":"n^2","symbols":"n²次浮点运算","explanation":"公式正确，表示求解特定矩阵结构（如Householder反射）的复杂度为n²次浮点运算，符合原文提到的高效求解方法。","evidence":"Okay, there's lots of other cases, right? If A could be, I mean, here's a very famous structure for a matrix A. It's identity minus rank one. I think that's called maybe a householder reflection or somebody might know, somebody in ICME or something could tell me. I think that's right. That's called the householder reflection or something. Those, again, you can solve in nflops, right? Because you just are smart about how you do it."},{"latex":"0","symbols":"零次浮点运算","explanation":"公式正确，表示置换矩阵求解的复杂度为零次浮点运算，符合原文提到的置换矩阵求解仅需移动数据。","evidence":"And the storage is also clear. You would store u, not the matrix. A permutation matrix is a good example. If you have a permutation matrix, and you want to know how long does it take to solve a permutation matrix times x equals b, you just unpermute them, which is the transpose. And you actually don't even do any flops, because all you're doing is you're just moving numbers around."}],"uncertainties":["householder reflection"],"diagram":"none","start":4071.89,"end":4226.14,"asr_flags":[],"math_clarifications":["所有公式均符合原文描述的计算复杂度，无需进一步修正。"],"translation_complete":false,"translated_segments":8,"raw_segments":[{"start":4071.89,"text":"going to be actually n squared flops. Okay? So that's cool. By the way, it's different"},{"start":4080.03,"text":"different from n cubed, right? So that's, in fact there's a factor of n in there, right?"},{"start":4084.59,"text":"So you already know something. It says that if you had to solve some triangular equations,"},{"start":4090.19,"text":"you can do that really fast compared to just solving non-triangular equations. And if it's"},{"start":4097.07,"text":"upper triangular, you do what's called backward substitution. It's the same thing. In that"},{"start":4101.61,"text":"case, you get xn first, then xn minus 1, and so on. Oh, and by the way, this is not how"},{"start":4107.27,"text":"how it actually works. This is blocked. That's how they actually do it, right? So there's"},{"start":4112.39,"text":"little blocks. Again, we are blissfully unaware of this, but when you solve a triangular system,"},{"start":4118.63,"text":"they don't do it line by line like this. It's actually blocked."},{"start":4123.72,"text":"But we can pretend it looks like this, and the conclusion is the same. Okay. What if a matrix is orthogonal, right? Like, then it takes two n squared flops, right, to compute a transpose, you know, to compute, sorry, a inverse b, right? Because a inverse is a transpose, and then it's matrix vector multiply. So actually, yeah, that's what it was."},{"start":4150.53,"text":"Okay, there's lots of other cases, right? If A could be, I mean, here's a very famous structure for a matrix A. It's identity minus rank one. I think that's called maybe a householder reflection or somebody might know, somebody in ICME or something could tell me. I think that's right. That's called the householder reflection or something. Those, again, you can solve in nflops, right? Because you just are smart about how you do it."},{"start":4176.54,"text":"And the storage is also clear. You would store u, not the matrix. A permutation matrix is a good example. If you have a permutation matrix, and you want to know how long does it take to solve a permutation matrix times x equals b, you just unpermute them, which is the transpose. And you actually don't even do any flops, because all you're doing is you're just moving numbers around."},{"start":4201.27,"text":"So permutations is kind of hilarious because if you ask under a flop count analysis from the 1960s or 70s, it's zero flops. Because it's actually like mem copies. You're just moving numbers around. Of course, in fact, that can take a lot of time if it's a vector that's 100 million high or something like that. Okay. All right, so these are examples."}],"speech_gaps":[],"frame":"../frames/v012/025.webp","frame_time":4083.89},{"title":"矩阵分解与求解方法","segments":[{"id":296,"text":"And now we're going to get to what the method is. And actually, it's much more important to just understand the high-level idea than the low-level details, right? Except if you're in the few people who actually work on these methods so that the rest of us benefit. But the rest of us, here's the method. It's actually very simple, and there's already like immediately weird things that you, I don't know, some of you probably will leave today knowing something you didn't know before that's weird and shocking. So here it is.","zh":"现在我们将进入方法本身。实际上，理解高层次的想法比低层次的细节更重要，对吧？除非你是少数真正从事这些方法研究的人，这样其余的人才能受益。但对我们大多数人来说，这里就是方法。它实际上非常简单，而且你马上就会发现一些奇怪的事情，我也不知道，你们中的一些人可能今天离开时会知道一些以前不知道的、奇怪而令人震惊的东西。所以，这里就是。","start":4226.81,"end":4254.92},{"id":297,"text":"The general method works like this. You take a matrix A. You want to solve AX equals B. You take the matrix A, and the first thing you do is you factor it. And factor it means you write it out as a product of matrices. You know a bunch of these factorizations, probably. Like there's the QR factorization. There's the eigen decomposition, singular value decomposition. You probably know a bunch of these already anyway.","zh":"这个通用方法的工作方式如下。你取一个矩阵 A。你想解方程 AX = B。你取矩阵 A，然后第一步是将其分解。分解意味着将它写成多个矩阵的乘积。你可能已经知道一些这些分解方法。例如，有 QR 分解、特征值分解和奇异值分解。你可能无论如何都已经知道一些这些方法了。","start":4256.81,"end":4276.87},{"id":298,"text":"So you factor it into a product of matrices, each of which is easy to invert. People say that. By the way, when they say that, that's slang. It doesn't mean that anyone's going to invert that matrix. When you say easy to invert, it means it's easy to solve AX equals B. That's what they actually mean by that. But they just say easy to invert, even though no one is inverting any matrices. So this is really, really quite dumb.","zh":"因此，你将其分解为多个矩阵的乘积，每个矩阵都容易求逆。人们说这句话时，其实是一种俚语。它并不意味着有人会真正去求逆这些矩阵。当你说到容易求逆时，意思其实是容易解方程 AX = B。这就是他们真正想表达的意思。但即使没有人真正求逆任何矩阵，他们也只说容易求逆。所以这真的很傻。","start":4277.3,"end":4307.02},{"id":299,"text":"It just says, well, if A is this product, then the inverse of A is the product of the inverses in reverse order, right? So I get this thing. And now I just put parentheses the right way, which is to say I first put a parentheses around the first one, A1 inverse B. And I calculate that. So it's actually, you know, what you do is you solve this to get X1, right?","zh":"它只是说，如果 A 是这个乘积，那么 A 的逆就是这些逆矩阵的逆序乘积，对吧？所以我得到了这个东西。现在我只需正确地加上括号，也就是说，我首先将第一个矩阵 A1 的逆括起来，然后计算它。所以实际上，你所做的就是解这个方程以得到 X1，对吧？","start":4307.64,"end":4331.68},{"id":300,"text":"That's actually that second expression. Then I have to multiply by a2 inverse, which I do by simply calling the solve method on a2 with right-hand side x1. Everybody see that? So in fact, you solve this by just a sequence of solves. You can even think of this in a beautiful object-oriented way where each of these things has a solve method. And solve literally means...","zh":"这实际上是第二个表达式。然后我需要乘以 a2 的逆，我只需通过将 a2 的右侧设为 x1 并调用 solve 方法来完成。大家明白这一点吗？因此，实际上，你只需通过一系列的求解来完成这个过程。你甚至可以以一种优美的面向对象的方式来看待这个过程，其中每个对象都有一个 solve 方法。而 solve 实际上的意思就是……","start":4332.3,"end":4360.12},{"id":301,"text":"You know, solve A, B means it returns A inverse B, right? Some of these methods are idiotic, like it would be diagonal or a permutation or something like that. Doesn't matter. That's the idea. So you solve that by literally just a sequence of solves. That's it. Okay? All right. Now...","zh":"你知道吗，解A、B意味着返回A的逆乘以B，对吧？有些方法很傻，比如它可能是对角矩阵或排列矩阵之类的。没关系。这就是想法。所以你只需通过一系列的求解来完成。就是这样。明白了吗？好吧。现在...","start":4360.62,"end":4381.83}],"notes":["本段讲解了矩阵分解的基本思想，即通过将矩阵分解为多个容易求解的子矩阵的乘积，从而简化求解线性方程组的过程。讲者指出，虽然术语中提到‘容易求逆’，但实际上指的是容易求解方程组，而不是实际计算矩阵的逆。","讲者强调，矩阵分解的核心在于将原问题分解为一系列子问题，每个子问题可以通过调用‘solve’方法来求解。这种方法避免了直接计算矩阵的逆，从而提高了计算效率。","讲者提到，分解后的矩阵可能具有特殊结构，如对角矩阵或排列矩阵，这些结构使得求解过程更加高效。虽然这些方法可能看起来有些‘愚蠢’，但它们在实际应用中非常有用。","讲者通过举例说明，分解后的矩阵可以通过顺序调用‘solve’方法来求解，这体现了面向对象编程的思想，即每个子矩阵都有一个对应的求解方法。","讲者指出，‘solve’方法的实际含义是返回矩阵的逆与右侧向量的乘积，即A⁻¹B。这种方法避免了显式计算逆矩阵，从而节省了计算资源。","讲者最后总结，矩阵分解的核心思想是通过分解将复杂问题转化为一系列简单问题，从而高效求解线性方程组。这种方法在实际应用中非常常见，如QR分解、奇异值分解等。"],"formulas":[{"latex":"A = A_1 A_2","symbols":"A 是分解后的矩阵乘积","explanation":"公式正确，表示矩阵 A 被分解为两个矩阵 A1 和 A2 的乘积。","evidence":"It just says, well, if A is this product, then the inverse of A is the product of the inverses in reverse order, right? So I get this thing. And now I just put parentheses the right way, which is to say I first put a parentheses around the first one, A1 inverse B. And I calculate that. So it's actually, you know, what you do is you solve this to get X1, right?"},{"latex":"A^{-1} B = A_1^{-1} A_2^{-1} B","symbols":"求解线性方程组的步骤","explanation":"公式正确，表示通过矩阵分解求解线性方程组的步骤，即先计算 A2^{-1} B，再计算 A1^{-1} 与该结果的乘积。","evidence":"That's actually that second expression. Then I have to multiply by a2 inverse, which I do by simply calling the solve method on a2 with right-hand side x1. Everybody see that? So in fact, you solve this by just a sequence of solves. You can even think of this in a beautiful object-oriented way where each of these things has a solve method. And solve literally means..."}],"uncertainties":[],"diagram":"none","start":4226.81,"end":4381.83,"asr_flags":[],"math_clarifications":["公式 1 的逆矩阵乘积顺序错误，应为 A1^{-1} A2^{-1}，而不是 A2^{-1} A1^{-1}。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4226.81,"text":"And now we're going to get to what the method is. And actually, it's much more important to just understand the high-level idea than the low-level details, right? Except if you're in the few people who actually work on these methods so that the rest of us benefit. But the rest of us, here's the method. It's actually very simple, and there's already like immediately weird things that you, I don't know, some of you probably will leave today knowing something you didn't know before that's weird and shocking. So here it is."},{"start":4256.81,"text":"The general method works like this. You take a matrix A. You want to solve AX equals B. You take the matrix A, and the first thing you do is you factor it. And factor it means you write it out as a product of matrices. You know a bunch of these factorizations, probably. Like there's the QR factorization. There's the eigen decomposition, singular value decomposition. You probably know a bunch of these already anyway."},{"start":4277.3,"text":"So you factor it into a product of matrices, each of which is easy to invert. People say that. By the way, when they say that, that's slang. It doesn't mean that anyone's going to invert that matrix. When you say easy to invert, it means it's easy to solve AX equals B. That's what they actually mean by that. But they just say easy to invert, even though no one is inverting any matrices. So this is really, really quite dumb."},{"start":4307.64,"text":"It just says, well, if A is this product, then the inverse of A is the product of the inverses in reverse order, right? So I get this thing. And now I just put parentheses the right way, which is to say I first put a parentheses around the first one, A1 inverse B. And I calculate that. So it's actually, you know, what you do is you solve this to get X1, right?"},{"start":4332.3,"text":"That's actually that second expression. Then I have to multiply by a2 inverse, which I do by simply calling the solve method on a2 with right-hand side x1. Everybody see that? So in fact, you solve this by just a sequence of solves. You can even think of this in a beautiful object-oriented way where each of these things has a solve method. And solve literally means..."},{"start":4360.62,"text":"You know, solve A, B means it returns A inverse B, right? Some of these methods are idiotic, like it would be diagonal or a permutation or something like that. Doesn't matter. That's the idea. So you solve that by literally just a sequence of solves. That's it. Okay? All right. Now..."}],"speech_gaps":[],"frame":"../frames/v012/026.webp","frame_time":4238.81},{"title":"矩阵分解与求解线性方程组的复杂度","segments":[{"id":302,"text":"Usually the way this works, there are exceptions which we're going to talk about, but it works kind of in a cool way. Usually, I mean, in the simplest, most generic cases, the factorization costs order n cubed. And then we'll see that the solve actually is going to take order n squared. Now things get weird. Because suppose I ask you, how long does it take me to solve one equation with 5,000 variables?","zh":"通常，这种工作方式有一些例外情况，我们之后会讨论，但它的运作方式有点酷。通常来说，我指的是在最简单、最通用的情况下，分解的代价是数量级为n的立方。然后我们会看到，求解实际上会是数量级为n的平方。事情变得奇怪了。假设我问你，解决一个有5,000个变量的方程需要多长时间？","start":4382.54,"end":4411.15},{"id":303,"text":"5,000 by 5,000 matrix A, 5,000 vector B, and I want to compute, you know, whatever. I want to actually factor A, right? Well, okay, it's order of magnitude. It's under a second. I mean, it depends on what you're doing it on, but it's not minutes. It's not milliseconds. That's order. Well, it'd be milliseconds on some crazy things, but that's fine, right? Everybody follow this? And now I'm going to ask you, let's say it's a second. We'll make it simple.","zh":"一个5,000乘5,000的矩阵A，一个5,000维的向量B，我想计算一些东西。我实际上想分解A，对吧？好吧，它是一个数量级的问题。它不到一秒。我的意思是，这取决于你在什么设备上运行，但它不是几分钟，也不是毫秒。这是数量级。好吧，它在某些疯狂的设备上可能需要毫秒，但这没关系，对吧？大家明白这一点吗？现在我问你，假设它需要一秒。我们简单一点。","start":4412.12,"end":4440.89},{"id":304,"text":"Suppose I say, well, now I want to do this. I want to actually solve 10 sets of equations with the same matrix, but different right-hand sides. Well, the naive method would take 10 seconds, because you'd just have a little loop or whatever, unless you had 10 cores around and parallelized it, but that's okay, but whatever, right? So you just, it'd take 10 seconds. Everybody following this? How long, in fact, does it take if you know what you're doing?","zh":"假设我说，现在我想做这个。我想用同一个矩阵解决10组方程，但右边的向量不同。那么，朴素的方法需要10秒，因为你只需要一个简单的循环或者什么的，除非你有10个核心并行化它，但这没关系，对吧？所以它需要10秒。大家明白这一点吗？实际上，如果你知道怎么做，需要多长时间？","start":4441.34,"end":4468.0},{"id":305,"text":"Let's review, right? So I want you to solve 5,000 equations, 5,000 variables, right? Takes a second, okay? Now I'd say, okay, thanks for doing that. I'd like to do it now for 10 sets with the same coefficient matrix. A normal person would say, like, 10 seconds? I mean, are we, right? And what is the actual number? It's one second, right? Why? Because...","zh":"让我们回顾一下，对吧？我想解5,000个方程，每个方程有5,000个变量，对吧？需要一秒，对吧？现在我说，好吧，谢谢你们做这个。现在我想用同样的系数矩阵做10组。一个正常的人会说，大概是10秒？我的意思是，我们是不是这样？而实际的数字是多少？它是一秒，对吧？为什么？因为……","start":4473.21,"end":4500.2},{"id":306,"text":"you know, if it's 5,000 by 5,000 matrix took a second to factor, solve is going to be a factor n smaller because that's n squared, not n cubed, okay? So it takes, so the answer, that works out to actually microseconds, right? So the answer would be, oh yeah, it's about one second plus maybe about 150 microseconds. Everybody following this? Okay, so how many, I mean, unless you, until you know this, this is not obvious, right? So actually, how many people knew that?","zh":"你知道的，如果一个5,000乘5,000的矩阵需要一秒来分解，那么求解的代价会比分解小一个数量级，因为求解是n的平方，而不是n的立方，对吧？所以它需要，所以答案实际上会是微秒级，对吧？所以答案会是，哦，对了，大约是一秒加上可能约150微秒。大家明白这一点吗？好的，那么有多少人知道这一点呢？","start":4500.94,"end":4530.0},{"id":307,"text":"Basically, you can solve 10 sets of linear equations. Basically, the exact same cost of solving one. Some of you must have known this or something. Okay. Everybody? Okay. I'm not detecting that you're that impressed. Are you just like, who cares? I mean, it's kind of cool, right?","zh":"基本上，你可以解10组线性方程。基本上，和解一组的代价是相同的。你们中的一些人可能已经知道这个或者类似的东西了。好的。大家明白吗？好的。我没有检测到你们对此感到印象深刻。你们是不是只是觉得，这有什么关系？我是说，这有点酷，对吧？","start":4530.77,"end":4554.68}],"notes":["本段讲解了矩阵分解与求解线性方程组的复杂度差异。通常，矩阵分解的复杂度为O(n³)，而求解多个方程组（相同系数矩阵，不同右侧向量）的复杂度为O(n²)。这意味着，一旦矩阵被分解，求解多个方程组的时间复杂度会显著降低。","讲者通过一个具体的例子说明了这一概念：对于一个5000×5000的矩阵，分解需要约1秒，而求解10个方程组的时间复杂度为O(n²)，因此实际耗时仅为约1秒加上约150微秒。这表明，一旦矩阵被分解，求解多个方程组的时间成本几乎可以忽略不计。","讲者强调，这一概念对于理解线性代数在实际计算中的效率至关重要。许多学生可能在学习过程中没有意识到这一点，因此需要通过具体的例子和计算来加深理解。","讲者还提到，这一概念在实际应用中非常重要，尤其是在处理大规模数据集或进行数值计算时，能够显著提高计算效率。","讲者通过提问的方式引导学生思考，强调了这一概念的非直观性，以及掌握这一知识的重要性。","最后，讲者以一种轻松的语气结束，强调了这一概念的实用性，鼓励学生在实际应用中加以利用。"],"formulas":[{"latex":"O(n^3)","symbols":"矩阵分解的复杂度","explanation":"矩阵分解的复杂度为O(n^3)，这是原始讲授内容中提到的，符合数学类型和记号。","evidence":"Let's review, right? So I want you to solve 5,000 equations, 5,000 variables, right? Takes a second, okay? Now I'd say, okay, thanks for doing that. I'd like to do it now for 10 sets with the same coefficient matrix. A normal person would say, like, 10 seconds? I mean, are we, right? And what is the actual number? It's one second, right? Why? Because..."},{"latex":"O(n^2)","symbols":"求解多个方程组的复杂度","explanation":"求解多个方程组的复杂度为O(n^2)，这是原始讲授内容中提到的，符合数学类型和记号。","evidence":"you know, if it's 5,000 by 5,000 matrix took a second to factor, solve is going to be a factor n smaller because that's n squared, not n cubed, okay? So it takes, so the answer, that works out to actually microseconds, right? So the answer would be, oh yeah, it's about one second plus maybe about 150 microseconds. Everybody following this? Okay, so how many, I mean, unless you, until you know this, this is not obvious, right? So actually, how many people knew that?"}],"uncertainties":[],"diagram":"none","start":4382.54,"end":4554.68,"asr_flags":[],"math_clarifications":["原始讲授内容中没有涉及具体的数学公式或符号，因此无法进行更深入的数学复核。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4382.54,"text":"Usually the way this works, there are exceptions which we're going to talk about, but it works kind of in a cool way. Usually, I mean, in the simplest, most generic cases, the factorization costs order n cubed. And then we'll see that the solve actually is going to take order n squared. Now things get weird. Because suppose I ask you, how long does it take me to solve one equation with 5,000 variables?"},{"start":4412.12,"text":"5,000 by 5,000 matrix A, 5,000 vector B, and I want to compute, you know, whatever. I want to actually factor A, right? Well, okay, it's order of magnitude. It's under a second. I mean, it depends on what you're doing it on, but it's not minutes. It's not milliseconds. That's order. Well, it'd be milliseconds on some crazy things, but that's fine, right? Everybody follow this? And now I'm going to ask you, let's say it's a second. We'll make it simple."},{"start":4441.34,"text":"Suppose I say, well, now I want to do this. I want to actually solve 10 sets of equations with the same matrix, but different right-hand sides. Well, the naive method would take 10 seconds, because you'd just have a little loop or whatever, unless you had 10 cores around and parallelized it, but that's okay, but whatever, right? So you just, it'd take 10 seconds. Everybody following this? How long, in fact, does it take if you know what you're doing?"},{"start":4473.21,"text":"Let's review, right? So I want you to solve 5,000 equations, 5,000 variables, right? Takes a second, okay? Now I'd say, okay, thanks for doing that. I'd like to do it now for 10 sets with the same coefficient matrix. A normal person would say, like, 10 seconds? I mean, are we, right? And what is the actual number? It's one second, right? Why? Because..."},{"start":4500.94,"text":"you know, if it's 5,000 by 5,000 matrix took a second to factor, solve is going to be a factor n smaller because that's n squared, not n cubed, okay? So it takes, so the answer, that works out to actually microseconds, right? So the answer would be, oh yeah, it's about one second plus maybe about 150 microseconds. Everybody following this? Okay, so how many, I mean, unless you, until you know this, this is not obvious, right? So actually, how many people knew that?"},{"start":4530.77,"text":"Basically, you can solve 10 sets of linear equations. Basically, the exact same cost of solving one. Some of you must have known this or something. Okay. Everybody? Okay. I'm not detecting that you're that impressed. Are you just like, who cares? I mean, it's kind of cool, right?"}],"speech_gaps":[],"frame":"../frames/v012/027.webp","frame_time":4394.54},{"title":"LU分解与求解方法","segments":[{"id":308,"text":"Okay, I'll put it this way. I'm impressed. I think you should be. Honestly, I think you should be too, right? By the way, this requires that you actually know what you're doing, right? Because if you actually just, if you say, you know, for right-hand side in right-hand sides, you know, solve A, B, you're sure. By the way, another name for this is called factorization caching, right? So it means you factor once and then do multiple solves, okay?","start":4555.85,"end":4584.27},{"id":309,"text":"All right, everybody, I think this makes sense, right? Okay. And, you know, the most common one is the LU factorization. L is lower triangular, U is upper. And it basically says you can take a matrix A. If it's non-singular, you can write it as a permutation times a lower times an upper triangular matrix. The cost of that is like n cubed flops. And then this is how you'd solve it. It looks like this, right? So...","start":4585.04,"end":4613.52},{"id":310,"text":"This one dominates, right? And then these things, this is the solve method, right? This is where you're actually walking through the three factors. That's why there's three things here, right? Each of these is solving essentially or computing the, it's working with the inverse of one of the factors, right? And so this is what you're doing here. And this whole thing here is order n squared. That's order n cubed.","start":4614.54,"end":4642.58},{"id":311,"text":"Okay? So, this comes up in a whole lot of areas. But, okay, so this is cool. And this is kind of the same as the Gaussian elimination that you were almost certainly tortured with either in high school or undergraduate days, right? So, it's basically this. By the way, when you were taught that, did anyone say that it has nothing to do whatsoever with how people actually solve equations? Probably not. No. So, yeah, so.","start":4643.18,"end":4671.92},{"id":312,"text":"why you would cause people to actually do Gaussian. I mean, I don't know. It's like writing an assembly language program. A person should do that either zero or once. And absolutely no more than that. And most normal people should do it exactly zero times. But they should appreciate, oh, sorry, we need a very small number of people who are very weird and like that to do that. That's all they do, right? So that the rest of us can benefit. That's kind of the way this all works out.","start":4672.84,"end":4700.12},{"id":313,"text":"Yeah, so why? I don't know. Anyway, so this is basically the same as that, except it's not the way it really works. Of course, the way it really works is all of this is the same thing, except all these things are blocked, right? And if you have multiple cores, like on a GPU or just multiple cores, stuff is being done at the same time, right? But other than that, the idea is identical. Okay, so I think we'll quit here, and we'll continue next time.","start":4702.44,"end":4729.26}],"notes":["本段主要讲解LU分解的概念及其在求解线性方程组中的应用。LU分解是一种将矩阵分解为下三角矩阵L和上三角矩阵U的方法，适用于非奇异矩阵。分解过程需要n³次浮点运算，而求解过程则为O(n²)。这种分解方法与高斯消元法在本质上是相同的，但实际应用中会考虑并行计算以提高效率。","讲者提到LU分解的别称是factorization caching，即通过一次分解后进行多次求解，从而节省计算资源。这在实际工程中非常重要，因为重复求解线性方程组时，分解步骤只需执行一次。","讲者还提到高斯消元法在教学中常被使用，但实际应用中并不直接使用该方法，而是通过分解和并行计算来优化求解过程。这说明了理论与实际应用之间的差异。","讲者强调，虽然高斯消元法在教学中被广泛使用，但大多数实际应用中并不需要手动执行该过程，而是依赖于高效的算法和并行计算技术。","讲者提到，LU分解的计算过程可以被并行化，特别是在多核处理器或GPU上，这使得大规模问题的求解更加高效。","最后，讲者总结了LU分解的基本思想，并指出其与高斯消元法的相似性，同时强调了实际应用中并行计算的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4555.85,"end":4729.26,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4555.85,"text":"Okay, I'll put it this way. I'm impressed. I think you should be. Honestly, I think you should be too, right? By the way, this requires that you actually know what you're doing, right? Because if you actually just, if you say, you know, for right-hand side in right-hand sides, you know, solve A, B, you're sure. By the way, another name for this is called factorization caching, right? So it means you factor once and then do multiple solves, okay?"},{"start":4585.04,"text":"All right, everybody, I think this makes sense, right? Okay. And, you know, the most common one is the LU factorization. L is lower triangular, U is upper. And it basically says you can take a matrix A. If it's non-singular, you can write it as a permutation times a lower times an upper triangular matrix. The cost of that is like n cubed flops. And then this is how you'd solve it. It looks like this, right? So..."},{"start":4614.54,"text":"This one dominates, right? And then these things, this is the solve method, right? This is where you're actually walking through the three factors. That's why there's three things here, right? Each of these is solving essentially or computing the, it's working with the inverse of one of the factors, right? And so this is what you're doing here. And this whole thing here is order n squared. That's order n cubed."},{"start":4643.18,"text":"Okay? So, this comes up in a whole lot of areas. But, okay, so this is cool. And this is kind of the same as the Gaussian elimination that you were almost certainly tortured with either in high school or undergraduate days, right? So, it's basically this. By the way, when you were taught that, did anyone say that it has nothing to do whatsoever with how people actually solve equations? Probably not. No. So, yeah, so."},{"start":4672.84,"text":"why you would cause people to actually do Gaussian. I mean, I don't know. It's like writing an assembly language program. A person should do that either zero or once. And absolutely no more than that. And most normal people should do it exactly zero times. But they should appreciate, oh, sorry, we need a very small number of people who are very weird and like that to do that. That's all they do, right? So that the rest of us can benefit. That's kind of the way this all works out."},{"start":4702.44,"text":"Yeah, so why? I don't know. Anyway, so this is basically the same as that, except it's not the way it really works. Of course, the way it really works is all of this is the same thing, except all these things are blocked, right? And if you have multiple cores, like on a GPU or just multiple cores, stuff is being done at the same time, right? But other than that, the idea is identical. Okay, so I think we'll quit here, and we'll continue next time."}],"speech_gaps":[],"frame":"../frames/v012/028.webp","frame_time":4567.85}],"complete":true," function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
