<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 12</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">12 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 12 · 完整初稿</p><video id="video" hidden controls preload="none"></video><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v012","title":"12 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 12","course":"凸优化","pages":[{"title":"解析中心的概念与计算","segments":[{"id":0,"text":"Today we'll continue describing these geometric type problems. One thing that is going to come up actually not maybe in a couple of weeks in the class is the concept of an analytic center. It's actually not an analytic center of a set, although people..."},{"id":1,"text":"informally say the analytic center of a set. They don't mean that. What they really mean is the analytic center of a description of a set, which is a set of inequalities. And the analytic center goes like this. So let's say we have, I mean, the equality constraints we just keep right here. But suppose we have a bunch of inequalities here, right? And what this means, we look at"},{"id":2,"text":"So obviously, the fi of x should be less than zero. Minus fi of x is what people would call the margin, when that's positive. So minus fi of x is the margin. And it's roughly how much you have left before you violate the inequalities. That's the margin. And the so-called analytic center of a set of inequalities is given by minimizing the negative log of the"},{"id":3,"text":"This is the margin, minus fi of x, right? Another way to say it is you maximize the product of the margins, okay? So that's, this comes up in a lot of other things, in log utilities, it's used universally in networking and things like that. So this is not at all uncommon. Okay, so that is the so-called analytic center. Oh, of course, that's a convex problem. Why? Because minus log minus argument is convex and increasing, okay?"},{"id":4,"text":"And then the FIs of X are convex. Okay, and this is, we'll actually soon, we'll see very soon that this is actually quite straightforward to compute. Matter of fact, you will actually be doing, you'll be writing code that will basically compute analytic centers and things like that. Okay, so that's the analytic, that is the analytic center of a set of inequalities."},{"id":5,"text":"And here's just a picture of what it looks like for a polyhedron, right? So this shows you what's feasible. Each of these corresponds to one of the rows here, each of those lines. The dashed curves give you the level curves of this log barrier. This is called the log barrier. It's called a log barrier. I think that's maybe borrowed from physics or something like that because it's like a potential function that goes up."}],"notes":["本段讲解了解析中心的概念，指出解析中心并不是集合的中心，而是对集合描述（即不等式约束）的中心。解析中心的定义是通过最小化负对数屏障函数来计算，该函数与不等式约束的边际有关。","解析中心的计算涉及凸优化问题，因为负对数函数是凸且递增的，而不等式约束的函数也是凸的。因此，整个优化问题是一个凸问题，可以高效求解。","解析中心的计算在实际中非常常见，例如在网络优化和对数效用函数中。它通过最大化边际的乘积来实现，这与对数屏障函数的性质密切相关。","解析中心的计算方法在课程中将很快展开，学生将学习如何编写代码来计算解析中心，并应用于实际问题。","课程中还提到解析中心的几何意义，通过多面体的示意图展示了可行域和对数屏障函数的等高线，帮助理解解析中心的直观含义。","对数屏障函数被比喻为物理中的势能函数，随着约束的接近而增加，这有助于理解其在优化问题中的作用。"],"formulas":[{"latex":"minimize -\\text{log}(-f_i(x))","symbols":"最小化负对数屏障函数","explanation":"公式正确，表示对每个不等式约束的负对数屏障函数进行最小化，这是计算解析中心的标准方法。","evidence":"So obviously, the fi of x should be less than zero. Minus fi of x is what people would call the margin, when that's positive. So minus fi of x is the margin. And it's roughly how much you have left before you violate the inequalities. That's the margin. And the so-called analytic center of a set of inequalities is given by minimizing the negative log of the"},{"latex":"maximize \\prod_{i} ( -f_i(x) )","symbols":"最大化边际的乘积","explanation":"原公式中的'product of margins'应理解为所有边际的乘积，即$\\prod_{i} ( -f_i(x) )$，这是最大化边际的乘积的正确表达方式。","evidence":"This is the margin, minus fi of x, right? Another way to say it is you maximize the product of the margins, okay? So that's, this comes up in a lot of other things, in log utilities, it's used universally in networking and things like that. So this is not at all uncommon. Okay, so that is the so-called analytic center. Oh, of course, that's a convex problem. Why? Because minus log minus argument is convex and increasing, okay?"}],"uncertainties":["FIs of X"],"diagram":"none","start":5.23,"end":162.2,"asr_flags":[],"math_clarifications":["原公式中的'product of margins'被转写为'maximize \\text{product of margins}'，但未明确表示为乘积形式，因此修正为$\\prod_{i} ( -f_i(x) )$以明确表示乘积。"],"raw_segments":[{"start":5.23,"text":"Today we'll continue describing these geometric type problems. One thing that is going to come up actually not maybe in a couple of weeks in the class is the concept of an analytic center. It's actually not an analytic center of a set, although people..."},{"start":25.07,"text":"informally say the analytic center of a set. They don't mean that. What they really mean is the analytic center of a description of a set, which is a set of inequalities. And the analytic center goes like this. So let's say we have, I mean, the equality constraints we just keep right here. But suppose we have a bunch of inequalities here, right? And what this means, we look at"},{"start":50.83,"text":"So obviously, the fi of x should be less than zero. Minus fi of x is what people would call the margin, when that's positive. So minus fi of x is the margin. And it's roughly how much you have left before you violate the inequalities. That's the margin. And the so-called analytic center of a set of inequalities is given by minimizing the negative log of the"},{"start":80.52,"text":"This is the margin, minus fi of x, right? Another way to say it is you maximize the product of the margins, okay? So that's, this comes up in a lot of other things, in log utilities, it's used universally in networking and things like that. So this is not at all uncommon. Okay, so that is the so-called analytic center. Oh, of course, that's a convex problem. Why? Because minus log minus argument is convex and increasing, okay?"},{"start":109.68,"text":"And then the FIs of X are convex. Okay, and this is, we'll actually soon, we'll see very soon that this is actually quite straightforward to compute. Matter of fact, you will actually be doing, you'll be writing code that will basically compute analytic centers and things like that. Okay, so that's the analytic, that is the analytic center of a set of inequalities."},{"start":134.76,"text":"And here's just a picture of what it looks like for a polyhedron, right? So this shows you what's feasible. Each of these corresponds to one of the rows here, each of those lines. The dashed curves give you the level curves of this log barrier. This is called the log barrier. It's called a log barrier. I think that's maybe borrowed from physics or something like that because it's like a potential function that goes up."}],"speech_gaps":[],"frame":"../frames/v012/001.webp","frame_time":17.23},{"title":"凸优化中的分析中心与椭球近似","segments":[{"id":6,"text":"to infinity as you approach the boundary. So that's like a barrier for a particle or something like that, if that were an energy. And a couple of things you can see. It's actually kind of cool. So we've marked there the analytic center. That's the point where that barrier is minimized. So whatever that point is, it maximizes the product, actually, of the margins for the inequalities."},{"id":7,"text":"So that's what it does. And you can see, actually, that the level sets close down to the analytic center are actually, of course, going to be very close to ellipsoidal. That's, of course, true for any kind of smooth function. So the dark ellipsoid drawn there is this."},{"id":8,"text":"It turns out that for the analytic center, if you calculate the Hessian of it, then the ellipsoid defined by the center but with a 1 on the right-hand side, that ellipsoid is guaranteed to be inside the set. So this will be important later. If you puff that ellipsoid up by a factor around m, actually m would be enough because that would be square root of m squared there."},{"id":9,"text":"If you puff it up by a factor of M, then you cover the ellipsoid. So basically it says that the ellipsoids defined by analytic centers also have this approximation property. It gives you an inside ellipsoid, and then when you puff it up by a factor, it covers the set. So it gives you this approximation. Here, the approximation..."},{"id":10,"text":"If you puff it up by a factor of M, then you cover the ellipsoid. So basically it says that the ellipsoids defined by analytic centers also have this approximation property. It gives you an inside ellipsoid, and then when you puff it up by a factor, it covers the set. So it gives you this approximation. Here, the approximation..."},{"id":11,"text":"Okay, what we're going to look at now is linear discrimination. Probably most of you have seen this maybe in some basic machine learning class. But here's the problem. And there's many, many variations on this. But it looks like this. I'm going to give you a set of points, x1 through xn. These are vectors and a bunch of y's. And if you like, these are simply feature vectors associated with a positive outcome and a negative outcome in some kind of Boolean."}],"notes":["本段讲解了凸优化中分析中心的性质，即通过计算分析中心的Hessian矩阵，可以定义一个椭球，该椭球保证位于原始集合内部。这一性质在后续内容中将非常重要。","当椭球被放大一个因子m时，该椭球能够覆盖原始集合。这里提到的放大因子m与集合中的不等式数量有关，而不仅仅是维度n。因此，当m远大于n时，这种近似可能不如其他方法有效。","分析中心定义的椭球具有近似性质，即通过放大椭球可以覆盖整个集合。这种近似方法在凸优化中具有实际应用价值，尤其是在处理复杂集合时。","与Lohner-John椭球或最小体积覆盖椭球不同，分析中心的椭球近似依赖于不等式数量m，而非维度n。这表明在某些情况下，该方法可能不如其他方法精确。","本段强调了分析中心椭球近似方法的局限性，即当m远大于n时，该方法的近似效果较差。这为后续学习提供了重要的背景信息。","最后，本段提到将在后续课程中更深入探讨这一主题，表明分析中心椭球近似是凸优化中的一个重要概念，具有广泛的应用前景。"],"formulas":[],"uncertainties":["puff that ellipsoid up by a factor around m, actually m would be enough because that would be square root of m squared there."],"diagram":"none","start":162.5,"end":326.38,"asr_flags":[],"math_clarifications":["原文中没有提供足够的数学信息来验证椭球定义和缩放公式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":162.5,"text":"to infinity as you approach the boundary. So that's like a barrier for a particle or something like that, if that were an energy. And a couple of things you can see. It's actually kind of cool. So we've marked there the analytic center. That's the point where that barrier is minimized. So whatever that point is, it maximizes the product, actually, of the margins for the inequalities."},{"start":190.12,"text":"So that's what it does. And you can see, actually, that the level sets close down to the analytic center are actually, of course, going to be very close to ellipsoidal. That's, of course, true for any kind of smooth function. So the dark ellipsoid drawn there is this."},{"start":216.11,"text":"It turns out that for the analytic center, if you calculate the Hessian of it, then the ellipsoid defined by the center but with a 1 on the right-hand side, that ellipsoid is guaranteed to be inside the set. So this will be important later. If you puff that ellipsoid up by a factor around m, actually m would be enough because that would be square root of m squared there."},{"start":244.46,"text":"If you puff it up by a factor of M, then you cover the ellipsoid. So basically it says that the ellipsoids defined by analytic centers also have this approximation property. It gives you an inside ellipsoid, and then when you puff it up by a factor, it covers the set. So it gives you this approximation. Here, the approximation..."},{"start":268.2,"text":"Now remember that for things like the Lohner-John ellipsoid or the minimum volume covering ellipsoid or the maximum volume inscribed ellipsoid, there it depended only on the dimension. Here it depends on m, which is the number of inequalities here. So if m is much larger than n, this is a worse bound, worse approximation bound of a convex set. So, okay. But anyway, you'll be seeing much more about this in a couple of weeks."},{"start":298.44,"text":"Okay, what we're going to look at now is linear discrimination. Probably most of you have seen this maybe in some basic machine learning class. But here's the problem. And there's many, many variations on this. But it looks like this. I'm going to give you a set of points, x1 through xn. These are vectors and a bunch of y's. And if you like, these are simply feature vectors associated with a positive outcome and a negative outcome in some kind of Boolean."}],"speech_gaps":[],"frame":"../frames/v012/002.webp","frame_time":174.5},{"title":"分离超平面与感知机算法","segments":[{"id":12,"text":"problem, right? So I have some data. And what we seek is a hyperplane. So that's defined by a vector A and a constant B. And we want all the xi's to be on one side of that hyperplane, and we want all the y's to be on the other side. So that's what we want, separating hyperplane. Actually, shockingly, this was studied in the early 1950s."},{"id":13,"text":"People came up with something called the perceptron algorithm, which you might have seen somewhere. It's like a very early thing. And weirdly, many years went by before someone looked up and said, dude, that's an LP. In which case, people literally down the hall know how to solve these. So it's just one of those cases where the diffusion of knowledge took some time. So there is a subtlety here that we're going to look at. Oh, one thing."},{"id":14,"text":"we have to be careful of is the notation, right? So here, the variables are basically A and B. And the data are the XIs and the YIs, right? Which violates this usual convention, right? That things at the end of the alphabet are typically your variables, and things at the beginning are typically your parameters, your data, okay? So you have to be on your toes here. So what sort of inequality on A and B is this?"},{"id":15,"text":"Okay, so here'd be an example you're working with someone and they're designing a power amplifier and they go your budget is 50 milliwatts Then your design and you go cool. Okay, and then they come back and they go it's strict You have to be less than 50 milliwatts Not less than or equal to and it's like okay. This is just completely idiotic and makes no sense. Everybody see what I'm saying. So you just"},{"id":16,"text":"Okay, so here'd be an example you're working with someone and they're designing a power amplifier and they go your budget is 50 milliwatts Then your design and you go cool. Okay, and then they come back and they go it's strict You have to be less than 50 milliwatts Not less than or equal to and it's like okay. This is just completely idiotic and makes no sense. Everybody see what I'm saying. So you just"},{"id":17,"text":"any sense, and you quietly replace less strictly less than with less than or equal to, and no one"},{"id":18,"text":"gets hurt. Everyone got this? Okay, so that's fine. Now, if we try that here, let's see what"},{"id":19,"text":"happens, right? So you'd say, well, a i transpose x plus b is bigger than or equal to zero, and I"},{"id":20,"text":"also want a transpose y i plus b less than or equal to zero. Anybody got any suggestions about"},{"id":21,"text":"also want a transpose y i plus b less than or equal to zero. Anybody got any suggestions about"},{"id":22,"text":"about how to solve that system of inequalities?"},{"id":23,"text":"A and B zero, I like it."},{"id":24,"text":"A and B zero, I like it."}],"notes":["本段讨论了分离超平面的概念，即通过一个超平面将数据点分为两类。超平面由向量A和常数B定义，所有xi位于超平面的一侧，所有yi位于另一侧。这种分离超平面的概念在1950年代初被研究，随后发展出感知机算法。","讲者提到感知机算法是早期的机器学习方法，但直到多年后人们才意识到它实际上是一个线性规划（LP）问题。这说明了知识传播的延迟，强调了理解问题本质的重要性。","讲者指出在符号使用上需要注意，通常末尾字母表示变量，而开头字母表示参数或数据。但在本段中，变量是A和B，数据是xi和yi，这与常规符号习惯不同，需要特别注意。","讲者讨论了严格不等式在实际应用中的问题，指出严格不等式在某些情况下没有实际意义，应替换为非严格不等式。例如，在设计功率放大器时，预算限制为50毫瓦，严格小于50毫瓦是没有意义的，应改为小于等于。","讲者通过一个例子说明如何处理严格不等式，强调在实际应用中应避免使用严格不等式，以确保问题的可行性。","最后，讲者提出一个关于如何解决不等式系统的问题，即如何找到满足条件的A和B。这引导学生思考如何将分离超平面问题转化为优化问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":327.18,"end":506.25,"asr_flags":[],"raw_segments":[{"start":327.18,"text":"problem, right? So I have some data. And what we seek is a hyperplane. So that's defined by a vector A and a constant B. And we want all the xi's to be on one side of that hyperplane, and we want all the y's to be on the other side. So that's what we want, separating hyperplane. Actually, shockingly, this was studied in the early 1950s."},{"start":354.76,"text":"People came up with something called the perceptron algorithm, which you might have seen somewhere. It's like a very early thing. And weirdly, many years went by before someone looked up and said, dude, that's an LP. In which case, people literally down the hall know how to solve these. So it's just one of those cases where the diffusion of knowledge took some time. So there is a subtlety here that we're going to look at. Oh, one thing."},{"start":384.72,"text":"we have to be careful of is the notation, right? So here, the variables are basically A and B. And the data are the XIs and the YIs, right? Which violates this usual convention, right? That things at the end of the alphabet are typically your variables, and things at the beginning are typically your parameters, your data, okay? So you have to be on your toes here. So what sort of inequality on A and B is this?"},{"start":417.13,"text":"What kind of function is A transpose XI plus B? What kind of function of the pair AB is that? It's linear. Yeah, okay, that's linear. Now there is one thing here. We have these strict inequalities. So let me just say a little bit about that. There are a lot of cases where strict inequalities are silly and just mean nothing and you just quietly replace them with inequalities."},{"start":445.84,"text":"Okay, so here'd be an example you're working with someone and they're designing a power amplifier and they go your budget is 50 milliwatts Then your design and you go cool. Okay, and then they come back and they go it's strict You have to be less than 50 milliwatts Not less than or equal to and it's like okay. This is just completely idiotic and makes no sense. Everybody see what I'm saying. So you just"},{"start":468.73,"text":"you basically, you just quietly, you try to explain to the person that that doesn't make"},{"start":472.89,"text":"any sense, and you quietly replace less strictly less than with less than or equal to, and no one"},{"start":478.27,"text":"gets hurt. Everyone got this? Okay, so that's fine. Now, if we try that here, let's see what"},{"start":485.81,"text":"happens, right? So you'd say, well, a i transpose x plus b is bigger than or equal to zero, and I"},{"start":492.81,"text":"also want a transpose y i plus b less than or equal to zero. Anybody got any suggestions about"},{"start":498.53,"text":"about how to solve that system of inequalities?"},{"start":503.15,"text":"A and B zero?"},{"start":504.47,"text":"A and B zero, I like it."}],"speech_gaps":[],"frame":"../frames/v012/003.webp","frame_time":339.18},{"title":"严格与非严格不等式的区别","segments":[{"id":25,"text":"So A and B zero works, okay?"},{"id":26,"text":"So this is one of those cases where the distinction"},{"id":27,"text":"between strict and non-strict actually matters, right?"},{"id":28,"text":"It actually matters because when you make it non-strict,"},{"id":29,"text":"when you make it non-strict, it's got a silly solution"},{"id":30,"text":"which is uninteresting, right?"},{"id":31,"text":"Okay, so in a lot of these cases,"},{"id":32,"text":"you actually have to hand-argue each one. I'm not aware of a general principle."},{"id":33,"text":"Hand-argue each one, and I'll do that argument right now."},{"id":34,"text":"The main arguments go something like this. This thing is, that inequality is homogeneous."},{"id":35,"text":"In other words, if I double A and B, then whatever this is, which is supposed to be positive,"},{"id":36,"text":"goes up by a factor of two. Everybody agree? Same over here. Same for the other one."},{"id":37,"text":"right? If this is supposed to be less than, if I double A and B, these things are negative,"},{"id":38,"text":"whatever they, they just got twice as negative. Everybody following this? So what I could do"},{"id":39,"text":"my claim is that I can, without loss of generality, replace these strict inequalities with these non-strict inequalities with a one."},{"id":40,"text":"with these non-strict inequalities with a one. The way I do that is up here,"},{"id":41,"text":"if you give me an A and a B that satisfies this,"},{"id":42,"text":"I simply scale them by whatever factor is needed to make, you know, however positive that was, how negative that was, I multiply by a factor which makes that bigger than or equal to 1. Everybody got it? So that says, if there exists A and B that satisfy that, then by multiplying them by a positive number, they're going to satisfy this. The converse goes like this. The converse is relatively straightforward, because if I tell you a number is bigger than or equal to 1, it's definitely positive."},{"id":43,"text":"Right. So everyone got this. It's actually a suddenly it's actually quite important. And I don't know, you could ease you could easily encounter this. That was a I mean, actually, both in your in research or other things or other places. So this is something we kind of expect you to know about. Yeah."},{"id":44,"text":"It's fine. That's totally cool. So if you want to put 10 to the 6 here, and minus 10 to the 6, that's perfectly good. And then to be quite precise, what I'm saying then is the first set of inequalities are feasible if and only if these are feasible, if and only if your variation where 1 is replaced with 10 to the 6 is feasible. And if 1 is feasible, all of them are feasible."},{"id":45,"text":"Period. Right? And if one is infeasible, all are infeasible. Right? And how do we translate among them? We just scale them by various things. Right? So, like, if I have an A and B that satisfies these, and I want to satisfy yours, I just multiply A and B by a million. And then they'll satisfy it. Make sense? So, okay."}],"notes":["本段讨论了严格不等式与非严格不等式之间的区别，特别是在凸优化问题中，这种区别可能对解的存在性和性质产生重要影响。讲者指出，当不等式是非严格时，可能会出现一些无意义的解，因此需要特别注意。","讲者强调，当处理这类不等式时，通常需要逐个进行论证，而不是依赖于通用原则。他提出了一种方法，即通过缩放变量来将严格不等式转换为非严格不等式，从而简化问题。","讲者进一步解释了如何通过缩放操作来证明严格不等式和非严格不等式之间的等价性。他指出，如果存在满足非严格不等式的解，那么通过适当缩放，可以得到满足严格不等式的解。","讲者还提到，如果一个不等式是可行的，那么所有通过缩放得到的变体也是可行的；反之，如果一个不等式不可行，那么所有通过缩放得到的变体也不可行。","讲者通过具体的例子说明了如何将一个不等式转换为另一个不等式，例如将1替换为10^6，从而展示这种转换的可行性。","最后，讲者指出，这种转换方法在实际应用中非常重要，尤其是在研究和工程问题中，需要理解这种转换的原理和应用。"],"formulas":[],"uncertainties":["10 to the 6"],"diagram":"none","start":506.35,"end":685.88,"asr_flags":[],"raw_segments":[{"start":506.35,"text":"So A and B zero works, okay?"},{"start":508.29,"text":"So this is one of those cases where the distinction"},{"start":511.39,"text":"between strict and non-strict actually matters, right?"},{"start":515.99,"text":"It actually matters because when you make it non-strict,"},{"start":519.13,"text":"when you make it non-strict, it's got a silly solution"},{"start":521.27,"text":"which is uninteresting, right?"},{"start":523.17,"text":"Okay, so in a lot of these cases,"},{"start":526.77,"text":"you actually have to hand-argue each one. I'm not aware of a general principle."},{"start":532.39,"text":"Hand-argue each one, and I'll do that argument right now."},{"start":536.99,"text":"The main arguments go something like this. This thing is, that inequality is homogeneous."},{"start":544.49,"text":"In other words, if I double A and B, then whatever this is, which is supposed to be positive,"},{"start":549.87,"text":"goes up by a factor of two. Everybody agr ll right. It doesn't mean we can't maximize it, right? Because maximizing this is the same as minimizing one over it because it's positive."}],"speech_gaps":[],"frame":"../frames/v012/005.webp","frame_time":699.07},{"title":"凸优化中的分离板与对偶问题","segments":[{"id":52,"text":"Right, so that says this problem is convex, that's a quadratic program, and that is, this will add this, this if you solve this problem this QP you'll actually get the thickest you'll get the thickest separating slab, make sense."},{"id":53,"text":"And in fact, we can even say a little bit about how there's an interesting way to get that slab. So for this problem over here, I think this shows you the separating slab for these points and these points. All make sense? Okay. And let's see, that's a QP. Again, you have to be very careful because you have to see what the variables are and all that sort of stuff. Here the variables are A and B. XI and YI are data. Okay."},{"id":54,"text":"So that's like robust linear discrimination is the way you might say it. That's dialect. That's like machine learning, old school machine learning dialect. Now, it's actually kind of interesting to take for this problem to work out what is the dual of this QP. It's not a QP. Sorry, I misspoke. It's not a QP unless you square it."},{"id":55,"text":"That's an equivalent problem. That's a QP. This would be, I guess, an SOCP, right? But I think that none of this would matter. Okay, so if you work out what the Lagrange dual is..."},{"id":56,"text":"You get something that looks like this, right? You have these two sets of inequalities, and you end up with something that looks like this. You should maximize 1 transpose lambda plus 1 transpose mu, subject to, and you get something that looks like this. It's actually kind of interesting, right? And it says that the sum of the lambdas and the sum of the mus have to be equal, right? And you get something like that. Okay, and the optimal value of that top problem is actually the maximum margin of separation."},{"id":57,"text":"It's the norm or whatever it is, right? Okay, so if you stare at this long enough, you realize that we can actually, what we can do is change variables to normalize the lambdas and the mus. They're both non-negative vectors, and we simply, we replace them with vectors that sum up."},{"id":58,"text":"to 1, entered on negative, otherwise known as mixture coefficients. So we do that, and you plug that in up here, and various things happen, and you end up with this problem here. Now this is very cool, because now we can look at it, right? This says that theta is a set of mixture coefficients, and so this is a general point in the convex hull of the original x's, right? Because it's a mixture of them."}],"notes":["本段讲解了凸优化中的分离板问题，指出这是一个二次规划（QP）问题，通过求解QP可以得到最厚的分离板。讲者提到，分离板的构造方式是通过变量A和B，以及数据点XI和YI来实现的。","讲者进一步说明，该问题的对偶问题具有特定的结构，虽然原问题不是QP，但通过平方可以将其转化为QP。对偶问题的结构包括两个不等式约束，并且最终目标是最大化1^Tλ + 1^Tμ，同时满足约束条件。","对偶问题的最优值对应于最大分离边距，这与分离板的构造密切相关。讲者指出，通过变量替换，可以将λ和μ归一化为和为1的向量，即混合系数，从而将问题转化为凸包内的点。","讲者强调，这种变量替换方法使得问题更加直观，因为混合系数的和为1，表示了原始数据点的线性组合，从而在凸包内形成一个点。这种转换有助于理解分离板与凸包之间的关系。","讲者还提到，这种对偶问题的结构和结果在机器学习中具有重要意义，尤其是在鲁棒线性判别和最大边距问题中。通过凸优化方法，可以有效地找到最优的分离板。","最后，讲者指出，这种变量替换和对偶问题的分析方法是凸优化中的一个典型例子，展示了如何通过对偶性来理解和解决实际问题。"],"formulas":[],"uncertainties":["entered on negative"],"diagram":"none","start":852.67,"end":1023.06,"asr_flags":[],"math_clarifications":["原文中提到的'最大边距'是描述性文字，而非数学表达式，不能直接等于一个数学量。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":852.67,"text":"right so that says this problem is convex that's a quadratic program and that is this will add this this if you solve this problem this QP you'll actually get the the thickest you'll get the thickest separating slab make sense"},{"start":873.62,"text":"And in fact, we can even say a little bit about how there's an interesting way to get that slab. So for this problem over here, I think this shows you the separating slab for these points and these points. All make sense? Okay. And let's see, that's a QP. Again, you have to be very careful because you have to see what the variables are and all that sort of stuff. Here the variables are A and B. XI and YI are data. Okay."},{"start":903.53,"text":"So that's like robust linear discrimination is the way you might say it. That's dialect. That's like machine learning, old school machine learning dialect. Now, it's actually kind of interesting to take for this problem to work out what is the dual of this QP. It's not a QP. Sorry, I misspoke. It's not a QP unless you square it."},{"start":929.32,"text":"That's an equivalent problem. That's a QP. This would be, I guess, an SOCP, right? But I think that none of this would matter. Okay, so if you work out what the Lagrange dual is..."},{"start":944.19,"text":"You get something that looks like this, right? You have these two sets of inequalities, and you end up with something that looks like this. You should maximize 1 transpose lambda plus 1 transpose mu, subject to, and you get something that looks like this. It's actually kind of interesting, right? And it says that the sum of the lambdas and the sum of the mus have to be equal, right? And you get something like that. Okay, and the optimal value of that top problem is actually the maximum margin of separation."},{"start":974.37,"text":"It's the norm or whatever it is, right? Okay, so if you stare at this long enough, you realize that we can actually, what we can do is change variables to normalize the lambdas and the mus. They're both non-negative vectors, and we simply, we replace them with vectors that sum up."},{"start":996.46,"text":"to 1, entered on negative, otherwise known as mixture coefficients. So we do that, and you plug that in up here, and various things happen, and you end up with this problem here. Now this is very cool, because now we can look at it, right? This says that theta is a set of mixture coefficients, and so this is a general point in the convex hull of the original x's, right? Because it's a mixture of them."}],"speech_gaps":[],"frame":"../frames/v012/006.webp","frame_time":864.67},{"title":"凸优化中的对偶问题与支持向量机","segments":[{"id":59,"text":"This thing here, again, these are coefficients that are non-negative, add up to 1. This thing here is actually a general point in the convex hull of the yi's. And what this says is you should minimize t subject to this norm less than t. Obviously, it's the same as just minimizing this thing. This is the epigraph formulation, right?"},{"id":60,"text":"And then this, so what it's really saying is very geometrically clear. It says minimize the distance between two points. One is in the convex hull of the Xs and one in the convex hull of the Ys. That make sense? So it's actually very cool. So if we go back here, it says the primal says, basically says expand."},{"id":61,"text":"Find the thickest slab. Expand the slab until it stops fitting between the two sets. The other one says form the convex hull of the dark points in your head. Just do that visually. Form the convex hull of the white circles here. And then find the two points in those two sets which are closest to each other. And sure enough, you're going to get something like, I don't know, probably that dark point and then a point over there."},{"id":62,"text":"All make sense? It just means that in a lot of these geometric problems, duals are interpretable. Duals are usually highly interpretable and interesting. It doesn't help you do anything, it doesn't solve it better, blah, blah, blah. But it's just interesting just to see that it all makes sense. I think we looked at that. Now we get to something that's actually useful. Here it is."},{"id":63,"text":"Now what it is, is you have points that are not linearly separable, right? And again, if you've had a first course, maybe in the first two weeks of a machine learning class, you would have seen this. This is like the so-called, it's getting close to the idea of the support vector machine, which we'll get to in a minute. But what you do is you add, and this is in the style of how it's described in a machine learning class, which I think is poorly, but that's..."},{"id":64,"text":"Doesn't matter. That's fine. And so what you do is you say, well, look, I can't satisfy these inequalities. And you go, cool, I'm going to give you some slack. By the way, that parsed both mathematically and colloquially. So what it means is instead of requiring these things to be bigger than 1, I'm going to say they're bigger than 1 minus ui. ui is non-negative. It's your slack. It's how much we're going to shrink."},{"id":65,"text":"We're going to shrink the requirement on the constraint so you can satisfy it. And then we're going to say something like, let's minimize the sum of these slacks. How many inequalities do I need to give you slack on so you can satisfy them? And you'd get a problem that looks like this."}],"notes":["本段讲解了凸优化中的对偶问题，特别是几何解释。讲者提到，通过最小化两个凸包之间的距离，可以找到两个集合之间的最短距离，这与支持向量机（SVM）的概念相关。对偶问题通常具有高度的可解释性，尽管它不会直接解决原始问题，但有助于理解问题的结构。","讲者进一步说明了当数据点不可线性分离时，如何通过引入松弛变量来处理。松弛变量允许约束条件被放宽，从而使得问题变得可解。这种处理方式在机器学习中非常常见，特别是在支持向量机中。","讲者提到，通过最小化松弛变量的总和，可以得到一个优化问题，该问题类似于支持向量机的优化形式。这种形式允许模型在满足约束的同时，尽可能减少对约束的违反程度。","讲者强调了对偶问题在几何上的直观意义，即通过扩展一个“板”（slab）直到它无法再同时包含两个集合，从而找到两个集合之间的最短距离。这种几何解释有助于理解对偶问题的结构。","讲者指出，虽然对偶问题不会直接解决原始问题，但它提供了对问题的另一种视角，有助于理解问题的性质和结构。这种视角在凸优化中非常重要，因为它可以揭示问题的内在特性。","讲者提到，支持向量机（SVM）是这种思想的一个具体应用，它通过引入松弛变量和最小化总和来处理不可线性分离的数据。这种思想在机器学习中非常关键，因为它允许模型在处理复杂数据时保持一定的泛化能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1023.98,"end":1203.22,"asr_flags":[],"math_clarifications":["原文中提到的几何问题和优化问题需要更明确的数学表达式，例如使用数学符号和公式来描述凸包、距离、松弛变量等概念。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1023.98,"text":"This thing here, again, these are coefficients that are non-negative, add up to 1. This thing here is actually a general point in the convex hull of the yi's. And what this says is you should minimize t subject to this norm less than t. Obviously, it's t tically and colloquially. So what it means is instead of requiring these things to be bigger than 1, I'm going to say they're bigger than 1 minus ui. ui is non-negative. It's your slack. It's how much we're going to shrink."},{"start":1184.62,"text":"We're going to shrink the requirement on the constraint so you can satisfy it. And then we're going to say something like, let's minimize the sum of these slacks. How many inequalities do I need to give you slack on so you can satisfy them? And you'd get a problem that looks like this."}],"speech_gaps":[],"frame":"../frames/v012/007.webp","frame_time":1035.98},{"title":"支持向量机与凸优化","segments":[{"id":66,"text":"And it's actually quite interesting here. We would write this in a very simple way, but that's okay. And it turns out this is actually kind of useful. This is now a heuristic for minimizing roughly the number of misclassified points, which I can show you what that would be. Actually, why don't I show you that? So here's what it would look like."},{"id":67,"text":"Let's see, I will write down, let me see what it is. It's, let's take A I, so this is A I transpose, A transpose X I plus B, right? We want that, yeah, there's zero, right? And if I ask you whether you have misclassified a point X I or not, the question is whether this is negative."},{"id":68,"text":"Right? So if you're going to misclassify, that's a problem. That's something that looks like this. Right? That's a cost. Right? So if I took this function of these, what I would end up getting is precisely the number of data points I misclassified. Everybody agree with that? Because if this is negative, it means I wanted this thing to be positive. Okay, here. If you insist that's positive, I guess I have to make it like that. Okay?"},{"id":69,"text":"So that's what it is. Now this function, of course, is not convex, so you can't minimize that. Then what this says is you should actually do something like this. You should say, I want that to be at least one. And then your cost function, the cost function we have looks like this. Because it's the amount. And actually, it's super interesting. It makes perfect sense. That's equivalent to this problem here."},{"id":70,"text":"That's these numbers up here, the u's and v's. So that's convex. And it's actually super interesting to think about what it means. Here's what it means. It says that if you have a data point, we think of one as the margin, right? So it says, you know what? If you classify correctly with at least this, over here means you classify correctly, bigger than zero. If you classify correctly with a margin of one,"},{"id":71,"text":"more than one or more, then that's cool. There's no cost. Like, you did fine, right? You start charging over here. We're actually charging for classifying correctly, but being less than the margin we desire. Everybody following this? Okay, and then it just grows linearly, right? And actually, you can see something immediately, which is this."}],"notes":["本段讲解了支持向量机（SVM）的基本思想，即通过最大化分类间隔来减少误分类点的数量。讲者提到，原始的误分类点计数函数不是凸函数，因此无法直接优化，需要将其转换为凸优化问题。","讲者指出，通过引入一个最小间隔（如1），将问题转化为凸优化问题，其中目标函数是误分类点的个数。如果分类正确且间隔大于零，则不产生成本；如果间隔小于零，则产生成本。","讲者进一步解释了分类间隔的概念，即数据点与分类超平面之间的距离。如果间隔大于等于1，则认为分类正确，否则需要调整模型。","讲者强调，这种转换后的凸优化问题具有良好的性质，可以使用现有的凸优化算法进行求解，例如梯度下降法或对偶问题求解。","讲者提到，这种转换后的目标函数是线性增长的，因此在优化过程中可以有效地找到最优解。","讲者最后指出，这种思路是支持向量机的核心思想之一，即通过最大化间隔来提高分类的鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1205.51,"end":1367.97,"asr_flags":[],"math_clarifications":["公式A^T X_i + B未明确数学类型，且未提供上下文信息，无法核对其正确性。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1205.51,"text":"And it's actually quite interesting here. We would write this in a very simple way, but that's okay. And it turns out this is actually kind of useful. This is now a heuristic for minimizing roughly the number of misclassified points, which I can show you what that would be. Actually, why don't I show you that? So here's what it would look like."},{"start":1232.55,"text":"let's see, I will write down, let me see what it is. It's, let's take A I, so this is A I transpose, A transpose X I plus B, right? We want that, yeah, there's zero, right? And if I ask you whether you have misclassified a point X I or not, the question is whether this is negative."},{"start":1256.79,"text":"Right? So if you're going to misclassify, that's a problem. That's something that looks like this. Right? That's a cost. Right? So if I took this function of these, what I would end up getting is precisely the number of data points I misclassified. Everybody agree with that? Because if this is negative, it means I wanted this thing to be positive. Okay, here. If you insist that's positive, I guess I have to make it like that. Okay?"},{"start":1286.34,"text":"So that's what it is. Now this function, of course, is not convex, so you can't minimize that. Then what this says is you should actually do something like this. You should say, I want that to be at least one. And then your cost function, the cost function we have looks like this. Because it's the amount. And actually, it's super interesting. It makes perfect sense. That's equivalent to this problem here."},{"start":1316.96,"text":"That's these numbers up here, the u's and v's. So that's convex. And it's actually super interesting to think about what it means. Here's what it means. It says that if you have a data point, we think of one as the margin, right? So it says, you know what? If you classify correctly with at least this, over here means you classify correctly, bigger than zero. If you classify correctly with a margin of one,"},{"start":1343.87,"text":"more than one or more, then that's cool. There's no cost. Like, you did fine, right? You start charging over here. We're actually charging for classifying correctly, but being less than the margin we desire. Everybody following this? Okay, and then it just grows linearly, right? And actually, you can see something immediately, which is this."}],"speech_gaps":[],"frame":"../frames/v012/008.webp","frame_time":1217.51},{"title":"凸优化在机器学习与金融中的应用","segments":[{"id":72,"text":"this function is bigger than this other function. And so it turns out that the optimal value of this is actually an upper bound on the number of misclassifications. So again, if you're following this, that's great. And if you aren't, that's probably okay too. Right. So, okay. Everybody, that all makes sense? How many people actually have seen things like this in a machine learning class? I hope a fair number of you. Good. Okay. Okay."},{"id":73,"text":"And then all you do now is you add, I guess they would actually square this probably up here. They would square this thing. And then this trades off two things. It trades off, this will trade off the two desirable things. Number one."},{"id":74,"text":"having small slacks. Small slacks corresponds to this surrogate function. In fact, there's a whole way to view this which makes perfect sense, which is someone says, find me a hyperplane that misclassifies as few points as possible. And you go, cool, the function looks like this. And you go, I can't do that because it's not convex. Then you'd say, well, I'll use this convex function here. Makes perfect sense, right? And you say, I'll minimize that. Everybody following this?"},{"id":75,"text":"Anyway, by the way, that story often, in many, many fields, that story usually has a very good outcome. Someone says, I want to do X, and you'd say, can't, can't do that, not convex. Then someone says, but here's like a surrogate, which is convex. And then people observe it to work really well in practice. Usually about five years later, somebody writes a theory-oriented paper that basically says, actually,"},{"id":76,"text":"You never even wanted to solve the first thing, which you can't solve anyway because it's a bad idea. What you really wanted to solve was the convex relaxation. So I won't go into details on that, but that comes up many, many times. I mean, here's one in finance. People would say, you know, what?"},{"id":77,"text":"you know, with 99, you know, what is my, you know, whatever, my 0.99 value at risk? That's how much money could you lose, you know, in a 1% event, right? That's value at risk. By the way, it's used universally throughout finance, banking. It's written into regulations, everything. Now, I saw some people figured out a very cool thing called conditional value risk, CVAR."},{"id":78,"text":"If you don't, it doesn't, you don't have to know what these are. That's actually kind of bad for value at risk. It's exactly the same thing, right? It's a convex surrogate for value at risk. Everybody following this? Okay. It's convex. And that means we can do all sorts of stuff. We can analyze portfolio. We can construct portfolios that, that, that, you know, have constraints on CVAR and all sorts of everybody got it. Okay. 10 years later, people analyze it and find out that"}],"notes":["本段讨论了凸优化在机器学习中的应用，特别是通过使用凸替代函数来解决非凸问题。讲者提到，当试图找到一个超平面以最小化误分类点时，由于非凸性，无法直接求解，因此引入了凸替代函数。这种替代函数在实践中表现良好，并在多年后被理论化。","讲者进一步指出，这种凸替代方法在金融领域也有广泛应用，例如在计算风险价值（Value at Risk, VaR）时，使用条件风险价值（Conditional Value at Risk, CVaR）作为凸替代。CVaR 是 VaR 的凸替代，使得可以进行更有效的分析和优化。","讲者强调，虽然原始问题可能难以求解，但通过凸松弛（convex relaxation）可以找到近似解，并且这种方法在多个领域中被广泛采用。例如，在金融中，CVaR 被用于构建具有约束条件的投资组合。","讲者提到，这种凸替代方法在实践中被广泛使用，并且在多年后才被理论化。这表明，实际应用中可能先采用凸替代方法，随后才进行理论分析。","讲者还指出，CVaR 是 VaR 的凸替代，这使得可以进行更有效的分析和优化。这种替代方法在金融领域被广泛采用，并且被写入法规中。","讲者最后提到，虽然原始问题可能难以求解，但通过凸松弛可以找到近似解，并且这种方法在多个领域中被广泛采用。例如，在金融中，CVaR 被用于构建具有约束条件的投资组合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1368.49,"end":1541.81,"asr_flags":[],"raw_segments":[{"start":1368.49,"text":"this function is bigger than this other function. And so it turns out that the optimal value of this is actually an upper bound on the number of misclassifications. So again, if you're following this, that's great. And if you aren't, that's probably okay too. Right. So, okay. Everybody, that all makes sense? How many people actually have seen things like this in a machine learning class? I hope a fair number of you. Good. Okay. Okay."},{"start":1397.28,"text":"And then all you do now is you add, I guess they would actually square this probably up here. They would square this thing. And then this trades off two things. It trades off, this will trade off the two desirable things. Number one."},{"start":1413.93,"text":"having small slacks. Small slacks corresponds to this surrogate function. In fact, there's a whole way to view this which makes perfect sense, which is someone says, find me a hyperplane that misclassifies as few points as possible. And you go, cool, the function looks like this. And you go, I can't do that because it's not convex. Then you'd say, well, I'll use this convex function here. Makes perfect sense, right? And you say, I'll minimize that. Everybody following this?"},{"start":1444.88,"text":"Anyway, by the way, that story often, in many, many fields, that story usually has a very good outcome. Someone says, I want to do X, and you'd say, can't, can't do that, not convex. Then someone says, but here's like a surrogate, which is convex. And then people observe it to work really well in practice. Usually about five years later, somebody writes a theory-oriented paper that basically says, actually,"},{"start":1472.27,"text":"You never even wanted to solve the first thing, which you can't solve anyway because it's a bad idea. What you really wanted to solve was the convex relaxation. So I won't go into details on that, but that comes up many, many times. I mean, here's one in finance. People would say, you know, what?"},{"start":1491.4,"text":"you know, with 99, you know, what is my, you know, whatever, my 0.99 value at risk? That's how much money could you lose, you know, in a 1% event, right? That's value at risk. By the way, it's used universally throughout finance, banking. It's written into regulations, everything. Now, I saw some people figured out a very cool thing called conditional value risk, CVAR."},{"start":1516.85,"text":"If you don't, it doesn't, you don't have to know what these are. That's actually kind of bad for value at risk. It's exactly the same thing, right? It's a convex surrogate for value at risk. Everybody following this? Okay. It's convex. And that means we can do all sorts of stuff. We can analyze portfolio. We can construct portfolios that, that, that, you know, have constraints on CVAR and all sorts of everybody got it. Okay. 10 years later, people analyze it and find out that"}],"speech_gaps":[],"frame":"../frames/v012/009.webp","frame_time":1380.49},{"title":"风险度量与凸优化的对比","segments":[{"id":79,"text":"The value at risk is what's called an incoherent risk measure, and CVAR is not. So they write down some axioms. I mean, again, this is just the story, right? You write down some axioms that a risk measure should have. And what it means is that value at risk is actually just a bad measure of risk, right?"},{"id":80,"text":"too bad that it's what all banks use many hedge funds it's written into regulations right so it tells it tells banks how much money they have to have on on hand to avoid a run on the bank and all this kind of crazy stuff but anyway so so that's a perfect example where the convex thing turned out to be actually what you really wanted to do not the one that sounded the most natural in the first place right this is another one it turns out here's an incredibly bad idea is to say i have a bunch of data"},{"id":81,"text":"please find me a separating hyperplane that separates, that misclassifies as few as possible."},{"id":82,"text":"But that sounds completely reasonable. Anybody would say that, right? It sounds reasonable."},{"id":83,"text":"It turns out it's not. Something like this is actually much better. Yeah?"},{"id":84,"text":"In this problem, does it matter if we choose, like, plus minus one as the,"},{"id":85,"text":"like, as the margins? Yeah, exactly."},{"id":86,"text":"No, no, no, no. It doesn't, it is not going to make any difference at all,"},{"id":87,"text":"right? You can make them 10 to the 6th if you want, right? And actually what would happen is"},{"id":88,"text":"just everything would just scale, right? Because actually if you look at it, everything's homogeneous,"},{"id":89,"text":"including the objective this way, right? So everything would just scale. If you don't like"},{"id":90,"text":"1 as your canonical positive number, choose another one. You can make it e just to mess"},{"id":91,"text":"with people, or pi. You can make it square root pi. That's not a bad idea, just to do that,"},{"id":92,"text":"that just, you know, so that somebody poking through your code later goes like, whoa, what"},{"id":93,"text":"is that? Yes? What do you mean by homogeneous? Homogeneous means that if you multiply, if"},{"id":94,"text":"you multiply the arguments or the variables by, in this case, by a positive number, then"},{"id":95,"text":"that expression value goes up by the same number, right? So a norm is a great example,"},{"id":96,"text":"an absolute value, a norm. And you can see here that the variables are like a, b, u and"},{"id":97,"text":"v. And if I multiply them all by 2, you tell me what happens to the objective. It goes"},{"id":98,"text":"up by 2x. So it's homogeneous. Everybody got this idea? Well, you can actually do"}],"notes":["本段讲授了风险度量的概念，指出Value at Risk（VaR）是一种不一致的风险度量，而CVaR（条件风险价值）则不同。讲者提到，VaR虽然在银行和对冲基金中广泛使用，但其作为风险度量并不理想，因为其不满足凸性要求。凸性在这里指的是风险度量应满足的某些数学性质，使得优化问题更容易求解。","接着，讲者通过一个例子说明凸性的重要性。他指出，虽然寻找一个能最小化误分类的分离超平面听起来很自然，但实际上，这种做法并不理想。相反，凸性方法在实际中更有效。","讲者进一步讨论了在支持向量机（SVM）中选择边距（margins）的问题。他指出，选择+1和-1作为边距并不重要，因为问题具有齐次性（homogeneity），即所有变量和目标函数在缩放时都会按比例变化。","讲者解释了齐次性的概念，即如果变量乘以一个正数，目标函数的值也会按相同的比例变化。例如，范数（norm）和绝对值都是齐次性的例子。","讲者通过一个具体的例子说明了齐次性：如果变量a、b、u和v都乘以2，那么目标函数的值也会增加2倍。这说明了齐次性在优化问题中的重要性。","最后，讲者强调了齐次性在实际应用中的意义，即选择不同的边距值（如e、π或√π）并不会影响最终结果，因为问题本身具有齐次性。"],"formulas":[],"uncertainties":["在段落80中，'many hedge funds it's written into regulations' 的断句可能不准确，但整体意思清晰。","段落81中'as few as possible'的表达可能有歧义，但结合上下文可以理解为'尽可能少地误分类'。"],"diagram":"none","start":1542.29,"end":1700.48,"asr_flags":[],"raw_segments":[{"start":1542.29,"text":"The value at risk is what's called an incoherent risk measure, and CVAR is not. So they write down some axioms. I mean, again, this is just the story, right? You write down some axioms that a risk measure should have. And what it means is that value at risk is actually just a bad measure of risk, right?"},{"start":1566.59,"text":"too bad that it's what all banks use many hedge funds it's written into regulations right so it tells it tells banks how much money they have to have on on hand to avoid a run on the bank and all this kind of crazy stuff but anyway so so that's a perfect example where the convex thing turned out to be actually what you really wanted to do not the one that sounded the most natural in the first place right this is another one it turns out here's an incredibly bad idea is to say i have a bunch of data"},{"start":1595.7,"text":"please find me a separating hyperplane that separates, that misclassifies as few as possible."},{"start":1602.0,"text":"But that sounds completely reasonable. Anybody would say that, right? It sounds reasonable."},{"start":1606.2,"text":"It turns out it's not. Something like this is actually much better. Yeah?"},{"start":1609.56,"text":"In this problem, does it matter if we choose, like, plus minus one as the,"},{"start":1616.46,"text":"like, as the margins? Yeah, exactly."},{"start":1618.7,"text":"No, no, no, no. It doesn't, it is not going to make any difference at all,"},{"start":1621.76,"text":"right? You can make them 10 to the 6th if you want, right? And actually what would happen is"},{"start":1627.52,"text":"just everything would just scale, right? Because actually if you look at it, everything's homogeneous,"},{"start":1631.78,"text":"including the objective this way, right? So everything would just scale. If you don't like"},{"start":1637.1,"text":"1 as your canonical positive number, choose another one. You can make it e just to mess"},{"start":1642.96,"text":"with people, or pi. You can make it square root pi. That's not a bad idea, just to do that,"},{"start":1650.28,"text":"that just, you know, so that somebody poking through your code later goes like, whoa, what"},{"start":1654.96,"text":"is that? Yes? What do you mean by homogeneous? Homogeneous means that if you multiply, if"},{"start":1663.22,"text":"you multiply the arguments or the variables by, in this case, by a positive number, then"},{"start":1669.9,"text":"that expression value goes up by the same number, right? So a norm is a great example,"},{"start":1675.6,"text":"an absolute value, a norm. And you can see here that the variables are like a, b, u and"},{"start":1683.08,"text":"v. And if I multiply them all by 2, you tell me what happens to the objective. It goes"},{"start":1687.98,"text":"up by 2x. So it's homogeneous. Everybody got this idea? Well, you can actually do"}],"speech_gaps":[],"frame":"../frames/v012/010.webp","frame_time":1554.29},{"title":"核方法与特征工程","segments":[{"id":99,"text":"You know, I mean, this is people in, I guess, in machine learning, you describe this as kernel methods, but we could just do this, right? You know, suppose you want to separate two points by some nonlinear function, right? Now, of course, there's a gazillion functions that separate two sets of points, because I could actually define a function that's positive right around each of our x's."},{"id":100,"text":"negative around each of our y's, right? And then I don't even care what it is anywhere else. It doesn't matter. It's a half. I don't care. Or zero. It doesn't make any difference, right? That's silly. You want, so, I mean, you want some family of functions or whatever to regularize your choices. And so, you know, you could do things like this. We can make, so f of z contains these basis functions."},{"id":101,"text":"And then theta is now a linear combination of basis functions. One of them, by the way, could be one. That would be a very common basis functions. And then what you want to do is you want to find these inequalities. Now this looks complicated, right? Because maybe somebody in these things, there's like sines, cosines, hyperbolic cosines. I mean, who knows what's in those? There's some weird things. I have no idea. Maybe those are like weird radial basis functions. It doesn't matter, right?"},{"id":102,"text":"So, but it's looking, it'd make you nervous. But the point is that's data. And so these are actually, these are just vectors. They're just constant vectors. And it's exactly the same. It's exactly the same problem, right? So, okay, that makes sense. Maybe an even simpler interpretation of this is even better and really dumb. You think of this as, I would think of this as feature engineering."},{"id":103,"text":"which is like, thanks for your Xs, thanks for your Ys. I'm going to put them through some functions. Maybe I get a bigger vector. And you say, now just do support vector machine on that or separate them that way. That's another way to say it. So, okay. So you can do crazy stuff. Like you could say, I want to do quadratic, I do want to do quadratic discrimination. So to do that, you set up inequalities that look like this and this. And the variables here are P, Q, and R."},{"id":104,"text":"which is like, thanks for your Xs, thanks for your Ys. I'm going to put them through some functions. Maybe I get a bigger vector. And you say, now just do support vector machine on that or separate them that way. That's another way to say it. So, okay. So you can do crazy stuff. Like you could say, I want to do quadratic, I do want to do quadratic discrimination. So to do that, you set up inequalities that look like this and this. And the variables here are P, Q, and R."}],"notes":["本段讲授了核方法的基本思想，即通过非线性函数将数据映射到高维空间，从而在该空间中使用线性方法进行分类。讲者提到，可以定义一个函数，使其在数据点附近为正或负，而在其他区域则无关紧要。这种函数可以是任意形式，如径向基函数（RBF）等。","讲者进一步指出，这种非线性映射可以视为特征工程的一种形式，即将原始数据通过某些函数转换为更高维的特征向量，从而使得线性分类器（如支持向量机）能够处理非线性问题。","讲者还提到，通过构造特定的不等式约束，可以实现二次判别分析（Quadratic Discriminant Analysis），其中变量P、Q、R是优化问题中的参数。","讲者强调，虽然这些不等式看起来可能涉及二次项，但实际变量是P、Q、R，而X是数据，因此这些不等式实际上是线性的。"],"formulas":[{"latex":"f(z) = \\theta^T \\text{basis functions}(z)","symbols":"f(z) 是通过基函数线性组合得到的函数，θ 是系数向量","explanation":"公式正确，表示通过基函数的线性组合来构造函数 f(z)，θ 是系数向量，符合线性组合的定义。","evidence":"And then theta is now a linear combination of basis functions. One of them, by the way, could be one. That would be a very common basis functions. And then what you want to do is you want to find these inequalities. Now this looks complicated, right? Because maybe somebody in these things, there's like sines, cosines, hyperbolic cosines. I mean, who knows what's in those? There's some weird things. I have no idea. Maybe those are like weird radial basis functions. It doesn't matter, right?"}],"uncertainties":["可能听不清的公式部分，如 'quadratic discrimination' 的具体形式"],"diagram":"none","start":1702.08,"end":1861.01,"asr_flags":[],"math_clarifications":["公式 1 是正确的，表示通过基函数的线性组合构造函数 f(z)，θ 是系数向量。公式 2 缺少上下文和明确的数学定义，无法核定其正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1702.08,"text":"You know, I mean, this is people in, I guess, in machine learning, you describe this as kernel methods, but we could just do this, right? You know, suppose you want to separate two points by some nonlinear function, right? Now, of course, there's a gazillion functions that separate two sets of points, because I could actually define a function that's positive right around each of our x's."},{"start":1724.23,"text":"negative around each of our y's, right? And then I don't even care what it is anywhere else. It doesn't matter. It's a half. I don't care. Or zero. It doesn't make any difference, right? That's silly. You want, so, I mean, you want some family of functions or whatever to regularize your choices. And so, you know, you could do things like this. We can make, so f of z contains these basis functions."},{"start":1748.33,"text":"And then theta is now a linear combination of basis functions. One of them, by the way, could be one. That would be a very common basis functions. And then what you want to do is you want to find these inequalities. Now this looks complicated, right? Because maybe somebody in these things, there's like sines, cosines, hyperbolic cosines. I mean, who knows what's in those? There's some weird things. I have no idea. Maybe those are like weird radial basis functions. It doesn't matter, right?"},{"start":1775.73,"text":"So, but it's looking, it'd make you nervous. But the point is that's data. And so these are actually, these are just vectors. They're just constant vectors. And it's exactly the same. It's exactly the same problem, right? So, okay, that makes sense. Maybe an even simpler interpretation of this is even better and really dumb. You think of this as, I would think of this as feature engineering."},{"start":1802.09,"text":"which is like, thanks for your Xs, thanks for your Ys. I'm going to put them through some functions. Maybe I get a bigger vector. And you say, now just do support vector machine on that or separate them that way. That's another way to say it. So, okay. So you can do crazy stuff. Like you could say, I want to do quadratic, I do want to do quadratic discrimination. So to do that, you set up inequalities that look like this and this. And the variables here are P, Q, and R."},{"start":1831.9,"text":"What kind of inequality is this and this in P, Q, and R? Yeah, they're linear, right? Because the left-hand side is actually linear in the triple P, Q, R, right? I mean, and you have to get used to this because you see X transpose P, X, and you immediately want to ask, you know, it sounds, it looks, it is quadratic in X, I, but X, I is data, so it's not a variable. Your variable is P, right?"}],"speech_gaps":[],"frame":"../frames/v012/011.webp","frame_time":1714.08},{"title":"使用椭球和多项式分离数据","segments":[{"id":105,"text":"That sort of and you could do crazy stuff like you could say, you know what? I want to see if I can separate some data by an ellipsoid. Right, and that would just be that would end up being an SDP. You'd have an inequality constraint. You'd have a matrix inequality constraint on P something like that, right? And this would be like a separation by an ellipsoid. Somebody want to name a useful"},{"id":106,"text":"A use for that? I give you a bunch of data. Some is, let's say, maybe these are like good outcomes or something. Maybe these are bad ones. So anybody want to... Location. What's that? Location. Yeah, maybe it could be... Yeah, it could be that you have some incredibly complex industrial process. You set your knobs various ways."},{"id":107,"text":"and you run the process and you get a bunch of data that looks like this. These are the ones that came in, these are the product that came out up to spec. This is the one that failed, right? And so what this will do is it'll give you an ellipsoid in the original space that tells you if you set your, this is where you want to set your, this is how you want to set those values, right? And you get an ellipsoidal safe set or something like that. That make sense?"},{"id":108,"text":"Okay, and then you could do very weird stuff like, here, this is, we've separated these points by a quartic, right? I mean, but anyway, once you get the idea, you can do anything you like with it. Although you have to admit, it looks kind of, well, okay, I'll try one for you. I give you a set of points, some x's and some y's, and I say, I'd like you to separate them by a minimum degree polynomial."},{"id":109,"text":"I have to tell you what the degree of a polynomial of x and y is, but let's say it's the maximum, yet a polynomial has got, you know, it's a sum, it's a linear combination of xi to the pi, you know, yi to the, y to the, sorry, yeah, x to the pi, y to the pi, qi. I'm going to take p plus q as the degree, okay? So someone tell me, can you solve that problem? And what kind of a problem is it? How do you minimize the degree?"},{"id":110,"text":"of a polynomial discriminator for given data. First of all, could you do it? Yeah. Yeah, by iterate you mean try degree one, otherwise known as a hyperplane. It's a fail. Then you say, I'm going to try quadratic. Fail. Cubic. Succeeds. Then you're done. That was your algorithm? I like it. Perfectly good. Is it anything else? We have a name for it. That's just quasi-convex optimization."}],"notes":["本段讲授了如何使用椭球和半定规划（SDP）来分离数据。通过引入矩阵不等式约束，可以将数据点分离到椭球内，从而构建一个安全区域。这种技术在工业过程中可能有实际应用，例如通过调整参数来确保输出符合规格。","讲者提到，椭球分离方法可以扩展到更高次的多项式，如四次多项式。一旦理解了基本思想，就可以用类似的方法进行更复杂的分离任务。但需要注意的是，这种方法可能看起来有些奇怪，但其背后的数学原理是清晰的。","在分离数据时，讲者提出了一种基于多项式度数的算法。首先尝试一次多项式（即超平面），如果失败则尝试二次、三次等，直到找到能够成功分离数据的最小度数。这种方法被称为准凸优化。","讲者强调，准凸优化是一种特殊的优化问题，其目标是最小化多项式的度数，同时确保数据点被正确分离。这种问题在实际应用中可能具有重要的意义，尤其是在需要高精度分类的场景中。","在讲授过程中，讲者通过举例说明了如何定义多项式的度数，并指出度数是通过取所有项的最高次幂之和来确定的。这为后续的优化问题提供了明确的数学基础。","最后，讲者总结了整个分离数据的过程，并指出该方法属于准凸优化的范畴。这表明，虽然问题可能看起来复杂，但其核心思想是清晰且可操作的。"],"formulas":[{"latex":"p + q = \\text{degree of the polynomial}","symbols":"p + q 是多项式的次数","explanation":"该公式正确描述了多项式次数的定义，符合原文中关于多项式次数的说明，无需修改。","evidence":"I have to tell you what the degree of a polynomial of x and y is, but let's say it's the maximum, yet a polynomial has got, you know, it's a sum, it's a linear combination of xi to the pi, you know, yi to the, y to the, sorry, yeah, x to the pi, y to the pi, qi. I'm going to take p plus q as the degree, okay? So someone tell me, can you solve that problem? And what kind of a problem is it? How do you minimize the degree?"}],"uncertainties":["quartic"],"diagram":"none","start":1862.43,"end":2039.91,"asr_flags":[],"math_clarifications":["原文未提供足够的信息来核定矩阵不等式约束的具体形式或条件，因此该公式无法确认其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1862.43,"text":"That sort of and you could do cr s going to be the next section of the course. We'll probably have a small bit at the end where we'll actually do some other interesting applications. But this is important, so we'll do this first. So we're going to talk about what happens when, let's say, you call the solve method in CVX pi. I think actually we had discussions about what happens at the highest level."},{"id":156,"text":"At the highest level, what happens is it takes your problem and it transforms it. You get an equivalent problem, and then you get another equivalent problem, and another one, and you reduce it through a chain of equivalences until you get to some standard form we can solve, like a linear program, quadratic program, or second-order cone programming, or semi-definite program. We're actually not going to talk about that, although it is super interesting, but it just uses the ideas from the beginning of the class of a reduction."}],"notes":["本段主要讲解了凸优化在实际应用中的使用，特别是如何通过凸近似来处理非凸约束问题。讲者提到，当处理物体布局问题时，可以通过设置最小距离d来避免重叠，这实际上是一种凸近似方法。讲者还提到，如果物体是正方形，可以通过计算半径之和来确定d的值，从而确保物体之间不重叠。","讲者强调了在实际应用中，如何将问题建模为凸优化问题的重要性。他指出，设计惩罚函数等方法的核心思想是将实际问题转化为可以求解的凸问题。此外，他还提到课程接下来的部分将讨论如何实际求解优化问题，包括使用CVX等工具进行求解。","在讲者提到的CVX工具中，他解释了在最高层如何将问题转化为标准形式。具体来说，CVX会将原始问题通过一系列等价变换，最终转化为线性规划、二次规划、二次锥规划或半正定规划等标准形式，从而可以使用现有的求解器进行求解。","讲者还提到，虽然这些变换过程非常有趣，但课程不会深入讨论这些细节，而是会基于课程初期介绍的减少思想进行讲解。这表明课程的重点在于理解如何将实际问题转化为凸优化问题，而不是具体的求解算法。","在讲者提到的布局问题中，他强调了凸近似方法的有效性，即通过设置最小距离d来确保物体之间不重叠。这种方法虽然是一种启发式方法，但在实际应用中非常有用。","最后，讲者提到课程接下来的部分将讨论如何实际求解优化问题，包括使用CVX等工具进行求解。这表明课程的结构是先介绍应用，再深入讨论求解方法，从而帮助学生全面理解凸优化的理论和实践。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2561.51,"end":2720.28,"asr_flags":[],"raw_segments":[{"start":2561.51,"text":"So that constraint is non-convex. Everybody got that? Here's what's cool. If you do this, that's actually a pretty good convex heuristic for getting a layout where things are at least d apart. Everybody got this? And I could actually tune this. If these were squares, I could make for each edge, I could make
