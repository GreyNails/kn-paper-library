x}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">12 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 12 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v012","title":"12 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 12","course":"凸优化","pages":[{"title":"解析中心的概念与计算","segments":[{"id":0,"text":"Today we'll continue describing these geometric type problems. One thing that is going to come up actually not maybe in a couple of weeks in the class is the concept of an analytic center. It's actually not an analytic center of a set, although people...","zh":"今天我们将继续描述这些几何类型的问题。实际上，有一个概念会在课堂上几周后出现，那就是解析中心的概念。它并不是一个集合的解析中心，尽管人们……","start":5.23,"end":23.97},{"id":1,"text":"informally say the analytic center of a set. They don't mean that. What they really mean is the analytic center of a description of a set, which is a set of inequalities. And the analytic center goes like this. So let's say we have, I mean, the equality constraints we just keep right here. But suppose we have a bunch of inequalities here, right? And what this means, we look at","zh":"非正式地称集合的解析中心。他们并不是这个意思。他们真正指的是一个集合描述的解析中心，这个描述是由一组不等式组成的。解析中心的定义如下。假设我们有，我意思是，等式约束我们保持在这里。但假设我们有一组不等式在这里，对吧？这意味着我们查看","start":25.07,"end":50.33},{"id":2,"text":"So obviously, the fi of x should be less than zero. Minus fi of x is what people would call the margin, when that's positive. So minus fi of x is the margin. And it's roughly how much you have left before you violate the inequalities. That's the margin. And the so-called analytic center of a set of inequalities is given by minimizing the negative log of the","zh":"显然，fi(x) 应该小于零。减去 fi(x) 是人们所说的边距，当它是正数时。所以减去 fi(x) 是边距。它大致表示在违反不等式之前还剩下多少。这就是边距。所谓的不等式集合的解析中心是通过最小化负对数的","start":50.83,"end":79.47},{"id":3,"text":"This is the margin, minus fi of x, right? Another way to say it is you maximize the product of the margins, okay? So that's, this comes up in a lot of other things, in log utilities, it's used universally in networking and things like that. So this is not at all uncommon. Okay, so that is the so-called analytic center. Oh, of course, that's a convex problem. Why? Because minus log minus argument is convex and increasing, okay?","zh":"这就是边距，减去 fi(x)，对吧？另一种说法是，你最大化边距的乘积，对吧？所以，这在很多其他事情中都会出现，在对数效用中，它被普遍用于网络和其他类似领域。所以这并不罕见。好的，这就是所谓的解析中心。哦，当然，这是一个凸问题。为什么？因为负对数的负参数是凸且递增的，对吧？","start":80.52,"end":108.52},{"id":4,"text":"And then the FIs of X are convex. Okay, and this is, we'll actually soon, we'll see very soon that this is actually quite straightforward to compute. Matter of fact, you will actually be doing, you'll be writing code that will basically compute analytic centers and things like that. Okay, so that's the analytic, that is the analytic center of a set of inequalities.","zh":"然后 fi(x) 是凸的。好的，而且这实际上很快就会看到，计算这个是非常直接的。事实上，你将会编写代码来计算解析中心之类的东西。好的，这就是解析中心，即一组不等式的解析中心。","start":109.68,"end":133.76},{"id":5,"text":"And here's just a picture of what it looks like for a polyhedron, right? So this shows you what's feasible. Each of these corresponds to one of the rows here, each of those lines. The dashed curves give you the level curves of this log barrier. This is called the log barrier. It's called a log barrier. I think that's maybe borrowed from physics or something like that because it's like a potential function that goes up.","zh":"这里有一张多面体的示意图，对吧？这展示了什么是可行的。这里的每一行都对应这些线中的某一条。虚线曲线表示这个对数障碍的等值线。这被称为对数障碍。它被称为对数障碍。我想这可能是从物理中借用的术语，因为它像一个势函数，会随着增加而上升。","start":134.76,"end":162.2}],"notes":["本段讲解了解析中心的概念，指出解析中心并不是集合的中心，而是对集合描述（即不等式约束）的中心。解析中心的定义是通过最小化负对数屏障函数来计算，该函数与不等式约束的边际有关。","解析中心的计算涉及凸优化问题，因为负对数函数是凸且递增的，而不等式约束的函数也是凸的。因此，整个优化问题是一个凸问题，可以高效求解。","解析中心的计算在实际中非常常见，例如在网络优化和对数效用函数中。它通过最大化边际的乘积来实现，这与对数屏障函数的性质密切相关。","解析中心的计算方法在课程中将很快展开，学生将学习如何编写代码来计算解析中心，并应用于实际问题。","课程中还提到解析中心的几何意义，通过多面体的示意图展示了可行域和对数屏障函数的等高线，帮助理解解析中心的直观含义。","对数屏障函数被比喻为物理中的势能函数，随着约束的接近而增加，这有助于理解其在优化问题中的作用。"],"formulas":[{"latex":"minimize -\\text{log}(-f_i(x))","symbols":"最小化负对数屏障函数","explanation":"公式正确，表示对每个不等式约束的负对数屏障函数进行最小化，这是计算解析中心的标准方法。","evidence":"So obviously, the fi of x should be less than zero. Minus fi of x is what people would call the margin, when that's positive. So minus fi of x is the margin. And it's roughly how much you have left before you violate the inequalities. That's the margin. And the so-called analytic center of a set of inequalities is given by minimizing the negative log of the"},{"latex":"maximize \\prod_{i} ( -f_i(x) )","symbols":"最大化边际的乘积","explanation":"原公式中的'product of margins'应理解为所有边际的乘积，即$\\prod_{i} ( -f_i(x) )$，这是最大化边际的乘积的正确表达方式。","evidence":"This is the margin, minus fi of x, right? Another way to say it is you maximize the product of the margins, okay? So that's, this comes up in a lot of other things, in log utilities, it's used universally in networking and things like that. So this is not at all uncommon. Okay, so that is the so-called analytic center. Oh, of course, that's a convex problem. Why? Because minus log minus argument is convex and increasing, okay?"}],"uncertainties":["FIs of X"],"diagram":"none","start":5.23,"end":162.2,"asr_flags":[],"math_clarifications":["原公式中的'product of margins'被转写为'maximize \\text{product of margins}'，但未明确表示为乘积形式，因此修正为$\\prod_{i} ( -f_i(x) )$以明确表示乘积。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":5.23,"text":"Today we'll continue describing these geometric type problems. One thing that is going to come up actually not maybe in a couple of weeks in the class is the concept of an analytic center. It's actually not an analytic center of a set, although people..."},{"start":25.07,"text":"informally say the analytic center of a set. They don't mean that. What they really mean is the analytic center of a description of a set, which is a set of inequalities. And the analytic center goes like this. So let's say we have, I mean, the equality constraints we just keep right here. But suppose we have a bunch of inequalities here, right? And what this means, we look at"},{"start":50.83,"text":"So obviously, the fi of x should be less than zero. Minus fi of x is what people would call the margin, when that's positive. So minus fi of x is the margin. And it's roughly how much you have left before you violate the inequalities. That's the margin. And the so-called analytic center of a set of inequalities is given by minimizing the negative log of the"},{"start":80.52,"text":"This is the margin, minus fi of x, right? Another way to say it is you maximize the product of the margins, okay? So that's, this comes up in a lot of other things, in log utilities, it's used universally in networking and things like that. So this is not at all uncommon. Okay, so that is the so-called analytic center. Oh, of course, that's a convex problem. Why? Because minus log minus argument is convex and increasing, okay?"},{"start":109.68,"text":"And then the FIs of X are convex. Okay, and this is, we'll actually soon, we'll see very soon that this is actually quite straightforward to compute. Matter of fact, you will actually be doing, you'll be writing code that will basically compute analytic centers and things like that. Okay, so that's the analytic, that is the analytic center of a set of inequalities."},{"start":134.76,"text":"And here's just a picture of what it looks like for a polyhedron, right? So this shows you what's feasible. Each of these corresponds to one of the rows here, each of those lines. The dashed curves give you the level curves of this log barrier. This is called the log barrier. It's called a log barrier. I think that's maybe borrowed from physics or something like that because it's like a potential function that goes up."}],"speech_gaps":[],"frame":"../frames/v012/001.webp","frame_time":17.23},{"title":"凸优化中的分析中心与椭球近似","segments":[{"id":6,"text":"to infinity as you approach the boundary. So that's like a barrier for a particle or something like that, if that were an energy. And a couple of things you can see. It's actually kind of cool. So we've marked there the analytic center. That's the point where that barrier is minimized. So whatever that point is, it maximizes the product, actually, of the margins for the inequalities.","zh":"当你接近边界时，它会趋向于无穷大。所以这就像一个粒子的屏障，如果这是一个能量的话。你可以看到一些事情。实际上，这有点酷。我们在那里标记了分析中心。这是屏障最小化的点。所以无论这个点是什么，它实际上最大化了不等式中边距的乘积。","start":162.5,"end":189.28},{"id":7,"text":"So that's what it does. And you can see, actually, that the level sets close down to the analytic center are actually, of course, going to be very close to ellipsoidal. That's, of course, true for any kind of smooth function. So the dark ellipsoid drawn there is this.","zh":"这就是它所做的。实际上，你可以看到，那些接近分析中心的等值线实际上会非常接近椭球形。当然，这是任何光滑函数的特性。那里画出的深色椭球就是这个。","start":190.12,"end":215.52},{"id":8,"text":"It turns out that for the analytic center, if you calculate the Hessian of it, then the ellipsoid defined by the center but with a 1 on the right-hand side, that ellipsoid is guaranteed to be inside the set. So this will be important later. If you puff that ellipsoid up by a factor around m, actually m would be enough because that would be square root of m squared there.","zh":"事实上，对于分析中心，如果你计算它的Hessian矩阵，那么由中心定义的椭球，其右侧为1，这个椭球被保证在集合内部。这将在后面很重要。如果你将这个椭球按一个因子m膨胀，实际上m就足够了，因为那里是m平方的平方根。","start":216.11,"end":244.03},{"id":9,"text":"If you puff it up by a factor of M, then you cover the ellipsoid. So basically it says that the ellipsoids defined by analytic centers also have this approximation property. It gives you an inside ellipsoid, and then when you puff it up by a factor, it covers the set. So it gives you this approximation. Here, the approximation...","zh":"如果你将它按因子M膨胀，那么你就能覆盖椭球。基本上，它说明由分析中心定义的椭球也具有这种近似性质。它给你一个内部椭球，然后当你按一个因子膨胀它时，它就能覆盖整个集合。因此，它给你这种近似。在这里，近似……","start":244.46,"end":266.32},{"id":10,"text":"If you puff it up by a factor of M, then you cover the ellipsoid. So basically it says that the ellipsoids defined by analytic centers also have this approximation property. It gives you an inside ellipsoid, and then when you puff it up by a factor, it covers the set. So it gives you this approximation. Here, the approximation...","zh":"如果你将它按因子M膨胀，那么你就能覆盖椭球。基本上，它说明由分析中心定义的椭球也具有这种近似性质。它给你一个内部椭球，然后当你按一个因子膨胀它时，它就能覆盖整个集合。因此，它给你这种近似。在这里，近似……","start":268.2,"end":296.21},{"id":11,"text":"Okay, what we're going to look at now is linear discrimination. Probably most of you have seen this maybe in some basic machine learning class. But here's the problem. And there's many, many variations on this. But it looks like this. I'm going to give you a set of points, x1 through xn. These are vectors and a bunch of y's. And if you like, these are simply feature vectors associated with a positive outcome and a negative outcome in some kind of Boolean.","zh":"好的，我们现在要研究的是线性判别。你们可能在某些基础机器学习课程中见过这个。但这里的问题是，有许多许多变种。但看起来是这样的。我将给你们一组点，x1到xn。这些是向量，还有一组y值。如果你喜欢，这些只是与某种布尔正负结果相关的特征向量。","start":298.44,"end":326.38}],"notes":["本段讲解了凸优化中分析中心的性质，即通过计算分析中心的Hessian矩阵，可以定义一个椭球，该椭球保证位于原始集合内部。这一性质在后续内容中将非常重要。","当椭球被放大一个因子m时，该椭球能够覆盖原始集合。这里提到的放大因子m与集合中的不等式数量有关，而不仅仅是维度n。因此，当m远大于n时，这种近似可能不如其他方法有效。","分析中心定义的椭球具有近似性质，即通过放大椭球可以覆盖整个集合。这种近似方法在凸优化中具有实际应用价值，尤其是在处理复杂集合时。","与Lohner-John椭球或最小体积覆盖椭球不同，分析中心的椭球近似依赖于不等式数量m，而非维度n。这表明在某些情况下，该方法可能不如其他方法精确。","本段强调了分析中心椭球近似方法的局限性，即当m远大于n时，该方法的近似效果较差。这为后续学习提供了重要的背景信息。","最后，本段提到将在后续课程中更深入探讨这一主题，表明分析中心椭球近似是凸优化中的一个重要概念，具有广泛的应用前景。"],"formulas":[],"uncertainties":["puff that ellipsoid up by a factor around m, actually m would be enough because that would be square root of m squared there."],"diagram":"none","start":162.5,"end":326.38,"asr_flags":[],"math_clarifications":["原文中没有提供足够的数学信息来验证椭球定义和缩放公式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":162.5,"text":"to infinity as you approach the boundary. So that's like a barrier for a particle or something like that, if that were an energy. And a couple of things you can see. It's actually kind of cool. So we've marked there the analytic center. That's the point where that barrier is minimized. So whatever that point is, it maximizes the product, actually, of the margins for the inequalities."},{"start":190.12,"text":"So that's what it does. And you can see, actually, that the level sets close down to the analytic center are actually, of course, going to be very close to ellipsoidal. That's, of course, true for any kind of smooth function. So the dark ellipsoid drawn there is this."},{"start":216.11,"text":"It turns out that for the analytic center, if you calculate the Hessian of it, then the ellipsoid defined by the center but with a 1 on the right-hand side, that ellipsoid is guaranteed to be inside the set. So this will be important later. If you puff that ellipsoid up by a factor around m, actually m would be enough because that would be square root of m squared there."},{"start":244.46,"text":"If you puff it up by a factor of M, then you cover the ellipsoid. So basically it says that the ellipsoids defined by analytic centers also have this approximation property. It gives you an inside ellipsoid, and then when you puff it up by a factor, it covers the set. So it gives you this approximation. Here, the approximation..."},{"start":268.2,"text":"Now remember that for things like the Lohner-John ellipsoid or the minimum volume covering ellipsoid or the maximum volume inscribed ellipsoid, there it depended only on the dimension. Here it depends on m, which is the number of inequalities here. So if m is much larger than n, this is a worse bound, worse approximation bound of a convex set. So, okay. But anyway, you'll be seeing much more about this in a couple of weeks."},{"start":298.44,"text":"Okay, what we're going to look at now is linear discrimination. Probably most of you have seen this maybe in some basic machine learning class. But here's the problem. And there's many, many variations on this. But it looks like this. I'm going to give you a set of points, x1 through xn. These are vectors and a bunch of y's. And if you like, these are simply feature vectors associated with a positive outcome and a negative outcome in some kind of Boolean."}],"speech_gaps":[],"frame":"../frames/v012/002.webp","frame_time":174.5},{"title":"分离超平面与感知机算法","segments":[{"id":12,"text":"problem, right? So I have some data. And what we seek is a hyperplane. So that's defined by a vector A and a constant B. And we want all the xi's to be on one side of that hyperplane, and we want all the y's to be on the other side. So that's what we want, separating hyperplane. Actually, shockingly, this was studied in the early 1950s.","start":327.18,"end":354.24},{"id":13,"text":"People came up with something called the perceptron algorithm, which you might have seen somewhere. It's like a very early thing. And weirdly, many years went by before someone looked up and said, dude, that's an LP. In which case, people literally down the hall know how to solve these. So it's just one of those cases where the diffusion of knowledge took some time. So there is a subtlety here that we're going to look at. Oh, one thing.","start":354.76,"end":383.96},{"id":14,"text":"we have to be careful of is the notation, right? So here, the variables are basically A and B. And the data are the XIs and the YIs, right? Which violates this usual convention, right? That things at the end of the alphabet are typically your variables, and things at the beginning are typically your parameters, your data, okay? So you have to be on your toes here. So what sort of inequality on A and B is this?","start":384.72,"end":411.72},{"id":15,"text":"Okay, so here'd be an example you're working with someone and they're designing a power amplifier and they go your budget is 50 milliwatts Then your design and you go cool. Okay, and then they come back and they go it's strict You have to be less than 50 milliwatts Not less than or equal to and it's like okay. This is just completely idiotic and makes no sense. Everybody see what I'm saying. So you just","start":417.13,"end":444.64},{"id":16,"text":"Okay, so here'd be an example you're working with someone and they're designing a power amplifier and they go your budget is 50 milliwatts Then your design and you go cool. Okay, and then they come back and they go it's strict You have to be less than 50 milliwatts Not less than or equal to and it's like okay. This is just completely idiotic and makes no sense. Everybody see what I'm saying. So you just","start":445.84,"end":468.08},{"id":17,"text":"any sense, and you quietly replace less strictly less than with less than or equal to, and no one","start":468.73,"end":472.89},{"id":18,"text":"gets hurt. Everyone got this? Okay, so that's fine. Now, if we try that here, let's see what","start":472.89,"end":478.27},{"id":19,"text":"happens, right? So you'd say, well, a i transpose x plus b is bigger than or equal to zero, and I","start":478.27,"end":485.81},{"id":20,"text":"also want a transpose y i plus b less than or equal to zero. Anybody got any suggestions about","start":485.81,"end":492.81},{"id":21,"text":"also want a transpose y i plus b less than or equal to zero. Anybody got any suggestions about","start":492.81,"end":498.53},{"id":22,"text":"about how to solve that system of inequalities?","start":498.53,"end":500.07},{"id":23,"text":"A and B zero, I like it.","start":503.15,"end":504.17},{"id":24,"text":"A and B zero, I like it.","start":504.47,"end":506.25}],"notes":["本段讨论了分离超平面的概念，即通过一个超平面将数据点分为两类。超平面由向量A和常数B定义，所有xi位于超平面的一侧，所有yi位于另一侧。这种分离超平面的概念在1950年代初被研究，随后发展出感知机算法。","讲者提到感知机算法是早期的机器学习方法，但直到多年后人们才意识到它实际上是一个线性规划（LP）问题。这说明了知识传播的延迟，强调了理解问题本质的重要性。","讲者指出在符号使用上需要注意，通常末尾字母表示变量，而开头字母表示参数或数据。但在本段中，变量是A和B，数据是xi和yi，这与常规符号习惯不同，需要特别注意。","讲者讨论了严格不等式在实际应用中的问题，指出严格不等式在某些情况下没有实际意义，应替换为非严格不等式。例如，在设计功率放大器时，预算限制为50毫瓦，严格小于50毫瓦是没有意义的，应改为小于等于。","讲者通过一个例子说明如何处理严格不等式，强调在实际应用中应避免使用严格不等式，以确保问题的可行性。","最后，讲者提出一个关于如何解决不等式系统的问题，即如何找到满足条件的A和B。这引导学生思考如何将分离超平面问题转化为优化问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":327.18,"end":506.25,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":327.18,"text":"problem, right? So I have some data. And what we seek is a hyperplane. So that's defined by a vector A and a constant B. And we want all the xi's to be on one side of that hyperplane, and we want all the y's to be on the other side. So that's what we want, separating hyperplane. Actually, shockingly, this was studied in the early 1950s."},{"start":354.76,"text":"People came up with something called the perceptron algorithm, which you might have seen somewhere. It's like a very early thing. And weirdly, many years went by before someone looked up and said, dude, that's an LP. In which case, people literally down the hall know how to solve these. So it's just one of those cases where the diffusion of knowledge took some time. So there is a subtlety here that we're going to look at. Oh, one thing."},{"start":384.72,"text":"we have to be careful of is the notation, right? So here, the variables are basically A and B. And the data are the XIs and the YIs, right? Which violates this usual convention, right? That things at the end of the alphabet are typically your variables, and things at the beginning are typically your parameters, your data, okay? So you have to be on your toes here. So what sort of inequality on A and B is this?"},{"start":417.13,"text":"What kind of function is A transpose XI plus B? What kind of function of the pair AB is that? It's linear. Yeah, okay, that's linear. Now there is one thing here. We have these strict inequalities. So let me just say a little bit about that. There are a lot of cases where strict inequalities are silly and just mean nothing and you just quietly replace them with inequalities."},{"start":445.84,"text":"Okay, so here'd be an example you're working with someone and they're designing a power amplifier and they go your budget is 50 milliwatts Then your design and you go cool. Okay, and then they come back and they go it's strict You have to be less than 50 milliwatts Not less than or equal to and it's like okay. This is just completely idiotic and makes no sense. Everybody see what I'm saying. So you just"},{"start":468.73,"text":"you basically, you just quietly, you try to explain to the person that that doesn't make"},{"start":472.89,"text":"any sense, and you quietly replace less strictly less than with less than or equal to, and no one"},{"start":478.27,"text":"gets hurt. Everyone got this? Okay, so that's fine. Now, if we try that here, let's see what"},{"start":485.81,"text":"happens, right? So you'd say, well, a i transpose x plus b is bigger than or equal to zero, and I"},{"start":492.81,"text":"also want a transpose y i plus b less than or equal to zero. Anybody got any suggestions about"},{"start":498.53,"text":"about how to solve that system of inequalities?"},{"start":503.15,"text":"A and B zero?"},{"start":504.47,"text":"A and B zero, I like it."}],"speech_gaps":[],"frame":"../frames/v012/003.webp","frame_time":339.18},{"title":"严格与非严格不等式的区别","segments":[{"id":25,"text":"So A and B zero works, okay?","zh":"所以A和B等于零，对吧？","start":506.35,"end":508.15},{"id":26,"text":"So this is one of those cases where the distinction","zh":"所以这是那种严格和非严格不等式之间区别很重要的情况，对吧？","start":508.29,"end":511.39},{"id":27,"text":"between strict and non-strict actually matters, right?","zh":"严格和非严格之间的区别实际上是有意义的，对吧？","start":511.39,"end":515.89},{"id":28,"text":"It actually matters because when you make it non-strict,","zh":"实际上有意义，因为当你把它变成非严格的时候，","start":515.99,"end":519.11},{"id":29,"text":"when you make it non-strict, it's got a silly solution","zh":"当你把它变成非严格的时候，它会有一个无聊的解","start":519.13,"end":521.27},{"id":30,"text":"which is uninteresting, right?","zh":"这个解是没有意思的，对吧？","start":521.27,"end":522.99},{"id":31,"text":"Okay, so in a lot of these cases,","zh":"好的，所以在很多这些情况下，","start":523.17,"end":526.77},{"id":32,"text":"you actually have to hand-argue each one. I'm not aware of a general principle.","zh":"你实际上必须逐个进行人工论证。我不清楚有没有一个普遍的原则。","start":526.77,"end":531.37},{"id":33,"text":"Hand-argue each one, and I'll do that argument right now.","zh":"逐个进行论证，我现在就来做这个论证。","start":532.39,"end":535.37},{"id":34,"text":"The main arguments go something like this. This thing is, that inequality is homogeneous.","zh":"主要的论点大致如下。这个不等式是齐次的。","start":536.99,"end":543.43},{"id":35,"text":"In other words, if I double A and B, then whatever this is, which is supposed to be positive,","zh":"换句话说，如果我把A和B都加倍，那么无论这个表达式是什么，它应该是一个正数，","start":544.49,"end":549.69},{"id":36,"text":"goes up by a factor of two. Everybody agree? Same over here. Same for the other one.","zh":"就会乘以一个因子2。大家同意吗？这里也是一样的，另一个也是如此。","start":549.87,"end":555.99},{"id":37,"text":"right? If this is supposed to be less than, if I double A and B, these things are negative,","zh":"对吧？如果这个不等式应该小于，当我把A和B都加倍时，这些表达式是负数，","start":555.99,"end":561.79},{"id":38,"text":"whatever they, they just got twice as negative. Everybody following this? So what I could do","zh":"无论它们是什么，它们只是变得更负了两倍。大家跟得上吗？因此，我可以","start":561.93,"end":566.23},{"id":39,"text":"my claim is that I can, without loss of generality, replace these strict inequalities with these non-strict inequalities with a one.","zh":"我的主张是，我可以不丢失一般性，用这些非严格不等式来代替这些严格不等式。","start":566.23,"end":572.51},{"id":40,"text":"with these non-strict inequalities with a one. The way I do that is up here,","zh":"用这些非严格不等式来代替这些严格不等式。我这样做方式在这里。","start":573.21,"end":577.65},{"id":41,"text":"if you give me an A and a B that satisfies this,","zh":"如果你给我一个满足这个条件的A和B，","start":577.73,"end":579.89},{"id":42,"text":"I simply scale them by whatever factor is needed to make, you know, however positive that was, how negative that was, I multiply by a factor which makes that bigger than or equal to 1. Everybody got it? So that says, if there exists A and B that satisfy that, then by multiplying them by a positive number, they're going to satisfy this. The converse goes like this. The converse is relatively straightforward, because if I tell you a number is bigger than or equal to 1, it's definitely positive.","zh":"我只需要用任意一个因子去缩放它们，使得，你知道的，无论那个正数是多少，那个负数是多少，我乘以一个因子，使得它大于或等于1。大家明白了吗？所以这说明，如果存在满足这个条件的A和B，那么通过乘以一个正数，它们就会满足这个条件。反过来则相对简单，因为如果我告诉你一个数大于或等于1，那它肯定是正数。","start":580.49,"end":608.51},{"id":43,"text":"Right. So everyone got this. It's actually a suddenly it's actually quite important. And I don't know, you could ease you could easily encounter this. That was a I mean, actually, both in your in research or other things or other places. So this is something we kind of expect you to know about. Yeah.","zh":"对。所以大家明白了吗？其实这突然变得非常重要。我不知道，你可能会轻易遇到这种情况。这在你的研究或其他地方都是实际存在的。所以这是我们期望你们了解的内容。","start":609.63,"end":635.14},{"id":44,"text":"It's fine. That's totally cool. So if you want to put 10 to the 6 here, and minus 10 to the 6, that's perfectly good. And then to be quite precise, what I'm saying then is the first set of inequalities are feasible if and only if these are feasible, if and only if your variation where 1 is replaced with 10 to the 6 is feasible. And if 1 is feasible, all of them are feasible.","zh":"没关系。这完全没问题。所以如果你想在这里放10的6次方和负10的6次方，那也是完全可以的。然后要非常精确地说，我所说的第一个不等式组是可行的，当且仅当这些是可行的，当且仅当你的变化中将1替换为10的6次方的情况是可行的。如果1是可行的，那么所有都是可行的。","start":636.4,"end":665.58},{"id":45,"text":"Period. Right? And if one is infeasible, all are infeasible. Right? And how do we translate among them? We just scale them by various things. Right? So, like, if I have an A and B that satisfies these, and I want to satisfy yours, I just multiply A and B by a million. And then they'll satisfy it. Make sense? So, okay.","zh":"好了。对吧？如果其中一个不可行，那么所有都是不可行的。对吧？我们如何在它们之间进行转换？我们只需要用不同的因子进行缩放。对吧？比如，如果我有满足这些条件的A和B，而我想满足你们的，我只需要将A和B乘以一百万。然后它们就会满足。明白吗？所以，好的。","start":667.1,"end":685.88}],"notes":["本段讨论了严格不等式与非严格不等式之间的区别，特别是在凸优化问题中，这种区别可能对解的存在性和性质产生重要影响。讲者指出，当不等式是非严格时，可能会出现一些无意义的解，因此需要特别注意。","讲者强调，当处理这类不等式时，通常需要逐个进行论证，而不是依赖于通用原则。他提出了一种方法，即通过缩放变量来将严格不等式转换为非严格不等式，从而简化问题。","讲者进一步解释了如何通过缩放操作来证明严格不等式和非严格不等式之间的等价性。他指出，如果存在满足非严格不等式的解，那么通过适当缩放，可以得到满足严格不等式的解。","讲者还提到，如果一个不等式是可行的，那么所有通过缩放得到的变体也是可行的；反之，如果一个不等式不可行，那么所有通过缩放得到的变体也不可行。","讲者通过具体的例子说明了如何将一个不等式转换为另一个不等式，例如将1替换为10^6，从而展示这种转换的可行性。","最后，讲者指出，这种转换方法在实际应用中非常重要，尤其是在研究和工程问题中，需要理解这种转换的原理和应用。"],"formulas":[],"uncertainties":["10 to the 6"],"diagram":"none","start":506.35,"end":685.88,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":506.35,"text":"So A and B zero works, okay?"},{"start":508.29,"text":"So this is one of those cases where the distinction"},{"start":511.39,"text":"between strict and non-strict actually matters, right?"},{"start":515.99,"text":"It actually matters because when you make it non-strict,"},{"start":519.13,"text":"when you make it non-strict, it's got a silly solution"},{"start":521.27,"text":"which is uninteresting, right?"},{"start":523.17,"text":"Okay, so in a lot of these cases,"},{"start":526.77,"text":"you actually have to hand-argue each one. I'm not aware of a general principle."},{"start":532.39,"text":"Hand-argue each one, and I'll do that argument right now."},{"start":536.99,"text":"The main arguments go something like this. This thing is, that inequality is homogeneous."},{"start":544.49,"text":"In other words, if I double A and B, then whatever this is, which is supposed to be positive,"},{"start":549.87,"text":"goes up by a factor of two. Everybody agree? Same over here. Same for the other one."},{"start":555.99,"text":"right? If this is supposed to be less than, if I double A and B, these things are negative,"},{"start":561.93,"text":"whatever they, they just got twice as negative. Everybody following this? So what I could do"},{"start":566.23,"text":"is my claim is that I can, without loss of generality, replace these strict inequalities"},{"start":573.21,"text":"with these non-strict inequalities with a one. The way I do that is up here,"},{"start":577.73,"text":"if you give me an A and a B that satisfies this,"},{"start":580.49,"text":"I simply scale them by whatever factor is needed to make, you know, however positive that was, how negative that was, I multiply by a factor which makes that bigger than or equal to 1. Everybody got it? So that says, if there exists A and B that satisfy that, then by multiplying them by a positive number, they're going to satisfy this. The converse goes like this. The converse is relatively straightforward, because if I tell you a number is bigger than or equal to 1, it's definitely positive."},{"start":609.63,"text":"Right. So everyone got this. It's actually a suddenly it's actually quite important. And I don't know, you could ease you could easily encounter this. That was a I mean, actually, both in your in research or other things or other places. So this is something we kind of expect you to know about. Yeah. Is there anything stopping us from saying A transpose X plus B is greater than a million? Nope."},{"start":636.4,"text":"It's fine. That's totally cool. So if you want to put 10 to the 6 here, and minus 10 to the 6, that's perfectly good. And then to be quite precise, what I'm saying then is the first set of inequalities are feasible if and only if these are feasible, if and only if your variation where 1 is replaced with 10 to the 6 is feasible. And if 1 is feasible, all of them are feasible."},{"start":667.1,"text":"Period. Right? And if one is infeasible, all are infeasible. Right? And how do we translate among them? We just scale them by various things. Right? So, like, if I have an A and B that satisfies these, and I want to satisfy yours, I just multiply A and B by a million. And then they'll satisfy it. Make sense? So, okay."}],"speech_gaps":[],"frame":"../frames/v012/004.webp","frame_time":518.35},{"title":"超平面分离与凸函数性质","segments":[{"id":46,"text":"All right, so that's the, so we did it very quietly, but, you know, or I did it with just half a line saying they're homogeneous in AB, but that was the, I just gave you the full argument for why that's the case. Okay, all right. So actually, what does this say? Oh, sorry, we can go back. This says that if you gave me a pile of vectors, you know, one set of vectors and another set, and you wanted to know, do they, can you separate them with a hyperplane? The answer is just, it's an LP feasibility problem.","zh":"好的，所以这就是，我们非常安静地做了，但你知道的，或者我只用半句话说它们在AB中是齐次的，但这就是，我只是给你完整的论证来说明为什么是这种情况。好的，好的。那么实际上，这说明了什么呢？哦，抱歉，我们可以回去。这说明如果你给我一堆向量，你知道的，一组向量和另一组向量，你想知道，能不能用一个超平面将它们分开？答案就是，这是一个线性规划可行性问题。","start":687.07,"end":716.35},{"id":47,"text":"Right. That's what it says. So it means that that's immediately like tractable. Right. We could just solve this. OK. OK. Well, we could do more. You can do things like this. You can actually say, well, I just now that I know that there is one, I might want to pick one of these separating hyperplanes. Right. And, you know, one way you might do it is something like this.","zh":"对的，这就是它说的。这意味着这立即是可处理的。对的，我们只需要解决这个问题。好的，好的。我们还可以做更多。你可以这样做。你实际上可以说，我现在知道存在一个，我可能想要选择其中一个分离超平面。对的。你可能这样做的方式是像这样。","start":716.86,"end":741.44},{"id":48,"text":"If I have two hyperplanes like this, like that, and they're normalized with a one on the right-hand side, or minus one, the distance between them is two divided by the two norm of A, right? You can just calculate that, right? In fact, this is a slab, right? So this middle thing, this is A transpose X plus B equals zero.","zh":"如果我有两个这样的超平面，像这样，它们被归一化，右边是1或-1，它们之间的距离是2除以A的2范数，对吧？你可以直接计算出来，对吧？事实上，这是一个板状区域，对吧？中间的这个部分，这是A转置乘以X加上B等于零。","start":742.7,"end":765.74},{"id":49,"text":"This is, it doesn't really matter, but this is either, let's say, the minus 1, and this is plus 1, let's say, right? So that's what that is. And the width of that slab is going to be 2 over the 2 norm of A, right? By the way, what kind of function is this? Convex, concave? It's a trick question, but a perfectly good one, I think. Like, what kind of function is that of A? What do you think?","zh":"这并不真正重要，但这是其中的一个，比如说-1，而这是+1，对吧？这就是它的意思。而这个板状区域的宽度将是2除以A的2范数，对吧？顺便问一句，这个函数是什么类型的？凸函数还是凹函数？这是一个陷阱问题，但我觉得是一个非常好的问题。像，A的这个函数是什么类型的？你怎么想？","start":766.3,"end":801.58},{"id":50,"text":"The answer is it's neither convex nor concave. I was just messing with you. I just wanted to see if you'd... Anyway, it's fine. It's not, right? So, okay. It's nothing, right? So if you say maximize this, it's not concave. That's for sure, okay? Yeah, you can kind of...","zh":"答案是它既不是凸函数也不是凹函数。我只是在逗你玩。我只是想看看你会不会……算了，没关系。它不是，对吧？所以，好吧。它什么也不是，对吧？如果你说最大化这个，它肯定不是凹函数，对吧？是的，你可以说……","start":803.59,"end":821.74},{"id":51,"text":"You can picture it in your mind if you want, right? In R2, the norm, you know, it's got level curves like this. And that thing is a function. It's a crazy thing with a weird pole, right? It's zero. It goes up to infinity. So it's definitely not. It's not convex and it's not concave. Actually, in some directions, it's convex and in others, it's concave. So, okay. All right. It doesn't mean we can't maximize it, right? Because maximizing this is the same as minimizing one over it because it's positive.","zh":"如果你想的话，你可以在脑海中想象一下。在R²中，范数，你知道的，它有一些像这样的等高线。这个东西是一个函数。它是一个很奇怪的东西，有一个奇怪的奇点，对吧？它等于零。它会趋向于无穷大。所以它肯定不是。它既不是凸函数，也不是凹函数。实际上，在某些方向上它是凸的，在其他方向上它是凹的。所以，好的。好吧。这并不意味着我们不能最大化它，对吧？因为最大化这个函数等同于最小化它的倒数，因为它是一个正数。","start":822.19,"end":851.5}],"notes":["本段讲解了超平面分离问题与线性规划可行性问题的关系，指出分离两个向量集合是否可能可以通过求解一个线性规划问题来判断。同时，讲者提到可以通过计算两个归一化超平面之间的距离，即2除以A的2范数，来确定它们之间的距离。"],"formulas":[{"latex":"distance = \\frac{2}{\\|A\\|_2}","symbols":"距离","explanation":"公式正确，表示两个平行超平面之间的距离，其中A是超平面的法向量，使用了2范数。","evidence":"If I have two hyperplanes like this, like that, and they're normalized with a one on the right-hand side, or minus one, the distance between them is two divided by the two norm of A, right? You can just calculate that, right? In fact, this is a slab, right? So this middle thing, this is A transpose X plus B equals zero."}],"uncertainties":[],"diagram":"none","start":687.07,"end":851.5,"asr_flags":[],"math_clarifications":["公式中的距离计算是基于两个平行超平面之间的距离，其中法向量A的2范数被正确使用。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":687.07,"text":"All right, so that's the, so we did it very quietly, but, you know, or I did it with just half a line saying they're homogeneous in AB, but that was the, I just gave you the full argument for why that's the case. Okay, all right. So actually, what does this say? Oh, sorry, we can go back. This says that if you gave me a pile of vectors, you know, one set of vectors and another set, and you wanted to know, do they, can you separate them with a hyperplane? The answer is just, it's an LP feasibility problem."},{"start":716.86,"text":"Right. That's what it says. So it means that that's immediately like tractable. Right. We could just solve this. OK. OK. Well, we could do more. You can do things like this. You can actually say, well, I just now that I know that there is one, I might want to pick one of these separating hyperplanes. Right. And, you know, one way you might do it is something like this."},{"start":742.7,"text":"If I have two hyperplanes like this, like that, and they're normalized with a one on the right-hand side, or minus one, the distance between them is two divided by the two norm of A, right? You can just calculate that, right? In fact, this is a slab, right? So this middle thing, this is A transpose X plus B equals zero."},{"start":766.3,"text":"This is, it doesn't really matter, but this is either, let's say, the minus 1, and this is plus 1, let's say, right? So that's what that is. And the width of that slab is going to be 2 over the 2 norm of A, right? By the way, what kind of function is this? Convex, concave? It's a trick question, but a perfectly good one, I think. Like, what kind of function is that of A? What do you think?"},{"start":803.59,"text":"The answer is it's neither convex nor concave. I was just messing with you. I just wanted to see if you'd... Anyway, it's fine. It's not, right? So, okay. It's nothing, right? So if you say maximize this, it's not concave. That's for sure, okay? Yeah, you can kind of..."},{"start":822.19,"text":"You can picture it in your mind if you want, right? In R2, the norm, you know, it's got level curves like this. And that thing is a function. It's a crazy thing with a weird pole, right? It's zero. It goes up to infinity. So it's definitely not. It's not convex and it's not concave. Actually, in some directions, it's convex and in others, it's concave. So, okay. All right. It doesn't mean we can't maximize it, right? Because maximizing this is the same as minimizing one over it because it's positive."}],"speech_gaps":[],"frame":"../frames/v012/005.webp","frame_time":699.07},{"title":"凸优化中的分离板与对偶问题","segments":[{"id":52,"text":"Right, so that says this problem is convex, that's a quadratic program, and that is, this will add this, this if you solve this problem this QP you'll actually get the thickest you'll get the thickest separating slab, make sense.","zh":"对，所以这说明这个问题是凸的，这是一个二次规划问题，如果你解决这个问题，你会得到最厚的分离板，明白吗。","start":852.67,"end":872.79},{"id":53,"text":"And in fact, we can even say a little bit about how there's an interesting way to get that slab. So for this problem over here, I think this shows you the separating slab for these points and these points. All make sense? Okay. And let's see, that's a QP. Again, you have to be very careful because you have to see what the variables are and all that sort of stuff. Here the variables are A and B. XI and YI are data. Okay.","zh":"事实上，我们甚至可以进一步说明如何得到这个分离板。对于这边的问题，我认为这展示了这些点和这些点的分离板。都明白吗？好的。让我们看看，这是一个二次规划问题。再次强调，你必须非常小心，因为你必须清楚变量是什么以及所有这些细节。这里的变量是A和B。XI和YI是数据。好的。","start":873.62,"end":903.17},{"id":54,"text":"So that's like robust linear discrimination is the way you might say it. That's dialect. That's like machine learning, old school machine learning dialect. Now, it's actually kind of interesting to take for this problem to work out what is the dual of this QP. It's not a QP. Sorry, I misspoke. It's not a QP unless you square it.","zh":"所以这就像鲁棒线性判别，你可能会这样表述。这是方言。这是机器学习，老派的机器学习术语。现在，实际上，对于这个问题，计算其对偶问题会很有趣。它不是一个二次规划问题。抱歉，我刚才说错了。除非你平方，否则它不是一个二次规划问题。","start":903.53,"end":928.87},{"id":55,"text":"That's an equivalent problem. That's a QP. This would be, I guess, an SOCP, right? But I think that none of this would matter. Okay, so if you work out what the Lagrange dual is...","zh":"这是一个等价的问题。这是一个二次规划问题。这可能是一个SOCP，对吧？但我想这些都不重要。好的，如果你计算拉格朗日对偶问题，","start":929.32,"end":942.56},{"id":56,"text":"You get something that looks like this, right? You have these two sets of inequalities, and you end up with something that looks like this. You should maximize 1 transpose lambda plus 1 transpose mu, subject to, and you get something that looks like this. It's actually kind of interesting, right? And it says that the sum of the lambdas and the sum of the mus have to be equal, right? And you get something like that. Okay, and the optimal value of that top problem is actually the maximum margin of separation.","zh":"你会得到一个看起来像这样的结果，对吧？你有两组不等式，最后你会得到一个看起来像这样的结果。你应该最大化1转置lambda加上1转置mu，受约束于，你会得到一个看起来像这样的结果。这实际上很有趣，对吧？它说lambda的和与mu的和必须相等，对吧？你会得到这样的结果。好的，这个顶部问题的最优值实际上是最大间隔的分离。","start":944.19,"end":972.88},{"id":57,"text":"It's the norm or whatever it is, right? Okay, so if you stare at this long enough, you realize that we can actually, what we can do is change variables to normalize the lambdas and the mus. They're both non-negative vectors, and we simply, we replace them with vectors that sum up.","zh":"它是范数或者其他的什么，对吧？好的，如果你仔细观察足够长的时间，你会意识到我们可以做的是改变变量来归一化lambda和mu。它们都是非负向量，我们只需将它们替换为和为1的向量。","start":974.37,"end":995.76},{"id":58,"text":"to 1, entered on negative, otherwise known as mixture coefficients. So we do that, and you plug that in up here, and various things happen, and you end up with this problem here. Now this is very cool, because now we can look at it, right? This says that theta is a set of mixture coefficients, and so this is a general point in the convex hull of the original x's, right? Because it's a mixture of them.","zh":"为了得到1，我们输入负数，也被称为混合系数。因此我们这样做，然后将它代入到这里，各种事情随之发生，最终得到这个问题。现在这非常有趣，因为我们现在可以观察它，对吧？这说明θ是一组混合系数，因此这是原始x值凸包中的一个一般点，对吧？因为它是由这些x值混合而成的。","start":996.46,"end":1023.06}],"notes":["本段讲解了凸优化中的分离板问题，指出这是一个二次规划（QP）问题，通过求解QP可以得到最厚的分离板。讲者提到，分离板的构造方式是通过变量A和B，以及数据点XI和YI来实现的。","讲者进一步说明，该问题的对偶问题具有特定的结构，虽然原问题不是QP，但通过平方可以将其转化为QP。对偶问题的结构包括两个不等式约束，并且最终目标是最大化1^Tλ + 1^Tμ，同时满足约束条件。","对偶问题的最优值对应于最大分离边距，这与分离板的构造密切相关。讲者指出，通过变量替换，可以将λ和μ归一化为和为1的向量，即混合系数，从而将问题转化为凸包内的点。","讲者强调，这种变量替换方法使得问题更加直观，因为混合系数的和为1，表示了原始数据点的线性组合，从而在凸包内形成一个点。这种转换有助于理解分离板与凸包之间的关系。","讲者还提到，这种对偶问题的结构和结果在机器学习中具有重要意义，尤其是在鲁棒线性判别和最大边距问题中。通过凸优化方法，可以有效地找到最优的分离板。","最后，讲者指出，这种变量替换和对偶问题的分析方法是凸优化中的一个典型例子，展示了如何通过对偶性来理解和解决实际问题。"],"formulas":[],"uncertainties":["entered on negative"],"diagram":"none","start":852.67,"end":1023.06,"asr_flags":[],"math_clarifications":["原文中提到的'最大边距'是描述性文字，而非数学表达式，不能直接等于一个数学量。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":852.67,"text":"right so that says this problem is convex that's a quadratic program and that is this will add this this if you solve this problem this QP you'll actually get the the thickest you'll get the thickest separating slab make sense"},{"start":873.62,"text":"And in fact, we can even say a little bit about how there's an interesting way to get that slab. So for this problem over here, I think this shows you the separating slab for these points and these points. All make sense? Okay. And let's see, that's a QP. Again, you have to be very careful because you have to see what the variables are and all that sort of stuff. Here the variables are A and B. XI and YI are data. Okay."},{"start":903.53,"text":"So that's like robust linear discrimination is the way you might say it. That's dialect. That's like machine learning, old school machine learning dialect. Now, it's actually kind of interesting to take for this problem to work out what is the dual of this QP. It's not a QP. Sorry, I misspoke. It's not a QP unless you square it."},{"start":929.32,"text":"That's an equivalent problem. That's a QP. This would be, I guess, an SOCP, right? But I think that none of this would matter. Okay, so if you work out what the Lagrange dual is..."},{"start":944.19,"text":"You get something that looks like this, right? You have these two sets of inequalities, and you end up with something that looks like this. You should maximize 1 transpose lambda plus 1 transpose mu, subject to, and you get something that looks like this. It's actually kind of interesting, right? And it says that the sum of the lambdas and the sum of the mus have to be equal, right? And you get something like that. Okay, and the optimal value of that top problem is actually the maximum margin of separation."},{"start":974.37,"text":"It's the norm or whatever it is, right? Okay, so if you stare at this long enough, you realize that we can actually, what we can do is change variables to normalize the lambdas and the mus. They're both non-negative vectors, and we simply, we replace them with vectors that sum up."},{"start":996.46,"text":"to 1, entered on negative, otherwise known as mixture coefficients. So we do that, and you plug that in up here, and various things happen, and you end up with this problem here. Now this is very cool, because now we can look at it, right? This says that theta is a set of mixture coefficients, and so this is a general point in the convex hull of the original x's, right? Because it's a mixture of them."}],"speech_gaps":[],"frame":"../frames/v012/006.webp","frame_time":864.67},{"title":"凸优化中的对偶问题与支持向量机","segments":[{"id":59,"text":"This thing here, again, these are coefficients that are non-negative, add up to 1. This thing here is actually a general point in the convex hull of the yi's. And what this says is you should minimize t subject to this norm less than t. Obviously, it's the same as just minimizing this thing. This is the epigraph formulation, right?","zh":"这里的东西，再次强调，这些系数是非负的，加起来等于1。这里的东西实际上是yi的凸包中的一个一般点。这句话的意思是，你应该在该范数小于t的条件下最小化t。显然，这等同于直接最小化这个量。这是上境域（epigraph）形式，对吧？","start":1023.98,"end":1044.36},{"id":60,"text":"And then this, so what it's really saying is very geometrically clear. It says minimize the distance between two points. One is in the convex hull of the Xs and one in the convex hull of the Ys. That make sense? So it's actually very cool. So if we go back here, it says the primal says, basically says expand.","zh":"然后，这句话实际上在几何上非常清晰。它说的是最小化两个点之间的距离。一个点位于X的凸包中，另一个点位于Y的凸包中。这有意义吗？所以实际上这非常有趣。如果我们回到这里，它说原始问题基本上是在扩展。","start":1045.38,"end":1068.86},{"id":61,"text":"Find the thickest slab. Expand the slab until it stops fitting between the two sets. The other one says form the convex hull of the dark points in your head. Just do that visually. Form the convex hull of the white circles here. And then find the two points in those two sets which are closest to each other. And sure enough, you're going to get something like, I don't know, probably that dark point and then a point over there.","zh":"找到最厚的板。扩展这个板，直到它不能再夹在两个集合之间。另一个说法是，在脑海中形成暗点的凸包。只需视觉上这样做。在这里形成白色圆圈的凸包。然后找到这两个集合中彼此最接近的两个点。确实，你会得到类似的结果，比如，我不知道，可能是那个暗点和那边的一个点。","start":1069.57,"end":1097.61},{"id":62,"text":"All make sense? It just means that in a lot of these geometric problems, duals are interpretable. Duals are usually highly interpretable and interesting. It doesn't help you do anything, it doesn't solve it better, blah, blah, blah. But it's just interesting just to see that it all makes sense. I think we looked at that. Now we get to something that's actually useful. Here it is.","zh":"都理解了吗？这仅仅意味着在许多几何问题中，对偶问题是可以解释的。对偶问题通常具有高度的可解释性和趣味性。它不会帮助你做任何事情，也不会更好地解决问题，等等。但仅仅为了看到这一切是有意义的，就很有意思。我想我们已经看过这个了。现在我们进入一个实际上有用的内容。这里就是。","start":1099.13,"end":1129.7},{"id":63,"text":"Now what it is, is you have points that are not linearly separable, right? And again, if you've had a first course, maybe in the first two weeks of a machine learning class, you would have seen this. This is like the so-called, it's getting close to the idea of the support vector machine, which we'll get to in a minute. But what you do is you add, and this is in the style of how it's described in a machine learning class, which I think is poorly, but that's...","zh":"现在，这里的情况是，你有一些点是线性不可分的，对吧？而且，如果你上过机器学习的第一门课，可能在前两周就见过这个。这类似于所谓的支持向量机（support vector machine）的概念，我们稍后会讲到。但你所做的就是添加，这在机器学习课程中描述的方式，我认为是不好的，但……","start":1133.14,"end":1159.04},{"id":64,"text":"Doesn't matter. That's fine. And so what you do is you say, well, look, I can't satisfy these inequalities. And you go, cool, I'm going to give you some slack. By the way, that parsed both mathematically and colloquially. So what it means is instead of requiring these things to be bigger than 1, I'm going to say they're bigger than 1 minus ui. ui is non-negative. It's your slack. It's how much we're going to shrink.","zh":"没关系。这样是可以的。然后你就会想，嗯，我无法满足这些不等式。于是你就会说，很好，我要给你一些松弛。顺便说一下，这在数学上和口语上都是合理的。这意味着，我不会再要求这些值大于1，而是要求它们大于1减去ui。ui是非负的。这是你的松弛量，也就是我们要缩小的程度。","start":1159.22,"end":1184.04},{"id":65,"text":"We're going to shrink the requirement on the constraint so you can satisfy it. And then we're going to say something like, let's minimize the sum of these slacks. How many inequalities do I need to give you slack on so you can satisfy them? And you'd get a problem that looks like this.","zh":"我们要缩小对约束的要求，这样你就可以满足它。然后我们会说，比如，让我们最小化这些松弛量的总和。我需要给你多少个不等式的松弛，才能满足它们？然后你就会得到一个看起来像这样的问题。","start":1184.62,"end":1203.22}],"notes":["本段讲解了凸优化中的对偶问题，特别是几何解释。讲者提到，通过最小化两个凸包之间的距离，可以找到两个集合之间的最短距离，这与支持向量机（SVM）的概念相关。对偶问题通常具有高度的可解释性，尽管它不会直接解决原始问题，但有助于理解问题的结构。","讲者进一步说明了当数据点不可线性分离时，如何通过引入松弛变量来处理。松弛变量允许约束条件被放宽，从而使得问题变得可解。这种处理方式在机器学习中非常常见，特别是在支持向量机中。","讲者提到，通过最小化松弛变量的总和，可以得到一个优化问题，该问题类似于支持向量机的优化形式。这种形式允许模型在满足约束的同时，尽可能减少对约束的违反程度。","讲者强调了对偶问题在几何上的直观意义，即通过扩展一个“板”（slab）直到它无法再同时包含两个集合，从而找到两个集合之间的最短距离。这种几何解释有助于理解对偶问题的结构。","讲者指出，虽然对偶问题不会直接解决原始问题，但它提供了对问题的另一种视角，有助于理解问题的性质和结构。这种视角在凸优化中非常重要，因为它可以揭示问题的内在特性。","讲者提到，支持向量机（SVM）是这种思想的一个具体应用，它通过引入松弛变量和最小化总和来处理不可线性分离的数据。这种思想在机器学习中非常关键，因为它允许模型在处理复杂数据时保持一定的泛化能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1023.98,"end":1203.22,"asr_flags":[],"math_clarifications":["原文中提到的几何问题和优化问题需要更明确的数学表达式，例如使用数学符号和公式来描述凸包、距离、松弛变量等概念。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1023.98,"text":"This thing here, again, these are coefficients that are non-negative, add up to 1. This thing here is actually a general point in the convex hull of the yi's. And what this says is you should minimize t subject to this norm less than t. Obviously, it's the same as just minimizing this thing. This is the epigraph formulation, right?"},{"start":1045.38,"text":"And then this, so what it's really saying is very geometrically clear. It says minimize the distance between two points. One is in the convex hull of the Xs and one in the convex hull of the Ys. That make sense? So it's actually very cool. So if we go back here, it says the primal says, basically says expand."},{"start":1069.57,"text":"Find the thickest slab. Expand the slab until it stops fitting between the two sets. The other one says form the convex hull of the dark points in your head. Just do that visually. Form the convex hull of the white circles here. And then find the two points in those two sets which are closest to each other. And sure enough, you're going to get something like, I don't know, probably that dark point and then a point over there."},{"start":1099.13,"text":"All make sense? It just means that in a lot of these geometric problems, duals are interpretable. Duals are usually highly interpretable and interesting. It doesn't help you do anything, it doesn't solve it better, blah, blah, blah. But it's just interesting just to see that it all makes sense. I think we looked at that. Now we get to something that's actually useful. Here it is."},{"start":1133.14,"text":"Now what it is, is you have points that are not linearly separable, right? And again, if you've had a first course, maybe in the first two weeks of a machine learning class, you would have seen this. This is like the so-called, it's getting close to the idea of the support vector machine, which we'll get to in a minute. But what you do is you add, and this is in the style of how it's described in a machine learning class, which I think is poorly, but that's..."},{"start":1159.22,"text":"Doesn't matter. That's fine. And so what you do is you say, well, look, I can't satisfy these inequalities. And you go, cool, I'm going to give you some slack. By the way, that parsed both mathematically and colloquially. So what it means is instead of requiring these things to be bigger than 1, I'm going to say they're bigger than 1 minus ui. ui is non-negative. It's your slack. It's how much we're going to shrink."},{"start":1184.62,"text":"We're going to shrink the requirement on the constraint so you can satisfy it. And then we're going to say something like, let's minimize the sum of these slacks. How many inequalities do I need to give you slack on so you can satisfy them? And you'd get a problem that looks like this."}],"speech_gaps":[],"frame":"../frames/v012/007.webp","frame_time":1035.98},{"title":"支持向量机与凸优化","segments":[{"id":66,"text":"And it's actually quite interesting here. We would write this in a very simple way, but that's okay. And it turns out this is actually kind of useful. This is now a heuristic for minimizing roughly the number of misclassified points, which I can show you what that would be. Actually, why don't I show you that? So here's what it would look like.","zh":"在这里，实际上这非常有趣。我们可以用非常简单的方式写出这个，这也没关系。结果发现这实际上很有用。现在这是一个启发式方法，用于大致最小化误分类点的数量，我可以向你们展示这会是什么样子。实际上，为什么不让我展示给你们看呢？这就是它看起来的样子。","start":1205.51,"end":1229.31},{"id":67,"text":"Let's see, I will write down, let me see what it is. It's, let's take A I, so this is A I transpose, A transpose X I plus B, right? We want that, yeah, there's zero, right? And if I ask you whether you have misclassified a point X I or not, the question is whether this is negative.","zh":"让我们看看，我会写下，让我想想这是什么。它是 A I，所以这是 A I 的转置，A 转置乘以 X I 加上 B，对吧？我们希望这个等于零，对吧？如果我问你们是否误分类了点 X I，问题是这个是否为负数。","start":1232.55,"end":1256.12},{"id":68,"text":"Right? So if you're going to misclassify, that's a problem. That's something that looks like this. Right? That's a cost. Right? So if I took this function of these, what I would end up getting is precisely the number of data points I misclassified. Everybody agree with that? Because if this is negative, it means I wanted this thing to be positive. Okay, here. If you insist that's positive, I guess I have to make it like that. Okay?","zh":"对吧？如果你误分类了，那就是一个问题。这看起来像这样。对吧？这是一笔成本。对吧？如果我取这个函数的值，我最终得到的就是我误分类的数据点数量。大家同意吗？因为如果这个是负数，意味着我希望这个是正数。好的，这里。如果你坚持这个是正数，我想我必须把它设成这样。好的？","start":1256.79,"end":1285.63},{"id":69,"text":"So that's what it is. Now this function, of course, is not convex, so you can't minimize that. Then what this says is you should actually do something like this. You should say, I want that to be at least one. And then your cost function, the cost function we have looks like this. Because it's the amount. And actually, it's super interesting. It makes perfect sense. That's equivalent to this problem here.","zh":"这就是它的样子。当然，这个函数不是凸函数，因此你不能直接最小化它。那么，这实际上建议你做的是这样的事情。你应该说，我希望这个至少为一。然后你的成本函数，我们拥有的成本函数看起来像这样。因为这是数量。实际上，这非常有趣。它完全合乎逻辑。这等价于这里的问题。","start":1286.34,"end":1316.02},{"id":70,"text":"That's these numbers up here, the u's and v's. So that's convex. And it's actually super interesting to think about what it means. Here's what it means. It says that if you have a data point, we think of one as the margin, right? So it says, you know what? If you classify correctly with at least this, over here means you classify correctly, bigger than zero. If you classify correctly with a margin of one,","zh":"这就是上面这些数字，u 和 v。所以这是凸函数。实际上，思考它意味着什么非常有趣。这就是它的意思。它说，如果你有一个数据点，我们将一视为边界，对吧？它说，你知道吗？如果你以至少这个边界正确分类，这边的值大于零意味着你正确分类了。如果你以边界为一正确分类，","start":1316.96,"end":1343.36},{"id":71,"text":"more than one or more, then that's cool. There's no cost. Like, you did fine, right? You start charging over here. We're actually charging for classifying correctly, but being less than the margin we desire. Everybody following this? Okay, and then it just grows linearly, right? And actually, you can see something immediately, which is this.","zh":"如果有多个或更多，那也没关系。没有成本。比如，你做得很好，对吧？你开始在这里收费。我们实际上是在为正确分类收费，但低于我们希望的边界。大家都能跟上吗？好的，然后它就会线性增长，对吧？实际上，你可以立刻看到一些东西，就是这个。","start":1343.87,"end":1367.97}],"notes":["本段讲解了支持向量机（SVM）的基本思想，即通过最大化分类间隔来减少误分类点的数量。讲者提到，原始的误分类点计数函数不是凸函数，因此无法直接优化，需要将其转换为凸优化问题。","讲者指出，通过引入一个最小间隔（如1），将问题转化为凸优化问题，其中目标函数是误分类点的个数。如果分类正确且间隔大于零，则不产生成本；如果间隔小于零，则产生成本。","讲者进一步解释了分类间隔的概念，即数据点与分类超平面之间的距离。如果间隔大于等于1，则认为分类正确，否则需要调整模型。","讲者强调，这种转换后的凸优化问题具有良好的性质，可以使用现有的凸优化算法进行求解，例如梯度下降法或对偶问题求解。","讲者提到，这种转换后的目标函数是线性增长的，因此在优化过程中可以有效地找到最优解。","讲者最后指出，这种思路是支持向量机的核心思想之一，即通过最大化间隔来提高分类的鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1205.51,"end":1367.97,"asr_flags":[],"math_clarifications":["公式A^T X_i + B未明确数学类型，且未提供上下文信息，无法核对其正确性。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1205.51,"text":"And it's actually quite interesting here. We would write this in a very simple way, but that's okay. And it turns out this is actually kind of useful. This is now a heuristic for minimizing roughly the number of misclassified points, which I can show you what that would be. Actually, why don't I show you that? So here's what it would look like."},{"start":1232.55,"text":"let's see, I will write down, let me see what it is. It's, let's take A I, so this is A I transpose, A transpose X I plus B, right? We want that, yeah, there's zero, right? And if I ask you whether you have misclassified a point X I or not, the question is whether this is negative."},{"start":1256.79,"text":"Right? So if you're going to misclassify, that's a problem. That's something that looks like this. Right? That's a cost. Right? So if I took this function of these, what I would end up getting is precisely the number of data points I misclassified. Everybody agree with that? Because if this is negative, it means I wanted this thing to be positive. Okay, here. If you insist that's positive, I guess I have to make it like that. Okay?"},{"start":1286.34,"text":"So that's what it is. Now this function, of course, is not convex, so you can't minimize that. Then what this says is you should actually do something like this. You should say, I want that to be at least one. And then your cost function, the cost function we have looks like this. Because it's the amount. And actually, it's super interesting. It makes perfect sense. That's equivalent to this problem here."},{"start":1316.96,"text":"That's these numbers up here, the u's and v's. So that's convex. And it's actually super interesting to think about what it means. Here's what it means. It says that if you have a data point, we think of one as the margin, right? So it says, you know what? If you classify correctly with at least this, over here means you classify correctly, bigger than zero. If you classify correctly with a margin of one,"},{"start":1343.87,"text":"more than one or more, then that's cool. There's no cost. Like, you did fine, right? You start charging over here. We're actually charging for classifying correctly, but being less than the margin we desire. Everybody following this? Okay, and then it just grows linearly, right? And actually, you can see something immediately, which is this."}],"speech_gaps":[],"frame":"../frames/v012/008.webp","frame_time":1217.51},{"title":"凸优化在机器学习与金融中的应用","segments":[{"id":72,"text":"this function is bigger than this other function. And so it turns out that the optimal value of this is actually an upper bound on the number of misclassifications. So again, if you're following this, that's great. And if you aren't, that's probably okay too. Right. So, okay. Everybody, that all makes sense? How many people actually have seen things like this in a machine learning class? I hope a fair number of you. Good. Okay. Okay.","zh":"这个函数比另一个函数更大。因此，实际上这个函数的最优值实际上是误分类数量的一个上界。所以，如果你在跟着这个思路，那很好。如果你没有在跟着，那可能也没关系。对吧。好的，好的。大家觉得这些都讲得通吗？有多少人以前在机器学习课程中见过类似的内容？我希望有相当多的人。很好。好的，好的。","start":1368.49,"end":1396.59},{"id":73,"text":"And then all you do now is you add, I guess they would actually square this probably up here. They would square this thing. And then this trades off two things. It trades off, this will trade off the two desirable things. Number one.","zh":"现在你所做的就是加上，我想他们实际上会在这里把这一项平方。他们会把这一项平方。然后这会权衡两件事情。它会权衡这两件有益的事情。第一件是：","start":1397.28,"end":1413.4},{"id":74,"text":"having small slacks. Small slacks corresponds to this surrogate function. In fact, there's a whole way to view this which makes perfect sense, which is someone says, find me a hyperplane that misclassifies as few points as possible. And you go, cool, the function looks like this. And you go, I can't do that because it's not convex. Then you'd say, well, I'll use this convex function here. Makes perfect sense, right? And you say, I'll minimize that. Everybody following this?","zh":"拥有较小的松弛量。较小的松弛量对应于这个替代函数。事实上，有一种看待这个问题的方式非常合理，即有人会说，找到一个超平面，使得误分类的点尽可能少。然后你会说，很好，这个函数看起来像这样。然后你会说，我做不到，因为它不是凸的。接着你会说，那我使用这个凸函数。这完全合情合理，对吧？然后你会说，我要最小化这个函数。大家跟得上这个思路吗？","start":1413.93,"end":1443.42},{"id":75,"text":"Anyway, by the way, that story often, in many, many fields, that story usually has a very good outcome. Someone says, I want to do X, and you'd say, can't, can't do that, not convex. Then someone says, but here's like a surrogate, which is convex. And then people observe it to work really well in practice. Usually about five years later, somebody writes a theory-oriented paper that basically says, actually,","zh":"顺便说一句，这个故事在许多、许多领域中通常会有非常好的结果。有人会说，我想做X，而你会说，不能，不能这么做，因为不是凸的。接着有人会说，但这里有一个替代函数，它是凸的。然后人们会观察到它在实践中效果非常好。通常大约五年后，有人会写一篇理论导向的论文，基本上说，实际上，","start":1444.88,"end":1471.58},{"id":76,"text":"You never even wanted to solve the first thing, which you can't solve anyway because it's a bad idea. What you really wanted to solve was the convex relaxation. So I won't go into details on that, but that comes up many, many times. I mean, here's one in finance. People would say, you know, what?","zh":"你从一开始就不想解决那个问题，而你本来就不能解决它，因为这是个坏主意。你真正想解决的是凸松弛问题。我不会详细展开这一点，但这种情况经常出现，很多、很多次。比如在金融领域，人们会说，你知道吗，什么？","start":1472.27,"end":1490.69},{"id":77,"text":"you know, with 99, you know, what is my, you know, whatever, my 0.99 value at risk? That's how much money could you lose, you know, in a 1% event, right? That's value at risk. By the way, it's used universally throughout finance, banking. It's written into regulations, everything. Now, I saw some people figured out a very cool thing called conditional value risk, CVAR.","zh":"你知道吗，用99%，你知道，我的，你知道， whatever，我的0.99风险价值是多少？这就是在1%事件中你可能损失多少钱，对吧？这就是风险价值。顺便说一句，它被广泛应用于金融和银行业，写入了所有法规，一切。我看到有些人发现了一个非常酷的东西，叫做条件风险价值，CVAR。","start":1491.4,"end":1516.43},{"id":78,"text":"If you don't, it doesn't, you don't have to know what these are. That's actually kind of bad for value at risk. It's exactly the same thing, right? It's a convex surrogate for value at risk. Everybody following this? Okay. It's convex. And that means we can do all sorts of stuff. We can analyze portfolio. We can construct portfolios that, that, that, you know, have constraints on CVAR and all sorts of everybody got it. Okay. 10 years later, people analyze it and find out that","zh":"如果你不知道，那也没关系，你不需要知道这些。这实际上对风险价值来说有点糟糕。它和风险价值是完全一样的，对吧？它是风险价值的一个凸替代。大家跟上了吗？好的。它是凸的。这意味着我们可以做各种事情。我们可以分析投资组合。我们可以构建投资组合，这些投资组合有对CVAR的约束，各种各样的，大家明白了吗？好的。10年后，人们分析它并发现","start":1516.85,"end":1541.81}],"notes":["本段讨论了凸优化在机器学习中的应用，特别是通过使用凸替代函数来解决非凸问题。讲者提到，当试图找到一个超平面以最小化误分类点时，由于非凸性，无法直接求解，因此引入了凸替代函数。这种替代函数在实践中表现良好，并在多年后被理论化。","讲者进一步指出，这种凸替代方法在金融领域也有广泛应用，例如在计算风险价值（Value at Risk, VaR）时，使用条件风险价值（Conditional Value at Risk, CVaR）作为凸替代。CVaR 是 VaR 的凸替代，使得可以进行更有效的分析和优化。","讲者强调，虽然原始问题可能难以求解，但通过凸松弛（convex relaxation）可以找到近似解，并且这种方法在多个领域中被广泛采用。例如，在金融中，CVaR 被用于构建具有约束条件的投资组合。","讲者提到，这种凸替代方法在实践中被广泛使用，并且在多年后才被理论化。这表明，实际应用中可能先采用凸替代方法，随后才进行理论分析。","讲者还指出，CVaR 是 VaR 的凸替代，这使得可以进行更有效的分析和优化。这种替代方法在金融领域被广泛采用，并且被写入法规中。","讲者最后提到，虽然原始问题可能难以求解，但通过凸松弛可以找到近似解，并且这种方法在多个领域中被广泛采用。例如，在金融中，CVaR 被用于构建具有约束条件的投资组合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1368.49,"end":1541.81,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1368.49,"text":"this function is bigger than this other function. And so it turns out that the optimal value of this is actually an upper bound on the number of misclassifications. So again, if you're following this, that's great. And if you aren't, that's probably okay too. Right. So, okay. Everybody, that all makes sense? How many people actually have seen things like this in a machine learning class? I hope a fair number of you. Good. Okay. Okay."},{"start":1397.28,"text":"And then all you do now is you add, I guess they would actually square this probably up here. They would square this thing. And then this trades off two things. It trades off, this will trade off the two desirable things. Number one."},{"start":1413.93,"text":"having small slacks. Small slacks corresponds to this surrogate function. In fact, there's a whole way to view this which makes perfect sense, which is someone says, find me a hyperplane that misclassifies as few points as possible. And you go, cool, the function looks like this. And you go, I can't do that because it's not convex. Then you'd say, well, I'll use this convex function here. Makes perfect sense, right? And you say, I'll minimize that. Everybody following this?"},{"start":1444.88,"text":"Anyway, by the way, that story often, in many, many fields, that story usually has a very good outcome. Someone says, I want to do X, and you'd say, can't, can't do that, not convex. Then someone says, but here's like a surrogate, which is convex. And then people observe it to work really well in practice. Usually about five years later, somebody writes a theory-oriented paper that basically says, actually,"},{"start":1472.27,"text":"You never even wanted to solve the first thing, which you can't solve anyway because it's a bad idea. What you really wanted to solve was the convex relaxation. So I won't go into details on that, but that comes up many, many times. I mean, here's one in finance. People would say, you know, what?"},{"start":1491.4,"text":"you know, with 99, you know, what is my, you know, whatever, my 0.99 value at risk? That's how much money could you lose, you know, in a 1% event, right? That's value at risk. By the way, it's used universally throughout finance, banking. It's written into regulations, everything. Now, I saw some people figured out a very cool thing called conditional value risk, CVAR."},{"start":1516.85,"text":"If you don't, it doesn't, you don't have to know what these are. That's actually kind of bad for value at risk. It's exactly the same thing, right? It's a convex surrogate for value at risk. Everybody following this? Okay. It's convex. And that means we can do all sorts of stuff. We can analyze portfolio. We can construct portfolios that, that, that, you know, have constraints on CVAR and all sorts of everybody got it. Okay. 10 years later, people analyze it and find out that"}],"speech_gaps":[],"frame":"../frames/v012/009.webp","frame_time":1380.49},{"title":"风险度量与凸优化的对比","segments":[{"id":79,"text":"The value at risk is what's called an incoherent risk measure, and CVAR is not. So they write down some axioms. I mean, again, this is just the story, right? You write down some axioms that a risk measure should have. And what it means is that value at risk is actually just a bad measure of risk, right?","zh":"风险价值（Value at Risk）被称为一种不一致的风险度量，而条件风险价值（CVAR）则不是。因此，他们列出了一些公理。我的意思是，这只是一个故事，对吧？你列出一些风险度量应该满足的公理。其含义是，风险价值实际上只是一个糟糕的风险度量，对吧？","start":1542.29,"end":1565.72},{"id":80,"text":"too bad that it's what all banks use many hedge funds it's written into regulations right so it tells it tells banks how much money they have to have on on hand to avoid a run on the bank and all this kind of crazy stuff but anyway so so that's a perfect example where the convex thing turned out to be actually what you really wanted to do not the one that sounded the most natural in the first place right this is another one it turns out here's an incredibly bad idea is to say i have a bunch of data","zh":"太糟糕了，它被很多银行和对冲基金使用，它被写入了法规中。这告诉银行他们必须持有多少资金以避免银行挤兑等各种疯狂的事情。不过，不管怎样，这就是一个完美的例子，其中凸性实际上是你真正想要的东西，而不是最初听起来最自然的那个。这也是另一个例子，结果发现，说‘我有一组数据’是一个极其糟糕的想法","start":1566.59,"end":1595.09},{"id":81,"text":"please find me a separating hyperplane that separates, that misclassifies as few as possible.","zh":"请找到一个分离超平面，使其尽可能少地错误分类。","start":1595.7,"end":1601.7},{"id":82,"text":"But that sounds completely reasonable. Anybody would say that, right? It sounds reasonable.","zh":"但这听起来完全合理。任何人都会这么说，对吧？这听起来很合理。","start":1602.0,"end":1606.02},{"id":83,"text":"It turns out it's not. Something like this is actually much better. Yeah?","zh":"结果发现这并不合理。实际上，像这样的方法要好得多。对吧？","start":1606.2,"end":1609.24},{"id":84,"text":"In this problem, does it matter if we choose, like, plus minus one as the,","zh":"在这个问题中，如果我们选择加减一作为边距，会不会有影响？","start":1609.56,"end":1614.66},{"id":85,"text":"like, as the margins? Yeah, exactly.","zh":"就像作为边距一样？是的，正是如此。","start":1616.46,"end":1618.42},{"id":86,"text":"No, no, no, no. It doesn't, it is not going to make any difference at all,","zh":"不，不，不，不。这不会有任何差别，它不会有任何影响，","start":1618.7,"end":1621.76},{"id":87,"text":"right? You can make them 10 to the 6th if you want, right? And actually what would happen is","zh":"对吧？如果你想的话，你可以把它设为10的6次方，对吧？实际上会发生的是","start":1621.76,"end":1627.52},{"id":88,"text":"just everything would just scale, right? Because actually if you look at it, everything's homogeneous,","zh":"所有东西都会按比例缩放，对吧？因为实际上如果你仔细看一下，包括目标函数在内，所有内容都是齐次的，","start":1627.52,"end":1631.56},{"id":89,"text":"including the objective this way, right? So everything would just scale. If you don't like","zh":"对吧？所以所有东西都会按比例缩放。如果你不喜欢1作为你的标准正数，可以选择另一个数。你可以把它设为e来捉弄别人，","start":1631.78,"end":1636.42},{"id":90,"text":"1 as your canonical positive number, choose another one. You can make it e just to mess","zh":"或者π。你也可以把它设为π的平方根。这并不是一个坏主意，只是为了这样做，","start":1637.1,"end":1642.96},{"id":91,"text":"with people, or pi. You can make it square root pi. That's not a bad idea, just to do that,","zh":"这样，以后有人查看你的代码时会惊讶地问，这是什么？是的？你所说的齐次是什么意思？齐次意味着如果你将参数或变量，","start":1642.96,"end":1650.28},{"id":92,"text":"that just, you know, so that somebody poking through your code later goes like, whoa, what","zh":"在这种情况下，乘以一个正数，那么","start":1650.28,"end":1654.96},{"id":93,"text":"is that? Yes? What do you mean by homogeneous? Homogeneous means that if you multiply, if","zh":"目标函数也会按相同的比例缩放，对吧？","start":1654.96,"end":1663.22},{"id":94,"text":"you multiply the arguments or the variables by, in this case, by a positive number, then","zh":"如果你将参数或变量乘以一个正数，那么","start":1663.22,"end":1669.9},{"id":95,"text":"that expression value goes up by the same number, right? So a norm is a great example,","zh":"这个表达式的值会增加相同的数值，对吧？所以范数是一个很好的例子，","start":1669.9,"end":1675.6},{"id":96,"text":"an absolute value, a norm. And you can see here that the variables are like a, b, u and","zh":"比如绝对值，范数。你可以看到这里的变量是 a, b, u 和 v。","start":1675.6,"end":1683.08},{"id":97,"text":"v. And if I multiply them all by 2, you tell me what happens to the objective. It goes","zh":"如果我把它们全部乘以 2，你告诉我目标函数会发生什么变化。它会增加 2 倍。","start":1683.08,"end":1687.98},{"id":98,"text":"up by 2x. So it's homogeneous. Everybody got this idea? Well, you can actually do","zh":"放大两倍。因此它是齐次的。大家明白这个概念吗？好吧，实际上你还可以做","start":1687.98,"end":1700.48}],"notes":["本段讲授了风险度量的概念，指出Value at Risk（VaR）是一种不一致的风险度量，而CVaR（条件风险价值）则不同。讲者提到，VaR虽然在银行和对冲基金中广泛使用，但其作为风险度量并不理想，因为其不满足凸性要求。凸性在这里指的是风险度量应满足的某些数学性质，使得优化问题更容易求解。","接着，讲者通过一个例子说明凸性的重要性。他指出，虽然寻找一个能最小化误分类的分离超平面听起来很自然，但实际上，这种做法并不理想。相反，凸性方法在实际中更有效。","讲者进一步讨论了在支持向量机（SVM）中选择边距（margins）的问题。他指出，选择+1和-1作为边距并不重要，因为问题具有齐次性（homogeneity），即所有变量和目标函数在缩放时都会按比例变化。","讲者解释了齐次性的概念，即如果变量乘以一个正数，目标函数的值也会按相同的比例变化。例如，范数（norm）和绝对值都是齐次性的例子。","讲者通过一个具体的例子说明了齐次性：如果变量a、b、u和v都乘以2，那么目标函数的值也会增加2倍。这说明了齐次性在优化问题中的重要性。","最后，讲者强调了齐次性在实际应用中的意义，即选择不同的边距值（如e、π或√π）并不会影响最终结果，因为问题本身具有齐次性。"],"formulas":[],"uncertainties":["在段落80中，'many hedge funds it's written into regulations' 的断句可能不准确，但整体意思清晰。","段落81中'as few as possible'的表达可能有歧义，但结合上下文可以理解为'尽可能少地误分类'。"],"diagram":"none","start":1542.29,"end":1700.48,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":1542.29,"text":"The value at risk is what's called an incoherent risk measure, and CVAR is not. So they write down some axioms. I mean, again, this is just the story, right? You write down some axioms that a risk measure should have. And what it means is that value at risk is actually just a bad measure of risk, right?"},{"start":1566.59,"text":"too bad that it's what all banks use many hedge funds it's written into regulations right so it tells it tells banks how much money they have to have on on hand to avoid a run on the bank and all this kind of crazy stuff but anyway so so that's a perfect example where the convex thing turned out to be actually what you really wanted to do not the one that sounded the most natural in the first place right this is another one it turns out here's an incredibly bad idea is to say i have a bunch of data"},{"start":1595.7,"text":"please find me a separating hyperplane that separates, that misclassifies as few as possible."},{"start":1602.0,"text":"But that sounds completely reasonable. Anybody would say that, right? It sounds reasonable."},{"start":1606.2,"text":"It turns out it's not. Something like this is actually much better. Yeah?"},{"start":1609.56,"text":"In this problem, does it matter if we choose, like, plus minus one as the,"},{"start":1616.46,"text":"like, as the margins? Yeah, exactly."},{"start":1618.7,"text":"No, no, no, no. It doesn't, it is not going to make any difference at all,"},{"start":1621.76,"text":"right? You can make them 10 to the 6th if you want, right? And actually what would happen is"},{"start":1627.52,"text":"just everything would just scale, right? Because actually if you look at it, everything's homogeneous,"},{"start":1631.78,"text":"including the objective this way, right? So everything would just scale. If you don't like"},{"start":1637.1,"text":"1 as your canonical positive number, choose another one. You can make it e just to mess"},{"start":1642.96,"text":"with people, or pi. You can make it square root pi. That's not a bad idea, just to do that,"},{"start":1650.28,"text":"that just, you know, so that somebody poking through your code later goes like, whoa, what"},{"start":1654.96,"text":"is that? Yes? What do you mean by homogeneous? Homogeneous means that if you multiply, if"},{"start":1663.22,"text":"you multiply the arguments or the variables by, in this case, by a positive number, then"},{"start":1669.9,"text":"that expression value goes up by the same number, right? So a norm is a great example,"},{"start":1675.6,"text":"an absolute value, a norm. And you can see here that the variables are like a, b, u and"},{"start":1683.08,"text":"v. And if I multiply them all by 2, you tell me what happens to the objective. It goes"},{"start":1687.98,"text":"up by 2x. So it's homogeneous. Everybody got this idea? Well, you can actually do"}],"speech_gaps":[],"frame":"../frames/v012/010.webp","frame_time":1554.29},{"title":"核方法与特征工程","segments":[{"id":99,"text":"You know, I mean, this is people in, I guess, in machine learning, you describe this as kernel methods, but we could just do this, right? You know, suppose you want to separate two points by some nonlinear function, right? Now, of course, there's a gazillion functions that separate two sets of points, because I could actually define a function that's positive right around each of our x's.","zh":"你知道，我的意思是，这是一些人在机器学习中描述的，称为核方法，但我们可以直接这样做，对吧？比如说，你想要用某个非线性函数来分离两个点，对吧？当然，有很多函数可以将两组点分开，因为我可以实际上定义一个函数，在我们的x附近是正的。","start":1702.08,"end":1723.31},{"id":100,"text":"negative around each of our y's, right? And then I don't even care what it is anywhere else. It doesn't matter. It's a half. I don't care. Or zero. It doesn't make any difference, right? That's silly. You want, so, I mean, you want some family of functions or whatever to regularize your choices. And so, you know, you could do things like this. We can make, so f of z contains these basis functions.","zh":"在我们的y附近是负的，对吧？然后我根本不关心其他地方的值是什么。没关系。它只是一个半空间。我不在乎。或者零。这没有任何差别，对吧？这很傻。你想要，我的意思是，你想要一些函数族或任何东西来正则化你的选择。因此，你知道，你可以这样做。我们可以构造，所以f(z)包含这些基函数。","start":1724.23,"end":1747.67},{"id":101,"text":"And then theta is now a linear combination of basis functions. One of them, by the way, could be one. That would be a very common basis functions. And then what you want to do is you want to find these inequalities. Now this looks complicated, right? Because maybe somebody in these things, there's like sines, cosines, hyperbolic cosines. I mean, who knows what's in those? There's some weird things. I have no idea. Maybe those are like weird radial basis functions. It doesn't matter, right?","zh":"然后θ现在是这些基函数的线性组合。顺便说一句，其中一个基函数可以是1。这将是一个非常常见的基函数。然后你想要做的事情是找到这些不等式。现在这看起来很复杂，对吧？因为可能有人在这些函数中使用正弦、余弦、双曲余弦等。我的意思是，谁知道里面有什么？有些奇怪的东西。我完全不知道。也许这些是奇怪的径向基函数。没关系，对吧？","start":1748.33,"end":1774.83},{"id":102,"text":"So, but it's looking, it'd make you nervous. But the point is that's data. And so these are actually, these are just vectors. They're just constant vectors. And it's exactly the same. It's exactly the same problem, right? So, okay, that makes sense. Maybe an even simpler interpretation of this is even better and really dumb. You think of this as, I would think of this as feature engineering.","zh":"所以，但看起来，这会让你感到紧张。但重点是这些是数据。因此，这些实际上是向量。它们只是常数向量。而且它和之前的问题完全一样，对吧？所以，好的，这有道理。也许一个更简单的解释甚至更好，而且真的很傻。你把这些看作特征工程。","start":1775.73,"end":1801.48},{"id":103,"text":"which is like, thanks for your Xs, thanks for your Ys. I'm going to put them through some functions. Maybe I get a bigger vector. And you say, now just do support vector machine on that or separate them that way. That's another way to say it. So, okay. So you can do crazy stuff. Like you could say, I want to do quadratic, I do want to do quadratic discrimination. So to do that, you set up inequalities that look like this and this. And the variables here are P, Q, and R.","zh":"这类似于，感谢你的Xs，感谢你的Ys。我要把它们通过一些函数。也许我可以得到一个更大的向量。然后你说，现在就在这个向量上做支持向量机或者这样分开它们。这是另一种说法。所以，好的。因此，你可以做疯狂的事情。比如，你可以这样说，我想做二次判别。因此，你需要设置像这样的不等式。这里的变量是P、Q和R。","start":1802.09,"end":1831.47},{"id":104,"text":"which is like, thanks for your Xs, thanks for your Ys. I'm going to put them through some functions. Maybe I get a bigger vector. And you say, now just do support vector machine on that or separate them that way. That's another way to say it. So, okay. So you can do crazy stuff. Like you could say, I want to do quadratic, I do want to do quadratic discrimination. So to do that, you set up inequalities that look like this and this. And the variables here are P, Q, and R.","zh":"这就像，谢谢你的Xs，谢谢你的Ys。我要把它们通过一些函数处理。也许我会得到一个更大的向量。然后你说，现在就在那个基础上做支持向量机，或者那样分开它们。这是另一种说法。所以，好的。所以你可以做些疯狂的事情。比如，你可以这样说，我想做二次判别。于是，你要设置一些看起来像这样和这样的不等式。这里的变量是P、Q和R。","start":1831.9,"end":1861.01}],"notes":["本段讲授了核方法的基本思想，即通过非线性函数将数据映射到高维空间，从而在该空间中使用线性方法进行分类。讲者提到，可以定义一个函数，使其在数据点附近为正或负，而在其他区域则无关紧要。这种函数可以是任意形式，如径向基函数（RBF）等。","讲者进一步指出，这种非线性映射可以视为特征工程的一种形式，即将原始数据通过某些函数转换为更高维的特征向量，从而使得线性分类器（如支持向量机）能够处理非线性问题。","讲者还提到，通过构造特定的不等式约束，可以实现二次判别分析（Quadratic Discriminant Analysis），其中变量P、Q、R是优化问题中的参数。","讲者强调，虽然这些不等式看起来可能涉及二次项，但实际变量是P、Q、R，而X是数据，因此这些不等式实际上是线性的。"],"formulas":[{"latex":"f(z) = \\theta^T \\text{basis functions}(z)","symbols":"f(z) 是通过基函数线性组合得到的函数，θ 是系数向量","explanation":"公式正确，表示通过基函数的线性组合来构造函数 f(z)，θ 是系数向量，符合线性组合的定义。","evidence":"And then theta is now a linear combination of basis functions. One of them, by the way, could be one. That would be a very common basis functions. And then what you want to do is you want to find these inequalities. Now this looks complicated, right? Because maybe somebody in these things, there's like sines, cosines, hyperbolic cosines. I mean, who knows what's in those? There's some weird things. I have no idea. Maybe those are like weird radial basis functions. It doesn't matter, right?"}],"uncertainties":["可能听不清的公式部分，如 'quadratic discrimination' 的具体形式"],"diagram":"none","start":1702.08,"end":1861.01,"asr_flags":[],"math_clarifications":["公式 1 是正确的，表示通过基函数的线性组合构造函数 f(z)，θ 是系数向量。公式 2 缺少上下文和明确的数学定义，无法核定其正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1702.08,"text":"You know, I mean, this is people in, I guess, in machine learning, you
