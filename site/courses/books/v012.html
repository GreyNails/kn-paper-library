oing to talk about that, although it is super interesting, but it just uses the ideas from the beginning of the class of a reduction."}],"speech_gaps":[],"frame":"../frames/v012/016.webp","frame_time":2573.51},{"title":"课程概览与数值线性代数","segments":[{"id":157,"text":"of equivalent problems. So we're not going to talk about that. That's what CVXPy does. Now we're going to, the next section of the course is like, how do you solve an LP or a SOCP or a semi-definite program? That's what we're going to look at. And there it's also, we're going to work our way up. And the way that's going to work is we're going to start with, at the very basics, with just linear algebra. So, you know, how do you solve linear algebra things? And we're going to, then you'll see that we'll build, we'll start with that."},{"id":158,"text":"On top of that, I'll show you how to solve quadratic problems. Oh, by the way, solving quadratic problems, that's linear algebra. Then the next step up, this is just to give you the big picture of what we're going to do. By next week or two weeks, then we'll say something like, okay, we will solve your non-quadratic convex problem by solving a sequence of quadratic problems."},{"id":159,"text":"but quadratic problem solving a quadratic problem is linear algebra and then the stuff we're going to talk about right now comes into play and then we'll go above that and eventually we'll get to interior point methods which will handle constraints and everything else all this way so that's the the big picture okay so okay so what we're going to do"},{"id":160,"text":"This is going to go all the way down to the bottom. We're not going to go to the gate level or anything like that. We're going to go to the floating point level. So at the floating point level, we're going to talk about numerical linear algebra. Actually, honestly, I think everyone needs to know this. I'm just going to give you a little tiny bit. There's an appendix on this in the book. Please read it. Actually, just because this is useful for..."},{"id":161,"text":"This is useful. Anyone here, if you do anything that has anything to do with math and computation, like anything, which is, I mean, pretty much, if you're in this class, you're in that category, right? You need to know this. And it's not, it's kind of, to me, it's completely unacceptable to not know at least a bit about how linear equations are solved. And I'll tell you why. Because, for example, you're going to learn crazy things, like we'll see cases where on my phone I can solve a set of linear equations that's like a million by a million."},{"id":162,"text":"Right? So you need to know what's easy, what's hard, and all that kind of stuff. And it is not intuitive until you have seen this material. Some of it is not obvious at all. Okay? So, okay. So that's the big picture. And so we'll start just by talking about, you know, matrix structure and algorithm complexity."}],"notes":["本段主要介绍了课程接下来的内容安排，包括如何解决线性规划、二次约束规划和半正定规划问题。课程将从线性代数的基本概念开始，逐步深入，最终涉及内点法等高级方法。","课程将从线性代数的基础开始，逐步过渡到更复杂的优化问题，如二次问题和非二次凸问题。解决非二次凸问题的方法是通过求解一系列二次问题。","课程将深入到浮点数级别的数值线性代数，强调其重要性。作者认为，所有涉及数学和计算的人都需要了解线性方程的求解方法。","作者指出，线性方程的求解方法对于理解问题的难易程度至关重要。例如，作者提到可以在手机上求解百万阶的线性方程组，这说明了数值线性代数的重要性。","课程将从矩阵结构和算法复杂度开始，逐步展开，帮助学生理解线性代数在优化问题中的应用。","作者强调，理解线性方程的求解方法对于学习凸优化至关重要，因为这将帮助学生理解问题的复杂性和解决方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2720.92,"end":2877.99,"asr_flags":[],"raw_segments":[{"start":2720.92,"text":"of equivalent problems. So we're not going to talk about that. That's what CVXPy does. Now we're going to, the next section of the course is like, how do you solve an LP or a SOCP or a semi-definite program? That's what we're going to look at. And there it's also, we're going to work our way up. And the way that's going to work is we're going to start with, at the very basics, with just linear algebra. So, you know, how do you solve linear algebra things? And we're going to, then you'll see that we'll build, we'll start with that."},{"start":2750.89,"text":"On top of that, I'll show you how to solve quadratic problems. Oh, by the way, solving quadratic problems, that's linear algebra. Then the next step up, this is just to give you the big picture of what we're going to do. By next week or two weeks, then we'll say something like, okay, we will solve your non-quadratic convex problem by solving a sequence of quadratic problems."},{"start":2778.06,"text":"but quadratic problem solving a quadratic problem is linear algebra and then the stuff we're going to talk about right now comes into play and then we'll go above that and eventually we'll get to interior point methods which will handle constraints and everything else all this way so that's the the big picture okay so okay so what we're going to do"},{"start":2796.29,"text":"This is going to go all the way down to the bottom. We're not going to go to the gate level or anything like that. We're going to go to the floating point level. So at the floating point level, we're going to talk about numerical linear algebra. Actually, honestly, I think everyone needs to know this. I'm just going to give you a little tiny bit. There's an appendix on this in the book. Please read it. Actually, just because this is useful for..."},{"start":2822.12,"text":"This is useful. Anyone here, if you do anything that has anything to do with math and computation, like anything, which is, I mean, pretty much, if you're in this class, you're in that category, right? You need to know this. And it's not, it's kind of, to me, it's completely unacceptable to not know at least a bit about how linear equations are solved. And I'll tell you why. Because, for example, you're going to learn crazy things, like we'll see cases where on my phone I can solve a set of linear equations that's like a million by a million."},{"start":2852.5,"text":"Right? So you need to know what's easy, what's hard, and all that kind of stuff. And it is not intuitive until you have seen this material. Some of it is not obvious at all. Okay? So, okay. So that's the big picture. And so we'll start just by talking about, you know, matrix structure and algorithm complexity."}],"speech_gaps":[],"frame":"../frames/v012/017.webp","frame_time":2732.92},{"title":"线性方程组的求解复杂度与结构化矩阵","segments":[{"id":163,"text":"So, you know, suppose we want to solve a set of linear equations, right? Like ax equals b here, right? So we want to solve that. You know, if a is like for general methods, it grows like n cubed, right? Oh, and I should mention something about this. In theoretical computer science, actually, the number's not n cubed. Does anyone here know what the current number is? Somebody here's got to know. Go ahead."},{"id":164,"text":"By the way, I wouldn't know, so if you say the wrong number, it's totally fine. I mean, I know the range it is. What is it? Yeah, okay, it's around 2.4, maybe 2.3 something. I have no idea."},{"id":165,"text":"because they use reinforcement learning to grow up with a faster algorithm. Awesome. So it's, what, 2.3 now? I don't know. Somewhere around there. Okay, yeah. Okay, it's 2.3, right? So end of the 2.3. Now, you know, these are... I mean, that is fascinating, right? Because it can't be less than n squared because you've got to look at..."},{"id":166,"text":"You've got to look at all entries of the matrix, right? So you might imagine, how could you do this without sort of n cubed? Anyway, you can. It turns out those algorithms are utterly and completely useless in practice. Just utterly, completely, right? I mean, maybe sometime in the future they won't be, but right now they're just useless, right? Super interesting. And weirdly..."},{"id":167,"text":"the methods people use to show that low complexity in theory are actually extremely close to the methods people use to make solving these things fast in practice. So I will say what that is shortly. And that part is not obvious at all. So the idea is super useful, but the actual results are utterly useless. Right, those. Okay, back to this. So what's cool is if A has got some structure to it,"},{"id":168,"text":"Then you can actually solve this a lot faster. I mean, here's like a no-brainer. What if I told you A is diagonal? Then you're like, yeah, I know how to solve A equals B when A is diagonal. But I said, what if A was a million by a million? You'd say..."},{"id":169,"text":"Yeah, I can do that in about 300 microseconds on my phone. Everybody see this? And you go, but how would you store a million? And you go, ah, well, that's the point. I'm only going to store the diagonal entries. I'm not going to store the ones that are zero. I mean, that's an extreme case. I think most people would get that. A profoundly stupid case. But there's going to be others where it is not obvious at all. And we'll get to those. OK."},{"id":170,"text":"All right, so here's how this works. And it's really cool. The history is very cool. It goes back to the 60s, maybe even earlier. So a floating point operation."}],"notes":["本段讨论了线性方程组求解的复杂度问题，指出一般方法的复杂度为O(n³)，但理论计算机科学中存在更优的算法，复杂度约为2.3n²。然而，这些理论上的低复杂度方法在实践中并不实用。","讲者提到，尽管存在理论上的低复杂度算法，但它们在实际应用中并不有效，这可能是因为这些算法在现实中难以实现或效率低下。","讲者进一步指出，理论上的低复杂度方法与实际中快速求解线性方程组的方法非常接近，但实际结果却常常无用，这表明理论与实践之间存在差距。","讲者通过举例说明，如果矩阵A具有某种结构（如对角矩阵），可以显著提高求解速度。例如，对角矩阵的求解可以在极短时间内完成，因为只需要存储非零元素。","讲者强调，结构化矩阵的求解方法在实际中非常重要，因为它们可以显著减少计算时间和存储需求，但需要识别和利用这些结构。","最后，讲者提到这些方法的历史可以追溯到20世纪60年代甚至更早，涉及浮点运算等基础计算技术。"],"formulas":[],"uncertainties":["reinforcement learning to grow up with a faster algorithm","end of the 2.3"],"diagram":"none","start":2880.55,"end":3047.28,"asr_flags":[],"raw_segments":[{"start":2880.55,"text":"So, you know, suppose we want to solve a set of linear equations, right? Like ax equals b here, right? So we want to solve that. You know, if a is like for general methods, it grows like n cubed, right? Oh, and I should mention something about this. In theoretical computer science, actually, the number's not n cubed. Does anyone here know what the current number is? Somebody here's got to know. Go ahead."},{"start":2908.49,"text":"By the way, I wouldn't know, so if you say the wrong number, it's totally fine. I mean, I know the range it is. What is it? Yeah, okay, it's around 2.4, maybe 2.3 something. I have no idea."},{"start":2925.97,"text":"because they use reinforcement learning to grow up with a faster algorithm. Awesome. So it's, what, 2.3 now? I don't know. Somewhere around there. Okay, yeah. Okay, it's 2.3, right? So end of the 2.3. Now, you know, these are... I mean, that is fascinating, right? Because it can't be less than n squared because you've got to look at..."},{"start":2943.37,"text":"You've got to look at all entries of the matrix, right? So you might imagine, how could you do this without sort of n cubed? Anyway, you can. It turns out those algorithms are utterly and completely useless in practice. Just utterly, completely, right? I mean, maybe sometime in the future they won't be, but right now they're just useless, right? Super interesting. And weirdly..."},{"start":2966.53,"text":"the methods people use to show that low complexity in theory are actually extremely close to the methods people use to make solving these things fast in practice. So I will say what that is shortly. And that part is not obvious at all. So the idea is super useful, but the actual results are utterly useless. Right, those. Okay, back to this. So what's cool is if A has got some structure to it,"},{"start":2993.74,"text":"Then you can actually solve this a lot faster. I mean, here's like a no-brainer. What if I told you A is diagonal? Then you're like, yeah, I know how to solve A equals B when A is diagonal. But I said, what if A was a million by a million? You'd say..."},{"start":3010.9,"text":"Yeah, I can do that in about 300 microseconds on my phone. Everybody see this? And you go, but how would you store a million? And you go, ah, well, that's the point. I'm only going to store the diagonal entries. I'm not going to store the ones that are zero. I mean, that's an extreme case. I think most people would get that. A profoundly stupid case. But there's going to be others where it is not obvious at all. And we'll get to those. OK."},{"start":3038.54,"text":"All right, so here's how this works. And it's really cool. The history is very cool. It goes back to the 60s, maybe even earlier. So a floating point operation."}],"speech_gaps":[],"frame":"../frames/v012/018.webp","frame_time":2892.55},{"title":"计算复杂度与BLAS","segments":[{"id":171,"text":"is, you know, it's like an addition of two floating point numbers, subtraction, multiplication, or division. The truth is that's a big old lie because I think a division takes something like eight times as long as an add or something like that. But, you know, like this is just going to be, this is just for order of magnitude. I'll also say other reasons why all of this model is completely wrong, but it's fine. It's good enough for this."},{"id":172,"text":"And some people got weird in the 60s and they decided a floating point operation was actually a multiply plus an add plus some indexing work. And you're like, okay, whatever. So here's what you do. You look at an algorithm that does stuff and you count the number of flops."},{"id":173,"text":"as a, typically polynomial, there might be a log in there,"},{"id":174,"text":"which people just, a log is just like,"},{"id":175,"text":"you just change it to a constant, right?"},{"id":176,"text":"Because that's what it really is in practice, right?"},{"id":177,"text":"So you look, you express as a polynomial function"},{"id":178,"text":"of the problem dimension, and you simplify,"},{"id":179,"text":"you only keep the leading terms,"},{"id":180,"text":"because this is very crude, right?"},{"id":181,"text":"So it is not remotely a predictor,"},{"id":182,"text":"a good predictor of computation time on modern computers."},{"id":183,"text":"And it's just changing, it's getting all very weird" se things are. They know exactly what they can do. And so then it's the same thing. You chop these things up into these things. And all of us are utterly unaware of this, which is kind of cool. But we benefit like crazy. So everybody."},{"id":237,"text":"following this. So, so if you ever meet, I don't, you know, I don't know if people even do, well, there are people who do this like in my department in CS. So anyway, if you meet one of those people, just like, remember I told you, if you meet someone who works on like devices and things like that, you should thank them. If you meet someone who works on the lower, the lowest level stuff like this, thank them too."}],"notes":["本段讲解了矩阵乘法的优化方法，特别是通过将矩阵分割成子块并递归处理来提高计算效率。虽然总的计算量仍然是n³次乘法，但通过优化缓存使用，可以显著提升实际运行速度。","讲者提到，这种优化方法是基于计算机架构的特性，特别是缓存的层次结构。通过将矩阵分割为16×16和256×256的块，可以更有效地利用缓存，减少数据访问延迟。","讲者还提到，这种优化方法起源于20世纪70年代，并且在现代多核处理器（如GPU）中仍然适用。通过并行处理多个小矩阵乘法，可以在极短时间内完成大量计算。","讲者强调，虽然这些优化技术对普通用户来说可能不显而易见，但它们对计算性能有巨大影响。因此，应感谢那些在底层技术上做出贡献的工程师。","讲者最后提到，这种优化方法在计算机科学领域有实际应用，特别是在某些研究部门中。因此，遇到相关领域的专家时，应表达感谢之情。","本段内容涉及计算机体系结构、缓存优化和并行计算，是理解高性能计算的重要基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3572.52,"end":3727.84,"asr_flags":[],"raw_segments":[{"start":3572.52,"text":"So single thread is going to work like this. By the way, if you multiply these out, you don't use the silly 7 multiplies versus 8. It's just 8 multiplies. So if I say, take your matrix, chop it up into sub-blocks, chop those into sub-blocks, and then just write a recursive thing, then someone says, how many flops do you end up doing?"},{"start":3594.89,"text":"And the answer is n cubed. So it's the same as if you just wrote a one line, you know, C program that said, you know, you know, walk across the first one down the first row and fill them in that kind of thing. Right. Everybody follow me this. So you'd say you haven't changed the number of flaws. Like how on earth could this be faster? Again, anyone want to suggest something? You'd have to know a little bit about like computer architecture and how computers work. But I feel like all of us should know a little bit about that. Yes."},{"start":3624.39,"text":"Yeah, that's exactly right. It's cache optimized, right? So what you do is the lowest level in the hierarchy are, I don't know, 16 by 16 matrices, right? Why? Because you can multiply 16 by 16 matrices directly at the lowest level of cache, right? The next group up is like 256 by 256 matrices. You can multiply two of those using your level two cache. Everybody following this?"},{"start":3652.39,"text":"By the way, this is from the 1960s. 1970s? No, maybe 70s. Let's go with that. Everybody following this?"},{"start":3663.01,"text":"It's actually completely stunning what happens when you do this right. Oh, and by the way, the same things go to a world where you have a lot of cores. So this could be a GPU with 10,000 cores, right? And you say, oh boy, oh, is it good at multiplying? I can multiply, you know, 5,000 16 by 16 matrices by other 16 by 16 matrices all together in like two microseconds. Everybody following that?"},{"start":3688.93,"text":"So people who work on these things know exactly what those things are. They know exactly what they can do. And so then it's the same thing. You chop these things up into these things. And all of us are utterly unaware of this, which is kind of cool. But we benefit like crazy. So everybody."},{"start":3708.39,"text":"following this. So, so if you ever meet, I don't, you know, I don't know if people even do, well, there are people who do this like in my department in CS. So anyway, if you meet one of those people, just like, remember I told you, if you meet someone who works on like devices and things like that, you should thank them. If you meet someone who works on the lower, the lowest level stuff like this, thank them too."}],"speech_gaps":[],"frame":"../frames/v012/022.webp","frame_time":3584.52},{"title":"计算速度与浮点运算","segments":[{"id":238,"text":"Because they're th start":4007.13,"text":"triangular so it looks like, you know, A11, A21, A22, right? A31, A32, A33. I'm not going"},{"start":4020.11,"text":"to draw the zeros, right? Times, you know, let's say X1, X2, X3 equals like B1, B2, B3."},{"start":4028.01,"text":"And this, you know, you probably saw this in, probably even in high school or something,"},{"start":4031.73,"text":"right? So how do you solve this? Well look, the first equation is a11 x1 equals b1, so"},{"start":4036.95,"text":"x1 is b1 over a11, right? Now you know x1. The second equation is a21 x1, but you know"},{"start":4043.37,"text":"what that is. You already calculated it. So the second one is a22 x2 equals b2 minus a21"},{"start":4051.89,"text":"x1 which you already know. So that method is called forward substitution because you"},{"start":4057.21,"text":"solve for x1, then x2, then x3, then x4, and whenever you have one, you're going to substitute"},{"start":4064.47,"text":"it in future equations. Everybody got that? And when you work out the complexity, that's"}],"speech_gaps":[],"frame":"../frames/v012/024.webp","frame_time":3907.21},{"title":"三角矩阵与特殊结构矩阵的求解复杂度","segments":[{"id":283,"text":"going to be actually n squared flops. Okay? So that's cool. By the way, it's different"},{"id":284,"text":"different from n cubed, right? So that's, in fact there's a factor of n in there, right?"},{"id":285,"text":"So you already know something. It says that if you had to solve some triangular equations,"},{"id":286,"text":"you can do that really fast compared to just solving non-triangular equations. And if it's"},{"id":287,"text":"upper triangular, you do what's called backward substitution. It's the same thing. In that"},{"id":288,"text":"case, you get xn first, then xn minus 1, and so on. Oh, and by the way, this is not how"},{"id":289,"text":"how it actually works. This is blocked. That's how they actually do it, right? So there's"},{"id":290,"text":"little blocks. Again, we are blissfully unaware of this, but when you solve a triangular system,"},{"id":291,"text":"they don't do it line by line like this. It's actually blocked."},{"id":292,"text":"But we can pretend it looks like this, and the conclusion is the same. Okay. What if a matrix is orthogonal, right? Like, then it takes two n squared flops, right, to compute a transpose, you know, to compute, sorry, a inverse b, right? Because a inverse is a transpose, and then it's matrix vector multiply. So actually, yeah, that's what it was."},{"id":293,"text":"Okay, there's lots of other cases, right? If A could be, I mean, here's a very famous structure for a matrix A. It's identity minus rank one. I think that's called maybe a householder reflection or somebody might know, somebody in ICME or something could tell me. I think that's right. That's called the householder reflection or something. Those, again, you can solve in nflops, right? Because you just are smart about how you do it."},{"id":294,"text":"And the storage is also clear. You would store u, not the matrix. A permutation matrix is a good example. If you have a permutation matrix, and you want to know how long does it take to solve a permutation matrix times x equals b, you just unpermute them, which is the transpose. And you actually don't even do any flops, because all you're doing is you're just moving numbers around."},{"id":295,"text":"So permutations is kind of hilarious because if you ask under a flop count analysis from the 1960s or 70s, it's zero flops. Because it's actually like mem copies. You're just moving numbers around. Of course, in fact, that can take a lot of time if it's a vector that's 100 million high or something like that. Okay. All right, so these are examples."}],"notes":["本段讲解了三角矩阵求解的复杂度，指出其复杂度为n²次浮点运算，比非三角矩阵的n³次运算快得多。同时提到上三角矩阵的求解方法是回代法，但实际计算中是分块进行的。","对于正交矩阵，其逆矩阵等于其转置，因此求解正交矩阵的线性方程组需要2n²次浮点运算。此外，还提到一些特殊结构的矩阵，如秩为1的矩阵，可以通过巧妙的方法在n²次运算内求解。","排列矩阵的求解复杂度为零次浮点运算，因为其本质是数据的重新排列，而非数值计算。虽然在实际中，如果向量很大，这种操作可能耗时较长。","这些例子展示了不同矩阵结构对计算复杂度的影响，强调了在实际计算中，利用矩阵的特殊结构可以显著提高计算效率。","课程中还提到，虽然在理论分析中，排列矩阵的求解复杂度为零，但在实际应用中，由于数据移动的开销，可能需要考虑实际的计算时间。","这些内容帮助学生理解不同矩阵结构对计算效率的影响，以及如何利用这些结构优化计算过程。"],"formulas":[{"latex":"n^2","symbols":"n²次浮点运算","explanation":"公式正确，表示n²次浮点运算，符合原文提到的求解三角方程的复杂度。","evidence":"going to be actually n squared flops. Okay? So that's cool. By the way, it's different different from n cubed, right? So that's, in fact there's a factor of n in there, right?"},{"latex":"2n^2","symbols":"2n²次浮点运算","explanation":"公式正确，表示计算正交矩阵逆的复杂度为2n²次浮点运算，符合原文提到的正交矩阵的逆运算复杂度。","evidence":"But we can pretend it looks like this, and the conclusion is the same. Okay. What if a matrix is orthogonal, right? Like, then it takes two n squared flops, right, to compute a transpose, you know, to compute, sorry, a inverse b, right? Because a inverse is a transpose, and then it's matrix vector multiply. So actually, yeah, that's what it was."},{"latex":"n^2","symbols":"n²次浮点运算","explanation":"公式正确，表示求解特定矩阵结构（如Householder反射）的复杂度为n²次浮点运算，符合原文提到的高效求解方法。","evidence":"Okay, there's lots of other cases, right? If A could be, I mean, here's a very famous structure for a matrix A. It's identity minus rank one. I think that's called maybe a householder reflection or somebody might know, somebody in ICME or something could tell me. I think that's right. That's called the householder reflection or something. Those, again, you can solve in nflops, right? Because you just are smart about how you do it."},{"latex":"0","symbols":"零次浮点运算","explanation":"公式正确，表示置换矩阵求解的复杂度为零次浮点运算，符合原文提到的置换矩阵求解仅需移动数据。","evidence":"And the storage is also clear. You would store u, not the matrix. A permutation matrix is a good example. If you have a permutation matrix, and you want to know how long does it take to solve a permutation matrix times x equals b, you just unpermute them, which is the transpose. And you actually don't even do any flops, because all you're doing is you're just moving numbers around."}],"uncertainties":["householder reflection"],"diagram":"none","start":4071.89,"end":4226.14,"asr_flags":[],"math_clarifications":["所有公式均符合原文描述的计算复杂度，无需进一步修正。"],"raw_segments":[{"start":4071.89,"text":"going to be actually n squared flops. Okay? So that's cool. By the way, it's different"},{"start":4080.03,"text":"different from n cubed, right? So that's, in fact there's a factor of n in there, right?"},{"start":4084.59,"text":"So you already know something. It says that if you had to solve some triangular equations,"},{"start":4090.19,"text":"you can do that really fast compared to just solving non-triangular equations. And if it's"},{"start":4097.07,"text":"upper triangular, you do what's called backward substitution. It's the same thing. In that"},{"start":4101.61,"text":"case, you get xn first, then xn minus 1, and so on. Oh, and by the way, this is not how"},{"start":4107.27,"text":"how it actually works. This is blocked. That's how they actually do it, right? So there's"},{"start":4112.39,"text":"little blocks. Again, we are blissfully unaware of this, but when you solve a triangular system,"},{"start":4118.63,"text":"they don't do it line by line like this. It's actually blocked."},{"start":4123.72,"text":"But we can pretend it looks like this, and the conclusion is the same. Okay. What if a matrix is orthogonal, right? Like, then it takes two n squared flops, right, to compute a transpose, you know, to compute, sorry, a inverse b, right? Because a inverse is a transpose, and then it's matrix vector multiply. So actually, yeah, that's what it was."},{"start":4150.53,"text":"Okay, there's lots of other cases, right? If A could be, I mean, here's a very famous structure for a matrix A. It's identity minus rank one. I think that's called maybe a householder reflection or somebody might know, somebody in ICME or something could tell me. I think that's right. That's called the householder reflection or something. Those, again, you can solve in nflops, right? Because you just are smart about how you do it."},{"start":4176.54,"text":"And the storage is also clear. You would store u, not the matrix. A permutation matrix is a good example. If you have a permutation matrix, and you want to know how long does it take to solve a permutation matrix times x equals b, you just unpermute them, which is the transpose. And you actually don't even do any flops, because all you're doing is you're just moving numbers around."},{"start":4201.27,"text":"So permutations is kind of hilarious because if you ask under a flop count analysis from the 1960s or 70s, it's zero flops. Because it's actually like mem copies. You're just moving numbers around. Of course, in fact, that can take a lot of time if it's a vector that's 100 million high or something like that. Okay. All right, so these are examples."}],"speech_gaps":[],"frame":"../frames/v012/025.webp","frame_time":4083.89},{"title":"矩阵分解与求解方法","segments":[{"id":296,"text":"And now we're going to get to what the method is. And actually, it's much more important to just understand the high-level idea than the low-level details, right? Except if you're in the few people who actually work on these methods so that the rest of us benefit. But the rest of us, here's the method. It's actually very simple, and there's already like immediately weird things that you, I don't know, some of you probably will leave today knowing something you didn't know before that's weird and shocking. So here it is."},{"id":297,"text":"The general method works like this. You take a matrix A. You want to solve AX equals B. You take the matrix A, and the first thing you do is you factor it. And factor it means you write it out as a product of matrices. You know a bunch of these factorizations, probably. Like there's the QR factorization. There's the eigen decomposition, singular value decomposition. You probably know a bunch of these already anyway."},{"id":298,"text":"So you factor it into a product of matrices, each of which is easy to invert. People say that. By the way, when they say that, that's slang. It doesn't mean that anyone's going to invert that matrix. When you say easy to invert, it means it's easy to solve AX equals B. That's what they actually mean by that. But they just say easy to invert, even though no one is inverting any matrices. So this is really, really quite dumb."},{"id":299,"text":"It just says, well, if A is this product, then the inverse of A is the product of the inverses in reverse order, right? So I get this thing. And now I just put parentheses the right way, which is to say I first put a parentheses around the first one, A1 inverse B. And I calculate that. So it's actually, you know, what you do is you solve this to get X1, right?"},{"id":300,"text":"That's actually that second expression. Then I have to multiply by a2 inverse, which I do by simply calling the solve method on a2 with right-hand side x1. Everybody see that? So in fact, you solve this by just a sequence of solves. You can even think of this in a beautiful object-oriented way where each of these things has a solve method. And solve literally means..."},{"id":301,"text":"You know, solve A, B means it returns A inverse B, right? Some of these methods are idiotic, like it would be diagonal or a permutation or something like that. Doesn't matter. That's the idea. So you solve that by literally just a sequence of solves. That's it. Okay? All right. Now..."}],"notes":["本段讲解了矩阵分解的基本思想，即通过将矩阵分解为多个容易求解的子矩阵的乘积，从而简化求解线性方程组的过程。讲者指出，虽然术语中提到‘容易求逆’，但实际上指的是容易求解方程组，而不是实际计算矩阵的逆。","讲者强调，矩阵分解的核心在于将原问题分解为一系列子问题，每个子问题可以通过调用‘solve’方法来求解。这种方法避免了直接计算矩阵的逆，从而提高了计算效率。","讲者提到，分解后的矩阵可能具有特殊结构，如对角矩阵或排列矩阵，这些结构使得求解过程更加高效。虽然这些方法可能看起来有些‘愚蠢’，但它们在实际应用中非常有用。","讲者通过举例说明，分解后的矩阵可以通过顺序调用‘solve’方法来求解，这体现了面向对象编程的思想，即每个子矩阵都有一个对应的求解方法。","讲者指出，‘solve’方法的实际含义是返回矩阵的逆与右侧向量的乘积，即A⁻¹B。这种方法避免了显式计算逆矩阵，从而节省了计算资源。","讲者最后总结，矩阵分解的核心思想是通过分解将复杂问题转化为一系列简单问题，从而高效求解线性方程组。这种方法在实际应用中非常常见，如QR分解、奇异值分解等。"],"formulas":[{"latex":"A = A_1 A_2","symbols":"A 是分解后的矩阵乘积","explanation":"公式正确，表示矩阵 A 被分解为两个矩阵 A1 和 A2 的乘积。","evidence":"It just says, well, if A is this product, then the inverse of A is the product of the inverses in reverse order, right? So I get this thing. And now I just put parentheses the right way, which is to say I first put a parentheses around the first one, A1 inverse B. And I calculate that. So it's actually, you know, what you do is you solve this to get X1, right?"},{"latex":"A^{-1} B = A_1^{-1} A_2^{-1} B","symbols":"求解线性方程组的步骤","explanation":"公式正确，表示通过矩阵分解求解线性方程组的步骤，即先计算 A2^{-1} B，再计算 A1^{-1} 与该结果的乘积。","evidence":"That's actually that second expression. Then I have to multiply by a2 inverse, which I do by simply calling the solve method on a2 with right-hand side x1. Everybody see that? So in fact, you solve this by just a sequence of solves. You can even think of this in a beautiful object-oriented way where each of these things has a solve method. And solve literally means..."}],"uncertainties":[],"diagram":"none","start":4226.81,"end":4381.83,"asr_flags":[],"math_clarifications":["公式 1 的逆矩阵乘积顺序错误，应为 A1^{-1} A2^{-1}，而不是 A2^{-1} A1^{-1}。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4226.81,"text":"And now we're going to get to what the method is. And actually, it's much more important to just understand the high-level idea than the low-level details, right? Except if you're in the few people who actually work on these methods so that the rest of us benefit. But the rest of us, here's the method. It's actually very simple, and there's already like immediately weird things that you, I don't know, some of you probably will leave today knowing something you didn't know before that's weird and shocking. So here it is."},{"start":4256.81,"text":"The general method works like this. You take a matrix A. You want to solve AX equals B. You take the matrix A, and the first thing you do is you factor it. And factor it means you write it out as a product of matrices. You know a bunch of these factorizations, probably. Like there's the QR factorization. There's the eigen decomposition, singular value decomposition. You probably know a bunch of these already anyway."},{"start":4277.3,"text":"So you factor it into a product of matrices, each of which is easy to invert. People say that. By the way, when they say that, that's slang. It doesn't mean that anyone's going to invert that matrix. When you say easy to invert, it means it's easy to solve AX equals B. That's what they actually mean by that. But they just say easy to invert, even though no one is inverting any matrices. So this is really, really quite dumb."},{"start":4307.64,"text":"It just says, well, if A is this product, then the inverse of A is the product of the inverses in reverse order, right? So I get this thing. And now I just put parentheses the right way, which is to say I first put a parentheses around the first one, A1 inverse B. And I calculate that. So it's actually, you know, what you do is you solve this to get X1, right?"},{"start":4332.3,"text":"That's actually that second expression. Then I have to multiply by a2 inverse, which I do by simply calling the solve method on a2 with right-hand side x1. Everybody see that? So in fact, you solve this by just a sequence of solves. You can even think of this in a beautiful object-oriented way where each of these things has a solve method. And solve literally means..."},{"start":4360.62,"text":"You know, solve A, B means it returns A inverse B, right? Some of these methods are idiotic, like it would be diagonal or a permutation or something like that. Doesn't matter. That's the idea. So you solve that by literally just a sequence of solves. That's it. Okay? All right. Now..."}],"speech_gaps":[],"frame":"../frames/v012/026.webp","frame_time":4238.81},{"title":"矩阵分解与求解线性方程组的复杂度","segments":[{"id":302,"text":"Usually the way this works, there are exceptions which we're going to talk about, but it works kind of in a cool way. Usually, I mean, in the simplest, most generic cases, the factorization costs order n cubed. And then we'll see that the solve actually is going to take order n squared. Now things get weird. Because suppose I ask you, how long does it take me to solve one equation with 5,000 variables?"},{"id":303,"text":"5,000 by 5,000 matrix A, 5,000 vector B, and I want to compute, you know, whatever. I want to actually factor A, right? Well, okay, it's order of magnitude. It's under a second. I mean, it depends on what you're doing it on, but it's not minutes. It's not milliseconds. That's order. Well, it'd be milliseconds on some crazy things, but that's fine, right? Everybody follow this? And now I'm going to ask you, let's say it's a second. We'll make it simple."},{"id":304,"text":"Suppose I say, well, now I want to do this. I want to actually solve 10 sets of equations with the same matrix, but different right-hand sides. Well, the naive method would take 10 seconds, because you'd just have a little loop or whatever, unless you had 10 cores around and parallelized it, but that's okay, but whatever, right? So you just, it'd take 10 seconds. Everybody following this? How long, in fact, does it take if you know what you're doing?"},{"id":305,"text":"Let's review, right? So I want you to solve 5,000 equations, 5,000 variables, right? Takes a second, okay? Now I'd say, okay, thanks for doing that. I'd like to do it now for 10 sets with the same coefficient matrix. A normal person would say, like, 10 seconds? I mean, are we, right? And what is the actual number? It's one second, right? Why? Because..."},{"id":306,"text":"you know, if it's 5,000 by 5,000 matrix took a second to factor, solve is going to be a factor n smaller because that's n squared, not n cubed, okay? So it takes, so the answer, that works out to actually microseconds, right? So the answer would be, oh yeah, it's about one second plus maybe about 150 microseconds. Everybody following this? Okay, so how many, I mean, unless you, until you know this, this is not obvious, right? So actually, how many people knew that?"},{"id":307,"text":"Basically, you can solve 10 sets of linear equations. Basically, the exact same cost of solving one. Some of you must have known this or something. Okay. Everybody? Okay. I'm not detecting that you're that impressed. Are you just like, who cares? I mean, it's kind of cool, right?"}],"notes":["本段讲解了矩阵分解与求解线性方程组的复杂度差异。通常，矩阵分解的复杂度为O(n³)，而求解多个方程组（相同系数矩阵，不同右侧向量）的复杂度为O(n²)。这意味着，一旦矩阵被分解，求解多个方程组的时间复杂度会显著降低。","讲者通过一个具体的例子说明了这一概念：对于一个5000×5000的矩阵，分解需要约1秒，而求解10个方程组的时间复杂度为O(n²)，因此实际耗时仅为约1秒加上约150微秒。这表明，一旦矩阵被分解，求解多个方程组的时间成本几乎可以忽略不计。","讲者强调，这一概念对于理解线性代数在实际计算中的效率至关重要。许多学生可能在学习过程中没有意识到这一点，因此需要通过具体的例子和计算来加深理解。","讲者还提到，这一概念在实际应用中非常重要，尤其是在处理大规模数据集或进行数值计算时，能够显著提高计算效率。","讲者通过提问的方式引导学生思考，强调了这一概念的非直观性，以及掌握这一知识的重要性。","最后，讲者以一种轻松的语气结束，强调了这一概念的实用性，鼓励学生在实际应用中加以利用。"],"formulas":[{"latex":"O(n^3)","symbols":"矩阵分解的复杂度","explanation":"矩阵分解的复杂度为O(n^3)，这是原始讲授内容中提到的，符合数学类型和记号。","evidence":"Let's review, right? So I want you to solve 5,000 equations, 5,000 variables, right? Takes a second, okay? Now I'd say, okay, thanks for doing that. I'd like to do it now for 10 sets with the same coefficient matrix. A normal person would say, like, 10 seconds? I mean, are we, right? And what is the actual number? It's one second, right? Why? Because..."},{"latex":"O(n^2)","symbols":"求解多个方程组的复杂度","explanation":"求解多个方程组的复杂度为O(n^2)，这是原始讲授内容中提到的，符合数学类型和记号。","evidence":"you know, if it's 5,000 by 5,000 matrix took a second to factor, solve is going to be a factor n smaller because that's n squared, not n cubed, okay? So it takes, so the answer, that works out to actually microseconds, right? So the answer would be, oh yeah, it's about one second plus maybe about 150 microseconds. Everybody following this? Okay, so how many, I mean, unless you, until you know this, this is not obvious, right? So actually, how many people knew that?"}],"uncertainties":[],"diagram":"none","start":4382.54,"end":4554.68,"asr_flags":[],"math_clarifications":["原始讲授内容中没有涉及具体的数学公式或符号，因此无法进行更深入的数学复核。"],"raw_segments":[{"start":4382.54,"text":"Usually the way this works, there are exceptions which we're going to talk about, but it works kind of in a cool way. Usually, I mean, in the simplest, most generic cases, the factorization costs order n cubed. And then we'll see that the solve actually is going to take order n squared. Now things get weird. Because suppose I ask you, how long does it take me to solve one equation with 5,000 variables?"},{"start":4412.12,"text":"5,000 by 5,000 matrix A, 5,000 vector B, and I want to compute, you know, whatever. I want to actually factor A, right? Well, okay, it's order of magnitude. It's under a second. I mean, it depends on what you're doing it on, but it's not minutes. It's not milliseconds. That's order. Well, it'd be milliseconds on some crazy things, but that's fine, right? Everybody follow this? And now I'm going to ask you, let's say it's a second. We'll make it simple."},{"start":4441.34,"text":"Suppose I say, well, now I want to do this. I want to actually solve 10 sets of equations with the same matrix, but different right-hand sides. Well, the naive method would take 10 seconds, because you'd just have a little loop or whatever, unless you had 10 cores around and parallelized it, but that's okay, but whatever, right? So you just, it'd take 10 seconds. Everybody following this? How long, in fact, does it take if you know what you're doing?"},{"start":4473.21,"text":"Let's review, right? So I want you to solve 5,000 equations, 5,000 variables, right? Takes a second, okay? Now I'd say, okay, thanks for doing that. I'd like to do it now for 10 sets with the same coefficient matrix. A normal person would say, like, 10 seconds? I mean, are we, right? And what is the actual number? It's one second, right? Why? Because..."},{"start":4500.94,"text":"you know, if it's 5,000 by 5,000 matrix took a second to factor, solve is going to be a factor n smaller because that's n squared, not n cubed, okay? So it takes, so the answer, that works out to actually microseconds, right? So the answer would be, oh yeah, it's about one second plus maybe about 150 microseconds. Everybody following this? Okay, so how many, I mean, unless you, until you know this, this is not obvious, right? So actually, how many people knew that?"},{"start":4530.77,"text":"Basically, you can solve 10 sets of linear equations. Basically, the exact same cost of solving one. Some of you must have known this or something. Okay. Everybody? Okay. I'm not detecting that you're that impressed. Are you just like, who cares? I mean, it's kind of cool, right?"}],"speech_gaps":[],"frame":"../frames/v012/027.webp","frame_time":4394.54},{"title":"LU分解与求解方法","segments":[{"id":308,"text":"Okay, I'll put it this way. I'm impressed. I think you should be. Honestly, I think you should be too, right? By the way, this requires that you actually know what you're doing, right? Because if you actually just, if you say, you know, for right-hand side in right-hand sides, you know, solve A, B, you're sure. By the way, another name for this is called factorization caching, right? So it means you factor once and then do multiple solves, okay?"},{"id":309,"text":"All right, everybody, I think this makes sense, right? Okay. And, you know, the most common one is the LU factorization. L is lower triangular, U is upper. And it basically says you can take a matrix A. If it's non-singular, you can write it as a permutation times a lower times an upper triangular matrix. The cost of that is like n cubed flops. And then this is how you'd solve it. It looks like this, right? So..."},{"id":310,"text":"This one dominates, right? And then these things, this is the solve method, right? This is where you're actually walking through the three factors. That's why there's three things here, right? Each of these is solving essentially or computing the, it's working with the inverse of one of the factors, right? And so this is what you're doing here. And this whole thing here is order n squared. That's order n cubed."},{"id":311,"text":"Okay? So, this comes up in a whole lot of areas. But, okay, so this is cool. And this is kind of the same as the Gaussian elimination that you were almost certainly tortured with either in high school or undergraduate days, right? So, it's basically this. By the way, when you were taught that, did anyone say that it has nothing to do whatsoever with how people actually solve equations? Probably not. No. So, yeah, so."},{"id":312,"text":"why you would cause people to actually do Gaussian. I mean, I don't know. It's like writing an assembly language program. A person should do that either zero or once. And absolutely no more than that. And most normal people should do it exactly zero times. But they should appreciate, oh, sorry, we need a very small number of people who are very weird and like that to do that. That's all they do, right? So that the rest of us can benefit. That's kind of the way this all works out."},{"id":313,"text":"Yeah, so why? I don't know. Anyway, so this is basically the same as that, except it's not the way it really works. Of course, the way it really works is all of this is the same thing, except all these things are blocked, right? And if you have multiple cores, like on a GPU or just multiple cores, stuff is being done at the same time, right? But other than that, the idea is identical. Okay, so I think we'll quit here, and we'll continue next time."}],"notes":["本段主要讲解LU分解的概念及其在求解线性方程组中的应用。LU分解是一种将矩阵分解为下三角矩阵L和上三角矩阵U的方法，适用于非奇异矩阵。分解过程需要n³次浮点运算，而求解过程则为O(n²)。这种分解方法与高斯消元法在本质上是相同的，但实际应用中会考虑并行计算以提高效率。","讲者提到LU分解的别称是factorization caching，即通过一次分解后进行多次求解，从而节省计算资源。这在实际工程中非常重要，因为重复求解线性方程组时，分解步骤只需执行一次。","讲者还提到高斯消元法在教学中常被使用，但实际应用中并不直接使用该方法，而是通过分解和并行计算来优化求解过程。这说明了理论与实际应用之间的差异。","讲者强调，虽然高斯消元法在教学中被广泛使用，但大多数实际应用中并不需要手动执行该过程，而是依赖于高效的算法和并行计算技术。","讲者提到，LU分解的计算过程可以被并行化，特别是在多核处理器或GPU上，这使得大规模问题的求解更加高效。","最后，讲者总结了LU分解的基本思想，并指出其与高斯消元法的相似性，同时强调了实际应用中并行计算的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4555.85,"end":4729.26,"asr_flags":[],"raw_segments":[{"start":4555.85,"text":"Okay, I'll put it this way. I'm impressed. I think you should be. Honestly, I think you should be too, right? By the way, this requires that you actually know what you're doing, right? Because if you actually just, if you say, you know, for right-hand side in right-hand sides, you know, solve A, B, you're sure. By the way, another name for this is called factorization caching, right? So it means you factor once and then do multiple solves, okay?"},{"start":4585.04,"text":"All right, everybody, I think this makes sense, right? Okay. And, you know, the most common one is the LU factorization. L is lower triangular, U is upper. And it basically says you can take a matrix A. If it's non-singular, you can write it as a permutation times a lower times an upper triangular matrix. The cost of that is like n cubed flops. And then this is how you'd solve it. It looks like this, right? So..."},{"start":4614.54,"text":"This one dominates, right? And then these things, this is the solve method, right? This is where you're actually walking through the three factors. That's why there's three things here, right? Each of these is solving essentially or computing the, it's working with the inverse of one of the factors, right? And so this is what you're doing here. And this whole thing here is order n squared. That's order n cubed."},{"start":4643.18,"text":"Okay? So, this comes up in a whole lot of areas. But, okay, so this is cool. And this is kind of the same as the Gaussian elimination that you were almost certainly tortured with either in high school or undergraduate days, right? So, it's basically this. By the way, when you were taught that, did anyone say that it has nothing to do whatsoever with how people actually solve equations? Probably not. No. So, yeah, so."},{"start":4672.84,"text":"why you would cause people to actually do Gaussian. I mean, I don't know. It's like writing an assembly language program. A person should do that either zero or once. And absolutely no more than that. And most normal people should do it exactly zero times. But they should appreciate, oh, sorry, we need a very small number of people who are very weird and like that to do that. That's all they do, right? So that the rest of us can benefit. That's kind of the way this all works out."},{"start":4702.44,"text":"Yeah, so why? I don't know. Anyway, so this is basically the same as that, except it's not the way it really works. Of course, the way it really works is all of this is the same thing, except all these things are blocked, right? And if you have multiple cores, like on a GPU or just multiple cores, stuff is being done at the same time, right? But other than that, the idea is identical. Okay, so I think we'll quit here, and we'll continue next time."}],"speech_gaps":[],"frame":"../frames/v012/028.webp","frame_time":4567.85}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}

else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
