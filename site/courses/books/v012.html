describe this as kernel methods, but we could just do this, right? You know, suppose you want to separate two points by some nonlinear function, right? Now, of course, there's a gazillion functions that separate two sets of points, because I could actually define a function that's positive right around each of our x's."},{"start":1724.23,"text":"negative around each of our y's, right? And then I don't even care what it is anywhere else. It doesn't matter. It's a half. I don't care. Or zero. It doesn't make any difference, right? That's silly. You want, so, I mean, you want some family of functions or whatever to regularize your choices. And so, you know, you could do things like this. We can make, so f of z contains these basis functions."},{"start":1748.33,"text":"And then theta is now a linear combination of basis functions. One of them, by the way, could be one. That would be a very common basis functions. And then what you want to do is you want to find these inequalities. Now this looks complicated, right? Because maybe somebody in these things, there's like sines, cosines, hyperbolic cosines. I mean, who knows what's in those? There's some weird things. I have no idea. Maybe those are like weird radial basis functions. It doesn't matter, right?"},{"start":1775.73,"text":"So, but it's looking, it'd make you nervous. But the point is that's data. And so these are actually, these are just vectors. They're just constant vectors. And it's exactly the same. It's exactly the same problem, right? So, okay, that makes sense. Maybe an even simpler interpretation of this is even better and really dumb. You think of this as, I would think of this as feature engineering."},{"start":1802.09,"text":"which is like, thanks for your Xs, thanks for your Ys. I'm going to put them through some functions. Maybe I get a bigger vector. And you say, now just do support vector machine on that or separate them that way. That's another way to say it. So, okay. So you can do crazy stuff. Like you could say, I want to do quadratic, I do want to do quadratic discrimination. So to do that, you set up inequalities that look like this and this. And the variables here are P, Q, and R."},{"start":1831.9,"text":"What kind of inequality is this and this in P, Q, and R? Yeah, they're linear, right? Because the left-hand side is actually linear in the triple P, Q, R, right? I mean, and you have to get used to this because you see X transpose P, X, and you immediately want to ask, you know, it sounds, it looks, it is quadratic in X, I, but X, I is data, so it's not a variable. Your variable is P, right?"}],"speech_gaps":[],"frame":"../frames/v012/011.webp","frame_time":1714.08},{"title":"使用椭球和多项式分离数据","segments":[{"id":105,"text":"That sort of and you could do crazy stuff like you could say, you know what? I want to see if I can separate some data by an ellipsoid. Right, and that would just be that would end up being an SDP. You'd have an inequality constraint. You'd have a matrix inequality constraint on P something like that, right? And this would be like a separation by an ellipsoid. Somebody want to name a useful","zh":"那种情况，你可以做一些疯狂的事情，比如，你知道吗？我想看看是否可以用椭球来分离一些数据。对的，这将会是一个半正定规划问题。你会有一个不等式约束。你会有一个关于矩阵P的矩阵不等式约束，对吧？这将是通过椭球进行分离。有人想给这个方法起个有用的名字吗？","start":1862.43,"end":1891.17},{"id":106,"text":"A use for that? I give you a bunch of data. Some is, let's say, maybe these are like good outcomes or something. Maybe these are bad ones. So anybody want to... Location. What's that? Location. Yeah, maybe it could be... Yeah, it could be that you have some incredibly complex industrial process. You set your knobs various ways.","zh":"有什么用处吗？我给你一堆数据。其中一些可能是好的结果，或者一些可能是坏的结果。所以，有人想……位置是什么？位置。是的，也许它可以是……是的，也许你可以有一个极其复杂的工业过程。你以各种方式调整参数。","start":1891.85,"end":1918.68},{"id":107,"text":"and you run the process and you get a bunch of data that looks like this. These are the ones that came in, these are the product that came out up to spec. This is the one that failed, right? And so what this will do is it'll give you an ellipsoid in the original space that tells you if you set your, this is where you want to set your, this is how you want to set those values, right? And you get an ellipsoidal safe set or something like that. That make sense?","zh":"你运行这个过程，得到一堆看起来像这样的数据。这些是输入的数据，这些是符合规格的产品输出，这个是失败的，对吧？而这将会给你一个原始空间中的椭球，告诉你应该如何设置这些参数，这就是你想要设置的值，对吧？你会得到一个椭球形的安全集合，或者类似的东西。这有道理吗？","start":1919.42,"end":1945.47},{"id":108,"text":"Okay, and then you could do very weird stuff like, here, this is, we've separated these points by a quartic, right? I mean, but anyway, once you get the idea, you can do anything you like with it. Although you have to admit, it looks kind of, well, okay, I'll try one for you. I give you a set of points, some x's and some y's, and I say, I'd like you to separate them by a minimum degree polynomial.","zh":"好的，然后你还可以做一些非常奇怪的事情，比如，这里，我们用四次多项式将这些点分开了，对吧？我是说，不管怎样，一旦你理解了这个概念，你就可以用它做任何你喜欢的事情。尽管你得承认，看起来有点……嗯，好吧，我来试一个给你。我给你一组点，一些x值和一些y值，我说，我希望你能用最低次数的多项式将它们分开。","start":1946.54,"end":1973.28},{"id":109,"text":"I have to tell you what the degree of a polynomial of x and y is, but let's say it's the maximum, yet a polynomial has got, you know, it's a sum, it's a linear combination of xi to the pi, you know, yi to the, y to the, sorry, yeah, x to the pi, y to the pi, qi. I'm going to take p plus q as the degree, okay? So someone tell me, can you solve that problem? And what kind of a problem is it? How do you minimize the degree?","zh":"我必须告诉你，一个关于x和y的多项式的次数是什么，但让我们假设它是最大值。一个多项式由xi的pi次方和yi的pi次方的线性组合构成，对吧？我将p加q作为次数，对吧？所以有人告诉我，你能解决这个问题吗？这是一个什么样的问题？如何最小化次数？","start":1974.93,"end":2005.94},{"id":110,"text":"of a polynomial discriminator for given data. First of all, could you do it? Yeah. Yeah, by iterate you mean try degree one, otherwise known as a hyperplane. It's a fail. Then you say, I'm going to try quadratic. Fail. Cubic. Succeeds. Then you're done. That was your algorithm? I like it. Perfectly good. Is it anything else? We have a name for it. That's just quasi-convex optimization.","zh":"对于给定数据的多项式判别器。首先，你们能做吗？是的。你们所说的迭代，是指尝试一次项，也就是超平面。这会失败。然后你说，我要尝试二次项。失败。三次项。成功了。然后你就完成了。这就是你的算法？我喜欢。非常好。还有其他方法吗？我们有一个名称。这其实就是拟凸优化。","start":2006.73,"end":2039.91}],"notes":["本段讲授了如何使用椭球和半定规划（SDP）来分离数据。通过引入矩阵不等式约束，可以将数据点分离到椭球内，从而构建一个安全区域。这种技术在工业过程中可能有实际应用，例如通过调整参数来确保输出符合规格。","讲者提到，椭球分离方法可以扩展到更高次的多项式，如四次多项式。一旦理解了基本思想，就可以用类似的方法进行更复杂的分离任务。但需要注意的是，这种方法可能看起来有些奇怪，但其背后的数学原理是清晰的。","在分离数据时，讲者提出了一种基于多项式度数的算法。首先尝试一次多项式（即超平面），如果失败则尝试二次、三次等，直到找到能够成功分离数据的最小度数。这种方法被称为准凸优化。","讲者强调，准凸优化是一种特殊的优化问题，其目标是最小化多项式的度数，同时确保数据点被正确分离。这种问题在实际应用中可能具有重要的意义，尤其是在需要高精度分类的场景中。","在讲授过程中，讲者通过举例说明了如何定义多项式的度数，并指出度数是通过取所有项的最高次幂之和来确定的。这为后续的优化问题提供了明确的数学基础。","最后，讲者总结了整个分离数据的过程，并指出该方法属于准凸优化的范畴。这表明，虽然问题可能看起来复杂，但其核心思想是清晰且可操作的。"],"formulas":[{"latex":"p + q = \\text{degree of the polynomial}","symbols":"p + q 是多项式的次数","explanation":"该公式正确描述了多项式次数的定义，符合原文中关于多项式次数的说明，无需修改。","evidence":"I have to tell you what the degree of a polynomial of x and y is, but let's say it's the maximum, yet a polynomial has got, you know, it's a sum, it's a linear combination of xi to the pi, you know, yi to the, y to the, sorry, yeah, x to the pi, y to the pi, qi. I'm going to take p plus q as the degree, okay? So someone tell me, can you solve that problem? And what kind of a problem is it? How do you minimize the degree?"}],"uncertainties":["quartic"],"diagram":"none","start":1862.43,"end":2039.91,"asr_flags":[],"math_clarifications":["原文未提供足够的信息来核定矩阵不等式约束的具体形式或条件，因此该公式无法确认其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1862.43,"text":"That sort of and you could do crazy stuff like you could say, you know what? I want to see if I can separate some data by an ellipsoid Right, and that would just be that would end up being an SDP. You'd have an inequality constraint You'd have a matrix inequality constraint on P something like that, right? And this would be like a separation by an ellipsoid Somebody want to name a useful"},{"start":1891.85,"text":"A use for that? I give you a bunch of data. Some is, let's say, maybe these are like good outcomes or something. Maybe these are bad ones. So anybody want to... Location. What's that? Location. Yeah, maybe it could be... Yeah, it could be that you have some incredibly complex industrial process. You set your knobs various ways."},{"start":1919.42,"text":"and you run the process and you get a bunch of data that looks like this. These are the ones that came in, these are the product that came out up to spec. This is the one that failed, right? And so what this will do is it'll give you an ellipsoid in the original space that tells you if you set your, this is where you want to set your, this is how you want to set those values, right? And you get an ellipsoidal safe set or something like that. That make sense?"},{"start":1946.54,"text":"Okay, and then you could do very weird stuff like, here, this is, we've separated these points by a quartic, right? I mean, but anyway, once you get the idea, you can do anything you like with it. Although you have to admit, it looks kind of, well, okay, I'll try one for you. I give you a set of points, some x's and some y's, and I say, I'd like you to separate them by a minimum degree polynomial."},{"start":1974.93,"text":"I have to tell you what the degree of a polynomial of x and y is, but let's say it's the maximum, yet a polynomial has got, you know, it's a sum, it's a linear combination of xi to the pi, you know, yi to the, y to the, sorry, yeah, x to the pi, y to the pi, qi. I'm going to take p plus q as the degree, okay? So someone tell me, can you solve that problem? And what kind of a problem is it? How do you minimize the degree?"},{"start":2006.73,"text":"of a polynomial discriminator for given data. First of all, could you do it? Yeah. Yeah, by iterate you mean try degree one, otherwise known as a hyperplane. It's a fail. Then you say, I'm going to try quadratic. Fail. Cubic. Succeeds. Then you're done. That was your algorithm? I like it. Perfectly good. Is it anything else? We have a name for it. That's just quasi-convex optimization."}],"speech_gaps":[],"frame":"../frames/v012/012.webp","frame_time":1874.43},{"title":"多项式次数与设施选址问题","segments":[{"id":111,"text":"Because the degree of a polynomial is actually, I mean, it's a silly one, but it's a quasi-convex function, right? Because I list out all the coefficients. Let's just do it for one variable. I list the coefficients of a polynomial, and the degree is I look along the vector for the largest coefficient that's not zero. That's actually quasi-convex. Okay? So, just to...","zh":"因为多项式的次数实际上，我的意思是，这是一个很无聊的点，但它是一个准凸函数，对吧？因为我会列出所有的系数。让我们只考虑一个变量的情况。我会列出一个多项式的系数，而次数就是我在向量中寻找最大的非零系数的位置。这实际上是一个准凸函数。明白吗？所以，只是为了……","start":2040.83,"end":2067.57},{"id":112,"text":"You can just go on and on with these things. You can probably write a paper about some of these things, I mean, hilariously. Actually, almost certainly. It'd actually probably be better than a lot. Anyway, okay, I'll stop right there. Okay, so our last topic is called placement and facility location. And this is just, there's a whole bunch of problems that look like this, right?","zh":"你可以一直这样讨论下去。你甚至可能可以写一篇关于这些内容的论文，我的意思是，这会很有趣。实际上，几乎可以肯定。它实际上可能比很多论文都要好。不管怎样，我在这里就停住吧。所以，我们最后的话题叫做设施选址。这只是一个有很多问题看起来像这样的主题，对吧？","start":2067.94,"end":2089.26},{"id":113,"text":"it typically goes down in like two or three dimensions, right? But there's cases where it goes down in higher dimensions, right? And the way it works typically is some of the positions are given and the others are variables. And then for each pair of points, I have a function that's a function of the two points, the two locations, right? I mean, actually, in many cases, they're zero, meaning it doesn't really matter. And then you just want to minimize the sum of,","zh":"它通常会减少到二维或三维，对吧？但也有情况是它会减少到更高维度，对吧？通常的运作方式是某些位置是给定的，而其他位置是变量。然后对于每一对点，我会有一个函数，这个函数依赖于这两个点的位置，对吧？我的意思是，在很多情况下，这些函数是零，这意味着它并不重要。然后你只需要最小化这些函数的总和，","start":2090.38,"end":2119.9},{"id":114,"text":"these functions that are functions of the two locations, right? And, you know, there's a lot of interpretations. So, I mean, the famous one, I think it's called like warehouse location problem or something like that. And it basically says what you do is you have a bunch of facilities I and J. FIJ is the transportation cost between the two facilities. And that might grow, I don't know, it might be linear, it might go quadratically or something. It doesn't matter. It's something.","zh":"这些函数依赖于两个位置，对吧？而且，你知道的，有很多不同的解释。我的意思是，著名的例子，我想它叫做仓库选址问题或者类似的问题。它基本上说的是你有一组设施I和J。FIJ是两个设施之间的运输成本。这可能增长，我不知道，可能是线性的，也可能是二次的或者其他形式。这并不重要，它只是某种形式。","start":2120.28,"end":2149.44},{"id":115,"text":"And then some of the locations are fixed and then you want to choose the locations of the others.","zh":"然后一些位置是固定的，而你需要选择其他位置的位置。","start":2150.86,"end":2157.08},{"id":116,"text":"so that this total cost is minimized, your total transportation cost. This is kind of universal in circuit design. So what happens there is, I don't know, you have any of the many chips in my phone and your phone, all your electronics would have little cells. I mean, this goes down at many levels, but let's do it at the gate level. So you might have, I don't know, 10 million gates, right? Each gate is connected.","zh":"以便使总成本最小化，你的总运输成本。这在电路设计中是相当普遍的。那么在那里发生的情况是，我不知道，你有任何一个在我手机或你手机中的许多芯片，所有你的电子设备都会有小单元。我的意思是，这在许多层级上都会发生，但让我们在门级来做。你可能会有，我不知道，1000万个门，对吧？每个门都是连接的。","start":2157.55,"end":2185.45},{"id":117,"text":"to, you know, order of magnitude three or four others, right? Roughly, right? I mean, some have, you know, big fan in, some have big fan out, but mostly they're connected to like between one and three others, right? Or actually, I guess two and whatever, four others, something like that, right? Then what you want to do is you want to choose where these gates are going to go. And you want the ones that are connected to each other to be nearby. And there you would actually take this thing, the cost,","zh":"连接到，你知道的，数量级为三或四个其他的门，对吧？大致如此，对吧？我的意思是，有些有大的输入扇入，有些有大的输出扇出，但大多数连接到一到三个其他的门之间，对吧？或者实际上，我想是两个和任意数量的四个其他的门，类似这样的情况，对吧？然后你想要做的事情是，你想要选择这些门将放置在哪里。你希望那些相互连接的门彼此靠近。在那里你实际上会采用这个东西，即成本，","start":2186.19,"end":2215.37}],"notes":["本段首先讨论了多项式的次数定义，指出多项式次数是向量中非零系数的最大索引，这实际上是一个准凸函数。接着，讲者提到多项式次数的定义可能显得有些荒谬，但这是准凸函数的一个例子。","讲者随后转向设施选址问题，指出这类问题在多个领域都有应用，如仓库选址问题。这类问题通常涉及固定和可变位置，目标是使总运输成本最小化。","在电路设计中，设施选址问题表现为选择门的位置，使得相互连接的门尽可能靠近。讲者提到，电路设计中存在大量门，每个门连接到其他几个门，目标是优化布局以减少总成本。","讲者强调，这类问题在多个实际场景中都有应用，如电子设备中的芯片设计，其中门的连接关系决定了布局优化的目标。","讲者还提到，设施选址问题中的运输成本函数可能具有不同的形式，如线性或二次，但具体形式并不影响问题的结构。","最后，讲者指出，设施选址问题的解决方法通常涉及优化技术，以最小化总成本，这在电路设计中尤为重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2040.83,"end":2215.37,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2040.83,"text":"Because the degree of a polynomial is actually, I mean, it's a silly one, but it's a quasi-convex function, right? Because I list out all the coefficients. Let's just do it for one variable. I list the coefficients of a polynomial, and the degree is I look along the vector for the largest coefficient that's not zero. That's actually quasi-convex. Okay? So, just to..."},{"start":2067.94,"text":"You can just go on and on with these things. You can probably write a paper about some of these things, I mean, hilariously. Actually, almost certainly. It'd actually probably be better than a lot. Anyway, okay, I'll stop right there. Okay, so our last topic is called placement and facility location. And this is just, there's a whole bunch of problems that look like this, right?"},{"start":2090.38,"text":"it typically goes down in like two or three dimensions, right? But there's cases where it goes down in higher dimensions, right? And the way it works typically is some of the positions are given and the others are variables. And then for each pair of points, I have a function that's a function of the two points, the two locations, right? I mean, actually, in many cases, they're zero, meaning it doesn't really matter. And then you just want to minimize the sum of,"},{"start":2120.28,"text":"these functions that are functions of the two locations, right? And, you know, there's a lot of interpretations. So, I mean, the famous one, I think it's called like warehouse location problem or something like that. And it basically says what you do is you have a bunch of facilities I and J. FIJ is the transportation cost between the two facilities. And that might grow, I don't know, it might be linear, it might go quadratically or something. It doesn't matter. It's something."},{"start":2150.86,"text":"And then some of the locations are fixed and then you want to choose the locations of the others."},{"start":2157.55,"text":"so that this total cost is minimized, your total transportation cost. This is kind of universal in circuit design. So what happens there is, I don't know, you have any of the many chips in my phone and your phone, all your electronics would have little cells. I mean, this goes down at many levels, but let's do it at the gate level. So you might have, I don't know, 10 million gates, right? Each gate is connected."},{"start":2186.19,"text":"to, you know, order of magnitude three or four others, right? Roughly, right? I mean, some have, you know, big fan in, some have big fan out, but mostly they're connected to like between one and three others, right? Or actually, I guess two and whatever, four others, something like that, right? Then what you want to do is you want to choose where these gates are going to go. And you want the ones that are connected to each other to be nearby. And there you would actually take this thing, the cost,"}],"speech_gaps":[],"frame":"../frames/v012/013.webp","frame_time":2052.83},{"title":"电路设计中的距离最小化与惩罚函数","segments":[{"id":118,"text":"This is zero if cell I and cell J are not connected to each other. And this would simply be something like the L1 norm if they are. The L1 norm because when you run wires on a circuit, you don't run like this. You go this way and then you go through a via to another layer and then you go that way or something like that. Everybody got that? So this is kind of like universally used.","zh":"如果单元格I和单元格J之间没有连接，这个值就是零。如果它们之间有连接，这将类似于L1范数。在电路中布线时，你不会这样布线，而是先沿着这个方向走，然后通过一个过孔到另一层，再沿着另一个方向走，或者其他类似的方式。大家明白了吗？所以这种做法在某种程度上是普遍使用的。","start":2216.02,"end":2241.85},{"id":119,"text":"Okay, so that's an example. We'll look at some examples here. I mean, just a baby example, just so you can visualize it. And here, by the way, the idea of designing penalties and functions just comes up again. So here it is. I guess these ones on the boundary we imagine are fixed points, right? In a circuit, those would be like something that you've already settled on, or it could be something like a pin. You'd say that's where the external pin comes in.","zh":"好的，这是一个例子。我们将在这里看一下一些例子。我的意思是，只是一个简单的例子，只是为了帮助你们可视化。顺便说一下，设计惩罚函数和函数的想法又出现了。这里就是。我想这些位于边界上的点，我们想象它们是固定点，对吧？在电路中，这些可能是指你已经确定下来的某些部分，或者像一个引脚。你会说，这就是外部引脚接入的地方。","start":2244.72,"end":2273.56},{"id":120,"text":"it's locked down, that's where it is, that's where that comes from. And then you're placing","zh":"它已经被固定下来了，这就是它的位置，这就是它的来源。然后你开始放置","start":2273.98,"end":2279.24},{"id":121,"text":"these things, right? So let's see what they are, let's see if this makes sense. In this first case,","zh":"这些元件，对吧？那么我们来看看它们是什么，看看这是否合理。在第一种情况下，","start":2279.8,"end":2286.66},{"id":122,"text":"so what we're going to do is we're going to minimize, and the lines here show you, it's a","zh":"我们将要做的事情是，我们要最小化，这里的线条显示了，这是一个","start":2286.8,"end":2291.44},{"id":123,"text":"graph, and it tells you which things are connected to which others, okay? And what we do is on every","zh":"图，它告诉你哪些东西连接到哪些其他东西，好吗？然后我们对每一个","start":2291.44,"end":2297.46},{"id":124,"text":"every one of those, we take the distance, in this case the Euclidean distance between the two,","zh":"每一个这样的连接，我们计算两点之间的距离，这里是欧几里得距离，","start":2297.46,"end":2302.18},{"id":125,"text":"and we take a function of it. So if we literally just minimize the Euclidean distance, we get","zh":"然后我们对它取一个函数。如果我们直接最小化欧几里得距离，我们就会得到","start":2302.18,"end":2306.34},{"id":126,"text":"this thing here, like this. So whatever this is, this is the arrangement of those seven","zh":"这里的东西，就像这样。所以无论这是什么，这是那七个点的排列方式","start":2306.34,"end":2311.64},{"id":127,"text":"or whatever black dots in there, in such a way that the total length of all of those","zh":"或者其中的任何黑色点，以这样的方式排列，使得所有这些边的总长度最小化。大家明白了吗？现在我们转向，现在我们最小化平方和。","start":2311.64,"end":2317.12},{"id":128,"text":"edges is minimized. Everybody got that? Now we go to, now we minimize the sum of the squares.","zh":"顺便说一句，这很傻。这是，我的意思是，这是一堂线性代数课。这是因为","start":2317.12,"end":2327.14},{"id":129,"text":"By the way, this is silly. That's a, I mean, this is in a linear algebra class. It's because","zh":"这是因为这只是一个最小二乘问题","start":2327.44,"end":2331.62},{"id":130,"text":"because it's just the least squares problem","zh":"带有等式约束，","start":2331.62,"end":2332.62},{"id":131,"text":"with equality constraints,","zh":"并且这已经得到了解析解，所以没关系，对吧？","start":2332.62,"end":2333.62},{"id":132,"text":"and that's gotten analytical, so it doesn't matter, right?","zh":"但这就是它是什么，发生了什么？","start":2333.82,"end":2336.62},{"id":133,"text":"But that's what that is, and what happened?","zh":"但这就是它，发生了什么？","start":2336.92,"end":2340.42},{"id":134,"text":"They got more spread out, and I'd like someone to explain.","zh":"它们变得更加分散了，我希望有人能解释一下。","start":2340.48,"end":2343.56},{"id":135,"text":"Using kind of like, you know, this anthropomorphize it,","zh":"用一种类似的方式，你知道的，把它们拟人化，","start":2347.72,"end":2351.32},{"id":136,"text":"so why would that happen, right?","zh":"那么为什么会这样呢，对吧？","start":2351.38,"end":2354.42},{"id":137,"text":"By the way, this keeps, this is the fourth power here,","zh":"顺便说一下，这里还是四次方，","start":2355.12,"end":2357.8},{"id":138,"text":"here. So, and they get spread out even more. pread out even more. Somebody, yeah? The first one about the square. You mean in this one? Yeah, compared to the first one. Sorry, yeah, in the first one, basically you would, if you were going to explain this cost function, you'd say it's pretty chill about, compared to squaring the distance, just taking that this is pretty chill about long lengths, right? And so sure enough you get a bunch of long"}],"uncertainties":["the fourth power here"],"diagram":"none","start":2216.02,"end":2389.54,"asr_flags":[],"math_clarifications":["原始公式中的'sum of squares of distances'应更精确地表示为距离平方和，以符合数学表达习惯。"],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":2216.02,"text":"This is zero if cell I and cell J are not connected to each other. And this would simply be something like the L1 norm if they are. The L1 norm because when you run wires on a circuit, you don't run like this. You go this way and then you go through a via to another layer and then you go that way or something like that. Everybody got that? So this is kind of like universally used."},{"start":2244.72,"text":"Okay, so that's an example. We'll look at some examples here. I mean, just a baby example, just so you can visualize it. And here, by the way, the idea of designing penalties and functions just comes up again. So here it is. I guess these ones on the boundary we imagine are fixed points, right? In a circuit, those would be like something that you've already settled on, or it could be something like a pin. You'd say that's where the external pin comes in."},{"start":2273.98,"text":"it's locked down, that's where it is, that's where that comes from. And then you're placing"},{"start":2279.8,"text":"these things, right? So let's see what they are, let's see if this makes sense. In this first case,"},{"start":2286.8,"text":"so what we're going to do is we're going to minimize, and the lines here show you, it's a"},{"start":2291.44,"text":"graph, and it tells you which things are connected to which others, okay? And what we do is on every"},{"start":2297.46,"text":"one of those, we take the distance, in this case the Euclidean distance between the two,"},{"start":2302.18,"text":"and we take a function of it. So if we literally just minimize the Euclidean distance, we get"},{"start":2306.34,"text":"this thing here, like this. So whatever this is, this is the arrangement of those seven"},{"start":2311.64,"text":"or whatever black dots in there, in such a way that the total length of all of those"},{"start":2317.12,"text":"edges is minimized. Everybody got that? Now we go to, now we minimize the sum of the squares."},{"start":2327.44,"text":"By the way, this is silly. That's a, I mean, this is in a linear algebra class. It's because"},{"start":2331.62,"text":"because it's just the least squares problem"},{"start":2332.62,"text":"with equality constraints,"},{"start":2333.82,"text":"and that's gotten analytical, so it doesn't matter, right?"},{"start":2336.92,"text":"But that's what that is, and what happened?"},{"start":2340.48,"text":"They got more spread out, and I'd like someone to explain."},{"start":2347.72,"text":"Using kind of like, you know, this anthropomorphize it,"},{"start":2351.38,"text":"so why would that happen, right?"},{"start":2355.12,"text":"By the way, this keeps, this is the fourth power here,"},{"start":2357.8,"text":"here. So, and they get spread out even more. Somebody, yeah?"},{"start":2364.5,"text":"The first one about the square."},{"start":2367.86,"text":"You mean in this one?"},{"start":2369.98,"text":"Yeah, compared to the first one."},{"start":2371.38,"text":"Sorry, yeah, in the first one, basically you would, if you were going to explain this cost"},{"start":2376.56,"text":"function, you'd say it's pretty chill about, compared to squaring the distance, just taking"},{"start":2382.64,"text":"that this is pretty chill about long lengths, right? And so sure enough you get a bunch of long"}],"speech_gaps":[],"frame":"../frames/v012/014.webp","frame_time":2228.02},{"title":"凸优化中的距离函数与放置问题","segments":[{"id":145,"text":"In the second one, it's way less chill about that, right? That's what you're going to say? Exactly. It's chill about the... Yeah, and then this one is chill about big, long lengths.","zh":"在第二个例子中，它对这一点就不太在意了，对吧？这就是你要说的吗？没错。它对……是的，然后这个例子对长距离就比较在意。","start":2390.57,"end":2406.18},{"id":146,"text":"but it still cares about small, so it actually has an incentive to push things together even when they're pretty close. This one here, this is square, and so what that means is it doesn't like long lengths at all because you square the length. Short distances are actually okay because short squared is like real small. Everybody got this? Okay. And so once you see that, you understand kind of all of this. And then I have a question for you. I'd like...","zh":"但它仍然在意短距离，因此实际上它有动力将事物拉近，即使它们已经非常接近。这个例子中的函数是平方的，这意味着它完全不喜欢长距离，因为你会对长度进行平方。短距离其实是可以接受的，因为短距离的平方会变得非常小。大家明白了吗？好的。一旦你理解了这一点，你就能理解所有这些内容。然后我有一个问题想问大家。我想……","start":2407.24,"end":2437.69},{"id":147,"text":"What would you imagine if I used the following function? Did I write it as h? I did. Okay, so h of u is going to be, I'll just draw it if you don't mind, zero, some distance d, and then that. So suppose it's dead zone linear, like that. What does it mean?","zh":"如果你使用以下函数，你会想象什么？我把它写成 h 了吗？是的。好的，所以 h(u) 将是，如果你不介意的话，我来画一下：零，某个距离 d，然后是这样。假设它是死区线性，像这样。这意味着什么？","start":2439.12,"end":2467.32},{"id":148,"text":"If I did that, if I did placement with that function, what it would say is, you know what? If you're within distance d, like, I'm totally cool. And actually, I don't get happier if you put things even closer than d. Everybody got it? Okay. And I want to know, I would like to know, what do you think would happen if... A lot of values get pushed to d if they're above d. Exactly. So a lot of distance values would be kind of at d.","zh":"如果我这样做，如果我使用这个函数进行放置，它会说：你知道吗？如果你在距离 d 以内，我完全没问题。实际上，如果你把东西放得比 d 更近，我并不会更开心。大家明白了吗？好的。我想知道，我想知道，如果你……很多值如果超过 d 会被推到 d。没错。因此很多距离值会大致处于 d 的位置。","start":2469.96,"end":2501.14},{"id":149,"text":"Right? Just heuristically, right? Because basically it says, look, the incentive to push things closer, once you get within D of someone, you know, it's a neighbor if you have an edge, once you get within D, this thing doesn't care anymore. And you might as well just go work on other stuff. Go find things whose distance is bigger than D and work on those, right? I mean, I'm completely anthropomorphizing it, but that's what makes sense. Actually, what's cool about that is the placement problem gets hard.","zh":"对吧？这只是启发式地看，对吧？因为基本上它说，一旦你接近某个人的距离小于 D，你知道的，如果你有边，那就是一个邻居，一旦你接近 D，这个东西就不再在意了。你不妨去做其他事情。去找那些距离大于 D 的东西并处理它们，对吧？我是完全拟人化的，但这样是有道理的。实际上，这很有趣的是放置问题变得困难了。","start":2502.21,"end":2531.11},{"id":150,"text":"non-convex when you add one more extremely realistic constraint. And it's this. I'll just mention this because if there are people here who actually do circuits or stuff like that. So a more realistic placement problem is something like this. Each of these things actually is like a cell, right? So it might look like this and this one looks like this, right? And maybe the XIs are the center. And an extremely common constraint is that they don't overlap. I mean, kind of, duh.","zh":"当添加一个更加现实的约束时，问题会变得非凸。这就是我要说的。我之所以提到这一点，是因为在场的人中可能有从事电路设计或其他类似工作的人。一个更加现实的放置问题可能是这样的。这些元素实际上就像是一个个单元，对吧？所以它可能看起来像这样，而这个看起来像这样，对吧？也许XIs是中心。一个极其常见的约束是它们不能重叠。我是说，这不是很明显吗。","start":2531.76,"end":2561.03}],"notes":["本段讨论了凸优化中距离函数的性质，特别是平方距离函数对长距离和短距离的处理方式。平方距离函数对长距离非常敏感，因为其值会随着距离的平方增长，而短距离则相对较小，因此在优化过程中，平方距离函数会鼓励将点拉近。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2390.57,"end":2561.03,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2390.57,"text":"In the second one, it's way less chill about that, right? That's what you're going to say? Exactly. It's chill about the... Yeah, and then this one is chill about big, long lengths."},{"start":2407.24,"text":"but it still cares about small, so it actually has an incentive to push things together even when they're pretty close. This one here, this is square, and so what that means is it doesn't like long lengths at all because you square the length. Short distances are actually okay because short squared is like real small. Everybody got this? Okay. And so once you see that, you understand kind of all of this. And then I have a question for you. I'd like..."},{"start":2439.12,"text":"What would you imagine if I used the following function? Did I write it as h? I did. Okay, so h of u is going to be, I'll just draw it if you don't mind, zero, some distance d, and then that. So suppose it's dead zone linear, like that. What does it mean?"},{"start":2469.96,"text":"If I did that, if I did placement with that function, what it would say is, you know what? If you're within distance d, like, I'm totally cool. And actually, I don't get happier if you put things even closer than d. Everybody got it? Okay. And I want to know, I would like to know, what do you think would happen if... A lot of values get pushed to d if they're above d. Exactly. So a lot of distance values would be kind of at d."},{"start":2502.21,"text":"Right? Just heuristically, right? Because basically it says, look, the incentive to push things closer, once you get within D of someone, you know, it's a neighbor if you have an edge, once you get within D, this thing doesn't care anymore. And you might as well just go work on other stuff. Go find things whose distance is bigger than D and work on those, right? I mean, I'm completely anthropomorphizing it, but that's what makes sense. Actually, what's cool about that is the placement problem gets hard."},{"start":2531.76,"text":"non-convex when you add one more extremely realistic constraint. And it's this. I'll just mention this because if there are people here who actually do circuits or stuff like that. So a more realistic placement problem is something like this. Each of these things actually is like a cell, right? So it might look like this and this one looks like this, right? And maybe the XIs are the center. And an extremely common constraint is that they don't overlap. I mean, kind of, duh."}],"speech_gaps":[],"frame":"../frames/v012/015.webp","frame_time":2402.57},{"title":"凸优化课程中的应用与问题建模","segments":[{"id":151,"text":"So that constraint is non-convex. Everybody got that? Here's what's cool. If you do this, that's actually a pretty good convex heuristic for getting a layout where things are at least d apart. Everybody got this? And I could actually tune this. If these were squares, I could make for each edge, I could make d equal to one of the...","zh":"因此，这个约束是非凸的。大家明白了吗？这里有个很酷的地方。如果你这样做，实际上这是一个相当好的凸启发式方法，用于得到一个布局，使得物体之间至少相距d。大家明白了吗？而且我实际上可以调整这个参数。如果这些是正方形，我可以为每条边，让d等于其中一个的直径加上另一个的半径。在这种情况下，这只是一个启发式方法，但我倾向于得到不会重叠的物体。好的，但我们在得到这些，对吧。有道理吗？是的，好的。好了，这就是布局。好的，因此，这实际上结束了课程中关于应用的一个部分。","start":2561.51,"end":2590.15},{"id":152,"text":"like diameter of the radius of this one plus the radius of that one. And in that case, it's a heuristic, but I will tend to get things that don't overlap. So, okay, but we're getting, yeah. Make sense? Yeah, okay. All right, so that's placement. Okay, so this actually finishes a whole section of the course that was on just sort of applications.","zh":"我的意思是，这只是一个快速的游览。你在作业中会遇到其他各种应用。我认为想法就是看到这些在不同领域、不同方面的应用，它是如何运作的。此外，当然，你在作业和观看这些内容时也会学到这些。","start":2591.43,"end":2615.44},{"id":153,"text":"I mean, it was just kind of a whirlwind tour. You're encountering a bunch of other applications in your homework. And I think the idea is just to see a whole lot of these in different fields, different areas, how it works. And then also know about, I mean, of course, in the homework and watching these things.","zh":"我告诉你这个问题是什么。但你想要思考的一件事是，如果你遇到一个问题，你会如何设置它，以便实现你想要的目标？我的意思是，这正是设计惩罚函数之类方法背后的想法，对吧？好的。课程的下一部分实际上是关于如何实际求解问题的。","start":2618.08,"end":2634.1},{"id":154,"text":"I'm telling you what the problem is. But one of the things you want to be thinking about is like if you encountered a problem, how would you set it up so that it would do something that you wanted to do? I mean, which is kind of the idea behind designing penalty functions and things like that, right? So, okay. Now, the next part of the course is actually going to be on how do you actually solve problems?","zh":"因此，这将是课程的下一部分内容。我们可能会在最后有一个小部分，实际做一些其他有趣的应用。但这是重要的，所以我们先做这个。我们将讨论当你在CVX pi中调用solve方法时会发生什么。我想我们实际上已经讨论过最高层的情况。","start":2634.97,"end":2663.72},{"id":155,"text":"So that's going to be the next section of the course. We'll probably have a small bit at the end where we'll actually do some other interesting applications. But this is important, so we'll do this first. So we're going to talk about what happens when, let's say, you call the solve method in CVX pi. I think actually we had discussions about what happens at the highest level.","zh":"所以，这将是课程的下一部分内容。我们可能会在最后有一个小部分，实际做一些其他有趣的应用。但这是重要的，所以我们先做这个。我们将讨论当你在CVX pi中调用solve方法时会发生什么。我想我们实际上已经讨论过最高层的情况。","start":2664.3,"end":2691.65},{"id":156,"text":"At the highest level, what happens is it takes your problem and it transforms it. You get an equivalent problem, and then you get another equivalent problem, and another one, and you reduce it through a chain of equivalences until you get to some standard form we can solve, like a linear program, quadratic program, or second-order cone programming, or semi-definite program. We're actually not going to talk about that, although it is super interesting, but it just uses the ideas from the beginning of the class of a reduction.","zh":"在最高层次上，发生的事情是它将你的问题进行转换。你会得到一个等价的问题，然后是另一个等价的问题，再一个，通过一系列等价关系将问题逐步简化，直到得到一个我们可以求解的标准形式，比如线性规划、二次规划、二阶锥规划或半正定规划。我们实际上不会讨论这些内容，尽管它非常有趣，但它只是使用了本课程初期介绍的归约思想。","start":2692.06,"end":2720.28}],"notes":["本段主要讲解了凸优化在实际应用中的使用，特别是如何通过凸近似来处理非凸约束问题。讲者提到，当处理物体布局问题时，可以通过设置最小距离d来避免重叠，这实际上是一种凸近似方法。讲者还提到，如果物体是正方形，可以通过计算半径之和来确定d的值，从而确保物体之间不重叠。","讲者强调了在实际应用中，如何将问题建模为凸优化问题的重要性。他指出，设计惩罚函数等方法的核心思想是将实际问题转化为可以求解的凸问题。此外，他还提到课程接下来的部分将讨论如何实际求解优化问题，包括使用CVX等工具进行求解。","在讲者提到的CVX工具中，他解释了在最高层如何将问题转化为标准形式。具体来说，CVX会将原始问题通过一系列等价变换，最终转化为线性规划、二次规划、二次锥规划或半正定规划等标准形式，从而可以使用现有的求解器进行求解。","讲者还提到，虽然这些变换过程非常有趣，但课程不会深入讨论这些细节，而是会基于课程初期介绍的减少思想进行讲解。这表明课程的重点在于理解如何将实际问题转化为凸优化问题，而不是具体的求解算法。","在讲者提到的布局问题中，他强调了凸近似方法的有效性，即通过设置最小距离d来确保物体之间不重叠。这种方法虽然是一种启发式方法，但在实际应用中非常有用。","最后，讲者提到课程接下来的部分将讨论如何实际求解优化问题，包括使用CVX等工具进行求解。这表明课程的结构是先介绍应用，再深入讨论求解方法，从而帮助学生全面理解凸优化的理论和实践。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2561.51,"end":2720.28,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2561.51,"text":"So that constraint is non-convex. Everybody got that? Here's what's cool. If you do this, that's actually a pretty good convex heuristic for getting a layout where things are at least d apart. Everybody got this? And I could actually tune this. If these were squares, I could make for each edge, I could make d equal to one of the..."},{"start":2591.43,"text":"like diameter of the radius of this one plus the radius of that one. And in that case, it's a heuristic, but I will tend to get things that don't overlap. So, okay, but we're getting, yeah. Make sense? Yeah, okay. All right, so that's placement. Okay, so this actually finishes a whole section of the course that was on just sort of applications."},{"start":2618.08,"text":"I mean, it was just kind of a whirlwind tour. You're encountering a bunch of other applications in your homework. And I think the idea is just to see a whole lot of these in different fields, different areas, how it works. And then also know about, I mean, of course, in the homework and watching these things."},{"start":2634.97,"text":"I'm telling you what the problem is. But one of the things you want to be thinking about is like if you encountered a problem, how would you set it up so that it would do something that you wanted to do? I mean, which is kind of the idea behind designing penalty functions and things like that, right? So, okay. Now, the next part of the course is actually going to be on how do you actually solve problems?"},{"start":2664.3,"text":"So that's going to be the next section of the course. We'll probably have a small bit at the end where we'll actually do some other interesting applications. But this is important, so we'll do this first. So we're going to talk about what happens when, let's say, you call the solve method in CVX pi. I think actually we had discussions about what happens at the highest level."},{"start":2692.06,"text":"At the highest level, what happens is it takes your problem and it transforms it. You get an equivalent problem, and then you get another equivalent problem, and another one, and you reduce it through a chain of equivalences until you get to some standard form we can solve, like a linear program, quadratic program, or second-order cone programming, or semi-definite program. We're actually not going to talk about that, although it is super interesting, but it just uses the ideas from the beginning of the class of a reduction."}],"speech_gaps":[],"frame":"../frames/v012/016.webp","frame_time":2573.51},{"title":"课程概览与数值线性代数","segments":[{"id":157,"text":"of equivalent problems. So we're not going to talk about that. That's what CVXPy does. Now we're going to, the next section of the course is like, how do you solve an LP or a SOCP or a semi-definite program? That's what we're going to look at. And there it's also, we're going to work our way up. And the way that's going to work is we're going to start with, at the very basics, with just linear algebra. So, you know, how do you solve linear algebra things? And we're going to, then you'll see that we'll build, we'll start with that.","zh":"等价问题。因此，我们不会讨论这个问题。这是CVXPy所做的。现在，我们将进入课程的下一节，即如何求解线性规划（LP）或二次约束规划（SOCP）或半正定规划（SDP）？这就是我们要研究的内容。而且，我们还将逐步深入。实现这一目标的方式是，我们将从最基本的线性代数开始。你知道吗，如何求解线性代数问题？然后你就会看到，我们将从这一点开始构建。","start":2720.92,"end":2750.04},{"id":158,"text":"On top of that, I'll show you how to solve quadratic problems. Oh, by the way, solving quadratic problems, that's linear algebra. Then the next step up, this is just to give you the big picture of what we're going to do. By next week or two weeks, then we'll say something like, okay, we will solve your non-quadratic convex problem by solving a sequence of quadratic problems.","zh":"在此基础上，我将向你展示如何求解二次问题。顺便提一下，求解二次问题，这属于线性代数。下一步，这只是为了给你一个整体的概览。大约在下周或两周后，我们将说，我们可以通过求解一系列二次问题来解决你的非二次凸问题。","start":2750.89,"end":2777.31},{"id":159,"text":"but quadratic problem solving a quadratic problem is linear algebra and then the stuff we're going to talk about right now comes into play and then we'll go above that and eventually we'll get to interior point methods which will handle constraints and everything else all this way so that's the the big picture okay so okay so what we're going to do","zh":"但求解二次问题，这属于线性代数，然后我们现在要讨论的内容就会发挥作用，接着我们将超越这一点，最终我们将到达内点法，这种方法可以处理约束条件和其他一切问题。这就是整体的概览。好的，好的，那么我们接下来要做什么","start":2778.06,"end":2795.4},{"id":160,"text":"This is going to go all the way down to the bottom. We're not going to go to the gate level or anything like that. We're going to go to the floating point level. So at the floating point level, we're going to talk about numerical linear algebra. Actually, honestly, I think everyone needs to know this. I'm just going to give you a little tiny bit. There's an appendix on this in the book. Please read it. Actually, just because this is useful for...","zh":"这将一直深入到底层。我们不会深入到门级或类似的东西。我们将深入到浮点数级别。在浮点数级别，我们将讨论数值线性代数。说实话，我认为每个人都需要了解这一点。我只会给你一点点内容。书中有一个关于这个的附录。请阅读它。实际上，仅仅因为这对你有帮助...","start":2796.29,"end":2821.29},{"id":161,"text":"This is useful. Anyone here, if you do anything that has anything to do with math and computation, like anything, which is, I mean, pretty much, if you're in this class, you're in that category, right? You need to know this. And it's not, it's kind of, to me, it's completely unacceptable to not know at least a bit about how linear equations are solved. And I'll tell you why. Because, for example, you're going to learn crazy things, like we'll see cases where on my phone I can solve a set of linear equations that's like a million by a million.","zh":"这很有用。在座的各位，如果你做任何与数学和计算相关的事情，比如任何事情，我意思是，基本上，如果你在这门课上，你就在这个类别里，对吧？你需要知道这些内容。而且对我来说，完全不能接受不知道至少一点如何求解线性方程。我告诉你们为什么。例如，你们将学到一些很神奇的东西，比如在手机上我就能解一个一千万乘一千万的线性方程组。","start":2822.12,"end":2851.34},{"id":162,"text":"Right? So you need to know what's easy, what's hard, and all that kind of stuff. And it is not intuitive until you have seen this material. Some of it is not obvious at all. Okay? So, okay. So that's the big picture. And so we'll start just by talking about, you know, matrix structure and algorithm complexity.","zh":"对吧？因此，你需要知道什么是容易的，什么是困难的，以及所有这些内容。直到你看过这些材料，这些内容才不直观。其中一些内容显然并不明显。明白了吗？好的。所以这就是整体情况。因此，我们将首先谈谈矩阵结构和算法复杂度。","start":2852.5,"end":2877.99}],"notes":["本段主要介绍了课程接下来的内容安排，包括如何解决线性规划、二次约束规划和半正定规划问题。课程将从线性代数的基本概念开始，逐步深入，最终涉及内点法等高级方法。","课程将从线性代数的基础开始，逐步过渡到更复杂的优化问题，如二次问题和非二次凸问题。解决非二次凸问题的方法是通过求解一系列二次问题。","课程将深入到浮点数级别的数值线性代数，强调其重要性。作者认为，所有涉及数学和计算的人都需要了解线性方程的求解方法。","作者指出，线性方程的求解方法对于理解问题的难易程度至关重要。例如，作者提到可以在手机上求解百万阶的线性方程组，这说明了数值线性代数的重要性。","课程将从矩阵结构和算法复杂度开始，逐步展开，帮助学生理解线性代数在优化问题中的应用。","作者强调，理解线性方程的求解方法对于学习凸优化至关重要，因为这将帮助学生理解问题的复杂性和解决方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2720.92,"end":2877.99,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2720.92,"text":"of equivalent problems. So we're not going to talk about that. That's what CVXPy does. Now we're going to, the next section of the course is like, how do you solve an LP or a SOCP or a semi-definite program? That's what we're going to look at. And there it's also, we're going to work our way up. And the way that's going to work is we're going to start with, at the very basics, with just linear algebra. So, you know, how do you solve linear algebra things? And we're going to, then you'll see that we'll build, we'll start with that."},{"start":2750.89,"text":"On top of that, I'll show you how to solve quadratic problems. Oh, by the way, solving quadratic problems, that's linear algebra. Then the next step up, this is just to give you the big picture of what we're going to do. By next week or two weeks, then we'll say something like, okay, we will solve your non-quadratic convex problem by solving a sequence of quadratic problems."},{"start":2778.06,"text":"but quadratic problem solving a quadratic problem is linear algebra and then the stuff we're going to talk about right now comes into play and then we'll go above that and eventually we'll get to interior point methods which will handle constraints and everything else all this way so that's the the big picture okay so okay so what we're going to do"},{"start":2796.29,"text":"This is going to go all the way down to the bottom. We're not going to go to the gate level or anything like that. We're going to go to the floating point level. So at the floating point level, we're going to talk about numerical linear algebra. Actually, honestly, I think everyone needs to know this. I'm just going to give you a little tiny bit. There's an appendix on this in the book. Please read it. Actually, just because this is useful for..."},{"start":2822.12,"text":"This is useful. Anyone here, if you do anything that has anything to do with math and computation, like anything, which is, I mean, pretty much, if you're in this class, you're in that category, right? You need to know this. And it's not, it's kind of, to me, it's completely unacceptable to not know at least a bit about how linear equations are solved. And I'll tell you why. Because, for example, you're going to learn crazy things, like we'll see cases where on my phone I can solve a set of linear equations that's like a million by a million."},{"start":2852.5,"text":"Right? So you need to know what's easy, what's hard, and all that kind of stuff. And it is not intuitive until you have seen this material. Some of it is not obvious at all. Okay? So, okay. So that's the big picture. And so we'll start just by talking about, you know, matrix structure and algorithm complexity."}],"speech_gaps":[],"frame":"../frames/v012/017.webp","frame_time":2732.92},{"title":"线性方程组的求解复杂度与结构化矩阵","segments":[{"id":163,"text":"So, you know, suppose we want to solve a set of linear equations, right? Like ax equals b here, right? So we want to solve that. You know, if a is like for general methods, it grows like n cubed, right? Oh, and I should mention something about this. In theoretical computer science, actually, the number's not n cubed. Does anyone here know what the current number is? Somebody here's got to know. Go ahead.","zh":"所以，你知道吗，假设我们想解一组线性方程，对吧？比如这里的ax等于b，对吧？所以我们想解这个问题。你知道的，如果a是一般的方法，它的复杂度会随着n的立方增长，对吧？哦，我应该提到这一点。在理论计算机科学中，实际上这个数值并不是n的立方。有人知道现在的数值是多少吗？这里应该有人知道。请说吧。","start":2880.55,"end":2906.97},{"id":164,"text":"By the way, I wouldn't know, so if you say the wrong number, it's totally fine. I mean, I know the range it is. What is it? Yeah, okay, it's around 2.4, maybe 2.3 something. I have no idea.","zh":"顺便说一句，我自己并不知道，所以如果你说错了数值也没关系。我的意思是，我知道它的范围。这个数值是多少？嗯，好吧，大概是2.4，可能2.3左右。我完全不知道。","start":2908.49,"end":2922.7},{"id":165,"text":"because they use reinforcement learning to grow up with a faster algorithm. Awesome. So it's, what, 2.3 now? I don't know. Somewhere around there. Okay, yeah. Okay, it's 2.3, right? So end of the 2.3. Now, you know, these are... I mean, that is fascinating, right? Because it can't be less than n squared because you've got to look at...","zh":"因为他们使用强化学习来发展出更快的算法。太棒了。所以现在大概是2.3吗？我不知道。大概在那个范围。好吧，是的。好吧，是2.3，对吧？所以结束于2.3。你知道的，这些是……我的意思是，这真的很有趣，对吧？因为它不可能低于n平方，因为你必须查看……","start":2925.97,"end":2943.17},{"id":166,"text":"You've got to look at all entries of the matrix, right? So you might imagine, how could you do this without sort of n cubed? Anyway, you can. It turns out those algorithms are utterly and completely useless in practice. Just utterly, completely, right? I mean, maybe sometime in the future they won't be, but right now they're just useless, right? Super interesting. And weirdly...","zh":"你必须查看矩阵中的所有元素，对吧？所以你可能会想，怎么能不用n立方的复杂度来做到这一点呢？不管怎样，你可以做到。事实上，这些算法在实践中完全无用。彻底、完全无用，对吧？我的意思是，也许在未来的某个时候它们不会无用，但目前它们只是完全无用，对吧？超级有趣。而且奇怪的是……","start":2943.37,"end":2966.1},{"id":167,"text":"the methods people use to show that low complexity in theory are actually extremely close to the methods people use to make solving these things fast in practice. So I will say what that is shortly. And that part is not obvious at all. So the idea is super useful, but the actual results are utterly useless. Right, those. Okay, back to this. So what's cool is if A has got some structure to it,","zh":"人们用来在理论上展示低复杂度的方法实际上与人们用来在实践中快速求解这些方程的方法极其接近。我稍后会说清楚这一点。而这一点显然并不明显。所以这个想法非常有用，但实际的结果却完全无用。对，那些。好吧，回到这个话题。有趣的是，如果A具有某种结构，","start":2966.53,"end":2993.19},{"id":168,"text":"Then you can actually solve this a lot faster. I mean, here's like a no-brainer. What if I told you A is diagonal? Then you're like, yeah, I know how to solve A equals B when A is diagonal. But I said, what if A was a million by a million? You'd say...","zh":"那么你实际上可以更快地求解这个问题。我的意思是，这里是一个显而易见的例子。如果我告诉你A是对角矩阵，那么你会说，是的，我知道如何求解A等于B的情况，当A是对角矩阵时。但我说，如果A是一个一百万乘一百万的矩阵呢？你会说……","start":2993.74,"end":3010.49},{"id":169,"text":"Yeah, I can do that in about 300 microseconds on my phone. Everybody see this? And you go, but how would you store a million? And you go, ah, well, that's the point. I'm only going to store the diagonal entries. I'm not going to store the ones that are zero. I mean, that's an extreme case. I think most people would get that. A profoundly stupid case. But there's going to be others where it is not obvious at all. And we'll get to those. OK.","zh":"是的，我可以在手机上大约300微秒内完成这个操作。大家看到了吗？然后你可能会想，但你怎么存储一百万呢？接着你就会说，啊，那正是重点。我只会存储对角线上的元素，而不会存储那些为零的元素。我是说，这是一个极端的情况。我想大多数人会明白这一点。这是一个极其愚蠢的例子。但还会有其他情况，其中这一点并不明显，我们之后会谈到。好的。","start":3010.9,"end":3037.5},{"id":170,"text":"All right, so here's how this works. And it's really cool. The history is very cool. It goes back to the 60s, maybe even earlier. So a floating point operation.","zh":"好的，那么这就是它的运作方式。而且这真的很酷。它的历史也非常有趣。可以追溯到60年代，甚至更早。所以这是一个浮点运算。","start":3038.54,"end":3047.28}],"notes":["本段讨论了线性方程组求解的复杂度问题，指出一般方法的复杂度为O(n³)，但理论计算机科学中存在更优的算法，复杂度约为2.3n²。然而，这些理论上的低复杂度方法在实践中并不实用。","讲者提到，尽管存在理论上的低复杂度算法，但它们在实际应用中并不有效，这可能是因为这些算法在现实中难以实现或效率低下。","讲者进一步指出，理论上的低复杂度方法与实际中快速求解线性方程组的方法非常接近，但实际结果却常常无用，这表明理论与实践之间存在差距。","讲者通过举例说明，如果矩阵A具有某种结构（如对角矩阵），可以显著提高求解速度。例如，对角矩阵的求解可以在极短时间内完成，因为只需要存储非零元素。","讲者强调，结构化矩阵的求解方法在实际中非常重要，因为它们可以显著减少计算时间和存储需求，但需要识别和利用这些结构。","最后，讲者提到这些方法的历史可以追溯到20世纪60年代甚至更早，涉及浮点运算等基础计算技术。"],"formulas":[],"uncertainties":["reinforcement learning to grow up with a faster algorithm","end of the 2.3"],"diagram":"none","start":2880.55,"end":3047.28,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2880.55,"text":"So, you know, suppose we want to solve a set of linear equations, right? Like ax equals b here, right? So we want to solve that. You know, if a is like for general methods, it grows like n cubed, right? Oh, and I should mention something about this. In theoretical computer science, actually, the number's not n cubed. Does anyone here know what the current number is? Somebody here's got to know. Go ahead."},{"start":2908.49,"text":"By the way, I wouldn't know, so if you say the wrong number, it's totally fine. I mean, I know the range it is. What is it? Yeah, okay, it's around 2.4, maybe 2.3 something. I have no idea."},{"start":2925.97,"text":"because they use reinforcement learning to grow up with a faster algorithm. Awesome. So it's, what, 2.3 now? I don't know. Somewhere around there. Okay, yeah. Okay, it's 2.3, right? So end of the 2.3. Now, you know, these are... I mean, that is fascinating, right? Because it can't be less than n squared because you've got to look at..."},{"start":2943.37,"text":"You've got to look at all entries of the matrix, right? So you might imagine, how could you do this without sort of n cubed? Anyway, you can. It turns out those algorithms are utterly and completely useless in practice. Just utterly, completely, right? I mean, maybe sometime in the future they won't be, but right now they're just useless, right? Super interesting. And weirdly..."},{"start":2966.53,"text":"the methods people use to show that low complexity in theory are actually extremely close to the methods people use to make solving these things fast in practice. So I will say what that is shortly. And that part is not obvious at all. So the idea is super useful, but the actual results are utterly useless. Right, those. Okay, back to this. So what's cool is if A has got some structure to it,"},{"start":2993.74,"text":"Then you can actually solve this a lot faster. I mean, here's like a no-brainer. What if I told you A is diagonal? Then you're like, yeah, I know how to solve A equals B when A is diagonal. But I said, what if A was a million by a million? You'd say..."},{"start":3010.9,"text":"Yeah, I can do that in about 300 microseconds on my phone. Everybody see this? And you go, but how would you store a million? And you go, ah, well, that's the point. I'm only going to store the diagonal entries. I'm not going to store the ones that are zero. I mean, that's an extreme case. I think most people would get that. A profoundly stupid case. But there's going to be others where it is not obvious at all. And we'll get to those. OK."},{"start":3038.54,"text":"All right, so here's how this works. And it's really cool. The history is very cool. It goes back to the 60s, maybe even earlier. So a floating point operation."}],"speech_gaps":[],"frame":"../frames/v012/018.webp","frame_time":2892.55},{"title":"计算复杂度与BLAS","segments":[{"id":171,"text":"is, you know, it's like an addition of two floating point numbers, subtraction, multiplication, or division. The truth is that's a big old lie because I think a division takes something like eight times as long as an add or something like that. But, you know, like this is just going to be, this is just for order of magnitude. I'll also say other reasons why all of this model is completely wrong, but it's fine. It's good enough for this.","zh":"也就是说，你知道的，这就像两个浮点数的加法、减法、乘法或除法。事实上，这完全是谎言，因为我觉得除法可能需要加法或乘法大约八倍的时间。但你知道的，这只是为了数量级的估计。我也会说，所有这些模型完全错误的原因有很多，但没关系。这对现在来说已经足够好了。","start":3048.15,"end":3069.93},{"id":172,"text":"And some people got weird in the 60s and they decided a floating point operation was actually a multiply plus an add plus some indexing work. And you're like, okay, whatever. So here's what you do. You look at an algorithm that does stuff and you count the number of flops.","zh":"有些人早在60年代就搞得很奇怪，他们决定一个浮点运算实际上是乘法加上加法再加上一些索引操作。你可能会想，好吧，随便你。所以这里你该怎么做呢？你看看一个执行操作的算法，然后计算它的浮点运算次数（flops）。","start":3071.22,"end":3091.72},{"id":173,"text":"as a, typically polynomial, there might be a log in there,","zh":"通常是一个多项式，里面可能包含一个对数，","start":3092.78,"end":3096.24},{"id":174,"text":"which people just, a log is just like,","zh":"人们只是把对数当作，","start":3096.32,"end":3098.68},{"id":175,"text":"you just change it to a constant, right?","zh":"你把它换成一个常数，对吧？","start":3098.76,"end":3100.24},{"id":176,"text":"Because that's what it really is in practice, right?","zh":"因为在实际应用中，它其实就是这样的，对吧？","start":3100.32,"end":3102.2},{"id":177,"text":"So you look, you express as a polynomial function","zh":"所以你观察，你把它表示为问题维度的多项式函数，","start":3102.94,"end":3106.26},{"id":178,"text":"of the problem dimension, and you simplify,","zh":"然后进行简化，","start":3106.26,"end":3107.56},{"id":179,"text":"you only keep the leading terms,","zh":"你只保留主导项，","start":3107.66,"end":3108.6},{"id":180,"text":"because this is very crude, right?","zh":"因为这样非常粗略，对吧？","start":3108.76,"end":3110.84},{"id":181,"text":"So it is not remotely a predictor,","zh":"所以它根本不是什么预测器，","start":3111.2,"end":3116.8},{"id":182,"text":"a good predictor of computation time on modern computers.","zh":"更不用说对现代计算机计算时间的良好预测了。","start":3116.84,"end":3119.94},{"id":183,"text":"And it's just changing, it's getting all very weird","zh":"而且它一直在变化，变得非常奇怪","start":3120.1,"end":3122.16},{"id":184,"text":"and all that kind of stuff right uh i mean this should be kind of obvious right um okay uh but","zh":"以及所有这类事情，嗯，我的意思是，这应该有点显而易见，对吧？嗯，好的，嗯，但是","start":3122.16,"end":3130.64},{"id":185,"text":"it's useful as a rough estimate of complexity and a lot of people divide all these things in their","zh":"它作为复杂度的粗略估计是有用的，很多人会把这些东西在脑海中分成各种类别，像这样，嗯，所以这种方法","start":3130.64,"end":3135.08},{"id":186,"text":"head into into various groups like that um so the way and this is also historical so uh vector vector","zh":"这也是历史性的，所以嗯，向量向量","start":3135.08,"end":3144.32},{"id":187,"text":"operations are ones that take like two you know two vectors right uh and you have an inner product","zh":"操作是指像这样处理两个向量的操作，对吧？","start":3144.32,"end":3149.88},{"id":188,"text":"you know what does that take well i have to multiply xi by yi for each so that's n multiplies","zh":"你知道这需要什么吗？我需要对每个元素进行 xi 乘以 yi 的操作，所以这是 n 次乘法","start":3149.88,"end":3155.42},{"id":189,"text":"right then i have n minus one adds because i have to add you know the x1 y1 plus x2 y2 and blah blah","zh":"然后我需要进行 n 减 1 次加法，因为我要把 x1 y1 加上 x2 y2，依此类推","start":3155.42,"end":3161.58},{"id":190,"text":"blah okay so you know basically inner product people would just say n i mean the two is silly","zh":"嗯，所以基本上内积的人会直接说 n，我意思是那两个是多余的","start":3161.58,"end":3167.28},{"id":191,"text":"so you just say end um the the the sum would be the same thing it's just like n n flops um","zh":"所以你只需要说 n，这个总和其实就是同样的事情，它只是需要 n 次浮点运算","start":3167.28,"end":3175.28},{"id":192,"text":"And by the way, these have very cool names.","zh":"顺便说一句，这些操作有非常酷的名字。","start":3175.28,"end":3178.66},{"id":193,"text":"That's also a retro name, so if you know this, you can impress people.","zh":"这也是一个复古的名字，如果你知道这个，你就能给人留下深刻印象。","start":3179.08,"end":3182.46},{"id":194,"text":"So this is, the first one, this is called BLAS, B-L-A-S, Level 1.","zh":"所以这是第一个，这被称为 BLAS，B-L-A-S，级别 1。","start":3183.04,"end":3188.64},{"id":195,"text":"Second is called BLAS Level 2, and that's BLAS Level 3.","zh":"第二种被称为BLAS Level 2，而第三种是BLAS Level 3。","start":3189.26,"end":3192.9},{"id":196,"text":"BLAS is Basic Linear Algebra Subroutines, that's from the 1960s.","zh":"BLAS是基础线性代数子程序，这是从1960年代开始的。","start":3193.28,"end":3197.72},{"id":197,"text":"So this is, but it's actually a very good distinction to be thinking about, right? Okay, so let's, you know, and then by the way, I mean, some of this persists, but gets like really crazy when you start looking at things like GPUs. And, you know, God help you if you are looking at TPUs. But anyway, so on GPUs, they're like crazy optimized for this.","zh":"所以这是一个，但其实这是一个非常好的区分点，对吧？好的，那么，顺便说一下，我意思是，一些内容仍然存在，但当你开始考虑像GPU这样的东西时，情况会变得非常复杂。而且，如果你在考虑TPU的话，上帝保佑你。不过，总之，在GPU上，它们对此进行了非常极致的优化。","start":3199.4,"end":3225.88}],"notes":["本段讨论了计算复杂度的估算方法，指出浮点运算（FLOPs）的计数方式，以及在现代计算机中，这种估算方法并不准确。讲者提到，虽然FLOPs可以作为复杂度的粗略估计，但实际计算时间可能与之相差甚远。","讲者提到，人们在60年代开始将浮点运算视为乘法、加法和索引操作的组合，并指出在实际中，人们通常会将对数项视为常数，从而简化复杂度的表达式。","讲者进一步说明，计算复杂度通常以问题维度的多项式形式表达，只保留主导项，因为这种估算方式非常粗略。","讲者指出，虽然FLOPs估算方法在现代计算机中不是很好的预测器，但它仍然被广泛用于复杂度的粗略估计。","讲者以向量内积为例，说明如何计算FLOPs。内积需要n次乘法和n-1次加法，因此通常简化为n次FLOPs。","讲者提到BLAS（Basic Linear Algebra Subroutines）的三个级别，其中Level 1涉及向量操作，Level 2涉及矩阵-向量操作，Level 3涉及矩阵-矩阵操作。BLAS是1960年代开发的，至今仍被广泛使用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3048.15,"end":3225.88,"asr_flags":[],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":3048.15,"text":"is, you know, it's like an addition of two floating point numbers, subtraction, multiplication, or division. The truth is that's a big old lie because I think a division takes something like eight times as long as an add or something like that. But, you know, like this is just going to be, this is just for order of magnitude. I'll also say other reasons why all of this model is completely wrong, but it's fine. It's good enough for this."},{"start":3071.22,"text":"And some people got weird in the 60s and they decided a floating point operation was actually a multiply plus an add plus some indexing work. And you're like, okay, whatever. So here's what you do. You look at an algorithm that does stuff and you count the number of flops."},{"start":3092.78,"text":"as a, typically polynomial, there might be a log in there,"},{"start":3096.32,"text":"which people just, a log is just like,"},{"start":3098.76,"text":"you just change it to a constant, right?"},{"start":3100.32,"text":"Because that's what it really is in practice, right?"},{"start":3102.94,"text":"So you look, you express as a polynomial function"},{"start":3106.26,"text":"of the problem dimension, and you simplify,"},{"start":3107.66,"text":"you only keep the leading terms,"},{"start":3108.76,"text":"because this is very crude, right?"},{"start":3111.2,"text":"So it is not remotely a predictor,"},{"start":3116.84,"text":"a good predictor of computation time on modern computers."},{"start":3120.1,"text":"And it's just changing, it's getting all very weird"},{"start":3122.16,"text":"and all that kind of stuff right uh i mean this should be kind of obvious right um okay uh but"},{"start":3130.64,"text":"it's useful as a rough estimate of complexity and a lot of people divide all these things in their"},{"start":3135.08,"text":"head into into various groups like that um so the way and this is also historical so uh vector vector"},{"start":3144.32,"text":"operations are ones that take like two you know two vectors right uh and you have an inner product"},{"start":3149.88,"text":"you know what does that take well i have to multiply xi by yi for each so that's n multiplies"},{"start":3155.42,"text":"right then i have n minus one adds because i have to add you know the x1 y1 plus x2 y2 and blah blah"},{"start":3161.58,"text":"blah okay so you know basically inner product people would just say n i mean the two is silly"},{"start":3167.28,"text":"so you just say end um the the the sum would be the same thing it's just like n n flops um"},{"start":3175.28,"text":"And by the way, these have very cool names."},{"start":3179.08,"text":"That's also a retro name, so if you know this, you can impress people."},{"start":3183.04,"text":"So this is, the first one, this is called BLAS, B-L-A-S, Level 1."},{"start":3189.26,"text":"Second is called BLAS Level 2, and that's BLAS Level 3."},{"start":3193.28,"text":"BLAS is Basic Linear Algebra Subroutines, that's from the 1960s."},{"start":3199.4,"text":"So this is, but it's actually a very good distinction to be thinking about, right? Okay, so let's, you know, and then by the way, I mean, some of this persists, but gets like really crazy when you start looking at things like GPUs. And, you know, God help you if you are looking at TPUs. But anyway, so on GPUs, they're like crazy optimized for this."}],"speech_gaps":[],"frame":"../frames/v012/019.webp","frame_time":3060.15},{"title":"矩阵乘法的计算复杂度与稀疏性","segments":[{"id":198,"text":"right so there you can just get like just insane speed right so anyway well well i'll make some some mentions of that uh later and these are things like you should know right like if you're in the middle of if you're putting something together and you'd say that you'd say you can't multiply like a you know those two matrices together","start":3226.36,"end":3246.73},{"id":199,"text":"you should step back and say, oh, that's BLAST level 3. And I think our friends at NVIDIA have a really good idea about that. I think we can do just fine, thank you. So, okay. All right, so you can also look at the numbers here, right? That BLAST level 1 are kind of linear in the single dimension, right? BLAST level 2, you know, if you're going to form AX, right, matrix vector multiply, that's going to be, it's like basically MN, the product of the two.","start":3247.27,"end":3276.41},{"id":200,"text":"And let's see. Yeah, this is fine. I mean, if things are sparse, it gets very interesting. That's a structure everyone should know about. So sparse, you know, how do you calculate the inner product of two sparse vectors? And how, you know, roughly speaking, how much does it cost? I'll give you two vectors, each dimension 100 million. They're sparse. Each one has 100,000 entries.","start":3278.61,"end":3309.52},{"id":201,"text":"You tell me. I want the inner product of the two. What does it take? How do you do it? Also, I want to know what the flop count is. Yeah, what do you do? Go ahead. Yeah, what you do is the only time you ever have to do anything is when there's an entry.","start":3310.18,"end":3335.82},{"id":202,"text":"that's non-zero in both vectors right so the absolute so the here's a big upper bound on on the number of flops it could take right it's the minimum of the number of non-zeros everybody got that of the two right so that's an example um matrix vector","start":3336.36,"end":3353.84},{"id":203,"text":"Same story, right? If A is sparse and I multiply by a vector, that's going to be, you're going to have a whole lot. It's going to depend on capital N, the number of non-zero elements, right? Okay. And there's other structures, right? Like what if I gave you A as a low-rank factorization, right? So suppose I gave you A as a million-by-million matrix, which you can't store.","start":3354.38,"end":3382.18},{"id":204,"text":"But what if I gave it to you as the product of a million by 20 matrix and a 20 by million matrix, both of which I can store on my phone, right?","start":3382.87,"end":3393.83},{"id":205,"text":"Then how do you multiply, how do you actually form AX in that case, right?","start":3394.15,"end":3399.87},{"id":206,"text":"Here would be the wrong way.","start":3400.35,"end":3401.49},{"id":207,"text":"You would do, this is the absolutely wrong way, right?","start":3402.37,"end":3406.11}],"notes":["本段主要讲解矩阵乘法的计算复杂度，特别是BLAST（Basic Linear Algebra Subprograms）级别的操作。BLAST level 1涉及单维线性操作，BLAST level 2涉及矩阵与向量相乘，其复杂度为MN，其中M和N是矩阵的维度。BLAST level 3涉及矩阵与矩阵相乘，复杂度为MNK，其中K是中间维度。","接着，讲者讨论了稀疏矩阵的计算效率。稀疏矩阵中非零元素较少，因此计算内积时，只需处理非零元素，从而减少计算量。例如，两个稀疏向量的内积计算复杂度取决于非零元素的数量，而不是向量的总维度。","讲者进一步说明，当矩阵A是稀疏矩阵时，与向量相乘的复杂度取决于非零元素的数量，而不是矩阵的总维度。这表明稀疏性可以显著降低计算复杂度。","讲者还提到低秩分解的结构，即当矩阵A可以表示为两个较小矩阵的乘积时，可以有效存储和计算。例如，一个百万乘百万的矩阵可以通过两个百万乘20和20乘百万的矩阵相乘来表示，从而节省存储空间。","最后，讲者指出，直接计算矩阵乘积的方式是错误的，强调了正确利用稀疏性和低秩分解结构的重要性。","这些内容帮助学生理解矩阵运算的复杂度分析，以及如何利用稀疏性和低秩分解结构优化计算效率。"],"formulas":[],"uncertainties":["BLAST level 3的具体复杂度未明确说明，可能为MNK，但未确认。","稀疏矩阵内积的计算复杂度未明确给出公式，但提到与非零元素数量有关。","低秩分解的矩阵乘法方式未明确给出公式，但提到存储和计算方式的优化。"],"diagram":"none","start":3226.36,"end":3406.11,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3226.36,"text":"right so there you can just get like just insane speed right so anyway well well i'll make some some mentions of that uh later and these are things like you should know right like if you're in the middle of if you're putting something together and you'd say that you'd say you can't multiply like a you know those two matrices together"},{"start":3247.27,"text":"you should step back and say, oh, that's BLAST level 3. And I think our friends at NVIDIA have a really good idea about that. I think we can do just fine, thank you. So, okay. All right, so you can also look at the numbers here, right? That BLAST level 1 are kind of linear in the single dimension, right? BLAST level 2, you know, if you're going to form AX, right, matrix vector multiply, that's going to be, it's like basically MN, the product of the two."},{"start":3278.61,"text":"And let's see. Yeah, this is fine. I mean, if things are sparse, it gets very interesting. That's a structure everyone should know about. So sparse, you know, how do you calculate the inner product of two sparse vectors? And how, you know, roughly speaking, how much does it cost? I'll give you two vectors, each dimension 100 million. They're sparse. Each one has 100,000 entries."},{"start":3310.18,"text":"Y
