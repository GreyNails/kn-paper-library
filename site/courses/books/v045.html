n. And this has been studied for quite a while, this kind of generative models for images. I think before this, people are using GANs and variational autoencoders."},{"id":5,"text":"And now the diffusion model is the predominant approach. I think it's much better than both GANs and variational autoencoders. And that's why we don't teach GANs and variational autoencoders anymore. I think I still have some lecture notes in the notes about variational autoencoders. If you're interested, you can read them. But now the default way is doing diffusion models. And also it has..."},{"id":6,"text":"applications in videos and robotics. So that's why this is the... By the way, actually, people have been using this for languages as well. I think Professor Staffan Ehrman, so he actually..."},{"id":7,"text":"has a few papers on this, and he has some startup, I think, trying to make these large-language models much faster using diffusion models. One of the benefits of diffusion model is that it can generate in parallel in some sense, so that you are..."},{"id":8,"text":"your inference time might be faster than autoregressive model. I know we haven't talked about autoregressive model yet. But anyway, these are just the broader backgrounds. You don't have to understand every detail here. Anyway, so to zoom in and to make it narrow, I think the goal we have today is just that, abstractly speaking, you have some kind of distribution of data, let's say p data."}],"notes":["本段介绍了扩散模型的基本概念，指出其主要用于图像生成，但也被应用于视频和机器人领域。讲者提到扩散模型与传统的大型语言模型有所不同，并且在训练过程中需要某种形式的推理或EM算法。","讲者强调扩散模型目前是图像生成的主流方法，优于GAN和变分自编码器。同时，扩散模型在语言模型中的应用也正在被探索，例如通过并行生成来加快推理速度。","讲者提到扩散模型的一个优势是其可以并行生成，这可能使得推理时间比自回归模型更快。虽然自回归模型尚未被详细讨论，但这是扩散模型的一个重要特性。","讲者指出，虽然课程中不再教授GAN和变分自编码器，但仍有相关的讲义可供参考。这表明扩散模型已成为当前的主流方法。","讲者提到扩散模型在语言模型中的应用，例如通过并行生成来提高效率。这表明扩散模型不仅限于图像生成，还可能在其他领域发挥作用。","最后，讲者提到课程的目标是聚焦于扩散模型的基本概念，即从数据分布中生成类似的数据。这为后续的深入讲解奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.1,"end":183.0,"asr_flags":[],"raw_segments":[{"start":5.1,"text":"So we're going to talk about diffusion model today. I guess probably some of you have seen my message in ad. So we changed the order a little bit just because this is very close to the EM algorithms that Chris talked about last week. And I think it makes sense to discuss it early. So diffusion model are..."},{"start":33.18,"text":"generative models for mostly images. These days, you can do it for videos, for robotics applications. Actually, most of VLA, the Vision Language Action Model, are using diffusion models for generating the actions. So they are quite different from"},{"start":52.03,"text":"a typical large language model to some degree. And the training of the models requires some version of inference or the EM algorithm. And we'll mostly use the image as the target application. So basically, think of this task is that you have a lot of natural images and your task is to generate a clean, realistic."},{"start":76.15,"text":"image that is similar to the distribution of the images you are given with. So, for example, you can say, I'm going to generate, you know, just like I'm giving ImageNet data set, I'm going to generate images that are very similar to that. Similar in the sense that they are from the same distribution, very realistic, but not the same."},{"start":94.5,"text":"distribution. And this has been studied for quite a while, this kind of generative models for images. I think before this, people are using GANs and variational autoencoders."},{"start":105.78,"text":"And now the diffusion model is the predominant approach. I think it's much better than both GANs and variational autoencoders. And that's why we don't teach GANs and variational autoencoders anymore. I think I still have some lecture notes in the notes about variational autoencoders. If you're interested, you can read them. But now the default way is doing diffusion models. And also it has..."},{"start":127.52,"text":"applications in videos and robotics. So that's why this is the... By the way, actually, people have been using this for languages as well. I think Professor Staffan Ehrman, so he actually..."},{"start":143.63,"text":"has a few papers on this, and he has some startup, I think, trying to make these large-language models much faster using diffusion models. One of the benefits of diffusion model is that it can generate in parallel in some sense, so that you are..."},{"start":159.2,"text":"your inference time might be faster than autoregressive model. I know we haven't talked about autoregressive model yet. But anyway, these are just the broader backgrounds. You don't have to understand every detail here. Anyway, so to zoom in and to make it narrow, I think the goal we have today is just that, abstractly speaking, you have some kind of distribution of data, let's say p data."}],"speech_gaps":[],"frame":"../frames/v045/001.webp","frame_time":17.1},{"title":"扩散模型的基本概念","segments":[{"id":9,"text":"You have some empirical samples from p data. And you want to generate, you want to come up with a model such that you can generate from your model. If you take the inference of the model, then you're going to generate from this distribution. So that's kind of like the task. So you want to generate."},{"id":10,"text":"data you want to be able to generate from this distribution and you are given empirical data from this distribution. Think of this distribution as the distribution of natural images, for example."},{"id":11,"text":"And I think the notation we have is that we always use x0 as a variable that is sampled from p data in some sense. So if I write this, I mean like I generate some empirical, say, realistic images. Let's say x0 is this data distributions in Rd. This is just to set up some notation. And the core idea of this diffusion process is that during the"},{"id":12,"text":"inference time when you are generating what you are going to do is that you're going to start with"},{"id":13,"text":"a noise you're going to start with a noise something called xt let's say this is a white"},{"id":14,"text":"noise imagine you have an image with all the rgb are purely random and then you're going to apply"},{"id":15,"text":"some model backward and to generate xt minus one and you can generate xt minus two so on and so"},{"id":16,"text":"forth and then eventually you generate some x zero and this model let's call it p theta"},{"id":17,"text":"say this is the model between p theta x t minus one given x t and then you apply the model again"},{"id":18,"text":"and x t minus one given x t is one so it's a mark of chain uh when you're applying this and"},{"id":19,"text":"eventually you apply p theta x zero given x one theta is a parameter you're going to learn it's"},{"id":20,"text":"It's often a new artwork with some structure, oftentimes"},{"id":21,"text":"some kind of like MLP."},{"id":22,"text":"And then you do this in this way."},{"id":23,"text":"So basically, the goal is to learn some data such"},{"id":24,"text":"that you can generate a sequence of images"},{"id":25,"text":"and you have a really realistic image."},{"id":26,"text":"So here, this is a noise."},{"id":27,"text":"I don't have a, I'm using the black bar"},{"id":28,"text":"so I cannot really draw an image here."},{"id":29,"text":"But this is a pure noise, and this is a real image."},{"id":30,"text":"image."},{"id":31,"text":"And in this sequence, you are getting more and more"},{"id":32,"text":"kind of like a fine grain images."},{"id":33,"text":"So this is like a very blurry, and then you"},{"id":34,"text":"get a less blurry, and you start to see"},{"id":35,"text":"some kind of like contours of the objects."},{"id":36,"text":"And then eventually, it's a very clean, sharp image."},{"id":37,"text":"So it's kind of like you are denoising over time"},{"id":38,"text":"to denoise it into a clean image."},{"id":39,"text":"So that's the high level idea, the very, very high level idea."},{"id":40,"text":"So the question is, how do we learn?"}],"notes":["本段讲解了扩散模型的基本思想，即通过逐步去噪生成高质量的图像。模型从纯噪声开始，逐步生成更清晰的图像，最终得到一个真实的图像。x0表示从数据分布中采样的变量，xt表示在推理过程中逐步生成的噪声图像。","在推理过程中，模型通过反向应用一个称为pθ的模型，逐步生成更清晰的图像。这个模型通常是一个神经网络，如MLP，用于学习从噪声到真实图像的映射。","扩散模型的核心思想是通过逐步去噪，将噪声图像转化为清晰的图像。这个过程类似于在时间上逐步去除噪声，最终得到一个干净的图像。","在生成过程中，模型从纯噪声开始，逐步生成更清晰的图像，最终得到一个真实的图像。这个过程需要学习一个参数化的模型pθ，用于生成从噪声到真实图像的映射。","模型的训练目标是学习如何从噪声中生成真实的图像。这涉及到对模型参数θ的优化，使得生成的图像尽可能接近真实数据分布。","在实际应用中，扩散模型被广泛用于生成高质量的图像，如艺术作品或自然图像。模型的结构通常包括一个神经网络，用于学习从噪声到真实图像的映射。"],"formulas":[],"uncertainties":["some model backward and to generate xt minus one","x t minus one given x t is one so it's a mark of chain uh when you're applying this and","theta is a parameter you're going to learn it's"],"diagram":"none","start":184.72,"end":357.9,"asr_flags":[30],"raw_segments":[{"start":184.72,"text":"You have some empirical samples from p data. And you want to generate, you want to come up with a model such that you can generate from your model. If you take the inference of the model, then you're going to generate from this distribution. So that's kind of like the task. So you want to generate."},{"start":207.16,"text":"data you want to be able to generate from this distribution and you are given empirical data from this distribution. Think of this distribution as the distribution of natural images, for example."},{"start":218.62,"text":"And I think the notation we have is that we always use x0 as a variable that is sampled from p data in some sense. So if I write this, I mean like I generate some empirical, say, realistic images. Let's say x0 is this data distributions in Rd. This is just to set up some notation. And the core idea of this diffusion process is that during the"},{"start":246.42,"text":"inference time when you are generating what you are going to do is that you're going to start with"},{"start":250.64,"text":"a noise you're going to start with a noise something called xt let's say this is a white"},{"start":258.18,"text":"noise imagine you have an image with all the rgb are purely random and then you're going to apply"},{"start":263.5,"text":"some model backward and to generate xt minus one and you can generate xt minus two so on and so"},{"start":272.18,"text":"forth and then eventually you generate some x zero and this model let's call it p theta"},{"start":279.86,"text":"say this is the model between p theta x t minus one given x t and then you apply the model again"},{"start":287.34,"text":"and x t minus one given x t is one so it's a mark of chain uh when you're applying this and"},{"start":292.8,"text":"eventually you apply p theta x zero given x one theta is a parameter you're going to learn it's"},{"start":299.6,"text":"It's often a new artwork with some structure, oftentimes"},{"start":301.96,"text":"some kind of like MLP."},{"start":306.08,"text":"And then you do this in this way."},{"start":309.26,"text":"So basically, the goal is to learn some data such"},{"start":312.82,"text":"that you can generate a sequence of images"},{"start":315.52,"text":"and you have a really realistic image."},{"start":317.32,"text":"So here, this is a noise."},{"start":318.78,"text":"I don't have a, I'm using the black bar"},{"start":321.64,"text":"so I cannot really draw an image here."},{"start":323.52,"text":"But this is a pure noise, and this is a real image."},{"start":326.86,"text":"image."},{"start":327.16,"text":"And in this sequence, you are getting more and more"},{"start":330.16,"text":"kind of like a fine grain images."},{"start":334.8,"text":"So this is like a very blurry, and then you"},{"start":336.68,"text":"get a less blurry, and you start to see"},{"start":339.66,"text":"some kind of like contours of the objects."},{"start":341.7,"text":"And then eventually, it's a very clean, sharp image."},{"start":345.18,"text":"So it's kind of like you are denoising over time"},{"start":348.72,"text":"to denoise it into a clean image."},{"start":352.58,"text":"So that's the high level idea, the very, very high level idea."},{"start":356.56,"text":"So the question is, how do we learn?"}],"speech_gaps":[{"start":303.62,"end":305.68}],"frame":"../frames/v045/002.webp","frame_time":196.72},{"title":"前向加噪：采用讲者后文更正的根号系数","segments":[{"id":41,"text":"And the main technical approach is called this diffusion process. And the way to do it is that you say, I'm going to model in the training, I'm going to model kind of like a noising process from the clean images to the noise image. And then I'm trying to learn the reverse function in some sense. So basically, you will see that we're going to have a model where"},{"id":42,"text":"you have a model Q that generates X1 given X0. And you do the same thing here. And you do a Q Xt minus 1 given Xt minus 2. And then Q of Xt, Xt minus 1. And so you define some kind of so-called kind of noising process. And then you try to learn the"},{"id":43,"text":"the reconstruction in some sense. And actually, very interestingly, so the noising process is just adding Gaussian noise. So this noising process Q is just adding Gaussian noise."},{"id":44,"text":"I'm going to define exactly how you add Gaussian noise. But roughly speaking, you just add more noise to each of your images. And you can start from a real image to get to the noise image by keep adding noise. And then you try to learn how to reconstruct this process. And now let's discuss exactly how you add noise. So the way to add noise is that you can write it in different ways. But one way to write it is that you say x1 is equals to"},{"id":45,"text":"one minus beta one zero plus square root beta one epsilon one. So let's say epsilon one is standard Gaussian and beta is a scalar which is often close to zero. So it's a scalar between one and zero."},{"id":46,"text":"So basically what you do is you say you, let's say beta is actually relatively small, like close to zero, maybe like 1e minus 2, 1e minus 4. So basically you shrink the original image, the clean image by a little bit."},{"id":47,"text":"slightly, and then you add a little bit of noise to it. And so basically, the noise scale is very small in one step, and you shrink the original image. So basically, when you do this, you only make the original image a little bit blurry, because most of the signals are still here, and you add a little bit of noise."},{"id":48,"text":"And then you can do it next time."},{"id":49,"text":"So you see x2 is equal to 1 minus beta 2, x1 plus square root beta 2 epsilon 2,"},{"id":50,"text":"and epsilon 2 is another IAD draw from standard normal Gaussian,"},{"id":51,"text":"and beta 2 is also chosen between 0 and 1."},{"id":52,"text":"So I think exactly how you choose beta I'm not going to discuss in this lecture"},{"id":53,"text":"because there are many different ways to choose the beta."}],"notes":["扩散模型的前向过程从数据样本 x₀ 出发，逐步加入独立的标准高斯噪声。βₜ 控制每一步的噪声强度，αₜ=1−βₜ 控制原有信号的保留程度。每个 xₜ 都只依赖上一步 xₜ₋₁ 和本步新噪声，因此形成马尔可夫链。","本段早期讲述中的系数有漏写根号的情况；讲者在后文回答学生问题时明确承认并更正了这一点。本页统一采用更正后的 √αₜ 与 √βₜ，避免把转写中的缺项沿用成正式公式。","βₜ 较小时，一次更新对信号的缩小和加入的噪声都较小；反复更新后，数据逐渐被噪声掩盖。视频中的 βₜ 数值只是例子，实际噪声日程需要另行选择。"],"formulas":[{"latex":"\\alpha_t=1-\\beta_t,\\qquad \\bar\\alpha_t=\\prod_{s=1}^{t}\\alpha_s","symbols":"x₀：数据样本；xₜ：第 t 步变量；βₜ：噪声方差系数；αₜ=1−βₜ；ᾱₜ 为 α 的累乘；εₜ 是单步新噪声，ε̂ₜ 是合并后的累积噪声。","explanation":"公式采用讲者后文更正后的根号系数；所需假设和符号区别见本页说明。","evidence":"And the main technical approach is called this diffusion process. And the way to do it is that you say, I'm going to model in the training, I'm going to model kind of like a noising process from the clean images to the noise image. And then I'm trying to learn the reverse function in some sense. So basically, you will see that we're going to have a model where you have a model Q that generates X1 given X0. And you do the same thing here. And you do a Q Xt minus 1 given Xt minus 2. And then Q of Xt, Xt minus 1. And so you define some kind of so-called kind of noising process. And then you try to learn the the reconstruction in some sense. And actually, very interestingly, so the noising process is just adding Ga ":2396.58,"text":"We know it's something like adding"},{"start":2400.68,"text":"Gaussian, but then to reverse that, we're still adding variance, right?"},{"start":2404.94,"text":"Isn't that a violation or something?"},{"start":2407.92,"text":"Let me talk about that in a moment."},{"start":2409.76,"text":"Yeah, I think it's a, you know, I understand your question,"},{"start":2414.22,"text":"but let me, I can answer that, yeah."},{"start":2418.62,"text":"Okay, so maybe let's talk about that."},{"start":2420.4,"text":"I think, yeah, so why the reverse process still adding Gaussian?"},{"start":2432.74,"text":"So let me see whether I should give the, so sometimes if you think about the Brownian motion,"},{"start":2440.32,"text":"so it's like, how many have heard of like Brownian motion or something like this? Okay, great. Oh,"},{"start":2446.86,"text":"that's fantastic. So I think if you have a one dimensional case and you're just adding some"},{"start":2450.78,"text":"noise each time right something like this right so and uh and uh in the forward process you are"}],"speech_gaps":[{"start":2307.6,"end":2309.888},{"start":2309.888,"end":2313.568},{"start":2315.856,"end":2317.82},{"start":2321.104,"end":2325.456},{"start":2325.456,"end":2328.272},{"start":2329.456,"end":2331.08},{"start":2427.16,"end":2428.704}],"frame":"../frames/v045/014.webp","frame_time":2291.52},{"title":"反向恢复的不确定性，以及高斯近似的边界","segments":[{"id":358,"text":"adding noise each time so you get a bigger and bigger virus you know in some sense you know of"},{"id":359,"text":"course i'm only joining one trajectory maybe another trajectory is like this when you never"},{"id":360,"text":"know right some oh this this sounds like too aggressive you cannot change that but anyway"},{"id":361,"text":"something like this so so and um and what happens is that if you give me this point let's say this"},{"id":362,"text":"is xt, can you really recover the point before the xt minus 1?"},{"id":363,"text":"You cannot really know exactly."},{"id":364,"text":"So there's still uncertainties."},{"id":365,"text":"Even given xt, you don't really know what xt minus 1 is."},{"id":366,"text":"Because given xt, you may say, oh, maybe the previous point"},{"id":367,"text":"is here."},{"id":368,"text":"So that's how you got here, right?"},{"id":369,"text":"But it could be that you got to xt"},{"id":370,"text":"from a different trajectory."},{"id":371,"text":"It could be like you are going this way and then go here."},{"id":372,"text":"So basically, even given xt, you don't know what happens"},{"id":373,"text":"before"},{"id":374,"text":"So that answers the question about why there's still noise, because you never know how you got here. So that's why there's always a noise. This is always a dissolution. And the second question is, why is Gaussian? So Gaussian is, I think the Gaussian identity is interesting in the sense that, so in some sense, for most of this, so if you go to the continuous time,"},{"id":375,"text":"Almost every stochastic process is Gaussian. There are special cases where you have to design something. But generally speaking, the reason is that in some sense, by law of large number, if every small step you add some noise. Let's say that noise is not really Gaussian, something like Gaussian. Once you have so many steps, then you accumulate Gaussian."},{"id":376,"text":"So in some sense, it's always kind of Gaussian in some sense. And there is no so-called small enough steps. Your small step at this moment, it could be accumulation of even smaller steps. So any step is accumulation of even smaller steps. And if you have enough accumulation, you always get to a Gaussian distribution. And this is not always true. There are common examples here. That's why stochastic process is interesting. But in most of the normal regular situations, everything is Gaussian. So the forward and reverse."},{"id":377,"text":"It's always Gaussian. So actually, that's kind of what I'm trying to state here. This is a pretty deep theorem. So maybe let me just have a small distraction to talk about the continuous perspective. I kind of like to talk about this because, in some sense, this is one of the ."},{"id":378,"text":"of machine learning where you can actually talk about some of the math. Once you go to large algorithm models, it's kind of like you just write down three equations and you are done. So OK, anyway, so how do you think about a continuous perspective? So I don't expect everyone to know all the kind of notations here. I don't necessarily understand all the formal definitions, to be honest. So I think we'll stay informal to some degree. So we have a continuous time. Then how do you write this kind of like"}],"notes":["给定带噪变量 xₜ，通常不能唯一确定此前的 xₜ₋₁。反向过程描述的是一个条件分布，因此需要同时表达典型位置与剩余不确定性。","讲者随后用许多小扰动累积的直觉讨论高斯性，也承认存在反例。不能把这段概括成“所有随机过程都是高斯”或“加很多次噪声就必然高斯”；极限定理需要相应条件，模型采用高斯转移也不等于真实逆过程处处精确高斯。","阅读这一段时，把“我们选用高斯分布来建模”和“数据的真实条件分布是什么”分开。前者是可训练模型的设计，后者还取决于数据分布、前向过程和步长。"],"formulas":[],"uncertainties":["virus","one of the","kind of notations"],"diagram":"none","start":2457.5,"end":2633.07,"asr_flags":[373],"raw_segments":[{"start":2457.5,"text":"adding noise each time so you get a bigger and bigger virus you know in some sense you know of"},{"start":2461.8,"text":"course i'm only joining one trajectory maybe another trajectory is like this when you never"},{"start":2464.88,"text":"know right some oh this this sounds like too aggressive you cannot change that but anyway"},{"start":2469.22,"text":"something like this so so and um and what happens is that if you give me this point let's say this"},{"start":2475.86,"text":"is xt, can you really recover the point before the xt minus 1?"},{"start":2481.6,"text":"You cannot really know exactly."},{"start":2483.6,"text":"So there's still uncertainties."},{"start":2485.38,"text":"Even given xt, you don't really know what xt minus 1 is."},{"start":2488.02,"text":"Because given xt, you may say, oh, maybe the previous point"},{"start" use, in some sense, this is one of the ."},{"start":2605.45,"text":"of machine learning where you can actually talk about some of the math. Once you go to large algorithm models, it's kind of like you just write down three equations and you are done. So OK, anyway, so how do you think about a continuous perspective? So I don't expect everyone to know all the kind of notations here. I don't necessarily understand all the formal definitions, to be honest. So I think we'll stay informal to some degree. So we have a continuous time. Then how do you write this kind of like"}],"speech_gaps":[],"frame":"../frames/v045/015.webp","frame_time":2469.5},{"title":"扩散模型中的前向过程与布朗运动","segments":[{"id":379,"text":"forward process, what you do is you write something like this. You say d is something like you have a deterministic drift dt plus this Gaussian noise. So this is the so-called Brownian motion. Brownian motion."},{"id":380,"text":"And this is the variance, which is kind of like that beta, the beta t, or square root beta t. Oh, sorry, gt is the square root beta t, yes. And this is the Brownian motion. And this is the deterministic change, which corresponds to the difference between"},{"id":381,"text":"this and this. So that's the difference between the two steps deterministically. And there's a stochastic part. So basically, this is a deterministic case. And on the left-hand side, it's basically, this thing is kind of like the same as xt plus 1 minus xt, more or less. Here, I have one step. But if the step is really small, maybe I should say t plus dt minus xt."},{"id":382,"text":"Xt plus dt minus Xt, something like this. This is the change in one step. And there are two parts. One part is a deterministic change, and there is a stochastic change. So that's how you model this in a continuous language. And I think there is a result. I don't think this is necessarily the first."},{"id":383,"text":"result, but I think it's a convenient set. I think this is Anderson 1985. And it' is yt. And so basically, y."},{"start":2773.35,"text":"and this way. So y tau is equal to xt minus tau. That's my definition of y. I change the order and change the time direction. So that's my y. So I think this Anderson analysis that if this is the forward process, then the backward. So if you look at the stock asset process for the y tau, then it is equal to this."}],"speech_gaps":[],"frame":"../frames/v045/016.webp","frame_time":2645.47},{"title":"扩散模型中的逆过程与分布特性","segments":[{"id":386,"text":"By the way, you don't necessarily have to note down all the details here. It's all in the lecture notes, with probably fewer typos. I think the lecture notes, I checked it relatively carefully. So yeah, OK. So basically, the reverse process, if you're indexing by tau, is like this. So this part is the deterministic part, and this part is the"},{"id":387,"text":"is the stochastic part. And you can see the stochastic part is still adding gaussians. But the deterministic part is more complicated because you have to take into account that how did you generate it in the first time in some sense. And there's this part about the density because you have to incorporate in some sense. It's here to understand how you go back."},{"id":388,"text":"You have to understand a little bit about it. How you go back from here versus how you go back from here is different. Because if you are here, the most likely you are going, your estimate is going to be lower because it's less likely to... "},{"id":389,"text":"to arrive here this way. It's more likely you are going arrive at this high point through below as opposed to through above. So that's why your distribution will be more likely to drift. The mean of your previous point will likely drift downward if your Xt is really high. But if Xt is kind of like low or maybe in the middle, then it should be symmetric in some sense."},{"id":390,"text":"The double bar? The double bar is just the Gaussian, like the Brownian motion in the reverse directi w you go back from here versus how you go back from here is different. Because if you are here, the most likely you are going, your estimate is going to be lower because it's less likely to..."},{"start":2904.17,"text":"to arrive here this way. It's more likely you are going arrive at this high point through below as opposed to through above. So that's why your distribution will be more likely to drift. The mean of your previous point will likely drift downward if your Xt is really high. But if Xt is kind of like low or maybe in the middle, then it should be symmetric in some sense."},{"start":2928.87,"text":"The double bar? The double bar is just the Gaussian, like the Brownian motion in the reverse direction. It's just that you use a different notation to indicate . And actually, I think, yeah. OK. Sounds good."},{"start":2954.81,"text":"And this term is just literally the same as this."},{"start":2957.43,"text":"It's just in a different direction"},{"start":2959.51,"text":"because just now you are reverting the direction."},{"start":2963.19,"text":"So in some sense, these two terms are the same."},{"start":2966.07,"text":"And this term is what actually matters in some sense."},{"start":2974.37,"text":"Let's see."},{"start":2976.11,"text":"I even have some derivations for why this is true."},{"start":2978.95,"text":"But I think maybe..."}],"speech_gaps":[{"start":2968.67,"end":2970.48},{"start":2971.28,"end":2973.008}],"frame":"../frames/v045/017.webp","frame_time":2830.89},{"title":"概率密度的写法：变量、均值与方差","segments":[{"id":399,"text":"So maybe one thing here is that"},{"id":400,"text":"why I brought this up"},{"id":401,"text":"is to justify"},{"id":402,"text":"that this is a"},{"id":403,"text":"a Gaussian."},{"id":404,"text":"Because the reverse process in a continuous thing"},{"id":405,"text":"is a Gaussian distribution."},{"id":406,"text":"So that's why it makes sense in a discrete case,"},{"id":407,"text":"you parameterize it by a Gaussian."},{"id":408,"text":"That ou know you see this many times so it's good to understand what this means but um um but it's not kind of like that um it's a little bit ambiguous anyway okay so okay so now the next 20 minutes i think let's talk about how to learn um the diffusion models probably we won't able to finish it exactly so but that's okay so um so how do you learn this"},{"start":3326.84,"text":"You use this, the general approach is still this EM algorithm. So the elbow, the evidence lower bound, or variational lower bounds, whatever you call it, they are the same thing. So basically, you want to do maximum likelihood, but you have some hidden variables, and you cannot do that. So you have to use the evidence lower bound. And you derive the elbow lower bound, and then you try to optimize the lower bound."},{"start":3351.79,"text":"So that's the general approach."},{"start":3353.39,"text":"So let's try to go through it."},{"start":3354.87,"text":"There are some nuances on how do you actually"},{"start":3357.09,"text":"apply the methodology."}],"speech_gaps":[],"frame":"../frames/v045/019.webp","frame_time":3190.64},{"title":"ELBO：期望重建项减去 KL 项","segments":[{"id":457,"text":"So the goal is to maximize log p theta of x0."},{"id":458,"text":"So by the way, p theta of x0 is basically"},{"id":459,"text":"the marginal distribution of x0 under this whole p theta thing"},{"id":460,"text":"like this."},{"id":461,"text":"Because this p theta defines a process."},{"id":462,"text":"P theta defines a process, which means"},{"id":463,"text":"it defines a joint distribution over all the variables,"},{"id":464,"text":"x0 up to xt."},{"id":465,"text":"And also, it defines a marginal distribution over x0."},{"id":466,"text":"So this means the marginal distribution of x0"},{"id":467,"text":"under that process defined by P theta."},{"id":468,"text":"So you want to maximize this."},{"id":469,"text":"And you have a strong distribution of x0 to xt."},{"id":470,"text":"right?"},{"id":471,"text":"So I think the way to do this is that you treat xt,"},{"id":472,"text":"and you treat this as the latent variable z in the elbow"},{"id":473,"text":"that Chris talked about."},{"id":474,"text":"And you treat this the same as x."},{"id":475,"text":"So in some sense, if you do all of this as z"},{"id":476,"text":"and all of this as x, and then you"},{"id":477,"text":"you can apply them on the lower bound in some sense."},{"id":478,"text":"And oh, and by the way, so maybe let"},{"id":479,"text":"me try to remind ourselves what's"},{"id":480,"text":"the elbow we have talked about."},{"id":481,"text":"I think the elbow we have talked about is the"},{"id":482,"text":"the log of p, x, say, theta is larger than, I think,"},{"id":483,"text":"expectation under some distribution q,"},{"id":484,"text":"say, the log of p,"},{"id":485,"text":"x given z minus KL between q and p."},{"id":486,"text":"and p, the distribution of z."},{"id":487,"text":"And this is the notation we used in the previous lectures."},{"id":488,"text":"So you have some kind of posterior q,"},{"id":489,"text":"which is to estimate z given x."},{"id":490,"text":"And you first sample it from this posterior,"},{"id":491,"text":"and you look at the reconstruction loss."},{"id":492,"text":"And this minus the KL divergence between the prior,"},{"id":493,"text":"prior, the Pz, and the posterior Q."},{"id":494,"text":"So that's the elbow lower bound that we're in."},{"id":495,"text":"One of the versions of the elbow lower bound,"},{"id":496,"text":"and there are several different equivalent versions."},{"id":497,"text":"So we're going to use this."},{"id":498,"text":"And so what is the Q we are going to apply?"},{"id":499,"text":"So let's see."}],"notes":["用潜变量 z 表示中间变量时，ELBO 可以分成两部分：在 q(z|x) 下的期望对数似然，以及 q(z|x) 相对先验 pθ(z) 的 KL 散度。原始口头讲述可能略掉期望符号，正式排版时必须保留。","KL 项前的负号意味着：在最大化下界时，较大的分布失配会降低目标。它不是说 KL 本身为负，也不是说最小化一个负 KL 就能训练模型。","这里的 q 是引入的辅助条件分布；在本课程随后构造的扩散目标中，q 来自已知前向加噪过程。不同应用对 q 的定义不同，因此不能只凭一个字母就把它固定解释成某个特定模型的后验。"],"formulas":[{"latex":"\\log p_\\theta(x)\\geq\\mathbb E_{q(z\\mid x)}[\\log p_\\theta(x\\mid z)]-D_{\\mathrm{KL}}\\!\\left(q(z\\mid x)\\,\\|\\,p_\\theta(z)\\right)","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版；适用假设及记号修复已在上文说明。","evidence":"So the goal is to maximize log p theta of x0. So by the way, p theta of x0 is basically the marginal distribution of x0 under this whole p theta thing like this. Because this p theta defines a process. P theta defines a process, which means it defines a joint distribution over all the variables, x0 up to xt. And also, it defines a marginal distribution over x0. So this means the marginal distribution of x0 under that process defined by P theta. So you want to maximize this. And you have a strong distribution of x0 to xt. right? So I think the way to do this is that you treat xt, and you treat this as the latent variable z in the elbow that Chris talked about. And you treat this the same as x. So in some sense, if you do all of this as z and all of this as x, and then you you can apply them on the lower bound in some sense. And oh, and by the way, so maybe let me try to remind ourselves what's the elbow we have talked about. I think the elbow we have talked about is the the log of p, x, say, theta is larger than, I think, expectation under some distribution q, say, the log of p, x given z minus KL between q and p. and p, the distribution of z. And this is the notation we used in the previous lectures. So you have some kind of posterior q, which is to estimate z given x. And you first sample it from this posterior, and you look at the reconstruction loss. And this minus the KL divergence between the prior, prior, the Pz, and the posterior Q. So that's the elbow lower bound that we're in. One of the versions of the elbow lower bound, and there are several different equivalent versions. So we're going to use this. And so what is the Q we are going to apply? So let's see."}],"uncertainties":["log of p, x, say, theta is larger than, I think"],"diagram":"none","start":3358.83,"end":3532.74,"asr_flags":[471],"raw_segments":[{"start":3358.83,"text":"So the goal is to maximize log p theta of x0."},{"start":3367.33,"text":"So by the way, p theta of x0 is basically"},{"start":3371.07,"text":"the marginal distribution of x0 under this whole p theta thing"},{"start":3374.75,"text":"like this."},{"start":3375.41,"text":"Because this p theta defines a process."},{"start":3378.07,"text":"P theta defines a process, which means"},{"start":3381.77,"text":"it defines a joint distribution over all the variables,"},{"start":3383.99,"text":"x0 up to xt."},{"start":3385.93,"text":"And also, it defines a marginal distribution over x0."},{"start":3390.23,"text":"So this means the marginal distribution of x0"},{"start":3395.39,"text":"under that process defined by P theta."},{"start":3397.21,"text":"So you want to maximize this."},{"start":3401.71,"text":"And you have a strong distribution of x0 to xt."},{"start":3406.33,"text":"right?"},{"start":3406.65,"text":"So I think the way to do this is that you treat xt,"},{"start":3415.85,"text":"and you treat this as the latent variable z in the elbow"},{"start":3424.47,"text":"that Chris talked about."},{"start":3426.71,"text":"And you treat this the same as x."},{"start":3428.69,"text":"So in some sense, if you do all of this as z"},{"start":3431.11,"text":"and all of this as x, and then you"},{"start":3433.31,"text":"you can apply them on the lower bound in some sense."},{"start":3440.11,"text":"And oh, and by the way, so maybe let"},{"start":3443.15,"text":"me try to remind ourselves what's"},{"start":3446.09,"text":"the elbow we have talked about."},{"start":3449.33,"text":"I think the elbow we have talked about is the"},{"start":3452.2,"text":"the log of p, x, say, theta is larger than, I think,"},{"start":3463.48,"text":"expectation under some distribution q,"},{"start":3468.02,"text":"say, the log of p,"},{"start":3476.72,"text":"x given z minus KL between q and p."},{"start":3482.2,"text":"and p, the distribution of z."},{"start":3485.96,"text":"And this is the notation we used in the previous lectures."},{"start":3489.6,"text":"So you have some kind of posterior q,"},{"start":3493.44,"text":"which is to estimate z given x."},{"start":3495.86,"text":"And you first sample it from this posterior,"},{"start":3500.52,"text":"and you look at the reconstruction loss."},{"start":3502.64,"text":"And this minus the KL divergence between the prior,"},{"start":3505.34,"text":"prior, the Pz, and the posterior Q."},{"start":3512.52,"text":"So that's the elbow lower bound that we're in."},{"start":3518.18,"text":"One of the versions of the elbow lower bound,"},{"start":3519.9,"text":"and there are several different equivalent versions."},{"start":3521.78,"text":"So we're going to use this."},{"start":3526.14,"text":"And so what is the Q we are going to apply?"},{"start":3531.66,"text":"So let's see."}],"speech_gaps":[{"start":3399.408,"end":3401.31},{"start":3471.28,"end":3473.04},{"start":3523.696,"end":3525.74}],"frame":"../frames/v045/020.webp","frame_time":3370.83},{"title":"扩散模型中的后验分布与KL散度","segments":[{"id":500,"text":"So the qz in the previous lecture knows corresponds to here, you know, for our case, it's the"},{"id":501,"text":"q x1 to t gamma x0, because you can see that z is my, x-minus after xt is my z."},{"id":502,"text":"So qz is the posterior where you try to infer the latent variable."},{"id":503,"text":"So that's why it's about giving the"},{"id":504,"text":"x0, how do you federate a variable? That's why this is my correspondence. I'm trying to apply what we have learned last time to this case. So that's why I'm making a correspondence between the variables. So this is my qz. And the reason why we didn't write qz given x is because"},{"id":505,"text":"Last time, the x is kind of like a fixed variable. So in some sense, you should read and write qz given x in the previous lecture. But just in that last lecture bution between X0 and Xt. So basically, for every"},{"id":538,"text":"every trajectory, you have a density. You have a number. So you have a distribution over the trajectories. And it's kind of like if you have a multi-variable distribution over x1 up to xt. And then you can look at all the conditionals under this joint distribution. You can look at maybe xt minus 1 given xt. You can look at any of the conditionals once you have a joint distribution."},{"id":539,"text":"So that's q. So every time I say x1 to t given x0, that means that you look at the joint distribution and you say, oh, I'm looking at the conditionals under that joint distribution. Does that make sense? Yeah. And p theta is this artificial one I defined."},{"id":540,"text":"in this way. So it also induces a joint distribution. Because once you give me theta, I'm going to give you a joint distribution over x1 up to xt. And then you can look at any conditionals, whatever you want, under that joint distribution. So everything there is defined as p theta. Any other questions?"},{"id":541,"text":"and the denoising process as the prior. I'm kind of confused by that. Like, why are you using that most of the solutions? Because I mean, like, prior is basically what you thought about the providence in the whole thing to become. And then post-tune is something you learn later. And then post-tune is like the worst. Yes, I understand. So, that's intentional, yes. So,"},{"id":542,"text":"In some sense, it's kind of like a, yeah, I think that's the case. Just before, both of these are parametrized. And now you just make one of them not parametrized. Like in VAE, we didn't teach it. I don't know. But in VAE, you see everything is parametrized by something. This is theta. This is phi. But now just some part of it becomes a fixed process. Maybe another way to think about it is that this formula,"}],"notes":["本段讲解了扩散模型中Q和P的分布差异。Q是真实数据分布，定义了从X0到Xt的前向过程，每个轨迹都有一个密度，从而形成轨迹上的分布。P_theta是人工定义的分布，通过参数θ定义了从X1到Xt的联合分布，并允许查看任意条件概率。","讲者提到，当拥有联合分布时，可以查看任意条件概率，例如xt-1给定xt。这说明了联合分布的条件概率性质，是理解扩散模型中生成过程的关键。","讲者提到P_theta是人工定义的分布，通过参数θ定义了从X1到Xt的联合分布，并允许查看任意条件概率。这表明P_theta是模型生成过程的核心，与Q的自然分布形成对比。","讲者提到，将去噪过程视为先验，这可能引起混淆。先验通常指对数据分布的先验知识，而后验则是通过学习得到的。讲者指出，这种设计是故意的，可能与VAE中的参数化方式不同。","讲者提到，VAE中所有内容都是参数化的，而扩散模型中部分过程是固定的。这说明了扩散模型与VAE在参数化方式上的区别，即部分过程不再依赖参数θ。","讲者提到，另一种思考方式是将公式视为某种关系，但未明确说明具体公式。这表明讲者可能在讨论某种数学关系，但未明确表达，需要进一步澄清。"],"formulas":[{"latex":"q(x_1, \\ldots, x_t) = \\text{joint distribution over trajectories}","symbols":"q(x_1, ..., x_t) 表示轨迹上的联合分布","explanation":"公式正确，描述了q(x_1, ..., x_t)为轨迹上的联合分布，符合上下文中的定义。","evidence":"Define the differences. The differences between Q and P. Q is this process. Q is this, how do I say this? Q is the ground truth drawn distribution. So you have, I guess you understand the Q, the forward Q. So this forward process of Q defines the drawn distribution between X0 and Xt. So basically, for every every trajectory, you have a density. You have a number. So you have a distribution over the trajectories. And it's kind of like if you have a multi-variable distribution over x1 up to xt. And then you can look at all the conditionals under this joint distribution. You can look at maybe xt minus 1 given xt. You can look at any of the conditionals once you have a joint distribution."},{"latex":"p_\\theta(x_1, \\ldots, x_t) = \\text{joint distribution defined by } \\theta","symbols":"p_\theta(x_1, ..., x_t) 表示由参数θ定义的联合分布","explanation":"公式正确，描述了p_\theta(x_1, ..., x_t)为由参数θ定义的联合分布，符合上下文中的定义。","evidence":"So that's q. So every time I say x1 to t given x0, that means that you look at the joint distribution and you say, oh, I'm looking at the conditionals under that joint distribution. Does that make sense? Yeah. And p theta is this artificial one I defined. in this way. So it also induces a joint distribution. Because once you give me theta, I'm going to give you a joint distribution over x1 up to xt. And then you can look at any conditionals, whatever you want, under that joint dis ween a sequence like something like this, x1 up to xt, q, x1 up to xt. And let's say, suppose x1 up to xt is a Markov chain. chain, and both p and q. And then you can do this chain rule where you can write it as p of x1 given x2, q. So you can decompose it sequentially. And the last term will be just the x."}],"uncertainties":["p of x1 given x2, q"],"diagram":"none","start":4059.62,"end":4196.36,"asr_flags":[562,563,564,566,577],"raw_segments":[{"start":4059.62,"text":"which is that if you have KL between, like, let me see what's the right way to write this."},{"start":4069.62,"text":"It's like a, let me think about what's the most abstract way"},{"start":4081.12,"text":"to write this, like a, if you have p, let's say, of x, y,"},{"start":4095.76,"text":"I'm writing an abstracted statement, right?"},{"start":4098.16,"text":"So you have this multivariate random variable, x and y."},{"start":4105.36,"text":"And you have two distributions."},{"start":4107.12,"text":"And you look at the KL between them."},{"start":4108.92,"text":"This is equals to KL between p of x given y and q of x given y"},{"start":4118.84,"text":"plus the KL between p of x and q of x."},{"start":4124.54,"text":"Sorry, y."},{"start":4137.92,"text":"And similarly, if you have KL between a sequence"},{"start":4141.08,"text":"like something like this, x1 up to xt, q, x1 up to xt."},{"start":4148.4,"text":"And let's say, suppose x1 up to xt is a Markov chain."},{"start":4153.36,"text":"chain, and both p and q."},{"start":4158.14,"text":"And then you can do this chain rule"},{"start":4159.9,"text":"where you can write it as p of x1 given x2, q."},{"start":4189.4,"text":"So you can decompose it sequentially."},{"start":4193.78,"text":"And the last term will be just the x."}],"speech_gaps":[],"frame":"../frames/v045/024.webp","frame_time":4071.62},{"title":"扩散模型中的KL散度分解","segments":[{"id":580,"text":"That's the fact that we're going to use for this chain rule so that we can decompose that formula. And this g to do all the full derivation, but you can compute. So just if you do the calculation, you have Xt given Xt and X0. You can do the Bayesian rule, which is Xt given Xt minus 1 X0 times Q of Xt minus 1 X0."}],"notes":["本段讲解了在扩散模型中，当已知x0时，重建过程变得容易，因为可以确定性地计算公式。而当没有x0时，重建过程则非常困难。这说明了在模型设计中，x0的已知对于重建的重要性。","讲者提到，除了KL散度之外，还有其他项需要考虑，但在此处，主要关注的是Pθ重建Xt-1。这表明在模型训练中，需要让分布Pθ与目标分布Q匹配。","讲者指出，Q分布是条件X0的分布，这使得计算变得容易。这说明了在扩散模型中，条件分布的计算是关键，因为X0的已知可以简化问题。","讲者进一步说明，当已知x0时，可以确定q(xt | xt-1, x0)，这使得计算Q(xt-1, xt, x0)成为可能。这表明在扩散模型中，前向过程的简单性是重建容易的原因。","讲者通过高斯分布的例子，说明了在已知P(A|B)和P(A,B)的情况下，可以计算P(B|A)。这表明在扩散模型中，条件概率的计算可以通过确定性公式完成。","最后，讲者提到可以使用贝叶斯规则计算Xt给定Xt-1和X0的分布，这表明在模型推导中，贝叶斯规则的应用是关键步骤。"],"formulas":[],"uncertainties":["P of A comma B"],"diagram":"none","start":4381.62,"end":4543.49,"asr_flags":[],"math_clarifications":["原始公式中的贝叶斯规则未考虑上下文中的条件变量，且未体现x0的条件性。根据上下文，应为条件概率P(Xt|Xt-1, X0)，因此该公式不适用，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4381.62,"text":"easy because given x0, you actually know"},{"start":4385.87,"text":"what is the reconstruction of . Actually, deterministically, you can write out, you can compute a formula. So without x0, it's very hard to reconstruct. But with x0, it's actually easy to reconstruct. So basically, we are saying that it suffices for me to match my reconstruction to the reconstruction when x0 is given."},{"start":4407.36,"text":"Of course, you also have this term as well. It's not like only KL, but there are other terms. But here, at least, you're only asking the P theta to reconstruct Xt minus 1. You want this distribution to match this distribution. And this Q distribution is conditional X0, which is actually a very easy one, which you can compute very easily. So I think I will try to, let's see whether."},{"start":4435.32,"text":"OK, I think three minutes is probably enough to get the rest of it. So let's just be a little more precise. So what is this one? So we know very precisely. So we know almost everything about q if you co
