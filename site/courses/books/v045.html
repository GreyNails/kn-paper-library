ve what kappa square is. So, right, you just have an entity is equal to alpha bar entity plus kappa square entity. So kappa square has to be equal to one minus alpha bar t. So, in some sense, yeah. Yeah. Okay, any other questions? Okay, so maybe one comment here is that this so-called forward process,"},{"start":1680.57,"text":"this process from x0 to xt, this noising process, which is often called forward process, is a fixed process you know. There's no learning involved at all. This is what we design. We know what the beta are, we know the process, so you can run it. There's no uncertainty, no learning whatsoever. You just design it yourself."},{"start":1708.67,"text":"So basically, the forward process is known. And I know we didn't teach the VAE, the variation autoencoder stuff. This is one of the big differences between this and some of these variation autoencoder."},{"start":1720.55,"text":"Just in case you are familiar a little bit with those, like inversion autoencoder, this forward process is also a new artwork, which you have to learn. And the other process is also what you have to learn the pairs. And here, one of the big differences, this direction, no learning whatsoever is designed. And you just learn the backward. And now we're going to learn the backward. So before learning the backward, we have to parametrize the distribution that's going back."}],"speech_gaps":[],"frame":"../frames/v045/010.webp","frame_time":1581.64},{"title":"反向过程：建模的是分布，µθ 是均值","segments":[{"id":198,"text":"So basically, oh, OK. So the first thing to realize is that now we're talking about reverse process, the reverse process.","zh":"所以基本上，哦，明白了。首先需要意识到的是，我们现在讨论的是反向过程，反向过程。","start":1749.02,"end":1760.3},{"id":199,"text":"The reverse process, fundamentally, you don't have to do anything. You just say q is the reverse process. This process exists, but you don't know. And also, maybe here, when I'm writing this, I'm already using the fact that the reverse process is also a Markov chain. So I think this is a fundamental fact about Markov chain.","zh":"反向过程本质上，你不需要做任何事情。你只需要说 q 是反向过程。这个过程存在，但你并不知道。而且，也许在这里，当我写下这些内容时，我已经利用了反向过程也是一个马尔可夫链这一事实。因此，我认为这是关于马尔可夫链的一个基本事实。","start":1761.96,"end":1784.88},{"id":200,"text":"When one direction is Markov chain, the other direction is still Markov chain. So basically, xt minus 1 and xt are independent if you see xt minus 1. So basically, in the reverse process, if you know the true Q, if you know this quantity, then you can just keep sampling from this quantity to get to revert it. But the problem is you don't know this. This is unknown. In some sense, this is the","zh":"当一个方向是马尔可夫链时，另一个方向仍然是马尔可夫链。所以基本上，如果你看到 xt-1，xt-1 和 xt 是独立的。因此，在反向过程中，如果你知道真实的 Q，如果你知道这个量，那么你就可以直接从这个量中进行采样，以实现逆转。但问题是，你并不知道这个量。这是未知的。从某种意义上说，这是","start":1786.16,"end":1808.12},{"id":201,"text":"This is the unknown ground truth reverse process","zh":"你想要在某种程度上恢复的未知真实反向过程","start":1809.55,"end":1811.59},{"id":202,"text":"that you want to recover to some degree.","zh":"你希望在某种程度上恢复的那个。","start":1811.59,"end":1813.39},{"id":203,"text":"And we are trying to recover it, but we","zh":"我们正在尝试恢复它，但我们需要首先对其进行参数化。","start":1814.15,"end":1817.99},{"id":204,"text":"need to first parametrize it.","zh":"那么，你如何进行参数化？","start":1817.99,"end":1819.13},{"id":205,"text":"So how do you parametrize?","zh":"那么你如何进行参数化？","start":1819.39,"end":1820.61},{"id":206,"text":"So the parametrization is that you're","zh":"因此，参数化的方式是，你会使用一个模型 p_θ，它也是一个马尔可夫链。","start":1821.01,"end":1827.57},{"id":207,"text":"going to use a model p theta, which is also a Markov chain.","zh":"因此，这个模型，给定 x_t，","start":1827.57,"end":1831.55},{"id":208,"text":"So basically, this model, given xt,","zh":"会生成 x_{t-1} 的分布。","start":1831.77,"end":1834.01},{"id":209,"text":"it generates the distribution of xt minus 1.","zh":"所以这是一个由 θ 参数化的网络，其类型签名是，给定 x_t，它会生成 x_{t-1} 的分布。","start":1834.07,"end":1835.83},{"id":210,"text":"So it's a network parametrized by theta, and the type signature is that given xt, it will generate a distribution of xt minus one.","zh":"并且这个分布实际上会是这种形式的正态分布。","start":1835.83,"end":1844.77},{"id":211,"text":"And this distribution is actually going to be like just a normal distribution of this form.","zh":"这是我们选择的。我们选择这个分布为正态分布。","start":1845.99,"end":1860.55},{"id":212,"text":"This is our choice. We choose this distribution to be a normal distribution.","zh":"并且均值是 x_t 和 t 的函数，","start":1860.85,"end":1864.65},{"id":213,"text":"And the mean is a function of xt and t,","zh":"均值是 xt 和 t 的函数，","start":1864.65,"end":1869.11},{"id":214,"text":"and the variance is something like sigma t squared.","zh":"并且方差大概是 sigma t 平方。","start":1872.85,"end":1875.61},{"id":215,"text":"By the way, here we are using the variance with a squared","zh":"顺便说一下，这里我们使用的是带有平方的方差","start":1876.03,"end":1879.31},{"id":216,"text":"number.","zh":"的数值。","start":1879.91,"end":1880.43},{"id":217,"text":"So this is my parametrization of this distribution.","zh":"因此，这是我对这个分布的参数化。","start":1882.09,"end":1885.93},{"id":218,"text":"So this is a network.","zh":"因此，这是一个网络。","start":1886.23,"end":1887.81},{"id":219,"text":"Given xt and t, you're going to predict a single vector","zh":"给定 xt 和 t，你将预测一个单一的向量","start":1888.13,"end":1890.99},{"id":220,"text":"because everything is a vector.","zh":"给定 xt 和 t，你将预测一个单一的向量","start":1892.37,"end":1893.63},{"id":221,"text":"vector, and then you have a variable sigma t, which","zh":"因为一切都是向量。","start":1893.63,"end":1897.51},{"id":222,"text":"is what you choose as the variance.","zh":"这是你选择的方差。","start":1897.51,"end":1898.81},{"id":223,"text":"I think you can even learn sigma t,","zh":"我想你甚至可以学习 sigma_t，","start":1899.53,"end":1901.29},{"id":224,"text":"but for this lecture, we just say sigma t is chosen.","zh":"但在这堂课中，我们只是说 sigma_t 是被选择的。","start":1901.39,"end":1903.81},{"id":225,"text":"And actually, you'll see what is the right choice of sigma t,","zh":"实际上，你将会看到 sigma_t 的正确选择是怎样的，","start":1903.99,"end":1906.53},{"id":226,"text":"or what is one reasonable choice for sigma t.","zh":"或者什么是 sigma_t 的一个合理选择。","start":1907.19,"end":1909.61},{"id":227,"text":"So sigma t is not something you're going to learn.","zh":"因此，sigma_t 是你不会去学习的东西。","start":1909.95,"end":1911.69},{"id":228,"text":"Theta is something that you're going to learn.","zh":"而 theta 是你将会去学习的东西。","start":1911.91,"end":1913.69},{"id":229,"text":"And this mu theta is a new artwork.","zh":"而这个 mu_theta 是一个新的艺术作品。","start":1917.19,"end":1920.27},{"id":230,"text":"So basically, we need to design a loss function","zh":"所以基本上，我们需要设计一个损失函数","start":1920.73,"end":1922.23}],"notes":["反向模型给定当前 xₜ 和时间 t，产生前一步 xₜ₋₁ 的条件分布。讲者选择用高斯分布来参数化这个条件分布，网络输出它的均值 µθ(xₜ,t)，方差按所选日程处理。","概率密度或条件分布不能与均值向量直接画等号。对于向量数据，若采用各向同性方差，协方差应写成 σₜ²I。这里写的是模型的分布族选择，而不是断言真实反向条件分布在任何有限步长下都恰好是高斯。"],"formulas":[{"latex":"p_\\theta(x_{t-1}\\mid x_t)=\\mathcal N\\!\\left(\\mu_\\theta(x_t,t),\\sigma_t^2 I\\right)","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版；适用假设及记号修复已在上文说明。","evidence":"So basically, oh, OK. So the first thing to realize is that now we're talking about reverse process, the reverse process. The reverse process, fundamentally, you don't have to do anything. You just say q is the reverse process. This process exists, but you don't know. And also, maybe here, when I'm writing this, I'm already using the fact that the reverse process is also a Markov chain. So I think this is a fundamental fact about Markov chain. When one direction is Markov chain, the other direction is still Markov chain. So basically, xt minus 1 and xt are independent if you see xt minus 1. So basically, in the reverse process, if you know the true Q, if you know this quantity, then you can just keep sampling from this quantity to get to revert it. But the problem is you don't know this. This is unknown. In some sense, this is the This is the unknown ground truth reverse process that you want to recover to some degree. And we are trying to recover it, but we need to first parametrize it. So how do you parametrize? So the parametrization is that you're going to use a model p theta, which is also a Markov chain. So basically, this model, given xt, it generates the distribution of xt minus 1. So it's a network parametrized by theta, and the type signature is that given xt, it will generate a distribution of xt minus one. And this distribution is actually going to be like just a normal distribution of this form. This is our choice. We choose this distribution to be a normal distribution. And the mean is a function of xt and t, and the variance is something like sigma t squared. By the way, here we are using the variance with a squared number. So this is my parametrization of this distribution. So this is a network. Given xt and t, you're going to predict a single vector because everything is a vector. vector, and then you have a variable sigma t, which is what you choose as the variance. I think you can even learn sigma t, but for this lecture, we just say sigma t is chosen. And actually, you'll see what is the right choice of sigma t, or what is one reasonable choice for sigma t. So sigma t is not something you're going to learn. Theta is something that you're going to learn. And this mu theta is a new artwork. So basically, we need to design a loss function"}],"uncertainties":["new artwork"],"diagram":"none","start":1749.02,"end":1922.23,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":33,"raw_segments":[{"start":1749.02,"text":"So basically, oh, OK. So the first thing to realize is that now we're talking about reverse process, the reverse process."},{"start":1761.96,"text":"The reverse process, fundamentally, you don't have to do anything. You just say q is the reverse process. This process exists, but you don't know. And also, maybe here, when I'm writing this, I'm already using the fact that the reverse process is also a Markov chain. So I think this is a fundamental fact about Markov chain."},{"start":1786.16,"text":"When one direction is Markov chain, the other direction is still Markov chain. So basically, xt minus 1 and xt are independent if you see xt minus 1. So basically, in the reverse process, if you know the true Q, if you know this quantity, then you can just keep sampling from this quantity to get to revert it. But the problem is you don't know this. This is unknown. In some sense, this is the"},{"start":1809.55,"text":"This is the unknown ground truth reverse process"},{"start":1811.59,"text":"that you want to recover to some degree."},{"start":1814.15,"text":"And we are trying to recover it, but we"},{"start":1817.99,"text":"need to first parametrize it."},{"start":1819.39,"text":"So how do you parametrize?"},{"start":1821.01,"text":"So the parametrization is that you're"},{"start":1827.57,"text":"going to use a model p theta, which is also a Markov chain."},{"start":1831.77,"text":"So basically, this model, given xt,"},{"start":1834.07,"text":"it generates the distribution of xt minus 1."},{"start":1835.83,"text":"So it's a network parametrized by theta, and the type signature is that given xt, it will generate a distribution of xt minus one."},{"start":1845.99,"text":"And this distribution is actually going to be like just a normal distribution of this form."},{"start":1860.85,"text":"This is our choice. We choose this distribution to be a normal distribution."},{"start":1864.65,"text":"And the mean is a function of xt and t,"},{"start":1872.85,"text":"and the variance is something like sigma t squared."},{"start":1876.03,"text":"By the way, here we are using the variance with a squared"},{"start":1879.91,"text":"number."},{"start":1882.09,"text":"So this is my parametrization of this distribution."},{"start":1886.23,"text":"So this is a network."},{"start":1888.13,"text":"Given xt and t, you're going to predict a single vector"},{"start":1892.37,"text":"because everything is a vector."},{"start":1893.63,"text":"vector, and then you have a variable sigma t, which"},{"start":1897.51,"text":"is what you choose as the variance."},{"start":1899.53,"text":"I think you can even learn sigma t,"},{"start":1901.39,"text":"but for this lecture, we just say sigma t is chosen."},{"start":1903.99,"text":"And actually, you'll see what is the right choice of sigma t,"},{"start":1907.19,"text":"or what is one reasonable choice for sigma t."},{"start":1909.95,"text":"So sigma t is not something you're going to learn."},{"start":1911.91,"text":"Theta is something that you're going to learn."},{"start":1917.19,"text":"And this mu theta is a new artwork."},{"start":1920.73,"text":"So basically, we need to design a loss function"}],"speech_gaps":[{"start":1870.352,"end":1871.856},{"start":1914.288,"end":1916.79}],"frame":"../frames/v045/011.webp","frame_time":1761.02},{"title":"扩散模型中的正向与反向过程","segments":[{"id":231,"text":"to learn this new network so I think okay so this is the forward process yeah","zh":"为了学习这个新网络，我觉得可以，所以这就是前向过程，对吧","start":1922.23,"end":1940.09},{"id":232,"text":"so I'm referring to Q so give me a noisy thing how do you reconstruct a clean","zh":"所以我指的是Q，给我一个有噪声的东西，你是如何重建一个干净的","start":1943.17,"end":1950.79},{"id":233,"text":"image, right?","zh":"图像的，对吧？","start":1950.79,"end":1951.33},{"id":234,"text":"How do you reconstruct a cleaner and cleaner image?","zh":"你是如何重建一个更干净、更干净的图像的？","start":1951.39,"end":1953.49},{"id":235,"text":"I thought t is like the noise in the process.","zh":"我想t就像是过程中的噪声。","start":1953.77,"end":1955.75},{"id":236,"text":"Yes.","zh":"是的。","start":1955.75,"end":1956.15},{"id":237,"text":"So I'm talking about the reverse of the noise in process,","zh":"所以我是在谈论过程中噪声的逆过程，","start":1956.25,"end":1958.21},{"id":238,"text":"the denoising process.","zh":"也就是去噪过程。","start":1958.53,"end":1959.39},{"id":239,"text":"Maybe pay attention to the index here.","zh":"也许要注意这里的下标。","start":1960.65,"end":1962.57},{"id":240,"text":"So this is t minus 1 given t, which is, wait,","zh":"所以这是在给定 t 的情况下 t 减 1，也就是，等等，","start":1962.87,"end":1968.51},{"id":241,"text":"did I write something wrong here?","zh":"我在这里写错了什么吗？","start":1968.57,"end":1969.57},{"id":242,"text":"No, yeah.","zh":"不，是的。","start":1969.69,"end":1970.13},{"id":243,"text":"So the forward process is that, so the forward","zh":"所以正向过程是，正向过程","start":1970.33,"end":1975.05},{"id":244,"text":"qt x t given x t minus 1, right?","zh":"是 qt x t 给定 x t 减 1，对吧？","start":1975.05,"end":1980.19},{"id":245,"text":"You use a smaller index to get to a larger index, that's the noisy process, and the reverse process","zh":"你使用较小的下标来得到较大的下标，这就是噪声过程，而反向过程","start":1980.19,"end":1985.17},{"id":246,"text":"is giving a noisier image and you try to denoise it. So basically all the reverse things have this","zh":"是生成一个更嘈杂的图像，然后你尝试对其进行去噪。所以基本上所有的反向过程都具有这个","start":1985.17,"end":1997.23},{"id":247,"text":"type signature that you are giving an image that is with a bigger index,","zh":"你给出的类型签名是一个带有更大索引的图像，","start":1998.15,"end":2001.13},{"id":248,"text":"and you are trying to reconstruct an image with smaller index which is supposed to be cleaner.","zh":"你试图重建一个索引更小的图像，这个图像应该更干净。","start":2001.29,"end":2005.41},{"id":249,"text":"So why you don't just do it one step, right?","zh":"那么你为什么不直接一步完成呢，对吧？","start":2027.99,"end":2031.25},{"id":250,"text":"Because you know a formula that can do it one shot, right?","zh":"因为你知道一个可以一步完成的公式，对吧？","start":2031.33,"end":2033.57},{"id":251,"text":"Right?","zh":"对吧？","start":2033.57,"end":2033.65},{"id":252,"text":"So and the one-shot is just the, in some sense,","zh":"所以，这种一步完成的方法在某种意义上，","start":2033.77,"end":2036.57},{"id":253,"text":"the one-shot formula is just you get rid of the x0.","zh":"一步完成的公式就是你去掉x0。","start":2036.65,"end":2038.41},{"id":254,"text":"You just multiply x0 by 0 and then add a Gaussian noise.","zh":"你只需将x0乘以0，然后加上高斯噪声。","start":2038.97,"end":2041.73},{"id":255,"text":"Right?","zh":"对吗？","start":2042.31,"end":2042.71},{"id":256,"text":"So I think that's one of the beauty here","zh":"所以我觉得这就是这里的一个美之处","start":2044.39,"end":2046.61},{"id":257,"text":"because then it's going to be harder to reverse even.","zh":"因为这样反过来就会更困难。","start":2046.61,"end":2049.35},{"id":258,"text":"Right?","zh":"对吗？","start":2050.17,"end":2050.57},{"id":259,"text":"Because you lose.","zh":"因为你失去了。","start":2050.63,"end":2051.21},{"id":260,"text":"So this is giving you some kind of a gradual approach","zh":"所以这给了你一种渐进的方法","start":2051.41,"end":2054.61},{"id":261,"text":"to try to reverse step by step.","zh":"尝试逐步地进行反向。","start":2054.61,"end":2057.41},{"id":262,"text":"So in some sense, there's some learning,","zh":"所以某种意义上说，这有一些学习的过程，","start":2057.93,"end":2060.03},{"id":263,"text":"there's some benefits that is from the learning perspective.","zh":"有一些好处是从学习的角度来看的。","start":2060.21,"end":2062.31},{"id":264,"text":"perspective, like if you are noising step-by-step, then the denoising can also be step-by-step,","zh":"比如，如果你是逐步添加噪声，那么去噪过程也可以逐步进行，","start":2062.31,"end":2069.49},{"id":265,"text":"and that's beneficial.","zh":"这是有益的。","start":2070.21,"end":2071.23},{"id":266,"text":"And another alternative, which is in the middle between your version and this version, is that you not do it one shot, just multiplying 0 with x0 plus noise. You can also do it with a new artwork with five layers, 10 layers, something like that. And the story or the belief was that if you do it for 10 layers of networks, then each layer will add some more noise.","zh":"另一种替代方法，介于你的版本和这个版本之间，是不要一次性完成，仅仅用0乘以x0再加上噪声。你也可以使用一个新作品，有五层、十层，类似这样的结构。故事或信念是，如果你使用十层网络，那么每一层都会添加一些更多的噪声。","start":2074.78,"end":2097.98}],"notes":["本段讲解了扩散模型中的正向和反向过程。正向过程是通过逐步添加噪声将图像变为噪声图像，而反向过程则是通过逐步去除噪声来恢复原始图像。正向过程使用较小的索引得到较大的索引，而反向过程则是从较大的索引逐步恢复到较小的索引。","在反向过程中，模型通过逐步去噪来重建图像，而不是一次性完成。这是因为一次性去噪的公式可能难以实现，而逐步去噪可以更有效地进行学习。","讲者提到，如果使用一次性去噪公式，可以直接将原始图像乘以0并添加高斯噪声，但这可能使得反向过程更加困难。","因此，扩散模型通常采用逐步去噪的方法，这样可以在学习过程中获得更多的好处，例如逐步去噪可以更有效地进行反向过程。","此外，讲者还提到，可以使用多层网络（如5层或10层）来实现逐步去噪，每层网络会添加更多的噪声，从而实现更精细的图像恢复。","这种逐步去噪的方法在学习过程中具有优势，因为它允许模型逐步学习如何去除噪声，从而提高图像恢复的质量。"],"formulas":[],"uncertainties":["artwork"],"diagram":"diffusion","start":1922.23,"end":2097.98,"asr_flags":[231,251],"math_clarifications":["原始片段中提到的公式未明确表示正向过程的具体形式，如高斯噪声添加或扩散过程，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":36,"raw_segments":[{"start":1922.23,"text":"to learn this new network so I think okay so this is the forward process yeah"},{"start":1943.17,"text":"so I'm referring to Q so give me a noisy thing how do you reconstruct a clean"},{"start":1950.79,"text":"image, right?"},{"start":1951.39,"text":"How do you reconstruct a cleaner and cleaner image?"},{"start":1953.77,"text":"I thought t is like the noise in the process."},{"start":1955.75,"text":"Yes."},{"start":1956.25,"text":"So I'm talking about the reverse of the noise in process,"},{"start":1958.53,"text":"the denoising process."},{"start":1960.65,"text":"Maybe pay attention to the index here."},{"start":1962.87,"text":"So this is t minus 1 given t, which is, wait,"},{"start":1968.57,"text":"did I write something wrong here?"},{"start":1969.69,"text":"No, yeah."},{"start":1970.33,"text":"So the forward process is that, so the forward"},{"start":1975.05,"text":"is qt x t given x t minus 1, right?"},{"start":1980.19,"text":"You use a smaller index to get to a larger index, that's the noisy process, and the reverse process"},{"start":1985.17,"text":"is giving a noisier image and you try to denoise it. So basically all the reverse things have this"},{"start":1998.15,"text":"type signature that you are giving an image that is with a bigger index,"},{"start":2001.29,"text":"and you are trying to reconstruct an image with smaller index which is supposed to be cleaner."},{"start":2027.99,"text":"So why you don't just do it one step, right?"},{"start":2031.33,"text":"Because you know a formula that can do it one shot, right?"},{"start":2033.57,"text":"Right?"},{"start":2033.77,"text":"So and the one-shot is just the, in some sense,"},{"start":2036.65,"text":"the one-shot formula is just you get rid of the x0."},{"start":2038.97,"text":"You just multiply x0 by 0 and then add a Gaussian noise."},{"start":2042.31,"text":"Right?"},{"start":2044.39,"text":"So I think that's one of the beauty here"},{"start":2046.61,"text":"because then it's going to be harder to reverse even."},{"start":2050.17,"text":"Right?"},{"start":2050.63,"text":"Because you lose."},{"start":2051.41,"text":"So this is giving you some kind of a gradual approach"},{"start":2054.61,"text":"to try to reverse step by step."},{"start":2057.93,"text":"So in some sense, there's some learning,"},{"start":2060.21,"text":"there's some benefits that is from the learning perspective."},{"start":2062.31,"text":"perspective, like if you are noising step-by-step, then the denoising can also be step-by-step,"},{"start":2070.21,"text":"and that's beneficial."},{"start":2074.78,"text":"And another alternative, which is in the middle between your version and this version, is that you not do it one shot, just multiplying 0 with x0 plus noise. You can also do it with a new artwork with five layers, 10 layers, something like that. And the story or the belief was that if you do it for 10 layers of networks, then each layer will add some more noise."}],"speech_gaps":[{"start":2007.92,"end":2013.584},{"start":2013.584,"end":2025.024},{"start":2025.024,"end":2027.59}],"frame":"../frames/v045/012.webp","frame_time":1934.23},{"title":"扩散模型中的高斯假设与反向过程","segments":[{"id":267,"text":"and maybe remove some of the unnecessary information to make it more like a Gaussian. So that's the virtual autoencoder stuff in some sense. But that is a learned network. So the difference here is that it's actually more brute force. You are just adding small noise every step. And the T is bigger here. The first paper was like 1,000 for T, maybe a few thousands even.","zh":"并且也许可以去除一些不必要的信息，使其更接近高斯分布。因此，这在某种意义上就是虚拟自动编码器的内容。但这是一个学习到的网络。这里的区别是，它实际上更加暴力。你只是每一步都添加一点噪声。而且这里的 T 更大。第一篇论文中的 T 大概是 1,000，甚至可能达到几千。","start":2099.21,"end":2122.11},{"id":268,"text":"We want to actually learn denoising step by step instead of denoising this entire big thing, which is going to be harder. Yes, I think that's the intuition. There are actually many explanations for why this is working. That's one of the intuitions. I believe it's indeed true. Cool. So this is my parametrization for the reverse process. So maybe one question you may realize is that you may question is why is it Gaussian?","zh":"我们希望逐步学习去噪，而不是一次性去噪这个庞大的整体，这会更困难。是的，我认为这就是直觉。实际上有很多解释说明为什么这种方法有效。这是其中一种直觉。我相信这确实是正确的。很好。因此，这是我对于反向过程的参数化。也许你可能会产生一个疑问，就是为什么它是高斯分布？","start":2124.02,"end":2152.21},{"id":269,"text":"So why the reverse process? Why you parameterize it as a Gaussian? So a Poirot, there's no","zh":"那么为什么反向过程？为什么你将其参数化为高斯分布？一个波洛，这里并没有","start":2152.93,"end":2161.53},{"id":270,"text":"it's not clear why this is Gaussian.","zh":"不清楚为什么这是高斯分布。","start":2162.7,"end":2164.38},{"id":271,"text":"Given that you add Gaussian in one direction,","zh":"鉴于你在某一方向上添加了高斯噪声，","start":2165.6,"end":2168.52},{"id":272,"text":"why in the other direction you also add Gaussian?","zh":"为什么在另一个方向上你也添加高斯噪声？","start":2168.64,"end":2170.38},{"id":273,"text":"Of course, it's not purely adding noise.","zh":"当然，这并不是纯粹地添加噪声。","start":2171.54,"end":2174.5},{"id":274,"text":"You are going to transform the mean.","zh":"你将会变换均值。","start":2174.62,"end":2175.66},{"id":275,"text":"You're going to compute some mean,","zh":"你将计算一个均值，","start":2176.06,"end":2177.14},{"id":276,"text":"but then you add some noise back.","zh":"然后你再添加一些噪声。","start":2177.28,"end":2178.52},{"id":277,"text":"So this is actually from a pretty deep theorem, where","zh":"所以这实际上来自于一个相当深的定理，其中","start":2180.42,"end":2183.98},{"id":278,"text":"I think at the very beginning, I think even if it's not","zh":"我想在最开始的时候，我想即使它不是","start":2185.86,"end":2190.48},{"id":279,"text":"not Gaussian, you can try to parameterize in this way.","zh":"高斯分布，你也可以尝试用这种方式进行参数化。","start":2190.48,"end":2193.16},{"id":280,"text":"Even if it's not really Gaussian,","zh":"即使它并不是真正的高斯分布，","start":2193.3,"end":2194.5},{"id":281,"text":"you can try to learn it with a Gaussian distribution","zh":"你也可以尝试用高斯分布来学习它","start":2194.64,"end":2197.5},{"id":282,"text":"or approximate with a Gaussian distribution.","zh":"或者用高斯分布来近似它。","start":2197.5,"end":2198.86},{"id":283,"text":"That's one possible justification.","zh":"这是其中一个可能的解释。","start":2199.12,"end":2200.32},{"id":284,"text":"But actually, there's a deep reason,","zh":"但实际上，有一个深刻的原因，","start":2200.7,"end":2203.34},{"id":285,"text":"which is that, especially in a continuous limit,","zh":"即在连续极限的情况下，","start":2203.46,"end":2205.8},{"id":286,"text":"when t is very big and each of the steps","zh":"当 t 非常大且每一步都极其微小时，","start":2205.96,"end":2208.68},{"id":287,"text":"is really, really small, I think the reverse process,","zh":"我认为反向过程，","start":2208.68,"end":2210.98},{"id":288,"text":"the true reverse process, which this one,","zh":"真实的反向过程，也就是这个过程，","start":2211.16,"end":2213.42},{"id":289,"text":"is also actual Gaussian.","zh":"也是实际的高斯分布。","start":2213.5,"end":2214.6},{"id":290,"text":"So that's from a theorem, like from stochastic process, which is like a pretty deep theorem.","zh":"因此，这是来自随机过程的一个定理，像一个相当深刻的定理。","start":2214.6,"end":2223.14},{"id":291,"text":"You can actually, you know, I don't know which one is really the first paper that proved it,","zh":"你其实可以，你知道的，我不确定到底哪篇论文是第一个证明这一点的，","start":2223.22,"end":2228.68},{"id":292,"text":"but I think there's like, you can even date back to like some paper in 1940.","zh":"但我想，你甚至可以追溯到1940年的一些论文。","start":2228.78,"end":2235.16},{"id":293,"text":"Let me see whether I should talk about that at this moment.","zh":"让我看看我现在是否应该谈论这个话题。","start":2236.12,"end":2238.66},{"id":294,"text":"I think.","zh":"我想。","start":2238.66,"end":2239.14},{"id":295,"text":"This is the first time I'm teaching this lecture,","zh":"这是我第一次讲这堂课，","start":2243.42,"end":2245.3},{"id text":"know right some oh this this sounds like too aggressive you cannot change that but anyway","zh":"知道对吧，哦，这听起来太激进了，你不能改变这一点，不过无论如何","start":2464.88,"end":2469.22},{"id":361,"text":"something like this so so and um and what happens is that if you give me this point let's say this","zh":"就是这样的情况，所以，所以，嗯，会发生的是，如果你给我这个点，比如说这个","start":2469.22,"end":2475.86},{"id":362,"text":"is xt, can you really recover the point before the xt minus 1?","zh":"是 xt，你能真正恢复出 xt 减 1 的那个点吗？","start":2475.86,"end":2481.26},{"id":363,"text":"You cannot really know exactly.","zh":"你其实无法确切地知道。","start":2481.6,"end":2483.02},{"id":364,"text":"So there's still uncertainties.","zh":"因此，仍然存在不确定性。","start":2483.6,"end":2485.26},{"id":365,"text":"Even given xt, you don't really know what xt minus 1 is.","zh":"即使给定了 xt，你其实并不真正知道 xt 减 1 是什么。","start":2485.38,"end":2487.54},{"id":366,"text":"Because given xt, you may say, oh, maybe the previous point","zh":"因为给定 xt，你可能会说，哦，也许前面的点","start":2488.02,"end":2491.52},{"id":367,"text":"is here.","zh":"在这里。","start":2491.52,"end":2491.8},{"id":368,"text":"So that's how you got here, right?","zh":"所以这就是你到达这里的方式，对吧？","start":2491.96,"end":2493.76},{"id":369,"text":"But it could be that you got to xt","zh":"但它可能是从另一条轨迹到达 xt 的","start":2494.02,"end":2496.3},{"id":370,"text":"from a different trajectory.","zh":"的。","start":2496.3,"end":2497.1},{"id":371,"text":"It could be like you are going this way and then go here.","zh":"它可能是你这样走了一段路，然后到这里。","start":2497.38,"end":2499.52},{"id":372,"text":"So basically, even given xt, you don't know what happens","zh":"所以基本上，即使给定 xt，你也不知道之前发生了什么","start":2499.78,"end":2502.64},{"id":373,"text":"before","zh":"之前的情况。","start":2502.64,"end":2502.82},{"id":374,"text":"So that answers the question about why there's still noise, because you never know how you got here. So that's why there's always a noise. This is always a dissolution. And the second question is, why is Gaussian? So Gaussian is, I think the Gaussian identity is interesting in the sense that, so in some sense, for most of this, so if you go to the continuous time,","zh":"所以这回答了为什么仍然存在噪声的问题，因为你永远不知道你是如何到达这里的。这就是为什么总是存在噪声。这总是某种分解。第二个问题是，为什么是高斯分布？我认为高斯分布的特性很有趣，从某种意义上说，在大多数情况下，如果你进入连续时间，","start":2504.52,"end":2528.0},{"id":375,"text":"Almost every stochastic process is Gaussian. There are special cases where you have to design something. But generally speaking, the reason is that in some sense, by law of large number, if every small step you add some noise. Let's say that noise is not really Gaussian, something like Gaussian. Once you have so many steps, then you accumulate Gaussian.","zh":"几乎每一个随机过程都是高斯分布。有一些特殊情况需要你进行设计。但总的来说，原因在于，从某种意义上说，根据大数定律，如果你在每一步都添加一些噪声。假设这种噪声并不是真正的高斯分布，但类似于高斯分布。一旦你有足够多的步骤，那么你就会累积成高斯分布。","start":2528.98,"end":2552.82},{"id":376,"text":"So in some sense, it's always kind of Gaussian in some sense. And there is no so-called small enough steps. Your small step at this moment, it could be accumulation of even smaller steps. So any step is accumulation of even smaller steps. And if you have enough accumulation, you always get to a Gaussian distribution. And this is not always true. There are common examples here. That's why stochastic process is interesting. But in most of the normal regular situations, everything is Gaussian. So the forward and reverse.","zh":"从某种意义上说，它总是某种意义上的高斯分布。而且没有所谓的足够小的步骤。你此刻的微小步骤，可能是更小步骤的累积。任何步骤都是更小步骤的累积。如果你有足够多的累积，你总是会得到一个高斯分布。但这并不是总是成立的。有一些常见的例子。这就是随机过程有趣的原因。但在大多数正常的常规情况下，一切都是高斯分布。所以正向和反向。","start":2554.47,"end":2582.61},{"id":377,"text":"It's always Gaussian. So actually, that's kind of what I'm trying to state here. This is a pretty deep theorem. So maybe let me just have a small distraction to talk about the continuous perspective. I kind of like to talk about this because, in some sense, this is one of the .","zh":"它总是高斯分布。所以实际上，这就是我在这里试图陈述的内容。这是一个相当深刻的定理。也许让我稍微分散一下注意力，谈谈连续视角。我有点喜欢谈论这个，因为在某种意义上，这是机器学习中你可以实际谈论一些数学的地方。一旦你进入大型算法模型，它就像是你写下三个方程就完成了。所以好吧，无论如何，你怎么看待连续视角？我不期望每个人都了解这里的各种符号。老实说，我不一定理解所有的正式定义。因此，我认为我们会保持一定程度的非正式性。我们有一个连续时间。那么你如何写出这种类型的","start":2583.1,"end":2605.14},{"id":378,"text":"of machine learning where you can actually talk about some of the math. Once you go to large algorithm models, it's kind of like you just write down three equations and you are done. So OK, anyway, so how do you think about a continuous perspective? So I don't expect everyone to know all the kind of notations here. I don't necessarily understand all the formal definitions, to be honest. So I think we'll stay informal to some degree. So we have a continuous time. Then how do you write this kind of like","zh":"机器学习中你可以实际讨论一些数学的地方。一旦你进入大型算法模型，就有点像你只是写下三个方程就完成了。所以，好吧，不管怎样，你怎么从连续视角来思考这个问题呢？我不期望大家都知道这里的各种符号。老实说，我也不一定完全理解所有的形式化定义。因此，我认为我们会在某种程度上保持非正式的风格。我们有一个连续时间。那么你如何写出这种类似","start":2605.45,"end":2633.07}],"notes":["给定带噪变量 xₜ，通常不能唯一确定此前的 xₜ₋₁。反向过程描述的是一个条件分布，因此需要同时表达典型位置与剩余不确定性。","讲者随后用许多小扰动累积的直觉讨论高斯性，也承认存在反例。不能把这段概括成“所有随机过程都是高斯”或“加很多次噪声就必然高斯”；极限定理需要相应条件，模型采用高斯转移也不等于真实逆过程处处精确高斯。","阅读这一段时，把“我们选用高斯分布来建模”和“数据的真实条件分布是什么”分开。前者是可训练模型的设计，后者还取决于数据分布、前向过程和步长。"],"formulas":[],"uncertainties":["virus","one of the","kind of notations"],"diagram":"none","start":2457.5,"end":2633.07,"asr_flags":[373],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":2457.5,"text":"adding noise each time so you get a bigger and bigger virus you know in some sense you know of"},{"start":2461.8,"text":"course i'm only joining one trajectory maybe another trajectory is like this when you never"},{"start":2464.88,"text":"know right some oh this this sounds like too aggressive you cannot change that but anyway"},{"start":2469.22,"text":"something like this so so and um and what happens is that if you give me this point let's say this"},{"start":2475.86,"text":"is xt, can you really recover the point before the xt minus 1?"},{"start":2481.6,"text":"You cannot really know exactly."},{"start":2483.6,"text":"So there's still uncertainties."},{"start":2485.38,"text":"Even given xt, you don't really know what xt minus 1 is."},{"start":2488.02,"text":"Because given xt, you may say, oh, maybe the previous point"},{"start":2491.52,"text":"is here."},{"start":2491.96,"text":"So that's how you got here, right?"},{"start":2494.02,"text":"But it could be that you got to xt"},{"start":2496.3,"text":"from a different trajectory."},{"start":2497.38,"text":"It could be like you are going this way and then go here."},{"start":2499.78,"text":"So basically, even given xt, you don't know what happens"},{"start":2502.64,"text":"before"},{"start":2504.52,"text":"So that answers the question about why there's still noise, because you never know how you got here. So that's why there's always a noise. This is always a dissolution. And the second question is, why is Gaussian? So Gaussian is, I think the Gaussian identity is interesting in the sense that, so in some sense, for most of this, so if you go to the continuous time,"},{"start":2528.98,"text":"Almost every stochastic process is Gaussian. There are special cases where you have to design something. But generally speaking, the reason is that in some sense, by law of large number, if every small step you add some noise. Let's say that noise is not really Gaussian, something like Gaussian. Once you have so many steps, then you accumulate Gaussian."},{"start":2554.47,"text":"So in some sense, it's always kind of Gaussian in some sense. And there is no so-called small enough steps. Your small step at this moment, it could be accumulation of even smaller steps. So any step is accumulation of even smaller steps. And if you have enough accumulation, you always get to a Gaussian distribution. And this is not always true. There are common examples here. That's why stochastic process is interesting. But in most of the normal regular situations, everything is Gaussian. So the forward and reverse."},{"start":2583.1,"text":"It's always Gaussian. So actually, that's kind of what I'm trying to state here. This is a pretty deep theorem. So maybe let me just have a small distraction to talk about the continuous perspective. I kind of like to talk about this because, in some sense, this is one of the ."},{"start":2605.45,"text":"of machine learning where you can actually talk about some of the math. Once you go to large algorithm models, it's kind of like you just write down three equations and you are done. So OK, anyway, so how do you think about a continuous perspective? So I don't expect everyone to know all the kind of notations here. I don't necessarily understand all the formal definitions, to be honest. So I think we'll stay informal to some degree. So we have a continuous time. Then how do you write this kind of like"}],"speech_gaps":[],"frame":"../frames/v045/015.webp","frame_time":2469.5},{"title":"扩散模型中的前向过程与布朗运动","segments":[{"id":379,"text":"forward process, what you do is you write something like this. You say d is something like you have a deterministic drift dt plus this Gaussian noise. So this is the so-called Brownian motion. Brownian motion.","zh":"前向过程，你所做的就是写下类似这样的内容。你说 d 是类似你有一个确定性的漂移 dt 加上高斯噪声。因此，这就是所谓的布朗运动。布朗运动。","start":2633.47,"end":2659.71},{"id":380,"text":"And this is the variance, which is kind of like that beta, the beta t, or square root beta t. Oh, sorry, gt is the square root beta t, yes. And this is the Brownian motion. And this is the deterministic change, which corresponds to the difference between","zh":"并且这是方差，它类似于那个 beta，即 beta t 或者根号 beta t。哦，抱歉，gt 是根号 beta t，是的。这就是布朗运动。而这是确定性的变化，它对应于这两者之间的差异。","start":2662.04,"end":2679.86},{"id":381,"text":"this and this. So that's the difference between the two steps deterministically. And there's a stochastic part. So basically, this is a deterministic case. And on the left-hand side, it's basically, this thing is kind of like the same as xt plus 1 minus xt, more or less. Here, I have one step. But if the step is really small, maybe I should say t plus dt minus xt.","zh":"这就是这两个步骤之间的确定性差异。并且存在一个随机部分。因此，基本上，这是一个确定性的情况。在左边，它基本上类似于 xt+1 减去 xt，或多或少。这里，我有一个步骤。但如果步骤非常小，也许我应该说 t + dt 减去 xt。","start":2680.51,"end":2706.31},{"id":382,"text":"Xt plus dt minus Xt, something like this. This is the change in one step. And there are two parts. One part is a deterministic change, and there is a stochastic change. So that's how you model this in a continuous language. And I think there is a result. I don't think this is necessarily the first.","zh":"xt + dt 减去 xt，类似这样的内容。这就是一步的变化。并且存在两个部分。一部分是确定性的变化，另一部分是随机的变化。这就是如何在连续语言中建模这个过程。我认为有一个结果。我不认为这一定是第一个结果。","start":2707.32,"end":2727.22},{"id":383,"text":"result, but I think it's a convenient set. I think this is Anderson 1985. And it's saying the following. It says that if you, I guess there are also different ways to state the results. I'm using a somewhat kind of like a","zh":"结果，但我认为这是一个方便的集合。我认为这是 Anderson 1985 年的结果。它说的是以下内容。它说如果你，我想还有其他方式来陈述这些结果。我使用的是某种类似","start":2729.07,"end":2745.78},{"id":384,"text":"And from the notation perspective, it's not the most clean one. But I think it's easier to understand to some degree. So basically, let's say, suppose you have this. OK, so you have a forward process, like x, maybe x0, so on and so forth, up to xt. And then you can define a reverse process, which is just let's call this y0. And this is yt. And so basically, y.","zh":"从符号的角度来看，这并不是最清晰的表达方式。但我认为在某种程度上更容易理解。因此，基本上，假设你有这个。好的，所以你有一个前向过程，比如 x，也许 x0，然后一直到 xt。然后你可以定义一个反向过程，我们称之为 y0。而这就是 yt。因此，基本上，y。","start":2748.31,"end":2772.51},{"id":385,"text":"and this way. So y tau is equal to xt minus tau. That's my definition of y. I change the order and change the time direction. So that's my y. So I think this Anderson analysis that if this is the forward process, then the backward. So if you look at the stock asset process for the y tau, then it is equal to this.","zh":"以这种方式定义。因此，y tau 等于 xt 减去 tau。这是我对 y 的定义。我改变了顺序并改变了时间方向。因此，这就是我的 y。我认为 Anderson 的分析表明，如果这是前向过程，那么反向过程。因此，如果你观察 y tau 的股票资产过程，那么它等于这个。","start":2773.35,"end":2800.23}],"notes":["本段讲解了扩散模型中的前向过程，其中涉及布朗运动的建模。前向过程由确定性漂移和高斯噪声组成，其中漂移项为 dt，噪声项为平方根 βt，即 gt。布朗运动是连续时间随机过程，用于描述扩散过程中的随机变化。","在建模中，前向过程的每一步变化包括确定性变化和随机性变化。确定性变化对应于 xt+1 - xt，而随机性变化则由高斯噪声引入。当步长 dt 很小时，变化可以近似为 xt+dt - xt，这有助于将离散过程转化为连续过程。","讲者提到 Anderson 1985 的结果，指出前向过程可以被建模为布朗运动，而反向过程则通过改变时间方向来定义。反向过程的定义为 yτ = xt - τ，这与前向过程的定义相对应。","讲者指出，虽然所使用的符号可能不够清晰，但这种建模方式有助于理解扩散模型的连续性。反向过程的定义涉及时间方向的反转，这在扩散模型中是关键的一步。","讲者提到反向过程的定义与前向过程的定义相对应，即通过改变时间方向来定义 yτ。这表明扩散模型中的反向过程是前向过程的逆过程，用于生成数据。","讲者提到 Anderson 的分析，指出如果前向过程是布朗运动，那么反向过程可以通过类似的方式建模。这表明扩散模型的反向过程与前向过程在数学上具有对称性。"],"formulas":[{"latex":"y_\\tau = x_{t - \\tau}","symbols":"y_\\tau 表示反向过程在时间 τ 的状态，等于前向过程在时间 t - τ 的状态","explanation":"公式正确，符合上下文定义的反向过程与前向过程的关系。","evidence":"and this way. So y tau is equal to xt minus tau. That's my definition of y. I change the order and change the time direction. So that's my y. So I think this Anderson analysis that if this is the forward process, then the backward. So if you look at the stock asset process for the y tau, then it is equal to this."}],"uncertainties":["gt is the square root beta t"],"diagram":"diffusion","start":2633.47,"end":2800.23,"asr_flags":[],"math_clarifications":["上下文提到的 α_t = 1 - β_t 和 x_t = \\sqrt{\\alpha_t}x_{t-1} + \\sqrt{\\beta_t} \\epsilon_t 等公式未在当前片段中出现，因此无法核对。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2633.47,"text":"forward process, what you do is you write something like this. You say d is something like you have a deterministic drift dt plus this Gaussian noise. So this is the so-called Brownian motion. Brownian motion."},{"start":2662.04,"text":"And this is the variance, which is kind of like that beta, the beta t, or square root beta t. Oh, sorry, gt is the square root beta t, yes. And this is the Brownian motion. And this is the deterministic change, which corresponds to the difference between"},{"start":2680.51,"text":"this and this. So that's the difference between the two steps deterministically. And there's a stochastic part. So basically, this is a deterministic case. And on the left-hand side, it's basically, this thing is kind of like the same as xt plus 1 minus xt, more or less. Here, I have one step. But if the step is really small, maybe I should say t plus dt minus xt."},{"start":2707.32,"text":"Xt plus dt minus Xt, something like this. This is the change in one step. And there are two parts. One part is a deterministic change, and there is a stochastic change. So that's how you model this in a continuous language. And I think there is a result. I don't think this is necessarily the first."},{"start":2729.07,"text":"result, but I think it's a convenient set. I think this is Anderson 1985. And it's saying the following. It says that if you, I guess there are also different ways to state the results. I'm using a somewhat kind of like a"},{"start":2748.31,"text":"And from the notation perspective, it's not the most clean one. But I think it's easier to understand to some degree. So basically, let's say, suppose you have this. OK, so you have a forward process, like x, maybe x0, so on and so forth, up to xt. And then you can define a reverse process, which is just let's call this y0. And this is yt. And so basically, y."},{"start":2773.35,"text":"and this way. So y tau is equal to xt minus tau. That's my definition of y. I change the order and change the time direction. So that's my y. So I think this Anderson analysis that if this is the forward process, then the backward. So if you look at the stock asset process for the y tau, then it is equal to this."}],"speech_gaps":[],"frame":"../frames/v045/016.webp","frame_time":2645.47},{"title":"扩散模型中的逆过程与分布特性","segments":[{"id":386,"text":"By the way, you don't necessarily have to note down all the details here. It's all in the lecture notes, with probably fewer typos. I think the lecture notes, I checked it relatively carefully. So yeah, OK. So basically, the reverse process, if you're indexing by tau, is like this. So this part is the deterministic part, and this part is the","zh":"顺便说一句，你不一定需要在这里记下所有细节。所有内容都在讲义中，可能拼写错误更少。我认为讲义我检查得相对仔细。所以是的，好的。基本上，逆过程，如果你按tau来索引，是这样的。这一部分是确定性的部分，这一部分是随机性的部分。","start":2818.89,"end":2862.31},{"id":387,"text":"is the stochastic part. And you can see the stochastic part is still adding gaussians. But the deterministic part is more complicated because you have to take into account that how did you generate it in the first time in some sense. And there's this part about the density because you have to incorporate in some sense. It's here to understand how you go back.","zh":"随机部分仍然是在添加高斯分布。但确定性部分更复杂，因为你需要考虑到你是如何第一次生成它的。还有关于密度的部分，因为你需要在某种意义上进行整合。这部分是为了理解你是如何回溯的。","start":2863.35,"end":2887.36},{"id":388,"text":"You have to understand a little bit about it. How you go back from here versus how you go back from here is different. Because if you are here, the most likely you are going, your estimate is going to be lower because it's less likely to... ","zh":"你需要对这一点有一点理解。从这里回溯和从这里回溯是不同的。因为如果你在这里，你最有可能去的地方，你的估计会更低，因为以这种方式到达这里的可能性较低。","start":2888.29,"end":2903.9},{"id":389,"text":"to arrive here this way. It's more likely you are going arrive at this high point through below as opposed to through above. So that's why your distribution will be more likely to drift. The mean of your previous point will likely drift downward if your Xt is really high. But if Xt is kind of like low or maybe in the middle, then it should be symmetric in some sense.","zh":"你更有可能通过下方到达这个高点，而不是通过上方。这就是为什么你的分布会更倾向于漂移。如果你的Xt非常高，那么你之前的点的均值很可能向下漂移。但如果Xt比较低或者处于中间位置，那么它在某种意义上应该是对称的。","start":2904.17,"end":2924.83},{"id":390,"text":"The double bar? The double bar is just the Gaussian, like the Brownian motion in the reverse direction. It's just that you use a different notation to indicate . And actually, I think, yeah. OK. Sounds good.","zh":"双竖线？双竖线只是高斯分布，就像逆向的布朗运动。只是你使用不同的符号来表示。实际上，我认为是的。好的，听起来不错。","start":2928.87,"end":2954.27},{"id":391,"text":"And this term is just literally the same icated because you have to take into account that how did you generate it in the first time in some sense. And there's this part about the density because you have to incorporate in some sense. It's here to understand how you go back."},{"start":2888.29,"text":"You have to understand a little bit about it. How you go back from here versus how you go back from here is different. Because if you are here, the most likely you are going, your estimate is going to be lower because it's less likely to..."},{"start":2904.17,"text":"to arrive here this way. It's more likely you are going arrive at this high point through below as opposed to through above. So that's why your distribution will be more likely to drift. The mean of your previous point will likely drift downward if your Xt is really high. But if Xt is kind of like low or maybe in the middle, then it should be symmetric in some sense."},{"start":2928.87,"text":"The double bar? The double bar is just the Gaussian, like the Brownian motion in the reverse direction. It's just that you use a different notation to indicate . And actually, I think, yeah. OK. Sounds good."},{"start":2954.81,"text":"And this term is just literally the same as this."},{"start":2957.43,"text":"It's just in a different direction"},{"start":2959.51,"text":"because just now you are reverting the direction."},{"start":2963.19,"text":"So in some sense, these two terms are the same."},{"start":2966.07,"text":"And this term is what actually matters in some sense."},{"start":2974.37,"text":"Let's see."},{"start":2976.11,"text":"I even have some derivations for why this is true."},{"start":2978.95,"text":"But I think maybe..."}],"speech_gaps":[{"start":2968.67,"end":2970.48},{"start":2971.28,"end":2973.008}],"frame":"../frames/v045/017.webp","frame_time":2830.89},{"title":"概率密度的写法：变量、均值与方差","segments":[{"id":399,"text":"So maybe one thing here is that","zh":"所以也许这里有一点是","start":3000.81,"end":3003.11},{"id":400,"text":"why I brought this up","zh":"我之所以提到这一点","start":3003.11,"end":3005.61},{"id":401,"text":"is to justify","zh":"是为了证明","start":3005.61,"end":3006.37},{"id":402,"text":"that this is a","zh":"这是","start":3008.43,"end":3009.59},{"id":403,"text":"a Gaussian.","zh":"一个高斯分布。","start":3009.59,"end":3009.83},{"id":404,"text":"Because the reverse process in a continuous thing","zh":"因为在连续情况下","start":3010.91,"end":3014.35},{"id":405,"text":"is a Gaussian distribution.","zh":"逆过程是一个高斯分布。","start":3014.35,"end":3015.67},{"id":406,"text":"So that's why it makes sense in a discrete case,","zh":"所以在离散情况下这也是合理的，","start":3016.75,"end":3019.45},{"id":407,"text":"you parameterize it by a Gaussian.","zh":"你用高斯分布来参数化它。","start":3019.61,"end":3021.47},{"id":408,"text":"That's pretty much the only thing I'm trying to say.","zh":"这基本上就是我想说的全部内容。","start":3021.99,"end":3023.67},{"id":409,"text":"I think I'll skip the derivation for this.","zh":"我想这次我会跳过推导过程。","start":3028.03,"end":3030.91},{"id":410,"text":"In the lecture notes, actually, I did spend some time","zh":"实际上，在讲义中，我花了一些时间","start":3031.03,"end":3032.73},{"id":411,"text":"to try to give an intuitive proof of this.","zh":"试图给出这个结论的一个直观证明。","start":3032.73,"end":3035.07},{"id":412,"text":"So in some sense, it's kind of like the general approaches","zh":"从某种意义上说，这类似于你使用贝叶斯规则","start":3038.29,"end":3042.23},{"id":413,"text":"that you are using Bayesian rules","zh":"进行的通用方法","start":3042.23,"end":3043.51},{"id":414,"text":"with a lot of factorial expansion.","zh":"伴随着大量的因子展开。","start":3043.51,"end":3044.59},{"id":415,"text":"I think if you're interested, you can read the lecture notes.","zh":"我想如果你感兴趣的话，你可以阅读讲义笔记。","start":3046.15,"end":3048.83},{"id":416,"text":"So now let's talk about training,","zh":"现在让我们谈谈训练，","start":3049.75,"end":3050.87},{"id":417,"text":"how to train these models, right?","zh":"如何训练这些模型，对吧？","start":3050.99,"end":3052.05},{"id":418,"text":"So you can forget about continuous case.","zh":"你可以忘记连续情况。","start":3052.21,"end":3054.23},{"id":419,"text":"This is what we commit to.","zh":"这是我们承诺的内容。","start":3054.39,"end":3055.79},{"id":420,"text":"This is my backward process.","zh":"这是我逆向的过程。","start":3055.89,"end":3057.35},{"id":421,"text":"I need to design loss functions for training this p theta.","zh":"我需要为训练这个 p_θ 设计损失函数。","start":3057.55,"end":3062.63},{"id":422,"text":"data. And another thing I want to, okay, I guess maybe before going into that, I think I realized","zh":"数据。还有另一件事我想，嗯，我想可能在进入那之前，我意识到","start":3062.63,"end":3068.15},{"id":423,"text":"I'm not sure how many of you are confused by some of these notations in machine learning. For example, when I write this, nobody seems to complain with me about the interpretation of this equation. So if you're a mathematician, you're probably not happy because the right-hand side is the distribution. And the left-hand side, it depends on how you interpret it. So typically, this is kind of like a","zh":"我不确定有多少人对机器学习中的一些符号感到困惑。例如，当我写下这个表达式时，似乎没有人会对我这个等式的解释提出异议。因此，如果你是一位数学家，你可能不太满意，因为右边是分布。而左边的含义则取决于你如何解释。通常，这类似于","start":3069.32,"end":3095.97},{"id":424,"text":"the conditional density of Xt minus the given Xt is a scalar.","zh":"给定 Xt 时 Xt 的条件密度是一个标量。","start":3096.58,"end":3100.8},{"id":425,"text":"But this is very common in machine learning people.","zh":"但这是机器学习领域中非常常见的做法。","start":3102.66,"end":3107.78},{"id":426,"text":"So first of all, this notation Xt, there are two meanings here.","zh":"首先，这个符号 Xt 有两层含义。","start":3109.16,"end":3115.38},{"id":427,"text":"One meaning is the random variable Xt.","zh":"一种含义是随机变量 Xt。","start":3115.6,"end":3117.28},{"id":428,"text":"And another meaning is a particular choice.","zh":"另一种含义是一个特定的选择。","start":3117.88,"end":3120.54},{"id":429,"text":"It's a numerical number that this random variable is taking","zh":"它是一个数值，这个随机变量在某些情况下取到的值。","start":3121.1,"end":3123.58},{"id":430,"text":"in certain cases.","zh":"在某些情况下，它是一个数值，这个随机变量取到的值。","start":3123.58,"end":3124.38},{"id":431,"text":"So I think that's very commonly accepted.","zh":"所以我认为这是非常普遍接受的。","start":3124.38,"end":3129.16},{"id":432,"text":"So you have two notions of this.","zh":"因此你有两种概念。","start":3129.32,"end":3131.74},{"id":433,"text":"And then there is this thing, which","zh":"然后还有这个东西，","start":3134.28,"end":3136.46},{"id":434,"text":"is even more confusing, because this can","zh":"甚至更加令人困惑，因为这可以","start":3136.46,"end":3138.2},{"id":435,"text":"be either scalar or distribution.","zh":"是标量或者分布。","start":3138.2,"end":3139.58},{"id":436,"text":"So I think some people try to make this less ambiguous","zh":"因此我认为有些人试图通过说你可以这样写来减少歧义。","start":3141.6,"end":3146.64},{"id":437,"text":"by saying that you can write this.","zh":"所以实际上，这是这种记号。","start":3146.64,"end":3148.2},{"id":438,"text":"So actually, this is the notation","zh":"所以实际上，这是这种记号。","start":3148.4,"end":3149.9},{"id":439,"text":"I use in the lecture notes.","zh":"我在讲义中使用。","start":3149.9,"end":3151.3},{"id":440,"text":"So you can write this as this.","zh":"因此你可以这样写。","start":3151.3,"end":3154.32},{"id":441,"text":"So xt.","zh":"因此是 xt。","start":3154.62,"end":3155.6},{"id":442,"text":"So and what is this one?","zh":"那么这个是什么？","start":3162.16,"end":3163.86},{"id":443,"text":"This is the Gaussian density, which is the density function.","zh":"这是高斯密度，也就是密度函数。","start":3163.92,"end":3166.3},{"id":444,"text":"Something like this is exponential 1 over 2.","zh":"像这样的形式是指数 1 over 2。","start":3166.6,"end":3171.3},{"id":445,"text":"Like you say, nx comma mu sigma squared","zh":"比如你说的，nx，mu，sigma squared","start":3172.34,"end":3178.64}],"notes":["本段在澄清高斯分布记号。N(µ,σ²) 可以指一个分布；把变量 x 代入其密度函数，得到的则是一个标量密度值。变量、分布、密度函数与均值是不同类型的对象。","为把讲者略写的密度补全，下面给出一维高斯密度的标准排版。归一化系数是 1/√(2πσ²)，指数前有负号；不能把这些部分翻转或省略后仍当作完整的密度公式。","向量高斯还需要协方差矩阵及其行列式，不能把一维的归一化常数直接用于任意维度。本页只展示一维形式，帮助理解本段讨论的记号。"],"formulas":[{"latex":"\\mathcal N(x;\\mu,\\sigma^2)=\\frac{1}{\\sqrt{2\\pi\\sigma^2}}\\exp\\!\\left(-\\frac{(x-\\mu)^2}{2\\sigma^2}\\right)","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版； r thing I want to, okay, I guess maybe before going into that, I think I realized"},{"start":3069.32,"text":"I'm not sure how many of you are confused by some of these notations in machine learning. For example, when I write this, nobody seems to complain with me about the interpretation of this equation. So if you're a mathematician, you're probably not happy because the right-hand side is the distribution. And the left-hand side, it depends on how you interpret it. So typically, this is kind of like a"},{"start":3096.58,"text":"the conditional density of Xt minus the given Xt is a scalar."},{"start":3102.66,"text":"But this is very common in machine learning people."},{"start":3109.16,"text":"So first of all, this notation Xt, there are two meanings here."},{"start":3115.6,"text":"One meaning is the random variable Xt."},{"start":3117.88,"text":"And another meaning is a particular choice."},{"start":3121.1,"text":"It's a numerical number that this random variable is taking"},{"start":3123.58,"text":"in certain cases."},{"start":3124.38,"text":"So I think that's very commonly accepted."},{"start":3129.32,"text":"So you have two notions of this."},{"start":3134.28,"text":"And then there is this thing, which"},{"start":3136.46,"text":"is even more confusing, because this can"},{"start":3138.2,"text":"be either scalar or distribution."},{"start":3141.6,"text":"So I think some people try to make this less ambiguous"},{"start":3146.64,"text":"by saying that you can write this."},{"start":3148.4,"text":"So actually, this is the notation"},{"start":3149.9,"text":"I use in the lecture notes."},{"start":3151.3,"text":"So you can write this as this."},{"start":3154.62,"text":"So xt."},{"start":3162.16,"text":"So and what is this one?"},{"start":3163.92,"text":"This is the Gaussian density, which is the density function."},{"start":3166.6,"text":"Something like this is exponential 1 over 2."},{"start":3172.34,"text":"Like you say, nx comma mu sigma squared"}],"speech_gaps":[{"start":3024.592,"end":3026.224},{"start":3035.47,"end":3037.89},{"start":3132.14,"end":3133.88}],"frame":"../frames/v045/018.webp","frame_time":3012.81},{"title":"条件分布不能等于均值；用 ELBO 学习潜变量模型","segments":[{"id":446,"text":"The square is defined to be the scalar, which","zh":"平方被定义为一个标量，其","start":3178.64,"end":3181.64},{"id":447,"text":"2 pi sigma squared square root this exponential x minus mu squared over 2 sigma squared. So basically, now you make the right-hand side and left-hand side are both functions. That's this, right? They are functions. Oh, this is xt minus 1. So they are both functions in xt minus 1. xt minus 1 is kind of like a variable. This is a function. This is a function. Or maybe if you plug in the numerical numbers, they are both scalars, and they are equal.","zh":"2πσ²的平方根乘以这个指数项，指数项为(x−μ)²除以2σ²。所以基本上，你现在让等式两边都成为函数。对吧？它们都是函数。哦，这里是x_{t−1}。所以它们都是关于x_{t−1}的函数。x_{t−1}有点像一个变量。这是一个函数。这是一个函数。或者，如果你代入数值，它们都是标量，并且相等。","start":3182.7,"end":3207.5},{"id":448,"text":"Or you can probably say there is maybe the law under p theta xt minus 1 given xt is equal to this distribution mu theta xt t. So that's another way to write it. You just say this is the conditional distribution, and this is the conditional distribution. This is a distribution. Both left-hand side and right-hand side are both distributions. But most likely, even if you just write this blue line, you'll be fine in the papers.","zh":"或者你可以说，也许在p_θ下，x_{t−1}给定x_t的分布等于这个分布μ_θ(x_t, t)。所以这是另一种写法。你只需说这是条件分布，这也是条件分布。这是一个分布。等式两边都是分布。但很可能，即使你只写这条蓝色的线，论文中也是可以接受的。","start":3209.8,"end":3239.48},{"id":449,"text":"How do you use a lowercase letter to denote the particular value and a capital letter to denote the random variable? Or is it just one or two? In this area, no. You don't have to use capital letters. And it doesn't actually help that much in some sense. If you really try to write it, in many cases, like, yeah, I don't think it.","zh":"你如何用小写字母表示特定值，用大写字母表示随机变量？或者只是用一个或两个？在这个领域，不。你不需要使用大写字母。在某种意义上，这实际上并
