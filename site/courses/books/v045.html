ese differences, but in machine learning, no. Okay, so that's some clarification of notations, but I think..."},{"start":3292.83,"text":"you know you see this many times so it's good to understand what this means but um um but it's not kind of like that um it's a little bit ambiguous anyway okay so okay so now the next 20 minutes i think let's talk about how to learn um the diffusion models probably we won't able to finish it exactly so but that's okay so um so how do you learn this"},{"start":3326.84,"text":"You use this, the general approach is still this EM algorithm. So the elbow, the evidence lower bound, or variational lower bounds, whatever you call it, they are the same thing. So basically, you want to do maximum likelihood, but you have some hidden variables, and you cannot do that. So you have to use the evidence lower bound. And you derive the elbow lower bound, and then you try to optimize the lower bound."},{"start":3351.79,"text":"So that's the general approach."},{"start":3353.39,"text":"So let's try to go through it."},{"start":3354.87,"text":"There are some nuances on how do you actually"},{"start":3357.09,"text":"apply the methodology."}],"speech_gaps":[],"frame":"../frames/v045/019.webp","frame_time":3190.64},{"title":"ELBO：期望重建项减去 KL 项","segments":[{"id":457,"text":"So the goal is to maximize log p theta of x0.","zh":"因此，我们的目标是最大化 log p_θ(x₀)。","start":3358.83,"end":3366.01},{"id":458,"text":"So by the way, p theta of x0 is basically","zh":"顺便提一下，p_θ(x₀) 基本上是","start":3367.33,"end":3371.07},{"id":459,"text":"the marginal distribution of x0 under this whole p theta thing","zh":"在这一整个 p_θ 模型下 x₀ 的边缘分布。","start":3371.07,"end":3374.75},{"id":460,"text":"like this.","zh":"就像这样。","start":3374.75,"end":3375.17},{"id":461,"text":"Because this p theta defines a process.","zh":"因为这个 p_θ 定义了一个过程。","start":3375.41,"end":3378.07},{"id":462,"text":"P theta defines a process, which means","zh":"p_θ 定义了一个过程，这意味着","start":3378.07,"end":3381.77},{"id":463,"text":"it defines a joint distribution over all the variables,","zh":"它定义了所有变量的联合分布，","start":3381.77,"end":3383.79},{"id":464,"text":"x0 up to xt.","zh":"从 x₀ 到 xₜ。","start":3383.99,"end":3384.75},{"id":465,"text":"And also, it defines a marginal distribution over x0.","zh":"此外，它还定义了对 x0 的边缘分布。","start":3385.93,"end":3389.89},{"id":466,"text":"So this means the marginal distribution of x0","zh":"这意味着在该过程中，x0 的边缘分布","start":3390.23,"end":3394.67},{"id":467,"text":"under that process defined by P theta.","zh":"由 P theta 定义。","start":3395.39,"end":3396.87},{"id":468,"text":"So you want to maximize this.","zh":"因此，你希望最大化这个量。","start":3397.21,"end":3398.49},{"id":469,"text":"And you have a strong distribution of x0 to xt.","zh":"并且你有一个从 x0 到 xt 的强分布。","start":3401.71,"end":3406.33},{"id":470,"text":"right?","zh":"对吗？","start":3406.33,"end":3406.49},{"id":471,"text":"So I think the way to do this is that you treat xt,","zh":"因此，我认为实现这一目标的方法是将 xt 视为","start":3406.65,"end":3415.73},{"id":472,"text":"and you treat this as the latent variable z in the elbow","zh":"以及将此视为 ELBO 中的潜在变量 z。","start":3415.85,"end":3424.47},{"id":473,"text":"that Chris talked about.","zh":"克里斯谈到的那个。","start":3424.47,"end":3426.13},{"id":474,"text":"And you treat this the same as x.","zh":"然后你把它当作 x 来处理。","start":3426.71,"end":3428.53},{"id":475,"text":"So in some sense, if you do all of this as z","zh":"所以从某种意义上说，如果你把所有这些当作 z 来处理","start":3428.69,"end":3431.11},{"id":476,"text":"and all of this as x, and then you","zh":"而把所有这些当作 x，然后你","start":3431.11,"end":3433.31},{"id":477,"text":"you can apply them on the lower bound in some sense.","zh":"可以在某种意义上将它们应用于下界上。","start":3433.31,"end":3439.33},{"id":478,"text":"And oh, and by the way, so maybe let","zh":"对了，也许让我试着提醒一下我们之前讨论的肘部（ELBO）。","start":3440.11,"end":3443.15},{"id":479,"text":"me try to remind ourselves what's","zh":"我们所谈论的肘部是什么？","start":3443.15,"end":3446.09},{"id":480,"text":"the elbow we have talked about.","zh":"我们所谈论的肘部是什么。","start":3446.09,"end":3449.21},{"id":481,"text":"I think the elbow we have talked about is the","zh":"我认为我们讨论的肘部是指","start":3449.33,"end":3451.11},{"id":482,"text":"the log of p, x, say, theta is larger than, I think,","zh":"p, x 的对数，比如说，theta 比较大，我想，","start":3452.2,"end":3460.92},{"id":483,"text":"expectation under some distribution q,","zh":"在某个分布 q 下的期望，","start":3463.48,"end":3465.82},{"id":484,"text":"say, the log of p,","zh":"比如说，p 的对数，","start":3468.02,"end":3470.88},{"id":485,"text":"x given z minus KL between q and p.","zh":"x 给定 z 减去 q 和 p 之间的 KL 散度。","start":3476.72,"end":3482.18},{"id":486,"text":"and p, the distribution of z.","zh":"以及 p，z 的分布。","start":3482.2,"end":3483.88},{"id":487,"text":"And this is the notation we used in the previous lectures.","zh":"这是我们之前课程中使用的符号。","start":3485.96,"end":3489.44},{"id":488,"text":"So you have some kind of posterior q,","zh":"因此，你有一些后验分布 q，","start":3489.6,"end":3493.16},{"id":489,"text":"which is to estimate z given x.","zh":"这是在给定 x 的情况下估计 z。","start":3493.44,"end":3495.38},{"id":490,"text":"And you first sample it from this posterior,","zh":"你首先从这个后验分布中进行采样，","start":3495.86,"end":3500.36},{"id":491,"text":"and you look at the reconstruction loss.","zh":"然后你观察重建损失。","start":3500.52,"end":3502.4},{"id":492,"text":"And this minus the KL divergence between the prior,","zh":"然后减去先验分布与后验分布之间的 KL 散度，","start":3502.64,"end":3505.34},{"id":493,"text":"prior, the Pz, and the posterior Q.","zh":"先验分布是 Pz，后验分布是 Q。","start":3505.34,"end":3510.48},{"id":494,"text":"So that's the elbow lower bound that we're in.","zh":"这就是我们所处的肘部下界。","start":3512.52,"end":3518.14},{"id":495,"text":"One of the versions of the elbow lower bound,","zh":"肘部下界的一个版本，","start":3518.18,"end":3519.8},{"id":496,"text":"and there are several different equivalent versions.","zh":"并且存在几种不同的等价版本。","start":3519.9,"end":3521.48},{"id":497,"text":"So we're going to use this.","zh":"所以我们要使用这个。","start":3521.78,"end":3522.78},{"id":498,"text":"And so what is the Q we are going to apply?","zh":"那么我们要应用的 Q 是什么？","start":3526.14,"end":3529.46},{"id":499,"text":"So let's see.","zh":"让我们看看。","start":3531.66,"end":3532.74}],"notes":["用潜变量 z 表示中间变量时，ELBO 可以分成两部分：在 q(z|x) 下的期望对数似然，以及 q(z|x) 相对先验 pθ(z) 的 KL 散度。原始口头讲述可能略掉期望符号，正式排版时必须保留。","KL 项前的负号意味着：在最大化下界时，较大的分布失配会降低目标。它不是说 KL 本身为负，也不是说最小化一个负 KL 就能训练模型。","这里的 q 是引入的辅助条件分布；在本课程随后构造的扩散目标中，q 来自已知前向加噪过程。不同应用对 q 的定义不同，因此不能只凭一个字母就把它固定解释成某个特定模型的后验。"],"formulas":[{"latex":"\\log p_\\theta(x)\\geq\\mathbb E_{q(z\\mid x)}[\\log p_\\theta(x\\mid z)]-D_{\\mathrm{KL}}\\!\\left(q(z\\mid x)\\,\\|\\,p_\\theta(z)\\right)","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版；适用假设及记号修复已在上文说明。","evidence":"So the goal is to maximize log p theta of x0. So by the way, p theta of x0 is basically the marginal distribution of x0 under this whole p theta thing like this. Because this p theta defines a process. P theta defines a process, which means it defines a joint distribution over all the variables, x0 up to xt. And also, it defines a marginal distribution over x0. So this means the marginal distribution of x0 under that process defined by P theta. So you want to maximize this. And you have a strong distribution of x0 to xt. right? So I think the way to do this is that you treat xt, and you treat this as the latent variable z in the elbow that Chris talked about. And you treat this the same as x. So in some sense, if you do all of this as z and all of this as x, and then you you can apply them on the lower bound in some sense. And oh, and by the way, so maybe let me try to remind ourselves what's the elbow we have talked about. I think the elbow we have talked about is the the log of p, x, say, theta is larger than, I think, expectation under some distribution q, say, the log of p, x given z minus KL between q and p. and p, the distribution of z. And this is the notation we used in the previous lectures. So you have some kind of posterior q, which is to estimate z given x. And you first sample it from this posterior, and you look at the reconstruction loss. And this minus the KL divergence between the prior, prior, the Pz, and the posterior Q. So that's the elbow lower bound that we're in. One of the versions of the elbow lower bound, and there are several different equivalent versions. So we're going to use this. And so what is the Q we are going to apply? So let's see."}],"uncertainties":["log of p, x, say, theta is larger than, I think"],"diagram":"none","start":3358.83,"end":3532.74,"asr_flags":[471],"boards":[],"translation_complete":true,"translated_segments":43,"raw_segments":[{"start":3358.83,"text":"So the goal is to maximize log p theta of x0."},{"start":3367.33,"text":"So by the way, p theta of x0 is basically"},{"start":3371.07,"text":"the marginal distribution of x0 under this whole p theta thing"},{"start":3374.75,"text":"like this."},{"start":3375.41,"text":"Because this p theta defines a process."},{"start":3378.07,"text":"P theta defines a process, which means"},{"start":3381.77,"text":"it defines a joint distribution over all the variables,"},{"start":3383.99,"text":"x0 up to xt."},{"start":3385.93,"text":"And also, it defines a marginal distribution over x0."},{"start":3390.23,"text":"So this means the marginal distribution of x0"},{"start":3395.39,"text":"under that process defined by P theta."},{"start":3397.21,"text":"So you want to maximize this."},{"start":3401.71,"text":"And you have a strong distribution of x0 to xt."},{"start":3406.33,"text":"right?"},{"start":3406.65,"text":"So I think the way to do this is that you treat xt,"},{"start":3415.85,"text":"and you treat this as the latent variable z in the elbow"},{"start":3424.47,"text":"that Chris talked about."},{"start":3426.71,"text":"And you treat this the same as x."},{"start":3428.69,"text":"So in some sense, if you do all of this as z"},{"start":3431.11,"text":"and all of this as x, and then you"},{"start":3433.31,"text":"you can apply them on the lower bound in some sense."},{"start":3440.11,"text":"And oh, and by the way, so maybe let"},{"start":3443.15,"text":"me try to remind ourselves what's"},{"start":3446.09,"text":"the elbow we have talked about."},{"start":3449.33,"text":"I think the elbow we have talked about is the"},{"start":3452.2,"text":"the log of p, x, say, theta is larger than, I think,"},{"start":3463.48,"text":"expectation under some distribution q,"},{"start":3468.02,"text":"say, the log of p,"},{"start":3476.72,"text":"x given z minus KL between q and p."},{"start":3482.2,"text":"and p, the distribution of z."},{"start":3485.96,"text":"And this is the notation we used in the previous lectures."},{"start":3489.6,"text":"So you have some kind of posterior q,"},{"start":3493.44,"text":"which is to estimate z given x."},{"start":3495.86,"text":"And you first sample it from this posterior,"},{"start":3500.52,"text":"and you look at the reconstruction loss."},{"start":3502.64,"text":"And this minus the KL divergence between the prior,"},{"start":3505.34,"text":"prior, the Pz, and the posterior Q."},{"start":3512.52,"text":"So that's the elbow lower bound that we're in."},{"start":3518.18,"text":"One of the versions of the elbow lower bound,"},{"start":3519.9,"text":"and there are several different equivalent versions."},{"start":3521.78,"text":"So we're going to use this."},{"start":3526.14,"text":"And so what is the Q we are going to apply?"},{"start":3531.66,"text":"So let's see."}],"speech_gaps":[{"start":3399.408,"end":3401.31},{"start":3471.28,"end":3473.04},{"start":3523.696,"end":3525.74}],"frame":"../frames/v045/020.webp","frame_time":3370.83},{"title":"扩散模型中的后验分布与KL散度","segments":[{"id":500,"text":"So the qz in the previous lecture knows corresponds to here, you know, for our case, it's the","zh":"所以上一节课中的 qz 对应到这里，你们知道，在我们的情况下，它是","start":3538.42,"end":3545.6},{"id":501,"text":"q x1 to t gamma x0, because you can see that z is my, x-minus after xt is my z.","zh":"q x1 到 t gamma x0，因为你可以看到，z 是我的 x 减去 xt 后的 z。","start":3545.6,"end":3553.94},{"id":502,"text":"So qz is the posterior where you try to infer the latent variable.","zh":"所以 qz 是你试图推断潜在变量的后验分布。","start":3554.16,"end":3557.8},{"id":503,"text":"So that's why it's about giving the","zh":"所以这就是为什么它涉及到给定","start":3557.8,"end":3560.12},{"id":504,"text":"x0, how do you federate a variable? That's why this is my correspondence. I'm trying to apply what we have learned last time to this case. So that's why I'm making a correspondence between the variables. So this is my qz. And the reason why we didn't write qz given x is because","zh":"x0，你如何推断一个变量？这就是为什么这是我的对应关系。我试图将我们上一节课所学的内容应用到这个情况中。所以这就是为什么我在变量之间建立对应关系。所以这就是我的 qz。而我们没有写 qz 给定 x 的原因","start":3561.43,"end":3581.27},{"id":505,"text":"Last time, the x is kind of like a fixed variable. So in some sense, you should read and write qz given x in the previous lecture. But just in that last lecture, the x is kind of like fixed in that context. And this is OK. So now let's try to apply this thing.","zh":"是上一节课中，x 有点像一个固定的变量。某种意义上，你应该读作并写成 qz 给定 x 在上一节课中。但就在那节课中，x 在那个上下文中有点像固定的。这没问题。现在让我们尝试应用这个概念。","start":3581.8,"end":3609.17},{"id":506,"text":"I know this kind of like correspondence","zh":"我知道这种对应关系有点像","start":3610.1,"end":3611.48},{"id":507,"text":"to our log px, p theta x, x0.","zh":"应用到我们的 log px，p theta x，x0 上。","start":3611.48,"end":3615.12},{"id":508,"text":"So for us, log p theta x0 is bigger than, I guess,","zh":"所以对我们来说，log p_theta(x0) 大于，我想，","start":3615.24,"end":3626.16},{"id":509,"text":"depending on how much details you want to see.","zh":"这取决于你想要看到多少细节。","start":3626.24,"end":3629.02},{"id":510,"text":"But the first step, I think we can probably just direct apply","zh":"但第一步，我认为我们可能可以直接应用","start":3629.12,"end":3632.68},{"id":511,"text":"this, if you believe in this.","zh":"这个，如果你相信这一点的话。","start":3632.68,"end":3634.84},{"id":512,"text":"This is in the lecture notes.","zh":"这在讲义中提到过。","start":3634.92,"end":3635.96},{"id":513,"text":"So this is larger than expectation","zh":"因此，这大于重构损失的期望值，","start":3635.96,"end":3639.26},{"id":514,"text":"of the reconstruction loss, which is a p theta.","zh":"这个期望值是关于 p_theta 的。","start":3640.16,"end":3643.72},{"id":515,"text":"What is x?","zh":"什么是 x？","start":3644.16,"end":3645.14},{"id":516,"text":"x is x0.","zh":"x 是 x0。","start":3645.22,"end":3645.9},{"id":517,"text":"What is z?","zh":"什么是 z？","start":3646.1,"end":3646.7},{"id":518,"text":"It's x1 up to xt minus the KL.","zh":"它是 x1 到 xt 减去 KL 散度。","start":3646.86,"end":3652.08},{"id":519,"text":"So the KL between what?","zh":"所以 KL 散度是在什么之间？","start":3652.28,"end":3653.86},{"id":520,"text":"Q. Q is this posterior of Q given x1 to tx0.","zh":"Q. Q 是给定 x1 到 tx0 的后验分布。","start":3654.14,"end":3660.8},{"id":521,"text":"So this is q x1 to t given x0.","zh":"因此，这是 q(x1 到 xt 给定 x0)。","start":3660.8,"end":3666.78},{"id":522,"text":"And this Pz is the distribution of x1 up to xt.","zh":"而这个 Pz 是 x1 到 xt 的分布。","start":3669.24,"end":3676.44},{"id":523,"text":"So this is P theta x1 to t.","zh":"因此，这是 P_θ(x1 到 xt)。","start":3676.68,"end":3683.68},{"id":524,"text":"By the way, here, in some sense, this","zh":"顺便说一下，这里，从某种意义上讲，这","start":3685.6,"end":3687.62},{"id":525,"text":"is interpreted as a distribution as opposed to scalar.","zh":"被解释为一个分布，而不是标量。","start":3687.62,"end":3689.7},{"id":526,"text":"Taylor, just to, I think in the lecture notes,","zh":"泰勒，只是为了，我认为在讲义中，","start":3689.7,"end":3692.82},{"id":527,"text":"I'm using the more formal notation.","zh":"我使用了更正式的符号。","start":3692.92,"end":3695.0},{"id":528,"text":"But here, I just used the informal version.","zh":"但在这里，我只是用了非正式的版本。","start":3695.26,"end":3698.12},{"id":529,"text":"This is a distribution of x1 to t given x0.","zh":"这是在给定 x0 的情况下，x1 到 t 的分布。","start":3698.28,"end":3700.4},{"id":530,"text":"This is a distribution of x1 to t and the p theta.","zh":"这是 x1 到 t 以及 p_θ 的分布。","start":3700.48,"end":3702.64},{"id":531,"text":"And you are looking at the KL divergence","zh":"你正在查看 KL 散度","start":3702.92,"end":3705.5},{"id":532,"text":"between the two distributions.","zh":"在两个分布之间。","start":3705.5,"end":3706.78},{"id":533,"text":"Any questions so far?","zh":"到目前为止，有问题吗？","start":3710.16,"end":3711.38},{"id":534,"text":"I see some confusions, but I'm not sure","zh":"我看到有些困惑，但我不确定","start":3712.5,"end":3714.5},{"id":535,"text":"which part of you is confusing.","zh":"你们哪一部分感到困惑。","start":3714.5,"end":3715.68},{"id":536,"text":"I guess.","zh":"我想是吧。","start":3715.96,"end":3716.32}],"notes":["本段主要讲解扩散模型中后验分布qz的定义及其与KL散度的关系。讲者提到qz是用于推断潜在变量的后验分布，并指出在之前的课程中，x被视为固定变量，因此在当前上下文中，qz的定义与之前有所不同。","讲者进一步说明了log pθ(x0)与期望重建损失之间的关系，并指出x0是原始数据，z是x1到xt的差值，涉及KL散度的计算。","讲者提到KL散度用于比较两个分布之间的差异，即q(x1到t|x0)和pθ(x1到t)之间的差异。这表明在扩散模型中，KL散度是衡量模型与真实数据分布之间差异的重要指标。","讲者还提到在课程笔记中使用了更正式的符号，但在当前讲解中使用了更非正式的版本，以帮助理解。这表明在教学过程中，讲者会根据需要调整符号的复杂程度。","最后，讲者询问学生是否有问题，并指出部分学生可能存在困惑，但不确定具体是哪一部分。这表明讲者在教学过程中会关注学生的理解情况，并准备进一步解释。","整体来看，本段内容围绕扩散模型中的后验分布、KL散度及其在模型训练中的应用展开，强调了理论与实际应用之间的联系。"],"formulas":[],"uncertainties":["q x1 to t gamma x0","x-minus after xt is my z","federate a variable","Taylor, just to, I think in the lecture notes"],"diagram":"none","start":3538.42,"end":3716.32,"asr_flags":[508],"math_clarifications":["原始公式未明确KL散度的定义域和上下文，且未体现变量之间的关系。此外，未明确说明q(x_1^t|x_0)和p_θ(x_1^t)的具体形式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":37,"raw_segments":[{"start":3538.42,"text":"So the qz in the previous lecture knows corresponds to here, you know, for our case, it's the"},{"start":3545.6,"text":"q x1 to t gamma x0, because you can see that z is my, x-minus after xt is my z."},{"start":3554.16,"text":"So qz is the posterior where you try to infer the latent variable."},{"start":3557.8,"text":"So that's why it's about giving the"},{"start":3561.43,"text":"x0, how do you federate a variable? That's why this is my correspondence. I'm trying to apply what we have learned last time to this case. So that's why I'm making a correspondence between the variables. So this is my qz. And the reason why we didn't write qz given x is because"},{"start":3581.8,"text":"Last time, the x is kind of like a fixed variable. So in some sense, you should read and write qz given x in the previous lecture. But just in that last lecture, the x is kind of like fixed in that context. And this is OK. So now let's try to apply this thing."},{"start":3610.1,"text":"I know this kind of like correspondence"},{"start":3611.48,"text":"to our log px, p theta x, x0."},{"start":3615.24,"text":"So for us, log p theta x0 is bigger than, I guess,"},{"start":3626.24,"text":"depending on how much details you want to see."},{"start":3629.12,"text":"But the first step, I think we can probably just direct apply"},{"start":3632.68,"text":"this, if you believe in this."},{"start":3634.92,"text":"This is in the lecture notes."},{"start":3635.96,"text":"So this is larger than expectation"},{"start":3640.16,"text":"of the reconstruction loss, which is a p theta."},{"start":3644.16,"text":"What is x?"},{"start":3645.22,"text":"x is x0."},{"start":3646.1,"text":"What is z?"},{"start":3646.86,"text":"It's x1 up to xt minus the KL."},{"start":3652.28,"text":"So the KL between what?"},{"start":3654.14,"text":"Q. Q is this posterior of Q given x1 to tx0."},{"start":3660.8,"text":"So this is q x1 to t given x0."},{"start":3669.24,"text":"And this Pz is the distribution of x1 up to xt."},{"start":3676.68,"text":"So this is P theta x1 to t."},{"start":3685.6,"text":"By the way, here, in some sense, this"},{"start":3687.62,"text":"is interpreted as a distribution as opposed to scalar."},{"start":3689.7,"text":"Taylor, just to, I think in the lecture notes,"},{"start":3692.92,"text":"I'm using the more formal notation."},{"start":3695.26,"text":"But here, I just used the informal version."},{"start":3698.28,"text":"This is a distribution of x1 to t given x0."},{"start":3700.48,"text":"This is a distribution of x1 to t and the p theta."},{"start":3702.92,"text":"And you are looking at the KL divergence"},{"start":3705.5,"text":"between the two distributions."},{"start":3710.16,"text":"Any questions so far?"},{"start":3712.5,"text":"I see some confusions, but I'm not sure"},{"start":3714.5,"text":"which part of you is confusing."},{"start":3715.96,"text":"I guess."}],"speech_gaps":[{"start":3667.18,"end":3668.84}],"frame":"../frames/v045/021.webp","frame_time":3550.42},{"title":"扩散模型中的分布与条件概率","segments":[{"id":537,"text":"Define the differences. The differences between Q and P. Q is this process. Q is this, how do I say this? Q is the ground truth drawn distribution. So you have, I guess you understand the Q, the forward Q. So this forward process of Q defines the drawn distribution between X0 and Xt. So basically, for every","zh":"定义差异。Q和P之间的差异。Q是这个过程。Q是这个，我该怎么说呢？Q是真实数据的分布。所以你大概理解了Q，也就是前向Q。这个前向过程Q定义了X0和Xt之间的抽样分布。基本上，对于每一条轨迹，你都有一个密度值。你有一个数值。因此，你有一个关于轨迹的分布。这有点像如果你有一个关于x1到xt的多变量分布。然后你可以查看这个联合分布下的所有条件分布。你可以查看比如xt-1给定xt。一旦你有了联合分布，你就可以查看任何条件分布。","start":3718.34,"end":3747.87},{"id":538,"text":"every trajectory, you have a density. You have a number. So you have a distribution over the trajectories. And it's kind of like if you have a multi-variable distribution over x1 up to xt. And then you can look at all the conditionals under this joint distribution. You can look at maybe xt minus 1 given xt. You can look at any of the conditionals once you have a joint distribution.","zh":"所以这就是q。每次我说x1到xt给定x0，这意味着你查看联合分布，并说，哦，我正在查看这个联合分布下的条件分布。这清楚吗？是的。而p_theta是这个我定义的人工分布。","start":3749.04,"end":3772.34},{"id":539,"text":"So that's q. So every time I say x1 to t given x0, that means that you look at the joint distribution and you say, oh, I'm looking at the conditionals under that joint distribution. Does that make sense? Yeah. And p theta is this artificial one I defined.","zh":"所以这就是q。所以每次我说给定x0的x1到t，这意味着你要看联合分布，并说，哦，我在该联合分布下的条件分布。这清楚吗？是的。而p_theta是这个我定义的人工分布。","start":3773.78,"end":3793.78},{"id":540,"text":"in this way. So it also induces a joint distribution. Because once you give me theta, I'm going to give you a joint distribution over x1 up to xt. And then you can look at any conditionals, whatever you want, under that joint distribution. So everything there is defined as p theta. Any other questions?","zh":"以及去噪过程作为先验。我对这一点有点困惑。比如，为什么你会用这个作为大多数解决方案？因为我的意思是，先验基本上是你对整个事物成为的先验想法。然后后验是你后来学习的。而后验就像是最糟糕的。是的，我理解。所以，这是有意为之的，是的。","start":3794.56,"end":3815.02},{"id":541,"text":"and the denoising process as the prior. I'm kind of confused by that. Like, why are you using that most of the solutions? Because I mean, like, prior is basically what you thought about the providence in the whole thing to become. And then post-tune is something you learn later. And then post-tune is like the worst. Yes, I understand. So, that's intentional, yes. So,","zh":"某种意义上，它有点像一个，是的，我想这就是情况。之前，这两个都是参数化的。现在你只是让其中一个不参数化。比如在VAE中，我们没有教它。我不确定。但在VAE中，你会看到所有东西都是由某个参数化的。这是theta。这是phi。但现在其中一部分变成了固定过程。也许另一种思考方式是，这个公式，","start":3824.03,"end":3851.11},{"id":542,"text":"In some sense, it's kind of like a, yeah, I think that's the case. Just before, both of these are parametrized. And now you just make one of them not parametrized. Like in VAE, we didn't teach it. I don't know. But in VAE, you see everything is parametrized by something. This is theta. This is phi. But now just some part of it becomes a fixed process. Maybe another way to think about it is that this formula,","zh":"某种意义上，它有点像一个，是的，我认为就是这种情况。之前，这两个都是参数化的。现在你只是让其中一个不参数化。比如在VAE中，我们没有教它。我不确定。但在VAE中，你看到一切都是由某个参数参数化的。这里是theta，这里是phi。但现在其中一部分变成了固定过程。也许另一种思考方式是，这个公式，","start":3854.02,"end":3886.28}],"notes":["本段讲解了扩散模型中Q和P的分布差异。Q是真实数据分布，定义了从X0到Xt的前向过程，每个轨迹都有一个密度，从而形成轨迹上的分布。P_theta是人工定义的分布，通过参数θ定义了从X1到Xt的联合分布，并允许查看任意条件概率。","讲者提到，当拥有联合分布时，可以查看任意条件概率，例如xt-1给定xt。这说明了联合分布的条件概率性质，是理解扩散模型中生成过程的关键。","讲者提到P_theta是人工定义的分布，通过参数θ定义了从X1到Xt的联合分布，并允许查看任意条件概率。这表明P_theta是模型生成过程的核心，与Q的自然分布形成对比。","讲者提到，将去噪过程视为先验，这可能引起混淆。先验通常指对数据分布的先验知识，而后验则是通过学习得到的。讲者指出，这种设计是故意的，可能与VAE中的参数化方式不同。","讲者提到，VAE中所有内容都是参数化的，而扩散模型中部分过程是固定的。这说明了扩散模型与VAE在参数化方式上的区别，即部分过程不再依赖参数θ。","讲者提到，另一种思考方式是将公式视为某种关系，但未明确说明具体公式。这表明讲者可能在讨论某种数学关系，但未明确表达，需要进一步澄清。"],"formulas":[{"latex":"q(x_1, \\ldots, x_t) = \\text{joint distribution over trajectories}","symbols":"q(x_1, ..., x_t) 表示轨迹上的联合分布","explanation":"公式正确，描述了q(x_1, ..., x_t)为轨迹上的联合分布，符合上下文中的定义。","evidence":"Define the differences. The differences between Q and P. Q is this process. Q is this, how do I say this? Q is the ground truth drawn distribution. So you have, I guess you understand the Q, the forward Q. So this forward process of Q defines the drawn distribution between X0 and Xt. So basically, for every every trajectory, you have a density. You have a number. So you have a distribution over the trajectories. And it's kind of like if you have a multi-variable distribution over x1 up to xt. And then you can look at all the conditionals under this joint distribution. You can look at maybe xt minus 1 given xt. You can look at any of the conditionals once you have a joint distribution."},{"latex":"p_\\theta(x_1, \\ldots, x_t) = \\text{joint distribution defined by } \\theta","symbols":"p_\theta(x_1, ..., x_t) 表示由参数θ定义的联合分布","explanation":"公式正确，描述了p_\theta(x_1, ..., x_t)为由参数θ定义的联合分布，符合上下文中的定义。","evidence":"So that's q. So every time I say x1 to t given x0, that means that you look at the joint distribution and you say, oh, I'm looking at the conditionals under that joint distribution. Does that make sense? Yeah. And p theta is this artificial one I defined. in this way. So it also induces a joint distribution. Because once you give me theta, I'm going to give you a joint distribution over x1 up to xt. And then you can look at any conditionals, whatever you want, under that joint distribution. So everything there is defined as p theta. Any other questions?"}],"uncertainties":["providence in the whole thing to become"],"diagram":"none","start":3718.34,"end":3886.28,"asr_flags":[],"math_clarifications":["上下文提到的根号修正（如α_t=1−β_t，x_t=sqrt(α_t)x_(t−1)+sqrt(β_t)ε_t）未在公式中体现，但这些修正不影响当前公式的正确性。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3718.34,"text":"Define the differences. The differences between Q and P. Q is this process. Q is this, how do I say this? Q is the ground truth drawn distribution. So you have, I guess you understand the Q, the forward Q. So this forward process of Q defines the drawn distribution between X0 and Xt. So basically, for every"},{"start":3749.04,"text":"every trajectory, you have a density. You have a number. So you have a distribution over the trajectories. And it's kind of like if you have a multi-variable distribution over x1 up to xt. And then you can look at all the conditionals under this joint distribution. You can look at maybe xt minus 1 given xt. You can look at any of the conditionals once you have a joint distribution."},{"start":3773.78,"text":"So that's q. So every time I say x1 to t given x0, that means that you look at the joint distribution and you say, oh, I'm looking at the conditionals under that joint distribution. Does that make sense? Yeah. And p theta is this artificial one I defined."},{"start":3794.56,"text":"in this way. So it also induces a joint distribution. Because once you give me theta, I'm going to give you a joint distribution over x1 up to xt. And then you can look at any conditionals, whatever you want, under that joint distribution. So everything there is defined as p theta. Any other questions?"},{"start":3824.03,"text":"and the denoising process as the prior. I'm kind of confused by that. Like, why are you using that most of the solutions? Because I mean, like, prior is basically what you thought about the providence in the whole thing to become. And then post-tune is something you learn later. And then post-tune is like the worst. Yes, I understand. So, that's intentional, yes. So,"},{"start":3854.02,"text":"In some sense, it's kind of like a, yeah, I think that's the case. Just before, both of these are parametrized. And now you just make one of them not parametrized. Like in VAE, we didn't teach it. I don't know. But in VAE, you see everything is parametrized by something. This is theta. This is phi. But now just some part of it becomes a fixed process. Maybe another way to think about it is that this formula,"}],"speech_gaps":[{"start":3816.496,"end":3819.36},{"start":3819.36,"end":3823.63}],"frame":"../frames/v045/022.webp","frame_time":3730.34},{"title":"KL 项的作用与通用变分下界","segments":[{"id":543,"text":"And our previous kind of fracture, this formula Q is the posterior, right? Yeah, exactly. But this formula works for anything. It's just any distribution. It's just an inequality. So it doesn't matter what's the definition of Q or not. So we are using the formula. It's a generic formula. Whatever P and Q you put in is always correct. No, this is.","zh":"我们之前提到的那种断裂，这个公式 Q 是后验分布，对吧？是的，没错。但这个公式适用于任何情况。它只是任何分布，只是一个不等式。所以无论 Q 的定义是什么，都不重要。我们正在使用这个公式。这是一个通用公式。无论你输入的是什么 P 和 Q，它总是正确的。没错。","start":3888.06,"end":3916.6},{"id":544,"text":"You know, I'm just taking a formula from last time. So I guess you are asking why in the lower bound there is a minus KL divergence. I think, I'm not sure whether it's an intuitive explanation, but it's a sanity check, right? So if you don't have the KL divergence, then I think you can just choose, you have perfect, you can easily have perfect reconstruction. You just let z to be the same as x.","zh":"你知道的，我只是从上次课上拿了一个公式。所以我想你是在问为什么在下界中有一个负的 KL 散度。我认为，我不确定这是否是一个直观的解释，但这是一个合理性检查，对吧？如果你没有 KL 散度，那么我想你可以随意选择，你拥有完美的，你可以轻松地实现完美的重建。你只需让 z 等于 x。","start":3917.87,"end":3948.15},{"id":545,"text":"You don't even kind of like doing any kind of posterior estimate. You just say z is equal to x, then you have perfect reconstruction. It's kind of like you are lacking regularization in some sense. I think actually in the ELBO literature, this is kind of viewed as a regularization term. You cannot make your posterior too","zh":"你甚至不需要做任何后验估计。你只需说 z 等于 x，那么你就有完美的重建。从某种意义上说，这似乎缺乏正则化。我想在 ELBO 文献中，这被看作是一个正则化项。你不能让你的后验分布过于复杂，对吧？你的后验分布必须接近先验分布。否则，你就是在某种程度上过度拟合了你的数据。这有道理吗？好的，明白了。这就是全部。顺便说一句。","start":3948.77,"end":3971.09},{"id":546,"text":"too complex, right? Your posterior has to be close to the prior. Otherwise, it's just that you're overfitting to your data in some sense. Does it make some sense? So OK, cool. So that's all. By the way.","zh":"太复杂了，对吧？你的后验分布必须接近先验分布。否则，这仅仅意味着你在某种程度上过拟合了数据。这有没有道理呢？好的，明白了。好了，就这样。顺便说一句。","start":3972.55,"end":3990.63},{"id":547,"text":"I've never seen people deriving this.","zh":"还有一些步骤还没讲到。","start":3993.64,"end":3995.24},{"id":548,"text":"There's still one or two steps below.","zh":"但这是我简化了的推导过程。","start":3996.22,"end":3997.6},{"id":549,"text":"But this is my simplification of the derivations.","zh":"我看到的所有资料中，都是","start":3998.32,"end":4002.18},{"id":550,"text":"All the materials I've seen, it's","zh":"我所见过的所有资料，都是","start":4002.36,"end":4004.42},{"id":551,"text":"kind of like you just start with the lower bound,","zh":"有点像你一开始就设定一个下界","start":4004.42,"end":4007.62},{"id":552,"text":"and you just do kind of like a one-page derivation,","zh":"然后你只是做一页左右的推导","start":4007.74,"end":4009.94},{"id":553,"text":"and you get some formula, and that's it.","zh":"得到一个公式，然后就结束了","start":4010.02,"end":4012.04},{"id":554,"text":"So at least I think we are introducing a little structure","zh":"所以我认为我们在这里引入了一点结构","start":4012.2,"end":4015.18},{"id":555,"text":"here, hopefully.","zh":"希望如此","start":4015.18,"end":4015.9},{"id":556,"text":"Like at least it makes the proof shorter.","zh":"至少它让证明变得更简短","start":4016.94,"end":4018.96},{"id":557,"text":"So OK, so what's the next step?","zh":"所以好的，下一步是什么呢？","start":4019.42,"end":4021.42},{"id":558,"text":"So the next step is that these are both distributions over the trajectory from 1 to t.","zh":"下一步是，这些分布都是针对从1到t的轨迹","start":4021.42,"end":4030.1},{"id":559,"text":"And you can use this so-called chain rule for KL to decompose.","zh":"你可以使用这种所谓的KL链式法则来进行分解。","start":4030.54,"end":4035.5},{"id":560,"text":"So let me see where I should write it. Maybe just start from here.","zh":"那么让我看看我应该在哪里写下这个。也许就从这里开始。","start":4036.0,"end":4041.1},{"id":561,"text":"So there is this fact about KL, which is like, so this is the Chen rule for KL,","zh":"这里有一个关于KL的性质，也就是所谓的Chen法则对于KL而言，","start":4051.42,"end":4059.44}],"notes":["讲者用一个极端例子说明只追求重建可能出现的问题：如果潜变量直接复制输入，就可能轻易得到很好的重建，却没有学到希望得到的潜变量结构。KL 项约束辅助分布与先验之间的失配。","这种“重建项减去 KL”的形式可以作为直观理解，但严格表达仍需要期望与各分布的条件。原文也强调，相关变分不等式是通用的；P、Q 的角色必须根据当前定义来判断，不能把任何 Q 都自动称作后验、任何 P 都称作先验。","KL 的方向同样重要。D_KL(Q||P) 是在 Q 下对 log(Q/P) 取期望，通常并不等于 D_KL(P||Q)。"],"formulas":[{"latex":"D_{\\mathrm{KL}}(Q\\|P)=\\mathbb E_Q\\!\\left[\\log\\frac{q(Z)}{p(Z)}\\right]","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版；适用假设及记号修复已在上文说明。","evidence":"And our previous kind of fracture, this formula Q is the posterior, right? Yeah, exactly. But this formula works for anything. It's just any distribution. It's just just inequality. So it doesn't matter what's the definition of Q or not. So we are using the formula. It's a generic formula. Whatever P and Q you put in is always correct. No, this is. You know, I'm just taking a formula from last time. So I guess you are asking why in the lower bound there is a minus KL divergence. I think, I'm not sure whether it's an intuitive explanation, but it's a sanity check, right? So if you don't have the KL divergence, then I think you can just choose, you have perfect, you can easily have perfect reconstruction. You just let z to be the same as x. You don't even kind of like doing any kind of posterior estimate. You just say z is equal to x, then you have perfect reconstruction. It's kind of like you are lacking regularization in some sense. I think actually in the ELBO literature, this is kind of viewed as a regularization term. You cannot make your posterior too too complex, right? Your posterior has to be close to the prior. Otherwise, it's just that you're overfitting to your data in some sense. Does it make some sense? So OK, cool. So that's all. By the way. I've never seen people deriving this. There's still one or two steps below. But this is my simplification of the derivations. All the materials I've seen, it's kind of like you just start with the lower bound, and you just do kind of like a one-page derivation, and you get some formula, and that's it. So at least I think we are introducing a little structure here, hopefully. Like at least it makes the proof shorter. So OK, so what's the next step? So the next step is that these are both distributions over the trajectory from 1 to t. And you can use this so-called chain rule for KL to decompose. So let me see where I should write it. Maybe just start from here. So there is this fact about KL, which is like, so this is the Chen rule for KL,"},{"latex":"\\mathrm{ELBO}=\\mathbb E_{q(z\\mid x)}[\\log p_\\theta(x\\mid z)]-D_{\\mathrm{KL}}(q(z\\mid x)\\|p_\\theta(z))","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版；适用假设及记号修复已在上文说明。","evidence":"And our previous kind of fracture, this formula Q is the posterior, right? Yeah, exactly. But this formula works for anything. It's just any distribution. It's just just inequality. So it doesn't matter what's the definition of Q or not. So we are using the formula. It's a generic formula. Whatever P and Q you put in is always correct. No, this is. You know, I'm just taking a formula from last time. So I guess you are asking why in the lower bound there is a minus KL divergence. I think, I'm not sure whether it's an intuitive explanation, but it's a sanity check, right? So if you don't have the KL divergence, then I think you can just choose, you have perfect, you can easily have perfect reconstruction. You just let z to be the same as x. You don't even kind of like doing any kind of posterior estimate. You just say z is equal to x, then you have perfect reconstruction. It's kind of like you are lacking regularization in some sense. I think actually in the ELBO literature, this is kind of viewed as a regularization term. You cannot make your posterior too too complex, right? Your posterior has to be close to the prior. Otherwise, it's just that you're overfitting to your data in some sense. Does it make some sense? So OK, cool. So that's all. By the way. I've never seen people deriving this. There's still one or two steps below. But this is my simplification of the derivations. All the materials I've seen, it's kind of like you just start with the lower bound, and you just do kind of like a one-page derivation, and you get some formula, and that's it. So at least I think we are introducing a little structure here, hopefully. Like at least it makes the proof shorter. So OK, so what's the next step? So the next step is that these are both distributions over the trajectory from 1 to t. And you can use this so-called chain rule for KL to decompose. So let me see where I should write it. Maybe just start from here. So there is this fact about KL, which is like, so this is the Chen rule for KL,"}],"uncertainties":["Chen rule for KL"],"diagram":"none","start":3888.06,"end":4059.44,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3888.06,"text":"And our previous kind of fracture, this formula Q is the posterior, right? Yeah, exactly. But this formula works for anything. It's just any distribution. It's just just inequality. So it doesn't matter what's the definition of Q or not. So we are using the formula. It's a generic formula. Whatever P and Q you put in is always correct. No, this is."},{"start":3917.87,"text":"You know, I'm just taking a formula from last time. So I guess you are asking why in the lower bound there is a minus KL divergence. I think, I'm not sure whether it's an intuitive explanation, but it's a sanity check, right? So if you don't have the KL divergence, then I think you can just choose, you have perfect, you can easily have perfect reconstruction. You just let z to be the same as x."},{"start":3948.77,"text":"You don't even kind of like doing any kind of posterior estimate. You just say z is equal to x, then you have perfect reconstruction. It's kind of like you are lacking regularization in some sense. I think actually in the ELBO literature, this is kind of viewed as a regularization term. You cannot make your posterior too"},{"start":3972.55,"text":"too complex, right? Your posterior has to be close to the prior. Otherwise, it's just that you're overfitting to your data in some sense. Does it make some sense? So OK, cool. So that's all. By the way."},{"start":3993.64,"text":"I've never seen people deriving this."},{"start":3996.22,"text":"There's still one or two steps below."},{"start":3998.32,"text":"But this is my simplification of the derivations."},{"start":4002.36,"text":"All the materials I've seen, it's"},{"start":4004.42,"text":"kind of like you just start with the lower bound,"},{"start":4007.74,"text":"and you just do kind of like a one-page derivation,"},{"start":4010.02,"text":"and you get some formula, and that's it."},{"start":4012.2,"text":"So at least I think we are introducing a little structure"},{"start":4015.18,"text":"here, hopefully."},{"start":4016.94,"text":"Like at least it makes the proof shorter."},{"start":4019.42,"text":"So OK, so what's the next step?"},{"start":4021.42,"text":"So the next step is that these are both distributions over the trajectory from 1 to t."},{"start":4030.54,"text":"And you can use this so-called chain rule for KL to decompose."},{"start":4036.0,"text":"So let me see where I should write it. Maybe just start from here."},{"start":4051.42,"text":"So there is this fact about KL, which is like, so this is the Chen rule for KL,"}],"speech_gaps":[],"frame":"../frames/v045/023.webp","frame_time":3900.06},{"title":"KL 链式法则：条件 KL 外必须有期望","segments":[{"id":562,"text":"which is that if you have KL between, like, let me see what's the right way to write this.","zh":"这是指如果你有 KL 散度，比如，让我想想怎么正确地写出这个表达式。","start":4059.62,"end":4069.62},{"id":563,"text":"It's like a, let me think about what's the most abstract way","zh":"它像是一个，让我想想最抽象的方式是什么","start":4069.62,"end":4081.12},{"id":564,"text":"to write this, like a, if you have p, let's say, of x, y,","zh":"来写出这个，比如，如果你有 p，比如说，x 和 y 的分布，","start":4081.12,"end":4092.64},{"id":565,"text":"I'm writing an abstracted statement, right?","zh":"我正在写出一个抽象的陈述，对吧？","start":4095.76,"end":4098.16},{"id":566,"text":"So you have this multivariate random variable, x and y.","zh":"因此，你有一个多元随机变量 x 和 y。","start":4098.16,"end":4105.22},{"id":567,"text":"And you have two distributions.","zh":"你有两个分布。","start":4105.36,"end":4106.12},{"id":568,"text":"And you look at the KL between them.","zh":"然后你观察这两个分布之间的 KL 散度。","start":4107.12,"end":4108.56},{"id":569,"text":"This is equals to KL between p of x given y and q of x given y","zh":"这等于 p 在给定 y 下的 x 与 q 在给定 y 下的 x 之间的 KL 散度","start":4108.92,"end":4117.54},{"id":570,"text":"plus the KL between p of x and q of x.","zh":"加上 p(x) 和 q(x) 之间的 KL 散度。","start":4118.84,"end":4124.36},{"id":571,"text":"Sorry, y.","zh":"抱歉，是 y。","start":4124.54,"end":4125.18},{"id":572,"text":"And similarly, if you have KL between a sequence","zh":"同样地，如果你有一个序列之间的 KL 散度","start":4137.92,"end":4141.08},{"id":573,"text":"like something like this, x1 up to xt, q, x1 up to xt.","zh":"比如像这样的序列，x1 到 xt，q，x1 到 xt。","start":4141.08,"end":4147.48},{"id":574,"text":"And let's say, suppose x1 up to xt is a Markov chain.","zh":"假设 x1 到 xt 是一个马尔可夫链。","start":4148.4,"end":4153.36},{"id":575,"text":"chain, and both p and q.","zh":"链，以及 p 和 q。","start":4153.36,"end":4157.68},{"id":576,"text":"And then you can do this chain rule","zh":"然后你可以使用这个链式法则","start":4158.14,"end":4159.9},{"id":577,"text":"where you can write it as p of x1 given x2, q.","zh":"你可以将其写成 p(x1 给定 x2)，q。","start":4159.9,"end":4168.7},{"id":578,"text":"So you can decompose it sequentially.","zh":"因此，你可以依次分解它。","start":4189.4,"end":4193.58},{"id":579,"text":"And the last term will be just the x.","zh":"而最后一项将只是x。","start":4193.78,"end":4196.36}],"notes":["把联合密度分解为边缘密度与条件密度后，可以将联合 KL 拆成一个边缘 KL，加上条件 KL 在相应边缘分布下的期望。条件 KL 通常随条件变量取值改变，因此不能直接省略外层期望。","下面按先分出 Y、再考虑 X|Y 的顺序书写，边缘项必须对应 Y。若改为先分出 X，则条件项也应相应改成 Y|X。原始自动候选式曾把这两种分解混写，本页已修复。","对更长序列，可以继续重复同一分解。如果还具有马尔可夫结构，可以进一步简化条件，但仍需保留正确的取期望分布。"],"formulas":[{"latex":"D_{\\mathrm{KL}}(P_{XY}\\|Q_{XY})=D_{\\mathrm{KL}}(P_Y\\|Q_Y)+\\mathbb E_{Y\\sim P_Y}\\!\\left[D_{\\mathrm{KL}}(P_{X\\mid Y}\\|Q_{X\\mid Y})\\right]","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版；适用假设及记号修复已在上文说明。","evidence":"which is that if you have KL between, like, let me see what's the right way to write this. It's like a, let me think about what's the most abstract way to write this, like a, if you have p, let's say, of x, y, I'm writing an abstracted statement, right? So you have this multivariate random variable, x and y. And you have two distributions. And you look at the KL between them. This is equals to KL between p of x given y and q of x given y plus the KL between p of x and q of x. Sorry, y. And similarly, if you have KL between a sequence like something like this, x1 up to xt, q, x1 up to xt. And let's say, suppose x1 up to xt is a Markov chain. chain, and both p and q. And then you can do this chain rule where you can write it as p of x1 given x2, q. So you can decompose it sequentially. And the last term will be just the x."},{"latex":"D_{\\mathrm{KL}}(P_{1:T}\\|Q_{1:T})=D_{\\mathrm{KL}}(P_1\\|Q_1)+\\sum_{t=2}^{T}\\mathbb E_{P_{1:t-1}}\\!\\left[D_{\\mathrm{KL}}(P_{t\\mid1:t-1}\\|Q_{t\\mid1:t-1})\\right]","symbols":"符号按本页说明使用；概率分布、均值、协方差和期望的角色需分别理解。","explanation":"本式对课堂略写的数学关系作规范排版；适用假设及记号修复已在上文说明。","evidence":"which is that if you have KL between, like, let me see what's the right way to write this. It's like a, let me think about what's the most abstract way to write this, like a, if you have p, let's say, of x, y, I'm writing an abstracted statement, right? So you have this multivariate random variable, x and y. And you have two distributions. And you look at the KL between them. This is equals to KL between p of x given y and q of x given y plus the KL between p of x and q of x. Sorry, y. And similarly, if you have KL between a sequence like something like this, x1 up to xt, q, x1 up to xt. And let's say, suppose x1 up to xt is a Markov chain. chain, and both p and q. And then you can do this chain rule where you can write it as p of x1 given x2, q. So you can decompose it sequentially. And the last term will be just the x."}],"uncertainties":["p of x1 given x2, q"],"diagram":"none","start":4059.62,"end":4196.36,"asr_flags":[562,563,564,566,577],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":4059.62,"text":"which is that if you have KL between, like, let me see what's the right way to write this."},{"start":4069.62,"text":"It's like a, let me think about what's the most abstract way"},{"start":4081.12,"text":"to write this, like a, if you have p, let's say, of x, y,"},{"start":4095.76,"text":"I'm writing an abstracted statement, right?"},{"start":4098.16,"text":"So you have this multivariate random variable, x and y."},{"start":4105.36,"text":"And you have two distributions."},{"start":4107.12,"text":"And you look at the KL between them."},{"start":4108.92,"text":"This is equals to KL between p of x given y and q of x given y"},{"start":4118.84,"text":"plus the KL between p of x and q of x."},{"start":4124.54,"text":"Sorry, y."},{"start":4137.92,"text":"And similarly, if you have KL between a sequence"},{"start":4141.08,"text":"like something like this, x1 up to xt, q, x1 up to xt."},{"start":4148.4,"text":"And let's say, suppose x1 up to xt is a Markov chain."},{"start":4153.36,"text":"chain, and both p and q."},{"start":4158.14,"text":"And then you can do this chain rule"},{"start":4159.9,"text":"where you can write it as p of x1 given x2, q."},{"start":4189.4,"text":"So you can decompose it sequentially."},{"start":4193.78,"text":"And the last term will be just the x."}],"speech_gaps":[],"frame":"../frames/v045/024.webp","frame_time":4071.62},{"title":"扩散模型中的KL散度分解","segments":[{"id":580,"text":"That's the fact that we're going to use for this chain rule so that we can decompose that formula. And this is a very basic formula for KL distribution. I guess this one, you just verify it by expanding the definition. And this one, you can use this formula to derive this one just recursively. So now, you can see that I'm going to apply this to","zh":"这就是我们要用于这个链式法则的事实，这样我们就可以分解那个公式。这是一个非常基本的KL分布公式。我想这个公式，你只需要通过展开定义来验证。而这个公式，你可以通过递归的方式用它来推导出这个公式。现在，你可以看到我将把这个应用到","start":4204.42,"end":4248.82},{"id":581,"text":"a distribution, this KL. So now the KL between p of x1 to t given x0.","zh":"一个分布，这个KL。现在，p在x1到t给定x0之间的KL散度。","start":4250.84,"end":4264.06},{"id":582,"text":"Sorry, did I have q first? I have q first, yes.","zh":"抱歉，我是不是先提到了q？是的，我先提到了q。","start":4265.84,"end":4268.74},{"id":583,"text":"Q","zh":"Q","start":4268.74,"end":4271.32},{"id":584,"text":"this is","zh":"这个是","start":4277.5,"end":4280.3},{"id":585,"text":"equals to","zh":"等于到","start":4280.3,"end":4281.24},{"id":586,"text":"right, I think","zh":"对，我想","start":4283.22,"end":4287.58},{"id":587,"text":"So this whole thing corresponds to this thing, right?","zh":"所以整个这个对应于这个，对吧？","start":4324.36,"end":4328.28},{"id":588,"text":"So x0, just assume that it's always there.","zh":"所以 x0，假设它一直存在。","start":4328.28,"end":4332.16},{"id":589,"text":"And this p corresponds to this one.","zh":"并且这个 p 对应的是这个。","start":4332.44,"end":4337.12},{"id":590,"text":"So I need to decompose it this way.","zh":"所以我需要这样分解它。","start":4337.62,"end":4339.74},{"id":591,"text":"So that's why each of these KL is only about one step.","zh":"这就是为什么每一个 KL 只涉及一步。","start":4340.12,"end":4343.02},{"id":592,"text":"So before, you have a KL between two joint distributions.","zh":"之前，你有一个两个联合分布之间的 KL 散度。","start":4343.16,"end":4345.12},{"id":593,"text":"And now you have a sum of KL.","zh":"现在你有一个 KL 散度的和。","start":4345.5,"end":4347.7},{"id":594,"text":"And each of these KL is between distributions for one step.","zh":"每一个这样的 KL 散度都是关于一步的分布之间的。","start":4348.3,"end":4355.28},{"id":595,"text":"step.","zh":"步。","start":4355.28,"end":4355.38},{"id":596,"text":"And if you really try to interpret this,","zh":"如果你真的试图去解释这一点，","start":4356.44,"end":4358.02},{"id":597,"text":"you can see that this is kind of like the reconstruction","zh":"你可以看到这有点像重建过程","start":4358.16,"end":4360.56},{"id":598,"text":"because you are trying to make, it's actually","zh":"因为你试图去做，实际上","start":4361.18,"end":4364.44},{"id":599,"text":"kind of interesting, you are trying to make the one step","zh":"有点有趣，你试图让一步的重建","start":4364.44,"end":4367.72},{"id":600,"text":"reconstruction to be the same as the reconstruction of Q,","zh":"与 Q 的重建过程相同，","start":4367.72,"end":4373.92},{"id":601,"text":"but a condition of x0.","zh":"但这是一个关于 x0 的条件。","start":4374.14,"end":4375.4},{"id":602,"text":"So basically, the magic here is that this term is actually","zh":"所以基本上，这里的巧妙之处在于这个项实际上是","start":4376.7,"end":4381.62}],"notes":["本段主要讲解扩散模型中KL散度的分解方法。教授提到，KL散度可以用于分解公式，这是基于链式法则的基本公式。他指出，可以通过递归的方式从一个公式推导出另一个公式。","教授进一步说明，KL散度的分解方法将原本两个联合分布之间的KL散度转换为多个一步分布之间的KL散度之和。这种分解方法使得每一步的KL散度更容易处理。","教授提到，这种分解方法背后的意义在于，每一步的KL散度可以看作是重建过程的一部分。他指出，这种重建过程需要满足一定的条件，即在给定x0的情况下进行。","教授强调，这种分解方法的关键在于，每一步的KL散度实际上对应于一个特定的重建过程。这使得扩散模型能够逐步地从噪声中恢复原始数据。","教授还提到，这种分解方法的数学基础是KL散度的性质，即它可以被分解为多个一步KL散度的和。这种分解方法在扩散模型中具有重要的应用价值。","教授最后指出，这种分解方法的“魔法”在于，它能够将复杂的KL散度问题简化为多个简单的一步问题，从而使得模型的训练和推理更加高效。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4204.42,"end":4381.62,"asr_flags":[581,587,594,595],"boards":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":4204.42,"text":"That's the fact that we're going to use for this chain rule so that we can decompose that formula. And this is a very basic formula for KL distribution. I guess this one, you just verify it by expanding the definition. And this one, you can use this formula to derive this one just recursively. So now, you can see that I'm going to apply this to"},{"start":4250.84,"text":"a distribution, this KL. So now the KL between p of x1 to t given x0."},{"start":4265.84,"text":"Sorry, did I have q first? I have q first, yes."},{"start":4268.74,"text":"Q"},{"start":4277.5,"text":"this is"},{"start":4280.3,"text":"equals to"},{"start":4283.22,"text":"right, I think"},{"start":4324.36,"text":"So this whole thing corresponds to this thing, right?"},{"start":4328.28,"text":"So x0, just assume that it's always there."},{"start":4332.44,"text":"And this p corresponds to this one."},{"start":4337.62,"text":"So I need to decompose it this way."},{"start":4340.12,"text":"So that's why each of these KL is only about one step."},{"start":4343.16,"text":"So before, you have a KL between two joint distributions."},{"start":4345.5,"text":"And now you have a sum of KL."},{"start":4348.3,"text":"And each of these KL is between distributions for one step."},{"start":4355.28,"text":"step."},{"start":4356.44,"text":"And if you really try to interpret this,"},{"start":4358.16,"text":"you can see that this is kind of like the reconstruction"},{"start":4361.18,"text":"because you are trying to make, it's actually"},{"start":4364.44,"text":"kind of interesting, you are trying to make the one step"},{"start":4367.72,"text":"reconstruction to be the same as the reconstruction of Q,"},{"start":4374.14,"text":"but a condition of x0."},{"start":4376.7,"text":"So basically, the magic here is that this term is actually"}],"speech_gaps":[],"frame":"../frames/v045/025.webp","frame_time":4216.42},{"title":"扩散模型中的重建与条件分布","segments":[{"id":603,"text":"easy because given x0, you actually know","zh":"容易，因为给定 x0，你实际上知道","start":4381.62,"end":4385.28},{"id":604,"text":"what is the reconstruction of . Actually, deterministically, you can write out, you can compute a formula. So without x0, it's very hard to reconstruct. But with x0, it's actually easy to reconstruct. So basically, we are saying that it suffices for me to match my reconstruction to the reconstruction when x0 is given.","zh":"什么是重建。实际上，你可以确定性地写出，你可以计算一个公式。所以在没有 x0 的情况下，重建是非常困难的。但有了 x0，重建实际上很容易。所以基本上，我们是在说，只要我的重建与给定 x0 时的重建相匹配就足够了。","start":4385.87,"end":4405.95},{"id":605,"text":"Of course, you also have this term as well. It's not like only KL, but there are other terms. But here, at least, you're only asking the P theta to reconstruct Xt minus 1. You want this distribution to match this distribution. And this Q distribution is conditional X0, which is actually a very easy one, which you can compute very easily. So I think I will try to, let's see whether.","zh":"当然，你还有这个项。它不仅仅是 KL 散度，还有其他项。但在这里，至少你只让 P theta 重建 Xt-1。你希望这个分布与这个分布相匹配。而这个 Q 分布是条件 X0，这实际上是一个非常容易的分布，你可以很容易地计算出来。所以我想我将尝试，让我们看看是否。","start":4407.36,"end":4434.01},{"id":606,"text":"OK, I think three minutes is probably enough to get the rest of it. So let's just be a little more precise. So what is this one? So we know very precisely. So we know almost everything about q if you condition x0 pretty much. So basically, you know q of xt given xt minus 1 and x0.","zh":"好的，我想三分钟可能已经足够理解其余部分了。所以让我们再更精确一点。那么这个是什么？我们知道非常清楚。我们知道几乎关于 q 的一切，如果你条件 x0 的话。基本上，你知道 q 的 xt 给定 xt-1 和 x0。","start":4435.32,"end":4464.32},{"id":607,"text":"And this is enough to get you Q of xt minus 1 and xt and x0. So if you know x0, you know xt minus 1, you know what's the distribution of xt. That's because the forward process is quite simple. So if you know x0, you know xt minus 1. And you can add noise to get xt.","zh":"而这足以得到 Q 的 xt-1 和 xt 和 x0。如果你知道 x0，你知道 xt-1，你知道 xt 的分布。这是因为前向过程相当简单。所以如果你知道 x0，你知道 xt-1，并且可以添加噪声得到 xt。","start":4465.07,"end":4488.9},{"id":608,"text":"And that's why the reconstruction of this is easy because if you know, it's kind of like if you know, for any Gaussian distribution, if you know P of A given B and you know P of A comma B, then it's easy to compute what is P of B given A for Gaussians. It's kind of like you have deterministic formulas for this. So that's kind of the situation. A is this. So everything is conditioned X0 and A is Xt and B is Xt minus 1. So you know everything pretty much.","zh":"这就是为什么这个重建是容易的，因为如果你知道，它有点像如果你知道，对于任何高斯分布，如果你知道 P 的 A 给定 B 和 P 的 A，逗号 B，那么很容易计算 P 的 B 给定 A 对于高斯分布来说是什么。它有点像你有确定性的公式来处理这个问题。所以这就是这种情况。A 是这个。所以一切都是条件 X0，A 是 Xt，B 是 Xt-1。所以你基本上知道一切。","start":4490.63,"end":4518.49},{"id":609,"text":"So I think probably I'm not going to do all the full derivation, but you can compute. So just if you do the calculation, you have Xt given Xt and X0. You can do the Bayesian rule, which is Xt given Xt minus 1 X0 times Q of Xt minus 1 X0.","zh":"所以我想我可能不会做完整的推导，但你可以计算。所以只要你做计算，你有 Xt 给定 Xt 和 X0。你可以应用贝叶斯规则，即 Xt 给定 Xt-1 和 X0 乘以 Q 的 Xt-1 和 X0。","start":4519.55,"end":4543.49}],"notes":["本段讲解了在扩散模型中，当已知x0时，重建过程变得容易，因为可以确定性地计算公式。而当没有x0时，重建过程则非常困难。这说明了在模型设计中，x0的已知对于重建的重要性。","讲者提到，除了KL散度之外，还有其他项需要考虑，但在此处，主要关注的是Pθ重建Xt-1。这表明在模型训练中，需要让分布Pθ与目标分布Q匹配。","讲者指出，Q分布是条件X0的分布，这使得计算变得容易。这说明了在扩散模型中，条件分布的计算是关键，因为X0的已知可以简化问题。","讲者进一步说明，当已知x0时，可以确定q(xt | xt-1, x0)，这使得计算Q(xt-1, xt, x0)成为可能。这表明在扩散模型中，前向过程的简单性是重建容易的原因。","讲者通过高斯分布的例子，说明了在已知P(A|B)和P(A,B)的情况下，可以计算P(B|A)。这表明在扩散模型中，条件概率的计算可以通过确定性公式完成。","最后，讲者提到可以使用贝叶斯规则计算Xt给定Xt-1和X0的分布，这表明在模型推导中，贝叶斯规则的应用是关键步骤。"],"formulas":[],"uncertainties":["P of A comma B"],"diagram":"none","start":4381.62,"end":4543.49,"asr_flags":[],"math_clarifications":["原始公式中的贝叶斯规则未考虑上下文中的条件变量，且未体现x0的条件性。根据上下文，应为条件概率P(Xt|Xt-1, X0)，因此该公式不适用，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4381.62,"text":"easy because given x0, you actually know"},{"start":4385.87,"text":"what is the reconstruction of . Actually, deterministically, you can write out, you can compute a formula. So without x0, it's very hard to reconstruct. But with x0, it's actually easy to reconstruct. So basically, we are saying that it suffices for me to match my reconstruction to the reconstruction when x0 is given."},{"start":4407.36,"text":"Of course, you also have this term as well. It's not like only KL, but there are other terms. But here, at least, you're only asking the P theta to reconstruct Xt minus 1. You want this distribution to match this distribution. And this Q distribution is conditional X0, which is actually a very easy one, which you can compute very easily. So I think I will try to, let's see whether."},{"start":4435.32,"text":"OK, I think three minutes is probably enough to get the rest of it. So let's just be a little more precise. So what is this one? So we know very precisely. So we know almost everything about q if you condition x0 pretty much. So basically, you know q of xt given xt minus 1 and x0."},{"start":4465.07,"text":"And this is enough to get you Q of xt minus 1 and xt and x0. So if you know x0, you know xt minus 1, you know what's the distribution of xt. That's because the forward process is quite simple. So if you know x0, you know xt minus 1. And you can add noise to get xt."},{"start":4490.63,"text":"And that's why the reconstruction of this is easy because if you know, it's kind of like if you know, for any Gaussian distribution, if you know P of A given B and you know P of A comma B, then it's easy to compute what is P of B given A for Gaussians. It's kind of like you have deterministic formulas for this. So that's kind of the situation. A is this. So everything is conditioned X0 and A is Xt and B is Xt minus 1. So you know everything pretty much."},{"start":4519.55,"text":"So I think probably I'm not going to do all the full derivation, but you can compute. So just if you do the calculation, you have Xt given Xt and X0. You can do the Bayesian rule, which is Xt given Xt minus 1 X0 times Q of Xt minus 1 X0."}],"speech_gaps":[],"frame":"../frames/v045/026.webp","frame_time":4393.62},{"title":"扩散模型中的分布关系","segments":[{"id":610,"text":"And Q of xt given x0. And you see, you know everything here, right? What is xt minus 1 given x0? That's known because I have my, oh, did I erase that? So I think, remember, I know.","zh":"并且给定x0的xt的分布。你能看到，你在这里知道所有的东西，对吧？xt减1给定x0是什么？这是已知的，因为我知道我的，哦，我是不是擦掉了？所以我想，记得，我知道。","start":4545.53,"end":4562.17},{"id":611,"text":"Actually, I know xt is equal to square root bar x0 plus 1 minus square root alpha t bar epsilon hat t. So I know the relationship between xt and x0 very well, so that I know the distribution here. And I know the distribution here because actually here is even easier because you don't even have to condition x0. It's a Markov, so you can remove x0. So you know xt given xt minus 1. And you know this one for the same reason, because you know the relationship between xt and x0 exactly.","zh":"实际上，我知道xt等于根号下bar x0加上1减去根号下alpha t bar epsilon hat t。所以我对xt和x0之间的关系非常了解，因此我知道这里的分布。而且我知道这里的分布是因为实际上更简单，你甚至不需要对x0进行条件。它是马尔可夫的，所以你可以去掉x0。因此你知道xt给定xt减1。你也可以用同样的理由知道这个，因为你对xt和x0之间的关系有确切的了解。","start":4562.81,"end":4590.21},{"id":612,"text":"Because it's Markov, right? So given xt minus 1, you don't even need x0.","zh":"因为它是马尔可夫的，对吧？所以给定xt减1，你甚至不需要x0。","start":4593.14,"end":4596.74},{"id":613,"text":"So basically, all of these quantities here are known. And you can just plug in. There are actually, in the lecture notes, we have a slightly faster way to do it. But in principle, you can plug in all the density functions, and you can just get the formula. So basically, eventually, you can compute this. And let's say we scale a lot of steps. Eventually, this is just Gaussian distribution with something like.","zh":"所以基本上，这里的所有量都是已知的。你只需要代入即可。实际上，在讲义中，我们有一个稍微更快的方法。但原则上，你可以代入所有的密度函数，从而得到公式。所以基本上，最终你可以计算出这个。假设我们进行了大量的步骤，最终这只是一个具有某种形式的高斯分布。","start":4598.79,"end":4624.51},{"id":614,"text":"I'm trying to pay attention to time, sorry. So this is Gaussian distribution with a complex formula, square root alpha t bar. I don't think you can verify this. I didn't verify it myself, strictly speaking. So x0 plus square root alpha t, 1 minus alpha t bar.","zh":"我正在注意时间，抱歉。所以这是一个具有复杂公式的高斯分布，根号下alpha t bar。我认为你无法验证这一点。严格来说，我自己也没有验证过。所以x0加上根号下alpha t，1减去alpha t bar。","start":4627.02,"end":4652.06},{"id":615,"text":"So it's a distribution where the mean is a linear combination of x0 and xt. That's the most important thing. The coefficients, I can never remember it. But some linear combination of x0 and xt. And the variance is some function of alpha and beta. And people often just denote this to be mu tilde t.","zh":"这是一个分布，其均值是x0和xt的线性组合。这是最重要的事情。系数，我永远记不住。但是一些x0和xt的线性组合。方差是alpha和beta的某个函数。人们通常只是将其记作mu tilde t。","start":4673.16,"end":4693.98},{"id":616,"text":"Xt, X0. But actually, this is just a definition. Mu tilde Xt, X0 is just a linear combination of them with some specific coefficients. And so that's why this distribution is just literally a Gaussian. And this distribution is literally a Gaussian. And you know the mean and variance of all of them. And so basically, for this term, we are computing the distribution of this Gaussian versus what is the","zh":"Xt，X0。但实际上，这只是定义。Mu tilde Xt，X0只是它们的某种特定系数的线性组合。因此，这个分布就是字面上的高斯分布。这个分布就是字面上的高斯分布。你知道所有这些的均值和方差。因此，基本上，对于这个项，我们是在计算这个高斯分布的分布，与什么相比较？","start":4695.96,"end":4723.45}],"notes":["本段主要讲解扩散模型中不同时间步的随机变量之间的分布关系。讲者提到xt和x0之间的关系，以及如何通过已知的分布关系来推导出xt的分布。由于扩散模型是马尔可夫过程，因此xt的分布可以仅依赖于xt-1，而不需要x0。","讲者指出，均值的线性组合系数是关键，但具体数值可能需要查阅资料。同时，讲者提到，这种分布的均值和方差都是已知的，因此可以计算出对应的高斯分布。","讲者还提到，虽然具体的公式可能需要进一步推导，但整体思路是通过已知的分布关系和马尔可夫性质来计算xt的分布。这为后续的扩散模型推导和实现提供了理论基础。","在讲解过程中，讲者多次提到马尔可夫性质的重要性，即xt的分布仅依赖于xt-1，而不需要x0。这简化了计算过程，并使得分布关系更加清晰。","最后，讲者提到，虽然具体的公式可能需要进一步验证，但整体思路是可行的。这表明在实际应用中，可以通过已知的分布关系和马尔可夫性质来推导出扩散模型中的分布关系。"],"formulas":[],"uncertainties":["square root alpha t bar","x0 plus square root alpha t, 1 minus alpha t bar"],"diagram":"none","start":4545.53,"end":4723.45,"asr_flags":[],"math_clarifications":["原始公式未明确写出方差的具体形式，且未提及协方差矩阵的结构。根据上下文，应使用向量各 function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
