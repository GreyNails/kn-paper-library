is was interesting. So you probably know Lama 4. You have heard of it, right? So one of the problems with Lama's model is that the...","zh":"所以基本上，这个空间是如此复杂，对吧？因此，非常重要的一点是你必须从一个能够给你非零奖励的策略开始。因此，你必须有一个内在机制，能够给你一些正奖励。实际上，这很有趣。你可能知道Lama 4。你听说过它，对吧？所以Lama模型的一个问题是，它们在某种程度上完全没有思考能力。我可能有点苛刻，但它们的思考能力非常有限。它们几乎没有任何思考能力，因此当你在这些模型上使用强化学习时，一开始你会得到零奖励，并且在某种意义上，你一直会得到零奖励。但其他一些模型，比如Quinn或DeepSeq模型，如果你开始，你已经具备一些思考能力，比如非常有限的思考能力。但一旦你有一个成功的轨迹，比如说，像这样。","start":4415.19,"end":4437.55},{"id":462,"text":"they have no thinking capability whatsoever to something. I'm maybe exacting a little bit, but they have very, very limited thinking. They almost have no thinking capability so that when you use RL on them, you have zero rewards at the beginning and you just keep having zero reward in some sense. But some of the other models like Quinn or DeepSeq models, if you start, you already have some thinking capability, like very little thinking capability. But once you have one successful trajectory, let's say it's like this.","zh":"1, 0, 0, 0，然后你用7/8来强化这个轨迹，并惩罚所有其他的轨迹。因此，你会逐渐看到这种行为，并且在某种意义上，你不断进行自举。因此，获得非负奖励或获得一些奖励是非常重要的。人们如何获得奖励，有时你会尝试做一些SFDs来开始。所以你首先","start":4438.55,"end":4466.21},{"id":463,"text":"1, 0, 0, 0, and then you will reinforce this trajectory with 7 over 8, and you penalize all the other trajectories. So then you start to see this behavior gradually, and then you keep bootstrapping in some sense. So getting non-negative reward or getting some reward is very important. And how people get the reward, sometimes you try to do some SFDs to start with. So you first","zh":"1, 0, 0, 0，然后你用7/8来强化这条轨迹，而惩罚所有其他的轨迹。因此你开始逐渐看到这种行为，然后以某种方式持续进行自举。因此获得非负奖励或获得某种奖励是非常重要的。而人们如何获得奖励，有时候你首先会尝试做一些SFDs。所以你首先","start":4466.57,"end":4490.03},{"id":464,"text":"like with disaster, you create some data","zh":"使得这些数据具有某种思考过程。","start":4490.99,"end":4493.27},{"id":465,"text":"so that the data has some kind of thinking process.","zh":"也许你甚至会尝试制作这些数据，","start":4493.27,"end":4495.51},{"id":466,"text":"Maybe even you try to make the data,","zh":"你尝试在数据中注入一些反思，","start":4495.71,"end":4497.45},{"id":467,"text":"you try to inject some reflection in the data,","zh":"比如说，你尝试让数据有一个混乱的长思考过程，并说，","start":4497.53,"end":4500.17},{"id":468,"text":"say you try to have a messy long thinking process and say,","zh":"你尝试让数据有一个混乱的长思考过程，并说，","start":4500.19,"end":4504.41},{"id":469,"text":"oh, I checked my answer before and I reflect a little bit,","zh":"哦，我之前检查过我的答案，并且稍微反思了一下，","start":4504.53,"end":4508.01},{"id":470,"text":"and I correct myself in the thinking process.","zh":"然后我在思考过程中纠正了自己。","start":4508.13,"end":4510.37},{"id":471,"text":"Then you probably get this behavior a little bit,","zh":"然后你可能会得到这种行为，","start":4510.91,"end":4513.23},{"id":472,"text":"and then you can use the RL to bootstrap.","zh":"接着你可以使用强化学习来进行引导。","start":4513.35,"end":4516.11},{"id":473,"text":"I don't know all the other approach in","zh":"我不知道其他在","start":4517.31,"end":4519.09},{"id":474,"text":"you know, in a frontier labs on how to get non-zero reward,","zh":"你知道的，在前沿实验室中如何获得非零奖励的其他方法，","start":4519.09,"end":4521.01},{"id":475,"text":"but it's pretty important to get non-zero reward.","zh":"但获得非零奖励是非常重要的。","start":4521.13,"end":4523.53},{"id":476,"text":"Yeah, or sometimes the preaching data does have something like this, right?","zh":"是的，有时候预设的数据确实包含类似的东西，对吧？","start":4525.03,"end":4527.71},{"id":477,"text":"So, like, some of the preaching data actually has this kind of thinking process,","zh":"所以，一些预训练数据实际上包含这种思考过程，","start":4527.79,"end":4530.95},{"id":478,"text":"you know, very, kind of, like, lengthy way.","zh":"你知道的，非常，有点，像，冗长的方式。","start":4531.03,"end":4533.49},{"id":479,"text":"So, you probably get some of those from there as well.","zh":"所以，你可能也会从那里得到一些。","start":4533.59,"end":4535.83},{"id":480,"text":".","zh":":","start":4537.41,"end":4537.77},{"id":481,"text":"The reward is always assigned in a very pragmatic way, right?","zh":"奖励总是以一种非常务实的方式被分配，对吧？","start":4542.67,"end":4546.17},{"id":482,"text":" rt":4500.19,"text":"say you try to have a messy long thinking process and say,"},{"start":4504.53,"text":"oh, I checked my answer before and I reflect a little bit,"},{"start":4508.13,"text":"and I correct myself in the thinking process."},{"start":4510.91,"text":"Then you probably get this behavior a little bit,"},{"start":4513.35,"text":"and then you can use the RL to bootstrap."},{"start":4517.31,"text":"I don't know all the other approach in"},{"start":4519.09,"text":"you know, in a frontier labs on how to get non-zero reward,"},{"start":4521.13,"text":"but it's pretty important to get non-zero reward."},{"start":4525.03,"text":"Yeah, or sometimes the preaching data does have something like this, right?"},{"start":4527.79,"text":"So, like, some of the preaching data actually has this kind of thinking process,"},{"start":4531.03,"text":"you know, very, kind of, like, lengthy way."},{"start":4533.59,"text":"So, you probably get some of those from there as well."},{"start":4537.41,"text":"."},{"start":4542.67,"text":"The reward is always assigned in a very pragmatic way, right?"},{"start":4546.23,"text":"Like, you have a ground-truth answer and you,"},{"start":4547.85,"text":"you just use a program to match that."},{"start":4550.45,"text":"It's very simple program to match the answer."},{"start":4552.79,"text":"Of course, these days,"},{"start":4554.71,"text":"so for some of these cases you don't have conscious answer,"},{"start":4557.25,"text":"then people are also trying to"},{"start":4559.35,"text":"use a large-language model as the reward function."},{"start":4562.83,"text":"So you can extract the answer and"},{"start":4566.37,"text":"then just directly evaluate the answer,"},{"start":4568.55,"text":"whether the answer is correct or not."},{"start":4571.11,"text":"I think there's always a risk that"},{"start":4573.83,"text":"that the large language models evaluation"},{"start":4576.13,"text":"of the answer is like hackable."},{"start":4580.45,"text":"So basically, they are now checking really the answer is right."},{"start":4583.17,"text":"They are just checking the format,"},{"start":4584.73,"text":"checking the style of the answer,"},{"start":4586.05,"text":"and then if the model that generates"}],"speech_gaps":[{"start":4539.888,"end":4542.27}],"frame":"../frames/v038/027.webp","frame_time":4427.19},{"title":"生成与训练阶段的差异","segments":[{"id":499,"text":"the answer can hack it in some sense.","zh":"答案在某种意义上可以说可以绕过它。","start":4593.63,"end":4596.35},{"id":500,"text":"Exactly how much degree that can be done is still","zh":"究竟可以做到多大的程度仍然是","start":4597.75,"end":4600.83},{"id":501,"text":"you an open question because if you use all the 4B model,","zh":"一个开放性问题，因为如果你使用全部的4B模型，","start":4600.83,"end":4603.83},{"id":502,"text":"then of course you can hack the reward function.","zh":"当然你可以绕过奖励函数。","start":4603.99,"end":4605.81},{"id":503,"text":"But if you use maybe a gigantic model as the reward function,","zh":"但如果使用一个巨大的模型作为奖励函数，","start":4606.13,"end":4610.93},{"id":504,"text":"can you hack it or not?","zh":"你是否还能绕过它呢？","start":4611.41,"end":4612.57},{"id":505,"text":"I think that's still not entirely clear.","zh":"我认为这仍然不是完全明确的。","start":4612.73,"end":4614.51},{"id":506,"text":"Yeah, because it's already a little bit complicated.","zh":"是的，因为这已经有点复杂了。","start":4637.17,"end":4639.37},{"id":507,"text":"I didn't talk too much about it.","zh":"我没有过多地谈论这个问题。","start":4639.47,"end":4640.47},{"id":508,"text":"So you have two phase where you generate the trajectory,","zh":"因此，你有两个阶段来生成轨迹，","start":4640.79,"end":4644.03},{"id":509,"text":"and then you assign a reward,","zh":"然后你分配一个奖励，","start":4644.27,"end":4645.41},{"id":510,"text":"and then you take the gradient descent step.","zh":"然后你进行梯度下降步骤。","start":4645.69,"end":4649.57},{"id":511,"text":"Computer gradient, you take gradient descent.","zh":"计算梯度，你进行梯度下降。","start":4649.73,"end":4651.27},{"id":512,"text":"So basically, there is a generation phase,","zh":"基本上，有一个生成阶段，","start":4651.53,"end":4654.11},{"id":513,"text":"there is a rewarding phase,","zh":"有一个奖励阶段，","start":4654.31,"end":4655.29},{"id":514,"text":"or evaluation phase, and I think it's called reward phase calculation.","zh":"或者评估阶段，我认为它被称为奖励阶段计算。","start":4655.43,"end":4659.59},{"id":515,"text":"calculation and then there's a training phase.","zh":"计算完成后，还有一个训练阶段。","start":4659.59,"end":4661.79},{"id":516,"text":"So, the training,","zh":"因此，训练，","start":4662.25,"end":4664.33},{"id":517,"text":"it depends on the scale and how long your generations are.","zh":"取决于规模以及你的生成长度。","start":4665.19,"end":4667.91},{"id":518,"text":"So, typically generation is slower than the training,","zh":"因此，通常生成的速度比训练慢，","start":4668.15,"end":4670.91},{"id":519,"text":"I think, because for generation you cannot","zh":"我想，因为对于生成，你不能","start":4671.09,"end":4673.13},{"id":520,"text":"Paralyzed you have to generate token by token. So an attorney you can it's kind of like you are just fitting the whole It's a pretty it's preferring when you do training you you already have the trajectory. You are just computing the the forward path So, um, I think typically the generation is slower than the training. Yeah Yeah, and the longer the generation is the slower it is because you have to keep all the KV cache in in a memory Yeah Yeah, I think","zh":"被卡住，你必须逐个生成标记。因此，一个律师你可以说，这有点像你只是在拟合整个，它是一个相当的，当你进行训练时，你已经拥有轨迹。你只是在计算前向路径。所以，嗯，我想通常生成的速度比训练慢。是的，是的，生成越长，速度就越慢，因为你必须在内存中保留所有的KV缓存。是的，是的，我想","start":4674.19,"end":4707.16},{"id":521,"text":"And this is different from pre-training, because in the pre-training, there's no generation phase. All the trajectories are all the data you have are downloaded from pre-process, so on and so forth. So you are only doing the training, but no generation. But here, you have the generation phase. Sounds good? Thanks. Yeah. Thanks for the culture.","zh":"这与预训练不同，因为在预训练中没有生成阶段。所有的轨迹都是你拥有的所有数据，都是从预处理中下载的，如此等等。因此，你只进行训练，而没有生成。但在这里，你有生成阶段。听起来不错？谢谢。是的。谢谢你的文化。","start":4707.58,"end":4727.31}],"notes":["本段讨论了生成阶段和训练阶段的差异，指出生成阶段通常比训练阶段慢，因为生成需要逐个生成token，并且需要维护KV缓存。生成阶段涉及轨迹生成、奖励分配和梯度下降步骤，而训练阶段则依赖于已有的轨迹数据。","生成阶段的长度会影响其速度，较长的生成需要更多的内存和计算资源。相比之下，预训练阶段没有生成阶段，所有数据都是预处理后的结果，仅进行训练。","生成阶段和训练阶段的分离是强化学习中的一个关键概念，生成阶段负责生成轨迹，训练阶段则基于这些轨迹进行优化。","生成阶段的复杂性在于需要逐个生成token，这与训练阶段直接使用已有的轨迹数据不同，因此生成阶段通常更慢。","生成阶段的KV缓存管理是影响性能的重要因素，较长的生成需要更多的内存，这可能导致计算资源的瓶颈。","预训练和生成阶段的区别在于，预训练阶段没有生成过程，而生成阶段是强化学习中不可或缺的一部分，用于生成轨迹并进行奖励评估。"],"formulas":[],"uncertainties":["Paralyzed you have to generate token by token. So an attorney you can it's kind of like you are just fitting the whole It's a pretty it's preferring when you do training you you already have the trajectory. You are just computing the the forward path"],"diagram":"none","start":4593.63,"end":4727.31,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":4593.63,"text":"the answer can hack it in some sense."},{"start":4597.75,"text":"Exactly how much degree that can be done is still"},{"start":4600.83,"text":"you an open question because if you use all the 4B model,"},{"start":4603.99,"text":"then of course you can hack the reward function."},{"start":4606.13,"text":"But if you use maybe a gigantic model as the reward function,"},{"start":4611.41,"text":"can you hack it or not?"},{"start":4612.73,"text":"I think that's still not entirely clear."},{"start":4637.17,"text":"Yeah, because it's already a little bit complicated."},{"start":4639.47,"text":"I didn't talk too much about it."},{"start":4640.79,"text":"So you have two phase where you generate the trajectory,"},{"start":4644.27,"text":"and then you assign a reward,"},{"start":4645.69,"text":"and then you take the gradient descent step."},{"start":4649.73,"text":"Computer gradient, you take gradient descent."},{"start":4651.53,"text":"So basically, there is a generation phase,"},{"start":4654.31,"text":"there is a rewarding phase,"},{"start":4655.43,"text":"or evaluation phase, and I think it's called reward phase calculation."},{"start":4659.
