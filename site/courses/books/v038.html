mple, what if you want to update two types?"}],"notes":["本段讨论了策略梯度方法的基本思想，即通过估计梯度来更新策略参数。讲者提到，损失函数的轨迹来源于参数θ，可能涉及时间序列的表示如γ^t, r, s, t, a, t。在计算梯度时，需要估计梯度并进行参数更新，更新公式为θ加上学习率α乘以梯度。"],"formulas":[],"uncertainties":["gamma to the power t, r, s, t, a, t","estimate at the knob law","nabla eta theta","theta is updated to be like theta","estimate at the knob law"],"diagram":"none","start":1547.63,"end":1712.81,"asr_flags":[],"raw_segments":[{"start":1547.63,"text":"I think the idea here is the following. So, okay, so maybe let's start from here. So we call that, you know, this loss function is something like this, right? So it is like this trajectory come from theta, let's say, gamma to the power t, r, s, t, a, t. So if you take gradient,"},{"start":1595.95,"text":"So the, oh, maybe one thing I should, okay, sorry. Maybe before talking about PPO, let's try to summarize the algorithm here. So the algorithm is that every policy green algorithm has this structure, right? So you first sample the trajectories from the policy. Maybe you sample many of them. So one trajectory or maybe many trajectories. Let me be a little bit, so let's say many trajectories from the policy pi theta."},{"start":1632.95,"text":"And then you estimate nabla eta theta. You estimate the gradient with respect to theta. And then you do the parameter update. The parameter update. You say theta is update to be like theta. Here you plus some learning rate alpha times the nabla of eta theta. Something like this."},{"start":1660.33,"text":"So, and when you say estimate, when you say estimate at the knob law, I mean I'm using this estimator to estimate. And what that mean is means that I'm replacing the expectation by the empirical sample mean, right? So, you have many, many trajectories like this. You know, you take probably 128 trajectories and you take the empirical mean as opposed to the full expectation. And the issue with this kind of algorithm is that it's so-called on policy in a sense that"},{"start":1688.63,"text":"Every time you update your parameter, you are, so this kind of algorithm is called on policy because when you are updating the parameter, the parameter is the most recent parameter that you use to sample the trajectory. So you are sampling from theta, right, from theta, and then you take the gradient at theta and then you update theta. So, for example, what if you want to update two types?"}],"speech_gaps":[],"frame":"../frames/v038/010.webp","frame_time":1559.63},{"title":"策略梯度与重要性采样","segments":[{"id":220,"text":"Suppose you want to say, I'm going to take two gradient descent steps. I take one step and take another step. It's not allowed, strictly speaking. Because the second step, if you want to take another step, you have to resample to estimate your nabla theta again. So because this estimator requires that, this trajectory to sample from the policy p theta."},{"id":221,"text":"you have to sample from the current theta to estimate the gradient at theta. You cannot take another sum trajectory from a different distribution. So that's the main challenge. So it has to be on policy, because this estimator requires your sampling from the current theta you are at."},{"id":222,"text":"So that means you cannot reuse the samples. If you take one trajectories, you only use it once for gradient descent, and then the sample is of no use anymore at all. And PPO is trying to deal with this sampling issue by an important sampling. So basically, it's trying to reuse some of the"},{"id":223,"text":"the trajectories you sampled from an old policy, and still to estimate the gradient at the current policy, or still estimate the gradient all the reward function at the current policy. So basically, I want to replace this by, for example, something like this, a pi old, so that I can use the old policy, the trajectory from the old policy to sample. But if you just do this, then it doesn't make sense, right? Because if you just do this, then you are"},{"id":224,"text":"not actually estimating the eta. Theta, you are estimating exactly eta theta old. So that doesn't make sense. So you have to somehow correct for the differences between these two. And the best way to correct, the simplest way to correct is the following. You say, I'm going to do some important sampling. So I sample here from pi old, and then I add some important sampling here."},{"id":225,"text":"I had some important sampling term here to correct for the distribution differences. So here, the subtlety comes from that. How do you correct for this? Because technically, this is a trajectory. The difference is the whole trajectory's probability is different. So the first thing that PPO does is that, OK, let's try to at least correct for the"},{"id":226,"text":"the action part. But at least that's something we can do. So basically, the idea is that you say, let's first decompose this into two parts. One part is that the state is sampling from pi theta. And then the action is sampling from pi theta given the state. So you first have to decompose these two things."}],"notes":["本段讲解了策略梯度方法中采样与梯度估计的关系。在策略梯度中，每次梯度估计都需要基于当前策略进行采样，因此不能重复使用旧策略的轨迹。这导致了采样效率的问题，因为每个轨迹只能使用一次。PPO（Proximal Policy Optimization）通过重要性采样来解决这个问题，尝试重用旧策略的轨迹来估计当前策略的梯度。","重要性采样允许使用旧策略的轨迹来估计当前策略的梯度，但需要对分布差异进行校正。直接使用旧策略的轨迹会导致估计的梯度与当前策略无关，因此必须引入重要性采样项来修正分布差异。","PPO的策略是将轨迹分解为状态和动作两部分。状态的采样来自当前策略，而动作的采样则来自当前策略给定状态的分布。这种分解有助于更精确地估计梯度，同时减少对旧轨迹的依赖。","重要性采样项的引入是关键，它允许在估计梯度时考虑轨迹概率分布的差异。通过这种方式，PPO能够在不完全依赖新采样的情况下，提高策略优化的效率。","在实际应用中，重要性采样项的计算需要考虑轨迹的概率分布差异，这通常涉及对数似然比的计算。这种计算方式使得PPO能够在保持策略更新稳定性的同时，提高采样效率。","PPO通过分解轨迹并引入重要性采样项，解决了策略梯度方法中采样效率低的问题。这种方法在强化学习中被广泛应用，因为它能够在保持策略更新稳定性的同时，提高训练效率。"],"formulas":[],"uncertainties":["eta. Theta"],"diagram":"none","start":1713.39,"end":1874.91,"asr_flags":[],"math_clarifications":["原始文本未提及任何具体的数学公式，因此所有公式均无法核定，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1713.39,"text":"Suppose you want to say, I'm going to take two gradient descent steps. I take one step and ta u keep the state part in some sense."},{"id":231,"text":"And then you re-correct for the action part locally. So basically, this whole thing is sampling from pi theta, but locally, you correct for the action. And then you can say, let's, OK, so now,"},{"id":232,"text":"The problem is that, you know, you didn't crack for this part, right? But you just try to say, oh, I don't care. Like, I cannot, you know, there's no way I know how to crack for this part. I just use the pi theta old in practice. And then I try to kind of like just use, in some sense, use pi theta old for this, which is a big approximation. And this part you try to correct. That's kind of like the main idea. The fraction there, the pi theta old."}],"notes":["本段讲解了重要性采样（important sampling）在策略修正中的应用。讲者提到，即使不知道如何处理某些部分，也可以通过重要性采样进行估计。重要性采样通过将新策略下的动作（AT）与旧策略下的动作（AT）进行比较，来修正差异。讲者还提到，这种修正仅针对动作分布，而不修正状态分布。","讲者进一步解释了重要性采样的具体实现方式，即通过计算新旧策略下动作分布的比值，并乘以奖励（R ST AT）来修正。这种做法意味着，所有动作都是从新策略（pi theta）中采样，而状态则是作为结果被保留。","讲者指出，重要性采样通常以某种方式书写，有时人们会直接说状态（s）来自策略（pi）。更正式的写法是将状态分布和策略（pi theta）分开。但其核心含义是，整个轨迹是从新策略（pi theta）中采样，动作从新策略中采样，而状态部分则被保留。","讲者提到，重要性采样在局部对动作部分进行修正。这意味着，虽然整体上是从新策略（pi theta）中采样，但在局部上，对动作进行修正。这种修正方式是策略修正的核心思想。","讲者指出，问题在于，对于某些部分，无法进行修正。因此，讲者提到，可以使用旧策略（pi theta old）进行近似，这在实践中是一种较大的近似。这种近似是策略修正的主要思想。","讲者最后提到，修正部分的比值（fraction）是旧策略（pi theta old）的一部分，这表明在策略修正中，旧策略的使用是关键。"],"formulas":[],"uncertainties":["crack for this part","pi theta old"],"diagram":"none","start":1877.42,"end":2049.07,"asr_flags":[],"raw_segments":[{"start":1877.42,"text":"And then you say, at least I can do important sampling for this part, even though I don't know how to deal with it for this part. So I just say, you estimate this. I think this is actually equality. So you say, if ST comes from the new policy, and then I do important sampling where I change the AT to sample from the old."},{"start":1903.18,"text":"And then I take an important sampling to correct for the differences. You say you add pi theta AT given ST divided by pi the is term, if you think about the expectation, there is a probability of the pi-0, which will cancel with this. That's how you do the importance sampling."},{"id":234,"text":"Yeah, so it's kind of fundamental what he's doing is the following. Suppose you have x from p theta, and then there's a function of fx, I say, something like this. And how do you do important sampling? You say, this is expectation p theta x fx dx. Sorry, this is the integration of this. And then you say, I'm going to introduce a q."},{"id":235,"text":"And then I have p theta x divided by q theta x dx. And then you put this part in expectation. You say expectation x come from q theta x, q theta. And I'm left with the ratio between q and p. And right. So I'm, oh, I missed the fx somewhere. So fx dx, and it's fx."},{"id":236,"text":"and this is very analogous to this. So this is p, this is q, and this is q. So okay, good. I think maybe in the interest of time, I'm going to hand wave a little bit. You also can take gradients of this. So if you take gradients, you can actually, how do I hand wave a little bit?"},{"id":237,"text":"So I think what people often do is that people often subtract the baseline here so that you have an advantage function. So I guess with some kind of hand-wavy thing, you can also subtract the baselines to replace the reward by some advantage function."}],"notes":["本段讲解了重要性采样（importance sampling）的基本思想，即通过引入一个提议分布 q 来估计目标分布 p 的期望值。在计算过程中，需要考虑概率密度比值 p(x)/q(x)，并将其用于加权平均。讲者提到，在自然语言处理中，gamma 通常为 1，因此容易被忽略。","讲者进一步解释了重要性采样的数学形式，即期望值的计算为 ∫ p(x) f(x) dx，而通过引入 q(x) 可以将其转换为 ∫ q(x) [p(x)/q(x)] f(x) dx。这表明重要性采样通过重新加权样本，使得估计更加高效。","在计算过程中，讲者提到可能会遗漏 f(x) 的部分，这表明在实际操作中需要注意函数 f(x) 的正确引入。同时，讲者指出，重要性采样中的期望值计算依赖于 q(x) 和 p(x) 的比值，这与重要性采样的核心思想一致。","讲者提到在实际应用中，人们常常通过减去基线（baseline）来构造优势函数（advantage function），从而减少方差。这种做法类似于在强化学习中使用基线校正（baseline correction）来优化策略。","讲者最后提到，通过一些简化的处理（hand-wavy），可以将基线校正应用于奖励函数，从而得到优势函数。这表明在实际应用中，基线校正是一种常见的优化手段，有助于提高估计的稳定性。","整个段落围绕重要性采样和基线校正展开，强调了在估计期望值时如何通过引入提议分布 q 来提高效率，并通过基线校正减少方差。这些方法在强化学习和统计推断中具有广泛应用。"],"formulas":[{"latex":"E_{q(x)}[f(x)] = E_{q(x)}[f(x) - b(x) + b(x)] = E_{q(x)}[f(x) - b(x)] + E_{q(x)}[b(x)] \\text{（基线校正）}","symbols":"b(x) 是基线函数，用于减少方差，E_{q(x)}[f(x) - b(x)] 是优势函数","explanation":"公式正确，基线校正的数学表达式无误，适用于重要性采样中的方差减少技术。","evidence":"So I think what people often do is that people often subtract the baseline here so that you have an advantage function. So I guess with some kind of hand-wavy thing, you can also subtract the baselines to replace the reward by some advantage function."}],"uncertainties":["在讲者提到 'gamma is 1' 时，未明确说明 gamma 的具体定义，可能涉及上下文中的其他术语或公式，需进一步确认。","在讲者提到 'hand wave a little bit' 时，未明确说明具体的操作步骤，可能涉及简化或假设，需结合上下文进一步确认。","在讲者提到 'advantage function' 时，未明确其数学定义，可能涉及强化学习中的具体实现，需结合上下文进一步确认。"],"diagram":"none","start":2052.77,"end":2210.0,"asr_flags":[],"math_clarifications":["原始公式中的分母 q(x) 应该是样本权重，而不是整个分布。公式应为重要性采样估计的加权平均形式，而不是直接除以 q(x)。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2052.77,"text":"Oh, no, no, no. It's not all. Sorry. There's still a gamma term. I guess just in natural language cases, the gamma is 1. So that's why I always forget about it. So this will cancel for this, right? So this term, if you think about the expectation, there is a probability of the pi-0, which will cancel with this. That's how you do the importance sampling."},{"start":2082.52,"text":"Yeah, so it's kind of fundamental what he's doing is the following. Suppose you have x from p theta, and then there's a function of fx, I say, something like this. And how do you do important sampling? You say, this is expectation p theta x fx dx. Sorry, this is the integration of this. And then you say, I'm going to introduce a q."},{"start":2105.36,"text":"And then I have p theta x divided by q theta x dx. And then you put this part in expectation. You say expectation x come from q theta x, q theta. And I'm left with the ratio between q and p. And right. So I'm, oh, I missed the fx somewhere. So fx dx, and it's ween these two, then these two quantities are the same, actually. You are only, yes, yes. Or maybe not all doing, yeah. So basically, maybe not exactly, because there is some buffer here. It's not like a, it has to be."}],"notes":["本段讲解了梯度消失问题在剪枝操作中的表现。当RT（可能代表某种比例或阈值）较大时，梯度消失问题会更加明显，因为此时的计算部分是常数，不会对参数θ产生梯度影响。剪枝操作会将某些部分从梯度计算中排除，从而避免梯度消失。","当RT小于1+epsilon_high时，梯度计算会进入另一个分支，此时梯度计算是正常的，即RT乘以A_hat。这种情况下，梯度计算会鼓励模型参数向更高的方向调整。","在负侧的情况与正侧类似，但方向相反。通过案例分析可以发现，负侧的处理方式与正侧相同，只是方向相反。因此，最终的公式可以看作是四个情况的组合。","当RT处于两个阈值之间时，两个量的值会相等。这种情况下，梯度计算可能不会完全生效，因为存在一定的缓冲区，而不是严格的阈值条件。","通过具体数值的举例，如RT=0.5，可以更直观地理解梯度消失问题的处理方式。当RT较小时，梯度计算会更接近1-epsilon，从而避免梯度消失。","整个分析强调了梯度消失问题在剪枝操作中的重要性，以及如何通过不同的分支处理来避免梯度消失，从而提高模型的训练效果。"],"formulas":[],"uncertainties":["RT的具体含义未明确，可能是某种比例或阈值，但未在原文中给出定义。","epsilon_high和epsilon的定义未明确，可能代表某种缓冲区或阈值，但未在原文中给出定义。","A_hat的具体含义未明确，可能是某种归一化或调整后的值，但未在原文中给出定义。","梯度消失的具体数学表达式未明确，但通过上下文可以推测其与剪枝操作有关。"],"diagram":"none","start":2723.76,"end":2894.97,"asr_flags":[],"raw_segments":[{"start":2723.76,"text":"this part is big because rt is big. Let's say rt is 10. This is 10 times a hat. And this is only 1 plus epsilon high times a hat. So basically, then the value will be from this part. So it's 1 plus epsilon high times a hat. And because this is a constant, there's no gradient. Because this part has no, this clipping thing doesn't have any gradient. If you clip, it's not a variable of the theta. So there's no gradient."},{"start":2757.49,"text":"And if RT is less than 1 plus epsilon high, then you are in this branch. So this branching will become RT times A hat. So that's why it's just a normal gradient. You are applying this gradient. I guess you also need to apply A hat. So you're applying a normal gradient to try to encourage this to be higher."},{"start":2778.33,"text":"And the same thing for the negative side. If you do the case study, it actually reverse the opposite. So in the negative side, I guess if you check it, it's doing the same thing here. So that's why the clean fo  to set them at different values, and actually the magic number is 0.2, 0.28, or something like that. And some people claim that you should do the absolute height can be a little higher. And I think one of the reasons is that I don't really expect you to understand this. I don't understand fundamentally, but you can argue that on this side, it's probably less of an issue if you don't clip so aggressively."},{"id":293,"text":"As you mentioned, if you clip, you are slowing down your learning. You are just making your update smaller because you are already doing OK. And it's probably not a big deal if you're less demanding in this restriction. You say, even I'm 2x bit better than the original policy, the old policy, I'm still learning. That's probably fine. So that's why people are more willing to change the absolute high."},{"id":294,"text":"On the other side, it's a little bit more about diversity because in some sense, if you are already, so in this case, this row, this is the row that is."},{"id":295,"text":"on the other side. So this is saying that I'm already doing better than the original policy, but this is a bad example, bad action, so I want to minimize the chance. But sometimes minimize the chance too much has unexpected consequences. You lose the diversity. You just penalize this action too much, and somehow it becomes too deterministic, and you converge the local minimum. So in some sense,"}],"notes":["本段讨论了策略更新的动机，即如果新策略已经表现良好，则不需要更新，以避免远离原始策略。这种做法有助于保持在近似区域，从而保证近似效果。","讲者提到，如果新策略表现不佳，那么更新是有必要的，但更新幅度应控制，以防止过度调整。这种机制有助于在学习过程中减缓更新速度，避免过拟合。","讲者提到一些研究尝试设置不同的学习率值，其中有一个“魔法数字”是0.2或0.28。一些人认为可以将绝对高度设得更高，但讲者表示自己并不完全理解其原理。","讲者指出，如果进行裁剪（clipping），会减缓学习速度，因为更新幅度变小。但若对限制要求不高，这种影响可能并不严重。","讲者进一步提到，如果策略已经比原始策略好，但某些动作表现不佳，那么需要减少对这些动作的惩罚，以保持策略的多样性。过度惩罚可能导致策略过于确定性，从而陷入局部最优。","讲者强调，策略更新需要在保持性能和多样性之间取得平衡，避免因过度惩罚某些动作而导致策略收敛到局部最优。"],"formulas":[],"uncertainties":["magic number is 0.2, 0.28, or something like that"],"diagram":"none","start":2895.58,"end":3052.4,"asr_flags":[] :"They just keep thinking."},{"id":378,"text":"Actually, I think the Quinn and the DeepSeq models"},{"id":379,"text":"just don't even have this special segmentation."},{"id":380,"text":"You just generate the thinking right away,"},{"id":381,"text":"and then you generate the answer."},{"id":382,"text":"How this was discovered,"},{"id":383,"text":"why this was useful at the first place."},{"id":384,"text":"It was first discovered in this context of solving some of"},{"id":385,"text":"the math questions or some of the questions that require steps."},{"id":386,"text":"For example, the question could be like a math question,"},{"id":387,"text":"and then you have to do a few steps and then get the answer."},{"id":388,"text":"You cannot just direct it. No human can actually get"},{"id":389,"text":"the answer right away because it does require some steps."},{"id":390,"text":"So then this Z1 up to Zn is"},{"id":391,"text":"actually laying all those calculations,"},{"id":392,"text":"step-by-step calculation."},{"id":393,"text":"Actually, the first paper,"},{"id":394,"text":"paper what people do is that people are using"},{"id":395,"text":"few-shot learning to encourage this behaviors."},{"id":396,"text":"So basically, I think we discussed few-shot learning,"},{"id":397,"text":"which is like you give the models"},{"id":398,"text":"a few examples on how to solve the problem,"},{"id":399,"text":"and then you let them all those to follow the example."},{"id":400,"text":"So in the examples, you give a few of"},{"id":401,"text":"this kind of like handcrafted few-shot examples."},{"id":402,"text":"post you"},{"id":403,"text":"I want to solve this question, but before I can solve the question, I first give you three similar questions and tell you how to solve step-by-step, and give you the thinking process, and then give you the answer. I have three such examples which all look like this, and you concatenate them all in the prompt, and then you say, now solve the question, my new question following the same process. So that's called future COT."}],"notes":["本段讨论了链式思维（Chain of Thought）的概念，即在回答问题前让模型进行思考，生成中间推理步骤，再生成最终答案。这种机制在解决需要多步骤的问题时特别有用，例如数学问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3405.18,"end":3563.39,"asr_flags":[402],"raw_segments":[{"start":3405.18,"text":"And it's actually very simple. So in all of our prior discussions, we have some prompt, x1 up to xt, let's say, maybe l. So this is our question, let's say. Let's say, suppose the question is, what is 1 plus 1? And then you ask the model to generate y1 up to yk. And this is the answer. So basically, you ask the question, the model will generate the answer right away."},{"start":3431.33,"text":"And then people realize that actually letting the models"},{"start":3434.35,"text":"to generate answer right away"},{"start":3436.15,"text":"is not necessarily the best thing."},{"start":3437.91,"text":"You probably should let the model to think for a little bit"},{"start":3440.05,"text":"and then generate the answer."},{"start":3441.57,"text":"So, the chain of thought is like this."},{"start":3444.17,"text":"You send some kind of like prompt, some question,"},{"start":3446.07,"text":"and then you let the,"},{"start":3447.61,"text":"the rest of the things is all generated by models,"},{"start":3450.01,"text":"but this model will generate some thinking tokens, right?"},{"start":3454.43,"text":"And then generate the answer."},{"start":3457.41,"text":"And often the thinking token start with some special"},{"start":3460.73,"text":"special thing called this special token like this."},{"start":3464.53,"text":"Then, you end it with a special token like this."},{"start":3469.17,"text":"It's not always the case."},{"start":3470.39,"text":"Sometimes, the models don't even generate these tokens."},{"start":3472.95,"text":"They just keep thinking."},{"start":3474.07,"text":"Actually, I think the Quinn and the DeepSeq models"},{"start":3476.49,"text":"just don't even have this special segmentation."},{"start":3479.33,"text":"You just generate the thinking right away,"},{"start":3480.81,"text":"and then you generate the answer."},{"start":3485.41,"text":"How this was discovered,"},{"start":3486.89,"text":"why this was useful at the first place."},{"start":3488.35,"text":"It was first discovered in this context of solving some of"},{"start":3491.93,"text":"the math questions or some of the questions that require steps."},{"start":3494.51,"text":"For example, the question could be like a math question,"},{"start":3499.25,"text":"and then you have to do a few steps and then get the answer."},{"start":3502.85,"text":"You cannot just direct it. No human can actually get"},{"start":3505.01,"text":"the answer right away because it does require some steps."},{"start":3507.73,"text":"So then this Z1 up to Zn is"},{"start":3510.57,"text":"actually laying all those calculations,"},{"start":3512.55,"text":"step-by-step calculation."},{"start":3514.89,"text":"Actually, the first paper,"},{"start":3516.35,"text":"paper what people do is that people are using"},{"start":3518.59,"text":"few-shot learning to encourage this behaviors."},{"start":3521.53,"text":"So basically, I think we discussed few-shot learning,"},{"start":3524.97,"text":"which is like you give the models"},{"start":3526.91,"text":"a few examples on how to solve the problem,"},{"start":3528.87,"text":"and then you let them all those to follow the example."},{"start":3532.07,"text":"So in the examples, you give a few of"},{"start":3534.09,"text":"this kind of like handcrafted few-shot examples."},{"start":3537.29,"text":"post you"},{"start":3539.47,"text":"I want to solve this question, but before I can solve the question, I first give you three similar questions and tell you how to solve step-by-step, and give you the thinking process, and then give you the answer. I have three such examples which all look like this, and you concatenate them all in the prompt, and then you say, now solve the question, my new question following the same process. So that's called future COT."}],"speech_gaps":[{"start":3482.512,"end":3485.01}],"frame":"../frames/v038/021.webp","frame_time":3417.18},{"title":"零样本链式推理（Zero-shot COT）与模型训练方法","segments":[{"id":404,"text":"So I think that's initially how it's discovered. And then later on, so this few-shot COT. And then later on, people also found out this zero-shot COT. And what a zero-shot COT means is it's actually much simpler. It just means that in the prompt, you don't give all the examples. You just have a question, you know, X1 up to X. You have a question. And then you add in your prompt, please."},{"id":405,"text":"think step, maybe there's no please, please think step by step. Or let's think step by step. And this is part of your prompt. And then you let the model generate the answer. And because you add this, then the model will naturally start to think step by step and then give you an answer. And just basically these few magical words will make your accuracy improved by like five, 10%, or maybe even sometimes 20%, even more."},{"id":406,"text":"So that's the so-called zero-shot COT. And then later, people figure out that, oh, if this is so useful, why don't I try to reinforce, why don't I try to train the model to have stronger capability like this? Why don't I do something like training so that this kind of capability is more prominent? So then that comes to how do you train the models to have these kind of behaviors?"},{"id":407,"text":"You can try to have a lot of, I think the first set of idea was that you try to do some instruction tuning. Basically, you create a dataset with this kind of behaviors, and then you manually create a dataset with this single step-by-step thinking, and then you train the models with the supervised fine tuning."},{"id":408,"text":"But that's limited because in some sense, you don't really know what's the best way to think step-by-step. The human thinking, actually, if you look at the step-by-step thinking tokens of any of these open source models, because the closed source models, you don't even see the thinking tokens. You only see some summary of how you're thinking. If you look at the open source models, you look at the thinking tokens, it's actually"},{"id":409,"text":"not very logical. There's a lot of back and forth. Sometimes it's using very succinct shorthand, and sometimes it's skeptical about the question. It's not a very clear and clear"},{"id":410,"text":"shortest thinking path. It's actually a pretty lengthy back and forth, which is probably similar to how people solve questions. You try different ideas, you reflect on what you have done, all of this. So that's why if you try to handcraft the thinking process, sometimes you don't even know how to generate those messy thinking process. Actually, there was a study on this. People try to generate very, very"}],"notes":["本段首先介绍了零样本链式推理（zero-shot COT）的概念，即在提示中不提供示例，仅给出问题，让模型自行思考并生成答案。这种技术可以显著提升模型的准确性，有时甚至提高20%以上。","接着，讲者讨论了如何训练模型以增强这种能力，提出了指令调优（instruction tuning）的方法，即创建包含逐步推理行为的数据集，并通过监督微调训练模型。","然而，这种方法存在局限性，因为人类的思考过程并不总是逻辑清晰，且模型生成的思考过程可能包含大量来回讨论和简略表达，难以人工构建。","讲者指出，由于模型的思考过程复杂且不明确，手动构建这些过程是困难的，因此需要研究如何生成这些复杂的思考路径。","最后，讲者提到有相关研究尝试生成非常复杂的思考过程，但具体细节未展开。"],"formulas":[],"uncertainties":["unclear if 'five, 10%' refers to 5% or 10% improvement","unclear if 'very, very' is part of a phrase or a misrecognized word"],"diagram":"none","start":3564.59,"end":3732.38,"asr_flags":[],"raw_segments":[{"start":3564.59,"text":"So I think that's initially how it's discovered. And then later on, so this few-shot COT. And then later on, people also found out this zero-shot COT. And what a zero-shot COT means is it's actually much simpler. It just means that in the prompt, you don't give all the examples. You just have a question, you know, X1 up to X. You have a question. And then you add in your prompt, please."},{"start":3594.79,"text":"think step, maybe there's no please, please think step by step. Or l  trajectory, y1 up to, say, yn. And we give this as a reward. And the reward is really literally just whether the answer part, let's say this part is the answer. So whether answer match."},{"start":4017.5,"text":"the ground truth answer. So it requires that for this data set, you do know what the ground truth answer is. So for example, it's a mathematical calculation problem, then you know what is the resulting calculation, the final result. And you can see whether the result you get matches the result that the ground truth result is. So that is a reward. And the reward is often binary."},{"start":4047.55,"text":"I guess I'm running low in time a little bit. So the reward is often just the one if matching and zero otherwise. Of course, in reality, there's a lot of variance. For example, you also have to consider whether the formatting is right. For example, whether you can extract the answer from this quickly. You cannot use another AI model to extract the answer."}],"speech_gaps":[],"frame":"../frames/v038/024.webp","frame_time":3909.66},{"title":"模型生成与格式化","segments":[{"id":423,"text":"extract answer in a very pragmatic way."},{"id":424,"text":"So actually, in reality,"},{"id":425,"text":"what happens is that you try to ask a model to"},{"id":426,"text":"generate the answer enclosed by a tag."},{"id":427,"text":"So you say, bracket answer and the answer,"},{"id":428,"text":"and then with this XML tags like this sink."},{"id":429,"text":"So you say, this thing has to be within"},{"id":430,"text":"answer and then answer something like this."},{"id":431,"text":"And then you use a parser to extract what was inside,"},{"id":432,"text":"and you match this with the ground truth answer,"},{"id":433,"text":"and if it's matched,"},{"id":434,"text":"then you have one, otherwise you have zero."},{"id":435,"text":"But of course, these days,"},{"id":436,"text":"I think the models are better and better,"},{"id":437,"text":"so you can ask the model to generate"},{"id":438,"text":
