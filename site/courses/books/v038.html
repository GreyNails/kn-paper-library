heta pi theta A TST.","zh":"应用这个替代损失的梯度。也许这被称为JPPO。因此，你以θ为变量应用JPPO。或者也许从某种意义上说，对于这个特定的动作，你基本上应用的是关于θ的梯度∇θ πθ A TST。","start":2524.17,"end":2545.92}],"notes":["本段讲解了PPO算法中策略更新的两种情况：当RT（奖励比值）大于某个阈值时，不需要进一步强化；当RT小于该阈值时，需要通过梯度提升策略。这体现了PPO算法在策略更新时的保守性，避免因过度更新导致策略不稳定。"],"formulas":[],"uncertainties":["eight then you say I don't I don't care anymore because I'm already in the right","the the instability to or some kind of","instability to to keep updating it and and when so in PPO so there is also a","um let's say small let's say this is","is smaller than one, okay, there are actually many cases,"],"diagram":"none","start":2368.69,"end":2545.92,"asr_flags":[],"translation_complete":true,"translated_segments":36,"raw_segments":[{"start":2368.69,"text":"So what does that mean? That means that A hat, the advantage is good, means that this action is actually a good action. So we know the reward compared to the baseline is positive. So the action is a good action. And it's a good action, and also under the current policy, it has higher probability than the old policy. So in some sense, that's already a good case. So you wanted to have a good action, and your current policy is already doing better than the old policy for this good action. It's generating a good action with higher probability."},{"start":2398.83,"text":"So in some sense, this is kind of like a great case. And the question is whether you need to reinforce it. Should you still try to take the gradient here to reinforce to make the problem higher? And PPO's position is that for this case, we don't need to reinforce anymore. So in PPO, the idea is that no need to reinforce."},{"start":2425.25,"text":"Because it's already a good action,"},{"start":2426.63,"text":"and I'm doing better than the old policy,"},{"start":2428.85,"text":"so I don't have to reinforce."},{"start":2430.41,"text":"So in this case, in PPO's case, you're going to zero it out."},{"start":2433.91,"text":"So basically, you just truncate it to make it zero."},{"start":2436.21,"text":"So basically, you drop this term in this case."},{"start":2438.73,"text":"If RT is much bigger than 1."},{"start":2440.55,"text":"Actually, technically speaking,"},{"start":2441.45,"text":"if RT is bigger than 1 plus some epsilon,"},{"start":2444.73,"text":"it's called epsilon high."},{"start":2445.81,"text":"It's a hyperparameter."},{"start":2446.91,"text":"Sometimes this is like 0.2 or 0.28, something like that."},{"start":2450.21,"text":"So basically, if RT is already larger than 1.28,"},{"start":2453.17,"text":"eight then you say I don't I don't care anymore because I'm already in the right"},{"start":2456.97,"text":"direction I don't want to risk the the instability to or some kind of"},{"start":2463.33,"text":"instability to to keep updating it and and when so in PPO so there is also a"},{"start":2473.11,"text":"case when a hat is big and RT let's say is um let's say small let's say this is"},{"start":2480.89,"text":"is smaller than one, okay, there are actually many cases,"},{"start":2485.13,"text":"but let's say you are smaller than epsilon high,"},{"start":2486.77,"text":"something like this."},{"start":2488.21,"text":"And then in this case, or maybe let's say,"},{"start":2490.91,"text":"maybe for simplicity, let's say this is smaller than 0.5."},{"start":2493.89,"text":"Suppose, let's do this case."},{"start":2495.47,"text":"If you do this case, it means that your current,"},{"start":2498.81,"text":"so this is a good action, but your current policy"},{"start":2502.05,"text":"is doing not as good as the old policy."},{"start":2504.89,"text":"So that's why you have to increase the policy."},{"start":2506.79,"text":"You have to increase the probability of the policy"},{"start":2512.33,"text":"to generate AT."},{"start":2513.59,"text":"So you do need to do some work."},{"start":2515.17,"text":"So basically, that's why you take the gradient."},{"start":2517.31,"text":"You take the gradient of this thing."},{"start":2519.03,"text":"So you apply the gradient."},{"start":2524.17,"text":"apply the gradient of this surrogate loss. Let's say maybe this is called this JPPO. So you apply this JPPO with respect to theta. Or maybe in some sense, for this particular action, you just basically apply nabla theta pi theta A TST."}],"speech_gaps":[{"start":2520.41,"end":2522.4}],"frame":"../frames/v038/015.webp","frame_time":2380.69},{"title":"PPO算法中的梯度更新策略","segments":[{"id":279,"text":"You apply this, and you do it in a positive direction, so you are trying to maximize the chance. You want to try to increase the probability of this, as usual. And actually, in a PPO situation, just as long as it's less than this, you say, good, I'm going to take the gradient. But in this case, I just drop it.","zh":"你应用这个方法，并且朝着正方向进行，因此你试图最大化机会。你想要尝试增加这个事件的概率，就像往常一样。实际上，在PPO的情况下，只要它小于这个值，你就说，好，我要采取梯度。但在这种情况下，我直接丢弃它。","start":2551.78,"end":2571.74},{"id":280,"text":"And then there's a negative case, which is a little bit different. So in the negative case, there are still two cases. One case is that your RT is, say, less than 1 minus epsilon low. And epsilon low is also something like 0.2 in many cases. So basically, if your RT is already small, and this is a bad action. So it's a bad action, and you are doing","zh":"然后还有一个负的情况，这有所不同。所以在负的情况下，仍然有两种情况。一种情况是你的RT小于1减去epsilon_low。epsilon_low在很多情况下也是大约0.2。所以基本上，如果你的RT已经很小，这表示这是一个坏动作。因此这是一个坏动作，你正在做","start":2573.76,"end":2596.6},{"id":281,"text":"you are generating this action with less chance than the old policy. So you are already doing the right direction. You are already going in the right direction. And in this case, PPO will say, no need to update. So this part is also zeroed. So you don't have any gradient. And then for the case where RT is bigger than 1 epsilon low, just as usual, you update the gradient.","zh":"你以比旧策略更小的概率生成这个动作。因此你已经在正确的方向上。你已经在正确的方向上。在这种情况下，PPO会说，不需要更新。因此这一部分也被置零。因此你没有任何梯度。然后对于RT大于1 epsilon_low的情况，就像往常一样，你更新梯度。","start":2597.21,"end":2627.67},{"id":282,"text":"Because this is the case when the action is bad action, but you are, in some sense, your probability is not small enough. So if it's a bad action, you want the pi theta to be smaller than this. You want this ratio to be very small. But you are not small enough, so that's why you should reinforce it to make it even smaller. And this is the case study. And if you look at the papers, the formula is actually pretty interesting.","zh":"因为这是动作是坏动作的情况，但你的概率在某种程度上还不够小。因此如果这是一个坏动作，你希望pi_theta比这个值更小。你希望这个比率非常小。但你还不够小，因此你应该强化它，使其更小。这就是案例研究。如果你查看论文，公式实际上非常有趣。","start":2628.26,"end":2656.74},{"id":283,"text":"So the formula is this. That's often what people often get confused. So they define this kind of like so-called cost function or the reward function, which is this mean of this RT times A hat times this clip 1 minus epsilon low 1 plus epsilon high RT times A hat.","zh":"所以公式是这个。这通常是人们常常混淆的地方。他们定义了这种所谓的成本函数或奖励函数，这是这个RT乘以A_hat的均值，再乘以这个clip 1减去epsilon_low到1加上epsilon_high的RT乘以A_hat。","start":2657.51,"end":2691.75},{"id":284,"text":"So this is the formula you're going to see in the papers. And it's actually doing exactly the same thing here. So let me try to unpack it. So if A hat is bigger than 0, then all of these terms are positive. And then it depends on which regime you're at about this RT. So if A hat is bigger than 0, if RT is, say, bigger than 1 plus epsilon high, then you are taking this part. Because this part is...","zh":"所以这就是你在论文中看到的公式。实际上它在这里做着完全相同的事情。让我尝试解释一下。如果A_hat大于0，那么所有这些项都是正的。然后它取决于你所处的RT的范围。如果A_hat大于0，如果RT比如说大于1加上epsilon_high，那么你就会采用这一部分。因为这一部分是……","start":2693.26,"end":2722.52}],"notes":["本段讲解了PPO算法中梯度更新的两种情况：正向情况和负向情况。在正向情况下，如果RT（回报率）小于1减去epsilon_low，说明当前动作是坏动作，此时不需要更新梯度。而在负向情况下，如果RT大于1加epsilon_high，说明当前动作是坏动作，但概率不够小，需要通过强化使概率更小。","在负向情况下，如果RT小于1减去epsilon_low，说明当前动作是坏动作，但概率已经足够小，因此不需要更新梯度。而在RT大于1加epsilon_high的情况下，说明当前动作是坏动作，但概率仍然较大，需要通过强化使概率更小。","PPO算法通过定义一个类似于成本函数或奖励函数的公式，来处理这两种情况。该公式是RT乘以A_hat（优势函数）的均值，并通过clip操作限制其范围，以防止梯度更新过大。","该公式在论文中经常出现，其作用是确保在不同情况下，梯度更新的幅度被限制在合理的范围内。当A_hat大于0时，所有项都是正的，具体更新方式取决于RT所在的区间。","当A_hat大于0且RT大于1加epsilon_high时，会使用该部分进行更新，因为此时需要进一步降低概率。这种设计确保了算法在不同情况下都能稳定地进行梯度更新，避免过大的更新幅度导致训练不稳定。","PPO算法通过这种机制平衡了探索和利用，确保在不同情况下都能有效地更新策略，同时避免了梯度更新过大带来的问题。"],"formulas":[],"uncertainties":["RT的定义可能不明确，需要进一步确认是否为回报率（Return）或某种特定的比率（Ratio）。","A_hat的定义可能不明确，需要进一步确认是否为优势函数（Advantage Function）的估计值。","clip操作的具体实现方式可能不明确，需要进一步确认是否为线性裁剪或非线性裁剪。"],"diagram":"none","start":2551.78,"end":2722.52,"asr_flags":[],"math_clarifications":["公式中的裁剪操作应为对RT乘以优势函数\\bar{A}的结果进行裁剪，但原公式中未明确说明裁剪的上下限是否为1 - \\epsilon_{low}和1 + \\epsilon_{high}。此外，公式中未明确说明裁剪操作的数学定义，如是否为min和max的组合，因此无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2551.78,"text":"You apply this, and you do it in a positive direction, so you are trying to maximize the chance. You want to try to increase the probability of this, as usual. And actually, in a PPO situation, just as long as it's less than this, you say, good, I'm going to take the gradient. But in this case, I just drop it."},{"start":2573.76,"text":"And then there's a negative case, which is a little bit different. So in the negative case, there are still two cases. One case is that your RT is, say, less than 1 minus epsilon low. And epsilon low is also something like 0.2 in many cases. So basically, if your RT is already small, and this is a bad action. So it's a bad action, and you are doing"},{"start":2597.21,"text":"you are generating this action with less chance than the old policy. So you are already doing the right direction. You are already going in the right direction. And in this case, PPO will say, no need to update. So this part is also zeroed. So you don't have any gradient. And then for the case where RT is bigger than 1 epsilon low, just as usual, you update the gradient."},{"start":2628.26,"text":"Because this is the case when the action is bad action, but you are, in some sense, your probability is not small enough. So if it's a bad action, you want the pi theta to be smaller than this. You want this ratio to be very small. But you are not small enough, so that's why you should reinforce it to make it even smaller. And this is the case study. And if you look at the papers, the formula is actually pretty interesting."},{"start":2657.51,"text":"So the formula is this. That's often what people often get confused. So they define this kind of like so-called cost function or the reward function, which is this mean of this RT times A hat times this clip 1 minus epsilon low 1 plus epsilon high RT times A hat."},{"start":2693.26,"text":"So this is the formula you're going to see in the papers. And it's actually doing exactly the same thing here. So let me try to unpack it. So if A hat is bigger than 0, then all of these terms are positive. And then it depends on which regime you're at about this RT. So if A hat is bigger than 0, if RT is, say, bigger than 1 plus epsilon high, then you are taking this part. Because this part is..."}],"speech_gaps":[],"frame":"../frames/v038/016.webp","frame_time":2563.78},{"title":"梯度消失与剪枝操作的数学分析","segments":[{"id":285,"text":"This part is big because RT is big. Let's say RT is 10. This is 10 times a hat. And this is only 1 plus epsilon high times a hat. So basically, then the value will be from this part. So it's 1 plus epsilon high times a hat. And because this is a constant, there's no gradient. Because this part has no, this clipping thing doesn't have any gradient. If you clip, it's not a variable of the theta. So there's no gradient.","zh":"这一部分很大，因为RT很大。假设RT是10。这是10倍的帽子。而这一部分只有1加epsilon高的帽子。所以基本上，值就来自这一部分。所以是1加epsilon高的帽子。而且因为这是一个常数，所以没有梯度。因为这一部分没有梯度，剪枝操作本身没有梯度。如果你进行了剪枝，它就不是theta的变量。所以没有梯度。","start":2723.76,"end":2753.8},{"id":286,"text":"And if RT is less than 1 plus epsilon high, then you are in this branch. So this branching will become RT times A hat. So that's why it's just a normal gradient. You are applying this gradient. I guess you also need to apply A hat. So you're applying a normal gradient to try to encourage this to be higher.","zh":"如果RT小于1加epsilon高，那么你就处于这个分支中。所以这种分支会变成RT乘以帽子。所以这就是为什么它只是一个正常的梯度。你正在应用这个梯度。我想你也需要应用帽子。所以你正在应用一个正常的梯度，试图鼓励这个值更高。","start":2757.49,"end":2777.36},{"id":287,"text":"And the same thing for the negative side. If you do the case study, it actually reverses the opposite. So in the negative side, I guess if you check it, it's doing the same thing here. So that's why the clean formula is this, but it's actually just the four cases. This is not high. This is bigger, right? Because RT is big. I say RT is 10, I say. So this is 10 times a height. This is only 1 plus epsilon a height. So that's why you take the mean part.","zh":"负数这边也是一样的情况。如果你进行案例研究，实际上会反转相反的情况。所以在负数这边，我想如果你检查一下，它在这里做的是同样的事情。这就是为什么干净的公式是这个，但实际上只是四种情况。这个不高。这个更大，对吧？因为RT很大。我说RT是10，我说。所以这是10倍的高度。这是只有1加epsilon的高度。这就是为什么你要取平均部分。","start":2778.33,"end":2820.15},{"id":288,"text":"In the second case. In the second case you are taking this side because this side is smaller. In the first case, this is bigger. In the second case. In the second case, why this is bigger? That's because","zh":"在第二种情况中。在第二种情况中，你取这一边，因为这一边更小。在第一种情况中，这一边更大。在第二种情况中。在第二种情况中，为什么这一边更大？那是因为","start":2823.98,"end":2854.86},{"id":289,"text":"You know, take some values. So let's say RT is like 0.5. Then this is correct to be 1 minus epsilon, say 0.8. So this is 0.5. So this is smaller, this is bigger. Does that make sense? And if RT is between these two, then these two quantities are the same, actually. You are only, yes, yes. Or maybe not all doing, yeah. So basically, maybe not exactly, because there is some buffer here. It's not like a, it has to be.","zh":"你知道，取一些值。比如说RT是0.5。那么这应该是1减去epsilon，比如说0.8。所以这是0.5。所以这一边更小，那一边更大。这有意义吗？如果RT在这两个值之间，那么这两个量实际上是相等的。你只是，是的，是的。或者可能不是全部在做，是的。所以基本上，可能并不完全准确，因为这里有一些缓冲。它不像一个，它必须是。","start":2857.05,"end":2894.97}],"notes":["本段讲解了梯度消失问题在剪枝操作中的表现。当RT（可能代表某种比例或阈值）较大时，梯度消失问题会更加明显，因为此时的计算部分是常数，不会对参数θ产生梯度影响。剪枝操作会将某些部分从梯度计算中排除，从而避免梯度消失。","当RT小于1+epsilon_high时，梯度计算会进入另一个分支，此时梯度计算是正常的，即RT乘以A_hat。这种情况下，梯度计算会鼓励模型参数向更高的方向调整。","在负侧的情况与正侧类似，但方向相反。通过案例分析可以发现，负侧的处理方式与正侧相同，只是方向相反。因此，最终的公式可以看作是四个情况的组合。","当RT处于两个阈值之间时，两个量的值会相等。这种情况下，梯度计算可能不会完全生效，因为存在一定的缓冲区，而不是严格的阈值条件。","通过具体数值的举例，如RT=0.5，可以更直观地理解梯度消失问题的处理方式。当RT较小时，梯度计算会更接近1-epsilon，从而避免梯度消失。","整个分析强调了梯度消失问题在剪枝操作中的重要性，以及如何通过不同的分支处理来避免梯度消失，从而提高模型的训练效果。"],"formulas":[],"uncertainties":["RT的具体含义未明确，可能是某种比例或阈值，但未在原文中给出定义。","epsilon_high和epsilon的定义未明确，可能代表某种缓冲区或阈值，但未在原文中给出定义。","A_hat的具体含义未明确，可能是某种归一化或调整后的值，但未在原文中给出定义。","梯度消失的具体数学表达式未明确，但通过上下文可以推测其与剪枝操作有关。"],"diagram":"none","start":2723.76,"end":2894.97,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2723.76,"text":"this part is big because rt is big. Let's say rt is 10. This is 10 times a hat. And this is only 1 plus epsilon high times a hat. So basically, then the value will be from this part. So it's 1 plus epsilon high times a hat. And because this is a constant, there's no gradient. Because this part has no, this clipping thing doesn't have any gradient. If you clip, it's not a variable of the theta. So there's no gradient."},{"start":2757.49,"text":"And if RT is less than 1 plus epsilon high, then you are in this branch. So this branching will become RT times A hat. So that's why it's just a normal gradient. You are applying this gradient. I guess you also need to apply A hat. So you're applying a normal gradient to try to encourage this to be higher."},{"start":2778.33,"text":"And the same thing for the negative side. If you do the case study, it actually reverse the opposite. So in the negative side, I guess if you check it, it's doing the same thing here. So that's why the clean formula is this, but it's actually just the four cases. This is not high. This is bigger, right? Because rt is big. I say rt is 10, I say. So this is 10 times a height. This is only 1 plus epsilon a height. So that's why you take the mean part."},{"start":2823.98,"text":"In the second case. In the second case you are taking this side because this side is smaller. In the first case, this is bigger. In the second case. In the second case, why this is bigger? That's because"},{"start":2857.05,"text":"You know, take some values. So let's say RT is like 0.5. Then this is correct to be 1 minus epsilon, say 0.8. So this is 0.5. So this is smaller, this is bigger. Does that make sense? And if RT is between these two, then these two quantities are the same, actually. You are only, yes, yes. Or maybe not all doing, yeah. So basically, maybe not exactly, because there is some buffer here. It's not like a, it has to be."}],"speech_gaps":[{"start":2821.424,"end":2823.58}],"frame":"../frames/v038/017.webp","frame_time":2735.76},{"title":"策略更新与学习率调整的动机","segments":[{"id":290,"text":"So, basically, if your new policy is already doing great, you don't update. Yes. And only if the new policy is not doing great, it's not doing great means that it's done much better than the old policy you are updating. So, in some sense, it's kind of like, I think the original motivation was that this led you to not move too far away from the original pilot, so that you can stay in the neighborhood, so that your approximation here, like this approximation that","zh":"所以，基本上，如果你的新策略已经表现很好，你就不会更新。是的。只有当新策略表现不佳时，才会进行更新。表现不佳意味着它比你要更新的旧策略好得多。从某种意义上说，这有点像最初的动机是让你不要离原来的策略太远，这样你就能保持在邻域内，这样这里的近似，比如这种近似，","start":2895.58,"end":2925.3},{"id":291,"text":"you change this to pi old, it kind of still makes sense. I don't know whether that's exactly the reason, but that's the story. So you don't want to over-update if you're already doing something okay. Exactly, exactly. So the learning slowed down, yes. Maybe let me take, I think I have actually some response to your question as well, but let me take that question first.","zh":"你将它改为旧策略，这在某种程度上还是有意义的。我不知道这是否就是确切的原因，但这就是这个故事。你不希望在已经做得不错的情况下过度更新。没错，没错。所以学习速度变慢了，是的。也许我可以回应你的问题，但我先回答这个问题。","start":2926.08,"end":2952.56},{"id":292,"text":"Yeah, I think there are papers that try to set them at different values, and actually the magic number is 0.2, 0.28, or something like that. And some people claim that you should do the absolute height can be a little higher. And I think one of the reasons is that I don't really expect you to understand this. I don't understand fundamentally, but you can argue that on this side, it's probably less of an issue if you don't clip so aggressively.","zh":"是的，我认为有一些论文尝试将它们设置为不同的值，实际上魔法数字是0.2、0.28之类的。有些人声称你应该将绝对上限设得稍高一些。我认为其中一个原因是我不太指望你理解这一点。我也不完全理解，但你可以争论说，在这一侧，如果你不过于激进地进行裁剪，这可能不是大问题。","start":2959.15,"end":2987.04},{"id":293,"text":"As you mentioned, if you clip, you are slowing down your learning. You are just making your update smaller because you are already doing OK. And it's probably not a big deal if you're less demanding in this restriction. You say, even I'm 2x bit better than the original policy, the old policy, I'm still learning. That's probably fine. So that's why people are more willing to change the absolute high.","zh":"正如你提到的，如果你进行裁剪，你会减慢你的学习速度。你只是让更新变得更小，因为你已经做得不错了。如果你在这一限制上要求不那么严格，这可能不是什么大问题。你说，即使我比原来的策略好两倍，我仍然在学习。这可能没问题。这就是为什么人们更愿意改变绝对上限。","start":2988.04,"end":3013.16},{"id":294,"text":"On the other side, it's a little bit more about diversity because in some sense, if you are already, so in this case, this row, this is the row that is.","zh":"另一方面，这更多是关于多样性，因为在某种意义上，如果你已经……在这种情况下，这一行，这就是那一行。","start":3014.67,"end":3024.69},{"id":295,"text":"on the other side. So this is saying that I'm already doing better than the original policy, but this is a bad example, bad action, so I want to minimize the chance. But sometimes minimize the chance too much has unexpected consequences. You lose the diversity. You just penalize this action too much, and somehow it becomes too deterministic, and you converge the local minimum. So in some sense,","zh":"另一方面。所以这说明我已经比原来的策略表现得更好了，但这是一个不好的例子，不好的动作，所以我想要最小化这种可能性。但有时候过度最小化可能性会产生意想不到的后果。你失去了多样性。你只是对这个动作惩罚得太重，结果某种方式下它变得过于确定性，从而收敛到局部极小值。所以在某种意义上，","start":3025.48,"end":3052.4}],"notes":["本段讨论了策略更新的动机，即如果新策略已经表现良好，则不需要更新，以避免远离原始策略。这种做法有助于保持在近似区域，从而保证近似效果。","讲者提到，如果新策略表现不佳，那么更新是有必要的，但更新幅度应控制，以防止过度调整。这种机制有助于在学习过程中减缓更新速度，避免过拟合。","讲者提到一些研究尝试设置不同的学习率值，其中有一个“魔法数字”是0.2或0.28。一些人认为可以将绝对高度设得更高，但讲者表示自己并不完全理解其原理。","讲者指出，如果进行裁剪（clipping），会减缓学习速度，因为更新幅度变小。但若对限制要求不高，这种影响可能并不严重。","讲者进一步提到，如果策略已经比原始策略好，但某些动作表现不佳，那么需要减少对这些动作的惩罚，以保持策略的多样性。过度惩罚可能导致策略过于确定性，从而陷入局部最优。","讲者强调，策略更新需要在保持性能和多样性之间取得平衡，避免因过度惩罚某些动作而导致策略收敛到局部最优。"],"formulas":[],"uncertainties":["magic number is 0.2, 0.28, or something like that"],"diagram":"none","start":2895.58,"end":3052.4,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2895.58,"text":"So, basically, if your new policy is already doing great, you don't update. Yes. And only if the new policy is not doing great, it's not doing great means that it's done much better than the old policy you are updating. So, in some sense, it's kind of like, I think the original motivation was that this led you to not move too far away from the original pilot, so that you can stay in the neighborhood, so that your approximation here, like this approximation that"},{"start":2926.08,"text":"you change this to pi old, it kind of still makes sense. I don't know whether that's exactly the reason, but that's the story. So you don't want to over-update if you're already doing something okay. Exactly, exactly. So the learning slowed down, yes. Maybe let me take, I think I have actually some response to your question as well, but let me take that question first."},{"start":2959.15,"text":"Yeah, I think there are papers that try to set them at different values, and actually the magic number is 0.2, 0.28, or something like that. And some people claim that you should do the absolute height can be a little higher. And I think one of the reasons is that I don't really expect you to understand this. I don't understand fundamentally, but you can argue that on this side, it's probably less of an issue if you don't clip so aggressively."},{"start":2988.04,"text":"As you mentioned, if you clip, you are slowing down your learning. You are just making your update smaller because you are already doing OK. And it's probably not a big deal if you're less demanding in this restriction. You say, even I'm 2x bit better than the original policy, the old policy, I'm still learning. That's probably fine. So that's why people are more willing to change the absolute high."},{"start":3014.67,"text":"On the other side, it's a little bit more about diversity because in some sense, if you are already, so in this case, this row, this is the row that is."},{"start":3025.48,"text":"on the other side. So this is saying that I'm already doing better than the original policy, but this is a bad example, bad action, so I want to minimize the chance. But sometimes minimize the chance too much has unexpected consequences. You lose the diversity. You just penalize this action too much, and somehow it becomes too deterministic, and you converge the local minimum. So in some sense,"}],"speech_gaps":[{"start":2954.848,"end":2958.128}],"frame":"../frames/v038/018.webp","frame_time":2907.58},{"title":"Syspol算法与PPO的对比","segments":[{"id":296,"text":"You can argue that even the action is bad, you don't really want to penalize it too much. You still leave some chance for it. You give it some benefit of thought. Maybe this action is bad, but combined with some other actions, it's better at some point. So you give it some benefit of thought. So that's why on this side, I think there's probably, arguably, there's more reason to not update, to not overlearn too much.","zh":"你可以认为，即使这个动作是坏的，你也不太想对其施加过多惩罚。你仍然给它保留一些可能性。你给予它一些思考的空间。也许这个动作是坏的，但结合其他一些动作，它在某个点上可能更好。因此，你给予它一些思考的空间。因此，这就是为什么在这一侧，我认为可能有理由不去更新，不要过度学习。","start":3053.97,"end":3083.15},{"id":297,"text":"You can argue that even the action is bad, you don't really want to penalize it too much. You still leave some chance for it. You give it some benefit of thought. Maybe this action is bad, but combined with some other actions, it's better at some point. So you give it some benefit of thought. So that's why on this side, I think there's probably, arguably, there's more reason to not update, to not overlearn too much.","zh":"你可以认为，即使这个动作是坏的，你也不太想对其施加过多惩罚。你仍然给它保留一些可能性。你给予它一些思考的空间。也许这个动作是坏的，但结合其他一些动作，它在某个点上可能更好。因此，你给予它一些思考的空间。因此，这就是为什么在这一侧，我认为可能有理由不去更新，不要过度学习。","start":3084.27,"end":3112.77},{"id":298,"text":"And RT is bigger than 1 plus epsilon high.","zh":"并且 RT 比 1 加上 epsilon 更大。","start":3113.4,"end":3115.94},{"id":299,"text":"I think maybe it's useful to draw something here.","zh":"我认为在这里画个图可能是有用的。","start":3116.72,"end":3119.04},{"id":300,"text":"So this is A hat is bigger than 0.","zh":"因此，这是 A 帽大于 0。","start":3119.54,"end":3121.08},{"id":301,"text":"And this is, if you do nothing, if you just keep the business","zh":"并且如果你什么也不做，如果只是维持现状","start":3122.02,"end":3126.94},{"id":302,"text":"as usual, this is this line, right?","zh":"的话，这就是这条线，对吧？","start":3126.94,"end":3129.04},{"id":303,"text":"It's RT, the switch line.","zh":"它是 RT，切换线。","start":3129.1,"end":3130.76},{"id":304,"text":"And GRPO is trying to say, if I'm above 1 plus,","zh":"GRPO试图表达，如果我已经高于1加","start":3131.2,"end":3137.68},{"id":305,"text":"let's say this is 1, this is 1 plus epsilon high, that's 1.2.","zh":"比如说，这里设为1，这里是1加一个很小的epsilon，也就是1.2。","start":3137.94,"end":3141.8},{"id":306,"text":"gRPO is saying that I'm going to take zero afterwards.","zh":"GRPO表示，之后我会采取零值。","start":3141.8,"end":3144.6},{"id":307,"text":"I have no learning if I'm already okay.","zh":"如果我已经处于良好状态，就不会再学习了。","start":3144.84,"end":3146.92},{"id":308,"text":"So that's gRPO, sorry, not gRPO, that's the PPO.","zh":"所以这是PPO，抱歉，不是GRPO，这是PPO。","start":3147.52,"end":3151.18},{"id":309,"text":"gRPO is an advanced version of PPO","zh":"GRPO是PPO的一个高级版本","start":3152.06,"end":3154.2},{"id":310,"text":"which is doing the same thing in this aspect.","zh":"它在这一方面做的是相同的事情。","start":3154.2,"end":3156.2},{"id":311,"text":"So this is PPO, and the syspo is saying that,","zh":"所以这是PPO，而syspol则表示，","start":3156.46,"end":3165.52},{"id":312,"text":"if I'm above one plus epsilon,","zh":"如果我高于一个加 epsilon 的值，","start":3165.58,"end":3166.9},{"id":313,"text":"I don't want to disable all the learning at all.","zh":"我不想完全禁用所有的学习。","start":3167.1,"end":3169.88},{"id":314,"text":"all, I change it to constant here.","zh":"这里，我把它改为常数。","start":3169.88,"end":3173.36},{"id":315,"text":"So that this part is the same, and this part is 1.","zh":"这样这一部分保持不变，而这一部分是 1。","start":3173.6,"end":3176.74},{"id":316,"text":"So in some sense, you clip the value, but you don't drop it.","zh":"因此，从某种意义上说，你对值进行了裁剪，但并没有完全丢弃它。","start":3178.54,"end":3188.6},{"id":317,"text":"You still keep some kind of gradient in some sense.","zh":"从某种意义上说，你仍然保留了一些梯度。","start":3188.68,"end":3190.98},{"id":318,"text":"So basically, you still have some learning,","zh":"因此，基本上，你仍然有一些学习，","start":3194.0,"end":3198.44},{"id":319,"text":"but it's just that learning is not as aggressive as before,","zh":"但只是学习的强度不如以前那么强烈。","start":3198.44,"end":3200.74},{"id":320,"text":"compared to this linear law.","zh":"与这个线性规律相比。","start":3200.88,"end":3202.78},{"id":321,"text":"And so that's one change.","zh":"因此，这是第一个变化。","start":3203.66,"end":3205.34},{"id":322,"text":"And then the second change, I guess probably I","zh":"然后第二个变化，我想大概我","start":3205.56,"end":3208.34},{"id":323,"text":"should just visualize it.","zh":"应该只是把它可视化。","start":3208.34,"end":3209.22},{"id":324,"text":"So on the other side, so when a hat is less than 0,","zh":"所以在另一边，当一个帽子小于0时，","start":3209.28,"end":3213.72},{"id":325,"text":"so what is PPO?","zh":"那么什么是PPO呢？","start":3214.28,"end":3218.38},{"id":326,"text":"PPO is saying if it's less than 1 minus epsilon,","zh":"PPO说的是如果它小于1减去epsilon，","start":3218.48,"end":3220.62}],"notes":["本段主要讨论Syspol算法与PPO算法的对比，强调Syspol算法在处理某些情况时不会完全禁用学习，而是进行一定程度的调整。讲者提到Syspol算法在某些情况下会将学习率调整为常数，而不是完全停止学习，这与PPO算法在某些情况下完全停止学习形成对比。","讲者提到Syspol算法在某些情况下会将学习率调整为常数，而不是完全停止学习，这与PPO算法在某些情况下完全停止学习形成对比。这种调整使得Syspol算法在某些情况下仍然保留一定的学习能力，但学习的强度不如之前。","讲者提到Syspol算法在某些情况下会将学习率调整为常数，而不是完全停止学习，这与PPO算法在某些情况下完全停止学习形成对比。这种调整使得Syspol算法在某些情况下仍然保留一定的学习能力，但学习的强度不如之前。","讲者提到Syspol算法在某些情况下会将学习率调整为常数，而不是完全停止学习，这与PPO算法在某些情况下完全停止学习形成对比。这种调整使得Syspol算法在某些情况下仍然保留一定的学习能力，但学习的强度不如之前。","讲者提到Syspol算法在某些情况下会将学习率调整为常数，而不是完全停止学习，这与PPO算法在某些情况下完全停止学习形成对比。这种调整使得Syspol算法在某些情况下仍然保留一定的学习能力，但学习的强度不如之前。","讲者提到Syspol算法在某些情况下会将学习率调整为常数，而不是完全停止学习，这与PPO算法在某些情况下完全停止学习形成对比。这种调整使得Syspol算法在某些情况下仍然保留一定的学习能力，但学习的强度不如之前。"],"formulas":[],"uncertainties":["epsilon high","RT is bigger than 1 plus epsilon high","a hat is less than 0"],"diagram":"none","start":3053.97,"end":3220.62,"asr_flags":[],"translation_complete":true,"translated_segments":31,"raw_segments":[{"start":3053.97,"text":"You can argue that even the action is bad, you don't really want to penalize it too much. You still leave some chance for it. You give it some benefit of thought. Maybe this action is bad, but combined with some other actions, it's better at some point. So you give it some benefit of thought. So that's why on this side, I think there's probably, arguably, there's more reason to not update, to not overlearn too much. But, okay, so now there's a new algorithm called Syspol."},{"start":3084.27,"text":"which is actually a pretty popular algorithm. Like in my life, when we are doing the training, we mostly use it as opposed to the PPO. And the Syspo is doing something quite, okay, let me see, where should I write it? So let's say Syspo. So Syspo, again, I don't know whether this is the right, fundamentally the right algorithm. It's just what people are, it's popular and it's probably the best option. So Syspo is doing something quite different. So if A hat is bigger than zero,"},{"start":3113.4,"text":"And RT is bigger than 1 plus epsilon high."},{"start":3116.72,"text":"I think maybe it's useful to draw something here."},{"start":3119.54,"text":"So this is A hat is bigger than 0."},{"start":3122.02,"text":"And this is, if you do nothing, if you just keep the business"},{"start":3126.94,"text":"as usual, this is this line, right?"},{"start":3129.1,"text":"It's RT, the switch line."},{"start":3131.2,"text":"And GRPO is trying to say, if I'm above 1 plus,"},{"start":3137.94,"text":"let's say this is 1, this is 1 plus epsilon high, that's 1.2."},{"start":3141.8,"text":"gRPO is saying that I'm going to take zero afterwards."},{"start":3144.84,"text":"I have no learning if I'm already okay."},{"start":3147.52,"text":"So that's gRPO, sorry, not gRPO, that's the PPO."},{"start":3152.06,"text":"gRPO is an advanced version of PPO"},{"start":3154.2,"text":"which is doing the same thing in this aspect."},{"start":3156.46,"text":"So this is PPO, and the syspo is saying that,"},{"start":3165.58,"text":"if I'm above one plus epsilon,"},{"start":3167.1,"text":"I don't want to disable all the learning at all."},{"start":3169.88,"text":"all, I change it to constant here."},{"start":3173.6,"text":"So that this part is the same, and this part is 1."},{"start":3178.54,"text":"So in some sense, you clip the value, but you don't drop it."},{"start":3188.68,"text":"You still keep some kind of gradient in some sense."},{"start":3194.0,"text":"So basically, you still have some learning,"},{"start":3198.44,"text":"but it's just that learning is not as aggressive as before,"},{"start":3200.88,"text":"compared to this linear law."},{"start":3203.66,"text":"And so that's one change."},{"start":3205.56,"text":"And then the second change, I guess probably I"},{"start":3208.34,"text":"should just visualize it."},{"start":3209.28,"text":"So on the other side, so when a hat is less than 0,"},{"start":3214.28,"text":"so what is PPO?"},{"start":3218.48,"text":"PPO is saying if it's less than 1 minus epsilon,"}],"speech_gaps":[{"start":3191.76,"end":3193.6}],"frame":"../frames/v038/019.webp","frame_time":3065.97},{"title":"PPO与SysPo算法的对比与多样性损失问题","segments":[{"id":327,"text":"I'm going to zero it out. No gradient whatsoever. And after that, I'm going to take linear. This is PPO. And SysPo is saying that, actually, SysPo is doing something very different. SysPo is saying that I'm going to do exactly the same thing on the positive side. So SysPo is like, if you are above one epsilon high, you take one, and then on this side you do this thing.","zh":"我要把它置零。完全没有梯度。之后，我会采取线性方法。这就是PPO。而SysPo则说，实际上，SysPo在做一件非常不同的事情。SysPo说，我会在正的一侧做完全相同的事情。因此，SysPo就像是说，如果你高于一个epsilon的值，你就取1，而在这一侧你则做这件事。","start":3222.35,"end":3252.75},{"id":328,"text":"So why does this make sense? So SysPo is saying that, OK, so we call that this is a negative advantage case, which means your action is bad. Your action is not good.","zh":"那么为什么这样做是有意义的呢？SysPo说，好的，我们将这种情况称为负优势情况，这意味着你的动作是不好的。你的动作并不好。","start":3255.9,"end":3266.15},{"id":329,"text":"It's saying in this regime, if you are already","zh":"它说在这个范围内，如果你已经","start":3268.12,"end":3271.42},{"id":330,"text":"smaller probability than the original policy,","zh":"比原始策略的概率更小，","start":3271.42,"end":3273.62},{"id":331,"text":"you're still trying to learn to keep making it smaller.","zh":"你仍然试图学习以继续让其变得更小。","start":3273.86,"end":3276.08},{"id":332,"text":"So in some sense, you lose diversity.","zh":"从某种意义上说，你会失去多样性。","start":3276.3,"end":3277.32},{"id":333,"text":"And actually, empirically, in some of my projects,","zh":"实际上，在我的一些项目中，","start":3277.98,"end":3280.42},{"id":334,"text":"I do see SysPo, this new algorithm, SysPo,","zh":"我确实看到了这个新算法SysPo，","start":3280.62,"end":3283.92},{"id":335,"text":"does lead to sometimes losing diversity.","zh":"这有时会导致多样性丢失。","start":3284.04,"end":3286.42},{"id":336,"text":"And on this side, it's saying that why you are clicking here.","zh":"而在这一侧，它是在问你为什么点击这里。","start":3287.54,"end":3292.22},{"id":337,"text":"The reason is the following.","zh":"原因如下。","start":3293.28,"end":3294.88},{"id":338,"text":"The SysPo reason is that anything that makes any case","zh":"SysPo 的原因是任何会导致任何情况","start":3294.88,"end":3299.94},{"id":339,"text":"when the R is big is a bad case.","zh":"当 R 很大时，就是一个坏情况。","start":3299.94,"end":3301.72},{"id":340,"text":"Because if R is big, then the gradient is also big.","zh":"因为如果 R 很大，那么梯度也会很大。","start":3302.14,"end":3304.44},{"id":341,"text":"So you just, if R is big, then sometimes you have","zh":"所以，如果 R 很大，那么有时你会在这里","start":3304.94,"end":3308.88},{"id":342,"text":"too much weighting here, and you have too much instability.","zh":"有过多的权重，从而导致过多的不稳定性。","start":3308.88,"end":3311.52},{"id":343,"text":"So this term contributes to gradient too much in some sense.","zh":"因此，这个项在某种程度上对梯度的贡献太大。","start":3311.88,"end":3315.88},{"id":344,"text":"Not because whether we have learned or not,","zh":"并不是因为我们是否已经学习过了，","start":3316.08,"end":3318.18},{"id":345,"text":"whether we have done good or bad compared to the old one.","zh":"也不是因为我们与旧策略相比做得好还是不好。","start":3318.28,"end":3321.22},{"id":346,"text":"It's just because the update is too big.","zh":"只是因为更新的幅度太大。","start":3321.34,"end":3322.44},{"id":347,"text":"big.","zh":"大。","start":3322.44,"end":3322.56},{"id":348,"text":"So basically, the SysPo philosophy","zh":"基本上，SysPo 的理念是","start":3323.0,"end":3325.18},{"id":349,"text":"is that just because I don't want to have big update,","zh":"只要我不想进行大的更新，","start":3325.18,"end":3327.52},{"id":350,"text":"I just clip anything that is big.","zh":"我就简单地裁剪任何大的值。","start":3327.9,"end":3329.8},{"id":351,"text":"Especially sometimes this ratio can be very big,","zh":"尤其是在某些情况下，这个比率可能会非常大，","start":3330.5,"end":3332.76},{"id":352,"text":"because this is a probability.","zh":"因为这是一个概率。","start":3332.86,"end":3333.74},{"id":353,"text":"It could be like this is 0.2, this is like 0.6.","zh":"例如，这个可能是0.2，这个可能是0.6。","start":3333.96,"end":3336.56},{"id":354,"text":"And you have a ratio of 3.","zh":"那么你就会得到一个3的比率。","start":3336.8,"end":3338.18},{"id":355,"text":"Or maybe this is 0.01, this is 0.6,","zh":"或者也许这个是0.01，这个是0.6，","start":3338.24,"end":3340.08},{"id":356,"text":"and you have a ratio of like 60.","zh":"你就会得到大约60的比率。","start":3340.12,"end":3341.14},{"id":357,"text":"So basically, I just don't want to have","zh":"所以基本上，我只是不想在这个方程中出现这些项。","start":3341.7,"end":3343.32},{"id":358,"text":"terms in this equation. Again, I don't know whether that's really right or not. That's what's argued in some of these papers. And then every once, like every few months, there's a different clipping. I think there's another paper which actually does some combination of the SysPo and PPO by clipping a slightly different way, so on and so forth. Anyway, so I guess probably we should just stop here about, you know.","zh":"再次强调，我不确定这是否真的正确。这是某些论文中争论的内容。然后每隔几个月，就会有一种不同的裁剪方法。我想有一篇论文实际上通过稍微不同的方式裁剪，结合了SysPo和PPO，如此等等。总之，我想我们大概就到这里吧，你知道的。","start":3344.39,"end":3370.85},{"id":359,"text":"about this topic because it's still an open research area. So we don't really know what's the true answer. Okay. Any questions before I move on to? Okay. So I only have 20 minutes. So I need to talk about, I think I want to talk about how to apply this to large-language model. I think the way to apply it is, so to talk about that, I think the first thing to discuss is that there is a notion of chain of thought.","zh":"关于这个主题，因为它仍然是一个开放的研究领域。因此，我们实际上并不知道真正的答案。好的。在继续之前有任何问题吗？好的。所以我只有20分钟的时间。因此，我需要谈谈，我想我想要谈谈如何将这种方法应用于大型语言模型。我认为应用的方法是，为了谈论这一点，我想首先需要讨论的是存在一种思维链的概念。","start":3371.22,"end":3400.11}],"notes":["本段讨论了PPO（Proximal Policy Optimization）和SysPo算法之间的对比，特别是SysPo在处理正负梯度时的不同策略。SysPo在正侧执行与负侧相同的操作，这可能导致多样性损失。讲者提到，当概率低于原始策略时，仍然试图减小概率，这会减少策略的多样性。"],"formulas":[],"uncertainties":["SysPo","CISPO","R is big","SysPoS philosophy"],"diagram":"none","start":3222.35,"end":3400.11,"asr_flags":[],"translation_complete":true,"translated_segments":33,"raw_segments":[{"start":3222.35,"text":"I'm going to zero it out. No gradient whatsoever. And after that, I'm going to take linear. This is PPO. And Syspo is saying that, actually Syspo is doing something very different. Syspo is saying that I'm going to do exactly the same thing on the positive side. So Syspo is like, if you are above one epsilon high, you take one, and then on this side you do this thing."},{"start":3255.9,"text":"So why does this make sense? So CISPO is saying that, OK, so we call that this is a negative advantage case, which means your action is bad. Your action is not good."},{"start":3268.12,"text":"It's saying in this regime, if you are already"},{"start":3271.42,"text":"smaller probability than the original policy,"},{"start":3273.86,"text":"you're still trying to learn to keep making it smaller."},{"start":3276.3,"text":"So in some sense, you lose diversity."},{"start":3277.98,"text":"And actually, empirically, in some of my projects,"},{"start":3280.62,"text":"I do see CISPO, this new algorithm, CISPO,"},{"start":3284.04,"text":"does lead to sometimes losing diversity."},{"start":3287.54,"text":"And on this side, it's saying that why you are clicking here."},{"start":3293.28,"text":"The reason is the following."},{"start":3294.88,"text":"The syspost reason is that anything that makes any case"},{"start":3299.94,"text":"when the R is big is a bad case."},{"start":3302.14,"text":"Because if R is big, then the gradient is also big."},{"start":3304.94,"text":"So you just, if R is big, then sometimes you have"},{"start":3308.88,"text":"too much weighting here, and you have too much instability."},{"start":3311.88,"text":"So this term contributes to gradient too much in some sense."},{"start":3316.08,"text":"Not because whether we have learned or not,"},{"start":3318.28,"text":"whether we have done good or bad compared to the old one."},{"start":3321.34,"text":"It's just because the update is too big."},{"start":3322.44,"text":"big."},{"start":3323.0,"text":"So basically, the SysPoS philosophy"},{"start":3325.18,"text":"is that just because I don't want to have big update,"},{"start":3327.9,"text":"I just clip anything that is big."},{"start":3330.5,"text":"Especially sometimes this ratio can be very big,"},{"start":3332.86,"text":"because this is a probability."},{"start":3333.96,"text":"It could be like this is 0.2, this is like 0.6."},{"start":3336.8,"text":"And you have a ratio of 3."},{"start":3338.24,"text":"Or maybe this is 0.01, this is 0.6,"},{"start":3340.12,"text":"and you have a ratio of like 60."},{"start":3341.7,"text":"So basically, I just don't want to have"},{"start":3344.39,"text":"terms in this equation. Again, I don't know whether that's really right or not. That's what's argued in some of these papers. And then every once, like every few months, there's a different clipping. I think there's another paper which actually does some combination of the CISPO and PPO by clipping a slightly different way, so on and so forth. Anyway, so I guess probably we should just stop here about, you know."},{"start":3371.22,"text":"about this topic because it's still open a research area. So we don't really know what's the true answer. Okay. Any questions before I move on to? Okay. So I only have 20 minutes. So I need to talk about, I think I want to talk about how to apply this to large-language model. I think the way to apply it is, so to talk about that, I think the first thing to discuss is that there is a notion of chain of thought."}],"speech_gaps":[],"frame":"../frames/v038/020.webp","frame_time":3234.35},{"title":"链式思维与少样本学习","segments":[{"id":360,"text":"And it's actually very simple. So in all of our prior discussions, we have some prompt, x1 up to xt, let's say, maybe l. So this is our question, let's say. Let's say, suppose the question is, what is 1 plus 1? And then you ask the model to generate y1 up to yk. And this is the answer. So basically, you ask the question, the model will generate the answer right away.","zh":"实际上，这非常简单。在我们之前的讨论中，我们有一些提示，比如 x1 到 xt，也许是一个问题。这就是我们的问题，比如说，假设问题是，1 加 1 等于多少？然后你让模型生成 y1 到 yk。这就是答案。基本上，你提出问题，模型会立即生成答案。","start":3405.18,"end":3430.57},{"id":361,"text":"And then people realize that actually letting the models","zh":"然后人们意识到，实际上让模型","start":3431.33,"end":3434.35},{"id":362,"text":"to generate answer right away","zh":"立即生成答案","start":3434.35,"end":3435.47},{"id":363,"text":"is not necessarily the best thing.","zh":"并不一定是最好的做法。","start":3436.15,"end":3437.61},{"id":364,"text":"You probably should let the model to think for a little bit","zh":"你可能应该让模型思考一会儿","start":3437.91,"end":3440.05},{"id":365,"text":"and then generate the answer.","zh":"然后再生成答案。","start":3440.05,"end":3441.05},{"id":366,"text":"So, the chain of thought is like this.","zh":"因此，链式思维是这样的。","start":3441.57,"end":3444.03},{"id":367,"text":"You send some kind of like prompt, some question,","zh":"你发送某种提示，比如一个问题，","start":3444.17,"end":3445.95},{"id":368,"text":"and then you let the,","zh":"然后你让模型生成","start":3446.07,"end":3447.19},{"id":369,"text":"the rest of the things is all generated by models,","zh":"其余的所有内容都是由模型生成的","start":3447.61,"end":3449.49},{"id":370,"text":"but this model will generate some thinking tokens, right?","zh":"但这个模型会生成一些思考的标记，对吧？","start":3450.01,"end":3454.33},{"id":371,"text":"And then generate the answer.","zh":"然后生成答案。","start":3454.43,"end":3456.35},{"id":372,"text":"And often the thinking token start with some special","zh":"通常，思考的标记会以一些特殊的","start":3457.41,"end":3460.73},{"id":373,"text":"special thing called this special token like this.","zh":"特殊的东西开始，比如这种特殊的标记。","start":3460.73,"end":3463.57},{"id":374,"text":"Then, you end it with a special token like this.","zh":"然后，你以这种特殊的标记结束。","start":3464.53,"end":3468.51},{"id":375,"text":"It's not always the case.","zh":"这并不是总发生的情况。","start":3469.17,"end":3470.25},{"id":376,"text":"Sometimes, the models don't even generate these tokens.","zh":"有时候，模型甚至不会生成这些标记。","start":3470.39,"end":3472.85},{"id":377,"text":"They just keep thinking.","zh":"它们只是继续思考。","start":3472.95,"end":3473.75},{"id":378,"text":"Actually, I think the Quinn and the DeepSeq models","zh":"实际上，我认为Quinn和DeepSeq模型","start":3474.07,"end":3476.49},{"id":379,"text":"just don't even have this special segmentation.","zh":"根本就没有这种特殊的分隔。","start":3476.49,"end":3479.29},{"id":380,"text":"You just generate the thinking right away,","zh":"你直接生成思考过程，","start":3479.33,"end":3480.73},{"id":381,"text":"and then you generate the answer.","zh":"然后生成答案。","start":3480.81,"end":3481.49},{"id":382,"text":"How this was discovered,","zh":"这种现象是如何被发现的，","start":3485.41,"end":3486.75},{"id":383,"text":"why this was useful at the first place.","zh":"为什么一开始它就有用。","start":3486.89,"end":3488.35},{"id":384,"text":"It was first discovered in this context of solving some of","zh":"它最初是在解决一些数学问题或需要分步骤的问题的背景下被发现的。","start":3488.35,"end":3491.93},{"id":385,"text":"the math questions or some of the questions that require steps.","zh":"例如，问题可能像一个数学问题，","start":3491.93,"end":3494.11},{"id":386,"text":"For example, the question could be like a math question,","zh":"然后你必须进行几步计算，然后得出答案。","start":3494.51,"end":3499.15},{"id":387,"text":"and then you have to do a few steps and then get the answer.","zh":"你不能直接给出答案。没有人能够立即得到答案，","start":3499.25,"end":3502.73},{"id":388,"text":"You cannot just direct it. No human can actually get","zh":"因为这需要一些步骤。","start":3502.85,"end":3505.01},{"id":389,"text":"the answer right away because it does require some steps.","zh":"因此，Z1 到 Zn 实际上是在执行所有这些计算，","start":3505.01,"end":3507.39},{"id":390,"text":"So then this Z1 up to Zn is","zh":"那么这个Z1到Zn就是","start":3507.73,"end":3510.57},{"id":391,"text":"actually laying all those calculations,","zh":"实际上在进行所有这些计算，","start":3510.57,"end":3511.81},{"id":392,"text":"step-by-step calculation.","zh":"分步计算。","start":3512.55,"end":3513.53},{"id":393,"text":"Actually, the first paper,","zh":"实际上，第一篇论文，","start":3514.89,"end":3516.35},{"id":394,"text":"paper what people do is that people are using","zh":"论文中人们所做的就是人们在使用","start":3516.35,"end":3518.59},{"id":395,"text":"few-shot learning to encourage this behaviors.","zh":"少样本学习来鼓励这种行为。","start":3518.59,"end":3520.51},{"id":396,"text":"So basically, I think we discussed few-shot learning,","zh":"所以基本上，我认为我们讨论了少样本学习，","start":3521.53,"end":3524.83},{"id":397,"text":"which is like you give the models","zh":"即你给模型","start":3524.97,"end":3526.91},{"id":398,"text":"a few examples on how to solve the problem,","zh":"一些如何解决问题的例子，","start":3526.91,"end":3528.75},{"id":399,"text":"and then you let them all those to follow the example.","zh":"然后让它们根据这些例子进行模仿。","start":3528.87,"end":3531.81},{"id":400,"text":"So in the examples, you give a few of","zh":"所以在例子中，你给出一些类似这样的手工制作的少样本例子。","start":3532.07,"end":3534.09},{"id":401,"text":"this kind of like handcrafted few-shot examples.","zh":"你发帖说","start":3534.09,"end":3537.29},{"id":402,"text":"post you","zh":"我想解决这个问题，但在解决这个问题之前，我首先给你三个类似的问题，并告诉你如何逐步解决，给出思考过程，然后给出答案。我有三个这样的例子，它们看起来都像这样，然后你将它们全部连接在提示中，接着你说，现在解决这个问题，按照同样的过程，我的新问题。这就是所谓的未来链式推理（future COT）。","start":3537.29,"end":3537.55},{"id":403,"text":"I want to solve this question, but before I can solve the question, I first give you three similar questions and tell you how to solve step-by-step, and give you the thinking process, and then give you the answer. I have three such examples which all look like this, and you concatenate them all in the prompt, and then you say, now solve the question, my new question following the same process. So that's called future COT.","zh":"我想解决这个问题，但在解决这个问题之前，我首先给你三个类似的问题，并逐步告诉你如何解决，给出思考过程，然后给出答案。我有三个这样的例子，它们看起来都像这样，然后你将它们全部连接在提示中，接着你说，现在解决这个问题，我的新问题遵循同样的过程。这就是所谓的未来链式推理（future COT）。","start":3539.47,"end":3563.39}],"notes":["本段讨论了链式思维（Chain of Thought）的概念，即在回答问题前让模型进行思考，生成中间推理步骤，再生成最终答案。这种机制在解决需要多步骤的问题时特别有用，例如数学问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3405.18,"end":3563.39,"asr_flags":[402],"translation_complete":true,"translated_segments":44,"raw_segments":[{"start":3405.18,"text":"And it's actually very simple. So in all of our prior discussions, we have some prompt, x1 up to xt, let's say, maybe l. So this is our question, let's say. Let's say, suppose the question is, what is 1 plus 1? And then you ask the model to generate y1 up to yk. And this is the answer. So basically, you ask the question, the model will generate the answer right away."},{"start":3431.33,"text":"And then people realize that actually letting the models"},{"start":3434.35,"text":"to generate answer right away"},{"start":3436.15,"text":"is not necessarily the best thing."},{"start":3437.91,"text":"You probably should let the model to think for a little bit"},{"start":3440.05,"text":"and then generate the answer."},{"start":3441.57,"text":"So, the chain of thought is like this."},{"start":3444.17,"text":"You send some kind of like prompt, some question,"},{"start":3446.07,"text":"and then you let the,"},{"start":3447.61,"text":"the rest of the things is all generated by models,"},{"start":3450.01,"text":"but this model will generate some thinking tokens, right?"},{"start":3454.43,"text":"And then generate the answer."},{"start":3457.41,"text":"And often the thinking token start with some special"},{"start":3460.73,"text":"special thing called this special token like this."},{"start":3464.53,"text":"Then, you end it with a special token like this."},{"start":3469.17,"text":"It's not always the case."},{"start":3470.39,"text":"Sometimes, the models don't even generate these tokens."},{"start":3472.95,"text":"They just keep thinking."},{"start":3474.07,"text":"Actually, I think the Quinn and the DeepSeq models"},{"start":3476.49,"text":"just don't even have this special segmentation."},{"start":3479.33,"text":"You just generate the thinking right away,"},{"start":3480.81,"text":"and then you generate the answer."},{"start":3485.41,"text":"How this was discovered,"},{"start":3486.89,"text":"why this was useful at the first place."},{"start":3488.35,"text":"It was first discovered in this context of solving some of"},{"start":3491.93,"text":"the math questions or some of the questions that require steps."},{"start":3494.51,"text":"For example, the question could be like a math question,"},{"start":3499.25,"text":"and then you have to do a few steps and then get the answer."},{"start":3502.85,"text":"You cannot just direct it. No human can actually get"},{"start":3505.01,"text":"the answer right away because it does require some steps."},{"start":3507.73,"text":"So then this Z1 up to Zn is"},{"start":3510.57,"text":"actually laying all those calculations,"},{"start":3512.55,"text":"step-by-step calculation."},{"start":3514.89,"text":"Actually, the first paper,"},{"start":3516.35,"text":"paper what people do is that people are using"},{"start":3518.59,"text":"few-shot learning to encourage this behaviors."},{"start":3521.53,"text":"So basically, I think we discussed few-shot learning,"},{"start":3524.97,"text":"which is like you give the models"},{"start":3526.91,"text":"a few examples on how to solve the problem,"},{"start":3528.87,"text":"and then you let them all those to follow the example."},{"start":3532.07,"text":"So in the examples, you give a few of"},{"start":3534.09,"text":"this kind of like handcrafted few-shot examples."},{"start":3537.29,"text":"post you"},{"start":3539.47,"text":"I want to solve this question, but before I can solve the question, I first give you three similar questions and tell you how to solve step-by-step, and give you the thinking process, and then give you the answer. I have three such examples which all look like this, and you concatenate them all in the prompt, and then you say, now solve the question, my new question following the same process. So that's called future COT."}],"speech_gaps":[{"start":3482.512,"end":3485.01}],"frame":"../frames/v038/021.webp","frame_time":3417.18},{"title":"零样本链式推理（Zero-shot COT）与模型训练方法","segments":[{"id":404,"text":"So I think that's initially how it's discovered. And then later on, so this few-shot COT. And then later on, people also found out this zero-shot COT. And what a zero-shot COT means is it's actually much simpler. It just means that in the prompt, you don't give all the examples. You just have a question, you know, X1 up to X. You have a question. And then you add in your prompt, please.","zh":"所以我认为这就是最初是如何被发现的。然后后来，出现了这种少样本链式推理。之后，人们还发现了零样本链式推理。零样本链式推理实际上要简单得多。它只是意味着在提示中，你不需要提供所有的例子。你只需要有一个问题，比如X1到X。然后你有一个问题。接着你在提示中加上，请。","start":3564.59,"end":3593.34},{"id":405,"text":"think step, maybe there's no please, please think step by step. Or let's think step by step. And this is part of your prompt. And then you let the model generate the answer. And because you add this, then the model will naturally start to think step by step and then give you an answer. And just basically these few magical words will make your accuracy improved by like five, 10%, or maybe even sometimes 20%, even more.","zh":"思考步骤，也许不需要请，请思考步骤。或者让我们一步一步地思考。这是你提示的一部分。然后你让模型生成答案。因为你在提示中加入了这些内容，模型就会自然地开始一步一步地思考，然后给出答案。基本上，这些少数的魔法词语会使你的准确率提高大约5%、10%，甚至有时20%甚至更多。","start":3594.79,"end":3623.09},{"id":406,"text":"So that's the so-called zero-shot COT. And then later, people figure out that, oh, if this is so useful, why don't I try to reinforce, why don't I try to train the model to have stronger capability like this? Why don't I do something like training so that this kind of capability is more prominent? So then that comes to how do you train the models to have these kind of behaviors?","zh":"这就是所谓的零样本链式推理。之后，人们发现，哦，如果这种方法这么有用，为什么我不尝试强化它？为什么我不尝试训练模型以获得更强的这种能力？为什么我不做类似的事情，让这种能力更加突出？那么这就引出了如何训练模型以获得这些行为的问题。","start":3624.72,"end":3650.14},{"id":407,"text":"You can try to have a lot of, I think the first set of idea was that you try to do some instruction tuning. Basically, you create a dataset with this kind of behaviors, and then you manually create a dataset with this single step-by-step thinking, and then you train the models with the supervised fine tuning.","zh":"你可以尝试拥有大量的，我认为最初的思路是尝试进行一些指令调优。基本上，你创建一个包含这种行为的数据集，然后手动创建一个包含这种一步一步思考的数据集，然后使用监督微调来训练模型。","start":3652.23,"end":3668.81},{"id":408,"text":"But that's limited because in some sense, you don't really know what's the best way to think step-by-step. The human thinking, actually, if you look at the step-by-step thinking tokens of any of these open source models, because the closed source models, you don't even see the thinking tokens. You only see some summary of how you're thinking. If you look at the open source models, you look at the thinking tokens, it's actually","zh":"但这种方法是有限的，因为从某种意义上说，你并不真正知道如何一步一步地思考。人类的思考，实际上，如果你查看这些开源模型的一步一步思考的标记，因为闭源模型，你甚至看不到思考标记。你只能看到一些关于你如何思考的总结。如果你查看开源模型的思考标记，它实际上","start":3669.94,"end":3693.58},{"id":409,"text":"not very logical. There's a lot of back and forth. Sometimes it's using very succinct shorthand, and sometimes it's skeptical about the question. It's not a very clear and clear","zh":"并不太有逻辑性。有很多来回的讨论。有时它使用非常简洁的速记，有时它对问题持怀疑态度。它并不是非常清晰和明确","start":3693.95,"end":3708.01},{"id":410,"text":"shortest thinking path. It's actually a pretty lengthy back and forth, which is probably similar to how people solve questions. You try different ideas, you reflect on what you have done, all of this. So that's why if you try to handcraft the thinking process, sometimes you don't even know how to generate those messy thinking process. Actually, there was a study on this. People try to generate very, very","zh":"最短的思考路径。实际上，这是一段相当长的来回讨论，这可能和人们解决问题的方式类似。你尝试不同的想法，你反思自己做过的事情，所有这些。因此，如果你试图手工构建思考过程，有时候你甚至不知道如何生成那些混乱的思考过程。实际上，有相关研究。人们尝试生成非常、非常","start":3708.49,"end":3732.38}],"notes":["本段首先介绍了零样本链式推理（zero-shot COT）的概念，即在提示中不提供示例，仅给出问题，让模型自行思考并生成答案。这种技术可以显著提升模型的准确性，有时甚至提高20%以上。","接着，讲者讨论了如何训练模型以增强这种能力，提出了指令调优（instruction tuning）的方法，即创建包含逐步推理行为的数据集，并通过监督微调训练模型。","然而，这种方法存在局限性，因为人类的思考过程并不总是逻辑清晰，且模型生成的思考过程可能包含大量来回讨论和简略表达，难以人工构建。","讲者指出，由于模型的思考过程复杂且不明确，手动构建这些过程是困难的，因此需要研究如何生成这些复杂的思考路径。","最后，讲者提到有相关研究尝试生成非常复杂的思考过程，但具体细节未展开。"],"formulas":[],"uncertainties":["unclear if 'five, 10%' refers to 5% or 10% improvement","unclear if 'very, very' is part of a phrase or a misrecognized word"],"diagram":"none","start":3564.59,"end":3732.38,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3564.59,"text":"So I think that's initially how it's discovered. And then later on, so this few-shot COT. And then later on, people also found out this zero-shot COT. And what a zero-shot COT means is it's actually much simpler. It just means that in the prompt, you don't give all the examples. You just have a question, you know, X1 up to X. You have a question. And then you add in your prompt, please."},{"start":3594.79,"text":"think step, maybe there's no please, please think step by step. Or let's think step by step. And this is part of your prompt. And then you let the model generate the answer. And because you add this, then the model will naturally start to think step by step and then give you an answer. And just basically these few magical words will make your accuracy improved by like five, 10%, or maybe even sometimes 20%, even more."},{"start":3624.72,"text":"So that's the so-called zero-shot COT. And then later, people figure out that, oh, if this is so useful, why don't I try to reinforce, why don't I try to train the model to have stronger capability like this? Why don't I do something like training so that this kind of capability is more prominent? So then that comes to how do you train the models to have these kind of behaviors?"},{"start":3652.23,"text":"You can try to have a lot of, I think the first set of idea was that you try to do some instruction tuning. Basically, you create a dataset with this kind of behaviors, and then you manually create a dataset with this single step-by-step thinking, and then you train the models with the supervised fine tuning."},{"start":3669.94,"text":"But that's limited because in some sense, you don't really know what's the best way to think step-by-step. The human thinking, actually, if you look at the step-by-step thinking tokens of any of these open source models, because the closed source models, you don't even see the thinking tokens. You only see some summary of how you're thinking. If you look at the open source models, you look at the thinking tokens, it's actually"},{"start":3693.95,"text":"not very logical. There's a lot of back and forth. Sometimes it's using very succinct shorthand, and sometimes it's skeptical about the question. It's not a very clear and clear"},{"start":3708.49,"text":"shortest thinking path. It's actually a pretty lengthy back and forth, which is probably similar to how people solve questions. You try different ideas, you reflect on what you have done, all of this. So that's why if you try to handcraft the thinking process, sometimes you don't even know how to generate those messy thinking process. Actually, there was a study on this. People try to generate very, very"}],"speech_gaps":[],"frame":"../frames/v038/022.webp","frame_time":3576.59},{"title":"强化学习在生成模型中的应用","segments":[{"id":411,"text":"succinct thinking process but also think thinking process actually are not very useful for the model because it's just too hard to think that way. You have to spend more time and thinking less logical way in some sense. So that's why this kind of like a","zh":"简洁的思考过程，但实际这种思考过程对模型来说并不是很有用，因为以这种方式思考实在太难了。你必须花更多时间，以某种不太逻辑的方式进行思考。因此，这就是为什么这种类似的方法很难。","start":3733.41,"end":3750.75},{"id":412,"text":"supervised approach is hard. It does work to some degree, but it's hard to scale more and more eventually. So that's why people find out we can use reinforcement learning to train the model. So the benefit of reinforcement learning is that you don't have to have the labels on how to answer the question. You just have to judge whether the answer is correct. So basically, the idea is that you view this.","zh":"监督式方法很难。它在某种程度上是有效的，但最终很难进一步扩展。因此，人们发现我们可以使用强化学习来训练模型。强化学习的优势在于你不需要知道如何回答问题的标签。你只需要判断答案是否正确。基本上，这个想法是将整个过程视为：","start":3751.98,"end":3775.5},{"id":413,"text":"So using RL, you view this whole generation process as a, so basically you're taking this and you give a reward. So you give a reward of the whole trajectory. So this X. So you reward the whole trajectory, but only based on answer. So you reward the trajectory based on the final answer, Y1 up to Y.","zh":"使用强化学习，你将整个生成过程视为一个，因此你将这个过程给予一个奖励。你给予整个轨迹的奖励。因此，这个X。你根据答案奖励整个轨迹。因此，你根据最终答案Y1到Y来奖励轨迹。","start":3776.26,"end":3812.22},{"id":414,"text":"you don't really care about how the thinking was done. You just care about the final answer is right. No matter how you think about it, as long as finally you are doing the right thing, I'm fine with whatever thinking you want. So as long as I can verify the answer. So maybe formally, what it does is that, so you view this kind of like a,","zh":"你并不真正关心思考过程是如何进行的。你只关心最终答案是否正确。无论你怎么思考，只要最终你做了正确的事情，我接受你任何的思考方式。只要我能验证答案。因此，也许正式地说，它所做的就是：你将这种类似的过程视为：","start":3814.07,"end":3836.79},{"id":415,"text":"large language model generation as MDP, and you assign a reward and you apply the reinforcement learning tool. So basically, the way to do it is that, let's say large language model, and this is the RO world or the MDP world. So I think, let's see. So maybe we don't even have to distinguish the thinking versus the, so let's say in the IOM you have some.","zh":"大型语言模型生成作为马尔可夫决策过程（MDP），并分配奖励，然后应用强化学习工具。基本上，实现的方法是：假设大型语言模型，这属于RO世界或MDP世界。我认为，让我们看看。也许我们甚至不需要区分思考与，例如，在IOM中，你有输入X1到XL，Y1，以及一些生成Y1到Y，假设为N，其中一部分是答案，一部分是思考。对于这个讨论，也许我们甚至不需要区分它们。然后你所做的就是在MDP中，MDP的状态。那么我该如何表达这一点？MDP的状态ST对应于所有：","start":3837.46,"end":3864.93},{"id":416,"text":"input X1 up to XL, Y1, and some generation Y1 up to Y, say N, and some part of this is answer, some part of this is thinking. For this discussion, maybe let's don't even distinguish them. Then what you do is you say on the MDP, the state of the MDP. So how do I say this? So the state ST corresponds to all the,","zh":"输入X1到XL，Y1，以及一些生成Y1到Y，假设为N，其中一部分是答案，一部分是思考。对于这个讨论，也许我们甚至不需要区分它们。然后你所做的就是在MDP中，MDP的状态。那么我该如何表达这一点？MDP的状态ST对应于所有：","start":3865.76,"end":3895.3}],"notes":["本段讨论了监督学习在训练生成模型时的局限性，指出其难以扩展，因此转向强化学习。强化学习的优势在于不需要明确的标签，只需判断答案是否正确。","讲者将生成过程视为马尔可夫决策过程（MDP），并赋予奖励机制。奖励基于最终答案，而非中间的思考过程，这使得模型可以专注于生成正确的输出。","讲者提到，生成模型中的输入和输出可以视为MDP的状态和动作，其中状态ST对应于所有输入和生成内容。这种建模方式允许使用强化学习工具进行训练。","讲者强调，强化学习在生成模型中的应用不需要区分思考过程和答案，只需关注最终结果是否正确。这种设计简化了训练过程，同时保持了模型的灵活性。","讲者提到，输入X1到XL和生成内容Y1到Y可以视为MDP中的状态和动作，其中部分是答案，部分是思考过程。为了简化讨论，讲者选择不区分这两部分。","讲者指出，在MDP中，状态ST对应于所有输入和生成内容，这为强化学习的训练提供了结构化的框架。这种建模方式使得模型能够通过奖励机制优化生成过程。"],"formulas":[],"uncertainties":["the thinking process actually are not very useful for the model","the reward of the whole trajectory","the state ST corresponds to all the"],"diagram":"none","start":3733.41,"end":3895.3,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3733.41,"text":"succinct thinking process but also think thinking process actually are not very useful for the model because it's just too hard to think that way. You have to spend more time and thinking less logical way in some sense. So that's why this kind of like a"},{"start":3751.98,"text":"supervised approach is hard. It does work to some degree, but it's hard to scale more and more eventually. So that's why people find out we can use reinforcement learning to train the model. So the benefit of reinforcement learning is that you don't have to have the labels on how to answer the question. You just have to judge whether the answer is correct. So basically, the idea is that you view this."},{"start":3776.26,"text":"So using RL, you view this whole generation process as a, so basically you're taking this and you give a reward. So you give a reward of the whole trajectory. So this X. So you reward the whole trajectory, but only based on answer. So you reward the trajectory based on the final answer, Y1 up to Y."},{"start":3814.07,"text":"you don't really care about how the thinking was done. You just care about the final answer is right. No matter how you think about it, as long as finally you are doing the right thing, I'm fine with whatever thinking you want. So as long as I can verify the answer. So maybe formally, what it does is that, so you view this kind of like a,"},{"start":3837.46,"text":"large language model generation as MDP, and you assign a reward and you apply the reinforcement learning tool. So basically, the way to do it is that, let's say large language model, and this is the RO world or the MDP world. So I think, let's see. So maybe we don't even have to distinguish the thinking versus the, so let's say in the IOM you have some."},{"start":3865.76,"text":"input X1 up to XL, Y1, and some generation Y1 up to Y, say N, and some part of this is answer, some part of this is thinking. For this discussion, maybe let's don't even distinguish them. Then what you do is you say on the MDP, the state of the MDP. So how do I say this? So the state ST corresponds to all the,"}],"speech_gaps":[],"frame":"../frames/v038/023.webp","frame_time":3745.41},{"title":"强化学习中的奖励函数与轨迹","segments":[{"id":417,"text":"previous generation. Actually, let me just try to use my notes so that I don't use the wrong symbol. So the state is both x and all the previous generation. And the action is just the next generating token. It's my action. So the action at is corresponding to the yt. And what's the transition dynamics? So recall that in MDP, given a state and action, you need to predict what is the next state. The transition dynamics is given S and A t. So you need to give both of these two to predict what's S t plus one.","zh":"上一代。实际上，让我试着用我的笔记，这样我不会用错符号。所以状态是x和所有上一代的内容。而动作仅仅是下一个生成的标记。这是我的动作。因此，动作at对应于yt。那么转移动力学是什么？回想一下在MDP中，给定一个状态和动作，你需要预测下一个状态是什么。转移动力学由S和At给出。因此，你需要同时提供这两个来预测St+1。","start":3897.66,"end":3929.02},{"id":418,"text":"predict what is the next state. The transition dynamics is given S and A t. So you need to give both of these two to predict what's S t plus one. So the S t plus one is actually trivial because the S t plus one is just a concatenation of these two. So S t plus one is just, suppose you use this to get S t plus one. S t plus one is just literally x y one up to y t minus one and then concatenate with y t.","zh":"预测下一个状态。转移动力学由S和At给出。因此，你需要同时提供这两个来预测St+1。所以St+1实际上是相当简单的，因为St+1仅仅是这两个的拼接。所以St+1就是，假设你使用这个来得到St+1。St+1就是字面意义上的x y1到yt-1，然后与yt拼接。","start":3929.96,"end":3957.98},{"id":419,"text":"So the dynamics is actually completely deterministic and trivial. But still, it's very hard to control these dynamics because you are applying actions every time. It's long sequences where you have to generate the right tokens in your sequence. Eventually, you can get the answer. And then the reward, so the reward function. So the reward function in reinforcement is applying for every.","zh":"因此，动力学实际上是完全确定且简单的。但即便如此，控制这些动力学仍然非常困难，因为你每次都在应用动作。这是长序列，你需要在序列中生成正确的标记。最终，你可以得到答案。然后是奖励函数。在强化学习中，奖励函数应用于每一个状态和动作对。在这里，奖励函数仅在非常最后才被应用。因此，奖励仅是整个轨迹的奖励。你只关心整个轨迹的奖励，也就是最终状态。整个轨迹，y1到，比如说，yn。我们将这个作为奖励。而奖励实际上就是字面意义上的答案部分，比如说这个部分是答案。因此，答案是否匹配。","start":3959.88,"end":3984.34},{"id":420,"text":"a state and action pair. So here, the reward function is only applied at the very, very end. So the reward is only a reward of the whole trajectory. So you just only care about the reward of the whole trajectory, which is the final state. So the whole trajectory, y1 up to, say, yn. And we give this as a reward. And the reward is really literally just whether the answer part, let's say this part is the answer. So whether answer match.","zh":"真实答案。因此，对于这个数据集，你需要知道真实答案是什么。例如，如果这是一个数学计算问题，那么你知道计算结果，也就是最终结果。你可以看到你得到的结果是否与真实结果匹配。这就是奖励。而奖励通常是二元的。","start":3984.94,"end":4015.59},{"id":421,"text":"the ground truth answer. So it requires that for this data set, you do know what the ground truth answer is. So for example, it's a mathematical calculation problem, then you know what is the resulting calculation, the final result. And you can see whether the result you get matches the result that the ground truth result is. So that is a reward. And the reward is often binary.","zh":"真实答案。因此，对于这个数据集，你需要知道真实答案是什么。例如，如果这是一个数学计算问题，那么你知道计算结果，也就是最终结果。你可以看到你得到的结果是否与真实结果匹配。这就是奖励。而奖励通常是二元的。","start":4017.5,"end":4045.14},{"id":422,"text":"I guess I'm running low in time a little bit. So the reward is often just the one if matching and zero otherwise. Of course, in reality, there's a lot of variance. For example, you also have to consider whether the formatting is right. For example, whether you can extract the answer from this quickly. You cannot use another AI model to extract the answer.","zh":"我想我有点时间不够了。所以奖励通常是匹配时为1，否则为0。当然，在现实中，存在很多变化。例如，你还需要考虑格式是否正确。例如，你能否快速从这里提取答案。你不能使用另一个AI模型来提取答案。","start":4047.55,"end":4075.63}],"notes":["本段讲解了强化学习中的状态、动作和转移动态。状态包括当前输入x和之前生成的所有token，动作是下一个生成的token。转移动态是给定状态和动作后预测下一个状态，这里的状态转移是确定性的，因为下一个状态是当前状态和动作的简单拼接。","在强化学习中，奖励函数通常只在轨迹的最后应用，即只关注最终状态。奖励函数是基于整个轨迹的，例如在数学计算问题中，奖励是最终结果是否与真实结果匹配。","奖励函数通常是二元的，即匹配时奖励为1，否则为0。但实际应用中，奖励函数可能包含更多因素，如格式是否正确，是否能快速提取答案等。","在实际应用中，奖励函数的设计需要考虑多个因素，例如格式是否正确，是否能快速提取答案，而不能依赖其他AI模型进行答案提取。","本段还提到，虽然状态转移是确定性的，但控制这些动态仍然困难，因为需要在长序列中生成正确的token。","最后，讲者提到时间有限，因此奖励函数的设计需要考虑实际应用中的各种变体和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3897.66,"end":4075.63,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3897.66,"text":"previous generation. Actually, let me just try to use my notes so that I don't use the wrong symbol. So the state is both x and all the previous generation. And the action is just the next generating token. It's my action. So the action at is corresponding to the yt. And what's the transition dynamics? So recall that in MDP, give a state-given action, you need to"},{"start":3929.96,"text":"predict what is the next state. The transition dynamics is given S and A t. So you need to give both of these two to predict what's S t plus one. So the S t plus one is actually trivial because the S t plus one is just a concatenation of these two. So S t plus one is just, suppose you use this to get S t plus one. S t plus one is just literally x y one up to y t minus one and then concatenate with y t."},{"start":3959.88,"text":"So the dynamics is actually completely deterministic and trivial. But still, it's very hard to control these dynamics because you are applying actions every time. It's long sequences where you have to generate the right tokens in your sequence. Eventually, you can get the answer. And then the reward, so the reward function. So the reward function in reinforcement is applying for every."},{"start":3984.94,"text":"a state and action pair. So here, the reward function is only applied at the very, very end. So the reward is only a reward of the whole trajectory. So you just only care about the reward of the whole trajectory, which is the final state. So the whole trajectory, y1 up to, say, yn. And we give this as a reward. And the reward is really literally just whether the answer part, let's say this part is the answer. So whether answer match."},{"start":4017.5,"text":"the ground truth answer. So it requires that for this data set, you do know what the ground truth answer is. So for example, it's a mathematical calculation problem, then you know what is the resulting calculation, the final result. And you can see whether the result you get matches the result that the ground truth result is. So that is a reward. And the reward is often binary."},{"start":4047.55,"text":"I guess I'm running low in time a little bit. So the reward is often just the one if matching and zero otherwise. Of course, in reality, there's a lot of variance. For example, you also have to consider whether the formatting is right. For example, whether you can extract the answer from this quickly. You cannot use another AI model to extract the answer."}],"speech_gaps":[],"frame":"../frames/v038/024.webp","frame_time":3909.66},{"title":"模型生成与格式化","segments":[{"id":423,"text":"extract answer in a very pragmatic way.","zh":"以一种非常务实的方式提取答案。","start":4076.42,"end":4079.02},{"id":424,"text":"So actually, in reality,","zh":"实际上，在现实中，","start":4079.34,"end":4080.96},{"id":425,"text":"what happens is that you try to ask a model to","zh":"发生的事情是，你试图让模型去","start":4081.16,"end":4083.98},{"id":426,"text":"generate the answer enclosed by a tag.","zh":"生成被标签包围的答案。","start":4083.98,"end":4088.28},{"id":427,"text":"So you say, bracket answer and the answer,","zh":"所以你可以说，括号答案和答案，","start":4088.44,"end":4091.74},{"id":428,"text":"and then with this XML tags like this sink.","zh":"然后使用这样的XML标签，比如sink。","start":4091.88,"end":4096.0},{"id":429,"text":"So you say, this thing has to be within","zh":"所以你可以说，这个内容必须位于","start":4096.14,"end":4099.74},{"id":430,"text":"answer and then answer something like this.","zh":"答案和然后回答类似这样的内容。","start":4099.74,"end":4103.36},{"id":431,"text":"And then you use a parser to extract what was inside,","zh":"然后你使用解析器来提取其中的内容，","start":4103.88,"end":4107.18},{"id":432,"text":"and you match this with the ground truth answer,","zh":"并将它与真实答案进行匹配，","start":4107.52,"end":4112.24},{"id":433,"text":"and if it's matched,","zh":"如果匹配成功，","start":4112.44,"end":4113.72},{"id":434,"text":"then you have one, otherwise you have zero.","zh":"你就得到一个，否则得到零。","start":4113.88,"end":4115.28},{"id":435,"text":"But of course, these days,","zh":"当然，如今，","start":4115.7,"end":4117.04},{"id":436,"text":"I think the models are better and better,","zh":"我认为模型越来越好，","start":4117.08,"end":4118.24},{"id":437,"text":"so you can ask the model to generate","zh":"所以你可以让模型生成","start":4118.32,"end":4119.6},{"id":438,"text":"different formatting now.","zh":"不同的格式。","start":4119.6,"end":4121.72},{"id":439,"text":"But at the beginning, it's just","zh":"但在一开始，它只是","start":4122.06,"end":4123.4},{"id":440,"text":"the formatting like this, very simple way.","zh":"这种格式，非常简单的方式。","start":4123.4,"end":4125.34},{"id":441,"text":"way. Yeah.","zh":"方式。是的。","start":4125.34,"end":4130.34},{"id":442,"text":"So that's the- and then you can apply the PPO algorithm,","zh":"所以这就是——然后你可以应用PPO算法，","start":4130.72,"end":4135.58},{"id":443,"text":"you can apply the SysPo algorithm with this formulation.","zh":"你可以用这种形式应用SysPo算法。","start":4135.76,"end":4141.68},{"id":444,"text":"So eventually the algorithm if you apply all of them,","zh":"所以最终如果你应用所有这些算法，","start":4142.12,"end":4144.16},{"id":445,"text":"then you will get something like- maybe let me just,","zh":"那么你会得到类似——也许让我简单地，","start":4144.24,"end":4150.62},{"id":446,"text":"So that eventually the algorithm looks like.","zh":"所以最终算法看起来像这样。","start":4155.64,"end":4158.84},{"id":447,"text":"Well, it could be very complicated,","zh":"嗯，这可能非常复杂，","start":4168.38,"end":4170.54},{"id":448,"text":"but something like for example,","zh":"但比如像这样，","start":4170.66,"end":4175.48},{"id":449,"text":"you can have something like the RT.","zh":"你可以有像RT这样的东西。","start":4175.48,"end":4178.4},{"id":450,"text":"t in this case the rt is the ratio of the two uh the actions right so but in our case the rt","zh":"在这种情况下，RT是两个动作的比率，对吧？所以在我们的情况下，RT","start":4178.4,"end":4186.92},{"id":451,"text":"will be something like recall that the action is the next token the st is the history so the rt","zh":"会是这样的，回想一下，动作是下一个标记，st是历史，所以RT","start":4186.92,"end":4194.44},{"id":452,"text":"just becomes the pi theta y t given x and y less than t and divided by pi theta o","zh":"就变成了给定x和y小于t时，πθ(yt|x, y\u003ct)除以πθ(o yt|x, y\u003ct)，","start":4194.44,"end":4205.74},{"id":453,"text":"the pi theta y t given x and y less than t and divided by pi theta o y t given x and y less than t, something like this. So, and then you apply this with all of those advantage functions and you just plug in the same algorithm. There are a lot of other details which I think is probably, I try to mention them some of them in the lecture notes, but again, I guess some of the details are not quite.","zh":"给定x和y小于t时，πθ(yt|x, y\u003ct)除以πθ(o yt|x, y\u003ct)，类似这样的东西。然后你将这个与所有这些优势函数结合使用，并且只需将相同的算法代入。我认为还有许多其他细节，我想在讲义中提到了一些，但再次，我想有些细节可能并不完全清楚。","start":4207.32,"end":4228.97}],"notes":["本段讲解了如何通过模型生成答案并进行格式 ant things you can, how do you design this baseline? So, the baseline BST, I didn't really, I've never discussed too much about how to design a baseline. So,","zh":"明白了。所以，你可以尝试添加一些正则化项，以防止你偏离某个参考策略太多。我认为这在刚开始的时候非常有用。现在，它是否有用，我其实并不确定。所以，你还可以，设计这个基线的一个重要问题是，你怎么设计这个基线？所以，基线BST，我其实并没有太多讨论过如何设计基线。所以，","start":4231.01,"end":4257.79},{"id":455,"text":"In the old days, you actually learn a value function. You learn something that works to estimate a baseline. But a new way to do it is that you just sample, say, eight trajectories, and you take the average. So you can say, from the same question, so I mean large English model world, so you have a question, and you sample eight trajectories.","zh":"在以前，你实际上会学习一个价值函数。你学习一些东西来估计一个基线。但一种新的方法是，你只需采样，比如说，八条轨迹，然后取平均值。所以你可以这样说，从同样的问题出发，也就是说，在大英语模型的世界里，你有一个问题，然后你采样八条轨迹。","start":4260.13,"end":4284.21},{"id":456,"text":"Here, I'm using the superscript to decide different trajectories. And each of the trajectories has a different reward. So each of these structure has a reward, r1 up to r8. And then you average them. That's called r bar. You do average. And recall that this average, in some sense, is only a function of the","zh":"在这里，我用上标来决定不同的轨迹。每条轨迹都有不同的奖励。所以这些结构都有一个奖励，r1到r8。然后你取平均值。这被称为r条线。你取平均值。并回想一下，这个平均值在某种意义上，只与问题X有关，因为你是对它取平均值的。它不是关于任何特定的，而是某种意义上关于当前问题有多难的统计量。这将作为我们的基线。所以基本上会发生的是，假设你有一组奖励，然后也许我说其中一个为1，其他都为0，那么你的R条线将是1/8。所以基本上你从1中减去1/8，这就是你的调整后的奖励。而所有其他的奖励都是-1/8。但如果处于不同的情况，比如说你有5个。那么在这种情况下，我想这将被调整为7/8减去1/8。好的，我想我的，抱歉，让我。","start":4286.41,"end":4308.97},{"id":457,"text":"the question X because you average it. It's not about any specific, it's a statistic about how hard the questions are in some sense at this moment. This will be our baseline. So basically what happens is that suppose you have a bunch of like a reward and then maybe I say one of them is one and all the others are zero and your R bar will be one over eight. So basically you subtract one from","zh":"所以你会将1, 0, 0, 0, 0调整为7/8, -1/8, -1/8。但另一方面，假设你有，比如说，1, 1, 1, 1, 和 0, 0, 0, 0。你有四个1和四个0。那么它们将被调整为0.5, 0.5, 0.5, 0.5, -0.5, -0.5。这就是调整。","start":4310.36,"end":4333.62},{"id":458,"text":"So you subtract 1 over 8 from 1, and that's your adjusted reward. And all of the other ones have minus 1 over 8 as reward. But if you have a different situation, I say suppose you have 5. So basically, in this case, I guess this will be adjusted to 7 over 8 minus 1 over 8. OK, I guess my, sorry, let me.","zh":"所以你从1中减去1/8，这就是你的调整后的奖励。而其他的则都是-1/8作为奖励。但如果处于不同的情况，比如说你有5个。那么在这种情况下，我想这会调整为7/8减去1/8。好的，我的意思是，抱歉，让我再重新说一遍。","start":4334.22,"end":4355.44},{"id":459,"text":"So you will adjust the 1, 0, 0, 0, 0 to 7 over 8, minus 1 over 8, minus 1 over 8. But on the other hand, suppose you have, for example, 1, 1, 1, 1, and 0, 0, 0, 0. You have four 1s and four 0s. Then they will be adjusted to 0.5, 0.5, 0.5, 0.5, minus 0.5, minus 0.5. So that's the adjustment.","zh":"所以你会把1, 0, 0, 0, 0调整为7/8，减去1/8，再减去1/8。但另一方面，假设你有例如1, 1, 1, 1，和0, 0, 0, 0。你有四个1和四个0。那么它们会被调整为0.5, 0.5, 0.5, 0.5，再减去0.5, 0.5。这就是调整的方式。","start":4356.28,"end":4382.78},{"id":460,"text":"And there are actually other ways to adjust it even further. You can divide by standard deviation as well so that you can scale up a little bit. But maybe let's leave those for future offline reading. Okay, I guess I probably should stop. Any questions?","zh":"实际上还有其他方法可以进一步调整它。你也可以除以标准差，这样可以稍微放大一些。不过也许我们可以留到以后离线阅读。好吧，我想我大概该结束了。有问题吗？","start":4386.0,"end":4400.48}],"notes":["本段讲解了强化学习中基线设计的基本概念，包括如何通过平均多个轨迹的奖励来构建基线。讲者提到，基线的设计是强化学习中的一个重要问题，可以通过学习价值函数或直接采样轨迹来实现。","讲者指出，传统的基线设计方法是学习一个价值函数来估计基线，而现代方法则是通过采样多个轨迹并取平均值来构建基线。这种方法可以更简单地处理问题，但需要考虑如何选择轨迹数量。","在具体例子中，讲者展示了如何通过平均多个轨迹的奖励来计算基线，并进一步调整奖励值。例如，当只有一个轨迹的奖励为1，其余为0时，基线为1/8，调整后的奖励为1 - 1/8 = 7/8，其余为-1/8。","讲者还提到，可以通过除以标准差来进一步调整奖励值，以实现更精细的调整。但这种方法可能需要更多的计算资源，因此通常被留作后续的离线阅读。","最后，讲者总结了基线设计的重要性，并指出在实际应用中需要根据具体问题选择合适的方法。","讲者强调，基线设计是强化学习中的一个关键步骤，它可以帮助减少方差并提高策略的稳定性。然而，如何设计一个有效的基线仍然是一个开放性问题，需要进一步的研究。"],"formulas":[{"latex":"r_{\\text{bar}} = \\frac{1}{8}(r_1 + r_2 + \\cdots + r_8)","
