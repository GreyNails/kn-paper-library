g for large-language models for this verifiable, how do you train long COT, how do you train models to have the long reasoning capabilities with all the thinking tokens. So that's pretty much the agenda for today. So I guess let's finish up some of the discussions about reinforcement learning last week.","zh":"接下来我们将讨论如何使用强化学习来训练大型语言模型，如何训练长COT（链式推理），如何训练模型以具备所有思考标记的长推理能力。这就是今天的大致议程。所以我想我们先结束上周关于强化学习的一些讨论。","start":29.45,"end":54.76},{"id":2,"text":"Recall that we are talking about the so-called policy gradient algorithm. And we did a lot of derivations last,","zh":"请回忆一下，我们正在讨论所谓的策略梯度算法。我们在上一次","start":56.08,"end":64.01},{"id":3,"text":"in the last lecture, last week, last Wednesday. And this was the starting point we had. So we have a loss function or reward function, which is the total return. You have some discount factor, which is not that important. You sum up the return at all times that t. And then you take expectation over the trajectories and where the actions are sampled from the policy theta. And recall that the challenge here is that","zh":"在上一次讲座，上周，上周三。这是我们当时所处的起点。所以我们有一个损失函数或奖励函数，也就是总回报。你有一个折扣因子，这并不那么重要。你将所有时间t的回报相加，然后你对轨迹和从策略θ中采样的动作取期望。请回忆一下，这里的挑战是，","start":65.52,"end":91.36},{"id":4,"text":"this thing inside expectation, there's no dependency on theta whatsoever. So, the dependency on theta on the parameter theta is in the sampling probabilities you are sampling the actions from. So, the dependencies is in a weird space so that you cannot just swap the gradient with the expectation because then you know all of these dependencies. If you just take a gradient operator and you swap the expectation with the gradient, this whole thing doesn't have any gradient with respect to theta. So, that's why.","zh":"这个期望内部的东西与θ没有任何依赖关系。因此，θ的依赖关系在于你从策略θ中采样动作的采样概率。因此，依赖关系存在于一个奇怪的空间中，使得你不能直接将梯度与期望交换，因为这样你就知道所有的依赖关系。如果你直接应用梯度算子并交换期望与梯度，那么整个东西对θ就没有梯度。这就是为什么。","start":92.08,"end":120.26},{"id":5,"text":"we have to use the so-called policy gradient estimator to estimate the gradient in a different way. And we did a lot of derivation, and we found out that the gradient of the return is equal to this thing, which is so basically the key term here is that you have the reward, which is that this is the same as the total reward. And this is the probability of the whole trajectory. You see, right?","zh":"我们必须使用所谓的策略梯度估计器以不同的方式估计梯度。我们进行了大量的推导，并发现回报的梯度等于这个东西，其中关键项是奖励，也就是这与总奖励相同。这是整个轨迹的概率。你明白吧？","start":120.89,"end":145.15},{"id":6,"text":"actually the conditional probability of the actions of the whole trajectory. So basically, you take the sum. Oh, my bad. This is gradient of the log. So maybe if you, whether you put a gradient here or here, it doesn't really matter. So the sum of the log here is the log probability of the whole trajectory. And you take the gradient with respect to theta.","zh":"实际上这是整个轨迹动作的条件概率。所以基本上，你取总和。哦，我的错。这是对数的梯度。所以也许无论你在这里还是那里放置梯度，其实并不重要。所以这里的对数总和就是整个轨迹的对数概率。然后你对theta取梯度。","start":146.61,"end":167.9}],"notes":["本段介绍了课程的议程，包括继续讨论强化学习中的策略梯度算法，并引入PPO算法，该算法是策略梯度的一种扩展，广泛用于训练大型语言模型。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":167.9,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.26,"text":"Okay, so the last lecture of this quarter, we're going to continue to talk a little bit about reinforcement learning, finishing up some of the discussions about the policy gradient. And then we're going to introduce a new algorithm called PPO, which is extension of the policy gradient, which is one of the most popular algorithm people are using for training large language models."},{"start":29.45,"text":"Then we'll move on to how to train, use reinforcement learning for large-language models for this verifiable, how do you train long COT, how do you train models to have the long reasoning capabilities with all the thinking tokens. So that's pretty much the agenda for today. So I guess let's finish up some of the discussions about reinforcement learning last week."},{"start":56.08,"text":"recall that we are talking about the so-called policy gradient algorithm. And we did a lot of derivations last,"},{"start":65.52,"text":"in the last lecture, last week, last Wednesday. And this was the starting point we had. So we have a loss function or reward function, which is the total return. You have some discount factor, which is not that important. You sum up the return at all times that t. And then you take expectation over the trajectories and where the actions are sampled from the policy theta. And recall that the challenge here is that"},{"start":92.08,"text":"this thing inside expectation, there's no dependency on Theta whatsoever. So, the dependency on Theta on the parameter Theta is in the sampling probabilities you are sampling the actions from. So, the dependencies is in a weird space so that you cannot just swap the gradient with the expectation because then you know all of these dependencies. If you just take a gradient operator and you swap the expectation with the gradient, this whole thing doesn't have any gradient with respect to Theta. So, that's why."},{"start":120.89,"text":"we have to use the so-called policy gradient estimator to estimate the gradient in a different way. And we did a lot of derivation, and we found out that the gradient of the return is equal to this thing, which is so basically the key term here is that you have the reward, which is that this is the same as the total reward. And this is the probability of the whole trajectory. You see, right?"},{"start":146.61,"text":"actually the conditional probability of the actions of the whole trajectory. So basically, you take the sum. Oh, my bad. This is gradient of the log. So maybe if you, whether you put a gradient here or here, it doesn't really matter. So the sum of the log here is the log probability of the whole trajectory. And you take the gradient with respect to theta."}],"speech_gaps":[],"frame":"../frames/v038/001.webp","frame_time":17.259999999999998},{"title":"策略梯度与期望梯度的性质","segments":[{"id":7,"text":"So last time, we didn't have a lot of discussions about how to intuitively understand this. Last time, we derived this from the equations. But if you just stare at this equation, it actually makes some sense, right? Basically, what it's saying is that you are always maximizing the return, which means that you are maximizing the log probability of the actions you sampled. But you maximize it with different weighting. So if the reward is high,","zh":"所以上次，我们并没有太多讨论如何直观地理解这一点。上次，我们是从方程中推导出这个结果的。但如果你仔细看一下这个方程，它实际上是有一定道理的，对吧？基本上，它所表达的意思是，你始终在最大化回报，这意味着你在最大化你采样动作的对数概率。但你用不同的权重来进行最大化。因此，如果奖励较高，","start":169.06,"end":193.8},{"id":8,"text":"you're going to have a higher weighting for","zh":"你就会对","start":194.49,"end":196.01},{"id":9,"text":"the log likelihood of this trajectory.","zh":"这条轨迹的对数似然赋予更高的权重。","start":196.01,"end":197.91},{"id":10,"text":"If the reward is low,","zh":"如果奖励较低，","start":198.51,"end":201.13},{"id":11,"text":"let's say the reward is zero,","zh":"比如说奖励为零，","start":201.21,"end":201.99},{"id":12,"text":"then your weighting is zero.","zh":"那么你的权重就是零。","start":202.19,"end":203.71},{"id":13,"text":"So basically, you are not maximizing","zh":"所以基本上，你不会对","start":203.91,"end":205.75},{"id":14,"text":"the log likelihood of those trajectories with reward zero.","zh":"那些奖励为零的轨迹的对数似然进行最大化。","start":205.75,"end":209.97},{"id":15,"text":"So basically, this is the weighting term that controls","zh":"所以基本上，这就是一个权重项，它控制","start":211.13,"end":213.63},{"id":16,"text":"how much you maximize the likelihood of each of the trajectory.","zh":"你对每条轨迹的似然最大化程度。","start":213.63,"end":216.89},{"id":17,"text":"If it's a good trajectory, you have more weights,","zh":"如果是一条好的轨迹，你会有更多的权重，","start":217.69,"end":219.75},{"id":18,"text":"otherwise you have lower weights.","zh":"否则你会有更小的权重。","start":219.87,"end":221.01},{"id":19,"text":"So, that's essentially what a policy gradient is trying to do.","zh":"因此，这就是策略梯度试图做的事情。","start":221.01,"end":224.37},{"id":20,"text":"And now, let's spend a little effort to simplify this even further,","zh":"现在，让我们花一点时间进一步简化这个概念，","start":225.71,"end":231.23},{"id":21,"text":"because actually this is still somewhat unnecessary complicated.","zh":"因为实际上这仍然有些复杂。","start":231.51,"end":236.31},{"id":22,"text":"We already simplified quite a bit and we can still simplify more.","zh":"我们已经简化了很多，还可以进一步简化。","start":236.69,"end":239.37},{"id":23,"text":"So, one of the key thing that you use to simplify is that actually,","zh":"因此，你用来简化的一个关键点是，实际上，","start":240.09,"end":245.65},{"id":24,"text":"oh, this doesn't work again.","zh":"哦，这又不奏效了。","start":247.83,"end":249.05},{"id":25,"text":"So what happens is that there's a very important quantity","zh":"所以会发生的是，有一个非常重要的量","start":249.05,"end":253.79},{"id":26,"text":"that we should realize, which is that if you sample an action","zh":"我们应当意识到，即如果你从这个πθ，从这个策略中","start":253.79,"end":257.49},{"id":27,"text":"a t from this pi theta, from this policy,","zh":"采样一个动作a_t，","start":257.49,"end":264.33},{"id":28,"text":"and you look at the expectation of the gradient","zh":"并查看梯度的期望","start":265.53,"end":267.79},{"id":29,"text":"of the log of the probability, so a t is a random variable.","zh":"的对数概率，所以a_t是一个随机变量。","start":267.79,"end":275.09},{"id":30,"text":"You sample it from this policy.","zh":"你从这个策略中对其进行采样。","start":275.25,"end":276.69},{"id":31,"text":"And then you look at a log probability","zh":"然后你观察在相同策略下的对数概率","start":276.99,"end":278.57},{"id":32,"text":"under the same policy, and you take the gradient.","zh":"并对其取梯度。","start":278.57,"end":281.09},{"id":33,"text":"So this is a numerical number, and you","zh":"所以这是一个数值，你","start":281.61,"end":284.61},{"id":34,"text":"take the gradient of this function with respect to a,","zh":"对这个函数关于a取梯度，","start":284.61,"end":286.91},{"id":35,"text":"with respect to theta, and you take the expectation,","zh":"关于theta取梯度，并取期望，","start":287.51,"end":291.37},{"id":36,"text":"this is 0.","zh":"这个结果是0。","start":291.65,"end":292.25},{"id":37,"text":"So basically, it's saying that, in some sense,","zh":"基本上，它是在说，从某种意义上讲，","start":293.91,"end":296.95},{"id":38,"text":"it's kind of like the gradient of like a u.","zh":"它类似于u的梯度。","start":297.05,"end":300.03},{"id":39,"text":"So in some sense, the abstract way to think about this","zh":"从某种意义上说，抽象地思考这个问题的方法是","start":302.59,"end":306.15},{"id":40,"text":"is that if you have a random variable x,","zh":"如果你有一个随机变量x，","start":306.15,"end":307.63},{"id":41,"text":"is sample from some distribution p theta, let's say,","zh":"是从某个分布p_θ中采样的，比如说，","start":307.63,"end":310.97},{"id":42,"text":"then the expectation of the log probability","zh":"那么这个随机变量的对数概率的期望","start":311.79,"end":314.81},{"id":43,"text":"of this","zh":"是","start":316.33,"end":317.05},{"id":44,"text":"is always zero.","zh":"始终为零。","start":318.97,"end":320.25},{"id":45,"text":"And the reason is actually very simple.","zh":"而原因其实非常简单。","start":321.93,"end":323.59},{"id":46,"text":"The reason is that if you just,","zh":"原因是你只要，","start":323.77,"end":325.21},{"id":47,"text":"this is kind of a claim.","zh":"这基本上是一个主张。","start":325.87,"end":327.55},{"id":48,"text":"And the reason is very simple.","zh":"而原因非常简单。","start":329.25,"end":330.73},{"id":49,"text":"You just expand this.","zh":"你只需展开这个表达式。","start":330.83,"end":332.67},{"id":50,"text":"You can expand this by writing it as integration.","zh":"你可以通过将其写成积分来展开这个表达式。","start":332.83,"end":336.21},{"id":51,"text":"So, expectation of x is p theta x, right?","zh":"因此，x的期望是pθx，对吧？","start":336.21,"end":339.21},{"id":52,"text":"So, this is what expectation becomes.","zh":"因此，期望就变成了这样。","start":339.77,"end":341.53},{"id":53,"text":"And then the gradient of log,","zh":"然后是对数的梯度，","start":341.89,"end":343.11},{"id":54,"text":"maybe let's just write it down first, and dx.","zh":"也许我们先写下它，以及dx。","start":343.39,"end":347.31}],"notes":["本段讨论了策略梯度方法中如何通过加权方式最大化轨迹的对数似然。讲者指出，当奖励较高时，轨迹的权重会更高，从而更倾向于最大化其对数似然；而当奖励较 ss before time t."},{"start":672.4,"text":"You can look at the randomness of S zero,"},{"start":675.4,"text":"A zero up to S t minus one,"}],"speech_gaps":[],"frame":"../frames/v038/004.webp","frame_time":513.06},{"title":"期望与条件期望的处理","segments":[{"id":77,"text":"A t minus one, and S t.","zh":"A t 减一，和 S t。","start":678.7,"end":682.88},{"id":78,"text":"So you look at all of these random variables,","zh":"所以你观察所有这些随机变量，","start":683.0,"end":684.38},{"id":79,"text":"and then you condition on","zh":"然后你对","start":685.06,"end":686.84},{"id":80,"text":"on these random variables and do another expectation over 80.","zh":"这些随机变量进行条件期望，并在 80 上做另一个期望。","start":686.84,"end":688.98},{"id":81,"text":"So the next thing is going to be over 80,","zh":"接下来的内容将是在 80 上进行的，","start":689.4,"end":691.9},{"id":82,"text":"the randomness is going to be over 80,","zh":"随机性将在 80 上进行，","start":692.1,"end":693.38},{"id":83,"text":"and you have gradient log Pi 80","zh":"你有梯度 log Pi 80","start":693.58,"end":697.32},{"id":84,"text":"given St and then times this thing.","zh":"给定 S t，然后乘以这个东西。","start":697.32,"end":703.38},{"id":85,"text":"Yeah. Then in the inner expectation,","zh":"是的。然后在内部期望中，","start":720.46,"end":723.26},{"id":86,"text":"you have all the condition on S zero up to S zero, A zero.","zh":"你有所有关于 S 零到 S 零、A 零的条件。","start":723.5,"end":732.34},{"id":87,"text":"So you have this next expectation.","zh":"因此你有这个接下来的期望。","start":741.6,"end":743.7},{"id":88,"text":"This is a law of total expectation.","zh":"这是全期望定律。","start":743.98,"end":745.24},{"id":89,"text":"expectation.","zh":"期望。","start":745.24,"end":745.48},{"id":90,"text":"You are fixing these random variables.","zh":"你是在固定这些随机变量。","start":746.12,"end":748.46},{"id":91,"text":"You are looking at the conditional expectation only","zh":"你只关注关于 80 的随机性","start":748.56,"end":751.26},{"id":92,"text":"over the randomness of 80, and then you","zh":"关于80的随机性，然后你","start":751.26,"end":753.04},{"id":93,"text":"take expectation over the things that happens in the past.","zh":"对过去发生的事情取期望。","start":753.04,"end":756.44},{"id":94,"text":"And this is just law of total expectation.","zh":"这其实就是全期望定律。","start":758.04,"end":759.8},{"id":95,"text":"And what happens here is that if you look at this,","zh":"这里发生的情况是，如果你看一下这个，","start":761.42,"end":765.56},{"id":96,"text":"then this part, after you condition all the history,","zh":"在你对所有历史进行条件化之后，","start":765.6,"end":768.14},{"id":97,"text":"this is a constant.","zh":"这一部分是一个常数。","start":768.34,"end":769.1},{"id":98,"text":"You can move it outside of the expectation.","zh":"你可以把它移出期望运算之外。","start":769.34,"end":771.12},{"id":99,"text":"So this inner expectation is the same as you treat this as a constant, because it's indeed a constant after you're conditioning all those things. So conditional s0 up to st times a constant here. And now here, because of the Markov property, so this term is here.","zh":"因此，这个内部的期望等同于将它视为一个常数，因为你在对所有这些事情进行条件化之后，它确实是一个常数。因此，这里就是条件 s0 到 st 乘以一个常数。现在，由于马尔可夫性质，这个项在这里。","start":772.72,"end":804.32},{"id":100,"text":"so that I don't have to copy it. Because of the Markov property, conditional S0 versus conditional on the whole history is the same as conditional on only ST. So this is the same as conditional ST. So you are only looking at the randomness of AT. And that is 0, as we have discussed. Because if A is from ST, and you take the gradient of the log of the pi, then it's 0. So that's why this is 0.","zh":"所以我不需要复制它。由于马尔可夫性质，对 S0 的条件化与对整个历史的条件化等同于仅对 ST 的条件化。因此，这等同于对 ST 的条件化。你现在只关注 AT 的随机性。而这一点我们已经讨论过，它是 0。因为如果 A 是从 ST 得到的，并且你对 log π 的梯度进行取值，那么它就是 0。这就是为什么这里是 0。","start":805.16,"end":839.74}],"notes":["本段讲解了期望和条件期望的处理方法，特别是在处理随机变量时，通过条件期望将随机性限制在特定变量上。讲者提到，当条件变量确定后，某些部分可以视为常数，从而可以移出期望运算。","讲者强调了全期望定律（Law of Total Expectation）的应用，即在处理随机变量时，可以将期望分解为对条件变量的期望和对剩余变量的期望。这种分解有助于简化计算。","在处理马尔可夫性质时，讲者指出，当条件变量仅依赖于当前状态时，可以忽略历史信息，从而简化计算。这种性质在处理时间序列数据时非常有用。","讲者还提到，当对某个变量求梯度时，如果该变量与目标函数无关，则梯度为零。这在优化问题中是一个重要的结论。","讲者通过具体的例子说明了如何将条件期望应用于实际问题，特别是在处理随机变量的梯度时，如何利用条件期望和马尔可夫性质进行简化。","本段内容涉及概率论和统计学中的基本概念，如条件期望、全期望定律和马尔可夫性质，这些是处理随机变量和优化问题的基础工具。"],"formulas":[],"uncertainties":["80","83","86"],"diagram":"none","start":678.7,"end":839.74,"asr_flags":[89],"math_clarifications":["原文中提到的'80'未明确表示随机变量，且未正确使用数学符号表示期望，因此无法核定其数学含义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":678.7,"text":"A t minus one, and S t."},{"start":683.0,"text":"So you look at all of these random variables,"},{"start":685.06,"text":"and then you condition on"},{"start":686.84,"text":"on these random variables and do another expectation over 80."},{"start":689.4,"text":"So the next thing is going to be over 80,"},{"start":692.1,"text":"the randomness is going to be over 80,"},{"start":693.58,"text":"and you have gradient log Pi 80"},{"start":697.32,"text":"given St and then times this thing."},{"start":720.46,"text":"Yeah. Then in the inner expectation,"},{"start":723.5,"text":"you have all the condition on S zero up to S zero, A zero."},{"start":741.6,"text":"So you have this next expectation."},{"start":743.98,"text":"This is a law of total expectation."},{"start":745.24,"text":"expectation."},{"start":746.12,"text":"In some sense, you are fixing these random variables."},{"start":748.56,"text":"You are looking at the conditional expectation only"},{"start":751.26,"text":"over the randomness of 80, and then you"},{"start":753.04,"text":"take expectation over the things that happens in the past."},{"start":758.04,"text":"And this is just law of total expectation."},{"start":761.42,"text":"And what happens here is that if you look at this,"},{"start":765.6,"text":"then this part, after you condition all the history,"},{"start":768.34,"text":"this is a constant."},{"start":769.34,"text":"You can move it outside of the expectation."},{"start":772.72,"text":"So this inner expectation is the same as you treat this as a constant, because it's indeed a constant after you're conditioning all those things. So conditional s0 up to st times a constant here. And now here, because of the Markov property, so this term is here."},{"start":805.16,"text":"so that I don't have to copy it. Because of the Markov property, conditional S0 versus conditional on the whole history is the same as conditional on only ST. So this is the same as conditional ST. So you are only looking at the randomness of AT. And that is 0, as we have discussed. Because if A is from ST, and you take the gradient of the log of the pi, then it's 0. So that's why this is 0."}],"speech_gaps":[],"frame":"../frames/v038/005.webp","frame_time":690.7},{"title":"期望与梯度计算中的常数项处理","segments":[{"id":101,"text":"And there's a constant here, which is going to be multiplied here and here. But you multiply 0 with a constant, it's still 0. So what's inside this expectation is just literally 0. And then you take expectation of 0, it's still 0. So the whole thing will just evaluate to 0 eventually. Does this make sense? So in some sense, intuitively saying that the weighting here is really just a constant because","zh":"这里有一个常数项，它将在这里和这里相乘。但是你用0乘以一个常数，结果仍然是0。因此，这个期望值内部实际上就是字面上的0。然后你对0取期望，结果仍然是0。所以整个表达式最终将评估为0。这有意义吗？所以从某种意义上说，直观地说，这里的权重实际上只是一个常数，因为","start":841.19,"end":869.77},{"id":102,"text":"Because it's about the past. The past reward, there's nothing you can change. You should only weight your probability based on the reward you can change. Whatever you cannot change shouldn't affect your decision. So that's why eventually this gradient of the... So with all of this calculation, you can write this as the expectation of...","zh":"因为它涉及的是过去。过去的奖励，你无法改变。你应该只根据可以改变的奖励来加权你的概率。你无法改变的任何东西都不应该影响你的决策。这就是为什么最终这个梯度的... 通过所有这些计算，你可以将它写成期望值的...","start":870.86,"end":901.1},{"id":103,"text":"times the component that is here, which is not canceled out. And let's call this R larger than T. Often people call this reward to go. This is the reward in the future that you can affect. And the definition is just that term. It's all the future steps, the reward in the future steps. So basically, you weight the log likelihood based on what is the chance.","zh":"乘以这里没有被抵消的部分。让我们称这个为R大于T。人们通常称这个为奖励到未来。这是你可以在未来影响的奖励。定义就是这个术语。它包括所有未来步骤的奖励。因此，基本上，你根据什么可能性来加权对数似然。","start":910.14,"end":948.42},{"id":104,"text":"What is the reward for the future steps? Any questions so far? Okay. So, and now we're going to use this trick again to have, to make it a little bit more complicated, but actually it's useful. So, we realize that you can, I think the whole calculation here, the gist is that, you know, you can add any constant here that is not a function of A t, right? So, basically the gist here is that, you know, like I already said in some sense, right? So, expectation of,","zh":"未来步骤的奖励是什么？到目前为止有任何问题吗？好的。现在，我们将再次使用这个技巧，使它变得更复杂一些，但实际上它是有用的。我们意识到，你可以在这里添加任何不依赖于A_t的常数，对吧？因此，这里的要点是，你知道，你可以添加任何不依赖于A_t的常数。基本上，这里的要点是，你知道，就像我之前说的那样，对吧？因此，期望值为,","start":949.02,"end":982.29},{"id":105,"text":"So basically, you can add anything here which is not a function of at. Suppose it's only a function of st, it's OK. If you get any constant that only depends on st but not anything after t, then it's OK. So basically, it means that even you add another term here, as long as it's a, let's say, suppose you add another term. Let's say you subtract some term. Adding and subtracting is the same thing. That is only a function.","zh":"因此，你可以在这里添加任何不依赖于a_t的内容。假设它只依赖于s_t，也是可以的。如果你得到任何只依赖于s_t但不依赖于t之后任何内容的常数，那也是可以的。因此，这意味着即使你在这里添加另一个项，只要它是，比如说，假设你添加另一个项。比如说，你减去某个项。添加和减去是同一件事。它只依赖于一个函数。","start":983.21,"end":1015.43}],"notes":["本段讨论了在期望计算中，常数项与零的乘积仍为零，因此整个表达式的结果为零。这说明在某些情况下，权重可能只是常数，不会对结果产生影响。","讲者提到过去奖励无法改变，因此应仅基于可改变的奖励来加权概率。不可改变的部分不应影响决策，这与梯度计算中的处理方式相关。","未来奖励（reward to go）被定义为所有未来步骤的奖励总和，用于加权对数似然。这表明在计算中，未来奖励是影响决策的重要因素。","讲者强调可以添加任何不依赖于当前动作（A_t）的常数项，这在计算中是允许的，因为这些项不会影响最终的期望结果。","讲者进一步说明，只要添加的项不依赖于当前状态（s_t）之后的变量，就可以安全地添加或减去这些项，这在数学推导中是常见的技巧。","这些讨论展示了如何在期望和梯度计算中处理常数项和可变项，以及如何通过调整项来简化或优化计算过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":841.19,"end":1015.43,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":841.19,"text":"And there's a constant here, which is going to be multiplied here and here. But you multiply 0 with a constant, it's still 0. So what's inside this expectation is just literally 0. And then you take expectation of 0, it's still 0. So the whole thing will just evaluate to 0 eventually. Does this make sense? So in some sense, intuitively saying that the weighting here is really just a constant because"},{"start":870.86,"text":"Because it's about the past. The past reward, there's nothing you can change. You should only weight your probability based on the reward you can change. Whatever you cannot change shouldn't affect your decision. So that's why eventually this gradient of the... So with all of this calculation, you can write this as the expectation of..."},{"start":910.14,"text":"times the component that is here, which is not canceled out. And let's call this R larger than T. Often people call this reward to go. This is the reward in the future that you can affect. And the definition is just that term. It's all the future steps, the reward in the future steps. So basically, you weight the log likelihood based on what is the chance."},{"start":949.02,"text":"What is the reward for the future steps? Any questions so far? Okay. So, and now we're going to use this trick again to have, to make it a little bit more complicated, but actually it's useful. So, we realize that you can, I think the whole calculation here, the gist is that, you know, you can add any constant here that is not a function of A t, right? So, basically the gist here is that, you know, like I already said in some sense, right? So, expectation of,"},{"start":983.21,"text":"So basically, you can add anything here which is not a function of at. Suppose it's only a function of st, it's OK. If you get any constant that only depends on st but not anything after t, then it's OK. So basically, it means that even you add another term here, as long as it's a, let's say, suppose you add another term. Let's say you subtract some term. Adding and subtracting is the same thing. That is only a function."}],"speech_gaps":[],"frame":"../frames/v038/006.webp","frame_time":853.19},{"title":"基线与奖励调整","segments":[{"id":106,"text":"If it's not a function of any future states or actions, then it's still equal to zero because this is a constant in this calculation. This is often called baseline.","zh":"如果它不依赖于任何未来的状态或动作，那么它仍然等于零，因为在这个计算中它是常数。这通常被称为基线。","start":1016.11,"end":1031.33},{"id":107,"text":"The reason to introduce this is to reduce the variance in estimating the R's. So basically, whether you have this term or not this term, the expectations are the same. But empirically, you cannot never estimate expectation exactly. You have to sample some trajectories.","zh":"引入这个概念的原因是为了减少估计R值时的方差。基本上，无论你是否有这个项，期望值是相同的。但实际中，你永远无法精确地估计期望值。你必须采样一些轨迹。","start":1032.26,"end":1059.3},{"id":108,"text":"So the lowest reward is 10 and the highest reward is 11.","zh":"所以最低的奖励是10，最高的奖励是11。","start":1060.16,"end":1062.92},{"id":109,"text":"will be always between 10 and 11.","zh":"将会始终在10和11之间。","start":1063.56,"end":1066.56},{"id":110,"text":"will be always between 10 and 11.","zh":"将会始终在10和11之间。","start":1066.56,"end":1068.16},{"id":111,"text":"But if you subtract something to make it into the range between 0","zh":"但如果你减去某个值，使其落在0到1的范围内，这在某种意义上可以减小方差。","start":1068.64,"end":1072.94},{"id":112,"text":"and 1, it's like making the variance smaller in some sense.","zh":"例如，如果奖励始终在10和11之间，","start":1072.94,"end":1075.68},{"id":113,"text":"For example, if the reward is always between 10 and 11,","zh":"例如，如果奖励始终在10和11之间，","start":1076.18,"end":1078.2},{"id":114,"text":"then you should subtract probably 10.5,","zh":"那么你应该减去大概10.5，","start":1078.34,"end":1080.5},{"id":115,"text":"so that the adjusted reward in some sense","zh":"这样调整后的奖励在某种意义上","start":1080.66,"end":1083.66},{"id":116,"text":"is between minus 0.5 and 0.5, something like that.","zh":"会在-0.5到0.5之间，类似这样的范围。","start":1085.54,"end":1088.4},{"id":117,"text":"So, and actually, in reality, these days, people do adjust it, something like this.","zh":"实际上，现在人们确实会这样调整它，类似这样的做法。","start":1090.26,"end":1094.72},{"id":118,"text":"You try to estimate the average reward to go, in some sense, and you subtract that,","zh":"你试图估计平均奖励，以某种意义来说，然后减去这个值，","start":1094.82,"end":1100.02},{"id":119,"text":"so that you can have a more, kind of, like, balanced reward.","zh":"这样你可以得到一个更平衡的奖励。","start":1100.1,"end":1103.9},{"id":120,"text":"So, in some sense, it's just, you know, the exact reason is not, kind of, like, you know,","zh":"某种意义上说，这只是一个道理，你知道的，确切的原因并不是，你知道的，","start":1108.62,"end":1114.5},{"id":121,"text":"there's no guarantees that you, you know, it depends on how you subtract.","zh":"没有保证你会这样做，你知道的，这取决于你如何减去。","start":1114.5,"end":1117.64},{"id":122,"text":"subtract. Yeah. The reason is just that,","zh":"减去。是的。原因只是因为，","start":1117.64,"end":1123.18},{"id":123,"text":"You always find something that can subtract it.","zh":"你总是能找到某样东西来减去它。","start":1124.78,"end":1128.02},{"id":124,"text":"Because in some sense, the thing is you want to","zh":"因为在某种意义上，你要做的是","start":1128.32,"end":1132.56},{"id":125,"text":"correlate this with this in some sense.","zh":"以某种方式将这个与这个相关联。","start":1136.48,"end":1138.74},{"id":126,"text":"correlate this with this in some sense.","zh":"以某种方式将这个与这个相关联。","start":1138.74,"end":1140.5},{"id":127,"text":"So how do I explain intuitive term?","zh":"那么我如何解释这个直观的术语？","start":1140.5,"end":1147.76},{"id":128,"text":"This is like the classical control variant kind of stuff.","zh":"这类似于经典的控制变体之类的内容。","start":1148.8,"end":1152.2},{"id":129,"text":"Like you have a random variable,","zh":"比如你有一个随机变量，","start":1152.34,"end":1153.18},{"id":130,"text":"you want to reduce the variance,","zh":"你想要减少方差，","start":1153.32,"end":1154.22},{"id":131,"text":"you find something that correlates with it,","zh":"你找到一个与之相关的量，","start":1154.32,"end":1155.68},{"id":132,"text":"but it has a mean zero,","zh":"但它具有零均值，","start":1155.76,"end":1156.84},{"id":133,"text":"and then you can subtract it.","zh":"然后你可以将其减去。","start":1157.02,"end":1158.06},{"id":134,"text":"So basically, eventually this and this will be correlated,","zh":"所以基本上，最终这个和这个会是相关的，","start":1158.34,"end":1160.9},{"id":135,"text":"but this one correlated in a sense that","zh":"但这个相关性是指","start":1161.08,"end":1164.58},{"id":136,"text":"if you consider all the randomness they are correlated,","zh":"如果你考虑所有随机性，它们是相关的，","start":1164.58,"end":1166.36},{"id":137,"text":"and then you subtract that part,","zh":"然后你减去这部分。","start":1166.5,"end":1168.4},{"id":138,"text":"part and then you can make the virus smaller.","zh":"部分处理完后，你可以使病毒变小。","start":1168.4,"end":1170.28},{"id":139,"text":"Does that answer the question?","zh":"这回答了问题吗？","start":1171.08,"end":1172.78},{"id":140,"text":"Maybe.","zh":"也许。","start":1172.94,"end":1173.14},{"id":141,"text":"Yes. If you just only subtract 10.5, no.","zh":"是的。如果你只是减去10.5，那就不是。","start":1183.11,"end":1185.57},{"id":142,"text":"Yes. But the thing is the following.","zh":"是的。但问题是以下这个。","start":1185.71,"end":1187.73},{"id":143,"text":"So maybe that, okay, yes, I think you are right.","zh":"所以也许那样，好吧，是的，我认为你是对的。","start":1187.89,"end":1189.57},{"id":144,"text":"So my example is a bit too over-simplistic.","zh":"所以我的例子有点过于简化了。","start":1189.67,"end":1192.51},{"id":145,"text":"So if you just subtract your constant,","zh":"所以如果你只是减去你的常数，","start":1192.67,"end":1194.19},{"id":146,"text":"it doesn't help anything.","zh":"这没有任何帮助。","start":1194.29,"end":1194.97}],"notes":["本段讲解了在强化学习中引入基线（baseline）的概念，其目的是为了减少奖励估计的方差。基线是一个与未来状态或动作无关的常数，因此在计算中保持为零。虽然期望值在有无基线的情况下相同，但实际中由于无法精确估计期望值，必须通过采样轨迹来估计。基线的引入可以使得奖励的范围缩小，从而降低方差。"],"formulas":[],"uncertainties":["virus"],"diagram":"none","start":1016.11,"end":1194.97,"asr_flags":[],"translation_complete":true,"tran , yes.","zh":"这个的期望就是你的，对吧。","start":1259.67,"end":1260.75},{"id":168,"text":"Right, that means that the expectation is like,","zh":"对，这意味着期望就像，","start":1260.95,"end":1263.99},{"id":169,"text":"you just took out the expectation for that first part","zh":"你把第一部分的期望取出来","start":1264.11,"end":1266.93},{"id":170,"text":"and then multiplied it into the second part.","zh":"然后乘到第二部分上。","start":1266.93,"end":1269.21},{"id":171,"text":"So like, E of expectation.","zh":"所以，期望的期望。","start":1269.39,"end":1270.85},{"id":172,"text":"No, I'm not, okay, yes, that's a good point.","zh":"不，我不是，好的，这是个好问题。","start":1271.17,"end":1273.29},{"id":173,"text":"So I'm not, so here I'm not using the fact","zh":"所以，我并不是在这里使用这个事实","start":1273.47,"end":1275.99},{"id":174,"text":"that this expectation of A times B","zh":"即 A 乘以 B 的期望","start":1275.99,"end":1277.79},{"id":175,"text":"is equal to the expectation of A times the expectation of B.","zh":"等于 A 的期望乘以 B 的期望。","start":1277.79,"end":1279.73},{"id":176,"text":"That's not true, actually.","zh":"实际上，这并不成立。","start":1279.85,"end":1280.75},{"id":177,"text":"Yeah, yeah, yeah.","zh":"是的，是的，是的。","start":1281.01,"end":1281.29},{"id":178,"text":"So I'm not saying that this is the case.","zh":"所以，我并不是在说这种情况成立。","start":1281.43,"end":1284.97},{"id":179,"text":"So this is not what I'm doing.","zh":"所以这并不是我所做的。","start":1288.09,"end":1289.35},{"id":180,"text":"What I'm doing is, in my case, b is a constant.","zh":"我所做的情况是，在我的案例中，b 是一个常数。","start":1289.35,"end":1293.19},{"id":181,"text":"So b is literally a constant, because I've already","zh":"所以 b 实际上是一个常数，因为我已经","start":1294.91,"end":1299.55},{"id":182,"text":"conditioned everything in the past.","zh":"在之前对所有内容进行了条件处理。","start":1299.55,"end":1301.79},{"id":183,"text":"So this b term is really just a constant.","zh":"所以这个 b 项实际上只是一个常数。","start":1302.01,"end":1303.87},{"id":184,"text":"So that's why I can take it out.","zh":"所以这就是为什么我可以把它提出来的原因。","start":1304.97,"end":1306.31},{"id":185,"text":"Yeah. So I think actually regarding your question,","zh":"对的。所以我想实际上针对你的问题，","start":1333.79,"end":1335.81},{"id":186,"text":"I think I had a heuristic example in my lecture notes.","zh":"我想我在讲义笔记中有一个启发式的例子。","start":1335.91,"end":1339.35},{"id":187,"text":"I'm trying to see whether that's a good,","zh":"我试着看看这是否是一个好的方法，","start":1339.65,"end":1341.21},{"id":188,"text":"I think that's similar to this.","zh":"我认为这和这个类似。","start":1342.35,"end":1343.89},{"id":189,"text":"So basically, maybe one way to think about is that,","zh":"所以基本上，也许一种思考方式是，","start":1344.19,"end":1348.25},{"id":190,"text":"that suppose you have one trajectory,","zh":"假设你有一个轨迹，","start":1348.25,"end":1349.17},{"id":191,"text":"you have one state as t,","zh":"你有一个状态为 t，","start":1349.65,"end":1351.23},{"id":192,"text":"and the different actions will give you","zh":"不同的动作会给你","start":1351.39,"end":1353.31},{"id":193,"text":"reward either 10 or 11.","zh":"奖励要么是 10 要么是 11。","start":1353.31,"end":1357.07},{"id":194,"text":"So, in some sense, if you only use the reward,","zh":"所以，从某种意义上说，如果你只使用奖励，","start":1358.17,"end":1360.83},{"id":195,"text":"actually it's kind of interesting.","zh":"实际上，这有点有趣。","start":1361.07,"end":1362.01},{"id":196,"text":"So, suppose this action is giving you reward 10,","zh":"所以，假设这个动作给你奖励10，","start":1362.31,"end":1367.47},{"id":197,"text":"this action giving you reward 11, and 10 is the minimum.","zh":"这个动作给你奖励11，而10是最小值。","start":1367.49,"end":1369.97},{"id":198,"text":"So, actually sometimes you should penalize","zh":"所以，实际上有时候你应该惩罚","start":1370.19,"end":1371.73},{"id":199,"text":"the one with reward 10.","zh":"奖励为10的那个。","start":1371.73,"end":1373.79}],"notes":["本段讨论了在处理不同范围的奖励值时，如何通过减去一个依赖于过去状态的常数来实现归一化，使得所有值处于同一尺度。这有助于在后续计算中保持数值的稳定性。","讲者提到，如果不对奖励值进行归一化处理，那么在不同轨迹中，奖励值的范围差异会导致计算上的不一致。例如，一个轨迹的奖励值可能在10到11之间，而另一个轨迹的奖励值可能在0到1之间。","讲者进一步解释了期望的线性性质，指出期望的乘积不等于乘积的期望，因此不能简单地将期望分解为两个部分的期望相乘。这在处理随机变量时是一个重要的数学性质。","讲者强调，在某些情况下，b项是一个常数，因为它已经基于过去的条件进行了处理。因此，可以将b项从期望中提取出来，简化计算。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1195.21,"end":1373.79,"asr_flags":[177],"translation_complete":true,"translated_segments":53,"raw_segments":[{"start":1195.21,"text":"But you have to subtract constant that depends on the St."},{"start":1198.15,"text":"So basically, for example, for one St,"},{"start":1200.15,"text":"your R is between 10 and 11,"},{"start":1202.59,"text":"and for the other St, your R is between 0 and 1."},{"start":1206.25,"text":"You're allowed to subtract 10.5 for"},{"start":1207.99,"text":"the first one and subtract 0.5 for the second one."},{"start":1210.53,"text":"one. So that's why everything is going on the same scale."},{"start":1214.97,"text":"Does it make some sense?"},{"start":1216.09,"text":"So if you don't subtract,"},{"start":1217.39,"text":"then for one of the trajectories,"},{"start":1218.69,"text":"you are multiplying 10 or 11 here."},{"start":1220.59,"text":"And for another trajectory, you are multiplying zero or one there."},{"start":1224.11,"text":"Now, if you subtract something that can depends on the past,"},{"start":1227.59,"text":"then you can normalize all of this into the same range in some sense."},{"start":1251.35,"text":"So in which case,"},{"start":1252.67,"text":"like which line, this line?"},{"start":1253.97,"text":"Yeah, so like you basically said"},{"start":1255.85,"text":"that the first part of the expectation of that thing"},{"start":1258.05,"text":"is going to be-"},{"start":1258.73,"text":"The first part of this is your,"},{"start":1259.67,"text":"the expectation of this is your, yes."},{"start":1260.95,"text":"Right, that means that the expectation is like,"},{"start":1264.11,"text":"you just took out the expectation for that first part"},{"start":1266.93,"text":"and then multiplied it into the second part."},{"start":1269.39,"text":"So like, E of expectation."},{"start":1271.17,"text":"No, I'm not, okay, yes, that's a good point."},{"start":1273.47,"text":"So I'm not, so here I'm not using the fact"},{"start":1275.99,"text":"that this expectation of A times B"},{"start":1277.79,"text":"is equal to the expectation of A times the expectation of B."},{"start":1279.85,"text":"That's not true, actually."},{"start":1281.01,"text":"Yeah, yeah, yeah."},{"start":1281.43,"text":"So I'm not saying that this is the case."},{"start":1288.09,"text":"So this is not what I'm doing."},{"start":1289.35,"text":"What I'm doing is, in my case, b is a constant."},{"start":1294.91,"text":"So b is literally a constant, because I've already"},{"start":1299.55,"text":"conditioned everything in the past."},{"start":1302.01,"text":"So this b term is really just a constant."},{"start":1304.97,"text":"So that's why I can take it out."},{"start":1333.79,"text":"Yeah. So I think actually regarding your question,"},{"start":1335.91,"text":"I think I had a heuristic examples in my lecture notes."},{"start":1339.65,"text":"I'm trying to see whether that's a good,"},{"start":1342.35,"text":"I think that's similar to this."},{"start":1344.19,"text":"So basically, maybe one way to think about is that,"},{"start":1348.25,"text":"that suppose you have one trajectory,"},{"start":1349.65,"text":"you have one state as t,"},{"start":1351.39,"text":"and the different actions will give you"},{"start":1353.31,"text":"reward either 10 or 11."},{"start":1358.17,"text":"So, in some sense, if you only use the reward,"},{"start":1361.07,"text":"actually it's kind of interesting."},{"start":1362.31,"text":"So, suppose this action is giving you reward 10,"},{"start":1367.49,"text":"this action giving you reward 11, and 10 is the minimum."},{"start":1370.19,"text":"So, actually sometimes you should penalize"},{"start":1371.73,"text":"the one with reward 10."}],"speech_gaps":[{"start":1237.008,"end":1241.584},{"start":1241.584,"end":1243.824},{"start":1243.824,"end":1245.888},{"start":1247.344,"end":1250.768}],"frame":"../frames/v038/008.webp","frame_time":1207.21},{"title":"策略梯度与PPO算法的讨论","segments":[{"id":200,"text":"right but actually in this case if you don't adjust it it's actually on the","zh":"不过实际上在这种情况下，如果你不进行调整，它实际上是在表面上同时强化两个动作，无论是10还是11","start":1373.79,"end":1381.09},{"id":201,"text":"surface is actually reinforcing both the two actions either with 10 and 11 the","zh":"表面实际上是在用10和11同时强化两个动作","start":1381.09,"end":1388.73},{"id":202,"text":"only difference is that you are reinforcing the good actions with a","zh":"但为什么你要这样做呢？也许你应该更加明确地进行调整，以便这个是一个负面例子，这个在某种意义上是一个正面例子。","start":1388.73,"end":1391.19},{"id":203,"text":"stronger emphasis and you are reinforcing the weaker actions with a","zh":"在期望值上，它们是相同的，因为在期望值上，","start":1391.19,"end":1395.07},{"id":204,"text":"with a less strong emphasis but why you should do that maybe you should just be","zh":"它们是相同的，因为在期望值上，","start":1395.07,"end":1398.13},{"id":205,"text":"more explicit just to readjust it so that this is a negative example this is","zh":"它们是相同的，因为在期望值上，","start":1398.13,"end":1401.09},{"id":206,"text":"is a positive example in some sense.","zh":"它们是相同的，因为在期望值上，","start":1401.09,"end":1402.31},{"id":207,"text":"In expectation, they're the same because in expectation,","zh":"它们是相同的，因为在期望值上，","start":1403.07,"end":1405.63},{"id":208,"text":"only the relative difference matters.","zh":"只有相对差异是有意义的。","start":1405.75,"end":1407.69},{"id":209,"text":"But in reality, it's more direct if you penalize this action.","zh":"但在现实中，如果你对这个动作进行惩罚，会更加直接。","start":1408.77,"end":1412.97},{"id":210,"text":"That makes sense. Okay. Sounds good. So that's everything about policy gradient. Now, let's talk about the so-called PPO, which is a variant of this. It's very still in some sense,","zh":"这听起来有道理。好的。听起来不错。所以这就是关于策略梯度的一切。现在，让我们谈谈所谓的PPO，它是这种算法的一个变种。从某种意义上说，它仍然很不稳定，","start":1414.86,"end":1433.48},{"id":211,"text":"exactly why it works and in what cases it works is still a mystery in some sense, especially from a theoretical level. There are so many different explanations. I thought about this for quite a while and I don't think none of the justifications is really very convincing to me in some sense. So what I'm doing is I'm repeating some of the existing justifications with some of my own tweak in some sense.","zh":"它为何有效以及在什么情况下有效，从某种意义上说仍然是个谜，尤其是在理论层面。有很多不同的解释。我思考了很久，但我认为在某种意义上，没有任何一种解释对我来说是非常有说服力的。因此，我所做的就是重复一些现有的解释，并在某种程度上加入我自己的调整。","start":1434.3,"end":1463.18},{"id":212,"text":"Just keep in mind, none of this is really very strong justification for this algorithm. And it's also not perfect. You'll see in the very last 20 minutes, we're going to find all kinds of ways to fix it in some way. And the fix is not perfect. And so basically, stability for post-training seems to be generally a big issue in general. It requires some magic.","zh":"请注意，所有这些都不是对这个算法非常有力的证明。而且它也不是完美的。你们会在最后的20分钟里看到，我们会找到各种方法来修复它。而这些修复方法也不是完美的。基本上，训练后的稳定性似乎是一个普遍存在的大问题。它需要一些魔法。","start":1464.01,"end":1483.13},{"id":213,"text":"to make them stable enough. I don't think we have a consensus on what's the best way to do that yet, especially in the open source community. Maybe the frontier labs know how to do it, but in the open source community, I don't think we reach a consensus on how to stabilize it very well. Anyway, so how do we start? So we can start from, let's say, here. So this is our starting point.","zh":"让它们足够稳定。我认为我们还没有就最好的方法达成共识，尤其是在开源社区中。也许前沿实验室知道如何做到这一点，但在开源社区中，我认为我们还没有很好地达成共识，关于如何稳定它。无论如何，我们如何开始？我们可以从这里开始。这就是我们的起点。","start":1483.79,"end":1511.34},{"id":214,"text":"Sorry. PPO, no. PPO doesn't stand for. PPO is Proximal Policy Optimization, something like that. The name, I don't even remember what's the first. I don't exactly remember. What's the first P? Proximal, I think. Yeah. Wait, is it really? Yeah, yeah. Anyway, but the word doesn't matter that much, I think. Yeah. Okay.","zh":"抱歉。PPO，不。PPO并没有代表什么。PPO是近端策略优化，类似这样的名称。这个名字，我甚至不记得第一个是什么。我不太确定。第一个P是近端，对吧。是的。等等，真的是这样吗？是的，是的。不管怎样，我认为这个词并不太重要。是的。好的。","start":1522.53,"end":1543.21}],"notes":["本段讨论了策略梯度方法中如何通过强化不同动作来优化策略，强调了在期望值相同的情况下，相对差异的重要性。同时，讲者指出在实际应用中，直接惩罚某些动作可能更有效。","讲者随后转向PPO（近端策略优化）算法，指出其工作原理和适用场景仍存在理论上的不确定性，目前没有令人信服的解释。讲者提到自己在重复已有解释的同时，也加入了一些个人的调整。","讲者强调，目前对PPO算法的解释并不充分，且稳定性问题在训练后仍然存在，需要一些‘魔法’来解决。讲者指出在开源社区中，尚未达成共识如何有效稳定该算法。","最后，讲者提到PPO的名称是近端策略优化，虽然具体名称的来源可能不明确，但讲者认为名称本身并不重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1373.79,"end":1543.21,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":1373.79,"text":"right but actually in this case if you don't adjust it it's actually on the"},{"start":1381.09,"text":"surface is actually reinforcing both the two actions either with 10 and 11 the"},{"start":1388.73,"text":"only difference is that you are reinforcing the good actions with a"},{"start":1391.19,"text":"stronger emphasis and you are reinforcing the weaker actions with a"},{"start":1395.07,"text":"with a less strong emphasis but why you should do that maybe you should just be"},{"start":1398.13,"text":"more explicit just to readjust it so that this is a negative example this is"},{"start":1401.09,"text":"is a positive example in some sense."},{"start":1403.07,"text":"In expectation, they're the same because in expectation,"},{"start":1405.75,"text":"only the relative difference matters."},{"start":1408.77,"text":"But in reality, it's more direct if you penalize this action."},{"start":1414.86,"text":"That makes sense. Okay. Sounds good. So that's everything about policy gradient. Now, let's talk about the so-called PPO, which is a variant of this. It's very still in some sense,"},{"start":1434.3,"text":"exactly why it works and in what cases it works is still a mystery in some sense, especially from a theoretical level. There are so many different explanations. I thought about this for quite a while and I don't think none of the justifications is really very convincing to me in some sense. So what I'm doing is I'm repeating some of the existing justifications with some of my own tweak in some sense."},{"start":1464.01,"text":"Just keep in mind, none of this is really very strong justification for this algorithm. And it's also not perfect. You'll see in the very last 20 minutes, we're going to find all kinds of ways to fix it in some way. And the fix is not perfect. And so basically, stability for post-training seems to be generally a big issue in general. It requires some magic."},{"start":1483.79,"text":"to make them stable enough. I don't think we have a consensus on what's the best way to do that yet, especially in the open source community. Maybe the frontier labs know how to do it, but in the open source community, I don't think we reach a consensus on how to stabilize it very well. Anyway, so how do we start? So we can start from, let's say, here. So this is our starting point."},{"start":1522.53,"text":"Sorry. PPO, no. PPO doesn't stand for. PPO is Proximal Policy Optimization, something like that. The name, I don't even remember what's the first. I don't exactly remember. What's the first P? Proximal, I think. Yeah. Wait, is it really? Yeah, yeah. Anyway, but the word doesn't matter that much, I think. Yeah. Okay."}],"speech_gaps":[],"frame":"../frames/v038/009.webp","frame_time":1385.79},{"title":"关于策略梯度与策略优化的讨论","segments":[{"id":215,"text":"I think the idea here is the following. So, okay, so maybe let's start from here. So we call that, you know, this loss function is something like this, right? So it is like this trajectory comes from theta, let's say, gamma to the power t, r, s, t, a, t. So if you take gradient,","zh":"我想这里的思路是这样的。所以，好吧，也许我们从这里开始。所以我们称之为，你知道的，这个损失函数看起来像这样，对吧？所以它像是这样的轨迹来自于 theta，比如说，gamma 的 t 次方，r，s，t，a，t。所以如果你取梯度，","start":1547.63,"end":1593.83},{"id":216,"text":"So the, oh, maybe one thing I should, okay, sorry. Maybe before talking about PPO, let's try to summarize the algorithm here. So the algorithm is that every policy green algorithm has this structure, right? So you first sample the trajectories from the policy. Maybe you sample many of them. So one trajectory or maybe many trajectories. Let me be a little bit, so let's say many trajectories from the policy pi theta.","zh":"所以，哦，也许我应该，好吧，抱歉。也许在谈论 PPO 之前，让我们先总结一下这里的算法。所以这个算法的结构是每个策略绿色算法都有这样的结构，对吧？所以你首先从策略中采样轨迹。也许你采样很多。所以一条轨迹或者也许很多轨迹。让我稍微具体一点，比如说从策略 pi theta 中采样很多轨迹。","start":1595.95,"end":1632.29},{"id":217,"text":"And then you estimate nabla eta theta. You estimate the gradient with respect to theta. And then you do the parameter update. The parameter update. You say theta is updated to be like theta. Here you plus some learning rate alpha times the nabla of eta theta. Something like this.","zh":"然后你估计 nabla eta theta。你估计关于 theta 的梯度。然后你进行参数更新。参数更新。你说 theta 被更新为类似于 theta。这里你加上一些学习率 alpha 乘以 nabla eta theta 的梯度。类似这样的。","start":1632.95,"end":1659.53},{"id":218,"text":"So, and when you say estimate, when you say estimate at the knob law, I mean I'm using this estimator to estimate. And what that mean is means that I'm replacing the expectation by the empirical sample mean, right? So, you have many, many trajectories like this. You know, you take probably 128 trajectories and you take the empirical mean as opposed to the full expectation. And the issue with this kind of algorithm is that it's so-called on policy in a sense that","zh":"所以，当你说到估计，当你说到估计在 knob law 上，我的意思是我在使用这个估计器来进行估计。而这意味着我用经验样本均值代替期望，对吧？所以，你有这么多、这么多这样的轨迹。你知道的，你可能取 128 条轨迹，并用经验均值代替完整的期望。这种算法的问题在于，它在某种意义上被称为在策略（on policy），因为","start":1660.33,"end":1687.97},{"id":219,"text":"Every time you update your parameter, you are, so this kind of algorithm is called on policy because when you are updating the parameter, the parameter is the most recent parameter that you use to sample the trajectory. So you are sampling from theta, right, from theta, and then you take the gradient at theta and then you update theta. So, for example, what if you want to update two types?","zh":"每次你更新参数时，你都是这样做的。这种算法被称为在策略，因为在更新参数时，参数是你最近用来采样轨迹的参数。所以你从 theta 中采样，对吧，从 theta 中采样，然后你在 theta 处计算梯度，然后更新 theta。例如，如果你想要更新两种类型呢？","start":1688.63,"end":1712.81}],"notes":["本段讨论了策略梯度方法的基本思想，即通过估计梯度来更新策略参数。讲者提到，损失函数的轨迹来源于参数θ，可能涉及时间序列的表示如γ^t, r, s, t, a, t。在计算梯度时，需要估计梯度并进行参数更新，更新公式为θ加上学习率α乘以梯度。"],"formulas":[],"uncertainties":["gamma to the power t, r, s, t, a, t","estimate at the knob law","nabla eta theta","theta is updated to be like theta","estimate at the knob law"],"diagram":"none","start":1547.63,"end":1712.81,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":1547.63,"text":"I think the idea here is the following. So, okay, so maybe let's start from here. So we call that, you know, this loss function is something like this, right? So it is like this trajectory come from theta, let's say, gamma to the power t, r, s, t, a, t. So if you take gradient,"},{"start":1595.95,"text":"So the, oh, maybe one thing I should, okay, sorry. Maybe before talking about PPO, let's try to summarize the algorithm here. So the algorithm is that every policy green algorithm has this structure, right? So you first sample the trajectories from the policy. Maybe you sample many of them. So one trajectory or maybe many trajectories. Let me be a little bit, so let's say many trajectories from the policy pi theta."},{"start":1632.95,"text":"And then you estimate nabla eta theta. You estimate the gradient with respect to theta. And then you do the parameter update. The parameter update. You say theta is update to be like theta. Here you plus some learning rate alpha times the nabla of eta theta. Something like this."},{"start":1660.33,"text":"So, and when you say estimate, when you say estimate at the knob law, I mean I'm using this estimator to estimate. And what that mean is means that I'm replacing the expectation by the empirical sample mean, right? So, you have many, many trajectories like this. You know, you take probably 128 trajectories and you take the empirical mean as opposed to the full expectation. And the issue with this kind of algorithm is that it's so-called on policy in a sense that"},{"start":1688.63,"text":"Every time you update your parameter, you are, so this kind of algorithm is called on policy because when you are updating the parameter, the parameter is the most recent parameter that you use to sample the trajectory. So you are sampling from theta, right, from theta, and then you take the gradient at theta and then you update theta. So, for example, what if you want to update two types?"}],"speech_gaps":[],"frame":"../frames/v038/010.webp","frame_time":1559.63},{"title":"策略梯度与重要性采样","segments":[{"id":220,"text":"Suppose you want to say, I'm going to take two gradient descent steps. I take one step and take another step. It's not allowed, strictly speaking. Because the second step, if you want to take another step, you have to resample to estimate your nabla theta again. So because this estimator requires that, this trajectory to sample from the policy p theta.","zh":"假设你想说，我要进行两次梯度下降步骤。我进行一次步骤，再进行另一次步骤。严格来说这是不允许的。因为第二次步骤，如果你想再进行一次步骤，你必须重新采样以重新估计你的梯度。因此，由于这个估计器需要这样做，因此必须从策略 p_theta 中进行采样。","start":1713.39,"end":1737.63},{"id":221,"text":"you have to sample from the current theta to estimate the gradient at theta. You cannot take another sum trajectory from a different distribution. So that's the main challenge. So it has to be on policy, because this estimator requires your sampling from the current theta you are at.","zh":"你必须从当前的 theta 进行采样以估计 theta 处的梯度。你不能从不同的分布中采样另一条轨迹。因此，这是主要的挑战。因此，它必须是在策略（on-policy）的，因为这个估计器要求你从当前的 theta 进行采样。","start":1738.08,"end":1753.78},{"id":222,"text":"So that means you cannot reuse the samples. If you take one trajectories, you only use it once for gradient descent, and then the sample is of no use anymore at all. And PPO is trying to deal with this sampling issue by an important sampling. So basically, it's trying to reuse some of the","zh":"这意味着你不能重复使用样本。如果你采样了一条轨迹，你只能用它一次进行梯度下降，之后这个样本就完全没用了。PPO 试图通过重要性采样来处理这个采样问题。基本上，它试图重用一些从旧策略采样的轨迹，仍然估计当前策略的梯度，或者仍然估计当前策略的所有奖励函数的梯度。基本上，我想用类似这样的方法来替换，例如，一个 pi_old，这样我可以使用旧策略的轨迹进行采样。但如果你只是这样做，那就没有意义了，对吧？因为如果你只是这样做，你实际上是在估计 eta_theta_old，而不是 eta_theta。这没有意义。因此，你必须以某种方式纠正这两个之间的差异。纠正的最佳方式，最简单的方式是以下这样。你说，我要进行重要性采样。因此，我在这里从 pi_old 进行采样，然后在这里添加一些重要性采样。","start":1754.96,"end":1774.22},{"id":223,"text":"the trajectories you sampled from an old policy, and still to estimate the gradient at the current policy, or still estimate the gradient all the reward function at the current policy. So basically, I want to replace this by, for example, something like this, a pi old, so that I can use the old policy, the trajectory from the old policy to sample. But if you just do this, then it doesn't make sense, right? Because if you just do this, then you are","zh":"我在这里有一个重要性采样项来纠正分布差异。因此，这里的微妙之处在于，如何纠正这一点？因为技术上，这是一个轨迹。差异在于整个轨迹的概率是不同的。因此，PPO 做的第一件事是，好吧，让我们至少纠正这个差异。","start":1775.79,"end":1803.92},{"id":224,"text":"not actually estimating the eta. Theta, you are estimating exactly eta theta old. So that doesn't make sense. So you have to somehow correct for the differences between these two. And the best way to correct, the simplest way to correct is the following. You say, I'm going to do some important sampling. So I sample here from pi old, and then I add some important sampling here.","zh":"实际上并不是在估计eta。Theta，你是在精确地估计eta theta old。所以这样是没有意义的。因此，你必须以某种方式来纠正这两个之间的差异。而最好的纠正方法，最简单的纠正方法是以下这样。你说，我要进行重要性采样。所以我在这里从pi old进行采样，然后在这里添加一些重要性采样。","start":1804.6,"end":1826.58},{"id":225,"text":"I had some important sampling term here to correct for the distribution differences. So here, the subtlety comes from that. How do you correct for this? Because technically, this is a trajectory. The difference is the whole trajectory's probability is different. So the first thing that PPO does is that, OK, let's try to at least correct for the","zh":"我在这里有一个重要性采样项来纠正分布差异。所以这里的微妙之处就在于此。你如何纠正这一点？因为从技术上讲，这是一条轨迹。差异在于整个轨迹的概率是不同的。因此，PPO做的第一件事是，好吧，让我们至少尝试纠正这个","start":1827.78,"end":1848.48},{"id":226,"text":"the action part. But at least that's something we can do. So basically, the idea is that you say, let's first decompose this into two parts. One part is that the state is sampling from pi theta. And then the action is sampling from pi theta given the state. So you first have to decompose these two things.","zh":"动作部分。但至少我们可以做这个。所以基本上，想法是说，我们首先将这个分解成两个部分。一部分是状态从pi theta中采样，另一部分是动作在给定状态的情况下从pi theta中采样。因此，你首先必须将这两个部分分解出来。","start":1848.89,"end":1874.91}],"notes":["本段讲解了策略梯度方法中采样与梯度估计的关系。在策略梯度中，每次梯度估计都需要基于当前策略进行采样，因此不能重复使用旧策略的轨迹。这导致了采样效率的问题，因为每个轨迹只能使用一次。PPO（Proximal Policy Optimization）通过重要性采样来解决这个问题，尝试重用旧策略的轨迹来估计当前策略的梯度。","重要性采样允许使用旧策略的轨迹来估计当前策略的梯度，但需要对分布差异进行校正。直接使用旧策略的轨迹会导致估计的梯度与当前策略无关，因此必须引入重要性采样项来修正分布差异。","PPO的策略是将轨迹分解为状态和动作两部分。状态的采样来自当前策略，而动作的采样则来自当前策略给定状态的分布。这种分解有助于更精确地估计梯度，同时减少对旧轨迹的依赖。","重要性采样项的引入是关键，它允许在估计梯度时考虑轨迹概率分布的差异。通过这种方式，PPO能够在不完全依赖新采样的情况下，提高策略优化的效率。","在实际应用中，重要性采样项的计算需要考虑轨迹的概率分布差异，这通常涉及对数似然比的计算。这种计算方式使得PPO能够在保持策略更新稳定性的同时，提高采样效率。","PPO通过分解轨迹并引入重要性采样项，解决了策略梯度方法中采样效率低的问题。这种方法在强化学习中被广泛应用，因为它能够在保持策略更新稳定性的同时，提高训练效率。"],"formulas":[],"uncertainties":["eta. Theta"],"diagram":"none","start":1713.39,"end":1874.91,"asr_flags":[],"math_clarifications":["原始文本未提及任何具体的数学公式，因此所有公式均无法核定，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1713.39,"text":"Suppose you want to say, I'm going to take two gradient descent steps. I take one step and take another step. It's not allowed, strictly speaking. Because the second step, if you want to take another step, you have to resample to estimate your nabla theta again. So because this estimator requires that, this trajectory to sample from the policy p theta."},{"start":1738.08,"text":"you have to sample from the current theta to estimate the gradient at theta. You cannot take another sum trajectory from a different distribution. So that's the main challenge. So it has to be on policy, because this estimator requires your sampling from the current theta you are at."},{"start":1754.96,"text":"So that means you cannot reuse the samples. If you take one trajectories, you only use it once for gradient descent, and then the sample is of no use anymore at all. And PPO is trying to deal with this sampling issue by an important sampling. So basically, it's trying to reuse some of the"},{"start":1775.79,"text":"the trajectories you sampled from an old policy, and still to estimate the gradient at the current policy, or still estimate the gradient all the reward function at the current policy. So basically, I want to replace this by, for example, something like this, a pi old, so that I can use the old policy, the trajectory from the old policy to sample. But if you just do this, then it doesn't make sense, right? Because if you just do this, then you are"},{"start":1804.6,"text":"not actually estimating the eta. Theta, you are estimating exactly eta theta old. So that doesn't make sense. So you have to somehow correct for the differences between these two. And the best way to correct, the simplest way to correct is the following. You say, I'm going to do some important sampling. So I sample here from pi old, and then I add some important sampling here."},{"start":1827.78,"text":"I had some important sampling term here to correct for the distribution differences. So here, the subtlety comes from that. How do you correct for this? Because technically, this is a trajectory. The difference is the whole trajectory's probability is different. So the first thing that PPO does is that, OK, let's try to at least correct for the"},{"start":1848.89,"text":"the action part. But at least that's something we can do. So basically, the idea is that you say, let's first decompose this into two parts. One part is that the state is sampling from pi theta. And then the action is sampling from pi theta given the state. So you first have to decompose these two things."}],"speech_gaps":[],"frame":"../frames/v038/011.webp","frame_time":1725.39},{"title":"重要性采样与策略修正","segments":[{"id":227,"text":"And then you say, at least I can do important sampling for this part, even though I don't know how to deal with it for this part. So I just say, you estimate this. I think this is actually equality. So you say, if ST comes from the new policy, and then I do important sampling where I change the AT to sample from the old.","zh":"然后你说，至少我可以对这一部分进行重要性采样，尽管我不知道如何处理这一部分。因此，你只是说，你估计这个。我认为这实际上是等式。因此，你说，如果ST来自于新策略，那么你进行重要性采样，将AT从旧策略中进行采样。","start":1877.42,"end":1900.59},{"id":228,"text":"And then I take an important sampling to correct for the differences. You say you add pi theta AT given ST divided by pi theta old AT given ST. And then R ST AT. So something like this.","zh":"然后你进行重要性采样以纠正差异。你说你加上pi theta AT给定ST除以pi theta旧AT给定ST，然后乘以R ST AT。类似这样的表达。","start":1903.18,"end":1929.0},{"id":229,"text":"So that's the first other bet you can do. So basically, you correct for the action distribution, but you don't correct for the state distribution. Yes. So this means that, yes. So what does this mean? This means that you actually, what does this really mean? It means that you sample all the, you sample the actions from the, you sample the actions from the pi theta, and then you sample the state as a result of that.","zh":"所以这是你可以做的第一种其他方法。基本上，你纠正了动作分布，但没有纠正状态分布。是的。因此，这意味着什么？这意味着什么？这意味着你实际上，你从pi theta中采样所有的动作，然后你从这些动作的结果中采样状态。","start":1929.74,"end":1969.88},{"id":230,"text":"So that's a typical way people write these kind of notations. I know sometimes people just say s come from this pi. I think they even have a notation for this, like say the distribution of the states and the pi theta. That's the more formal way to write it. But what it really means is just that you take the whole trajectory, sampling from pi theta, the action is sampling from pi theta, and then you keep the state part in some sense.","zh":"所以这是人们通常书写这类符号的一种典型方式。我知道有时人们只是说状态来自于这个pi。我认为他们甚至有一个符号来表示这一点，比如状态分布和pi theta的分布。这是更正式的写法。但其真正含义只是说，你从pi theta中采样整个轨迹，动作是从pi theta中采样，然后你以某种方式保留状态部分。","start":1971.33,"end":1996.73},{"id":231,"text":"And then you re-correct for the action part locally. So basically, this whole thing is sampling from pi theta, but locally, you correct for the action. And then you can say, let's, OK, so now,","zh":"然后你对动作部分进行局部纠正。基本上，整个过程是从pi theta中进行采样，但在局部上，你纠正了动作。然后你可以说，让我们，好的，现在，","start":1997.76,"end":2016.95},{"id":232,"text":"The problem is that, you know, you didn't crack for this part, right? But you just try to say, oh, I don't care. Like, I cannot, you know, there's no way I know how to crack for this part. I just use the pi theta old in practice. And then I try to kind of like just use, in some sense, use pi theta old for this, which is a big approximation. And this part you try to correct. That's kind of like the main idea. The fraction there, the pi theta old.","zh":"问题是，你知道，你没有对这一部分进行纠正，对吧？但你只是试图说，哦，我不在乎。比如，我无法，你知道，我不知道如何对这一部分进行纠正。我在实践中只是使用pi theta旧。然后我试图以某种方式使用pi theta旧来处理这一部分，这是一次很大的近似。而这一部分你试图进行纠正。这基本上就是主要思想。那里的分数，pi theta旧。","start":2019.25,"end":2049.07}],"notes":["本段讲解了重要性采样（important sampling）在策略修正中的应用。讲者提到，即使不知道如何处理某些部分，也可以通过重要性采样进行估计。重要性采样通过将新策略下的动作（AT）与旧策略下的动作（AT）进行比较，来修正差异。讲者还提到，这种修正仅针对动作分布，而不修正状态分布。","讲者进一步解释了重要性采样的具体实现方式，即通过计算新旧策略下动作分布的比值，并乘以奖励（R ST AT）来修正。这种做法意味着，所有动作都是从新策略（pi theta）中采样，而状态则是作为结果被保留。","讲者指出，重要性采样通常以某种方式书写，有时人们会直接说状态（s）来自策略（pi）。更正式的写法是将状态分布和策略（pi theta）分开。但其核心含义是，整个轨迹是从新策略（pi theta）中采样，动作从新策略中采样，而状态部分则被保留。","讲者提到，重要性采样在局部对动作部分进行修正。这意味着，虽然整体上是从新策略（pi theta）中采样，但在局部上，对动作进行修正。这种修正方式是策略修正的核心思想。","讲者指出，问题在于，对于某些部分，无法进行修正。因此，讲者提到，可以使用旧策略（pi theta old）进行近似，这在实践中是一种较大的近似。这种近似是策略修正的主要思想。","讲者最后提到，修正部分的比值（fraction）是旧策略（pi theta old）的一部分，这表明在策略修正中，旧策略的使用是关键。"],"formulas":[],"uncertainties":["crack for this part","pi theta old"],"diagram":"none","start":1877.42,"end":2049.07,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1877.42,"text":"And then you say, at least I can do important sampling for this part, even though I don't know how to deal with it for this part. So I just say, you estimate this. I think this is actually equality. So you say, if ST comes from the new policy, and then I do important sampling where I change the AT to sample from the old."},{"start":1903.18,"text":"And then I take an important sampling to correct for the differences. You say you add pi theta AT given ST divided by pi theta old AT given ST. And then R ST AT. So something like this."},{"start":1929.74,"text":"So that's the first other bet you can do. So basically, you correct for the action distribution, but you don't correct for the state distribution. Yes. So this means that, yes. So what does this mean? This means that you actually, what does this really mean? It means that you sample all the, you sample the actions from the, you sample the actions from the pi theta, and then you sample the state as a result of that."},{"start":1971.33,"text":"So that's a typical way people write these kind of notations. I know sometimes people just say s come from this pi. I think they even have a notation for this, like say the distribution of the states and the pi theta. That's the more formal way to write it. But what it really means is just that you take the whole trajectory, sampling from pi theta, the action is sampling from pi theta, and then you keep the state part in some sense."},{"start":1997.76,"text":"And then you re-correct for the action part locally. So basically, this whole thing is sampling from pi theta, but locally, you correct for the action. And then you can say, let's, OK, so now,"},{"start":2019.25,"text":"The problem is that, you know, you didn't crack for this part, right? But you just try to say, oh, I don't care. Like, I cannot, you know, there's no way I know how to crack for this part. I just use the pi theta old in practice. And then I try to kind of like just use, in some sense, use pi theta old for this, which is a big approximation. And this part you try to correct. That's kind of like the main idea. The fraction there, the pi theta old."}],"speech_gaps":[],"frame":"../frames/v038/012.webp","frame_time":1889.42},{"title":"重要性采样与基线校正","segments":[{"id":233,"text":"Oh, no, no, no. It's not all. Sorry. There's still a gamma term. I guess just in natural language cases, the gamma is 1. So that's why I always forget about it. So this will cancel for this, right? So this term, if you think about the expectation, there is a probability of the pi-0, which will cancel with this. That's how you do the importance sampling.","zh":"哦，不，不，不。这还远没有结束。抱歉。仍然有一个 gamma 项。我想在自然语言的情况下，gamma 是 1。这就是为什么我总是忘记它的原因。所以这个项会在这里被抵消，对吧？所以这个项，如果你考虑期望值，会有一个 pi-0 的概率，会和这个抵消。这就是如何进行重要性采样的。","start":2052.77,"end":2072.35},{"id":234,"text":"Yeah, so it's kind of fundamental what he's doing is the following. Suppose you have x from p theta, and then there's a function of fx, I say, something like this. And how do you do important sampling? You say, this is expectation p theta x fx dx. Sorry, this is the integration of this. And then you say, I'm going to introduce a q.","zh":"是的，他所做的基本上是以下内容。假设你有一个从 p theta 中采样的 x，然后有一个关于 x 的函数 fx，像这样。那么如何进行重要性采样？你会说，这是 p theta x 的期望值 fx dx。抱歉，这是这个积分。然后你会说，我要引入一个 q。","start":2082.52,"end":2102.9},{"id":235,"text":"And then I have p theta x divided by q theta x dx. And then you put this part in expectation. You say expectation x come from q theta x, q theta. And I'm left with the ratio between q and p. And right. So I'm, oh, I missed the fx somewhere. So fx dx, and it's fx.","zh":"然后我有 p theta x 除以 q theta x dx。然后你把这个部分放入期望值中。你会说，期望值来自 q theta x，q theta。然后我剩下的是 q 和 p 之间的比率。对的。所以，我好像在某处漏掉了 fx。所以是 fx dx，而且是 fx。","start":2105.36,"end":2131.05},{"id":236,"text":"and this is very analogous to this. So this is p, this is q, and this is q. So okay, good. I think maybe in the interest of time, I'm going to hand wave a little bit. You also can take gradients of this. So if you take gradients, you can actually, how do I hand wave a little bit?","zh":"这与之前的内容非常类似。所以这是 p，这是 q，这也是 q。好的，很好。我想为了节省时间，我将略过一些细节。你也可以对这个取梯度。所以如果你取梯度，你实际上可以如何略过一些细节？","start":2132.0,"end":2161.46},{"id":237,"text":"So I think what people often do is that people often subtract the baseline here so that you have an advantage function. So I guess with some kind of hand-wavy thing, you can also subtract the baselines to replace the reward by some advantage function.","zh":"我想人们通常在这里减去基线，这样你就会有一个优势函数。我想通过某种略过细节的方式，你也可以减去基线，用某种优势函数来替代奖励。","start":2181.33,"end":2210.0}],"notes":["本段讲解了重要性采样（importance sampling）的基本思想，即通过引入一个提议分布 q 来估计目标分布 p 的期望值。在计算过程中，需要考虑概率密度比值 p(x)/q(x)，并将其用于加权平均。讲者提到，在自然语言处理中，gamma 通常为 1，因此容易被忽略。","讲者进一步解释了重要性采样的数学形式，即期望值的计算为 ∫ p(x) f(x) dx，而通过引入 q(x) 可以将其转换为 ∫ q(x) [p(x)/q(x)] f(x) dx。这表明重要性采样通过重新加权样本，使得估计更加高效。","在计算过程中，讲者提到可能会遗漏 f(x) 的部分，这表明在实际操作中需要注意函数 f(x) 的正确引入。同时，讲者指出，重要性采样中的期望值计算依赖于 q(x) 和 p(x) 的比值，这与重要性采样的核心思想一致。","讲者提到在实际应用中，人们常常通过减去基线（baseline）来构造优势函数（advantage function），从而减少方差。这种做法类似于在强化学习中使用基线校正（baseline correction）来优化策略。","讲者最后提到，通过一些简化的处理（hand-wavy），可以将基线校正应用于奖励函数，从而得到优势函数。这表明在实际应用中，基线校正是一种常见的优化手段，有助于提高估计的稳定性。","整个段落围绕重要性采样和基线校正展开，强调了在估计期望值时如何通过引入提议分布 q 来提高效率，并通过基线校正减少方差。这些方法在强化学习和统计推断中具有广泛应用。"],"formulas":[{"latex":"E_{q(x)}[f(x)] = E_{q(x)}[f(x) - b(x) + b(x)] = E_{q(x)}[f(x) - b(x)] + E_{q(x)}[b(x)] \\text{（基线校正）}","symbols":"b(x) 是基线函数，用于减少方差，E_{q(x)}[f(x) - b(x)] 是优势函数","explanation":"公式正确，基线校正的数学表达式无误，适用于重要性采样中的方差减少技术。","evidence":"So I think what people often do is that people often subtract the baseline here so that you have an advantage function. So I guess with some kind of hand-wavy thing, you can also subtract the baselines to replace the reward by some advantage function."}],"uncertainties":["在讲者提到 'gamma is 1' 时，未明确说明 gamma 的具体定义，可能涉及上下文中的其他术语或公式，需进一步确认。","在讲者提到 'hand wave a little bit' 时，未明确说明具体的操作步骤，可能涉及简化或假设，需结合上下文进一步确认。","在讲者提到 'advantage function' 时，未明确其数学定义，可能涉及强化学习中的具体实现，需结合上下文进一步确认。"],"diagram":"none","start":2052.77,"end":2210.0,"asr_flags":[],"math_clarifications":["原始公式中的分母 q(x) 应该是样本权重，而不是整个分布。公式应为重要性采样估计的加权平均形式，而不是直接除以 q(x)。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2052.77,"text":"Oh, no, no, no. It's not all. Sorry. There's still a gamma term. I guess just in natural language cases, the gamma is 1. So that's why I always forget about it. So this will cancel for this, right? So this term, if you think about the expectation, there is a probability of the pi-0, which will cancel with this. That's how you do the importance sampling."},{"start":2082.52,"text":"Yeah, so it's kind of fundamental what he's doing is the following. Suppose you have x from p theta, and then there's a function of fx, I say, something like this. And how do you do important sampling? You say, this is expectation p theta x fx dx. Sorry, this is the integration of this. And then you say, I'm going to introduce a q."},{"start":2105.36,"text":"And then I have p theta x divided by q theta x dx. And then you put this part in expectation. You say expectation x come from q theta x, q theta. And I'm left with the ratio between q and p. And right. So I'm, oh, I missed the fx somewhere. So fx dx, and it's fx."},{"start":2132.0,"text":"and this is very analogous to this. So this is p, this is q, and this is q. So okay, good. I think maybe in the interest of time, I'm going to hand wave a little bit. You also can take gradients of this. So if you take gradients, you can actually, how do I hand wave a little bit?"},{"start":2181.33,"text":"So I think what people often do is that people often subtract the baseline here so that you have an advantage function. So I guess with some kind of hand-wavy thing, you can also subtract the baselines to replace the reward by some advantage function."}],"speech_gaps":[{"start":2076.144,"end":2082.12},{"start":2164.368,"end":2165.968}],"frame":"../frames/v038/013.webp","frame_time":2064.77},{"title":"优势函数与策略梯度方法","segments":[{"id":238,"text":"advantage function which we didn't really formally define, but you can think of as something like the reward to go minus some baseline, something like this. So this is like a baseline and this is the reward to go. Let's call this something like A high T. So you can do some derivation so that you can make this something like this. So as from Pi Theta and then","zh":"优势函数，我们并没有正式定义，但你可以把它想象成类似于奖励到终点的值减去某个基线，类似这样的东西。所以这是基线，这是奖励到终点。让我们称这个为A high T。因此你可以进行一些推导，使得你可以得到这样的形式。所以从Pi Theta开始，然后","start":2211.98,"end":2246.27},{"id":239,"text":"expectation A t from high old S t and then you have this ratio A t given S t and high old A t given S t times this advantage function. Now, the advantage function is really just saying that if it's positive, so of some A t and S t is positive, it means that A t is a good action.","zh":"期望A t在high old S t的情况下，然后你有这个比率A t给定S t和high old A t给定S t乘以这个优势函数。现在，优势函数实际上只是在说，如果它是正的，即对于某些A t和S t是正的，这意味着A t是一个好的动作。","start":2248.57,"end":2279.31},{"id":240,"text":"and this advantage is negative, it means it's a bad action. Because it's worse than the base sign, so it's a bad action. So basically, that's the first. So that's the approximation. And then you try to approximate this. I guess, as I said, you approximate this by pi old. So you say, let's not care about how I sample from the state.","zh":"而如果这个优势是负的，这意味着这是一个坏的动作。因为它比基线差，所以这是一个坏的动作。所以基本上，这就是第一个近似。然后你尝试去近似这个。我想，正如我所说的，你通过pi old来近似这个。因此你说，我们不需要关心如何从状态中进行采样。","start":2282.53,"end":2318.47},{"id":241,"text":"So I change this to pi out. OK. So now, in some sense, it's kind of like a reasonably good form. But now the catch is that this ratio sometimes is too big or too small so that it creates some trouble. So for example, what if the ratio, this ratio, I think often people call this ratio little r of, I guess, this little rt. So if this ratio is","zh":"所以我把这个改成pi out。好的。现在，从某种意义上说，这有点像一个相当好的形式。但现在的问题是，这个比率有时太大或太小，从而造成一些麻烦。例如，如果这个比率，这个比率，我想人们通常称这个比率为little r，即这个little rt。如果这个比率是","start":2318.93,"end":2348.11},{"id":242,"text":"And I think about this ratio. If the ratio is big, what does it mean? If the ratio is big, it means that the action is, OK, so I guess it depends on whether the a hat. So there's actually four cases here. So if a hat is big, and the ratio is, let's say, much, much less than 1.","zh":"我想关于这个比率。如果这个比率很大，这意味着什么？如果这个比率很大，这意味着动作是，好的，我想这取决于a hat。所以实际上这里有四种情况。如果a hat很大，而比率，比如说，远小于1。","start":2348.75,"end":2368.22}],"notes":["本段讲解了优势函数（advantage function）的概念，它被定义为奖励到当前时刻（reward to go）减去一个基线（baseline），用于评估某个动作相对于基线的优劣。优势函数为正表示该动作是好的，为负则表示是坏的。"],"formulas":[],"uncertainties":["A high T","Pi Theta","Pi out","a hat"],"diagram":"none","start":2211.98,"end":2368.22,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2211.98,"text":"advantage function which we didn't really formally define, but you can think of as something like the reward to go minus some baseline, something like this. So this is like a baseline and this is the reward to go. Let's call this something like A high T. So you can do some derivation so that you can make this something like this. So as from Pi Theta and then"},{"start":2248.57,"text":"expectation A t from high old S t and then you have this ratio A t given S t and high old A t given S t times this advantage function. Now, the advantage function is really just saying that if it's positive, so of some A t and S t is positive, it means that A t is a good action."},{"start":2282.53,"text":"and this advantage is negative, it means it's a bad action. Because it's worse than the base sign, so it's a bad action. So basically, that's the first. So that's the approximation. And then you try to approximate this. I guess, as I said, you approximate this by pi old. So you say, let's not care about how I sample from the state."},{"start":2318.93,"text":"So I change this to pi out. OK. So now, in some sense, it's kind of like a reasonably good form. But now the catch is that this ratio sometimes is too big or too small so that it creates some trouble. So for example, what if the ratio, this ratio, I think often people call this ratio little r of, I guess, this little rt. So if this ratio is"},{"start":2348.75,"text":"And I think about this ratio. If the ratio is big, what does it mean? If the ratio is big, it means that the action is, OK, so I guess it depends on whether the a hat. So there's actually four cases here. So if a hat is big, and the ratio is, let's say, much, much less than 1."}],"speech_gaps":[],"frame":"../frames/v038/014.webp","frame_time":2223.98},{"title":"PPO算法中的策略更新与梯度应用","segments":[{"id":243,"text":"So what does that mean? That means that A hat, the advantage is good, means that this action is actually a good action. So we know the reward compared to the baseline is positive. So the action is a good action. And it's a good action, and also under the current policy, it has higher probability than the old policy. So in some sense, that's already a good case. So you wanted to have a good action, and your current policy is already doing better than the old policy for this good action. It's generating a good action with higher probability.","zh":"那么这意味着什么呢？这意味着，A hat（优势值）是好的，意味着这个动作实际上是一个好的动作。因此我们知道，与基线相比，这个动作的奖励是正的。因此这个动作是一个好的动作。而且，这个动作在当前策略下比旧策略具有更高的概率。从某种意义上说，这已经是一个好的情况了。你希望有一个好的动作，而当前策略对于这个好的动作已经比旧策略表现得更好了。它以更高的概率生成一个好的动作。","start":2368.69,"end":2397.85},{"id":244,"text":"So in some sense, this is kind of like a great case. And the question is whether you need to reinforce it. Should you still try to take the gradient here to reinforce to make the problem higher? And PPO's position is that for this case, we don't need to reinforce anymore. So in PPO, the idea is that no need to reinforce.","zh":"从某种意义上说，这已经是一个很好的情况了。问题是，你是否需要进一步强化它？是否仍然需要在这里取梯度来强化，以使问题变得更好？PPO的观点是，在这种情况下，我们不再需要强化了。因此，在PPO中，想法是不需要再进行强化。","start":2398.83,"end":2420.83},{"id":245,"text":"Because it's already a good action,","zh":"因为它已经是一个好的动作，","start":2425.25,"end":2426.51},{"id":246,"text":"and I'm doing better than the old policy,","zh":"而且我在当前策略下比旧策略表现得更好，","start":2426.63,"end":2428.73},{"id":247,"text":"so I don't have to reinforce.","zh":"所以我不需要再进行强化。","start":2428.85,"end":2429.71},{"id":248,"text":"So in this case, in PPO's case, you're going to zero it out.","zh":"因此，在这种情况下，PPO的做法是将其置零。","start":2430.41,"end":2433.79},{"id":249,"text":"So basically, you just truncate it to make it zero.","zh":"基本上，你只是将其截断为零。","start":2433.91,"end":2435.97},{"id":250,"text":"So basically, you drop this term in this case.","zh":"基本上，你在这个情况下就去掉这个项。","start":2436.21,"end":2438.53},{"id":251,"text":"If RT is much bigger than 1.","zh":"如果RT远大于1。","start":2438.73,"end":2440.49},{"id":252,"text":"Actually, technically speaking,","zh":"实际上，从技术上讲，","start":2440.55,"end":2441.31},{"id":253,"text":"if RT is bigger than 1 plus some epsilon,","zh":"如果RT大于1加上某个epsilon，","start":2441.45,"end":2444.31},{"id":254,"text":"it's called epsilon high.","zh":"则称为epsilon高。","start":2444.73,"end":2445.73},{"id":255,"text":"It's a hyperparameter.","zh":"它是一个超参数。","start":2445.81,"end":2446.49},{"id":256,"text":"Sometimes this is like 0.2 or 0.28, something like that.","zh":"有时这个值类似于0.2或0.28，类似这样的数值。","start":2446.91,"end":2449.83},{"id":257,"text":"So basically, if RT is already larger than 1.28,","zh":"所以基本上，如果RT已经大于1.28，","start":2450.21,"end":2453.17},{"id":258,"text":"So in this case, in PPO's case, you're going to zero it out.","zh":"在这种情况下，在PPO中，你会将其置零。","start":2453.17,"end":2456.97},{"id":259,"text":"So basically, you just truncate it to make it zero.","zh":"所以基本上，你只需要将其截断为零。","start":2456.97,"end":2463.33},{"id":260,"text":"instability to to keep updating it and and when so in PPO so there is also a","zh":"不稳定性会持续更新它，而在PPO中，也存在","start":2463.33,"end":2473.11},{"id":261,"text":"case when a hat is big and RT let's say is um let's say small let's say this is","zh":"当a hat很大而RT比如说很小的情况下，比如说这个","start":2473.11,"end":2480.89},{"id":262,"text":"is smaller than one, okay, there are actually many cases,","zh":"比1小，好的，实际上有很多情况，","start":2480.89,"end":2485.01},{"id":263,"text":"if RT is bigger than 1 plus some epsilon,","zh":"如果RT比1加上某个epsilon大，","start":2485.13,"end":2486.63},{"id":264,"text":"it's called epsilon high.","zh":"这就被称为高epsilon的情况。","start":2486.77,"end":2487.45},{"id":265,"text":"And then in this case, or maybe let's say,","zh":"在这种情况下，或者也许比如说，","start":2488.21,"end":2490.81},{"id":266,"text":"Sometimes this is like 0.2 or 0.28, something like that.","zh":"有时候这个值像0.2或0.28，类似这样的数值。","start":2490.91,"end":2493.33},{"id":267,"text":"So basically, if RT is already larger than 1.28,","zh":"所以基本上，如果RT已经大于1.28，","start":2493.89,"end":2495.03},{"id":268,"text":"If you do this case, it means that your current,","zh":"如果你这样做，这意味着你的当前","start":2495.47,"end":2498.69},{"id":269,"text":"direction I don't want to risk the the instability to or some kind of","zh":"方向我不想冒险导致不稳定或某种类型的","start":2498.81,"end":2501.51},{"id":270,"text":"is doing not as good as the old policy.","zh":"表现不如旧策略。","start":2502.05,"end":2504.17},{"id":271,"text":"So that's why you have to increase the policy.","zh":"这就是为什么你必须提升策略。","start":2504.89,"end":2506.79},{"id":272,"text":"is smaller than one, okay, there are actually many cases,","zh":"如果它小于1，好的，实际上有很多情况，","start":2506.79,"end":2512.33},{"id":273,"text":"but let's say you are smaller than epsilon high,","zh":"但假设你小于epsilon high，","start":2512.33,"end":2513.43},{"id":274,"text":"something like this.","zh":"类似这样的情况。","start":2513.59,"end":2515.05},{"id":275,"text":"And then in this case, or maybe let's say,","zh":"然后在这种情况下，或者也许我们可以说，","start":2515.17,"end":2516.43},{"id":276,"text":"maybe for simplicity, let's say this is smaller than 0.5.","zh":"也许为了简单起见，我们假设这个值小于0.5。","start":2517.31,"end":2518.85},{"id":277,"text":"Suppose, let's do this case.","zh":"假设，我们来做这个情况。","start":2519.03,"end":2520.01},{"id":278,"text":"apply the gradient of this surrogate loss. Let's say maybe this is called this JPPO. So you apply this JPPO with respect to theta. Or maybe in some sense, for this particular action, you just basically apply nabla t
