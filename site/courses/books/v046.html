now the last one. All right.","zh":"不过，对于一般的k，注意这里我们将使用的一个概念，即k减1个类别总是决定了另一个类别。为什么？这是因为这是一个概率分布。它们位于单纯形上。它们的和为1。因此，当你有k个类别时，你实际上只有k减1个自由参数，因为它们的和必须为1。因此，你总是知道最后一个。好的。","start":3517.05,"end":3537.16},{"id":231,"text":"So with this observation, you can run multinomials and all the rest. And everything we learned in the first part about how to do inference training and all the rest, super easy. Same thing that we've done. You run the error modes. You do all the stuff. You do the derivatives. Off to the races you go. Life is good. You may have to do that in your homework, I think. But anyway. All right. So how does the logistic regression work? So we're in this form. What's the idea? Well, we're going to divide by the top.","zh":"有了这个观察，你可以运行多项式以及所有其他内容。并且我们第一部分中学到的所有关于如何进行推理训练等内容，都非常容易。和我们之前所做的完全一样。你运行误差模式。你做所有的事情。你计算导数。然后你就可以开始行动了。生活很美好。我认为你们可能需要在作业中完成这个。但无论如何。好的。那么逻辑回归是如何工作的？我们处于这种形式中。想法是什么？我们将会除以顶部。","start":3538.25,"end":3565.39}],"notes":["本段讨论了特征扩展与参数数量之间的关系，指出随着特征的扩展，引入的参数也会增加。同时，提到在课程的第10周左右，会开始看到能够扩展空间的模型，例如图像或文本的特征化过程。","讲者强调了在机器学习中，x通常代表一个单独的数据点，而大写的X则代表一个矩阵。这有助于区分单个样本和整个数据集的表示方式。","讲者提到，传统的特征化方法在分类任务中是与分类模型一起学习的，这属于更高级的主题。这表明在某些模型中，特征提取和分类是同时进行的。","讲者指出，当k=2时，多类分类与逻辑回归的处理方式不同，这可能引起混淆。因此，需要明确区分不同情况下的处理方式。","讲者提到，对于k个类别，实际上只有k-1个自由参数，因为概率分布必须满足总和为1的条件。这有助于理解多类分类模型的结构。","讲者强调了在处理多类分类问题时，可以利用之前学到的推理和训练方法，这使得模型的构建和训练过程更加简单。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3396.66,"end":3565.39,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":3396.66,"text":"so that you can dot product them and do this. The more you expand the features, the more parameters"},{"start":3400.92,"text":"you introduce that will be true up until about week 10 or maybe sorry about lecture 10 and then"},{"start":3407.06,"text":"you'll start to see models that really expand the space so like some of the models we're talking"},{"start":3410.52,"text":"about here they are things where you give in an image or a piece of text and so that image or"},{"start":3415.62,"text":"piece of text the traditional featurizations are actually learned along with the classification"},{"start":3420.0,"text":"which is a more advanced topic wonderful question you got it exactly right it's clear to me you"},{"start":3425.02,"text":"You understand it perfectly."},{"start":3428.79,"text":"Here, x is just, the way I'm doing this is x is an individual value. This is a wonderful question. So this is scoring a particular example. So the idea here is I have one example from my data set. x will always be just one example. Capital X will be a matrix, notationally."},{"start":3442.46,"text":"We hope, you know, bugs aside. So X here is going to be one example. And it's saying this example where I've shown you some image or I've shown you, you know, some house or whatever it is. Theta dot X is classifying that here as what we want to deal with. So this could be a piece of text. Is it about a dog, a cat, a car, or a bus or something like this? This would be for that one image or that one piece of text. X would be its featurization. So X is the data point."},{"start":3470.2,"text":"You could compute theta Tx. That would be computing it for every data point at once. That's logically okay if it's a matrix. It's not wrong. We will use that notation too. Cool. Awesome. Great work. You guys are all over this."},{"start":3486.81,"text":"Okay, so one thing that was brought up, which was a wonderful question earlier, is what happens in the k equals 2 case? It would be super weird if I told you multi-class classification, and then when k is equal to 3, it does something, but then when k is equal to 2, it does something totally different than logistic regression. And so I have a couple of slides here to say that it's actually what we would say formally is conservative. That's a fancy way of saying that, in fact, you can write this function exactly in our familiar form. And I'm going to do it in one slide."},{"start":3517.05,"text":"For general k, though, notice that there's this thing that we're going to use here, which is that k minus 1 classes always determine the other one. Why? It's a probability distribution. They live on the simplex. They add up to 1. So you only really have, when you have k classes, you really only have k minus 1 free parameters because they have to add up to 1. So you always know the last one. All right."},{"start":3538.25,"text":"So with this observation, you can run multinomials and all the rest. And everything we learned in the first part about how to do inference training and all the rest, super easy. Same thing that we've done. You run the error modes. You do all the stuff. You do the derivatives. Off to the races you go. Life is good. You may have to do that in your homework, I think. But anyway. All right. So how does the logistic regression work? So we're in this form. What's the idea? Well, we're going to divide by the top."}],"speech_gaps":[],"frame":"../frames/v046/021.webp","frame_time":3408.66},{"title":"指数族、广义线性模型与分类","segments":[{"id":232,"text":"We'll divide by one of the values. So we'll get theta 1 minus theta 2, say. We'll see here that these are the same value. So I've just divided by 1, just dividing by the same thing over itself. So it's just dividing by 1. Then I substitute here that I have a new theta, which is going to be the difference between theta 1 and theta 2. So if you imagine that there were actually two hyperplanes, I now collapse them and say there's a new difference. And then, boom, that gets me down to logistic regression.","zh":"我们将其中一个值除掉。因此，我们会得到 theta1 减去 theta2，比如说。我们会看到这些值是相同的。因此，我只是除以 1，也就是将同一个东西除以自身。因此，这相当于除以 1。然后，我在这里代入一个新的 theta，它将是 theta1 和 theta2 的差值。如果你想象实际上存在两个超平面，我现在将它们合并，并说存在一个新的差值。然后，就这样，这让我得到了逻辑回归。","start":3566.21,"end":3594.9},{"id":233,"text":"Okay? So this is algebraic, but it's basically saying these two models would assign the same probabilities everywhere. So this is a sense in which a two-class, multi-class classification is exactly logistic regression, and this is an appropriate generalization of that fact. Cool? All right. All right. So let me see. All right. So how do you train this thing? There's the kind of machinery that you can run through, which is exactly the same ones that we did in this class.","zh":"明白了吗？所以这是代数运算，但基本上是在说这两个模型在任何地方都会分配相同的概率。因此，这在某种意义上，一个二分类或多分类问题就是逻辑回归，这是对这一事实的适当推广。明白了吗？好的。好的。那么，我该如何训练这个模型呢？你可以使用与我们在本课堂中使用的相同的机制。","start":3596.43,"end":3626.94},{"id":234,"text":"But you can also think about it, because you're doing maximum likelihood, is that you're maximizing the probability of the given class. So how does it work intuitively? Intuitively, what should I do, right? So let's say I show you an image.","zh":"但你也可以这样思考，因为你在做最大似然估计，所以你是在最大化给定类别的概率。那么，它如何直观地工作呢？直观上，我应该怎么做呢？比如说，我给你看一张图片。","start":3627.74,"end":3639.76},{"id":235,"text":"and I say that it's a cat, then you know theta1 is the one that's supposed to have the right answer, and the rest of them should have the wrong answer. So if all of a sudden my model says it's not a cat, it's a dog, I should somehow change the parameters for dog so that it avoids calling this thing a cat over time, and I should potentially up the probability of the cat. Clear enough?","zh":"我说这是猫，那么你知道 theta1 应该是那个给出正确答案的，其余的都应该给出错误答案。所以，如果我的模型突然说这不是猫，而是狗，我应该以某种方式调整狗的参数，以避免在将来将这个东西误认为猫，同时我应该潜在地提高猫的概率。清楚吗？","start":3640.53,"end":3664.97},{"id":236,"text":"Okay. So that is encountered with another thing that you're likely to find in your favorite PyTorch libraries called cross entropy. It will derive exactly from this. It's just taking logs across exactly this form. There's a privileged p-hat here. That's going to come out exactly from the p is the label, and that's a one-hot vector. So right now, only one of these terms survives.","zh":"好的。因此，这会遇到你可能在最喜欢的 PyTorch 库中找到的另一个东西，称为交叉熵。它将直接由此推导而来。它只是对这种形式取对数。这里有一个特权的 p-hat，它将直接来自于 p 是标签，而这是一个 one-hot 向量。因此，目前只有一个项会存活下来。","start":3665.51,"end":3687.05},{"id":237,"text":"That won't be true in a second. But for right now, what's saying is, I imagine that I'm basically saying, whichever one gives me the best score, I'm going to try and optimize. And because the probability has all the terms in it, it's going to drive me in the right direction. Just exactly what we've been doing before, maximize the probability. We did in logistic regression, same thing, just doing it for a class. The one hot says, pick something out. Just a convenient way to write them all down when I sum. All right.","zh":"这在下一秒就不会是真的了。但目前，我想说的是，我基本上是在说，无论哪一个能给我最好的得分，我都会尝试去优化。而因为概率包含了所有的项，它会引导我朝着正确的方向前进。这正是我们之前一直在做的事情，最大化概率。我们在逻辑回归中也做过同样的事情，只不过这次是针对一个类别。独热编码表示，选择一个东西出来。这只是一个方便的方式，当我进行求和时，可以将它们全部写下来。好了。","start":3687.82,"end":3715.63},{"id":238,"text":"All right, so it's the same. I'm not going to go through it again. One trick here is, now, what does that look like, maximizing the probability of the class? Intuitively, what happens is,","zh":"好了，所以它是一样的。我不会再重复一遍了。这里的一个技巧是，现在，最大化类别概率看起来是什么样子的？直观上会发生什么，","start":3716.6,"end":3733.27}],"notes":["本段讲解了如何通过代数操作将两个超平面合并为一个，从而得到逻辑回归模型。讲者指出，这种操作本质上是将两个参数差值作为新的参数，从而简化模型结构。","讲者强调，这种代数操作使得两个模型在所有点上分配的概率相同，因此可以将多类分类问题视为逻辑回归的推广。","在训练模型时，讲者提到最大似然估计是核心方法，即最大化给定类别的概率。通过直观例子，讲者说明了模型如何调整参数以避免错误分类。","讲者进一步解释了交叉熵损失函数的来源，指出其本质上是取对数后的概率形式，并强调了one-hot编码在多类分类中的作用。","讲者指出，在当前情况下，只有与真实标签对应的项会存活，而其他项会被忽略。这为后续的优化过程提供了基础。","最后，讲者提到最大化概率的过程与逻辑回归中的方法一致，强调了one-hot编码在将多个类别的概率统一表示中的便利性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3566.21,"end":3733.27,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3566.21,"text":"We'll divide by one of the values. So we'll get theta 1 minus theta 2, say. We'll see here that these are the same value. So I've just divided by 1, just dividing by the same thing over itself. So it's just dividing by 1. Then I substitute here that I have a new theta, which is going to be the difference between theta 1 and theta 2. So if you imagine that there were actually two hyperplanes, I now collapse them and say there's a new difference. And then, boom, that gets me down to logistic regression."},{"start":3596.43,"text":"Okay? So this is algebraic, but it's basically saying these two models would assign the same probabilities everywhere. So this is a sense in which a two-class, multi-class classification is exactly logistic regression, and this is an appropriate generalization of that fact. Cool? All right. All right. So let me see. All right. So how do you train this thing? There's the kind of machinery that you can run through, which is exactly the same ones that we did in this class."},{"start":3627.74,"text":"But you can also think about it, because you're doing maximum likelihood, is that you're maximizing the probability of the given class. So how does it work intuitively? Intuitively, what should I do, right? So let's say I show you an image."},{"start":3640.53,"text":"and I say that it's a cat, then you know theta1 is the one that's supposed to have the right answer, and the rest of them should have the wrong answer. So if all of a sudden my model says it's not a cat, it's a dog, I should somehow change the parameters for dog so that it avoids calling this thing a cat over time, and I should potentially up the probability of the cat. Clear enough?"},{"start":3665.51,"text":"Okay. So that is encountered with another thing that you're likely to find in your favorite PyTorch libraries called cross entropy. It will derive exactly from this. It's just taking logs across exactly this form. There's a privileged p-hat here. That's going to come out exactly from the p is the label, and that's a one-hot vector. So right now, only one of these terms survives."},{"start":3687.82,"text":"That won't be true in a second. But for right now, what's saying is, I imagine that I'm basically saying, whichever one gives me the best score, I'm going to try and optimize. And because the probability has all the terms in it, it's going to drive me in the right direction. Just exactly what we've been doing before, maximize the probability. We did in logistic regression, same thing, just doing it for a class. The one hot says, pick something out. Just a convenient way to write them all down when I sum. All right."},{"start":3716.6,"text":"All right, so it's the same. I'm not going to go through it again. One trick here is, now, what does that look like, maximizing the probability of the class? Intuitively, what happens is,"}],"speech_gaps":[],"frame":"../frames/v046/022.webp","frame_time":3578.21},{"title":"指数族、广义线性模型与分类","segments":[{"id":239,"text":"I have a class. I'm just going to do three classes. You have A, B, and C. And so when I do that probability, my model may predict a little bit of A, a little bit of B, a little bit of C. These should add up to one. My drawings don't add up to one, but this should add up to one. Okay. And what happens when I do the traditional way of training it is that I say, okay, maybe A was correct. So my model is great. So I just pay for the probability here and I try to increase it.","zh":"我有一个类别。我打算做三个类别。你有A、B和C。当我进行概率计算时，我的模型可能会预测一点A、一点B、一点C。这些概率应该加起来等于1。我的画图没有加起来等于1，但理论上应该加起来等于1。好的。当我用传统方法训练模型时，我会说，也许A是正确的。因此我的模型很好。所以我只需支付这个概率的代价，并尝试提高它。","start":3734.47,"end":3758.89},{"id":240,"text":"That's the way I'm training. I just zeroed out the rest. That is the content of the fact that it's one hot and that I'm only going to pay log of the probability of that particular element.","zh":"这就是我训练模型的方式。我把其余部分归零了。这就是所谓的独热编码（one hot）的事实内容，即我只支付该特定元素的概率的对数。","start":3759.49,"end":3767.77},{"id":241,"text":"When I do that, it seems like I threw away some other information. And there was also this question, which I thought was a great question, which says, hey, what if it's a cat or a dog? What if it's close? I don't know if there is something that looks like simultaneously a cat and a dog. I imagine that's possible. I'm trying to picture it right now, and I can't. But I can imagine a model getting confused between a cat and a dog. I'm not going to describe what I'm picturing. That's a stupid waste of time. But in any case, you can imagine the model is confused about cats and dogs. At that point, I'm throwing information away. If I, for example, had all the animals in the universe,","zh":"当我这样做时，似乎我丢弃了一些其他信息。还有一个问题，我认为这是一个很好的问题，它问：如果它是猫或狗呢？如果它很接近呢？我不确定是否存在同时看起来像猫和狗的东西。我现在试着想象一下，但我想象不出来。但我想像一个模型在猫和狗之间感到困惑。我不打算描述我所想象的画面。那是浪费时间。但无论如何，你可以想象模型在猫和狗之间感到困惑。在这种情况下，我丢弃了信息。例如，如果我拥有宇宙中所有的动物作为类别，","start":3771.28,"end":3799.48},{"id":242,"text":"as classes, somehow I'm like, I'm sure it's a cat or a dog, but I'm not sure of the rest of the stuff. So that's one thing. And so if the model were saying, well, it's a cat or a dog, but it's also insisting it's a car, I should somehow want to maybe penalize that more. So there are ideas here where I'm saying you could penalize the losses a little bit differently if you had some distribution over what you want to do.","zh":"我可能会想，我确定它是猫或狗，但不确定其他的东西。这是其中一点。因此，如果模型说，它既是猫又是狗，但还坚持它是汽车，我应该以某种方式更严厉地惩罚这种情况。因此，这里有一些想法，即如果你对想要做的事情有一些分布，你可以以稍微不同的方式惩罚损失。","start":3799.98,"end":3824.88},{"id":243,"text":"Now, label smoothing does something actually that's quite a bit simpler. What label smoothing does is says instead of having the true distribution be 1 here, so this is the traditional distribution, this is exactly 1, this is the label, it says take that mass and spread it out and say, okay, there's 1 minus 2 epsilon here, and then I'll put next to it epsilon, epsilon.","zh":"现在，标签平滑（label smoothing）实际上做的是一个相当简单的操作。标签平滑所做的就是，而不是让真实分布在这里为1，这是传统的分布，这是精确的1，这是标签，它会将这个质量分散开来，并说，好吧，这里有1减去2 epsilon，然后我会在旁边放上epsilon，epsilon。","start":3825.29,"end":3861.78},{"id":244,"text":"So yeah, so there's one thing, this is a great question, says, well, maybe it's for overfitting.","zh":"所以是的，这是一件非常好的事情，这个问题很好，也许这是为了防止过拟合。","start":3863.93,"end":3867.15},{"id":245,"text":"So yeah, so there's one thing, this is a great question, says, well, maybe it's for overfitting.","zh":"所以是的，这是一件非常好的事情，这个问题很好，也许这是为了防止过拟合。","start":3867.27,"end":3870.75},{"id":246,"text":"And indeed, this performs a type of what you'll learn is called regularization.","zh":"事实上，这会执行一种你将要学习的称为正则化的方法。","start":3871.03,"end":3875.33},{"id":247,"text":"So what this will do is prevent you from really overfitting and driving the model to like","zh":"所以这会防止你过度拟合，并将模型推向像","start":3875.33,"end":3876.77},{"id":248,"text":"So like the cat, you know, there are a couple of things that could be wrong.","zh":"比如猫，你知道，有一些事情可能是错的。","start":3876.93,"end":3879.83},{"id":249,"text":"So like the cat, you know, there are a couple of things that could be wrong.","zh":"比如猫，你知道，有一些事情可能是错的。","start":3880.25,"end":3882.97},{"id":250,"text":"So there's some probability that some part of your data is actually incorrect.","zh":"所以你的数据中某些部分实际上是错误的概率存在。","start":3883.09,"end":3885.99},{"id":251,"text":"So there's some probability that some part of your data is actually incorrect.","zh":"所以你的数据中某些部分实际上是错误的概率存在。","start":3886.29,"end":3889.73},{"id":252,"text":"So adding a little label noise makes the model a little bit more honest about it.","zh":"所以添加一点标签噪声会使模型在某种程度上更加诚实。","start":3889.83,"end":3892.61},{"id":253,"text":"The other is if you think about the dynamics of how gradients train,","zh":"另一个方面是，如果你考虑梯度训练的动力学过程，","start":3892.61,"end":3897.45},{"id":254,"text":"if you trained on like take a model and just feed it one example and train and train and train and","zh":"如果你在一个模型上只喂入一个例子，然后不断训练、训练、训练，","start":3897.45,"end":3901.45},{"id":255,"text":"train and train on that one example it's going to drive to a particularly odd version right it's","zh":"不断在那个单一例子上训练，它会趋向于一个特别奇怪的版本，对吧？它会趋向于那个数据点版本的猫，这至少在某种程度上将它限制在一个区域内，","start":3901.45,"end":3905.67},{"id":256,"text":"going to drive to the data point version of the cat this at least kind of keeps it in a in a kind","zh":"并在这小小的不确定性上进行平滑处理，我们稍后会在课程中看到这一点。","start":3905.67,"end":3910.81},{"id":257,"text":"of a neighborhood and smooths out over that that little bit of uncertainty we'll see later in the","zh":"在一个邻域内并在此后我们将看到的那一点不确定性上平滑化","start":3910.81,"end":3914.17}],"notes":["本段讨论了分类任务中模型预测多个类别概率的分布问题，强调了概率分布应加和为1。讲者指出，传统训练方法中，模型只关注正确类别的概率，而忽略了其他信息，这可能导致模型过拟合。"],"formulas":[],"uncertainties":["train and train on that one example it's going to drive to a particularly odd version right it's"],"diagram":"none","start":3734.47,"end":3914.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3734.47,"text":"I have a class. I'm just going to do three classes. You have A, B, and C. And so when I do that probability, my model may predict a little bit of A, a little bit of B, a little bit of C. These should add up to one. My drawings don't add up to one, but this should add up to one. Okay. And what happens when I do the traditional way of training it is that I say, okay, maybe A was correct. So my model is great. So I just pay for the probability here and I try to increase it."},{"start":3759.49,"text":"That's the way I'm training. I just zeroed out the rest. That is the content of the fact that it's one hot and that I'm only going to pay log of the probability of that particular element."},{"start":3771.28,"text":"When I do that, it seems like I threw away some other information. And there was also this question, which I thought was a great question, which says, hey, what if it's a cat or a dog? What if it's close? I don't know if there is something that looks like simultaneously a cat and a dog. I imagine that's possible. I'm trying to picture it right now, and I can't. But I can imagine a model getting confused between a cat and a dog. I'm not going to describe what I'm picturing. That's a stupid waste of time. But in any case, you can imagine the model is confused about cats and dogs. At that point, I'm throwing information away. If I, for example, had all the animals in the universe,"},{"start":3799.98,"text":"as classes, somehow I'm like, I'm sure it's a cat or a dog, but I'm not sure of the rest of the stuff. So that's one thing. And so if the model were saying, well, it's a cat or a dog, but it's also insisting it's a car, I should somehow want to maybe penalize that more. So there are ideas here where I'm saying you could penalize the losses a little bit differently if you had some distribution over what you want to do."},{"start":3825.29,"text":"Now, label smoothing does something actually that's quite a bit simpler. What label smoothing does is says instead of having the true distribution be 1 here, so this is the traditional distribution, this is exactly 1, this is the label, it says take that mass and spread it out and say, okay, there's 1 minus 2 epsilon here, and then I'll put next to it epsilon, epsilon. Intuitively, why might I want to do that? Please."},{"start":3863.93,"text":"So yeah, so there's one thing, this is a great question, says, well, maybe it's for overfitting."},{"start":3867.27,"text":"And indeed, this performs a type of what you'll learn is called regularization."},{"start":3871.03,"text":"So what this will do is prevent you from really overfitting and driving the model to like"},{"start":3875.33,"text":"exactly predict the cat, right?"},{"start":3876.93,"text":"So like the cat, you know, there are a couple of things that could be wrong."},{"start":3880.25,"text":"This may not be, this may be an incorrect label."},{"start":3883.09,"text":"So there's some probability that some part of your data is actually incorrect."},{"start":3886.29,"text":"So adding a little label noise makes the model a little bit more honest about it."},{"start":3889.83,"text":"The other is if you think about the dynamics of how gradients train,"},{"start":3892.61,"text":"if you trained on like take a model and just feed it one example and train and train and train and"},{"start":3897.45,"text":"train and train on that one example it's going to drive to a particularly odd version right it's"},{"start":3901.45,"text":"going to drive to the data point version of the cat this at least kind of keeps it in a in a kind"},{"start":3905.67,"text":"of a neighborhood and smooths out over that that little bit of uncertainty we'll see later in the"},{"start":3910.81,"text":"course that you can smooth out uncertainty in other ways but you got it exactly right this"}],"speech_gaps":[],"frame":"../frames/v046/023.webp","frame_time":3746.47},{"title":"指数族、广义线性模型与分类","segments":[{"id":258,"text":"A little bit of regularization will prevent me from overfitting, maybe trusting too much in that","zh":"一点正则化将防止我过度拟合，也许是我过于信任那个特征化方法。","start":3914.17,"end":3918.45},{"id":259,"text":"featurization. So this is an extremely common thing and I bring it up because it's so common","zh":"这是极其常见的事情，我之所以提到它是因为它如此常见。","start":3918.45,"end":3924.05},{"id":260,"text":"that if you use a neural net library or you sort of train, you're going to see it like this is a","zh":"如果你使用神经网络库或者你大致进行训练，你将会看到这是一个你将能够访问的东西，即你想要如何平滑你的标签。","start":3924.05,"end":3929.79},{"id":261,"text":"thing that you will have access to is how you want to smooth your labels and it's a surprisingly good","zh":"你将能够接触到的东西是如何对标签进行平滑处理，这出乎意料地效果很好","start":3929.79,"end":3933.67},{"id":262,"text":"All right, perfect.","zh":"好的，完美。","start":3938.82,"end":3939.78},{"id":263,"text":"OK, so on that note, we saw exponential families","zh":"好的，那么在这一点上，我们看到了指数族，","start":3941.9,"end":3945.82},{"id":264,"text":"that gave us a path to generalize","zh":"这为我们提供了一条泛化的方法。","start":3945.82,"end":3947.42},{"id":265,"text":"to a wider class of models.","zh":"扩展到更广泛模型类别的路径。","start":3947.42,"end":3948.56},{"id":266,"text":"Oh, please, go ahead.","zh":"哦，好吧，继续吧。","start":3948.68,"end":3949.2},{"id":267,"text":"Yeah, I thought that you said about changing 1 minus 2","zh":"是的，我想你刚才说的是关于改变 1 减去 2 epsilon，epsilon，epsilon。","start":3949.52,"end":3952.34},{"id":268,"text":"epsilon, epsilon, epsilon.","zh":"是的。","start":3952.34,"end":3953.18},{"id":269,"text":"Yeah.","zh":"那是吗？","start":3953.42,"end":3953.74},{"id":270,"text":"Is that a ?","zh":"抱歉，我有个问题。","start":3954.36,"end":3956.0},{"id":271,"text":"Sorry, I had a question.","zh":"我忘记了。","start":3959.28,"end":3960.08},{"id":272,"text":"I forgot it.","zh":"哦，所以是的。","start":3960.18,"end":3960.56},{"id":273,"text":"Oh, so yeah.","zh":"哦，所以是的。","start":3960.68,"end":3961.28},{"id":274,"text":"Do you want to know mechanically how it works?","zh":"你想知道它是如何运作的吗？","start":3961.64,"end":3963.54},{"id":275,"text":"Is that the?","zh":"是这个吗？","start":3963.58,"end":3963.94},{"id":276,"text":"Yes.","zh":"是的。","start":3965.64,"end":3966.0},{"id":277,"text":"Yeah, so when it's 1 hot, here it's","zh":"是的，所以当它是1热的时候，这里就是","start":3966.38,"end":3968.46},{"id":278,"text":"written down here, you plug it yeah, you plug it into p where instead the one hot vector this","zh":"写在这里，你把它插到 p 中，而不是 one-hot 向量，这里的符号表示","start":3968.46,"end":3974.5},{"id":279,"text":"notation goes from being kind of you know superfluous and having like a bunch of extra","zh":"从一种有点多余的形式，带有许多额外的","start":3974.5,"end":3978.74},{"id":280,"text":"stuff here, you plug it in right there where instead you just put the numbers in the distribution and","zh":"内容，你直接在这里插入它，而不是把数字插入分布中，","start":3978.74,"end":3983.96},{"id":281,"text":"you get a mixture of all these characters down here at the bottom right, so you would get all","zh":"你就会在右下角得到所有这些字符的混合，因此你会得到所有","start":3983.96,"end":3989.0},{"id":282,"text":"the characters that are down here at the bottom with different weights and those weights would","zh":"这里底部有不同权重的字符，这些权重会帮助你直观地区分猫、狗等等，对吧，而且你也可以通过这种方式进行操作","start":3989.0,"end":3992.76},{"id":283,"text":"help you intuitively wait between cat, dog, and so on right, and you could do this by the way if","zh":"如果你有更多的信息的话，所以我们在谈论标签为了正则化目的而激动地移动","start":3992.76,"end":3998.38},{"id":284,"text":"you had more information, so we're talking about labels moving excitedly for regularization reasons","zh":"正如之前提到的，但如果确实有一个分布表明，无论出于什么原因，我知道它是猫或狗，但我知道它不是卡车或汽车，你也可以将这些信息纳入交叉熵中，这是可以做的事情，请","start":3998.38,"end":4002.4},{"id":285,"text":"as was mentioned earlier, but if you did have a distribution that said I know it's a cat or","zh":"如果你实际计算对数和其他一切，你会得到确切的这个公式。没有任何东西被隐藏了。这就是我们之前讨论过的损失函数","start":4002.4,"end":4006.78},{"id":286,"text":"a dog for whatever reason, but I know it's not a truck or a car, you could also incorporate","zh":"如果你确实有一个分布表明，无论出于什么原因，我知道它是猫或狗，但我知道它不是卡车或汽车，你也可以将这些信息纳入交叉熵中，这是可以做的事情，请","start":4006.78,"end":4011.32},{"id":287,"text":"that information into the cross entropy that would be a valid thing to do, please","zh":"如果你实际计算对数和其他一切，你会得到确切的这个公式。没有任何东西被隐藏了。这就是我们之前讨论过的损失函数","start":4011.32,"end":4015.56},{"id":288,"text":"it is so if you actually go through and compute the logs and everything else, you'll get exactly","zh":"如果你实际计算对数和其他一切，你会得到确切的这个公式。没有任何东西被隐藏了。这就是我们之前讨论过的损失函数","start":4020.58,"end":4024.62},{"id":289,"text":"exactly this formula. Nothing's been hidden from you. This is the loss function as we talked about","zh":"如果你实际计算对数和其他一切，你会得到确切的这个公式。没有任何东西被隐藏了。这就是我们之前讨论过的损失函数","start":4024.62,"end":4029.22},{"id":290,"text":"before. This loss function would give you logistic regression as we did before if we're two classes.","zh":"之前。如果我们将它用于两类问题，这个损失函数就会给出我们之前所做的逻辑回归。","start":4029.22,"end":4034.18},{"id":291,"text":"And in general, it's exactly as we said, once you've picked the GLM family, you just run exactly","zh":"一般来说，正如我们所说，一旦你选择了广义线性模型（GLM）家族，你只需运行完全相同的步骤。","start":4034.48,"end":4040.7},{"id":292,"text":"the same crank. You get exactly the same errors, you maximum likelihood, and this is the thing that","zh":"你会得到完全相同的误差，最大似然估计，这就是事情的自然结果。","start":4040.7,"end":4044.96},{"id":293,"text":"falls out. It's just me saving you or saving myself from having to do a couple of pages of","zh":"我只是在帮你或自己省去几页或几段推导的麻烦。","start":4044.96,"end":4050.44},{"id":294,"text":"or a couple of bits of derivation.","zh":"它并不是一个复杂的推导。","start":4050.44,"end":4052.28},{"id":295,"text":"It's not a complicated derivation.","zh":"取对数，取导数，你就完成了。","start":4052.32,"end":4053.18},{"id":296,"text":"Take the logs, take the derivatives, you're done.","zh":"是的。","start":4053.3,"end":4055.2},{"id":297,"text":"Yeah.","zh":"是的。","start":4055.44,"end":4055.58},{"id":298,"text":"Great questions.","zh":"很好的问题。","start":4057.62,"end":4058.36},{"id":299,"text":"Other questions?","zh":"还有其他问题吗？","start":4058.5,"end":4058.98},{"id":300,"text":"Please.","zh":"请。","start":4060.12,"end":4060.52},{"id":301,"text":"Is the x equals j, is the x referring","zh":"x等于j，这里的x指的是","start":4060.98,"end":4064.1},{"id":302,"text":"to the label of the?","zh":"标签吗？","start":4064.1,"end":4066.64},{"id":303,"text":"JASON KUO: Yeah, that notation's not very good.","zh":"JASON KUO：是的，这种记号不太好。","start":4067.14,"end":4068.7},{"id":304,"text":"Yeah, that's basically saying x has label j.","zh":"是的，这基本上是在说x有标签j。","start":4068.82,"end":4071.3},{"id":305,"text":"I don't like that notation either.","zh":"我也不同意这种记号。","start":4071.68,"end":4073.48},{"id":306,"text":"It should be a y, though.","zh":"不过应该是一个y。","start":4073.66,"end":4075.24},{"id":307,"text":"Yeah.","zh":"是的。","start":4075.3,"end":4075.46},{"id":308,"text":"There's a reason that dimensional modeling is for software in the first place, just to make sure the lines are positive and to get that psyche.","zh":"之所以首先在软件中使用维度建模，就是为了确保线条是正的，并获得那种心理感受。","start":4079.02,"end":4085.92}],"notes":["本段主要讨论了正则化在防止过拟合中的作用，以及特征工程的重要性。讲者提到，使用神经网络库时，正则化是一个常见的做法，可以平滑标签，效果很好。此外，讲者还提到，当使用广义线性模型（GLM）时，只需运行相同的推导过程，就能得到相同的误差和最大似然估计，这简化了推导过程。","讲者进一步解释了如何通过将一个热编码（one-hot encoding）向量代入概率分布中，得到不同标签的加权混合分布。这种做法可以用于分类任务，如区分猫、狗等类别。讲者还提到，如果拥有更多信息，可以将这些信息整合到交叉熵损失函数中，从而改进模型。","讲者强调，正则化不仅用于标签平滑，还可以用于其他目的，如防止模型过度依赖某些特征。此外，讲者指出，使用正确的符号（如用y表示标签）可以提高模型的可读性和准确性。","讲者还提到，维度建模在软件中的应用，主要是为了确保模型的输出为正值，并且能够捕捉到数据中的某些特性。这表明，模型设计需要考虑符号和表示方式的合理性。","讲者在讨论正则化和标签平滑时，强调了这些技术在实际应用中的重要性，并指出它们可以显著提高模型的泛化能力。此外，讲者还提到，通过正确的推导过程，可以得到损失函数的具体形式，而无需进行复杂的计算。","最后，讲者回应了关于符号表示的问题，指出使用x表示标签是不合适的，应该使用y。这表明，在机器学习中，符号的使用需要符合惯例，以避免混淆。"],"formulas":[],"uncertainties":["Is that a ?","Is that the?"],"diagram":"none","start":3914.17,"end":4085.92,"asr_flags":[],"math_clarifications":["原始文本中提到的损失函数与交叉熵相关，但未明确说明其具体形式或适用条件。公式中的符号和索引需要更多上下文来验证其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":51,"raw_segments":[{"start":3914.17,"text":"little bit of regularization will prevent me from overfitting maybe trusting too much in that"},{"start":3918.45,"text":"featurization. So this is an extremely common thing and I bring it up because it's so common"},{"start":3924.05,"text":"that if you use a neural net library or you sort of train you're going to see it like this is a"},{"start":3929.79,"text":"thing that you will have access to is how you want to smooth your labels and it's a surprisingly good"},{"start":3938.82,"text":"All right, perfect."},{"start":3941.9,"text":"OK, so on that note, we saw exponential families"},{"start":3945.82,"text":"that gave us a path to generalize"},{"start":3947.42,"text":"to a wider class of models."},{"start":3948.68,"text":"Oh, please, go ahead."},{"start":3949.52,"text":"Yeah, I thought that you said about changing 1 minus 2"},{"start":3952.34,"text":"epsilon epsilon epsilon."},{"start":3953.42,"text":"Yeah."},{"start":3954.36,"text":"Is that a ?"},{"start":3959.28,"text":"Sorry, I had a question."},{"start":3960.18,"text":"I forgot it."},{"start":3960.68,"text":"Oh, so yeah."},{"start":3961.64,"text":"Do you want to know mechanically how it works?"},{"start":3963.58,"text":"Is that the?"},{"start":3965.64,"text":"Yes."},{"start":3966.38,"text":"Yeah, so when it's 1 hot, here it's"},{"start":3968.46,"text":"written down here you plug it yeah you plug it into p where instead the one hot vector this"},{"start":3974.5,"text":"notation goes from being kind of you know superfluous and having like a bunch of extra"},{"start":3978.74,"text":"stuff here you plug it in right there where instead you just put the numbers in the distribution and"},{"start":3983.96,"text":"you get a mixture of all these characters down here at the bottom right so you would get all"},{"start":3989.0,"text":"the characters that are down here at the bottom with different weights and those weights would"},{"start":3992.76,"text":"help you intuitively wait between cat dog and so on right and you could do this by the way if"},{"start":3998.38,"text":"you had more information so we're talking about labels moving excitedly for regularization reasons"},{"start":4002.4,"text":"as was mentioned earlier but if you did have a distribution that said i know it's a cat or"},{"start":4006.78,"text":"a dog for whatever reason but i know it's not a truck or a car you could also incorporate"},{"start":4011.32,"text":"that information into the cross entropy that would be a valid thing to do please"},{"start":4020.58,"text":"it is so if you actually go through and compute the logs and everything else you'll get exactly"},{"start":4024.62,"text":"exactly this formula. Nothing's been hidden from you. This is the loss function as we talked about"},{"start":4029.22,"text":"before. This loss function would give you logistic regression as we did before if we're two classes."},{"start":4034.48,"text":"And in general, it's exactly as we said, once you've picked the GLM family, you just run exactly"},{"start":4040.7,"text":"the same crank. You get exactly the same errors, you maximum likelihood, and this is the thing that"},{"start":4044.96,"text":"falls out. It's just me saving you or saving myself from having to do a couple of pages of"},{"start":4050.44,"text":"or a couple of bits of derivation."},{"start":4052.32,"text":"It's not a complicated derivation."},{"start":4053.3,"text":"Take the logs, take the derivatives, you're done."},{"start":4055.44,"text":"Yeah."},{"start":4057.62,"text":"Great questions."},{"start":4058.5,"text":"Other questions?"},{"start":4060.12,"text":"Please."},{"start":4060.98,"text":"Is the x equals j, is the x referring"},{"start":4064.1,"text":"to the label of the?"},{"start":4067.14,"text":"JASON KUO- Yeah, that notation's not very good."},{"start":4068.82,"text":"Yeah, that's basically saying x has label j."},{"start":4071.68,"text":"I don't like that notation either."},{"start":4073.66,"text":"It should be a y, though."},{"start":4075.3,"text":"Yeah."},{"start":4079.02,"text":"There's a reason that dimensional modeling is for software in the first place, just to make sure the lines are positive and to get that psyche."}],"speech_gaps":[{"start":3956.848,"end":3958.608},{"start":4017.104,"end":4019.76}],"frame":"../frames/v046/024.webp","frame_time":3926.17},{"title":"指数族、广义线性模型与分类","segments":[{"id":309,"text":"Awesome question. Yeah. So the question is, why, why softmax? Why not something else? And, you know, in one hand, it's because it looks like it should be blunt. And what I mean by looks like it should is we have logistic regression, we have these other things which have nice properties, and you just identified exactly the right properties, the properties that has that smoothly interpolates between zero and one, it sort of bakes off all of the alternatives and kind of a clear way. There is also I would say there's one part which I kind of don't agree with. But philosophically, there was a long","zh":"非常好的问题。是的。所以问题是，为什么使用softmax？为什么不使用其他方法？一方面，这是因为看起来它应该很直接。我所说的看起来应该是指我们有逻辑回归，还有其他具有良好性质的方法，而你恰好识别出了正确的性质，即能够平滑地在零和一之间插值的性质，它基本上排除了所有其他可能性，并以一种清晰的方式呈现出来。我还要说，我认为有一部分我并不完全同意。但从哲学角度来看，有一群非常优秀的统计学家，我非常敬佩并阅读过他们的著作，他们非常热衷于通过最大熵来推导分布的不同方式。因此，对于离散情况，这些分布就是最大熵分布。这使得它们成为正确选择。它们假设最少。因此，它们具有这种指数形式……","start":4086.82,"end":4115.8},{"id":310,"text":"when there's a class of statisticians who are great and I love and I read their books, but they were really obsessed with different ways of motivating distributions through maximum entropy. And so there is a whole area for discrete things where these are the maximum entropy distributions. So that makes them right. They assume the least. And so the fact that they had this exponential form...","zh":"这在该领域非常有吸引力。最后和最重要的部分是数值上非常方便。例如，你会发现你想要的是你不希望通常趋向于零的东西。比如，想象你有一个损失函数，它所做的就是选择正确的那个，就像我们说的那样，选择最高的那个，并且不提供关于其他任何信息。你不会对那些权重进行太多的反向传播，也不会对那些权重进行太多的导数计算，你只是丢弃了信息。因此，这些平滑变化的性质让它看起来像sigmoid函数，并且是最自然的选择。","start":4116.04,"end":4136.7},{"id":311,"text":"was very nice from that the last and most important bit is extremely numerically convenient so like it turns out that what you also want is you don't want something usually that goes to zero so like imagine you had a loss that what it would do is it would pick the right one like we're saying you know pick the highest one and get and spread no information about the others you wouldn't kind of back prop into those weights as much or you wouldn't take a derivative into those weights as much you just throw information away and so those properties that kind of smoothly varies it made it look sigmoid like and most natural","zh":"刚才的讲解非常好，其中最后也是最重要的一点是非常数值上方便，所以比如说，你实际上想要的是你不希望通常趋于零的东西，比如想象你有一个损失函数，它所做的就是选择正确的那个，比如说我们所说的，选择最高的那个，并且不传播关于其他任何东西的信息，你不会太反向传播到那些权重，或者不会太对那些权重求导，你只是丢弃了信息，因此那些性质，即能够平滑地变化，使得它看起来像sigmoid函数，并且是最自然的","start":4137.02,"end":4166.2},{"id":312,"text":"I remember when I first started playing with these models way back when,","zh":"对我来说感觉非常随意。我当时意识到的并不是它是一个特殊的选择。那是","start":4166.34,"end":4170.1},{"id":313,"text":"it felt really ad hoc to me. And what I realized then wasn't that it was a special choice. That's","zh":"我想传达给你的。它确实具有良好的性质。我们使用它的原因是有道理的。","start":4170.22,"end":4175.14},{"id":314,"text":"what I'm trying to convey to you. It does have good properties. There's a reason we use it.","zh":"但随着我越来越觉得，不，它真的非常方便。它在数值上是稳定的。","start":4175.14,"end":4178.56},{"id":315,"text":"But the more I feel like, no, it's really convenient. It's numerically stable.","zh":"你必须为使用其他方法而不是它进行正当性辩护。这并不意味着你不会这么做。","start":4178.8,"end":4182.62},{"id":316,"text":"And you have to justify doing something else instead of it. It doesn't mean you won't.","zh":"它并不意味着你不会这么做。","start":4182.84,"end":4186.64},{"id":317,"text":"You will have instances where you use something different. But that's how it became the standard.","zh":"你会遇到一些使用不同方法的情况。但正是这样它才成为标准。","start":4186.78,"end":4190.94},{"id":318,"text":"Because it has exactly the properties that you mentioned.","zh":"因为它恰好具有你提到的那些性质。","start":4191.16,"end":4193.52},{"id":319,"text":"mentioned.","zh":"提到的。","start":4193.52,"end":4193.6},{"id":320,"text":"We also know how to make it more numerically stable","zh":"我们还知道如何使其更加数值稳定","start":4194.06,"end":4195.92},{"id":321,"text":"and run it fast enough and stuff like that.","zh":"并运行得足够快，以及其他类似的事情。","start":4195.92,"end":4197.26},{"id":322,"text":"It's not true of all functions.","zh":"并非所有函数都具有这样的性质。","start":4198.7,"end":4199.8},{"id":323,"text":"Wonderful questions.","zh":"非常好的问题。","start":4201.38,"end":4202.04},{"id":324,"text":"Other questions?","zh":"还有其他问题吗？","start":4202.2,"end":4202.64},{"id":325,"text":"Awesome.","zh":"太棒了。","start":4206.62,"end":4206.98},{"id":326,"text":"Please.","zh":"请。","start":4207.32,"end":4207.68},{"id":327,"text":"Matthew, I was going to talk to the label smoothing","zh":"Matthew，我本来打算和你谈谈标签平滑的结果。","start":4208.4,"end":4210.62},{"id":328,"text":"result. Do you use it overfittingly?","zh":"你是不是过度拟合了？","start":4210.62,"end":4213.3},{"id":329,"text":"It seems like it's overfitting.","zh":"看起来像是过度拟合了。","start":4213.3,"end":4214.54},{"id":330,"text":"Oh, yeah.","zh":"哦，对的。","start":4215.18,"end":4215.66},{"id":331,"text":"OK, great question.","zh":"好的，这是个很好的问题。","start":4215.72,"end":4216.32},{"id":332,"text":"So we don't have the vocabulary to talk about how","zh":"所以我们还没有词汇来谈论如何","start":4216.46,"end":4218.74},{"id":333,"text":"it reduces overfitting quite yet.","zh":"它在减少过拟合方面效果还不是很明显。","start":4218.74,"end":4220.28},{"id":334,"text":"Maybe it's next lecture or the lecture after that.","zh":"也许它会在下一次讲座或者之后的讲座中讲到。","start":4220.34,"end":4222.24},{"id":335,"text":"But I wanted to get you the intuition for how it works because you're likely to see those as kind of a bundled unit, cross entropy and label smoothing that you want to actually do these two pieces together.","zh":"但我想让你理解它是如何工作的，因为你们很可能将交叉熵和标签平滑当作一个捆绑的单元来看到，你们实际上需要将这两部分结合起来使用。","start":4222.24,"end":4231.9},{"id":336,"text":"So we'll talk a little bit about how regularization comes into the picture.","zh":"我们将稍微谈谈正则化是如何进入这个图景的。","start":4232.32,"end":4235.36},{"id":337,"text":"What I was trying to say is the intuition there of how it comes to be is if you were perfectly confident in your label and it was exactly right and there was one archetype like this is there's only one monkey in the world and this is it.","zh":"我想说的是，那种直觉是如何形成的，如果你对标签完全有信心，并且它完全正确，而且只有一个这样的原型，比如世界上只有一只猴子，而这正是它。","start":4235.6,"end":4247.54},{"id":338,"text":"right? It doesn't really make sense. But if you had that thing where you just wanted X","zh":"对吧？这并不真正有意义。但如果你有一个情况，你只是希望X","start":4247.54,"end":4250.94},{"id":339,"text":"to be exactly on top of it, you wouldn't need to do any labels.","zh":"正好位于其上，你就不需要做任何标签。","start":4250.94,"end":4253.16}],"notes":["本段主要讨论为什么使用softmax函数而不是其他函数。讲者指出softmax函数具有平滑的性质，能够将输出值映射到0到1之间，这与逻辑回归等模型的特性一致。此外，softmax函数在数学上具有指数形式，这使得它在计算上非常方便，且在数值稳定性方面表现良好。","讲者提到，softmax函数的使用并非偶然，而是因为它具有良好的性质，如平滑性、数值稳定性等。这些性质使得它成为分类任务的标准选择。同时，讲者也提到，虽然softmax函数在某些情况下可能不是最优选择，但它的优势使其成为默认选择。","讲者还提到，softmax函数在数值计算上非常方便，因为它可以避免某些计算上的问题，如数值溢出。此外，讲者还提到，softmax函数的使用在某些情况下可能需要进行调整，例如通过标签平滑来减少过拟合。","讲者提到，标签平滑是一种用于减少过拟合的技术，它通过在损失函数中引入一些噪声来防止模型对训练数据过于敏感。然而，讲者指出，目前还没有足够的词汇来详细讨论标签平滑如何减少过拟合，这可能将在后续课程中讨论。","讲者还提到，标签平滑和交叉熵损失函数通常一起使用，因为它们共同作用于模型的训练过程。此外，讲者还提到，正则化在模型训练中起着重要作用，但目前还没有足够的词汇来详细讨论这一点。","最后，讲者提到，如果对标签非常自信，并且只有一个样本，那么标签平滑可能并不适用。然而，如果希望模型对输入进行精确的预测，那么标签平滑可能是一个有用的工具。"],"formulas":[],"uncertainties":["from that the last and most important bit is extremely numerically convenient so like it turns out that what you also want is you don't want something usually that goes to zero so like imagine you had a loss that what it would do is it would pick the right one like we're saying you know pick the highest one and get and spread no information about the others you wouldn't kind of back prop into those weights as much or you wouldn't take a derivative into those weights as much you just throw information away and so those properties that kind of smoothly varies it made it look sigmoid like and most natural"],"diagram":"none","start":4086.82,"end":4253.16,"asr_flags":[319],"boards":[],"translation_complete":true,"translated_segments":31,"raw_segments":[{"start":4086.82,"text":"Awesome question. Yeah. So the question is, why, why softmax? Why not something else? And, you know, in one hand, it's because it looks like it should be blunt. And what I mean by looks like it should is we have logistic regression, we have these other things which have nice properties, and you just identified exactly the right properties, the properties that has that smoothly interpolates between zero and one, it sort of bakes off all of the alternatives and kind of a clear way. There is also I would say there's one part which I kind of don't agree with. But philosophically, there was a long"},{"start":4116.04,"text":"when there's a class of statisticians who are great and I love and I read their books, but they were really obsessed with different ways of motivating distributions through maximum entropy. And so there is a whole area for discrete things where these are the maximum entropy distributions. So that makes them right. They assume the least. And so the fact that they had this exponential form..."},{"start":4137.02,"text":"was very nice from that the last and most important bit is extremely numerically convenient so like it turns out that what you also want is you don't want something usually that goes to zero so like imagine you had a loss that what it would do is it would pick the right one like we're saying you know pick the highest one and get and spread no information about the others you wouldn't kind of back prop into those weights as much or you wouldn't take a derivative into those weights as much you just throw information away and so those properties that kind of smoothly varies it made it look sigmoid like and most natural"},{"start":4166.34,"text":"I remember when I first started playing with these models way back when,"},{"start":4170.22,"text":"it felt really ad hoc to me. And what I realized then wasn't that it was a special choice. That's"},{"start":4175.14,"text":"what I'm trying to convey to you. It does have good properties. There's a reason we use it."},{"start":4178.8,"text":"But the more I feel like, no, it's really convenient. It's numerically stable."},{"start":4182.84,"text":"And you have to justify doing something else instead of it. It doesn't mean you won't."},{"start":4186.78,"text":"You will have instances where you use something different. But that's how it became the standard."},{"start":4191.16,"text":"Because it has exactly the properties that you mentioned."},{"start":4193.52,"text":"mentioned."},{"start":4194.06,"text":"We also know how to make it more numerically stable"},{"start":4195.92,"text":"and run it fast enough and stuff like that."},{"start":4198.7,"text":"It's not true of all functions."},{"start":4201.38,"text":"Wonderful questions."},{"start":4202.2,"text":"Other questions?"},{"start":4206.62,"text":"Awesome."},{"start":4207.32,"text":"Please."},{"start":4208.4,"text":"Matthew, I was going to talk to the label smoothing"},{"start":4210.62,"text":"result. Do you use it overfittingly?"},{"start":4213.3,"text":"It seems like it's overfitting."},{"start":4215.18,"text":"Oh, yeah."},{"start":4215.72,"text":"OK, great question."},{"start":4216.46,"text":"So we don't have the vocabulary to talk about how"},{"start":4218.74,"text":"it reduces overfitting quite yet."},{"start":4220.34,"text":"Maybe it's next lecture or the lecture after that."},{"start":4222.24,"text":"But I wanted to get you the intuition for how it works because you're likely to see those as kind of a bundled unit, cross entropy and label smoothing that you want to actually do these two pieces together."},{"start":4232.32,"text":"So we'll talk a little bit about how regularization comes into the picture."},{"start":4235.6,"text":"What I was trying to say is the intuition there of how it comes to be is if you were perfectly confident in your label and it was exactly right and there was one archetype like this is there's only one monkey in the world and this is it."},{"start":4247.54,"text":"right? It doesn't really make sense. But if you had that thing where you just wanted X"},{"start":4250.94,"text":"to be exactly on top of it, you wouldn't need to do any labels."}],"speech_gaps":[],"frame":"../frames/v046/025.webp","frame_time":4098.82},{"title":"指数族、广义线性模型与分类","segments":[{"id":340,"text":"But if you have this kind of neighborhood, this kind of ball around the monkey archetype, I don't know why I'm switching to monkeys, but whatever, like that archetype, then label smoothing starts to make sense. And what it's capturing is, do I have any distribution over the classes? Will I ever get confused by them? The most natural way to get confused by them is to say, as I said, I know it's a car or I know it's a cat or a dog, but I know it's not a car. You could put that into cross entropy and train it. What's interesting here is that just putting in a little bit of noise across everything, is it just another form?","zh":"但是如果你有这种邻域，这种围绕猴子原型的球形区域，我不确定为什么我要切换到猴子，但不管怎样，像这种原型，那么标签平滑开始变得有意义了。它捕捉的是，我是否对类别有任何分布？我是否会因为它们而混淆？最自然的混淆方式是说，正如我所说，我知道它是汽车，或者我知道它是猫或狗，但我知道它不是汽车。你可以将这一点放入交叉熵中进行训练。有趣的是，仅仅在所有事物上加入一点噪声，这是否只是另一种形式？","start":4253.87,"end":4283.15},{"id":341,"text":"of regularization. We'll see others where we make the weight shrink. That's another one. You make the weights a little bit smaller. Or we add in what's called an explicit penalty term. All of these are going to turn out to be about the same with different bits of normalization. This is just one that you're likely to encounter. And then the last piece is there's a bunch of work we did that turned into a bunch of stuff that people... A small set of people use where you can actually predict the label distribution without having to train a model through what are called method of moments techniques. You could predict these different labels and get a better estimate.","zh":"正则化。我们会看到其他一些方法，其中我们使权重收缩。这也是其中一种方法。你使权重稍微小一些。或者我们加入所谓的显式惩罚项。所有这些最终都会被证明是通过不同归一化方式实现的相同目标。这只是一个你很可能遇到的类型。然后最后一部分是，我们做了一些工作，这些工作转化为一些人们……一小部分人使用的方法，其中你可以实际预测标签分布，而无需通过所谓的矩方法技术训练模型。你可以预测这些不同的标签并获得更好的估计。","start":4283.18,"end":4312.38},{"id":342,"text":"than just 0 or 1. Say you trusted source A more than source B, as we talked about. And you could imagine having almost another model there to predict that ahead of time. This, which looked like an obscure thing to do 10 years ago, is now something you would possibly do if you were running simulations or other things under the covers, especially with potentially long-running agents where you get more information. So you may know that it's an A or a B that you actually want to generate.","zh":"而不仅仅是0或1。比如说，如果你更信任来源A而不是来源B，正如我们之前讨论的那样。你可以想象几乎拥有另一个模型来提前预测这一点。这在十年前看起来像是一个晦涩的做法，但现在如果你在运行模拟或其他隐藏操作，尤其是对于可能长时间运行的代理，你可能会获得更多信息。因此，你可能知道你实际上想要生成的是A还是B。","start":4312.4,"end":4334.86},{"id":343,"text":"So that's another thing that you could incorporate. So those are the reasons you would potentially have a distribution. It turns out this simple, uninformative one actually does some good. That's the message. Not like it's, oh, this is the right thing to do. Just a thing you can do. Great questions. Awesome. Any others? Okay. All right. So we saw the exponential families that gave us a path to generalize to a wider set of models.","zh":"所以这是另一个你可以纳入考虑的因素。这就是你可能会有分布的原因。结果发现这个简单且无信息的分布实际上能起到一定作用。这就是信息。并不是说这是正确的事情，而只是你可以做的事情。非常好的问题。太棒了。还有其他问题吗？好的。那么我们看到了指数族，它为我们提供了一条通向更广泛模型集合的路径。","start":4335.97,"end":4361.02},{"id":344,"text":"This is the thing that we were after. We wanted to basically say everything that you learned so far in this course basically was two slides of this lecture. It's just you can do inference, you can do learning as long as it's in this form and you model the error. There's that one slide where I put it all kind of down there. That was basically saying all the stuff you would learn were variants of that. Of course, you have to understand features and concepts and all that. But that's the key piece of there. And so we did that. We saw the cross entropy and softmax, which is to show you that these are techniques that are foundational. We're supposed to teach you foundational stuff.","zh":"这就是我们想要的东西。我们基本上想说的是，你在这门课程中到目前为止所学到的一切，基本上都可以归结为这节课的两张幻灯片。只要你能以这种形式建模误差，你就可以进行推理和学习。有一张幻灯片我把所有内容大致放在那里。那基本上是在说你所学到的一切都是这种形式的变体。当然，你还需要理解特征和概念等。但这是其中的关键部分。因此我们做了这些。我们看到了交叉熵和softmax，这是为了向你展示这些是基础性的技术。我们本应该教你这些基础内容。","start":4361.76,"end":4390.44},{"id":345,"text":"This is stuff that you have probably used in a product within the last hour, definitely within the last 24 hours. I mentioned label smoothing because I wanted to also highlight this point that your data and model are always a little bit wrong. You can get really hung up on, is this the right thing to do?","zh":"这些都是你可能在过去一小时内，至少在过去24小时内在某个产品中使用过的内容。我提到了标签平滑，因为我还想强调这个观点：你的数据和模型总是有些错误。你可能会纠结于，这是否是正确的事情？","start":4390.96,"end":4406.66}],"notes":["本段讨论了标签平滑（label smoothing）的概念，指出其通过在所有类别上引入噪声来防止模型对训练数据的过度拟合。讲者提到，标签平滑捕捉了模型是否对类别分布有混淆的可能，并举例说明了在知道某个类别不是目标类别时，如何通过交叉熵进行训练。","讲者进一步解释了标签平滑是正则化的一种形式，与其他形式如权重缩减和显式惩罚项类似，但都涉及不同的归一化方式。此外，还提到一种称为矩方法（method of moments）的技术，可以预测标签分布而无需训练模型。","讲者提到，标签平滑可以用于处理多个来源的可信度差异，例如信任来源A比来源B更可靠。这种技术在模拟或长期运行的代理中特别有用，因为可以提前预测标签分布。","讲者指出，标签平滑是一种简单但有效的技术，虽然不是唯一正确的做法，但可以作为一种实用的工具。此外，讲者强调了课程中所讲的指数族和广义线性模型的重要性，指出这些是构建更广泛模型的基础。","讲者提到，课程中所讲的内容是构建模型和进行推理的基础，这些技术在实际产品中被广泛使用。最后，讲者强调了数据和模型总是存在一定的错误，因此需要对这些错误保持敏感。","讲者通过标签平滑的例子，强调了模型和数据的不完美性，并指出在实际应用中，需要考虑这些不完美性以改进模型性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4253.87,"end":4406.66,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4253.87,"text":"But if you have this kind of neighborhood, this kind of ball around the monkey archetype, I don't know why I'm switching to monkeys, but whatever, like that archetype, then label smoothing starts to make sense. And what it's capturing is, do I have any distribution over the classes? Will I ever get confused by them? The most natural way to get confused by them is to say, as I said, I know it's a car or I know it's a cat or a dog, but I know it's not a car. You could put that into cross entropy and train it. What's interesting here is that just putting in a little bit of noise across everything, is it just another form?"},{"start":4283.18,"text":"of regularization. We'll see others where we make the weight shrink. That's another one. You make the weights a little bit smaller. Or we add in what's called an explicit penalty term. All of these are going to turn out to be about the same with different bits of normalization. This is just one that you're likely to encounter. And then the last piece is there's a bunch of work we did that turned into a bunch of stuff that people... A small set of people use where you can actually predict the label distribution without having to train a model through what are called method of moments techniques. You could predict these different labels and get a better estimate."},{"start":4312.4,"text":"than just 0 or 1. Say you trusted source A more than source B, as we talked about. And you could imagine having almost another model there to predict that ahead of time. This, which looked like an obscure thing to do 10 years ago, is now something you would possibly do if you were running simulations or other things under the covers, especially with potentially long-running agents where you get more information. So you may know that it's an A or a B that you actually want to generate."},{"start":4335.97,"text":"So that's another thing that you could incorporate. So those are the reasons you would potentially have a distribution. It turns out this simple, uninformative one actually does some good. That's the message. Not like it's, oh, this is the right thing to do. Just a thing you can do. Great questions. Awesome. Any others? Okay. All right. So we saw the exponential families that gave us a path to generalize to a wider set of models."},{"start":4361.76,"text":"This is the thing that we were after. We wanted to basically say everything that you learned so far in this course basically was two slides of this lecture. It's just you can do inference, you can do learning as long as it's in this form and you model the error. There's that one slide where I put it all kind of down there. That was basically saying all the stuff you would learn were variants of that. Of course, you have to understand features and concepts and all that. But that's the key piece of there. And so we did that. We saw the cross entropy and softmax, which is to show you that these are techniques that are foundational. We're supposed to teach you foundational stuff."},{"start":4390.96,"text":"This is stuff that you have probably used in a product within the last hour, definitely within the last 24 hours. I mentioned label smoothing because I wanted to also highlight this point that your data and model are always a little bit wrong. You can get really hung up on, is this the right thing to do?"}],"speech_gaps":[],"frame":"../frames/v046/026.webp","frame_time":4265.87},{"title":"指数族、广义线性模型与分类","segments":[{"id":346,"text":"That's good. You should think about that. But often in machine learning, it's kind of looking for the more robust thing to do. So doing things that are more robust to the noise and the errors and the problems, that seems to be where we arc a lot of these models. And we'll try and be more formal about that as we get a little bit more mathematical sophistication about that. And then I emphasize this many times, but it's worth highlighting again. This exact setup, softmax with cross-entropy, is underneath all these amazing AIs. And I don't know if you love them as much as I do, but as I told you, my wife said I've been building the same demos. She met me. We've been together since we were undergrads.","zh":"很好。你应该考虑一下这一点。但在机器学习中，通常是在寻找更稳健的做法。因此，做那些对噪声、错误和问题更稳健的事情，似乎是我们很多模型所处的方向。随着我们逐渐具备更多的数学严谨性，我们会更加正式地讨论这一点。我多次强调过这一点，但再次强调一下：这种确切的设置，即使用softmax和交叉熵，是所有这些惊人的AI系统的基础。我不知道你是否像我一样喜欢它们，但正如我告诉你的，我妻子说我一直在做同样的演示。她见过我，我们从大学本科时期就在一起了。","start":4407.76,"end":4436.72},{"id":347,"text":"But now the demos work and it's so awesome. They're so amazing and the fact that this is like the last layer and all those parameters is very cool. So I'm glad that I could share that with you.","zh":"但现在这些演示已经可以正常运行了，这真是太棒了。它们非常惊人，而且事实是这些就是最后一层，所有这些参数也非常酷。我很高兴能和你分享这一点。","start":4437.3,"end":4446.3}],"notes":["本段主要讨论机器学习中模型的鲁棒性，强调在面对噪声和误差时，模型应尽可能稳健。讲者提到，许多模型的设计目标是增强对这些问题的抵抗能力，并指出在后续课程中会更正式地讨论这一概念。","讲者再次强调softmax与交叉熵损失函数的组合是现代AI系统的核心组成部分，这一结构支撑了众多强大的人工智能应用。讲者还提到自己与妻子的互动，说明这一技术的实用性与个人生活之间的联系。","讲者提到演示程序现在已能正常运行，并表达了对这一成果的自豪感。他指出，这些模型的最后层和参数设置非常有趣，这体现了模型设计中的关键细节对整体性能的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4407.76,"end":4446.3,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":2,"raw_segments":[{"start":4407.76,"text":"That's good. You should think about that. But often in machine learning, it's kind of looking for the more robust thing to do. So doing things that are more robust to the noise and the errors and the problems, that seems to be where we arc a lot of these models. And we'll try and be more formal about that as we get a little bit more mathematical sophistication about that. And then I emphasize this many times, but it's worth highlighting again. This exact setup, softmax with cross-entropy, is underneath all these amazing AIs. And I don't know if you love them as much as I do, but as I told you, my wife said I've been building the same demos. She met me. We've been together since we were undergrads."},{"start":4437.3,"text":"But now the demos work and it's so awesome. They're so amazing and the fact that this is like the last layer and all those parameters is very cool. So I'm glad that I could share that with you."}],"speech_gaps":[],"frame":"../frames/v046/027.webp","frame_time":4419.76}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v046.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
