theta1, are equal... oops... theta1.x equals 0. So this is"},{"start":3045.96,"text":"the line that I've drawn here. Now, the idea though is because I've also given it an orientation,"},{"start":3051.4,"text":"which I put right here, the more I go this way, then you would be on another line,"},{"start":3056.26,"text":"which is like, say, theta dot 1 dot x equal to 1."}],"speech_gaps":[],"frame":"../frames/v046/018.webp","frame_time":2919.66},{"title":"指数族、广义线性模型与分类","segments":[{"id":180,"text":"So it's a little bit of a strange visualization. It's the standard one, but it's a little bit of a strange visualization. Theta is actually pointing in this direction, right? Like it's the normal vector to this. It has an orientation which way it's going. The more I go in the theta direction, the more cat-like I am in this image. And what these lines are indicating is, where does it go from positive to negative as a way of visualizing the surface of that linear function? Here's 1, 2, 3. They would all be different lines. And this is the way you would score it. So this guy has its vectors on the theta 1.","zh":"所以这是一种有点奇怪的可视化方式。这是标准的一种，但确实有点奇怪。θ实际上是指向这个方向的，对吧？就像它是这个面的法向量。它有一个方向，表示它朝哪个方向走。我越往θ的方向走，这个图像中我就越像猫。而这些线所表示的是，从正到负的转变点，作为一种可视化线性函数表面的方式。这里是1、2、3。它们都会是不同的线。这就是你如何评分的方式。所以这个家伙在θ1上有它的向量。","start":3059.51,"end":3088.79},{"id":181,"text":"line so its score in here would be one versus its line on dogs right so dogs here it's negative because it lives in this direction on dogs and so the dog term let's say dog is two would be minus two so i have i think i have a numerical example next to answer that","zh":"线，因此在这里它的评分会是1，而它在狗的线上则会是负数，因为狗在这个方向上，所以狗的项，比如说狗是2，就会是-2。我想我接下来会有一个数值例子来回答这个问题。","start":3088.81,"end":3104.35},{"id":182,"text":"But this is just a visualization of that. So this is a visualization of that piece. Does that make sense? So these lines here are meant to be the, you know, formerly isoclines. They're the lines where it's exactly equal to zero. These are all the points that that model would give us, that parameter would give the score zero to. Okay? And this is all the points one. And so I've drawn them for each class as representative of that. Okay? Please. In certain situations, you're trying to avoid the dog. Yeah.","zh":"但这只是这种可视化的表现。这是对这一部分的可视化。这是否清楚呢？所以这些线在这里的意思是，以前的等倾线。它们是等于零的线。这些都是该模型会给出评分零的点。明白吗？这些都是点一。因此，我为每个类别都画了这些线作为代表。明白吗？请。在某些情况下，你试图避免狗。是的。","start":3104.8,"end":3135.77},{"id":183,"text":"Is there a way to get through the entrance?","zh":"有没有办法通过入口？","start":3137.07,"end":3138.33},{"id":184,"text":"oh what a wonderful question so the question is is what happens if you have something where you have an image that has a cat and a dog in it that seems that seems natural enough what will happen there in our current modeling that doesn't make sense because our modeling is actually categorical and we said that there's a distribution over them so that would be a different error model the way that people often do that is they sometimes have these kind of like filters that will go around and say object detectors where they're actually asking the question which is a little bit more complicated not is a cat but does there exist a cat in this picture and they may look implicitly over all the focal","zh":"哦，这是一个多么美妙的问题啊。问题是，如果你有一个图像，里面同时有猫和狗，这似乎很自然，那么在我们当前的建模中会发生什么呢？这在我们的建模中是没有意义的，因为我们的建模实际上是分类的，我们说过，这是在它们上面的分布，因此这会是不同的误差模型。人们通常这样做的方式是，他们有时会使用这些类似滤波器的东西，去问是否存在猫，而他们实际问的问题更复杂，不是“这是猫”，而是“这张图片中是否存在猫”，并且他们可能会隐式地在所有焦点上进行检查。","start":3138.94,"end":3168.2},{"id":185,"text":"size and say yep cat not cat and they reduce it to this classification so you know it's unlikely the cat and the dog are superimposed on each other that wouldn't work in the model i just told you but that's what's going on here our classes are disjoint but it's possible if you want something that's like an object recognition that in fact you could get a list out that's a different task than we're studying right now great question you got it exactly perfectly okay all right","zh":"尺寸并说猫不是猫，它们被简化为这种分类，所以你知道猫和狗叠加在一起的情况不太可能发生，这在刚才告诉你的模型中是不适用的，但这就是我们现在讨论的情况。我们的类别是互不相交的，但如果你想实现一个物体识别的任务，实际上你可能会得到一个不同的列表，这与我们现在研究的任务不同，这是一个很好的问题，你完全理解了，非常好，没问题。","start":3168.3,"end":3192.04},{"id":186,"text":"Here's another visualization of softmax. And I wanted to point this out. So what we were visualizing on the last slide were the scores. Those were these distances. This was theta dot x. That was the score. And then we talked about how they were normalized. And this is just some numbers that are there. This canonical link function is the multinomial. This basically takes this score and turns it into a probability. These numbers here should all add up to 1.","zh":"这里还有一个softmax的可视化示例。我想指出这一点。我们在上一张幻灯片中可视化的是得分。这些是这些距离。这是theta点x，也就是得分。然后我们讨论了它们是如何被归一化的。这只是存在的一些数值。这个规范链接函数是多项分布。这基本上是将这个得分转换为一个概率。这里的所有数值都应该加起来等于1。","start":3193.14,"end":3217.82}],"notes":["本段讨论了如何通过可视化方法来理解线性模型的得分函数。讲者提到，这些线代表的是得分函数从正到负的转变，用于可视化线性函数的表面。例如，当模型参数θ变化时，得分函数的值会变化，从而影响分类结果。","讲者进一步解释了这些线是等值线，即得分函数等于零的点。这些线代表了模型在不同参数下给出零得分的点，这有助于理解模型的决策边界。","讲者提到，当图像中同时包含猫和狗时，当前的分类模型可能无法处理这种情况，因为模型假设类别是互斥的。然而，实际应用中可能需要处理重叠的类别，这需要不同的建模方法。","讲者指出，当前的模型是基于分类任务的，而实际应用中可能需要更复杂的模型，例如目标检测模型，这些模型可以处理图像中多个对象的存在。","讲者还提到，分类任务通常将问题简化为是否存在某个对象，而不是直接判断对象的类别，这需要不同的建模策略。","最后，讲者提到softmax函数的可视化，强调了得分函数如何被归一化为概率分布，这些概率值的总和为1。"],"formulas":[],"uncertainties":["the dog term let's say dog is two would be minus two","they may look implicitly over all the focal"],"diagram":"none","start":3059.51,"end":3217.82,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3059.51,"text":"So it's a little bit of a strange visualization. It's the standard one, but it's a little bit of a strange visualization. Theta is actually pointing in this direction, right? Like it's the normal vector to this. It has an orientation which way it's going. The more I go in the theta direction, the more cat-like I am in this image. And what these lines are indicating is, where does it go from positive to negative as a way of visualizing the surface of that linear function? Here's 1, 2, 3. They would all be different lines. And this is the way you would score it. So this guy has its vectors on the theta 1."},{"start":3088.81,"text":"line so its score in here would be one versus its line on dogs right so dogs here it's negative because it lives in this direction on dogs and so the dog term let's say dog is two would be minus two so i have i think i have a numerical example next to answer that"},{"start":3104.8,"text":"But this is just a visualization of that. So this is a visualization of that piece. Does that make sense? So these lines here are meant to be the, you know, formerly isoclines. They're the lines where it's exactly equal to zero. These are all the points that that model would give us, that parameter would give the score zero to. Okay? And this is all the points one. And so I've drawn them for each class as representative of that. Okay? Please. In certain situations, you're trying to avoid the dog. Yeah."},{"start":3137.07,"text":"Is there a way to get through the entrance?"},{"start":3138.94,"text":"oh what a wonderful question so the question is is what happens if you have something where you have an image that has a cat and a dog in it that seems that seems natural enough what will happen there in our current modeling that doesn't make sense because our modeling is actually categorical and we said that there's a distribution over them so that would be a different error model the way that people often do that is they sometimes have these kind of like filters that will go around and say object detectors where they're actually asking the question which is a little bit more complicated not is a cat but does there exist a cat in this picture and they may look implicitly over all the focal"},{"start":3168.3,"text":"size and say yep cat not cat and they reduce it to this classification so you know it's unlikely the cat and the dog are superimposed on each other that wouldn't work in the model i just told you but that's what's going on here our classes are disjoint but it's possible if you want something that's like an object recognition that in fact you could get a list out that's a different task than we're studying right now great question you got it exactly perfectly okay all right"},{"start":3193.14,"text":"Here's another visualization of softmax. And I wanted to point this out. So what we were visualizing on the last slide were the scores. Those were these distances. This was theta dot x. That was the score. And then we talked about how they were normalized. And this is just some numbers that are there. This canonical link function is the multinomial. This basically takes this score and turns it into a probability. These numbers here should all add up to 1."}],"speech_gaps":[],"frame":"../frames/v046/019.webp","frame_time":3071.51},{"title":"指数族、广义线性模型与分类","segments":[{"id":187,"text":"Okay, and now I have a distribution over class one. So, you know, cat, dog, so on. This is a more, you'll see this visualization, this is a visualization of the output. The other is a visualization of the feature space. This is for a single point. Ask me a question. I'm super happy to. Here's a numerical version of the same thing. I just put in a bunch of examples. I'm going to go through this relatively quickly. You get the points. These are the theta twos. You had one on the two line, one 0.1. You exponentiate them.","zh":"好的，现在我有一个关于类别一的分布。所以，你知道的，比如猫、狗等等。你会看到这个可视化，这是输出的可视化。另一个是特征空间的可视化。这是针对单个点的。问我一个问题吧。我很乐意回答。这里有一个同样的数值版本。我随便输入了一些例子。我会相对快速地讲解一遍。你们会得到这些点。这些是theta的平方项。你们在两条线上各有一个，一个是0.1。你们对它们进行指数运算。","start":3220.66,"end":3253.96},{"id":188,"text":"You normalize them and sum them, and then that gives you the probability distribution.","zh":"然后你们对它们进行归一化并求和，这样就会得到概率分布。","start":3255.36,"end":3259.7},{"id":189,"text":"So hopefully this is mechanically clear how this is going to work.","zh":"所以希望你们能清楚地理解这个过程是如何运作的。","start":3260.32,"end":3263.08},{"id":190,"text":"So the visualization is, I have these hyperplanes that are in space.","zh":"这个可视化是，我在空间中有一些超平面。","start":3263.72,"end":3267.28},{"id":191,"text":"I'm measuring this scoring according to each hyperplane, which is this theta dot x.","zh":"我根据每个超平面来测量这个得分，也就是theta点乘x。","start":3267.58,"end":3271.5},{"id":192,"text":"That's the way the dot product works.","zh":"这就是点积的工作方式。","start":3271.62,"end":3272.86},{"id":193,"text":"I get those scores out here, and then I put them through this machine.","zh":"我得到这些得分，然后将它们输入到这个机器中。","start":3273.18,"end":3276.76},{"id":194,"text":"And this machine says, exponentiate them, sum them, put them together.","zh":"这个机器会说，对它们进行指数运算，求和，然后组合起来。","start":3276.92,"end":3281.86},{"id":195,"text":"Cool.","zh":"不错。","start":3283.36,"end":3283.8},{"id":196,"text":"And then I get probabilities out.","zh":"然后我得到的是概率。","start":3283.88,"end":3284.94},{"id":197,"text":"Cool. All right.","zh":"不错。好吧。","start":3285.66,"end":3288.64},{"id":198,"text":"Let's go through here. All right. All right. So, oh, please, go ahead.","zh":"我们来过这里。好吧。好吧。所以，哦，请继续。","start":3293.94,"end":3299.18},{"id":199,"text":"Can you say a little more about the dimension of theta here?","zh":"你能说说这里的theta的维度吗？","start":3300.2,"end":3303.0},{"id":200,"text":"Awesome question.","zh":"非常好的问题。","start":3304.58,"end":3305.38},{"id":201,"text":"There's like theta j is like, it feels like you get just a scalar,","zh":"比如，theta j就像是，感觉你得到的只是一个标量，","start":3305.48,"end":3309.78},{"id":202,"text":"but then theta transpose x is a vector.","zh":"但theta转置x却是一个向量。","start":3309.8,"end":3312.72},{"id":203,"text":"Exactly. Yeah, this is a great question. So the types are a little bit confusing. So let me write","zh":"没错。是的，这是一个很好的问题。所以这些类型有点让人混淆。让我把它们全部明确地写出来。","start":3313.22,"end":3316.66},{"id":204,"text":"them all out explicitly. So remember, we're going to have that D lives in general in D plus one.","zh":"所以记住，D一般会存在于D加一的维度中。在这里，它存在于二维空间中，不管怎样。实际上，这里我们作弊了。它应该有一个分量，但这里没有。","start":3316.66,"end":3321.7},{"id":205,"text":"Here it's living in two and whatever. Actually, here we've cheated. It should have a one component","zh":"那么theta I的类型也必须相同。它们也必须存在于D加一的维度中。所以theta I或theta J也必须是D加一的元素。","start":3321.8,"end":3325.78},{"id":206,"text":"to it, but it doesn't here. Then the theta I's have to be the same type. They have to live also","zh":"当我在它们之间进行点积运算时，X点乘theta J，结果会存在于实数空间中。这就是为什么这些字符里面会有标量。","start":3325.78,"end":3330.3},{"id":207,"text":"in D plus one. So theta I or theta J has to also be an element of D plus one. Then when I take their","zh":"当我往下看的时候，这就是我所说的那个标量。","start":3330.3,"end":3336.24},{"id":208,"text":"dot product, X dot theta J, that's going to live in R. And so that's why these characters are going","zh":"我把这个称为得分，原始得分。这里也包含的就是这个得分。","start":3336.24,"end":3341.84},{"id":209,"text":"have scalars inside. And when I go to down here, that's what I'm calling that scalar.","zh":"这就是theta乘以x的结果。","start":3341.84,"end":3346.72},{"id":210,"text":"I'm calling a score, a raw score. And then that's what's in here as well. So that's the theta.x.","zh":"我所说的得分是一个原始得分。这里也包含的就是这个得分，也就是theta乘以x。","start":3346.88,"end":3353.46},{"id":211,"text":"And so everything's the same type. The reason that I'm a little bit sloppy about the types","zh":"因此，所有内容都是同一种类型。我之所以在类型上稍微有些随意，","start":3353.58,"end":3358.12},{"id":212,"text":"and don't put them, I try to put them at the beginning of every section, is that you pick","zh":"并在每节开头不明确写出它们，是因为你选择类型后，它们必须保持一致。当你进行点积运算时，这些类型必须相同。这就会产生它们。","start":3358.12,"end":3361.64},{"id":213,"text":"the type so they have to match. When you do a dot product, those are the same. That makes them. And","zh":"是的。因此，θ的维度必须与输入的维度相同。例如，","start":3361.64,"end":3371.82},{"id":214,"text":"Yeah. So the theta has to be the same dimension as your input. So for example,","zh":"当我们处理住房数据时，如果你还记得，我们开始添加各种不同的列，","start":3374.18,"end":3378.38},{"id":215,"text":"when we had the housing data, if you remember, we started to add in various different columns,","zh":"如建筑面积、土地面积等。这些就是你的特征数量。这将决定D的值。","start":3378.46,"end":3382.36},{"id":216,"text":"square footage, lot size, so on. That's going to be your number of features. That's going to","zh":"这是一个建模问题，取决于你的输入。一旦你确定了D个维度，","start":3382.46,"end":3386.22},{"id":217,"text":"determine D. And that's a modeling question that's on your input. Once you have that D dimensions,","zh":"在线性设置中，你需要为每个特征学习一个参数。","start":3386.22,"end":3392.16},{"id":218,"text":"then you have to learn in the linear setup, you learn a parameter for each one of those features","zh":"然后你必须在线性设置中进行学习，你需要为每一个特征学习一个参数","start":3392.44,"end":3396.66}],"notes":["本段讲解了广义线性模型中如何通过指数族分布进行分类。首先，讲者提到在分类任务中，模型会为每个类别生成一个分布，例如猫、狗等。接着，通过可视化输出和特征空间，展示了模型如何将输入特征映射到输出空间。讲者还提到，通过将特征向量与参数向量进行点积，得到每个类别的得分，然后通过指数化、归一化和求和，得到概率分布。"],"formulas":[{"latex":"p(y|x) = \\frac{e^{\\theta^T x}}{\\sum_j e^{\\theta_j^T x}}","symbols":"p(y|x) 是类别 y 在输入 x 下的概率分布，θ 是参数向量，x 是输入特征向量","explanation":"公式中的分母使用了求和符号 \\sum_j 代替了文本中的 \\text{sum}_j，以符合数学符号规范。","evidence":"Okay, and now I have a distribution over class one. So, you know, cat, dog, so on. This is a more, you'll see this visualization, this is a visualization of the output. The other is a visualization of the feature space. This is for a single point. Ask me a question. I'm super happy to. Here's a numerical version of the same thing. I just put in a bunch of examples. I'm going to go through this relatively quickly. You get the points. These are the theta twos. You had one on the two line, one 0.1. You exponentiate them. You normalize them and sum them, and then that gives you the probability distribution. So hopefully this is mechanically clear how this is going to work. So the visualization is, I have these hyperplanes that are in space. I'm measuring this scoring according to each hyperplane, which is this theta dot x. That's the way the dot product works. I get those scores out here, and then I put them through this machine. And th
