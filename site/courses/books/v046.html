据，将其输入我的模型，该模型将给我一个估计值，无论是向量还是一个点，暂且说是一个点。然后，我将通过刚刚在上次使用的误差轮廓来计算它有多可能。这个误差轮廓我们只在学习时使用过，但我们在进行预测时也可以使用它。回想一下，当我们进行逻辑回归时，实际的预测是这个点属于类别一的概率。同样地，我们之后会看到，当大模型运行到末尾时，它会说下一个词是画廊的概率是多少。它会查看其字典中的所有单词，当它进行推断时，它会列出这些概率，因为这是一个多项分布，实际上这是一个相当直接的操作，这就是","start":1568.22,"end":1597.44},{"id":64,"text":"time but we can also use it when we do predictions recall that when we did logistic regression the actual prediction was what's the probability that it's in class one in the same way we'll see later when the big ai runs at the end it says what's the probability that the next word is gallery right it's going to look over all the words that it has in its dictionary and when it does inference it's going to list those probabilities because it's a multinomial it's actually a fairly straightforward operation and this is","zh":"实际上在统一它们。我不想把因果关系的方向弄反。并不是因为多项分布容易，所以指数族存在。指数族存在是因为它们捕捉了所有这些误差实际上都很简单，并且都属于同一个模型的事实。这更像是你脑海中的压缩，而不是代码中的压缩，如果你喜欢的话。非常好的问题。我很高兴能收到这些问题。哦，谢谢。","start":1597.55,"end":1622.61},{"id":65,"text":"effectively unifying it. I don't want to put the causality in the wrong direction. It's not like the multinomial is easy because exponential families exist. Exponential families exist because they're capturing the fact that all these errors are actually easy and in the same model. It's more compression in your head rather than compression in code, if you like. Wonderful questions. So happy to get these. Oh, please.","zh":"有效地将其统一起来。我不想把因果关系的方向弄反。并不是因为指数族的存在，多分类才变得简单。指数族存在是因为它们捕捉到了所有这些误差实际上都很简单并且可以被同一个模型所涵盖的事实。如果你喜欢的话，这更像是你脑海中的压缩，而不是代码中的压缩。非常好的问题。很高兴收到这些问题。哦，谢谢。","start":1623.06,"end":1646.78},{"id":66,"text":"In terms of error, you mentioned that the choice of loss function is handled by the exponential model family. What does that mean?","zh":"就误差而言，你提到损失函数的选择是由指数模型族处理的。这是什么意思？","start":1648.28,"end":1654.88},{"id":67,"text":"Great question. Let's get to that when we actually go through learning, which will come in one or two slides. And if I don't answer it then, come back. But I'll give you the intuition. The intuition is because it's going to give you the inference, that's going to tell you how likely something is. And then you're going to get that product, that IID product. And when you differentiate that, you're right back into the situation because you're going to have a functional form that says, given my estimate, this is the likelihood or the loss. And it's going to follow exactly the same story we saw before, but we're going to see it in much more detail. It's a wonderful question. You're way ahead of me.","zh":"非常好的问题。我们会在实际进行学习时详细讲解这一点，这将在一到两张幻灯片中出现。如果那时我还没有回答，你再回来问。但我会给你一个直觉。直觉是，它会给你推断，即告诉你某件事发生的可能性。然后你会得到这个独立同分布（IID）乘积。当你对它进行求导时，你会再次回到这种情形，因为你将有一个函数形式，它会说：给定我的估计，这就是似然或损失。它将完全遵循我们之前看到的相同故事，但我们将更加详细地看到这一点。这是一个非常好的问题。你比我领先很多。","start":1655.32,"end":1684.7},{"id":68,"text":"Awesome. All right. So this is the next slide, generalized linear models. So now we're going to tie this to actual data and modeling. We're going to move from errors to modeling. And you folks are all over this. It's phenomenal. I'm really excited. So what happens here? So the first part of the lecture, I was talking about noise models, error models. But that's not what machine learning is about. Machine learning, we've talked about in supervised setting is we're given some data and features, x, which we live in our d plus 1. d plus 1, of course, because we have that extra 1 column we've appended.","zh":"太棒了。好的。这是下一张幻灯片，广义线性模型。现在我们将这一内容与实际数据和建模联系起来。我们将从误差转向建模。你们大家对这个都很在行。这非常棒。我真的很兴奋。那么这里会发生什么？在讲座的第一部分，我谈论的是噪声模型、误差模型。但这并不是机器学习的内容。在监督学习的背景下，我们已经讨论过，机器学习是给我们一些数据和特征x，我们生活在d加1维空间中。d加1，当然，因为我们添加了额外的一列。","start":1686.18,"end":1714.34}],"notes":["本段主要讨论了指数族分布和广义线性模型在机器学习中的应用。讲者提到，指数族分布能够捕捉数据中的统计特性，并且在进行推理时可以利用这些特性。同时，讲者还提到，广义线性模型将误差模型与实际数据建模联系起来，通过模型估计参数并进行预测。","讲者强调了在机器学习中，损失函数的选择与指数族分布密切相关。通过指数族分布，可以将损失函数与模型的统计特性联系起来，从而在进行参数估计和推理时更加高效。","在讨论广义线性模型时，讲者提到，模型会将输入数据通过模型进行处理，得到一个估计值，然后根据误差分布来评估该估计值的合理性。这种做法与之前讨论的极大似然估计类似，但更加系统化。","讲者还提到，广义线性模型能够将不同的误差分布统一起来，这使得模型在处理不同类型的分类任务时更加灵活。同时，讲者指出，指数族分布的存在并不是因为多分类任务本身容易，而是因为这些任务的误差分布可以被统一建模。","在讲到损失函数和误差分布的关系时，讲者提到，通过指数族分布，可以将损失函数与模型的统计特性联系起来，从而在进行参数估计和推理时更加高效。","最后，讲者提到，广义线性模型将误差模型与实际数据建模联系起来，通过模型估计参数并进行预测。这种做法在监督学习中非常常见，特别是在处理分类任务时，模型会根据输入数据的特征进行预测，并给出相应的概率分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1539.74,"end":1714.34,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1539.74,"text":"We had it at the time too, but people weren't using it as widely. You have automatic differentiation. You can write whatever forward code you want and you'll get it. But here you can actually check that it has the statistical properties that you expect. Wonderful question. Awesome. Please. What do you mean get inference for free? Yeah. So what I mean get inference for free is inference, if you remember, the way that we use these models is we have a hypothesis. So you're going to learn some parameters in a minute. You get an estimate. And now you can do inference to say how likely..."},{"start":1568.22,"text":"is this data point so remember we did these maximum likelihood things that inference was to do the likelihood to say how likely this point is now all of them fall into the same category and we'll see when we go through the generalized linear models how this happens you're going to give me data i'm going to take that data i'm going to put it through my model that model is going to give me an estimate either a vector or a point say it's a point for the moment and then now i'm going to figure out how likely it is by the error profile that i have just as we did in the last time this error profile we have only used at learning"},{"start":1597.55,"text":"time but we can also use it when we do predictions recall that when we did logistic regression the actual prediction was what's the probability that it's in class one in the same way we'll see later when the big ai runs at the end it says what's the probability that the next word is gallery right it's going to look over all the words that it has in its dictionary and when it does inference it's going to list those probabilities because it's a multinomial it's actually a fairly straightforward operation and this is"},{"start":1623.06,"text":"effectively unifying it. I don't want to put the causality in the wrong direction. It's not like the multinomial is easy because exponential families exist. Exponential families exist because they're capturing the fact that all these errors are actually easy and in the same model. It's more compression in your head rather than compression in code, if you like. Wonderful questions. So happy to get these. Oh, please."},{"start":1648.28,"text":"In terms of error, you mentioned that the choice of loss function is handled by the exponential model family. What does that mean?"},{"start":1655.32,"text":"Great question. Let's get to that when we actually go through learning, which will come in one or two slides. And if I don't answer it then, come back. But I'll give you the intuition. The intuition is because it's going to give you the inference, that's going to tell you how likely something is. And then you're going to get that product, that IID product. And when you differentiate that, you're right back into the situation because you're going to have a functional form that says, given my estimate, this is the likelihood or the loss. And it's going to follow exactly the same story we saw before, but we're going to see it in much more detail. It's a wonderful question. You're way ahead of me."},{"start":1686.18,"text":"Awesome. All right. So this is the next slide, generalized linear models. So now we're going to tie this to actual data and modeling. We're going to move from errors to modeling. And you folks are all over this. It's phenomenal. I'm really excited. So what happens here? So the first part of the lecture, I was talking about noise models, error models. But that's not what machine learning is about. Machine learning, we've talked about in supervised setting is we're given some data and features, x, which we live in our d plus 1. d plus 1, of course, because we have that extra 1 column we've appended."}],"speech_gaps":[],"frame":"../frames/v046/010.webp","frame_time":1551.74},{"title":"指数族、广义线性模型与分类","segments":[{"id":69,"text":"And we have a target y, and we want to model. Now we're not talking about what type y is because we have all these different types that we can use. So what we're going to do is we're going to pick a distribution based on y's type. So we're going to pick binary. We could pick Bernoulli. If we pick multiple classes, we can pick multinomial. And this is going to pick the modeling class. And remember we had this fun notation before, this bar notation that says conditioned on x.","zh":"我们有一个目标变量 y，我们想要进行建模。现在我们不讨论 y 的类型，因为我们有各种不同的类型可供使用。因此，我们将根据 y 的类型选择一个分布。我们将选择二元分布。我们也可以选择伯努利分布。如果我们选择多个类别，我们可以选择多项分布。这将确定我们的建模类别。请记住我们之前使用过这种有趣的符号，即带横线的符号，表示在 x 的条件下。","start":1715.11,"end":1740.52},{"id":70,"text":"the distribution of y, we've been working on effectively this function. When you think about the bar, think about it as a function. It's a noisy function, but it's a function that takes in an x for a fixed parameter theta and spits out a y, or in this case, a distribution over y. The only distribution we've seen really so far is the logistic one, which was just two numbers, but it could be bigger. We'll see how it's bigger.","zh":"y 的分布，我们一直在有效地处理这个函数。当你考虑横线时，把它看作一个函数。这是一个带有噪声的函数，但它是一个函数，它接受一个固定的参数 theta 和一个 x，然后输出一个 y，或者在这种情况下，输出一个 y 的分布。到目前为止，我们只见过一种分布，即逻辑分布，它只是两个数字，但它可以更大。我们将看到它是如何更大的。","start":1741.05,"end":1761.59},{"id":71,"text":"So now our model is going to be linear. And what that means is we're going to make the natural parameter, we're going to remove the natural parameter, and we're going to talk about theta tx. So remember, theta is the parameters that we learn. And this is the most confusing part of this notation, so I'm going to go really slowly through here. I apologize if it's too pedantic, but I'd rather do that than be confused. Theta is a parameter that we learn, and theta together with an x data type is going to create...","zh":"现在我们的模型将是一个线性模型。这意味着我们将使用自然参数，我们将移除自然参数，并讨论 theta tx。请记住，theta 是我们学习的参数。这是这个符号中最令人困惑的部分，所以我将在这里慢慢讲解。如果太繁琐，我表示歉意，但与其混淆，我宁愿这样做。theta 是我们学习的参数，theta 与一个 x 数据类型结合，将创建...","start":1764.5,"end":1791.68},{"id":72,"text":"this natural parameter, eta, of the noise. So the noise has parameters, and we have parameters, our model weights, which I'll try to call them for this section, that we learn, theta, and that's going to tell us how to do this.","zh":"这个噪声的自然参数 eta。噪声有参数，我们也有参数，即我们的模型权重，我将在本节中尝试称它们为 theta，这是我们学习的参数，它将告诉我们如何进行这个操作。","start":1792.29,"end":1805.45},{"id":73,"text":"So how does this work? This gets to the inference for free. This gets to the learning. It's not going to be a big reveal. So if you're really excited about the next three lines, I'm so sorry to let you down. It's hopefully going to be really simple. Inference means h theta x equals e of y is exactly the output. So remember in logistic regression, what was the actual output of logistic regression? It was a probability that you were in a particular class. Remember the sigmoid? You picked the height of the curve and you said that was your probability. That is this value here.","zh":"那么这又是如何运作的呢？这可以免费获得推断。这可以免费获得学习。这不会是一个大发现。所以如果你对接下来的三行非常兴奋，我不得不让你失望。希望这会非常简单。推断意味着 h theta x 等于 y 的期望值，就是输出。还记得在逻辑回归中，逻辑回归的实际输出是什么？它是一个特定类别的概率。还记得 sigmoid 函数吗？你选择了曲线的高度，并说这就是你的概率。这就是这里的这个值。","start":1808.13,"end":1837.09},{"id":74,"text":"Okay? That was the output. Now it was captured by one number because it was Boolean. We didn't have to write, you know, p and 1 minus p. We just wrote 1. Okay? Like convention. How does learning work? Well, it's the max of the log likelihood.","zh":"明白了吗？这就是输出。现在它被一个数字所捕捉，因为它是一个布尔值。我们不需要写出 p 和 1 减 p。我们只需要写出 1。明白了吗？这是一种惯例。学习又是如何运作的呢？好吧，它是对数似然的最大值。","start":1838.78,"end":1854.64},{"id":75,"text":"How does that work? Well, think about what's going to happen. We're going to make that IID assumption. That means every error is identically distributed. It's going to be one of the classes that you picked. It's going to be a sum, a log sum over all of them, because you would multiply them if they're independent. So the log will turn it into a sum. And then you're going to try and pick the theta that gives you the highest probability for your data, given the error model. So getting back to the wonderful question before, how does this determine the loss function? It's through this.","zh":"它是如何运作的呢？好吧，想想会发生什么。我们将做出独立同分布（IID）的假设。这意味着每个误差都独立同分布。它将是你所选择的一个类别。它将是一个总和，一个对所有项的对数总和，因为如果它们是独立的，你会将它们相乘。所以对数会将其转换为一个总和。然后你将尝试选择一个 theta，使得在给定误差模型的情况下，你的数据具有最高的概率。因此回到之前那个美妙的问题，这如何决定损失函数？就是通过这个。","start":1855.53,"end":1885.75}],"notes":["本段讲解了广义线性模型中如何根据目标变量y的类型选择合适的概率分布，如二元变量选择伯努利分布，多类变量选择多项分布。同时，强调了模型参数θ的作用，以及如何通过θ和输入x来构建自然参数η，从而定义模型的输出分布。","讲者提到模型是线性的，意味着自然参数η与输入x和参数θ之间存在线性关系。θ是模型需要学习的参数，而η是噪声的自然参数，这表明模型的输出分布由θ和x共同决定。","在推理部分，讲者指出hθ(x)等于y的期望值，即输出为y的概率。这与逻辑回归中的sigmoid函数输出概率一致，说明模型的输出是基于输入x和参数θ的线性组合。","学习过程涉及最大化对数似然函数，假设数据是独立同分布的。通过最大化对数似然，可以找到使数据在给定误差模型下概率最大的参数θ。","讲者提到损失函数的确定与对数似然函数有关，通过最大化对数似然来选择最优参数θ，这表明损失函数是负对数似然函数。","整个过程强调了广义线性模型中参数θ的作用，以及如何通过自然参数η和输入x的线性组合来构建输出分布，同时涉及了模型的推理和学习过程。"],"formulas":[{"latex":"h_{\\theta}(x) = \\mathbb{E}[y]","symbols":"hθ(x) 表示给定输入x和参数θ时，y的期望值","explanation":"公式正确，表示在给定输入x和参数θ时，输出y的期望值。","evidence":"So how does this work? This gets to the inference for free. This gets to the learning. It's not going to be a big reveal. So if you're really excited about the next three lines, I'm so sorry to let you down. It's hopefully going to be really simple. Inference means h theta x equals e of y is exactly the output. So remember in logistic regression, what was the actual output of logistic regression? It was a probability that you were in a particular class. Remember the sigmoid? You picked the height of the curve and you said that was your probability. That is this value here."}],"uncertainties":["theta tx"],"diagram":"none","start":1715.11,"end":1885.75,"asr_flags":[],"math_clarifications":["公式中的期望值表示在给定输入x和参数θ时，输出y的期望值，符合逻辑回归中输出概率的定义。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1715.11,"text":"And we have a target y, and we want to model. Now we're not talking about what type y is because we have all these different types that we can use. So what we're going to do is we're going to pick a distribution based on y's type. So we're going to pick binary. We could pick Bernoulli. If we pick multiple classes, we can pick multinomial. And this is going to pick the modeling class. And remember we had this fun notation before, this bar notation that says conditioned on x."},{"start":1741.05,"text":"the distribution of y, we've been working on effectively this function. When you think about the bar, think about it as a function. It's a noisy function, but it's a function that takes in an x for a fixed parameter theta and spits out a y, or in this case, a distribution over y. The only distribution we've seen really so far is the logistic one, which was just two numbers, but it could be bigger. We'll see how it's bigger."},{"start":1764.5,"text":"So now our model is going to be linear. And what that means is we're going to make the natural parameter, we're going to remove the natural parameter, and we're going to talk about theta tx. So remember, theta is the parameters that we learn. And this is the most confusing part of this notation, so I'm going to go really slowly through here. I apologize if it's too pedantic, but I'd rather do that than be confused. Theta is a parameter that we learn, and theta together with an x data type is going to create..."},{"start":1792.29,"text":"this natural parameter, eta, of the noise. So the noise has parameters, and we have parameters, our model weights, which I'll try to call them for this section, that we learn, theta, and that's going to tell us how to do this."},{"start":1808.13,"text":"So how does this work? This gets to the inference for free. This gets to the learning. It's not going to be a big reveal. So if you're really excited about the next three lines, I'm so sorry to let you down. It's hopefully going to be really simple. Inference means h theta x equals e of y is exactly the output. So remember in logistic regression, what was the actual output of logistic regression? It was a probability that you were in a particular class. Remember the sigmoid? You picked the height of the curve and you said that was your probability. That is this value here."},{"start":1838.78,"text":"Okay? That was the output. Now it was captured by one number because it was Boolean. We didn't have to write, you know, p and 1 minus p. We just wrote 1. Okay? Like convention. How does learning work? Well, it's the max of the log likelihood."},{"start":1855.53,"text":"How does that work? Well, think about what's going to happen. We're going to make that IID assumption. That means every error is identically distributed. It's going to be one of the classes that you picked. It's going to be a sum, a log sum over all of them, because you would multiply them if they're independent. So the log will turn it into a sum. And then you're going to try and pick the theta that gives you the highest probability for your data, given the error model. So getting back to the wonderful question before, how does this determine the loss function? It's through this."}],"speech_gaps":[],"frame":"../frames/v046/011.webp","frame_time":1727.11},{"title":"指数族、广义线性模型与分类","segments":[{"id":76,"text":"This log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,","zh":"这个p的对数。这会给你恰好需要做的事情，现在你必须进行梯度上升来得到正确的θ值。现在你会发现，由于函数的工作方式，它通常会变成一个下降问题，但本质上是在获取最大似然估计。最后一点是这个算法总是具有一个非常有趣的结构，你可以验证，即我总可以在所有数据上运行随机梯度下降（SGD），这意味着我查看预测错误，将其乘以数据，","start":1887.06,"end":1919.05},{"id":77,"text":"and I move in that direction for theta t. So all the things that you saw that we derived one after the other as consequences of logistic regression or least squares are actually just instances of a more general algorithm. And this algorithm works no matter how you pick the errors. So getting back to it, when I say think in terms of errors, once you've picked the errors, which are picked for you by the types that you're modeling, then...","zh":"然后在θ_t的方向上移动。因此，你之前看到的所有由逻辑回归或最小二乘法推导出的结论，实际上都是更一般算法的实例。这个算法无论你如何选择错误都有效。回到这一点，当我提到以错误的方式思考时，一旦你选择了错误（这些错误是由你所建模的类型决定的），那么……","start":1919.64,"end":1944.89},{"id":78,"text":"You get all this stuff for free, meaning intellectually, now you know how to do inference, now you know how to do learning, and now you have an algorithm actually under the covers for SGD that has a very simple form. So it shows in some way that those things are not accidents about the way we wrote them. We did have to write the distribution in a funny form. That's okay. It's done once. You look it up in a table. Questions now? Okay.","zh":"你就能免费获得所有这些内容，这意味着在智力上，你现在知道如何进行推断，现在知道如何进行学习，并且现在有一个实际用于SGD的算法，其形式非常简单。这在某种程度上表明，这些内容并不是我们写法上的偶然。我们确实必须以一种有趣的方式写出分布。这没关系。只需做一次。你可以在表格中查找。现在有问题吗？好的。","start":1945.94,"end":1975.57},{"id":79,"text":"So I think you're going to have homeworks where you're going to start to try and play with some of these, where you'll play with different distributions and try and use those distributions to do this. This, as I said, is extremely powerful. Some of these are distributions on distributions. I mean, they're really powerful models that you can put underneath the covers. But now you have, at least in principle, a way to learn all of them.","zh":"我认为你们将会有作业，开始尝试使用这些内容，你们将尝试使用不同的分布，并尝试用这些分布来进行这种操作。正如我所说，这极其强大。其中一些是分布在分布上的。我的意思是，它们是真正强大的模型，可以隐藏在底层。但现在，至少在原则上，你有了学习所有这些模型的方法。","start":1976.0,"end":1993.78},{"id":80,"text":"Awesome. All right. So this is the part that I highlight because it drives everyone crazy. So the worst part of this lecture, and maybe there's many worst parts, one of my least favorite parts and the one that seems to empirically confuse you the most is this. You have all these names for parameters, and I hate remembering names for things, but this is a place where it helps, at least conceptually. There are model parameters.","zh":"太棒了。好了。这部分是我特别强调的，因为它让大家都感到困扰。这是这节课最糟糕的部分，也许有很多糟糕的部分，这是我最不喜欢的部分之一，而且似乎在实践中最让你感到困惑。你有这么多参数的名称，我讨厌记住东西的名称，但这是个有助于理解的地方，至少在概念上。这些是模型参数。","start":1996.76,"end":2016.18},{"id":81,"text":"Those are the thetas. That's what you would learn underneath the covers. That's the estimate. Remember, it's p sub theta. That turns into a different kind of parameter once you smash it with some x.","zh":"这些就是θ。这是你底层会学到的参数，这是估计值。记住，它是p下标θ。当你把它与某个x相乘后，它就会变成另一种类型的参数。","start":2017.1,"end":2027.4},{"id":82,"text":"That's going to turn into a natural parameter in our formulation. Theta dot x turns into this. And then that turns by a link function into all of these parameters, which you say are the canonical parameters. Those are probably the parameters that, if you were to look it up in Wikipedia, are there. Remember, we wrote Bernoulli as p, 1 minus p kind of thing. These are their canonical ones. That's usually not how they're written down, but here we have this link function or response function.","zh":"这会变成我们公式中的自然参数。θ点乘x就会变成这样。然后通过一个链接函数，它会变成所有这些参数，也就是所谓的规范参数。这些可能是你在维基百科中查找时会找到的参数。记住，我们把伯努利分布写成p和1减p的形式。这些就是它们的规范参数形式。这通常不是它们的写法，但在这里我们有这个链接函数或响应函数。","start":2028.42,"end":2055.74}],"notes":["本段讲解了广义线性模型（GLM）的基本思想，即通过最大似然估计来学习模型参数，并指出梯度上升算法在实际中可能转化为梯度下降问题。同时，强调了算法的通用性，无论选择哪种误差函数，都可以使用相同的框架进行学习。","讲者提到，通过将误差函数与数据结合，可以使用随机梯度下降（SGD）进行参数更新。这表明，之前在逻辑回归和最小二乘法中推导出的算法实际上是广义线性模型框架下的特例。","讲者指出，通过将模型参数与输入数据结合，可以得到自然参数，再通过链接函数转换为经典参数。这解释了为什么在某些情况下，参数的表示形式会有所不同，例如伯努利分布的参数通常以p表示，但在广义线性模型中则以自然参数形式出现。","讲者强调了模型参数（thetas）与自然参数、经典参数之间的区别，并指出这些参数在不同上下文中的含义不同。例如，模型参数是需要学习的参数，而自然参数是通过数据与模型参数的组合得到的。","讲者提到，广义线性模型的框架非常强大，可以应用于各种分布，包括分布上的分布。这表明，该模型可以作为更复杂模型的基础，例如在贝叶斯推断中使用。","最后，讲者指出，理解这些参数之间的关系对于掌握广义线性模型至关重要，尽管这在概念上可能令人困惑，但它是理解模型结构和学习过程的关键。"],"formulas":[{"latex":"\\text{gradient ascent}","symbols":"梯度上升","explanation":"保持原样，梯度上升是优化算法的正确术语。","evidence":"this log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,"},{"latex":"\\text{SGD}","symbols":"随机梯度下降","explanation":"保持原样，SGD是标准的机器学习术语。","evidence":"this log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,"},{"latex":"\\text{link function}","symbols":"链接函数","explanation":"保持原样，链接函数是统计学和机器学习中的标准术语。","evidence":"That's going to turn into a natural parameter in our formulation. Theta dot x turns into this. And then that turns by a link function into all of these parameters, which you say are the canonical parameters. Those are probably the parameters that, if you were to look it up in Wikipedia, are there. Remember, we wrote Bernoulli as p, 1 minus p kind of thing. These are their canonical ones. That's usually not how they're written down, but here we have this link function or response function."}],"uncertainties":[],"diagram":"none","start":1887.06,"end":2055.74,"asr_flags":[],"math_clarifications":["无法核定log p的具体形式，因为缺少上下文信息。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1887.06,"text":"this log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,"},{"start":1919.64,"text":"and I move in that direction for theta t. So all the things that you saw that we derived one after the other as consequences of logistic regression or least squares are actually just instances of a more general algorithm. And this algorithm works no matter how you pick the errors. So getting back to it, when I say think in terms of errors, once you've picked the errors, which are picked for you by the types that you're modeling, then..."},{"start":1945.94,"text":"You get all this stuff for free, meaning intellectually, now you know how to do inference, now you know how to do learning, and now you have an algorithm actually under the covers for SGD that has a very simple form. So it shows in some way that those things are not accidents about the way we wrote them. We did have to write the distribution in a funny form. That's okay. It's done once. You look it up in a table. Questions now? Okay."},{"start":1976.0,"text":"So I think you're going to have homeworks where you're going to start to try and play with some of these, where you'll play with different distributions and try and use those distributions to do this. This, as I said, is extremely powerful. Some of these are distributions on distributions. I mean, they're really powerful models that you can put underneath the covers. But now you have, at least in principle, a way to learn all of them."},{"start":1996.76,"text":"Awesome. All right. So this is the part that I highlight because it drives everyone crazy. So the worst part of this lecture, and maybe there's many worst parts, one of my least favorite parts and the one that seems to empirically confuse you the most is this. You have all these names for parameters, and I hate remembering names for things, but this is a place where it helps, at least conceptually. There are model parameters."},{"start":2017.1,"text":"Those are the thetas. That's what you would learn underneath the covers. That's the estimate. Remember, it's p sub theta. That turns into a different kind of parameter once you smash it with some x."},{"start":2028.42,"text":"That's going to turn into a natural parameter in our formulation. Theta dot x turns into this. And then that turns by a link function into all of these parameters, which you say are the canonical parameters. Those are probably the parameters that, if you were to look it up in Wikipedia, are there. Remember, we wrote Bernoulli as p, 1 minus p kind of thing. These are their canonical ones. That's usually not how they're written down, but here we have this link function or response function."}],"speech_gaps":[],"frame":"../frames/v046/012.webp","frame_time":1899.06},{"title":"指数族、广义线性模型与分类","segments":[{"id":83,"text":"There's a lot of terminology, but don't get confused here about which parameters. These are the only ones you learn. The rest of this is modeling the noise. Cool. There's some examples there.","zh":"有很多术语，但不要在这里混淆哪些参数。这些是你唯一需要学习的参数。其余部分是建模噪声。很好。那里还有一些例子。","start":2056.72,"end":2072.76},{"id":84,"text":"Yeah. So I think this is the main thing that I want to make sure that you have as a takeaway here","zh":"是的。所以我想确保你们在这里有一个主要的收获","start":2078.17,"end":2082.37},{"id":85,"text":"from this section is, once you pick a distribution and you set eta to be the state x,","zh":"是，一旦你选择了一个分布并将eta设为状态x，","start":2082.37,"end":2086.71},{"id":86,"text":"the exponential family gives you the rest. You already know all the pieces of inference,","zh":"指数族就会给你其余的部分。你已经知道所有推理的组成部分，","start":2086.89,"end":2090.51},{"id":87,"text":"you know the pieces of learning, and you can generalize to whatever distribution or type","zh":"你也知道学习的组成部分，并且可以推广到你拥有的任何分布或类型","start":2090.65,"end":2093.71},{"id":88,"text":"of data that you have. And so you didn't have to have one lecture on least squares and logistic","zh":"的数据。因此你不需要有一整节课来讲解最小二乘法、逻辑回归、多项式分布、狄利克雷过程和泊松计数等所有内容。","start":2093.71,"end":2097.89},{"id":89,"text":"regression and multinomial and Dirichlet processes and Poisson counts and all the rest.","zh":"一旦你深入进去，它们都只是同一个家族。因此，这已经成为一种非常强大的建模方法","start":2097.89,"end":2102.01},{"id":90,"text":"They're all just one family once you get into them. And so that's been a very powerful modeling","zh":"它们在你深入了解后都只是同一个家族。因此，这成为一种非常强大的建模方法","start":2102.47,"end":2106.55},{"id":91,"text":"modeling tool. And as I said, people have written thick textbooks. I have a big, thick","zh":"建模工具。正如我所说，人们已经写了厚厚的教科书。我有一本很大的、厚厚的","start":2106.55,"end":2109.93},{"id":92,"text":"green textbook about generalized linear models, okay?","zh":"关于广义线性模型的绿色教科书，好吗？","start":2109.93,"end":2112.21},{"id":93,"text":"All right. Any questions before I move on? Please.","zh":"好了，在我继续之前，有任何问题吗？请。","start":2114.69,"end":2119.31},{"id":94,"text":"I'm not sure if you assume the expected value error would be zero, like your IID and various","zh":"我不确定你是否假设期望值误差会为零，比如你的独立同分布（IID）和各种","start":2119.87,"end":2125.71},{"id":95,"text":"It does. So let's look at where we made various different forms.","zh":"是的。那么让我们看看我们在哪里采用了各种不同的形式。","start":2125.71,"end":2126.17},{"id":96,"text":"It does. So let's look at where we made various different forms. So we were not","zh":"是的。那么让我们看看我们在哪里采用了各种不同的形式。我们并没有","start":2127.83,"end":2134.69},{"id":97,"text":"explicit about the error itself being uh mean zero because zero is a scalar and we could want to look","zh":"明确地假设误差本身是均值为零，因为零是一个标量，我们可能想要查看","start":2134.69,"end":2141.09},{"id":98,"text":"we didn't say explicitly but intuitively something like that should happen like basically that the expected","zh":"我们没有明确说明，但直觉上应该发生类似的事情，即期望值","start":2141.09,"end":2145.87},{"id":99,"text":"explicitly but intuitively something like that should happen like basically that the expected","zh":"显式但直观地说，应该会发生类似的事情，基本上就是零的期望值，如果你给了我正确的答案，我就不应该把它扰动得很远，对吧","start":2145.87,"end":2150.05},{"id":100,"text":"value of zero says if you give me the right answer i shouldn't perturb it far away right","zh":"这基本上就是你认为应该发生的事情，它更像是一种鲁棒性考虑","start":2150.05,"end":2154.35},{"id":101,"text":"that's kind of like what what you think should happen it's kind of more of a robustness care","zh":"另一个是关于独立同分布（IID）。我们在整个设置中隐式地做了这个假设。而IID假设真正起作用的地方就在这里。因为当你对p取对数时，我在这里有点轻率了。记住，这里的p(y)中，y现在是所有的训练点，x是所有的训练数据。所以这种记号下隐藏了很多复杂性。但因为是IID，当我们取对数时，p可以分解为一个乘积，对吧？所以这里的p可以写成一个大的乘积。啊，抱歉。","start":2154.35,"end":2157.37},{"id":102,"text":"The other one's about IID. That we implicitly made here in the entire setup. And the place where the IID assumption really comes in is right here. Because when you take this log of p, I've been a little bit glib here. That's, remember, p of y, where y is now all the training points and x is all the training data. So that notation is hiding a lot of complexity under the covers. But because it's IID, when we take the log, that p can be decomposed as a product, right? So this p here we can write as some big product. Oops.","zh":"Pi j从1到n的p(yj)， blah, blah, blah, xj, theta。所以这里的东西进入求和形式，这是我们隐式地在这里使用的，这一切都发生在这里。所以IID是一个我们隐式地做出的假设，使得整个过程能够进行。如果不是IID，你就不能进行这种分解。","start":2158.44,"end":2186.98},{"id":103,"text":"Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here. So iid is an assumption we're implicitly making to make this whole thing go. If it weren't, you couldn't do this decomposition.","zh":"相同分布也包含在这里，因为我们不假设存在混合的Y模型。不是像我们在一个分布上，然后又在另一个分布上，尽管坦率地说，你可以将它合并成一个巨大的分布。所以这一点稍微不那么重要。这清楚吗？太棒了。很好的问题。","start":2189.2,"end":2214.75},{"id":104,"text":"The identically distributed are also in here because we're not assuming that there are mixes of Y models. It's not like when we're here on one distribution and then we're another distribution, although candidly you can combine that into one gigantic distribution. So that one's a little bit less of an issue. Does that make sense? Awesome. Great question.","zh":"相同分布的变量也包含在这里，因为我们不假设存在不同Y模型的混合。这不像我们在这里使用一个分布，然后切换到另一个分布的情况，尽管坦率地说，你也可以将这种情况合并为一个巨大的分布。所以这一点稍微不那么成问题。这样讲清楚了吗？太棒了。非常好的问题。","start":2215.93,"end":2231.57}],"notes":["本段主要讲解指数族分布的建模思想，强调一旦选择分布并设定eta为状态x，其余部分由指数族自动推导。这使得推理和学习的各个部分可以统一处理，无需为不同数据类型单独设计模型。","讲者指出，所有模型（如最小二乘、逻辑回归、多项式分布、狄利克雷过程、泊松计数等）都可以归为广义线性模型，这体现了指数族分布的强大建模能力。","讲者提到，IID假设在推导过程中被隐式使用，特别是在对数似然函数的分解中。IID假设允许将联合概率分解为独立项的乘积，从而简化计算。","讲者进一步解释，独立同分布（IID）假设不仅涉及独立性，还涉及分布的同质性，即所有数据点来自相同的分布。这与混合模型不同，混合模型可能涉及不同分布的组合。","讲者强调，零均值假设在某些情况下是隐式成立的，但并非总是如此。零均值的直观意义是，如果给出正确的答案，模型不应对其做出大的扰动，这体现了模型的鲁棒性。","讲者指出，IID假设是整个推导过程的基础，如果不存在IID假设，就无法进行概率的分解，从而影响模型的构建和优化。"],"formulas":[{"latex":"p(y) = \\frac{1}{Z(\\theta)} \\text{exp}(\\theta^T T(y) - A(\\theta))","symbols":"指数族分布的一般形式","explanation":"该公式正确表达了指数族分布的一般形式，其中 $ Z(\\theta) $ 是规范化常数，$ \\theta $ 是自然参数，$ T(y) $ 是充分统计量，$ A(\\theta) $ 是对数规范化常数。","evidence":"from this section is, once you pick a distribution and you set eta to be the state x,"},{"latex":"p(y_1, y_2, ..., y_n) = \\frac{1}{Z(\\theta)} \\text{exp}(\\theta^T \\sum_{i=1}^{n} T(y_i) - nA(\\theta))","symbols":"独立同分布（IID）假设下的联合概率分解","explanation":"该公式在独立同分布（IID）假设下，将联合概率分解为各独立项的乘积，并通过对数转换为求和形式。公式中的 $ n $ 表示样本数量，$ \\sum_{i=1}^{n} T(y_i) $ 是所有样本的充分统计量之和。","evidence":"Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here. So iid is an assumption we're implicitly making to make this whole thing go. If it weren't, you couldn't do this decomposition."}],"uncertainties":["Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here."],"diagram":"none","start":2056.72,"end":2231.57,"asr_flags":[],"math_clarifications":["公式中的 $ Z(\\theta) $ 是规范化常数，确保概率分布的总和为1。"],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":2056.72,"text":"There's a lot of terminology, but don't get confused here about which parameters. These are the only ones you learn. The rest of this is modeling the noise. Cool. There's some examples there."},{"start":2078.17,"text":"Yeah. So I think this is the main thing that I want to make sure that you have as a takeaway here"},{"start":2082.37,"text":"from this section is, once you pick a distribution and you set eta to be the state x,"},{"start":2086.89,"text":"the exponential family gives you the rest. You already know all the pieces of inference,"},{"start":2090.65,"text":"you know the pieces of learning, and you can generalize to whatever distribution or type"},{"start":2093.71,"text":"of data that you have. And so you didn't have to have one lecture on least squares and logistic"},{"start":2097.89,"text":"regression and multinomial and Dirichlet processes and Poisson counts and all the rest."},{"start":2102.47,"text":"They're all just one family once you get into them. And so that's been a very powerful modeling"},{"start":2106.55,"text":"modeling tool. And as I said, people have written thick textbooks. I have a big, thick"},{"start":2109.93,"text":"green textbook about generalized linear models, okay?"},{"start":2114.69,"text":"All right. Any questions before I move on? Please."},{"start":2119.87,"text":"I'm not sure if you assume the expected value error would be zero, like your IID and various"},{"start":2125.71,"text":"."},{"start":2127.83,"text":"It does. So let's look at where we made various different forms. So we were not"},{"start":2134.69,"text":"explicit about the error itself being uh mean zero because zero is a scalar and we could want to look"},{"start":2141.09,"text":"in other different types where zero you know may or may not exist so that zero part we didn't say"},{"start":2145.87,"text":"explicitly but intuitively something like that should happen like basically that the expected"},{"start":2150.05,"text":"value of zero says if you give me the right answer i shouldn't perturb it far away right"},{"start":2154.35,"text":"that's kind of like what what you think should happen it's kind of more of a robustness care"},{"start":2158.44,"text":"The other one's about IID. That we implicitly made here in the entire setup. And the place where the IID assumption really comes in is right here. Because when you take this log of p, I've been a little bit glib here. That's, remember, p of y, where y is now all the training points and x is all the training data. So that notation is hiding a lot of complexity under the covers. But because it's IID, when we take the log, that p can be decomposed as a product, right? So this p here we can write as some big product. Oops."},{"start":2189.2,"text":"Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here. So iid is an assumption we're implicitly making to make this whole thing go. If it weren't, you couldn't do this decomposition."},{"start":2215.93,"text":"The identically distributed are also in here because we're not assuming that there are mixes of Y models. It's not like when we're here on one distribution and then we're another distribution, although candidly you can combine that into one gigantic distribution. So that one's a little bit less of an issue. Does that make sense? Awesome. Great question."}],"speech_gaps":[],"frame":"../frames/v046/013.webp","frame_time":2068.72},{"title":"多类分类与概率分布表示","segments":[{"id":105,"text":"Multi-class classification. As I told you, this is the thing that you probably use the most. I think as I said on my opening slide, this is the thing that I used this morning implicitly when having Cloud Code, make sure that I put in all of the visualizations I wanted to put in and deleted things that I was supposed to delete. Every token it generated came from multi-class classification.","zh":"多类分类。正如我告诉你们的，这可能是你们最常使用的东西。我想正如我在开场幻灯片上所说的，我今天早上在使用Cloud Code时，隐式地使用了这一点，确保我放入了所有想要放入的可视化内容，并删除了应该删除的内容。每一个它生成的标记都来自于多类分类。","start":2232.88,"end":2254.4},{"id":106,"text":"All right. So how does it work? Let's get the basics down. So suppose we wanted to choose among k discrete values. Here, I'm going to pick four, and I'm going to pick short words so that I can put them on the slide. So we have our classes are kind of bizarrely cat, dog, car, bus. I'm not sure exactly what we're trying to decide among here, but just go with it. They're just values. If you need a narrative story, I don't know, make up a story that has a cat, a dog, a car, and a bus. Maybe the cat's driving the bus, and the dog is in the car, and they're angry at each other. Who knows? Anyway.","zh":"好的。那么它是如何工作的呢？让我们先了解基础知识。假设我们想要在k个离散值中进行选择。这里，我将选择四个，并选择短词以便我可以将它们放在幻灯片上。因此，我们的类别是有点奇怪的：猫、狗、汽车、公交车。我不确定我们到底是在决定什么，但暂且接受这个设定。它们只是值。如果你需要一个叙事故事，我也不知道，编一个包含猫、狗、汽车和公交车的故事吧。也许猫在驾驶公交车，狗在汽车里，它们彼此愤怒。谁知道呢？总之吧。","start":2256.27,"end":2285.25},{"id":107,"text":"whatever you think about. Now, the way we encode those is we encode them as one-hot vectors. So the idea here is that cat is going to be E1, or E0 depending on how you do the notation, E1 typically. It's going to have a 1 here. 0 is everywhere else. Dog is going to be E2. Car, E3. Bus, E4.","zh":"无论你认为什么。我们编码这些值的方式是使用one-hot向量。这里的思路是，猫会被编码为E1，或者根据你的记号方式为E0，通常为E1。它在这里有一个1，其他位置都是0。狗会被编码为E2，汽车为E3，公交车为E4。","start":2286.25,"end":2307.35},{"id":108,"text":"Now, this allows us to talk about nice things. Like when we put them together, we can sum them nicely and assign probability distributions and all the rest. They're kind of the support vectors that we have. This is a mathematical convenience and is the way that we do it. It's just a nice thing to have.","zh":"这种方式使我们能够讨论一些美好的事情。例如，当我们把它们组合在一起时，我们可以很好地进行求和，并分配概率分布等。它们在某种程度上是我们的支持向量。这是一种数学上的便利方式，也是我们进行操作的方式。这只是一个很不错的工具。","start":2309.22,"end":2328.42},{"id":109,"text":"So a prediction is a distribution over the classes. And what I was kind of babbling about just a second ago is because these are all nice orthogonal vectors, I can just take a weighted sum of them, a sum of them on the simplex, and that can be a prediction. And that prediction will mean something like the probability here is 0.5 that it's a cat and 0.3 that it's a dog and so on.","zh":"因此，预测是对类别的一种分布。我刚才一直在说的，是因为这些都是很好的正交向量，我可以对它们进行加权求和，即在单纯形上的求和，这可以作为一个预测。这个预测意味着，例如，它有0.5的概率是猫，0.3的概率是狗，依此类推。","start":2330.89,"end":2350.89},{"id":110,"text":"And the way that I can represent that, actually let me do this before I represent that, is the way that's represented is I could write this as 0.5 and 0.3 and 0.1 and 0.1. That is the probability that says it's a cat with probability 0.5, it's a car with probability 0.1, and so on. So the fact that they're one hot lets me represent them in this nice mixture form very cheaply. And this is what a prediction actually means. It's this character here.","zh":"我可以这样来表示这个，实际上在表示之前让我先说明一下，表示的方式是将这些概率写成 0.5、0.3、0.1 和 0.1。也就是说，这表示有 0.5 的概率是猫，0.1 的概率是汽车，依此类推。由于它们是 one-hot 编码，这让我能够以一种非常经济的方式表示成这种混合形式。这就是预测实际上意味着的内容，就是这里的这个字符。","start":2352.75,"end":2379.11},{"id":111,"text":"Nothing different than you saw in logistic regression. In logistic regression, there were only two classes. So we only had to write one number because these characters all add up to one. So there's always one free value. This value, once you see the first three, you know the fourth because they have to add up to one. So how do we do that? It's this nasty looking expression.","zh":"这和你在逻辑回归中看到的没有任何不同。在逻辑回归中，只有两个类别，所以我们只需要写一个数字，因为这些概率总和为 1。因此，总是有一个自由值。一旦你看到前三个值，你就能知道第四个值，因为它们必须总和为 1。那么我们是如何做到这一点的呢？这就是那个看起来很麻烦的表达式。","start":2380.1,"end":2403.35}],"notes":["本段讨论了多类分类问题中如何通过概率分布进行预测。讲者提到，预测实际上是类别分布，即每个类别被选中的概率。这些概率必须满足总和为1的条件，因此只需要指定k-1个概率值，最后一个可以通过归一化得到。","讲者指出，多类分类中使用的是one-hot编码，将每个类别表示为一个向量，其中只有一个元素为1，其余为0。这种编码方式使得概率分布的表示更加方便。","在多类分类中，预测可以表示为在简单形（simplex）上的加权和，这允许我们以一种简洁的方式表达概率分布。例如，一个类别被选中的概率可以是0.5，另一个是0.3，依此类推。","讲者提到，这种表示方式与逻辑回归中的二分类问题类似，只不过在多类分类中，需要处理多个类别。因此，只需要指定k-1个概率值，最后一个可以通过归一化得到。","讲者指出，这种概率分布的表示方式是通过一个看似复杂的表达式来实现的，这可能涉及到softmax函数或其他类似的函数，用于将输出转换为概率分布。","讲者强调，这种表示方式是数学上的便利性，使得我们可以方便地进行概率计算和模型训练。"],"formulas":[],"uncertainties":["nasty looking expression"],"diagram":"none","start":2232.88,"end":2403.35,"asr_flags":[],"math_clarifications":["原公式未明确指出这是 softmax 函数，且未提及归一化常数，因此需要移除以避免误导。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2232.88,"text":"Multi-class classification. As I told you, this is the thing that you probably use the most. I think as I said on my opening slide, this is the thing that I used this morning implicitly when having Cloud Code, make sure that I put in all of the visualizations I wanted to put in and deleted things that I was supposed to delete. Every token it generated came from multi-class classification."},{"start":2256.27,"text":"All right. So how does it work? Let's get the basics down. So suppose we wanted to choose among k discrete values. Here, I'm going to pick four, and I'm going to pick short words so that I can put them on the slide. So we have our classes are kind of bizarrely cat, dog, car, bus. I'm not sure exactly what we're trying to decide among here, but just go with it. They're just values. If you need a narrative story, I don't know, make up a story that has a cat, a dog, a car, and a bus. Maybe the cat's driving the bus, and the dog is in the car, and they're angry at each other. Who knows? Anyway."},{"start":2286.25,"text":"whatever you think about. Now, the way we encode those is we encode them as one-hot vectors. So the idea here is that cat is going to be E1, or E0 depending on how you do the notation, E1 typically. It's going to have a 1 here. 0 is everywhere else. Dog is going to be E2. Car, E3. Bus, E4."},{"start":2309.22,"text":"Now, this allows us to talk about nice things. Like when we put them together, we can sum them nicely and assign probability distributions and all the rest. They're kind of the support vectors that we have. This is a mathematical convenience and is the way that we do it. It's just a nice thing to have."},{"start":2330.89,"text":"So a prediction is a distribution over the classes. And what I was kind of babbling about just a second ago is because these are all nice orthogonal vectors, I can just take a weighted sum of them, a sum of them on the simplex, and that can be a prediction. And that prediction will mean something like the probability here is 0.5 that it's a cat and 0.3 that it's a dog and so on."},{"start":2352.75,"text":"And the way that I can represent that, actually let me do this before I represent that, is the way that's represented is I could write this as 0.5 and 0.3 and 0.1 and 0.1. That is the probability that says it's a cat with probability 0.5, it's a car with probability 0.1, and so on. So the fact that they're one hot lets me represent them in this nice mixture form very cheaply. And this is what a prediction actually means. It's this character here."},{"start":2380.1,"text":"Nothing different than you saw in logistic regression. In logistic regression, there were only two classes. So we only had to write one number because these characters all add up to one. So there's always one free value. This value, once you see the first three, you know the fourth because they have to add up to one. So how do we do that? It's this nasty looking expression."}],"speech_gaps":[],"frame":"../frames/v046/014.webp","frame_time":2244.88},{"title":"指数族、广义线性模型与分类","segments":[{"id":112,"text":"This function, back to what would you practically call it? There is something called, in PyTorch, I think it's, bless you, it's Torch NN Softmax, I think is the one that you would use. It's in the neural net library and Softmax. You use this character. It has a bunch of things in there, by the way, to be more numerically stable, and they've done a bunch of things in pre-computed gradients and blah, blah, blah. Stuff happens.","zh":"这个函数，回到你实际会怎么称呼它？在PyTorch中，我认为它叫做Torch NN Softmax，我想这就是你会用的那个。它位于神经网络库中的Softmax部分。你会使用这个函数。顺便说一下，它里面包含了一些东西，以提高数值稳定性，他们还做了很多预计算梯度和其他之类的事情。一些事情会发生。","start":2405.39,"end":2424.53},{"id":113,"text":"But mathematically, all that's happening is the following. That probability, that number that I just wrote down, where did it come from? And it comes from taking theta dot each one of the x's. So there's theta j's. There's one j for every class.","zh":"但数学上，发生的事情是以下这样。那个概率，我刚才写下的那个数字，它是从哪里来的？它来自于将θ与每一个x相乘。所以有θj，每个类别对应一个j。","start":2425.44,"end":2438.08},{"id":114,"text":"I'm going to draw a graph in a second. And then it's normalized by all their dot products. So for every dimension, for every theta j, you dot it into x. And think about it like a bake-off. I'm going to draw a picture in a second to make sure this is clear. But that's basically what's happening. And it bakes off through this exponential model. Now, intuitively, this exponential model is nice because, well, it looks like the exponential model that we've been using for the rest of class. That's probably why it's here. But also, it has a nice kind of smoothing properties that we'll talk about in a second.","zh":"我马上会画一个图。然后它通过所有这些点积进行归一化。所以对于每一个维度，对于每一个θj，你将其与x点积。想象一下像一场烘焙比赛。我马上会画一个图来确保这一点清晰。但基本上这就是发生的事情。它通过这个指数模型进行比较。现在，直观上，这个指数模型很好，因为，嗯，它看起来像我们整个课堂都在使用的指数模型。这可能就是它在这里的原因。此外，它还具有我们稍后会讨论的良好的平滑性质。","start":2438.72,"end":2467.98},{"id":115,"text":"Okay, so let's draw the picture. So what does this actually look like? How do I picture in my head how multi-class classification looks like? So maybe let's draw some schematic cats and dogs. So maybe here's some cats. Here's some dogs. Here's, oh, that's the same color.","zh":"好的，那么我们来画这个图。那么这实际上看起来是什么样子？我如何在脑海中想象多类分类的样子？也许我们可以画一些简化的猫和狗。这里有一些猫。这里有一些狗。哦，那是同样的颜色。","start":2469.39,"end":2487.33},{"id":116,"text":"Cars, buses, doesn't really matter to me. Just make them different colors. Here are the four characters and I made them very nicely clustered. Data is never this nice, but for today will be. Now the idea and the reason I do this is I want you to understand one visualization that you'll commonly see. The idea is these things intuitively are nice to separate because I can separate all these blue things. Let me just call the blue things, I think I said they were cats. Let's call these cats. These are cats over here.","zh":"汽车、公交车，对我来说并不重要。只要让它们有不同的颜色。这里是有四个字符，我让它们非常整齐地聚在一起。数据从不会这么整洁，但今天我们会这样处理。这个想法和我这样做是为了让你理解一个你经常会看到的可视化。这个想法是，这些事物直观上是容易分开的，因为我可以分开所有这些蓝色的东西。让我简单地称这些蓝色的东西为猫。让我们称这些为猫。这些猫在这里。","start":2489.91,"end":2517.41},{"id":117,"text":"So these are all my cluster of cat points in space. I've featurized them. They're in 2D, whatever. Intuitively, I can separate the cats from everything else by drawing a line. Now, that line we'll call a hyperplane, because in higher dimensions, it's not just going to be a line. It's going to be an entire surface that's there. And let me draw one that separates it. So let me draw a line. It's not doing it. Sometimes it snaps it nicely.","zh":"这些是我空间中的所有猫的聚类点。我已经为它们提取了特征。它们是二维的，不管怎样。直观上，我可以通过画一条线来将猫与其他所有东西区分开。这条线我们称之为超平面，因为在更高维空间中，它不仅仅是一条线，而是一个完整的表面。让我画一条能够将它们分开的线。让我画一条线。它没有成功。有时候它会很好地将它们分开。","start":2518.78,"end":2547.63},{"id":118,"text":"So I don't have to draw so nicely.","zh":"因此，我不必画得那么整齐。","start":2548.19,"end":2549.25},{"id":119,"text":"All right, we're going to live with that.","zh":"好吧，我们将接受这种情况。","start":2550.39,"end":2551.83},{"id":120,"text":"All right, so what does that line actually look like?","zh":"好吧，那么这条线实际上看起来是什么样子的呢？","start":2552.01,"end":2554.63},{"id":121,"text":"Well, it's going to look like, intuitively, we're going to have a theta.","zh":"直观上，我们会有一个θ。","start":2554.71,"end":2558.03},{"id":122,"text":"Let's say cats are 1.","zh":"假设猫是1。","start":2558.09,"end":2558.93},{"id":123,"text":"Theta 1.x is equal to 0.","zh":"θ₁.x 等于 0。","start":2559.57,"end":2561.67},{"id":124,"text":"That's the line that I just drew, okay?","zh":"这就是我刚刚画的那条线，对吧？","start":2561.77,"end":2563.73},{"id":125,"text":"So this is the reason I want to say this.","zh":"所以这就是我想说的原因。","start":2564.41,"end":2566.13},{"id":126,"text":"There's a hyperplane that says, if you're on this side, you're a cat.","zh":"存在一个超平面，它表示，如果你在这边，你就是猫。","start":2566.19,"end":2569.49},{"id":127,"text":"And if you're on this side, intuitively, you're not a cat, okay?","zh":"而如果你在另一边，直观上，你就不是猫，对吧？","start":2569.79,"end":2573.11},{"id":128,"text":"Now, when I do that, this cat here, for example, is on the theta equals theta1.x equals one line.","zh":"现在，当我这样做时，例如，这只猫就位于 theta 等于 theta1 乘以 x 等于 1 的直线上。","start":2573.11,"end":2585.17}],"notes":["本段讲解了Softmax函数在PyTorch中的实现，以及其在数学上的作用。Softmax函数用于将线性输出转换为概率分布，通过将每个类的线性组合进行指数化并归一化，使得输出值在0到1之间，且总和为1。这在多分类任务中非常有用。","讲者提到，Softmax函数在实现时会进行数值稳定性处理，例如使用预计算梯度等技术，以避免数值溢出或下溢的问题。这些处理是实现中的重要细节。","在数学上，Softmax函数的输出来源于将每个类的参数θ与输入特征x进行点积，然后对所有类的点积结果进行指数化并归一化。这使得输出具有概率解释。","讲者通过绘制超平面的示意图，解释了多分类问题中如何通过线性决策边界将不同类别分开。超平面在高维空间中是一个表面，用于区分不同类别。","讲者提到，超平面的划分方式取决于参数θ，例如，当θ1·x=0时，表示一个分类边界。在分类任务中，超平面用于将数据点划分为不同的类别。","讲者强调，虽然实际数据可能不会像示例中那样完美分离，但通过超平面的划分，可以直观地理解多分类模型的工作原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2405.39,"end":2585.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":2405.39,"text":"This function, back to what would you practically call it? There is something called, in PyTorch, I think it's, bless you, it's Torch NN Softmax, I think is the one that you would use. It's in the neural net library and Softmax. You use this character. It has a bunch of things in there, by the way, to be more numerically stable, and they've done a bunch of things in pre-computed gradients and blah, blah, blah. Stuff happens."},{"start":2425.44,"text":"But mathematically, all that's happening is the following. That probability, that number that I just wrote down, where did it come from? And it comes from taking theta dot each one of the x's. So there's theta j's. There's one j for every class."},{"start":2438.72,"text":"I'm going to draw a graph in a second. And then it's normalized by all their dot products. So for every dimension, for every theta j, you dot it into x. And think about it like a bake-off. I'm going to draw a picture in a second to make sure this is clear. But that's basically what's happening. And it bakes off through this exponential model. Now, intuitively, this exponential model is nice because, well, it looks like the exponential model that we've been using for the rest of class. That's probably why it's here. But also, it has a nice kind of smoothing properties that we'll talk about in a second."},{"start":2469.39,"text":"Okay, so let's draw the picture. So what does this actually look like? How do I picture in my head how multi-class classification looks like? So maybe let's draw some schematic cats and dogs. So maybe here's some cats. Here's some dogs. Here's, oh, that's the same color."},{"start":2489.91,"text":"Cars, buses, doesn't really matter to me. Just make them different colors. Here are the four characters and I made them very nicely clustered. Data is never this nice, but for today will be. Now the idea and the reason I do this is I want you to understand one visualization that you'll commonly see. The idea is these things intuitively are nice to separate because I can separate all these blue things. Let me just call the blue things, I think I said they were cats. Let's call these cats. These are cats over here."},{"start":2518.78,"text":"So these are all my cluster of cat points in space. I've featurized them. They're in 2D, whatever. Intuitively, I can separate the cats from everything else by drawing a line. Now, that line we'll call a hyperplane, because in higher dimensions, it's not just going to be a line. It's going to be an entire surface that's there. And let me draw one that separates it. So let me draw a line. It's not doing it. Sometimes it snaps it nicely."},{"start":2548.19,"text":"So I don't have to draw so nicely."},{"start":2550.39,"text":"All right, we're going to live with that."},{"start":2552.01,"text":"All right, so what does that line actually look like?"},{"start":2554.71,"text":"Well, it's going to look like, intuitively, we're going to have a theta."},{"start":2558.09,"text":"Let's say cats are 1."},{"start":2559.57,"text":"Theta 1.x is equal to 0."},{"start":2561.77,"text":"That's the line that I just drew, okay?"},{"start":2564.41,"text":"So this is the reason I want to say this."},{"start":2566.19,"text":"There's a hyperplane that says, if you're on this side, you're a cat."},{"start":2569.79,"text":"And if you're on this side, intuitively, you're not a cat, okay?"},{"start":2573.11,"text":"Now, when I do that, this cat here, for example, is on the theta equals theta1.x equals one line."}],"speech_gaps":[],"frame":"../frames/v046/015.webp","frame_time":2417.39},{"title":"指数族、广义线性模型与分类","segments":[{"id":129,"text":"This is the theta equals zero line.","zh":"这是θ等于零的直线。","start":2585.23,"end":2586.45},{"id":130,"text":"It's more cat-like than it is anything else.","zh":"它更像是猫，而不是其他任何东西。","start":2586.61,"end":2589.55},{"id":131,"text":"So far, so good?","zh":"到目前为止，一切顺利？","start":2590.51,"end":2591.29},{"id":132,"text":"All right.","zh":"好的。","start":2592.03,"end":2592.57},{"id":133,"text":"Now, how do I deal with the rest of the classes?","zh":"现在，我该如何处理其余的类别？","start":2592.61,"end":2594.35},{"id":134,"text":"Well, I have another one.","zh":"嗯，我还有一个。","start":2594.75,"end":2595.83},{"id":135,"text":"And here's another one.","zh":"这里还有一个。","start":2595.91,"end":2596.63},{"id":136,"text":"I'll say, well, this is another line I could have.","zh":"我会说，这又是一条我可能拥有的直线。","start":2596.71,"end":2599.41},{"id":137,"text":"Here's theta.","zh":"这里是θ。","start":2599.53,"end":2599.91},{"id":138,"text":"I don't know what this is.","zh":"我不知道这是什么。","start":2600.35,"end":2601.25},{"id":139,"text":"Dogs?","zh":"狗？","start":2601.55,"end":2601.93},{"id":140,"text":"Sure.","zh":"当然。","start":2602.09,"end":2602.47},{"id":141,"text":"Dogs.","zh":"狗。","start":2602.55,"end":2602.93},{"id":142,"text":"Data 2 dot x is equal to 0.","zh":"数据2点乘x等于0。","start":2603.53,"end":2605.03},{"id":143,"text":"And that's what I'll draw on this line.","zh":"这就是我要在这条线上画的内容。","start":2605.31,"end":2606.59},{"id":144,"text":"It says if you're on this side, you're more dog-like than you're on this side.","zh":"它说如果你在这边，你比在那边更像狗。","start":2606.63,"end":2610.05},{"id":145,"text":"Okay?","zh":"好的？","start":2610.79,"end":2611.15},{"id":146,"text":"Now, in our cleanly separated data, I can draw nice hyperplanes that separate it.","zh":"现在，在我们清晰分开的数据中，我可以画出漂亮的超平面来将它们分开。","start":2611.37,"end":2615.53},{"id":147,"text":"There's all kinds of beautiful theories.","zh":"这里有很多种美丽的理论。","start":2615.87,"end":2617.11},{"id":148,"text":"I have to draw through the dogs, and so on. And I'm drawing little normal vectors to make sure it's clear. Now, the point is that anything here is classified. This line wants to classify, but you can see there's some conflict. What happens in this region? Oops, came back. So what happened in this region? Well, this one says it's kind of dog-like because it's on this side, and this one says I guess it's kind of car-like. Make these guys cars. In this region, I have to bake them off against each other.","zh":"我需要画过狗，等等。并且我画出小的法向量以确保清晰。现在，重点是这里的任何东西都被分类了。这条线想要进行分类，但你可以看到有一些冲突。在这个区域会发生什么？哎呀，又回来了。那么在这个区域发生了什么？好吧，这个说它有点像狗，因为它在这边，而另一个说我想它有点像汽车。把这些家伙变成汽车。在这个区域，我必须将它们相互比较。","start":2617.9,"end":2650.33},{"id":149,"text":"right it's kind of clear for like this one like cats is going to win right everything's cats has like a high value these guys all have negative values for cats so like when i put them in here and plug them in my life is good so i have the theta equals one line i put it in there i'm like oh the dog line it's really far negative it's really far negative from a car and so on does this make sense cool ask me a question about this so how does it work just to make sure it's clear if i have an x","zh":"对，这个对于像这样的情况来说有点清楚，比如这个，猫会赢，对吧？因为所有这些猫都有高值，而这些家伙对猫都有负值，所以当我把它们放在这里并代入时，我的生活就很好。所以我有 theta 等于 1 的线，我把它放在这里，我想哦，狗的线，它离汽车非常远，非常远的负值，等等，这有意义吗？酷，向我提问关于这个，所以如果我有一个 x","start":2650.67,"end":2682.88},{"id":150,"text":"I take it, I hit it against each one of the theta j's, these theta j's represented here by the lines. The theta j's, that's the product where they equal zero, right? So they actually are, you know, they're actually going in a different direction. They're actually the normal vector if you think about the geometry. That seems to confuse folks quite a bit. This is the line where theta dot x is equal to zero. So the whole plane, this is cleanly separated in the way that we said that all the classes have a unique side that they're on and they're not confused. Go ahead.","zh":"我拿它，我把它与每一个 theta j 进行比较，这些 theta j 由这里的线表示。theta j，这是它们等于零的乘积，对吧？所以它们实际上是在不同的方向上。它们实际上是法向量，如果你从几何角度考虑的话。这似乎让很多人感到困惑。这是 theta 点乘 x 等于零的线。整个平面，以我们所说的方式清晰地分开，所有类别都有一个唯一的它们所在的侧面，它们不会混淆。继续。","start":2684.56,"end":2713.67},{"id":151,"text":"We can only separate things when you can separate them by a line. Right. So we only get perfect classification in the case when they're actually cleanly separable. And you're looking at this picture and you're like, well, this seems stupid because you just can't. I can draw a lot of pictures of points here that you're not going to be able to separate. You have shown me and wasted my time with a weak model. You brought me candy, but you told me nonsense. That's a fair argument.","zh":"我们只能在可以被一条线分开的情况下分开事物。对吧。因此，我们只能在它们实际上清晰可分的情况下获得完美的分类。你看着这张图，你会想，嗯，这看起来很傻，因为你根本不可能做到。我可以画出很多这样的点图，你无法将它们分开。你已经向我展示了这些，并用一个弱模型浪费了我的时间。你给我糖果，却对我说些无稽之谈。这是一个合理的论点。","start":2716.46,"end":2744.98}],"notes":["本段讨论了如何通过超平面进行分类，特别是通过线性分类器（如θ=0的直线）来区分不同类别（如猫、狗）。讲者提到，当数据被清晰地分开时，可以绘制出干净的超平面，但某些区域可能存在分类冲突，需要将不同类别的特征进行比较。","讲者进一步解释了θj（由直线表示）与分类器的关系，指出θj是分类器的参数，其方向对应于超平面的法向量。θ·x=0表示分类边界，所有类别在该边界两侧有明确的归属。","讲者提到，只有当数据可以被线性分离时，才能实现完美的分类。然而，现实中很多数据无法被线性分离，因此需要更复杂的模型或方法。","讲者通过举例说明了如何将数据点代入分类器进行分类，强调了不同类别特征值的差异对分类结果的影响。例如，猫的特征值较高，而狗的特征值为负，这有助于区分两者。","讲者还提到，当数据点处于分类边界附近时，需要比较不同分类器的输出，以确定最终的分类结果。这反映了分类器在处理边界区域时的不确定性。","最后，讲者以一种幽默的方式指出，如果数据无法被线性分离，那么使用简单的线性分类器可能会导致错误的分类结果，甚至浪费时间。"],"formulas":[{"latex":"\\theta \\cdot x = 0","symbols":"θ·x=0表示分类边界，即超平面的法向量方向","explanation":"公式正确，表示分类边界，即超平面的法向量方向。","evidence":"I take it, I hit it against each one of the theta j's, these theta j's represented here by the lines. The theta j's, that's the product where they equal zero, right? So they actually are, you know, they're actually going in a different direction. They're actually the normal vector if you think about the geometry. That seems to confuse folks quite a bit. This is the line where theta dot x is equal to zero. So the whole plane, this is cleanly separated in the way that we said that all the classes have a unique side that they're on and they're not confused. Go ahead."}],"uncertainties":["theta j's represented here by the lines"],"diagram":"none","start":2585.23,"end":2744.98,"asr_flags":[],"math_clarifications":["公式θ·x=0正确表示分类边界，即超平面的法向量方向。"],"boards":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":2585.23,"text":"This is the theta equals zero line."},{"start":2586.61,"text":"It's more cat-like than it is anything else."},{"start":2590.51,"text":"So far, so good?"},{"start":2592.03,"text":"All right."},{"start":2592.61,"text":"Now, how do I deal with the rest of the classes?"},{"start":2594.75,"text":"Well, I have another one."},{"start":2595.91,"text":"And here's another one."},{"start":2596.71,"text":"I'll say, well, this is another line I could have."},{"start":2599.53,"text":"Here's theta."},{"start":2600.35,"text":"I don't know what this is."},{"start":2601.55,"text":"Dogs?"},{"start":2602.09,"text":"Sure."},{"start":2602.55,"text":"Dogs."},{"start":2603.53,"text":"Data 2 dot x is equal to 0."},{"start":2605.31,"text":"And that's what I'll draw on this line."},{"start":2606.63,"text":"It says if you're on this side, you're more dog-like than you're on this side."},{"start":2610.79,"text":"Okay?"},{"start":2611.37,"text":"Now, in our cleanly separated data, I can draw nice hyperplanes that separate it."},{"start":2615.87,"text":"There's all kinds of beautiful theories."},{"start":2617.9,"text":"I have to draw through the dogs, and so on. And I'm drawing little normal vectors to make sure it's clear. Now, the point is that anything here is classified. This line wants to classify, but you can see there's some conflict. What happens in this region? Oops, came back. So what happened in this region? Well, this one says it's kind of dog-like because it's on this side, and this one says I guess it's kind of car-like. Make these guys cars. In this region, I have to bake them off against each other."},{"start":2650.67,"text":"right it's kind of clear for like this one like cats is going to win right everything's cats has like a high value these guys all have negative values for cats so like when i put them in here and plug them in my life is good so i have the theta equals one line i put it in there i'm like oh the dog line it's really far negative it's really far negative from a car and so on does this make sense cool ask me a question about this so how does it work just to make sure it's clear if i have an x"},{"start":2684.56,"text":"I take it, I hit it against each one of the theta j's, these theta j's represented here by the lines. The theta j's, that's the product where they equal zero, right? So they actually are, you know, they're actually going in a different direction. They're actually the normal vector if you think about the geometry. That seems to confuse folks quite a bit. This is the line where theta dot x is equal to zero. So the whole plane, this is cleanly separated in the way that we said that all the classes have a unique side that they're on and they're not confused. Go ahead."},{"start":2716.46,"text":"We can only separate things when you can separate them by a line. Right. So we only get perfect classification in the case when they're actually cleanly separable. And you're looking at this picture and you're like, well, this seems stupid because you just can't. I can draw a lot of pictures of points here that you're not going to be able to separate. You have shown me and wasted my time with a weak model. You brought me candy, but you told me nonsense. That's a fair argument."}],"speech_gaps":[],"frame":"../frames/v046/016.webp","frame_time":2597.23},{"title":"指数族、广义线性模型与分类","segments":[{"id":152,"text":"The thing that's misleading is in low dimensions, what you said is true. So if we only did classification in two dimensions, this would be a terrible model. What happens in higher dimensions we talked about is there's weird stuff that goes on in higher dimensions. Closest neighbor and nearest neighbor are about the same. If you think about the volume that's in a sphere, it's almost all concentrated at the edge. And so once you get up into 768 dimensions,","zh":"在低维情况下，你所说的确实是正确的。因此，如果我们只在二维空间中进行分类，这将是一个糟糕的模型。而在高维情况下，我们讨论的是高维空间中会出现一些奇怪的现象。最近邻和最邻近在某种程度上是相似的。如果你考虑一个球体内的体积，它几乎都集中在边缘。因此，一旦进入768维空间，","start":2745.8,"end":2768.34},{"id":153,"text":"then things start to separate, you hope, into more clusters that are underneath the covers. And in fact, the reason 768 dimensions I pick is, I think that was the dimensions for the first GPT-2 model. That was how many dimensions its tokens were in, right? So these things, when you get up to those higher and higher orders, there's just an enormous amount of space. And so they can be separated in a linear way. In fact, you'll see in like week 10 that there are these ideas called kernels that allow you to put them into infinite dimensional spaces and still tell exactly the same story.","zh":"事情开始变得不同，你希望这些数据点能够被分成更多的聚类。事实上，我选择768维的原因是，我认为这是第一个GPT-2模型的维度。这是它的标记在空间中的维度，对吧？因此，当你进入这些更高维度时，空间的规模变得极其庞大。因此，它们可以通过线性方式被分离。事实上，在第10周你会看到，有一些称为核函数的概念，允许你将它们放入无限维空间中，同时仍然讲述完全相同的故事。","start":2769.08,"end":2797.86},{"id":154,"text":"This whole thing that we're doing here linearly, I'm just drawing it because it fits on my iPad. This is not the end of the story. It's a wonderful observation. Awesome. Other questions, please. Each of these files is basically like a two-dimensional, right? Right. Great question.","zh":"我们在这里所做的线性处理，我只是画出来以适应我的iPad。这并不是故事的结束。这是一个美妙的观察。太棒了。还有其他问题吗？每个文件基本上都是二维的，对吧？对的。好问题。","start":2798.48,"end":2816.23},{"id":155,"text":"Exactly right. So you've made a transition there, which is exactly right. So the point was, each one of these I can think about as kind of a logistic regression. But when you think that, you're like, ah, it's not quite a logistic regression because I have to wait against all of the other alternatives. And so the thing that we would hope is that if there were just two classes, which I'll show in a minute, that it indeed collapses the logistic regression, but it generalizes it. And so what you want here is, what I've shown is a really nice, clean case where, in fact, you can separate everything. But as I said,","zh":"你说得完全正确。你在这里做了一个转变，这正是正确的。要点是，我可以将每一个都视为一种逻辑回归。但当你这样想时，你会觉得它并不是完全的逻辑回归，因为你需要与所有其他选项进行比较。因此，我们希望的是，如果只有两个类别，我稍后会展示这一点，它确实会退化为逻辑回归，但同时又将其推广。因此，你在这里想要的是，我所展示的是一种非常干净、清晰的情况，实际上你可以将所有东西分开。但正如我所说，","start":2819.27,"end":2847.17},{"id":156,"text":"There are these regions that are genuinely contentious, if you like, where the model actually has to decide and data points will fall in there. And so you'll see, for example, that it's unclear. Is it images or picture? These two words that are next to each other, which one should it generate? They're going to actually have non-trivial probabilities. The reason exponentials are nice is if you get really far away from a cat,","zh":"有一些区域实际上是真正有争议的，如果你喜欢这么说，模型实际上必须做出决定，数据点会落在这些区域里。你会看到，例如，不清楚的是，这是图像还是图片？这两个相邻的词，它应该生成哪一个？它们实际上会有非平凡的概率。指数函数之所以好，是因为如果你离猫非常远，比如你的距离是五，五减去五乘以指数负五是一个比较小的数，对吧？如果事物与你关心的区域非常明确地分开，它们会被指数函数压缩掉。这就是你所喜欢的，你会得到sigmoid行为，这就是你从逻辑回归中所捕捉到的部分。这部分是直接回答了很棒的问题，是的，你完全正确，其他问题请继续提出。","start":2847.59,"end":2869.33},{"id":157,"text":"The reason exponentials are nice is if you get really far away from a cat, like your your distance is five minus five e to the minus five is a smallish number right and so if things are very clearly separated from the region you care about they're going to get crushed by the exponential that's one of the things you like you get that sigmoid behavior which is what you're picking up on from the logistics so that part is is directly on awesome question yeah you got exactly right other questions please","zh":"指数函数之所以好是因为如果你离猫非常远，比如你的距离是五减五乘以e的负五次方，这会是一个比较小的数，对吧？所以如果事物与你关心的区域非常明确地分开，它们就会被指数函数压缩，这是你想要的一种特性，你会得到类似sigmoid的行为，这就是你从逻辑斯蒂函数中所捕捉到的部分，这个问题问得非常好，你说得完全正确，还有其他问题吗？","start":2869.74,"end":2892.24},{"id":158,"text":"Exactly right. So that's one way you can do inference. So one way you can do inference is, what we call inference for this lecture is producing all the probabilities for all the classes.","zh":"完全正确。因此，这是你进行推断的一种方式。因此，你进行推断的一种方式是，我们称之为本节课中的推断，
