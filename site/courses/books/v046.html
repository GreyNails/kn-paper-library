 a couple of pages of"},{"start":4050.44,"text":"or a couple of bits of derivation."},{"start":4052.32,"text":"It's not a complicated derivation."},{"start":4053.3,"text":"Take the logs, take the derivatives, you're done."},{"start":4055.44,"text":"Yeah."},{"start":4057.62,"text":"Great questions."},{"start":4058.5,"text":"Other questions?"},{"start":4060.12,"text":"Please."},{"start":4060.98,"text":"Is the x equals j, is the x referring"},{"start":4064.1,"text":"to the label of the?"},{"start":4067.14,"text":"JASON KUO- Yeah, that notation's not very good."},{"start":4068.82,"text":"Yeah, that's basically saying x has label j."},{"start":4071.68,"text":"I don't like that notation either."},{"start":4073.66,"text":"It should be a y, though."},{"start":4075.3,"text":"Yeah."},{"start":4079.02,"text":"There's a reason that dimensional modeling is for software in the first place, just to make sure the lines are positive and to get that psyche."}],"speech_gaps":[{"start":3956.848,"end":3958.608},{"start":4017.104,"end":4019.76}],"frame":"../frames/v046/024.webp","frame_time":3926.17},{"title":"指数族、广义线性模型与分类","segments":[{"id":309,"text":"Awesome question. Yeah. So the question is, why, why softmax? Why not something else? And, you know, in one hand, it's because it looks like it should be blunt. And what I mean by looks like it should is we have logistic regression, we have these other things which have nice properties, and you just identified exactly the right properties, the properties that has that smoothly interpolates between zero and one, it sort of bakes off all of the alternatives and kind of a clear way. There is also I would say there's one part which I kind of don't agree with. But philosophically, there was a long"},{"id":310,"text":"when there's a class of statisticians who are great and I love and I read their books, but they were really obsessed with different ways of motivating distributions through maximum entropy. And so there is a whole area for discrete things where these are the maximum entropy distributions. So that makes them right. They assume the least. And so the fact that they had this exponential form..."},{"id":311,"text":"was very nice from that the last and most important bit is extremely numerically convenient so like it turns out that what you also want is you don't want something usually that goes to zero so like imagine you had a loss that what it would do is it would pick the right one like we're saying you know pick the highest one and get and spread no information about the others you wouldn't kind of back prop into those weights as much or you wouldn't take a derivative into those weights as much you just throw information away and so those properties that kind of smoothly varies it made it look sigmoid like and most natural"},{"id":312,"text":"I remember when I first started playing with these models way back when,"},{"id":313,"text":"it felt really ad hoc to me. And what I realized then wasn't that it was a special choice. That's"},{"id":314,"text":"what I'm trying to convey to you. It does have good properties. There's a reason we use it."},{"id":315,"text":"But the more I feel like, no, it's really convenient. It's numerically stable."},{"id":316,"text":"And you have to justify doing something else instead of it. It doesn't mean you won't."},{"id":317,"text":"You will have instances where you use something different. But that's how it became the standard."},{"id":318,"text":"Because it has exactly the properties that you mentioned."},{"id":319,"text":"mentioned."},{"id":320,"text":"We also know how to make it more numerically stable"},{"id":321,"text":"and run it fast enough and stuff like that."},{"id":322,"text":"It's not true of all functions."},{"id":323,"text":"Wonderful questions."},{"id":324,"text":"Other questions?"},{"id":325,"text":"Awesome."},{"id":326,"text":"Please."},{"id":327,"text":"Matthew, I was going to talk to the label smoothing"},{"id":328,"text":"result. Do you use it overfittingly?"},{"id":329,"text":"It seems like it's overfitting."},{"id":330,"text":"Oh, yeah."},{"id":331,"text":"OK, great question."},{"id":332,"text":"So we don't have the vocabulary to talk about how"},{"id":333,"text":"it reduces overfitting quite yet."},{"id":334,"text":"Maybe it's next lecture or the lecture after that."},{"id":335,"text":"But I wanted to get you the intuition for how it works because you're likely to see those as kind of a bundled unit, cross entropy and label smoothing that you want to actually do these two pieces together."},{"id":336,"text":"So we'll talk a little bit about how regularization comes into the picture."},{"id":337,"text":"What I was trying to say is the intuition there of how it comes to be is if you were perfectly confident in your label and it was exactly right and there was one archetype like this is there's only one monkey in the world and this is it."},{"id":338,"text":"right? It doesn't really make sense. But if you had that thing where you just wanted X"},{"id":339,"text":"to be exactly on top of it, you wouldn't need to do any labels."}],"notes":["本段主要讨论为什么使用softmax函数而不是其他函数。讲者指出softmax函数具有平滑的性质，能够将输出值映射到0到1之间，这与逻辑回归等模型的特性一致。此外，softmax函数在数学上具有指数形式，这使得它在计算上非常方便，且在数值稳定性方面表现良好。","讲者提到，softmax函数的使用并非偶然，而是因为它具有良好的性质，如平滑性、数值稳定性等。这些性质使得它成为分类任务的标准选择。同时，讲者也提到，虽然softmax函数在某些情况下可能不是最优选择，但它的优势使其成为默认选择。","讲者还提到，softmax函数在数值计算上非常方便，因为它可以避免某些计算上的问题，如数值溢出。此外，讲者还提到，softmax函数的使用在某些情况下可能需要进行调整，例如通过标签平滑来减少过拟合。","讲者提到，标签平滑是一种用于减少过拟合的技术，它通过在损失函数中引入一些噪声来防止模型对训练数据过于敏感。然而，讲者指出，目前还没有足够的词汇来详细讨论标签平滑如何减少过拟合，这可能将在后续课程中讨论。","讲者还提到，标签平滑和交叉熵损失函数通常一起使用，因为它们共同作用于模型的训练过程。此外，讲者还提到，正则化在模型训练中起着重要作用，但目前还没有足够的词汇来详细讨论这一点。","最后，讲者提到，如果对标签非常自信，并且只有一个样本，那么标签平滑可能并不适用。然而，如果希望模型对输入进行精确的预测，那么标签平滑可能是一个有用的工具。"],"formulas":[],"uncertainties":["from that the last and most important bit is extremely numerically convenient so like it turns out that what you also want is you don't want something usually that goes to zero so like imagine you had a loss that what it would do is it would pick the right one like we're saying you know pick the highest one and get and spread no information about the others you wouldn't kind of back prop into those weights as much or you wouldn't take a derivative into those weights as much you just throw information away and so those properties that kind of smoothly varies it made it look sigmoid like and most natural"],"diagram":"none","start":4086.82,"end":4253.16,"asr_flags":[319],"raw_segments":[{"start":4086.82,"text":"Awesome question. Yeah. So the question is, why, why softmax? Why not something else? And, you know, in one hand, it's because it looks like it should be blunt. And what I mean by looks like it should is we have logistic regression, we have these other things which have nice properties, and you just identified exactly the right properties, the properties that has that smoothly interpolates between zero and one, it sort of bakes off all of the alternatives and kind of a clear way. There is also I would say there's one part which I kind of don't agree with. But philosophically, there was a long"},{"start":4116.04,"text":"when there's a class of statisticians who are great and I love and I read their books, but they were really obsessed with different ways of motivating distributions through maximum entropy. And so there is a whole area for discrete things where these are the maximum entropy distributions. So that makes them right. They assume the least. And so the fact that they had this exponential form..."},{"start":4137.02,"text":"was very nice from that the last and most important bit is extremely numerically convenient so like it turns out that what you also want is you don't want something usually that goes to zero so like imagine you had a loss that what it would do is it would pick the right one like we're saying you know pick the highest one and get and spread no information about the others you wouldn't kind of back prop into those weights as much or you wouldn't take a derivative into those weights as much you just throw information away and so those properties that kind of smoothly varies it made it look sigmoid like and most natural"},{"start":4166.34,"text":"I remember when I first started playing with these models way back when,"},{"start":4170.22,"text":"it felt really ad hoc to me. And what I realized then wasn't that it was a special choice. That's"},{"start":4175.14,"text":"what I'm trying to convey to you. It does have good properties. There's a reason we use it."},{"start":4178.8,"text":"But the more I feel like, no, it's really convenient. It's numerically stable."},{"start":4182.84,"text":"And you have to justify doing something else instead of it. It doesn't mean you won't."},{"start":4186.78,"text":"You will have instances where you use something different. But that's how it became the standard."},{"start":4191.16,"text":"Because it has exactly the properties that you mentioned."},{"start":4193.52,"text":"mentioned."},{"start":4194.06,"text":"We also know how to make it more numerically stable"},{"start":4195.92,"text":"and run it fast enough and stuff like that."},{"start":4198.7,"text":"It's not true of all functions."},{"start":4201.38,"text":"Wonderful questions."},{"start":4202.2,"text":"Other questions?"},{"start":4206.62,"text":"Awesome."},{"start":4207.32,"text":"Please."},{"start":4208.4,"text":"Matthew, I was going to talk to the label smoothing"},{"start":4210.62,"text":"result. Do you use it overfittingly?"},{"start":4213.3,"text":"It seems like it's overfitting."},{"start":4215.18,"text":"Oh, yeah."},{"start":4215.72,"text":"OK, great question."},{"start":4216.46,"text":"So we don't have the vocabulary to talk about how"},{"start":4218.74,"text":"it reduces overfitting quite yet."},{"start":4220.34,"text":"Maybe it's next lecture or the lecture after that."},{"start":4222.24,"text":"But I wanted to get you the intuition for how it works because you're likely to see those as kind of a bundled unit, cross entropy and label smoothing that you want to actually do these two pieces together."},{"start":4232.32,"text":"So we'll talk a little bit about how regularization comes into the picture."},{"start":4235.6,"text":"What I was trying to say is the intuition there of how it comes to be is if you were perfectly confident in your label and it was exactly right and there was one archetype like this is there's only one monkey in the world and this is it."},{"start":4247.54,"text":"right? It doesn't really make sense. But if you had that thing where you just wanted X"},{"start":4250.94,"text":"to be exactly on top of it, you wouldn't need to do any labels."}],"speech_gaps":[],"frame":"../frames/v046/025.webp","frame_time":4098.82},{"title":"指数族、广义线性模型与分类","segments":[{"id":340,"text":"But if you have this kind of neighborhood, this kind of ball around the monkey archetype, I don't know why I'm switching to monkeys, but whatever, like that archetype, then label smoothing starts to make sense. And what it's capturing is, do I have any distribution over the classes? Will I ever get confused by them? The most natural way to get confused by them is to say, as I said, I know it's a car or I know it's a cat or a dog, but I know it's not a car. You could put that into cross entropy and train it. What's interesting here is that just putting in a little bit of noise across everything, is it just another form?"},{"id":341,"text":"of regularization. We'll see others where we make the weight shrink. That's another one. You make the weights a little bit smaller. Or we add in what's called an explicit penalty term. All of these are going to turn out to be about the same with different bits of normalization. This is just one that you're likely to encounter. And then the last piece is there's a bunch of work we did that turned into a bunch of stuff that people... A small set of people use where you can actually predict the label distribution without having to train a model through what are called method of moments techniques. You could predict these different labels and get a better estimate."},{"id":342,"text":"than just 0 or 1. Say you trusted source A more than source B, as we talked about. And you could imagine having almost another model there to predict that ahead of time. This, which looked like an obscure thing to do 10 years ago, is now something you would possibly do if you were running simulations or other things under the covers, especially with potentially long-running agents where you get more information. So you may know that it's an A or a B that you actually want to generate."},{"id":343,"text":"So that's another thing that you could incorporate. So those are the reasons you would potentially have a distribution. It turns out this simple, uninformative one actually does some good. That's the message. Not like it's, oh, this is the right thing to do. Just a thing you can do. Great questions. Awesome. Any others? Okay. All right. So we saw the exponential families that gave us a path to generalize to a wider set of models."},{"id":344,"text":"This is the thing that we were after. We wanted to basically say everything that you learned so far in this course basically was two slides of this lecture. It's just you can do inference, you can do learning as long as it's in this form and you model the error. There's that one slide where I put it all kind of down there. That was basically saying all the stuff you would learn were variants of that. Of course, you have to understand features and concepts and all that. But that's the key piece of there. And so we did that. We saw the cross entropy and softmax, which is to show you that these are techniques that are foundational. We're supposed to teach you foundational stuff."},{"id":345,"text":"This is stuff that you have probably used in a product within the last hour, definitely within the last 24 hours. I mentioned label smoothing because I wanted to also highlight this point that your data and model are always a little bit wrong. You can get really hung up on, is this the right thing to do?"}],"notes":["本段讨论了标签平滑（label smoothing）的概念，指出其通过在所有类别上引入噪声来防止模型对训练数据的过度拟合。讲者提到，标签平滑捕捉了模型是否对类别分布有混淆的可能，并举例说明了在知道某个类别不是目标类别时，如何通过交叉熵进行训练。","讲者进一步解释了标签平滑是正则化的一种形式，与其他形式如权重缩减和显式惩罚项类似，但都涉及不同的归一化方式。此外，还提到一种称为矩方法（method of moments）的技术，可以预测标签分布而无需训练模型。","讲者提到，标签平滑可以用于处理多个来源的可信度差异，例如信任来源A比来源B更可靠。这种技术在模拟或长期运行的代理中特别有用，因为可以提前预测标签分布。","讲者指出，标签平滑是一种简单但有效的技术，虽然不是唯一正确的做法，但可以作为一种实用的工具。此外，讲者强调了课程中所讲的指数族和广义线性模型的重要性，指出这些是构建更广泛模型的基础。","讲者提到，课程中所讲的内容是构建模型和进行推理的基础，这些技术在实际产品中被广泛使用。最后，讲者强调了数据和模型总是存在一定的错误，因此需要对这些错误保持敏感。","讲者通过标签平滑的例子，强调了模型和数据的不完美性，并指出在实际应用中，需要考虑这些不完美性以改进模型性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4253.87,"end":4406.66,"asr_flags":[],"raw_segments":[{"start":4253.87,"text":"But if you have this kind of neighborhood, this kind of ball around the monkey archetype, I don't know why I'm switching to monkeys, but whatever, like that archetype, then label smoothing starts to make sense. And what it's capturing is, do I have any distribution over the classes? Will I ever get confused by them? The most natural way to get confused by them is to say, as I said, I know it's a car or I know it's a cat or a dog, but I know it's not a car. You could put that into cross entropy and train it. What's interesting here is that just putting in a little bit of noise across everything, is it just another form?"},{"start":4283.18,"text":"of regularization. We'll see others where we make the weight shrink. That's another one. You make the weights a little bit smaller. Or we add in what's called an explicit penalty term. All of these are going to turn out to be about the same with different bits of normalization. This is just one that you're likely to encounter. And then the last piece is there's a bunch of work we did that turned into a bunch of stuff that people... A small set of people use where you can actually predict the label distribution without having to train a model through what are called method of moments techniques. You could predict these different labels and get a better estimate."},{"start":4312.4,"text":"than just 0 or 1. Say you trusted source A more than source B, as we talked about. And you could imagine having almost another model there to predict that ahead of time. This, which looked like an obscure thing to do 10 years ago, is now something you would possibly do if you were running simulations or other things under the covers, especially with potentially long-running agents where you get more information. So you may know that it's an A or a B that you actually want to generate."},{"start":4335.97,"text":"So that's another thing that you could incorporate. So those are the reasons you would potentially have a distribution. It turns out this simple, uninformative one actually does some good. That's the message. Not like it's, oh, this is the right thing to do. Just a thing you can do. Great questions. Awesome. Any others? Okay. All right. So we saw the exponential families that gave us a path to generalize to a wider set of models."},{"start":4361.76,"text":"This is the thing that we were after. We wanted to basically say everything that you learned so far in this course basically was two slides of this lecture. It's just you can do inference, you can do learning as long as it's in this form and you model the error. There's that one slide where I put it all kind of down there. That was basically saying all the stuff you would learn were variants of that. Of course, you have to understand features and concepts and all that. But that's the key piece of there. And so we did that. We saw the cross entropy and softmax, which is to show you that these are techniques that are foundational. We're supposed to teach you foundational stuff."},{"start":4390.96,"text":"This is stuff that you have probably used in a product within the last hour, definitely within the last 24 hours. I mentioned label smoothing because I wanted to also highlight this point that your data and model are always a little bit wrong. You can get really hung up on, is this the right thing to do?"}],"speech_gaps":[],"frame":"../frames/v046/026.webp","frame_time":4265.87},{"title":"指数族、广义线性模型与分类","segments":[{"id":346,"text":"That's good. You should think about that. But often in machine learning, it's kind of looking for the more robust thing to do. So doing things that are more robust to the noise and the errors and the problems, that seems to be where we arc a lot of these models. And we'll try and be more formal about that as we get a little bit more mathematical sophistication about that. And then I emphasize this many times, but it's worth highlighting again. This exact setup, softmax with cross-entropy, is underneath all these amazing AIs. And I don't know if you love them as much as I do, but as I told you, my wife said I've been building the same demos. She met me. We've been together since we were undergrads."},{"id":347,"text":"But now the demos work and it's so awesome. They're so amazing and the fact that this is like the last layer and all those parameters is very cool. So I'm glad that I could share that with you."}],"notes":["本段主要讨论机器学习中模型的鲁棒性，强调在面对噪声和误差时，模型应尽可能稳健。讲者提到，许多模型的设计目标是增强对这些问题的抵抗能力，并指出在后续课程中会更正式地讨论这一概念。","讲者再次强调softmax与交叉熵损失函数的组合是现代AI系统的核心组成部分，这一结构支撑了众多强大的人工智能应用。讲者还提到自己与妻子的互动，说明这一技术的实用性与个人生活之间的联系。","讲者提到演示程序现在已能正常运行，并表达了对这一成果的自豪感。他指出，这些模型的最后层和参数设置非常有趣，这体现了模型设计中的关键细节对整体性能的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4407.76,"end":4446.3,"asr_flags":[],"raw_segments":[{"start":4407.76,"text":"That's good. You should think about that. But often in machine learning, it's kind of looking for the more robust thing to do. So doing things that are more robust to the noise and the errors and the problems, that seems to be where we arc a lot of these models. And we'll try and be more formal about that as we get a little bit more mathematical sophistication about that. And then I emphasize this many times, but it's worth highlighting again. This exact setup, softmax with cross-entropy, is underneath all these amazing AIs. And I don't know if you love them as much as I do, but as I told you, my wife said I've been building the same demos. She met me. We've been together since we were undergrads."},{"start":4437.3,"text":"But now the demos work and it's so awesome. They're so amazing and the fact that this is like the last layer and all those parameters is very cool. So I'm glad that I could share that with you."}],"speech_gaps":[],"frame":"../frames/v046/027.webp","frame_time":4419.76}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
