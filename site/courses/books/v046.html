t's a point for the moment and then now i'm going to figure out how likely it is by the error profile that i have just as we did in the last time this error profile we have only used at learning"},{"start":1597.55,"text":"time but we can also use it when we do predictions recall that when we did logistic regression the actual prediction was what's the probability that it's in class one in the same way we'll see later when the big ai runs at the end it says what's the probability that the next word is gallery right it's going to look over all the words that it has in its dictionary and when it does inference it's going to list those probabilities because it's a multinomial it's actually a fairly straightforward operation and this is"},{"start":1623.06,"text":"effectively unifying it. I don't want to put the causality in the wrong direction. It's not like the multinomial is easy because exponential families exist. Exponential families exist because they're capturing the fact that all these errors are actually easy and in the same model. It's more compression in your head rather than compression in code, if you like. Wonderful questions. So happy to get these. Oh, please."},{"start":1648.28,"text":"In terms of error, you mentioned that the choice of loss function is handled by the exponential model family. What does that mean?"},{"start":1655.32,"text":"Great question. Let's get to that when we actually go through learning, which will come in one or two slides. And if I don't answer it then, come back. But I'll give you the intuition. The intuition is because it's going to give you the inference, that's going to tell you how likely something is. And then you're going to get that product, that IID product. And when you differentiate that, you're right back into the situation because you're going to have a functional form that says, given my estimate, this is the likelihood or the loss. And it's going to follow exactly the same story we saw before, but we're going to see it in much more detail. It's a wonderful question. You're way ahead of me."},{"start":1686.18,"text":"Awesome. All right. So this is the next slide, generalized linear models. So now we're going to tie this to actual data and modeling. We're going to move from errors to modeling. And you folks are all over this. It's phenomenal. I'm really excited. So what happens here? So the first part of the lecture, I was talking about noise models, error models. But that's not what machine learning is about. Machine learning, we've talked about in supervised setting is we're given some data and features, x, which we live in our d plus 1. d plus 1, of course, because we have that extra 1 column we've appended."}],"speech_gaps":[],"frame":"../frames/v046/010.webp","frame_time":1551.74},{"title":"指数族、广义线性模型与分类","segments":[{"id":69,"text":"And we have a target y, and we want to model. Now we're not talking about what type y is because we have all these different types that we can use. So what we're going to do is we're going to pick a distribution based on y's type. So we're going to pick binary. We could pick Bernoulli. If we pick multiple classes, we can pick multinomial. And this is going to pick the modeling class. And remember we had this fun notation before, this bar notation that says conditioned on x."},{"id":70,"text":"the distribution of y, we've been working on effectively this function. When you think about the bar, think about it as a function. It's a noisy function, but it's a function that takes in an x for a fixed parameter theta and spits out a y, or in this case, a distribution over y. The only distribution we've seen really so far is the logistic one, which was just two numbers, but it could be bigger. We'll see how it's bigger."},{"id":71,"text":"So now our model is going to be linear. And what that means is we're going to make the natural parameter, we're going to remove the natural parameter, and we're going to talk about theta tx. So remember, theta is the parameters that we learn. And this is the most confusing part of this notation, so I'm going to go really slowly through here. I apologize if it's too pedantic, but I'd rather do that than be confused. Theta is a parameter that we learn, and theta together with an x data type is going to create..."},{"id":72,"text":"this natural parameter, eta, of the noise. So the noise has parameters, and we have parameters, our model weights, which I'll try to call them for this section, that we learn, theta, and that's going to tell us how to do this."},{"id":73,"text":"So how does this work? This gets to the inference for free. This gets to the learning. It's not going to be a big reveal. So if you're really excited about the next three lines, I'm so sorry to let you down. It's hopefully going to be really simple. Inference means h theta x equals e of y is exactly the output. So remember in logistic regression, what was the actual output of logistic regression? It was a probability that you were in a particular class. Remember the sigmoid? You picked the height of the curve and you said that was your probability. That is this value here."},{"id":74,"text":"Okay? That was the output. Now it was captured by one number because it was Boolean. We didn't have to write, you know, p and 1 minus p. We just wrote 1. Okay? Like convention. How does learning work? Well, it's the max of the log likelihood."},{"id":75,"text":"How does that work? Well, think about what's going to happen. We're going to make that IID assumption. That means every error is identically distributed. It's going to be one of the classes that you picked. It's going to be a sum, a log sum over all of them, because you would multiply them if they're independent. So the log will turn it into a sum. And then you're going to try and pick the theta that gives you the highest probability for your data, given the error model. So getting back to the wonderful question before, how does this determine the loss function? It's through this."}],"notes":["本段讲解了广义线性模型中如何根据目标变量y的类型选择合适的概率分布，如二元变量选择伯努利分布，多类变量选择多项分布。同时，强调了模型参数θ的作用，以及如何通过θ和输入x来构建自然参数η，从而定义模型的输出分布。","讲者提到模型是线性的，意味着自然参数η与输入x和参数θ之间存在线性关系。θ是模型需要学习的参数，而η是噪声的自然参数，这表明模型的输出分布由θ和x共同决定。","在推理部分，讲者指出hθ(x)等于y的期望值，即输出为y的概率。这与逻辑回归中的sigmoid函数输出概率一致，说明模型的输出是基于输入x和参数θ的线性组合。","学习过程涉及最大化对数似然函数，假设数据是独立同分布的。通过最大化对数似然，可以找到使数据在给定误差模型下概率最大的参数θ。","讲者提到损失函数的确定与对数似然函数有关，通过最大化对数似然来选择最优参数θ，这表明损失函数是负对数似然函数。","整个过程强调了广义线性模型中参数θ的作用，以及如何通过自然参数η和输入x的线性组合来构建输出分布，同时涉及了模型的推理和学习过程。"],"formulas":[{"latex":"h_{\\theta}(x) = \\mathbb{E}[y]","symbols":"hθ(x) 表示给定输入x和参数θ时，y的期望值","explanation":"公式正确，表示在给定输入x和参数θ时，输出y的期望值。","evidence":"So how does this work? This gets to the inference for free. This gets to the learning. It's not going to be a big reveal. So if you're really excited about the next three lines, I'm so sorry to let you down. It's hopefully going to be really simple. Inference means h theta x equals e of y is exactly the output. So remember in logistic regression, what was the actual output of logistic regression? It was a probability that you were in a particular class. Remember the sigmoid? You picked the height of the curve and you said that was your probability. That is this value here."}],"uncertainties":["theta tx"],"diagram":"none","start":1715.11,"end":1885.75,"asr_flags":[],"math_clarifications":["公式中的期望值表示在给定输入x和参数θ时，输出y的期望值，符合逻辑回归中输出概率的定义。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1715.11,"text":"And we have a target y, and we want to model. Now we're not talking about what type y is because we have all these different types that we can use. So what we're going to do is we're going to pick a distribution based on y's type. So we're going to pick binary. We could pick Bernoulli. If we pick multiple classes, we can pick multinomial. And this is going to pick the modeling class. And remember we had this fun notation before, this bar notation that says conditioned on x."},{"start":1741.05,"text":"the distribution of y, we've been working on effectively this function. When you think about the bar, think about it as a function. It's a noisy function, but it's a function that takes in an x for a fixed parameter theta and spits out a y, or in this case, a distribution over y. The only distribution we've seen really so far is the logistic one, which was just two numbers, but it could be bigger. We'll see how it's bigger."},{"start":1764.5,"text":"So now our model is going to be linear. And what that means is we're going to make the natural parameter, we're going to remove the natural parameter, and we're going to talk about theta tx. So remember, theta is the parameters that we learn. And this is the most confusing part of this notation, so I'm going to go really slowly through here. I apologize if it's too pedantic, but I'd rather do that than be confused. Theta is a parameter that we learn, and theta together with an x data type is going to create..."},{"start":1792.29,"text":"this natural parameter, eta, of the noise. So the noise has parameters, and we have parameters, our model weights, which I'll try to call them for this section, that we learn, theta, and that's going to tell us how to do this."},{"start":1808.13,"text":"So how does this work? This gets to the inference for free. This gets to the learning. It's not going to be a big reveal. So if you're really excited about the next three lines, I'm so sorry to let you down. It's hopefully going to be really simple. Inference means h theta x equals e of y is exactly the output. So remember in logistic regression, what was the actual output of logistic regression? It was a probability that you were in a particular class. Remember the sigmoid? You picked the height of the curve and you said that was your probability. That is this value here."},{"start":1838.78,"text":"Okay? That was the output. Now it was captured by one number because it was Boolean. We didn't have to write, you know, p and 1 minus p. We just wrote 1. Okay? Like convention. How does learning work? Well, it's the max of the log likelihood."},{"start":1855.53,"text":"How does that work? Well, think about what's going to happen. We're going to make that IID assumption. That means every error is identically distributed. It's going to be one of the classes that you picked. It's going to be a sum, a log sum over all of them, because you would multiply them if they're independent. So the log will turn it into a sum. And then you're going to try and pick the theta that gives you the highest probability for your data, given the error model. So getting back to the wonderful question before, how does this determine the loss function? It's through this."}],"speech_gaps":[],"frame":"../frames/v046/011.webp","frame_time":1727.11},{"title":"指数族、广义线性模型与分类","segments":[{"id":76,"text":"This log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,"},{"id":77,"text":"and I move in that direction for theta t. So all the things that you saw that we derived one after the other as consequences of logistic regression or least squares are actually just instances of a more general algorithm. And this algorithm works no matter how you pick the errors. So getting back to it, when I say think in terms of errors, once you've picked the errors, which are picked for you by the types that you're modeling, then..."},{"id":78,"text":"You get all this stuff for free, meaning intellectually, now you know how to do inference, now you know how to do learning, and now you have an algorithm actually under the covers for SGD that has a very simple form. So it shows in some way that those things are not accidents about the way we wrote them. We did have to write the distribution in a funny form. That's okay. It's done once. You look it up in a table. Questions now? Okay."},{"id":79,"text":"So I think you're going to have homeworks where you're going to start to try and play with some of these, where you'll play with different distributions and try and use those distributions to do this. This, as I said, is extremely powerful. Some of these are distributions on distributions. I mean, they're really powerful models that you can put underneath the covers. But now you have, at least in principle, a way to learn all of them."},{"id":80,"text":"Awesome. All right. So this is the part that I highlight because it drives everyone crazy. So the worst part of this lecture, and maybe there's many worst parts, one of my least favorite parts and the one that seems to empirically confuse you the most is this. You have all these names for parameters, and I hate remembering names for things, but this is a place where it helps, at least conceptually. There are model parameters."},{"id":81,"text":"Those are the thetas. That's what you would learn underneath the covers. That's the estimate. Remember, it's p sub theta. That turns into a different kind of parameter once you smash it with some x."},{"id":82,"text":"That's going to turn into a natural parameter in our formulation. Theta dot x turns into this. And then that turns by a link function into all of these parameters, which you say are the canonical parameters. Those are probably the parameters that, if you were to look it up in Wikipedia, are there. Remember, we wrote Bernoulli as p, 1 minus p kind of thing. These are their canonical ones. That's usually not how they're written down, but here we have this link function or response function."}],"notes":["本段讲解了广义线性模型（GLM）的基本思想，即通过最大似然估计来学习模型参数，并指出梯度上升算法在实际中可能转化为梯度下降问题。同时，强调了算法的通用性，无论选择哪种误差函数，都可以使用相同的框架进行学习。","讲者提到，通过将误差函数与数据结合，可以使用随机梯度下降（SGD）进行参数更新。这表明，之前在逻辑回归和最小二乘法中推导出的算法实际上是广义线性模型框架下的特例。","讲者指出，通过将模型参数与输入数据结合，可以得到自然参数，再通过链接函数转换为经典参数。这解释了为什么在某些情况下，参数的表示形式会有所不同，例如伯努利分布的参数通常以p表示，但在广义线性模型中则以自然参数形式出现。","讲者强调了模型参数（thetas）与自然参数、经典参数之间的区别，并指出这些参数在不同上下文中的含义不同。例如，模型参数是需要学习的参数，而自然参数是通过数据与模型参数的组合得到的。","讲者提到，广义线性模型的框架非常强大，可以应用于各种分布，包括分布上的分布。这表明，该模型可以作为更复杂模型的基础，例如在贝叶斯推断中使用。","最后，讲者指出，理解这些参数之间的关系对于掌握广义线性模型至关重要，尽管这在概念上可能令人困惑，但它是理解模型结构和学习过程的关键。"],"formulas":[{"latex":"\\text{gradient ascent}","symbols":"梯度上升","explanation":"保持原样，梯度上升是优化算法的正确术语。","evidence":"this log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,"},{"latex":"\\text{SGD}","symbols":"随机梯度下降","explanation":"保持原样，SGD是标准的机器学习术语。","evidence":"this log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,"},{"latex":"\\text{link function}","symbols":"链接函数","explanation":"保持原样，链接函数是统计学和机器学习中的标准术语。","evidence":"That's going to turn into a natural parameter in our formulation. Theta dot x turns into this. And then that turns by a link function into all of these parameters, which you say are the canonical parameters. Those are probably the parameters that, if you were to look it up in Wikipedia, are there. Remember, we wrote Bernoulli as p, 1 minus p kind of thing. These are their canonical ones. That's usually not how they're written down, but here we have this link function or response function."}],"uncertainties":[],"diagram":"none","start":1887.06,"end":2055.74,"asr_flags":[],"math_clarifications":["无法核定log p的具体形式，因为缺少上下文信息。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1887.06,"text":"this log of p. That gives you exactly what you need to do, and now you have to do gradient ascent to get the right thetas. Now it will turn out because of the way that the function works, it'll often turn into a descent problem, but fundamentally it's getting this maximum likelihood. And the last thing is the algorithm always has this really fun form, which you can verify, which is I can always run SGD on all of them, which says I look at the misprediction error, I multiply it by the data,"},{"start":1919.64,"text":"and I move in that direction for theta t. So all the things that you saw that we derived one after the other as consequences of logistic regression or least squares are actually just instances of a more general algorithm. And this algorithm works no matter how you pick the errors. So getting back to it, when I say think in terms of errors, once you've picked the errors, which are picked for you by the types that you're modeling, then..."},{"start":1945.94,"text":"You get all this stuff for free, meaning intellectually, now you know how to do inference, now you know how to do learning, and now you have an algorithm actually under the covers for SGD that has a very simple form. So it shows in some way that those things are not accidents about the way we wrote them. We did have to write the distribution in a funny form. That's okay. It's done once. You look it up in a table. Questions now? Okay."},{"start":1976.0,"text":"So I think you're going to have homeworks where you're going to start to try and play with some of these, where you'll play with different distributions and try and use those distributions to do this. This, as I said, is extremely powerful. Some of these are distributions on distributions. I mean, they're really powerful models that you can put underneath the covers. But now you have, at least in principle, a way to learn all of them."},{"start":1996.76,"text":"Awesome. All right. So this is the part that I highlight because it drives everyone crazy. So the worst part of this lecture, and maybe there's many worst parts, one of my least favorite parts and the one that seems to empirically confuse you the most is this. You have all these names for parameters, and I hate remembering names for things, but this is a place where it helps, at least conceptually. There are model parameters."},{"start":2017.1,"text":"Those are the thetas. That's what you would learn underneath the covers. That's the estimate. Remember, it's p sub theta. That turns into a different kind of parameter once you smash it with some x."},{"start":2028.42,"text":"That's going to turn into a natural parameter in our formulation. Theta dot x turns into this. And then that turns by a link function into all of these parameters, which you say are the canonical parameters. Those are probably the parameters that, if you were to look it up in Wikipedia, are there. Remember, we wrote Bernoulli as p, 1 minus p kind of thing. These are their canonical ones. That's usually not how they're written down, but here we have this link function or response function."}],"speech_gaps":[],"frame":"../frames/v046/012.webp","frame_time":1899.06},{"title":"指数族、广义线性模型与分类","segments":[{"id":83,"text":"There's a lot of terminology, but don't get confused here about which parameters. These are the only ones you learn. The rest of this is modeling the noise. Cool. There's some examples there."},{"id":84,"text":"Yeah. So I think this is the main thing that I want to make sure that you have as a takeaway here"},{"id":85,"text":"from this section is, once you pick a distribution and you set eta to be the state x,"},{"id":86,"text":"the exponential family gives you the rest. You already know all the pieces of inference,"},{"id":87,"text":"you know the pieces of learning, and you can generalize to whatever distribution or type"},{"id":88,"text":"of data that you have. And so you didn't have to have one lecture on least squares and logistic"},{"id":89,"text":"regression and multinomial and Dirichlet processes and Poisson counts and all the rest."},{"id":90,"text":"They're all just one family once you get into them. And so that's been a very powerful modeling"},{"id":91,"text":"modeling tool. And as I said, people have written thick textbooks. I have a big, thick"},{"id":92,"text":"green textbook about generalized linear models, okay?"},{"id":93,"text":"All right. Any questions before I move on? Please."},{"id":94,"text":"I'm not sure if you assume the expected value error would be zero, like your IID and various"},{"id":95,"text":"It does. So let's look at where we made various different forms."},{"id":96,"text":"It does. So let's look at where we made various different forms. So we were not"},{"id":97,"text":"explicit about the error itself being uh mean zero because zero is a scalar and we could want to look"},{"id":98,"text":"we didn't say explicitly but intuitively something like that should happen like basically that the expected"},{"id":99,"text":"explicitly but intuitively something like that should happen like basically that the expected"},{"id":100,"text":"value of zero says if you give me the right answer i shouldn't perturb it far away right"},{"id":101,"text":"that's kind of like what what you think should happen it's kind of more of a robustness care"},{"id":102,"text":"The other one's about IID. That we implicitly made here in the entire setup. And the place where the IID assumption really comes in is right here. Because when you take this log of p, I've been a little bit glib here. That's, remember, p of y, where y is now all the training points and x is all the training data. So that notation is hiding a lot of complexity under the covers. But because it's IID, when we take the log, that p can be decomposed as a product, right? So this p here we can write as some big product. Oops."},{"id":103,"text":"Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here. So iid is an assumption we're implicitly making to make this whole thing go. If it weren't, you couldn't do this decomposition."},{"id":104,"text":"The identically distributed are also in here because we're not assuming that there are mixes of Y models. It's not like when we're here on one distribution and then we're another distribution, although candidly you can combine that into one gigantic distribution. So that one's a little bit less of an issue. Does that make sense? Awesome. Great question."}],"notes":["本段主要讲解指数族分布的建模思想，强调一旦选择分布并设定eta为状态x，其余部分由指数族自动推导。这使得推理和学习的各个部分可以统一处理，无需为不同数据类型单独设计模型。","讲者指出，所有模型（如最小二乘、逻辑回归、多项式分布、狄利克雷过程、泊松计数等）都可以归为广义线性模型，这体现了指数族分布的强大建模能力。","讲者提到，IID假设在推导过程中被隐式使用，特别是在对数似然函数的分解中。IID假设允许将联合概率分解为独立项的乘积，从而简化计算。","讲者进一步解释，独立同分布（IID）假设不仅涉及独立性，还涉及分布的同质性，即所有数据点来自相同的分布。这与混合模型不同，混合模型可能涉及不同分布的组合。","讲者强调，零均值假设在某些情况下是隐式成立的，但并非总是如此。零均值的直观意义是，如果给出正确的答案，模型不应对其做出大的扰动，这体现了模型的鲁棒性。","讲者指出，IID假设是整个推导过程的基础，如果不存在IID假设，就无法进行概率的分解，从而影响模型的构建和优化。"],"formulas":[{"latex":"p(y) = \\frac{1}{Z(\\theta)} \\text{exp}(\\theta^T T(y) - A(\\theta))","symbols":"指数族分布的一般形式","explanation":"该公式正确表达了指数族分布的一般形式，其中 $ Z(\\theta) $ 是规范化常数，$ \\theta $ 是自然参数，$ T(y) $ 是充分统计量，$ A(\\theta) $ 是对数规范化常数。","evidence":"from this section is, once you pick a distribution and you set eta to be the state x,"},{"latex":"p(y_1, y_2, ..., y_n) = \\frac{1}{Z(\\theta)} \\text{exp}(\\theta^T \\sum_{i=1}^{n} T(y_i) - nA(\\theta))","symbols":"独立同分布（IID）假设下的联合概率分解","explanation":"该公式在独立同分布（IID）假设下，将联合概率分解为各独立项的乘积，并通过对数转换为求和形式。公式中的 $ n $ 表示样本数量，$ \\sum_{i=1}^{n} T(y_i) $ 是所有样本的充分统计量之和。","evidence":"Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here. So iid is an assumption we're implicitly making to make this whole thing go. If it weren't, you couldn't do this decomposition."}],"uncertainties":["Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here."],"diagram":"none","start":2056.72,"end":2231.57,"asr_flags":[],"math_clarifications":["公式中的 $ Z(\\theta) $ 是规范化常数，确保概率分布的总和为1。"],"raw_segments":[{"start":2056.72,"text":"There's a lot of terminology, but don't get confused here about which parameters. These are the only ones you learn. The rest of this is modeling the noise. Cool. There's some examples there."},{"start":2078.17,"text":"Yeah. So I think this is the main thing that I want to make sure that you have as a takeaway here"},{"start":2082.37,"text":"from this section is, once you pick a distribution and you set eta to be the state x,"},{"start":2086.89,"text":"the exponential family gives you the rest. You already know all the pieces of inference,"},{"start":2090.65,"text":"you know the pieces of learning, and you can generalize to whatever distribution or type"},{"start":2093.71,"text":"of data that you have. And so you didn't have to have one lecture on least squares and logistic"},{"start":2097.89,"text":"regression and multinomial and Dirichlet processes and Poisson counts and all the rest."},{"start":2102.47,"text":"They're all just one family once you get into them. And so that's been a very powerful modeling"},{"start":2106.55,"text":"modeling tool. And as I said, people have written thick textbooks. I have a big, thick"},{"start":2109.93,"text":"green textbook about generalized linear models, okay?"},{"start":2114.69,"text":"All right. Any questions before I move on? Please."},{"start":2119.87,"text":"I'm not sure if you assume the expected value error would be zero, like your IID and various"},{"start":2125.71,"text":"."},{"start":2127.83,"text":"It does. So let's look at where we made various different forms. So we were not"},{"start":2134.69,"text":"explicit about the error itself being uh mean zero because zero is a scalar and we could want to look"},{"start":2141.09,"text":"in other different types where zero you know may or may not exist so that zero part we didn't say"},{"start":2145.87,"text":"explicitly but intuitively something like that should happen like basically that the expected"},{"start":2150.05,"text":"value of zero says if you give me the right answer i shouldn't perturb it far away right"},{"start":2154.35,"text":"that's kind of like what what you think should happen it's kind of more of a robustness care"},{"start":2158.44,"text":"The other one's about IID. That we implicitly made here in the entire setup. And the place where the IID assumption really comes in is right here. Because when you take this log of p, I've been a little bit glib here. That's, remember, p of y, where y is now all the training points and x is all the training data. So that notation is hiding a lot of complexity under the covers. But because it's IID, when we take the log, that p can be decomposed as a product, right? So this p here we can write as some big product. Oops."},{"start":2189.2,"text":"Pi j goes from 1 to n of p of yj, blah, blah, blah, xj, theta. So this thing here that goes into the sum form, which we're implicitly using down here, this is all happening here. So iid is an assumption we're implicitly making to make this whole thing go. If it weren't, you couldn't do this decomposition."},{"start":2215.93,"text":"The identically distributed are also in here because we're not assuming that there are mixes of Y models. It's not like when we're here on one distribution and then we're another distribution, although candidly you can combine that into one gigantic distribution. So that one's a little bit less of an issue. Does that make sense? Awesome. Great question."}],"speech_gaps":[],"frame":"../frames/v046/013.webp","frame_time":2068.72},{"title":"多类分类与概率分布表示","segments":[{"id":105,"text":"Multi-class classification. As I told you, this is the thing that you probably use the most. I think as I said on my opening slide, this is the thing that I used this morning implicitly when having Cloud Code, make sure that I put in all of the visualizations I wanted to put in and deleted things that I was supposed to delete. Every token it generated came from multi-class classification."},{"id":106,"text":"All right. So how does it work? Let's get the basics down. So suppose we wanted to choose among k discrete values. Here, I'm going to pick four, and I'm going to pick short words so that I can put them on the slide. So we have our classes are kind of bizarrely cat, dog, car, bus. I'm not sure exactly what we're trying to decide among here, but just go with it. They're just values. If you need a narrative story, I don't know, make up a story that has a cat, a dog, a car, and a bus. Maybe the cat's driving the bus, and the dog is in the car, and they're angry at each other. Who knows? Anyway."},{"id":107,"text":"whatever you think about. Now, the way we encode those is we encode them as one-hot vectors. So the idea here is that cat is going to be E1, or E0 depending on how you do the notation, E1 typically. It's going to have a 1 here. 0 is everywhere else. Dog is going to be E2. Car, E3. Bus, E4."},{"id":108,"text":"Now, this allows us to talk about nice things. Like when we put them together, we can sum them nicely and assign probability distributions and all the rest. They're kind of the support vectors that we have. This is a mathematical convenience and is the way that we do it. It's just a nice thing to have."},{"id":109,"text":"So a prediction is a distribution over the classes. And what I was kind of babbling about just a second ago is because these are all nice orthogonal vectors, I can just take a weighted sum of them, a sum of them on the simplex, and that can be a prediction. And that prediction will mean something like the probability here is 0.5 that it's a cat and 0.3 that it's a dog and so on."},{"id":110,"text":"And the way that I can represent that, actually let me do this before I represent that, is the way that's represented is I could write this as 0.5 and 0.3 and 0.1 and 0.1. That is the probability that says it's a cat with probability 0.5, it's a car with probability 0.1, and so on. So the fact that they're one hot lets me represent them in this nice mixture form very cheaply. And this is what a prediction actually means. It's this character here."},{"id":111,"text":"Nothing different than you saw in logistic regression. In logistic regression, there were only two classes. So we only had to write one number because these characters all add up to one. So there's always one free value. This value, once you see the first three, you know the fourth because they have to add up to one. So how do we do that? It's this nasty looking expression."}],"notes":["本段讨论了多类分类问题中如何通过概率分布进行预测。讲者提到，预测实际上是类别分布，即每个类别被选中的概率。这些概率必须满足总和为1的条件，因此只需要指定k-1个概率值，最后一个可以通过归一化得到。","讲者指出，多类分类中使用的是one-hot编码，将每个类别表示为一个向量，其中只有一个元素为1，其余为0。这种编码方式使得概率分布的表示更加方便。","在多类分类中，预测可以表示为在简单形（simplex）上的加权和，这允许我们以一种简洁的方式表达概率分布。例如，一个类别被选中的概率可以是0.5，另一个是0.3，依此类推。","讲者提到，这种表示方式与逻辑回归中的二分类问题类似，只不过在多类分类中，需要处理多个类别。因此，只需要指定k-1个概率值，最后一个可以通过归一化得到。","讲者指出，这种概率分布的表示方式是通过一个看似复杂的表达式来实现的，这可能涉及到softmax函数或其他类似的函数，用于将输出转换为概率分布。","讲者强调，这种表示方式是数学上的便利性，使得我们可以方便地进行概率计算和模型训练。"],"formulas":[],"uncertainties":["nasty looking expression"],"diagram":"none","start":2232.88,"end":2403.35,"asr_flags":[],"math_clarifications":["原公式未明确指出这是 softmax 函数，且未提及归一化常数，因此需要移除以避免误导。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2232.88,"text":"Multi-class classification. As I told you, this is the thing that you probably use the most. I think as I said on my opening slide, this is the thing that I used this morning implicitly when having Cloud Code, make sure that I put in all of the visualizations I wanted to put in and deleted things that I was supposed to delete. Every token it generated came from multi-class classification."},{"start":2256.27,"text":"All right. So how does it work? Let's get the basics down. So suppose we wanted to choose among k discrete values. Here, I'm going to pick four, and I'm going to pick short words so that I can put them on the slide. So we have our classes are kind of bizarrely cat, dog, car, bus. I'm not sure exactly what we're trying to decide among here, but just go with it. They're just values. If you need a narrative story, I don't know, make up a story that has a cat, a dog, a car, and a bus. Maybe the cat's driving the bus, and the dog is in the car, and they're angry at each other. Who knows? Anyway."},{"start":2286.25,"text":"whatever you think about. Now, the way we encode those is we encode them as one-hot vectors. So the idea here is that cat is going to be E1, or E0 depending on how you do the notation, E1 typically. It's going to have a 1 here. 0 is everywhere else. Dog is going to be E2. Car, E3. Bus, E4."},{"start":2309.22,"text":"Now, this allows us to talk about nice things. Like when we put them together, we can sum them nicely and assign probability distributions and all the rest. They're kind of the support vectors that we have. This is a mathematical convenience and is the way that we do it. It's just a nice thing to have."},{"start":2330.89,"text":"So a prediction is a distribution over the classes. And what I was kind of babbling about just a second ago is because these are all nice orthogonal vectors, I can just take a weighted sum of them, a sum of them on the simplex, and that can be a prediction. And that prediction will mean something like the probability here is 0.5 that it's a cat and 0.3 that it's a dog and so on."},{"start":2352.75,"text":"And the way that I can represent that, actually let me do this before I represent that, is the way that's represented is I could write this as 0.5 and 0.3 and 0.1 and 0.1. That is the probability that says it's a cat with probability 0.5, it's a car with probability 0.1, and so on. So the fact that they're one hot lets me represent them in this nice mixture form very cheaply. And this is what a prediction actually means. It's this character here."},{"start":2380.1,"text":"Nothing different than you saw in logistic regression. In logistic regression, there were only two classes. So we only had to write one number because these characters all add up to one. So there's always one free value. This value, once you see the first three, you know the fourth because they have to add up to one. So how do we do that? It's this nasty looking expression."}],"speech_gaps":[],"frame":"../frames/v046/014.webp","frame_time":2244.88},{"title":"指数族、广义线性模型与分类","segments":[{"id":112,"text":"This function, back to what would you practically call it? There is something called, in PyTorch, I think it's, bless you, it's Torch NN Softmax, I think is the one that you would use. It's in the neural net library and Softmax. You use this character. It has a bunch of things in there, by the way, to be more numerically stable, and they've done a bunch of things in pre-computed gradients and blah, blah, blah. Stuff happens."},{"id":113,"text":"But mathematically, all that's happening is the following. That probability, that number that I just wrote down, where did it come from? And it comes from taking theta dot each one of the x's. So there's theta j's. There's one j for every class."},{"id":114,"text":"I'm going to draw a graph in a second. And then it's normalized by all their dot products. So for every dimension, for every theta j, you dot it into x. And think about it like a bake-off. I'm going to draw a picture in a second to make sure this is clear. But that's basically what's happening. And it bakes off through this exponential model. Now, intuitively, this exponential model is nice because, well, it looks like the exponential model that we've been using for the rest of class. That's probably why it's here. But also, it has a nice kind of smoothing properties that we'll talk about in a second."},{"id":115,"text":"Okay, so let's draw the picture. So what does this actually look like? How do I picture in my head how multi-class classification looks like? So maybe let's draw some schematic cats and dogs. So maybe here's some cats. Here's some dogs. Here's, oh, that's the same color."},{"id":116,"text":"Cars, buses, doesn't really matter to me. Just make them different colors. Here are the four characters and I made them very nicely clustered. Data is never this nice, but for today will be. Now the idea and the reason I do this is I want you to understand one visualization that you'll commonly see. The idea is these things intuitively are nice to separate because I can separate all these blue things. Let me just call the blue things, I think I said they were cats. Let's call these cats. These are cats over here."},{"id":117,"text":"So these are all my cluster of cat points in space. I've featurized them. They're in 2D, whatever. Intuitively, I can separate the cats from everything else by drawing a line. Now, that line we'll call a hyperplane, because in higher dimensions, it's not just going to be a line. It's going to be an entire surface that's there. And let me draw one that separates it. So let me draw a line. It's not doing it. Sometimes it snaps it nicely."},{"id":118,"text":"So I don't have to draw so nicely."},{"id":119,"text":"All right, we're going to live with that."},{"id":120,"text":"All right, so what does that line actually look like?"},{"id":121,"text":"Well, it's going to look like, intuitively, we're going to have a theta."},{"id":122,"text":"Let's say cats are 1."},{"id":123,"text":"Theta 1.x is equal to 0."},{"id":124,"text":"That's the line that I just drew, okay?"},{"id":125,"text":"So this is the reason I want to say this."},{"id":126,"text":"There's a hyperplane that says, if you're on this side, you're a cat."},{"id":127,"text":"And if you're on this side, intuitively, you're not a cat, okay?"},{"id":128,"text":"Now, when I do that, this cat here, for example, is on the theta equals theta1.x equals one line."}],"notes":["本段讲解了Softmax函数在PyTorch中的实现，以及其在数学上的作用。Softmax函数用于将线性输出转换为概率分布，通过将每个类的线性组合进行指数化并归一化，使得输出值在0到1之间，且总和为1。这在多分类任务中非常有用。","讲者提到，Softmax函数在实现时会进行数值稳定性处理，例如使用预计算梯度等技术，以避免数值溢出或下溢的问题。这些处理是实现中的重要细节。","在数学上，Softmax函数的输出来源于将每个类的参数θ与输入特征x进行点积，然后对所有类的点积结果进行指数化并归一化。这使得输出具有概率解释。","讲者通过绘制超平面的示意图，解释了多分类问题中如何通过线性决策边界将不同类别分开。超平面在高维空间中是一个表面，用于区分不同类别。","讲者提到，超平面的划分方式取决于参数θ，例如，当θ1·x=0时，表示一个分类边界。在分类任务中，超平面用于将数据点划分为不同的类别。","讲者强调，虽然实际数据可能不会像示例中那样完美分离，但通过超平面的划分，可以直观地理解多分类模型的工作原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2405.39,"end":2585.17,"asr_flags":[],"raw_segments":[{"start":2405.39,"text":"This function, back to what would you practically call it? There is something called, in PyTorch, I think it's, bless you, it's Torch NN Softmax, I think is the one that you would use. It's in the neural net library and Softmax. You use this character. It has a bunch of things in there, by the way, to be more numerically stable, and they've done a bunch of things in pre-computed gradients and blah, blah, blah. Stuff happens."},{"start":2425.44,"text":"But mathematically, all that's happening is the following. That probability, that number that I just wrote down, where did it come from? And it comes from taking theta dot each one of the x's. So there's theta j's. There's one j for every class."},{"start":2438.72,"text":"I'm going to draw a graph in a second. And then it's normalized by all their dot products. So for every dimension, for every theta j, you dot it into x. text":"Well, it's going to look like, intuitively, we're going to have a theta."},{"start":2558.09,"text":"Let's say cats are 1."},{"start":2559.57,"text":"Theta 1.x is equal to 0."},{"start":2561.77,"text":"That's the line that I just drew, okay?"},{"start":2564.41,"text":"So this is the reason I want to say this."},{"start":2566.19,"text":"There's a hyperplane that says, if you're on this side, you're a cat."},{"start":2569.79,"text":"And if you're on this side, intuitively, you're not a cat, okay?"},{"start":2573.11,"text":"Now, when I do that, this cat here, for example, is on the theta equals theta1.x equals one line."}],"speech_gaps":[],"frame":"../frames/v046/015.webp","frame_time":2417.39},{"title":"指数族、广义线性模型与分类","segments":[{"id":129,"text":"This is the theta equals zero line."},{"id":130,"text":"It's more cat-like than it is anything else."},{"id":131,"text":"So far, so good?"},{"id":132,"text":"All right."},{"id":133,"text":"Now, how do I deal with the rest of the classes?"},{"id":134,"text":"Well, I have another one."},{"id":135,"text":"And here's another one."},{"id":136,"text":"I'll say, well, this is another line I could have."},{"id":137,"text":"Here's theta."},{"id":138,"text":"I don't know what this is."},{"id":139,"text":"Dogs?"},{"id":140,"text":"Sure."},{"id":141,"text":"Dogs."},{"id":142,"text":"Data 2 dot x is equal to 0."},{"id":143,"text":"And that's what I'll draw on this line."},{"id":144,"text":"It says if you're on this side, you're more dog-like than you're on this side."},{"id":145,"text":"Okay?"},{"id":146,"text":"Now, in our cleanly separated data, I can draw nice hyperplanes that separate it."},{"id":147,"text":"There's all kinds of beautiful theories."},{"id":148,"text":"I have to draw through the dogs, and so on. And I'm drawing little normal vectors to make sure it's clear. Now, the point is that anything here is classified. This line wants to classify, but you can see there's some conflict. What happens in this region? Oops, ca ng that scalar."},{"id":210,"text":"I'm calling a score, a raw score. And then that's what's in here as well. So that's the theta.x."},{"id":211,"text":"And so everything's the same type. The reason that I'm a little bit sloppy about the types"},{"id":212,"text":"and don't put them, I try to put them at the beginning of every section, is that you pick"},{"id":213,"text":"the type so they have to match. When you do a dot product, those are the same. That makes them. And"},{"id":214,"text":"Yeah. So the theta has to be the same dimension as your input. So for example,"},{"id":215,"text":"when we had the housing data, if you remember, we started to add in various different columns,"},{"id":216,"text":"square footage, lot size, so on. That's going to be your number of features. That's going to"},{"id":217,"text":"determine D. And that's a modeling question that's on your input. Once you have that D dimensions,"},{"id":218,"text":"then you have to learn in the linear setup, you learn a parameter for each one of those features"}],"notes":["本段讲解了广义线性模型中如何通过指数族分布进行分类。首先，讲者提到在分类任务中，模型会为每个类别生成一个分布，例如猫、狗等。接着，通过可视化输出和特征空间，展示了模型如何将输入特征映射到输出空间。讲者还提到，通过将特征向量与参数向量进行点积，得到每个类别的得分，然后通过指数化、归一化和求和，得到概率分布。"],"formulas":[{"latex":"p(y|x) = \\frac{e^{\\theta^T x}}{\\sum_j e^{\\theta_j^T x}}","symbols":"p(y|x) 是类别 y 在输入 x 下的概率分布，θ 是参数向量，x 是输入特征向量","explanation":"公式中的分母使用了求和符号 \\sum_j 代替了文本中的 \\text{sum}_j，以符合数学符号规范。","evidence":"Okay, and now I have a distribution over class one. So, you know, cat, dog, so on. This is a more, you'll see this visualization, this is a visualization of the output. The other is a visualization of the feature space. This is for a single point. Ask me a question. I'm super happy to. Here's a numerical version of the same thing. I just put in a bunch of examples. I'm going to go through this relatively quickly. You get the points. These are the theta twos. You had one on the two line, one 0.1. You exponentiate them. You normalize them and sum them, and then that g  you have that D dimensions,"},{"start":3392.44,"text":"then you have to learn in the linear setup, you learn a parameter for each one of those features"}],"speech_gaps":[{"start":3372.22,"end":3373.78}],"frame":"../frames/v046/020.webp","frame_time":3232.66},{"title":"指数族、广义线性模型与分类","segments":[{"id":219,"text":"so that you can dot product them and do this. The more you expand the features, the more parameters"},{"id":220,"text":"you introduce that will be true up until about week 10 or maybe sorry about lecture 10 and then"},{"id":221,"text":"you'll start to see models that really expand the space so like some of the models we're talking"},{"id":222,"text":"about here they are things where you give in an image or a piece of text and so that image or"},{"id":223,"text":"piece of text the traditional featurizations are actually learned along with the classification"},{"id":224,"text":"which is a more advanced topic wonderful question you got it exactly right it's clear to me you"},{"id":225,"text":"You understand it perfectly."},{"id":226,"text":"Here, x is just, the way I'm doing this is x is an individual value. This is a wonderful question. So this is scoring a particular example. So the idea here is I have one example from my data set. x will always be just one example. Capital X will be a matrix, notationally."},{"id":227,"text":"We hope, you know, bugs aside. So X here is going to be one example. And it's saying this example where I've shown you some image or I've shown you, you know, some house or whatever it is. Theta dot X is classifying that here as what we want to deal with. So this could be a piece of text. Is it about a dog, a cat, a car, or a bus or something like this? This would be for that one image or that one piece of text. X would be its featurization. So X is the data point."},{"id":228,"text":"You could compute theta Tx. That would be computing it for every data point at once. That's logically okay if it's a matrix. It's not wrong. We will use that notation too. Cool. Awesome. Great work. You guys are all over this."},{"id":229,"text":"Okay, so one thing that was brought up, which was a wonderful question earlier, is what happens in the k equals 2 case? It would be super weird if I told you multi-class classification, and then when k is equal to 3, it does something, but then when k is equal to 2, it does something totally different than logistic regression. And so I have a couple of slides here to say that it's actually what we would say formally is conservative. That's a fancy way of saying that, in fact, you can write this function exactly in our familiar form. And I'm going to do it in one slide."},{"id":230,"text":"For general k, though, notice that there's this thing that we're going to use here, which is that k minus 1 classes always determine the other one. Why? It's a probability distribution. They live on the simplex. They add up to 1. So you only really have, when you have k classes, you really only have k minus 1 free parameters because they have to add up to 1. So you always know the last one. All right."},{"id":231,"text":"So with this observation, you can run multinomials and all the rest. And everything we learned in the first part about how to do inference training and all the rest, super easy. Same thing that we've done. You run the error modes. You do all the stuff. You do the derivatives. Off to the races you go. Life is good. You may have to do that in your homework, I think. But anyway. All right. So how does the logistic regression work? So we're in this form. What's the idea? Well, we're going to divide by the top."}],"notes":["本段讨论了特征扩展与参数数量之间的关系，指出随着特征的扩展，引入的参数也会增加。同时，提到在课程的第10周左右，会开始看到能够扩展空间的模型，例如图像或文本的特征化过程。","讲者强调了在机器学习中，x通常代表一个单独的数据点，而大写的X则代表一个矩阵。这有助于区分单个样本和整个数据集的表示方式。","讲者提到，传统的特征化方法在分类任务中是与分类模型一起学习的，这属于更高级的主题。这表明在某些模型中，特征提取和分类是同时进行的。","讲者指出，当k=2时，多类分类与逻辑回归的处理方式不同，这可能引起混淆。因此，需要明确区分不同情况下的处理方式。","讲者提到，对于k个类别，实际上只有k-1个自由参数，因为概率分布必须满足总和为1的条件。这有助于理解多类分类模型的结构。","讲者强调了在处理多类分类问题时，可以利用之前学到的推理和训练方法，这使得模型的构建和训练过程更加简单。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3396.66,"end":3565.39,"asr_flags":[],"raw_segments":[{"start":3396.66,"text":"so that you can dot product them and do this. The more you expand the features, the more parameters"},{"start":3400.92,"text":"you introduce that will be true up until about week 10 or maybe sorry about lecture 10 and then"},{"start":3407.06,"text":"you'll start to see models that really expand the space so like some of the models we're talking"},{"start":3410.52,"text":"about here they are things where you give in an image or a piece of text and so that image or"},{"start":3415.62,"text":"piece of text the traditional featurizations are actually learned along with the classification"},{"start":3420.0,"text":"which is a more advanced topic wonderful question you got it exactly right it's clear to me you"},{"start":3425.02,"text":"You understand it perfectly."},{"start":3428.79,"text":"Here, x is just, the way I'm doing this is x is an individual value. This is a wonderful question. So this is scoring a particular example. So the idea here is I have one example from my data set. x will always be just one example. Capital X will be a matrix, notationally."},{"start":3442.46,"text":"We hope, you know, bugs aside. So X here is going to be one example. And it's saying this example where I've shown you some image or I've shown you, you know, some house or whatever it is. Theta dot X is classifying that here as what we want to deal with. So this could be a piece of text. Is it about a dog, a cat, a car, or a bus or something like this? This would be for that one image or that one piece of text. X would be its featurization. So X is the data point."},{"start":3470.2,"text":"You could compute theta Tx. That would be computing it for every data point at once. That's logically okay if it's a matrix. It's not wrong. We will use that notation too. Cool. Awesome. Great work. You guys are all over this."},{"start":3486.81,"text":"Okay, so one thing that was brought up, which was a wonderful question earlier, is what happens in the k equals 2 case? It would be super weird if I told you multi-class classification, and then when k is equal to 3, it does something, but then when k is equal to 2, it does something totally different than logistic regression. And so I have a couple of slides here to say that it's actually what we would say formally is conservative. That's a fancy way of saying that, in fact, you can write this function exactly in our familiar form. And I'm going to do it in one slide."},{"start":3517.05,"text":"For general k, though, notice that there's this thing that we're going to use here, which is that k minus 1 classes always determine the other one. Why? It's a probability distribution. They live on the simplex. They add up to 1. So you only really have, when you have k classes, you really only have k minus 1 free parameters because they have to add up to 1. So you always know the last one. All right."},{"start":3538.25,"text":"So with this observation, you can run multinomials and all the rest. And everything we learned in the first part about how to do inference training and all the rest, super easy. Same thing that we've done. You run the error modes. You do all the stuff. You do the derivatives. Off to the races you go. Life is good. You may have to do that in your homework, I think. But anyway. All right. So how does the logistic regression work? So we're in this form. What's the idea? Well, we're going to divide by the top."}],"speech_gaps":[],"frame":"../frames/v046/021.webp","frame_time":3408.66},{"title":"指数族、广义线性模型与分类","segments":[{"id":232,"text":"We'll divide by one of the values. So we'll get theta 1 minus theta 2, say. We'll see here that these are the same value. So I've just divided by 1, just dividing by the same thing over itself. So it's just dividing by 1. Then I substitute here that I have a new theta, which is going to be the difference between theta 1 and theta 2. So if you imagine that there were actually two hyperplanes, I now collapse them and say there's a new difference. And then, boom, that gets me down to logistic regression."},{"id":233,"text":"Okay? So this is algebraic, but it's basically saying these two models would assign the same probabilities everywhere. So this is a sense in which a two-class, multi-class classification is exactly logistic regression, and this is an appropriate generalization of that fact. Cool? All right. All right. So let me see. All right. So how do you train this thing? There's the kind of machinery that you can run through, which is exactly the same ones that we did in this class."},{"id":234,"text":"But you can also think about it, because you're doing maximum likelihood, is that you're maximizing the probability of the given class. So how does it work intuitively? Intuitively, what should I do, right? So let's say I show you an image."},{"id":235,"text":"and I say that it's a cat, then you know theta1 is the one that's supposed to have the right answer, and the rest of them should have the wrong answer. So if all of a sudden my model says it's not a cat, it's a dog, I should somehow change the parameters for dog so that it avoids calling this thing a cat over time, and I should potentially up the probability of the cat. Clear enough?"},{"id":236,"text":"Okay. So that is encountered with another thing that you're likely to find in your favorite PyTorch libraries called cross entropy. It will derive exactly from this. It's just taking logs across exactly this form. There's a privileged p-hat here. That's going to come out exactly from the p is the label, and that's a one-hot vector. So right now, only one of these terms survives."},{"id":237,"text":"That won't be true in a second. But for right now, what's saying is, I imagine that I'm basically saying, whichever one gives me the best score, I'm going to try and optimize. And because the probability has all the terms in it, it's going to drive me in the right direction. Just exactly what we've been doing before, maximize the probability. We did in logistic regression, same thing, just doing it for a class. The one hot says, pick something out. Just a convenient way to write them all down when I sum. All right."},{"id":238,"text":"All right, so it's the same. I'm not going to go through it again. One trick here is, now, what does that look like, maximizing the probability of the class? Intuitively, what happens is,"}],"notes":["本段讲解了如何通过代数操作将两个超平面合并为一个，从而得到逻辑回归模型。讲者指出，这种操作本质上是将两个参数差值作为新的参数，从而简化模型结构。","讲者强调，这种代数操作使得两个模型在所有点上分配的概率相同，因此可以将多类分类问题视为逻辑回归的推广。","在训练模型时，讲者提到最大似然估计是核心方法，即最大化给定类别的概率。通过直观例子，讲者说明了模型如何调整参数以避免错误分类。","讲者进一步解释了交叉熵损失函数的来源，指出其本质上是取对数后的概率形式，并强调了one-hot编码在多类分类中的作用。","讲者指出，在当前情况下，只有与真实标签对应的项会存活，而其他项会被忽略。这为后续的优化过程提供了基础。","最后，讲者提到最大化概率的过程与逻辑回归中的方法一致，强调了one-hot编码在将多个类别的概率统一表示中的便利性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3566.21,"end":3733.27,"asr_flags":[],"raw_segments":[{"start":3566.21,"text":"We'll divide by one of the values. So we'll get theta 1 minus theta 2, say. We'll see here that these are the same value. So I've just divided by 1, just dividing by the same thing over itself. So it's just dividing by 1. Then I substitute here that I have a new theta, which is going to be the difference between theta 1 and theta 2. So if you imagine that there were actually two hyperplanes, I now collapse them and say there's a new difference. And then, boom, that gets me down to logistic regression."},{"start":3596.43,"text":"Okay? So this is algebraic, but it's basically saying these two models would assign the same probabilities everywhere. So this is a sense in which a two-class, multi-class classification is exactly logistic regression, and this is an appropriate generalization of that fact. Cool? All right. All right. So let me see. All right. So how do you train this thing? There's the kind of machinery that you can run through, which is exactly the same ones that we did in this class."},{"start":3627.74,"text":"But you can also think about it, because you're doing maximum likelihood, is that you're maximizing the probability of the given class. So how does it work intuitively? Intuitively, what should I do, right? So let's say I show you an image."},{"start":3640.53,"text":"and I say that it's a cat, then you know theta1 is the one that's supposed to have the right answer, and the rest of them should have the wrong answer. So if all of a sudden my model says it's not a cat, it's a dog, I should somehow change the parameters for dog so that it avoids calling this thing a cat over time, and I should potentially up the probability of the cat. Clear enough?"},{"start":3665.51,"text":"Okay. So that is encountered with another thing that you're likely to find in your favorite PyTorch libraries called cross entropy. It will derive exactly from this. It's just taking logs across exactly this form. There's a privileged p-hat here. That's going to come out exactly from the p is the label, and that's a one-hot vector. So right now, only one of these terms survives."},{"start":3687.82,"text":"That won't be true in a second. But for right now, what's saying is, I imagine that I'm basically saying, whichever one gives me the best score, I'm going to try and optimize. And because the probability has all the terms in it, it's going to drive me in the right direction. Just exactly what we've been doing before, maximize the probability. We did in logistic regression, same thing, just doing it for a class. The one hot says, pick something out. Just a convenient way to write them all down when I sum. All right."},{"start":3716.6,"text":"All right, so it's the same. I'm not going to go through it again. One trick here is, now, what does that look like, maximizing the probability of the class? Intuitively, what happens is,"}],"speech_gaps":[],"frame":"../frames/v046/022.webp","frame_time":3578.21},{"title":"指数族、广义线性模型与分类","segments":[{"id":239,"text":"I have a class. I'm just going to do three classes. You have A, B, and C. And so when I do that probability, my model may predict a little bit of A, a little bit of B, a little bit of C. These should add up to one. My drawings don't add up to one, but this should add up to one. Okay. And what happens when I do the traditional way of training it is that I say, okay, maybe A was correct. So my model is great. So I just pay for the probability here and I try to increase it."},{"id":240,"text":"That's the way I'm training. I just zeroed out the rest. That is the content of the fact that it's one hot and that I'm only going to pay log of the probability of that particular element."},{"id":241,"text":"When I do that, it seems like I threw away some other information. And there was also this question, which I thought was a great question, which says, hey, what if it's a cat or a dog? What if it's close? I don't know if there is something that looks like simultaneously a cat and a dog. I imagine that's possible. I'm trying to picture it right now, and I can't. But I can imagine a model getting confused between a cat and a dog. I'm not going to describe what I'm picturing. That's a stupid waste of time. But in any case, you can imagine the model is confused about cats and dogs. At that point, I'm throwing information away. If I, for example, had all the animals in the universe,"},{"id":242,"text":"as classes, somehow I'm like, I'm sure it's a cat or a dog, but I'm not sure of the rest of the stuff. So that's one thing. And so if the model were saying, well, it's a cat or a dog, but it's also insisting it's a car, I should somehow want to maybe penalize that more. So there are ideas here where I'm saying you could penalize the losses a little bit differently if you had some distribution over what you want to do."},{"id":243,"text":"Now, label smoothing does something actually that's quite a bit simpler. What label smoothing does is says instead
