</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】指数族、广义线性模型与分类 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v046.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v046","title":"【斯坦福CS229】指数族、广义线性模型与分类","course":"机器学习","pages":[{"title":"指数族、广义线性模型与分类","segments":[{"id":0,"text":"Good afternoon and welcome to 229 lecture 4. Today we're going to talk about the exponential family and this is an idea that will allow us to generalize a lot of the linear models and things that we've seen to more complicated distributions.","zh":"下午好，欢迎来到229课程第4讲。今天我们将讨论指数族，这是一个能够帮助我们将之前看到的许多线性模型和其它模型推广到更复杂分布的概念。","start":5.14,"end":19.4},{"id":1,"text":"I may have given you some some candy. Please take some candy. No trash in Nvidia because then I get in trouble. Um, I don't actually know what they can do to me, but I prefer not to test it. Like all things being equal, so please enjoy some candy. Thanks for coming to class. We really appreciate it. Alright, so we're going to talk about the exponential family as I mentioned. It's going to have a couple of sections.","zh":"我可能给你们发了一些糖果。请拿一些糖果。不要在Nvidia丢垃圾，否则我会惹上麻烦。嗯，我其实不知道他们能对我做什么，但我不希望测试一下。在其它条件相同的情况下，请享受一些糖果。谢谢你们来上课，我们非常感激。好的，我们将讨论指数族，正如我之前提到的，它将分为几个部分。","start":21.55,"end":41.41},{"id":2,"text":"So first, we're going to talk about this exponential family. And it's really, as I said, it's kind of the cornerstone of just a ton of statistics, so a ton of different models. And the way I kind of want you to think about it is, if you have a data type that's out there in the world, we'll see regression, classification, we'll see count data, we'll see all kinds of stuff. This gives you a reliable way of going from a distribution over that information.","zh":"首先，我们将讨论这个指数族。正如我所说，它实际上是统计学中大量模型的基石，所以有很多不同的模型。我想你们这样去思考它：如果你有一个存在于世界上的数据类型，我们会看到回归、分类，我们会看到计数数据，我们会看到各种各样的内容。这给了你们一种可靠的方法，从该信息上的分布转换到一个学习模型。","start":42.52,"end":67.24},{"id":3,"text":"To a learned model. And that procedure that you go through is going to be identical. So all the things that you saw for least squares and logistic regression, they all basically carry over to this entire large class of models. It's a very rich class of models. So we'll see some of the examples. And basically, the trick is we're going to be able to show that all of these models can be written in this one kind of odd-looking form. And when we write them in that odd-looking form, then all these problems come for free.","zh":"并且你所经历的这个过程将是相同的。因此，你们在最小二乘法和逻辑回归中看到的所有内容，基本上都会推广到这个整个大型模型类中。这是一个非常丰富的模型类。我们将看到一些例子。基本上，诀窍是我们将能够展示所有这些模型都可以写成这种看起来有点奇怪的形式。当我们以这种奇怪的形式写出它们时，所有这些问题都会随之而来。","start":68.15,"end":95.47},{"id":4,"text":"Inference on them that is computing like the mean, computing the variance comes for free, and also that we can compute them exactly in the same stochastic gradient descent style way that we've been computing all the rest of everything else that's here, or we could do gradient descent if we wanted. So that will be this family of generalized linear models, and then we're going to talk about the most important","zh":"在这些模型上的推断，比如计算均值、计算方差，都会自动获得，而且我们也可以以与我们计算所有其他内容相同的随机梯度下降方式来精确计算它们，或者如果我们想要的话，也可以进行梯度下降。因此，这将是广义线性模型这一类模型，然后我们将讨论最重要的","start":95.81,"end":114.31},{"id":5,"text":"probably class of them in terms of use right now, which is softmax. And softmax is how you pick not just between two classes, like we were doing yes or no in logistic regression, cat or dog. It's how you pick against, say, for example, every single word or actually token that could be generated. So every time one of those AI models runs, the last step that it does is it picks among all the words in its vocabularies, or what are called tokens in its vocabularies, which one is the most likely token to generate next. And it does that with a...","zh":"可能现在在使用中的一类是softmax。Softmax是你选择不仅仅在两个类别之间，比如我们在逻辑回归中进行的yes或no，猫或狗。它是如何选择，比如说，每一个可能生成的单词或实际的token。因此，每次这些AI模型运行时，它最后一步所做的就是从其词汇表中的所有单词，或者称为token中，选择最有可能生成下一个的token。它通过一个……","start":114.75,"end":144.05},{"id":6,"text":"Also underneath the covers, this bit here that we're doing of the multi-class classification, it also shows up in a technique that you won't see for a while, which is something called attention. And attention is underneath the transformer architecture, which is arguably the workhorse of modern AI. So there's some really fundamental building blocks that have carried the field for quite a while. So hopefully this is a clean enough overview. You kind of understand where we're going and why we're doing it.","zh":"此外，在底层，我们正在做的多类分类技术也出现在一种你暂时不会看到的技术中，称为注意力机制。注意力机制是Transformer架构的一部分，而Transformer可以说是现代AI的核心工具。因此，有一些非常基础的构建模块已经支撑了这个领域相当长一段时间。希望这个概述足够清晰。你大概能理解我们接下来要做什么以及为什么这么做。","start":144.08,"end":173.3},{"id":7,"text":"Let's get into some details. Okay, so this is the whole show. Let me see if this thing works. I want to try this out.","zh":"让我们深入一些细节。好的，这就是整个过程。让我看看这个东西是否能运行。我想尝试一下。","start":176.05,"end":183.23}],"notes":["本段介绍了课程的基本信息，包括课程名称和主题，强调指数族在统计学中的重要性，以及它如何帮助将各种数据类型转化为学习模型。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.14,"end":183.23,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.14,"text":"Good afternoon and welcome to 229 lecture 4. Today we're going to talk about the exponential family and this is an idea that will allow us to generalize a lot of the linear models and things that we've seen to more complicated distributions."},{"start":21.55,"text":"i may have given you some some candy please take some candy no trash in nvidia because then i get in trouble um i don't actually know what they can do to me but i prefer not to test it like all things being equal so please enjoy some candy thanks for coming to class we really appreciate it all right so we're going to talk about the exponential family as i mentioned it's going to have a couple of sections"},{"start":42.52,"text":"So first, we're going to talk about this exponential family. And it's really, as I said, it's kind of the cornerstone of just a ton of statistics, so a ton of different models. And the way I kind of want you to think about it is, if you have a data type that's out there in the world, we'll see regression classification, we'll see count data, we'll see all kinds of stuff. This gives you a reliable way of going from a distribution over that information."},{"start":68.15,"text":"to a learned model. And that procedure that you go through is going to be identical. So all the things that you saw for least squares and logistic regression, they all basically carry off to this entire large class of models. It's a very rich class of models. So we'll see some of the examples. And basically, the trick is we're going to be able to show that all of these models can be written in this one kind of odd-looking form. And when we write them in that odd-looking form, then all these problems come for free."},{"start":95.81,"text":"inference on them that is computing like the mean computing the variance comes for free and also that we can compute them exactly in the same stochastic gradient descent style way that we've been computing all the rest of everything else that's here or we could do gradient descent if we wanted so that will be this family of generalized linear models and then we're going to talk about the most important"},{"start":114.75,"text":"probably class of them in terms of use right now, which is softmax. And softmax is how you pick not just between two classes, like we were doing yes or no in logistic regression, cat or dog. It's how you pick against, say, for example, every single word or actually token that could be generated. So every time one of those AI models runs, the last step that it does is it picks among all the words in its vocabularies, or what are called tokens in its vocabularies, which one is the most likely token to generate next. And it does that with a..."},{"start":144.08,"text":"Also underneath the covers, this bit here that we're doing of the multi-class classification, it also shows up in a technique that you won't see for a while, which is something called attention. And attention is underneath the transformer architecture, which is arguably the workhorse of modern AI. So there's some really fundamental building blocks that have carried the field for quite a while. So hopefully this is a clean enough overview. You kind of understand where we're going and why we're doing it."},{"start":176.05,"text":"Let's get into some details. Okay, so this is the whole show. Let me see if this thing works. I want to try this out."}],"speech_gaps":[],"frame":"../frames/v046/001.webp","frame_time":17.14},{"title":"指数族、广义线性模型与分类","segments":[{"id":8,"text":"Ooh, that's so fancy. Look at that. I just learned it did that like 10 minutes ago. So apologies for doing it. I don't think it's such a great idea. I probably won't use it again. But in any case, so this functional form here, this equation basically says I have the probability here over y given eta, which is going to be some set of parameters, eta that we'll talk about in a second. And basically, it says it has this prescribed functional form. It means that this","zh":"哦，这太酷了。看看这个。我刚才十分钟前才学到这个的。所以抱歉我做了这个。我不认为这是一个很好的主意。我可能不会再用它了。但无论如何，这里的函数形式，这个方程基本上说明了我在给定eta的情况下，对y的概率，其中eta是一组参数，我们稍后会讨论。基本上，它说明了这个函数形式是预先规定的。这意味着这个","start":183.79,"end":209.34},{"id":9,"text":"If this probability distribution has this special form, then as I said, inference and learning come for free. Now, they don't really come for free, but they come for free for you. You already paid the cost. You learned how to do gradient descent, stochastic gradient descent. It will have almost the exact form of everything we've done for the last two classes, but it'll be kind of more general.","zh":"如果这个概率分布具有这种特殊形式，那么正如我所说，推理和学习几乎是免费的。现在，它们并不是真正免费的，但对你来说是免费的。你已经支付了成本。你已经学会了如何做梯度下降，随机梯度下降。它几乎会和我们过去两节课所做的内容形式完全相同，但会稍微更一般化一些。","start":209.87,"end":229.01},{"id":10,"text":"Now, here in terms of types, you should make sure all of the types work out. The parameter, so this character here, ty, has to have the same dimension as eta. So somehow, the probability distribution passes through this function t, which we'll talk about in a second, and it has the same number of parameters. So for every free parameter in the distribution, you're going to introduce this eta.","zh":"现在，就类型而言，你必须确保所有类型都匹配。参数，这里的字符ty，必须与eta具有相同的维度。因此，概率分布通过这个函数t，我们稍后会讨论，它具有相同数量的参数。因此，对于分布中的每一个自由参数，你都会引入这个eta。","start":230.01,"end":252.67},{"id":11,"text":"And this term b here, the factorization says it's a scalar that only depends on y. Now, I haven't told you about this last one. I'm going to walk through it again. So if you don't get it, don't worry. Is this a of eta, this character is actually quite important. So it looks like it's just kind of this weird normalization. But as we'll see, almost all of the action is going to go on in here, a of eta, once we set up all the rest. And it's going to be called the log partition function.","zh":"这里的这个项b，因子化说明它是一个仅依赖于y的标量。现在，我还没有告诉你这个最后一个部分。我会再解释一次。如果你没明白，别担心。这是eta的一个函数，这个字符实际上非常重要。看起来它只是一个奇怪的归一化项。但正如我们将看到的，一旦我们设置好其余部分，几乎所有动作都会发生在这里，即a of eta，它将被称为对数分区函数。","start":253.39,"end":275.95},{"id":12,"text":"OK, so I'm going to highlight those names. So here they are. OK, so let's go through them. So ty, again, is called the sufficient statistic. Think about this as what you're measuring about the quantity you care about. Maybe it's the mean. Maybe it's a particular value, variance, something like this that's measured there. For almost all of our examples today, t is going to be a very special function. It's going to be the identity. We don't need it. It's just a nice, convenient thing to have.","zh":"好的，我现在要强调这些名称。所以这里它们是。好的，现在我们来逐一讲解。所以ty，再次被称为充分统计量。想想看，这代表了你关心的量的测量内容。也许它是均值，也许是一个特定的值，方差，或者其他类似在这里被测量的东西。对于我们今天几乎所有的例子，t都将是一个非常特殊的函数。它将是恒等函数。我们并不需要它。它只是一个方便的、有用的工具。","start":276.39,"end":300.53},{"id":13,"text":"By is called the base measure. And the important thing is it doesn't depend on this parameter eta. It is just some kind of normalization that's there.","zh":"By被称为基测度。重要的是它不依赖于这个参数eta。它只是某种形式的归一化。","start":301.94,"end":310.56},{"id":14,"text":"And then this character is the log partition function. It doesn't depend on y, but it's going to basically be this normalization constant. And the reason that normalization is so important is, implicitly, what's it going to do? Because the probability distribution adds up to 1, you're going to have some term that adds up all of what I would call the possible worlds, all the different values for y and kind of sums or integrates over all of them. That is going to be captured here. That's why you have this minus sign, minus","zh":"然后这个字符是日志分区函数。它不依赖于y，但它基本上是一个归一化常数。归一化之所以如此重要，是因为隐含地，它会做什么？因为概率分布的总和为1，你将有一个项，将所有我称之为可能世界的情况相加，所有y的不同值，以及在这些值上进行求和或积分。这将在这里被捕捉到。这就是为什么你有这个负号，减号","start":311.91,"end":337.91}],"notes":["本段主要讲解指数族分布的结构，其中提到概率分布具有特定形式时，推断和学习可以简化。虽然讲者提到这些方法并不真正免费，但它们可以利用已有的梯度下降技术，使学习过程更加通用。","讲者强调了参数类型的一致性，即ty（充分统计量）的维度必须与eta（自然参数）相同。这表明分布的参数化方式与函数t的结构密切相关，且每个自由参数都会对应一个eta。","讲者提到b项是一个仅依赖于y的标量，而a(eta)项是关键的归一化因子，称为对数分区函数。这部分内容为后续讨论指数族分布的归一化和概率计算奠定了基础。","讲者指出ty（充分统计量）是衡量感兴趣量的重要指标，如均值、方差等。在大多数例子中，t函数是恒等函数，这简化了模型的构建。","讲者提到base measure（基础测度）不依赖于eta，仅作为归一化的一部分存在。这表明基础测度在指数族分布中起到辅助作用，不直接影响分布的形状。","讲者强调了对数分区函数的重要性，它作为归一化常数，确保概率分布的总和为1。归一化过程涉及对所有可能的y值进行求和或积分，这在概率建模中至关重要。"],"formulas":[],"uncertainties":["a of eta"],"diagram":"none","start":183.79,"end":337.91,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":183.79,"text":"Ooh, that's so fancy. Look at that. I just learned it did that like 10 minutes ago. So apologies for doing it. I don't think it's such a great idea. I probably won't use it again. But in any case, so this functional form here, this equation basically says I have the probability here over y given eta, which is going to be some set of parameters, eta that we'll talk about in a second. And basically, it says it has this prescribed functional form. It means that this"},{"start":209.87,"text":"If this probability distribution has this special form, then as I said, inference and learning come for free. Now, they don't really come for free, but they come for free for you. You already paid the cost. You learned how to do gradient descent, stochastic gradient descent. It will have almost the exact form of everything we've done for the last two classes, but it'll be kind of more general."},{"start":230.01,"text":"Now, here in terms of types, you should make sure all of the types work out. The parameter, so this character here, ty, has to have the same dimension as eta. So somehow, the probability distribution passes through this function t, which we'll talk about in a second, and it has the same number of parameters. So for every free parameter in the distribution, you're going to introduce this eta."},{"start":253.39,"text":"And this term b here, the factorization says it's a scalar that only depends on y. Now, I haven't told you about this last one. I'm going to walk through it again. So if you don't get it, don't worry. Is this a of eta, this character is actually quite important. So it looks like it's just kind of this weird normalization. But as we'll see, almost all of the action is going to go on in here, a of eta, once we set up all the rest. And it's going to be called the log partition function."},{"start":276.39,"text":"OK, so I'm going to highlight those names. So here they are. OK, so let's go through them. So ty, again, is called the sufficient statistic. Think about this as what you're measuring about the quantity you care about. Maybe it's the mean. Maybe it's a particular value, variance, something like this that's measured there. For almost all of our examples today, t is going to be a very special function. It's going to be the identity. We don't need it. It's just a nice, convenient thing to have."},{"start":301.94,"text":"By is called the base measure. And the important thing is it doesn't depend on this parameter eta. It is just some kind of normalization that's there."},{"start":311.91,"text":"And then this character is the log partition function. It doesn't depend on y, but it's going to basically be this normalization constant. And the reason that normalization is so important is, implicitly, what's it going to do? Because the probability distribution adds up to 1, you're going to have some term that adds up all of what I would call the possible worlds, all the different values for y and kind of sums or integrates over all of them. That is going to be captured here. That's why you have this minus sign, minus"}],"speech_gaps":[],"frame":"../frames/v046/002.webp","frame_time":195.79},{"title":"指数族与广义线性模型的引入","segments":[{"id":15,"text":"a n okay and so we're going to see examples of it but basically you should think about it it's kind of got to be a sum or an integral over all the possible ways that y could be realized and why is that the important thing to divide by well because we want it to equal one right we're trying to normalize it but because of that normalization this character is going to have a bunch of interesting mathematical properties okay so this is again just kind of foreshadowing the story to try and give you some intuition about why we care about this form and we're going to talk about it and you'll see it through examples if not if things aren't clear right now","zh":"嗯，好的，我们将会看到一些例子，但基本上你应该把它想成是所有可能的y实现方式的总和或积分，为什么这一点很重要呢？因为我们要把它归一化为1，对吧？我们正在尝试对其进行归一化，但正因为如此，这个特征将会具有许多有趣的数学性质。嗯，这又是在提前铺垫故事，试图给你一些关于为什么我们关心这种形式的直觉，我们将会讨论它，并通过例子让你明白，如果现在还不清楚的话。","start":338.37,"end":367.29},{"id":16,"text":"All right. All right. Now, this is a longer version of what I was just saying. So if this y were discrete, if I sum over p of y, I know that it has to be equal to 1. It's a probability distribution. Or it's a PDF, and I'm going to normalize it to 1. Here, in particular, that's what this implies. That's what's going on here. And so this says a is going to be this log partition function.","zh":"好的，好的。现在，这是我刚才所说内容的更长版本。如果这个y是离散的，当我对p(y)求和时，我知道它必须等于1。这是一个概率分布。或者这是一个概率密度函数，我将其归一化为1。在这里，特别是，这就意味着这一点。这就是这里发生的事情。因此，这里所说的a将是这个对数分区函数。","start":369.83,"end":399.77},{"id":17,"text":"This character right there. Now, interestingly, as I said, why it's so interesting is there's a log in front of it. That's actually not super interesting to me. But what's interesting is this part here, this sum, it captures, as I was saying, all the possible worlds, all the Ys that I could possibly sum up so that I normalize and get a 1. And so we're going to operate on that log partition function quite a bit. And if you ever do any statistical physics, I don't know why you would, but log partition functions show up everywhere. Sound good? Clear enough. Awesome.","zh":"这里的这个字符。有趣的是，正如我所说，为什么它如此有趣是因为前面有一个对数。这实际上对我而言并不特别有趣。但有趣的是这里的这一部分，这个总和，它捕捉了所有可能的世界，所有我可能求和的y值，从而进行归一化并得到1。因此，我们将对这个对数分区函数进行大量操作。如果你曾经做过任何统计物理，我不知道你为什么要做，但对数分区函数无处不在。听起来不错？清楚吗？太棒了。","start":400.44,"end":427.56},{"id":18,"text":"All right, so let's see an example, arguably one of the simplest examples, which is flipping a coin. So here we have some y, which is going to be heads or tails. We have 0 or 1s, and we have here a parameter phi and 1 minus phi. And remember, this notation here is the if-then kind of thing. Only one of these terms is present because it's 0 or 1. When it's 1, we get this term. This term goes to 1. When it's 0, we get the term on the right-hand side.","zh":"好的，那么让我们看一个例子，可以说是最简单的例子之一，即抛硬币。在这里，我们有一些y，它将是正面或反面。我们有0或1，这里有一个参数phi和1减去phi。记住，这里的符号是如果-那么类型的。只有其中一个项存在，因为它要么是0要么是1。当它是1时，我们得到这个项。这个项变为1。当它是0时，我们得到右边的项。","start":429.16,"end":455.62},{"id":19,"text":"So we're going to write this in that form that we just saw on the last slide. So how do we do it? Now, when we do this, by the way, some terms will fall out when you do it that will be interesting, but we're basically rewriting the parameters, these five parameters, to get these y's, these eta's, and so on. All right, so how do we do it?","zh":"因此，我们将用上一张幻灯片中看到的那种形式来写出这个表达式。那么我们该如何操作呢？顺便提一下，当我们这样做时，一些项在计算过程中会消失，这些项会很有趣，但基本上我们是在重新表述这些参数，这五个参数，以得到这些y值、这些eta值等等。好了，那么我们该如何操作呢？","start":456.58,"end":480.98},{"id":20,"text":"Well, the first thing is we're going to take this model, which has these nice little exponents, and we're going to use a log here. You should check that the log is justified here, what that means about the parameter. It means the parameter is not strictly 0 or strictly 1, because that could be a problem. If it were strictly 1, this guy would be 0. If it were strictly 0, this would be 0. And I'd have a log of 0, which I shouldn't have. But for most values, this is a fine transformation.","zh":"首先，我们将使用对数，将这个具有这些漂亮指数的模型进行转换。你应该检查一下这里的对数是否合理，这说明了关于参数的什么情况。这意味着参数既不是严格等于0也不是严格等于1，因为这可能会有问题。如果它严格等于1，那么这个项就会是0；如果它严格等于0，那么这个项也会是0。我就会得到一个0的对数，这是不允许的。但对于大多数值来说，这种转换是合理的。","start":483.72,"end":511.15}],"notes":["本段介绍了指数族分布的基本概念，强调了归一化的重要性，即通过求和或积分使分布总和为1。这是指数族分布的核心特征，也是其具有丰富数学性质的基础。","讲者提到log partition function（对数分区函数）是指数族分布的重要组成部分，它在统计物理中广泛出现，这为后续讨论广义线性模型提供了理论基础。","通过抛硬币的例子，讲者展示了如何将离散变量的分布转化为指数族形式。其中，参数phi和1 - phi分别对应硬币正面和反面的概率，体现了指数族分布的结构。","讲者指出，使用对数变换时，参数不能严格为0或1，否则会导致对数为0，从而破坏分布的归一化性质。这说明了参数选择的合理性。","在转换过程中，某些项会自然消失，这反映了指数族分布的结构特性，即通过参数变换将分布形式统一为指数族形式。","讲者强调了指数族分布的灵活性和广泛适用性，特别是在统计建模和机器学习中的重要性，为后续讨论广义线性模型奠定了基础。"],"formulas":[],"uncertainties":["a n okay"],"diagram":"none","start":338.37,"end":511.15,"asr_flags":[],"math_clarifications":["公式中的 'log partition function' 表达不准确。正确的表达应为 'log partition function'，即对数分区函数，通常表示为 $ Z $，而不是直接等于 'log partition function'。因此，该公式需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":338.37,"text":"a n okay and so we're going to see examples of it but basically you should think about it it's kind of got to be a sum or an integral over all the possible ways that y could be realized and why is that the important thing to divide by well because we want it to equal one right we're trying to normalize it but because of that normalization this character is going to have a bunch of interesting mathematical properties okay so this is again just kind of foreshadowing the story to try and give you some intuition about why we care about this form and we're going to talk about it and you'll see it through examples if not if things aren't clear right now"},{"start":369.83,"text":"All right. All right. Now, this is a longer version of what I was just saying. So if this y were discrete, if I sum over p of y, I know that it has to be equal to 1. It's a probability distribution. Or it's a PDF, and I'm going to normalize it to 1. Here, in particular, that's what this implies. That's what's going on here. And so this says a is going to be this log partition function."},{"start":400.44,"text":"This character right there. Now, interestingly, as I said, why it's so interesting is there's a log in front of it. That's actually not super interesting to me. But what's interesting is this part here, this sum, it captures, as I was saying, all the possible worlds, all the Ys that I could possibly sum up so that I normalize and get a 1. And so we're going to operate on that log partition function quite a bit. And if you ever do any statistical physics, I don't know why you would, but log partition functions show up everywhere. Sound good? Clear enough. Awesome."},{"start":429.16,"text":"All right, so let's see an example, arguably one of the simplest examples, which is flipping a coin. So here we have some y, which is going to be heads or tails. We have 0 or 1s, and we have here a parameter phi and 1 minus phi. And remember, this notation here is the if-then kind of thing. Only one of these terms is present because it's 0 or 1. When it's 1, we get this term. This term goes to 1. When it's 0, we get the term on the right-hand side."},{"start":456.58,"text":"So we're going to write this in that form that we just saw on the last slide. So how do we do it? Now, when we do this, by the way, some terms will fall out when you do it that will be interesting, but we're basically rewriting the parameters, these five parameters, to get these y's, these eta's, and so on. All right, so how do we do it?"},{"start":483.72,"text":"Well, the first thing is we're going to take this model, which has these nice little exponents, and we're going to use a log here. You should check that the log is justified here, what that means about the parameter. It means the parameter is not strictly 0 or strictly 1, because that could be a problem. If it were strictly 1, this guy would be 0. If it were strictly 0, this would be 0. And I'd have a log of 0, which I shouldn't have. But for most values, this is a fine transformation."}],"speech_gaps":[],"frame":"../frames/v046/003.webp","frame_time":350.37},{"title":"指数族与广义线性模型的结构分析","segments":[{"id":21,"text":"Okay, so then I do this. This is just this term here, and this character here is just this term here with a log. Okay, now this is already great intuitively because I now have it in a nice X form. I have something that looks like more or less linear. There's some logs and other stuff, and I got to figure out kind of how to hide them and put them in the right spots.","zh":"好的，那么我这样做。这里只是这个项，而这里的字符只是这个项加上对数。好的，现在这已经很直观了，因为我现在把它写成了一个漂亮的X形式。我有一个看起来差不多是线性的东西。这里有一些对数和其他内容，我需要想办法隐藏它们，并把它们放在正确的位置上。","start":511.9,"end":540.74},{"id":22,"text":"And so y, as I said, I'm going to imagine y is just going to be the ty is just going to be y itself. And I'm going to start to group the other terms that are nearby. And in particular, I'm going to find all the terms that multiply by y because I only have one term here that depends on y, whereas this one doesn't. What I'm trying to emphasize here is it's not like some mysterious mathematical insight. It's just mechanical. I'm just trying to group all the terms that have y on them.","zh":"因此，y，正如我所说，我会想象y就是它本身。我会开始把附近的其他项分组。特别是，我会找到所有乘以y的项，因为这里只有一个依赖于y的项，而这个则不依赖。我想强调的是，这不是什么神秘的数学洞察力。它只是机械性的操作。我只是试图把所有含有y的项分组在一起。","start":541.45,"end":565.99},{"id":23,"text":"I group them, and it happens to be that I get this funny-looking thing, log phi 1 by phi. You may have seen this before. If you haven't, don't worry. It's the log odds. So it's a thing that statisticians may have told you about. Plus, I get this nice term here. OK. Life's good. All right. So now, in this situation, I have a couple things to correct. We have ty is equal to y. All good. We're going to see that a bunch. But we could have had a more complicated function there.","zh":"我把它们分组，结果得到了一个看起来有点奇怪的东西，即log phi 1除以phi。你可能以前见过这个。如果没有见过，也别担心。这是对数几率。这是统计学家可能告诉过你的东西。此外，我还得到了一个漂亮的项。好的，生活很美好。那么现在，在这种情况下，我有几个地方需要修正。我们有ty等于y。一切正常。我们会看到这一点很多次。但我们本可以有一个更复杂的函数。","start":567.03,"end":598.08},{"id":24,"text":"We have our eta is going to have this weird little form, which is nice. We'll come back to that in a second. And then we have here this thing which we want as our candidate to be A of eta. We see there's some eta here, but it's not actually obvious when we put it in this form that this is a function of eta. What do I mean? Well, if it's a function, there should be something that maps from one value to another value. So effectively, we have to figure out how to do a little bit of an inversion here. Is it clear why?","zh":"我们有eta将具有这种奇怪的小形式，这很有趣。我们稍后会再回到这一点。然后我们有这里的东西，我们希望它成为A of eta的候选。我们看到这里有一些eta，但当我们以这种形式写出它时，并不明显这是eta的函数。我的意思是什么？好吧，如果它是函数，应该有一种从一个值映射到另一个值的东西。因此，实际上，我们必须想办法进行一点反演。清楚为什么吗？","start":599.06,"end":626.76},{"id":25,"text":"There's some relationship, clearly, between eta and phi, right, from this function. But we don't know if there's some function that kind of goes this way. And we want a to be a function. So far, so good? All right. So how do we do that? Well, we do a little bit more, you know, kind of solving. We exponentiate. Oops. And then we solve for this form. Now, interestingly, that's a pretty interesting form if you look at it.","zh":"显然，eta和phi之间存在某种关系，对吧，从这个函数来看。但我们不知道是否存在某种函数，其形式大致如此。而我们希望a是一个函数。到目前为止，这样好吗？好的。那么我们该如何做到这一点呢？嗯，我们再做一点工作，你知道的，进行一些求解。我们进行指数运算。哦，然后我们解出这种形式。有趣的是，如果你仔细看一下，这种形式相当有趣。","start":628.28,"end":657.14},{"id":26,"text":"It's got this 1 plus e to the minus kind of form. We saw something like that in logistic regression. And that'll come back a little bit later. Okay, so life is good. So we plug it in. Yep, and indeed, we now have a form. And this is the right form where it's now only a function of eta. We've eliminated the phi, and life is good for us. Okay, so what we verified here, which is kind of a sanity test, this is not like a deep result.","zh":"它具有这种1加上e的负指数形式。我们在逻辑回归中见过类似的形式。这将在稍后再次出现。好的，所以一切顺利。因此我们将其代入。是的，确实，我们现在有了一个形式。而且，这正是我们需要的形式，它现在仅是eta的函数。我们消去了phi，对我们来说一切顺利。好的，我们在这里验证了这一点，这其实是一个简单的检验，而不是一个深层次的结果。","start":657.48,"end":685.6}],"notes":["本段主要讲解如何将指数族分布的对数形式转化为线性形式，通过分组和整理项来简化表达式。讲者强调这是一个机械的过程，而不是神秘的数学洞察。通过将项按其依赖的变量分组，可以更清晰地看到结构。","讲者提到，将变量 y 与其它项分组后，得到一个看起来像 log odds 的表达式，这是统计学中常见的概念。同时，讲者指出，通过分组可以得到一个更简洁的表达式，从而简化了问题。","在处理 eta 和 phi 的关系时，讲者指出 eta 的形式可能看起来奇怪，但这是为了将其转化为 A(eta) 的形式。讲者强调，这需要进行一些逆向操作，以确保 eta 是一个函数的输入。","通过指数化和求解，讲者展示了如何将表达式转化为仅依赖 eta 的形式，从而消除了 phi。这一步是关键，因为它确保了最终的表达式是 eta 的函数。","讲者提到，最终的表达式具有类似于逻辑回归中的形式，即 1 + e^{-x}，这表明该结构与广义线性模型密切相关。这为后续的分类问题提供了基础。","最后，讲者指出，通过这些步骤验证了模型的结构，这是一个简单的合理性测试，而不是一个深层次的数学结果。这表明模型的构建过程是直观且可操作的。"],"formulas":[{"latex":"log\\left(\\frac{\\phi}{1 - \\phi}\\right)","symbols":"对数几率（log odds）","explanation":"公式正确，表示对数几率，是逻辑回归中的基本概念，用于将概率转换为对数比值。","evidence":"I group them, and it happens to be that I get this funny-looking thing, log phi 1 by phi. You may have seen this before. If you haven't, don't worry. It's the log odds. So it's a thing that statisticians may have told you about. Plus, I get this nice term here. OK. Life's good. All right. So now, in this situation, I have a couple things to correct. We have ty is equal to y. All good. We're going to see that a bunch. But we could have had a more complicated function there."},{"latex":"1 + e^{-x}","symbols":"逻辑回归中的 S 型函数","explanation":"公式正确，表示逻辑回归中的 S 型函数，用于将线性输出转换为概率。","evidence":"There's some relationship, clearly, between eta and phi, right, from this function. But we don't know if there's some function that kind of goes this way. And we want a to be a function. So far, so good? All right. So how do we do that? Well, we do a little bit more, you know, kind of solving. We exponentiate. Oops. And then we solve for this form. Now, interestingly, that's a pretty interesting form if you look at it."}],"uncertainties":["log phi 1 by phi"],"diagram":"none","start":511.9,"end":685.6,"asr_flags":[],"math_clarifications":["公式中的符号和数学表达均符合逻辑回归的基本原理，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":511.9,"text":"Okay, so then I do this. This is just this term here, and this character here is just this term here with a log. Okay, now this is already great intuitively because I now have it in a nice X form. I have something that looks like more or less linear. There's some logs and other stuff, and I got to figure out kind of how to hide them and put them in the right spots. All right, so how am I going to do it? Well, I'm going to group the terms by what they depend on."},{"start":541.45,"text":"And so y, as I said, I'm going to imagine y is just going to be the ty is just going to be y itself. And I'm going to start to group the other terms that are nearby. And in particular, I'm going to find all the terms that multiply by y because I only have one term here that depends on y, whereas this one doesn't. What I'm trying to emphasize here is it's not like some mysterious mathematical insight. It's just mechanical. I'm just trying to group all the terms that have y on them."},{"start":567.03,"text":"I group them, and it happens to be that I get this funny-looking thing, log phi 1 by phi. You may have seen this before. If you haven't, don't worry. It's the log odds. So it's a thing that statisticians may have told you about. Plus, I get this nice term here. OK. Life's good. All right. So now, in this situation, I have a couple things to correct. We have ty is equal to y. All good. We're going to see that a bunch. But we could have had a more complicated function there."},{"start":599.06,"text":"We have our eta is going to have this weird little form, which is nice. We'll come back to that in a second. And then we have here this thing which we want as our candidate to be A of eta. We see there's some eta here, but it's not actually obvious when we put it in this form that this is a function of eta. What do I mean? Well, if it's a function, there should be something that maps from one value to another value. So effectively, we have to figure out how to do a little bit of an inversion here. Is it clear why?"},{"start":628.28,"text":"There's some relationship, clearly, between eta and phi, right, from this function. But we don't know if there's some function that kind of goes this way. And we want a to be a function. So far, so good? All right. So how do we do that? Well, we do a little bit more, you know, kind of solving. We exponentiate. Oops. And then we solve for this form. Now, interestingly, that's a pretty interesting form if you look at it."},{"start":657.48,"text":"It's got this 1 plus e to the minus kind of form. We saw something like that in logistic regression. And that'll come back a little bit later. Okay, so life is good. So we plug it in. Yep, and indeed, we now have a form. And this is the right form where it's now only a function of eta. We've eliminated the phi, and life is good for us. Okay, so what we verified here, which is kind of a sanity test, this is not like a deep result."}],"speech_gaps":[],"frame":"../frames/v046/004.webp","frame_time":523.9},{"title":"指数族、广义线性模型与分类","segments":[{"id":27,"text":"But if this didn't happen, we wouldn't think that exponential models were very valuable. But this is probably the most natural and simplest one of these distributions. And we were able to plug it in and say, yep, the Bernoulli distribution that we looked, it generalizes what we've seen before. Now, let's look at one more example.","zh":"但如果这种情况没有发生，我们就不会认为指数模型非常有价值。但这是这些分布中最自然且最简单的之一。我们能够将其代入并说，我们之前所看的伯努利分布，它概括了我们之前所见到的情况。现在，让我们再看一个例子。","start":686.27,"end":708.37},{"id":28,"text":"So that last example looked like errors that you would get from a 0-1 kind of thing. So think about the errors, by the way. Think of these distributions. Let me go back for a second. Think about these errors as kind of... Let me go one more back. One more back. Sorry, there's a lot of slides here.","zh":"上一个例子看起来像是来自0-1类型的误差。所以，想想这些误差。想想这些分布。让我稍后再想一下。把这些误差看作某种……让我再往前一点。再往前一点。抱歉，这里有很多幻灯片。","start":709.54,"end":723.22},{"id":29,"text":"Think about these as kind of the errors, the P of Ys, right? These are the distribution of the errors. Remember we talked about in the linear models, what was going to happen is we would predict and then we would have an error term that came out. Sometimes when people get confused about here, they're like, hey, where's the model? Where's the data? There's no model in data for the moment. We're talking about distributions, okay? We're eventually going to get the mean parameters by estimating them from data.","zh":"把这些看作某种误差，即Y的概率，对吧？这些是误差的分布。还记得我们在线性模型中讨论过，会发生什么吗？我们会进行预测，然后会出现一个误差项。有时候当人们在这里感到困惑时，他们会问，嘿，模型在哪里？数据在哪里？目前数据中没有模型。我们正在谈论的是分布，好吗？我们最终会通过数据来估计这些均值参数。","start":723.93,"end":743.39},{"id":30,"text":"So we could get phi or its mean from looking at a bunch of examples we've seen, just like in logistic regression, when you pick the spot and then you had some error around it. But this is handling the distributional error component of it. OK, good enough. So what's the other error we saw in the class? Well, the last time we were looking at, in last lecture, we looked at least squares.","zh":"因此，我们可以通过观察我们所见过的一系列例子来获得φ或其均值，就像在逻辑回归中，你选择一个点，然后它周围有一些误差。但这是处理分布误差成分的问题。好的，够了。我们在课堂上还看到了另一种误差是什么？好吧，上一次我们看到的是，上一节课我们讨论了最小二乘法。","start":743.82,"end":765.56},{"id":31,"text":"And we also had these errors that we said were Gaussian. Remember, we basically had this thing that we went through where we said, look, the errors are Gaussian. We were going to do maximum likelihood, and out fell least squares. That was the story that we did in the last lecture.","zh":"我们还说过这些误差是高斯分布的。还记得我们之前讨论过的情况吗？我们说，误差是高斯分布的，我们打算进行最大似然估计，结果就得到了最小二乘法。这就是我们在上一节课中讲述的故事。","start":766.7,"end":779.68},{"id":32,"text":"So how is this going to work? Well, there's a square here. We're going to have to deal with that. There's a constant here. That's not going to cause us any problems. Luckily for us, there's already an x. So we feel like we're halfway home. And all of this is basically just a bunch of algebraic manipulation to put it into the right form. So what is that right form? Well, we have these y squared terms. Oops.","zh":"那么这要怎么进行呢？好吧，这里有一个平方项。我们必须处理它。这里还有一个常数项。这不会给我们带来任何麻烦。幸运的是，这里已经有一个x了。所以我们感觉已经完成了一半。而所有这些基本上只是代数运算，目的是将其转换为正确的形式。那么这个正确的形式是什么呢？好吧，我们有一些y的平方项。哎呀。","start":780.97,"end":809.47},{"id":33,"text":"We have some groupings. And off to the races we go. So we get the y squared terms. That's going to be part of the term that goes out in front. That's the BY term. Remember, that's there. We have the term where there's a linear term here from UI. Now, this may have been the part where if you were thinking about how to do this transformation, you may have been a little bit nervous because you say, look, there's something going on here that looks like it's nonlinear, but we have to get to remember a dot product. So something that's linear in the actual parameters.","zh":"我们有一些分组项。于是我们开始进行运算。我们得到了y的平方项。这将是放在前面的那个项的一部分。这就是BY项。记住，它在那里。我们还有一个来自UI的线性项。现在，这可能是你思考如何进行这种变换时感到有点紧张的部分，因为你可能会想，这里似乎有一些非线性的东西，但我们必须记住点积。所以，这实际上是参数的线性形式。","start":810.59,"end":838.03},{"id":34,"text":"Okay? That is the essence of this form, right? There's a B that's separated. That can be some complicated nonlinear thing. This A, that can be some complicated nonlinear thing of eta. But the interactions between them have to be linear. That's going to be really important in the second half of this lecture when we get to generalized linear models. That's what we're going to mean. This part we're going to make into a model. Okay? Just foreshadowing what we're doing. Okay?","zh":"明白了吗？这就是这种形式的本质，对吧？这里有一个B，它可能是一个复杂的非线性项。这个A，它可能是一个关于eta的复杂非线性项。但它们之间的相互作用必须是线性的。这在本讲座后半部分讲广义线性模型时将非常重要。这就是我们要表达的意思。我们将这一部分转化为模型。明白了吗？这只是在预示我们将要做的事情。明白了吗？","start":838.84,"end":860.82}],"notes":["本段主要讨论如何将平方误差项纳入指数族框架中。讲者指出，虽然平方项看起来复杂，但通过代数操作可以将其转化为标准形式。关键在于将非线性项与参数之间的线性关系区分开来，这是广义线性模型的核心思想。","讲者强调，即使在处理非线性项时，也必须确保参数之间的关系保持线性。这种线性关系是广义线性模型能够有效建模的基础，特别是在后续讨论中将要涉及的模型构建过程中。","在处理平方误差项时，讲者提到需要将项分解为线性部分和非线性部分，并确保它们之间的相互作用保持线性。这种分解是将模型纳入指数族框架的关键步骤。","讲者通过举例说明，即使在处理看似非线性的项时，只要保持参数之间的线性关系，就可以将其纳入广义线性模型的框架中。这种处理方式为后续的模型构建提供了理论基础。","讲者提到，这种处理方式在广义线性模型的构建中非常重要，因为它确保了模型的可解释性和有效性。通过将非线性项与参数之间的关系线性化，可以更有效地进行参数估计和模型拟合。","最后，讲者通过强调线性关系的重要性，为后续的广义线性模型讨论做了铺垫，说明这种处理方式是构建有效模型的关键步骤。"],"formulas":[{"latex":"y^2","symbols":"平方项","explanation":"保留原式，y^2 是一个平方项，符合数学表达。","evidence":"So let's look and see if this one also gets in our framework. And it's just validating that, yeah, this should also be in our variance. So how is this going to work? Well, there's a square here. We're going to have to deal with ulli distribution that we looked, it generalizes what we've seen before. Now, let's look at one more example."},{"start":709.54,"text":"So that last example looked like errors that you would get from a 0-1 kind of thing. So think about the errors, by the way. Think of these distributions. Let me go back for a second. Think about these errors as kind of... Let me go one more back. One more back. Sorry, there's a lot of slides here."},{"start":723.93,"text":"Think about these as kind of the errors, the P of Ys, right? These are the distribution of the errors. Remember we talked about in the linear models, what was going to happen is we would predict and then we would have an error term that came out. Sometimes when people get confused about here, they're like, hey, where's the model? Where's the data? There's no model in data for the moment. We're talking about distributions, okay? We're eventually going to get the mean parameters by estimating them from data."},{"start":743.82,"text":"So we could get phi or its mean from looking at a bunch of examples we've seen, just like in logistic regression, when you pick the spot and then you had some error around it. But this is handling the distributional error component of it. OK, good enough. So what's the other error we saw in the class? Well, the last time we were looking at, in last lecture, we looked at least squares."},{"start":766.7,"text":"And we also had these errors that we said were Gaussian. Remember, we basically had this thing that we went through where we said, look, the errors are Gaussian. We were going to do maximum likelihood, and out fell least squares. That was the story that we did in the last lecture."},{"start":780.97,"text":"So let's look and see if this one also gets in our framework. And it's just validating that, yeah, this should also be in our variance. So how is this going to work? Well, there's a square here. We're going to have to deal with that. There's a constant here. That's not going to cause us any problems. Luckily for us, there's already an x. So we feel like we're halfway home. And all of this is basically just a bunch of algebraic manipulation to put it into the right form. So what is that right form? Well, we have these y squared terms. Oops."},{"start":810.59,"text":"We have some groupings. And off to the races we go. So we get the y squared terms. That's going to be part of the term that goes out in front. That's the BY term. Remember, that's there. We have the term where there's a linear term here from UI. Now, this may have been the part where if you were thinking about how to do this transformation, you may have been a little bit nervous because you say, look, there's something going on here that looks like it's nonlinear, but we have to get to remember a dot product. So something that's linear in the actual parameters."},{"start":838.84,"text":"Okay? That is the essence of this form, right? There's a B that's separated. That can be some complicated nonlinear thing. This A, that can be some complicated nonlinear thing of eta. But the interactions between them have to be linear. That's going to be really important in the second half of this lecture when we get to generalized linear models. That's what we're going to mean. This part we're going to make into a model. Okay? Just foreshadowing what we're doing. Okay?"}],"speech_gaps":[],"frame":"../frames/v046/005.webp","frame_time":698.27},{"title":"指数族、广义线性模型与分类","segments":[{"id":35,"text":"Everything that happened here is manipulation. This is just exactly what you would think. A gets that, all the rest. Now, these terms start to look like, hopefully, things you've seen, like this natural parameter here, mu, is exactly eta. So that's wonderful. ty is y. And then we have this partition function, this normalization. So far, so good? All right. So the takeaway from this is the two distributions you've seen so far in the course, the error distributions, both fit into this form.","zh":"这里发生的一切都是人为操作。这正是你所预期的结果。A获得了这些，其余的则没有。现在，这些项开始看起来像你之前见过的东西，比如这里的自然参数μ，正好就是η。这非常好。ty就是y。然后我们有这个配分函数，也就是归一化项。到目前为止，一切顺利吗？好的。因此，从中得出的结论是，你在这门课中见过的两种分布，误差分布，都符合这种形式。","start":861.66,"end":889.52},{"id":36,"text":"There's one other thing that's a little bit weird about this, and this turns out to be when we talked about getting things for free from this, which is that if you noticed, if we took the derivatives of a n, and actually if you compute the second derivatives, we have this interesting correspondence for the Gaussian where it was exactly the mean. So we take a differential of this character, and it's exactly the mean.","zh":"这里还有一个有点奇怪的地方，那就是当我们谈到从这里免费获得某些东西时，这一点变得明显。如果你注意到了，如果我们对a_n求导，实际上如果你计算二阶导数，我们会发现高斯分布中存在一个有趣的对应关系，它正好是均值。因此，我们对这个特征进行微分，它正好是均值。","start":892.68,"end":918.18},{"id":37,"text":"And so the thing is, you could think that that's just like an odd coincidence. It's some piece. But it's actually canonical for this class. This is what happens for all linear models. So let's see why this is true in general. So the point is, if you look at this function and you take the differential,","zh":"因此，你可能会认为这只是个巧合。这只是其中的一部分。但实际上，这在这一类中是规范的。这是所有线性模型都会发生的事情。那么，让我们看看为什么在一般情况下这是成立的。要点是，如果你观察这个函数并对其进行微分，","start":919.08,"end":937.32},{"id":38,"text":"what's going to happen? So when you differentiate the log, what happens? This term goes down underneath, right? That's the differential log. If I look inside this term here, I get a bunch of the original term, that's this character here, times ty. Well, that's exactly the expected value of ty, right? This is the normalization piece. As I said, this was all the different possible worlds, if you like, if it were discrete. And then it's times that ty. This makes this an expectation.","zh":"会发生什么呢？当你对对数进行微分时，会发生什么？这个项会下降到下面，对吧？这就是对数微分。如果我看看这里的项，我会得到一堆原始项，也就是这里的这个特征，乘以ty。这正好是ty的期望值，对吧？这是归一化部分。正如我所说，这涵盖了所有可能的世界，如果你喜欢的话，如果它是离散的。然后乘以ty。这使得它成为一个期望值。","start":938.91,"end":968.56},{"id":39,"text":"And so basically what this says is when I was saying before that the action is embedded in this log partition function, this is what I mean. It has all the outcomes, but if I differentiate it, I get exactly the expectation. Clear enough what that means? So for all of these characters, I can basically do exactly this transformation. And this is going to be, there's nothing in here that used a property of the Gaussian or Bernoulli noise or anything else. Everything else that we say fits the functional form.","zh":"因此，基本上这句话的意思是，我之前所说的动作被嵌入到这个对数分区函数中，这就是我的意思。它包含了所有可能的结果，但如果我对它进行求导，就会得到确切的期望值。清楚这是什么意思吗？所以对于所有这些变量，我基本上都可以进行这样的变换。而这将是一个非常广泛的形式，其中没有任何内容使用了高斯分布或伯努利噪声等特定分布的性质。我们所说的其他一切内容都符合这种函数形式。","start":969.63,"end":997.33},{"id":40,"text":"immediately satisfies this property. So one way to think about this and why we tell you is this compresses a bunch of different ideas that you could have to do independently, different distributions, different error modeling, all the rest. Now, once you know this piece, you can basically say if they fit into this class, which is extremely broad, all of a sudden you know how to build the model, you know how to do expectations, and in a second we'll see that you know how to learn as well. Because if you know how to do inference, you also know how to do parameter estimation.","zh":"它立即满足这一性质。因此，一种思考方式是，我们告诉你的原因就是，它压缩了你原本需要独立处理的一系列不同概念，包括不同的分布、不同的误差建模等等。一旦你知道了这一点，你就可以基本上判断它们是否符合这个非常广泛的一类模型，突然之间你就知道如何构建模型，如何进行期望计算，而且很快我们会看到，你也会知道如何进行学习。因为如果你知道如何进行推断，你也知道如何进行参数估计。","start":998.32,"end":1025.12}],"notes":["本段讲解了指数族分布中自然参数与期望值之间的关系，指出在高斯分布中，对数分区函数的导数正好对应于均值。这表明了指数族分布的一个重要性质，即通过对数分区函数的导数可以得到期望值，这一性质适用于所有线性模型。","讲者提到，这一性质并非偶然，而是指数族分布的普遍特性。通过分析对数分区函数的导数，可以得到期望值，这为后续的模型构建和参数估计提供了理论基础。","讲者进一步说明，这一性质适用于所有符合指数族分布形式的模型，而不仅仅是高斯分布或伯努利分布。这意味着，只要模型符合指数族的结构，就可以利用这一性质进行建模和推断。","讲者指出，这一性质使得不同分布和误差建模方法可以被统一处理，从而简化了模型构建和参数估计的过程。这表明了指数族分布的广泛适用性和统一性。","讲者强调，理解这一性质对于学习如何构建模型、进行期望计算以及参数估计至关重要。因为如果能够进行推断，就可以进行参数估计，从而实现模型的学习。","最后，讲者提到，这一性质使得模型构建和参数估计变得简单，因为只要模型符合指数族的结构，就可以直接应用这一性质进行建模和学习。"],"formulas":[],"uncertainties":["a n"],"diagram":"none","start":861.66,"end":1025.12,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":861.66,"text":"Everything that happened here is manipulation. This is just exactly what you would think. A gets that, all the rest. Now, these terms start to look like, hopefully, things you've seen, like this natural parameter here, mu, is exactly eta. So that's wonderful. ty is y. And then we have this partition function, this normalization. So far, so good? All right. So the takeaway from this is the two distributions you've seen so far in the course, the error distributions, both fit into this form."},{"start":892.68,"text":"There's one other thing that's a little bit weird about this, and this turns out to be when we talked about getting things for free from this, which is that if you noticed, if we took the derivatives of a n, and actually if you compute the second derivatives, we have this interesting correspondence for the Gaussian where it was exactly the mean. So we take a differential of this character, and it's exactly the mean."},{"start":919.08,"text":"And so the thing is, you could think that that's just like an odd coincidence. It's some piece. But it's actually canonical for this class. This is what happens for all linear models. So let's see why this is true in general. So the point is, if you look at this function and you take the differential,"},{"start":938.91,"text":"what's going to happen? So when you differentiate the log, what happens? This term goes down underneath, right? That's the differential log. If I look inside this term here, I get a bunch of the original term, that's this character here, times ty. Well, that's exactly the expected value of ty, right? This is the normalization piece. As I said, this was all the different possible worlds, if you like, if it were discrete. And then it's times that ty. This makes this an expectation."},{"start":969.63,"text":"And so basically what this says is when I was saying before that the action is embedded in this log partition function, this is what I mean. It has all the outcomes, but if I differentiate it, I get exactly the expectation. Clear enough what that means? So for all of these characters, I can basically do exactly this transformation. And this is going to be, there's nothing in here that used a property of the Gaussian or Bernoulli noise or anything else. Everything else that we say fits the functional form."},{"start":998.32,"text":"immediately satisfies this property. So one way to think about this and why we tell you is this compresses a bunch of different ideas that you could have to do independently, different distributions, different error modeling, all the rest. Now, once you know this piece, you can basically say if they fit into this class, which is extremely broad, all of a sudden you know how to build the model, you know how to do expectations, and in a second we'll see that you know how to learn as well. Because if you know how to do inference, you also know how to do parameter estimation."}],"speech_gaps":[],"frame":"../frames/v046/006.webp","frame_time":873.66},{"title":"指数族、广义线性模型与分类","segments":[{"id":41,"text":"All right. You can check. I won't. It's the same calculation. How does this variance work? We take another derivative here. You get the standard things. You get a square here. Cancels out. All the rest. And you're going to get exactly the variance. OK. Cool. Any questions about this, including motivation? Why are you telling me this? That's a fair question. Please. Equals. Exactly right.","zh":"好的。你可以检查一下。我就不检查了。这是同样的计算。这个方差是怎么工作的？我们在这里再求一次导数。你会得到标准的结果。你会得到一个平方项。这里会抵消掉。其余的部分。你最终会得到确切的方差。好的。很酷。有关这个问题的任何疑问，包括动机？为什么你告诉我这些？这是个合理的问题。请。等于。完全正确。","start":1028.58,"end":1056.28},{"id":42,"text":"Exactly right. This is the normalization concept. You got it exactly right. The question is, why is this actually the expectation? And this is exactly that normalization constant when you put it back up. Wonderful question. Other questions? Awesome. Great work.","zh":"完全正确。这是归一化概念。你完全理解了。问题是，为什么这实际上是期望值？而这正是当你把它放回去时的归一化常数。非常好的问题。还有其他问题吗？太棒了。做得很好。","start":1057.46,"end":1073.4},{"id":43,"text":"OK, this you don't need to know, but I just want to put it in there. These basically have to do with, so by show of hands, who knows what a moment generating function is? Should be many people. Oh, not as many as I would have thought. OK, doesn't matter. You don't need to know this anyway. If you did know what a moment generating function is, this is not a moment generating function. So that's, I guess, not super useful for those of you who don't know what it is. But basically, what you're looking at here is something called a cumulant generating function, which sometimes people get confused by because the first couple of terms match, but the higher terms don't match. So the higher moments and the higher","zh":"好的，你不需要知道这些，但我只是想提一下。这些基本上与矩生成函数有关。举手示意，谁知道什么是矩生成函数？应该有很多人。哦，比我想象的要少。没关系。你本来就不需要知道这些。如果你知道什么是矩生成函数，那么这并不是一个矩生成函数。所以，对于那些不知道它的人来说，这可能并不太有用。但基本上，你在这里看到的是一个叫做累积生成函数的东西，有时候人们会混淆它，因为前几项是匹配的，但更高阶的项并不匹配。因此，高阶矩和高阶累积量是不同的。累积量的计算更加麻烦。在更高阶的情况下，你需要使用更复杂的技巧。但低阶项是匹配的。所以它们是相同的。但高阶项只是……","start":1076.13,"end":1105.23},{"id":44,"text":"higher cumulants are different. Cumulants are more painful to compute. Like at higher things, you have to use fancy techniques for them. But the lower order terms, they align. So they're the same. But the higher order terms are just...","zh":"更复杂，因为它们是这个配分函数的导数。但它们在数学上更加优美。因此，你可以用累积量来证明一些漂亮的结果。因此，有时在证明中人们会更喜欢使用累积量而不是矩生成函数。这对你们来说并不重要。但以防万一，因为人们有时会混淆，这些不是矩生成函数吗？不，它们不是矩生成函数。前几项匹配，前三项匹配。之后它们就不匹配了。好的。","start":1105.23,"end":1117.59},{"id":45,"text":"fancier to compute because they're derivatives of this partition function. But they're a lot mathematically nicer. So you can prove nice things with cumulants. So sometimes you'll see people in proofs prefer cumulants to moment generating functions. Does not really matter for you. But just in case, because people have gotten confused about, aren't these just moment generating functions? No, they are not moment generating functions. The first couple match, first three match. After that, they don't. OK.","zh":"更高阶的累积量和更高阶的矩是不同的。累积量的计算更加麻烦。在更高阶的情况下，你需要使用更复杂的技巧。但低阶项是匹配的。所以它们是相同的。但高阶项只是……","start":1117.89,"end":1142.05},{"id":46,"text":"So the exponential family, though, is this story in disguise in some way. So if you really care about the proofs and the rest, like this is the thing that's going on. And so when I say it's in disguise, what does that mean? This is just intuition. So please don't try and do this. Basically, all that's going on is it says, if your distribution is such that you can match it with a couple of these low cumulants.","zh":"因此，指数族，虽然以某种方式隐藏了这个故事。所以如果你真的关心证明和其他内容，这就是正在发生的事情。当我提到它是隐藏的，这意味着什么？这只是直觉。所以请不要试图这样做。基本上，发生的事情是，如果你的分布可以与这些低阶累积量中的几个匹配，那么你就可以将其放入这个指数族中，如果它由这些locumens定义的话。结果发现大多数分布都是这样，因为它捕捉了均值、方差等。好的。好的，还有另一件非常棒的事情。我在几节课前被问到这个问题：什么是凸函数？我说，好吧，在最初的几节课中。这是因为这个函数是凸函数。这就是这个函数。如果你还记得，它是高斯分布中的1/2乘以eta的平方。这就是我们实际上要做的事情。好的？","start":1142.8,"end":1164.44},{"id":47,"text":"then you can stick it into this exponential family if it's defined by these locumens. And it turns out most distributions are because it captures the mean and the variance and so on. Okay. All right. One other thing that's extremely nice. So I was asked this question a couple lectures ago. What's convex? And I said, well, the first couple lectures. It's because this function is convex. And that's the function. If you remember, it's the 1 half by eta squared in the Gaussian. That's what we're actually going to do. Okay?","zh":"那么，如果你的分布可以与这些低阶累积量中的几个匹配，那么你就可以将其放入这个指数族中，如果它由这些locumens定义的话。结果发现大多数分布都是这样，因为它捕捉了均值、方差等。好的。好的，还有另一件非常棒的事情。我在几节课前被问到这个问题：什么是凸函数？我说，好吧，在最初的几节课中。这是因为这个函数是凸函数。这就是这个函数。如果你还记得，它是高斯分布中的1/2乘以eta的平方。这就是我们实际上要做的事情。好的？","start":1165.68,"end":1196.8}],"notes":["本段主要讨论了方差的计算过程，强调了通过求导得到方差的步骤，并指出在计算过程中平方项会抵消，从而得到方差。讲者还提到，如果对这部分内容有疑问，可以提问，但同时也指出这是为了帮助理解而进行的解释。","讲者进一步解释了归一化常数的概念，并指出归一化常数在计算期望值时的重要性。他提到，归一化常数是将分布重新归一化时所用的常数，这有助于理解概率分布的结构。","本段介绍了矩生成函数（moment generating function）和累积生成函数（cumulant generating function）的区别。讲者指出，虽然前几项可能匹配，但高阶项并不相同，因此累积生成函数在计算高阶矩时更为复杂。","讲者强调了累积生成函数在数学上的优势，特别是在证明某些性质时更为方便。他提到，虽然矩生成函数在某些情况下可能更直观，但累积生成函数在处理高阶矩时更为数学化。","讲者指出，指数族分布实际上是通过累积生成函数的结构来隐藏的。他提到，如果一个分布可以通过匹配低阶累积矩来定义，那么它就可以被归入指数族。这表明指数族能够捕捉分布的均值和方差等基本统计量。","最后，讲者提到凸函数的概念，并指出在高斯分布中，凸函数的形式是1/2乘以eta的平方。这表明凸性在某些分布中具有重要的数学意义。"],"formulas":[{"latex":"\\text{Var}(X) = \\mathbb{E}[X^2] - (\\mathbb{E}[X])^2","symbols":"方差等于二阶矩减去一阶矩的平方","explanation":"公式正确，保持原样。","evidence":"All right. You can check. I won't. It's the same calculation. How does this variance work? We take another derivative here. You get the standard things. You get a square here. Cancels out. All the rest. And you're going to get exactly the variance. OK. Cool. Any questions about this, including motivation? Why are you telling me this? That's a fair question. Please. Equals . Exactly right."}],"uncertainties":["locumens"],"diagram":"none","start":1028.58,"end":1196.8,"asr_flags":[],"math_clarifications":["公式0中的符号'Var(X)'应使用标准数学符号'\\text{Var}(X)'，并确保所有期望符号使用'\\mathbb{E}'。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1028.58,"text":"All right. You can check. I won't. It's the same calculation. How does this variance work? We take another derivative here. You get the standard things. You get a square here. Cancels out. All the rest. And you're going to get exactly the variance. OK. Cool. Any questions about this, including motivation? Why are you telling me this? That's a fair question. Please. Equals . Exactly right."},{"start":1057.46,"text":"Exactly right. This is the normalization concept. You got it exactly right. The question is, why is this actually the expectation? And this is exactly that normalization constant when you put it back up. Wonderful question. Other questions? Awesome. Great work."},{"start":1076.13,"text":"OK, this you don't need to know, but I just want to put it in there. These basically have to do with, so by show of hands, who knows what a moment generating function is? Should be many people. Oh, not as many as I would have thought. OK, doesn't matter. You don't need to know this anyway. If you did know what a moment generating function is, this is not a moment generating function. So that's, I guess, not super useful for those of you who don't know what it is. But basically, what you're looking at here is something called a cumulant generating function, which sometimes people get confused by because the first couple of terms match, but the higher terms don't match. So the higher moments and the higher"},{"start":1105.23,"text":"higher cumulants are different. Cumulants are more painful to compute. Like at higher things, you have to use fancy techniques for them. But the lower order terms, they align. So they're the same. But the higher order terms are just..."},{"start":1117.89,"text":"fancier to compute because they're derivatives of this partition function. But they're a lot mathematically nicer. So you can prove nice things with cumulants. So sometimes you'll see people in proofs prefer cumulants to moment generating functions. Does not really matter for you. But just in case, because people have gotten confused about, aren't these just moment generating functions? No, they are not moment generating functions. The first couple match, first three match. After that, they don't. OK."},{"start":1142.8,"text":"So the exponential family, though, is this story in disguise in some way. So if you really care about the proofs and the rest, like this is the thing that's going on. And so when I say it's in disguise, what does that mean? This is just intuition. So please don't try and do this. Basically, all that's going on is it says, if your distribution is such that you can match it with a couple of these low cumulants."},{"start":1165.68,"text":"then you can stick it into this exponential family if it's defined by these locumens. And it turns out most distributions are because it captures the mean and the variance and so on. Okay. All right. One other thing that's extremely nice. So I was asked this question a couple lectures ago. What's convex? And I said, well, the first couple lectures. It's because this function is convex. And that's the function. If you remember, it's the 1 half by eta squared in the Gaussian. That's what we're actually going to do. Okay?"}],"speech_gaps":[],"frame":"../frames/v046/007.webp","frame_time":1040.58},{"title":"指数族、广义线性模型与分类","segments":[{"id":48,"text":"Awesome. Why is it convex, by the way, just in case you don't see? It's because you have the expected value as the first derivative. The second derivative is a variance or a covariance with positive semi-definite. Good enough.","zh":"太棒了。顺便问一句，为什么它是凸的，如果你没注意到的话？这是因为你有期望值作为一阶导数。二阶导数是一个方差或协方差，它是半正定的。这样已经足够好了。","start":1197.91,"end":1212.96},{"id":49,"text":"All right. So why does that matter, by the way? Well, if it's convex, that means that as you do the learning, you're going to have all the nice things. You can recover the parameters. So if you remember your convex analysis or you remember the basics of that, the fact that it's convex means you can get back the etas and the thetas and all the rest of the things that you wanted. And you'll be able to do it with gradient descent. It's going to be a nice bowl-shaped function, as we talked about. Awesome. OK.","zh":"好的。那么，为什么这会重要呢？嗯，如果它是凸的，这意味着在进行学习时，你会拥有所有好的性质。你可以恢复参数。如果你记得凸分析或者凸性的基础知识，那么它凸意味着你可以得到etas和thetas以及你想要的所有其他东西。你将能够使用梯度下降法来实现这一点。它将是一个碗状函数，正如我们之前讨论的。太棒了。好的。","start":1214.15,"end":1240.42},{"id":50,"text":"This would just have been 20 minutes of your life that was devoted to a bunch of symbol pushing that said, hey, we can take the two things you already knew and put them in another weird form and make it kind of convoluted to compute their expectations, which were really easy in the old way, but kind of hard. So why would we go down this road? The reason we went down this road is you can verify all of these distributions, some of which you may have heard of. Actually, they're all exponential family.","zh":"这只会是你20分钟的生命，被用来做一堆符号运算，说：嘿，我们可以把你知道的两个东西放到另一种奇怪的形式中，使得计算它们的期望变得有点复杂，而以前的方法却非常简单。那么，为什么我们要走这条路呢？我们走这条路的原因是你能够验证所有这些分布，其中一些你可能听说过。实际上，它们都是指数族分布。","start":1242.26,"end":1268.64},{"id":51,"text":"And so this means all of them have different things. You have binary, you get Bernoulli. You have multiple classes, we'll get multinomial. That's the one we're going to do softmax at the end. Real values, you can get to Gaussians. If you have discrete counts, you don't know how many, Poisson. If you have these positive exponential decays, you have gamma and exponential. If you even want to have distributions over distributions, Brichlet. So this window...","zh":"这意味着它们都有不同的特性。你有二元情况，你会得到伯努利分布。你有多个类别，我们会得到多项分布。这就是我们最后要做softmax的地方。对于实数值，你可以得到高斯分布。如果你有离散计数，但不知道有多少个，那就是泊松分布。如果你有这些正指数衰减，你会得到伽马分布和指数分布。甚至如果你想对分布进行分布，那就是贝塔分布。所以这个窗口……","start":1269.44,"end":1293.46},{"id":52,"text":"Maybe those are more heavy mathematical structures, but they can be all crammed into the same kind of thing. So once you think, as I was telling you before, once you think in terms of errors, then the rest of the model, at least for generalized linear models, kind of falls out. Powerful idea in machine learning. Okay.","zh":"也许这些是更复杂的数学结构，但它们都可以被压缩到同一种形式中。因此，一旦你像我之前告诉你的那样，以误差的角度去思考，那么对于广义线性模型来说，其余的模型部分基本上就会自然地出现。这是机器学习中的一个强大思想。好的。","start":1294.42,"end":1311.89},{"id":53,"text":"All right, so in this course, we're not going to do more fancy stuff. We'll use ty equals y. We're going to do simple stuff, but I wanted to show it to you because if you see it in a textbook, like if you were to pull up a generalized linear model textbook, and by the way, there are big textbooks about generalized linear models. It's not like one page. If you look at that textbook, they will use t in fancier ways. OK.","zh":"好的，所以在本课程中，我们不会做更多复杂的操作。我们会使用 ty 等于 y。我们会做简单的事情，但我想要展示给你们看，因为如果你们在教科书中看到相关内容，比如翻开一本广义线性模型的教科书，顺便说一句，关于广义线性模型有很多大部头的教科书，不是一页就能讲完的。如果你们查看那本教科书，他们会用 t 的方式更加复杂。好的。","start":1313.34,"end":1332.63},{"id":54,"text":"All right, so hopefully this message landed with you and you get the conceptual piece. But if not, or even if it did, please go ahead and ask me a question. I'm happy to talk to you about it. Why am I telling you this and how does it fit in? Please.","zh":"好的，希望这条信息传达给你们了，并且你们理解了这个概念。如果没有理解，或者即使理解了，请随时向我提问。我很乐意和你们讨论这个问题。为什么我要告诉你们这些，以及它如何与我们思考误差相关呢？请。","start":1333.43,"end":1346.11},{"id":55,"text":"Awesome. Yeah. So the question is, why does this have to do with thinking in terms of errors? So what's going on in the exponential family is we're going to see in a minute how we tie this to an actual model. That's going to be what's called the generalized linear model. That model is going to take data, learn some parameters, and fit things. What we saw in the last two lectures are we had effectively the same procedure once we had the model and the data, but we changed the loss function.","zh":"太棒了。是的。所以问题是，为什么这与用误差来思考有关呢？接下来我们会看到，在指数族中，我们将如何将这些内容与一个实际的模型联系起来。这将被称为广义线性模型。这个模型将处理数据，学习一些参数，并进行拟合。我们在前两节课中看到的，一旦我们有了模型和数据，实际上我们执行了相同的程序，但改变了损失函数。","start":1349.01,"end":1376.75}],"notes":["本段主要讲解指数族分布的凸性及其重要性。凸性意味着在学习过程中可以利用梯度下降等优化方法，因为凸函数具有唯一的全局最小值，且可以恢复参数。凸性还意味着函数形状像一个碗，便于优化。","讲者提到，虽然指数族分布的推导过程可能看起来复杂，但其核心思想是将已知的分布形式转换为统一的指数族形式，从而便于计算期望值。这种形式虽然计算复杂，但能涵盖多种分布，如伯努利、多项式、高斯、泊松、伽马、指数和狄利克雷分布。","指数族分布的统一形式使得广义线性模型（GLM）的构建变得可能。通过将数据与模型参数联系起来，可以构建出适用于不同任务的模型，如分类和回归。","讲者强调，广义线性模型的核心思想是将误差与模型参数联系起来，从而构建出模型。这种思想在机器学习中非常强大，因为它允许我们使用不同的损失函数来适应不同的任务。","讲者提到，虽然本课程不会深入复杂的模型，但会展示广义线性模型的基本思想，因为这些思想在教科书中被广泛讨论，并且有专门的书籍进行深入讲解。","最后，讲者鼓励学生提问，以进一步理解指数族分布与广义线性模型之间的关系，以及如何将这些概念应用到实际问题中。"],"formulas":[],"uncertainties":["Brichlet"],"diagram":"none","start":1197.91,"end":1376.75,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1197.91,"text":"Awesome. Why is it convex, by the way, just in case you don't see? It's because you have the expected value as the first derivative. The second derivative is a variance or a covariance with positive semi-definite. Good enough."},{"start":1214.15,"text":"All right. So why does that matter, by the way? Well, if it's convex, that means that as you do the learning, you're going to have all the nice things. You can recover the parameters. So if you remember your convex analysis or you remember the basics of that, the fact that it's convex means you can get back the etas and the thetas and all the rest of the things that you wanted. And you'll be able to do it with gradient descent. It's going to be a nice bowl-shaped function, as we talked about. Awesome. OK."},{"start":1242.26,"text":"This would just have been 20 minutes of your life that was devoted to a bunch of symbol pushing that said, hey, we can take the two things you already knew and put them in another weird form and make it kind of convoluted to compute their expectations, which were really easy in the old way, but kind of hard. So why would we go down this road? The reason we went down this road is you can verify all of these distributions, some of which you may have heard of. Actually, they're all exponential family."},{"start":1269.44,"text":"And so this means all of them have different things. You have binary, you get Bernoulli. You have multiple classes, we'll get multinomial. That's the one we're going to do softmax at the end. Real values, you can get to Gaussians. If you have discrete counts, you don't know how many, Poisson. If you have these positive exponential decays, you have gamma and exponential. If you even want to have distributions over distributions, Brichlet. So this window..."},{"start":1294.42,"text":"Maybe those are more heavy mathematical structures, but they can be all crammed into the same kind of thing. So once you think, as I was telling you before, once you think in terms of errors, then the rest of the model, at least for generalized linear models, kind of falls out. Powerful idea in machine learning. Okay."},{"start":1313.34,"text":"All right, so in this course, we're not going to do more fancy stuff. We'll use ty equals y. We're going to do simple stuff, but I wanted to show it to you because if you see it in a textbook, like if you were to pull up a generalized linear model textbook, and by the way, there are big textbooks about generalized linear models. It's not like one page. If you look at that textbook, they will use t in fancier ways. OK."},{"start":1333.43,"text":"All right, so hopefully this message landed with you and you get the conceptual piece. But if not, or even if it did, please go ahead and ask me a question. I'm happy to talk to you about it. Why am I telling you this and how does it fit in? Please."},{"start":1349.01,"text":"Awesome. Yeah. So the question is, why does this have to do with thinking in terms of errors? So what's going on in the exponential family is we're going to see in a minute how we tie this to an actual model. That's going to be what's called the generalized linear model. That model is going to take data, learn some parameters, and fit things. What we saw in the last two lectures are we had effectively the same procedure once we had the model and the data, but we changed the loss function."}],"speech_gaps":[],"frame":"../frames/v046/008.webp","frame_time":1209.91},{"title":"指数族、广义线性模型与分类","segments":[{"id":56,"text":"And when we changed the loss function, what was significant about it was we cared a lot about the type. We did one thing for discrete Bernoulli variables, which we now know, which were the 0, 1s, and another thing for the continuous. Here what we're showing is that part where we say from our linear prediction, what kind of errors do we expect? Are we not modeling?","zh":"当我们改变损失函数时，重要的是我们非常关注其类型。我们为离散伯努利变量（现在我们知道它们是0和1）做了一件事，而对连续变量则做了另一件事。这里我们展示的是，从我们的线性预测来看，我们期望出现什么样的误差？我们是否没有建模这些误差？","start":1376.91,"end":1395.51},{"id":57,"text":"that piece is now all handled by the exponential family. So any kind of error you would want to model. When I say think in terms of errors, this is one of the more, I think, interesting things about the way we think in statistics in this is there's a true model that's generating the data, and then there's some error. And when you think about that error, as we talked about, it's what's not being captured by the underlying model. It's measurement error. It's that the counts are off. It's that all the wiggles are in there, whatever it is. There just may be some unmodeled noise in the system.","zh":"这一部分现在完全由指数族处理。因此，任何你想要建模的误差类型都可以被处理。当我谈到以误差的角度思考时，我认为这是统计学中一种非常有趣的事情，因为存在一个真实的模型生成数据，然后存在一些误差。当我们思考这些误差时，正如我们之前讨论的，它是指未被基础模型所捕捉的部分。它是测量误差。它是计数不准确。它是所有波动都包含在其中，无论是什么。系统中可能只是存在一些未建模的噪声。","start":1396.21,"end":1424.13},{"id":58,"text":"Once you start thinking like that, that's one of the key pathways to actually figuring out what models you want to use. And it turns out for a fundamental reason, you can create really, really big models. Even these massive neural nets of today, there is a thing called the neural tangent kernel, which is like a big linear expansion, if you like, of what it's actually computing under the covers. So this is really the foundational piece to me of a lot of the machine learning stuff. Great, wonderful question. Thank you for letting me go on that monologue. Please.","zh":"一旦你开始这样思考，这就是实际确定你想要使用哪些模型的关键途径之一。事实上，由于一个根本的原因，你可以创建非常庞大的模型。即使今天这些巨大的神经网络，也存在一个叫做神经切线核的东西，它就像是一个大的线性展开，描述了它在内部实际计算的内容。对我来说，这是机器学习中很多内容的基础部分。非常好的问题。谢谢让你让我发表这么长的独白。请。","start":1424.91,"end":1451.27},{"id":59,"text":"In practice, how does it work? Is it like almost everything that we do is something with an exponential value? Or do we use any other thing? Yeah, this is a great question. So the question is, in practice, how does this end up working? So first, in practice, you probably are not going to be deriving all these things from first principles. You're probably going to be using a framework. And inside that framework, there will be some implementation of a particular softmax that you're going to use. And so we're talking about what's underneath the hood. One of the things that's been fantastic, just as an aside, historically,","zh":"在实践中，它是如何运作的？是不是我们做的一切几乎都是与指数值有关？还是我们使用其他东西？是的，这是一个非常好的问题。所以问题是，在实践中，这最终是如何运作的？首先，在实践中，你可能不会从第一性原理推导出所有这些内容。你可能使用一个框架。而在该框架中，会有一些特定的softmax实现，你将使用它。因此，我们是在讨论其内部机制。作为一个附带的评论，历史上，这是一件非常棒的事情，","start":1452.1,"end":1481.52},{"id":60,"text":"is when I entered the field, there was no PyTorch or TensorFlow or anything else. And so you had to go and write your own frameworks to do almost everything. You would write C code to do this and check your derivatives. It was a primitive and ancient time. Now you have these incredible libraries that string things together. But if you don't understand the pieces, there was a bug for a model that was from my students. It was a semi-famous model in the literature. And it turned out that a reimplementation of it had an initialization bug.","zh":"在我进入这个领域时，还没有PyTorch或TensorFlow或其他任何东西。因此，你必须自己编写框架来完成几乎所有的工作。你会用C代码来实现这一点并检查你的导数。那是一个原始而古老的时代。现在你有了这些惊人的库，它们能够将各种组件串联起来。但如果你不理解这些组件，我的学生曾有一个模型出现了一个错误。这是一个文献中半著名的模型。结果发现，它的重新实现存在初始化错误。","start":1481.68,"end":1509.64},{"id":61,"text":"And they initialized the weights incorrectly. And that initialization was something that was actually written in the paper but didn't come over. Diagnosing that required people to understand exactly what the expected value was of how you moved forward through these models. And so this is more a tool to understand it than it would be exactly how you would do it. Now, in the ancient times, when you had to write down your derivatives, what you were really happy about this is you could write your derivative code and all the rest that was going to be there, and you could kind of box it up.","zh":"他们错误地初始化了权重。而这种初始化方法实际上在论文中被写明了，但没有被正确传递。诊断这个问题需要人们准确理解如何通过这些模型进行前向传播的期望值。因此，这更像是一种理解问题的工具，而不是确切的实现方法。在那个古老的时代，当你必须手动写出导数时，你真正高兴的是你可以写出导数代码以及所有其他将要出现的内容，并且可以将它们打包起来。","start":1509.98,"end":1538.04}],"notes":["本段讨论了损失函数变化时，对误差类型的重视。对于离散的伯努利变量和连续变量，分别采取了不同的处理方式。这表明在构建模型时，需要根据数据类型选择合适的误差模型。","讲者指出，指数族分布可以统一处理各种误差类型，包括测量误差、计数误差等。这表明在统计建模中，误差被视为未被基础模型捕捉的部分，是系统中未建模的噪声。","讲者提到，理解误差模型是选择合适模型的关键路径。这表明模型选择与对误差的理解密切相关，而指数族分布为这一过程提供了理论基础。","讲者提到，现代机器学习中使用了如PyTorch和TensorFlow等库，但理解底层实现仍然是重要的。这表明即使有现成工具，对模型内部机制的理解仍然是必要的。","讲者提到，学生在实现模型时可能遇到初始化错误，这需要对模型的期望值有深入理解。这表明模型的正确实现依赖于对模型结构和参数的准确理解。","讲者提到，在早期没有现成库时，需要手动编写代码并检查导数。这表明对模型的数学基础和实现细节的理解是构建可靠模型的关键。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1376.91,"end":1538.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1376.91,"text":"And when we changed the loss function, what was significant about it was we cared a lot about the type. We did one thing for discrete Bernoulli variables, which we now know, which were the 0, 1s, and another thing for the continuous. Here what we're showing is that part where we say from our linear prediction, what kind of errors do we expect? Are we not modeling?"},{"start":1396.21,"text":"that piece is now all handled by the exponential family. So any kind of error you would want to model. When I say think in terms of errors, this is one of the more, I think, interesting things about the way we think in statistics in this is there's a true model that's generating the data, and then there's some error. And when you think about that error, as we talked about, it's what's not being captured by the underlying model. It's measurement error. It's that the counts are off. It's that all the wiggles are in there, whatever it is. There just may be some unmodeled noise in the system."},{"start":1424.91,"text":"Once you start thinking like that, that's one of the key pathways to actually figuring out what models you want to use. And it turns out for a fundamental reason, you can create really, really big models. Even these massive neural nets of today, there is a thing called the neural tangent kernel, which is like a big linear expansion, if you like, of what it's actually computing under the covers. So this is really the foundational piece to me of a lot of the machine learning stuff. Great, wonderful question. Thank you for letting me go on that monologue. Please."},{"start":1452.1,"text":"In practice, how does it work? Is it like almost everything that we do is something with an exponential value? Or do we use any other thing? Yeah, this is a great question. So the question is, in practice, how does this end up working? So first, in practice, you probably are not going to be deriving all these things from first principles. You're probably going to be using a framework. And inside that framework, there will be some implementation of a particular softmax that you're going to use. And so we're talking about what's underneath the hood. One of the things that's been fantastic, just as an aside, historically,"},{"start":1481.68,"text":"is when I entered the field, there was no PyTorch or TensorFlow or anything else. And so you had to go and write your own frameworks to do almost everything. You would write C code to do this and check your derivatives. It was a primitive and ancient time. Now you have these incredible libraries that string things together. But if you don't understand the pieces, there was a bug for a model that was from my students. It was a semi-famous model in the literature. And it turned out that a reimplementation of it had an initialization bug."},{"start":1509.98,"text":"And they initialized the weights incorrectly. And that initialization was something that was actually written in the paper but didn't come over. Diagnosing that required people to understand exactly what the expected value was of how you moved forward through these models. And so this is more a tool to understand it than it would be exactly how you would do it. Now, in the ancient times, when you had to write down your derivatives, what you were really happy about this is you could write your derivative code and all the rest that was going to be there, and you could kind of box it up."}],"speech_gaps":[],"frame":"../frames/v046/009.webp","frame_time":1388.91},{"title":"指数族、广义线性模型与分类","segments":[{"id":62,"text":"We had it at the time too, but people weren't using it as widely. You have automatic differentiation. You can write whatever forward code you want and you'll get it. But here you can actually check that it has the statistical properties that you expect. Wonderful question. Awesome. Please. What do you mean get inference for free? Yeah. So what I mean get inference for free is inference, if you remember, the way that we use these models is we have a hypothesis. So you're going to learn some parameters in a minute. You get an estimate. And now you can do inference to say how likely...","zh":"我们当时也有这个，但人们并没有广泛使用它。你有自动微分。你可以编写任何前向代码，你就能得到它。但在这里，你实际上可以检查它是否具有你期望的统计特性。非常好的问题。太棒了。请。你所说的免费获得推断是什么意思？是的。所以，我所说的免费获得推断是指，如果你还记得，我们使用这些模型的方式是，我们有一个假设。你将在一会儿学习一些参数。你将得到一个估计值。现在你可以进行推断，以说明这个数据点有多可能……","start":1539.74,"end":1567.84},{"id":63,"text":"is this data point so remember we did these maximum likelihood things that inference was to do the likelihood to say how likely this point is now all of them fall into the same category and we'll see when we go through the generalized linear models how this happens you're going to give me data i'm going to take that data i'm going to put it through my model that model is going to give me an estimate either a vector or a point say it's a point for the moment and then now i'm going to figure out how likely it is by the error profile that i have just as we did in the last time this error profile we have only used at learning","zh":"是这个数据点。还记得我们做过最大似然的事情，推断就是计算似然值，以说明这个点有多可能。现在所有这些都属于同一类别，当我们通过广义线性模型进行讲解时，你会看到这一点。你将给我一些数据，我将获取这些数
