ure that you go through is going to be identical. So all the things that you saw for least squares and logistic regression, they all basically carry over to this entire large class of models. It's a very rich class of models. So we'll see some of the examples. And basically, the trick is we're going to be able to show that all of these models can be written in this one kind of odd-looking form. And when we write them in that odd-looking form, then all these problems come for free."},{"id":4,"text":"Inference on them that is computing like the mean, computing the variance comes for free, and also that we can compute them exactly in the same stochastic gradient descent style way that we've been computing all the rest of everything else that's here, or we could do gradient descent if we wanted. So that will be this family of generalized linear models, and then we're going to talk about the most important"},{"id":5,"text":"probably class of them in terms of use right now, which is softmax. And softmax is how you pick not just between two classes, like we were doing yes or no in logistic regression, cat or dog. It's how you pick against, say, for example, every single word or actually token that could be generated. So every time one of those AI models runs, the last step that it does is it picks among all the words in its vocabularies, or what are called tokens in its vocabularies, which one is the most likely token to generate next. And it does that with a..."},{"id":6,"text":"Also underneath the covers, this bit here that we're doing of the multi-class classification, it also shows up in a technique that you won't see for a while, which is something called attention. And attention is underneath the transformer architecture, which is arguably the workhorse of modern AI. So there's some really fundamental building blocks that have carried the field for quite a while. So hopefully this is a clean enough overview. You kind of understand where we're going and why we're doing it."},{"id":7,"text":"Let's get into some details. Okay, so this is the whole show. Let me see if this thing works. I want to try this out."}],"notes":["本段介绍了课程的基本信息，包括课程名称和主题，强调指数族在统计学中的重要性，以及它如何帮助将各种数据类型转化为学习模型。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.14,"end":183.23,"asr_flags":[],"raw_segments":[{"start":5.14,"text":"Good afternoon and welcome to 229 lecture 4. Today we're going to talk about the exponential family and this is an idea that will allow us to generalize a lot of the linear models and things that we've seen to more complicated distributions."},{"start":21.55,"text":"i may have given you some some candy please take some candy no trash in nvidia because then i get in trouble um i don't actually know what they can do to me but i prefer not to test it like all things being equal so please enjoy some candy thanks for coming to class we really appreciate it all right so we're going to talk about the exponential family as i mentioned it's going to have a couple of sections"},{"start":42.52,"text":"So first, we're going to talk about this exponential family. And it's really, as I said, it's kind of the cornerstone of just a ton of statistics, so a ton of different models. And the way I kind of want you to think about it is, if you have a data type that's out there in the world, we'll see regression classification, we'll see count data, we'll see all kinds of stuff. This gives you a reliable way of going from a distribution over that information."},{"start":68.15,"text":"to a learned model. And that procedure that you go through is going to be identical. So all the things that you saw for least squares and logistic regression, they all basically carry off to this entire large class of models. It's a very rich class of models. So we'll see some of the examples. And basically, the trick is we're going to be able to show that all of these models can be written in this one kind of odd-looking form. And when we write them in that odd-looki idea. I probably won't use it again. But in any case, so this functional form here, this equation basically says I have the probability here over y given eta, which is going to be some set of parameters, eta that we'll talk about in a second. And basically, it says it has this prescribed functional form. It means that this"},{"id":9,"text":"If this probability distribution has this special form, then as I said, inference and learning come for free. Now, they don't really come for free, but they come for free for you. You already paid the cost. You learned how to do gradient descent, stochastic gradient descent. It will have almost the exact form of everything we've done for the last two classes, but it'll be kind of more general."},{"id":10,"text":"Now, here in terms of types, you should make sure all of the types work out. The parameter, so this character here, ty, has to have the same dimension as eta. So somehow, the probability distribution passes through this function t, which we'll talk about in a second, and it has the same number of parameters. So for every free parameter in the distribution, you're going to introduce this eta."},{"id":11,"text":"And this term b here, the factorization says it's a scalar that only depends on y. Now, I haven't told you about this last one. I'm going to walk through it again. So if you don't get it, don't worry. Is this a of eta, this character is actually quite important. So it looks like it's just kind of this weird normalization. But as we'll see, almost all of the action is going to go on in here, a of eta, once we set up all the rest. And it's going to be called the log partition function."},{"id":12,"text":"OK, so I'm going to highlight those names. So here they are. OK, so let's go through them. So ty, again, is called the sufficient statistic. Think about this as what you're measuring about the quantity you care about. Maybe it's the mean. Maybe it's a particular value, variance, something like this that's measured there. For almost all of our examples today, t is going to be a very special function. It's going to be the identity. We don't need it. It's just a nice, convenient thing to have."},{"id":13,"text":"By is called the base measure. And the important thing is it doesn't depend on this parameter eta. It is just some kind of normalization that's there."},{"id":14,"text":"And then this character is the log partition function. It doesn't depend on y, but it's going to basically be this normalization constant. And the reason that normalization is so important is, implicitly, what's it going to do? Because the probability distribution adds up to 1, you're going to have some term that adds up all of what I would call the possible worlds, all the different values for y and kind of sums or integrates over all of them. That is going to be captured here. That's why you have this minus sign, minus"}],"notes":["本段主要讲解指数族分布的结构，其中提到概率分布具有特定形式时，推断和学习可以简化。虽然讲者提到这些方法并不真正免费，但它们可以利用已有的梯度下降技术，使学习过程更加通用。","讲者强调了参数类型的一致性，即ty（充分统计量）的维度必须与eta（自然参数）相同。这表明分布的参数化方式与函数t的结构密切相关，且每个自由参数都会对应一个eta。","讲者提到b项是一个仅依赖于y的标量，而a(eta)项是关键的归一化因子，称为对数分区函数。这部分内容为后续讨论指数族分布的归一化和概率计算奠定了基础。","讲者指出ty（充分统计量）是衡量感兴趣量的重要指标，如均值、方差等。在大多数例子中，t函数是恒等函数，这简化了模型的构建。","讲者提到base measure（基础测度）不依赖于eta，仅作为归一化的一部分存在。这表明基础测度在指数族分布中起到辅助作用，不直接影响分布的形状。","讲者强调了对数分区函数的重要性，它作为归一化常数，确保概率分布的总和为1。归一化过程涉及对所有可能的y值进行求和或积分，这在概率建模中至关重要。"],"formulas":[],"uncertainties":["a of eta"],"diagram":"none","start":183.79,"end":337.91,"asr_flags":[],"raw_segments":[{"start":183.79,"text":"Ooh, that's so fancy. Look at that. I just learned it did that like 10 minutes ago. So apologies for doing it. I don't think it's such a great idea. I probably won't use it again. But in any case, so this functional form here, this equation basically says I have the probability here over y given eta, which is going to be some set of parameters, eta that we'll talk about in a second. And basically, it says it has this prescribed functional form. It means that this"},{"start":209.87,"text":"If this probability distribution has this special form, then as I said, inference and learning come for free. Now, they don't really come for free, but they come for free for you. You already paid the cost. You learned how to do gradient descent, stochastic gradient descent. It will have almost the exact form of everything we've done for the last two classes, but it'll be kind of more general."},{"start":230.01,"text":"Now, here in terms of types, you should make sure all of the types work out. The parameter, so this character here, ty, has to have the same dimension as eta. So somehow, the probability distribution passes through this function t, which we'll talk about in a second, and it has the same number of parameters. So for every free parameter in the distribution, you're going to introduce this eta."},{"start":253.39,"text":"And this term b here, the factorization says it's a scalar that only depends on y. Now, I haven't told you about this last one. I'm going to walk through it again. So if you don't get it, don't worry. Is this a of eta, this character is actually quite important. So it looks like it's just kind of this weird normalization. But as we'll see, almost all of the action is going to go on in here, a of eta, once we set up all the rest. And it's going to be called the log partition function."},{"start":276.39,"text":"OK, so I'm going to highlight those names. So here they are. OK, so let's go through them. So ty, again, is called the sufficient statistic. Think about this as what you're measuring about the quantity you care about. Maybe it's the mean. Maybe it's a particular value, variance, something like this that's measured there. For almost all of our examples today, t is going to be a very special function. It's going to be the identity. We don't need it. It's just a nice, convenient thing to have."},{"start":301.94,"text":"By is called the base measure. And the important thing is it doesn't depend on this parameter eta. It is just some kind of normalization that's there."},{"start":311.91,"text":"And then this character is the log partition function. It doesn't depend on y, but it's going to basically be this normalization constant. And the reason that normalization is so important is, implicitly, what's it going to do? Because the probability distribution adds up to 1, you're going to have some term that adds up all of what I would call the possible worlds, all the different values for y and kind of sums or integrates over all of them. That is going to be captured here. That's why you have this minus sign, minus"}],"speech_gaps":[],"frame":"../frames/v046/002.webp","frame_time":195.79},{"title":"指数族与广义线性模型的引入","segments":[{"id":15,"text":"a n okay and so we're going to see examples of it but basically you should think about it it's kind of got to be a sum or an integral over all the possible ways that y could be realized and why is that the important thing to divide by well because we want it to equal one right we're trying to normalize it but because of that normalization this character is going to have a bunch of interesting mathematical properties okay so this is again just kind of foreshadowing the story to try and give you some intuition about why we care about this form and we're going to talk about it and you'll see it through examples if not if things aren't clear right now"},{"id":16,"text":"All right. All right. Now, this is a longer version of what I was just saying. So if this y were discrete, if I sum over p of y, I know that it has to be equal to 1. It's a probability distribution. Or it's a PDF, and I'm going to normalize it to 1. Here, in particular, that's what this implies. That's what's going on here. And so this says a is going to be this log partition function."},{"id":17,"text":"This character right there. Now, interestingly, as I said, why it's so interesting is there's a log in front of it. That's actually not super interesting to me. But what's interesting is this part here, this sum, it captures, as I was saying, all the possible worlds, all the Ys that I could possibly sum up so that I normalize and get a 1. And so we're going to operate on that log partition function quite a bit. And if you ever do any statistical physics, I don't know why you would, but log partition functions show up everywhere. Sound good? Clear enough. Awesome."},{"id":18,"text":"All right, so let's see an example, arguably one of the simplest examples, which is flipping a coin. So here we have some y, which is going to be heads or tails. We have 0 or 1s, and we have here a parameter phi and 1 minus phi. And remember, this notation here is the if-then kind of thing. Only one of these terms is present because it's 0 or 1. When it's 1, we get this term. This term goes to 1. When it's 0, we get the term on the right-hand side."},{"id":19,"text":"So we're going to write this in that form that we just saw on the last slide. So how do we do it? Now, when we do this, by the way, some terms will fall out when you do it that will be interesting, but we're basically rewriting the parameters, these five parameters, to get these y's, these eta's, and so on. All right, so how do we do it?"},{"id":20,"text":"Well, the first thing is we're going to take this model, which has these nice little exponents, and we're going to use a log here. You should check that the log is justified here, what that means about the parameter. It means the parameter is not strictly 0 or strictly 1, because that could be a problem. If it were strictly 1, this guy would be 0. If it were strictly 0, this would be 0. And I'd have a log of 0, which I shouldn't have. But for most values, this is a fine transformation."}],"notes":["本段介绍了指数族分布的基本概念，强调了归一化的重要性，即通过求和或积分使分布总和为1。这是指数族分布的核心特征，也是其具有丰富数学性质的基础。","讲者提到log partition function（对数分区函数）是指数族分布的重要组成部分，它在统计物理中广泛出现，这为后续讨论广义线性模型提供了理论基础。","通过抛硬币的例子，讲者展示了如何将离散变量的分布转化为指数族形式。其中，参数phi和1 - phi分别对应硬币正面和反面的概率，体现了指数族分布的结构。","讲者指出，使用对数变换时，参数不能严格为0或1，否则会导致对数为0，从而破坏分布的归一化性质。这说明了参数选择的合理性。","在转换过程中，某些项会自然消失，这反映了指数族分布的结构特性，即通过参数变换将分布形式统一为指数族形式。","讲者强调了指数族分布的灵活性和广泛适用性，特别是在统计建模和机器学习中的重要性，为后续讨论广义线性模型奠定了基础。"],"formulas":[],"uncertainties":["a n okay"],"diagram":"none","start":338.37,"end":511.15,"asr_flags":[],"math_clarifications":["公式中的 'log partition function' 表达不准确。正确的表达应为 'log partition function'，即对数分区函数，通常表示为 $ Z $，而不是直接等于 'log partition function'。因此，该公式需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":338.37,"text":"a n okay and so we're going to see examples of it but basically you should think about it it's kind of got to be a sum or an integral over all the possible ways that y could be realized and why is that the important thing to divide by well because we want it to equal one right we're trying to normalize it but because of that normalization this character is going to have a bunch of interesting mathematical properties okay so this is again just kind of foreshadowing the story to try and give you some intuition about why we care about this form and we're going to talk about it and you'll see it through examples if not if things aren't clear right now"},{"start":369.83,"text":"All right. All right. Now, this is a longer version of what I was just saying. So if this y were discrete, if I sum over p of y, I know that it has to be equal to 1. It's a probability distribution. Or it's a PDF, and I'm going to normalize it to 1. Here, in particular, that's what this implies. That's what's going on here. And so this says a is going to be this log partition function."},{"start":400.44,"text":"This character right there. Now, interestingly, as I said, why it's so interesting is there's a log in front of it. That's actually not super interesting to me. But what's interesting is this part here, this sum, it captures, as I was saying, all the possible worlds, all the Ys that I could possibly sum up so that I normalize and get a 1. And so we're going to operate on that log partition function quite a bit. And if you ever do any statistical physics, I don't know why you would, but log partition functions show up everywhere. Sound good? Clear enough. Awesome."},{"start":429.16,"text":"All right, so let's see an example, arguably one of the simplest examples, which is flipping a coin. So here we have some y, which is going to be heads or tails. We have 0 or 1s, and we have here a parameter phi and 1 minus phi. And remember, this notation here is the if-then kind of thing. Only one of these terms is present because it's 0 or 1. When it's 1, we get this term. This term goes to 1. When it's 0, we get the term on the right-hand side."},{"start":456.58,"text":"So we're going to write this in that form that we just saw on the last slide. So how do we do it? Now, when we do this, by the way, some terms will fall out when you do it that will be interesting, but we're basically rewriting the parameters, these five parameters, to get these y's, these eta's, and so on. All right, so how do we do it?"},{"start":483.72,"text":"Well, the first thing is we're going to take this model, which has these nice little exponents, and we're going to use a log here. You should check that the log is justified here, what that means about the parameter. It means the parameter is not strictly 0 or strictly 1, because that could be a problem. If it were strictly 1, this guy would be 0. If it were strictly 0, this would be 0. And I'd have a log of 0, which I shouldn't have. But for most values, this is a fine transformation."}],"speech_gaps":[],"frame":"../frames/v046/003.webp","frame_time":350.37},{"title":"指数族与广义线性模型的结构分析","segments":[{"id":21,"text":"Okay, so then I do this. This is just this term here, and this character here is just this term here with a log. Okay, now this is already great intuitively because I now have it in a nice X form. I have something that looks like more or less linear. There's some logs and other stuff, and I got to figure out kind of how to hide them and put them in the right spots."},{"id":22,"text":"And so y, as I said, I'm going to imagine y is just going to be the ty is just going to be y itself. And I'm going to start to group the other terms that are nearby. And in particular, I'm going to find all the terms that multiply by y because I only have one term here that depends on y, whereas this one doesn't. What I'm trying to emphasize here is it's not like some mysterious mathematical insight. It's just mechanical. I'm just trying to group all the terms that have y on them."},{"id":23,"text":"I group them, and it happens to be that I get this funny-looking thing, log phi 1 by phi. You may have seen this before. If you haven't, don't worry. It's the log odds. So it's a thing that statisticians may have told you about. Plus, I get this nice term here. OK. Life's good. All right. So now, in this situation, I have a couple things to correct. We have ty is equal to y. All good. We're going to see that a bunch. But we could have had a more complicated function there."},{"id":24,"text":"We have our eta is going to have this weird little form, which is nice. We'll come back to that in a second. And then we have here this thing which we want as our candidate to be A of eta. We see there's some eta here, but it's not actually obvious when we put it in this form that this is a function of eta. What do I mean? Well, if it's a function, there should be something that maps from one value to another value. So effectively, we have to figure out how to do a little bit of an inversion here. Is it clear why?"},{"id":25,"text":"There's some relationship, clearly, between eta and phi, right, from this function. But we don't know if there's some function that kind of goes this way. And we want a to be a function. So far, so good? All right. So how do we do that? Well, we do a little bit more, you know, kind of solving. We exponentiate. Oops. And then we solve for this form. Now, interestingly, that's a pretty interesting form if you look at it."},{"id":26,"text":"It's got this 1 plus e to the minus kind of form. We saw something like that in logistic regression. And that'll come back a little bit later. Okay, so life is good. So we plug it in. Yep, and indeed, we now have a form. And this is the right form where it's now only a function of eta. We've eliminated the phi, and life is good for us. Okay, so what we verified here, which is kind of a sanity test, this is not like a deep result."}],"notes":["本段主要讲解如何将指数族分布的对数形式转化为线性形式，通过分组和整理项来简化表达式。讲者强调这是一个机械的过程，而不是神秘的数学洞察。通过将项按其依赖的变量分组，可以更清晰地看到结构。","讲者提到，将变量 y 与其它项分组后，得到一个看起来像 log odds 的表达式，这是统计学中常见的概念。同时，讲者指出，通过分组可以得到一个更简洁的表达式，从而简化了问题。","在处理 eta 和 phi 的关系时，讲者指出 eta 的形式可能看起来奇怪，但这是为了将其转化为 A(eta) 的形式。讲者强调，这需要进行一些逆向操作，以确保 eta 是一个函数的输入。","通过指数化和求解，讲者展示了如何将表达式转化为仅依赖 eta 的形式，从而消除了 phi。这一步是关键，因为它确保了最终的表达式是 eta 的函数。","讲者提到，最终的表达式具有类似于逻辑回归中的形式，即 1 + e^{-x}，这表明该结构与广义线性模型密切相关。这为后续的分类问题提供了基础。","最后，讲者指出，通过这些步骤验证了模型的结构，这是一个简单的合理性测试，而不是一个深层次的数学结果。这表明模型的构建过程是直观且可操作的。"],"formulas":[{"latex":"log\\left(\\frac{\\phi}{1 - \\phi}\\right)","symbols":"对数几率（log odds）","explanation":"公式正确，表示对数几率，是逻辑回归中的基本概念，用于将概率转换为对数比值。","evidence":"I group them, and it happens to be that I get this funny-looking thing, log phi 1 by phi. You may have seen this before. If you haven't, don't worry. It's the log odds. So it's a thing that statisticians may have told you about. Plus, I get this nice term here. OK. Life's good. All right. So now, in this situation, I have a couple things to correct. We have ty is equal to y. All good. We're going to see that a bunch. But we could have had a more complicated function there."},{"latex":"1 + e^{-x}","symbols":"逻辑回归中的 S 型函数","explanation":"公式正确，表示逻辑回归中的 S 型函数，用于将线性输出转换为概率。","evidence":"There's some relationship, clearly, between eta and phi, right, from this function. But we don't know if there's some function that kind of goes this way. And we want a to be a function. So far, so good? All right. So how do we do that? Well, we do a little bit more, you know, kind of solving. We exponentiate. Oops. And then we solve for this form. Now, interestingly, that's a pretty interesting form if you look at it."}],"uncertainties":["log phi 1 by phi"],"diagram":"none","start":511.9,"end":685.6,"asr_flags":[],"math_clarifications":["公式中的符号和数学表达均符合逻辑回归的基本原理，无需进一步修正。"],"raw_segments":[{"start":511.9,"text":"Okay, so then I do this. This is just this term here, and this character here is just this term here with a log. Okay, now this is already great intuitively because I now have it in a nice X form. I have something that looks like more or less linear. There's some logs and other stuff, and I got to figure out kind of how to hide them and put them in the right spots. All right, so how am I going to do it? Well, I'm going to group the terms by what they depend on."},{"start":541.45,"text":"And so y, as I said, I'm going to imagine y is just going to be the ty is just going to be y itself. And I'm going to start to group the other terms that are nearby. And in particular, I'm going to find all the terms that multiply by y because I only have one term here that depends on y, whereas this one doesn't. What I'm trying to emphasize here is it's not like some mysterious mathematical insight. It's just mechanical. I'm just trying to group all the terms that have y on them."},{"start":567.03,"text":"I group them, and it happens to be that I get this funny-looking thing, log phi 1 by phi. You may have seen this before. If you haven't, don't worry. It's the log odds. So it's a thing that statisticians may have told you about. Plus, I get this nice term here. OK. Life's good. All right. So now, in this situation, I have a couple things to correct. We have ty is equal to y. All good. We're going to see that a bunch. But we could have had a more complicated function there."},{"start":599.06,"text":"We have our eta is going to have this weird little form, which is nice. We'll come back to that in a second. And then we have here this thing which we want as our candidate to be A of eta. We see there's some eta here, but it's not actually obvious when we put it in this form that this is a function of eta. What do I mean? Well, if it's a function, there should be something that maps from one value to another value. So effectively, we have to figure out how to do a little bit of an inversion here. Is it clear why?"},{"start":628.28,"text":"There's some relationship, clearly, between eta and phi, right, from this function. But we don't know if there's some function that kind of goes this way. And we want a to be a function. So far, so good? All right. So how do we do that? Well, we do a little bit more, you know, kind of solving. We exponentiate. Oops. And then we solve for this form. Now, interestingly, that's a pretty interesting form if you look at it."},{"start":657.48,"text":"It's got this 1 plus e to the minus kind of form. We saw something like that in logistic regression. And that'll come back a little bit later. Okay, so life is good. So we plug it in. Yep, and indeed, we now have a form. And this is the right form where it's now only a function of eta. We've eliminated the phi, and life is good for us. Okay, so what we verified here, which is kind of a sanity test, this is not like a deep result."}],"speech_gaps":[],"frame":"../frames/v046/004.webp","frame_time":523.9},{"title":"指数族、广义线性模型与分类","segments":[{"id":27,"text":"But if this didn't happen, we wouldn't think that exponential models were very valuable. But this is probably the most natural and simplest one of these distributions. And we were able to plug it in and say, yep, the Bernoulli distribution that we looked, it generalizes what we've seen before. Now, let's look at one more example."},{"id":28,"text":"So that last example looked like errors that you would get from a 0-1 kind of thing. So think about the errors, by the way. Think of these distributions. Let me go back for a second. Think about these errors as kind of... Let me go one more back. One more back. Sorry, there's a lot of slides here."},{"id":29,"text":"Think about these as kind of the errors, the P of Ys, right? These are the distribution of the errors. Remember we talked about in the linear models, what was going to happen is we would predict and then we would have an error term that came out. Sometimes when people get confused about here, they're like, hey, where's the model? Where's the data? There's no model in data for the moment. We're talking about distributions, okay? We're eventually going to get the mean parameters by estimating them from data."},{"id":30,"text":"So we could get phi or its mean from looking at a bunch of examples we've seen, just like in logistic regression, when you pick the spot and then you had some error around it. But this is handling the distributional error component of it. OK, good enough. So what's the other error we saw in the class? Well, the last time we were looking at, in last lecture, we looked at least squares."},{"id":31,"text":"And we also had these errors that we said were Gaussian. Remember, we basically had this thing that we went through where we said, look, the errors are Gaussian. We were going to do maximum likelihood, and out fell least squares. That was the story that we did in the last lecture."},{"id":32,"text":"So how is this going to work? Well, there's a square here. We're going to have to deal with that. There's a constant here. That's not going to cause us any problems. Luckily for us, there's already an x. So we feel like we're halfway home. And all of this is basically just a bunch of algebraic manipulation to put it into the right form. So what is that right form? Well, we have these y squared terms. Oops."},{"id":33,"text":"We have some groupings. And off to the races we go. So we get the y squared terms. That's going to be part of the term that goes out in front. That's the BY term. Remember, that's there. We have the term where there's a linear term here from UI. Now, this 数学表达。","evidence":"We have some groupings. And off to the races we go. So we get the y squared terms. That's going to be part of the term that goes out in front. That's the BY term. Remember, that's there. We have the term where there's a linear term here from UI. Now, this may have been the part where if you were thinking about how to do this transformation, you may have been a little bit nervous because you say, look, there's something going on here that looks like it's nonlinear, but we have to get to remember a dot product. So something that's linear in the actual parameters."},{"latex":"A\\cdot B","symbols":"A与B的点积","explanation":"保留原式，A·B 表示点积，符合数学表达。","evidence":"Okay? That is the essence of this form, right? There's a B that's separated. That can be some complicated nonlinear thing. This A, that can be some complicated nonlinear thing of eta. But the interactions between them have to be linear. That's going to be really important in the second half of this lecture when we get to generalized linear models. That's what we're going to mean. This part we're going to make into a model. Okay? Just foreshadowing what we're doing. Okay?"}],"uncertainties":["UI"],"diagram":"none","start":686.27,"end":860.82,"asr_flags":[],"math_clarifications":["所有公式均符合数学表达，未发现需要移除或修正的错误。"],"raw_segments":[{"start":686.27,"text":"But if this didn't happen, we wouldn't think that exponential models were very valuable. But this is probably the most natural and simplest one of these distributions. And we were able to plug it in and say, yep, the Bernoulli distribution that we looked, it generalizes what we've seen before. Now, let's look at one more example."},{"start":709.54,"text":"So that last example looked like errors that you would get from a 0-1 kind of thing. So think about the errors, by the way. Think of these distributions. Let me go back for a second. Think about these errors as kind of... Let me go one more back. One more back. Sorry, there's a lot of slides here."},{"start":723.93,"text":"Think about these as kind of the errors, the P of Ys, right? These are the distribution of the errors. Remember we talked about in the linear models, what was going to happen is we would predict and then we would have an error term that came out. Sometimes when people get confused about here, they're like, hey, where's the model? Where's the data? There's no model in data for the moment. We're talking about distributions, okay? We're eventually going to get the mean parameters by estimating them from data."},{"start":743.82,"text":"So we could get phi or its mean from looking at a bunch of examples we've seen, just like in logistic regression, when you pick the spot and then you had some error around it. But this is handling the distributional error component of it. OK, good enough. So what's the other error we saw in the class? Well, the last time we were looking at, in last lecture, we looked at least squares."},{"start":766.7,"text":"And we also had these errors that we said were Gaussian. Remember, we basically had this thing that we went through where we said, look, the errors are Gaussian. We were going to do maximum likelihood, and out fell least squares. That was the story that we did in the last lecture."},{"start":780.97,"text":"So let's look and see if this one also gets in our framework. And it's just validating that, yeah, this should also be in our variance. So how is this going to work? Well, there's a square here. We're going to have to deal with that. There's a constant here. That's not going to cause us any problems. Luckily for us, there's already an x. So we feel like we're halfway home. And all of this is basically just a bunch of algebraic manipulation to put it into the right form. So what is that right form? Well, we have these y squared terms. Oops."},{"start":810.59,"text":"We have some groupings. And off to the races we go. So we get the y squared terms. That's going to be part of the term that goes out in front. That's the BY term. Remember, that's there. We have the term where there's a linear term here from UI. Now, this may have been the part where if you were thinking about how to do this transformation, you may have been a little bit nervous because you say, look, there's something going on here that looks like it's nonlinear, but we have to get to remember a dot product. So something that's linear in the actual parameters."},{"start":838.84,"text":"Okay? That is the essence of this form, right? There's a B that's separated. That can be some complicated nonlinear thing. This A, that can be some complicated nonlinear thing of eta. But the interactions between them have to be linear. That's going to be really important in the second half of this lecture when we get to generalized linear models. That's what we're going to mean. This part we're going to make into a model. Okay? Just foreshadowing what we're doing. Okay?"}],"speech_gaps":[],"frame":"../frames/v046/005.webp","frame_time":698.27},{"title":"指数族、广义线性模型与分类","segments":[{"id":35,"text":"Everything that happened here is manipulation. This is just exactly what you would think. A gets that, all the rest. Now, these terms start to look like, hopefully, things you've seen, like this natural parameter here, mu, is exactly eta. So that's wonderful. ty is y. And then we have this partition function, this normalization. So far, so good? All right. So the takeaway from this is the two distributions you've seen so far in the course, the error distributions, both fit into this form."},{"id":36,"text":"There's one other thing that's a little bit weird about this, and this turns out to be when we talked about getting things for free from this, which is that if you noticed, if we took the derivatives of a n, and actually if you compute the second derivatives, we have this interesting correspondence for the Gaussian where it was exactly the mean. So we take a differential of this character, and it's exactly the mean."},{"id":37,"text":"And so the thing is, you could think that that's just like an odd coincidence. It's some piece. But it's actually canonical for this class. This is what happens for all linear models. So let's see why this is true in general. So the point is, if you look at this function and you take the differential,"},{"id":38,"text":"what's going to happen? So when you differentiate the log, what happens? This term goes down underneath, right? That's the differential log. If I look inside this term here, I get a bunch of the original term, that's this character here, times ty. Well, that's exactly the expected value of ty, right? This is the normalization piece. As I said, this was all the different possible worlds, if you like, if it were discrete. And then it's times that ty. This makes this an expectation."},{"id":39,"text":"And so basically what this says is when I was saying before that the action is embedded in this log partition function, this is what I mean. It has all the outcomes, but if I differentiate it, I get exactly the expectation. Clear enough what that means? So for all of these characters, I can basically do exactly this transformation. And this is going to be, there's nothing in here that used a property of the Gaussian or Bernoulli noise or anything else. Everything else that we say fits the functional form."},{"id":40,"text":"immediately satisfies this property. So one way to think about this and why we tell you is this compresses a bunch of different ideas that you could have to do independently, different distributions, different error modeling, all the rest. Now, once you know this piece, you can basically say if they fit into this class, which is extremely broad, all of a sudden you know how to build the model, you know how to do expectations, and in a second we'll see that you know how to learn as well. Because if you know how to do inference, you also know how to do parameter estimation."}],"notes":["本段讲解了指数族分布中自然参数与期望值之间的关系，指出在高斯分布中，对数分区函数的导数正好对应于均值。这表明了指数族分布的一个重要性质，即通过对数分区函数的导数可以得到期望值，这一性质适用于所有线性模型。","讲者提到，这一性质并非偶然，而是指数族分布的普遍特性。通过分析对数分区函数的导数，可以得到期望值，这为后续的模型构建和参数估计提供了理论基础。","讲者进一步说明，这一性质适用于所有符合指数族分布形式的模型，而不仅仅是高斯分布或伯努利分布。这意味着，只要模型符合指数族的结构，就可以利用这一性质进行建模和推断。","讲者指出，这一性质使得不同分布和误差建模方法可以被统一处理，从而简化了模型构建和参数估计的过程。这表明了指数族分布的广泛适用性和统一性。","讲者强调，理解这一性质对于学习如何构建模型、进行期望计算以及参数估计至关重要。因为如果能够进行推断，就可以进行参数估计，从而实现模型的学习。","最后，讲者提到，这一性质使得模型构建和参数估计变得简单，因为只要模型符合指数族的结构，就可以直接应用这一性质进行建模和学习。"],"formulas":[],"uncertainties":["a n"],"diagram":"none","start":861.66,"end":1025.12,"asr_flags":[],"raw_segments":[{"start":861.66,"text":"Everything that happened here is manipulation. This is just exactly what you would think. A gets that, all the rest. Now, these terms start to look like, hopefully, things you've seen, like this natural parameter here, mu, is exactly eta. So that's wonderful. ty is y. And then we have this partition function, this normalization. So far, so good? All right. So the takeaway from this is the two distributions you've seen so far in the course, the error distributions, both fit into this form."},{"start":892.68,"text":"There's one other thing that's a little bit weird about this, and this turns out to be when we talked about getting things for free from this, which is that if you noticed, if we took the derivatives of a n, and actually if you compute the second derivatives, we have this interesting correspondence for the Gaussian where it was exactly the mean. So we take a differential of this character, and it's exactly the mean."},{"start":919.08,"text":"And so the thing is, you could think that that's just like an odd coincidence. It's some piece. But it's actually canonical for this class. This is what happens for all linear models. So let's see why this is true in general. So the point is, if you look at this function and you take the differential,"},{"start":938.91,"text":"what's going to happen? So when you differentiate the log, what happens? This term goes down underneath, right? That's the differential log. If I look inside this term here, I get a bunch of the original term, that's this character here, times ty. Well, that's exactly the expected value of ty, right? This is the normalization piece. As I said, this was all the different possible worlds, if you like, if it were discrete. And then it's times that ty. This makes this an expectation."},{"start":969.63,"text":"And so basically what this says is when I was saying before that the action is embedded in this log partition function, this is what I mean. It has all the outcomes, but if I differentiate it, I get exactly the expectation. Clear enough what that means? So for all of these characters, I can basically do exactly this transformation. And this is going to be, there's nothing in here that used a property of the Gaussian or Bernoulli noise or anything else. Everything else that we say fits the functional form."},{"start":998.32,"text":"immediately satisfies this property. So one way to think about this and why we tell you is this compresses a bunch of different ideas that you could have to do independently, different distributions, different error modeling, all the rest. Now, once you know this piece, you can basically say if they fit into this class, which is extremely broad, all of a sudden you know how to build the model, you know how to do expectations, and in a second we'll see that you know how to learn as well. Because if you know how to do inference, you also know how to do parameter estimation."}],"speech_gaps":[],"frame":"../frames/v046/006.webp","frame_time":873.66},{"title":"指数族、广义线性模型与分类","segments":[{"id":41,"text":"All right. You can check. I won't. It's the same calculation. How does this variance work? We take another derivative here. You get the standard things. You get a square here. Cancels out. All the rest. And you're going to get exactly the variance. OK. Cool. Any questions about this, including motivation? Why are you telling me this? That's a fair question. Please. Equals. Exactly right."},{"id":42,"text":"Exactly right. This is the normalization concept. You got it exactly right. The question is, why is this actually the expectation? And this is exactly that normalization constant when you put it back up. Wonderful question. Other questions? Awesome. Great work."},{"id":43,"text":"OK, this you don't need to know, but I just want to put it in there. These basically have to do with, so by show of hands, who knows what a moment generating function is? Should be many people. Oh, not as many as I would have thought. OK, doesn't matter. You don't need to know this anyway. If you did know what a moment generating function is, this is not a moment generating function. So that's, I guess, not super useful for those of you who don't know what it is. But basically, what you're looking at here is something called a cumulant generating function, which sometimes people get confused by because the first couple of terms match, but the higher terms don't match. So the higher moments and the higher"},{"id":44,"text":"higher cumulants are different. Cumulants are more painful to compute. Like at higher things, you have to use fancy techniques for them. But the lower order terms, they align. So they're the same. But the higher order terms are just..."},{"id":45,"text":"fancier to compute because they're derivatives of this partition function. But they're a lot mathematically nicer. So you can prove nice things with cumulants. So sometimes you'll see people in proofs prefer cumulants to moment generating functions. Does not really matter for you. But just in case, because people have gotten confused about, aren't these just moment generating functions? No, they are not moment generating functions. The first couple match, first three match. After that, they don't. OK."},{"id":46,"text":"So the exponential family, though, is this story in disguise in some way. So if you really care about the proofs and the rest, like this is the thing that's going on. And so when I say it's in disguise, what does that mean? This is just intuition. So please don't try and do this. Basically, all that's going on is it says, if your distribution is such that you can match it with a couple of these low cumulants."},{"id":47,"text":"then you can stick it into this exponential family if it's defined by these locumens. And it turns out most distributions are because it captures the mean and the variance and so on. Okay. All right. One other thing that's extremely nice. So I was asked this question a couple lectures ago. What's convex? And I said, well, the first couple lectures. It's because this function is convex. And that's the function. If you remember, it's the 1 half by eta squared in the Gaussian. That's what we're actually going to do. Okay?"}],"notes":["本段主要讨论了方差的计算过程，强调了通过求导得到方差的步骤，并指出在计算过程中平方项会抵消，从而得到方差。讲者还提到，如果对这部分内容有疑问，可以提问，但同时也指出这是为了帮助理解而进行的解释。","讲者进一步解释了归一化常数的概念，并指出归一化常数在计算期望值时的重要性。他提到，归一化常数是将分布重新归一化时所用的常数，这有助于理解概率分布的结构。","本段介绍了矩生成函数（moment generating function）和累积生成函数（cumulant generating function）的区别。讲者指出，虽然前几项可能匹配，但高阶项并不相同，因此累积生成函数在计算高阶矩时更为复杂。","讲者强调了累积生成函数在数学上的优势，特别是在证明某些性质时更为方便。他提到，虽然矩生成函数在某些情况下可能更直观，但累积生成函数在处理高阶矩时更为数学化。","讲者指出，指数族分布实际上是通过累积生成函数的结构来隐藏的。他提到，如果一个分布可以通过匹配低阶累积矩来定义，那么它就可以被归入指数族。这表明指数族能够捕捉分布的均值和方差等基本统计量。","最后，讲者提到凸函数的概念，并指出在高斯分布中，凸函数的形式是1/2乘以eta的平方。这表明凸性在某些分布中具有重要的数学意义。"],"formulas":[{"latex":"\\text{Var}(X) = \\mathbb{E}[X^2] - (\\mathbb{E}[X])^2","symbols":"方差等于二阶矩减去一阶矩的平方","explanation":"公式正确，保持原样。","evidence":"All right. You can check. I won't. It's the same calculation. How does this variance work? We take another derivative here. You get the standard things. You get a square here. Cancels out. All the rest. And you're going to get exactly the variance. OK. Cool. Any questions about this, including motivation? Why are you telling me this? That's a fair question. Please. Equals . Exactly right."}],"uncertainties":["locumens"],"diagram":"none","start":1028.58,"end":1196.8,"asr_flags":[],"math_clarifications":["公式0中的符号'Var(X)'应使用标准数学符号'\\text{Var}(X)'，并确保所有期望符号使用'\\mathbb{E}'。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1028.58,"text":"All right. You can check. I won't. It's the same calculation. How does this variance work? We take another derivative here. You get the standard things. You get a square here. Cancels out. All the rest. And you're going to get exactly the variance. OK. Cool. Any questions about this, including motivation? Why are you telling me this? That's a fair question. Please. Equals . Exactly right."},{"start":1057.46,"text":"Exactly right. This is the normalization concept. You got it exactly right. The question is, why is this actually the expectation? And this is exactly that normalization constant when you put it back up. Wonderful question. Other questions? Awesome. Great work."},{"start":1076.13,"text":"OK, this you don't need to know, but I just want to put it in there. These basically have to do with, so by show of hands, who knows what a moment generating function is? Should be many people. Oh, not as many as I would have thought. OK, doesn't matter. You don't need to know this anyway. If you did know what a moment generating function is, this is not a moment generating function. So that's, I guess, not super useful for those of you who don't know what it is. But basically, what you're looking at here is something called a cumulant generating function, which sometimes people get confused by because the first couple of terms match, but the higher terms don't match. So the higher moments and the higher"},{"start":1105.23,"text":"higher cumulants are different. Cumulants are more painful to compute. Like at higher things, you have to use fancy techniques for them. But the lower order terms, they align. So they're the same. But the higher order terms are just..."},{"start":1117.89,"text":"fancier to compute because they're derivatives of this partition function. But they're a lot mathematically nicer. So you can prove nice things with cumulants. So sometimes you'll see people in proofs prefer cumulants to moment generating functions. Does not really matter for you. But just in case, because people have gotten confused about, aren't these just moment generating functions? No, they are not moment generating functions. The first couple match, first three match. After that, they don't. OK."},{"start":1142.8,"text":"So the exponential family, though, is this story in disguise in some way. So if you really care about the proofs and the rest, like this is the thing that's going on. And so when I say it's in disguise, what does that mean? This is just intuition. So please don't try and do this. Basically, all that's going on is it says, if your distribution is such that you can match it with a couple of these low cumulants."},{"start":1165.68,"text":"then you can stick it into this exponential family if it's defined by these locumens. And it turns out most distributions are because it captures the mean and the variance and so on. Okay. All right. One other thing that's extremely nice. So I was asked this question a couple lectures ago. What's convex? And I said, well, the first couple lectures. It's because this function is convex. And that's the function. If you remember, it's the 1 half by eta squared in the Gaussian. That's what we're actually going to do. Okay?"}],"speech_gaps":[],"frame":"../frames/v046/007.webp","frame_time":1040.58},{"title":"指数族、广义线性模型与分类","segments":[{"id":48,"text":"Awesome. Why is it convex, by the way, just in case you don't see? It's because you have the expected value as the first derivative. The second derivative is a variance or a covariance with positive semi-definite. Good enough."},{"id":49,"text":"All right. So why does that matter, by the way? Well, if it's convex, that means that as you do the learning, you're going to have all the nice things. You can recover the parameters. So if you remember your convex analysis or you remember the basics of that, the fact that it's convex means you can get back the etas and the thetas and all the rest of the things that you wanted. And you'll be able to do it with gradient descent. It's going to be a nice bowl-shaped function, as we talked about. Awesome. OK."},{"id":50,"text":"This would just have been 20 minutes of your life that was devoted to a bunch of symbol pushing that said, hey, we can take the two things you already knew and put them in another weird form and make it kind of convoluted to compute their expectations, which were really easy in the old way, but kind of hard. So why would we go down this road? The reason we went down this road is you can verify all of these distributions, some of which you may have heard of. Actually, they're all exponential family."},{"id":51,"text":"And so this means all of them have different things. You have binary, you get Bernoulli. You have multiple classes, we'll get multinomial. That's the one we're going to do softmax at the end. Real values, you can get to Gaussians. If you have discrete counts, you don't know how many, Poisson. If you have these positive exponential decays, you have gamma and exponential. If you even want to have distributions over distributions, Brichlet. So this window..."},{"id":52,"text":"Maybe those are more heavy mathematical structures, but they can be all crammed into the same kind of thing. So once you think, as I was telling you before, once you think in terms of errors, then the rest of the model, at least for generalized linear models, kind of falls out. Powerful idea in machine learning. Okay."},{"id":53,"text":"All right, so in this course, we're not going to do more fancy stuff. We'll use ty equals y. We're going to do simple stuff, but I wanted to show it to you because if you see it in a textbook, like if you were to pull up a generalized linear model textbook, and by the way, there are big textbooks about generalized linear models. It's not like one page. If you look at that textbook, they will use t in fancier ways. OK."},{"id":54,"text":"All right, so hopefully this message landed with you and you get the conceptual piece. But if not, or even if it did, please go ahead and ask me a question. I'm happy to talk to you about it. Why am I telling you this and how does it fit in? Please."},{"id":55,"text":"Awesome. Yeah. So the question is, why does this have to do with thinking in terms of errors? So what's going on in the exponential family is we're going to see in a minute how we tie this to an actual model. That's going to be what's called the generalized linear model. That model is going to take data, learn some parameters, and fit things. What we saw in the last two lectures are we had effectively the same procedure once we had the model and the data, but we changed the loss function."}],"notes":["本段主要讲解指数族分布的凸性及其重要性。凸性意味着在学习过程中可以利用梯度下降等优化方法，因为凸函数具有唯一的全局最小值，且可以恢复参数。凸性还意味着函数形状像一个碗，便于优化。","讲者提到，虽然指数族分布的推导过程可能看起来复杂，但其核心思想是将已知的分布形式转换为统一的指数族形式，从而便于计算期望值。这种形式虽然计算复杂，但能涵盖多种分布，如伯努利、多项式、高斯、泊松、伽马、指数和狄利克雷分布。","指数族分布的统一形式使得广义线性模型（GLM）的构建变得可能。通过将数据与模型参数联系起来，可以构建出适用于不同任务的模型，如分类和回归。","讲者强调，广义线性模型的核心思想是将误差与模型参数联系起来，从而构建出模型。这种思想在机器学习中非常强大，因为它允许我们使用不同的损失函数来适应不同的任务。","讲者提到，虽然本课程不会深入复杂的模型，但会展示广义线性模型的基本思想，因为这些思想在教科书中被广泛讨论，并且有专门的书籍进行深入讲解。","最后，讲者鼓励学生提问，以进一步理解指数族分布与广义线性模型之间的关系，以及如何将这些概念应用到实际问题中。"],"formulas":[],"uncertainties":["Brichlet"],"diagram":"none","start":1197.91,"end":1376.75,"asr_flags":[],"raw_segments":[{"start":1197.91,"text":"Awesome. Why is it convex, by the way, just in case you don't see? It's because you have the expected value as the first derivative. The second derivative is a variance or a covariance with positive semi-definite. Good enough."},{"start":1214.15,"text":"All right. So why does that matter, by the way? Well, if it's convex, that means that as you do the learning, you're going to have all the nice things. You can recover the parameters. So if you remember your convex analysis or you remember the basics of that, the fact that it's convex means you can get back the etas and the thetas and all the rest of the things that you wanted. And you'll be able to do it with gradient descent. It's going to be a nice bowl-shaped function, as we talked about. Awesome. OK."},{"start":1242.26,"text":"This would just have been 20 minutes of your life that was devoted to a bunch of symbol pushing that said, hey, we can take the two things you already knew and put them in another weird form and make it kind of convoluted to compute their expectations, which were really easy in the old way, but kind of hard. So why would we go down this road? The reason we went down this road is you can verify all of these distributions, some of which you may have heard of. Actually, they're all exponential family."},{"start":1269.44,"text":"And so this means all of them have different things. You have binary, you get Bernoulli. You have multiple classes, we'll get multinomial. That's the one we're going to do softmax at the end. Real values, you can get to Gaussians. If you have discrete counts, you don't know how many, Poisson. If you have these positive exponential decays, you have gamma and exponential. If you even want to have distributions over distributions, Brichlet. So this window..."},{"start":1294.42,"text":"Maybe those are more heavy mathematical structures, but they can be all crammed into the same kind of thing. So once you think, as I was telling you before, once you think in terms of errors, then the rest of the model, at least for generalized linear models, kind of falls out. Powerful idea in machine learning. Okay."},{"start":1313.34,"text":"All right, so in this course, we're not going to do more fancy stuff. We'll use ty equals y. We're going to do simple stuff, but I wanted to show it to you because if you see it in a textbook, like if you were to pull up a generalized linear model textbook, and by the way, there are big textbooks about generalized linear models. It's not like one page. If you look at that textbook, they will use t in fancier ways. OK."},{"start":1333.43,"text":"All right, so hopefully this message landed with you and you get the conceptual piece. But if not, or even if it did, please go ahead and ask me a question. I'm happy to talk to you about it. Why am I telling you this and how does it fit in? Please."},{"start":1349.01,"text":"Awesome. Yeah. So the question is, why does this have to do with thinking in terms of errors? So what's going on in the exponential family is we're going to see in a minute how we tie this to an actual model. That's going to be what's called the generalized linear model. That model is going to take data, learn some parameters, and fit things. What we saw in the last two lectures are we had effectively the same procedure once we had the model and the data, but we changed the loss function."}],"speech_gaps":[],"frame":"../frames/v046/008.webp","frame_time":1209.91},{"title":"指数族、广义线性模型与分类","segments":[{"id":56,"text":"And when we changed the loss function, what was significant about it was we cared a lot about the type. We did one thing for discrete Bernoulli variables, which we now know, which were the 0, 1s, and another thing for the continuous. Here what we're showing is that part where we say from our linear prediction, what kind of errors do we expect? Are we not modeling?"},{"id":57,"text":"that piece is now all handled by the exponential family. So any kind of error you would want to model. When I say think in terms of errors, this is one of the more, I think, interesting things about the way we think in statistics in this is there's a true model that's generating the data, and then there's some error. And when you think about that error, as we talked about, it's what's not being captured by the underlying model. It's measurement error. It's that the counts are off. It's that all the wiggles are in there, whatever it is. There just may be some unmodeled noise in the system."},{"id":58,"text":"Once you start thinking like that, that's one of the key pathways to actually figuring out what models you want to use. And it turns out for a fundamental reason, you can create really, really big models. Even these massive neural nets of today, there is a thing called the neural tangent kernel, which is like a big linear expansion, if you like, of what it's actually computing under the covers. So this is really the foundational piece to me of a lot of the machine learning stuff. Great, wonderful question. Thank you for letting me go on that monologue. Please."},{"id":59,"text":"In practice, how does it work? Is it like almost everything that we do is something with an exponential value? Or do we use any other thing? Yeah, this is a great question. So the question is, in practice, how does this end up working? So first, in practice, you probably are not going to be deriving all these things from first principles. You're probably going to be using a framework. And inside that framework, there will be some implementation of a particular softmax that you're going to use. And so we're talking about what's underneath the hood. One of the things that's been fantastic, just as an aside, historically,"},{"id":60,"text":"is when I entered the field, there was no PyTorch or TensorFlow or anything else. And so you had to go and write your own frameworks to do almost everything. You would write C code to do this and check your derivatives. It was a primitive and ancient time. Now you have these incredible libraries that string things together. But if you don't understand the pieces, there was a bug for a model that was from my students. It was a semi-famous model in the literature. And it turned out that a reimplementation of it had an initialization bug."},{"id":61,"text":"And they initialized the weights incorrectly. And that initialization was something that was actually written in the paper but didn't come over. Diagnosing that required people to understand exactly what the expected value was of how you moved forward through these models. And so this is more a tool to understand it than it would be exactly how you would do it. Now, in the ancient times, when you had to write down your derivatives, what you were really happy about this is you could write your derivative code and all the rest that was going to be there, and you could kind of box it up."}],"notes":["本段讨论了损失函数变化时，对误差类型的重视。对于离散的伯努利变量和连续变量，分别采取了不同的处理方式。这表明在构建模型时，需要根据数据类型选择合适的误差模型。","讲者指出，指数族分布可以统一处理各种误差类型，包括测量误差、计数误差等。这表明在统计建模中，误差被视为未被基础模型捕捉的部分，是系统中未建模的噪声。","讲者提到，理解误差模型是选择合适模型的关键路径。这表明模型选择与对误差的理解密切相关，而指数族分布为这一过程提供了理论基础。","讲者提到，现代机器学习中使用了如PyTorch和TensorFlow等库，但理解底层实现仍然是重要的。这表明即使有现成工具，对模型内部机制的理解仍然是必要的。","讲者提到，学生在实现模型时可能遇到初始化错误，这需要对模型的期望值有深入理解。这表明模型的正确实现依赖于对模型结构和参数的准确理解。","讲者提到，在早期没有现成库时，需要手动编写代码并检查导数。这表明对模型的数学基础和实现细节的理解是构建可靠模型的关键。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1376.91,"end":1538.04,"asr_flags":[],"raw_segments":[{"start":1376.91,"text":"And when we changed the loss function, what was significant about it was we cared a lot about the type. We did one thing for discrete Bernoulli variables, which we now know, which were the 0, 1s, and another thing for the continuous. Here what we're showing is that part where we say from our linear prediction, what kind of errors do we expect? Are we not modeling?"},{"start":1396.21,"text":"that piece is now all handled by the exponential family. So any kind of error you would want to model. When I say think in terms of errors, this is one of the more, I think, interesting things about the way we think in statistics in this is there's a true model that's generating the data, and then there's some error. And when you think about that error, as we talked about, it's what's not being captured by the underlying model. It's measurement error. It's that the counts are off. It's that all the wiggles are in there, whatever it is. There just may be some unmodeled noise in the system."},{"start":1424.91,"text":"Once you start thinking like that, that's one of the key pathways to actually figuring out what models you want to use. And it turns out for a fundamental reason, you can create really, really big models. Even these massive neural nets of today, there is a thing called the neural tangent kernel, which is like a big linear expansion, if you like, of what it's actually computing under the covers. So this is really the foundational piece to me of a lot of the machine learning stuff. Great, wonderful question. Thank you for letting me go on that monologue. Please."},{"start":1452.1,"text":"In practice, how does it work? Is it like almost everything that we do is something with an exponential value? Or do we use any other thing? Yeah, this is a great question. So the question is, in practice, how does this end up working? So first, in practice, you probably are not going to be deriving all these things from first principles. You're probably going to be using a framework. And inside that framework, there will be some implementation of a particular softmax that you're going to use. And so we're talking about what's underneath the hood. One of the things that's been fantastic, just as an aside, historically,"},{"start":1481.68,"text":"is when I entered the field, there was no PyTorch or TensorFlow or anything else. And so you had to go and write your own frameworks to do almost everything. You would write C code to do this and check your derivatives. It was a primitive and ancient time. Now you have these incredible libraries that string things together. But if you don't understand the pieces, there was a bug for a model that was from my students. It was a semi-famous model in the literature. And it turned out that a reimplementation of it had an initialization bug."},{"start":1509.98,"text":"And they initialized the weights incorrectly. And that initialization was something that was actually written in the paper but didn't come over. Diagnosing that required people to understand exactly what the expected value was of how you moved forward through these models. And so this is more a tool to understand it than it would be exactly how you would do it. Now, in the ancient times, when you had to write down your derivatives, what you were really happy about this is you could write your derivative code and all the rest that was going to be there, and you could kind of box it up."}],"speech_gaps":[],"frame":"../frames/v046/009.webp","frame_time":1388.91},{"title":"指数族、广义线性模型与分类","segments":[{"id":62,"text":"We had it at the time too, but people weren't using it as widely. You have automatic differentiation. You can write whatever forward code you want and you'll get it. But here you can actually check that it has the statistical properties that you expect. Wonderful question. Awesome. Please. What do you mean get inference for free? Yeah. So what I mean get inference for free is inference, if you remember, the way that we use these models is we have a hypothesis. So you're going to learn some parameters in a minute. You get an estimate. And now you can do inference to say how likely..."},{"id":63,"text":"is this data point so remember we did these maximum likelihood things that inference was to do the likelihood to say how likely this point is now all of them fall into the same category and we'll see when we go through the generalized linear models how this happens you're going to give me data i'm going to take that data i'm going to put it through my model that model is going to give me an estimate either a vector or a point say it's a point for the moment and then now i'm going to figure out how likely it is by the error profile that i have just as we did in the last time this error profile we have only used at learning"},{"id":64,"text":"time but we can also use it when we do predictions recall that when we did logistic regression the actual prediction was what's the probability that it's in class one in the same way we'll see later when the big ai runs at the end it says what's the probability that the next word is gallery right it's going to look over all the words that it has in its dictionary and when it does inference it's going to list those probabilities because it's a multinomial it's actually a fairly straightforward operation and this is"},{"id":65,"text":"effectively unifying it. I don't want to put the causality in the wrong direction. It's not like the multinomial is easy because exponential families exist. Exponential families exist because they're capturing the fact that all these errors are actually easy and in the same model. It's more compression in your head rather than compression in code, if you like. Wonderful questions. So happy to get these. Oh, please."},{"id":66,"text":"In terms of error, you mentioned that the choice of loss function is handled by the exponential model family. What does that mean?"},{"id":67,"text":"Great question. Let's get to that when we actually go through learning, which will come in one or two slides. And if I don't answer it then, come back. But I'll give you the intuition. The intuition is because it's going to give you the inference, that's going to tell you how likely something is. And then you're going to get that product, that IID product. And when you differentiate that, you're right back into the situation because you're going to have a functional form that says, given my estimate, this is the likelihood or the loss. And it's going to follow exactly the same story we saw before, but we're going to see it in much more detail. It's a wonderful question. You're way ahead of me."},{"id":68,"text":"Awesome. All right. So this is the next slide, generalized linear models. So now we're going to tie this to actual data and modeling. We're going to move from errors to modeling. And you folks are all over this. It's phenomenal. I'm really excited. So what happens here? So the first part of the lecture, I was talking about noise models, error models. But that's not what
