mething reasonable. Ideally, it would kind of just bring us back to the set of states in the expert distribution."}],"speech_gaps":[],"frame":"../frames/v026/011.webp","frame_time":1721.08},{"title":"强化学习在机器人中的应用：正向-反向策略","segments":[{"id":133,"text":"Then we run our forward policy again, and then it would bring us back again somewhere in this pink region that is showing the distribution of states that are visited by the expert. And so the forward-backward process is the same, but we have this modified backward reward function, and we're actually going to learn this reward function.","zh":"然后我们再次运行我们的前向策略，这样它会将我们带回这个粉红色区域，该区域展示了专家访问过的状态分布。因此，前向-后向过程是相同的，但我们有一个修改后的后向奖励函数，我们实际上会学习这个奖励函数。","start":1879.64,"end":1904.59},{"id":134,"text":"And in particular, we talked about in the lecture on learning reward functions, how you can train discriminators to discriminate between good states and bad states and use states from the policy as examples of bad states.","zh":"特别是在关于学习奖励函数的课程中，我们讨论了如何训练判别器来区分好状态和坏状态，并使用策略中的状态作为坏状态的例子。","start":1905.55,"end":1924.37},{"id":135,"text":"And we can do the same exact thing here, where this reward function will be trained to distinguish states visited by the policy and states visited in the demonstrations. And then you'll be trying to, when you're training the backward policy, you'll be trying to trick this reward function into thinking that the states it's visiting are states from the expert and not from the policy. And then again, we'll discard our backward policy when we're done and deploy our forward policy.","zh":"我们也可以在这里做同样的事情，这个奖励函数将被训练以区分策略访问的状态和演示中访问的状态。然后在训练后向策略时，你将试图欺骗这个奖励函数，让它认为它访问的状态是专家的状态，而不是策略的状态。完成之后，我们仍然会丢弃后向策略，并部署前向策略。","start":1925.07,"end":1954.49},{"id":136,"text":"Cool. So assume some demonstrations, run our forward policy, backward policy, and so forth. This and forward-backward RL addresses the challenge of preventing the agent from drifting away, and it also avoids collapsing the distribution that we talked about before as well.","zh":"很好。假设有一些演示，运行我们的前向策略和后向策略等。这种前向-后向强化学习解决了防止智能体偏离的问题，同时也避免了我们之前讨论过的分布坍缩问题。","start":1958.23,"end":1976.19},{"id":137,"text":"Cool. And then the upside that I mentioned very briefly is that if you try the task from a wide set of initial states, both easier states, like states that are closer to the goal, and further states, then you could actually improve the efficiency of the entire reinforcement learning algorithm. The last thing that I'll mention is that you can actually use these demonstrations in the replay buffers as data to help train the forward policy and the reverse policy as well.","zh":"很好。我之前提到的一个好处是，如果你从一组广泛初始状态尝试任务，包括更容易的状态（如接近目标的状态）和更难的状态（如远离目标的状态），实际上可以提高整个强化学习算法的效率。最后一点是，你可以将这些演示作为数据存储在回放缓冲区中，以帮助训练前向策略和反向策略。","start":1979.06,"end":2008.62},{"id":138,"text":"So the question is, if the agent finishes the task, does the backward policy just stay there? And here the answer is no. So in the case of forward-backward RL, it would go back to the initial state, whereas in the case of this kind of middle algorithm, it'll kind of try to push the policy to a state in the expert state distribution.","zh":"问题是，如果智能体完成了任务，后向策略是否会停留在那里？答案是否定的。在前向-后向强化学习中，它会回到初始状态，而在这种中间算法的情况下，它会尝试将策略推到专家状态分布中的某个状态。","start":2009.52,"end":2031.1},{"id":139,"text":"And specifically when we're training the classifier to classify between policy states and expert states, we're using all of the states in the trajectories, all the states in the demos. And so it's going to, for example, like in this graphic, go back to somewhere over here so that the policy then learns and practices how to do the task from here rather than only practicing it from the goal state.","zh":"并且，当我们训练分类器以区分策略状态和专家状态时，我们使用了轨迹中的所有状态以及演示中的所有状态。因此，例如，在这张图中，它会回到这里，这样策略就能学习并练习如何从这里执行任务，而不是仅仅从目标状态进行练习。","start":2032.1,"end":2058.1}],"notes":["本段讨论了正向-反向强化学习（forward-backward RL）中反向策略的行为。当代理完成任务后，反向策略不会停留在终点，而是会回到初始状态，这与中间算法不同，中间算法会尝试将策略推向专家状态分布中的某个状态。这种设计有助于防止策略漂移，并避免分布坍缩的问题。","在训练分类器以区分策略状态和专家状态时，会使用轨迹中的所有状态以及演示中的所有状态。通过这种方式，分类器能够学习到不同状态之间的差异，从而帮助策略从更广泛的状态分布中学习任务，而不仅仅是从目标状态。","这种正向-反向策略的结合，使得强化学习算法在处理复杂任务时更加高效。通过从多种初始状态进行训练，可以提升整体学习效率，并且演示数据可以用于正向和反向策略的训练。","反向策略的设计目的是让策略学习如何从不同的状态执行任务，而不仅仅是依赖于目标状态。这有助于提高策略的泛化能力和鲁棒性，避免过拟合到特定的初始条件。","在正向-反向RL中，反向策略的训练过程依赖于分类器，该分类器能够区分策略生成的状态和专家演示中的状态。这种区分有助于反向策略学习如何将状态映射回初始状态，从而实现任务的逆向执行。","通过这种方式，正向-反向RL不仅解决了策略漂移的问题，还避免了分布坍缩，使得策略能够在更广泛的状态空间中进行有效的学习和执行。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1879.64,"end":2058.1,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1879.64,"text":"Then we run our forward policy again, and then it would bring us back again somewhere in this pink region that is showing the distribution of states that are visited by the expert. And so the forward-backward process is the same, but we have this modified backward reward function, and we're actually going to learn this reward function."},{"start":1905.55,"text":"And in particular, we talked about in the lecture on learning reward functions, how you can train discriminators to discriminate between good states and bad states and use states from the policy as examples of bad states."},{"start":1925.07,"text":"And we can do the same exact thing here, where this reward function will be trained to distinguish states visited by the policy and states visited in the demonstrations. And then you'll be trying to, when you're training the backward policy, you'll be trying to trick this reward function into thinking that the states it's visiting are states from the expert and not from the policy. And then again, we'll discard our backward policy when we're done and deploy our forward policy."},{"start":1958.23,"text":"Cool. So assume some demonstrations, run our forward policy, backward policy, and so forth. This and forward-backward RL addresses the challenge of preventing the agent from drifting away, and it also avoids collapsing the distribution that we talked about before as well."},{"start":1979.06,"text":"Cool. And then the upside that I mentioned very briefly is that if you try the task from a wide set of initial states, both easier states, like states that are closer to the goal, and further states, then you could actually improve the efficiency of the entire reinforcement learning algorithm. The last thing that I'll mention is that you can actually use these demonstrations in the replay buffers as data to help train the forward policy and the reverse policy as well."},{"start":2009.52,"text":"So the question is, if the agent finishes the task, does the backward policy just stay there? And here the answer is no. So in the case of forward-backward URL, it would go back to the initial state, whereas in the case of this kind of middle algorithm, it'll kind of try to push the policy to a state in the expert state distribution."},{"start":2032.1,"text":"And specifically when we're training the classifier to classify between policy states and expert states, we're using all of the states in the trajectories, all the states in the demos. And so it's going to, for example, like in this graphic, go back to somewhere over here so that the policy then learns and practices how to do the task from here rather than only practicing it from the goal state."}],"speech_gaps":[],"frame":"../frames/v026/012.webp","frame_time":1891.64},{"title":"强化学习在机器人中的应用","segments":[{"id":140,"text":"Right, the question is what prevents it from actually staying in the goal state because the goal state is part of the demonstrations. The specifics of, I was thinking about not going into this, but basically the specifics of this reward function is actually kind of a state distribution matching objective where its goal is to match the states that it visits with the states in the demos.","zh":"对，问题是是什么阻止它实际上停留在目标状态，因为目标状态是演示的一部分。我原本想不深入讨论这个细节，但基本上，这个奖励函数的具体内容实际上是一种状态分布匹配目标，其目的是让其访问的状态与演示中的状态相匹配。","start":2058.92,"end":2083.91},{"id":141,"text":"And if it only resets to the goal state, then the classifier or the discriminator, this reward function will learn that if you're only in the goal state, then that's probably coming from the policy and not from the expert demos. And it will be able to distinguish that. And the way that you can kind of formalize that is you can actually think about it as a divergence between the states, the distribution of states visited by the backward policy and the distribution of states visited by the experts.","zh":"如果它只重置到目标状态，那么分类器或判别器，这个奖励函数会学习到，如果你只处于目标状态，那很可能来自于策略，而不是专家演示。它能够区分这一点。你可以这样形式化地表达这一点：你可以将其视为一种状态分布之间的差异，即反向策略访问的状态分布与专家访问的状态分布之间的差异。","start":2084.49,"end":2113.59},{"id":142,"text":"Cool. So let's actually briefly look at how these algorithms perform. So there's actually a benchmark for kind of this sort of autonomous reinforcement learning setting called URL. And during training, you only get a reset every 200,000 environment steps. So very infrequently. And the evaluation is how good is the policy when you start it from some initial state distribution.","zh":"很好。让我们简要看一下这些算法的表现。实际上，有一种基准用于这种类型的自主强化学习设置，称为URL。在训练过程中，你每200,000个环境步骤才获得一次重置，因此非常不频繁。评估是当从某个初始状态分布启动策略时，策略表现有多好。","start":2115.85,"end":2143.83},{"id":143,"text":"The benchmark has a few different tasks. This is probably the simplest task in the benchmark where you can basically try to grab a cup and move it. And there's this very simple grabbing mechanism that makes the task simpler. And then we'll also look at a more complex task on the next slide. And if we look at what different algorithms do in this environment where they only get resets every 200,000 steps,","zh":"这个基准包含几个不同的任务。这可能是基准中最简单的任务，你基本上可以尝试拿起杯子并移动它。还有一个非常简单的抓取机制，使任务变得更简单。然后我们将在下一张幻灯片上查看一个更复杂的任务。如果我们看一下在这些算法在该环境中表现，它们每200,000步才获得一次重置，","start":2144.93,"end":2172.68},{"id":144,"text":"First, if we just run SAC without a backward policy, where it only gets very infrequent resets, like we saw with the fish, the performance isn't very good and it doesn't learn a good forward policy. If we use an oracle that is able to get resets much more frequently, then it is actually able to learn a good policy.","zh":"首先，如果我们仅运行SAC而不使用反向策略，其中它只获得非常不频繁的重置，就像我们看到的鱼的例子一样，性能并不好，它无法学习到一个好的前向策略。如果我们使用一个能够更频繁获得重置的oracle，那么它实际上能够学习到一个好的策略。","start":2173.4,"end":2196.37},{"id":145,"text":"And then there's a few algorithms, kind of reset-free algorithms. One is something that tries to perturb it and encourage it to visit novel states. Another, shown in orange, is kind of the vanilla forward-backward reinforcement learning algorithm. We can also give it some sort of goal curriculum. I didn't talk specifically about this algorithm. And then the blue algorithm is the algorithm that's trying to reset back to states in the demonstrations.","zh":"然后还有一些算法，基本上是无需重置的算法。一种是尝试对其进行扰动并鼓励其访问新状态的算法。另一种，用橙色表示，是较为传统的前向-后向强化学习算法。我们也可以为其提供某种目标课程。我没有具体讨论这个算法。然后蓝色的算法是试图将状态重置回演示中的状态的算法。","start":2197.49,"end":2224.95}],"notes":["本段讨论了强化学习中如何通过奖励函数区分策略生成的状态与专家演示中的状态。讲者指出，如果智能体仅停留在目标状态，分类器或判别器会认为这些状态来自策略而非专家演示，并通过状态分布的差异来区分两者。","讲者提到一个名为URL的基准测试，用于评估自主强化学习算法的性能。在训练过程中，智能体每200,000步才重置一次，这使得学习过程变得非常缓慢。评估标准是智能体从初始状态分布开始时的性能。","基准测试包含多个任务，其中最简单的任务是抓取杯子并移动。该任务中有一个简单的抓取机制，使得任务更容易完成。接下来的幻灯片将展示更复杂的任务。","讲者比较了不同算法在该环境中的表现。例如，SAC算法在没有后向策略的情况下，由于重置频率低，性能不佳，无法学习到良好的前向策略。而使用能够频繁重置的Oracle算法则能学习到更好的策略。","讲者还介绍了几种无需重置的算法，包括通过扰动鼓励探索新状态的算法，以及一种标准的前向-后向强化学习算法。此外，还提到了一种尝试重置回演示状态的算法，其颜色标记为蓝色。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2058.92,"end":2224.95,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2058.92,"text":"Right, the question is what prevents it from actually staying in the goal state because the goal state is part of the demonstrations. The specifics of, I was thinking about not going into this, but basically the specifics of this reward function is actually kind of a state distribution matching objective where its goal is to match the states that it visits with the states in the demos."},{"start":2084.49,"text":"And if it only resets to the goal state, then the classifier or the discriminator, this reward function will learn that if you're only in the goal state, then that's probably coming from the policy and not from the expert demos. And it will be able to distinguish that. And the way that you can kind of formalize that is you can actually think about it as a divergence between the states, the distribution of states visited by the backward policy and the distribution of states visited by the experts."},{"start":2115.85,"text":"Cool. So let's actually briefly look at how these algorithms perform. So there's actually a benchmark for kind of this sort of autonomous reinforcement learning setting called URL. And during training, you only get a reset every 200,000 environment steps. So very infrequently. And the evaluation is how good is the policy when you start it from some initial state distribution."},{"start":2144.93,"text":"The benchmark has a few different tasks. This is probably the simplest task in the benchmark where you can basically try to grab a cup and move it. And there's this very simple grabbing mechanism that makes the task simpler. And then we'll also look at a more complex task on the next slide. And if we look at what different algorithms do in this environment where they only get resets every 200,000 steps,"},{"start":2173.4,"text":"First, if we just run SAC without a backward policy, where it only gets very infrequent resets, like we saw with the fish, the performance isn't very good and it doesn't learn a good forward policy. If we use an oracle that is able to get resets much more frequently, then it is actually able to learn a good policy."},{"start":2197.49,"text":"And then there's a few algorithms, kind of reset-free algorithms. One is something that tries to perturb it and encourage it to visit novel states. Another, shown in orange, is kind of the vanilla forward-backward reinforcement learning algorithm. We can also give it some sort of goal curriculum. I didn't talk specifically about this algorithm. And then the blue algorithm is the algorithm that's trying to reset back to states in the demonstrations."}],"speech_gaps":[],"frame":"../frames/v026/013.webp","frame_time":2070.92},{"title":"强化学习在机器人中的应用","segments":[{"id":146,"text":"And so we see that first, I guess the kind of main takeaway here is that these algorithms that are specifically designed for this kind of autonomous or reset-free learning setting are able to do much better than if you don't design it for that case. And in this simple environment, they all perform kind of fairly similarly. And then as we move towards more complex environments, we see that forward-backward RL and metal","zh":"因此，我们可以看到，首先，我想这里的主结论是，专门为这种自主或无需重置的学习环境设计的算法，能够比不为这种情况设计的算法表现得更好。在这一简单环境中，它们的性能大致相似。但当我们转向更复杂的环境时，我们会发现前向-后向强化学习和金属强化学习能够表现得最好，而如果你尝试通过鼓励算法访问各种状态或目标来实现这一点，这些算法的表现则不如前者。","start":2226.79,"end":2254.61},{"id":147,"text":"are able to kind of do the best, whereas simply if you instead try to kind of encourage it to visit various states or goals, those algorithms aren't doing quite as well.","zh":"是的，问题是，我们假设了一些专家轨迹。这些轨迹是如何生成的？有很多种方法可以生成它们。在真实机器人上，通常会使用某种类型的远程操作设备。这可以是使用……","start":2255.3,"end":2266.6},{"id":148,"text":"Yeah, the question is, we're assuming some expert trajectories. How are those generated? So there's a variety of ways that you can generate them. On a real robot, you would typically use some sort of teleoperation device. And that could be using like...","zh":"比如类似提线木偶的设置，或者VR控制器，或者3D鼠标，或者键盘。在仿真环境中，它可以是某种由人设计的脚本策略，或者也可以是事先用强化学习训练好的策略，仅用于测试算法。","start":2267.37,"end":2285.51},{"id":149,"text":"Like a puppeteering-like setup, or a VR controller, or a 3D mouse, or a keyboard. In simulation, it can either be something that's a scripted policy that is designed by a person, or it could be a policy that's trained with RL ahead of time just to test the algorithms.","zh":"就像提线木偶的设置，或者VR控制器，或者3D鼠标，或者键盘。在模拟环境中，它可以是人为设计的脚本策略，也可以是事先通过强化学习训练好的策略，仅用于测试算法。","start":2286.27,"end":2304.75},{"id":150,"text":"Can I describe what the episodic part is? So episodic is a term that often refers to the traditional reinforcement learning setting where we can attempt the task and reset and attempt the task again, where each attempt is like an episode. And so it's very episodic. You get one episode, you try again, you get another episode. And then it's not the best term, but that's one term. And then non-episodic refers to the setting where you don't get those resets.","zh":"你只是让它继续运行。因此，它不再是多个分段的集合。而是一个漫长的、连续的学习过程。有时这个学习过程也被称为无重置（reset-free），因为在过程中没有重置。哦，实际上我应该提到的另一点是，这个任务的一个有趣之处在于，前向任务是关门，而后向任务是开门。而后向任务实际上，根据手臂的起始位置，可能要困难得多。","start":2305.74,"end":2332.42},{"id":151,"text":"You just let it go. And so it's no longer like a bunch of episodes. It's just like one long learning process. Sometimes that learning process is also called reset-free because there are no resets in the process. Oh, the other thing that I should mention, actually, that's kind of cool about this particular task is the forward task is to close the door, and the backward task is to open the door. And the backward task is actually, depending on where the arm starts, can actually be quite a bit harder.","zh":"你只需放手。因此，它不再是许多回合的训练过程，而是一个漫长的连续学习过程。有时这个学习过程也被称为无重置（reset-free），因为在过程中没有重置。哦，还有一点我应该提到，这个任务其实挺有趣的，正向任务是关门，反向任务是开门。而反向任务实际上，根据手臂的起始位置，可能会难得多。","start":2333.01,"end":2362.11},{"id":152,"text":"than the forward task. And so you could sometimes have these sort of mismatches between how hard it is to do the forward task and how hard it is to do the backward task. And that can generally sometimes make the learning process a bit more challenging because the forward policy and the backward policy will learn at different rates.","zh":"相比于前向任务，这可能更难。因此，有时会出现前向任务和后向任务的难度不匹配的情况。这通常会使学习过程更具挑战性，因为前向策略和后向策略的学习速度可能不同。","start":2362.64,"end":2378.88},{"id":153,"text":"Similarly, if you could imagine if your forward task is to do a backflip, for example, maybe doing a backflip is really challenging, but getting up and standing up to start doing the backflip is comparably easier. And so it's kind of fairly common to have a mismatch in that sort of difficulty.","zh":"同样，如果你想象你的前向任务是完成一个后空翻，例如，完成一个后空翻可能非常具有挑战性，但先站起来开始做后空翻可能相对容易一些。因此，这种难度不匹配的情况相当常见。","start":2380.74,"end":2396.74}],"notes":["本段讨论了强化学习算法在自主或无重置学习环境中的表现。特别强调了专门设计用于此类环境的算法相较于未专门设计的算法表现更优。在简单环境中，所有算法表现相似，但在复杂环境中，前向-后向强化学习（forward-backward RL）和金属（metal）算法表现最佳。"],"formulas":[],"uncertainties":["metal"],"diagram":"none","start":2226.79,"end":2396.74,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2226.79,"text":"And so we see that first, I guess the kind of main takeaway here is that these algorithms that are specifically designed for this kind of autonomous or reset-free learning setting are able to do much better than if you don't design it for that case. And in this simple environment, they all perform kind of fairly similarly. And then as we move towards more complex environments, we see that forward-backward RL and metal"},{"start":2255.3,"text":"are able to kind of do the best, whereas simply if you instead try to kind of encourage it to visit various states or goals, those algorithms aren't doing quite as well."},{"start":2267.37,"text":"Yeah, the question is, we're assuming some expert trajectories. How are those generated? So there's a variety of ways that you can generate them. On a real robot, you would typically use some sort of teleoperation device. And that could be using like..."},{"start":2286.27,"text":"Like a puppeteering-like setup, or a VR controller, or a 3D mouse, or a keyboard. In simulation, it can either be something that's a scripted policy that is designed by a person, or it could be a policy that's trained with RL ahead of time just to test the algorithms."},{"start":2305.74,"text":"Can I describe what the episodic part is? So episodic is a term that often refers to the traditional reinforcement learning setting where we can attempt the task and reset and attempt the task again, where each attempt is like an episode. And so it's very episodic. You get one episode, you try again, you get another episode. And then it's not the best term, but that's one term. And then non-episodic refers to the setting where you don't get those resets."},{"start":2333.01,"text":"You just let it go. And so it's no longer like a bunch of episodes. It's just like one long learning process. Sometimes that learning process is also called reset-free because there are no resets in the process. Oh, the other thing that I should mention, actually, that's kind of cool about this particular task is the forward task is to close the door, and the backward task is to open the door. And the backward task is actually, depending on where the arm starts, can actually be quite a bit harder."},{"start":2362.64,"text":"than the forward task. And so you could sometimes have these sort of mismatches between how hard it is to do the forward task and how hard it is to do the backward task. And that can generally sometimes make the learning process a bit more challenging because the forward policy and the backward policy will learn at different rates."},{"start":2380.74,"text":"Similarly, if you could imagine if your forward task is to do a backflip, for example, maybe doing a backflip is really challenging, but getting up and standing up to start doing the backflip is comparably easier. And so it's kind of fairly common to have a mismatch in that sort of difficulty."}],"speech_gaps":[],"frame":"../frames/v026/014.webp","frame_time":2238.79},{"title":"强化学习在机器人中的应用","segments":[{"id":154,"text":"These sorts of algorithms have also... You can actually run them on real robots, and it's kind of cool. You can watch time-lapses of them. The left video is running a forward-backward RL where it's learning a forward policy, learning a backward policy. And you can see that both policies kind of make mistakes. And it's able to...","zh":"这些类型的算法也可以... 你实际上可以在真实机器人上运行它们，而且这有点酷。你可以观看它们的时间流逝视频。左边的视频是在运行一个前后强化学习，它在学习一个向前策略和一个向后策略。你可以看到这两个策略都有一些错误。而且它能够...","start":2398.55,"end":2416.95},{"id":155,"text":"I don't know if you can see it in the context of this single video, but it is able to improve just through a fully autonomous process. And then the right is the metal algorithm. And you can see that, for example, if the forward policy misses, then the backward policy doesn't really have much to do. And so you do see another property of the algorithm in the video.","zh":"我不确定你是否能在单个视频的上下文中看到这一点，但它确实能够通过一个完全自主的过程进行改进。右边的是金属算法。你可以看到，例如，如果向前策略失败，那么向后策略就几乎没有可做的事情。因此你在视频中也能看到该算法的另一个特性。","start":2418.01,"end":2441.77},{"id":156,"text":"Cool. One of the things that I'll mention is that rewards are also something that the real world doesn't provide. And so using reward learning algorithms in conjunction with autonomous or reset-free algorithms is also quite common. And in both of these circumstances, the rewards were using models rather than using humans so that this entire process can be kind of autonomous and you can actually run it overnight, for example.","zh":"酷。我要提到的一件事是，奖励也是现实世界不会提供的。因此，将奖励学习算法与自主或无需重置的算法结合使用也是相当常见的。在这两种情况下，奖励都是使用模型而不是人类来实现的，这样整个过程可以相当自主，例如你可以在晚上运行它。","start":2445.77,"end":2470.97},{"id":157,"text":"Yeah, so the question is, it seems like for some of these tasks,","zh":"是的，所以问题是，看起来对于一些任务，","start":2471.95,"end":2475.29},{"id":158,"text":"if you don't have a good backward policy, then it's really hard to learn the forward policy.","zh":"如果你没有一个好的向后策略，那么学习向前策略就非常困难。","start":2475.41,"end":2478.85},{"id":159,"text":"And also vice versa.","zh":"同样，反之亦然。","start":2479.07,"end":2480.19},{"id":160,"text":"If you don't have a good forward policy, then you're never actually going to be picking up the towel.","zh":"如果你没有一个好的向前策略，那么你实际上永远无法拿起毛巾。","start":2480.25,"end":2484.65},{"id":161,"text":"And then you need to figure out how to...","zh":"然后你需要想办法...","start":2484.89,"end":2489.45},{"id":162,"text":"You're not really getting actually any good states.","zh":"你实际上并没有获得任何好的状态。","start":2489.45,"end":2491.43},{"id":163,"text":"In general, one of the things you can do is you can provide demonstrations","zh":"一般来说，你可以做的一件事是，你可以为前向任务和后向任务都提供示范","start":2493.13,"end":2495.87},{"id":164,"text":"both for the forward task and for the backward task","zh":"并利用这些示范来帮助两个任务的学习过程进行引导。","start":2495.87,"end":2498.13},{"id":165,"text":"and use that to help bootstrap the learning process for both of them.","zh":"嗯，除此之外，嗯，这基本上是一个挑战，嗯，是的，要尝试在这两者之间取得平衡。","start":2498.13,"end":2501.55},{"id":166,"text":"Um, the, other than that, um, it is just generally a challenge and to, uh, yeah, to try to balance","zh":"而且，嗯，是的，一般来说，这些算法在某些情况下是能够工作的。","start":2501.95,"end":2509.73},{"id":167,"text":"these two things.","zh":"嗯，我应该还要提到，像这些工作，嗯，那些进行这些工作的作品，像","start":2509.73,"end":2510.39},{"id":168,"text":"And, um, yeah, in general, the algorithms are, are able to work, uh, in some settings.","zh":"而且，嗯，是的，一般来说，这些算法能够在某些环境下运行。","start":2510.43,"end":2517.71},{"id":169,"text":"Uh, I should also mention that like these works, um, works that are doing these, like,","zh":"嗯，我应该还要提到，像这些工作，嗯，进行这些工作的，比如，","start":2517.93,"end":2522.69},{"id":170,"text":"um, they're kind of still, I mean, certainly still in like the research stages.","zh":"嗯，它们基本上还在，我意思是，肯定仍然处于研究阶段。","start":2524.71,"end":2527.99},{"id":171,"text":"I think this is not something that like that like robot companies are using today. Yeah","zh":"我认为这并不是今天机器人公司正在使用的东西。对的","start":2527.99,"end":2533.87},{"id":172,"text":"Cool. Um, so we've talked about kind of algorithms that learn a reset policy to help learning a forward policy now","zh":"很好。嗯，我们之前讨论过一些算法，这些算法学习一个重置策略来帮助学习一个前向策略。","start":2535.11,"end":2542.55},{"id":173,"text":"We can also think about a slightly different setting which is that if we're trying to learn not just one task but multiple tasks","zh":"我们也可以考虑一种略有不同的设置，即如果我们试图学习的不只是一个任务而是多个任务，","start":2543.51,"end":2550.89},{"id":174,"text":"then","zh":"那么","start":2551.47,"end":2551.99},{"id":175,"text":"We can actually think about not just kind of going forward and backward but","zh":"我们实际上可以不仅仅考虑向前和向后，而是","start":2552.61,"end":2556.99},{"id":176,"text":"But practicing, like kind of going in cycles and practicing different tasks depending on what state you're in.","zh":"通过练习，比如循环进行，并根据所处的状态练习不同的任务。","start":2556.99,"end":2562.67},{"id":177,"text":"So, for example, if you have a robot that's trying to make coffee.","zh":"例如，如果你有一个机器人在尝试制作咖啡。","start":2563.39,"end":2566.97}],"notes":["本段讨论了强化学习在机器人中的应用，特别是通过正向和反向策略的结合来实现自主学习。讲者提到，正向策略和反向策略在学习过程中可能会出错，但算法能够通过完全自主的过程进行改进。此外，讲者指出，奖励在现实世界中并不提供，因此通常使用模型而不是人类来生成奖励，以实现完全自主的过程。","讲者强调了正向和反向策略之间的相互依赖关系。如果其中一个策略不够好，另一个策略的学习将变得非常困难。例如，如果没有良好的正向策略，机器人就无法成功完成任务，如拾取毛巾。因此，需要找到一种方法来平衡这两种策略。","讲者提到，可以通过提供示范来帮助正向和反向任务的学习过程。这有助于初始化学习过程，从而提高学习效率。此外，讲者指出，这些方法目前仍处于研究阶段，尚未被机器人公司广泛采用。","讲者进一步讨论了在学习多个任务时的策略。在这种情况下，机器人可以采用循环的方式，根据当前状态练习不同的任务。例如，一个试图制作咖啡的机器人可以根据其当前状态选择不同的任务进行练习。","讲者提到，这些方法虽然在某些情况下有效，但仍然面临挑战。例如，如何在正向和反向策略之间找到平衡，以及如何确保学习过程的自主性和效率。这些挑战需要进一步的研究和改进。","讲者最后指出，这些方法目前仍处于研究阶段，尚未被广泛应用。因此，未来的研究需要进一步探索如何优化这些策略，以提高其在实际应用中的效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2398.55,"end":2566.97,"asr_flags":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":2398.55,"text":"These sorts of algorithms have also... You can actually run them on real robots, and it's kind of cool. You can watch time-lapses of them. The left video is running a forward-backward RL where it's learning a forward policy, learning a backward policy. And you can see that both policies kind of make mistakes. And it's able to..."},{"start":2418.01,"text":"I don't know if you can see it in the context of this single video, but it is able to improve just through a fully autonomous process. And then the right is the metal algorithm. And you can see that, for example, if the forward policy misses, then the backward policy doesn't really have much to do. And so you do see another property of the algorithm in the video."},{"start":2445.77,"text":"Cool. One of the things that I'll mention is that rewards are also something that the real world doesn't provide. And so using reward learning algorithms in conjunction with autonomous or reset-free algorithms is also quite common. And in both of these circumstances, the rewards were using models rather than using humans so that this entire process can be kind of autonomous and you can actually run it overnight, for example."},{"start":2471.95,"text":"Yeah, so the question is, it seems like for some of these tasks,"},{"start":2475.41,"text":"if you don't have a good backward policy, then it's really hard to learn the forward policy."},{"start":2479.07,"text":"And also vice versa."},{"start":2480.25,"text":"If you don't have a good forward policy, then you're never actually going to be picking up the towel."},{"start":2484.89,"text":"And then you need to figure out how to..."},{"start":2489.45,"text":"You're not really getting actually any good states."},{"start":2493.13,"text":"In general, one of the things you can do is you can provide demonstrations"},{"start":2495.87,"text":"both for the forward task and for the backward task"},{"start":2498.13,"text":"and use that to help bootstrap the learning process for both of them."},{"start":2501.95,"text":"Um, the, other than that, um, it is just generally a challenge and to, uh, yeah, to try to balance"},{"start":2509.73,"text":"these two things."},{"start":2510.43,"text":"And, um, yeah, in general, the algorithms are, are able to work, uh, in some settings."},{"start":2517.93,"text":"Uh, I should also mention that like these works, um, works that are doing these, like,"},{"start":2524.71,"text":"um, they're kind of still, I mean, certainly still in like the research stages."},{"start":2527.99,"text":"I think this is not something that like that like robot companies are using today. Yeah"},{"start":2535.11,"text":"Cool. Um, so we've talked about kind of algorithms that learn a reset policy to help learning a forward policy now"},{"start":2543.51,"text":"We can also think about a slightly different setting which is that if we're trying to learn not just one task but multiple tasks"},{"start":2551.47,"text":"then"},{"start":2552.61,"text":"We can actually think about not just kind of going forward and backward but"},{"start":2556.99,"text":"But practicing, like kind of going in cycles and practicing different tasks depending on what state you're in."},{"start":2563.39,"text":"So, for example, if you have a robot that's trying to make coffee."}],"speech_gaps":[],"frame":"../frames/v026/015.webp","frame_time":2410.55},{"title":"强化学习在机器人中的应用：任务条件策略","segments":[{"id":178,"text":"Maybe the first task is to put or the first subtask is to put the cup in the coffee machine and maybe if it attempts that it actually like drops the cup on accident and then kind of traditionally what you would do is you would have a human kind of reset the cup back to where it started but we don't want to do that.","zh":"也许第一个任务是放杯子，或者第一个子任务是将杯子放入咖啡机中。也许如果它尝试这样做时不小心打翻了杯子，那么传统上你会让人类将杯子重新放回起始位置，但我们不想这样做。","start":2567.88,"end":2588.94},{"id":179,"text":"And so instead, maybe the second task is instead of because it made a mistake, the second task shouldn't be to turn on the coffee machine. Instead, it should be to pick up the cup. And so we can imagine having these different cycles where we practice task one. Then if we fail, we practice task two. And then task two maybe is kind of resetting task one. We maybe then go back to task one, which is to put the cup in the coffee machine. If we didn't succeed at task two, we might keep trying it.","zh":"因此，也许第二个任务不是因为犯了错误而要启动咖啡机。相反，第二个任务应该是捡起杯子。我们可以想象有这些不同的循环，我们练习任务一。如果失败了，我们练习任务二。然后任务二可能是重置任务一。我们可能再回到任务一，即把杯子放入咖啡机中。如果我们未能成功完成任务二，可能会继续尝试。","start":2589.58,"end":2619.04},{"id":180,"text":"If we do succeed at task one at putting in the coffee machine, we might move to task three, and so on and so forth. And so we can have this sort of graph or cycle of different tasks that we're trying, and at different points in time, depending on the state we're in, we'll practice a different task that is possible to practice from that state and exclude tasks that are not feasible from that state. Cool. So what this would look like is we will be learning","zh":"如果我们成功完成了任务一，即把杯子放入咖啡机中，我们可能会进入任务三，依此类推。因此，我们可以拥有这种不同任务的图或循环，根据我们在不同时间点所处的状态，我们练习不同的任务，这些任务可以从该状态中进行练习，并排除那些在该状态下不可行的任务。很好。因此，这会表现为我们在学习","start":2619.4,"end":2650.8},{"id":181,"text":"a task condition policy, so like a multitask policy. And we will be in some state, and so we'll observe the state that we're in. And then based on the state that we're in, we'll propose a task that we want to practice from that state. So we'll have a step that is proposing a task, but we can use...","zh":"一个任务条件策略，也就是一个多任务策略。我们会处于某个状态，然后观察我们所处的状态。根据我们所处的状态，我们会提出一个想要从该状态练习的任务。因此，我们会有一个提出任务的步骤，但我们可以使用……","start":2651.55,"end":2679.95},{"id":182,"text":"ZI to denote the task that we're proposing. And this could be like the descriptor for that task. And then we will run the policy for that task. And so this could be a multitask policy. Whoops. That's conditioned on ZI.","zh":"ZI 来表示我们所提出的任务。这可以是该任务的描述符。然后我们会运行该任务的策略。因此，这可以是一个多任务策略。哎呀，这是以 ZI 为条件的。","start":2681.34,"end":2705.7},{"id":183,"text":"And then we can also have an update step where we update our policy. If we have a more on-policy algorithm, then this would be updating it for this particular task. If we have an off-policy algorithm, we could update it for any of the tasks. And then repeat this process where after we've run it for that task for some number of steps, we'll then propose a different task and practice that task. So initialize our policy, propose a task.","zh":"然后我们还可以有一个更新步骤，用来更新我们的策略。如果我们使用的是更偏向于在策略的算法，那么这一步就是针对这个特定任务进行更新。如果我们使用的是离策略算法，那么我们可以针对任何任务进行更新。然后重复这个过程，即在对该任务运行若干步之后，我们提出一个不同的任务并练习该任务。因此，初始化我们的策略，提出一个任务。","start":2708.46,"end":2737.12}],"notes":["本段讲解了强化学习在机器人任务中的应用，特别是如何通过任务条件策略（task-conditioned policy）来处理机器人执行任务时的失败情况。讲者提到，当机器人执行任务失败时，例如将杯子掉落在咖啡机上，而不是直接重置任务，而是通过另一个任务（如捡起杯子）来纠正错误。这种策略允许机器人在不同任务之间切换，以适应当前状态。","讲者进一步说明，这种任务条件策略可以被建模为一个任务图或循环结构，其中每个任务在特定状态下被选择执行。如果当前状态允许执行某个任务，则执行该任务；否则，排除该任务。这种机制使得机器人能够根据当前状态动态调整任务。","讲者提到，任务条件策略可以被建模为多任务策略（multitask policy），其中每个任务由一个任务描述符（descriptor）表示，例如ZI。在执行任务时，机器人会根据当前状态选择一个任务，并运行相应的策略。","讲者还提到，策略更新可以是基于策略的（on-policy）或基于非策略的（off-policy）。如果是基于策略的算法，更新仅针对当前任务；如果是基于非策略的算法，可以更新所有任务的策略。这种机制允许机器人在不同任务之间进行策略优化。","讲者最后提到，整个过程是一个循环：初始化策略，提出任务，执行任务，更新策略，然后重复这一过程。这种结构使得机器人能够逐步学习和优化其任务执行能力。","讲者强调，这种任务条件策略能够处理机器人在执行任务时的失败情况，通过动态选择任务来适应当前状态，从而提高任务的成功率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2567.88,"end":2737.12,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2567.88,"text":"maybe the first task is to put or the first subtask is to put the cup in the coffee machine and Maybe if it attempts that it actually like drops the cup on accident And then kind of traditionally what you would do is you would have a human kind of reset the cup back to where it started But we don't want to do that"},{"start":2589.58,"text":"And so instead, maybe the second task is instead of because it made a mistake, the second task shouldn't be to turn on the coffee machine. Instead, it should be to pick up the cup. And so we can imagine having these different cycles where we practice task one. Then if we fail, we practice task two. And then task two maybe is kind of resetting task one. We maybe then go back to task one, which is to put the cup in the coffee machine. If we didn't succeed at task two, we might keep trying it."},{"start":2619.4,"text":"if we do succeed at task one at putting in the coffee machine, we might move to task three, and so on and so forth. And so we can have this sort of graph or cycle of different tasks that we're trying, and at different points in time, depending on the state we're in, we'll practice a different task that is possible to practice from that state and exclude tasks that are not feasible from that state. Cool. So what this would look like is we will be learning"},{"start":2651.55,"text":"a task condition policy, so like a multitask policy. And we will be in some state, and so we'll observe the state that we're in. And then based on the state that we're in, we'll propose a task that we want to practice from that state. So we'll have a step that is proposing a task, but we can use..."},{"start":2681.34,"text":"ZI to denote the task that we're proposing. And this could be like the descriptor for that task. And then we will run the policy for that task. And so this could be a multitask policy. Whoops. That's conditioned on ZI."},{"start":2708.46,"text":"And then we can also have an update step where we update our policy. If we have a more on-policy algorithm, then this would be updating it for this particular task. If we have an off-policy algorithm, we could update it for any of the tasks. And then repeat this process where after we've run it for that task for some number of steps, we'll then propose a different task and practice that task. So initialize our policy, propose a task."}],"speech_gaps":[],"frame":"../frames/v026/016.webp","frame_time":2579.88},{"title":"强化学习在机器人中的应用","segments":[{"id":184,"text":"roll out the policy for eight steps, and then update. And specifically, we'll be updating it with the reward function that takes into account the tasks that we're practicing. And so we'll need a reward function for all of the tasks that we might be doing. Yeah, and then again, we won't have resets, or we'll have a very infrequent reset. And then at test time, we can then deploy this multitask policy, which can do not just one task, but multiple different tasks.","zh":"按照策略执行八个步骤，然后进行更新。具体来说，我们将使用一个奖励函数来进行更新，该奖励函数考虑了我们正在练习的任务。因此，我们需要为所有可能执行的任务准备一个奖励函数。是的，然后我们可能不会有重置，或者重置非常不频繁。在测试时，我们可以部署这个多任务策略，它不仅能完成一个任务，还能完成多个不同的任务。","start":2737.82,"end":2766.67},{"id":185,"text":"And as an example, this is a robot system that is, the goal is to pick up this, it basically has different stages and different tasks are different stages. You want to pick up this object, flip it over and rotate it. And there are different subtasks here. And so at the beginning, it doesn't know how to flip it. It certainly doesn't know how to rotate it.","zh":"举个例子，这是一个机器人系统，其目标是拿起这个物体，它基本上有不同的阶段，不同的任务对应不同的阶段。你想要拿起这个物体，翻转它并旋转它。这里有一些不同的子任务。因此，在开始时，它不知道如何翻转它。它当然也不懂得如何旋转它。","start":2768.83,"end":2793.8},{"id":186,"text":"Maybe it does actually know how to flip it, but it isn't really good at rotating it. It's something where at the beginning you don't know how to flip it or rotate it, and you'll basically just be practicing picking it up from the hand.","zh":"也许它实际上知道如何翻转它，但并不擅长旋转它。这是一个在开始时你不知道如何翻转或旋转它，基本上只是练习从手中拿起它的过程。","start":2794.81,"end":2806.85},{"id":187,"text":"and putting it back, picking it up, putting it back, putting it down.","zh":"然后把它放回去，拿起它，放回去，放下来。","start":2807.69,"end":2811.55},{"id":188,"text":"And then once you get better at picking it up,","zh":"一旦你更好地掌握了拿起它的技巧，","start":2811.81,"end":2814.03},{"id":189,"text":"then you'll start to actually kind of rotate it or flip it over and rotate it.","zh":"你就会开始实际地旋转它或翻转它并旋转它。","start":2814.09,"end":2820.13},{"id":190,"text":"And so depending on which state you're actually in,","zh":"因此，根据你实际所处的状态，","start":2820.41,"end":2823.13},{"id":191,"text":"you'll actually practice something that makes sense for that given state.","zh":"你将会练习适合该状态的操作。","start":2823.21,"end":2826.51},{"id":192,"text":"And this can actually address some of the challenges","zh":"这实际上可以解决我们之前讨论的一些挑战","start":2827.35,"end":2829.35},{"id":193,"text":"that we talked about with regard to imbalance and tasks,","zh":"即与不平衡和任务相关的问题，","start":2829.35,"end":2832.93},{"id":194,"text":"where if you haven't actually yet successfully run the forward policy to","zh":"如果你还没有成功运行前向策略来","start":2832.93,"end":2838.87},{"id":195,"text":"actually change the state, and you may not even be in a state where it makes","zh":"实际改变状态，而且你可能甚至处于一个不适用反向策略的状态，","start":2838.87,"end":2842.01},{"id":196,"text":"sense to run the backward policy, then you can keep on running the policy","zh":"那么你可以继续运行一个有意义的任务的策略。","start":2842.01,"end":2847.11},{"id":197,"text":"for a task that makes sense. As a couple more examples of this, this","zh":"作为这个概念的几个更多例子，左边的例子中，你试图学习如何","start":2847.11,"end":2854.25},{"id":198,"text":"example on the left, you're trying to learn both for walking","zh":"向前行走和向后行走，同时你也在学习如何","start":2854.89,"end":2858.05},{"id":199,"text":"forward and walking backwards, and also you also at the same time are actually learning how to get","zh":"获取状态","start":2858.05,"end":2867.49},{"id":200,"text":"back up, and so you can see it kind of transitioning between going forward, going backward. If it's too","zh":"后退，你可以看到它在前进和后退之间进行转换。如果它后退得太远，那么它就不想继续后退，于是你就会练习前进的任务。","start":2867.49,"end":2873.07},{"id":201,"text":"far to the back, then it will, doesn't want to keep on going backwards, and so then you'll practice","zh":"同样，右边这个例子实际上是一个七阶段的任务，你需要把它捡起来，定位好，然后反复拧紧。","start":2873.07,"end":2877.53},{"id":202,"text":"the task of going forwards. And likewise, this example on the right, there's actually, it's like","zh":"因此，它会根据所处的状态运行不同的策略或控制器。","start":2877.53,"end":2883.85},{"id":203,"text":"like, a seven-stage task where you need to pick it up, position it, and, like, screw repeatedly.","zh":"最终，它也会运行一种向后策略，把扳手放回桌子上。","start":2883.85,"end":2890.81},{"id":204,"text":"And so it's running these different policies or these different controllers based on the state that it's in.","zh":"是的，所以问题是，我们如何选择这些任务，基本上？","start":2891.29,"end":2897.57},{"id":205,"text":"And eventually it will also run kind of the backward policy of putting the wrench back on the table.","zh":"是的，这里基本上有两种方法被采用。","start":2898.15,"end":2904.77},{"id":206,"text":"Yeah, so the question is, like, how do we select these tasks, basically?","zh":"是的，所以问题是，我们如何基本上选择这些任务？","start":2905.49,"end":2909.27},{"id":207,"text":"Yeah, so there's basically kind of two approaches that have been done here.","zh":"是的，所以这里基本上有两种方法被采用。","start":2910.27,"end":2916.67}],"notes":["本段讲解了强化学习在机器人任务中的应用，特别是多任务策略的构建。机器人需要根据当前状态选择合适的子任务进行练习，例如拾取、翻转和旋转物体。这种策略可以解决任务不平衡的问题，即在未成功执行前向策略改变状态时，避免执行不合适的后向策略。","在机器人学习过程中，不同阶段的任务需要不同的子策略。例如，机器人可能一开始并不知道如何翻转或旋转物体，只能专注于拾取和放置。随着技能的提升，它会逐渐学习更复杂的动作，如翻转和旋转。","机器人根据当前状态选择合适的任务进行练习，这有助于提高学习效率。例如，当机器人处于后退状态时，它会练习前进任务，反之亦然。这种动态选择任务的方式可以避免无效的策略执行。","在多任务学习中，机器人会根据不同的状态运行不同的策略或控制器。例如，在七阶段任务中，机器人需要依次完成拾取、定位和反复拧紧等操作，每个阶段对应不同的子策略。","最终，机器人会执行后向策略，如将扳手放回桌面。这种策略选择机制使得机器人能够灵活应对不同任务需求，提高整体性能。","本段还提出了一个关键问题：如何选择这些任务？这引出了两种主要的解决方法，但具体方法未在本段展开讨论。"],"formulas":[],"uncertainties":["sense to run the backward policy","kind of the backward policy"],"diagram":"none","start":2737.82,"end":2916.67,"asr_flags":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":2737.82,"text":"roll out the policy for eight steps, and then update. And specifically, we'll be updating it with the reward function that takes into account the tasks that we're practicing. And so we'll need a reward function for all of the tasks that we might be doing. Yeah, and then again, we won't have resets, or we'll have a very infrequent reset. And then at test time, we can then deploy this multitask policy, which can do not just one task, but multiple different tasks."},{"start":2768.83,"text":"And as an example, this is a robot system that is, the goal is to pick up this, it basically has different stages and different tasks are different stages. You want to pick up this object, flip it over and rotate it. And there are different subtasks here. And so at the beginning, it doesn't know how to flip it. It certainly doesn't know how to rotate it."},{"start":2794.81,"text":"Maybe it does actually know how to flip it, but it isn't really good at rotating it. It's something where at the beginning you don't know how to flip it or rotate it, and you'll basically just be practicing picking it up from the hand."},{"start":2807.69,"text":"and putting it back, picking it up, putting it back, putting it down."},{"start":2811.81,"text":"And then once you get better at picking it up,"},{"start":2814.09,"text":"then you'll start to actually kind of rotate it or flip it over and rotate it."},{"start":2820.41,"text":"And so depending on which state you're actually in,"},{"start":2823.21,"text":"you'll actually practice something that makes sense for that given state."},{"start":2827.35,"text":"And this can actually address some of the challenges"},{"start":2829.35,"text":"that we talked about with regard to imbalance and tasks,"},{"start":2832.93,"text":"where if you haven't actually yet successfully run the forward policy to"},{"start":2838.87,"text":"actually change the state, and you may not even be in a state where it makes"},{"start":2842.01,"text":"sense to run the backward policy, then you can keep on running the policy"},{"start":2847.11,"text":"for a task that makes sense. As a couple more examples of this, this"},{"start":2854.89,"text":"example on the left, you're trying to learn both for walking"},{"start":2858.05,"text":"forward and walking backwards, and also you also at the same time are actually learning how to get"},{"start":2867.49,"text":"back up, and so you can see it kind of transitioning between going forward, going backward. If it's too"},{"start":2873.07,"text":"far to the back, then it will, doesn't want to keep on going backwards, and so then you'll practice"},{"start":2877.53,"text":"the task of going forwards. And likewise, this example on the right, there's actually, it's like"},{"start":2883.85,"text":"like, a seven-stage task where you need to pick it up, position it, and, like, screw repeatedly."},{"start":2891.29,"text":"And so it's running these different policies or these different controllers based on the state that it's in."},{"start":2898.15,"text":"And eventually it will also run kind of the backward policy of putting the wrench back on the table."},{"start":2905.49,"text":"Yeah, so the question is, like, how do we select these tasks, basically?"},{"start":2910.27,"text":"Yeah, so there's basically kind of two approaches that have been done here."}],"speech_gaps":[],"frame":"../frames/v026/017.webp","frame_time":2749.82},{"title":"强化学习在机器人中的应用","segments":[{"id":208,"text":"And this is also kind of like sort of at the bleeding edge of research in some ways.","zh":"这在某种程度上也处于研究的前沿。","start":2916.79,"end":2920.09},{"id":209,"text":"The first is that you could predefine a set of tasks and also predefine that graph, saying, like, if you failed task one, then you should practice task two. And obviously, up front, predefine that graph, what you should do in different circumstances, and then act according to that graph.","zh":"第一种方法是你可以预定义一组任务，同时预定义这个图结构，例如，如果你失败了任务一，那么你应该练习任务二。显然，在事先就可以预定义这个图结构，在不同情况下应该采取什么行动，然后根据这个图结构进行行动。","start":2921.63,"end":2938.49},{"id":210,"text":"Alternatively, you could also kind of train a model that proposes tasks for you to do. And so, for example, in general, I think it's kind of an open question with regard to, like, which tasks you pick to collect for at a given point in time. But you could, for example, ask a language model to say, like, what are the different things that I could do in this environment to get better and actually then practice the task that it describes as output?","zh":"另一种方法是你可以训练一个模型，为你要执行的任务提供建议。例如，一般来说，关于在某一时刻应该选择哪些任务来收集数据，这仍然是一个开放性问题。但你可以例如让语言模型来提出，像在这一环境中，我可以做哪些事情来提高能力，然后练习它输出的任务。","start":2940.24,"end":2964.46},{"id":211,"text":"And so as an example of that, if this is the frame that we're in, then there's certain things that we can do in this task. We could open this toy microwave, we could pick up the banana, we could push the eggplant, move the pot. But if we instead told it to pick up the carrot, that's not something that you can do in the scene.","zh":"举个例子，如果这是我们的场景，那么在这个任务中我们可以做某些事情。我们可以打开这个玩具微波炉，可以拿起香蕉，可以推动茄子，移动锅。但如果我们让它去捡胡萝卜，那在这一场景中是无法完成的。","start":2965.24,"end":2986.3},{"id":212,"text":"And if we're trying to actually train it to do lots of different things, these tasks are going to be scene dependent.","zh":"如果我们试图真正训练它完成各种不同的任务，这些任务将依赖于场景。","start":2987.12,"end":2991.64},{"id":213,"text":"So then you could ask a VLM to understand, like, think about what are the things that you can do in this environment,","zh":"因此你可以让视觉语言模型来理解，思考在这个环境中你可以做哪些事情，","start":2992.7,"end":2999.96},{"id":214,"text":"and then have it predict, for example, take the banana out of the silver pot.","zh":"然后让它预测，例如，把香蕉从银锅中拿出来。","start":3000.1,"end":3004.48},{"id":215,"text":"And then from there, actually have it practice doing this task versus practicing doing some other task.","zh":"然后从那里开始，让它实际练习执行这个任务，而不是练习执行其他任务。","start":3005.76,"end":3012.52},{"id":216,"text":"The question is, how is this different from hierarchical learning?","zh":"问题是，这与分层学习有什么不同？","start":3013.68,"end":3016.0},{"id":217,"text":"So it's a good question.","zh":"这是一个很好的问题。","start":3016.0,"end":3019.7},{"id":218,"text":"So this task proposer, you can sort of think of it like it shares some similarities with the high-level policy","zh":"因此，这个任务提出者，你可以把它想成与高层策略有一些相似之处","start":3019.82,"end":3025.34},{"id":219,"text":"that's telling you what to do in a certain circumstance, but its purpose is actually quite different.","zh":"它告诉你在某种情况下该做什么，但它的目的实际上完全不同。","start":3025.34,"end":3030.22},{"id":220,"text":"So the purpose here is actually having it propose things that you could do in the environment that you could practice,","zh":"因此，这里的目的是让它提出你在环境中可以做的事情，你可以进行练习，","start":3030.44,"end":3037.02},{"id":221,"text":"whereas in a hierarchical system, the high-level policy goal is to say, like,","zh":"而在分层系统中，高层策略的目标是说，例如，","start":3037.98,"end":3042.2},{"id":222,"text":"what is the next subtask that will achieve some outcome at the end of the day?","zh":"接下来的子任务是什么，最终能够实现某种结果？","start":3042.2,"end":3046.44},{"id":223,"text":"And so this is actually something where you want it to give you lots of different things","zh":"因此，这实际上是希望它给你很多不同的选项","start":3046.92,"end":3050.56},{"id":224,"text":"that allow you to learn lots of different things,","zh":"这些方法允许你学习很多不同的内容，","start":3050.56,"end":3052.8},{"id":225,"text":"whereas a high-level policy, you're much more goal-directed","zh":"而高层次的策略，你则更加目标导向","start":3053.32,"end":3055.84},{"id":226,"text":"in terms of accomplishing some sort of long-term objective.","zh":"在完成某种长期目标方面。","start":3055.84,"end":3057.86},{"id":227,"text":"This particular work chooses to actually use a hierarchical method.","zh":"这项特定的工作选择实际上使用一种分层方法。","start":3059.2,"end":3064.74},{"id":228,"text":"It sort of actually kind of builds upon the...","zh":"它某种程度上实际上是建立在……","start":3066.46,"end":3070.24},{"id":229,"text":"One of the works that we talked about previously, where it actually then feeds this into an image editing diffusion model to generate an image of a generated goal. And then it trains the policy to try to reach this goal image. And one of the things that's nice about this is that with this sort of approach, you need to update this using a reward function for each task.","zh":"我们之前讨论过的一项工作，其中它实际上将这一结果输入到一个图像编辑扩散模型中，以生成一个生成目标的图像。然后它训练策略去尝试达到这个目标图像。其中一件好事是，使用这种方法，你需要为每个任务使用一个奖励函数来更新它。","start":3071.26,"end":3094.72}],"notes":["本段讨论了强化学习在机器人中的应用，特别是任务提议机制与分层学习的区别。讲者提到，任务提议模型可以建议机器人执行的任务，而分层学习则更注重长期目标的实现。任务提议模型的目标是提供多种可练习的任务，而分层学习的高层策略则专注于实现最终目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2916.79,"end":3094.72,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":2916.79,"text":"And this is also kind of like sort of at the bleeding edge of research in some ways."},{"start":2921.63,"text":"The first is that you could predefine a set of tasks and also predefine that graph, saying, like, if you failed task one, then you should practice task two. And obviously, up front, predefine that graph, what you should do in different circumstances, and then act according to that graph."},{"start":2940.24,"text":"Alternatively, you could also kind of train a model that proposes tasks for you to do. And so, for example, in general, I think it's kind of an open question with regard to, like, which tasks you pick to collect for at a given point in time. But you could, for example, ask a language model to say, like, what are the different things that I could do in this environment to get better and actually then practice the task that it describes as output?"},{"start":2965.24,"text":"And so as an example of that, if this is the frame that we're in, then there's certain things that we can do in this task. We could open this toy microwave, we could pick up the banana, we could push the eggplant, move the pot. But if we instead told it to pick up the carrot, that's not something that you can do in the scene."},{"start":2987.12,"text":"And if we're trying to actually train it to do lots of different things, these tasks are going to be scene dependent."},{"start":2992.7,"text":"So then you could ask a VLM to understand, like, think about what are the things that you can do in this environment,"},{"start":3000.1,"text":"and then have it predict, for example, take the banana out of the silver pot."},{"start":3005.76,"text":"And then from there, actually have it practice doing this task versus practicing doing some other task."},{"start":3013.68,"text":"The question is, how is this different from hierarchical learning?"},{"start":3016.0,"text":"So it's a good question."},{"start":3019.82,"text":"So this task proposer, you can sort of think of it like it shares some similarities with the high-level policy"},{"start":3025.34,"text":"that's telling you what to do in a certain circumstance, but its purpose is actually quite different."},{"start":3030.44,"text":"So the purpose here is actually having it propose things that you could do in the environment that you could practice,"},{"start":3037.98,"text":"whereas in a hierarchical system, the high-level policy goal is to say, like,"},{"start":3042.2,"text":"what is the next subtask that will achieve some outcome at the end of the day?"},{"start":3046.92,"text":"And so this is actually something where you want it to give you lots of different things"},{"start":3050.56,"text":"that allow you to learn lots of different things,"},{"start":3053.32,"text":"whereas a high-level policy, you're much more goal-directed"},{"start":3055.84,"text":"in terms of accomplishing some sort of long-term objective."},{"start":3059.2,"text":"This particular work chooses to actually use a hierarchical method."},{"start":3066.46,"text":"It sort of actually kind of builds upon the..."},{"start":3071.26,"text":"One of the works that we talked about previously, where it actually then feeds this into an image editing diffusion model to generate an image of a generated goal. And then it trains the policy to try to reach this goal image. And one of the things that's nice about this is that with this sort of approach, you need to update this using a reward function for each task."}],"speech_gaps":[],"frame":"../frames/v026/018.webp","frame_time":2928.79},{"title":"强化学习在机器人中的应用","segments":[{"id":230,"text":"And it can be quite challenging to define a reward function for all of the different tasks. Whereas if you have an image of the task that you're trying to accomplish, then your reward function can be based on whether or not you're close to this image. And so it makes it easier to define the reward functions. Your question is, would this proposer kind of give those outputs?","zh":"而且，为所有不同的任务定义一个奖励函数可能会相当具有挑战性。然而，如果你有一张你试图完成的任务的图像，那么你的奖励函数可以基于你是否接近这张图像。因此，这使得定义奖励函数变得更加容易。你的问题是，这种提议者是否会给出这些输出？","start":3095.65,"end":3117.93},{"id":231,"text":"Yeah, absolutely. So this sort of framework was applied to these simple robot scenes, but you could also, for example, in the hockey example, ask it, what are the things I could do in this situation? Should I practice passing? Should I practice shooting? For those particular examples, I think it's also reasonable to...","zh":"是的，绝对如此。因此，这种框架被应用于这些简单的机器人场景，但你也可以例如在曲棍球的例子中，问它：在这种情况下，我可以做些什么？我应该练习传球吗？我应该练习射门吗？对于这些特定的例子，我认为这也是合理的……","start":3119.15,"end":3137.19},{"id":232,"text":"just like there's only like a limited number of things that you need to practice.","zh":"就像你只需要练习有限数量的事情一样。","start":3137.81,"end":3141.51},{"id":233,"text":"And so you could just have one session on practicing goals, one session on passing.","zh":"因此，你可以只安排一个会话来练习进球，一个会话来练习传球。","start":3141.59,"end":3145.91},{"id":234,"text":"But yeah, you could also use an idea like this to actually propose what to try to do in different situations.","zh":"但没错，你也可以使用这种想法来实际提出在不同情况下应该尝试做什么。","start":3146.33,"end":3152.57},{"id":235,"text":"Those are a couple autonomous learning algorithms.","zh":"这些都是几种自主学习算法。","start":3154.07,"end":3156.13},{"id":236,"text":"The first category being like algorithms where you try to do the task and then kind of undo the task in various ways.","zh":"第一类是尝试完成任务，然后以各种方式撤销任务的算法。","start":3156.23,"end":3161.19},{"id":237,"text":"The second where you're trying to then kind of try to do one task and then another task and then another task","zh":"第二类是尝试完成一个任务，然后另一个任务，再另一个任务。","start":3161.37,"end":3165.67},{"id":238,"text":"and try to just get better at lots of different tasks all at once.","zh":"并且试图同时在许多不同的任务上变得更好。","start":3165.67,"end":3168.57},{"id":239,"text":"There's also actually some scenarios where you can actually set up the task","zh":"实际上还有一些场景，你可以以一种可以重复执行的方式设置任务。","start":3170.07,"end":3173.03},{"id":240,"text":"in a way that you can do it repeatedly.","zh":"并且不一定有很多关于这个特定想法的研究，","start":3173.03,"end":3174.45},{"id":241,"text":"And there isn't necessarily a lot of research on this particular idea,","zh":"但在这个特定的例子中，目标是折叠餐巾纸","start":3175.69,"end":3182.43},{"id":242,"text":"but in this particular example, the goal is to fold napkins","zh":"对于那些需要折叠大量餐巾纸的商业场合。","start":3182.57,"end":3186.17},{"id":243,"text":"for businesses where you need to fold lots of napkins.","zh":"因此，这些都是我们想要学习策略的情形，","start":3187.99,"end":3190.61},{"id":244,"text":"So those are all circumstances where we want to learn a policy,","zh":"我们的目标是获得一个良好的策略，而不是仅仅有点模糊的","start":3191.31,"end":3193.81},{"id":245,"text":"and we like our goal is to get a good policy rather than simply kind of the","zh":"而且我们希望我们的目标是获得一个好的策略，而不仅仅是某种类型的","start":3193.81,"end":3198.99},{"id":246,"text":"Mars Rover example where we want to maximize rewards there's also the second","zh":"火星探测车的例子，我们希望在那里最大化奖励，还有第二种情况","start":3198.99,"end":3203.83},{"id":247,"text":"category of problems and the motivation is that you've been trying to learn","zh":"问题的第二类，其动机是你一直在尝试学习策略而不进行重置，你可以通过练习来提高策略的质量","start":3203.83,"end":3210.79},{"id":248,"text":"policies without resets you can improve the quality of policy through practice","zh":"但随后在某个时候，我们实际上会部署这个策略，理想情况下","start":3210.79,"end":3213.91},{"id":249,"text":"but then at some point we're actually gonna be deploying the policy and ideally","zh":"这个策略会表现得相当好。也许你处于一个显然","start":3214.55,"end":3219.15},{"id":250,"text":"this policy will be pretty good. And maybe you're in a scenario where obviously","zh":"一切都会完美运作的场景，当你实际部署策略时，什么都不会出错","start":3219.15,"end":3223.73},{"id":251,"text":"everything's going to work perfectly, nothing will ever go wrong when you actually go","zh":"但在实践中并非如此。而自然世界","start":3223.73,"end":3227.01},{"id":252,"text":"and deploy your policy. But in practice, that's not the case. And the natural world","zh":"即使经过大量训练，事情仍会出错。这种后一种情况是在我们学习了某种策略之后，当它独自在世界中运行时，它能否从错误中恢复并在部署过程之后继续学习？","start":3227.01,"end":3232.13},{"id":253,"text":"things will go wrong despite having a lot of training. And this latter setting is thinking about after we've learned some sort of policy, when it's out in the world on its own, can it recover from mistakes and learn kind of after the deployment process? And this is something that even humans do to some extent. So here's a video where a person is trying to open a door.","zh":"即使进行了大量训练，事情仍可能出错。而后者的情况是在我们已经学习出某种策略之后，当它独自处于现实世界中时，它能否从错误中恢复并在部署过程之后继续学习？这在某种程度上也是人类所做的。这里有一个视频，展示一个人试图打开一扇门。","start":3233.16,"end":3261.07}],"notes":["本段讨论了在机器人学习中定义奖励函数的挑战，以及如何通过任务图像来简化这一过程。讲者提到，如果有一个任务的图像，奖励函数可以基于是否接近该图像来定义，这使得定义奖励函数更容易。此外，讲者还提到，像冰球示例这样的场景中，可以询问机器人应该练习哪些动作，如传球或射门，这表明在某些情况下，有限的动作集合是合理的。","讲者进一步说明了自主学习算法的两种类型：第一类是尝试完成任务并以不同方式撤销任务的算法，第二类是尝试完成多个任务并同时提高所有任务性能的算法。这表明，强化学习可以用于设计能够处理多种任务的策略。","讲者还提到，某些场景可以通过重复执行任务来设置任务，例如需要折叠大量餐巾纸的商业场景。这表明，强化学习可以用于设计能够重复执行任务的策略，从而提高效率。","讲者指出，虽然在某些情况下可以假设任务执行完美无误，但在实际中，自然世界中可能会出现错误，即使有大量训练。因此，讲者强调了在部署策略后，策略能否从错误中恢复并继续学习的重要性，这与人类的学习过程类似。","讲者最后提到，一个视频示例展示了一个人尝试打开门的过程，这表明在实际应用中，策略需要能够处理意外情况并进行调整。","讲者通过多个例子说明了强化学习在机器人中的应用，包括定义奖励函数、设计自主学习算法、处理任务重复以及策略的部署与调整。这些例子展示了强化学习在实际场景中的多样性和实用性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3095.65,"end":3261.07,"asr_flags":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":3095.65,"text":"And it can be quite challenging to define a reward function for all of the different tasks. Whereas if you have an image of the task that you're trying to accomplish, then your reward function can be based on whether or not you're close to this image. And so it makes it easier to define the reward functions. Your question is, would this proposer kind of give those outputs?"},{"start":3119.15,"text":"Yeah, absolutely. So this sort of framework was applied to these simple robot scenes, but you could also, for example, in the hockey example, ask it, what are the things I could do in this situation? Should I practice passing? Should I practice shooting? For those particular examples, I think it's also reasonable to..."},{"start":3137.81,"text":"just like there's only like a limited number of things that you need to practice."},{"start":3141.59,"text":"And so you could just have one session on practicing goals, one session on passing."},{"start":3146.33,"text":"But yeah, you could also use an idea like this to actually propose what to try to do in different situations."},{"start":3154.07,"text":"Those are a couple autonomous learning algorithms."},{"start":3156.23,"text":"The first category being like algorithms where you try to do the task and then kind of undo the task in various ways."},{"start":3161.37,"text":"The second where you're trying to then kind of try to do one task and then another task and then another task"},{"start":3165.67,"text":"and try to just get better at lots of different tasks all at once."},{"start":3170.07,"text":"There's also actually some scenarios where you can actually set up the task"},{"start":3173.03,"text":"in a way that you can do it repeatedly."},{"start":3175.69,"text":"And there isn't necessarily a lot of research on this particular idea,"},{"start":3182.57,"text":"but in this particular example, the goal is to fold napkins"},{"start":3187.99,"text":"for businesses where you need to fold lots of napkins."},{"start":3191.31,"text":"So those are all circumstances where we want to learn a policy,"},{"start":3193.81,"text":"and we like our goal is to get a good policy rather than simply kind of the"},{"start":3198.99,"text":"Mars Rover example where we want to maximize rewards there's also the second"},{"start":3203.83,"text":"category of problems and the motivation is that you've been trying to learn"},{"start":3210.79,"text":"policies without resets you can improve the quality of policy through practice"},{"start":3214.55,"text":"but then at some point we're actually gonna be deploying the policy and ideally"},{"start":3219.15,"text":"this policy will be pretty good. And maybe you're in a scenario where obviously"},{"start":3223.73,"text":"everything's going to work perfectly, nothing will ever go wrong when you actually go"},{"start":3227.01,"text":"and deploy your policy. But in practice, that's not the case. And the natural world"},{"start":3233.16,"text":"things will go wrong despite having a lot of training. And this latter setting is thinking about after we've learned some sort of policy, when it's out in the world on its own, can it recover from mistakes and learn kind of after the deployment process? And this is something that even humans do to some extent. So here's a video where a person is trying to open a door."}],"speech_gaps":[],"frame":"../frames/v026/019.webp","frame_time":3107.65},{"title":"强化学习在机器人中的应用","segments":[{"id":254,"text":"And if you look really carefully, you'll notice that actually the person makes a mistake and then adapts really in like a split second in order to accomplish the task. So if you play this video again, we'll see that right here, the person is trying to apply force and the key actually isn't correctly in the hole. And then they kind of try again by removing the key backwards and then putting it back into the keyhole.","zh":"如果你仔细观察，你会发现实际上这个人犯了一个错误，然后几乎在一瞬间就适应了以完成任务。所以如果你再次播放这段视频，我们会看到这里，这个人试图施加力量，但实际上钥匙并没有正确地插入锁孔中。然后他们尝试再次插入钥匙，先将钥匙向后取出，再重新插入钥匙孔。","start":3261.57,"end":3287.75},{"id":255,"text":"And there's lots of examples like this, hopefully, that you've encountered in your own deployed policy. And we'd like to think about this setting where we could actually adapt within an episode during deployment. So in terms of how this compares to previous algorithms, we've talked about, like, a lot of the course has been talking about this episodic setting where you attempt it from the initial state repeatedly and then deploy the policy once.","zh":"有很多这样的例子，希望你们在自己的部署策略中也遇到过。我们想考虑一种设置，即在部署过程中可以在一个episode内进行适应。就与之前算法的比较而言，我们之前讨论了很多关于这种episode设置的内容，即从初始状态重复尝试任务，然后部署策略。","start":3288.78,"end":3316.69},{"id":256,"text":"We also talked today about this reset-free setting, where you learn how to kind of attempt the task, undo the task repeatedly, and then want to deploy your policy. And this more recent setting is something where you have some prior training data. Maybe you've trained a policy, and you're in some sort of new out-of-distribution circumstance, and as you're trying to actually do the task,","zh":"我们今天还讨论了这种无需重置的设置，即学习如何尝试任务、撤销任务并重复，然后部署策略。这种更近期的设置是，你有一些先前的训练数据。也许你已经训练了一个策略，现在处于某种新的分布外情境中，当你试图完成任务时，","start":3317.19,"end":3343.11},{"id":257,"text":"Because you're in some new circumstances, you need to do some problem solving and actually adapt and learn during deployment, during a single episode, without resets.","zh":"由于你处于新的情境中，你需要进行问题解决，并且在部署过程中，即在一个episode内，无需重置地进行适应和学习。","start":3344.66,"end":3353.96},{"id":258,"text":"And so you can sort of think of this as like after kind of previous data or previous training, you have one life to autonomously complete the task.","zh":"因此，你可以将这种情况想象成，在之前的数据显示或训练之后，你只有一次机会自主完成任务。","start":3357.16,"end":3365.06},{"id":259,"text":"As a fairly simple example, maybe you have training experience on like in a flat like","zh":"作为一个相对简单的例子，也许你有在平坦地面上跑步的训练经验，","start":3367.84,"end":3373.76},{"id":260,"text":"running in like flat ground and then at some point you encounter some obstacle that you","zh":"然后在某个时候遇到了之前没有见过的障碍物，","start":3373.76,"end":3377.96},{"id":261,"text":"haven't seen before and you need to figure out how to get over this obstacle despite","zh":"你需要想办法克服这个障碍物，尽管你之前没有遇到过。","start":3377.96,"end":3382.62},{"id":262,"text":"not having seen this during training and you want to use reinforcement learning or use some","zh":"在训练过程中没有见过这种情况，并且你想要使用强化学习或使用一些来自强化学习的想法来适应新的情况，这些情况存在于一个episode中。","start":3382.62,"end":3386.9},{"id":263,"text":"ideas from reinforcement learning to adapt to the new circumstances live within an episode.","zh":"有人这样说。因此，我们可能会考虑，比如，是否可以在测试时继续使用强化学习来微调我们的策略？例如，如果我们犯了一个错误，比如，我们是否可以像在执行策略时那样，使用TD更新或策略梯度来实时更新我们的策略？","start":3386.9,"end":3392.6},{"id":264,"text":"said. So one thing we might think about is, like, can we just run, can we continue to fine-tune our","zh":"said. 所以，我们可能会想到的一件事是，比如，我们是否可以继续微调我们的","start":3392.6,"end":3400.82},{"id":265,"text":"policy with reinforcement learning at test time? If, for example, we make a mistake, like, maybe","zh":"在测试时使用强化学习的策略？例如，如果我们犯了一个错误，比如，也许","start":3400.82,"end":3406.02},{"id":266,"text":"we can just update our policy with, like, TD updates or policy gradients, like, live as we're","zh":"我们可以像使用TD更新或策略梯度那样，实时地更新我们的策略","start":3406.02,"end":3412.78},{"id":267,"text":"rolling out our policy. And so if we actually do that, so we train a policy and then try to","zh":" rollout 我们的策略。因此，如果我们实际这样做，我们训练一个策略，然后尝试","start":3412.78,"end":3420.52},{"id":268,"text":"to fine tune it, um, at test time with, uh, with this sort of obstacle, uh, we get something that","zh":"为了在测试时对它进行微调，嗯，有了这种障碍物，嗯，我们得到了一些东西","start":3420.52,"end":3427.56},{"id":269,"text":"looks like this. So, uh, the policy actually does figure out how to get over the first obstacle,","zh":"看起来是这样的。所以，嗯，策略实际上确实会想办法越过第一个障碍，","start":3427.56,"end":3431.7},{"id":270,"text":"even though it has never seen that obstacle before. Um, and then eventually it actually","zh":"即使它以前从未见过那个障碍物。嗯，然后最终它实际上","start":3431.84,"end":3437.8}],"notes":["本段讨论了强化学习在机器人中的应用，特别是如何在部署过程中进行适应。讲者通过一个实际例子说明了人在执行任务时如何快速适应错误，这与强化学习中在部署过程中进行适应的概念相似。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3261.57,"end":3437.8,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":3261.57,"text":"And if you look really carefully, you'll notice that actually the person makes a mistake and then adapts really in like a split second in order to accomplish the task. So if you play this video again, we'll see that right here, the person is trying to apply force and the key actually isn't correctly in the hole. And then they kind of try again by removing the key backwards and then putting it back into the keyhole."},{"start":3288.78,"text":"And there's lots of examples like this, hopefully, that you've encountered in your own deployed policy. And we'd like to think about this setting where we could actually adapt within an episode during deployment. So in terms of how this compares to previous algorithms, we've talked about, like, a lot of the course has been talking about this episodic setting where you attempt it from the initial state repeatedly and then deploy the policy once."},{"start":3317.19,"text":"We also talked today about this reset-free setting, where you learn how to kind of attempt the task, undo the task repeatedly, and then want to deploy your policy. And this more recent setting is something where you have some prior training data. Maybe you've trained a policy, and you're in some sort of new out-of-distribution circumstance, and as you're trying to actually do the task,"},{"start":3344.66,"text":"Because you're in some new circumstances, you need to do some problem solving and actually adapt and learn during deployment, during a single episode, without resets."},{"start":3357.16,"text":"And so you can sort of think of this as like after kind of previous data or previous training, you have one life to autonomously complete the task."},{"start":3367.84,"text":"As a fairly simple example, maybe you have training experience on like in a flat like"},{"start":3373.76,"text":"running in like flat ground and then at some point you encounter some obstacle that you"},{"start":3377.96,"text":"haven't seen before and you need to figure out how to get over this obstacle despite"},{"start":3382.62,"text":"not having seen this during training and you want to use reinforcement learning or use some"},{"start":3386.9,"text":"ideas from reinforcement learning to adapt to the new circumstances live within an episode."},{"start":3392.6,"text":"said. So one thing we might think about is, like, can we just run, can we continue to fine-tune our"},{"start":3400.82,"text":"policy with reinforcement learning at test time? If, for example, we make a mistake, like, maybe"},{"start":3406.02,"text":"we can just update our policy with, like, TD updates or policy gradients, like, live as we're"},{"start":3412.78,"text":"rolling out our policy. And so if we actually do that, so we train a policy and then try to"},{"start":3420.52,"text":"to fine tune it, um, at test time with, uh, with this sort of obstacle, uh, we get something that"},{"start":3427.56,"text":"looks like this. So, uh, the policy actually does figure out how to get over the first obstacle,"},{"start":3431.84,"text":"even though it has never seen that obstacle before. Um, and then eventually it actually"}],"speech_gaps":[],"frame":"../frames/v026/020.webp","frame_time":3273.57},{"title":"强化学习在机器人中的应用与挑战","segments":[{"id":271,"text":"kind of gets stuck, uh, on like flipped over. And even though it's running reinforcement learning,","zh":"它似乎会卡住，比如翻倒了。尽管它正在运行强化学习，","start":3437.8,"end":3443.66},{"id":272,"text":"um, and you can see it's kind of, it is somewhat like trying to get up. Uh, it essentially gets","zh":"你也可以看到它有点像在尝试起身。实际上，它会","start":3443.78,"end":3449.3},{"id":273,"text":"it's stuck. And even though you're kind of still running reinforcement learning, still running the","zh":"陷入困境。尽管你仍在运行强化学习，仍在运行策略并进行更新，但它无法从这些它","start":3449.3,"end":3453.28},{"id":274,"text":"policy and still running updates, it isn't able to recover from these kinds of states that it","zh":"之前没有见过的状态中恢复，除非有干预。理想情况下，我们希望有一个策略，能够","start":3453.28,"end":3459.24},{"id":275,"text":"hasn't seen before without, like on its own, without interventions. And ideally, we'd have","zh":"自行判断如何起身，并在部署期间在这些新情况下重新尝试。现在，这也是一个","start":3459.24,"end":3464.92},{"id":276,"text":"a policy that could figure out like how to get up and how to retry like during deployment in","zh":"处于研究前沿的问题，我将简要提及一些已被提出的思路，","start":3464.92,"end":3470.48},{"id":277,"text":"these sort of new circumstances. Now, this is also something that's like kind of bleeding","zh":"这些思路","start":3470.48,"end":3478.98},{"id":278,"text":"edge of research and I'll just mention a few ideas that have been proposed that","zh":"正在逐渐渗透到研究的边缘，我将提到一些已被提出的思路，","start":3478.98,"end":3483.42},{"id":279,"text":"seem to be quite helpful for addressing this sort of problem. One is that when","zh":"似乎对于解决这类问题非常有帮助。其中一个原因是当","start":3483.42,"end":3490.6},{"id":280,"text":"you're getting stuck you're kind of you end up in the state that it's hard to","zh":"你陷入困境时，你最终会进入一个很难恢复的状态，而如果你在进行强化学习更新，说","start":3491.16,"end":3494.92},{"id":281,"text":"recover from and if you're doing reinforcement learning updates say that","zh":"你正在运行你的策略，但某种方式下你却卡在这里了，","start":3494.92,"end":3498.82},{"id":282,"text":"you are like running your policy and somehow you get kind of stuck right here","zh":"你正在运行强化学习更新，你正在运行强化学习","start":3498.82,"end":3502.58},{"id":283,"text":"you are running reinforcement learning updates you are running reinforcement","zh":"个人的更新，以完成到达目标的任务。","start":3502.58,"end":3507.38},{"id":284,"text":"personally, updates with regard to the task of getting to the goal.","zh":"而如果你不是尝试运行强化学习更新以到达目标，","start":3507.38,"end":3510.14},{"id":285,"text":"And if instead of trying to run RL updates to get to the goal,","zh":"而是尝试运行强化学习更新以回到熟悉的状态，","start":3511.24,"end":3515.06},{"id":286,"text":"if you instead try to run RL updates to kind of get back to states that are familiar,","zh":"如果你尝试运行强化学习更新，以回到一些熟悉的狀態，","start":3515.18,"end":3520.26},{"id":287,"text":"like good states that you visited in your previous experience,","zh":"比如你之前经验中访问过的良好状态，","start":3520.42,"end":3523.48},{"id":288,"text":"then you might have a better time at getting unstuck where, for example, these states might be closer to the ones that are at the goal and help perturb the agent kind of back to something that it knows so that it could then continue doing the task.","zh":"那么你可能在摆脱困境时表现得更好，例如，这些状态可能更接近目标状态，并帮助扰动智能体回到它已知的状态，从而能够继续执行任务。","start":3524.3,"end":3549.04},{"id":289,"text":"So, for example, if you learned a skill for a kind of a pre-trained skill for walking forward and a pre-trained skill for kind of getting back on your feet, then instead of trying to kind of continue walk forward in that new state, if you try to explore the different skills that you have and explore the state of getting back up, then you might be able to actually be more successful at handling these sort of circumstances. Because you're basically able to try different strategies rather than just trying different actions or different weights.","zh":"例如，如果你学习了一个预训练的向前行走技能和一个预训练的重新站立技能，那么与其在新状态下继续尝试向前行走，不如探索你拥有的不同技能，并探索重新站立的状态，这样你可能能够更成功地处理这些情况。因为你实际上能够尝试不同的策略，而不仅仅是尝试不同的动作或不同的权重。","start":3549.72,"end":3573.17},{"id":290,"text":"So, for example, if you learned a skill for a kind of a pre-trained skill for walking forward and a pre-trained skill for kind of getting back on your feet, then instead of trying to kind of continue walk forward in that new state, if you try to explore the different skills that you have and explore the state of getting back up, then you might be able to actually be more successful at handling these sort of circumstances. Because you're basically able to try different strategies rather than just trying different actions or different weights.","zh":"例如，如果你学习了一个预训练的向前行走技能和一个预训练的重新站立技能，那么与其在新状态下继续尝试向前行走，不如探索你拥有的不同技能，并探索重新站立的状态，这样你可能能够更成功地处理这些情况。因为你实际上能够尝试不同的策略，而不仅仅是尝试不同的动作或不同的权重。","start":3573.97,"end":3600.77}],"notes":["本段讨论了强化学习在机器人中应用时遇到的挑战，特别是当机器人陷入未见过的状态时，无法自行恢复的问题。讲者指出，即使在持续运行强化学习和更新策略的情况下，机器人也可能无法从这些新状态中恢复，需要外部干预。","讲者提出了一种解决方案，即在遇到困境时，机器人应尝试通过回到熟悉的状态来恢复，而不是直接尝试到达目标。这些熟悉的状态可能更接近目标，有助于扰动机器人回到已知状态，从而继续执行任务。","另一个解决方案是利用预训练技能。讲者指出，在低层次动作空间中，仅能对策略进行有限的调整，而如果能在更高层次空间中进行调整，例如使用预训练的技能，就可以更大幅度地改变策略，而不是仅仅调整权重或动作。","讲者以预训练的行走技能和重新站立技能为例，说明机器人可以通过探索不同的技能来应对新情况，而不是仅仅尝试不同的动作或权重。这种方法允许机器人尝试不同的策略，从而提高处理新情况的成功率。","讲者强调，这些方法是当前研究的前沿，虽然已经提出了一些有帮助的思路，但仍然需要进一步探索和验证。","讲者提到，这些方法的核心思想是通过利用已有的经验或预训练技能，帮助机器人在遇到新状态时更有效地恢复和继续任务，而不是完全依赖强化学习的更新过程。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3437.8,"end":3600.77,"asr_flags":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":3437.8,"text":"kind of gets stuck, uh, on like flipped over. And even though it's running reinforcement learning,"},{"start":3443.78,"text":"um, and you can see it's kind of, it is somewhat like trying to get up. Uh, it essentially gets"},{"start":3449.3,"text":"it's stuck. And even though you're kind of still running reinforcement learning, still running the"},{"start":3453.28,"text":"policy and still running updates, it isn't able to recover from these kinds of states that it"},{"start":3459.24,"text":"hasn't seen before without, like on its own, without interventions. And ideally, we'd have"},{"start":3464.92,"text":"a policy that could figure out like how to get up and how to retry like during deployment in"},{"start":3470.48,"text":"these sort of new circumstances. Now, this is also something that's like kind of bleeding"},{"start":3478.98,"text":"edge of research and I'll just mention a few ideas that have been proposed that"},{"start":3483.42,"text":"seem to be quite helpful for addressing this sort of problem. One is that when"},{"start":3491.16,"text":"you're getting stuck you're kind of you end up in the state that it's hard to"},{"start":3494.92,"text":"recover from and if you're doing reinforcement learning updates say that"},{"start":3498.82,"text":"you are like running your policy and somehow you get kind of stuck right here"},{"start":3502.58,"text":"if you're running reinforcement learning updates you are running reinforcement"},{"start":3507.38,"text":"personally, updates with regard to the task of getting to the goal."},{"start":3511.24,"text":"And if instead of trying to run RL updates to get to the goal,"},{"start":3515.18,"text":"if you instead try to run RL updates to kind of get back to states that are familiar,"},{"start":3520.42,"text":"like good states that you visited in your previous experience,"},{"start":3524.3,"text":"then you might have a better time at getting unstuck where, for example, these states might be closer to the ones that are at the goal and help perturb the agent kind of back to something that it knows so that it could then continue doing the task. So that's one id
