ea. And then another idea is to try to leverage pre-training. So if you're trying to run reinforcement learning,"},{"start":3549.72,"text":"on the policy weights, like in the low-level action space, you can only change the policy so much. And there's only so many ways you can adapt. And if instead you could adapt in a higher-level space, like if you had some sort of pre-trained skills, then you might be able to actually adapt more drastically and actually try to change a strategy that you're taking rather than just changing the weights or the actions that you're using."},{"start":3573.97,"text":"So, for example, if you learned a skill for a kind of a pre-trained skill for walking forward and a pre-trained skill for kind of getting back on your feet, then instead of trying to kind of continue walk forward in that new state, if you try to explore the different skills that you have and explore the state of getting back up, then you might be able to actually be more successful at handling these sort of circumstances. Because you're basically able to try different strategies rather than just trying different actions or different weights."}],"speech_gaps":[],"frame":"../frames/v026/021.webp","frame_time":3449.8},{"title":"强化学习在机器人中的应用","segments":[{"id":291,"text":"The other thing here is that pre-trained LLMs might have some sort of common sense reasoning that can allow an agent to adapt in novel circumstances as well and try different strategies. Let's look at a couple examples of these ideas in practice. If we take the first idea that's trying to guide the agent with reinforcement learning to familiar states rather than to the goal, we can actually run it on that same example.","zh":"这里还有另一点，就是预训练的大型语言模型可能具备某种常识推理能力，这可以让智能体在新环境中适应并尝试不同的策略。让我们看看这些想法在实际中的几个例子。如果我们采用第一个想法，即通过强化学习引导智能体回到熟悉的状态而不是直接到达目标，我们实际上可以在同一个例子上运行它。","start":3602.26,"end":3628.3},{"id":292,"text":"And we see that the agent does actually, I mean, this is still an out-of-distribution environment. It does get stuck on its back, but it is able to, for example, get back up after trying. So here it's stuck on its back. It's trying to get back to a state that's familiar, for example, a state where it's on its feet. And it's able to eventually recover from that after a bit of attempts.","zh":"我们看到智能体确实能够做到这一点，我的意思是，这仍然是一个分布外的环境。它会卡在背部，但它能够尝试后重新站起来。例如，它卡在背部时，会尝试回到熟悉的状态，比如站立的状态。经过一些尝试后，它最终能够从这种状态中恢复过来。","start":3628.96,"end":3654.52},{"id":293,"text":"make it to the goal state. And then in terms of adopting, and we talked about adopting the low-level space and in the high-level space, this first example is a system that was trained to be able to adopt kind of in the low-level space from recent history. And this is able to handle kind of some small auto-distribution scenarios where it's like on different terrains.","zh":"让它到达目标状态。在采用方面，我们讨论了在低层空间和高层空间中进行采用。这个第一个例子是一个系统，它被训练以能够在低层空间中从近期历史中进行适应。它能够处理一些小的分布变化场景，比如在不同的地形上。","start":3658.04,"end":3682.47},{"id":294,"text":"But if you have things that are kind of more drastically different from what you've seen before, it can be very helpful to adapt in a more high-level space. And so what that could look like is say that you have this legged robot that's trying to reach a goal over here.","zh":"但如果你面对的是与之前见过的情况差异较大的情况，那么在高层空间中进行适应可能会非常有帮助。这可能表现为，例如，你有一个腿式机器人，试图到达这边的目标。","start":3684.26,"end":3699.83},{"id":295,"text":"then if, for example, all the agent sees is this image right here, tries to go forward, goes backward. If you just keep on running a policy without any sort of context, it'll just keep on trying to go forward because it doesn't know that it kind of tried going forward before.","zh":"如果，例如，智能体只看到这张图片，尝试前进，然后后退。如果你只是持续运行一个策略而没有任何上下文，它就会一直尝试前进，因为它不知道之前已经尝试过前进。","start":3701.04,"end":3717.76},{"id":296,"text":"If instead you try different strategies like moving left, moving backwards with context and adaptation, then you can figure out how to ultimately, even though the agent in this particular case has never seen this environment before, it's able to kind of problem solve its way through these different obstacles and navigating to a goal position.","zh":"如果相反，你尝试不同的策略，比如在有上下文和适应的情况下向左移动或后退，那么你就能最终弄清楚如何，即使这个智能体在这个特定情况下从未见过这个环境，它也能够通过解决问题的方式穿越这些不同的障碍，导航到目标位置。","start":3718.77,"end":3740.39},{"id":297,"text":"This is something where if you adapted in like kind of the low-level motor space, like trying","zh":"这属于一种情况，如果你在低层运动空间中进行适应，比如尝试","start":3741.27,"end":3745.59},{"id":298,"text":"out different positions of your joints, then it would be very tricky to try to problem solve","zh":"如果你的关节处于不同的位置，那么试图解决问题将会非常棘手","start":3745.59,"end":3752.21},{"id":299,"text":"through this sort of circumstance. Cool. So that was a brief foray into this sort of single life","zh":"在这种情况下进行这样的思考。酷。所以这就是我们对这种单一情境的简要探索","start":3752.21,"end":3760.19},{"id":300,"text":"reinforcement learning setting. Yeah, good question. So how do we make in safety constraints?","zh":"是的，这是一个好问题。那么我们如何在安全约束下进行操作？","start":3760.19,"end":3765.11},{"id":301,"text":"So, yeah, another circumstance that might require human oversight is if you're in, like, scenarios where you could make, like, safety-critical mistakes.","zh":"是的，另一种可能需要人类监督的情境是，当你处于可能犯下安全关键性错误的场景中","start":3765.11,"end":3775.17},{"id":302,"text":"Like, if you are a legged robot, you can, like, fall in a way that damages the robot.","zh":"例如，如果你是一个腿式机器人，你可能会以一种损坏机器人的方式摔倒","start":3775.39,"end":3781.33}],"notes":["本段讨论了强化学习在机器人中的应用，特别是如何通过在低层次和高层次空间进行适应来处理不同环境。在低层次空间中，机器人通过尝试不同的关节位置来适应环境，但在这种情况下，问题解决会非常困难。而在高层次空间中，机器人可以通过上下文和适应策略来处理更复杂的环境变化。","讲者提到，如果机器人在没有上下文的情况下运行策略，它可能会重复相同的动作，例如一直向前移动，而不会意识到之前已经尝试过。然而，通过引入不同的策略，如向左移动或向后移动，机器人可以逐步解决问题并到达目标位置。","在高层次空间中，机器人能够利用上下文信息进行适应，从而在未见过的环境中进行问题解决。这种适应能力对于处理不同地形和复杂障碍物至关重要。","讲者还提到，如果机器人在低层次空间中进行适应，例如尝试不同的关节位置，那么在面对复杂环境时，问题解决会变得非常困难。因此，高层次空间的适应策略更为有效。","此外，讲者指出，在某些安全关键的场景中，可能需要人类监督，以防止机器人做出可能损坏自身或环境的错误动作。例如，腿部机器人如果以错误的方式摔倒，可能会导致损坏。","最后，讲者提到如何在强化学习中引入安全约束，以确保机器人在执行任务时不会违反安全条件。这可能涉及到在训练过程中加入安全机制或使用人类监督来确保安全性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3602.26,"end":3781.33,"asr_flags":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":3602.26,"text":"The other thing here is that pre-trained LLMs might have some sort of common sense reasoning that can allow an agent to adapt in novel circumstances as well and try different strategies. Let's look at a couple examples of these ideas in practice. If we take the first idea that's trying to guide the agent with reinforcement learning to familiar states rather than to the goal, we can actually run it on that same example."},{"start":3628.96,"text":"And we see that the agent does actually, I mean, this is still an out-of-distribution environment. It does get stuck on its back, but it is able to, for example, get back up after trying. So here it's stuck on its back. It's trying to get back to a state that's familiar, for example, a state where it's on its feet. And it's able to eventually recover from that after a bit of attempts."},{"start":3658.04,"text":"make it to the goal state. And then in terms of adopting, and we talked about adopting the low-level space and in the high-level space, this first example is a system that was trained to be able to adopt kind of in the low-level space from recent history. And this is able to handle kind of some small auto-distribution scenarios where it's like on different terrains."},{"start":3684.26,"text":"But if you have things that are kind of more drastically different from what you've seen before, it can be very helpful to adapt in a more high-level space. And so what that could look like is say that you have this legged robot that's trying to reach a goal over here."},{"start":3701.04,"text":"then if, for example, all the agent sees is this image right here, tries to go forward, goes backward. If you just keep on running a policy without any sort of context, it'll just keep on trying to go forward because it doesn't know that it kind of tried going forward before."},{"start":3718.77,"text":"If instead you try different strategies like moving left, moving backwards with context and adaptation, then you can figure out how to ultimately, even though the agent in this particular case has never seen this environment before, it's able to kind of problem solve its way through these different obstacles and navigating to a goal position."},{"start":3741.27,"text":"This is something where if you adapted in like kind of the low-level motor space, like trying"},{"start":3745.59,"text":"out different positions of your joints, then it would be very tricky to try to problem solve"},{"start":3752.21,"text":"through this sort of circumstance. Cool. So that was a brief foray into this sort of single life"},{"start":3760.19,"text":"reinforcement learning setting. Yeah, good question. So how do we make in safety constraints?"},{"start":3765.11,"text":"So, yeah, another circumstance that might require human oversight is if you're in, like, scenarios where you could make, like, safety-critical mistakes."},{"start":3775.39,"text":"Like, if you are a legged robot, you can, like, fall in a way that damages the robot."}],"speech_gaps":[],"frame":"../frames/v026/022.webp","frame_time":3614.26},{"title":"强化学习在机器人中的应用与安全学习","segments":[{"id":303,"text":"If you're a manipulator, you could, like, drop, like, glass onto the floor.","zh":"如果你是一个操作臂，你可能会像这样把玻璃掉到地板上。","start":3781.99,"end":3785.95},{"id":304,"text":"You could also, like, hit objects pretty hard.","zh":"你也可以像这样用力击打物体。","start":3786.13,"end":3789.09},{"id":305,"text":"there's actually work that that builds very directly upon some of these","zh":"实际上有一些工作直接建立在这些想法之上","start":3789.09,"end":3795.63},{"id":306,"text":"ideas where you actually try to learn learn some notion of safety and learn","zh":"其中你实际上尝试学习某种安全的概念，并学习","start":3795.63,"end":3799.45},{"id":307,"text":"when you're actually in a high-risk state and then go back to a state that","zh":"当你处于高风险状态时，然后回到一个风险较低的状态，","start":3799.45,"end":3803.39},{"id":308,"text":"is less risky so you could actually learn for example like a recovery policy","zh":"这样你就可以实际学习例如一种恢复策略","start":3803.39,"end":3807.35},{"id":309,"text":"that tries to get back to states that you are known to be less risky and and","zh":"该策略尝试回到你已知风险较低和更安全的状态，并且","start":3807.35,"end":3811.59},{"id":310,"text":"and more safe and so these ideas actually some of these ideas actually","zh":"并且这些想法实际上一些这些想法实际上","start":3811.59,"end":3815.51},{"id":311,"text":"we're actually like","zh":"我们实际上像","start":3815.51,"end":3818.49},{"id":312,"text":"several years ago, studied in sort of safety settings. The other practical thing to do is to try to, to the extent possible, try to impose safety constraints on the controller itself so that, for example, you're not using the motors to the point in which they'll overheat or minimize, like, have a box around the robot that doesn't allow it to, for example, like...","zh":"几年前，曾在某种安全设置中进行过研究。另一个实际要做的是，尽可能地在控制器本身上施加安全约束，例如，不要让电机运行到过热的程度，或者最小化，比如，在机器人的周围设置一个区域，不允许它，例如，像……","start":3819.37,"end":3844.11},{"id":313,"text":"apply a lot of force to different parts of the state space. Now, that's not possible everywhere. And learning notions of safety might be the only way to actually kind of address the problem in general. Although to learn safety, you need examples of failing. So it's generally a pretty tricky problem. And yeah, I guess those are my main thoughts on that.","zh":"对状态空间的不同部分施加大量力。然而，这并不是在所有地方都可能实现的。学习安全的概念可能是解决这个问题的唯一方法。尽管要学习安全，需要失败的例子。因此，这通常是一个相当棘手的问题。嗯，我想这就是我对这个问题的主要想法。","start":3844.65,"end":3866.61},{"id":314,"text":"Yeah, so you could also, the question is maybe you could, when navigating around people, you could try to ask a VLM, like,","zh":"是的，你也可以，问题是也许你可以，当在人群周围导航时，你可以尝试向一个视觉语言模型（VLM）提问，","start":3867.44,"end":3874.08},{"id":315,"text":"what you might try to do at a high level in different circumstances. And this work right here actually was using a VLM to indicate with past experience what are good strategies to try. And so these models may have some sort of common sense. So you just see maybe you shouldn't walk or run into a person, for example, or maybe you should wait, that sort of thing. And so leveraging that sort of common sense in those models.","zh":"在不同情况下你可能会尝试在高层做什么。而这项工作实际上就是利用一个VLM，根据过去的经验来指示哪些策略是值得尝试的。因此，这些模型可能具有一些常识。例如，你可能会看到你不应该走进或撞到一个人，或者可能应该等待，诸如此类的事情。因此，利用这些模型中的这种常识。","start":3875.14,"end":3903.52},{"id":316,"text":"is fairly promising. Cool. Great. So to summarize, we talked about why reinforcement learning algorithms don't already give robots autonomous learning capabilities and kind of...","zh":"是相当有前景的。酷。很好。总结一下，我们讨论了为什么强化学习算法本身并没有赋予机器人自主学习的能力，并且……","start":3904.04,"end":3917.86},{"id":317,"text":"defined the problem, defined a couple instances of this problem where we either want to think about the lifetime of rewards or learning a good policy. And we talked about algorithms for each of those where we try to, for example, learn a backward policy, learn a task graph, and try different tasks, and also single life RL to prevent drift.","zh":"定义了这个问题，定义了这个问题的一些实例，我们或者是想要考虑奖励的生命周期，或者是学习一个好策略。我们还讨论了针对这些实例的算法，例如，学习一个反向策略，学习一个任务图，并尝试不同的任务，以及使用单次生命强化学习来防止漂移。","start":3918.62,"end":3937.9}],"notes":["本段讨论了强化学习在机器人中的应用，特别是安全学习的重要性。讲者提到，机器人需要学习如何识别高风险状态，并采取措施回到更安全的状态，例如通过学习恢复策略。此外，讲者还提到，为了确保安全性，可以在控制器中加入安全约束，例如防止电机过热或避免在状态空间中施加过多力。然而，这些方法并非在所有情况下都可行，因此学习安全性的概念可能是解决这一问题的关键。但学习安全性需要失败的例子，因此这是一个相当复杂的问题。","讲者还提到，使用视觉语言模型（VLM）来指导机器人在不同情境下采取合适的策略，例如避免撞到人或等待。这些模型可能具备一定的常识，能够帮助机器人做出更合理的决策。这种利用常识的方法在机器人学习中具有很大的潜力。","最后，讲者总结了强化学习算法在机器人自主学习能力方面的不足，并指出需要定义问题和设计相应的算法。例如，可以学习反向策略、任务图或单次生命强化学习（single life RL）以防止漂移。这些方法旨在解决机器人在复杂环境中学习和适应的问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3781.99,"end":3937.9,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":3781.99,"text":"If you're a manipulator, you could, like, drop, like, glass onto the floor."},{"start":3786.13,"text":"You could also, like, hit objects pretty hard."},{"start":3789.09,"text":"the there's actually work that that builds very directly upon some of these"},{"start":3795.63,"text":"ideas where you actually try to learn learn some notion of safety and learn"},{"start":3799.45,"text":"when you're actually in a high-risk state and then go back to a state that"},{"start":3803.39,"text":"is less risky so you could actually learn for example like a recovery policy"},{"start":3807.35,"text":"that tries to get back to states that you are known to be less risky and and"},{"start":3811.59,"text":"and more safe and so these ideas actually some of these ideas actually"},{"start":3815.51,"text":"we're actually like"},{"start":3819.37,"text":"several years ago, studied in sort of safety settings. The other practical thing to do is to try to, to the extent possible, try to impose safety constraints on the controller itself so that, for example, you're not using the motors to the point in which they'll overheat or minimize, like, have a box around the robot that doesn't allow it to, for example, like..."},{"start":3844.65,"text":"apply a lot of force to different parts of the state space. Now, that's not possible everywhere. And learning notions of safety might be the only way to actually kind of address the problem in general. Although to learn safety, you need examples of failing. So it's generally a pretty tricky problem. And yeah, I guess those are my main thoughts on that."},{"start":3867.44,"text":"Yeah, so you could also, the question is maybe you could, when navigating around people, you could try to ask a VLM, like,"},{"start":3875.14,"text":"what you might try to do at a high level in different circumstances. And this work right here actually was using a VLM to indicate with past experience what are good strategies to try. And so these models may have some sort of common sense. So you just see maybe you shouldn't walk or run into a person, for example, or maybe you should wait, that sort of thing. And so leveraging that sort of common sense in those models."},{"start":3904.04,"text":"is fairly promising. Cool. Great. So to summarize, we talked about why reinforcement learning algorithms don't already give robots autonomous learning capabilities and kind of..."},{"start":3918.62,"text":"defined the problem, defined a couple instances of this problem where we either want to think about the lifetime of rewards or learning a good policy. And we talked about algorithms for each of those where we try to, for example, learn a backward policy, learn a task graph, and try different tasks, and also single life RL to prevent drift."}],"speech_gaps":[],"frame":"../frames/v026/023.webp","frame_time":3793.99}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
