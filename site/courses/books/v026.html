<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 16 机器人中的强化学习（RL for Robots）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 16 机器人中的强化学习（RL for Robots） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v026","title":"Lecture 16 机器人中的强化学习（RL for Robots）","course":"强化学习","pages":[{"title":"强化学习在机器人中的应用","segments":[{"id":0,"text":"For today, we're going to be talking about autonomous learning, specifically in the context of reinforcement learning for robots. And this lecture and the next lecture are going to be focusing a bit more on robotics use cases. Today we're going to be talking about autonomy, and on Wednesday we'll be talking about, we have a guest lecture talking about sim-to-real transfer and humanoid robots.","zh":"今天，我们将讨论自主学习，特别是在机器人强化学习的背景下。本讲和下一次讲授将更侧重于机器人应用案例。今天我们将讨论自主性，而周三我们将有一场特邀讲座，主题是模拟到现实的迁移和人形机器人。","start":5.2,"end":27.12},{"id":1,"text":"So we'll be talking about why robots aren't autonomous already, defining the problem of autonomous reinforcement learning, then developing the algorithms, specifically thinking about learning policies without human intervention, and a formulation of reinforcement learning called single-life reinforcement learning.","zh":"我们将讨论为什么机器人目前还没有自主性，定义自主强化学习的问题，然后开发算法，特别是考虑在无人干预的情况下学习策略，并讨论一种称为单生命强化学习的强化学习形式。","start":28.24,"end":47.02},{"id":2,"text":"So the goal here will be to think about how we can imbue intelligent machines with autonomy, the ability to allow them to, on their own, learn, interact, practice, get better without a human in the loop. Cool.","zh":"我们的目标是思考如何赋予智能机器自主性，使它们能够独立地学习、互动、练习、提升，而无需人类参与。很酷。","start":48.6,"end":66.74},{"id":3,"text":"Let's start with some of the motivation. So we've been talking a lot about reinforcement learning. We also talked a little bit about imitation learning. Where imitation learning, typically we are...","zh":"让我们从一些动机开始。我们已经讨论了很多关于强化学习的内容。我们也稍微提到了模仿学习。通常，模仿学习中，我们是……","start":69.01,"end":79.73},{"id":4,"text":"And in particular, if we think about saying that we want some robot that's going from some initial state distribution, some distribution over initial states. So this is kind of the starting conditions that our agent might be faced with when it's actually deployed to some kind of region in the state space that has high reward. Then typically when we think about this learning process, we will collect trials.","zh":"特别是，如果我们考虑想要一个机器人从某种初始状态分布出发，某种初始状态的分布。这基本上是我们的代理在实际部署到状态空间中某个奖励较高的区域时可能面临的起始条件。通常在考虑这个学习过程时，我们会收集试验。","start":80.42,"end":107.3},{"id":5,"text":"And in particular, if we think about saying that we want some robot that's going from some initial state distribution, some distribution over initial states. So this is kind of the starting conditions that our agent might be faced with when it's actually deployed to some kind of region in the state space that has high reward. Then typically when we think about this learning process, we will collect trials.","zh":"特别是，如果我们考虑想要一个机器人从某种初始状态分布出发，某种初始状态的分布。这基本上是我们的代理在实际部署到状态空间中某个奖励较高的区域时可能面临的起始条件。通常在考虑这个学习过程时，我们会收集试验。","start":108.27,"end":137.53},{"id":6,"text":"So, for example, maybe at the beginning, the first attempt at the task will look something like this, where because we haven't learned anything yet, maybe we haven't practiced very much, we don't have a trajectory that is very good.","zh":"例如，可能在开始时，第一次尝试执行任务会像这样，因为我们还没有学到任何东西，可能还没有练习很多，我们没有一条非常优秀的轨迹。","start":138.27,"end":152.71},{"id":7,"text":"And then from there, typically we've thought about, okay, can we retry the task and attempt the task again, where we again start from a state in our initial state distribution and kind of roll out our policy again. Now, when we're rolling out these policies, we are kind of sampling actions from our policy distribution.","zh":"然后，我们通常会考虑，好吧，我们能否重新尝试任务并再次执行任务，在这种情况下，我们再次从初始状态分布中的一个状态开始，并再次 rollout 我们的策略。当我们 rollout 这些策略时，我们实际上是在从我们的策略分布中采样动作。","start":155.01,"end":180.13}],"notes":["本段讨论了机器人自主学习的动机，强调了强化学习与模仿学习的区别。强化学习通过试错学习，而模仿学习则是通过专家示范进行学习。虽然强化学习在理论上更自主，但在实际应用中，特别是在物理机器人上，仍然需要人类干预。","讲者提到，机器人从初始状态分布开始，这些初始状态分布是其部署时可能遇到的条件。在学习过程中，通常会收集多个试验（trials），以评估和改进策略。","以一个例子说明，机器人在刚开始时可能没有足够的经验，因此其轨迹可能并不理想。随后，可以通过重新尝试任务，从初始状态分布中开始，再次执行策略。","在策略执行过程中，机器人会从策略分布中采样动作，这表明策略是基于概率分布的，而不是确定性的。这种采样过程是强化学习中常见的做法，用于探索和利用环境。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.2,"end":180.13,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.2,"text":"For today, we're going to be talking about autonomous learning, specifically in the context of reinforcement learning for robots. And this lecture and the next lecture are going to be focusing a bit more on robotics use cases. Today we're going to be talking about autonomy, and on Wednesday we'll be talking about, we have a guest lecture talking about sim-to-real transfer and humanoid robots."},{"start":28.24,"text":"So we'll be talking about why robots aren't autonomous already, defining the problem of autonomous reinforcement learning, then developing the algorithms, specifically thinking about learning policies without human intervention, and a formulation of reinforcement learning called single-life reinforcement learning."},{"start":48.6,"text":"So the goal here will be to think about how we can imbue intelligent machines with autonomy, the ability to allow them to, on their own, learn, interact, practice, get better without a human in the loop. Cool."},{"start":69.01,"text":"Let's start with some of the motivation. So we've been talking a lot about reinforcement learning. We also talked a little bit about imitation learning. Where imitation learning, typically we are..."},{"start":80.42,"text":"training an agent to mimic some demonstrations that are provided from an expert. Whereas in reinforcement learning, the agent is practicing through trial and error. And this sort of notion of practicing is something that is already more autonomous because the agent is learning from its own experience in the world. But it actually isn't entirely autonomous in practice when you think about running these algorithms on physical robots."},{"start":108.27,"text":"And in particular, if we think about saying that we want some robot that's going from some initial state distribution, some distribution over initial states. So this is kind of the starting conditions that our agent might be faced with when it's actually deployed to some kind of region in the state space that has high reward. Then typically when we think about this learning process, we will collect trials."},{"start":138.27,"text":"So, for example, maybe at the beginning, the first attempt at the task will look something like this, where because we haven't learned anything yet, maybe we haven't practiced very much, we don't have a trajectory that is very good."},{"start":155.01,"text":"And then from there, typically we've thought about, okay, can we retry the task and attempt the task again, where we again start from a state in our initial state distribution and kind of roll out our policy again. Now, when we're rolling out these policies, we are kind of sampling actions from our policy distribution."}],"speech_gaps":[],"frame":"../frames/v026/001.webp","frame_time":17.2},{"title":"强化学习在机器人中的应用","segments":[{"id":8,"text":"and acting according to the agent's own actions. And so each of these trajectories are under the control of the robot or the agent. And as you're rolling out your policy, this part is fully autonomous. Control is fully with the policy pipe. But one little catch is that after you've attempted the task once, you're in a state over here.","zh":"并且根据智能体自身的动作进行行动。因此，这些轨迹都是在机器人或智能体的控制之下。当你执行策略时，这一部分是完全自主的。控制完全由策略管道完成。但有一个小问题，即在你第一次尝试任务之后，你会处于这个状态这边。","start":182.26,"end":209.74},{"id":9,"text":"And we've been thinking about when you then attempt the task again, magically you'll somehow get back over here and attempt the task from this starting place. And we haven't really talked about how do you get from here all the way back to here.","zh":"然后当你再次尝试任务时，神奇地你会 somehow 回到这边，并从这个起始点再次尝试任务。我们还没有真正讨论过如何从这里一路回到这里。","start":210.33,"end":227.09},{"id":10,"text":"And in practice, when you take kind of traditional reinforcement learning algorithms that we've been talking about, we've been assuming that a human or somehow you'll magically get reset to this initial starting place. And in practice, that might mean that a human is actually physically moving the robot or physically moving the objects in the scene back to some set of initial conditions. And as a result, this process isn't actually fully autonomous.","zh":"实际上，当我们使用传统的强化学习算法时，我们假设人类或某种方式会神奇地将机器人重置到这个初始起始点。在实践中，这可能意味着人类实际上物理地将机器人或场景中的物体移回到一组初始条件。因此，这个过程实际上并不是完全自主的。","start":228.06,"end":252.97},{"id":11,"text":"So on the slides, we'll execute actions from our policy, observe data from the environment, update our policy, repeat that process. And eventually, we'll get a policy that is able to get high reward. For example, in this problem, reaching a state within some region of goal states. And we think about that as rolling out some trajectory of length h and then rolling out another trajectory of length h and so forth.","zh":"因此，在幻灯片上，我们将根据我们的策略执行动作，从环境中观察数据，更新我们的策略，重复这个过程。最终，我们会得到一个能够获得高奖励的策略。例如，在这个问题中，到达某个目标状态区域内的状态。我们将这视为执行一个长度为 h 的轨迹，然后执行另一个长度为 h 的轨迹，依此类推。","start":254.59,"end":284.74},{"id":12,"text":"But we need to think about how do we get from the end of one trajectory to the start of another trajectory. Now, if we're in a simulation-based environment, then what we can do is we can create the environment, take actions for a thousand time steps, and then once we're done, then we can call env.reset, which is a very nice little friendly utility.","zh":"但我们需要考虑如何从一个轨迹的结束点转移到另一个轨迹的起始点。现在，如果我们处于一个基于模拟的环境中，那么我们可以创建环境，执行一千个时间步的动作，然后一旦完成，我们就可以调用 env.reset，这是一个非常友好的小工具。","start":286.02,"end":311.86},{"id":13,"text":"And so as some specific examples, say that you are trying to learn how to navigate to a basketball court. Maybe you have a small mobile robot that is trying to deliver something to the basketball court or an autonomous vehicle that's trying to navigate to the basketball court.","zh":"因此，作为一些具体例子，比如说你正在学习如何导航到篮球场。也许你有一个小型移动机器人，试图将某物送到篮球场，或者一辆自动驾驶汽车，试图导航到篮球场。","start":312.63,"end":337.25}],"notes":["本段讨论了强化学习在机器人中的应用时面临的一个关键问题：如何在完成一个任务后将机器人或代理重置到初始状态。在传统强化学习算法中，通常假设有人类或某种机制能够将系统重置到初始状态，这在实际中可能意味着人类手动移动机器人或场景中的物体。然而，这种重置过程并非完全自主，限制了算法的完全自动化。","在模拟环境中，可以通过调用env.reset()这样的工具来实现重置，但这种方法仅适用于模拟环境，无法直接应用于现实世界的物理系统。因此，实际应用中需要考虑如何在物理世界中实现类似的重置机制。"],"formulas":[],"uncertainties":[],"diagram":"none","start":182.26,"end":337.25,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":182.26,"text":"and acting according to the agent's own actions. And so each of these trajectories are under the control of the robot or the agent. And as you're rolling out your policy, this part is fully autonomous. Control is fully with the policy pipe. But one little catch is that after you've attempted the task once, you're in a state over here."},{"start":210.33,"text":"And we've been thinking about when you then attempt the task again, magically you'll somehow get back over here and attempt the task from this starting place. And we haven't really talked about how do you get from here all the way back to here."},{"start":228.06,"text":"And in practice, when you take kind of traditional reinforcement learning algorithms that we've been talking about, we've been assuming that a human or somehow you'll magically get reset to this initial starting place. And in practice, that might mean that a human is actually physically moving the robot or physically moving the objects in the scene back to some set of initial conditions. And as a result, this process isn't actually fully autonomous."},{"start":254.59,"text":"So on the slides, we'll execute actions from our policy, observe data from the environment, update our policy, repeat that process. And eventually, we'll get a policy that is able to get high reward. For example, in this problem, reaching a state within some region of goal states. And we think about that as rolling out some trajectory of length h and then rolling out another trajectory of length h and so forth."},{"start":286.02,"text":"But we need to think about how do we get from the end of one trajectory to the start of another trajectory. Now, if we're in a simulation-based environment, then what we can do is we can create the environment, take actions for a thousand time steps, and then once we're done, then we can call env.reset, which is a very nice little friendly utility."},{"start":312.63,"text":"But that's something that we can only really do in simulation. We can't kind of reset the physical world to our own will. And so as some specific examples, say that you are trying to learn how to navigate to a basketball court. Maybe you have a small mobile robot that is trying to deliver something to the basketball court or an autonomous vehicle that's trying to navigate to the basketball court."}],"speech_gaps":[],"frame":"../frames/v026/002.webp","frame_time":194.26},{"title":"强化学习在机器人中的应用","segments":[{"id":14,"text":"As it tries to explore and attempt this task, it might make a wrong turn. And rather, if it makes that sort of wrong turn, it ends up in that physical location and would need to, for example, figure out how to navigate either back to the starting position or find its way from that wrong turn back to where the basketball truly is. If we have a robot manipulator, we might want to learn how to grasp the mug.","zh":"当它试图探索并尝试执行这个任务时，它可能会走错方向。相反，如果它走错了这种方向，它会到达那个物理位置，并且需要例如弄清楚如何导航回到起始位置，或者从那个错误的方向找到通往篮球真正所在位置的路。如果我们有一个机器人机械臂，我们可能想要学习如何抓住杯子。","start":338.54,"end":364.16},{"id":15,"text":"As we're learning how to grasp the mug, the robot might make a mistake and knock the mug over. And then if it wants to attempt and learn how to grasp things again, then somehow it needs to be within reach of the robot. Or if we're kind of more of a mobile system and we want to learn how to put books onto bookshelves, again, we might make some mistakes.","zh":"当我们学习如何抓住杯子时，机器人可能会犯错误，把杯子打翻。然后，如果它想要尝试并学习如何再次抓住物体，那么某种方式下它需要处于机器人的可触及范围内。或者，如果我们是一个更移动的系统，并且想要学习如何将书放到书架上，同样，我们可能会犯一些错误。","start":364.64,"end":389.73},{"id":16,"text":"I need to figure out how to kind of get back to some starting position where the book is in reach or some kind of initial state distribution if our goal is to go from one set of initial states to regions with high reward. Okay.","zh":"我需要弄清楚如何回到某个起始位置，使得书处于可触及范围内，或者如果我们目标是从一组初始状态转移到高奖励区域，那么我们需要某种初始状态分布。Okay。","start":390.73,"end":407.71},{"id":17,"text":"And one of the reasons why this is actually especially important is that reinforcement learning often takes many attempts. It's not a matter of taking like trying three times and then solving the task. Oftentimes there's many different trials that you'll be attempting and practicing over and over again. And every time the agent tries again, that means that you have some human intervention or some other intervention that is bringing you back to the initial state distribution.","zh":"其中一个原因，为什么这个问题尤其重要，是因为强化学习通常需要许多尝试。这不是说尝试三次就能解决任务的问题。通常情况下，你会进行许多不同的试验，并不断重复练习。每次代理再次尝试时，这意味着你有一些人为干预或其他干预将你带回初始状态分布。","start":408.39,"end":434.63},{"id":18,"text":"Okay, as more kind of real examples, this video on the left is a video of a robot learning how to hit a hockey puck into a goal. And you can see that the human here, this is a friend of mine, Yevgen, he's probably doing more work than the robot is right now as it attempts to do this.","zh":"好的，作为更多实际的例子，左边的视频展示了一个机器人学习如何将曲棍球杆击入球门。你可以看到，这里的人，这是我的朋友Yevgen，他现在可能比机器人做更多的工作，当它试图完成这个任务时。","start":436.01,"end":457.41},{"id":19,"text":"Here's another example where Ali is closing the doors so that the robot can learn how to open them. And here's an example where Archit, who you gave a guest lecture earlier this quarter, is resetting the robot so that it can attempt to fold the towel. Okay, so how do we think about this problem? The problem is this default reset often in practice requires some sort of human intervention.","zh":"这里还有一个例子，Ali正在关闭门，以便机器人可以学习如何打开它们。这里还有一个例子，Archit，你之前在这个季度的某次讲座中曾邀请他作为客座讲师，正在重置机器人，以便它能够尝试折叠毛巾。Okay，那么我们如何思考这个问题？这个问题是，这种默认的重置在实践中通常需要某种形式的人为干预。","start":458.24,"end":489.0},{"id":20,"text":"that we want to be able to ideally eliminate so that our agents can practice and get better on their own rather than requiring some expert or some human. Now, one way that we could look at this is, I mean, what if we could just increase H? What if we just increase the length of the episodes in which our agents are attempting the task?","zh":"我们希望尽可能消除这一点，这样我们的智能体就可以自主练习并变得更好，而不需要专家或人类的指导。现在，我们可以从另一个角度来看这个问题：如果我们能够增加H的值，也就是增加智能体尝试任务的回合长度，会发生什么？","start":489.64,"end":508.71}],"notes":["本段讨论了强化学习在机器人任务中的重要性，强调了学习过程需要多次尝试，并且每次尝试后需要将智能体带回初始状态分布，这通常需要人类干预。","讲者指出，强化学习通常需要很多次尝试，而不是仅仅几次尝试就能完成任务，因此需要设计机制让智能体能够自主练习，而不需要人类干预。","讲者提到，可以通过增加H（即增加每个任务尝试的长度）来减少对人类干预的依赖，从而让智能体能够更有效地学习。","讲者通过多个实际例子说明了机器人学习任务中常见的问题，如机器人在尝试任务时可能犯错，需要人类帮助重置状态，以继续学习。","讲者强调了在强化学习中，重置初始状态分布的重要性，这是确保智能体能够持续学习和改进的关键。","讲者提到，通过增加任务尝试的长度，可以减少对人类干预的需求，从而让智能体能够更自主地进行学习和优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":338.54,"end":508.71,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":338.54,"text":"As it tries to explore and attempt this task, it might make a wrong turn. And rather, if it makes that sort of wrong turn, it ends up in that physical location and would need to, for example, figure out how to navigate either back to the starting position or find its way from that wrong turn back to where the basketball truly is. If we have a robot manipulator, we might want to learn how to grasp the mug."},{"start":364.64,"text":"As we're learning how to grasp the mug, the robot might make a mistake and knock the mug over. And then if it wants to attempt and learn how to grasp things again, then somehow it needs to be within reach of the robot. Or if we're kind of more of a mobile system and we want to learn how to put books onto bookshelves, again, we might make some mistakes."},{"start":390.73,"text":"I need to figure out how to kind of get back to some starting position where the book is in reach or some kind of initial state distribution if our goal is to go from one set of initial states to regions with high reward. Okay."},{"start":408.39,"text":"And one of the reasons why this is actually especially important is that reinforcement learning often takes many attempts. It's not a matter of taking like trying three times and then solving the task. Oftentimes there's many different trials that you'll be attempting and practicing over and over again. And every time the agent tries again, that means that you have some human intervention or some other intervention that is bringing you back to the initial state distribution."},{"start":436.01,"text":"Okay, as more kind of real examples, this video on the left is a video of a robot learning how to hit a hockey puck into a goal. And you can see that the human here, this is a friend of mine, Yevgen, he's probably doing more work than the robot is right now as it attempts to do this."},{"start":458.24,"text":"Here's another example where Ali is closing the doors so that the robot can learn how to open them. And here's an example where Archit, who you gave a guest lecture earlier this quarter, is resetting the robot so that it can attempt to fold the towel. Okay, so how do we think about this problem? The problem is this default reset often in practice requires some sort of human intervention."},{"start":489.64,"text":"that we want to be able to ideally eliminate so that our agents can practice and get better on their own rather than requiring some expert or some human. Now, one way that we could look at this is, I mean, what if we could just increase H? What if we just increase the length of the episodes in which our agents are attempting the task?"}],"speech_gaps":[],"frame":"../frames/v026/003.webp","frame_time":350.54},{"title":"强化学习在机器人中的应用","segments":[{"id":21,"text":"And if we increase the length of the episodes, then in principle we won't require as much human supervision. And we might be able to apply the same exact reinforcement learning algorithms that we've learned about in the course, just with less supervision during the learning process.","zh":"如果我们增加episode的长度，那么原则上我们就不需要那么多的人工监督。我们可能能够应用我们在课程中学习到的相同的强化学习算法，只是在学习过程中监督较少。","start":509.8,"end":527.3},{"id":22,"text":"So we can do that. And so we'll see an example of what increasing age looks like in a minute, but generally kind of the definition of what we want to accomplish is initialize the scene, the environment. Maybe it's already initialized in some way. Then we do that once. We have the agent interact autonomously with the world.","zh":"因此，我们可以这样做。接下来我们将看到增加episode长度的一个例子，但一般来说，我们想要完成的目标的定义是初始化场景，初始化环境。也许它已经以某种方式被初始化了。然后我们只需做一次。我们让智能体自主地与世界进行交互。","start":529.33,"end":548.71},{"id":23,"text":"Without any sort of environment resets, we could also relax this constraint occasionally to only reset at a very low frequency. For example, if H is very large. Now, as we start to think about these systems, we need to think about how we actually want to evaluate these systems. And there's actually a couple different ways. There's actually a couple different things that we might care about.","zh":"如果没有环境重置，我们也可以偶尔放松这个约束，仅在非常低的频率下进行重置。例如，如果H非常大。当我们开始考虑这些系统时，我们需要考虑如何实际评估这些系统。实际上，有几种不同的方法。我们可能关心的有几种不同的事情。","start":550.2,"end":571.66},{"id":24,"text":"One thing that we might care about is after we've, for example, autonomously learned in some environment, we might care about, maybe let's kind of, well, let's say that we've autonomously explored and, for example, we have kind of some experience that we've collected, maybe that looks something like this.","zh":"我们可能关心的一件事是，在我们例如在某个环境中自主学习之后，我们可能关心的是，也许让我们这样想，假设我们已经自主探索了，并且例如我们收集了一些经验，这可能看起来像这样。","start":573.55,"end":601.36},{"id":25,"text":"where there's no resets, no kind of going back to the initial state. One thing that we might care about is we might care about, did you achieve high reward as you kind of went about the agent's experience? And basically, did it actually complete the task at the end of the day as it was learning? And that would be looking at what is the sum of the rewards that it accomplished over its lifetime.","zh":"其中没有重置，也没有回到初始状态。我们可能关心的一件事是，我们在智能体经历的过程中是否实现了高奖励？基本上，它在学习结束时是否真正完成了任务？这将是查看它在其一生中所获得的奖励总和。","start":602.18,"end":626.01},{"id":26,"text":"And alternatively, instead of thinking about evaluating autonomous RL from that perspective, we could think about, after the learning process, did we learn a good policy that we could then deploy and be able to repeatedly do the task? And so that would be looking at, instead of looking at the rewards of the spread trajectory, it would be saying, after the learning process, if we've learned some policy, how good is it at, for example, going to the goal?","zh":"或者，我们不必从这个角度来评估自主的强化学习，我们可以在学习过程结束后考虑，我们是否学习到了一个可以部署并能够重复执行任务的好策略？因此，这将是查看，而不是查看轨迹的奖励总和，而是说，在学习过程结束后，如果我们已经学习到了某个策略，它在例如前往目标时表现如何？","start":628.22,"end":653.92},{"id":27,"text":"How good is the policy that learned as an outcome of the reinforcement learning process? So two things here. One, it could be the amount of reward recovered over the course of its life. As one example of this, imagine that you're deploying the Mars rover and you want the rover to be able to collect scientific data. You don't really care about whether it learned.","zh":"通过强化学习过程学习得到的策略有多好？这里有两个方面。第一，它可能是其一生中获得的奖励总量。举个例子，想象一下你正在部署火星探测车，并希望探测车能够收集科学数据。你其实并不太关心它是否学会了。","start":654.51,"end":681.71}],"notes":["本段讨论了在机器人中应用强化学习时，如何减少对人工监督的依赖。通过增加训练回合的长度，可以降低对监督的需求，同时仍然可以使用课程中学习到的强化学习算法，但学习过程中监督较少。","课堂提到，当系统开始运行时，需要考虑如何评估这些系统。评估方式可以是多种多样的，例如关注智能体在自主学习过程中是否获得了高奖励，或者是否成功完成了任务。","评估方式还包括在学习结束后，检查是否学习到了一个可以部署的策略，该策略能够重复执行任务。这与关注奖励总和不同，而是关注策略在任务执行中的表现。","课堂还提到，评估策略的两个主要方面：一是智能体在其生命周期内获得的奖励总量，二是策略在任务执行中的表现，例如是否能够成功到达目标。","以火星探测车为例，课堂指出，部署时更关注探测车是否能够完成任务，如收集科学数据，而不是它是否学习了某些特定的技能。","课堂强调，评估强化学习系统时，需要根据具体应用场景选择合适的评估指标，这可能包括奖励总和、任务完成度或策略的泛化能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":509.8,"end":681.71,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":509.8,"text":"And if we increase the length of the episodes, then in principle we won't require as much human supervision. And we might be able to apply the same exact reinforcement learning algorithms that we've learned about in the course, just with less supervision during the learning process."},{"start":529.33,"text":"So we can do that. And so we'll see an example of what increasing age looks like in a minute, but generally kind of the definition of what we want to accomplish is initialize the scene, the environment. Maybe it's already initialized in some way. Then we do that once. We have the agent interact autonomously with the world."},{"start":550.2,"text":"Without any sort of environment resets, we could also relax this constraint occasionally to only reset at a very low frequency. For example, if H is very large. Now, as we start to think about these systems, we need to think about how we actually want to evaluate these systems. And there's actually a couple different ways. There's actually a couple different things that we might care about."},{"start":573.55,"text":"One thing that we might care about is after we've, for example, autonomously learned in some environment, we might care about, maybe let's kind of, well, let's say that we've autonomously explored and, for example, we have kind of some experience that we've collected, maybe that looks something like this."},{"start":602.18,"text":"where there's no resets, no kind of going back to the initial state. One thing that we might care about is we might care about, did you achieve high reward as you kind of went about the agent's experience? And basically, did it actually complete the task at the end of the day as it was learning? And that would be looking at what is the sum of the rewards that it accomplished over its lifetime."},{"start":628.22,"text":"And alternatively, instead of thinking about evaluating autonomous RL from that perspective, we could think about, after the learning process, did we learn a good policy that we could then deploy and be able to repeatedly do the task? And so that would be looking at, instead of looking at the rewards of the spread trajectory, it would be saying, after the learning process, if we've learned some policy, how good is it at, for example, going to the goal?"},{"start":654.51,"text":"How good is the policy that learned as an outcome of the reinforcement learning process? So two things here. One, it could be the amount of reward recovered over the course of its life. As one example of this, imagine that you're deploying the Mars rover and you want the rover to be able to collect scientific data. You don't really care about whether it learned."}],"speech_gaps":[],"frame":"../frames/v026/004.webp","frame_time":521.8},{"title":"强化学习在机器人中的应用","segments":[{"id":28,"text":"a good policy that you're going to deploy after the learning process. You really care about whether or not it did a good job as it was deployed, as it was learning, and so forth. So that's more like trying to measure how good is this red trajectory. And so here's my graphical depiction of this on the slide.","zh":"一个你将在学习过程后部署的好策略。你真正关心的是它在部署时、在学习时以及之后的表现如何。因此，这更像是在衡量这条红色轨迹的质量。在这里，我用幻灯片上的图形来展示这个概念。","start":682.24,"end":707.34},{"id":29,"text":"Or you could learn about the quality of the learn policy. An example of this is that if you're learning how to cook meals, maybe there's some sort of training process. You don't really care that much about during the training process how well it was able to cook as it was learning. But then you really care about then can I deploy this system and have it be able to cook meals effectively, repeatedly for a variety of customers in the future.","zh":"或者你可以学习策略的质量。一个例子是，如果你在学习如何烹饪餐点，可能有一些训练过程。你并不太在意训练过程中它在学习时烹饪得有多好。但之后你真正关心的是，能否将这个系统部署并让它在未来为各种顾客有效地、重复地烹饪餐点。","start":708.53,"end":734.69},{"id":30,"text":"Cool. So that would be kind of a typical, like, if we kind of then took a policy that we learned, initialized it at the starting state, and ran it, does it achieve good reward under those conditions? So we'll think about these as two different things. So we can first let's think about what we'll call, like, deployed policy evaluation. So how good is the policy that we learned if we were to then deploy it?","zh":"很好。因此，如果我们学习了一个策略，将其初始化在起始状态，并运行它，它是否在这些条件下实现了良好的奖励？我们将这些视为两种不同的事情。首先，我们可以考虑所谓的部署策略评估。如果我们部署这个策略，它有多好？","start":737.8,"end":765.8},{"id":31,"text":"And the objective for this circumstance can be defined as an objective that looks very similar to what we've been seeing in the course previously, which is that you would sample a state from your initial state distribution and act according to your policy and measure the sum of rewards or the sum of discounted rewards that was observed.","zh":"在这种情况下，目标可以定义为一个与我们之前课程中看到的目标非常相似的目标，即从初始状态分布中采样一个状态，按照策略行动，并测量观察到的奖励总和或折扣奖励总和。","start":766.38,"end":793.88},{"id":32,"text":"After starting, after running an episode, this would be an expectation. After starting from the state and acting according to the policy. So this is deployed policy evaluation. How good is the policy if it's starting from the initial state distribution and acting according to the policy?","zh":"在开始运行一个回合之后，这将是一个期望值。从状态开始并按照策略行动之后。因此，这就是部署策略评估。如果策略从初始状态分布开始并按照策略行动，它有多好？","start":794.57,"end":815.67},{"id":33,"text":"Alternatively, if we were to think about more like the kind of continuing policy evaluation,","zh":"或者，如果我们考虑更像持续策略评估的情况，","start":817.67,"end":823.65},{"id":34,"text":"how good are we if we kind of just deployed the system and it's trying to learn as it goes","zh":"如果我们只是部署了系统，它在运行过程中不断学习，","start":823.79,"end":829.35},{"id":35,"text":"and how good is it during that learning process,","zh":"那么在学习过程中它有多好？","start":829.35,"end":831.59},{"id":36,"text":"then we'd actually be considering something a little bit different.","zh":"那么我们实际上考虑的会是稍微不同的东西。","start":832.43,"end":834.97},{"id":37,"text":"We would want to be considering what is the average reward that it saw during that learning process.","zh":"我们希望考虑的是在学习过程中所看到的平均奖励。","start":836.69,"end":846.51},{"id":38,"text":"sets.","zh":"集合。","start":846.51,"end":846.59},{"id":39,"text":"And so we would be looking at something","zh":"因此我们会关注一些东西","start":847.17,"end":848.61},{"id":40,"text":"like some kind of average quantity.","zh":"像某种平均量。","start":848.61,"end":857.21},{"id":41,"text":"So we'll write this as 1 over h of t","zh":"因此我们将它写成 1 除以 h 的 t","start":857.39,"end":860.97}],"notes":["在部署后评估中，目标是通过从初始状态分布中采样状态，并按照策略执行，测量观察到的奖励总和或折扣奖励总和。这可以视为一个期望值的计算，用于衡量策略在实际部署时的表现。","在持续学习评估中，关注的是策略在学习过程中所获得的平均奖励。这与部署后评估不同，因为持续学习评估更关注学习过程中的表现，而不是最终的部署效果。","在持续学习评估中，需要考虑的是学习过程中策略所获得的平均奖励，这可能涉及到对学习过程的动态评估，而不仅仅是最终的奖励总和。","在持续学习评估中，可能需要使用平均奖励来衡量策略的表现，这与部署后评估中的期望奖励不同。","在持续学习评估中，可能需要使用平均奖励来衡量策略的表现，这与部署后评估中的期望奖励不同。"],"formulas":[],"uncertainties":["1 over h of t"],"diagram":"none","start":682.24,"end":860.97,"asr_flags":[38,40],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":682.24,"text":"a good policy that you're going to deploy after the learning process. You really care about whether or not it did a good job as it was deployed, as it was learning, and so forth. So that's more like trying to measure how good is this red trajectory. And so here's my graphical depiction of this on the slide."},{"start":708.53,"text":"Or you could learn about the quality of the learn policy. An example of this is that if you're learning how to cook meals, maybe there's some sort of training process. You don't really care that much about during the training process how well it was able to cook as it was learning. But then you really care about then can I deploy this system and have it be able to cook meals effectively, repeatedly for a variety of customers in the future."},{"start":737.8,"text":"Cool. So that would be kind of a typical, like, if we kind of then took a policy that we learned, initialized it at the starting state, and ran it, does it achieve good reward under those conditions? So we'll think about these as two different things. So we can first let's think about what we'll call, like, deployed policy evaluation. So how good is the policy that we learned if we were to then deploy it?"},{"start":766.38,"text":"And the objective for this circumstance can be defined as an objective that looks very similar to what we've been seeing in the course previously, which is that you would sample a state from your initial state distribution and act according to your policy and measure the sum of rewards or the sum of discounted rewards that was observed."},{"start":794.57,"text":"After starting, after running an episode, this would be an expectation. After starting from the state and acting according to the policy. So this is deployed policy evaluation. How good is the policy if it's starting from the initial state distribution and acting according to the policy?"},{"start":817.67,"text":"Alternatively, if we were to think about more like the kind of continuing policy evaluation,"},{"start":823.79,"text":"how good are we if we kind of just deployed the system and it's trying to learn as it goes"},{"start":829.35,"text":"and how good is it during that learning process,"},{"start":832.43,"text":"then we'd actually be considering something a little bit different."},{"start":836.69,"text":"We would want to be considering what is the average reward that it saw during that learning process."},{"start":846.51,"text":"sets."},{"start":847.17,"text":"And so we would be looking at something"},{"start":848.61,"text":"like some kind of average quantity."},{"start":857.39,"text":"So we'll write this as 1 over h of t"}],"speech_gaps":[],"frame":"../frames/v026/005.webp","frame_time":694.24},{"title":"强化学习在机器人中的应用","segments":[{"id":42,"text":"equals 1 to h of the reward.","zh":"等于奖励的1到h次方。","start":860.97,"end":865.83},{"id":43,"text":"And if h is small, this is not going","zh":"而且如果h很小，这不会在很小的事物上进行平均。","start":868.89,"end":874.17},{"id":44,"text":"to be averaged over a small thing.","zh":"因此，我们通常希望在生命周期越来越长的情况下评估这个量。","start":874.17,"end":875.83},{"id":45,"text":"And so we want to be evaluating this usually as our lifetime might be getting longer and longer.","zh":"因此，这将是一个极限，类似于在h趋于无穷大的极限中评估平均奖励。","start":875.83,"end":882.81},{"id":46,"text":"So this would be a limit, kind of evaluating average reward in the limit in which h goes to infinity.","zh":"因此，这将是一个极限，大致是在h趋于无穷时评估平均奖励。","start":883.03,"end":891.63},{"id":47,"text":"So something like this.","zh":"并且对此量应该有一个期望值。","start":893.21,"end":895.09},{"id":48,"text":"And there should be an expectation over this quantity.","zh":"现在，这个期望值并不是在单一策略下进行的。","start":895.99,"end":901.65},{"id":49,"text":"Now, this expectation isn't under a single policy.","zh":"现在，这个期望并不是在单一策略下的。","start":901.65,"end":906.59},{"id":50,"text":"It's over the learning process itself.","zh":"这是关于学习过程本身的。","start":906.99,"end":909.21},{"id":51,"text":"So that's another difference from measuring how good a learned policy is.","zh":"因此，这与衡量学习到的策略有多好是另一个不同之处。","start":910.29,"end":914.95},{"id":52,"text":"Cool.","zh":"不错。","start":917.01,"end":917.57},{"id":53,"text":"And so we'll look at algorithms for both these circumstances.","zh":"因此，我们将研究这两种情况下的算法。","start":917.75,"end":919.75},{"id":54,"text":"Yeah, so the question is, why do we need an expectation if we're just running one trajectory?","zh":"是的，所以问题是，如果我们只是运行一条轨迹，为什么还需要期望值？","start":920.77,"end":925.17},{"id":55,"text":"if you want to like evaluate just like a single like lifetime or a single um rollout of your","zh":"如果你想评估一个单一的生命周期或单一的 rollout（展开）","start":928.54,"end":936.26},{"id":56,"text":"learning process then you could just like measure exactly precisely that like run it and see how","zh":"你的学习过程，你只需精确地测量它，运行它并看看它在实践中表现如何","start":936.26,"end":942.88},{"id":57,"text":"well it does now in practice um there's variability that's caused by variability in the environment","zh":"现在，环境中的变异性会导致变异性","start":942.88,"end":948.0},{"id":58,"text":"variability in your learning process uh like like how you sample batches and so forth and uh you may","zh":"你在学习过程中存在的变异性，比如你如何抽样批次等，你可能会","start":948.0,"end":954.3},{"id":59,"text":"want to measure at the algorithm level, how good is your algorithm at this sort of problem?","zh":"想要在算法层面衡量，你的算法在解决这类问题时表现如何？","start":954.3,"end":959.94},{"id":60,"text":"And if you want to measure how good the algorithm is, you'll want an expectation over multiple","zh":"如果你想衡量算法的表现，你将需要在多个算法运行中计算期望值","start":960.36,"end":964.98},{"id":61,"text":"runs of the algorithm.","zh":"来评估算法的性能。","start":964.98,"end":966.14},{"id":62,"text":"Why is this important?","zh":"为什么这很重要？","start":968.44,"end":969.34},{"id":63,"text":"We've already talked a bit about the motivation, but to kind of elaborate on a little bit more,","zh":"我们之前已经讨论过一些动机，但为了进一步阐述，","start":969.5,"end":975.16},{"id":64,"text":"we want robots to operate with minimal human supervision, but we also want them to train","zh":"我们希望机器人能够在最少的人工监督下运行，同时我们也希望它们能够","start":975.86,"end":980.6},{"id":65,"text":"with minimal supervision as well. And generally reinforcement learning on real robots is a kind","zh":"在最少监督的情况下进行训练。通常来说，在真实机器人上进行强化学习是一种","start":980.6,"end":987.78},{"id":66,"text":"of a promising path towards achieving really high success rates, really high reliability","zh":"实现非常高成功率和非常高可靠性的有希望的途径之一","start":987.78,"end":991.96},{"id":67,"text":"compared to imitation learning. And if you're able to train with minimal human supervision,","zh":"与模仿学习相比。如果你能够以最少的人工监督进行训练，","start":991.96,"end":998.52},{"id":68,"text":"then you're able to collect more data. And more data may also unlock both greater reliability","zh":"那么你就能收集更多的数据。而更多的数据也可能解锁更高的可靠性","start":998.78,"end":1004.36},{"id":69,"text":"and also greater generalization as if these systems are able to be deployed at","zh":"以及更高的泛化能力，就像这些系统能够被部署在各种现实世界环境中大规模应用一样。所以这就是问题设置。","start":1004.36,"end":1009.92},{"id":70,"text":"scale in a variety of real-world environments. So that's the problem setup.","zh":"现在让我们稍微深入探讨一下算法。我们希望在没有人工监督的情况下学习策略，","start":1009.92,"end":1015.56},{"id":71,"text":"Now let's dive a bit into algorithms. So we like to learn policies without human","zh":"并且我们之前讨论过这样一个问题，即如果我们只是增加回合的长度，","start":1016.04,"end":1025.0},{"id":72,"text":"supervision and we talked about this question before of like what if we just","zh":"那么我们能否仅仅采用传统的那种","start":1025.0,"end":1029.14},{"id":73,"text":"increase the length of the episode. And can we just take a traditional kind of","zh":"增加episode的长度。那么我们能否直接采用一种传统的","start":1029.14,"end":1035.24},{"id":74,"text":"standard reinforcement learning algorithm? In this case I think we'll be","zh":"标准的强化学习算法？在这种情况下，我认为我们会","start":1035.24,"end":1038.42},{"id":75,"text":"looking at soft factor critic.","zh":"查看软因子评论员。","start":1038.42,"end":1040.06}],"notes":["本段讨论了在强化学习中使用期望值的重要性，特别是在评估算法性能时。当只运行一个轨迹时，可以测量其表现，但为了评估算法本身，需要在多个运行中取期望值。这反映了算法的稳定性和泛化能力。"],"formulas":[],"uncertainties":["equals 1 to h of the reward."],"diagram":"none","start":860.97,"end":1040.06,"asr_flags":[],"translation_complete":true,"translated_segments":34,"raw_segments":[{"start":860.97,"text":"equals 1 to h of the reward."},{"start":868.89,"text":"And if h is small, this is not going"},{"start":874.17,"text":"to be averaged over a small thing."},{"start":875.83,"text":"And so we want to be evaluating this usually as our lifetime might be getting longer and longer."},{"start":883.03,"text":"So this would be a limit, kind of evaluating average reward in the limit in which h goes to infinity."},{"start":893.21,"text":"So something like this."},{"start":895.99,"text":"And there should be an expectation over this quantity."},{"start":901.65,"text":"Now, this expectation isn't under a single policy."},{"start":906.99,"text":"It's over the learning process itself."},{"start":910.29,"text":"So that's another difference from measuring how good a learned policy is."},{"start":917.01,"text":"Cool."},{"start":917.75,"text":"And so we'll look at algorithms for both these circumstances."},{"start":920.77,"text":"Yeah, so the question is, why do we need an expectation if we're just running one trajectory?"},{"start":928.54,"text":"if you want to like evaluate just like a single like lifetime or a single um rollout of your"},{"start":936.26,"text":"learning process then you could just like measure exactly precisely that like run it and see how"},{"start":942.88,"text":"well it does now in practice um there's variability that's caused by variability in the environment"},{"start":948.0,"text":"variability in your learning process uh like like how you sample batches and so forth and uh you may"},{"start":954.3,"text":"want to measure at the algorithm level, how good is your algorithm at this sort of problem?"},{"start":960.36,"text":"And if you want to measure how good the algorithm is, you'll want an expectation over multiple"},{"start":964.98,"text":"runs of the algorithm."},{"start":968.44,"text":"Why is this important?"},{"start":969.5,"text":"We've already talked a bit about the motivation, but to kind of elaborate on a little bit more,"},{"start":975.86,"text":"we want robots to operate with minimal human supervision, but we also want them to train"},{"start":980.6,"text":"with minimal supervision as well. And generally reinforcement learning on real robots is a kind"},{"start":987.78,"text":"of a promising path towards achieving really high success rates, really high reliability"},{"start":991.96,"text":"compared to imitation learning. And if you're able to train with minimal human supervision,"},{"start":998.78,"text":"then you're able to collect more data. And more data may also unlock both greater reliability"},{"start":1004.36,"text":"and also greater generalization as if these systems are able to be deployed at"},{"start":1009.92,"text":"scale in a variety of real-world environments. So that's the problem setup."},{"start":1016.04,"text":"Now let's dive a bit into algorithms. So we like to learn policies without human"},{"start":1025.0,"text":"supervision and we talked about this question before of like what if we just"},{"start":1029.14,"text":"increase the length of the episode. And can we just take a traditional kind of"},{"start":1035.24,"text":"standard reinforcement learning algorithm? In this case I think we'll be"},{"start":1038.42,"text":"looking at soft factor critic."}],"speech_gaps":[],"frame":"../frames/v026/006.webp","frame_time":872.97},{"title":"强化学习在机器人中的应用与挑战","segments":[{"id":76,"text":"and just run it with longer and longer episodes, which in principle should require less and less supervision. And if we do this...","zh":"并且只需用更长的、更长的回合来运行，原则上这将需要更少的监督。如果我们这样做...","start":1040.93,"end":1050.13},{"id":77,"text":"We see performance changes a bit. So this is a plot that's evaluating how good is the learned policy after training for some number of steps shown on the x-axis. So the y-axis is reward accomplished by the deployed policy. So it's measuring this blue equation right here.","zh":"我们看到性能有所变化。因此，这是一个评估在训练若干步数后学习到的策略效果的图表。这里的y轴是部署策略所获得的奖励。它正在测量这里的蓝色方程。","start":1051.5,"end":1071.46},{"id":78,"text":"And this green line is if you run with an episode length of a thousand steps. If you run SAC, you get a learning curve where it's able to learn a policy that's able to effectively complete the task. Now, if you increase the length of the episodes during training by a factor of two, we see that the algorithm does worse. And then we increase it by a factor of 10, we see that it does even worse.","zh":"这条绿色的线表示如果你使用一千步的回合长度进行运行。如果你运行SAC，你会得到一条学习曲线，该曲线显示它能够学习到一个能有效完成任务的策略。现在，如果你在训练过程中将回合长度增加两倍，我们会发现算法表现更差。然后，如果你将其增加十倍，我们会发现它表现得更差。","start":1073.78,"end":1099.67},{"id":79,"text":"Basically, as we increase and make the episode length longer, and as a result reduce the supervision required for training, the algorithm at the very end is hardly able to learn how to do the task at all, how to learn a policy that can do the task at all. And I should mention this is kind of a very simple kind of fish control task where your goal is to navigate with...","zh":"基本上，随着我们增加回合长度，从而减少训练所需的监督，最终算法几乎无法学习如何完成任务，如何学习一个能够完成任务的策略。我应该提到，这是一个非常简单的鱼类控制任务，你的目标是利用鱼类能够做到的动作来导航到特定的位置。这是一个相当简单的任务。即使对于这个简单的任务，如果你增加回合长度却不频繁地重置，你就无法学习到一个好的策略。现在，为什么会这样？我想，有人对为什么我们只在每50,000步或100,000步重置时无法得到一个好的策略有什么假设吗？是的，那么第一个...","start":1100.19,"end":1125.71},{"id":80,"text":"with what the fish can do to a particular position. It's a pretty simple task. Even for this simple task, if you increase your episode length and don't give it resets very frequently, you aren't able to learn a good policy. Now, why is this the case? I guess, does anyone have hypotheses for why we're not getting a good policy if we only reset every 50,000 steps or 100,000 steps? Yeah, so the first...","zh":"关于鱼能对特定位置做什么，这是一个相当简单的任务。即使对于这个简单的任务，如果你增加每回合的步数，并且不频繁地重置环境，你就无法学习到一个好的策略。那么，为什么会是这种情况呢？我想，有没有人能提出为什么我们只在每50,000步或100,000步重置时无法得到一个好的策略的假设呢？是的，首先……","start":1126.7,"end":1156.23},{"id":81,"text":"that can happen is it can make a mistake and kind of do something that's bad, maybe leads it to a part of the state space that is very hard to recover from. In this particular environment, I don't think it's possible for it to break its tail or something, but you can basically drift away from the state distribution that's good. And so if we were to think about this, maybe that diagram is getting a little bit messy. Our goal is to learn a policy.","zh":"可能发生的情况是，它可能会犯错，做一些不好的事情，也许会引导它进入一个很难恢复的环境状态区域。在这个特定的环境中，我认为它不可能弄断自己的尾巴之类的东西，但你基本上会逐渐远离一个好的状态分布。因此，如果我们考虑这个问题，也许那个图示会变得有点混乱。我们的目标是学习一个策略。","start":1156.94,"end":1182.52},{"id":82,"text":"that goes from some initial state distribution to some goal as a simple reinforcement learning problem. As we're learning, we might simply kind of deviate from where the set of good states is. And because of this drift, it might be very hard to recover and get closer to the parts that have high reward. So that's one challenge. Does anyone else have ideas on another challenge?","zh":"这从某个初始状态分布到某个目标可以被视为一个简单的强化学习问题。在我们学习的过程中，我们可能会偏离那些良好状态的集合。由于这种漂移，可能很难恢复并接近那些具有高奖励的部分。因此，这是其中一个挑战。还有其他人有其他挑战的想法吗？","start":1183.39,"end":1212.31},{"id":83,"text":"The other challenge is actually a little bit more nuanced.","zh":"另一个挑战实际上要微妙一些。","start":1213.36,"end":1215.58},{"id":84,"text":"And in particular, say that we drift away,","zh":"特别是，假设我们漂离了，","start":1216.14,"end":1219.34}],"notes":["本段讨论了在强化学习中，随着训练回合长度增加，算法性能下降的现象。这表明，如果训练过程中不频繁重置环境，算法可能难以学习到有效的策略。","讲者指出，当训练回合变长时，智能体可能进入难以恢复的状态空间区域，从而导致性能下降。这种现象在某些环境中可能表现为状态分布的漂移。","讲者提到，学习的目标是从初始状态分布到目标状态的策略，而状态漂移可能导致智能体远离高奖励区域，从而影响学习效果。","讲者还提到，这种漂移现象是强化学习中的一个挑战，但还有其他更复杂的挑战需要考虑。","讲者指出，状态漂移可能导致智能体无法恢复到良好的状态分布，从而影响其学习能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1040.93,"end":1219.34,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":1040.93,"text":"and just run it with longer and longer episodes, which in principle should require less and less supervision. And if we do this..."},{"start":1051.5,"text":"We see performance changes a bit. So this is a plot that's evaluating how good is the learned policy after training for some number of steps shown on the x-axis. So the y-axis is reward accomplished by the deployed policy. So it's measuring this blue equation right here."},{"start":1073.78,"text":"And this green line is if you run with an episode length of a thousand steps. If you run SAC, you get a learning curve where it's able to learn a policy that's able to effectively complete the task. Now, if you increase the length of the episodes during training by a factor of two, we see that the algorithm does worse. And then we increase it by a factor of 10, we see that it does even worse."},{"start":1100.19,"text":"Basically, as we increase and make the episode length longer, and as a result reduce the supervision required for training, the algorithm at the very end is hardly able to learn how to do the task at all, how to learn a policy that can do the task at all. And I should mention this is kind of a very simple kind of fish control task where your goal is to navigate with..."},{"start":1126.7,"text":"with what the fish can do to a particular position. It's a pretty simple task. Even for this simple task, if you increase your episode length and don't give it resets very frequently, you aren't able to learn a good policy. Now, why is this the case? I guess, does anyone have hypotheses for why we're not getting a good policy if we only reset every 50,000 steps or 100,000 steps? Yeah, so the first..."},{"start":1156.94,"text":"that can happen is it can make a mistake and kind of do something that's bad, maybe leads it to a part of the state space that is very hard to recover from. In this particular environment, I don't think it's possible for it to break its tail or something, but you can basically drift away from the state distribution that's good. And so if we were to think about this, maybe that diagram is getting a little bit messy. Our goal is to learn a policy."},{"start":1183.39,"text":"that goes from some initial state distribution to some goal as a simple reinforcement learning problem. As we're learning, we might simply kind of deviate from where the set of good states is. And because of this drift, it might be very hard to recover and get closer to the parts that have high reward. So that's one challenge. Does anyone else have ideas on another challenge?"},{"start":1213.36,"text":"The other challenge is actually a little bit more nuanced."},{"start":1216.14,"text":"And in particular, say that we drift away,"}],"speech_gaps":[],"frame":"../frames/v026/007.webp","frame_time":1052.93},{"title":"强化学习在机器人中的挑战与解决方案","segments":[{"id":85,"text":"but maybe either in another episode after one reset,","zh":"但也许在一次重置之后的另一个回合中，","start":1219.44,"end":1223.4},{"id":86,"text":"or even for this episode,","zh":"或者甚至在这个回合中，","start":1223.48,"end":1225.68},{"id":87,"text":"if you are able to eventually get to the goal,","zh":"如果你最终能够到达目标，","start":1226.5,"end":1230.62},{"id":88,"text":"which is good, you got reward.","zh":"这很好，你获得了奖励。","start":1230.72,"end":1232.14},{"id":89,"text":"From there, you might simply kind of stay","zh":"从那里，你可能会简单地停留在","start":1233.82,"end":1237.86},{"id":90,"text":"in this region of the state space.","zh":"状态空间的这个区域中。","start":1237.86,"end":1240.9},{"id":91,"text":"And if you start collecting a lot of data in this part of the state space, you're getting lots of","zh":"如果你在这个状态空间的这一部分收集了大量数据，你就会获得大量的","start":1242.0,"end":1246.08},{"id":92,"text":"reward, and so the learning process is great. But then if your goal is to learn a policy that starts","zh":"奖励，因此学习过程是很好的。但如果你的目标是学习一个从","start":1246.08,"end":1254.52},{"id":93,"text":"from here and goes to here, you're not actually visiting the states that will yield a good policy.","zh":"从这里到那里，你实际上并没有访问到能够产生良好策略的状态。","start":1254.52,"end":1261.1},{"id":94,"text":"And so you might actually not be visiting the states that allow you to actually kind of go","zh":"因此，你可能实际上并没有访问到那些能够让你从一个初始状态有效地到达目标状态的状态。","start":1262.48,"end":1268.9},{"id":95,"text":"effectively from one initial state to the goal. So two challenges. If we think about this row star","zh":"所以有两个挑战。如果我们把这一行星号视为从起点到达目标的最优状态分布，那么在回合制学习中，","start":1268.9,"end":1278.76},{"id":96,"text":"as the optimal state distribution for getting from start to goal, then in episodic learning,","zh":"你总能从初始状态分布重新开始执行任务。而在自主学习或非回合制学习中，","start":1278.76,"end":1285.78},{"id":97,"text":"you can always retry the task from the initial state distribution. Whereas in autonomous learning","zh":"你将从你离开的地方继续进行，这种探索可能会使你偏离那些能够到达目标状态的良好状态集合。","start":1285.86,"end":1292.96},{"id":98,"text":"or non-episodic learning, you'll continue from where you left off and that sort of exploration","zh":"然后，","start":1292.96,"end":1298.76},{"id":99,"text":"might lead you to drift away from the set of good states for getting to the goal. And then","zh":"即使你最终到达了目标，你的回放缓冲区中的状态分布可能","start":1298.76,"end":1306.58},{"id":100,"text":"even if you do eventually get to the goal, your state distribution in your replay buffer might","zh":"并不包含那些能够有效到达目标状态的状态。","start":1306.58,"end":1311.76},{"id":101,"text":"collapse and might be kind of concentrated around the goal, rather than capturing the","zh":"崩溃并可能集中在目标周围，而不是捕捉到","start":1311.76,"end":1319.88},{"id":102,"text":"If you don't have states from the optimal policy, you won't know what to do or what actions to take when you're in this part of the state space.","zh":"如果你没有来自最优策略的状态，当你处于状态空间的这一部分时，你就不会知道该做什么或采取什么行动。","start":1319.88,"end":1325.6},{"id":103,"text":"policy, you won't know what to do or what actions to take when you're in this part of the state","zh":"策略，当你处于状态空间的这一部分时，你就不会知道该做什么或采取什么行动。","start":1325.6,"end":1330.12},{"id":104,"text":"Cool. And so as an outcome of this, you'll never actually learn a good policy.","zh":"很好。因此，结果是你实际上永远无法学习到一个好的策略。","start":1330.12,"end":1335.68},{"id":105,"text":"So how can we learn an effective policy? So if the agent is allowed to reset from the initial","zh":"那么我们如何学习一个有效的策略呢？如果智能体被允许从初始","start":1339.9,"end":1348.04},{"id":106,"text":"state distribution, we do learn successfully. And so one very simple idea","zh":"状态分布重置，我们就能成功地进行学习。因此，一个非常简单的想法","start":1348.04,"end":1352.94},{"id":107,"text":"is to try to learn a policy that brings us from wherever we ended up after","zh":"是尝试学习一个策略，将我们从尝试任务后所处的任何位置带回初始状态分布。我们可以将这种策略称为","start":1352.94,"end":1360.08},{"id":108,"text":"attempting the task back to the initial state distribution. And we can call this","zh":"尝试将任务重新回到初始状态分布。并且我们可以称之为","start":1360.08,"end":1365.96},{"id":109,"text":"idea, we can think of this as like a reset policy or a backwards policy that's","zh":"这个想法，我们可以将其视为一种重置策略或反向策略，","start":1365.96,"end":1370.04},{"id":110,"text":"trying to undo the task rather than do the task forward. And so we can think of","zh":"试图撤销任务而不是正向执行任务。因此，我们可以将","start":1370.04,"end":1377.08},{"id":111,"text":"of this as kind of forward-backward RL, because we will be learning a forward policy that","zh":"其视为一种前向-后向强化学习（forward-backward RL），因为我们将会学习一个执行任务的前向策略，","start":1377.08,"end":1383.34},{"id":112,"text":"does the task and a backward policy that undoes the task. And where to put this? Maybe let's","zh":"以及一个撤销任务的后向策略。那么应该在哪里应用这个呢？也许让我们","start":1383.34,"end":1394.68}],"notes":["本段讨论了强化学习在机器人应用中的两个主要挑战：在非周期性学习中，智能体可能无法探索到有助于学习最优策略的状态，导致状态分布集中在目标附近，从而无法学习到有效的策略。此外，提出了一种解决方案，即通过学习一个反向策略，将智能体从任务结束后的状态带回初始状态分布，从而实现正向和反向的强化学习。","在非周期性学习中，智能体不会重置到初始状态分布，而是继续从上次结束的位置开始，这可能导致探索偏离最优状态集合。即使最终到达目标，状态分布也可能集中在目标附近，而不是最优策略周围的状态分布。","如果没有来自最优策略的状态，智能体在状态空间的某些区域将不知道采取什么动作，这会导致无法学习到有效的策略。","因此，结论是，如果不允许智能体重置到初始状态分布，就无法学习到好的策略。","为了解决这个问题，提出了一种简单的方法，即学习一个策略，将智能体从任务结束后的状态带回初始状态分布。这种策略被称为重置策略或反向策略，它试图撤销任务而不是执行任务。","这种正向-反向强化学习方法包括学习一个正向策略来执行任务和一个反向策略来撤销任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1219.44,"end":1394.68,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":1219.44,"text":"but maybe either in another episode after one reset,"},{"start":1223.48,"text":"or even for this episode,"},{"start":1226.5,"text":"if you are able to eventually get to the goal,"},{"start":1230.72,"text":"which is good, you got reward."},{"start":1233.82,"text":"From there, you might simply kind of stay"},{"start":1237.86,"text":"in this region of the state space."},{"start":1242.0,"text":"And if you start collecting a lot of data in this part of the state space, you're getting lots of"},{"start":1246.08,"text":"reward, and so the learning process is great. But then if your goal is to learn a policy that starts"},{"start":1254.52,"text":"from here and goes to here, you're not actually visiting the states that will yield a good policy."},{"start":1262.48,"text":"And so you might actually not be visiting the states that allow you to actually kind of go"},{"start":1268.9,"text":"effectively from one initial state to the goal. So two challenges. If we think about this row star"},{"start":1278.76,"text":"as the optimal state distribution for getting from start to goal, then in episodic learning,"},{"start":1285.86,"text":"you can always retry the task from the initial state distribution. Whereas in autonomous learning"},{"start":1292.96,"text":"or non-episodic learning, you'll continue from where you left off and that sort of exploration"},{"start":1298.76,"text":"might lead you to drift away from the set of good states for getting to the goal. And then"},{"start":1306.58,"text":"even if you do eventually get to the goal, your state distribution in your replay buffer might"},{"start":1311.76,"text":"collapse and might be kind of concentrated around the goal, rather than capturing the"},{"start":1319.88,"text":"state distribution that's around the optimal policy. If you don't have states from the optimal"},{"start":1325.6,"text":"policy, you won't know what to do or what actions to take when you're in this part of the state"},{"start":1330.12,"text":"space. Cool. And so as an outcome of this, you'll never actually learn a good policy."},{"start":1339.9,"text":"So how can we learn an effective policy? So if the agent is allowed to reset from the initial"},{"start":1348.04,"text":"state distribution, we do learn successfully. And so one very simple idea"},{"start":1352.94,"text":"is to try to learn a policy that brings us from wherever we ended up after"},{"start":1360.08,"text":"attempting the task back to the initial state distribution. And we can call this"},{"start":1365.96,"text":"idea, we can think of this as like a reset policy or a backwards policy that's"},{"start":1370.04,"text":"trying to undo the task rather than do the task forward. And so we can think of"},{"start":1377.08,"text":"of this as kind of forward-backward RL, because we will be learning a forward policy that"},{"start":1383.34,"text":"does the task and a backward policy that undoes the task. And where to put this? Maybe let's"}],"speech_gaps":[],"frame":"../frames/v026/008.webp","frame_time":1231.44},{"title":"强化学习在机器人中的应用","segments":[{"id":113,"text":"do it over here. So you'll first, maybe step zero is to initialize and sample an initial","zh":"在这里做。因此，你首先，也许步骤零是初始化并从初始状态分布中采样，基本上初始化智能体。然后你将反复运行你的前向策略，我称之为 pi f。然后通过尝试最大化奖励总和来更新你的前向策略，这将使用完成任务的奖励函数。我称之为 rf，即前向奖励函数。然后我们将到达某个状态，不会重置，并运行我们的后向策略 pi b。然后我们也可以同样地更新后向策略。在这种情况下，我们需要进行更新。","start":1394.68,"end":1406.2},{"id":114,"text":"We shall see.","zh":"我们将会看到。","start":1406.28,"end":1406.36},{"id":115,"text":"from your initial state distribution, basically initializing the agent. And then you're going to repeatedly run your forward policy, which I'll call pi f. Then update your forward policy by trying to maximize","zh":"从你的初始状态分布中，基本上初始化智能体。然后你将反复运行你的前向策略，我称之为 pi f。然后通过尝试最大化奖励总和来更新你的前向策略，这将使用完成任务的奖励函数。我称之为 rf，即前向奖励函数。然后我们将到达某个状态，不会重置，并运行我们的后向策略 pi b。然后我们也可以同样地更新后向策略。在这种情况下，我们需要进行更新。","start":1407.97,"end":1430.4},{"id":116,"text":"the sum of rewards, and this will be using the reward function for completing the task. I'll call that rf, the forward reward function. And then we'll reach some state we won't reset, and we'll run our backward policy, pi b. And then we can likewise update our backward policy. In this case, we need to update it.","zh":"用于反向任务的逆过程。因此，我们将实际上依赖一个奖励函数，它会告诉我们是否到达了初始状态分布。因此，这将需要第二个奖励函数 RB，它将作为后向策略的奖励。在这些更新步骤方面，你可以使用你最喜欢的强化学习算法。","start":1432.04,"end":1462.47},{"id":117,"text":"for the reverse of the forward task. And so we'll actually rely on a reward function that will tell us if we are reaching the initial state distribution. And so this is going to require a second reward function, RB, that is going to serve as a reward for the backward policy. Now, in terms of these update steps, you can use your favorite reinforcement learning algorithm for this.","zh":"关键的是，在我们运行后向策略之后，我们不会重置。然后我们将再次回到运行前向策略。因此，这将看起来像我们定义这个后向奖励函数，它会奖励我们到达初始状态分布中的状态。然后我们初始化它们并反复运行前向策略。","start":1463.05,"end":1488.78},{"id":118,"text":"And critically, after we run the backward policy, we're not going to reset. We'll then kind of go back to running the forward policy again. And so what this would look like is we will define this backward reward function, which rewards us for reaching states in the initial state distribution. Then we'll initialize them and repeatedly roll out the forward policy.","zh":"然后根据到达目标来更新前向策略，运行后向策略，它将尝试返回到初始状态分布，然后更新后向策略，然后在不重置的情况下，再次尝试运行前向策略，运行后向策略，并重复这个过程。你也可以偶尔重置一次，以防它陷入一个非常具有挑战性的状态。","start":1490.8,"end":1517.27},{"id":119,"text":"then update the forward policy with respect to reaching the goal, roll out the backward policy, which is going to try to go back to the initial state distribution, then update the backward policy, and then without resetting, again, try to roll out the forward policy, roll out the backward policy, and repeat this process. You can also have a reset very infrequently, so occasionally reset it just in case it does kind of get stuck in a really challenging state.","zh":"然后根据到达目标的情况更新前向策略，执行后向策略，该策略将尝试返回到初始状态分布，接着更新后向策略，之后不重置的情况下，再次执行前向策略，执行后向策略，并重复这一过程。你也可以偶尔进行一次重置，以防它陷入一个非常具有挑战性的状态。","start":1518.17,"end":1546.39}],"notes":["本段讲解了在机器人中使用强化学习（RL）的框架，其中涉及正向策略（forward policy）和反向策略（backward policy）的交替执行。正向策略的目标是最大化奖励函数，完成任务，而反向策略的目标是回到初始状态分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1394.68,"end":1546.39,"asr_flags":[114],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1394.68,"text":"do it over here. So you'll first, maybe step zero is to initialize and sample an initial"},{"start":1406.28,"text":"We shall see."},{"start":1407.97,"text":"from your initial state distribution, basically initializing the agent. And then you're going to repeatedly run your forward policy, which I'll call pi f. Then update your forward policy by trying to maximize"},{"start":1432.04,"text":"the sum of rewards, and this will be using the reward function for completing the task. I'll call that rf, the forward reward function. And then we'll reach some state we won't reset, and we'll run our backward policy, pi b. And then we can likewise update our backward policy. In this case, we need to update it."},{"start":1463.05,"text":"for the reverse of the forward task. And so we'll actually rely on a reward function that will tell us if we are reaching the initial state distribution. And so this is going to require a second reward function, RB, that is going to serve as a reward for the backward policy. Now, in terms of these update steps, you can use your favorite reinforcement learning algorithm for this."},{"start":1490.8,"text":"And critically, after we run the backward policy, we're not going to reset. We'll then kind of go back to running the forward policy again. And so what this would look like is we will define this backward reward function, which rewards us for reaching states in the initial state distribution. Then we'll initialize them and repeatedly roll out the forward policy."},{"start":1518.17,"text":"then update the forward policy with respect to reaching the goal, roll out the backward policy, which is going to try to go back to the initial state distribution, then update the backward policy, and then without resetting, again, try to roll out the forward policy, roll out the backward policy, and repeat this process. You can also have a reset very infrequently, so occasionally reset it just in case it does kind of get stuck in a really challenging state."}],"speech_gaps":[],"frame":"../frames/v026/009.webp","frame_time":1406.68},{"title":"强化学习在机器人中的应用：前向与后向策略","segments":[{"id":120,"text":"And then at test time, once you're done with this process, you can discard the backward policy and just deploy your forward policy, which should have learned, ideally, how to get efficiently from the initial state distribution to the goal, or generally to maximize the forward reward function. One other small note here is that typically you need to decide how long to roll out the forward policy for. The simplest thing to do is simply to roll it out for h timesteps.","zh":"然后在测试阶段，完成这个过程后，你可以丢弃后向策略，只部署你的前向策略，理想情况下，该策略已经学习了如何高效地从初始状态分布到达目标，或者更一般地，最大化前向奖励函数。另一个小的注意事项是，通常你需要决定前向策略要运行多长时间。最简单的方法是直接运行 h 个时间步。","start":1549.12,"end":1578.88},{"id":121,"text":"So choose a constant number of time steps to roll it out for. You could imagine doing something more sophisticated. For example, before the forward policy has learned anything, the backward policy, like if it's not moving anywhere, the backward policy won't really have any job to do at the beginning. And so you, for example, could run this for a little bit longer at the beginning. But then at some point, you'll also need to run the backward policy for a little bit longer. And it's a bit simpler to just use a fixed number of steps.","zh":"因此，选择一个固定的步数来运行前向策略。你可以想象做一些更复杂的事情。例如，在前向策略尚未学习任何内容时，后向策略，比如如果它没有移动，那么在开始阶段，后向策略实际上没有太多工作要做。因此，例如，你可以在开始时运行得更久一些。但随后在某个时候，你也需要运行后向策略更久一些。使用固定步数会更简单一些。","start":1579.54,"end":1604.0},{"id":122,"text":"And ideally, if this process is autonomous, then the number of time steps actually matters a little bit less because you can go to sleep while your robot is trying to learn. So the question is, is there any information sharing between the forward policy and the backward policy? If you're using replay buffers, you could consider sharing data between the two and relabeling the rewards for the forward policy, for the backward policy, and vice versa.","zh":"理想情况下，如果这个过程是自主的，那么时间步数实际上影响会小一些，因为你可以睡觉，而机器人则在尝试学习。问题是，前向策略和后向策略之间是否有信息共享？如果你使用了回放缓冲区，你可以考虑在两者之间共享数据，并重新标记前向策略和后向策略的奖励。","start":1605.96,"end":1630.28},{"id":123,"text":"So the question is, is there any information sharing between the forward policy and the backward policy? If you're using replay buffers, you could consider sharing data between the two and relabeling the rewards for the forward policy, for the backward policy, and vice versa.","zh":"问题是，前向策略和后向策略之间是否有信息共享？如果你使用了回放缓冲区，你可以考虑在两者之间共享数据，并重新标记前向策略和后向策略的奖励。","start":1632.38,"end":1656.96},{"id":124,"text":"In practice, it's fairly common to actually not share much information. You could also share an image encoder, for example, share some of the weights. That can be helpful, but they are actually trying to learn, in some ways, very different things, and so that makes it a little bit tricky.","zh":"实际上，在实践中，通常不会共享太多信息。你也可以共享一个图像编码器，例如，共享一些权重。这可能有帮助，但它们实际上在某种程度上试图学习非常不同的内容，这使得问题变得有些棘手。","start":1659.1,"end":1686.24},{"id":125,"text":"But there are also some alternatives that in some ways have a number of appealing properties. So first, for your backward policy, you can actually change the reward function that it uses to actually not reset all the way back to the beginning, but potentially to reset from a larger variety of states.","zh":"但是也有一些替代方案在某些方面具有许多吸引人的特性。因此，对于你的后向策略，你可以实际上改变它所使用的奖励函数，而不仅仅是重置回开始状态，而是有可能从更大范围的状态进行重置。","start":1686.97,"end":1706.53}],"notes":["本段主要讨论了强化学习在机器人中的应用，特别是前向策略和后向策略的交互。前向策略用于从初始状态分布到目标状态的高效转移，而后向策略则用于撤销任务。在自主学习过程中，时间步数的选择对策略的训练有影响，但若过程是自主的，时间步数的重要性会降低，因为机器人可以在学习过程中进行其他任务。","课堂中提到，前向策略和后向策略之间可以共享信息，例如通过回放缓冲区（replay buffer）进行数据共享，并重新标记奖励。然而，在实践中，通常不会共享太多信息，因为这两个策略的目标不同，这使得信息共享变得复杂。","此外，课堂还提到，虽然后向策略在某些情况下可能看起来有些浪费，但它有助于实现自主学习。因此，这种策略可以被视为一种最简单的自主学习算法。","课堂最后提到，存在一些替代方案，这些方案在某些方面具有吸引力。例如，后向策略可以使用不同的奖励函数，而不是从初始状态重置，而是从更广泛的状态集合中重置。这可能有助于提高策略的泛化能力。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1549.12,"end":1706.53,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1549.12,"text":"And then at test time, once you're done with this process, you can discard the backward policy and just deploy your forward policy, which should have learned, ideally, how to get efficiently from the initial state distribution to the goal, or generally to maximize the forward reward function. One other small note here is that typically you need to decide how long to roll out the forward policy for. The simplest thing to do is simply to roll it out for h timesteps."},{"start":1579.54,"text":"So choose a constant number of time steps to roll it out for. You could imagine doing something more sophisticated. For example, before the forward policy has learned anything, the backward policy, like if it's not moving anywhere, the backward policy won't really have any job to do at the beginning. And so you, for example, could run this for a little bit longer at the beginning. But then at some point, you'll also need to run the backward policy for a little bit longer. And it's a bit simpler to just use a fixed number of steps."},{"start":1605.96,"text":"And ideally, if this process is autonomous, then the number of time steps actually matters a little bit less because you can go to sleep while your robot is trying to learn. So the question is, is there any information sharing between the forward policy and the backward policy? If you're using replay buffers, you could consider sharing data between the two and relabeling the rewards for the forward policy, for the backward policy, and vice versa."},{"start":1632.38,"text":"In practice, it's fairly common to actually not share much information. You could also share an image encoder, for example, share some of the weights. That can be helpful, but they are actually trying to learn, in some ways, very different things, and so that makes it a little bit tricky. We'll also see some algorithms later on that do more sharing. Okay, so the upside of this algorithm is quite simple."},{"start":1659.1,"text":"One of the downsides is that this backward policy that's trying to undo the task, ultimately this is not particularly useful. So in some ways it seems a little bit wasteful to learn this policy, but it does enable this sort of autonomous learning, which is quite nice. So this is kind of like the most simple algorithm you could use for trying to learn autonomously."},{"start":1686.97,"text":"But there are also some alternatives that in some ways have a number of appealing properties. So first, for your backward policy, you can actually change the reward function that it uses to actually not reset all the way back to the beginning, but potentially to reset from a larger variety of states."}],"speech_gaps":[],"frame":"../frames/v026/010.webp","frame_time":1561.12},{"title":"强化学习在机器人中的应用：重置初始状态分布","segments":[{"id":126,"text":"Second, we could, instead of learning forward and backward just for one task, we could think about practicing a cycle of different tasks and not just learning kind of a forward task and a backward task. We'll talk about that a bit. And then the other option is you could also set up a task that can be done repeatedly where you can just kind of keep on attempting the task over and over again in kind of certain special circumstances. We'll talk about that briefly as well.","zh":"其次，我们不必只为一个任务学习正向和反向，我们可以考虑练习不同任务的循环，而不仅仅是学习正向任务和反向任务。我们会稍作讨论。另一个选择是，你也可以设置一个可以重复执行的任务，在某些特殊情况下，你可以不断尝试该任务。我们也会简要讨论这一点。","start":1709.08,"end":1733.92},{"id":127,"text":"Cool. Let's first talk about learning to reset to a different initial state distribution from the initial state. And so the motivation here is that in the forward-backward RL, we're kind of trying the task, going back, trying the task, going back. And ultimately, we want to be able to complete the task from the initial state distribution.","zh":"很好。我们首先来谈谈如何从初始状态重置到不同的初始状态分布。这里的动机是，在正向-反向强化学习中，我们尝试任务，然后返回，再次尝试任务，然后返回。最终，我们希望能够从初始状态分布完成任务。","start":1736.82,"end":1758.04},{"id":128,"text":"But we also need to know how to take good actions all along the expert state distribution as well. And so one of the things that we could do is instead of going back all the way to the beginning every single time, we could actually reset to different states along the expert state distribution.","zh":"但我们还需要知道如何在整个专家状态分布中采取良好的动作。因此，我们可以采取的做法是，不必每次都将过程重置到最开始，而是可以重置到专家状态分布中的不同状态。","start":1758.71,"end":1778.55},{"id":129,"text":"And there's actually work that shows that if you were to do this and had a way to do this, then you'd actually learn a bit more efficiently than always starting from the initial state distribution, even in episodic learning settings. And so the way that this works is it's basically going to be the same exact thing as before, but with basically two small modifications.","zh":"实际上，已有研究表明，如果你能够做到这一点，你实际上会比总是从初始状态分布开始学习更高效，即使是在回合制学习设置中。因此，这种方法基本上与之前相同，但有两个小的修改。","start":1779.88,"end":1803.28},{"id":130,"text":"And the first is that if we want to be able to reset and learn a policy that brings us to the expert state distribution, then we need a way to approximate what that expert state distribution is. And so we'll assume that we have a few demonstrations. And so maybe step negative one here is you're basically given some set of expert","zh":"第一个修改是，如果我们想要重置并学习一个将我们带到专家状态分布的策略，那么我们需要一种方法来近似这个专家状态分布。因此，我们假设我们有一些演示。因此，可能步骤负一在这里是你基本上被提供了一些专家","start":1804.36,"end":1831.47},{"id":131,"text":"trajectories or expert demonstrations, and these will be examples of ways to accomplish the task. And then you need to change the reward function for the backward policy, where the reward function shouldn't be to reach the initial state distribution, but instead it should be to reach states that the expert visits.","zh":"轨迹或专家演示，这些是完成任务的方法示例。然后你需要修改反向策略的奖励函数，其中奖励函数不应是到达初始状态分布，而是应该到达专家访问的状态。","start":1832.7,"end":1856.36},{"id":132,"text":"And so in particular, we'll be given a small set of demonstrations, and ideally what we want this to look like is we'd run our forward policy, and then we run our backward policy after it's kind of learned something reasonable. Ideally, it would kind of just bring us back to the set of states in the expert distribution.","zh":"因此，特别是，我们将被提供一组小的演示，我们希望它看起来像这样：我们运行我们的前向策略，然后在它学习到某种合理的东西之后运行我们的后向策略。理想情况下，它会将我们带回专家分布中的状态集合。","start":1858.32,"end":1878.96}],"notes":["本段讨论了在强化学习中，如何通过重置到不同的初始状态分布来提高学习效率。讲者提到，传统的前向-后向强化学习方法需要从初始状态分布开始，但通过重置到专家状态分布中的不同状态，可以更高效地学习策略。","讲者指出，为了实现这一点，需要先对专家状态分布进行近似。这通常通过提供一些专家轨迹或演示来完成，这些演示展示了完成任务的不同方式。","此外，讲者提到需要修改后向策略的奖励函数，使其目标是到达专家访问过的状态，而不是回到初始状态分布。这有助于策略更好地适应任务的中间状态。","最后，讲者提到理想情况下，前向策略和后向策略的结合可以将系统引导回专家状态分布中的状态集合，从而提高整体学习效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1709.08,"end":1878.96,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1709.08,"text":"Second, we could, instead of learning forward and backward just for one task, we could think about practicing a cycle of different tasks and not just learning kind of a forward task and a backward task. We'll talk about that a bit. And then the other option is you could also set up a task that can be done repeatedly where you can just kind of keep on attempting the task over and over again in kind of certain special circumstances. We'll talk about that briefly as well."},{"start":1736.82,"text":"Cool. Let's first talk about learning to reset to a different initial state distribution from the initial state. And so the motivation here is that in the forward-backward RL, we're kind of trying the task, going back, trying the task, going back. And ultimately, we want to be able to complete the task from the initial state distribution."},{"start":1758.71,"text":"But we also need to know how to take good actions all along the expert state distribution as well. And so one of the things that we could do is instead of going back all the way to the beginning every single time, we could actually reset to different states along the expert state distribution."},{"start":1779.88,"text":"And there's actually work that shows that if you were to do this and had a way to do this, then you'd actually learn a bit more efficiently than always starting from the initial state distribution, even in episodic learning settings. And so the way that this works is it's basically going to be the same exact thing as before, but with basically two small modifications."},{"start":1804.36,"text":"And the first is that if we want to be able to reset and learn a policy that brings us to the expert state distribution, then we need a way to approximate what that expert state distribution is. And so we'll assume that we have a few demonstrations. And so maybe step negative one here is you're basically given some set of expert"},{"start":1832.7,"text":"trajectories or expert demonstrations, and these will be examples of ways to accomplish the task. And then you need to change the reward function for the backward policy, where the reward function shouldn't be to reach the initial state distribution, but instead it should be to reach states that the expert visits."},{"start":1858.32,"text":"And so in particular, we'll be given a small set of demonstrations, and ideally what we want this to look like is we'd run our forward policy, and then we run our backward policy after it's kind of learned so
