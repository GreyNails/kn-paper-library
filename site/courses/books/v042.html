lready know from last time, and we're going to tweak it just a little bit. So we're going to see linear regression, which we saw last time, but now we're going to give it a probabilistic interpretation. And the hope from doing this is that you can see that this method of going over the probabilistic stuff, just that piece of the modeling is changing. So hopefully, you're not seeing two things change at once.","start":41.52,"end":64.24},{"id":3,"text":"Once we get to the form of having a probabilistic model, and what it's going to do is basically model, as you hear, some errors. We're going to use those errors to talk about other forms of models that we could have, and in particular, motivate the workhorse for what we're going to see now, which is logistic regression. And as I would say, as I mentioned last time, logistic regression is kind of the last layer of every model that you've probably interacted with. If it's text or code, any chat GPT, all the rest, that last layer is effectively what we would call a softmax.","start":65.03,"end":93.99},{"id":4,"text":"logistic regression. We'll talk a little bit about that. And then the last thing that we'll talk about today is also to give you a little bit of an idea about optimization methods. So last time we saw gradient descent and stochastic gradient descent. Those are the workhorse methods. That's what you're going to use throughout the course. But I'm going to show you just because it's kind of historically important and also kind of an interesting algorithm in its own right. I'm going to show you Newton's method just very, very briefly.","start":94.5,"end":118.98},{"id":5,"text":"Now, that flow, the thing that I want you to take away from all of this is this framework, which we're going to see again and again for the next couple weeks, which is this maximum likelihood method. And basically, the idea here at a very high level is you set up a probabilistic model, a forward model of how you think the world behaves, and that determines what the parameters you're solving are. And we'll see this. This will be made concrete, but I want to make sure you hear this kind of high-level piece. And then with that...","start":120.37,"end":146.09},{"id":6,"text":"essence of this model this maximum likelihood that's the thing that's going to generalize across various different setups it's going to generalize both from continuous to discrete to all kinds of interesting new models that we have all the way into the modern ai models that we use today and so this method is just something you should know it's really foundational it's kind of the bedrock and we'll try and introduce it here as quickly as we can first from linear regression so it's nice and simple and then bumping up to discrete stuff program clear enough awesome let's get to it","start":146.76,"end":175.36}],"notes":["本段主要介绍了最大似然方法作为机器学习中一个基础且通用的框架，它适用于从连续到离散的各种模型，包括现代人工智能模型。该方法是课程后续内容的基础，将从线性回归开始介绍，逐步过渡到离散任务。","讲者强调最大似然方法的通用性，它不仅适用于回归问题，也适用于分类任务，如逻辑回归。这种方法是构建各种模型的核心，包括现代AI模型中的最后一层softmax函数。","讲者提到最大似然方法是课程后续内容的基石，将从线性回归开始，逐步过渡到离散任务。这表明课程将通过简单例子逐步引入复杂概念。","讲者提到最大似然方法的通用性，它能够推广到各种不同的设置中，包括从连续到离散的模型，以及现代AI模型。这表明该方法是机器学习中的基础工具。","讲者提到最大似然方法是课程中要介绍的核心内容，将从线性回归开始，逐步过渡到离散任务。这表明课程将通过逐步递进的方式，帮助学生理解该方法。","讲者提到最大似然方法是机器学习中的基础方法，是构建各种模型的基石。这表明该方法在机器学习中的重要性，是后续内容的基础。"],"formulas":[],"uncertainties":["essence of this model this maximum likelihood that's the thing that's going to generalize across various different setups it's going to generalize both from continuous to discrete to all kinds of interesting new models that we have all the way into the modern ai models that we use today and so this method is just something you should know it's really foundational it's kind of the bedrock and we'll try and introduce it here as quickly as we can first from linear regression so it's nice and simple and then bumping up to discrete stuff program clear enough awesome let's get to it"],"diagram":"none","start":5.14,"end":175.36,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.14,"text":"Welcome to CS229. This is going to be lecture three. We're going to talk today about classification, which is arguably one of the most fundamental tasks in machine learning, and one which started a lot of the progress that you see today. And so classification, if you recall, is going to be this problem where our label space comes from a bunch of discrete outcomes rather than continuous outcomes, which is what we saw last time. In regression, you could have prices. Here you may have, you know."},{"start":33.42,"text":"Cat versus dog, you may have different words. They come from a discrete set. And that will change a couple of things inside our setup."},{"start":41.52,"text":"So what we're going to do first is we're going to take something we already know from last time, and we're going to tweak it just a little bit. So we're going to see linear regression, which we saw last time, but now we're going to give it a probabilistic interpretation. And the hope from doing this is that you can see that this method of going over the probabilistic stuff, just that piece of the modeling is changing. So hopefully, you're not seeing two things change at once."},{"start":65.03,"text":"Once we get to the form of having a probabilistic model, and what it's going to do is basically model, as you hear, some errors. We're going to use those errors to talk about other forms of models that we could have, and in particular, motivate the workhorse for what we're going to see now, which is logistic regression. And as I would say, as I mentioned last time, logistic regression is kind of the last layer of every model that you've probably interacted with. If it's text or code, any chat GPT, all the rest, that last layer is effectively what we would call a softmax."},{"start":94.5,"text":"logistic regression. We'll talk a little bit about that. And then the last thing that we'll talk about today is also to give you a little bit of an idea about optimization methods. So last time we saw gradient descent and stochastic gradient descent. Those are the workhorse methods. That's what you're going to use throughout the course. But I'm going to show you just because it's kind of historically important and also kind of an interesting algorithm in its own right. I'm going to show you Newton's method just very, very briefly."},{"start":120.37,"text":"Now, that flow, the thing that I want you to take away from all of this is this framework, which we're going to see again and again for the next couple weeks, which is this maximum likelihood method. And basically, the idea here at a very high level is you set up a probabilistic model, a forward model of how you think the world behaves, and that determines what the parameters you're solving are. And we'll see this. This will be made concrete, but I want to make sure you hear this kind of high-level piece. And then with that..."},{"start":146.76,"text":"essence of this model this maximum likelihood that's the thing that's going to generalize across various different setups it's going to generalize both from continuous to discrete to all kinds of interesting new models that we have all the way into the modern ai models that we use today and so this method is just something you should know it's really foundational it's kind of the bedrock and we'll try and introduce it here as quickly as we can first from linear regression so it's nice and simple and then bumping up to discrete stuff program clear enough awesome let's get to it"}],"speech_gaps":[],"frame":"../frames/v042/001.webp","frame_time":17.14},{"title":"加权最小二乘的统计建模基础","segments":[{"id":7,"text":"All right, so recall from last time, we were looking at least squares. And the point of this is that we didn't really have a full kind of justification for it. So we're now going to try and justify what we did in least squares, which you already hopefully know and feel very comfortable with.","start":177.81,"end":190.75},{"id":8,"text":"But we're going to try and put it in this new, more probabilistic modeling context. And that's going to be the lever that allows us to extend it to many new and potentially unfamiliar settings. So what we have here, if you recall, is we have a bunch of points xi. These are vectors that live in d plus 1. And recall, the d plus 1 comes because we have this convention that they all have one component that has one in them everywhere, so that we can talk with a kind of nicer notation, just so we don't have to have what's called a bias or an offset in our notes.","start":191.57,"end":217.03},{"id":9,"text":"We also have for every point a corresponding label. This is because we're still in supervised learning. In supervised learning, you have labels. The labels here, because it's regression, come from a continuous space. Here, one of our favorite continuous space, just real numbers.","start":218.09,"end":231.13},{"id":10,"text":"inner product. And then there's an error here. This is the error term, if you like, which is how far off we are from the label, our hypothesis on x predicting the yi, and we pay for it in the square. We talked about last time all the reasons we paid for it in the square. I won't go over them again. Mathematical convenience and also some modeling. Today, we're going to focus more on the modeling aspect of that and try and see kind of what consequence that has.","start":233.01,"end":257.55},{"id":11,"text":"inner product. And then there's an error here. This is the error term, if you like, which is how far off we are from the label, our hypothesis on x predicting the yi, and we pay for it in the square. We talked about last time all the reasons we paid for it in the square. I won't go over them again. Mathematical convenience and also some modeling. Today, we're going to focus more on the modeling aspect of that and try and see kind of what consequence that has. What's another way to interpret this model here? Okay, good enough.","start":258.19,"end":285.25},{"id":12,"text":"All right. So what we're going to talk about is where did this model come from? And we're going to try and justify it in terms of something that's hopefully a little bit more simple. Even if you don't buy that it's any more simple, that doesn't really matter. It's another lens to view the problem that's going to allow us, as we said, to generalize. And this probabilistic interpretation is really critical in machine learning. It was kind of the core way we did a lot of things. And it's still, you can see it lurking underneath many of the models that we build today. Okay. So here it comes.","start":287.25,"end":316.3},{"id":13,"text":"If you haven't seen something like this before, it'll take a little bit of a second to think what's actually going on. If you have seen kind of stats models, it's basically a statistical model. So we're going to make an assumption, which is a little bit weird. We'll talk about why it's weird in a second. But what we're going to assume is that the data that we see is generated according to some process. And that we know something about that process. Or rather, we're willing to model that process in some way. So here we have our first example of the simplest process that we could imagine. We'll make this increasingly more complicated as we go throughout the course.","start":316.8,"end":346.1}],"notes":["本段讲解了最小二乘法的目标函数及其背后的建模意义。讲者指出，最小二乘法的目标是找到一个参数θ，使得预测值与实际标签之间的误差平方和最小。这种建模方式不仅具有数学上的便利性，还具有实际的建模意义，特别是在回归问题中，标签来自连续空间（如实数）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.81,"end":346.1,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":177.81,"text":"All right, so recall from last time, we were looking at least squares. And the point of this is that we didn't really have a full kind of justification for it. So we're now going to try and justify what we did in least squares, which you already hopefully know and feel very comfortable with."},{"start":191.57,"text":"But we're going to try and put it in this new, more probabilistic modeling context. And that's going to be the lever that allows us to extend it to many new and potentially unfamiliar settings. So what we have here, if you recall, is we have a bunch of points xi. These are vectors that live in d plus 1. And recall, the d plus 1 comes because we have this convention that they all have one component that has one in them everywhere, so that we can talk with a kind of nicer notation, just so we don't have to have what's called a bias or an offset in our notes."},{"start":218.09,"text":"We also have for every point a corresponding label. This is because we're still in supervised learning. In supervised learning, you have labels. The labels here, because it's regression, come from a continuous space. Here, one of our favorite continuous space, just real numbers."},{"start":233.01,"text":"Now the goal is, if you recall, we're going to find some theta, and that theta is going to live in rd plus 1. It satisfies, we derived at the end of last lecture, that it satisfies this equation that I just highlighted here, which is theta is going to be the minimum over some set of errors. And we talked about these errors here are, here's the prediction. This is the hypothesis theta applied to the point xi. Mechanically, it is just this linear."},{"start":258.19,"text":"inner product. And then there's an error here. This is the error term, if you like, which is how far off we are from the label, our hypothesis on x predicting the yi, and we pay for it in the square. We talked about last time all the reasons we paid for it in the square. I won't go over them again. Mathematical convenience and also some modeling. Today, we're going to focus more on the modeling aspect of that and try and see kind of what consequence that has. What's another way to interpret this model here? Okay, good enough."},{"start":287.25,"text":"All right. So what we're going to talk about is where did this model come from? And we're going to try and justify it in terms of something that's hopefully a little bit more simple. Even if you don't buy that it's any more simple, that doesn't really matter. It's another lens to view the problem that's going to allow us, as we said, to generalize. And this probabilistic interpretation is really critical in machine learning. It was kind of the core way we did a lot of things. And it's still, you can see it lurking underneath many of the models that we build today. Okay. So here it comes."},{"start":316.8,"text":"If you haven't seen something like this before, it'll take a little bit of a second to think what's actually going on. If you have seen kind of stats models, it's basically a statistical model. So we're going to make an assumption, which is a little bit weird. We'll talk about why it's weird in a second. But what we're going to assume is that the data that we see is generated according to some process. And that we know something about that process. Or rather, we're willing to model that process in some way. So here we have our first example of the simplest process that we could imagine. We'll make this increasingly more complicated as we go throughout the course."}],"speech_gaps":[],"frame":"../frames/v042/002.webp","frame_time":189.81},{"title":"加权最小二乘法中的噪声建模","segments":[{"id":14,"text":"So what is our process? What we imagine that the process that we generate this data from is that every data point, effectively there exists a true theta that's out there in the world. We don't get to see theta, but it exists somewhere. And then when we see yi, remember we talked about that yi wasn't perfectly accurate, some noise term is introduced. Here, epsilon i.","start":346.85,"end":369.67},{"id":15,"text":"Now, epsilon i, we don't know perfectly. We don't get to observe it. It's some error that's in the system. And that epsilon i is going to capture kind of euphemistically noise. So what does noise mean? Well, it can mean lots of things. It could literally mean experiment noise. It could mean that there's some jitter in the equipment. When we measure it, there's some error because the magnets are off or whatever it is inside. There's little errors that are in there in the background. It could also, and the way I prefer to think about it, it could also be what we're willing to model up to.","start":370.62,"end":399.9},{"id":16,"text":"That one is going to take a little bit of getting used to, but what it means is there's a bunch of errors that maybe we even know are in the measurements, but we don't want to model. We want to see how well our model can predict without having to go into that level of detail. So it's really an abstraction problem when we do modeling. And that's really important to keep in mind because one of the things that can really twist you in knots is you can look at a model and say, is it true? And the problem is the quote will be used in every statistics class you take.","start":400.5,"end":425.72},{"id":17,"text":"All models are wrong. Some models are useful. And so we're really talking about utility in terms of the abstraction. But these are the kinds of things that we will typically think about as in the noise. Model effects, measurement errors, things like that. So what properties are we going to assume about the noise? There are many that you could have of increasing complexity. But we'll start with one of the simplest, which underlies a lot of what we do in machine learning. So let's talk about formally.","start":427.01,"end":452.29},{"id":18,"text":"Now, as I say, yeah, the quote has to be there. Sorry, I should have waited half a slide. This quote has to be, it's like I was walking in, by the way, through the coffee shop, whatever, in Y2E2, and I looked into a room and I saw the same quote. They had a nicer slide, if I'm going to be honest. It had the picture of the guy and the whole thing. It was way better done. It wasn't just some little beamer thing at the bottom. They really put in some time. Good on them. It was a TA, if we're going to be honest.","start":453.98,"end":474.5},{"id":19,"text":"Any case, my point is that this is the canon of modeling. You want to know up to what are you modeling, and you're going to kind of box the errors. And you're making some assumption, always, in everything we do. And those assumptions are pretty interesting. All right, so what should we expect from epsilon i? Okay, so it's going to be a random variable. We're going to assume it's stochastic. That's going to allow us to do a bunch of analysis on it. And in particular, what we're going to assume is...","start":475.19,"end":504.84},{"id":20,"text":"Any case, my point is that this is the canon of modeling. You want to know up to what are you modeling, and you're going to kind of box the errors. And you're making some assumption, always, in everything we do. And those assumptions are pretty interesting.","start":506.49,"end":520.75}],"notes":["本段讨论了建模过程中对噪声的抽象处理，强调了模型的有用性而非绝对正确性。讲者指出，噪声可以指测量误差或未建模的系统误差，建模时需要明确界定误差的范围。","讲者提到‘所有模型都是错误的，但有些模型是有用的’这一经典观点，强调了建模过程中对误差的抽象和假设的重要性。模型的有用性取决于其对实际问题的抽象程度。","在建模过程中，需要对噪声做出假设，例如噪声是随机变量，且其期望值为零。这些假设允许进行统计分析，并为后续的建模和优化提供基础。","讲者提到，噪声可以是实验误差，如设备的抖动或测量误差，也可以是未建模的系统误差。建模时需要明确界定这些误差的范围，以避免过度拟合或忽略关键因素。","讲者强调，建模时需要对误差进行抽象，即‘框定’误差，这有助于简化模型并专注于模型的预测能力，而不是深入到每一个细节。","讲者提到，噪声的假设是建模过程中的关键部分，这些假设影响了模型的性能和适用性。例如，假设噪声是零均值的随机变量，可以为后续的最小二乘估计提供理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":346.85,"end":520.75,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":346.85,"text":"So what is our process? What we imagine that the process that we generate this data from is that every data point, effectively there exists a true theta that's out there in the world. We don't get to see theta, but it exists somewhere. And then when we see yi, remember we talked about that yi wasn't perfectly accurate, some noise term is introduced. Here, epsilon i."},{"start":370.62,"text":"Now, epsilon i, we don't know perfectly. We don't get to observe it. It's some error that's in the system. And that epsilon i is going to capture kind of euphemistically noise. So what does noise mean? Well, it can mean lots of things. It could literally mean experiment noise. It could mean that there's some jitter in the equipment. When we measure it, there's some error because the magnets are off or whatever it is inside. There's little errors that are in there in the background. It could also, and the way I prefer to think about it, it could also be what we're willing to model up to."},{"start":400.5,"text":"That one is going to take a little bit of getting used to, but what it means is there's a bunch of errors that maybe we even know are in the measurements, but we don't want to model. We want to see how well our model can predict without having to go into that level of detail. So it's really an abstraction problem when we do modeling. And that's really important to keep in mind because one of the things that can really twist you in knots is you can look at a model and say, is it true? And the problem is the quote will be used in every statistics class you take."},{"start":427.01,"text":"All models are wrong. Some models are useful. And so we're really talking about utility in terms of the abstraction. But these are the kinds of things that we will typically think about as in the noise. Model effects, measurement errors, things like that. So what properties are we going to assume about the noise? There are many that you could have of increasing complexity. But we'll start with one of the simplest, which underlies a lot of what we do in machine learning. So let's talk about formally."},{"start":453.98,"text":"Now, as I say, yeah, the quote has to be there. Sorry, I should have waited half a slide. This quote has to be, it's like I was walking in, by the way, through the coffee shop, whatever, in Y2E2, and I looked into a room and I saw the same quote. They had a nicer slide, if I'm going to be honest. It had the picture of the guy and the whole thing. It was way better done. It wasn't just some little beamer thing at the bottom. They really put in some time. Good on them. It was a TA, if we're going to be honest."},{"start":475.19,"text":"Any case, my point is that this is the canon of modeling. You want to know up to what are you modeling, and you're going to kind of box the errors. And you're making some assumption, always, in everything we do. And those assumptions are pretty interesting. All right, so what should we expect from epsilon i? Okay, so it's going to be a random variable. We're going to assume it's stochastic. That's going to allow us to do a bunch of analysis on it. And in particular, what we're going to assume is..."},{"start":506.49,"text":"epsilon i equals zero, the expected value of epsilon i. So the mental model we have is that we're drawing these epsilons, right? We don't get to see them, but some source is drawing these epsilons and has some error in there, but the error is not systematically biased."}],"speech_gaps":[],"frame":"../frames/v042/003.webp","frame_time":358.85},{"title":"加权最小二乘中的假设与误差模型","segments":[{"id":21,"text":"Why is the error not systematically biased? Well, if it were, we would be in kind of a tough shape with our model, right? Because it would mean there was some offset that was hidden from us that we couldn't understand when we were doing the regression. So kind of this is one we're making almost out of necessity, right? We say, no, there exists a real theta i, and all of these epsilons, you know, they're not biased in any way.","start":521.38,"end":540.52},{"id":22,"text":"Now, you can have biased errors. We'll come back to that later. But for right now, this is the unbiased assumption. Hopefully, it makes sense. On average, there's nothing in the data set that we're generating that's kind of precluding us from finding that right theta.","start":540.92,"end":551.86},{"id":23,"text":"The second, which you may have encountered before as well, is that they are called IID, or independent and identically distributed. This is a very strong assumption overall, but it's a good modeling assumption. It's going to be one we're making for computational reasons, really. It's going to allow us to do a bunch of math in this lecture that allows us to simplify a bunch of our calculations. And again, it's a modeling assumption. It could be wrong. It could be that you have data from source A and data from source B, and their error profiles are totally different. When I collect and I pool that data, I get all the errors.","start":555.94,"end":585.54},{"id":24,"text":"errors from source B have one variance and another have different variance and I put them together. This model is going to ignore that. Now you could model that. We'll come back to how to do that later. But is it clear? It's just a statement that this model is capturing it. All of the errors are uniform in some way and they're independent and identically distributed. So what does that mean? Formally what it means is when I take the expectation of any pair of them, if they're not equal, I can move the expectations inside.","start":585.55,"end":612.42},{"id":25,"text":"That is a factor. That is what we mean by independent. It's a formal, very strong version of independent. The second thing that we mean, this is just denoting it, I see it's cut off, is we think the variance or the square term is the next thing we're going to model.","start":613.23,"end":635.02},{"id":26,"text":"Now, you could model a lot of it. You could track your errors and track what are called every moment. You could map the second, the third, the fourth, the fifth, the sixth. You could put all the things in there. And maybe that would tell you something about the function. But all we're going to say is that we model just the first non-trivial piece. So we have two things. We have the zero. We have their independent.","start":635.48,"end":654.68},{"id":27,"text":"We're going to model this variance. This is a measure. I'm going to show you some examples of this. This is a measure of how noisy the data is. It's the measure of the spread. We'll talk about that and I'll show you if you're not familiar with this in just a little bit. By show of hands, who has seen Gaussians before? Those are IID Gaussians. Awesome. You guys are going to have no problem with this. It's going to be amazing.","start":655.57,"end":672.77},{"id":28,"text":"Awesome. Alright, so it turns out that this definition here is exactly going to lead to Gaussians. Okay, so you may ask this is actually Gaussians are a nice and beautiful thing that we use all the time because they have these nice properties.","start":675.39,"end":686.97}],"notes":["本段讨论了在加权最小二乘模型中，误差项的无偏性假设。讲者指出，如果误差存在系统性偏差，那么模型将无法正确捕捉真实参数θ，因为这种偏差会隐藏在数据中，导致回归结果不准确。因此，模型假设误差项是无偏的，即它们的期望为零。","讲者提到，误差项的独立同分布（IID）假设是模型的重要前提。这一假设虽然在现实中可能不成立，但它是计算和建模的必要条件，因为它允许简化数学推导。例如，当数据来自不同来源时，误差的方差可能不同，但模型会忽略这种差异。","讲者进一步解释了独立同分布的数学含义，即对于任意两个不同的误差项，它们的期望可以相互独立。这为后续的数学推导提供了基础。","讲者提到，模型只考虑误差的方差（即第二阶矩），而不考虑更高阶的矩（如第三、第四阶）。这是因为方差是描述数据噪声和分布的最基础的统计量，而更高阶的矩可能对模型的建模效果影响较小。","讲者指出，误差的方差是衡量数据噪声程度的重要指标，它反映了数据的离散程度。讲者还提到，高斯分布（正态分布）是满足独立同分布假设的典型例子，因此在加权最小二乘模型中，误差通常被假设为高斯分布。","讲者最后提到，高斯分布具有良好的数学性质，使得它在建模和推导中非常有用。因此，在后续的课程中，将重点讨论高斯分布及其在加权最小二乘模型中的应用。"],"formulas":[{"latex":"E[\\varepsilon_i] = 0","symbols":"误差项的期望为零","explanation":"该公式正确表达了误差项的期望为零，符合无偏性假设。","evidence":"Why is the error not systematically biased? Well, if it were, we would be in kind of a tough shape with our model, right? Because it would mean there was some offset that was hidden from us that we couldn't understand when we were doing the regression. So kind of this is one we're making almost out of necessity, right? We say, no, there exists a real theta i, and all of these epsilons, you know, they're not biased in any way."},{"latex":"E[\\varepsilon_i \\varepsilon_j] = 0 \\text{ f h of math in this lecture that allows us to simplify a bunch of our calculations. And again, it's a modeling assumption. It could be wrong. It could be that you have data from source A and data from source B, and their error profiles are totally different. When I collect and I pool that data, I get all the errors."},{"start":585.55,"text":"errors from source B have one variance and another have different variance and I put them together. This model is going to ignore that. Now you could model that. We'll come back to how to do that later. But is it clear? It's just a statement that this model is capturing it. All of the errors are uniform in some way and they're independent and identically distributed. So what does that mean? Formally what it means is when I take the expectation of any pair of them, if they're not equal, I can move the expectations inside."},{"start":613.23,"text":"That is a factor. That is what we mean by independent. It's a formal, very strong version of independent. The second thing that we mean, this is just denoting it, I see it's cut off, is we think the variance or the square term is the next thing we're going to model."},{"start":635.48,"text":"Now, you could model a lot of it. You could track your errors and track what are called every moment. You could map the second, the third, the fourth, the fifth, the sixth. You could put all the things in there. And maybe that would tell you something about the function. But all we're going to say is that we model just the first non-trivial piece. So we have two things. We have the zero. We have their independent."},{"start":655.57,"text":"We're going to model this variance. This is a measure. I'm going to show you some examples of this. This is a measure of how noisy the data is. It's the measure of the spread. We'll talk about that and I'll show you if you're not familiar with this in just a little bit. By show of hands, who has seen Gaussians before? Those are IID Gaussians. Awesome. You guys are going to have no problem with this. It's going to be amazing."},{"start":675.39,"text":"Awesome. Alright, so it turns out that this definition here is exactly going to lead to Gaussians. Okay, so you may ask this is actually Gaussians are a nice and beautiful thing that we use all the time because they have these nice properties."}],"speech_gaps":[],"frame":"../frames/v042/004.webp","frame_time":533.38},{"title":"高斯分布的特性与应用","segments":[{"id":29,"text":"One of the things that they are characterized by is that they can be zero mean and just be described by their variance. You may say, what if I want to get a better model that's described by more orders? Turns out, those don't exist. This is uniquely defined. Gaussians are uniquely defined if you make this assumption. And so they show up everywhere in statistical analysis. So they're just kind of the workhorse. And they're a really good first kind of approximation. They're not something, just so we're clear, it's not something where you're like, oh, is the data really Gaussian?","start":688.06,"end":715.88},{"id":30,"text":"That's not it's not a categorical kind of thing you're worried about.","start":716.68,"end":719.2},{"id":31,"text":"You want to know if the Gaussian model is good enough for whatever you care about.","start":719.46,"end":722.86},{"id":32,"text":"So if it turns out that the Gaussian model gives you a really,","start":723.1,"end":726.0},{"id":33,"text":"you know, kind of terrible fit to your data","start":726.1,"end":727.98},{"id":34,"text":"and you need to model the errors in a more precise way","start":728.36,"end":731.54},{"id":35,"text":"to get the accuracy you want, then Gaussian isn't right for you.","start":731.54,"end":734.38},{"id":36,"text":"But it's a sliding scale.","start":734.52,"end":735.78},{"id":37,"text":"It's relative to what you want to get out of it.","start":735.88,"end":737.62},{"id":38,"text":"And one interesting thing that's amazing is if you get enough data,","start":737.8,"end":740.62},{"id":39,"text":"you know, a lot of large numbers and a bunch of other things,","start":740.78,"end":743.22},{"id":40,"text":"as long as it's bounded CLTs and all that, if you know what they are,","start":743.32,"end":745.72},{"id":41,"text":"it kind of turns out that this is a pretty good model. So it's a great place to start, okay?","start":745.72,"end":750.04},{"id":42,"text":"All right. All right, so let's see this. Actually, before I go on, any questions on the setup before","start":750.94,"end":756.7},{"id":43,"text":"I go down? Please. Wonderful. Yeah, great question. So what we're doing, so we haven't really talked","start":756.7,"end":768.5},{"id":44,"text":"at all about how it impacts y, but you're already one step ahead, which is phenomenal. You're","start":768.5,"end":772.58},{"id":45,"text":"basically saying that yi, if I think about yi's distribution, it's clearly going to be a function","start":772.58,"end":777.3},{"id":46,"text":"of this character here, which is the actual model underneath the thing, which if I had the right","start":777.3,"end":782.12},{"id":47,"text":"theta I could compute, plus this thing here. And now I can look and see what the variance of the","start":782.12,"end":786.9},{"id":48,"text":"yi's are. This is a statement just about the random or stochastic part, which is just the","start":786.9,"end":791.88},{"id":49,"text":"epsilons. This statement makes sense even if there's a more complicated or crazier model","start":791.88,"end":796.22},{"id":50,"text":"here. It has nothing to do with the yi's. But from this, you're exactly right and we're going","start":796.22,"end":800.98},{"id":51,"text":"to get there in a second, you're going to be able to determine the distributions of the yi's as well,","start":800.98,"end":804.7},{"id":52,"text":"conditioned on having theta, if that makes sense. And if it doesn't make sense,","start":804.82,"end":807.82},{"id":53,"text":"it'll make sense in a couple slides. Yeah, awesome. Great question. Please.","start":808.28,"end":811.2},{"id":54,"text":"Exactly right, yes. It's exactly a variance here because the mean is zero. It's a wonderful","start":813.98,"end":817.88},{"id":55,"text":"question. Perfect. Awesome. Other questions? Fantastic. Okay, so what does a Gaussian look like?","start":817.88,"end":825.84},{"id":56,"text":"Let's see. Somehow this is getting cut off a little bit. Alright, so I'm gonna start here","start":828.18,"end":832.62},{"id":57,"text":"and then I'll go down. Alright, so we're going to use this notation. I hope this notation is","start":832.62,"end":837.82},{"id":58,"text":"familiar to you. If it's not, don't worry about it. It's just notation. It doesn't really mean","start":837.82,"end":842.46},{"id":59,"text":"all that much. This means that I want... z is going to be a normal distribution with mean mu.","start":842.46,"end":847.18},{"id":60,"text":"That's going to be its center, right? So in the last slide, the mean was 0. That's the expected","start":847.36,"end":851.68},{"id":61,"text":"value is equal to zero. And in this case, the expected value is equal to mu of z. That's all","start":851.68,"end":857.2},{"id":62,"text":"that's saying. And then it's one-dimensional. So it's variance. There's no covariance. It's","start":857.2,"end":861.6},{"id":63,"text":"just a variance. It's sigma squared.","start":861.6,"end":862.86}],"notes":["本段主要讨论高斯分布的特性，强调其在统计分析中的广泛应用。高斯分布由均值和方差唯一确定，且在数据量足够大时，中心极限定理表明其是一个良好的模型。但高斯模型是否适用取决于具体需求，如果数据拟合效果差，可能需要更复杂的模型。","讲者指出，高斯分布的均值为零，方差是其唯一描述参数。即使模型更复杂，高斯分布的方差描述仍然有效，因为它仅关注随机部分（误差项）。这表明高斯分布是建模误差的有力工具。","讲者提到，高斯分布的均值和方差是其核心参数，且在实际应用中，均值为零的高斯分布是常见的。这表明在建模时，可以将数据视为均值为零的高斯分布加上误差项。","讲者强调，高斯分布的方差描述了数据的随机性，而均值则代表了数据的中心趋势。在实际建模中，可以通过分析误差项的方差来确定数据的分布特性。","讲者指出，高斯分布的适用性取决于具体需求。如果数据拟合效果差，可能需要更复杂的模型。但高斯分布作为初始模型，具有良好的解释性和计算效率。","讲者提到，高斯分布的方差是其唯一描述参数，且在数据量足够大时，中心极限定理表明其是一个良好的模型。这表明在实际应用中，高斯分布是一个值得尝试的起点。"],"formulas":[{"latex":"Var(y_i) = \\text{Var}(\\varepsilon)","symbols":"方差描述了随机误差项的分布特性","explanation ou want to get out of it."},{"start":737.8,"text":"And one interesting thing that's amazing is if you get enough data,"},{"start":740.78,"text":"you know, a lot of large numbers and a bunch of other things,"},{"start":743.32,"text":"as long as it's bounded CLTs and all that, if you know what they are,"},{"start":745.72,"text":"it kind of turns out that this is a pretty good model. So it's a great place to start, okay?"},{"start":750.94,"text":"All right. All right, so let's see this. Actually, before I go on, any questions on the setup before"},{"start":756.7,"text":"I go down? Please. Wonderful. Yeah, great question. So what we're doing, so we haven't really talked"},{"start":768.5,"text":"at all about how it impacts y, but you're already one step ahead, which is phenomenal. You're"},{"start":772.58,"text":"basically saying that yi, if I think about yi's distribution, it's clearly going to be a function"},{"start":777.3,"text":"of this character here, which is the actual model underneath the thing, which if I had the right"},{"start":782.12,"text":"theta I could compute, plus this thing here. And now I can look and see what the variance of the"},{"start":786.9,"text":"yi's are. This is a statement just about the random or stochastic part, which is just the"},{"start":791.88,"text":"epsilons. This statement makes sense even if there's a more complicated or crazier model"},{"start":796.22,"text":"here. It has nothing to do with the yi's. But from this, you're exactly right and we're going"},{"start":800.98,"text":"to get there in a second, you're going to be able to determine the distributions of the yi's as well,"},{"start":804.82,"text":"conditioned on having theta, if that makes sense. And if it doesn't make sense,"},{"start":808.28,"text":"it'll make sense in a couple slides. Yeah, awesome. Great question. Please."},{"start":813.98,"text":"Exactly right, yes. It's exactly a variance here because the mean is zero. It's a wonderful"},{"start":817.88,"text":"questio istance between mu","start":1065.11,"end":1068.17},{"id":93,"text":"here is symmetric in both directions. So you fall off just as fast this way as this way. So the","start":1068.17,"end":1073.51},{"id":94,"text":"observation is asymmetric. Can you model things that are asymmetric with a Gaussian? Not that","start":1073.51,"end":1077.73},{"id":95,"text":"piece of it. The second is, can you model, let's say, multimodal, which traditionally means that","start":1077.73,"end":1081.93},{"id":96,"text":"it has multiple bumps? We will see in a later lecture, I think I'm going to get the lecture","start":1081.93,"end":1086.01},{"id":97,"text":"numbers wrong because we switched them this year. It's usually around lecture 11, I want to say,","start":1086.01,"end":1089.43},{"id":98,"text":"or 9. We're going to see a model called the mixture of Gaussians, where indeed you can use","start":1089.53,"end":1094.61},{"id":99,"text":"many Gaussians as building blocks to kind of build up multiple bumps.","start":1094.61,"end":1097.65},{"id":100,"text":"But today, we're just going to worry about single Gaussians.","start":1097.79,"end":1100.35},{"id":101,"text":"Perfect.","start":1100.69,"end":1101.07},{"id":102,"text":"Great question.","start":1101.15,"end":1101.49},{"id":103,"text":"you're already identifying some things that are strange about this distribution, right? We talked about the errors. The fact that it's symmetric means it's not, for example, aiming too high or too low in the prices, right? There's not a systematic bias in one direction. That would give you something that was asymmetric in the errors, right? We're just going to assume we don't know that information or we're not willing to model it. The other bumps is a statement that there is kind of one kind of noise source, but you could easily imagine that there's multiple noise sources. Remember my example from earlier, we had an A and a B.","start":1102.77,"end":1132.31},{"id":104,"text":"station. Maybe they have very
