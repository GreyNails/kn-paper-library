, you would expect the variance to go up, right? Not a strange statement. Okay, cool. Alright, now that gets us down to here."},{"start":1256.9,"text":"Now all we're doing is we're plugging into that horrible formula we saw before, we're plugging in all the terms. The mu is the old formula we saw before, the yi's are the same, the squared is the same, two sigma squared, and the normalization doesn't really change here."},{"start":1271.71,"text":"because the sigmas were really responsible for normalization. The mean didn't appear in the normalization, only the variance. Because the mean is just shifting it around. That's not going to change how much area is under the curve. So you wouldn't expect the mean to change the normalization. But making it wider or narrower, you would expect that to change the normalization. Indeed, it does."},{"start":1290.34,"text":"Okay, hopefully this formula is making intuitive sense. The details of it, if the details aren't quite there where you couldn't generate the formula, play with it. It will eventually become a little bit more natural. But all I care about really is that you kind of understand how it's put together. What are the key components? There's a distance squared. There's a variance that normalizes the units that are there. And then I hope that this notation doesn't terrify you. If you haven't seen this notation before, that's one that I would pay attention to because we will use it quite freely. This kind of condition and parameter notation, I use it kind of without thinking. If I say something,"},{"start":1319.88,"text":"that doesn't make sense or you don't know the notation, please feel free to ask. It's not that deep. You can always write it out. It's just mysterious and you get used to these shorthands. So I wanted to highlight it. All right. Now, this basically says what we just went through. We condition on xi. Conditioning here means that we assume that we see it. We have access to xi when we're making the distribution. So the distribution is fixed once we have the xi."},{"start":1345.86,"text":"This makes sense, right? If you think about it, every Xi is a different data point, but the errors for each one are going to be stochastic. So they're setting the mean. They set the average of where we think is going on. And in contrast, this is a bit of terminology that you'll see. Theta parameterizes. You're not actually conditioning on theta. It's not an event in the space. I don't want to be too precise about it. It's not something you condition on. Theta is just a parameter. So there's many different distributions out there. Each one..."},{"start":1371.6,"text":"parameterized by theta. And what we're going to do in a second is we're going to basically pick over all the distributions that could have generated this data set, which one is most likely. And that's going to be the principle of maximum likelihood. That's it. It's honestly it. So this just says we're going to search over the thetas. We don't really search over the data yet. We don't search over xi's. Those are given to us. That's input to the problem."}],"speech_gaps":[],"frame":"../frames/v042/008.webp","frame_time":1231.16},{"title":"加权最小二乘法中的参数表示与概率模型","segments":[{"id":116,"text":"Yeah, and you'll see me use the bar versus semicolon notation. Here the semicolon indicates that there are parameters on this side and the bar here is indicating this conditioning. Please.","zh":"是的，你会看到我使用横线与分号的符号表示。在这里，分号表示这一侧有参数，而横线则表示这里的条件。请。","start":1396.09,"end":1407.71},{"id":117,"text":"If you have a theta and a gamma, multiple parameters, would that just be a theta comma? Exactly right. So the question is, what if you have multiple parameters here? And what happens is you have theta, and then you would have exactly as you said to keep your example. You have a gamma, you have an alpha, and so on. They would just be concatenated there or sometimes put into a little tuple of values. Or what you'll often see, because I'm extremely lazy as a human, I will just write something like, oh, there's phi. And you remember phi bar has all the parameters. And it's up to you to go source it. And maybe I screwed it up.","zh":"如果你有 theta 和 gamma，多个参数，那是不是就写成 theta 逗号？完全正确。所以问题是，如果你这里有很多参数，会发生什么呢？你会有 theta，然后你会像你所说的那样，保持你的例子。你会有 gamma，你会有 alpha，依此类推。它们只是在那里被连接起来，或者有时被放入一个小的值元组中。或者你经常会看到，因为作为一个人我极其懒惰，我会直接写成，比如，哦，这里有 phi。然后你会记得 phi 横线包含所有参数。至于你是否能正确找到它，就取决于你自己了。也许我搞错了。","start":1409.23,"end":1437.51},{"id":118,"text":"Great question. Other questions? Awesome. All right. Okay. So now we can talk. I've been saying this intuitively as I've gone through it. What is a likelihood? So we've been talking about what's likely or not likely. And that actually is underneath that is lurking a somewhat formal phrase. Okay.","zh":"非常好的问题。还有其他问题吗？太棒了。好的。现在我们可以谈了。我一直在直观地讲述这个问题。什么是似然？我们一直在谈论什么更可能或更不可能。实际上，这背后隐藏着一个相对正式的说法。好的。","start":1438.23,"end":1463.19},{"id":119,"text":"So the mental model is you show me, remember, a bunch of XIs and a bunch of YIs. Those are what showed up. And now what I'm going to try and do is for each setting of theta, I can tell you how likely that data point is under the model.","zh":"心理模型是，你给我展示一些 X_i 和一些 Y_i。这些是出现的数据。现在我要尝试做的是，对于每个 theta 的设定，我可以告诉你在模型下这个数据点有多可能。","start":1463.93,"end":1484.49},{"id":120,"text":"So sorry for the larger box. This is the box I care about, which I'm now covering up and making impossible to read, which is perfect. Sorry. So this one here is saying, for each data point, it says, given xi and a yi pair, I can tell you how probabilistically likely it is. And that's basically just evaluating that function p that we had before. It was higher on things that were more likely, lower on things that are less likely. Let's not make a big deal out of it. And always non-negative.","zh":"抱歉，这个大框有点大。这是我要关注的框，我现在把它盖住并使其无法阅读，这非常完美。抱歉。这个框在这里表示，对于每个数据点，它说，给定一个 x_i 和 y_i 的配对，我可以告诉你它有多可能。这基本上就是我们之前提到的函数 p 的评估。它在更可能的事件上更高，在更不可能的事件上更低。我们不要对此大惊小怪。并且它总是非负的。","start":1485.83,"end":1509.25},{"id":121,"text":"Now, why do I take this product over all the data sets? What am I using there? Well, there's only one assumption written on the slide, so it's fair to guess it's this one. How is that happening? Well, what's happening here is you could imagine I have the probability of all the x's and all the y's simultaneously. That would be some big, really gigantic function, right? That had a condition on all the x's and all the y's simultaneously. And instead, what IID is allowing me to do is say that function can be represented as a product.","zh":"现在，为什么我要对所有数据集取这个乘积？我在那里使用了什么？好吧，幻灯片上只写了一个假设，所以可以合理地猜测就是这个。这是怎么发生的呢？好吧，这里发生的事情是，你可以想象我有所有x和所有y同时出现的概率。这会是一个非常巨大、非常庞大的函数，对吧？这个函数对所有x和所有y同时有约束。而相反，独立同分布（IID）允许我做的事情是说这个函数可以表示为一个乘积。","start":1511.51,"end":1538.99},{"id":122,"text":"And that's what this notation means, by the way. It says all the y's and all the x's. And this cute little notation belies the fact that that would be huge. It would be a n times d dimensional thing that I was looking at. That would be really, really big. This is a massive simplification that IID gives me. Because they're independent, I can basically turn them into a product. That's what independence means. It really is a factorization. It means that it's a product. It's not a mysterious property of it. It is literally effectively the definition. Okay, cool.","zh":"顺便说一下，这个符号的意思就是所有y和所有x。这个可爱的小符号掩盖了这样一个事实，那就是这会非常巨大。它会是一个n乘以d维的东西，我正在关注这个。这会非常、非常大。这是独立同分布（IID）给我带来的一个巨大简化。因为它们是独立的，我基本上可以把它们转化为一个乘积。这就是独立性的含义。它确实是一种分解。它意味着这是一个乘积。这不是它的一个神秘属性。它实际上是定义本身。好的，很酷。","start":1540.13,"end":1569.51},{"id":123,"text":"All right, now, this score.","zh":"好的，现在这个得分函数。","start":1571.12,"end":1575.37}],"notes":["本段讨论了参数表示的多种方式，包括使用逗号分隔多个参数、将参数放入元组或使用符号如phi bar来表示所有参数。讲者强调了这些表示方法的灵活性和实际应用中的常见做法。","讲者通过概率模型的直观解释，说明了如何根据给定的xi和yi对，计算数据点在模型下的概率。这涉及对概率函数p的评估，其值的高低反映了数据点的可能程度。","讲者解释了为什么需要对所有数据点的概率取乘积。这基于独立同分布（IID）的假设，允许将联合概率分解为各个数据点概率的乘积，从而简化计算。","讲者进一步说明了独立同分布（IID）如何带来巨大的简化，将高维的联合概率转化为乘积形式。这种分解是独立性的直接结果，体现了概率论中的基本概念。","讲者提到，这种乘积形式的简化是独立性定义的直接体现，而不是某种神秘的性质。这强调了独立性在概率建模中的核心作用。","讲者最后提到“this score”，可能是指后续将讨论的得分函数（score function），但未展开说明。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1396.09,"end":1575.37,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1396.09,"text":"Yeah, and you'll see me use the bar versus semicolon notation. Here the semicolon indicates that there are parameters on this side and the bar here is indicating this conditioning. Please."},{"start":1409.23,"text":"If you have a theta and a gamma, multiple parameters, would that just be a theta comma? Exactly right. So the question is, what if you have multiple parameters here? And what happens is you have theta, and then you would have exactly as you said to keep your example. You have a gamma, you have an alpha, and so on. They would just be concatenated there or sometimes put into a little tuple of values. Or what you'll often see, because I'm extremely lazy as a human, I will just write something like, oh, there's phi. And you remember phi bar has all the parameters. And it's up to you to go source it. And maybe I screwed it up."},{"start":1438.23,"text":"Great question. Other questions? Awesome. All right. Okay. So now we can talk. I've been saying this intuitively as I've gone through it. What is a likelihood? So we've been talking about what's likely or not likely. And that actually is underneath that is lurking a somewhat formal phrase. Okay."},{"start":1463.93,"text":"So the intuition is, as I said to you, among the many distributions that are out there that have your data. So the mental model is you show me, remember, a bunch of XIs and a bunch of YIs. Those are what showed up. And now what I'm going to try and do is for each setting of theta, I can tell you how likely that data point is under the model."},{"start":1485.83,"text":"So sorry for the larger box. This is the box I care about, which I'm now covering up and making impossible to read, which is perfect. Sorry. So this one here is saying, for each data point, it says, given xi and a yi pair, I can tell you how probabilistically likely it is. And that's basically just evaluating that function p that we had before. It was higher on things that were more likely, lower on things that are less likely. Let's not make a big deal out of it. And always non-negative."},{"start":1511.51,"text":"Now, why do I take this product over all the data sets? What am I using there? Well, there's only one assumption written on the slide, so it's fair to guess it's this one. How is that happening? Well, what's happening here is you could imagine I have the probability of all the x's and all the y's simultaneously. That would be some big, really gigantic function, right? That had a condition on all the x's and all the y's simultaneously. And instead, what IID is allowing me to do is say that function can be represented as a product."},{"start":1540.13,"text":"And that's what this notation means, by the way. It says all the y's and all the x's. And this cute little notation belies the fact that that would be huge. It would be a n times d dimensional thing that I was looking at. That would be really, really big. This is a massive simplification that IID gives me. Because they're independent, I can basically turn them into a product. That's what independence means. It really is a factorization. It means that it's a product. It's not a mysterious property of it. It is literally effectively the definition. Okay, cool."},{"start":1571.12,"text":"All right, now, this score."}],"speech_gaps":[],"frame":"../frames/v042/009.webp","frame_time":1408.09},{"title":"加权最小二乘与最大似然","segments":[{"id":124,"text":"which I just substituted in. I didn't do anything fancy. I just took p and substituted in the last slide, right? So this score now, for every theta, there's a score which I can compute with this nasty formula. You could write it in, you know, whatever you want. You know, Cloud Code could write it for you. PyTorch could write it for you. NumPy could write it for you. Whatever, okay? You could write it in raw Python. Whatever you want, you can write this thing and it's going to give you a score. And the idea is that if theta is a better model of the world,","zh":"我刚刚已经代入了。我没有做任何复杂的事情。我只是取了p，并在上一张幻灯片中代入了，对吧？因此，对于每一个theta，我现在有一个得分，可以通过这个复杂的公式来计算。你可以用任何你想要的方式写出它。你知道的，Cloud Code可以为你写出它，PyTorch也可以，NumPy也可以。随便你，好吧？你也可以用原始的Python写出它，无论你想要什么，你都可以写出这个东西，它会给你一个得分。想法是，如果theta是对世界更好的模型，","start":1576.77,"end":1602.71},{"id":125,"text":"it should say that the data is more likely. So if I were to compare two thetas, theta 1 and theta 2, and one gives me score x and the other one gives me score y, and x is bigger than y, I'm probably more likely to pick the more likely one. It fits the data better. Intuitive enough? Clear enough? Please ask a question if not. All right. Now, it turns out, remember I told you I didn't care about normalization constants? In general, that's true.","zh":"它应该表示数据更有可能出现。因此，如果我要比较两个theta，theta 1和theta 2，其中一个给出得分x，另一个给出得分y，而x比y大，我可能更倾向于选择更可能的那个。它更符合数据。直观吗？清楚吗？如果不清楚，请提问。好的。事实上，还记得我告诉过你我不关心归一化常数吗？一般来说，这是正确的。","start":1603.39,"end":1631.13},{"id":126,"text":"But here, why this is so nice is because these things are all, you know, greater than zero.","zh":"但在这里，为什么这么好是因为这些量都是大于零的。","start":1631.82,"end":1636.82},{"id":127,"text":"I can take logs.","zh":"我可以取对数。","start":1638.06,"end":1638.94},{"id":128,"text":"We love logarithms.","zh":"我们喜欢对数。","start":1639.48,"end":1640.7},{"id":129,"text":"And the reason we love logs is they're going to turn this nasty product,","zh":"我们喜欢对数的原因是它们能把这个复杂的乘积，","start":1640.8,"end":1642.88},{"id":130,"text":"which is, you know, numerically unstable and has a bunch of problems,","zh":"你知道的，数值上不稳定并且有很多问题，","start":1643.04,"end":1645.06},{"id":131,"text":"into some kind of nice closed form looking thing.","zh":"转化为某种看起来不错的闭合形式。","start":1646.5,"end":1649.1},{"id":132,"text":"And we're going to have logs of all the normalization contexts,","zh":"我们将记录所有归一化上下文的日志，","start":1649.32,"end":1651.84},{"id":133,"text":"minus, because there's a minus here, all these characters there.","zh":"减号，因为这里有一个减号，所有这些字符都在那里。","start":1652.6,"end":1656.0},{"id":134,"text":"And that's going to be little l, or script l, is going to be the log likelihood.","zh":"这将是小写 l 或者 script l，它将是对数似然。","start":1656.5,"end":1660.64},{"id":135,"text":"And you'll hear me use the log likelihood all the time. It's just the log of the original function.","zh":"你将经常听到我使用对数似然。它只是原始函数的对数。","start":1660.64,"end":1665.38},{"id":136,"text":"So far, so good. Now, we wanted to maximize this guy internally. That's how we were thinking about","zh":"到目前为止，一切顺利。现在，我们想要最大化这个量。这就是我们思考的方式，","start":1667.1,"end":1673.52},{"id":137,"text":"it. We want to pick the theta that had the highest score. Here, because after we've taken logs and we","zh":"我们想要选择得分最高的 theta。在这里，因为在我们取对数之后，我们","start":1673.52,"end":1677.84},{"id":138,"text":"have negatives, we're going to see that we may want to change that. So let's get that. Now,","zh":"会有负号，我们可能会想要改变这一点。所以让我们得到这一点。现在，","start":1677.84,"end":1687.56},{"id":139,"text":"Now, as I mentioned, this is just some arithmetic simplification.","zh":"正如我提到的，这只是某些算术简化。","start":1687.56,"end":1690.34},{"id":140,"text":"We pulled out the term.","zh":"我们提取了这个项。","start":1690.76,"end":1691.94},{"id":141,"text":"This term was constant, so we didn't have to deal with it.","zh":"这个项是常数，因此我们不需要处理它。","start":1691.98,"end":1694.12},{"id":142,"text":"We had this nice form here.","zh":"我们这里有一个很好的形式。","start":1694.24,"end":1696.66},{"id":143,"text":"And lo and behold, if you remember the notation,","zh":"而且正如你所记得的，如果记住这个符号，","start":1696.98,"end":1699.48},{"id":144,"text":"if you're like a real notation aficionado from last week,","zh":"如果你像上周那样是一位真正的符号爱好者，","start":1699.6,"end":1702.72},{"id":145,"text":"then you see that this j theta is exactly the loss term","zh":"那么你会看到这个 j theta 恰好就是我们上周在最小二乘中使用的损失项。","start":1702.88,"end":1705.6},{"id":146,"text":"that we had in least squares last week.","zh":"因此，这仅仅是这个字符本身。","start":1705.6,"end":1707.22},{"id":147,"text":"So this is just this character right here.","zh":"所以这就是这里的这个字符。","start":1707.5,"end":1710.52},{"id":148,"text":"And this one half.","zh":"还有这个一半。","start":1711.4,"end":1712.62},{"id":149,"text":"This made j.","zh":"这使得 j。","start":1713.2,"end":1714.22},{"id":150,"text":"That's just notation.","zh":"这只是记号。","start":1715.74,"end":1716.6},{"id":151,"text":"If you don't remember that, don't worry.","zh":"如果你不记得这个，没关系。","start":1716.6,"end":1717.8},{"id":152,"text":"But that was the least squares laws.","zh":"但那是最小二乘法则。","start":1717.96,"end":1719.52},{"id":153,"text":"So basically, what we've done is we've","zh":"所以基本上，我们所做的就是从某种概率模型","start":1719.8,"end":1721.48},{"id":154,"text":"gone from some probabilistic model","zh":"转变到一个常数，这个常数不会随着 theta 变化，","start":1721.48,"end":1723.06},{"id":155,"text":"to where a constant, which no theta changes,","zh":"它是一个不依赖于 theta 的常数。","start":1723.06,"end":1726.86},{"id":156,"text":"because we were not putting theta does not contain sigma.","zh":"因为我们没有将 theta 设为包含 sigma。","start":1727.04,"end":1729.8},{"id":157,"text":"That was fixed.","zh":"这个问题已经解决了。","start":1729.9,"end":1730.36},{"id":158,"text":"We now have this.","zh":"我们现在有了这个。","start":1731.1,"end":1732.54},{"id":159,"text":"And so what we've justified is that least squares is basically","zh":"因此，我们所证明的是，最小二乘法基本上是","start":1732.68,"end":1735.06},{"id":160,"text":"this model where we have fixed variance,","zh":"这样一个模型，其中方差是固定的，","start":1735.06,"end":1738.26},{"id":161,"text":"but we have errors that are iid.","zh":"但误差是独立同分布的。","start":1738.8,"end":1740.88},{"id":162,"text":"That's it.","zh":"就是这样。","start":1743.02,"end":1743.5},{"id":163,"text":"Mean 0.","zh":"均值为 0。","start":1744.54,"end":1745.16},{"id":164,"text":"Yeah.","zh":"是的。","start":1745.32,"end":1745.52},{"id":165,"text":"wondering why is the problem really here?","zh":"想知道这个问题到底出在哪里？","start":1746.79,"end":1748.47}],"notes":["本段主要讲解了如何通过最大似然估计来推导最小二乘法。讲者指出，通过取对数可以将乘积形式的似然函数转化为更易于处理的加法形式，从而避免数值不稳定的问题。同时，讲者强调了对数似然函数在模型选择中的重要性，即更高的对数似然值意味着更好的模型拟合。","讲者提到，虽然通常不关心归一化常数，但在某些情况下，这些常数可以被忽略，因为它们对最大化目标函数没有影响。此外，讲者还指出，通过取对数和处理负号，可以将原始的似然函数转化为对数似然函数，从而简化计算。","讲者进一步说明，通过简化和提取常数项，可以将对数似然函数转化为与最小二乘法相关的损失函数。这表明，最小二乘法实际上是基于某种概率模型的推导结果，其中假设误差项是独立同分布的，并且具有固定的方差。","讲者还提到，通过将对数似然函数转化为损失函数，可以将问题转化为一个优化问题，即寻找使损失函数最小化的参数值。这与最小二乘法的目标一致，即最小化误差的平方和。","讲者指出，最小二乘法的推导基于某些假设，例如误差项的独立性和固定方差。这些假设使得最小二乘法成为一种有效的估计方法，但同时也限制了其适用范围。","最后，讲者提到，虽然最小二乘法在某些情况下是有效的，但在其他情况下可能需要使用加权最小二乘法或其他方法来处理不同的误差结构。"],"formulas":[{"latex":"l(\\theta) = \\log(p(x|\\theta))","symbols":"对数似然函数","explanation":"公式正确，表示对数似然函数，适用于概率模型中最大化似然估计的场景。","evidence":"And that's going to be little l, or script l, is going to be the log likelihood."}],"uncertainties":["theta does not contain sigma"],"diagram":"none","start":1576.77,"end":1748.47,"asr_flags":[],"math_clarifications":["公式1中包含归一化常数是不正确的，因为对数似然函数通常不包含归一化常数，特别是在最大化似然估计时。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":42,"raw_segments":[{"start":1576.77,"text":"which I just substituted in. I didn't do anything fancy. I just took p and substituted in the last slide, right? So this score now, for every theta, there's a score which I can compute with this nasty formula. You could write it in, you know, whatever you want. You know, Cloud Code could write it for you. PyTorch could write it for you. NumPy could write it for you. Whatever, okay? You could write it in raw Python. Whatever you want, you can write this thing and it's going to give you a score. And the idea is that if theta is a better model of the world,"},{"start":1603.39,"text":"it should say that the data is more likely. So if I were to compare two thetas, theta 1 and theta 2, and one gives me score x and the other one gives me score y, and x is bigger than y, I'm probably more likely to pick the more likely one. It fits the data better. Intuitive enough? Clear enough? Please ask a question if not. All right. Now, it turns out, remember I told you I didn't care about normalization constants? In general, that's true."},{"start":1631.82,"text":"But here, why this is so nice is because these things are all, you know, greater than zero."},{"start":1638.06,"text":"I can take logs."},{"start":1639.48,"text":"We love logarithms."},{"start":1640.8,"text":"And the reason we love logs is they're going to turn this nasty product,"},{"start":1643.04,"text":"which is, you know, numerically unstable and has a bunch of problems,"},{"start":1646.5,"text":"into some kind of nice closed form looking thing."},{"start":1649.32,"text":"And we're going to have logs of all the normalization contexts,"},{"start":1652.6,"text":"minus, because there's a minus here, all these characters there."},{"start":1656.5,"text":"And that's going to be little l, or script l, is going to be the log likelihood."},{"start":1660.64,"text":"And you'll hear me use the log likelihood all the time. It's just the log of the original function."},{"start":1667.1,"text":"So far, so good. Now, we wanted to maximize this guy internally. That's how we were thinking about"},{"start":1673.52,"text":"it. We want to pick the theta that had the highest score. Here, because after we've taken logs and we"},{"start":1677.84,"text":"have negatives, we're going to see that we may want to change that. So let's get that. Now,"},{"start":1687.56,"text":"Now, as I mentioned, this is just some arithmetic simplification."},{"start":1690.76,"text":"We pulled out the term."},{"start":1691.98,"text":"This term was constant, so we didn't have to deal with it."},{"start":1694.24,"text":"We had this nice form here."},{"start":1696.98,"text":"And lo and behold, if you remember the notation,"},{"start":1699.6,"text":"if you're like a real notation aficionado from last week,"},{"start":1702.88,"text":"then you see that this j theta is exactly the loss term"},{"start":1705.6,"text":"that we had in least squares last week."},{"start":1707.5,"text":"So this is just this character right here."},{"start":1711.4,"text":"And this one half."},{"start":1713.2,"text":"This made j."},{"start":1715.74,"text":"That's just notation."},{"start":1716.6,"text":"If you don't remember that, don't worry."},{"start":1717.96,"text":"But that was the least squares laws."},{"start":1719.8,"text":"So basically, what we've done is we've"},{"start":1721.48,"text":"gone from some probabilistic model"},{"start":1723.06,"text":"to where a constant, which no theta changes,"},{"start":1727.04,"text":"because we were not putting theta does not contain sigma."},{"start":1729.9,"text":"That was fixed."},{"start":1731.1,"text":"We now have this."},{"start":1732.68,"text":"And so what we've justified is that least squares is basically"},{"start":1735.06,"text":"this model where we have fixed variance,"},{"start":1738.8,"text":"but we have errors that are iid."},{"start":1743.02,"text":"That's it."},{"start":1744.54,"text":"Mean 0."},{"start":1745.32,"text":"Yeah."},{"start":1746.79,"text":"wondering why is the problem really here?"}],"speech_gaps":[],"frame":"../frames/v042/010.webp","frame_time":1588.77},{"title":"加权最小二乘与最大似然原理","segments":[{"id":166,"text":"Oh, great question. So in this particular case, it is. In general, it's not actually going to be positive. And that causes a whole bunch of pain when that's the case. Here, because this thing, the exponential, has that nice property that this is never exactly 0, we can pass through the logs here. If, for example, you have a distribution where the question was, if p is 0, what happens? Clearly, it's non-negative, right? Because it could be 0 places. If you have things that look like discrete distributions, then you have to be careful about what your domain is.","zh":"哦，很好的问题。在这种情况下，确实是这样。一般来说，它实际上不会是正定的。当这种情况发生时，会带来很多麻烦。在这里，由于这个指数函数具有这样一个很好的性质，即这个值永远不会恰好为0，因此我们可以在这里进行对数变换。例如，如果你有一个分布，其中的问题是，如果p为0，会发生什么？显然，它是非负的，对吧？因为它可能在某些地方为0。如果你处理的是类似离散分布的情况，那么你必须小心你的定义域是什么。","start":1749.78,"end":1777.66},{"id":167,"text":"Do this log trick. So it will still show up. But it's something you should pay attention to. If you start taking logs of zeros, all bets are off. But so this transformation happens enough that we're going to use it. And in fact, as we'll see later, most of the distributions we have effectively make sure that this happens. And you should check that as you go. And we will check it whenever I use the transformation. That's a great question. Cool.","zh":"进行这个对数变换。它仍然会出现，但你需要注意这一点。如果你开始对0取对数，一切都不确定了。但正因为这种变换如此常见，我们才会使用它。事实上，正如我们之后会看到的，我们大多数分布实际上确保了这种情况的发生。在你进行过程中，你应该检查这一点。每当我使用这个变换时，我们都会检查它。这是一个很好的问题。很好。","start":1778.66,"end":1802.54},{"id":168,"text":"Awesome. All right. So this is just restating what I was saying before. We've shown that finding theta is, you know, we wanted to maximize L theta. So we had this model and we motivated that on entirely intuitive grounds. Among all the distributions that were out there, we wanted the one that was most likely that it kind of explained our data the best, right? All the data that were out there, we measured them against the data. That was L theta. We showed that that was the same as this, maximizing this character, right? And then this thing,","zh":"太棒了。好的。这仅仅是重申我之前所说的内容。我们已经证明，寻找θ的过程，也就是我们想要最大化Lθ。我们有一个模型，并且我们完全基于直观的动机来推动这一点。在所有存在的分布中，我们想要找到最有可能解释我们数据的那个分布，对吧？所有存在的数据，我们将其与数据进行比较。这就是Lθ。我们已经证明，这等同于最大化这个特征，对吧？然后这个东西，","start":1807.0,"end":1834.88},{"id":169,"text":"We recognize as the least squares loss, but it shows up under a minus sign. And so I'm ruining the punchline. That's why we were minimizing it. Last time we were minimizing the errors. This time we were maximizing likelihood and minimizing this fell out. Constant minus that. If you think about taking a derivative with respect to theta, this term would go away. However you'd want to think about it, it's clear that that is equivalent. That's the part that you have control over.","zh":"我们识别为最小二乘损失，但它是以负号出现的。因此我破坏了这个结论。这就是我们为什么要最小化它的原因。上一次我们是在最小化误差。这次我们是在最大化似然，而最小化这个则自然出现。常数减去这个。如果你考虑对θ求导，这个项就会消失。无论你怎么考虑，这显然是等价的。这是你能够控制的部分。","start":1835.66,"end":1859.88},{"id":170,"text":"Now, you say at one level, you look at this and you say, well, this seems like a bunch of needless symbol pushing. Why did you waste my time with this? Fair point. But the reason is because this principle of maximum likelihood is actually more general than least squares. So one of the things that you're going to have in machine learning is you come to a new problem, you want to model it, and it turns out that it's a lot easier to think about forward models. Now, that statement, just so we're clear, that modeling statement is with a huge asterisk on it.","zh":"现在，你可能会说，在一个层面上，你看到这些内容会觉得这似乎是一堆毫无意义的符号操作。你为什么要浪费我的时间讲这些呢？这是个合理的观点。但原因在于，最大似然原理实际上比最小二乘法更为一般。因此，在机器学习中，当你遇到一个新问题并想要对其进行建模时，你会发现考虑前向模型会更容易。不过，为了清楚起见，这个建模的说法带有巨大的星号注释。","start":1862.01,"end":1889.29},{"id":171,"text":"I'm saying in practice or in academics or all the rest, we found it easier to think in terms of formal forward models many times. And so this is a recipe that works. It's not saying something like you can only think this way. Many other ways to think. But this is why it's so popular. And then once we have a forward model, we're going to see over this lecture and the next that you basically can turn a crank and always get out some optimization procedure.","zh":"我在实践中或学术上，以及其他各种场合中发现，很多时候我们更容易以形式化的前向模型来思考。因此，这是一个有效的做法。它并不是在说你只能这样思考，还有许多其他思考方式。但这就是为什么这种方法如此流行。一旦我们有了前向模型，接下来在这节课和下一节课中，我们将看到你基本上可以进行一些操作，从而始终得到一个优化过程。","start":1889.61,"end":1913.17}],"notes":["本段讨论了在使用对数变换时需要注意的问题，特别是当概率为零时，对数变换会导致问题。讲者强调了在处理分布时，需要特别注意定义域，尤其是在离散分布的情况下。","讲者提到，虽然对数变换在某些情况下会带来一些计算上的便利，但必须谨慎处理，因为对数零会导致计算错误。因此，讲者建议在使用对数变换时要进行检查。","讲者指出，最大似然原理比最小二乘法更为通用，这在机器学习中非常重要。当遇到新问题时，使用最大似然原理可以更方便地构建模型。","讲者提到，虽然最大似然原理在某些情况下可能看起来是不必要的符号操作，但其背后的原理是通用的，适用于各种模型构建场景。","讲者强调，虽然最大似然原理是常用的建模方法，但并不是唯一的建模方式。其他方法同样有效，但最大似然原理因其通用性而受到欢迎。","最后，讲者提到，一旦建立了前向模型，就可以通过优化过程来解决各种问题，这为后续的课程内容奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1749.78,"end":1913.17,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1749.78,"text":"Oh, great question. So in this particular case, it is. In general, it's not actually going to be positive. And that causes a whole bunch of pain when that's the case. Here, because this thing, the exponential, has that nice property that this is never exactly 0, we can pass through the logs here. If, for example, you have a distribution where the question was, if p is 0, what happens? Clearly, it's non-negative, right? Because it could be 0 places. If you have things that look like discrete distributions, then you have to be careful about what your domain is."},{"start":1778.66,"text":"do this log trick. So it will still show up. But it's something you should pay attention to. If you start taking logs of zeros, all bets are off. But so this transformation happens enough that we're going to use it. And in fact, as we'll see later, most of the distributions we have effectively make sure that this happens. And you should check that as you go. And we will check it whenever I use the transformation. That's a great question. Cool."},{"start":1807.0,"text":"Awesome. All right. So this is just restating what I was saying before. We've shown that finding theta is, you know, we wanted to maximize L theta. So we had this model and we motivated that on entirely intuitive grounds. Among all the distributions that were out there, we wanted the one that was most likely that it kind of explained our data the best, right? All the datas that were out there, we measured them against the data. That was L theta. We showed that that was the same as this, maximizing this character, right? And then this thing,"},{"start":1835.66,"text":"We recognize as the least squares loss, but it shows up under a minus sign. And so I'm ruining the punchline. That's why we were minimizing it. Last time we were minimizing the errors. This time we were maximizing likelihood and minimizing this fell out. Constant minus that. If you think about taking a derivative with respect to theta, this term would go away. However you'd want to think about it, it's clear that that is equivalent. That's the part that you have control over."},{"start":1862.01,"text":"Now, you say at one level, you look at this and you say, well, this seems like a bunch of needless symbol pushing. Why did you waste my time with this? Fair point. But the reason is because this principle of maximum likelihood is actually more general than least squares. So one of the things that you're going to have in machine learning is you come to a new problem, you want to model it, and it turns out that it's a lot easier to think about forward models. Now, that statement, just so we're clear, that modeling statement is with a huge asterisk on it."},{"start":1889.61,"text":"I'm saying in practice or in academics or all the rest, we found it easier to think in terms of formal forward models many times. And so this is a recipe that works. It's not saying something like you can only think this way. Many other ways to think. But this is why it's so popular. And then once we have a forward model, we're going to see over this lecture and the next that you basically can turn a crank and always get out some optimization procedure."}],"speech_gaps":[],"frame":"../frames/v042/011.webp","frame_time":1761.78},{"title":"加权最小二乘法与最大似然框架","segments":[{"id":172,"text":"That's going to allow us to solve a range of different things that in the machine learning literature, if you were to go back in time and look at them, they look quite distinct, but actually they're all instances of one generalized framework. That's quite useful for you to know in case you encounter your particular kinds of errors that you have, discrete errors, count errors, all the rest. We'll see some of those in the next lecture. But for now, is it clear that why this maximum likelihood I claim reduces to this least squares thing that we saw last time? We have justified that model.","zh":"这将使我们能够解决一系列不同的问题，在机器学习文献中，如果你回到过去查看它们，它们看起来相当不同，但实际上它们都是一个通用框架的实例。这对于你来说很有用，以防你遇到你自己的特定类型的错误，比如离散错误、计数错误等等。我们将在下一次讲座中看到其中的一些内容。但目前，是否清楚为什么我所说的最大似然方法会减少到我们上次看到的最小二乘法？我们已经证明了这个模型。","start":1913.98,"end":1942.54},{"id":173,"text":"Good enough. All right.","zh":"好 enough。好的。","start":1944.68,"end":1949.77},{"id":174,"text":"OK, so the summary of least squares. We introduced the maximum likelihood framework, which is super powerful. We're going to use it in the rest of this lecture and in the next lecture. We showed that least squares was actually a version of this maximum likelihood kind of event. And we learned some notation still that we're still loading up on probabilistic notation, the most important of which was the conditional and the distributed notation. What does it mean to be distributed as a normal? And what does it mean to condition on things? What are parameters? Those are the notational elements that were important from this section.","zh":"好的，最小二乘法的总结。我们引入了最大似然框架，这是一个非常强大的工具。我们将在这次讲座和下一次讲座中使用它。我们展示了最小二乘法实际上是这种最大似然事件的一个版本。我们还学习了一些概率符号的表示，我们仍在逐步掌握这些符号，其中最重要的包括条件分布和分布的表示。什么是服从正态分布？什么是条件？什么是参数？这些都是本节中重要的符号元素。","start":1951.34,"end":1978.04},{"id":175,"text":"Any questions here before I move on to the next topic? Please. Awesome question. Yeah, awesome question. So the question was, where does that sigma squared, where does it actually come from? Do we have an estimate of it? So on one hand, the simplest version of the model is you just assume it or look at the data and fit it outside of the modeling procedure. That's the practitioner's answer to it.","zh":"在继续下一个主题之前，这里有没有问题？请。很棒的问题。是的，很棒的问题。问题是，这个σ²到底来自哪里？我们有没有它的估计值？一方面，模型的最简单版本是你假设它或者查看数据并在建模过程之外拟合它。这是实践者对此问题的回答。","start":1979.55,"end":2005.83},{"id":176,"text":"The other is you can create a maximum likelihood where the variance is also unknown and you're fitting it as well. And so that's a more sophisticated example where you would actually put that in. But this comes down to the modeling question. What are you actually fitting from the data? And what are you assuming is what we'll call a kind of a prior distribution? What do you assume you know about the data? I would say if your model is such that small changes in a parameter like that.","zh":"另一方面，你可以创建一个最大似然模型，其中方差也是未知的，并且你也会拟合它。因此，这是一个更复杂的例子，你会实际将其纳入模型中。但这归结为建模问题。你实际上是从数据中拟合什么？你假设什么是我们所说的某种先验分布？你对数据有什么假设？我会说，如果你的模型是这样的，参数的小变化。","start":2006.32,"end":2028.6},{"id":177,"text":"change your conclusions, you should be very nervous. And so one of the things is if you see there's a lot of times when you'll do what people call hyperparameter tuning, where they'll fit a range of those different models to their data. If they lead to totally different conclusions, that should make you uncomfortable.","zh":"如果你改变你的结论，你应该非常紧张。因此，其中一件事是，当你看到很多情况下人们会进行所谓的超参数调优，即他们会对不同的模型在数据上进行拟合。如果这些模型导致完全不同的结论，这应该让你感到不安。","start":2029.51,"end":2044.17},{"id":178,"text":"It really should make you uncomfortable because it means that there's something else going on that you're not modeling and it's important. If you change a parameter that you don't think should matter and nothing happens, that's a really good sign. So if you sweep the variance and you're like, as long as I'm within two orders of magnitude of variance one, I get kind of the same answer. You feel very comfortable as a statistician. There's a machine learner.","zh":"这真的应该让你感到不安，因为它意味着还有其他你没有建模的东西正在起作用，而且这是重要的。如果你改变一个你认为不应该影响结果的参数，而结果没有任何变化，那是一个非常好的信号。因此，如果你扫描方差，并且发现只要方差在数量级上与方差一相差两个数量级以内，你就会得到差不多一样的结果，作为统计学家，你会感到非常安心。","start":2044.73,"end":2073.08},{"id":179,"text":"Okay, so now on to the topic of classification. So classification is, we're going to look at binary classification. We'll eventually look at multi-class classification. And binary classification, it's a simplified setting where we have, again, we have our friends, XIs, right, that are there.","zh":"好的，现在我们进入分类的主题。我们将首先研究二分类问题，之后再研究多分类问题。二分类是一个简化的设定，其中我们再次拥有我们的朋友XIs，对吧。","start":2074.43,"end":2089.33}],"notes":["本段讨论了最大似然估计在模型中如何处理方差参数的问题。讲者指出，方差可以是已知的，也可以是未知的，需要通过最大似然估计进行拟合。这涉及到模型构建时的假设，即我们是否将方差作为参数进行估计。","讲者强调了模型构建时的假设问题，即我们是否将方差视为已知或未知。如果模型对参数的小变化非常敏感，那么这可能意味着模型的假设存在问题，需要进一步检查。","讲者提到超参数调优（hyperparameter tuning）的过程，即通过拟合不同模型来调整参数，如果这些模型得出的结论差异很大，这可能意味着模型没有捕捉到数据中的关键信息。","讲者指出，如果改变一个看似不重要的参数却对结果没有影响，这可能是一个好的迹象，说明模型对参数的依赖性较低，或者参数的估计较为稳定。","讲者还提到，如果方差在两个数量级范围内变化时，结果仍然相似，这表明模型对数据的拟合较为稳健，统计学家会对此感到舒适。","最后，讲者提到在机器学习中，这种对参数变化的敏感性分析是重要的，可以帮助识别模型中的潜在问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1913.98,"end":2089.33,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1913.98,"text":"That's going to allow us to solve a range of different things that in the machine learning literature, if you were to go back in time and look at them, they look quite distinct, but actually they're all instances of one generalized framework. That's quite useful for you to know in case you encounter your particular kinds of errors that you have, discrete errors, count errors, all the rest. We'll see some of those in the next lecture. But for now, is it clear that why this maximum likelihood I claim reduces to this least squares thing that we saw last time? We have justified that model."},{"start":1944.68,"text":"Good enough. All right."},{"start":1951.34,"text":"OK, so the summary of least squares. We introduced the maximum likelihood framework, which is super powerful. We're going to use it in the rest of this lecture and in the next lecture. We showed that least squares was actually a version of this maximum likelihood kind of event. And we learned some notation still that we're still loading up on probabilistic notation, the most important of which was the conditional and the distributed notation. What does it mean to be distributed as a normal? And what does it mean to condition on things? What are parameters? Those are the notational elements that were important from this section."},{"start":1979.55,"text":"Any questions here before I move on to the next topic? Please. Awesome question. Yeah, awesome question. So the question was, where does that sigma squared, where does it actually come from? Do we have an estimate of it? So on one hand, the simplest version of the model is you just assume it or look at the data and fit it outside of the modeling procedure. That's the practitioner's answer to it."},{"start":2006.32,"text":"The other is you can create a maximum likelihood where the variance is also unknown and you're fitting it as well. And so that's a more sophisticated example where you would actually put that in. But this comes down to the modeling question. What are you actually fitting from the data? And what are you assuming is what we'll call a kind of a prior distribution? What do you assume you know about the data? I would say if your model is such that small changes in a parameter like that."},{"start":2029.51,"text":"change your conclusions, you should be very nervous. And so one of the things is if you see there's a lot of times when you'll do what people call hyperparameter tuning, where they'll fit a range of those different models to their data. If they lead to totally different conclusions, that should make you uncomfortable."},{"start":2044.73,"text":"It really should make you uncomfortable because it means that there's something else going on that you're not modeling and it's important. If you change a parameter that you don't think should matter and nothing happens, that's a really good sign. So if you sweep the variance and you're like, as long as I'm within two orders of magnitude of variance one, I get kind of the same answer. You feel very comfortable as a statistician. There's a machine learner. Great questions. Others? Awesome. Let's get at it."},{"start":2074.43,"text":"Okay, so now on to the topic of classification. So classification is, we're going to look at binary classification. We'll eventually look at multi-class classification. And binary classification, it's a simplified setting where we have, again, we have our friends, XIs, right, that are there."}],"speech_gaps":[],"frame":"../frames/v042/012.webp","frame_time":1925.98},{"title":"加权最小二乘与分类问题","segments":[{"id":180,"text":"We also now have yi's and those yi's are going to be modeled as just 0, 1.","zh":"我们现在也有 yi 的值，这些 yi 的值将被建模为 0 或 1。","start":2090.74,"end":2095.18},{"id":181,"text":"You can imagine as like cat or not cat,","zh":"你可以想象成像猫或不是猫，","start":2095.8,"end":2099.16},{"id":182,"text":"I don't know, whatever you want,","zh":"我不知道，无论你想什么，","start":2099.3,"end":2100.22},{"id":183,"text":"whatever makes you happy.","zh":"无论让你开心的是什么。","start":2100.36,"end":2101.56},{"id":184,"text":"It's just a binary thing that says,","zh":"它只是一个二元的问题，","start":2101.66,"end":2102.82},{"id":185,"text":"is it yes or no? That's what our yi's are.","zh":"是还是否？这就是我们的 yi 值。","start":2102.9,"end":2104.76},{"id":186,"text":"Now the first question you should probably ask is,","zh":"现在你首先应该问的问题是，","start":2105.48,"end":2107.46},{"id":187,"text":"why do I need to do anything different?","zh":"我为什么需要做任何不同的事情？","start":2107.52,"end":2109.14},{"id":188,"text":"I'm going to take my data,","zh":"我要把我的数据,","start":2109.34,"end":2110.78},{"id":189,"text":"my x's and my y's,","zh":"我的x值和我的y值,","start":2110.82,"end":2111.9},{"id":190,"text":"why don't I just run them through the least squares thing that you did before,","zh":"为什么我不直接把这些数据输入你之前用的最小二乘法中呢,","start":2111.98,"end":2114.74},{"id":191,"text":"that seems like it should give me some answer.","zh":"这看起来应该能给我一个答案。","start":2114.98,"end":2116.86},{"id":192,"text":"I can fit the x's and the y's and I sit there.","zh":"我可以拟合x值和y值，然后我坐下来。","start":2117.12,"end":2118.9},{"id":193,"text":"What does that look like?","zh":"这会是什么样子呢？","start":2119.1,"end":2120.36},{"id":194,"text":"Let's draw a picture and see what the traditional pitfall is.","zh":"让我们画个图，看看传统的陷阱是什么。","start":2120.36,"end":2123.42},{"id":195,"text":"So we have data and our data is somehow arranged here.","zh":"所以我们有数据，我们的数据以某种方式排列在这里。","start":2123.58,"end":2126.78},{"id":196,"text":"I'm going to try and get some blue ones.","zh":"我要试着得到一些蓝色的。","start":2126.96,"end":2128.7},{"id":197,"text":"That's way too big.","zh":"那太大了。","start":2129.3,"end":2130.4},{"id":198,"text":"See if I can make it smaller.","zh":"看看我能不能把它变得更小一些。","start":2130.52,"end":2131.28},{"id":199,"text":"Too small.","zh":"太小了。","start":2135.9,"end":2136.78},{"id":200,"text":"Perfect.","zh":"完美。","start":2136.98,"end":2137.32},{"id":201,"text":"All right, so we have some blue ones.","zh":"好的，所以我们有一些蓝色的。","start":2137.74,"end":2138.76},{"id":202,"text":"These are going to be our negatives.","zh":"这些将作为我们的负样本。","start":2138.98,"end":2141.1},{"id":203,"text":"These are our zeros.","zh":"这些是我们的零样本。","start":2141.22,"end":2141.8},{"id":204,"text":"And then we go along.","zh":"然后我们继续下去。","start":2142.16,"end":2144.1},{"id":205,"text":"And then all of a sudden, we get some positives.","zh":"然后突然之间，我们得到了一些正样本。","start":2144.96,"end":2148.36},{"id":206,"text":"I make those reds.","zh":"我把这些红色的样本画出来。","start":2148.58,"end":2149.52},{"id":207,"text":"and they're up here. This is one. This is how it looks.","zh":"它们在这里。这是其中一个。这就是它的样子。","start":2150.44,"end":2153.48},{"id":208,"text":"So far, so good.","zh":"到目前为止，一切顺利。","start":2154.22,"end":2155.22},{"id":209,"text":"So if you look at this intuitively,","zh":"如果你从直觉上来看，","start":2155.36,"end":2156.66},{"id":210,"text":"what's the decision surface that you want?","zh":"你想要什么样的决策边界？","start":2156.84,"end":2158.4},{"id":211,"text":"You somehow want to get a line that fits in here,","zh":"你 somehow 想要得到一条能够拟合在这里的线，","start":2158.46,"end":2161.1},{"id":212,"text":"that cleanly separates them over time and figures out where they are.","zh":"这能够随着时间清晰地将它们分开，并确定它们的位置。","start":2161.78,"end":2165.08},{"id":213,"text":"The problem you have if you start to fit something that looks like least squares is,","zh":"如果你开始拟合看起来像最小二乘的问题，你就会遇到以下问题，","start":2165.36,"end":2168.5},{"id":214,"text":"In classification, if we just care about separating the zeros from the ones, we just care about that split, we don't care if there's some blue that's way, way, way over here, over here, over here, over there. But if we're doing least squares, all of a sudden, we start getting hyperplanes, I'll use green, that instead of being nice, well-behaved hyperplanes, they start stretching out more and more and more.","zh":"在分类中，如果我们只关心将0和1分开，我们只关心这个分割，而不关心是否有某些蓝色点远远地出现在这里、这里、这里、那里。但如果我们在做最小二乘，突然之间，我们会得到超平面，我用绿色表示，这些超平面不再像之前那样良好行为，而是越来越伸展。","start":2169.77,"end":2194.53},{"id":215,"text":"Okay, so this is just intuitive. You can run this exactly as I've described it, but hopefully it makes sense. What happens is as you start to get y's that are that are the x's that are that are going farther and farther away, instead of just finding the exact spot that splits them, I'm somehow trying to do something else. And the something else is I'm trying to kind of find their center of mass, right? And that seems inappropriate when I'm just trying to find what we'll call like a classification decision surface. Okay, all right. Questions about that clear enough? All right.","zh":"好的，所以这只是直观的理解。你可以按照我刚才描述的方式运行它，但希望这能让你明白。发生的情况是，当你开始得到越来越远离的y值和x值时，我们不再只是寻找分割它们的确切位置，而是在尝试做其他事情。而这个其他事情就是，我似乎在尝试找到它们的质心，对吧？而当我在尝试寻找所谓的分类决策面时，这样做似乎不合适。好的，好的。关于这一点的问题都清楚了吗？好的。","start":2194.91,"end":2222.37},{"id":216,"text":"Now, all that said, if you have actual data and you try this out,","zh":"尽管如此，如果你有实际数据并尝试这样做，","start":2223.65,"end":2228.49},{"id":217,"text":"These squares will work more often than you think. So all that being said about it not being a great formal model and these issues about what happens when you get these tail data points and all the rest, they're all true. They do happen. I'm not telling you nonsense. But intuitively, when you get high dimensional data, high dimensional data is pretty weird. And what I mean by pretty weird is it has these strange properties like your closest point and your farthest point are often the same distance. Very strange things happen in high dimensions, which are different than you may picture. And so when you have real data,","zh":"这些平方项在很多时候会起作用。因此，尽管之前提到的它不是一个很好的形式化模型，以及当遇到这些尾部数据点时会发生的问题，这些都是真实的。它们确实会发生。我不是在说些无稽之谈。但直观上，当你处理高维数据时，高维数据非常奇怪。我所说的非常奇怪是指它具有这些奇怪的性质，比如最近的点和最远的点往往距离相同。在高维空间中会发生非常奇怪的事情，这与你可能想象的不同。因此，当你有真实数据时，","start":2229.38,"end":2257.88}],"notes":["本段讲授了二分类问题中使用最小二乘法的局限性。yi被建模为0和1的二元变量，类似于猫或非猫的分类问题。讲者指出，直接使用最小二乘法会导致决策边界无法正确分离类别，因为最小二乘法会试图拟合所有数据点，包括远离决策边界的异常点，从而产生不合适的超平面。","讲者通过一个直观的图示说明了传统最小二乘法的陷阱。他描述了数据点的分布情况，其中蓝色点代表负类，红色点代表正类。当使用最小二乘法拟合时，超平面会试图拟合所有数据点，包括远离决策边界的点，从而导致决策边界变得不准确。","讲者进一步解释了最小二乘法在分类问题中的问题。他指出，最小二乘法会试图找到所有数据点的中心质量，而不是仅仅关注分类边界。这种做法在分类任务中是不合适的，因为分类任务只需要正确分离类别，而不需要考虑远离边界的点。","讲者提到，尽管最小二乘法在实际数据中可能表现良好，但它并不是一个理想的分类模型。他指出，高维数据具有许多奇特的性质，例如最近点和最远点之间的距离可能相同，这些性质在低维空间中并不常见。","讲者强调，高维数据的这些特性使得传统的最小二乘法在分类任务中表现不佳。他指出，当数据维度较高时，最小二乘法可能会产生不合适的决策边界，从而影响分类效果。","最后，讲者总结了最小二乘法在分类问题中的局限性，并指出尽管它在实际应用中可能有效，但其理论基础并不适用于分类任务。他建议在处理分类问题时，应考虑使用更合适的模型，如逻辑回归或支持向量机。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2090.74,"end":2257.88,"asr_flags":[],"translation_complete":true,"translated_segments":38,"raw_segments":[{"start":2090.74,"text":"We also now have yi's and those yi's are going to be modeled as just 0, 1."},{"start":2095.8,"text":"You can imagine as like cat or not cat,"},{"start":2099.3,"text":"I don't know, whatever you want,"},{"start":2100.36,"text":"whatever makes you happy."},{"start":2101.66,"text":"It's just a binary thing that says,"},{"start":2102.9,"text":"is it yes or no? That's what our yi's are."},{"start":2105.48,"text":"Now the first question you should probably ask is,"},{"start":2107.52,"text":"why do I need to do anything different?"},{"start":2109.34,"text":"I'm going to take my data,"},{"start":2110.82,"text":"my x's and my y's,"},{"start":2111.98,"text":"why don't I just run them through the least squares thing that you did before,"},{"start":2114.98,"text":"that seems like it should give me some answer."},{"start":2117.12,"text":"I can fit the x's and the y's and I sit there."},{"start":2119.1,"text":"What does that look like?"},{"start":2120.36,"text":"Let's draw a picture and see what the traditional pitfall is."},{"start":2123.58,"text":"So we have data and our data is somehow arranged here."},{"start":2126.96,"text":"I'm going to try and get some blue ones."},{"start":2129.3,"text":"That's way too big."},{"start":2130.52,"text":"See if I can make it smaller."},{"start":2135.9,"text":"Too small."},{"start":2136.98,"text":"Perfect."},{"start":2137.74,"text":"All right, so we have some blue ones."},{"start":2138.98,"text":"These are going to be our negatives."},{"start":2141.22,"text":"These are our zeros."},{"start":2142.16,"text":"And then we go along."},{"start":2144.96,"text":"And then all of a sudden, we get some positives."},{"start":2148.58,"text":"I make those reds."},{"start":2150.44,"text":"and they're up here. This is one. This is how it looks."},{"start":2154.22,"text":"So far, so good."},{"start":2155.36,"text":"So if you look at this intuitively,"},{"start":2156.84,"text":"what's the decision surface that you want?"},{"start":2158.46,"text":"You somehow want to get a line that fits in here,"},{"start":2161.78,"text":"that cleanly separates them over time and figures out where they are."},{"start":2165.36,"text":"The problem you have if you start to fit something that looks like least squares is,"},{"start":2169.77,"text":"In classification, if we just care about separating the zeros from the ones, we just care about that split, we don't care if there's some blue that's way, way, way over here, over here, over here, over there. But if we're doing least squares, all of a sudden, we start getting hyperplanes, I'll use green, that instead of being nice, well-behaved hyperplanes, they start stretching out more and more and more."},{"start":2194.91,"text":"Okay, so this is just intuitive. You can run this exactly as I've described it, but hopefully it makes sense. What happens is as you start to get y's that are that are the x's that are that are going farther and farther away, instead of just finding the exact spot that splits them, I'm somehow trying to do something else. And the something else is I'm trying to kind of find their center of mass, right? And that seems inappropriate when I'm just trying to find what we'll call like a classification decision surface. Okay, all right. Questions about that clear enough? All right."},{"start":2223.65,"text":"Now, all that said, if you have actual data and you try this out,"},{"start":2229.38,"text":"These squares will work more often than you think. So all that being said about it not being a great formal model and these issues about what happens when you get these tail data points and all the rest, they're all true. They do happen. I'm not telling you nonsense. But intuitively, when you get high dimensional data, high dimensional data is pretty weird. And what I mean by pretty weird is it has these strange properties like your closest point and your farthest point are often the same distance. Very strange things happen in high dimensions, which are different than you may picture. And so when you have real data,"}],"speech_gaps":[{"start":2133.264,"end":2134.832}],"frame":"../frames/v042/013.webp","frame_time":2102.74},{"title":"加权最小二乘与分类函数","segments":[{"id":218,"text":"Sometimes you just run a model that's pretty bad back to it, but it does a good enough job. And that can definitely happen. So modeling is not a formally correct or incorrect thing. It's always a matter of degree. But for classification, it's kind of a nice type thing.","zh":"有时候你只是运行一个相当差的模型，但它的表现已经足够好。这种情况确实可能发生。因此，建模并不是一个正式正确或错误的事情。它始终是一个程度的问题。但对于分类来说，它是一种相当不错的类型。","start":2258.42,"end":2272.67},{"id":219,"text":"So you should use a classification function so that your predictions, someone doesn't ask you yes or no and you predict seven. That seems crazy. So you'd have to have some code over there that says, if my function says seven, I round it to one. If it says negative 40, I say zero. You'd have to have code on the outside to do that, which also makes it a little bit more of a hassle. So let's look at the most common classification function. And this is the one that is the workhorse of the stuff that we do today. We're going to have these things that we'll call link function. So our hypothesis is still going to be linear.","zh":"因此，你应该使用一个分类函数，这样你的预测结果不会出现别人问你是或否，而你却预测出七的情况。这看起来很疯狂。因此，你必须有一些代码在那里，如果我的函数预测为七，我就把它四舍五入为一；如果它预测为负四十，我就说零。你必须在外部有这些代码来实现这一点，这也使事情变得稍微麻烦一些。因此，让我们看一下最常见的分类函数。这个函数是我们今天所做工作的主力。我们将这些函数称为链接函数。因此，我们的假设仍然是线性的。","start":2273.09,"end":2301.75},{"id":220,"text":"So there's still this linear element to it, but we're going to add in.","zh":"因此，它仍然具有线性元素，但我们将添加一个非线性元素 G。","start":2302.4,"end":2306.02},{"id":221,"text":"So there's still this linear element to it, but we're going to add in. a nonlinear element G. And G is going to be called a link function. So it's going to have some shape. So what would you want G to have? Well, you'd probably want it to be monotone. It'd be super weird if it wasn't monotone increasing. You give it a higher score and just randomly gives you a value. So G shouldn't be stochastic. It shouldn't go from 1.1 to 1.2 and then go from returning 1 to false. It shouldn't just go. So it'd probably be smooth and monotone were things that we would want.","zh":"因此，它仍然具有线性元素，但我们将添加一个非线性元素 G。G 将被称为链接函数。它将具有某种形状。那么你希望 G 具有什么样的特性呢？你可能希望它是单调的。如果它不是单调递增的，那就非常奇怪。你给它一个更高的得分，它却随机地给出一个值。因此，G 不应该是随机的。它不应该从 1.1 变到 1.2，然后从返回 1 变为 false。它不应该只是随意变化。因此，平滑且单调可能是我们希望的特性。","start":2307.49,"end":2332.89},{"id":222,"text":"So let's look at it. So there are many that you can pick. And there are actually entire stats books that you can read. I even own some of them that tell you various different functions. But here's one that's very, very popular. And this very popular function has this nice, beautiful sigmoidal shape where it starts down at 0 and it goes up. Now, you may look at this and say, why don't I just use a threshold?","zh":"让我们来看一下。有很多函数可以选择，实际上甚至有整本书籍专门讨论这些函数。我甚至拥有其中一些书籍，它们告诉你各种不同的函数。但这里有一个非常、非常流行的函数。这个非常流行的函数具有一个非常漂亮、优美的 sigmoid 形状，它从 0 开始，然后向上增长。你现在可能会看着它并说，为什么我不直接使用一个阈值呢？","start":2333.79,"end":2354.07},{"id":223,"text":"Why don't I just say, go to here, go to here, and that's my function, the step function. The reason we don't use that function is, well, it's non-differentiable, and so it's not convenient mathematically. Now, differentiable isn't a hard boundary for us. Actually, in a lot of neural nets, not so much as anymore, but a lot of neural nets say five years ago, they used other functions like rel use and things that look like that, which are not differentiable, hinge losses. There are other losses that you could use.","zh":"为什么我不直接说，去这里，去那里，这就是我的函数，也就是阶跃函数。我们不使用这个函数的原因是，它不可导，因此在数学上不太方便。不过，可导对我们来说并不是一个硬性限制。实际上，在很多神经网络中，现在已经不那么常见了，但五年前很多神经网络会使用其他函数，比如ReLU和类似这样的函数，它们都是不可导的，比如铰链损失。还有其他损失函数可以使用。","start":2354.84,"end":2380.1},{"id":224,"text":"But here we're just going to focus on this nice one because it has this beautiful scaling between 0 and 1, and it's going to show up and give us the most popular model, which is logistic regression.","zh":"但在这里，我们只关注这个漂亮的函数，因为它在0和1之间有很好的缩放特性，它将为我们带来最流行的模型，即逻辑回归。","start":2380.72,"end":2390.86},{"id":225,"text":"All right, so how do we interpret this thing? So basically, we interpret it as being in the class is its height. So h of theta is going to be this kind of probabilistic thing. And 1 minus h of theta is going to be the probability it's not in the class. Now, this is already interesting. Before, we were just predicting a scalar. Now, I'm telling you that when we predict something, we're going to think about it being the probability that's in the class. So if it's very, very close to 1, intuitively, we think it's very likely to be in the class. We will not return exactly 1. We may return 0.999.","zh":"那么，我们如何解释这个函数呢？基本上，我们将它解释为属于该类别的概率，即h(theta)是一个概率性的量。而1减去h(theta)则是不属于该类别的概率。这已经很有趣了。之前我们只是预测一个标量。现在，我告诉你，当我们进行预测时，我们会将其视为属于该类别的概率。如果它非常接近1，直观上我们认为它很可能属于该类别。我们不会恰好返回1，可能会返回0.999。","start":2396.07,"end":2424.77}],"notes":["本段讨论了分类任务中使用分类函数的必要性，指出直接预测类别标签（如数字）是不合理的，需要通过外部代码进行处理。同时，介绍了链接函数（link function）的概念，强调其在分类模型中的作用。","链接函数需要满足单调性和平滑性，以确保模型的可解释性和数学上的便利性。例如，单调性可以保证输出随着输入的增加而单调变化，而平滑性则有助于优化过程。","本段提到的S型函数（sigmoidal function）因其在0到1之间的平滑特性而被广泛使用，特别是在逻辑回归（logistic regression）中。这种函数的非可导性是其缺点，但可以通过近似方法（如使用Relu函数）来克服。","在分类任务中，模型输出通常被解释为属于某一类的概率。例如，当输出接近1时，表示该样本属于该类的概率很高，而接近0时则表示概率很低。","本段还提到，虽然可以使用阈值函数（如阶跃函数）进行分类，但由于其不可导性，通常不被采用。相反，使用可导的函数（如S型函数）可以更好地进行优化。","逻辑回归模型利用S型函数将线性组合映射到概率空间，从而实现分类任务。这种模型在实际应用中非常流行，因为它能够提供概率解释，并且可以通过最大似然估计进行训练。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2258.42,"end":2424.77,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2258.42,"text":"Sometimes you just run a model that's pretty bad back to it, but it does a good enough job. And that can definitely happen. So modeling is not a formally correct or incorrect thing. It's always a matter of degree. But for classification, it's kind of a nice type thing."},{"start":2273.09,"text":"So you should use a classification function so that your predictions, someone doesn't ask you yes or no and you predict seven. That seems crazy. So you'd have to have some code over there that says, if my function says seven, I round it to one. If it says negative 40, I say zero. You'd have to have code on the outside to do that, which also makes it a little bit more of a hassle. So let's look at the most common classification function. And this is the one that is the workhorse of the stuff that we do today. We're going to have these things that we'll call link function. So our hypothesis is still going to be linear."},{"start":2302.4,"text":"So there's still this linear element to it, but we're going to add in."},{"start":2307.49,"text":"a nonlinear element G. And G is going to be called a link function. So it's going to have some shape. So what would you want G to have? Well, you'd probably want it to be monotone. It'd be super weird if it wasn't monotone increasing. You give it a higher score and just randomly gives you a value. So G shouldn't be stochastic. It shouldn't go from 1.1 to 1.2 and then go from returning 1 to false. It shouldn't just go. So it'd probably be smooth and monotone were things that we would want."},{"start":2333.79,"text":"So let's look at it. So there are many that you can pick. And there are actually entire stats books that you can read. I even own some of them that tell you various different functions. But here's one that's very, very popular. And this very popular function has this nice, beautiful sigmoidal shape where it starts down at 0 and it goes up. Now, you may look at this and say, why don't I just use a threshold?"},{"start":2354.84,"text":"Why don't I just say, go to here, go to here, and that's my function, the step function. The reason we don't use that function is, well, it's non-differentiable, and so it's not convenient mathematically. Now, differentiable isn't a hard boundary for us. Actually, in a lot of neural nets, not so much as anymore, but a lot of neural nets say five years ago, they used other functions like rel use and things that look like that, which are not differentiable, hinge losses. There are other losses that you could use."},{"start":2380.72,"text":"But here we're just going to focus on this nice one because it has this beautiful scaling between 0 and 1, and it's going to show up and give us the most popular model, which is logistic regression."},{"start":2396.07,"text":"All right, so how do we interpret this thing? So basically, we interpret it as being in the class is its height. So h of theta is going to be this kind of probabilistic thing. And 1 minus h of theta is going to be the probability it's not in the class. Now, this is already interesting. Before, we were just predicting a scalar. Now, I'm telling you that when we predict something, we're going to think about it being the probability that's in the class. So if it's very, very close to 1, intuitively, we think it's very likely to be in the class. We will not return exactly 1. We may return 0.999."}],"speech_gaps":[],"frame":"../frames/v042/014.webp","frame_time":2270.42},{"title":"加权最小二乘与概率解释","segments":[{"id":226,"text":"But we're going to return and say that that's very close to 1. And then there's 1 minus because it's binary, but it's in the other class. And the reason I highlight this notation is later when we do multi-class, this will again come up. We'll bake the classes off of each other. Any questions about how this works and what the type is?","zh":"但我们将返回并说这非常接近1。然后是1减去，因为它属于二元类别，但属于另一个类别。我强调这种记号的原因是，当我们处理多类别时，这会再次出现。我们将根据彼此来构建类别。有关这一过程如何运作以及类型是什么有任何问题吗？","start":2426.34,"end":2443.18},{"id":227,"text":"Okay, so all that I expect that you have thought so far is, okay, I have a new h theta. I have this new class of functions. They look relatively simple. They look like the linear functions that I used to have from a couple minutes ago, except for now I've run them through this g function that's going to smooth out their value. So if theta dot x is going to be some huge value like 100, well, that's going to be way, way over here, and it's going to be very, very close to 1. That's the idea. You'll sometimes hear people call these logits, but that's a separate issue.","zh":"好的，我期望你们到目前为止已经思考过的是，我有一个新的h theta。我有一个新的函数类别。它们看起来相对简单。它们看起来像我几分钟前使用的线性函数，除了现在我将它们通过这个g函数，这个函数会平滑它们的值。所以如果theta点x会是一个很大的值，比如100，那么它会远远地在这里，非常接近1。这就是想法。你们有时会听到人们称这些为logits，但这是一个不同的问题。","start":2445.72,"end":2475.25},{"id":228,"text":"Okay, if you know what a logit is. Okay, cool. All right, so that probabilistic interpretation is going to give us directly a model. Okay, so back to what we were describing before, we are going to go back and use our old friend, maximum likelihood.","zh":"好的，如果你知道什么是logit。好的，酷。那么，这种概率解释将直接给我们一个模型。好的，回到我们之前描述的内容，我们将返回并使用我们的好朋友，最大似然估计。","start":2475.69,"end":2491.74},{"id":229,"text":"And we're going to try an old friend from 15 minutes ago. So maybe it's whatever. I'm not going to make a terrible joke there. Anyway, so back to this. You're going to go to the product. Why are we going to a product? We're again assuming some independence. So we're going to have this nice product that's going on and what's happening. And then we're going to substitute our format. Now, this is just notation. This is just if-then written in a clever, statsy, machine learning way. It says either","zh":"我们将尝试15分钟前的老朋友。所以也许无所谓。我不会在那里讲一个糟糕的笑话。无论如何，回到这个话题。你们将去计算乘积。为什么我们要去计算乘积？我们再次假设某种独立性。因此，我们将有一个很好的乘积过程，会发生什么。然后我们将替换我们的格式。这只是记号。这只是以一种巧妙的、统计学和机器学习的方式写出的如果-那么条件。它表示：","start":2492.49,"end":2519.23},{"id":230,"text":"yi is 0, and if it's 0, then which term is active? This term. Or yi is 1, and this term. So this is yi equal 1, this is y equals 0. It's just putting the two terms there, and when they're off, they return 1. So just convince yourself that this function does what you think it does. If you plug in y is equal to 1, you get the term that you want, and it doesn't go to 0. If you plug in the other one, you get the other one. Hypothesis 1 minus hypothesis.","zh":"y_i是0，如果它是0，那么哪个项是活跃的？这个项。或者y_i是1，这个项。因此，这是y_i等于1，这是y等于0。它只是将这两个项放在一起，当它们不活跃时，它们返回1。因此，请说服自己这个函数确实像你认为的那样运作。如果你代入y等于1，你会得到你想要的项，它不会趋近于0。如果你代入另一个项，你会得到另一个项。假设1减去假设。","start":2520.66,"end":2548.46},{"id":231,"text":"Okay, so far so good. All right, now back to the other thing. We take logs. So you've already seen this movie. You kind of know how it goes. And we get this fun form here. I'm not going to beat it to death. This is yi, 1 minus yi. They have different things inside the logs.","zh":"好的，到目前为止一切顺利。好了，现在回到另一个问题。我们取对数。你们已经看过这部电影了，大概知道剧情会怎么发展。我们得到了这个有趣的表达式。我不会过多地重复讲解。这里的是yi，1减yi。它们在对数内部有不同的内容。","start":2550.44,"end":2568.94},{"id":232,"text":"All we're doing is trying to walk back exactly the same framework that we did before, and this is going to get us to another one of those functions, which is a gigantic sum instead of a product, nice numerically stable, all that other good stuff that happens from it, over our data points. How are we going to solve this thing? Any guesses? Differentiate, compute some gradients, let it run for a while. Now, this one we can tell when it's finished, which is not going to be true later in the course, but this one we can actually solve.","zh":"我们所做的只是试图回到之前使用的相同框架，这将引导我们得到另一个类似的函数，它是一个巨大的求和式而不是乘积式，数值上更稳定，还有其他所有好处。我们如何解决这个问题？有什么猜测吗？求导，计算一些梯度，让它运行一段时间。对于这个问题，我们可以判断何时完成，这在课程后面将不成立，但这个问题我们实际上是可以解决的。","start":2569.7,"end":2600.37}],"notes":["本段讲解了二分类问题中概率解释的构建，通过将线性函数经过g函数平滑处理，使得输出值接近0或1。这种处理方式为后续多分类问题提供了基础，通过将不同类别之间的关系建模为相互依赖的结构。","讲者提到logit的概念，这是将线性输出映射到概率值的函数，但这一概念在本段中并未深入展开，仅作为术语提及。随后，讲者转向最大似然估计，这是构建概率模型的核心方法。","在构建似然函数时，讲者使用了乘积形式，这是基于独立性假设的。通过将乘积转换为对数形式，可以将问题转化为求和形式，从而提高数值稳定性。","讲者指出，通过求导并计算梯度，可以求解优化问题。虽然这种方法在后续课程中可能不再适用，但在当前问题中，可以明确判断何时达到最优解。","本段强调了从线性模型到概率模型的转变，以及如何通过数学工具（如对数、梯度）来处理实际问题。这些方法为后续更复杂的模型（如神经网络）奠定了基础。","讲者通过举例说明了如何将二分类问题中的概率解释应用于实际计算，包括如何处理不同类别之间的关系，以及如何通过数学变换简化计算过程。"],"formulas":[{"latex":"p(y_i | x_i) = h_{\\theta}(x_i)^{y_i} (1 - h_{\\theta}(x_i))^{1 - y_i}","symbols":"p(y_i | x_i) 是给定输入 x_i 时输出 y_i 的概率，h_{\\theta}(x_i) 是模型的预测概率","explanation":"公式正确，表示二元分类问题中给定输入 x_i 时输出 y_i 的概率，使用了伯努利分布的形式。","evidence":"Okay, if you know what a logit is. Okay, cool. All right, so that probabilistic interpretation is going to give us directly a model. Okay, so back to what we were describing before, we are going to go back and use our old friend, maximum likelihood."},{"latex":"L(\\theta) = \\frac{1}{n} \\sum_{i=1}^{n} \\log \\left( p(y_i | x_i) \\right)","symbols":"L(θ) 是对数似然函数，通过将乘积转换为对数形式，得到求和形式","explanation":"公式正确，表示对数似然函数，将概率乘积转换为对数求和形式，适用于最大似然估计。","evidence":"And we're going to try an old friend from 15 minutes ago. So maybe it's whatever. I'm not going to make a terrible joke there. Anyway, so back to this. You're going to go to the product. Why are we going to a product? We're again assuming some independence. So we're going to have this nice product that's going on and what's happening. And then we're going to substitute our format. Now, this is just notation. This is just if-then written in a clever, statsy, machine learning way. It says either"},{"latex":"J(\\theta) = - \\frac{1}{n} \\sum_{i=1}^{n} \\log \\left( p(y_i | x_i) \\right)","symbols":"J(θ) 是损失函数，通过求导并计算梯度来优化模型参数","explanation":"公式正确，表示损失函数，即负对数似然函数，用于优化模型参数。","evidence":"All we're doing is trying to walk back exactly the same framework that we did before, and this is going to get us to another one of those functions, which is a gigantic sum instead of a product, nice numerically stable, all that other good stuff that happens from it, over our data points. How are we going to solve this thing? Any guesses? Differentiate, compute some gradients, let it run for a while. Now, this one we can tell when it's finished, which is not going to be true later in the course, but this one we can actually solve."}],"uncertainties":[],"diagram":"none","start":2426.34,"end":2600.37,"asr_flags":[],"math_clarifications":["公式 1 是二元分类问题中给定输入 x_i 时输出 y_i 的概率，使用了伯努利分布的形式，正确表达了概率分布。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2426.34,"text":"But we're going to return and say that that's very close to 1. And then there's 1 minus because it's binary, but it's in the other class. And the reason I highlight this notation is later when we do multi-class, this will again come up. We'll bake the classes off of each other. Any questions about how this works and what the type is?"},{"start":2445.72,"text":"Okay, so all that I expect that you have thought so far is, okay, I have a new h theta. I have this new class of functions. They look relatively simple. They look like the linear functions that I used to have from a couple minutes ago, except for now I've run them through this g function that's going to smooth out their value. So if theta dot x is going to be some huge value like 100, well, that's going to be way, way over here, and it's going to be very, very close to 1. That's the idea. You'll sometimes hear people call these logits, but that's a separate issue."},{"start":2475.69,"text":"Okay, if you know what a logit is. Okay, cool. All right, so that probabilistic interpretation is going to give us directly a model. Okay, so back to what we were describing before, we are going to go back and use our old friend, maximum likelihood."},{"start":2492.49,"text":"And we're going to try an old friend from 15 minutes ago. So maybe it's whatever. I'm not going to make a terrible joke there. Anyway, so back to this. You're going to go to the product. Why are we going to a product? We're again assuming some independence. So we're going to have this nice product that's going on and what's happening. And then we're going to substitute our format. Now, this is just notation. This is just if-then written in a clever, statsy, machine learning way. It says either"},{"start":2520.66,"text":"yi is 0, and if it's 0, then which term is active? This term. Or yi is 1, and this term. So this is yi equal 1, this is y equals 0. It's just putting the two terms there, and when they're off, they return 1. So just convince yourself that this function does what you think it does. If you plug in y is equal to 1, you get the term that you want, and it doesn't go to 0. If you plug in the other one, you get the other one. Hypothesis 1 minus hypothesis."},{"start":2550.44,"text":"Okay, so far so good. All right, now back to the other thing. We take logs. So you've already seen this movie. You kind of know how it goes. And we get this fun form here. I'm not going to beat it to death. This is yi, 1 minus yi. They have different things inside the logs."},{"start":2569.7,"text":"All we're doing is trying to walk back exactly the same framework that we did before, and this is going to get us to another one of those functions, which is a gigantic sum instead of a product, nice numerically stable, all that other good stuff that happens from it, over our data points. How are we going to solve this thing? Any guesses? Differentiate, compute some gradients, let it run for a while. Now, this one we can tell when it's finished, which is not going to be true later in the course, but this one we can actually solve."}],"speech_gaps":[],"frame":"../frames/v042/015.webp","frame_time":2438.34},{"title":"加权最小二乘法的讲解","segments":[{"id":233,"text":"All right. So how do we solve it? We maximize. We already saw how to do this. You just compute the derivative, run SGD, and you're done with it. So that one, I just want to point out, was super quick to explain once we had gone through the basics of the story. We have a model. We know how to take the model and turn it from logs into a nice additive cost function. Once it's an additive cost function, we know how to run SGD on it, and boom, we can go and solve it. We can use gradient descent, stochastic gradient descent, whatever we want. This recipe,","zh":"好的。那么我们如何解决这个问题呢？我们最大化。我们已经看到如何做到这一点。你只需要计算导数，运行随机梯度下降（SGD），然后就完成了。所以这一点，我想指出的是，一旦我们经历了故事的基本内容，解释起来非常迅速。我们有一个模型。我们知道如何将模型从对数空间转换为一个良好的加法成本函数。一旦它成为加法成本函数，我们就知道如何在它上面运行SGD，然后就可以解决问题了。我们可以使用梯度下降、随机梯度下降，或者我们想要的任何方法。这个配方，","start":2601.55,"end":2629.06},{"id":234,"text":"It's part of the reason maximum likelihood is so nice. We try to figure out how likely our data set is in the probability space. Then we go to the log space. That's a nice monotone mapping, which is great for us. It preserves that. And then, boom, we're off to being able to solve this in a big additive sum. It's additive, so now we know how to use SGD because mini-batching and all the things we talked about last. So just snaps together, you were going to say.","zh":"这也是最大似然之所以如此优美的原因之一。我们试图确定我们的数据集在概率空间中的可能性。然后我们进入对数空间。这是一个很好的单调映射，对我们来说非常有用。它保留了这一点。然后，我们就可以在大的加法总和中解决这个问题。它是加法的，因此我们现在知道如何使用SGD，因为我们在上一节课中讨论的所有关于小批量处理的内容。所以这些内容可以迅速组合起来，你本来就要说的。","start":2629.66,"end":2650.26},{"id":235,"text":"Just being a little pedantic, so just curious. Would this be gradient descent because we're maximizing? Oh, yeah. Great question. Yeah, yeah. So the question was, would this be gradient descent because you're maximizing 100%? You would change the sign from minus to plus here. We will actually put it in a form where it's gradient descent when we write it. And so I apologize if I said something that was confusing. But wonderful, wonderful call out. I appreciate it. Other questions?","zh":"只是稍微有点挑剔，所以只是好奇。这会是梯度下降吗，因为我们是在最大化？哦，是的。非常好的问题。是的，是的。问题是，这会是梯度下降吗，因为你是在最大化100%？你会在这里改变符号，从减号变为加号。当我们写出这个表达式时，我们会将其形式转换为梯度下降。因此，如果我说了什么令人困惑的话，我道歉。但太棒了，太棒了，你指出了这一点。我感谢你的提问。还有其他问题吗？","start":2653.05,"end":2677.64},{"id":236,"text":"You guys are great. But the thing that I want to show you from this is just so you see, this is an extremely powerful model. You actually have used this model in your life, whether you want to or not. It underpins almost everything. And it's super simple once you understand those principles of how you put it together. You model it with maximum likelihood. You take it into a nice, convenient form for computation. You solve it with gradient descent. This is the recipe for maximum likelihood that's been so, so powerful over the years.","zh":"你们都很棒。但我想从这里展示给你们看的是，只是为了让你看到，这是一个极其强大的模型。你实际上在生活中已经使用过这个模型，无论你是否想要使用它。它几乎支撑了所有东西。一旦你理解了如何将它组合起来的基本原理，它就变得非常简单。你用最大似然来建模。你将其转换为一个便于计算的方便形式。你用梯度下降来解决它。这就是多年来如此强大的最大似然配方。","start":2681.02,"end":2707.5},{"id":237,"text":"Okay, now I don't know if I have, I mean, I'm going to go through this very quickly. You don't need to know this, but there's something that I do want to show you. And there's a little bit of math on this thing. So if you have the slide, you can go through it. But let me highlight for you among here what's interesting. The interesting thing is, and this was the great thing before. So I sneakily switched the sign from minus to positive exactly to deal with a scent issue. This is the mini batching that we were talking about before. But the remarkable thing is this.","zh":"好的，现在我不确定我有没有，我是说，我会很快地讲一遍。你们不需要知道这些，但我想给你们展示一些东西。这里有一些数学内容。如果你有幻灯片，可以跟着看。但让我给你们指出其中有趣的地方。有趣的是，这正是之前非常重要的地方。所以我偷偷地把符号从减号换成了加号，正好是为了处理一个气味问题。这就是我们之前讨论过的迷你批量处理。但值得注意的是这一点。","start":2709.94,"end":2737.62},{"id":238,"text":"So when we wrote the original form down here, this is a strange looking object. But what's weird is you can still get to something that has this nice familiar form where you measure the error and multiply by xj. That's pretty nice. And it turns out this is a general rule. We're going to see it more later in the course. So I want to highlight it now, later in the course, like Wednesday, not like six months from now. This form, this error and correct form,","zh":"当我们写下原始形式时，这里是一个看起来很奇怪的对象。但奇怪的是，你仍然可以得到一个具有这种熟悉形式的东西，其中你测量误差并乘以xj。这相当不错。事实上，这是一条普遍的规则。我们会在课程后面更详细地看到这一点。我想现在就强调这一点，后面会在课程中，比如周三，而不是六个月之后。这种形式，这种误差和修正形式，","start":2738.25,"end":2766.06}],"notes":["本段主要讨论了最大似然估计的计算过程，强调了对数似然函数的转换以及如何将其转化为可计算的加法形式。讲者指出，通过将概率空间中的似然函数转换为对数空间，可以利用单调映射的性质，从而简化计算。接着，讲者提到梯度下降法（包括随机梯度下降）可以用于求解这种形式的优化问题，因为其具有可分性，便于进行小批量处理。","讲者进一步指出，最大似然估计之所以强大，是因为它提供了一个通用的框架，可以应用于各种模型。通过将模型转换为对数形式，可以将其转化为一个可计算的加法形式，从而利用梯度下降法进行求解。这种转换使得模型的训练过程更加高效和直观。","讲者提到，虽然最大似然估计的计算过程看似简单，但其背后的原理非常强大。通过将模型转换为对数形式，可以利用梯度下降法进行优化，而这种转换过程是模型训练的核心步骤。讲者还指出，这种转换方法在实际应用中非常常见，几乎所有的机器学习模型都依赖于这一原理。","讲者在讲解过程中提到，梯度下降法可以用于最大化或最小化目标函数，但需要根据具体问题调整符号。例如，在最大化问题中，需要将目标函数的符号从负号改为正号，以确保梯度下降法的正确应用。讲者还提到，这种调整是必要的，以确保优化过程的正确性。","讲者指出，最大似然估计的计算过程可以分为几个步骤：首先，将模型转换为对数形式；其次，将其转换为一个可计算的加法形式；最后，使用梯度下降法进行优化。这种分步的方法使得模型的训练过程更加清晰和易于理解。","讲者还提到，虽然最大似然估计的计算过程看似简单，但其背后的数学原理非常复杂。通过将模型转换为对数形式，可以利用梯度下降法进行优化，而这种转换过程是模型训练的核心步骤。讲者还指出，这种转换方法在实际应用中非常常见，几乎所有的机器学习模型都依赖于这一原理。"],"formulas":[],"uncertainties":["scent issue"],"diagram":"none","start":2601.55,"end":2766.06,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2601.55,"text":"All right. So how do we solve it? We maximize. We already saw how to do this. You just compute the derivative, run SGD, and you're done with it. So that one, I just want to point out, was super quick to explain once we had gone through the basics of the story. We have a model. We know how to take the model and turn it from logs into a nice additive cost function. Once it's an additive cost function, we know how to run SGD on it, and boom, we can go and solve it. We can use gradient descent, stochastic gradient descent, whatever we want. This recipe,"},{"start":2629.66,"text":"It's part of the reason maximum likelihood is so nice. We try to figure out how likely our data set is in the probability space. Then we go to the log space. That's a nice monotone mapping, which is great for us. It preserves that. And then, boom, we're off to being able to solve this in a big additive sum. It's additive, so now we know how to use SGD because mini-batching and all the things we talked about last. So just snaps together, you were going to say."},{"start":2653.05,"text":"Just being a little pedantic, so just curious. Would this be gradient descent because we're maximizing? Oh, yeah. Great question. Yeah, yeah. So the question was, would this be gradient descent because you're maximizing 100%? You would change the sign from minus to plus here. We will actually put it in a form where it's gradient descent when we write it. And so I apologize if I said something that was confusing. But wonderful, wonderful call out. I appreciate it. Other questions?"},{"start":2681.02,"text":"You guys are great. But the thing that I want to show you from this is just so you see, this is an extremely powerful model. You actually have used this model in your life, whether you want to or not. It underpins almost everything. And it's super simple once you understand those principles of how you put it together. You model it with maximum likelihood. You take it into a nice, convenient form for computation. You solve it with gradient descent. This is the recipe for maximum likelihood that's been so, so powerful over the years."},{"start":2709.94,"text":"Okay, now I don't know if I have, I mean, I'm going to go through this very quickly. You don't need to know this, but there's something that I do want to show you. And there's a little bit of math on this thing. So if you have the slide, you can go through it. But let me highlight for you among here what's interesting. The interesting thing is, and this was the great thing before. So I sneakily switched the sign from minus to positive exactly to deal with a scent issue. This is the mini batching that we were talking about before. But the remarkable thing is this."},{"start":2738.25,"text":"So when we wrote the original form down here, this is a strange looking object. But what's weird is you can still get to something that has this nice familiar form where you measure the error and multiply by xj. That's pretty nice. And it turns out this is a general rule. We're going to see it more later in the course. So I want to highlight it now, later in the course, like Wednesday, not like six months from now. This form, this error and correct form,"}],"speech_gaps":[],"frame":"../frames/v042/016.webp","frame_time":2613.55},{"title":"加权最小二乘与优化方法","segments":[{"id":239,"text":"is very common and it's nice that these models have it. So all the nastiness is put into infer on the point, look at the data point difference, and then do an update. It's quite remarkable. Not obvious. Derived here with a bunch of just algebra, just algebra to go from here to here. Don't worry too much about it. You can do it offline. I'm not going to torture with it at the moment.","zh":"这非常常见，而且这些模型拥有这一点是很不错的。因此，所有的麻烦都放在了推理过程中，观察数据点之间的差异，然后进行更新。这相当令人印象深刻。并不明显。这里通过一堆代数推导，从这里到那里。不要太担心。你可以离线完成。我暂时不会折磨你去处理它。","start":2766.73,"en
