y. So the"},{"start":1073.51,"text":"observation is asymmetric. Can you model things that are asymmetric with a Gaussian? Not that"},{"start":1077.73,"text":"piece of it. The second is, can you model, let's say, multimodal, which traditionally means that"},{"start":1081.93,"text":"it has multiple bumps? We will see in a later lecture, I think I'm going to get the lecture"},{"start":1086.01,"text":"numbers wrong because we switched them this year. It's usually around lecture 11, I want to say,"},{"start":1089.53,"text":"or 9. We're going to see a model called the mixture of Gaussians, where indeed you can use"},{"start":1094.61,"text":"many Gaussians as building blocks to kind of build up multiple bumps."},{"start":1097.79,"text":"But today, we're just going to worry about single Gaussians."},{"start":1100.69,"text":"Perfect."},{"start":1101.15,"text":"Great question."},{"start":1102.77,"text":"So yeah, so you're already identifying, just to point out, you're already identifying some things that are strange about this distribution, right? We talked about the errors. The fact that it's symmetric means it's not, for example, aiming too high or too low in the prices, right? There's not a systematic bias in one direction. That would give you something that was asymmetric in the errors, right? We're just going to assume we don't know that information or we're not willing to model it. The other bumps is a statement that there is kind of one kind of noise source, but you could easily imagine that there's multiple noise sources. Remember my example from earlier, we had an A and a B."},{"start":1132.37,"text":"station. Maybe they have very different variances and so their distribution is kind of a mix of two. We'll see those examples later. But for now, just one humble Gaussian. So this is related to the question that came up earlier about y's and all the rest. So recall our model and let's start to see some fancy notation. So hopefully this is something that you're familiar with. If not, don't worry too much about it."},{"start":1159.06,"text":"Here's how it works. So we're going to have this notation where we have this mathematical equation which says our yi's are a function where mechanically we plug in theta. We don't know theta, but this is like a theta that's hidden from us. If we did know theta, we could plug it in. We plug it in, we take this dot product, then we add in the error that's randomly distributed, and that gives us the yi. This notation says exactly what I just said."},{"start":1182.76,"text":"Okay, it's more compact. It says the mean is exactly this. These two terms are the same. I'll let all that red ink drain off. It's a little slow, but all good. And then this sigma squared is this sigma squared."},{"start":1196.53,"text":"Now, why is that? It was alluded to by the question that came up earlier, why is the variance of yi the same as the variance of the original epsilon that's in there? And the reason was exactly stated. Here, if I look at the distribution, if I were to take theta xi and subtract it off of yi, and then take its expected value, that would exactly get me back to sigma squared."}],"speech_gaps":[],"frame":"../frames/v042/007.webp","frame_time":1053.37},{"title":"加权最小二乘的数学基础","segments":[{"id":108,"text":"Said another more formal way, what we're saying is that yi conditioned on seeing the xi's and theta, thetas are a parameter, are distributed as a normal with this mean and this variance.","start":1219.16,"end":1230.44},{"id":109,"text":"This fact that you can just copy is not automatic. Like for example, if we multiplied epsilon by some scalar value, we would have to track that when we went to this model, right? So it just happens to be that these things are all linear here. That's why it works out and it's the same sigma squared, right? If you multiply the number by 10, you would expect the variance to go up, right? Not a strange statement. Okay, cool. Alright, now that gets us down to here.","start":1231.25,"end":1256.05},{"id":110,"text":"Now all we're doing is we're plugging into that horrible formula we saw before, we're plugging in all the terms. The mu is the old formula we saw before, the yi's are the same, the squared is the same, two sigma squared, and the normalization doesn't really change here.","start":1256.9,"end":1268.94},{"id":111,"text":"because the sigmas were really responsible for normalization. The mean didn't appear in the normalization, only the variance. Because the mean is just shifting it around. That's not going to change how much area is under the curve. So you wouldn't expect the mean to change the normalization. But making it wider or narrower, you would expect that to change the normalization. Indeed, it does.","start":1271.71,"end":1288.15},{"id":112,"text":"Okay, hopefully this formula is making intuitive sense. The details of it, if the details aren't quite there where you couldn't generate the formula, play with it. It will eventually become a little bit more natural. But all I care about really is that you kind of understand how it's put together. What are the key components? There's a distance squared. There's a variance that normalizes the units that are there. And then I hope that this notation doesn't terrify you. If you haven't seen this notation before, that's one that I would pay attention to because we will use it quite freely. This kind of condition and parameter notation, I use it kind of without thinking. If I say something,","start":1290.34,"end":1319.86},{"id":113,"text":"that doesn't make sense or you don't know the notation, please feel free to ask. It's not that deep. You can always write it out. It's just mysterious and you get used to these shorthands. So I wanted to highlight it. All right. Now, this basically says what we just went through. We condition on xi. Conditioning here means that we assume that we see it. We have access to xi when we're making the distribution. So the distribution is fixed once we have the xi.","start":1319.88,"end":1345.1},{"id":114,"text":"This makes sense, right? If you think about it, every Xi is a different data point, but the errors for each one are going to be stochastic. So they're setting the mean. They set the average of where we think is going on. And in contrast, this is a bit of terminology that you'll see. Theta parameterizes. You're not actually conditioning on theta. It's not an event in the space. I don't want to be too precise about it. It's not something you condition on. Theta is just a parameter. So there's many different distributions out there. Each one...","start":1345.86,"end":1370.74},{"id":115,"text":"parameterized by theta. And what we're going to do in a second is we're going to basically pick over all the distributions that could have generated this data set, which one is most likely. And that's going to be the principle of maximum likelihood. That's it. It's honestly it. So this just says we're going to search over the thetas. We don't really search over the data yet. We don't search over xi's. Those are given to us. That's input to the problem.","start":1371.6,"end":1394.02}],"notes":["本段讲解了加权最小二乘法的数学基础，强调了在给定输入数据和参数的情况下，输出变量服从正态分布。同时指出，这种分布假设并非自动成立，需要满足线性条件，且方差与输入数据的缩放有关。","在推导公式时，重点解释了均值和方差在归一化过程中的作用。均值不会影响归一化，而方差会改变分布的宽度，从而影响归一化系数。这说明了为什么在加权最小二乘中，方差的处理是关键。","讲者强调了公式中各个组成部分的意义，包括距离平方、方差归一化以及条件和参数的表示法。这些符号和表示法在后续学习中会频繁使用，因此需要特别注意。","讲者指出，条件（conditioning）意味着在给定输入数据的情况下，分布是固定的。而参数（theta）并不是一个事件，而是一个用于参数化的变量，因此不能将其视为条件。","最后，讲者介绍了最大似然估计（maximum likelihood）的基本思想，即在所有可能的分布中，选择最有可能生成给定数据集的分布。这为后续的参数估计奠定了基础。","整个讲解强调了理解公式结构的重要性，以及如何通过反复练习和理解符号来掌握这些概念。同时，讲者鼓励学生在遇到不熟悉的符号时主动提问，以加深理解。"],"formulas":[],"uncertainties":["sigma squared"],"diagram":"none","start":1219.16,"end":1394.02,"asr_flags":[],"math_clarifications":["所有公式均未明确指定方差的具体表达式，且未使用标准符号 σ² 表示方差，不符合数学规范。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1219.16,"text":"Said another more formal way, what we're saying is that yi conditioned on seeing the xi's and theta, thetas are a parameter, are distributed as a normal with this mean and this variance."},{"start":1231.25,"text":"This fact that you can just copy is not automatic. Like for example, if we multiplied epsilon by some scalar value, we would have to track that when we went to this model, right? So it just happens to be that these things are all linear here. That's why it works out and it's the same sigma squared, right? If you multiply the number by 10, you would expect the variance to go up, right? Not a strange statement. Okay, cool. Alright, now that gets us down to here."},{"start":1256.9,"text":"Now all we're doing is we're plugging into that horrible formula we saw before, we're plugging in all the terms. The mu is the old formula we saw before, the yi's are the same, the squared is the same, two sigma squared, and the normalization doesn't really change here."},{"start":1271.71,"text":"because the sigmas were really responsible for normalization. The mean didn't appear in the normalization, only the variance. Because the mean is just shifting it around. That's not going to change how much area is under the curve. So you wouldn't expect the mean to change the normalization. But making it wider or narrower, you would expect that to change the normalization. Indeed, it does."},{"start":1290.34,"text":"Okay, hopefully this formula is making intuitive sense. The details of it, if the details aren't quite there where you couldn't generate the formula, play with it. It will eventually become a little bit more natural. But all I care about really is that you kind of understand how it's put together. What are the key components? There's a distance squared. There's a variance that normalizes the units that are there. And then I hope that this notation doesn't terrify you. If you haven't seen this notation before, that's one that I would pay attention to because we will use it quite freely. This kind of condition and parameter notation, I use it kind of without thinking. If I say something,"},{"start":1319.88,"text":"that doesn't make sense or you don't know the notation, please feel free to ask. It's not that deep. You can always write it out. It's just mysterious and you get used to these shorthands. So I wanted to highlight it. All right. Now, this basically says what we just went through. We condition on xi. Conditioning here means that we assume that we see it. We have access to xi when we're making the distribution. So the distribution is fixed once we have the xi."},{"start":1345.86,"text":"This makes sense, right? If you think about it, every Xi is a different data point, but the errors for each one are going to be stochastic. So they're setting the mean. They set the average of where we think is going on. And in contrast, this is a bit of terminology that you'll see. Theta parameterizes. You're not actually conditioning on theta. It's not an event in the space. I don't want to be too precise about it. It's not something you condition on. Theta is just a parameter. So there's many different distributions out there. Each one..."},{"start":1371.6,"text":"parameterized by theta. And what we're going to do in a second is we're going to basically pick over all the distributions that could have generated this data set, which one is most likely. And that's going to be the principle of maximum likelihood. That's it. It's honestly it. So this just says we're going to search over the thetas. We don't really search over the data yet. We don't search over xi's. Those are given to us. That's input to the problem."}],"speech_gaps":[],"frame":"../frames/v042/008.webp","frame_time":1231.16},{"title":"加权最小二乘法中的参数表示与概率模型","segments":[{"id":116,"text":"Yeah, and you'll see me use the bar versus semicolon notation. Here the semicolon indicates that there are parameters on this side and the bar here is indicating this conditioning. Please.","start":1396.09,"end":1407.71},{"id":117,"text":"If you have a theta and a gamma, multiple parameters, would that just be a theta comma? Exactly right. So the question is, what if you have multiple parameters here? And what happens is you have theta, and then you would have exactly as you said to keep your example. You have a gamma, you have an alpha, and so on. They would just be concatenated there or sometimes put into a little tuple of values. Or what you'll often see, because I'm extremely lazy as a human, I will just write something like, oh, there's phi. And you remember phi bar has all the parameters. And it's up to you to go source it. And maybe I screwed it up.","start":1409.23,"end":1437.51},{"id":118,"text":"Great question. Other questions? Awesome. All right. Okay. So now we can talk. I've been saying this intuitively as I've gone through it. What is a likelihood? So we've been talking about what's likely or not likely. And that actually is underneath that is lurking a somewhat formal phrase. Okay.","start":1438.23,"end":1463.19},{"id":119,"text":"So the mental model is you show me, remember, a bunch of XIs and a bunch of YIs. Those are what showed up. And now what I'm going to try and do is for each setting of theta, I can tell you how likely that data point is under the model.","start":1463.93,"end":1484.49},{"id":120,"text":"So sorry for the larger box. This is the box I care about, which I'm now covering up and making impossible to read, which is perfect. Sorry. So this one here is saying, for each data point, it says, given xi and a yi pair, I can tell you how probabilistically likely it is. And that's basically just evaluating that function p that we had before. It was higher on things that were more likely, lower on things that are less likely. Let's not make a big deal out of it. And always non-negative.","start":1485.83,"end":1509.25},{"id":121,"text":"Now, why do I take this product over all the data sets? What am I using there? Well, there's only one assumption written on the slide, so it's fair to guess it's this one. How is that happening? Well, what's happening here is you could imagine I have the probability of all the x's and all the y's simultaneously. That would be some big, really gigantic function, right? That had a condition on all the x's and all the y's simultaneously. And instead, what IID is allowing me to do is say that function can be represented as a product.","start":1511.51,"end":1538.99},{"id":122,"text":"And that's what this notation means, by the way. It says all the y's and all the x's. And this cute little notation belies the fact that that would be huge. It would be a n times d dimensional thing that I was looking at. That would be really, really big. This is a massive simplification that IID gives me. Because they're independent, I can basically turn them into a product. That's what independence means. It really is a factorization. It means that it's a product. It's not a mysterious property of it. It is literally effectively the definition. Okay, cool.","start":1540.13,"end":1569.51},{"id":123,"text":"All right, now, this score.","start":1571.12,"end":1575.37}],"notes":["本段讨论了参数表示的多种方式，包括使用逗号分隔多个参数、将参数放入元组或使用符号如phi bar来表示所有参数。讲者强调了这些表示方法的灵活性和实际应用中的常见做法。","讲者通过概率模型的直观解释，说明了如何根据给定的xi和yi对，计算数据点在模型下的概率。这涉及对概率函数p的评估，其值的高低反映了数据点的可能程度。","讲者解释了为什么需要对所有数据点的概率取乘积。这基于独立同分布（IID）的假设，允许将联合概率分解为各个数据点概率的乘积，从而简化计算。","讲者进一步说明了独立同分布（IID）如何带来巨大的简化，将高维的联合概率转化为乘积形式。这种分解是独立性的直接结果，体现了概率论中的基本概念。","讲者提到，这种乘积形式的简化是独立性定义的直接体现，而不是某种神秘的性质。这强调了独立性在概率建模中的核心作用。","讲者最后提到“this score”，可能是指后续将讨论的得分函数（score function），但未展开说明。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1396.09,"end":1575.37,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1396.09,"text":"Yeah, and you'll see me use the bar versus semicolon notation. Here the semicolon indicates that there are parameters on this side and the bar here is indicating this conditioning. Please."},{"start":1409.23,"text":"If you have a theta and a gamma, multiple parameters, would that just be a theta comma? Exactly right. So the question is, what if you have multiple parameters here? And what happens is you have theta, and then you would have exactly as you said to keep your example. You have a gamma, you have an alpha, and so on. They would just be concatenated there or sometimes put into a little tuple of values. Or what you'll often see, because I'm extremely lazy as a human, I will just write something like, oh, there's phi. And you remember phi bar has all the parameters. And it's up to you to go source it. And maybe I screwed it up."},{"start":1438.23,"text":"Great question. Other questions? Awesome. All right. Okay. So now we can talk. I've been saying this intuitively as I've gone through it. What is a likelihood? So we've been talking about what's likely or not likely. And that actually is underneath that is lurking a somewhat formal phrase. Okay."},{"start":1463.93,"text":"So the intuition is, as I said to you, among the many distributions that are out there that have your data. So the mental model is you show me, remember, a bunch of XIs and a bunch of YIs. Those are what showed up. And now what I'm going to try and do is for each setting of theta, I can tell you how likely that data point is under the model."},{"start":1485.83,"text":"So sorry for the larger box. This is the box I care about, which I'm now covering up and making impossible to read, which is perfect. Sorry. So this one here is saying, for each data point, it says, given xi and a yi pair, I can tell you how probabilistically likely it is. And that's basically just evaluating that function p that we had before. It was higher on things that were more likely, lower on things that are less likely. Let's not make a big deal out of it. And always non-negative."},{"start":1511.51,"text":"Now, why do I take this product over all the data sets? What am I using there? Well, there's only one assumption written on the slide, so it's fair to guess it's this one. How is that happening? Well, what's happening here is you could imagine I have the probability of all the x's and all the y's simultaneously. That would be some big, really gigantic function, right? That had a condition on all the x's and all the y's simultaneously. And instead, what IID is allowing me to do is say that function can be represented as a product."},{"start":1540.13,"text":"And that's what this notation means, by the way. It says all the y's and all the x's. And this cute little notation belies the fact that that would be huge. It would be a n times d dimensional thing that I was looking at. That would be really, really big. This is a massive simplification that IID gives me. Because they're independent, I can basically turn them into a product. That's what independence means. It really is a factorization. It means that it's a product. It's not a mysterious property of it. It is literally effectively the definition. Okay, cool."},{"start":1571.12,"text":"All right, now, this score."}],"speech_gaps":[],"frame":"../frames/v042/009.webp","frame_time":1408.09},{"title":"加权最小二乘与最大似然","segments":[{"id":124,"text":"which I just substituted in. I didn't do anything fancy. I just took p and substituted in the last slide, right? So this score now, for every theta, there's a score which I can compute with this nasty formula. You could write it in, you know, whatever you want. You know, Cloud Code could write it for you. PyTorch could write it for you. NumPy could write it for you. Whatever, okay? You could write it in raw Python. Whatever you want, you can write this thing and it's going to give you a score. And the idea is that if theta is a better model of the world,","start":1576.77,"end":1602.71},{"id":125,"text":"it should say that the data is more likely. So if I were to compare two thetas, theta 1 and theta 2, and one gives me score x and the other one gives me score y, and x is bigger than y, I'm probably more likely to pick the more likely one. It fits the data better. Intuitive enough? Clear enough? Please ask a question if not. All right. Now, it turns out, remember I told you I didn't care about normalization constants? In general, that's true.","start":1603.39,"end":1631.13},{"id":126,"text":"But here, why this is so nice is because these things are all, you know, greater than zero.","start":1631.82,"end":1636.82},{"id":127,"text":"I can take logs.","start":1638.06,"end":1638.94},{"id":128,"text":"We love logarithms.","start":1639.48,"end":1640.7},{"id":129,"text":"And the reason we love logs is they're going to turn this nasty product,","start":1640.8,"end":1642.88},{"id":130,"text":"which is, you know, numerically unstable and has a bunch of problems,","start":1643.04,"end":1645.06},{"id":131,"text":"into some kind of nice closed form looking thing.","start":1646.5,"end":1649.1},{"id":132,"text":"And we're going to have logs of all the normalization contexts,","start":1649.32,"end":1651.84},{"id":133,"text":"minus, because there's a minus here, all these characters there.","start":1652.6,"end":1656.0},{"id":134,"text":"And that's going to be little l, or script l, is going to be the log likelihood.","start":1656.5,"end":1660.64},{"id":135,"text":"And you'll hear me use the log likelihood all the time. It's just the log of the original function.","start":1660.64,"end":1665.38},{"id":136,"text":"So far, so good. Now, we wanted to maximize this guy internally. That's how we were thinking about","start":1667.1,"end":1673.52},{"id":137,"text":"it. We want to pick the theta that had the highest score. Here, because after we've taken logs and we","start":1673.52,"end":1677.84},{"id":138,"text":"have negatives, we're going to see that we may want to change that. So let's get that. Now,","start":1677.84,"end":1687.56},{"id":139,"text":"Now, as I mentioned, this is just some arithmetic simplification.","start":1687.56,"end":1690.34},{"id":140,"text":"We pulled out the term.","start":1690.76,"end":1691.94},{"id":141,"text":"This term was constant, so we didn't have to deal with it.","start":1691.98,"end":1694.12},{"id":142,"text":"We had this nice form here.","start":1694.24,"end":1696.66},{"id":143,"text":"And lo and behold, if you remember the notation,","start":1696.98,"end":1699.48},{"id":144,"text":"if you're like a real notation aficionado from last week,","start":1699.6,"end":1702.72},{"id":145,"text":"then you see that this j theta is exactly the loss term","start":1702.88,"end":1705.6},{"id":146,"text":"that we had in least squares last week.","start":1705.6,"end":1707.22},{"id":147,"text":"So this is just this character right here.","start":1707.5,"end":1710.52},{"id":148,"text":"And this one half.","start":1711.4,"end":1712.62},{"id":149,"text":"This made j.","start":1713.2,"end":1714.22},{"id":150,"text":"That's just notation.","start":1715.74,"end":1716.6},{"id":151,"text":"If you don't remember that, don't worry.","start":1716.6,"end":1717.8},{"id":152,"text":"But that was the least squares laws.","start":1717.96,"end":1719.52},{"id":153,"text":"So basically, what we've done is we've","start":1719.8,"end":1721.48},{"id":154,"text":"gone from some probabilistic model","start":1721.48,"end":1723.06},{"id":155,"text":"to where a constant, which no theta changes,","start":1723.06,"end":1726.86},{"id":156,"text":"because we were not putting theta does not contain sigma.","start":1727.04,"end":1729.8},{"id":157,"text":"That was fixed.","start":1729.9,"end":1730.36},{"id":158,"text":"We now have this.","start":1731.1,"end":1732.54},{"id":159,"text":"And so what we've justified is that least squares is basically","start":1732.68,"end":1735.06},{"id":160,"text":"this model where we have fixed variance,","start":1735.06,"end":1738.26},{"id":161,"text":"but we have errors that are iid.","start":1738.8,"end":1740.88},{"id":162,"text":"That's it.","start":1743.02,"end":1743.5},{"id":163,"text":"Mean 0.","start":1744.54,"end":1745.16},{"id":164,"text":"Yeah.","start":1745.32,"end":1745.52},{"id":165,"text":"wondering why is the problem really here?","start":1746.79,"end":1748.47}],"notes":["本段主要讲解了如何通过最大似然估计来推导最小二乘法。讲者指出，通过取对数可以将乘积形式的似然函数转化为更易于处理的加法形式，从而避免数值不稳定的问题。同时，讲者强调了对数似然函数在模型选择中的重要性，即更高的对数似然值意味着更好的模型拟合。","讲者提到，虽然通常不关心归一化常数，但在某些情况下，这些常数可以被忽略，因为它们对最大化目标函数没有影响。此外，讲者还指出，通过取对数和处理负号，可以将原始的似然函数转化为对数似然函数，从而简化计算。","讲者进一步说明，通过简化和提取常数项，可以将对数似然函数转化为与最小二乘法相关的损失函数。这表明，最小二乘法实际上是基于某种概率模型的推导结果，其中假设误差项是独立同分布的，并且具有固定的方差。","讲者还提到，通过将对数似然函数转化为损失函数，可以将问题转化为一个优化问题，即寻找使损失函数最小化的参数值。这与最小二乘法的目标一致，即最小化误差的平方和。","讲者指出，最小二乘法的推导基于某些假设，例如误差项的独立性和固定方差。这些假设使得最小二乘法成为一种有效的估计方法，但同时也限制了其适用范围。","最后，讲者提到，虽然最小二乘法在某些情况下是有效的，但在其他情况下可能需要使用加权最小二乘法或其他方法来处理不同的误差结构。"],"formulas":[{"latex":"l(\\theta) = \\log(p(x|\\theta))","symbols":"对数似然函数","explanation":"公式正确，表示对数似然函数，适用于概率模型中最大化似然估计的场景。","evidence":"And that's going to be little l, or script l, is going to be the log likelihood."}],"uncertainties":["theta does not contain sigma"],"diagram":"none","start":1576.77,"end":1748.47,"asr_flags":[],"math_clarifications":["公式1中包含归一化常数是不正确的，因为对数似然函数通常不包含归一化常数，特别是在最大化似然估计时。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1576.77,"text":"which I just substituted in. I didn't do anything fancy. I just took p and substituted in the last slide, right? So this score now, for every theta, there's a score which I can compute with this nasty formula. You could write it in, you know, whatever you want. You know, Cloud Code could write it for you. PyTorch could write it for you. NumPy could write it for you. Whatever, okay? You could write it in raw Python. Whatever you want, you can write this thing and it's going to give you a score. And the idea is that if theta is a better model of the world,"},{"start":1603.39,"text":"it should say that the data is more likely. So if I were to compare two thetas, theta 1 and theta 2, and one gives me score x and the other one gives me score y, and x is bigger than y, I'm probably more likely to pick the more likely one. It fits the data better. Intuitive enough? Clear enough? Please ask a question if not. All right. Now, it turns out, remember I told you I didn't care about normalization constants? In general, that's true."},{"start":1631.82,"text":"But here, why this is so nice is because these things are all, you know, greater than zero."},{"start":1638.06,"text":"I can take logs."},{"start":1639.48,"text":"We love logarithms."},{"start":1640.8,"text":"And the reason we love logs is they're going to turn this nasty product,"},{"start":1643.04,"text":"which is, you know, numerically unstable and has a bunch of problems,"},{"start":1646.5,"text":"into some kind of nice closed form looking thing."},{"start":1649.32,"text":"And we're going to have logs of all the normalization contexts,"},{"start":1652.6,"text":"minus, because there's a minus here, all these characters there."},{"start":1656.5,"text":"And that's going to be little l, or script l, is going to be the log likelihood."},{"start":1660.64,"text":"And you'll hear me use the log likelihood all the time. It's just the log of the original function."},{"start":1667.1,"text":"So far, so good. Now, we wanted to maximize this guy internally. That's how we were thinking about"},{"start":1673.52,"text":"it. We want to pick the theta that had the highest score. Here, because after we've taken logs and we"},{"start":1677.84,"text":"have negatives, we're going to see that we may want to change that. So let's get that. Now,"},{"start":1687.56,"text":"Now, as I mentioned, this is just some arithmetic simplification."},{"start":1690.76,"text":"We pulled out the term."},{"start":1691.98,"text":"This term was constant, so we didn't have to deal with it."},{"start":1694.24,"text":"We had this nice form here."},{"start":1696.98,"text":"And lo and behold, if you remember the notation,"},{"start":1699.6,"text":"if you're like a real notation aficionado from last week,"},{"start":1702.88,"text":"then you see that this j theta is exactly the loss term"},{"start":1705.6,"text":"that we had in least squares last week."},{"start":1707.5,"text":"So this is just this character right here."},{"start":1711.4,"text":"And this one half."},{"start":1713.2,"text":"This made j."},{"start":1715.74,"text":"That's just notation."},{"start":1716.6,"text":"If you don't remember that, don't worry."},{"start":1717.96,"text":"But that was the least squares laws."},{"start":1719.8,"text":"So basically, what we've done is we've"},{"start":1721.48,"text":"gone from some probabilistic model"},{"start":1723.06,"text":"to where a constant, which no theta changes,"},{"start":1727.04,"text":"because we were not putting theta does not contain sigma."},{"start":1729.9,"text":"That was fixed."},{"start":1731.1,"text":"We now have this."},{"start":1732.68,"text":"And so what we've justified is that least squares is basically"},{"start":1735.06,"text":"this model where we have fixed variance,"},{"start":1738.8,"text":"but we have errors that are iid."},{"start":1743.02,"text":"That's it."},{"start":1744.54,"text":"Mean 0."},{"start":1745.32,"text":"Yeah."},{"start":1746.79,"text":"wondering why is the problem really here?"}],"speech_gaps":[],"frame":"../frames/v042/010.webp","frame_time":1588.77},{"title":"加权最小二乘与最大似然原理","segments":[{"id":166,"text":"Oh, great question. So in this particular case, it is. In general, it's not actually going to be positive. And that causes a whole bunch of pain when that's the case. Here, because this thing, the exponential, has that nice property that this is never exactly 0, we can pass through the logs here. If, for example, you have a distribution where the question was, if p is 0, what happens? Clearly, it's non-negative, right? Because it could be 0 places. If you have things that look like discrete distributions, then you have to be careful about what your domain is.","start":1749.78,"end":1777.66},{"id":167,"text":"Do this log trick. So it will still show up. But it's something you should pay attention to. If you start taking logs of zeros, all bets are off. But so this transformation happens enough that we're going to use it. And in fact, as we'll see later, most of the distributions we have effectively make sure that this happens. And you should check that as you go. And we will check it whenever I use the transformation. That's a great question. Cool.","start":1778.66,"end":1802.54},{"id":168,"text":"Awesome. All right. So this is just restating what I was saying before. We've shown that finding theta is, you know, we wanted to maximize L theta. So we had this model and we motivated that on entirely intuitive grounds. Among all the distributions that were out there, we wanted the one that was most likely that it kind of explained our data the best, right? All the data that were out there, we measured them against the data. That was L theta. We showed that that was the same as this, maximizing this character, right? And then this thing,","start":1807.0,"end":1834.88},{"id":169,"text":"We recognize as the least squares loss, but it shows up under a minus sign. And so I'm ruining the punchline. That's why we were minimizing it. Last time we were minimizing the errors. This time we were maximizing likelihood and minimizing this fell out. Constant minus that. If you think about taking a derivative with respect to theta, this term would go away. However you'd want to think about it, it's clear that that is equivalent. That's the part that you have control over.","start":1835.66,"end":1859.88},{"id":170,"text":"Now, you say at one level, you look at this and you say, well, this seems like a bunch of needless symbol pushing. Why did you waste my time with this? Fair point. But the reason is because this principle of maximum likelihood is actually more general than least squares. So one of the things that you're going to have in machine learning is you come to a new problem, you want to model it, and it turns out that it's a lot easier to think about forward models. Now, that statement, just so we're clear, that modeling statement is with a huge asterisk on it.","start":1862.01,"end":1889.29},{"id":171,"text":"I'm saying in practice or in academics or all the rest, we found it easier to think in terms of formal forward models many times. And so this is a recipe that works. It's not saying something like you can only think this way. Many other ways to think. But this is why it's so popular. And then once we have a forward model, we're going to see over this lecture and the next that you basically can turn a crank and always get out some optimization procedure.","start":1889.61,"end":1913.17}],"notes":["本段讨论了在使用对数变换时需要注意的问题，特别是当概率为零时，对数变换会导致问题。讲者强调了在处理分布时，需要特别注意定义域，尤其是在离散分布的情况下。","讲者提到，虽然对数变换在某些情况下会带来一些计算上的便利，但必须谨慎处理，因为对数零会导致计算错误。因此，讲者建议在使用对数变换时要进行检查。","讲者指出，最大似然原理比最小二乘法更为通用，这在机器学习中非常重要。当遇到新问题时，使用最大似然原理可以更方便地构建模型。","讲者提到，虽然最大似然原理在某些情况下可能看起来是不必要的符号操作，但其背后的原理是通用的，适用于各种模型构建场景。","讲者强调，虽然最大似然原理是常用的建模方法，但并不是唯一的建模方式。其他方法同样有效，但最大似然原理因其通用性而受到欢迎。","最后，讲者提到，一旦建立了前向模型，就可以通过优化过程来解决各种问题，这为后续的课程内容奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1749.78,"end":1913.17,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1749.78,"text":"Oh, great question. So in this particular case, it is. In general, it's not actually going to be positive. And that causes a whole bunch of pain when that's the case. Here, because this thing, the exponential, has that nice property that this is never exactly 0, we can pass through the logs here. If, for example, you have a distribution where the question was, if p is 0, what happens? Clearly, it's non-negative, right? Because it could be 0 places. If you have things that look like discrete distributions, then you have to be careful about what your domain is."},{"start":1778.66,"text":"do this log trick. So it will still show up. But it's something you should pay attention to. If you start taking logs of zeros, all bets are off. But so this transformation happens enough that we're going to use it. And in fact, as we'll see later, most of the distributions we have effectively make sure that this happens. And you should check that as you go. And we will check it whenever I use the transformation. That's a great question. Cool."},{"start":1807.0,"text":"Awesome. All right. So this is just restating what I was saying before. We've shown that finding theta is, you know, we wanted to maximize L theta. So we had this model and we motivated that on entirely intuitive grounds. Among all the distributions that were out there, we wanted the one that was most likely that it kind of explained our data the best, right? All the datas that were out there, we measured them against the data. That was L theta. We showed that that was the same as this, maximizing this character, right? And then this thing,"},{"start":1835.66,"text":"We recognize as the least squares loss, but it shows up under a minus sign. And so I'm ruining the punchline. That's why we were minimizing it. Last time we were minimizing the errors. This time we were maximizing likelihood and minimizing this fell out. Constant minus that. If you think about taking a derivative with respect to theta, this term would go away. However you'd want to think about it, it's clear that that is equivalent. That's the part that you have control over."},{"start":1862.01,"text":"Now, you say at one level, you look at this and you say, well, this seems like a bunch of needless symbol pushing. Why did you waste my time with this? Fair point. But the reason is because this principle of maximum likelihood is actually more general than least squares. So one of the things that you're going to have in machine learning is you come to a new problem, you want to model it, and it turns out that it's a lot easier to think about forward models. Now, that statement, just so we're clear, that modeling statement is with a huge asterisk on it."},{"start":1889.61,"text":"I'm saying in practice or in academics or all the rest, we found it easier to think in terms of formal forward models many times. And so this is a recipe that works. It's not saying something like you can only think this way. Many other ways to think. But this is why it's so popular. And then once we have a forward model, we're going to see over this lecture and the next that you basically can turn a crank and always get out some optimization procedure."}],"speech_gaps":[],"frame":"../frames/v042/011.webp","frame_time":1761.78},{"title":"加权最小二乘法与最大似然框架","segments":[{"id":172,"text":"That's going to allow us to solve a range of different things that in the machine learning literature, if you were to go back in time and look at them, they look quite distinct, but actually they're all instances of one generalized framework. That's quite useful for you to know in case you encounter your particular kinds of errors that you have, discrete errors, count errors, all the rest. We'll see some of those in the next lecture. But for now, is it clear that why this maximum likelihood I claim reduces to this least squares thing that we saw last time? We have justified that model.","start":1913.98,"end":1942.54},{"id":173,"text":"Good enough. All right.","start":1944.68,"end":1949.77},{"id":174,"text":"OK, so the summary of least squares. We introduced the maximum likelihood framework, which is super powerful. We're going to use it in the rest of this lecture and in the next lecture. We showed that least squares was actually a version of this maximum likelihood kind of event. And we learned some notation still that we're still loading up on probabilistic notation, the most important of which was the conditional and the distributed notation. What does it mean to be distributed as a normal? And what does it mean to condition on things? What are parameters? Those are the notational elements that were important from this section.","start":1951.34,"end":1978.04},{"id":175,"text":"Any questions here before I move on to the next topic? Please. Awesome question. Yeah, awesome question. So the question was, where does that sigma squared, where does it actually come from? Do we have an estimate of it? So on one hand, the simplest version of the model is you just assume it or look at the data and fit it outside of the modeling procedure. That's the practitioner's answer to it.","start":1979.55,"end":2005.83},{"id":176,"text":"The other is you can create a maximum likelihood where the variance is also unknown and you're fitting it as well. And so that's a more sophisticated example where you would actually put that in. But this comes down to the modeling question. What are you actually fitting from the data? And what are you assuming is what we'll call a kind of a prior distribution? What do you assume you know about the data? I would say if your model is such that small changes in a parameter like that.","start":2006.32,"end":2028.6},{"id":177,"text":"change your conclusions, you should be very nervous. And so one of the things is if you see there's a lot of times when you'll do what people call hyperparameter tuning, where they'll fit a range of those different models to their data. If they lead to totally different conclusions, that should make you uncomfortable.","start":2029.51,"end":2044.17},{"id":178,"text":"It really should make you uncomfortable because it means that there's something else going on that you're not modeling and it's important. If you change a parameter that you don't think should matter and nothing happens, that's a really good sign. So if you sweep the variance and you're like, as long as I'm within two orders of magnitude of variance one, I get kind of the same answer. You feel very comfortable as a statistician. There's a machine learner.","start":2044.73,"end":2073.08},{"id":179,"text":"Okay, so now on to the topic of classification. So classification is, we're going to look at binary classification. We'll eventually look at multi-class classification. And binary classification, it's a simplified setting where we have, again, we have our friends, XIs, right, that are there.","start":2074.43,"end":2089.33}],"notes":["本段讨论了最大似然估计在模型中如何处理方差参数的问题。讲者指出，方差可以是已知的，也可以是未知的，需要通过最大似然估计进行拟合。这涉及到模型构建时的假设，即我们是否将方差作为参数进行估计。","讲者强调了模型构建时的假设问题，即我们是否将方差视为已知或未知。如果模型对参数的小变化非常敏感，那么这可能意味着模型的假设存在问题，需要进一步检查。","讲者提到超参数调优（hyperparameter tuning）的过程，即通过拟合不同模型来调整参数，如果这些模型得出的结论差异很大，这可能意味着模型没有捕捉到数据中的关键信息。","讲者指出，如果改变一个看似不重要的参数却对结果没有影响，这可能是一个好的迹象，说明模型对参数的依赖性较低，或者参数的估计较为稳定。","讲者还提到，如果方差在两个数量级范围内变化时，结果仍然相似，这表明模型对数据的拟合较为稳健，统计学家会对此感到舒适。","最后，讲者提到在机器学习中，这种对参数变化的敏感性分析是重要的，可以帮助识别模型中的潜在问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1913.98,"end":2089.33,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1913.98,"text":"That's going to allow us to solve a range of different things that in the machine learning literature, if you were to go back in time and look at them, they look quite distinct, but actually they're all instances of one generalized framework. That's quite useful for you to know in case you encounter your particular kinds of errors that you have, discrete errors, count errors, all the rest. We'll see some of those in the next lecture. But for now, is it clear that why this maximum likelihood I claim reduces to this least squares thing that we saw last time? We have justified that model."},{"start":1944.68,"text":"Good enough. All right."},{"start":1951.34,"text":"OK, so the summary of least squares. We introduced the maximum likelihood framework, which is super powerful. We're going to use it in the rest of this lecture and in the next lecture. We showed that least squares was actually a version of this maximum likelihood kind of event. And we learned some notation still that we're still loading up on probabilistic notation, the most important of which was the conditional and the distributed notation. What does it mean to be distributed as a normal? And what does it mean to condition on things? What are parameters? Those are the notational elements that were important from this section."},{"start":1979.55,"text":"Any questions here before I move on to the next topic? Please. Awesome question. Yeah, awesome question. So the question was, where does that sigma squared, where does it actually come from? Do we have an estimate of it? So on one hand, the simplest version of the model is you just assume it or look at the data and fit it outside of the modeling procedure. That's the practitioner's answer to it."},{"start":2006.32,"text":"The other is you can create a maximum likelihood where the variance is also unknown and you're fitting it as well. And so that's a more sophisticated example where you would actually put that in. But this comes down to the modeling question. What are you actually fitting from the data? And what are you assuming is what we'll call a kind of a prior distribution? What do you assume you know about the data? I would say if your model is such that small changes in a parameter like that."},{"start":2029.51,"text":"change your conclusions, you should be very nervous. And so one of the things is if you see there's a lot of times when you'll do what people call hyperparameter tuning, where they'll fit a range of those different models to their data. If they lead to totally different conclusions, that should make you uncomfortable."},{"start":2044.73,"text":"It really should make you uncomfortable because it means that there's something else going on that you're not modeling and it's important. If you change a parameter that you don't think should matter and nothing happens, that's a really good sign. So if you sweep the variance and you're like, as long as I'm within two orders of magnitude of variance one, I get kind of the same answer. You feel very comfortable as a statistician. There's a machine learner. Great questions. Others? Awesome. Let's get at it."},{"start":2074.43,"text":"Okay, so now on to the topic of classification. So classification is, we're going to look at binary classification. We'll eventually look at multi-class classification. And binary classification, it's a simplified setting where we have, again, we have our friends, XIs, right, that are there."}],"speech_gaps":[],"frame":"../frames/v042/012.webp","frame_time":1925.98},{"title":"加权最小二乘与分类问题","segments":[{"id":180,"text":"We also now have yi's and those yi's are going to be modeled as just 0, 1.","start":2090.74,"end":2095.18},{"id":181,"text":"You can imagine as like cat or not cat,","start":2095.8,"end":2099.16},{"id":182,"text":"I don't know, whatever you want,","start":2099.3,"end":2100.22},{"id":183,"text":"whatever makes you happy.","start":2100.36,"end":2101.56},{"id":184,"text":"It's just a binary thing that says,","start":2101.66,"end":2102.82},{"id":185,"text":"is it yes or no? That's what our yi's are.","start":2102.9,"end":2104.76},{"id":186,"text":"Now the first question you should probably ask is,","start":2105.48,"end":2107.46},{"id":187,"text":"why do I need to do anything different?","start":2107.52,"end":2109.14},{"id":188,"text":"I'm going to take my data,","start":2109.34,"end":2110.78},{"id":189,"text":"my x's and my y's,","start":2110.82,"end":2111.9},{"id":190,"text":"why don't I just run them through the least squares thing that you did before,","start":2111.98,"end":2114.74},{"id":191,"text":"that seems like it should give me some answer.","start":2114.98,"end":2116.86},{"id":192,"text":"I can fit the x's and the y's and I sit there.","start":2117.12,"end":2118.9},{"id":193,"text":"What does that look like?","start":2119.1,"end":2120.36},{"id":194,"text":"Let's draw a picture and see what the traditional pitfall is.","start":2120.36,"end":2123.42},{"id":195,"text":"So we have data and our data is somehow arranged here.","start":2123.58,"end":2126.78},{"id":196,"text":"I'm going to try and get some blue ones.","start":2126.96,"end":2128.7},{"id":197,"text":"That's way too big.","start":2129.3,"end":2130.4},{"id":198,"text":"See if I can make it smaller.","start":2130.52,"end":2131.28},{"id":199,"text":"Too small.","start":2135.9,"end":2136.78},{"id":200,"text":"Perfect.","start":2136.98,"end":2137.32},{"id":201,"text":"All right, so we have some blue ones.","start":2137.74,"end":2138.76},{"id":202,"text":"These are going to be our negatives.","start":2138.98,"end":2141.1},{"id":203,"text":"These are our zeros.","start":2141.22,"end":2141.8},{"id":204,"text":"And then we go along.","start":2142.16,"end":2144.1},{"id":205,"text":"And then all of a sudden, we get some positives.","start":2144.96,"end":2148.36},{"id":206,"text":"I make those reds.","start":2148.58,"end":2149.52},{"id":207,"text":"and they're up here. This is one. This is how it looks.","start":2150.44,"end":2153.48},{"id":208,"text":"So far, so good.","start":2154.22,"end":2155.22},{"id":209,"text":"So if you look at this intuitively,","start":2155.36,"end":2156.66},{"id":210,"text":"what's the decision surface that you want?","start":2156.84,"end":2158.4},{"id":211,"text":"You somehow want to get a line that fits in here,","start":2158.46,"end":2161.1},{"id":212,"text":"that cleanly separates them over time and figures out where they are.","start":2161.78,"end":2165.08},{"id":213,"text":"The problem you have if you start to fit something that looks like least squares is,","start":2165.36,"end":2168.5},{"id":214,"text":"In classification, if we just care about separating the zeros from the ones, we just care about that split, we don't care if there's some blue that's way, way, way over here, over here, over here, over there. But if we're doing least squares, all of a sudden, we start getting hyperplanes, I'll use green, that instead of being nice, well-behaved hyperplanes, they start stretching out more and more and more.","start":2169.77,"end":2194.53},{"id":215,"text":"Okay, so this is just intuitive. You can run this exactly as I've described it, but hopefully it makes sense. What happens is as you start to get y's that are that are the x's that are that are going farther and farther away, instead of just finding the exact spot that splits them, I'm somehow trying to do something else. And the something else is I'm trying to kind of find their center of mass, right? And that seems inappropriate when I'm just trying to find what we'll call like a classification decision surface. Okay, all right. Questions about that clear enough? All right.","start":2194.91,"end":2222.37},{"id":216,"text":"Now, all that said, if you have actual data and you try this out,","start":2223.65,"end":2228.49},{"id":217,"text":"These squares will work more often than you think. So all that being said about it not being a great formal model and these issues about what happens when you get these tail data points and all the rest, they're all true. They do happen. I'm not telling you nonsense. But intuitively, when you get high dimensional data, high dimensional data is pretty weird. And what I mean by pretty weird is it has these strange properties like your closest point and your farthest point are often the same distance. Very strange things happen in high dimensions, which are different than you may picture. And so when you have real data,","start":2229.38,"end":2257.88}],"notes":["本段讲授了二分类问题中使用最小二乘法的局限性。yi被建模为0和1的二元变量，类似于猫或非猫的分类问题。讲者指出，直接使用最小二乘法会导致决策边界无法正确分离类别，因为最小二乘法会试图拟合所有数据点，包括远离决策边界的异常点，从而产生不合适的超平面。","讲者通过一个直观的图示说明了传统最小二乘法的陷阱。他描述了数据点的分布情况，其中蓝色点代表负类，红色点代表正类。当使用最小二乘法拟合时，超平面会试图拟合所有数据点，包括远离决策边界的点，从而导致决策边界变得不准确。","讲者进一步解释了最小二乘法在分类问题中的问题。他指出，最小二乘法会试图找到所有数据点的中心质量，而不是仅仅关注分类边界。这种做法在分类任务中是不合适的，因为分类任务只需要正确分离类别，而不需要考虑远离边界的点。","讲者提到，尽管最小二乘法在实际数据中可能表现良好，但它并不是一个理想的分类模型。他指出，高维数据具有许多奇特的性质，例如最近点和最远点之间的距离可能相同，这些性质在低维空间中并不常见。","讲者强调，高维数据的这些特性使得传统的最小二乘法在分类任务中表现不佳。他指出，当数据维度较高时，最小二乘法可能会产生不合适的决策边界，从而影响分类效果。","最后，讲者总结了最小二乘法在分类问题中的局限性，并指出尽管它在实际应用中可能有效，但其理论基础并不适用于分类任务。他建议在处理分类问题时，应考虑使用更合适的模型，如逻辑回归或支持向量机。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2090.74,"end":2257.88,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2090.74,"text":"We also now have yi's and those yi's are going to be modeled as just 0, 1."},{"start":2095.8,"text":"You can imagine as like cat or not cat,"},{"start":2099.3,"text":"I don't know, whatever you want,"},{"start":2100.36,"text":"whatever makes you happy."},{"start":2101.66,"text":"It's just a binary thing that says,"},{"start":2102.9,"text":"is it yes or no? That's what our yi's are."},{"start":2105.48,"text":"Now the first question you should probably ask is,"},{"start":2107.52,"text":"why do I need to do anything different?"},{"start":2109.34,"text":"I'm going to take my data,"},{"start":2110.82,"text":"my x's and my y's,"},{"start":2111.98,"text":"why don't I just run them through the least squares thing that you did before,"},{"start":2114.98,"text":"that seems like it should give me some answer."},{"start":2117.12,"text":"I can fit the x's and the y's and I sit there."},{"start":2119.1,"text":"What does that look like?"},{"start":2120.36,"text":"Let's draw a picture and see what the traditional pitfall is."},{"start":2123.58,"text":"So we have data and our data is somehow arranged here."},{"start":2126.96,"text":"I'm going to try and get some blue ones."},{"start":2129.3,"text":"That's way too big."},{"start":2130.52,"text":"See if I can make it smaller."},{"start":2135.9,"text":"Too small."},{"start":2136.98,"text":"Perfect."},{"start":2137.74,"text":"All right, so we have some blue ones."},{"start":2138.98,"text":"These are going to be our negatives."},{"start":2141.22,"text":"These are our zeros."},{"start":2142.16,"text":"And then we go along."},{"start":2144.96,"text":"And then all of a sudden, we get some positives."},{"start":2148.58,"text":"I make those reds."},{"start":2150.44,"text":"and they're up here. This is one. This is how it looks."},{"start":2154.22,"text":"So far, so good."},{"start":2155.36,"text":"So if you look at this intuitively,"},{"start":2156.84,"text":"what's the decision surface that you want?"},{"start":2158.46,"text":"You somehow want to get a line that fits in here,"},{"start":2161.78,"text":"that cleanly separates them over time and figures out where they are."},{"start":2165.36,"text":"The problem you have if you start to fit something that looks like least squares is,"},{"start":2169.77,"text":"In classification, if we just care about separating the zeros from the ones, we just care about that split, we don't care if there's some blue that's way, way, way over here, over here, over here, over there. But if we're doing least squares, all of a sudden, we start getting hyperplanes, I'll use green, that instead of being nice, well-behaved hyperplanes, they start stretching out more and more and more."},{"start":2194.91,"text":"Okay, so this is just intuitive. You can run this exactly as I've described it, but hopefully it makes sense. What happens is as you start to get y's that are that are the x's that are that are going farther and farther away, instead of just finding the exact spot that splits them, I'm somehow trying to do something else. And the something else is I'm trying to kind of find their center of mass, right? And that seems inappropriate when I'm just trying to find what we'll call like a classification decision surface. Okay, all right. Questions about that clear enough? All right."},{"start":2223.65,"text":"Now, all that said, if you have actual data and you try this out,"},{"start":2229.38,"text":"These squares will work more often than you think. So all that being said about it not being a great formal model and these issues about what happens when you get these tail data points and all the rest, they're all true. They do happen. I'm not telling you nonsense. But intuitively, when you get high dimensional data, high dimensional data is pretty weird. And what I mean by pretty weird is it has these strange properties like your closest point and your farthest point are often the same distance. Very strange things happen in high dimensions, which are different than you may picture. And so when you have real data,"}],"speech_gaps":[{"start":2133.264,"end":2134.832}],"frame":"../frames/v042/013.webp","frame_time":2102.74},{"title":"加权最小二乘与分类函数","segments":[{"id":218,"text":"Sometimes you just run a model that's pretty bad back to it, but it does a good enough job. And that can definitely happen. So modeling is not a formally correct or incorrect thing. It's always a matter of degree. But for classification, it's kind of a nice type thing.","start":2258.42,"end":2272.67},{"id":219,"text":"So you should use a classification function so that your predictions, someone doesn't ask you yes or no and you predict seven. That seems crazy. So you'd have to have some code over there that says, if my function says seven, I round it to one. If it says negative 40, I say zero. You'd have to have code on the outside to do that, which also makes it a little bit more of a hassle. So let's look at the most common classification function. And this is the one that is the workhorse of the stuff that we do today. We're going to have these things that we'll call link function. So our hypothesis is still going to be linear.","start":2273.09,"end":2301.75},{"id":220,"text":"So there's still this linear element to it, but we're going to add in.","start":2302.4,"end":2306.02},{"id":221,"text":"So there's still this linear element to it, but we're going to add in. a nonlinear element G. And G is going to be called a link function. So it's going to have some shape. So what would you want G to have? Well, you'd probably want it to be monotone. It'd be super weird if it wasn't monotone increasing. You give it a higher score and just randomly gives you a value. So G shouldn't be stochastic. It shouldn't go from 1.1 to 1.2 and then go from returning 1 to false. It shouldn't just go. So it'd probably be smooth and monotone were things that we would want.","start":2307.49,"end":2332.89},{"id":222,"text":"So let's look at it. So there are many that you can pick. And there are actually entire stats books that you can read. I even own some of them that tell you various different functions. But here's one that's very, very popular. And this very popular function has this nice, beautiful sigmoidal shape where it starts down at 0 and it goes up. Now, you may look at this and say, why don't I just use a threshold?","start":2333.79,"end":2354.07},{"id":223,"text":"Why don't I just say, go to here, go to here, and that's my function, the step function. The reason we don't use that function is, well, it's non-differentiable, and so it's not convenient mathematically. Now, differentiable isn't a hard boundary for us. Actually, in a lot of neural nets, not so much as anymore, but a lot of neural nets say five years ago, they used other functions like rel use and things that look like that, which are not differentiable, hinge losses. There are other losses that you could use.","start":2354.84,"end":2380.1},{"id":224,"text":"But here we're just going to focus on this nice one because it has this beautiful scaling between 0 and 1, and it's going to show up and give us the most popular model, which is logistic regression.","start":2380.72,"end":2390.86},{"id":225,"text":"All right, so how do we interpret this thing? So basically, we interpret it as being in the class is its height. So h of theta is going to be this kind of probabilistic thing. And 1 minus h of theta is going to be the probability it's not in the class. Now, this is already interesting. Before, we were just predicting a scalar. Now, I'm telling you that when we predict something, we're going to think about it being the probability that's in the class. So if it's very, very close to 1, intuitively, we think it's very likely to be in the class. We will not return exactly 1. We may return 0.999.","start":2396.07,"end":2424.77}],"notes":["本段讨论了分类任务中使用分类函数的必要性，指出直接预测类别标签（如数字）是不合理的，需要通过外部代码进行处理。同时，介绍了链接函数（link function）的概念，强调其在分类模型中的作用。","链接函数需要满足单调性和平滑性，以确保模型的可解释性和数学上的便利性。例如，单调性可以保证输出随着输入的增加而单调变化，而平滑性则有助于优化过程。","本段提到的S型函数（sigmoidal function）因其在0到1之间的平滑特性而被广泛使用，特别是在逻辑回归（logistic regression）中。这种函数的非可导性是其缺点，但可以通过近似方法（如使用Relu函数）来克服。","在分类任务中，模型输出通常被解释为属于某一类的概率。例如，当输出接近1时，表示该样本属于该类的概率很高，而接近0时则表示概率很低。","本段还提到，虽然可以使用阈值函数（如阶跃函数）进行分类，但由于其不可导性，通常不被采用。相反，使用可导的函数（如S型函数）可以更好地进行优化。","逻辑回归模型利用S型函数将线性组合映射到概率空间，从而实现分类任务。这种模型在实际应用中非常流行，因为它能够提供概率解释，并且可以通过最大似然估计进行训练。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2258.42,"end":2424.77,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2258.42,"text":"Sometimes you just run a model that's pretty bad back to it, but it does a good enough job. And that can definitely happen. So modeling is not a formally correct or incorrect thing. It's always a matter of degree. But for classification, it's kind of a nice type thing."},{"start":2273.09,"text":"So you should use a classification function so that your predictions, someone doesn't ask you yes or no and you predict seven. That seems crazy. So you'd have to have some code over there that says, if my function says seven, I round it to one. If it says negative 40, I say zero. You'd have to have code on the outside to do that, which also makes it a little bit more of a hassle. So let's look at the most common classification function. And this is the one that is the workhorse of the stuff that we do today. We're going to have these things that we'll call link function. So our hypothesis is still going to be linear."},{"start":2302.4,"text":"So there's still this linear element to it, but we're going to add in."},{"start":2307.49,"text":"a nonlinear element G. And G is going to be called a link function. So it's going to have some shape. So what would you want G to have? Well, you'd probably want it to be monotone. It'd be super weird if it wasn't monotone increasing. You give it a higher score and just randomly gives you a value. So G shouldn't be stochastic. It shouldn't go from 1.1 to 1.2 and then go from returning 1 to false. It shouldn't just go. So it'd probably be smooth and monotone were things that we would want."},{"start":2333.79,"text":"So let's look at it. So there are many that you can pick. And there are actually entire stats books that you can read. I even own some of them that tell you various different functions. But here's one that's very, very popular. And this very popular function has this nice, beautiful sigmoidal shape where it starts down at 0 and it goes up. Now, you may look at this and say, why don't I just use a threshold?"},{"start":2354.84,"text":"Why don't I just say, go to here, go to here, and that's my function, the step function. The reason we don't use that function is, well, it's non-differentiable, and so it's not convenient mathematically. Now, differentiable isn't a hard boundary for us. Actually, in a lot of neural nets, not so much as anymore, but a lot of neural nets say five years ago, they used other functions like rel use and things that look like that, which are not differentiable, hinge losses. There are other losses that you could use."},{"start":2380.72,"text":"But here we're just going to focus on this nice one because it has this beautiful scaling between 0 and 1, and it's going to show up and give us the most popular model, which is logistic regression."},{"start":2396.07,"text":"All right, so how do we interpret this thing? So basically, we interpret it as being in the class is its height. So h of theta is going to be this kind of probabilistic thing. And 1 minus h of theta is going to be the probability it's not in the class. Now, this is already interesting. Before, we were just predicting a scalar. Now, I'm telling you that when we predict something, we're going to think about it being the probability that's in the class. So if it's very, very close to 1, intuitively, we think it's very likely to be in the class. We will not return exactly 1. We may return 0.999."}],"speech_gaps":[],"frame":"../frames/v042/014.webp","frame_time":2270.42},{"title":"加权最小二乘与概率解释","segments":[{"id":226,"text":"But we're going to return and say that that's very close to 1. And then there's 1 minus because it's binary, but it's in the other class. And the reason I highlight this notation is later when we do multi-class, this will again come up. We'll bake the classes off of each other. Any questions about how this works and what the type is?","start":2426.34,"end":2443.18},{"id":227,"text":"Okay, so all that I expect that you have thought so far is, okay, I have a new h theta. I have this new class of functions. They look relatively simple. They look like the linear functions that I used to have from a couple minutes ago, except for now I've run them through this g function that's going to smooth out their value. So if theta dot x is going to be some huge value like 100, well, that's going to be way, way over here, and it's going to be very, very close to 1. That's the idea. You'll sometimes hear people call these logits, but that's a separate issue.","start":2445.72,"end":2475.25},{"id":228,"text":"Okay, if you know what a logit is. Okay, cool. All right, so that probabilistic interpretation is going to give us directly a model. Okay, so back to what we were describing before, we are going to go back and use our old friend, maximum likelihood.","start":2475.69,"end":2491.74},{"id":229,"text":"And we're going to try an old friend from 15 minutes ago. So maybe it's whatever. I'm not going to make a terrible joke there. Anyway, so back to this. You're going to go to the product. Why are we going to a product? We're again assuming some independence. So we're going to have this nice product that's going on and what's happening. And then we're going to substitute our format. Now, this is just notation. This is just if-then written in a clever, statsy, machine learning way. It says either","start":2492.49,"end":2519.23},{"id":230,"text":"yi is 0, and if it's 0, then which term is active? This term. Or yi is 1, and this term. So this is yi equal 1, this is y equals 0. It's just putting the two terms there, and when they're off, they return 1. So just convince yourself that this function does what you think it does. If you plug in y is equal to 1, you get the term that you want, and it doesn't go to 0. If you plug in the other one, you get the other one. Hypothesis 1 minus hypothesis.","start":2520.66,"end":2548.46},{"id":231,"text":"Okay, so far so good. All right, now back to the other thing. We take logs. So you've already seen this movie. You kind of know how it goes. And we get this fun form here. I'm not going to beat it to death. This is yi, 1 minus yi. They have different things inside the logs.","start":2550.44,"end":2568.94},{"id":232,"text":"All we're doing is trying to walk back exactly the same framework that we did before, and this is going to get us to another one of those functions, which is a gigantic sum instead of a product, nice numerically stable, all that other good stuff that happens from it, over our data points. How are we going to solve this thing? Any guesses? Differentiate, compute some gradients, let it run for a while. Now, this one we can tell when it's finished, which is not going to be true later in the course, but this one we can actually solve.","start":2569.7,"end":2600.37}],"notes":["本段讲解了二分类问题中概率解释的构建，通过将线性函数经过g函数平滑处理，使得输出值接近0或1。这种处理方式为后续多分类问题提供了基础，通过将不同类别之间的关系建模为相互依赖的结构。","讲者提到logit的概念，这是将线性输出映射到概率值的函数，但这一概念在本段中并未深入展开，仅作为术语提及。随后，讲者转向最大似然估计，这是构建概率模型的核心方法。","在构建似然函数时，讲者使用了乘积形式，这是基于独立性假设的。通过将乘积转换为对数形式，可以将问题转化为求和形式，从而提高数值稳定性。","讲者指出，通过求导并计算梯度，可以求解优化问题。虽然这种方法在后续课程中可能不再适用，但在当前问题中，可以明确判断何时达到最优解。","本段强调了从线性模型到概率模型的转变，以及如何通过数学工具（如对数、梯度）来处理实际问题。这些方法为后续更复杂的模型（如神经网络）奠定了基础。","讲者通过举例说明了如何将二分类问题中的概率解释应用于实际计算，包括如何处理不同类别之间的关系，以及如何通过数学变换简化计算过程。"],"formulas":[{"latex":"p(y_i | x_i) = h_{\\theta}(x_i)^{y_i} (1
