xt-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】加权最小二乘 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v042","title":"【斯坦福CS229】加权最小二乘","course":"机器学习","pages":[{"title":"加权最小二乘与分类任务","segments":[{"id":0,"text":"Welcome to CS229. This is going to be lecture three. We're going to talk today about classification, which is arguably one of the most fundamental tasks in machine learning, and one which started a lot of the progress that you see today. And so classification, if you recall, is going to be this problem where our label space comes from a bunch of discrete outcomes rather than continuous outcomes, which is what we saw last time. In regression, you could have prices. Here you may have, you know.","zh":"欢迎来到CS229。这是第三讲。今天我们将讨论分类，这可以说是机器学习中最基本的任务之一，也是你今天所看到的许多进展的起点。分类，如果你还记得，就是这样一个问题，我们的标签空间来自于一系列离散的结果，而不是连续的结果，这是我们上次看到的。在回归中，你可以有价格。在这里，你可能会有，比如说。","start":5.14,"end":32.9},{"id":1,"text":"Cat versus dog, you may have different words. They come from a discrete set. And that will change a couple of things inside our setup.","zh":"猫与狗，你可能会有不同的词语。它们来自于一个离散的集合。这将改变我们设置中的几个方面。","start":33.42,"end":40.2},{"id":2,"text":"So what we're going to do first is we're going to take something we already know from last time, and we're going to tweak it just a little bit. So we're going to see linear regression, which we saw last time, but now we're going to give it a probabilistic interpretation. And the hope from doing this is that you can see that this method of going over the probabilistic stuff, just that piece of the modeling is changing. So hopefully, you're not seeing two things change at once.","zh":"因此，我们首先要做的事情是，我们从上次已经知道的内容出发，并对其进行一点小小的调整。我们将看到线性回归，这是我们上次看到的，但现在我们将给它一个概率解释。这样做希望的是，你能看到这种方法只是在建模的这一部分发生了变化。希望你不会看到两个方面同时发生变化。","start":41.52,"end":64.24},{"id":3,"text":"Once we get to the form of having a probabilistic model, and what it's going to do is basically model, as you hear, some errors. We're going to use those errors to talk about other forms of models that we could have, and in particular, motivate the workhorse for what we're going to see now, which is logistic regression. And as I would say, as I mentioned last time, logistic regression is kind of the last layer of every model that you've probably interacted with. If it's text or code, any chat GPT, all the rest, that last layer is effectively what we would call a softmax.","zh":"一旦我们得到一个概率模型的形式，它所做的基本上就是建模，正如你听到的，一些误差。我们将利用这些误差来讨论其他形式的模型，特别是现在我们将要看到的主力模型，即逻辑回归。正如我上次提到的，逻辑回归可以说是你可能已经交互过的每一个模型的最后一层。无论是文本还是代码，任何聊天GPT，其余的，最后一层实际上就是我们所说的softmax。","start":65.03,"end":93.99},{"id":4,"text":"logistic regression. We'll talk a little bit about that. And then the last thing that we'll talk about today is also to give you a little bit of an idea about optimization methods. So last time we saw gradient descent and stochastic gradient descent. Those are the workhorse methods. That's what you're going to use throughout the course. But I'm going to show you just because it's kind of historically important and also kind of an interesting algorithm in its own right. I'm going to show you Newton's method just very, very briefly.","zh":"逻辑回归。我们会稍微谈谈这个话题。然后我们今天要讲的最后一点，也是为了让你对优化方法有一个大致的了解。上一次我们看到了梯度下降和随机梯度下降。这些是主要的方法。你将在整个课程中使用这些方法。但我要向你展示一下，因为这在历史上有一定的意义，而且它本身也是一个有趣的算法。我将非常简短地向你展示牛顿法。","start":94.5,"end":118.98},{"id":5,"text":"Now, that flow, the thing that I want you to take away from all of this is this framework, which we're going to see again and again for the next couple weeks, which is this maximum likelihood method. And basically, the idea here at a very high level is you set up a probabilistic model, a forward model of how you think the world behaves, and that determines what the parameters you're solving are. And we'll see this. This will be made concrete, but I want to make sure you hear this kind of high-level piece. And then with that...","zh":"现在，这个流程，我希望你们从所有这些内容中带走的是这个框架，我们将在接下来的几周里反复看到这个框架，即最大似然方法。基本上，从一个很高的层次来看，这个想法是建立一个概率模型，一个你认为世界如何运作的前向模型，这决定了你要解决的参数。我们会看到这一点。这将变得具体，但我希望确保你们听到这个高层次的部分。然后，有了这个……","start":120.37,"end":146.09},{"id":6,"text":"essence of this model this maximum likelihood that's the thing that's going to generalize across various different setups it's going to generalize both from continuous to discrete to all kinds of interesting new models that we have all the way into the modern ai models that we use today and so this method is just something you should know it's really foundational it's kind of the bedrock and we'll try and introduce it here as quickly as we can first from linear regression so it's nice and simple and then bumping up to discrete stuff program clear enough awesome let's get to it","zh":"这个模型的本质，这个最大似然方法，是能够跨各种不同的设置进行泛化，它既可以从连续泛化到离散，也可以泛化到各种有趣的新模型，一直到我们今天使用的现代人工智能模型。因此，这种方法是你应该知道的，它非常基础，可以说是基石。我们将尽可能快地在这里引入它，首先从线性回归开始，这样比较简单，然后逐步过渡到离散内容。清楚吗？太棒了，我们开始吧。","start":146.76,"end":175.36}],"notes":["本段主要介绍了最大似然方法作为机器学习中一个基础且通用的框架，它适用于从连续到离散的各种模型，包括现代人工智能模型。该方法是课程后续内容的基础，将从线性回归开始介绍，逐步过渡到离散任务。","讲者强调最大似然方法的通用性，它不仅适用于回归问题，也适用于分类任务，如逻辑回归。这种方法是构建各种模型的核心，包括现代AI模型中的最后一层softmax函数。","讲者提到最大似然方法是课程后续内容的基石，将从线性回归开始，逐步过渡到离散任务。这表明课程将通过简单例子逐步引入复杂概念。","讲者提到最大似然方法的通用性，它能够推广到各种不同的设置中，包括从连续到离散的模型，以及现代AI模型。这表明该方法是机器学习中的基础工具。","讲者提到最大似然方法是课程中要介绍的核心内容，将从线性回归开始，逐步过渡到离散任务。这表明课程将通过逐步递进的方式，帮助学生理解该方法。","讲者提到最大似然方法是机器学习中的基础方法，是构建各种模型的基石。这表明该方法在机器学习中的重要性，是后续内容的基础。"],"formulas":[],"uncertainties":["essence of this model this maximum likelihood that's the thing that's going to generalize across various different setups it's going to generalize both from continuous to discrete to all kinds of interesting new models that we have all the way into the modern ai models that we use today and so this method is just something you should know it's really foundational it's kind of the bedrock and we'll try and introduce it here as quickly as we can first from linear regression so it's nice and simple and then bumping up to discrete stuff program clear enough awesome let's get to it"],"diagram":"none","start":5.14,"end":175.36,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.14,"text":"Welcome to CS229. This is going to be lecture three. We're going to talk today about classification, which is arguably one of the most fundamental tasks in machine learning, and one which started a lot of the progress that you see today. And so classification, if you recall, is going to be this problem where our label space comes from a bunch of discrete outcomes rather than continuous outcomes, which is what we saw last time. In regression, you could have prices. Here you may have, you know."},{"start":33.42,"text":"Cat versus dog, you may have different words. They come from a discrete set. And that will change a couple of things inside our setup."},{"start":41.52,"text":"So what we're going to do first is we're going to take something we already know from last time, and we're going to tweak it just a little bit. So we're going to see linear regression, which we saw last time, but now we're going to give it a probabilistic interpretation. And the hope from doing this is that you can see that this method of going over the probabilistic stuff, just that piece of the modeling is changing. So hopefully, you're not seeing two things change at once."},{"start":65.03,"text":"Once we get to the form of having a probabilistic model, and what it's going to do is basically model, as you hear, some errors. We're going to use those errors to talk about other forms of models that we could have, and in particular, motivate the workhorse for what we're going to see now, which is logistic regression. And as I would say, as I mentioned last time, logistic regression is kind of the last layer of every model that you've probably interacted with. If it's text or code, any chat GPT, all the rest, that last layer is effectively what we would call a softmax."},{"start":94.5,"text":"logistic regression. We'll talk a little bit about that. And then the last thing that we'll talk about today is also to give you a little bit of an idea about optimization methods. So last time we saw gradient descent and stochastic gradient descent. Those are the workhorse methods. That's what you're going to use throughout the course. But I'm going to show you just because it's kind of historically important and also kind of an interesting algorithm in its own right. I'm going to show you Newton's method just very, very briefly."},{"start":120.37,"text":"Now, that flow, the thing that I want you to take away from all of this is this framework, which we're going to see again and again for the next couple weeks, which is this maximum likelihood method. And basically, the idea here at a very high level is you set up a probabilistic model, a forward model of how you think the world behaves, and that determines what the parameters you're solving are. And we'll see this. This will be made concrete, but I want to make sure you hear this kind of high-level piece. And then with that..."},{"start":146.76,"text":"essence of this model this maximum likelihood that's the thing that's going to generalize across various different setups it's going to generalize both from continuous to discrete to all kinds of interesting new models that we have all the way into the modern ai models that we use today and so this method is just something you should know it's really foundational it's kind of the bedrock and we'll try and introduce it here as quickly as we can first from linear regression so it's nice and simple and then bumping up to discrete stuff program clear enough awesome let's get to it"}],"speech_gaps":[],"frame":"../frames/v042/001.webp","frame_time":17.14},{"title":"加权最小二乘的统计建模基础","segments":[{"id":7,"text":"All right, so recall from last time, we were looking at least squares. And the point of this is that we didn't really have a full kind of justification for it. So we're now going to try and justify what we did in least squares, which you already hopefully know and feel very comfortable with.","zh":"好的，那么回想一下上次的内容，我们讨论的是最小二乘法。我们当时并没有一个完整的理论依据。现在，我们将尝试为最小二乘法提供一个理论依据，这应该已经是你所熟悉并感到很舒适的了。","start":177.81,"end":190.75},{"id":8,"text":"But we're going to try and put it in this new, more probabilistic modeling context. And that's going to be the lever that allows us to extend it to many new and potentially unfamiliar settings. So what we have here, if you recall, is we have a bunch of points xi. These are vectors that live in d plus 1. And recall, the d plus 1 comes because we have this convention that they all have one component that has one in them everywhere, so that we can talk with a kind of nicer notation, just so we don't have to have what's called a bias or an offset in our notes.","zh":"不过，我们将尝试将它置于一个新的、更具概率建模的背景下。这将使我们能够将其扩展到许多新的、可能不熟悉的场景中。回想一下，我们这里有一组点xi。这些点是位于d加1维空间中的向量。回想一下，d加1维是因为我们有一个惯例，即它们的所有分量中有一个是处处为1的，这样我们就可以使用一种更简洁的记号，从而不需要在我们的笔记中引入所谓的偏差或偏置项。","start":191.57,"end":217.03},{"id":9,"text":"We also have for every point a corresponding label. This is because we're still in supervised learning. In supervised learning, you have labels. The labels here, because it's regression, come from a continuous space. Here, one of our favorite continuous space, just real numbers.","zh":"我们还为每个点有一个对应的标签。这是因为我们仍然处于监督学习的范畴中。在监督学习中，你有标签。这里的标签，因为是回归问题，来自于一个连续空间。这里，我们最喜欢的一个连续空间，就是实数。","start":218.09,"end":231.13},{"id":10,"text":"inner product. And then there's an error here. This is the error term, if you like, which is how far off we are from the label, our hypothesis on x predicting the yi, and we pay for it in the square. We talked about last time all the reasons we paid for it in the square. I won't go over them again. Mathematical convenience and also some modeling. Today, we're going to focus more on the modeling aspect of that and try and see kind of what consequence that has.","zh":"内积。然后这里有一个误差项。如果你喜欢的话，这可以理解为我们的预测值与标签之间的偏差，即我们的假设在x上预测的yi与实际值之间的差距，我们通过平方来惩罚这个误差。我们之前已经讨论过所有使用平方惩罚的原因。我不会再重复一遍。这包括数学上的便利性以及一些建模考虑。今天，我们将更多地关注这一方面的建模意义，并尝试看看这会带来什么样的后果。","start":233.01,"end":257.55},{"id":11,"text":"inner product. And then there's an error here. This is the error term, if you like, which is how far off we are from the label, our hypothesis on x predicting the yi, and we pay for it in the square. We talked about last time all the reasons we paid for it in the square. I won't go over them again. Mathematical convenience and also some modeling. Today, we're going to focus more on the modeling aspect of that and try and see kind of what consequence that has. What's another way to interpret this model here? Okay, good enough.","zh":"内积。然后这里有一个误差项。如果你喜欢的话，这可以理解为我们的预测值与标签之间的偏差，即我们的假设在x上预测的yi与实际值之间的差距，我们通过平方来惩罚这个误差。我们之前已经讨论过所有使用平方惩罚的原因。我不会再重复一遍。这包括数学上的便利性以及一些建模考虑。今天，我们将更多地关注这一方面的建模意义，并尝试看看这会带来什么样的后果。另一种解释这个模型的方式是什么？好的，够了。","start":258.19,"end":285.25},{"id":12,"text":"All right. So what we're going to talk about is where did this model come from? And we're going to try and justify it in terms of something that's hopefully a little bit more simple. Even if you don't buy that it's any more simple, that doesn't really matter. It's another lens to view the problem that's going to allow us, as we said, to generalize. And this probabilistic interpretation is really critical in machine learning. It was kind of the core way we did a lot of things. And it's still, you can see it lurking underneath many of the models that we build today. Okay. So here it comes.","zh":"好的。那么我们接下来要讨论的是，这个模型是从哪里来的？我们将尝试用一种可能更简单的观点来证明它。即使你不认为它更简单，这也没关系。这是一种看待问题的新视角，它将使我们能够进行泛化。这种概率解释在机器学习中是非常关键的。它曾经是我们做很多事情的核心方法。而且，你也可以看到，它仍然潜藏在我们今天构建的许多模型背后。好的，现在我们来看看。","start":287.25,"end":316.3},{"id":13,"text":"If you haven't seen something like this before, it'll take a little bit of a second to think what's actually going on. If you have seen kind of stats models, it's basically a statistical model. So we're going to make an assumption, which is a little bit weird. We'll talk about why it's weird in a second. But what we're going to assume is that the data that we see is generated according to some process. And that we know something about that process. Or rather, we're willing to model that process in some way. So here we have our first example of the simplest process that we could imagine. We'll make this increasingly more complicated as we go throughout the course.","zh":"如果你以前没有见过类似的东西，可能需要一点时间来思考到底发生了什么。如果你见过一些统计模型，那它基本上就是一个统计模型。我们将做一个假设，这个假设有点奇怪。我们稍后会讨论为什么它奇怪。但我们将假设我们所看到的数据是由某种过程生成的，并且我们对这个过程有所了解。或者说，我们愿意以某种方式来建模这个过程。在这里，我们给出了我们所能想象的最简单的过程的第一个例子。随着课程的进行，我们将逐步增加复杂性。","start":316.8,"end":346.1}],"notes":["本段讲解了最小二乘法的目标函数及其背后的建模意义。讲者指出，最小二乘法的目标是找到一个参数θ，使得预测值与实际标签之间的误差平方和最小。这种建模方式不仅具有数学上的便利性，还具有实际的建模意义，特别是在回归问题中，标签来自连续空间（如实数）。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.81,"end":346.1,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":177.81,"text":"All right, so recall from last time, we were looking at least squares. And the point of this is that we didn't really have a full kind of justification for it. So we're now going to try and justify what we did in least squares, which you already hopefully know and feel very comfortable with."},{"start":191.57,"text":"But we're going to try and put it in this new, more probabilistic modeling context. And that's going to be the lever that allows us to extend it to many new and potentially unfamiliar settings. So what we have here, if you recall, is we have a bunch of points xi. These are vectors that live in d plus 1. And recall, the d plus 1 comes because we have this convention that they all have one component that has one in them everywhere, so that we can talk with a kind of nicer notation, just so we don't have to have what's called a bias or an offset in our notes."},{"start":218.09,"text":"We also have for every point a corresponding label. This is because we're still in supervised learning. In supervised learning, you have labels. The labels here, because it's regression, come from a continuous space. Here, one of our favorite continuous space, just real numbers."},{"start":233.01,"text":"Now the goal is, if you recall, we're going to find some theta, and that theta is going to live in rd plus 1. It satisfies, we derived at the end of last lecture, that it satisfies this equation that I just highlighted here, which is theta is going to be the minimum over some set of errors. And we talked about these errors here are, here's the prediction. This is the hypothesis theta applied to the point xi. Mechanically, it is just this linear."},{"start":258.19,"text":"inner product. And then there's an error here. This is the error term, if you like, which is how far off we are from the label, our hypothesis on x predicting the yi, and we pay for it in the square. We talked about last time all the reasons we paid for it in the square. I won't go over them again. Mathematical convenience and also some modeling. Today, we're going to focus more on the modeling aspect of that and try and see kind of what consequence that has. What's another way to interpret this model here? Okay, good enough."},{"start":287.25,"text":"All right. So what we're going to talk about is where did this model come from? And we're going to try and justify it in terms of something that's hopefully a little bit more simple. Even if you don't buy that it's any more simple, that doesn't really matter. It's another lens to view the problem that's going to allow us, as we said, to generalize. And this probabilistic interpretation is really critical in machine learning. It was kind of the core way we did a lot of things. And it's still, you can see it lurking underneath many of the models that we build today. Okay. So here it comes."},{"start":316.8,"text":"If you haven't seen something like this before, it'll take a little bit of a second to think what's actually going on. If you have seen kind of stats models, it's basically a statistical model. So we're going to make an assumption, which is a little bit weird. We'll talk about why it's weird in a second. But what we're going to assume is that the data that we see is generated according to some process. And that we know something about that process. Or rather, we're willing to model that process in some way. So here we have our first example of the simplest process that we could imagine. We'll make this increasingly more complicated as we go throughout the course."}],"speech_gaps":[],"frame":"../frames/v042/002.webp","frame_time":189.81},{"title":"加权最小二乘法中的噪声建模","segments":[{"id":14,"text":"So what is our process? What we imagine that the process that we generate this data from is that every data point, effectively there exists a true theta that's out there in the world. We don't get to see theta, but it exists somewhere. And then when we see yi, remember we talked about that yi wasn't perfectly accurate, some noise term is introduced. Here, epsilon i.","zh":"那么我们的处理过程是怎样的呢？我们想象生成这些数据的过程是，每个数据点实际上存在一个真实的θ，它存在于世界上。我们看不到θ，但它存在于某个地方。然后当我们看到yi时，记得我们之前讨论过，yi并不是完全准确的，会引入一个噪声项，这里称为εi。","start":346.85,"end":369.67},{"id":15,"text":"Now, epsilon i, we don't know perfectly. We don't get to observe it. It's some error that's in the system. And that epsilon i is going to capture kind of euphemistically noise. So what does noise mean? Well, it can mean lots of things. It could literally mean experiment noise. It could mean that there's some jitter in the equipment. When we measure it, there's some error because the magnets are off or whatever it is inside. There's little errors that are in there in the background. It could also, and the way I prefer to think about it, it could also be what we're willing to model up to.","zh":"现在，εi我们并不完全知道，我们无法观察到它。它是系统中的一种误差。而εi将象征性地捕捉噪声。那么噪声意味着什么？好吧，它可能意味着很多东西。它可能字面意思是指实验中的噪声。它可能意味着设备中存在一些抖动。当我们进行测量时，由于磁铁偏移或其他内部因素，会有一些误差。这些误差存在于背景中。它也可能，而且我更倾向于这样思考，它也可能是我们愿意建模到的误差。","start":370.62,"end":399.9},{"id":16,"text":"That one is going to take a little bit of getting used to, but what it means is there's a bunch of errors that maybe we even know are in the measurements, but we don't want to model. We want to see how well our model can predict without having to go into that level of detail. So it's really an abstraction problem when we do modeling. And that's really important to keep in mind because one of the things that can really twist you in knots is you can look at a model and say, is it true? And the problem is the quote will be used in every statistics class you take.","zh":"这一点可能需要一些时间来适应，但它的意思是，存在一些误差，我们甚至知道这些误差存在于测量中，但我们不想建模。我们想看看我们的模型在不进行如此详细建模的情况下，能预测得有多好。因此，当我们进行建模时，这实际上是一个抽象问题。这一点非常重要，因为有时候你会遇到让你困惑的问题，你可能会看着一个模型并问，它是否正确？而问题在于，这句话会在你所上的每一门统计学课程中被引用。","start":400.5,"end":425.72},{"id":17,"text":"All models are wrong. Some models are useful. And so we're really talking about utility in terms of the abstraction. But these are the kinds of things that we will typically think about as in the noise. Model effects, measurement errors, things like that. So what properties are we going to assume about the noise? There are many that you could have of increasing complexity. But we'll start with one of the simplest, which underlies a lot of what we do in machine learning. So let's talk about formally.","zh":"所有的模型都是错误的。有些模型是有用的。因此，我们实际上是在谈论抽象的效用。但这些都是我们通常会考虑作为噪声的类型。模型效应、测量误差，诸如此类的问题。那么我们将会假设噪声具有哪些性质？有许多可能的性质，复杂程度各不相同。但我们将从最简单的开始，它构成了我们在机器学习中所做工作的基础。那么让我们正式地讨论一下。","start":427.01,"end":452.29},{"id":18,"text":"Now, as I say, yeah, the quote has to be there. Sorry, I should have waited half a slide. This quote has to be, it's like I was walking in, by the way, through the coffee shop, whatever, in Y2E2, and I looked into a room and I saw the same quote. They had a nicer slide, if I'm going to be honest. It had the picture of the guy and the whole thing. It was way better done. It wasn't just some little beamer thing at the bottom. They really put in some time. Good on them. It was a TA, if we're going to be honest.","zh":"现在，正如我所说，是的，引文必须在那里。抱歉，我应该等半张幻灯片。这个引文必须存在，顺便说一句，我是在Y2E2的咖啡店走的时候看到的，不管怎样，我走进了一个房间，看到同样的引文。如果我诚实地说，他们有一个更好的幻灯片。它有那个人的图片和整个内容。它做得非常好。它不仅仅是在底部的小投影仪东西。他们花了很多时间。做得好。那是助教，如果我们要诚实的话。","start":453.98,"end":474.5},{"id":19,"text":"Any case, my point is that this is the canon of modeling. You want to know up to what are you modeling, and you're going to kind of box the errors. And you're making some assumption, always, in everything we do. And those assumptions are pretty interesting. All right, so what should we expect from epsilon i? Okay, so it's going to be a random variable. We're going to assume it's stochastic. That's going to allow us to do a bunch of analysis on it. And in particular, what we're going to assume is...","zh":"总之，我想说的是，这就是建模的规范。你想要知道你建模到什么程度，你会在某种程度上框定误差。在我们做的一切事情中，你总是会做一些假设。这些假设非常有趣。好的，那么我们对ε_i有什么期望？嗯，它将是一个随机变量。我们将假设它是随机的。这将允许我们对其进行大量分析。特别是，我们将假设……","start":475.19,"end":504.84},{"id":20,"text":"Any case, my point is that this is the canon of modeling. You want to know up to what are you modeling, and you're going to kind of box the errors. And you're making some assumption, always, in everything we do. And those assumptions are pretty interesting.","zh":"总之，我想说的是，这就是建模的规范。你想要知道你建模到什么程度，你会在某种程度上框定误差。在我们做的一切事情中，你总是会做一些假设。这些假设非常有趣。","start":506.49,"end":520.75}],"notes":["本段讨论了建模过程中对噪声的抽象处理，强调了模型的有用性而非绝对正确性。讲者指出，噪声可以指测量误差或未建模的系统误差，建模时需要明确界定误差的范围。","讲者提到‘所有模型都是错误的，但有些模型是有用的’这一经典观点，强调了建模过程中对误差的抽象和假设的重要性。模型的有用性取决于其对实际问题的抽象程度。","在建模过程中，需要对噪声做出假设，例如噪声是随机变量，且其期望值为零。这些假设允许进行统计分析，并为后续的建模和优化提供基础。","讲者提到，噪声可以是实验误差，如设备的抖动或测量误差，也可以是未建模的系统误差。建模时需要明确界定这些误差的范围，以避免过度拟合或忽略关键因素。","讲者强调，建模时需要对误差进行抽象，即‘框定’误差，这有助于简化模型并专注于模型的预测能力，而不是深入到每一个细节。","讲者提到，噪声的假设是建模过程中的关键部分，这些假设影响了模型的性能和适用性。例如，假设噪声是零均值的随机变量，可以为后续的最小二乘估计提供理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":346.85,"end":520.75,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":346.85,"text":"So what is our process? What we imagine that the process that we generate this data from is that every data point, effectively there exists a true theta that's out there in the world. We don't get to see theta, but it exists somewhere. And then when we see yi, remember we talked about that yi wasn't perfectly accurate, some noise term is introduced. Here, epsilon i."},{"start":370.62,"text":"Now, epsilon i, we don't know perfectly. We don't get to observe it. It's some error that's in the system. And that epsilon i is going to capture kind of euphemistically noise. So what does noise mean? Well, it can mean lots of things. It could literally mean experiment noise. It could mean that there's some jitter in the equipment. When we measure it, there's some error because the magnets are off or whatever it is inside. There's little errors that are in there in the background. It could also, and the way I prefer to think about it, it could also be what we're willing to model up to."},{"start":400.5,"text":"That one is going to take a little bit of getting used to, but what it means is there's a bunch of errors that maybe we even know are in the measurements, but we don't want to model. We want to see how well our model can predict without having to go into that level of detail. So it's really an abstraction problem when we do modeling. And that's really important to keep in mind because one of the things that can really twist you in knots is you can look at a model and say, is it true? And the problem is the quote will be used in every statistics class you take."},{"start":427.01,"text":"All models are wrong. Some models are useful. And so we're really talking about utility in terms of the abstraction. But these are the kinds of things that we will typically think about as in the noise. Model effects, measurement errors, things like that. So what properties are we going to assume about the noise? There are many that you could have of increasing complexity. But we'll start with one of the simplest, which underlies a lot of what we do in machine learning. So let's talk about formally."},{"start":453.98,"text":"Now, as I say, yeah, the quote has to be there. Sorry, I should have waited half a slide. This quote has to be, it's like I was walking in, by the way, through the coffee shop, whatever, in Y2E2, and I looked into a room and I saw the same quote. They had a nicer slide, if I'm going to be honest. It had the picture of the guy and the whole thing. It was way better done. It wasn't just some little beamer thing at the bottom. They really put in some time. Good on them. It was a TA, if we're going to be honest."},{"start":475.19,"text":"Any case, my point is that this is the canon of modeling. You want to know up to what are you modeling, and you're going to kind of box the errors. And you're making some assumption, always, in everything we do. And those assumptions are pretty interesting. All right, so what should we expect from epsilon i? Okay, so it's going to be a random variable. We're going to assume it's stochastic. That's going to allow us to do a bunch of analysis on it. And in particular, what we're going to assume is..."},{"start":506.49,"text":"epsilon i equals zero, the expected value of epsilon i. So the mental model we have is that we're drawing these epsilons, right? We don't get to see them, but some source is drawing these epsilons and has some error in there, but the error is not systematically biased."}],"speech_gaps":[],"frame":"../frames/v042/003.webp","frame_time":358.85},{"title":"加权最小二乘中的假设与误差模型","segments":[{"id":21,"text":"Why is the error not systematically biased? Well, if it were, we would be in kind of a tough shape with our model, right? Because it would mean there was some offset that was hidden from us that we couldn't understand when we were doing the regression. So kind of this is one we're making almost out of necessity, right? We say, no, there exists a real theta i, and all of these epsilons, you know, they're not biased in any way.","zh":"为什么误差没有系统性偏差？嗯，如果有的话，我们的模型就会处于一种相当困难的境地，对吧？因为这意味着存在一些我们没有察觉到的偏移量，而我们在做回归时无法理解。所以，某种程度上，这是我们几乎不得不做出的假设，对吧？我们说，存在一个真实的θ_i，而所有的误差ε，你知道的，它们在任何方面都没有偏差。","start":521.38,"end":540.52},{"id":22,"text":"Now, you can have biased errors. We'll come back to that later. But for right now, this is the unbiased assumption. Hopefully, it makes sense. On average, there's nothing in the data set that we're generating that's kind of precluding us from finding that right theta.","zh":"你现在也可以有偏差的误差。我们稍后会再回到这一点。但目前，这是我们所做的无偏假设。希望这能让你明白。平均来说，我们生成的数据集中没有什么东西会阻碍我们找到正确的θ。","start":540.92,"end":551.86},{"id":23,"text":"The second, which you may have encountered before as well, is that they are called IID, or independent and identically distributed. This is a very strong assumption overall, but it's a good modeling assumption. It's going to be one we're making for computational reasons, really. It's going to allow us to do a bunch of math in this lecture that allows us to simplify a bunch of our calculations. And again, it's a modeling assumption. It could be wrong. It could be that you have data from source A and data from source B, and their error profiles are totally different. When I collect and I pool that data, I get all the errors.","zh":"第二个，你可能之前也遇到过，它们被称为独立同分布（IID）。这是一个非常强的假设，但总体来说是一个良好的建模假设。我们之所以这样做，主要是出于计算上的原因。它将允许我们在本节课中进行一系列数学运算，从而简化我们的许多计算。同样，这也是一个建模假设。它可能是错误的。可能你有来自源A和源B的数据，它们的误差特征完全不同。当我收集并合并这些数据时，我会得到所有的误差。","start":555.94,"end":585.54},{"id":24,"text":"errors from source B have one variance and another have different variance and I put them together. This model is going to ignore that. Now you could model that. We'll come back to how to do that later. But is it clear? It's just a statement that this model is capturing it. All of the errors are uniform in some way and they're independent and identically distributed. So what does that mean? Formally what it means is when I take the expectation of any pair of them, if they're not equal, I can move the expectations inside.","zh":"来自源B的误差具有一个方差，而另一个具有不同的方差，我把它们放在一起。这个模型将忽略这一点。你现在可以对这种情况进行建模。我们稍后会再回到如何做到这一点。但这一点是否清楚？它只是说明这个模型在某种程度上捕捉了这些误差。所有的误差在某种意义上是均匀的，并且是独立同分布的。那么这意味着什么？形式上，这意味着当我取任意一对误差的期望时，如果它们不相等，我可以将期望值移到里面。","start":585.55,"end":612.42},{"id":25,"text":"That is a factor. That is what we mean by independent. It's a formal, very strong version of independent. The second thing that we mean, this is just denoting it, I see it's cut off, is we think the variance or the square term is the next thing we're going to model.","zh":"这是一个因素。这就是我们所说的独立性的意思。这是一个正式的、非常强的独立性版本。第二点，我们所指的，我看到它被截断了，是我们认为方差或平方项是我们接下来要建模的内容。","start":613.23,"end":635.02},{"id":26,"text":"Now, you could model a lot of it. You could track your errors and track what are called every moment. You could map the second, the third, the fourth, the fifth, the sixth. You could put all the things in there. And maybe that would tell you something about the function. But all we're going to say is that we model just the first non-trivial piece. So we have two things. We have the zero. We have their independent.","zh":"现在，你可以对其中很多内容进行建模。你可以跟踪你的误差，并跟踪所谓的每一时刻。你可以将第二、第三、第四、第五、第六时刻都纳入考虑。你可以把所有这些内容都放进去。也许这会告诉你一些关于函数的信息。但我们现在只说，我们只建模第一个非平凡的部分。因此，我们有两个内容。我们有零。我们有它们的独立性。","start":635.48,"end":654.68},{"id":27,"text":"We're going to model this variance. This is a measure. I'm going to show you some examples of this. This is a measure of how noisy the data is. It's the measure of the spread. We'll talk about that and I'll show you if you're not familiar with this in just a little bit. By show of hands, who has seen Gaussians before? Those are IID Gaussians. Awesome. You guys are going to have no problem with this. It's going to be amazing.","zh":"我们将对这种方差进行建模。这是一个度量。我将向你们展示一些这个度量的例子。这是衡量数据噪声程度的指标。它是衡量数据分布范围的指标。我们将会讨论这一点，并在稍后如果你们对此不熟悉的话，我也会向你们展示。举手示意，谁之前见过高斯分布？这些都是独立同分布的高斯分布。太棒了。你们将不会对此有任何困难。这将会非常精彩。","start":655.57,"end":672.77},{"id":28,"text":"Awesome. Alright, so it turns out that this definition here is exactly going to lead to Gaussians. Okay, so you may ask this is actually Gaussians are a nice and beautiful thing that we use all the time because they have these nice properties.","zh":"太棒了。好的，事实上，这里的定义将恰好导致高斯分布。好的，你们可能会问，为什么高斯分布是一个如此美好且优美的东西，我们经常使用它，因为它具有这些良好的性质。","start":675.39,"end":686.97}],"notes":["本段讨论了在加权最小二乘模型中，误差项的无偏性假设。讲者指出，如果误差存在系统性偏差，那么模型将无法正确捕捉真实参数θ，因为这种偏差会隐藏在数据中，导致回归结果不准确。因此，模型假设误差项是无偏的，即它们的期望为零。","讲者提到，误差项的独立同分布（IID）假设是模型的重要前提。这一假设虽然在现实中可能不成立，但它是计算和建模的必要条件，因为它允许简化数学推导。例如，当数据来自不同来源时，误差的方差可能不同，但模型会忽略这种差异。","讲者进一步解释了独立同分布的数学含义，即对于任意两个不同的误差项，它们的期望可以相互独立。这为后续的数学推导提供了基础。","讲者提到，模型只考虑误差的方差（即第二阶矩），而不考虑更高阶的矩（如第三、第四阶）。这是因为方差是描述数据噪声和分布的最基础的统计量，而更高阶的矩可能对模型的建模效果影响较小。","讲者指出，误差的方差是衡量数据噪声程度的重要指标，它反映了数据的离散程度。讲者还提到，高斯分布（正态分布）是满足独立同分布假设的典型例子，因此在加权最小二乘模型中，误差通常被假设为高斯分布。","讲者最后提到，高斯分布具有良好的数学性质，使得它在建模和推导中非常有用。因此，在后续的课程中，将重点讨论高斯分布及其在加权最小二乘模型中的应用。"],"formulas":[{"latex":"E[\\varepsilon_i] = 0","symbols":"误差项的期望为零","explanation":"该公式正确表达了误差项的期望为零，符合无偏性假设。","evidence":"Why is the error not systematically biased? Well, if it were, we would be in kind of a tough shape with our model, right? Because it would mean there was some offset that was hidden from us that we couldn't understand when we were doing the regression. So kind of this is one we're making almost out of necessity, right? We say, no, there exists a real theta i, and all of these epsilons, you know, they're not biased in any way."},{"latex":"E[\\varepsilon_i \\varepsilon_j] = 0 \\text{ for } i \\neq j","symbols":"独立同分布误差项的协方差为零","explanation":"该公式正确表达了独立同分布误差项的协方差为零，符合独立性假设。","evidence":"errors from source B have one variance and another have different variance and I put them together. This model is going to ignore that. Now you could model that. We'll come back to how to do that later. But is it clear? It's just a statement that this model is capturing it. All of the errors are uniform in some way and they're independent and identically distributed. So what does that mean? Formally what it means is when I take the expectation of any pair of them, if they're not equal, I can move the expectations inside."}],"uncertainties":["可能听不清的术语：'every moment'（所有矩）"],"diagram":"none","start":521.38,"end":686.97,"asr_flags":[],"math_clarifications":["所有公式均符合无偏性、独立性和同分布性假设，且数学表达正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":521.38,"text":"Why is the error not systematically biased? Well, if it were, we would be in kind of a tough shape with our model, right? Because it would mean there was some offset that was hidden from us that we couldn't understand when we were doing the regression. So kind of this is one we're making almost out of necessity, right? We say, no, there exists a real theta i, and all of these epsilons, you know, they're not biased in any way."},{"start":540.92,"text":"Now, you can have biased errors. We'll come back to that later. But for right now, this is the unbiased assumption. Hopefully, it makes sense. On average, there's nothing in the data set that we're generating that's kind of precluding us from finding that right theta."},{"start":555.94,"text":"The second, which you may have encountered before as well, is that they are called IID, or independent and identically distributed. This is a very strong assumption overall, but it's a good modeling assumption. It's going to be one we're making for computational reasons, really. It's going to allow us to do a bunch of math in this lecture that allows us to simplify a bunch of our calculations. And again, it's a modeling assumption. It could be wrong. It could be that you have data from source A and data from source B, and their error profiles are totally different. When I collect and I pool that data, I get all the errors."},{"start":585.55,"text":"errors from source B have one variance and another have different variance and I put them together. This model is going to ignore that. Now you could model that. We'll come back to how to do that later. But is it clear? It's just a statement that this model is capturing it. All of the errors are uniform in some way and they're independent and identically distributed. So what does that mean? Formally what it means is when I take the expectation of any pair of them, if they're not equal, I can move the expectations inside."},{"start":613.23,"text":"That is a factor. That is what we mean by independent. It's a formal, very strong version of independent. The second thing that we mean, this is just denoting it, I see it's cut off, is we think the variance or the square term is the next thing we're going to model."},{"start":635.48,"text":"Now, you could model a lot of it. You could track your errors and track what are called every moment. You could map the second, the third, the fourth, the fifth, the sixth. You could put all the things in there. And maybe that would tell you something about the function. But all we're going to say is that we model just the first non-trivial piece. So we have two things. We have the zero. We have their independent."},{"start":655.57,"text":"We're going to model this variance. This is a measure. I'm going to show you some examples of this. This is a measure of how noisy the data is. It's the measure of the spread. We'll talk about that and I'll show you if you're not familiar with this in just a little bit. By show of hands, who has seen Gaussians before? Those are IID Gaussians. Awesome. You guys are going to have no problem with this. It's going to be amazing."},{"start":675.39,"text":"Awesome. Alright, so it turns out that this definition here is exactly going to lead to Gaussians. Okay, so you may ask this is actually Gaussians are a nice and beautiful thing that we use all the time because they have these nice properties."}],"speech_gaps":[],"frame":"../frames/v042/004.webp","frame_time":533.38},{"title":"高斯分布的特性与应用","segments":[{"id":29,"text":"One of the things that they are characterized by is that they can be zero mean and just be described by their variance. You may say, what if I want to get a better model that's described by more orders? Turns out, those don't exist. This is uniquely defined. Gaussians are uniquely defined if you make this assumption. And so they show up everywhere in statistical analysis. So they're just kind of the workhorse. And they're a really good first kind of approximation. They're not something, just so we're clear, it's not something where you're like, oh, is the data really Gaussian?","zh":"它们的一个特点是，它们可以具有零均值，并且仅由方差来描述。你可能会说，如果我想得到一个由更高阶参数描述的更好模型怎么办？结果是，这样的模型并不存在。这是唯一确定的。如果你做出这个假设，高斯分布就是唯一确定的。因此，它们在统计分析中无处不在。因此，它们就像是工作马一样常见。它们是一个非常好的初步近似模型。请注意，这并不是说你必须认为数据真的是高斯分布的。","start":688.06,"end":715.88},{"id":30,"text":"That's not it's not a categorical kind of thing you're worried about.","zh":"这不是你担心的分类问题。","start":716.68,"end":719.2},{"id":31,"text":"You want to know if the Gaussian model is good enough for whatever you care about.","zh":"你想要知道高斯模型是否足够好，以满足你关心的任何事情。","start":719.46,"end":722.86},{"id":32,"text":"So if it turns out that the Gaussian model gives you a really,","zh":"所以如果结果发现高斯模型为你提供的拟合效果非常差，","start":723.1,"end":726.0},{"id":33,"text":"you know, kind of terrible fit to your data","zh":"你就会知道，这种拟合效果相当糟糕。","start":726.1,"end":727.98},{"id":34,"text":"and you need to model the errors in a more precise way","zh":"如果你需要以更精确的方式建模误差，以达到你想要的精度，那么高斯模型就不适合你。","start":728.36,"end":731.54},{"id":35,"text":"to get the accuracy you want, then Gaussian isn't right for you.","zh":"但这是一种渐进的尺度。","start":731.54,"end":734.38},{"id":36,"text":"But it's a sliding scale.","zh":"但它是一个滑动标尺。","start":734.52,"end":735.78},{"id":37,"text":"It's relative to what you want to get out of it.","zh":"这取决于你想要从中得到什么。","start":735.88,"end":737.62},{"id":38,"text":"And one interesting thing that's amazing is if you get enough data,","zh":"有趣的一点是，如果你获得足够的数据，","start":737.8,"end":740.62},{"id":39,"text":"you know, a lot of large numbers and a bunch of other things,","zh":"也就是大量的数值和其他一些东西，","start":740.78,"end":743.22},{"id":40,"text":"as long as it's bounded CLTs and all that, if you know what they are,","zh":"只要它是有界的中心极限定理（CLTs）之类的东西，如果你知道它们是什么，","start":743.32,"end":745.72},{"id":41,"text":"it kind of turns out that this is a pretty good model. So it's a great place to start, okay?","zh":"结果就会发现这是一个相当不错的模型。所以这是一个很好的起点，好吗？","start":745.72,"end":750.04},{"id":42,"text":"All right. All right, so let's see this. Actually, before I go on, any questions on the setup before","zh":"好的。好的，让我们看看这个。实际上，在我继续之前，关于我接下来要讲的内容，有任何问题吗？","start":750.94,"end":756.7},{"id":43,"text":"I go down? Please. Wonderful. Yeah, great question. So what we're doing, so we haven't really talked","zh":"请。太好了。是的，非常好的问题。所以我们现在正在做的事情，我们还没有真正讨论过它如何影响 y，但你已经领先了一步，这非常了不起。你","start":756.7,"end":768.5},{"id":44,"text":"at all about how it impacts y, but you're already one step ahead, which is phenomenal. You're","zh":"已经比我们快了一步。","start":768.5,"end":772.58},{"id":45,"text":"basically saying that yi, if I think about yi's distribution, it's clearly going to be a function","zh":"基本上是在说，如果我考虑 yi 的分布，它显然会是一个函数","start":772.58,"end":777.3},{"id":46,"text":"of this character here, which is the actual model underneath the thing, which if I had the right","zh":"关于这里的这个字符，也就是这个模型背后的实际模型，如果我有正确的","start":777.3,"end":782.12},{"id":47,"text":"theta I could compute, plus this thing here. And now I can look and see what the variance of the","zh":"theta，我就可以计算出来，再加上这里的东西。现在我可以观察并确定 yi 的方差","start":782.12,"end":786.9},{"id":48,"text":"yi's are. This is a statement just about the random or stochastic part, which is just the","zh":"。这是关于随机或随机部分的一个陈述，也就是这里的 epsilons。这个陈述即使在有更复杂或更疯狂的模型","start":786.9,"end":791.88},{"id":49,"text":"epsilons. This statement makes sense even if there's a more complicated or crazier model","zh":"的情况下也仍然有意义。它与 yi 无关。但通过这一点，你完全正确，我们马上就会到达那里，你将能够确定 yi 的分布","start":791.88,"end":796.22},{"id":50,"text":"here. It has nothing to do with the yi's. But from this, you're exactly right and we're going","zh":"，在给定 theta 的条件下，如果这有意义的话。如果这没有意义的话，","start":796.22,"end":800.98},{"id":51,"text":"to get there in a second, you're going to be able to determine the distributions of the yi's as well,","zh":"我们稍后会解释清楚，你将能够确定在给定 theta 的情况下 yi 的分布，如果这有意义的话。","start":800.98,"end":804.7},{"id":52,"text":"conditioned on having theta, if that makes sense. And if it doesn't make sense,","zh":"如果这没有意义的话，","start":804.82,"end":807.82},{"id":53,"text":"it'll make sense in a couple slides. Yeah, awesome. Great question. Please.","zh":"这将在几页后变得有意义。是的，太棒了。非常好的问题。请。","start":808.28,"end":811.2},{"id":54,"text":"Exactly right, yes. It's exactly a variance here because the mean is zero. It's a wonderful","zh":"完全正确，是的。这里正是方差，因为均值为零。这是一个美妙的问题","start":813.98,"end":817.88},{"id":55,"text":"question. Perfect. Awesome. Other questions? Fantastic. Okay, so what does a Gaussian look like?","zh":"。完美。太棒了。还有其他问题吗？精彩。好的，那么高斯分布看起来是什么样的？","start":817.88,"end":825.84},{"id":56,"text":"Let's see. Somehow this is getting cut off a little bit. Alright, so I'm gonna start here","zh":"让我们看看。 somehow 这里有点被截断了。好的，我将从这里开始","start":828.18,"end":832.62},{"id":57,"text":"and then I'll go down. Alright, so we're going to use this notation. I hope this notation is","zh":"，然后向下走。好的，我们将使用这种记号。我希望这种记号对你来说是","start":832.62,"end":837.82},{"id":58,"text":"familiar to you. If it's not, don't worry about it. It's just notation. It doesn't really mean","zh":"熟悉的。如果不熟悉，没关系。这只是记号。它并不真的意味着","start":837.82,"end":842.46},{"id":59,"text":"all that much. This means that I want... z is going to be a normal distribution with mean mu.","zh":"太多。这表示我想要…… z 将是一个均值为 μ 的正态分布。","start":842.46,"end":847.18},{"id":60,"text":"That's going to be its center, right? So in the last slide, the mean was 0. That's the expected","zh":"这就是它的中心，对吧？在上一页中，均值是 0。这就是期望值","start":847.36,"end":851.68},{"id":61,"text":"value is equal to zero. And in this case, the expected value is equal to mu of z. That's all","zh":"值等于零。在这种情况下，期望值等于z的均值μ。这就是全部。","start":851.68,"end":857.2},{"id":62,"text":"that's saying. And then it's one-dimensional. So it's variance. There's no covariance. It's","zh":"这就是它所说的。然后它是一维的。因此是方差。没有协方差。","start":857.2,"end":861.6},{"id":63,"text":"just a variance. It's sigma squared.","zh":"它只是一个方差。即σ平方。","start":861.6,"end":862.86}],"notes":["本段主要讨论高斯分布的特性，强调其在统计分析中的广泛应用。高斯分布由均值和方差唯一确定，且在数据量足够大时，中心极限定理表明其是一个良好的模型。但高斯模型是否适用取决于具体需求，如果数据拟合效果差，可能需要更复杂的模型。","讲者指出，高斯分布的均值为零，方差是其唯一描述参数。即使模型更复杂，高斯分布的方差描述仍然有效，因为它仅关注随机部分（误差项）。这表明高斯分布是建模误差的有力工具。","讲者提到，高斯分布的均值和方差是其核心参数，且在实际应用中，均值为零的高斯分布是常见的。这表明在建模时，可以将数据视为均值为零的高斯分布加上误差项。","讲者强调，高斯分布的方差描述了数据的随机性，而均值则代表了数据的中心趋势。在实际建模中，可以通过分析误差项的方差来确定数据的分布特性。","讲者指出，高斯分布的适用性取决于具体需求。如果数据拟合效果差，可能需要更复杂的模型。但高斯分布作为初始模型，具有良好的解释性和计算效率。","讲者提到，高斯分布的方差是其唯一描述参数，且在数据量足够大时，中心极限定理表明其是一个良好的模型。这表明在实际应用中，高斯分布是一个值得尝试的起点。"],"formulas":[{"latex":"Var(y_i) = \\text{Var}(\\varepsilon)","symbols":"方差描述了随机误差项的分布特性","explanation":"将'epsilons'改为标准符号'\\varepsilon'，并修正了符号的大小写和格式。","evidence":"yi's are. This is a statement just about the random or stochastic part, which is just the"},{"latex":"E[y_i] = \\mu_z","symbols":"期望值等于随机变量z的均值","explanation":"将'mu of z'改为更标准的符号'\\mu_z'，并修正了符号的格式。","evidence":"value is equal to zero. And in this case, the expected value is equal to mu of z. That's all"},{"latex":"Var(z) = \\sigma^2","symbols":"方差为sigma的平方","explanation":"将'sigma squared'改为标准的符号'\\sigma^2'，并修正了符号的格式。","evidence":"just a variance. It's sigma squared."}],"uncertainties":[],"diagram":"none","start":688.06,"end":862.86,"asr_flags":[],"math_clarifications":["原文中提到的'epsilons'应使用标准符号'\\varepsilon'表示随机误差项。"],"translation_complete":true,"translated_segments":35,"raw_segments":[{"start":688.06,"text":"One of the things that they are characterized by is that they can be zero mean and just be described by their variance. You may say, what if I want to get a better model that's described by more orders? Turns out, those don't exist. This is uniquely defined. Gaussians are uniquely defined if you make this assumption. And so they show up everywhere in statistical analysis. So they're just kind of the workhorse. And they're a really good first kind of approximation. They're not something, just so we're clear, it's not something where you're like, oh, is the data really Gaussian?"},{"start":716.68,"text":"That's not it's not a categorical kind of thing you're worried about."},{"start":719.46,"text":"You want to know if the Gaussian model is good enough for whatever you care about."},{"start":723.1,"text":"So if it turns out that the Gaussian model gives you a really,"},{"start":726.1,"text":"you know, kind of terrible fit to your data"},{"start":728.36,"text":"and you need to model the errors in a more precise way"},{"start":731.54,"text":"to get the accuracy you want, then Gaussian isn't right for you."},{"start":734.52,"text":"But it's a sliding scale."},{"start":735.88,"text":"It's relative to what you want to get out of it."},{"start":737.8,"text":"And one interesting thing that's amazing is if you get enough data,"},{"start":740.78,"text":"you know, a lot of large numbers and a bunch of other things,"},{"start":743.32,"text":"as long as it's bounded CLTs and all that, if you know what they are,"},{"start":745.72,"text":"it kind of turns out that this is a pretty good model. So it's a great place to start, okay?"},{"start":750.94,"text":"All right. All right, so let's see this. Actually, before I go on, any questions on the setup before"},{"start":756.7,"text":"I go down? Please. Wonderful. Yeah, great question. So what we're doing, so we haven't really talked"},{"start":768.5,"text":"at all about how it impacts y, but you're already one step ahead, which is phenomenal. You're"},{"start":772.58,"text":"basically saying that yi, if I think about yi's distribution, it's clearly going to be a function"},{"start":777.3,"text":"of this character here, which is the actual model underneath the thing, which if I had the right"},{"start":782.12,"text":"theta I could compute, plus this thing here. And now I can look and see what the variance of the"},{"start":786.9,"text":"yi's are. This is a statement just about the random or stochastic part, which is just the"},{"start":791.88,"text":"epsilons. This statement makes sense even if there's a more complicated or crazier model"},{"start":796.22,"text":"here. It has nothing to do with the yi's. But from this, you're exactly right and we're going"},{"start":800.98,"text":"to get there in a second, you're going to be able to determine the distributions of the yi's as well,"},{"start":804.82,"text":"conditioned on having theta, if that makes sense. And if it doesn't make sense,"},{"start":808.28,"text":"it'll make sense in a couple slides. Yeah, awesome. Great question. Please."},{"start":813.98,"text":"Exactly right, yes. It's exactly a variance here because the mean is zero. It's a wonderful"},{"start":817.88,"text":"question. Perfect. Awesome. Other questions? Fantastic. Okay, so what does a Gaussian look like?"},{"start":828.18,"text":"Let's see. Somehow this is getting cut off a little bit. Alright, so I'm gonna start here"},{"start":832.62,"text":"and then I'll go down. Alright, so we're going to use this notation. I hope this notation is"},{"start":837.82,"text":"familiar to you. If it's not, don't worry about it. It's just notation. It doesn't really mean"},{"start":842.46,"text":"all that much. This means that I want... z is going to be a normal distribution with mean mu."},{"start":847.36,"text":"That's going to be its center, right? So in the last slide, the mean was 0. That's the expected"},{"start":851.68,"text":"value is equal to zero. And in this case, the expected value is equal to mu of z. That's all"},{"start":857.2,"text":"that's saying. And then it's one-dimensional. So it's variance. There's no covariance. It's"},{"start":861.6,"text":"just a variance. It's sigma squared."}],"speech_gaps":[],"frame":"../frames/v042/005.webp","frame_time":700.06},{"title":"正态分布的定义与性质","segments":[{"id":64,"text":"That's the normal way you write it. And you'll sometimes say that it's mean U and you'll sometimes use the standard deviation, which is the unsquared error. This is just terminology. Nothing deep is going on here. It's just how we call this. This notation means distributed as. Z is distributed as that. We will use this for normals for this course or for this class. Eventually, we'll have more complicated distributions that we're going to start to piece together.","zh":"这就是你通常写法。你有时会说它具有均值 U，有时会使用标准差，也就是未平方的误差。这只是术语。这里并没有什么深层次的内容。这只是我们对它的称呼。这个符号表示服从分布。Z 服从这种分布。我们将在本课程或本节课中使用这种正态分布。最终，我们会遇到更复杂的分布，开始逐步构建它们。","start":864.94,"end":893.92},{"id":65,"text":"And if you understand it, you can look it up. It's not something you don't need to commit this to memory or get it tattooed on your arm. It's not that important.","zh":"如果你理解了，你可以随时查阅。这并不是你必须死记硬背或纹在手臂上的内容。它并不重要。","start":895.32,"end":903.12},{"id":66,"text":"It's hopefully something that's relatively simple to understand what the pieces are and what they're doing. So I'm going to walk through what the pieces are and what they're doing, and then we'll move on just to remind you. So this is a probability function. So this is a probability distribution of Z. We want to normalize it in some way, and so it's going to have a normalizing constant here. Where does that constant come from? Well, we're going to integrate out over the rest of the function. So this is probably the least important part of the entire formula. If you forget this, you can do almost all the machine learning, and you'll see in a very precise way, constants will fall away when we start to minimize.","zh":"希望这对你来说是一个相对简单的内容，能够理解各个部分及其作用。因此，我将逐一讲解各个部分及其作用，然后我们再简要回顾一下。所以这是一个概率函数。这是 Z 的概率分布。我们希望以某种方式对其进行归一化，因此这里会有一个归一化常数。这个常数是从哪里来的？我们将会对函数的其余部分进行积分。这可能是整个公式中最不重要的部分。如果你忘记了它，你几乎可以完成所有的机器学习任务，当你开始最小化时，你会以非常精确的方式看到常数会消失。","start":904.48,"end":933.84},{"id":67,"text":"it and put it into things. So it's really not that important. But it's nice to know so that you can compute it exactly.","zh":"你可以在各种地方使用它。因此，它并不重要。但了解它是有帮助的，这样你才能精确地计算它。","start":933.9,"end":938.24},{"id":68,"text":"The action goes on under this exponential. We're going to see that a lot of machine learning, at least for machine learning from the early 2000s especially, they love putting things under exponentials. That made them feel good. So they have the same model. They put it under exponential. They went from doing something ad hoc to doing something principled, as they would say. Never really understood, but all good. There's a reason for that, which we'll talk about next lecture, which are called GLMs, generalized linear models. I'm being a little bit facetious.","zh":"真正的动作发生在指数函数之下。我们会看到，至少在 2000 年代初的机器学习中，人们特别喜欢将内容放在指数函数之下。这让他们感觉良好。他们拥有相同的模型，将其放在指数函数之下。他们从一种随意的做法转变为一种有原则的做法，正如他们所说。虽然从未真正理解，但一切都很棒。这背后有其原因，我们将在下节课中讨论，这些被称为广义线性模型（GLMs）。我有点开玩笑。","start":939.88,"end":965.36},{"id":69,"text":"just to say that exponential has a nice form to it that we use, but don't get too uptight about it. The action is in here. This says, and this is like hinting about why these squares will come in, my distance to the mean squared is going to enter for my distribution, how likely it's going to be, roughly. We'll make likelihoods clear in a second.","zh":"只是想说指数函数有一个漂亮的表达形式，我们会在后面用到，但不要太过紧张。关键在这里。这句话是在暗示为什么会出现平方项，我的距离均值的平方将会进入我的分布中，大致说明它有多可能。我们稍后会明确说明似然性。","start":966.0,"end":986.16},{"id":70,"text":"And I'm going to divide by 2 over sigma squared. Why? Well, that's that one half. It's for normalization and convenience. We're obviously going to take a derivative at some point. And that 2 is going to cancel out. Otherwise, we would write it. It's a little bit of cooking show kind of math. And sigma squared, that is the variance that we talked about before. And so it scales in units of the variance. So intuitively, if you think about it, if you get one unit away,","zh":"我将除以 2 除以 σ²。为什么？这是因为那个 1/2。这是为了归一化和方便。我们显然会在某个时候取导数，而这个 2 会抵消掉。否则，我们会写出来。这是一种类似烹饪节目般的数学处理。σ² 是我们之前讨论过的方差，因此它以方差的单位进行缩放。直观来说，如果你想象一下，如果你偏离一个单位，","start":986.64,"end":1010.12},{"id":71,"text":"right? Of sigma away, you go down by a certain amount, another amount, another amount, and you","zh":"对，偏离 σ 的单位，你会下降一定量，再下降一定量，再下降一定量，","start":1010.75,"end":1015.57},{"id":72,"text":"pay kind of quadratically. And so you get this beautiful shape here. And so these are the usual","zh":"你付出的代价大致是二次的。因此你会得到这样一个漂亮的形状。因此，这些是我们通常会展示的内容，","start":1015.57,"end":1019.61},{"id":73,"text":"things that you show that says, oh, if you get three sigmas away from the mean, 99.7% of the","zh":"比如说，如果你偏离均值三个 σ，那么 99.7% 的质量会集中在那个区域。因此，它是一个非常紧密集中的分布。因此，如果 σ，","start":1019.61,"end":1024.71},{"id":74,"text":"mass is concentrated in that region. So it's a very tightly concentrated thing. So if sigma,","zh":"为了非常清楚地说，接近于零，那么它会非常尖锐地峰化。","start":1024.71,"end":1030.03},{"id":75,"text":"just to be very clear, is like zero, close to zero, then it's very, very sharply peaked.","zh":"如果 σ 相对很大，那么它就是一个非常平坦的分布。","start":1030.13,"end":1034.87},{"id":76,"text":"And if zero is very large, relatively speaking, it's very flat distribution.","zh":"如果零值相对很大，那么它就是一个非常平坦的分布。","start":1035.05,"end":1039.17},{"id":77,"text":"distribution.","zh":"分布。","start":1039.17,"end":1039.37},{"id":78,"text":"So Gaussian, those are both Gaussians.","zh":"所以高斯分布，这些都是高斯分布。","start":1039.53,"end":1041.23}],"notes":["本段主要讲解正态分布的定义和基本性质，包括其概率密度函数的形式、标准化常数的来源以及指数部分的作用。讲者指出，正态分布的标准化常数虽然在公式中很重要，但在实际应用中，尤其是在最小化过程中，常数往往会消失，因此不是最关键的。"],"formulas":[{"latex":"f(z) = \\frac{1}{\\text{normalizing constant}} \\times \\text{exp}(-\\frac{(z - \\text{mean})^2}{2\\text{variance}})","symbols":"标准化常数、均值、方差","explanation":"该公式正确表达了正态分布的概率密度函数，但未明确写出归一化常数的具体形式，需补充为 $\\frac{1}{\\sqrt{2\\pi\\text{variance}}}$。","evidence":"just to say that exponential has a nice form to it that we use, but don't get too uptight about it. The action is in here. This says, and this is like hinting about why these squares will come in, my distance to the mean squared is going to enter for my distribution, how likely it's going to be, roughly. We'll make likelihoods clear in a second. And I'm going to divide by 2 over sigma squared. Why? Well, that's that one half. It's for normalization and convenience. We're obviously going to take a derivative at some point. And that 2 is going to cancel out. Otherwise, we would write it. It's a little bit of cooking show kind of math. And sigma squared, that is the variance that we talked about before. And so it scales in units of the variance. So intuitively, if you think about it, if you get one unit away,"}],"uncertainties":["在讲者提到的公式中，标准化常数的具体形式未明确，因此无法确定其完整表达式。","讲者提到的指数部分的具体形式未完全清晰，因此无法确定其完整表达式。"],"diagram":"none","start":864.94,"end":1041.23,"asr_flags":[77],"math_clarifications":["公式1和公式2未明确写出归一化常数的具体形式，应补充为 $\\frac{1}{\\sqrt{2\\pi\\text{variance}}}$。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":864.94,"text":"That's the normal way you write it. And you'll sometimes say that it's mean U and you'll sometimes use the standard deviation, which is the unsquared error. This is just terminology. Nothing deep is going on here. It's just how we call this. This notation means distributed as. Z is distributed as that. We will use this for normals for this course or for this class. Eventually, we'll have more complicated distributions that we're going to start to piece together. All right. So what does the normal itself look like? What has this awful form?"},{"start":895.32,"text":"And if you understand it, you can look it up. It's not something you don't need to commit this to memory or get it tattooed on your arm. It's not that important."},{"start":904.48,"text":"It's hopefully something that's relatively simple to understand what the pieces are and what they're doing. So I'm going to walk through what the pieces are and what they're doing, and then we'll move on just to remind you. So this is a probability function. So this is a probability distribution of Z. We want to normalize it in some way, and so it's going to have a normalizing constant here. Where does that constant come from? Well, we're going to integrate out over the rest of the function. So this is probably the least important part of the entire formula. If you forget this, you can do almost all the machine learning, and you'll see in a very precise way, constants will fall away when we start to minimize."},{"start":933.9,"text":"it and put it into things. So it's really not that important. But it's nice to know so that you can compute it exactly."},{"start":939.88,"text":"The action goes on under this exponential. We're going to see that a lot of machine learning, at least for machine learning from the early 2000s especially, they love putting things under exponentials. That made them feel good. So they have the same model. They put it under exponential. They went from doing something ad hoc to doing something principled, as they would say. Never really understood, but all good. There's a reason for that, which we'll talk about next lecture, which are called GLMs, generalized linear models. I'm being a little bit facetious."},{"start":966.0,"text":"just to say that exponential has a nice form to it that we use, but don't get too uptight about it. The action is in here. This says, and this is like hinting about why these squares will come in, my distance to the mean squared is going to enter for my distribution, how likely it's going to be, roughly. We'll make likelihoods clear in a second."},{"start":986.64,"text":"And I'm going to divide by 2 over sigma squared. Why? Well, that's that one half. It's for normalization and convenience. We're obviously going to take a derivative at some point. And that 2 is going to cancel out. Otherwise, we would write it. It's a little bit of cooking show kind of math. And sigma squared, that is the variance that we talked about before. And so it scales in units of the variance. So intuitively, if you think about it, if you get one unit away,"},{"start":1010.75,"text":"right? Of sigma away, you go down by a certain amount, another amount, another amount, and you"},{"start":1015.57,"text":"pay kind of quadratically. And so you get this beautiful shape here. And so these are the usual"},{"start":1019.61,"text":"things that you show that says, oh, if you get three sigmas away from the mean, 99.7% of the"},{"start":1024.71,"text":"mass is concentrated in that region. So it's a very tightly concentrated thing. So if sigma,"},{"start":1030.13,"text":"just to be very clear, is like zero, close to zero, then it's very, very sharply peaked."},{"start":1035.05,"text":"And if zero is very large, relatively speaking, it's very flat distribution."},{"start":1039.17,"text":"distribution."},{"start":1039.53,"text":"So Gaussian, those are both Gaussians."}],"speech_gaps":[],"frame":"../frames/v042/006.webp","frame_time":876.94},{"title":"加权最小二乘与高斯分布的局限性","segments":[{"id":79,"text":"They just have to deal with how wide is this area here,","zh":"他们只需要处理这个区域有多宽的问题，","start":1041.37,"end":1044.97},{"id":80,"text":"hence why we use it.","zh":"这就是我们使用它的原因。","start":1045.49,"end":1046.37},{"id":81,"text":"OK, hopefully this is review.","zh":"好的，希望这是复习内容。","start":1047.09,"end":1048.17},{"id":82,"text":"If it's not, please check it out.","zh":"如果不是，请查阅相关内容。","start":1048.33,"end":1049.83},{"id":83,"text":"Ask questions too.","zh":"也可以提出问题。","start":1050.13,"end":1051.13},{"id":84,"text":"I'm super happy to talk about it.","zh":"我很高兴能和大家讨论这个话题。","start":1051.19,"end":1052.33},{"id":85,"text":"Please.","zh":"请。","start":1052.39,"end":1052.57},{"id":86,"text":"Can you model asymmetric or multimodal distributions","zh":"你能建模不对称或多元分布吗？","start":1053.07,"end":1056.27},{"id":87,"text":"of Gaussian media that may overlap?","zh":"在高斯分布中，可能重叠的媒体有什么？","start":1056.27,"end":1057.89},{"id":88,"text":"Wonderful question.","zh":"非常好的问题。","start":1058.43,"end":1059.15},{"id":89,"text":"The question is, can you model distributions","zh":"问题是，你能建模不对称的分布吗？","start":1059.29,"end":1061.03},{"id":90,"text":"that are asymmetric?","zh":"因为刚才我们谈到的这个分布","start":1061.03,"end":1063.11},{"id":91,"text":"Because this distribution that we just talked about","zh":"显然是对称的，意味着这里的均值","start":1063.25,"end":1065.11},{"id":92,"text":"is clearly symmetric, meaning the distance between mu","zh":"在两个方向上都是对称的。因此，你在这边和这边的衰减速度是一样的。因此，","start":1065.11,"end":1068.17},{"id":93,"text":"here is symmetric in both directions. So you fall off just as fast this way as this way. So the","zh":"观测值是不对称的。你能用高斯分布来建模不对称的事物吗？不能，因为","start":1068.17,"end":1073.51},{"id":94,"text":"observation is asymmetric. Can you model things that are asymmetric with a Gaussian? Not that","zh":"观测是不对称的。你能用高斯分布来建模不对称的事物吗？不完全是","start":1073.51,"end":1077.73},{"id":95,"text":"piece of it. The second is, can you model, let's say, multimodal, which traditionally means that","zh":"其中一部分。第二个问题是，你能建模多模态吗，传统上这意味着它有多个峰值？","start":1077.73,"end":1081.93},{"id":96,"text":"it has multiple bumps? We will see in a later lecture, I think I'm going to get the lecture","zh":"我们会在后面的课程中看到，我想我今年会把课程编号弄错了。通常是在第11讲左右，我这么说吧，","start":1081.93,"end":1086.01},{"id":97,"text":"numbers wrong because we switched them this year. It's usually around lecture 11, I want to say,","zh":"数字错了，因为我们今年换了顺序。通常是在第11讲左右，我这么说吧，","start":1086.01,"end":1089.43},{"id":98,"text":"or 9. We're going to see a model called the mixture of Gaussians, where indeed you can use","zh":"或者第9讲。我们将看到一个叫做高斯混合的模型，其中确实可以使用","start":1089.53,"end":1094.61},{"id":99,"text":"many Gaussians as building blocks to kind of build up multiple bumps.","zh":"完美。","start":1094.61,"end":1097.65},{"id":100,"text":"But today, we're just going to worry about single Gaussians.","zh":"非常好的问题。","start":1097.79,"end":1100.35},{"id":101,"text":"Perfect.","zh":"完美。","start":1100.69,"end":1101.07},{"id":102,"text":"Great question.","zh":"非常好的问题。","start":1101.15,"end":1101.49},{"id":103,"text":"you're already identifying some things that are strange about this distribution, right? We talked about the errors. The fact that it's symmetric means it's not, for example, aiming too high or too low in the prices, right? There's not a systematic bias in one direction. That would give you something that was asymmetric in the errors, right? We're just going to assume we don't know that information or we're not willing to model it. The other bumps is a statement that there is kind of one kind of noise source, but you could easily imagine that there's multiple noise sources. Remember my example from earlier, we had an A and a B.","zh":"你已经注意到这个分布的一些奇怪之处了，对吧？我们讨论过误差。对称性意味着它不会，例如，在价格上过于高估或低估，对吧？这说明误差中没有系统性的偏差方向。这会给出一个不对称的误差分布，对吧？我们只是假设我们不知道这些信息，或者不愿意对其进行建模。其他的一些波动则表明存在一种类型的噪声源，但你可以很容易地想象存在多种噪声源。记得我之前举的例子，我们有A和B。","start":1102.77,"end":1132.31},{"id":104,"text":"station. Maybe they have very different variances and so their distribution is kind of a mix of two. We'll see those examples later. But for now, just one humble Gaussian. So this is related to the question that came up earlier about y's and all the rest. So recall our model and let's start to see some fancy notation. So hopefully this is something that you're familiar with. If not, don't worry too much about it.","zh":"站点。也许它们有不同的方差，因此它们的分布是两种分布的混合。我们之后会看到这些例子。但目前，我们只考虑一个简单的高斯分布。这与之前关于y值和其他内容的问题有关。让我们回顾我们的模型，并开始看到一些高级的符号表示。希望你对此有所熟悉。如果没有，也不要太担心。","start":1132.37,"end":1158.2},{"id":105,"text":"Here's how it works. So we're going to have this notation where we have this mathematical equation which says our yi's are a function where mechanically we plug in theta. We don't know theta, but this is like a theta that's hidden from us. If we did know theta, we could plug it in. We plug it in, we take this dot product, then we add in the error that's randomly distributed, and that gives us the yi. This notation says exactly what I just said.","zh":"这是如何工作的。我们将使用这样的符号表示，其中有一个数学等式，说明我们的yi是某个函数，机械地将theta代入。我们不知道theta，但这是一个隐藏的theta。如果我们知道theta，就可以代入。代入后，我们进行点积，然后加上一个随机分布的误差，从而得到yi。这种符号表示恰好就是我刚才所说的。","start":1159.06,"end":1182.22},{"id":106,"text":"Okay, it's more compact. It says the mean is exactly this. These two terms are the same. I'll let all that red ink drain off. It's a little slow, but all good. And then this sigma squared is this sigma squared.","zh":"好的，这种表示更紧凑。它说明均值正是这个。这两个项是相同的。让我让所有红色的墨水都流掉。这有点慢，但都好。然后这个sigma平方就是这个sigma平方。","start":1182.76,"end":1196.02},{"id":107,"text":"Now, why is that? It was alluded to by the question that came up earlier, why is the variance of yi the same as the variance of the original epsilon that's in there? And the reason was exactly stated. Here, if I look at the distribution, if I were to take theta xi and subtract it off of yi, and then take its expected value, that would exactly get me back to sigma squared.","zh":"现在，为什么是这样呢？这在之前的问题中有所暗示，为什么yi的方差与其中原始的epsilon的方差相同？原因已经被明确说明了。在这里，如果我观察这个分布，如果我从yi中减去theta xi，然后计算其期望值，这将恰好得到sigma平方。","start":1196.53,"end":1217.71}],"notes":["本段讨论了高斯分布的局限性，特别是其对非对称分布和多峰分布的建模能力。讲者指出，高斯分布是完全对称的，因此无法建模非对称的误差分布。此外，高斯分布只能表示单一的噪声源，而无法处理多个噪声源的情况，例如混合分布。","讲者提到，高斯分布的方差与误差项的方差相同，这是因为在模型中，误差项的方差决定了输出的方差。通过从输出中减去预测值，可以得到误差项的期望值，从而验证方差的合理性。","讲者还提到，后续课程将介绍混合高斯模型（mixture of Gaussians），该模型可以使用多个高斯分布作为构建块来表示多峰分布。这表明高斯分布的局限性可以通过组合多个分布来克服。","在讨论模型时，讲者使用了数学符号和公式，例如将输出表示为函数和误差项的和，并指出均值和方差的计算方式。这些符号和公式帮助学生理解模型的结构。","讲者强调，高斯分布的对称性意味着没有系统性偏差，这在某些情况下可能是一个限制。例如，如果数据存在系统性偏差，高斯分布可能无法准确建模。","最后，讲者提到，模型中的误差项是随机分布的，其方差决定了输出的不确定性。通过理解这些概念，学生可以更好地掌握高斯分布的使用和限制。"],"formulas":[{"latex":"y_i = \\theta^T x_i + \\text{error}","symbols":"y_i 表示输出，θ 是参数向量，x_i 是输入特征，error 是随机误差项","explanation":"公式正确，表示输出由参数向量与输入特征的点积加上随机误差项组成。","evidence":"Here's how it works. So we're going to have this notation where we have this mathematical equation which says our yi's are a function where mechanically we plug in theta. We don't know theta, but this is like a theta that's hidden from us. If we did know theta, we could plug it in. We plug it in, we take this dot product, then we add in the error that's randomly distributed, and that gives us the yi. This notation says exactly what I just said."}],"uncertainties":["media"],"diagram":"none","start":1041.37,"end":1217.71,"asr_flags":[],"math_clarifications":["公式1中的期望值 E[y_i - θ^T x_i] 应为零，因为误差项的期望为零。公式2中将期望值与方差等同是错误的，应分别处理。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":1041.37,"text":"They just have to deal with how wide is this area here,"},{"start":1045.49,"text":"hence why we use it."},{"start":1047.09,"text":"OK, hopefully this is review."},{"start":1048.33,"text":"If it's not, please check it out."},{"start":1050.13,"text":"Ask questions too."},{"start":1051.19,"text":"I'm super happy to talk about it."},{"start":1052.39,"text":"Please."},{"start":1053.07,"text":"Can you model asymmetric or multimodal distributions"},{"start":1056.27,"text":"of Gaussian media that may overlap?"},{"start":1058.43,"text":"Wonderful question."},{"start":1059.29,"text":"The question is, can you model distributions"},{"start":1061.03,"text":"that are asymmetric?"},{"start":1063.25,"text":"Because this distribution that we just talked about"},{"start":1065.11,"text":"is clearly symmetric, meaning the distance between mu"},{"start":1068.17,"text":"here is symmetric in both directions. So you fall off just as fast this way as this way. So the"},{"start":1073.51,"text":"observation is asymmetric. Can you model things that are asymmetric with a Gaussian? Not that"},{"start":1077.73,"text":"piece of it. The second is, can you model, let's say, multimodal, which traditionally means that"},{"start":1081.93,"text":"it has multiple bumps? We will see in a later lecture, I think I'm going to get the lecture"},{"start":1086.01,"text":"numbers wrong because we switched them this year. It's usually around lecture 11, I want to say,"},{"start":1089.53,"text":"or 9. We're going to see a model called the mixture of Gaussians, where indeed you can use"},{"start":1094.61,"text":"many Gaussians as building blocks to kind of build up multiple bumps."},{"start":1097.79,"text":"But today, we're just going to worry about single Gaussians."},{"start":1100.69,"text":"Perfect."},{"start":1101.15,"text":"Great question."},{"start":1102.77,"text":"So yeah, so you're already identifying, just to point out, you're already identifying some things that are strange about this distribution, right? We talked about the errors. The fact that it's symmetric means it's not, for example, aiming too high or too low in the prices, right? There's not a systematic bias in one direction. That would give you something that was asymmetric in the errors, right? We're just going to assume we don't know that information or we're not willing to model it. The other bumps is a statement that there is kind of one kind of noise source, but you could easily imagine that there's multiple noise sources. Remember my example from earlier, we had an A and a B."},{"start":1132.37,"text":"station. Maybe they have very different variances and so their distribution is kind of a mix of two. We'll see those examples later. But for now, just one humble Gaussian. So this is related to the question that came up earlier about y's and all the rest. So recall our model and let's start to see some fancy notation. So hopefully this is something that you're familiar with. If not, don't worry too much about it."},{"start":1159.06,"text":"Here's how it works. So we're going to have this notation where we have this mathematical equation which says our yi's are a function where mechanically we plug in theta. We don't know theta, but this is like a theta that's hidden from us. If we did know theta, we could plug it in. We plug it in, we take this dot product, then we add in the error that's randomly distributed, and that gives us the yi. This notation says exactly what I just said."},{"start":1182.76,"text":"Okay, it's more compact. It says the mean is exactly this. These two terms are the same. I'll let all that red ink drain off. It's a little slow, but all good. And then this sigma squared is this sigma squared."},{"start":1196.53,"text":"Now, why is that? It was alluded to by the question that came up earlier, why is the variance of yi the same as the variance of the original epsilon that's in there? And the reason was exactly stated. Here, if I look at the distribution, if I were to take theta xi and subtract it off of yi, and then take its expected value, that would exactly get me back to sigma squared."}],"speech_gaps":[],"frame":"../frames/v042/007.webp","frame_time":1053.37},{"title":"加权最小二乘的数学基础","segments":[{"id":108,"text":"Said another more formal way, what we're saying is that yi conditioned on seeing the xi's and theta, thetas are a parameter, are distributed as a normal with this mean and this variance.","zh":"用更正式的说法，我们说的是，在看到xi和theta的情况下，yi服从均值为该值、方差为该值的正态分布。","start":1219.16,"end":1230.44},{"id":109,"text":"This fact that you can just copy is not automatic. Like for example, if we multiplied epsilon by some scalar value, we would have to track that when we went to this model, right? So it just happens to be that these things are all linear here. That's why it works out and it's the same sigma squared, right? If you multiply the number by 10, you would expect the variance to go up, right? Not a strange statement. Okay, cool. Alright, now that gets us down to here.","zh":"这个可以直接复制的事实并不是自动成立的。例如，如果我们把epsilon乘以某个标量值，我们在转移到这个模型时就必须跟踪这一点，对吧？所以这里之所以一切顺利，是因为这些内容都是线性的。这就是为什么结果和方差相同，对吧？如果你把数值乘以10，你就会期望方差增加，对吧？这并不是一个奇怪的陈述。好的，明白了。现在我们来到了这里。","start":1231.25,"end":1256.05},{"id":110,"text":"Now all we're doing is we're plugging into that horrible formula we saw before, we're plugging in all the terms. The mu is the old formula we saw before, the yi's are the same, the squared is the same, two sigma squared, and the normalization doesn't really change here.","zh":"现在我们所做的只是将之前看到的那个可怕的公式中的所有项代入进去。mu是之前看到的旧公式，yi保持不变，平方项也保持不变，是两倍的sigma平方，归一化在这里也不会发生太大变化。","start":1256.9,"end":1268.94},{"id":111,"text":"because the sigmas were really responsible for normalization. The mean didn't appear in the normalization, only the variance. Because the mean is just shifting it around. That's not going to change how much area is under the curve. So you wouldn't expect the mean to change the normalization. But making it wider or narrower, you would expect that to change the normalization. Indeed, it does.","zh":"因为sigma负责归一化。均值没有出现在归一化中，只有方差。因为均值只是将分布移动，这不会改变曲线下的面积。因此，你不会期望均值改变归一化。但使分布更宽或更窄，你就会期望这会改变归一化。确实如此。","start":1271.71,"end":1288.15},{"id":112,"text":"Okay, hopefully this formula is making intuitive sense. The details of it, if the details aren't quite there where you couldn't generate the formula, play with it. It will eventually become a little bit more natural. But all I care about really is that you kind of understand how it's put together. What are the key components? There's a distance squared. There's a variance that normalizes the units that are there. And then I hope that this notation doesn't terrify you. If you haven't seen this notation before, that's one that I would pay attention to because we will use it quite freely. This kind of condition and parameter notation, I use it kind of without thinking. If I say something,","zh":"好的，希望这个公式在直觉上是有意义的。如果细节还不清楚，以至于你无法推导出这个公式，那就去玩弄它，它最终会变得稍微自然一些。但对我真正关心的是你大概理解它是如何构建的。关键组成部分是什么？有一个距离的平方。有一个方差来归一化现有的单位。我希望这种记号不会让你感到害怕。如果你之前没有见过这种记号，那这就是一个需要注意的记号，因为我们会非常自由地使用它。这种条件和参数的记号，我基本上是不假思索地使用的。如果我说什么，","start":1290.34,"end":1319.86},{"id":113,"text":"that doesn't make sense or you don't know the notation, please feel free to ask. It's not that deep. You can always write it out. It's just mysterious and you get used to these shorthands. So I wanted to highlight it. All right. Now, this basically says what we just went through. We condition on xi. Conditioning here means that we assume that we see it. We have access to xi when we're making the distribution. So the distribution is fixed once we have the xi.","zh":"如果你觉得这没有意义或者你不了解符号，请随时提问。这并不深奥。你总是可以把它写出来。它只是看起来神秘，但你会逐渐习惯这些简写。所以我想要强调这一点。好了，这基本上就是我们刚才讨论的内容。我们对xi进行条件化。这里的条件化意味着我们假设我们看到了它。我们在构建分布时有访问xi的权限。因此，一旦我们有了xi，分布就确定了。","start":1319.88,"end":1345.1},{"id":114,"text":"This makes sense, right? If you think about it, every Xi is a different data point, but the errors for each one are going to be stochastic. So they're setting the mean. They set the average of where we think is going on. And in contrast, this is a bit of terminology that you'll see. Theta parameterizes. You're not actually conditioning on theta. It's not an event in the space. I don't want to be too precise about it. It's not something you condition on. Theta is just a parameter. So there's many different distributions out there. Each one...","zh":"这听起来合理，对吧？如果你仔细想想，每个Xi都是不同的数据点，但每个数据点的误差将是随机的。因此，它们设定了均值。它们设定了我们认为数据在何处的平均值。与此相对，你会看到一些术语。Theta进行参数化。你实际上并不是对Theta进行条件化。它不是空间中的一个事件。我不想过于精确地解释这一点。它并不是你进行条件化的对象。Theta只是一个参数。因此，存在许多不同的分布。每一个……","start":1345.86,"end":1370.74},{"id":115,"text":"parameterized by theta. And what we're going to do in a second is we're going to basically pick over all the distributions that could have generated this data set, which one is most likely. And that's going to be the principle of maximum likelihood. That's it. It's honestly it. So this just says we're going to search over the thetas. We don't really search over the data yet. We don't search over xi's. Those are given to us. That's input to the problem.","zh":"都由Theta参数化。接下来我们要做的事情，就是从所有可能生成这个数据集的分布中，找出哪一个最有可能。这就是最大似然原则。就是这么简单。这真的就是全部内容。因此，这句话只是说我们要在所有Theta中进行搜索。我们还没有对数据进行搜索。我们也没有对xi进行搜索。这些是给我们提供的。这是问题的输入。","start":1371.6,"end":1394.02}],"notes":["本段讲解了加权最小二乘法的数学基础，强调了在给定输入数据和参数的情况下，输出变量服从正态分布。同时指出，这种分布假设并非自动成立，需要满足线性条件，且方差与输入数据的缩放有关。","在推导公式时，重点解释了均值和方差在归一化过程中的作用。均值不会影响归一化，而方差会改变分布的宽度，从而影响归一化系数。这说明了为什么在加权最小二乘中，方差的处理是关键。","讲者强调了公式中各个组成部分的意义，包括距离平方、方差归一化以及条件和参数的表示法。这些符号和表示法在后续学习中会频繁使用，因此需要特别注意。","讲者指出，条件（conditioning）意味着在给定输入数据的情况下，分布是固定的。而参数（theta）并不是一个事件，而是一个用于参数化的变量，因此不能将其视为条件。","最后，讲者介绍了最大似然估计（maximum likelihood）的基本思想，即在所有可能的分布中，选择最有可能生成给定数据集的分布。这为后续的参数估计奠定了基础。","整个讲解强调了理解公式结构的重要性，以及如何通过反复练习和理解符号来掌握这些概念。同时，讲者鼓励学生在遇到不熟悉的符号时主动提问，以加深理解。"],"formulas":[],"uncertainties":["sigma squared"],"diagram":"none","start":1219.16,"end":1394.02,"asr_flags":[],"math_clarifications":["所有公式均未明确指定方差的具体表达式，且未使用标准符号 σ² 表示方差，不符合数学规范。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1219.16,"text":"Said another more formal way, what we're saying is that yi conditioned on seeing the xi's and theta, thetas are a parameter, are distributed as a normal with this mean and this variance."},{"start":1231.25,"text":"This fact that you can just copy is not automatic. Like for example, if we multiplied epsilon by some scalar value, we would have to track that when we went to this model, right? So it just happens to be that these things are all linear here. That's why it works out and it's the same sigma squared, right? If you multiply the number by 10
