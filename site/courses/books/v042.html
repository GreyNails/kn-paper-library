的概率，使用了伯努利分布的形式，正确表达了概率分布。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2426.34,"text":"But we're going to return and say that that's very close to 1. And then there's 1 minus because it's binary, but it's in the other class. And the reason I highlight this notation is later when we do multi-class, this will again come up. We'll bake the classes off of each other. Any questions about how this works and what the type is?"},{"start":2445.72,"text":"Okay, so all that I expect that you have thought so far is, okay, I have a new h theta. I have this new class of functions. They look relatively simple. They look like the linear functions that I used to have from a couple minutes ago, except for now I've run them through this g function that's going to smooth out their value. So if theta dot x is going to be some huge value like 100, well, that's going to be way, way over here, and it's going to be very, very close to 1. That's the idea. You'll sometimes hear people call these logits, but that's a separate issue."},{"start":2475.69,"text":"Okay, if you know what a logit is. Okay, cool. All right, so that probabilistic interpretation is going to give us directly a model. Okay, so back to what we were describing before, we are going to go back and use our old friend, maximum likelihood."},{"start":2492.49,"text":"And we're going to try an old friend from 15 minutes ago. So maybe it's whatever. I'm not going to make a terrible joke there. Anyway, so back to this. You're going to go to the product. Why are we going to a product? We're again assuming some independence. So we're going to have this nice product that's going on and what's happening. And then we're going to substitute our format. Now, this is just notation. This is just if-then written in a clever, statsy, machine learning way. It says either"},{"start":2520.66,"text":"yi is 0, and if it's 0, then which term is active? This term. Or yi is 1, and this term. So this is yi equal 1, this is y equals 0. It's just putting the two terms there, and when they're off, they return 1. So just convince yourself that this function does what you think it does. If you plug in y is equal to 1, you get the term that you want, and it doesn't go to 0. If you plug in the other one, you get the other one. Hypothesis 1 minus hypothesis."},{"start":2550.44,"text":"Okay, so far so good. All right, now back to the other thing. We take logs. So you've already seen this movie. You kind of know how it goes. And we get this fun form here. I'm not going to beat it to death. This is yi, 1 minus yi. They have different things inside the logs."},{"start":2569.7,"text":"All we're doing is trying to walk back exactly the same framework that we did before, and this is going to get us to another one of those functions, which is a gigantic sum instead of a product, nice numerically stable, all that other good stuff that happens from it, over our data points. How are we going to solve this thing? Any guesses? Differentiate, compute some gradients, let it run for a while. Now, this one we can tell when it's finished, which is not going to be true later in the course, but this one we can actually solve."}],"speech_gaps":[],"frame":"../frames/v042/015.webp","frame_time":2438.34},{"title":"加权最小二乘法的讲解","segments":[{"id":233,"text":"All right. So how do we solve it? We maximize. We already saw how to do this. You just compute the derivative, run SGD, and you're done with it. So that one, I just want to point out, was super quick to explain once we had gone through the basics of the story. We have a model. We know how to take the model and turn it from logs into a nice additive cost function. Once it's an additive cost function, we know how to run SGD on it, and boom, we can go and solve it. We can use gradient descent, stochastic gradient descent, whatever we want. This recipe,","start":2601.55,"end":2629.06},{"id":234,"text":"It's part of the reason maximum likelihood is so nice. We try to figure out how likely our data set is in the probability space. Then we go to the log space. That's a nice monotone mapping, which is great for us. It preserves that. And then, boom, we're off to being able to solve this in a big additive sum. It's additive, so now we know how to use SGD because mini-batching and all the things we talked about last. So just snaps together, you were going to say.","start":2629.66,"end":2650.26},{"id":235,"text":"Just being a little pedantic, so just curious. Would this be gradient descent because we're maximizing? Oh, yeah. Great question. Yeah, yeah. So the question was, would this be gradient descent because you're maximizing 100%? You would change the sign from minus to plus here. We will actually put it in a form where it's gradient descent when we write it. And so I apologize if I said something that was confusing. But wonderful, wonderful call out. I appreciate it. Other questions?","start":2653.05,"end":2677.64},{"id":236,"text":"You guys are great. But the thing that I want to show you from this is just so you see, this is an extremely powerful model. You actually have used this model in your life, whether you want to or not. It underpins almost everything. And it's super simple once you understand those principles of how you put it together. You model it with maximum likelihood. You take it into a nice, convenient form for computation. You solve it with gradient descent. This is the recipe for maximum likelihood that's been so, so powerful over the years.","start":2681.02,"end":2707.5},{"id":237,"text":"Okay, now I don't know if I have, I mean, I'm going to go through this very quickly. You don't need to know this, but there's something that I do want to show you. And there's a little bit of math on this thing. So if you have the slide, you can go through it. But let me highlight for you among here what's interesting. The interesting thing is, and this was the great thing before. So I sneakily switched the sign from minus to positive exactly to deal with a scent issue. This is the mini batching that we were talking about before. But the remarkable thing is this.","start":2709.94,"end":2737.62},{"id":238,"text":"So when we wrote the original form down here, this is a strange looking object. But what's weird is you can still get to something that has this nice familiar form where you measure the error and multiply by xj. That's pretty nice. And it turns out this is a general rule. We're going to see it more later in the course. So I want to highlight it now, later in the course, like Wednesday, not like six months from now. This form, this error and correct form,","start":2738.25,"end":2766.06}],"notes":["本段主要讨论了最大似然估计的计算过程，强调了对数似然函数的转换以及如何将其转化为可计算的加法形式。讲者指出，通过将概率空间中的似然函数转换为对数空间，可以利用单调映射的性质，从而简化计算。接着，讲者提到梯度下降法（包括随机梯度下降）可以用于求解这种形式的优化问题，因为其具有可分性，便于进行小批量处理。","讲者进一步指出，最大似然估计之所以强大，是因为它提供了一个通用的框架，可以应用于各种模型。通过将模型转换为对数形式，可以将其转化为一个可计算的加法形式，从而利用梯度下降法进行求解。这种转换使得模型的训练过程更加高效和直观。","讲者提到，虽然最大似然估计的计算过程看似简单，但其背后的原理非常强大。通过将模型转换为对数形式，可以利用梯度下降法进行优化，而这种转换过程是模型训练的核心步骤。讲者还指出，这种转换方法在实际应用中非常常见，几乎所有的机器学习模型都依赖于这一原理。","讲者在讲解过程中提到，梯度下降法可以用于最大化或最小化目标函数，但需要根据具体问题调整符号。例如，在最大化问题中，需要将目标函数的符号从负号改为正号，以确保梯度下降法的正确应用。讲者还提到，这种调整是必要的，以确保优化过程的正确性。","讲者指出，最大似然估计的计算过程可以分为几个步骤：首先，将模型转换为对数形式；其次，将其转换为一个可计算的加法形式；最后，使用梯度下降法进行优化。这种分步的方法使得模型的训练过程更加清晰和易于理解。","讲者还提到，虽然最大似然估计的计算过程看似简单，但其背后的数学原理非常复杂。通过将模型转换为对数形式，可以利用梯度下降法进行优化，而这种转换过程是模型训练的核心步骤。讲者还指出，这种转换方法在实际应用中非常常见，几乎所有的机器学习模型都依赖于这一原理。"],"formulas":[],"uncertainties":["scent issue"],"diagram":"none","start":2601.55,"end":2766.06,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2601.55,"text":"All right. So how do we solve it? We maximize. We already saw how to do this. You just compute the derivative, run SGD, and you're done with it. So that one, I just want to point out, was super quick to explain once we had gone through the basics of the story. We have a model. We know how to take the model and turn it from logs into a nice additive cost function. Once it's an additive cost function, we know how to run SGD on it, and boom, we can go and solve it. We can use gradient descent, stochastic gradient descent, whatever we want. This recipe,"},{"start":2629.66,"text":"It's part of the reason maximum likelihood is so nice. We try to figure out how likely our data set is in the probability space. Then we go to the log space. That's a nice monotone mapping, which is great for us. It preserves that. And then, boom, we're off to being able to solve this in a big additive sum. It's additive, so now we know how to use SGD because mini-batching and all the things we talked about last. So just snaps together, you were going to say."},{"start":2653.05,"text":"Just being a little pedantic, so just curious. Would this be gradient descent because we're maximizing? Oh, yeah. Great question. Yeah, yeah. So the question was, would this be gradient descent because you're maximizing 100%? You would change the sign from minus to plus here. We will actually put it in a form where it's gradient descent when we write it. And so I apologize if I said something that was confusing. But wonderful, wonderful call out. I appreciate it. Other questions?"},{"start":2681.02,"text":"You guys are great. But the thing that I want to show you from this is just so you see, this is an extremely powerful model. You actually have used this model in your life, whether you want to or not. It underpins almost everything. And it's super simple once you understand those principles of how you put it together. You model it with maximum likelihood. You take it into a nice, convenient form for computation. You solve it with gradient descent. This is the recipe for maximum likelihood that's been so, so powerful over the years."},{"start":2709.94,"text":"Okay, now I don't know if I have, I mean, I'm going to go through this very quickly. You don't need to know this, but there's something that I do want to show you. And there's a little bit of math on this thing. So if you have the slide, you can go through it. But let me highlight for you among here what's interesting. The interesting thing is, and this was the great thing before. So I sneakily switched the sign from minus to positive exactly to deal with a scent issue. This is the mini batching that we were talking about before. But the remarkable thing is this."},{"start":2738.25,"text":"So when we wrote the original form down here, this is a strange looking object. But what's weird is you can still get to something that has this nice familiar form where you measure the error and multiply by xj. That's pretty nice. And it turns out this is a general rule. We're going to see it more later in the course. So I want to highlight it now, later in the course, like Wednesday, not like six months from now. This form, this error and correct form,"}],"speech_gaps":[],"frame":"../frames/v042/016.webp","frame_time":2613.55},{"title":"加权最小二乘与优化方法","segments":[{"id":239,"text":"is very common and it's nice that these models have it. So all the nastiness is put into infer on the point, look at the data point difference, and then do an update. It's quite remarkable. Not obvious. Derived here with a bunch of just algebra, just algebra to go from here to here. Don't worry too much about it. You can do it offline. I'm not going to torture with it at the moment.","start":2766.73,"end":2788.09},{"id":240,"text":"So what did we learn? We used the principle of maximum likelihood in a probabilistic model to extend this work to classification. We developed logistic regression from this principle. It's extremely widely used today. This is a model that, as I said, you've probably used or used a product that has logistic regression or what's called softmax inside of it.","start":2791.25,"end":2809.19},{"id":241,"text":"Important for me is you've seen this principle. Next lecture, what we're going to do is we're going to take that same principle and we're going to run it on more complicated distributions. And again, this part of the crank is going to be very useful for us. Don't worry, you'll see it again. Take model the probability distribution, take kind of logs to put it in the nice form. We'll talk about what the nice form is, and then we'll run gradient descent. And then you can run all that back-end magic that we care about and love.","start":2810.39,"end":2832.77},{"id":242,"text":"This is the familiar pattern and hopefully it's intuitive that it gets into this misprediction","start":2835.0,"end":2839.14},{"id":243,"text":"form. I skipped over that a little bit but that was what I was talking about in the slide that","start":2839.14,"end":2842.86},{"id":244,"text":"you get this y minus h theta thing going on. It will turn out that almost all the models we","start":2842.86,"end":2847.42},{"id":245,"text":"consider in this first couple part of the course have that form and hopefully that's intuitive.","start":2847.42,"end":2851.04},{"id":246,"text":"There's nothing mysterious going on in gradient descent. It's just a first order approximation","start":2851.4,"end":2855.7},{"id":247,"text":"that says I take x, I predict it, I see where my error is, that's the information I have and then","start":2855.7,"end":2862.06},{"id":248,"text":"I take a step in a direction and usually that direction is in the direction of the data. Boom,","start":2862.06,"end":2867.14},{"id":249,"text":"done. Okay, all right. Okay, so with our last little bit, I want to show you one little bit","start":2867.22,"end":2876.02},{"id":250,"text":"of optimization, which is Newton's method. And here, it's just a different optimization. We're","start":2876.02,"end":2882.3},{"id":251,"text":"not going to use it that much in the course. For logistic regression though, I should say,","start":2882.3,"end":2885.7},{"id":252,"text":"so something that's interesting, there was a while in machine learning a long time ago","start":2885.84,"end":2889.1},{"id":253,"text":"where logistic regression was absolutely the vanilla workhorse.","start":2889.1,"end":2892.86},{"id":254,"text":"This was before PyTorch and all the rest,","start":2893.0,"end":2895.48},{"id":255,"text":"TensorFlow, all those other tools, JAX.","start":2896.18,"end":2897.86},{"id":256,"text":"What people would do is they would take logistic regression","start":2898.24,"end":2900.7},{"id":257,"text":"and they would add in huge numbers of features","start":2900.7,"end":2902.92},{"id":258,"text":"so they'd have very, very high features.","start":2902.92,"end":2904.72},{"id":259,"text":"And you could take those Xs that we talked about,","start":2904.84,"end":2906.98},{"id":260,"text":"instead of putting them in low dimensions","start":2907.02,"end":2908.38},{"id":261,"text":"where you'd have house prices and all these other things,","start":2908.38,"end":2911.16},{"id":262,"text":"they would take random hashes of them.","start":2911.34,"end":2913.08},{"id":263,"text":"They would just make them, they would explode them.","start":2913.26,"end":2914.84},{"id":264,"text":"There's a beautiful paper written by a dear friend","start":2914.92,"end":2916.48},{"id":265,"text":"about what are called random features,","start":2916.48,"end":2917.94},{"id":266,"text":"features, which are unbelievable, kind of what we call, we'll find out what kernels","start":2917.94,"end":2921.5},{"id":267,"text":"are later. But these unbelievable infinite dimensional feature spaces. So it's an extremely","start":2921.5,"end":2926.38},{"id":268,"text":"powerful model, you can put a lot into there. Solving those models, especially in statistics,","start":2926.38,"end":2931.18},{"id":269,"text":"you can because it's convex underneath the covers, we won't really we won't prove that.","start":2931.6,"end":2935.68},{"id":270,"text":"but you can find the right situation.","start":2935.68,"end":2937.46}],"notes":["本段主要讲解了加权最小二乘法的基本思想，强调了模型中将复杂性集中在推断过程中的特点。讲者指出，虽然推导过程可能看起来复杂，但可以通过代数运算完成，且可以离线处理，无需过多关注细节。","讲者提到，最大似然原理被用于扩展到分类任务，从而发展出逻辑回归模型。逻辑回归是当前广泛使用的模型之一，许多产品内部都使用了该模型或其变体softmax。","接下来的课程将使用同样的最大似然原理，但应用于更复杂的分布。讲者指出，这部分推导过程对理解后续内容非常重要，但不会在此详细展开。","讲者强调，梯度下降法本质上是一个一阶近似方法，通过计算误差并调整参数来逐步优化模型。这个过程直观且易于理解，不需要复杂的数学推导。","讲者提到，牛顿法是一种不同的优化方法，虽然在课程中不会频繁使用，但在逻辑回归中仍有其应用价值。讲者还提到，在深度学习工具出现之前，逻辑回归曾是机器学习中的基础模型。","讲者进一步说明，为了处理高维数据，人们会添加大量特征，甚至使用随机特征（random features）来构建无限维的特征空间。这种方法在统计学中非常强大，且在某些情况下具有凸性，便于求解。"],"formulas":[],"uncertainties":["form","h theta","convex underneath the covers"],"diagram":"none","start":2766.73,"end":2937.46,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2766.73,"text":"is very common and it's nice that these models have it. So all the nastiness is put into infer on the point, look at the data point difference, and then do an update. It's quite remarkable. Not obvious. Derived here with a bunch of just algebra, just algebra to go from here to here. Don't worry too much about it. You can do it offline. I'm not going to torture with it at the moment."},{"start":2791.25,"text":"So what did we learn? We used the principle of maximum likelihood in a probabilistic model to extend this work to classification. We developed logistic regression from this principle. It's extremely widely used today. This is a model that, as I said, you've probably used or used a product that has logistic regression or what's called softmax inside of it."},{"start":2810.39,"text":"Important for me is you've seen this principle. Next lecture, what we're going to do is we're going to take that same principle and we're going to run it on more complicated distributions. And again, this part of the crank is going to be very useful for us. Don't worry, you'll see it again. Take model the probability distribution, take kind of logs to put it in the nice form. We'll talk about what the nice form is, and then we'll run gradient descent. And then you can run all that back-end magic that we care about and love."},{"start":2835.0,"text":"This is the familiar pattern and hopefully it's intuitive that it gets into this misprediction"},{"start":2839.14,"text":"form. I skipped over that a little bit but that was what I was talking about in the slide that"},{"start":2842.86,"text":"you get this y minus h theta thing going on. It will turn out that almost all the models we"},{"start":2847.42,"text":"consider in this first couple part of the course have that form and hopefully that's intuitive."},{"start":2851.4,"text":"There's nothing mysterious going on in gradient descent. It's just a first order approximation"},{"start":2855.7,"text":"that says I take x, I predict it, I see where my error is, that's the information I have and then"},{"start":2862.06,"text":"I take a step in a direction and usually that direction is in the direction of the data. Boom,"},{"start":2867.22,"text":"done. Okay, all right. Okay, so with our last little bit, I want to show you one little bit"},{"start":2876.02,"text":"of optimization, which is Newton's method. And here, it's just a different optimization. We're"},{"start":2882.3,"text":"not going to use it that much in the course. For logistic regression though, I should say,"},{"start":2885.84,"text":"so something that's interesting, there was a while in machine learning a long time ago"},{"start":2889.1,"text":"where logistic regression was absolutely the vanilla workhorse."},{"start":2893.0,"text":"This was before PyTorch and all the rest,"},{"start":2896.18,"text":"TensorFlow, all those other tools, JAX."},{"start":2898.24,"text":"What people would do is they would take logistic regression"},{"start":2900.7,"text":"and they would add in huge numbers of features"},{"start":2902.92,"text":"so they'd have very, very high features."},{"start":2904.84,"text":"And you could take those Xs that we talked about,"},{"start":2907.02,"text":"instead of putting them in low dimensions"},{"start":2908.38,"text":"where you'd have house prices and all these other things,"},{"start":2911.34,"text":"they would take random hashes of them."},{"start":2913.26,"text":"They would just make them, they would explode them."},{"start":2914.92,"text":"There's a beautiful paper written by a dear friend"},{"start":2916.48,"text":"about what are called random features,"},{"start":2917.94,"text":"features, which are unbelievable, kind of what we call, we'll find out what kernels"},{"start":2921.5,"text":"are later. But these unbelievable infinite dimensional feature spaces. So it's an extremely"},{"start":2926.38,"text":"powerful model, you can put a lot into there. Solving those models, especially in statistics,"},{"start":2931.6,"text":"you can because it's convex underneath the covers, we won't really we won't prove that."},{"start":2935.68,"text":"but you can find the right situation."}],"speech_gaps":[],"frame":"../frames/v042/017.webp","frame_time":2778.73},{"title":"加权最小二乘与牛顿法","segments":[{"id":271,"text":"Now remember when we talked about before, I said if you change, when we were discussing about the sigma squared, talked about if you changed a parameter and then all of a sudden the model changed, you should be very uncomfortable with the model. And I will just tell you as a historical note, machine learning people were very uncomfortable when they would run a procedure and get one theta, then they'd run another procedure and get another theta.","start":2938.9,"end":2957.78},{"id":272,"text":"It turns out that machine learning people realize we don't really care about theta as the object. What we care about is h of theta, the predictions we make with it. Okay, so I'm going to show you this because it is historically quite important, but what we care about now when we talk about stability is more on the prediction space than on what we would call sometimes a certificate or the parameter space. Okay. Alright, so in Newton's method, let's discuss it. It's a simple method if you haven't seen it before, but show of hands who knows Newton's method?","start":2959.95,"end":2985.44},{"id":273,"text":"Okay, pretty good. All right, so we're given here an F. We want to find the zero. We typically apply this to likelihood functions. We take the gradient of theta, right? So we want to find a stationary point, right? We want to find some place where the gradient is equal to zero. So we use it on that piece, but we'll talk about it in full generality. Okay, so how does it work? It's an extremely simple method, which is pretty nice.","start":2986.16,"end":3014.92},{"id":274,"text":"All right, so let's say we have our function here. We have some function that we want to try and find the zero of. So here's where the zero is. We start with an initial guess to iterative like all the methods we've drawn. So I'll call that theta zero. And this point here will be f of theta zero. All right, so far so good. Now, what we compute is the gradient again.","start":3016.17,"end":3048.52},{"id":275,"text":"this gradient character. Okay, and our method, the idea is, is that we want to find the zero. And what we're going to do is we're going to use this local linear model, this line here. So what is the slope of this line? Well, the slope of the line here is going to be the gradient. So this function here, which I'll call t of theta,","start":3051.33,"end":3068.28},{"id":276,"text":"So as I move back and forth on theta, I move up and down this line. Well, what's the equation for that line? Well, it's the Taylor's approximation. So it is f of theta zero, because that's this point here, plus, and then I'll do something like the gradient of f of theta zero times theta minus theta zero. This is the Taylor's approximation. And then what I want to do is I want to set this so that t of theta","start":3069.58,"end":3095.95},{"id":277,"text":"is equal to zero. So I want to move up and down this line, and I want to get its guess of zero.","start":3097.1,"end":3102.62},{"id":278,"text":"I don't know. I can't figure out where f is. I only have this local information.","start":3105.2,"end":3108.22},{"id":279,"text":"This is my best local guess. Now, this is different than stochastic gradient descent","start":3108.48,"end":3113.34},{"id":280,"text":"because in stochastic gradient descent, I would just look at the gradient, look at the direction,","start":3114.78,"end":3118.02}],"notes":["本段讲解了牛顿法的基本思想，即通过局部线性模型来寻找函数的零点。讲者提到，牛顿法使用泰勒展开来近似函数，通过计算梯度和函数值来构造一条直线，然后在该直线上寻找零点。这种方法依赖于局部信息，因此只能提供一个局部的估计。","讲者指出，牛顿法与随机梯度下降法不同，后者仅依赖于梯度的方向，而牛顿法则利用了二阶信息（梯度和Hessian矩阵），从而在局部范围内更精确地逼近零点。","在牛顿法的实现中，讲者强调了初始猜测的重要性，因为该方法对初始值非常敏感。如果初始猜测远离真实解，可能会导致算法无法收敛。","讲者提到，牛顿法在寻找函数的零点时，会使用泰勒展开式来构造一个线性近似，然后通过求解该线性方程来更新参数。这种方法在局部范围内是有效的，但需要保证函数在该区域内的可微性和凸性。","讲者还指出，牛顿法在实际应用中可能面临一些挑战，例如计算Hessian矩阵的逆矩阵可能很耗时，或者当Hessian矩阵不可逆时，该方法可能无法使用。","最后，讲者提到牛顿法与随机梯度下降法在方法论上的区别，强调了牛顿法在局部优化中的优势，但也指出其对初始值和函数性质的依赖性。"],"formulas":[{"latex":"f(\\theta) \\text{ 的泰勒展开为 } f(\\theta_0) + \\nabla f(\\theta_0)^T (\\theta - \\theta_0)","symbols":"f(θ) 是目标函数，θ₀ 是初始猜测，∇f(θ₀) 是梯度，θ 是更新后的参数","explanation":"公式正确表达了泰勒展开的局部线性近似，适用于牛顿法的迭代过程。","evidence":"So as I move back and forth on theta, I move up and down this line. Well, what's the equation for that line? Well, it's the Taylor's approximation. So it is f of theta zero, because that's this point here, plus, and then I'll do something like the gradient of f of theta zero times theta minus theta zero. This is the Taylor's approximation. And then what I want to do is I want to set this so that t of theta"}],"uncertainties":["t of theta 的具体定义和用途未明确说明","讲者提到的 'local linear model' 的具体形式和实现细节未明确","讲者提到的 'local information' 的具体含义和范围未明确"],"diagram":"none","start":2938.9,"end":3118.02,"asr_flags":[],"math_clarifications":["公式中的泰勒展开是牛顿法的核心思想，用于在当前点附近构造线性近似，从而找到函数的零点。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2938.9,"text":"Now remember when we talked about before, I said if you change, when we were discussing about the sigma squared, talked about if you changed a parameter and then all of a sudden the model changed, you should be very uncomfortable with the model. And I will just tell you as a historical note, machine learning people were very uncomfortable when they would run a procedure and get one theta, then they'd run another procedure and get another theta."},{"start":2959.95,"text":"It turns out that machine learning people realize we don't really care about theta as the object. What we care about is h of theta, the predictions we make with it. Okay, so I'm going to show you this because it is historically quite important, but what we care about now when we talk about stability is more on the prediction space than on what we would call sometimes a certificate or the parameter space. Okay. Alright, so in Newton's method, let's discuss it. It's a simple method if you haven't seen it before, but show of hands who knows Newton's method?"},{"start":2986.16,"text":"Okay, pretty good. All right, so we're given here an F. We want to find the zero. We typically apply this to likelihood functions. We take the gradient of theta, right? So we want to find a stationary point, right? We want to find some place where the gradient is equal to zero. So we use it on that piece, but we'll talk about it in full generality. Okay, so how does it work? It's an extremely simple method, which is pretty nice."},{"start":3016.17,"text":"All right, so let's say we have our function here. We have some function that we want to try and find the zero of. So here's where the zero is. We start with an initial guess to iterative like all the methods we've drawn. So I'll call that theta zero. And this point here will be f of theta zero. All right, so far so good. Now, what we compute is the gradient again."},{"start":3051.33,"text":"this gradient character. Okay, and our method, the idea is, is that we want to find the zero. And what we're going to do is we're going to use this local linear model, this line here. So what is the slope of this line? Well, the slope of the line here is going to be the gradient. So this function here, which I'll call t of theta,"},{"start":3069.58,"text":"So as I move back and forth on theta, I move up and down this line. Well, what's the equation for that line? Well, it's the Taylor's approximation. So it is f of theta zero, because that's this point here, plus, and then I'll do something like the gradient of f of theta zero times theta minus theta zero. This is the Taylor's approximation. And then what I want to do is I want to set this so that t of theta"},{"start":3097.1,"text":"is equal to zero. So I want to move up and down this line, and I want to get its guess of zero."},{"start":3105.2,"text":"I don't know. I can't figure out where f is. I only have this local information."},{"start":3108.48,"text":"This is my best local guess. Now, this is different than stochastic gradient descent"},{"start":3114.78,"text":"because in stochastic gradient descent, I would just look at the gradient, look at the direction,"}],"speech_gaps":[],"frame":"../frames/v042/018.webp","frame_time":2950.9},{"title":"牛顿法与伪逆矩阵","segments":[{"id":281,"text":"and take a small step here. This is telling me exactly how far to go. So it doesn't have a step","start":3118.08,"end":3124.34},{"id":282,"text":"size, which is quite a nice property of it. One of the reasons people like it so much.","start":3124.34,"end":3127.92},{"id":283,"text":"It also converges fast when it converges. So when we have this equation here, t theta,","start":3129.0,"end":3133.82},{"id":284,"text":"how does it work? Well, let's solve this. This is basically going to say that I'm going to take","start":3134.18,"end":3139.22},{"id":285,"text":"f of theta zero. I'm going to divide it by, I'm going to say here, let's imagine this is a scalar","start":3139.6,"end":3145.4},{"id":286,"text":"for the moment just to make my life easier. I'll come back to what we would do otherwise.","start":3145.4,"end":3148.36},{"id":287,"text":"minus, equal, or plus, or equals theta minus theta zero. And indeed I get here","start":3150.9,"end":3158.08},{"id":288,"text":"that this is going to be theta, out of things, theta zero minus f of theta zero","start":3158.08,"end":3165.64},{"id":289,"text":"over f prime of theta zero, okay? That's going to be equal to my theta next. I'll","start":3165.64,"end":3170.6},{"id":290,"text":"call this, you know, theta t or something, okay? So the guess is just I go down here,","start":3170.6,"end":3175.82},{"id":291,"text":"I walk by the distance that makes this line intersect zero, and I repeat. Now the good","start":3175.82,"end":3182.58},{"id":292,"text":"thing about Newton's method, just as an aside. Okay, so I set it equal to zero. What do I do","start":3182.58,"end":3188.2},{"id":293,"text":"if this is higher dimensional? Anyone remember? So if it's a scalar, I can go and do this division","start":3188.2,"end":3194.96},{"id":294,"text":"here. What really matters? What happened? Oh please. Awesome. Yeah, so one idea would be if","start":3194.96,"end":3206.52},{"id":295,"text":"this method were, if f were of the right type, for example it was a gradient and a gradient has a","start":3206.52,"end":3211.96},{"id":296,"text":"type of going from say fd to fd, then the gradient of the gradient is the Hessian, right? That Hessian","start":3211.96,"end":3219.34},{"id":297,"text":"is square, hopefully I can invert it and find the place where it's equal to zero.","start":3219.34,"end":3225.08},{"id":298,"text":"We'll write that down in one second. But more correct, more intuitively, basically what this","start":3226.74,"end":3232.3},{"id":299,"text":"says, and this is a question, it says if I have this vector, I basically have a vector times a","start":3232.3,"end":3236.54},{"id":300,"text":"dot product here, and that dot product has to be equal to f0, has to equal to minus f0. So among","start":3236.54,"end":3242.88},{"id":301,"text":"all, if I imagine a higher dimensional surface, I have to find among all the points that are there,","start":3242.88,"end":3248.38},{"id":302, s"},{"start":3232.3,"text":"says, and this is a question, it says if I have this vector, I basically have a vector times a"},{"start":3236.54,"text":"dot product here, and that dot product has to be equal to f0, has to equal to minus f0. So among"},{"start":3242.88,"text":"all, if I imagine a higher dimensional surface, I have to find among all the points that are there,"},{"start":3248.38,"text":"And there could be many because the null space is large."},{"start":3250.98,"text":"Are these terms familiar to you?"},{"start":3252.82,"text":"By show of hands, who knows what I mean when I say null space?"},{"start":3255.21,"text":"Right. Good. Awesome. Then I just have to find something there among all those that gets there. And the answer is that I don't just use the inverse. I use the pseudo-inverse because it may not be actually perfectly invertible. And the pseudo-inverse in particular, it's called the Penrose pseudo-inverse, does it exactly. It handles all of these cases directly. If you remember the little dagger, that's what's going on under the covers. Overdetermined, underdetermined. If it's overdetermined, what do you do? Any guesses?"}],"speech_gaps":[{"start":3148.76,"end":3150.5}],"frame":"../frames/v042/019.webp","frame_time":3130.08},{"title":"加权最小二乘与优化方法比较","segments":[{"id":306,"text":"You have too many equations. So here it's underdetermined if I have a d-dimensional vector and only one equation in the parameters. What happens if it's overdetermined? I heard it. You use least squares. So it uses the same algorithm we had before. It basically does a least square solve to try and find out what's the best direction underneath the covers.","start":3284.09,"end":3305.87},{"id":307,"text":"All right. So hopefully that's familiar and intuitive. If it's not, please ask questions. This was also exactly as was talked about. When we have vector-valued things, we'll use the Hessian, which is described here. It's just the matrix of partial derivatives of the laws. And this algorithm, when it converges, and it has a pretty good convergence guarantees, it gets a good local conversion guarantees, it's extremely efficient.","start":3307.95,"end":3329.79},{"id":308,"text":"In an optimization sense, it gives you many digits of precision every time it runs. Each one of those steps is actually zeroing in on it quite a bit. So why do we use SGD?","start":3330.62,"end":3346.07},{"id":309,"text":"So it turns out that this is the main trick. So SGD has OD compute per step. Minibatch is B times D. This is the dimension that's underneath the covers. And it may take SGD many, many steps to do there because it's a really bad estimate from my last time. Remember, it just takes one term, guesses which direction to go, and takes a step in that direction. Minibatch is a little bit better. It takes a small collection of directions, executes and goes. Gradient descent.","start":3346.97,"end":3375.86},{"id":310,"text":"is a little bit better. It actually computes the gradient for what it's worth. It really computes the honest-to-God gradient, but it has to see all of the data points. And a lot of machine learning, N is absolutely, absolutely massive. And so is D. So for example, you want to train on every word on the internet, and you want to run a 10 billion or 100 billion or 1 trillion parameter model.","start":3376.99,"end":3400.53},{"id":311,"text":"Well, that's a really big number, right?","start":3401.36,"end":3403.78},{"id":312,"text":"It's like a quadrillion steps.","start":3403.88,"end":3405.44},{"id":313,"text":"You're not going to do that.","start":3406.06,"end":3407.1},{"id":314,"text":"That's too many flops to make one estimate.","start":3407.18,"end":3408.86},{"id":315,"text":"Newton is much worse in this regard.","start":3411.66,"end":3413.96},{"id":316,"text":"It's n times d squared plus d cubed.","start":3414.46,"end":3416.82},{"id":317,"text":"The d cubed is coming from the inversions and other things we were talking about.","start":3416.92,"end":3419.46},{"id":318,"text":"Here's where we're applying it to the loss.","start":3419.72,"end":3422.14},{"id":319,"text":"You will do very few steps.","start":3423.42,"end":3425.2},{"id":320,"text":"What I would say, it's very statistically or optimization-wise, it's efficient.","start":3425.78,"end":3429.12},{"id":321,"text":"If you measure by steps, this annihilates the ones from before. But each one of those steps","start":3429.12,"end":3435.2},{"id":322,"text":"is extremely, extremely expensive. So as a result, this is just another way of saying","start":3436.3,"end":3440.4},{"id":323,"text":"mini-match SGD is a workhorse of ML. And I believe you're going to have a homework where you compare","start":3440.4,"end":3444.72},{"id":324,"text":"them. So I just wanted to make sure that you had actually seen the various different methods.","start":3444.72,"end":3448.4},{"id":325,"text":"Is Newton's method used anywhere in classical statistics?","start":3456.8,"end":3461.94}],"notes":["本段讲解了在参数个数少于方程个数时，系统处于欠定状态，而当参数个数多于方程个数时，系统处于超定状态，此时通常使用最小二乘法进行求解。讲者提到，最小二乘法使用与之前相同的算法，通过最小化误差平方和来找到最佳解。","讲者提到，当处理向量值问题时，会使用Hessian矩阵，它是函数的二阶偏导数矩阵。该算法在收敛时具有良好的收敛性保证，并且计算效率很高。","讲者指出，虽然梯度下降法（Gradient Descent）在每一步计算梯度时需要遍历所有数据点，但在大规模数据集（如互联网上的所有单词）和高维模型（如100亿或1万亿参数模型）的情况下，这种方法的计算成本极高。","讲者提到，牛顿法的计算复杂度为n乘以d的平方加上d的立方，其中d的立方来自于矩阵求逆等操作。这表明牛顿法在大规模问题中计算成本更高。","讲者强调，虽然SGD在步骤数量上优于传统方法，但每一步的计算成本极高，因此在实际应用中需要权衡计算效率和精度。","讲者提到，SGD是机器学习中的重要工具，并且在后续的作业中会要求学生比较不同优化方法的优劣，以加深对各种方法的理解。"],"formulas":[],"uncertainties":["mini-match SGD 中的 'mini-match' 可能是 'mini-batch SGD' 的误听，需进一步确认"],"diagram":"none","start":3284.09,"end":3461.94,"asr_flags":[],"math_clarifications":["原始文本中未提及任何具体的数学公式，因此无法核对或保留任何公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3284.09,"text":"You have too many equations. So here it's underdetermined if I have a d-dimensional vector and only one equation in the parameters. What happens if it's overd lops to make one estimate."},{"start":3411.66,"text":"Newton is much worse in this regard."},{"start":3414.46,"text":"It's n times d squared plus d cubed."},{"start":3416.92,"text":"The d cubed is coming from the inversions and other things we were talking about."},{"start":3419.72,"text":"Here's where we're applying it to the loss."},{"start":3423.42,"text":"You will do very few steps."},{"start":3425.78,"text":"What I would say, it's very statistically or optimization-wise, it's efficient."},{"start":3429.12,"text":"If you measure by steps, this annihilates the ones from before. But each one of those steps"},{"start":3436.3,"text":"is extremely, extremely expensive. So as a result, this is just another way of saying"},{"start":3440.4,"text":"mini-match SGD is a workhorse of ML. And I believe you're going to have a homework where you compare"},{"start":3444.72,"text":"them. So I just wanted to make sure that you had actually seen the various different methods."},{"start":3456.8,"text":"Is Newton's method used anywhere in classical statistics?"}],"speech_gaps":[{"start":3451.248,"end":3456.4}],"frame":"../frames/v042/020.webp","frame_time":3296.09},{"title":"加权最小二乘与优化方法","segments":[{"id":326,"text":"So for example, if you're going to train a model in a stats package, a SciPy, something","start":3462.3,"end":3467.78},{"id":327,"text":"like this, and you only have a couple of hundred features or something, or 20 features that","start":3467.78,"end":3473.56},{"id":328,"text":"you're trying to regress out, which to be fair, 20 years ago was the most common use","start":3473.56,"end":3478.3},{"id":329,"text":"case in stats then you would use newton or a variant called lbfgs which is a limited memory","start":3478.3,"end":3483.54},{"id":330,"text":"kind of second order thing you would use those everywhere because you really cared about the","start":3483.54,"end":3487.52},{"id":331,"text":"parameters the reason that i include this is to give that contrast because a lot of people maybe","start":3487.52,"end":3492.5},{"id":332,"text":"not as much now but a lot of people come in with a kind of a background of stats and they're like","start":3492.5,"end":3496.22},{"id":333,"text":"Like, oh, I'll just solve these models","start":3496.22,"end":3497.38},{"id":334,"text":"with these great optimizations.","start":3497.38,"end":3498.48},{"id":335,"text":"techniques and those optimization techniques indeed are great but they require different scaling and really what this is is an excuse to kind of beat this again and again that really we're interested in these regimes in machine learning where n the number of data points is huge and d the number of dimensions are huge and that's a very weird space and so you end up with relatively crazy things and the problems that we care about but if you ask a social scientist they're like they would never in a million years use std it'd be too noisy too hard to tune","start":3498.89,"end":3525.11},{"id":336,"text":"Newton's method doesn't have step sizes. Why not just press the button and it works? It runs before I even think about it. So it does get used quite a bit more over on those kinds of problems. Wonderful question. Other questions? Please.","start":3525.9,"end":3539.41},{"id":337,"text":"Can it be cheaper to compute if you have some structure, like ? Yeah. Are there any cases that you have ? Yeah. I feel like I paid you to say this, but OK. So anyway, so the question was, are there any cases where you have some structured in H? And it's like, I don't know, maybe like my has one student.","start":3541.44,"end":3561.7},{"id":338,"text":"who now works at Emeta, was his whole thesis was about when you could have structured matrices and Hessians that allow you to do something that's smarter. It turns out that you don't have to compute the full Hessian. This is not relevant for the course, so please don't listen.","start":3562.14,"end":3573.94},{"id":339,"text":"But I'm going to answer your question because I like it. The thing is, it turns out that you don't have to compute the full Hessian, but you have to compute Hessian vector dot products, and those can be cheaper. If you know the Hessian has some form, or you're willing to assume it has some form, then you do something in it. It's not really Newton's method any longer, but you have some second-order information. That actually is used in machine learning. So that was the inspiration behind John and Yoram's algorithm, which is called AdaGrad, what they were doing in AdaDelta, where they were trying to estimate a little bit of what is called curvature information, which tells you","start":3574.67,"end":3604.03},{"id":340,"text":"you how much should I trust a step in every direction. The Hessian isn't something mysterious. It's just saying like, look, if there's a really big difference in this direction versus a really small one in this direction, I should probably step more in the directions I care about. That's roughly all that's going on. So you can simulate that by assuming H has some structure. Maybe it's diagonal. Diagonal is super cheap. That's what they were doing. You can do diagonal plus low rank. That's another thing. Or you can assume that it compresses well, which is what people were doing in what's called sketching. And so yes, that all comes up. So those...","start":3604.01,"end":3632.89}],"notes":["本段讨论了在机器学习中，当数据点数量n和维度d都非常大时，优化方法的选择变得尤为重要。传统的优化方法如牛顿法在小规模问题中表现良好，但在大规模问题中可能不适用。社会科学家通常不会使用标准方法，因为它们可能过于嘈杂且难以调整。","在大规模数据问题中，计算Hessian矩阵可能非常昂贵，因此需要寻找结构化的替代方法。例如，可以假设Hessian矩阵具有某种结构，如对角线形式或低秩形式，从而减少计算成本。","Hessian矩阵的结构化假设可以用于模拟其行为，例如通过使用对角线近似或低秩近似。这些方法在机器学习中被广泛应用，如AdaGrad和AdaDelta算法，它们利用了曲率信息来调整学习率。","Hessian矩阵本质上描述了损失函数在不同方向上的曲率，这决定了在优化过程中应采取的步长。通过假设Hessian具有某种结构，可以更高效地进行优化。","在实际应用中，Hessian矩阵的结构化假设可以显著降低计算复杂度，例如通过使用对角线近似或低秩近似。这些方法在机器学习中被广泛采用，如在AdaGrad和AdaDelta算法中。","本段强调了在大规模机器学习问题中，优化方法的选择和计算效率的重要性，以及如何通过结构化假设来简化Hessian矩阵的计算。"],"formulas":[],"uncertainties":["std","H","my has one student"],"diagram":"none","start":3462.3,"end":3632.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3462.3,"text":"So for example, if you're going to train a model in a stats package, a SciPy, something"},{"start":3467.78,"text":"like this, and you only have a couple of hundred features or something, or 20 features that"},{"start":3473.56,"text":"you're trying to regress out, which to be fair, 20 years ago was the most common use"},{"start":3478.3,"text":"case in stats then you would use newton or a variant called lbfgs which is a limited memory"},{"start":3483.54,"text":"kind of second order thing you would use those everywhere because you really cared about the"},{"start":3487.52,"text":"parameters the reason that i include this is to give that contrast because a lot of people maybe"},{"start":3492.5,"text":"not as much now but a lot of people come in with a kind of a background of stats and they're like"},{"start":3496.22,"text":"Like, oh, I'll just solve these models"},{"start":3497.38,"text":"with these great optimizations."},{"start":3498.89,"text":"techniques and those optimization techniques indeed are great but they require different scaling and really what this is is an excuse to kind of beat this again and again that really we're interested in these regimes in machine learning where n the number of data points is huge and d the number of dimensions are huge and that's a very weird space and so you end up with relatively crazy things and the problems that we care about but if you ask a social scientist they're like they would never in a million years use std it'd be too noisy too hard to tune"},{"start":3525.9,"text":"Newton's method doesn't have step sizes. Why not just press the button and it works? It runs before I even think about it. So it does get used quite a bit more over on those kinds of problems. Wonderful question. Other questions? Please."},{"start":3541.44,"text":"Can it be cheaper to compute if you have some structure, like ? Yeah. Are there any cases that you have ? Yeah. I feel like I paid you to say this, but OK. So anyway, so the question was, are there any cases where you have some structured in H? And it's like, I don't know, maybe like my has one student."},{"start":3562.14,"text":"who now works at Emeta, was his whole thesis was about when you could have structured matrices and Hessians that allow you to do something that's smarter. It turns out that you don't have to compute the full Hessian. This is not relevant for the course, so please don't listen."},{"start":3574.67,"text":"But I'm going to answer your question because I like it. The thing is, it turns out that you don't have to compute the full Hessian, but you have to compute Hessian vector dot products, and those can be cheaper. If you know the Hessian has some form, or you're willing to assume it has some form, then you do something in it. It's not really Newton's method any longer, but you have some second-order information. That actually is used in machine learning. So that was the inspiration behind John and Yoram's algorithm, which is called AdaGrad, what they were doing in AdaDelta, where they were trying to estimate a little bit of what is called curvature information, which tells you"},{"start":3604.01,"text":"you how much should I trust a step in every direction. The Hessian isn't something mysterious. It's just saying like, look, if there's a really big difference in this direction versus a really small one in this direction, I should probably step more in the directions I care about. That's roughly all that's going on. So you can simulate that by assuming H has some structure. Maybe it's diagonal. Diagonal is super cheap. That's what they were doing. You can do diagonal plus low rank. That's another thing. Or you can assume that it compresses well, which is what people were doing in what's called sketching. And so yes, that all comes up. So those..."}],"speech_gaps":[],"frame":"../frames/v042/021.webp","frame_time":3474.3},{"title":"加权最小二乘与优化方法","segments":[{"id":341,"text":"A family of algorithms are still widely used. And in fact, they form the basis of what we do. In fact, Adam can be looked at as kind of a combination. Adam is the most popular optimizer as a combination of those ideas with what's called momentum, which is another idea. They use Poliak momentum, but it doesn't matter. But yeah, so that is exactly right. So it does come up. I don't mean to say it doesn't come up, but Newton, the core Newton method is not widely used in machine learning.","start":3633.23,"end":3655.21},{"id":342,"text":"Excellent question. The ideas are important. I'm not telling you things that I don't think the ideas. So maybe that should be the baseline. If I'm telling you, I think you should know it. But yeah, it is used, but it's used a little bit more circuitously or indirectly that we don't have a segment on optimization because I think it makes people's eyes bleed. Well, I'm super happy to talk about it. I worked on it for a long, long time. Other questions? These are great, phenomenal questions. That's no indifferent. All right.","start":3655.8,"end":3684.56},{"id":343,"text":"Okay, so that's all I wanted to get through today because we're going to start to do something that's in a different segment next time. So we saw the differences between classification and regression. We learned about this principle for probabilistic interpretation, which is maximum likelihood. That principle is absolutely key and critical. That's the thing that's going to scale from one model to the next model. Next time, what we're going to see is how we extend that to what are called generalized linear models. They have much more complicated link functions, much more complicated stuff underneath the covers, but they cover a huge fraction","start":3685.48,"end":3714.8},{"id":344,"text":"of machine learning. And it took a while to figure that out. We derive logistic regression. And then this will be used in the next lecture. And we saw Newton's method. And I think I accidentally cut off and threw away the multi-class stuff. So I will make sure to bring that back.","start":3714.86,"end":3727.64}],"notes":["本段主要讨论了优化方法，特别是Adam和牛顿法在机器学习中的应用。讲者指出Adam是结合动量思想的优化器，而牛顿法虽然在理论上重要，但在实际中并不广泛使用。","讲者回应了一个关于优化方法重要性的问题，强调了这些概念的基础性，并提到虽然牛顿法在某些情况下被使用，但通常以更间接的方式出现，因此课程中没有专门的优化部分。","接下来的课程内容将转向广义线性模型，这是对最大似然原理的扩展。广义线性模型具有更复杂的链接函数和内部结构，但它们在机器学习中占据很大一部分。","讲者提到在推导逻辑回归时，已经涉及了牛顿法，并指出在讲解过程中可能遗漏了多类分类的内容，承诺在后续课程中补充。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3633.23,"end":3727.64,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3633.23,"text":"family of algorithms are still widely used. And in fact, they form the basis of what we do. In fact, Adam, you can look at as kind of a combination. Adam is the most popular optimizer as a combination of those ideas with what's called momentum, which is another idea. They use Poliak momentum, but it doesn't matter. But yeah, so that is exactly right. So it does come up. I don't mean to say it doesn't come up, but Newton, the core Newton method is not widely used in machine learning."},{"start":3655.8,"text":"Excellent question. The ideas are important. I'm not telling you things that I don't think the ideas. So maybe that should be the baseline. If I'm telling you, I think you should know it. But yeah, it is used, but it's used a little bit more circuitously or indirectly that we don't have a segment on optimization because I think it makes people's eyes bleed. Well, I'm super happy to talk about it. I worked on it for a long, long time. Other questions? These are great, phenomenal questions. That's no indifferent. All right."},{"start":3685.48,"text":"Okay, so that's all I wanted to get through today because we're going to start to do something that's in a different segment next time. So we saw the differences between classification and regression. We learned about this principle for probabilistic interpretation, which is maximum likelihood. That principle is absolutely key and critical. That's the thing that's going to scale from one model to the next model. Next time, what we're going to see is how we extend that to what are called generalized linear models. They have much more complicated link functions, much more complicated stuff underneath the covers, but they cover a huge fraction"},{"start":3714.86,"text":"of machine learning. And it took a while to figure that out. We derive logistic regression. And then this will be used in the next lecture. And we saw Newton's method. And I think I accidentally cut off and threw away the multi-class stuff. So I will make sure to bring that back."}],"speech_gaps":[],"frame":"../frames/v042/022.webp","frame_time":3645.23}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
