d":2788.09},{"id":240,"text":"So what did we learn? We used the principle of maximum likelihood in a probabilistic model to extend this work to classification. We developed logistic regression from this principle. It's extremely widely used today. This is a model that, as I said, you've probably used or used a product that has logistic regression or what's called softmax inside of it.","zh":"我们学到了什么？我们在概率模型中使用了最大似然原理，将这项工作扩展到分类任务中。我们从这一原理出发，发展出了逻辑回归。它在当今被广泛使用。这是一个模型，正如我所说，你可能已经使用过，或者使用过包含逻辑回归或称为softmax的产品的软件。","start":2791.25,"end":2809.19},{"id":241,"text":"Important for me is you've seen this principle. Next lecture, what we're going to do is we're going to take that same principle and we're going to run it on more complicated distributions. And again, this part of the crank is going to be very useful for us. Don't worry, you'll see it again. Take model the probability distribution, take kind of logs to put it in the nice form. We'll talk about what the nice form is, and then we'll run gradient descent. And then you can run all that back-end magic that we care about and love.","zh":"对我而言，重要的是你已经看到了这一原理。下一次课，我们将做的是使用同样的原理，将其应用于更复杂的分布。同样，这一部分的推导对我们来说将非常有用。别担心，你还会再次看到它。对概率分布进行建模，取对数将其转换为一种整洁的形式。我们将讨论什么是这种整洁的形式，然后进行梯度下降。之后，你就可以运行我们关心并喜爱的所有后端魔法。","start":2810.39,"end":2832.77},{"id":242,"text":"This is the familiar pattern and hopefully it's intuitive that it gets into this misprediction","zh":"这是熟悉的模式，希望你能直观地理解它会进入这种误预测","start":2835.0,"end":2839.14},{"id":243,"text":"form. I skipped over that a little bit but that was what I was talking about in the slide that","zh":"形式。我稍微跳过了这一点，但这就是我在幻灯片中所谈论的内容","start":2839.14,"end":2842.86},{"id":244,"text":"you get this y minus h theta thing going on. It will turn out that almost all the models we","zh":"你得到了这种 y 减去 h theta 的情况。结果会发现，我们在这门课程前几部分考虑的几乎所有模型都有这种形式，希望这能让你直观地理解。","start":2842.86,"end":2847.42},{"id":245,"text":"consider in this first couple part of the course have that form and hopefully that's intuitive.","zh":"梯度下降中并没有什么神秘之处。它只是一个一阶近似","start":2847.42,"end":2851.04},{"id":246,"text":"There's nothing mysterious going on in gradient descent. It's just a first order approximation","zh":"梯度下降中并没有什么神秘之处。它只是一个一阶近似","start":2851.4,"end":2855.7},{"id":247,"text":"that says I take x, I predict it, I see where my error is, that's the information I have and then","zh":"这意味着我取一个x，我进行预测，我看到我的误差在哪里，这就是我所拥有的信息，然后","start":2855.7,"end":2862.06},{"id":248,"text":"I take a step in a direction and usually that direction is in the direction of the data. Boom,","zh":"我在某个方向上迈出一步，通常这个方向是数据的方向。 Boom，","start":2862.06,"end":2867.14},{"id":249,"text":"done. Okay, all right. Okay, so with our last little bit, I want to show you one little bit","zh":"完成。好的，好的。好的，通过我们刚才的简短内容，我想向你们展示一点优化方法，即牛顿法。在这里，它只是另一种优化方法。","start":2867.22,"end":2876.02},{"id":250,"text":"of optimization, which is Newton's method. And here, it's just a different optimization. We're","zh":"我们在课程中不会过多使用这种方法。不过对于逻辑回归来说，我应该说，","start":2876.02,"end":2882.3},{"id":251,"text":"not going to use it that much in the course. For logistic regression though, I should say,","zh":"有些有趣的事情，在机器学习的很长一段时间里，逻辑回归绝对是基础的主力方法。","start":2882.3,"end":2885.7},{"id":252,"text":"so something that's interesting, there was a while in machine learning a long time ago","zh":"这在PyTorch和其他工具出现之前","start":2885.84,"end":2889.1},{"id":253,"text":"where logistic regression was absolutely the vanilla workhorse.","zh":"有一段时间，逻辑回归是绝对的基础工作马。","start":2889.1,"end":2892.86},{"id":254,"text":"This was before PyTorch and all the rest,","zh":"这在PyTorch和其他工具出现之前","start":2893.0,"end":2895.48},{"id":255,"text":"TensorFlow, all those other tools, JAX.","zh":"TensorFlow，所有那些其他工具，JAX。","start":2896.18,"end":2897.86},{"id":256,"text":"What people would do is they would take logistic regression","zh":"人们会做的事情是他们会使用逻辑回归","start":2898.24,"end":2900.7},{"id":257,"text":"and they would add in huge numbers of features","zh":"并添加大量的特征","start":2900.7,"end":2902.92},{"id":258,"text":"so they'd have very, very high features.","zh":"因此他们会拥有非常非常多的特征。","start":2902.92,"end":2904.72},{"id":259,"text":"And you could take those Xs that we talked about,","zh":"你可以使用我们之前讨论过的那些X值，","start":2904.84,"end":2906.98},{"id":260,"text":"instead of putting them in low dimensions","zh":"而不是将它们放在低维空间中","start":2907.02,"end":2908.38},{"id":261,"text":"where you'd have house prices and all these other things,","zh":"比如房屋价格和其他这些变量，","start":2908.38,"end":2911.16},{"id":262,"text":"they would take random hashes of them.","zh":"他们会使用这些值的随机哈希。","start":2911.34,"end":2913.08},{"id":263,"text":"They would just make them, they would explode them.","zh":"他们只是制造它们，然后引爆它们。","start":2913.26,"end":2914.84},{"id":264,"text":"There's a beautiful paper written by a dear friend","zh":"有一篇由一位 dear friend（挚友）撰写的美丽论文","start":2914.92,"end":2916.48},{"id":265,"text":"about what are called random features,","zh":"关于所谓的随机特征，","start":2916.48,"end":2917.94},{"id":266,"text":"features, which are unbelievable, kind of what we call, we'll find out what kernels","zh":"这些特征令人难以置信，我们稍后会发现它们与核函数（kernels）有关。","start":2917.94,"end":2921.5},{"id":267,"text":"are later. But these unbelievable infinite dimensional feature spaces. So it's an extremely","zh":"这些令人难以置信的无限维特征空间。因此，这是一个极其强大的模型，你可以将大量信息放入其中。","start":2921.5,"end":2926.38},{"id":268,"text":"powerful model, you can put a lot into there. Solving those models, especially in statistics,","zh":"在统计学中求解这些模型时，","start":2926.38,"end":2931.18},{"id":269,"text":"you can because it's convex underneath the covers, we won't really we won't prove that.","zh":"你可以做到，因为其本质上是凸的，我们不会真正证明这一点。","start":2931.6,"end":2935.68},{"id":270,"text":"but you can find the right situation.","zh":"但你可以找到合适的情况。","start":2935.68,"end":2937.46}],"notes":["本段主要讲解了加权最小二乘法的基本思想，强调了模型中将复杂性集中在推断过程中的特点。讲者指出，虽然推导过程可能看起来复杂，但可以通过代数运算完成，且可以离线处理，无需过多关注细节。","讲者提到，最大似然原理被用于扩展到分类任务，从而发展出逻辑回归模型。逻辑回归是当前广泛使用的模型之一，许多产品内部都使用了该模型或其变体softmax。","接下来的课程将使用同样的最大似然原理，但应用于更复杂的分布。讲者指出，这部分推导过程对理解后续内容非常重要，但不会在此详细展开。","讲者强调，梯度下降法本质上是一个一阶近似方法，通过计算误差并调整参数来逐步优化模型。这个过程直观且易于理解，不需要复杂的数学推导。","讲者提到，牛顿法是一种不同的优化方法，虽然在课程中不会频繁使用，但在逻辑回归中仍有其应用价值。讲者还提到，在深度学习工具出现之前，逻辑回归曾是机器学习中的基础模型。","讲者进一步说明，为了处理高维数据，人们会添加大量特征，甚至使用随机特征（random features）来构建无限维的特征空间。这种方法在统计学中非常强大，且在某些情况下具有凸性，便于求解。"],"formulas":[],"uncertainties":["form","h theta","convex underneath the covers"],"diagram":"none","start":2766.73,"end":2937.46,"asr_flags":[],"translation_complete":true,"translated_segments":32,"raw_segments":[{"start":2766.73,"text":"is very common and it's nice that these models have it. So all the nastiness is put into infer on the point, look at the data point difference, and then do an update. It's quite remarkable. Not obvious. Derived here with a bunch of just algebra, just algebra to go from here to here. Don't worry too much about it. You can do it offline. I'm not going to torture with it at the moment."},{"start":2791.25,"text":"So what did we learn? We used the principle of maximum likelihood in a probabilistic model to extend this work to classification. We developed logistic regression from this principle. It's extremely widely used today. This is a model that, as I said, you've probably used or used a product that has logistic regression or what's called softmax inside of it."},{"start":2810.39,"text":"Important for me is you've seen this principle. Next lecture, what we're going to do is we're going to take that same principle and we're going to run it on more complicated distributions. And again, this part of the crank is going to be very useful for us. Don't worry, you'll see it again. Take model the probability distribution, take kind of logs to put it in the nice form. We'll talk about what the nice form is, and then we'll run gradient descent. And then you can run all that back-end magic that we care about and love."},{"start":2835.0,"text":"This is the familiar pattern and hopefully it's intuitive that it gets into this misprediction"},{"start":2839.14,"text":"form. I skipped over that a little bit but that was what I was talking about in the slide that"},{"start":2842.86,"text":"you get this y minus h theta thing going on. It will turn out that almost all the models we"},{"start":2847.42,"text":"consider in this first couple part of the course have that form and hopefully that's intuitive."},{"start":2851.4,"text":"There's nothing mysterious going on in gradient descent. It's just a first order approximation"},{"start":2855.7,"text":"that says I take x, I predict it, I see where my error is, that's the information I have and then"},{"start":2862.06,"text":"I take a step in a direction and usually that direction is in the direction of the data. Boom,"},{"start":2867.22,"text":"done. Okay, all right. Okay, so with our last little bit, I want to show you one little bit"},{"start":2876.02,"text":"of optimization, which is Newton's method. And here, it's just a different optimization. We're"},{"start":2882.3,"text":"not going to use it that much in the course. For logistic regression though, I should say,"},{"start":2885.84,"text":"so something that's interesting, there was a while in machine learning a long time ago"},{"start":2889.1,"text":"where logistic regression was absolutely the vanilla workhorse."},{"start":2893.0,"text":"This was before PyTorch and all the rest,"},{"start":2896.18,"text":"TensorFlow, all those other tools, JAX."},{"start":2898.24,"text":"What people would do is they would take logistic regression"},{"start":2900.7,"text":"and they would add in huge numbers of features"},{"start":2902.92,"text":"so they'd have very, very high features."},{"start":2904.84,"text":"And you could take those Xs that we talked about,"},{"start":2907.02,"text":"instead of putting them in low dimensions"},{"start":2908.38,"text":"where you'd have house prices and all these other things,"},{"start":2911.34,"text":"they would take random hashes of them."},{"start":2913.26,"text":"They would just make them, they would explode them."},{"start":2914.92,"text":"There's a beautiful paper written by a dear friend"},{"start":2916.48,"text":"about what are called random features,"},{"start":2917.94,"text":"features, which are unbelievable, kind of what we call, we'll find out what kernels"},{"start":2921.5,"text":"are later. But these unbelievable infinite dimensional feature spaces. So it's an extremely"},{"start":2926.38,"text":"powerful model, you can put a lot into there. Solving those models, especially in statistics,"},{"start":2931.6,"text":"you can because it's convex underneath the covers, we won't really we won't prove that."},{"start":2935.68,"text":"but you can find the right situation."}],"speech_gaps":[],"frame":"../frames/v042/017.webp","frame_time":2778.73},{"title":"加权最小二乘与牛顿法","segments":[{"id":271,"text":"Now remember when we talked about before, I said if you change, when we were discussing about the sigma squared, talked about if you changed a parameter and then all of a sudden the model changed, you should be very uncomfortable with the model. And I will just tell you as a historical note, machine learning people were very uncomfortable when they would run a procedure and get one theta, then they'd run another procedure and get another theta.","zh":"现在请记住我们之前讨论过的内容，我说过如果你改变了一个参数，然后模型突然发生了变化，你应该对这个模型感到非常不安。作为一个历史性的注记，机器学习研究者们在运行一个过程得到一个θ值，再运行另一个过程得到另一个θ值时，也会感到非常不安。","start":2938.9,"end":2957.78},{"id":272,"text":"It turns out that machine learning people realize we don't really care about theta as the object. What we care about is h of theta, the predictions we make with it. Okay, so I'm going to show you this because it is historically quite important, but what we care about now when we talk about stability is more on the prediction space than on what we would call sometimes a certificate or the parameter space. Okay. Alright, so in Newton's method, let's discuss it. It's a simple method if you haven't seen it before, but show of hands who knows Newton's method?","zh":"事实上，机器学习研究者们意识到我们并不真正关心θ这个对象。我们关心的是h(θ)，也就是我们用它做出的预测。好的，所以我将向你们展示这一点，因为它在历史上非常重要。但现在当我们谈论稳定性时，我们更关注的是预测空间，而不是有时称为证书或参数空间的内容。好的。那么，让我们讨论牛顿法。如果你之前没有见过这个方法，它是一个简单的方法，但请举手告诉我有多少人知道牛顿法？","start":2959.95,"end":2985.44},{"id":273,"text":"Okay, pretty good. All right, so we're given here an F. We want to find the zero. We typically apply this to likelihood functions. We take the gradient of theta, right? So we want to find a stationary point, right? We want to find some place where the gradient is equal to zero. So we use it on that piece, but we'll talk about it in full generality. Okay, so how does it work? It's an extremely simple method, which is pretty nice.","zh":"好的，相当不错。那么，我们这里有一个F。我们想要找到零点。我们通常将这种方法应用于似然函数。我们对θ求梯度，对吧？因此，我们想要找到一个平稳点，对吧？我们想要找到一个梯度等于零的地方。因此，我们在这个部分使用它，但我们将以更一般的方式讨论它。好的，那么它是如何工作的？这是一个极其简单的方法，这非常不错。","start":2986.16,"end":3014.92},{"id":274,"text":"All right, so let's say we have our function here. We have some function that we want to try and find the zero of. So here's where the zero is. We start with an initial guess to iterative like all the methods we've drawn. So I'll call that theta zero. And this point here will be f of theta zero. All right, so far so good. Now, what we compute is the gradient again.","zh":"好的，那么假设我们有一个函数在这里。我们想要尝试找到它的零点。这里就是零点的位置。我们从一个初始猜测开始，像我们之前画的所有方法一样进行迭代。我将这个初始猜测称为θ₀。这个点在这里是f(θ₀)。到目前为止一切顺利。现在，我们再次计算梯度。","start":3016.17,"end":3048.52},{"id":275,"text":"this gradient character. Okay, and our method, the idea is, is that we want to find the zero. And what we're going to do is we're going to use this local linear model, this line here. So what is the slope of this line? Well, the slope of the line here is going to be the gradient. So this function here, which I'll call t of theta,","zh":"这个梯度的特性。好的，我们的方法的思路是，我们要找到零点。我们将使用这个局部线性模型，也就是这里的这条线。那么这条线的斜率是多少？这条线的斜率将是梯度。因此，我将这个函数称为t(θ)，","start":3051.33,"end":3068.28},{"id":276,"text":"So as I move back and forth on theta, I move up and down this line. Well, what's the equation for that line? Well, it's the Taylor's approximation. So it is f of theta zero, because that's this point here, plus, and then I'll do something like the gradient of f of theta zero times theta minus theta zero. This is the Taylor's approximation. And then what I want to do is I want to set this so that t of theta","zh":"因此，当我围绕theta来回移动时，我沿着这条线上下移动。那么这条线的方程是什么呢？它是泰勒近似。因此，它是f在theta零处的值，因为这就是这里的这个点，加上，然后我会做类似f在theta零处的梯度乘以theta减去theta零。这就是泰勒近似。然后我想做的是将这个表达式设置为零，即t(theta)等于零。因此，我想沿着这条线上下移动，并得到其零点的估计。","start":3069.58,"end":3095.95},{"id":277,"text":"is equal to zero. So I want to move up and down this line, and I want to get its guess of zero.","zh":"我不知道。我无法确定f在哪里。我只拥有局部信息。","start":3097.1,"end":3102.62},{"id":278,"text":"I don't know. I can't figure out where f is. I only have this local information.","zh":"这是我目前最好的局部估计。现在，这与随机梯度下降不同。","start":3105.2,"end":3108.22},{"id":279,"text":"This is my best local guess. Now, this is different than stochastic gradient descent","zh":"因为在随机梯度下降中，我只会查看梯度，查看方向，","start":3108.48,"end":3113.34},{"id":280,"text":"because in stochastic gradient descent, I would just look at the gradient, look at the direction,","zh":"因为在随机梯度下降中，我只会查看梯度，查看方向，","start":3114.78,"end":3118.02}],"notes":["本段讲解了牛顿法的基本思想，即通过局部线性模型来寻找函数的零点。讲者提到，牛顿法使用泰勒展开来近似函数，通过计算梯度和函数值来构造一条直线，然后在该直线上寻找零点。这种方法依赖于局部信息，因此只能提供一个局部的估计。","讲者指出，牛顿法与随机梯度下降法不同，后者仅依赖于梯度的方向，而牛顿法则利用了二阶信息（梯度和Hessian矩阵），从而在局部范围内更精确地逼近零点。","在牛顿法的实现中，讲者强调了初始猜测的重要性，因为该方法对初始值非常敏感。如果初始猜测远离真实解，可能会导致算法无法收敛。","讲者提到，牛顿法在寻找函数的零点时，会使用泰勒展开式来构造一个线性近似，然后通过求解该线性方程来更新参数。这种方法在局部范围内是有效的，但需要保证函数在该区域内的可微性和凸性。","讲者还指出，牛顿法在实际应用中可能面临一些挑战，例如计算Hessian矩阵的逆矩阵可能很耗时，或者当Hessian矩阵不可逆时，该方法可能无法使用。","最后，讲者提到牛顿法与随机梯度下降法在方法论上的区别，强调了牛顿法在局部优化中的优势，但也指出其对初始值和函数性质的依赖性。"],"formulas":[{"latex":"f(\\theta) \\text{ 的泰勒展开为 } f(\\theta_0) + \\nabla f(\\theta_0)^T (\\theta - \\theta_0)","symbols":"f(θ) 是目标函数，θ₀ 是初始猜测，∇f(θ₀) 是梯度，θ 是更新后的参数","explanation":"公式正确表达了泰勒展开的局部线性近似，适用于牛顿法的迭代过程。","evidence":"So as I move back and forth on theta, I move up and down this line. Well, what's the equation for that line? Well, it's the Taylor's approximation. So it is f of theta zero, because that's this point here, plus, and then I'll do something like the gradient of f of theta zero times theta minus theta zero. This is the Taylor's approximation. And then what I want to do is I want to set this so that t of theta"}],"uncertainties":["t of theta 的具体定义和用途未明确说明","讲者提到的 'local linear model' 的具体形式和实现细节未明确","讲者提到的 'local information' 的具体含义和范围未明确"],"diagram":"none","start":2938.9,"end":3118.02,"asr_flags":[],"math_clarifications":["公式中的泰勒展开是牛顿法的核心思想，用于在当前点附近构造线性近似，从而找到函数的零点。"],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":2938.9,"text":"Now remember when we talked about before, I said if you change, when we were discussing about the sigma squared, talked about if you changed a parameter and then all of a sudden the model changed, you should be very uncomfortable with the model. And I will just tell you as a historical note, machine learning people were very uncomfortable when they would run a procedure and get one theta, then they'd run another procedure and get another theta."},{"start":2959.95,"text":"It turns out that machine learning people realize we don't really care about theta as the object. What we care about is h of theta, the predictions we make with it. Okay, so I'm going to show you this because it is historically quite important, but what we care about now when we talk about stability is more on the prediction space than on what we would call sometimes a certificate or the parameter space. Okay. Alright, so in Newton's method, let's discuss it. It's a simple method if you haven't seen it before, but show of hands who knows Newton's method?"},{"start":2986.16,"text":"Okay, pretty good. All right, so we're given here an F. We want to find the zero. We typically apply this to likelihood functions. We take the gradient of theta, right? So we want to find a stationary point, right? We want to find some place where the gradient is equal to zero. So we use it on that piece, but we'll talk about it in full generality. Okay, so how does it work? It's an extremely simple method, which is pretty nice."},{"start":3016.17,"text":"All right, so let's say we have our function here. We have some function that we want to try and find the zero of. So here's where the zero is. We start with an initial guess to iterative like all the methods we've drawn. So I'll call that theta zero. And this point here will be f of theta zero. All right, so far so good. Now, what we compute is the gradient again."},{"start":3051.33,"text":"this gradient character. Okay, and our method, the idea is, is that we want to find the zero. And what we're going to do is we're going to use this local linear model, this line here. So what is the slope of this line? Well, the slope of the line here is going to be the gradient. So this function here, which I'll call t of theta,"},{"start":3069.58,"text":"So as I move back and forth on theta, I move up and down this line. Well, what's the equation for that line? Well, it's the Taylor's approximation. So it is f of theta zero, because that's this point here, plus, and then I'll do something like the gradient of f of theta zero times theta minus theta zero. This is the Taylor's approximation. And then what I want to do is I want to set this so that t of theta"},{"start":3097.1,"text":"is equal to zero. So I want to move up and down this line, and I want to get its guess of zero."},{"start":3105.2,"text":"I don't know. I can't figure out where f is. I only have this local information."},{"start":3108.48,"text":"This is my best local guess. Now, this is different than stochastic gradient descent"},{"start":3114.78,"text":"because in stochastic gradient descent, I would just look at the gradient, look at the direction,"}],"speech_gaps":[],"frame":"../frames/v042/018.webp","frame_time":2950.9},{"title":"牛顿法与伪逆矩阵","segments":[{"id":281,"text":"and take a small step here. This is telling me exactly how far to go. So it doesn't have a step","zh":"并且在这里采取一个小的步骤。这告诉我确切需要走多远。因此，它没有步长","start":3118.08,"end":3124.34},{"id":282,"text":"size, which is quite a nice property of it. One of the reasons people like it so much.","zh":"的大小，这相当是一个很好的性质。人们如此喜欢它的其中一个原因。","start":3124.34,"end":3127.92},{"id":283,"text":"It also converges fast when it converges. So when we have this equation here, t theta,","zh":"当它收敛时，它也收敛得很快。因此，当我们有这里的方程 t theta，","start":3129.0,"end":3133.82},{"id":284,"text":"how does it work? Well, let's solve this. This is basically going to say that I'm going to take","zh":"它是如何工作的呢？好吧，让我们来解这个方程。这基本上意味着我要取","start":3134.18,"end":3139.22},{"id":285,"text":"f of theta zero. I'm going to divide it by, I'm going to say here, let's imagine this is a scalar","zh":"f of theta zero。我要把它除以，我在这里说，让我们暂时假设这是一个标量","start":3139.6,"end":3145.4},{"id":286,"text":"for the moment just to make my life easier. I'll come back to what we would do otherwise.","zh":"以便让我的生活更容易。我会回到其他情况下的处理方式。","start":3145.4,"end":3148.36},{"id":287,"text":"minus, equal, or plus, or equals theta minus theta zero. And indeed I get here","zh":"减去，等于，或加上，或等于 theta 减去 theta zero。而确实，我在这里得到","start":3150.9,"end":3158.08},{"id":288,"text":"that this is going to be theta, out of things, theta zero minus f of theta zero","zh":"这将是 theta，从这些事情中，theta zero 减去 f of theta zero","start":3158.08,"end":3165.64},{"id":289,"text":"over f prime of theta zero, okay? That's going to be equal to my theta next. I'll","zh":"除以 f 在 theta 零处的导数，对吧？这将等于我的下一个 theta。我会称这个为 theta t 或者其他什么，对吧？所以猜测就是我往下走，","start":3165.64,"end":3170.6},{"id":290,"text":"call this, you know, theta t or something, okay? So the guess is just I go down here,","zh":"沿着使这条线与零相交的距离走，然后重复。现在，牛顿法的一个优点，顺便提一下。好的，所以我把它设为零。如果这是高维的，我会怎么做？有人记得吗？","start":3170.6,"end":3175.82},{"id":291,"text":"I walk by the distance that makes this line intersect zero, and I repeat. Now the good","zh":"如果它是标量，我可以在这里做这个除法。真正重要的是什么？发生了什么？哦，请了。太棒了。是的，一个想法是，如果这个方法是，如果 f 是合适的类型，例如它是梯度，而梯度是从 fd 到 fd 的，","start":3175.82,"end":3182.58},{"id":292,"text":"thing about Newton's method, just as an aside. Okay, so I set it equal to zero. What do I do","zh":"那么梯度的梯度就是海森矩阵，对吧？这个海森矩阵","start":3182.58,"end":3188.2},{"id":293,"text":"if this is higher dimensional? Anyone remember? So if it's a scalar, I can go and do this division","zh":"就是梯度的梯度，对吧？这个海森矩阵","start":3188.2,"end":3194.96},{"id":294,"text":"here. What really matters? What happened? Oh please. Awesome. Yeah, so one idea would be if","zh":"就是梯度的梯度，对吧？这个海森矩阵","start":3194.96,"end":3206.52},{"id":295,"text":"this method were, if f were of the right type, for example it was a gradient and a gradient has a","zh":"就是梯度的梯度，对吧？这个海森矩阵","start":3206.52,"end":3211.96},{"id":296,"text":"type of going from say fd to fd, then the gradient of the gradient is the Hessian, right? That Hessian","zh":"从比如说fd到fd类型的转换，那么梯度的梯度就是Hessian，对吧？那个Hessian","start":3211.96,"end":3219.34},{"id":297,"text":"is square, hopefully I can invert it and find the place where it's equal to zero.","zh":"它是方阵，我希望可以对其进行求逆，并找到等于零的位置。","start":3219.34,"end":3225.08},{"id":298,"text":"We'll write that down in one second. But more correct, more intuitively, basically what this","zh":"我们稍后会写下这个表达式。但更准确地说，更直观地说，这基本上是在说，","start":3226.74,"end":3232.3},{"id":299,"text":"says, and this is a question, it says if I have this vector, I basically have a vector times a","zh":"这句话，这是一个问题，它说如果我有一个向量，我基本上有一个向量与","start":3232.3,"end":3236.54},{"id":300,"text":"dot product here, and that dot product has to be equal to f0, has to equal to minus f0. So among","zh":"这里的点积，而这个点积必须等于 f0，必须等于负的 f0。因此，在","start":3236.54,"end":3242.88},{"id":301,"text":"all, if I imagine a higher dimensional surface, I have to find among all the points that are there,","zh":"所有情况下，如果我想象一个更高维的曲面，我必须在所有存在的点中找到","start":3242.88,"end":3248.38},{"id":302,"text":"And there could be many because the null space is large.","zh":"并且可能存在很多这样的点，因为零空间很大。","start":3248.38,"end":3250.78},{"id":303,"text":"Are these terms familiar to you?","zh":"这些术语你们熟悉吗？","start":3250.98,"end":3252.12},{"id":304,"text":"By show of hands, who knows what I mean when I say null space?","zh":"举手示意，谁知道我说的零空间是什么意思？","start":3252.82,"end":3254.56},{"id":305,"text":"Right. Good. Awesome. Then I just have to find something there among all those that gets there. And the answer is that I don't just use the inverse. I use the pseudo-inverse because it may not be actually perfectly invertible. And the pseudo-inverse in particular, it's called the Penrose pseudo-inverse, does it exactly. It handles all of these cases directly. If you remember the little dagger, that's what's going on under the covers. Overdetermined, underdetermined. If it's overdetermined, what do you do? Any guesses?","zh":"对的。很好。太棒了。那么我只需要在所有这些中找到一个能够到达那里的东西。答案是，我不仅仅使用逆矩阵。我使用伪逆矩阵，因为它可能并不完全可逆。特别是所谓的Penrose伪逆矩阵，它能够直接处理所有这些情况。如果你还记得那个小 dagger 符号，这就是其背后所发生的事情。无论是超定还是欠定的情况。如果它是超定的，你会怎么做？有任何猜测吗？","start":3255.21,"end":3283.47}],"notes":["本段讲解了牛顿法的基本思想，即通过计算函数在某一点的导数来确定下一步的移动方向。牛顿法在收敛时速度较快，但需要计算函数的二阶导数（Hessian矩阵）。当函数是梯度时，Hessian矩阵是梯度的梯度，即二阶导数矩阵。"],"formulas":[{"latex":"\\theta = \\theta_0 - \\frac{f(\\theta_0)}{f'(\\theta_0)}","symbols":"\\theta 是下一个估计值，\\theta_0 是当前估计值，f(\\theta_0) 是函数在 \\theta_0 处的值，f'(\\theta_0) 是函数在 \\theta_0 处的导数","explanation":"公式正确，描述了牛顿法的一维更新规则，适用于可微函数的根寻找问题。","evidence":"minus, equal, or plus, or equals theta minus theta zero. And indeed I get here that this is going to be theta, out of things, theta zero minus f of theta zero over f prime of theta zero, okay? That's going to be equal to my theta next. I'll"}],"uncertainties":["可能无法准确判断讲者提到的 'fd to fd' 是否指代函数的梯度或导数的类型","讲者提到的 'null space' 是否指代线性方程组的解空间，还是其他数学概念"],"diagram":"none","start":3118.08,"end":3283.47,"asr_flags":[],"math_clarifications":["公式0正确描述了牛顿法的一维更新规则，适用于可微函数的根寻找问题。公式1和公式2未在原始文本中明确出现，因此未包含在输出中。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":3118.08,"text":"and take a small step here. This is telling me exactly how far to go. So it doesn't have a step"},{"start":3124.34,"text":"size, which is quite a nice property of it. One of the reasons people like it so much."},{"start":3129.0,"text":"It also converges fast when it converges. So when we have this equation here, t theta,"},{"start":3134.18,"text":"how does it work? Well, let's solve this. This is basically going to say that I'm going to take"},{"start":3139.6,"text":"f of theta zero. I'm going to divide it by, I'm going to say here, let's imagine this is a scalar"},{"start":3145.4,"text":"for the moment just to make my life easier. I'll come back to what we would do otherwise."},{"start":3150.9,"text":"minus, equal, or plus, or equals theta minus theta zero. And indeed I get here"},{"start":3158.08,"text":"that this is going to be theta, out of things, theta zero minus f of theta zero"},{"start":3165.64,"text":"over f prime of theta zero, okay? That's going to be equal to my theta next. I'll"},{"start":3170.6,"text":"call this, you know, theta t or something, okay? So the guess is just I go down here,"},{"start":3175.82,"text":"I walk by the distance that makes this line intersect zero, and I repeat. Now the good"},{"start":3182.58,"text":"thing about Newton's method, just as an aside. Okay, so I set it equal to zero. What do I do"},{"start":3188.2,"text":"if this is higher dimensional? Anyone remember? So if it's a scalar, I can go and do this division"},{"start":3194.96,"text":"here. What really matters? What happened? Oh please. Awesome. Yeah, so one idea would be if"},{"start":3206.52,"text":"this method were, if f were of the right type, for example it was a gradient and a gradient has a"},{"start":3211.96,"text":"type of going from say fd to fd, then the gradient of the gradient is the Hessian, right? That Hessian"},{"start":3219.34,"text":"is square, hopefully I can invert it and find the place where it's equal to zero."},{"start":3226.74,"text":"We'll write that down in one second. But more correct, more intuitively, basically what this"},{"start":3232.3,"text":"says, and this is a question, it says if I have this vector, I basically have a vector times a"},{"start":3236.54,"text":"dot product here, and that dot product has to be equal to f0, has to equal to minus f0. So among"},{"start":3242.88,"text":"all, if I imagine a higher dimensional surface, I have to find among all the points that are there,"},{"start":3248.38,"text":"And there could be many because the null space is large."},{"start":3250.98,"text":"Are these terms familiar to you?"},{"start":3252.82,"text":"By show of hands, who knows what I mean when I say null space?"},{"start":3255.21,"text":"Right. Good. Awesome. Then I just have to find something there among all those that gets there. And the answer is that I don't just use the inverse. I use the pseudo-inverse because it may not be actually perfectly invertible. And the pseudo-inverse in particular, it's called the Penrose pseudo-inverse, does it exactly. It handles all of these cases directly. If you remember the little dagger, that's what's going on under the covers. Overdetermined, underdetermined. If it's overdetermined, what do you do? Any guesses?"}],"speech_gaps":[{"start":3148.76,"end":3150.5}],"frame":"../frames/v042/019.webp","frame_time":3130.08},{"title":"加权最小二乘与优化方法比较","segments":[{"id":306,"text":"You have too many equations. So here it's underdetermined if I have a d-dimensional vector and only one equation in the parameters. What happens if it's overdetermined? I heard it. You use least squares. So it uses the same algorithm we had before. It basically does a least square solve to try and find out what's the best direction underneath the covers.","zh":"你有太多的方程。所以，如果我有一个d维向量，只有一个参数方程，这就属于欠定问题。如果它是超定的，会发生什么呢？我听说过。你会使用最小二乘法。所以它使用了我们之前用过的相同算法。它基本上执行一个最小二乘求解，试图找出底层的最佳方向。","start":3284.09,"end":3305.87},{"id":307,"text":"All right. So hopefully that's familiar and intuitive. If it's not, please ask questions. This was also exactly as was talked about. When we have vector-valued things, we'll use the Hessian, which is described here. It's just the matrix of partial derivatives of the laws. And this algorithm, when it converges, and it has a pretty good convergence guarantees, it gets a good local conversion guarantees, it's extremely efficient.","zh":"好的。希望这对你来说是熟悉且直观的。如果不是，请提问。这正是之前讨论过的内容。当我们处理向量值问题时，我们会使用Hessian矩阵，这里描述了它。它就是这些定律的偏导数矩阵。当这个算法收敛时，它具有相当好的收敛保证，能够获得良好的局部收敛保证，效率非常高。","start":3307.95,"end":3329.79},{"id":308,"text":"In an optimization sense, it gives you many digits of precision every time it runs. Each one of those steps is actually zeroing in on it quite a bit. So why do we use SGD?","zh":"从优化的角度来看，它每次运行都能提供很多位的精度。每一步实际上都在逐步逼近目标。那么我们为什么使用随机梯度下降（SGD）呢？","start":3330.62,"end":3346.07},{"id":309,"text":"So it turns out that this is the main trick. So SGD has OD compute per step. Minibatch is B times D. This is the dimension that's underneath the covers. And it may take SGD many, many steps to do there because it's a really bad estimate from my last time. Remember, it just takes one term, guesses which direction to go, and takes a step in that direction. Minibatch is a little bit better. It takes a small collection of directions, executes and goes. Gradient descent.","zh":"结果发现，这是主要的技巧。SGD每一步的计算量是OD。小批量是B乘以D。这是底层的维度。它可能需要SGD进行很多、很多步才能完成，因为这是从我上次的经验来看一个非常差的估计。记住，它只使用一个项，猜测应该朝哪个方向走，然后在那个方向上迈出一步。小批量稍微好一点。它会收集一小部分方向，执行并前进。梯度下降。","start":3346.97,"end":3375.86},{"id":310,"text":"is a little bit better. It actually computes the gradient for what it's worth. It really computes the honest-to-God gradient, but it has to see all of the data points. And a lot of machine learning, N is absolutely, absolutely massive. And so is D. So for example, you want to train on every word on the internet, and you want to run a 10 billion or 100 billion or 1 trillion parameter model.","zh":"它稍微好一点。它实际上计算了它所值的梯度。它真正计算了真实的梯度，但必须看到所有的数据点。而在很多机器学习中，N绝对是非常大的。D也是如此。例如，你想要在互联网上的每一个词上进行训练，并运行一个100亿或1000亿或1万亿参数的模型。","start":3376.99,"end":3400.53},{"id":311,"text":"Well, that's a really big number, right?","zh":"这确实是一个非常大的数字，对吧？","start":3401.36,"end":3403.78},{"id":312,"text":"It's like a quadrillion steps.","zh":"这相当于一千万亿步。","start":3403.88,"end":3405.44},{"id":313,"text":"You're not going to do that.","zh":"你不会这么做。","start":3406.06,"end":3407.1},{"id":314,"text":"That's too many flops to make one estimate.","zh":"这样多的浮点运算量来做一个估计是不行的。","start":3407.18,"end":3408.86},{"id":315,"text":"Newton is much worse in this regard.","zh":"在这方面，牛顿法要糟糕得多。","start":3411.66,"end":3413.96},{"id":316,"text":"It's n times d squared plus d cubed.","zh":"它是 n 乘以 d 的平方加上 d 的立方。","start":3414.46,"end":3416.82},{"id":317,"text":"The d cubed is coming from the inversions and other things we were talking about.","zh":"d 的立方来自于我们之前讨论的求逆和其他操作。","start":3416.92,"end":3419.46},{"id":318,"text":"Here's where we're applying it to the loss.","zh":"这里我们把它应用到了损失函数上。","start":3419.72,"end":3422.14},{"id":319,"text":"You will do very few steps.","zh":"你只会进行非常少的步骤。","start":3423.42,"end":3425.2},{"id":320,"text":"What I would say, it's very statistically or optimization-wise, it's efficient.","zh":"我的看法是，从统计学或优化的角度来看，它是非常高效的。","start":3425.78,"end":3429.12},{"id":321,"text":"If you measure by steps, this annihilates the ones from before. But each one of those steps","zh":"如果你按步骤来衡量，它会彻底击败之前的那些方法。但每一个这样的步骤","start":3429.12,"end":3435.2},{"id":322,"text":"is extremely, extremely expensive. So as a result, this is just another way of saying","zh":"这极其、极其昂贵。因此，这只不过是另一种说法","start":3436.3,"end":3440.4},{"id":323,"text":"mini-match SGD is a workhorse of ML. And I believe you're going to have a homework where you compare","zh":"mini-match SGD 是机器学习中的常用方法。我相信你们将有一个作业要比较","start":3440.4,"end":3444.72},{"id":324,"text":"them. So I just wanted to make sure that you had actually seen the various different methods.","zh":"它们。所以我只是想确保你们确实看到了各种不同的方法。","start":3444.72,"end":3448.4},{"id":325,"text":"Is Newton's method used anywhere in classical statistics?","zh":"牛顿法在经典统计学中被使用过吗？","start":3456.8,"end":3461.94}],"notes":["本段讲解了在参数个数少于方程个数时，系统处于欠定状态，而当参数个数多于方程个数时，系统处于超定状态，此时通常使用最小二乘法进行求解。讲者提到，最小二乘法使用与之前相同的算法，通过最小化误差平方和来找到最佳解。","讲者提到，当处理向量值问题时，会使用Hessian矩阵，它是函数的二阶偏导数矩阵。该算法在收敛时具有良好的收敛性保证，并且计算效率很高。","讲者指出，虽然梯度下降法（Gradient Descent）在每一步计算梯度时需要遍历所有数据点，但在大规模数据集（如互联网上的所有单词）和高维模型（如100亿或1万亿参数模型）的情况下，这种方法的计算成本极高。","讲者提到，牛顿法的计算复杂度为n乘以d的平方加上d的立方，其中d的立方来自于矩阵求逆等操作。这表明牛顿法在大规模问题中计算成本更高。","讲者强调，虽然SGD在步骤数量上优于传统方法，但每一步的计算成本极高，因此在实际应用中需要权衡计算效率和精度。","讲者提到，SGD是机器学习中的重要工具，并且在后续的作业中会要求学生比较不同优化方法的优劣，以加深对各种方法的理解。"],"formulas":[],"uncertainties":["mini-match SGD 中的 'mini-match' 可能是 'mini-batch SGD' 的误听，需进一步确认"],"diagram":"none","start":3284.09,"end":3461.94,"asr_flags":[],"math_clarifications":["原始文本中未提及任何具体的数学公式，因此无法核对或保留任何公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":3284.09,"text":"You have too many equations. So here it's underdetermined if I have a d-dimensional vector and only one equation in the parameters. What happens if it's overdetermined? I heard it. You use least squares. So it uses the same algorithm we had before. It basically does a least square solve to try and find out what's the best direction underneath the covers."},{"start":3307.95,"text":"All right. So hopefully that's familiar and intuitive. If it's not, please ask questions. This was also exactly as was talked about. When we have vector-valued things, we'll use the Hessian, which is described here. It's just the matrix of partial derivatives of the laws. And this algorithm, when it converges, and it has a pretty good convergence guarantees, it gets a good local conversion guarantees, it's extremely efficient."},{"start":3330.62,"text":"In an optimization sense, it gives you many digits of precision every time it runs. Each one of those steps is actually zeroing in on it quite a bit. So why do we use SGD?"},{"start":3346.97,"text":"So it turns out that this is the main trick. So SGD has OD compute per step. Minibatch is B times D. This is the dimension that's underneath the covers. And it may take SGD many, many steps to do there because it's a really bad estimate from my last time. Remember, it just takes one term, guesses which direction to go, and takes a step in that direction. Minibatch is a little bit better. It takes a small collection of directions, executes and goes. Gradient descent."},{"start":3376.99,"text":"is a little bit better. It actually computes the gradient for what it's worth. It really computes the honest-to-God gradient, but it has to see all of the data points. And a lot of machine learning, N is absolutely, absolutely massive. And so is D. So for example, you want to train on every word on the internet, and you want to run a 10 billion or 100 billion or 1 trillion parameter model."},{"start":3401.36,"text":"Well, that's a really big number, right?"},{"start":3403.88,"text":"It's like a quadrillion steps."},{"start":3406.06,"text":"You're not going to do that."},{"start":3407.18,"text":"That's too many flops to make one estimate."},{"start":3411.66,"text":"Newton is much worse in this regard."},{"start":3414.46,"text":"It's n times d squared plus d cubed."},{"start":3416.92,"text":"The d cubed is coming from the inversions and other things we were talking about."},{"start":3419.72,"text":"Here's where we're applying it to the loss."},{"start":3423.42,"text":"You will do very few steps."},{"start":3425.78,"text":"What I would say, it's very statistically or optimization-wise, it's efficient."},{"start":3429.12,"text":"If you measure by steps, this annihilates the ones from before. But each one of those steps"},{"start":3436.3,"text":"is extremely, extremely expensive. So as a result, this is just another way of saying"},{"start":3440.4,"text":"mini-match SGD is a workhorse of ML. And I believe you're going to have a homework where you compare"},{"start":3444.72,"text":"them. So I just wanted to make sure that you had actually seen the various different methods."},{"start":3456.8,"text":"Is Newton's method used anywhere in classical statistics?"}],"speech_gaps":[{"start":3451.248,"end":3456.4}],"frame":"../frames/v042/020.webp","frame_time":3296.09},{"title":"加权最小二乘与优化方法","segments":[{"id":326,"text":"So for example, if you're going to train a model in a stats package, a SciPy, something","zh":"例如，如果你要在统计软件包如SciPy中训练一个模型，","start":3462.3,"end":3467.78},{"id":327,"text":"like this, and you only have a couple of hundred features or something, or 20 features that","zh":"你可能只有几百个特征，或者你试图去除的20个特征，","start":3467.78,"end":3473.56},{"id":328,"text":"you're trying to regress out, which to be fair, 20 years ago was the most common use","zh":"坦白说，20年前这是统计中最常见的用例，","start":3473.56,"end":3478.3},{"id":329,"text":"case in stats then you would use newton or a variant called lbfgs which is a limited memory","zh":"那时你会使用牛顿法或其变体L-BFGS，这是一种有限内存的二阶方法，你会在很多地方使用这些方法，因为你会非常关注参数。","start":3478.3,"end":3483.54},{"id":330,"text":"kind of second order thing you would use those everywhere because you really cared about the","zh":"我之所以包含这一点，是为了提供一个对比，因为很多人，尽管现在可能没有那么多了，","start":3483.54,"end":3487.52},{"id":331,"text":"parameters the reason that i include this is to give that contrast because a lot of people maybe","zh":"但很多人仍然带着统计学的背景而来，他们会说","start":3487.52,"end":3492.5},{"id":332,"text":"not as much now but a lot of people come in with a kind of a background of stats and they're like","zh":"比如，‘我只需要解决这些模型’","start":3492.5,"end":3496.22},{"id":333,"text":"Like, oh, I'll just solve these models","zh":"比如，哦，我就会解决这些模型","start":3496.22,"end":3497.38},{"id":334,"text":"with these great optimizations.","zh":"这些优化方法非常出色。","start":3497.38,"end":3498.48},{"id":335,"text":"techniques and those optimization techniques indeed are great but they require different scaling and really what this is is an excuse to kind of beat this again and again that really we're interested in these regimes in machine learning where n the number of data points is huge and d the number of dimensions are huge and that's a very weird space and so you end up with relatively crazy things and the problems that we care about but if you ask a social scientist they're like they would never in a million years use std it'd be too noisy too hard to tune","zh":"这些技术以及这些优化技术确实很出色，但它们需要不同的缩放方式。实际上，这只是一个借口，让我们反复地处理这个问题。在机器学习中，我们真正感兴趣的领域是数据点数量 n 非常大，维度数量 d 也非常大的情况。这是一个非常奇怪的空间，因此你会遇到相对疯狂的问题，但这些问题正是我们关心的。如果你问一位社会科学家，他们会说他们永远不会在一百万年之内使用标准差，因为太嘈杂了，太难调参了。","start":3498.89,"end":3525.11},{"id":336,"text":"Newton's method doesn't have step sizes. Why not just press the button and it works? It runs before I even think about it. So it does get used quite a bit more over on those kinds of problems. Wonderful question. Other questions? Please.","zh":"牛顿法不需要步长。为什么不直接按下按钮让它工作呢？它在我思考之前就已经运行了。因此，它在这些问题上被使用得更多。非常好的问题。还有其他问题吗？请提问。","start":3525.9,"end":3539.41},{"id":337,"text":"Can it be cheaper to compute if you have some structure, like ? Yeah. Are there any cases that you have ? Yeah. I feel like I paid you to say this, but OK. So anyway, so the question was, are there any cases where you have some structured in H? And it's like, I don't know, maybe like my has one student.","zh":"如果你有一些结构，比如，计算是否可以更便宜？是的。是否存在某些情况？是的。我觉得我付钱让你说这句话，但好吧。总之，问题是，是否存在某些情况下你拥有 H 中的结构？我不知道，也许我的某个学生。","start":3541.44,"end":3561.7},{"id":338,"text":"who now works at Emeta, was his whole thesis was about when you could have structured matrices and Hessians that allow you to do something that's smarter. It turns out that you don't have to compute the full Hessian. This is not relevant for the course, so please don't listen.","zh":"现在在 Emeta 工作的学生，他的整个论文都是关于在什么情况下你可以拥有结构化的矩阵和 Hessian，从而让你进行更聪明的操作。结果发现，你不需要计算完整的 Hessian。这与本课程无关，所以请不要听。","start":3562.14,"end":3573.94},{"id":339,"text":"But I'm going to answer your question because I like it. The thing is, it turns out that you don't have to compute the full Hessian, but you have to compute Hessian vector dot products, and those can be cheaper. If you know the Hessian has some form, or you're willing to assume it has some form, then you do something in it. It's not really Newton's method any longer, but you have some second-order information. That actually is used in machine learning. So that was the inspiration behind John and Yoram's algorithm, which is called AdaGrad, what they were doing in AdaDelta, where they were trying to estimate a little bit of what is called curvature information, which tells you","zh":"但我还是想回答你的问题，因为我喜欢这个问题。事实上，结果发现你不需要计算完整的 Hessian，但你需要计算 Hessian 向量点积，而这些计算可能更便宜。如果你知道 Hessian 具有某种形式，或者你愿意假设它具有某种形式，那么你就可以在其中进行操作。这已经不再是牛顿法了，但你仍然拥有一些二阶信息。实际上，这在机器学习中被使用了。这就是 John 和 Yoram 算法的灵感来源，也就是 AdaGrad，他们在 AdaDelta 中所做的工作，他们试图估计所谓的曲率信息，这种信息告诉你","start":3574.67,"end":3604.03},{"id":340,"text":"you how much should I trust a step in every direction. The Hessian isn't something mysterious. It's just saying like, look, if there's a really big difference in this direction versus a really small one in this direction, I should probably step more in the directions I care about. That's roughly all that's going on. So you can simulate that by assuming H has some structure. Maybe it's diagonal. Diagonal is super cheap. That's what they were doing. You can do diagonal plus low rank. That's another thing. Or you can assume that it compresses well, which is what people were doing in what's called sketching. And so yes, that all comes up. So those...","zh":"你应该如何信任每个方向上的一步。Hessian矩阵并不是什么神秘的东西。它只是在说，比如，如果某个方向上的差异非常大，而另一个方向上的差异非常小，那么我应该在那些我关心的方向上多走几步。这基本上就是所发生的事情。因此，你可以通过假设H具有某种结构来模拟这一点。也许它是对角线形式。对角线形式非常便宜（计算成本低）。这就是他们所做的。你还可以做对角线加上低秩的形式，这是另一种方法。或者你可以假设它能够很好地压缩，这就是人们在所谓的草图（sketching）方法中所做的。因此，是的，所有这些都会出现。所以这些...","start":3604.01,"end":3632.89}],"notes":["本段讨论了在机器学习中，当数据点数量n和维度d都非常大时，优化方法的选择变得尤为重要。传统的优化方法如牛顿法在小规模问题中表现良好，但在大规模问题中可能不适用。社会科学家通常不会使用标准方法，因为它们可能过于嘈杂且难以调整。","在大规模数据问题中，计算Hessian矩阵可能非常昂贵，因此需要寻找结构化的替代方法。例如，可以假设Hessian矩阵具有某种结构，如对角线形式或低秩形式，从而减少计算成本。","Hessian矩阵的结构化假设可以用于模拟其行为，例如通过使用对角线近似或低秩近似。这些方法在机器学习中被广泛应用，如AdaGrad和AdaDelta算法，它们利用了曲率信息来调整学习率。","Hessian矩阵本质上描述了损失函数在不同方向上的曲率，这决定了在优化过程中应采取的步长。通过假设Hessian具有某种结构，可以更高效地进行优化。","在实际应用中，Hessian矩阵的结构化假设可以显著降低计算复杂度，例如通过使用对角线近似或低秩近似。这些方法在机器学习中被广泛采用，如在AdaGrad和AdaDelta算法中。","本段强调了在大规模机器学习问题中，优化方法的选择和计算效率的重要性，以及如何通过结构化假设来简化Hessian矩阵的计算。"],"formulas":[],"uncertainties":["std","H","my has one student"],"diagram":"none","start":3462.3,"end":3632.89,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":3462.3,"text":"So for example, if you're going to train a model in a stats package, a SciPy, something"},{"start":3467.78,"text":"like this, and you only have a couple of hundred features or something, or 20 features that"},{"start":3473.56,"text":"you're trying to regress out, which to be fair, 20 years ago was the most common use"},{"start":3478.3,"text":"case in stats then you would use newton or a variant called lbfgs which is a limited memory"},{"start":3483.54,"text":"kind of second order thing you would use those everywhere because you really cared about the"},{"start":3487.52,"text":"parameters the reason that i include this is to give that contrast because a lot of people maybe"},{"start":3492.5,"text":"not as much now but a lot of people come in with a kind of a background of stats and they're like"},{"start":3496.22,"text":"Like, oh, I'll just solve these models"},{"start":3497.38,"text":"with these great optimizations."},{"start":3498.89,"text":"techniques and those optimization techniques indeed are great but they require different scaling and really what this is is an excuse to kind of beat this again and again that really we're interested in these regimes in machine learning where n the number of data points is huge and d the number of dimensions are huge and that's a very weird space and so you end up with relatively crazy things and the problems that we care about but if you ask a social scientist they're like they would never in a million years use std it'd be too noisy too hard to tune"},{"start":3525.9,"text":"Newton's method doesn't have step sizes. Why not just press the button and it works? It runs before I even think about it. So it does get used quite a bit more over on those kinds of problems. Wonderful question. Other questions? Please."},{"start":3541.44,"text":"Can it be cheaper to compute if you have some structure, like ? Yeah. Are there any cases that you have ? Yeah. I feel like I paid you to say this, but OK. So anyway, so the question was, are there any cases where you have some structured in H? And it's like, I don't know, maybe like my has one student."},{"start":3562.14,"text":"who now works at Emeta, was his whole thesis was about when you could have structured matrices and Hessians that allow you to do something that's smarter. It turns out that you don't have to compute the full Hessian. This is not relevant for the course, so please don't listen."},{"start":3574.67,"text":"But I'm going to answer your question because I like it. The thing is, it turns out that you don't have to compute the full Hessian, but you have to compute Hessian vector dot products, and those can be cheaper. If you know the Hessian has some form, or you're willing to assume it has some form, then you do something in it. It's not really Newton's method any longer, but you have some second-order information. That actually is used in machine learning. So that was the inspiration behind John and Yoram's algorithm, which is called AdaGrad, what they were doing in AdaDelta, where they were trying to estimate a little bit of what is called curvature information, which tells you"},{"start":3604.01,"text":"you how much should I trust a step in every direction. The Hessian isn't something mysterious. It's just saying like, look, if there's a really big difference in this direction versus a really small one in this direction, I should probably step more in the directions I care about. That's roughly all that's going on. So you can simulate that by assuming H has some structure. Maybe it's diagonal. Diagonal is super cheap. That's what they were doing. You can do diagonal plus low rank. That's another thing. Or you can assume that it compresses well, which is what people were doing in what's called sketching. And so yes, that all comes up. So those..."}],"speech_gaps":[],"frame":"../frames/v042/021.webp","frame_time":3474.3},{"title":"加权最小二乘与优化方法","segments":[{"id":341,"text":"A family of algorithms are still widely used. And in fact, they form the basis of what we do. In fact, Adam can be looked at as kind of a combination. Adam is the most popular optimizer as a combination of those ideas with what's called momentum, which is another idea. They use Poliak momentum, but it doesn't matter. But yeah, so that is exactly right. So it does come up. I don't mean to say it doesn't come up, but Newton, the core Newton method is not widely used in machine learning.","zh":"一类算法仍然被广泛使用。事实上，它们构成了我们所做工作的基础。事实上，Adam 可以看作是一种组合。Adam 是最受欢迎的优化器，它是将这些思想与称为动量的另一个思想相结合的结果。它们使用 Poliak 动量，但这并不重要。但没错，就是这样。所以确实如此。所以它确实会出现。我不是要说它不会出现，但核心的牛顿法在机器学习中并不广泛使用。","start":3633.23,"end":3655.21},{"id":342,"text":"Excellent question. The ideas are important. I'm not telling you things that I don't think the ideas. So maybe that should be the baseline. If I'm telling you, I think you should know it. But yeah, it is used, but it's used a little bit more circuitously or indirectly that we don't have a segment on optimization because I think it makes people's eyes bleed. Well, I'm super happy to talk about it. I worked on it for a long, long time. Other questions? These are great, phenomenal questions. That's no indifferent. All right.","zh":"非常好的问题。这些想法很重要。我没有告诉你们我不认为这些想法重要的事情。所以也许这应该作为基准。如果我告诉你们，我认为你们应该知道它。但没错，它确实被使用，但被使用得更加间接或迂回，所以我们没有一个关于优化的段落，因为我觉得这会让人们感到厌烦。好吧，我很高兴能谈论它。我花了很长时间研究它。还有其他问题吗？这些问题非常好，非常棒。这绝不是无所谓的。好了。","start":3655.8,"end":3684.56},{"id":343,"text":"Okay, so that's all I wanted to get through today because we're going to start to do something that's in a different segment next time. So we saw the differences between classification and regression. We learned about this principle for probabilistic interpretation, which is maximum likelihood. That principle is absolutely key and critical. That's the thing that's going to scale from one model to the next model. Next time, what we're going to see is how we extend that to what are called generalized linear models. They have much more complicated link functions, much more complicated stuff underneath the covers, but they cover a huge fraction","zh":"好的，这就是我今天想讲的内容，因为我们接下来要进入一个不同的段落。我们看到了分类和回归之间的区别。我们学习了概率解释中的一个原则，即最大似然。这个原则绝对是关键和至关重要的。这是从一个模型扩展到下一个模型的要素。下一次，我们将看到如何将其扩展到所谓的广义线性模型。它们具有更复杂的链接函数，以及更复杂的底层内容，但它们涵盖了机器学习的很大一部分。","start":3685.48,"end":3714.8},{"id":344,"text":"of machine learning. And it took a while to figure that out. We derive logistic regression. And then this will be used in the next lecture. And we saw Newton's method. And I think I accidentally cut off and threw away the multi-class stuff. So I will make sure to bring that back.","zh":"机器学习的很大一部分。我们花了很长时间才弄清楚这一点。我们推导了逻辑回归。然后这将在下一次讲座中使用。我们还看到了牛顿法。我认为我无意中切断并丢弃了多类的情况。因此，我会确保将其带回。","start":3714.86,"end":3727.64}],"notes":["本段主要讨论了优化方法，特别是Adam和牛顿法在机器学习中的应用。讲者指出Adam是结合动量思想的优化器，而牛顿法虽然在理论上重要，但在实际中并不广泛使用。","讲者回应了一个关于优化方法重要性的问题，强调了这些概念的基础性，并提到虽然牛顿法在某些情况下被使用，但通常以更间接的方式出现，因此课程中没有专门的优化部分。","接下来的课程内容将转向广义线性模型，这是对最大似然原理的扩展。广义线性模型具有更复杂的链接函数和内部结构，但它们在机器学习中占据很大一部分。","讲者提到在推导逻辑回归时，已经涉及了牛顿法，并指出在讲解过程中可能遗漏了多类分类的内容，承诺在后续课程中补充。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3633.23,"end":3727.64,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":3633.23,"text":"family of algorithms are still widely used. And in fact, they form the basis of what we do. In fact, Adam, you can look at as kind of a combination. Adam is the most popular optimizer as a combination of those ideas with what's called momentum, which is another idea. They use Poliak momentum, but it doesn't matter. But yeah, so that is exactly right. So it does come up. I don't mean to say it doesn't come up, but Newton, the core Newton method is not widely used in machine learning."},{"start":3655.8,"text":"Excellent question. The ideas are important. I'm not telling you things that I don't think the ideas. So maybe that should be the baseline. If I'm telling you, I think you should know it. But yeah, it is used, but it's used a little bit more circuitously or indirectly that we don't have a segment on optimization because I think it makes people's eyes bleed. Well, I'm super happy to talk about it. I worked on it for a long, long time. Other questions? These are great, phenomenal questions. That's no indifferent. All right."},{"start":3685.48,"text":"Okay, so that's all I wanted to get through today because we're going to start to do something that's in a different segment next time. So we saw the differences between classification and regression. We learned about this principle for probabilistic interpretation, which is maximum likelihood. That principle is absolutely key and critical. That's the thing that's going to scale from one model to the next model. Next time, what we're going to see is how we extend that to what are called generalized linear models. They have much more complicated link functions, much more complicated stuff underneath the covers, but they cover a huge fraction"},{"start":3714.86,"text":"of machine learning. And it took a while to figure that out. We derive logistic regression. And then this will be used in the next lecture. And we saw Newton's method. And I think I accidentally cut off and threw away the multi-class stuff. So I will make sure to bring that back."}],"speech_gaps":[],"frame":"../frames/v042/022.webp","frame_time":3645.23}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
