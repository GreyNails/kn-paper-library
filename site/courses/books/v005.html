":1878.35,"text":"That's x cubed minus 3x. And so the point here is, what's p star for that one? No constraints. Just, what is p star? It's minus infinity, right? Because, you know, these values go as low as you like. Okay? Then this is a locally optimal point. Because, for example, if I..."},{"start":1904.86,"text":"if I add the constraint that x is between 0.5 and 1.5, if it's within 0.5 of 1, and then I simply ask, that's a locally optimal point. It's optimal for that restricted problem. So that's locally optimal. Let's look at a couple of other examples just to sort of explain this. Let's take f of x is 1 over x."},{"start":1929.67,"text":"The domain is R++, right? So positive things. It just goes down like this, right? And P star is 0, right? Because the infimum of 1 over x, as x gets bigger and bigger, that gets smaller and smaller. It's going towards 0. So P star is 0. There's no optimal point, right? And you're not allowed to say x equals infinity. That's not a valid choice. So there's no optimal point. There's no x for which 1 over x is equal to 0."},{"start":1958.7,"text":"Right? So, okay. How about minus log x, right? That's convex. The domain is, you know, again, r plus plus. And that's also going to be, that's actually unbounded below. Just like here. It's got, you know, something that goes down to zero, right? So, okay. So here, as x gets really big, this gets as negative as you would like."},{"start":1985.9,"text":"Right? Maybe slowly. Doesn't matter. It's p star is minus infinity. x log x, that's the negative entropy. And that looks like this. That looks like this. That's this function here. Looks like that, roughly. Oh, it's got an infinite slope here. So I'll make it like that. It's got infinite slope right here. By the way, you can either define the value at zero to be zero, which..."}],"speech_gaps":[],"frame":"../frames/v005/012.webp","frame_time":1865.58},{"title":"凸优化中的病态问题与无界性","segments":[{"id":120,"text":"kind of is what it would be by continuity, right? Where the expression x log x doesn't quite make sense there, right? I mean, but you could, whatever, just by continuity, you could make it zero there. And that's what people do. So that's a good, this one is what we would, it has no pathologies, right?","zh":"这基本上就是通过连续性得到的，对吧？在那里表达式 x log x 并不太有意义，对吧？我的意思是，但你可以，不管怎样，通过连续性，把它设为零。这就是人们所做的。所以这是一个好的例子，这个例子没有病态问题，对吧？","start":2016.51,"end":2036.41},{"id":121,"text":"It's got a single minimum. It's right there. And that value is like, okay, at 1 over e. There you go. That is the minimum value of the negative entropy or that maximizes this entropy function, right? So, okay. So this is just to give you the nomenclature of optimization problems. Okay. A few more things. Yeah.","zh":"它只有一个最小值。就在那里。这个值大约是 1/e。对吧？这就是负熵的最小值，或者说是这个熵函数的最大值，对吧？所以，好的。这只是为了给你介绍优化问题的术语。好的。还有一些其他事情。嗯。","start":2037.95,"end":2062.65},{"id":122,"text":"What yeah, so why is there? Like in the last example you can say that there's like the fourth break down the p star negative any within the first example you can't say the same ah Because this is not unbounded below Unbounded below means that the objective values get as negative as you like These get these these things they go down But they only go down to zero so you're","zh":"为什么会有这种情况呢？比如在上一个例子中，你可以这样说，存在一个第四种分解，将 p 星负数包含在内。但在第一个例子中，你不能这样说，因为这个不是无界下方的。无界下方意味着目标值可以变得任意负。这些值会下降，但它们只能下降到零，所以你不会","start":2063.79,"end":2092.77},{"id":123,"text":"You don't get the... Euphoria kicks in at around minus 10, in my experience. Minus 100 feels great, but I'm just joking, of course. Okay, fine. Yeah? The first example is feasible, it just has no... Yeah, the first example, all of these problems are feasible, right? So, I could write down, and we could write down the infeasible.","zh":"你不会得到……在我经验中，大约在减 10 时就会感到愉悦。减 100 感觉很棒，但当然我只是在开玩笑。好的，没问题。嗯？第一个例子是可行的，它只是没有……嗯，第一个例子，所有这些问题都是可行的，对吧？所以我可以写下，我们也可以写下不可行的情况。","start":2093.24,"end":2117.62},{"id":124,"text":"Well, actually, those two pathologies are at the opposite. They're sort of the opposites, right? Infeasible means there's no X that even satisfies your constraints. So let's not even talk about the objective, right? That's infeasible. Unbounded below is, oh, there's a lot of Xs that satisfy your constraints. Not only that, among them, F0 can be as negative as you like.","zh":"实际上，这两种病态问题正好相反。它们是某种意义上的对立面，对吧？不可行意味着没有 X 能满足你的约束条件。所以，我们甚至不要谈论目标函数，对吧？这就是不可行。无界下方意味着，有很多 X 满足你的约束条件。不仅如此，在这些 X 中，F0 可以变得任意负。","start":2122.55,"end":2148.41},{"id":125,"text":"So they're actually, they're both pathologies, but to me they're sort of at the opposite ends. They're the different things. Yes? For the first x that reaches zero? By reaches zero, what's that? You mean up here? Yeah. For example.","zh":"所以它们实际上是两种病态问题，但对我来说，它们处于相反的两端。它们是不同的事情。对吧？对于第一个 x 达到零的情况？所谓达到零是什么意思？你是说在这里吗？是的。例如。","start":2148.82,"end":2171.69}],"notes":["本段讨论了凸优化问题中的两种病态情况：不可行性和无界性。不可行性指的是没有满足约束条件的解，而无界性指的是目标函数可以无限变小。这两种情况都是优化问题中需要避免的，因为它们会导致问题没有最优解。","在不可行性的情况下，即使不考虑目标函数，约束条件本身也无法满足，因此问题没有可行解。而在无界性的情况下，虽然存在可行解，但目标函数可以无限变小，因此没有最小值。","讲者提到，不可行性和无界性是两种相反的病态情况。不可行性关注的是约束条件的不满足，而无界性关注的是目标函数的无限下降。这两种情况在优化问题中都可能导致问题没有解。","讲者还提到，在某些情况下，目标函数的最小值会达到零，但不会继续下降。这说明在某些优化问题中，目标函数的下降是有界的，不会无限变小。","讲者用幽默的方式提到，当目标函数值达到-10或-100时，会有一种“愉悦感”，但这是玩笑话，实际优化问题中需要关注的是目标函数的收敛性和可行性。","最后，讲者提到在第一个例子中，所有问题都是可行的，但可能存在其他问题，如不可行性或无界性，这些都需要在优化过程中进行识别和处理。"],"formulas":[],"uncertainties":["the fourth break down the p star negative any within the first example you can't say the same ah Because this is not unbounded below","These get these these things they go down But they only go down to zero so you're"],"diagram":"none","start":2016.51,"end":2171.69,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2016.51,"text":"kind of is what it would be by continuity, right? Where the expression x log x doesn't quite make sense there, right? I mean, but you could, whatever, just by continuity, you could make it zero there. And that's what people do. So that's a good, this one is what we would, it has no pathologies, right?"},{"start":2037.95,"text":"It's got a single minimum. It's right there. And that value is like, okay, at 1 over e. There you go. That is the minimum value of the negative entropy or that maximizes this entropy function, right? So, okay. So this is just to give you the nomenclature of optimization problems. Okay. A few more things. Yeah."},{"start":2063.79,"text":"What yeah, so why is there? Like in the last example you can say that there's like the fourth break down the p star negative any within the first example you can't say the same ah Because this is not unbounded below Unbounded below means that the objective values get as negative as you like These get these these things they go down But they only go down to zero so you're"},{"start":2093.24,"text":"You don't get the... Euphoria kicks in at around minus 10, in my experience. Minus 100 feels great, but I'm just joking, of course. Okay, fine. Yeah? The first example is feasible, it just has no... Yeah, the first example, all of these problems are feasible, right? So, I could write down, and we could write down the infeasible."},{"start":2122.55,"text":"Well, actually, those two pathologies are at the opposite. They're sort of the opposites, right? Infeasible means there's no X that even satisfies your constraints. So let's not even talk about the objective, right? That's infeasible. Unbounded below is, oh, there's a lot of Xs that satisfy your constraints. Not only that, among them, F0 can be as negative as you like."},{"start":2148.82,"text":"So they're actually, they're both pathologies, but to me they're sort of at the opposite ends. They're the different things. Yes? For the first x that reaches zero? By reaches zero, what's that? You mean up here? Yeah. For example."}],"speech_gaps":[],"frame":"../frames/v005/013.webp","frame_time":2028.51},{"title":"约束优化问题的可行性与最优解","segments":[{"id":126,"text":"Yeah, let's see. Let's do another example. Let me add a constraint to this one. I'll add the constraint that x is less than or equal to 3. Okay, sorry, which I will write this way. There we go. I think that was your question about whether, yeah. So I'll write x minus 3 less than 0, right? So I'm going to add that. I want you to minimize.","zh":"是的，我们来看看。让我们再举一个例子。我要在这个问题上添加一个约束条件。我将添加一个约束条件，即x小于等于3。好的，抱歉，我会这样写。好了，我想这就是你之前的问题，关于是否可行。所以我将写成x减3小于0，对吧？所以我将添加这个条件。我想让你最小化。","start":2173.59,"end":2201.63},{"id":127,"text":"Air watch, I'm going to be good. I'm going to write minimize out. Minimize 1 over x, then this is subject to this. Oh, by the way, for us, this thing has a domain which is equal to all positive numbers. So let's talk about that problem. Is it feasible? It is. There are points which are in the domain of f0.","zh":"保持安静，我会表现好的。我要写下最小化。最小化1除以x，然后这是受这个约束条件的限制。顺便说一句，对于我们来说，这个函数的定义域等于所有正数。让我们讨论这个问题。它是可行的吗？是的。存在一些点，这些点位于f0的定义域中。","start":2203.75,"end":2234.74},{"id":128,"text":"Right? Which are less than or equal to 3. Here's a good example. Ready? 1. x equals 1. Okay? So it's feasible. Does it have an optimal value? I mean, what's its optimal value? 1 third. It's 1 third. Does it have an optimal point or multiple optimal points? Name me an optimal point. x equals 3. Are there any others?","zh":"对吧？这些点小于等于3。这是一个很好的例子。准备好了吗？1。x等于1。好的？所以它是可行的。它有没有最优值？我的意思是，它的最优值是什么？1/3。它是1/3。它有没有最优解或者多个最优解？说出一个最优解。x等于3。还有其他的吗？","start":2235.29,"end":2261.04},{"id":129,"text":"No, right, exactly. So in this case, this set x opt is a singleton, and you would say it has a unique solution, which is x equals 3. So this would be, that's a well-posed problem. I mean, it's a silly one, but it's a well-posed problem. Okay. Okay. So...","zh":"不，对，就是这样。在这种情况下，这个最优解集合x opt是一个单元素集合，你会说它有一个唯一的解，即x等于3。所以这是一个良好定义的问题。我的意思是，这是一个愚蠢的问题，但它是一个良好定义的问题。好的。好的。那么...","start":2261.9,"end":2282.94},{"id":130,"text":"There's a concept of implicit versus explicit constraints, and these are actually going to be rather important in practice. So here's what they are. So when I have a standard form problem, I've got my objective function f0, I've got my inequality constraints fi, and I have my equality constraint functions hi.","zh":"有一个关于隐式约束和显式约束的概念，这些在实践中实际上会非常重要。所以它们是什么。当我在标准形式问题中，我有目标函数f0，我有不等式约束fi，还有我的等式约束函数hi。","start":2284.3,"end":2307.14},{"id":131,"text":"So the first thing is we can't even talk about an x if it's not in the domain of all those functions. It just doesn't even make sense. This is, by the way, worse than being infeasible. Infeasible is like, hey, try this. And you go, sorry, that doesn't satisfy the third inequality. That's infeasible. But this is, I just, you know, thanks for proposing an x.","zh":"首先，如果一个x不在所有这些函数的定义域中，我们甚至不能谈论它。这根本没有意义。顺便说一句，这比不可行更糟糕。不可行就像，嘿，试一下。然后你说，抱歉，这不满足第三个不等式。这是不可行的。但这是，我刚刚，你知道的，谢谢你的提议一个x。","start":2307.74,"end":2336.6}],"notes":["本段讨论了一个带有约束的优化问题，其中目标是最小化1/x，约束条件为x ≤ 3。该问题的可行域是所有正数，且存在可行点，例如x=1。最优值为1/3，最优解为x=3，且该问题是一个良定义的问题。","讲者提到隐式约束和显式约束的概念，这是优化问题中非常重要的概念。隐式约束是指那些未明确写出但隐含在问题中的约束，而显式约束则是明确写出的约束条件。","讲者指出，如果一个点不在所有函数的定义域内，那么该点就无法被讨论，这比不可行性更严重。不可行性是指点不满足某个约束，而定义域问题则是点根本不存在于问题的定义域中。","讲者通过一个具体的例子说明了如何判断一个优化问题是否可行，并指出在该问题中，x=1是一个可行点，而最优解是x=3，且该问题具有唯一的最优解。","讲者强调了优化问题中定义域的重要性，指出如果一个点不在所有函数的定义域内，那么该点就无法被考虑，这比不可行性更严重。","讲者通过一个具体的例子说明了如何判断一个优化问题是否可行，并指出在该问题中，x=1是一个可行点，而最优解是x=3，且该问题具有唯一的最优解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2173.59,"end":2336.6,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2173.59,"text":"Yeah, let's see. Let's do another example. Let me add a constraint to this one. I'll add the constraint that x is less than or equal to 3. Okay, sorry, which I will write this way. There we go. I think that was your question about whether, yeah. So I'll write x minus 3 less than 0, right? So I'm going to add that. I want you to minimize."},{"start":2203.75,"text":"Air watch, I'm going to be good. I'm going to write minimize out. Minimize 1 over x, then this is subject to this. Oh, by the way, for us, this thing has a domain which is equal to all positive numbers. So let's talk about that problem. Is it feasible? It is. There are points which are in the domain of f0."},{"start":2235.29,"text":"Right? Which are less than or equal to 3. Here's a good example. Ready? 1. x equals 1. Okay? So it's feasible. Does it have an optimal value? I mean, what's its optimal value? 1 third. It's 1 third. Does it have an optimal point or multiple optimal points? Name me an optimal point. x equals 3. Are there any others?"},{"start":2261.9,"text":"No, right, exactly. So in this case, this set x opt is a singleton, and you would say it has a unique solution, which is x equals 3. So this would be, that's a well-posed problem. I mean, it's a silly one, but it's a well-posed problem. Okay. Okay. So..."},{"start":2284.3,"text":"There's a concept of implicit versus explicit constraints, and these are actually going to be rather important in practice. So here's what they are. So when I have a standard form problem, I've got my objective function f0, I've got my inequality constraints fi, and I have my equality constraint functions hi."},{"start":2307.74,"text":"So the first thing is we can't even talk about an x if it's not in the domain of all those functions. It just doesn't even make sense. This is, by the way, worse than being infeasible. Infeasible is like, hey, try this. And you go, sorry, that doesn't satisfy the third inequality. That's infeasible. But this is, I just, you know, thanks for proposing an x."}],"speech_gaps":[],"frame":"../frames/v005/014.webp","frame_time":2185.59},{"title":"隐式约束与问题域","segments":[{"id":132,"text":"I can't even evaluate the objective on it, or I can't even evaluate the third constraint, right? So, now what, yeah, a lot of people don't distinguish between sort of being out of domain and being plus infinity, which kind of make, we'll get to that, but it's fine.","zh":"我甚至无法在它上面评估目标函数，或者我甚至无法评估第三个约束条件，对吧？那么现在该怎么办呢？是的，很多人不会区分处于问题域之外和无穷大的情况，这在之后我们会谈到，但现在没关系。","start":2337.18,"end":2360.18},{"id":133,"text":"You just, well, here's an example here, right? There's an implicit constraint that x is positive. The reason is, this has a domain, which is r++. And so that's an implicit constraint. Simply writing it down, right? You write down log of z, and there's an implicit constraint that z is positive, period, okay? So, I mean, in this class, right? If you're taking a class on complex analysis,","zh":"你只需要，这里有一个例子，对吧？这里有一个隐式约束，即 x 是正数。原因在于，这个函数的定义域是 r++。因此这是一个隐式约束。仅仅写下它，对吧？你写下 log(z)，就隐含了 z 是正数的约束，明白吗？所以，在这门课中，如果你正在学习复分析，","start":2361.88,"end":2387.69},{"id":134,"text":"Z could be negative. But the social contract in this class, where we focus on convexity, is log has a domain of R++. Same for 1 over x, by the way. So these are implicit. And this is called the domain of the problem. And so if you propose an x that's outside the domain, it just doesn't even make sense. Not only should whoever is evaluating","zh":"z 可以是负数。但在这门课中，我们关注凸性的社会契约是 log 的定义域是 R++。顺便说一句，1/x 也是如此。因此这些是隐式约束。这被称为问题的定义域。因此如果你提出一个不在定义域内的 x，这根本就没有意义。不仅评估者应该给你一个严厉的反馈，","start":2388.54,"end":2416.27},{"id":135,"text":"the ex give you a nasty, they should give you a really nasty message back, which is like, your choice was so bad.","zh":"他们应该给你一个非常严厉的反馈，就像你的选择太糟糕一样。","start":2417.18,"end":2424.04},{"id":136,"text":"I couldn't even evaluate the objective or constraints to see. So, you know, and basically you should be put on warning at that point. And if you do it two more times, you're out. You're barred from it, right? It would be as if the problem, if the variable was like a positive definite matrix, it represents, let's say, a covariance matrix. And you go, well, how about this? And I give you a non-symmetric matrix with like negative and complex eigenvalues. Then you're like.","zh":"我甚至无法评估目标函数或约束条件来查看。所以，你知道的，你在这个时候应该被警告。如果你再这样做两次，你就被禁止了，对吧？这就像问题中的变量是一个正定矩阵，它代表比如说一个协方差矩阵。然后你问，那这个呢？我给你一个非对称矩阵，带有负的和复数的特征值。然后你会说。","start":2424.87,"end":2449.71},{"id":137,"text":"Hello? Like, what? Like, I can't evaluate the log likelihood of that because it's not a covariance matrix. It doesn't make any sense. Anyway, that's what this is. Okay. Now, we'll say a problem is unconstrained if you just have no inequalities or whatever, right? So here's an example. This is an unconstrained problem. The reason is there is a constraint, which is a i transpose x is less than b, but that's built into the log because in this course,","zh":"你好？像什么？像什么？我无法评估那个的对数似然，因为它不是一个协方差矩阵。这没有任何意义。总之，这就是这个意思。好的。现在，我们说一个问题无约束，如果你没有任何不等式或其他约束，对吧？这里有一个例子。这是一个无约束的问题。原因是有这样一个约束，即 a_i^T x \u003c b，但这是内置在 log 中的，因为在本课程中，","start":2450.65,"end":2479.46},{"id":138,"text":"You take the log of something, it's positive, period. We don't even define it otherwise, right? So that's what that is. That's an example. Okay. Here's another one we'll talk about later. It's called a feasibility problem. Sometimes people write it this way. It says, find an X that satisfies a bunch of constraints. So this says you only have, oh, by the way, some people call it constraints, hard constraints, because basically you are, they are utterly and completely non-negotiable.","zh":"你对某个东西取对数，它一定是正的，没有其他可能。我们根本不会用其他方式来定义它，对吧？这就是这个例子的意思。好的。这里还有一个我们之后会讨论的例子，叫做可行性问题。有时人们会这样写。它表示，找到一个满足一系列约束条件的X。所以这句话的意思是说，你只需要，顺便提一下，有些人称之为约束条件，硬约束，因为基本上这些约束是绝对不可协商的。","start":2480.05,"end":2509.78}],"notes":["本段讲授了隐式约束的概念，即某些约束条件虽然没有明确写出，但通过函数的定义域自然隐含。例如，对数函数的定义域是正实数，因此隐式地要求变量为正。这种隐式约束在凸优化问题中非常重要，因为它们决定了问题的可行性。","讲者通过例子说明了隐式约束的含义，如log(z)隐含z>0，以及1/x隐含x≠0。这些约束虽然没有明确写出，但它们的存在使得函数在某些区域不可定义，从而影响问题的求解。","讲者强调了问题域（domain）的重要性，指出如果变量超出定义域，问题就失去了意义。这种情况下，求解者应被警告，甚至被排除在问题之外。","讲者通过非对称矩阵和负特征值的例子，说明了当变量不符合定义域时，某些函数（如对数似然）无法计算，因此变量必须满足特定的性质（如正定性）。","讲者提到无约束问题（unconstrained problem）的定义，即没有不等式约束的问题。但即使如此，某些隐式约束（如对数函数的定义域）仍然存在。","最后，讲者介绍了可行性问题（feasibility problem），即寻找满足一系列约束的变量。这些约束被称为硬约束（hard constraints），因为它们是绝对不可违反的。"],"formulas":[],"uncertainties":[],"diagram":"domain","start":2337.18,"end":2509.78,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2337.18,"text":"I can't even evaluate the objective on it, or I can't even evaluate the third constraint, right? So, now what, yeah, a lot of people don't distinguish between sort of being out of domain and being plus infinity, which kind of make, we'll get to that, but it's fine. Okay, so these things, this is referred to as an implicit constraint, right?"},{"start":2361.88,"text":"You just, well, here's an example here, right? There's an implicit constraint that x is positive. The reason is, this has a domain, which is r++. And so that's an implicit constraint. Simply writing it down, right? You write down log of z, and there's an implicit constraint that z is positive, period, okay? So, I mean, in this class, right? If you're taking a class on complex analysis,"},{"start":2388.54,"text":"Z could be negative. But the social contract in this class, where we focus on convexity, is log has a domain of R++. Same for 1 over x, by the way. So these are implicit. And this is called the domain of the problem. And so if you propose an x that's outside the domain, it just doesn't even make sense. Not only should whoever is evaluating"},{"start":2417.18,"text":"the ex give you a nasty, they should give you a really nasty message back, which is like, your choice was so bad."},{"start":2424.87,"text":"I couldn't even evaluate the objective or constraints to see. So, you know, and basically you should be put on warning at that point. And if you do it two more times, you're out. You're barred from it, right? It would be as if the problem, if the variable was like a positive definite matrix, it represents, let's say, a covariance matrix. And you go, well, how about this? And I give you a non-symmetric matrix with like negative and complex eigenvalues. Then you're like."},{"start":2450.65,"text":"Hello? Like, what? Like, I can't evaluate the log likelihood of that because it's not a covariance matrix. It doesn't make any sense. Anyway, that's what this is. Okay. Now, we'll say a problem is unconstrained if you just have no inequalities or whatever, right? So here's an example. This is an unconstrained problem. The reason is there is a constraint, which is a i transpose x is less than b, but that's built into the log because in this course,"},{"start":2480.05,"text":"You take the log of something, it's positive, period. We don't even define it otherwise, right? So that's what that is. That's an example. Okay. Here's another one we'll talk about later. It's called a feasibility problem. Sometimes people write it this way. It says, find an X that satisfies a bunch of constraints. So this says you only have, oh, by the way, some people call it constraints, hard constraints, because basically you are, they are utterly and completely non-negotiable."}],"speech_gaps":[],"frame":"../frames/v005/015.webp","frame_time":2349.18},{"title":"可行性问题与硬约束","segments":[{"id":139,"text":"Right. You violate them. We have no interest in that. If you if you satisfy them, we don't care if you satisfy them just barely or by a big margin. We don't care. OK, so this is called hard constraints. And so this is a feasibility problem. And it says, yeah, please just see, you know, can you find an X that satisfies this? Right. OK.","zh":"对的。你违反了它们。我们对此毫无兴趣。如果你满足了它们，我们不关心你是 barely 满足还是以很大裕度满足。我们不关心。好的，所以这被称为硬约束。因此这是一个可行性问题。它说，是的，请看看，你知道的，你能找到一个满足这个条件的 X 吗？对的。好的。","start":2510.1,"end":2530.06},{"id":140,"text":"And I think some people have a whole quasi-theory of optimization problems. And they refer to this as like, I think one name is a satisficing problem. I mean, frankly, I find it profoundly stupid. And if you understand any of this stuff, it's completely standard and straightforward how to solve. Anyway, fine. So that's a feasibility problem.","zh":"我想有些人对优化问题有一个完整的准理论。他们称之为像，我想其中一个名称是满足问题。我的意思是，坦白说，我觉得这极其愚蠢。如果你理解了其中的任何内容，如何解决这个问题是完全标准且直接的。不管怎样，好吧。所以这就是一个可行性问题。","start":2530.83,"end":2550.85},{"id":141,"text":"You can write it as a special case of our general problem. What you do is you introduce an objective function, which is just zero, no matter what, and it has domain everything. This is really dumb, but it does the trick, right? So if I say minimize zero, what I'm really saying is I have zero affect. I just don't, well, at least on the objective, I don't care. Like any X you propose, they're all...","zh":"你可以把它写成我们一般问题的一个特例。你所做的就是引入一个目标函数，不管怎样都是零，它的定义域是全部。这真的很傻，但确实有效，对吧？所以如果说最小化零，实际上我是在说我没有影响。我并不在意，至少在目标函数上，我并不关心。任何你提出的 X，它们在目标函数看来都是一样的。","start":2554.96,"end":2579.84},{"id":142,"text":"As far as the objective is concerned, they're all the same. And so here you have the constraints. And so for this problem, P star is zero if there is a feasible point. If there's a point that satisfies it, and then that means it's optimal too, right? And P star is just infinity if the constraints are infeasible. So we'll see that so-called feasibility problems are the same as our master problems. They're just the same thing.","zh":"因此你有这些约束。对于这个问题，P 星是零，如果存在一个可行点。如果存在一个满足条件的点，那么它也是最优的，对吧？而如果约束不可行，P 星就是无穷大。我们会看到所谓的可行性问题其实就是我们主问题。它们只是同一个东西。","start":2580.17,"end":2608.37},{"id":143,"text":"I mean, they're kind of boring. They only take the values 0 or infinity. But that's OK. Make sense? And by the way, this comes up in a whole lot of things. It will come up, for example, in economics.","zh":"我的意思是，它们有点无聊。它们只取 0 或无穷大的值。但这没关系。明白吗？顺便说一句，这在很多事物中都会出现。例如，在经济学中就会出现。","start":2608.72,"end":2623.94},{"id":144,"text":"It will be in the, this would be the absence of arbitrage, right? And so that'll work this way. X is something you can do, like buy a bunch of these instruments and some bonds over there and some derivatives and some other things that some portfolio you would construct. And then what these state is that no matter what happens, you will actually not lose money. And in at least one case, you'll make money.","zh":"它会在这种情况下出现，即没有套利机会，对吧？所以它会这样运作。X 是你可以做的事情，比如购买一堆这些工具和那边的一些债券以及一些衍生品和其他一些东西，构造一个投资组合。然后这些条件说明无论发生什么，你实际上都不会亏钱。至少在一种情况下，你会赚钱。","start":2625.03,"end":2652.87},{"id":145,"text":"right that's a feasibility problem and then if if it's feasible you would say you have arbitrage there's arbitrage in that market right and and so we'll get to that later but i just thought i'd just mention that feasibility problems actually that are literally feasibility problems are actually they're going to come up in real applications is that the same the same exact same thing right i'm sure i missed that what was that just to clarify they're both saying the exact same thing they are saying exactly the same thing some people write it this way","zh":"对，这是一个可行性问题，然后如果它是可行的，你就会说那里存在套利，那个市场存在套利，对吧，我们之后会讲到这一点，但我只是想提一下，实际上真正意义上的可行性问题在实际应用中会出现，这和之前说的是一样的，对吧，我确定我之前漏掉了，那是什么？只是澄清一下，它们说的其实是完全一样的事情，它们说的确实是完全一样的事情，有些人会这样写","start":2653.27,"end":2681.28}],"notes":["本段讲解了可行性问题（feasibility problem）的概念，即寻找满足约束条件的解X。这种问题中，目标函数被设为零，表示对目标函数没有偏好，只要满足约束即可。这种问题被称为硬约束（hard constraints），因为约束必须严格满足。","在可行性问题中，P*（最优值）要么是零（存在可行解），要么是无穷大（无可行解）。这说明可行性问题本质上是优化问题的一个特例，可以通过引入零目标函数来表示。","Boyd提到，可行性问题在经济学中会经常出现，例如在无套利（absence of arbitrage）的场景中。这种情况下，构造一个投资组合，使得无论市场如何变化，都不会亏损，甚至在某些情况下还能盈利。","Boyd还指出，虽然可行性问题看起来单调（只取0或无穷大），但它们在实际应用中非常重要，尤其是在金融和经济建模中。","Boyd强调，可行性问题与主问题（master problem）本质上是相同的，只是在表达方式上有所不同。他提到，有些人会用不同的方式来表述，但它们表达的是同一个概念。","最后，Boyd提到，虽然他个人认为将优化问题分为满足性问题（satisficing problem）是愚蠢的，但这种分类在某些理论中确实存在。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2510.1,"end":2681.28,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2510.1,"text":"Right. You violate them. We have no interest in that. If you if you satisfy them, we don't care if you satisfy them just barely or by a big margin. We don't care. OK, so this is called hard constraints. And so this is a feasibility problem. And it says, yeah, please just see, you know, can you find an X that satisfies this? Right. OK."},{"start":2530.83,"text":"And I think some people have a whole quasi-theory of optimization problems. And they refer to this as like, I think one name is a satisficing problem. I mean, frankly, I find it profoundly stupid. And if you understand any of this stuff, it's completely standard and straightforward how to solve. Anyway, fine. So that's a feasibility problem."},{"start":2554.96,"text":"You can write it as a special case of our general problem. What you do is you introduce an objective function, which is just zero, no matter what, and it has domain everything. This is really dumb, but it does the trick, right? So if I say minimize zero, what I'm really saying is I have zero affect. I just don't, well, at least on the objective, I don't care. Like any X you propose, they're all..."},{"start":2580.17,"text":"As far as the objective is concerned, they're all the same. And so here you have the constraints. And so for this problem, P star is zero if there is a feasible point. If there's a point that satisfies it, and then that means it's optimal too, right? And P star is just infinity if the constraints are infeasible. So we'll see that so-called feasibility problems are the same as our master problems. They're just the same thing."},{"start":2608.72,"text":"I mean, they're kind of boring. They only take the values 0 or infinity. But that's OK. Make sense? And by the way, this comes up in a whole lot of things. It will come up, for example, in economics."},{"start":2625.03,"text":"It will be in the, this would be the absence of arbitrage, right? And so that'll work this way. X is something you can do, like buy a bunch of these instruments and some bonds over there and some derivatives and some other things that some portfolio you would construct. And then what these state is that no matter what happens, you will actually not lose money. And in at least one case, you'll make money."},{"start":2653.27,"text":"right that's a feasibility problem and then if if it's feasible you would say you have arbitrage there's arbitrage in that market right and and so we'll get to that later but i just thought i'd just mention that feasibility problems actually that are literally feasibility problems are actually they're going to come up in real applications is that the same the same exact same thing right i'm sure i missed that what was that just to clarify they're both saying the exact same thing they are saying exactly the same thing some people write it this way"}],"speech_gaps":[],"frame":"../frames/v005/016.webp","frame_time":2522.1},{"title":"凸优化问题的定义与约束条件","segments":[{"id":146,"text":"I mean, that's the normal way you would, if we're talking to a normal person, you might say that. I mean, this just maps it into our standard form. Right. Is there another question? Okay. All right. So that's a feasibility problem. And finally, now we get to a convex optimization problem, right? So, and here it is.","zh":"我的意思是，这本来就是你跟一个普通人说话时会说的正常方式。我的意思是，这仅仅将问题映射到我们的标准形式。对吧？还有其他问题吗？好的。那么，这就是一个可行性问题。现在，我们终于到了凸优化问题，对吧？所以，这就是它。","start":2681.91,"end":2702.43},{"id":147,"text":"it is this. There's, we simply, it's a standard form problem where we restrict the curvature","zh":"它就是这个样子的。我们只是将其视为一个标准形式的问题，其中我们限制了函数的曲率","start":2704.78,"end":2711.76},{"id":148,"text":"of the functions. That's all it is. And it's this. The objective that we minimize has to be convex.","zh":"这就是全部内容。它就是这个样子的。我们要最小化的目标函数必须是凸函数。","start":2711.76,"end":2718.96},{"id":149,"text":"The constraints, which we are, in this case, upper bounding by zero, have to be convex functions.","zh":"约束条件，我们在这里是通过零来上界限制的，必须是凸函数。","start":2719.84,"end":2727.72},{"id":150,"text":"and the equality constraints have to be affine or what people call them linear equality constraints","zh":"等式约束必须是仿射的，或者人们称之为线性等式约束","start":2727.72,"end":2735.2},{"id":151,"text":"so these are the rules so roughly speaking it says objective has non-negative curvature","zh":"这些是规则，大致来说，它表示目标函数具有非负曲率","start":2735.2,"end":2741.28},{"id":152,"text":"constraints all have non-negative curvature and equality constraints all have zero curvature","zh":"所有约束条件都具有非负曲率，所有等式约束都具有零曲率","start":2741.28,"end":2749.36},{"id":153,"text":"which is affine.","zh":"也就是仿射函数。","start":2749.36,"end":2750.42},{"id":154,"text":"Make sense?","zh":"有道理吗？","start":2750.86,"end":2751.54},{"id":155,"text":"Yeah?","zh":"是吗？","start":2751.86,"end":2752.22},{"id":156,"text":"Why do the constraints need to be affine and not convex?","zh":"为什么约束条件需要是仿射的而不是凸的？","start":2752.46,"end":2757.62},{"id":157,"text":"Well, okay, why, that's a loaded question","zh":"嗯，好吧，为什么呢，这是一个有分量的问题","start":2758.06,"end":2760.22},{"id":158,"text":"because this is the definition of,","zh":"因为这是定义为，","start":2760.22,"end":2763.1},{"id":159,"text":"this is the definition of a convex optimization problem.","zh":"这是凸优化问题的定义。","start":2763.24,"end":2765.64},{"id":160,"text":"So morally speaking, I think I can answer it this way.","zh":"从道德上讲，我想可以这样回答。","start":2766.0,"end":2769.24},{"id":161,"text":"I'm allowed to say because that's the definition, okay?","zh":"我可以这么说，因为这是定义，对吧？","start":2769.32,"end":2772.44},{"id":162,"text":"So, but I mean, that's kind of obnoxious,","zh":"所以，但我是说，这有点令人讨厌，","start":2772.6,"end":2774.6},{"id":163,"text":"but we'll see actually that if,","zh":"但我们会看到，如果","start":2774.68,"end":2778.52},{"id":164,"text":"if, well, we'll get to some interesting examples","zh":"如果，嗯，我们会接触到一些有趣的例子","start":2778.52,"end":2780.8},{"id":165,"text":"where these constraints are,","zh":"其中这些约束条件是","start":2780.8,"end":2782.84},{"id":166,"text":"when you have an equality constraint that's not,","zh":"当你有一个等式约束，它不是","start":2783.5,"end":2785.32},{"id":167,"text":"let's see, well, by definition,","zh":"让我们看看，嗯，按定义","start":2786.62,"end":2788.1},{"id":168,"text":"you don't have a convex problem.","zh":"你就不拥有一个凸问题。","start":2788.1,"end":2789.22},{"id":169,"text":"And in fact, a bunch of our methods won't work on this.","zh":"事实上，我们的一些方法在这种情况下将无法使用。","start":2789.98,"end":2793.32},{"id":170,"text":"Now, sometimes we actually can solve problems like that.","zh":"现在，有时候我们实际上可以解决这类问题。","start":2793.38,"end":2795.58},{"id":171,"text":"So, sorry, that was a long and weird answer.","zh":"所以，抱歉，刚才的回答很长也很奇怪。","start":2795.74,"end":2798.54},{"id":172,"text":"It's this, it's because this is the definition.","zh":"就是这个，就是因为这是定义。","start":2798.68,"end":2800.7},{"id":173,"text":"It's this, it's because this is the definition.","zh":"就是这个，就是因为这是定义。","start":2800.78,"end":2802.58},{"id":174,"text":"How about that?","zh":"怎么样？","start":2802.92,"end":2803.56},{"id":175,"text":"But I won't say it in the obnoxious way. Okay. So, and these equality constraints, we will often collect them and write them as just in a single matrix form, AX equals B. Okay? So, okay. Okay. So, let's look at an example. It looks like this. Oh, and by the way, let me point something out here. Very important. So, a...","zh":"但我不用那种令人讨厌的方式来说。好的。那么，这些等式约束，我们通常会把它们收集起来，写成一个单一的矩阵形式，AX等于B。好的？好的。好的。那么，让我们看一个例子。它看起来像这样。哦，顺便提一下，让我在这里指出一点。非常重要。所以，一个……","start":2804.04,"end":2830.86},{"id":176,"text":"Here, a convex optimization problem, we refer to its representation through its objective function, its inequality functions, and its equality constraint functions. We'll talk shortly about the idea of an equivalent problem, but now it's actually literally, when you have a problem, it has attributes which are the objective and things like that, and that's what...","zh":"在这里，一个凸优化问题，我们指的是它通过其目标函数、不等式函数和等式约束函数的表示方式。我们稍后会讨论等价问题的概念，但现在实际上，当你有一个问题时，它具有属性，即目标函数等，这就是……","start":2831.37,"end":2859.21}],"notes":["本段讲解了凸优化问题的定义，强调了目标函数和约束函数的凸性要求。目标函数必须是凸函数，约束函数必须是非负曲率的凸函数，而等式约束必须是仿射函数（即零曲率）。这是凸优化问题的标准形式，与可行性问题不同，凸优化问题要求所有约束函数满足凸性条件。","讲者解释了为什么等式约束必须是仿射函数，而不是一般的凸函数。这是因为凸优化问题的定义要求等式约束具有零曲率，而仿射函数正是零曲率的函数。如果等式约束不是仿射函数，那么问题就不再是凸优化问题，许多凸优化方法将无法应用。","讲者提到，虽然有时可以解决非仿射等式约束的问题，但通常这些方法并不适用于凸优化问题。因此，凸优化问题的定义严格限制了等式约束的形式，以确保问题的凸性。","讲者还提到，凸优化问题的表示方式包括目标函数、不等式约束函数和等式约束函数。这些函数的凸性决定了问题是否为凸优化问题。","讲者通过举例说明了凸优化问题的结构，强调了凸性在问题定义中的核心地位。凸性确保了问题的解具有全局最优性，并且可以使用高效的优化算法求解。","讲者最后指出，凸优化问题的定义是其核心特征，所有关于凸优化问题的讨论都基于这一定义。因此，理解凸性及其在目标函数和约束函数中的体现是学习凸优化的关键。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2681.91,"end":2859.21,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":31,"raw_segments":[{"start":2681.91,"text":"I mean, that's the normal way you would, if we're talking to a normal person, you might say that. I mean, this just maps it into our standard form. Right. Is there another question? Okay. All right. So that's a feasibility problem. And finally, now we get to a convex optimization problem, right? So, and here it is."},{"start":2704.78,"text":"it is this. There's, we simply, it's a standard form problem where we restrict the curvature"},{"start":2711.76,"text":"of the functions. That's all it is. And it's this. The objective that we minimize has to be convex."},{"start":2719.84,"text":"The constraints, which we are, in this case, upper bounding by zero, have to be convex functions."},{"start":2727.72,"text":"and the equality constraints have to be affine or what people call them linear equality constraints"},{"start":2735.2,"text":"so these are the rules so roughly speaking it says objective has non-negative curvature"},{"start":2741.28,"text":"constraints all have non-negative curvature and equality constraints all have zero curvature"},{"start":2749.36,"text":"which is affine."},{"start":2750.86,"text":"Make sense?"},{"start":2751.86,"text":"Yeah?"},{"start":2752.46,"text":"Why do the constraints need to be affine and not convex?"},{"start":2758.06,"text":"Well, okay, why, that's a loaded question"},{"start":2760.22,"text":"because this is the definition of,"},{"start":2763.24,"text":"this is the definition of a convex optimization problem."},{"start":2766.0,"text":"So morally speaking, I think I can answer it this way."},{"start":2769.32,"text":"I'm allowed to say because that's the definition, okay?"},{"start":2772.6,"text":"So, but I mean, that's kind of obnoxious,"},{"start":2774.68,"text":"but we'll see actually that if,"},{"start":2778.52,"text":"if, well, we'll get to some interesting examples"},{"start":2780.8,"text":"where these constraints are,"},{"start":2783.5,"text":"when you have an equality constraint that's not,"},{"start":2786.62,"text":"let's see, well, by definition,"},{"start":2788.1,"text":"you don't have a convex problem."},{"start":2789.98,"text":"And in fact, a bunch of our methods won't work on this."},{"start":2793.38,"text":"Now, sometimes we actually can solve problems like that."},{"start":2795.74,"text":"So, sorry, that was a long and weird answer."},{"start":2798.68,"text":"Okay, let me just, I'm going to revise my answer."},{"start":2800.78,"text":"It's this, it's because this is the definition."},{"start":2802.92,"text":"How about that?"},{"start":2804.04,"text":"But I won't say it in the obnoxious way. Okay. So, and these equality constraints, we will often collect them and write them as just in a single matrix form, AX equals B. Okay? So, okay. Okay. So, let's look at an example. It looks like this. Oh, and by the way, let me point something out here. Very important. So, a..."},{"start":2831.37,"text":"Here, a convex optimization problem, we refer to its representation through its objective function, its inequality functions, and its equality constraint functions. We'll talk shortly about the idea of an equivalent problem, but now it's actually literally, when you have a problem, it has attributes which are the objective and things like that, and that's what..."}],"speech_gaps":[],"frame":"../frames/v005/017.webp","frame_time":2693.91},{"title":"凸性判断与约束条件","segments":[{"id":177,"text":"to be the attribute of being convex depends on how you describe the problem. We'll get to that in a minute. In fact, this is an example of that. So here's a problem. It's got two variables. I would like to minimize x1 squared plus x2 squared. Well, that's just the sum of the squares, and that's like a nice bowl. It kind of goes up like, you know what it looks like, right? And you have some constraints. You have f1 of x is x1 over 1 plus x2 squared is less than or equal to 0.","zh":"是否具有凸性取决于你如何描述问题。我们稍后会讲到这一点。事实上，这就是一个例子。所以这里有一个问题。它有两个变量。我想最小化x1的平方加上x2的平方。这其实就是平方和，看起来像一个漂亮的碗形，你大概知道它是什么样子，对吧？并且你有一些约束。你有f1(x)等于x1除以1加上x2的平方小于等于0。","start":2859.75,"end":2885.39},{"id":178,"text":"Well, you can ask yourself, is x1 over 1 plus x2 squared convex? And the answer would be it's not. So this thing is not a convex problem. And the last constraint is that h, so I think you asked a question about why does it have to be affine, and I said, well, it's the definition. Here's an example where h of x is for sure not affine. It says that x1 plus x2 squared has to be 0.","zh":"你可以问自己，x1除以1加上x2的平方是否是凸的？答案是它不是。因此，这个问题不是一个凸问题。最后一个约束是h，所以我想你问过为什么它必须是仿射的，我说，这是因为定义。这里有一个例子，h(x)显然不是仿射的。它说x1加上x2的平方必须等于0。","start":2886.63,"end":2912.97},{"id":179,"text":"Okay? So this problem fails. And, you know, we can even walk through the code. If I took this problem, and I called it my prob, and I called the my prob dot is convex method on it, then here we will walk through what the code does.","zh":"明白了吗？所以这个问题失败了。而且，我们甚至可以一步步地走一遍代码。如果我将这个问题命名为my prob，并在它上面调用my prob dot is convex方法，那么我们就会一步步地走一遍代码会做什么。","start":2913.53,"end":2940.43},{"id":180,"text":"I call the dot isConvex method on it. And in this case, that would evaluate to what? True. It's true, okay? No problem. Now, the second part of implementing the isConvex method on a problem is to iterate over the inequality constraints. And you'd say for inequality in inequalities, you would say my prob dot inequality of i. I'm just saying, you know, rough pseudocode here.","zh":"我在这个问题上调用dot isConvex方法。在这种情况下，这个方法会返回什么？是True。对吧？没问题。实现问题上的isConvex方法的第二部分是遍历不等式约束。你会说，对于不等式中的每一个不等式，你会说my prob dot inequality of i。我只是在说，这里是一些粗糙的伪代码。","start":2941.21,"end":2970.28},{"id":181,"text":"The second part of implementing the isConvex method on a problem is to iterate over the inequality constraints. And you'd say for inequality in inequalities, you would say my prob dot inequality of i. I'm just saying, you know, rough pseudocode here.","zh":"实现问题上的isConvex方法的第二部分是遍历不等式约束。你会说，对于不等式中的每一个不等式，你会说my prob dot inequality of i。我只是在说，这里是一些粗糙的伪代码。","start":2970.75,"end":2992.81},{"id":182,"text":"equality, you know, my prob dot equality constraint function of zero, I'm using zero indexing, dot is affine and it would evaluate to false. Everybody got this? Okay. Now, it's silly because you look at this and you're like, this is dumb, right? I mean, this thing is the same as x1 just being less than or equal to zero. And the square of x1 plus x2 is zero, that only happens if, so basically you can rewrite the problem this way.","zh":"对于等式约束，你知道的，my prob dot equality constraint function of zero，我使用的是零索引，dot是仿射的，它会返回false。大家明白了吗？好的。现在，这很傻，因为你看这个，你会觉得这很傻，对吧？我的意思是，这个东西其实就是x1小于等于0。而x1的平方加上x2的平方等于0，这只有在x1等于0且x2等于0时才成立，所以基本上你可以这样重写这个问题。","start":2994.85,"end":3020.39}],"notes":["本段讲解了凸性判断的条件，指出一个优化问题是否为凸问题取决于其描述方式。具体例子中，目标函数是x1平方加上x2平方，这是一个凸函数，但约束条件f1(x) = x1/(1 + x2²) ≤ 0 不是凸函数，因此整个问题不是凸问题。","讲者提到，判断凸性时，不仅需要检查目标函数是否为凸函数，还需要检查所有不等式约束是否为凸函数。如果任何一个约束不满足凸性条件，整个问题就不是凸问题。","在代码实现中，isConvex方法首先检查目标函数是否为凸函数，然后遍历所有不等式约束，检查每个约束是否为凸函数。如果所有约束都满足凸性条件，问题才是凸问题。","讲者指出，约束条件f1(x) = x1/(1 + x2²) ≤ 0 不是凸函数，因此整个问题不是凸问题。这说明凸性判断不仅依赖于目标函数，还依赖于所有约束条件。","讲者还提到，如果问题中存在等式约束，也需要检查其是否为仿射函数。如果等式约束不是仿射函数，整个问题也不是凸问题。","最后，讲者指出，虽然问题中的约束条件看起来像是x1 ≤ 0，但实际上由于x2的平方项，约束条件的结构使得整个问题不是凸问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2859.75,"end":3020.39,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2859.75,"text":"to be the attribute of being convex depends on how you describe the problem. We'll get to that in a minute. In fact, this is an example of that. So here's a problem. It's got two variables. I would like to minimize x1 squared plus x2 squared. Well, that's just the sum of the squares, and that's like a nice bowl. It kind of goes up like, you know what it looks like, right? And you have some constraints. You have f1 of x is x1 over 1 plus x2 squared is less than or equal to 0."},{"start":2886.63,"text":"Well, you can ask yourself, is x1 over 1 plus x2 squared convex? And the answer would be it's not. So this thing is not a convex problem. And the last constraint is that h, so I think you asked a question about why does it have to be affine, and I said, well, it's the definition. Here's an example where h of x is for sure not affine. It says that x1 plus x2 squared has to be 0."},{"start":2913.53,"text":"Okay? So this problem fails. And, you know, we can even walk through the code. If I took this problem, and I called it my prob, and I called the my prob dot is convex method on it, then here we will walk through what the code does. What it does like this is it says my problem dot objective, that's going to be F0."},{"start":2941.21,"text":"I call the dot isConvex method on it. And in this case, that would evaluate to what? True. It's true, okay? No problem. Now, the second part of implementing the isConvex method on a problem is to iterate over the inequality constraints. And you'd say for inequality in inequalities, you would say my prob dot inequality of i. I'm just saying, you know, rough pseudocode here."},{"start":2970.75,"text":"Dot is convex. Well, there's only one in that list. And it would return this function. And that would evaluate to what? False. At that point, it's game over. But if you wanted to be really sure it was over, you would actually go to the equality constraints. And it would have might. It would actually be for equality constraints. For equality constraint, inequality constraints."},{"start":2994.85,"text":"equality, you know, my prob dot equality constraint function of zero, I'm using zero indexing, dot is affine and it would evaluate to false. Everybody got this? Okay. Now, it's silly because you look at this and you're like, this is dumb, right? I mean, this thing is the same as x1 just being less than or equal to zero. And the square of x1 plus x2 is zero, that only happens if, so basically you can rewrite the problem this way."}],"speech_gaps":[],"frame":"../frames/v005/018.webp","frame_time":2871.75},{"title":"等价问题与凸优化","segments":[{"id":183,"text":"Now, what we do is we would call this problem and this problem equivalent problems. What that means is if you can solve one, there's an easy way to solve the other. We'll talk more about that. But if you've taken a course in computer science, like almost any, this is the standard idea of a reduction. We're not going to make it fancy and have polynomial reduction and all that kind of stuff. But the point is, for us, it's going to be informal. It just means two problems are equivalent. When I solve one, I know how to solve the other.","zh":"现在，我们所做的就是将这个问题称为等价问题。这意味着如果你能解决其中一个，就有一个简单的方法来解决另一个。我们之后会更详细地讨论这一点。但如果你上过计算机科学的课程，几乎任何课程都会涉及这个概念，即问题的归约。我们不会让它变得复杂，比如多项式归约之类的东西。但重点是，对我们来说，这将是一个非正式的概念。它仅仅意味着两个问题是等价的。当我解决其中一个时，我知道如何解决另一个。","start":3020.91,"end":3049.51},{"id":184,"text":"And if I can solve the other, I know how to solve the original one. So these are equivalent. They are not the same. Let's walk through the implementation. This is my prob, and this is my alternative prob. So let's walk through the equals equals method between two problems. And the way that works is this. Here's an implementation. This is what it means to be equal. It says, are your objectives equal? And that would evaluate to what in this case? True.","zh":"如果我能解决另一个，我知道如何解决原始问题。因此，这两个问题是等价的。它们并不是同一个问题。让我们通过实现来说明。这是我的问题，这是我的替代问题。让我们通过两个问题之间的等于等于方法来说明。这种方法的工作方式如下。这里有一个实现。这表示相等的含义。它会问：你们的目标是否相等？在这种情况下，这会评估为真。","start":3050.03,"end":3079.96},{"id":185,"text":"Then it goes like this. It's really dumb. It says loop over the constraints and just check","zh":"然后它会这样进行。它非常简单。它会遍历约束条件，并逐一检查","start":3081.16,"end":3087.5},{"id":186,"text":"if each constraint function in the two problems are the same. That would evaluate here to","zh":"两个问题中的每个约束函数是否相同。在这种情况下，这会评估为","start":3087.5,"end":3093.98},{"id":187,"text":"false, right? So these are not the same problem, but they are equivalent, okay? So, I mean,","zh":"假，对吧？因此，这两个问题并不是同一个问题，但它们是等价的，好吗？所以，我的意思是，","start":3095.44,"end":3102.4},{"id":188,"text":"this is not a big deal and it should be kept informal, but it's also an important idea,","zh":"这并不是什么大问题，应该保持非正式，但这也是一个重要的概念，","start":3102.42,"end":3105.44},{"id":189,"text":"this is not convex this is convex and this tells you that yes the","zh":"这并不是凸的，这是凸的，这告诉你是的，","start":3105.44,"end":3112.08},{"id":190,"text":"non-convex problem can be equivalent to a convex problem and that's very","zh":"非凸问题可以等价于一个凸问题，这非常","start":3112.08,"end":3116.1},{"id":191,"text":"confusing but too bad right so ok yeah the same as just saying the p star that","zh":"有点令人困惑，但太糟糕了，对吧，所以好的，是的，这和说p星解决这个问题是一样的","start":3116.1,"end":3125.12},{"id":192,"text":"solves this problem is the same as the p star that will solve that problem would","zh":"解决这个问题的p星和会解决那个问题的p星是一样的","start":3125.12,"end":3129.4},{"id":193,"text":"wouldn't that be another way to check both on C?","zh":"那样是不是另一种检查两者在C上的方法？","start":3129.4,"end":3131.08},{"id":194,"text":"Yes, not quite, right?","zh":"是的，不太对，对吧？","start":3133.88,"end":3135.82},{"id":195,"text":"Because when you say they're equivalent,","zh":"因为当你说到它们是等价的时候，","start":3136.04,"end":3137.9},{"id":196,"text":"it actually doesn't really,","zh":"实际上并不真的，","start":3138.32,"end":3139.78},{"id":197,"text":"it means that you have a very simple method.","zh":"它意味着你有一个非常简单的方法。","start":3139.88,"end":3141.64},{"id":198,"text":"It says that once you solve that,","zh":"它说一旦你解决了那个问题，","start":3141.86,"end":3143.82},{"id":199,"text":"I have a simple method to solve that.","zh":"我有一个简单的方法来解决这个问题。","start":3143.98,"end":3145.52},{"id":200,"text":"And that simple method is, well, it's very simple.","zh":"而且这个简单的方法是，嗯，它非常简单。","start":3145.68,"end":3149.14 end":3191.08}],"notes":["本段讲授了等价问题的概念，即两个问题虽然不相同，但可以通过某种方式相互转换求解。这类似于计算机科学中的归约概念，但这里保持非正式。等价问题的核心在于，解决其中一个问题可以提供解决另一个问题的方法。","讲者指出，等价问题并不意味着两个问题完全相同，而是存在某种转换关系。例如，非凸问题可以等价于凸问题，这在理解上容易产生混淆，但这是重要的概念。","讲者提到，等价问题的判断方法包括检查目标函数是否相同，以及约束函数是否相同。但即使这些条件不满足，两个问题仍可能等价。","讲者强调，等价问题的转换方法可能需要一些操作，例如将一个问题的解转换为另一个问题的解。这与仅仅比较最优值（p star）不同，因为转换过程可能涉及额外的步骤。","讲者提到，当两个问题等价时，可能需要进行一些转换操作，例如将一个问题的解映射到另一个问题的解。这与仅仅比较最优值不同，因为转换过程可能涉及额外的步骤。","讲者最后提到，接下来将讨论局部最优和全局最优的概念，这是凸优化中的重要主题。"],"formulas":[],"uncertainties":["non-convex problem can be equivalent to a convex problem","the p star that solves this problem is the same as the p star that will solve that problem","wouldn't that be another way to check both on C?"],"diagram":"none","start":3020.91,"end":3191.08,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":37,"raw_segments":[{"start":3020.91,"text":"Now, what we do is we would call this problem and this problem equivalent problems. What that means is if you can solve one, there's an easy way to solve the other. We'll talk more about that. But if you've taken a course in computer science, like almost any, this is the standard idea of a reduction. We're not going to make it fancy and have polynomial reduction and all that kind of stuff. But the point is, for us, it's going to be informal. It just means two problems are equivalent. When I solve one, I know how to solve the other."},{"start":3050.03,"text":"And if I can solve the other, I know how to solve the original one. So these are equivalent. They are not the same. Let's walk through the implementation. This is my prob, and this is my alternative prob. So let's walk through the equals equals method between two problems. And the way that works is this. Here's an implementation. This is what it means to be equal. It says, are your objectives equal? And that would evaluate to what in this case? True."},{"start":3081.16,"text":"Then it goes like this. It's really dumb. It says loop over the constraints and just check"},{"start":3087.5,"text":"if each constraint function in the two problems are the same. That would evaluate here to"},{"start":3095.44,"text":"false, right? So these are not the same problem, but they are equivalent, okay? So, I mean,"},{"start":3102.42,"text":"this is not a big deal and it should be kept informal, but it's also an important idea,"},{"start":3105.44,"text":"ok so so this problem is not convex this is convex and this tells you that yes the"},{"start":3112.08,"text":"non-convex problem can be equivalent to a convex problem and that's very"},{"start":3116.1,"text":"confusing but too bad right so ok yeah the same as just saying the p star that"},{"start":3125.12,"text":"solves this problem is the same as the p star that will solve that problem would"},{"start":3129.4,"text":"wouldn't that be another way to check both on C?"},{"start":3133.88,"text":"Yes, not quite, right?"},{"start":3136.04,"text":"Because when you say they're equivalent,"},{"start":3138.32,"text":"it actually doesn't really,"},{"start":3139.88,"text":"it means that you have a very simple method."},{"start":3141.86,"text":"It says that once you solve that,"},{"start":3143.98,"text":"I have a simple method to solve that."},{"start":3145.68,"text":"And that simple method is, well, it's very simple."},{"start":3149.28,"text":"I just, I take a solution of this,"},{"start":3150.82,"text":"which we could figure out like real quickly,"},{"start":3153.02,"text":"but I'm not going to."},{"start":3153.9,"text":"But we take a solution of that,"},{"start":3156.68,"text":"actually the solution of it,"},{"start":3157.96,"text":"because it's going to be unique."},{"start":3159.4,"text":"We take the solution of that, this thing, right?"},{"start":3161.94,"text":"And then actually you just simply put it over there."},{"start":3163.96,"text":"It's the same x1 and x2."},{"start":3164.92,"text":"We'll see other cases where you might have to do this."},{"start":3167.28,"text":"When two problems are equivalent,"},{"start":3168.74,"text":"you might actually have to do a little bit"},{"start":3170.14,"text":"to transform back, right?"},{"start":3172.9,"text":"But it's not the same as just P star being the same."},{"start":3177.4,"text":"Okay."},{"start":3179.56,"text":"So now we'll talk about local and global optima."},{"start":3184.1,"text":"The plural of optima."},{"start":3186.24,"text":"Okay."},{"start":3186.6,"text":"Okay, so it turns out any locally optimal point of a convex problem"}],"speech_gaps":[{"start":3131.792,"end":3133.48}],"frame":"../frames/v005/019.webp","frame_time":3032.91},{"title":"全局最优与凸集的性质","segments":[{"id":220,"text":"is globally optimal. So, I mean, it's not hard to show. I'll draw a picture in just a minute to show you what this means. But it is kind of worthwhile to sit back and say, like, to realize how impressive this is, right? So, and I remember being told, like, point blank by someone super smart, a circuit designer. And I said, that's the globally optimal circuit design. And he looked at me and he said,","zh":"是全局最优的。所以，我的意思是，这并不难证明。我马上就会画一张图来向你们展示这是什么意思。但坐下来想想，意识到这一点有多了不起，这还是挺值得的，对吧？我记得有人直接告诉我，一个超级聪明的电路设计师。我说，这就是全局最优的电路设计。他看着我说，","start":3191.79,"end":3219.45},{"id":221,"text":"How can you possibly say that? He said, this is a circuit with like, you know, 45 lengths and widths. What hubris? How could you say that? How do you know someone can't come up with another set of lengths and widths that, you know? Anyway, I looked at him and said, well, it's just because of the mathematical features.","zh":"你怎么可能这么说呢？他说，这是一个有45个长度和宽度的电路。这是多么傲慢啊？你怎么能说这是最优的呢？你怎么知道别人不能想出另一组长度和宽度，使得，你知道的，Anyway，我看着他说，这只是因为这个问题的数学特性。","start":3220.31,"end":3240.39},{"id":222,"text":"this problem. That's how I can make this real. I mean, but it's probably worthwhile for all of us to realize how absurd a statement that sounds like, right? If you solve a problem with, you know, I don't know, 10,000 variables, and you'd say, I just worked out the minimum fuel trajectory to put your satellite back on orbit where it's supposed to be. A perfectly reasonable person would say,","zh":"这个问题。这就是我如何让这个概念变得真实的。我的意思是，但对我们所有人来说，认识到这个说法听起来多么荒谬，这可能也是值得的，对吧？如果你解决了一个有10,000个变量的问题，然后你说，我计算出了最小燃料的轨迹，把你的卫星送回轨道上它应该在的位置。一个完全合理的人会说，","start":3241.78,"end":3264.74},{"id":223,"text":"How could you say something like that? There are so many sequences of thruster burns and things like that that would get you back. How could you possibly know that this has minimum fuel? Do you see what I'm saying? By the way, after this little speech, I quit. And that's all we're going to say from now on. We'll just say, hey, this is that. That's the optimal thing. And you get used to it. But it is probably worthwhile to think about how strong a statement it is.","zh":"你怎么可能这么说呢？有那么多推进器点火的序列和其他东西，都能把你送回去。你怎么可能知道这个是燃料最少的呢？你明白我的意思吗？顺便说一句，在这段小演讲之后，我辞职了。从现在开始，我们只说，嘿，这就是那个。这就是最优的东西。你习惯了就好。但思考一下这个说法有多强，这可能也是值得的。","start":3265.39,"end":3291.13},{"id":224,"text":"kind of all comes back to this right so okay um and let's see why i'm just going to draw a picture in fact we're not going to follow that i'm just going to draw a picture so um let's suppose that you have a point here it's locally optimal so i'm going to call that x loc right","zh":"总的来说，这一切都回到这个点上，对吧？嗯，好吧，让我们看看为什么。我马上就要画一张图了，事实上，我们不会按照那个来，我只画一张图。嗯，让我们假设你有一个点在这里，它是局部最优的，所以我把它叫做x loc，对吧？","start":3292.51,"end":3312.61},{"id":225,"text":"But let's suppose it's not globally optimal. So that means I'm going to find another point that's feasible and has a lower objective value. And I'm just going to call that over here x tilde. It could be x star, an optimal point. So this is feasible, feasible, locally optimal, and this has an objective value less than that. Everybody got it? Now I do this.","zh":"但让我们假设它不是全局最优的。这意味着我要找到另一个可行点，其目标值更低。我将把这个点称为x tilde。它可能是x star，即一个最优解。所以这个点是可行的，可行的，局部最优的，且其目标值低于那个点。大家明白了吗？现在我这样做。","start":3313.95,"end":3340.45},{"id":226,"text":"I draw the line segment between them. Now, oh, on that line segment, are all those points feasible? Why? The combination of the two. Yeah, because x smoke is feasible, so is x tilde. The set of feasible points is a convex set. That's a line segment. So any point on here is feasible.","zh":"我画出这两个点之间的线段。现在，哦，在这条线段上，所有这些点都是可行的吗？为什么？这是两个点的组合。是的，因为x smoke是可行的，x tilde也是可行的。可行点的集合是一个凸集。这是一条线段。因此，这里的所有点都是可行的。","start":3340.88,"end":3363.58}],"notes":["本段讨论了凸优化中的全局最优性概念，指出如果一个点是局部最优的，但不是全局最优的，那么存在另一个可行点，其目标函数值更低。这说明局部最优性并不能保证全局最优性，除非问题本身是凸的。","讲者通过一个例子说明，即使在有大量变量的情况下，如卫星轨道设计，也可以通过数学特性确定最优解。这强调了凸优化在实际问题中的强大能力。","讲者提到，凸集的性质使得在两个可行点之间的所有点也都是可行的，这是凸优化问题的一个关键特征。这种性质保证了在凸问题中，局部最优解即为全局最优解。","讲者通过一个简单的几何图示来说明凸集的性质，即两点之间的线段上的所有点都是可行的。这帮助听众直观理解凸优化问题的结构。","讲者强调，凸优化问题的全局最优性是基于问题本身的数学结构，而不是通过穷举所有可能的解来确定的。这种数学特性使得凸优化在实际应用中非常有用。","讲者通过一个反问的方式，引导听众思考全局最优性声明的强度，这有助于加深对凸优化概念的理解。"],"formulas":[],"uncertainties":["x smoke"],"diagram":"convex","start":3191.79,"end":3363.58,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3191.79,"text":"is globally optimal. So, I mean, it's not hard to show. I'll draw a picture in just a minute to show you what this means. But it is kind of worthwhile to sit back and say, like, to realize how impressive this is, right? So, and I remember being told, like, point blank by someone super smart, a circuit designer. And I said, that's the globally optimal circuit design. And he looked at me and he said,"},{"start":3220.31,"text":"How can you possibly say that? He said, this is a circuit with like, you know, 45 lengths and widths. What hubris? How could you say that? How do you know someone can't come up with another set of lengths and widths that, you know? Anyway, I looked at him and said, well, it's just because of the mathematical features."},{"start":3241.78,"text":"this problem. That's how I can make this real. I mean, but it's probably worthwhile for all of us to realize how absurd a statement that sounds like, right? If you solve a problem with, you know, I don't know, 10,000 variables, and you'd say, I just worked out the minimum fuel trajectory to put your satellite back on orbit where it's supposed to be. A perfectly reasonable person would say,"},{"start":3265.39,"text":"How could you say something like that? There are so many sequences of thruster burns and things like that that would get you back. How could you possibly know that this has minimum fuel? Do you see what I'm saying? By the way, after this little speech, I quit. And that's all we're going to say from now on. We'll just say, hey, this is that. That's the optimal thing. And you get used to it. But it is probably worthwhile to think about how strong a statement it is."},{"start":3292.51,"text":"kind of all comes back to this right so okay um and let's see why i'm just going to draw a picture in fact we're not going to follow that i'm just going to draw a picture so um let's suppose that you have a point here it's locally optimal so i'm going to call that x loc right"},{"start":3313.95,"text":"But let's suppose it's not globally optimal. So that means I'm going to find another point that's feasible and has a lower objective value. And I'm just going to call that over here x tilde. It could be x star, an optimal point. So this is feasible, feasible, locally optimal, and this has an objective value less than that. Everybody got it? Now I do this."},{"start":3340.88,"text":"I draw the line segment between them. Now, oh, on that line segment, are all those points feasible? Why? The combination of the two. Yeah, because x smoke is feasible, so is x tilde. The set of feasible points is a convex set. That's a line segment. So any point on here is feasible."}],"speech_gaps":[],"frame":"../frames/v005/020.webp","frame_time":3203.79},{"title":"凸函数的性质与局部最优解的判定","segments":[{"id":227,"text":"Now I want to draw as I move, let me call my parameter t, so this is t equals 0, t equals 1, and I want to draw the objective value as I go from t equals 0 to t equals 1. And I know two points already, I'm going to draw f0 of that point. This one, it starts at f of x local, here.","zh":"现在我想边移动边画图，让我把我的参数称为t，所以这是t等于0，t等于1，我想在从t等于0到t等于1的过程中画出目标值。我已经知道两个点，我要画出f0在该点的值。这个点，它从f of x local开始，这里。","start":3364.04,"end":3389.72},{"id":228,"text":"It ends at f0 of x tilde. By assumption, that's better than f0. So, I don't know where it is, but I'm going to draw it here. That's at f tilde of x, oh, what am I doing? f0 of x tilde. Everybody got this? Okay, now, on this line segment, I'm going to, what I now have to, we know that when I draw that, it's a convex function.","zh":"它结束于f0 of x tilde。根据假设，这比f0更好。所以我并不知道它在哪里，但我要在这里画出来。这是在f tilde of x，哦，我在做什么？是f0 of x tilde。大家明白了吗？好，现在在这条线段上，我需要做的是，我们知道当画出这个图时，它是一个凸函数。","start":3390.6,"end":3413.68},{"id":229,"text":"because it's a convex function of T, right? This is restricting a convex function to, in this case, an interval, but a line, right? And it's convex. I have to draw a convex function that starts here and ends here. Everybody got that? Okay, now when I do that, there's lots of ways to do it, but no matter what I do, it has to go down a little bit here. Okay?","zh":"因为它是一个关于T的凸函数，对吧？这是将一个凸函数限制在一个区间，也就是一条线，对吧？并且它是凸的。我需要画出一个凸函数，它从这里开始，到那里结束。大家明白了吗？好，现在当我这样做时，有很多方法可以做到，但不管我怎么做，它都必须在这里稍微下降一点。好吗？","start":3414.96,"end":3442.38},{"id":230,"text":"Now we got a problem. What is the problem? Remember, somebody alleged that x was locally optimal. So this means whoever said that was a liar. Let me tell you why. It says that there are points on this line segment with really small t, which is, it's very close to x local, and the objective value is less than x local.","zh":"现在我们遇到了一个问题。问题是啥？记得有人声称x是局部最优的。这意味着说这话的人是在撒谎。让我告诉你为什么。它说在这条线段上存在非常小的t值，也就是非常接近x local的点，目标值比x local更小。","start":3442.79,"end":3467.22},{"id":231,"text":"So, x local was definitely not a locally optimal point. Everybody got that? I mean, so, and you know, honestly, I could write it out as a proof. It's actually shorter if I do, but the picture kind of tells you everything. Does that make sense? So, that's the idea there. Okay. Okay. Now, here we can give like an extremely simple optimality condition for what, if f0 is differentiable, right? And it looks like this. It says that,","zh":"所以，x local肯定不是一个局部最优的点。大家明白了吗？我的意思是，说实话，我可以把它写成一个证明。如果我这样做，实际上会更简短，但图片基本上已经告诉你一切。这有意义吗？这就是这个想法。好。好。现在，我们可以给出一个极其简单的最优性条件，如果f0是可微的，对吧？看起来像这样。它说，","start":3467.67,"end":3497.71},{"id":232,"text":"a point x is optimal, if it's feasible, and the following is true, is that if x is the set of feasible points, it says that the gradient of f, transpose y minus x, that's got to be bigger than or equal to zero for all feasible y. And let's draw the picture. So these dashed curves are the level curves of f0. So if you slide this way, you're going downhill, and you're getting better values of f0, which,","zh":"一个点x是最优的，如果它是可行的，并且以下条件成立，即如果x是可行点的集合，它说梯度f的转置y减去x，这个值必须大于或等于零，对于所有可行的y。让我们画个图。这些虚线曲线是f0的等值线。如果你这样滑动，你就会向下坡走，从而得到更好的f0值，这，","start":3498.23,"end":3527.39}],"notes":["本段讲授了凸函数的性质，即当凸函数在一条线段上被限制时，其图像必须保持凸性。通过画图的方式，展示了从一个点到另一个点的凸函数图像，强调了凸函数在该线段上的行为特征。","接着，讲者指出，如果一个点被认为是局部最优解，但实际上存在在该线段上非常接近该点的其他点，其目标函数值更小，因此该点不是局部最优解。这说明了凸函数的性质如何用于反驳局部最优解的假设。","随后，讲者引入了一个简单的最优性条件，即当目标函数可微时，若某点是可行点，则其梯度在所有可行点上的投影必须大于等于零。这为判断局部最优解提供了数学依据。","最后，讲者通过绘制等高线图来说明梯度方向与目标函数值变化的关系，强调了梯度下降的方向与目标函数值减少之间的联系。"],"formulas":[],"uncertainties":["gradient of f, transpose y minus x"],"diagram":"none","start":3364.04,"end":3527.39,"asr_flags":[],"math_clarifications":["原始文本中没有明确说明f0(x)是凸函数，因此无法核定该公式是否正确。","原始文本中没有明确说明梯度在所有可行点上的投影大于等于零，因此无法核定该公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3364.04,"text":"Now I want to draw as I move, let me call my parameter t, so this is t equals 0, t equals 1, and I want to draw the objective value as I go from t equals 0 to t equals 1. And I know two points already, I'm going to draw f0 of that point. This one, it starts at f of x local, here."},{"start":3390.6,"text":"It ends at f0 of x tilde. By assumption, that's better than f0. So, I don't know where it is, but I'm going to draw it here. That's at f tilde of x, oh, what am I doing? f0 of x tilde. Everybody got this? Okay, now, on this line segment, I'm going to, what I now have to, we know that when I draw that, it's a convex function."},{"start":3414.96,"text":"because it's a convex function of T, right? This is restricting a convex function to, in this case, an interval, but a line, right? And it's convex. I have to draw a convex function that starts here and ends here. Everybody got that? Okay, now when I do that, there's lots of ways to do it, but no matter what I do, it has to go down a little bit here. Okay? Now..."},{"start":3442.79,"text":"Now we got a problem. What is the problem? Remember, somebody alleged that x was locally optimal. So this means whoever said that was a liar. Let me tell you why. It says that there are points on this line segment with really small t, which is, it's very close to x local, and the objective value is less than x local."},{"start":3467.67,"text":"So, x local was definitely not a locally optimal point. Everybody got that? I mean, so, and you know, honestly, I could write it out as a proof. It's actually shorter if I do, but the picture kind of tells you everything. Does that make sense? So, that's the idea there. Okay. Okay. Now, here we can give like an extremely simple optimality condition for what, if f0 is differentiable, right? And it looks like this. It says that,"},{"start":3498.23,"text":"a point x is optimal, if it's feasible, and the following is true, is that if x is the set of feasible points, it says that the gradient of f, transpose y minus x, that's got to be bigger than or equal to zero for all feasible y. And let's draw the picture. So these dashed curves are the level curves of f0. So if you slide this way, you're going downhill, and you're getting better values of f0, which,"}],"speech_gaps":[],"frame":"../frames/v005/021.webp","frame_time":3376.04},{"title":"梯度与可行集的支撑超平面","segments":[{"id":233,"text":"by the semantics of that being the objective, means you're getting happier. So you're getting happier as you go down this way. But these are the acceptable points. And so to solve the problem visually, it just means you find the lowest level curve that is on this thing. And that's going to be this point here. And what happens there is actually kind of interesting. It just touches it.","zh":"根据这个目标的语义，这意味着你变得越来越快乐。因此，当你沿着这个方向下降时，你会越来越快乐。但这些是可接受的点。因此，从视觉上解决这个问题，只需找到这个集合中的最低等高线。这就是这个点。在那里发生的事情实际上很有趣。它只是接触到了这个集合。","start":3527.82,"end":3555.4},{"id":234,"text":"And the gradient, which would be the outward normal, so the negative gradient like this, points downhill. And that is actually orthogonal to this tangent line here, right? So another way to say it is that the gradient defines a supporting hyperplane to the feasible set. That would use the language we had before, okay?","zh":"梯度，也就是外法向量，因此负梯度像这样指向山下。实际上，它与这里的切线是正交的，对吧？另一种说法是，梯度定义了可行集的支撑超平面。这就是我们之前使用的语言，对吧？","start":3556.54,"end":3577.88},{"id":235,"text":"So that's the this. I mean, I think this is kind of it's pretty basic and weirdly it looks complicated. Both proving both directions is each like one line for each one because it's just silly. It's so some things look and sound complicated and fancy and they're not. This is one of them. OK, so I think the picture is pretty clear. Right. So this is this is the picture. OK.","zh":"这就是这个意思。我的意思是，我觉得这有点基本，而且奇怪地看起来很复杂。证明两个方向的每个方向都只是一句话，因为这太傻了。有些事情看起来和听起来很复杂和高深，但实际上并非如此。这就是其中之一。好的，我觉得这个图已经很清楚了。对吧？这就是这个图。好的。","start":3578.49,"end":3603.61},{"id":236,"text":"Now, we can instantiate that, I mean, various versions of it. So, here's one version. Suppose there's no constraint set. If there's no constraint set, then what we're saying is x is all of Rn, and this inequality has to hold for all Rn. Any comment about that? If I tell you this inequality holds for any vector y, the only possible way that can happen is this gradient has to vanish.","zh":"现在，我们可以具体化这一点，意思是各种版本。这里有一个版本。假设没有约束集。如果没有任何约束集，那么我们说的是x是Rn中的所有点，这个不等式必须对所有Rn中的点成立。对此有什么评论吗？如果我告诉你这个不等式对任何向量y都成立，唯一可能的情况是梯度必须消失。","start":3607.5,"end":3635.34},{"id":237,"text":"Okay, because if you know if this gradient didn't vanish Then I would pick Y to be minus that gradient multiplied by your favorite extremely large number Right, and then this thing here would definitely not be bigger than or equal to zero everybody out following that so that that would be the the idea there","zh":"好的，因为如果你知道梯度没有消失，那么我可以选择Y为负梯度乘以你最喜欢的极大数，这样这个东西肯定不会大于或等于零。每个人都跟得上这个想法，对吧？","start":3636.17,"end":3654.91},{"id":238,"text":"Okay, so basically this recovers, I guess, you know, what you know from Calculus 2 or whatever course, right? It says that in an unconstrained problem, if f0 is differentiable, the gradient vanishing is what it means to solve the problem. By the way, this is a bit different from your Calculus 2 course. Let me tell you why.","zh":"好的，所以基本上，这恢复了你在微积分2或其他课程中所知道的内容，对吧？它说，在无约束问题中，如果f0是可微的，梯度消失就是解决问题的含义。顺便说一句，这与你的微积分2课程有点不同。让我告诉你原因。","start":3655.39,"end":3677.27},{"id":239,"text":"In your Calculus 2 course, when you said the gradient vanished, all it meant was that it's like a stationary point of the function. It could have been a saddle point. It could be a maximum. It could be a local minimum, local maximum, all this kind of stuff. Here, because we also know F0 is convex, it's actually globally optimal. I don't even have to say globally. It's just optimal. So that's it. So what that says is when...","zh":"在你的微积分2课程中，当你提到梯度消失时，它仅仅意味着这是一个函数的驻点。它可能是鞍点，也可能是最大值点，也可能是局部最小值或局部最大值，诸如此类。在这里，因为我们还知道F0是凸的，因此它实际上是全局最优的。我甚至不需要说‘全局’。它就是最优的。这就是它的意思。因此，当……","start":3677.93,"end":3706.4}],"notes":["本段讲解了梯度在凸优化中的作用，特别是梯度为零的条件。当没有约束集时，梯度必须为零，因为如果梯度不为零，可以通过选择一个足够大的向量使得不等式不成立。这与微积分中的极值点概念不同，因为凸函数的梯度为零意味着全局最优解。","在微积分课程中，梯度为零仅表示驻点，可能是极值点、鞍点等。但在凸优化中，由于函数的凸性，梯度为零意味着全局最优解，无需额外说明全局性。","本段通过反证法说明梯度为零的必要性，即如果梯度不为零，可以通过选择一个方向和足够大的标量使得不等式不成立，从而证明梯度必须为零。","该段还强调了凸函数的性质，即梯度为零时，函数在该点取得全局最优解，这与非凸函数的局部最优解不同。","通过对比微积分课程和凸优化课程，突出了凸函数在优化问题中的优势，即梯度为零即为全局最优解。","本段的逻辑推理清晰，通过反证法和对比说明了梯度为零的条件及其在凸优化中的意义。"],"formulas":[],"uncertainties":["Y to be minus that gradient multiplied by your favorite extremely large number"],"diagram":"none","start":3527.82,"end":3706.4,"asr_flags":[],"math_clarifications":["原始文本中未明确提及凸性或梯度为零的条件，因此无法核定该公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3527.82,"text":"by the semantics of that being the objective, means you're getting happier. So you're getting happier as you go down this way. But these are the acceptable points. And so to solve the problem visually, it just means you find the lowest level curve that is on this thing. And that's going to be this point here. And what happens there is actually kind of interesting. It just touches it."},{"start":3556.54,"text":"And the gradient, which would be the outward normal, so the negative gradient like this, points downhill. And that is actually orthogonal to this tangent line here, right? So another way to say it is that the gradient defines a supporting hyperplane to the feasible set. That would use the language we had before, okay?"},{"start":3578.49,"text":"So that's the this. I mean, I think this is kind of it's pretty basic and weirdly it looks complicated. Both proving both directions is each like one line for each one because it's just silly. It's so some things look and sound complicated and fancy and they're not. This is one of them. OK, so I think the picture is pretty clear. Right. So this is this is the picture. OK."},{"start":3607.5,"text":"Now, we can instantiate that, I mean, various versions of it. So, here's one version. Suppose there's no constraint set. If there's no constraint set, then what we're saying is x is all of Rn, and this inequality has to hold for all Rn. Any comment about that? If I tell you this inequality holds for any vector y, the only possible way that can happen is this gradient has to vanish."},{"start":3636.17,"text":"Okay, because if you know if this gradient didn't vanish Then I would pick Y to be minus that gradient multiplied by your favorite extremely large number Right, and then this thing here would definitely not be bigger than or equal to zero everybody out following that so that that would be the the idea there"},{"start":3655.39,"text":"Okay, so basically this recovers, I guess, you know, what you know from Calculus 2 or whatever course, right? It says that in an unconstrained problem, if f0 is differentiable, the gradient vanishing is what it means to solve the problem. By the way, this is a bit different from your Calculus 2 course. Let me tell you why."},{"start":3677.93,"text":"In your Calculus 2 course, when you said the gradient vanished, all it meant was that it's like a stationary point of the function. It could have been a saddle point. It could be a maximum. It could be a local minimum, local maximum, all this kind of stuff. Here, because we also know F0 is convex, it's actually globally optimal. I don't even have to say globally. It's just optimal. So that's it. So what that says is when..."}],"speech_gaps":[],"frame":"../frames/v005/022.webp","frame_time":3539.82},{"title":"凸优化中的最优性条件与拉格朗日乘数","segments":[{"id":240,"text":"In Calculus 2, you were taught how to do baby optimization stuff, which is kind of a behavioral thing, and it basically said you take the function, set the gradient equal to zero, and then something happens after that. That's my general memory of this. It turns out, for convex functions, that's exactly correct. Oh, and not only that, you will get an optimal point period.","zh":"在微积分2中，你被教导了如何进行基础的优化问题，这在某种程度上是一种行为性的内容，基本上就是取函数，将梯度设为零，然后之后会发生一些事情。这是我对此的一般记忆。事实上，对于凸函数来说，这完全正确。哦，不仅如此，你还会得到一个最优解。","start":3706.9,"end":3733.02},{"id":241,"text":"And none of this weird legal boilerplate or footnotes that says, you know, oh, it might be a maximum, it might be a minimum. Oh, it might be a saddle point. It might be a local minimum. It might be a local minimum. You know, none of that boilerplate. It's just optimal, period. Okay? So, okay.","zh":"不会有这种奇怪的法律条款或脚注，说哦，这可能是最大值，也可能是最小值。哦，也可能是鞍点，也可能是局部最小值。也可能是局部最小值。你不需要这些冗长的条款。它就是最优的，完事。明白吗？好的，好的。","start":3734.9,"end":3750.92},{"id":242,"text":"We'll look at optimality conditions later in the class, but some of them are just very easy to work out directly from this general principle. So if you have an equality constraint problem, what happens is you want to minimize f0 of x subject to ax equals b. And so you're optimal, you have to be feasible, you have to be in the domain, of course, and then you can work out what it means for that gradient inequality to hold for an affine set.","zh":"我们会在课程后面讨论最优性条件，但其中一些条件可以直接从这个一般原理推导出来。因此，如果你有一个等式约束问题，会发生的是你想要最小化x的f0，使得ax等于b。因此，你必须满足可行性，必须在定义域内，当然，然后你可以推导出梯度不等式在仿射集上成立的含义。","start":3753.88,"end":3776.82},{"id":243,"text":"And when you do, it's going to end up looking like this. That's also from your Calculus 2 class because these are Lagrange multipliers. We are going to cover that in about a week and a half, two weeks, in a theory called duality, after which I believe you will actually understand it.","zh":"当你这样做时，结果会看起来像这样。这也是你微积分2课程中学到的内容，因为这些就是拉格朗日乘数。我们将在大约一周半到两周后，在一个叫做对偶性的理论中讨论这一点，之后我相信你会真正理解它。","start":3777.22,"end":3795.18},{"id":244,"text":"So, because I don't mind admitting, I saw things about Lagrange multipliers two or three times and had no idea what they meant, did. Why would you do this? Why would you do that? Anyway, you know what I'm talking about, probably, right? So, I mean, unless you're in some, there are fields where this does come up. If you're probably, if you're in economics, maybe if you're in mechanical engineering, you actually do have a feel for it because it comes up there.","zh":"所以，我并不介意承认，我看到关于拉格朗日乘数的内容两到三次，却完全不知道它们是什么意思。为什么要做这个？为什么要做那个？不管怎样，你大概知道我在说什么，对吧？我的意思是，除非你处于某些领域，否则这种情况确实会出现。如果你可能在经济学领域，或者如果你在机械工程领域，你实际上会对它有所感觉，因为它在那里出现。","start":3795.56,"end":3821.76},{"id":245,"text":"Maybe in statistics? I don't know. But the point is, we'll cover this in detail later. So, okay. And you can work out other cases, like minimize a convex function over the non-negative orthon, and you can work out what it means. And actually, it's also, like, makes perfect sense, right? So, it would mean that if I minimize a convex function over non-negative orthon, let me just draw this.","zh":"也许在统计学中？我不确定。但重点是，我们之后会详细讲解这一点。所以，好的。你也可以推导其他情况，比如在非负正交集上最小化一个凸函数，你可以推导出这意味着什么。实际上，这也非常合乎逻辑，对吧？所以，这意味着如果我在非负正交集上最小化一个凸函数，让我画一下这个情况。","start":3822.28,"end":3849.09},{"id":246,"text":"I want to minimize the convex function over here. And here's an example. Here are some sublevel sets, okay? So like this, right? Like that. Here's some, whoops, okay. These are sublevel sets, right? Like that. So, you know, that's the optimal point, right? And we can sort of check this, right? Because what happens here, and this is just kind of very intuitive, right? What it says is that...","zh":"我想在这里最小化这个凸函数。这是一个例子。这里有一些次级水平集，对吧？就像这样，对吧？这里有一些，哎呀，好的。这些都是次级水平集，对吧？就像这样。你知道的，这就是最优解点，对吧？我们也可以大致验证这一点，对吧？因为这里发生的事情，这只是一个非常直观的解释，对吧？它所表达的是……","start":3850.62,"end":3877.4}],"notes":["本段主要讲解凸优化中的最优性条件，指出在凸函数的情况下，梯度为零的点即为最优解，无需考虑极值点或鞍点等复杂情况。这与微积分中的基本优化方法一致，但凸优化的性质使得结果更加直接和可靠。","课程提到拉格朗日乘数法，这是处理带约束优化问题的重要工具。虽然学生可能在早期学习中对拉格朗日乘数的理解存在困难，但课程将在后续的对偶理论部分详细讲解，帮助学生建立更深入的理解。","在处理带等式约束的优化问题时，最优解必须满足可行性条件，即位于可行域内。同时，梯度条件需要与约束条件结合，形成更复杂的优化条件。","课程还提到，对于非负正交约束下的凸函数优化，可以通过直观的子水平集图示来理解最优解的性质。这种直观的图示有助于学生理解优化问题的几何意义。","课程强调，虽然拉格朗日乘数法在某些领域（如经济学、机械工程）中较为常见，但在其他领域（如统计学）可能不那么常见，因此需要通过系统的学习来掌握。","最后，课程指出，最优解的判断可以通过子水平集的性质进行直观验证，这为理解优化问题的几何意义提供了基础。"],"formulas":[],"uncertainties":["non-negative orthon"],"diagram":"none","start":3706.9,"end":3877.4,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3706.9,"text":"In Calculus 2, you were taught how to do baby optimization stuff, which is kind of a behavioral thing, and it basically said you take the function, set the gradient equal to zero, and then something happens after that. That's my general memory of this. It turns out, for convex functions, that's exactly correct. Oh, and not only that, you will get an optimal point period."},{"start":3734.9,"text":"And none of this weird legal boilerplate or footnotes that says, you know, oh, it might be a maximum, it might be a minimum. Oh, it might be a saddle point. It might be a local minimum. It might be a local minimum. You know, none of that boilerplate. It's just optimal, period. Okay? So, okay."},{"start":3753.88,"text":"We'll look at optimality conditions later in the class, but some of them are just very easy to work out directly from this general principle. So if you have an equality constraint problem, what happens is you want to minimize f0 of x subject to ax equals b. And so you're optimal, you have to be feasible, you have to be in the domain, of course, and then you can work out what it means for that gradient inequality to hold for an affine set."},{"start":3777.22,"text":"And when you do, it's going to end up looking like this. That's also from your Calculus 2 class because these are Lagrange multipliers. We are going to cover that in about a week and a half, two weeks, in a theory called duality, after which I believe you will actually understand it."},{"start":3795.56,"text":"So, because I don't mind admitting, I saw things about Lagrange multipliers two or three times and had no idea what they meant, did. Why would you do this? Why would you do that? Anyway, you know what I'm talking about, probably, right? So, I mean, unless you're in some, there are fields where this does come up. If you're probably, if you're in economics, maybe if you're in mechanical engineering, you actually do have a feel for it because it comes up there."},{"start":3822.28,"text":"Maybe in statistics? I don't know. But the point is,
