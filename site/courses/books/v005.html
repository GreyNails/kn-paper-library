se y minus x, that's got to be bigger than or equal to zero for all feasible y. And let's draw the picture. So these dashed curves are the level curves of f0. So if you slide this way, you're going downhill, and you're getting better values of f0, which,"}],"speech_gaps":[],"frame":"../frames/v005/021.webp","frame_time":3376.04},{"title":"梯度与可行集的支撑超平面","segments":[{"id":233,"text":"by the semantics of that being the objective, means you're getting happier. So you're getting happier as you go down this way. But these are the acceptable points. And so to solve the problem visually, it just means you find the lowest level curve that is on this thing. And that's going to be this point here. And what happens there is actually kind of interesting. It just touches it.","start":3527.82,"end":3555.4},{"id":234,"text":"And the gradient, which would be the outward normal, so the negative gradient like this, points downhill. And that is actually orthogonal to this tangent line here, right? So another way to say it is that the gradient defines a supporting hyperplane to the feasible set. That would use the language we had before, okay?","start":3556.54,"end":3577.88},{"id":235,"text":"So that's the this. I mean, I think this is kind of it's pretty basic and weirdly it looks complicated. Both proving both directions is each like one line for each one because it's just silly. It's so some things look and sound complicated and fancy and they're not. This is one of them. OK, so I think the picture is pretty clear. Right. So this is this is the picture. OK.","start":3578.49,"end":3603.61},{"id":236,"text":"Now, we can instantiate that, I mean, various versions of it. So, here's one version. Suppose there's no constraint set. If there's no constraint set, then what we're saying is x is all of Rn, and this inequality has to hold for all Rn. Any comment about that? If I tell you this inequality holds for any vector y, the only possible way that can happen is this gradient has to vanish.","start":3607.5,"end":3635.34},{"id":237,"text":"Okay, because if you know if this gradient didn't vanish Then I would pick Y to be minus that gradient multiplied by your favorite extremely large number Right, and then this thing here would definitely not be bigger than or equal to zero everybody out following that so that that would be the the idea there","start":3636.17,"end":3654.91},{"id":238,"text":"Okay, so basically this recovers, I guess, you know, what you know from Calculus 2 or whatever course, right? It says that in an unconstrained problem, if f0 is differentiable, the gradient vanishing is what it means to solve the problem. By the way, this is a bit different from your Calculus 2 course. Let me tell you why.","start":3655.39,"end":3677.27},{"id":239,"text":"In your Calculus 2 course, when you said the gradient vanished, all it meant was that it's like a stationary point of the function. It could have been a saddle point. It could be a maximum. It could be a local minimum, local maximum, all this kind of stuff. Here, because we also know F0 is convex, it's actually globally optimal. I don't even have to say globally. It's just optimal. So that's it. So what that says is when...","start":3677.93,"end":3706.4}],"notes":["本段讲解了梯度在凸优化中的作用，特别是梯度为零的条件。当没有约束集时，梯度必须为零，因为如果梯度不为零，可以通过选择一个足够大的向量使得不等式不成立。这与微积分中的极值点概念不同，因为凸函数的梯度为零意味着全局最优解。","在微积分课程中，梯度为零仅表示驻点，可能是极值点、鞍点等。但在凸优化中，由于函数的凸性，梯度为零意味着全局最优解，无需额外说明全局性。","本段通过反证法说明梯度为零的必要性，即如果梯度不为零，可以通过选择一个方向和足够大的标量使得不等式不成立，从而证明梯度必须为零。","该段还强调了凸函数的性质，即梯度为零时，函数在该点取得全局最优解，这与非凸函数的局部最优解不同。","通过对比微积分课程和凸优化课程，突出了凸函数在优化问题中的优势，即梯度为零即为全局最优解。","本段的逻辑推理清晰，通过反证法和对比说明了梯度为零的条件及其在凸优化中的意义。"],"formulas":[],"uncertainties":["Y to be minus that gradient multiplied by your favorite extremely large number"],"diagram":"none","start":3527.82,"end":3706.4,"asr_flags":[],"math_clarifications":["原始文本中未明确提及凸性或梯度为零的条件，因此无法核定该公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3527.82,"text":"by the semantics of that being the objective, means you're getting happier. So you're getting happier as you go down this way. But these are the acceptable points. And so to solve the problem visually, it just means you find the lowest level curve that is on this thing. And that's going to be this point here. And what happens there is actually kind of interesting. It just touches it."},{"start":3556.54,"text":"And the gradient, which would be the outward normal, so the negative gradient like this, points downhill. And that is actually orthogonal to this tangent line here, right? So another way to say it is that the gradient defines a supporting hyperplane to the feasible set. That would use the language we had before, okay?"},{"start":3578.49,"text":"So that's the this. I mean, I think this is kind of it's pretty basic and weirdly it looks complicated. Both proving both directions is each like one line for each one because it's just silly. It's so some things look and sound complicated and fancy and they're not. This is one of them. OK, so I think the picture is pretty clear. Right. So this is this is the picture. OK."},{"start":3607.5,"text":"Now, we can instantiate that, I mean, various versions of it. So, here's one version. Suppose there's no constraint set. If there's no constraint set, then what we're saying is x is all of Rn, and this inequality has to hold for all Rn. Any comment about that? If I tell you this inequality holds for any vector y, the only possible way that can happen is this gradient has to vanish."},{"start":3636.17,"text":"Okay, because if you know if this gradient didn't vanish Then I would pick Y to be minus that gradient multiplied by your favorite extremely large number Right, and then this thing here would definitely not be bigger than or equal to zero everybody out following that so that that would be the the idea there"},{"start":3655.39,"text":"Okay, so basically this recovers, I guess, you know, what you know from Calculus 2 or whatever course, right? It says that in an unconstrained problem, if f0 is differentiable, the gradient vanishing is what it means to solve the problem. By the way, this is a bit different from your Calculus 2 course. Let me tell you why."},{"start":3677.93,"text":"In your Calculus 2 course, when you said the gradient vanished, all it meant was that it's like a stationary point of the function. It could have been a saddle point. It could be a maximum. It could be a local minimum, local maximum, all this kind of stuff. Here, because we also know F0 is convex, it's actually globally optimal. I don't even have to say globally. It's just optimal. So that's it. So what that says is when..."}],"speech_gaps":[],"frame":"../frames/v005/022.webp","frame_time":3539.82},{"title":"凸优化中的最优性条件与拉格朗日乘数","segments":[{"id":240,"text":"In Calculus 2, you were taught how to do baby optimization stuff, which is kind of a behavioral thing, and it basically said you take the function, set the gradient equal to zero, and then something happens after that. That's my general memory of this. It turns out, for convex functions, that's exactly correct. Oh, and not only that, you will get an optimal point period.","start":3706.9,"end":3733.02},{"id":241,"text":"And none of this weird legal boilerplate or footnotes that says, you know, oh, it might be a maximum, it might be a minimum. Oh, it might be a saddle point. It might be a local minimum. It might be a local minimum. You know, none of that boilerplate. It's just optimal, period. Okay? So, okay.","start":3734.9,"end":3750.92},{"id":242,"text":"We'll look at optimality conditions later in the class, but some of them are just very easy to work out directly from this general principle. So if you have an equality constraint problem, what happens is you want to minimize f0 of x subject to ax equals b. And so you're optimal, you have to be feasible, you have to be in the domain, of course, and then you can work out what it means for that gradient inequality to hold for an affine set.","start":3753.88,"end":3776.82},{"id":243,"text":"And when you do, it's going to end up looking like this. That's also from your Calculus 2 class because these are Lagrange multipliers. We are going to cover that in about a week and a half, two weeks, in a theory called duality, after which I believe you will actually understand it.","start":3777.22,"end":3795.18},{"id":244,"text":"So, because I don't mind admitting, I saw things about Lagrange multipliers two or three times and had no idea what they meant, did. Why would you do this? Why would you do that? Anyway, you know what I'm talking about, probably, right? So, I mean, unless you're in some, there are fields where this does come up. If you're probably, if you're in economics, maybe if you're in mechanical engineering, you actually do have a feel for it because it comes up there.","start":3795.56,"end":3821.76},{"id":245,"text":"Maybe in statistics? I don't know. But the point is, we'll cover this in detail later. So, okay. And you can work out other cases, like minimize a convex function over the non-negative orthon, and you can work out what it means. And actually, it's also, like, makes perfect sense, right? So, it would mean that if I minimize a convex function over non-negative orthon, let me just draw this.","start":3822.28,"end":3849.09},{"id":246,"text":"I want to minimize the convex function over here. And here's an example. Here are some sublevel sets, okay? So like this, right? Like that. Here's some, whoops, okay. These are sublevel sets, right? Like that. So, you know, that's the optimal point, right? And we can sort of check this, right? Because what happens here, and this is just kind of very intuitive, right? What it says is that...","start":3850.62,"end":3877.4}],"notes":["本段主要讲解凸优化中的最优性条件，指出在凸函数的情况下，梯度为零的点即为最优解，无需考虑极值点或鞍点等复杂情况。这与微积分中的基本优化方法一致，但凸优化的性质使得结果更加直接和可靠。","课程提到拉格朗日乘数法，这是处理带约束优化问题的重要工具。虽然学生可能在早期学习中对拉格朗日乘数的理解存在困难，但课程将在后续的对偶理论部分详细讲解，帮助学生建立更深入的理解。","在处理带等式约束的优化问题时，最优解必须满足可行性条件，即位于可行域内。同时，梯度条件需要与约束条件结合，形成更复杂的优化条件。","课程还提到，对于非负正交约束下的凸函数优化，可以通过直观的子水平集图示来理解最优解的性质。这种直观的图示有助于学生理解优化问题的几何意义。","课程强调，虽然拉格朗日乘数法在某些领域（如经济学、机械工程）中较为常见，但在其他领域（如统计学）可能不那么常见，因此需要通过系统的学习来掌握。","最后，课程指出，最优解的判断可以通过子水平集的性质进行直观验证，这为理解优化问题的几何意义提供了基础。"],"formulas":[],"uncertainties":["non-negative orthon"],"diagram":"none","start":3706.9,"end":3877.4,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3706.9,"text":"In Calculus 2, you were taught how to do baby optimization stuff, which is kind of a behavioral thing, and it basically said you take the function, set the gradient equal to zero, and then something happens after that. That's my general memory of this. It turns out, for convex functions, that's exactly correct. Oh, and not only that, you will get an optimal point period."},{"start":3734.9,"text":"And none of this weird legal boilerplate or footnotes that says, you know, oh, it might be a maximum, it might be a minimum. Oh, it might be a saddle point. It might be a local minimum. It might be a local minimum. You know, none of that boilerplate. It's just optimal, period. Okay? So, okay."},{"start":3753.88,"text":"We'll look at optimality conditions later in the class, but some of them are just very easy to work out directly from this general principle. So if you have an equality constraint problem, what happens is you want to minimize f0 of x subject to ax equals b. And so you're optimal, you have to be feasible, you have to be in the domain, of course, and then you can work out what it means for that gradient inequality to hold for an affine set."},{"start":3777.22,"text":"And when you do, it's going to end up looking like this. That's also from your Calculus 2 class because these are Lagrange multipliers. We are going to cover that in about a week and a half, two weeks, in a theory called duality, after which I believe you will actually understand it."},{"start":3795.56,"text":"So, because I don't mind admitting, I saw things about Lagrange multipliers two or three times and had no idea what they meant, did. Why would you do this? Why would you do that? Anyway, you know what I'm talking about, probably, right? So, I mean, unless you're in some, there are fields where this does come up. If you're probably, if you're in economics, maybe if you're in mechanical engineering, you actually do have a feel for it because it comes up there."},{"start":3822.28,"text":"Maybe in statistics? I don't know. But the point is, we'll cover this in detail later. So, okay. And you can work out other cases, like minimize a convex function over the non-negative orthon, and you can work out what it means. And actually, it's also, like, makes perfect sense, right? So, it would mean that if I minimize a convex function over non-negative orthon, let me just draw this."},{"start":3850.62,"text":"I want to minimize the convex function over here. And here's an example. Here are some sublevel sets, okay? So like this, right? Like that. Here's some, whoops, okay. These are sublevel sets, right? Like that. So, you know, that's the optimal point, right? And we can sort of check this, right? Because what happens here, and this is just kind of very intuitive, right? What it says is that..."}],"speech_gaps":[],"frame":"../frames/v005/023.webp","frame_time":3718.9},{"title":"等价问题与约束消除","segments":[{"id":247,"text":"This is partial f0, partial x2, that has to vanish. If it didn't vanish, we'd be in trouble. Because I could slide up and down here in the direction of the negative gradient and actually get a slightly better objective value while staying feasible. In which case, it was not optimal. But I'm slammed up against the boundary of the constraint here. I would love to go in that direction.","start":3877.99,"end":3903.45},{"id":248,"text":"I'd love to because my objective would go down. The problem is I'm at the boundary of the feasible set and I can't. Right? So anyway, when you work this out, you can just work this out algebraically and you get something like that, that condition there. Anyway, we'll come back to optimality conditions in about two weeks. Okay.","start":3904.1,"end":3924.07},{"id":249,"text":"Now we're going to talk about equivalent problems. I already said a little bit about it earlier. We actually saw two equivalent problems, in fact, earlier. Now we're going to talk about it because it's kind of an official idea we have.","start":3924.77,"end":3934.27},{"id":250,"text":"Two problems, and we're going to make it informal in this class. In CS theory, it's not informal, right? Here it is. There it's called a reduction, by the way, right? So here it's going to be informal. And we say basically if one problem is equivalent to another, if from a solution of one, I can create a solution of the other, right? And vice versa, right? So that's what that means, right? So that's exactly the idea of a reduction in computer science.","start":3937.16,"end":3965.71},{"id":251,"text":"Okay. And so there's a whole bunch of them that you should probably know about. And in fact, a lot of the software tools you're going to use actually are going to use, on your behalf, many reductions. And sorry, yeah, okay, whatever. Yeah, sorry. They'll use many equivalences, which are reductions in computer science that you don't need to know about, right? So, but you need to know about some of them because they're actually kind of, and I'll just mention some of them. A lot of them are kind of generic, but let's look at some. So here's one.","start":3968.87,"end":3995.93},{"id":252,"text":"Here's a problem with equality constraints, and we can just basically eliminate the equality constraints. I can take a new variable, right? And the first thing I do is I find a vector x zero that satisfies ax equals b, and I find a matrix whose range is exactly the null space of a.","start":3996.69,"end":4019.87},{"id":253,"text":"And what that tells you is that AX is equal to B if and only if you have the form X equals FZ plus X0. X0 and F, we can compute from A and B, right? So we compute them. I won't go into how we do that. There are lots of ways to do that. So you do that. If you do this, then this problem is equivalent to that problem, right? Oh, by the way, they're not equal.","start":4020.37,"end":4046.77}],"notes":["本段讲授了优化问题中梯度消失的条件，即当梯度不为零时，可以通过沿负梯度方向移动来改善目标函数值，但此时可能处于约束边界，无法继续优化。这说明了在优化过程中，梯度为零是局部最优的必要条件，但并非充分条件。","接下来，课程引入了等价问题的概念，强调了等价问题在优化中的重要性。等价问题指的是可以通过一个问题的解构造另一个问题的解，反之亦然。这种关系在计算机科学中被称为‘reduction’，但在本课程中以更非正式的方式进行讨论。","课程提到，等价问题在实际应用中非常重要，许多软件工具会利用这些等价关系来简化问题。虽然这些等价关系在计算机科学中可能较为复杂，但本课程会介绍一些基本的等价问题，帮助学生理解如何将约束问题转化为无约束问题。","在消除等式约束的例子中，讲者提到可以通过找到满足等式约束的向量和矩阵，将原问题转化为无约束问题。具体来说，通过构造一个新变量，使得原问题的约束条件被消除，从而简化问题。","最后，讲者强调了等价问题与等式约束消除之间的区别，指出虽然等价问题可以将原问题转化为另一种形式，但它们并不完全相等，而是具有某种等价关系。","本段内容涉及优化问题中的梯度条件、等价问题的概念及其在实际应用中的重要性，以及如何通过构造新变量来消除等式约束。这些内容为后续学习优化算法和问题转化奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3877.99,"end":4046.77,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3877.99,"text":"This in partial f0, partial x2, that has to vanish. If it didn't vanish, we'd be in trouble. Because I could slide up and down here in the direction of the negative gradient and actually get a slightly better objective value while staying feasible. In which case, it was not optimal. But I'm slammed up against the boundary of the constraint here. I would love to go in that direction."},{"start":3904.1,"text":"I'd love to because my objective would go down. The problem is I'm at the boundary of the feasible set and I can't. Right? So anyway, when you work this out, you can just work this out algebraically and you get something like that, that condition there. Anyway, we'll come back to optimality conditions in about two weeks. Okay."},{"start":3924.77,"text":"Now we're going to talk about equivalent problems. I already said a little bit about it earlier. We actually saw two equivalent problems, in fact, earlier. Now we're going to talk about it because it's kind of an official idea we have."},{"start":3937.16,"text":"Two problems, and we're going to make it informal in this class. In CS theory, it's not informal, right? Here it is. There it's called a reduction, by the way, right? So here it's going to be informal. And we say basically if one problem is equivalent to another, if from a solution of one, I can create a solution of the other, right? And vice versa, right? So that's what that means, right? So that's exactly the idea of a reduction in computer science."},{"start":3968.87,"text":"Okay. And so there's a whole bunch of them that you should probably know about. And in fact, a lot of the software tools you're going to use actually are going to use, on your behalf, many reductions. And sorry, yeah, okay, whatever. Yeah, sorry. They'll use many equivalences, which are reductions in computer science that you don't need to know about, right? So, but you need to know about some of them because they're actually kind of, and I'll just mention some of them. A lot of them are kind of generic, but let's look at some. So here's one."},{"start":3996.69,"text":"Here's a problem with equality constraints, and we can just basically eliminate the equality constraints. I can take a new variable, right? And the first thing I do is I find a vector x zero that satisfies ax equals b, and I find a matrix whose range is exactly the null space of a."},{"start":4020.37,"text":"And what that tells you is that AX is equal to B if and only if you have the form X equals FZ plus X0. X0 and F, we can compute from A and B, right? So we compute them. I won't go into how we do that. There are lots of ways to do that. So you do that. If you do this, then this problem is equivalent to that problem, right? Oh, by the way, they're not equal."}],"speech_gaps":[],"frame":"../frames/v005/024.webp","frame_time":3889.99},{"title":"消除等式约束","segments":[{"id":254,"text":"at all, right? Like, I mean, for one thing, at a very gross level, it's not. If you say this problem dot equality, if you say what is the length of this problem dot equality constraints, it's going to be however many, let's say this p, p equality constraints, it'll be p. Here, when I say this second problem dot equality constraints, if I say length of that, it's a list, it's an empty list.","start":4047.31,"end":4073.25},{"id":255,"text":"And so it's zero. And so, end of story, these are not equal. But they are equivalent, right? And here, in this case, the p star of the two problems, the optimal value is the same, right? And to explain what you do, you say, well, you want to solve this. So what we do is first we compute the f and the x0. Then we solve this problem. Now, z has nothing to do with this problem.","start":4073.84,"end":4099.43},{"id":256,"text":"at all, right? But then what I simply do is I return in this problem, I return fz star plus x zero. And that's going to be the solution here, right? So this actually also has a very important, like if someone comes up with a super fancy solver for a problem, right? They go, here's my, it's awesome, right? It's super fast. I don't, whatever it is, doesn't matter, right? Then you'd say only, only minor problem. It doesn't support equality constraints. Everybody got that?","start":4099.97,"end":4127.09},{"id":257,"text":"So this actually now, it's like no problem. I just write a wrapper around it. And my wrapper takes problems like this, calculates f and x0. We could write the whole wrapper beautifully. Like the first thing you do is you attempt to solve x equals b. What if b is not in the range of a? What do I do? I return that your problem is infeasible.","start":4127.68,"end":4149.05},{"id":258,"text":"Period. And then I don't have to do anything else. If it's feasible, I'm going to find an x0 and I'm going to find this f. I'm going to solve this problem using this person's fancy solver. I will then quietly return fz plus x0 and that will in fact be a solution of this problem. Everybody got it? So, okay. So that's called eliminating equality constraints. And actually there's a whole lot of confusion about that. Like, I think some very naive people","start":4149.96,"end":4177.18},{"id":259,"text":"think, this is great. And you say, why? And here would be the story. It's naive. It's totally wrong. But here's the story. I mean, it's plausible if you don't know what you're doing. Here it is. They say, well, I have this problem here. X has dimension 100. And I have 50 equality constraints. Everybody got that? Now, down here, let's assume that's got full rank and all that. So down here, Z has dimension 50.","start":4178.15,"end":4204.43}],"notes":["本段讲授了消除等式约束的概念，即通过将等式约束转化为变量替换，从而将原问题转化为无约束问题。讲者指出，虽然两个问题的约束条件不同，但它们的最优值相同，因此是等价的。讲者还提到，如果一个求解器不支持等式约束，可以通过编写包装器来处理，即计算f和x0，然后使用该求解器求解转化后的问题。","讲者进一步解释了如何处理等式约束的可行性问题。如果b不在矩阵A的列空间中，则问题不可行；如果可行，则找到x0和f，并使用求解器求解转化后的问题，最终返回fz + x0作为原问题的解。","讲者指出，消除等式约束是一个重要的概念，但存在一些误解。例如，有人认为只要将等式约束转化为变量替换，就能直接求解，但实际上这需要考虑约束的秩和可行性问题。","讲者通过一个例子说明了消除等式约束的潜在问题。假设变量x的维度是100，有50个等式约束，那么转化后的变量z的维度是50。如果矩阵A的秩为50，则转化后的变量z的维度是50，而原变量x的维度是100。","讲者强调，消除等式约束需要考虑约束的秩和可行性，不能简单地将等式约束转化为变量替换，否则可能导致错误的结论。","讲者指出，消除等式约束是一个重要的技巧，但需要谨慎处理，特别是在处理高维问题时，必须确保转化后的变量和约束的正确性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4047.31,"end":4204.43,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4047.31,"text":"at all, right? Like, I mean, for one thing, at a very gross level, it's not. If you say this problem dot equality, if you say what is the length of this problem dot equality constraints, it's going to be however many, let's say this p, p equality constraints, it'll be p. Here, when I say this second problem dot equality constraints, if I say length of that, it's a list, it's an empty list."},{"start":4073.84,"text":"And so it's zero. And so, end of story, these are not equal. But they are equivalent, right? And here, in this case, the p star of the two problems, the optimal value is the same, right? And to explain what you do, you say, well, you want to solve this. So what we do is first we compute the f and the x0. Then we solve this problem. Now, z has nothing to do with this problem."},{"start":4099.97,"text":"at all, right? But then what I simply do is I return in this problem, I return fz star plus x zero. And that's going to be the solution here, right? So this actually also has a very important, like if someone comes up with a super fancy solver for a problem, right? They go, here's my, it's awesome, right? It's super fast. I don't, whatever it is, doesn't matter, right? Then you'd say only, only minor problem. It doesn't support equality constraints. Everybody got that?"},{"start":4127.68,"text":"So this actually now, it's like no problem. I just write a wrapper around it. And my wrapper takes problems like this, calculates f and x0. We could write the whole wrapper beautifully. Like the first thing you do is you attempt to solve x equals b. What if b is not in the range of a? What do I do? I return that your problem is infeasible."},{"start":4149.96,"text":"Period. And then I don't have to do anything else. If it's feasible, I'm going to find an x0 and I'm going to find this f. I'm going to solve this problem using this person's fancy solver. I will then quietly return fz plus x0 and that will in fact be a solution of this problem. Everybody got it? So, okay. So that's called eliminating equality constraints. And actually there's a whole lot of confusion about that. Like, I think some very naive people"},{"start":4178.15,"text":"think, this is great. And you say, why? And here would be the story. It's naive. It's totally wrong. But here's the story. I mean, it's plausible if you don't know what you're doing. Here it is. They say, well, I have this problem here. X has dimension 100. And I have 50 equality constraints. Everybody got that? Now, down here, let's assume that's got full rank and all that. So down here, Z has dimension 50."}],"speech_gaps":[],"frame":"../frames/v005/025.webp","frame_time":4059.31},{"title":"消除与引入等式约束的对比","segments":[{"id":260,"text":"If I have 100 dimensional space, I have 50 equality constraints, everything's full rank, z is going to have dimension 50. And then someone says, oh, that's a better problem than that one to solve. And you go, why? And they go, hello, wouldn't you rather solve a problem with 50 variables than 100? Everybody see what I'm saying? It sounds plausible, but it's completely and totally wrong, which you will know later. So in fact, it could be.","start":4206.13,"end":4232.35},{"id":261,"text":"Could be the exact opposite. That you would much rather solve a problem with 100 variables than 50. I'm getting ahead of myself, but we'll come back to that later in the class. Okay? So, okay. You can do the opposite. Yes? Oh, that's linear algebra. Yeah, that's just standard linear algebra. Right? I don't know. I do a QR factorization of like F or, I don't know, something like that. A, sorry, A. Is that?","start":4232.87,"end":4262.5},{"id":262,"text":"I mean, I'd be happy to tell you later or something, but that's just linear algebra, right? Okay. Next up is the opposite of eliminating equality constraints is introducing equality constraints, right? Weirdly, this sounds really dumb. It's unbelievably useful, and we will see that later.","start":4263.59,"end":4287.14},{"id":263,"text":"So how does that work, right? You start with a problem like that, and you introduce a new variable, and you introduce equality constraints, right? Now, what's hilarious about this is someone says, oh, thanks for your problem. I just made you an equivalent problem. Oh, and by the way, you have to check that these equivalences play nice with convexity. I didn't do that for the other one, so let's go back and look, okay?","start":4287.98,"end":4314.24},{"id":264,"text":"Here, if that's a convex problem, we have to check this is. How come this is? How come? Yeah, because this function is convex because it's a convex function precomposed with an affine function. These are convex for the same reason. So we do have to say that. At this point, we're not even saying it, right? So, okay.","start":4316.04,"end":4338.73},{"id":265,"text":"Okay, so you uneliminate here. Now, what's hilarious about this is someone says, oh, yeah, I just converted your problem to a new problem. You go, oh, thank you. That's great. Tell me about the new problem. And you go, well, it's got more variables. And you're like, okay. And you go, oh, by the way, your problem didn't have any equality constraints. Now you have a bunch of them. This doesn't sound good, right? This story doesn't sound like it's going. Anyway, believe it or not, it's going to be super useful, this idea. Okay, so.","start":4339.86,"end":4367.32},{"id":266,"text":"Here's one. This is a famous one. These are all methods that a lot of people know and would learn about by hand, actually literally since the 1940s. So here's one.","start":4368.63,"end":4381.41}],"notes":["本段讨论了在凸优化中消除和引入等式约束的对比。讲者指出，虽然减少变量数量可能看起来更好，但实际上这并不总是正确的，甚至可能相反。讲者提到，消除等式约束可能涉及线性代数操作，如QR分解，而引入等式约束虽然听起来荒谬，但实际上是很有用的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4206.13,"end":4381.41,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4206.13,"text":"If I have 100 dimensional space, I have 50 equality constraints, everything's full rank, z is going to have dimension 50. And then someone says, oh, that's a better problem than that one to solve. And you go, why? And they go, hello, wouldn't you rather solve a problem with 50 variables than 100? Everybody see what I'm saying? It sounds plausible, but it's completely and totally wrong, which you will know later. So in fact, it could be."},{"start":4232.87,"text":"Could be the exact opposite. That you would much rather solve a problem with 100 variables than 50. I'm getting ahead . This is a famous one. These are all methods that a lot of people know and would learn about by hand, actually literally since the 1940s. So here's one."}],"speech_gaps":[],"frame":"../frames/v005/026.webp","frame_time":4218.13},{"title":"松弛变量与上图形式","segments":[{"id":267,"text":"You can take a linear inequality and introduce what's called a slack variable. That's like a standard term, not in math, but in, for example, OR, or in optimization, right? And these are just very simple and dumb, these little transformations. But this one says, we rewrite this as ai transpose x plus si equals bi, where si is a number bigger than zero, and that's called the slack.","start":4383.18,"end":4408.88},{"id":268,"text":"And slack makes perfect sense. So it means if you're right up against it, S is zero. If S is positive, it means this constraint is satisfied with strict inequality.","start":4409.47,"end":4420.05},{"id":269,"text":"And slack comes from the idea of a chain or a rope between two things. The constraint is if I put a steel cable between two things and I make it a meter long, then those two things cannot be more than a meter apart. If they're exactly a meter apart, then that chain is taut. That's not a word in optimization. But if they're less than a meter apart, then there's zero tension in the chain, and then it's slack.","start":4420.84,"end":4450.06},{"id":270,"text":"And that word did make it into optimization. Everybody, so that, if you're curious, that's what it means, right? Slack rope or Slack cable or something. Okay. Okay. So this is called introducing Slack variables. We'll show a couple of, this one is also kind of interesting. This says, this is, I have my standard form problem and I can rewrite it this way, which is hilarious. I introduce a new variable.","start":4450.68,"end":4474.58},{"id":271,"text":"So now my variables are xt. Now when you hear xt, you should be thinking graph, epigraph, hypograph, these kinds of things, because that's what it generally means when you have a variable and a comma, a scalar, right? And so here, this constraint here simply says that xt, the pair xt is in the epigraph.","start":4475.1,"end":4495.32},{"id":272,"text":"I mean, it's kind of silly. This just says t is bigger than the objective, right? And then it says you minimize t subject to this, okay? Now, here's what's cool about this. Some people say this in a very fancy way. They say things like, for convex optimization, a linear objective is universal. I don't even know what that means. Anyway, so it says, without loss of generality, well, if you can handle this constraint,","start":4495.98,"end":4522.56},{"id":273,"text":"and then you have a linear objective, you're good to go. You just solve the problem in epigraph form. Make sense? So that's why a lot of times if you'd say, you'd say, oh, I went to Google, I looked for code to solve this thing, and it's not there because the only thing I can find can solve a linear objective, and my problem has a nonlinear objective. And the reason is people are just expecting you to put something into epigraph form.","start":4523.5,"end":4553.0}],"notes":["本段讲解了松弛变量的概念，它用于将不等式约束转换为等式形式，通过引入一个正数变量si，使得原不等式变为等式。松弛变量在优化问题中非常常见，特别是在运筹学和优化领域。"],"formulas":[{"latex":"a_i^T x + s_i = b_i","symbols":"a_i^T x + s_i = b_i","explanation":"公式正确，表示引入松弛变量s_i后，线性不等式转换为等式。符号和等号使用正确，无需修改。","evidence":"You can take a linear inequality and introduce what's called a slack variable. That's like a standard term, not in math, but in, for example, OR, or in optimization, right? And these are just very simple and dumb, these little transformations. But this one says, we rewrite this as ai transpose x plus si equals bi, where si is a number bigger than zero, and that's called the slack."}],"uncertainties":[],"diagram":"none","start":4383.18,"end":4553.0,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复，公式正确且符合上下文描述。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4383.18,"text":"You can take a linear inequality and introduce what's called a slack variable. That's like a standard term, not in math, but in, for example, OR, or in optimization, right? And these are just very simple and dumb, these little transformations. But this one says, we rewrite this as ai transpose x plus si equals bi, where si is a number bigger than zero, and that's called the slack."},{"start":4409.47,"text":"And slack makes perfect sense. So it means if you're right up against it, S is zero. If S is positive, it means this constraint is satisfied with strict inequality."},{"start":4420.84,"text":"And slack comes from the idea of a chain or a rope between two things. The constraint is if I put a steel cable between two things and I make it a meter long, then those two things cannot be more than a meter apart. If they're exactly a meter apart, then that chain is taut. That's not a word in optimization. But if they're less than a meter apart, then there's zero tension in the chain, and then it's slack."},{"start":4450.68,"text":"And that word did make it into optimization. Everybody, so that, if you're curious, that's what it means, right? Slack rope or Slack cable or something. Okay. Okay. So this is called introducing Slack variables. We'll show a couple of, this one is also kind of interesting. This says, this is, I have my standard form problem and I can rewrite it this way, which is hilarious. I introduce a new variable."},{"start":4475.1,"text":"So now my variables are xt. Now when you hear xt, you should be thinking graph, epigraph, hypograph, these kinds of things, because that's what it generally means when you have a variable and a comma, a scalar, right? And so here, this constraint here simply says that xt, the pair xt is in the epigraph."},{"start":4495.98,"text":"I mean, it's kind of silly. This just says t is bigger than the objective, right? And then it says you minimize t subject to this, okay? Now, here's what's cool about this. Some people say this in a very fancy way. They say things like, for convex optimization, a linear objective is universal. I don't even know what that means. Anyway, so it says, without loss of generality, well, if you can handle this constraint,"},{"start":4523.5,"text":"and then you have a linear objective, you're good to go. You just solve the problem in epigraph form. Make sense? So that's why a lot of times if you'd say, you'd say, oh, I went to Google, I looked for code to solve this thing, and it's not there because the only thing I can find can solve a linear objective, and my problem has a nonlinear objective. And the reason is people are just expecting you to put something into epigraph form."}],"speech_gaps":[],"frame":"../frames/v005/027.webp","frame_time":4395.18},{"title":"凸优化中的选择最小化与拟凸优化","segments":[{"id":274,"text":"Other things you can do are things like selective minimization. So you have two variables here. I could actually eliminate x2. Suppose I can analytically minimize over f0 over x2. Then I can do that, and I have a problem that looks like this. This would be the case, for example, if this function were quadratic in x2. I can minimize a quadratic analytically.","start":4556.84,"end":4580.44},{"id":275,"text":"I could do that, and then I eliminate x2. And this is basically part of dynamic programming. That's what would happen in dynamic programming. If you want to find a good choice of an input over some sequence, you start at the end.","start":4580.98,"end":4595.4},{"id":276,"text":"you minimize over the last one that and then there this function is called like the value function or something like that right and you and you just keep going it all works and this one also like the all of these play nice with convexity uh so here the reason f zero tilde is convex is because it is partial minimization of f zero with respect to the variable x2 okay everybody got that so so all the rules you saw before","start":4595.9,"end":4624.42},{"id":277,"text":"we're now using for problems. Okay, I'll say a little bit about quasi-convex optimization. So if I have convex, you know, inequality constraints, linear equality constraints, and I minimize a quasi-convex function, that's called quasi-convex optimization. And you have to be very careful here because, for example, this is for sure a quasi-convex function. And by the way, it's actually really flat here.","start":4625.19,"end":4652.44},{"id":278,"text":"It's not that it's visually flat, it's flat. And then it keeps going up. This is quasi-convex. That point is for sure locally optimal. Because you wiggle a little bit left and right and the objective does not go down. But it is clearly not the optimum, which is here. So some things don't hold.","start":4653.06,"end":4675.18},{"id":279,"text":"in this case. But it turns out we can solve these using convex optimization pretty easily. And I'll show this trick and then we'll quit for today. So if f0 is quasi-convex, then what you do is you find a parameterized set of convex functions which have the following form. This defines a convex set in x.","start":4675.59,"end":4698.96},{"id":280,"text":"for each T. That's actually what it means to be quasi-convex, right? And so what I do is I express that as a convex function, phi T being less than zero. And here's an example. The ratio of a convex to a concave positive, a non-negative convex divided by a concave positive function, this is actually quasi-convex, okay?","start":4699.79,"end":4723.74}],"notes":["本段讲解了凸优化中的选择最小化（selective minimization）方法，即在存在多个变量的情况下，通过消除某些变量来简化问题。例如，当目标函数在某个变量上是二次函数时，可以解析地最小化该变量，从而得到一个简化的问题。这种方法与动态规划中的思想类似，即从序列的末尾开始逐步求解。","在动态规划中，通过从最后一步开始最小化，逐步向前推进，最终得到一个整体的最优解。这种策略在凸优化中同样适用，因为部分最小化后的函数仍保持凸性，从而保证了优化过程的可行性。","接下来，课程介绍了拟凸优化（quasi-convex optimization）的概念。当目标函数是拟凸函数，且约束条件为凸不等式和线性等式时，该问题被称为拟凸优化。需要注意的是，拟凸函数并不一定满足全局最优的性质，例如，某个点可能是局部最优，但并非全局最优。","尽管拟凸函数在某些情况下可能表现出平坦的特性，但其整体形状仍然保持上升趋势。因此，虽然局部最优存在，但全局最优可能位于其他位置。这说明在拟凸优化中，需要特别小心，不能简单地依赖局部最优。","课程还提到，拟凸优化可以通过凸优化方法求解。具体方法是构造一个参数化的凸函数集合，这些函数在变量上形成一个凸集。通过将原问题转化为这些凸函数的约束条件，可以利用凸优化的工具进行求解。","最后，课程以一个例子说明了拟凸函数的构造方式，即凸函数除以凹函数（前提是分母为正），结果仍然是拟凸函数。这种构造方式为拟凸优化提供了理论支持。"],"formulas":[{"latex":"f_0(x) = \\frac{f_{\\text{convex}}(x)}{f_{\\text{concave}}(x)}","symbols":"拟凸函数的构造方式","explanation":"该公式正确表达了拟凸函数的构造方式，即凸函数除以凹函数，且分母为正，符合拟凸函数的定义。","evidence":"for each T. That's actually what it means to be quasi-convex, right? And so what I do is I express that as a convex function, phi T being less than zero. And here's an example. The ratio of a convex to a concave positive, a non-negative convex divided by a concave positive function, this is actually quasi-convex, okay?"}],"uncertainties":["f zero tilde is convex is because it is partial minimization of f zero with respect to the variable x2"],"diagram":"none","start":4556.84,"end":4723.74,"asr_flags":[],"math_clarifications":["f_zero_tilde的定义未在原始文本中明确给出，因此无法核定其数学形式，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4556.84,"text":"Other things you can do are things like selective minimization. So you have two variables here. I could actually eliminate x2. Suppose I can analytically minimize over f0 over x2. Then I can do that, and I have a problem that looks like this. This would be the case, for example, if this function were quadratic in x2. I can minimize a quadratic analytically."},{"start":4580.98,"text":"I could do that, and then I eliminate x2. And this is basically part of dynamic programming. That's what would happen in dynamic programming. If you want to find a good choice of an input over some sequence, you start at the end."},{"start":4595.9,"text":"you minimize over the last one that and then there this function is called like the value function or something like that right and you and you just keep going it all works and this one also like the all of these play nice with convexity uh so here the reason f zero tilde is convex is because it is partial minimization of f zero with respect to the variable x2 okay everybody got that so so all the rules you saw before"},{"start":4625.19,"text":"we're now using for problems. Okay, I'll say a little bit about quasi-convex optimization. So if I have convex, you know, inequality constraints, linear equality constraints, and I minimize a quasi-convex function, that's called quasi-convex optimization. And you have to be very careful here because, for example, this is for sure a quasi-convex function. And by the way, it's actually really flat here."},{"start":4653.06,"text":"It's not that it's visually flat, it's flat. And then it keeps going up. This is quasi-convex. That point is for sure locally optimal. Because you wiggle a little bit left and right and the objective does not go down. But it is clearly not the optimum, which is here. So some things don't hold."},{"start":4675.59,"text":"in this case. But it turns out we can solve these using convex optimization pretty easily. And I'll show this trick and then we'll quit for today. So if f0 is quasi-convex, then what you do is you find a parameterized set of convex functions which have the following form. This defines a convex set in x."},{"start":4699.79,"text":"for each T. That's actually what it means to be quasi-convex, right? And so what I do is I express that as a convex function, phi T being less than zero. And here's an example. The ratio of a convex to a concave positive, a non-negative convex divided by a concave positive function, this is actually quasi-convex, okay?"}],"speech_gaps":[],"frame":"../frames/v005/028.webp","frame_time":4568.84},{"title":"凸函数的子级集与二分法","segments":[{"id":281,"text":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?","start":4726.93,"end":4752.69},{"id":282,"text":"So that's a convex function. So it's a convex in x, not jointly in x and t, but in x. For each t, positive, not negative, this is a convex function, right? And so what this says is I have a specific way of seeing if I can...","start":4753.18,"end":4773.5},{"id":283,"text":"if I can find a point that has that value. And then what we do is just bisection. And I'll quit very briefly, but this is the idea. What you do is you simply solve a feasibility problem. This one basically says, can you find a point where f0 of x is less than t? That's this.","start":4773.93,"end":4794.97},{"id":284,"text":"Right? These are the constraints. If you can, then you found a point, and then you know for sure the optimal P star is less than that number. If the answer is you can't, then you know that P star is above there. Okay? And you just use bisection. So we'll quit here today, and then we'll continue on Thursday.","start":4795.61,"end":4817.58}],"notes":["本段讲解了如何通过子级集来判断一个函数是否为凸函数。具体来说，通过将函数p(x)/q(x) ≤ t转化为p(x) ≤ t q(x)，并进一步转化为p(x) - t q(x) ≤ 0，从而判断该函数是否为凸函数。这里强调了q(x)为正数的条件，以及如何通过不等式变形来验证凸性。","讲者指出，该函数在x上是凸函数，而不是在x和t的联合空间上。对于每个正数t，该函数在x上保持凸性。这表明，通过选择不同的t值，可以验证函数在不同子级集上的凸性。","讲者提到，通过二分法可以找到满足条件的点。具体来说，通过求解可行性问题，即是否存在x使得f0(x) \u003c t，从而确定最优值P*的上下界。如果存在这样的点，则P*小于该t值；如果不存在，则P*大于该t值。","讲者强调了二分法的应用，即通过不断调整t的值，逐步缩小P*的可能范围，直到找到最优解。这种方法在凸优化中非常常见，因为它能够有效地处理大规模优化问题。"],"formulas":[{"latex":"p(x)/q(x) \\text{ is less than or equal to } t","symbols":"p(x)/q(x) ≤ t","explanation":"该公式正确表达了子水平集的定义，即p(x)/q(x) ≤ t。q(x)为正数，因此乘以q(x)不改变不等式方向。","evidence":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?"},{"latex":"p(x) - t q(x) \\text{ is less than or equal to } 0","symbols":"p(x) - t q(x) ≤ 0","explanation":"该公式正确表达了将原不等式p(x)/q(x) ≤ t转换为p(x) - t q(x) ≤ 0的过程，适用于q(x) > 0的情况。","evidence":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?"},{"latex":"f_0(x) \u003c t","symbols":"f0(x) \u003c t","explanation":"该公式正确表达了可行性问题的约束条件，即f0(x) \u003c t，用于判断是否存在满足条件的点。","evidence":"if I can find a point that has that value. And then what we do is just bisection. And I'll quit very briefly, but this is the idea. What you do is you simply solve a feasibility problem. This one basically says, can you find a point where f0 of x is less than t? That's this."}],"uncertainties":[],"diagram":"none","start":4726.93,"end":4817.58,"asr_flags":[],"math_clarifications":["所有公式均基于原文内容，未进行额外假设或修改。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4726.93,"text":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?"},{"start":4753.18,"text":"So that's a convex function. So it's a convex in x, not jointly in x and t, but in x. For each t, positive, not negative, this is a convex function, right? And so what this says is I have a specific way of seeing if I can..."},{"start":4773.93,"text":"if I can find a point that has that value. And then what we do is just bisection. And I'll quit very briefly, but this is the idea. What you do is you simply solve a feasibility problem. This one basically says, can you find a point where f0 of x is less than t? That's this."},{"start":4795.61,"text":"Right? These are the constraints. If you can, then you found a point, and then you know for sure the optimal P star is less than that number. If the answer is you can't, then you know that P star is above there. Okay? And you just use bisection. So we'll quit here today, and then we'll continue on Thursday."}],"speech_gaps":[],"frame":"../frames/v005/029.webp","frame_time":4738.93}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
