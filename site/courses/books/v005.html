由不能现在就运行 pip install CVXPy。因为之后你将会看到，代码实际上会与我们所讲的内容相呼应。","start":32.37,"end":54.73},{"id":2,"text":"Actually, all of the stuff we've done here. The composition rules, all sorts of things like that. So this is, I mean, depends, but this is not at all a bad time to do that. By next week, you'll need to do it. But it might be sort of fun to actually see the stuff we've been talking about, but now sort of codified in, well, Python in this case. So it depends on your learning style, but it might help make all of this look more real. Well, it's going to get more real very quickly.","zh":"实际上，我们在这里所做的一切，包括组合规则，各种各样的内容。因此，我意思是，这取决于你，但此时并不是一个不好的时机去这么做。下周你将需要这么做。但也许现在看到我们所讨论的内容，以某种方式被编码成实际的代码，会有些乐趣。这取决于你的学习风格，但也许这会让所有内容看起来更加真实。很快，它就会变得更加真实。","start":55.29,"end":84.53},{"id":3,"text":"Right. So let's see what else was I going to say about that? Now, maybe maybe that's it for now. OK, so and homework, too, I would I'd also I would just mention is, I believe, the last not fun homework. That's the one you're doing right now. Right. So we transition in homework three to actually interesting stuff.","zh":"对。那么我原本还想再说些什么关于这个呢？也许这就是现在要讲的全部内容了。好的，关于作业，我也要提一下，我认为这是最后一项不那么有趣的作业。这就是你现在正在做的作业。对。我们在作业三中将真正进入一些有趣的内容。","start":85.08,"end":111.61},{"id":4,"text":"So just to give you a rough idea. So you're not going to get 10 weeks of homework one and homework two type things.","zh":"为了给你一个大致的了解。你不会得到长达十周的类似作业一和作业二那样的作业。","start":112.5,"end":119.12},{"id":5,"text":"So we're going to segue to actually stuff that's interesting and useful and all that kind of stuff. Any questions? Now, I guess we are literally at the emotional low point of the class. Although I suppose it's not that... I mean, if you've survived, then I guess that's good news. Any questions about where we head from here? Okay, if not...","zh":"我们将转向真正有趣且有用的内容。有任何问题吗？我想我们实际上已经到达了课程的情感低谷点。尽管我猜这并不是那么糟糕……我的意思是，如果你能坚持到现在，那应该是个好消息。关于接下来我们要往哪里走，有任何问题吗？如果没有……","start":120.38,"end":145.24},{"id":6,"text":"What we'll do is I'm going to finish with two more useful extensions of the idea of convexity that we're going to use in the SQL. Actually, everything we talk about we'll use later in the class.","zh":"我们将做的是，我将结束时再介绍两个凸性的有用扩展，这些内容我们将用在SQL中。实际上，我们所讨论的一切内容，都会在课程中后期被使用到。","start":146.27,"end":159.95}],"notes":["本段主要介绍了课程的转折点，即从理论讲解转向实际应用。讲师提到课程已经进行到三分之一，进入了一个关键点，从低谷开始逐步上升，接下来的内容将更加实用，涉及可操作和可编码的问题。讲师还提到，如果学生能够坚持到此时，说明他们已经掌握了前面的内容，这是一个积极的信号。","讲师建议学生可以尝试使用CVXPy库进行实践，这将帮助他们将课堂上讲授的理论知识转化为实际代码。这不仅有助于加深理解，还能让学生更直观地看到理论在实际中的应用。","讲师提到，接下来的作业将不再像前几周那样枯燥，而是会涉及更有趣和实用的内容。这表明课程内容将逐步从基础理论转向实际应用，帮助学生掌握可操作的技能。","讲师强调，课程的低谷点已经过去，接下来的内容将更加有趣和实用。这表明课程结构设计上有一个明确的转折点，从理论讲解转向实践应用。","讲师提到，接下来将讨论凸性的两个有用扩展，这些内容将在后续课程中使用。这表明课程内容具有连贯性，前面的理论知识将在后续应用中得到体现。","讲师在最后提到，所有讨论的内容将在后续课程中使用，这表明课程内容具有系统性和连贯性，理论与实践紧密结合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":159.95,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.23,"text":"Today is actually like maybe a third of the way through the lecture today is an inflection point in the course. We come to the emotional, I would say the bottom, and then we start climbing out. Later today, we'll be talking about problems, and then we're inching our way towards actually things that are actually actionable, things you can actually do and code, and that's coming."},{"start":32.37,"text":"And so it's a good point. If you survived this far, that's pretty good. Let me say a little bit more about that. Depending, I mean, you don't need to, but there's absolutely no reason that you couldn't like basically pip install CVXPy now, if you're curious. Because then, and then what you'll see is actually the code is going to mirror."},{"start":55.29,"text":"Actually, all of the stuff we've done here. The composition rules, all sorts of things like that. So this is, I mean, depends, but this is not at all a bad time to do that. By next week, you'll need to do it. But it might be sort of fun to actually see the stuff we've been talking about, but now sort of codified in, well, Python in this case. So it depends on your learning style, but it might help make all of this look more real. Well, it's going to get more real very quickly."},{"start":85.08,"text":"Right. So let's see what else was I going to say about that? Now, maybe maybe that's it for now. OK, so and homework, too, I would I'd also I would just mention is, I believe, the last not fun homework. That's the one you're doing right now. Right. So we transition in homework three to actually interesting stuff."},{"start":112.5,"text":"So just to give you a rough idea. So you're not going to get 10 weeks of homework one and homework two type things."},{"start":120.38,"text":"So we're going to segue to actually stuff that's interesting and useful and all that kind of stuff. Any questions? Now, I guess we are literally at the emotional low point of the class. Although I suppose it's not that... I mean, if you've survived, then I guess that's good news. Any questions about where we head from here? Okay, if not..."},{"start":146.27,"text":"What we'll do is I'm going to finish with two more useful extensions of the idea of convexity that we're going to use in the SQL. Actually, everything we talk about we'll use later in the class."}],"speech_gaps":[],"frame":"../frames/v005/001.webp","frame_time":17.23},{"title":"对数凹函数与对数凸函数","segments":[{"id":7,"text":"And remember that I said that there's, you know, there's a whole industry of people coming up with various extensions of convexity and there's pseudo convexity and quasi convexity and log convexity. We'll talk about that. All sorts of things. And there's like a whole bunch of these things and, you know, whole books written on them and all that kind of stuff. So we have selected a small subset of these that are actually useful. Quasi convex, which I talked about last time is one and the other one.","zh":"请记住，我曾说过，有一整个行业的人们在提出各种凸性的扩展，比如拟凸性、准凸性和对数凸性。我们将会讨论这些内容。各种各样的东西。而且，这些概念有很多，甚至有整本书专门写这些内容。因此，我们只选择了一小部分实际上有用的。准凸性，我上次已经讲过，是其中之一，另一个也是。","start":162.08,"end":189.06},{"id":8,"text":"which is interesting, comes up in a lot of fields, but especially in statistics, is the idea of log-concave and log-convex functions. And that's what we're going to talk about today first. So, what is it? Actually, it's super-duper simple. We just say that a function, which has to be positive, is log-concave if its log is concave. I mean, so that's all it means. Okay? Sorry.","zh":"有趣的是，这个概念在很多领域都会出现，尤其是在统计学中，就是对数凹函数和对数凸函数的概念。今天我们将首先讨论这个。那么，什么是它呢？实际上，它非常简单。我们说一个函数，必须是正的，如果它的对数是凹的，那么它就是对数凹函数。我的意思是，这就是它的全部含义。明白吗？抱歉。","start":189.5,"end":215.22},{"id":9,"text":"Yes, log-concave. Now, there's a weird asymmetry here. And it turns out it's log-concave things that come up all the time, not log-convex. So if you do a Google search on log-concave, you'll get zillions of papers and books and things like that. Log-convex, you'll get almost nothing. So it's just a weird, I mean, I don't know the reason for that, but there's a weird asymmetry.","zh":"是的，对数凹函数。这里有一个奇怪的不对称性。事实上，经常出现的是对数凹函数，而不是对数凸函数。如果你在谷歌上搜索“对数凹函数”，你会得到无数篇论文和书籍之类的内容。而“对数凸函数”的搜索结果几乎为零。这只是一个奇怪的现象，我不知道原因，但确实存在这种不对称性。","start":216.26,"end":239.7},{"id":10,"text":"So what that means is if you take the Jensen inequality that defines convexity for the log, and then you exponentiate it, then you get this. And it's actually real interesting. It says that a log-concave function, when you evaluate it at a mixture of arguments, that's theta x plus 1 minus theta y, then what happens is if it were concave, this would simply be bigger than or equal to...","zh":"这意味着如果你取定义凸性的Jensen不等式，并对它进行指数运算，那么你就会得到这个结果。实际上，这非常有趣。它说明，当对数凹函数在混合参数θx + (1 - θ)y处进行评估时，如果它是凹的，那么结果将大于或等于……","start":240.8,"end":266.36},{"id":11,"text":"the weighted arithmetic mean of f of x and f of y, right? That's what it means to be concave. Here, it's actually, this is the weighted geometric mean. That's what people call it. So it's the weighted geometric mean, right? So for example, if theta is a half, it's literally the geometric mean of the two values, okay? So I mean, this is just kind of repeating stuff.","zh":"f(x)和f(y)的加权算术平均值，对吧？这就是凹性的含义。在这里，实际上是加权几何平均值。这就是人们所说的。因此，它就是加权几何平均值，对吧？例如，如果θ是1/2，那么它就是这两个值的几何平均值，对吧？我的意思是，这基本上是在重复之前的内容。","start":267.61,"end":287.69},{"id":12,"text":"So, you know, there's a bunch of examples like, you know, powers. These powers are log convex if A is negative, and they're log concave for A being bigger than or equal to zero, right? So that's one. But mostly it comes up in things like probability densities. So there, a good example is that here's a normal density on Rn, right? So that's the density of a...","zh":"所以，你知道的，有很多例子，比如幂函数。这些幂函数在A为负数时是log凸的，在A大于或等于零时是log凹的，对吧？这是其中一个例子。但大多数情况下，它出现在像概率密度这样的事物中。例如，这里有一个在Rn上的正态密度，对吧？这就是...的密度。","start":289.64,"end":316.64}],"notes":["本段介绍了对数凹函数和对数凸函数的基本概念，指出对数凹函数在统计学中更为常见。对数凹函数的定义是函数必须为正，并且其对数为凹函数。对数凸函数则相反，但实际应用中对数凹函数更为普遍。","讲者提到对数凹函数的定义与Jensen不等式相关，通过指数化Jensen不等式可以得到对数凹函数的性质。具体来说，对数凹函数在混合参数下的值大于等于加权几何平均值，而对数凸函数则相反。","讲者举了幂函数的例子，说明当指数A为负时，幂函数是对数凸的；当A大于等于零时，幂函数是对数凹的。这表明对数凹和对数凸函数的性质与指数的正负有关。","讲者还提到对数凹函数在概率密度函数中的应用，例如正态分布的密度函数是对数凹的。这说明对数凹函数在统计学和概率论中有重要的应用。","讲者指出对数凹函数在文献中出现的频率远高于对数凸函数，这可能与实际应用需求有关，但具体原因未明确说明。","讲者强调对数凹函数的定义和性质与凸函数的定义密切相关，但通过指数化操作后，其性质发生了变化，这需要特别注意。"],"formulas":[],"uncertainties":["log-convex"],"diagram":"none","start":162.08,"end":316.64,"asr_flags":[],"math_clarifications":["原句中提到log-concave函数的性质，即其在混合点处的值大于等于加权几何平均，但提供的公式中描述为加权算术平均，这与实际数学定义不符，因此需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":162.08,"text":"And remember that I said that there's, you know, there's a whole industry of people coming up with various extensions of convexity and there's pseudo convexity and quasi convexity and log convexity. We'll talk about that. All sorts of things. And there's like a whole bunch of these things and, you know, whole books written on them and all that kind of stuff. So we have selected a small subset of these that are actually useful. Quasi convex, which I talked about last time is one and the other one."},{"start":189.5,"text":"which is interesting, comes up in a lot of fields, but especially in statistics, is the idea of log-concave and log-convex functions. And that's what we're going to talk about today first. So, what is it? Actually, it's super-duper simple. We just say that a function, which has to be positive, is log-concave if its log is concave. I mean, so that's all it means. Okay? Sorry."},{"start":216.26,"text":"Yes, log-concave. Now, there's a weird asymmetry here. And it turns out it's log-concave things that come up all the time, not log-convex. So if you do a Google search on log-concave, you'll get zillions of papers and books and things like that. Log-convex, you'll get almost nothing. So it's just a weird, I mean, I don't know the reason for that, but there's a weird asymmetry."},{"start":240.8,"text":"So what that means is if you take the Jensen inequality that defines convexity for the log, and then you exponentiate it, then you get this. And it's actually real interesting. It says that a log-concave function, when you evaluate it at a mixture of arguments, that's theta x plus 1 minus theta y, then what happens is if it were concave, this would simply be bigger than or equal to..."},{"start":267.61,"text":"the weighted arithmetic mean of f of x and f of y, right? That's what it means to be concave. Here, it's actually, this is the weighted geometric mean. That's what people call it. So it's the weighted geometric mean, right? So for example, if theta is a half, it's literally the geometric mean of the two values, okay? So I mean, this is just kind of repeating stuff."},{"start":289.64,"text":"So, you know, there's a bunch of examples like, you know, powers. These powers are log convex if A is negative, and they're log concave for A being bigger than or equal to zero, right? So that's one. But mostly it comes up in things like probability densities. So there, a good example is that here's a normal density on Rn, right? So that's the density of a..."}],"speech_gaps":[],"frame":"../frames/v005/002.webp","frame_time":174.08},{"title":"对数凹函数与分布的性质","segments":[{"id":13,"text":"standard, normal, random variable. And here, if you take a look at this, this thing is log concave, right? Let's check that. Well, if I take the log of it, this is just a constant, and it's completely irrelevant for curvature, right? And then over here, you take the log of that, and you get a negative quadratic. Sigma is positive definite, so this thing here is going to be concave, and I'm including the minus sign here.","zh":"标准正态随机变量。在这里，如果你看一下，这个函数是凹函数，对吧？让我们来验证一下。如果我对它取对数，这只是一个常数，对曲率完全无关紧要，对吧？然后在这里，你对它取对数，你会得到一个负二次函数。σ是正定的，因此这里的函数将是凹函数，而且我在这里包含了负号。","start":317.21,"end":343.45},{"id":14,"text":"Okay, so that's sort of your canonical example of a log. And in fact, people refer, if you have a measure.","zh":"好的，所以这就是一个对数凹函数的典型例子。事实上，如果你有一个测度，人们会这样称呼它。","start":343.88,"end":350.86},{"id":15,"text":"that has a density that's log-concave. It's called a log-concave measure. And they're super-duper important in lots of different fields. It comes up in economics, comes up in statistics a lot. And for example, again, this is just a more advanced topic. You don't have to know about it. It's, for example, a very good regularizer. Like if you say, I'm going to fit a distribution to my data and you insist that that distribution be log-concave, that's actually a very sensible regularizer. Again, this is just for...","zh":"大量的常见密度函数都是对数凹的。我实际上不记得具体是哪些，但你知道，这是一个很长的列表，像大多数，可能大多数或至少一半的已命名密度函数都是对数凹的。你很容易就能判断出哪些是对数凹的。明白了吗？所以这些是一些例子。","start":351.58,"end":379.86},{"id":16,"text":"people who know what I'm talking about, right? Okay. By the way, a ton of common densities are log-concave. I actually don't remember which ones, but, you know, it's like a long list of, like, most, like, probably most or at least, you know, half of all kind of named densities are log-concave. And it's not very hard for you to figure out, you know, which is which. Okay? So those are some examples. Okay.","zh":"这里有一个例子。这个例子显然不明显。这个主题中将有一个新的内容，我稍后会讲到。但这个例子显然不明显，对吧？这里是一个标准高斯分布（正态分布）在实数域上的累积分布函数（CDF）。","start":380.06,"end":405.46},{"id":17,"text":"Here's one. This one is not obvious at all. It's going to rely on, there's going to be one new thing in this topic, which I'll get to shortly. But this is not obvious at all, right? So here's the cumulative distribution of a standard Gaussian distribution on R, right? So that's the CDF.","zh":"当然，这个函数你可以用一些库来计算，以及所有这些事情，我意思是，显然。但这个函数实际上是对数凹的，这显然不明显。事实上，这就像一个家庭作业题，而且不是简短的题目，还有提示。所以它并不完全明显，但它是正确的。实际上，我们稍后会看到，任何分布函数（CDF）都是……","start":406.53,"end":425.65},{"id":18,"text":"Now, of course, this function you can, I mean, there's libraries that compute this and all that sort of stuff, I mean, obviously. But this is not obvious at all, that this is actually log-concave. So there's, in fact, that's like a homework exercise, and it's not a short one, and it's got hints. So it's not totally obvious, but it's true. Actually, we're going to see later that any CDF of...","zh":"当然，这个函数你可以，我的意思是，有库可以计算这个以及所有这类事情，我的意思是，显然。但这个函数实际上是对数凹的，这并不明显。事实上，这就像一个家庭作业题，而且不是简短的题目，还有提示。所以它并不完全明显，但它是正确的。实际上，我们之后会看到，任何分布函数（CDF）的...","start":426.42,"end":453.86},{"id":19,"text":"Any cumulative distribution function of a log-concave density is going to be also log-concave. Okay? So, okay. So here's some properties. I mean, some are obvious. This just translates, you know, if you write out the formula for what the Hessian of the log of f is, and you say that's less than or equal to zero, you know, in a matrix sense.","zh":"任何对数凹密度的累积分布函数也都是对数凹的。好的？所以，这里有一些性质。我的意思是，有些是显而易见的。这仅仅意味着，如果你写出对数密度函数的Hessian矩阵的表达式，并说它小于或等于零，你知道的，在矩阵意义上。","start":454.25,"end":481.98}],"notes":["本段主要讲解了对数凹函数的概念及其在概率分布中的应用。首先，讲者指出标准正态分布是log-concave的，因为其对数是凹函数。接着，讲者提到log-concave分布的重要性，特别是在经济学和统计学中。此外，还提到log-concave分布作为正则化器的用途，以及常见的分布中大多数都是log-concave的。","讲者进一步指出，标准高斯分布的累积分布函数（CDF）也是log-concave的，尽管这一点并不明显。讲者提到这是一个作业题，需要通过推导来证明，并且会稍后在课程中进一步讨论。最后，讲者提到log-concave密度的CDF也是log-concave的，这是log-concave函数的一个性质。","讲者还提到，判断一个函数是否为log-concave可以通过计算其对数的Hessian矩阵是否为半正定矩阵来判断。这涉及到凸优化中的基本概念，如Hessian矩阵和半正定性。"],"formulas":[{"latex":"f(x) \\text{ is log-concave} \\text{ if } \\text{log}(f(x)) \\text{ is concave}","symbols":"对数凹函数的定义","explanation":"该公式正确表达了对数凹函数的定义，即如果函数的对数是凹函数，则该函数是对数凹函数。","evidence":"standard, normal, random variable. And here, if you take a look at this, this thing is log concave, right? Let's check that. Well, if I take the log of it, this is just a constant, and it's completely irrelevant for curvature, right? And then over here, you take the log of that, and you get a negative quadratic. Sigma is positive definite, so this thing here is going to be concave, and I'm including the minus sign here."},{"latex":"f(x) \\text{ is log-concave} \\text{ if } \\nabla^2 \\text{log}(f(x)) \\text{ is negative semidefinite}","symbols":"对数凹函数的Hessian条件","explanation":"该公式正确表达了对数凹函数的Hessian条件，即函数的对数的Hessian矩阵是负半定的。","evidence":"Any cumulative distribution function of a log-concave density is going to be also log-concave. Okay? So, okay. So here's some properties. I mean, some are obvious. This just translates, you know, if you write out the formula for what the Hessian of the log of f is, and you say that's less than or equal to zero, you know, in a matrix sense."},{"latex":"F(x) \\text{ is log-concave} \\text{ if } \\text{log}(F(x)) \\text{ is concave}","symbols":"累积分布函数的log-concave性","explanation":"该公式正确表达了累积分布函数的log-concave性，即如果累积分布函数的对数是凹函数，则该函数是对数凹函数。","evidence":"Now, of course, this function you can, I mean, there's libraries that compute this and all that sort of stuff, I mean, obviously. But this is not obvious at all, that this is actually log-concave. So there's, in fact, that's like a homework exercise, and it's not a short one, and it's got hints. So it's not totally obvious, but it's true ave. That's obvious, right? Because if I take two log-concave functions, I multiply them. Now I take the log. It's just the sum of the logs. So it relies on the deep fact that the sum of two concave functions is concave. So this one is easy.","zh":"这就是它要说的。它说其他的特征值都必须是负的，对吧？所以这就是条件，对吧？有些事情是显而易见的，比如对数凹函数的乘积是对数凹的。这很显然，对吧？如果我取两个对数凹函数，把它们相乘。然后我取对数，它就是两个对数的和。所以它依赖于一个深刻的事实：两个凹函数的和仍然是凹的。所以这个例子很简单。","start":517.49,"end":543.79},{"id":23,"text":"Now the sum of two log-concave, the sum of log-concave functions is not always log-concave. In fact, someone want to give me a quick example? Using maybe the stuff we just looked at? Sum of two Gaussian densities? Somebody want to? All right, here we go. Here's a, whoop, okay. Here's one Gaussian, and here's another one. Okay, right? They're both log-concave. If I sum those,","zh":"现在两个对数凹函数的和，两个对数凹函数的和不总是对数凹的。事实上，有人能给我一个快速的例子吗？也许用我们刚才讨论的内容？两个高斯密度函数的和？有人想吗？好的，我们开始吧。这里有一个高斯分布，这里还有一个高斯分布。对吧？它们都是对数凹的。如果我把它们相加，","start":545.22,"end":580.45},{"id":24,"text":"What do I get? I get some function that goes up, has a bump, comes back down, goes up again, and down. Could that be log-concave? It could not be, right? Because, well, one way to say it is that is actually, I could look at it, I could say it's not quasi-concave, for example, right? Because it's got a portion where it bends down, right? So that's not log-concave.","zh":"我会得到什么？我会得到一个函数，它先上升，有一个波峰，然后下降，再上升，再下降。这可能是对数凹的吗？不可能，对吧？因为，一种说法是，实际上，我可以观察它，我可以指出它不是拟凹的，对吧？因为它有一段是向下弯曲的，对吧？所以它不是对数凹的。","start":581.09,"end":609.41},{"id":25,"text":"Okay, I'll let you flesh out that example more.","zh":"好的，我会让你进一步完善这个例子。","start":609.84,"end":613.88},{"id":26,"text":"And then it turns out there is a kind of non-trivial fact about log-concave functions.","zh":"然后事实证明，关于对数凹函数有一个非平凡的事实。","start":615.02,"end":622.42},{"id":27,"text":"As far as I know, this wasn't known until 1973, right?","zh":"据我所知，这个事实直到1973年才被发现，对吧？","start":623.3,"end":627.52},{"id":28,"text":"Whereas most of the other things we've talked about were known maybe in the 1920s, 30s,","zh":"然而，我们之前谈到的其他大部分内容可能在1920年代、1930年代就已经为人所知了，","start":627.6,"end":632.7},{"id":29,"text":"or maybe no one really asked the question, and it was so simple that had we asked people in the 1920s, they would have known.","zh":"或者也许当时没有人真正提出这个问题，而这个问题本身如此简单，如果我们向1920年代的人提问，他们也会知道答案。","start":632.7,"end":638.18},{"id":30,"text":"own. I believe this to not be the case for this. So the rule is this. It says that if you have a","zh":"我确信这一点并不适用于我们当前讨论的内容。因此，规则是这样的。它指出，如果你有一个","start":638.18,"end":645.26},{"id":31,"text":"function that's log-concave in two variables and you integrate out over one, so that's this thing,","zh":"在两个变量上都是对数凹的函数，并且你对其中一个变量进行积分，那么这就是这个过程，","start":645.26,"end":653.68},{"id":32,"text":"if you integrate out over one, then the result is log-concave, okay? So that's the integration rule.","zh":"如果你对其中一个变量进行积分，那么结果仍然是对数凹的，对吧？这就是积分规则。","start":654.32,"end":661.68}],"notes":["本段讲授了凸优化中矩阵不等式与对数凹函数的性质。首先，讲者提到，当一个矩阵小于等于一个秩为1的矩阵时，该矩阵最多有一个正特征值，其余特征值必须为负。这是矩阵不等式的一个重要性质，用于分析函数的凸性。","接着，讲者讨论了对数凹函数的性质，指出两个对数凹函数的乘积仍然是对数凹的，因为对数的和是两个凹函数的和，而凹函数的和仍然是凹函数。然而，两个对数凹函数的和不一定是对数凹的，这需要通过例子来说明。","讲者举了一个例子，即两个高斯密度函数的和，结果可能不是对数凹的，因为其形状可能包含多个局部极值，从而违反对数凹函数的定义。这说明对数凹函数的和不具有对数凹性。","此外，讲者提到对数凹函数的一个非平凡性质：如果一个函数在两个变量上是对数凹的，那么对其中一个变量进行积分后，结果仍然是对数凹的。这是对数凹函数的一个重要性质，但直到1973年才被发现。","讲者还指出，许多其他凸优化的概念在20世纪20年代或30年代就已经被提出，但对数凹函数的这一性质直到较晚才被确认，说明该性质的发现具有一定的历史意义。","最后，讲者提到，对数凹函数的积分性质是凸优化中的一个重要工具，但其证明和应用需要进一步深入理解。"],"formulas":[{"latex":"A \\text{ positive multiple of the Hessian } \\nabla^2 f(x) \\text{ is less than or equal to the outer product of the gradient } \\nabla f(x) \\nabla f(x)^T","symbols":"矩阵不等式：正定的Hessian矩阵小于等于梯度的外积","explanation":"保持原式，矩阵不等式正确，Hessian矩阵是正定的，外积是秩为1的矩阵，符合矩阵不等式的描述。","evidence":"you know then then you take the x and you get something that looks like that and it's actually kind of interesting what it says is remember f is positive so this says that a positive multiple of the hessian is is less than or equal to in a matrix sense the outer product of the gradient now that's that's rank one"},{"latex":"A \\text{ matrix less than or equal to a rank one matrix } \\nabla f(x) \\nabla f(x)^T \\text{ has at most one positive eigenvalue}","symbols":"矩阵不等式：小于等于秩为1的矩阵的矩阵最多有一个正特征值","explanation":"保持原式，矩阵不等式正确，秩为1的矩阵最多有一个正特征值，符合矩阵理论。","evidence":"And what this means, and again, this is more advanced and we probably won't need this, but I don't mind saying it. When a matrix is less than or equal to, in a matrix sense, a rank one matrix, it says that this thing can have at most one positive eigenvalue."},{"latex":"f(x) = \\text{product of two log-concave functions} \\rightarrow \\text{log}(f(x)) = \\text{sum of logs} \\rightarrow \\text{sum of concave functions is concave}","symbols":"对数凹函数的乘积是对数凹的，因为对数的和是凹函数的和","explanation":"保持原式，对数凹函数的乘积的对数是凹函数的和，符合对数凹函数的性质。","evidence":"That's what it says. It says all the others are going to have to be negative, right? So that's the condition, right? So some things are obvious, like product of log-concave functions is log-concave. That's obvious, right? Because if I take two log-concave functions, I multiply them. Now I take the log. It's just the sum of the logs. So it relies on the deep fact that the sum of two concave functions is concave. So this one is easy."},{"latex":"f(x) = \\text{sum of two log-concave functions} \\rightarrow \\text{not necessarily log-concave}","symbols":"对数凹函数的和不一定是对数凹的","explanation":"保持原式，对数凹函数的和不一定保持对数凹性，符合数学事实。","evidence":"Now the sum of two log-concave, the sum of log-concave functions is not always log-concave. In fact, someone want to give me a quick example? Using maybe the stuff we just looked at? Sum of two Gaussian densities? Somebody want to? All right, here we go. Here's a, whoop, okay. Here's one Gaussian, and here's another one. Okay, right? They're both log-concave. If I sum those,"},{"latex":"f(x, y) \\text{ is log-concave in two variables} \\rightarrow \\text{integrating out one variable results in a log-concave function}","symbols":"对数凹函数在两个变量上的积分结果仍然是对数凹的","explanation":"保持原式，对数凹函数在两个变量上的积分结果仍然是对数凹的，符合数学事实。","evidence":"if you integrate out over one, then the result is log-concave, okay? So that's the integration rule."}],"uncertainties":["the phrase 'own. I believe this to not be the case for this' is unclear and may be a misrecognition of the original text."],"diagram":"none","start":482.53,"end":661.68,"asr_flags":[],"math_clarifications":["所有公式均符合数学事实和描述，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":482.53,"text":"you know then then you take the x and you get something that looks like that and it's actually kind of interesting what it says is remember f is positive so this says that a positive multiple of the hessian is is less than or equal to in a matrix sense the outer product of the gradient now that's that's rank one"},{"start":500.84,"text":"And what this means, and again, this is more advanced and we probably won't need this, but I don't mind saying it. When a matrix is less than or equal to, in a matrix sense, a rank one matrix, it says that this thing can have at most one positive eigenvalue."},{"start":517.49,"text":"That's what it says. It says all the others are going to have to be negative, right? So that's the condition, right? So some things are obvious, like product of log-concave functions is log-concave. That's obvious, right? Because if I take two log-concave functions, I multiply them. Now I take the log. It's just the sum of the logs. So it relies on the deep fact that the sum of two concave functions is concave. So this one is easy."},{"start":545.22,"text":"Now the sum of two log-concave, the sum of log-concave functions is not always log-concave. In fact, someone want to give me a quick example? Using maybe the stuff we just looked at? Sum of two Gaussian densities? Somebody want to? All right, here we go. Here's a, whoop, okay. Here's one Gaussian, and here's another one. Okay, right? They're both log-concave. If I sum those,"},{"start":581.09,"text":"What do I get? I get some function that goes up, has a bump, comes back down, goes up again, and down. Could that be log-concave? It could not be, right? Because, well, one way to say it is that is actually, I could look at it, I could say it's not quasi-concave, for example, right? Because it's got a portion where it bends down, right? So that's not log-concave."},{"start":609.84,"text":"Okay, I'll let you flesh out that example more."},{"start":615.02,"text":"And then it turns out there is a kind of non-trivial fact about log-concave functions."},{"start":623.3,"text":"As far as I know, this wasn't known until 1973, right?"},{"start":627.6,"text":"Whereas most of the other things we've talked about were known maybe in the 1920s, 30s,"},{"start":632.7,"text":"or maybe no one really asked the question, and it was so simple that had we asked people in the 1920s, they would have known."},{"start":638.18,"text":"own. I believe this to not be the case for this. So the rule is this. It says that if you have a"},{"start":645.26,"text":"function that's log-concave in two variables and you integrate out over one, so that's this thing,"},{"start":654.32,"text":"if you integrate out over one, then the result is log-concave, okay? So that's the integration rule."}],"speech_gaps":[],"frame":"../frames/v005/004.webp","frame_time":494.53},{"title":"对数凹函数的卷积性质及其应用","segments":[{"id":33,"text":"It's not obvious. It's not simple to prove. I mean, it's not hugely complicated, but","zh":"这并不明显。证明起来也不简单。我的意思是，这并不极其复杂，但","start":663.76,"end":671.22},{"id":34,"text":"it's not simple, right? So and it's kind of cool. It's relatively recent, by the way, this","zh":"它并不简单，对吧？所以这有点酷。顺便说一句，这个","start":671.22,"end":678.32},{"id":35,"text":"immediately. Well, we'll get to that in a second. There's some examples, but so one tells you that","zh":"立刻。嗯，我们稍后会讲到这一点。有一些例子，但其中一个告诉你","start":678.32,"end":683.22},{"id":36,"text":"that tells you that log concavity is preserved under convolution, right? So this is the","zh":"这告诉你对数凹性在卷积下是保持的，对吧？所以这就是","start":683.26,"end":690.26},{"id":37,"text":"convolution. Um, and this, by the way, this, this could be in, uh, wait, so that's, this is","zh":"卷积。顺便说一句，这个，这个，可能在，嗯，等一下，所以那是，这就是","start":690.26,"end":695.6},{"id":38,"text":"convolution, right? And it says, it says that if F and G are log concave, then their convolution is.","zh":"卷积，对吧？它说，它说如果 F 和 G 是对数凹的，那么它们的卷积也是。","start":695.6,"end":702.64},{"id":39,"text":"And so in probability, what this tells you is if I have two random variables, each with a log","zh":"所以在概率论中，这告诉你如果你有两个随机变量，每个都有一个对数","start":702.8,"end":708.34},{"id":40,"text":"concave density, right, and I add them, then that distribution is also log","zh":"凹密度，对吧，当我把它们相加时，这个分布也是对数","start":708.34,"end":715.42},{"id":41,"text":"concave, okay? So that's what that tells you.","zh":"凹函数，对吧？这就是它告诉你的内容。","start":715.42,"end":718.64},{"id":42,"text":"Here's one. Here's a super interesting one. If I have a convex set in Rn, and I have a random variable with a log-concave density, then if I look at the probability that x plus y is in C, that is a log-concave function of x.","zh":"这里有一个例子，这是一个非常有趣的情况。如果我在 R^n 中有一个凸集，且有一个具有对数凹密度的随机变量，那么当我观察 x 加上 y 属于 C 的概率时，这个概率是关于 x 的对数凹函数。","start":721.48,"end":744.44},{"id":43,"text":"So actually, this is already super interesting, right? Because C could be the set of values where some product actually works or functions, right? It meets all the specs, right? Then Y actually tells you about the distribution under manufacture of those specifications.","zh":"实际上，这已经非常有趣了，对吧？因为 C 可以是某些产品实际起作用或满足规格的值的集合，对吧？它满足所有规格，对吧？然后 Y 实际上告诉你在制造这些产品时的分布情况。","start":746.91,"end":769.93},{"id":44,"text":"Then X is like the target. It's how you actually, in the factory, what you target, right? So I will target.","zh":"然后 X 就像是目标。它是在工厂中你实际要达到的目标，对吧？所以我将设定目标。","start":770.83,"end":778.73},{"id":45,"text":"You know, three nanometers for this critical dimension, for example, okay? And then what this tells you is if you're targeting this and Y gives you your manufacturing errors, notice when I hit, I asked for three nanometers, I'm actually gonna get, you know, let's say, I don't know, a log, one of these, some distribution that's got a, that's a log concave, it'll be spread around that. And what this says, this then becomes basically the yield. And we'll talk about that, right?","zh":"比如说，这个关键尺寸的目标是三纳米，对吧？然后这个告诉你的是，如果你设定这个目标，并且 Y 给出你的制造误差，注意当我达到目标时，我要求的是三纳米，实际上我得到的可能是一个分布，比如说，某种对数凹分布，它会围绕这个值展开。而这就变成了所谓的良率。我们之后会讨论这个，对吧？","start":779.47,"end":807.01},{"id":46,"text":"So it says that the yield is log concave. We'll talk about that. That's already getting very close to a very serious application.","zh":"因此，它说明良率是对数凹的。我们之后会讨论这个。这已经非常接近一个非常重要的应用了。","start":807.53,"end":814.53}],"notes":["本段主要讲解了对数凹函数在卷积下的保持性质，即如果两个函数是log-concave的，那么它们的卷积也是log-concave的。这一性质在概率论中具有重要意义，因为如果两个随机变量具有log-concave密度，那么它们的和的分布也是log-concave的。","接着，讲者通过一个例子说明了log-concave函数在凸集上的应用。如果有一个凸集C和一个具有log-concave密度的随机变量Y，那么对于任意的x，概率P(x + y ∈ C)是一个关于x的log-concave函数。这在实际应用中非常有用，例如在制造过程中，目标值X和制造误差Y的分布可以用来计算合格率（yield）。","讲者进一步举例说明了这一性质在实际中的应用。例如，在半导体制造中，目标尺寸X为3纳米，制造误差Y服从log-concave分布，那么合格率（yield）也是一个log-concave函数。这表明，log-concave函数的性质可以用于优化制造过程，提高产品合格率。","此外，讲者提到log-concave函数的性质在优化问题中具有重要价值，因为它允许我们使用凸优化方法来处理某些非凸问题。例如，在计算合格率时，可以利用log-concave函数的性质来简化计算。","最后，讲者指出，log-concave函数的性质在实际应用中非常广泛，例如在统计学、信号处理和机器学习等领域。这些性质可以帮助我们更好地理解和优化各种系统。","综上所述，本段内容主要围绕log-concave函数的性质及其在概率论和优化问题中的应用展开，强调了其在实际工程和科学问题中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":663.76,"end":814.53,"asr_flags":[],"math_clarifications":["原始文本中提到的'F * G'应为卷积操作，正确的符号应为'\\ast'，并且需要明确这是两个函数的卷积。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":663.76,"text":"it it's not obvious it's it's not it's not simple to prove I mean it's not hugely complicated but"},{"start":671.22,"text":"it's it's eld. And we'll talk about that, right?"},{"start":807.53,"text":"So it says that the yield is log concave. We'll talk about that. That's already getting very close to a very serious application."}],"speech_gaps":[{"start":719.248,"end":721.04}],"frame":"../frames/v005/005.webp","frame_time":675.76},{"title":"凸优化中的对数凹函数与产量函数","segments":[{"id":47,"text":"Now, how do you show this? Well, what we do is we just write, I'm just going to write as an integral formula, right? And what I do is I have two things here, p, that's by assumption log concave, and I have this function g of x plus y, and g is a 0, 1 indicator function. It's 1 if you're in C, 0 if you're outside. That's a log concave function because it's a log concave function that basically has value 0.","zh":"现在，你怎么证明这一点呢？好吧，我们所做的就是把它写成一个积分公式，对吧？我在这里有两个东西，p，根据假设是log concave的，我还有一个函数g(x + y)，而g是一个0,1指示函数。如果你在C中，它就是1，否则就是0。这是一个log concave函数，因为它基本上在C中取值为0的log concave函数。","start":816.6,"end":844.87},{"id":48,"text":"inside the log of that. The log of the indicator is zero inside C, and it's minus infinity outside C. That's log-concave function. Okay? So, okay. And if you work out what this integral is, it's that, right? Oh, and here, this thing is clearly, it's actually a log-concave function precomposed with an affine mapping. And that is going to be also log-concave, right?","zh":"在那个的log中。该指示函数的log在C中为零，在C外为负无穷。这是一个log-concave函数。好的？好的。如果你计算这个积分，它就是那个，对吧？哦，而且这里的东西显然是一个log-concave函数与一个仿射映射的复合。这也将是log-concave的，对吧？","start":845.57,"end":873.59},{"id":49,"text":"So there you go, something like that. Let's talk about this yield function a little bit more, just for fun. So here you go. X are some nominal parameter values for a product. It's what you intend to manufacture. This is a vector of different things.","zh":"所以就是这样，我们来稍微多谈谈这个产量函数吧，只是为了好玩。所以这里你看到了。X是一些产品的名义参数值。这是你打算制造的东西。这是一个不同事物的向量。","start":873.99,"end":898.75},{"id":50,"text":"S is going to be the set of acceptable values, right? So this tells you, you know, if ddle? Yeah, the center. Okay, yeah, so I should, what I should do is set my target here, and then, you know, if that's one sigma and two sigma, I'm going to have a very happy yield there, right? Like going to be 90% or 95 or something like that, right? Everybody got this? So this is in 2D, and what this says is this goes down in 10, the exact same problem is you could do this in 10 dimensions, right, or something like that, okay? By the way,","zh":"中间？是的，中心。好的，是的，所以我应该做的就是把目标设在这里，然后，你知道的，如果这是1个标准差和2个标准差，我将在那里获得非常高的产出，对吧？比如会达到90%或95%左右，对吧？大家明白了吗？所以这是在二维空间中，而这句话的意思是它在10个维度中也会下降，对吧，或者类似的情况，好的。顺便说一句，","start":1025.34,"end":1053.24},{"id":56,"text":"You said the center of the set. And what's interesting is that's something we're going to look at later in the class. But it turns out there's a ton of different definitions of the center of a set, which we'll get to later. Actually, we may see one later today. Depends how far I get. But we'll see. We may see one later. So in R, it's very simple. If I give you an interval, there's not much discussion about what the center of an interval is, right?","zh":"它是这个区间的中点，对吧？任何合理的中心都会是这个，对吧？但一旦你进入二维空间，就不太清楚集合的中心是什么了。我们会看到，关于它的定义有很多不同的方式，对吧？所以，好的。这实际上是非常有趣的。","start":1054.46,"end":1081.0},{"id":57,"text":"It's the midpoint of the interval, right? Any sensible center is going to be that, right? But immediately when you get into two dimensions, it's not clear what the center of a set is. And we'll see there's lots of different definitions of it, okay? So, okay. So what this says is actually super interesting.","zh":"它说Y是凹函数，这表示如果我固定一个最低产量，比如你说的，我们不能以经济的方式制造这个产品，除非产量大于85%，那么它说这是一个产量区域，而且它是凸的。可能是空集，这对你来说就太糟糕了，但它确实是凸的，对吧？原因在于，这是凹函数。","start":1081.62,"end":1098.9},{"id":58,"text":"It says that Y is log-concave, and that says that if I fix a minimum yield, like you say, we cannot economically manufacture this product unless the yield is bigger than 85%, then it says this is a yield region, and it's convex. Could be empty, which would be too bad for you, but it is convex, right? And the reason is, this is log-concave.","zh":"它说Y是凹函数，这表示如果我固定一个最低产量，比如你说的，我们不能以经济的方式制造这个产品，除非产量大于85%，那么它说这是一个产量区域，而且它是凸的。可能是空集，这对你来说就太糟糕了，但它确实是凸的，对吧？原因在于，这是凹函数。","start":1099.83,"end":1123.79},{"id":59,"text":"So if I exponentiate both sides, or take a log, I get log y is bigger than log alpha. Log y is concave. This is a super level set, and a super level set of a concave function is convex. Everybody following this? So this is actually kind of close to an actual application that's incredibly useful, which should be kind of obvious.","zh":"所以如果我在两边取指数，或者取对数，我得到log y大于log alpha。log y是凹函数。这是一个超水平集，而凹函数的超水平集是凸的。大家都能跟上吗？所以这实际上非常接近一个极其有用的真正应用，这应该是相当明显的。","start":1124.42,"end":1149.43}],"notes":["本段讨论了在凸优化中，如何通过选择目标点来最大化产量。讲者通过一个二维空间的例子，说明如果目标点位于集合的中心，可以得到更高的产量。同时，讲者指出在高维空间中，中心的定义并不像一维那样明确，需要进一步探讨。","讲者提到，当产量目标固定时，产量区域是凸的，这是由于产量函数是log-concave的。log-concave函数的上水平集是凸的，这是凸优化中的一个重要性质。","讲者通过一个实际应用的例子，说明log-concave函数在优化问题中的重要性。例如，当产量必须大于某个阈值时，对应的产量区域是凸的，这有助于设计有效的优化算法。","讲者指出，虽然一维空间中集合的中心是明确的（即中点），但在二维或更高维空间中，中心的定义并不唯一，需要根据具体问题选择合适的定义。","讲者强调，log-concave函数的性质（如上水平集的凸性）在实际应用中非常有用，尤其是在处理具有概率分布的优化问题时。"],"formulas":[{"latex":"Y \\text{ is log-concave}","symbols":"Y 是对数凹函数","explanation":"数学类型正确，符号使用恰当，无需修改。","evidence":"It says that Y is log-concave, and that says that if I fix a minimum yield, like you say, we cannot economically manufacture this product unless the yield is bigger than 85%, then it says this is a yield region, and it's convex. Could be empty, which would be too bad for you, but it is convex, right? And the reason is, this is log-concave."},{"latex":"log y > log \\alpha","symbols":"对数产量大于对数阈值","explanation":"数学类型正确，符号使用恰当，无需修改。","evidence":"So if I exponentiate both sides, or take a log, I get log y is bigger than log alpha. Log y is concave. This is a super level set, and a super level set of a concave function is convex. Everybody following this? So this is actually kind of close to an actual application that's incredibly useful, which should be kind of obvious."},{"latex":"log y \\text{ is concave}","symbols":"对数产量是凹函数","explanation":"数学类型正确，符号使用恰当，无需修改。","evidence":"So if I exponentiate both sides, or take a log, I get log y is bigger than log alpha. Log y is concave. This is a super level set, and a super level set of a concave function is convex. Everybody following this? So this is actually kind of close to an actual application that's incredibly useful, which should be kind of obvious."}],"uncertainties":["log y is bigger than log alpha"],"diagram":"none","start":982.91,"end":1149.43,"asr_flags":[],"math_clarifications":["所有公式均符合数学规范，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":982.91,"text":"Which is not very good everybody got that so make make sense okay? What if um all right all right? So that was a poor choice of x um what if I'm right here, and let's say that's the one Sigma thing. What's the yield if I target there? What is it? Yeah, it's a little bit less than 50 right if this was a half space if it was just a half space would be"},{"start":1008.58,"text":"50%. But you know, you also fail by coming out over here, right? So let's say it's 45%. I'm making that up, right? But that's it. Everybody got this? Okay. Now, after these examples, you tell me, what should I target to maximize the yield? I mean, it's kind of obvious."},{"start":1025.34,"text":"The middle? Yeah, the center. Okay, yeah, so I should, what I should do is set my target here, and then, you know, if that's one sigma and two sigma, I'm going to have a very happy yield there, right? Like going to be 90% or 95 or something like that, right? Everybody got this? So this is in 2D, and what this says is this goes down in 10, the exact same problem is you could do this in 10 dimensions, right, or something like that, okay? By the way,"},{"start":1054.46,"text":"You said the center of the set. And what's interesting is that's something we're going to look at later in the class. But it turns out there's a ton of different definitions of the center of a set, which we'll get to later. Actually, we may see one later today. Depends how far I get. But we'll see. We may see one later. So in R, it's very simple. If I give you an interval, there's not much discussion about what the center of an interval is, right?"},{"start":1081.62,"text":"it's the midpoint of the interval, right? Any sensible center is going to be that, right? But immediately when you get into two dimensions, it's not clear what the center of a set is. And we'll see there's lots of different definitions of it, okay? So, okay. So what this says is actually super interesting."},{"start":1099.83,"text":"It says that Y is log-concave, and that says that if I fix a minimum yield, like you say, we cannot economically manufacture this product unless the yield is bigger than 85%, then it says this is a yield region, and it's convex. Could be empty, which would be too bad for you, but it is convex, right? And the reason is, this is log-concave."},{"start":1124.42,"text":"So if I exponentiate both sides, or take a log, I get log y is bigger than log alpha. Log y is concave. This is a super level set, and a super level set of a concave function is convex. Everybody following this? So this is actually kind of close to an actual application that's incredibly useful, which should be kind of obvious."}],"speech_gaps":[],"frame":"../frames/v005/007.webp","frame_time":994.91},{"title":"凸函数与广义不等式","segments":[{"id":60,"text":"And the last generalization we're going to look at is convexity with respect to a generalized inequality. So here it is. Here I have a function that maps Rn not into R, but into Rm. So it's vector valued. So you give it x and it produces a vector. We say that this function is k convex. k is a cone, a proper cone.","zh":"我们最后要讨论的广义化是关于广义不等式的凸性。这里它就是。我这里有一个函数，它将Rⁿ映射到Rᵐ，而不是R。因此，它是向量值的。你给它x，它会输出一个向量。我们说这个函数是k凸的，其中k是一个锥，一个正则锥。","start":1151.82,"end":1177.01},{"id":61,"text":"And we say that that's true if Jensen's inequality holds, except that the left and right hand sides are all vectors, right? And the inequality is the inequality induced by this cone, right? So most famous example is with symmetric matrices, right? So if I have a mapping from symmetric matrices to symmetric matrices, here's an example. F of capital X is X squared. X is a symmetric matrix. And the function is I square it, okay?","zh":"我们说这是成立的，如果詹森不等式成立，只不过左右两边都是向量，对吧？并且不等式是这个锥所诱导的不等式，对吧？最著名的例子是关于对称矩阵的，对吧？如果我有一个从对称矩阵到对称矩阵的映射，这里有一个例子。F（大X）是X的平方。X是一个对称矩阵。函数是将它平方，对吧？","start":1177.49,"end":1203.93},{"id":62,"text":"Then, you know, by the way, you'd kind of guess, it sure sounds convex, right? You know, because it's like, you know, it's the, whatever, it's the square, and you know that in a scalar case, x is. And in this case, that guess turns out to be true. What you'd have to show is the following. It says, what you'd want to show is if I take two symmetric matrices, right?","zh":"顺便提一下，你可能会猜测，这听起来确实像是凸的，对吧？你知道，因为它是平方，而在标量情况下，x是这样的。在这种情况下，这个猜测被证明是正确的。你所需要证明的是以下内容。它说，如果你取两个对称矩阵，对吧？","start":1204.84,"end":1228.06},{"id":63,"text":"If I then form a mixture of them, so theta x plus 1 minus theta y, that's a new symmetric matrix. If I square that, that's less than or equal to theta x squared plus 1 minus theta y squared. What does that mean? That means that this inequality here holds for all z.","zh":"然后，你形成它们的混合，即θx加上1减θy，这是一个新的对称矩阵。如果你对它进行平方，它将小于或等于θx²加上1减θy²。这表示什么？这意味着这里的不等式对于所有z都成立。","start":1228.54,"end":1249.16},{"id":64,"text":"So this is what this means. So if this holds for all z, and let me ask you, well, we could look at this. This does hold for all z because these are all now, these are simply convex functions. And this thing is a convex function here of x. So that requires a tricky reading there, but it is. Okay.","zh":"这就是它的含义。所以如果这个不等式对于所有z都成立，让我问你，我们来看看这个。这个不等式对于所有z都成立，因为这些现在都是简单的凸函数。而这个函数在这里是关于x的凸函数。这需要一些巧妙的解读，但它确实是这样的。好的。","start":1249.71,"end":1276.81},{"id":65,"text":"So this is the idea. You do like like with all generalizations, you want to be on your toes because not everything you think is true. I think one is a famous one is maybe the I think it's the exponential of the symmetric matrix. That sure sounds convex. I think it's not. I could be wrong on that. I just that just came out and maybe I'm maybe I'm wrong. But if it's not X, it's something like that where it sure sounds like it ought to be true.","zh":"这就是这个想法。在所有广义化中，你都要保持警惕，因为并不是你认为的所有事情都是真的。我想其中一个著名的例子可能是指数函数，即对称矩阵的指数。这听起来确实像是凸的。我想它可能不是。我可能在这个问题上是错的。我只是刚刚想到，也许我错了。但如果它不是X，而是类似这样的东西，它听起来似乎应该成立。","start":1277.69,"end":1305.93},{"id":66,"text":"and it just turns out it's not. That one might be actually. I can't remember what is a simple example that violates that. That wraps up actually all the analysis you need to know for the course. What I would actually recommend doing is every now and then,","zh":"而且事实证明它并不是。那个可能实际上是。我不记得有什么简单的例子会违反这一点。实际上，这已经涵盖了你们这门课所需要知道的所有分析内容。我实际上建议你们每隔一段时间就做一下，","start":1306.41,"end":1329.85}],"notes":["本段讲解了凸函数在广义不等式下的定义，即函数在向量值空间中的凸性。这里提到的凸性是相对于一个锥体（proper cone）而言的，而Jensen不等式在这种情况下被扩展为向量形式，且不等式由该锥体诱导。","以对称矩阵为例，函数F(X) = X²被用来说明这种广义凸性。虽然直观上看起来像凸函数，但需要通过严格的数学证明来确认其凸性。","在证明过程中，需要验证对于任意两个对称矩阵X和Y，以及任意θ ∈ [0,1]，混合矩阵θX + (1−θ)Y的平方是否小于等于θX² + (1−θ)Y²。这实际上等价于验证该函数在所有z上的凸性。","虽然该函数在标量情况下是凸的，但在向量值空间中，其凸性需要通过更复杂的分析来确认。这里提到的函数F(X) = X²确实满足凸性条件。","此外，讲者还提到一个可能的反例，即对称矩阵的指数函数，虽然听起来像凸函数，但实际可能并非如此。这说明在广义凸性分析中，不能仅凭直觉判断，必须进行严格的数学验证。","最后，讲者指出，这些分析是本课程所需掌握的核心内容，并建议学生定期复习以巩固理解。"],"formulas":[{"latex":"F(X) = X^2","symbols":"F(X) 是对称矩阵 X 的平方","explanation":"公式正确，F(X) 是对称矩阵 X 的平方，符合上下文中的定义。","evidence":"And we say that that's true if Jensen's inequality holds, except that the left and right hand sides are all vectors, right? And the inequality is the inequality induced by this cone, right? So most famous example is with symmetric matrices, right? So if I have a mapping from symmetric matrices to symmetric matrices, here's an example. F of capital X is X squared. X is a symmetric matrix. And the function is I square it, okay?"},{"latex":"\\theta X + (1 - \\theta)Y","symbols":"θX + (1−θ)Y 是两个对称矩阵 X 和 Y 的混合","explanation":"公式正确，表示两个对称矩阵的凸组合，符合上下文中的定义。","evidence":"If I then form a mixture of them, so theta x plus 1 minus theta y, that's a new symmetric matrix. If I square that, that's less than or equal to theta x squared plus 1 minus theta y squared. What does that mean? That means that this inequality here holds for all z."},{"latex":"(\\theta X + (1 - \\theta)Y)^2 \\leq \\theta X^2 + (1 - \\theta)Y^2","symbols":"混合矩阵的平方小于等于混合后的平方","explanation":"公式正确，表示凸函数的性质，即混合矩阵的平方小于等于混合后的平方，符合上下文中的定义。","evidence":"If I then form a mixture of them, so theta x plus 1 minus theta y, that's a new symmetric matrix. If I square that, that's less than or equal to theta x squared plus 1 minus theta y squared. What does that mean? That means that this inequality here holds for all z."}],"uncertainties":["I think it's the exponential of the symmetric matrix. That sure sounds convex. I think it's not. I could be wrong on that."],"diagram":"none","start":1151.82,"end":1329.85,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型均正确，符合上下文中的定义。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1151.82,"text":"And the last generalization we're going to look at is convexity with respect to a generalized inequality. So here it is. Here I have a function that maps Rn not into R, but into Rm. So it's vector valued. So you give it x and it produces a vector. We say that this function is k convex. k is a cone, a proper cone."},{"start":1177.49,"text":"And we say that that's true if Jensen's inequality holds, except that the left and right hand sides are all vectors, right? And the inequality is the inequality induced by this cone, right? So most famous example is with symmetric matrices, right? So if I have a mapping from symmetric matrices to symmetric matrices, here's an example. F of capital X is X squared. X is a symmetric matrix. And the function is I square it, okay?"},{"start":1204.84,"text":"Then, you know, by the way, you'd kind of guess, it sure sounds convex, right? You know, because it's like, you know, it's the, whatever, it's the square, and you know that in a scalar case, x is. And in this case, that guess turns out to be true. What you'd have to show is the following. It says, what you'd want to show is if I take two symmetric matrices, right?"},{"start":1228.54,"text":"If I then form a mixture of them, so theta x plus 1 minus theta y, that's a new symmetric matrix. If I square that, that's less than or equal to theta x squared plus 1 minus theta y squared. What does that mean? That means that this inequality here holds for all z."},{"start":1249.71,"text":"So this is what this means. So if this holds for all z, and let me ask you, well, we could look at this. This does hold for all z because these are all now, these are simply convex functions. And this thing is a convex function here of x. So that requires a tricky reading there, but it is. Okay."},{"start":1277.69,"text":"So this is the idea. You do like like with all generalizations, you want to be on your toes because not everything you think is true. I think one is a famous one is maybe the I think it's the exponential of the symmetric matrix. That sure sounds convex. I think it's not. I could be wrong on that. I just that just came out and maybe I'm maybe I'm wrong. But if it's not X, it's something like that where it sure sounds like it ought to be true."},{"start":1306.41,"text":"and it just turns out it's not. That one might be actually. I can't remember what is a simple example that violates that. That wraps up actually all the analysis you need to know for the course. What I would actually recommend doing is every now and then,"}],"speech_gaps":[],"frame":"../frames/v005/008.webp","frame_time":1163.82},{"title":"凸优化问题的定义与标准形式","segments":[{"id":67,"text":"Give yourself a half an hour and go back to chapters either one, two, or three and just reread part of it. What's going to happen is something that made absolutely no sense whatsoever to you maybe two weeks ago, it's going to start making sense. I mean, for one thing, it'll be the fourth time you've seen it or something like that, but also it's going to connect to other stuff. So this would be my strong recommendation would be to do something like that. Okay.","zh":"给自己半小时，回到第一章、第二章或第三章，重新阅读其中的一部分。接下来会发生的是，也许两周前对你来说完全没意义的内容，现在开始会变得有意义。首先，这将是第四次你看到它，或者类似的情况；其次，它还会与其他内容联系起来。因此，我的强烈建议是做类似的事情。好的。","start":1330.3,"end":1356.93},{"id":68,"text":"So now we're starting on problems, which is not analysis. And of course, the underlying point of all of this is the following. Convex optimization problems are tractable.","zh":"现在我们开始进入问题部分，这不再是分析。当然，所有这些内容的底层要点如下。凸优化问题是可处理的。","start":1358.11,"end":1373.21},{"id":69,"text":"Basically, we can solve them. That's the point, right? So it's not a question of math when you say, oh, that problem is convex. I mean, sure, it allows you to make certain assertions about, you know, here are the optimality conditions. I mean, whatever, right? The most important part about it is you can actually solve it. Now, that will segue to maybe three or four weeks or something like that. But that's what makes everything you just did in the last two weeks actionable.","zh":"基本上，我们可以解决这些问题。这就是重点，对吧？所以当你说到，哦，这个问题是凸的，这并不是一个数学问题。当然，它允许你做出某些关于最优条件的断言。不管怎样，最重要的是你实际上可以解决它。这可能会在三到四周后过渡到。但这就是你过去两周所做的一切变得有实际意义的原因。","start":1373.56,"end":1402.8},{"id":70,"text":"So that's going to be the point. So what we're going to do now is we're going to march through what convex optimization problems are. We already introduced this very informally on day one, but now we're going to do it more carefully. So first of all, let's talk about what is an optimization problem. So I actually think of it as an object, literally, in the computer science sense. It has attributes.","zh":"这就是我们要做的。现在我们将逐步讲解什么是凸优化问题。我们在第一天已经非常非正式地介绍了这个概念，但现在我们将更仔细地进行。首先，让我们谈谈什么是优化问题。实际上，我认为在计算机科学的意义上，它是一个对象。它有属性。","start":1404.22,"end":1431.98},{"id":71,"text":"Like, it has an attribute which is like, say, this is the objective, and the objective is to minimize f0 of x. f0 of x is a function. Okay? So, by the way, minimize is not a key word in mathematics. It is not. Min is...","zh":"比如，它有一个属性，比如说，这是目标函数，目标是最小化 f0(x)。f0(x) 是一个函数。好的。顺便说一句，在数学中，'minimize' 不是一个关键词。它不是。'min' 是……","start":1432.68,"end":1451.89},{"id":72,"text":"And it only means and can only mean one thing, which is the minimum of a finite set of numbers, period. That's the only definition of min that's in math, right? Min and minimize are not the same, right? So when I get lazy and I don't want to write out minimize like on the board, I'll write min, but I'll put a period there at the end.","zh":"它只能表示和只能表示一件事，即一个有限数集的最小值，完事。这就是数学中 'min' 的唯一定义，对吧？'min' 和 'minimize' 并不相同，对吧？当我懒惰不想在黑板上写 'minimize' 时，我会写 'min'，但我会在句末加上一个句号。","start":1452.35,"end":1471.75},{"id":73,"text":"Right. So which means, you know, if I don't, then you should like, I don't know, you know, call me on it or something. Right. OK. So we minimize an objective function here subject to and we have inequality constraints and equality constraints.","zh":"对的。也就是说，如果你不这样做，那么你应该像，我不知道，指出我的问题或者类似的事情。对的。好的。在这里，我们是在满足一些不等式约束和等式约束的条件下，最小化一个目标函数。","start":1472.4,"end":1488.1},{"id":74,"text":"Now, for simplicity, we're going to call this the standard form.","zh":"为了简化，我们将这种形式称为标准形式。","start":1489.25,"end":1491.87},{"id":75,"text":"In the standard form, you're minimizing something, right?","zh":"在标准形式中，你是在最小化某个东西，对吧？","start":1492.05,"end":1494.77},{"id":76,"text":"You could easily maximize something.","zh":"你也可以很容易地最大化某个东西。","start":1495.35,"end":1497.29},{"id":77,"text":"And there's whole fields where everything they do is they maximize.","zh":"并且有一些领域，他们所做的全部事情就是最大化。","start":1497.39,"end":1499.87},{"id":78,"text":"Like in economics, that's what you maximize utility or you maximize profit, right?","zh":"比如在经济学中，你就是最大化效用或者最大化利润，对吧？","start":1499.99,"end":1504.85},{"id":79,"text":"Or something like that.","zh":"或者类似的事情。","start":1504.93,"end":1505.77},{"id":80,"text":"So there's different fields.","zh":"所以有不同的领域。","start":1505.87,"end":1507.17}],"notes":["本段主要讲解了凸优化问题的定义和标准形式。教授指出，凸优化问题之所以重要，是因为它们是可解的，这与数学分析不同。他强调了凸优化问题的可解性是其核心价值，而不仅仅是数学上的某些性质。","教授提到，虽然‘minimize’在数学中不是一个关键词，但‘min’在数学中仅指一个有限数集的最小值。他指出‘min’和‘minimize’在数学中是不同的，但为了方便书写，他会在板书时使用‘min’并以句号结尾。","教授进一步说明了优化问题的结构，包括目标函数和约束条件（不等式约束和等式约束）。他指出，为了简化，将这种结构称为标准形式。","教授提到，虽然标准形式通常涉及最小化问题，但最大化问题同样存在，并且在不同领域（如经济学）中广泛应用，例如最大化效用或利润。","教授强调了不同领域对优化问题的不同应用，例如经济学中的最大化问题，这表明优化问题在实际应用中的广泛性。","教授通过这些讲解，引导学生理解凸优化问题的结构和重要性，并为后续内容做铺垫。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1330.3,"end":1507.17,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":1330.3,"text":"Give yourself a half an hour and go back to chapters either one, two, or three and just reread part of it. What's going to happen is something that made absolutely no sense whatsoever to you maybe two weeks ago, it's going to start making sense. I mean, for one thing, it'll be the fourth time you've seen it or something like that, but also it's going to connect to other stuff. So this would be my strong recommendation would be to do something like that. Okay."},{"start":1358.11,"text":"So now we're starting on problems, which is not analysis. And of course, the underlying point of all of this is the following. Convex optimization problems are tractable."},{"start":1373.56,"text":"Basically, we can solve them. That's the point, right? So it's not a question of math when you say, oh, that problem is convex. I mean, sure, it allows you to make certain assertions about, you know, here are the optimality conditions. I mean, whatever, right? The most important part about it is you can actually solve it. Now, that will segue to maybe three or four weeks or something like that. But that's what makes everything you just did in the last two weeks actionable."},{"start":1404.22,"text":"So that's going to be the point. So what we're going to do now is we're going to march through what convex optimization problems are. We already introduced this very informally on day one, but now we're going to do it more carefully. So first of all, let's talk about what is an optimization problem. So I actually think of it as an object, literally, in the computer science sense. It has attributes."},{"start":1432.68,"text":"Like, it has an attribute which is like, say, this is the objective, and the objective is to minimize f0 of x. f0 of x is a function. Okay? So, by the way, minimize is not a key word in mathematics. It is not. Min is..."},{"start":1452.35,"text":"And it only means and can only mean one thing, which is the minimum of a finite set of numbers, period. That's the only definition of min that's in math, right? Min and minimize are not the same, right? So when I get lazy and I don't want to write out minimize like on the board, I'll write min, but I'll put a period there at the end."},{"start":1472.4,"text":"Right. So which means, you know, if I don't, then you should like, I don't know, you know, call me on it or something. Right. OK. So we minimize an objective function here subject to and we have inequality constraints and equality constraints."},{"start":1489.25,"text":"Now, for simplicity, we're going to call this the standard form."},{"start":1492.05,"text":"In the standard form, you're minimizing something, right?"},{"start":1495.35,"text":"You could easily maximize something."},{"start":1497.39,"text":"And there's whole fields where everything they do is they maximize."},{"start":1499.99,"text":"Like in economics, that's what you maximize utility or you maximize profit, right?"},{"start":1504.93,"text":"Or something like that."},{"start":1505.87,"text":"So there's different fields."}],"speech_gaps":[],"frame":"../frames/v005/009.webp","frame_time":1342.3},{"title":"优化问题的标准形式与最优值定义","segments":[{"id":81,"text":"And then all you have to do is minimize minus F0, right?","zh":"然后你只需要最小化负的 F0，对吧？","start":1507.59,"end":1510.87},{"id":82,"text":"That's the question.","zh":"这就是问题。","start":1511.23,"end":1511.87},{"id":83,"text":"Does the inequality always have to be like less than equal, like an upper bound?","zh":"不等式是否总是必须像小于等于那样，比如一个上界？","start":1512.35,"end":1516.09},{"id":84,"text":"Yeah, so that's a great question.","zh":"是的，这是一个很好的问题。","start":1516.29,"end":1517.59},{"id":85,"text":"this is just to make it standard form this says it's the question is does it","zh":"这只是为了将其转换为标准形式，这句话的意思是问题是：它","start":1517.59,"end":1522.81},{"id":86,"text":"always have to be less than or equal to it can be bigger than or equal to right","zh":"是否总是必须小于或等于，它可以是大于或等于，对吧？","start":1522.81,"end":1525.81},{"id":87,"text":"suppose you had a suppose you wanted to impose the constraint that f1 of X is","zh":"假设你有一个，假设你想施加一个约束，即 f1 of X 是","start":1525.81,"end":1530.57},{"id":88,"text":"bigger than or equal to 0 what you do is you'd write that as minus f of X is less","zh":"大于或等于 0，你所做的就是将其写成负的 f of X 是小于","start":1530.57,"end":1536.21},{"id":89,"text":"than or equal to 0 right so so there so there are a lot of and we're going to be","zh":"大于或等于0，所以，所以有很多，我们将要讨论很多这些小的变换，你可以进行这些变换，将问题映射到这种形式。","start":1536.21,"end":1541.19},{"id":90,"text":"talking a lot about these little transformations that you can that you","zh":"你能够进行的变换，","start":1541.19,"end":1544.03},{"id":91,"text":"you can do to map things into this form.","zh":"你可以进行的变换，将问题映射到这种形式。","start":1544.03,"end":1545.75},{"id":92,"text":"Actually, a whole bunch of them are gonna be done","zh":"实际上，在某些情况下，这些变换将自动为你完成。","start":1546.19,"end":1547.97},{"id":93,"text":"automatically for you in some cases, right?","zh":"对吧？","start":1547.97,"end":1551.27},{"id":94,"text":"And we have equality constraints, right?","zh":"并且我们有等式约束，对吧？","start":1551.93,"end":1553.71},{"id":95,"text":"And so this is the idea.","zh":"这就是这个想法。","start":1554.05,"end":1557.73},{"id":96,"text":"The optimal value of this problem,","zh":"这个问题的最优值，","start":1559.27,"end":1562.81},{"id":97,"text":"so this is an object, it's a problem.","zh":"所以这是一个对象，它是一个问题。","start":1563.01,"end":1564.93},{"id":98,"text":"It's got a bunch of different fields or attributes.","zh":"它有很多不同的字段或属性。","start":1565.93,"end":1567.87},{"id":99,"text":"It's got its objective.","zh":"它有其目标函数。","start":1568.11,"end":1569.43},{"id":100,"text":"It's got a list of inequality constraints.","zh":"它有一系列不等式约束。","start":1569.83,"end":1571.51},{"id":101,"text":"constraints, it's got a list of equality constraints, right? So that's the way I think","zh":"约束，它有一系列等式约束，对吧？所以这就是我思考优化问题的方式。","start":1571.51,"end":1576.25},{"id":102,"text":"of an optimization problem. So its optimal value is the following.","zh":"所以它的最优值是以下内容。","start":1576.25,"end":1585.11},{"id":103,"text":"Inf is essentially the minimum. It's the minimum of the objective value over all points x that are feasible. And to be feasible, it means you have to satisfy these inequalities and all of these equalities like that. So this predicate here says x is feasible. And it says if among all such x's you have the smallest value of the objective, then...","zh":"Inf 实质上是最小值。它是所有可行点 x 的目标值的最小值。而要可行，意味着你必须满足这些不等式和所有这些等式。所以这里的谓词说明 x 是可行的。它说，如果你在所有这样的 x 中找到目标值的最小值，那么...","start":1586.47,"end":1613.41},{"id":104,"text":"That value is the optimal value, and that's denoted P star. By the way, there's a slight subtlety here. That's a star, not an asterisk. Asterisk is reserved for things like conjugates and some other stuff that we'll be doing in a couple of weeks. But here, star means optimal. Okay.","zh":"这个值就是最优值，记作 P 星。顺便说一句，这里有一个细微的区别。这是一个星号，而不是星号。星号被保留用于像共轭等一些我们将在几周后学习的内容。但在这里，星号表示最优。好的。","start":1613.84,"end":1635.31},{"id":105,"text":"Now, this is sort of standard math. If this set is empty, that means there is no x that satisfies these, right? Then by definition, the minimum or the infimum of the empty set is plus infinity.","zh":"现在，这基本上是标准的数学定义。如果这个集合是空集，这意味着没有满足这些条件的x，对吧？那么根据定义，空集的最小值或下确界是正无穷大。","start":1636.51,"end":1649.65},{"id":106,"text":"Actually, it's not a bad definition. Well, it doesn't matter. It is the definition, right? So it's the definition. And it kind of, everything makes sense then. A bunch of rules you'd imagine work with that. But that's the standard definition that we... So if I say P star is infinity for this problem, what it means is there is no X that satisfies the inequality. Okay? Now...","zh":"实际上，这不是一个糟糕的定义。好吧，这并不重要。这是定义，对吧？所以这是定义。然后一切都有意义。你想象中的一系列规则也都能与之配合工作。但这是我们在标准定义中所采用的。因此，如果我说这个问题的P星是无穷大，这意味着没有满足不等式的x。明白吗？","start":1650.77,"end":1672.04}],"notes":["本段讨论了如何将优化问题转换为标准形式，特别是如何处理不等式约束。讲者指出，如果约束是大于等于零，可以通过取负数将其转换为小于等于零的形式，从而符合标准形式的要求。","讲者强调了优化问题的结构，包括目标函数、不等式约束和等式约束。他提到，优化问题的最优值是所有可行点中目标函数的最小值，而可行点需要满足所有约束条件。","讲者解释了最优值的定义，指出当可行集为空时，最优值被定义为正无穷大。这是数学中的标准定义，用于处理无解的情况。","讲者区分了星号（star）和星号（asterisk）的用法，指出在优化问题中，星号表示最优值，而星号通常用于共轭等其他数学概念。","讲者提到，优化问题的结构包括多个属性，如目标函数、不等式约束和等式约束。他强调了这些属性在理解优化问题中的重要性。","讲者指出，当可行集为空时，最优值被定义为正无穷大，这是为了保持数学定义的一致性。这种定义方式使得许多规则和定理能够自然地应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1507.59,"end":1672.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":1507.59,"text":"And then all you have to do is minimize minus F0, right?"},{"start":1511.23,"text":"That's the question."},{"start":1512.35,"text":"Does the inequality always have to be like less than equal, like an upper bound?"},{"start":1516.29,"text":"Yeah, so that's a great question."},{"start":1517.59,"text":"this is just to make it standard form this says it's the question is does it"},{"start":1522.81,"text":"always have to be less than or equal to it can be bigger than or equal to right"},{"start":1525.81,"text":"suppose you had a suppose you wanted to impose the constraint that f1 of X is"},{"start":1530.57,"text":"bigger than or equal to 0 what you do is you'd write that as minus f of X is less"},{"start":1536.21,"text":"than or equal to 0 right so so there so there are a lot of and we're going to be"},{"start":1541.19,"text":"talking a lot about these little transformations that you can that you"},{"start":1544.03,"text":"you can do to map things into this form."},{"start":1546.19,"text":"Actually, a whole bunch of them are gonna be done"},{"start":1547.97,"text":"automatically for you in some cases, right?"},{"start":1551.93,"text":"And we have equality constraints, right?"},{"start":1554.05,"text":"And so this is the idea."},{"start":1559.27,"text":"The optimal value of this problem,"},{"start":1563.01,"text":"so this is an object, it's a problem."},{"start":1565.93,"text":"It's got a bunch of different fields or attributes."},{"start":1568.11,"text":"It's got its objective."},{"start":1569.83,"text":"It's got a list of inequality constraints."},{"start":1571.51,"text":"constraints, it's got a list of equality constraints, right? So that's the way I think"},{"start":1576.25,"text":"of an optimization problem. So its optimal value is the following."},{"start":1586.47,"text":"Inf is essentially the minimum. It's the minimum of the objective value over all points x that are feasible. And to be feasible, it means you have to satisfy these inequalities and all of these equalities like that. So this predicate here says x is feasible. And it says if among all such x's you have the smallest value of the objective, then..."},{"start":1613.84,"text":"That value is the optimal value, and that's denoted P star. By the way, there's a slight subtlety here. That's a star, not an asterisk. Asterisk is reserved for things like conjugates and some other stuff that we'll be doing in a couple of weeks. But here, star means optimal. Okay."},{"start":1636.51,"text":"Now, this is sort of standard math. If this set is empty, that means there is no x that satisfies these, right? Then by definition, the minimum or the infimum of the empty set is plus infinity."},{"start":1650.77,"text":"Actually, it's not a bad definition. Well, it doesn't matter. It is the definition, right? So it's the definition. And it kind of, everything makes sense then. A bunch of rules you'd imagine work with that. But that's the standard definition that we... So if I say P star is infinity for this problem, what it means is there is no X that satisfies the inequality. Okay? Now..."}],"speech_gaps":[],"frame":"../frames/v005/010.webp","frame_time":1519.59},{"title":"凸优化中的不可行性与无界性","segments":[{"id":107,"text":"There's another thing that can happen is you can have p star equals minus infinity. And I'll tell you what that means. What it means is there's a sequence of points. Every single one of them is feasible. And this objective goes down and down and down. It gets as small as you like. OK, and that both of these, by the way, are kind of pathologies in a practical sense of the problem. Right. So if I walk up to you and say, I need you to solve this problem, it's infeasible like.","zh":"还有一种可能发生的情况是，p星等于负无穷。我来告诉你这意味着什么。这意味着存在一个点的序列，每一个点都是可行的。而目标函数的值不断下降，可以变得任意小。好的，顺便说一下，这两种情况在实际问题中都可以说是病理性的。对吧。所以如果我走到你面前说，我需要你解决这个问题，它就是不可行的。","start":1673.46,"end":1698.28},{"id":108,"text":"Like, what does that mean, right? If you say, I want to construct the optimal schedule or something for something in the optimal allocation of resources, and it's infeasible, I mean, as a practical matter, it's of no use. I mean, actually, all it really tells you is that I formulated my problem, you know, in a stupid way, right?","zh":"那这到底意味着什么呢？比如说，如果你说，我想为某个东西构造一个最优的调度，或者在资源最优分配中进行某种操作，而它不可行，实际上在实际应用中是没有用的。我的意思是，它实际上告诉你的只是，我以一种愚蠢的方式制定了这个问题，对吧？","start":1699.04,"end":1723.08},{"id":109,"text":"Actually, there's a wonderful name for this in some context. In some context, in like risk-averse control, this thing is referred to as euphoric breakdown, which is like, I think, great phrase for it, right? Because, you know, let's remember what the semantics of this is. The semantics is we are okay with any X that satisfies these constraints, and we are completely not okay with anything that violates them even slightly.","zh":"实际上，在某些上下文中，这种情况有一个美妙的名称。在某些上下文中，比如风险规避控制中，这种情况被称为『狂喜崩溃』，我觉得这是一个非常贴切的词，对吧？因为，你要记住这个语义是什么。语义是，我们接受任何满足这些约束的X，而我们完全不能接受任何稍微违反这些约束的东西。","start":1723.5,"end":1749.8},{"id":110,"text":"Number one. Then among ones that are okay, which means feasible, then we are interested in, we are happier the smaller F0 gets. So if in fact there are feasible points with values, you know, it's basically like, you know, hey, maximize my, or minimize my cost, which is my negative profit. And you go, yeah, well, I mean, here's a feasible X.","zh":"第一点，对于那些可行的点，也就是满足约束的点，我们感兴趣的是，F0的值越小越好。所以如果确实存在可行点，其值是，比如说，你可以说，嘿，最大化我的，或者最小化我的成本，而我的成本就是我的负利润。然后你说，是的，这里有一个可行的X。","start":1750.46,"end":1772.28},{"id":111,"text":"that gives you, you know, minus 10. And you go, cool, I just made, you know, 10 million bucks, right? And they go, here's another one with minus 20. And you go, 20 million, that's great. Minus 50, minus, anyway. Anyway, so that's why that's called sometimes euphoric breakdown. But anyway, okay. So this is just, you know, the nomenclature.","zh":"它给你，比如说，减去10。然后你说，酷，我刚刚赚了1000万美元，对吧？然后他们说，这里还有一个减去20的。你说，2000万美元，太棒了。减去50，减去，总之。总之，这就是为什么有时候它被称为『狂喜崩溃』。不过没关系，好的。这就是术语的问题。","start":1772.8,"end":1801.36},{"id":112,"text":"if it's in the domain of the objective, and it satisfies the constraints. And we say it's optimal if it simply is feasible and has this optimal value, right? And then capital X opt, that's a set of optimal points, right? Which, by the way, is convex. It's not hard to show, right? So because it's these sub-level sets of F0,","zh":"如果它在目标函数的定义域内，并且满足约束条件。我们说它是最优的，如果它仅仅是可行的并且具有这个最优值，对吧？然后大写X opt，这是最优解点的集合，对吧？顺便说一句，它是凸集。这并不难证明，对吧？因为它这些是F0的下水平集，","start":1801.98,"end":1828.25},{"id":113,"text":"it's the P star sublevel sets of F zero intersect the feasible set, which is convex. So if you followed that, great. If you didn't, that's okay too. Now we have another concept, which is locally optimal. And locally optimal means, very roughly speaking, it says that you're optimal in a restricted range around that current point.","zh":"它是F零的P星下水平集与可行集的交集，而这是凸的。所以如果你理解了这一点，很好。如果你没有理解，也没关系。我们现在有另一个概念，即局部最优。局部最优意味着，粗略地说，它在当前点周围的一个受限范围内是最优的。","start":1829.55,"end":1852.61}],"notes":["本段讨论了凸优化问题中可能出现的两种病态情况：不可行性和无界性。不可行性指的是问题没有可行解，而无界性指的是目标函数可以无限减小。这两种情况在实际应用中都是无用的，因为它们表明问题的建模方式存在问题。","在风险规避控制的背景下，无界性被称作‘euphoric breakdown’，这个术语形象地表达了当约束被违反时的严重后果。优化问题中，我们只接受满足约束的点，而任何违反约束的点都是不可接受的。","在可行点中，我们关注目标函数值更小的点，因为这代表了更优的解。如果存在可行点，我们可以不断找到更小的目标函数值，这说明问题可能是无界的。","最优解的定义是可行点且具有最优值的点。所有最优解的集合是凸集，因为它是目标函数的下水平集与可行集的交集，而这两个集合都是凸的。","局部最优解指的是在当前点附近的一个受限范围内是最优的。这与全局最优解不同，局部最优解可能不是整个可行域中的最优解。","本段强调了凸优化问题中的一些关键概念，包括不可行性、无界性、最优解的定义以及局部最优解的概念。这些概念对于理解凸优化问题的性质和求解方法至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1673.46,"end":1852.61,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1673.46,"text":"There's another thing that can happen is you can have p star equals minus infinity. And I'll tell you what that means. What it means is there's a sequence of points. Every single one of them is feasible. And this objective goes down and down and down. It gets as small as you like. OK, and that both of these, by the way, are kind of pathologies in a practical sense of the problem. Right. So if I walk up to you and say, I need you to solve this problem, it's infeasible like."},{"start":1699.04,"text":"Like, what does that mean, right? If you say, I want to construct the optimal schedule or something for something in the optimal allocation of resources, and it's infeasible, I mean, as a practical matter, it's of no use. I mean, actually, all it really tells you is that I formulated my problem, you know, in a stupid way, right? This is also, this is called unbounded below, and that's also a pathology, typically, right?"},{"start":1723.5,"text":"Actually, there's a wonderful name for this in some context. In some context, in like risk-averse control, this thing is referred to as euphoric breakdown, which is like, I think, great phrase for it, right? Because, you know, let's remember what the semantics of this is. The semantics is we are okay with any X that satisfies these constraints, and we are completely not okay with anything that violates them even slightly."},{"start":1750.46,"text":"Number one. Then among ones that are okay, which means feasible, then we are interested in, we are happier the smaller F0 gets. So if in fact there are feasible points with values, you know, it's basically like, you know, hey, maximize my, or minimize my cost, which is my negative profit. And you go, yeah, well, I mean, here's a feasible X."},{"start":1772.8,"text":"that gives you, you know, minus 10. And you go, cool, I just made, you know, 10 million bucks, right? And they go, here's another one with minus 20. And you go, 20 million, that's great. Minus 50, minus, anyway. Anyway, so that's why that's called sometimes euphoric breakdown. But anyway, okay. So this is just, you know, the nomenclature. Okay. So we can talk about what is a point. You know, is it optimal and all that. But first we say that a point is feasible."},{"start":1801.98,"text":"if it's in the domain of the objective, and it satisfies the constraints. And we say it's optimal if it simply is feasible and has this optimal value, right? And then capital X opt, that's a set of optimal points, right? Which, by the way, is convex. It's not hard to show, right? So because it's these sub-level sets of F0,"},{"start":1829.55,"text":"it's the P star sublevel sets of F zero intersect the feasible set, which is convex. So if you followed that, great. If you didn't, that's okay too. Now we have another concept, which is locally optimal. And locally optimal means, very roughly speaking, it says that you're optimal in a restricted range around that current point."}],"speech_gaps":[],"frame":"../frames/v005/011.webp","frame_time":1685.46},{"title":"凸优化中的局部最优与无界问题","segments":[{"id":114,"text":"Here, I'll draw one. It's our last example here. I'll just draw that function. I'll try to get a marker that's actually visible. We have x cubed minus 3x, and that function looks like this. That's minus 1, and that's plus 1. That's your function.","zh":"在这里，我会画一个。这是我们的最后一个例子。我将画出这个函数。我会尝试找到一个实际可见的标记。我们有x的立方减去3x，这个函数看起来像这样。这是-1，这是+1。这就是你的函数。","start":1853.58,"end":1877.26},{"id":115,"text":"That's x cubed minus 3x. And so the point here is, what's p star for that one? No constraints. Just, what is p star? It's minus infinity, right? Because, you know, these values go as low as you like. Okay? Then this is a locally optimal point. Because, for example, if I...","zh":"这是x的立方减去3x。这里的关键问题是，这个例子的p星是多少？没有约束。仅仅问一下，p星是什么？它是负无穷大，对吧？因为这些值可以低到你想要的程度。明白吗？那么这就是一个局部最优解。例如，如果我……","start":1878.35,"end":1904.5},{"id":116,"text":"if I add the constraint that x is between 0.5 and 1.5, if it's within 0.5 of 1, and then I simply ask, that's a locally optimal point. It's optimal for that restricted problem. So that's locally optimal. Let's look at a couple of other examples just to sort of explain this. Let's take f of x is 1 over x.","zh":"如果我添加约束条件x在0.5到1.5之间，如果它在1的0.5范围内，然后我仅仅问，这就是一个局部最优解。它是该受限问题的最优解。因此，这就是局部最优解。让我们再看几个例子来进一步解释这个概念。让我们取f(x) = 1/x。","start":1904.86,"end":1927.94},{"id":117,"text":"The domain is R++, right? So positive things. It just goes down like this, right? And P star is 0, right? Because the infimum of 1 over x, as x gets bigger and bigger, that gets smaller and smaller. It's going towards 0. So P star is 0. There's no optimal point, right? And you're not allowed to say x equals infinity. That's not a valid choice. So there's no optimal point. There's no x for which 1 over x is equal to 0.","zh":"定义域是正实数，对吧？所以是正数。它只是像这样下降，对吧？而p星是0，对吧？因为1/x的下确界，当x变得越来越大时，这个值会越来越小，趋近于0。因此，p星是0。没有最优解，对吧？你不能说x等于无穷大。这不是一个有效的选择。因此，没有最优解。没有x使得1/x等于0。","start":1929.67,"end":1957.95},{"id":118,"text":"Right? So, okay. How about minus log x, right? That's convex. The domain is, you know, again, r plus plus. And that's also going to be, that's actually unbounded below. Just like here. It's got, you know, something that goes down to zero, right? So, okay. So here, as x gets really big, this gets as negative as you would like.","zh":"对吧？那么，如何关于负对数x，对吧？这是凸函数。定义域是，再次，正实数。这也是无界的，就像这里一样。它会像这样下降到零，对吧？所以，当x变得非常大时，这个值会变得尽可能负。","start":1958.7,"end":1985.42},{"id":119,"text":"Right? Maybe slowly. Doesn't matter. It's p star is minus infinity. x log x, that's the negative entropy. And that looks like this. That looks like this. That's this function here. Looks like that, roughly. Oh, it's got an infinite slope here. So I'll make it like that. It's got infinite slope right here. By the way, you can either define the value at zero to be zero, which...","zh":"对吧？也许缓慢地。没关系。p星是负无穷大。x乘以log x，这是负熵。它看起来像这样。看起来像这样。这是这个函数。大致像这样。哦，它在这里有一个无限大的斜率。所以我把它画成这样。它在这里有一个无限大的斜率。顺便说一句，你可以将x=0处的值定义为0，这……","start":1985.9,"end":2016.18}],"notes":["本段讨论了凸优化中的局部最优解与无界问题。首先，讲者以函数 $ f(x) = x^3 - 3x $ 为例，指出在无约束情况下，该函数的最小值为负无穷，因此没有全局最优解。接着，讲者引入了约束条件 $ x \between 0.5 $ 和 $ 1.5 $，说明在该受限问题中，函数在 $ x = 1 $ 处达到局部最优解。","随后，讲者以 $ f(x) = 1/x $ 为例，指出其定义域为正实数 $ \text{R}^+ $，且函数值随着 $ x $ 增大而趋近于零，因此 $ p^* = 0 $。但该函数没有最优解，因为 $ x = \text{infinity} $ 不是合法的输入。","接着，讲者讨论了 $ f(x) = -\text{log}(x) $，指出该函数在定义域 $ \text{R}^+ $ 上是凸的，并且随着 $ x $ 增大，函数值趋向于负无穷，因此 $ p^* = -\text{infinity} $。","最后，讲者提到 $ f(x) = x \text{log}(x) $，即负熵函数，其图像在 $ x = 0 $ 处有无限斜率。讲者指出，可以将 $ x = 0 $ 处的值定义为零，但该函数在 $ x = 0 $ 处的定义需要特别处理。","这些例子展示了凸优化中局部最优解与无界问题的区分，以及如何通过约束条件来限制问题的解空间。"],"formulas":[{"latex":"f(x) = x^3 - 3x","symbols":"函数 $ f(x) = x^3 - 3x $","explanation":"公式正确，无需修改。","evidence":"That's x cubed minus 3x. And so the point here is, what's p star for that one? No constraints. Just, what is p star? It's minus infinity, right? Because, you know, these values go as low as you like. Okay? Then this is a locally optimal point. Because, for example, if I..."},{"latex":"f(x) = 1/x","symbols":"函数 $ f(x) = 1/x $","explanation":"公式正确，无需修改。","evidence":"The domain is R++, right? So positive things. It just goes down like this, right? And P star is 0, right? Because the infimum of 1 over x, as x gets bigger and bigger, that gets smaller and smaller. It's going towards 0. So P star is 0. There's no optimal point, right? And you're not allowed to say x equals infinity. That's not a valid choice. So there's no optimal point. There's no x for which 1 over x is equal to 0."},{"latex":"f(x) = -\\text{log}(x)","symbols":"函数 $ f(x) = -\text{log}(x) $","explanation":"公式正确，无需修改。","evidence":"Right? So, okay. How about minus log x, right? That's convex. The domain is, you know, again, r plus plus. And that's also going to be, that's actually unbounded below. Just like here. It's got, you know, something that goes down to zero, right? So, okay. So here, as x gets really big, this gets as negative as you would like."},{"latex":"f(x) = x \\text{log}(x)","symbols":"函数 $ f(x) = x \text{log}(x) $","explanation":"公式正确，无需修改。","evidence":"Right? Maybe slowly. Doesn't matter. It's p star is minus infinity. x log x, that's the negative entropy. And that looks like this. That looks like this. That's this function here. Looks like that, roughly. Oh, it's got an infinite slope here. So I'll make it like that. It's got infinite slope right here. By the way, you can either define the value at zero to be zero, which..."}],"uncertainties":[],"diagram":"none","start":1853.58,"end":2016.18,"asr_flags":[],"math_clarifications":["所有公式均正确，无需额外说明。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1853.58,"text":"Here, I'll draw one. It's our last example here. I'll just draw that function. I'll try to get a marker that's actually visible. We have x cubed minus 3x, and that function looks like this. That's minus 1, and that's plus 1. That's your function."},{"start
