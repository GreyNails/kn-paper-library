 we'll cover this in detail later. So, okay. And you can work out other cases, like minimize a convex function over the non-negative orthon, and you can work out what it means. And actually, it's also, like, makes perfect sense, right? So, it would mean that if I minimize a convex function over non-negative orthon, let me just draw this."},{"start":3850.62,"text":"I want to minimize the convex function over here. And here's an example. Here are some sublevel sets, okay? So like this, right? Like that. Here's some, whoops, okay. These are sublevel sets, right? Like that. So, you know, that's the optimal point, right? And we can sort of check this, right? Because what happens here, and this is just kind of very intuitive, right? What it says is that..."}],"speech_gaps":[],"frame":"../frames/v005/023.webp","frame_time":3718.9},{"title":"等价问题与约束消除","segments":[{"id":247,"text":"This is partial f0, partial x2, that has to vanish. If it didn't vanish, we'd be in trouble. Because I could slide up and down here in the direction of the negative gradient and actually get a slightly better objective value while staying feasible. In which case, it was not optimal. But I'm slammed up against the boundary of the constraint here. I would love to go in that direction.","zh":"这是关于f0对x2的偏导数，它必须消失。如果它没有消失，我们就会陷入困境。因为我在负梯度方向上可以滑动，实际上可以得到一个稍微更好的目标值，同时保持可行性。在这种情况下，它并不是最优的。但此时我被约束的边界所限制。我非常希望朝那个方向移动。","start":3877.99,"end":3903.45},{"id":248,"text":"I'd love to because my objective would go down. The problem is I'm at the boundary of the feasible set and I can't. Right? So anyway, when you work this out, you can just work this out algebraically and you get something like that, that condition there. Anyway, we'll come back to optimality conditions in about two weeks. Okay.","zh":"我非常希望这样做，因为我的目标值会下降。问题是，我现在处于可行集的边界上，无法移动。对吧？总之，当你推导出这些内容时，你可以通过代数运算得出类似那样的条件。总之，我们将在大约两周后回到最优性条件。好的。","start":3904.1,"end":3924.07},{"id":249,"text":"Now we're going to talk about equivalent problems. I already said a little bit about it earlier. We actually saw two equivalent problems, in fact, earlier. Now we're going to talk about it because it's kind of an official idea we have.","zh":"现在我们将讨论等价问题。我之前已经提过一些相关内容。事实上，我们之前已经看到了两个等价问题。现在我们将讨论它，因为它是一个我们正式拥有的概念。","start":3924.77,"end":3934.27},{"id":250,"text":"Two problems, and we're going to make it informal in this class. In CS theory, it's not informal, right? Here it is. There it's called a reduction, by the way, right? So here it's going to be informal. And we say basically if one problem is equivalent to another, if from a solution of one, I can create a solution of the other, right? And vice versa, right? So that's what that means, right? So that's exactly the idea of a reduction in computer science.","zh":"两个问题，我们将在这个课堂上以非正式的方式讨论。在计算机科学理论中，这不是非正式的，对吧？在这里，它被称为一个归约，对吧？所以在这里，我们将以非正式的方式讨论。我们基本上说，如果一个问题等价于另一个问题，那么从一个问题的解中，我可以构造出另一个问题的解，对吧？反之亦然，对吧？这就是它的意思，对吧？这就是计算机科学中归约的概念。","start":3937.16,"end":3965.71},{"id":251,"text":"Okay. And so there's a whole bunch of them that you should probably know about. And in fact, a lot of the software tools you're going to use actually are going to use, on your behalf, many reductions. And sorry, yeah, okay, whatever. Yeah, sorry. They'll use many equivalences, which are reductions in computer science that you don't need to know about, right? So, but you need to know about some of them because they're actually kind of, and I'll just mention some of them. A lot of them are kind of generic, but let's look at some. So here's one.","zh":"好的。因此，你应该了解很多这类问题。事实上，你将要使用的许多软件工具实际上会为你使用许多归约。抱歉，是的，好的，随便吧。它们会使用许多等价性，这些等价性在计算机科学中被称为归约，你不需要了解它们，对吧？所以，但你需要了解其中的一些，因为它们实际上相当重要，我会提到其中的一些。其中很多是相当通用的，但让我们看看一些例子。这里有一个。","start":3968.87,"end":3995.93},{"id":252,"text":"Here's a problem with equality constraints, and we can just basically eliminate the equality constraints. I can take a new variable, right? And the first thing I do is I find a vector x zero that satisfies ax equals b, and I find a matrix whose range is exactly the null space of a.","zh":"这里有一个带有等式约束的问题，我们基本上可以消除这些等式约束。我可以引入一个新的变量，对吧？首先，我会找到一个向量 x zero，使得 a 乘以 x 等于 b，并找到一个矩阵，其列空间恰好是 a 的零空间。","start":3996.69,"end":4019.87},{"id":253,"text":"And what that tells you is that AX is equal to B if and only if you have the form X equals FZ plus X0. X0 and F, we can compute from A and B, right? So we compute them. I won't go into how we do that. There are lots of ways to do that. So you do that. If you do this, then this problem is equivalent to that problem, right? Oh, by the way, they're not equal.","zh":"这告诉你的意思是，AX 等于 B 当且仅当 X 具有形式 X 等于 FZ 加上 X0。X0 和 F 可以从 A 和 B 计算出来，对吧？所以我们计算它们。我不会详细说明如何进行这个计算，有很多方法可以做到这一点。你只需要这么做。如果你这么做，那么这个问题就等价于那个问题，对吧？顺便说一句，它们并不相等。","start":4020.37,"end":4046.77}],"notes":["本段讲授了优化问题中梯度消失的条件，即当梯度不为零时，可以通过沿负梯度方向移动来改善目标函数值，但此时可能处于约束边界，无法继续优化。这说明了在优化过程中，梯度为零是局部最优的必要条件，但并非充分条件。","接下来，课程引入了等价问题的概念，强调了等价问题在优化中的重要性。等价问题指的是可以通过一个问题的解构造另一个问题的解，反之亦然。这种关系在计算机科学中被称为‘reduction’，但在本课程中以更非正式的方式进行讨论。","课程提到，等价问题在实际应用中非常重要，许多软件工具会利用这些等价关系来简化问题。虽然这些等价关系在计算机科学中可能较为复杂，但本课程会介绍一些基本的等价问题，帮助学生理解如何将约束问题转化为无约束问题。","在消除等式约束的例子中，讲者提到可以通过找到满足等式约束的向量和矩阵，将原问题转化为无约束问题。具体来说，通过构造一个新变量，使得原问题的约束条件被消除，从而简化问题。","最后，讲者强调了等价问题与等式约束消除之间的区别，指出虽然等价问题可以将原问题转化为另一种形式，但它们并不完全相等，而是具有某种等价关系。","本段内容涉及优化问题中的梯度条件、等价问题的概念及其在实际应用中的重要性，以及如何通过构造新变量来消除等式约束。这些内容为后续学习优化算法和问题转化奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3877.99,"end":4046.77,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3877.99,"text":"This in partial f0, partial x2, that has to vanish. If it didn't vanish, we'd be in trouble. Because I could slide up and down here in the direction of the negative gradient and actually get a slightly better objective value while staying feasible. In which case, it was not optimal. But I'm slammed up against the boundary of the constraint here. I would love to go in that direction."},{"start":3904.1,"text":"I'd love to because my objective would go down. The problem is I'm at the boundary of the feasible set and I can't. Right? So anyway, when you work this out, you can just work this out algebraically and you get something like that, that condition there. Anyway, we'll come back to optimality conditions in about two weeks. Okay."},{"start":3924.77,"text":"Now we're going to talk about equivalent problems. I already said a little bit about it earlier. We actually saw two equivalent problems, in fact, earlier. Now we're going to talk about it because it's kind of an official idea we have."},{"start":3937.16,"text":"Two problems, and we're going to make it informal in this class. In CS theory, it's not informal, right? Here it is. There it's called a reduction, by the way, right? So here it's going to be informal. And we say basically if one problem is equivalent to another, if from a solution of one, I can create a solution of the other, right? And vice versa, right? So that's what that means, right? So that's exactly the idea of a reduction in computer science."},{"start":3968.87,"text":"Okay. And so there's a whole bunch of them that you should probably know about. And in fact, a lot of the software tools you're going to use actually are going to use, on your behalf, many reductions. And sorry, yeah, okay, whatever. Yeah, sorry. They'll use many equivalences, which are reductions in computer science that you don't need to know about, right? So, but you need to know about some of them because they're actually kind of, and I'll just mention some of them. A lot of them are kind of generic, but let's look at some. So here's one."},{"start":3996.69,"text":"Here's a problem with equality constraints, and we can just basically eliminate the equality constraints. I can take a new variable, right? And the first thing I do is I find a vector x zero that satisfies ax equals b, and I find a matrix whose range is exactly the null space of a."},{"start":4020.37,"text":"And what that tells you is that AX is equal to B if and only if you have the form X equals FZ plus X0. X0 and F, we can compute from A and B, right? So we compute them. I won't go into how we do that. There are lots of ways to do that. So you do that. If you do this, then this problem is equivalent to that problem, right? Oh, by the way, they're not equal."}],"speech_gaps":[],"frame":"../frames/v005/024.webp","frame_time":3889.99},{"title":"消除等式约束","segments":[{"id":254,"text":"at all, right? Like, I mean, for one thing, at a very gross level, it's not. If you say this problem dot equality, if you say what is the length of this problem dot equality constraints, it's going to be however many, let's say this p, p equality constraints, it'll be p. Here, when I say this second problem dot equality constraints, if I say length of that, it's a list, it's an empty list.","zh":"对吧？比如，我意思是，在一个非常粗略的层面上，它并不是。如果你说这个问题的等式约束，如果你问这个问题的等式约束的数量，它将是多少，比如说这个p，p个等式约束，它就是p。在这里，当我提到第二个问题的等式约束时，如果我说它的长度，它就是一个列表，它是一个空列表。","start":4047.31,"end":4073.25},{"id":255,"text":"And so it's zero. And so, end of story, these are not equal. But they are equivalent, right? And here, in this case, the p star of the two problems, the optimal value is the same, right? And to explain what you do, you say, well, you want to solve this. So what we do is first we compute the f and the x0. Then we solve this problem. Now, z has nothing to do with this problem.","zh":"因此它是零。所以，故事到此结束，这两个问题并不相等。但它们是等价的，对吧？在这里，这两个问题的最优值p星是相同的，对吧？为了解释你该怎么做，你会说，好吧，你想解决这个问题。因此，我们首先计算f和x0。然后我们解决这个问题。现在，z与这个问题毫无关系。","start":4073.84,"end":4099.43},{"id":256,"text":"at all, right? But then what I simply do is I return in this problem, I return fz star plus x zero. And that's going to be the solution here, right? So this actually also has a very important, like if someone comes up with a super fancy solver for a problem, right? They go, here's my, it's awesome, right? It's super fast. I don't, whatever it is, doesn't matter, right? Then you'd say only, only minor problem. It doesn't support equality constraints. Everybody got that?","zh":"对吧？但然后我所做的就是，在这个问题中返回fz星加上x零。这将在这里成为解，对吧？因此，这实际上也有一个非常重要的意义，比如，如果有人提出一个超级复杂的求解器来解决这个问题，对吧？他们会说，这里是我的，它非常棒，对吧？它非常快。我不管它是什么，都不重要，对吧？然后你会说，只有一个小问题。它不支持等式约束。大家明白了吗？","start":4099.97,"end":4127.09},{"id":257,"text":"So this actually now, it's like no problem. I just write a wrapper around it. And my wrapper takes problems like this, calculates f and x0. We could write the whole wrapper beautifully. Like the first thing you do is you attempt to solve x equals b. What if b is not in the range of a? What do I do? I return that your problem is infeasible.","zh":"因此，现在这实际上没有问题。我只需要在这个求解器周围写一个包装器。我的包装器处理这类问题，计算f和x0。我们可以非常漂亮地写出整个包装器。比如，你做的第一件事就是尝试解x等于b。如果b不在a的值域中，你会怎么做？我会返回你的问题不可行。","start":4127.68,"end":4149.05},{"id":258,"text":"Period. And then I don't have to do anything else. If it's feasible, I'm going to find an x0 and I'm going to find this f. I'm going to solve this problem using this person's fancy solver. I will then quietly return fz plus x0 and that will in fact be a solution of this problem. Everybody got it? So, okay. So that's called eliminating equality constraints. And actually there's a whole lot of confusion about that. Like, I think some very naive people","zh":"完事。然后我就不需要做其他事情了。如果它是可行的，我会找到一个x0，并找到这个f。我会使用这个人 fancy 的求解器来解决这个问题。然后我会安静地返回fz加上x0，这实际上会成为这个问题的一个解。大家明白了吗？所以，好的。这就是所谓的消除等式约束。实际上，关于这一点有很多混淆。比如，我认为有些非常天真的人","start":4149.96,"end":4177.18},{"id":259,"text":"think, this is great. And you say, why? And here would be the story. It's naive. It's totally wrong. But here's the story. I mean, it's plausible if you don't know what you're doing. Here it is. They say, well, I have this problem here. X has dimension 100. And I have 50 equality constraints. Everybody got that? Now, down here, let's assume that's got full rank and all that. So down here, Z has dimension 50.","zh":"嗯，这很好。你说，为什么？然后这里就会有一个故事。这是很天真的，完全错误的。但这就是故事。我的意思是，如果你不知道自己在做什么，这听起来是合理的。这里就是。他们说，好吧，我这里有一个问题。X的维度是100。我有50个等式约束。大家明白了吗？现在，下面这里，我们假设这个矩阵是满秩的，等等。所以下面这里，Z的维度是50。","start":4178.15,"end":4204.43}],"notes":["本段讲授了消除等式约束的概念，即通过将等式约束转化为变量替换，从而将原问题转化为无约束问题。讲者指出，虽然两个问题的约束条件不同，但它们的最优值相同，因此是等价的。讲者还提到，如果一个求解器不支持等式约束，可以通过编写包装器来处理，即计算f和x0，然后使用该求解器求解转化后的问题。","讲者进一步解释了如何处理等式约束的可行性问题。如果b不在矩阵A的列空间中，则问题不可行；如果可行，则找到x0和f，并使用求解器求解转化后的问题，最终返回fz + x0作为原问题的解。","讲者指出，消除等式约束是一个重要的概念，但存在一些误解。例如，有人认为只要将等式约束转化为变量替换，就能直接求解，但实际上这需要考虑约束的秩和可行性问题。","讲者通过一个例子说明了消除等式约束的潜在问题。假设变量x的维度是100，有50个等式约束，那么转化后的变量z的维度是50。如果矩阵A的秩为50，则转化后的变量z的维度是50，而原变量x的维度是100。","讲者强调，消除等式约束需要考虑约束的秩和可行性，不能简单地将等式约束转化为变量替换，否则可能导致错误的结论。","讲者指出，消除等式约束是一个重要的技巧，但需要谨慎处理，特别是在处理高维问题时，必须确保转化后的变量和约束的正确性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4047.31,"end":4204.43,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4047.31,"text":"at all, right? Like, I mean, for one thing, at a very gross level, it's not. If you say this problem dot equality, if you say what is the length of this problem dot equality constraints, it's going to be however many, let's say this p, p equality constraints, it'll be p. Here, when I say this second problem dot equality constraints, if I say length of that, it's a list, it's an empty list."},{"start":4073.84,"text":"And so it's zero. And so, end of story, these are not equal. But they are equivalent, right? And here, in this case, the p star of the two problems, the optimal value is the same, right? And to explain what you do, you say, well, you want to solve this. So what we do is first we compute the f and the x0. Then we solve this problem. Now, z has nothing to do with this problem."},{"start":4099.97,"text":"at all, right? But then what I simply do is I return in this problem, I return fz star plus x zero. And that's going to be the solution here, right? So this actually also has a very important, like if someone comes up with a super fancy solver for a problem, right? They go, here's my, it's awesome, right? It's super fast. I don't, whatever it is, doesn't matter, right? Then you'd say only, only minor problem. It doesn't support equality constraints. Everybody got that?"},{"start":4127.68,"text":"So this actually now, it's like no problem. I just write a wrapper around it. And my wrapper takes problems like this, calculates f and x0. We could write the whole wrapper beautifully. Like the first thing you do is you attempt to solve x equals b. What if b is not in the range of a? What do I do? I return that your problem is infeasible."},{"start":4149.96,"text":"Period. And then I don't have to do anything else. If it's feasible, I'm going to find an x0 and I'm going to find this f. I'm going to solve this problem using this person's fancy solver. I will then quietly return fz plus x0 and that will in fact be a solution of this problem. Everybody got it? So, okay. So that's called eliminating equality constraints. And actually there's a whole lot of confusion about that. Like, I think some very naive people"},{"start":4178.15,"text":"think, this is great. And you say, why? And here would be the story. It's naive. It's totally wrong. But here's the story. I mean, it's plausible if you don't know what you're doing. Here it is. They say, well, I have this problem here. X has dimension 100. And I have 50 equality constraints. Everybody got that? Now, down here, let's assume that's got full rank and all that. So down here, Z has dimension 50."}],"speech_gaps":[],"frame":"../frames/v005/025.webp","frame_time":4059.31},{"title":"消除与引入等式约束的对比","segments":[{"id":260,"text":"If I have 100 dimensional space, I have 50 equality constraints, everything's full rank, z is going to have dimension 50. And then someone says, oh, that's a better problem than that one to solve. And you go, why? And they go, hello, wouldn't you rather solve a problem with 50 variables than 100? Everybody see what I'm saying? It sounds plausible, but it's completely and totally wrong, which you will know later. So in fact, it could be.","zh":"如果我在一个100维的空间中，有50个等式约束，且所有约束都是满秩的，那么z的维度将是50。然后有人会说，哦，这比那个问题更容易解决。你问为什么？他们会说，难道你不宁愿解决一个有50个变量的问题而不是100个变量的问题吗？大家明白我的意思吗？听起来似乎有道理，但实际上这是完全错误的，这一点你们之后会知道。事实上，情况可能正好相反。","start":4206.13,"end":4232.35},{"id":261,"text":"Could be the exact opposite. That you would much rather solve a problem with 100 variables than 50. I'm getting ahead of myself, but we'll come back to that later in the class. Okay? So, okay. You can do the opposite. Yes? Oh, that's linear algebra. Yeah, that's just standard linear algebra. Right? I don't know. I do a QR factorization of like F or, I don't know, something like that. A, sorry, A. Is that?","zh":"可能你宁愿解决一个有100个变量的问题而不是50个变量的问题。我有点跑题了，但我们在课堂上会回到这个话题。好吗？所以，你也可以做相反的事情。对吗？哦，这是线性代数。没错，这仅仅是标准的线性代数。对吧？我不确定。我可以对F或者类似的东西做QR分解，比如A，抱歉，是A。这是不是？","start":4232.87,"end":4262.5},{"id":262,"text":"I mean, I'd be happy to tell you later or something, but that's just linear algebra, right? Okay. Next up is the opposite of eliminating equality constraints is introducing equality constraints, right? Weirdly, this sounds really dumb. It's unbelievably useful, and we will see that later.","zh":"我的意思是，我之后可以告诉你这些，但这只是线性代数，对吧？好的。接下来，消除等式约束的相反操作是引入等式约束，对吧？奇怪的是，这听起来真的很傻。但实际上它无比有用，我们之后会看到这一点。","start":4263.59,"end":4287.14},{"id":263,"text":"So how does that work, right? You start with a problem like that, and you introduce a new variable, and you introduce equality constraints, right? Now, what's hilarious about this is someone says, oh, thanks for your problem. I just made you an equivalent problem. Oh, and by the way, you have to check that these equivalences play nice with convexity. I didn't do that for the other one, so let's go back and look, okay?","zh":"那么，这怎么运作呢？你从一个问题开始，然后引入一个新的变量，并引入等式约束，对吧？现在，这很有趣的是，有人会说，哦，谢谢你的问题。我刚刚为你创建了一个等价的问题。哦，顺便说一句，你必须检查这些等价性是否与凸性相容。我之前没有为另一个问题做这件事，所以我们回去看一下，好吗？","start":4287.98,"end":4314.24},{"id":264,"text":"Here, if that's a convex problem, we have to check this is. How come this is? How come? Yeah, because this function is convex because it's a convex function precomposed with an affine function. These are convex for the same reason. So we do have to say that. At this point, we're not even saying it, right? So, okay.","zh":"在这里，如果这是一个凸问题，我们必须检查这个是否也是凸的。为什么这个是凸的？为什么？是的，因为这个函数是凸函数与仿射函数的复合，这些函数凸性也是出于同样的原因。因此，我们必须说明这一点。此时，我们甚至没有说这一点，对吧？好的。","start":4316.04,"end":4338.73},{"id":265,"text":"Okay, so you uneliminate here. Now, what's hilarious about this is someone says, oh, yeah, I just converted your problem to a new problem. You go, oh, thank you. That's great. Tell me about the new problem. And you go, well, it's got more variables. And you're like, okay. And you go, oh, by the way, your problem didn't have any equality constraints. Now you have a bunch of them. This doesn't sound good, right? This story doesn't sound like it's going. Anyway, believe it or not, it's going to be super useful, this idea. Okay, so.","zh":"好的，所以你现在是撤销消除。现在，这个情况很有趣的是，有人会说，哦，对了，我把你的问题转换成了一个新的问题。你回答，哦，谢谢。这很好。告诉我这个新问题是什么。然后你会说，嗯，它有更多的变量。你可能会说，好的。然后你会说，对了，你原来的问题没有任何等式约束。现在你却有一大堆等式约束。这听起来不太好，对吧？这个故事似乎不太顺利。不管怎样，相信或不相信，这个想法将会非常有用。好的，所以。","start":4339.86,"end":4367.32},{"id":266,"text":"Here's one. This is a famous one. These are all methods that a lot of people know and would learn about by hand, actually literally since the 1940s. So here's one.","zh":"这里有一个。这是一个著名的例子。这些都是很多人知道的方法，实际上从1940年代起人们就会手动学习这些方法。所以这里有一个。","start":4368.63,"end":4381.41}],"notes":["本段讨论了在凸优化中消除和引入等式约束的对比。讲者指出，虽然减少变量数量可能看起来更好，但实际上这并不总是正确的，甚至可能相反。讲者提到，消除等式约束可能涉及线性代数操作，如QR分解，而引入等式约束虽然听起来荒谬，但实际上是很有用的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4206.13,"end":4381.41,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4206.13,"text":"If I have 100 dimensional space, I have 50 equality constraints, everything's full rank, z is going to have dimension 50. And then someone says, oh, that's a better problem than that one to solve. And you go, why? And they go, hello, wouldn't you rather solve a problem with 50 variables than 100? Everybody see what I'm saying? It sounds plausible, but it's completely and totally wrong, which you will know later. So in fact, it could be."},{"start":4232.87,"text":"Could be the exact opposite. That you would much rather solve a problem with 100 variables than 50. I'm getting ahead of myself, but we'll come back to that later in the class. Okay? So, okay. You can do the opposite. Yes? Oh, that's linear algebra. Yeah, that's just standard linear algebra. Right? I don't know. I do a QR factorization of like F or, I don't know, something like that. A, sorry, A. Is that?"},{"start":4263.59,"text":"I mean, I'd be happy to tell you later or something, but that's just linear algebra, right? Okay. Next up is the opposite of eliminating equality constraints is introducing equality constraints, right? Weirdly, this sounds really dumb. It's unbelievably useful, and we will see that later."},{"start":4287.98,"text":"So how does that work, right? You start with a problem like that, and you introduce a new variable, and you introduce equality constraints, right? Now, what's hilarious about this is someone says, oh, thanks for your problem. I just made you an equivalent problem. Oh, and by the way, you have to check that these equivalences play nice with convexity. I didn't do that for the other one, so let's go back and look, okay?"},{"start":4316.04,"text":"Here, if that's a convex problem, we have to check this is. How come this is? How come? Yeah, because this function is convex because it's a convex function precomposed with an affine function. These are convex for the same reason. So we do have to say that. At this point, we're not even saying it, right? So, okay."},{"start":4339.86,"text":"Okay, so you uneliminate here. Now, what's hilarious about this is someone says, oh, yeah, I just converted your problem to a new problem. You go, oh, thank you. That's great. Tell me about the new problem. And you go, well, it's got more variables. And you're like, okay. And you go, oh, by the way, your problem didn't have any equality constraints. Now you have a bunch of them. This doesn't sound good, right? This story doesn't sound like it's going. Anyway, believe it or not, it's going to be super useful, this idea. Okay, so."},{"start":4368.63,"text":"Here's one. This is a famous one. These are all methods that a lot of people know and would learn about by hand, actually literally since the 1940s. So here's one."}],"speech_gaps":[],"frame":"../frames/v005/026.webp","frame_time":4218.13},{"title":"松弛变量与上图形式","segments":[{"id":267,"text":"You can take a linear inequality and introduce what's called a slack variable. That's like a standard term, not in math, but in, for example, OR, or in optimization, right? And these are just very simple and dumb, these little transformations. But this one says, we rewrite this as ai transpose x plus si equals bi, where si is a number bigger than zero, and that's called the slack.","zh":"你可以将一个线性不等式转换，并引入所谓的松弛变量。这是一个标准术语，虽然不是数学中的术语，但在例如运筹学或优化中经常使用，对吧？这些只是非常简单和直接的小转换。但这里说的是，我们将它重写为 ai 的转置乘以 x 加上 si 等于 bi，其中 si 是一个大于零的数，这被称为松弛变量。","start":4383.18,"end":4408.88},{"id":268,"text":"And slack makes perfect sense. So it means if you're right up against it, S is zero. If S is positive, it means this constraint is satisfied with strict inequality.","zh":"松弛变量的概念非常合理。这意味着如果你刚好处于边界上，S 就是零。如果 S 是正数，这意味着这个约束被严格满足。","start":4409.47,"end":4420.05},{"id":269,"text":"And slack comes from the idea of a chain or a rope between two things. The constraint is if I put a steel cable between two things and I make it a meter long, then those two things cannot be more than a meter apart. If they're exactly a meter apart, then that chain is taut. That's not a word in optimization. But if they're less than a meter apart, then there's zero tension in the chain, and then it's slack.","zh":"松弛变量这个术语来源于两个物体之间一条链条或绳子的概念。约束条件就是如果我在两个物体之间拉一条钢缆，并且让它长度为一米，那么这两个物体之间的距离不能超过一米。如果它们正好相距一米，那么这条链条是绷紧的。这不是优化中的术语。但如果它们的距离小于一米，那么链条中就没有张力，此时就称为松弛。","start":4420.84,"end":4450.06},{"id":270,"text":"And that word did make it into optimization. Everybody, so that, if you're curious, that's what it means, right? Slack rope or Slack cable or something. Okay. Okay. So this is called introducing Slack variables. We'll show a couple of, this one is also kind of interesting. This says, this is, I have my standard form problem and I can rewrite it this way, which is hilarious. I introduce a new variable.","zh":"这个词确实进入了优化领域。大家，如果你感兴趣的话，这就是它的意思，对吧？松弛绳子或松弛缆绳之类的。好的，好的。这就是所谓的引入松弛变量。我们将展示几个例子，其中这个例子也相当有趣。它说，我有一个标准形式的问题，我可以这样重写，这很有趣。我引入了一个新变量。","start":4450.68,"end":4474.58},{"id":271,"text":"So now my variables are xt. Now when you hear xt, you should be thinking graph, epigraph, hypograph, these kinds of things, because that's what it generally means when you have a variable and a comma, a scalar, right? And so here, this constraint here simply says that xt, the pair xt is in the epigraph.","zh":"现在我的变量是 xt。当你听到 xt 时，你应该想到图、上图、下图这些概念，因为当你有一个变量和一个逗号，以及一个标量时，通常就是这个意思。在这里，这个约束条件仅仅表示 xt 这对变量位于上图中。","start":4475.1,"end":4495.32},{"id":272,"text":"I mean, it's kind of silly. This just says t is bigger than the objective, right? And then it says you minimize t subject to this, okay? Now, here's what's cool about this. Some people say this in a very fancy way. They say things like, for convex optimization, a linear objective is universal. I don't even know what that means. Anyway, so it says, without loss of generality, well, if you can handle this constraint,","zh":"我意思，这有点傻。它只是说 t 大于目标函数，对吧？然后它说在满足这个约束的条件下最小化 t，对吧？现在，这里有趣的地方在于，有些人用非常花哨的方式说这个。他们说，对于凸优化，线性目标函数是通用的。我甚至不知道这是什么意思。不管怎样，它说，在不丧失一般性的情况下，如果你能够处理这个约束，","start":4495.98,"end":4522.56},{"id":273,"text":"and then you have a linear objective, you're good to go. You just solve the problem in epigraph form. Make sense? So that's why a lot of times if you'd say, you'd say, oh, I went to Google, I looked for code to solve this thing, and it's not there because the only thing I can find can solve a linear objective, and my problem has a nonlinear objective. And the reason is people are just expecting you to put something into epigraph form.","zh":"然后你有一个线性目标函数，就可以直接进行下去了。你只需要以上图的形式解决这个问题。明白吗？这就是为什么很多时候如果你说，比如说，我去谷歌搜索解决这个问题的代码，却发现没有，因为唯一能找到的代码只能解决线性目标函数的问题，而我的问题具有非线性目标函数。原因在于人们只是期望你把问题转化为上图形式。","start":4523.5,"end":4553.0}],"notes":["本段讲解了松弛变量的概念，它用于将不等式约束转换为等式形式，通过引入一个正数变量si，使得原不等式变为等式。松弛变量在优化问题中非常常见，特别是在运筹学和优化领域。"],"formulas":[{"latex":"a_i^T x + s_i = b_i","symbols":"a_i^T x + s_i = b_i","explanation":"公式正确，表示引入松弛变量s_i后，线性不等式转换为等式。符号和等号使用正确，无需修改。","evidence":"You can take a linear inequality and introduce what's called a slack variable. That's like a standard term, not in math, but in, for example, OR, or in optimization, right? And these are just very simple and dumb, these little transformations. But this one says, we rewrite this as ai transpose x plus si equals bi, where si is a number bigger than zero, and that's called the slack."}],"uncertainties":[],"diagram":"none","start":4383.18,"end":4553.0,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复，公式正确且符合上下文描述。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4383.18,"text":"You can take a linear inequality and introduce what's called a slack variable. That's like a standard term, not in math, but in, for example, OR, or in optimization, right? And these are just very simple and dumb, these little transformations. But this one says, we rewrite this as ai transpose x plus si equals bi, where si is a number bigger than zero, and that's called the slack."},{"start":4409.47,"text":"And slack makes perfect sense. So it means if you're right up against it, S is zero. If S is positive, it means this constraint is satisfied with strict inequality."},{"start":4420.84,"text":"And slack comes from the idea of a chain or a rope between two things. The constraint is if I put a steel cable between two things and I make it a meter long, then those two things cannot be more than a meter apart. If they're exactly a meter apart, then that chain is taut. That's not a word in optimization. But if they're less than a meter apart, then there's zero tension in the chain, and then it's slack."},{"start":4450.68,"text":"And that word did make it into optimization. Everybody, so that, if you're curious, that's what it means, right? Slack rope or Slack cable or something. Okay. Okay. So this is called introducing Slack variables. We'll show a couple of, this one is also kind of interesting. This says, this is, I have my standard form problem and I can rewrite it this way, which is hilarious. I introduce a new variable."},{"start":4475.1,"text":"So now my variables are xt. Now when you hear xt, you should be thinking graph, epigraph, hypograph, these kinds of things, because that's what it generally means when you have a variable and a comma, a scalar, right? And so here, this constraint here simply says that xt, the pair xt is in the epigraph."},{"start":4495.98,"text":"I mean, it's kind of silly. This just says t is bigger than the objective, right? And then it says you minimize t subject to this, okay? Now, here's what's cool about this. Some people say this in a very fancy way. They say things like, for convex optimization, a linear objective is universal. I don't even know what that means. Anyway, so it says, without loss of generality, well, if you can handle this constraint,"},{"start":4523.5,"text":"and then you have a linear objective, you're good to go. You just solve the problem in epigraph form. Make sense? So that's why a lot of times if you'd say, you'd say, oh, I went to Google, I looked for code to solve this thing, and it's not there because the only thing I can find can solve a linear objective, and my problem has a nonlinear objective. And the reason is people are just expecting you to put something into epigraph form."}],"speech_gaps":[],"frame":"../frames/v005/027.webp","frame_time":4395.18},{"title":"凸优化中的选择最小化与拟凸优化","segments":[{"id":274,"text":"Other things you can do are things like selective minimization. So you have two variables here. I could actually eliminate x2. Suppose I can analytically minimize over f0 over x2. Then I can do that, and I have a problem that looks like this. This would be the case, for example, if this function were quadratic in x2. I can minimize a quadratic analytically.","zh":"你还可以做一些事情，比如选择性最小化。这里有两个变量。我实际上可以消除x2。假设我可以对f0关于x2进行解析最小化，那么我可以这样做，然后得到一个看起来像这样的问题。例如，如果这个函数在x2上是二次的，那么我可以解析地最小化一个二次函数。","start":4556.84,"end":4580.44},{"id":275,"text":"I could do that, and then I eliminate x2. And this is basically part of dynamic programming. That's what would happen in dynamic programming. If you want to find a good choice of an input over some sequence, you start at the end.","zh":"我可以这样做，然后消除x2。这基本上是动态规划的一部分。这就是动态规划会发生的情况。如果你想在某个序列上找到一个输入的良好选择，你应该从序列的末尾开始。","start":4580.98,"end":4595.4},{"id":276,"text":"you minimize over the last one that and then there this function is called like the value function or something like that right and you and you just keep going it all works and this one also like the all of these play nice with convexity uh so here the reason f zero tilde is convex is because it is partial minimization of f zero with respect to the variable x2 okay everybody got that so so all the rules you saw before","zh":"你最小化最后一个变量，然后这个函数被称为值函数或其他类似的东西，对吧？然后你继续这样做，所有这些都有效，而且在这里，f零的拟凸性是因为它是对f零关于变量x2的部分最小化，大家明白这一点，所以之前看到的所有规则现在都在这里使用。","start":4595.9,"end":4624.42},{"id":277,"text":"we're now using for problems. Okay, I'll say a little bit about quasi-convex optimization. So if I have convex, you know, inequality constraints, linear equality constraints, and I minimize a quasi-convex function, that's called quasi-convex optimization. And you have to be very careful here because, for example, this is for sure a quasi-convex function. And by the way, it's actually really flat here.","zh":"我们现在正在使用这些规则来解决这些问题。好的，我将简要介绍拟凸优化。如果你有凸的不等式约束、线性等式约束，并且最小化一个拟凸函数，这就被称为拟凸优化。你必须在这里非常小心，例如，这肯定是一个拟凸函数。顺便说一句，它在这里实际上非常平坦。","start":4625.19,"end":4652.44},{"id":278,"text":"It's not that it's visually flat, it's flat. And then it keeps going up. This is quasi-convex. That point is for sure locally optimal. Because you wiggle a little bit left and right and the objective does not go down. But it is clearly not the optimum, which is here. So some things don't hold.","zh":"它不是因为视觉上看起来平坦，而是真的平坦，然后它继续上升。这是拟凸的。这个点肯定是一个局部最优解，因为稍微向左或向右移动一点，目标函数不会下降。但它显然不是最优解，它在这里。因此，一些性质并不成立。","start":4653.06,"end":4675.18},{"id":279,"text":"in this case. But it turns out we can solve these using convex optimization pretty easily. And I'll show this trick and then we'll quit for today. So if f0 is quasi-convex, then what you do is you find a parameterized set of convex functions which have the following form. This defines a convex set in x.","zh":"在这种情况下。但事实上，我们可以用凸优化相对容易地解决这些问题。我将展示这个技巧，然后我们今天就结束。如果f0是拟凸的，那么你所做的就是找到一组参数化的凸函数，其形式如下。这在x中定义了一个凸集。","start":4675.59,"end":4698.96},{"id":280,"text":"for each T. That's actually what it means to be quasi-convex, right? And so what I do is I express that as a convex function, phi T being less than zero. And here's an example. The ratio of a convex to a concave positive, a non-negative convex divided by a concave positive function, this is actually quasi-convex, okay?","zh":"对于每个T来说，这实际上就是拟凸的含义，对吧？因此，我将其表示为一个凸函数，phi T小于零。这里有一个例子。一个凸函数与一个凹函数的比值，一个非负的凸函数除以一个凹的正函数，实际上就是拟凸的，对吧？","start":4699.79,"end":4723.74}],"notes":["本段讲解了凸优化中的选择最小化（selective minimization）方法，即在存在多个变量的情况下，通过消除某些变量来简化问题。例如，当目标函数在某个变量上是二次函数时，可以解析地最小化该变量，从而得到一个简化的问题。这种方法与动态规划中的思想类似，即从序列的末尾开始逐步求解。","在动态规划中，通过从最后一步开始最小化，逐步向前推进，最终得到一个整体的最优解。这种策略在凸优化中同样适用，因为部分最小化后的函数仍保持凸性，从而保证了优化过程的可行性。","接下来，课程介绍了拟凸优化（quasi-convex optimization）的概念。当目标函数是拟凸函数，且约束条件为凸不等式和线性等式时，该问题被称为拟凸优化。需要注意的是，拟凸函数并不一定满足全局最优的性质，例如，某个点可能是局部最优，但并非全局最优。","尽管拟凸函数在某些情况下可能表现出平坦的特性，但其整体形状仍然保持上升趋势。因此，虽然局部最优存在，但全局最优可能位于其他位置。这说明在拟凸优化中，需要特别小心，不能简单地依赖局部最优。","课程还提到，拟凸优化可以通过凸优化方法求解。具体方法是构造一个参数化的凸函数集合，这些函数在变量上形成一个凸集。通过将原问题转化为这些凸函数的约束条件，可以利用凸优化的工具进行求解。","最后，课程以一个例子说明了拟凸函数的构造方式，即凸函数除以凹函数（前提是分母为正），结果仍然是拟凸函数。这种构造方式为拟凸优化提供了理论支持。"],"formulas":[{"latex":"f_0(x) = \\frac{f_{\\text{convex}}(x)}{f_{\\text{concave}}(x)}","symbols":"拟凸函数的构造方式","explanation":"该公式正确表达了拟凸函数的构造方式，即凸函数除以凹函数，且分母为正，符合拟凸函数的定义。","evidence":"for each T. That's actually what it means to be quasi-convex, right? And so what I do is I express that as a convex function, phi T being less than zero. And here's an example. The ratio of a convex to a concave positive, a non-negative convex divided by a concave positive function, this is actually quasi-convex, okay?"}],"uncertainties":["f zero tilde is convex is because it is partial minimization of f zero with respect to the variable x2"],"diagram":"none","start":4556.84,"end":4723.74,"asr_flags":[],"math_clarifications":["f_zero_tilde的定义未在原始文本中明确给出，因此无法核定其数学形式，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4556.84,"text":"Other things you can do are things like selective minimization. So you have two variables here. I could actually eliminate x2. Suppose I can analytically minimize over f0 over x2. Then I can do that, and I have a problem that looks like this. This would be the case, for example, if this function were quadratic in x2. I can minimize a quadratic analytically."},{"start":4580.98,"text":"I could do that, and then I eliminate x2. And this is basically part of dynamic programming. That's what would happen in dynamic programming. If you want to find a good choice of an input over some sequence, you start at the end."},{"start":4595.9,"text":"you minimize over the last one that and then there this function is called like the value function or something like that right and you and you just keep going it all works and this one also like the all of these play nice with convexity uh so here the reason f zero tilde is convex is because it is partial minimization of f zero with respect to the variable x2 okay everybody got that so so all the rules you saw before"},{"start":4625.19,"text":"we're now using for problems. Okay, I'll say a little bit about quasi-convex optimization. So if I have convex, you know, inequality constraints, linear equality constraints, and I minimize a quasi-convex function, that's called quasi-convex optimization. And you have to be very careful here because, for example, this is for sure a quasi-convex function. And by the way, it's actually really flat here."},{"start":4653.06,"text":"It's not that it's visually flat, it's flat. And then it keeps going up. This is quasi-convex. That point is for sure locally optimal. Because you wiggle a little bit left and right and the objective does not go down. But it is clearly not the optimum, which is here. So some things don't hold."},{"start":4675.59,"text":"in this case. But it turns out we can solve these using convex optimization pretty easily. And I'll show this trick and then we'll quit for today. So if f0 is quasi-convex, then what you do is you find a parameterized set of convex functions which have the following form. This defines a convex set in x."},{"start":4699.79,"text":"for each T. That's actually what it means to be quasi-convex, right? And so what I do is I express that as a convex function, phi T being less than zero. And here's an example. The ratio of a convex to a concave positive, a non-negative convex divided by a concave positive function, this is actually quasi-convex, okay?"}],"speech_gaps":[],"frame":"../frames/v005/028.webp","frame_time":4568.84},{"title":"凸函数的子级集与二分法","segments":[{"id":281,"text":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?","zh":"嗯，我该怎么检查呢？嗯，我想知道当p(x)的时候，也就是我想看看下级集，也就是p(x)除以q(x)小于等于t的情况。q是正的，我把它移到另一边，得到p(x)小于t乘以q(x)。大家跟得上吗？对吧？我把它移到另一边，得到p减去t乘以q(x)。如果这个小于等于零，那么这个值就小于t。好的？","start":4726.93,"end":4752.69},{"id":282,"text":"So that's a convex function. So it's a convex in x, not jointly in x and t, but in x. For each t, positive, not negative, this is a convex function, right? And so what this says is I have a specific way of seeing if I can...","zh":"所以这是一个凸函数。它是关于x凸的，而不是关于x和t联合凸的，只是关于x。对于每个正的t，这是一个凸函数，对吧？所以这说明我有一个特定的方法来判断我是否能够……","start":4753.18,"end":4773.5},{"id":283,"text":"if I can find a point that has that value. And then what we do is just bisection. And I'll quit very briefly, but this is the idea. What you do is you simply solve a feasibility problem. This one basically says, can you find a point where f0 of x is less than t? That's this.","zh":"找到一个具有该值的点。然后我们所做的就是二分法。我将非常简短地结束，但这是这个想法。你所做的就是解决一个可行性问题。这个问题基本上是在问，你能找到一个点，使得f0(x)小于t吗？这就是这个。","start":4773.93,"end":4794.97},{"id":284,"text":"Right? These are the constraints. If you can, then you found a point, and then you know for sure the optimal P star is less than that number. If the answer is you can't, then you know that P star is above there. Okay? And you just use bisection. So we'll quit here today, and then we'll continue on Thursday.","zh":"对吧？这些是约束条件。如果你能找到，那么你就找到了一个点，并且你确定最优值P星小于这个数值。如果答案是你找不到，那么你就知道P星在那个数值之上。好的？然后你只需要使用二分法。所以我们今天就到这里，然后我们将在星期四继续。","start":4795.61,"end":4817.58}],"notes":["本段讲解了如何通过子级集来判断一个函数是否为凸函数。具体来说，通过将函数p(x)/q(x) ≤ t转化为p(x) ≤ t q(x)，并进一步转化为p(x) - t q(x) ≤ 0，从而判断该函数是否为凸函数。这里强调了q(x)为正数的条件，以及如何通过不等式变形来验证凸性。","讲者指出，该函数在x上是凸函数，而不是在x和t的联合空间上。对于每个正数t，该函数在x上保持凸性。这表明，通过选择不同的t值，可以验证函数在不同子级集上的凸性。","讲者提到，通过二分法可以找到满足条件的点。具体来说，通过求解可行性问题，即是否存在x使得f0(x) \u003c t，从而确定最优值P*的上下界。如果存在这样的点，则P*小于该t值；如果不存在，则P*大于该t值。","讲者强调了二分法的应用，即通过不断调整t的值，逐步缩小P*的可能范围，直到找到最优解。这种方法在凸优化中非常常见，因为它能够有效地处理大规模优化问题。"],"formulas":[{"latex":"p(x)/q(x) \\text{ is less than or equal to } t","symbols":"p(x)/q(x) ≤ t","explanation":"该公式正确表达了子水平集的定义，即p(x)/q(x) ≤ t。q(x)为正数，因此乘以q(x)不改变不等式方向。","evidence":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?"},{"latex":"p(x) - t q(x) \\text{ is less than or equal to } 0","symbols":"p(x) - t q(x) ≤ 0","explanation":"该公式正确表达了将原不等式p(x)/q(x) ≤ t转换为p(x) - t q(x) ≤ 0的过程，适用于q(x) > 0的情况。","evidence":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?"},{"latex":"f_0(x) \u003c t","symbols":"f0(x) \u003c t","explanation":"该公式正确表达了可行性问题的约束条件，即f0(x) \u003c t，用于判断是否存在满足条件的点。","evidence":"if I can find a point that has that value. And then what we do is just bisection. And I'll quit very briefly, but this is the idea. What you do is you simply solve a feasibility problem. This one basically says, can you find a point where f0 of x is less than t? That's this."}],"uncertainties":[],"diagram":"none","start":4726.93,"end":4817.58,"asr_flags":[],"math_clarifications":["所有公式均基于原文内容，未进行额外假设或修改。"],"boards":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":4726.93,"text":"Well, how do I check that? Well, I want to know what happens if p of x, you know, I want to look at the sublevel set, which is p of x over q of x is less than or equal to t. q is positive, I multiply it on the other side, and I got p of x is less than t q of x. Everybody following this? Right? I pull it over and I get p minus t q of x. If this is less than or equal to zero, then this thing is less than t. Okay?"},{"start":4753.18,"text":"So that's a convex function. So it's a convex in x, not jointly in x and t, but in x. For each t, positive, not negative, this is a convex function, right? And so what this says is I have a specific way of seeing if I can..."},{"start":4773.93,"text":"if I can find a point that has that value. And then what we do is just bisection. And I'll quit very briefly, but this is the idea. What you do is you simply solve a feasibility problem. This one basically says, can you find a point where f0 of x is less than t? That's this."},{"start":4795.61,"text":"Right? These are the constraints. If you can, then you found a point, and then you know for sure the optimal P star is less than that number. If the answer is you can't, then you know that P star is above there. Okay? And you just use bisection. So we'll quit here today, and then we'll continue on Thursday."}],"speech_gaps":[],"frame":"../frames/v005/029.webp","frame_time":4738.93}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v005.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>${point.visual_source?.verified?'原PPT提取与重绘':'讲解梳理 · 原PPT待核对'} · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p>${point.visual_source?.verified?`<section class="ppt-source"><h3>原PPT对照 · ${esc(point.visual_source.slide_number)}</h3><a href="${esc(point.visual_source.slide_image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.visual_source.slide_image)}" style="width:100%;border:1px solid #ccd9dd;border-radius:8px" alt="原PPT第${esc(point.visual_source.slide_number)}页"></a><p class="muted">已对照本讲视频 ${stamp(point.visual_source.video_time)} 的画面。<a href="${esc(point.visual_source.source_url)}" target="_blank" rel="noopener">原始讲义 PDF</a> · PDF 第 ${point.visual_source.pdf_page} 页</p><p><b>从原页提取：</b>${point.visual_source.items.map(esc).join('；')}</p></section>`:''}<div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(f=>'<p class="muted">'+esc(f.origin||'讲者讲述与既有整理')+'</p>'+formula(f)).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length,verified=data.pages.flatMap(p=>p.boards||[]).filter(b=>b.visual_source?.verified).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页含讲解画板 · '+verified+' 个已核对原PPT</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
