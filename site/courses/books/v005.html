mework. That's the one you're doing right now. Right. So we transition in homework three to actually interesting stuff."},{"start":112.5,"text":"So just to give you a rough idea. So you're not going to get 10 weeks of homework one and homework two type things."},{"start":120.38,"text":"So we're going to segue to actually stuff that's interesting and useful and all that kind of stuff. Any questions? Now, I guess we are literally at the emotional low point of the class. Although I suppose it's not that... I mean, if you've survived, then I guess that's good news. Any questions about where we head from here? Okay, if not..."},{"start":146.27,"text":"What we'll do is I'm going to finish with two more useful extensions of the idea of convexity that we're going to use in the SQL. Actually, everything we talk about we'll use later in the class."}],"speech_gaps":[],"frame":"../frames/v005/001.webp","frame_time":17.23},{"title":"对数凹函数与对数凸函数","segments":[{"id":7,"text":"And remember that I said that there's, you know, there's a whole industry of people coming up with various extensions of convexity and there's pseudo convexity and quasi convexity and log convexity. We'll talk about that. All sorts of things. And there's like a whole bunch of these things and, you know, whole books written on them and all that kind of stuff. So we have selected a small subset of these that are actually useful. Quasi convex, which I talked about last time is one and the other one.","start":162.08,"end":189.06},{"id":8,"text":"which is interesting, comes up in a lot of fields, but especially in statistics, is the idea of log-concave and log-convex functions. And that's what we're going to talk about today first. So, what is it? Actually, it's super-duper simple. We just say that a function, which has to be positive, is log-concave if its log is concave. I mean, so that's all it means. Okay? Sorry.","start":189.5,"end":215.22},{"id":9,"text":"Yes, log-concave. Now, there's a weird asymmetry here. And it turns out it's log-concave things that come up all the time, not log-convex. So if you do a Google search on log-concave, you'll get zillions of papers and books and things like that. Log-convex, you'll get almost nothing. So it's just a weird, I mean, I don't know the reason for that, but there's a weird asymmetry.","start":216.26,"end":239.7},{"id":10,"text":"So what that means is if you take the Jensen inequality that defines convexity for the log, and then you exponentiate it, then you get this. And it's actually real interesting. It says that a log-concave function, when you evaluate it at a mixture of arguments, that's theta x plus 1 minus theta y, then what happens is if it were concave, this would simply be bigger than or equal to...","start":240.8,"end":266.36},{"id":11,"text":"the weighted arithmetic mean of f of x and f of y, right? That's what it means to be concave. Here, it's actually, this is the weighted geometric mean. That's what people call it. So it's the weighted geometric mean, right? So for example, if theta is a half, it's literally the geometric mean of the two values, okay? So I mean, this is just kind of repeating stuff.","start":267.61,"end":287.69},{"id":12,"text":"So, you know, there's a bunch of examples like, you know, powers. These powers are log convex if A is negative, and they're log concave for A being bigger than or equal to zero, right? So that's one. But mostly it comes up in things like probability densities. So there, a good example is that here's a normal density on Rn, right? So that's the density of a...","start":289.64,"end":316.64}],"notes":["本段介绍了对数凹函数和对数凸函数的基本概念，指出对数凹函数在统计学中更为常见。对数凹函数的定义是函数必须为正，并且其对数为凹函数。对数凸函数则相反，但实际应用中对数凹函数更为普遍。","讲者提到对数凹函数的定义与Jensen不等式相关，通过指数化Jensen不等式可以得到对数凹函数的性质。具体来说，对数凹函数在混合参数下的值大于等于加权几何平均值，而对数凸函数则相反。","讲者举了幂函数的例子，说明当指数A为负时，幂函数是对数凸的；当A大于等于零时，幂函数是对数凹的。这表明对数凹和对数凸函数的性质与指数的正负有关。","讲者还提到对数凹函数在概率密度函数中的应用，例如正态分布的密度函数是对数凹的。这说明对数凹函数在统计学和概率论中有重要的应用。","讲者指出对数凹函数在文献中出现的频率远高于对数凸函数，这可能与实际应用需求有关，但具体原因未明确说明。","讲者强调对数凹函数的定义和性质与凸函数的定义密切相关，但通过指数化操作后，其性质发生了变化，这需要特别注意。"],"formulas":[],"uncertainties":["log-convex"],"diagram":"none","start":162.08,"end":316.64,"asr_flags":[],"math_clarifications":["原句中提到log-concave函数的性质，即其在混合点处的值大于等于加权几何平均，但提供的公式中描述为加权算术平均，这与实际数学定义不符，因此需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":162.08,"text":"And remember that I said that there's, you know, there's a whole industry of people coming up with various extensions of convexity and there's pseudo convexity and quasi convexity and log convexity. We'll talk about that. All sorts of things. And there's like a whole bunch of these things and, you know, whole books written on them and all that kind of stuff. So we have selected a small subset of these that are actually useful. Quasi convex, which I talked about last time is one and the other one."},{"start":189.5,"text":"which is interesting, comes up in a lot of fields, but especially in statistics, is the idea of log-concave and log-convex functions. And that's what we're going to talk about today first. So, what is it? Actually, it's super-duper simple. We just say that a function, which has to be positive, is log-concave if its log is concave. I mean, so that's all it means. Okay? Sorry."},{"start":216.26,"text":"Yes, log-concave. Now, there's a weird asymmetry here. And it turns out it's log-concave things that come up all the time, not log-convex. So if you do a Google search on log-concave, you'll get zillions of papers and books and things like that. Log-convex, you'll get almost nothing. So it's just a weird, I mean, I don't know the reason for that, but there's a weird asymmetry."},{"start":240.8,"text":"So what that means is if you take the Jensen inequality that defines convexity for the log, and then you exponentiate it, then you get this. And it's actually real interesting. It says that a log-concave function, when you evaluate it at a mixture of arguments, that's theta x plus 1 minus theta y, then what happens is if it were concave, this would simply be bigger than or equal to..."},{"start":267.61,"text":"the weighted arithmetic mean of f of x and f of y, right? That's what it means to be concave. Here, it's actually, this is the weighted geometric mean. That's what people call it. So it's the weighted geometric mean, right? So for example, if theta is a half, it's literally the geometric mean of the two values, okay? So I mean, this is just kind of repeating stuff."},{"start":289.64,"text":"So, you know, there's a bunch of examples like, you know, powers. These powers are log convex if A is negative, and they're log concave for A being bigger than or equal to zero, right? So that's one. But mostly it comes up in things like probability densities. So there, a good example is that here's a normal density on Rn, right? So that's the density of a..."}],"speech_gaps":[],"frame":"../frames/v005/002.webp","frame_time":174.08},{"title":"对数凹函数与分布的性质","segments":[{"id":13,"text":"standard, normal, random variable. And here, if you take a look at this, this thing is log concave, right? Let's check that. Well, if I take the log of it, this is just a constant, and it's completely irrelevant for curvature, right? And then over here, you take the log of that, and you get a negative quadratic. Sigma is positive definite, so this thing here is going to be concave, and I'm including the minus sign here.","start":317.21,"end":343.45},{"id":14,"text":"Okay, so that's sort of your canonical example of a log. And in fact, people refer, if you have a measure.","start":343.88,"end":350.86},{"id":15,"text":"that has a density that's log-concave. It's called a log-concave measure. And they're super-duper important in lots of different fields. It comes up in economics, comes up in statistics a lot. And for example, again, this is just a more advanced topic. You don't have to know about it. It's, for example, a very good regularizer. Like if you say, I'm going to fit a distribution to my data and you insist that that distribution be log-concave, that's actually a very sensible regularizer. Again, this is just for...","start":351.58,"end":379.86},{"id":16,"text":"people who know what I'm talking about, right? Okay. By the way, a ton of common densities are log-concave. I actually don't remember which ones, but, you know, it's like a long list of, like, most, like, probably most or at least, you know, half of all kind of named densities are log-concave. And it's not very hard for you to figure out, you know, which is which. Okay? So those are some examples. Okay.","start":380.06,"end":405.46},{"id":17,"text":"Here's one. This one is not obvious at all. It's going to rely on, there's going to be one new thing in this topic, which I'll get to shortly. But this is not obvious at all, right? So here's the cumulative distribution of a standard Gaussian distribution on R, right? So that's the CDF.","start":406.53,"end":425.65},{"id":18,"text":"Now, of course, this function you can, I mean, there's libraries that compute this and all that sort of stuff, I mean, obviously. But this is not obvious at all, that this is actually log-concave. So there's, in fact, that's like a homework exercise, and it's not a short one, and it's got hints. So it's not totally obvious, but it's true. Actually, we're going to see later that any CDF of...","start":426.42,"end":453.86},{"id":19,"text":"Any cumulative distribution function of a log-concave density is going to be also log-concave. Okay? So, okay. So here's some properties. I mean, some are obvious. This just translates, you know, if you write out the formula for what the Hessian of the log of f is, and you say that's less than or equal to zero, you know, in a matrix sense.","start":454.25,"end":481.98}],"notes":["本段主要讲解了对数凹函数的概念及其在概率分布中的应用。首先，讲者指出标准正态分布是log-concave的，因为其对数是凹函数。接着，讲者提到log-concave分布的重要性，特别是在经济学和统计学中。此外，还提到log-concave分布作为正则化器的用途，以及常见的分布中大多数都是log-concave的。","讲者进一步指出，标准高斯分布的累积分布函数（CDF）也是log-concave的，尽管这一点并不明显。讲者提到这是一个作业题，需要通过推导来证明，并且会稍后在课程中进一步讨论。最后，讲者提到log-concave密度的CDF也是log-concave的，这是log-concave函数的一个性质。","讲者还提到，判断一个函数是否为log-concave可以通过计算其对数的Hessian矩阵是否为半正定矩阵来判断。这涉及到凸优化中的基本概念，如Hessian矩阵和半正定性。"],"formulas":[{"latex":"f(x) \\text{ is log-concave} \\text{ if } \\text{log}(f(x)) \\text{ is concave}","symbols":"对数凹函数的定义","explanation":"该公式正确表达了对数凹函数的定义，即如果函数的对数是凹函数，则该函数是对数凹函数。","evidence":"standard, normal, random variable. And here, if you take a look at this, this thing is log concave, right? Let's check that. Well, if I take the log of it, this is just a constant, and it's completely irrelevant for curvature, right? And then over here, you take the log of that, and you get a negative quadratic. Sigma is positive definite, so this thing here is going to be concave, and I'm including the minus sign here."},{"latex":"f(x) \\text{ is log-concave} \\text{ if } \\nabla^2 \\text{log}(f(x)) \\text{ is negative semidefinite}","symbols":"对数凹函数的Hessian条件","explanation":"该公式正确表达了对数凹函数的Hessian条件，即函数的对数的Hessian矩阵是负半定的。","evidence":"Any cumulative distribution function of a log-concave density is going to be also log-concave. Okay? So, okay. So here's some properties. I mean, some are obvious. This just translates, you know, if you write out the formula for what the Hessian of the log of f is, and you say that's less than or equal to zero, you know, in a matrix sense."},{"latex":"F(x) \\text{ is log-concave} \\text{ if } \\text{log}(F(x)) \\text{ is concave}","symbols":"累积分布函数的log-concave性","explanation":"该公式正确表达了累积分布函数的log-concave性，即如果累积分布函数的对数是凹函数，则该函数是对数凹函数。","evidence":"Now, of course, this function you can, I mean, there's libraries that compute this and all that sort of stuff, I mean, obviously. But this is not obvious at all, that this is actually log-concave. So there's, in fact, that's like a homework exercise, and it's not a short one, and it's got hints. So it's not totally obvious, but it's true. Actually, we're going to duct of log-concave functions is log-concave. That's obvious, right? Because if I take two log-concave functions, I multiply them. Now I take the log. It's just the sum of the logs. So it relies on the deep fact that the sum of two concave functions is concave. So this one is easy.","start":517.49,"end":543.79},{"id":23,"text":"Now the sum of two log-concave, the sum of log-concave functions is not always log-concave. In fact, someone want to give me a quick example? Using maybe the stuff we just looked at? Sum of two Gaussian densities? Somebody want to? All right, here we go. Here's a, whoop, okay. Here's one Gaussian, and here's another one. Okay, right? They're both log-concave. If I sum those,","start":545.22,"end":580.45},{"id":24,"text":"What do I get? I get some function that goes up, has a bump, comes back down, goes up again, and down. Could that be log-concave? It could not be, right? Because, well, one way to say it is that is actually, I could look at it, I could say it's not quasi-concave, for example, right? Because it's got a portion where it bends down, right? So that's not log-concave.","start":581.09,"end":609.41},{"id":25,"text":"Okay, I'll let you flesh out that example more.","start":609.84,"end":613.88},{"id":26,"text":"And then it turns out there is a kind of non-trivial fact about log-concave functions.","start":615.02,"end":622.42},{"id":27,"text":"As far as I know, this wasn't known until 1973, right?","start":623.3,"end":627.52},{"id":28,"text":"Whereas most of the other things we've talked about were known maybe in the 1920s, 30s,","start":627.6,"end":632.7},{"id":29,"text":"or maybe no one really asked the question, and it was so simple that had we asked people in the 1920s, they would have known.","start":632.7,"end":638.18},{"id":30,"text":"own. I believe this to not be the case for this. So the rule is this. It says that if you have a","start":638.18,"end":645.26},{"id":31,"text":"function that's log-concave in two variables and you integrate out over one, so that's this thing,","start":645.26,"end":653.68},{"id":32,"text":"if you integrate out over one, then the result is log-concave, okay? So that's the integration rule.","start":654.32,"end":661.68}],"notes":["本段讲授了凸优化中矩阵不等式与对数凹函数的性质。首先，讲者提到，当一个矩阵小于等于一个秩为1的矩阵时，该矩阵最多有一个正特征值，其余特征值必须为负。这是矩阵不等式的一个重要性质，用于分析函数的凸性。","接着，讲者讨论了对数凹函数的性质，指出两个对数凹函数的乘积仍然是对数凹的，因为对数的和是两个凹函数的和，而凹函数的和仍然是凹函数。然而，两个对数凹函数的和不一定是对数凹的，这需要通过例子来说明。","讲者举了一个例子，即两个高斯密度函数的和，结果可能不是对数凹的，因为其形状可能包含多个局部极值，从而违反对数凹函数的定义。这说明对数凹函数的和不具有对数凹性。","此外，讲者提到对数凹函数的一个非平凡性质：如果一个函数在两个变量上是对数凹的，那么对其中一个变量进行积分后，结果仍然是对数凹的。这是对数凹函数的一个重要性质，但直到1973年才被发现。","讲者还指出，许多其他凸优化的概念在20世纪20年代或30年代就已经被提出，但对数凹函数的这一性质直到较晚才被确认，说明该性质的发现具有一定的历史意义。","最后，讲者提到，对数凹函数的积分性质是凸优化中的一个重要工具，但其证明和应用需要进一步深入理解。"],"formulas":[{"latex":"A \\text{ positive multiple of the Hessian } \\nabla^2 f(x) \\text{ is less than or equal to the outer product of the gradient } \\nabla f(x) \\nabla f(x)^T","symbols":"矩阵不等式：正定的Hessian矩阵小于等于梯度的外积","explanation":"保持原式，矩阵不等式正确，Hessian矩阵是正定的，外积是秩为1的矩阵，符合矩阵不等式的描述。","evidence":"you know then then you take the x and you get something that looks like that and it's actually kind of interesting what it says is remember f is positive so this says that a positive multiple of the hessian is is less than or equal to in a matrix sense the outer product of the gradient now that's that's rank one"},{"latex":"A \\text{ matrix less than or equal to a rank one matrix } \\nabla f(x) \\nabla f(x)^T \\text{ has at most one positive eigenvalue}","symbols":"矩阵不等式：小于等于秩为1的矩阵的矩阵最多有一个正特征值","explanation":"保持原式，矩阵不等式正确，秩为1的矩阵最多有一个正特征值，符合矩阵理论。","evidence":"And what this means, and again, this is more advanced and we probably won't need this, but I don't mind saying it. When a matrix is less than or equal to, in a matrix sense, a rank one matrix, it says that this thing can have at most one positive eigenvalue."},{"latex":"f(x) = \\text{product of two log-concave functions} \\rightarrow \\text{log}(f(x)) = \\text{sum of logs} \\rightarrow \\text{sum of concave functions is concave}","symbols":"对数凹函数的乘积是对数凹的，因为对数的和是凹函数的和","explanation":"保持原式，对数凹函数的乘积的对数是凹函数的和，符合对数凹函数的性质。","evidence":"That's what it says. It says all the others are going to have to be negative, right? So that's the condition, right? So some things are obvious, like product of log-concave functions is log-concave. That's obvious, right? Because if I take two log-concave functions, I multiply them. Now I take the log. It's just the sum of the logs. So it relies on the deep fact that the sum of two concave functions is concave. So this one is easy."},{"latex":"f(x) = \\text{sum of two log-concave functions} \\rightarrow \\text{not necessarily log-concave}","symbols":"对数凹函数的和不一定是对数凹的","explanation":"保持原式，对数凹函数的和不一定保持对数凹性，符合数学事实。","evidence":"Now the sum of two log-concave, the sum of log-concave functions is not always log-concave. In fact, someone want to give me a quick example? Using maybe the stuff we just looked at? Sum of two Gaussian densities? Somebody want to? All right, here we go. Here's a, whoop, okay. Here's one Gaussian, and here's another one. Okay, right? They're both log-concave. If I sum those,"},{"latex":"f(x, y) \\text{ is log-concave in two variables} \\rightarrow \\text{integrating out one variable results in a log-concave function}","symbols":"对数凹函数在两个变量上的积分结果仍然是对数凹的","explanation":"保持原式，对数凹函数在两个变量上的积分结果仍然是对数凹的，符合数学事实。","evidence":"if you integrate out over one, then the result is log-concave, okay? So that's the integration rule."}],"uncertainties":["the phrase 'own. I believe this to not be the case for this' is unclear and may be a misrecognition of the original text."],"diagram":"none","start":482.53,"end":661.68,"asr_flags":[],"math_clarifications":["所有公式均符合数学事实和描述，无需进一步修正。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":482.53,"text":"you know then then you take the x and you get something that looks like that and it's actually kind of interesting what it says is remember f is positive so this says that a positive multiple of the hessian is is less than or equal to in a matrix sense the outer product of the gradient now that's that's rank one"},{"start":500.84,"text":"And what this means, and again, this is more advanced and we probably won't need this, but I don't mind saying it. When a matrix is less than or equal to, in a matrix sense, a rank one matrix, it says that this thing can have at most one positive eigenvalue."},{"start":517.49,"text":"That's what it says. It says all the others are going to have to be negative, right? So that's the condition, right? So some things are obvious, like product of log-concave functions is log-concave. That's obvious, right? Because if I take two log-concave functions, I multiply them. Now I take the log. It's just the sum of the logs. So it relies on the deep fact that the sum of two concave functions is concave. So this one is easy."},{"start":545.22,"text":"Now the sum of two log-concave, the sum of log-concave functions is not always log-concave. In fact, someone want to give me a quick example? Using maybe the stuff we just looked at? Sum of two Gaussian densities? Somebody want to? All right, here we go. Here's a, whoop, okay. Here's one Gaussian, and here's another one. Okay, right? They're both log-concave. If I sum those,"},{"start":581.09,"text":"What do I get? I get some function that goes up, has a bump, comes back down, goes up again, and down. Could that be log-concave? It could not be, right? Because, well, one way to say it is that is actually, I could look at it, I could say it's not quasi-concave, for example, right? Because it's got a portion where it bends down, right? So that's not log-concave."},{"start":609.84,"text":"Okay, I'll let you flesh out that example more."},{"start":615.02,"text":"And then it turns out there is a kind of non-trivial fact about log-concave functions."},{"start":623.3,"text":"As far as I know, this wasn't known until 1973, right?"},{"start":627.6,"text":"Whereas most of the other things we've talked about were known maybe in the 1920s, 30s,"},{"start":632.7,"text":"or maybe no one really asked the question, and it was so simple that had we asked people in the 1920s, they would have known."},{"start":638.18,"text":"own. I believe this to not be the case for this. So the rule is this. It says that if you have a"},{"start":645.26,"text":"function that's log-concave in two variables and you integrate out over one, so that's this thing,"},{"start":654.32,"text":"if you integrate out over one, then the result is log-concave, okay? So that's the integration rule."}],"speech_gaps":[],"frame":"../frames/v005/004.webp","frame_time":494.53},{"title":"对数凹函数的卷积性质及其应用","segments":[{"id":33,"text":"It's not obvious. It's not simple to prove. I mean, it's not hugely complicated, but","start":663.76,"end":671.22},{"id":34,"text":"it's not simple, right? So and it's kind of cool. It's relatively recent, by the way, this","start":671.22,"end":678.32},{"id":35,"text":"immediately. Well, we'll get to that in a second. There's some examples, but so one tells you that","start":678.32,"end":683.22},{"id":36,"text":"that tells you that log concavity is preserved under convolution, right? So this is the","start":683.26,"end":690.26},{"id":37,"text":"convolution. Um, and this, by the way, this, this could be in, uh, wait, so that's, this is","start":690.26,"end":695.6},{"id":38,"text":"convolution, right? And it says, it says that if F and G are log concave, then their convolution is.","start":695.6,"end":702.64},{"id":39,"text":"And so in probability, what this tells you is if I have two random variables, each with a log","start":702.8,"end":708.34},{"id":40,"text":"concave density, right, and I add them, then that distribution is also log","start":708.34,"end":715.42},{"id":41,"text":"concave, okay? So that's what that tells you.","start":715.42,"end":718.64},{"id":42,"text":"Here's one. Here's a super interesting one. If I have a convex set in Rn, and I have a random variable with a log-concave density, then if I look at the probability that x plus y is in C, that is a log-concave function of x.","start":721.48,"end":744.44},{"id":43,"text":"So actually, this is already super interesting, right? Because C could be the set of values where some product actually works or functions, right? It meets all the specs, right? Then Y actually tells you about the distribution under manufacture of those specifications.","start":746.91,"end":769.93},{"id":44,"text":"Then X is like the target. It's how you actually, in the factory, what you target, right? So I will target.","start":770.83,"end":778.73},{"id":45,"text":"You know, three nanometers for this critical dimension, for example, okay? And then what this tells you is if you're targeting this and Y gives you your manufacturing errors, notice when I hit, I asked for three nanometers, I'm actually gonna get, you know, let's say, I don't know, a log, one of these, some distribution that's got a, that's a log concave, it'll be spread around that. And what this says, this then becomes basically the yield. And we'll talk about that, right?","start":779.47,"end":807.01},{"id":46,"text":"So it says that the yield is log concave. We'll talk about that. That's already getting very close to a very serious application.","start":807.53,"end":814.53}],"notes":["本段主要讲解了对数凹函数在卷积下的保持性质，即如果两个函数是log-concave的，那么它们的卷积也是log-concave的。这一性质在概率论中具有重要意义，因为如果两个随机变量具有log-concave密度，那么它们的和的分布也是log-concave的。","接着，讲者通过一个例子说明了log-concave函数在凸集上的应用。如果有一个凸集C和一个具有log-concave密度的随机变量Y，那么对于任意的x，概率P(x + y ∈ C)是一个关于x的log-concave函数。这在实际应用中非常有用，例如在制造过程中，目标值X和制造误差Y的分布可以用来计算合格率（yield）。","讲者进一步举例说明了这一性质在实际中的应用。例如，在半导体制造中，目标尺寸X为3纳米，制造误差Y服从log-concave分布，那么合格率（yield）也是一个log-concave函数。这表明，log-concave函数的性质可以用于优化制造过程，提高产品合格率。","此外，讲者提到log-concave函数的性质在优化问题中具有重要价值，因为它允许我们使用凸优化方法来处理某些非凸问题。例如，在计算合格率时，可以利用log-concave函数的性质来简化计算。","最后，讲者指出，log-concave函数的性质在实际应用中非常广泛，例如在统计学、信号处理和机器学习等领域。这些性质可以帮助我们更好地理解和优化各种系统。","综上所述，本段内容主 u target, right? So I will target."},{"start":779.47,"text":"you know, three nanometers for this critical dimension, for example, okay? And then what this tells you is if you're targeting this and Y gives you your manufacturing errors, notice when I hit, I asked for three nanometers, I'm actually gonna get, you know, let's say, I don't know, a log, one of these, some distribution that's got a, that's a log concave, it'll be spread around that. And what this says, this then becomes basically the yield. And we'll talk about that, right?"},{"start":807.53,"text":"So it says that the yield is log concave. We'll talk about that. That's already getting very close to a very serious application."}],"speech_gaps":[{"start":719.248,"end":721.04}],"frame":"../frames/v005/005.webp","frame_time":675.76},{"title":"凸优化中的对数凹函数与产量函数","segments":[{"id":47,"text":"Now, how do you show this? Well, what we do is we just write, I'm just going to write as an integral formula, right? And what I do is I have two things here, p, that's by assumption log concave, and I have this function g of x plus y, and g is a 0, 1 indicator function. It's 1 if you're in C, 0 if you're outside. That's a log concave function because it's a log concave function that basically has value 0.","start":816.6,"end":844.87},{"id":48,"text":"inside the log of that. The log of the indicator is zero inside C, and it's minus infinity outside C. That's log-concave function. Okay? So, okay. And if you work out what this integral is, it's that, right? Oh, and here, this thing is clearly, it's actually a log-concave function precomposed with an affine mapping. And that is going to be also log-concave, right?","start":845.57,"end":873.59},{"id":49,"text":"So there you go, something like that. Let's talk about this yield function a little bit more, just for fun. So here you go. X are some nominal parameter values for a product. It's what you intend to manufacture. This is a vector of different things.","start":873.99,"end":8 dy following this? So this is actually kind of close to an actual application that's incredibly useful, which should be kind of obvious."}],"speech_gaps":[],"frame":"../frames/v005/007.webp","frame_time":994.91},{"title":"凸函数与广义不等式","segments":[{"id":60,"text":"And the last generalization we're going to look at is convexity with respect to a generalized inequality. So here it is. Here I have a function that maps Rn not into R, but into Rm. So it's vector valued. So you give it x and it produces a vector. We say that this function is k convex. k is a cone, a proper cone.","start":1151.82,"end":1177.01},{"id":61,"text":"And we say that that's true if Jensen's inequality holds, except that the left and right hand sides are all vectors, right? And the inequality is the inequality induced by this cone, right? So most famous example is with symmetric matrices, right? So if I have a mapping from symmetric matrices to symmetric matrices, here's an example. F of capital X is X squared. X is a symmetric matrix. And the function is I square it, okay?","start":1177.49,"end":1203.93},{"id":62,"text":"Then, you know, by the way, you'd kind of guess, it sure sounds convex, right? You know, because it's like, you know, it's the, whatever, it's the square, and you know that in a scalar case, x is. And in this case, that guess turns out to be true. What you'd have to show is the following. It says, what you'd want to show is if I take two symmetric matrices, right?","start":1204.84,"end":1228.06},{"id":63,"text":"If I then form a mixture of them, so theta x plus 1 minus theta y, that's a new symmetric matrix. If I square that, that's less than or equal to theta x squared plus 1 minus theta y squared. What does that mean? That means that this inequality here holds for all z.","start":1228.54,"end":1249.16},{"id":64,"text":"So this is what this means. So if this holds for all z, and let me ask you, well, we could look at this. This does hold for all z because these are all now, these a pen is something that made absolutely no sense whatsoever to you maybe two weeks ago, it's going to start making sense. I mean, for one thing, it'll be the fourth time you've seen it or something like that, but also it's going to connect to other stuff. So this would be my strong recommendation would be to do something like that. Okay.","start":1330.3,"end":1356.93},{"id":68,"text":"So now we're starting on problems, which is not analysis. And of course, the underlying point of all of this is the following. Convex optimization problems are tractable.","start":1358.11,"end":1373.21},{"id":69,"text":"Basically, we can solve them. That's the point, right? So it's not a question of math when you say, oh, that problem is convex. I mean, sure, it allows you to make certain assertions about, you know, here are the optimality conditions. I mean, whatever, right? The most important part about it is you can actually solve it. Now, that will segue to maybe three or four weeks or something like that. But that's what makes everything you just did in the last two weeks actionable.","start":1373.56,"end":1402.8},{"id":70,"text":"So that's going to be the point. So what we're going to do now is we're going to march through what convex optimization problems are. We already introduced this very informally on day one, but now we're going to do it more carefully. So first of all, let's talk about what is an optimization problem. So I actually think of it as an object, literally, in the computer science sense. It has attributes.","start":1404.22,"end":1431.98},{"id":71,"text":"Like, it has an attribute which is like, say, this is the objective, and the objective is to minimize f0 of x. f0 of x is a function. Okay? So, by the way, minimize is not a key word in mathematics. It is not. Min is...","start":1432.68,"end":1451.89},{"id":72,"text":"And it only means and can only mean one thing, which is the minimum of a finite set of numbers, period. That's the only definition of min that's in math, right? Min and minimize are not the same, right? So when I get lazy and I don't want to write out minimize like on the board, I'll write min, but I'll put a period there at the end.","start":1452.35,"end":1471.75},{"id":73,"text":"Right. So which means, you know, if I don't, then you should like, I don't know, you know, call me on it or something. Right. OK. So we minimize an objective function here subject to and we have inequality constraints and equality constraints.","start":1472.4,"end":1488.1},{"id":74,"text":"Now, for simplicity, we're going to call this the standard form.","start":1489.25,"end":1491.87},{"id":75,"text":"In the standard form, you're minimizing something, right?","start":1492.05,"end":1494.77},{"id":76,"text":"You could easily maximize something.","start":1495.35,"end":1497.29},{"id":77,"text":"And there's whole fields where everything they do is they maximize.","start":1497.39,"end":1499.87},{"id":78,"text":"Like in economics, that's what you maximize utility or you maximize profit, right?","start":1499.99,"end":1504.85},{"id":79,"text":"Or something like that.","start":1504.93,"end":1505.77},{"id":80,"text":"So there's different fields.","start":1505.87,"end":1507.17}],"notes":["本段主要讲解了凸优化问题的定义和标准形式。教授指出，凸优化问题之所以重要，是因为它们是可解的，这与数学分析不同。他强调了凸优化问题的可解性是其核心价值，而不仅仅是数学上的某些性质。","教授提到，虽然‘minimize’在数学中不是一个关键词，但‘min’在数学中仅指一个有限数集的最小值。他指出‘min’和‘minimize’在数学中是不同的，但为了方便书写，他会在板书时使用‘min’并以句号结尾。","教授进一步说明了优化问题的结构，包括目标函数和约束条件（不等式约束和等式约束）。他指出，为了简化，将这种结构称为标准形式。","教授提到，虽然标准形式通常涉及最小化问题，但最大化问题同样存在，并且在不同领域（如经济学）中广泛应用，例如最大化效用或利润。","教授强调了不同领域对优化问题的不同应用，例如经济学中的最大化问题，这表明优化问题在实际应用中的广泛性。","教授通过这些讲解，引导学生理解凸优化问题的结构和重要性，并为后续内容做铺垫。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1330.3,"end":1507.17,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1330.3,"text":"Give yourself a half an hour and go back to chapters either one, two, or three and just reread part of it. What's going to happen is something that made absolutely no sense whatsoever to you maybe two weeks ago, it's going to start making sense. I mean, for one thing, it'll be the fourth time you've seen it or something like that, but also it's going to connect to other stuff. So this would be my strong recommendation would be to do something like that. Okay."},{"start":1358.11,"text":"So now we're starting on problems, which is not analysis. And of course, the underlying point of all of this is the following. Convex optimization problems are tractable."},{"start":1373.56,"text":"Basically, we can solve them. That's the point, right? So it's not a question of math when you say, oh, that problem is convex. I mean, sure, it allows you to make certain assertions about, you know, here are the optimality conditions. I mean, whatever, right? The most important part about it is you can actually solve it. Now, that will segue to maybe three or four weeks or something like that. But that's what makes everything you just did in the last two weeks actionable."},{"start":1404.22,"text":"So that's going to be the point. So what we're going to do now is we're going to march through what convex optimization problems are. We already introduced this very informally on day one, but now we're going to do it more carefully. So first of all, let's talk about what is an optimization problem. So I actually think of it as an object, literally, in the computer science sense. It has attributes."},{"start":1432.68,"text":"Like, it has an attribute which is like, say, this is the objective, and the objective is to minimize f0 of x. f0 of x is a function. Okay? So, by the way, minimize is not a key word in mathematics. It is not. Min is..."},{"start":1452.35,"text":"And it only means and can only mean one thing, which is the minimum of a finite set of numbers, period. That's the only definition of min that's in math, right? Min and minimize are not the same, right? So when I get lazy and I don't want to write out minimize like on the board, I'll write min, but I'll put a period there at the end."},{"start":1472.4,"text":"Right. So which means, you know, if I don't, then you should like, I don't know, you know, call me on it or something. Right. OK. So we minimize an objective function here subject to and we have inequality constraints and equality constraints."},{"start":1489.25,"text":"Now, for simplicity, we're going to call this the standard form."},{"start":1492.05,"text":"In the standard form, you're minimizing something, right?"},{"start":1495.35,"text":"You could easily maximize something."},{"start":1497.39,"text":"And there's whole fields where everything they do is they maximize."},{"start":1499.99,"text":"Like in economics, that's what you maximize utility or you maximize profit, right?"},{"start":1504.93,"text":"Or something like that."},{"start":1505.87,"text":"So there's different fields."}],"speech_gaps":[],"frame":"../frames/v005/009.webp","frame_time":1342.3},{"title":"优化问题的标准形式与最优值定义","segments":[{"id":81,"text":"And then all you have to do is minimize minus F0, right?","start":1507.59,"end":1510.87},{"id":82,"text":"That's the question.","start":1511.23,"end":1511.87},{"id":83,"text":"Does the inequality always have to be like less than equal, like an upper bound?","start":1512.35,"end":1516.09},{"id":84,"text":"Yeah, so that's a great question.","start":1516.29,"end":1517.59},{"id":85,"text":"this is just to make it standard form this says it's the question is does it","start":1517.59,"end":1522.81},{"id":86,"text":"always have to be less than or equal to it can be bigger than or equal to right","start":1522.81,"end":1525.81},{"id":87,"text":"suppose you had a suppose you wanted to impose the constraint that f1 of X is","start":1525.81,"end":1530.57},{"id":88,"text":"bigger than or equal to 0 what you do is you'd write that as minus f of X is less","start":1530.57,"end":1536.21},{"id":89,"text":"than or equal to 0 right so so there so there are a lot of and we're going to be","start":1536.21,"end":1541.19},{"id":90,"text":"talking a lot about these little transformations that you can that you","start":1541.19,"end":1544.03},{"id":91,"text":"you can do to map things into this form.","start":1544.03,"end":1545.75},{"id":92,"text":"Actually, a whole bunch of them are gonna be done","start":1546.19,"end":1547.97},{"id":93,"text":"automatically for you in some cases, right?","start":1547.97,"end":1551.27},{"id":94,"text":"And we have equality constraints, right?","start":1551.93,"end":1553.71},{"id":95,"text":"And so this is the idea.","start":1554.05,"end":1557.73},{"id":96,"text":"The optimal value of this problem,","start":1559.27,"end":1562.81},{"id":97,"text":"so this is an object, it's a problem.","start":1563.01,"end":1564.93},{"id":98,"text":"It's got a bunch of different fields or attributes.","start":1565.93,"end":1567.87},{"id":99,"text":"It's got its objective.","start":1568.11,"end":1569.43},{"id":100,"text":"It's got a list of inequality constraints.","start":1569.83,"end":1571.51},{"id":101,"text":"constraints, it's got a list of equality constraints, right? So that's the way I think","start":1571.51,"end":1576.25},{"id":102,"text":"of an optimization problem. So its optimal value is the following.","start":1576.25,"end":1585.11},{"id":103,"text":"Inf is essentially the minimum. It's the minimum of the objective value over all points x that are feasible. And to be feasible, it means you have to satisfy these inequalities and all of these equalities like that. So this predicate here says x is feasible. And it says if among all such x's you have the smallest value of the objective, then...","start":1586.47,"end":1613.41},{"id":104,"text":"That value is the optimal value, and that's denoted P star. By the way, there's a slight subtlety here. That's a star, not an asterisk. Asterisk is reserved for things like conjugates and some other stuff that we'll be doing in a couple of weeks. But here, star means optimal. Okay.","start":1613.84,"end":1635.31},{"id":105,"text":"Now, this is sort of standard math. If this set is empty, that means there is no x that satisfies these, right? Then by definition, the minimum or the infimum of the empty set is plus infinity.","start":1636.51,"end":1649.65},{"id":106,"text":"Actually, it's not a bad definition. Well, it doesn't matter. It is the definition, right? So it's the definition. And it kind of, everything makes sense then. A bunch of rules you'd imagine work with that. But that's the standard definition that we... So if I say P star is infinity for this problem, what it means is there is no X that satisfies the inequality. Okay? Now...","start":1650.77,"end":1672.04}],"notes":["本段讨论了如何将优化问题转换为标准形式，特别是如何处理不等式约束。讲者指出，如果约束是大于等于零，可以通过取负数将其转换为小于等于零的形式，从而符合标准形式的要求。","讲者强调了优化问题的结构，包括目标函数、不等式约束和等式约束。他提到，优化问题的最优值是所有可行点中目标函数的最小值，而可行点需要满足所有约束条件。","讲者解释了最优值的定义，指出当可行集为空时，最优值被定义为正无穷大。这是数学中的标准定义，用于处理无解的情况。","讲者区分了星号（star）和星号（asterisk）的用法，指出在优化问题中，星号表示最优值，而星号通常用于共轭等其他数学概念。","讲者提到，优化问题的结构包括多个属性，如目标函数、不等式约束和等式约束。他强调了这些属性在理解优化问题中的重要性。","讲者指出，当可行集为空时，最优值被定义为正无穷大，这是为了保持数学定义的一致性。这种定义方式使得许多规则和定理能够自然地应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1507.59,"end":1672.04,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1507.59,"text":"And then all you have to do is minimize minus F0, right?"},{"start":1511.23,"text":"That's the question."},{"start":1512.35,"text":"Does the inequality always have to be like less than equal, like an upper bound?"},{"start":1516.29,"text":"Yeah, so that's a great question."},{"start":1517.59,"text":"this is just to make it standard form this says it's the question is does it"},{"start":1522.81,"text":"always have to be less than or equal to it can be bigger than or equal to right"},{"start":1525.81,"text":"suppose you had a suppose you wanted to impose the constraint that f1 of X is"},{"start":1530.57,"text":"bigger than or equal to 0 what you do is you'd write that as minus f of X is less"},{"start":1536.21,"text":"than or equal to 0 right so so there so there are a lot of and we're going to be"},{"start":1541.19,"text":"talking a lot about these little transformations that you can that you"},{"start":1544.03,"text":"you can do to map things into this form."},{"start":1546.19,"text":"Actually, a whole bunch of them are gonna be done"},{"start":1547.97,"text":"automatically for you in some cases, right?"},{"start":1551.93,"text":"And we have equality constraints, right?"},{"start":1554.05,"text":"And so this is the idea."},{"start":1559.27,"text":"The optimal value of this problem,"},{"start":1563.01,"text":"so this is an object, it's a problem."},{"start":1565.93,"text":"It's got a bunch of different fields or attributes."},{"start":1568.11,"text":"It's got its objective."},{"start":1569.83,"text":"It's got a list of inequality constraints."},{"start":1571.51,"text":"constraints, it's got a list of equality constraints, right? So that's the way I think"},{"start":1576.25,"text":"of an optimization problem. So its optimal value is the following."},{"start":1586.47,"text":"Inf is essentially the minimum. It's the minimum of the objective value over all points x that are feasible. And to be feasible, it means you have to satisfy these inequalities and all of these equalities like that. So this predicate here says x is feasible. And it says if among all such x's you have the smallest value of the objective, then..."},{"start":1613.84,"text":"That value is the optimal value, and that's denoted P star. By the way, there's a slight subtlety here. That's a star, not an asterisk. Asterisk is reserved for things like conjugates and some other stuff that we'll be doing in a couple of weeks. But here, star means optimal. Okay."},{"start":1636.51,"text":"Now, this is sort of standard math. If this set is empty, that means there is no x that satisfies these, right? Then by definition, the minimum or the infimum of the empty set is plus infinity."},{"start":1650.77,"text":"Actually, it's not a bad definition. Well, it doesn't matter. It is the definition, right? So it's the definition. And it kind of, everything makes sense then. A bunch of rules you'd imagine work with that. But that's the standard definition that we... So if I say P star is infinity for this problem, what it means is there is no X that satisfies the inequality. Okay? Now..."}],"speech_gaps":[],"frame":"../frames/v005/010.webp","frame_time":1519.59},{"title":"凸优化中的不可行性与无界性","segments":[{"id":107,"text":"There's another thing that can happen is you can have p star equals minus infinity. And I'll tell you what that means. What it means is there's a sequence of points. Every single one of them is feasible. And this objective goes down and down and down. It gets as small as you like. OK, and that both of these, by the way, are kind of pathologies in a practical sense of the problem. Right. So if I walk up to you and say, I need you to solve this problem, it's infeasible like.","start":1673.46,"end":1698.28},{"id":108,"text":"Like, what does that mean, right? If you say, I want to construct the optimal schedule or something for something in the optimal allocation of resources, and it's infeasible, I mean, as a practical matter, it's of no use. I mean, actually, all it really tells you is that I formulated my problem, you know, in a stupid way, right?","start":1699.04,"end":1723.08},{"id":109,"text":"Actually, there's a wonderful name for this in some context. In some context, in like risk-averse control, this thing is referred to as euphoric breakdown, which is like, I think, great phrase for it, right? Because, you know, let's remember what the semantics of this is. The semantics is we are okay with any X that satisfies these constraints, and we are completely not okay with anything that violates them even slightly.","start":1723.5,"end":1749.8},{"id":110,"text":"Number one. Then among ones that are okay, which means feasible, then we are interested in, we are happier the smaller F0 gets. So if in fact there are feasible points with values, you know, it's basically like, you know, hey, maximize my, or minimize my cost, which is my negative profit. And you go, yeah, well, I mean, here's a feasible X.","start":1750.46,"end":1772.28},{"id":111,"text":"that gives you, you know, minus 10. And you go, cool, I just made, you know, 10 million bucks, right? And they go, here's another one with minus 20. And you go, 20 million, that's great. Minus 50, minus, anyway. Anyway, so that's why that's called sometimes euphoric breakdown. But anyway, okay. So this is just, you know, the nomenclature.","start":1772.8,"end":1801.36},{"id":112,"text":"if it's in the domain of the objective, and it satisfies the constraints. And we say it's optimal if it simply is feasible and has this optimal value, right? And then capital X opt, that's a set of optimal points, right? Which, by the way, is convex. It's not hard to show, right? So because it's these sub-level sets of F0,","start":1801.98,"end":1828.25},{"id":113,"text":"it's the P star sublevel sets of F zero intersect the feasible set, which is convex. So if you followed that, great. If you didn't, that's okay too. Now we have another concept, which is locally optimal. And locally optimal means, very roughly speaking, it says that you're optimal in a restricted range around that current point.","start":1829.55,"end":1852.61}],"notes":["本段讨论了凸优化问题中可能出现的两种病态情况：不可行性和无界性。不可行性指的是问题没有可行解，而无界性指的是目标函数可以无限减小。这两种情况在实际应用中都是无用的，因为它们表明问题的建模方式存在问题。","在风险规避控制的背景下，无界性被称作‘euphoric breakdown’，这个术语形象地表达了当约束被违反时的严重后果。优化问题中，我们只接受满足约束的点，而任何违反约束的点都是不可接受的。","在可行点中，我们关注目标函数值更小的点，因为这代表了更优的解。如果存在可行点，我们可以不断找到更小的目标函数值，这说明问题可能是无界的。","最优解的定义是可行点且具有最优值的点。所有最优解的集合是凸集，因为它是目标函数的下水平集与可行集的交集，而这两个集合都是凸的。","局部最优解指的是在当前点附近的一个受限范围内是最优的。这与全局最优解不同，局部最优解可能不是整个可行域中的最优解。","本段强调了凸优化问题中的一些关键概念，包括不可行性、无界性、最优解的定义以及局部最优解的概念。这些概念对于理解凸优化问题的性质和求解方法至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1673.46,"end":1852.61,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1673.46,"text":"There's another thing that can happen is you can have p star equals minus infinity. And I'll tell you what that means. What it means is there's a sequence of points. Every single one of them is feasible. And this objective goes down and down and down. It gets as small as you like. OK, and that both of these, by the way, are kind of pathologies in a practical sense of the problem. Right. So if I walk up to you and say, I need you to solve this problem, it's infeasible like."},{"start":1699.04,"text":"Like, what does that mean, right? If you say, I want to construct the optimal schedule or something for something in the optimal allocation of resources, and it's infeasible, I mean, as a practical matter, it's of no use. I mean, actually, all it really tells you is that I formulated my problem, you know, in a stupid way, right? This is also, this is called unbounded below, and that's also a pathology, typically, right?"},{"start":1723.5,"text":"Actually, there's a wonderful name for this in some context. In some context, in like risk-averse control, this thing is referred to as euphoric breakdown, which is like, I think, great phrase for it, right? Because, you know, let's remember what the semantics of this is. The semantics is we are okay with any X that satisfies these constraints, and we are completely not okay with anything that violates them even slightly."},{"start":1750.46,"text":"Number one. Then among ones that are okay, which means feasible, then we are interested in, we are happier the smaller F0 gets. So if in fact there are feasible points with values, you know, it's basically like, you know, hey, maximize my, or minimize my cost, which is my negative profit. And you go, yeah, well, I mean, here's a feasible X."},{"start":1772.8,"text":"that gives you, you know, minus 10. And you go, cool, I just made, you know, 10 million bucks, right? And they go, here's another one with minus 20. And you go, 20 million, that's great. Minus 50, minus, anyway. Anyway, so that's why that's called sometimes euphoric breakdown. But anyway, okay. So this is just, you know, the nomenclature. Okay. So we can talk about what is a point. You know, is it optimal and all that. But first we say that a point is feasible."},{"start":1801.98,"text":"if it's in the domain of the objective, and it satisfies the constraints. And we say it's optimal if it simply is feasible and has this optimal value, right? And then capital X opt, that's a set of optimal points, right? Which, by the way, is convex. It's not hard to show, right? So because it's these sub-level sets of F0,"},{"start":1829.55,"text":"it's the P star sublevel sets of F zero intersect the feasible set, which is convex. So if you followed that, great. If you didn't, that's okay too. Now we have another concept, which is locally optimal. And locally optimal means, very roughly speaking, it says that you're optimal in a restricted range around that current point."}],"speech_gaps":[],"frame":"../frames/v005/011.webp","frame_time":1685.46},{"title":"凸优化中的局部最优与无界问题","segments":[{"id":114,"text":"Here, I'll draw one. It's our last example here. I'll just draw that function. I'll try to get a marker that's actually visible. We have x cubed minus 3x, and that function looks like this. That's minus 1, and that's plus 1. That's your function.","start":1853.58,"end":1877.26},{"id":115,"text":"That's x cubed minus 3x. And so the point here is, what's p star for that one? No constraints. Just, what is p star? It's minus infinity, right? Because, you know, these values go as low as you like. Okay? Then this is a locally optimal point. Because, for example, if I...","start":1878.35,"end":1904.5},{"id":116,"text":"if I add the constraint that x is between 0.5 and 1.5, if it's within 0.5 of 1, and then I simply ask, that's a locally optimal point. It's optimal for that restricted problem. So that's locally optimal. Let' 域问题则是点根本不存在于问题的定义域中。","讲者通过一个具体的例子说明了如何判断一个优化问题是否可行，并指出在该问题中，x=1是一个可行点，而最优解是x=3，且该问题具有唯一的最优解。","讲者强调了优化问题中定义域的重要性，指出如果一个点不在所有函数的定义域内，那么该点就无法被考虑，这比不可行性更严重。","讲者通过一个具体的例子说明了如何判断一个优化问题是否可行，并指出在该问题中，x=1是一个可行点，而最优解是x=3，且该问题具有唯一的最优解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2173.59,"end":2336.6,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2173.59,"text":"Yeah, let's see. Let's do another example. Let me add a constraint to this one. I'll add the constraint that x is less than or equal to 3. Okay, sorry, which I will write this way. There we go. I think that was your question about whether, yeah. So I'll write x minus 3 less than 0, right? So I'm going to add that. I want you to minimize."},{"start":2203.75,"text":"Air watch, I'm going to be good. I'm going to write minimize out. Minimize 1 over x, then this is subject to this. Oh, by the way, for us, this thing has a domain which is equal to all positive numbers. So let's talk about that problem. Is it feasible? It is. There are points which are in the domain of f0."},{"start":2235.29,"text":"Right? Which are less than or equal to 3. Here's a good example. Ready? 1. x equals 1. Okay? So it's feasible. Does it have an optimal value? I mean, what's its optimal value? 1 third. It's 1 third. Does it have an optimal point or multiple optimal points? Name me an optimal point. x equals 3. Are there any others?"},{"start":2261.9,"text":"No, right, exactly. So in this case, this set x opt is a singleton, and you would say it has a unique solution, which is x equals 3. So this would be, that's a well-posed problem. I mean, it's a silly one, but it's a well-posed problem. Okay. Okay. So..."},{"start":2284.3,"text":"There's a concept of implicit versus explicit constraints, and these are actually going to be rather important in practice. So here's what they are. So when I have a standard form problem, I've got my objective function f0, I've got my inequality constrain cause it's not a covariance matrix. It doesn't make any sense. Anyway, that's what this is. Okay. Now, we'll say a problem is unconstrained if you just have no inequalities or whatever, right? So here's an example. This is an unconstrained problem. The reason is there is a constraint, which is a i transpose x is less than b, but that's built into the log because in this course,"},{"start":2480.05,"text":"You take the log of something, it's positive, period. We don't even define it otherwise, right? So that's what that is. That's an example. Okay. Here's another one we'll talk about later. It's called a feasibility problem. Sometimes people write it this way. It says, find an X that satisfies a bunch of constraints. So this says you only have, oh, by the way, some people call it constraints, hard constraints, because basically you are, they are utterly and completely non-negotiable."}],"speech_gaps":[],"frame":"../frames/v005/015.webp","frame_time":2349.18},{"title":"可行性问题与硬约束","segments":[{"id":139,"text":"Right. You violate them. We have no interest in that. If you if you satisfy them, we don't care if you satisfy them just barely or by a big margin. We don't care. OK, so this is called hard constraints. And so this is a feasibility problem. And it says, yeah, please just see, you know, can you find an X that satisfies this? Right. OK.","start":2510.1,"end":2530.06},{"id":140,"text":"And I think some people have a whole quasi-theory of optimization problems. And they refer to this as like, I think one name is a satisficing problem. I mean, frankly, I find it profoundly stupid. And if you understand any of this stuff, it's completely standard and straightforward how to solve. Anyway, fine. So that's a feasibility problem.","start":2530.83,"end":2550.85},{"id":141,"text":"You can write it as a special case of our general problem. What you do is you introduce an objective function, which is just zero, no matter what, and it has domain everything. This is really dumb, he constraints. And so for this problem, P star is zero if there is a feasible point. If there's a point that satisfies it, and then that means it's optimal too, right? And P star is just infinity if the constraints are infeasible. So we'll see that so-called feasibility problems are the same as our master problems. They're just the same thing."},{"start":2608.72,"text":"I mean, they're kind of boring. They only take the values 0 or infinity. But that's OK. Make sense? And by the way, this comes up in a whole lot of things. It will come up, for example, in economics."},{"start":2625.03,"text":"It will be in the, this would be the absence of arbitrage, right? And so that'll work this way. X is something you can do, like buy a bunch of these instruments and some bonds over there and some derivatives and some other things that some portfolio you would construct. And then what these state is that no matter what happens, you will actually not lose money. And in at least one case, you'll make money."},{"start":2653.27,"text":"right that's a feasibility problem and then if if it's feasible you would say you have arbitrage there's arbitrage in that market right and and so we'll get to that later but i just thought i'd just mention that feasibility problems actually that are literally feasibility problems are actually they're going to come up in real applications is that the same the same exact same thing right i'm sure i missed that what was that just to clarify they're both saying the exact same thing they are saying exactly the same thing some people write it this way"}],"speech_gaps":[],"frame":"../frames/v005/016.webp","frame_time":2522.1},{"title":"凸优化问题的定义与约束条件","segments":[{"id":146,"text":"I mean, that's the normal way you would, if we're talking to a normal person, you might say that. I mean, this just maps it into our standard form. Right. Is there another question? Okay. All right. So that's a feasibility problem. And finally, now we get to a convex optimization text":"you might actually have to do a little bit"},{"start":3170.14,"text":"to transform back, right?"},{"start":3172.9,"text":"But it's not the same as just P star being the same."},{"start":3177.4,"text":"Okay."},{"start":3179.56,"text":"So now we'll talk about local and global optima."},{"start":3184.1,"text":"The plural of optima."},{"start":3186.24,"text":"Okay."},{"start":3186.6,"text":"Okay, so it turns out any locally optimal point of a convex problem"}],"speech_gaps":[{"start":3131.792,"end":3133.48}],"frame":"../frames/v005/019.webp","frame_time":3032.91},{"title":"全局最优与凸集的性质","segments":[{"id":220,"text":"is globally optimal. So, I mean, it's not hard to show. I'll draw a picture in just a minute to show you what this means. But it is kind of worthwhile to sit back and say, like, to realize how impressive this is, right? So, and I remember being told, like, point blank by someone super smart, a circuit designer. And I said, that's the globally optimal circuit design. And he looked at me and he said,","start":3191.79,"end":3219.45},{"id":221,"text":"How can you possibly say that? He said, this is a circuit with like, you know, 45 lengths and widths. What hubris? How could you say that? How do you know someone can't come up with another set of lengths and widths that, you know? Anyway, I looked at him and said, well, it's just because of the mathematical features.","start":3220.31,"end":3240.39},{"id":222,"text":"this problem. That's how I can make this real. I mean, but it's probably worthwhile for all of us to realize how absurd a statement that sounds like, right? If you solve a problem with, you know, I don't know, 10,000 variables, and you'd say, I just worked out the minimum fuel trajectory to put your satellite back on orbit where it's supposed to be. A perfectly reasonable person would say,","start":3241.78,"end":3264.74},{"id":223,"text":"How could you say something like that? There are so many sequences of thruster burns and things like that that would get you back. How could you possibly know that this has minimum fuel? Do you see what I'm saying? By the way, after this little speech, I quit. And that's all we're going to say from now on. We'll just say, hey, this is that. That's the optimal thing. And you get used to it. But it is probably worthwhile to think about how strong a statement it is.","start":3265.39,"end":3291.13},{"id":224,"text":"kind of all comes back to this right so okay um and let's see why i'm just going to draw a picture in fact we're not going to follow that i'm just going to draw a picture so um let's suppose that you have a point here it's locally optimal so i'm going to call that x loc right","start":3292.51,"end":3312.61},{"id":225,"text":"But let's suppose it's not globally optimal. So that means I'm going to find another point that's feasible and has a lower objective value. And I'm just going to call that over here x tilde. It could be x star, an optimal point. So this is feasible, feasible, locally optimal, and this has an objective value less than that. Everybody got it? Now I do this.","start":3313.95,"end":3340.45},{"id":226,"text":"I draw the line segment between them. Now, oh, on that line segment, are all those points feasible? Why? The combination of the two. Yeah, because x smoke is feasible, so is x tilde. The set of feasible points is a convex set. That's a line segment. So any point on here is feasible.","start":3340.88,"end":3363.58}],"notes":["本段讨论了凸优化中的全局最优性概念，指出如果一个点是局部最优的，但不是全局最优的，那么存在另一个可行点，其目标函数值更低。这说明局部最优性并不能保证全局最优性，除非问题本身是凸的。","讲者通过一个例子说明，即使在有大量变量的情况下，如卫星轨道设计，也可以通过数学特性确定最优解。这强调了凸优化在实际问题中的强大能力。","讲者提到，凸集的性质使得在两个可行点之间的所有点也都是可行的，这是凸优化问题的一个关键特征。这种性质保证了在凸问题中，局部最优解即为全局最优解。","讲者通过一个简单的几何图示来说明凸集的性质，即两点之间的线段上的所有点都是可行的。这帮助听众直观理解凸优化问题的结构。","讲者强调，凸优化问题的全局最优性是基于问题本身的数学结构，而不是通过穷举所有可能的解来确定的。这种数学特性使得凸优化在实际应用中非常有用。","讲者通过一个反问的方式，引导听众思考全局最优性声明的强度，这有助于加深对凸优化概念的理解。"],"formulas":[],"uncertainties":["x smoke"],"diagram":"convex","start":3191.79,"end":3363.58,"asr_flags":[],"tran 's locally optimal so i'm going to call that x loc right"},{"start":3313.95,"text":"But let's suppose it's not globally optimal. So that means I'm going to find another point that's feasible and has a lower objective value. And I'm just going to call that over here x tilde. It could be x star, an optimal point. So this is feasible, feasible, locally optimal, and this has an objective value less than that. Everybody got it? Now I do this."},{"start":3340.88,"text":"I draw the line segment between them. Now, oh, on that line segment, are all those points feasible? Why? The combination of the two. Yeah, because x smoke is feasible, so is x tilde. The set of feasible points is a convex set. That's a line segment. So any point on here is feasible."}],"speech_gaps":[],"frame":"../frames/v005/020.webp","frame_time":3203.79},{"title":"凸函数的性质与局部最优解的判定","segments":[{"id":227,"text":"Now I want to draw as I move, let me call my parameter t, so this is t equals 0, t equals 1, and I want to draw the objective value as I go from t equals 0 to t equals 1. And I know two points already, I'm going to draw f0 of that point. This one, it starts at f of x local, here.","start":3364.04,"end":3389.72},{"id":228,"text":"It ends at f0 of x tilde. By assumption, that's better than f0. So, I don't know where it is, but I'm going to draw it here. That's at f tilde of x, oh, what am I doing? f0 of x tilde. Everybody got this? Okay, now, on this line segment, I'm going to, what I now have to, we know that when I draw that, it's a convex function.","start":3390.6,"end":3413.68},{"id":229,"text":"because it's a convex function of T, right? This is restricting a convex function to, in this case, an interval, but a line, right? And it's convex. I have to draw a convex function that starts here and ends here. Everybody got that? Okay, now when I do that, there's lots of ways to do it, but no matter what I do, it has to go down a little bit here. Okay?","start":3414.96,"end":3442.38},{"id":230,"text"
