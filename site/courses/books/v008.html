technically it's true. So it's an extreme point of view, but it's not a bad one."}],"speech_gaps":[],"frame":"../frames/v008/010.webp","frame_time":1528.27},{"title":"凸优化中的非凸问题与几何解释","segments":[{"id":104,"text":"I can't think of any problem in any applied mathematics field you can actually globally solve where somehow secretly behind the scenes convexity is not lurking, right? Maybe it's one of these things. Anyway, so it's just good to know. The two quadratics thing, that's a very good thing to know. Very few people know it. It is rediscovered approximately every 10 years in each of like 10 different fields. So as we speak.","zh":"我想不到任何实际应用数学领域中，你能真正全局求解的问题，而这些问题背后却隐藏着凸性，对吧？也许这就是其中一种情况。不管怎样，知道这一点是好的。两个二次型的问题，这是一个非常重要的知识点。很少有人知道这一点。大约每十年，每个像十个不同的领域都会重新发现它。所以，我们现在说的也是这样。","start":1686.38,"end":1712.64},{"id":105,"text":"Someone is figuring out that they can solve this problem, writing a hideous paper with terrible notation that's 25 pages, and think that in their field, they just found some deep thing. And it just keeps happening. There's even a paper written on the rediscovery of this fact.","zh":"有人正在试图解决这个问题，写了一篇糟糕的论文，符号也很差，有25页，他们认为在自己的领域里，他们发现了一个深刻的东西。而这种情况一直在发生。甚至有一篇论文专门讨论了这个事实的重新发现。","start":1713.11,"end":1730.25},{"id":106,"text":"But it has a history of it. So, I mean, it's actually, but it is a really good thing to know. And it is not impossible that you will bump into it someday. There are also even weird, sick, sick, sick things that also have zero duality gap. And they come from like weird, deep things in math. Like there's one where you have, you know, instead of a quadratic, you could have like a quartic in six variables over the complex field.","zh":"但这种情况是有历史的。我的意思是，它确实是一个非常重要的知识点。而且你有可能某一天会遇到它。还有一些奇怪、恶心、恶心的东西，它们也有零对偶间隙。这些来自数学中一些奇怪而深刻的内容。比如，你不用二次型，而是可以用复数域上的六变量四次型。","start":1731.18,"end":1757.14},{"id":107,"text":"that would actually have zero duality gap. And the reason would go back to some very deep thing about whatever geometry and stuff like that. It's algebraic geometry, and you're like, okay, fine. So there are isolated cases where non-convex problems have zero gap. Okay, that was all weird. Not only can you forget that, I'd even kind of suggest forgetting what I just said, just because it's just weird.","zh":"这种情况下也会有零对偶间隙。而原因会追溯到某种关于几何的非常深刻的东西。这是代数几何，你可能会想，好吧。因此，有一些孤立的情况，非凸问题也有零间隙。好的，刚才说的都是些奇怪的东西。不仅你可以忘记这些，我甚至建议你忘记我刚才说的，因为这太奇怪了。","start":1758.41,"end":1786.84},{"id":108,"text":"do a geometric interpretation. And what we're going to do is we're going to solve a problem where you minimize f0 of x subject to f1 of x less than 0. This is a non-convex problem. And we're just going to, this is a way to visualize what, you know, p star and d star are and all that kind of stuff. Okay, so what g is, so g is going to be the set. Remember, x could be in dimension 100, doesn't matter. But g is the set of pairs of constraint function and objective.","zh":"做一个几何解释。我们将解决一个最小化 $ f_0(x) $，在 $ f_1(x) \u003c 0 $ 的约束下。这是一个非凸问题。我们将通过这种方式来可视化 $ p^* $ 和 $ d^* $ 以及类似的东西。好的，那么 $ g $ 是什么？$ g $ 将是集合。记住，$ x $ 可以是100维的，这没关系。但 $ g $ 是约束函数和目标函数的对的集合。","start":1787.18,"end":1815.98},{"id":109,"text":"Right? So that's in a plane. We can plot that, and that's what we have here. So these are, if you imagine going over all possible x's, you get this blob, which is g, right? And then let's talk about that. Well, this axis is f1, which is your constraint function. And basically the semantics is...","zh":"对吧？所以在一个平面上。我们可以绘制出来，这就是我们现在看到的。所以，如果你想象遍历所有可能的x值，你会得到这个blob，也就是g，对吧？然后我们来谈谈这个。好吧，这个轴是f1，也就是你的约束函数。基本上其含义是...","start":1816.72,"end":1838.94},{"id":110,"text":"Everything to the left is acceptable, and everything to the right is completely unacceptable. So all of these, the x's corresponding to all of this, completely unacceptable. These are cool. Okay? So that's what the constraint says. It says ignore the right-hand side. Or, sorry, you're not allowed to look at the right-hand side. I mean, you can look at it, but they are not candidates. Okay? Now, the vertical axis...","zh":"所有在左边的都是可以接受的，而所有在右边的则是完全不可接受的。所以所有这些对应的x值，都是完全不可接受的。这些很酷。好吗？这就是约束的含义。它说忽略右边的。或者，抱歉，你不能查看右边的。我的意思是，你可以看，但它们不是候选。好吗？现在，垂直轴...","start":1839.68,"end":1864.23}],"notes":["本段讨论了凸优化中非凸问题的特殊情况，指出某些非凸问题可能具有零对偶间隙。这些情况虽然罕见，但确实存在，例如在代数几何中，某些高次多项式在复数域上可能具有零对偶间隙。这表明非凸问题在某些特定条件下也可能具有良好的对偶性质。","讲者提到，这些非凸问题的零对偶间隙现象在数学中具有深刻的基础，例如代数几何中的某些理论。这表明，虽然凸性通常与良好的对偶性质相关，但非凸问题在某些特殊情况下也可能满足这一性质。","接下来，讲者转向几何解释，介绍了一个非凸优化问题的可视化方法。该问题的目标是最小化一个函数，同时满足一个非凸约束。通过将约束函数和目标函数的组合绘制在平面上，可以直观地理解原问题和对偶问题的解。","讲者强调，这种几何解释有助于理解原问题（p*）和对偶问题（d*）之间的关系。通过将所有可能的x值映射到一个二维平面上，可以形成一个“blob”形状的集合g，其中每个点代表一个约束函数和目标函数的组合。","讲者进一步解释了约束函数的几何意义，指出在约束函数的左侧是可接受的区域，而右侧是完全不可接受的区域。这表明，约束条件限制了可行解的范围，而目标函数则决定了最优解的位置。","最后，讲者提到，虽然这些几何解释有助于理解优化问题的结构，但某些概念（如零对偶间隙的非凸问题）可能过于复杂，建议学习者暂时忽略，专注于更基础的凸优化内容。"],"formulas":[],"uncertainties":["quartic in six variables over the complex field"],"diagram":"none","start":1686.38,"end":1864.23,"asr_flags":[],"math_clarifications":["公式2中的对偶问题最优值 d^* 的定义不正确，应为最大化拉格朗日对偶函数，而不是最大化 inf_x f_0(x)。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1686.38,"text":"I can't think of any problem in any applied mathematics field you can actually globally solve where somehow secretly behind the scenes convexity is not lurking, right? Maybe it's one of these things. Anyway, so it's just good to know. The two quadratics thing, that's a very good thing to know. Very few people know it. It is rediscovered approximately every 10 years in each of like 10 different fields. So as we speak."},{"start":1713.11,"text":"Someone is figuring out that they can solve this problem, writing a hideous paper with terrible notation that's 25 pages, and think that in their field, they just found some deep thing. And it just keeps happening. There's even a paper written on the rediscovery of this fact."},{"start":1731.18,"text":"But it has a history of it. So, I mean, it's actually, but it is a really good thing to know. And it is not impossible that you will bump into it someday. There are also even weird, sick, sick, sick things that also have zero duality gap. And they come from like weird, deep things in math. Like there's one where you have, you know, instead of a quadratic, you could have like a quartic in six variables over the complex field."},{"start":1758.41,"text":"that would actually have zero duality gap. And the reason would go back to some very deep thing about whatever geometry and stuff like that. It's algebraic geometry, and you're like, okay, fine. So there are isolated cases where non-convex problems have zero gap. Okay, that was all weird. Not only can you forget that, I'd even kind of suggest forgetting what I just said, just because it's just weird. Okay, so now we're going to..."},{"start":1787.18,"text":"do a geometric interpretation. And what we're going to do is we're going to solve a problem where you minimize f0 of x subject to f1 of x less than 0. This is a non-convex problem. And we're just going to, this is a way to visualize what, you know, p star and d star are and all that kind of stuff. Okay, so what g is, so g is going to be the set. Remember, x could be in dimension 100, doesn't matter. But g is the set of pairs of constraint function and objective."},{"start":1816.72,"text":"Right? So that's in a plane. We can plot that, and that's what we have here. So these are, if you imagine going over all possible x's, you get this blob, which is g, right? And then let's talk about that. Well, this axis is f1, which is your constraint function. And basically the semantics is..."},{"start":1839.68,"text":"Everything to the left is acceptable, and everything to the right is completely unacceptable. So all of these, the x's corresponding to all of this, completely unacceptable. These are cool. Okay? So that's what the constraint says. It says ignore the right-hand side. Or, sorry, you're not allowed to look at the right-hand side. I mean, you can look at it, but they are not candidates. Okay? Now, the vertical axis..."}],"speech_gaps":[],"frame":"../frames/v008/011.webp","frame_time":1698.38},{"title":"凸优化中的对偶函数与拉格朗日函数","segments":[{"id":111,"text":"It is actually the objective, and the semantics of the objective is extremely simple: the smaller it is, the better. And so graphically, now I can tell you precisely what to do. It says when you see one of these blobs, you ignore everything on the right, and you can attach a comment to it saying they're infeasible. Right, so you can only focus on this thing, this part, and then there, your goal is to find the thing that is lowest, as the lowest potential energy, let's say, right, and that would be.","zh":"它实际上就是目标函数，目标函数的语义非常简单：它的值越小越好。因此，从图形上来说，我现在可以告诉你该怎么做。当你看到其中一个 blobs（团块）时，你可以忽略右边的所有内容，并可以添加一个注释说明它们是不可行的。对吧，所以你只能专注于这个部分，然后在那里，你的目标是找到最低的那个，比如说最低的势能，对吧，那就是。","start":1864.63,"end":1892.24},{"id":112,"text":"This thing here, right. Everyone got that? And so if we go over here, we'll plot p star on this axis, and that's p star. Everybody makes sense, right? So that's that's the picture. Okay, now.","zh":"这里的东西，对吧。大家明白了吗？所以如果我们在这里，我们会在这个轴上绘制 p 星（p*），这就是 p 星。大家都能理解，对吧？这就是这个图像。好的，现在。","start":1892.68,"end":1905.36},{"id":113,"text":"Now let's look at the dual function, which is actually kind of interesting. So let's look at the Lagrangian, by the way, is a function. Of course, it's a function of x, which has dimension 100, which I just made up. But the point is, the Lagrangian only depends on two numbers, which is f1 of x and f0 of x. And in fact, it's silly. It's just f0 of x plus lambda f1 of x.","zh":"现在让我们看看对偶函数，这其实挺有趣的。顺便说一下，拉格朗日函数实际上是一个函数。当然，它是关于 x 的函数，x 的维度是 100，我随便编的。但关键是，拉格朗日函数只依赖于两个数值，即 f1(x) 和 f0(x)。事实上，这很傻，它只是 f0(x) 加上 lambda 乘以 f1(x)。","start":1906.28,"end":1931.08},{"id":114,"text":"Okay, that's the Lagrangian. So I can plot the level curves of the Lagrangian, and they look like this. These are the level curves of the Lagrangian here. And I think the slope is, let's see, the slope is maybe minus lambda or something like that. I think that's it. Or minus one over lambda. It's maybe minus lambda. So this is the level. This is for one value of lambda. This is a level curve of the Lagrangian. And I would have...","zh":"好的，这就是拉格朗日函数。所以我可以绘制拉格朗日函数的等高线，它们看起来像这样。这些是拉格朗日函数的等高线。我认为斜率可能是负的 lambda 或者类似的东西。我想就是这样。或者可能是负的 1/lambda。可能是负的 lambda。这就是等高线。这是对于一个 lambda 值的情况。这是拉格朗日函数的等高线。而我会……","start":1931.53,"end":1959.81},{"id":115,"text":"they would look like this, right? And so your goal is when someone fixes lambda, which is the slope, your goal is to go as far as possible this way until you're still touching G. Everybody got that? Okay. And so you can see, I plotted it for what happens for different values of lambda. And you can see what happens. It turns out when you take this line, when it just touches, where it intersects this axis, that's actually, this is G of lambda.","zh":"它们看起来会像这样，对吧？因此，当有人固定 lambda（即斜率）时，你的目标是尽可能沿着这个方向走，直到你仍然接触 G。大家明白了吗？好的。因此，你可以看到，我绘制了不同 lambda 值的情况，你可以看到会发生什么。结果发现，当这条线刚好接触时，它与这个轴的交点实际上是 G(lambda)。","start":1960.15,"end":1989.61},{"id":116,"text":"And look at that. Sure enough, g of lambda is less than or equal to p star. We knew that. It's a lower bound, right? And now I can picture in my head fiddling with lambda, right? If I made lambda like super big, let's say, well, let me first figure out what it is. Yeah, sorry. If lambda is super big, that means that the slope here is extremely small.","zh":"而且看这个。确实，g of lambda 小于等于 p star。我们早就知道这一点。它是一个下界，对吧？现在我可以想象在脑海中调整 lambda 的值。如果我让 lambda 变得非常大，比如说，让我先弄清楚它是什么。嗯，抱歉。如果 lambda 非常大，这意味着这里的斜率会变得极其小。","start":1990.53,"end":2015.5}],"notes":["本段讲解了凸优化中的目标函数和对偶函数的概念。目标函数越小越好，图形上表现为寻找最低点。对偶函数是拉格朗日函数的下界，且其值小于等于原始问题的最优值p星。","讲者通过图形化的方式解释了拉格朗日函数的水平曲线及其斜率与lambda的关系。水平曲线的斜率可能为负lambda或负1/lambda，这取决于具体问题。","当lambda固定时，目标是沿着特定方向尽可能远地移动，直到与约束函数G相切。这表明对偶函数的值随着lambda的变化而变化。","讲者指出，对偶函数g(lambda)始终小于等于原始问题的最优值p星，这是对偶性的一个基本性质。","当lambda非常大时，拉格朗日函数的斜率会变得非常小，这表明约束条件对目标函数的影响变得更强。","通过调整lambda，可以找到对偶函数的最优值，从而为原始问题提供下界。"],"formulas":[{"latex":"g(\\lambda) = \\inf_{x \\in D} (f_0(x) + \\lambda f_1(x))","symbols":"g(λ) 是对偶函数，f0(x) 和 f1(x) 是目标函数和约束函数，λ 是拉格朗日乘数","explanation":"公式正确，对偶函数定义为在可行域D上目标函数与拉格朗日乘数的线性组合的下确界。","evidence":"Now let's look at the dual function, which is actually kind of interesting. So let's look at the Lagrangian, by the way, is a function. Of course, it's a function of x, which has dimension 100, which I just made up. But the point is, the Lagrangian only depends on two numbers, which is f1 of x and f0 of x. And in fact, it's silly. It's just f0 of x plus lambda f1 of x."},{"latex":"g(\\lambda) \\leq p^*","symbols":"对偶函数g(λ) 是原始问题最优值p星的下界","explanation":"公式正确，对偶函数g(λ) 是原始问题最优值p星的下界，这是对偶性定理的基本结论。","evidence":"And look at that. Sure enough, g of lambda is less than or equal to p star. We knew that. It's a lower bound, right? And now I can picture in my head fiddling with lambda, right? If I made lambda like super big, let's say, well, let me first figure out what it is. Yeah, sorry. If lambda is super big, that means that the slope here is extremely small."}],"uncertainties":[],"diagram":"none","start":1864.63,"end":2015.5,"asr_flags":[],"math_clarifications":["原文中提到的p星是原始问题的最优值，而对偶函数g(λ) 是其下界，符合对偶性定理。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1864.63,"text":"is actually the objective and the semantics of objective is extremely simple the smaller it is the better and so graphically now i can tell you precisely what to do it says when you see one of these blobs you ignore everything on the right and you can attach a comment to it saying they're infeasible right so you can only focus on this thing this part and then there your goal is to find the thing that is lowest as the lowest potential energy let's say right and that would be"},{"start":1892.68,"text":"this thing here right everyone got that and so if we go over here we'll plot p star on this axis and that's p star everybody makes sense right so that's that's the picture okay now"},{"start":1906.28,"text":"Now let's look at the dual function, which is actually kind of interesting. So let's look at the Lagrangian, by the way, is a function. Of course, it's a function of x, which has dimension 100, which I just made up. But the point is, the Lagrangian only depends on two numbers, which is f1 of x and f0 of x. And in fact, it's silly. It's just f0 of x plus lambda f1 of x."},{"start":1931.53,"text":"Okay, that's the Lagrangian. So I can plot the level curves of the Lagrangian, and they look like this. These are the level curves of the Lagrangian here. And I think the slope is, let's see, the slope is maybe minus lambda or something like that. I think that's it. Or minus one over lambda. It's maybe minus lambda. So this is the level. This is for one value of lambda. This is a level curve of the Lagrangian. And I would have..."},{"start":1960.15,"text":"they would look like this, right? And so your goal is when someone fixes lambda, which is the slope, your goal is to go as far as possible this way until you're still touching G. Everybody got that? Okay. And so you can see, I plotted it for what happens for different values of lambda. And you can see what happens. It turns out when you take this line, when it just touches, where it intersects this axis, that's actually, this is G of lambda."},{"start":1990.53,"text":"And look at that. Sure enough, g of lambda is less than or equal to p star. We knew that. It's a lower bound, right? And now I can picture in my head fiddling with lambda, right? If I made lambda like super big, let's say, well, let me first figure out what it is. Yeah, sorry. If lambda is super big, that means that the slope here is extremely small."}],"speech_gaps":[],"frame":"../frames/v008/012.webp","frame_time":1876.63},{"title":"凸优化中的对偶间隙与几何解释","segments":[{"id":117,"text":"And then you can actually see, in fact, as lambda goes, you're going to get a value around here, d star. Sorry, that's d. Now as I change the slope like this, what's going to happen is this intersection point is going to move up here. Right when it's just touching these two points, it's going to hit d star. And when I increase the slope again, what happens is my point of contact is here. It's going to rotate around that point of contact and start going down again.","zh":"然后你实际上可以看到，当λ变化时，你会得到一个值，大约在这里，是d星。抱歉，那是d。当我改变斜率时，会发生的是这个交点会移动到这里。当它刚好接触这两个点时，它会到达d星。当我再次增加斜率时，会发生的是我的接触点在这里。它会围绕这个接触点旋转并再次开始下降。","start":2015.99,"end":2045.11},{"id":118,"text":"And I just, it was visually traced out what G looks like, right? It goes up, hits a maximum, then goes down. Well, it's concave. We knew that. Everybody got this? And now, this, for this problem, that's the gap. That's the gap, is this thing here. It's P star minus D star. So this problem, and now you actually see why you have a gap. You have a gap because there's a dent in this set G.","zh":"我只是用视觉方式描绘了G看起来是什么样子，对吧？它会上升，达到一个最大值，然后下降。嗯，它是凹的。我们早就知道这一点。大家明白了吗？现在，对于这个问题，这就是间隙。这就是间隙，就是这个东西。它是P星减去D星。所以在这个问题中，你现在实际上可以看到为什么会有间隙。你有间隙是因为这个集合G有一个凹陷。","start":2046.03,"end":2072.12},{"id":119,"text":"right? Meaning a non-convex portion. So like if G were convex, you wouldn't have that. You wouldn't have this, right? Everyone see what I'm saying? So now you can, this picture, once you internalize it, you will, you can kind of see why it is that for convex problems, there's zero duality gap.","zh":"对吧？意思是有一个非凸的部分。比如，如果G是凸的，你就不会有这个。你不会有这个，对吧？大家明白我的意思吗？现在你能够，通过这张图，一旦你理解了它，你就能大致明白为什么对于凸问题，会有零对偶间隙。","start":2072.97,"end":2088.31},{"id":120,"text":"Roughly speaking, what it says is that it's a surface. It's going to not be exactly G, but it's going to be closely related to G. It says that that set is convex, and what you're going to do is you're going to be able to get a hyperplane right up to it to any point on that surface, and that's what's going to allow you to get zero duality gap. Again, this is just for you to understand why all this stuff works, right? Okay, that's the geometric interpretation.","zh":"粗略地说，它说的是这是一个曲面。它不会完全等于G，但会与G密切相关。它说这个集合是凸的，而你要做的事情是，你能够在该曲面上的任何一点上放置一个超平面，这就是让你得到零对偶间隙的原因。再次强调，这只是为了帮助你理解为什么所有这些内容能够起作用，对吧？好的，这就是几何解释。","start":2089.07,"end":2117.81},{"id":121,"text":"So to actually make this official, what you do is in this setting, we have F1 and we have F0, right? F1, we want to be less than or equal to 0. And F0, we'll take as small as it can go.","zh":"为了正式地说明这一点，在这种情况下，我们有F1和F0，对吧？F1，我们希望它小于或等于0。而F0，我们将取它尽可能小的值。","start":2119.31,"end":2132.91},{"id":122,"text":"So if I form, it's the epigraph of that. So if I take all the points, that's A, is everything that's like that, it's actually going to be the same thing because, I mean, actually these are just points, yeah, you don't really care about these points, right? But it turns out this set is going to be, this set A for a convex problem is going to be convex. I guess that's kind of obvious because it's like a multi, it's the intersection, actually it's the intersection of two epigraphs, right? So it's going to be convex.","zh":"所以如果我构造的是这个的上图。所以如果我取所有这些点，那就是集合A，所有像这样的点，实际上它会是同样的东西，因为，我意思是，实际上这些只是点，对吧，你其实并不太关心这些点。但结果发现这个集合A对于凸问题来说，会是凸集。我想这有点显然，因为它像是一个多集，实际上是两个上图的交集，对吧？所以它会是凸的。","start":2133.36,"end":2160.48},{"id":123,"text":"So this is the picture. And then basically what it says is, let me redraw this for a convex set, and I'll show you what it looks like. But it should be kind of obvious, right? So what happens is you have this, and for a convex set, this thing might look like this or something. I don't know. Let's pretend it looks like that, right? So P star is here. How do you get P star?","zh":"这就是这张图。然后基本上它说的是，让我为凸集重新画一遍，然后我会展示它看起来是什么样子。但应该有点显然，对吧？所以会发生的是，你有这个，对于凸集，这个东西可能看起来像这样或者类似的东西。我不知道。让我们假装它看起来像这样，对吧？P星在这里。你是怎么得到P星的？","start":2161.71,"end":2188.41}],"notes":["本段讲解了凸优化中对偶间隙的概念，通过几何图像解释了为什么凸问题具有零对偶间隙。讲者指出，当集合G是非凸的时，会出现间隙，而当G是凸的时，间隙消失。这表明，凸性是保证零对偶间隙的关键条件。","讲者通过图像说明了集合G的形状，指出它是一个凹函数，具有最大值点。当G是凸的时，它不会出现凹陷，从而避免了间隙的产生。这帮助理解了凸优化问题中对偶间隙为零的原因。","讲者进一步解释了零对偶间隙的几何意义，指出凸集合的表面可以被超平面紧密贴合，从而允许零对偶间隙。这表明，凸性使得优化问题具有良好的对偶性质。","讲者提到，为了正式化这一概念，需要考虑F1和F0的定义，其中F1应小于等于0，而F0应尽可能小。这为后续的数学推导提供了基础。","讲者指出，集合A是两个上图的交集，因此是凸的。这表明，凸问题的结构保证了集合A的凸性，从而支持了零对偶间隙的结论。","最后，讲者提到对于凸集，其图像可能类似于某种形状，并指出P星的获取方式。这为后续的优化问题提供了直观的几何理解。"],"formulas":[{"latex":"P^* - D^*","symbols":"对偶间隙","explanation":"公式正确，表示对偶间隙，即P星减去D星。","evidence":"And I just, it was visually traced out what G looks like, right? It goes up, hits a maximum, then goes down. Well, it's concave. We knew that. Everybody got this? And now, this, for this problem, that's the gap. That's the gap, is this thing here. It's P star minus D star. So this problem, and now you actually see why you have a gap. You have a gap because there's a dent in this set G."}],"uncertainties":[],"diagram":"none","start":2015.99,"end":2188.41,"asr_flags":[],"math_clarifications":["原文中未出现其他数学公式，因此无需进一步核对。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2015.99,"text":"And then you can actually see, in fact, as lambda goes, you're going to get a value around here, d star. Sorry, that's d. Now as I change the slope like this, what's going to happen is this intersection point is going to move up here. Right when it's just touching these two points, it's going to hit d star. And when I increase the slope again, what happens is my point of contact is here. It's going to rotate around that point of contact and start going down again."},{"start":2046.03,"text":"And I just, it was visually traced out what G looks like, right? It goes up, hits a maximum, then goes down. Well, it's concave. We knew that. Everybody got this? And now, this, for this problem, that's the gap. That's the gap, is this thing here. It's P star minus D star. So this problem, and now you actually see why you have a gap. You have a gap because there's a dent in this set G."},{"start":2072.97,"text":"right? Meaning a non-convex portion. So like if G were convex, you wouldn't have that. You wouldn't have this, right? Everyone see what I'm saying? So now you can, this picture, once you internalize it, you will, you can kind of see why it is that for convex problems, there's zero duality gap."},{"start":2089.07,"text":"Roughly speaking, what it says is that it's a surface. It's going to not be exactly G, but it's going to be closely related to G. It says that that set is convex, and what you're going to do is you're going to be able to get a hyperplane right up to it to any point on that surface, and that's what's going to allow you to get zero duality gap. Again, this is just for you to understand why all this stuff works, right? Okay, that's the geometric interpretation."},{"start":2119.31,"text":"So to actually make this official, what you do is in this setting, we have F1 and we have F0, right? F1, we want to be less than or equal to 0. And F0, we'll take as small as it can go."},{"start":2133.36,"text":"So if I form, it's the epigraph of that. So if I take all the points, that's A, is everything that's like that, it's actually going to be the same thing because, I mean, actually these are just points, yeah, you don't really care about these points, right? But it turns out this set is going to be, this set A for a convex problem is going to be convex. I guess that's kind of obvious because it's like a multi, it's the intersection, actually it's the intersection of two epigraphs, right? So it's going to be convex."},{"start":2161.71,"text":"So this is the picture. And then basically what it says is, let me redraw this for a convex set, and I'll show you what it looks like. But it should be kind of obvious, right? So what happens is you have this, and for a convex set, this thing might look like this or something. I don't know. Let's pretend it looks like that, right? So P star is here. How do you get P star?"}],"speech_gaps":[],"frame":"../frames/v008/013.webp","frame_time":2027.99},{"title":"对偶问题与拉格朗日乘数","segments":[{"id":124,"text":"Well, I ignore what happens over here. I look over here, and I go down as low as I can. And I get, this is P star. Okay? So, and now how do I get D star? Well, that's simple. I, well, I like to think of this. I'm going to put a line. I'm allowed, I think it's like minus one over lambda. It doesn't matter. I can change the slope on that. Okay? What I do with that line is I have a point of contact, because I'm really going as far down as I can this way. I have a point of contact. I change lambda.","zh":"嗯，我忽略这边发生的事情。我看看这边，尽可能往低处走。然后我得到的是P星。好吗？那么现在如何得到D星呢？嗯，这很简单。我想这样想。我要画一条线。我认为这类似于负的1除以λ。没关系，我可以改变这条线的斜率。好吗？我用这条线做什么呢？我有一个接触点，因为我以这种方式尽可能往低处走。我有一个接触点。我改变λ。","start":2188.82,"end":2217.78},{"id":125,"text":"And this is g of lambda. Everybody got that? Here, this intersection. And now the question is, how big can I make g of lambda? Which, by the way, has a name, d star.","zh":"这就是g of λ。大家明白了吗？这里，这个交点。现在问题是，我能让g of λ变得多大？顺便说一句，它有一个名字，d星。","start":2218.52,"end":2229.98},{"id":126,"text":"Right, and so the answer is you rotate this and like you know if I if I take lambda you know this value of lambda that's a particularly poor value because this is going to eventually hit this and it's going to you're going to have a very negative number um if I take lambda way down here that's a bad value too and we can see clearly the follow what what's actually going to do the trick it's going to be really very cool what I do is right here I will find the correct slope","zh":"对，所以答案是，你旋转这条线，就像你知道的，如果你取λ，你知道这个λ值是一个特别差的值，因为这会最终碰到这个点，你会得到一个非常负的数。如果你把λ取得很低，这也是一个坏值。我们可以清楚地看到实际上会起作用的是什么，我在这里所做的就是找到正确的斜率。","start":2231.37,"end":2259.4},{"id":127,"text":"is in fact, it's just the tangent to this at that point. And there, P star equals D star. Everybody got it? So it's actually kind of cool. Also, this hints at lots of other stuff, right? This hints at like another topic we're going to look at, which is this. It says, this says that suppose you went back and negotiated the constraint, right? The current constraint is F1 of X is less than zero, right?","zh":"事实上，它就是在这个点的切线。在那里，P星等于D星。大家明白了吗？所以这实际上有点酷。此外，这也暗示了其他很多内容，对吧？这暗示了我们将要探讨的另一个主题，即这个。它说，假设你回到过去，重新协商约束条件，对吧？当前的约束条件是F1 of X小于零，对吧？","start":2260.11,"end":2288.82},{"id":128,"text":"But suppose you went back and you said, you know what? I can't do it with a power budget of 50 milliwatts. I simply, I can't make, it won't clock right. It's going to use too much air. I don't know what it is. I can't do it. Please give me 55 milliwatts as a budget. That has the effect of moving this over to here. Because then let's say that says you could have, this is less than something else that's small right there. That's my extra power, right?","zh":"但假设你回到过去，你说，你知道吗？我无法用50毫瓦的功率预算做到这一点。我简单地说，我做不到，它不会正常工作。它会消耗太多空气。我不知道是什么原因。我做不到。请给我55毫瓦的预算。这会将这个点移动到这边。因为然后可以说，你能够拥有，这个小于另一个很小的值，对吧？那是我的额外功率，对吧？","start":2289.34,"end":2318.48},{"id":129,"text":"Okay, now to solve that problem, you can see that the objective is going to go down. I mean, it kind of had to. I just, like, I gave, you started with 50 milliwatt budget, you solve the problem, and I go, you know, when negotiated, and they said, sure, take 55, right? And you're like, okay, thanks. Your objective is only going to go down. But here's the cool part. You can see immediately that the amount it goes down is actually extremely well approximated by this Lagrange multiplier.","zh":"好的，现在要解决这个问题，你可以看到目标函数值会下降。我是说，它本来就应该下降。我只是，比如，你一开始有50毫瓦的预算，你解决这个问题，然后我说，你知道的，经过协商，他们说，当然可以，拿55吧，对吧？然后你就会说，好的，谢谢。你的目标函数值只会下降。但这里有个酷的地方。你可以立刻看出，目标函数值下降的幅度实际上被这个拉格朗日乘数非常良好地近似了。","start":2319.48,"end":2348.01}],"notes":["本段讲解了如何通过调整拉格朗日乘数λ来找到对偶问题的最优解。讲者提到，通过将λ视为一个斜率，可以找到一个接触点，从而确定最优解。这表明在优化问题中，拉格朗日乘数用于调整约束条件，以找到最优解。","讲者进一步说明了如何通过调整λ的值来找到最优解。当λ取某个值时，可能会导致目标函数值变得非常小，这表明λ的选择对优化结果有重要影响。讲者还提到，找到正确的λ值可以使得目标函数值显著下降。","讲者提到，当约束条件发生变化时，例如增加功率预算，这会改变优化问题的解。通过调整约束条件，可以找到新的最优解，这表明优化问题的解对约束条件非常敏感。","讲者指出，当约束条件被调整后，目标函数值会下降，而下降的幅度可以用拉格朗日乘数来近似。这表明拉格朗日乘数在优化问题中具有重要的解释意义。","讲者还提到，通过调整λ的值，可以找到最优解的斜率，这表明拉格朗日乘数与目标函数的梯度有关。这进一步说明了拉格朗日乘数在优化问题中的作用。","讲者最后强调，拉格朗日乘数可以很好地近似目标函数值的下降幅度，这表明拉格朗日乘数在优化问题中具有重要的实际应用价值。"],"formulas":[{"latex":"P^* = D^*","symbols":"P星等于D星","explanation":"公式正确，表示P星等于D星，符合上下文中的描述。","evidence":"is in fact, it's just the tangent to this at that point. And there, P star equals D star. Everybody got it? So it's actually kind of cool. Also, this hints at lots of other stuff, right? This hints at like another topic we're going to look at, which is this. It says, this says that suppose you went back and negotiated the constraint, right? The current constraint is F1 of X is less than zero, right?"},{"latex":"g(\\lambda)","symbols":"g(λ)","explanation":"公式正确，表示g(λ)，符合上下文中的描述。","evidence":"And this is g of lambda. Everybody got that? Here, this intersection. And now the question is, how big can I make g of lambda? Which, by the way, has a name, d star."},{"latex":"F_1(X) \u003c 0","symbols":"F1(X)小于零","explanation":"公式正确，表示F1(X)小于零，符合上下文中的描述。","evidence":"is in fact, it's just the tangent to this at that point. And there, P star equals D star. Everybody got it? So it's actually kind of cool. Also, this hints at lots of other stuff, right? This hints at like another topic we're going to look at, which is this. It says, this says that suppose you went back and negotiated the constraint, right? The current constraint is F1 of X is less than zero, right?"}],"uncertainties":["lambda"],"diagram":"none","start":2188.82,"end":2348.01,"asr_flags":[],"math_clarifications":["没有发现需要进一步澄清的数学内容。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2188.82,"text":"Well, I ignore what happens over here. I look over here, and I go down as low as I can. And I get, this is P star. Okay? So, and now how do I get D star? Well, that's simple. I, well, I like to think of this. I'm going to put a line. I'm allowed, I think it's like minus one over lambda. It doesn't matter. I can change the slope on that. Okay? What I do with that line is I have a point of contact, because I'm really going as far down as I can this way. I have a point of contact. I change lambda."},{"start":2218.52,"text":"And this is g of lambda. Everybody got that? Here, this intersection. And now the question is, how big can I make g of lambda? Which, by the way, has a name, d star."},{"start":2231.37,"text":"right and so the answer is you rotate this and like you know if i if i take lambda you know this value of lambda that's a particularly poor value because this is going to eventually hit this and it's going to you're going to have a very negative number um if i take lambda way down here that's a bad value too and we can see clearly the follow what what's actually going to do the trick it's going to be really very cool what i do is right here i will find the correct slope"},{"start":2260.11,"text":"is in fact, it's just the tangent to this at that point. And there, P star equals D star. Everybody got it? So it's actually kind of cool. Also, this hints at lots of other stuff, right? This hints at like another topic we're going to look at, which is this. It says, this says that suppose you went back and negotiated the constraint, right? The current constraint is F1 of X is less than zero, right?"},{"start":2289.34,"text":"But suppose you went back and you said, you know what? I can't do it with a power budget of 50 milliwatts. I simply, I can't make, it won't clock right. It's going to use too much air. I don't know what it is. I can't do it. Please give me 55 milliwatts as a budget. That has the effect of moving this over to here. Because then let's say that says you could have, this is less than something else that's small right there. That's my extra power, right?"},{"start":2319.48,"text":"Okay, now to solve that problem, you can see that the objective is going to go down. I mean, it kind of had to. I just, like, I gave, you started with 50 milliwatt budget, you solve the problem, and I go, you know, when negotiated, and they said, sure, take 55, right? And you're like, okay, thanks. Your objective is only going to go down. But here's the cool part. You can see immediately that the amount it goes down is actually extremely well approximated by this Lagrange multiplier."}],"speech_gaps":[],"frame":"../frames/v008/014.webp","frame_time":2200.82},{"title":"对偶性与互补松弛性","segments":[{"id":130,"text":"Everybody got that? So we're getting a little ahead of ourselves, but that's kind of the idea. So you can even see the optimal Lagrange multiplier here as a very cool, that's why people call it shadow price. It's basically how much would you pay, how much would you pay in terms of the objective to relax or restrict that constraint, right? So that's the idea. Everybody got the idea there? So, I mean, we're going to look at this more carefully in a minute, but that's the idea.","zh":"大家明白了吗？所以我们有点超前了，但这就是这个想法。你甚至可以在这里看到最优的拉格朗日乘数，这被称为影子价格，非常酷。它基本上是你为了放松或限制那个约束条件，需要付出多少代价，对吧？这就是这个想法。大家明白这个想法了吗？所以，我意思是我们稍后会更仔细地看一下，但这就是这个想法。","start":2348.75,"end":2377.69},{"id":131,"text":"By the way, with this you can make up one of those sick problems that's convex and has a positive duality gap. I'm not going to do it just because you shouldn't. This is just one of those things you shouldn't do. You could do it, but I'm not going to because it's kind of silly and all that.","zh":"顺便说一句，用这个你可以编造一个凸问题，且具有正对偶间隙的问题。我不打算做，因为你不应该这么做。这只是一个你不应该做的事情。你可以做，但我不会做，因为这有点傻。","start":2381.06,"end":2407.38},{"id":132,"text":"if you have zero duality gap and they're achieved, right? So what that means is you find an x here. This is a strong duality, so I have x. And then lambda star, nu star are optimal dual variables. By the way, you would call this optimal dual variables, and you'd call x star comma lambda star nu star. That's primal dual optimal variables. So if you said that, everyone would know what you're talking about, okay?","zh":"如果你有零对偶间隙并且达到了，对吧？这意味着你在这里找到一个x。这是强对偶性，所以我有x。然后lambda星和nu星是最优的对偶变量。顺便说一句，你会称这些为最优的对偶变量，并且你会称x星，lambda星，nu星。这是原始对偶最优变量。如果你这样说，大家就会明白你在说什么，对吧？","start":2407.92,"end":2435.08},{"id":133,"text":"Well, I mean, this is what it means. That's p star. That's d star. But the definition of this is it's the infimum of the Lagrangian over x with the lambda stars in it, right? That's fine. But this is the infimum over all x. Well, that's for sure less than or equal to if I plug in x equals x star because that's one of the things you would infamize over. Okay, so you get this. All right, and now let's take a look at this. x star is optimal, so these are zero.","zh":"好吧，我的意思是，这就是它的含义。这是p星。这是d星。但这个定义是它是在包含lambda星的x上的拉格朗日函数的下确界，对吧？这没问题。但这是所有x的下确界。当然，如果我代入x等于x星，那它一定小于或等于，因为这是你进行下确界运算的一个点。好的，所以你得到了这个。好了，现在让我们看看这个。x星是最优的，所以这些是零。","start":2436.71,"end":2463.31},{"id":134,"text":"Right? The h i's are zero because that's the original problem. So this goes away. These are less than or equal to zero because that's what it means to be feasible. The lambdas are bigger than or equal to zero. And so this sum here is less than or equal to zero. Okay? So this thing is less than or equal to that. Oh, but wait a minute. Now I have a chain of these things. And that says that actually these are actually equalities. Right? Okay.","zh":"对吧？h i是零，因为这是原始问题。所以这部分就消失了。这些小于或等于零，因为这是可行性的含义。lambda大于或等于零。因此，这里的总和小于或等于零。对吧？所以这个东西小于或等于那个。哦，但等一下。现在我有一连串这样的东西。这说明实际上这些是等式。对吧？好的。","start":2463.97,"end":2494.2},{"id":135,"text":"Now let's see what that means. We go back to this term, and you know what that means? That means that this term is zero. Now let's talk about that term. It's a sum of products of a non-negative number, lambda i star, times a non-positive number, fi of star. And so actually each term in the sum is less than or equal to zero. Now if I walk up to you on the street and I say I have a sum of things, each less than or equal to zero, and the sum is zero,","zh":"现在让我们看看这意味着什么。我们回到这个术语，你知道这意味着什么吗？这意味着这个术语等于零。现在让我们讨论这个术语。它是一个非负数lambda i星与一个非正数fi星的乘积之和。因此实际上每个项都小于或等于零。现在如果我走上街头对你说，我有一个各项都小于或等于零的和，而这个和等于零，","start":2494.77,"end":2523.65}],"notes":["本段讲解了对偶性中的互补松弛性，即当强对偶性成立时，原问题和对偶问题的最优解满足互补松弛条件。互补松弛性意味着原问题的约束条件和对偶变量之间存在某种关系，具体表现为约束条件的松弛度与对偶变量的乘积为零。","讲者提到，如果存在正的对偶间隙，那么原问题和对偶问题的最优值之间存在差距，但这种情况通常不被推荐，因为这可能意味着问题的结构存在问题。讲者强调了在实际应用中应避免这种情况。","在讲解互补松弛性时，讲者通过数学推导说明了当原问题的最优解满足约束条件时，对偶变量与原问题的约束条件的乘积为零。这表明原问题的约束条件和对偶变量之间存在某种平衡。","讲者还提到，当原问题的最优解满足约束条件时，对偶变量的值必须是非负的，而原问题的约束条件的松弛度必须是非正的。这种关系使得互补松弛条件成立。","最后，讲者通过一个例子说明，当所有项的和为零时，每个项都必须为零，这进一步支持了互补松弛条件的成立。","讲者强调了互补松弛性在凸优化中的重要性，它不仅帮助理解对偶性，还为优化算法的设计提供了理论依据。"],"formulas":[{"latex":"p^* = \\text{inf}_{x} f(x) \\text{ s.t. } h_i(x) = 0, i = 1, \\text{\\textbackslash,}, m","symbols":"p^* 表示原问题的最优值","explanation":"公式正确，表示原问题的最优值为在约束条件下的最小值。","evidence":"Well, I mean, this is what it means. That's p star. That's d star. But the definition of this is it's the infimum of the Lagrangian over x with the lambda stars in it, right? That's fine. But this is the infimum over all x. Well, that's for sure less than or equal to if I plug in x equals x star because that's one of the things you would infamize over. Okay, so you get this. All right, and now let's take a look at this. x star is optimal, so these are zero."},{"latex":"d^* = \\text{sup}_{\\nu} \\text{inf}_{x} L(x, \\nu) \\text{ s.t. } \\nu \\text{ is feasible}","symbols":"d^* 表示对偶问题的最优值","explanation":"公式正确，表示对偶问题的最优值为在可行的拉格朗日乘子下的上确界。","evidence":"Well, I mean, this is what it means. That's p star. That's d star. But the definition of this is it's the infimum of the Lagrangian over x with the lambda stars in it, right? That's fine. But this is the infimum over all x. Well, that's for sure less than or equal to if I plug in x equals x star because that's one of the things you would infamize over. Okay, so you get this. All right, and now let's take a look at this. x star is optimal, so these are zero."},{"latex":"p^* = d^*","symbols":"强对偶性成立","explanation":"公式正确，表示强对偶性成立，原问题和对偶问题的最优值相等。","evidence":"if you have zero duality gap and they're achieved, right? So what that means is you find an x here. This is a strong duality, so I have x. And then lambda star, nu star are optimal dual variables. By the way, you would call this optimal dual variables, and you'd call x star comma lambda star nu star. That's primal dual optimal variables. So if you said that, everyone would know what you're talking about, okay?"},{"latex":"x^* \\text{ is optimal} \\rightarrow \\text{complementary slackness holds}","symbols":"互补松弛性成立","explanation":"公式正确，表示当x^*是最优解时，互补松弛性成立。","evidence":"Right? The h i's are zero because that's the original problem. So this goes away. These are less than or equal to zero because that's what it means to be feasible. The lambdas are bigger than or equal to zero. And so this sum here is less than or equal to zero. Okay? So this thing is less than or equal to that. Oh, but wait a minute. Now I have a chain of these things. And that says that actually these are actually equalities. Right? Okay."}],"uncertainties":["infamize"],"diagram":"none","start":2348.75,"end":2523.65,"asr_flags":[],"math_clarifications":["所有公式均符合数学规范，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2348.75,"text":"Everybody got that? So we're getting a little ahead of ourselves, but that's kind of the idea. So you can even see the optimal Lagrange multiplier here as a very cool, that's why people call it shadow price. It's basically how much would you pay, how much would you pay in terms of the objective to relax or restrict that constraint, right? So that's the idea. Everybody got the idea there? So, I mean, we're going to look at this more carefully in a minute, but that's the idea."},{"start":2381.06,"text":"By the way, with this you can make up one of those sick problems that's convex and has a positive duality gap. I'm not going to do it just because you shouldn't. This is just one of those things you shouldn't do. You could do it, but I'm not going to because it's kind of silly and all that. Marching right along, we get to this idea of complementary slackness. Let's see what happens."},{"start":2407.92,"text":"if you have zero duality gap and they're achieved, right? So what that means is you find an x here. This is a strong duality, so I have x. And then lambda star, nu star are optimal dual variables. By the way, you would call this optimal dual variables, and you'd call x star comma lambda star nu star. That's primal dual optimal variables. So if you said that, everyone would know what you're talking about, okay?"},{"start":2436.71,"text":"Well, I mean, this is what it means. That's p star. That's d star. But the definition of this is it's the infimum of the Lagrangian over x with the lambda stars in it, right? That's fine. But this is the infimum over all x. Well, that's for sure less than or equal to if I plug in x equals x star because that's one of the things you would infamize over. Okay, so you get this. All right, and now let's take a look at this. x star is optimal, so these are zero."},{"start":2463.97,"text":"Right? The h i's are zero because that's the original problem. So this goes away. These are less than or equal to zero because that's what it means to be feasible. The lambdas are bigger than or equal to zero. And so this sum here is less than or equal to zero. Okay? So this thing is less than or equal to that. Oh, but wait a minute. Now I have a chain of these things. And that says that actually these are actually equalities. Right? Okay."},{"start":2494.77,"text":"Now let's see what that means. We go back to this term, and you know what that means? That means that this term is zero. Now let's talk about that term. It's a sum of products of a non-negative number, lambda i star, times a non-positive number, fi of star. And so actually each term in the sum is less than or equal to zero. Now if I walk up to you on the street and I say I have a sum of things, each less than or equal to zero, and the sum is zero,"}],"speech_gaps":[],"frame":"../frames/v008/015.webp","frame_time":2360.75},{"title":"互补松弛性与机械类比","segments":[{"id":136,"text":"What can you conclude? What's that? Well, every single one of them was zero. Because if anyone is non-zero, you're not going to work, right? So, okay, everybody got this? And that tells you that lambda i star fi star is zero. That's called complementary slackness, right? Because when fi of x is zero, we say that constraint is tight. If fi x is less than zero, we say that constraint is slack.","zh":"你能得出什么结论？这是什么？嗯，每一个都是零。因为如果任何一个不为零，那就不会起作用，对吧？所以，大家明白了吗？这说明 lambda i 星号乘以 fi 星号等于零。这被称为互补松弛性，对吧？因为当 fi of x 等于零时，我们说这个约束是紧的。如果 fi x 小于零，我们说这个约束是松的。","start":2524.23,"end":2556.04},{"id":137,"text":"Okay, that's the name. It's good notation. This says, if a constraint is slack, then for sure the Lagrange multiplier has to be zero. That's what it says. Okay? It also, I mean, and you know, you can work out many ways to say it, right? If lambda is, if this thing is non-zero, then for sure you have to be tight. Okay?","zh":"好的，这就是这个名字。这是很好的记号。它表示，如果一个约束是松的，那么对应的拉格朗日乘子一定为零。这是它所表达的意思。明白了吗？此外，你也可以用许多方式来表达这一点，对吧？如果这个乘子不为零，那么你一定处于紧约束的状态。明白了吗？","start":2557.1,"end":2583.23},{"id":138,"text":"So actually what's cool is the connection to, you know, these, obviously when you say slack and tight, these are references to mechanical analogs, right? And in fact, for mechanical analogs, it works perfectly. You can read in the book about this where, you know, you minimize the potential energy of something subject to constraints. For example, if there's a, you know, if there's a surface and something wants to go that way and it hits it, then it turns out literally, you know, slack means.","zh":"实际上，有趣的是它与机械类比之间的联系，对吧？显然，当我们说松和紧时，这些术语指的是机械类比。事实上，在机械类比中，它完全适用。你可以参考书中的相关内容，例如，你最小化某个物体的势能，同时满足约束条件。例如，如果有一个表面，某个物体想要朝那个方向移动，但碰到它，那么实际上，松意味着你没有接触到边界，紧意味着你接触到了边界。","start":2583.74,"end":2612.06},{"id":139,"text":"you're not touching that boundary. Tight means you're touching it. And then the coolest thing ever happens. It turns out lambda is literally the contact force in newtons, right? So it says, if you're not touching, or let's take a chain, right? Let's say I have two things connected by a cable.","zh":"如果你没有接触到边界，那就是松的。紧意味着你接触到了边界。然后最酷的事情发生了。实际上，lambda 就是牛顿单位下的接触力，对吧？所以它表示，如果你没有接触到，或者让我们以一条链为例，对吧？假设我有两个物体通过一根缆绳连接。","start":2612.65,"end":2633.12},{"id":140,"text":"It's a mechanical thing. I minimize potential energy and blah, blah, blah. And now it's all hanging in some nice configuration, right? What it says is if a cable is slack, their lambda is precisely the tension in the cable. If it's slack, there's no tension. Some will actually be not slack. They'll be tight. Or in that case, you would say taut, right? And then the tension will be precisely lambda.","zh":"这是一个机械问题。我最小化势能，然后其他各种情况。现在它以某种优美的配置悬挂着，对吧？它表示，如果缆绳是松的，那么对应的 lambda 就是缆绳中的张力。如果它是松的，就没有张力。有些缆绳实际上不会松，它们会紧，或者说绷直，对吧？在这种情况下，张力就是 lambda。","start":2634.03,"end":2659.7},{"id":141,"text":"By the way, I'll be able to show that when we do a little bit later today. That's literally the tension or the contact force in Newtons. We'll get to that shortly. I mean, if you just know a little bit, which is actually all I know. Yes? I can't see the case that when we solve the dual problem, we see that it goes to infinity. Yeah, so yes, this is the case where...","zh":"顺便说一下，我稍后会展示这一点。那实际上是牛顿单位下的张力或接触力。我们很快就会讲到这一点。我的意思是，如果你只知道一点点，实际上我只知道这些。是的？我看不到当解决对偶问题时，会出现趋向于无穷大的情况。是的，所以这就是那种情况。","start":2660.65,"end":2686.1}],"notes":["本段讲解了互补松弛性（complementary slackness）的概念，指出当约束条件为松弛（slack）时，对应的拉格朗日乘子必须为零。同时，当约束条件为紧（tight）时，拉格朗日乘子非零。这是优化问题中一个重要的对偶性质。","讲者通过机械类比进一步解释了互补松弛性的物理意义，指出当约束条件为松弛时，系统不接触边界，此时拉格朗日乘子对应于接触力（contact force），即牛顿力。当约束条件为紧时，系统接触边界，此时拉格朗日乘子对应于张力（tension）。","讲者提到，当约束条件为松弛时，拉格朗日乘子为零，表示没有张力；当约束条件为紧时，拉格朗日乘子非零，表示存在张力。这种关系在机械系统中具有直观的物理意义。","讲者还提到，后续会进一步展示拉格朗日乘子与张力之间的关系，即拉格朗日乘子等于张力。这表明互补松弛性不仅是一个数学性质，还具有实际的物理意义。","讲者指出，当求解对偶问题时，可能会出现拉格朗日乘子趋于无穷大的情况，这表明某些约束条件可能变得非常紧，从而导致对偶变量的值变得很大。","讲者通过机械系统的例子，如链条和缆绳，进一步说明了互补松弛性的物理意义，强调了拉格朗日乘子在优化问题中的实际应用。"],"formulas":[{"latex":"\\lambda_i^* f_i^* = 0","symbols":"\\lambda_i^* 表示第i个拉格朗日乘子的最优值，f_i^* 表示第i个约束函数的最优值","explanation":"公式正确表达了互补松弛性条件，即最优解处拉格朗日乘子与对应约束函数的乘积为零。","evidence":"What can you conclude? What's that? Well, every single one of them was zero. Because if anyone is non-zero, you're not going to work, right? So, okay, everybody got this? And that tells you that lambda i star fi star is zero. That's called complementary slackness, right? Because when fi of x is zero, we say that constraint is tight. If fi x is less than zero, we say that constraint is slack."}],"uncertainties":[],"diagram":"none","start":2524.23,"end":2686.1,"asr_flags":[],"math_clarifications":["互补松弛性条件是拉格朗日对偶性中的一个重要性质，它表明在最优解处，如果约束函数在该点处不紧（即松弛），则对应的拉格朗日乘子为零。反之，如果约束函数在该点处紧（即约束被激活），则对应的拉格朗日乘子可能非零。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2524.23,"text":"What can you conclude? What's that? Well, every single one of them was zero. Because if anyone is non-zero, you're not going to work, right? So, okay, everybody got this? And that tells you that lambda i star fi star is zero. That's called complementary slackness, right? Because when fi of x is zero, we say that constraint is tight. If fi x is less than zero, we say that constraint is slack."},{"start":2557.1,"text":"Okay, that's the name. It's good notation. This says, if a constraint is slack, then for sure the Lagrange multiplier has to be zero. That's what it says. Okay? It also, I mean, and you know, you can work out many ways to say it, right? If lambda is, if this thing is non-zero, then for sure you have to be tight. Okay?"},{"start":2583.74,"text":"So actually what's cool is the connection to, you know, these, obviously when you say slack and tight, these are references to mechanical analogs, right? And in fact, for mechanical analogs, it works perfectly. You can read in the book about this where, you know, you minimize the potential energy of something subject to constraints. For example, if there's a, you know, if there's a surface and something wants to go that way and it hits it, then it turns out literally, you know, slack means."},{"start":2612.65,"text":"you're not touching that boundary. Tight means you're touching it. And then the coolest thing ever happens. It turns out lambda is literally the contact force in newtons, right? So it says, if you're not touching, or let's take a chain, right? Let's say I have two things connected by a cable."},{"start":2634.03,"text":"It's a mechanical thing. I minimize potential energy and blah, blah, blah. And now it's all hanging in some nice configuration, right? What it says is if a cable is slack, their lambda is precisely the tension in the cable. If it's slack, there's no tension. Some will actually be not slack. They'll be tight. Or in that case, you would say taut, right? And then the tension will be precisely lambda."},{"start":2660.65,"text":"By the way, I'll be able to show that when we do a little bit later today. That's literally the tension or the contact force in Newtons. We'll get to that shortly. I mean, if you just know a little bit, which is actually all I know. Yes? I can't see the case that when we solve the dual problem, we see that it goes to infinity. Yeah, so yes, this is the case where..."}],"speech_gaps":[],"frame":"../frames/v008/016.webp","frame_time":2536.23},{"title":"KKT条件的历史与背景","segments":[{"id":142,"text":"x star is primal. There exists a primal optimum and dual optimum. You're talking about cases where it's an infeasibility problem or something like that, in which case you don't have this, right? Like the dual is unbounded or something like that. So this is not that case. That case does come up. Yeah, so in fact, I'll say something about that case a little bit later. Okay, everybody got this so far? It's actually all very, it's all pretty cool, right?","zh":"x星是原始可行解。存在一个原始最优解和对偶最优解。你谈论的是不可行性问题或者其他类似情况，这时候你就不会有这种情况，对吧？比如对偶问题无界或者其他类似情况。所以这不是那种情况。那种情况确实会出现。是的，事实上，我稍后会稍微讲一下那种情况。大家到目前为止都明白了吗？其实这一切都非常精彩，对吧？","start":2687.28,"end":2715.89},{"id":143,"text":"Okay, now we march on to something called the KKT or Karush-Kuhn-Tucker. This is actually a very sweet story, right? That, you know, Lagrange and others in the early 19th century came up with sort of, you know, these things that have their names on them. These conditions for minimizing a function subject to...","zh":"好的，现在我们继续讲一种叫做KKT或Karush-Kuhn-Tucker的条件。这其实是一个非常精彩的故事，对吧？在19世纪早期，拉格朗日和其他人提出了这些带有他们名字的条件。这些条件用于在存在一些等式约束的情况下最小化一个函数，","start":2718.63,"end":2740.23},{"id":144,"text":"some equality constraints, right? That's how Lagrange got his name on these things. Okay. And, you know, they did it for like one or two and stuff like that. So, you know, it's fine. The extension to inequalities, right? Actually, I mean, certainly if you'd asked a mid to late 19th century mathematician to figure out","zh":"这就是拉格朗日能够把这些条件以他的名字命名的原因。好的。他们当时处理的是一个或两个这样的问题，所以这也没问题。对于不等式约束的扩展，对吧？实际上，我意思是，如果在19世纪中期到晚期，一个数学家被问到如何解决这个问题，","start":2740.95,"end":2764.67},{"id":145,"text":"that's like coon and tucker you know came up with these and i mean it's okay and you know they were like wow that's cool like it's an extension of what lagrange did and i don't know makes you feel good and all that okay everything's cool they became they became called the coon tucker condition so if you look in i don't know if you look in uh","zh":"那就像库恩和塔克，他们提出了这些条件，我意思是这也没问题，你知道的，他们觉得这很酷，这是对拉格朗日工作的扩展，我不知道这让你感觉很好，总之一切都很好，它们后来被称为库恩-塔克条件，如果你看看某个时期的论文，对吧？比如可能来自1960或1965年的论文，你会直接看到所谓的库恩-塔克条件，对吧？无论如何，他们在大约十年后发现，发现了一篇1938年的硕士论文，由Karush撰写。","start":2765.18,"end":2791.94},{"id":146,"text":"papers of a certain era, right? Like maybe from 1960 or 65. You will literally see just Kuhn-Tucker conditions, right? Anyway, they then later discovered, after like a decade or so, they discovered like a 1938 master's thesis by Karush.","zh":"那个时代的一些论文，对吧？比如可能来自1960或1965年的论文。你会 literally（字面意思）只看到Kuhn-Tucker条件，对吧？不管怎样，大约十年后，他们发现了Karush于1938年写的硕士论文。","start":2792.95,"end":2810.27},{"id":147,"text":"That everything in it, like everything, everything was in it, right? So then actually they did the right thing, which is to then popularize that it should be Khrushchev. But actually, the real story is that you should never, never, ever pretend that you did something first. Because number one, it's, you know, almost certainly Gauss knew about it. We can start with that, for sure. And then, you know, I mean, then, I don't know, I have...","zh":"里面的一切，一切，一切都在里面，对吧？所以他们实际上做了正确的事情，即随后推广它应该称为Khrushchev。但实际上，真实的故事是，你永远、永远、永远不要假装你首先发现了某件事。因为首先，几乎可以肯定的是，高斯早就知道这一点了。我们可以从这一点开始，毫无疑问。然后，你知道的，我意思是，我不确定，我有……","start":2810.75,"end":2833.53},{"id":148,"text":"I have friends who remind me that no, this is not the Koshi Schwartz inequality, it's the Bhattacharya inequality, which is like 500 years earlier, right? So it's like, anyway, you should also not hang out with people who say things like that. Like, I discovered something new, because it's extremely unlikely. All I can say is every time I ever looked into an allegation like that, they proved false.","zh":"我有朋友提醒我说，不，这不是柯西-施瓦茨不等式，而是巴塔恰里亚不等式，这比它早了大约500年，对吧？所以，总之，你也应该避免和那些说这种话的人交往。比如，我发现了什么新东西，因为这极其不可能。我只能这么说，每次我查看类似的指控时，它们都被证明是错误的。","start":2834.96,"end":2859.22}],"notes":["本段主要讲述KKT条件的历史背景，指出KKT条件是Lagrange乘数法在不等式约束下的推广，并提到KKT条件的命名来源。讲者强调了KKT条件的提出者是Karush、Kuhn和Tucker，但指出在1951年之前，这些条件并未被广泛认可。","讲者提到KKT条件的命名存在争议，指出KKT条件的真正提出者是Karush，而Kuhn和Tucker后来将其推广并推广了这一条件。讲者还指出，KKT条件的命名可能与历史上的其他数学家有关，如Gauss，但并未明确说明。","讲者还提到，KKT条件的命名可能与历史上的其他数学家有关，如Koshi和Schwartz，但指出这些是错误的，真正的不等式是Bhattacharya不等式，且其历史比KKT条件更早。","讲者强调，不应声称自己发现了新的数学结果，因为这种情况极为罕见。讲者指出，每次遇到此类声称，都会发现其不属实。这表明在数学领域，对历史和贡献的准确理解非常重要。"],"formulas":[],"uncertainties":["coon and tucker","Khrushchev","Koshi Schwartz inequality","Bhattacharya inequality"],"diagram":"none","start":2687.28,"end":2859.22,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2687.28,"text":"x star is primal. There exists a primal optimum and dual optimum. You're talking about cases where it's an infeasibility problem or something like that, in which case you don't have this, right? Like the dual is unbounded or something like that. So this is not that case. That case does come up. Yeah, so in fact, I'll say something about that case a little bit later. Okay, everybody got this so far? It's actually all very, it's all pretty cool, right?"},{"start":2718.63,"text":"Okay, now we march on to something called the KKT or Karush-Kuhn-Tucker. This is actually a very sweet story, right? That, you know, Lagrange and others in the early 19th century came up with sort of, you know, these things that have their names on them. These conditions for minimizing a function subject to..."},{"start":2740.95,"text":"some equality constraints, right? That's how Lagrange got his name on these things. Okay. And, you know, they did it for like one or two and stuff like that. So, you know, it's fine. The extension to inequalities, right? Actually, I mean, certainly if you'd asked a mid to late 19th century mathematician to figure out"},{"start":2765.18,"text":"how does it they would have come up with this but for whatever reason it wasn't until like i don't know like 1951 that some people at princeton or whatever that's like coon and tucker you know came up with these and i mean it's okay and you know they were like wow that's cool like it's an extension of what lagrange did and i don't know makes you feel good and all that okay everything's cool they became they became called the coon tucker condition so if you look in i don't know if you look in uh"},{"start":2792.95,"text":"papers of a certain era, right? Like maybe from 1960 or 65. You will literally see just Kuhn-Tucker conditions, right? Anyway, they then later discovered, after like a decade or so, they discovered like a 1938 master's thesis by Karush."},{"start":2810.75,"text":"That everything in it, like everything, everything was in it, right? So then actually they did the right thing, which is to then popularize that it should be Khrushchev. But actually, the real story is that you should never, never, ever pretend that you did something first. Because number one, it's, you know, almost certainly Gauss knew about it. We can start with that, for sure. And then, you know, I mean, then, I don't know, I have..."},{"start":2834.96,"text":"I have friends who remind me that no, this is not the Koshi Schwartz inequality, it's the Bhattacharya inequality, which is like 500 years earlier, right? So it's like, anyway, you should also not hang out with people who say things like that. Like, I discovered something new, because it's extremely unlikely. All I can say is every time I ever looked into an allegation like that, they proved false."}],"speech_gaps":[],"frame":"../frames/v008/017.webp","frame_time":2699.28},{"title":"KKT条件与凸优化问题","segments":[{"id":149,"text":"So, right, including, by the way, myself. So, it's totally fine. Okay. So, anyway, sorry, that was just the story behind this, the name. Okay. So, here they are. These are the KKT conditions, and they are, it says, I have a, this is a problem with, I have differentiable functions here. That's what it's normally, they're extensions to non-differentiable, doesn't matter, but here's the way it works. And these are going to end up being,","zh":"所以，对，包括，顺便说一下，我自己。所以，完全没问题。好的。总之，抱歉，那只是这个名称背后的故事。好的。所以，这里它们是。这些是KKT条件，它说，我有一个，这是一个具有可微函数的问题。这是它们通常的情况，它们是针对不可微函数的扩展，这无关紧要，但这里是它的工作方式。这些最终会成为，","start":2859.98,"end":2886.1},{"id":150,"text":"conditions that for convex problems are actually the optimality conditions, right? So, but in general, here they are. It says, well, look, if you want to be a candidate for being optimal, you better satisfy the constraints, right? Otherwise, like, you're not a candidate, right? So the first one is you have to be feasible, okay? Oh, and by the way, what I'm doing is I'm, we're actually looking for, it's conditions that couple x, lambda, and nu.","zh":"对于凸问题来说，实际上是优化条件，对吧？所以，但一般来说，这里它们是。它说，好吧，如果你想成为最优解的候选者，你最好满足约束条件，对吧？否则，比如，你就不成为候选者，对吧？所以第一个条件是你必须可行，对吧？顺便说一下，我正在做的事情是我们实际上在寻找，这些是将x、lambda和nu联系起来的条件。","start":2887.07,"end":2913.45},{"id":151,"text":"right? The other one is, well, look, the dual, I mean, if the lambda has entries that are negative, it doesn't make any sense, right? Because it means you're basically being incented and paid to violate a constraint. And that's why it doesn't make any sense to have lambda i less than zero, any of the lambda i's negative, okay? That's this one.","zh":"对吧？另一个条件是，好吧，看，对偶性，我的意思是，如果lambda的元素是负数，那就没有意义，对吧？因为这意味着你基本上被激励和支付去违反一个约束。这就是为什么不能有任何lambda_i小于零，任何lambda_i为负数，对吧？这就是这个条件。","start":2914.02,"end":2943.34},{"id":152,"text":"Lagrange multiplier for an inequality constraint if and only if you're tight. That's what this says.","zh":"不等式约束的拉格朗日乘数当且仅当你处于紧约束时成立。这就是它所说的。","start":2943.96,"end":2950.42},{"id":153,"text":"And then the final one is this, is the gradient of the Lagrangian with respect to x vanishes. And that's just this condition. This is basically the gradient sub x of the Lagrangian, and that's this, right? And so, I mean, this is very much puts it in the style of calculus, right? Like this extends the following, right? If you want to minimize a convex function f0, then the optimality condition is the gradient of f0 is equal to 0, period, if it's differentiable. And that's actually necessary and sufficient. So this is generalizing that to include constraints.","zh":"然后最后一个条件是这个，即关于x的拉格朗日函数的梯度消失。这就是这个条件。这基本上是关于x的拉格朗日函数的梯度，这就是这个，对吧？因此，这非常类似于微积分的风格，对吧？就像它扩展了以下内容，对吧？如果你想最小化一个凸函数f0，那么优化条件是f0的梯度等于0，对吧，如果它是可微的。而这实际上是必要且充分的。因此，这将其推广到包括约束的情况。","start":2951.22,"end":2976.96},{"id":154,"text":"then the optimality condition is the gradient of f0 is equal to 0, period, if it's differentiable. And that's actually necessary and sufficient. So this is generalizing that to include constraints. And what we've seen is...","zh":"然后优化条件是f0的梯度等于0，对吧，如果它是可微的。而这实际上是必要且充分的。因此，这将其推广到包括约束的情况。而我们已经看到的是...","start":2977.96,"end":2995.7},{"id":155,"text":"If you have a convex problem and you have strong duality, actually, it turns out if you have any problem, even if it's not convex, if strong duality holds and you attain the x star, lambda star, nu star, then these KKT conditions hold, right? So not, oh, and you refer to in a problem, if x lambda nu satisfy the KKT conditions, that's referred to as a KKT point.","zh":"如果你有一个凸问题，并且满足强对偶性，实际上，你会发现，即使问题是非凸的，只要强对偶性成立，并且你得到了x星、lambda星、nu星，那么这些KKT条件就会成立，对吧？所以，如果你在一个问题中，x、lambda、nu满足KKT条件，这就被称为KKT点。","start":2996.14,"end":3022.22}],"notes":["本段讲解了KKT条件的基本概念，包括可行性、对偶性、互补松弛性和梯度消失条件。其中提到，如果λ的某些分量为负数，则意味着被激励去违反约束，这是不合理的，因此λ_i不能小于零。","互补松弛性指出，对于不等式约束，只有当约束条件被满足时，对应的拉格朗日乘子才可能为正。这表明约束条件和拉格朗日乘子之间存在一种互补关系。","梯度消失条件是KKT条件的一部分，它表示拉格朗日函数关于变量x的梯度为零，这是优化问题的必要条件。这类似于无约束优化中梯度为零的条件，但扩展到了有约束的情况。","在凸优化问题中，如果满足强对偶性，那么最优解x*、对偶变量λ*和ν*将满足KKT条件。即使问题不是凸的，只要强对偶性成立，KKT条件也成立。","KKT条件不仅适用于凸优化问题，也可以推广到非凸问题，只要满足强对偶性。这表明KKT条件是优化问题的必要条件，但不一定充分。","KKT点是指满足KKT条件的点，即x、λ和ν同时满足所有KKT条件。这为判断一个点是否为最优解提供了依据。"],"formulas":[{"latex":"\\nabla f_0(x^*) = 0","symbols":"梯度为零","explanation":"该公式表示在无约束优化问题中，当目标函数f0可微时，最优解x*的梯度为零。此条件是必要且充分的，适用于凸函数的情况。","evidence":"And then the final one is this, is the gradient of the Lagrangian with respect to x vanishes. And that's just this condition. This is basically the gradient sub x of the Lagrangian, and that's this, right? And so, I mean, this is very much puts it in the style of calculus, right? Like this extends the following, right? If you want to minimize a convex function f0,"},{"latex":"\\nabla_{x} L(x, \\lambda, \\nu) = 0","symbols":"拉格朗日函数关于x的梯度为零","explanation":"该公式表示在有约束优化问题中，拉格朗日函数L(x, λ, ν)关于x的梯度为零。这是KKT条件的一部分，用于寻找满足约束条件的最优解。","evidence":"And then the final one is this, is the gradient of the Lagrangian with respect to x vanishes. And that's just this condition. This is basically the gradient sub x of the Lagrangian, and that's this, right? And so, I mean, this is very much puts it in the style of calculus, right? Like this extends the following, right? If you want to minimize a convex function f0,"}],"uncertainties":["incented and paid to violate a constraint"],"diagram":"none","start":2859.98,"end":3022.22,"asr_flags":[],"math_clarifications":["KKT条件适用于凸优化问题，且在强对偶性成立时，即使问题非凸，只要满足KKT条件，即可得到最优解。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2859.98,"text":"So, right, including, by the way, myself. So, it's totally fine. Okay. So, anyway, sorry, that was just the story behind this, the name. Okay. So, here they are. These are the KKT conditions, and they are, it says, I have a, this is a problem with, I have differentiable functions here. That's what it's normally, they're extensions to non-differentiable, doesn't matter, but here's the way it works. And these are going to end up being,"},{"start":2887.07,"text":"conditions that for convex problems are actually the optimality conditions, right? So, but in general, here they are. It says, well, look, if you want to be a candidate for being optimal, you better satisfy the constraints, right? Otherwise, like, you're not a candidate, right? So the first one is you have to be feasible, okay? Oh, and by the way, what I'm doing is I'm, we're actually looking for, it's conditions that couple x, lambda, and nu."},{"start":2914.02,"text":"right? The other one is, well, look, the dual, I mean, if the lambda has entries that are negative, it doesn't make any sense, right? Because it means you're basically being incented and paid to violate a constraint. And that's why it doesn't make any sense to have lambda i less than zero, any of the lambda i's negative, okay? That's this one. And then finally, you have complementary slackness, right? That's this innocent thing that says, if you are, you can have a positive,"},{"start":2943.96,"text":"Lagrange multiplier for an inequality constraint if and only if you're tight. That's what this says."},{"start":2951.22,"text":"And then the final one is this, is the gradient of the Lagrangian with respect to x vanishes. And that's just this condition. This is basically the gradient sub x of the Lagrangian, and that's this, right? And so, I mean, this is very much puts it in the style of calculus, right? Like this extends the following, right? If you want to minimize a convex function f0,"},{"start":2977.96,"text":"then the optimality condition is the gradient of f0 is equal to 0, period, if it's differentiable. And that's actually necessary and sufficient. So this is generalizing that to include constraints. And what we've seen is..."},{"start":2996.14,"text":"If you have a convex problem and you have strong duality, actually, it turns out if you have any problem, even if it's not convex, if strong duality holds and you attain the x star, lambda star, nu star, then these KKT conditions hold, right? So not, oh, and you refer to in a problem, if x lambda nu satisfy the KKT conditions, that's referred to as a KKT point."}],"speech_gaps":[],"frame":"../frames/v008/018.webp","frame_time":2871.98},{"title":"KKT条件与凸优化的最优性","segments":[{"id":156,"text":"That's all it means. And then, you know, in the usual non-convex case, someone says, is it optimal? And you go, might be. Yeah, sure. I mean, it's like, look, it's the same thing as like if someone says minimize a non-convex function and you go, you know, I'll look at gradient equals zero. And you find a point where gradient is equal to zero and someone says, does that minimize your function? And the correct and legal answer is like, I don't know, maybe, could.","zh":"这就是它的全部意思。然后，在通常的非凸情况下，有人会问，这是最优的吗？你会回答，可能是。是的，当然。我的意思是，就像有人让你最小化一个非凸函数，你会说，我会看一下梯度等于零。你找到一个梯度等于零的点，有人问，这是否最小化了你的函数？正确的、合法的回答是，我不知道，也许，有可能。","start":3023.29,"end":3049.07},{"id":157,"text":"You know, possibly, right? So then they have a different word where they call it a stationary point, right? Or something like that. And maybe there's only five stationary points. Then you know one of them is going to be the best. Anyway, I won't go on. So these are KKT conditions. Okay. Now for a convex problem, this is cool. If you satisfy the KKT conditions, then you're optimal, right?","zh":"你知道，有可能，对吧？所以他们有一个不同的词，他们称之为驻点，对吧？或者类似的东西。也许只有五个驻点。然后你知道其中一个会是最好的。不管怎样，我就不多说了。这些就是KKT条件。好的。对于凸问题，这很酷。如果你满足KKT条件，那么你就是最优的，对吧？","start":3049.9,"end":3074.35},{"id":158,"text":"I mean, it's actually really cool. It basically says that, you know, complementary slackness means that when you look back at the Lagrangian, all those fi lambda i's, they're all zero, right? So, in fact, what it says is your objective value for these three things, right? The objective value at x tilde is also the Lagrangian, right? Now, the Lagrangian for a convex problem is convex because it's f0, which is convex, plus some lambda i. Lambda i are non-negative.","zh":"我的意思是，这实际上真的很酷。它基本上说明，互补松弛性意味着当你回顾拉格朗日函数时，所有的fi乘以lambda i都是零，对吧？事实上，它说的是这三个事物的目标值，对吧？在x tilde处的目标值也是拉格朗日函数，对吧？现在，凸问题的拉格朗日函数是凸的，因为它是由f0，这是一个凸函数，加上一些lambda i。lambda i是非负的。","start":3076.17,"end":3104.61},{"id":159,"text":"very important times fi that's that's convex right and then the last one is plus you know nu transpose and then some um some affine functions right that's also convex right so but if the gradient vanishes for a convex problem","zh":"非常重要的时候，fi是凸的，对吧？然后最后一个部分是加上你知道的nu转置，然后是一些嗯一些仿射函数，对吧？这也是凸的，对吧？所以，如果对于凸问题梯度消失","start":3105.04,"end":3121.36},{"id":160,"text":"It's a minimizer, right? So that says that when you minimize the Lagrangian, you actually get this. Oh, but then that means this holds, but that's the primal objective and the dual objective. If they're equal, then end of story. X tilde is optimal, primal optimal, and lambda star, nu star are dual optimal. Ready got this? So, okay.","zh":"它就是一个最小化器，对吧？所以这就说明，当你最小化拉格朗日函数时，你实际上会得到这个。哦，但这就意味着这个成立，但这是原始目标和对偶目标。如果它们相等，那就结束了。x tilde是最优的，原始最优，而lambda star，nu star是对偶最优的。明白了吗？好的。","start":3122.01,"end":3149.99},{"id":161,"text":"And, you know, you could get into stuff with Slater's condition. I actually don't want to. I think probably the best way to remember this is simply KKT conditions are a set of conditions that generalize the silly stuff from calculus. Well, they generalize gradient vanishing as the optimality condition for a convex function. It generalizes the 1830 Lagrange multiplier thing. So it says that the thing you were taught mindlessly in your calculus class, which is formed as Lagrangian.","zh":"此外，你可能会涉及到Slater条件的相关内容。实际上，我不想深入讨论这个话题。我认为记住KKT条件的最佳方式就是认识到它们是一组条件，这些条件将微积分中的一些简单内容进行了推广。换句话说，它们将梯度消失作为凸函数的最优性条件进行了推广。它还推广了1830年的拉格朗日乘数法。因此，它指出你在微积分课上被机械地教授的内容，即通过构造拉格朗日函数来形成的方法。","start":3150.86,"end":3177.42}],"notes":["讲者提到互补松弛性（complementary slackness）是KKT条件的一部分，它表明在拉格朗日函数中，某些约束条件的乘积为零。这说明在最优解处，某些约束可能不被激活。","讲者强调了拉格朗日函数的凸性，指出对于凸问题，拉格朗日函数是凸的，因为目标函数是凸的，且拉格朗日乘子是非负的。这为KKT条件的成立提供了理论基础。","讲者指出，当拉格朗日函数的最小值等于原始目标函数的最小值时，说明该点是原始问题和对偶问题的最优解。这表明KKT条件不仅适用于原始问题，也适用于对偶问题。","讲者提到Slater条件，但表示不打算深入讨论。他强调KKT条件是将微积分中梯度为零的条件推广到凸优化问题的工具，同时提到拉格朗日乘数法的起源，即1830年的拉格朗日乘数法。"],"formulas":[{"latex":"L(x, \\nu) = f_0(x) + \\nu^T (f(x) - b)","symbols":"拉格朗日函数","explanation":"拉格朗日函数的定义，其中 $ f_0(x) $ 是目标函数，$ f(x) $ 是约束函数，$ b $ 是约束值，$ \\nu $ 是拉格朗日乘数向量。","evidence":"I mean, it's actually really cool. It basically says that, you know, complementary slackness means that when you look back at the Lagrangian, all those fi lambda i's, they're all zero, right? So, in fact, what it says is your objective value for these three things, right? The objective value at x tilde is also the Lagrangian, right? Now, the Lagrangian for a convex problem is convex because it's f0, which is convex, plus some lambda i. Lambda i are non-negative."},{"latex":"f_i(x) \\nu_i = 0","symbols":"互补松弛性","explanation":"互补松弛性条件，表示在最优解处，约束函数 $ f_i(x) $ 与对应的拉格朗日乘数 $ \\nu_i $ 乘积为零。","evidence":"I mean, it's actually really cool. It basically says that, you know, complementary slackness means that when you look back at the Lagrangian, all those fi lambda i's, they're all zero, right? So, in fact, what it says is your objective value for these three things, right? The objective value at x tilde is also the Lagrangian, right? Now, the Lagrangian for a convex problem is convex because it's f0, which is convex, plus some lambda i. Lambda i are non-negative."}],"uncertainties":["very important times fi that's that's convex right and then the last one is plus you know nu transpose and then some um some affine functions right that's also convex right so but if the gradient vanishes for a convex problem"],"diagram":"none","start":3023.29,"end":3177.42,"asr_flags":[],"math_clarifications":["公式 1 是正确的拉格朗日函数定义，适用于凸优化问题。公式 2 不成立，因为拉格朗日函数通常不等于目标函数，除非拉格朗日乘数为零。公式 3 是互补松弛性条件，正确描述了在最优解处约束和拉格朗日乘数的关系。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3023.29,"text":"That's all it means. And then, you know, in the usual non-convex case, someone says, is it optimal? And you go, might be. Yeah, sure. I mean, it's like, look, it's the same thing as like if someone says minimize a non-convex function and you go, you know, I'll look at gradient equals zero. And you find a point where gradient is equal to zero and someone says, does that minimize your function? And the correct and legal answer is like, I don't know, maybe, could."},{"start":3049.9,"text":"You know, possibly, right? So then they have a different word where they call it a stationary point, right? Or something like that. And maybe there's only five stationary points. Then you know one of them is going to be the best. Anyway, I won't go on. So these are KKT conditions. Okay. Now for a convex problem, this is cool. If you satisfy the KKT conditions, then you're optimal, right?"},{"start":3076.17,"text":"I mean, it's actually really cool. It basically says that, you know, complementary slackness means that when you look back at the Lagrangian, all those fi lambda i's, they're all zero, right? So, in fact, what it says is your objective value for these three things, right? The objective value at x tilde is also the Lagrangian, right? Now, the Lagrangian for a convex problem is convex because it's f0, which is convex, plus some lambda i. Lambda i are non-negative."},{"start":3105.04,"text":"very important times fi that's that's convex right and then the last one is plus you know nu transpose and then some um some affine functions right that's also convex right so but if the gradient vanishes for a convex problem"},{"start":3122.01,"text":"It's a minimizer, right? So that says that when you minimize the Lagrangian, you actually get this. Oh, but then that means this holds, but that's the primal objective and the dual objective. If they're equal, then end of story. X tilde is optimal, primal optimal, and lambda star, nu star are dual optimal. Ready got this? So, okay."},{"start":3150.86,"text":"And, you know, you could get into stuff with Slater's condition. I actually don't want to. I think probably the best way to remember this is simply KKT conditions are a set of conditions that generalize the silly stuff from calculus. Well, they generalize gradient vanishing as the optimality condition for a convex function. It generalizes the 1830 Lagrange multiplier thing. So it says that the thing you were taught mindlessly in your calculus class, which is formed as Lagrangian."}],"speech_gaps":[],"frame":"../frames/v008/019.webp","frame_time":3035.29},{"title":"KKT条件与通信问题中的应用","segments":[{"id":162,"text":"Take the partial derivative with respect to x, set that equal to zero. Take the partial derivative with respect to these Lagrange multipliers, set that equal to zero. And you'd say, okay, cool, I did that. And you go, that's the solution. Anyway, it says it justifies, it generalizes that, and now it handles inequality constraints, right? So probably that's the best way to think of the KKT conditions.","zh":"对x求偏导数，将其设为零。对这些拉格朗日乘数求偏导数，将其设为零。你会说，嗯，不错，我做完了。然后你会说，这就是解。不管怎样，它说明了这一点，它推广了这一点，现在它可以处理不等式约束，对吧？所以这可能是理解KKT条件的最佳方式。","start":3177.76,"end":3205.6},{"id":163,"text":"And let me just give a little background on the problem. So the background on the problem is that I have a wireless device. In fact, it's actually happening all around us right now. So you have a wireless device. What I do is I want to communicate to another terminal over there. I divide that into like 512 channels. Each channel will have its own signal-to-noise ratio because other people are transmitting and other stuff is going down like that. That's the signal-to-noise ratio. And then the question is,","zh":"让我简单介绍一下这个问题的背景。这个问题的背景是，我有一个无线设备。事实上，这种情况现在就在我们周围发生着。你有一个无线设备。我的做法是，我想与远处的另一个终端进行通信。我把这分成像512个信道。每个信道都会有它自己的信噪比，因为其他人也在传输，其他东西也在传输，就像这样。这就是信噪比。然后问题是，","start":3207.27,"end":3235.57},{"id":164,"text":"which of those channels should I transmit on and at what powers and to maximize my bit rate. Again, you know, if you're not into communications, you don't need to know this. And so this is going to be the log of xi plus alpha. xi is going to be like the power I put into channel i. And this is actually going to be, with some constants out in front, it's going to be the bandwidth. It's the number of bits per second I can pump down channel i.","zh":"我应该在哪些信道上传输，以什么功率传输，以最大化我的比特率。再次强调，如果你不熟悉通信领域，你不需要知道这些。所以这实际上是xi加上alpha的对数。xi将是我在信道i上投入的功率。实际上，这会有一些常数系数，它会是带宽。它是我可以通过信道i传输的每秒比特数。","start":3236.24,"end":3261.98},{"id":165,"text":"Again, if you know, how many people here have taken like information theory or communication class or anything like that? That's all? Okay. It's cool? Fine. Okay. That's it. So this basically says, figure out the channel, the powers to transmit on all your channels to maximize your total bandwidth, right? And anyway, so here you write down the KKT conditions and they actually look like this, right? And this is one of those, you know,","zh":"再次强调，有多少人在这里上过信息论或通信课程，或者类似的东西？全都？好的。这很酷？好吧。就这样。所以这基本上是在说，找出信道，确定在所有信道上传输的功率，以最大化你的总带宽，对吧？不管怎样，这里你写下KKT条件，它们实际上看起来像这样，对吧？而且这属于那种，你知道的，","start":3262.46,"end":3291.8},{"id":166,"text":"extremely few problems where you can actually just sit out, get out your 19th century pencil and paper, and actually just solve the KKT conditions. Actually, I won't go into that, except I'll give you the interpretation. People figured this out in the 70s or something, and they were like, this is awesome. It's actually kind of silly, because even armed with the analytical formula, a numerical method will compute it just as fast.","zh":"极少有实际问题可以让你直接坐下来，拿出19世纪的铅笔和纸，然后直接求解KKT条件。实际上，我不会深入讲解这一点，除了给出其解释。人们在70年代左右发现了这一点，他们觉得这很了不起。实际上，这有点可笑，因为即使有了解析公式，数值方法计算起来也一样快。","start":3292.38,"end":3318.46},{"id":167,"text":"Not only that, you can add other constraints to it and stuff like that, and it'll still be just as fast. Anyway, so people who celebrate these, I mean, look, it's nice to have an analytical formula for something, but it is kind of silly in this day and age, right? So, okay, so here's the idea is these are the alphas, right? So if alpha is big, it means that there's a lot of noise on that channel.","zh":"不仅如此，你还可以向其中添加其他约束条件，甚至像这样处理，它仍然计算得同样快。总之，那些庆祝这些方法的人，我的意思是，拥有某个问题的解析公式当然是好事，但在当今时代，这有点可笑，对吧？所以，这里的想法是这些是α值，对吧？如果α很大，这意味着该信道上存在大量的噪声。","start":3319.24,"end":3347.54}],"notes":["本段主要讲解KKT条件的使用方法，即通过求偏导数并令其等于零来求解优化问题。同时，提到KKT条件可以处理不等式约束，这是其重要特性之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3177.76,"end":3347.54,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3177.76,"text":"Take the partial root of respect to x, set that equal to zero. Take the partial root of respect to these Lagrange multiples, set that equal to zero. And you'd say, okay, cool, I did that. And you go, that's the solution. Anyway, it says it justifies, it generalizes that, and now it handles inequality constraints, right? So probably that's the best way to think of the KKT conditions. Okay. So, you know, there's a handful of problems where you can actually solve things analytically. I'll just quickly go over one example. It's a famous one from communications."},{"start":3207.27,"text":"And let me just give a little background on the problem. So the background on the problem is that I have a wireless device. In fact, it's actually happening all around us right now. So you have a wireless device. What I do is I want to communicate to another terminal over there. I divide that into like 512 channels. Each channel will have its own signal-to-noise ratio because other people are transmitting and other stuff is going down like that. That's the signal-to-noise ratio. And then the question is,"},{"start":3236.24,"text":"which of those channels should I transmit on and at what powers and to maximize my bit rate. Again, you know, if you're not into communications, you don't need to know this. And so this is going to be the log of xi plus alpha. xi is going to be like the power I put into channel i. And this is actually going to be, with some constants out in front, it's going to be the bandwidth. It's the number of bits per second I can pump down channel i."},{"start":3262.46,"text":"Again, if you know, how many people here have taken like information theory or communication class or anything like that? That's all? Okay. It's cool? Fine. Okay. That's it. So this basically says, figure out the channel, the powers to transmit on all your channels to maximize your total bandwidth, right? And anyway, so here you write down the KKT conditions and they actually look like this, right? And this is one of those, you know,"},{"start":3292.38,"text":"extremely few problems where you can actually just sit out, get out your 19th century pencil and paper, and actually just solve the KKT conditions. Actually, I won't go into that, except I'll give you the interpretation. People figured this out in the 70s or something, and they were like, this is awesome. It's actually kind of silly, because even armed with the analytical formula, a numerical method will compute it just as fast."},{"start":3319.24,
