"text":"Not only that, you can add other constraints to it and stuff like that, and it'll still be just as fast. Anyway, so people who celebrate these, I mean, look, it's nice to have an analytical formula for something, but it is kind of silly in this day and age, right? So, okay, so here's the idea is these are the alphas, right? So if alpha is big, it means that there's a lot of noise on that channel."}],"speech_gaps":[],"frame":"../frames/v008/020.webp","frame_time":3189.76},{"title":"对偶性的实际应用","segments":[{"id":168,"text":"And then what it says is this height, the dark height, is actually the optimal, the power you should transmit at. And then what it does is it says flood this thing to a certain level until you have like one unit or whatever this is, one unit of water in here, right? When you do, here's what you'll find out. This channel, it's got a lot of noise and you should just put a little bit of power on it.","zh":"然后它说，这个高度，也就是暗色的高度，实际上是应该传输的最优功率。接着它说，将这个东西灌到某个水平，直到你有类似一个单位或者 whatever 这个是，一个单位的水在这里，对吧？当你这么做时，你会发现，这个信道有很多噪声，你应该只在这个信道上施加一点功率。","start":3348.69,"end":3374.07},{"id":169,"text":"This channel is so bad, you should put no power on it, right? No, we knew we were going to use this one. That's the cleanest channel you have, and you put a lot of power on it. Anyway, it's fine. For the people who raised their hand before, did you see water filling in that class? You did. Cool, okay. Did they know it was a convex problem? Yeah, I think so. They did? Okay, that's progress. Good. Good for them. These are my friends. Where was that?","zh":"这个信道这么差，你应该在这个信道上施加零功率，对吧？不，我们知道我们要使用这个信道。这是你拥有的最干净的信道，你应该在这个信道上施加大量功率。不管怎样，没关系。之前举手的人，你们看到水填满那个信道了吗？你们看到了。很好，好的。他们知道这是一个凸问题吗？是的，我想是的。他们知道吗？好的，这是进步。很好。很好。这些是我的朋友。那是在哪里？","start":3374.48,"end":3403.12},{"id":170,"text":"At Caltech. At Caltech. Yeah, they would know. Okay, fine. That's fine. Okay. Good. Fine. Okay. Okay, now we get to a very cool and incredibly practical and useful application of duality. Right? So, okay. So here it is. You start, here's your original problem, like this. Right? And now what we're going to do is we're going to imagine perturbing the constraints.","zh":"在加州理工学院。在加州理工学院。是的，他们会知道。好的，没关系。好的。好的。好的。好的，现在我们来到一个非常酷且极其实用和有用的对偶性应用。对吧？所以，好的。所以这里它就是。你开始，这里是你的原始问题，像这样。对吧？现在我们要做的事情是，想象扰动约束条件。","start":3404.2,"end":3433.11},{"id":171,"text":"Perturbing the constraints means we're going to change the right-hand side. So here, I'm going to put a UI for the inequality constraints and a VI for these. Super interesting. So let me say, and there's lots of language people would use to describe this. If UI is positive, it says you have relaxed the ith constraint. Everyone understand that? Because you relaxed it because you made it sort of easier, more exit-satisfying.","zh":"扰动约束条件意味着我们要改变右边的值。在这里，我要为不等式约束添加一个 UI，为这些添加一个 VI。非常有趣。让我这么说，有很多人会用语言来描述这个。如果 UI 是正的，它表示你放松了第 i 个约束。大家明白这一点吗？因为你放松了它，因为它变得更简单，更容易满足。","start":3434.32,"end":3462.79},{"id":172,"text":"Right. So it's basically that's what happened when I had a 50 milliwatt budget. I went back and said, can't do it. Can't design it. Sorry, I need more power. And then they came back and they said, cool, you get 55. Everybody following? So that's called. And then when you when you make UI negative, that's called like restricting. That's a restriction. Right. Because when I said I wanted five more milliwatts, presumably there's an overall budget somewhere of power. Somebody went.","zh":"对的。所以这基本上就是当我有一个 50 毫瓦预算时发生的事情。我回去说，做不到。不能设计它。抱歉，我需要更多功率。然后他们回来并说，很好，你可以得到 55 毫瓦。大家跟上了吗？这就是所谓的。然后当你让 UI 变成负数时，这就叫做限制。这就是一种限制。对吧？因为当我想要多 5 毫瓦时，显然在某个地方有一个总体的功率预算。有人去说了。","start":3463.31,"end":3490.51},{"id":173,"text":"whoever my manager was, went to someone designing another part of the system and said, hey, can I steal five milliwatts from you? Everybody following this? And they were like, I guess, you know, it's not going to be as good. And we're like, well, we know it's not as good because we're taking some power away from you, but okay, we'll do it. And we'll remember this at bonus time. I know something like that, right? Everybody. Okay. So that's, that's how this might work. Okay.","zh":"不管我的经理是谁，他都会去找设计系统另一部分的人，说，嘿，我可以从你那里偷走五毫瓦吗？大家明白吗？他们可能会说，我想，这可能不会那么好。而我们会说，好吧，我们知道这不会那么好，因为我们从你那里拿走了些功率，但没关系，我们就这样做吧。我们到时候在奖金时间记得这件事。我知道有类似的事情，对吧？大家。好的。所以这就是这可能如何运作的方式。好的。","start":3491.04,"end":3515.44}],"notes":["本段讲授了对偶性在实际问题中的应用，通过一个水填充的比喻来解释约束条件的松弛和限制。讲者提到，当UI（可能指某种变量）为正时，表示约束被放松，使得问题更容易满足；当UI为负时，表示约束被收紧，使得问题更严格。这种对偶性在优化问题中非常重要，因为它允许我们从不同的角度分析问题。","讲者通过一个具体的例子来说明松弛和限制的概念：当预算不足时，需要增加预算，这相当于放松约束；而当需要减少预算时，相当于收紧约束。这种调整会影响最终的优化结果，但可以通过对偶性来分析和处理。","讲者还提到，这种对偶性在实际工程中非常有用，例如在系统设计中，不同部分之间可能会有资源的分配和调整。通过理解对偶性，可以更好地进行资源优化和系统设计。","讲者提到，学生在课堂上通过水填充的比喻理解了这些概念，这表明教学中使用直观的比喻有助于学生理解抽象的数学概念。","讲者还提到，学生可能已经知道这是一个凸问题，这表明他们对凸优化的基本概念有了一定的理解，而对偶性是凸优化中的一个重要工具。","最后，讲者通过一个实际的工程场景，说明了如何在实际中应用对偶性，这表明对偶性不仅是一个理论工具，而且在实际问题中也有广泛的应用。"],"formulas":[],"uncertainties":["UI 和 VI 的具体含义可能不明确，可能是某种变量或术语的误识别。","讲者提到的“50 milliwatt budget”和“55 milliwatt”可能涉及具体的数值，但未明确说明其数学关系。","讲者提到的“steal five milliwatts”可能涉及资源分配的数学模型，但未明确说明其数学表达式。"],"diagram":"none","start":3348.69,"end":3515.44,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3348.69,"text":"And then what it says is this height, the dark height, is actually the optimal, the power you should transmit at. And then what it does is it says flood this thing to a certain level until you have like one unit or whatever this is, one unit of water in here, right? When you do, here's what you'll find out. This channel, it's got a lot of noise and you should just put a little bit of power on it."},{"start":3374.48,"text":"This channel is so bad, you should put no power on it, right? No, we knew we were going to use this one. That's the cleanest channel you have, and you put a lot of power on it. Anyway, it's fine. For the people who raised their hand before, did you see water filling in that class? You did. Cool, okay. Did they know it was a convex problem? Yeah, I think so. They did? Okay, that's progress. Good. Good for them. These are my friends. Where was that?"},{"start":3404.2,"text":"At Caltech. At Caltech. Yeah, they would know. Okay, fine. That's fine. Okay. Good. Fine. Okay. Okay, now we get to a very cool and incredibly practical and useful application of duality. Right? So, okay. So here it is. You start, here's your original problem, like this. Right? And now what we're going to do is we're going to imagine perturbing the constraints."},{"start":3434.32,"text":"Perturbing the constraints means we're going to change the right-hand side. So here, I'm going to put a UI for the inequality constraints and a VI for these. Super interesting. So let me say, and there's lots of language people would use to describe this. If UI is positive, it says you have relaxed the ith constraint. Everyone understand that? Because you relaxed it because you made it sort of easier, more exit-satisfying."},{"start":3463.31,"text":"Right. So it's basically that's what happened when I had a 50 milliwatt budget. I went back and said, can't do it. Can't design it. Sorry, I need more power. And then they came back and they said, cool, you get 55. Everybody following? So that's called. And then when you when you make UI negative, that's called like restricting. That's a restriction. Right. Because when I said I wanted five more milliwatts, presumably there's an overall budget somewhere of power. Somebody went."},{"start":3491.04,"text":"whoever my manager was, went to someone designing another part of the system and said, hey, can I steal five milliwatts from you? Everybody following this? And they were like, I guess, you know, it's not going to be as good. And we're like, well, we know it's not as good because we're taking some power away from you, but okay, we'll do it. And we'll remember this at bonus time. I know something like that, right? Everybody. Okay. So that's, that's how this might work. Okay."}],"speech_gaps":[],"frame":"../frames/v008/021.webp","frame_time":3360.69},{"title":"等式约束与扰动分析","segments":[{"id":174,"text":"Equality constraints, it's also super duper interesting, a perturbation. So here's an example, which is extremely practical and universal. Let's suppose we're optimizing an energy system. So power flows across, let's say, the entire California grid. Some of the equality constraints basically are flow conservation.","zh":"等式约束也非常有趣，是一种扰动。这里有一个例子，它极其实用且普遍。假设我们正在优化一个能源系统。电力在，比如说，整个加州电网中流动。其中一些等式约束基本上是流量守恒。","start":3517.05,"end":3538.79},{"id":175,"text":"You point to some place, some substation, and it says basically the sum of the powers coming in from the 115 kilovolt lines is going to equal the sum of the powers going out over these 15 kilovolt distribution lines. That's power conservation. Everybody got that? Okay. So then...","zh":"你指着某个地方，某个变电站，它基本上表示从115千伏线路流入的功率总和等于通过这些15千伏配电线流出的功率总和。这就是功率守恒。大家明白了吗？好的。那么……","start":3539.55,"end":3564.27},{"id":176,"text":"What happens if you perturb? So zero here means power coming in is equal to power going out. If you perturb it, if I put a number there like plus, it actually is weird. It basically means roll a truck out over to that substation, hook up a wire to it, and either suck some extra power out or pump some in.","zh":"如果发生扰动呢？这里的零意味着流入的功率等于流出的功率。如果你对其进行扰动，比如加上一个数值，这实际上很奇怪。它基本上意味着把一辆卡车开到那个变电站，连接一根电线，要么从该节点抽取额外的功率，要么向其注入功率。","start":3564.73,"end":3587.62},{"id":177,"text":"Because that's what it means, right? It says, in that case, you're saying, no, no, the total power, you know, the net power, well, let's say it's the net power going into a node in a power system. Normally that should be zero, right? But if I say, no, it can be like a megawatt or something like that. If it's a megawatt, that means I've changed, vi is non-zero, and what that means is the sum of the powers of, what that means is I'm sucking out one megawatt from that node.","zh":"因为这就是它的意思，对吧？它表示在这种情况下，你表示，不，不，总功率，你知道的，净功率，比如说，是电力系统中一个节点的净功率。通常这个值应该是零，对吧？但如果我说，不，它可以是兆瓦之类的。如果它是兆瓦，这意味着vi不为零，而这意味着从该节点抽取了一兆瓦的功率。","start":3588.14,"end":3615.36},{"id":178,"text":"Okay, so actually keep that idea in mind. So this is just to say what perturbations are. And perturbations are obvious in other areas as well, right? What they mean, but they always mean something sort of interesting. Okay, so we're interested in this perturbed problem. And we're actually, we're super interested in what happens with the optimal value.","zh":"好的，所以实际上要记住这个想法。这就是在说明扰动是什么。扰动在其他领域也很明显，对吧？它们的意思，但它们总是意味着某种有趣的事情。好的，我们感兴趣的是这个扰动问题。我们实际上非常感兴趣的是最优值会发生什么变化。","start":3616.02,"end":3637.54},{"id":179,"text":"when you have non-zero UIs and Vs, right? So let's talk about that. In this case, if I increase UI, you tell me what happens to the optimal value of this thing. If the UIs are positive, what? Down. It's got to go down. Yeah. Well, okay. It could stay the same, right? By the way, it would stay the same if that inequality constraint was slack.","zh":"当你有非零的UI和Vs时，对吧？让我们来谈谈这一点。在这种情况下，如果我增加UI，你告诉我这个东西的最优值会发生什么变化。如果UI是正的，会发生什么？会下降。它必须下降。是的。好吧，它也可能保持不变，对吧？顺便说一句，如果这个不等式约束是松弛的，它也会保持不变。","start":3639.44,"end":3668.31}],"notes":["本段讲解了等式约束在电力系统中的实际应用，特别是关于功率守恒的约束条件。当系统中某个节点的输入功率与输出功率不相等时，意味着该节点存在额外的功率注入或抽取，这可以通过物理手段（如连接卡车和电线）来实现。","讲者通过具体例子说明了扰动的概念，即当等式约束的值发生变化时，系统的行为也会随之改变。例如，当节点的净功率变为正值时，意味着该节点正在消耗额外的功率。","讲者进一步讨论了扰动对最优值的影响，指出当不等式约束的松弛度为零时，最优值可能会保持不变。这表明在优化问题中，约束条件的松弛度对最优解有重要影响。","讲者强调了扰动在不同领域中的普遍性，并指出扰动通常意味着某种有趣的系统行为变化。这为后续讨论扰动对最优值的影响奠定了基础。","讲者通过具体例子说明了扰动对最优值的影响，指出当不等式约束的松弛度为零时，最优值可能会保持不变。这表明在优化问题中，约束条件的松弛度对最优解有重要影响。","讲者通过具体例子说明了扰动对最优值的影响，指出当不等式约束的松弛度为零时，最优值可能会保持不变。这表明在优化问题中，约束条件的松弛度对最优解有重要影响。"],"formulas":[],"uncertainties":["vi is non-zero"],"diagram":"none","start":3517.05,"end":3668.31,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3517.05,"text":"Equality constraints, it's also super duper interesting, a perturbation. So here's an example, which is extremely practical and universal. Let's suppose we're optimizing an energy system. So power flows across, let's say, the entire California grid. Some of the equality constraints basically are flow conservation."},{"start":3539.55,"text":"You point to some place, some substation, and it says basically the sum of the powers coming in from the 115 kilovolt lines is going to equal the sum of the powers going out over these 15 kilovolt distribution lines. That's power conservation. Everybody got that? Okay. So then..."},{"start":3564.73,"text":"What happens if you perturb? So zero here means power coming in is equal to power going out. If you perturb it, if I put a number there like plus, it actually is weird. It basically means roll a truck out over to that substation, hook up a wire to it, and either suck some extra power out or pump some in. Everybody got that?"},{"start":3588.14,"text":"Because that's what it means, right? It says, in that case, you're saying, no, no, the total power, you know, the net power, well, let's say it's the net power going into a node in a power system. Normally that should be zero, right? But if I say, no, it can be like a megawatt or something like that. If it's a megawatt, that means I've changed, vi is non-zero, and what that means is the sum of the powers of, what that means is I'm sucking out one megawatt from that node. Everybody got that?"},{"start":3616.02,"text":"Okay, so actually keep that idea in mind. So this is just to say what perturbations are. And perturbations are obvious in other areas as well, right? What they mean, but they always mean something sort of interesting. Okay, so we're interested in this perturbed problem. And we're actually, we're super interested in what happens with the optimal value."},{"start":3639.44,"text":"when you have non-zero UIs and Vs, right? So let's talk about that. In this case, if I increase UI, you tell me what happens to the optimal value of this thing. If the UIs are positive, what? Down. It's got to go down. Yeah. Well, okay. It could stay the same, right? By the way, it would stay the same if that inequality constraint was slack."}],"speech_gaps":[],"frame":"../frames/v008/022.webp","frame_time":3529.05},{"title":"约束松弛与对偶问题","segments":[{"id":180,"text":"You agree with that, right? Like you'd say, I had a 50 milliwatt thing. I designed my chip and I just did my power analysis. I'm coming in at 48 milliwatts. Everybody following this? And then somebody comes to me and says, fantastic news. I've got the best news ever for you. Remember I said you had 50 milliwatt budget? I'm giving you 55. And what is the consequence in that case? There's no consequence at all. You're like, I don't need it because I'm coming in at 48. I don't even need your stupid 50. Here, take two back.","zh":"你同意这个观点吗？比如说，你会说，我有一个50毫瓦的东西。我设计了我的芯片，并进行了功耗分析，结果我只消耗了48毫瓦。大家跟得上吗？然后有人跑来对我说，太棒了，我有最好的消息要告诉你。还记得我之前说你们有50毫瓦的预算吗？我现在给你们55毫瓦。在这种情况下会有什么后果呢？根本没有后果。你会说，我根本不需要，因为我只用了48毫瓦。我甚至不需要你的愚蠢的50毫瓦预算。给你，拿回去两个。","start":3669.18,"end":3699.95},{"id":181,"text":"Okay, don't say that. But you could say something like that if you wanted, and that would be completely reasonable. Everybody following this? Okay. So, and if UI is negative, so you tighten the constraint, what happens to the optimal value of this problem? It's going to go up. Once again, if the constraint is slack, it might not go up at all. Because they go, yep, sorry, I'm dropping you from 50 milliwatt budget to 49. And you go, well, okay, whatever.","zh":"好吧，不要这么说。但如果你想说的话，你可以说类似这样的话，这完全合理。大家跟得上吗？好的。如果UI是负的，也就是说你收紧了约束，这个问题的最优值会发生什么变化？它会增加。再一次，如果约束是松弛的，它可能根本不会增加。因为他们会说，抱歉，我把你从50毫瓦的预算降到了49毫瓦。你会说，好吧，随便你。","start":3700.82,"end":3729.42},{"id":182,"text":"They go, aren't you going to redesign your part? And you go like, no, because my current part's only coming in at 48. Everybody following this, right? But if it were tight, you're going to pay for it, including, quite possibly, it'll become infeasible. Everybody, that can happen. Yeah. Yeah, yeah. So that's a strong form of an increase in P star, is P star will become infinity, right? So it can happen. Okay. So...","zh":"他们会问，你不会重新设计你的部分吗？你会说，不会，因为我的当前部分只消耗了48毫瓦。大家跟得上吗，对吧？但如果这个约束是紧的，你就会为此付出代价，甚至有可能导致问题变得不可行。大家，这种情况可能发生。是的。是的。所以这是一种强烈的P星增加的形式，即P星会变成无穷大，对吧？这种情况可能发生。好的。","start":3730.0,"end":3757.33},{"id":183,"text":"What happens here is if you work out the dual of this problem, that's that, and here's the dual here, and this is only because we've shifted these things like that. So we're interested in what this... Oh, by the way, if there's only just one of these, then the way you do this is you just plot it, right? And that would be called a trade-off curve, right? Like suppose, I don't know, here, this is power. Then you simply...","zh":"这里发生的情况是，如果你计算这个问题的对偶问题，那就是这个样子的，这里是这个对偶问题，而这仅仅是因为我们这样移动了这些变量。我们感兴趣的是这个……顺便说一句，如果只有一个这样的约束，那么你只需要把它画出来就可以了，对吧？这被称为权衡曲线，对吧？比如说，我不知道，这里这是功耗。然后你只需要……","start":3758.15,"end":3786.38},{"id":184,"text":"Re-synthesize the circuit with power budgets running from, with UI run, whatever, with a limit running from 10 milliwatts to 80. And you get a curve. And someone would say, what's that? And you go, that's the optimal trade-off curve of my objective with respect to the power I am allocated. Everybody got that? So you do something like that. So there's just one. And then that's literally just this thing here. That's when there's only just one variable, right? And it requires you to solve a whole bunch of problems, right? So no problem.","zh":"重新综合电路，功率预算从UI运行开始，无论怎样，运行范围从10毫瓦到80毫瓦。你得到一条曲线。然后有人会问，这是什么？你会回答，这是我在分配的功率下，目标函数的最优权衡曲线。大家明白了吗？所以你这样做。所以只有一个变量。然后这其实就是这里的东西。当只有一个变量时就是这种情况，对吧？这需要你解决一系列问题，对吧？所以没问题。","start":3786.68,"end":3816.04},{"id":185,"text":"Okay um but here we're going to get a lot of information actually for local information for free um and it's this so it turns out um that weak duality here just gives you kind of a very cool inequality it says that that the perturbed optimal cost is bigger than or equal to","zh":"嗯，但在这里，我们实际上会免费获得大量的局部信息，并且这就是，结果发现，弱对偶性在这里给你一个非常酷的不等式，它说明扰动后的最优成本大于或等于","start":3816.46,"end":3839.58}],"notes":["本段讨论了约束松弛对优化问题最优值的影响。当约束变紧（UI为负）时，最优值会增加，但如果约束原本是松弛的，最优值可能不会增加。这说明约束的松紧程度直接影响优化结果，而当约束变紧时，可能导致问题变得不可行。","讲者通过一个电路设计的例子来说明这一概念。当预算从50毫瓦减少到49毫瓦时，设计者不需要重新设计，因为当前设计已经满足更低的预算。但如果约束是紧的，减少预算可能导致问题不可行，甚至最优值趋于无穷大。","讲者进一步提到对偶问题的构建，以及如何通过绘制贸易曲线来表示目标函数与约束之间的关系。当只有一个变量时，可以通过绘制不同预算下的最优解来得到贸易曲线。","最后，讲者提到弱对偶性提供了一个不等式，即扰动后的最优成本大于等于某个值。这表明弱对偶性可以提供关于优化问题的有用信息，尤其是在局部信息免费的情况下。","这些例子和讨论帮助学生理解约束变化对优化问题的影响，以及如何利用对偶性来分析和解决实际问题。"],"formulas":[{"latex":"P^* \\text{ 增加当约束被收紧，且当约束松弛时，$ P^* $ 可能保持不变。}","symbols":"$ P^* $ 表示最优值，约束变紧时 $ P^* $ 增加，约束松弛时 $ P^* $ 可能不变。","explanation":"该公式正确描述了约束变化对最优值的影响，无需修改。","evidence":"Okay, don't say that. But you could say something like that if you wanted, and that would be completely reasonable. Everybody following this? Okay. So, and if UI is negative, so you tighten the constraint, what happens to the optimal value of this problem? It's going to go up. Once again, if the constraint is slack, it might not go up at all. Because they go, yep, sorry, I'm dropping you from 50 milliwatt budget to 49. And you go, well, okay, whatever. They go, aren't you going to redesign your part? And you go like, no, because my current part's only coming in at 48. Everybody following this, right? But if it were tight, you're going to pay for it, including, quite possibly, it'll become infeasible. Everybody, that can happen. Yeah. Yeah, yeah. So that's a strong form of an increase in P star, is P star will become infinity, right? So it can happen. Okay. So..."}],"uncertainties":["UI run, whatever"],"diagram":"none","start":3669.18,"end":3839.58,"asr_flags":[],"math_clarifications":["公式描述了约束变化对最优值的影响，符合数学逻辑，无需进一步修正。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3669.18,"text":"You agree with that, right? Like you'd say, I had a 50 milliwatt thing. I designed my chip and I just did  I say here have some more resources, you'll see this makes a prediction that the objective is going to go down. The amount the objective goes down can't be more than that, but it could be less. Everybody got this? Okay, so this is super useful, and it's weird and asymmetric, so you need to spend some time.","zh":"如果你说这里给你一些更多的资源，你会看到这个预测目标值会下降。目标值下降的量不能超过这个量，但可能更少。大家明白了吗？好的，所以这非常有用，而且它很奇怪且不对称，所以你需要花一些时间。你大概需要找个安静的地方仔细看看，因为它有各种各样的含义。有些是显而易见的，但它奇怪且不对称，因为这个不等式。所以它基本上说，如果你有一个大的约束条件，且这个约束条件有一个大的拉格朗日乘数，那么，你必须听懂英语。这是因为它的措辞非常谨慎，对吧？","start":3895.98,"end":3921.1},{"id":189,"text":"you know, basically go to a quiet place and look at this because it's got all sorts of implications. Some are obvious, but it's weird and asymmetric because of this inequality. So it basically says, if I have a large, if I have a constraint that has a large inequality constraint with a large Lagrange multiplier, then, and you have to listen to English. It's because it's going to be very carefully worded, right?","zh":"它说，基本上在这种情况下，如果你限制这个问题，那么你的最优目标值肯定会增加，对吧？有人可能会问，你是否想要重新求解它？你会回答，第一，不，谢谢，因为合成电路需要我12个小时。第二，你不需要这么做。你会说，它至少会增加这个量。有人可能会问，它会不会增加更多？你会回答，是的，当然，它可能会增加更多，但它不能减少。","start":3921.66,"end":3947.79},{"id":190,"text":"It says, basically, in that case, if you restrict that problem, then your optimal objective will for sure go up, right? And someone would say, did you want to re-resolve it? And you go, well, number one, no thanks, because it takes me 12 hours to synthesize the circuit. But number two, you don't have to. And you'd say, it's going to go up at least by this amount. And someone would say, could it go up more? And you go, yeah, sure, it could go up more, but it can't go up less.","zh":"它说，基本上在这种情况下，如果你限制这个问题，那么你的最优目标值肯定会增加，对吧？有人可能会问，你是否想要重新求解它？你会回答，第一，不，谢谢，因为合成电路需要我12个小时。第二，你不需要这么做。你会说，它至少会增加这个量。有人可能会问，它会不会增加更多？你会回答，是的，当然，它可能会增加更多，但它不能减少。","start":3948.4,"end":3974.96},{"id":191,"text":"They'd say, could it go up to plus infinity? And the answer is, yep, it could. It absolutely could. Everybody following this? Now, on the other hand, it's asymmetric. If lambda i star is large, then I say to you, I'm going to give you some more resources. First of all, you should be happy. But when you do that, and I ask you what's going to happen to your p star,","zh":"他们会问，这个值会不会上升到正无穷？答案是，会的，确实会。大家都跟上了吗？另一方面，它是不对称的。如果λ_i*很大，我会告诉你，我会给你更多的资源。首先，你应该会很高兴。但当你这样做时，我会问你，你的p*会发生什么变化，","start":3976.65,"end":3999.73}],"notes":["本段讲解了凸优化中对偶性与约束变化之间的关系，特别是当约束条件被收紧或放宽时，目标函数的变化趋势。讲者指出，当约束被收紧时，目标函数至少会增加一定量，而由于凸性，它会增加更多。相反，当资源增加时，目标函数会减少，但减少的幅度不会超过某个值。","讲者强调了这种关系的不对称性，即当拉格朗日乘子较大时，约束收紧会导致目标函数增加，而资源增加则可能导致目标函数减少。这种不对称性源于不等式约束的性质，以及凸优化问题的结构。","讲者通过举例说明了这种关系的实际意义，例如在电路综合问题中，由于计算成本高，人们通常不会重新求解问题，而是直接根据拉格朗日乘子的大小预测目标函数的变化。","讲者还提到，当拉格朗日乘子很大时，目标函数的变化幅度可能很大，甚至可能趋向于正无穷，这表明约束条件对目标函数的影响可能非常显著。","此外，讲者指出，这种关系在实际应用中非常重要，因为它允许人们在不重新求解问题的情况下，预测目标函数的变化趋势，从而节省计算资源。","最后，讲者提醒学生要仔细理解这种关系，因为它在凸优化中具有重要的理论和应用价值。"],"formulas":[],"uncertainties":["UI negative"],"diagram":"none","start":3840.57,"end":3999.73,"asr_flags":[],"math_clarifications":["所有公式均缺乏明确的数学表达，仅包含符号和文字描述，无法确定其数学含义，因此均被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3840.57,"text":"the unperturbed optimal cost minus these things. And this is weird. This is global. This is not local. It's not approximate. It is global. And in fact, it kind of makes sense because look at this here. This curve, that's P star. This is P star of U, this curve. This is U, right? And this curve is P star. And what this says, this thing here is exactly the right-hand side there."},{"start":3869.3,"text":"It's essentially this tangent plane there. And what it says, and you can see it's actually kind of correct. This says if I tighten your budget, so I have UI negative, you go over here. This says it's got to go up at least this amount. And of course, it's convex, so it goes up more than that amount. Everybody got that? Including, by the way, it could go up to plus infinity, right? On the other hand, if I give you more budget,"},{"start":3895.98,"text":"If I say here have some more resources, you'll see this makes a prediction that the objective is going to go down. The amount the objective goes down can't be more than that, but it could be less. Everybody got this? Okay, so this is super useful, and it's weird and asymmetric, so you need to spend some time."},{"start":3921.66,"text":"you know, basically go to a quiet place and look at this because it's got all sorts of implications. Some are obvious, but it's weird and asymmetric because of this inequality. So it basically says, if I have a large, if I have a constraint that has a large inequality constraint with a large Lagrange multiplier, then, and you have to listen to English. It's because it's going to be very carefully worded, right?"},{"start":3948.4,"text":"It says, basically, in that case, if you restrict that problem, then your optimal objective will for sure go up, right? And someone would say, did you want to re-resolve it? And you go, well, number one, no thanks, because it takes me 12 hours to synthesize the circuit. But number two, you don't have to. And you'd say, it's going to go up at least by this amount. And someone would say, could it go up more? And you go, yeah, sure, it could go up more, but it can't go up less."},{"start":3976.65,"text":"They'd say, could it go up to plus infinity? And the answer is, yep, it could. It absolutely could. Everybody following this? Now, on the other hand, it's asymmetric. If lambda i star is large, then I say to you, I'm going to give you some more resources. First of all, you should be happy. But when you do that, and I ask you what's going to happen to your p star,"}],"speech_gaps":[],"frame":"../frames/v008/024.webp","frame_time":3852.57},{"title":"凸优化中的拉格朗日乘数与资源分配","segments":[{"id":192,"text":"I mean, you could say a couple, but let's be very careful about what we're saying. Here would be the correct and careful way to say it. You'd say, first of all, number one, thank you for the additional resources. That's very important. You have to say that first. Okay, so you say that. Then here's what happens. Then they'd say, great, you know, use it well. And you go, oh, I will. And they'd say, what's going to happen to your objective?","zh":"我的意思是，你可以这么说，但我们要非常小心我们说的是什么。这里正确的、谨慎的说法应该是这样的。你首先会说，首先，感谢额外的资源。这非常重要。你必须先说这一点。好的，所以你这样说。然后接下来会发生什么。然后他们会说，很好，你知道的，好好利用它。你会说，哦，我会的。然后他们会问，你的目标会发生什么变化？","start":4001.11,"end":4024.95},{"id":193,"text":"And they would say, great question. Good news, lambda star is positive. You'd say, well, I predict it's going to go down quite a bit. And they go, well, what do you mean predict? I just gave you some more resources. And then you'd say, okay, I predict it. It probably will, but I can't guarantee it because the actual decrease might be less than what I predict. Everyone got that? And in fact, you can easily imagine, I'll draw a...","zh":"他们会说，这是个好问题。好消息是，lambda 星是正的。你会说，嗯，我预测它会下降很多。然后他们会说，你是什么意思预测？我刚刚给你了一些更多的资源。然后你会说，好的，我预测它会下降，但它可能不会像我预测的那样下降，我不能保证。大家明白了吗？事实上，你可以很容易地想象，我会画一个……","start":4025.75,"end":4053.58},{"id":194,"text":"I'll draw a sad case here that goes like this. Here's a sad case. You do this, like this, and then this thing looks like this. That's good enough. Then it just flattens out, like right there. Here's your Lagrange multiplier. Here's your optimal Lagrange multiplier. It's pretty hefty. Whoever is allocating you more resources...","zh":"我会在这里画一个悲伤的案例，情况如下。这是一个悲伤的案例。你这样做，像这样，然后这个东西看起来像这样。这已经足够好了。然后它就会平缓下来，就像在这里。这是你的拉格朗日乘数。这是你的最优拉格朗日乘数。它相当大。无论谁给你更多资源……","start":4054.23,"end":4083.22},{"id":195,"text":"is expecting your objective to go down if they give you this much more. They're expecting it to go down to this. But what you can see here is it doesn't. Because you didn't know it, but you were just barely at the limit when getting additional resources was not going to help you. Everybody got this? So these are weird and asymmetric and very cool and all that kind of stuff. And also, this is now unbelievably, this is super useful. Because as I said before, when you solve a problem,","zh":"都期望你的目标在给你这么多资源后会下降。他们期望它下降到这个程度。但你可以看到的是，它并没有下降。因为你不知道这一点，但你在获得额外资源时已经接近极限，所以这些资源对你没有帮助。大家明白了吗？所以这些情况是奇怪的、不对称的，而且非常酷，诸如此类。而且，这现在变得不可思议地有用。正如我之前所说，当你解决一个问题时，","start":4084.23,"end":4111.34},{"id":196,"text":"Whether you like it or not, you're going to get optimal Lagrange multipliers, okay? So that's, and this is awesome because it allows you to do, in fact, I'll tell you a story about this from a long time ago, but people doing circuit design, right?","zh":"无论你是否喜欢，你都会得到最优的拉格朗日乘数，对吧？所以这很了不起，因为它允许你做一件事。事实上，我会告诉你一个很久以前的故事，但人们在做电路设计时，对吧？","start":4111.88,"end":4125.46},{"id":197,"text":"You have 50 constraints, right? You'd say, oh, my phase margin has to exceed this. I need to be able to do this. My power should be less than that. My area should be less than that. This should be that, blah, blah, blah. My swing should be this. What is it? My third order distortion has to be less than that. You have all these things, right? And so you design it, right? Out of your 50 constraints, it's quite typical that only 10 or 15 are going to be tight. Everybody following this? Then the question is,","zh":"你有50个约束条件，对吧？你会说，哦，我的相位裕度必须超过这个值。我需要能够做到这一点。我的功耗应该小于那个值。我的面积应该小于那个值。这个应该等于那个， blah, blah, blah。我的摆幅应该是这个。这是什么？我的三次谐波失真必须小于那个值。你有所有这些条件，对吧？然后你进行设计，对吧？在你的50个约束条件中，通常只有10个或15个会是紧约束。大家跟得上吗？然后问题是，","start":4126.54,"end":4154.87}],"notes":["本段主要讲解了拉格朗日乘数在资源分配中的作用，特别是当资源增加时，目标函数的变化情况。讲者指出，虽然拉格朗日乘数λ*是正的，但并不能保证目标函数一定会显著下降，因为实际下降可能小于预测值。这体现了优化问题中预测与实际之间的不确定性。","讲者通过一个‘悲伤的案例’来说明，当资源增加时，目标函数可能不会显著下降，因为系统可能已经接近极限。这种现象展示了优化问题中资源分配的非对称性和复杂性。","讲者提到，当解决优化问题时，通常会得到最优的拉格朗日乘数，这在实际应用中非常有用。例如，在电路设计中，有50个约束条件，但通常只有10到15个约束是紧的，这说明了实际问题中约束条件的稀疏性。","讲者强调，即使在资源增加的情况下，目标函数的变化也可能不显著，这取决于系统是否已经接近极限。这种现象在优化问题中是常见的，但需要仔细分析。","讲者通过电路设计的例子，说明了拉格朗日乘数在实际应用中的重要性。在设计过程中，虽然有大量约束条件，但只有部分约束是关键的，这有助于优化设计过程。","讲者指出，当资源增加时，拉格朗日乘数的值可能较大，这表明资源分配对目标函数的影响较大。然而，实际效果可能不如预期，这需要进一步分析和验证。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4001.11,"end":4154.87,"asr_flags":[],"math_clarifications":["原文中未出现任何数学公式或明确的数学表达式，仅包含对话内容，因此无法进行数学公式核对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4001.11,"text":"I mean, you could say a couple, but let's be very careful about what we're saying. Here would be the correct and careful way to say it. You'd say, first of all, number one, thank you for the additional resources. That's very important. You have to say that first. Okay, so you say that. Then here's what happens. Then they'd say, great, you know, use it well. And you go, oh, I will. And they'd say, what's going to happen to your objective?"},{"start":4025.75,"text":"And they would say, great question. Good news, lambda star is positive. You'd say, well, I predict it's going to go down quite a bit. And they go, well, what do you mean predict? I just gave you some more resources. And then you'd say, okay, I predict it. It probably will, but I can't guarantee it because the actual decrease might be less than what I predict. Everyone got that? And in fact, you can easily imagine, I'll draw a..."},{"start":4054.23,"text":"I'll draw a sad case here that goes like this. Here's a sad case. You do this, like this, and then this thing looks like this. That's good enough. Then it just flattens out, like right there. Here's your Lagrange multiplier. Here's your optimal Lagrange multiplier. It's pretty hefty. Whoever is allocating you more resources..."},{"start":4084.23,"text":"is expecting your objective to go down if they give you this much more. They're expecting it to go down to this. But what you can see here is it doesn't. Because you didn't know it, but you were just barely at the limit when getting additional resources was not going to help you. Everybody got this? So these are weird and asymmetric and very cool and all that kind of stuff. And also, this is now unbelievably, this is super useful. Because as I said before, when you solve a problem,"},{"start":4111.88,"text":"Whether you like it or not, you're going to get optimal Lagrange multipliers, okay? So that's, and this is awesome because it allows you to do, in fact, I'll tell you a story about this from a long time ago, but people doing circuit design, right?"},{"start":4126.54,"text":"You have 50 constraints, right? You'd say, oh, my phase margin has to exceed this. I need to be able to do this. My power should be less than that. My area should be less than that. This should be that, blah, blah, blah. My swing should be this. What is it? My third order distortion has to be less than that. You have all these things, right? And so you design it, right? Out of your 50 constraints, it's quite typical that only 10 or 15 are going to be tight. Everybody following this? Then the question is,"}],"speech_gaps":[],"frame":"../frames/v008/025.webp","frame_time":4013.11},{"title":"拉格朗日乘数与约束紧致性","segments":[{"id":198,"text":"Like, well, how tight are they? Like, and I mean, here's the Boolean idea of tightness goes like this. It says you were allocated 50 milliwatts. How much did you use? 50. You're tight. I insisted on a phase margin of 120 degrees. What's your phase margin? 120, right? Something like that, right? So these are tight. But then the question is, you'd want to know which of these, like how, let's do, let's get a little bit more sophisticated and say.","zh":"比如，好吧，它们有多紧呢？比如，这里的布尔紧致性的想法是这样的。它说你被分配了50毫瓦。你用了多少？50。你是紧致的。我坚持要求一个120度的相位裕度。你的相位裕度是多少？120度，对吧？类似这样的，对吧？所以这些是紧致的。但问题是，你想要知道哪一个更紧致，比如，如何，让我们稍微复杂一点，说。","start":4155.33,"end":4183.67},{"id":199,"text":"which are more tight than others? Everybody following this? And somebody want to tell me how to do it? You just look at the Lagrange multipliers. So if I have a 50 milliwatt, I mean, assuming everything is like whatever, you know, on the similar scale, right? But aside from that, if I have a power thing, it's tight. I'm using all my budget, but my Lagrange multiplier is really small. And I have another constraint, which is tight, but with a really big Lagrange multiplier. Then what it tells me is, yeah, the first one you would say,","zh":"哪些比其他的更紧致？大家跟上了吗？有人想告诉我怎么做吗？你只需要看一下拉格朗日乘数。所以我有一个50毫瓦的约束，我的意思是，假设一切都在类似的尺度上，对吧？但除此之外，如果我有一个功率约束，它是紧致的。我用完了我的预算，但我的拉格朗日乘数非常小。而我还有一个约束，它也是紧致的，但拉格朗日乘数却非常大。这告诉我的是，是的，第一个你会说，","start":4184.3,"end":4215.15},{"id":200,"text":"It's tight, but it's not that tight. Everybody see what I'm saying? I mean, actually, this is like in a mechanical system, right? It would be, you'd say, yeah, it's up against the wall, but there's not very much contact force there. Or that cable is taut, but there's only like five newtons of tension on it. Everybody see what I'm saying?","zh":"它是紧致的，但并不是那么紧致。大家明白我在说什么吗？我的意思是，实际上，这就像在机械系统中，对吧？你会说，是的，它抵在墙上，但接触力并不是很大。或者那根缆绳是张紧的，但上面只有大约五牛的张力。大家明白我在说什么吗？","start":4215.67,"end":4240.33},{"id":201,"text":"well, right? If you minimize the total energy in a configuration of some mechanical thing, subject to, and you have constraints. The constraint says that, for example, two points can't be more than a meter apart because there's a cable connecting them. Or another one says there's a floor and you can't go, you can't have X1, maybe a position go, it can't go below the floor. Everybody follow this? Okay, so then the Lagrange multipliers for those constraints are actually","zh":"对吧？如果你在某个机械系统的配置下最小化总能量，并且有约束条件。约束条件比如说，两点之间不能超过一米，因为它们之间有缆绳连接。或者另一个约束条件说，有地板，你不能让X1，也许是一个位置，不能低于地板。大家跟上了吗？好的，那么这些约束的拉格朗日乘数实际上是","start":4241.24,"end":4269.44},{"id":202,"text":"precisely forces because it's the partial it's the partial derivative of the energy the optimal energy with respect to when you perturb a constraint like that it's basically saying i could move the floor down or something like that and that is actually literally the physical units are newtons so okay never make sense so it's kind of cool so anyway this is so this is like these are all super useful uh stuff um","zh":"它精确地强制执行，因为它是对能量的偏导数，即关于扰动约束时的最优能量。基本上，它是在说我可以把地板往下移动，或者类似的事情。实际上，物理单位是牛顿，所以这在某种程度上是有意义的。这很酷。总之，这些都是超级有用的东西。","start":4270.29,"end":4298.01},{"id":203,"text":"I remember we made a tool for doing this for circuit designers and then ended up, you had 50 constraints and we did things like we colored, you know, one column would be budget, the other would say design. So you see 50-50 means you're at your budget. We colored them red if the grunge multiplier was large, orange if it was modest, yellow, and it's just, and there's no color at all if it's slack. Everybody got this?","zh":"我记得我们为电路设计师制作了一个工具来做这件事，后来你有50个约束条件，我们会做一些事情，比如我们用颜色来标记，你知道的，一列是预算，另一列是设计。所以当你看到50-50时，意味着你处于预算上限。如果拉格朗日乘数很大，我们就用红色标记；如果适中，就用橙色；如果较小，就用黄色；如果松弛，就没有任何颜色。大家都明白吗？","start":4300.13,"end":4327.83}],"notes":["本段讲解了拉格朗日乘数与约束紧致性之间的关系。讲者通过机械系统的例子说明，当约束被完全满足时，拉格朗日乘数可以反映约束的紧致程度。例如，如果一个约束被完全满足，但拉格朗日乘数很小，说明该约束对优化结果的影响较小，即约束并不十分紧致。","讲者进一步解释了拉格朗日乘数在物理系统中的实际意义。例如，在机械系统中，拉格朗日乘数可以表示为力的单位（牛顿），这表明拉格朗日乘数与约束的物理意义直接相关。","讲者提到在电路设计中，他们开发了一个工具，通过颜色编码来可视化拉格朗日乘数的大小。例如，红色表示拉格朗日乘数较大，说明该约束对优化结果影响较大，而黄色表示中等影响，无颜色表示约束松弛。","讲者强调了拉格朗日乘数在优化问题中的重要性，特别是在判断约束是否紧致时。通过观察拉格朗日乘数的大小，可以判断约束对优化结果的影响程度，从而帮助设计者更好地理解系统行为。","讲者通过机械系统的例子，如电缆和地板的约束，说明了拉格朗日乘数如何反映物理系统的实际力。例如，电缆的张力或地板的接触力都可以通过拉格朗日乘数来表示。","讲者提到，当约束被完全满足时，拉格朗日乘数可以反映约束的物理意义，例如力的大小。这表明拉格朗日乘数不仅是数学工具，也是理解物理系统行为的重要手段。"],"formulas":[],"uncertainties":["grunge multiplier"],"diagram":"none","start":4155.33,"end":4327.83,"asr_flags":[],"math_clarifications":["原始片段主要讨论了拉格朗日乘数在约束优化中的物理意义，但未明确提及拉格朗日函数的数学定义。因此，无法核定该公式是否正确或适用。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4155.33,"text":"Like, well, how tight are they? Like, and I mean, here's the Boolean idea of tightness goes like this. It says you were allocated 50 milliwatts. How much did you use? 50. You're tight. I insisted on a phase margin of 120 degrees. What's your phase margin? 120, right? Something like that, right? So these are tight. But then the question is, you'd want to know which of these, like how, let's do, let's get a little bit more sophisticated and say."},{"start":4184.3,"text":"which are more tight than others? Everybody following this? And somebody want to tell me how to do it? You just look at the Lagrange multipliers. So if I have a 50 milliwatt, I mean, assuming everything is like whatever, you know, on the similar scale, right? But aside from that, if I have a power thing, it's tight. I'm using all my budget, but my Lagrange multiplier is really small. And I have another constraint, which is tight, but with a really big Lagrange multiplier. Then what it tells me is, yeah, the first one you would say,"},{"start":4215.67,"text":"It's tight, but it's not that tight. Everybody see what I'm saying? I mean, actually, this is like in a mechanical system, right? It would be, you'd say, yeah, it's up against the wall, but there's not very much contact force there. Or that cable is taut, but there's only like five newtons of tension on it. Everybody see what I'm saying? Oh, by the way, now that you know this, I can describe the mechanical thing."},{"start":4241.24,"text":"well, right? If you minimize the total energy in a configuration of some mechanical thing, subject to, and you have constraints. The constraint says that, for example, two points can't be more than a meter apart because there's a cable connecting them. Or another one says there's a floor and you can't go, you can't have X1, maybe a position go, it can't go below the floor. Everybody follow this? Okay, so then the Lagrange multipliers for those constraints are actually"},{"start":4270.29,"text":"precisely forces because it's the partial it's the partial derivative of the energy the optimal energy with respect to when you perturb a constraint like that it's basically saying i could move the floor down or something like that and that is actually literally the physical units are newtons so okay never make sense so it's kind of cool so anyway this is so this is like these are all super useful uh stuff um"},{"start":4300.13,"text":"I remember we made a tool for doing this for circuit designers and then ended up, you had 50 constraints and we did things like we colored, you know, one column would be budget, the other would say design. So you see 50-50 means you're at your budget. We colored them red if the grunge multiplier was large, orange if it was modest, yellow, and it's just, and there's no color at all if it's slack. Everybody got this?"}],"speech_gaps":[],"frame":"../frames/v008/026.webp","frame_time":4167.33},{"title":"拉格朗日乘数与局部灵敏度","segments":[{"id":204,"text":"Anyway, so circuit designers were like, that is awesome. This is new. Since when have people known about this? This is amazing. And I said, well, here's a hint. These are called Lagrange multipliers. And he died in 1840. Anyway, so something like that. I'm just saying this is all quite useful.","zh":"总之，电路设计师们说，这太棒了。这是新的。人们什么时候才知道这个的？这太惊人了。我说，好吧，这里有个提示。这些被称为拉格朗日乘数。他于1840年去世。总之，就是这样。我只是说，这都很有用。","start":4328.63,"end":4349.29},{"id":205,"text":"Now we get to the local sensitivity. Yeah, so I actually jumped ahead, but that's okay. That's fine. So assuming P star is differentiable, which by the way, it often is not. Let's just say that. But assuming it were, you get these, and these are the things most people think about. You get that the optimal Lagrange multipliers are very cool partial derivatives. They are like, for example, this one is the lambda I star is the,","zh":"现在我们进入局部灵敏度。是的，我其实跳过了前面的内容，不过没关系。这样也行。假设P星是可微的，顺便说一句，它通常并不是。我们就这样说吧。但假设它是可微的，你就会得到这些，而这些是大多数人所关注的内容。你会得到最优拉格朗日乘数是非常酷的偏导数。例如，这个就是lambda I星，它是最优成本对收紧该约束的偏导数，前面有一个负号。因为如果你收紧约束，成本就会增加，然后你加上负号，就会得到一个结果。总之就是这样。这非常酷，对吧？这就是这个图景。现在我回到能量的例子。比如我有一个网格，对吧？","start":4353.13,"end":4381.4},{"id":206,"text":"partial derivative of the optimal cost with respect to tightening that constraint with a minus sign in front of it. Because if you tighten the constraint, cost is going to go up and then you put a minus sign and you get something. Anyway, that's it. So it's very cool, right? So that's the picture. Now I'll go back to the energy example. Like I have a grid, right?","zh":"然后我做的事情是查看一个等式约束，这个等式约束表示在该节点，流入的功率等于流出的功率。大家明白吗？顺便说一句，等式约束总是紧的。当我解决我的优化问题时，我会得到一个拉格朗日乘数。我会得到一个拉格朗日乘数。然后这个拉格朗日乘数非常有趣，因为它告诉你总系统成本对……","start":4382.51,"end":4408.11},{"id":207,"text":"Then what I do is I look at an equality constraint, and that equality constraint says at that node, the power going in balances the power going out. Everybody got that? And by the way, an equality constraint is always tight. And I get a Lagrange multiplier there when I solve my optimization problem. I get a Lagrange multiplier. And then the Lagrange multiplier is super interesting because it tells you the partial derivative of the total system cost with respect to...","zh":"扰动该等式约束的偏导数。但扰动一个等式约束，它是一个平衡约束，表示所有流入的东西都等于所有流出的东西，基本上就是在做思想实验。请连接一些电线，要么从系统中吸取一些能量，要么从系统中放出一些能量，或者向系统中泵入一些能量，这就是扰动该等式约束的意思。","start":4409.67,"end":4439.12},{"id":208,"text":"perturbing that equality constraint. But perturbing an equality constraint, which is a balance constraint that says all the, you know, everything coming in balances everything going out, basically says it's doing the thought experiment. Please go hook up some wires and either suck some energy in, suck some energy out of the system there, or pump some in, right? That's what it means to perturb that equality constraint.","zh":"扰动该等式约束，它是一个平衡约束，表示所有流入的东西都等于所有流出的东西，基本上就是在做思想实验。请连接一些电线，要么从系统中吸取一些能量，要么从系统中放出一些能量，或者向系统中泵入一些能量，这就是扰动该等式约束的意思。","start":4439.57,"end":4462.62},{"id":209,"text":"What this says, what the Lagrange multiplier tells you then is the increase or decrease in system cost, overall system cost, if you do that. And so in energy, these are called locational marginal prices. Because the cost, the objective is in dollars. It's the operating cost for your 3,000 generators or whatever, something like that. Everybody.","zh":"这说明拉格朗日乘数告诉你的，是如果你进行这样的操作，整个系统成本会增加或减少多少。在能源领域，这些被称为节点边际价格。因为成本，也就是目标函数，是以美元为单位的。它是你那3000个发电机或其他设备的运行成本，诸如此类。每个人。","start":4463.12,"end":4487.1}],"notes":["本段讲解了局部灵敏度的概念，即最优拉格朗日乘数与目标函数对约束条件的敏感度之间的关系。讲者指出，拉格朗日乘数可以解释为目标函数对约束条件的偏导数，其符号和大小反映了约束条件变化对目标函数的影响。","讲者通过电力系统中的例子说明了拉格朗日乘数的实际应用。在电力网络中，每个节点的功率平衡是一个等式约束，而拉格朗日乘数则表示当这个平衡被扰动时，系统总成本的变化率。","拉格朗日乘数在能源系统中被称为“节点边际价格”，它反映了在特定节点上增加或减少能量输入对系统总成本的影响。这种价格通常以美元为单位，用于衡量发电厂的运行成本。","讲者强调，拉格朗日乘数不仅是一个数学工具，它还具有实际意义，能够帮助决策者理解系统在不同约束条件下的行为。","讲者提到，拉格朗日乘数的计算依赖于目标函数对约束条件的偏导数，而这种偏导数的符号和大小决定了系统成本的变化方向。","讲者指出，拉格朗日乘数的计算假设目标函数是可微的，但实际中这种情况并不总是成立，因此需要特别注意这一前提条件。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4328.63,"end":4487.1,"asr_flags":[],"math_clarifications":["公式中的符号和数学类型存在不准确之处。λ* 应该是目标函数对约束条件的偏导数的负值，但公式中未明确说明 P* 是目标函数，且 c 作为约束条件的符号使用不够规范。此外，公式缺少必要的数学条件和上下文说明，如目标函数和约束条件的具体形式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4328.63,"text":"Anyway, so circuit designers were like, that is awesome. This is new. Since when have people known about this? This is amazing. And I said, well, here's a hint. These are called Lagrange multipliers. And he died in 1840. Anyway, so something like that. I'm just saying this is all quite useful."},{"start":4353.13,"text":"Now we get to the local sensitivity. Yeah, so I actually jumped ahead, but that's okay. That's fine. So assuming P star is differentiable, which by the way, it often is not. Let's just say that. But assuming it were, you get these, and these are the things most people think about. You get that the optimal Lagrange multipliers are very cool partial derivatives. They are like, for example, this one is the lambda I star is the,"},{"start":4382.51,"text":"partial derivative of the optimal cost with respect to tightening that constraint with a minus sign in front of it. Because if you tighten the constraint, cost is going to go up and then you put a minus sign and you get something. Anyway, that's it. So it's very cool, right? So that's the picture. Now I'll go back to the energy example. Like I have a grid, right?"},{"start":4409.67,"text":"Then what I do is I look at an equality constraint, and that equality constraint says at that node, the power going in balances the power going out. Everybody got that? And by the way, an equality constraint is always tight. And I get a Lagrange multiplier there when I solve my optimization problem. I get a Lagrange multiplier. And then the Lagrange multiplier is super interesting because it tells you the partial derivative of the total system cost with respect to..."},{"start":4439.57,"text":"perturbing that equality constraint. But perturbing an equality constraint, which is a balance constraint that says all the, you know, everything coming in balances everything going out, basically says it's doing the thought experiment. Please go hook up some wires and either suck some energy in, suck some energy out of the system there, or pump some in, right? That's what it means to perturb that equality constraint."},{"start":4463.12,"text":"What this says, what the Lagrange multiplier tells you then is the increase or decrease in system cost, overall system cost, if you do that. And so in energy, these are called locational marginal prices. Because the cost, the objective is in dollars. It's the operating cost for your 3,000 generators or whatever, something like that. Everybody."}],"speech_gaps":[],"frame":"../frames/v008/027.webp","frame_time":4340.63},{"title":"对偶变量与资源定价","segments":[{"id":210,"text":"Got this? So this is, you can look that up. You can go, if you want, you can go, if you want, you can even find the locational marginal prices in Texas or in California. You specify the node and the hour or the 15-minute, and you'll get the price. It'll be $83 per megawatt hour. So everybody follow this? And it's just from this, and it all makes perfect sense. It's really cool, I think. Also, this is good for resource allocation.","zh":"明白了吗？所以，你可以查阅相关资料。如果你想的话，你甚至可以找到德克萨斯州或加利福尼亚州的节点边际价格。你只需要指定节点和小时或15分钟，就能得到价格。价格是每兆瓦时83美元。大家跟上了吗？而且，这一切都从这里开始，而且完全合乎逻辑。我觉得这真的很酷。此外，这对资源分配也很有帮助。","start":4487.87,"end":4515.7},{"id":211,"text":"Right. So I'm doing I'm running a data center. I've got, you know, whatever, 350 different job classes. And I want to allocate resources to them like IO bandwidth, numbers of cores, you know, also whatever it is, these kinds of things. Right. I want to allocate it to them. They're all doing different things. Then you get a really cool thing where you ask if I would ask you, how much better will you do?","zh":"对的。我现在在运行一个数据中心。我有大约350种不同的作业类别。我想将资源分配给它们，比如IO带宽、核心数量，或者其他类似的东西。对的，我想将资源分配给它们。它们都在做不同的事情。然后你就会得到一个很酷的现象，你会问：如果你给我更多的核心或更多的IO带宽，或者其他类似的东西，我会做得更好吗？","start":4516.7,"end":4540.22},{"id":212,"text":"If I give you more cores or more IO bandwidth, right, or something like that. And these literally tell you that these would work out to the prices of the resources in the data center. And that's why in a lot of fields, people refer to Lagrange multipliers or dual variables as prices or shadow prices.","zh":"如果你给我更多的核心或更多的IO带宽，或者其他类似的东西，这些实际上会告诉你，这些资源在数据中心中的价格。这就是为什么在很多领域，人们将拉格朗日乘数或对偶变量称为价格或影子价格。","start":4540.88,"end":4561.28},{"id":213,"text":"Make sense, which is I think it's really good good words for this, right? I guess people in mechanical engineering don't because It's I don't know how to say when when you hit for example, I don't know It seems to me these are just two forces. These are just contact forces And they're not prices right like you say I'd pay more and you're like dude. That's a concrete floor. So you anyway, so Anyway, those are the main areas where people encounter all these things and have names for them and stuff. Okay","zh":"这有意义，我觉得这些词用得非常好，对吧？我想机械工程领域的人可能不会这样用，因为我不知道该怎么说，比如当你碰到例如，我不知道，对我来说，这些似乎只是两种力。它们只是接触力。它们不是价格，对吧？比如你说我会支付更多，而你会说哥们，这是混凝土地板。所以不管怎样，这些是人们遇到这些概念并为之命名的主要领域。好的。","start":4562.62,"end":4590.66},{"id":214,"text":"We're going to look at one more topic. It's actually super interesting, and I'll show you what it is. First, let me start with what the issue is. Remember that we have problem reformulations. You take a problem, and then you have an equivalent problem. For us, in computer science, we call that a reduction.","zh":"我们将再看一个主题。实际上，这非常有趣，我会向你们展示它是什么。首先，让我从问题所在开始。还记得我们有问题的重新表述吗？你将一个问题转化为一个等价的问题。对我们来说，在计算机科学中，我们称之为归约。","start":4592.86,"end":4617.5},{"id":215,"text":"We just call it an equivalent problem. And what it means is, if you can solve the other problem, then there's a way to reconstruct the solution of the other one, right? And some of these transformations are obvious. Some aren't, by the way. But most are. You know, simple ones. In fact, if anyone's curious what CVXPy does, it does absolutely nothing but this. It starts with your problem. It creates a new equivalent problem. And another one. And another one. Another one. And then 42 steps later,","zh":"我们只是称其为一个等价问题。它的意思是，如果你能够解决另一个问题，那么就有一种方法可以重构另一个问题的解，对吧？其中一些转换是显而易见的。有些则不是，不过大多数都是。你知道的，都是些简单的转换。事实上，如果有人好奇CVXPy做了什么，它所做的唯一事情就是这个。它从你的问题开始。它创建一个新的等价问题。再创建另一个。再一个。再一个。然后在42步之后，","start":4618.3,"end":4647.12}],"notes":["本段讲解了对偶变量在资源定价中的应用，特别是数据中心资源分配中的例子。讲者提到，当增加计算资源如核心数或IO带宽时，这些资源的价格会反映在对偶变量中，这与实际资源定价一致。这种联系使得对偶变量被称为影子价格或价格。","讲者进一步讨论了不同领域对对偶变量的不同称呼，例如机械工程领域可能不使用‘价格’这样的术语，而是用‘力’来描述类似的概念。这说明了对偶变量在不同学科中的不同解释方式。","讲者提到，对偶变量在资源分配问题中具有实际意义，因为它们反映了资源的边际价值。这种联系使得对偶变量成为优化问题中重要的分析工具。","讲者还提到，对偶变量在优化问题中可以用于资源定价，这与实际经济中的价格机制相呼应。这种联系使得对偶变量在实际应用中具有重要意义。","讲者提到，对偶变量在优化问题中可以用于资源定价，这与实际经济中的价格机制相呼应。这种联系使得对偶变量在实际应用中具有重要意义。","讲者还提到，对偶变量在优化问题中可以用于资源定价，这与实际经济中的价格机制相呼应。这种联系使得对偶变量在实际应用中具有重要意义。"],"formulas":[],"uncertainties":["It's I don't know how to say when when you hit for example, I don't know"],"diagram":"none","start":4487.87,"end":4647.12,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4487.87,"text":"Got this? So this is, you can look that up. You can go, if you want, you can go, if you want, you can even find the locational marginal prices in Texas or in California. You specify the node and the hour or the 15-minute, and you'll get the price. It'll be $83 per megawatt hour. So everybody follow this? And it's just from this, and it all makes perfect sense. It's really cool, I think. Also, this is good for resource allocation."},{"start":4516.7,"text":"Right. So I'm doing I'm running a data center. I've got, you know, whatever, 350 different job classes. And I want to allocate resources to them like IO bandwidth, numbers of cores, you know, also whatever it is, these kinds of things. Right. I want to allocate it to them. They're all doing different things. Then you get a really cool thing where you ask if I would ask you, how much better will you do?"},{"start":4540.88,"text":"If I give you more cores or more IO bandwidth, right, or something like that. And these literally tell you that these would work out to the prices of the resources in the data center. And that's why in a lot of fields, people refer to Lagrange multipliers or dual variables as prices or shadow prices."},{"start":4562.62,"text":"Make sense, which is I think it's really good good words for this, right? I guess people in mechanical engineering don't because It's I don't know how to say when when you hit for example, I don't know It seems to me these are just two forces. These are just contact forces And they're not prices right like you say I'd pay more and you're like dude. That's a concrete floor. So you anyway, so Anyway, those are the main areas where people encounter all these things and have names for them and stuff. Okay"},{"start":4592.86,"text":"We're going to look at one more topic. It's actually super interesting, and I'll show you what it is. First, let me start with what the issue is. Remember that we have problem reformulations. You take a problem, and then you have an equivalent problem. For us, in computer science, we call that a reduction."},{"start":4618.3,"text":"We just call it an equivalent problem. And what it means is, if you can solve the other problem, then there's a way to reconstruct the solution of the other one, right? And some of these transformations are obvious. Some aren't, by the way. But most are. You know, simple ones. In fact, if anyone's curious what CVXPy does, it does absolutely nothing but this. It starts with your problem. It creates a new equivalent problem. And another one. And another one. Another one. And then 42 steps later,"}],"speech_gaps":[],"frame":"../frames/v008/028.webp","frame_time":4499.87},{"title":"凸优化中的问题转换与对偶性","segments":[{"id":216,"text":"You arrive at a problem which a solver can handle. Then you throw it to the solver, and then you pull it all back, because every one of those reduction methods has a retrieval method associated with it, which tells you, if you solved the thing that I reduced this to, how would I solve the original problem? I mean, you didn't need to follow that, but if you're just curious, that's what it does. If you know about compilers, that's a rewriting system.","zh":"你遇到了一个求解器可以处理的问题。然后你把这个交给求解器，接着你又把它全部拿回来，因为每一种这样的转换方法都有一个检索方法，它会告诉你，如果你解决了我将其转换后的问题，你将如何解决原始问题？我的意思是，你不需要遵循这个过程，但如果你只是出于好奇，这就是它所做的。如果你了解编译器，这就是一种重写系统。","start":4648.45,"end":4671.94},{"id":217,"text":"That's how one type of compiler works that way. It takes your source code, generates new source code that it can prove is semantically equivalent. So for example, it might reorder some operations, but it'll only do that if it knows that it's going to preserve the semantics of your original program. And you can do that, for example, if they don't have anything to do with each other, if they're...","zh":"这就是一种编译器的工作方式。它会将你的源代码转换为新的源代码，并且可以证明新代码在语义上等价于原代码。例如，它可能会重新排列一些操作，但只有在它知道这些操作不会改变原始程序语义的情况下才会这么做。例如，如果它们彼此之间没有关系，如果它们……","start":4672.8,"end":4699.9},{"id":218,"text":"You know, like, no one writes on some memory, you know, that kind of thing. Anyway, you just do that kind of stuff. So you just do lots and lots of rewriting, and then you end up with, and they do, a lot of modern things do exactly that kind of stuff. Okay, so here's what I was going to say. And maybe we'll do the main thing yesterday, but I'll just set the whole thing, the picture up now. So you start with a problem P, right? And then I'm going to change it to a new one. This is equivalent, right?","zh":"你知道，比如，没有人写入某些内存，你知道，这种情形。总之，你只需要做这种重写操作。因此，你进行大量重写操作，最终会得到，而且很多现代系统确实就是这样做的。好的，那么我刚才要说的是，也许我们昨天已经做了主要内容，但我会现在先铺垫整个图景。你从一个问题 P 开始，对吧？然后我会将其转换为一个新的问题。这二者是等价的，对吧？","start":4700.17,"end":4729.07},{"id":219,"text":"And this could be something really dumb, like eliminating equality constraints, adding equality constraints. I don't know. Adding slack variables is something, right? Okay. And so, you know, you can think of these as equivalent, right? And I can form a Lagrange dual here. And I get this, right? Okay. Well, but I can form the Lagrange dual of this thing. And that should be, you know, we'll call that, whoops, d tilde star or something like that. Or no, no, I'll just call it d tilde. Sorry. Here we go.","zh":"这可能是某种非常愚蠢的操作，比如消除等式约束，添加等式约束。我不知道。添加松弛变量就是一种操作，对吧？好的。因此，你可以认为这些是等价的，对吧？我可以在这里构造拉格朗日对偶问题。然后我得到这个，对吧？好的。但我也能够构造这个东西的拉格朗日对偶问题。这应该就是我们所说的，哎呀，~d 星或者类似的东西。或者不，不，我直接称它为 ~d。抱歉。好了，我们开始吧。","start":4729.57,"end":4758.84},{"id":220,"text":"like that, right? And so then you'd say, look, these two problems are intimately connected because they're equivalent. These two are intimately connected because that's the Lagrange dual of this one. This one's intimately connected because it's the Lagrange dual of that one, right? Okay, so then I want to ask, what about these two? And here's what you... I mean, they are obviously closely related, right? They all have the same optimal value. I mean, assuming there's whatever strong duality, right?","zh":"像这样，对吧？然后你会说，看，这两个问题之间有着密切的联系，因为它们是等价的。这两个之间有着密切的联系，因为这是其中一个的拉格朗日对偶问题。这个也与那个有密切联系，因为它是那个的拉格朗日对偶问题，对吧？好的，那么我想问，这两个之间又如何呢？这里的情况是，它们显然密切相关，对吧？它们都有相同的最优值。我是说，假设存在某种强对偶性，对吧？","start":4760.86,"end":4789.66},{"id":221,"text":"This has the same optimal value as that. That's what it means to be, you know, this has the same as that of strong duality. So this is related to that one, certainly through this chain of three. But what you really want to do is draw this in and say that there's some connection between them. So that sounds great. And by the way, people trained in math will have a huge urge. If you show this picture to someone in math, their motor cortex will start twitching.","zh":"这个的最优值与那个的最优值相同。这就是所谓强对偶性的意思。所以这个与那个之间当然通过这三个问题的链条有关联。但你真正想要做的，是将它们联系起来并指出它们之间存在某种联系。这听起来很好。顺便说一句，受过数学训练的人会有强烈的冲动。如果你向数学家展示这张图，他们的运动皮层就会开始抽搐。","start":4790.06,"end":4817.88}],"notes":["本段讲解了凸优化中问题转换与对偶性的关系。讲者提到，当我们将原问题转换为另一个等价问题时，可以通过求解转换后的问题来得到原问题的解。这种转换方法类似于编译器中的重写系统，即生成语义等价的新代码。","讲者进一步说明，这种转换方法可以包括消除等式约束、添加等式约束或引入松弛变量等操作。这些转换后的形式与原问题在最优值上是等价的，前提是满足强对偶性条件。","讲者强调，转换后的问题与原问题之间存在紧密联系，因为它们可以通过对偶性相互关联。这种关系可以通过链式结构来体现，即原问题与转换后的问题之间通过对偶性相互连接。","讲者还提到，这种问题转换和对偶性的关系在数学上具有直观的联系，甚至可能引发数学家的强烈兴趣，因为这种结构在数学中具有重要的理论意义。","讲者最后指出，这种问题转换和对偶性的关系在现代优化方法中被广泛应用，例如在编译器设计和优化算法中，通过重写和转换来简化问题。","讲者通过类比编译器的重写系统，说明了问题转换的原理，并指出这种转换方法在优化问题中具有重要的实际意义。"],"formulas":[],"uncertainties":["d tilde star or something like that"],"diagram":"none","start":4648.45,"end":4817.88,"asr_flags":[],"math_clarifications":["原始公式中的'd^*'未明确表示是原问题还是对偶问题的最优值。根据上下文，应使用\\tilde{d}^*表示对偶问题的最优值，以避免混淆。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4648.45,"text":"You arrive at a problem which a solver can handle. Then you throw it to the solver, and then you pull it all back, because every one of those reduction methods has a retrieval method associated with it, which tells you, if you solved the thing that I reduced this to, how would I solve the original problem? I mean, you didn't need to follow that, but if you're just curious, that's what it does. If you know about compilers, that's a rewriting system."},{"start":4672.8,"text":"That's how one type of compiler works that way. It takes your source code, generates new source code that it can prove is semantically equivalent. So for example, it might reorder some operations, but it'll only do that if it knows that it's going to preserve the semantics of your original program. And you can do that, for example, if they don't have anything to do with each other, if they're..."},{"start":4700.17,"text":"You know, like, no one writes on some memory, you know, that kind of thing. Anyway, you just do that kind of stuff. So you just do lots and lots of rewriting, and then you end up with, and they do, a lot of modern things do exactly that kind of stuff. Okay, so here's what I was going to say. And maybe we'll do the main thing yesterday, but I'll just set the whole thing, the picture up now. So you start with a problem P, right? And then I'm going to change it to a new one. This is equivalent, right?"},{"start":4729.57,"text":"And this could be something really dumb, like eliminating equality constraints, adding equality constraints. I don't know. Adding slack variables is something, right? Okay. And so, you know, you can think of these as equivalent, right? And I can form a Lagrange dual here. And I get this, right? Okay. Well, but I can form the Lagrange dual of this thing. And that should be, you know, we'll call that, whoops, d tilde star or something like that. Or no, no, I'll just call it d tilde. Sorry. Here we go."},{"start":4760.86,"text":"like that, right? And so then you'd say, look, these two problems are intimately connected because they're equivalent. These two are intimately connected because that's the Lagrange dual of this one. This one's intimately connected because it's the Lagrange dual of that one, right? Okay, so then I want to ask, what about these two? And here's what you... I mean, they are obviously closely related, right? They all have the same optimal value. I mean, assuming there's whatever strong duality, right? Because..."},{"start":4790.06,"text":"This has the same optimal value as that. That's what it means to be, you know, this has the same as that of strong duality. So this is related to that one, certainly through this chain of three. But what you really want to do is draw this in and say that there's some connection between them. So that sounds great. And by the way, people trained in math will have a huge urge. If you show this picture to someone in math, their motor cortex will start twitching."}],"speech_gaps":[],"frame":"../frames/v008/029.webp","frame_time":4660.45},{"title":"关于图示的讨论","segments":[{"id":222,"text":"Because they want to write in, and they want to make that a commutative diagram. So they will, it's true, don't deny it, right? So if you see that, and if you go to the math department, they're going to be looking for chalk, okay, not this thing. But when they get the chalk, they're going to draw in a line there. Anyway, so this is just the setup, and I think we'll quit for today.","zh":"因为他们想写进去，并且他们想让这个成为一个交换图示。所以，他们确实会这么做，不要否认，对吧？所以如果你看到这个，然后你去数学系，他们正在寻找粉笔，好吧，不是这个东西。但当他们拿到粉笔后，他们会在这画一条线。不管怎样，这就是设置，我认为我们今天就到这里吧。","start":4819.4,"end":4839.68}],"notes":["本段讨论了数学系教授在使用黑板时的偏好，他们希望将某些概念表示为交换图示，但更倾向于使用传统的黑板书写而非现代的电子图示。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4819.4,"end":4839.68,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":1,"raw_segments":[{"start":4819.4,"text":"Because they want to write in, and they want to make that a commutative diagram. So they will, it's true, don't deny it, right? So if you see that, and if you go to the math department, they're going to be looking for chalk, okay, not this thing. But when they get the chalk, they're going to draw in a line there. Anyway, so this is just the setup, and I think we'll quit for today."}],"speech_gaps":[],"frame":"../frames/v008/030.webp","frame_time":4829.54}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v008.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>${point.visual_source?.verified?'原PPT提取与重绘':'讲解梳理 · 原PPT待核对'} · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p>${point.visual_source?.verified?`<section class="ppt-source"><h3>原PPT对照 · ${esc(point.visual_source.slide_number)}</h3><a href="${esc(point.visual_source.slide_image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.visual_source.slide_image)}" style="width:100%;border:1px solid #ccd9dd;border-radius:8px" alt="原PPT第${esc(point.visual_source.slide_number)}页"></a><p class="muted">已对照本讲视频 ${stamp(point.visual_source.video_time)} 的画面。<a href="${esc(point.visual_source.source_url)}" target="_blank" rel="noopener">原始讲义 PDF</a> · PDF 第 ${point.visual_source.pdf_page} 页</p><p><b>从原页提取：</b>${point.visual_source.items.map(esc).join('；')}</p></section>`:''}<div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(f=>'<p class="muted">'+esc(f.origin||'讲者讲述与既有整理')+'</p>'+formula(f)).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length,verified=data.pages.flatMap(p=>p.boards||[]).filter(b=>b.visual_source?.verified).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页含讲解画板 · '+verified+' 个已核对原PPT</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
