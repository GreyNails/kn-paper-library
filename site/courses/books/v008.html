 everybody follow this? And it's just from this, and it all makes perfect sense. It's really cool, I think. Also, this is good for resource allocation."},{"start":4516.7,"text":"Right. So I'm doing I'm running a data center. I've got, you know, whatever, 350 different job classes. And I want to allocate resources to them like IO bandwidth, numbers of cores, you know, also whatever it is, these kinds of things. Right. I want to allocate it to them. They're all doing different things. Then you get a really cool thing where you ask if I would ask you, how much better will you do?"},{"start":4540.88,"text":"If I give you more cores or more IO bandwidth, right, or something like that. And these literally tell you that these would work out to the prices of the resources in the data center. And that's why in a lot of fields, people refer to Lagrange multipliers or dual variables as prices or shadow prices."},{"start":4562.62,"text":"Make sense, which is I think it's really good good words for this, right? I guess people in mechanical engineering don't because It's I don't know how to say when when you hit for example, I don't know It seems to me these are just two forces. These are just contact forces And they're not prices right like you say I'd pay more and you're like dude. That's a concrete floor. So you anyway, so Anyway, those are the main areas where people encounter all these things and have names for them and stuff. Okay"},{"start":4592.86,"text":"We're going to look at one more topic. It's actually super interesting, and I'll show you what it is. First, let me start with what the issue is. Remember that we have problem reformulations. You take a problem, and then you have an equivalent problem. For us, in computer science, we call that a reduction."},{"start":4618.3,"text":"We just call it an equivalent problem. And what it means is, if you can solve the other problem, then there's a way to reconstruct the solution of the other one, right? And some of these transformations are obvious. Some aren't, by the way. But most are. You know, simple ones. In fact, if anyone's curious what CVXPy does, it does absolutely nothing but this. It starts with your problem. It creates a new equivalent problem. And another one. And another one. Another one. And then 42 steps later,"}],"speech_gaps":[],"frame":"../frames/v008/028.webp","frame_time":4499.87},{"title":"凸优化中的问题转换与对偶性","segments":[{"id":216,"text":"You arrive at a problem which a solver can handle. Then you throw it to the solver, and then you pull it all back, because every one of those reduction methods has a retrieval method associated with it, which tells you, if you solved the thing that I reduced this to, how would I solve the original problem? I mean, you didn't need to follow that, but if you're just curious, that's what it does. If you know about compilers, that's a rewriting system.","start":4648.45,"end":4671.94},{"id":217,"text":"That's how one type of compiler works that way. It takes your source code, generates new source code that it can prove is semantically equivalent. So for example, it might reorder some operations, but it'll only do that if it knows that it's going to preserve the semantics of your original program. And you can do that, for example, if they don't have anything to do with each other, if they're...","start":4672.8,"end":4699.9},{"id":218,"text":"You know, like, no one writes on some memory, you know, that kind of thing. Anyway, you just do that kind of stuff. So you just do lots and lots of rewriting, and then you end up with, and they do, a lot of modern things do exactly that kind of stuff. Okay, so here's what I was going to say. And maybe we'll do the main thing yesterday, but I'll just set the whole thing, the picture up now. So you start with a problem P, right? And then I'm going to change it to a new one. This is equivalent, right?","start":4700.17,"end":4729.07},{"id":219,"text":"And this could be something really dumb, like eliminating
