</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">08 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 8 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v008.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v008","title":"08 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 8","course":"凸优化","pages":[{"title":"对偶性与拉格朗日函数","segments":[{"id":0,"text":"We'll continue on duality, which is this actually super interesting topic.","zh":"我们将继续讨论对偶性，这实际上是一个非常有趣的话题。","start":4.78,"end":9.72},{"id":1,"text":"And what we've seen so far, just to remind you, is we take any optimization problem at all, convex or not, and we form this thing called the Lagrangian. And you can mumble about how, you know, what's the Lagrangian? You go, well, it's a way to kind of incorporate the constraints into the objective, right? And you can mumble about like, oh, that's the market-based thing, you know, blah, blah, blah. Okay, they could do this.","zh":"到目前为止，我们已经看到，无论优化问题是否为凸问题，我们都可以构造一个称为拉格朗日函数的东西。你可能会想，什么是拉格朗日函数？你可以说，这是一种将约束条件纳入目标函数的方法，对吧？你可能会说，哦，这就像市场机制一样，嗯，嗯，嗯。好吧，他们可以这么做。","start":11.73,"end":35.43},{"id":2,"text":"And it's got these mysterious weights, which is how much you weight the constraint functions in forming this Lagrangian, which is this thing that includes some costs or whatever, additional terms from the constraints. So that's the Lagrangian. And then from that, we get a dual function. And to get a dual function, you minimize over x.","zh":"它包含这些神秘的权重，这些权重决定了在构造拉格朗日函数时，约束函数的重要性，这个函数包括一些成本或其他来自约束的附加项。因此这就是拉格朗日函数。然后，从这个拉格朗日函数中，我们可以得到一个对偶函数。为了得到对偶函数，我们需要对变量x进行最小化。","start":36.88,"end":58.32},{"id":3,"text":"right, your variable. And that gives you this dual function, which is a function of these Lagrange multipliers, right? And then we observed that this gives you a lower bound on the optimal value of the original problem. Everybody, so just to recap where we are, right? And so you can even think of that as a parametrized lower bound on the optimal value. It's parametrized by lambda and nu.","zh":"没错，这就是你的变量。这会给你一个对偶函数，它是这些拉格朗日乘子的函数，对吧？然后我们观察到，这会给你原始问题最优值的一个下界。大家，为了回顾一下我们目前的位置，对吧？因此，你甚至可以将它视为一个参数化的最优值下界。它由lambda和nu参数化。","start":59.02,"end":85.02},{"id":4,"text":"And so, in other words, for any lambda nu, you get a lower bound.","zh":"换句话说，对于任何lambda和nu，你都会得到一个下界。","start":86.17,"end":88.91},{"id":5,"text":"Now, by the way, in a lot of cases, if you just throw in random lambdas and nu's,","zh":"顺便说一句，在很多情况下，如果你随便选择一些lambda和nu，","start":89.03,"end":92.41},{"id":6,"text":"here's the lower bound you get, minus infinity, right?","zh":"你得到的下界是负无穷，对吧？","start":92.51,"end":95.65},{"id":7,"text":"But that's kind of a universal lower bound and is utterly uninformative, right?","zh":"但这是一种普遍的下界，毫无信息量，对吧？","start":95.73,"end":99.15},{"id":8,"text":"But in other cases, what you get is not obvious at all, okay?","zh":"但在其他情况下，你得到的结果显然并不明显，对吧？","start":99.27,"end":102.65},{"id":9,"text":"So, here's an example.","zh":"所以，这里有一个例子。","start":102.79,"end":104.35},{"id":10,"text":"So, this is the partitioning problem.","zh":"所以，这是划分问题。","start":105.77,"end":107.77},{"id":11,"text":"I think we talked about it last time.","zh":"我想我们上次已经讨论过这个问题。","start":107.89,"end":109.91},{"id":12,"text":"And it's not convex for a couple of reasons.","zh":"而且它不是凸的，有几个原因。","start":110.11,"end":114.93},{"id":13,"text":"reasons. Number one, we didn't say that w was positive semi-definite, so your objective","zh":"原因一，我们没有说w是半正定的，因此你的目标函数","start":114.93,"end":118.91},{"id":14,"text":"does not have to be convex. And then the other one, which makes this very much not a convex","zh":"不一定具有凸性。然后另一个原因，使得这个问题非常不具有凸性，","start":118.91,"end":124.11},{"id":15,"text":"problem, is that we have a square equals one, and you can't do that. In a convex problem,","zh":"是我们在约束中有一个平方等于一，而你不能这样做。在凸问题中，","start":124.11,"end":130.87},{"id":16,"text":"equality constraints must be affine. Okay? So that's the problem. And here what we're","zh":"等式约束必须是仿射的。好吗？这就是问题所在。接下来我们将为它推导对偶函数，对吧？为此，我们只需构造，","start":131.07,"end":140.07},{"id":17,"text":"going to do is work out the dual function for it, right? And to do that, we simply form,","zh":"这就是这里的拉格朗日函数，然后我们在x上对其进行最小化，对吧？当我们对x进行最小化时，","start":140.07,"end":146.71},{"id":18,"text":"this is the Lagrangian here, and we minimize this over x, right? And when we minimize it over x,","zh":"我们会发现它是一个常数加上这个项，这个项是一个二次型。对x的二次型的最小值要么是零，如果这个二次型是半正定的，","start":146.77,"end":152.33},{"id":19,"text":"we find out that it's a constant plus this thing, which is a quadratic form. And the minimum of a","zh":"我的意思是，这显然是最小值，对吧？或者如果这个二次型如果这个矩阵有一个负特征值，那么最小值是负无穷，","start":153.11,"end":158.59},{"id":20,"text":"quadratic form over x is either zero, if the quadratic form is positive semi-definite,","zh":"此时就游戏结束了，它就是负无穷，对吧？所以你会得到一个非常有趣的下界，它说明了","start":158.59,"end":165.01},{"id":21,"text":"I mean that's clearly the minimum right or if that if that quadratic form if that matrix has","zh":"它要么是零，如果二次型是半正定的，我的意思是，这显然是最小值，对吧？或者如果这个二次型如果这个矩阵有","start":165.01,"end":170.99},{"id":22,"text":"one negative eigenvalue the minimum is minus infinity then at that point it's game over","zh":"一个负特征值，那么最小值是负无穷，此时就游戏结束了，它就是负无穷，对吧？所以你会得到一个非常有趣的下界，它说明了","start":170.99,"end":176.17},{"id":23,"text":"it's minus infinity okay so you end up with a very interesting uh lower bound um it says it","zh":"它要么是零，如果二次型是半正定的，我的意思是，这显然是最小值，对吧？或者如果这个二次型如果这个矩阵有","start":176.17,"end":183.35}],"notes":["本段讲解了拉格朗日函数的构造及其在对偶问题中的作用。讲者提到，拉格朗日函数通过引入拉格朗日乘子将约束条件纳入目标函数，从而形成一个参数化的下界。这种下界由拉格朗日乘子λ和ν参数化，对于任意的λ和ν，都能得到一个下界。","讲者进一步指出，当拉格朗日乘子随机选择时，得到的下界可能是负无穷，这表明这种下界没有实际意义。但在某些情况下，下界是明确的，这取决于拉格朗日函数的结构。","讲者以一个分区问题为例，说明该问题不是凸优化问题。原因包括目标函数不一定是凸的，以及存在非仿射的等式约束（如平方等于1）。这些因素使得该问题不具备凸性。","在对偶函数的推导中，讲者指出拉格朗日函数在变量x上的最小化会得到一个二次型，其最小值取决于该二次型的正定性。如果二次型是半正定的，最小值为零；如果存在负特征值，则最小值为负无穷。","讲者强调，当最小值为负无穷时，意味着下界是无效的，这在优化问题中是一个重要的结论。这种情况下，对偶问题无法提供有用的信息。","最后，讲者提到，这种下界可能非常有趣，但需要进一步分析才能确定其有效性。这表明对偶问题的分析需要仔细考虑拉格朗日函数的结构和约束条件。"],"formulas":[],"uncertainties":["one negative eigenvalue the minimum is minus infinity then at that point it's game over","it's minus infinity okay so you end up with a very interesting uh lower bound um it says it"],"diagram":"none","start":4.78,"end":183.35,"asr_flags":[],"math_clarifications":["原始文本未提供明确的数学表达式，无法核定公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":4.78,"text":"We'll continue on duality, which is this actually super interesting topic."},{"start":11.73,"text":"And what we've seen so far, just to remind you, is we take any optimization problem at all, convex or not, and we form this thing called the Lagrangian. And you can mumble about how, you know, what's the Lagrangian? You go, well, it's a way to kind of incorporate the constraints into the objective, right? And you can mumble about like, oh, that's the market-based thing, you know, blah, blah, blah. Okay, they could do this."},{"start":36.88,"text":"And it's got these mysterious weights, which is how much you weight the constraint functions in forming this Lagrangian, which is this thing that includes some costs or whatever, additional terms from the constraints. So that's the Lagrangian. And then from that, we get a dual function. And to get a dual function, you minimize over x."},{"start":59.02,"text":"right, your variable. And that gives you this dual function, which is a function of these Lagrange multipliers, right? And then we observed that this gives you a lower bound on the optimal value of the original problem. Everybody, so just to recap where we are, right? And so you can even think of that as a parametrized lower bound on the optimal value. It's parametrized by lambda and nu."},{"start":86.17,"text":"And so, in other words, for any lambda nu, you get a lower bound."},{"start":89.03,"text":"Now, by the way, in a lot of cases, if you just throw in random lambdas and nu's,"},{"start":92.51,"text":"here's the lower bound you get, minus infinity, right?"},{"start":95.73,"text":"But that's kind of a universal lower bound and is utterly uninformative, right?"},{"start":99.27,"text":"But in other cases, what you get is not obvious at all, okay?"},{"start":102.79,"text":"So, here's an example."},{"start":105.77,"text":"So, this is the partitioning problem."},{"start":107.89,"text":"I think we talked about it last time."},{"start":110.11,"text":"And it's not convex for a couple of reasons."},{"start":114.93,"text":"reasons. Number one, we didn't say that w was positive semi-definite, so your objective"},{"start":118.91,"text":"does not have to be convex. And then the other one, which makes this very much not a convex"},{"start":124.11,"text":"problem, is that we have a square equals one, and you can't do that. In a convex problem,"},{"start":131.07,"text":"equality constraints must be affine. Okay? So that's the problem. And here what we're"},{"start":140.07,"text":"going to do is work out the dual function for it, right? And to do that, we simply form,"},{"start":146.77,"text":"this is the Lagrangian here, and we minimize this over x, right? And when we minimize it over x,"},{"start":153.11,"text":"we find out that it's a constant plus this thing, which is a quadratic form. And the minimum of a"},{"start":158.59,"text":"quadratic form over x is either zero, if the quadratic form is positive semi-definite,"},{"start":165.01,"text":"I mean that's clearly the minimum right or if that if that quadratic form if that matrix has"},{"start":170.99,"text":"one negative eigenvalue the minimum is minus infinity then at that point it's game over"},{"start":176.17,"text":"it's minus infinity okay so you end up with a very interesting uh lower bound um it says it"}],"speech_gaps":[],"frame":"../frames/v008/001.webp","frame_time":16.78},{"title":"近似解与启发式方法","segments":[{"id":24,"text":"says that you know if you come up with some vectors sorry a vector new or some numbers new","zh":"说如果你能想出一些新的向量或者一些新的数字","start":183.35,"end":188.57},{"id":25,"text":"And provided this holds, if you can take your original matrix, right, add this diagonal matrix, and if that's positive semi-definite, then minus 1 transpose nu is a lower bound on this problem. That's actually super interesting, because actually solving this problem exactly is extremely hard.","zh":"并且如果这个条件成立，如果你能将原来的矩阵加上这个对角矩阵，并且如果这个结果是半正定的，那么负的1转置ν就是这个问题的一个下界。这实际上非常有趣，因为精确地解决这个问题是非常困难的。","start":189.44,"end":208.82},{"id":26,"text":"Good news is you almost never have to solve it exactly, right? So I'm not too concerned about that, right? I mean, for one reason, if you're doing partitioning, that, you know, somebody made up these W's, right? And then if you say, I haven't solved it exactly, you know, someone would say, oh, you have to solve it exactly. Then you just, you say to them, where did your W's come from? And they tell you, and the truth is usually they just made them up, right? That's, I mean, you know, not like the sign is generally right, but generally they're just made up.","zh":"好消息是你几乎从不需要精确地解决这个问题，对吧？所以我对这一点不太担心，对吧？我的意思是，有一个原因，如果你在做划分，这些W矩阵是别人随便编出来的，对吧？如果你说我没有精确地解决这个问题，别人可能会说你必须精确地解决。然后你就可以对他们说，你的W矩阵是从哪里来的？他们会告诉你，实际上通常他们只是随便编出来的，对吧？我的意思是，你不用太在意符号是否正确，但通常他们只是随便编出来的。","start":209.48,"end":238.65},{"id":27,"text":"Okay, so it's not that big a deal in practice that you can't solve this problem exactly.","zh":"所以，在实践中，你不能精确地解决这个问题并不是什么大问题。","start":238.99,"end":243.57},{"id":28,"text":"And let me just give a quick... There's a lot of heuristics for this. I think I even mentioned one last time. It's based on spectral partitioning, but there's a lot. And the other thing is you could write like a super dumb greedy method. Just like the dumbest thing ever. Here's my method. Ready? I'm just saying this is kind of if you were doing street fighting stuff and you're at an internship or a startup and you need to do this. Well, what you'd really do is you'd go find some stuff on GitHub or whatever and start from there. But the point is...","zh":"让我简单说一下，这个问题有很多启发式方法。我想我之前还提过一个。它是基于谱划分的，但还有很多其他的。另一个方法是你可以用一个超级简单的贪心方法。就像最愚蠢的事情一样。这里是我的方法。准备好了吗？我只是说，如果你在做街头斗智或者在实习或初创公司需要做这个，你会怎么做呢？你真的会去GitHub或者其他地方找一些东西，然后从那里开始。但重点是……","start":245.06,"end":270.86},{"id":29,"text":"What you might do for something like this is you initialize x with a random plus minus one vector. Everybody got it? Now, here's my algorithm. It's incredibly dumb. I cycle through the indexes, one, two, three, four, and I simply ask myself, if I flip the sign of x7, will the objective go down? If it goes down, I take it, and I keep going, and I keep doing this cycling through until this is stationary. Everybody got that?","zh":"对于像这样的问题，你可能会用一个随机的正负一向量来初始化x。大家明白了吗？现在，这里是我的算法。它极其简单。我依次遍历索引，1、2、3、4，我简单地问自己，如果我把x7的符号翻转，目标函数会不会下降？如果它下降了，我就采用这个变化，然后继续下去，不断循环，直到这个过程稳定下来。大家明白了吗？","start":271.28,"end":298.68},{"id":30,"text":"Then if I want to write another like four lines of code, I can start doing things like this. I'll look at pairs and think about simultaneous swaps, right? And cycle until there are no pairs that improve the objective. And then I guess in the, I guess it's called in, I guess computer science refers to the first one as one opt and the second as two opt. One opt means that there is no change of a single variable that will improve your objective.","zh":"那么，如果我想再写四行代码，我可以从这样的方式开始。我会查看成对的元素，并考虑同时交换的情况，对吧？然后循环直到没有能够改善目标函数的成对元素。然后我想，这在计算机科学中被称为一种一阶优化方法，而另一种则被称为二阶优化方法。一阶优化意味着不存在对单个变量进行更改以改善目标函数的情况。","start":299.34,"end":326.8},{"id":31,"text":"And the second one is to opt. There's no change of any two variables that would improve your objective. It doesn't mean you're optimal. It just means you're locally optimal in this discrete set, which is... Anyway, everybody got that? So, okay. Methods like that actually often work really well.","zh":"第二种方法是二阶优化。它意味着不存在对任意两个变量进行更改以改善目标函数的情况。这并不意味着你已经达到了全局最优，它仅仅意味着你在这种离散集合中是局部最优的。总之，大家明白了吗？好的。这类方法实际上通常效果非常好。","start":327.59,"end":345.61}],"notes":["本段主要讨论凸优化问题中近似解的必要性，以及实际应用中不需要精确求解的情况。讲者指出，即使无法精确求解，也可以通过启发式方法或贪心算法来获得可行的近似解。例如，通过随机初始化向量并迭代地翻转元素符号以降低目标函数值，这种方法在实践中非常常见。","讲者还介绍了两种常见的局部优化方法：一种是单变量交换（one opt），即没有单个变量的改变能进一步降低目标函数；另一种是双变量交换（two opt），即没有两个变量的联合改变能进一步降低目标函数。这些方法并不保证全局最优，但可以找到局部最优解。","讲者强调，这些启发式方法在实际应用中非常有用，尤其是在需要快速得到近似解的场景，如实习或创业项目中。讲者还提到，可以通过查找GitHub等资源来实现这些方法，而不是从头开始编写复杂的算法。","讲者指出，虽然精确求解凸优化问题在理论上非常困难，但在实际应用中，人们通常不需要精确解。相反，通过启发式方法或贪心算法，可以快速得到足够好的近似解，这在许多实际问题中已经足够。","讲者还提到，这些方法的实现方式可以非常简单，例如通过随机初始化向量并迭代优化，或者通过检查变量对的交换来进一步优化目标函数。这些方法虽然简单，但在实践中往往能取得良好的效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":183.35,"end":345.61,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":183.35,"text":"says that you know if you come up with some vectors sorry a vector new or some numbers new"},{"start":189.44,"text":"And provided this holds, if you can take your original matrix, right, add this diagonal matrix, and if that's positive semi-definite, then minus 1 transpose nu is a lower bound on this problem. That's actually super interesting, because actually solving this problem exactly is extremely hard."},{"start":209.48,"text":"Good news is you almost never have to solve it exactly, right? So I'm not too concerned about that, right? I mean, for one reason, if you're doing partitioning, that, you know, somebody made up these W's, right? And then if you say, I haven't solved it exactly, you know, someone would say, oh, you have to solve it exactly. Then you just, you say to them, where did your W's come from? And they tell you, and the truth is usually they just made them up, right? That's, I mean, you know, not like the sign is generally right, but generally they're just made up."},{"start":238.99,"text":"Okay, so it's not that big a deal in practice that you can't solve this problem exactly."},{"start":245.06,"text":"And let me just give a quick... There's a lot of heuristics for this. I think I even mentioned one last time. It's based on spectral partitioning, but there's a lot. And the other thing is you could write like a super dumb greedy method. Just like the dumbest thing ever. Here's my method. Ready? I'm just saying this is kind of if you were doing street fighting stuff and you're at an internship or a startup and you need to do this. Well, what you'd really do is you'd go find some stuff on GitHub or whatever and start from there. But the point is..."},{"start":271.28,"text":"What you might do for something like this is you initialize x with a random plus minus one vector. Everybody got it? Now, here's my algorithm. It's incredibly dumb. I cycle through the indexes, one, two, three, four, and I simply ask myself, if I flip the sign of x7, will the objective go down? If it goes down, I take it, and I keep going, and I keep doing this cycling through until this is stationary. Everybody got that?"},{"start":299.34,"text":"Then if I want to write another like four lines of code, I can start doing things like this. I'll look at pairs and think about simultaneous swaps, right? And cycle until there are no pairs that improve the objective. And then I guess in the, I guess it's called in, I guess computer science refers to the first one as one opt and the second as two opt. One opt means that there is no change of a single variable that will improve your objective."},{"start":327.59,"text":"And the second one is to opt. There's no change of any two variables that would improve your objective. It doesn't mean you're optimal. It just means you're locally optimal in this discrete set, which is... Anyway, everybody got that? So, okay. Methods like that actually often work really well."}],"speech_gaps":[],"frame":"../frames/v008/002.webp","frame_time":195.35},{"title":"对偶函数与共轭函数的关系","segments":[{"id":32,"text":"Right. Then what's interesting is then I mean, sometimes you don't care. Like you just you put it into some big old project and like everything's working and it's really cool and no one really cares. Right. You test it a little bit. You make some that kind of stuff. But, you know, no one really cares. But you might ask, like, how far from optimal is it? Right. And then it would be something like this that would give that would give you that would give you a very I mean, give you.","zh":"对的。那么有趣的是，有时候你并不在意。比如，你把它放进一个很大的项目里，一切正常运作，非常酷，没人真的在意。对吧。你测试一下，做一些类似的事情。但你知道，没人真的在意。但你可能会问，比如，它离最优解有多远？对吧。然后就会有像这样的东西，会给你一个非常，给我一个，给你一个。","start":346.27,"end":370.87},{"id":33,"text":"in some cases, a pretty good bound, right? I mean, of course, it depends on your quality. But what would happen is you'd say, well, I have a heuristic, runs in 50 milliseconds. And you'd say, oh, yeah, well, I mean, on this problem instance, what value did it get? You go, oh, I got this thing down to, you know, 3.2. And you go, okay, well, that's cool. How far from optimal is that? And you'd go, yeah, well, I came up with a lower bound, provable, that says no one could do better than 2.7.","zh":"在某些情况下，这可以给出一个相当好的界限，对吧？我的意思是，当然，这取决于你的质量。但会发生的是，你会说，好吧，我有一个启发式方法，运行时间是50毫秒。你会说，哦，是的，那在这一问题实例中，它得到了什么值？你会说，哦，我把这个东西降低到，你知道，3.2。然后你会说，好吧，这很酷。那离最优解有多远？你会说，是的，我得到了一个可证明的下界，说明没有人能做得比2.7更好。","start":371.44,"end":400.47},{"id":34,"text":"Everybody follow this? That's actually really useful because it means in that project, you probably don't need someone to go in there and improve your partitioner. They should focus it. Everybody seeing this? I'm just saying these are already super interesting and practical things. There's a strong connection to things like conjugate functions.","zh":"大家明白这个吗？这实际上非常有用，这意味着在这个项目中，你可能不需要有人进去改进你的分区器。他们应该专注于这个。大家看到这个了吗？我只是说，这些已经是超级有趣和实用的事情了。它与共轭函数等有很强的联系。","start":400.84,"end":426.64},{"id":35,"text":"To see that, this is just a completely generic, that's just an optimization problem. Not convex, by the way. It doesn't have to be, right? This is not necessarily a convex problem. It's got linear inequality constraints, so you have a polyhedral feasible set.","zh":"为了看到这一点，这只是一个完全通用的优化问题。顺便说一句，它不一定是凸的。它不需要是凸的，对吧？这不一定是凸问题。它有线性不等式约束，因此你有一个多面体可行集。","start":428.25,"end":444.59},{"id":36,"text":"Of course, that's convex, right? That's fine. And we have an objective we want to minimize, right? So if you work out the dual function, it's, well, it's f0 of x plus the Lagrangian is f0 of x plus, this is going to be here we write, here I write this as, yeah, we're writing it all in terms of lambda, sorry, x. This is lambda transpose, you know, ax minus b, and then plus nu transpose cx minus d, and that ends up.","zh":"当然，这当然是凸的，对吧？这没问题。我们有一个想要最小化的目标函数，对吧？所以如果你计算对偶函数，它就是，嗯，它是f0(x)加上拉格朗日乘数，即f0(x)加上，这里我们写成，这里我写成，是的，我们用lambda来写，抱歉，是x。这是lambda转置，你知道的，ax减b，然后加上nu转置cx减d，最后得到的结果是。","start":445.03,"end":472.11},{"id":37,"text":"You write it this way. And then here, we have to minimize over x. And a lot of stuff floating around here, but here's what you see. These terms don't depend on x at all. So we don't care. They pop out of the infimum, right? Then this thing is minimize a function plus a linear function.","zh":"你这样写。然后在这里，我们需要对x进行最小化。这里有很多东西在浮动，但你看到的是，这些项根本不依赖于x。因此我们并不关心，它们会从下确界中浮现出来，对吧？然后这个表达式就是最小化一个函数加上一个线性函数。","start":472.31,"end":491.47},{"id":38,"text":"Well, that sounds familiar. As a matter of fact, it's like the conjugate. So unfortunately, the conjugate is you're maximizing a linear function minus your function. But these are the same things with the appropriate changes of sign. So what it says is this thing is that. So there you go. So the conjugate just came right out as a portion of the dual function. Everybody.","zh":"这听起来很熟悉。事实上，它就像共轭函数一样。不幸的是，共轭函数是你在最大化一个线性函数减去你的函数。但这些是通过适当符号变化后相同的事物。因此，它说的是这个表达式就是那个。所以就是这样。共轭函数直接作为对偶函数的一部分浮现出来。大家。","start":492.42,"end":519.06}],"notes":["本段讨论了在优化问题中，如何通过启发式方法得到近似解，并通过下界来评估其与最优解的距离。这在实际项目中非常有用，因为即使没有进一步优化，也能提供有价值的参考。","讲者提到，当优化问题具有线性不等式约束时，可行集是多面体，这为后续分析提供了基础。同时，讲者指出，虽然问题本身可能不是凸的，但凸性在某些情况下是重要的。","在推导对偶函数时，讲者强调了如何将原问题转化为对偶形式，并指出某些项与变量无关，因此可以被分离出来。这有助于理解对偶函数的结构。","讲者进一步指出，对偶函数与共轭函数之间存在密切联系，尽管它们的定义形式不同，但本质上是相同的，只是符号有所变化。这种关系在优化理论中具有重要意义。","讲者通过具体的例子说明了如何从对偶函数中提取共轭函数，并指出这种关系在实际应用中非常有用，因为它可以帮助我们更好地理解优化问题的性质。","最后，讲者强调了这种理论联系的实际价值，指出即使在没有进一步优化的情况下，这些概念也能提供重要的见解和指导。"],"formulas":[],"uncertainties":["lambda transpose, you know, ax minus b","nu transpose cx minus d"],"diagram":"none","start":346.27,"end":519.06,"asr_flags":[],"math_clarifications":["原始片段中未提供足够的数学定义和上下文，无法核定公式中的符号、条件和等号的正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":346.27,"text":"Right. Then what's interesting is then I mean, sometimes you don't care. Like you just you put it into some big old project and like everything's working and it's really cool and no one really cares. Right. You test it a little bit. You make some that kind of stuff. But, you know, no one really cares. But you might ask, like, how far from optimal is it? Right. And then it would be something like this that would give that would give you that would give you a very I mean, give you."},{"start":371.44,"text":"in some cases, a pretty good bound, right? I mean, of course, it depends on your quality. But what would happen is you'd say, well, I have a heuristic, runs in 50 milliseconds. And you'd say, oh, yeah, well, I mean, on this problem instance, what value did it get? You go, oh, I got this thing down to, you know, 3.2. And you go, okay, well, that's cool. How far from optimal is that? And you'd go, yeah, well, I came up with a lower bound, provable, that says no one could do better than 2.7."},{"start":400.84,"text":"Everybody follow this? That's actually really useful because it means in that project, you probably don't need someone to go in there and improve your partitioner. They should focus it. Everybody seeing this? I'm just saying these are already super interesting and practical things. There's a strong connection to things like conjugate functions."},{"start":428.25,"text":"To see that, this is just a completely generic, that's just an optimization problem. Not convex, by the way. It doesn't have to be, right? This is not necessarily a convex problem. It's got linear inequality constraints, so you have a polyhedral feasible set."},{"start":445.03,"text":"Of course, that's convex, right? That's fine. And we have an objective we want to minimize, right? So if you work out the dual function, it's, well, it's f0 of x plus the Lagrangian is f0 of x plus, this is going to be here we write, here I write this as, yeah, we're writing it all in terms of lambda, sorry, x. This is lambda transpose, you know, ax minus b, and then plus nu transpose cx minus d, and that ends up."},{"start":472.31,"text":"You write it this way. And then here, we have to minimize over x. And a lot of stuff floating around here, but here's what you see. These terms don't depend on x at all. So we don't care. They pop out of the infimum, right? Then this thing is minimize a function plus a linear function."},{"start":492.42,"text":"Well, that sounds familiar. As a matter of fact, it's like the conjugate. So unfortunately, the conjugate is you're maximizing a linear function minus your function. But these are the same things with the appropriate changes of sign. So what it says is this thing is that. So there you go. So the conjugate just came right out as a portion of the dual function. Everybody."}],"speech_gaps":[],"frame":"../frames/v008/003.webp","frame_time":358.27},{"title":"最大熵问题与对偶函数","segments":[{"id":39,"text":"Got this? So this is actually quite useful. So here's a problem. If I take this thing, this one's convex. Suppose that's my objective. This is the negative entropy. And for example, that'd be a super interesting problem. x might be a probability distribution on n items, right? Presumably, over here, we have 1 transpose x equals 1. And somewhere over here, we... Well, actually, we don't need that because the domain of this says all the x's are non-negative.","zh":"明白了吗？所以这实际上非常有用。这里有一个问题。如果我取这个东西，这个是凸的。假设这是我的目标。这是负熵。例如，这将是一个非常有趣的问题。x可能是n个物品上的概率分布，对吧？显然，在这里我们有1转置x等于1。而在那边，我们……其实我们不需要这个，因为这个域说明所有的x都是非负的。","start":519.88,"end":549.49},{"id":40,"text":"But then the other constraints here are basically the, this would tell you there are expected values of functions whose value is given.","zh":"但这里的其他约束基本上是，这会告诉你有一些函数的期望值是给定的。","start":549.91,"end":560.89},{"id":41,"text":"And this would say there are inequalities, right? So I could say, oh, you know, the second moment is this. The probability that x satisfies this is 0.2. Oh, by the way, the third moment lies between this number and that number. Something like this, right? That would all be this. And then this problem would be finding the maximum entropy distribution consistent with your","zh":"这会说有一些不等式，对吧？所以我可以说，哦，你知道的，二阶矩是这个。x满足这个的概率是0.2。顺便说一句，三阶矩介于这个数和那个数之间。类似这样的事情，对吧？这都会是这个。然后这个问题就是找到一个与这些期望值要求相一致的最大熵分布。","start":561.4,"end":587.14},{"id":42,"text":"your requirements on these expected values. Everybody got that? I mentioned this just because that's actually quite a real problem. So in this case, you could go through all of this, but there's no reason to because you just go and I'd go to Google or something and type in conjugate of negative entropy, and you will find out that it's just this thing. Then that means that","zh":"你们的要求。大家明白了吗？我提到这个只是因为这实际上是一个非常真实的问题。在这种情况下，你可以通过所有这些步骤，但没有理由这么做，因为你只需去谷歌搜索一下负熵的共轭，你会发现它就是这个东西。然后这意味着","start":588.72,"end":614.42},{"id":43,"text":"th 't need that because the domain of this says all the x's are non-negative."},{"start":549.91,"text":"But then the other constraints here are basically the, this would tell you there are expected values of functions whose value is given."},{"start":561.4,"text":"And this would say there are inequalities, right? So I could say, oh, you know, the second moment is this. The probability that x satisfies this is 0.2. Oh, by the way, the third moment lies between this number and that number. Something like this, right? That would all be this. And then this problem would be finding the maximum entropy distribution consistent with your"},{"start":588.72,"text":"your requirements on these expected values. Everybody got that? I mentioned this just because that's actually quite a real problem. So in this case, you could go through all of this, but there's no reason to because you just go and I'd go to Google or something and type in conjugate of negative entropy, and you will find out that it's just this thing. Then that means that"},{"start":615.31,"text":"the dual function of the, you'd say it this way, the dual function of a maximum entropy problem is a convex optimization problem that involves exponentials, right? But by the way, I mean not,"},{"start":630.85,"text":"That should actually strike a chord to people in statistics because it's a connection between maximum entropy and exponential families. You know what I'm talking about? Fine. And if you don't, that's fine too. But just if you know about that stuff. And in fact, there's a lot of duality and conjugates and things floating around in those areas. Okay. Okay. So let me first say where we are. So here's where we are. We have a method where you have any problem at all."},{"start":661.18,"text":"And we can form, we form this Lagrangian, then we form dual function. And someone says, what's a dual function? And you go, well, it's a lower bound on the optimal value of your problem. You go, okay, cool. So then the most obvious thing in the world is you'd say, well, what are these lambda nu? And you go, oh, they're parameters. And you go, well, what do they do? And you go, yeah, for different ones, I get different lower bounds. So, but this kind of like..."}],"speech_gaps":[],"frame":"../frames/v008/004.webp","frame_time":531.88},{"title":"对偶问题与弱对偶性","segments":[{"id":46,"text":"what you obviously want to do is find the best lower bound, right? I mean, you should have an urge to do that, uncontrollable urge to do that. And that leads to this problem, and this is called the Lagrange dual problem. And so what it says is, you know, g of lambda nu is this lower bound on the optimal value of your original problem, which might not be convex, which is interesting, right? Then this says, find the largest lower bound on the objective.","zh":"你显然想要做的就是找到最好的下界，对吧？我的意思是，你应该有一种无法控制的冲动去做这件事。这就会导致这个问题，而这个问题被称为拉格朗日对偶问题。所以它的意思是，你知道的，g of lambda nu 是你原始问题最优值的一个下界，而原始问题可能不是凸的，这很有趣，对吧？然后它说，找到目标函数的最大下界。","start":684.14,"end":712.38},{"id":47,"text":"on the optimal value of the original problem using Lagrange duality. That's how you'd say this in English. Here's what's cool. This is actually a convex problem even if the original problem was not. So that's actually kind of interesting. So here's an example. Here's a so-called standard form linear program. You minimize a linear function subject to equality constraints and non-negativity.","zh":"通过拉格朗日对偶性，使用拉格朗日对偶性来找到原始问题最优值。这是如何用英语表达的。这里很有趣的是，即使原始问题不是凸的，这实际上是一个凸问题。所以这实际上有点意思。举个例子，这是一个所谓的标准形式线性规划问题。你最小化一个线性函数，受等式约束和非负性约束。","start":713.18,"end":740.89},{"id":48,"text":"And then you'll remember that we worked out the dual. By the way, this is not quite the dual. The dual here would be maximize a function that is minus infinity unless you satisfy this and plus infinity otherwise. So I've done a few innocent translations of the problem here. But what it says is these two LPs are intimately related. That's what it says.","zh":"然后你会记得我们推导了对偶问题。顺便说一句，这并不是完全的对偶问题。这里的对偶问题会是最大化一个函数，除非满足这个条件，否则为负无穷，否则为正无穷。我在问题上做了一些无害的翻译。但它的意思是这两个线性规划问题密切相关。这就是它所说的。","start":741.53,"end":770.49},{"id":49,"text":"It says, in fact, they are duals. Actually, the name dual suggests like conjugate. It's something that if you kind of do it twice, you get back to the original. And like conjugate, that's kind of true. But, I mean, in some cases, right? So we would say these are dual LPs. Make sense? I mean, these things are kind of not obvious. Okay.","zh":"它实际上说，它们是对偶的。实际上，名称“对偶”暗示着共轭。它是一种如果你做两次就会回到原始问题的东西。就像共轭一样，这在某种程度上是正确的。但我的意思是，在某些情况下，对吧？所以我们可以说这些是对偶的线性规划问题。有道理吗？我的意思是，这些事情并不明显。好的。","start":771.1,"end":795.83},{"id":50,"text":"Okay, so now we talk about weak and strong duality. So the first thing you have is this. So D star is the optimal value of the dual, and that means it's the largest lower bound on the optimal value of your problem that you can find using Lagrangian duality. That's what D star is. P star is the actual optimal value of the problem, right? Oh, and by the way, perfectly cool to have either or both of those be infinite.","zh":"好的，现在我们讨论弱对偶性和强对偶性。你首先拥有的是这个。D star 是对偶问题的最优值，这意味着它是你能通过拉格朗日对偶性找到的原始问题最优值的最大下界。这就是 D star 的含义。P star 是问题的实际最优值，对吧？哦，顺便说一句，这两个都可以是无限的，这很酷。","start":798.13,"end":826.34},{"id":51,"text":"For example, if D star is infinity, then P star has to be infinity. Basically, that's a certificate telling you that the original problem is infeasible. This holds no matter what. That always holds. Convex problems, non-convex. There are no pathologies, no exceptions. It just always holds. That's so-called weak duality. It's based on...","zh":"例如，如果D星是无穷大，那么P星也必须是无穷大。基本上，这是一张证书，告诉你原始问题不可行。无论什么情况，这都成立。无论是凸问题还是非凸问题，都没有病态情况，也没有例外。它总是成立。这被称为弱对偶性。它是基于...","start":826.85,"end":852.76}],"notes":["本段讲解了对偶问题的基本概念，即通过拉格朗日对偶性找到原始问题的最优值的下界，并指出对偶问题本身是凸的，即使原始问题不是凸的。这为后续讨论弱对偶性和强对偶性奠定了基础。","讲者通过线性规划的例子说明了原始问题和对偶问题之间的紧密关系，指出它们是互为对偶的问题。对偶问题的名称暗示了其与原始问题的某种共轭关系，但这种关系在某些情况下才成立。","弱对偶性是本段的核心内容，讲者强调无论原始问题是否为凸，弱对偶性总是成立的，即对偶问题的最优值不会超过原始问题的最优值。如果对偶问题的最优值为无穷大，则原始问题无可行解。","讲者提到弱对偶性是基于拉格朗日对偶性的基本原理，指出即使在非凸问题中，弱对偶性也始终成立，没有例外情况。这为后续讨论强对偶性提供了对比。","讲者通过具体例子说明了弱对偶性的应用，即当对偶问题的最优值为无穷大时，原始问题无可行解，这为判断问题可行性提供了一个证书。","本段还提到对偶问题的最优值和原始问题的最优值可以是无穷大，这在实际应用中具有重要意义，因为这表明问题可能无界或不可行。"],"formulas":[],"uncertainties":[],"diagram":"none","start":684.14,"end":852.76,"asr_flags":[],"math_clarifications":["原始片段中未提供足够的数学定义或上下文来支持D^*和P^*的具体公式，因此无法核定其数学表达。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":684.14,"text":"what you obviously want to do is find the best lower bound, right? I mean, you should have an urge to do that, uncontrollable urge to do that. And that leads to this problem, and this is called the Lagrange dual problem. And so what it says is, you know, g of lambda nu is this lower bound on the optimal value of your original problem, which might not be convex, which is interesting, right? Then this says, find the largest lower bound on the objective."},{"start":713.18,"text":"on the optimal value of the original problem using Lagrange duality. That's how you'd say this in English. Here's what's cool. This is actually a convex problem even if the original problem was not. So that's actually kind of interesting. So here's an example. Here's a so-called standard form linear program. You minimize a linear function subject to equality constraints and non-negativity."},{"start":741.53,"text":"And then you'll remember that we worked out the dual. By the way, this is not quite the dual. The dual here would be maximize a function that is minus infinity unless you satisfy this and plus infinity otherwise. So I've done a few innocent translations of the problem here. But what it says is these two LPs are intimately related. That's what it says."},{"start":771.1,"text":"It says, in fact, they are duals. Actually, the name dual suggests like conjugate. It's something that if you kind of do it twice, you get back to the original. And like conjugate, that's kind of true. But, I mean, in some cases, right? So we would say these are dual LPs. Make sense? I mean, these things are kind of not obvious. Okay."},{"start":798.13,"text":"Okay, so now we talk about weak and strong duality. So the first thing you have is this. So D star is the optimal value of the dual, and that means it's the largest lower bound on the optimal value of your problem that you can find using Lagrangian duality. That's what D star is. P star is the actual optimal value of the problem, right? Oh, and by the way, perfectly cool to have either or both of those be infinite."},{"start":826.85,"text":"For example, if D star is infinity, then P star has to be infinity. Basically, that's a certificate telling you that the original problem is infeasible. This holds no matter what. That always holds. Convex problems, non-convex. There are no pathologies, no exceptions. It just always holds. That's so-called weak duality. It's based on..."}],"speech_gaps":[],"frame":"../frames/v008/005.webp","frame_time":696.14},{"title":"对偶性与强对偶性","segments":[{"id":52,"text":"these very deep mathematical facts like the product of two non-negative numbers is non-negative. And if you add two non-negative numbers, it's non-negative, right? So it looks like fancy and you can make it sound fancy and weird and mystical and say, well, duality is this. But the point is it's based on just the simplest of things. But now it gets interesting. So strong duality is when these two are equal, right? So it says there's actually, strong duality says basically","zh":"这些非常深刻的数学事实，比如两个非负数的乘积是非负的。如果你把两个非负数相加，结果也是非负的，对吧？看起来很复杂，你可以把它说得 fancy、奇怪和神秘，比如说，对偶性就是这个。但重点是，它基于最简单的事情。但现在它变得有趣了。强对偶性是指这两个值相等，对吧？所以它说实际上，强对偶性基本上意味着","start":853.09,"end":881.75},{"id":53,"text":"You can actually find dual variables whose associated lower bound in the optimal value is actually equal to the optimal value, right? This is strong duality. Now, that in general doesn't hold, but here's the cool part. It usually holds for convex problems. And in fact, I'd even strengthen that. I would say that in all practical problems, convex problems, it holds. All.","zh":"你可以找到一些对偶变量，它们所对应的最优值的下界实际上等于最优值，对吧？这就是强对偶性。现在，这在一般情况下并不成立，但这里有个酷的地方。它通常适用于凸问题。事实上，我甚至会加强这一点。我会说，在所有实际问题中，凸问题都成立。全部。","start":882.91,"end":909.97},{"id":54,"text":"Are there convex problems for which it fails? There are, but if you encounter one, you better actually go back and ask yourself. I mean, number one, you're not going to okay. But if you did actually, what's much more likely, some annoying person like who works with you is gonna say like, well, how do you know like, you know, how do you know it you have zero duality strong duality, right? In which case you just tell them to go away. So, but if you if you were to encounter one of these pathologies.","zh":"是否存在强对偶性不成立的凸问题？有，但如果你遇到这种情况，你最好回去问问自己。我的意思是，第一点，你不会 okay 的。但如果你真的遇到这种情况，更有可能的是，某个让你烦的人，比如和你一起工作的人，会问你，你怎么知道你有强对偶性，对吧？在这种情况下，你只需要让他们走开。但如果你真的遇到了这些病态情况。","start":911.5,"end":940.02},{"id":55,"text":"you would need to rethink your whole, you're going to have to rethink what you're doing because you're doing something wrong. That's basically the right way to say it. Okay, so okay now, uh, to to know that strong duality holds, you actually have to add some uh, usually some concern. This is called constraint qualifications. There's","zh":"你将不得不重新思考你所做的一切，因为你做错了。基本上这就是正确的说法。好的，现在，要知道强对偶性成立，你实际上必须添加一些通常的条件。这被称为约束资格。","start":940.65,"end":961.17},{"id":56,"text":"entire books on these things. You could take entire courses on nothing but you know constraint qualifications, and somewhere around the 150th page of these books you see this big old thing, and they have that people's names like you know, so it's later's qual, you know, method and this one and that one, and you would see like you know, which implies which and stuff like that, which is all fine. This is all I'm not I'm I I was I'm trained in pure math so I I","zh":"关于这些内容有整本书。你可以开设整个课程只讲约束资格，而在这些书的第150页左右，你会看到一个大大的东西，上面写着人们的名字，比如后来的资格，比如这种方法和那种方法，你会看到哪些条件蕴含哪些条件，等等，这都很好。这全部都是我，我受过纯数学的训练，所以我……","start":961.72,"end":984.88},{"id":57,"text":"So I'm allowed to say things about mathematics. It's totally fine, not hurting anyone, right? But it's not something I think normal people need to worry about, to be perfectly honest, okay? But we'll get to that. So here's an example where this is actually super interesting. This is where, you know, first you write your three-line thing, your greedy thing that does partitioning.","zh":"所以，我可以谈论一些数学问题。这完全没问题，不会伤害任何人，对吧？但说实话，我认为普通人在乎这些并不必要。不过我们之后会谈到这一点。这里有一个实际非常有趣的例子。这就是你首先写下你那三行的贪心算法，它执行划分操作的地方。","start":985.83,"end":1006.49}],"notes":["本段讲解了强对偶性的概念，即原问题的最优值与对偶问题的最优值相等。这在凸优化中通常成立，但在某些情况下可能不成立，需要重新审视问题。","讲者提到强对偶性在实际问题中通常成立，但并非所有凸问题都满足，因此需要额外的条件（如约束资格）来确保强对偶性成立。","讲者指出，如果遇到强对偶性不成立的情况，需要重新考虑问题的设定，这可能意味着问题本身存在某些错误或需要更深入的分析。","讲者提到约束资格是确保强对偶性成立的重要条件，相关理论非常复杂，甚至可以单独作为一门课程来学习。","讲者提到，虽然这些理论在数学上非常重要，但对于普通用户来说，可能并不需要深入理解，除非在实际应用中遇到相关问题。","讲者以一个例子说明强对偶性的实际应用，即通过简单的贪心算法进行分区，这可能与对偶性理论相关。"],"formulas":[],"uncertainties":["constraint qualifications","later's qual","method and this one and that one"],"diagram":"none","start":853.09,"end":1006.49,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":853.09,"text":"these very deep mathematical facts like the product of two non-negative numbers is non-negative. And if you add two non-negative numbers, it's non-negative, right? So it looks like fancy and you can make it sound fancy and weird and mystical and say, well, duality is this. But the point is it's based on just the simplest of things. But now it gets interesting. So strong duality is when these two are equal, right? So it says there's actually, strong duality says basically"},{"start":882.91,"text":"You can actually find dual variables whose associated lower bound in the optimal value is actually equal to the optimal value, right? This is strong duality. Now, that in general doesn't hold, but here's the cool part. It usually holds for convex problems. And in fact, I'd even strengthen that. I would say that in all practical problems, convex problems, it holds. All."},{"start":911.5,"text":"Are there are there convex problems for which it fails there are but if you encounter one You better actually be go back and ask yourself. I mean number one. You're not going to okay But if you did actually what's much more likely some annoying person like who works with you is gonna say like well How do you know like, you know, how do you know it you have zero duality strong duality, right? In which case you just tell them to go away so So but if you if you were to encounter one of these pathologies"},{"start":940.65,"text":"you would need to rethink your whole you're going to have to rethink what you're doing because you're doing something wrong that's basically the right way to say it okay so okay now uh to to know that strong duality holds you actually have to add some uh usually some concern this is called constraint qualifications there's"},{"start":961.72,"text":"entire books on these things you could take entire courses on nothing but you know constraint qualifications and somewhere around the 150th page of these books you see this big old thing and they have that people's names like you know so it's later's qual you know method and this one and that one and you would see like you know which implies which and stuff like that which is all fine this is all i'm not i'm i i was i'm trained in pure math so i i"},{"start":985.83,"text":"So I'm allowed to say things about mathematics. It's totally fine, not hurting anyone, right? But it's not something I think normal people need to worry about, to be perfectly honest, okay? But we'll get to that. So here's an example where this is actually super interesting. This is where, you know, first you write your three-line thing, your greedy thing that does partitioning."}],"speech_gaps":[],"frame":"../frames/v008/006.webp","frame_time":865.09},{"title":"凸优化中的约束资格与对偶性","segments":[{"id":58,"text":"You test it, it passes all the unit tests, you plug it into the big system, you're a hero, it works, it's fast. And then at some point you're bored and someone says, well, how far do you think you are from the global optimum? And the answer is you don't know. But what you do then is you solve this convex problem here. That's actually a semi-definite program. And that will give you a number, and you compare it to the number that your greedy algorithm is producing for partitioning.","zh":"你测试它，它通过了所有单元测试，你把它放进大系统中，你就是英雄，它有效且快速。然后在某个时候你会感到无聊，有人会问，你认为你离全局最优解有多远？答案是你不知道。但你接下来会解决这个凸问题。实际上，这是一个半正定规划问题。这会给你一个数值，你将其与贪心算法在划分中产生的数值进行比较。","start":1006.82,"end":1035.96},{"id":59,"text":"And if they're reasonably close, and guess what? Of course, they're going to be reasonably close. Then you declare. Actually, it's kind of cool. Then you just set that aside and wait for somebody to say, hey, how do you do your partitioning? And you go, four-line greedy algorithm. Or whatever you do. I do spectral partitioning followed with a four-line greedy algorithm. And they go, how does it work? And you go, really well, thanks. Then if they're annoying, they would say.","zh":"如果它们相当接近，猜猜看？当然，它们会相当接近。然后你会宣布。实际上，这有点酷。然后你把这搁置一边，等待有人问，你是如何进行划分的？你会回答，四行贪心算法。或者你所做的任何事情。我使用谱划分后接四行贪心算法。他们会问，它如何运作？你会回答，效果很好，谢谢。如果他们很烦人，他们会说。","start":1036.42,"end":1062.2},{"id":60,"text":"yeah, but that's, you know, that's not convex. How far are you from the global optimum, right?","zh":"是的，但那不是凸的。你离全局最优解有多远，对吧？","start":1062.82,"end":1067.58},{"id":61,"text":"Probably the correct answer to that is who cares and please go away because I have actual work to","zh":"对这个问题的正确回答可能是谁在乎，快走吧，因为我有实际的工作要做。","start":1067.7,"end":1071.84},{"id":62,"text":"do. But that's probably the right one. But you could say, oh, funny, you should ask that because","zh":"但那可能是正确的答案。但你可以说，哦，有趣，你应该问这个问题，因为","start":1071.84,"end":1075.82},{"id":63,"text":"I actually solved the dual problem and I found out I'm typically about five to 10% at most suboptimal.","zh":"我实际上解决了对偶问题，并发现我通常最多只比最优解差5%到10%。","start":1075.82,"end":1080.98},{"id":64,"text":"at most suboptimal. Everybody see what I'm saying? So, okay, cool. So here is, this is","zh":"最多比最优解差。大家明白我的意思吗？所以，好吧，很酷。所以这里，这是","start":1080.98,"end":1088.58},{"id":65,"text":"probably the most famous constraint qualification. It's, I guess, for people who actually study these","zh":"可能是最著名的约束资格条件。我想，这是为那些真正研究这些问题的人准备的。","start":1088.58,"end":1094.42},{"id":66,"text":"things, this is the sledgehammer, right? So, it's just like, it's just a, this is sledgehammer. It's","zh":"事情，这就是重锤，对吧？所以，它就像，它只是一个，这就是重锤。它","start":1094.42,"end":1099.72},{"id":67,"text":"basically like, this will do the trick. It's this, and it basically says that strong duality is","zh":"基本上就像，这会解决问题。这就是，它基本上说明了对于凸问题，只要存在一个点使得不等式严格成立，强对偶性就得到保证。","start":1099.72,"end":1107.72},{"id":68,"text":"guaranteed for a convex problem, provided there exists a point where the inequalities hold strictly.","zh":"严格成立。","start":1107.72,"end":1114.72},{"id":69,"text":"holds strictly.","zh":"现在，有很多问题中这种情况并不成立，","start":1114.72,"end":1115.08},{"id":70,"text":"Now, there are lots of problems where that doesn't hold,","zh":"但强对偶性依然成立。","start":1115.4,"end":1117.72},{"id":71,"text":"and yet strong duality is just fine.","zh":"例如，你可以原谅线性不等式","start":1117.82,"end":1119.64},{"id":72,"text":"And for example, you can excuse the linear inequalities","zh":"并不需要严格满足。","start":1123.38,"end":1128.04},{"id":73,"text":"do not need to be satisfied strictly.","zh":"不需要严格满足。","start":1128.04,"end":1131.94},{"id":74,"text":"need to be satisfied strictly.","zh":"需要严格满足。","start":1131.94,"end":1134.04},{"id":75,"text":"And there are a gazillion other types of constraint","zh":"还有无数其他类型的约束条件","start":1134.68,"end":1137.22},{"id":76,"text":"qualifications.","zh":"资格。","start":1137.22,"end":1137.8},{"id":77,"text":"So if you get into a weird mood, you","zh":"所以如果你心情不好，你","start":1138.28,"end":1140.06},{"id":78,"text":"go to Google or Wikipedia and type constraint qualifications.","zh":"可以去Google或Wikipedia搜索constraint qualifications。","start":1140.06,"end":1143.36},{"id":79,"text":"implications um if i mean if you're if you're interested in that okay so these are um so let's","zh":"蕴含关系，嗯，如果我的意思是，如果你对这个感兴趣的话，好的，那么这些是嗯，那么让我们","start":1143.36,"end":1151.04},{"id":80,"text":"let's look at um something like let's just look at a couple examples so here here's an inequality","zh":"让我们看看，比如，让我们看看几个例子。这里这里是一个不等式形式的线性规划，它说最小化c转置x，受一堆线性不等式约束，对吧","start":1151.04,"end":1158.14},{"id":81,"text":"form lp it says minimize c transpose x subject to a whole bunch of linear inequalities right","zh":"对于线性规划，它说最小化c转置x，受一堆线性不等式约束，对吧","start":1158.14,"end":1164.18},{"id":82,"text":"then the dual function is well you just form the lagrangian the lagrangian is going to be","zh":"那么对偶函数是明确的，你只需形成拉格朗日函数，拉格朗日函数将是","start":1164.18,"end":1170.34},{"id":83,"text":"C transpose X plus lambda transpose AX minus B.","zh":"C的转置乘以X加上lambda的转置乘以AX减去B。","start":1170.34,"end":1175.9}],"notes":["本段讨论了凸优化中约束资格的概念，特别是关于强对偶性成立的条件。讲者提到，当存在一个点使得所有不等式严格成立时，强对偶性可以被保证。这被称为约束资格中最著名的条件之一，但并非所有情况都需要满足这一条件。","讲者指出，对于线性不等式约束，不需要严格满足，强对偶性依然可以成立。这表明约束资格的条件是灵活的，适用于不同类型的约束。","在讲者提到的线性规划例子中，目标是最小化c的转置乘以x，约束是一组线性不等式。对偶函数的构造涉及拉格朗日函数，其中包含原问题的变量和对偶变量。","讲者提到的拉格朗日函数形式为C转置乘以x加上lambda转置乘以A乘以x减去B，这表明对偶问题的构造过程。","讲者还提到，如果对约束资格感兴趣，可以查阅Google或维基百科，这表明该概念在优化理论中具有广泛的应用和研究价值。","讲者通过实际例子说明了约束资格的适用性，强调了在不同约束条件下强对偶性可能成立的情况，这有助于理解凸优化中的对偶理论。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1006.82,"end":1175.9,"asr_flags":[],"math_clarifications":["原始片段中提到的拉格朗日函数公式存在错误，正确的形式应为 $ L(x, \nu) = c^T x + \nu^T (Ax - b) $，但原文中未明确说明变量和约束条件，且未提及拉格朗日乘子的符号和约束条件的正确形式。因此，该公式无法核定，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":1006.82,"text":"You test it, it passes all the unit tests, you plug it into the big system, you're a hero, it works, it's fast. And then at some point you're bored and someone says, well, how far do you think you are from the global optimum? And the answer is you don't know. But what you do then is you solve this convex problem here. That's actually a semi-definite program. And that will give you a number, and you compare it to the number that your greedy algorithm is producing for partitioning."},{"start":1036.42,"text":"And if they're reasonably close, and guess what? Of course, they're going to be reasonably close. Then you declare. Actually, it's kind of cool. Then you just set that aside and wait for somebody to say, hey, how do you do your partitioning? And you go, four-line greedy algorithm. Or whatever you do. I do spectral partitioning followed with a four-line greedy algorithm. And they go, how does it work? And you go, really well, thanks. Then if they're annoying, they would say."},{"start":1062.82,"text":"yeah, but that's, you know, that's not convex. How far are you from the global optimum, right?"},{"start":1067.7,"text":"Probably the correct answer to that is who cares and please go away because I have actual work to"},{"start":1071.84,"text":"do. But that's probably the right one. But you could say, oh, funny, you should ask that because"},{"start":1075.82,"text":"I actually solved the dual problem and I found out I'm typically about five to 10%"},{"start":1080.98,"text":"at most suboptimal. Everybody see what I'm saying? So, okay, cool. So here is, this is"},{"start":1088.58,"text":"probably the most famous constraint qualification. It's, I guess, for people who actually study these"},{"start":1094.42,"text":"things, this is the sledgehammer, right? So, it's just like, it's just a, this is sledgehammer. It's"},{"start":1099.72,"text":"basically like, this will do the trick. It's this, and it basically says that strong duality is"},{"start":1107.72,"text":"guaranteed for a convex problem, provided there exists a point where the inequalities hold"},{"start":1114.72,"text":"holds strictly."},{"start":1115.4,"text":"Now, there are lots of problems where that doesn't hold,"},{"start":1117.82,"text":"and yet strong duality is just fine."},{"start":1123.38,"text":"And for example, you can excuse the linear inequalities"},{"start":1128.04,"text":"from this requirement, that linear inequalities do not"},{"start":1131.94,"text":"need to be satisfied strictly."},{"start":1134.68,"text":"And there are a gazillion other types of constraint"},{"start":1137.22,"text":"qualifications."},{"start":1138.28,"text":"So if you get into a weird mood, you"},{"start":1140.06,"text":"go to Google or Wikipedia and type constraint qualifications."},{"start":1143.36,"text":"implications um if i mean if you're if you're interested in that okay so these are um so let's"},{"start":1151.04,"text":"let's look at um something like let's just look at a couple examples so here here's an inequality"},{"start":1158.14,"text":"form lp it says minimize c transpose x subject to a whole bunch of linear inequalities right"},{"start":1164.18,"text":"then the dual function is well you just form the lagrangian the lagrangian is going to be"},{"start":1170.34,"text":"C transpose X plus lambda transpose AX minus B."}],"speech_gaps":[{"start":1120.192,"end":1122.704}],"frame":"../frames/v008/007.webp","frame_time":1018.82},{"title":"对偶问题与强对偶性","segments":[{"id":84,"text":"And we rewrite that this way so that we see it's an infimum. That's an affine function. And we know what the infimum of an affine function is. It's usually minus infinity. But if the linear part of the affine function vanishes, then it's whatever the constant is, right? So this is that. So the real dual problem is this, is maximize this function g subject to lambda bigger than or equal to zero. That's like the true or literal dual.","zh":"我们将它重写成这种形式，这样我们就能看出这是一个下确界。这是一个仿射函数。我们知道仿射函数的下确界是什么。通常是负无穷大。但如果仿射函数的线性部分消失，那么它就是那个常数，对吧？这就是这种情况。因此，真正的对偶问题是最大化这个函数g，满足lambda大于等于零。这就是真正的或字面意义上的对偶问题。","start":1176.41,"end":1205.5},{"id":85,"text":"Problem right then what we're gonna. Do is here our objective is gonna. Have you know has has implicit or hidden? Constraints in this case you know this equality constraint if we make that explicit you would write the dual problem this way Right and and that would be that that would be it so that's kind of cool. I mean it what it says is","zh":"接下来我们要做的问题是，我们的目标函数是否有隐含或隐藏的约束？在这种情况下，这是一个等式约束，如果我们明确写出这个约束，就会将对偶问题写成这样。对，就是这样，这很有趣。我的意思是，它所说的实际上是","start":1206.08,"end":1229.56},{"id":86,"text":"It says the following. It says that this linear program is very closely related to this one. And we can say all sorts of stuff about it. Number one, if you have a lambda that's feasible for this problem, so it's non-negative, satisfies its equality constraint, then this number is a lower bound on the optimal value of that one. That's number one. Number two...","zh":"它说的是以下内容。它说的是这个线性规划问题与这个问题非常密切相关。我们可以对它说很多话。第一点，如果你有一个对于这个问题可行的lambda，即它是非负的，并满足其等式约束，那么这个数就是那个问题最优值的一个下界。这是第一点。第二点……","start":1230.83,"end":1255.15},{"id":87,"text":"Actually, in this case, you know, Slater's condition is that this should hold... Well, okay, the stronger form of Slater's condition says that if you have linear inequalities, you don't have to... There is no requirement. So, in fact, this one, you have strong duality all the time, except in extreme...","zh":"实际上，在这种情况下，Slater条件是这个应该成立……好吧，更强形式的Slater条件说的是，如果你有线性不等式，你不需要……实际上没有任何要求。因此，事实上，这个情况总是具有强对偶性，除了在极端……","start":1256.45,"end":1273.05},{"id":88,"text":"extremely pathological cases, right? Where, in fact, you would have d stars minus infinity and p star equals plus infinity. So they're both infeasible. And you have to construct these. They're extremely small and silly. But at least now you know that it can happen. It's not going to happen. Okay. And what's cool is there is actually, you know, if you solve this problem, there's actually a lambda, which is feasible here, and this number is equal to the objective there.","zh":"极端病态的情况下，对吧？在这种情况下，你会有d星等于负无穷大，p星等于正无穷大。它们都是不可行的。你必须构造这些情况。它们极其微小且荒谬。但至少现在你知道这种情况可能发生。它不会发生。好的。而有趣的是，如果你解决这个问题，实际上存在一个在这里可行的lambda，而且这个数等于那里的目标值。","start":1273.76,"end":1302.06},{"id":89,"text":"And that gives you a certificate of optimality, which is awesome. As a matter of fact, what we're going to find is when you solve this one by most methods, whether you like it or not, it is going to give you a lambda here. So that's really cool because it says when you solve an LP, it comes back and it says, yeah, okay, here's X. You check it's feasible and you see its optimal value. Or sorry, you see its value.","zh":"这给了你一个最优性的证明，这非常棒。事实上，我们将会发现，当你用大多数方法来解决这个问题时，无论你是否喜欢，它都会给你一个lambda值。这真的很酷，因为它表示当你解决一个线性规划问题时，它会返回并说：好吧，这里有一个X。你检查它是否可行，并看到它的目标值。或者抱歉，你看到它的值。","start":1302.51,"end":1326.81},{"id":90,"text":"It also returns a completely independent checkable proof that no one, no feasible point could have an objective value smaller. Everybody see what I'm saying? This is like super strong, right? In numerical computing, this is very rare, right? To get something like that. But that's actually what all solvers do. It's kind of cool. They return both.","zh":"它还会返回一个完全独立的、可验证的证明，证明没有任何可行点能有更小的目标值。大家明白我的意思吗？这非常强大，对吧？在数值计算中，得到这样的结果是非常罕见的，对吧？但事实上，所有的求解器都会这么做。这有点酷，它们会同时返回这两个结果。","start":1327.44,"end":1350.43}],"notes":["本段主要讲解了对偶问题的构建过程，以及对偶问题与原始问题之间的关系。讲者指出，当我们将隐式约束显式化后，可以写出对偶问题，并且对偶问题的最优值是原始问题的一个下界。这为后续的强对偶性分析奠定了基础。","讲者提到，Slater条件在某些情况下并不需要满足，因此在这种情况下，强对偶性总是成立，除非在极端病态的情况下。这种极端情况包括原始问题和对偶问题都不可行，且最优值分别为正无穷和负无穷。","讲者强调，当求解对偶问题时，求解器会返回一个可行的lambda值，并且这个lambda值对应于原始问题的最优值。这为最优性提供了强有力的证明，即没有任何可行点的最优值会比这个值更小。","讲者指出，这种双重返回（即原始问题的最优值和对偶问题的最优值）在数值计算中非常罕见，但所有求解器都会提供这种双重验证，这使得对偶问题在优化中具有重要的理论和实践意义。","讲者通过具体的例子说明了对偶问题的构建过程，以及如何通过对偶问题来验证原始问题的最优性。这种双重验证机制是凸优化中的一个重要特性。","讲者还提到，这种双重验证机制在实际应用中非常有用，因为它不仅提供了最优值，还提供了一个独立的证明，确保没有其他可行点的最优值更优。这种特性在数值计算中非常罕见，但却是凸优化的核心优势之一。"],"formulas":[{"latex":"g(\\lambda)","symbols":"对偶函数","explanation":"对偶函数g(λ)是原始问题的拉格朗日函数关于原始变量的下确界，保持原式正确。","evidence":"And we rewrite that this way so that we see it's an infimum. That's an affine function. And we know what the infimum of an affine function is. It's usually minus infinity. But if the linear part of the affine function vanishes, then it's whatever the constant is, right? So this is that. So the real dual problem is this, is maximize this function g subject to lambda bigger than or equal to zero. That's like the true or literal dual."},{"latex":"p^*","symbols":"原始问题的最优值","explanation":"原始问题的最优值p*是原始问题的最小值，保持原式正确。","evidence":"extremely pathological cases, right? Where, in fact, you would have d stars minus infinity and p star equals plus infinity. So they're both infeasible. And you have to construct these. They're extremely small and silly. But at least now you know that it can happen. It's not going to happen. Okay. And what's cool is there is actually, you know, if you solve this problem, there's actually a lambda, which is feasible here, and this number is equal to the objective there."},{"latex":"d^*","symbols":"对偶问题的最优值","explanation":"对偶问题的最优值d*是对偶问题的最大值，保持原式正确。","evidence":"extremely pathological cases, right? Where, in fact, you would have d stars minus infinity and p star equals plus infinity. So they're both infeasible. And you have to construct these. They're extremely small and silly. But at least now you know that it can happen. It's not going to happen. Okay. And what's cool is there is actually, you know, if you solve this problem, there's actually a lambda, which is feasible here, and this number is equal to the objective there."},{"latex":"\\lambda \\geq 0","symbols":"拉格朗日乘数非负","explanation":"拉格朗日乘数λ非负是约束条件，保持原式正确。","evidence":"And we rewrite that this way so that we see it's an infimum. That's an affine function. And we know what the infimum of an affine function is. It's usually minus infinity. But if the linear part of the affine function vanishes, then it's whatever the constant is, right? So this is that. So the real dual problem is this, is maximize this function g subject to lambda bigger than or equal to zero. That's like the true or literal dual."}],"uncertainties":["extremely pathological cases"],"diagram":"none","start":1176.41,"end":1350.43,"asr_flags":[],"math_clarifications":["原文提到强对偶性成立的条件，但未明确给出具体数学表达式，因此无法进一步核对。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1176.41,"text":"And we rewrite that this way so that we see it's an infimum. That's an affine function. And we know what the infimum of an affine function is. It's usually minus infinity. But if the linear part of the affine function vanishes, then it's whatever the constant is, right? So this is that. So the real dual problem is this, is maximize this function g subject to lambda bigger than or equal to zero. That's like the true or literal dual."},{"start":1206.08,"text":"Problem right then what we're gonna. Do is here our objective is gonna. Have you know has has implicit or hidden? Constraints in this case you know this equality constraint if we make that explicit you would write the dual problem this way Right and and that would be that that would be it so that's kind of cool. I mean it what it says is"},{"start":1230.83,"text":"It says the following. It says that this linear program is very closely related to this one. And we can say all sorts of stuff about it. Number one, if you have a lambda that's feasible for this problem, so it's non-negative, satisfies its equality constraint, then this number is a lower bound on the optimal value of that one. That's number one. Number two..."},{"start":1256.45,"text":"Actually, in this case, you know, Slater's condition is that this should hold... Well, okay, the stronger form of Slater's condition says that if you have linear inequalities, you don't have to... There is no requirement. So, in fact, this one, you have strong duality all the time, except in extreme..."},{"start":1273.76,"text":"extremely pathological cases, right? Where, in fact, you would have d stars minus infinity and p star equals plus infinity. So they're both infeasible. And you have to construct these. They're extremely small and silly. But at least now you know that it can happen. It's not going to happen. Okay. And what's cool is there is actually, you know, if you solve this problem, there's actually a lambda, which is feasible here, and this number is equal to the objective there."},{"start":1302.51,"text":"And that gives you a certificate of optimality, which is awesome. As a matter of fact, what we're going to find is when you solve this one by most methods, whether you like it or not, it is going to give you a lambda here. So that's really cool because it says when you solve an LP, it comes back and it says, yeah, okay, here's X. You check it's feasible and you see its optimal value. Or sorry, you see its value."},{"start":1327.44,"text":"It also returns a completely independent checkable proof that no one, no feasible point could have an objective value smaller. Everybody see what I'm saying? This is like super strong, right? In numerical computing, this is very rare, right? To get something like that. But that's actually what all solvers do. It's kind of cool. They return both."}],"speech_gaps":[],"frame":"../frames/v008/008.webp","frame_time":1188.41},{"title":"对偶问题与最优性证书","segments":[{"id":91,"text":"what's called a primal optimal and a dual optimal, and that the dual optimal serves as a certificate of optimality. So these are kind of very cool things, right? Okay, let's look at another example. Here's a quadratic program. So here's the primal problem, right? So you minimize a quadratic over a polyhedron, and we work out the dual function, and it looks like this, right?","zh":"所谓的对偶最优解和原问题最优解，而对偶最优解可以作为最优性的证书。因此，这些是非常酷的事情，对吧？好的，让我们看看另一个例子。这里是一个二次规划问题。所以这是原问题，对吧？你最小化一个二次函数在一个多面体上，我们推导出对偶函数，看起来像这样，对吧？","start":1351.63,"end":1374.89},{"id":92,"text":"And so the dual problem is this. And what it says is that this problem and this problem are intimately related. This says any feasible lambda here, this number, is a lower bound on the optimal value of that. So that's what this says. Oh, by the way, any feasible point here is an upper bound on the optimal value. The objective of any feasible point here is an upper bound on the optimal value of this. I mean, of course, right?","zh":"因此，对偶问题就是这个。它说的是，这个问题和这个问题之间有着密切的关系。它表示这里的任何可行的λ值，这个数，都是那个问题最优值的下界。这就是它所表达的意思。顺便说一下，这里的任何可行点都是这个最优值的上界。这里的任何可行点的目标值都是这个最优值的上界。我的意思是，当然，对吧？","start":1376.71,"end":1402.98},{"id":93,"text":"Okay, in this case, you don't even need, again, these are linear, so Slater is, the strong Slater says you are excused from checking Slater's constraint for linear inequality constraints. And in this problem, there are no exceptions. It's just P star equals D star, right? So, okay, so this is kind of the idea. By the way, this is a stunning place to get to because if you remember how the whole story started, it started.","zh":"好的，在这种情况下，你甚至不需要再次检查，因为这些是线性的，所以Slater条件成立。强Slater条件表示你不需要检查线性不等式约束的Slater条件。在这个问题中，没有任何例外。它就是P星等于D星，对吧？所以，好的，这就是这个想法。顺便说一下，这是一个令人惊叹的到达点，因为如果你还记得整个故事是如何开始的，它开始得非常不靠谱，对吧？","start":1404.94,"end":1432.75},{"id":94,"text":"very implausibly, right? Here's how this whole thing started. The whole thing started this way. You say, well, I have inequality constraints, and so here's the semantics. Here's f1 of x. It's like 0, 0 if you're less than or equal to 0, and plus infinity if you're positive, right? So we said, yeah, that's the problem I have. And you go, oh, cool. May I approximate it? And you go, yeah, go ahead, please. And you say, well, I'm going to approximate it with something that looks like that.","zh":"这里是整个故事的开始方式。整个故事就是这样开始的。你说，好吧，我有不等式约束，这里是语义。这里是f1 of x。它像0，0如果你小于或等于0，而如果是正数的话就是正无穷大，对吧？所以我们说，是的，这就是我所面临的问题。然后你说，哦，酷。我可以近似它吗？然后你说，是的，请去做吧。然后你说，好吧，我要用看起来像这样的东西来近似它。","start":1433.91,"end":1459.35},{"id":95,"text":"then you look at that and you're like, dude, that's not a good approximation. I mean, that's not a good approximation, right? I mean, it's not. If someone had drawn something that looked like this, you would say, okay, that's an approximation. I don't know how anyone could ever say that this is an approximation. So if you remember, this was the start of the story. And it is deeply implausible. And here's what this says. What this says is that, weirdly, if you adjust this correctly,","zh":"然后你看着这个，你会想，哥们，这不是一个好近似。我是说，这不是一个好近似，对吧？我是说，它不是。如果有人画出了看起来像这样的东西，你会说，好吧，这是一个近似。我不知道怎么有人会说这个是近似。所以如果你还记得的话，这是故事的开始。而且这显然是极不可能的。而这说的是，奇怪的是，如果你正确地调整它，","start":1461.1,"end":1489.07},{"id":96,"text":"then very weirdly, you will actually kind of get, I don't want to say get the solution, but you'll get the optimal value of the original problem. So in other words, it looks dumb, but it turned out it's actually, at least for convex problems, it's not as dumb as it might appear at first. Everybody got that? So it's kind of, I don't know, I find it kind of interesting and cool. We'll see you.","zh":"那么非常奇怪的是，你实际上会得到，我不想说得到解，但你会得到原始问题的最优值。换句话说，看起来很傻，但结果发现，至少对于凸问题来说，它并不像乍一看那么傻。大家明白了吗？所以这有点，我不知道，我觉得这有点有趣和酷。我们下次见。","start":1490.03,"end":1515.73}],"notes":["本段讲解了对偶问题与原始问题之间的关系，指出对偶最优解可以作为原始问题最优性的证书。任何可行的对偶变量都是原始问题最优值的下界，而任何可行的原始问题点的值都是对偶问题最优值的上界。这是对偶理论中的核心概念。","在本段中，讲者提到对于线性约束问题，强Slater条件允许我们跳过Slater条件的验证，因为该问题没有例外情况，因此原始问题和对偶问题的最优值相等（P* = D*）。这表明在满足强Slater条件的情况下，对偶问题可以提供原始问题的最优解的保证。","讲者回顾了凸优化问题的起源，指出最初的约束形式是通过定义一个类似0的函数来表示不等式约束，这种形式看似不直观，但通过调整可以得到原始问题的最优值。这说明了凸优化问题的非直观性，但其结果却具有理论上的保证。","讲者强调了凸优化问题的特殊性，即尽管初始的近似方法看起来不靠谱，但通过正确的调整，可以得到原始问题的最优值。这表明在凸优化中，看似不合理的近似方法可能具有理论上的有效性。","讲者通过举例说明了凸优化问题的直观性和理论上的深刻性，指出虽然初始的近似方法看起来不直观，但通过正确的调整，可以得到原始问题的最优值。这表明凸优化问题的理论基础和实际应用的结合。","讲者最后总结了凸优化问题的有趣之处，指出尽管初始的近似方法看起来不直观，但通过正确的调整，可以得到原始问题的最优值。这表明凸优化问题的理论基础和实际应用的结合。"],"formulas":[{"latex":"P^* = D^*","symbols":"P* 表示原始问题的最优值，D* 表示对偶问题的最优值","explanation":"公式正确表达了原始问题和对偶问题的最优值相等，这是强对偶性成立的条件。","evidence":"Okay, in this case, you don't even need, again, these are linear, so Slater is, the strong Slater says you are excused from checking Slater's constraint for linear inequality constraints. And in this problem, there are no exceptions. It's just P star equals D star, right? So, okay, so this is kind of the idea. By the way, this is a stunning place to get to because if you remember how the whole story started, it started."}],"uncertainties":["Slater is, the strong Slater says you are excused from checking Slater's constraint for linear inequality constraints"],"diagram":"none","start":1351.63,"end":1515.73,"asr_flags":[],"math_clarifications":["原始文本中未提供具体的数学公式，仅提及了P*和D*的等式。根据上下文，该等式在强对偶性成立时成立，例如在满足Slater条件的凸优化问题中。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1351.63,"text":"what's called a primal optimal and a dual optimal, and that the dual optimal serves as a certificate of optimality. So these are kind of very cool things, right? Okay, let's look at another example. Here's a quadratic program. So here's the primal problem, right? So you minimize a quadratic over a polyhedron, and we work out the dual function, and it looks like this, right?"},{"start":1376.71,"text":"And so the dual problem is this. And what it says is that this problem and this problem are intimately related. This says any feasible lambda here, this number, is a lower bound on the optimal value of that. So that's what this says. Oh, by the way, any feasible point here is an upper bound on the optimal value. The objective of any feasible point here is an upper bound on the optimal value of this. I mean, of course, right?"},{"start":1404.94,"text":"Okay, in this case, you don't even need, again, these are linear, so Slater is, the strong Slater says you are excused from checking Slater's constraint for linear inequality constraints. And in this problem, there are no exceptions. It's just P star equals D star, right? So, okay, so this is kind of the idea. By the way, this is a stunning place to get to because if you remember how the whole story started, it started."},{"start":1433.91,"text":"very implausibly, right? Here's how this whole thing started. The whole thing started this way. You say, well, I have inequality constraints, and so here's the semantics. Here's f1 of x. It's like 0, 0 if you're less than or equal to 0, and plus infinity if you're positive, right? So we said, yeah, that's the problem I have. And you go, oh, cool. May I approximate it? And you go, yeah, go ahead, please. And you say, well, I'm going to approximate it with something that looks like that."},{"start":1461.1,"text":"then you look at that and you're like, dude, that's not a good approximation. I mean, that's not a good approximation, right? I mean, it's not. If someone had drawn something that looked like this, you would say, okay, that's an approximation. I don't know how anyone could ever say that this is an approximation. So if you remember, this was the start of the story. And it is deeply implausible. And here's what this says. What this says is that, weirdly, if you adjust this correctly,"},{"start":1490.03,"text":"then very weirdly, you will actually kind of get, I don't want to say get the solution, but you'll get the optimal value of the original problem. So in other words, it looks dumb, but it turned out it's actually, at least for convex problems, it's not as dumb as it might appear at first. Everybody got that? So it's kind of, I don't know, I find it kind of interesting and cool. We'll see you."}],"speech_gaps":[],"frame":"../frames/v008/009.webp","frame_time":1363.63},{"title":"非凸问题中的强对偶性","segments":[{"id":97,"text":"Oh, actually, I think I'm going to skip this and just say the following. There are a number of non-convex problems where people know that strong duality holds. And a famous one, we don't have to worry about this, is actually when you minimize a non-convex quadratic subject over, let's say, a unit ball.","zh":"哦，实际上，我想我跳过这个，直接说以下内容。有很多非凸问题，人们知道其中强对偶性成立。一个著名的例子，我们不需要担心这个，就是当你在单位球上最小化一个非凸二次函数。","start":1516.27,"end":1544.85},{"id":98,"text":"So it turns out in that case, and it is not easy to show this, you have strong duality. And that's actually super interesting. By the way, this is actually used by some, I think, kind of weird people to argue something, which I'll explain.","zh":"事实上，在这种情况下，强对偶性成立，虽然要证明这一点并不容易。这实际上非常有趣。顺便说一下，这被一些我认为有点奇怪的人用来论证某些问题，我稍后会解释。","start":1545.53,"end":1572.83},{"id":99,"text":"The implication of this is that any optimization problem with two quadratics... convex or not, we can solve tractably. Everybody got that? Now, you know a bunch of them, right? Eigenvalue problems, singular value problems. If I walk up to you in the street and say, I have a symmetric matrix, please, you know, maximize X transpose AX subject to X transpose X, you know, equals one. You can solve that. That's an eigenvalue problem, right? And you say, oh, is that an approximate solution or a heuristic? And you'll know that's the global solution. And they go, oh, is your problem convex? And you go, actually, it's not. Everybody see what I'm saying?","zh":"这意味着任何包含两个二次项的优化问题……无论是否凸，我们都可以有效地求解。大家明白了吗？现在，你们已经知道一些这样的问题了，对吧？特征值问题、奇异值问题。如果我在街上走到你面前，说：我有一个对称矩阵，请你最大化X的转置乘以A乘以X，条件是X的转置乘以X等于一。你能解决这个问题。这是一个特征值问题，对吧？然后你会问：哦，这是近似解还是启发式方法？你会知道这是全局解。他们会问：哦，你的问题是凸的吗？你会回答：实际上，它不是。大家明白我在说什么吗？","start":1573.8,"end":1602.12},{"id":100,"text":"Okay, so people, I think, I mean, it's okay. It's all right. So there are people who say that any problem you can solve, like anywhere in optimization, is because it's convex. That's a very strong statement, and it's weird, but it's also partly true. And so you start asking questions like...","zh":"好的，所以人们，我想，没关系。这没问题。有些人说，任何你在优化领域中能解决的问题，都是因为它是凸的。这是一个非常强的陈述，虽然奇怪，但部分是正确的。因此，你开始提出一些问题，比如……","start":1602.58,"end":1624.96},{"id":101,"text":"hey, in my computer science class, you know, my baby computer science class, I found out that we can tractably find the shortest path in a graph. Well, guess what? It turns out that the relaxation of that can be proved to be tight, right? So there's zero duality gap for that.","zh":"嘿，在我的计算机科学课上，我的婴儿计算机科学课上，我发现我们可以在图中有效地找到最短路径。猜猜看？事实上，这个问题的松弛形式可以被证明是紧致的，对吧？所以这个问题的零对偶间隙。","start":1625.2,"end":1641.37},{"id":102,"text":"I mean, I think it's silly because it doesn't really do anything for you. You go, oh, should I fire up like CVXPy and use a linear programming solver to find the shortest path? You're like, no, you should use the shortest path algorithm of which they have a lot and they're really good. Use Dijkstra or something. Everybody following this? Then they say, yeah, but the other problems I can solve is I can solve these extremal problems with matrices. Like I can solve eigenproblems, right? And then...","zh":"我的意思是，我觉得这很傻，因为它对你实际上并没有什么帮助。你会想，哦，我应该启动CVXPy并使用线性规划求解器来找最短路径吗？你会想，不，你应该使用他们有很多且非常优秀的最短路径算法，比如Dijkstra算法。大家跟上了吗？然后他们说，是的，但其他问题我可以解决，我可以解决这些极值问题，用矩阵。比如我可以解决特征值问题，对吧？然后……","start":1641.81,"end":1667.66},{"id":103,"text":"All this says is, yeah, you can solve eigenproblems because the dual of your eigenproblem is A is convex and B has strong duality holds. Everybody see this? So it's a stretch, but technically it's true. So it's an extreme point of view, but it's not a bad one.","zh":"所有这些说的是，是的，你可以解决特征值问题，因为你的特征值问题的对偶问题是A是凸的，且B满足强对偶性。大家明白这一点吗？所以这有点牵强，但技术上是正确的。这是一种极端的观点，但并不是一个糟糕的观点。","start":1668.09,"end":1685.65}],"notes":["本段讨论了非凸问题中强对偶性的情况，特别是当目标函数是二次函数且约束条件为单位球时，强对偶性成立。这表明即使在非凸问题中，某些情况下也可以通过对偶性来求解问题。","讲者提到，这种强对偶性在某些情况下被用来论证某些问题的性质，例如在图中寻找最短路径的问题中，松弛问题可以被证明是紧的，因此存在零对偶间隙。","讲者指出，虽然强对偶性在某些问题中成立，但并不意味着所有可解的问题都是凸的。例如，最大特征值问题虽然是非凸的，但可以通过对偶性来求解。","讲者还提到，虽然强对偶性在某些情况下成立，但使用凸优化工具（如CVXPy）来求解某些问题（如最短路径）并不总是最佳选择，因为存在更高效的算法（如Dijkstra算法）。","讲者强调，虽然强对偶性在某些问题中成立，但这种观点是一种极端的观点，虽然技术上正确，但并不总是适用。","讲者通过举例说明，即使在非凸问题中，某些情况下也可以通过对偶性来求解，这表明强对偶性在优化问题中具有重要的应用价值。"],"formulas":[{"latex":"\\max X^T A X","symbols":"最大化向量X的转置与矩阵A的乘积再与X的转置相乘","explanation":"公式正确，表示最大化二次型，适用于对称矩阵A和单位向量X的约束。","evidence":"convex or not, we can solve tractably. Everybody got that? Now, you know a bunch of them, right? Eigenvalue problems, singular value problems. If I walk up to you in the street and say, I have a symmetric matrix, please, you know, maximize X transpose AX subject to X transpose X, you know, equals one. You can solve that. That's an eigenvalue problem, right? And you say, oh, is that an approximate solution or a heuristic? And you'll know that's the global solution. And they go, oh, is your problem convex? And you go, actually, it's not. Everybody see what I'm saying?"},{"latex":"X^T X = 1","symbols":"向量X的转置与X的乘积等于1","explanation":"公式正确，表示向量X的长度为1的约束条件。","evidence":"convex or not, we can solve tractably. Everybody got that? Now, you know a bunch of them, right? Eigenvalue problems, singular value problems. If I walk up to you in the street and say, I have a symmetric matrix, please, you know, maximize X transpose AX subject to X transpose X, you know, equals one. You can solve that. That's an eigenvalue problem, right? And you say, oh, is that an approximate solution or a heuristic? And you'll know that's the global solution. And they go, oh, is your problem convex? And you go, actually, it's not. Everybody see what I'm saying?"}],"uncertainties":[],"diagram":"none","start":1516.27,"end":1685.65,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1516.27,"text":"Oh, actually, I think I'm going to skip this and just say the following. There are a number of non-convex problems where people know that strong duality holds. And a famous one, we don't have to worry about this, is actually when you minimize a non-convex quadratic subject over, let's say, a unit ball."},{"start":1545.53,"text":"So it turns out in that case, and it is not easy to show this, you have strong duality. And that's actually super interesting. By the way, this is actually used by some, I think, kind of weird people to argue something, which I'll explain. So the general idea is this. The implication of this is that any optimization problem with two quadratics..."},{"start":1573.8,"text":"convex or not, we can solve tractably. Everybody got that? Now, you know a bunch of them, right? Eigenvalue problems, singular value problems. If I walk up to you in the street and say, I have a symmetric matrix, please, you know, maximize X transpose AX subject to X transpose X, you know, equals one. You can solve that. That's an eigenvalue problem, right? And you say, oh, is that an approximate solution or a heuristic? And you'll know that's the global solution. And they go, oh, is your problem convex? And you go, actually, it's not. Everybody see what I'm saying?"},{"start":1602.58,"text":"Okay, so people, I think, I mean, it's okay. It's all right. So there are people who say that any problem you can solve, like anywhere in optimization, is because it's convex. That's a very strong statement, and it's weird, but it's also partly true. And so you start asking questions like..."},{"start":1625.2,"text":"hey, in my computer science class, you know, my baby computer science class, I found out that we can tractably find the shortest path in a graph. Well, guess what? It turns out that the relaxation of that can be proved to be tight, right? So there's zero duality gap for that."},{"start":1641.81,"text":"I mean, I think it's silly because it doesn't really do anything for you. You go, oh, should I fire up like CVXPy and use a linear programming solver to find the shortest path? You're like, no, you should use the shortest path algorithm of which they have a lot and they're really good. Use Dijkstra or something. Everybody following this? Then they say, yeah, but the other problems I can solve is I can solve these extremal problems with matrices. Like I can solve eigenproblems, right? And then..."},{"start":1668.09,"text":"All this says is, yeah, you can solve eigenproblems because the dual of your eigenproblem is A is convex and B has strong duality holds. Everybody see this? So it's a stretch, but
