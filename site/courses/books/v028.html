u're optimizing for, first, it's not exactly accuracy. It's not exactly aligned with that.","start":1974.54,"end":1994.08},{"id":125,"text":"Typically what reinforcement learning with human feedback, what it's doing oftentimes is actually sharpening the distribution. So the pre-trained model, it often will output all sorts of stuff. And what RLHF is trying to do is like, let's say, okay, this is the mode that we really want our model to be predicting. And it's going to be sharpening that distribution to really encourage the model to be more likely to sample one mode.","start":1996.48,"end":2016.66},{"id":126,"text":"And that sharpening often leads to it being overconfident in certain circumstances, especially when preferences are rewarding you for being confident. And and then also at times being correct and confident and that sometimes being incorrect and confident. Cool. So let's talk a little bit about how to do research.","start":2017.28,"end":2043.28},{"id":127,"text":"And this will be a focus on how to do research that's more of an empirical flavor, similar to the research that you do if you're doing a deep reinforcement learning project. Now, before I get started, I have a couple different thoughts. The first is that...","start":2044.3,"end":2063.8},{"id":128,"text":"I'll talk a lot about how I go about the research process and advice that I give to PhD students as I see them working through various research projects. But there's many different ways to do research. And it's important and good for the community to do research in many different ways because that leads to more diverse discoveries. And if everyone did research the exact way that I do research, then we would probably have fewer diverse discoveries. And so diversity is good.","start":2064.62,"end":2092.14}],"notes":["本段讨论了强化学习中通过人类反馈进行优化时，模型分布的锐化现象。这种锐化会导致模型在某些情况下变得过于自信，尤其是在偏好奖励自信时。模型可能在正确且自信、错误且自信的情况下表现不同，这反映了模型在优化目标时的偏差。","讲者指出，这种现象并非预期，但回顾来看，可以合理猜测其原因。主要理论认为，优化目标并非完全等同于准确性，而是与之有一定偏差。这种偏差可能导致模型在某些情况下表现出过度自信。","讲者进一步说明，强化学习与人类反馈（RLHF）通常会通过锐化分布来引导模型更倾向于预测特定模式。这种做法虽然有助于提高模型的预测能力，但也可能带来过度自信的问题。","讲者提到，研究方法应注重实证风格，类似于深度强化学习项目中的研究方式。他强调，研究方法的多样性对社区的创新至关重要，因为单一的研究方式可能导致发现的多样性减少。","讲者指出，虽然他个人有特定的研究方法，但社区应鼓励多种研究方式，以促进更多元化的发现。这种多样性是推动科学进步的重要因素。","最后，讲者提到，他将分享自己在研究过程中的经验，并为博士生提供建议。他强调，研究方法的多样性是社区发展的关键，不应拘泥于单一方式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1923.42,"end":2092.14,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1923.42,"text":"And then even in terms of online policy evaluation, if we need to evaluate a policy in all sorts of circumstances, can we figure out how best to select representative scenarios that will allow us to measure generalist performance without having to evaluate every single possible scenario? Cool. Now, that was all I had for frontiers and open problems."},{"start":1949.33,"text":"I guess one thing I want to convey is that now that you've taken the class, you should be really well equipped to start tackling these challenges. You don't know everything about reinforcement learning, of course, but you should know a lot of the fundamentals that will allow you to go read research papers, understand where the state of the art is, and build on the state of the art. So your question is, why does this happen, basically?"},{"start":1974.54,"text":"So I don't think we necessarily expect this, but looking at this in retrospect, I think it's reasonable to make some guesses for why this is happening. And I think the predominant theory for why this is happening is that the objective that you're optimizing for, first, it's not exactly accuracy. It's not exactly aligned with that."},{"start":1996.48,"text":"Typically what reinforcement learning with human feedback, what it's doing oftentimes is actually sharpening the distribution. So the pre-trained model, it often will output all sorts of stuff. And what RLHF is trying to do is like, let's say, okay, this is the mode that we really want our model to be predicting. And it's going to be sharpening that distribution to really encourage the model to be more likely to sample one mode."},{"start":2017.28,"text":"And that sharpening often leads to it being overconfident in certain circumstances, especially when preferences are rewarding you for being confident. And and then also at times being correct and confident and that sometimes being incorrect and confident. Cool. So let's talk a little bit about how to do research."},{"start":2044.3,"text":"And this will be a focus on how to do research that's more of an empirical flavor, similar to the research that you do if you're doing a deep reinforcement learning project. Now, before I get started, I have a couple different thoughts. The first is that..."},{"start":2064.62,"text":"I'll talk a lot about how I go about the research process and advice that I give to PhD students as I see them working through various research projects. But there's many different ways to do research. And it's important and good for the community to do research in many different ways because that leads to more diverse discoveries. And if everyone did research the exact way that I do research, then we would probably have fewer diverse discoveries. And so diversity is good."}],"speech_gaps":[],"frame":"../frames/v028/012.webp","frame_time":1935.42},{"title":"研究路径与研究现实","segments":[{"id":129,"text":"My research approach is not necessarily the best approach, and I don't think there's any one approach that is the best approach. I also felt like it could be good to give a little bit of a backstory, which is that I did not intend to have a career in research.","start":2093.84,"end":2107.82},{"id":130,"text":"I was planning to go to industry and develop products, which is what my parents did in various engineering fields. And I felt like that was the way to have real world impact. I did internships in industry and kind of eventually figured out that I was excited about AI and I was excited about algorithm development. And it seemed like the frontier of that and algorithm development was really in a research environment rather than an industry environment.","start":2109.55,"end":2137.33},{"id":131,"text":"And a lot of the topics I was excited about didn't really work. Like things like robotics didn't really work even today. Robots often don't work very well. And so they're really in this sort of research domain. Also, the people that I met in industry that were working on the kinds of things that I wanted to be working on all had PhDs. And so I was like, well, I should probably get a PhD too if I want to work on those things. And then I also just found research and the ambiguity of research to be really kind of intellectually interesting and challenging.","start":2138.13,"end":2167.43},{"id":132,"text":"And so that's all to say that you don't have to intend to work in research in order to eventually end up doing research. Cool. And then the last thing I'll mention before getting into how to do research is just some general realities with research. The first is that very, very few research ideas are good.","start":2168.4,"end":2195.23},{"id":133,"text":"And very, very few research ideas have impact, have lasting impact especially. A lot of ideas don't work. A lot of ideas don't work to the extent that they won't lead to papers. As an example of this, here are the outcomes of some of my research ideas. And here are the outcome of some more of my research ideas. And there's a lot of kind of...","start":2195.8,"end":2216.78},{"id":134,"text":"failure. And this often, like the risk and the challenge of doing research informs like different ways, like a lot of what I'll say has to do with dealing with that sort of risk and dealing with those challenges. And then even if it does lead to a paper, a lot of impacts won't, a lot of papers won't necessarily have a lasting impact. The second thing that I'll mention is that","start":2217.08,"end":2240.69},{"id":135,"text":"Research is inherently incremental. We are building upon the knowledge of previous research that's been done. And as an example of this, alpha fold, arguably like a really impactful thing.","start":2241.96,"end":2254.3},{"id":136,"text":"Very, very successful. Arguably could be considered a breakthrough. This itself was in many ways incremental. It built very closely on a large 20-year academic project called CASP, which was a protein structure prediction project.","start":2255.35,"end":2271.43}],"notes":["本段讲授了研究路径的非预设性，强调研究并非必须有意为之，而是可能在探索过程中自然形成。讲者提到自己原本计划进入工业界开发产品，但后来发现对算法开发和AI的兴趣，最终转向研究领域。","讲者指出研究的现实之一是很少有研究想法是真正有价值的，且很少能产生持久影响。很多想法会失败，甚至无法发表论文。这反映了研究过程中的高风险和挑战。","讲者进一步说明研究是渐进的，建立在前人研究成果之上。以AlphaFold为例，虽然被认为是突破性成果，但其本身是基于长达20年的学术项目CASP的积累。","讲者强调研究过程中需要应对风险和挑战，这包括对失败的接受和对持续改进的追求。研究的成果往往需要时间才能显现其价值。","讲者通过自身经历说明，研究的动机和路径可能并非一开始就明确，而是随着探索和兴趣的转变而逐渐形成。","讲者指出，即使研究产生了论文，也不一定意味着有持久影响，这反映了研究结果的不确定性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2093.84,"end":2271.43,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2093.84,"text":"My research approach is not necessarily the best approach, and I don't think there's any one approach that is the best approach. I also felt like it could be good to give a little bit of a backstory, which is that I did not intend to have a career in research."},{"start":2109.55,"text":"I was planning to go to industry and develop products, which is what my parents did in various engineering fields. And I felt like that was the way to have real world impact. I did internships in industry and kind of eventually figured out that I was excited about AI and I was excited about algorithm development. And it seemed like the frontier of that and algorithm development was really in a research environment rather than an industry environment."},{"start":2138.13,"text":"And a lot of the topics I was excited about didn't really work. Like things like robotics didn't really work even today. Robots often don't work very well. And so they're really in this sort of research domain. Also, the people that I met in industry that were working on the kinds of things that I wanted to be working on all had PhDs. And so I was like, well, I should probably get a PhD too if I want to work on those things. And then I also just found research and the ambiguity of research to be really kind of intellectually interesting and challenging."},{"start":2168.4,"text":"And so that's all to say that you don't have to intend to work in research in order to eventually end up doing research. Cool. And then the last thing I'll mention before getting into how to do research is just some general realities with research. The first is that very, very few research ideas are good."},{"start":2195.8,"text":"And very, very few research ideas have impact, have lasting impact especially. A lot of ideas don't work. A lot of ideas don't work to the extent that they won't lead to papers. As an example of this, here are the outcomes of some of my research ideas. And here are the outcome of some more of my research ideas. And there's a lot of kind of..."},{"start":2217.08,"text":"failure. And this often, like the risk and the challenge of doing research informs like different ways, like a lot of what I'll say has to do with dealing with that sort of risk and dealing with those challenges. And then even if it does lead to a paper, a lot of impacts won't, a lot of papers won't necessarily have a lasting impact. The second thing that I'll mention is that"},{"start":2241.96,"text":"Research is inherently incremental. We are building upon the knowledge of previous research that's been done. And as an example of this, alpha fold, arguably like a really impactful thing."},{"start":2255.35,"text":"Very, very successful. Arguably could be considered a breakthrough. This itself was in many ways incremental. It built very closely on a large 20-year academic project called CASP, which was a protein structure prediction project."}],"speech_gaps":[],"frame":"../frames/v028/013.webp","frame_time":2105.84},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":137,"text":"That was basically kind of a competition and a data set for doing this sort of structure prediction. I'd also built very heavily on advances in neural networks. And so even if any one research project isn't a breakthrough, it often plays an important role because it allows other projects to build on it or other projects to potentially rule out ideas that have been tried already. And then the last thing that I'll mention is that oftentimes people think about developing really cool, fancy algorithms. But in a world where...","start":2272.16,"end":2300.45},{"id":138,"text":"Scaling up is often quite important, especially in AI research. Oftentimes, it's actually the simple ideas that have more impact than the fancy ideas or the complex algorithms. And that's just because the simple ideas are the things that can scale, they're the things that are easy to be integrated into different systems and easy to build on top of. Okay, cool. With that out of the way, I'll talk about...","start":2301.03,"end":2330.74},{"id":139,"text":"What to work on, how to do the work, how to share the work, and then a couple of miscellaneous topics. And I would argue that these three things, picking problems to work on, doing the research, and sharing the work, are all equally important. And it's easy to think that maybe number two is the most important or maybe number one, but all of these are actually really, really important for being successful in research. Okay.","start":2331.17,"end":2359.94},{"id":140,"text":"So step one for what to work on. I think that a research project needs two things. The first is an important problem. And the second is a plan for how to approach that problem. And if you only have one of these, then usually that doesn't constitute a good project direction. So, for example, maybe one project idea is I want to solve climate change.","start":2360.52,"end":2383.35},{"id":141,"text":"That is an important problem, but I don't have a plan for how to approach it. So it doesn't make a good research project, even though it's a really important problem. Second, maybe I have a really cool algorithm that at best will make a robot or a reinforcement learning system a little bit more successful. This is maybe a really cool idea, and maybe I have a plan, maybe I have two, but I'm missing kind of the important problem that this is actually solving.","start":2384.38,"end":2412.55},{"id":142,"text":"And so for this latter part, I think it's really important to think about if the project is really, really successful, what will the outcome look like? Does it solve an important problem? Or what is the upper bound of that project? And if the upper bound is not very high, then usually it doesn't make for a very good project. Step two, if you have an important problem and a plan for how to approach it, are you excited about it? Research is a lot of work.","start":2415.57,"end":2443.72}],"notes":["本段主要讨论了深度强化学习研究中的关键要素，包括如何选择研究课题、如何进行研究以及如何分享研究成果。讲者强调这三个方面同等重要，不能忽视任何一个。他指出，仅仅有重要的问题或有计划的方案都不足以构成一个良好的研究项目，必须两者兼具。此外，他还提到简单想法往往比复杂算法更具影响力，因为它们更容易扩展和集成到不同系统中。","讲者通过两个例子说明了研究项目需要同时具备重要问题和解决计划。第一个例子是解决气候变化，虽然问题重要，但缺乏具体的解决计划，因此不是一个好的研究项目。第二个例子是一个可能的算法，虽然有计划，但缺乏解决的重要问题，因此也不够好。他建议在考虑项目时，应思考如果项目成功，其结果会是什么，以及项目的上限是否足够高。","讲者进一步指出，即使有重要的问题和计划，研究者是否对项目感到兴奋也很重要。因为研究工作需要大量的努力，只有真正感兴趣的研究方向才能持续推动研究进展。他强调了研究过程中动机和热情的重要性，这是成功的关键因素之一。","讲者还提到，在研究过程中，分享研究成果同样重要。这不仅有助于推动学术交流，还能促进其他研究者在该项目基础上进行进一步探索。因此，选择研究课题、进行研究和分享成果这三个方面是相辅相成的，缺一不可。","讲者最后指出，虽然有时人们倾向于开发复杂的算法，但实际中简单而有效的想法往往更具影响力。这是因为简单的方法更容易被集成到不同的系统中，并且能够更广泛地应用。因此，在设计研究项目时，应优先考虑那些具有扩展性和实用性的方案。","讲者强调了研究过程中需要平衡多个因素，包括问题的重要性、解决计划的可行性、研究者的兴趣以及成果的可分享性。只有当这些因素都得到充分考虑时，才能确保研究项目的成功。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2272.16,"end":2443.72,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2272.16,"text":"That was basically kind of a competition and a data set for doing this sort of structure prediction. I'd also built very heavily on advances in neural networks. And so even if any one research project isn't a breakthrough, it often plays an important role because it allows other projects to build on it or other projects to potentially rule out ideas that have been tried already. And then the last thing that I'll mention is that oftentimes people think about developing really cool, fancy algorithms. But in a world where..."},{"start":2301.03,"text":"Scaling up is often quite important, especially in AI research. Oftentimes, it's actually the simple ideas that have more impact than the fancy ideas or the complex algorithms. And that's just because the simple ideas are the things that can scale, they're the things that are easy to be integrated into different systems and easy to build on top of. Okay, cool. With that out of the way, I'll talk about..."},{"start":2331.17,"text":"What to work on, how to do the work, how to share the work, and then a couple of miscellaneous topics. And I would argue that these three things, picking problems to work on, doing the research, and sharing the work, are all equally important. And it's easy to think that maybe number two is the most important or maybe number one, but all of these are actually really, really important for being successful in research. Okay."},{"start":2360.52,"text":"So step one for what to work on. I think that a research project needs two things. The first is an important problem. And the second is a plan for how to approach that problem. And if you only have one of these, then usually that doesn't constitute a good project direction. So, for example, maybe one project idea is I want to solve climate change."},{"start":2384.38,"text":"That is an important problem, but I don't have a plan for how to approach it. So it doesn't make a good research project, even though it's a really important problem. Second, maybe I have a really cool algorithm that at best will make a robot or a reinforcement learning system a little bit more successful. This is maybe a really cool idea, and maybe I have a plan, maybe I have two, but I'm missing kind of the important problem that this is actually solving."},{"start":2415.57,"text":"And so for this latter part, I think it's really important to think about if the project is really, really successful, what will the outcome look like? Does it solve an important problem? Or what is the upper bound of that project? And if the upper bound is not very high, then usually it doesn't make for a very good project. Step two, if you have an important problem and a plan for how to approach it, are you excited about it? Research is a lot of work."}],"speech_gaps":[],"frame":"../frames/v028/014.webp","frame_time":2284.16},{"title":"选择研究问题的三步法与研究方法","segments":[{"id":143,"text":"If it's fun, if you think it's really cool and exciting, then you're more likely to work hard on it. And if you're working hard on it, you're much more likely to be successful on it. And this is actually probably true for a lot of things outside of research, too.","start":2445.84,"end":2459.68},{"id":144,"text":"Good to, I don't know, spend time on the things that you find exciting, that you find really cool. You'll probably, if you can find some of those things, it may not even be just one thing. If you can just find something that you think is really cool and exciting, then you'll probably do a lot better at it. Cool. And then step three. Like I mentioned before, a lot of ideas don't work. And so it's really good to think about, like, if you are brutally honest about why your idea could fail to solve the problem,","start":2460.89,"end":2491.08},{"id":145,"text":"Does the idea still have a good chance of working? And if not, then probably it won't work. And that's mostly just because of the reality of most ideas not actually working in research. And it's important to be honest with yourself about whether this will actually solve the problem or not. Cool. So that's my three-step process for picking problems. Now, a couple more thoughts on this. So research can often either start with an idea or a problem.","start":2491.85,"end":2522.66},{"id":146,"text":"And I think both of these sorts of approaches to a project have merits. And I've done research that's more idea-driven. I've also done research that's more problem-driven. But I tend to lean towards one myself. And the reason is as follows. So if you start with an idea, you need to find a problem that that idea solves. And there may not exist an important problem that the idea solves.","start":2523.72,"end":2550.21},{"id":147,"text":"It may sort of solve a problem, but there might be a better way to solve the problem. And if there's a better way to solve the problem, then that idea may not have a lot of impact. On the contrary, if you start with a problem, then you're trying to find the best solution to that problem. And one downside is it may be harder to write a paper if the solution ends up being kind of obvious in retrospect.","start":2551.01,"end":2574.09},{"id":148,"text":"But at least you're guaranteed to be working on an important problem. And if you find a solution, you'll still be happy, even if it ends up being a little bit harder to figure out how to write a paper about it. Another way to put this is that with idea-driven research, your sort of goal is to get the idea to work. Whereas in the second case, your goal is to solve the problem.","start":2575.36,"end":2595.06},{"id":149,"text":"The second camp seems like a much more comfortable place to be because it's possible that the idea just doesn't want to work or it's not going to work at the end of the day. Another note here is that if you're thinking about a problem that you want to solve, it's really important to get to the bottleneck of that problem. So if the problem is bottlenecked on data, for example, and you start exploring new algorithms separate from the data for how to solve it,","start":2597.14,"end":2624.88}],"notes":["本段讲解了选择研究问题的三步法：首先，选择你感兴趣且觉得有趣的事情，因为兴趣会促使你努力工作，从而提高成功的可能性；其次，要诚实评估你的想法是否有可能解决问题，如果不能，那么这个想法可能不会成功；最后，强调了研究可以以想法或问题为导向，两种方法各有优劣，但作者更倾向于以问题为导向，因为这样能确保研究的是重要问题，即使解决方案显而易见，也能保证研究的价值。","作者提到，以问题为导向的研究方法，虽然可能在撰写论文时遇到困难，但至少能确保研究的是重要问题。而以想法为导向的研究方法，目标是让想法有效，但可能面临想法无法实现的风险。","此外，作者强调在选择问题时，要找到问题的瓶颈，例如如果问题受限于数据，那么探索新的算法时应考虑数据的限制，而不是单独开发算法。","作者指出，以问题为导向的研究方法更让人感到舒适，因为即使想法无法实现，也能确保研究的是重要问题，而以想法为导向的研究方法则可能面临想法无法实现的风险。","作者还提到，研究可以以想法或问题为导向，两种方法各有优劣，但作者更倾向于以问题为导向，因为这样能确保研究的是重要问题，即使解决方案显而易见，也能保证研究的价值。","最后，作者强调在选择问题时，要找到问题的瓶颈，例如如果问题受限于数据，那么探索新的算法时应考虑数据的限制，而不是单独开发算法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2445.84,"end":2624.88,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2445.84,"text":"If it's fun, if you think it's really cool and exciting, then you're more likely to work hard on it. And if you're working hard on it, you're much more likely to be successful on it. And this is actually probably true for a lot of things outside of research, too."},{"start":2460.89,"text":"Good to, I don't know, spend time on the things that you find exciting, that you find really cool. You'll probably, if you can find some of those things, it may not even be just one thing. If you can just find something that you think is really cool and exciting, then you'll probably do a lot better at it. Cool. And then step three. Like I mentioned before, a lot of ideas don't work. And so it's really good to think about, like, if you are brutally honest about why your idea could fail to solve the problem,"},{"start":2491.85,"text":"Does the idea still have a good chance of working? And if not, then probably it won't work. And that's mostly just because of the reality of most ideas not actually working in research. And it's important to be honest with yourself about whether this will actually solve the problem or not. Cool. So that's my three-step process for picking problems. Now, a couple more thoughts on this. So research can often either start with an idea or a problem."},{"start":2523.72,"text":"And I think both of these sorts of approaches to a project have merits. And I've done research that's more idea-driven. I've also done research that's more problem-driven. But I tend to lean towards one myself. And the reason is as follows. So if you start with an idea, you need to find a problem that that idea solves. And there may not exist an important problem that the idea solves."},{"start":2551.01,"text":"It may sort of solve a problem, but there might be a better way to solve the problem. And if there's a better way to solve the problem, then that idea may not have a lot of impact. On the contrary, if you start with a problem, then you're trying to find the best solution to that problem. And one downside is it may be harder to write a paper if the solution ends up being kind of obvious in retrospect."},{"start":2575.36,"text":"But at least you're guaranteed to be working on an important problem. And if you find a solution, you'll still be happy, even if it ends up being a little bit harder to figure out how to write a paper about it. Another way to put this is that with idea-driven research, your sort of goal is to get the idea to work. Whereas in the second case, your goal is to solve the problem."},{"start":2597.14,"text":"The second camp seems like a much more comfortable place to be because it's possible that the idea just doesn't want to work or it's not going to work at the end of the day. Another note here is that if you're thinking about a problem that you want to solve, it's really important to get to the bottleneck of that problem. So if the problem is bottlenecked on data, for example, and you start exploring new algorithms separate from the data for how to solve it,"}],"speech_gaps":[],"frame":"../frames/v028/015.webp","frame_time":2457.84},{"title":"强化学习前沿：瓶颈与研究方向","segments":[{"id":150,"text":"You actually probably won't see performance gains from working on methods if it's bottlenecked by data. At most, maybe you'll see a couple percentage points, because really, the big performance gains are going to be on the data side. And so if you pick the things that are bottlenecks and the things that are actually preventing that thing from working, then you're more likely to be able to make progress. And so I think a lot of problem-driven research ends up thinking about, what is the bottleneck for solving this problem?","start":2626.45,"end":2654.31},{"id":151,"text":"And this can also be even in terms of much longer-term thinking. You can think about, I want to develop an LLM that can prove something that humans have never proved before, like P versus NP or something. Or I want to get a robot that can make a bowl of cereal in a new kitchen.","start":2655.27,"end":2677.35},{"id":152,"text":"Those are things that you can't solve in any individual research project. But you can think about, okay, what's the bottleneck for getting there? And can I work on the part of that problem in my next project that will make progress on that larger goal? A couple more things. For this next thing, I want to tell a little bit of a story.","start":2678.67,"end":2698.6},{"id":153,"text":"So in the second year of my PhD, I did an internship, and I did an internship at Google where they had all these robots, and I wanted to use the robots to do something cool.","start":2699.3,"end":2709.18},{"id":154,"text":"And my project idea was to build a predictive model, actually a video generation model, and use it to learn skills across the robots.","start":2709.64,"end":2717.48},{"id":155,"text":"And then there was a problem.","start":2720.06,"end":2721.14},{"id":156,"text":"Most research projects have problems that you find.","start":2721.76,"end":2724.22},{"id":157,"text":"mind. And in particular, I discovered that video generation models were really bad. So","start":2724.22,"end":2730.76},{"id":158,"text":"here was a video that I collected on the robot. And here was a prediction from arguably the","start":2730.76,"end":2739.08},{"id":159,"text":"state-of-the-art video generation model. And you can see that it is erasing all the objects","start":2739.08,"end":2745.14},{"id":160,"text":"in the video and is barely capturing the motion of the arm, doesn't even capture the background","start":2745.14,"end":2750.34},{"id":161,"text":"ground correctly. And so this means that I wasn't able to actually use these kinds of models to","start":2750.34,"end":2756.78},{"id":162,"text":"actually get the robot to do something better. Now, at the time, I kind of viewed myself as a","start":2756.78,"end":2764.06},{"id":163,"text":"machine learning and robotics person, and not really a computer vision person, not a person","start":2764.06,"end":2768.3},{"id":164,"text":"who works on generative models. If I kind of felt like I should only work on machine learning","start":2768.3,"end":2773.62},{"id":165,"text":"robotics, I might have to table this and figure out a different project to work on. But instead,","start":2773.62,"end":2777.96},{"id":166,"text":"said, I decided to work on trying to develop a better video generation model. Now, arguably,","start":2777.96,"end":2784.86},{"id":167,"text":"I wasn't necessarily the best person to do this. I had never built a generative model before.","start":2784.94,"end":2788.78},{"id":168,"text":"I didn't really know that much about architectures for doing so, but not a lot of people were working","start":2789.0,"end":2793.88},{"id":169,"text":"on it at the time because they didn't realize how bad these models were. And then the resulting","start":2793.88,"end":2798.38},{"id":170,"text":"paper ended up being kind of the basis for work in my job talk, now has around 1,300 citations.","start":2798.38,"end":2803.62}],"notes":["本段讲授了强化学习研究中识别瓶颈的重要性。讲者指出，如果研究方法受限于数据，那么性能提升的空间有限，最多可能只有几个百分点。因此，研究者应关注真正限制问题解决的瓶颈因素，而不是仅仅关注方法本身。","讲者进一步指出，瓶颈识别不仅适用于短期研究，也适用于长期目标，例如开发能够解决人类尚未解决的问题（如P vs NP）的LLM，或让机器人在新厨房中完成任务。这些目标无法通过单个研究项目实现，但可以通过识别瓶颈并逐步推进来实现。","讲者分享了自己在博士期间的一个研究经历，他尝试使用视频生成模型来帮助机器人学习技能，但发现现有模型表现不佳，无法有效捕捉视频中的物体和背景。这促使他决定改进视频生成模型，尽管他并非该领域的专家。","讲者强调，即使自己并非视频生成模型的专家，他仍然决定投入精力改进模型，因为当时该领域缺乏关注，且现有模型的性能问题尚未被广泛意识到。","最终，他的研究论文成为其工作演讲的基础，并获得了1300多次引用，说明了识别瓶颈并解决其重要性的价值。","讲者通过自身经历说明，研究者应关注实际问题中的瓶颈，而不是仅限于自己的专业领域。即使在非专业领域，通过识别和解决瓶颈，也能取得突破性进展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2626.45,"end":2803.62,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2626.45,"text":"You actually probably won't see performance gains from working on methods if it's bottlenecked by data. At most, maybe you'll see a couple percentage points, because really, the big performance gains are going to be on the data side. And so if you pick the things that are bottlenecks and the things that are actually preventing that thing from working, then you're more likely to be able to make progress. And so I think a lot of problem-driven research ends up thinking about, what is the bottleneck for solving this problem?"},{"start":2655.27,"text":"And this can also be even in terms of much longer-term thinking. You can think about, I want to develop an LLM that can prove something that humans have never proved before, like P versus NP or something. Or I want to get a robot that can make a bowl of cereal in a new kitchen."},{"start":2678.67,"text":"Those are things that you can't solve in any individual research project. But you can think about, okay, what's the bottleneck for getting there? And can I work on the part of that problem in my next project that will make progress on that larger goal? A couple more things. For this next thing, I want to tell a little bit of a story."},{"start":2699.3,"text":"So in the second year of my PhD, I did an internship, and I did an internship at Google where they had all these robots, and I wanted to use the robots to do something cool."},{"start":2709.64,"text":"And my project idea was to build a predictive model, actually a video generation model, and use it to learn skills across the robots."},{"start":2720.06,"text":"And then there was a problem."},{"start":2721.76,"text":"Most research projects have problems that you find."},{"start":2724.22,"text":"mind. And in particular, I discovered that video generation models were really bad. So"},{"start":2730.76,"text":"here was a video that I collected on the robot. And here was a prediction from arguably the"},{"start":2739.08,"text":"state-of-the-art video generation model. And you can see that it is erasing all the objects"},{"start":2745.14,"text":"in the video and is barely capturing the motion of the arm, doesn't even capture the background"},{"start":2750.34,"text":"ground correctly. And so this means that I wasn't able to actually use these kinds of models to"},{"start":2756.78,"text":"actually get the robot to do something better. Now, at the time, I kind of viewed myself as a"},{"start":2764.06,"text":"machine learning and robotics person, and not really a computer vision person, not a person"},{"start":2768.3,"text":"who works on generative models. If I kind of felt like I should only work on machine learning"},{"start":2773.62,"text":"robotics, I might have to table this and figure out a different project to work on. But instead,"},{"start":2777.96,"text":"said, I decided to work on trying to develop a better video generation model. Now, arguably,"},{"start":2784.94,"text":"I wasn't necessarily the best person to do this. I had never built a generative model before."},{"start":2789.0,"text":"I didn't really know that much about architectures for doing so, but not a lot of people were working"},{"start":2793.88,"text":"on it at the time because they didn't realize how bad these models were. And then the resulting"},{"start":2798.38,"text":"paper ended up being kind of the basis for work in my job talk, now has around 1,300 citations."}],"speech_gaps":[],"frame":"../frames/v028/016.webp","frame_time":2638.45},{"title":"跨领域研究与风险处理","segments":[{"id":171,"text":"It arguably informed the community that it's kind of an interesting problem to study and led to much better video generation models than the one that I was able to develop. And so I guess the kind of lesson that I'm trying to convey here is that it's good to not box yourself into an area and say, I'm only going to work on this particular area. And the reason for that is if you cross topic boundaries.","start":2805.19,"end":2829.28},{"id":172,"text":"It's going to inform new problems because if you're trying to use something that is a problem for advancing the topic you want to work on, then that kind of informs that there's a problem with that existing thing. And oftentimes people in that field don't know that it's a problem. And then it also brings new ideas to that other topic or domain as well.","start":2829.94,"end":2849.54},{"id":173,"text":"It's going to inform new problems because if you're trying to use something that is a problem for advancing the topic you want to work on, then that kind of informs that there's a problem with that existing thing. And oftentimes people in that field don't know that it's a problem. And then it also brings new ideas to that other topic or domain as well.","start":2850.32,"end":2875.66},{"id":174,"text":"And so I see a lot of people kind of boxing themselves into areas, but I think that actually crossing topic boundaries ends up leading to a lot of new insights and innovations. And then the last thing that I'll mention is don't be a perfectionist. So I've seen people kind of feel like they want to pick the perfect project to work on, but you never know what the impact of a project will be at the outset. Otherwise, it wouldn't be research.","start":2877.86,"end":2902.07},{"id":175,"text":"At some point, you need to just start trying different ideas, start getting going on a project without trying to find the perfect project. Okay. So once you have a project idea or a project direction, a key consideration from there is handling risk. So we've talked about how lots of research ideas don't work. How do we deal with that?","start":2904.95,"end":2918.14},{"id":176,"text":"Wherever possible, it's good to front load the risk in the project. Think about what is the reason why this might not succeed? And before developing infrastructure, before coding up the entire algorithm and so forth, if you can formulate and run simple experiments that test the core unknowns that you have, then you can kind of bring the risk to the beginning of the project. This can be really uncomfortable because","start":2918.62,"end":2946.22},{"id":177,"text":"Wherever possible, it's good to front load the risk in the project. Think about what is the reason why this might not succeed? And before developing infrastructure, before coding up the entire algorithm and so forth, if you can formulate and run simple experiments that test the core unknowns that you have, then you can kind of bring the risk to the beginning of the project. This can be really uncomfortable because","start":2947.09,"end":2971.69}],"notes":["本段讲授了跨领域研究的重要性，指出研究者不应局限于特定领域，因为跨领域可以带来新的问题和想法。讲者提到，跨领域研究能够揭示现有方法的不足，并为其他领域带来新思路。","讲者强调了不要成为完美主义者，指出在研究初期很难预知项目的实际影响，因此需要尽早开始尝试不同的想法，而不是等待完美项目。","在项目启动阶段，处理风险是关键。讲者建议在项目初期就识别潜在风险，并通过简单实验测试核心未知因素，以减少后续时间浪费。","讲者指出，虽然构建基础设施和实现算法看似容易，但若在项目后期发现核心假设不成立，前期的努力将被浪费。因此，早期风险评估至关重要。","讲者提到，处理风险的策略因项目而异，但核心思想是尽早识别并测试关键假设，以避免在项目后期才发现问题。","讲者强调，研究过程中需要接受不确定性，并通过实验验证假设，而不是追求完美。这种做法有助于提高研究效率和创新性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2805.19,"end":2971.69,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2805.19,"text":"It arguably informed the community that it's kind of an interesting problem to study and led to much better video generation models than the one that I was able to develop. And so I guess the kind of lesson that I'm trying to convey here is that it's good to not box yourself into an area and say, I'm only going to work on this particular area. And the reason for that is if you cross topic boundaries."},{"start":2829.94,"text":"It's going to inform new problems because if you're trying to use something that is a problem for advancing the topic you want to work on, then that kind of informs that there's a problem with that existing thing. And oftentimes people in that field don't know that it's a problem. And then it also brings new ideas to that other topic or domain as well."},{"start":2850.32,"text":"And so I see a lot of people kind of boxing themselves into areas, but I think that actually crossing topic boundaries ends up leading to a lot of new insights and innovations. And then the last thing that I'll mention is don't be a perfectionist. So I've seen people kind of feel like they want to pick the perfect project to work on, but you never know what the impact of a project will be at the outset. Otherwise, it wouldn't be research."},{"start":2877.86,"text":"At some point, you need to just start trying different ideas, start getting going on a project without trying to find the perfect project. Okay. So once you have a project idea or a project direction, a key consideration from there is handling risk. So we've talked about how lots of research ideas don't work. How do we deal with that?"},{"start":2904.95,"text":"So there's a lot of tricks for dealing with risk, and not all of them are going to apply to every single project. But these are tricks that I think you should be able to kind of draw upon to handle the risk in research. So the first is..."},{"start":2918.62,"text":"Wherever possible, it's good to front load the risk in the project. Think about what is the reason why this might not succeed? And before developing infrastructure, before coding up the entire algorithm and so forth, if you can formulate and run simple experiments that test the core unknowns that you have, then you can kind of bring the risk to the beginning of the project. This can be really uncomfortable because"},{"start":2947.09,"text":"Oftentimes, building the infrastructure, coding the algorithm, whatever, that's the easy part. That's the part where you can seemingly make some progress on the project. But if you do all that and then at the end realize that the core unknown actually ended up not working out, then you wasted all of that time. Even though it seemingly seemed like progress, you wasted all that time on that idea that wasn't going to pan out at the end of the day."}],"speech_gaps":[],"frame":"../frames/v028/017.webp","frame_time":2817.19},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":178,"text":"And so instead, if you can kind of front load that risk and front load the unknowns, run experiments to test those unknowns, then you can make sure that if it is applicable, you can do that first and then build out the infrastructure or build out the algorithm completely and run all the experiments after doing that initial test. Along the same lines.","start":2972.37,"end":2995.08},{"id":179,"text":"Thinking through how to test ideas in the simplest possible way or the fastest possible way takes some skill and takes some thinking. It's often not obvious how to test a particular hypothesis. Another, so kind of separate from trying to front load risk and front load experiments, is simply just iterating a lot. So you have to get lucky to stumble upon a good idea.","start":2996.81,"end":3025.04},{"id":180,"text":"But you can sort of create luck for yourself just by trying out lots of ideas, by iterating on lots of different ideas. And if you try out an idea and kind of the targeted experiment doesn't work, then you can discard it quickly, try out another idea, and so forth. And for me, there was kind of lots of times in my PhD where I tried out lots of ideas that didn't make it into papers. They failed. And I think that this allowed me to...","start":3025.75,"end":3053.25},{"id":181,"text":"come upon some ideas that worked well. I didn't always do this. Sometimes I ended up banging my head against the wall plenty of times, but this is something that I found to be a good strategy for trying to iterate and get through the bad ideas quickly so that you can get to some good ideas. And then I think the last thing on this slide is if you can try out lots of ideas, especially at the beginning of the project, you can try out lots of ideas at the beginning and then not commit to any one of them.","start":3054.68,"end":3083.44},{"id":182,"text":"until you see some signs of life on that core unknown. And then if you find signs of life on one of those projects, then you can start to commit to that project after you see some sort of initial result on it. So this is kind of another sort of brute force approach to trying lots of different things so that you can get through the bad ideas. Yeah, so the question is, in problem-driven research, it's a bit more comfortable because you can try out multiple ideas. Are there scenarios where there isn't?","start":3084.48,"end":3111.43},{"id":183,"text":"There isn't a ton of ideas. And yeah, there's definitely scenarios like that where you may not have tons of ideas for solving a problem. And I should mention that in this sort of approach where you try out lots of different things, you could also be trying out multiple different problems as well.","start":3111.96,"end":3130.72}],"notes":["本段讨论了在强化学习研究中如何通过前期测试和迭代来降低风险和未知因素。讲者提到，通过在项目初期进行实验测试，可以快速验证想法的可行性，从而避免在构建完整系统之前投入过多资源。这种方法强调了在项目初期进行实验的重要性，以确保想法的适用性后再进行后续开发。","讲者指出，测试想法需要一定的技巧和思考，因为并非所有假设都容易验证。他提到，除了前期测试外，还需要进行大量迭代，因为偶然发现好想法的可能性较低。通过尝试多种想法，可以增加发现有效方法的机会。","讲者分享了自己在博士期间的经验，说明在研究过程中尝试大量想法是常见现象，许多想法最终未能进入论文。然而，这种尝试过程有助于发现真正有效的方法。他强调，这种方法虽然有时会遇到挫折，但能有效筛选出有价值的思路。","讲者提到，在项目初期尝试多种想法并避免过早承诺某个方向，有助于探索核心未知因素。一旦发现某个方向有潜力，就可以逐步投入更多资源。这种方法被视为一种“暴力”策略，即通过大量尝试来排除无效想法。","讲者进一步指出，在问题驱动的研究中，可以尝试多种想法，但并非所有情况下都有大量想法可供选择。他提到，有时可能缺乏足够的想法来解决特定问题，因此需要灵活调整策略。","最后，讲者提到在尝试多种想法的过程中，也可以同时探索不同的问题。这种策略允许研究者在多个方向上进行探索，从而增加发现有效方法的可能性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2972.37,"end":3130.72,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2972.37,"text":"And so instead, if you can kind of front load that risk and front load the unknowns, run experiments to test those unknowns, then you can make sure that if it is applicable, you can do that first and then build out the infrastructure or build out the algorithm completely and run all the experiments after doing that initial test. Along the same lines."},{"start":2996.81,"text":"Thinking through how to test ideas in the simplest possible way or the fastest possible way takes some skill and takes some thinking. It's often not obvious how to test a particular hypothesis. Another, so kind of separate from trying to front load risk and front load experiments, is simply just iterating a lot. So you have to get lucky to stumble upon a good idea."},{"start":3025.75,"text":"But you can sort of create luck for yourself just by trying out lots of ideas, by iterating on lots of different ideas. And if you try out an idea and kind of the targeted experiment doesn't work, then you can discard it quickly, try out another idea, and so forth. And for me, there was kind of lots of times in my PhD where I tried out lots of ideas that didn't make it into papers. They failed. And I think that this allowed me to..."},{"start":3054.68,"text":"come upon some ideas that worked well. I didn't always do this. Sometimes I ended up banging my head against the wall plenty of times, but this is something that I found to be a good strategy for trying to iterate and get through the bad ideas quickly so that you can get to some good ideas. And then I think the last thing on this slide is if you can try out lots of ideas, especially at the beginning of the project, you can try out lots of ideas at the beginning and then not commit to any one of them."},{"start":3084.48,"text":"until you see some signs of life on that core unknown. And then if you find signs of life on one of those projects, then you can start to commit to that project after you see some sort of initial result on it. So this is kind of another sort of brute force approach to trying lots of different things so that you can get through the bad ideas. Yeah, so the question is, in problem-driven research, it's a bit more comfortable because you can try out multiple ideas. Are there scenarios where there isn't?"},{"start":3111.96,"text":"There isn't a ton of ideas. And yeah, there's definitely scenarios like that where you may not have tons of ideas for solving a problem. And I should mention that in this sort of approach where you try out lots of different things, you could also be trying out multiple different problems as well."}],"speech_gaps":[],"frame":"../frames/v028/018.webp","frame_time":2984.37},{"title":"前沿问题的探索与实验设计","segments":[{"id":184,"text":"Yeah, you could be trying out a couple ideas for one problem, try out a couple ideas for a different problem, and then pick your problem based on what seems to be tractable. Because even at the outset, you don't know how hard a problem is going to be, and it might be that it's too hard for the scope of a current project, or we don't have good tools or good ideas for how to solve it. Yeah, can I give an example of front-loading a core unknown in a project?","start":3134.24,"end":3160.02},{"id":185,"text":"A couple ideas. So maybe I'll try to give a couple examples. So one example is I worked on meta-learning in the past, and the goal was to see if you can quickly adapt with a very small amount of data to a problem. And the goal was ultimately to be able to get a robot, for example, to quickly adapt to a new task.","start":3160.86,"end":3183.78},{"id":186,"text":"But actually, designing a meta-learning system on a real robot is a ton of work and would take a lot of work to even just do the coding for it. And so what I did is I first set up an experiment where the tasks, instead of learning...","start":3186.18,"end":3202.1},{"id":187,"text":"Robot tasks, the tasks were regressing to simple 1D sinusoid curves. So really, really simple problem. And then just tested, can you learn with a few data points, like five data points, to regress to the curve? And so it was this experiment that I could code it up in a day and get some initial results from. And it ended up working out pretty well. And so then that gave me the signs of life to try it.","start":3203.48,"end":3231.38},{"id":188,"text":"Another example of this, maybe a more recent example, I've been thinking a little bit about how to get robots to follow different kinds of language instructions, including language instructions for different strategies. And there's a couple risks for this. One is getting good labels for the strategies, and the second is actually getting the robot to pay attention to those different strategies. And that second one actually seemed like the bigger challenge.","start":3233.36,"end":3260.7},{"id":189,"text":"And I took a data set where it was like a really, really simple problem where in some of the data, the robot used the right gripper and some of the data, the robot used the left gripper. And then I trained a policy just to see if it could like do that very simple thing, very easy to evaluate. And I already had, I could like automatically determine if it was using the right or left from the data rather than doing labeling. And so that kind of isolated a core risk of the problem before moving on to like the broader problem of getting a robot to follow strategies.","start":3261.98,"end":3288.4}],"notes":["本段讲授了在强化学习项目中如何通过实验设计来探索核心未知问题。讲者提到，面对复杂问题时，应先通过简单实验验证可行性，再逐步推进。例如，在元学习项目中，讲者首先设计了一个简单的实验，用1D正弦曲线回归来测试模型能否在少量数据下学习，从而验证了方法的可行性。","讲者进一步举例说明了如何通过简单问题来识别和解决核心挑战。例如，在机器人遵循语言指令的项目中，讲者首先设计了一个简单的数据集，其中机器人使用左右夹爪，通过训练策略来判断是否能正确执行任务，从而隔离了核心风险。","讲者强调了实验设计的重要性，特别是在处理复杂问题时，应先通过简单问题验证方法的可行性，再逐步扩展到更复杂的问题。这种方法有助于识别和解决核心挑战，避免在复杂问题上投入过多资源。","讲者提到，在处理机器人遵循策略的问题时，核心挑战是让机器人关注不同的策略。为此，讲者设计了一个简单的实验，通过左右夹爪的使用来验证策略的有效性，从而隔离了核心风险。","讲者还提到，在实验设计中，应尽量使用自动化的评估方法，以减少人工标注的负担。例如，在判断机器人是否使用左右夹爪时，讲者直接从数据中自动判断，而不是手动标注。","讲者强调了在项目初期识别和解决核心未知问题的重要性，这有助于确保项目的可行性和效率。通过先解决简单问题，再逐步扩展到更复杂的问题，可以有效降低项目风险。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3134.24,"end":3288.4,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3134.24,"text":"Yeah, you could be trying out a couple ideas for one problem, try out a couple ideas for a different problem, and then pick your problem based on what seems to be tractable. Because even at the outset, you don't know how hard a problem is going to be, and it might be that it's too hard for the scope of a current project, or we don't have good tools or good ideas for how to solve it. Yeah, can I give an example of front-loading a core unknown in a project?"},{"start":3160.86,"text":"A couple ideas. So maybe I'll try to give a couple examples. So one example is I worked on meta-learning in the past, and the goal was to see if you can quickly adapt with a very small amount of data to a problem. And the goal was ultimately to be able to get a robot, for example, to quickly adapt to a new task."},{"start":3186.18,"text":"But actually, designing a meta-learning system on a real robot is a ton of work and would take a lot of work to even just do the coding for it. And so what I did is I first set up an experiment where the tasks, instead of learning..."},{"start":3203.48,"text":"Robot tasks, the tasks were regressing to simple 1D sinusoid curves. So really, really simple problem. And then just tested, can you learn with a few data points, like five data points, to regress to the curve? And so it was this experiment that I could code it up in a day and get some initial results from. And it ended up working out pretty well. And so then that gave me the signs of life to try it."},{"start":3233.36,"text":"Another example of this, maybe a more recent example, I've been thinking a little bit about how to get robots to follow different kinds of language instructions, including language instructions for different strategies. And there's a couple risks for this. One is getting good labels for the strategies, and the second is actually getting the robot to pay attention to those different strategies. And that second one actually seemed like the bigger challenge."},{"start":3261.98,"text":"And I took a data set where it was like a really, really simple problem where in some of the data, the robot used the right gripper and some of the data, the robot used the left gripper. And then I trained a policy just to see if it could like do that very simple thing, very easy to evaluate. And I already had, I could like automatically determine if it was using the right or left from the data rather than doing labeling. And so that kind of isolated a core risk of the problem before moving on to like the broader problem of getting a robot to follow strategies."}],"speech_gaps":[],"frame":"../frames/v028/019.webp","frame_time":3146.24},{"title":"调试与简化问题","segments":[{"id":190,"text":"Okay, now you have a problem, you have an idea, you want to get things to work. One thing that's really hard in terms of getting something to work is if you're starting with something that doesn't work. So if you code up a system and it's not working, there's a million reasons that could be why it's not working. And it's really hard to figure out which of those things might be causing it to not work. You can make visualizations. There's various tools for trying to figure that out.","start":3290.72,"end":3317.07},{"id":191,"text":"But it's much easier to start with something that works and then make it harder than to start with something that doesn't work and try to get it to work. And so one thing that's very useful in research is to, if you're in a scenario where things aren't working, simplify the problem dramatically until something does work and then move it back to the harder setting by, for example, adding more data, more tasks, whatever.","start":3318.16,"end":3338.64},{"id":192,"text":"And, yeah, really useful debugging strategy. And I've seen, yeah, a lot of projects where things aren't working and you just kind of need to go back to the drawing bird.","start":3340.72,"end":3349.02},{"id":193,"text":"Maybe as a very specific example for this, at one point I was trying to train robots to be able to see a video of a human doing a task and then do the task themselves with imitation learning. I collected a really diverse data set of robot demonstrations and then asked a human to do what the robot did of all sorts of tasks. And we just told people collecting the data, do whatever you want, do lots of things. Nothing worked.","start":3350.58,"end":3378.64},{"id":194,"text":"When training on this data, spent like months trying to get the robot to do it. And then what we did is we simplified to just a single task setting. Like, can we get the robot to do one task? Make sure our imitation learning stack works. It actually didn't work. And so we had to debug that, get it to work on one task, then get it to work on three tasks, then get it to work on 10 tasks. So yeah, starting with a feeling that works really, really helpful.","start":3379.26,"end":3406.81},{"id":195,"text":"Simplifying is really helpful for that. Another thing, it's really easy to get in your own head and just have trouble debugging something just by yourself. And so talking to friends, colleagues, advisors can also be helpful and help you figure out whether it makes sense to jump up a level and kind of reconsider the problem or keep on tuning hyperparameters or try something that you didn't think of.","start":3408.25,"end":3432.18},{"id":196,"text":"And then also revisiting assumptions. So you might go into a project thinking that something is a lot easier than it turned out to be. And then you might learn through the course of the project that that thing is actually really hard. And so thinking through, has anything changed about my assumptions from the beginning? And then if something has changed, would that change the way that you're going about the project or even the project that you're working on as a result? Okay, and then...","start":3432.84,"end":3461.07}],"notes":["本段主要讲解了在强化学习研究中，调试失败系统时的策略。讲者指出，从一个不工作的系统开始调试非常困难，因为可能有无数个原因导致系统不工作，而难以确定具体原因。因此，更有效的方法是从一个能工作的系统开始，逐步增加复杂度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3290.72,"end":3461.07,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3290.72,"text":"Okay, now you have a problem, you have an idea, you want to get things to work. One thing that's really hard in terms of getting something to work is if you're starting with something that doesn't work. So if you code up a system and it's not working, there's a million reasons that could be why it's not working. And it's really hard to figure out which of those things might be causing it to not work. You can make visualizations. There's various tools for trying to figure that out."},{"start":3318.16,"text":"But it's much easier to start with something that works and then make it harder than to start with something that doesn't work and try to get it to work. And so one thing that's very useful in research is to, if you're in a scenario where things aren't working, simplify the problem dramatically until something does work and then move it back to the harder setting by, for example, adding more data, more tasks, whatever."},{"start":3340.72,"text":"And, yeah, really useful debugging strategy. And I've seen, yeah, a lot of projects where things aren't working and you just kind of need to go back to the drawing bird."},{"start":3350.58,"text":"Maybe as a very specific example for this, at one point I was trying to train robots to be able to see a video of a human doing a task and then do the task themselves with imitation learning. I collected a really diverse data set of robot demonstrations and then asked a human to do what the robot did of all sorts of tasks. And we just told people collecting the data, do whatever you want, do lots of things. Nothing worked."},{"start":3379.26,"text":"When training on this data, spent like months trying to get the robot to do it. And then what we did is we simplified to just a single task setting. Like, can we get the robot to do one task? Make sure our imitation learning stack works. It actually didn't work. And so we had to debug that, get it to work on one task, then get it to work on three tasks, then get it to work on 10 tasks. So yeah, starting with a feeling that works really, really helpful."},{"start":3408.25,"text":"Simplifying is really helpful for that. Another thing, it's really easy to get in your own head and just have trouble debugging something just by yourself. And so talking to friends, colleagues, advisors can also be helpful and help you figure out whether it makes sense to jump up a level and kind of reconsider the problem or keep on tuning hyperparameters or try something that you didn't think of."},{"start":3432.84,"text":"And then also revisiting assumptions. So you might go into a project thinking that something is a lot easier than it turned out to be. And then you might learn through the course of the project that that thing is actually really hard. And so thinking through, has anything changed about my assumptions from the beginning? And then if something has changed, would that change the way that you're going about the project or even the project that you're working on as a result? Okay, and then..."}],"speech_gaps":[],"frame":"../frames/v028/020.webp","frame_time":3302.72},{"title":"项目范围调整与研究策略","segments":[{"id":197,"text":"Maybe I'll also talk about a story for this. So there's scenarios where you're kind of trying to get something to work and it doesn't really want to work. It's not really easy to get it to work. And if it doesn't really want to work, then probably the idea won't be very impactful because if someone else is trying to get it to work and it also doesn't really easily work for them, then maybe the idea just wasn't really meant to be.","start":3462.31,"end":3487.43},{"id":198,"text":"And at one point we had this project where this is actually a fairly recent project where we were trying to get a robot to follow open-ended language commands. And like, can you clean up the trash but not the dishes? We also wanted to see if the robot could handle various interventions and follow lots of different prompts, for example. Then we kind of got some initial signs of life on that. And we're like, oh, well, maybe we could also get the robot to ask questions if the prompt is ambiguous.","start":3488.75,"end":3516.79},{"id":199,"text":"And we had all these kind of cool ideas for how we could incorporate this sort of open-ended language following in a robot system. And despite having kind of positive initial signs of life, after we introduced all those ideas, things weren't really working. And we kind of tried all sorts of... I don't know, we spent a couple months trying to get it to work.","start":3517.51,"end":3545.3},{"id":200,"text":"thought about, well, it was working before. What parts of this thing do work and what parts of these things are harder to get to work with our current method? And then we kind of re-scoped the project to remove the hard parts that we didn't know how to solve yet and to only consider the parts, the kind of interactions that our method did work with.","start":3546.35,"end":3568.87},{"id":201,"text":"It was an example where we picked the examples, we scoped the project to the source of things that the method wanted to work on, work easily on, and left the things that it didn't handle for future work. We described it as limitations in the paper. And so scoping down the project, especially if you kind of scoped it up a little bit too eagerly, can also be a useful strategy in research. Okay, last thing.","start":3569.29,"end":3596.22},{"id":202,"text":"If you're in a scenario where things really aren't working, you might decide whether or not you should pivot or whether or not you should start working on a different project.","start":3596.83,"end":3603.69},{"id":203,"text":"Oftentimes, you'll consider this later than you should be considering this because you really want to get something to work. There's also this sunk cost fallacy where if you spent a lot of time on something, then it's very natural for humans to think that you'll spend less time on it in the future because you spent a lot of time on it in the past. This is a fallacy, not always true, and you might actually not have made as much progress on the problem than the time that you spent on it would suggest.","start":3605.43,"end":3634.19}],"notes":["本段讲授了在研究项目中遇到困难时，如何通过调整项目范围来聚焦于当前方法能够有效处理的部分。讲者提到，当项目进展不顺利时，需要反思哪些部分是当前方法能够处理的，哪些部分是难以处理的，并据此重新定义项目范围，以避免资源浪费。","讲者以机器人遵循开放语言指令的项目为例，说明了如何通过重新定义项目范围，去除当前方法无法解决的复杂部分，专注于方法能够有效处理的交互。这种策略在研究中是实用的，尤其是在项目初期过于乐观地扩大范围时。","讲者进一步指出，当项目进展不顺利时，研究者可能会倾向于继续投入更多时间，但这种行为可能受到沉没成本谬误的影响。沉没成本谬误指的是人们倾向于因为已经投入了大量时间而继续投入，即使实际进展可能并不如预期。","讲者强调，沉没成本谬误并非总是成立，有时即使投入了大量时间，实际进展可能并不理想。因此，研究者需要在适当的时候考虑是否需要调整方向或转向其他项目。","讲者通过实际案例说明了项目范围调整的重要性，并指出这种策略在研究中是有效的，尤其是在面对复杂问题时，聚焦于当前方法能够处理的部分，可以提高研究效率。","最后，讲者总结了在研究中遇到困难时，需要考虑是否调整方向或转向其他项目，并提醒研究者注意沉没成本谬误的影响，避免因过度投入而忽视实际进展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3462.31,"end":3634.19,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3462.31,"text":"Maybe I'll also talk about a story for this. So there's scenarios where you're kind of trying to get something to work and it doesn't really want to work. It's not really easy to get it to work. And if it doesn't really want to work, then probably the idea won't be very impactful because if someone else is trying to get it to work and it also doesn't really easily work for them, then maybe the idea just wasn't really meant to be."},{"start":3488.75,"text":"And at one point we had this project where this is actually a fairly recent project where we were trying to get a robot to follow open-ended language commands. And like, can you clean up the trash but not the dishes? We also wanted to see if the robot could handle various interventions and follow lots of different prompts, for example. Then we kind of got some initial signs of life on that. And we're like, oh, well, maybe we could also get the robot to ask questions if the prompt is ambiguous."},{"start":3517.51,"text":"And we had all these kind of cool ideas for how we could incorporate this sort of open-ended language following in a robot system. And despite having kind of positive initial signs of life, after we introduced all those ideas, things weren't really working. And we kind of tried all sorts of... I don't know, we spent a couple months trying to get it to work. And then at some point we kind of went back and..."},{"start":3546.35,"text":"thought about, well, it was working before. What parts of this thing do work and what parts of these things are harder to get to work with our current method? And then we kind of re-scoped the project to remove the hard parts that we didn't know how to solve yet and to only consider the parts, the kind of interactions that our method did work with. And so..."},{"start":3569.29,"text":"It was an example where we picked the examples, we scoped the project to the source of things that the method wanted to work on, work easily on, and left the things that it didn't handle for future work. We described it as limitations in the paper. And so scoping down the project, especially if you kind of scoped it up a little bit too eagerly, can also be a useful strategy in research. Okay, last thing."},{"start":3596.83,"text":"If you're in a scenario where things really aren't working, you might decide whether or not you should pivot or whether or not you should start working on a different project."},{"start":3605.43,"text":"Oftentimes, you'll consider this later than you should be considering this because you really want to get something to work. There's also this sunk cost fallacy where if you spent a lot of time on something, then it's very natural for humans to think that you'll spend less time on it in the future because you spent a lot of time on it in the past. This is a fallacy, not always true, and you might actually not have made as much progress on the problem than the time that you spent on it would suggest."}],"speech_gaps":[],"frame":"../frames/v028/021.webp","frame_time":3474.31},{"title":"决策与研究趋势的平衡","segments":[{"id":204,"text":"Now, deciding when to pivot is really hard because you're often thinking about, should I continue working on my current project or should I switch to starting a new project? And this option of switching to a new project is really nebulous. This could mean a lot of different things. There's a lot of different things you might be doing. And so it's really hard to think about, should I be doing what I'm currently doing or should I do something else? Because something else could be anything.","start":3637.83,"end":3662.55},{"id":205,"text":"And so one kind of mental trick for thinking about this sort of decision about whether to pivot is to change this decision and actually spend time thinking about other projects that you would do and then try to formulate the decision as continuing working on the current project versus working on project B or working on project C and so forth. And this decision is much more concrete, a lot more straightforward to think about, less anxiety-inducing, and so forth.","start":3664.42,"end":3691.28},{"id":206,"text":"Yeah, so the question is, when research fields are moving really quickly, you might feel like, you might be worried that another group will do the same thing and then try to spend less time on the evaluation just to try to get the paper out faster. Is that a trend? What do I think about that? So, I mean, it's definitely like...","start":3692.53,"end":3718.94},{"id":207,"text":"There's definitely papers that should be more thorough with the evaluation. That's true now. That's also been true in the past. I don't know if it's been getting worse per se. I think that...","start":3719.53,"end":3736.4},{"id":208,"text":"If there is, like, a feeling to do that, I think, well, you really want to be confident about the results that you're putting out.","start":3737.23,"end":3743.05},{"id":209,"text":"And I think that if you're worried about being scooped, like, or another group doing something, like, there's, like, there is, like, an advantage to having, like, done some sort of idea first.","start":3743.59,"end":3760.33},{"id":210,"text":"But there's also a lot of advantage to executing really well on a project.","start":3760.61,"end":3765.11},{"id":211,"text":"and sometimes the projects that are executed on better","start":3765.11,"end":3768.07},{"id":212,"text":"are more impactful than the projects","start":3768.07,"end":3770.43},{"id":213,"text":"that were like first at a particular idea.","start":3770.43,"end":3772.29},{"id":214,"text":"And so the, yeah, I guess my perspective is that","start":3773.27,"end":3778.01},{"id":215,"text":"is just like still put a fair amount of focus","start":3778.01,"end":3780.49},{"id":216,"text":"on execution and evaluation.","start":3780.49,"end":3782.65},{"id":217,"text":"Now there's many things you could evaluate.","start":3783.07,"end":3785.01},{"id":218,"text":"You could run your experiments on 20 data sets.","start":3785.09,"end":3786.97},{"id":219,"text":"And so there's a limit to what do you want to do.","start":3787.19,"end":3789.09},{"id":220,"text":"So I think that there's a balance","start":3790.51,"end":3792.49},{"id":221,"text":"and yeah, certainly there are some parts of the research field that move fast. One thing that","start":3795.43,"end":3800.59},{"id":222,"text":"I've liked about real robots is that small, I guess, small enough people work with like real","start":3800.59,"end":3805.61},{"id":223,"text":"hardware that you have to worry, you can worry less about that in many ways, especially if you","start":3805.61,"end":3810.49},{"id":224,"text":"execute on it and actually show the results on real robots. So yeah, but there's a balance and","start":3810.49,"end":3816.93}],"notes":["本段讨论了在快速发展的研究领域中，研究人员在决定是否继续当前项目或转向新项目时面临的困难。讲者提到，这种决策过程常常模糊不清，因为‘转向新项目’可以指很多不同的事情，因此需要更具体的思考方式。","讲者建议通过思考其他可能的项目（如项目B或项目C）来具体化决策，这样可以减少焦虑并使决策更加清晰。这种思维技巧有助于将抽象的决策转化为更具体的比较。","讲者提到，在研究领域快速发展的背景下，研究人员可能会担心被其他团队抢先发表成果，因此可能会减少对评估的投入，以加快论文发表的速度。然而，讲者认为，这种做法并不总是合适的。","讲者指出，虽然在某些情况下，先提出一个想法可能有优势，但执行得更好的项目往往更具影响力。因此，讲者强调应将重点放在执行和评估上，而不是仅仅追求速度。","讲者提到，评估可以包括在多个数据集上运行实验，但需要在评估的深度和广度之间找到平衡。这表明，研究人员需要权衡评估的全面性和可行性。","最后，讲者提到在真实机器人研究中，小团队可以更专注于实际硬件的执行，从而减少对理论模型的依赖。这种实际执行的成果往往更具说服力，但也需要在研究速度和质量之间找到平衡。"],"formulas":[],"uncertainties":["projects that are executed on better","projects that were like first at a particular idea","small enough people work with like real","you can worry less about that in many ways","execute on it and actually show the results on real robots"],"diagram":"none","start":3637.83,"end":3816.93,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3637.83,"text":"Now, deciding when to pivot is really hard because you're often thinking about, should I continue working on my current project or should I switch to starting a new project? And this option of switching to a new project is really nebulous. This could mean a lot of different things. There's a lot of different things you might be doing. And so it's really hard to think about, should I be doing what I'm currently doing or should I do something else? Because something else could be anything."},{"start":3664.42,"text":"And so one kind of mental trick for thinking about this sort of decision about whether to pivot is to change this decision and actually spend time thinking about other projects that you would do and then try to formulate the decision as continuing working on the current project versus working on project B or working on project C and so forth. And this decision is much more concrete, a lot more straightforward to think about, less anxiety-inducing, and so forth."},{"start":3692.53,"text":"Yeah, so the question is, when research fields are moving really quickly, you might feel like, you might be worried that another group will do the same thing and then try to spend less time on the evaluation just to try to get the paper out faster. Is that a trend? What do I think about that? So, I mean, it's definitely like..."},{"start":3719.53,"text":"There's definitely papers that should be more thorough with the evaluation. That's true now. That's also been true in the past. I don't know if it's been getting worse per se. I think that..."},{"start":3737.23,"text":"If there is, like, a feeling to do that, I think, well, you really want to be confident about the results that you're putting out."},{"start":3743.59,"text":"And I think that if you're worried about being scooped, like, or another group doing something, like, there's, like, there is, like, an advantage to having, like, done some sort of idea first."},{"start":3760.61,"text":"But there's also a lot of advantage to executing really well on a project."},{"start":3765.11,"text":"and sometimes the projects that are executed on better"},{"start":3768.07,"text":"are more impactful than the projects"},{"start":3770.43,"text":"that were like first at a particular idea."},{"start":3773.27,"text":"And so the, yeah, I guess my perspective is that"},{"start":3778.01,"text":"is just like still put a fair amount of focus"},{"start":3780.49,"text":"on execution and evaluation."},{"start":3783.07,"text":"Now there's many things you could evaluate."},{"start":3785.09,"text":"You could run your experiments on 20 data sets."},{"start":3787.19,"text":"And so there's a limit to what do you want to do."},{"start":3790.51,"text":"So I think that there's a balance"},{"start":3795.43,"text":"and yeah, certainly there are some parts of the research field that move fast. One thing that"},{"start":3800.59,"text":"I've liked about real robots is that small, I guess, small enough people work with like real"},{"start":3805.61,"text":"hardware that you have to worry, you can worry less about that in many ways, especially if you"},{"start":3810.49,"text":"execute on it and actually show the results on real robots. So yeah, but there's a balance and"}],"speech_gaps":[],"frame":"../frames/v028/022.webp","frame_time":3649.83},{"title":"分享研究成果的重要性","segments":[{"id":225,"text":"It's also good to work on things like language models and things that are hot too. Yeah, there's","start":3816.93,"end":3822.03},{"id":226,"text":"of balance. Okay, so how to share your research. I talked about how this is really important.","start":3822.03,"end":3830.37},{"id":227,"text":"Why is this really important?","start":3831.23,"end":3832.17},{"id":228,"text":"If you think about what is the output or the outcome of research, the output of research is essentially like ideas, knowledge, things that you learned from doing the research. It's not a product. It's not a service. It's really like knowledge. It's things that you learn. And if it were a product, then the high impact would mean that lots of people are using the product for good things.","start":3833.54,"end":3860.02},{"id":229,"text":"But since it's more like knowledge, if no one knows about what you learned, then there was really like no impact or no output as a result. And even for companies that have products and services, they have massive marketing efforts to try to get those products out. And so for your work to have impact, you need to share it and you need people to know about it. Otherwise, it won't have had impact.","start":3860.6,"end":3881.64},{"id":230,"text":"So there can be reasons to not be excited about sharing work. You can say maybe it feels like self-promotion. Maybe the idea didn't work that well. So I'm not that excited about sharing it. Maybe it's like it seems all obvious, like all of it seems obvious to you now. And so why do you need to share it? But even if it feels like self-promotion, you're teaching people, you're sharing cool new findings. And you can think about it as more actually doing a service to them to teach them something new and useful and interesting.","start":3884.38,"end":3910.7},{"id":231,"text":"Even if it didn't work that well, it's really useful to share because other people might think of that idea and might want to know how well did it work and did it work in certain circumstances more better than other circumstances.","start":3911.43,"end":3922.97},{"id":232,"text":"And then, yeah, after enough research, you're going to know a lot more than other people.","start":3923.81,"end":3927.15},{"id":233,"text":"There will be things that seem really obvious to you that are not obvious to other people.","start":3927.71,"end":3931.51},{"id":234,"text":"And it's good to still share those things and think about what's actually obvious, what actually other people don't know, so that you can kind of share the things that you have learned, especially the most important things with them.","start":3931.51,"end":3943.91},{"id":235,"text":"Now, I mean, I could probably give an entire lecture on presenting research and writing and presentations and so forth.","start":3947.55,"end":3954.43},{"id":236,"text":"But yeah, having really clear writing,","start":3954.93,"end":3956.69},{"id":237,"text":"really clear visuals, really clear presentations.","start":3956.85,"end":3958.73},{"id":238,"text":"Communicating clearly is really, really important.","start":3959.81,"end":3961.43},{"id":239,"text":"If they don't understand what you're saying,","start":3961.87,"end":3963.51},{"id":240,"text":"then they won't understand the knowledge.","start":3963.67,"end":3965.89},{"id":241,"text":"It's important to think about their audience","start":3966.59,"end":3968.13},{"id":242,"text":"and how they will interpret what you say, what they know.","start":3968.13,"end":3970.37},{"id":243,"text":"When in doubt, assume that your audience knows less","start":3970.79,"end":3973.29},{"id":244,"text":"rather than more.","start":3973.73,"end":3974.57},{"id":245,"text":"This can actually be a little bit tricky to do.","start":3974.99,"end":3977.05},{"id":246,"text":"It's good to avoid jargon if possible.","start":3977.09,"end":3978.93},{"id":247,"text":"They might know the jargon,","start":3979.17,"end":3980.25},{"id":248,"text":"but if there's ways to avoid it,","start":3980.37,"end":3982.45},{"id":249,"text":"then it makes it more accessible.","start":3982.49,"end":3983.57},{"id":250,"text":"And even if they do know a lot of what you're going to say, a lot of people still appreciate","start":3984.71,"end":3988.83},{"id":251,"text":"refreshers, especially if those refreshers are clear and it might actually cause them","start":3989.69,"end":3993.79},{"id":252,"text":"to think about something that they know in a new way.","start":3993.79,"end":3995.79}],"notes":["本段讨论了研究成果分享的重要性，指出研究成果本质上是知识而非产品或服务，因此需要通过分享来产生影响。如果研究成果不被他人知晓，就无法产生实际影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3816.93,"end":3995.79,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3816.93,"text":"it's also good to work on things like language models and things that are hot too. Yeah, there's"},{"start":3822.03,"text":"of balance. Okay, so how to share your research. I talked about how this is really important."},{"start":3831.23,"text":"Why is this really important?"},{"start":3833.54,"text":"If you think about what is the output or the outcome of research, the output of research is essentially like ideas, knowledge, things that you learned from doing the research. It's not a product. It
