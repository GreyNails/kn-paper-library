's not a service. It's really like knowledge. It's things that you learn. And if it were a product, then the high impact would mean that lots of people are using the product for good things."},{"start":3860.6,"text":"But since it's more like knowledge, if no one knows about what you learned, then there was really like no impact or no output as a result. And even for companies that have products and services, they have massive marketing efforts to try to get those products out. And so for your work to have impact, you need to share it and you need people to know about it. Otherwise, it won't have had impact."},{"start":3884.38,"text":"So there can be reasons to not be excited about sharing work. You can say maybe it feels like self-promotion. Maybe the idea didn't work that well. So I'm not that excited about sharing it. Maybe it's like it seems all obvious, like all of it seems obvious to you now. And so why do you need to share it? But even if it feels like self-promotion, you're teaching people, you're sharing cool new findings. And you can think about it as more actually doing a service to them to teach them something new and useful and interesting."},{"start":3911.43,"text":"Even if it didn't work that well, it's really useful to share because other people might think of that idea and might want to know how well did it work and did it work in certain circumstances more better than other circumstances."},{"start":3923.81,"text":"And then, yeah, after enough research, you're going to know a lot more than other people."},{"start":3927.71,"text":"There will be things that seem really obvious to you that are not obvious to other people."},{"start":3931.51,"text":"And it's good to still share those things and think about what's actually obvious, what actually other people don't know, so that you can kind of share the things that you have learned, especially the most important things with them."},{"start":3947.55,"text":"Now, I mean, I could probably give an entire lecture on presenting research and writing and presentations and so forth."},{"start":3954.93,"text":"But yeah, having really clear writing,"},{"start":3956.85,"text":"really clear visuals, really clear presentations."},{"start":3959.81,"text":"Communicating clearly is really, really important."},{"start":3961.87,"text":"If they don't understand what you're saying,"},{"start":3963.67,"text":"then they won't understand the knowledge."},{"start":3966.59,"text":"It's important to think about their audience"},{"start":3968.13,"text":"and how they will interpret what you say, what they know."},{"start":3970.79,"text":"When in doubt, assume that your audience knows less"},{"start":3973.73,"text":"rather than more."},{"start":3974.99,"text":"This can actually be a little bit tricky to do."},{"start":3977.09,"text":"It's good to avoid jargon if possible."},{"start":3979.17,"text":"They might know the jargon,"},{"start":3980.37,"text":"but if there's ways to avoid it,"},{"start":3982.49,"text":"then it makes it more accessible."},{"start":3984.71,"text":"And even if they do know a lot of what you're going to say, a lot of people still appreciate"},{"start":3989.69,"text":"refreshers, especially if those refreshers are clear and it might actually cause them"},{"start":3993.79,"text":"to think about something that they know in a new way."}],"speech_gaps":[{"start":3945.584,"end":3947.15}],"frame":"../frames/v028/023.webp","frame_time":3828.93},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":253,"text":"Other ways to get better at this, just practicing. Practicing writing, practicing giving presentations. You can practice alone. You can practice with other people if it's a presentation. And then just try to get feedback. Try to get honest feedback from people and improve with the feedback.","start":3997.2,"end":4011.5},{"id":254,"text":"You might also, like, when trying to write a paper or when trying to create a slide deck or something, it's easy to, like, get a little bit overwhelmed by how much you have to do and where even to get started on that. I find it really helpful to break down the task. And even on, like, a pen and paper, just, like, write down some ideas for how I want to do it. Maybe write down an outline. My recommendation would be to think through your ideas for what you want to communicate before asking your friend, before asking your friend chat GPT.","start":4015.29,"end":4042.53},{"id":255,"text":"Cool. And then a couple of miscellaneous things. First is mentorship. I think mentorship can play a huge role in research. And if you have it, don't be afraid to lean on it. In my first research paper in my PhD, I hardly wrote any of the paper. And I talked to actually my co-author, and he told me that he actually even rewrote the section that I wrote.","start":4044.37,"end":4067.05},{"id":256,"text":"And so it's okay to not know everything and not know how to do every part of the research process and lean on other people for the things that you don't know how to do yet. Generally, I've seen students and myself do most successful when they're learning more gradually and when they're not trying to take on everything themselves because doing novel research and writing a paper about it and presenting it.","start":4068.83,"end":4090.49},{"id":257,"text":"Picking a problem, like all of that is a really, really huge undertaking. And it's useful to lean on other people as you're trying to learn how to do that. Cool. And then confidence. So there's a lot of reasons to lack confidence in research.","start":4091.07,"end":4106.8},{"id":258,"text":"No one knows how to do research right now. No one knows what research is going to be most impactful. If they did, it wouldn't be research. Many ideas don't work. Many papers get rejected. Many researchers have been thinking about a domain for many years, and they will be smarter than you in that domain because they've been thinking about it for many years. And so it's easy to think that you know very little, that you have been rejected many times, that a lot of your ideas don't work, because all of those things are kind of true.","start":4107.62,"end":4137.17},{"id":259,"text":"but that doesn't mean that you're actually doing a bad job at research. And confidence is really important. If you're not confident, if you're second-guessing, overthinking things, it can really slow you down. And even though these things are challenging, they're actually not reasons to be unconfident. And then lastly, some closing thoughts. Maybe since you're all here, you're eager to do research, and so maybe I don't need to say this,","start":4137.73,"end":4167.76}],"notes":["本段主要讨论了如何提高研究和写作能力，包括通过练习、获取反馈、分解任务、寻求导师指导以及建立自信等方法。讲者强调了在研究过程中寻求他人帮助的重要性，尤其是在面对复杂任务时，分解任务和先构思想法是关键步骤。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3997.2,"end":4167.76,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3997.2,"text":"Other ways to get better at this, just practicing. Practicing writing, practicing giving presentations. You can practice alone. You can practice with other people if it's a presentation. And then just try to get feedback. Try to get honest feedback from people and improve with the feedback."},{"start":4015.29,"text":"You might also, like, when trying to write a paper or when trying to create a slide deck or something, it's easy to, like, get a little bit overwhelmed by how much you have to do and where even to get started on that. I find it really helpful to break down the task. And even on, like, a pen and paper, just, like, write down some ideas for how I want to do it. Maybe write down an outline. My recommendation would be to think through your ideas for what you want to communicate before asking your friend, before asking your friend chat GPT."},{"start":4044.37,"text":"Cool. And then a couple of miscellaneous things. First is mentorship. I think mentorship can play a huge role in research. And if you have it, don't be afraid to lean on it. In my first research paper in my PhD, I hardly wrote any of the paper. And I talked to actually my co-author, and he told me that he actually even rewrote the section that I wrote."},{"start":4068.83,"text":"And so it's okay to not know everything and not know how to do every part of the research process and lean on other people for the things that you don't know how to do yet. Generally, I've seen students and myself do most successful when they're learning more gradually and when they're not trying to take on everything themselves because doing novel research and writing a paper about it and presenting it."},{"start":4091.07,"text":"Picking a problem, like all of that is a really, really huge undertaking. And it's useful to lean on other people as you're trying to learn how to do that. Cool. And then confidence. So there's a lot of reasons to lack confidence in research."},{"start":4107.62,"text":"No one knows how to do research right now. No one knows what research is going to be most impactful. If they did, it wouldn't be research. Many ideas don't work. Many papers get rejected. Many researchers have been thinking about a domain for many years, and they will be smarter than you in that domain because they've been thinking about it for many years. And so it's easy to think that you know very little, that you have been rejected many times, that a lot of your ideas don't work, because all of those things are kind of true."},{"start":4137.73,"text":"but that doesn't mean that you're actually doing a bad job at research. And confidence is really important. If you're not confident, if you're second-guessing, overthinking things, it can really slow you down. And even though these things are challenging, they're actually not reasons to be unconfident. And then lastly, some closing thoughts. Maybe since you're all here, you're eager to do research, and so maybe I don't need to say this,"}],"speech_gaps":[],"frame":"../frames/v028/024.webp","frame_time":4009.2},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":260,"text":"In terms of the time that we're in right now, I think that you might kind of feel like reinforcement learning works now to some extent. And so maybe we don't need to do research. Maybe we can just use the thing that works and apply it in all sorts of circumstances. And there's a lot of merit to applying research in the real world.","start":4169.6,"end":4192.87},{"id":261,"text":"It's good for some people to do that. But at the same time, I think that now is like a better time than ever to do research because we are actually seeing new research being translated into very real world impact. And like a lot of the big breakthroughs like AlphaFold, like ChatGPT and so forth, there are things that are...","start":4194.14,"end":4212.68},{"id":262,"text":"And compared to the breakthroughs of 10 years ago or 20 years ago, these are things that are actually leading to really massive impact in the world today. And if you work on research now, you can help contribute to those kinds of new breakthroughs that will have even more impact in the future compared to if you were doing research 10 or 20 years ago. So I think that now is actually a better time than ever to be doing research, including in deep reinforcement learning. So yeah, those are my final thoughts.","start":4213.76,"end":4243.04}],"notes":["本段讨论了当前强化学习在实际应用中的成效，指出虽然已有成果，但研究仍具有重要价值。讲者强调当前是进行研究的最佳时机，因为新研究成果正在转化为现实世界的影响，如AlphaFold和ChatGPT等突破性技术。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4169.6,"end":4243.04,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4169.6,"text":"In terms of the time that we're in right now, I think that you might kind of feel like reinforcement learning works now to some extent. And so maybe we don't need to do research. Maybe we can just use the thing that works and apply it in all sorts of circumstances. And there's a lot of merit to applying research in the real world."},{"start":4194.14,"text":"It's good for some people to do that. But at the same time, I think that now is like a better time than ever to do research because we are actually seeing new research being translated into very real world impact. And like a lot of the big breakthroughs like AlphaFold, like ChatGPT and so forth, there are things that are..."},{"start":4213.76,"text":"And compared to the breakthroughs of 10 years ago or 20 years ago, these are things that are actually leading to really massive impact in the world today. And if you work on research now, you can help contribute to those kinds of new breakthroughs that will have even more impact in the future compared to if you were doing research 10 or 20 years ago. So I think that now is actually a better time than ever to be doing research, including in deep reinforcement learning. So yeah, those are my final thoughts."}],"speech_gaps":[],"frame":"../frames/v028/025.webp","frame_time":4181.6}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
