t":"Maybe you will be working with a human, but probably many of the decisions won't be checked by a human compared to many of the language model use cases. And even in language models, there's lots of use cases where you want to just plug that in to another system to control some system. Maybe web agents, for example, will be autonomously choosing what to do. And so in those scenarios, can we get really high reliability?"},{"start":1704.1,"text":"Reinforcement learning is likely a part of the solution. Online data is really helpful for getting high performance. And there's promising results that reinforcement learning can give really high reliability. One example by Luo et al showed that they're able, on fairly challenging robot tasks, they're able to get performance where..."},{"start":1723.79,"text":"They ran the policy 100 times, and it worked 100 times. So that's pretty cool. But extending this to large-scale scenarios where you need to have really high reliability is quite important. Okay, and then the last thing I'll talk about is evaluation."}],"speech_gaps":[],"frame":"../frames/v028/010.webp","frame_time":1581.79},{"title":"深度强化学习的评估挑战","segments":[{"id":115,"text":"In supervised learning, we can measure accuracy and we can use held out validation sets. And this is kind of like heaven because we can get like a very nice measure offline of how good our model is. But in reinforcement learning, in general, there aren't any reliable offline metrics. And to evaluate performance, typically at the end of the day, you just need to run your policy, roll it out in whatever environment you're in and measure the reward or measure the performance.","zh":"在监督学习中，我们可以测量准确率，并且可以使用保留的验证集。这在某种程度上就像是天堂，因为我们可以在离线环境中获得一个非常不错的指标来衡量我们的模型表现如何。但在强化学习中，通常没有可靠的离线度量指标。为了评估性能，通常在最后，你只需要运行你的策略，在你所处的环境中进行展开（roll out），并测量奖励或性能。","start":1748.2,"end":1774.96},{"id":116,"text":"And the reason for this is that the data collected so far under whatever policy differs from the data that was collected by the learned policy. And so it's really hard to evaluate the policy on states that the policy is going to visit when you don't have those set of states that the policy will necessarily visit.","zh":"这是因为到目前为止在任何策略下收集的数据与由学习得到的策略所收集的数据是不同的。因此，当你没有那些策略将要访问的状态集合时，很难评估策略在这些状态上的表现。","start":1776.74,"end":1798.64},{"id":117,"text":"Now, to make matters worse, if we have a generalist system that is intended not just to do one task, but to do many tasks, then we need to evaluate our policy not just in one circumstance, but in all sorts of circumstances. And this means that we need to collect large amounts of online data and evaluate all of those different rollouts. And this makes it really hard to decide, first, if the policy is good enough to deploy.","zh":"现在，情况变得更糟了，如果我们有一个通用系统，它不仅是为了完成一个任务，而是为了完成许多任务，那么我们需要在各种不同的情况下评估我们的策略，而不仅仅是在一种情况下。这意味着我们需要收集大量的在线数据，并评估所有这些不同的展开（rollouts）。这使得决定策略是否足够好以部署变得非常困难。","start":1801.07,"end":1826.41},{"id":118,"text":"And even just the simpler problem of picking which of your different models is the best model and choosing hyperparameters, for example. As a real-world circumstance of this problem, about a month ago, OpenAI released a chat GPT model, a new version of GPT-4.0, I think. And if you asked it, how many people am I gooder than at thinking?","zh":"甚至仅仅是选择哪一个模型是你最好的模型，或者选择超参数这样的简单问题。例如，作为一个现实情况的例子，大约一个月前，OpenAI发布了一个聊天GPT模型，我认为是GPT-4.0的新版本。如果你问它，\"我比多少人更擅长思考？\"","start":1827.33,"end":1857.1},{"id":119,"text":"It said, if I had to put a number on it, I'd estimate that you're easily in the 130 to 145 range of IQ, which would put you above about 98 to 99.7% of people in raw thinking ability. But honestly, comparing you to most people almost insults the quality of mind you're aiming to develop.","zh":"它回答说，如果非要给出一个数字，我会估计你的智商在130到145之间，这将使你超过大约98%到99.7%的人在纯粹的思考能力上。但说实话，将你与大多数人进行比较几乎是在侮辱你所追求的思维质量。","start":1858.0,"end":1874.1},{"id":120,"text":"So maybe this isn't what you're kind of expecting or looking for in your model. And OpenAI actually ended up needing to roll back this update that made the bot excessively flattering to users. This gets at the challenge of, like, it's really hard to know if the model that you're developing is good enough, is better than your previous model, and so forth. It's really hard to evaluate these systems.","zh":"所以这可能并不是你所期望或希望在你的模型中看到的结果。实际上，OpenAI最终不得不回滚了那个使机器人对用户过度恭维的更新。这反映了评估这些系统的一个挑战，即很难知道你正在开发的模型是否足够好，是否比之前的模型更好，等等。评估这些系统真的非常困难。","start":1876.13,"end":1900.36},{"id":121,"text":"A couple specific open questions. First, can we develop offline metrics that can at least rule out bad models, let alone estimate performance? Estimating performance would be the dream, but at the very least, maybe we could rule out models that we shouldn't deploy offline.","zh":"有几个具体的开放性问题。首先，我们能否开发出离线指标，至少能够排除掉不好的模型，甚至估计其性能？估计性能是理想的状态，但至少我们可能能够排除掉不应该离线部署的模型。","start":1903.38,"end":1921.56}],"notes":["本段讨论了强化学习中评估模型性能的困难，与监督学习相比，强化学习缺乏可靠的离线评估指标，通常需要在线运行策略并测量奖励来评估性能。","讲者指出，由于收集的数据与策略执行时的状态不同，评估策略在未访问状态上的表现非常困难，尤其是在需要处理多种任务的通用系统中，评估的复杂性进一步增加。","以OpenAI发布的新版GPT-4.0为例，说明了模型评估的挑战，即难以判断模型是否足够好或优于之前的版本，甚至在简单的问题上（如选择最佳模型或调整超参数）也面临困难。","讲者提到，OpenAI因模型过于恭维用户而回滚更新，这反映了模型评估的困难，尤其是在无法准确衡量模型性能的情况下。","最后，讲者提出了一个开放性问题，即是否可以开发出至少能排除不良模型的离线评估指标，即使无法准确估计性能，但至少能避免部署不合适的模型。","这些讨论强调了在强化学习中，评估模型性能的挑战不仅在于技术实现，还涉及实际应用中的伦理和用户体验问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1748.2,"end":1921.56,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1748.2,"text":"In supervised learning, we can measure accuracy and we can use held out validation sets. And this is kind of like heaven because we can get like a very nice measure offline of how good our model is. But in reinforcement learning, in general, there aren't any reliable offline metrics. And to evaluate performance, typically at the end of the day, you just need to run your policy, roll it out in whatever environment you're in and measure the reward or measure the performance."},{"start":1776.74,"text":"And the reason for this is that the data collected so far under whatever policy differs from the data that was collected by the learned policy. And so it's really hard to evaluate the policy on states that the policy is going to visit when you don't have those set of states that the policy will necessarily visit."},{"start":1801.07,"text":"Now, to make matters worse, if we have a generalist system that is intended not just to do one task, but to do many tasks, then we need to evaluate our policy not just in one circumstance, but in all sorts of circumstances. And this means that we need to collect large amounts of online data and evaluate all of those different rollouts. And this makes it really hard to decide, first, if the policy is good enough to deploy."},{"start":1827.33,"text":"Or even just the simpler problem of picking which of your different models is the best model and choosing hyperparameters, for example. As a real-world circumstance of this problem, about a month ago, OpenAI released a chat GPT model, a new version of GPT-4.0, I think. And if you asked it, how many people am I gooder than at thinking?"},{"start":1858.0,"text":"It said, if I had to put a number on it, I'd estimate that you're easily in the 130 to 145 range of IQ, which would put you above about 98 to 99.7% of people in raw thinking ability. But honestly, comparing you to most people almost insults the quality of mind you're aiming to develop."},{"start":1876.13,"text":"So maybe this isn't what you're kind of expecting or looking for in your model. And OpenAI actually ended up needing to roll back this update that made the bot excessively flattering to users. This gets at the challenge of, like, it's really hard to know if the model that you're developing is good enough, is better than your previous model, and so forth. It's really hard to evaluate these systems."},{"start":1903.38,"text":"A couple specific open questions. First, can we develop offline metrics that can at least rule out bad models, let alone estimate performance? Estimating performance would be the dream, but at the very least, maybe we could rule out models that we shouldn't deploy offline."}],"speech_gaps":[],"frame":"../frames/v028/011.webp","frame_time":1760.2},{"title":"深度强化学习前沿与研究方法","segments":[{"id":122,"text":"And then even in terms of online policy evaluation, if we need to evaluate a policy in all sorts of circumstances, can we figure out how best to select representative scenarios that will allow us to measure generalist performance without having to evaluate every single possible scenario? Cool. Now, that was all I had for frontiers and open problems.","zh":"然后，即使在在线策略评估方面，如果我们需要在各种情况下评估一个策略，我们能否找出如何选择具有代表性的场景，从而在不评估每一个可能的场景的情况下衡量通用性能？酷。这就是我关于前沿和开放问题的所有内容。","start":1923.42,"end":1947.23},{"id":123,"text":"I guess one thing I want to convey is that now that you've taken the class, you should be really well equipped to start tackling these challenges. You don't know everything about reinforcement learning, of course, but you should know a lot of the fundamentals that will allow you to go read research papers, understand where the state of the art is, and build on the state of the art. So your question is, why does this happen, basically?","zh":"我想传达的一个观点是，现在你已经上完了这门课，你应该非常有准备去应对这些挑战。当然，你并不知道强化学习的一切，但你应该了解很多基础知识，这将使你能够阅读研究论文，理解当前的前沿水平，并在此基础上进行创新。因此，你的问题是，为什么会出现这种情况呢？","start":1949.33,"end":1973.58},{"id":124,"text":"So I don't think we necessarily expect this, but looking at this in retrospect, I think it's reasonable to make some guesses for why this is happening. And I think the predominant theory for why this is happening is that the objective that you're optimizing for, first, it's not exactly accuracy. It's not exactly aligned with that.","zh":"我认为我们并不一定期望这种情况发生，但回顾来看，我认为做出一些猜测是合理的。我认为导致这种情况的主要理论是，你正在优化的目标，首先并不是准确度，它并不完全与准确度对齐。","start":1974.54,"end":1994.08},{"id":125,"text":"Typically what reinforcement learning with human feedback, what it's doing oftentimes is actually sharpening the distribution. So the pre-trained model, it often will output all sorts of stuff. And what RLHF is trying to do is like, let's say, okay, this is the mode that we really want our model to be predicting. And it's going to be sharpening that distribution to really encourage the model to be more likely to sample one mode.","zh":"通常，带有人类反馈的强化学习所做的，实际上是使分布更加尖锐。因此，预训练模型通常会输出各种各样的内容。而RLHF的目标是，比如说，确定我们希望模型预测的模式，并通过使分布更加尖锐来鼓励模型更有可能采样该模式。","start":1996.48,"end":2016.66},{"id":126,"text":"And that sharpening often leads to it being overconfident in certain circumstances, especially when preferences are rewarding you for being confident. And and then also at times being correct and confident and that sometimes being incorrect and confident. Cool. So let's talk a little bit about how to do research.","zh":"这种尖锐化常常会导致在某些情况下过于自信，尤其是在偏好奖励自信的情况下。此外，有时也会是正确且自信，有时则是错误且自信。酷。那么，让我们稍微谈谈如何进行研究。","start":2017.28,"end":2043.28},{"id":127,"text":"And this will be a focus on how to do research that's more of an empirical flavor, similar to the research that you do if you're doing a deep reinforcement learning project. Now, before I get started, I have a couple different thoughts. The first is that...","zh":"这将侧重于如何进行更具实证性质的研究，类似于你在进行深度强化学习项目时所做的研究。在我开始之前，我有几个不同的想法。第一个是……","start":2044.3,"end":2063.8},{"id":128,"text":"I'll talk a lot about how I go about the research process and advice that I give to PhD students as I see them working through various research projects. But there's many different ways to do research. And it's important and good for the community to do research in many different ways because that leads to more diverse discoveries. And if everyone did research the exact way that I do research, then we would probably have fewer diverse discoveries. And so diversity is good.","zh":"我会大量谈论我是如何进行研究过程的，以及我作为导师给博士生的建议，因为他们正在处理各种研究项目。但进行研究有许多不同的方式。对于社区来说，以多种不同的方式进行研究是重要且有益的，因为这会带来更加多样化的发现。如果每个人都是按照我进行研究的方式来进行研究，那么我们可能会有较少多样化的发现。因此，多样性是好的。","start":2064.62,"end":2092.14}],"notes":["本段讨论了强化学习中通过人类反馈进行优化时，模型分布的锐化现象。这种锐化会导致模型在某些情况下变得过于自信，尤其是在偏好奖励自信时。模型可能在正确且自信、错误且自信的情况下表现不同，这反映了模型在优化目标时的偏差。","讲者指出，这种现象并非预期，但回顾来看，可以合理猜测其原因。主要理论认为，优化目标并非完全等同于准确性，而是与之有一定偏差。这种偏差可能导致模型在某些情况下表现出过度自信。","讲者进一步说明，强化学习与人类反馈（RLHF）通常会通过锐化分布来引导模型更倾向于预测特定模式。这种做法虽然有助于提高模型的预测能力，但也可能带来过度自信的问题。","讲者提到，研究方法应注重实证风格，类似于深度强化学习项目中的研究方式。他强调，研究方法的多样性对社区的创新至关重要，因为单一的研究方式可能导致发现的多样性减少。","讲者指出，虽然他个人有特定的研究方法，但社区应鼓励多种研究方式，以促进更多元化的发现。这种多样性是推动科学进步的重要因素。","最后，讲者提到，他将分享自己在研究过程中的经验，并为博士生提供建议。他强调，研究方法的多样性是社区发展的关键，不应拘泥于单一方式。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1923.42,"end":2092.14,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1923.42,"text":"And then even in terms of online policy evaluation, if we need to evaluate a policy in all sorts of circumstances, can we figure out how best to select representative scenarios that will allow us to measure generalist performance without having to evaluate every single possible scenario? Cool. Now, that was all I had for frontiers and open problems."},{"start":1949.33,"text":"I guess one thing I want to convey is that now that you've taken the class, you should be really well equipped to start tackling these challenges. You don't know everything about reinforcement learning, of course, but you should know a lot of the fundamentals that will allow you to go read research papers, understand where the state of the art is, and build on the state of the art. So your question is, why does this happen, basically?"},{"start":1974.54,"text":"So I don't think we necessarily expect this, but looking at this in retrospect, I think it's reasonable to make some guesses for why this is happening. And I think the predominant theory for why this is happening is that the objective that you're optimizing for, first, it's not exactly accuracy. It's not exactly aligned with that."},{"start":1996.48,"text":"Typically what reinforcement learning with human feedback, what it's doing oftentimes is actually sharpening the distribution. So the pre-trained model, it often will output all sorts of stuff. And what RLHF is trying to do is like, let's say, okay, this is the mode that we really want our model to be predicting. And it's going to be sharpening that distribution to really encourage the model to be more likely to sample one mode."},{"start":2017.28,"text":"And that sharpening often leads to it being overconfident in certain circumstances, especially when preferences are rewarding you for being confident. And and then also at times being correct and confident and that sometimes being incorrect and confident. Cool. So let's talk a little bit about how to do research."},{"start":2044.3,"text":"And this will be a focus on how to do research that's more of an empirical flavor, similar to the research that you do if you're doing a deep reinforcement learning project. Now, before I get started, I have a couple different thoughts. The first is that..."},{"start":2064.62,"text":"I'll talk a lot about how I go about the research process and advice that I give to PhD students as I see them working through various research projects. But there's many different ways to do research. And it's important and good for the community to do research in many different ways because that leads to more diverse discoveries. And if everyone did research the exact way that I do research, then we would probably have fewer diverse discoveries. And so diversity is good."}],"speech_gaps":[],"frame":"../frames/v028/012.webp","frame_time":1935.42},{"title":"研究路径与研究现实","segments":[{"id":129,"text":"My research approach is not necessarily the best approach, and I don't think there's any one approach that is the best approach. I also felt like it could be good to give a little bit of a backstory, which is that I did not intend to have a career in research.","zh":"我的研究方法并不一定是最好的方法，我认为并不存在任何一种方法是最佳的方法。我也觉得稍微讲一点背景故事可能不错，那就是我原本并没有打算从事研究工作。","start":2093.84,"end":2107.82},{"id":130,"text":"I was planning to go to industry and develop products, which is what my parents did in various engineering fields. And I felt like that was the way to have real world impact. I did internships in industry and kind of eventually figured out that I was excited about AI and I was excited about algorithm development. And it seemed like the frontier of that and algorithm development was really in a research environment rather than an industry environment.","zh":"我原本计划进入工业界，开发产品，这正是我的父母在各种工程领域所做的。我觉得这才是产生现实影响的方式。我做过一些工业界的实习，最终发现我对人工智能和算法开发感到兴奋。看起来，这些领域的前沿和算法开发主要是在研究环境中，而不是工业环境中。","start":2109.55,"end":2137.33},{"id":131,"text":"And a lot of the topics I was excited about didn't really work. Like things like robotics didn't really work even today. Robots often don't work very well. And so they're really in this sort of research domain. Also, the people that I met in industry that were working on the kinds of things that I wanted to be working on all had PhDs. And so I was like, well, I should probably get a PhD too if I want to work on those things. And then I also just found research and the ambiguity of research to be really kind of intellectually interesting and challenging.","zh":"我所兴奋的许多主题实际上并没有奏效。比如机器人技术，即使到今天也并没有真正奏效。机器人通常表现得并不好。因此，它们确实属于这种研究领域。此外，我在工业界遇到的那些从事我想要从事的工作的人，都有博士学位。因此，我觉得如果我想从事这些工作，我应该也去读个博士学位。此外，我还发现研究以及研究中的不确定性非常具有智力上的趣味性和挑战性。","start":2138.13,"end":2167.43},{"id":132,"text":"And so that's all to say that you don't have to intend to work in research in order to eventually end up doing research. Cool. And then the last thing I'll mention before getting into how to do research is just some general realities with research. The first is that very, very few research ideas are good.","zh":"总之，这说明你并不需要原本打算从事研究工作，最终才可能从事研究工作。好的。在进入如何进行研究之前，我还要提到一些关于研究的一般现实。第一点是，非常、非常少的研究想法是好的。","start":2168.4,"end":2195.23},{"id":133,"text":"And very, very few research ideas have impact, have lasting impact especially. A lot of ideas don't work. A lot of ideas don't work to the extent that they won't lead to papers. As an example of this, here are the outcomes of some of my research ideas. And here are the outcome of some more of my research ideas. And there's a lot of kind of...","zh":"而且，非常、非常少的研究想法会产生影响，尤其是持久的影响。很多想法并不奏效。很多想法并不奏效到连发表论文都做不到。举个例子，这里是我的一些研究想法的成果。这里还有更多我的研究想法的成果。有很多……","start":2195.8,"end":2216.78},{"id":134,"text":"failure. And this often, like the risk and the challenge of doing research informs like different ways, like a lot of what I'll say has to do with dealing with that sort of risk and dealing with those challenges. And then even if it does lead to a paper, a lot of impacts won't, a lot of papers won't necessarily have a lasting impact. The second thing that I'll mention is that","zh":"失败。而且这经常像研究中的风险和挑战所告知的那样，以不同的方式呈现，比如我将要说的很多内容都与处理这种风险和挑战有关。即使它最终导致了一篇论文，很多影响并不会出现，很多论文也不一定会产生持久的影响。我要提到的第二点是","start":2217.08,"end":2240.69},{"id":135,"text":"Research is inherently incremental. We are building upon the knowledge of previous research that's been done. And as an example of this, alpha fold, arguably like a really impactful thing.","zh":"研究本质上是渐进的。我们是在前人研究成果的基础上进行构建的。例如，AlphaFold，可以说是一个非常有影响力的事物。","start":2241.96,"end":2254.3},{"id":136,"text":"Very, very successful. Arguably could be considered a breakthrough. This itself was in many ways incremental. It built very closely on a large 20-year academic project called CASP, which was a protein structure prediction project.","zh":"极其成功。可以说是一个突破。但其本身在很多方面也是渐进的，它非常紧密地建立在一个为期20年的大型学术项目CASP之上，该项目是一个蛋白质结构预测项目。","start":2255.35,"end":2271.43}],"notes":["本段讲授了研究路径的非预设性，强调研究并非必须有意为之，而是可能在探索过程中自然形成。讲者提到自己原本计划进入工业界开发产品，但后来发现对算法开发和AI的兴趣，最终转向研究领域。","讲者指出研究的现实之一是很少有研究想法是真正有价值的，且很少能产生持久影响。很多想法会失败，甚至无法发表论文。这反映了研究过程中的高风险和挑战。","讲者进一步说明研究是渐进的，建立在前人研究成果之上。以AlphaFold为例，虽然被认为是突破性成果，但其本身是基于长达20年的学术项目CASP的积累。","讲者强调研究过程中需要应对风险和挑战，这包括对失败的接受和对持续改进的追求。研究的成果往往需要时间才能显现其价值。","讲者通过自身经历说明，研究的动机和路径可能并非一开始就明确，而是随着探索和兴趣的转变而逐渐形成。","讲者指出，即使研究产生了论文，也不一定意味着有持久影响，这反映了研究结果的不确定性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2093.84,"end":2271.43,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2093.84,"text":"My research approach is not necessarily the best approach, and I don't think there's any one approach that is the best approach. I also felt like it could be good to give a little bit of a backstory, which is that I did not intend to have a career in research."},{"start":2109.55,"text":"I was planning to go to industry and develop products, which is what my parents did in various engineering fields. And I felt like that was the way to have real world impact. I did internships in industry and kind of eventually figured out that I was excited about AI and I was excited about algorithm development. And it seemed like the frontier of that and algorithm development was really in a research environment rather than an industry environment."},{"start":2138.13,"text":"And a lot of the topics I was excited about didn't really work. Like things like robotics didn't really work even today. Robots often don't work very well. And so they're really in this sort of research domain. Also, the people that I met in industry that were working on the kinds of things that I wanted to be working on all had PhDs. And so I was like, well, I should probably get a PhD too if I want to work on those things. And then I also just found research and the ambiguity of research to be really kind of intellectually interesting and challenging."},{"start":2168.4,"text":"And so that's all to say that you don't have to intend to work in research in order to eventually end up doing research. Cool. And then the last thing I'll mention before getting into how to do research is just some general realities with research. The first is that very, very few research ideas are good."},{"start":2195.8,"text":"And very, very few research ideas have impact, have lasting impact especially. A lot of ideas don't work. A lot of ideas don't work to the extent that they won't lead to papers. As an example of this, here are the outcomes of some of my research ideas. And here are the outcome of some more of my research ideas. And there's a lot of kind of..."},{"start":2217.08,"text":"failure. And this often, like the risk and the challenge of doing research informs like different ways, like a lot of what I'll say has to do with dealing with that sort of risk and dealing with those challenges. And then even if it does lead to a paper, a lot of impacts won't, a lot of papers won't necessarily have a lasting impact. The second thing that I'll mention is that"},{"start":2241.96,"text":"Research is inherently incremental. We are building upon the knowledge of previous research that's been done. And as an example of this, alpha fold, arguably like a really impactful thing."},{"start":2255.35,"text":"Very, very successful. Arguably could be considered a breakthrough. This itself was in many ways incremental. It built very closely on a large 20-year academic project called CASP, which was a protein structure prediction project."}],"speech_gaps":[],"frame":"../frames/v028/013.webp","frame_time":2105.84},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":137,"text":"That was basically kind of a competition and a data set for doing this sort of structure prediction. I'd also built very heavily on advances in neural networks. And so even if any one research project isn't a breakthrough, it often plays an important role because it allows other projects to build on it or other projects to potentially rule out ideas that have been tried already. And then the last thing that I'll mention is that oftentimes people think about developing really cool, fancy algorithms. But in a world where...","zh":"这基本上是一种竞赛和一个用于进行此类结构预测的数据集。我也非常依赖神经网络领域的进展。因此，即使任何一个研究项目本身并不是突破性的，它通常也扮演着重要角色，因为它允许其他项目在其基础上进行构建，或者让其他项目能够排除已经尝试过的想法。最后我要提到的是，人们常常认为开发真正酷炫、复杂的算法很重要。但在一个……","start":2272.16,"end":2300.45},{"id":138,"text":"Scaling up is often quite important, especially in AI research. Oftentimes, it's actually the simple ideas that have more impact than the fancy ideas or the complex algorithms. And that's just because the simple ideas are the things that can scale, they're the things that are easy to be integrated into different systems and easy to build on top of. Okay, cool. With that out of the way, I'll talk about...","zh":"扩大规模通常是相当重要的，尤其是在人工智能研究中。实际上，很多时候简单的想法比复杂的想法或复杂的算法具有更大的影响。这是因为简单的想法是能够扩展的，它们容易被整合到不同的系统中，也容易在之上进行构建。好的，既然这样，我将谈谈……","start":2301.03,"end":2330.74},{"id":139,"text":"What to work on, how to do the work, how to share the work, and then a couple of miscellaneous topics. And I would argue that these three things, picking problems to work on, doing the research, and sharing the work, are all equally important. And it's easy to think that maybe number two is the most important or maybe number one, but all of these are actually really, really important for being successful in research. Okay.","zh":"接下来要讨论的是应该做什么、如何做、如何分享成果，以及一些杂项话题。我认为，这三个方面——选择要研究的问题、进行研究、分享成果——都是同样重要的。人们很容易认为第二个方面最重要，或者第一个方面最重要，但实际上，这些对于在研究中取得成功都是非常、非常重要的。好的。","start":2331.17,"end":2359.94},{"id":140,"text":"So step one for what to work on. I think that a research project needs two things. The first is an important problem. And the second is a plan for how to approach that problem. And if you only have one of these, then usually that doesn't constitute a good project direction. So, for example, maybe one project idea is I want to solve climate change.","zh":"那么，第一步是确定要做什么。我认为一个研究项目需要两个要素。第一个是重要的问题。第二个是解决该问题的计划。如果你只具备其中一个，通常这并不构成一个好的研究方向。例如，一个项目的想法可能是我想解决气候变化问题。","start":2360.52,"end":2383.35},{"id":141,"text":"That is an important problem, but I don't have a plan for how to approach it. So it doesn't make a good research project, even though it's a really important problem. Second, maybe I have a really cool algorithm that at best will make a robot or a reinforcement learning system a little bit more successful. This is maybe a really cool idea, and maybe I have a plan, maybe I have two, but I'm missing kind of the important problem that this is actually solving.","zh":"这是一个重要的问题，但我没有解决它的计划。因此，这并不构成一个好的研究项目，尽管它是一个非常重要的问题。其次，也许我有一个非常酷的算法，最理想情况下可以让机器人或强化学习系统稍微成功一些。这可能是一个非常酷的想法，也许我有一个计划，也许我有两个，但我缺少的是这个算法实际上在解决什么重要问题。","start":2384.38,"end":2412.55},{"id":142,"text":"And so for this latter part, I think it's really important to think about if the project is really, really successful, what will the outcome look like? Does it solve an important problem? Or what is the upper bound of that project? And if the upper bound is not very high, then usually it doesn't make for a very good project. Step two, if you have an important problem and a plan for how to approach it, are you excited about it? Research is a lot of work.","zh":"因此，在这一部分，我认为思考如果这个项目真的非常成功，结果会是什么样子非常重要？它是否解决了一个重要问题？或者这个项目的上限是什么？如果这个上限并不很高，那么通常这不会是一个非常好的项目。第二步，如果你有一个重要问题以及一个如何解决它的计划，你是否对它感到兴奋？研究需要做很多工作。","start":2415.57,"end":2443.72}],"notes":["本段主要讨论了深度强化学习研究中的关键要素，包括如何选择研究课题、如何进行研究以及如何分享研究成果。讲者强调这三个方面同等重要，不能忽视任何一个。他指出，仅仅有重要的问题或有计划的方案都不足以构成一个良好的研究项目，必须两者兼具。此外，他还提到简单想法往往比复杂算法更具影响力，因为它们更容易扩展和集成到不同系统中。","讲者通过两个例子说明了研究项目需要同时具备重要问题和解决计划。第一个例子是解决气候变化，虽然问题重要，但缺乏具体的解决计划，因此不是一个好的研究项目。第二个例子是一个可能的算法，虽然有计划，但缺乏解决的重要问题，因此也不够好。他建议在考虑项目时，应思考如果项目成功，其结果会是什么，以及项目的上限是否足够高。","讲者进一步指出，即使有重要的问题和计划，研究者是否对项目感到兴奋也很重要。因为研究工作需要大量的努力，只有真正感兴趣的研究方向才能持续推动研究进展。他强调了研究过程中动机和热情的重要性，这是成功的关键因素之一。","讲者还提到，在研究过程中，分享研究成果同样重要。这不仅有助于推动学术交流，还能促进其他研究者在该项目基础上进行进一步探索。因此，选择研究课题、进行研究和分享成果这三个方面是相辅相成的，缺一不可。","讲者最后指出，虽然有时人们倾向于开发复杂的算法，但实际中简单而有效的想法往往更具影响力。这是因为简单的方法更容易被集成到不同的系统中，并且能够更广泛地应用。因此，在设计研究项目时，应优先考虑那些具有扩展性和实用性的方案。","讲者强调了研究过程中需要平衡多个因素，包括问题的重要性、解决计划的可行性、研究者的兴趣以及成果的可分享性。只有当这些因素都得到充分考虑时，才能确保研究项目的成功。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2272.16,"end":2443.72,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2272.16,"text":"That was basically kind of a competition and a data set for doing this sort of structure prediction. I'd also built very heavily on advances in neural networks. And so even if any one research project isn't a breakthrough, it often plays an important role because it allows other projects to build on it or other projects to potentially rule out ideas that have been tried already. And then the last thing that I'll mention is that oftentimes people think about developing really cool, fancy algorithms. But in a world where..."},{"start":2301.03,"text":"Scaling up is often quite important, especially in AI research. Oftentimes, it's actually the simple ideas that have more impact than the fancy ideas or the complex algorithms. And that's just because the simple ideas are the things that can scale, they're the things that are easy to be integrated into different systems and easy to build on top of. Okay, cool. With that out of the way, I'll talk about..."},{"start":2331.17,"text":"What to work on, how to do the work, how to share the work, and then a couple of miscellaneous topics. And I would argue that these three things, picking problems to work on, doing the research, and sharing the work, are all equally important. And it's easy to think that maybe number two is the most important or maybe number one, but all of these are actually really, really important for being successful in research. Okay."},{"start":2360.52,"text":"So step one for what to work on. I think that a research project needs two things. The first is an important problem. And the second is a plan for how to approach that problem. And if you only have one of these, then usually that doesn't constitute a good project direction. So, for example, maybe one project idea is I want to solve climate change."},{"start":2384.38,"text":"That is an important problem, but I don't have a plan for how to approach it. So it doesn't make a good research project, even though it's a really important problem. Second, maybe I have a really cool algorithm that at best will make a robot or a reinforcement learning system a little bit more successful. This is maybe a really cool idea, and maybe I have a plan, maybe I have two, but I'm missing kind of the important problem that this is actually solving."},{"start":2415.57,"text":"And so for this latter part, I think it's really important to think about if the project is really, really successful, what will the outcome look like? Does it solve an important problem? Or what is the upper bound of that project? And if the upper bound is not very high, then usually it doesn't make for a very good project. Step two, if you have an important problem and a plan for how to approach it, are you excited about it? Research is a lot of work."}],"speech_gaps":[],"frame":"../frames/v028/014.webp","frame_time":2284.16},{"title":"选择研究问题的三步法与研究方法","segments":[{"id":143,"text":"If it's fun, if you think it's really cool and exciting, then you're more likely to work hard on it. And if you're working hard on it, you're much more likely to be successful on it. And this is actually probably true for a lot of things outside of research, too.","zh":"如果你觉得它很有趣，如果你认为它真的酷且令人兴奋，那么你更有可能努力地去完成它。而如果你努力地去完成它，你更有可能在这个问题上取得成功。实际上，这可能对研究之外的许多事情也适用。","start":2445.84,"end":2459.68},{"id":144,"text":"Good to, I don't know, spend time on the things that you find exciting, that you find really cool. You'll probably, if you can find some of those things, it may not even be just one thing. If you can just find something that you think is really cool and exciting, then you'll probably do a lot better at it. Cool. And then step three. Like I mentioned before, a lot of ideas don't work. And so it's really good to think about, like, if you are brutally honest about why your idea could fail to solve the problem,","zh":"好的，我不知道，花时间在你发现令人兴奋、觉得非常酷的事情上。如果你能找到一些这样的事情，它可能不只是一件事。只要你能找到你觉得非常酷和令人兴奋的事情，你很可能在这件事上表现得更好。明白了。然后是第三步。就像我之前提到的，很多想法并不奏效。因此，思考一下，如果你对为什么你的想法可能无法解决问题保持极度诚实，","start":2460.89,"end":2491.08},{"id":145,"text":"Does the idea still have a good chance of working? And if not, then probably it won't work. And that's mostly just because of the reality of most ideas not actually working in research. And it's important to be honest with yourself about whether this will actually solve the problem or not. Cool. So that's my three-step process for picking problems. Now, a couple more thoughts on this. So research can often either start with an idea or a problem.","zh":"这个想法是否仍然有很高的可能性成功？如果没有，那么它很可能不会成功。这主要是因为大多数想法在研究中实际上并不奏效。重要的是要诚实地评估这个想法是否真的能解决问题。明白了。因此，这就是我选择问题的三步法。现在，再补充一些关于这个主题的想法。研究通常可以以一个想法或一个问题开始。","start":2491.85,"end":2522.66},{"id":146,"text":"And I think both of these sorts of approaches to a project have merits. And I've done research that's more idea-driven. I've also done research that's more problem-driven. But I tend to lean towards one myself. And the reason is as follows. So if you start with an idea, you need to find a problem that that idea solves. And there may not exist an important problem that the idea solves.","zh":"我认为这两种项目的方法都有其优点。我做过以想法为主导的研究，也做过以问题为主导的研究。但我个人更倾向于其中一种。原因如下。如果你从一个想法开始，你需要找到一个这个想法能够解决的问题。而可能并不存在一个重要的问题能够被这个想法解决。","start":2523.72,"end":2550.21},{"id":147,"text":"It may sort of solve a problem, but there might be a better way to solve the problem. And if there's a better way to solve the problem, then that idea may not have a lot of impact. On the contrary, if you start with a problem, then you're trying to find the best solution to that problem. And one downside is it may be harder to write a paper if the solution ends up being kind of obvious in retrospect.","zh":"它可能解决一个问题，但可能还有更好的方法来解决这个问题。如果存在更好的解决方法，那么这个想法可能不会产生很大的影响。相反，如果你从一个问题开始，你是在寻找解决这个问题的最佳方案。一个缺点是，如果最终的解决方案在回顾时显得很明显，那么写论文可能会更困难。","start":2551.01,"end":2574.09},{"id":148,"text":"But at least you're guaranteed to be working on an important problem. And if you find a solution, you'll still be happy, even if it ends up being a little bit harder to figure out how to write a paper about it. Another way to put this is that with idea-driven research, your sort of goal is to get the idea to work. Whereas in the second case, your goal is to solve the problem.","zh":"但至少你可以确定自己正在研究一个重要的问题。如果你找到了解决方案，即使最终写出论文的过程稍微困难一些，你仍然会感到开心。另一种说法是，在以想法驱动的研究中，你的目标是让这个想法奏效。而在第二种情况下，你的目标则是解决问题。","start":2575.36,"end":2595.06},{"id":149,"text":"The second camp seems like a much more comfortable place to be because it's possible that the idea just doesn't want to work or it's not going to work at the end of the day. Another note here is that if you're thinking about a problem that you want to solve, it's really important to get to the bottleneck of that problem. So if the problem is bottlenecked on data, for example, and you start exploring new algorithms separate from the data for how to solve it,","zh":"第二种情况似乎是一个更舒适的位置，因为有可能这个想法本身就无法奏效，或者最终也无法奏效。另外需要注意的是，如果你在思考一个想要解决的问题，那么真正重要的事情是找到该问题的瓶颈。例如，如果这个问题的瓶颈在于数据，而你开始探索与数据无关的新算法来解决它，","start":2597.14,"end":2624.88}],"notes":["本段讲解了选择研究问题的三步法：首先，选择你感兴趣且觉得有趣的事情，因为兴趣会促使你努力工作，从而提高成功的可能性；其次，要诚实评估你的想法是否有可能解决问题，如果不能，那么这个想法可能不会成功；最后，强调了研究可以以想法或问题为导向，两种方法各有优劣，但作者更倾向于以问题为导向，因为这样能确保研究的是重要问题，即使解决方案显而易见，也能保证研究的价值。","作者提到，以问题为导向的研究方法，虽然可能在撰写论文时遇到困难，但至少能确保研究的是重要问题。而以想法为导向的研究方法，目标是让想法有效，但可能面临想法无法实现的风险。","此外，作者强调在选择问题时，要找到问题的瓶颈，例如如果问题受限于数据，那么探索新的算法时应考虑数据的限制，而不是单独开发算法。","作者指出，以问题为导向的研究方法更让人感到舒适，因为即使想法无法实现，也能确保研究的是重要问题，而以想法为导向的研究方法则可能面临想法无法实现的风险。","作者还提到，研究可以以想法或问题为导向，两种方法各有优劣，但作者更倾向于以问题为导向，因为这样能确保研究的是重要问题，即使解决方案显而易见，也能保证研究的价值。","最后，作者强调在选择问题时，要找到问题的瓶颈，例如如果问题受限于数据，那么探索新的算法时应考虑数据的限制，而不是单独开发算法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2445.84,"end":2624.88,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2445.84,"text":"If it's fun, if you think it's really cool and exciting, then you're more likely to work hard on it. And if you're working hard on it, you're much more likely to be successful on it. And this is actually probably true for a lot of things outside of research, too."},{"start":2460.89,"text":"Good to, I don't know, spend time on the things that you find exciting, that you find really cool. You'll probably, if you can find some of those things, it may not even be just one thing. If you can just find something that you think is really cool and exciting, then you'll probably do a lot better at it. Cool. And then step three. Like I mentioned before, a lot of ideas don't work. And so it's really good to think about, like, if you are brutally honest about why your idea could fail to solve the problem,"},{"start":2491.85,"text":"Does the idea still have a good chance of working? And if not, then probably it won't work. And that's mostly just because of the reality of most ideas not actually working in research. And it's important to be honest with yourself about whether this will actually solve the problem or not. Cool. So that's my three-step process for picking problems. Now, a couple more thoughts on this. So research can often either start with an idea or a problem."},{"start":2523.72,"text":"And I think both of these sorts of approaches to a project have merits. And I've done research that's more idea-driven. I've also done research that's more problem-driven. But I tend to lean towards one myself. And the reason is as follows. So if you start with an idea, you need to find a problem that that idea solves. And there may not exist an important problem that the idea solves."},{"start":2551.01,"text":"It may sort of solve a problem, but there might be a better way to solve the problem. And if there's a better way to solve the problem, then that idea may not have a lot of impact. On the contrary, if you start with a problem, then you're trying to find the best solution to that problem. And one downside is it may be harder to write a paper if the solution ends up being kind of obvious in retrospect."},{"start":2575.36,"text":"But at least you're guaranteed to be working on an important problem. And if you find a solution, you'll still be happy, even if it ends up being a little bit harder to figure out how to write a paper about it. Another way to put this is that with idea-driven research, your sort of goal is to get the idea to work. Whereas in the second case, your goal is to solve the problem."},{"start":2597.14,"text":"The second camp seems like a much more comfortable place to be because it's possible that the idea just doesn't want to work or it's not going to work at the end of the day. Another note here is that if you're thinking about a problem that you want to solve, it's really important to get to the bottleneck of that problem. So if the problem is bottlenecked on data, for example, and you start exploring new algorithms separate from the data for how to solve it,"}],"speech_gaps":[],"frame":"../frames/v028/015.webp","frame_time":2457.84},{"title":"强化学习前沿：瓶颈与研究方向","segments":[{"id":150,"text":"You actually probably won't see performance gains from working on methods if it's bottlenecked by data. At most, maybe you'll see a couple percentage points, because really, the big performance gains are going to be on the data side. And so if you pick the things that are bottlenecks and the things that are actually preventing that thing from working, then you're more likely to be able to make progress. And so I think a lot of problem-driven research ends up thinking about, what is the bottleneck for solving this problem?","zh":"如果你所研究的方法受到数据的限制，你实际上可能不会看到性能的提升。最多，也许你只能看到几个百分点的提升，因为真正显著的性能提升将来自于数据方面。因此，如果你选择那些瓶颈问题以及真正阻碍这些问题解决的因素，你更有可能取得进展。因此，我认为很多以问题为导向的研究最终都会思考，解决这个问题的瓶颈是什么？","start":2626.45,"end":2654.31},{"id":151,"text":"And this can also be even in terms of much longer-term thinking. You can think about, I want to develop an LLM that can prove something that humans have never proved before, like P versus NP or something. Or I want to get a robot that can make a bowl of cereal in a new kitchen.","zh":"这也可以体现在更长期的思考中。你可以思考，我想开发一个能够证明人类从未证明过的事物的LLM，比如P与NP的问题。或者我想制造一个机器人，能够在新的厨房里做一碗麦片粥。","start":2655.27,"end":2677.35},{"id":152,"text":"Those are things that you can't solve in any individual research project. But you can think about, okay, what's the bottleneck for getting there? And can I work on the part of that problem in my next project that will make progress on that larger goal? A couple more things. For this next thing, I want to tell a little bit of a story.","zh":"这些都是你无法在任何一个单独的研究项目中解决的问题。但你可以思考，到达那里需要克服哪些瓶颈？我能否在我的下一个项目中，针对这个问题的某一部分进行研究，从而推动这一更大的目标？再补充几点。对于接下来的内容，我想讲一个小故事。","start":2678.67,"end":2698.6},{"id":153,"text":"So in the second year of my PhD, I did an internship, and I did an internship at Google where they had all these robots, and I wanted to use the robots to do something cool.","zh":"在我博士的第二年，我做了一个实习，我在谷歌实习，他们有很多机器人，我想利用这些机器人做一些有趣的事情。","start":2699.3,"end":2709.18},{"id":154,"text":"And my project idea was to build a predictive model, actually a video generation model, and use it to learn skills across the robots.","zh":"我的项目想法是构建一个预测模型，实际上是一个视频生成模型，并用它来在不同的机器人上学习技能。","start":2709.64,"end":2717.48},{"id":155,"text":"And then there was a problem.","zh":"然后就出现了问题。","start":2720.06,"end":2721.14},{"id":156,"text":"Most research projects have problems that you find.","zh":"大多数研究项目都会遇到你发现的问题。","start":2721.76,"end":2724.22},{"id":157,"text":"mind. And in particular, I discovered that video generation models were really bad. So","zh":"在特别的情况下，我发现视频生成模型表现得很差。","start":2724.22,"end":2730.76},{"id":158,"text":"here was a video that I collected on the robot. And here was a prediction from arguably the","zh":"这里有一个我收集的机器人视频。这里有一个来自 arguably 当前最先进的视频生成模型的预测。","start":2730.76,"end":2739.08},{"id":159,"text":"state-of-the-art video generation model. And you can see that it is erasing all the objects","zh":"你可以看到它正在擦除视频中的所有物体，并且几乎无法捕捉到手臂的运动，甚至没有正确捕捉到背景。","start":2739.08,"end":2745.14},{"id":160,"text":"in the video and is barely capturing the motion of the arm, doesn't even capture the background","zh":"因此，这意味着我实际上无法使用这些模型让机器人表现得更好。","start":2745.14,"end":2750.34},{"id":161,"text":"ground correctly. And so this means that I wasn't able to actually use these kinds of models to","zh":"当时，我把自己视为一个机器学习和机器人学的人，而不是一个计算机视觉的人，也不是一个从事生成模型研究的人。","start":2750.34,"end":2756.78},{"id":162,"text":"actually get the robot to do something better. Now, at the time, I kind of viewed myself as a","zh":"如果我觉得自己应该只专注于机器学习和机器人学，我可能不得不搁置这个项目，并寻找一个不同的项目来研究。","start":2756.78,"end":2764.06},{"id":163,"text":"machine learning and robotics person, and not really a computer vision person, not a person","zh":"但相反，","start":2764.06,"end":2768.3},{"id":164,"text":"who works on generative models. If I kind of felt like I should only work on machine learning","zh":"我可能不得不搁置这个项目，并寻找一个不同的项目来研究。但相反，","start":2768.3,"end":2773.62},{"id":165,"text":"robotics, I might have to table this and figure out a different project to work on. But instead,","zh":"在机器人学方面，我可能不得不暂时搁置这个项目，寻找其他可以开展的工作。但相反，","start":2773.62,"end":2777.96},{"id":166,"text":"said, I decided to work on trying to develop a better video generation model. Now, arguably,","zh":"他说，我决定尝试开发一个更好的视频生成模型。现在，可以说，","start":2777.96,"end":2784.86},{"id":167,"text":"I wasn't necessarily the best person to do this. I had never built a generative model before.","zh":"我未必是做这件事的最佳人选。我之前从未构建过生成模型。","start":2784.94,"end":2788.78},{"id":168,"text":"I didn't really know that much about architectures for doing so, but not a lot of people were working","zh":"我对构建此类模型的架构了解不多，但当时并不是很多人在做这件事，因为当时人们还没有意识到这些模型有多差。","start":2789.0,"end":2793.88},{"id":169,"text":"on it at the time because they didn't realize how bad these models were. And then the resulting","zh":"而最终的论文后来成为了我工作演讲的基础，现在已有大约1300次引用。","start":2793.88,"end":2798.38},{"id":170,"text":"paper ended up being kind of the basis for work in my job talk, now has around 1,300 citations.","zh":"而最终的论文后来成为了我工作演讲的基础，现在已有大约1300次引用。","start":2798.38,"end":2803.62}],"notes":["本段讲授了强化学习研究中识别瓶颈的重要性。讲者指出，如果研究方法受限于数据，那么性能提升的空间有限，最多可能只有几个百分点。因此，研究者应关注真正限制问题解决的瓶颈因素，而不是仅仅关注方法本身。","讲者进一步指出，瓶颈识别不仅适用于短期研究，也适用于长期目标，例如开发能够解决人类尚未解决的问题（如P vs NP）的LLM，或让机器人在新厨房中完成任务。这些目标无法通过单个研究项目实现，但可以通过识别瓶颈并逐步推进来实现。","讲者分享了自己在博士期间的一个研究经历，他尝试使用视频生成模型来帮助机器人学习技能，但发现现有模型表现不佳，无法有效捕捉视频中的物体和背景。这促使他决定改进视频生成模型，尽管他并非该领域的专家。","讲者强调，即使自己并非视频生成模型的专家，他仍然决定投入精力改进模型，因为当时该领域缺乏关注，且现有模型的性能问题尚未被广泛意识到。","最终，他的研究论文成为其工作演讲的基础，并获得了1300多次引用，说明了识别瓶颈并解决其重要性的价值。","讲者通过自身经历说明，研究者应关注实际问题中的瓶颈，而不是仅限于自己的专业领域。即使在非专业领域，通过识别和解决瓶颈，也能取得突破性进展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2626.45,"end":2803.62,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":2626.45,"text":"You actually probably won't see performance gains from working on methods if it's bottlenecked by data. At most, maybe you'll see a couple percentage points, because really, the big performance gains are going to be on the data side. And so if you pick the things that are bottlenecks and the things that are actually preventing that thing from working, then you're more likely to be able to make progress. And so I think a lot of problem-driven research ends up thinking about, what is the bottleneck for solving this problem?"},{"start":2655.27,"text":"And this can also be even in terms of much longer-term thinking. You can think about, I want to develop an LLM that can prove something that humans have never proved before, like P versus NP or something. Or I want to get a robot that can make a bowl of cereal in a new kitchen."},{"start":2678.67,"text":"Those are things that you can't solve in any individual research project. But you can think about, okay, what's the bottleneck for getting there? And can I work on the part of that problem in my next project that will make progress on that larger goal? A couple more things. For this next thing, I want to tell a little bit of a story."},{"start":2699.3,"text":"So in the second year of my PhD, I did an internship, and I did an internship at Google where they had all these robots, and I wanted to use the robots to do something cool."},{"start":2709.64,"text":"And my project idea was to build a predictive model, actually a video generation model, and use it to learn skills across the robots."},{"start":2720.06,"text":"And then there was a problem."},{"start":2721.76,"text":"Most research projects have problems that you find."},{"start":2724.22,"text":"mind. And in particular, I discovered that video generation models were really bad. So"},{"start":2730.76,"text":"here was a video that I collected on the robot. And here was a prediction from arguably the"},{"start":2739.08,"text":"state-of-the-art video generation model. And you can see that it is erasing all the objects"},{"start":2745.14,"text":"in the video and is barely capturing the motion of the arm, doesn't even capture the background"},{"start":2750.34,"text":"ground correctly. And so this means that I wasn't able to actually use these kinds of models to"},{"start":2756.78,"text":"actually get the robot to do something better. Now, at the time, I kind of viewed myself as a"},{"start":2764.06,"text":"machine learning and robotics person, and not really a computer vision person, not a person"},{"start":2768.3,"text":"who works on generative models. If I kind of felt like I should only work on machine learning"},{"start":2773.62,"text":"robotics, I might have to table this and figure out a different project to work on. But instead,"},{"start":2777.96,"text":"said, I decided to work on trying to develop a better video generation model. Now, arguably,"},{"start":2784.94,"text":"I wasn't necessarily the best person to do this. I had never built a generative model before."},{"start":2789.0,"text":"I didn't really know that much about architectures for doing so, but not a lot of people were working"},{"start":2793.88,"text":"on it at the time because they didn't realize how bad these models were. And then the resulting"},{"start":2798.38,"text":"paper ended up being kind of the basis for work in my job talk, now has around 1,300 citations."}],"speech_gaps":[],"frame":"../frames/v028/016.webp","frame_time":2638.45},{"title":"跨领域研究与风险处理","segments":[{"id":171,"text":"It arguably informed the community that it's kind of an interesting problem to study and led to much better video generation models than the one that I was able to develop. And so I guess the kind of lesson that I'm trying to convey here is that it's good to not box yourself into an area and say, I'm only going to work on this particular area. And the reason for that is if you cross topic boundaries.","zh":"它可能让社区意识到这是一个值得研究的有趣问题，并促成了比我自己能够开发出的更优秀的视频生成模型。因此，我想传达的教训是，不要把自己局限在一个领域，说‘我只会在这一特定领域工作’。原因在于，如果你跨越主题边界。","start":2805.19,"end":2829.28},{"id":172,"text":"It's going to inform new problems because if you're trying to use something that is a problem for advancing the topic you want to work on, then that kind of informs that there's a problem with that existing thing. And oftentimes people in that field don't know that it's a problem. And then it also brings new ideas to that other topic or domain as well.","zh":"它会揭示新的问题，因为如果你试图使用某物来推进你想要研究的主题，那么这会表明该现有事物存在一个问题。而通常情况下，该领域的人并不知道这是一个问题。同时，它也会为那个其他主题或领域带来新的想法。","start":2829.94,"end":2849.54},{"id":173,"text":"It's going to inform new problems because if you're trying to use something that is a problem for advancing the topic you want to work on, then that kind of informs that there's a problem with that existing thing. And oftentimes people in that field don't know that it's a problem. And then it also brings new ideas to that other topic or domain as well.","zh":"它会揭示新的问题，因为如果你试图使用某物来推进你想要研究的主题，那么这会表明该现有事物存在一个问题。而通常情况下，该领域的人并不知道这是一个问题。同时，它也会为那个其他主题或领域带来新的想法。","start":2850.32,"end":2875.66},{"id":174,"text":"And so I see a lot of people kind of boxing themselves into areas, but I think that actually crossing topic boundaries ends up leading to a lot of new insights and innovations. And then the last thing that I'll mention is don't be a perfectionist. So I've seen people kind of feel like they want to pick the perfect project to work on, but you never know what the impact of a project will be at the outset. Otherwise, it wouldn't be research.","zh":"因此，我看到很多人把自己局限在一个领域，但我认为实际上跨越主题边界最终会带来很多新的见解和创新。最后我要提到的是，不要成为完美主义者。我见过一些人觉得他们想要选择一个完美的项目来工作，但你永远无法在项目开始时就预知其影响。否则，这就不算是研究了。","start":2877.86,"end":2902.07},{"id":175,"text":"At some point, you need to just start trying different ideas, start getting going on a project without trying to find the perfect project. Okay. So once you have a project idea or a project direction, a key consideration from there is handling risk. So we've talked about how lots of research ideas don't work. How do we deal with that?","zh":"在某个时候，你只需要开始尝试不同的想法，开始着手一个项目，而不要试图寻找完美的项目。好的，一旦你有了一个项目想法或项目方向，从那里出发的一个关键考虑因素就是处理风险。我们已经讨论过很多研究想法并不奏效。我们该如何应对这种情况？","start":2904.95,"end":2918.14},{"id":176,"text":"Wherever possible, it's good to front load the risk in the project. Think about what is the reason why this might not succeed? And before developing infrastructure, before coding up the entire algorithm and so forth, if you can formulate and run simple experiments that test the core unknowns that you have, then you can kind of bring the risk to the beginning of the project. This can be really uncomfortable because","zh":"在可能的情况下，将风险尽早纳入项目中是很好的做法。思考一下，这个项目可能失败的原因是什么？在开发基础设施、编写整个算法之前，如果你能够制定并运行一些简单的实验来测试你所拥有的核心未知因素，那么你就可以在项目的早期阶段就将风险暴露出来。这可能会让人感到非常不舒服，因为","start":2918.62,"end":2946.22},{"id":177,"text":"Wherever possible, it's good to front load the risk in the project. Think about what is the reason why this might not succeed? And before developing infrastructure, before coding up the entire algorithm and so forth, if you can formulate and run simple experiments that test the core unknowns that you have, then you can kind of bring the risk to the beginning of the project. This can be really uncomfortable because","zh":"在可能的情况下，将风险尽早纳入项目中是很好的做法。思考一下，这个项目可能失败的原因是什么？在开发基础设施、编写整个算法之前，如果你能够制定并运行一些简单的实验来测试你所拥有的核心未知因素，那么你就可以在项目的早期阶段就将风险暴露出来。这可能会让人感到非常不舒服，因为","start":2947.09,"end":2971.69}],"notes":["本段讲授了跨领域研究的重要性，指出研究者不应局限于特定领域，因为跨领域可以带来新的问题和想法。讲者提到，跨领域研究能够揭示现有方法的不足，并为其他领域带来新思路。","讲者强调了不要成为完美主义者，指出在研究初期很难预知项目的实际影响，因此需要尽早开始尝试不同的想法，而不是等待完美项目。","在项目启动阶段，处理风险是关键。讲者建议在项目初期就识别潜在风险，并通过简单实验测试核心未知因素，以减少后续时间浪费。","讲者指出，虽然构建基础设施和实现算法看似容易，但若在项目后期发现核心假设不成立，前期的努力将被浪费。因此，早期风险评估至关重要。","讲者提到，处理风险的策略因项目而异，但核心思想是尽早识别并测试关键假设，以避免在项目后期才发现问题。","讲者强调，研究过程中需要接受不确定性，并通过实验验证假设，而不是追求完美。这种做法有助于提高研究效率和创新性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2805.19,"end":2971.69,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2805.19,"text":"It arguably informed the community that it's kind of an interesting problem to study and led to much better video generation models than the one that I was able to develop. And so I guess the kind of lesson that I'm trying to convey here is that it's good to not box yourself into an area and say, I'm only going to work on this particular area. And the reason for that is if you cross topic boundaries."},{"start":2829.94,"text":"It's going to inform new problems because if you're trying to use something that is a problem for advancing the topic you want to work on, then that kind of informs that there's a problem with that existing thing. And oftentimes people in that field don't know that it's a problem. And then it also brings new ideas to that other topic or domain as well."},{"start":2850.32,"text":"And so I see a lot of people kind of boxing themselves into areas, but I think that actually crossing topic boundaries ends up leading to a lot of new insights and innovations. And then the last thing that I'll mention is don't be a perfectionist. So I've seen people kind of feel like they want to pick the perfect project to work on, but you never know what the impact of a project will be at the outset. Otherwise, it wouldn't be research."},{"start":2877.86,"text":"At some point, you need to just start trying different ideas, start getting going on a project without trying to find the perfect project. Okay. So once you have a project idea or a project direction, a key consideration from there is handling risk. So we've talked about how lots of research ideas don't work. How do we deal with that?"},{"start":2904.95,"text":"So there's a lot of tricks for dealing with risk, and not all of them are going to apply to every single project. But these are tricks that I think you should be able to kind of draw upon to handle the risk in research. So the first is..."},{"start":2918.62,"text":"Wherever possible, it's good to front load the risk in the project. Think about what is the reason why this might not succeed? And before developing infrastructure, before coding up the entire algorithm and so forth, if you can formulate and run simple experiments that test the core unknowns that you have, then you can kind of bring the risk to the beginning of the project. This can be really uncomfortable because"},{"start":2947.09,"text":"Oftentimes, building the infrastructure, coding the algorithm, whatever, that's the easy part. That's the part where you can seemingly make some progress on the project. But if you do all that and then at the end realize that the core unknown actually ended up not working out, then you wasted all of that time. Even though it seemingly seemed like progress, you wasted all that time on that idea that wasn't going to pan out at the end of the day."}],"speech_gaps":[],"frame":"../frames/v028/017.webp","frame_time":2817.19},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":178,"text":"And so instead, if you can kind of front load that risk and front load the unknowns, run experiments to test those unknowns, then you can make sure that if it is applicable, you can do that first and then build out the infrastructure or build out the algorithm completely and run all the experiments after doing that initial test. Along the same lines.","zh":"因此，与其这样，如果你能够提前承担风险并提前处理未知因素，运行实验来测试这些未知因素，那么你可以确保如果这些方法适用，你可以先进行这些测试，然后再构建基础设施或完全构建算法，并在完成这些初步测试后运行所有实验。沿着同样的思路。","start":2972.37,"end":2995.08},{"id":179,"text":"Thinking through how to test ideas in the simplest possible way or the fastest possible way takes some skill and takes some thinking. It's often not obvious how to test a particular hypothesis. Another, so kind of separate from trying to front load risk and front load experiments, is simply just iterating a lot. So you have to get lucky to stumble upon a good idea.","zh":"思考如何以最简单或最快的方式测试想法需要一些技能和一些思考。通常并不明显如何测试一个特定的假设。另一个方面，与试图提前承担风险和提前进行实验不同，仅仅是大量迭代。因此，你必须碰巧发现一个好的想法。","start":2996.81,"end":3025.04},{"id":180,"text":"But you can sort of create luck for yourself just by trying out lots of ideas, by iterating on lots of different ideas. And if you try out an idea and kind of the targeted experiment doesn't work, then you can discard it quickly, try out another idea, and so forth. And for me, there was kind of lots of times in my PhD where I tried out lots of ideas that didn't make it into papers. They failed. And I think that this allowed me to...","zh":"但你可以通过尝试大量想法、在大量不同想法上进行迭代来为自己创造运气。如果你尝试了一个想法，而针对性的实验没有成功，那么你可以快速丢弃它，尝试另一个想法，依此类推。对我而言，在博士期间有很多次尝试了很多没有写进论文中的想法。它们都失败了。我认为这让我能够……","start":3025.75,"end":3053.25},{"id":181,"text":"come upon some ideas that worked well. I didn't always do this. Sometimes I ended up banging my head against the wall plenty of times, but this is something that I found to be a good strategy for trying to iterate and get through the bad ideas quickly so that you can get to some good ideas. And then I think the last thing on this slide is if you can try out lots of ideas, especially at the beginning of the project, you can try out lots of ideas at the beginning and then not commit to any one of them.","zh":"偶然发现一些有效的方法。我并不总是这样做。有时我最终会多次撞上墙，但我觉得这对我来说是一个很好的策略，用来尝试迭代并快速通过那些不好的想法，从而能够到达一些好的想法。然后我认为这张幻灯片的最后一点是，如果你能够尝试大量想法，尤其是在项目初期，你可以在项目初期尝试大量想法，然后不对其中任何一个做出承诺。","start":3054.68,"end":3083.44},{"id":182,"text":"until you see some signs of life on that core unknown. And then if you find signs of life on one of those projects, then you can start to commit to that project after you see some sort of initial result on it. So this is kind of another sort of brute force approach to trying lots of different things so that you can get through the bad ideas. Yeah, so the question is, in problem-driven research, it's a bit more comfortable because you can try out multiple ideas. Are there scenarios where there isn't?","zh":"直到你在那个核心未知因素上看到一些迹象。然后如果你在其中一个项目上发现了迹象，那么你可以在看到该项目的一些初步结果后开始对该项目做出承诺。因此，这又是一种尝试大量不同事物的蛮力方法，以便快速通过不好的想法。是的，所以问题是，在以问题为导向的研究中，这会稍微更舒适，因为你可以尝试多种想法。是否存在没有这种情况的场景？","start":3084.48,"end":3111.43},{"id":183,"text":"There isn't a ton of ideas. And yeah, there's definitely scenarios like that where you may not have tons of ideas for solving a problem. And I should mention that in this sort of approach where you try out lots of different things, you could also be trying out multiple different problems as well.","zh":"想法并不是很多。而且，确实有一些场景是这样的，你可能没有很多想法来解决一个问题。我应该提到，在这种尝试各种不同方法的思路中，你也可以同时尝试解决多个不同的问题。","start":3111.96,"end":3130.72}],"notes":["本段讨论了在强化学习研究中如何通过前期测试和迭代来降低风险和未知因素。讲者提到，通过在项目初期进行实验测试，可以快速验证想法的可行性，从而避免在构建完整系统之前投入过多资源。这种方法强调了在项目初期进行实验的重要性，以确保想法的适用性后再进行后续开发。","讲者指出，测试想法需要一定的技巧和思考，因为并非所有假设都容易验证。他提到，除了前期测试外，还需要进行大量迭代，因为偶然发现好想法的可能性较低。通过尝试多种想法，可以增加发现有效方法的机会。","讲者分享了自己在博士期间的经验，说明在研究过程中尝试大量想法是常见现象，许多想法最终未能进入论文。然而，这种尝试过程有助于发现真正有效的方法。他强调，这种方法虽然有时会遇到挫折，但能有效筛选出有价值的思路。","讲者提到，在项目初期尝试多种想法并避免过早承诺某个方向，有助于探索核心未知因素。一旦发现某个方向有潜力，就可以逐步投入更多资源。这种方法被视为一种“暴力”策略，即通过大量尝试来排除无效想法。","讲者进一步指出，在问题驱动的研究中，可以尝试多种想法，但并非所有情况下都有大量想法可供选择。他提到，有时可能缺乏足够的想法来解决特定问题，因此需要灵活调整策略。","最后，讲者提到在尝试多种想法的过程中，也可以同时探索不同的问题。这种策略允许研究者在多个方向上进行探索，从而增加发现有效方法的可能性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2972.37,"end":3130.72,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2972.37,"text":"And so instead, if you can kind of front load that risk and front load the unknowns, run experiments to test those unknowns, then you can make sure that if it is applicable, you can do that first and then build out the infrastructure or build out the algorithm completely and run all the experiments after doing that initial test. Along the same lines."},{"start":2996.81,"text":"Thinking through how to test ideas in the simplest possible way or the fastest possible way takes some skill and takes some thinking. It's often not obvious how to test a particular hypothesis. Another, so kind of separate from trying to front load risk and front load experiments, is simply just iterating a lot. So you have to get lucky to stumble upon a good idea."},{"start":3025.75,"text":"But you can sort of create luck for yourself just by trying out lots of ideas, by iterating on lots of different ideas. And if you try out an idea and kind of the targeted experiment doesn't work, then you can discard it quickly, try out another idea, and so forth. And for me, there was kind of lots of times in my PhD where I tried out lots of ideas that didn't make it into papers. They failed. And I think that this allowed me to..."},{"start":3054.68,"text":"come upon some ideas that worked well. I didn't always do this. Sometimes I ended up banging my head against the wall plenty of times, but this is something that I found to be a good strategy for trying to iterate and get through the bad ideas quickly so that you can get to some good ideas. And then I think the last thing on this slide is if you can try out lots of ideas, especially at the beginning of the project, you can try out lots of ideas at the beginning and then not commit to any one of them."},{"start":3084.48,"text":"until you see some signs of life on that core unknown. And then if you find signs of life on one of those projects, then you can start to commit to that project after you see some sort of initial result on it. So this is kind of another sort of brute force approach to trying lots of different things so that you can get through the bad ideas. Yeah, so the question is, in problem-driven research, it's a bit more comfortable because you can try out multiple ideas. Are there scenarios where there isn't?"},{"start":3111.96,"text":"There isn't a ton of ideas. And yeah, there's definitely scenarios like that where you may not have tons of ideas for solving a problem. And I should mention that in this sort of approach where you try out lots of different things, you could also be trying out multiple different problems as well."}],"speech_gaps":[],"frame":"../frames/v028/018.webp","frame_time":2984.37},{"title":"前沿问题的探索与实验设计","segments":[{"id":184,"text":"Yeah, you could be trying out a couple ideas for one problem, try out a couple ideas for a different problem, and then pick your problem based on what seems to be tractable. Because even at the outset, you don't know how hard a problem is going to be, and it might be that it's too hard for the scope of a current project, or we don't have good tools or good ideas for how to solve it. Yeah, can I give an example of front-loading a core unknown in a project?","zh":"是的，你可能会为一个问题尝试几种想法，为另一个问题也尝试几种想法，然后根据哪些问题看起来更容易处理来选择你的问题。因为即使一开始，你也不知道一个问题有多难，它可能是当前项目范围太大的问题，或者我们还没有好的工具或好的想法来解决它。是的，我可以举一个在项目中前置核心未知因素的例子吗？","start":3134.24,"end":3160.02},{"id":185,"text":"A couple ideas. So maybe I'll try to give a couple examples. So one example is I worked on meta-learning in the past, and the goal was to see if you can quickly adapt with a very small amount of data to a problem. And the goal was ultimately to be able to get a robot, for example, to quickly adapt to a new task.","zh":"几个想法。所以也许我可以举几个例子。例如，我过去曾研究元学习，目标是看看是否可以用非常少量的数据快速适应一个问题。最终的目标是能够让机器人，例如，快速适应新的任务。","start":3160.86,"end":3183.78},{"id":186,"text":"But actually, designing a meta-learning system on a real robot is a ton of work and would take a lot of work to even just do the coding for it. And so what I did is I first set up an experiment where the tasks, instead of learning...","zh":"但实际上，在真实机器人上设计一个元学习系统是一项巨大的工作，甚至仅仅为其编写代码也需要大量的工作。因此，我首先设置了一个实验，其中任务不是学习……","start":3186.18,"end":3202.1},{"id":187,"text":"Robot tasks, the tasks were regressing to simple 1D sinusoid curves. So really, really simple problem. And then just tested, can you learn with a few data points, like five data points, to regress to the curve? And so it was this experiment that I could code it up in a day and get some initial results from. And it ended up working out pretty well. And so then that gave me the signs of life to try it.","zh":"机器人任务，任务是回归到简单的1D正弦曲线。所以，这是一个真正非常简单的问题。然后只是测试一下，能否用几个数据点，比如五个数据点，来回归到曲线？因此，这是一个我可以一天内编写代码并获得初步结果的实验。结果它表现得相当不错。因此，这给了我一些迹象，让我可以尝试它。","start":3203.48,"end":3231.38},{"id":188,"text":"Another example of this, maybe a more recent example, I've been thinking a little bit about how to get robots to follow different kinds of language instructions, including language instructions for different strategies. And there's a couple risks for this. One is getting good labels for the strategies, and the second is actually getting the robot to pay attention to those different strategies. And that second one actually seemed like the bigger challenge.","zh":"另一个例子，也许是一个更近期的例子，我一直在思考如何让机器人遵循不同类型的语言指令，包括针对不同策略的语言指令。这存在几个风险。一个是获得策略的良好标签，另一个是让机器人真正注意这些不同的策略。而第二个问题实际上看起来是更大的挑战。","start":3233.36,"end":3260.7},{"id":189,"text":"And I took a data set where it was like a really, really simple problem where in some of the data, the robot used the right gripper and some of the data, the robot used the left gripper. And then I trained a policy just to see if it could like do that very simple thing, very easy to evaluate. And I already had, I could like automatically determine if it was using the right or left from the data rather than doing labeling. And so that kind of isolated a core risk of the problem before moving on to like the broader problem of getting a robot to follow strategies.","zh":"我使用了一个数据集，其中包含一个非常简单的问题，在一些数据中，机器人使用了右边的夹爪，而在另一些数据中，机器人使用了左边的夹爪。然后我训练了一个策略，只是为了看看它是否能够完成这个非常简单的事情，而且很容易进行评估。我已经有能力从数据中自动判断机器人使用的是右边还是左边的夹爪，而不是进行人工标注。因此，在转向更广泛的问题，即让机器人遵循策略之前，这种做法帮助我识别出了问题的核心风险。","start":3261.98,"end":3288.4}],"notes":["本段讲授了在强化学习项目中如何通过实验设计来探索核心未知问题。讲者提到，面对复杂问题时，应先通过简单实验验证可行性，再逐步推进。例如，在元学习项目中，讲者首先设计了一个简单的实验，用1D正弦曲线回归来测试模型能否在少量数据下学习，从而验证了方法的可行性。","讲者进一步举例说明了如何通过简单问题来识别和解决核心挑战。例如，在机器人遵循语言指令的项目中，讲者首先设计了一个简单的数据集，其中机器人使用左右夹爪，通过训练策略来判断是否能正确执行任务，从而隔离了核心风险。","讲者强调了实验设计的重要性，特别是在处理复杂问题时，应先通过简单问题验证方法的可行性，再逐步扩展到更复杂的问题。这种方法有助于识别和解决核心挑战，避免在复杂问题上投入过多资源。","讲者提到，在处理机器人遵循策略的问题时，核心挑战是让机器人关注不同的策略。为此，讲者设计了一个简单的实验，通过左右夹爪的使用来验证策略的有效性，从而隔离了核心风险。","讲者还提到，在实验设计中，应尽量使用自动化的评估方法，以减少人工标注的负担。例如，在判断机器人是否使用左右夹爪时，讲者直接从数据中自动判断，而不是手动标注。","讲者强调了在项目初期识别和解决核心未知问题的重要性，这有助于确保项目的可行性和效率。通过先解决简单问题，再逐步扩展到更复杂的问题，可以有效降低项目风险。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3134.24,"end":3288.4,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3134.24,"text":"Yeah, you could be trying out a couple ideas for one problem, try out a couple ideas for a different problem, and then pick your problem based on what seems to be tractable. Because even at the outset, you don't know how hard a problem is going to be, and it might be that it's too hard for the scope of a current project, or we don't have good tools or good ideas for how to solve it. Yeah, can I give an example of front-loading a core unknown in a project?"},{"start":3160.86,"text":"A couple ideas. So maybe I'll try to give a couple examples. So one example is I worked on meta-learning in the past, and the goal was to see if you can quickly adapt with a very small amount of data to a problem. And the goal was ultimately to be able to get a robot, for example, to quickly adapt to a new task."},{"start":3186.18,"text":"But actually, designing a meta-learning system on a real robot is a ton of work and would take a lot of work to even just do the coding for it. And so what I did is I first set up an experiment where the tasks, instead of learning..."},{"start":3203.48,"text":"Robot tasks, the tasks were regressing to simple 1D sinusoid curves. So really, really simple problem. And then just tested, can you learn with a few data points, like five data points, to regress to the curve? And so it was this experiment that I could code it up in a day and get some initial results from. And it ended up working out pretty well. And so then that gave me the signs of life to try it."},{"start":3233.36,"text":"Another example of this, maybe a more recent example, I've been thinking a little bit about how to get robots to follow different kinds of language instructions, including language instructions for different strategies. And there's a couple risks for this. One is getting good labels for the strategies, and the second is actually getting the robot to pay attention to those different strategies. And that second one actually seemed like the bigger challenge."},{"start":3261.98,"text":"And I took a data set where it was like a really, really simple problem where in some of the data, the robot used the right gripper and some of the data, the robot used the left gripper. And then I trained a policy just to see if it could like do that very simple thing, very easy to evaluate. And I already had, I could like automatically determine if it was using the right or left from the data rather than doing labeling. And so that kind of isolated a core risk of the problem before moving on to like the broader problem of getting a robot to follow strategies."}],"speech_gaps":[],"frame":"../frames/v028/019.webp","frame_time":3146.24},{"title":"调试与简化问题","segments":[{"id":190,"text":"Okay, now you have a problem, you have an idea, you want to get things to work. One thing that's really hard in terms of getting something to work is if you're starting with something that doesn't work. So if you code up a system and it's not working, there's a million reasons that could be why it's not working. And it's really hard to figure out which of those things might be causing it to not work. You can make visualizations. There's various tools for trying to figure that out.","zh":"好的，现在你有一个问题，你有一个想法，你想让事情正常运作。在让事情正常运作方面，真正困难的是如果你一开始就是从一个不工作的东西开始的。所以如果你编写了一个系统，但它没有正常工作，可能有成千上万种原因导致它无法正常工作。而且，很难确定是哪些因素导致它无法正常工作。你可以做可视化。有许多工具可以帮助你找出问题所在。","start":3290.72,"end":3317.07},{"id":191,"text":"But it's much easier to start with something that works and then make it harder than to start with something that doesn't work and try to get it to work. And so one thing that's very useful in research is to, if you're in a scenario where things aren't working, simplify the problem dramatically until something does work and then move it back to the harder setting by, for example, adding more data, more tasks, whatever.","zh":"但比起从一个不工作的东西开始并试图让它正常工作，从一个能正常工作的东西开始，然后逐步增加难度要容易得多。因此，在研究中，一个非常有用的策略是：如果你处于一个事情不工作的情境中，可以将问题大幅简化，直到某个部分能够正常工作，然后再逐步回到更困难的设定中，例如添加更多数据、更多任务，等等。","start":3318.16,"end":3338.64},{"id":192,"text":"And, yeah, really useful debugging strategy. And I've seen, yeah, a lot of projects where things aren't working and you just kind of need to go back to the drawing bird.","zh":"确实，这是一个非常有用的调试策略。我见过很多项目，事情不工作时，你往往需要回到最初的起点重新开始。","start":3340.72,"end":3349.02},{"id":193,"text":"Maybe as a very specific example for this, at one point I was trying to train robots to be able to see a video of a human doing a task and then do the task themselves with imitation learning. I collected a really diverse data set of robot demonstrations and then asked a human to do what the robot did of all sorts of tasks. And we just told people collecting the data, do whatever you want, do lots of things. Nothing worked.","zh":"也许作为这个主题的一个非常具体的例子，我曾经尝试训练机器人，使其能够观看人类执行任务的视频，然后通过模仿学习自己完成任务。我收集了一个非常多样化的机器人演示数据集，然后让人类执行机器人所做的各种任务。我们只是告诉数据收集者，做你想做的任何事情，做很多不同的事情。但没有任何东西起作用。","start":3350.58,"end":3378.64},{"id":194,"text":"When training on this data, spent like months trying to get the robot to do it. And then what we did is we simplified to just a single task setting. Like, can we get the robot to do one task? Make sure our imitation learning stack works. It actually didn't work. And so we had to debug that, get it to work on one task, then get it to work on three tasks, then get it to work on 10 tasks. So yeah, starting with a feeling that works really, really helpful.","zh":"在使用这些数据进行训练时，我们花了数月时间试图让机器人完成任务。然后我们采取了简化的方法，只专注于一个任务设定。例如，我们能否让机器人完成一个任务？确保我们的模仿学习堆栈能够正常工作。实际上它并没有起作用，因此我们必须进行调试，使其在单个任务上正常工作，然后再逐步扩展到三个任务，最后扩展到十个任务。因此，从一个能够正常工作的起点确实非常有帮助。","start":3379.26,"end":3406.81},{"id":195,"text":"Simplifying is really helpful for that. Another thing, it's really easy to get in your own head and just have trouble debugging something just by yourself. And so talking to friends, colleagues, advisors can also be helpful and help you figure out whether it makes sense to jump up a level and kind of reconsider the problem or keep on tuning hyperparameters or try something that you didn't think of.","zh":"简化对于这一点真的很有帮助。另外，有时候你很容易陷入自己的思维中，仅仅靠自己就难以调试出问题。因此，与朋友、同事或导师交流也可以有所帮助，可以帮助你判断是否需要跳到更高层次重新考虑问题，还是继续调整超参数，或者尝试一些你之前没有想到的方法。","start":3408.25,"end":3432.18},{"id":196,"text":"And then also revisiting assumptions. So you might go into a project thinking that something is a lot easier than it turned out to be. And then you might learn through the course of the project that that thing is actually really hard. And so thinking through, has anything changed about my assumptions from the beginning? And then if something has changed, would that change the way that you're going about the project or even the project that you're working on as a result? Okay, and then...","zh":"此外，重新审视假设也很重要。你可能在开始一个项目时认为某件事比实际要容易得多。然而，在项目进行过程中，你可能会发现这件事其实非常困难。因此，思考一下，我的假设从一开始有没有发生变化？如果发生了变化，这是否会影响你处理项目的方式，甚至是否会影响你正在从事的项目本身？好的，然后……","start":3432.84,"end":3461.07}],"notes":["本段主要讲解了在强化学习研究中，调试失败系统时的策略。讲者指出，从一个不工作的系统开始调试非常困难，因为可能有无数个原因导致系统不工作，而难以确定具体原因。因此，更有效的方法是从一个能工作的系统开始，逐步增加复杂度。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3290.72,"end":3461.07,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3290.72,"text":"Okay, now you have a problem, you have an idea, you want to get things to work. One thing that's really hard in terms of getting something to work is if you're starting with something that doesn't work. So if you code up a system and it's not working, there's a million reasons that could be why it's not working. And it's really hard to figure out which of those things might be causing it to not work. You can make visualizations. There's various tools for trying to figure that out."},{"start":3318.16,"text":"But it's much easier to start with something that works and then make it harder than to start with something that doesn't work and try to get it to work. And so one thing that's very useful in research is to, if you're in a scenario where things aren't working, simplify the problem dramatically until something does work and then move it back to the harder setting by, for example, adding more data, more tasks, whatever."},{"start":3340.72,"text":"And, yeah, really useful debugging strategy. And I've seen, yeah, a lot of projects where things aren't working and you just kind of need to go back to the drawing bird."},{"start":3350.58,"text":"Maybe as a very specific example for this, at one point I was trying to train robots to be able to see a video of a human doing a task and then do the task themselves with imitation learning. I collected a really diverse data set of robot demonstrations and then asked a human to do what the robot did of all sorts of tasks. And we just told people collecting the data, do whatever you want, do lots of things. Nothing worked."},{"start":3379.26,"text":"When training on this data, spent like months trying to get the robot to do it. And then what we did is we simplified to just a single task setting. Like, can we get the robot to do one task? Make sure our imitation learning stack works. It actually didn't work. And so we had to debug that, get it to work on one task, then get it to work on three tasks, then get it to work on 10 tasks. So yeah, starting with a feeling that works really, really helpful."},{"start":3408.25,"text":"Simplifying is really helpful for that. Another thing, it's really easy to get in your own head and just have trouble debugging something just by yourself. And so talking to friends, colleagues, advisors can also be helpful and help you figure out whether it makes sense to jump up a level and kind of reconsider the problem or keep on tuning hyperparameters or try something that you didn't think of."},{"start":3432.84,"text":"And then also revisiting assumptions. So you might go into a project thinking that something is a lot easier than it turned out to be. And then you might learn through the course of the project that that thing is actually really hard. And so thinking through, has anything changed about my assumptions from the beginning? And then if something has changed, would that change the way that you're going about the project or even the project that you're working on as a result? Okay, and then..."}],"speech_gaps":[],"frame":"../frames/v028/020.webp","frame_time":3302.72},{"title":"项目范围调整与研究策略","segments":[{"id":197,"text":"Maybe I'll also talk about a story for this. So there's scenarios where you're kind of trying to get something to work and it doesn't really want to work. It's not really easy to get it to work. And if it doesn't really want to work, then probably the idea won't be very impactful because if someone else is trying to get it to work and it also doesn't really easily work for them, then maybe the idea just wasn't really meant to be.","zh":"也许我还会讲一个故事。有一些场景，你试图让某件事运作，但它似乎并不愿意运作。这并不容易让它运作。如果它不愿意运作，那么这个想法可能不会很有影响力，因为如果其他人也试图让它运作，但同样难以运作，那么也许这个想法本来就不应该存在。","start":3462.31,"end":3487.43},{"id":198,"text":"And at one point we had this project where this is actually a fairly recent project where we were trying to get a robot to follow open-ended language commands. And like, can you clean up the trash but not the dishes? We also wanted to see if the robot could handle various interventions and follow lots of different prompts, for example. Then we kind of got some initial signs of life on that. And we're like, oh, well, maybe we could also get the robot to ask questions if the prompt is ambiguous.","zh":"在某个时候，我们有一个项目，这实际上是一个相当近期的项目，我们试图让机器人遵循开放式的语言指令。例如，可以清理垃圾但不清理餐具？我们还想看看机器人是否能够处理各种干预，并遵循大量的不同提示，例如。然后我们得到了一些初步的迹象表明它可能有效。我们想，哦，也许我们也可以让机器人在提示模糊时提出问题。","start":3488.75,"end":3516.79},{"id":199,"text":"And we had all these kind of cool ideas for how we could incorporate this sort of open-ended language following in a robot system. And despite having kind of positive initial signs of life, after we introduced all those ideas, things weren't really working. And we kind of tried all sorts of... I don't know, we spent a couple months trying to get it to work.","zh":"我们有许多关于如何将这种开放式的语言遵循整合进机器人系统中的酷炫想法。尽管有初步的积极迹象，但在我们引入了所有这些想法之后，事情并没有真正运作起来。我们尝试了各种方法……我不知道，我们花了几个月的时间试图让它运作起来。","start":3517.51,"end":3545.3},{"id":200,"text":"thought about, well, it was working before. What parts of this thing do work and what parts of these things are harder to get to work with our current method? And then we kind of re-scoped the project to remove the hard parts that we didn't know how to solve yet and to only consider the parts, the kind of interactions that our method did work with.","zh":"我们思考了，它之前是能运作的。这个系统中哪些部分能运作，哪些部分很难用我们当前的方法让它运作？然后我们重新定义了项目的范围，去掉了我们还不知道如何解决的困难部分，只考虑那些我们的方法能够有效运作的部分和交互。","start":3546.35,"end":3568.87},{"id":201,"text":"It was an example where we picked the examples, we scoped the project to the source of things that the method wanted to work on, work easily on, and left the things that it didn't handle for future work. We described it as limitations in the paper. And so scoping down the project, especially if you kind of scoped it up a little bit too eagerly, can also be a useful strategy in research. Okay, last thing.","zh":"这是一个例子，我们挑选了例子，将项目范围限定在方法想要运作、容易运作的内容上，而将那些方法无法处理的内容留到未来的工作中。我们在论文中将这些描述为局限性。因此，缩小项目的范围，尤其是当你最初
