<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 18 深度强化学习前沿（Frontiers）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 18 深度强化学习前沿（Frontiers） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v028.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v028","title":"Lecture 18 深度强化学习前沿（Frontiers）","course":"强化学习","pages":[{"title":"深度强化学习的开放问题与前沿","segments":[{"id":0,"text":"I decided to cover both open problems in deep reinforcement learning and how to do deep RL research. Cool. So let's start with part one, talking about open problems and frontiers in deep reinforcement learning. I'm going to break this into a few different categories. The first is challenges on defining the problem setup. The second is challenges in methods. And the third is challenges in deployment and evaluation.","zh":"我决定同时涵盖深度强化学习中的开放问题以及如何进行深度强化学习研究。很好。那么我们先从第一部分开始，讨论深度强化学习中的开放问题和前沿。我将把这个内容分成几个不同的类别。第一个是关于定义问题设置的挑战。第二个是方法上的挑战。第三个是部署和评估方面的挑战。","start":5.26,"end":31.86},{"id":1,"text":"I should also mention that this will not be exhaustive. There's many problems and many open challenges in deep reinforcement learning. I'm just picking out some of the ones that I think I've either gotten questions about quite a bit or some of the problems that I think are the most exciting and the most interesting.","zh":"我还需要说明，这不会是详尽的。深度强化学习中存在许多问题和许多开放的挑战。我只是挑选了一些我认为要么被问及很多次，要么我认为最令人兴奋和最有趣的问题。","start":32.86,"end":51.42},{"id":2,"text":"Cool. So let's dive in. And in particular, in terms of some of the challenges and how we set up the deep RL problem, we've seen a lot of successes in domains like games, math reasoning, coding problems, where you can very easily define the reward. You can very easily verify whether or not the reinforcement learning system did the correct thing, which is great.","zh":"很好。那么我们深入探讨一下。特别是在一些挑战和如何设置深度强化学习问题方面，我们在像游戏、数学推理、编程问题等领域看到了很多成功。你可以在这些领域非常容易地定义奖励。你也可以非常容易地验证强化学习系统是否正确地执行了任务，这非常好。","start":53.16,"end":76.1},{"id":3,"text":"But in many real-world scenarios, rewards don't exist or rewards are very delayed. And this introduces challenges in the typical problem setting.","zh":"但在许多现实世界场景中，奖励并不存在或奖励非常延迟。这引入了典型问题设置中的挑战。","start":76.81,"end":89.41},{"id":4,"text":"And so, for example, let's think about language models for chatbots.","zh":"因此，例如，让我们考虑聊天机器人的语言模型。","start":90.39,"end":94.47},{"id":5,"text":"Right now, we have preference optimization.","zh":"目前，我们有偏好优化。","start":95.47,"end":98.63},{"id":6,"text":"And one might actually say that preference optimization for chatbots seems to work quite well.","zh":"有人可能会说，聊天机器人的偏好优化似乎效果相当不错。","start":98.73,"end":103.55},{"id":7,"text":"We're able to actually deploy reinforcement learning at scale.","zh":"我们实际上能够大规模部署强化学习。","start":103.69,"end":106.33},{"id":8,"text":"There's actually pretty big problems with preference optimization.","zh":"实际上，偏好优化存在相当大的问题。","start":107.09,"end":111.75},{"id":9,"text":"And as one example, there is this research paper by Sharma and Tong","zh":"例如，Sharma 和 Tong 的一篇研究论文","start":112.21,"end":115.73},{"id":10,"text":"that was evaluating what preferences people are giving.","zh":"评估了人们给出的偏好。","start":115.73,"end":121.69},{"id":11,"text":"And the x-axis is the probability that a response with a given feature","zh":"并且，x 轴是当其他条件相同时，具有特定特征的响应被偏好的概率。","start":121.87,"end":127.65},{"id":12,"text":"is preferred when all else is equal.","zh":"并且，左轴上显示了不同的内容。","start":127.65,"end":130.07},{"id":13,"text":"And there's different things here on the left axis.","zh":"在人类偏好中，最受偏好的是人类是否同意某事，以及是否","start":131.07,"end":134.93},{"id":14,"text":"And the things that were most preferred in the human preferences","zh":"是否","start":136.07,"end":140.25},{"id":15,"text":"preferences were whether it was something that the human agreed with and whether or not the","zh":"偏好是人类是否同意以及是否","start":140.25,"end":147.29},{"id":16,"text":"response was confident. So essentially, the things that people are giving preferences for are whether","zh":"回答显得很自信。因此，人们所偏好的事情是，语言模型的回答是否自信地表达了某种内容","start":147.29,"end":152.59},{"id":17,"text":"or not the language model response is something that's confidently saying something and whether","zh":"以及该内容是否与说话者的想法一致。然后，这里所提到的是事实性","start":152.59,"end":158.53},{"id":18,"text":"that thing that it's saying agrees with what the person thinks. And then all the way down here","zh":"所以他们实际上更关心的是回答是否自信，而不是回答是否正确或真实","start":158.53,"end":163.61},{"id":19,"text":"is factuality. So they're actually caring about whether it's confident more than whether or not","zh":"因此，人们实际上并没有给出好的偏好。可以说，我认为我们希望语言模型更重视","start":163.61,"end":169.09},{"id":20,"text":"the response is actually correct or true. So people aren't actually giving good","zh":"事实性，而不是像自信这样的因素，而我们则更倾向于优化","start":169.09,"end":174.91},{"id":21,"text":"preferences. Arguably, I think we would want language models to be valuing","zh":"那些因素","start":174.91,"end":180.05},{"id":22,"text":"factuality over things like confidence, and we're more optimizing for what","zh":"事实性胜过诸如置信度之类的东西，而我们更优化的是什么","start":180.05,"end":184.47}],"notes":["本段讨论了在深度强化学习中，如何定义问题设置的挑战。讲者指出，在像游戏、数学推理和编程问题等环境中，奖励函数可以很容易地定义和验证，但在现实世界场景中，奖励可能不存在或延迟，这给问题设置带来了挑战。","讲者提到，语言模型在聊天机器人中的应用中，偏好优化似乎有效，但存在重大问题。例如，Sharma和Tong的研究表明，人类偏好更关注响应的自信程度和是否与人类观点一致，而不是事实性。","这表明当前的偏好优化方法可能没有正确地引导语言模型关注事实性，而更倾向于优化自信度。讲者认为，我们应更重视事实性，而不是自信度。","讲者指出，偏好优化的挑战在于，人类的偏好可能并不理想，因此需要更有效的机制来引导模型学习更符合事实性的行为。","这一段强调了在实际应用中，如何定义和评估奖励函数的重要性，以及当前方法在现实场景中的局限性。","讲者通过具体例子说明了偏好优化的不足，指出需要改进以更好地对齐模型与人类的期望。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":184.47,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":5.26,"text":"I decided to cover both open problems in deep reinforcement learning and how to do deep RL research. Cool. So let's start with part one, talking about open problems and frontiers in deep reinforcement learning. I'm going to break this into a few different categories. The first is challenges on defining the problem setup. The second is challenges in methods. And the third is challenges in deployment and evaluation."},{"start":32.86,"text":"I should also mention that this will not be exhaustive. There's many problems and many open challenges in deep reinforcement learning. I'm just picking out some of the ones that I think I've either gotten questions about quite a bit or some of the problems that I think are the most exciting and the most interesting."},{"start":53.16,"text":"Cool. So let's dive in. And in particular, in terms of some of the challenges and how we set up the deep RL problem, we've seen a lot of successes in domains like games, math reasoning, coding problems, where you can very easily define the reward. You can very easily verify whether or not the reinforcement learning system did the correct thing, which is great."},{"start":76.81,"text":"But in many real-world scenarios, rewards don't exist or rewards are very delayed. And this introduces challenges in the typical problem setting."},{"start":90.39,"text":"And so, for example, let's think about language models for chatbots."},{"start":95.47,"text":"Right now, we have preference optimization."},{"start":98.73,"text":"And one might actually say that preference optimization for chatbots seems to work quite well."},{"start":103.69,"text":"We're able to actually deploy reinforcement learning at scale."},{"start":107.09,"text":"There's actually pretty big problems with preference optimization."},{"start":112.21,"text":"And as one example, there is this research paper by Sharma and Tong"},{"start":115.73,"text":"that was evaluating what preferences people are giving."},{"start":121.87,"text":"And the x-axis is the probability that a response with a given feature"},{"start":127.65,"text":"is preferred when all else is equal."},{"start":131.07,"text":"And there's different things here on the left axis."},{"start":136.07,"text":"And the things that were most preferred in the human preferences"},{"start":140.25,"text":"preferences were whether it was something that the human agreed with and whether or not the"},{"start":147.29,"text":"response was confident. So essentially, the things that people are giving preferences for are whether"},{"start":152.59,"text":"or not the language model response is something that's confidently saying something and whether"},{"start":158.53,"text":"that thing that it's saying agrees with what the person thinks. And then all the way down here"},{"start":163.61,"text":"is factuality. So they're actually caring about whether it's confident more than whether or not"},{"start":169.09,"text":"the response is actually correct or true. So people aren't actually giving good"},{"start":174.91,"text":"preferences. Arguably, I think we would want language models to be valuing"},{"start":180.05,"text":"factuality over things like confidence, and we're more optimizing for what"}],"speech_gaps":[],"frame":"../frames/v028/001.webp","frame_time":17.259999999999998},{"title":"深度强化学习前沿中的奖励定义与优化挑战","segments":[{"id":23,"text":"people kind of want to hear rather than the kinds of responses that will be good.","zh":"人们更倾向于听到那些他们想要听的内容，而不是那些会带来好处的回应。","start":184.47,"end":189.67},{"id":24,"text":"Now, if you also think about preference optimization for personalization, for example, we might want to develop language models that are kind of telling people what they want to hear and the kinds of recommendations, for example, that are closely personalized to their interests and their beliefs.","zh":"再考虑一下用于个性化偏好的优化，例如，我们可能希望开发出能够告诉人们他们想听的内容以及更贴近他们兴趣和信念的推荐系统。","start":192.22,"end":208.16},{"id":25,"text":"But on the flip side, if we personalize these kinds of models for the many people that use these models, then it might lead to polarization and people who, for example, have extreme beliefs rather than being exposed to a wide range of beliefs. And so even something like personalization may not intrinsically be what we want to optimize for.","zh":"但另一方面，如果我们为使用这些模型的众多用户定制这些模型，可能会导致偏见，例如，人们可能只接触到极端的观点，而不是广泛的观点。因此，即使是个性化，也可能并不内在地是我们想要优化的目标。","start":208.88,"end":227.5},{"id":26,"text":"And at the end of the day, there's typically multiple things that we do care about optimizing for, and balancing those different objectives that may actually compete with each other ends up being a very challenging problem. So this whole kind of realm of how do we define rewards and the kind of objective as a whole for language models is, in many ways, there's a lot of progress, but it's still a really challenging problem.","zh":"归根结底，我们通常关心优化多个方面，而平衡这些可能相互竞争的目标，最终成为一个非常具有挑战性的问题。因此，关于如何定义语言模型的奖励以及整体目标的这一领域，在许多方面已经取得了很大进展，但仍然是一个非常具有挑战性的问题。","start":228.55,"end":253.73},{"id":27,"text":"Separate from language models, there's also robotics. Right now, in robotics, either you have binary rewards in the real world, or if in simulation, you might have hand-shaped rewards where you define different terms for what you want. This takes a lot of effort, ends up being fairly challenging, or takes a lot of labeling annotations.","zh":"除了语言模型之外，还有机器人领域。目前，在现实世界中，机器人通常使用二元奖励，或者在仿真环境中，你可能会定义不同术语的手工设计奖励。这需要大量努力，最终成为一个相当具有挑战性的问题，或者需要大量的标注工作。","start":257.44,"end":276.84},{"id":28,"text":"And even then, even when you have human annotations, it can be tricky to judge rewards. And so, for example, if you were to look at these shirts that were each folded by a robot, if you were to think about which shirt was folded the best or try to give rewards for these shirt folds, it's really tricky to figure out how you might reward different mistakes, like different amounts of crinkleness, kind of whether or not the shirt is off-center or not.","zh":"即使在这种情况下，即使你有来自人类的标注，判断奖励也可能很困难。例如，如果你观察到这些由机器人折叠的衬衫，思考哪一件衬衫折叠得最好，或者为这些衬衫的折叠给予奖励，就很难判断如何奖励不同的错误，例如不同的褶皱程度，或者衬衫是否偏心。","start":277.67,"end":305.89},{"id":29,"text":"It's generally a very ambiguous problem and hard even for people to think about how to provide rewards for these systems. Another example, let's think about YouTube recommendations. What I mean here is when you're on YouTube, there's recommendations for a next video to watch after watching your current video. And these recommendations are, there's an algorithm that kind of selects what these recommendations should be.","zh":"这通常是一个非常模糊的问题，甚至让人们难以思考如何为这些系统提供奖励。另一个例子，让我们想想YouTube的推荐系统。我的意思是，当你在YouTube上观看完当前视频后，系统会推荐下一个视频给你观看。而这些推荐是通过一个算法来选择应该推荐什么内容。","start":307.04,"end":335.84},{"id":30,"text":"Now, we don't have exact details on how this algorithm works, but there was a research paper that actually was talking a little bit about how they do these recommendations. And as you might expect, when they do these recommendations, they want to optimize for engagement, which is like whether or not you actually clicked on the recommendation. And if you clicked on the recommendation, that was probably a good recommendation. And also satisfaction, which is that after you clicked on that, if you actually liked the video,","zh":"现在，我们并不清楚这个算法具体是如何工作的，但有一篇研究论文实际上谈到了他们是如何进行这些推荐的。正如你可能预期的那样，当他们进行这些推荐时，他们希望优化用户的参与度，也就是你是否点击了推荐内容。如果你点击了推荐内容，那可能是一个好的推荐。此外，还有满意度，即在你点击之后，你是否真正喜欢这个视频。","start":337.26,"end":364.0}],"notes":["本段讨论了在深度强化学习中，如何定义奖励函数和整体优化目标的挑战。讲者指出，语言模型的个性化推荐可能带来偏见和极化问题，因此需要在多个目标之间进行权衡。这涉及如何平衡不同优化目标，如个性化与多样性，以及如何设计有效的奖励机制。","讲者提到，即使在机器人领域，定义奖励函数也是一项困难的任务。例如，在机器人折叠衣物的任务中，如何量化衣物折叠的质量（如褶皱程度、是否居中）是一个模糊且难以判断的问题。这表明，奖励函数的设计需要考虑实际任务的复杂性。","在YouTube推荐系统中，讲者指出推荐算法的目标是优化用户参与度（如点击率）和满意度（如用户是否喜欢推荐的视频）。这说明，推荐系统的设计需要综合考虑多个目标，并且这些目标之间可能存在冲突。","讲者强调，奖励函数的设计不仅需要考虑任务的具体要求，还需要考虑如何平衡不同目标之间的关系。例如，在语言模型中，个性化推荐可能带来偏见，而在机器人任务中，如何量化任务完成度也是一个挑战。","讲者指出，奖励函数的设计是一个高度模糊的问题，即使对于人类来说也难以准确判断。这表明，设计有效的奖励函数需要深入理解任务的本质，并结合实际应用场景进行调整。","讲者提到，尽管在某些领域（如语言模型和推荐系统）已经取得了一定进展，但如何定义和优化奖励函数仍然是一个具有挑战性的问题。这表明，奖励函数的设计仍然是深度强化学习研究中的一个重要课题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":184.47,"end":364.0,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":184.47,"text":"people kind of want to hear rather than the kinds of responses that will be good."},{"start":192.22,"text":"Now, if you also think about preference optimization for personalization, for example, we might want to develop language models that are kind of telling people what they want to hear and the kinds of recommendations, for example, that are closely personalized to their interests and their beliefs."},{"start":208.88,"text":"But on the flip side, if we personalize these kinds of models for the many people that use these models, then it might lead to polarization and people who, for example, have extreme beliefs rather than being exposed to a wide range of beliefs. And so even something like personalization may not intrinsically be what we want to optimize for."},{"start":228.55,"text":"And at the end of the day, there's typically multiple things that we do care about optimizing for, and balancing those different objectives that may actually compete with each other ends up being a very challenging problem. So this whole kind of realm of how do we define rewards and the kind of objective as a whole for language models is, in many ways, there's a lot of progress, but it's still a really challenging problem."},{"start":257.44,"text":"Separate from language models, there's also robotics. Right now, in robotics, either you have binary rewards in the real world, or if in simulation, you might have hand-shaped rewards where you define different terms for what you want. This takes a lot of effort, ends up being fairly challenging, or takes a lot of labeling annotations."},{"start":277.67,"text":"And even then, even when you have human annotations, it can be tricky to judge rewards. And so, for example, if you were to look at these shirts that were each folded by a robot, if you were to think about which shirt was folded the best or try to give rewards for these shirt folds, it's really tricky to figure out how you might reward different mistakes, like different amounts of crinkleness, kind of whether or not the shirt is off-center or not."},{"start":307.04,"text":"It's generally a very ambiguous problem and hard even for people to think about how to provide rewards for these systems. Another example, let's think about YouTube recommendations. What I mean here is when you're on YouTube, there's recommendations for a next video to watch after watching your current video. And these recommendations are, there's an algorithm that kind of selects what these recommendations should be."},{"start":337.26,"text":"Now, we don't have exact details on how this algorithm works, but there was a research paper that actually was talking a little bit about how they do these recommendations. And as you might expect, when they do these recommendations, they want to optimize for engagement, which is like whether or not you actually clicked on the recommendation. And if you clicked on the recommendation, that was probably a good recommendation. And also satisfaction, which is that after you clicked on that, if you actually liked the video,"}],"speech_gaps":[],"frame":"../frames/v028/002.webp","frame_time":196.47},{"title":"深度强化学习中的奖励函数设计与先验知识利用","segments":[{"id":31,"text":"then that's also a good sign that it was a good recommendation. So this all seems reasonable. But another thing that was mentioned in the research paper was that the combination of these metrics for the reward function was actually manually tuned by a person rather than something that is designed automatically.","zh":"那么这也是一个好迹象，说明这个推荐是好的。所以这一切看起来都很合理。但研究论文中还提到，这些指标的组合实际上是由一个人手动调整的，而不是自动设计的。","start":364.7,"end":384.96},{"id":32,"text":"This kind of also goes to show kind of the challenge in actually defining these kinds of reward functions when we don't know how best to balance these kinds of objectives. We talked a bit about math reasoning. If we want to take those advances and apply them to broader scientific experimentation and reasoning, you often don't necessarily know what the final answer should be.","zh":"这也表明了在我们不知道如何最好地平衡这些目标时，实际上定义这些类型的奖励函数所面临的挑战。我们之前谈到了数学推理。如果我们想要将这些进展应用于更广泛的科学实验和推理，通常你并不一定知道最终的答案应该是什么。","start":385.95,"end":411.04},{"id":33,"text":"And so even training on math reasoning, you might see some transfer to scientific reasoning. But if you want to train on a broader set of scientific reasoning problems, this sort of verification becomes challenging. And the last thing I'll mention along these sorts of rewards and verification is that if we think about how humans learn.","zh":"因此，即使在数学推理上进行训练，你可能会看到一些向科学推理的迁移。但如果你想在更广泛的科学推理问题上进行训练，这种验证就变得具有挑战性了。沿着这些奖励和验证的最后一点是，如果我们思考人类是如何学习的。","start":412.23,"end":431.37},{"id":34,"text":"Humans often learn by like rolling around on the floor, playing with random toys. And it seems like they're not just optimizing for one particular task. They're optimizing, well, who knows what they're optimizing for? Maybe machines could, for example, we could develop algorithms that would allow machines to explore in this way, potentially optimizing for learning, potentially optimizing for exploration. And this is certainly an open problem.","zh":"人类通常通过在地上打滚、玩随机玩具来学习。看起来他们并不是仅仅为了完成一个特定任务而优化。他们优化的是什么呢？也许机器也可以，例如，我们可以开发算法，让机器以这种方式进行探索，潜在地优化学习，潜在地优化探索。这当然是一个开放性问题。","start":432.74,"end":459.2},{"id":35,"text":"Cool. So that's on the problem setup. Now let's talk a little bit about challenges on the method side. So the first topic I wanted to bring up was leveraging prior data or knowledge.","zh":"好，这就是问题设置。现在让我们稍微谈谈方法上的挑战。我想首先提到的是利用先验数据或知识。","start":460.59,"end":475.22},{"id":36,"text":"So there's a lot of circumstances where we're not starting reinforcement learning from scratch, and we have some prior data, some prior knowledge about what is best to explore. And the default tool for leveraging previous knowledge and data is to use pre-trained model weights or to initialize your replay buffer with any previous data that you have. But this tool doesn't extend to all sorts of scenarios we might care about.","zh":"在很多情况下，我们并不是从头开始进行强化学习，而是有一些先验数据，一些关于什么是最值得探索的先验知识。利用先前知识和数据的默认工具是使用预训练的模型权重，或者用你拥有的任何先前数据初始化你的经验回放缓冲区。但这种工具并不适用于我们可能关心的所有场景。","start":475.87,"end":500.99},{"id":37,"text":"There might be scenarios where we have more abstract prior knowledge. Maybe we have some knowledge that we read from news articles that isn't kind of in the typical data format. We want to incorporate those facts into our model. Maybe we have some hints that could be helpful for solving a problem. And even separate from that, if we think about this kind of paradigm of using pre-training and initialized datasets, there's scenarios where this might actually be too constraining.","zh":"可能存在一些场景，我们拥有更加抽象的先验知识。也许我们从新闻文章中读取了一些知识，这些知识并不属于典型的数据库格式。我们希望将这些事实纳入我们的模型中。也许我们有一些提示，这些提示对于解决问题可能是有帮助的。此外，如果我们考虑这种使用预训练和初始化数据集的范式，也存在一些场景，这种做法实际上可能过于限制。","start":501.69,"end":530.92}],"notes":["本段讨论了在设计奖励函数时面临的挑战，特别是在不知道如何平衡不同目标的情况下。讲者提到，即使在数学推理领域取得进展，将其应用于更广泛的科学实验和推理时，也常常不清楚最终答案是什么。","讲者进一步指出，即使在数学推理训练中，也可能看到向科学推理的迁移，但若要训练更广泛的科学推理问题，这种验证变得具有挑战性。这表明在设计奖励函数时，需要考虑如何有效评估模型的表现。","讲者通过人类学习的方式，强调了探索的重要性。人类通常通过随机玩耍和探索来学习，而不是专注于单一任务。这暗示了机器学习系统可能需要类似的方法，以促进更全面的学习。","讲者提到，开发允许机器以类似方式探索的算法是一个开放性问题，这表明在强化学习中，探索与利用的平衡仍然是一个重要的研究方向。","在方法层面，讲者讨论了利用先验数据和知识的挑战。虽然使用预训练模型权重或初始化回放缓冲区是常见的做法，但这种方法并不适用于所有场景。","讲者指出，当存在更抽象的先验知识时，例如从新闻文章中获取的信息，这些信息可能不符合典型的数据格式，需要被整合到模型中。此外，使用预训练和初始化数据集的范式可能在某些情况下过于限制。"],"formulas":[],"uncertainties":[],"diagram":"none","start":364.7,"end":530.92,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":364.7,"text":"then that's also a good sign that it was a good recommendation. So this all seems reasonable. But another thing that was mentioned in the research paper was that the combination of these metrics for the reward function was actually manually tuned by a person rather than something that is designed automatically."},{"start":385.95,"text":"This kind of also goes to show kind of the challenge in actually defining these kinds of reward functions when we don't know how best to balance these kinds of objectives. We talked a bit about math reasoning. If we want to take those advances and apply them to broader scientific experimentation and reasoning, you often don't necessarily know what the final answer should be."},{"start":412.23,"text":"And so even training on math reasoning, you might see some transfer to scientific reasoning. But if you want to train on a broader set of scientific reasoning problems, this sort of verification becomes challenging. And the last thing I'll mention along these sorts of rewards and verification is that if we think about how humans learn."},{"start":432.74,"text":"Humans often learn by like rolling around on the floor, playing with random toys. And it seems like they're not just optimizing for one particular task. They're optimizing, well, who knows what they're optimizing for? Maybe machines could, for example, we could develop algorithms that would allow machines to explore in this way, potentially optimizing for learning, potentially optimizing for exploration. And this is certainly an open problem."},{"start":460.59,"text":"Cool. So that's on the problem setup. Now let's talk a little bit about challenges on the method side. So the first topic I wanted to bring up was leveraging prior data or knowledge."},{"start":475.87,"text":"So there's a lot of circumstances where we're not starting reinforcement learning from scratch, and we have some prior data, some prior knowledge about what is best to explore. And the default tool for leveraging previous knowledge and data is to use pre-trained model weights or to initialize your replay buffer with any previous data that you have. But this tool doesn't extend to all sorts of scenarios we might care about."},{"start":501.69,"text":"There might be scenarios where we have more abstract prior knowledge. Maybe we have some knowledge that we read from news articles that isn't kind of in the typical data format. We want to incorporate those facts into our model. Maybe we have some hints that could be helpful for solving a problem. And even separate from that, if we think about this kind of paradigm of using pre-training and initialized datasets, there's scenarios where this might actually be too constraining."}],"speech_gaps":[],"frame":"../frames/v028/003.webp","frame_time":376.7},{"title":"深度强化学习前沿：预训练模型的限制与世界模型的应用","segments":[{"id":38,"text":"And so as one example, here's a research paper by Baladon in 2023. And they introduced a method that was studying using prior demonstration data with reinforcement learning. And the method that they introduced, they initialized the buffer, but they actually didn't pre-train the weights. And they found that pre-training the weights did worse than not pre-training the weights. And so this kind of suggests that there might be scenarios where","zh":"因此，举一个例子，这里有一篇2023年由Baladon发表的研究论文。他们介绍了一种方法，该方法利用先前的演示数据进行强化学习研究。他们提出的方法是初始化缓冲区，但实际上并没有预训练权重。他们发现，预训练权重的表现比不预训练权重要差。因此，这表明可能存在某些场景，","start":531.96,"end":560.42},{"id":39,"text":"using kind of pre-trained weights or using pre-trained data sets might actually be too constraining on our model. As one example of this, if you have a pre-trained model, the output layer of that pre-trained model might have converged to something fairly deterministic. And then if you're trying to learn something new or adapt it in a new way, then that last layer might not actually be exploring in a good way.","zh":"使用预训练权重或预训练数据集实际上可能会对我们的模型产生过度的限制。举一个例子，如果你有一个预训练模型，该模型的输出层可能已经收敛到一个相当确定性的状态。然后，当你试图学习新事物或以新方式适应时，最后一层可能无法很好地进行探索。","start":561.54,"end":586.68},{"id":40,"text":"So that's one example of why you might see worse performance if you initialize your weights with some previous neural network. And arguably, in language models, perhaps reinforcement learning works quite well because pre-trained models often have a very diverse distribution over output tokens.","zh":"因此，这就是为什么如果你用先前的神经网络初始化权重，可能会看到更差的表现的一个例子。可以认为，在语言模型中，强化学习可能效果相当好，因为预训练模型通常在输出标记上具有非常多样化的分布。","start":587.18,"end":606.55},{"id":41,"text":"In terms of leveraging prior data and knowledge and also being able to go beyond it, I think that this question is really important for thinking about how language models can solve problems that humans haven't solved. Because they probably should build upon the knowledge in the pre-trained data sets, but they also need to think about how to go beyond that and not be too constrained by what the pre-trained model might say. And it's also quite useful for thinking about how robots or autonomous vehicles might learn how to do things.","zh":"就利用先前数据和知识以及超越这些知识而言，我认为这个问题对于思考语言模型如何解决人类尚未解决的问题非常重要。因为它们应该基于预训练数据集中的知识进行构建，但同时也需要思考如何超越这些知识，不要过于受预训练模型可能表达的内容所限制。这同样对于思考机器人或自动驾驶汽车如何学习执行任务也很有帮助。","start":609.61,"end":637.86},{"id":42,"text":"faster and more reliably than what humans do. And perhaps if we constrain too much to the pre-trained knowledge or the prior knowledge, then they might not be able to surpass human abilities in terms of speed or reliability.","zh":"比人类做得更快、更可靠。也许如果我们过于受限于预训练知识或先前知识，它们可能无法在速度或可靠性方面超越人类的能力。","start":638.31,"end":651.69},{"id":43,"text":"So I think generally these two questions are really fascinating and things that we've seen some suggestions that reinforcement learning can do this. And it's certainly one of the most promising tools for going beyond what humans can do. But lots of interesting and open work to do there. Now, one question I've gotten quite a bit is whether we can leverage world models and video generation models for robotics and control.","zh":"因此，我认为这两个问题非常有趣，我们已经看到一些关于强化学习可以做到这一点的建议。这无疑是超越人类能力的最有希望的工具之一。但在这些领域还有很多有趣且开放的研究工作要做。现在，我收到很多关于是否可以利用世界模型和视频生成模型用于机器人和控制的问题。","start":652.94,"end":680.81},{"id":44,"text":"And we've seen some really impressive results, especially recently from video generation models, where they clearly have a lot of rich knowledge about the world, like how cooking on a stove works, how typing on a keyboard works, and how that might look like if the keyboard was made of gummy bears, and also how things like even walking at an abstract level work. And so it seems like this word knowledge should be really useful for learning behavior.","zh":"我们已经看到一些非常令人印象深刻的结果，尤其是最近来自视频生成模型的结果，它们显然对世界有丰富的知识，例如如何在炉子上烹饪，如何在键盘上打字，以及如果键盘是由软糖制成的话，那会是什么样子，还有像抽象层面的行走这样的事情。因此，这种世界知识应该对学习行为非常有用。","start":681.33,"end":709.0}],"notes":["本段讨论了预训练模型在强化学习中的潜在限制，指出预训练权重或数据集可能对模型造成约束，特别是在尝试学习新任务或适应新方式时，输出层可能过于确定性，无法有效探索。这表明在某些情况下，不进行预训练可能反而更优。","讲者进一步指出，语言模型可能因为预训练模型在输出标记上的分布多样性而表现良好，但机器人或自动驾驶系统如果过度依赖预训练知识，可能无法超越人类在速度和可靠性方面的表现。","讲者强调了两个关键问题：如何利用已有数据和知识，同时又能超越它们，以及如何让系统在不被预训练模型限制的情况下进行创新。这在解决人类尚未解决的问题时尤为重要。","讲者提到，世界模型和视频生成模型在机器人和控制领域展现出巨大潜力，特别是它们对世界运作方式的丰富理解，如烹饪、打字等行为，甚至抽象概念如行走，都可能对行为学习产生重要影响。","讲者指出，视频生成模型在最近的成果中表现出对世界知识的深刻理解，这表明这些模型可以为学习行为提供有价值的指导。","最后，讲者提到世界模型和视频生成模型在机器人和控制领域的应用前景广阔，但仍有大量开放性问题需要研究。"],"formulas":[],"uncertainties":[],"diagram":"none","start":531.96,"end":709.0,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":531.96,"text":"And so as one example, here's a research paper by Baladon in 2023. And they introduced a method that was studying using prior demonstration data with reinforcement learning. And the method that they introduced, they initialized the buffer, but they actually didn't pre-train the weights. And they found that pre-training the weights did worse than not pre-training the weights. And so this kind of suggests that there might be scenarios where"},{"start":561.54,"text":"using kind of pre-trained weights or using pre-trained data sets might actually be too constraining on our model. As one example of this, if you have a pre-trained model, the output layer of that pre-trained model might have converged to something fairly deterministic. And then if you're trying to learn something new or adapt it in a new way, then that last layer might not actually be exploring in a good way."},{"start":587.18,"text":"So that's one example of why you might see worse performance if you initialize your weights with some previous neural network. And arguably, in language models, perhaps reinforcement learning works quite well because pre-trained models often have a very diverse distribution over output tokens."},{"start":609.61,"text":"In terms of leveraging prior data and knowledge and also being able to go beyond it, I think that this question is really important for thinking about how language models can solve problems that humans haven't solved. Because they probably should build upon the knowledge in the pre-trained data sets, but they also need to think about how to go beyond that and not be too constrained by what the pre-trained model might say. And it's also quite useful for thinking about how robots or autonomous vehicles might learn how to do things."},{"start":638.31,"text":"faster and more reliably than what humans do. And perhaps if we constrain too much to the pre-trained knowledge or the prior knowledge, then they might not be able to surpass human abilities in terms of speed or reliability."},{"start":652.94,"text":"So I think generally these two questions are really fascinating and things that we've seen some suggestions that reinforcement learning can do this. And it's certainly one of the most promising tools for going beyond what humans can do. But lots of interesting and open work to do there. Now, one question I've gotten quite a bit is whether we can leverage world models and video generation models for robotics and control."},{"start":681.33,"text":"And we've seen some really impressive results, especially recently from video generation models, where they clearly have a lot of rich knowledge about the world, like how cooking on a stove works, how typing on a keyboard works, and how that might look like if the keyboard was made of gummy bears, and also how things like even walking at an abstract level work. And so it seems like this word knowledge should be really useful for learning behavior."}],"speech_gaps":[],"frame":"../frames/v028/004.webp","frame_time":543.96},{"title":"深度强化学习前沿中的挑战与解决方案","segments":[{"id":45,"text":"But there's actually a lot of nuance and a lot of challenges with using these kinds of models. As an example, if you train a action-conditioned video generation model, so a model that takes as input the current image and future actions and predicts future video, and if you train that on demonstrations and rollouts from one policy, and then you evaluate a new policy's actions,","zh":"但实际上，使用这类模型存在很多细微差别和挑战。例如，如果你训练一个动作条件视频生成模型，也就是一个以当前图像和未来动作作为输入，并预测未来视频的模型，然后你用一个策略的演示和 rollout 数据来训练这个模型，接着你评估一个新策略的动作，","start":710.97,"end":740.03},{"id":46,"text":"with that model and evaluate whether or not those actions lead to good outcomes, then these actions won't necessarily be represented in the data that the model was trained on. And as a result...","zh":"使用该模型并评估这些动作是否会导致良好的结果，那么这些动作不一定在模型训练所用的数据中被表示。因此……","start":741.31,"end":755.25},{"id":47,"text":"the model often will make inaccurate predictions for these actions. It might be, if most of the data set is demonstrations, then it will predict a video that corresponds to correctly doing the task, even if these actions did not lead to a correct outcome. And generally, these models have very little data of, for example, like narrowly making a mistake or making mistakes that are very different from the kinds of mistakes that humans make.","zh":"模型通常会对这些动作做出不准确的预测。例如，如果大部分数据集是演示数据，那么它可能会预测出一个正确执行任务的视频，即使这些动作并没有导致正确的结果。而且一般来说，这些模型在例如狭窄地犯错或犯下与人类犯的错误非常不同的错误方面，拥有非常少的数据。","start":755.77,"end":778.55},{"id":48,"text":"The other thing here is that even small physical inaccuracies can lead to poor performance. And so a lot of times these videos look really, really good. They look like they might be accurate, but that doesn't mean that the underlying physics is actually accurate.","zh":"另一个问题是，即使是很小的物理不准确性也可能导致表现不佳。因此，很多时候这些视频看起来非常、非常棒。它们看起来似乎很准确，但这并不意味着底层的物理模型实际上准确。","start":780.3,"end":794.88},{"id":49,"text":"Now, I think that there's solutions here. One possible solution is to try to train on data from lots of different policies with this kind of approach, with the hopes that that will lead to enough coverage over action distributions to leverage these models. And then the second possible solution is that we might be able to use these video generation models in other ways. One example of that, maybe instead of training this sort of physical model of the future,","zh":"我认为这里存在解决方案。一种可能的解决方案是尝试用这种策略的数据来训练模型，希望这样能覆盖足够的动作分布，从而利用这些模型。第二种可能的解决方案是，我们或许能够以其他方式使用这些视频生成模型。例如，也许我们不需要训练这种对未来物理的模型，","start":796.08,"end":825.23},{"id":50,"text":"We could generate, for example, what should the kind of future video look like not conditioned on actions. And if we train this only on demonstrations, then, for example, we could predict future video and kind of plan out how to accomplish the task in the future in video space and then run a goal condition policy using the predicted video.","zh":"我们可以生成，例如，不依赖动作的未来视频应该是什么样子。如果我们只在演示数据上训练这个模型，那么例如，我们可以预测未来的视频，并在视频空间中规划如何在未来完成任务，然后使用预测的视频运行一个目标条件策略。","start":825.78,"end":852.18},{"id":51,"text":"And something like this kind of sidesteps the challenge of this sort of added distribution action problem because you're only using the model for a form of planning where you're thinking through what is a good outcome in the future rather than thinking through what is the outcome of specific actions. Cool. And then the third thing on the method side, the third challenge that I'll talk about is thinking about scaling. So on the scaling front, we've...","zh":"并且，这种方法在某种程度上回避了这种添加分布动作问题的挑战，因为您只是将模型用于一种规划形式，您是在思考未来可能的良好结果，而不是思考特定动作的结果。不错。然后，在方法方面，第三点，我将讨论的第三个挑战是考虑扩展性。因此，在扩展性方面，我们……","start":853.68,"end":884.9}],"notes":["本段讨论了使用动作条件视频生成模型时面临的挑战，特别是当模型仅基于单一策略的演示和回滚数据进行训练时，新策略的动作可能不在训练数据中，导致模型预测不准确。这表明模型对动作分布的覆盖不足，无法有效处理新动作。","讲者提到，即使视频看起来很逼真，也不代表其底层物理模型是准确的。这说明模型可能在物理模拟方面存在偏差，导致预测结果与实际物理行为不一致。","为解决这些问题，讲者提出了几种可能的解决方案，包括使用多个策略的数据进行训练，以增加动作分布的覆盖范围，以及改变模型的使用方式，例如不依赖动作条件生成视频，而是通过视频空间进行规划。","讲者还提到，通过视频生成模型进行规划可以绕过动作分布覆盖不足的问题，因为规划过程关注的是未来结果而非具体动作。这表明模型的应用方式可以多样化，以适应不同的任务需求。","最后，讲者提到将讨论扩展性问题，这表明在实际应用中，模型的扩展性和计算资源的限制也是需要考虑的重要因素。","整体上，本段强调了深度强化学习中视频生成模型的局限性及其潜在解决方案，特别是在动作分布覆盖和物理准确性方面的问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":710.97,"end":884.9,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":710.97,"text":"But there's actually a lot of nuance and a lot of challenges with using these kinds of models. As an example, if you train a action-conditioned video generation model, so a model that takes as input the current image and future actions and predicts future video, and if you train that on demonstrations and rollouts from one policy, and then you evaluate a new policy's actions,"},{"start":741.31,"text":"with that model and evaluate whether or not those actions lead to good outcomes, then these actions won't necessarily be represented in the data that the model was trained on. And as a result..."},{"start":755.77,"text":"the model often will make inaccurate predictions for these actions. It might be, if most of the data set is demonstrations, then it will predict a video that corresponds to correctly doing the task, even if these actions did not lead to a correct outcome. And generally, these models have very little data of, for example, like narrowly making a mistake or making mistakes that are very different from the kinds of mistakes that humans make."},{"start":780.3,"text":"The other thing here is that even small physical inaccuracies can lead to poor performance. And so a lot of times these videos look really, really good. They look like they might be accurate, but that doesn't mean that the underlying physics is actually accurate."},{"start":796.08,"text":"Now, I think that there's solutions here. One possible solution is to try to train on data from lots of different policies with this kind of approach, with the hopes that that will lead to enough coverage over action distributions to leverage these models. And then the second possible solution is that we might be able to use these video generation models in other ways. One example of that, maybe instead of training this sort of physical model of the future,"},{"start":825.78,"text":"We could generate, for example, what should the kind of future video look like not conditioned on actions. And if we train this only on demonstrations, then, for example, we could predict future video and kind of plan out how to accomplish the task in the future in video space and then run a goal condition policy using the predicted video."},{"start":853.68,"text":"And something like this kind of sidesteps the challenge of this sort of added distribution action problem because you're only using the model for a form of planning where you're thinking through what is a good outcome in the future rather than thinking through what is the outcome of specific actions. Cool. And then the third thing on the method side, the third challenge that I'll talk about is thinking about scaling. So on the scaling front, we've..."}],"speech_gaps":[],"frame":"../frames/v028/005.webp","frame_time":722.97},{"title":"深度强化学习前沿：挑战与解决方案","segments":[{"id":52,"text":"seen large-scale RL succeed with language models, and that's actually really exciting to see. But there's still shortcomings there. So a lot of language model RL is considering problems that are still fairly short horizon or extremely online, like generating rollouts of the model every single iteration. And as an example of this, if we're doing preference optimization,","zh":"我们已经看到大规模的强化学习在语言模型上取得了成功，实际上看到这一点真的很令人兴奋。但那里仍然存在一些不足之处。因此，很多语言模型的强化学习研究都是针对仍然相对较短的视野或极端在线的问题，例如在每次迭代中生成模型的 rollout。举个例子，如果我们进行偏好优化，","start":885.45,"end":913.02},{"id":53,"text":"Typically, we consider this single turn dialogue setting where we're getting rewards just for our next response rather than trying to reward the outcome of the full conversation. And this means that it's a shorter horizon problem. It means you don't have to have a human in the loop of data collection to generate those dialogue conversations.","zh":"通常我们会考虑这种单轮对话的设置，我们只为下一次回复获得奖励，而不是尝试奖励整个对话的结果。这意味着这是一个较短视野的问题。这意味着你不需要在数据收集过程中有人参与来生成这些对话。","start":913.79,"end":933.78},{"id":54,"text":"And so this makes the problem easier, which is good to make the problem easier, but it means that if there are scenarios where you have longer horizon problems or you need a human in the loop of data collection, that becomes a lot more challenging to do at large scale. As another example, if we think about reasoning for math problems, this relies on a very large number of online samples from the model interleaved with policy updates.","zh":"因此，这使得问题更容易解决，这很好，但这也意味着，如果存在需要更长视野的问题或需要在数据收集过程中有人参与的场景，那么在大规模上进行这些任务就会变得更具挑战性。另一个例子是，如果我们考虑数学问题的推理，这依赖于大量的在线样本与策略更新交错进行。","start":934.66,"end":961.18},{"id":55,"text":"And there are some scenarios where it's actually really hard to collect that sort of very online data interleaved with policy updates, especially if collecting data involves interfacing with humans or interfacing with the physical world. So towards this end, if we wanted to think about longer horizon problems and efficiently learning, tools like value functions should be really useful. And I think we have yet to see...","zh":"有一些场景实际上很难收集这种与策略更新交错进行的非常在线的数据，尤其是当数据收集涉及与人类交互或与物理世界交互时。因此，为了应对这种情况，如果我们想要考虑更长视野的问题并高效学习，像价值函数这样的工具应该非常有用。我认为我们尚未看到……","start":962.6,"end":990.26},{"id":56,"text":"We see some signs of life in training value functions at large scale, and when using PPO, we train value functions at large scale.","zh":"我们在大规模训练价值函数方面看到了一些迹象，而且在使用PPO时，我们也在大规模上训练价值函数。","start":991.07,"end":998.13},{"id":57,"text":"But these value functions are primarily used for reducing gradient variance and may not be accurate enough for doing a full actor-critic update or for selecting actions with a Q-learning style objective.","zh":"但这些价值函数主要用于减少梯度方差，可能不足以进行完整的actor-critic更新或用于基于Q学习目标的选择动作。","start":998.57,"end":1010.15},{"id":58,"text":"And so understanding whether we can scale that value function learning and have value functions be accurate enough for directly optimizing policies, something that's pretty interesting to explore and might be important for longer horizon problems.","zh":"因此，理解我们是否能够扩展这种价值函数的学习，并使价值函数足够准确以直接优化策略，这是一件非常有趣的事情，可能对更长视野的问题非常重要。","start":1010.91,"end":1025.17},{"id":59,"text":"And then second, I mentioned that very online data collection can be challenging at large scale.","zh":"然后第二点，我提到在大规模情况下，非常在线的数据收集可能会具有挑战性。","start":1028.01,"end":1035.39},{"id":60,"text":"And as an example of this, say that you are, maybe let's say that you're kind of,","zh":"举个例子，比如说你可能是一个，比如说你是一家自动驾驶公司，你想做强化学习。","start":1037.67,"end":1044.33},{"id":61,"text":"maybe say that you're like an autonomous driving company and you want to do RL. It's going to be","zh":"你想要对你的所有车辆同时收集数据，然后每隔30秒甚至每分钟甚至每小时进行一次策略更新，这会很困难。","start":1045.99,"end":1051.49},{"id":62,"text":"hard to like collect data on your cars, like all of your cars at once, then do a policy update like","zh":"像这样，首先收集数据会更容易。","start":1051.49,"end":1058.45},{"id":63,"text":"every like 30 seconds or even every minute or even every hour. Like it's much easier to first collect","zh":"每隔30秒甚至每隔一分钟甚至每隔一小时。比如，首先收集要容易得多","start":1059.05,"end":1064.31}],"notes":["本段讨论了深度强化学习在大规模应用中的挑战，特别是在线数据收集和长视距问题。讲者指出，当前的语言模型强化学习主要处理较短的视距问题，例如每次迭代生成模型的rollouts，这使得问题更容易处理，但限制了其在需要长视距或人类参与数据收集的场景中的应用。","讲者提到，对于数学推理等任务，需要大量的在线样本与策略更新交替进行，这在涉及人类或物理世界交互时尤其困难。因此，需要更有效的工具，如价值函数，来处理长视距问题并提高学习效率。","讲者指出，虽然在大规模训练价值函数方面已有初步迹象，但这些价值函数主要用于减少梯度方差，可能不足以进行完整的actor-critic更新或基于Q学习的目标选择。因此，理解如何扩展价值函数学习并使其足够准确以直接优化策略是一个值得探索的重要方向。","讲者以自动驾驶公司为例，说明大规模数据收集的困难。例如，无法一次性收集所有车辆的数据，然后每隔30秒或更长时间进行策略更新。因此，需要更高效的数据收集方法。","讲者强调，大规模在线数据收集在涉及人类或物理世界交互时尤其困难，这限制了强化学习在某些场景中的应用。因此，需要探索更有效的学习方法和工具，如价值函数，以应对这些挑战。","讲者指出，当前的强化学习方法在处理长视距问题和大规模数据收集时仍存在不足，需要进一步研究和改进，以实现更广泛的应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":885.45,"end":1064.31,"asr_flags":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":885.45,"text":"seen large-scale RL succeed with language models, and that's actually really exciting to see. But there's still shortcomings there. So a lot of language model RL is considering problems that are still fairly short horizon or extremely online, like generating rollouts of the model every single iteration. And as an example of this, if we're doing preference optimization,"},{"start":913.79,"text":"Typically, we consider this single turn dialogue setting where we're getting rewards just for our next response rather than trying to reward the outcome of the full conversation. And this means that it's a shorter horizon problem. It means you don't have to have a human in the loop of data collection to generate those dialogue conversations."},{"start":934.66,"text":"And so this makes the problem easier, which is good to make the problem easier, but it means that if there are scenarios where you have longer horizon problems or you need a human in the loop of data collection, that becomes a lot more challenging to do at large scale. As another example, if we think about reasoning for math problems, this relies on a very large number of online samples from the model interleaved with policy updates."},{"start":962.6,"text":"And there are some scenarios where it's actually really hard to collect that sort of very online data interleaved with policy updates, especially if collecting data involves interfacing with humans or interfacing with the physical world. So towards this end, if we wanted to think about longer horizon problems and efficiently learning, tools like value functions should be really useful. And I think we have yet to see..."},{"start":991.07,"text":"We see some signs of life in training value functions at large scale, and when using PPO, we train value functions at large scale."},{"start":998.57,"text":"But these value functions are primarily used for reducing gradient variance and may not be accurate enough for doing a full actor-critic update or for selecting actions with a Q-learning style objective."},{"start":1010.91,"text":"And so understanding whether we can scale that value function learning and have value functions be accurate enough for directly optimizing policies, something that's pretty interesting to explore and might be important for longer horizon problems."},{"start":1028.01,"text":"And then second, I mentioned that very online data collection can be challenging at large scale."},{"start":1037.67,"text":"And as an example of this, say that you are, maybe let's say that you're kind of,"},{"start":1045.99,"text":"maybe say that you're like an autonomous driving company and you want to do RL. It's going to be"},{"start":1051.49,"text":"hard to like collect data on your cars, like all of your cars at once, then do a policy update like"},{"start":1059.05,"text":"every like 30 seconds or even every minute or even every hour. Like it's much easier to first collect"}],"speech_gaps":[],"frame":"../frames/v028/006.webp","frame_time":897.45},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":64,"text":"a large batch of data, like maybe over a couple days, maybe over a week, then update your policy","zh":"一个大量的数据集，比如可能持续几天，或者持续一周，然后更新你的策略","start":1064.31,"end":1070.45},{"id":65,"text":"on all that data and repeat that process. And so I refer to that sort of problem statement as kind","zh":"在所有这些数据上进行更新，并重复这个过程。因此，我将这种问题陈述称为","start":1070.45,"end":1076.93},{"id":66,"text":"of a batch online setting where you're collecting a batch of online data with one policy, then doing","zh":"一种批量在线设置，其中你使用一个策略收集一批在线数据，然后进行更新并重复这个过程。","start":1076.93,"end":1081.99},{"id":67,"text":"an update and repeating. And this sort of more batch data collection setting might have challenges","zh":"这种更偏向于批量数据收集的设置可能会带来一些与你通常在线强化学习不同的挑战。","start":1081.99,"end":1088.85},{"id":68,"text":"that are a bit different from your kind of typical online reinforcement learning.","zh":"因此，这种数据收集方式应该相当实用。你也可以异步地进行这种操作，即从数据收集和更新之间异步进行。","start":1088.85,"end":1093.25},{"id":69,"text":"And so this sort of data collection should be quite practical. You could also do this potentially asynchronously, where you're collecting data asynchronously from making updates. And at large scale, this sort of asynchronous updates can actually potentially also be more practical.","zh":"因此，这种数据收集方式应该相当实用。你也可以异步地进行这种操作，即在更新过程中异步地收集数据。在大规模情况下，这种异步更新实际上可能也更加实用。","start":1096.61,"end":1112.17},{"id":70,"text":"And there might be new considerations on the algorithm side. So, for example, in one recent work by Dong et al, they found that using more expressive policies like diffusion policies was really, really important for effective reinforcement learning in this sort of batch online setting. And one explanation for that is if you're collecting a large batch of data, having diverse actions be represented could naturally be pretty important.","zh":"因此，算法方面可能会有新的考虑因素。例如，在Dong等人的一项近期工作中，他们发现使用更具表达力的策略，如扩散策略，对于这种批量在线设置中的有效强化学习非常重要。","start":1114.43,"end":1136.79},{"id":71,"text":"Because in the fully online setting, if you have a more deterministic policy, if you're going to be making an update, maybe it's okay to be more deterministic because you're going to change your policy really, really soon anyway. And so you'll already get more diverse data just from changing your policy so frequently. Whereas in the more batch setting, you don't have the luxury of changing your policy so frequently and having a more diverse distribution might be quite helpful.","zh":"一个可能的解释是，如果你收集了一个大量的数据集，能够表示多样化动作可能是非常重要的。因为在完全在线的设置中，如果你有一个更确定性的策略，当你准备进行更新时，也许可以更确定性地进行，因为你很快就会改变策略。","start":1138.21,"end":1162.51},{"id":72,"text":"Yeah, so DPO, there are algorithms that are operating much more offline. And so there is success there. The one downside of that is those problems are shorter horizon. And so can we do long horizons and with less online data? And things like offline RL are also going to be more scalable as well. Okay, let's talk a bit about deployment and evaluation. So one problem I think that is...","zh":"是的，所以DPO，有一些算法是在线下运行得更多。因此在这方面取得了成功。但这些方法的一个缺点是，这些问题的视野范围较短。那么，我们能否实现长视野范围并且使用更少的在线数据呢？像离线强化学习这样的方法也会更加可扩展。好的，让我们稍微谈谈部署和评估。我认为其中一个问题是...","start":1163.46,"end":1190.61},{"id":73,"text":"Quite important with these models is thinking about safety and how to apply these models in more safety critical domains. That could be domains like medicine, driving, mental health counseling, legal and political discourse, and so on. No shortage of domains that have challenges that could lead to safety critical situations when you make mistakes.","zh":"在这些模型中，考虑安全性和如何在更安全关键的领域中应用这些模型是非常重要的。这些领域可以是医学、驾驶、心理健康咨询、法律和政治讨论等。有很多领域都存在挑战，当出现错误时可能会导致安全关键的情况。","start":1191.63,"end":1209.55},{"id":74,"text":"Now, historically, this sort of problem has been approached by trying to formally verify the behavior of the model","zh":"历史上，这类问题通常是通过尝试正式验证模型的行为来解决的","start":1211.52,"end":1217.68},{"id":75,"text":"or provide some sort of probabilistic guarantees.","zh":"或者提供某种概率保证。","start":1217.68,"end":1219.92},{"id":76,"text":"But generally, oftentimes these methods are going to make assumptions that don't hold under real-world circumstances.","zh":"但通常情况下，这些方法会做出一些在现实世界情况下不成立的假设。","start":1221.4,"end":1228.16},{"id":77,"text":"And so even if you can verify it in a model, those verifications often won't hold at larger scales.","zh":"因此，即使你能在模型中验证它，这些验证通常在更大规模下也不会成立。","start":1228.4,"end":1235.74},{"id":78,"text":"and generally it's impossible to like fully guarantee safety in the countless number of","zh":"而且一般来说，在无数数量的","start":1237.64,"end":1242.88}],"notes":["本段讨论了深度强化学习中批量在线设置的概念，即在收集大量在线数据后更新策略，并重复这一过程。这种设置与传统的在线强化学习有所不同，可能面临不同的挑战。此外，还提到异步更新在大规模场景下可能更具实用性。","讲者指出，在批量设置中，使用更具表达力的策略（如扩散策略）对于有效强化学习非常重要。这是因为收集大量数据时，多样化的行为表示自然变得重要。而在完全在线设置中，由于策略频繁更新，可以自然获得更多样化的数据。","讲者提到，DPO（可能指某种算法）在离线操作方面有成功案例，但其缺点是处理的问题通常具有较短的时域。因此，如何在较少在线数据的情况下实现长时域成为研究重点。此外，离线强化学习在可扩展性方面也更具优势。","在部署和评估方面，讲者强调了安全问题的重要性，特别是在医疗、驾驶、心理健康咨询、法律和政治讨论等安全关键领域。这些领域中，模型的错误可能导致严重后果。","历史上，这类问题通常通过形式化验证模型行为或提供概率保证来解决，但这些方法通常基于现实世界中不成立的假设。因此，即使在模型中验证成功，这些验证在更大规模下可能不成立。","讲者指出，完全保证安全在无数可能的场景中是不可能的，因此需要在实际应用中权衡安全性和其他因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1064.31,"end":1242.88,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":1064.31,"text":"a large batch of data, like maybe over a couple days, maybe over a week, then update your policy"},{"start":1070.45,"text":"on all that data and repeat that process. And so I refer to that sort of problem statement as kind"},{"start":1076.93,"text":"of a batch online setting where you're collecting a batch of online data with one policy, then doing"},{"start":1081.99,"text":"an update and repeating. And this sort of more batch data collection setting might have challenges"},{"start":1088.85,"text":"that are a bit different from your kind of typical online reinforcement learning."},{"start":1096.61,"text":"And so this sort of data collection should be quite practical. You could also do this potentially asynchronously, where you're collecting data asynchronously from making updates. And at large scale, this sort of asynchronous updates can actually potentially also be more practical."},{"start":1114.43,"text":"And there might be new considerations on the algorithm side. So, for example, in one recent work by Dong et al, they found that using more expressive policies like diffusion policies was really, really important for effective reinforcement learning in this sort of batch online setting. And one explanation for that is if you're collecting a large batch of data, having diverse actions be represented could naturally be pretty important."},{"start":1138.21,"text":"Because in the fully online setting, if you have a more deterministic policy, if you're going to be making an update, maybe it's okay to be more deterministic because you're going to change your policy really, really soon anyway. And so you'll already get more diverse data just from changing your policy so frequently. Whereas in the more batch setting, you don't have the luxury of changing your policy so frequently and having a more diverse distribution might be quite helpful."},{"start":1163.46,"text":"Yeah, so DPO, there are algorithms that are operating much more offline. And so there is success there. The one downside of that is those problems are shorter horizon. And so can we do long horizons and with less online data? And things like offline RL are also going to be more scalable as well. Okay, let's talk a bit about deployment and evaluation. So one problem I think that is..."},{"start":1191.63,"text":"Quite important with these models is thinking about safety and how to apply these models in more safety critical domains. That could be domains like medicine, driving, mental health counseling, legal and political discourse, and so on. No shortage of domains that have challenges that could lead to safety critical situations when you make mistakes."},{"start":1211.52,"text":"Now, historically, this sort of problem has been approached by trying to formally verify the behavior of the model"},{"start":1217.68,"text":"or provide some sort of probabilistic guarantees."},{"start":1221.4,"text":"But generally, oftentimes these methods are going to make assumptions that don't hold under real-world circumstances."},{"start":1228.4,"text":"And so even if you can verify it in a model, those verifications often won't hold at larger scales."},{"start":1237.64,"text":"and generally it's impossible to like fully guarantee safety in the countless number of"}],"speech_gaps":[],"frame":"../frames/v028/007.webp","frame_time":1076.31},{"title":"深度强化学习中的安全挑战与数据收集问题","segments":[{"id":79,"text":"scenarios that you can encounter in the real world and we find that even humans make mistakes and so","zh":"你可能在现实世界中遇到的各种场景，我们发现即使人类也会犯错，因此","start":1242.88,"end":1248.16},{"id":80,"text":"even in safety critical settings so human drivers make mistakes surgeons pilots make mistakes","zh":"即使在安全至关重要的环境中，人类驾驶员也会犯错，外科医生和飞行员也会犯错","start":1248.16,"end":1253.3},{"id":81,"text":"politicians make mistakes and so forth so we can't guarantee safety but we could at least try to","zh":"政治家也会犯错，等等，因此我们无法保证安全性，但至少可以尝试","start":1253.3,"end":1260.54},{"id":82,"text":"to try to think about handling safety-critical scenarios effectively.","zh":"尝试有效地处理安全关键场景。","start":1260.54,"end":1265.06},{"id":83,"text":"And arguably, if you were to think about safety,","zh":"可以说，如果你考虑安全性，","start":1269.16,"end":1271.28},{"id":84,"text":"there might be some constraints that we can apply to the model in some scenarios.","zh":"在某些场景下，我们可能会对模型施加一些约束。","start":1272.52,"end":1275.74},{"id":85,"text":"But in general, safety is an open-world problem.","zh":"但总体而言，安全性是一个开放世界的问题。","start":1276.16,"end":1279.6},{"id":86,"text":"You need to handle all sorts of different ways","zh":"你需要处理各种不同的方式","start":1279.8,"end":1282.04},{"id":87,"text":"in which your model could do something that's unsafe.","zh":"在这种情况下，你的模型可能会执行一些不安全的操作。","start":1282.04,"end":1285.18},{"id":88,"text":"And arguably, large-scale machine learning has been the most successful way","zh":"可以说，大规模机器学习是处理开放世界情境最成功的方法。","start":1286.14,"end":1289.8},{"id":89,"text":"to handle open world circumstances.","zh":"因此，为了应对这种情况，","start":1289.8,"end":1291.74},{"id":90,"text":"And so as a result of this,","zh":"似乎我们应该尝试收集大量数据","start":1292.96,"end":1295.38},{"id":91,"text":"it seems like perhaps we should try to collect large amounts of data","zh":"来教导我们的模型什么行为是安全的，什么行为是不安全的。","start":1295.42,"end":1298.1},{"id":92,"text":"that would teach our model what is safe and what is unsafe.","zh":"然而，与此同时，这种方法确实令人不满意。","start":1298.1,"end":1300.78},{"id":93,"text":"Now, at the same time, this is really unsatisfying.","zh":"这意味着我们实际上必须以某种方式收集大量数据","start":1302.46,"end":1304.9},{"id":94,"text":"This means that we actually have to somehow collect a lot of data","zh":"这意味着我们实际上必须以某种方式收集大量数据","start":1304.94,"end":1308.54},{"id":95,"text":"under unsafe circumstances,","zh":"在不安全的情况下，","start":1308.54,"end":1309.9},{"id":96,"text":"and it also can have some really real and negative kind of ramifications.","zh":"它还可能带来一些真正现实且负面的后果。","start":1310.36,"end":1316.34},{"id":97,"text":"So, as an example, there was news articles that talked about how tech companies are","zh":"例如，有新闻文章谈到科技公司基本上在尝试进行内容审核或标记具有创伤性或有毒的数据。","start":1316.34,"end":1323.06},{"id":98,"text":"basically trying to do content moderation or label data that is traumatic or toxic. And labeling that kind of data can even cause humans all sorts of mental health challenges and has a lot of kind of ethical considerations. And so this sort of approach isn't satisfying for handling this sort of safety critical problem. And so","zh":"对这类数据进行标记甚至可能对人类造成各种心理健康挑战，并涉及大量的伦理考量。因此，这种做法在处理这类安全关键性问题时并不令人满意。因此，","start":1324.66,"end":1352.6},{"id":99,"text":"Can we develop methods that can learn what's unsafe without expansive data, without expansive human labeling, without expansive data of incidents that happen themselves? Maybe we could use synthetic data for this. Maybe we can use some sort of prior knowledge. This is an open challenge and would have a lot of benefits in terms of the safety of these systems and the safety of training these systems.","zh":"我们能否开发出方法，能够在不使用大量数据、不依赖大量人工标注、不依赖大量实际发生的事件数据的情况下，学习什么是不安全的？也许我们可以使用合成数据。也许我们可以利用某种先验知识。这是一个开放性的挑战，对于这些系统的安全性以及训练这些系统的安全性都有很多好处。","start":1353.29,"end":1381.2},{"id":100,"text":"And then separate from that, As these models are improving, we also want them to remain safe during the exploration process and during the learning process. And this is something that humans are actually pretty good at doing. And as sort of a silly example, maybe a couple of years ago, I taught myself how to ride my bike without holding onto the handlebars. And I did so without ever falling off my bike.","zh":"此外，随着这些模型的不断改进，我们也希望它们在探索过程和学习过程中保持安全。而人类实际上在这方面做得相当好。作为一个有点傻的例子，大概几年前，我学会了如何在不扶车把的情况下骑自行车，而且在整个过程中从未从自行车上掉下来。","start":1382.6,"end":1409.69}],"notes":["本段讨论了强化学习中安全问题的挑战，指出即使人类在安全关键场景中也会犯错，因此无法保证绝对安全，但可以尝试有效处理。讲者提到，安全是一个开放世界问题，需要处理各种可能的不安全行为。","讲者指出，大规模机器学习是处理开放世界问题最成功的方法之一，因此可以尝试收集大量数据来训练模型识别安全与不安全行为。然而，这种方法存在不足，因为需要在不安全情境下收集数据，这可能带来负面后果。","讲者以科技公司进行内容审核和标记创伤性或有毒数据为例，说明这种数据收集方式对人类心理健康和伦理有负面影响，因此不是处理安全关键问题的令人满意的解决方案。","讲者提出，可以考虑使用合成数据或先验知识来避免大规模数据收集，这被视为一个开放性挑战，但能带来系统安全性和训练过程安全性的提升。","讲者进一步指出，随着模型性能的提升，需要确保其在探索和学习过程中保持安全，而人类在这方面表现良好。讲者以自己学习骑自行车不扶把手为例，说明人类在探索过程中能够保持安全。","本段强调了安全在强化学习中的重要性，以及如何在不依赖大规模数据的情况下实现安全学习，同时指出人类在探索过程中的安全能力值得借鉴。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1242.88,"end":1409.69,"asr_flags":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":1242.88,"text":"scenarios that you can encounter in the real world and we find that even humans make mistakes and so"},{"start":1248.16,"text":"even in safety critical settings so human drivers make mistakes surgeons pilots make mistakes"},{"start":1253.3,"text":"politicians make mistakes and so forth so we can't guarantee safety but we could at least try to"},{"start":1260.54,"text":"to try to think about handling safety-critical scenarios effectively."},{"start":1269.16,"text":"And arguably, if you were to think about safety,"},{"start":1272.52,"text":"there might be some constraints that we can apply to the model in some scenarios."},{"start":1276.16,"text":"But in general, safety is an open-world problem."},{"start":1279.8,"text":"You need to handle all sorts of different ways"},{"start":1282.04,"text":"in which your model could do something that's unsafe."},{"start":1286.14,"text":"And arguably, large-scale machine learning has been the most successful way"},{"start":1289.8,"text":"to handle open world circumstances."},{"start":1292.96,"text":"And so as a result of this,"},{"start":1295.42,"text":"it seems like perhaps we should try to collect large amounts of data"},{"start":1298.1,"text":"that would teach our model what is safe and what is unsafe."},{"start":1302.46,"text":"Now, at the same time, this is really unsatisfying."},{"start":1304.94,"text":"This means that we actually have to somehow collect a lot of data"},{"start":1308.54,"text":"under unsafe circumstances,"},{"start":1310.36,"text":"and it also can have some really real and negative kind of ramifications."},{"start":1316.34,"text":"So, as an example, there was news articles that talked about how tech companies are"},{"start":1324.66,"text":"basically trying to do content moderation or label data that is traumatic or toxic. And labeling that kind of data can even cause humans all sorts of mental health challenges and has a lot of kind of ethical considerations. And so this sort of approach isn't satisfying for handling this sort of safety critical problem. And so"},{"start":1353.29,"text":"Can we develop methods that can learn what's unsafe without expansive data, without expansive human labeling, without expansive data of incidents that happen themselves? Maybe we could use synthetic data for this. Maybe we can use some sort of prior knowledge. This is an open challenge and would have a lot of benefits in terms of the safety of these systems and the safety of training these systems. And then separate from that,"},{"start":1382.6,"text":"As these models are improving, we also want them to remain safe during the exploration process and during the learning process. And this is something that humans are actually pretty good at doing. And as sort of a silly example, maybe a couple of years ago, I taught myself how to ride my bike without holding onto the handlebars. And I did so without ever falling off my bike."}],"speech_gaps":[{"start":1267.024,"end":1268.72}],"frame":"../frames/v028/008.webp","frame_time":1254.88},{"title":"深度强化学习前沿中的安全与人机协作","segments":[{"id":101,"text":"And I'm not saying that to brag. Maybe this is like, it's not that hard. It took time, took effort. But I think it's really fascinating to think about how would you get a robot to, for example, learn how to do a new behavior like that without ever falling or without ever causing damage to themselves.","zh":"我不是在吹嘘。也许这看起来似乎不难。它花费了时间，也付出了努力。但我认为，思考如何让机器人在不摔倒或不造成自身伤害的情况下，学习执行像这样的新行为，是一件非常引人入胜的事情。","start":1410.45,"end":1429.69},{"id":102,"text":"And it means that you're fundamentally exploring a new part of the state space while also understanding what might be more risky and less risky and thinking about a curriculum over how to accomplish that sort of objective. OK, so separate from safety, although related, is that these models do, even in non-safety critical scenarios, make mistakes. Sometimes these mistakes are called hallucinations.","zh":"这意味着你本质上是在探索状态空间的新区域，同时理解哪些可能是更危险的，哪些是更安全的，并思考如何制定课程来实现这样的目标。好的，所以这与安全相关，但又不完全相同的是，这些模型即使在非安全关键的场景中，也会犯错误。有时这些错误被称为幻觉。","start":1430.24,"end":1456.51},{"id":103,"text":"Probably many of you have encountered these kinds of mistakes before. I'll provide one example here where I was asking it to tell me what the weight of the sugar on the bowl is in this image. And it confidently told me that the digital scale in the image reads 108.2 grams. That is the weight of the sugar currently in the bowl. This answer is incorrect. It's actually a bit different from what the scale shows, although it's also very challenging to read what the scale shows because of the glare in the image.","zh":"你们中的许多人可能之前都遇到过这种错误。我这里提供一个例子，当时我让它告诉我这张图片中碗里糖的重量。它自信地告诉我，图片中的数字秤显示为108.2克，这就是碗中当前糖的重量。这个答案是错误的。实际上，它与秤显示的数值略有不同，尽管由于图片中的反光，读取秤的数值也非常具有挑战性。","start":1458.05,"end":1484.77},{"id":104,"text":"And oftentimes in language models, humans are the recipient of the predictions of these models. And this means that oftentimes mistakes are fairly manageable because a human can discern whether or not the model was saying the right thing or the wrong thing. But the interface between these humans and these models is not well optimized. And as an example of this,","zh":"在语言模型中，人类通常是这些模型预测结果的接收者。这意味着，很多时候错误是相对容易处理的，因为人类可以判断模型是否说对了或说错了。但人类与这些模型之间的接口并没有很好地优化。举个例子，","start":1488.17,"end":1515.01},{"id":105,"text":"And it seems like for these systems to be more effective, we should take into account the fact that they'll be working with humans when actually making decisions at the end of the day. Because if we're like 92 sounds great compared to 74, but if it is going to be a system that's interacting with a person, 76 doesn't sound quite so great. So can we optimize for better human AI systems?","zh":"看起来，为了让这些系统更加有效，我们应该考虑到它们最终在做决定时会与人类合作。因为如果我们在比较92和74时觉得92很好，但如果这个系统要与人交互，76听起来就不那么好了。那么，我们能否优化出更好的人机协作系统？","start":1515.81,"end":1542.77},{"id":106,"text":"And it seems like for these systems to be more effective, we should take into account the fact that they'll be working with humans when actually making decisions at the end of the day. Because if we're like 92 sounds great compared to 74, but if it is going to be a system that's interacting with a person, 76 doesn't sound quite so great. So can we optimize for better human AI systems?","zh":"而且看起来，为了让这些系统更加有效，我们应该考虑到它们最终在做决策时会与人类一起工作。因为如果我们像92比74听起来很好，但如果这是一个将与人交互的系统，76就不显得那么好了。那么，我们能否优化出更好的人机系统呢？","start":1543.86,"end":1568.9}],"notes":["本段讨论了深度强化学习中安全性和人机协作的重要性。讲者指出，即使在非安全关键场景中，模型也会犯错，这些错误有时被称为‘幻觉’。讲者通过一个例子说明了模型在图像识别任务中可能给出错误答案，尽管模型自信地给出了结果，但实际与图像中的数字秤显示值存在差异。这表明模型在处理复杂或模糊输入时可能产生误导性输出。","讲者进一步指出，人类在与AI系统交互时，虽然可以判断模型是否正确，但人机接口并未优化。讲者引用了一项研究，说明当AI独立工作时，准确率为92%，而当医生使用AI辅助时，准确率下降至76%，甚至低于人类单独工作的74%。这表明AI与人类协作时，系统性能可能不如预期。","讲者强调，为了提高AI系统的有效性，必须考虑其与人类协作的实际情况。虽然AI独立工作时的高准确率令人印象深刻，但在实际应用中，AI与人类的交互可能影响整体性能。因此，需要优化人机协作的系统设计，以实现更好的结果。","讲者最后提出了一个关键问题：我们能否优化出更高效的人机AI系统？这表明课程在探讨如何改进AI与人类协作的机制，以提升整体决策质量。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1410.45,"end":1568.9,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1410.45,"text":"And I'm not saying that to brag. Maybe this is like, it's not that hard. It took time, took effort. But I think it's really fascinating to think about how would you get a robot to, for example, learn how to do a new behavior like that without ever falling or without ever causing damage to themselves."},{"start":1430.24,"text":"And it means that you're fundamentally exploring a new part of the state space while also understanding what might be more risky and less risky and thinking about a curriculum over how to accomplish that sort of objective. OK, so separate from safety, although related, is that these models do, even in non-safety critical scenarios, make mistakes. Sometimes these mistakes are called hallucinations."},{"start":1458.05,"text":"Probably many of you have encountered these kinds of mistakes before. I'll provide one example here where I was asking it to tell me what the weight of the sugar on the bowl is in this image. And it confidently told me that the digital scale in the image reads 108.2 grams. That is the weight of the sugar currently in the bowl. This answer is incorrect. It's actually a bit different from what the scale shows, although it's also very challenging to read what the scale shows because of the glare in the image."},{"start":1488.17,"text":"And oftentimes in language models, humans are the recipient of the predictions of these models. And this means that oftentimes mistakes are fairly manageable because a human can discern whether or not the model was saying the right thing or the wrong thing. But the interface between these humans and these models is not well optimized. And as an example of this,"},{"start":1515.81,"text":"There was a study that was looking, actually multiple studies that have looked at how AI systems work with doctors. And in one study, it found that when the AI was working independently, it was able to achieve 92% accuracy. When physicians were using AI assistance, they only had 76% accuracy. And that was barely better than when humans were acting alone, which was 74% accuracy."},{"start":1543.86,"text":"And it seems like for these systems to be more effective, we should take into account the fact that they'll be working with humans when actually making decisions at the end of the day. Because if we're like 92 sounds great compared to 74, but if it is going to be a system that's interacting with a person, 76 doesn't sound quite so great. So can we optimize for better human AI systems?"}],"speech_gaps":[],"frame":"../frames/v028/009.webp","frame_time":1422.45},{"title":"强化学习中的模型校准与可靠性","segments":[{"id":107,"text":"And as part of this, maybe one way to achieve this was if models could better estimate uncertainty and better estimate when they might be giving the right answer versus when they might be giving the wrong answer. And there's research that shows that if you take a pre-trained model and plot the confidence of the model versus the accuracy of the model, so the confidence is the predicted probability of the answer that it gives, and this is the actual accuracy of those answers on average.","zh":"作为其中的一部分，也许实现这一目标的一种方法是，如果模型能够更好地估计不确定性，并且更好地判断它何时可能给出正确答案，何时可能给出错误答案。有研究表明，如果你取一个预训练的模型，并绘制模型的置信度与其准确率的关系，即置信度是模型给出答案的预测概率，而准确率是这些答案的平均实际准确率。","start":1569.79,"end":1596.82},{"id":108,"text":"You see that it's actually very well calibrated, so that confidence actually reflects its accuracy really well. But then after post-training with reinforcement learning, we actually see that the model becomes far less calibrated. And so maybe reinforcement learning is actually, while it's making the model better, it's actually deteriorating some of the calibration that these models might have at the beginning.","zh":"你会看到，实际上模型的校准非常好，因此置信度很好地反映了其准确率。但经过强化学习的后训练后，我们实际上发现模型的校准变得远不如以前。因此，也许强化学习在使模型变好的同时，实际上也在损害这些模型最初可能具有的校准能力。","start":1597.53,"end":1621.66},{"id":109,"text":"Perhaps one direction, there was some research by Tian et al that showed that if you verbalize the probability rather than using the probability, like the logits in the model, and encourage it to provide multiple guesses, then you can get more calibrated model performance after RLHF compared to the RLHF model.","zh":"或许一个方向是，Tian 等人的研究显示，如果你用概率的表述方式而不是使用概率本身，例如模型中的 logit，鼓励模型提供多个猜测，那么你可以在 RLHF（强化学习人类反馈）后获得比 RLHF 模型更校准的模型性能。","start":1624.87,"end":1643.61},{"id":110,"text":"So maybe that's one possible direction. Even then, you need to figure out how this would interface with a human and then evaluate how it does when the human and model are working together. But yeah, this is, I think, an important open problem for thinking about how humans and AI systems are working together.","zh":"因此，这可能是一个可能的方向。即使如此，你还需要弄清楚这将如何与人类交互，然后评估当人类和模型合作时的表现。是的，我认为，这在思考人类和人工智能系统如何协作时是一个重要的开放性问题。","start":1644.28,"end":1662.31},{"id":111,"text":"And then even separate from that, a lot of AI systems are not going to have a human there at the end of the day that are checking all the answers. And this is true in autonomous driving, where a human isn't going to be always holding the steering wheel. This is true in robotics, where","zh":"然后，即使与上述情况分开，很多人工智能系统最终也不会有人类在旁边检查所有答案。这在自动驾驶中是真实的，因为人类不会一直握着方向盘。这在机器人领域也是如此，","start":1663.98,"end":1677.8},{"id":112,"text":"Maybe you will be working with a human, but probably many of the decisions won't be checked by a human compared to many of the language model use cases. And even in language models, there's lots of use cases where you want to just plug that in to another system to control some system. Maybe web agents, for example, will be autonomously choosing what to do. And so in those scenarios, can we get really high reliability?","zh":"也许你会和人类一起工作，但与许多语言模型的应用场景相比，很多决策可能不会被人类检查。甚至在语言模型中，也有很多应用场景是你只需要将它连接到另一个系统以控制某个系统。例如，网络代理可能会自主地决定要做什么。因此，在这些场景中，我们能否实现非常高的可靠性？","start":1678.35,"end":1702.9},{"id":113,"text":"Reinforcement learning is likely a part of the solution. Online data is really helpful for getting high performance. And there's promising results that reinforcement learning can give really high reliability. One example by Luo et al showed that they're able, on fairly challenging robot tasks, they're able to get performance where...","zh":"强化学习可能是解决方案的一部分。在线数据对于实现高性能非常有帮助。而且，有令人鼓舞的结果表明，强化学习可以提供非常高的可靠性。 Luo 等人的一项研究显示，他们在相对具有挑战性的机器人任务中，能够实现性能达到……","start":1704.1,"end":1723.2},{"id":114,"text":"They ran the policy 100 times, and it worked 100 times. So that's pretty cool. But extending this to large-scale scenarios where you need to have really high reliability is quite important. Okay, and then the last thing I'll talk about is evaluation.","zh":"他们运行了该策略 100 次，每次都成功了。这非常棒。但将这种能力扩展到需要极高可靠性的大规模场景中是非常重要的。好的，接下来我要谈的是评估。","start":1723.79,"end":1744.21}],"notes":["本段讨论了强化学习对模型校准的影响。在预训练模型中，模型的置信度与准确率之间有良好的校准关系，但经过强化学习微调后，模型的校准性下降。这表明强化学习虽然提升了模型性能，但也可能损害其校准性。","Tian 等人的研究指出，通过将概率以语言形式表达而非使用 logits，并鼓励模型提供多个猜测，可以在 RLHF 后获得更校准的模型表现。这表明模型的输出形式和多样性可能影响其校准性。","在自主驾驶和机器人等应用场景中，人类无法持续检查所有决策，因此模型的可靠性至关重要。强化学习可能成为提升系统可靠性的重要手段。","Luo 等人的实验表明，在具有挑战性的机器人任务中，强化学习可以实现极高的可靠性，例如在 100 次运行中全部成功。这展示了强化学习在提升系统可靠性方面的潜力。","尽管强化学习在小规模场景中表现良好，但将其扩展到大规模、高可靠性需求的场景仍是一个重要挑战。这需要进一步研究如何在实际应用中实现高可靠性。","最后，课程提到评估是强化学习研究中的一个重要方面，但未具体展开评估方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1569.79,"end":1744.21,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1569.79,"text":"And as part of this, maybe one way to achieve this was if models could better estimate uncertainty and better estimate when they might be giving the right answer versus when they might be giving the wrong answer. And there's research that shows that if you take a pre-trained model and plot the confidence of the model versus the accuracy of the model, so the confidence is the predicted probability of the answer that it gives, and this is the actual accuracy of those answers on average."},{"start":1597.53,"text":"You see that it's actually very well calibrated, so that confidence actually reflects its accuracy really well. But then after post-training with reinforcement learning, we actually see that the model becomes far less calibrated. And so maybe reinforcement learning is actually, while it's making the model better, it's actually deteriorating some of the calibration that these models might have at the beginning."},{"start":1624.87,"text":"Perhaps one direction, there was some research by Tian et al that showed that if you verbalize the probability rather than using the probability, like the logits in the model, and encourage it to provide multiple guesses, then you can get more calibrated model performance after RLHF compared to the RLHF model."},{"start":1644.28,"text":"So maybe that's one possible direction. Even then, you need to figure out how this would interface with a human and then evaluate how it does when the human and model are working together. But yeah, this is, I think, an important open problem for thinking about how humans and AI systems are working together."},{"start":1663.98,"text":"And then even separate from that, a lot of AI systems are not going to have a human there at the end of the day that are checking all the answers. And this is true in autonomous driving, where a human isn't going to be always holding the steering wheel. This is true in robotics, where"},{"start":1678.35,"tex
