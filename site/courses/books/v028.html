过于急切地扩大了范围时，也可以是研究中的一个有用策略。好的，最后一点。","start":3569.29,"end":3596.22},{"id":202,"text":"If you're in a scenario where things really aren't working, you might decide whether or not you should pivot or whether or not you should start working on a different project.","zh":"如果你处于一个事情根本行不通的场景中，你可能会决定是否应该转向其他方向，或者是否应该开始从事一个不同的项目。","start":3596.83,"end":3603.69},{"id":203,"text":"Oftentimes, you'll consider this later than you should be considering this because you really want to get something to work. There's also this sunk cost fallacy where if you spent a lot of time on something, then it's very natural for humans to think that you'll spend less time on it in the future because you spent a lot of time on it in the past. This is a fallacy, not always true, and you might actually not have made as much progress on the problem than the time that you spent on it would suggest.","zh":"很多时候，你会比应该考虑这个问题的时候更晚地去考虑它，因为你真的很想让某些事情奏效。此外，还存在沉没成本谬误，即如果你在某件事上投入了很多时间，那么对于人类来说，自然会认为你将来会在这件事上投入更少的时间，因为你在过去投入了很多时间。这是一种谬误，不总是正确的，你实际上可能并没有在问题上取得与所花时间相称的进展。","start":3605.43,"end":3634.19}],"notes":["本段讲授了在研究项目中遇到困难时，如何通过调整项目范围来聚焦于当前方法能够有效处理的部分。讲者提到，当项目进展不顺利时，需要反思哪些部分是当前方法能够处理的，哪些部分是难以处理的，并据此重新定义项目范围，以避免资源浪费。","讲者以机器人遵循开放语言指令的项目为例，说明了如何通过重新定义项目范围，去除当前方法无法解决的复杂部分，专注于方法能够有效处理的交互。这种策略在研究中是实用的，尤其是在项目初期过于乐观地扩大范围时。","讲者进一步指出，当项目进展不顺利时，研究者可能会倾向于继续投入更多时间，但这种行为可能受到沉没成本谬误的影响。沉没成本谬误指的是人们倾向于因为已经投入了大量时间而继续投入，即使实际进展可能并不如预期。","讲者强调，沉没成本谬误并非总是成立，有时即使投入了大量时间，实际进展可能并不理想。因此，研究者需要在适当的时候考虑是否需要调整方向或转向其他项目。","讲者通过实际案例说明了项目范围调整的重要性，并指出这种策略在研究中是有效的，尤其是在面对复杂问题时，聚焦于当前方法能够处理的部分，可以提高研究效率。","最后，讲者总结了在研究中遇到困难时，需要考虑是否调整方向或转向其他项目，并提醒研究者注意沉没成本谬误的影响，避免因过度投入而忽视实际进展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3462.31,"end":3634.19,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3462.31,"text":"Maybe I'll also talk about a story for this. So there's scenarios where you're kind of trying to get something to work and it doesn't really want to work. It's not really easy to get it to work. And if it doesn't really want to work, then probably the idea won't be very impactful because if someone else is trying to get it to work and it also doesn't really easily work for them, then maybe the idea just wasn't really meant to be."},{"start":3488.75,"text":"And at one point we had this project where this is actually a fairly recent project where we were trying to get a robot to follow open-ended language commands. And like, can you clean up the trash but not the dishes? We also wanted to see if the robot could handle various interventions and follow lots of different prompts, for example. Then we kind of got some initial signs of life on that. And we're like, oh, well, maybe we could also get the robot to ask questions if the prompt is ambiguous."},{"start":3517.51,"text":"And we had all these kind of cool ideas for how we could incorporate this sort of open-ended language following in a robot system. And despite having kind of positive initial signs of life, after we introduced all those ideas, things weren't really working. And we kind of tried all sorts of... I don't know, we spent a couple months trying to get it to work. And then at some point we kind of went back and..."},{"start":3546.35,"text":"thought about, well, it was working before. What parts of this thing do work and what parts of these things are harder to get to work with our current method? And then we kind of re-scoped the project to remove the hard parts that we didn't know how to solve yet and to only consider the parts, the kind of interactions that our method did work with. And so..."},{"start":3569.29,"text":"It was an example where we picked the examples, we scoped the project to the source of things that the method wanted to work on, work easily on, and left the things that it didn't handle for future work. We described it as limitations in the paper. And so scoping down the project, especially if you kind of scoped it up a little bit too eagerly, can also be a useful strategy in research. Okay, last thing."},{"start":3596.83,"text":"If you're in a scenario where things really aren't working, you might decide whether or not you should pivot or whether or not you should start working on a different project."},{"start":3605.43,"text":"Oftentimes, you'll consider this later than you should be considering this because you really want to get something to work. There's also this sunk cost fallacy where if you spent a lot of time on something, then it's very natural for humans to think that you'll spend less time on it in the future because you spent a lot of time on it in the past. This is a fallacy, not always true, and you might actually not have made as much progress on the problem than the time that you spent on it would suggest."}],"speech_gaps":[],"frame":"../frames/v028/021.webp","frame_time":3474.31},{"title":"决策与研究趋势的平衡","segments":[{"id":204,"text":"Now, deciding when to pivot is really hard because you're often thinking about, should I continue working on my current project or should I switch to starting a new project? And this option of switching to a new project is really nebulous. This could mean a lot of different things. There's a lot of different things you might be doing. And so it's really hard to think about, should I be doing what I'm currently doing or should I do something else? Because something else could be anything.","zh":"现在，决定何时转换方向真的很难，因为你经常在思考，我应该继续当前的项目，还是应该转换到开始一个新项目？而转换到新项目的这个选项其实非常模糊。这可能意味着很多不同的事情。你可能会做很多事情，因此很难思考，我应该继续做我现在做的事情，还是应该做其他事情？因为其他事情可以是任何东西。","start":3637.83,"end":3662.55},{"id":205,"text":"And so one kind of mental trick for thinking about this sort of decision about whether to pivot is to change this decision and actually spend time thinking about other projects that you would do and then try to formulate the decision as continuing working on the current project versus working on project B or working on project C and so forth. And this decision is much more concrete, a lot more straightforward to think about, less anxiety-inducing, and so forth.","zh":"因此，对于这种是否转换方向的决策，一种心理上的技巧是改变这种决策，花时间思考你可能会做的其他项目，然后尝试将决策表述为继续当前项目，还是进行项目B，或者进行项目C等等。这种决策更加具体，思考起来也更直接，更少引起焦虑，等等。","start":3664.42,"end":3691.28},{"id":206,"text":"Yeah, so the question is, when research fields are moving really quickly, you might feel like, you might be worried that another group will do the same thing and then try to spend less time on the evaluation just to try to get the paper out faster. Is that a trend? What do I think about that? So, I mean, it's definitely like...","zh":"是的，所以问题是，当研究领域发展非常迅速时，你可能会感到担心，担心其他小组会做同样的事情，然后为了尽快发表论文而减少对评估的投入时间。这是一种趋势吗？我对这个问题有什么看法？我的意思是，这确实像……","start":3692.53,"end":3718.94},{"id":207,"text":"There's definitely papers that should be more thorough with the evaluation. That's true now. That's also been true in the past. I don't know if it's been getting worse per se. I think that...","zh":"确实有一些论文在评估方面应该更加彻底。这在现在是事实，过去也是如此。我不确定这是否变得更糟。我认为……","start":3719.53,"end":3736.4},{"id":208,"text":"If there is, like, a feeling to do that, I think, well, you really want to be confident about the results that you're putting out.","zh":"如果有一种想要这样做的感觉，我认为，你真的希望对自己的研究成果充满信心。","start":3737.23,"end":3743.05},{"id":209,"text":"And I think that if you're worried about being scooped, like, or another group doing something, like, there's, like, there is, like, an advantage to having, like, done some sort of idea first.","zh":"我认为，如果你担心被抢先发表，或者担心其他小组做同样的事情，那么，先提出某个想法确实有其优势。","start":3743.59,"end":3760.33},{"id":210,"text":"But there's also a lot of advantage to executing really well on a project.","zh":"但另一方面，对项目进行非常出色的执行也有很大的优势。","start":3760.61,"end":3765.11},{"id":211,"text":"and sometimes the projects that are executed on better","zh":"有时，执行得更好的项目","start":3765.11,"end":3768.07},{"id":212,"text":"are more impactful than the projects","zh":"这些项目的影响比那些在某个想法上率先进行的项目更大。","start":3768.07,"end":3770.43},{"id":213,"text":"that were like first at a particular idea.","zh":"所以，我的观点是，仍然要投入相当多的精力","start":3770.43,"end":3772.29},{"id":214,"text":"And so the, yeah, I guess my perspective is that","zh":"在执行和评估上。","start":3773.27,"end":3778.01},{"id":215,"text":"is just like still put a fair amount of focus","zh":"现在有很多事情可以进行评估。","start":3778.01,"end":3780.49},{"id":216,"text":"on execution and evaluation.","zh":"你可以在一个数据集上运行实验。","start":3780.49,"end":3782.65},{"id":217,"text":"Now there's many things you could evaluate.","zh":"因此，你想要做的事情是有一定限制的。","start":3783.07,"end":3785.01},{"id":218,"text":"You could run your experiments on 20 data sets.","zh":"你可以在20个数据集上运行你的实验。","start":3785.09,"end":3786.97},{"id":219,"text":"And so there's a limit to what do you want to do.","zh":"因此，你想要做的事情是有一定限制的。","start":3787.19,"end":3789.09},{"id":220,"text":"So I think that there's a balance","zh":"因此，我认为存在一种平衡","start":3790.51,"end":3792.49},{"id":221,"text":"and yeah, certainly there are some parts of the research field that move fast. One thing that","zh":"而且，当然，研究领域的一些部分发展得很快。我之所以喜欢真实机器人，是因为","start":3795.43,"end":3800.59},{"id":222,"text":"I've liked about real robots is that small, I guess, small enough people work with like real","zh":"小规模的团队可以与实际的硬件合作，你不必在很多方面过于担心这些硬件问题，尤其是当你在实际机器人上执行并展示结果时","start":3800.59,"end":3805.61},{"id":223,"text":"hardware that you have to worry, you can worry less about that in many ways, especially if you","zh":"所以，是的，但存在一种平衡","start":3805.61,"end":3810.49},{"id":224,"text":"execute on it and actually show the results on real robots. So yeah, but there's a balance and","zh":"而且，当然，研究领域的一些部分发展得很快。我之所以喜欢真实机器人，是因为","start":3810.49,"end":3816.93}],"notes":["本段讨论了在快速发展的研究领域中，研究人员在决定是否继续当前项目或转向新项目时面临的困难。讲者提到，这种决策过程常常模糊不清，因为‘转向新项目’可以指很多不同的事情，因此需要更具体的思考方式。","讲者建议通过思考其他可能的项目（如项目B或项目C）来具体化决策，这样可以减少焦虑并使决策更加清晰。这种思维技巧有助于将抽象的决策转化为更具体的比较。","讲者提到，在研究领域快速发展的背景下，研究人员可能会担心被其他团队抢先发表成果，因此可能会减少对评估的投入，以加快论文发表的速度。然而，讲者认为，这种做法并不总是合适的。","讲者指出，虽然在某些情况下，先提出一个想法可能有优势，但执行得更好的项目往往更具影响力。因此，讲者强调应将重点放在执行和评估上，而不是仅仅追求速度。","讲者提到，评估可以包括在多个数据集上运行实验，但需要在评估的深度和广度之间找到平衡。这表明，研究人员需要权衡评估的全面性和可行性。","最后，讲者提到在真实机器人研究中，小团队可以更专注于实际硬件的执行，从而减少对理论模型的依赖。这种实际执行的成果往往更具说服力，但也需要在研究速度和质量之间找到平衡。"],"formulas":[],"uncertainties":["projects that are executed on better","projects that were like first at a particular idea","small enough people work with like real","you can worry less about that in many ways","execute on it and actually show the results on real robots"],"diagram":"none","start":3637.83,"end":3816.93,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":3637.83,"text":"Now, deciding when to pivot is really hard because you're often thinking about, should I continue working on my current project or should I switch to starting a new project? And this option of switching to a new project is really nebulous. This could mean a lot of different things. There's a lot of different things you might be doing. And so it's really hard to think about, should I be doing what I'm currently doing or should I do something else? Because something else could be anything."},{"start":3664.42,"text":"And so one kind of mental trick for thinking about this sort of decision about whether to pivot is to change this decision and actually spend time thinking about other projects that you would do and then try to formulate the decision as continuing working on the current project versus working on project B or working on project C and so forth. And this decision is much more concrete, a lot more straightforward to think about, less anxiety-inducing, and so forth."},{"start":3692.53,"text":"Yeah, so the question is, when research fields are moving really quickly, you might feel like, you might be worried that another group will do the same thing and then try to spend less time on the evaluation just to try to get the paper out faster. Is that a trend? What do I think about that? So, I mean, it's definitely like..."},{"start":3719.53,"text":"There's definitely papers that should be more thorough with the evaluation. That's true now. That's also been true in the past. I don't know if it's been getting worse per se. I think that..."},{"start":3737.23,"text":"If there is, like, a feeling to do that, I think, well, you really want to be confident about the results that you're putting out."},{"start":3743.59,"text":"And I think that if you're worried about being scooped, like, or another group doing something, like, there's, like, there is, like, an advantage to having, like, done some sort of idea first."},{"start":3760.61,"text":"But there's also a lot of advantage to executing really well on a project."},{"start":3765.11,"text":"and sometimes the projects that are executed on better"},{"start":3768.07,"text":"are more impactful than the projects"},{"start":3770.43,"text":"that were like first at a particular idea."},{"start":3773.27,"text":"And so the, yeah, I guess my perspective is that"},{"start":3778.01,"text":"is just like still put a fair amount of focus"},{"start":3780.49,"text":"on execution and evaluation."},{"start":3783.07,"text":"Now there's many things you could evaluate."},{"start":3785.09,"text":"You could run your experiments on 20 data sets."},{"start":3787.19,"text":"And so there's a limit to what do you want to do."},{"start":3790.51,"text":"So I think that there's a balance"},{"start":3795.43,"text":"and yeah, certainly there are some parts of the research field that move fast. One thing that"},{"start":3800.59,"text":"I've liked about real robots is that small, I guess, small enough people work with like real"},{"start":3805.61,"text":"hardware that you have to worry, you can worry less about that in many ways, especially if you"},{"start":3810.49,"text":"execute on it and actually show the results on real robots. So yeah, but there's a balance and"}],"speech_gaps":[],"frame":"../frames/v028/022.webp","frame_time":3649.83},{"title":"分享研究成果的重要性","segments":[{"id":225,"text":"It's also good to work on things like language models and things that are hot too. Yeah, there's","zh":"做语言模型之类的事情也是很好的，而且这些领域也很热门。是的，有平衡性。","start":3816.93,"end":3822.03},{"id":226,"text":"of balance. Okay, so how to share your research. I talked about how this is really important.","zh":"那么如何分享你的研究成果。我谈到了这真的非常重要。","start":3822.03,"end":3830.37},{"id":227,"text":"Why is this really important?","zh":"为什么这真的非常重要？","start":3831.23,"end":3832.17},{"id":228,"text":"If you think about what is the output or the outcome of research, the output of research is essentially like ideas, knowledge, things that you learned from doing the research. It's not a product. It's not a service. It's really like knowledge. It's things that you learn. And if it were a product, then the high impact would mean that lots of people are using the product for good things.","zh":"如果你想想研究的输出或结果是什么，研究的输出本质上是想法、知识，以及你在做研究过程中学到的东西。它不是产品，也不是服务，它更像是知识，是你学到的东西。如果它是产品，那么高影响力意味着很多人在使用这个产品做有益的事情。","start":3833.54,"end":3860.02},{"id":229,"text":"But since it's more like knowledge, if no one knows about what you learned, then there was really like no impact or no output as a result. And even for companies that have products and services, they have massive marketing efforts to try to get those products out. And so for your work to have impact, you need to share it and you need people to know about it. Otherwise, it won't have had impact.","zh":"但因为更像是知识，如果没有人知道你学到了什么，那么实际上就没有影响力或输出结果。而且对于有产品和服务的公司来说，他们投入大量营销努力来推广这些产品。因此，为了让你的工作产生影响力，你需要分享它，并且需要人们知道它。否则，它就不会产生影响力。","start":3860.6,"end":3881.64},{"id":230,"text":"So there can be reasons to not be excited about sharing work. You can say maybe it feels like self-promotion. Maybe the idea didn't work that well. So I'm not that excited about sharing it. Maybe it's like it seems all obvious, like all of it seems obvious to you now. And so why do you need to share it? But even if it feels like self-promotion, you're teaching people, you're sharing cool new findings. And you can think about it as more actually doing a service to them to teach them something new and useful and interesting.","zh":"所以，可能有不兴奋于分享工作的理由。你可以说也许这感觉像是自我宣传。也许这个想法并没有很好地工作，因此我不太兴奋于分享它。也许它看起来似乎很明显，所有的东西对你来说现在都很明显。那么你为什么需要分享它呢？但即使它感觉像是自我宣传，你是在教别人，你在分享一些有趣的新发现。你可以把它看作实际上是在为他们做服务，教他们一些新奇、有用和有趣的东西。","start":3884.38,"end":3910.7},{"id":231,"text":"Even if it didn't work that well, it's really useful to share because other people might think of that idea and might want to know how well did it work and did it work in certain circumstances more better than other circumstances.","zh":"即使它并没有很好地工作，分享它也是非常有用的，因为其他人可能会想到这个想法，并且想知道它在哪些情况下表现得更好，或者它在某些情况下是否比其他情况下更有效。","start":3911.43,"end":3922.97},{"id":232,"text":"And then, yeah, after enough research, you're going to know a lot more than other people.","zh":"然后，经过足够的研究，你将比其他人知道得更多。","start":3923.81,"end":3927.15},{"id":233,"text":"There will be things that seem really obvious to you that are not obvious to other people.","zh":"有些事情对你来说可能看起来非常显而易见，但对其他人却未必如此。","start":3927.71,"end":3931.51},{"id":234,"text":"And it's good to still share those things and think about what's actually obvious, what actually other people don't know, so that you can kind of share the things that you have learned, especially the most important things with them.","zh":"仍然分享这些事情并思考什么真正显而易见，什么其他人实际上并不知道，这样你就可以与他们分享你所学到的东西，尤其是最重要的内容。","start":3931.51,"end":3943.91},{"id":235,"text":"Now, I mean, I could probably give an entire lecture on presenting research and writing and presentations and so forth.","zh":"我可能可以就如何呈现研究、撰写和展示等内容进行整整一堂讲座。","start":3947.55,"end":3954.43},{"id":236,"text":"But yeah, having really clear writing,","zh":"但总之，拥有非常清晰的写作，","start":3954.93,"end":3956.69},{"id":237,"text":"really clear visuals, really clear presentations.","zh":"非常清晰的视觉呈现，非常清晰的展示。","start":3956.85,"end":3958.73},{"id":238,"text":"Communicating clearly is really, really important.","zh":"清晰地沟通真的非常重要。","start":3959.81,"end":3961.43},{"id":239,"text":"If they don't understand what you're saying,","zh":"如果他们不理解你在说什么，","start":3961.87,"end":3963.51},{"id":240,"text":"then they won't understand the knowledge.","zh":"他们就不会理解你所传达的知识。","start":3963.67,"end":3965.89},{"id":241,"text":"It's important to think about their audience","zh":"要考虑到他们的受众","start":3966.59,"end":3968.13},{"id":242,"text":"and how they will interpret what you say, what they know.","zh":"以及他们如何理解你所说的话，他们知道什么。","start":3968.13,"end":3970.37},{"id":243,"text":"When in doubt, assume that your audience knows less","zh":"在不确定的情况下，应假设你的受众知道得更少","start":3970.79,"end":3973.29},{"id":244,"text":"rather than more.","zh":"而不是更多。","start":3973.73,"end":3974.57},{"id":245,"text":"This can actually be a little bit tricky to do.","zh":"这实际上可能有点难以做到。","start":3974.99,"end":3977.05},{"id":246,"text":"It's good to avoid jargon if possible.","zh":"如果可能的话，最好避免使用行话。","start":3977.09,"end":3978.93},{"id":247,"text":"They might know the jargon,","zh":"他们可能知道这些行话，","start":3979.17,"end":3980.25},{"id":248,"text":"but if there's ways to avoid it,","zh":"但如果有可能避免使用，那就更好。","start":3980.37,"end":3982.45},{"id":249,"text":"then it makes it more accessible.","zh":"那么它就会更加易于理解。","start":3982.49,"end":3983.57},{"id":250,"text":"And even if they do know a lot of what you're going to say, a lot of people still appreciate","zh":"即使他们知道你将要说的很多内容，很多人仍然会欣赏","start":3984.71,"end":3988.83},{"id":251,"text":"refreshers, especially if those refreshers are clear and it might actually cause them","zh":"复习，尤其是当这些复习内容清晰时，可能会让他们","start":3989.69,"end":3993.79},{"id":252,"text":"to think about something that they know in a new way.","zh":"以一种新的方式思考他们已知的内容。","start":3993.79,"end":3995.79}],"notes":["本段讨论了研究成果分享的重要性，指出研究成果本质上是知识而非产品或服务，因此需要通过分享来产生影响。如果研究成果不被他人知晓，就无法产生实际影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3816.93,"end":3995.79,"asr_flags":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":3816.93,"text":"it's also good to work on things like language models and things that are hot too. Yeah, there's"},{"start":3822.03,"text":"of balance. Okay, so how to share your research. I talked about how this is really important."},{"start":3831.23,"text":"Why is this really important?"},{"start":3833.54,"text":"If you think about what is the output or the outcome of research, the output of research is essentially like ideas, knowledge, things that you learned from doing the research. It's not a product. It's not a service. It's really like knowledge. It's things that you learn. And if it were a product, then the high impact would mean that lots of people are using the product for good things."},{"start":3860.6,"text":"But since it's more like knowledge, if no one knows about what you learned, then there was really like no impact or no output as a result. And even for companies that have products and services, they have massive marketing efforts to try to get those products out. And so for your work to have impact, you need to share it and you need people to know about it. Otherwise, it won't have had impact."},{"start":3884.38,"text":"So there can be reasons to not be excited about sharing work. You can say maybe it feels like self-promotion. Maybe the idea didn't work that well. So I'm not that excited about sharing it. Maybe it's like it seems all obvious, like all of it seems obvious to you now. And so why do you need to share it? But even if it feels like self-promotion, you're teaching people, you're sharing cool new findings. And you can think about it as more actually doing a service to them to teach them something new and useful and interesting."},{"start":3911.43,"text":"Even if it didn't work that well, it's really useful to share because other people might think of that idea and might want to know how well did it work and did it work in certain circumstances more better than other circumstances."},{"start":3923.81,"text":"And then, yeah, after enough research, you're going to know a lot more than other people."},{"start":3927.71,"text":"There will be things that seem really obvious to you that are not obvious to other people."},{"start":3931.51,"text":"And it's good to still share those things and think about what's actually obvious, what actually other people don't know, so that you can kind of share the things that you have learned, especially the most important things with them."},{"start":3947.55,"text":"Now, I mean, I could probably give an entire lecture on presenting research and writing and presentations and so forth."},{"start":3954.93,"text":"But yeah, having really clear writing,"},{"start":3956.85,"text":"really clear visuals, really clear presentations."},{"start":3959.81,"text":"Communicating clearly is really, really important."},{"start":3961.87,"text":"If they don't understand what you're saying,"},{"start":3963.67,"text":"then they won't understand the knowledge."},{"start":3966.59,"text":"It's important to think about their audience"},{"start":3968.13,"text":"and how they will interpret what you say, what they know."},{"start":3970.79,"text":"When in doubt, assume that your audience knows less"},{"start":3973.73,"text":"rather than more."},{"start":3974.99,"text":"This can actually be a little bit tricky to do."},{"start":3977.09,"text":"It's good to avoid jargon if possible."},{"start":3979.17,"text":"They might know the jargon,"},{"start":3980.37,"text":"but if there's ways to avoid it,"},{"start":3982.49,"text":"then it makes it more accessible."},{"start":3984.71,"text":"And even if they do know a lot of what you're going to say, a lot of people still appreciate"},{"start":3989.69,"text":"refreshers, especially if those refreshers are clear and it might actually cause them"},{"start":3993.79,"text":"to think about something that they know in a new way."}],"speech_gaps":[{"start":3945.584,"end":3947.15}],"frame":"../frames/v028/023.webp","frame_time":3828.93},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":253,"text":"Other ways to get better at this, just practicing. Practicing writing, practicing giving presentations. You can practice alone. You can practice with other people if it's a presentation. And then just try to get feedback. Try to get honest feedback from people and improve with the feedback.","zh":"提高这方面能力的其他方法就是练习。练习写作，练习做演讲。你可以独自练习，也可以在需要做演讲时与他人一起练习。然后，尝试获取反馈。努力从他人那里获得诚实的反馈，并根据反馈进行改进。","start":3997.2,"end":4011.5},{"id":254,"text":"You might also, like, when trying to write a paper or when trying to create a slide deck or something, it's easy to, like, get a little bit overwhelmed by how much you have to do and where even to get started on that. I find it really helpful to break down the task. And even on, like, a pen and paper, just, like, write down some ideas for how I want to do it. Maybe write down an outline. My recommendation would be to think through your ideas for what you want to communicate before asking your friend, before asking your friend chat GPT.","zh":"你可能在尝试撰写论文或制作幻灯片时，会感到有些不知所措，因为需要完成的事情很多，甚至不知道从哪里开始。我发现将任务分解是有帮助的。即使只是在纸上，也可以写下一些关于如何完成的思路。也许写下一份大纲。我的建议是，在向朋友或朋友聊天机器人寻求帮助之前，先仔细思考你想要传达的内容。","start":4015.29,"end":4042.53},{"id":255,"text":"Cool. And then a couple of miscellaneous things. First is mentorship. I think mentorship can play a huge role in research. And if you have it, don't be afraid to lean on it. In my first research paper in my PhD, I hardly wrote any of the paper. And I talked to actually my co-author, and he told me that he actually even rewrote the section that I wrote.","zh":"好，还有一些杂项。首先是导师指导。我认为导师指导在研究中可以发挥巨大作用。如果你有导师，不要害怕依靠他们。在我博士阶段的第一篇研究论文中，我几乎没写任何内容。我甚至和我的合著者交谈，他告诉我，他甚至重写了我写的那一部分。","start":4044.37,"end":4067.05},{"id":256,"text":"And so it's okay to not know everything and not know how to do every part of the research process and lean on other people for the things that you don't know how to do yet. Generally, I've seen students and myself do most successful when they're learning more gradually and when they're not trying to take on everything themselves because doing novel research and writing a paper about it and presenting it.","zh":"因此，不知道一切以及不知道如何完成研究过程的每一个部分是正常的，你可以依靠他人来完成你目前还不知道如何做的事情。一般来说，我看到学生和我自己在逐步学习时取得的成果最为显著，而他们并不试图独自承担所有事情，因为进行新颖的研究、撰写论文并进行展示是一项巨大的任务。","start":4068.83,"end":4090.49},{"id":257,"text":"Picking a problem, like all of that is a really, really huge undertaking. And it's useful to lean on other people as you're trying to learn how to do that. Cool. And then confidence. So there's a lot of reasons to lack confidence in research.","zh":"选择一个研究问题，所有这些都是一项非常巨大的任务。在你尝试学习如何做到这一点时，依靠他人是有用的。好，然后是自信。在研究中缺乏自信有很多原因。","start":4091.07,"end":4106.8},{"id":258,"text":"No one knows how to do research right now. No one knows what research is going to be most impactful. If they did, it wouldn't be research. Many ideas don't work. Many papers get rejected. Many researchers have been thinking about a domain for many years, and they will be smarter than you in that domain because they've been thinking about it for many years. And so it's easy to think that you know very little, that you have been rejected many times, that a lot of your ideas don't work, because all of those things are kind of true.","zh":"现在没有人知道如何做研究。没有人知道哪些研究会最有影响力。如果他们知道了，那就不是研究了。很多想法行不通。很多论文被拒稿。很多研究人员已经多年思考某个领域，他们在该领域会比你更聪明，因为他们已经思考了多年。因此，很容易认为你了解很少，认为你被多次拒稿，认为你的很多想法都不行，因为所有这些事情在某种程度上都是真实的。","start":4107.62,"end":4137.17},{"id":259,"text":"but that doesn't mean that you're actually doing a bad job at research. And confidence is really important. If you're not confident, if you're second-guessing, overthinking things, it can really slow you down. And even though these things are challenging, they're actually not reasons to be unconfident. And then lastly, some closing thoughts. Maybe since you're all here, you're eager to do research, and so maybe I don't need to say this,","zh":"但这并不意味着你实际上在做研究时表现不好。自信真的很重要。如果你缺乏自信，如果你反复怀疑，过度思考，这真的会减慢你的进度。尽管这些事情具有挑战性，但它们实际上并不是不自信的理由。最后，一些结束的感想。也许因为你们都在这里，你们渴望做研究，所以也许我不需要再说这些了。","start":4137.73,"end":4167.76}],"notes":["本段主要讨论了如何提高研究和写作能力，包括通过练习、获取反馈、分解任务、寻求导师指导以及建立自信等方法。讲者强调了在研究过程中寻求他人帮助的重要性，尤其是在面对复杂任务时，分解任务和先构思想法是关键步骤。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3997.2,"end":4167.76,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3997.2,"text":"Other ways to get better at this, just practicing. Practicing writing, practicing giving presentations. You can practice alone. You can practice with other people if it's a presentation. And then just try to get feedback. Try to get honest feedback from people and improve with the feedback."},{"start":4015.29,"text":"You might also, like, when trying to write a paper or when trying to create a slide deck or something, it's easy to, like, get a little bit overwhelmed by how much you have to do and where even to get started on that. I find it really helpful to break down the task. And even on, like, a pen and paper, just, like, write down some ideas for how I want to do it. Maybe write down an outline. My recommendation would be to think through your ideas for what you want to communicate before asking your friend, before asking your friend chat GPT."},{"start":4044.37,"text":"Cool. And then a couple of miscellaneous things. First is mentorship. I think mentorship can play a huge role in research. And if you have it, don't be afraid to lean on it. In my first research paper in my PhD, I hardly wrote any of the paper. And I talked to actually my co-author, and he told me that he actually even rewrote the section that I wrote."},{"start":4068.83,"text":"And so it's okay to not know everything and not know how to do every part of the research process and lean on other people for the things that you don't know how to do yet. Generally, I've seen students and myself do most successful when they're learning more gradually and when they're not trying to take on everything themselves because doing novel research and writing a paper about it and presenting it."},{"start":4091.07,"text":"Picking a problem, like all of that is a really, really huge undertaking. And it's useful to lean on other people as you're trying to learn how to do that. Cool. And then confidence. So there's a lot of reasons to lack confidence in research."},{"start":4107.62,"text":"No one knows how to do research right now. No one knows what research is going to be most impactful. If they did, it wouldn't be research. Many ideas don't work. Many papers get rejected. Many researchers have been thinking about a domain for many years, and they will be smarter than you in that domain because they've been thinking about it for many years. And so it's easy to think that you know very little, that you have been rejected many times, that a lot of your ideas don't work, because all of those things are kind of true."},{"start":4137.73,"text":"but that doesn't mean that you're actually doing a bad job at research. And confidence is really important. If you're not confident, if you're second-guessing, overthinking things, it can really slow you down. And even though these things are challenging, they're actually not reasons to be unconfident. And then lastly, some closing thoughts. Maybe since you're all here, you're eager to do research, and so maybe I don't need to say this,"}],"speech_gaps":[],"frame":"../frames/v028/024.webp","frame_time":4009.2},{"title":"深度强化学习前沿（Frontiers）","segments":[{"id":260,"text":"In terms of the time that we're in right now, I think that you might kind of feel like reinforcement learning works now to some extent. And so maybe we don't need to do research. Maybe we can just use the thing that works and apply it in all sorts of circumstances. And there's a lot of merit to applying research in the real world.","zh":"就我们现在所处的时代而言，我觉得你可能会觉得强化学习在某种程度上已经奏效了。因此，也许我们不需要再做研究了。也许我们只需使用那些已经奏效的方法，并将其应用于各种情境中。将研究成果应用于现实世界有很多价值。","start":4169.6,"end":4192.87},{"id":261,"text":"It's good for some people to do that. But at the same time, I think that now is like a better time than ever to do research because we are actually seeing new research being translated into very real world impact. And like a lot of the big breakthroughs like AlphaFold, like ChatGPT and so forth, there are things that are...","zh":"对某些人来说，这样做是好的。但与此同时，我认为现在比以往任何时候都是进行研究的更好时机，因为我们实际上正在看到新的研究成果转化为非常现实的影响。像AlphaFold、ChatGPT等重大突破，都是这样的例子。","start":4194.14,"end":4212.68},{"id":262,"text":"And compared to the breakthroughs of 10 years ago or 20 years ago, these are things that are actually leading to really massive impact in the world today. And if you work on research now, you can help contribute to those kinds of new breakthroughs that will have even more impact in the future compared to if you were doing research 10 or 20 years ago. So I think that now is actually a better time than ever to be doing research, including in deep reinforcement learning. So yeah, those are my final thoughts.","zh":"与十年前或二十年前的突破相比，这些成果正在今天引领巨大的世界影响。如果你现在从事研究，你将能够帮助促成那些未来影响会比十年前或二十年前的研究更大的新突破。因此，我认为现在实际上比以往任何时候都是进行研究的更好时机，包括在深度强化学习领域。所以，这就是我的最终想法。","start":4213.76,"end":4243.04}],"notes":["本段讨论了当前强化学习在实际应用中的成效，指出虽然已有成果，但研究仍具有重要价值。讲者强调当前是进行研究的最佳时机，因为新研究成果正在转化为现实世界的影响，如AlphaFold和ChatGPT等突破性技术。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4169.6,"end":4243.04,"asr_flags":[],"translation_complete":true,"translated_segments":3,"raw_segments":[{"start":4169.6,"text":"In terms of the time that we're in right now, I think that you might kind of feel like reinforcement learning works now to some extent. And so maybe we don't need to do research. Maybe we can just use the thing that works and apply it in all sorts of circumstances. And there's a lot of merit to applying research in the real world."},{"start":4194.14,"text":"It's good for some people to do that. But at the same time, I think that now is like a better time than ever to do research because we are actually seeing new research being translated into very real world impact. And like a lot of the big breakthroughs like AlphaFold, like ChatGPT and so forth, there are things that are..."},{"start":4213.76,"text":"And compared to the breakthroughs of 10 years ago or 20 years ago, these are things that are actually leading to really massive impact in the world today. And if you work on research now, you can help contribute to those kinds of new breakthroughs that will have even more impact in the future compared to if you were doing research 10 or 20 years ago. So I think that now is actually a better time than ever to be doing research, including in deep reinforcement learning. So yeah, those are my final thoughts."}],"speech_gaps":[],"frame":"../frames/v028/025.webp","frame_time":4181.6}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v028.mp4"}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
