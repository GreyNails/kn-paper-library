在求解优化问题时的计算过程，指出牛顿步的计算本质上是线性代数操作。这表明牛顿法在每一步迭代中都依赖于线性代数的计算，从而将非线性优化问题转化为一系列线性问题。","牛顿法在二次函数上的表现非常出色，这是因为牛顿法利用了目标函数的二阶导数（Hessian矩阵）来构造局部二次近似。当接近最优解时，Hessian矩阵的变化较小，因此近似更加准确。","牛顿法的收敛性依赖于高阶导数，特别是三阶导数。三阶导数反映了二阶导数的变化率，当三阶导数较小时，牛顿法的收敛速度会显著提高。","当三阶导数为零时，函数在该点附近表现为二次函数，这意味着牛顿法在该点附近会表现出极高的收敛性。然而，三阶导数在高维空间中的定义较为复杂，通常涉及三线性形式。","在高维空间中，三阶导数的计算和解释比一维情况更加复杂，这与数学教育中对高阶导数的处理方式有关。因此，三阶导数在实际应用中可能需要更谨慎的处理。","牛顿法的收敛性不仅依赖于目标函数的性质，还依赖于Hessian矩阵的变化情况。当Hessian矩阵变化缓慢时，牛顿法的性能会更好，这在实际优化问题中是一个重要的考虑因素。"],"formulas":[{"latex":"H(x) = \\nabla^2 f(x)","symbols":"Hessian矩阵","explanation":"公式正确，H(x)表示函数f(x)在点x处的Hessian矩阵，符合数学定义。","evidence":"which was the Hessian at the solution, right? Instead, you use the Hessian where you are, right? And by the way, that also explains why this is going to do really well as you get closer"},{"latex":"f(x) \\text{ is quadratic} \\rightarrow f''(x) = \\text{constant}","symbols":"二次函数的二阶导数为常数","explanation":"公式正确，二次函数的二阶导数为常数，符合数学定义。","evidence":"It's quadratic. So all of us should be expecting it's a third derivative. Now, the third derivative of a function on R is something none of us should be afraid of. Third derivative of a function on Rn is something... This has to do with weirdness, has to do with our education in mathematics. We should all avoid. It's a trilinear form."}],"uncertainties":["trilinear form"],"diagram":"none","start":1656.67,"end":1828.05,"asr_flags":[73],"math_clarifications":["无需要特别说明的数学修复。"],"boards":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":1656.67,"text":"or, you know, banded or sparse. And we'll talk about all that later, right? But so what it says is, so, I mean, one way to say it is computing a Newton step is basically linear algebra. We, you know, a fair amount of linear algebra by now, you know, at least the beginnings of it."},{"start":1676.03,"text":"And it says it's just linear algebra. So we've kind of reduced solving a problem when you're doing Newton's method to a sequence of problems. In each step, you use linear algebra. Everybody, that's kind of cool. Okay, let's get back to it. Okay, so we established that Newton's method works shockingly well for quadratic functions. So what's really going to affect Newton's method, actually, is..."},{"start":1701.94,"text":"how well, remember how this all went. It all went this way. You wanted to use the metric,"},{"start":1706.52,"text":"which was the Hessian at the solution, right? Instead, you use the Hessian where you are,"},{"start":1714.76,"text":"right? And by the way, that also explains why this is going to do really well as you get closer"},{"start":1719.22,"text":"and closer, because that approximation is going to get better and better, okay? So that's what's"},{"start":1724.0,"text":"going to, that's, so when, you know, when you're in, when you're here, you know, right, when you're"},{"start":1728.5,"text":"right close to, let's say, if this is a maximum likelihood problem, if you're right close"},{"start":1732.0,"text":"to the parameters, then the Newton method's going to give you essentially an extremely"},{"start":1738.58,"text":"good estimate of the parameter on the next step. Everybody got this? Okay, so what it"},{"start":1749.58,"text":"depends on is actually the third derivative, if you think about it carefully. It's the"},{"start":1756.92,"text":"third derivative that matters, right? Because the third derivative tells you how much the second"},{"start":1763.54,"text":"derivative changes when you move. That's what the third derivative is, right? So if the third"},{"start":1769.04,"text":"derivative of a function is small, then our intuition is that Newton's method should work"},{"start":1773.12,"text":"unbelievably well. And someone would say, why? And you'd say, well, because it's getting close"},{"start":1778.34,"text":"to what you really wanted to do, which was to use"},{"start":1781.34,"text":"change coordinates, or however you use a metric which was aligned with the Hessian, defined by the Hessian at the optimum, you'd say, but you're not at the optimum. Yeah, but the Hessian changes very slowly. So, I mean, there's not more to what I'm saying. This is not deep. Everybody got this? So, and you know, here's an extreme case of a third derivative being small. It's zero. What does it mean if a third derivative is zero?"},{"start":1805.26,"text":"It's quadratic. So all of us should be expecting it's a third derivative. Now, the third derivative of a function on R is something none of us should be afraid of. Third derivative of a function on Rn is something... This has to do with weirdness, has to do with our education in mathematics. We should all avoid. It's a trilinear form."}],"speech_gaps":[],"frame":"../frames/v014/011.webp","frame_time":1668.67},{"title":"张量与高阶导数的处理","segments":[{"id":82,"text":"Right. So, you know, if you're cool with tensors, people in mechanical engineering can do this very well. A lot of people in physics can do it because they're used to working with higher order tensors. They don't have friends and they're like, they don't scare me. Like, what do you mean? I'm like, there's three indices and they're like, yeah. And so I just anyway, I'm just saying unless you have it come from some weird fields. Right.","zh":"对的。所以，如果你对张量感到自在，机械工程领域的人可以很好地处理这些问题。很多物理学家也能处理，因为他们习惯于处理高阶张量。他们没有朋友，也不怕我。比如，你是什么意思？我就像，有三个指标，他们就说，是的。所以，我就是说，除非你来自一些奇怪的领域，否则不会这样。","start":1828.85,"end":1851.35},{"id":83,"text":"Then where you do handle these kinds of things, then it's complicated. For the rest of us who have this weird education where we were trained about matrices, that would include me, then we get very uncomfortable when we go above two indices. Everybody following this? If you're in that, are you in one of these fields?","zh":"那么，当你处理这类问题时，它就变得复杂了。对于其余像我们这样接受过矩阵训练的人，包括我自己，当我们超过两个指标时就会非常不自在。大家跟上来了吗？如果你属于这种情况，你是在这些领域之一吗？","start":1851.81,"end":1872.65},{"id":84,"text":"Which one? Physics. There you go, physics. See? And they laugh at us, and they say, well, that's contravariant, that's covariant, and I don't care how many of these Einstein notes. It's fine. It's totally fine. It's fine. So it wouldn't bother you to take... Yeah, how about this? How about the third derivative of the log determinant of a positive definite matrix? You can pretend to visualize it.","zh":"哪个领域？物理。就是这样，物理。你看，他们嘲笑我们，说，那是反对变的，那是共变的，我不在乎有多少个爱因斯坦的笔记。没关系，完全没关系。没关系。所以，你不会觉得困扰去计算……是的，那是什么？那是什么？比如说，正定矩阵的对数行列式的三阶导数？你可以假装可视化它。","start":1874.37,"end":1896.26},{"id":85,"text":"Okay, good. Okay, so yeah. I mean, that's some crazy trilinear form that's got six indices, right? Because the original thing is indexed by two. Anyway, fine. All right, so actually it turns out all we need to express is that the third derivative is small. So we're not going to actually work with...","zh":"好的，好的。所以，是的。我的意思是，这是某种疯狂的三线性形式，有六个指标，对吧？因为原来的东西是两个指标。不管怎样，没关系。好的，实际上，我们只需要表达的是三阶导数很小。所以我们不会实际处理……","start":1898.22,"end":1917.64},{"id":86,"text":"third derivatives in trilinear forms. And we're certainly not going to talk about the third derivative of, let's say, the negative log determinant of a positive definite matrix, which, I mean, I could write it out. I can write out all the partial derivatives. I know where they are. I just don't want to write it down.","zh":"三阶导数在三线性形式中的情况。我们当然不会谈论，比如说，正定矩阵的负对数行列式的三阶导数，我意思是，我可以把它写出来。我可以写出所有的偏导数。我知道它们在哪里。我只是不想写出来。","start":1917.95,"end":1933.11},{"id":87,"text":"Because of my training. So that's fine. Okay. Okay. So instead, this is often expressed as a Lipschitz constant, right? So this is cool. This we can do, right? If I take the two norm of the difference of the two Hessians, right? And I say that that's less than L, right? So it has a Lipschitz constant of L. Then that's basically the same as saying that the norm of this","zh":"因为我的训练。所以没关系。好的。好的。相反，这通常被表达为一个Lipschitz常数，对吧？这很酷。我们可以做到，对吧？如果我取两个Hessian矩阵之差的二范数，对吧？并说这个小于L，对吧？所以它有一个Lipschitz常数L。这基本上等同于说这个的范数","start":1933.72,"end":1959.3},{"id":88,"text":"trilinear form, which is the third derivative, is less than L. And this avoids us having to get a headache because there's three indices and all that kind of stuff. Everybody following this? And besides, this is kind of what you want, right? So you should imagine that if that condition holds and L is small, Newton's method should work really well. Because it says, actually that literally says the Hessian doesn't change much as you move.","zh":"三线性形式，也就是三阶导数，小于L。这避免了我们因为有三个指标而感到头疼。大家跟上了吗？而且，这正是你想要的，对吧？所以你应该想象，如果这个条件成立且L很小，牛顿法应该会表现得非常好。因为它实际上说的是，当你移动时，Hessian矩阵不会发生太大变化。","start":1960.4,"end":1986.68},{"id":89,"text":"And that's the key to Newton's method working really well. Everybody following this? Okay. So here you have some Lipschitz constant there. We'll assume that. And then the way... I won't go through the...","zh":"而这正是牛顿法表现良好的关键。大家跟上了吗？好的。这里你有一些Lipschitz常数。我们将假设这一点。然后，我不会详细讲解……","start":1987.4,"end":2005.96}],"notes":["本段主要讨论了张量和高阶导数在不同学科中的处理方式。机械工程和物理领域的学者由于长期接触高阶张量，因此对处理多索引的张量更为熟练。而大多数受过矩阵训练的人则在面对超过两个索引的张量时会感到不适。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1828.85,"end":2005.96,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1828.85,"text":"Right. So, you know, if you're if you're cool with tensors, people in mechanical engineering can do this very well. A lot of people in physics can do it because they're used to working with higher order tensors. They don't have friends and they're like, they don't they don't scare me. Like, what do you mean? I'm like, there's three indices and they're like, yeah. And so I just anyway, I'm just saying unless you have it come from some weird fields. Right."},{"start":1851.81,"text":"then where you do handle these kinds of things, then it's complicated. For the rest of us who have this weird education where we were trained about matrices, that would include me, then we get very uncomfortable when we go above two indices. Everybody following this? If you're in that, are you in one of these fields?"},{"start":1874.37,"text":"Which one? Physics. There you go, physics. See? And they laugh at us, and they say, well, that's contravariant, that's covariant, and I don't care how many of these Einstein notes. It's fine. It's totally fine. It's fine. So it wouldn't bother you to take... Yeah, how about this? How about the third derivative of the log determinant of a positive definite matrix? You can pretend to visualize it."},{"start":1898.22,"text":"Okay, good. Okay, so yeah. I mean, that's some crazy trilinear form that's got six indices, right? Because the original thing is indexed by two. Anyway, fine. All right, so actually it turns out all we need to express is that the third derivative is small. So we're not going to actually work with..."},{"start":1917.95,"text":"third derivatives in trilinear forms. And we're certainly not going to talk about the third derivative of, let's say, the negative log determinant of a positive definite matrix, which, I mean, I could write it out. I can write out all the partial derivatives. I know where they are. I just don't want to write it down."},{"start":1933.72,"text":"because of my training. So that's fine. Okay. Okay. So instead, this is often expressed as a Lipschitz constant, right? So this is cool. This we can do, right? If I take the two norm of the difference of the two Hessians, right? And I say that that's less than L, right? So it has a Lipschitz constant of L. Then that's basically the same as saying that the norm of this"},{"start":1960.4,"text":"trilinear form, which is the third derivative, is less than L. And this avoids us having to get a headache because there's three indices and all that kind of stuff. Everybody following this? And besides, this is kind of what you want, right? So you should imagine that if that condition holds and L is small, Newton's method should work really well. Because it says, actually that literally says the Hessian doesn't change much as you move."},{"start":1987.4,"text":"And that's the key to Newton's method working really well. Everybody following this? Okay. So here you have some Lipschitz constant there. We'll assume that. And then the way... I won't go through the..."}],"speech_gaps":[],"frame":"../frames/v014/012.webp","frame_time":1840.85},{"title":"牛顿法的收敛性分析","segments":[{"id":90,"text":"you know, showing, I mean, if you read the book, it's not even that long, but it's not the kind of thing I think that should be done in public, is to walk through a proof of this kind of stuff, because it's just, I don't get it. But here, the main point is, the outline is actually pretty cool. It basically says this, if the norm of the gradient, there's a number, and it says if the norm of the gradient is bigger than that number, then it guarantees, it absolutely guarantees a fixed decrease in the function, right? That's cool, right?","zh":"你知道，展示，我的意思是，如果你读过这本书，它其实并不长，但并不是我認為應該在公共場合展示的東西，比如走過這樣證明的過程，因為這只是，我搞不懂。但這裡的主要點是，這個大綱其實相當有趣。它基本上說的是，如果梯度的範數，有一個數字，它說如果梯度的範數大於這個數字，那麼它保證，它絕對保證函數值有一個固定的減少，對吧？這很有趣，對吧？","start":2006.38,"end":2033.59},{"id":91,"text":"Once the gradient gets less than that number, then you get something crazy, which is that, I mean, ignore the constants, but basically the norm at the next, the norm of the gradient, which is like, you know, how small, you know, how close are you to optimal? That is less than or equal to this. It's less, it's actually like this goes like the square at most, right? Now to visualize what happens, you know, once the error is like, you know, 0.1 on the next step, it's 0.01.","zh":"一旦梯度變得小於這個數字，你會得到一個很奇怪的結果，我的意思是，忽略常數，但基本上下一個梯度的範數，也就是說，你離最佳解有多近，這個值會小於或等於這個數。它會更小，實際上它會以平方的速度減少，對吧？為了形象化地看這個情況，你知道，一旦誤差在下一步是0.1，那麼下一步就會是0.01。","start":2034.51,"end":2063.01},{"id":92,"text":"On the next step, it's 0.001. Wait, did I do that right? No. 0.001, right? Next time, it's 1e-8. And on the next step, it's 1e-16. And now we're at floating point precision and we stop. Everybody follow this? And if you remember linear convergence from the gradient method, linear, I mean, it's a weird name. Linear was...","zh":"在下一步，它會是0.001。等等，我這樣做對嗎？不，是0.001，對吧？下一次，它會是1e-8。而在下一步，它會是1e-16。現在我們已經達到浮點精度並停止了。大家跟得上嗎？如果你記得梯度法中的線性收斂，線性，我的意思是，這個名字很奇怪。線性是在對數精度的垂直軸和迭代次數的圖上，這表示你每一步都會有固定的改進。而這種改進通常相當糟糕，對吧？比如你將誤差乘以0.99。所以你必須將這些東西乘以0.99很長時間才能得到1e-6。大家跟得上嗎？這會加速。準確度每一步都會翻倍。","start":2063.97,"end":2086.63},{"id":93,"text":"on a log accuracy vertical axis and number of iterations, what that says is you kind of get a constant improvement each step. And the improvement is usually rather pathetic, right? Like you multiply your error by 0.99. So you have to multiply things by 0.99 for a long time until you get 1e-6. Everybody following this? This accelerates. The accuracy doubles every step.","zh":"在以对数准确率为纵轴、迭代次数为横轴的坐标系中，这说明你每一步都获得大致恒定的改进。而这种改进通常相当微弱，对吧？比如你将误差乘以0.99。因此，你需要将数值乘以0.99很长时间，直到达到1e-6。大家跟得上吗？这会加速。准确率每一步都会翻倍。","start":2087.56,"end":2114.51},{"id":94,"text":"once you get into this region. And this is going to be called quadratic convergence, because on a semi-log plot, it's going to be a quadratic. And it's going to be the way to understand that this accelerates and gets... It's a thing we observed just by looking at silly baby examples, that once you're close to the optimum, Newton's method is going to work unbelievably well. Right? So, okay. All right.","zh":"一旦你進入這個區域。這會被稱為二次收斂，因為在半對數圖上，它會呈現二次曲線。這會是理解這會加速並達到……我們只是通過看一些愚蠢的簡單例子觀察到的，一旦你接近最佳解，牛頓法會表現得驚人地好。對吧？所以，好的。好了。","start":2115.05,"end":2142.3},{"id":95,"text":"So the first part is called the damped Newton phase, and the second is called the quadratically convergent phase, right? And in these cases, you know, most of the iterations require backtracking or damping. Yeah? Is it true, can we understand that if the property of the function f is closer to the quadratic function, then the better the convergence result?","zh":"所以第一部分称为阻尼牛顿阶段，第二部分称为二次收敛阶段，对吧？在这些情况下，你知道，大多数迭代都需要回溯或阻尼。是的？这是真的，我们可以理解如果函数f的性质更接近二次函数，那么收敛结果会更好吗？","start":2145.35,"end":2175.95}],"notes":["本段主要讲解牛顿法的收敛性分析，特别是梯度下降法和牛顿法在不同阶段的表现。讲者指出，当梯度的范数大于某个阈值时，函数值会保证固定下降，这被称为线性收敛。当梯度范数小于该阈值时，收敛速度会加快，进入二次收敛阶段。线性收敛在对数坐标轴上表现为常数改进，而二次收敛则在半对数图上呈现二次曲线。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2006.38,"end":2175.95,"asr_flags":[],"math_clarifications":["所有公式均未提供明确的数学定义或条件，无法判断其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2006.38,"text":"you know, showing, I mean, if you read the book, it's not even that long, but it's not the kind of thing I think that should be done in public, is to walk through a proof of this kind of stuff, because it's just, I don't get it. But here, the main point is, the outline is actually pretty cool. It basically says this, if the norm of the gradient, there's a number, and it says if the norm of the gradient is bigger than that number, then it guarantees, it absolutely guarantees a fixed decrease in the function, right? That's cool, right?"},{"start":2034.51,"text":"Once the gradient gets less than that number, then you get something crazy, which is that, I mean, ignore the constants, but basically the norm at the next, the norm of the gradient, which is like, you know, how small, you know, how close are you to optimal? That is less than or equal to this. It's less, it's actually like this goes like the square at most, right? Now to visualize what happens, you know, once the error is like, you know, 0.1 on the next step, it's 0.01."},{"start":2063.97,"text":"On the next step, it's 0.001. Wait, did I do that right? No. 0.001, right? Next time, it's 1e-8. And on the next step, it's 1e-16. And now we're at floating point precision and we stop. Everybody follow this? And if you remember linear convergence from the gradient method, linear, I mean, it's a weird name. Linear was..."},{"start":2087.56,"text":"on a log accuracy vertical axis and number of iterations, what that says is you kind of get a constant improvement each step. And the improvement is usually rather pathetic, right? Like you multiply your error by 0.99. So you have to multiply things by 0.99 for a long time until you get 1e-6. Everybody following this? This accelerates. The accuracy doubles every step."},{"start":2115.05,"text":"once you get into this region. And this is going to be called quadratic convergence, because on a semi-log plot, it's going to be a quadratic. And it's going to be the way to understand that this accelerates and gets... It's a thing we observed just by looking at silly baby examples, that once you're close to the optimum, Newton's method is going to work unbelievably well. Right? So, okay. All right."},{"start":2145.35,"text":"So the first part is called the damped Newton phase, and the second is called the quadratically convergent phase, right? And in these cases, you know, most of the iterations require backtracking or damping. Yeah? Is it true, can we understand that if the property of the function f is closer to the quadratic function, then the better the convergence result?"}],"speech_gaps":[],"frame":"../frames/v014/013.webp","frame_time":2018.38},{"title":"凸优化中的收敛性分析","segments":[{"id":96,"text":"That is a way to say that, right? We expect here that if L is small, right? That's one way of saying the tension doesn't change as you move around that much, right? That's what it says. Yeah, then I would say that function is closer to quadratic than if L was really big. And so, yes, we should expect everything to work. When L gets small, things should work pretty well.","zh":"这就是一种说法，对吧？我们在这里期望的是，如果L很小，对吧？这是一种说法，即张力在移动时不会发生太大变化，对吧？这就是它的意思。是的，那么我会说这个函数比L很大的时候更接近二次函数。因此，我们应期望一切都能正常工作。当L变小时，事情应该会很好地进行。","start":2176.87,"end":2200.75},{"id":97,"text":"So, yeah, we can, I mean, it's actually pretty cool. If L gets small, this eta gets pretty big, and that means that you get into the region of quadratic convergence faster, right? So, indeed, it does kind of go that way, right? But, yeah, that's a perfectly good, how far is the function from quadratic? And someone says, why? You say, well, for quadratic function, it's game over in one step.","zh":"所以，是的，我们可以，我的意思是，这实际上相当酷。如果L变小，eta就会变得很大，这意味着你会更快地进入二次收敛区域，对吧？所以，确实，它就是这样发展的，对吧？但是，是的，这很好地回答了问题：函数离二次函数有多远？有人问，为什么？你会说，对于二次函数来说，一步就结束了。","start":2202.22,"end":2227.24},{"id":98,"text":"And then this is a measure of how far you are from quadratic. Okay. All right. So this first bit, you know, it says since you're guaranteed in this case that you're going to go down by this gamma thing, then f of x0 minus p star divided by eta is the maximum number of steps you could be in the damp Newton step.","zh":"然后，这就是衡量你离二次函数有多远的一种方式。好的。那么，这一部分，你知道，它说既然在这种情况下你保证会下降这么多的gamma值，那么f(x0)减去p*除以eta就是你在阻尼牛顿步中可能需要的最大步数。","start":2227.8,"end":2253.34},{"id":99,"text":"right once you're here you get something that looks like this and i'm just going to point out this is this is one half to the two to the l minus k right so so what happens is it just keeps it keeps going down um it accelerates right it's this thing where you get four digits of accuracy then eight then sixteen right um as a practical matter you don't do more than three or four steps in quadratically conversion phase because then you just hit machine precision and stop","zh":"一旦你在这里，你会得到一个看起来像这样的结果，我只是想指出，这是二分之一的二的l减k次方，对吧？所以，发生的情况是它不断下降，对吧？它加速了，这就是你得到四位有效数字，然后八位，然后十六位的情况，对吧？实际上，在二次收敛阶段，你不会进行超过三到四步，因为之后你就会达到机器精度并停止。","start":2253.73,"end":2278.09},{"id":100,"text":"Right, so, and I'll tell you a story about that a little bit later. Okay, so this is the idea behind the analysis here. And the conclusion is the number of iterations until you get something that's like epsilon suboptimal is no more than the current function value minus the optimal value divided by this number gamma, which we could just calculate if it's some number, right?","zh":"对，所以，我会在稍后告诉你一个关于这个的故事。好的，这就是这里分析的基本思想。结论是，直到你得到一个大约epsilon次优解所需的迭代次数不超过当前函数值减去最优值除以这个gamma数，如果我们能计算出这个数的话，对吧？","start":2278.95,"end":2306.9},{"id":101,"text":"Plus, and then the quadratic thing, since you're doubling the number of basically digits of accuracy each step, it's going to be proportional to log. It's actually going to be log log 1 over epsilon, right? So, and you should read that in a reasonable way, right? There's a very, very good way to think. Bisection.","zh":"此外，二次项的情况，因为每一步基本上将精度的位数翻倍，因此它将与对数成比例。实际上，它将是 log log(1/ε)，对吧？所以，你应该以合理的方式理解这一点，对吧？有一种非常好的思考方式，那就是二分法。","start":2307.41,"end":2325.55},{"id":102,"text":"is like log one over epsilon, right? Because you divide your, so, and then even something that only, that multiplies your error by .99, that's also like log one over epsilon, right? Because it just, I mean, it's got a different constant in front, but it's still, that's how long it takes. You get a constant fraction improvement each step. The log log is because when you get close, you start accelerating and you get faster and faster. Okay, so, okay, so this is the, and that second term there, I think a normal person,","zh":"类似于 log(1/ε)，对吧？因为你会将你的误差范围缩小，所以，即使某种方法只是将你的误差乘以 0.99，它也类似于 log(1/ε)，对吧？因为它的前面有一个不同的常数，但它的收敛速度仍然是这样的。你每一步都获得一个常数比例的改进。而 log log 是因为在接近解的时候，你会开始加速，速度越来越快。好的，所以，这就是，而那第二个项，我想一个正常的人，","start":2326.11,"end":2354.88}],"notes":["本段讨论了在凸优化中，当L（Lipschitz常数）较小时，函数更接近二次函数，从而使得算法收敛更快。讲者指出，当L变小时，步长eta会变大，这使得算法更快进入二次收敛区域。"],"formulas":[{"latex":"log \\frac{1}{\\epsilon}","symbols":"log 1/epsilon 表示线性收敛所需的迭代次数","explanation":"公式表达清晰，符合数学规范，表示线性收敛所需的迭代次数，保留。","evidence":"Plus, and then the quadratic thing, since you're doubling the number of basically digits of accuracy each step, it's going to be proportional to log. It's actually going to be log log 1 over epsilon, right? So, and you should read that in a reasonable way, right? There's a very, very good way to think. Bisection."},{"latex":"log \\text{log} \\frac{1}{\\epsilon}","symbols":"log log 1/epsilon 表示二次收敛所需的迭代次数","explanation":"公式表达清晰，符合数学规范，表示二次收敛所需的迭代次数，保留。","evidence":"Plus, and then the quadratic thing, since you're doubling the number of basically digits of accuracy each step, it's going to be proportional to log. It's actually going to be log log 1 over epsilon, right? So, and you should read that in a reasonable way, right? There's a very, very good way to think. Bisection."}],"uncertainties":["quadratically conversion phase 可能是 quadratically convergent phase 的误听","one half to the two to the l minus k 可能是 1/2^{2^{l-k}} 的误听"],"diagram":"none","start":2176.87,"end":2354.88,"asr_flags":[],"math_clarifications":["公式 'f(x_0) - p^* / \\text{eta}' 中的符号 'p^*' 和 'eta' 未明确其数学含义，且公式结构不清晰，无法确定其数学意义，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2176.87,"text":"That is a way to say that, right? We expect here that if L is small, right? That's one way of saying the tension doesn't change as you move around that much, right? That's what it says. Yeah, then I would say that function is closer to quadratic than if L was really big. And so, yes, we should expect everything to work. When L gets small, things should work pretty well."},{"start":2202.22,"text":"So, yeah, we can, I mean, it's actually pretty cool. If L gets small, this eta gets pretty big, and that means that you get into the region of quadratic convergence faster, right? So, indeed, it does kind of go that way, right? But, yeah, that's a perfectly good, how far is the function from quadratic? And someone says, why? You say, well, for quadratic function, it's game over in one step."},{"start":2227.8,"text":"And then this is a measure of how far you are from quadratic. Okay. All right. So this first bit, you know, it says since you're guaranteed in this case that you're going to go down by this gamma thing, then f of x0 minus p star divided by eta is the maximum number of steps you could be in the damp Newton step."},{"start":2253.73,"text":"right once you're here you get something that looks like this and i'm just going to point out this is this is one half to the two to the l minus k right so so what happens is it just keeps it keeps going down um it accelerates right it's this thing where you get four digits of accuracy then eight then sixteen right um as a practical matter you don't do more than three or four steps in quadratically conversion phase because then you just hit machine precision and stop"},{"start":2278.95,"text":"Right, so, and I'll tell you a story about that a little bit later. Okay, so this is the idea behind the analysis here. And the conclusion is the number of iterations until you get something that's like epsilon suboptimal is no more than the current function value minus the optimal value divided by this number gamma, which we could just calculate if it's some number, right?"},{"start":2307.41,"text":"Plus, and then the quadratic thing, since you're doubling the number of basically digits of accuracy each step, it's going to be proportional to log. It's actually going to be log log 1 over epsilon, right? So, and you should read that in a reasonable way, right? There's a very, very good way to think. Bisection."},{"start":2326.11,"text":"is like log one over epsilon, right? Because you divide your, so, and then even something that only, that multiplies your error by .99, that's also like log one over epsilon, right? Because it just, I mean, it's got a different constant in front, but it's still, that's how long it takes. You get a constant fraction improvement each step. The log log is because when you get close, you start accelerating and you get faster and faster. Okay, so, okay, so this is the, and that second term there, I think a normal person,"}],"speech_gaps":[],"frame":"../frames/v014/014.webp","frame_time":2188.87},{"title":"凸优化中的收敛性分析与实际应用","segments":[{"id":103,"text":"you just read that second term as like three or five. Five is like generous, right? It's silly because it's like, you know, once you're in the region of a quadratic convergence, it's three steps and you're at double precision stationary, okay? So, okay. Now, there's a few problems with this. And this is the classical analysis, right? Okay, there's a few problems with this analysis. Okay, let's start with one.","zh":"你刚才把第二项读作三或五。五就像是慷慨的，对吧？这是很荒谬的，因为一旦你进入二次收敛的区域，三步之后你就会达到双精度的稳定状态，对吧？所以，好的。现在，这个分析有几个问题。这是经典的分析，对吧？好的，这个分析有几个问题。好的，我们从第一个开始。","start":2355.44,"end":2384.07},{"id":104,"text":"let's see gamma and epsilon zero and they depend on ML and the initial point now do you imagine in any practical problem you would ever know any of these things the answer is no I can are there cases where you do yes if I'm doing you know logistic regression or something like that with some l2 regularization I do have some values on some of these things right so that's the first thing","zh":"让我们看看 gamma 和 epsilon 零，它们依赖于机器学习和初始点。你能否想象在任何实际问题中你都会知道这些值？答案是不，我不能。有没有这样的情况你会知道？是的，如果我在做逻辑回归之类的，带有 l2 正则化的任务，我确实有一些这些值，对吧？所以这是第一个问题。","start":2386.09,"end":2410.89},{"id":105,"text":"And the other minor point is p star appears in my complexity analysis. So you're sitting there and you say, I'm going to minimize this function by Newton's method. You say, but I'd like to know how many steps it's going to take. Or actually, what I really need to know is an upper bound. And the person says, yeah, awesome. It's that. It's f of x0 minus p star divided by gamma plus log log epsilon. And then you'd say, OK, what's gamma?","zh":"另一个次要的问题是 p 星出现在我的复杂度分析中。你坐在那里说，我要用牛顿法来最小化这个函数。你说，但我想知道需要多少步。或者实际上，我真正需要知道的是一个上界。然后有人说，是的，太棒了。就是这个。就是 f(x0) 减去 p 星，除以 gamma 加上 log log epsilon。然后你会说，好的，gamma 是什么？","start":2413.37,"end":2438.13},{"id":106,"text":"And no one, you're not going to know gamma, right? You're not going to know that. And then you say, what's p star? And you go, oh, that's the optimal value of the problem. You're like, wait a minute, right? So anyway, so then what this suggests is to actually use this. I mean, I'm making fun of it. The answer is you should first use Newton's method to minimize the function. Whereupon you know p star.","zh":"没有人，你不会知道 gamma，对吧？你不会知道这个值的。然后你说，p 星是什么？你回答，哦，那是问题的最优值。你会想，等等，对吧？所以无论如何，这暗示着实际上应该使用这个。我的意思是，我在嘲笑它。答案是你应该首先用牛顿法来最小化这个函数。然后你就会知道 p 星。","start":2439.01,"end":2460.77},{"id":107,"text":"Now you can actually go back and evaluate this and go back in the time machine and tell yourself an upper bound on the number of steps. It's completely ridiculous, right? So when you make fun of it, I mean, this is, by the way, people taught, this is like a crowning, you know, this is after two lectures of horrible calculations, you get to this and it's supposed to be the crowning achievement. Everybody following this? So honestly, to me, many classical Western optimization convergence results sound like this. Here's what they all sound like to me.","zh":"现在你实际上可以回去评估这个，并回到时间机器中告诉自己一个步数的上界。这完全荒谬，对吧？当你嘲笑它的时候，我的意思是，顺便说一句，人们被教导，这是巅峰成就，你知道的，这是在两节糟糕计算之后的巅峰成就。每个人都跟得上吗？老实说，对我来说，许多经典的西方优化收敛结果听起来都像这样。对我来说，它们听起来都像这样。","start":2462.13,"end":2490.96},{"id":108,"text":"It says, if, and there's a long hypothesis filled with all sorts of stuff and parameters that you will never know under any circumstance. There's no way, right? If this is Lipschitz and there's L and there's M and strong, you know, blah, blah, blah, blah, blah. Then, and then it gives you a, then it will give you a bound on the number of steps for that algorithm.","zh":"它说，如果，而且有一个充满各种内容和参数的长假设，这些参数在任何情况下你都不会知道。根本不可能，对吧？如果这是Lipschitz连续的，并且存在L和M以及强凸性，你知道的， blah, blah, blah, blah, blah。然后，然后它会给你这个算法的步骤数的一个上界。","start":2491.36,"end":2510.98},{"id":109,"text":"Right? Which, by the way, if you actually evaluated it with real numbers, would be numbers like 10 million or 10 billion. It's completely useless. And you go, yeah, thanks. Actually, my observation is that this converges in around 20 steps always.","zh":"对吧？顺便说一句，如果你用实际的数字来评估它，这些数字会是像1000万或100亿这样的数值。这完全没用。你会说，谢谢。实际上，我的观察是这个算法总是大约在20步左右就收敛了。","start":2512.46,"end":2525.0}],"notes":["本段讨论了凸优化中收敛性分析的实用性问题，指出经典分析中涉及的参数如gamma和p star在实际问题中通常是未知的，因此这些分析结果在实际应用中可能并不实用。","讲者提到，虽然理论上可以使用这些分析结果来估计迭代次数，但实际中这些参数难以获取，导致结果变得毫无意义。","讲者进一步指出，许多经典优化收敛性结果的假设条件过于复杂，且涉及大量未知参数，使得这些结果在实际应用中难以使用。","讲者以牛顿法为例，说明即使在理论上可以计算迭代次数，但实际中收敛速度远快于理论估计，因此这些分析结果往往过于保守。","讲者强调，实际中优化算法的收敛速度通常远快于理论分析所给出的上界，这表明理论分析可能无法准确反映实际性能。","讲者最后指出，这些理论分析虽然在数学上严谨，但在实际应用中往往缺乏实用性，因此需要结合实际经验进行优化算法的选择和调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2355.44,"end":2525.0,"asr_flags":[108],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2355.44,"text":"you just read that second term as like three or five. Five is like generous, right? It's silly because it's like, you know, once you're in the region of a quadratic convergence, it's three steps and you're at double precision stationary, okay? So, okay. Now, there's a few problems with this. And this is the classical analysis, right? Okay, there's a few problems with this analysis. Okay, let's start with one."},{"start":2386.09,"text":"let's see gamma and epsilon zero and they depend on ML and the initial point now do you imagine in any practical problem you would ever know any of these things the answer is no I can are there cases where you do yes if I'm doing you know logistic regression or something like that with some l2 regularization I do have some values on some of these things right so that's the first thing"},{"start":2413.37,"text":"And the other minor point is p star appears in my complexity analysis. So you're sitting there and you say, I'm going to minimize this function by Newton's method. You say, but I'd like to know how many steps it's going to take. Or actually, what I really need to know is an upper bound. And the person says, yeah, awesome. It's that. It's f of x0 minus p star divided by gamma plus log log epsilon. And then you'd say, OK, what's gamma?"},{"start":2439.01,"text":"And no one, you're not going to know gamma, right? You're not going to know that. And then you say, what's p star? And you go, oh, that's the optimal value of the problem. You're like, wait a minute, right? So anyway, so then what this suggests is to actually use this. I mean, I'm making fun of it. The answer is you should first use Newton's method to minimize the function. Whereupon you know p star."},{"start":2462.13,"text":"Now you can actually go back and evaluate this and go back in the time machine and tell yourself an upper bound on the number of steps. It's completely ridiculous, right? So when you make fun of it, I mean, this is, by the way, people taught, this is like a crowning, you know, this is after two lectures of horrible calculations, you get to this and it's supposed to be the crowning achievement. Everybody following this? So honestly, to me, many classical Western optimization convergence results sound like this. Here's what they all sound like to me."},{"start":2491.36,"text":"It says, if, and there's a long hypothesis filled with all sorts of stuff and parameters that you will never know under any circumstance. There's no way, right? If this is Lipschitz and there's L and there's M and strong, you know, blah, blah, blah, blah, blah. Then, and then it gives you a, then it will give you a bound on the number of steps for that algorithm."},{"start":2512.46,"text":"Right? Which, by the way, if you actually evaluated it with real numbers, would be numbers like 10 million or 10 billion. It's completely useless. And you go, yeah, thanks. Actually, my observation is that this converges in around 20 steps always."}],"speech_gaps":[],"frame":"../frames/v014/015.webp","frame_time":2367.44},{"title":"凸优化中的数值方法与Hessian矩阵的替代","segments":[{"id":110,"text":"So thanks for the upper bound of 150 million. Thank you. Anyway, they all sound like to me. If a bunch of complete, utterly unknowable hypotheses hold, then a completely useless conclusion will hold. So that's how I hear.","zh":"所以感谢你给出的1500万的上界。谢谢。不管怎样，它们听起来对我来说都像是这样。如果一堆完全不可知的假设成立，那么一个完全无用的结论也会成立。所以这就是我听到的。","start":2525.63,"end":2542.95},{"id":111,"text":"basically Western convergence analyses, right? And then when I confront people and say this, they get very angry, as you might imagine if that's all they did their whole life, was develop these. And then they go, look, you don't get it. I didn't want the number. You say, this is conceptual. God, this guy's so dumb. Like, the whole point of this, this is conceptual. This says, like, if you knew these numbers...","zh":"基本上就是西方的收敛性分析，对吧？然后当我面对人们并说出这些时，他们会非常生气，正如你可能会想象的那样，如果他们一生都在做这些事情，那么他们会说，你看不懂。我没有想要那个数字。你说，这是概念性的。天啊，这家伙真蠢。就像，这个的整个点，这就是概念性的。它说，比如，如果你知道这些数字……","start":2543.72,"end":2568.08},{"id":112,"text":"then I can prove it'll take less than 150 million. Anyway, so I don't buy it. I mean, it's fine. It's better than knowing it's not going to work. It's better than, you know, some fields where you say, I don't know, try it. Although, you might have a little bit more respect for some of those fields anyway than the others. Okay, everybody following this? Okay, yes.","zh":"那么我就能证明它会少于1500万。不管怎样，我不买账。我是说，这也没关系。这比不知道它是否能工作要好。这比一些领域中你说，我不知道，试试看要好。尽管，你可能对某些领域比其他领域更有尊重。好吧，大家跟上了吗？好的，是的。","start":2568.39,"end":2589.31},{"id":113,"text":"If you can't compute the Hessian of your objective, can you still kind of adapt this method? Like, perhaps you could iteratively, like, get a project. Oh, yeah, absolutely. OK, so, yeah. So if you can't compute the Hessian at the point, what can you? So, OK, so there's a lot. Yeah, there's a lot of other.","zh":"如果你无法计算目标函数的Hessian矩阵，你还能不能某种程度上适应这种方法？比如，也许你可以迭代地，像这样得到一个投影。哦，对了，绝对可以。好的，所以，是的。所以如果你无法在某一点计算Hessian矩阵，你还能做什么？所以，好的，所以有很多方法。是的，有很多其他方法。","start":2590.25,"end":2606.81},{"id":114,"text":"Whole fields, you could take entire courses on that. So there are quasi-Newton methods where you approximate, you build up an approximation of the Hessian using only, let's say, gradient information. That's one. There's a ton of methods like that. It's a whole field. Actually, some of those are really useful. So yeah, it's a good question. There's also a lot of other variations, right? Like here's one that actually is useful. You evaluate the Hessian.","zh":"整个领域，你可以用整个课程来学习这个。因此，存在拟牛顿方法，其中你使用仅有的梯度信息来近似，构建Hessian矩阵的近似。这是其中一种。有很多这样的方法。这是一个完整的领域。实际上，其中一些方法真的很有用。所以是的，这是一个好问题。还有许多其他变种，对吧？比如，这里有一个实际上很有用的方法。你评估Hessian矩阵。","start":2607.7,"end":2635.24},{"id":115,"text":"Only every 10 steps. There you go. 10 was a parameter, but whatever, right? Then that actually makes perfect sense, works unbelievably well. And what we know, now that you know some linear algebra, you know the following. You compute the Hessian, factor it, and then when you're computing new Newton steps, it's just a back solve, and the cost is really low. Everybody follow? So there are a lot of variations, but yes, you're absolutely right. There's that, yeah. And actually, some methods now, like in...","zh":"每隔10步做一次。好了，10是一个参数，但不管怎样，对吧？实际上这完全合情合理，效果惊人。而且我们现在知道，既然你了解了一些线性代数，你就会明白以下内容。你计算Hessian矩阵，进行分解，然后在计算新的牛顿步时，只需进行一次回代，计算成本非常低。大家明白了吗？有很多变种方法，但没错，你完全正确。确实如此，而且实际上，现在有些方法，比如在……","start":2635.69,"end":2664.11},{"id":116,"text":"things like using autograd and autodiff things, you just call .backward .backward. And there are methods that do that. So that's even more radical. That's like computer Hessian. Why would you do that? I know how to do it with autodifferentiation. So there's a lot of methods that would be based on that. You had a question? I'm just curious, where do the optimization methods come from that we do?","zh":"像使用autograd和自动微分工具，你只需调用.backward()。有一些方法就是这么做的。这甚至更加激进。这就像计算机计算Hessian矩阵。为什么要这么做呢？我知道如何用自动微分来实现。因此有很多方法都是基于这种思想的。你有问题吗？我只是好奇，我们所使用的优化方法是从哪里来的？","start":2664.5,"end":2692.97}],"notes":["本段讨论了在无法计算目标函数Hessian矩阵的情况下，如何通过替代方法进行优化。讲者提到，当无法直接计算Hessian时，可以使用准牛顿方法（quasi-Newton methods），这些方法通过仅使用梯度信息来构建Hessian的近似。这种方法构成了一个独立的领域，且在实际应用中非常有用。","讲者进一步说明，某些优化方法可以每隔一定步数（如每10步）计算一次Hessian矩阵，这在计算上是可行的，并且在实际应用中表现良好。通过线性代数的知识，可以将Hessian矩阵进行分解，从而在计算新的牛顿步时，只需进行一次回代操作，计算成本较低。","讲者还提到，利用自动微分（autodifferentiation）技术，可以自动计算Hessian矩阵，这种方法在某些情况下更为激进。讲者询问了优化方法的来源，暗示这些方法可能来源于数学理论、实际应用需求或计算技术的发展。","讲者通过举例说明了不同优化方法的适用场景和计算成本，强调了在实际应用中，选择合适的方法对于优化问题的求解至关重要。"],"formulas":[],"uncertainties":["project","computer Hessian"],"diagram":"none","start":2525.63,"end":2692.97,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2525.63,"text":"So thanks for the upper bound of 150 million. Thank you. Anyway, they all sound like to me. If a bunch of complete, utterly unknowable hypotheses hold, then a completely useless conclusion will hold. So that's how I hear."},{"start":2543.72,"text":"basically Western convergence analyses, right? And then when I confront people and say this, they get very angry, as you might imagine if that's all they did their whole life, was develop these. And then they go, look, you don't get it. I didn't want the number. You say, this is conceptual. God, this guy's so dumb. Like, the whole point of this, this is conceptual. This says, like, if you knew these numbers..."},{"start":2568.39,"text":"then I can prove it'll take less than 150 million. Anyway, so I don't buy it. I mean, it's fine. It's better than knowing it's not going to work. It's better than, you know, some fields where you say, I don't know, try it. Although, you might have a little bit more respect for some of those fields anyway than the others. Okay, everybody following this? Okay, yes."},{"start":2590.25,"text":"If you can't compute the Hessian of your objective, can you still kind of adapt this method? Like, perhaps you could iteratively, like, get a project. Oh, yeah, absolutely. OK, so, yeah. So if you can't compute the Hessian at the point, what can you? So, OK, so there's a lot. Yeah, there's a lot of other."},{"start":2607.7,"text":"Whole fields, you could take entire courses on that. So there are quasi-Newton methods where you approximate, you build up an approximation of the Hessian using only, let's say, gradient information. That's one. There's a ton of methods like that. It's a whole field. Actually, some of those are really useful. So yeah, it's a good question. There's also a lot of other variations, right? Like here's one that actually is useful. You evaluate the Hessian."},{"start":2635.69,"text":"Only every 10 steps. There you go. 10 was a parameter, but whatever, right? Then that actually makes perfect sense, works unbelievably well. And what we know, now that you know some linear algebra, you know the following. You compute the Hessian, factor it, and then when you're computing new Newton steps, it's just a back solve, and the cost is really low. Everybody follow? So there are a lot of variations, but yes, you're absolutely right. There's that, yeah. And actually, some methods now, like in..."},{"start":2664.5,"text":"things like using autograd and autodiff things, you just call .backward .backward. And there are methods that do that. So that's even more radical. That's like computer Hessian. Why would you do that? I know how to do it with autodifferentiation. So there's a lot of methods that would be based on that. You had a question? I'm just curious, where do the optimization methods come from that we do?"}],"speech_gaps":[],"frame":"../frames/v014/016.webp","frame_time":2537.63},{"title":"牛顿法的不变性与分析的矛盾","segments":[{"id":117,"text":"Respect or use? If all the ones are jokes, then what are we using? Oh, that's right. The method is not a joke. Oh, boy. No, no, no. The analysis is a joke. To me, it's funny anyway. Let's put it that way. I'm not making fun of the method. Oh, no. Oh, boy. This works really well in practice. That's a joke. To me, personally, that's a subjective thing. I mean, not to people who this is all they do, right?","zh":"尊重还是使用？如果所有的‘一’都是笑话，那么我们到底在使用什么？哦，对了。这个方法并不是笑话。哦，天啊。不，不，不。分析才是笑话。对我来说，这本身就很有趣。这么说吧。我并不是在嘲笑这个方法。哦，不。哦，天啊。这个方法在实践中真的非常有效。那是一个笑话。对我来说，这是一件主观的事情。我的意思是，对于那些以这个为生的人来说，不是这样吗？","start":2693.84,"end":2721.56},{"id":118,"text":"To me, it's a little bit of a joke. But the method is not. Oh, no, no. Never confuse the method. Yeah, these are different things. Now, there's something even worse here, which is an aesthetic. So I've made fun of this enough, but I'm going to actually make it even worse now. So here it is.","zh":"对我来说，这有点像笑话。但方法本身不是。哦，不，不。千万不要把方法和分析混淆。是的，这些是不同的事情。现在，这里还有更糟糕的事情，那就是一种审美问题。我已经嘲笑过这个方法很多次了，但现在我要让它变得更糟糕。所以，这里就是。","start":2723.3,"end":2742.54},{"id":119,"text":"The actual Newton's method is affine invariant, which is an amazing thing. Like the entire algorithm, right? If you scale change coordinates and it takes 27 iterations, you change coordinates, it takes 27 iterations.","zh":"真正的牛顿法是仿射不变的，这是一件了不起的事情。就像整个算法一样，对吧？如果你改变坐标系，需要27次迭代，你再改变坐标系，仍然需要27次迭代。","start":2743.48,"end":2758.78},{"id":120,"text":"Which is an incredibly beautiful property. It says basically that it is not sensitive in any way whatsoever to bad problem scaling and all sorts of other stuff. Everybody following this? Beautiful, super useful in practice attribute to have. Now you say, okay, this is a beautiful algorithm. Could you please analyze it for me? And they come back and they say, yeah, no problem. You need to tell me L.","zh":"这是一个极其优美的性质。它基本上说明这个方法对任何不良的问题缩放和其他各种因素都不敏感。大家跟上了吗？这是一个在实践中非常有用的属性。现在你说，好的，这是一个优美的算法。你能为我分析一下吗？他们回来后说，是的，没问题。你需要告诉我L的值。","start":2759.51,"end":2788.83},{"id":121,"text":"Now you say, okay, this is a beautiful algorithm. Could you please analyze it for me? And they come back and they say, yeah, no problem. You need to tell me L. And you need to tell me M. Okay. Yeah, that's it. Okay. Okay. Everybody following this? And you'd say, excuse me, if I change coordinates, do the values of L and M change? And the answer is yes. And now you have aesthetically a deeply embarrassing situation.","zh":"现在你说，好的，这是一个优美的算法。你能为我分析一下吗？他们回来后说，是的，没问题。你需要告诉我L的值。你需要告诉我M的值。好的。是的，就是这样。好的。大家跟上了吗？你会说，打扰一下，如果我改变坐标系，L和M的值会改变吗？答案是肯定的。现在你就会陷入一种审美上非常尴尬的境地。","start":2789.35,"end":2817.1},{"id":122,"text":"Like the actual code itself is now more elegant than the mathematical proof. Because the actual...","zh":"就像实际的代码本身比数学证明更加优雅一样。因为实际的……","start":2817.42,"end":2825.36},{"id":123,"text":"So basically what would happen is I'd say, how long will it take me to minimize this? And they'll say, oh, I don't know, a couple million iterations, no more than that. Of course, then it takes 12, right? So then you're like, okay. And then you'd say the exact same function. And then you'd say, well, I'm going to, you say, if you don't mind, I'm going to change coordinates, right?","zh":"所以基本上会发生的是，我会问，我需要多少时间才能最小化这个函数？他们会说，哦，我不知道，大概几百万次迭代，不超过这个数。当然，然后它只需要12次，对吧？所以你就会说，好的。然后你会说同样的函数。然后你会说，嗯，如果你不介意的话，我要改变坐标系，对吧？","start":2825.66,"end":2851.78}],"notes":["本段讨论了牛顿法的不变性与分析之间的矛盾。牛顿法在坐标变换下保持不变，这是其重要的性质，但分析中需要的参数L和M却会随着坐标变换而改变，这导致了理论分析与实际实现之间的不一致。","讲者指出，虽然牛顿法在实际中表现良好，但其理论分析需要特定的参数，这些参数在坐标变换下并不保持不变，这使得理论分析变得复杂。","讲者通过对比代码实现与数学证明，强调了实际代码的不变性与数学证明的局限性。代码在数值上保持不变，但数学证明却无法做到这一点。","讲者提到，当改变坐标时，分析所需的参数L和M会发生变化，这导致了理论分析与实际应用之间的不一致，从而产生了一种尴尬的情况。","讲者通过举例说明，当改变坐标时，实际计算所需的迭代次数可能大幅减少，而理论分析却无法准确预测这一变化，这突显了理论与实践之间的差距。","讲者强调了牛顿法的不变性是其重要的优点，但同时也指出，这种不变性在理论分析中需要额外的参数，这使得分析变得复杂。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2693.84,"end":2851.78,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2693.84,"text":"Respect or use? If all the ones are jokes, then what are we using? Oh, that's right. The method is not a joke. Oh, boy. No, no, no. The analysis is a joke. To me, it's funny anyway. Let's put it that way. I'm not making fun of the method. Oh, no. Oh, boy. This works really well in practice. That's a joke. To me, personally, that's a subjective thing. I mean, not to people who this is all they do, right?"},{"start":2723.3,"text":"To me, it's a little bit of a joke. But the method is not. Oh, no, no. Never confuse the method. Yeah, these are different things. Now, there's something even worse here, which is an aesthetic. So I've made fun of this enough, but I'm going to actually make it even worse now. So here it is."},{"start":2743.48,"text":"The actual Newton's method is affine invariant, which is an amazing thing. Like the entire algorithm, right? If you scale change coordinates and it takes 27 iterations, you change coordinates, it takes 27 iterations."},{"start":2759.51,"text":"Which is an incredibly beautiful property. It says basically that it is not sensitive in any way whatsoever to bad problem scaling and all sorts of other stuff. Everybody following this? Beautiful, super useful in practice attribute to have. Now you say, okay, this is a beautiful algorithm. Could you please analyze it for me? And they come back and they say, yeah, no problem. You need to tell me L."},{"start":2789.35,"text":"And you need to tell me M. Okay. Yeah, that's it. Okay. Okay. Everybody following this? And you'd say, excuse me, if I change coordinates, do the values of L and M change? And the answer is yes. And now you have aesthetically a deeply embarrassing situation. Because somebody who just wrote up the code in Rust or C or something has this incredibly beautiful thing. And the..."},{"start":2817.42,"text":"Like the actual code itself is now more elegant than the mathematical proof. Because the actual..."},{"start":2825.66,"text":"Code is actually, it actually is invariant up to numerical, you know, numerical issues. It's actually invariant under a scaling or change of coordinates. But the proof is not. Everybody following this? So basically what would happen is I'd say, how long will it take me to minimize this? And they'll say, oh, I don't know, a couple million iterations, no more than that. Of course, then it takes 12, right? So then you're like, okay. And then you'd say the exact same function. And then you'd say, well, I'm going to, you say, if you don't mind, I'm going to change coordinates, right?"}],"speech_gaps":[],"frame":"../frames/v014/017.webp","frame_time":2705.84},{"title":"凸优化中的算法效率与实际应用","segments":[{"id":124,"text":"Well, the algorithm once again solves it in 12 iterations because it's actually affine invariant. And you go, what's your upper bound now? And they go, oh, now? Oh, boy, 15 million iterations for sure. I can prove, I can prove it will take less than 15 million iterations. And you go, well, thank you very much because just PS, it just took 12 again. Everybody follow? So this is bad. You don't want, this is not how the world should be. The world should be like this. The math is beautiful and clean. That's how it should work.","zh":"嗯，这个算法再次用了12次迭代就解决了问题，因为它实际上是仿射不变的。你会说，那现在的上界是多少呢？他们会说，哦，现在？哦，天啊，肯定需要1500万次迭代。我可以证明，我可以证明它需要的迭代次数肯定少于1500万次。你会说，嗯，非常感谢，因为正如你所见，它又用了12次迭代。大家跟上了吗？所以这很糟糕。你不希望看到这样的情况，这不应该成为现实。现实应该是这样的。数学应该是美丽而整洁的。这才是它应该运作的方式。","start":2852.26,"end":2879.78},{"id":125,"text":"And then you go and you dig deep into the source, which you probably shouldn't do. But if you do this, you should be emotionally prepared for what you're going to find. And you're going to find all sorts of constants buried in there, like 0.001 and this, that. And you're going to say, I didn't see that in the LaTeX. I didn't see a point of buried constant. So that's the way it should be. And you say, just be quiet. We've tested it. It works fine in practice. Go away. That's the way the world should be, right? But the math should be beautiful and all that. Anyway, this is the reverse. And to me, that's just aesthetically very bad.","zh":"然后你会深入到源代码中，而你可能不应该这么做。但如果你这么做，你应该做好心理准备，迎接你将要发现的内容。你会发现自己发现了很多被埋藏的常数，比如0.001之类的。你会说，我并没有在LaTeX中看到这些被埋藏的常数。所以这才是它应该的样子。你会说，安静点吧。我们已经测试过它了。在实践中它运行得很好。走开吧。这才是现实应该有的样子，对吧？但数学应该是美丽而整洁的。不管怎样，这就是相反的情况。对我来说，这在审美上非常糟糕。","start":2880.36,"end":2909.22},{"id":126,"text":"So everybody, yes. Well, I mean, yeah, ignorance is one reason. I mean, actually, people sometimes do use the methods you were hinting at or asking about, which are quasi-Newton methods. So those are actually should be quite widely used. Yeah. I mean, here's a quick answer is this is for smooth problems.","zh":"所以大家，是的。我的意思是，是的，无知是一个原因。实际上，人们有时确实会使用你暗示或询问的方法，也就是拟牛顿法。这些方法实际上应该被广泛使用。是的。我的意思是，一个快速的回答是，这适用于光滑问题。","start":2909.56,"end":2936.52},{"id":127,"text":"Smooth functions, right? So this is going to rule out a lot of things. But if it's smooth, it should do something like this, right? And my suspicion is, like, if you look at things like logistic regression or if you look at multinomial, if you look at problems where you really could, if you look at, like, what the R implementation is or whatever, it's probably this. It's fine. Okay. There's another big reason, which we'll get to later.","zh":"光滑函数，对吧？所以这会排除很多可能性。但如果它是光滑的，它应该会像这样运作，对吧？我的猜测是，如果你看看像逻辑回归或多项式回归这样的问题，或者看看那些你真的可以处理的问题，或者看看像R实现这样的内容，它可能就是这样。它没问题。好的。还有一个很大的原因，我们稍后会谈到。","start":2937.07,"end":2965.75},{"id":128,"text":"which is actually how to compute it. And it's actually the super interesting reason. It's the reason it sort of dropped out of, you know, people stopped looking at this in the 70s and stuff like that because they were like, whoa, you actually have to invert a matrix, which we all know now means solve a set of equations. And then someone said, that costs n cubed. And at that time, it would be like, it's really slow if you have to do it for 100 variables and 100 equations, which is like hilarious now because that's microsecond time for us, right?","zh":"这实际上是计算它的方法。而且这实际上是一个非常有趣的原因。这就是为什么人们在70年代左右开始不再关注这个问题，因为当时有人觉得，哇，你实际上需要求解一个矩阵的逆，而我们都知道，求解矩阵的逆意味着要解一组方程。然后有人指出，这需要n的立方次运算。在当时，如果必须对100个变量和100个方程进行这样的计算，那速度会非常慢，但现在看来这对我们来说已经是微秒级的时间了，对吧？","start":2966.22,"end":2993.82},{"id":129,"text":"And that was the other reason. But now, you know, linear, you'd say, well, now you're smarter. After last week, you're more sophisticated. You'd say, yeah, in general, that's true. But if there was some structure in your problem, then maybe we could do it faster. And then guess what? Smooth optimal control problems, smooth signal processing problems. You could do it in linear time. No, but again, you have to know that. Right. So, okay. All right.","zh":"这也是另一个原因。但现在，你可能会说，现在你更聪明了。在上周的学习之后，你更加成熟了。你会说，是的，一般来说这是正确的。但如果你的问题中存在某种结构，那么也许我们可以更快地解决它。猜猜看？对于光滑的最优控制问题和光滑的信号处理问题，你可以在线性时间内完成。不过，再次强调，你必须知道这一点。对吧？好的，好了。","start":2994.75,"end":3022.5}],"notes":["本段讨论了凸优化算法在实际应用中的效率问题，指出某些算法在理论上可能需要大量迭代，但在实际中表现良好。例如，一个算法可能在12次迭代中解决问题，但理论上可能需要1500万次迭代。这反映了理论与实践之间的差距，强调了实际测试的重要性。","讲者提到在深入算法实现时，会发现许多隐藏的常数，如0.001等，这些常数在LaTeX中未明确写出。这说明实际实现中存在许多细节，这些细节可能影响算法的性能，但通常不会在理论分析中体现。","讲者提到，对于光滑问题（smooth problems），某些方法如拟牛顿法（quasi-Newton methods）可能更有效。这表明在处理光滑函数时，可以使用更高效的优化方法，但需要满足一定的条件。","讲者指出，计算某些优化问题需要求解矩阵的逆，这在计算上可能很昂贵，尤其是当问题规模较大时。然而，随着计算能力的提升，这种计算成本已经变得可以接受。","讲者提到，如果问题具有某种结构，如光滑最优控制问题或光滑信号处理问题，可能可以以线性时间解决。这表明在实际应用中，问题的结构可能对算法效率有重要影响。","讲者强调，虽然理论分析可能指出某些方法的局限性，但在实际应用中，这些方法可能仍然有效。这反映了理论与实践之间的复杂关系，需要结合具体问题进行分析。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2852.26,"end":3022.5,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2852.26,"text":"Well, the algorithm once again solves it in 12 iterations because it's actually affine invariant. And you go, what's your upper bound now? And they go, oh, now? Oh, boy, 15 million iterations for sure. I can prove, I can prove it will take less than 15 million iterations. And you go, well, thank you very much because just PS, it just took 12 again. Everybody follow? So this is bad. You don't want, this is not how the world should be. The world should be like this. The math is beautiful and clean. That's how it should work."},{"start":2880.36,"text":"And then you go and you dig deep into the source, which you probably shouldn't do. But if you do this, you should be emotionally prepared for what you're going to find. And you're going to find all sorts of constants buried in there, like 0.001 and this, that. And you're going to say, I didn't see that in the LaTeX. I didn't see a point of buried constant. So that's the way it should be. And you say, just be quiet. We've tested it. It works fine in practice. Go away. That's the way the world should be, right? But the math should be beautiful and all that. Anyway, this is the reverse. And to me, that's just aesthetically very bad."},{"start":2909.56,"text":"So everybody, yes. Well, I mean, yeah, ignorance is one reason. I mean, actually, people sometimes do use the methods you were hinting at or asking about, which are quasi-Newton methods. So those are actually should be quite widely used. Yeah. I mean, here's a quick answer is this is for smooth problems."},{"start":2937.07,"text":"Smooth functions, right? So this is going to rule out a lot of things. But if it's smooth, it should do something like this, right? And my suspicion is, like, if you look at things like logistic regression or if you look at multinomial, if you look at problems where you really could, if you look at, like, what the R implementation is or whatever, it's probably this. It's fine. Okay. There's another big reason, which we'll get to later."},{"start":2966.22,"text":"which is actually how to compute it. And it's actually the super interesting reason. It's the reason it sort of dropped out of, you know, people stopped looking at this in the 70s and stuff like that because they were like, whoa, you actually have to invert a matrix, which we all know now means solve a set of equations. And then someone said, that costs n cubed. And at that time, it would be like, it's really slow if you have to do it for 100 variables and 100 equations, which is like hilarious now because that's microsecond time for us, right?"},{"start":2994.75,"text":"And that was the other reason. But now, you know, linear, you'd say, well, now you're smarter. After last week, you're more sophisticated. You'd say, yeah, in general, that's true. But if there was some structure in your problem, then maybe we could do it faster. And then guess what? Smooth optimal control problems, smooth signal processing problems. You could do it in linear time. No, but again, you have to know that. Right. So, okay. All right."}],"speech ry before. What's the bound on the number of iterations? You go, no problem. What's the optimal value? And you're like, dude, I haven't even started. I was asking you how many steps it's going to take me. And this kind of makes sense. And you can go to a problem that's bigger. And actually, this will be a first one where we get something."}],"speech_gaps":[],"frame":"../frames/v014/019.webp","frame_time":3035.99},{"title":"高维优化中的收敛性与计算复杂度","segments":[{"id":137,"text":"So here, it's a problem in 10,000 variables. It's fine. And it's the same kind of story. And you see this thing accelerating, and that tells you you are in the region of quadratic convergence. Now, I have a question. And this will be fun. But let me... Let's see, what is it? No, this is fine. Okay, so in this one, you can see that...","zh":"在这里，这是一个涉及10,000个变量的问题。这没问题。而且故事也是类似的。你可以看到这个过程在加速，这说明你已经进入了二次收敛的区域。现在，我有一个问题。这会很有趣。但让我……让我们看看，是什么？不，这没问题。好的，所以在这一例中，你可以看到……","start":3185.42,"end":3212.67},{"id":138,"text":"It's some big log barrier problem or something like that. I'll just leave it. I'll leave it there. I'm suspicious of something here. I'm deeply suspicious of the 100,000 over there. Do you mind cross-referencing that against the book or something like that?","zh":"这是一个大对数障碍问题，或者类似的问题。我暂时就留着吧。我就留在这儿。我对这里有些怀疑。我对那边的100,000很怀疑。你介意对照书本或者其他资料进行交叉验证吗？","start":3213.66,"end":3232.28},{"id":139,"text":"Okay, it's fine. But anyway, it looks like it's too much. Anyway, so the idea is, I mean, this is kind of, this is ridiculous, right? So this is a function in, what is it? In R10,000. Just for the record, R10,000 is a pretty big place, right? And then this says, you stop and you ask for directions like 18 times. Like, you stop, and you say, here's my x, and you'd say, hey, asking for directions is basically calculating the gradient.","zh":"好的，这没问题。但无论如何，看起来太多了。无论如何，这个想法是，我的意思是，这有点荒谬，对吧？这是一个在R10,000中的函数。顺便说一句，R10,000是一个相当大的空间，对吧？然后它说，你停下来并像18次一样询问方向。比如，你停下来，然后说，这是我的x，然后你说，嘿，询问方向基本上就是计算梯度。","start":3233.43,"end":3262.13},{"id":140,"text":"and the Hessian, right? You ask for directions 18 times, you go, okay, thanks, thanks. Then you do a backtracking line search, which is not very crude, right? How is it that you stop, ask for directions 18 times, and you end up finding the minimum of this thing in relatively high dimensions, right, to high accuracy? I mean, I think you have to be impressed by this, I think. You should be, anyway. Okay.","zh":"以及Hessian矩阵，对吧？你询问方向18次，然后说，好的，谢谢，谢谢。然后你进行回溯线搜索，这并不是非常粗糙，对吧？你怎么能停下来，询问方向18次，却在相对高维空间中以高精度找到这个函数的最小值呢？我的意思是，我觉得你应该对这个结果感到印象深刻，无论如何。好的。","start":3262.8,"end":3289.81},{"id":141,"text":"So we're going to actually now talk about... Actually, it's very cool. It is a theory I can get behind and don't make fun of. Yes? For, like, R10,000, how long does it take to compute the Hessian? Ah, okay. So that's why I have a suspicion here that... Here? Yeah, so I have a weird feeling. Did you cross-check that? I don't think that's 100,000 over there. It is?","zh":"现在，我们将实际讨论……实际上，这非常酷。这是一个我能够支持的理论，而且不会嘲笑它。是的？比如，在R10,000中，计算Hessian矩阵需要多长时间？啊，好的。这就是我在这里有怀疑的原因……这里？是的，所以我有一种奇怪的感觉。你交叉验证过了吗？我觉得那边的数字不是100,000。它是吗？","start":3292.19,"end":3321.66},{"id":142,"text":"Oh, it's 100,000. Okay, that's fine. Well, we could actually talk about how to, you know, what the Hessian would be here. Ah, sorry, sorry, sorry. Sorry, I was missing something. It is 100,000. It says sparse AI. Okay, so that's a great question. Let's address it. So if you knew nothing, you could calculate the Hessian.","zh":"哦，它是100,000。好的，这没问题。实际上，我们可以讨论一下这里的Hessian矩阵会是什么样子。啊，抱歉，抱歉，抱歉。抱歉，我漏掉了什么。它是100,000。它说稀疏AI。好的，这是一个很好的问题。让我们来解决它。如果你一无所知，你就可以计算Hessian矩阵。","start":3323.27,"end":3346.27}],"notes":["本段讨论了在高维空间（如R10,000）中进行优化时的收敛性问题。讲者提到，当算法在二次收敛区域时，其收敛速度会显著加快。这表明算法已经接近最优解，且在高维空间中仍能保持较高的收敛效率。","讲者对100,000这个数字表示怀疑，并询问是否需要与教材中的内容进行核对。这表明在高维优化问题中，参数的数量和计算复杂度是需要特别关注的问题。","讲者提到，在高维空间中，计算Hessian矩阵的复杂度可能非常高，但通过梯度下降和回溯线搜索等方法，可以在相对较少的迭代次数内找到高精度的最小值。这说明在实际应用中，优化算法的设计需要兼顾计算效率和收敛性。","讲者对Hessian矩阵的计算时间 ctually now talk about... Actually, it's very cool. It is a theory I can get behind and don't make fun of. Yes? For, like, R10,000, how long does it take to compute the Hessian? Ah, okay. So that's why I have a suspicion here that... Here? Yeah, so I have a weird feeling. Did you cross-check that? I don't think that's 100,000 over there. It is?"},{"start":3323.27,"text":"Oh, it's 100,000. Okay, that's fine. Well, we could actually talk about how to, you know, what the Hessian would be here. Ah, sorry, sorry, sorry. Sorry, I was missing something. It is 100,000. It says sparse AI. Okay, so that's a great question. Let's address it. So if you knew nothing, you could calculate the Hessian."}],"speech_gaps":[],"frame":"../frames/v014/020.webp","frame_time":3197.42},{"title":"稀疏性与牛顿方法的计算优势","segments":[{"id":143,"text":"right? You get a 10,000 by 10,000 matrix and you'd have to solve linear equations with that. Actually, that's borderline fine. I mean, right now, that would be just totally fine. On GPU, it'd be zero. You wouldn't even think about it, okay? I mean, it's not small, right? 10,000 by 10,000 matrix is 10 to the eight numbers, multiply about 10 to get doubles. And so it's talking a gig. It's not that big, right? That's like current GPUs can handle.","zh":"对吧？你得到一个10,000乘10,000的矩阵，你得用它来解线性方程。实际上，这已经接近可以处理的程度了。我的意思是，现在这样做完全没问题。在GPU上，这几乎是零成本。你甚至不会去想它，对吧？我的意思是，这并不小，对吧？10,000乘10,000的矩阵有10的8次方个数字，乘以大约10得到双精度浮点数。所以这需要一个吉字节的存储空间。这并不算很大，对吧？现在的GPU都能处理。","start":3346.86,"end":3376.02},{"id":144,"text":"A lot more than that. Everybody following this, right? And you can saw, it's just not that hard. It wouldn't take that long to factorize it and so on. Okay. But the key is here that the AIs are sparse. Here.","zh":"比这还要多得多。大家跟上来了吗，对吧？而且你可以看到，这并不难。对它进行分解之类的操作也不会花太长时间。好的。但关键是这里的AI是稀疏的。在这里。","start":3376.48,"end":3393.25},{"id":145,"text":"And so not only that, the first term, I don't know, I wasn't going to do this now, but we'll do it a little bit now. So basically what it one let's say trained in machine learning","zh":"好的，我们之后会讲到这一点，因为你会然后你会得到完整的联系，实际上当你把应用、稀疏性以及如何解决它全部联系起来时，你会觉得非常酷，对吧？所以通常情况是这样的，我有一个问题，你用牛顿法来解决，然后有人比如说在机器学习领域受过训练","start":3483.79,"end":3506.87}],"notes":["本段讨论了大规模矩阵运算在GPU上的可行性，指出10,000×10,000的矩阵虽然规模较大，但现代GPU可以轻松处理。接着强调了稀疏性在优化问题中的重要性，特别是当矩阵的Hessian具有稀疏结构时，可以显著降低计算复杂度。","讲者提到，函数的可分性（separability）意味着其梯度和Hessian矩阵具有特定结构，例如对角线性。这种结构使得计算更加高效，因为非对角线元素为零，从而减少了计算量。","Hessian矩阵的稀疏性是优化问题中一个关键点，它允许使用更高效的数值方法，如稀疏矩阵的分解和求解技术，从而避免了传统方法的高计算成本。","讲者指出，稀疏性不仅适用于Hessian矩阵，还可能存在于其他部分，如目标函数的结构，这使得整个优化问题的求解更加高效。","最后，讲者提到，理解稀疏性与牛顿方法之间的联系是解决大规模优化问题的关键，这将帮助学生在实际应用中更有效地处理稀疏结构的问题。","整个段落强调了稀疏性在计算优化中的重要性，以及如何利用这种结构来提高计算效率，特别是在大规模问题中。"],"formulas":[{"latex":"\\frac{\\text{d}^2 f}{\\text{d}x_i \\text{d}x_j}","symbols":"H_{ij} 是Hessian矩阵的第i行第j列元素，表示目标函数在x_i和x_j方向上的二阶导数","explanation":"该公式正确表示Hessian矩阵的元素，符合数学定义，无需修改。","evidence":"like burned into your mind. It's what? It's what? It's diagonal. Yeah, yeah. So why, okay, so a function is separable if it's a sum of functions of the individual components, right? If I take the gradient, right, then the fourth component, or here, just take the second, let's do the second derivatives in our head, right? If I have a, if my f of x is some,"},{"latex":"H_{ij} = 0 \\text{ if } i \\neq j","symbols":"当i不等于j时，Hessian矩阵的元素为零，表示函数的可分性","explanation":"该公式正确描述了Hessian矩阵的稀疏性，符合可分函数的性质，无需修改。","evidence":"over i of fi of xi, and I take the partial squared of that with respect to partial xi partial xj, it's zero unless i equals j. So that first one is diagonal, right? And then it's going to turn out the second is sparse. So the Hessian here is diagonal plus sparse. I mean, I guess the diagonal is already sparse, so it's just sparse. So that should answer the questions as to how we did this, right?"}],"uncertainties":["saw","AIs","get get","go bold","trained in machine learning"],"diagram":"none","start":3346.86,"end":3506.87,"asr_flags":[],"math_clarifications":["原始文本中未明确提及目标函数的具体形式，因此无法核对公式0的正确性。","部分公式候选未通过数学或来源检查，已
