rse. So that should answer the questions as to how we did this, right?"},{"start":3483.79,"text":"Okay, so we'll get to that later because you're gonna then you're gonna get the full connection actually, you'll be really cool when you get get the connection all the way from the Application to the sparsity to how to solve it and then it's not a problem, right? So and that'll typically go like this I have this problem you go bold use Newton's method and then someone let's say trained in machine learning"}],"speech_gaps":[],"frame":"../frames/v014/021.webp","frame_time":3358.86},{"title":"牛顿法的分析与改进","segments":[{"id":149,"text":"to carry on my insult from earlier, would say like, are you kidding? There's like 100,000 variables. You can't form. Actually, they wouldn't even know. But let's suppose there's one who heard about it, went into Wikipedia and looked at it or something like that, and said, you can't do that. You can't form. You can either form or store 100,000 by 100,000 majors. And even if you could, you sure as hell couldn't compute this. You couldn't solve these equations, right? And then you'd say, chill.","zh":"继续我之前对你的侮辱，我会说，你开玩笑吗？有十万变量。你根本无法形成。实际上，他们甚至都不知道。但假设有人听说过这件事，去维基百科查看了一下，然后说，你不能这么做。你不能形成。你只能形成或存储100,000乘以100,000的矩阵。即使你能做到，你肯定也计算不了这个。你肯定解不了这些方程，对吧？然后你会说，冷静点。","start":3507.62,"end":3533.74},{"id":150,"text":"Because as a matter of fact, from your description of the problem, I've determined that the Hessian is, you know, banded arrow. And they'll say, what's that? And you go, just don't worry about it. What it means is I can form that Hessian and I can compute the Newton step really fast. Everybody got that? So that would be how that would work. That's how it would work. Okay.","zh":"事实上，根据你对问题的描述，我已经确定Hessian矩阵是带状箭头结构。他们会问，这是什么？你会说，别担心。这意味着我可以形成这个Hessian矩阵，并且可以非常快速地计算牛顿步。大家明白了吗？这就是它的工作方式。这就是它的工作方式。好的。","start":3534.36,"end":3556.05},{"id":151,"text":"Okay, now the next topic, and you know, it's actually really cool. It addresses this question, this embarrassment, really, of the classical analysis of Newton's method, which was less sophisticated than the actual algorithm itself, right? Because the actual algorithm itself is affine independent, but then the analysis, you change coordinates, and they give you a different number for their upper bound. I mean, it's still useless, but they give you a different number.","zh":"好的，接下来的话题，你知道，其实真的很酷。它解决了经典牛顿法分析中的这个尴尬问题，即分析本身比实际算法本身要不那么先进，对吧？因为实际的算法本身是仿射独立的，但分析中你改变坐标系，然后给出一个不同的上界数值。我的意思是，它仍然没用，但他们给出的是一个不同的数值。","start":3557.86,"end":3585.88},{"id":152,"text":"So it turns out there's a weird variation on this. This comes from the late 80s and 90s from also Moscow. And it's developed by Nesterov and Nemirovsky. They have this 500 page, 600, 700 page book that it's not for the faint of heart. They do.","zh":"结果发现，有一种奇怪的变体。这种变体来自上世纪80年代末和90年代，也来自莫斯科。它由Nesterov和Nemirovsky发展而来。他们有一本500页、600页、700页的书，不是胆小的人能读的。他们确实如此。","start":3586.43,"end":3607.49},{"id":153,"text":"look at, they do look at third derivatives of things like, they look at the third derivative of things like the log determinant of a matrix, positive definite matrix, right? So they're very, they're all, that's the classical Soviet math training, right? One of them, Neborowski actually once told me, he said, yes, we don't learn matrices. He said, for you, it is a crutch. He said, it leads to sloppy and weak thinking.","zh":"他们确实会看一些函数的三阶导数，比如矩阵的对数行列式，正定矩阵，对吧？他们非常注重这些，这正是经典的苏联数学训练，对吧？其中一个人，Neborowski曾经告诉我，他说，是的，我们不学矩阵。他说，对你们来说，矩阵是一种拐杖。他说，这会导致思维懒散和薄弱。","start":3608.26,"end":3637.03},{"id":154,"text":"And he said, we don't do that until much older. He says, we just do everything with indices. I was like, whoa, that's cool. So anyway, it's very, anyway, pretty crazy. Okay, fine. So here it is. And actually, it's a hilarious thing. It actually replaces, actually, it is only the following. And then by the time I tell the story enough, the solution is going to be kind of obvious, right? Although this was just stunning in the early 90s or whatever.","zh":"他说，我们不会在那么年幼的时候就做这些。他说，我们只是用索引来做一切。我当时觉得，哇，这很酷。总之，这非常疯狂。好吧，那我们就来看看。实际上，这是一件很搞笑的事情。实际上，它仅仅只是以下内容。等到我讲完这个故事，解决方案就会变得有点明显，对吧？尽管在90年代初这仍然令人震惊。","start":3638.25,"end":3666.11}],"notes":["本段讨论了牛顿法在实际应用中遇到的挑战，特别是当问题规模很大时，Hessian矩阵的存储和计算变得不可行。然而，如果Hessian矩阵具有带状结构（banded arrow），则可以高效地计算牛顿步，这在实际中非常重要。","接下来，课程介绍了牛顿法分析的不足之处，即分析部分比算法本身更简单，且在坐标变换后给出的上界不同，这使得分析结果变得不实用。","课程提到Nesterov和Nemirovsky在80年代末和90年代初提出了一种改进的牛顿法分析方法，这种方法涉及高阶导数，如矩阵对数行列式的三阶导数，这反映了苏联数学教育的特点。","Nesterov提到，苏联数学教育中不使用矩阵，而是直接使用索引，这种方法被认为能避免矩阵带来的思维松散问题，这与西方数学教育方式形成对比。","最后，课程指出这种改进方法在90年代初令人震惊，但随着讲解的深入，其解决方案会变得显而易见，这表明该方法在理论上和实践中都有重要意义。","这些内容展示了牛顿法在优化问题中的实际应用和理论分析的复杂性，以及如何通过改进方法来克服传统分析的局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3507.62,"end":3666.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3507.62,"text":"to carry on my insult from earlier, would say like, are you kidding? There's like 100,000 variables. You can't form. Actually, they wouldn't even know. But let's suppose there's one who heard about it, went into Wikipedia and looked at it or something like that, and said, you can't do that. You can't form. You can either form or store 100,000 by 100,000 majors. And even if you could, you sure as hell couldn't compute this. You couldn't solve these equations, right? And then you'd say, chill."},{"start":3534.36,"text":"Because as a matter of fact, from your description of the problem, I've determined that the Hessian is, you know, banded arrow. And they'll say, what's that? And you go, just don't worry about it. What it means is I can form that Hessian and I can compute the Newton step really fast. Everybody got that? So that would be how that would work. That's how it would work. Okay."},{"start":3557.86,"text":"Okay, now the next topic, and you know, it's actually really cool. It addresses this question, this embarrassment, really, of the classical analysis of Newton's method, which was less sophisticated than the actual algorithm itself, right? Because the actual algorithm itself is affine independent, but then the analysis, you change coordinates, and they give you a different number for their upper bound. I mean, it's still useless, but they give you a different number."},{"start":3586.43,"text":"So it turns out there's a weird variation on this. This comes from the late 80s and 90s from also Moscow. And it's developed by Nesterov and Nemirovsky. They have this 500 page, 600, 700 page book that it's not for the faint of heart. They do."},{"start":3608.26,"text":"look at, they do look at third derivatives of things like, they look at the third derivative of things like the log determinant of a matrix, positive definite matrix, right? So they're very, they're all, that's the classical Soviet math training, right? One of them, Neborowski actually once told me, he said, yes, we don't learn matrices. He said, for you, it is a crutch. He said, it leads to sloppy and weak thinking."},{"start":3638.25,"text":"And he said, we don't do that until much older. He says, we just do everything with indices. I was like, whoa, that's cool. So anyway, it's very, anyway, pretty crazy. Okay, fine. So here it is. And actually, it's a hilarious thing. It actually replaces, actually, it is only the following. And then by the time I tell the story enough, the solution is going to be kind of obvious, right? Although this was just stunning in the early 90s or whatever."}],"speech_gaps":[],"frame":"../frames/v014/022.webp","frame_time":3519.62},{"title":"凸优化中的自洽性概念","segments":[{"id":155,"text":"The issue with the classical analysis is that we had to say the third derivative is small, but we set it in a way that was not affine independent. That was the issue. Let's say it's a function of just one variable, so we don't have to worry about tensors and three forms.","zh":"经典分析的问题在于，我们必须说三阶导数很小，但我们设定的方式并不是仿射独立的。这就是问题所在。假设这是一个仅有一个变量的函数，所以我们不需要担心张量和三阶微分形式。","start":3668.49,"end":3688.43},{"id":156,"text":"You know, how do you say the derivative is small? And like, here's the obvious one, right? You would say, how about like this, right? That's there. That looks to me like a statement that the third derivative is small. And you go, cool. Now you say, let's do an affine change of coordinates. And actually, this scales. So this is not a way. This is not an acceptable way. I guess if I was going to use the actual notation we were using before, it would be that, right?","zh":"你知道吗，如何说导数很小呢？比如说，这里有一个显而易见的方法，对吧？你会说，比如这样，对吧？那看起来像是一个三阶导数很小的陈述。然后你说，好。现在你说，让我们做一个仿射坐标变换。实际上，这会缩放。所以这不是一种方法。这不是一种可接受的方法。我想如果我要使用我们之前使用的实际符号，它就会是这样的，对吧？","start":3691.54,"end":3722.39},{"id":157,"text":"So this is not a way to say the third derivative is small that is invariant under changes of coordinates. So now you have to figure out how would you say the third derivative is small in a way that if I do a linear change of coordinates, it's invariant, right?","zh":"因此，这不是一种在坐标变换下不变的三阶导数很小的陈述方式。现在你必须想办法，如何以一种在进行线性坐标变换时保持不变的方式，来陈述三阶导数很小。","start":3723.57,"end":3745.41},{"id":158,"text":"So that's actually what we're going to get. Actually, what happens when you do this is the most stunning thing. Instead of a silly theorem that looks like this, if, and then a whole bunch of absolutely unknowable hypotheses were to occur, and then you say then, then you'd have a completely useless conclusion, right? That's my template for a traditional convergence result.","zh":"实际上，这就是我们要得到的。实际上，当你这样做时，会发生最令人惊讶的事情。而不是一个看起来像这样的愚蠢定理，如果，然后一连串完全不可知的假设发生，然后你说然后，你会得到一个完全无用的结论，对吧？这就是我传统收敛结果的模板。","start":3745.96,"end":3768.12},{"id":159,"text":"then it's actually going to be very weird. It's actually going to be if a small number of actually weirdly knowable things hold, then, and then the conclusions are actually going to be, they're not going to be hilariously wrong. They're not going to be hilariously useless. So, okay, so that's the idea. So we'll look at this.","zh":"然后，实际上它会变得非常奇怪。实际上，它会是如果一小部分实际上很奇怪但可以知道的事情成立，然后，结论实际上是，它们不会是可笑的错误。它们不会是可笑的无用。所以，好的，这就是想法。我们来看看这个。","start":3769.13,"end":3790.21},{"id":160,"text":"Okay, and actually we need to use it later in the class. So, okay, and they call this self-concordance. So here it is. It's this. It says a function is self-concordant if the absolute value, this is just from R to R, if the absolute value of the third derivative is less than the, two doesn't matter, that's just for convenience, the second derivative to the three halves power.","zh":"好的，实际上我们会在课上后面用到它。所以，好的，他们称这种性质为自洽性。这里就是。它说，如果一个函数是自洽的，那么绝对值，这只是从实数到实数的函数，如果三阶导数的绝对值小于，二阶导数的三分之三次方，这里的二阶导数并不重要，这只是为了方便。","start":3791.79,"end":3821.42}],"notes":["本段讨论了传统分析中关于导数的小性问题，指出传统方法中对三阶导数的处理方式不具有坐标变换的不变性。讲者强调，传统方法中对导数小性的定义依赖于特定的坐标系，因此不适用于更一般的分析。","讲者指出，传统收敛性定理的结构通常包含大量难以验证的假设，并且结论可能毫无用处。这与自洽性（self-concordance）的定义形成对比，后者通过更简洁的条件来确保函数的性质在坐标变换下保持不变。","自洽性定义为函数的三阶导数的绝对值小于二阶导数的3/2次方。这一条件确保了函数在坐标变换下的不变性，从而使得分析更加稳健。","讲者提到，自洽性将在后续课程中被使用，这表明该概念在凸优化中具有重要的应用价值。","讲者通过对比传统方法和自洽性方法，强调了后者在处理非线性优化问题时的优势，特别是在保持分析不变性方面。","讲者指出，自洽性条件的提出是为了克服传统方法中对导数小性的依赖，从而使得优化算法在不同坐标系下具有更好的鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3668.49,"end":3821.42,"asr_flags":[],"math_clarifications":["原文中提到的自洽性（self-concordance）概念涉及函数的三阶导数与二阶导数的关系，但未提供明确的数学定义或公式。因此，无法核定该公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3668.49,"text":"The issue with the classical analysis is that we had to say the third derivative is small, but we set it in a way that was not affine independent. That was the issue. Let's say it's a function of just one variable, so we don't have to worry about tensors and three forms."},{"start":3691.54,"text":"You know, how do you say the derivative is small? And like, here's the obvious one, right? You would say, how about like this, right? That's there. That looks to me like a statement that the third derivative is small. And you go, cool. Now you say, let's do an affine change of coordinates. And actually, this scales. So this is not a way. This is not an acceptable way. I guess if I was going to use the actual notation we were using before, it would be that, right?"},{"start":3723.57,"text":"So this is not a way to say the third derivative is small that is invariant under changes of coordinates. So now you have to figure out how would you say the third derivative is small in a way that if I do a linear change of coordinates, it's invariant, right?"},{"start":3745.96,"text":"So that's actually what we're going to get. Actually, what happens when you do this is the most stunning thing. Instead of a silly theorem that looks like this, if, and then a whole bunch of absolutely unknowable hypotheses were to occur, and then you say then, then you'd have a completely useless conclusion, right? That's my template for a traditional convergence result."},{"start":3769.13,"text":"then it's actually going to be very weird. It's actually going to be if a small number of actually weirdly knowable things hold, then, and then the conclusions are actually going to be, they're not going to be hilariously wrong. They're not going to be hilariously useless. So, okay, so that's the idea. So we'll look at this."},{"start":3791.79,"text":"Okay, and actually we need to use it later in the class. So, okay, and they call this self-concordance. So here it is. It's this. It says a function is self-concordant if the absolute value, this is just from R to R, if the absolute value of the third derivative is less than the, two doesn't matter, that's just for convenience, the second derivative to the three halves power."}],"speech_gaps":[],"frame":"../frames/v014/023.webp","frame_time":3680.49},{"title":"自洽函数与牛顿法的分析","segments":[{"id":161,"text":"Okay, so that's it. Now, and the reason is this, is this is affine invariant, right? If I replace, you know, if I replace this, if I have f tilde of y is f of a y plus b, then what happens is the third derivative scales like the cube of a and the second like the square, right? If you take those numbers and you plug it into that formula, the a's drop away. Everybody.","zh":"好的，就是这样。现在，原因就是这个，这是因为它是仿射不变的，对吧？如果我替换这个，比如，如果我有 f ̃(y) = f(a y + b)，那么会发生的是，三阶导数会按 a 的立方缩放，二阶导数则按 a 的平方缩放，对吧？如果你把这些数值代入那个公式，a 的项就会被抵消掉。大家明白吗？","start":3822.03,"end":3851.41},{"id":162,"text":"Got this?","zh":"大家听懂了吗？","start":3852.16,"end":3852.72},{"id":163,"text":"So, as a matter of fact, as an exercise,","zh":"事实上，作为一个练习，","start":3853.04,"end":3855.7},{"id":164,"text":"if I just said, write down something","zh":"如果我直接说，写出一个东西","start":3855.88,"end":3859.56},{"id":165,"text":"that says that their derivative is small,","zh":"说明其导数很小，","start":3859.56,"end":3860.66},{"id":166,"text":"but it has to be invariant to any affine change of variable,","zh":"但它必须对任何变量的仿射变换保持不变，","start":3861.86,"end":3865.98},{"id":167,"text":"you kind of would have to come up with that.","zh":"你基本上就得写出这样的东西。","start":3866.5,"end":3868.3},{"id":168,"text":"Everybody see that?","zh":"大家看懂了吗？","start":3870.52,"end":3871.44},{"id":169,"text":"You just have to, right?","zh":"你只需要这么做，对吧？","start":3871.8,"end":3873.42},{"id":170,"text":"So, I don't know if this makes sense.","zh":"所以，我不知道这有没有道理。","start":3874.54,"end":3876.78},{"id":171,"text":"Now, on the other hand, if someone just walks up to you on the street","zh":"另一方面，如果有人在街上走过来对你说，是的，我在想牛顿法。","start":3877.6,"end":3879.98},{"id":172,"text":"and says, yeah, I was thinking about Newton's method.","zh":"我有一个新的‘小’的定义，抱歉，近似，我有一个新的‘三次导数’的定义，","start":3879.98,"end":3881.86},{"id":173,"text":"I have a new definition of small, sorry, nearly, I have a new definition of the third derivative","zh":"或者我有一个新的‘近似二次’的定义。就是这个意思。你会说，这从哪儿来的？我的意思是，这有点令人震惊，对吧？所以，好的。大家明白这个意思了吗？","start":3882.16,"end":3887.08},{"id":174,"text":"of small, or I have a new definition of what it means to be nearly quadratic. It's that. You would","zh":"所以，有些奇怪的事情会发生。事实上，很多情况下，当然不是全部，不是全部，当然也不是全部，","start":3887.08,"end":3892.14},{"id":175,"text":"go like, where did that come from? I mean, it's a bit shocking, right? So, okay. Everybody got the","zh":"会发生一些奇怪的事情。","start":3892.14,"end":3899.8},{"id":176,"text":"idea? So, some weird things happen. It turns out that a lot, certainly not all, not all, certainly","zh":"想法？所以，有些奇怪的事情会发生。结果发现，很多，当然不是全部，不是全部，当然","start":3899.8,"end":3910.16},{"id":177,"text":"Certainly, not all convex functions are so-called self-concordant, but a whole lot of the ones","zh":"当然，并非所有凸函数都是所谓的自洽函数，但我们在实际中遇到的很多函数都是。","start":3910.16,"end":3916.48},{"id":178,"text":"that we encounter are.","zh":"无论如何，这就是如此，你会说，好吧，这没问题。","start":3916.48,"end":3918.1},{"id":179,"text":"Anyway, so that's that, and you'd say, okay, well, that's fine.","zh":"你大概会期望基于这种函数的牛顿法会比较简单，对牛顿法基于自洽性的分析，你可能会觉得它会比较简单，而你确实是对的。","start":3920.32,"end":3923.54},{"id":180,"text":"You kind of would expect a Newton's method based on this to be, an analysis of Newton's","zh":"而且这里有一些奇怪的微积分内容，你可以实际探讨各种问题，但其实这很酷，因为你最终会展示出我们关心的很多内容，这里就有一个例子。","start":3923.7,"end":3928.98},{"id":181,"text":"method based on self-concordance, you'd imagine it to be simpler, and you would be right.","zh":"基于自洽性的方法，你可能会认为它更简单，你确实是对的。","start":3928.98,"end":3934.44},{"id":182,"text":"and there's some this there's a lot of weird calculus stuff here you can","zh":"这里有一些奇怪的微积分内容，你可以","start":3935.42,"end":3939.56},{"id":183,"text":"actually work about various things but actually it's kind of cool because you","zh":"实际上对各种事物进行研究，但其实它有点酷，因为你会","start":3939.56,"end":3943.1},{"id":184,"text":"end up showing a lot of the things that we care about here's one right here","zh":"最终展示出我们在这里关心的许多内容，这里有一个例子","start":3943.1,"end":3946.36},{"id":185,"text":"right","zh":"右边","start":3947.06,"end":3947.46},{"id":186,"text":"Weirdly, that's just self-concordant, which would not be fun to show. It's not that hard, actually, to tell you the truth. It's not that bad. And a bunch of other functions are and things like that. So, you know, again, I'm not going to, I don't, this is not, I mean, it actually elucidates why a lot of practical things actually do work well. But I would say that as a practical matter, it's not that important, right? But we can, we'll go.","zh":"奇怪的是，这仅仅就是自洽函数，要证明这一点并不有趣。说实话，其实并不难，它并不那么糟糕。还有许多其他函数也是如此。所以，你知道的，再次强调，我不会，我也不打算，这并不是说，我的意思是，它实际上解释了为什么很多实际应用中的方法确实能很好地工作。但我要说，作为实际应用而言，这并不那么重要，对吧？但我们还是可以继续。","start":3948.94,"end":3977.08}],"notes":["本段讨论了自洽函数（self-concordant）的性质，特别是其在仿射变换下的不变性。讲者指出，如果函数f被替换为f̃(y) = f(a y + b)，那么三阶导数会按a的立方缩放，二阶导数按a的平方缩放。当将这些数值代入公式时，a项会抵消，这说明自洽函数在仿射变换下保持不变性。","讲者进一步指出，如果要写出一个导数较小的表达式，同时保持对任何仿射变换的不变性，就必须使用自洽函数的定义。这表明自洽函数在某些优化问题中具有特殊的重要性。","讲者提到，如果有人提出新的关于牛顿法的定义，比如对三阶导数或近似二次性的新定义，这会让人感到惊讶。这说明自洽函数的定义在牛顿法的分析中具有一定的独特性。","讲者指出，并非所有凸函数都是自洽函数，但很多我们遇到的函数确实是自洽函数。这表明自洽函数在实际应用中具有广泛的适用性。","讲者提到，基于自洽函数的牛顿法分析会更简单，这说明自洽函数在优化算法的理论分析中具有简化作用。","最后，讲者指出，虽然自洽函数的理论分析在实践中可能不是最重要的，但它确实解释了为什么许多实际问题能够有效求解。这表明自洽函数在理论和实践之间具有桥梁作用。"],"formulas":[],"uncertainties":["可能听不清的公式细节，如具体缩放比例或变换过程"],"diagram":"none","start":3822.03,"end":3977.08,"asr_flags":[],"math_clarifications":["原始片段中未提供明确的数学恒等关系或公式推导，因此所有公式均无法核定，需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":3822.03,"text":"Okay, so that's it. Now, and the reason is this, is this is affine invariant, right? If I replace, you know, if I replace this, if I have f tilde of y is f of a y plus b, then what happens is the third derivative scales like the cube of a and the second like the square, right? If you take those numbers and you plug it into that formula, the a's drop away. Everybody."},{"start":3852.16,"text":"Got this?"},{"start":3853.04,"text":"So, as a matter of fact, as an exercise,"},{"start":3855.88,"text":"if I just said, write down something"},{"start":3859.56,"text":"that says that their derivative is small,"},{"start":3861.86,"text":"but it has to be invariant to any affine change of variable,"},{"start":3866.5,"text":"you kind of would have to come up with that."},{"start":3870.52,"text":"Everybody see that?"},{"start":3871.8,"text":"You just have to, right?"},{"start":3874.54,"text":"So, I don't know if this makes sense."},{"start":3877.6,"text":"Now, on the other hand, if someone just walks up to you on the street"},{"start":3879.98,"text":"and says, yeah, I was thinking about Newton's method."},{"start":3882.16,"text":"I have a new definition of small, sorry, nearly, I have a new definition of the third derivative"},{"start":3887.08,"text":"of small, or I have a new definition of what it means to be nearly quadratic. It's that. You would"},{"start":3892.14,"text":"go like, where did that come from? I mean, it's a bit shocking, right? So, okay. Everybody got the"},{"start":3899.8,"text":"idea? So, some weird things happen. It turns out that a lot, certainly not all, not all, certainly"},{"start":3910.16,"text":"Certainly, not all convex functions are so-called self-concordant, but a whole lot of the ones"},{"start":3916.48,"text":"that we encounter are."},{"start":3920.32,"text":"Anyway, so that's that, and you'd say, okay, well, that's fine."},{"start":3923.7,"text":"You kind of would expect a Newton's method based on this to be, an analysis of Newton's"},{"start":3928.98,"text":"method based on self-concordance, you'd imagine it to be simpler, and you would be right."},{"start":3935.42,"text":"and there's some this there's a lot of weird calculus stuff here you can"},{"start":3939.56,"text":"actually work about various things but actually it's kind of cool because you"},{"start":3943.1,"text":"end up showing a lot of the things that we care about here's one right here"},{"start":3947.06,"text":"right"},{"start":3948.94,"text":"Weirdly, that's just self-concordant, which would not be fun to show. It's not that hard, actually, to tell you the truth. It's not that bad. And a bunch of other functions are and things like that. So, you know, again, I'm not going to, I don't, this is not, I mean, it actually elucidates why a lot of practical things actually do work well. But I would say that as a practical matter, it's not that important, right? But we can, we'll go."}],"speech_gaps":[],"frame":"../frames/v014/024.webp","frame_time":3834.03},{"title":"牛顿法的复杂度分析与实际应用","segments":[{"id":187,"text":"Keep going. So, when you do, when you, in the sense of Nesterov and Nemirovsky do their analysis, they end up with something pretty crazy. This, the, you actually end up again, it has exactly the same form. It says, now you're using the Newton decrement. In the classical analysis, we're using norm of the gradient. Norm of the gradient is not affine, not affine independent. If I change coordinates,","zh":"继续。因此，当你按照Nesterov和Nemirovsky的分析方式去做时，你会得到一个非常奇怪的结果。这，那个，你实际上又会得到一个完全相同的形式。它说，现在你使用的是牛顿减量。在经典分析中，我们使用的是梯度的范数。梯度的范数不是仿射不变的，也不是仿射独立的。如果我改变坐标系，","start":3977.96,"end":4003.38},{"id":188,"text":"then the norm of the gradient changes, right? Here, but remember the Newton decrement does not. That's an affine invariant quantity. And so it says if the Newton decrement is bigger than some number, then you get a guaranteed decrease. Once on the other side, you get something like that. And so you get this very, this is a complexity bound that looks like that, right?","zh":"那么梯度的范数就会改变，对吧？在这里，但请记住牛顿减量是不会改变的。这是一个仿射不变量。因此，它说如果牛顿减量大于某个数值，那么你就能保证得到一个下降。一旦到了另一边，你就会得到类似的结果。因此，你会得到一个看起来像这样的复杂度界限，对吧？","start":4004.42,"end":4027.22},{"id":189,"text":"Yeah, these things depend on the backtracking parameters, but a sloppy analysis tells you that it ends up saying that the maximum number of iterations is less than 375 times f of x zero minus p star. Yes, that issue is still there, right? You know, plus six. Six is the way I say log, log, log one over epsilon.","zh":"是的，这些结果依赖于回溯参数，但一个粗略的分析会告诉你，最终得到的最大迭代次数小于375乘以f(x₀)减去p*。是的，这个问题仍然存在，对吧？你知道，加上六。六是我用来表示log，log，log 1/ε的方式。","start":4028.84,"end":4053.96},{"id":190,"text":"In fact, I used to give talks when I knew there were going to be a bunch of theorists in the crowd. I replaced log log with 4 and would do this just to taunt them. And I'd wait, and sure enough, I'd see somebody itching and they're twitching, and then they're like, this is an iterative algorithm. I was like, oh, I'm sorry. By 4, I meant log log 1 over epsilon. Sorry, that's a macro for me.","zh":"事实上，我以前在做报告时，如果我知道听众中有许多理论家，我会把log log替换成4，以此来嘲弄他们。我会等待，然后确实会看到有人坐立不安，然后他们会说，这是一个迭代算法。我会说，哦，对不起，这里的4指的是log log 1/ε。抱歉，这是我的一个宏定义。","start":4054.68,"end":4079.06},{"id":191,"text":"That's anyway, it was, it works pretty, you could, I recommend this. If you know people like that, you could try this too. So, uh, okay. Um, all right, there it is. That's the, the, there you go. So you get actually something that's weird. What's weird is that these are actually not, uh, I'll show you just some examples here, but here's, here's your minimizing a, um, you are minimizing a, uh, um,","zh":"总之，它起作用得相当不错，你可以，我推荐这个。如果你认识这样的人，你也可以尝试这样做。所以，嗯，好吧，就这样了。这就是，那个，就是这样。因此，你实际上会得到一个奇怪的结果。奇怪的是，这些其实并不是，嗯，我会在这里给你展示一些例子，但这里是你在最小化一个，嗯，你在最小化一个，嗯，嗯，","start":4079.4,"end":4103.42},{"id":192,"text":"It's a log barrier for a set of linear inequalities or something. And then what we did was we just, so this is, so to explain what we did is we generated a sample, solved it using Newton's method, noted the number of iterations, and we also noted at that point p star. Then we could note this, right? Which is the difference. And then you just scatter plot it. And you get something like this. Now, by the way, the bound is a line that would be almost vertical here.","zh":"这是一个针对一组线性不等式的对数障碍函数。然后我们所做的就是，我们生成了一个样本，使用牛顿法求解，记录了迭代次数，并且在那个点记录了p星。然后我们就可以注意到这个差异，对吧？接着你只需要做一个散点图。你会得到类似这样的结果。顺便说一句，这个界限是一条几乎垂直的线。","start":4104.3,"end":4132.93},{"id":193,"text":"Right. Because it's got this coefficient 375 in there. But still, what's interesting is actually it's really interesting. It looks like if you're if you're like deposed in a in a math courtroom or something like that, you know, with with scary people all around you listening to everything you say, hoping you're going to say something wrong. You use the number 375. It's fine.","zh":"对的。因为它里面有一个系数375。但仍然，真正有趣的是，这其实非常有趣。看起来如果你被置于一个数学法庭中，或者类似的地方，周围都是可怕的人，他们听你说话，希望你犯错。你使用数字375。这没问题。","start":4133.37,"end":4157.56}],"notes":["本段讲授了牛顿法在凸优化中的复杂度分析，特别是Nesterov和Nemirovsky的分析方法。他们指出，牛顿减量（Newton decrement）是一个仿射不变量，与梯度范数不同，后者在坐标变换时会变化。牛顿减量用于判断是否可以保证函数值的下降，从而得到一个复杂度界。","讲者提到，这种复杂度界依赖于回溯参数，但粗略分析表明，最大迭代次数小于375倍的初始函数值与最优值的差。此外，还涉及对数项的处理，如log log 1/ε，这在优化理论中是常见的复杂度表达。","讲者以幽默的方式提到，他曾在学术会议上用4代替log log 1/ε，以此调侃理论家们对精确表达式的执着。这说明在实际应用中，有时会简化表达式以方便理解。","讲者进一步说明，实际应用中，通过生成样本、使用牛顿法求解、记录迭代次数和最优值，可以绘制散点图来展示复杂度界。这种实际操作有助于理解理论分析的直观意义。","讲者指出，复杂度界中的系数375虽然看起来奇怪，但在某些情况下，它可能具有实际意义，比如在数学讨论中，使用这样的数字可能显得更加正式或严肃。","最后，讲者以幽默的方式提到，使用375这样的数字可能在某些场合下显得特别，但本质上是合理的，这反映了理论分析与实际应用之间的微妙关系。"],"formulas":[],"uncertainties":["log log 1 over epsilon"],"diagram":"none","start":3977.96,"end":4157.56,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3977.96,"text":"Keep going. So, when you do, when you, in the sense of Nesterov and Nemirovsky do their analysis, they end up with something pretty crazy. This, the, you actually end up again, it has exactly the same form. It says, now you're using the Newton decrement. In the classical analysis, we're using norm of the gradient. Norm of the gradient is not affine, not affine independent. If I change coordinates,"},{"start":4004.42,"text":"then the norm of the gradient changes, right? Here, but remember the Newton decrement does not. That's an affine invariant quantity. And so it says if the Newton decrement is bigger than some number, then you get a guaranteed decrease. Once on the other side, you get something like that. And so you get this very, this is a complexity bound that looks like that, right?"},{"start":4028.84,"text":"Yeah, these things depend on the backtracking parameters, but a sloppy analysis tells you that it ends up saying that the maximum number of iterations is less than 375 times f of x zero minus p star. Yes, that issue is still there, right? You know, plus six. Six is the way I say log, log, log one over epsilon."},{"start":4054.68,"text":"In fact, I used to give talks when I knew there were going to be a bunch of theorists in the crowd. I replaced log log with 4 and would do this just to taunt them. And I'd wait, and sure enough, I'd see somebody itching and they're twitching, and then they're like, this is an iterative algorithm. I was like, oh, I'm sorry. By 4, I meant log log 1 over epsilon. Sorry, that's a macro for me."},{"start":4079.4,"text":"That's anyway, it was, it works pretty, you could, I recommend this. If you know people like that, you could try this too. So, uh, okay. Um, all right, there it is. That's the, the, there you go. So you get actually something that's weird. What's weird is that these are actually not, uh, I'll show you just some examples here, but here's, here's your minimizing a, um, you are minimizing a, uh, um,"},{"start":4104.3,"text":"It's a log barrier for a set of linear inequalities or something. And then what we did was we just, so this is, so to explain what we did is we generated a sample, solved it using Newton's method, noted the number of iterations, and we also noted at that point p star. Then we could note this, right? Which is the difference. And then you just scatter plot it. And you get something like this. Now, by the way, the bound is a line that would be almost vertical here."},{"start":4133.37,"text":"Right. Because it's got this coefficient 375 in there. But still, what's interesting is actually it's really interesting. It looks like if you're if you're like deposed in a in a math courtroom or something like that, you know, with with scary people all around you listening to everything you say, hoping you're going to say something wrong. You use the number 375. It's fine."}],"speech_gaps":[],"frame":"../frames/v014/025.webp","frame_time":3989.96},{"title":"凸优化中的近似与估计","segments":[{"id":194,"text":"And then they would say, is that true? And you go, oh, that's actually true, right? But what's very interesting here is that if you replace the 375 with one half, for example, it actually gets a pretty good estimate of actually how many steps it's going to take. So this makes sense. And it's actually pretty cool. So you can actually give a talk to two audiences and they can even be mixed together, right?","zh":"然后他们会问，这是真的吗？你会回答，哦，这实际上是正确的，对吧？但这里非常有趣的是，如果你把375替换成一半，比如0.5，实际上能得到一个相当好的估计，说明它到底需要多少步。这很合理。而且这真的很酷。所以你实际上可以给两个不同的听众做报告，甚至这两个听众可以混合在一起，对吧？","start":4158.09,"end":4187.43},{"id":195,"text":"Because you just put a constant in front, like you just say it's this. And then if someone says, what is a true statement? You'd say, well, to make this a true statement, I'd have to say 375. But if you wanted to say, here's something that is probably true and a good approximation, you just change C to 0.5 and you're done. Right? So, okay. It's kind of cool. So this is how that works. Oh, by the way, can someone explain...","zh":"因为你只需要在前面加一个常数，比如你直接说这就是。然后如果有人问，什么是正确的陈述？你会说，为了使这个陈述正确，我必须说375。但如果你想说，这里有一个大概正确且好的近似值，你只需要把C改成0.5，就完成了。对吧？所以，好吧。这有点酷。这就是它的运作方式。顺便问一下，有人能解释一下……","start":4187.95,"end":4216.49},{"id":196,"text":"This one?","zh":"这个？","start":4217.9,"end":4218.52},{"id":197,"text":"So here, this difference was like,","zh":"在这里，这个差异就像是，","start":4220.6,"end":4224.94},{"id":198,"text":"I don't know, let's say it was 12,","zh":"我不知道，假设它是12，","start":4225.04,"end":4226.34},{"id":199,"text":"but it converged in eight iterations.","zh":"但它在八次迭代中就收敛了。","start":4226.56,"end":4229.98},{"id":200,"text":"So what word would you say","zh":"如果你有人问解释这个，你会说什么词","start":4231.12,"end":4233.6},{"id":201,"text":"if someone said explain that?","zh":"如果有人问解释这个？","start":4233.6,"end":4234.72},{"id":202,"text":"What happened there?","zh":"那里发生了什么？","start":4238.34,"end":4239.56},{"id":203,"text":"How about just dumb luck?","zh":"也许只是运气好？","start":4243.88,"end":4246.4},{"id":204,"text":"Right?","zh":"对吧？","start":4247.18,"end":4247.7},{"id":205,"text":"There you are in some I don't even know what the dimension of these things is. Oh, okay","zh":"你就在那里，我甚至不知道这些事物的维度是多少。哦，好吧","start":4247.9,"end":4252.0},{"id":206,"text":"I have no idea. It's either 50 variables or 500 variable doesn't matter","zh":"我完全不知道。是50个变量还是500个变量都没关系","start":4252.0,"end":4256.04},{"id":207,"text":"But the point was you asked for directions went that way you asked again six times late at seventh time you asked for directions and then","zh":"但重点是你之前问过方向，然后你又问了六次，到了第七次你再次询问方向，","start":4256.04,"end":4262.88},{"id":208,"text":"By dumb luck. It just happened to point exactly towards the minimum, right?","zh":"靠运气。它恰好正好指向了最小值，对吧？","start":4262.88,"end":4267.0},{"id":209,"text":"So so so that's what those are that those are just those are those are just dumb luck. So","zh":"所以，所以，这就是那些情况，那些就是所谓的运气好。所以","start":4267.1,"end":4271.46},{"id":210,"text":"Yeah","zh":"是的","start":4272.2,"end":4272.6},{"id":211,"text":"Yeah?","zh":"是的？","start":4272.6,"end":4272.66},{"id":212,"text":"On the previous slide, what was lambda of x?","zh":"在上一张幻灯片中，x的lambda是什么？","start":4273.04,"end":4276.0},{"id":213,"text":"What's lambda?","zh":"什么是lambda？","start":4277.46,"end":4278.16},{"id":214,"text":"Lambda is this Newton decrement, right?","zh":"lambda就是这个牛顿减量，对吧？","start":4278.32,"end":4281.24},{"id":215,"text":"So that's actually, it's this, right?","zh":"所以这实际上是这个，对吧？","start":4281.34,"end":4284.14},{"id":216,"text":"It's the gradient here.","zh":"它就是这里的梯度。","start":4284.4,"end":4287.8},{"id":217,"text":"Actually, it's something like this divided by 2, I think.","zh":"实际上，我认为它是这个除以2。","start":4292.58,"end":4295.56},{"id":218,"text":"Actually, lambda is the square root of this.","zh":"实际上，lambda 是这个数的平方根。","start":4295.62,"end":4297.88},{"id":219,"text":"This is very close.","zh":"这非常接近。","start":4298.04,"end":4299.32},{"id":220,"text":"Lambda, here, let me put it, yeah, okay, here.","zh":"Lambda，让我在这里说明一下，嗯，好的，这里。","start":4299.84,"end":4302.38},{"id":221,"text":"lambda is something like that","zh":"lambda 大致是这样的。","start":4302.6,"end":4304.98},{"id":222,"text":"and there's a factor of 2 in there","zh":"其中有一个因子 2。","start":4304.98,"end":4306.42},{"id":223,"text":"right, roughly","zh":"对，大致如此。","start":4307.42,"end":4308.3},{"id":224,"text":"I can't remember where the square root of 2 goes","zh":"我记不太起平方根 2 去哪了。","start":4308.3,"end":4311.74},{"id":225,"text":"but that's what it is","zh":"但这就是它的值。","start":4311.74,"end":4312.38},{"id":226,"text":"actually it's super interesting","zh":"实际上，这非常有趣","start":4313.2,"end":4314.52},{"id":227,"text":"it is the size of the gradient","zh":"它是梯度的大小","start":4314.52,"end":4316.96},{"id":228,"text":"in the current","zh":"在当前","start":4317.82,"end":4318.94},{"id":229,"text":"Hessian norm","zh":"Hessian范数","start":4319.68,"end":4320.56},{"id":230,"text":"which is pretty","zh":"这相当","start":4322.02,"end":4322.76},{"id":231,"text":"and that's how you","zh":"而且这就是你","start":4323.98,"end":4325.1},{"id":232,"text":"could kind of guess that it's going to be affine invariant","zh":"可能大致猜测它将是仿射不变的","start":4325.7,"end":4327.72},{"id":233,"text":"right, so","zh":"对，所以","start":4328.36,"end":4329.24},{"id":234,"text":"okay","zh":"好的","start":4329.24,"end":4330.0},{"id":235,"text":"Okay, so we looked at this a bit.","zh":"嗯，我们刚才稍微看一下这个内容。","start":4330.0,"end":4333.92},{"id":236,"text":"And now we'll say a little bit about implementation.","zh":"现在我们再稍微谈谈实现方面。","start":4334.52,"end":4335.92}],"notes":["本段讨论了在凸优化中，如何通过替换常数项来获得对迭代次数的近似估计。例如，将375替换为0.5，可以得到一个较好的估计值。这说明在某些情况下，即使不精确，也可以通过调整参数来获得合理的近似结果。","讲者提到，如果要使陈述为真，必须使用精确的数值（如375），但若只是希望得到一个合理的近似，可以将常数项调整为0.5。这反映了在实际应用中，有时需要在精确性和计算效率之间进行权衡。","讲者通过一个例子说明，即使在高维空间中，某些情况下也可能因为“运气”而恰好指向最优解。这表明在优化过程中，某些结果可能并非完全由算法决定，而是受到初始条件或随机因素的影响。","讲者提到“lambda”是牛顿下降量，它与梯度和Hessian矩阵有关。这表明在凸优化中，lambda用于衡量当前点的梯度大小，且其计算涉及Hessian矩阵的范数。","讲者提到lambda与梯度和Hessian矩阵有关，但具体关系存在不确定性，例如是否需要除以2或开平方。这说明在实际应用中，这些关系可能需要进一步验证或根据具体情况进行调整。","讲者提到lambda的大小与梯度在Hessian范数下的大小有关，并且这有助于理解其在仿射不变性中的作用。这表明lambda在优化过程中具有重要的理论意义，但其具体计算可能需要更深入的分析。"],"formulas":[],"uncertainties":["lambda 是梯度除以2还是开平方","lambda 的具体计算是否需要除以2","lambda 的具体计算是否需要开平方"],"diagram":"none","start":4158.09,"end":4335.92,"asr_flags":[211],"math_clarifications":["公式中的lambda未明确其数学定义，Hessian矩阵未定义，梯度的表示方式不明确，且未说明lambda的具体数学含义。此外，公式中未包含必要的数学条件或假设，无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":43,"raw_segments":[{"start":4158.09,"text":"And then they would say, is that true? And you go, oh, that's actually true, right? But what's very interesting here is that if you replace the 375 with one half, for example, it actually gets a pretty good estimate of actually how many steps it's going to take. So this makes sense. And it's actually pretty cool. So you can actually give a talk to two audiences and they can even be mixed together, right?"},{"start":4187.95,"text":"Because you just put a constant in front, like you just say it's this. And then if someone says, what is a true statement? You'd say, well, to make this a true statement, I'd have to say 375. But if you wanted to say, here's something that is probably true and a good approximation, you just change C to 0.5 and you're done. Right? So, okay. It's kind of cool. So this is how that works. Oh, by the way, can someone explain..."},{"start":4217.9,"text":"This one?"},{"start":4220.6,"text":"So here, this difference was like,"},{"start":4225.04,"text":"I don't know, let's say it was 12,"},{"start":4226.56,"text":"but it converged in eight iterations."},{"start":4231.12,"text":"So what word would you say"},{"start":4233.6,"text":"if someone said explain that?"},{"start":4238.34,"text":"What happened there?"},{"start":4243.88,"text":"How about just dumb luck?"},{"start":4247.18,"text":"Right?"},{"start":4247.9,"text":"There you are in some I don't even know what the dimension of these things is. Oh, okay"},{"start":4252.0,"text":"I have no idea. It's either 50 variables or 500 variable doesn't matter"},{"start":4256.04,"text":"But the point was you asked for directions went that way you asked again six times late at seventh time you asked for directions and then"},{"start":4262.88,"text":"By dumb luck. It just happened to point exactly towards the minimum, right?"},{"start":4267.1,"text":"So so so that's what those are that those are just those are those are just dumb luck. So"},{"start":4272.2,"text":"Yeah"},{"start":4272.6,"text":"Yeah?"},{"start":4273.04,"text":"On the previous slide, what was lambda of x?"},{"start":4277.46,"text":"What's lambda?"},{"start":4278.32,"text":"Lambda is this Newton decrement, right?"},{"start":4281.34,"text":"So that's actually, it's this, right?"},{"start":4284.4,"text":"It's the gradient here."},{"start":4292.58,"text":"Actually, it's something like this divided by 2, I think."},{"start":4295.62,"text":"Actually, lambda is the square root of this."},{"start":4298.04,"text":"This is very close."},{"start":4299.84,"text":"Lambda, here, let me put it, yeah, okay, here."},{"start":4302.6,"text":"lambda is something like that"},{"start":4304.98,"text":"and there's a factor of 2 in there"},{"start":4307.42,"text":"right, roughly"},{"start":4308.3,"text":"I can't remember where the square root of 2 goes"},{"start":4311.74,"text":"but that's what it is"},{"start":4313.2,"text":"actually it's super interesting"},{"start":4314.52,"text":"it is the size of the gradient"},{"start":4317.82,"text":"in the current"},{"start":4319.68,"text":"Hessian norm"},{"start":4322.02,"text":"which is pretty"},{"start":4323.98,"text":"and that's how you"},{"start":4325.7,"text":"could kind of guess that it's going to be affine invariant"},{"start":4328.36,"text":"right, so"},{"start":4329.24,"text":"okay"},{"start":4330.0,"text":"Okay, so we looked at this a bit."},{"start":4334.52,"text":"And now we'll say a little bit about implementation."}],"speech_gaps":[],"frame":"../frames/v014/026.webp","frame_time":4170.09},{"title":"牛顿法与线性代数的关系","segments":[{"id":237,"text":"This is actually far more important, and this is interesting,","zh":"这实际上更为重要，而且这很有趣，","start":4336.08,"end":4338.78},{"id":238,"text":"because now we're going to tie it to last week.","zh":"因为现在我们将它与上周的内容联系起来。","start":4338.9,"end":4341.32},{"id":239,"text":"which is numerical linear algebra, right? Because the, so basically what it says is, let's review where we are. At a high level, you would say this. How do you minimize a smooth convex function? And the answer is Newton's method. You say, well, what does that do? You say that converts the solution to how to solve a smooth convex function is, we don't know how to do that, but we do know how to minimize a convex quadratic function. That's easy. That's actually linear algebra.","zh":"上周的内容是数值线性代数，对吧？因为基本上它说的是，让我们回顾一下我们目前所处的位置。从高层次上来说，你会说，如何最小化一个光滑凸函数？答案是牛顿法。你会说，那它做了什么呢？你会说，将如何解决光滑凸函数的问题转化为如何解决一个光滑凸二次函数的问题。这很容易。实际上这就是线性代数。","start":4342.47,"end":4371.23},{"id":240,"text":"That's solving a set of linear equations, right? So you could say that Newton's method reduces the solution of the minimization of a smooth convex function to minimizing a sequence of quadratic functions. And someone says, okay, how do you minimize a quadratic function? You go, ah, that's linear algebra. That's called linear algebra. Everybody following this? So when you roll it up, it says that we can minimize a smooth convex function.","zh":"这就是解一组线性方程，对吧？因此，你可以这样说，牛顿法将光滑凸函数的最小化问题转化为一系列二次函数的最小化问题。有人问，那如何最小化一个二次函数？你会回答，啊，这就是线性代数。这就是所谓的线性代数。大家跟上了吗？因此，当你把这些内容综合起来时，它说明我们可以最小化一个光滑凸函数。","start":4371.74,"end":4398.1},{"id":241,"text":"by an iteration that's going to take some number of tens or whatever of iterations. Each iteration is linear algebra, right? And in fact, the linear algebra is very simple. You're just solving this Newton system, h times delta x equals minus g, right? You know, one way to do it is just by Cholesky factorization, right? So you do a Cholesky factorization, and that'll cost you n cubed flops for an unstructured system.","zh":"通过一个迭代过程，这个过程需要几十次迭代。每次迭代都是线性代数，对吧？事实上，线性代数非常简单。你只是在解这个牛顿系统，h乘以delta x等于负g，对吧？你知道，一种方法就是通过Cholesky分解来实现，对吧？因此，对于一个无结构的系统，这将消耗n的立方次浮点运算。","start":4398.78,"end":4426.49},{"id":242,"text":"you know um okay but here's the interesting part if the hessian is structured then and you know how to exploit it or even better basically you you know","zh":"你知道，嗯，但有趣的是，如果Hessian矩阵是有结构的，而且你知道如何利用它，或者甚至更好，基本上你，你知道，","start":4427.95,"end":4442.9},{"id":243,"text":"how to call the right libraries to exploit it or something like that. That's what I mean when I say you know how to exploit it. If that's the case, then this is going to work really well. Let me just give a couple of examples about how that works. We could do it. I mean, it doesn't matter, but we could do some kind of...","zh":"如何调用正确的库来利用它，或者类似的事情。这就是我所说的你知道如何利用它的意思。如果这种情况成立，那么这将非常有效。让我简单举几个例子来说明它是如何工作的。我们是可以做到的。我的意思是，这并不重要，但我们能够做一些类型的...","start":4443.65,"end":4469.68},{"id":244,"text":"we'll just do some kind of signal processing problem or optimal control problem, where you're estimating something, but in that case, the variables only interact locally in these types of problems, like in a control problem or something like that. What will happen then is the Hessian is then going to be banded.","zh":"我们将处理一些信号处理问题或最优控制问题，在这些问题中，你是在估计某些量，但在这种情况下，变量仅在这些类型的问题中局部相互作用，比如在控制问题中。这时，Hessian矩阵将会是带状的。","start":4470.56,"end":4493.82}],"notes":["本段讲解了牛顿法如何将光滑凸函数的最小化问题转化为一系列二次函数的最小化问题，而二次函数的最小化可以通过线性代数方法解决。"],"formulas":[],"uncertainties":["hessian is structured then and you know how to exploit it or even better basically you you know"],"diagram":"none","start":4336.08,"end":4493.82,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":4336.08,"text":"This is actually far more important, and this is interesting,"},{"start":4338.9,"text":"because now we're going to tie it to last week."},{"start":4342.47,"text":"which is numerical linear algebra, right? Because the, so basically what it says is, let's review where we are. At a high level, you would say this. How do you minimize a smooth convex function? And the answer is Newton's method. You say, well, what does that do? You say that converts the solution to how to solve a smooth convex function is, we don't know how to do that, but we do know how to minimize a convex quadratic function. That's easy. That's actually linear algebra."},{"start":4371.74,"text":"That's solving a set of linear equations, right? So you could say that Newton's method reduces the solution of the minimization of a smooth convex function to minimizing a sequence of quadratic functions. And someone says, okay, how do you minimize a quadratic function? You go, ah, that's linear algebra. That's called linear algebra. Everybody following this? So when you roll it up, it says that we can minimize a smooth convex function."},{"start":4398.78,"text":"by an iteration that's going to take some number of tens or whatever of iterations. Each iteration is linear algebra, right? And in fact, the linear algebra is very simple. You're just solving this Newton system, h times delta x equals minus g, right? You know, one way to do it is just by Cholesky factorization, right? So you do a Cholesky factorization, and that'll cost you n cubed flops for an unstructured system."},{"start":4427.95,"text":"you know um okay but here's the interesting part if the hessian is structured then and you know how to exploit it or even better basically you you know"},{"start":4443.65,"text":"how to call the right libraries to exploit it or something like that. That's what I mean when I say you know how to exploit it. If that's the case, then this is going to work really well. Let me just give a couple of examples about how that works. We could do it. I mean, it doesn't matter, but we could do some kind of..."},{"start":4470.56,"text":"we'll just do some kind of signal processing problem or optimal control problem, where you're estimating something, but in that case, the variables only interact locally in these types of problems, like in a control problem or something like that. What will happen then is the Hessian is then going to be banded."}],"speech_gaps":[],"frame":"../frames/v014/027.webp","frame_time":4348.08},{"title":"结构化问题与牛顿法的实现","segments":[{"id":245,"text":"because, you know, variable x doesn't interact with variable, you know, xi and xj. They only interact if i minus j is small enough, okay? That means, that means, if you go back to last week, that says, oh, we can solve those systems in linear time. Like, I would not be afraid to solve, I can certainly solve, I can compute the Newton direction if h was banded, let's say with a bandwidth of 20, if it's in a million dimensions, I could solve that problem.","zh":"因为，你知道的，变量x并不与变量xi和xj相互作用。它们只有在i减j足够小的时候才会相互作用，对吧？这意味着，如果你回到上周的内容，这就说明，哦，我们可以在线性时间内解决这些系统。比如，我不会害怕去解决，我当然可以解决，如果h是带状的，比如说带宽为20，即使是在一百万维的情况下，我也可以解决这个问题。","start":4496.41,"end":4524.09},{"id":246,"text":"This, I guarantee you, people in machine learning have absolutely not the slightest idea of. There might be one or two, but I doubt any more than that. Okay, maybe a few more, but not that many. And that's actually part of the reason it's very interesting is when people say, well, you couldn't use Newton's method. Why not? You go, well, first of all, you have to form this Hessian. And second, then you have to solve it. And everybody knows that's n cubed. But the point is, if it's structured, it's not.","zh":"我可以向你保证，机器学习领域的人对这一点完全没有概念。可能有一两个，但我怀疑不会更多。好吧，也许有几个更多，但并不多。实际上，这也是它非常有趣的原因之一，当人们说，嗯，你不能使用牛顿法。为什么不能？你会说，首先，你必须形成这个Hessian矩阵。其次，你必须求解它。而大家都知道这是n的立方次方。但关键是，如果它有结构，那就不是这样。","start":4524.89,"end":4552.24},{"id":247,"text":"Okay, and then you'd say how often does structure come up? And the answer is a lot more frequently than you would imagine. I mean, that also kind of makes sense, right? Okay, so this is Newton method, how you'd actually implement it. Oh, by the way, I mentioned this other method where you update basically the quadratic. What you do is you calculate the Hessian.","zh":"然后你会问，结构多常出现呢？答案是比你想象的要频繁得多。我的意思是，这也合情合理，对吧？所以这就是牛顿法，你如何实际实现它。顺便说一句，我提到了另一种方法，你基本上更新二次项。你所做的就是计算Hessian矩阵。","start":4553.72,"end":4578.29},{"id":248,"text":"Once and you use that as your you use that for the next like say 10 or 20 steps Right, you don't update the Hessian you updated every 20 steps It's got a name for it and I forgot what it's called that method is called, right? How do you do that here and what's the cost of that? This is completely dense. Right? No structure in addition. What do you do? Every 20 steps you evaluate the Hessian factor it that cost you n cubed","zh":"一旦计算出来，你就用它来进行接下来的比如10或20步。对，你不会在每一步都更新Hessian矩阵，而是在每20步更新一次。这种方法有一个名称，但我忘记了叫什么。这种方法叫做，对吧？你在这里是怎么做的？它的成本是多少？这完全是密集的。对吧？没有额外的结构。你怎么做？每20步你评估Hessian矩阵并进行因式分解，这成本是n的立方。","start":4579.31,"end":4606.57},{"id":249,"text":"Then how much do actually computing the Newton steps when you have different gradients? Here. What's the number? Or is that square? Exactly. So if n is big, that's a big savings, right? By the way, that method works perfectly well. People don't implement it because I think they're just lazy, so they just factor every time. But it's an old method from the 70s or 80s, and it's perfectly good, right? Probably people should use it.","zh":"那么，当你有不同的梯度时，实际计算牛顿步的成本是多少？在这里。这个数字是平方的吗？没错。所以如果n很大，这将是一个巨大的节省，对吧？顺便说一句，这种方法完全有效。人们不实现它，我想是因为他们太懒了，所以他们每次都会进行因式分解。但这是一个来自70年代或80年代的老方法，它完全有效，对吧？可能人们应该使用它。","start":4607.38,"end":4634.96},{"id":250,"text":"Okay, so here's a quick example, but I think what we're going to do is we're going to quit here. We'll quit here for now, and then I think there's a numeric... You're actually... Let me just mention one thing. You're doing something on the homework, and you're actually... We're only going to cover the material for that next Tuesday, so you'll have to read ahead to Newton method with equality constraints if you want to start on that earlier than next Tuesday. This is a heads up.","zh":"好的，所以这里有一个快速的例子，但我认为我们接下来要做的就是在这里结束。我们现在先结束这里，然后我想还有个数值……你实际上……让我先提一件事。你在做作业，你实际上……我们只会覆盖下周二的材料，所以如果你想在下周二之前开始做这个，你得提前阅读带有等式约束的牛顿法相关内容。这是个提醒。","start":4636.33,"end":4664.06}],"notes":["本段讨论了在结构化问题中使用牛顿法的实现方式，特别是当Hessian矩阵具有带状结构时，可以显著降低计算成本。讲者提到，如果Hessian矩阵的带宽为20，即使在百万维空间中，也可以高效求解。这表明结构化问题在实际应用中非常重要，因为它们允许使用更高效的算法。","讲者指出，虽然牛顿法在计算Hessian矩阵和求解线性系统时需要O(n³)的时间复杂度，但如果Hessian矩阵具有结构（如带状结构），则可以显著降低计算成本。这说明结构化问题在优化算法中具有实际意义。","讲者提到一种方法，即每隔一定步数（如20步）更新一次Hessian矩阵，而不是每次迭代都更新。这种方法虽然名称被遗忘，但其核心思想是利用Hessian矩阵的结构来减少计算量。","讲者强调，这种方法虽然有效，但实际应用中很少被使用，可能是因为人们更倾向于每次迭代都重新计算Hessian矩阵，尽管这可能效率较低。这表明在实际工程中，效率和实现复杂度之间存在权衡。","讲者提到，这种方法可以追溯到70年代或80年代，说明它是一个较为成熟的方法，但可能由于实现复杂性或习惯性原因未被广泛采用。","讲者最后提到，如果学生希望提前开始作业，需要提前阅读关于带等式约束的牛顿法内容，这表明课程内容的安排和学生自主学习的重要性。"],"formulas":[],"uncertainties":["I forgot what it's called that method is called"],"diagram":"none","start":4496.41,"end":4664.06,"asr_flags":[],"math_clarifications":["原文提到当Hessian矩阵具有带状结构时，可以在线性时间内求解系统，因此O(n^3)的复杂度不适用，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4496.41,"text":"because, you know, variable x doesn't interact with variable, you know, xi and xj. They only interact if i minus j is small enough, okay? That means, that means, if you go back to last week, that says, oh, we can solve those systems in linear time. Like, I would not be afraid to solve, I can certainly solve, I can compute the Newton direction if h was banded, let's say with a bandwidth of 20, if it's in a million dimensions, I could solve that problem."},{"start":4524.89,"text":"This, I guarantee you, people in machine learning have absolutely not the slightest idea of. There might be one or two, but I doubt any more than that. Okay, maybe a few more, but not that many. And that's actually part of the reason it's very interesting is when people say, well, you couldn't use Newton's method. Why not? You go, well, first of all, you have to form this Hessian. And second, then you have to solve it. And everybody knows that's n cubed. But the point is, if it's structured, it's not."},{"start":4553.72,"text":"Okay, and then you'd say how often does structure come up? And the answer is a lot more frequently than you would imagine. I mean, that also kind of makes sense, right? Okay, so this is Newton method, how you'd actually implement it. Oh, by the way, I mentioned this other method where you update basically the quadratic. What you do is you calculate the Hessian."},{"start":4579.31,"text":"Once and you use that as your you use that for the next like say 10 or 20 steps Right, you don't update the Hessian you updated every 20 steps It's got a name for it and I forgot what it's called that method is called, right? How do you do that here and what's the cost of that? This is completely dense. Right? No structure in addition. What do you do? Every 20 steps you evaluate the Hessian factor it that cost you n cubed"},{"start":4607.38,"text":"Then how much do actually computing the Newton steps when you have different gradients? Here. What's the number? Or is that square? Exactly. So if n is big, that's a big savings, right? By the way, that method works perfectly well. People don't implement it because I think they're just lazy, so they just factor every time. But it's an old method from the 70s or 80s, and it's perfectly good, right? Probably people should use it."},{"start":4636.33,"text":"Okay, so here's a quick example, but I think what we're going to do is we're going to quit here. We'll quit here for now, and then I think there's a numeric... You're actually... Let me just mention one thing. You're doing something on the homework, and you're actually... We're only going to cover the material for that next Tuesday, so you'll have to read ahead to Newton method with equality constraints if you want to start on that earlier than next Tuesday. This is a heads up."}],"speech_gaps":[],"frame":"../frames/v014/028.webp","frame_time":4508.41}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v014.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
