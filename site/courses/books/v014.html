 You can't form. Actually, they wouldn't even know. But let's suppose there's one who heard about it, went into Wikipedia and looked at it or something like that, and said, you can't do that. You can't form. You can either form or store 100,000 by 100,000 majors. And even if you could, you sure as hell couldn't compute this. You couldn't solve these equations, right? And then you'd say, chill."},{"id":150,"text":"Because as a matter of fact, from your description of the problem, I've determined that the Hessian is, you know, banded arrow. And they'll say, what's that? And you go, just don't worry about it. What it means is I can form that Hessian and I can compute the Newton step really fast. Everybody got that? So that would be how that would work. That's how it would work. Okay."},{"id":151,"text":"Okay, now the next topic, and you know, it's actually really cool. It addresses this question, this embarrassment, really, of the classical analysis of Newton's method, which was less sophisticated than the actual algorithm itself, right? Because the actual algorithm itself is affine independent, but then the analysis, you change coordinates, and they give you a different number for their upper bound. I mean, it's still useless, but they give you a different number."},{"id":152,"text":"So it turns out there's a weird variation on this. This comes from the late 80s and 90s from also Moscow. And it's developed by Nesterov and Nemirovsky. They have this 500 page, 600, 700 page book that it's not for the faint of heart. They do."},{"id":153,"text":"look at, they do look at third derivatives of things like, they look at the third derivative of things like the log determinant of a matrix, positive definite matrix, right? So they're very, they're all, that's the classical Soviet math training, right? One of them, Neborowski actually once told me, he said, yes, we don't learn matrices. He said, for you, it is a crutch. He said, it leads to sloppy and weak thinking."},{"id":154,"text":"And he said, we don't do that until much older. He says, we just do everything with indices. I was like, whoa, that's cool. So anyway, it's very, anyway, pretty crazy. Okay, fine. So here it is. And actually, it's a hilarious thing. It actually replaces, actually, it is only the following. And then by the time I tell the story enough, the solution is going to be kind of obvious, right? Although this was just stunning in the early 90s or whatever."}],"notes":["本段讨论了牛顿法在实际应用中遇到的挑战，特别是当问题规模很大时，Hessian矩阵的存储和计算变得不可行。然而，如果Hessian矩阵具有带状结构（banded arrow），则可以高效地计算牛顿步，这在实际中非常重要。","接下来，课程介绍了牛顿法分析的不足之处，即分析部分比算法本身更简单，且在坐标变换后给出的上界不同，这使得分析结果变得不实用。","课程提到Nesterov和Nemirovsky在80年代末和90年代初提出了一种改进的牛顿法分析方法，这种方法涉及高阶导数，如矩阵对数行列式的三阶导数，这反映了苏联数学教育的特点。","Nesterov提到，苏联数学教育中不使用矩阵，而是直接使用索引，这种方法被认为能避免矩阵带来的思维松散问题，这与西方数学教育方式形成对比。","最后，课程指出这种改进方法在90年代初令人震惊，但随着讲解的深入，其解决方案会变得显而易见，这表明该方法在理论上和实践中都有重要意义。","这些内容展示了牛顿法在优化问题中的实际应用和理论分析的复杂性，以及如何通过改进方法来克服传统分析的局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3507.62,"end":3666.11,"asr_flags":[],"raw_segments":[{"start":3507.62,"text":"to carry on my insult from earlier, would say like, are you kidding? There's like 100,000 variables. You can't form. Actually, they wouldn't even know. But let's suppose there's one who heard about it, went into Wikipedia and looked at it or something like that, and said, you can't do that. You can't form. You can either form or store 100,000 by 100,000 majors. And even if you could, you sure as hell couldn't compute this. You couldn't solve these equations, right? And then you'd say, chill."},{"start":3534.36,"text":"Because as a matter of fact, from your description of the problem, I've determined that the Hessian is, you know, banded arrow. And they'll say, what's that? And you go, just don't worry about it. What it means is I can form that Hessian and I can compute the Newton step really fast. Everybody got that? So that would be how that would work. That's how it would work. Okay."},{"start":3557.86,"text":"Okay, now the next topic, and you know, it's actually really cool. It addresses this question, this embarrassment, really, of the classical analysis of Newton's method, which was less sophisticated than the actual algorithm itself, right? Because the actual algorithm itself is affine independent, but then the analysis, you change coordinates, and they give you a different number for their upper bound. I mean, it's still useless, but they give you a different number."},{"start":3586.43,"text":"So it turns out there's a weird variation on this. This comes from the late 80s and 90s from also Moscow. And it's developed by Nesterov and Nemirovsky. They have this 500 page, 600, 700 page book that it's not for the faint of heart. They do."},{"start":3608.26,"text":"look at, they do look at third derivatives of things like, they look at the third derivative of things like the log determinant of a matrix, positive definite matrix, right? So they're very, they're all, that's the classical Soviet math training, right? One of them, Neborowski actually once told me, he said, yes, we don't learn matrices. He said, for you, it is a crutch. He said, it leads to sloppy and weak thinking."},{"start":3638.25,"text":"And he said, we don't do that until much older. He says, we just do everything with indices. I was like, whoa, that's cool. So anyway, it's very, anyway, pretty crazy. Okay, fine. So here it is. And actually, it's a hilarious thing. It actually replaces, actually, it is only the following. And then by the time I tell the story enough, the solution is going to be kind of obvious, right? Although this was just stunning in the early 90s or whatever."}],"speech_gaps":[],"frame":"../frames/v014/022.webp","frame_time":3519.62},{"title":"凸优化中的自洽性概念","segments":[{"id":155,"text":"The issue with the classical analysis is that we had to say the third derivative is small, but we set it in a way that was not affine independent. That was the issue. Let's say it's a function of just one variable, so we don't have to worry about tensors and three forms."},{"id":156,"text":"You know, how do you say the derivative is small? And like, here's the obvious one, right? You would say, how about like this, right? That's there. That looks to me like a statement that the third derivative is small. And you go, cool. Now you say, let's do an affine change of coordinates. And actually, this scales. So this is not a way. This is not an acceptable way. I guess if I was going to use the actual notation we were using before, it would be that, right?"},{"id":157,"text":"So this is not a way to say the third derivative is small that is invariant under changes of coordinates. So now you have to figure out how would you say the third derivative is small in a way that if I do a linear change of coordinates, it's invariant, right?"},{"id":158,"text":"So that's actually what we're going to get. Actually, what happens when you do this is the most stunning thing. Instead of a silly theorem that looks like this, if, and then a whole bunch of absolutely unknowable hypotheses were to occur, and then you say then, then you'd have a completely useless conclusion, right? That's my template for a traditional convergence result."},{"id":159,"text":"then it's actually going to be very weird. It's actually going to be if a small number of actually weirdly knowable things hold, then, and then the conclusions are actually going to be, they're not going to be hilariously wrong. They're not going to be hilariously useless. So, okay, so that's the idea. So we'll look at this."},{"id":160,"text":"Okay, and actually we need to use it later in the class. So, okay, and they call this self-concordance. So here it is. It's this. It says a function is self-concordant if the absolute value, this is just from R to R, if the absolute value of the third derivative is less than the, two doesn't matter, that's just for convenience, the second derivative to the three halves power."}],"notes":["本段讨论了 ing, right? So, okay. Everybody got the"},{"start":3899.8,"text":"idea? So, some weird things happen. It turns out that a lot, certainly not all, not all, certainly"},{"start":3910.16,"text":"Certainly, not all convex functions are so-called self-concordant, but a whole lot of the ones"},{"start":3916.48,"text":"that we encounter are."},{"start":3920.32,"text":"Anyway, so that's that, and you'd say, okay, well, that's fine."},{"start":3923.7,"text":"You kind of would expect a Newton's method based on this to be, an analysis of Newton's"},{"start":3928.98,"text":"method based on self-concordance, you'd imagine it to be simpler, and you would be right."},{"start":3935.42,"text":"and there's some this there's a lot of weird calculus stuff here you can"},{"start":3939.56,"text":"actually work about various things but actually it's kind of cool because you"},{"start":3943.1,"text":"end up showing a lot of the things that we care about here's one right here"},{"start":3947.06,"text":"right"},{"start":3948.94,"text":"Weirdly, that's just self-concordant, which would not be fun to show. It's not that hard, actually, to tell you the truth. It's not that bad. And a bunch of other functions are and things like that. So, you know, again, I'm not going to, I don't, this is not, I mean, it actually elucidates why a lot of practical things actually do work well. But I would say that as a practical matter, it's not that important, right? But we can, we'll go."}],"speech_gaps":[],"frame":"../frames/v014/024.webp","frame_time":3834.03},{"title":"牛顿法的复杂度分析与实际应用","segments":[{"id":187,"text":"Keep going. So, when you do, when you, in the sense of Nesterov and Nemirovsky do their analysis, they end up with something pretty crazy. This, the, you actually end up again, it has exactly the same form. It says, now you're using the Newton decrement. In the classical analysis, we're using norm of the gradient. Norm of the gradient is not affine, not affine independent. If I change coordinates,"},{"id":188,"text":"then the norm of the gradient changes, right? Here, but remember the Newton decrement does not. That's an affine invariant quantity. And so it says if the Newton decrement is bigger than some number, then you get a guaranteed decrease. Once on the other side, you get something like that. And so you get this very, this is a complexity bound that looks like that, right?"},{"id":189,"text":"Yeah, these things depend on the backtracking parameters, but a sloppy analysis tells you that it ends up saying that the maximum number of iterations is less than 375 times f of x zero minus p star. Yes, that issue is still there, right? You know, plus six. Six is the way I say log, log, log one over epsilon."},{"id":190,"text":"In fact, I used to give talks when I knew there were going to be a bunch of theorists in the crowd. I replaced log log with 4 and would do this just to taunt them. And I'd wait, and sure enough, I'd see somebody itching and they're twitching, and then they're like, this is an iterative algorithm. I was like, oh, I'm sorry. By 4, I meant log log 1 over epsilon. Sorry, that's a macro for me."},{"id":191,"text":"That's anyway, it was, it works pretty, you could, I recommend this. If you know people like that, you could try this too. So, uh, okay. Um, all right, there it is. That's the, the, there you go. So you get actually something that's weird. What's weird is that these are actually not, uh, I'll show you just some examples here, but here's, here's your minimizing a, um, you are minimizing a, uh, um,"},{"id":192,"text":"It's a log barrier for a set of linear inequalities or something. And then what we did was we just, so this is, so to explain what we did is we generated a sample, solved it using Newton's method, noted the number of iterations, and we also noted at that point p star. Then we could note this, right? Which is the difference. And then you just scatter plot it. And you get something like this. Now, by the way, the bound is a line that would be almost vertical here."},{"id":193,"text":"Right. Because it's got this coefficient 375 in there. But still, what's interesting is actually it's really interesting. It looks like if you're if you're like deposed in a in a math courtroom or something like that, you know, with with scary people all around you listening to everything you say, hoping you're going to say something wrong. You use the number 375. It's fine."}],"notes":["本段讲授了牛顿法在凸优化中的复杂度分析，特别是Nesterov和Nemirovsky的分析方法。他们指出，牛顿减量（Newton decrement）是一个仿射不变量，与梯度范数不同，后者在坐标变换时会变化。牛顿减量用于判断是否可以保证函数值的下降，从而得到一个复杂度界。","讲者提到，这种复杂度界依赖于回溯参数，但粗略分析表明，最大迭代次数小于375倍的初始函数值与最优值的差。此外，还涉及对数项的处理，如log log 1/ε，这在优化理论中是常见的复杂度表达。","讲者以幽默的方式提到，他曾在学术会议上用4代替log log 1/ε，以此调侃理论家们对精确表达式的执着。这说明在实际应用中，有时会简化表达式以方便理解。","讲者进一步说明，实际应用中，通过生成样本、使用牛顿法求解、记录迭代次数和最优值，可以绘制散点图来展示复杂度界。这种实际操作有助于理解理论分析的直观意义。","讲者指出，复杂度界中的系数375虽然看起来奇怪，但在某些情况下，它可能具有实际意义，比如在数学讨论中，使用这样的数字可能显得更加正式或严肃。","最后，讲者以幽默的方式提到，使用375这样的数字可能在某些场合下显得特别，但本质上是合理的，这反映了理论分析与实际应用之间的微妙关系。"],"formulas":[],"uncertainties":["log log 1 over epsilon"],"diagram":"none","start":3977.96,"end":4157.56,"asr_flags":[],"raw_segments":[{"start":3977.96,"text":"Keep going. So, when you do, when you, in the sense of Nesterov and Nemirovsky do their analysis, they end up with something pretty crazy. This, the, you actually end up again, it has exactly the same form. It says, now you're using the Newton decrement. In the classical analysis, we're using norm of the gradient. Norm of the gradient is not affine, not affine independent. If I change coordinates,"},{"start":4004.42,"text":"then the norm of the gradient changes, right? Here, but remember the Newton decrement does not. That's an affine invariant quantity. And so it says if the Newton decrement is bigger than some number, then you get a guaranteed decrease. Once on the other side, you get something like that. And so you get this very, this is a complexity bound that looks like that, right?"},{"start":4028.84,"text":"Yeah, these things d  You use the number 375. It's fine."}],"speech_gaps":[],"frame":"../frames/v014/025.webp","frame_time":3989.96},{"title":"凸优化中的近似与估计","segments":[{"id":194,"text":"And then they would say, is that true? And you go, oh, that's actually true, right? But what's very interesting here is that if you replace the 375 with one half, for example, it actually gets a pretty good estimate of actually how many steps it's going to take. So this makes sense. And it's actually pretty cool. So you can actually give a talk to two audiences and they can even be mixed together, right?"},{"id":195,"text":"Because you just put a constant in front, like you just say it's this. And then if someone says, what is a true statement? You'd say, well, to make this a true statement, I'd have to say 375. But if you wanted to say, here's something that is probably true and a good approximation, you just change C to 0.5 and you're done. Right? So, okay. It's kind of cool. So this is how that works. Oh, by the way, can someone explain..."},{"id":196,"text":"This one?"},{"id":197,"text":"So here, this difference was like,"},{"id":198,"text":"I don't know, let's say it was 12,"},{"id":199,"text":"but it converged in eight iterations."},{"id":200,"text":"So what word would you say"},{"id":201,"text":"if someone said explain that?"},{"id":202,"text":"What happened there?"},{"id":203,"text":"How about just dumb luck?"},{"id":204,"text":"Right?"},{"id":205,"text":"There you are in some I don't even know what the dimension of these things is. Oh, okay"},{"id":206,"text":"I have no idea. It's either 50 variables or 500 variable doesn't matter"},{"id":207,"text":"But the point was you asked for directions went that way you asked again six times late at seventh time you asked for directions and then"},{"id":208,"text":"By dumb luck. It just happened to point exactly towards the minimum, right?"},{"id":209,"text":"So so so that's what those are that those are just those are those are just dumb luck. So"},{"id":210,"text":"Yeah"},{"id":211,"text":"Yeah?"},{"id":212,"text":"On the previous slide, what was lambda of x?"},{"id":213,"text":"What's lambda?"},{"id":214,"text":"Lambda is this Newton decrement, right?"},{"id":215,"text":"So that's actually, it's this, right?"},{"id":216,"text":"It's the gradient here."},{"id":217,"text":"Actually, it's something like this divided by 2, I think."},{"id":218,"text":"Actually, lambda is the square root of this."},{"id":219,"text":"This is very close."},{"id":220,"text":"Lambda, here, let me put it, yeah, okay, here."},{"id":221,"text":"lambda is something like that"},{"id":222,"text":"and there's a factor of 2 in there"},{"id":223,"text":"right, roughly"},{"id":224,"text":"I can't remember where the square root of 2 goes"},{"id":225,"text":"but that's what it is"},{"id":226,"text":"actually it's super interesting"},{"id":227,"text":"it is the size of the gradient"},{"id":228,"text":"in the current"},{"id":229,"text":"Hessian norm"},{"id":230,"text":"which is pretty"},{"id":231,"text":"and that's how you"},{"id":232,"text":"could kind of guess that it's going to be affine invariant"},{"id":233,"text":"right, so"},{"id":234,"text":"okay"},{"id":235,"text":"Okay, so we looked at this a bit."},{"id":236,"text":"And now we'll say a little bit about implementation."}],"notes":["本段讨论了在凸优化中，如何通过替换常数项来获得对迭代次数的近似估计。例如，将375替换为0.5，可以得到一个较好的估计值。这说明在某些情况下，即使不精确，也可以通过调整参数来获得合理的近似结果。","讲者提到，如果要使陈述为真，必须使用精确的数值（如375），但若只是希望得到一个合理的近似，可以将常数项调整为0.5。这反映了在实际应用中，有时需要在精确性和计算效率之间进行权衡。","讲者通过一个例子说明，即使在高维空间中，某些情况下也可能因为“运气”而恰好指向最优解。这表明在优化过程中，某些结果可能并非完全由算法决定，而是受到初始条件或随机因素的影响。","讲者提到“lambda”是牛顿下降量，它与梯度和Hessian矩阵有关。这表明在凸优化中，lambda用于衡量当前点的梯度大小，且其计算涉及Hessian矩阵的范数。","讲者提到lambda与梯度和Hessian矩阵有关，但具体关系存在不确定性，例如是否需要除以2或开平方。这说明在实际应用中，这些关系可能需要进一步验证或根据具体情况进行调整。","讲者提到lambda的大小与梯度在Hessian范数下的大小有关，并且这有助于理解其在仿射不变性中的作用。这表明lambda在优化过程中具有重要的理论意义，但其具体计算可能需要更深入的分析。"],"formulas":[],"uncertainties":["lambda 是梯度除以2还是开平方","lambda 的具体计算是否需要除以2","lambda 的具体计算是否需要开平方"],"diagram":"none","start":4158.09,"end":4335.92,"asr_flags":[211],"math_clarifications":["公式中的lambda未明确其数学定义，Hessian矩阵未定义，梯度的表示方式不明确，且未说明lambda的具体数学含义。此外，公式中未包含必要的数学条件或假设，无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4158.09,"text":"And then they would say, is that true? And you go, oh, that's actually true, right? But what's very interesting here is that if you replace the 375 with one half, for example, it actually gets a pretty good estimate of actually how many steps it's going to take. So this makes sense. And it's actually pretty cool. So you can actually give a talk to two audiences and they can even be mixed together, right?"},{"start":4187.95,"text":"Because you just put a constant in front, like you just say it's this. And then if someone says, what is a true statement? You'd say, well, to make this a true statement, I'd have to say 375. But if you wanted to say, here's something that is probably true and a good approximation, you just change C to 0.5 and you're done. Right? So, okay. It's kind of cool. So this is how that works. Oh, by the way, can someone explain..."},{"start":4217.9,"text":"This one?"},{"start":4220.6,"text":"So here, this difference was like,"},{"start":4225.04,"text":"I don't know, let's say it was 12,"},{"start":4226.56,"text":"but it converged in eight iterations."},{"start":4231.12,"text":"So what word would you say"},{"start":4233.6,"text":"if someone said explain that?"},{"start":4238.34,"text":"What happened there?"},{"start":4243.88,"text":"How about just dumb luck?"},{"start":4247.18,"text":"Right?"},{"start":4247.9,"text":"There you are in some I don't even know what the dimension of these things is. Oh, okay"},{"start":4252.0,"text":"I have no idea. It's either 50 variables or 500 variable doesn't matter"},{"start":4256.04,"text":"But the point was you asked for directions went that way you asked again six times late at seventh time you asked for directions and then"},{"start":4262.88,"text":"By dumb luck. It just happened to point exactly towards the minimum, right?"},{"start":4267.1,"text":"So so so that's what those are that those are just those are those are just dumb luck. So"},{"start":4272.2,"text":"Yeah"},{"start":4272.6,"text":"Yeah?"},{"start":4273.04,"text":"On the previous slide, what was lambda of x?"},{"start":4277.46,"text":"What's lambda?"},{"start":4278.32,"text":"Lambda is this Newton decrement, right?"},{"start":4281.34,"text":"So that's actually, it's this, right?"},{"start":4284.4,"text":"It's the gradient here."},{"start":4292.58,"text":"Actually, it's something like this divided by 2, I think."},{"start":4295.62,"text":"Actually, lambda is the square root of this."},{"start":4298.04,"text":"This is very close."},{"start":4299.84,"text":"Lambda, here, let me put it, yeah, okay, here."},{"start":4302.6,"text":"lambda is something like that"},{"start":4304.98,"text":"and there's a factor of 2 in there"},{"start":4307.42,"text":"right, roughly"},{"start":4308.3,"text":"I can't remember where the square root of 2 goes"},{"start":4311.74,"text":"but that's what it is"},{"start":4313.2,"text":"actually it's super interesting"},{"start":4314.52,"text":"it is the size of the gradient"},{"start":4317.82,"text":"in the current"},{"start":4319.68,"text":"Hessian norm"},{"start":4322.02,"text":"which is pretty"},{"start":4323.98,"text":"and that's how you"},{"start":4325.7,"text":"could kind of guess that it's going to be affine invariant"},{"start":4328.36,"text":"right, so"},{"start":4329.24,"text":"okay"},{"start":4330.0,"text":"Okay, so we looked at this a bit."},{"start":4334.52,"text":"And now we'll say a little bit about implementation."}],"speech_gaps":[],"frame":"../frames/v014/026.webp","frame_time":4170.09},{"title":"牛顿法与线性代数的关系","segments":[{"id":237,"text":"This is actually far more important, and this is interesting,"},{"id":238,"text":"because now we're going to tie it to last week."},{"id":239,"text":"which is numerical linear algebra, right? Because the, so basically what it says is, let's review where we are. At a high level, you would say this. How do you minimize a smooth convex function? And the answer is Newton's method. You say, well, what does that do? You say that converts the solution to how to solve a smooth convex function is, we don't know how to do that, but we do know how to minimize a convex quadratic function. That's easy. That's actually linear algebra."},{"id":240,"text":"That's solving a set of linear equations, right? So you could say that Newton's method reduces the solution of the minimization of a smooth convex function to minimizing a sequence of quadratic functions. And someone says, okay, how do you minimize a quadratic function? You go, ah, that's linear algebra. That's called linear algebra. Everybody following this? So when you roll it up, it says that we can minimize a smooth convex function."},{"id":241,"text":"by an iteration that's going to take some number of tens or whatever of iterations. Each iteration is linear algebra, right? And in fact, the linear algebra is very simple. You're just solving this Newton system, h times delta x equals minus g, right? You know, one way to do it is just by Cholesky factorization, right? So you do a Cholesky factorization, and that'll cost you n cubed flops for an unstructured system."},{"id":242,"text":"you know um okay but here's the interesting part if the hessian is structured then and you know how to exploit it or even better basically you you know"},{"id":243,"text":"how to call the right libraries to exploit it or something like that. That's what I mean when I say you know how to exploit it. If that's the case, then this is going to work really well. Let me just give a couple of examples about how that works. We could do it. I mean, it doesn't matter, but we could do some kind of..."},{"id":244,"text":"we'll just do some kind of signal processing problem or optimal control problem, where you're estimating something, but in that case, the variables only interact locally in these types of problems, like in a control problem or something like that. What will happen then is the Hessian is then going to be banded."}],"notes":["本段讲解了牛顿法如何将光滑凸函数的最小化问题转化为一系列二次函数的最小化问题，而二次函数的最小化可以通过线性代数方法解决。"],"formulas":[],"uncertainties":["hessian is structured then and you know how to exploit it or even better basically you you know"],"diagram":"none","start":4336.08,"end":4493.82,"asr_flags":[],"raw_segments":[{"start":4336.08,"text":"This is actually far more important, and this is interesting,"},{"start":4338.9,"text":"because now we're going to tie it to last week."},{"start":4342.47,"text":"which is numerical linear algebra, right? Because the, so basically what it says is, let's review where we are. At a high level, you would say this. How do you minimize a smooth convex function? And the answer is Newton's method. You say, well, what does that do? You say that converts the solution to how to solve a smooth convex function is, we don't know how to do that, but we do know how to minimize a convex quadratic function. That's easy. That's actually linear algebra."},{"start":4371.74,"text":"That's solving a set of linear equations, right? So you could say that Newton's method reduces the solution of the minimization of a smooth convex function to minimizing a sequence of quadratic functions. And someone says, okay, how do you minimize a quadratic function? You go, ah, that's linear algebra. That's called linear algebra. Everybody following this? So when you roll it up, it says that we can minimize a smooth convex function."},{"start":4398.78,"text":"by an iteration that's going to take some number of tens or whatever of iterations. Each iteration is linear algebra, right? And in fact, the linear algebra is very simple. You're just solving this Newton system, h times delta x equals minus g, right? You know, one way to do it is just by Cholesky factorization, right? So you do a Cholesky factorization, and that'll cost you n cubed flops for an unstructured system."},{"start":4427.95,"text":"you know um okay but here's the interesting part if the hessian is structured then and you know how to exploit it or even better basically you you know"},{"start":4443.65,"text":"how to call the right libraries to exploit it or something like that. That's what I mean when I say you know how to exploit it. If that's the case, then this is going to work really well. Let me just give a couple of examples about how that works. We could do it. I mean, it doesn't matter, but we could do some kind of..."},{"start":4470.56,"text":"we'll just do some kind of signal processing problem or optimal control problem, where you're estimating something, but in that case, the variables only interact locally in these types of problems, like in a control problem or something like that. What will happen then is the Hessian is then going to be banded."}],"speech_gaps":[],"frame":"../frames/v014/027.webp","frame_time":4348.08},{"title":"结构化问题与牛顿法的实现","segments":[{"id":245,"text":"because, you know, variable x doesn't interact with variable, you know, xi and xj. They only interact if i minus j is small enough, okay? That means, that means, if you go back to last week, that says, oh, we can solve those systems in linear time. Like, I would not be afraid to solve, I can certainly solve, I can compute the Newton direction if h was banded, let's say with a bandwidth of 20, if it's in a million dimensions, I could solve that problem."},{"id":246,"text":"This, I guarantee you, people in machine learning have absolutely not the slightest idea of. There might be one or two, but I doubt any more than that. Okay, maybe a few more, but not that many. And that's actually part of the reason it's very interesting is when people say, well, you couldn't use Newton's method. Why not? You go, well, first of all, you have to form this Hessian. And second, then you have to solve it. And everybody knows that's n cubed. But the point is, if it's structured, it's not."},{"id":247,"text":"Okay, and then you'd say how often does structure come up? And the answer is a lot more frequently than you would imagine. I mean, that also kind of makes sense, right? Okay, so this is Newton method, how you'd actually implement it. Oh, by the way, I mentioned this other method where you update basically the quadratic. What you do is you calculate the Hessian."},{"id":248,"text":"Once and you use that as your you use that for the next like say 10 or 20 steps Right, you don't update the Hessian you updated every 20 steps It's got a name for it and I forgot what it's called that method is called, right? How do you do that here and what's the cost of that? This is completely dense. Right? No structure in addition. What do you do? Every 20 steps you evaluate the Hessian factor it that cost you n cubed"},{"id":249,"text":"Then how much do actually computing the Newton steps when you have different gradients? Here. What's the number? Or is that square? Exactly. So if n is big, that's a big savings, right? By the way, that method works perfectly well. People don't implement it because I think they're just lazy, so they just factor every time. But it's an old method from the 70s or 80s, and it's perfectly good, right? Probably people should use it."},{"id":250,"text":"Okay, so here's a quick example, but I think what we're going to do is we're going to quit here. We'll quit here for now, and then I think there's a numeric... You're actually... Let me just mention one thing. You're doing something on the homework, and you're actually... We're only going to cover the material for that next Tuesday, so you'll have to read ahead to Newton method with equality constraints if you want to start on that earlier than next Tuesday. This is a heads up."}],"notes":["本段讨论了在结构化问题中使用牛顿法的实现方式，特别是当Hessian矩阵具有带状结构时，可以显著降低计算成本。讲者提到，如果Hessian矩阵的带宽为20，即使在百万维空间中，也可以高效求解。这表明结构化问题在实际应用中非常重要，因为它们允许使用更高效的算法。","讲者指出，虽然牛顿法在计算Hessian矩阵和求解线性系统时需要O(n³)的时间复杂度，但如果Hessian矩阵具有结构（如带状结构），则可以显著降低计算成本。这说明结构化问题在优化算法中具有实际意义。","讲者提到一种方法，即每隔一定步数（如20步）更新一次Hessian矩阵，而不是每次迭代都更新。这种方法虽然名称被遗忘，但其核心思想是利用Hessian矩阵的结构来减少计算量。","讲者强调，这种方法虽然有效，但实际应用中很少被使用，可能是因为人们更倾向于每次迭代都重新计算Hessian矩阵，尽管这可能效率较低。这表明在实际工程中，效率和实现复杂度之间存在权衡。","讲者提到，这种方法可以追溯到70年代或80年代，说明它是一个较为成熟的方法，但可能由于实现复杂性或习惯性原因未被广泛采用。","讲者最后提到，如果学生希望提前开始作业，需要提前阅读关于带等式约束的牛顿法内容，这表明课程内容的安排和学生自主学习的重要性。"],"formulas":[],"uncertainties":["I forgot what it's called that method is called"],"diagram":"none","start":4496.41,"end":4664.06,"asr_flags":[],"math_clarifications":["原文提到当Hessian矩阵具有带状结构时，可以在线性时间内求解系统，因此O(n^3)的复杂度不适用，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4496.41,"text":"because, you know, variable x doesn't interact with variable, you know, xi and xj. They only interact if i minus j is small enough, okay? That means, that means, if you go back to last week, that says, oh, we can solve those systems in linear time. Like, I would not be afraid to solve, I can certainly solve, I can compute the Newton direction if h was banded, let's say with a bandwidth of 20, if it's in a million dimensions, I could solve that problem."},{"start":4524.89,"text":"This, I guarantee you, people in machine learning have absolutely not the slightest idea of. There might be one or two, but I doubt any more than that. Okay, maybe a few more, but not that many. And that's actually part of the reason it's very interesting is when people say, well, you couldn't use Newton's method. Why not? You go, well, first of all, you have to form this Hessian. And second, then you have to solve it. And everybody knows that's n cubed. But the point is, if it's structured, it's not."},{"start":4553.72,"text":"Okay, and then you'd say how often does structure come up? And the answer is a lot more frequently than you would imagine. I mean, that also kind of makes sense, right? Okay, so this is Newton method, how you'd actually implement it. Oh, by the way, I mentioned this other method where you update basically the quadratic. What you do is you calculate the Hessian."},{"start":4579.31,"text":"Once and you use that as your you use that for the next like say 10 or 20 steps Right, you don't update the Hessian you updated every 20 steps It's got a name for it and I forgot what it's called that method is called, right? How do you do that here and what's the cost of that? This is completely dense. Right? No structure in addition. What do you do? Every 20 steps you evaluate the Hessian factor it that cost you n cubed"},{"start":4607.38,"text":"Then how much do actually computing the Newton steps when you have different gradients? Here. What's the number? Or is that square? Exactly. So if n is big, that's a big savings, right? By the way, that method works perfectly well. People don't implement it because I think they're just lazy, so they just factor every time. But it's an old method from the 70s or 80s, and it's perfectly good, right? Probably people should use it."},{"start":4636.33,"text":"Okay, so here's a quick example, but I think what we're going to do is we're going to quit here. We'll quit here for now, and then I think there's a numeric... You're actually... Let me just mention one thing. You're doing something on the homework, and you're actually... We're only going to cover the material for that next Tuesday, so you'll have to read ahead to Newton method with equality constraints if you want to start on that earlier than next Tuesday. This is a heads up."}],"speech_gaps":[],"frame":"../frames/v014/028.webp","frame_time":4508.41}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
