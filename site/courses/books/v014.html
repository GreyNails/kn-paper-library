</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">14 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 14 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v014.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v014","title":"14 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 14","course":"凸优化","pages":[{"title":"梯度下降法与子水平集的条件","segments":[{"id":0,"text":"We'll jump in and we'll continue where we are last time. And weirdly, this picture tells you kind of everything. This gives you all the insight you need to know. It's just like weird and hilarious. Whoops. Let me fix this. Yeah, so.","zh":"我们将直接进入主题，继续上次我们留下的内容。奇怪的是，这张图基本上告诉你一切。它提供了你需要了解的所有见解。这真是奇怪又滑稽。啊，让我修正一下。是的，所以。","start":4.75,"end":24.38},{"id":1,"text":"You know, here we're just minimizing a quadratic. We know exactly what the minimum is. It's just x equals zero, right? So we just try something like, you know, this steepest, here we're using gradient descent, right? And you can actually, it's just simple enough. You can actually work out what the iterations are. And what you'll find, I mean, you have a formula for it, but the picture is basically this. This shows you, these curves show you the level sets.","zh":"在这里，我们只是最小化一个二次函数。我们知道最小值的确切位置。它就是 x 等于零，对吧？所以我们尝试一些东西，比如，这里我们使用梯度下降法，对吧？实际上，这很简单。你可以计算出迭代过程。你会发现，你有一个公式，但图基本上就是这个样子。这些曲线展示了等值线。","start":25.15,"end":49.07},{"id":2,"text":"What you can see pretty clearly, you're beginning to see it already here, is if the level sets are poorly conditioned, meaning they're anisotropic. Isotropic means you're kind of the same in all directions. Anisotropic means you're not the same. You're different in different directions. So if your curvature is different in different directions, right? Or another way to say it, if your sublevel sets are not nearly spherical, then gradient descent works...","zh":"你可以清楚地看到，你已经开始看到这一点了，即如果等值线是条件较差的，意味着它们是各向异性。各向同性意味着你在各个方向上都差不多。各向异性意味着你在不同方向上不同。你在不同方向上的曲率不同，对吧？或者说，如果你的子等值集不是近似球形的，那么梯度下降法的效果...","start":50.56,"end":76.66},{"id":3,"text":"quite poorly. And you can see why it does this kind of weird zigzagging. And then the flip side of this is how well does gradient descent do when the sublevel sets are actually literally spherical or balls, Euclidean balls. And here the answer is it's just one step. So takeaway message is that the efficiency or speed of","zh":"相当差。你可以看到为什么会出现这种奇怪的锯齿状运动。而另一方面，当子等值集实际上是球形或欧几里得球体时，梯度下降法的表现如何？在这里的答案是它只需一步。所以核心信息是，梯度下降法的效率或速度将取决于子等值集有多非球形或各向异性。这里只是一个例子来展示，你知道的，它有效。我的意思是，这是一个二维的例子。它有点傻，你知道的，只是为了展示你得到锯齿状运动或类似的东西。我想我们上次已经看过这个例子了。现在它涉及到...","start":77.03,"end":101.61},{"id":4,"text":"the efficiency or speed of gradient descent is going to depend on how aspherical or anisotropic the sublevel sets are. And here was just an example to show, you know, it works. I mean, it's an example in two dimensions. It's kind of silly. You know, just to show that you are getting zigzagging or something like that. And I think we looked at this last time. And now it comes to...","zh":"梯度下降法的效率或速度将取决于子等值集有多非球形或各向异性。这里只是一个例子来展示，你知道的，它有效。我的意思是，这是一个二维的例子。它有点傻，你知道的，只是为了展示你得到锯齿状运动或类似的东西。我想我们上次已经看过这个例子了。现在它涉及到...","start":102.57,"end":131.29},{"id":5,"text":"So the conclusion is, depending on the problem, if your sublevel sets are very well conditioned or spherical or symmetric or however you want to say it, or isotropic or something like that, then gradient descent is fine. So what this hints, though, is that there's something strange about it. It's actually a bit weird, right? Because when you think about it, why would you not use the...","zh":"所以结论是，根据问题的不同，如果你的子水平集非常良好条件化或者球形或者对称，或者你想要怎么表述，或者各向同性之类的，那么梯度下降法是可行的。不过，这暗示着一些奇怪的地方。实际上，这有点奇怪，对吧？因为当你仔细想想，为什么你不使用……","start":131.93,"end":160.49}],"notes":["本段讨论了梯度下降法在不同子水平集条件下的表现。当子水平集是各向同性（isotropic）时，即形状接近球体，梯度下降法表现良好，只需一步即可收敛。而当子水平集是各向异性（anisotropic）时，即形状不规则，梯度下降法会表现出锯齿状的收敛路径，效率较低。","讲者指出，子水平集的条件（conditioning）决定了梯度下降法的效率。各向同性意味着在所有方向上具有相同的曲率，而各向异性则意味着不同方向上的曲率不同，导致梯度下降法在优化过程中出现不稳定的收敛行为。","讲者通过二维示例说明了梯度下降法在各向异性子水平集上的锯齿状收敛现象，并指出这种现象是由于不同方向上的曲率差异导致的。同时，讲者提到这种现象在之前已经讨论过。","讲者强调，梯度下降法的效率与子水平集的形状密切相关。当子水平集接近球体时，梯度下降法表现良好，而当子水平集形状不规则时，梯度下降法的收敛速度会显著下降。","讲者最后指出，梯度下降法在各向同性子水平集上的表现似乎有些奇怪，因为为什么在这些情况下不使用更高效的优化方法。这暗示了梯度下降法在某些情况下可能不是最优选择。","讲者通过对比各向同性和各向异性子水平集的收敛行为，强调了子水平集的条件对优化算法性能的影响，并指出梯度下降法在不同条件下的表现差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4.75,"end":160.49,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4.75,"text":"We'll jump in and we'll continue where we are last time. And weirdly, this picture tells you kind of everything. This gives you all the insight you need to know. It's just like weird and hilarious. Whoops. Let me fix this. Yeah, so."},{"start":25.15,"text":"You know, here we're just minimizing a quadratic. We know exactly what the minimum is. It's just x equals zero, right? So we just try something like, you know, this steepest, here we're using gradient descent, right? And you can actually, it's just simple enough. You can actually work out what the iterations are. And what you'll find, I mean, you have a formula for it, but the picture is basically this. This shows you, these curves show you the level sets."},{"start":50.56,"text":"What you can see pretty clearly, you're beginning to see it already here, is if the level sets are poorly conditioned, meaning they're anisotropic. Isotropic means you're kind of the same in all directions. Anisotropic means you're not the same. You're different in different directions. So if your curvature is different in different directions, right? Or another way to say it, if your sublevel sets are not nearly spherical, then gradient descent works..."},{"start":77.03,"text":"quite poorly. And you can see why it does this kind of weird zigzagging. And then the flip side of this is how well does gradient descent do when the sublevel sets are actually literally spherical or balls, Euclidean balls. And here the answer is it's just one step. So takeaway message is that the efficiency or speed of"},{"start":102.57,"text":"the efficiency or speed of gradient descent is going to depend on how aspherical or anisotropic the sublevel sets are. And here was just an example to show, you know, it works. I mean, it's an example in two dimensions. It's kind of silly. You know, just to show that you are getting zigzagging or something like that. And I think we looked at this last time. And now it comes to..."},{"start":131.93,"text":"So the conclusion is, depending on the problem, if your sublevel sets are very well conditioned or spherical or symmetric or however you want to say it, or isotropic or something like that, then gradient descent is fine. So what this hints, though, is that there's something strange about it. It's actually a bit weird, right? Because when you think about it, why would you not use the..."}],"speech_gaps":[],"frame":"../frames/v014/001.webp","frame_time":16.75},{"title":"梯度下降方向与度量的选择","segments":[{"id":6,"text":"gradient, the negative gradient as your descent direction, right? It just, something seems very weird about it because you arrive at a point and then you'd say, hey, if I was to move a small amount in any direction, which would be the direction where my objective would go down the fastest, right? And it seems like you'd be an idiot to take anything other than that direction. And so we had said, well, it's the negative gradient. When you analyze that statement further, it turns out that depends on the metric you're using.","zh":"梯度，负梯度作为你的下降方向，对吧？它似乎有些奇怪，因为在你到达一个点之后，你会说，嘿，如果我要在任何方向上移动一个小量，哪个方向会让我的目标函数下降得最快，对吧？看起来你只选择那个方向才是明智的。因此我们说过，这就是负梯度。当你进一步分析这个陈述时，你会发现这取决于你使用的度量。","start":161.55,"end":188.34},{"id":7,"text":"right so that's actually the so it actually depends on the norm you use and so the way you think of that one way to do this in a kind of a principled way is to say well you know the amount if you go in a small direction v then the amount f is going to decrease is about equal to the gradient","zh":"对，所以实际上这就是，所以它实际上取决于你使用的范数。因此，以一种有原则的方式思考这个问题的一种方法是说，你知道，如果你在小方向 v 上移动，那么目标函数 f 会减少的量大约等于梯度","start":188.8,"end":207.61},{"id":8,"text":"of F transpose V. You want that negative, right? So then you'd think, well, okay, take V equals minus the gradient. That's an obvious choice. You can't just say choose V to minimize grad F of X transpose V. You can't do that because it's unbounded below. It's silly, right?","zh":"的 F 转置 V。你想要的是负的，对吧？因此你会想，好吧，那就取 V 等于负梯度。这是一个显而易见的选择。你不能只是说选择 V 来最小化梯度 F 在 X 处的转置 V。你不能这么做，因为它是无界的。这很傻，对吧？","start":208.31,"end":227.43},{"id":9,"text":"And here's where the metric comes in. You have to give a norm to limit that. You have to say, no, I want the norm of v to be, let's say, equal to one or less than or equal to one. It would be the same thing, right? So you do that. And here, notice that this norm up here on v is a general norm. It is not the two norm, necessarily. It's just a general norm. So this is referred to as the steepest descent direction, right? And it's going to depend on the norm.","zh":"在这里，度量就派上用场了。你必须给一个范数来限制这一点。你必须说，不，我希望 v 的范数等于一或小于等于一。这是一样的，对吧？因此你这么做。在这里，注意这里的 v 的范数是一个一般的范数。它不一定是二范数，只是一个一般的范数。因此这被称为最陡下降方向，对吧？它会依赖于范数。","start":228.71,"end":257.59},{"id":10,"text":"And then you can un-normalize it. It's actually convenient to normalize it by the dual norm of the gradient. And then you get something that looks like that. So the steepest descent method is basically specified by a norm. You give a norm. So once you give a norm, then the steepest descent...","zh":"然后你可以进行非归一化。实际上，通过梯度的对偶范数来归一化它会很方便。然后你会得到类似这样的结果。因此，最陡下降法基本上是由一个范数指定的。你给出一个范数。因此一旦你给出一个范数，最陡下降法就完全确定了，对吧？你会得到与这种下降相似的收敛性。但我们将通过一些例子来理解这一点。第一个例子是，如果你只是，什么是欧几里得范数下的最陡下降？它就是梯度下降，对吧？是的。","start":257.99,"end":278.74},{"id":11,"text":"method is completely specified because that's the direction you're going to use, right? And you get the convergence is similar to this descent. But we'll look at some examples to kind of understand this. So the first one is, if you just, what is steepest descent in the Euclidean norm? It's precisely gradient descent, right? Yeah.","zh":"方法完全由这个范数指定，因为这就是你要使用的方向，对吧？你会得到与这种下降相似的收敛性。但我们将通过一些例子来理解这一点。第一个例子是，如果你只是，什么是欧几里得范数下的最陡下降？它就是梯度下降，对吧？是的。","start":279.1,"end":301.78},{"id":12,"text":"Why do you normalize it by the dual norm of the gradient? You actually don't have to. There's no reason to normalize it. It's just so that a lot of the equations get simpler if you do the convergence analysis. Yeah, so that's the only reason. Also, that way, like, for example, the steepest descent direction with the L2 norm is literally the negative gradient. Otherwise, it'd be the negative gradient scaled. You know, it'd be a unit vector.","zh":"为什么你要用梯度的对偶范数来归一化它？其实你并不一定要这么做。没有理由去归一化它。这么做只是为了在进行收敛性分析时，很多方程会变得更简单。是的，这就是唯一的原因。此外，这样做的好处是，例如，使用L2范数的最陡下降方向其实就是负梯度。否则，它将是负梯度的缩放版本。你知道的，那会是一个单位向量。","start":302.26,"end":327.74}],"notes":["本段讨论了梯度下降方向与度量（norm）之间的关系。讲者指出，梯度下降方向的选择依赖于所使用的度量，即范数。在没有限制的情况下，选择方向会导致问题，因此需要引入范数来限制方向的范围。","讲者进一步解释了如何通过范数来限制方向，例如将方向的范数限制为1或更小。这种范数可以是任意的，不一定是欧几里得范数。这种方向被称为最陡下降方向（steepest descent direction），其选择依赖于所使用的范数。","讲者提到，为了简化收敛性分析，通常会将方向归一化为梯度的对偶范数。这种归一化使得后续的数学推导更加简洁，但并非必须。","在L2范数的情况下，最陡下降方向就是负梯度方向。如果使用其他范数，最陡下降方向可能需要对负梯度进行缩放，以确保方向的单位长度。","讲者强调，选择不同的范数会导致不同的最陡下降方向，因此最陡下降方法的定义依赖于所选择的范数。"],"formulas":[{"latex":"v = -\\nabla F(x)","symbols":"v 是梯度下降方向，\nabla F(x) 是函数 F 在点 x 处的梯度","explanation":"该公式正确表达了梯度下降方向为负梯度方向，适用于标准欧几里得范数。","evidence":"of F transpose V. You want that negative, right? So then you'd think, well, okay, take V equals minus the gradient. That's an obvious choice. You can't just say choose V to minimize grad F of X transpose V. You can't do that because it's unbounded below. It's silly, right?"},{"latex":"\\nabla F(x)^T v","symbols":"梯度与方向向量的点积，表示函数在该方向上的变化率","explanation":"该公式正确表达了梯度与方向向量的点积，用于计算函数在该方向上的变化率。","evidence":"right so that's actually the so it actually depends on the norm you use and so the way you think of that one way to do this in a kind of a principled way is to say well you know the amount if you go in a small direction v then the amount f is going to decrease is about equal to the gradient"}],"uncertainties":[],"diagram":"none","start":161.55,"end":327.74,"asr_flags":[],"math_clarifications":["公式 0 的表述不严谨，'decreases by' 无法准确表达函数值的变化量，应使用更精确的数学表达式，如 f(x + v) - f(x) ≈ ∇F(x)^T v。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[{"title":"梯度下降方向与度量的选择","summary":"梯度下降方向的选择依赖于所使用的度量（范数）。在没有限制的情况下，选择方向会导致问题，因此需要引入范数来限制方向的范围。最陡下降方向的选择依赖于所使用的范数。","relation":"推导顺序","conditions":"原文限定条件；没有则空字符串","pitfall":"原文支持的辨析；没有则空字符串","note_indices":[0,1,2,3,4],"formula_indices":[0,1],"source_ids":[6,7,8,9,10,11,12],"steps":["梯度下降方向的选择依赖于所使用的度量（范数）。","在没有限制的情况下，选择方向会导致问题，因此需要引入范数来限制方向的范围。","最陡下降方向的选择依赖于所使用的范数。","为了简化收敛性分析，通常会将方向归一化为梯度的对偶范数。"],"nodes":[{"title":"梯度下降方向","text":"梯度下降方向为负梯度方向，适用于标准欧几里得范数。"},{"title":"度量选择","text":"梯度下降方向的选择依赖于所使用的度量（范数）。"},{"title":"最陡下降方向","text":"最陡下降方向的选择依赖于所使用的范数，可以是任意范数。"},{"title":"归一化处理","text":"为了简化收敛性分析，通常会将方向归一化为梯度的对偶范数。"},{"title":"L2范数情况","text":"在L2范数的情况下，最陡下降方向就是负梯度方向。"}],"id":"v014-002-1","start":161.55,"end":327.74,"formulas":[{"latex":"v = -\\nabla F(x)","symbols":"v 是梯度下降方向，\nabla F(x) 是函数 F 在点 x 处的梯度","evidence":"of F transpose V. You want that negative, right? So then you'd think, well, okay, take V equals minus the gradient. That's an obvious choice. You can't just say choose V to minimize grad F of X transpose V. You can't do that because it's unbounded below. It's silly, right?","explanation":"该公式正确表达了梯度下降方向为负梯度方向，适用于标准欧几里得范数。"},{"latex":"\\nabla F(x)^T v","symbols":"梯度与方向向量的点积，表示函数在该方向上的变化率","evidence":"right so that's actually the so it actually depends on the norm you use and so the way you think of that one way to do this in a kind of a principled way is to say well you know the amount if you go in a small direction v then the amount f is going to decrease is about equal to the gradient","explanation":"该公式正确表达了梯度与方向向量的点积，用于计算函数在该方向上的变化率。"}],"formula_candidates_removed":0,"frame":"../board-frames/v014/002-1.webp","frame_time":174.05}],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":161.55,"text":"gradient, the negative gradient as your descent direction, right? It just, something seems very weird about it because you arrive at a point and then you'd say, hey, if I was to move a small amount in any direction, which would be the direction where my objective would go down the fastest, right? And it seems like you'd be an idiot to take anything other than that direction. And so we had said, well, it's the negative gradient. When you analyze that statement further, it turns out that depends on the metric you're using."},{"start":188.8,"text":"right so that's actually the so it actually depends on the norm you use and so the way you think of that one way to do this in a kind of a principled way is to say well you know the amount if you go in a small direction v then the amount f is going to decrease is about equal to the gradient"},{"start":208.31,"text":"of F transpose V. You want that negative, right? So then you'd think, well, okay, take V equals minus the gradient. That's an obvious choice. You can't just say choose V to minimize grad F of X transpose V. You can't do that because it's unbounded below. It's silly, right?"},{"start":228.71,"text":"And here's where the metric comes in. You have to give a norm to limit that. You have to say, no, I want the norm of v to be, let's say, equal to one or less than or equal to one. It would be the same thing, right? So you do that. And here, notice that this norm up here on v is a general norm. It is not the two norm, necessarily. It's just a general norm. So this is referred to as the steepest descent direction, right? And it's going to depend on the norm."},{"start":257.99,"text":"And then you can un-normalize it. It's actually convenient to normalize it by the dual norm of the gradient. And then you get something that looks like that. So the steepest descent method is basically specified by a norm. You give a norm. So once you give a norm, then the steepest descent..."},{"start":279.1,"text":"method is completely specified because that's the direction you're going to use, right? And you get the convergence is similar to this descent. But we'll look at some examples to kind of understand this. So the first one is, if you just, what is steepest descent in the Euclidean norm? It's precisely gradient descent, right? Yeah."},{"start":302.26,"text":"Why do you normalize it by the dual norm of the gradient? You actually don't have to. There's no reason to normalize it. It's just so that a lot of the equations get simpler if you do the convergence analysis. Yeah, so that's the only reason. Also, that way, like, for example, the steepest descent direction with the L2 norm is literally the negative gradient. Otherwise, it'd be the negative gradient scaled. You know, it'd be a unit vector."}],"speech_gaps":[],"frame":"../frames/v014/002.webp","frame_time":173.55},{"title":"梯度方向与范数的关系","segments":[{"id":13,"text":"It's actually, it'd be the negative gradient divided by the norm of the gradient, right? So unit vector. So if you use a quadratic norm, so quadratic norm is you take a quadratic form with a positive definite matrix, take the square root, that's a quadratic norm. And here's an example of a, I guess this is a unit ball in a quadratic norm, which is an ellipsoid. And then it says, here's the negative gradient.","zh":"实际上，它应该是负梯度除以梯度的范数，对吧？所以是一个单位向量。如果你使用二次范数，二次范数就是用一个正定矩阵的二次型，然后取平方根，这就是二次范数。这里有一个例子，我想这就是在二次范数下的单位球，也就是一个椭球体。然后它说，这里就是负梯度。","start":328.31,"end":355.11},{"id":14,"text":"And it says you should minimize the inner product of, or sorry, you should, yeah, you should minimize the inner product of a point in this set with the negative, or I guess minimize it with the gradient, which means maximize the inner product with the negative gradient.","zh":"它说你应该最小化这个集合中一点与负梯度的内积，或者抱歉，你应该最小化这个点与梯度的内积，这意味着最大化这个点与负梯度的内积。","start":355.67,"end":376.15},{"id":15,"text":"that are going to be, this is the outward normal. They look like, these are the level curves. And it says you want to go as far as you can this way. And you end up here, right? And so this is in fact, this is going to be the steepest descent direction in the norm where this is the unit ball we're showing you, okay?","zh":"这些将是向外法向量。它们看起来像，这些是等高线。它说你想要沿着这个方向尽可能走远。然后你会到达这里，对吧？因此，这实际上就是在这个单位球所展示的范数下的最陡下降方向，对吧？","start":377.85,"end":398.29},{"id":16,"text":"Now, you can work things out like, you're never going to, so actually it does change the direction. It's very weird. It changes the direction. Never, never rotates it more than 90 degrees. It cannot, obviously, because then you wouldn't have a, you'd have a positive inner product with the gradient.","zh":"现在，你可以这样计算，你永远不会，实际上它确实会改变方向。这非常奇怪。它会改变方向。它永远不会将方向旋转超过90度。显然，因为它否则你就会与梯度有正的内积。","start":399.76,"end":417.56},{"id":17,"text":"So this is it. So the real answer is it says that when you stop and you ask for directions and you say what direction would be the direction where you go downhill the fastest, the person should ask you, yeah, in what norm? Because what you select as a norm is going to change the directions they give you. And you can see that it distorts the directions.","zh":"这就是答案。当你停下来并询问方向时，你问什么方向是最快下坡的方向，这个人应该问你，用什么范数？因为你选择的范数会改变给出的方向。你可以看到它会扭曲方向。","start":418.2,"end":444.2},{"id":18,"text":"It's actually super interesting, like if you do the L1 norm, what you'll work out is actually also a very kind of simple thing. If you take the inner product of a gradient with a vector whose L1 norm is less than one, you want to minimize that. What you will do is you will find the entry, the axis, along with where the partial derivative or entry of the gradient is most negative.","zh":"实际上，这非常有趣，比如如果你使用L1范数，你会发现实际上也是一个非常简单的事情。如果你取梯度与一个L1范数小于1的向量的内积，你想要最小化这个内积。你将会找到梯度中偏导数或分量最负的那个轴。","start":445.73,"end":472.47},{"id":19,"text":"Right. And then you'll go. Sorry. Yeah. You find the largest one and then go in, obviously, the direction, the decreasing direction. Right. And so that's actually got it. That's a named method from the like 40s and 50s. And it basically I mean, that that one has got a very simple story to it. You stop where you are and you say then you then you ask not which direction is the steepest direction to go down. I mean, you can it's in the L1. But what you really ask is you ask if I go along axis one.","zh":"对的。然后你就会去。抱歉。是的。你找到最大的那个，然后显然朝着下降的方向前进。对的。所以这实际上就是一种方法，它起源于20世纪40年代和50年代。它基本上就是这样一个方法，它的故事非常简单。你停下来，然后你问：哪个方向是最陡峭的下降方向。我的意思是，它在L1范数中。但你真正问的是：如果我沿着第一个坐标轴方向前进，","start":473.16,"end":502.06}],"notes":["本段讲授了梯度方向与范数之间的关系，指出在不同范数下，最陡下降方向会有所不同。讲者提到，当使用二次范数时，最陡下降方向是负梯度方向除以梯度的范数，即单位向量。同时，讲者指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。","讲者通过椭球体（二次范数的单位球）和水平曲线（等值线）来形象化说明最陡下降方向的概念。讲者强调，最陡下降方向取决于所选的范数，不同的范数会导致不同的方向选择。","讲者指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。这是因为L1范数的单位球是菱形，其最陡下降方向与梯度的分量有关。","讲者提到，最陡下降方向的计算需要考虑所选的范数，这会影响方向的选择。讲者还指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。","讲者通过举例说明，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。这是因为L1范数的单位球是菱形，其最陡下降方向与梯度的分量有关。","讲者指出，最陡下降方向的计算需要考虑所选的范数，这会影响方向的选择。讲者还指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。"],"formulas":[],"uncertainties":[],"diagram":"none","start":328.31,"end":502.06,"asr_flags":[],"math_clarifications":["所有公式均重复且未提供新的数学内容，无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":328.31,"text":"It's actually, it'd be the negative gradient divided by the norm of the gradient, right? So unit vector. So if you use a quadratic norm, so quadratic norm is you take a quadratic form with a positive definite matrix, take the square root, that's a quadratic norm. And here's an example of a, I guess this is a unit ball in a quadratic norm, which is an ellipsoid. And then it says, here's the negative gradient."},{"start":355.67,"text":"And it says you should minimize the inner product of, or sorry, you should, yeah, you should minimize the inner product of a point in this set with the negative, or I guess minimize it with the gradient, which means maximize the inner product with the negative gradient. So basically it says, these are the, these are the sublub, the hyperplanes that are,"},{"start":377.85,"text":"that are going to be, this is the outward normal. They look like, these are the level curves. And it says you want to go as far as you can this way. And you end up here, right? And so this is in fact, this is going to be the steepest descent direction in the norm where this is the unit ball we're showing you, okay?"},{"start":399.76,"text":"Now, you can work things out like, you're never going to, so actually it does change the direction. It's very weird. It changes the direction. Never, never rotates it more than 90 degrees. It cannot, obviously, because then you wouldn't have a, you'd have a positive inner product with the gradient."},{"start":418.2,"text":"So this is it. So the real answer is it says that when you stop and you ask for directions and you say what direction would be the direction where you go downhill the fastest, the person should ask you, yeah, in what norm? Because what you select as a norm is going to change the directions they give you. And you can see that it distorts the directions."},{"start":445.73,"text":"It's actually super interesting, like if you do the L1 norm, what you'll work out is actually also a very kind of simple thing. If you take the inner product of a gradient with a vector whose L1 norm is less than one, you want to minimize that. What you will do is you will find the entry, the axis, along with where the partial derivative or entry of the gradient is most negative."},{"start":473.16,"text":"Right. And then you'll go. Sorry. Yeah. You find the largest one and then go in, obviously, the direction, the decreasing direction. Right. And so that's actually got it. That's a named method from the like 40s and 50s. And it basically I mean, that that one has got a very simple story to it. You stop where you are and you say then you then you ask not which direction is the steepest direction to go down. I mean, you can it's in the L1. But what you really ask is you ask if I go along axis one."}],"speech_gaps":[],"frame":"../frames/v014/003.webp","frame_time":340.31},{"title":"梯度下降法与度量选择","segments":[{"id":20,"text":"how much am I going to go down? If I go along axis two, how much is it going to go down? And you find the one where you're going to go down the most, and then you simply go along the axis. So that's a so-called axis-aligned step, people would call it. Okay. And again, you know, the picture shows how you actually get a different direction. Okay.","zh":"我要下降多少呢？如果我沿着第二个轴移动，会下降多少呢？然后你找到下降最多的那个方向，然后你沿着那个轴移动。这就是所谓的轴对齐步，人们会这么称呼它。好的。同样，图片展示了你实际上如何得到不同的方向。好的。","start":502.92,"end":521.66},{"id":21,"text":"The choice of the metric or the norm for steepest descent is going to make a big difference, right? And here's just this baby example again, where the first one shows you steepest descent with a norm whose unit ball looks like this. And I don't know, you just eyeball it, you can see this, you know, some number of iterations. And here we take steepest descent in using a norm where the unit ball is like skewed this way.","zh":"在最陡下降法中选择度量或范数将产生很大的差异，对吧？这里再次给出了一个简单的例子，其中第一个例子展示了使用单位球看起来像这样的范数的最陡下降法。我不知你是否能凭直觉看出，这需要多少次迭代。而在这里，我们使用的是单位球向这个方向倾斜的范数进行最陡下降法。","start":525.34,"end":553.06},{"id":22,"text":"And what you see is that has exacerbated the convergence horribly, right? And so what this tells us is kind of the, it tells you kind of the obvious thing. It says that if you, what you really want is you want a norm or a metric or something like that, that's kind of aligned with the sublevel sets of your function.","zh":"你看到的是，这极大地恶化了收敛性，对吧？这告诉我们一个显而易见的事情。它说明如果你想要的是一个与你的函数的次水平集对齐的范数或度量或类似的东西。","start":553.47,"end":577.35},{"id":23,"text":"In other words, it's one which kind of has roughly the same shape. So this is just a very simple example to show this. I'm just pretending that this function looks kind of fatter than it does look tall. And so over here, this use of norm, this selection of norm actually improves the convergence. This one exacerbates it. Does this make sense?","zh":"换句话说，它大致具有相同的形状。这是一个非常简单的例子，用来展示这一点。我只是假定这个函数看起来比它实际高得更胖。因此，在这里，这种范数的选择实际上改善了收敛性，而另一种则恶化了。这有意义吗？","start":577.99,"end":604.69},{"id":24,"text":"These are just sort of ideas, but it's the essence of where we're going. Because now we go to the, if you keep going with this logic, you end up at something called the Newton step. So the Newton step, you actually will use, what you'll do, is you take the Hessian of the second derivative of the function at the current point.","zh":"这些只是些想法，但它们体现了我们即将去的方向。因为如果我们继续用这种逻辑推理，最终会到达所谓的牛顿步。牛顿步，你实际上会使用，你所做的就是取函数在当前点的二阶导数（Hessian）","start":605.31,"end":634.28},{"id":25,"text":"and you then use that as your metric, right? And so the argument now makes perfect sense, right? Because if I said, if you say, okay, I accept the idea that I should choose, let's say, a metric that captures the shape of my function, right? That's what I should do, right? Actually, let's have a discussion about smooth functions near their minimum. Let's have that discussion just for fun. What do smooth functions look like? Smooth convex functions look like near their minimum. What do they look like?","zh":"然后你就可以用这个作为你的度量标准，对吧？因此，现在的论点就完全合情合理了，对吧？如果我说，如果你接受这样的想法，即我应该选择一个能够捕捉我的函数形状的度量标准，对吧？那我应该这么做，对吧？实际上，让我们讨论一下在最小值附近光滑函数的特性。我们只是为了好玩而进行这个讨论。光滑函数看起来是什么样的？在最小值附近，光滑凸函数看起来是什么样的？它们看起来是什么样子的？","start":635.63,"end":666.09},{"id":26,"text":"They're just quadratic.","zh":"它们只是二次函数。","start":667.3,"end":668.16}],"notes":["本段讲授了梯度下降法中度量选择的重要性，通过一个简单的例子说明了不同度量对收敛速度的影响。讲者指出，选择与函数的子水平集形状一致的度量可以显著改善收敛效果，而选择不一致的度量则会恶化收敛。"],"formulas":[],"uncertainties":[],"diagram":"none","start":502.92,"end":668.16,"asr_flags":[],"math_clarifications":["原始片段中提到的Hessian矩阵（H(x)）在数学上是函数的二阶导数矩阵，通常用于牛顿法中。然而，由于原始片段中没有明确给出H(x)的定义或使用场景，因此无法确定其数学类型和适用条件。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":502.92,"text":"how much am I going to go down? If I go along axis two, how much is it going to go down? And you find the one where you're going to go down the most, and then you simply go along the axis. So that's a so-called axis-aligned step, people would call it. Okay. And again, you know, the picture shows how you actually get a different direction. Okay."},{"start":525.34,"text":"The choice of the metric or the norm for steepest descent is going to make a big difference, right? And here's just this baby example again, where the first one shows you steepest descent with a norm whose unit ball looks like this. And I don't know, you just eyeball it, you can see this, you know, some number of iterations. And here we take steepest descent in using a norm where the unit ball is like skewed this way."},{"start":553.47,"text":"And what you see is that has exacerbated the convergence horribly, right? And so what this tells us is kind of the, it tells you kind of the obvious thing. It says that if you, what you really want is you want a norm or a metric or something like that, that's kind of aligned with the sublevel sets of your function."},{"start":577.99,"text":"In other words, it's one which kind of has roughly the same shape. So this is just a very simple example to show this. I'm just pretending that this function looks kind of fatter than it does look tall. And so over here, this use of norm, this selection of norm actually improves the convergence. This one exacerbates it. Does this make sense?"},{"start":605.31,"text":"These are just sort of ideas, but it's the essence of where we're going. Because now we go to the, if you keep going with this logic, you end up at something called the Newton step. So the Newton step, you actually will use, what you'll do, is you take the Hessian of the second derivative of the function at the current point."},{"start":635.63,"text":"and you then use that as your metric, right? And so the argument now makes perfect sense, right? Because if I said, if you say, okay, I accept the idea that I should choose, let's say, a metric that captures the shape of my function, right? That's what I should do, right? Actually, let's have a discussion about smooth functions near their minimum. Let's have that discussion just for fun. What do smooth functions look like? Smooth convex functions look like near their minimum. What do they look like?"},{"start":667.3,"text":"They're just quadratic."}],"speech_gaps":[],"frame":"../frames/v014/004.webp","frame_time":514.9200000000001},{"title":"凸函数的等高线与Hessian矩阵","segments":[{"id":27,"text":"And they're quadratic with what's the Hessian there? I mean, well, look at that. Gives it away. That's the Hessian. The sub-level sets, right? If this is a smooth convex function, that's the minimizer. And then I say, what do the level sets look like? They look like this. Now, these are not exactly ellipsoids. I mean, unless the function is exactly quadratic. But this is what they look like, right? I mean, eventually they start looking not like ellipsoids. They start looking like that, right?","zh":"它们是二次函数，那那里的Hessian矩阵是什么？我的意思是，看看这个，已经透露了。这就是Hessian矩阵。子水平集，对吧？如果这是一个光滑的凸函数，这就是最小值点。然后我说，这些水平集看起来是什么样子？它们看起来像这样。现在，这些并不是精确的椭球体。我的意思是，除非函数恰好是二次函数。但这就是它们的样子，对吧？我的意思是，最终它们开始不像椭球体。它们开始看起来像这样，对吧？","start":668.96,"end":696.76},{"id":28,"text":"because who knows, right? But down near the minimum, they look really very much like ellipsoids, right? And the shape of the ellipsoid is determined by the Hessian of the function at this point, okay? So this is, and by the way, if you're in statistics or if you're not in statistics but know some statistics, you'd recognize this immediately. If you look at the negative log likelihood,","zh":"因为谁知道呢，对吧？但在接近最小值的地方，它们看起来非常像椭球体，对吧？而椭球体的形状由该点处函数的Hessian矩阵决定，对吧？所以，顺便说一句，如果你在统计学领域，或者即使不在统计学领域但了解一些统计学知识，你一定会立刻认出这一点。如果你看一下负对数似然函数，","start":698.18,"end":720.76},{"id":29,"text":"that's going to be, this is going to be, and this is in your parameter space, this point is going to be your maximum likelihood or minimum negative log likelihood point. And then if I ask you, well tell me about models that have a likelihood almost as high as my maximum likelihood. Everybody following this? Then basically I'm looking at, I'm looking exactly at level curves that are very close to the maximum likelihood.","zh":"这将会是，这将会是，而且这发生在你的参数空间中，这个点将会是你的最大似然点或最小负对数似然点。然后如果我问你，告诉我一些几乎达到我最大似然值的模型。大家跟上了吗？那么基本上我是在查看，我正在查看非常接近最大似然值的水平曲线。","start":721.54,"end":746.71},{"id":30,"text":"I pull down from the maximum likelihood, and I get sets. Now, these are parameters and models that fit the data you've seen, right? What do they look like? Well, if the loss, if the negative log likelihood is convex and smooth, right, then they look, they're approximately ellipsoidal. And so, actually, and the ellipsoid is determined by the Hessian of the log likelihood at the maximum likelihood point.","zh":"我从最大似然值往下拉，我得到一些集合。现在，这些是参数和模型，它们拟合你看到的数据，对吧？它们看起来是什么样子？如果损失函数，如果负对数似然函数是凸且光滑的，对吧？那么它们看起来，它们近似于椭球体。因此，实际上，椭球体由对数似然函数在最大似然点处的Hessian矩阵决定。","start":747.71,"end":776.51},{"id":31,"text":"which is, of course, the Fisher information. Everybody got that? And so this tells you very good ways to get sets of model parameters which give you almost the maximum likelihood on the data you've seen. So, okay, this is, again, if you know about this, fine, and if you don't, that's okay, too, right? So I'm just saying that this idea is kind of like everywhere. Okay, so now we connect it back to this conversation and said, here's what you should do. You should use steepest descent.","zh":"这当然是Fisher信息量。大家明白了吗？因此，这告诉你如何获得一组模型参数，这些参数在你看到的数据上几乎达到最大似然值。所以，好的，如果你们了解这些内容，那很好；如果你们不了解，也没关系，对吧？我只是在说这个想法在很多地方都适用。好的，现在我们将它联系回之前的讨论，并说，你应该怎么做。你应该使用最陡下降法。","start":777.14,"end":806.41},{"id":32,"text":"But what you should do is you need to get a metric that kind of looks like the curvature of your function, right? So this would be a stunningly good method. Ready for my method? It says do steepest descent. And someone says, yeah, which quadratic norm are you going to use? Which P? And I would say, oh, the Hessian of your function at the optimum. Everybody follow this? Boy, would that work well. Everybody.","zh":"但你应该做的是，你需要得到一个类似于你函数曲率的度量，对吧？这将是一个非常出色的方法。准备好我的方法了吗？它说做最陡下降法。有人会问，你将使用哪种二次范数？哪个P？我会说，哦，你函数在最优解处的Hessian矩阵。大家明白了吗？这方法效果会非常好。大家。","start":807.08,"end":835.96}],"notes":["本段讲解了凸函数的等高线形状及其与Hessian矩阵的关系。当函数是光滑凸函数时，其等高线在最小值附近近似为椭球体，椭球体的形状由函数在该点的Hessian矩阵决定。这在统计学中尤为重要，因为负对数似然函数的等高线在最大似然点附近也呈现椭球体形状，且其形状由Hessian矩阵（即Fisher信息矩阵）决定。","讲者指出，当负对数似然函数是凸且光滑时，其等高线近似为椭球体，这为参数估计提供了直观的几何解释。椭球体的形状由对数似然函数在最大似然点处的Hessian矩阵决定，这与Fisher信息矩阵密切相关。","讲者进一步说明，使用最陡下降法进行优化时，应选择与函数曲率相关的度量（即Hessian矩阵），以提高收敛速度。这种方法在优化问题中非常有效，尤其是在函数具有明显曲率特征的情况下。","讲者强调，Hessian矩阵在凸优化中具有重要作用，不仅决定了等高线的形状，还影响了优化算法的选择和性能。因此，理解Hessian矩阵的性质对于设计高效的优化方法至关重要。","讲者通过统计学中的最大似然估计作为例子，说明了Hessian矩阵在实际问题中的应用。这表明，Hessian矩阵不仅是理论分析的重要工具，也是实际建模和优化中的关键要素。","最后，讲者指出，选择与Hessian矩阵相关的度量（如二次范数）可以显著提升最陡下降法的性能，这为实际优化问题提供了重要的指导原则。"],"formulas":[{"latex":"H(x)","symbols":"Hessian矩阵","explanation":"H(x)表示函数在点x处的Hessian矩阵，用于描述函数的曲率。","evidence":"because who knows, right? But down near the minimum, they look really very much like ellipsoids, right? And the shape of the ellipsoid is determined by the Hessian of the function at this point, okay? So this is, and by the way, if you're in statistics or if you're not in statistics but know some statistics, you'd recognize this immediately. If you look at the negative log likelihood,"},{"latex":"Fisher information","symbols":"Fisher信息矩阵","explanation":"Fisher信息矩阵是负对数似然函数在最大似然点处的Hessian矩阵，用于描述参数估计的不确定性。","evidence":"which is, of course, the Fisher information. Everybody got that? And so this tells you very good ways to get sets of model parameters which give you almost the maximum likelihood on the data you've seen. So, okay, this is, again, if you know about this, fine, and if you don't, that's okay, too, right? So I'm just saying that this idea is kind of like everywhere. Okay, so now we connect it back to this conversation and said, here's what you should do. You should use steepest descent."}],"uncertainties":[],"diagram":"none","start":668.96,"end":835.96,"asr_flags":[],"math_clarifications":["Hessian矩阵用于描述函数的曲率，而Fisher信息矩阵是负对数似然函数在最大似然点处的Hessian矩阵，用于描述参数估计的不确定性。"],"boards":[{"title":"凸函数等高线与Hessian矩阵的关系","summary":"凸函数的等高线在最小值附近近似为椭球体，其形状由Hessian矩阵决定。在统计学中，负对数似然函数的等高线在最大似然点附近也呈现椭球体形状，且由Hessian矩阵（即Fisher信息矩阵）决定。","relation":"推导顺序","conditions":"函数为光滑凸函数","pitfall":"等高线形状仅在最小值附近近似为椭球体","note_indices":[0,1,4],"formula_indices":[0,1],"source_ids":[27,28,30,31],"steps":["凸函数的等高线在最小值附近近似为椭球体","椭球体的形状由函数在该点的Hessian矩阵决定","在统计学中，负对数似然函数的等高线在最大似然点附近也呈现椭球体形状","椭球体的形状由Hessian矩阵（即Fisher信息矩阵）决定"],"nodes":[{"title":"等高线形状","text":"凸函数的等高线在最小值附近近似为椭球体"},{"title":"Hessian矩阵","text":"椭球体的形状由函数在该点的Hessian矩阵决定"},{"title":"Fisher信息矩阵","text":"负对数似然函数的等高线在最大似然点附近由Hessian矩阵（Fisher信息矩阵）决定"},{"title":"统计学应用","text":"Fisher信息矩阵用于描述参数估计的不确定性"}],"id":"v014-005-1","start":668.96,"end":806.41,"formulas":[{"latex":"H(x)","symbols":"Hessian矩阵","explanation":"H(x)表示函数在点x处的Hessian矩阵，用于描述函数的曲率。","evidence":"because who knows, right? But down near the minimum, they look really very much like ellipsoids, right? And the sh this idea is kind of like everywhere. Okay, so now we connect it back to this conversation and said, here's what you should do. You should use steepest descent."},{"start":807.08,"text":"But what you should do is you need to get a metric that kind of looks like the curvature of your function, right? So this would be a stunningly good method. Ready for my method? It says do steepest descent. And someone says, yeah, which quadratic norm are you going to use? Which P? And I would say, oh, the Hessian of your function at the optimum. Everybody follow this? Boy, would that work well. Everybody."}],"speech_gaps":[],"frame":"../frames/v014/005.webp","frame_time":680.96},{"title":"牛顿法与变度量方法","segments":[{"id":33,"text":"Got that, right? That worked unbelievably well. Only minor problem is, someone says, okay, well, what is the Hessian at the optimum? And then the answer would be something like, well, first minimize it, and then I'll tell you the Hessian. Which is kind of like, this is stupid, right? Because that's what I want to do in the first place. Everybody follow this? Okay, so instead, we're going to use, we're simply going to use the Hessian at the current point as the best approximation we can make of the Hessian at the optimal point. Everybody following this?","zh":"明白了吗？那方法效果惊人。唯一的小问题是，有人会问，那么在最优解处的Hessian矩阵是什么呢？然后回答可能是，先最小化它，之后我再告诉你Hessian矩阵是什么。这听起来有点傻，对吧？因为这就是我一开始想做的事情。大家明白这个意思吗？好的，因此，我们将会使用当前点的Hessian矩阵作为最优解处Hessian矩阵的最佳近似。大家跟上思路了吗？","start":836.46,"end":865.92},{"id":34,"text":"That's one way to explain what Newton method is. And if we take the Newton step, and each time we redo it, we're actually changing the metric. And so sometimes people refer to this, this is a variable metric method. Because you're actually changing the metric when you stop and ask for directions and say, hey, what's the fastest way to go down from here?","zh":"这是一种解释牛顿法的方式。如果我们采取牛顿步，并且每次重新计算，实际上我们是在改变度量。因此，有时人们会称这种方法为变度量方法。因为在你停下来询问方向时，你实际上是在改变度量，问：‘从这里最快怎么往下走？’","start":866.63,"end":891.87},{"id":35,"text":"And then someone on their toes says, yeah, in what metric? You actually, every time, every step you take, you change it. Okay, so that's the, everybody, I mean, these are just ideas, ways you can think about what the Newton step is. Okay, and lots of other ways to think of it too. So here's another completely beautiful method. It says, let's expand, let's have a second order approximation of our function.","zh":"然后有人站起来问：‘在什么度量下？’你每次迈出一步，都会改变它。好的，所以这些只是想法，思考牛顿步的不同方式。好的，还有许多其他方式可以思考它。这里有一个完全美丽的另一种方法。它说，让我们展开，让我们对函数进行二阶近似。","start":892.5,"end":920.82},{"id":36,"text":"And that's, of course, just that, nothing but that. And you'd say, all right, let's minimize that. If you form a second-order approximation of a function at a point, minimize it, you get the Newton step. Everybody got that? So that also just makes perfect sense, right? So another way is you could think about the optimality conditions, and that looks like this. So this would be here. Here's a picture of the first one. So here's the function f, right? We're at x here.","zh":"当然，这仅仅是这样，别无其他。你会说，好吧，让我们最小化它。如果你在某一点对函数形成二阶近似，然后最小化它，你就会得到牛顿步。大家明白了吗？因此，这也完全合乎逻辑，对吧？另一种思考方式是考虑最优性条件，它看起来像这样。所以这里就是这种情况。这是第一个的图示。这里是函数f，对吧？我们在这里是x。","start":921.31,"end":950.83},{"id":37,"text":"then what i do is i get the second order approximation here this is f hat of f right by the way the first order approximation has to be an underestimator of f the second order we don't know could be above or below you don't know right so okay so here here you are here um here you are uh here uh we get a second order and what what it means to be a second order approximation is that f and f hat right near here","zh":"那么我所做的就是得到这里的二阶近似，这是f的近似，对吧。顺便说一下，一阶近似必须是f的低估，而二阶近似我们不知道，可能在上方也可能在下方，你不知道对吧。所以在这里，你在这里，嗯，你在这里，嗯，我们得到了二阶近似，什么是二阶近似的意思呢？就是f和f的近似值在这里非常接近，我的意思是立方级的接近，是小的立方级，对吧。是的，类似这样的，它们在这里几乎一致，对吧。所以这是一个非常好的近似值，对吧。好的，我们形成这个近似值，这就是这个划线的东西，你可以看到在这里，它在错误的一侧，它在这里是一个下界，而在上方是一个上界，这个的最小化值就是这个，所以这就是牛顿步，这里和这里的区别","start":951.32,"end":980.13},{"id":38,"text":"are extremely close which is my way of saying close cubed it's small cubed right the the yeah something like that it's really like they agreed a second order here right so it's a super good approximation right here okay so we form that that's this dash thing and you can see over here it's on the wrong side it's on you know it's a lower bound up here it's an upper bound and the minimizer of this is this and so this is the newton step the difference between here and here okay","zh":"它们非常接近，这是我在说立方后的接近程度，它很小的立方，对吧，是的，类似这样的情况，它们在这里几乎同意了二阶近似，对吧，所以这里的近似是非常好的，对吧。好的，我们形成这个，这就是这个划线的东西，你可以在这里看到，它在错误的一边，它在下面，这里是下界，这里是上界，而这个的最小化点就是这个，因此这就是牛顿步，这里和这里之间的差异","start":980.62,"end":1009.2}],"notes":["本段讲解牛顿法中使用当前点的Hessian矩阵作为最优解处Hessian矩阵的近似，这是牛顿法的核心思想之一。讲者指出，这种方法避免了直接计算最优解处的Hessian矩阵，因为这正是牛顿法想要解决的问题。","讲者进一步解释了牛顿法的另一种理解方式，即通过构造函数的二阶近似来寻找最优解。这种近似在当前点附近非常精确，因此可以作为寻找最优解的依据。","讲者提到，一阶近似必须是函数的下界，而二阶近似则可能高于或低于函数值，因此无法确定其性质。这说明了二阶近似在优化中的不确定性。","讲者通过图像说明了二阶近似与原函数的关系，指出在某些情况下，二阶近似可能成为下界或上界，这取决于具体函数的形状。","讲者强调，牛顿法的每一步都可能改变度量方式，因此被称为变度量方法。这种改变使得牛顿法在不同点处具有不同的搜索方向。","讲者最后指出，牛顿法的每一步都是通过最小化二阶近似来确定的，这与牛顿法的定义一致，即通过求解二阶近似函数的极小值点来更新迭代点。"],"formulas":[],"uncertainties":["close cubed it's small cubed"],"diagram":"none","start":836.46,"end":1009.2,"asr_flags":[],"math_clarifications":["原文中提到的二阶近似未提供具体的数学表达式，如泰勒展开式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":836.46,"text":"Got that, right? That worked unbelievably well. Only minor problem is, someone says, okay, well, what is the Hessian at the optimum? And then the answer would be something like, well, first minimize it, and then I'll tell you the Hessian. Which is kind of like, this is stupid, right? Because that's what I want to do in the first place. Everybody follow this? Okay, so instead, we're going to use, we're simply going to use the Hessian at the current point as the best approximation we can make of the Hessian at the optimal point. Everybody following this?"},{"start":866.63,"text":"That's one way to explain what Newton method is. And if we take the Newton step, and each time we redo it, we're actually changing the metric. And so sometimes people refer to this, this is a variable metric method. Because you're actually changing the metric when you stop and ask for directions and say, hey, what's the fastest way to go down from here?"},{"start":892.5,"text":"And then someone on their toes says, yeah, in what metric? You actually, every time, every step you take, you change it. Okay, so that's the, everybody, I mean, these are just ideas, ways you can think about what the Newton step is. Okay, and lots of other ways to think of it too. So here's another completely beautiful method. It says, let's expand, let's have a second order approximation of our function."},{"start":921.31,"text":"And that's, of course, just that, nothing but that. And you'd say, all right, let's minimize that. If you form a second-order approximation of a function at a point, minimize it, you get the Newton step. Everybody got that? So that also just makes perfect sense, right? So another way is you could think about the optimality conditions, and that looks like this. So this would be here. Here's a picture of the first one. So here's the function f, right? We're at x here."},{"start":951.32,"text":"then what i do is i get the second order approximation here this is f hat of f right by the way the first order approximation has to be an underestimator of f the second order we don't know could be above or below you don't know right so okay so here here you are here um here you are uh here uh we get a second order and what what it means to be a second order approximation is that f and f hat right near here"},{"start":980.62,"text":"are extremely close which is my way of saying close cubed it's small cubed right the the yeah something like that it's really like they agreed a second order here right so it's a super good approximation right here okay so we form that that's this dash thing and you can see over here it's on the wrong side it's on you know it's a lower bound up here it's an upper bound and the minimizer of this is this and so this is the newton step the difference between here and here okay"}],"speech_gaps":[],"frame":"../frames/v014/006.webp","frame_time":848.46},{"title":"牛顿法的几何解释与收敛性","segments":[{"id":39,"text":"Another one is you linearize the optimality condition. And you'd say, you know, I'm at a point x. I want a point where the gradient of f is zero. And you go, cool, then what are you going to do? And you say, well, I'm going to perturb x by v. I'm going to take a step v. But what you'd like is you'd like the gradient of f of x plus v to equal zero.","zh":"另一个方法是你对最优性条件进行线性化。你会说，我现在处于一个点x，我想要找到一个梯度为零的点。然后你会问，你知道你会怎么做吗？你会说，好吧，我要通过一个扰动v来改变x，我要迈出一步v。但你希望的是，梯度在x加上v处等于零。","start":1010.26,"end":1030.98},{"id":40,"text":"But you don't know how to solve that in general. There's one case where you do. We'll get to that in a minute. So you do this. Instead, you'd say, well, you know what? I'll approximate this using calculus. So what this gradient is, if this is the first order expansion of the gradient, is the gradient here, this is going to be the first order thing. It's actually the following. It's the gradient plus the second derivative times the displacement, right? So this is that. And then what you do is you say, okay.","zh":"但你一般不知道如何解决这个问题。有一个特殊情况你是知道的，我们稍后会讲到。因此，你这样做：你可以说，好吧，你知道吗？我会用微积分来近似这个。这个梯度，如果这是梯度的一阶展开，就是这里的梯度，这将是第一阶的东西。实际上，它是以下内容：梯度加上二阶导数乘以位移，对吧？这就是这个。然后你做的是，你说，好吧。","start":1032.4,"end":1058.92},{"id":41,"text":"I don't know what's actually going to happen to the gradient, but this I know, this I get, I can compute these two, and I'll just solve this equation, and that gives us again the Newton step. So does that make sense? I mean, I hate to give, there are even more explanations, but this is just interpretations of what it is. Okay, so that's the Newton step.","zh":"我不知道梯度实际上会发生什么变化，但我知道这个，我可以计算这两个，然后我只需解这个方程，这又给出了牛顿步。这有意义吗？我的意思是，我讨厌给出更多的解释，但这是对它的解释。好的，这就是牛顿步。","start":1059.47,"end":1083.73},{"id":42,"text":"Oh, and here's a picture of the second one in 1D. So actually, Newton would have been quite familiar with this picture, right? So here's the derivative, right? It's increasing because the function is convex, right? So here it is. And what we want to do is we want to find the zero crossing like this. So we want to find that point there. So how do you do that? Well, you're at a point here. And you simply, here, take a linear, I guess you would say, or affine approximation.","zh":"哦，这里有一张一维情况下的第二张图。实际上，牛顿应该对这张图非常熟悉，对吧？这里显示的是导数，对吧？它在增加，因为函数是凸的，对吧？这就是它。我们想要找到零点，像这样。我们想要找到那个点。那么你是怎么做到的呢？好吧，你处于这个点上。然后你简单地在这里做一个线性近似，或者说仿射近似。","start":1084.57,"end":1113.27},{"id":43,"text":"of the derivative at that point, that's this dashed line here, and then wherever that is zero, that's our next point, right? By the way, if I were to do it again, what would happen? So if I went to this point, calculated the first order approximation and looked at the zero of it, what would your next, if I iterated the Newton step twice, I think your eyeball is going to tell you what? Are you going to get a good approximation?","zh":"导数在该点的近似，这就是这里的虚线。然后无论它在哪里为零，那就是我们的下一个点，对吧？顺便说一句，如果我再次这样做，会发生什么呢？如果我到了这个点，计算了一阶近似并查看它的零点，如果你迭代两次牛顿步，你的眼睛会告诉你什么？你会得到一个良好的近似吗？","start":1114.43,"end":1144.05},{"id":44,"text":"Yeah, good. And then if you do it a third time, it's going to be like really, really good, right? Why? Because if I zoom in on a smooth increasing function, right, as it goes through zero, if I zoom in, it just looks like a line. That's all it looks like. The same is true over here, right? If I take this point, fit a quadratic to it and minimize it, but suppose when I get near the bottom here and I fit a quadratic to it,","zh":"是的，很好。然后如果你第三次进行这个操作，它就会变得非常好，对吧？为什么？因为如果我在一个光滑递增函数上放大观察，当它穿过零点时，如果我放大来看，它看起来就只是一条直线。这就是它看起来的样子。同样的情况也适用于这边，对吧？如果我取这个点，拟合一个二次函数并对其进行最小化，但假设当我接近底部时，我拟合一个二次函数到它，","start":1145.45,"end":1171.27}],"notes":["本段讲解了牛顿法的几何解释，通过一维情况下的图像说明了牛顿法如何通过在当前点处进行线性或仿射近似来寻找函数的零点。牛顿法利用了函数的一阶导数和二阶导数信息，通过求解线性化后的方程来更新迭代点。","在凸函数的情况下，牛顿法的收敛性较好，因为函数的形状使得每次迭代都能快速接近真实零点。通过多次迭代，牛顿法能够迅速逼近精确解，尤其是在函数接近零点时，其局部行为近似于直线，因此线性近似更加准确。","讲者通过图像说明了牛顿法的迭代过程，指出在每次迭代中，通过在当前点处构造切线（即一阶近似），找到该切线与横轴的交点作为下一个迭代点。这种做法在函数平滑且凸的情况下特别有效。","讲者还提到，如果在函数的底部附近进行二次拟合，牛顿法的收敛速度会更快，因为二次拟合能够更好地捕捉函数的曲率信息，从而更精确地找到零点。","在讲者提到的图像中，函数是凸的，因此其导数是单调递增的。这种性质保证了牛顿法在迭代过程中不会出现发散的情况，而是能够稳定地收敛到零点。","讲者通过多次迭代的示例说明了牛顿法的收敛性，指出在第三次迭代后，牛顿法的近似解已经非常接近真实解，这体现了牛顿法在凸优化问题中的高效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1010.26,"end":1171.27,"asr_flags":[],"math_clarifications":["原文未提供足够的数学信息来支持这些公式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1010.26,"text":"Another one is you linearize the optimality condition. And you'd say, you know, I'm at a point x. I want a point where the gradient of f is zero. And you go, cool, then what are you going to do? And you say, well, I'm going to perturb x by v. I'm going to take a step v. But what you'd like is you'd like the gradient of f of x plus v to equal zero."},{"start":1032.4,"text":"But you don't know how to solve that in general. There's one case where you do. We'll get to that in a minute. So you do this. Instead, you'd say, well, you know what? I'll approximate this using calculus. So what this gradient is, if this is the first order expansion of the gradient, is the gradient here, this is going to be the first order thing. It's actually the following. It's the gradient plus the second derivative times the displacement, right? So this is that. And then what you do is you say, okay."},{"start":1059.47,"text":"I don't know what's actually going to happen to the gradient, but this I know, this I get, I can compute these two, and I'll just solve this equation, and that gives us again the Newton step. So does that make sense? I mean, I hate to give, there are even more explanations, but this is just interpretations of what it is. Okay, so that's the Newton step."},{"start":1084.57,"text":"Oh, and here's a picture of the second one in 1D. So actually, Newton would have been quite familiar with this picture, right? So here's the derivative, right? It's increasing because the function is convex, right? So here it is. And what we want to do is we want to find the zero crossing like this. So we want to find that point there. So how do you do that? Well, you're at a point here. And you simply, here, take a linear, I guess you would say, or affine approximation."},{"start":1114.43,"text":"of the derivative at that point, that's this dashed line here, and then wherever that is zero, that's our next point, right? By the way, if I were to do it again, what would happen? So if I went to this point, calculated the first order approximation and looked at the zero of it, what would your next, if I iterated the Newton step twice, I think your eyeball is going to tell you what? Are you going to get a good approximation?"},{"start":1145.45,"text":"Yeah, good. And then if you do it a third time, it's going to be like really, really good, right? Why? Because if I zoom in on a smooth increasing function, right, as it goes through zero, if I zoom in, it just looks like a line. That's all it looks like. The same is true over here, right? If I take this point, fit a quadratic to it and minimize it, but suppose when I get near the bottom here and I fit a quadratic to it,"}],"speech_gaps":[],"frame":"../frames/v014/007.webp","frame_time":1022.26},{"title":"牛顿方法与Hessian度量","segments":[{"id":45,"text":"How good an approximation is the quadratic nearby? It's really good, right? And so all of this is giving you kind of this intuition that this method should have some amazingly good terminal convergence, right? Which we'll get to in a minute, okay? And it's all true. Okay. And here's another very cool way to do it.","zh":"这个二次近似有多好？真的非常好，对吧？因此，所有这些都在给你一种直觉，这种方法应该具有令人惊叹的收敛性，对吧？我们稍后会详细讨论这一点，好吗？这一切都是正确的。好的。这里还有另一种非常酷的方法。","start":1171.76,"end":1200.48},{"id":46,"text":"It turns out it's the steepest descent direction in the metric given by the Hessian. And that makes total sense, right? Because, you know, again, you land at X, you ask someone, hey, what's the steepest way down the mountain or whatever? And then they ask you, in what norm or what metric? And you say...","zh":"事实上，这是由Hessian矩阵定义的度量下的最陡下降方向。这完全合情合理，对吧？因为，你到达点X后，问某人：嘿，从山上往下走的最陡方向是什么？然后他们会问你，用什么范数或度量？你会说……","start":1201.67,"end":1225.33},{"id":47,"text":"well, do you happen to know the Hessian of the function at the minimizer down at the bottom of the valley? And they'll say, no, I don't. I just live here, right? Or something like that, right? Then they'd say, fine, do you know the Hessian at the current point? And they would say, oh, that I do know. Okay, you go, fine, we'll use that. Everybody following this?","zh":"嗯，你知道在山谷底部的最小值点处的函数Hessian矩阵吗？他们会说，不，我不知道。我只是住在这里，对吧？或者类似这样的话，对吧？然后他们会说，好吧，你知道当前点处的Hessian矩阵吗？他们会说，哦，我知道。好的，你去吧，我们用这个。大家跟得上吗？","start":1225.86,"end":1246.29},{"id":48,"text":"And that would give you this. So it's very cool. And you can actually plot pictures that shows what a Newton direction is going to look like. And this is an example showing that you're going to get a pretty good Newton step, at least for this thing. So this is the Newton step. Then you have something cool called the Newton decrement. The Newton decrement, you can think of it this way. It's actually...","zh":"这会给你这个结果。所以这非常酷。你实际上可以绘制图像来展示牛顿方向会是什么样子。这是一个例子，显示你会得到一个相当好的牛顿步长，至少对于这个情况来说是这样。这就是牛顿步长。然后你有一种叫做牛顿减量的酷东西。牛顿减量，你可以这样理解：它实际上是……","start":1246.91,"end":1273.93},{"id":49,"text":"It gives you, it's actually, one very good way to think about it is this. It is actually, it is the predicted decrease when you take a Newton step of the function, predicted by your quadratic model of the function. So that's what it is.","zh":"它给你一个非常好的思考方式，可以这样想：它实际上是当你采取一个牛顿步长时，函数的预测减少量，这个减少量是由你对函数的二次模型预测的。这就是它的含义。","start":1274.54,"end":1294.86},{"id":50,"text":"Oh yeah, it means I'm using a quadratic metric, which is going to be this. Like when someone says, what's your norm? And I'd say, oh, that's easy. I'll take the norm to be this. This is my current point. So here, this is the norm of z. There you go. That's it. Yeah, that's what it means. Right. By the way, if you have other ways to get a rough idea of the shape of your sublevel sets,","zh":"哦对了，这意味着我在使用一个二次度量，它会是这样的。比如当有人问你的范数是什么时，我会说，哦，这很简单。我把范数定义为这个。这是我的当前点。所以在这里，这是向量z的范数。好了，就是这样。是的，这就是它的意思。对了，如果你有其他方法可以大致了解你的下水平集的形状，","start":1295.55,"end":1327.48}],"notes":["本段讲解了牛顿方法中Hessian矩阵所定义的度量的意义。讲者指出，牛顿方向实际上是基于当前点的Hessian矩阵所定义的最陡下降方向，这种度量方式允许我们使用二次模型来预测函数在牛顿步下的下降量。讲者还提到，这种度量方式类似于使用二次范数，即当前点的Hessian矩阵定义了一个新的范数，用于衡量函数的形状。","讲者通过类比山地地形，解释了Hessian度量的直观意义。当询问如何从山顶最快下山时，回答者会询问使用哪种范数或度量，而讲者则会使用当前点的Hessian矩阵来定义这个度量，从而得到最陡的下降方向。","讲者提到牛顿下降步的预测下降量，即所谓的牛顿减量（Newton decrement），这是基于当前点的二次模型对函数下降量的预测。这种预测有助于判断当前的牛顿步是否足够有效。","讲者还提到，如果使用其他方法来估计子水平集的形状，也可以作为补充手段。这表明在实际应用中，Hessian度量并不是唯一的度量方式，但它是牛顿方法中一个重要的组成部分。","讲者强调了Hessian度量在牛顿方法中的核心作用，即通过当前点的Hessian矩阵来定义一个局部的二次度量，从而更准确地捕捉函数的局部几何特性。","讲者通过提问的方式，引导学生思考Hessian度量的定义及其在牛顿方法中的应用，这有助于加深学生对这一概念的理解。"],"formulas":[],"uncertainties":["It gives you, it's actually, one very good way to think about it is this. It is actually, it is the predicted decrease when you take a Newton step of the function, predicted by your quadratic model of the function. So that's what it is."],"diagram":"none","start":1171.76,"end":1327.48,"asr_flags":[],"math_clarifications":["公式未提供完整的数学表达式，无法核对其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1171.76,"text":"How good an approximation is the quadratic nearby? It's really good, right? And so all of this is giving you kind of this intuition that this method should have some amazingly good terminal convergence, right? Which we'll get to in a minute, okay? And it's all true. Okay. And here's another very cool way to do it."},{"start":1201.67,"text":"It turns out it's the steepest descent direction in the metric given by the Hessian. And that makes total sense, right? Because, you know, again, you land at X, you ask someone, hey, what's the steepest way down the mountain or whatever? And then they ask you, in what norm or what metric? And you say..."},{"start":1225.86,"text":"well, do you happen to know the Hessian of the function at the minimizer down at the bottom of the valley? And they'll say, no, I don't. I just live here, right? Or something like that, right? Then they'd say, fine, do you know the Hessian at the current point? And they would say, oh, that I do know. Okay, you go, fine, we'll use that. Everybody following this?"},{"start":1246.91,"text":"And that would give you this. So it's very cool. And you can actually plot pictures that shows what a Newton direction is going to look like. And this is an example showing that you're going to get a pretty good Newton step, at least for this thing. So this is the Newton step. Then you have something cool called the Newton decrement. The Newton decrement, you can think of it this way. It's actually..."},{"start":1274.54,"text":"It gives you, it's actually, one very good way to think about it is this. It is actually, it is the predicted decrease when you take a Newton step of the function, predicted by your quadratic model of the function. So that's what it is. Yeah, you have a question? What the metric defined by the Hessian means?"},{"start":1295.55,"text":"Oh yeah, it means I'm using a quadratic metric, which is going to be this. Like when someone says, what's your norm? And I'd say, oh, that's easy. I'll take the norm to be this. This is my current point. So here, this is the norm of z. There you go. That's it. Yeah, that's what it means. Right. By the way, if you have other ways to get a rough idea of the shape of your sublevel sets,"}],"speech_gaps":[],"frame":"../frames/v014/008.webp","frame_time":1183.76},{"title":"凸优化中的仿射不变性与牛顿法","segments":[{"id":51,"text":"Like, by all means, use it. I mean, there's lots of other ways you might be able to, you know, there are plenty of cases where you might have some other, to get another estimate, which is not the Hessian or something like that, to get this, right? So, okay. All right. So one thing that's very cool about this metric is that it turns out it's lots of things, but one thing that's very important is it's actually affine invariant. So that's actually going to be a big, important theme.","zh":"比如，当然可以使用它。我的意思是，你可能还有其他方法能够做到这一点，你知道的，有很多情况你可以通过其他方式得到另一种估计，这并不是Hessian矩阵或者其他类似的东西，对吧？所以，好的。那么，这个度量的一个非常酷的地方是，它实际上有很多用途，但非常重要的一点是它实际上是仿射不变的。这实际上会成为一个非常重要的主题。","start":1328.12,"end":1357.19},{"id":52,"text":"So if I change coordinates, if I apply an affine transform to my problem and solve that, by the way, if you do that with Newton, with gradient method, that's actually completely equivalent to using steepest descent with a different quadratic norm, right? So you can even think of steepest descent as two steps. With a quadratic norm, it's two steps. Step one.","zh":"所以，如果你改变坐标，如果你对问题应用一个仿射变换并求解，顺便说一句，如果你用牛顿法或梯度法这样做，实际上等价于使用一个不同的二次范数的最陡下降法，对吧？所以，你甚至可以把最陡下降法看作两个步骤。在二次范数下，它有两个步骤。第一步。","start":1357.59,"end":1383.3},{"id":53,"text":"Change core, apply a matrix so that your unit ball becomes just a Euclidean ball. Another way to say it is, actually some people use a great verb for that, which is you round the problem.","zh":"改变核心，应用一个矩阵，使得你的单位球变成一个欧几里得球。另一种说法是，实际上有些人用一个很棒的动词来描述这个过程，那就是你“圆化”了这个问题。","start":1384.13,"end":1401.63},{"id":54,"text":"Which is a great term, right? Because to round it means, you know, if your sub-level sets look like this, and you apply a coordinate transform, and then you just want it to look isotropic. You want the curvature to be about the same in all directions, right? And someone says, why? You'd say, because when the curvature is the same in all directions, gradient method is outstanding, right? Everybody?","zh":"这是一个很棒的术语，对吧？因为“圆化”意味着，如果你的下水平集看起来像这样，然后你应用一个坐标变换，你只希望它看起来各向同性。你希望各个方向的曲率大致相同，对吧？有人问，为什么？你会说，因为当曲率在各个方向上相同时，梯度法表现非常出色，对吧？大家明白吗？","start":1402.33,"end":1425.13},{"id":55,"text":"Got this? So, okay. So, here, if you change coordinates by a linear mapping, this doesn't change. It's the same number, right? So, affine invariance is going to come up later. Okay, now we have Newton's method. So, I mean, it just uses the Newton step.","zh":"明白了吗？所以，好的。在这里，如果你通过一个线性映射改变坐标，这个数值不会改变，对吧？所以，仿射不变性会在后面出现。好的，现在我们有牛顿法。我的意思是，它只是使用牛顿步。","start":1426.25,"end":1449.34},{"id":56,"text":"So you compute the Newton step and the gradient. You quit if this so-called Newton-Deckerman is small enough. Then you use a backtracking line search, for example, and whatever. And this entire algorithm is affine, is basically independent. It commutes with changes of coordinates, right? So in other words, if someone says, yeah, you know, I'm going to...","zh":"所以，你计算牛顿步和梯度。如果所谓的牛顿-德克曼（Newton-Deckerman）足够小，你就停止。然后你使用后退跟踪线搜索，例如，以及其他方法。整个算法实际上是仿射不变的，基本上是独立的。它与坐标变换的顺序无关，对吧？换句话说，如果有人说，是的，你知道的，我要……","start":1450.82,"end":1477.82},{"id":57,"text":"Instead of minimizing f, I'm going to minimize this f tilde, which multiplies its argument by a non-singular matrix T.","zh":"而不是最小化 f，我要最小化这个 f 带波浪号，它将它的参数乘以一个非奇异矩阵 T。","start":1478.25,"end":1485.95}],"notes":["本段讲解了凸优化中仿射不变性的概念，指出在进行坐标变换后，某些优化方法的性质保持不变。例如，牛顿法在进行仿射变换后仍然保持其有效性，这与最速下降法在不同二次范数下的等价性有关。","讲者提到，通过应用一个矩阵变换，可以将单位球变为欧几里得球，这一过程被称为“round the problem”，即使问题变得各向同性，从而使得梯度法在各方向上的曲率一致，从而表现优异。","在进行坐标变换时，某些优化算法的性质保持不变，例如牛顿法的仿射不变性。这意味着，即使在变换后的坐标系中，算法的行为与原坐标系中相同。","讲者指出，当使用牛顿法时，计算牛顿步和梯度，并在牛顿-德克曼（Newton-Deckerman）条件满足时停止。随后使用回溯线搜索等方法进行优化。","最后，讲者提到，可以通过应用一个非奇异矩阵T来变换目标函数，从而在新的坐标系中进行优化，这体现了仿射不变性的应用。","这些内容强调了在凸优化中，仿射不变性是一个重要的性质，它允许在不同坐标系下保持优化方法的有效性，从而提高算法的鲁棒性和适用性。"],"formulas":[],"uncertainties":["Newton-Deckerman"],"diagram":"none","start":1328.12,"end":1485.95,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1328.12,"text":"Like, by all means, use it. I mean, there's lots of other ways you might be able to, you know, there are plenty of cases where you might have some other, to get another estimate, which is not the Hessian or something like that, to get this, right? So, okay. All right. So one thing that's very cool about this metric is that it turns out it's lots of things, but one thing that's very important is it's actually affine invariant. So that's actually going to be a big, important theme."},{"start":1357.59,"text":"So if I change coordinates, if I apply an affine transform to my problem and solve that, by the way, if you do that with Newton, with gradient method, that's actually completely equivalent to using steepest descent with a different quadratic norm, right? So you can even think of steepest descent as two steps. With a quadratic norm, it's two steps. Step one."},{"start":1384.13,"text":"Change core, apply a matrix so that your unit ball becomes just a Euclidean ball. Another way to say it is, actually some people use a great verb for that, which is you round the problem."},{"start":1402.33,"text":"Which is a great term, right? Because to round it means, you know, if your sub-level sets look like this, and you apply a coordinate transform, and then you just want it to look isotropic. You want the curvature to be about the same in all directions, right? And someone says, why? You'd say, because when the curvature is the same in all directions, gradient method is outstanding, right? Everybody?"},{"start":1426.25,"text":"Got this? So, okay. So, here, if you change coordinates by a linear mapping, this doesn't change. It's the same number, right? So, affine invariance is going to come up later. Okay, now we have Newton's method. So, I mean, it just uses the Newton step."},{"start":1450.82,"text":"So you compute the Newton step and the gradient. You quit if this so-called Newton-Deckerman is small enough. Then you use a backtracking line search, for example, and whatever. And this entire algorithm is affine, is basically independent. It commutes with changes of coordinates, right? So in other words, if someone says, yeah, you know, I'm going to..."},{"start":1478.25,"text":"Instead of minimizing f, I'm going to minimize this f tilde, which multiplies its argument by a non-singular matrix T."}],"speech_gaps":[],"frame":"../frames/v014/009.webp","frame_time":1340.12},{"title":"牛顿法的不变性与收敛性分析","segments":[{"id":58,"text":"In gradient method, you get completely different iterates and all that. It might be faster, it might be way slower. I don't know. It just depends. But you'll get a completely different thing. Actually, up here, it all goes away. And you can check because when you do this, the gradient gets a T in front of it and then the Hessian gets a T on the left and a T transpose on the right or something like that. And when you assemble everything...","zh":"在梯度法中，你会得到完全不同的迭代序列，所有的一切都不同。它可能更快，也可能慢得多。我不知道。这取决于具体情况。但你会得到一个完全不同的结果。实际上，这里的一切都会消失。你可以检查一下，当你这样做时，梯度前面会有一个T，然后Hessian矩阵左边有一个T，右边有一个T的转置，或者类似这样的情况。当你把所有东西组合起来……","start":1487.35,"end":1510.77},{"id":59,"text":"it all just goes away so you get the identical steps here right so another way to say this newton's method is independent of changes of coordinate of well linear changes any linear change of coordinates right so that so which is a that's a extremely uh good attribute to have actually in theory it's cool but it's all it's actually super useful in practice right so what it means is to first order scaling doesn't matter","zh":"一切都会消失，因此在这里你会得到完全相同的步骤。因此，另一种说法是牛顿法与坐标变换无关，任何线性坐标变换都无关。因此，这实际上是一个极其好的属性。在理论上，这很酷，但在实践中，这实际上非常有用。这意味着，对于牛顿法来说，一阶缩放并不重要。","start":1511.1,"end":1539.46},{"id":60,"text":"for something like a Newton method. It doesn't make any difference at all. I mean, if you were going to do the linear algebra in infinite precision, it literally wouldn't matter at all. Whereas that's completely false for something like a gradient method, right? There, you change coordinates, and if you change coordinates, you either get something faster or actually much more likely slower. Okay, so this is Newton's method.","zh":"对于像牛顿法这样的方法，根本没有任何区别。我的意思是，如果你在无限精度下进行线性代数运算，它根本不会有任何区别。而对于像梯度法这样的方法，这完全是错误的。在那里，你改变坐标，如果你改变坐标，你得到的要么是更快的，要么实际上更可能更慢的。好的，所以这就是牛顿法。","start":1540.36,"end":1567.49},{"id":61,"text":"So I'm going to give you the classical convergence analysis. So this is actually interesting. This is actually from the Soviet Union around the 1930s. But here it is. It's actually super interesting. Oh, and actually, before we start, I have to ask you a bunch of questions, right? How well does Newton's method work on a quadratic function? Yeah, quite well, right? Yeah, like how well? Like it converges in one step.","zh":"我现在将给你经典的收敛性分析。这实际上很有趣。这实际上来自苏联的1930年代左右。但这里它就是。这实际上非常有趣。哦，而且在我们开始之前，我必须问你们一些问题，对吧？牛顿法在二次函数上表现如何？是的，相当好，对吧？是的，像这样好到什么程度？比如，它在一歩内就收敛。","start":1569.77,"end":1602.16},{"id":62,"text":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah.","zh":"为什么？一种理解牛顿法的方法是，你处于点x，然后你要求我为你开发一个函数的二次近似。二次函数的二次近似是什么？就是它自己。然后下一步是它说最小化这个近似。实际上，当你计算牛顿步时，你并不知道，但你实际上是在解决整个问题。哦，顺便说一句，是的。","start":1602.84,"end":1624.68},{"id":63,"text":"How, yeah, notice the other thing is that when I ask you to minimize a quadratic convex function, what does that turn into? It's linear algebra. It's nothing else, right? Because the Hessian is affine in the point. So it's just linear algebra. And so therefore, that means I can pull in all the stuff we talked about last week. And we will. We'll do that later. That's another thread. But we'll be talking about what does it mean for a Hessian to be diagonal?","zh":"如何，是的，注意另一件事是，当我让你最小化一个二次凸函数时，这会变成什么？它变成了线性代数。它除此之外别无他物，对吧？因为Hessian矩阵在点上是仿射的。所以它只是线性代数。因此，这意味着我可以引入我们上周讨论的所有内容。我们会这么做。我们稍后会这样做。这是另一个线索。但我们会讨论Hessian矩阵对角化意味着什么？","start":1626.34,"end":1655.9}],"notes":["本段讨论了牛顿法在坐标变换下的不变性，指出牛顿法在坐标变换下保持步骤不变，这是其重要属性。这在理论上和实践中都非常有用，因为一阶缩放不会影响结果。","牛顿法在二次函数上的表现非常好，因为它在一次迭代中就能收敛。这是因为牛顿法通过二次逼近函数，而二次函数的二次逼近就是它本身，因此直接求解即可得到最优解。","牛顿法的计算过程实际上等价于求解一个线性代数问题，因为Hessian矩阵在点上是仿射的。因此，可以利用之前讨论的线性代数知识来分析牛顿法。","牛顿法的收敛性分析来自苏联1930年代的研究，这表明牛顿法在优化理论中具有重要的历史背景。","在讨论牛顿法时，讲师还提出了问题，引导学生思考如何理解牛顿法的原理，以及如何将牛顿法应用于实际问题。","最后，讲师提到将讨论Hessian矩阵对角化的意义，这与牛顿法的计算效率和收敛性密切相关。"],"formulas":[{"latex":"H(x) = \\nabla^2 f(x)","symbols":"H(x) 表示函数 f(x) 在点 x 处的Hessian矩阵","explanation":"公式正确，Hessian矩阵的定义无误。","evidence":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah."},{"latex":"x_{k+1} = x_k - H(x_k)^{-1} \\nabla f(x_k)","symbols":"牛顿法的迭代公式，其中 $ x_{k+1} $ 是下一个迭代点，$ H(x_k) $ 是Hessian矩阵，$ \nabla f(x_k) $ 是梯度","explanation":"公式正确，牛顿法的迭代公式无误。","evidence":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah."}],"uncertainties":["在段落59中，'extremely uh good attribute' 的 'uh' 可能是口误，但不影响整体意思。","在段落60中，'infinite precision' 的具体含义可能需要进一步澄清，但根据上下文可以理解为无限精度的线性代数计算。","在段落62中，'you didn't know it, but you're actually solving the entire problem' 的具体含义可能需要进一步澄清，但可以理解为牛顿法在计算过程中实际上解决了整个问题。"],"diagram":"none","start":1487.35,"end":1655.9,"asr_flags":[],"math_clarifications":["未发现需要核对的数学公式错误，所有公式均符合数学规范。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1487.35,"text":"In gradient method, you get completely different iterates and all that. It might be faster, it might be way slower. I don't know. It just depends. But you'll get a completely different thing. Actually, up here, it all goes away. And you can check because when you do this, the gradient gets a T in front of it and then the Hessian gets a T on the left and a T transpose on the right or something like that. And when you assemble everything..."},{"start":1511.1,"text":"it all just goes away so you get the identical steps here right so another way to say this newton's method is independent of changes of coordinate of well linear changes any linear change of coordinates right so that so which is a that's a extremely uh good attribute to have actually in theory it's cool but it's all it's actually super useful in practice right so what it means is to first order scaling doesn't matter"},{"start":1540.36,"text":"for something like a Newton method. It doesn't make any difference at all. I mean, if you were going to do the linear algebra in infinite precision, it literally wouldn't matter at all. Whereas that's completely false for something like a gradient method, right? There, you change coordinates, and if you change coordinates, you either get something faster or actually much more likely slower. Okay, so this is Newton's method."},{"start":1569.77,"text":"So I'm going to give you the classical convergence analysis. So this is actually interesting. This is actually from the Soviet Union around the 1930s. But here it is. It's actually super interesting. Oh, and actually, before we start, I have to ask you a bunch of questions, right? How well does Newton's method work on a quadratic function? Yeah, quite well, right? Yeah, like how well? Like it converges in one step."},{"start":1602.84,"text":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah."},{"start":1626.34,"text":"How, yeah, notice the other thing is that when I ask you to minimize a quadratic convex function, what does that turn into? It's linear algebra. It's nothing else, right? Because the Hessian is affine in the point. So it's just linear algebra. And so therefore, that means I can pull in all the stuff we talked about last week. And we will. We'll do that later. That's another thread. But we'll be talking about what does it mean for a Hessian to be diagonal?"}],"speech_gaps":[],"frame":"../frames/v014/010.webp","frame_time":1499.35},{"title":"牛顿法与高阶导数","segments":[{"id":64,"text":"or, you know, banded or sparse. And we'll talk about all that later, right? But so what it says is, so, I mean, one way to say it is computing a Newton step is basically linear algebra. We, you know, a fair amount of linear algebra by now, you know, at least the beginnings of it.","zh":"或者，你也知道，是带状或稀疏的。我们之后会讨论所有这些内容，对吧？但总而言之，它说的是，换句话说，计算牛顿步基本上就是线性代数。到目前为止，我们已经掌握了不少线性代数的内容，至少是它的初步部分。","start":1656.67,"end":1675.53},{"id":65,"text":"And it says it's just linear algebra. So we've kind of reduced solving a problem when you're doing Newton's method to a sequence of problems. In each step, you use linear algebra. Everybody, that's kind of cool. Okay, let's get back to it. Okay, so we established that Newton's method works shockingly well for quadratic functions. So what's really going to affect Newton's method, actually, is...","zh":"它说这仅仅是线性代数。因此，我们实际上将使用牛顿法解决问题简化为一系列问题。在每一步中，你都使用线性代数。大家觉得这有点酷，对吧？好的，让我们回到主题。好的，我们已经确认牛顿法在二次函数上表现得惊人地好。那么，实际上真正影响牛顿法效果的是……","start":1676.03,"end":1701.51},{"id":66,"text":"how well, remember how this all went. It all went this way. You wanted to use the metric,","zh":"还记得这一切是如何进行的吗？一切都是这样进行的。你想要使用度量，","start":1701.94,"end":1706.44},{"id":67,"text":"how well, remember how this all went. It all went this way. You wanted to use the metric,","zh":"还记得这一切是如何进行的吗？一切都是这样进行的。你想要使用度量，","start":1706.52,"end":1714.34},{"id":68,"text":"which was the Hessian at the solution, right? Instead, you use the Hessian where you are,","zh":"即在解处的Hessian矩阵，对吧？相反，你使用的是你在当前点处的Hessian矩阵，","start":1714.76,"end":1719.22},{"id":69,"text":"right? And by the way, that also explains why this is going to do really well as you get closer","zh":"对吧？顺便说一句，这也解释了为什么当你越来越接近解时，这种方法会表现得越来越好","start":1719.22,"end":1724.0},{"id":70,"text":"and closer, because that approximation is going to get better and better, okay? So that's what's","zh":"和越来越接近解时，因为这种近似会变得越来越好，对吧？这就是","start":1724.0,"end":1728.5},{"id":71,"text":"going to, that's, so when, you know, when you're in, when you're here, you know, right, when you're","zh":"起作用的部分，也就是说，当你在这里，当你处于这个点时，你知道，对吧，当你处于","start":1728.5,"end":1732.0},{"id":72,"text":"right close to, let's say, if this is a maximum likelihood problem, if you're right close","zh":"接近，比如说，如果这是一个最大似然问题，如果你非常接近参数值","start":1732.0,"end":1738.58},{"id":73,"text":"to the parameters, then the Newton method's going to give you essentially an extremely","zh":"那么牛顿法将在下一步给出一个极其好的参数估计值。大家明白了吗？","start":1738.58,"end":1749.58},{"id":74,"text":"good estimate of the parameter on the next step. Everybody got this? Okay, so what it","zh":"实际上，这取决于三阶导数，如果你仔细思考的话。起作用的是三阶导数，对吧？","start":1749.58,"end":1756.92},{"id":75,"text":"depends on is actually the third derivative, if you think about it carefully. It's the","zh":"因为三阶导数告诉你当你移动时二阶导数变化了多少。这就是三阶导数的含义，对吧？","start":1756.92,"end":1763.54},{"id":76,"text":"third derivative that matters, right? Because the third derivative tells you how much the second","zh":"如果一个函数的三阶导数很小，那么我们的直觉是牛顿法应该能够很好地实现你真正想要做的","start":1763.54,"end":1769.04},{"id":77,"text":"derivative changes when you move. That's what the third derivative is, right? So if the third","zh":"也就是使用","start":1769.04,"end":1773.12},{"id":78,"text":"derivative of a function is small, then our intuition is that Newton's method should work","zh":"牛顿法应该能够很好地实现你真正想要做的","start":1773.12,"end":1778.34},{"id":79,"text":"to what you really wanted to do, which was to use","zh":"与你真正想要做的，即使用","start":1778.34,"end":1780.64},{"id":80,"text":"change coordinates, or however you use a metric which was aligned with the Hessian, defined by the Hessian at the optimum, you'd say, but you're not at the optimum. Yeah, but the Hessian changes very slowly. So, I mean, there's not more to what I'm saying. This is not deep. Everybody got this? So, and you know, here's an extreme case of a third derivative being small. It's zero. What does it mean if a third derivative is zero?","zh":"改变坐标系，或者无论你如何使用与Hessian对齐的度量，该度量由最优解处的Hessian定义，你可以说，但你并不在最优解处。是的，但Hessian变化非常缓慢。我的意思是我没有更多要说的了。这不是一个深刻的观点。大家明白了吗？而且，你知道，这里有一个三阶导数很小的极端情况。它是零。如果三阶导数为零意味着什么？","start":1781.34,"end":1804.3},{"id":81,"text":"change coordinates, or however you use a metric which was aligned with the Hessian, defined by the Hessian at the optimum, you'd say, but you're not at the optimum. Yeah, but the Hessian changes very slowly. So, I mean, there's not more to what I'm saying. This is not deep. Everybody got this? So, and you know, here's an extreme case of a third derivative being small. It's zero. What does it mean if a third derivative is zero?","zh":"改变坐标系，或者无论你如何使用与Hessian对齐的度量，该度量由最优解处的Hessian定义，你可以说，但你并不在最优解处。是的，但Hessian变化非常缓慢。我的意思是我没有更多要说的了。这不是一个深刻的观点。大家明白了吗？而且，你知道，这里有一个三阶导数很小的极端情况。它是零。如果三阶导数为零意味着什么？","start":1805.26,"end":1828.05}],"notes":["本段讨论了牛顿法
