<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 14</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">14 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 14 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v014","title":"14 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 14","course":"凸优化","pages":[{"title":"梯度下降法与子水平集的条件","segments":[{"id":0,"text":"We'll jump in and we'll continue where we are last time. And weirdly, this picture tells you kind of everything. This gives you all the insight you need to know. It's just like weird and hilarious. Whoops. Let me fix this. Yeah, so."},{"id":1,"text":"You know, here we're just minimizing a quadratic. We know exactly what the minimum is. It's just x equals zero, right? So we just try something like, you know, this steepest, here we're using gradient descent, right? And you can actually, it's just simple enough. You can actually work out what the iterations are. And what you'll find, I mean, you have a formula for it, but the picture is basically this. This shows you, these curves show you the level sets."},{"id":2,"text":"What you can see pretty clearly, you're beginning to see it already here, is if the level sets are poorly conditioned, meaning they're anisotropic. Isotropic means you're kind of the same in all directions. Anisotropic means you're not the same. You're different in different directions. So if your curvature is different in different directions, right? Or another way to say it, if your sublevel sets are not nearly spherical, then gradient descent works..."},{"id":3,"text":"quite poorly. And you can see why it does this kind of weird zigzagging. And then the flip side of this is how well does gradient descent do when the sublevel sets are actually literally spherical or balls, Euclidean balls. And here the answer is it's just one step. So takeaway message is that the efficiency or speed of"},{"id":4,"text":"the efficiency or speed of gradient descent is going to depend on how aspherical or anisotropic the sublevel sets are. And here was just an example to show, you know, it works. I mean, it's an example in two dimensions. It's kind of silly. You know, just to show that you are getting zigzagging or something like that. And I think we looked at this last time. And now it comes to..."},{"id":5,"text":"So the conclusion is, depending on the problem, if your sublevel sets are very well conditioned or spherical or symmetric or however you want to say it, or isotropic or something like that, then gradient descent is fine. So what this hints, though, is that there's something strange about it. It's actually a bit weird, right? Because when you think about it, why would you not use the..."}],"notes":["本段讨论了梯度下降法在不同子水平集条件下的表现。当子水平集是各向同性（isotropic）时，即形状接近球体，梯度下降法表现良好，只需一步即可收敛。而当子水平集是各向异性（anisotropic）时，即形状不规则，梯度下降法会表现出锯齿状的收敛路径，效率较低。","讲者指出，子水平集的条件（conditioning）决定了梯度下降法的效率。各向同性意味着在所有方向上具有相同的曲率，而各向异性则意味着不同方向上的曲率不同，导致梯度下降法在优化过程中出现不稳定的收敛行为。","讲者通过二维示例说明了梯度下降法在各向异性子水平集上的锯齿状收敛现象，并指出这种现象是由于不同方向上的曲率差异导致的。同时，讲者提到这种现象在之前已经讨论过。","讲者强调，梯度下降法的效率与子水平集的形状密切相关。当子水平集接近球体时，梯度下降法表现良好，而当子水平集形状不规则时，梯度下降法的收敛速度会显著下降。","讲者最后指出，梯度下降法在各向同性子水平集上的表现似乎有些奇怪，因为为什么在这些情况下不使用更高效的优化方法。这暗示了梯度下降法在某些情况下可能不是最优选择。","讲者通过对比各向同性和各向异性子水平集的收敛行为，强调了子水平集的条件对优化算法性能的影响，并指出梯度下降法在不同条件下的表现差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4.75,"end":160.49,"asr_flags":[],"raw_segments":[{"start":4.75,"text":"We'll jump in and we'll continue where we are last time. And weirdly, this picture tells you kind of everything. This gives you all the insight you need to know. It's just like weird and hilarious. Whoops. Let me fix this. Yeah, so."},{"start":25.15,"text":"You know, here we're just minimizing a quadratic. We know exactly what the minimum is. It's just x equals zero, right? So we just try something like, you know, this steepest, here we're using gradient descent, right? And you can actually, it's just simple enough. You can actually work out what the iterations are. And what you'll find, I mean, you have a formula for it, but the picture is basically this. This shows you, these curves show you the level sets."},{"start":50.56,"text":"What you can see pretty clearly, you're beginning to see it already here, is if the level sets are poorly conditioned, meaning they're anisotropic. Isotropic means you're kind of the same in all directions. Anisotropic means you're not the same. You're different in different directions. So if your curvature is different in different directions, right? Or another way to say it, if your sublevel sets are not nearly spherical, then gradient descent works..."},{"start":77.03,"text":"quite poorly. And you can see why it does this kind of weird zigzagging. And then the flip side of this is how well does gradient descent do when the sublevel sets are actually literally spherical or balls, Euclidean balls. And here the answer is it's just one step. So takeaway message is that the efficiency or speed of"},{"start":102.57,"text":"the efficiency or speed of gradient descent is going to depend on how aspherical or anisotropic the sublevel sets are. And here was just an example to show, you know, it works. I mean, it's an example in two dimensions. It's kind of silly. You know, just to show that you are getting zigzagging or something like that. And I think we looked at this last time. And now it comes to..."},{"start":131.93,"text":"So the conclusion is, depending on the problem, if your sublevel sets are very well conditioned or spherical or symmetric or however you want to say it, or isotropic or something like that, then gradient descent is fine. So what this hints, though, is that there's something strange about it. It's actually a bit weird, right? Because when you think about it, why would you not use the..."}],"speech_gaps":[],"frame":"../frames/v014/001.webp","frame_time":16.75},{"title":"梯度下降方向与度量的选择","segments":[{"id":6,"text":"gradient, the negative gradient as your descent direction, right? It just, something seems very weird about it because you arrive at a point and then you'd say, hey, if I was to move a small amount in any direction, which would be the direction where my objective would go down the fastest, right? And it seems like you'd be an idiot to take anything other than that direction. And so we had said, well, it's the negative gradient. When you analyze that statement further, it turns out that depends on the metric you're using."},{"id":7,"text":"right so that's actually the so it actually depends on the norm you use and so the way you think of that one way to do this in a kind of a principled way is to say well you know the amount if you go in a small direction v then the amount f is going to decrease is about equal to the gradient"},{"id":8,"text":"of F transpose V. You want that negative, right? So then you'd think, well, okay, take V equals minus the gradient. That's an obvious choice. You can't just say choose V to minimize grad F of X transpose V. You can't do that because it's unbounded below. It's silly, right?"},{"id":9,"text":"And here's where the metric comes in. You have to give a norm to limit that. You have to say, no, I want the norm of v to be, let's say, equal to one or less than or equal to one. It would be the same thing, right? So you do that. And here, notice that this norm up here on v is a general norm. It is not the two norm, necessarily. It's just a general norm. So this is referred to as the steepest descent direction, right? And it's going to depend on the norm."},{"id":10,"text":"And then you can un-normalize it. It's actually convenient to normalize it by the dual norm of the gradient. And then you get something that looks like that. So the steepest descent method is basically specified by a norm. You give a norm. So once you give a norm, then the steepest descent..."},{"id":11,"text":"method is completely specified because that's the direction you're going to use, right? And you get the convergence is similar to this descent. But we'll look at some examples to kind of understand this. So the first one is, if you just, what is steepest descent in the Euclidean norm? It's precisely gradient descent, right? Yeah."},{"id":12,"text":"Why do you normalize it by the dual norm of the gradient? You actually don't have to. There's no reason to normalize it. It's just so that a lot of the equations get simpler if you do the convergence analysis. Yeah, so that's the only reason. Also, that way, like, for example, the steepest descent direction with the L2 norm is literally the negative gradient. Otherwise, it'd be the negative gradient scaled. You know, it'd be a unit vector."}],"notes":["本段讨论了梯度下降方向与度量（norm）之间的关系。讲者指出，梯度下降方向的选择依赖于所使用的度量，即范数。在没有限制的情况下，选择方向会导致问题，因此需要引入范数来限制方向的范围。","讲者进一步解释了如何通过范数来限制方向，例如将方向的范数限制为1或更小。这种范数可以是任意的，不一定是欧几里得范数。这种方向被称为最陡下降方向（steepest descent direction），其选择依赖于所使用的范数。","讲者提到，为了简化收敛性分析，通常会将方向归一化为梯度的对偶范数。这种归一化使得后续的数学推导更加简洁，但并非必须。","在L2范数的情况下，最陡下降方向就是负梯度方向。如果使用其他范数，最陡下降方向可能需要对负梯度进行缩放，以确保方向的单位长度。","讲者强调，选择不同的范数会导致不同的最陡下降方向，因此最陡下降方法的定义依赖于所选择的范数。"],"formulas":[{"latex":"v = -\\nabla F(x)","symbols":"v 是梯度下降方向，\nabla F(x) 是函数 F 在点 x 处的梯度","explanation":"该公式正确表达了梯度下降方向为负梯度方向，适用于标准欧几里得范数。","evidence":"of F transpose V. You want that negative, right? So then you'd think, well, okay, take V equals minus the gradient. That's an obvious choice. You can't just say choose V to minimize grad F of X transpose V. You can't do that because it's unbounded below. It's silly, right?"},{"latex":"\\nabla F(x)^T v","symbols":"梯度与方向向量的点积，表示函数在该方向上的变化率","explanation":"该公式正确表达了梯度与方向向量的点积，用于计算函数在该方向上的变化率。","evidence":"right so that's actually the so it actually depends on the norm you use and so the way you think of that one way to do this in a kind of a principled way is to say well you know the amount if you go in a small direction v then the amount f is going to decrease is about equal to the gradient"}],"uncertainties":[],"diagram":"none","start":161.55,"end":327.74,"asr_flags":[],"math_clarifications":["公式 0 的表述不严谨，'decreases by' 无法准确表达函数值的变化量，应使用更精确的数学表达式，如 f(x + v) - f(x) ≈ ∇F(x)^T v。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":161.55,"text":"gradient, the negative gradient as your descent direction, right? It just, something seems very weird about it because you arrive at a point and then you'd say, hey, if I was to move a small amount in any direction, which would be the direction where my objective would go down the fastest, right? And it seems like you'd be an idiot to take anything other than that direction. And so we had said, well, it's the negative gradient. When you analyze that statement further, it turns out that depends on the metric you're using."},{"start":188.8,"text":"right so that's actually the so it actually depends on the norm you use and so the way you think of that one way to do this in a kind of a principled way is to say well you know the amount if you go in a small direction v then the amount f is going to decrease is about equal to the gradient"},{"start":208.31,"text":"of F transpose V. You want that negative, right? So then you'd think, well, okay, take V equals minus the gradient. That's an obvious choice. You can't just say choose V to minimize grad F of X transpose V. You can't do that because it's unbounded below. It's silly, right?"},{"start":228.71,"text":"And here's where the metric comes in. You have to give a norm to limit that. You have to say, no, I want the norm of v to be, let's say, equal to one or less than or equal to one. It would be the same thing, right? So you do that. And here, notice that this norm up here on v is a general norm. It is not the two norm, necessarily. It's just a general norm. So this is referred to as the steepest descent direction, right? And it's going to depend on the norm."},{"start":257.99,"text":"And then you can un-normalize it. It's actually convenient to normalize it by the dual norm of the gradient. And then you get something that looks like that. So the steepest descent method is basically specified by a norm. You give a norm. So once you give a norm, then the steepest descent..."},{"start":279.1,"text":"method is completely specified because that's the direction you're going to use, right? And you get the convergence is similar to this descent. But we'll look at some examples to kind of understand this. So the first one is, if you just, what is steepest descent in the Euclidean norm? It's precisely gradient descent, right? Yeah."},{"start":302.26,"text":"Why do you normalize it by the dual norm of the gradient? You actually don't have to. There's no reason to normalize it. It's just so that a lot of the equations get simpler if you do the convergence analysis. Yeah, so that's the only reason. Also, that way, like, for example, the steepest descent direction with the L2 norm is literally the negative gradient. Otherwise, it'd be the negative gradient scaled. You know, it'd be a unit vector."}],"speech_gaps":[],"frame":"../frames/v014/002.webp","frame_time":173.55},{"title":"梯度方向与范数的关系","segments":[{"id":13,"text":"It's actually, it'd be the negative gradient divided by the norm of the gradient, right? So unit vector. So if you use a quadratic norm, so quadratic norm is you take a quadratic form with a positive definite matrix, take the square root, that's a quadratic norm. And here's an example of a, I guess this is a unit ball in a quadratic norm, which is an ellipsoid. And then it says, here's the negative gradient."},{"id":14,"text":"And it says you should minimize the inner product of, or sorry, you should, yeah, you should minimize the inner product of a point in this set with the negative, or I guess minimize it with the gradient, which means maximize the inner product with the negative gradient."},{"id":15,"text":"that are going to be, this is the outward normal. They look like, these are the level curves. And it says you want to go as far as you can this way. And you end up here, right? And so this is in fact, this is going to be the steepest descent direction in the norm where this is the unit ball we're showing you, okay?"},{"id":16,"text":"Now, you can work things out like, you're never going to, so actually it does change the direction. It's very weird. It changes the direction. Never, never rotates it more than 90 degrees. It cannot, obviously, because then you wouldn't have a, you'd have a positive inner product with the gradient."},{"id":17,"text":"So this is it. So the real answer is it says that when you stop and you ask for directions and you say what direction would be the direction where you go downhill the fastest, the person should ask you, yeah, in what norm? Because what you select as a norm is going to change the directions they give you. And you can see that it distorts the directions."},{"id":18,"text":"It's actually super interesting, like if you do the L1 norm, what you'll work out is actually also a very kind of simple thing. If you take the inner product of a gradient with a vector whose L1 norm is less than one, you want to minimize that. What you will do is you will find the entry, the axis, along with where the partial derivative or entry of the gradient is most negative."},{"id":19,"text":"Right. And then you'll go. Sorry. Yeah. You find the largest one and then go in, obviously, the direction, the decreasing direction. Right. And so that's actually got it. That's a named method from the like 40s and 50s. And it basically I mean, that that one has got a very simple story to it. You stop where you are and you say then you then you ask not which direction is the steepest direction to go down. I mean, you can it's in the L1. But what you really ask is you ask if I go along axis one."}],"notes":["本段讲授了梯度方向与范数之间的关系，指出在不同范数下，最陡下降方向会有所不同。讲者提到，当使用二次范数时，最陡下降方向是负梯度方向除以梯度的范数，即单位向量。同时，讲者指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。","讲者通过椭球体（二次范数的单位球）和水平曲线（等值线）来形象化说明最陡下降方向的概念。讲者强调，最陡下降方向取决于所选的范数，不同的范数会导致不同的方向选择。","讲者指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。这是因为L1范数的单位球是菱形，其最陡下降方向与梯度的分量有关。","讲者提到，最陡下降方向的计算需要考虑所选的范数，这会影响方向的选择。讲者还指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。","讲者通过举例说明，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。这是因为L1范数的单位球是菱形，其最陡下降方向与梯度的分量有关。","讲者指出，最陡下降方向的计算需要考虑所选的范数，这会影响方向的选择。讲者还指出，当使用L1范数时，最陡下降方向是梯度中绝对值最大的分量对应的轴方向。"],"formulas":[],"uncertainties":[],"diagram":"none","start":328.31,"end":502.06,"asr_flags":[],"math_clarifications":["所有公式均重复且未提供新的数学内容，无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":328.31,"text":"It's actually, it'd be the negative gradient divided by the norm of the gradient, right? So unit vector. So if you use a quadratic norm, so quadratic norm is you take a quadratic form with a positive definite matrix, take the square root, that's a quadratic norm. And here's an example of a, I guess this is a unit ball in a quadratic norm, which is an ellipsoid. And then it says, here's the negative gradient."},{"start":355.67,"text":"And it says you should minimize the inner product of, or sorry, you should, yeah, you should minimize the inner product of a point in this set with the negative, or I guess minimize it with the gradient, which means maximize the inner product with the negative gradient. So basically it says, these are the, these are the sublub, the hyperplanes that are,"},{"start":377.85,"text":"that are going to be, this is the outward normal. They look like, these are the level curves. And it says you want to go as far as you can this way. And you end up here, right? And so this is in fact, this is going to be the steepest descent direction in the norm where this is the unit ball we're showing you, okay?"},{"start":399.76,"text":"Now, you can work things out like, you're never going to, so actually it does change the direction. It's very weird. It changes the direction. Never, never rotates it more than 90 degrees. It cannot, obviously, because then you wouldn't have a, you'd have a positive inner product with the gradient."},{"start":418.2,"text":"So this is it. So the real answer is it says that when you stop and you ask for directions and you say what direction would be the direction where you go downhill the fastest, the person should ask you, yeah, in what norm? Because what you select as a norm is going to change the directions they give you. And you can see that it distorts the directions."},{"start":445.73,"text":"It's actually super interesting, like if you do the L1 norm, what you'll work out is actually also a very kind of simple thing. If you take the inner product of a gradient with a vector whose L1 norm is less than one, you want to minimize that. What you will do is you will find the entry, the axis, along with where the partial derivative or entry of the gradient is most negative."},{"start":473.16,"text":"Right. And then you'll go. Sorry. Yeah. You find the largest one and then go in, obviously, the direction, the decreasing direction. Right. And so that's actually got it. That's a named method from the like 40s and 50s. And it basically I mean, that that one has got a very simple story to it. You stop where you are and you say then you then you ask not which direction is the steepest direction to go down. I mean, you can it's in the L1. But what you really ask is you ask if I go along axis one."}],"speech_gaps":[],"frame":"../frames/v014/003.webp","frame_time":340.31},{"title":"梯度下降法与度量选择","segments":[{"id":20,"text":"how much am I going to go down? If I go along axis two, how much is it going to go down? And you find the one where you're going to go down the most, and then you simply go along the axis. So that's a so-called axis-aligned step, people would call it. Okay. And again, you know, the picture shows how you actually get a different direction. Okay."},{"id":21,"text":"The choice of the metric or the norm for steepest descent is going to make a big difference, right? And here's just this baby example again, where the first one shows you steepest descent with a norm whose unit ball looks like this. And I don't know, you just eyeball it, you can see this, you know, some number of iterations. And here we take steepest descent in using a norm where the unit ball is like skewed this way."},{"id":22,"text":"And what you see is that has exacerbated the convergence horribly, right? And so what this tells us is kind of the, it tells you kind of the obvious thing. It says that if you, what you really want is you want a norm or a metric or something like that, that's kind of aligned with the sublevel sets of your function."},{"id":23,"text":"In other words, it's one which kind of has roughly the same shape. So this is just a very simple example to show this. I'm just pretending that this function looks kind of fatter than it does look tall. And so over here, this use of norm, this selection of norm actually improves the convergence. This one exacerbates it. Does this make sense?"},{"id":24,"text":"These are just sort of ideas, but it's the essence of where we're going. Because now we go to the, if you keep going with this logic, you end up at something called the Newton step. So the Newton step, you actually will use, what you'll do, is you take the Hessian of the second derivative of the function at the current point."},{"id":25,"text":"and you then use that as your metric, right? And so the argument now makes perfect sense, right? Because if I said, if you say, okay, I accept the idea that I should choose, let's say, a metric that captures the shape of my function, right? That's what I should do, right? Actually, let's have a discussion about smooth functions near their minimum. Let's have that discussion just for fun. What do smooth functions look like? Smooth convex functions look like near their minimum. What do they look like?"},{"id":26,"text":"They're just quadratic."}],"notes":["本段讲授了梯度下降法中度量选择的重要性，通过一个简单的例子说明了不同度量对收敛速度的影响。讲者指出，选择与函数的子水平集形状一致的度量可以显著改善收敛效果，而选择不一致的度量则会恶化收敛。"],"formulas":[],"uncertainties":[],"diagram":"none","start":502.92,"end":668.16,"asr_flags":[],"math_clarifications":["原始片段中提到的Hessian矩阵（H(x)）在数学上是函数的二阶导数矩阵，通常用于牛顿法中。然而，由于原始片段中没有明确给出H(x)的定义或使用场景，因此无法确定其数学类型和适用条件。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":502.92,"text":"how much am I going to go down? If I go along axis two, how much is it going to go down? And you find the one where you're going to go down the most, and then you simply go along the axis. So that's a so-called axis-aligned step, people would call it. Okay. And again, you know, the picture shows how you actually get a different direction. Okay."},{"start":525.34,"text":"The choice of the metric or the norm for steepest descent is going to make a big difference, right? And here's just this baby example again, where the first one shows you steepest descent with a norm whose unit ball looks like this. And I don't know, you just eyeball it, you can see this, you know, some number of iterations. And here we take steepest descent in using a norm where the unit ball is like skewed this way."},{"start":553.47,"text":"And what you see is that has exacerbated the convergence horribly, right? And so what this tells us is kind of the, it tells you kind of the obvious thing. It says that if you, what you really want is you want a norm or a metric or something like that, that's kind of aligned with the sublevel sets of your function."},{"start":577.99,"text":"In other words, it's one which kind of has roughly the same shape. So this is just a very simple example to show this. I'm just pretending that this function looks kind of fatter than it does look tall. And so over here, this use of norm, this selection of norm actually improves the convergence. This one exacerbates it. Does this make sense?"},{"start":605.31,"text":"These are just sort of ideas, but it's the essence of where we're going. Because now we go to the, if you keep going with this logic, you end up at something called the Newton step. So the Newton step, you actually will use, what you'll do, is you take the Hessian of the second derivative of the function at the current point."},{"start":635.63,"text":"and you then use that as your metric, right? And so the argument now makes perfect sense, right? Because if I said, if you say, okay, I accept the idea that I should choose, let's say, a metric that captures the shape of my function, right? That's what I should do, right? Actually, let's have a discussion about smooth functions near their minimum. Let's have that discussion just for fun. What do smooth functions look like? Smooth convex functions look like near their minimum. What do they look like?"},{"start":667.3,"text":"They're just quadratic."}],"speech_gaps":[],"frame":"../frames/v014/004.webp","frame_time":514.9200000000001},{"title":"凸函数的等高线与Hessian矩阵","segments":[{"id":27,"text":"And they're quadratic with what's the Hessian there? I mean, well, look at that. Gives it away. That's the Hessian. The sub-level sets, right? If this is a smooth convex function, that's the minimizer. And then I say, what do the level sets look like? They look like this. Now, these are not exactly ellipsoids. I mean, unless the function is exactly quadratic. But this is what they look like, right? I mean, eventually they start looking not like ellipsoids. They start looking like that, right?"},{"id":28,"text":"because who knows, right? But down near the minimum, they look really very much like ellipsoids, right? And the shape of the ellipsoid is determined by the Hessian of the function at this point, okay? So this is, and by the way, if you're in statistics or if you're not in statistics but know some statistics, you'd recognize this immediately. If you look at the negative log likelihood,"},{"id":29,"text":"that's going to be, this is going to be, and this is in your parameter space, this point is going to be your maximum likelihood or minimum negative log likelihood point. And then if I ask you, well tell me about models that have a likelihood almost as high as my maximum likelihood. Everybody following this? Then basically I'm looking at, I'm looking exactly at level curves that are very close to the maximum likelihood."},{"id":30,"text":"I pull down from the maximum likelihood, and I get sets. Now, these are parameters and models that fit the data you've seen, right? What do they look like? Well, if the loss, if the negative log likelihood is convex and smooth, right, then they look, they're approximately ellipsoidal. And so, actually, and the ellipsoid is determined by the Hessian of the log likelihood at the maximum likelihood point."},{"id":31,"text":"which is, of course, the Fisher information. Everybody got that? And so this tells you very good ways to get sets of model parameters which give you almost the maximum likelihood on the data you've seen. So, okay, this is, again, if you know about this, fine, and if you don't, that's okay, too, right? So I'm just saying that this idea is kind of like everywhere. Okay, so now we connect it back to this conversation and said, here's what you should do. You should use steepest descent."},{"id":32,"text":"But what you should do is you need to get a metric that kind of looks like the curvature of your function, right? So this would be a stunningly good method. Ready for my method? It says do steepest descent. And someone says, yeah, which quadratic norm are you going to use? Which P? And I would say, oh, the Hessian of your function at the optimum. Everybody follow this? Boy, would that work well. Everybody."}],"notes":["本段讲解了凸函数的等高线形状及其与Hessian矩阵的关系。当函数是光滑凸函数时，其等高线在最小值附近近似为椭球体，椭球体的形状由函数在该点的Hessian矩阵决定。这在统计学中尤为重要，因为负对数似然函数的等高线在最大似然点附近也呈现椭球体形状，且其形状由Hessian矩阵（即Fisher信息矩阵）决定。","讲者指出，当负对数似然函数是凸且光滑时，其等高线近似为椭球体，这为参数估计提供了直观的几何解释。椭球体的形状由对数似然函数在最大似然点处的Hessian矩阵决定，这与Fisher信息矩阵密切相关。","讲者进一步说明，使用最陡下降法进行优化时，应选择与函数曲率相关的度量（即Hessian矩阵），以提高收敛速度。这种方法在优化问题中非常有效，尤其是在函数具有明显曲率特征的情况下。","讲者强调，Hessian矩阵在凸优化中具有重要作用，不仅决定了等高线的形状，还影响了优化算法的选择和性能。因此，理解Hessian矩阵的性质对于设计高效的优化方法至关重要。","讲者通过统计学中的最大似然估计作为例子，说明了Hessian矩阵在实际问题中的应用。这表明，Hessian矩阵不仅是理论分析的重要工具，也是实际建模和优化中的关键要素。","最后，讲者指出，选择与Hessian矩阵相关的度量（如二次范数）可以显著提升最陡下降法的性能，这为实际优化问题提供了重要的指导原则。"],"formulas":[{"latex":"H(x)","symbols":"Hessian矩阵","explanation":"H(x)表示函数在点x处的Hessian矩阵，用于描述函数的曲率。","evidence":"because who knows, right? But down near the minimum, they look really very much like ellipsoids, right? And the shape of the ellipsoid is determined by the Hessian of the function at this point, okay? So this is, and by the way, if you're in statistics or if you're not in statistics but know some statistics, you'd recognize this immediately. If you look at the negative log likelihood,"},{"latex":"Fisher information","symbols":"Fisher信息矩阵","explanation":"Fisher信息矩阵是负对数似然函数在最大似然点处的Hessian矩阵，用于描述参数估计的不确定性。","evidence":"which is, of course, the Fisher information. Everybody got that? And so this tells you very good ways to get sets of model parameters which give you almost the maximum likelihood on the data you've seen. So, okay, this is, again, if you know about this, fine, and if you don't, that's okay, too, right? So I'm just saying that this idea is kind of like everywhere. Okay, so now we connect it back to this conversation and said, here's what you should do. You should use steepest descent."}],"uncertainties":[],"diagram":"none","start":668.96,"end":835.96,"asr_flags":[],"math_clarifications":["Hessian矩阵用于描述函数的曲率，而Fisher信息矩阵是负对数似然函数在最大似然点处的Hessian矩阵，用于描述参数估计的不确定性。"],"raw_segments":[{"start":668.96,"text":"And they're quadratic with what's the Hessian there? I mean, well, look at that. Gives it away. That's the Hessian. The sub-level sets, right? If this is a smooth convex function, that's the minimizer. And then I say, what do the level sets look like? They look like this. Now, these are not exactly ellipsoids. I mean, unless the function is exactly quadratic. But this is what they look like, right? I mean, eventually they start looking not like ellipsoids. They start looking like that, right?"},{"start":698.18,"text":"because who knows, right? But down near the minimum, they look really very much like ellipsoids, right? And the shape of the ellipsoid is determined by the Hessian of the function at this point, okay? So this is, and by the way, if you're in statistics or if you're not in statistics but know some statistics, you'd recognize this immediately. If you look at the negative log likelihood,"},{"start":721.54,"text":"that's going to be, this is going to be, and this is in your parameter space, this point is going to be your maximum likelihood or minimum negative log likelihood point. And then if I ask you, well tell me about models that have a likelihood almost as high as my maximum likelihood. Everybody following this? Then basically I'm looking at, I'm looking exactly at level curves that are very close to the maximum likelihood."},{"start":747.71,"text":"I pull down from the maximum likelihood, and I get sets. Now, these are parameters and models that fit the data you've seen, right? What do they look like? Well, if the loss, if the negative log likelihood is convex and smooth, right, then they look, they're approximately ellipsoidal. And so, actually, and the ellipsoid is determined by the Hessian of the log likelihood at the maximum likelihood point."},{"start":777.14,"text":"which is, of course, the Fisher information. Everybody got that? And so this tells you very good ways to get sets of model parameters which give you almost the maximum likelihood on s, ways you can think about what the Newton step is. Okay, and lots of other ways to think of it too. So here's another completely beautiful method. It says, let's expand, let's have a second order approximation of our function."},{"id":36,"text":"And that's, of course, just that, nothing but that. And you'd say, all right, let's minimize that. If you form a second-order approximation of a function at a point, minimize it, you get the Newton step. Everybody got that? So that also just makes perfect sense, right? So another way is you could think about the optimality conditions, and that looks like this. So this would be here. Here's a picture of the first one. So here's the function f, right? We're at x here."},{"id":37,"text":"then what i do is i get the second order approximation here this is f hat of f right by the way the first order approximation has to be an underestimator of f the second order we don't know could be above or below you don't know right so okay so here here you are here um here you are uh here uh we get a second order and what what it means to be a second order approximation is that f and f hat right near here"},{"id":38,"text":"are extremely close which is my way of saying close cubed it's small cubed right the the yeah something like that it's really like they agreed a second order here right so it's a super good approximation right here okay so we form that that's this dash thing and you can see over here it's on the wrong side it's on you know it's a lower bound up here it's an upper bound and the minimizer of this is this and so this is the newton step the difference between here and here okay"}],"notes":["本段讲解牛顿法中使用当前点的Hessian矩阵作为最优解处Hessian矩阵的近似，这是牛顿法的核心思想之一。讲者指出，这种方法避免了直接计算最优解处的Hessian矩阵，因为这正是牛顿法想要解决的问题。","讲者进一步解释了牛顿法的另一种理解方式，即通过构造函数的二阶近似来寻找最优解。这种近似在当前点附近非常精确，因此可以作为寻找最优解的依据。","讲者提到，一阶近似必须是函数的下界，而二阶近似则可能高于或低于函数值，因此无法确定其性质。这说明了二阶近似在优化中的不确定性。","讲者通过图像说明了二阶近似与原函数的关系，指出在某些情况下，二阶近似可能成为下界或上界，这取决于具体函数的形状。","讲者强调，牛顿法的每一步都可能改变度量方式，因此被称为变度量方法。这种改变使得牛顿法在不同点处具有不同的搜索方向。","讲者最后指出，牛顿法的每一步都是通过最小化二阶近似来确定的，这与牛顿法的定义一致，即通过求解二阶近似函数的极小值点来更新迭代点。"],"formulas":[],"uncertainties":["close cubed it's small cubed"],"diagram":"none","start":836.46,"end":1009.2,"asr_flags":[],"math_clarifications":["原文中提到的二阶近似未提供具体的数学表达式，如泰勒展开式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":836.46,"text":"Got that, right? That worked unbelievably well. Only minor problem is, someone says, okay, well, what is the Hessian at the optimum? And then the answer would be something like, well, first minimize it, and then I'll tell you the Hessian. Which is kind of like, this is stupid, right? Because that's what I want to do in the first place. Everybody follow this? Okay, so instead, we're going to use, we're simply going to use the Hessian at the current point as the best approximation we can make of the Hessian at the optimal point. Everybody following this?"},{"start":866.63,"text":"That's one way to explain what Newton method is. And if we take the Newton step, and each time we redo it, we're actually changing the metric. And so sometimes people refer to this, this is a variable metric method. Because you're actually changing the metric when you stop and ask for directions and say, hey, what's the fastest way to go down from here?"},{"start":892.5,"text":"And then someone on their toes says, yeah, in what metric? You actually, every time, every step you take, you change it. Okay, so that's the, everybody, I mean, these are just ideas, ways you can think about what the Newton step is. Okay, and lots of other ways to think of it too. So here's another completely beautiful method. It says, let's expand, let's have a second order approximation of our function."},{"start":921.31,"text":"And that's, of course, just that, nothing but that. And you'd say, all right, let's minimize that. If you form a second-order approximation of a function at a point, minimize it, you get the Newton step. Everybody got that? So that also just makes perfect sense, right? So another way is you could think about the optimality conditions, and that looks like this. So this would be here. Here's a picture of the first one. So here's the function f, right? We're at x here."},{"start":951.32,"text":"then what i do is i get the second order approximation here this is f hat of f right by the way the first order approximation has to be an underestimator of f the second order we don't know could be above or below you don't know right so okay so here here you are here um here you are uh here uh we get a second order and what what it means to be a second order approximation is that f and f hat right near here"},{"start":980.62,"text":"are extremely close which is my way of saying close cubed it's small cubed right the the yeah something like that it's really like they agreed a second order here right so it's a super good approximation right here okay so we form that that's this dash thing and you can see over here it's on the wrong side it's on you know it's a lower bound up here it's an upper bound and the minimizer of this is this and so this is the newton step the difference between here and here okay"}],"speech_gaps":[],"frame":"../frames/v014/006.webp","frame_time":848.46},{"title":"牛顿法的几何解释与收敛性","segments":[{"id":39,"text":"Another one is you linearize the optimality condition. And you'd say, you know, I'm at a point x. I want a point where the gradient of f is zero. And you go, cool, then what are you going to do? And you say, well, I'm going to perturb x by v. I'm going to take a step v. But what you'd like is you'd like the gradient of f of x plus v to equal zero."},{"id":40,"text":"But you don't know how to solve that in general. There's one case where you do. We'll get to that in a minute. So you do this. Instead, you'd say, well, you know what? I'll approximate this using calculus. So what this gradient is, if this is the first order expansion of the gradient, is the gradient here, this is going to be the first order thing. It's actually the following. It's the gradient plus the second derivative times the displacement, right? So this is that. And then what you do is you say, okay."},{"id":41,"text":"I don't know what's actually going to happen to the gradient, but this I know, this I get, I can compute these two, and I'll just solve this equation, and that gives us again the Newton step. So does that make sense? I mean, I hate to give, there are even more explanations, but this is just interpretations of what it is. Okay, so that's the Newton step."},{"id":42,"text":"Oh, and here's a picture of the second one in 1D. So actually, Newton would have been quite familiar with this picture, right? So here's the derivative, right? It's increasing because the function is convex, right? So here it is. And what we want to do is we want to find the zero crossing like this. So we want to find that point there. So how do you do that? Well, you're at a point here. And you simply, here, take a linear, I guess you would say, or affine approximation."},{"id":43,"text":"of the derivative at that point, that's this dashed line here, and then wherever that is zero, that's our next point, right? By the way, if I were to do it again, what would happen? So if I went to this point, calculated the first order approximation and looked at the zero of it, what would your next, if I iterated the Newton step twice, I think your eyeball is going to tell you what? Are you going to get a good approximation?"},{"id":44,"text":"Yeah, good. And then if you do it a third time, it's going to be like really, really good, right? Why? Because if I zoom in on a smooth increasing function, right, as it goes through zero, if I zoom in, it just looks like a line. That's all it looks like. The same is true over here, right? If I take this point, fit a quadratic to it and minimize it, but suppose when I get near the bottom here and I fit a quadratic to it,"}],"notes":["本段讲解了牛顿法的几何解释，通过一维情况下的图像说明了牛顿法如何通过在当前点处进行线性或仿射近似来寻找函数的零点。牛顿法利用了函数的一阶导数和二阶导数信息，通过求解线性化后的方程来更新迭代点。","在凸函数的情况下，牛顿法的收敛性较好，因为函数的形状使得每次迭代都能快速接近真实零点。通过多次迭代，牛顿法能够迅速逼近精确解，尤其是在函数接近零点时，其局部行为近似于直线，因此线性近似更加准确。","讲者通过图像说明了牛顿法的迭代过程，指出在每次迭代中，通过在当前点处构造切线（即一阶近似），找到该切线与横轴的交点作为下一个迭代点。这种做法在函数平滑且凸的情况下特别有效。","讲者还提到，如果在函数的底部附近进行二次拟合，牛顿法的收敛速度会更快，因为二次拟合能够更好地捕捉函数的曲率信息，从而更精确地找到零点。","在讲者提到的图像中，函数是凸的，因此其导数是单调递增的。这种性质保证了牛顿法在迭代过程中不会出现发散的情况，而是能够稳定地收敛到零点。","讲者通过多次迭代的示例说明了牛顿法的收敛性，指出在第三次迭代后，牛顿法的近似解已经非常接近真实解，这体现了牛顿法在凸优化问题中的高效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1010.26,"end":1171.27,"asr_flags":[],"math_clarifications":["原文未提供足够的数学信息来支持这些公式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1010.26,"text":"Another one is you linearize the optimality condition. And you'd say, you know, I'm at a point x. I want a point where the gradient of f is zero. And you go, cool, then what are you going to do? And you say, well, I'm going to perturb x by v. I'm going to take a step v. But what you'd like is you'd like the gradient of f of x plus v to equal zero."},{"start":1032.4,"text":"But you don't know how to solve that in general. There's one case where you do. We'll get to that in a minute. So you do this. Instead, you'd say, well, you know what? I'll approximate this using calculus. So what this gradient is, if this is the first order expansion of the gradient, is the gradient here, this is going to be the first order thing. It's actually the following. It's the gradient plus the second derivative times the displacement, right? So this is that. And then what you do is you say, okay."},{"start":1059.47,"text":"I don't know what's actually going to happen to the gradient, but this I know, this I get, I can compute these two, and I'll just solve this equation, and that gives us again the Newton step. So does that make sense? I mean, I hate to give, there are even more explanations, but this is just interpretations of what it is. Okay, so that's the Newton step."},{"start":1084.57,"text":"Oh, and here's a picture of the second one in 1D. So actually, Newton would have been quite familiar with this picture, right? So here's the derivative, right? It's increasing because the function is convex, right? So here it is. And what we want to do is we want to find the zero crossing like this. So we want to find that point there. So how do you do that? Well, you're at a point here. And you simply, here, take a linear, I guess you would say, or affine approximation."},{"start":1114.43,"text":"of the derivative at that point, that's this dashed line here, and then wherever that is zero, that's our next point, right? By the way, if I were to do it again, what would happen? So if I went to this point, calculated the first order approximation and looked at the zero of it, what would your next, if I iterated the Newton step twice, I think your eyeball is going to tell you what? Are you going to get a good approximation?"},{"start":1145.45,"text":"Yeah, good. And then if you do it a third time, it's going to be like really, really good, right? Why? Because if I zoom in on a smooth increasing function, right, as it goes through zero, if I zoom in, it just looks like a line. That's all it looks like. The same is true over here, right? If I take this point, fit a quadratic to it and minimize it, but suppose when I get near the bottom here and I fit a quadratic to it,"}],"speech_gaps":[],"frame":"../frames/v014/007.webp","frame_time":1022.26},{"title":"牛顿方法与Hessian度量","segments":[{"id":45,"text":"How good an approximation is the quadratic nearby? It's really good, right? And so all of this is giving you kind of this intuition that this method should have some amazingly good terminal convergence, right? Which we'll get to in a minute, okay? And it's all true. Okay. And here's another very cool way to do it."},{"id":46,"text":"It turns out it's the steepest descent direction in the metric given by the Hessian. And that makes total sense, right? Because, you know, again, you land at X, you ask someone, hey, what's the steepest way down the mountain or whatever? And then they ask you, in what norm or what metric? And you say..."},{"id":47,"text":"well, do you happen to know the Hessian of the function at the minimizer down at the bottom of the valley? And they'll say, no, I don't. I just live here, right? Or something like that, right? Then they'd say, fine, do you know the Hessian at the current point? And they would say, oh, that I do know. Okay, you go, fine, we'll use that. Everybody following this?"},{"id":48,"text":"And that would give you this. So it's very cool. And you can actually plot pictures that shows what a Newton direction is going to look like. And this is an example showing that you're going to get a pretty good Newton step, at least for this thing. So this is the Newton step. Then you have something cool called the Newton decrement. The Newton decrement, you can think of it this way. It's actually..."},{"id":49,"text":"It gives you, it's actually, one very good way to think about it is this. It is actually, it is the predicted decrease when you take a Newton step of the function, predicted by your quadratic model of the function. So that's what it is."},{"id":50,"text":"Oh yeah, it means I'm using a quadratic metric, which is going to be this. Like when someone says, what's your norm? And I'd say, oh, that's easy. I'll take the norm to be this. This is my current point. So here, this is the norm of z. There you go. That's it. Yeah, that's what it means. Right. By the way, if you have other ways to get a rough idea of the shape of your sublevel sets,"}],"notes":["本段讲解了牛顿方法中Hessian矩阵所定义的度量的意义。讲者指出，牛顿方向实际上是基于当前点的Hessian矩阵所定义的最陡下降方向，这种度量方式允许我们使用二次模型来预测函数在牛顿步下的下降量。讲者还提到，这种度量方式类似于使用二次范数，即当前点的Hessian矩阵定义了一个新的范数，用于衡量函数的形状。","讲者通过类比山地地形，解释了Hessian度量的直观意义。当询问如何从山顶最快下山时，回答者会询问使用哪种范数或度量，而讲者则会使用当前点的Hessian矩阵来定义这个度量，从而得到最陡的下降方向。","讲者提到牛顿下降步的预测下降量，即所谓的牛顿减量（Newton decrement），这是基于当前点的二次模型对函数下降量的预测。这种预测有助于判断当前的牛顿步是否足够有效。","讲者还提到，如果使用其他方法来估计子水平集的形状，也可以作为补充手段。这表明在实际应用中，Hessian度量并不是唯一的度量方式，但它是牛顿方法中一个重要的组成部分。","讲者强调了Hessian度量在牛顿方法中的核心作用，即通过当前点的Hessian矩阵来定义一个局部的二次度量，从而更准确地捕捉函数的局部几何特性。","讲者通过提问的方式，引导学生思考Hessian度量的定义及其在牛顿方法中的应用，这有助于加深学生对这一概念的理解。"],"formulas":[],"uncertainties":["It gives you, it's actually, one very good way to think about it is this. It is actually, it is the predicted decrease when you take a Newton step of the function, predicted by your quadratic model of the function. So that's what it is."],"diagram":"none","start":1171.76,"end":1327.48,"asr_flags":[],"math_clarifications":["公式未提供完整的数学表达式，无法核对其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1171.76,"text":"How good an approximation is the quadratic nearby? It's really good, right? And so all of this is giving you kind of this intuition that this method should have some amazingly good terminal convergence, right? Which we'll get to in a minute, okay? And it's all true. Okay. And here's another very cool way to do it."},{"start":1201.67,"text":"It turns out it's the steepest descent direction in the metric given by the Hessian. And that makes total sense, right? Because, you know, again, you land at X, you ask someone, hey, what's the steepest way down the mountain or whatever? And then they ask you, in what norm or what metric? And you say..."},{"start":1225.86,"text":"well, do you happen to know the Hessian of the function at the minimizer down at the bottom of the valley? And they'll say, no, I don't. I just live here, right? Or something like that, right? Then they'd say, fine, do you know the Hessian at the current point? And they would say, oh, that I do know. Okay, you go, fine, we'll use that. Everybody following this?"},{"start":1246.91,"text":"And that would give you this. So it's very cool. And you can actually plot pictures that shows what a Newton direction is going to look like. And this is an example showing that you're going to get a pretty good Newton step, at least for this thing. So this is the Newton step. Then you have something cool called the Newton decrement. The Newton decrement, you can think of it this way. It's actually..."},{"start":1274.54,"text":"It gives you, it's actually, one very good way to think about it is this. It is actually, it is the predicted decrease when you take a Newton step of the function, predicted by your quadratic model of the function. So that's what it is. Yeah, you have a question? What the metric defined by the Hessian means?"},{"start":1295.55,"text":"Oh yeah, it means I'm using a quadratic metric, which is going to be this. Like when someone says, what's your norm? And I'd say, oh, that's easy. I'll take the norm to be this. This is my current point. So here, this is the norm of z. There you go. That's it. Yeah, that's what it means. Right. By the way, if you have other ways to get a rough idea of the shape of your sublevel sets,"}],"speech_gaps":[],"frame":"../frames/v014/008.webp","frame_time":1183.76},{"title":"凸优化中的仿射不变性与牛顿法","segments":[{"id":51,"text":"Like, by all means, use it. I mean, there's lots of other ways you might be able to, you know, there are plenty of cases where you might have some other, to get another estimate, which is not the Hessian or something like that, to get this, right? So, okay. All right. So one thing that's very cool about this metric is that it turns out it's lots of things, but one thing that's very important is it's actually affine invariant. So that's actually going to be a big, important theme."},{"id":52,"text":"So if I change coordinates, if I apply an affine transform to my problem and solve that, by the way, if you do that with Newton, with gradient method, that's actually completely equivalent to using steepest descent with a different quadratic norm, right? So you can even think of steepest descent as two steps. With a quadratic norm, it's two steps. Step one."},{"id":53,"text":"Change core, apply a matrix so that your unit ball becomes just a Euclidean ball. Another way to say it is, actually some people use a great verb for that, which is you round the problem."},{"id":54,"text":"Which is a great term, right? Because to round it means, you know, if your sub-level sets look like this, and you apply a coordinate transform, and then you just want it to look isotropic. You want the curvature to be about the same in all directions, right? And someone says, why? You'd say, because when the curvature is the same in all directions, gradient method is outstanding, right? Everybody?"},{"id":55,"text":"Got this? So, okay. So, here, if you change coordinates by a linear mapping, this doesn't change. It's the same number, right? So, affine invariance is going to come up later. Okay, now we have Newton's method. So, I mean, it just uses the Newton step."},{"id":56,"text":"So you compute the Newton step and the gradient. You quit if this so-called Newton-Deckerman is small enough. Then you use a backtracking line search, for example, and whatever. And this entire algorithm is affine, is basically independent. It commutes with changes of coordinates, right? So in other words, if someone says, yeah, you know, I'm going to..."},{"id":57,"text":"Instead of minimizing f, I'm going to minimize this f tilde, which multiplies its argument by a non-singular matrix T."}],"notes":["本段讲解了凸优化中仿射不变性的概念，指出在进行坐标变换后，某些优化方法的性质保持不变。例如，牛顿法在进行仿射变换后仍然保持其有效性，这与最速下降法在不同二次范数下的等价性有关。","讲者提到，通过应用一个矩阵变换，可以将单位球变为欧几里得球，这一过程被称为“round the problem”，即使问题变得各向同性，从而使得梯度法在各方向上的曲率一致，从而表现优异。","在进行坐标变换时，某些优化算法的性质保持不变，例如牛顿法的仿射不变性。这意味着，即使在变换后的坐标系中，算法的行为与原坐标系中相同。","讲者指出，当使用牛顿法时，计算牛顿步和梯度，并在牛顿-德克曼（Newton-Deckerman）条件满足时停止。随后使用回溯线搜索等方法进行优化。","最后，讲者提到，可以通过应用一个非奇异矩阵T来变换目标函数，从而在新的坐标系中进行优化，这体现了仿射不变性的应用。","这些内容强调了在凸优化中，仿射不变性是一个重要的性质，它允许在不同坐标系下保持优化方法的有效性，从而提高算法的鲁棒性和适用性。"],"formulas":[],"uncertainties":["Newton-Deckerman"],"diagram":"none","start":1328.12,"end":1485.95,"asr_flags":[],"raw_segments":[{"start":1328.12,"text":"Like, by all means, use it. I mean, there's lots of other ways you might be able to, you know, there are plenty of cases where you might have some other, to get another estimate, which is not the Hessian or something like that, to get this, right? So, okay. All right. So one thing that's very cool about this metric is that it turns out it's lots of things, but one thing that's very important is it's actually affine invariant. So that's actually going to be a big, important theme."},{"start":1357.59,"text":"So if I change coordinates, if I apply an affine transform to my problem and solve that, by the way, if you do that with Newton, with gradient method, that's actually completely equivalent to using steepest descent with a different quadratic norm, right? So you can even think of steepest descent as two steps. With a quadratic norm, it's two steps. Step one."},{"start":1384.13,"text":"Change core, apply a matrix so that your unit ball becomes just a Euclidean ball. Another way to say it is, actually some people use a great verb for that, which is you round the problem."},{"start":1402.33,"text":"Which is a great term, right? Because to round it means, you know, if your sub-level sets look like this, and you apply a coordinate transform, and then you just want it to look isotropic. You want the curvature to be about the same in all directions, right? And someone says, why? You'd say, because when the curvature is the same in all directions, gradient method is outstanding, right? Everybody?"},{"start":1426.25,"text":"Got this? So, okay. So, here, if you change coordinates by a linear mapping, this doesn't change. It's the same number, right? So, affine invariance is going to come up later. Okay, now we have Newton's method. So, I mean, it just uses the Newton step."},{"start":1450.82,"text":"So you compute the Newton step and the gradient. You quit if this so-called Newton-Deckerman is small enough. Then you use a backtracking line search, for example, and whatever. And this entire algorithm is affine, is basically independent. It commutes with changes of coordinates, right? So in other words, if someone says, yeah, you know, I'm going to..."},{"start":1478.25,"text":"Instead of minimizing f, I'm going to minimize this f tilde, which multiplies its argument by a non-singular matrix T."}],"speech_gaps":[],"frame":"../frames/v014/009.webp","frame_time":1340.12},{"title":"牛顿法的不变性与收敛性分析","segments":[{"id":58,"text":"In gradient method, you get completely different iterates and all that. It might be faster, it might be way slower. I don't know. It just depends. But you'll get a completely different thing. Actually, up here, it all goes away. And you can check because when you do this, the gradient gets a T in front of it and then the Hessian gets a T on the left and a T transpose on the right or something like that. And when you assemble everything..."},{"id":59,"text":"it all just goes away so you get the identical steps here right so another way to say this newton's method is independent of changes of coordinate of well linear changes any linear change of coordinates right so that so which is a that's a extremely uh good attribute to have actually in theory it's cool but it's all it's actually super useful in practice right so what it means is to first order scaling doesn't matter"},{"id":60,"text":"for something like a Newton method. It doesn't make any difference at all. I mean, if you were going to do the linear algebra in infinite precision, it literally wouldn't matter at all. Whereas that's completely false for something like a gradient method, right? There, you change coordinates, and if you change coordinates, you either get something faster or actually much more likely slower. Okay, so this is Newton's method."},{"id":61,"text":"So I'm going to give you the classical convergence analysis. So this is actually interesting. This is actually from the Soviet Union around the 1930s. But here it is. It's actually super interesting. Oh, and actually, before we start, I have to ask you a bunch of questions, right? How well does Newton's method work on a quadratic function? Yeah, quite well, right? Yeah, like how well? Like it converges in one step."},{"id":62,"text":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah."},{"id":63,"text":"How, yeah, notice the other thing is that when I ask you to minimize a quadratic convex function, what does that turn into? It's linear algebra. It's nothing else, right? Because the Hessian is affine in the point. So it's just linear algebra. And so therefore, that means I can pull in all the stuff we talked about last week. And we will. We'll do that later. That's another thread. But we'll be talking about what does it mean for a Hessian to be diagonal?"}],"notes":["本段讨论了牛顿法在坐标变换下的不变性，指出牛顿法在坐标变换下保持步骤不变，这是其重要属性。这在理论上和实践中都非常有用，因为一阶缩放不会影响结果。","牛顿法在二次函数上的表现非常好，因为它在一次迭代中就能收敛。这是因为牛顿法通过二次逼近函数，而二次函数的二次逼近就是它本身，因此直接求解即可得到最优解。","牛顿法的计算过程实际上等价于求解一个线性代数问题，因为Hessian矩阵在点上是仿射的。因此，可以利用之前讨论的线性代数知识来分析牛顿法。","牛顿法的收敛性分析来自苏联1930年代的研究，这表明牛顿法在优化理论中具有重要的历史背景。","在讨论牛顿法时，讲师还提出了问题，引导学生思考如何理解牛顿法的原理，以及如何将牛顿法应用于实际问题。","最后，讲师提到将讨论Hessian矩阵对角化的意义，这与牛顿法的计算效率和收敛性密切相关。"],"formulas":[{"latex":"H(x) = \\nabla^2 f(x)","symbols":"H(x) 表示函数 f(x) 在点 x 处的Hessian矩阵","explanation":"公式正确，Hessian矩阵的定义无误。","evidence":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah."},{"latex":"x_{k+1} = x_k - H(x_k)^{-1} \\nabla f(x_k)","symbols":"牛顿法的迭代公式，其中 $ x_{k+1} $ 是下一个迭代点，$ H(x_k) $ 是Hessian矩阵，$ \nabla f(x_k) $ 是梯度","explanation":"公式正确，牛顿法的迭代公式无误。","evidence":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah."}],"uncertainties":["在段落59中，'extremely uh good attribute' 的 'uh' 可能是口误，但不影响整体意思。","在段落60中，'infinite precision' 的具体含义可能需要进一步澄清，但根据上下文可以理解为无限精度的线性代数计算。","在段落62中，'you didn't know it, but you're actually solving the entire problem' 的具体含义可能需要进一步澄清，但可以理解为牛顿法在计算过程中实际上解决了整个问题。"],"diagram":"none","start":1487.35,"end":1655.9,"asr_flags":[],"math_clarifications":["未发现需要核对的数学公式错误，所有公式均符合数学规范。"],"raw_segments":[{"start":1487.35,"text":"In gradient method, you get completely different iterates and all that. It might be faster, it might be way slower. I don't know. It just depends. But you'll get a completely different thing. Actually, up here, it all goes away. And you can check because when you do this, the gradient gets a T in front of it and then the Hessian gets a T on the left and a T transpose on the right or something like that. And when you assemble everything..."},{"start":1511.1,"text":"it all just goes away so you get the identical steps here right so another way to say this newton's method is independent of changes of coordinate of well linear changes any linear change of coordinates right so that so which is a that's a extremely uh good attribute to have actually in theory it's cool but it's all it's actually super useful in practice right so what it means is to first order scaling doesn't matter"},{"start":1540.36,"text":"for something like a Newton method. It doesn't make any difference at all. I mean, if you were going to do the linear algebra in infinite precision, it literally wouldn't matter at all. Whereas that's completely false for something like a gradient method, right? There, you change coordinates, and if you change coordinates, you either get something faster or actually much more likely slower. Okay, so this is Newton's method."},{"start":1569.77,"text":"So I'm going to give you the classical convergence analysis. So this is actually interesting. This is actually from the Soviet Union around the 1930s. But here it is. It's actually super interesting. Oh, and actually, before we start, I have to ask you a bunch of questions, right? How well does Newton's method work on a quadratic function? Yeah, quite well, right? Yeah, like how well? Like it converges in one step."},{"start":1602.84,"text":"Why? Because one way to understand what Newton's method is, is you say, you're at x, and you say, please develop for me a quadratic approximation of your function. What's a quadratic approximation of a quadratic function? It's self. And then the next step is it says minimize that. So actually, while you're computing the Newton step, you didn't know it, but you're actually solving the entire problem. Oh, and by the way, yeah."},{"start":1626.34,"text":"How, yeah, notice the other thing is that when I ask you to minimize a quadratic convex function, what does that turn into? It's linear algebra. It's nothing else, right? Because the Hessian is affine in the point. So it's just linear algebra. And so therefore, that means I can pull in all the stuff we talked about last week. And we will. We'll do that later. That's another thread. But we'll be talking about what does it mean for a Hessian to be diagonal?"}],"speech_gaps":[],"frame":"../frames/v014/010.webp","frame_time":1499.35},{"title":"牛顿法与高阶导数","segments":[{"id":64,"text":"or, you know, banded or sparse. And we'll talk about all that later, right? But so what it says is, so, I mean, one way to say it is computing a Newton step is basically linear algebra. We, you know, a fair amount of linear algebra by now, you know, at least the beginnings of it."},{"id":65,"text":"And it says it's just linear algebra. So we've kind of reduced solving a problem when you're doing Newton's method to a sequence of problems. In each step, you use linear algebra. Everybody, that's kind of cool. Okay, let's get back to it. Okay, so we established that Newton's method works shockingly well for quadratic functions. So what's really going to affect Newton's method, actually, is..."},{"id":66,"text":"how well, remember how this all went. It all went this way. You wanted to use the metric,"},{"id":67,"text":"how well, remember how this all went. It all went this way. You wanted to use the metric,"},{"id":68,"text":"which was the Hessian at the solution, right? Instead, you use the Hessian where you are,"},{"id":69,"text":"right? And by the way, that also explains why this is going to do really well as you get closer"},{"id":70,"text":"and closer, because that approximation is going to get better and better, okay? So that's what's"},{"id":71,"text":"going to, that's, so when, you know, when you're in, when you're here, you know, right, when you're"},{"id":72,"text":"right close to, let's say, if this is a maximum likelihood problem, if you're right close"},{"id":73,"text":"to the parameters, then the Newton method's going to give you essentially an extremely"},{"id":74,"text":"good estimate of the parameter on the next step. Everybody got this? Okay, so what it"},{"id":75,"text":"depends on is actually the third derivative, if you think about it carefully. It's the"},{"id":76,"text":"third derivative that matters, right? Because the third derivative tells you how much the second"},{"id":77,"text":"derivative changes when you move. That's what the third derivative is, right? So if the third"},{"id":78,"text":"derivative of a function is small, then our intuition is that Newton's method should work"},{"id":79,"text":"to what you really wanted to do, which was to use"},{"id":80,"text":"change coordinates, or however you use a metric which was aligned with the Hessian, defined by the Hessian at the optimum, you'd say, but you're not at the optimum. Yeah, but the Hessian changes very slowly. So, I mean, there's not more to what I'm saying. This is not deep. Everybody got this? So, and you know, here's an extreme case of a third derivative being small. It's zero. What does it mean if a third derivative is zero?"},{"id":81,"text":"change coordinates, or however you use a metric which was aligned with the Hessian, defined by the Hessian at the optimum, you'd say, but you're not at the optimum. Yeah, but the Hessian changes very slowly. So, I mean, there's not more to what I'm saying. This is not deep. Everybody got this? So, and you know, here's an extreme case of a third derivative being small. It's zero. What does it mean if a third derivative is zero?"}],"notes":["本段讨论了牛顿法在求解优化问题时的计算过程，指出牛顿步的计算本质上是线性代数操作。这表明牛顿法在每一步迭代中都依赖于线性代数的计算，从而将非线性优化问题转化为一系列线性问题。","牛顿法在二次函数上的表现非常出色，这是因为牛顿法利用了目标函数的二阶导数（Hessian矩阵）来构造局部二次近似。当接近最优解时，Hessian矩阵的变化较小，因此近似更加准确。","牛顿法的收敛性依赖于高阶导数，特别是三阶导数。三阶导数反映了二阶导数的变化率，当三阶导数较小时，牛顿法的收敛速度会显著提高。","当三阶导数为零时，函数在该点附近表现为二次函数，这意味着牛顿法在该点附近会表现出极高的收敛性。然而，三阶导数在高维空间中的定义较为复杂，通常涉及三线性形式。","在高维空间中，三阶导数的计算和解释比一维情况更加复杂，这与数学教育中对高阶导数的处理方式有关。因此，三阶导数在实际应用中可能需要更谨慎的处理。","牛顿法的收敛性不仅依赖于目标函数的性质，还依赖于Hessian矩阵的变化情况。当Hessian矩阵变化缓慢时，牛顿法的性能会更好，这在实际优化问题中是一个重要的考虑因素。"],"formulas":[{"latex":"H(x) = \\nabla^2 f(x)","symbols":"Hessian矩阵","explanation":"公式正确，H(x)表示函数f(x)在点x处的Hessian矩阵，符合数学定义。","evidence":"which was the Hessian at the solution, right? Instead, you use the Hessian where you are, right? And by the way, that also explains why this is going to do really well as you get closer"},{"latex":"f(x) \\text{ is quadratic} \\rightarrow f''(x) = \\text{constant}","symbols":"二次函数的二阶导数为常数","explanation":"公式正确，二次函数的 t":"to the parameters, then the Newton method's going to give you essentially an extremely"},{"start":1738.58,"text":"good estimate of the parameter on the next step. Everybody got this? Okay, so what it"},{"start":1749.58,"text":"depends on is actually the third derivative, if you think about it carefully. It's the"},{"start":1756.92,"text":"third derivative that matters, right? Because the third derivative tells you how much the second"},{"start":1763.54,"text":"derivative changes when you move. That's what the third derivative is, right? So if the third"},{"start":1769.04,"text":"derivative of a function is small, then our intuition is that Newton's method should work"},{"start":1773.12,"text":"unbelievably well. And someone would say, why? And you'd say, well, because it's getting close"},{"start":1778.34,"text":"to what you really wanted to do, which was to use"},{"start":1781.34,"text":"change coordinates, or however you use a metric which was aligned with the Hessian, defined by the Hessian at the optimum, you'd say, but you're not at the optimum. Yeah, but the Hessian changes very slowly. So, I mean, there's not more to what I'm saying. This is not deep. Everybody got this? So, and you know, here's an extreme case of a third derivative being small. It's zero. What does it mean if a third derivative is zero?"},{"start":1805.26,"text":"It's quadratic. So all of us should be expecting it's a third derivative. Now, the third derivative of a function on R is something none of us should be afraid of. Third derivative of a function on Rn is something... This has to do with weirdness, has to do with our education in mathematics. We should all avoid. It's a trilinear form."}],"speech_gaps":[],"frame":"../frames/v014/011.webp","frame_time":1668.67},{"title":"张量与高阶导数的处理","segments":[{"id":82,"text":"Right. So, you know, if you're cool with tensors, people in mechanical engineering can do this very well. A lot of people in physics can do it because they're used to worki  of L. Then that's basically the same as saying that the norm of this"},{"id":88,"text":"trilinear form, which is the third derivative, is less than L. And this avoids us having to get a headache because there's three indices and all that kind of stuff. Everybody following this? And besides, this is kind of what you want, right? So you should imagine that if that condition holds and L is small, Newton's method should work really well. Because it says, actually that literally says the Hessian doesn't change much as you move."},{"id":89,"text":"And that's the key to Newton's method working really well. Everybody following this? Okay. So here you have some Lipschitz constant there. We'll assume that. And then the way... I won't go through the..."}],"notes":["本段主要讨论了张量和高阶导数在不同学科中的处理方式。机械工程和物理领域的学者由于长期接触高阶张量，因此对处理多索引的张量更为熟练。而大多数受过矩阵训练的人则在面对超过两个索引的张量时会感到不适。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1828.85,"end":2005.96,"asr_flags":[],"raw_segments":[{"start":1828.85,"text":"Right. So, you know, if you're if you're cool with tensors, people in mechanical engineering can do this very well. A lot of people in physics can do it because they're used to working with higher order tensors. They don't have friends and they're like, they don't they don't scare me. Like, what do you mean? I'm like, there's three indices and they're like, yeah. And so I just anyway, I'm just saying unless you have it come from some weird fields. Right."},{"start":1851.81,"text":"then where you do handle these kinds of things, then it's complicated. For the rest of us who have this weird education where we were trained about matrices, that would include me, then we get very uncomfortable when we go above two indices. Everybody following this? If you're in that, are you in one of these fields?"},{"start":1874.37,"text":"Which one? Physics. There you go, physics. See? And they laugh at us, and they say, well, that's contravariant, that's covariant, and I don't care how many of these Einstein notes. It's fine. It's totally fine. It's fine. So it wouldn't bother you to take... Yeah, how about this? How about the third derivative of the log determinant of a positive definite matrix? You can pretend to visualize it."},{"start":1898.22,"text":"Okay, good. Okay, so yeah. I mean, that's some crazy trilinear form that's got six indices, right? Because the original thing is indexed by two. Anyway, fine. All right, so actually it turns out all we need to express is that the third derivative is small. So we're not going to actually work with..."},{"start":1917.95,"text":"third derivatives in trilinear forms. And we're certainly not going to talk about the third derivative of, let's say, the negative log determinant of a positive definite matrix, which, I mean, I could write it out. I can write out all the partial derivatives. I know where they are. I just don't want to write it down."},{"start":1933.72,"text":"because of my training. So that's fine. Okay. Okay. So instead, this is often expressed as a Lipschitz constant, right? So this is cool. This we can do, right? If I take the two norm of the difference of the two Hessians, right? And I say that that's less than L, right? So it has a Lipschitz constant of L. Then that's basically the same as saying that the norm of this"},{"start":1960.4,"text":"trilinear form, which is the third derivative, is less than L. And this avoids us having to get a headache because there's three indices and all that kind of stuff. Everybody following this? And besides, this is kind of what you want, right? So you should imagine that if that condition holds and L is small, Newton's method should work really well. Because it says, actually that literally says the Hessian doesn't change much as you move."},{"start":1987.4,"text":"And that's the key to Newton's method working really well. Everybody following this? Okay. So here you have some Lipschitz constant there. We'll assume that. And then the way... I won't go through the..
