nd each of these functions is a function of theta. So basically, your total loss is also a function of theta. And now, the next task is to optimize to find theta that makes the loss smaller.","start":1240.34,"end":1266.96},{"id":173,"text":"I think we also introduced a little bit about gradient descent, like Newton method. So these are all ways to optimize things. So here you cannot use Newton method because the function is not convex. So that's why Newton's method is not guaranteed to work. Actually, no methods can guarantee to work for all non-convex functions. But stock casting gradient descent seems to be a good idea. So just to quickly recall, you can use an optimizer.","start":1267.67,"end":1295.07},{"id":174,"text":"So optimization, I think one of the options is you take gradient descent. So let's say, suppose you have a loss function. Let's just summarize all the cases as this. Let's just be able to abstract. So let's say each of the examples have the loss j i of theta. And you have an average of these loss functions. Gradient descent means that you just say, I'm going to","start":1297.51,"end":1322.87},{"id":175,"text":"ignore the structure here. I just treat this as a single loss function. I take the update, theta is updated to, I think we use this notation to denote update, something like eta times gradient of j of theta. So this is gradient descent. And how do you compute this gradient? You compute the gradient of each of the loss, the gradient, sorry, you compute the gradient of each of the loss with respective parameters and you add them up. So that's gradient descent. And for stochastic gradient descent,","start":1323.66,"end":1351.41}],"notes":["本段讲解了损失函数的计算方式，指出损失函数是所有样本损失的平均值，每个样本的损失函数是参数θ的函数。接着，课程提到优化的目标是找到使损失最小的θ值。","课程介绍了梯度下降法的基本思想，即通过计算损失函数的梯度并进行参数更新来优化模型。同时，提到牛顿法不适用于非凸函数，因此不能保证收敛。","课程指出，对于非凸函数，没有方法能保证找到全局最优解，但随机梯度下降（SGD）仍然是一个可行的优化方法。此外，课程提到可以使用优化器来实现梯度下降。","课程进一步解释了梯度下降的具体实现方式，即对每个样本的损失函数计算梯度，并将所有梯度相加以更新参数θ。这为后续的随机梯度下降（SGD）奠定了基础。","课程提到，梯度下降法可以抽象为将所有样本的损失函数视为一个整体，然后通过计算梯度并进行参数更新来优化模型。这种抽象方式有助于理解梯度下降法的通用性。"],"formulas":[{"latex":"L(\\theta) = \\frac{1}{N}\\sum_{i=1}^{N} l_i(\\theta)","symbols":"损失函数L(θ)是所有样本损失l_i(θ)的平均值","explanation":"公式正确，表示损失函数L(θ)为所有样本损失l_i(θ)的平均值，符合梯度下降法的定义。","evidence":"is the average over all the examples. You take the cross entropy loss of each of these examples, xi and yi. And each of these functions is a function of theta. So basically, your total loss is also a function of theta. And now, the next task is to optimize to find theta that makes the loss smaller."},{"latex":"\\theta_{t+1} = \\theta_t - \\eta \\nabla L(\\theta_t)","symbols":"梯度下降法的参数更新公式","explanation":"公式正确，表示梯度下降法的参数更新过程，其中η为学习率，∇L(θ_t)为损失函数在θ_t处的梯度。","evidence":"ignore the structure here. I just treat this as a single loss function. I take the update, theta is updated to, I think we use this notation to denote update, something like eta times gradient of j of theta. So this is gradient descent. And how do you compute this gradient? You compute the gradient of each of the loss, the gradient, sorry, you compute the gradient of each of the loss with respective parameters and you add them up. So that's gradient descent. And for stochastic gradient descent,"}],"uncertainties":["stock casting gradient descent"],"diagram":"none","start":1200.27,"end":1351.41,"asr_flags":[],"math_clarifications":["公式中的损失函数L(θ)为所有样本损失l_i(θ)的平均值，符合梯度下降法的定义。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1200.27,"text":"So then it's kind of like this. The scaling doesn't really matter because it doesn't change the optimization function fundamentally. Sounds good. Any other questions? OK, cool. And in this case, here I only have one example, eventually an average over many examples. So I guess maybe just let me write here. So if you continue here, so eventually your loss, your real loss is something like the final loss."},{"start":1240.34,"text":"is the average over all the examples. You take the cross entropy loss of each of these examples, xi and yi. And each of these functions is a function of theta. So basically, your total loss is also a function of theta. And now, the next task is to optimize to find theta that makes the loss smaller."},{"start":1267.67,"text":"I think we also introduced a little bit about gradient descent, like Newton method. So these are all ways to optimize things. So here you cannot use Newton method because the function is not convex. So that's why Newton's method is not guaranteed to work. Actually, no methods can guarantee to work for all non-convex functions. But stock casting gradient descent seems to be a good idea. So just to quickly recall, you can use an optimizer."},{"start":1297.51,"text":"So optimization, I think one of the options is you take gradient descent. So let's say, suppose you have a loss function. Let's just summarize all the cases as this. Let's just be able to abstract. So let's say each of the examples have the loss j i of theta. And you have an average of these loss functions. Gradient descent means that you just say, I'm going to"},{"start":1323.66,"text":"ignore the structure here. I just treat this as a single loss function. I take the update, theta is updated to, I think we use this notation to denote update, something like eta times gradient of j of theta. So this is gradient descent. And how do you compute this gradient? You compute the gradient of each of the loss, the gradient, sorry, you compute the gradient of each of the loss with respective parameters and you add them up. So that's gradient descent. And for stochastic gradient descent,"}],"speech_gaps":[],"frame":"../frames/v050/008.webp","frame_time":1212.27},{"title":"神经网络的架构与随机梯度下降","segments":[{"id":176,"text":"So what you do is you say your first sample, say B, let's see. So you sample, I guess they are, you know, maybe let's say the most vanilla version of it is you sample one item. You sample J from 1 to N uniformly. And then you run this, you know, so of course there's a for loop.","start":1358.54,"end":1390.66},{"id":177,"text":"And you sample, and then you say theta is updated to theta minus eta nabla. The cost of the example j, the cost of loss of example j, theta.","start":1391.75,"end":1404.61},{"id":178,"text":"And the justification here is that if you think about what is this, so the difference here is that here you compute a gradient of the average loss, and here you only compute a gradient of one single example, the loss on one single example. And the justification here is that you say, even though this is one example, it's not actually the loss of the whole gradient, but actually if you look at the expectation of the","start":1406.95,"end":1431.67},{"id":179,"text":"the gradient, the per example gradient, and your randomness comes from J, which is sampled uniformly from 1 to n. This is equal to the gradient of the average gradient, the gradient of the loss function.","start":1434.61,"end":1449.35},{"id":180,"text":"So in some sense, this quantity is an approximation of this quantity. And the approximation is in the sense that this quantity, in average, is equal to this. It's just that sometimes it's biased towards this. Let's say, suppose this quantity is in this direction, and this quantity just can be any directions. But if you average out all the possibilities, you get the original direction on the goal.","start":1451.09,"end":1474.19},{"id":181,"text":"So in some sense, you have a much larger noise. So if you do gradient descent, it's kind of like, I guess, maybe I use two different colors. So suppose you use gradient descent. This is the gradient of the average loss. And if you stop casting gradient descent, it stops casting. You may go here. You may go here.","start":1474.63,"end":1496.47},{"id":182,"text":"Or you may go here. Sometimes you may even go in the reverse direction. But in average, all of these blue ones will average out in the same direction as the black one. And then if you have a trajectory, so suppose the black one goes like this. The blue one, because it's stochastic, you have noise. So it will go look like this. Maybe something like this. Maybe like even.","start":1497.33,"end":1521.95},{"id":183,"text":"But the average is roughly tracking the gradient descent. Of course, how much these two things tracks over time is a very complex matter. It depends on how large the step size is.","start":1522.77,"end":1535.35}],"notes":["本段讲解了随机梯度下降（SGD）与批量梯度下降（BGD）之间的区别。在SGD中，每次迭代只使用一个样本计算梯度，而BGD则使用所有样本的平均损失计算梯度。这种差异导致SGD在每次迭代中引入了噪声，但通过平均所有样本的梯度，可以近似得到BGD的梯度。","讲者指出，SGD的梯度是单个样本梯度的期望，因此在平均意义上与BGD的梯度一致。然而，由于每次迭代的随机性，SGD的梯度可能偏向某些方向，但整体上会收敛到正确的方向。","在SGD中，梯度下降的轨迹会因为噪声而表现出随机性，但这些随机轨迹的平均值会与BGD的轨迹一致。这种现象说明了SGD在优化过程中的稳定性。","讲者提到，SGD的收敛速度和稳定性取决于步长的大小。较大的步长可能导致更大的噪声，从而影响收敛的准确性，而较小的步长则可能使收敛过程变慢。","本段还通过颜色对比（黑色代表BGD，蓝色代表SGD）形象地展示了SGD的随机性与BGD的确定性之间的差异，以及它们在长期平均下的趋同性。","讲者强调，SGD虽然引入了噪声，但其平均行为与BGD一致，因此在实际应用中，SGD是一种有效的优化方法，尤其适用于大规模数据集。"],"formulas":[{"latex":"E_J[\\nabla_\\theta \\mathcal{L}(\\theta, J)] = \\nabla_\\theta \\mathcal{L}_{\\text{avg}}(\\theta)","symbols":"期望梯度等于平均损失的梯度","explanation":"该公式正确表达了随机梯度下降中期望梯度与平均损失梯度的关系，适用于J从1到N均匀采样的情况。","evidence":"the gradient, the per example gradient, and your randomness comes from J, which is sampled uniformly from 1 to n. This is equal to the gradient of the average gradient, the gradient of the loss function."},{"latex":"\\nabla_\\theta \\mathcal{L}_{\\text{avg}}(\\theta) = \\frac{1}{N}\\sum_{j=1}^N \\nabla_\\theta \\mathcal{L}(\\theta, j)","symbols":"平均损失的梯度等于所有样本梯度的平均","explanation":"该公式正确表达了平均损失的梯度是所有样本梯度的平均，适用于J从1到N均匀采样的情况。","evidence":"the gradient, the per example gradient, and your randomness comes from J, which is sampled uniformly from 1 to n. This is equal to the gradient of the average gradient, the gradient of the loss function."},{"latex":"\\theta_{t+1} = \\theta_t - \\eta \\nabla_\\theta \\mathcal{L}(\\theta, J_t)","symbols":"随机梯度下降的更新规则","explanation":"该公式正确表达了随机梯度下降的更新规则，其中J_t是从1到N中采样的单个样本索引。","evidence":"And you sample, and then you say theta is updated to theta minus eta nabla. The cost of the example j, the cost of loss of example j, theta."}],"uncertainties":["the gradient of the average gradient, the gradient of the loss function"],"diagram":"none","start":1358.54,"end":1535.35,"asr_flags":[],"math_clarifications":["公式0和公式1正确表达了期望梯度与平均损失梯度的关系，以及平均损失梯度的计算方式，适用于J从1到N均匀采样的情况。公式2正确表达了随机梯度下降的更新规则，其中J_t是从1到N中采样的单个样本索引。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1358.54,"text":"So what you do is you say your first sample, say B, let's see. So you sample, I guess they are, you know, maybe let's say the most vanilla version of it is you sample one item. You sample J from 1 to N uniformly. And then you run this, you know, so of course there's a for loop."},{"start":1391.75,"text":"And you sample, and then you say theta is updated to theta minus eta nabla. The cost of the example j, the cost of loss of example j, theta."},{"start":1406.95,"text":"And the justification here is that if you think about what is this, so the difference here is that here you compute a gradient of the average loss, and here you only compute a gradient of one single example, the loss on one single example. And the justification here is that you say, even though this is one example, it's not actually the loss of the whole gradient, but actually if you look at the expectation of the,"},{"start":1434.61,"text":"the gradient, the per example gradient, and your randomness comes from J, which is sampled uniformly from 1 to n. This is equal to the gradient of the average gradient, the gradient of the loss function."},{"start":1451.09,"text":"So in some sense, this quantity is an approximation of this quantity. And the approximation is in the sense that this quantity, in average, is equal to this. It's just that sometimes it's biased towards this. Let's say, suppose this quantity is in this direction, and this quantity just can be any directions. But if you average out all the possibilities, you get the original direction on the goal."},{"start":1474.63,"text":"So in some sense, you have a much larger noise. So if you do gradient descent, it's kind of like, I guess, maybe I use two different colors. So suppose you use gradient descent. This is the gradient of the average loss. And if you stop casting gradient descent, it stops casting. You may go here. You may go here."},{"start":1497.33,"text":"Or you may go here. Sometimes you may even go in the reverse direction. But in average, all of these blue ones will average out in the same direction as the black one. And then if you have a trajectory, so suppose the black one goes like this. The blue one, because it's stochastic, you have noise. So it will go look like this. Maybe something like this. Maybe like even."},{"start":1522.77,"text":"But the average is roughly tracking the gradient descent. Of course, how much these two things tracks over time is a very complex matter. It depends on how large the step size is."}],"speech_gaps":[],"frame":"../frames/v050/009.webp","frame_time":1370.54},{"title":"神经网络架构与梯度下降方法","segments":[{"id":184,"text":"It depends on many kind of subtle things.","start":1537.21,"end":1538.99},{"id":185,"text":"But conceptually, you should expect that the blue one sum","start":1539.13,"end":1541.93},{"id":186,"text":"would track the black one.","start":1541.93,"end":1544.45},{"id":187,"text":"The blue one, on average, is exactly equal to the black one","start":1544.75,"end":1547.63},{"id":188,"text":"in one step.","start":1547.63,"end":1548.13},{"id":189,"text":"But the error sometimes can be amplified.","start":1548.49,"end":1550.19},{"id":190,"text":"Sometimes the error can be shrunk.","start":1550.31,"end":1552.11},{"id":191,"text":"So it depends on the situation.","start":1552.59,"end":1554.05},{"id":192,"text":"Ideally, you want them to track to some degree.","start":1554.55,"end":1556.11},{"id":193,"text":"Generally, you want to use stochastic gradient descent","start":1556.55,"end":1559.31},{"id":194,"text":"or a non-convex gradient descent?","start":1559.31,"end":1560.91},{"id":195,"text":"I think you can use gradient descent as well.","start":1563.01,"end":1564.75},{"id":196,"text":"No.","start":1564.75,"end":1564.85},{"id":197,"text":"It's OK.","start":1564.97,"end":1565.45},{"id":198,"text":"But I think we are getting at the question.","start":1565.55,"end":1567.11},{"id":199,"text":"I think it sounds like the question is really","start":1567.33,"end":1572.59},{"id":200,"text":"about why you use stochastic .","start":1572.59,"end":1574.07},{"id":201,"text":"In what cases do you want to use stochastic ?","start":1574.07,"end":1575.87},{"id":202,"text":"That is a great question.","start":1575.87,"end":1576.49},{"id":203,"text":"So why do you even consider stochastic with intent?","start":1576.63,"end":1578.91},{"id":204,"text":"The reason is that computing this gradient","start":1579.31,"end":1581.31},{"id":205,"text":"is very costly each time because you have so many examples.","start":1581.31,"end":1584.23},{"id":206,"text":"n could be, in 2015, it's kind of 1 million examples.","start":1584.53,"end":1588.13},{"id":207,"text":"In 2026 now, I think it's kind of like 1 trillion tokens.","start":1588.45,"end":1593.47},{"id":208,"text":"Right?","start":1593.47,"end":1593.75},{"id":209,"text":"There's no chance you can compute all the gradients.","start":1593.81,"end":1596.89},{"id":210,"text":"Even computing one gradient is very costly,","start":1597.43,"end":1599.25},{"id":211,"text":"let alone computing all the gradients.","start":1599.39,"end":1600.93},{"id":212,"text":"So that's why you have to find an efficient way.","start":1601.09,"end":1602.95},{"id":213,"text":"So that's why you want to have a sampler, which is less costly.","start":1603.15,"end":1607.45},{"id":214,"text":"And also, another reason you can do this","start":1607.85,"end":1614.13},{"id":215,"text":"is that computing the full gradient sometimes","start":1614.13,"end":1616.29},{"id":216,"text":"is actually wasteful.","start":1616.29,"end":1617.33},{"id":217,"text":"Because maybe it's the case that all of these individual gradients are actually correlated. They are highly correlated. So there's no reason to compute each of them to understand which direction to go. So you just only need a sub. It's kind of like every example tells you to go that way. Why you have to compute all of them? You just need a subset of them. And another thing is that even this is not entirely true. In many cases, like a","start":1620.08,"end":1645.68},{"id":218,"text":"Even if you have some mistakes, it will be corrected later. So maybe another way to think about it is that, for some cases, for example, if you have a convex function, in some sense, one way to do it is that you do this. But sometimes, if you overshoot, or maybe you go in the wrong direction, still, eventually, you're going to go down. How do I say this?","start":1646.12,"end":1673.94},{"id":219,"text":"Basically, even if you have some perturbations, and this is not exactly the right example, but even if you have some perturbations in your dynamics, then over time, because every time you have a shared target, eventually those kind of perturbations got washed out by the shared force in some sense. So I just wanted to ask on a non-convex function, I guess, having no convex. And I believe that this is where you could be interested. Are we still able to use ?","start":1676.53,"end":1705.35}],"notes":["本段讨论了在神经网络训练中使用随机梯度下降（SGD）的原因，特别是在大规模数据集的情况下。计算完整梯度的成本很高，因此需要更高效的替代方法。讲者提到，当数据量非常大时，例如2015年有100万条样本，2026年可能达到1万亿个标记，计算所有梯度是不现实的。","讲者进一步解释了为什么在某些情况下计算完整梯度是浪费资源的。因为不同样本的梯度可能高度相关，不需要计算所有梯度来确定优化方向。只需要一个子集即可。此外，即使存在一些误差，这些误差在后续步骤中可能会被纠正。","讲者还提到，在凸函数的情况下，即使出现过冲或错误方向，最终仍会朝着最小值方向移动。对于非凸函数，虽然没有这种保证，但通过随机梯度下降，仍然可以找到局部最优解。","讲者最后提到，即使在动态过程中存在扰动，这些扰动最终会被共享的目标所抵消。因此，在非凸函数的情况下，仍然可以使用随机梯度下降方法进行优化。","讲者在讨论中提到，使用随机梯度下降的一个关键原因是计算完整梯度的成本过高，尤其是在大规模数据集的情况下。此外，计算完整梯度可能并不总是最优的，因为不同样本的梯度可能高度相关，只需要一个子集即可。","讲者还提到，即使在训练过程中存在一些误差，这些误差在后续步骤中可能会被纠正。因此，随机梯度下降在非凸函数的情况下仍然是一种有效的优化方法。"],"formulas":[],"uncertainties":["stochastic"],"diagram":"none","start":1537.21,"end":1705.35,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1537.21,"text":"It depends on many kind of subtle things."},{"start":1539.13,"text":"But conceptually, you should expect that the blue one sum"},{"start":1541.93,"text":"would track the black one."},{"start":1544.75,"text":"The blue one, on average, is exactly equal to the black one"},{"start":1547.63,"text":"in one step."},{"start":1548.49,"text":"But the error sometimes can be amplified."},{"start":1550.31,"text":"Sometimes the error can be shrunk."},{"start":1552.59,"text":"So it depends on the situation."},{"start":1554.55,"text":"Ideally, you want them to track to some degree."},{"start":1556.55,"text":"Generally, you want to use stochastic gradient descent"},{"start":1559.31,"text":"or a non-convex gradient descent?"},{"start":1563.01,"text":"I think you can use gradient descent as well."},{"start":1564.75,"text":"No."},{"start":1564.97,"text":"It's OK."},{"start":1565.55,"text":"But I think we are getting at the question."},{"start":1567.33,"text":"I think it sounds like the question is really"},{"start":1572.59,"text":"about why you use stochastic ."},{"start":1574.07,"text":"In what cases do you want to use stochastic ?"},{"start":1575.87,"text":"That is a great question."},{"start":1576.63,"text":"So why do you even consider stochastic with intent?"},{"start":1579.31,"text":"The reason is that computing this gradient"},{"start":1581.31,"text":"is very costly each time because you have so many examples."},{"start":1584.53,"text":"n could be, in 2015, it's kind of 1 million examples."},{"start":1588.45,"text":"In 2026 now, I think it's kind of like 1 trillion tokens."},{"start":1593.47,"text":"Right?"},{"start":1593.81,"text":"There's no chance you can compute all the gradients."},{"start":1597.43,"text":"Even computing one gradient is very costly,"},{"start":1599.39,"text":"let alone computing all the gradients."},{"start":1601.09,"text":"So that's why you have to find an efficient way."},{"start":1603.15,"text":"So that's why you want to have a sampler, which is less costly."},{"start":1607.85,"text":"And also, another reason you can do this"},{"start":1614.13,"text":"is that computing the full gradient sometimes"},{"start":1616.29,"text":"is actually wasteful."},{"start":1620.08,"text":"Because maybe it's the case that all of these individual gradients are actually correlated. They are highly correlated. So there's no reason to compute each of them to understand which direction to go. So you just only need a sub. It's kind of like every example tells you to go that way. Why you have to compute all of them? You just need a subset of them. And another thing is that even this is not entirely true. In many cases, like a"},{"start":1646.12,"text":"You don't really have to be very precise in this dynamics. Even if you have some mistakes, it will be corrected later. So maybe another way to think about it is that, for some cases, for example, if you have a convex function, in some sense, one way to do it is that you do this. But sometimes, if you overshoot, or maybe you go in the wrong direction, still, eventually, you're going to go down. How do I say this?"},{"start":1676.53,"text":"Basically, even if you have some perturbations, and this is not exactly the right example, but even if you have some perturbations in your dynamics, then over time, because every time you have a shared target, eventually those kind of perturbations got washed out by the shared force in some sense. So I just wanted to ask on a non-convex function, I guess, having no convex. And I believe that this is where you could be interested. Are we still able to use ?"}],"speech_gaps":[],"frame":"../frames/v050/010.webp","frame_time":1549.21},{"title":"神经网络（一）架构：局部极小值与随机梯度下降","segments":[{"id":220,"text":"Yeah, I think that's a great question. So one of the theories for why stochastic descent is good is that it can work better on non-convex functions. And maybe let me first explain what you said, but actually it's not entirely right. So I think, so basically, suppose you have a non-convex function in 1D, let's say, like this. So if you start here, you keep going down.","start":1706.02,"end":1731.34},{"id":221,"text":"This greenish sign just means you go downhill in some sense. So you go to the directions, which is going downhill. Sometimes it's called steepest descent. It's basically you're finding the...","start":1732.1,"end":1740.32},{"id":222,"text":"the direction which is going downhill the fastest in some sense. So you just go here and you get stuck here because you can never leave this place. Here the gradient is zero. The curvature is zero. And I think what you're trying to say is that if you do stochastic gradient descent, because there's some noise, maybe even though you want to go this way, maybe the first step you just, because of the noise, you go the other way and you jump to another local minimum.","start":1740.86,"end":1766.18},{"id":223,"text":"I think this is plausible, but generally speaking, of course, the theory here is very limited. But I think the community don't believe that this is the case. This is why stochastic consent is helping. I don't think people believe that stochastic consent can help you to jump out of a local minimum. However, on the other hand, we don't even believe that there are","start":1766.9,"end":1788.5},{"id":224,"text":"many bad local minimum.","start":1789.07,"end":1790.15},{"id":225,"text":"So in 1D, it's actually very easy to have local minimum,","start":1790.57,"end":1793.55},{"id":226,"text":"but in high dimensional cases,","start":1793.67,"end":1794.65},{"id":227,"text":"it's not that trivial to have that many local minimum.","start":1795.15,"end":1797.41},{"id":228,"text":"So I think at least one,","start":1798.77,"end":1800.85},{"id":229,"text":"in actual, I was involved in developing some of the theory.","start":1800.91,"end":1803.51},{"id":230,"text":"Of course, nobody really knows exactly whether they are right.","start":1803.67,"end":1805.99},{"id":231,"text":"But the common, let's say,","start":1806.13,"end":1809.01},{"id":232,"text":"hypothesis or hypothesized consensus in some sense is that there are","start":1809.05,"end":1814.39},{"id":233,"text":"very limited number of bad local minimums in this,","start":1814.39,"end":1817.47},{"id":234,"text":"in this high dimensional function you're optimizing.","start":1817.47,"end":1819.55},{"id":235,"text":"Maybe there's even no local minimum.","start":1819.77,"end":1821.15},{"id":236,"text":"All the local minimum are actually global minimum.","start":1821.39,"end":1823.19},{"id":237,"text":"It's like if you think about it, you","start":1823.55,"end":1824.73},{"id":238,"text":"are skiing in a mountain.","start":1824.73,"end":1825.67},{"id":239,"text":"Like I think if you just randomly","start":1827.87,"end":1831.09},{"id":240,"text":"try to go downskills, skiing down hills in 2D,","start":1831.09,"end":1833.63},{"id":241,"text":"you're probably going to go back to one of the parking lots,","start":1834.29,"end":1836.67},{"id":242,"text":"which is one of the global minimum.","start":1836.81,"end":1838.15},{"id":243,"text":"But in 2D, I think it's a bit easier to have a local minimum.","start":1839.59,"end":1842.91},{"id":244,"text":"You probably go back country and you got stuck somewhere.","start":1843.01,"end":1844.77},{"id":245,"text":"That's possible.","start":1844.93,"end":1845.59},{"id":246,"text":"possible, but you always find some river going down.","start":1845.59,"end":1848.17},{"id":247,"text":"You always find some valley going down eventually, I think.","start":1848.21,"end":1850.57},{"id":248,"text":"I'm just going to give an analogy.","start":1851.87,"end":1853.05},{"id":249,"text":"It's not exactly true in 2D, but in high dimensional,","start":1853.23,"end":1855.67},{"id":250,"text":"it's more likely to always find a way","start":1855.83,"end":1857.69},{"id":251,"text":"to go downhill in some sense.","start":1857.69,"end":1860.23},{"id":252,"text":"Could you give some allusion to the mathematics","start":1862.17,"end":1864.93},{"id":253,"text":"that actually shows why, which I would find to be kind","start":1864.93,"end":1868.97},{"id":254,"text":"of intuitive, you don't see that many local minimum","start":1868.97,"end":1871.67},{"id":255,"text":"on a higher interest basis.","start":1871.67,"end":1872.75},{"id":256,"text":"I just find that kind of slow.","start":1872.95,"end":1873.95},{"id":257,"text":"Yeah, I think","start":1875.33,"end":1876.37}],"notes":["本段讨论了随机梯度下降（SGD）在非凸函数优化中的作用，特别是其在逃离局部极小值方面的潜力。讲者指出，虽然SGD的噪声可能帮助模型跳出局部极小值，但目前理论支持有限，社区普遍认为这种现象并不常见。"],"formulas":[],"uncertainties":["stochastic consent","downskills","higher interest basis"],"diagram":"none","start":1706.02,"end":1876.37,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1706.02,"text":"Yeah, I think that's a great question. So one of the theories for why stochastic descent is good is that it can work better on non-convex functions. And maybe let me first explain what you said, but actually it's not entirely right. So I think, so basically, suppose you have a non-convex function in 1D, let's say, like this. So if you start here, you keep going down."},{"start":1732.1,"text":"This greenish sign just means you go downhill in some sense. So you go to the directions, which is going downhill. Sometimes it's called steepest descent. It's basically you're finding the..."},{"start":1740.86,"text":"the direction which is going downhill the fastest in some sense. So you just go here and you get stuck here because you can never leave this place. Here the gradient is zero. The curvature is zero. And I think what you're trying to say is that if you do stochastic gradient descent, because there's some noise, maybe even though you want to go this way, maybe the first step you just, because of the noise, you go the other way and you jump to another local minimum."},{"start":1766.9,"text":"I think this is plausible, but generally speaking, of course, the theory here is very limited. But I think the community don't believe that this is the case. This is why stochastic consent is helping. I don't think people believe that stochastic consent can help you to jump out of a local minimum. However, on the other hand, we don't even believe that there are"},{"start":1789.07,"text":"many bad local minimum."},{"start":1790.57,"text":"So in 1D, it's actually very easy to have local minimum,"},{"start":1793.67,"text":"but in high dimensional cases,"},{"start":1795.15,"text":"it's not that trivial to have that many local minimum."},{"start":1798.77,"text":"So I think at least one,"},{"start":1800.91,"text":"in actual, I was involved in developing some of the theory."},{"start":1803.67,"text":"Of course, nobody really knows exactly whether they are right."},{"start":1806.13,"text":"But the common, let's say,"},{"start":1809.05,"text":"hypothesis or hypothesized consensus in some sense is that there are"},{"start":1814.39,"text":"very limited number of bad local minimums in this,"},{"start":1817.47,"text":"in this high dimensional function you're optimizing."},{"start":1819.77,"text":"Maybe there's even no local minimum."},{"start":1821.39,"text":"All the local minimum are actually global minimum."},{"start":1823.55,"text":"It's like if you think about it, you"},{"start":1824.73,"text":"are skiing in a mountain."},{"start":1827.87,"text":"Like I think if you just randomly"},{"start":1831.09,"text":"try to go downskills, skiing down hills in 2D,"},{"start":1834.29,"text":"you're probably going to go back to one of the parking lots,"},{"start":1836.81,"text":"which is one of the global minimum."},{"start":1839.59,"text":"But in 2D, I think it's a bit easier to have a local minimum."},{"start":1843.01,"text":"You probably go back country and you got stuck somewhere."},{"start":1844.93,"text":"That's possible."},{"start":1845.59,"text":"possible, but you always find some river going down."},{"start":1848.21,"text":"You always find some valley going down eventually, I think."},{"start":1851.87,"text":"I'm just going to give an analogy."},{"start":1853.23,"text":"It's not exactly true in 2D, but in high dimensional,"},{"start":1855.83,"text":"it's more likely to always find a way"},{"start":1857.69,"text":"to go downhill in some sense."},{"start":1862.17,"text":"Could you give some allusion to the mathematics"},{"start":1864.93,"text":"that actually shows why, which I would find to be kind"},{"start":1868.97,"text":"of intuitive, you don't see that many local minimum"},{"start":1871.67,"text":"on a higher interest basis."},{"start":1872.95,"text":"I just find that kind of slow."},{"start":1875.33,"text":"Yeah, I think"}],"speech_gaps":[],"frame":"../frames/v050/011.webp","frame_time":1718.02},{"title":"神经网络的架构与优化方法","segments":[{"id":258,"text":"I don't think there's a very simple way to say it. I think it's not universally true, right? So in some sense, I think maybe if I can only use one or two sentences, I think it's kind of like just in high dimension, there's always some ways to... Like local minimum is your hashing at that point. It's just in all directions positive, semi-definite. That's a very hard thing to satisfy.","start":1877.44,"end":1903.14},{"id":259,"text":"So you find a stationary point where the gradient is 0, and you create a Hessian. The Hessian always have some direction which is negative. And I was thinking about how to formalize this. So for example, if you think about it, the gradient 0 is already a pretty strong constraint. Suppose you have a d-dimensional function, and you","start":1904.31,"end":1927.27},{"id":260,"text":"add the constraints that each of the dimension of the gradient is zero, that's already restrict yourself a lot. And if you add another thing, which is the Hessian is positive semi-definite.","start":1928.05,"end":1937.17},{"id":261,"text":"I think that just makes the number of points much smaller. And in some cases, you can compute. In one of my papers, I think we tried to compute the number of local minimals by using this. I think in differential geometry, there's something called Cat's Res formula. And actually, not only my papers, but many other people's papers. So in certain cases, you can compute, or you can count, and you find out that, oh, all the local minima are actually just those. The number of local minima is the same as the number of global minima. But generally, it's very hard to count. Any other questions?","start":1937.96,"end":1969.08},{"id":262,"text":"OK, sounds great. So going back to here, so that's the algorithm people do. Of course, practically speaking, you don't also just only sample one example each time. Because sampling one example, using all the examples is too inefficient because you have to compute all the gradients. Doing one example, the downside is that it's too noisy. So sometimes you want to have like a","start":1971.12,"end":1993.88},{"id":263,"text":"a trade-off. You want to have a few examples and so that you can be a little bit less noisy. And another thing is that, which probably we won't go in detail here, but another thing is that when you have one example, your GPU has issues too low.","start":1994.68,"end":2011.14},{"id":264,"text":"It's not always the case, but in some cases, using too few of examples make your GPUization too low. For example, if you have like 10,000 GPUs and you just only compute one example of one gradient each time, then most of the GPUs are actually idle. So that's why you need a so-called batch gradient descent. Also, I think it's also still called stochastic gradient descent with some kind of small batches. I think SGD just means like...","start":2012.41,"end":2036.19}],"notes":["本段讨论了神经网络中局部极小值点的性质，指出在高维空间中，局部极小值点的条件非常严格，需要梯度为零且Hessian矩阵为半正定。这使得局部极小值点的数量非常有限，但在某些情况下，如微分几何中的Cat's Res公式，可以计算或统计局部极小值点的数量，但通常很难进行精确计算。","讲者提到在实际应用中，单个样本的梯度下降方法存在噪声过大的问题，因此需要在样本数量和计算效率之间进行权衡。使用小批量的随机梯度下降（SGD）可以在减少噪声的同时提高计算效率。","讲者还指出，当样本数量过少时，GPU的利用率会降低，导致资源浪费。因此，使用批量梯度下降（batch gradient descent）可以更有效地利用计算资源。","讲者提到，SGD通常指的是使用小批量的随机梯度下降方法，而不是单个样本的梯度下降。这表明在实际应用中，需要根据具体问题选择合适的优化方法。","讲者通过举例说明，当有大量GPU资源时，使用单个样本的梯度下降会导致大部分GPU空闲，因此需要采用批量梯度下降方法来提高计算效率。","讲者强调了在优化算法中，样本数量的选择对计算效率和噪声水平之间的平衡至关重要，这需要根据具体问题进行调整。"],"formulas":[{"latex":"Hessian","symbols":"Hessian矩阵","explanation":"Hessian矩阵是二阶导数矩阵，用于分析函数的局部极值点。","evidence":"So you find a stationary point where the gradient is 0, and you create a Hessian. The Hessian always have some direction which is negative. And I was thinking about how to formalize this. So for example, if you think about it, the gradient 0 is already a pretty strong constraint. Suppose you have a d-dimensional function, and you"},{"latex":"gradient 0","symbols":"梯度为零","explanation":"梯度为零表示在该点处函数的导数为零，可能是极值点。","evidence":"So you find a stationary point where the gradient is 0, and you create a Hessian. The Hessian always have some direction which is negative. And I was thinking about how to formalize this. So for example, if you think about it, the gradient 0 is already a pretty strong constraint. Suppose you have a d-dimensional function, and you"},{"latex":"positive semi-definite","symbols":"半正定","explanation":"半正定矩阵的所有特征值非负，用于判断极值点的性质。","evidence":"So you find a stationary point where the gradient is 0, and you create a Hessian. The Hessian always have some direction which is negative. And I was thinking about how to formalize this. So for example, if you think about it, the gradient 0 is already a pretty strong constraint. Suppose you have a d-dimensional function, and you"},{"latex":"batch gradient descent","symbols":"批量梯度下降","explanation":"批量梯度下降使用整个训练集的梯度进行参数更新，通常更稳定但计算成本高。","evidence":"It's not always the case, but in some cases, using too few of examples make your GPUization too low. For example, if you have like 10,000 GPUs and you just only compute one example of one gradient each time, then most of the GPUs are actually idle. So that's why you need a so-called batch gradient descent. Also, I think it's also still called stochastic gradient descent with some kind of small batches. I think SGD just means like..."},{"latex":"stochastic gradient descent","symbols":"随机梯度下降","explanation":"随机梯度下降使用单个样本或小批量样本的梯度进行参数更新，计算效率高但噪声较大。","evidence":"It's not always the case, but in some cases, using too few of examples make your GPUization too low. For example, if you have like 10,000 GPUs and you just only compute one example of one gradient each time, then most of the GPUs are actually idle. So that's why you need a so-called batch gradient descent. Also, I think it's also still called stochastic gradient descent with some kind of small batches. I think SGD just means like..."}],"uncertainties":["GPUization","Cat's Res formula"],"diagram":"none","start":1877.44,"end":2036.19,"asr_flags":[],"math_clarifications":["Hessian矩阵的正定性用于判断极值点的性质，但原文未明确说明其具体应用。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1877.44,"text":"I don't think there's a very simple way to say it. I think it's not universally true, right? So in some sense, I think maybe if I can only use one or two sentences, I think it's kind of like just in high dimension, there's always some ways to... Like local minimum is your hashing at that point. It's just in all directions positive, semi-definite. That's a very hard thing to satisfy."},{"start":1904.31,"text":"So you find a stationary point where the gradient is 0, and you create a Hessian. The Hessian always have some direction which is negative. And I was thinking about how to formalize this. So for example, if you think about it, the gradient 0 is already a pretty strong constraint. Suppose you have a d-dimensional function, and you"},{"start":1928.05,"text":"add the constraints that each of the dimension of the gradient is zero, that's already restrict yourself a lot. And if you add another thing, which is the Hessian is positive semi-definite."},{"start":1937.96,"text":"I think that just makes the number of points much smaller. And in some cases, you can compute. In one of my papers, I think we tried to compute the number of local minimals by using this. I think in differential geometry, there's something called Cat's Res formula. And actually, not only my papers, but many other people's papers. So in certain cases, you can compute, or you can count, and you find out that, oh, all the local minima are actually just those. The number of local minima is the same as the number of global minima. But generally, it's very hard to count. Any other questions?"},{"start":1971.12,"text":"OK, sounds great. So going back to here, so that's the algorithm people do. Of course, practically speaking, you don't also just only sample one example each time. Because sampling one example, using all the examples is too inefficient because you have to compute all the gradients. Doing one example, the downside is that it's too noisy. So sometimes you want to have like a"},{"start":1994.68,"text":"a trade-off. You want to have a few examples and so that you can be a little bit less noisy. And another thing is that, which probably we won't go in detail here, but another thing is that when you have one example, your GPU has issues too low."},{"start":2012.41,"text":"It's not always the case, but in some cases, using too few of examples make your GPUization too low. For example, if you have like 10,000 GPUs and you just only compute one example of one gradient each time, then most of the GPUs are actually idle. So that's why you need a so-called batch gradient descent. Also, I think it's also still called stochastic gradient descent with some kind of small batches. I think SGD just means like..."}],"speech_gaps":[],"frame":"../frames/v050/012.webp","frame_time":1889.44},{"title":"神经网络架构与监督学习框架","segments":[{"id":265,"text":"both the version with batch size 1 or a bigger batch. So when you have a bigger batch, you can imagine what it is. Basically, you just say, I'm going to, with batches, I guess let's call it SGD. So I think you just change the algorithm to be your sample, say, B examples from 1 to N. And then you say,","start":2037.33,"end":2065.06},{"id":266,"text":"theta is equal to theta minus eta gradient. OK, sounds good. So this is just a general introduction to the framework for the supervised learning. And actually, in some of the unsupervised learning, it's the same thing. You define a loss function for each example, then you average them. The only question is, when you have unsupervised learning later,","start":2067.33,"end":2102.4},{"id":267,"text":"that we'll cover, you don't have the y's. But still, the framework is the same. You define the loss functions, but the loss functions involve y, and then you have the average loss functions, then you run the optimizers. You can choose different types of optimizers.","start":2103.1,"end":2115.8},{"id":268,"text":"And then pretty much there are two questions we're going to address. So the two main questions. Question one is that what is this function h theta? So this whole framework works for every function h theta. And oh, h theta bar. I think I use bar just because it's a little bit different. Without bar, it's just a.","start":2118.3,"end":2141.3},{"id":269,"text":"I just want to distinguish it from the regression case, but they mean the same thing.","start":2141.73,"end":2145.37},{"id":270,"text":"And so, and the question, so question one is how do you define each data?","start":2146.03,"end":2149.63},{"id":271,"text":"And question two is how do we compute, how to","start":2149.79,"end":2153.57},{"id":272,"text":"compute the gradient, the gradient j on each of the examples.","start":2156.05,"end":2160.71},{"id":273,"text":"And once you know how to compute the gradient for each of the example,","start":2161.41,"end":2163.73},{"id":274,"text":"you can compute the gradient for all the examples or batch the examples","start":2163.83,"end":2166.43},{"id":275,"text":"by averaging the gradient for every examples.","start":2167.33,"end":2169.37},{"id":276,"text":"examples.","start":2169.37,"end":2169.49},{"id":277,"text":"So this is called backpropagation.","start":2169.73,"end":2173.19},{"id":278,"text":"The algorithm for this is called backpropagation","start":2173.33,"end":2175.13},{"id":279,"text":"or autodifferentiation, which is the topic of next lecture.","start":2175.13,"end":2178.37},{"id":280,"text":"And in the rest of this lecture, I'm","start":2178.71,"end":2180.43},{"id":281,"text":"going to define a bunch of H data that people are using.","start":2180.43,"end":2183.11},{"id":282,"text":"Mostly for more classical cases, like vision cases,","start":2183.83,"end":2187.15},{"id":283,"text":"like supercerning.","start":2187.23,"end":2188.11},{"id":284,"text":"And of course, for language case,","start":2190.27,"end":2192.25},{"id":285,"text":"you're going to have even more complicated nonlinear functions","start":2192.47,"end":2195.63},{"id":286,"text":"like transformers.","start":2195.63,"end":2196.47},{"id":287,"text":"Okay, so that's the plan.","start":2197.49,"end":2201.07},{"id":288,"text":"I'm going to start with the very basics like new artworks.","start":2202.73,"end":2206.15},{"id":289,"text":"So we're still using this kind of housing examples.","start":2206.31,"end":2214.25}],"notes":["本段介绍了监督学习的基本框架，包括批量梯度下降（SGD）的算法，以及如何通过定义损失函数并平均它们来处理不同批次大小的情况。在无监督学习中，虽然没有标签（y），但框架仍然适用，只是损失函数的定义有所不同。","讲者提到监督学习和无监督学习在框架上是相似的，但无监督学习中没有标签，因此损失函数的定义和计算方式会有所变化。这为后续讨论无监督学习的框架奠定了基础。","本段还提出了两个主要问题：一是如何定义每个数据点的函数（hθ），二是如何计算每个示例的梯度。这两个问题构成了神经网络训练的核心。","讲者提到，一旦知道如何计算每个示例的梯度，就可以通过平均所有示例的梯度来计算整个批次的梯度，这正是反向传播（backpropagation）算法的核心思想。","反向传播算法是神经网络训练中的关键步骤，它通过计算损失函数相对于网络参数的梯度来更新参数。讲者提到反向传播也被称为自动微分（autodifferentiation），并指出这是下节课的主题。","最后，讲者提到将在接下来的课程中介绍一些经典的数据集和模型，如视觉任务中的数据集和语言任务中的Transformer模型，这些模型涉及更复杂的非线性函数。"],"formulas":[],"uncertainties":["supercerning"],"diagram":"none","start":2037.33,"end":2214.25,"asr_flags":[276,289],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2037.33,"text":"both the version with batch size 1 or a bigger batch. So when you have a bigger batch, you can imagine what it is. Basically, you just say, I'm going to, with batches, I guess let's call it SGD. So I think you just change the algorithm to be your sample, say, B examples from 1 to N. And then you say,"},{"start":2067.33,"text":"theta is equal to theta minus eta gradient. OK, sounds good. So this is just a general introduction to the framework for the supervised learning. And actually, in some of the unsupervised learning, it's the same thing. You define a loss function for each example, then you average them. The only question is, when you have unsupervised learning later,"},{"start":2103.1,"text":"that we'll cover, you don't have the y's. But still, the framework is the same. You define the loss functions, but the loss functions involve y, and then you have the average loss functions, then you run the optimizers. You can choose different types of optimizers."},{"start":2118.3,"text":"And then pretty much there are two questions we're going to address. So the two main questions. Question one is that what is this function h theta? So this whole framework works for every function h theta. And oh, h theta bar. I think I use bar just because it's a little bit different. Without bar, it's just a."},{"start":2141.73,"text":"I just want to distinguish it from the regression case, but they mean the same thing."},{"start":2146.03,"text":"And so, and the question, so question one is how do you define each data?"},{"start":2149.79,"text":"And question two is how do we compute, how to"},{"start":2156.05,"text":"compute the gradient, the gradient j on each of the examples."},{"start":2161.41,"text":"And once you know how to compute the gradient for each of the example,"},{"start":2163.83,"text":"you can compute the gradient for all the examples or batch the examples"},{"start":2167.33,"text":"by averaging the gradient for every examples."},{"start":2169.37,"text":"examples."},{"start":2169.73,"text":"So this is called backpropagation."},{"start":2173.33,"text":"The algorithm for this is called backpropagation"},{"start":2175.13,"text":"or autodifferentiation, which is the topic of next lecture."},{"start":2178.71,"text":"And in the rest of this lecture, I'm"},{"start":2180.43,"text":"going to define a bunch of H data that people are using."},{"start":2183.83,"text":"Mostly for more classical cases, like vision cases,"},{"start":2187.23,"text":"like supercerning."},{"start":2190.27,"text":"And of course, for language case,"},{"start":2192.47,"text":"you're going to have even more complicated nonlinear functions"},{"start":2195.63,"text":"like transformers."},{"start":2197.49,"text":"Okay, so that's the plan."},{"start":2202.73,"text":"I'm going to start with the very basics like new artworks."},{"start":2206.31,"text":"So we're still using this kind of housing examples."}],"speech_gaps":[],"frame":"../frames/v050/013.webp","frame_time":2049.33},{"title":"神经网络架构与非线性模型的引入","segments":[{"id":290,"text":"I know that this example is probably too old,","start":2215.09,"end":2217.43},{"id":291,"text":"like it's 20 years old.","start":2217.45,"end":2218.31},{"id":292,"text":"So let's say suppose you have like to","start":2218.55,"end":2221.15},{"id":293,"text":"motivate the introduction of nonlinear models.","start":2221.15,"end":2224.91},{"id":294,"text":"Although suppose you have like size and like this is the price, right?","start":2224.91,"end":2229.69},{"id":295,"text":"That's housing price prediction.","start":2232.93,"end":2234.17},{"id":296,"text":"So, you know, if you look at the real data, most likely something like this.","
