的架构与激活函数","segments":[{"id":326,"text":"this function can be written as value of t maybe plus c, something like this. Oh sorry, value of","start":2390.33,"end":2399.33},{"id":327,"text":"Let's say this one will be written as ReLU of wx plus b plus c. So basically, you introduce. So if you don't have the ReLU, then it's basically a linear function. But if you have the ReLU, then you just somehow change the shape a little bit. And also, this ReLU is often called activation function.","start":2402.02,"end":2420.16},{"id":328,"text":"I think the reason for the word activation is because there's some kind of like connections to biological networks. I think in biology, you know, like in your brain, the neurons kind of like how the neurons are fired up is a nonlinear function of the stimulus it receives from other neurons.","start":2422.41,"end":2441.01},{"id":329,"text":"It's not exactly this, but it's something like this. So when it's passing some threshold, the neurons got fired up. And below that threshold, the neurons just doesn't do anything. So that's why it's called activation, if it's fired up. But I think in biology, I'm not an expert there. But based on my knowledge of it, the threshold function is never exactly like this. Sometimes it's sigmoid. And that's why sigmoid was used.","start":2443.1,"end":2472.24},{"id":330,"text":"at the very beginning of deep learning. But then later on, people realized that this value is actually a bad idea for","start":2472.43,"end":2482.99},{"id":331,"text":"for neural networks for various computational reasons, which we'll probably discuss in a bit. Anyway, so for now, I think that's just to remember this concept. So actually, we have already defined a one-dimensional neural network. So basically, this is a neural network with one-dimensional input and a few parameters. So that's already a neural network. So then the rest of the 10, 15 minutes, we are just going to generalize this to multiple.","start":2483.83,"end":2512.31},{"id":332,"text":"um higher dimensions you know like and you apply this multiple times and that will make it a more complex networks and then we're going to even build more on top of that so um okay so next what do we do so so this is only one dimensional input right and so now let's try to do a higher dimensional case right so suppose you have a","start":2513.36,"end":2534.98},{"id":333,"text":"data with dimension d. And then how do you imitate this and make it nonlinear? So the way to do it is that you say I have x in d, and then I have a parameter w, which is also in dimension d. And often this is called weight.","start":2535.91,"end":2550.47}],"notes":["本段讲授了神经网络中的激活函数，特别是ReLU函数。讲者指出，ReLU函数可以将线性函数转换为非线性函数，从而改变网络的输出形状。同时，讲者提到ReLU被称为激活函数的原因，与生物神经元的激活机制有关，即当输入超过某个阈值时，神经元被激活，否则不响应。","讲者进一步解释了生物神经元的激活机制，指出在生物学中，神经元的激活通常不是简单的阈值函数，而是更复杂的函数，如Sigmoid函数。这解释了为什么早期深度学习中使用Sigmoid函数。","讲者提到，虽然ReLU函数在深度学习的早期阶段被使用，但后来人们发现它在某些计算上存在问题，这将在后续讨论。这表明，虽然ReLU是常用的激活函数，但它并非完美，存在一些局限性。","讲者随后转向神经网络的架构，指出已经定义了一个一维神经网络，并计划将其推广到更高维度。这表明课程正在从基础概念逐步扩展到更复杂的模型。","讲者提到，为了处理更高维度的数据，需要将输入和参数都扩展到相应的维度，并且通常将参数称为权重。这说明了神经网络中权重和输入维度之间的关系。","讲者最后提到，接下来将讨论如何将一维神经网络推广到更高维度，并构建更复杂的网络结构。这表明课程将逐步深入，从简单模型到复杂模型的构建过程。"],"formulas":[],"uncertainties":["this function can be written as value of t maybe plus c, something like this. Oh sorry, value of","this value is actually a bad idea for"],"diagram":"none","start":2390.33,"end":2550.47,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2390.33,"text":"this function can be written as value of t maybe plus c, something like this. Oh sorry, value of"},{"start":2402.02,"text":"Let's say this one will be written as ReLU of wx plus b plus c. So basically, you introduce. So if you don't have the ReLU, then it's basically a linear function. But if you have the ReLU, then you just somehow change the shape a little bit. And also, this ReLU is often called activation function."},{"start":2422.41,"text":"I think the reason for the word activation is because there's some kind of like connections to biological networks. I think in biology, you know, like in your brain, the neurons kind of like how the neurons are fired up is a nonlinear function of the stimulus it receives from other neurons."},{"start":2443.1,"text":"It's not exactly this, but it's something like this. So when it's passing some threshold, the neurons got fired up. And below that threshold, the neurons just doesn't do anything. So that's why it's called activation, if it's fired up. But I think in biology, I'm not an expert there. But based on my knowledge of it, the threshold function is never exactly like this. Sometimes it's sigmoid. And that's why sigmoid was used."},{"start":2472.43,"text":"at the very beginning of deep learning. But then later on, people realized that this value is actually a bad idea for"},{"start":2483.83,"text":"for neural networks for various computational reasons, which we'll probably discuss in a bit. Anyway, so for now, I think that's just to remember this concept. So actually, we have already defined a one-dimensional neural network. So basically, this is a neural network with one-dimensional input and a few parameters. So that's already a neural network. So then the rest of the 10, 15 minutes, we are just going to generalize this to multiple."},{"start":2513.36,"text":"um higher dimensions you know like and you apply this multiple times and that will make it a more complex networks and then we're going to even build more on top of that so um okay so next what do we do so so this is only one dimensional input right and so now let's try to do a higher dimensional case right so suppose you have a"},{"start":2535.91,"text":"data with dimension d. And then how do you imitate this and make it nonlinear? So the way to do it is that you say I have x in d, and then I have a parameter w, which is also in dimension d. And often this is called weight."}],"speech_gaps":[],"frame":"../frames/v050/015.webp","frame_time":2402.33},{"title":"神经网络的基本架构与示例","segments":[{"id":334,"text":"vector. And actually, eventually, it will be weight matrices. So that's why weight and matrix are associated together. Weight vector is rare cases. And then you also introduce another number, B. This is called bias. And then you define your model like this. Say ReLU.","start":2553.25,"end":2573.02},{"id":335,"text":"of w transpose x plus b. This is an inner product between two vectors, and you get the scalar out of it. And then you add another bias, which is still a scalar, so the output of this is a scalar. And so then basically we have like a...","start":2573.87,"end":2588.72},{"id":336,"text":"of high-dimensional inputs and one-dimensional outputs. This is actually called a one-layer network. So basically, you apply this value once. And now, let's try to stack multiple","start":2589.99,"end":2604.47},{"id":337,"text":"So this is one neuron, actually.","start":2605.64,"end":2607.2},{"id":338,"text":"Because you apply one activation in some sense, it's one neuron.","start":2607.3,"end":2610.18},{"id":339,"text":"And then you can have multiple neurons.","start":2610.52,"end":2611.86},{"id":340,"text":"So I think one of the typical examples I used to give,","start":2612.5,"end":2614.82},{"id":341,"text":"maybe this is not exactly the best example these days.","start":2614.98,"end":2616.98},{"id":342,"text":"For example, I say, suppose you think about the housing price.","start":2617.24,"end":2619.8},{"id":343,"text":"So it probably depends on a lot of intermediate features.","start":2620.7,"end":2623.42},{"id":344,"text":"Suppose housing price depends on, for example, maybe, OK,","start":2623.82,"end":2627.28},{"id":345,"text":"maybe I'll give you the full example just to slow down","start":2627.36,"end":2629.98},{"id":346,"text":"a little bit.","start":2629.98,"end":2630.4},{"id":347,"text":"Let's say, suppose you have these cases where x1 is the size,","start":2630.66,"end":2634.12},{"id":348,"text":"is. x2 is the number of bedroom. And x3 is, let's say, the zip code. And maybe x4 is, let's see,","start":2634.12,"end":2647.7},{"id":349,"text":"maybe the, I don't know what x4 is in my notes means. But anyways, this is your raw inputs,","start":2649.32,"end":2658.78},{"id":350,"text":"right? So maybe you can think of like there are some intermediate things that","start":2658.9,"end":2663.72},{"id":351,"text":"that actually matters more than these raw inputs.","start":2663.72,"end":2666.48},{"id":352,"text":"Let's say you have intermediate quantities.","start":2667.0,"end":2672.46},{"id":353,"text":"Quantities, like for example,","start":2674.38,"end":2676.0},{"id":354,"text":"you say walkability, how easy it is to walk around the house.","start":2676.06,"end":2685.92},{"id":355,"text":"Maybe there's another one which is the school quality.","start":2686.24,"end":2688.38},{"id":356,"text":"So these are, in some sense, variables that are not present in your original data,","start":2690.92,"end":2695.74},{"id":357,"text":"but they matter a lot to the price of the house. And each of this, maybe let's call this a1,","start":2695.88,"end":2702.94},{"id":358,"text":"this is a2. Each of this is actually a function of x1 up to x4, which can be computed as some","start":2703.06,"end":2708.04},{"id":359,"text":"nonlinear function. So you can imagine a1 is probably some kind of like a nonlinear function","start":2708.04,"end":2714.42},{"id":360,"text":"function of maybe value of some of these linear combinations","start":2714.42,"end":2719.4},{"id":361,"text":"of this thing.","start":2719.4,"end":2721.34},{"id":362,"text":"And you can imagine maybe A2 is also some nonlinear function.","start":2724.24,"end":2727.8}],"notes":["本段讲解了神经网络的基本架构，包括权重矩阵、偏置项和激活函数。权重矩阵和向量的区别被强调，权重向量是罕见的情况。偏置项是一个标量，与权重矩阵一起构成神经网络的基本单元。","接着，讲者介绍了单层网络的结构，即输入是高维向量，输出是标量。通过将多个这样的单元堆叠，可以构建多层网络。单个神经元的定义是应用一次激活函数，而多个神经元则构成更复杂的网络。","讲者以房价预测为例，说明了神经网络如何处理原始输入特征，并通过中间变量（如步行便利性和学校质量）来捕捉更复杂的模式。这些中间变量不是原始数据的一部分，但对输出有重要影响。","讲者提到，这些中间变量是原始输入特征的非线性函数，通过线性组合和非线性变换来计算。这展示了神经网络如何通过多层结构学习复杂的特征表示。","讲者强调，神经网络的结构允许从原始输入中提取更高级的特征，从而提高模型的表达能力和预测性能。","最后，讲者指出，虽然这个例子可能不是当前最合适的，但它有助于理解神经网络的基本思想和工作原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2553.25,"end":2727.8,"asr_flags":[349,352,354],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2553.25,"text":"vector. And actually, eventually, it will be weight matrices. So that's why weight and matrix are associated together. Weight vector is rare cases. And then you also introduce another number, B. This is called bias. And then you define your model like this. Say ReLU."},{"start":2573.87,"text":"of w transpose x plus b. This is an inner product between two vectors, and you get the scalar out of it. And then you add another bias, which is still a scalar, so the output of this is a scalar. And so then basically we have like a..."},{"start":2589.99,"text":"of high-dimensional inputs and one-dimensional outputs. This is actually called a one-layer network. So basically, you apply this value once. And now, let's try to stack multiple"},{"start":2605.64,"text":"So this is one neuron, actually."},{"start":2607.3,"text":"Because you apply one activation in some sense, it's one neuron."},{"start":2610.52,"text":"And then you can have multiple neurons."},{"start":2612.5,"text":"So I think one of the typical examples I used to give,"},{"start":2614.98,"text":"maybe this is not exactly the best example these days."},{"start":2617.24,"text":"For example, I say, suppose you think about the housing price."},{"start":2620.7,"text":"So it probably depends on a lot of intermediate features."},{"start":2623.82,"text":"Suppose housing price depends on, for example, maybe, OK,"},{"start":2627.36,"text":"maybe I'll give you the full example just to slow down"},{"start":2629.98,"text":"a little bit."},{"start":2630.66,"text":"Let's say, suppose you have these cases where x1 is the size,"},{"start":2634.12,"text":"is. x2 is the number of bedroom. And x3 is, let's say, the zip code. And maybe x4 is, let's see,"},{"start":2649.32,"text":"maybe the, I don't know what x4 is in my notes means. But anyways, this is your raw inputs,"},{"start":2658.9,"text":"right? So maybe you can think of like there are some intermediate things that"},{"start":2663.72,"text":"that actually matters more than these raw inputs."},{"start":2667.0,"text":"Let's say you have intermediate quantities."},{"start":2674.38,"text":"Quantities, like for example,"},{"start":2676.06,"text":"you say walkability, how easy it is to walk around the house."},{"start":2686.24,"text":"Maybe there's another one which is the school quality."},{"start":2690.92,"text":"So these are, in some sense, variables that are not present in your original data,"},{"start":2695.88,"text":"but they matter a lot to the price of the house. And each of this, maybe let's call this a1,"},{"start":2703.06,"text":"this is a2. Each of this is actually a function of x1 up to x4, which can be computed as some"},{"start":2708.04,"text":"nonlinear function. So you can imagine a1 is probably some kind of like a nonlinear function"},{"start":2714.42,"text":"function of maybe value of some of these linear combinations"},{"start":2719.4,"text":"of this thing."},{"start":2724.24,"text":"And you can imagine maybe A2 is also some nonlinear function."}],"speech_gaps":[],"frame":"../frames/v050/016.webp","frame_time":2565.25},{"title":"神经网络架构的组成与形式化定义","segments":[{"id":363,"text":"of this, of maybe I say zeta. I'm using notations in a pretty sloppy way just to give you an example. Finally, we're going to define things more formally. And then you can say, oh, maybe my final y should be a linear combination of these guys. Maybe I have another parameter, maybe zeta 9, a1 plus zeta 10, a2, something like this.","start":2728.69,"end":2749.61},{"id":364,"text":"So then this way you kind of like stack two layers on top. You have two neurons and you stack another linear function on top of it. So sometimes you are applying this recursively.","start":2750.08,"end":2758.94},{"id":365,"text":"So that's kind of like the fundamental idea on how do you kind of compose. So basically, you apply these nonlinear functions. You apply a linear function. You apply some nonlinear functions. And then you get some articles. And then you apply another linear version. And you can probably apply another nonlinear function here. And then you keep compose. So that's the rough idea. But let's try to make it a little more formal so that it's probably more obvious.","start":2760.64,"end":2786.59},{"id":366,"text":"Let's see what's the right way for me to erase this stuff. I think we can probably start from the left. So one of the ways that people used to draw this kind of things, at least 10 years ago, was that they draw this kind of inputs like this. Suppose you have x1 up to xd. And then you say, I have some intermediate variables, a1 up to ad.","start":2789.29,"end":2828.86},{"id":367,"text":"maybe am, and then each of the intermediate variables depend on all of this, and they have some dependencies here. So let's say am depends on all of the input variables, and you just draw these edges, and then you can say I have another layer of intermediate variables, and they connect to each other. So these drawings are, once you know what they are talking about, the drawings are very useful, but when you don't really know what they are talking about, it's confusing. So what I really mean here is that","start":2829.77,"end":2857.48},{"id":368,"text":"The way you do it is that you say first, let's say, let's do only one layer, maybe just to formulate. So we have x1 up to xd, right? So then let's have a1. The first intermediate variable is defined as maybe ReLU of w, say, 1x1 plus b1, where w1 is a vector, even though I have an index 1, but it's the first vector.","start":2858.36,"end":2886.33}],"notes":["本段主要讲解神经网络的架构组成，通过非线性函数和线性函数的交替应用来构建网络。讲者提到，通过将多个层堆叠在一起，可以递归地应用这些函数，从而形成更复杂的模型。"],"formulas":[],"uncertainties":["articles"],"diagram":"none","start":2728.69,"end":2886.33,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2728.69,"text":"of this, of maybe I say zeta. I'm using notations in a pretty sloppy way just to give you an example. Finally, we're going to define things more formally. And then you can say, oh, maybe my final y should be a linear combination of these guys. Maybe I have another parameter, maybe zeta 9, a1 plus zeta 10, a2, something like this."},{"start":2750.08,"text":"So then this way you kind of like stack two layers on top. You have two neurons and you stack another linear function on top of it. So sometimes you are applying this recursively."},{"start":2760.64,"text":"So that's kind of like the fundamental idea on how do you kind of compose. So basically, you apply these nonlinear functions. You apply a linear function. You apply some nonlinear functions. And then you get some articles. And then you apply another linear version. And you can probably apply another nonlinear function here. And then you keep compose. So that's the rough idea. But let's try to make it a little more formal so that it's probably more obvious."},{"start":2789.29,"text":"Let's see what's the right way for me to erase this stuff. I think we can probably start from the left. So one of the ways that people used to draw this kind of things, at least 10 years ago, was that they draw this kind of inputs like this. Suppose you have x1 up to xd. And then you say, I have some intermediate variables, a1 up to ad."},{"start":2829.77,"text":"maybe am, and then each of the intermediate variables depend on all of this, and they have some dependencies here. So let's say am depends on all of the input variables, and you just draw these edges, and then you can say I have another layer of intermediate variables, and they connect to each other. So these drawings are, once you know what they are talking about, the drawings are very useful, but when you don't really know what they are talking about, it's confusing. So what I really mean here is that"},{"start":2858.36,"text":"The way you do it is that you say first, let's say, let's do only one layer, maybe just to formulate. So we have x1 up to xd, right? So then let's have a1. The first intermediate variable is defined as maybe ReLU of w, say, 1x1 plus b1, where w1 is a vector, even though I have an index 1, but it's the first vector."}],"speech_gaps":[],"frame":"../frames/v050/017.webp","frame_time":2740.69},{"title":"神经网络架构的定义与表示","segments":[{"id":369,"text":"W1 transpose. And X is here. X is a d-dimensional vector. W1 is a vector. So the inner part together, you get a scalar. And you add a scalar B1 here. That's how you get A1, which is kind of like what I wrote there, like A1. So I use W just because I think people use W and B to distinguish the weight matrices and the biases. And then you have A2, which is the value of","start":2887.54,"end":2914.81},{"id":370,"text":"W2 transpose X plus B2, where W2 is Rd and B2 is in R. And you have a bunch of this. Let's say you have like up to Am. Let me see whether Am is my notation here. It's very easy to mess up the notation in this kind of cases. Yes, Am is ReLU of Wm transpose X plus Bm. And that's how you define A1 up to Am.","start":2915.97,"end":2944.71},{"id":371,"text":"Each of the AIs depends on all of the XIs in this particular way. Then you can say, I'm going to apply another, my output will just be a linear combination of all of these AIs. Let's say the output is some linear combination of the AIs plus another.","start":2945.83,"end":2962.85},{"id":372,"text":"plus another biases. So here is the thing. How do I write a linear combination of the AIs? I can write something like theta 1, A1, so on and so forth. But if I always kind of expand it, it's too complicated. So what I'm going to do is I'm going to write a vector. Let's say W transpose A plus another B. But you realize that when I write this, this W needs to be distinguished from other Ws. And that's why I think I'm going to use this.","start":2964.14,"end":2990.76},{"id":373,"text":"to say that this is the W on the second layer. In some sense, these are the Ws on the first. So there is another. So all of these AIs are combined to H theta X. And that's why people write this is the W on the second layer. And these are the Ws on the first layer. So I'm going to write another bracket, WA1, something like this, to distinguish the first layer and the second layer. And this W2,","start":2993.38,"end":3024.34},{"id":374,"text":"super square bracket two is a vector of the same dimension as A, not of the same dimension as X anymore because you have to compile. You have to inner product with A. So this is in dimension RM because I have an entries here. And B is always a scalar. So that's how you define a two-layer network. So you have a lot of image.","start":3025.52,"end":3049.8}],"notes":["本段讲解了神经网络的架构，包括输入向量X、权重矩阵W和偏置项B的定义。W1和W2是不同层的权重矩阵，而B1和B2是对应的偏置项。A1和A2是通过线性变换和激活函数（如ReLU）得到的中间输出。","在定义A1到Am时，强调了每个A_i依赖于所有X_i，并且通过ReLU函数进行非线性变换。这表明神经网络的每一层都依赖于前一层的输出。","输出层是所有中间输出A_i的线性组合，加上另一个偏置项。为了区分不同层的权重，使用了不同的符号，如W1和W2分别表示第一层和第二层的权重。","在表示输出时，使用了向量形式W^T A + B，其中W是第二层的权重，A是中间输出的向量。这表明输出层的权重需要与前一层的权重区分开。","W2的维度是RM，因为需要与中间输出A进行内积运算。B始终是一个标量，这表明偏置项在每一层都是单独的。","最后提到，通过这种方式定义了两层神经网络的结构，强调了不同层之间的权重和偏置项的区分，以及它们在计算中的作用。"],"formulas":[{"latex":"A_1 = W_1^T X + B_1","symbols":"A1 是第一层的输出，W1 是第一层的权重向量，X 是输入向量，B1 是第一层的偏置项","explanation":"公式正确，符合线性变换的定义，W1 是向量，X 是 d 维向量，结果为标量，加上标量 B1 得到 A1。","evidence":"W1 transpose. And X is here. X is a d-dimensional vector. W1 is a vector. So the inner part together, you get a scalar. And you add a scalar B1 here. That's how you get A1, which is kind of like what I wrote there, like A1. So I use W just because I think people use W and B to distinguish the weight matrices and the biases. And then you have A2, which is the value of"},{"latex":"A_m = \\text{ReLU}(W_m^T X + B_m)","symbols":"Am 是第m层的输出，Wm 是第m层的权重向量，Bm 是第m层的偏置项","explanation":"公式正确，ReLU 是激活函数，Wm 是向量，X 是输入向量，结果为标量，加上标量 Bm 得到 Am。","evidence":"W2 transpose X plus B2, where W2 is Rd and B2 is in R. And you have a bunch of this. Let's say you have like up to Am. Let me see whether Am is my notation here. It's very easy to mess up the notation in this kind of cases. Yes, Am is ReLU of Wm transpose X plus Bm. And that's how you define A1 up to Am."}],"uncertainties":["可能的术语错误：'compile' 在上下文中可能指代 'compile' 或 'combine'，但无法确定具体含义。","可能的术语错误：'super square bracket two' 可能指代某种特定的符号或表示方式，但无法确定具体含义。","可能的术语错误：'RM' 可能指代某种维度，但无法确定具体含义。"],"diagram":"none","start":2887.54,"end":3049.8,"asr_flags":[],"math_clarifications":["公式 2 中的 W 应该是第二层的权重矩阵，但未明确其维度，且未说明 A 是中间输出的向量，因此无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2887.54,"text":"W1 transpose. And X is here. X is a d-dimensional vector. W1 is a vector. So the inner part together, you get a scalar. And you add a scalar B1 here. That's how you get A1, which is kind of like what I wrote there, like A1. So I use W just because I think people use W and B to distinguish the weight matrices and the biases. And then you have A2, which is the value of"},{"start":2915.97,"text":"W2 transpose X plus B2, where W2 is Rd and B2 is in R. And you have a bunch of this. Let's say you have like up to Am. Let me see whether Am is my notation here. It's very easy to mess up the notation in this kind of cases. Yes, Am is ReLU of Wm transpose X plus Bm. And that's how you define A1 up to Am."},{"start":2945.83,"text":"Each of the AIs depends on all of the XIs in this particular way. Then you can say, I'm going to apply another, my output will just be a linear combination of all of these AIs. Let's say the output is some linear combination of the AIs plus another."},{"start":2964.14,"text":"plus another biases. So here is the thing. How do I write a linear combination of the AIs? I can write something like theta 1, A1, so on and so forth. But if I always kind of expand it, it's too complicated. So what I'm going to do is I'm going to write a vector. Let's say W transpose A plus another B. But you realize that when I write this, this W needs to be distinguished from other Ws. And that's why I think I'm going to use this."},{"start":2993.38,"text":"to say that this is the W on the second layer. In some sense, these are the Ws on the first. So there is another. So all of these AIs are combined to H theta X. And that's why people write this is the W on the second layer. And these are the Ws on the first layer. So I'm going to write another bracket, WA1, something like this, to distinguish the first layer and the second layer. And this W2,"},{"start":3025.52,"text":"super square bracket two is a vector of the same dimension as A, not of the same dimension as X anymore because you have to compile. You have to inner product with A. So this is in dimension RM because I have an entries here. And B is always a scalar. So that's how you define a two-layer network. So you have a lot of image."}],"speech_gaps":[],"frame":"../frames/v050/018.webp","frame_time":2899.54},{"title":"神经网络架构与向量表示","segments":[{"id":375,"text":"And you can see this notation is kind of messy. So you probably shouldn't. When you have so many superscripts and subscripts, at some point, it's kind of too messy. So that's why for most of the cases, some cases you have to live with these notations. But in most cases, you can simplify even further. You say, actually, if I write everything as matrices and vectors, I don't have to really think about each of these details. So basically, I just write A.","start":3050.55,"end":3079.53},{"id":376,"text":"as a vector in, this is a vector in Rn.","start":3080.26,"end":3082.78},{"id":377,"text":"You can write as ReLU of a matrix W times X plus B.","start":3083.1,"end":3088.34},{"id":378,"text":"And here, W and B are a little bit different.","start":3088.84,"end":3092.04},{"id":379,"text":"Okay. So W, I guess I need to write W1 and B1.","start":3092.52,"end":3099.0},{"id":380,"text":"So this is a matrix W1.","start":3100.72,"end":3102.8},{"id":381,"text":"If you want to look, understand","start":3103.56,"end":3105.08},{"id":382,"text":"the correspondence between this notation and this notation.","start":3105.08,"end":3107.8},{"id":383,"text":"So W1 is this matrix of dimension m by d.","start":3107.8,"end":3114.08},{"id":384,"text":"And each row is W1 transpose up to W1 transpose.","start":3116.1,"end":3126.42},{"id":385,"text":"So you put all of these row vectors,","start":3126.72,"end":3128.92},{"id":386,"text":"because once you transpose, by the way,","start":3129.08,"end":3130.4},{"id":387,"text":"all the vectors are supposed to be column vectors","start":3130.42,"end":3132.06},{"id":388,"text":"if you don't do any transpose.","start":3132.06,"end":3133.32},{"id":389,"text":"If you really don't understand this,","start":3133.94,"end":3135.36},{"id":390,"text":"you should try to understand them. At least when, depending on the situations,","start":3135.36,"end":3140.6},{"id":391,"text":"but in many cases, it's good to keep in mind whether this vector is a row vector and column","start":3140.76,"end":3145.92},{"id":392,"text":"vector. So all of these are column vectors. And then you can transpose this into row vectors.","start":3145.92,"end":3151.62},{"id":393,"text":"So this is a row vector. And you put all of them, stack them into a matrix. And then this B one,","start":3151.66,"end":3157.98},{"id":394,"text":"is just the vector of all the scalars.","start":3159.99,"end":3162.21},{"id":395,"text":"But in many cases, you actually don't have to necessarily","start":3166.33,"end":3169.01},{"id":396,"text":"remember this correspondence.","start":3169.01,"end":3170.13},{"id":397,"text":"You just remember this is fine.","start":3170.35,"end":3171.53},{"id":398,"text":"You have a vector, you multiply a matrix, you get a vector,","start":3171.71,"end":3174.29},{"id":399,"text":"and then you add a vector bias, and you take ReLU entrywise.","start":3174.43,"end":3177.05},{"id":400,"text":"That's probably important.","start":3177.57,"end":3178.41},{"id":401,"text":"So ReLU applied to a vector t is the same","start":3178.67,"end":3182.49},{"id":402,"text":"as you applied entrywise.","start":3182.49,"end":3184.51},{"id":403,"text":"So in many cases, you just say, oh, one matrix application,","start":3190.17,"end":3193.09},{"id":404,"text":"one layer is just a matrix, add the bias vector,","start":3193.39,"end":3196.85},{"id":405,"text":"and apply ReLU.","start":3197.11,"end":3198.65},{"id":406,"text":"And you'll get a vector out of it.","start":3198.73,"end":3200.01},{"id":407,"text":"So you don't have to necessarily understand all the details.","start":3200.25,"end":3202.37},{"id":408,"text":"Sometimes you do, but in most cases these days,","start":3202.55,"end":3204.89},{"id":409,"text":"you don't have to.","start":3204.93,"end":3205.47},{"id":410,"text":"So and if you count how many parameters are there,","start":3207.03,"end":3213.27},{"id":411,"text":"this is m by d, this is the dimension.","start":3213.37,"end":3215.85},{"id":412,"text":"So m by d, because the input dimension is d,","start":3216.37,"end":3219.45},{"id":413,"text":"the output dimension is m. And in a matrix that turns the d-dimensional input to m-dimensional","start":3219.45,"end":3224.23},{"id":414,"text":"outputs, that's why you need m times d parameters. And then this guy has m parameters. So the total","start":3224.23,"end":3229.95}],"notes":["本段主要讲解了神经网络中向量和矩阵表示的简化方法。讲者指出，当使用大量上标和下标时，表示会变得复杂，因此通常会使用矩阵和向量来简化表示。例如，将输入表示为向量，权重矩阵W和偏置向量B的结构，以及如何通过矩阵乘法和ReLU激活函数进行计算。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3050.55,"end":3229.95,"asr_flags":[410],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3050.55,"text":"And you can see this notation is kind of messy. So you probably shouldn't. When you have so many superscript subscripts, at some point, it's kind of too messy. So that's why for most of the cases, some cases you have to live with these notations. But in most cases, you can simplify even further. You say, actually, if I write everything as matrices and vectors, I don't have to really think about each of these details. So basically, I just write A."},{"start":3080.26,"text":"as a vector in, this is a vector in Rn."},{"start":3083.1,"text":"You can write as ReLU of a matrix W times X plus B."},{"start":3088.84,"text":"And here, W and B are a little bit different."},{"start":3092.52,"text":"Okay. So W, I guess I need to write W1 and B1."},{"start":3100.72,"text":"So this is a matrix W1."},{"start":3103.56,"text":"If you want to look, understand"},{"start":3105.08,"text":"the correspondence between this notation and this notation."},{"start":3107.8,"text":"So W1 is this matrix of dimension m by d."},{"start":3116.1,"text":"And each row is W1 transpose up to W1 transpose."},{"start":3126.72,"text":"So you put all of these row vectors,"},{"start":3129.08,"text":"because once you transpose, by the way,"},{"start":3130.42,"text":"all the vectors are supposed to be column vectors"},{"start":3132.06,"text":"if you don't do any transpose."},{"start":3133.94,"text":"If you really don't understand this,"},{"start":3135.36,"text":"you should try to understand them. At least when, depending on the situations,"},{"start":3140.76,"text":"but in many cases, it's good to keep in mind whether this vector is a row vector and column"},{"start":3145.92,"text":"vector. So all of these are column vectors. And then you can transpose this into row vectors."},{"start":3151.66,"text":"So this is a row vector. And you put all of them, stack them into a matrix. And then this B one,"},{"start":3159.99,"text":"is just the vector of all the scalars."},{"start":3166.33,"text":"But in many cases, you actually don't have to necessarily"},{"start":3169.01,"text":"remember this correspondence."},{"start":3170.35,"text":"You just remember this is fine."},{"start":3171.71,"text":"You have a vector, you multiply a matrix, you get a vector,"},{"start":3174.43,"text":"and then you add a vector bias, and you take ReLU entrywise."},{"start":3177.57,"text":"That's probably important."},{"start":3178.67,"text":"So ReLU applied to a vector t is the same"},{"start":3182.49,"text":"as you applied entrywise."},{"start":3190.17,"text":"So in many cases, you just say, oh, one matrix application,"},{"start":3193.39,"text":"one layer is just a matrix, add the bias vector,"},{"start":3197.11,"text":"and apply ReLU."},{"start":3198.73,"text":"And you'll get a vector out of it."},{"start":3200.25,"text":"So you don't have to necessarily understand all the details."},{"start":3202.55,"text":"Sometimes you do, but in most cases these days,"},{"start":3204.93,"text":"you don't have to."},{"start":3207.03,"text":"So and if you count how many parameters are there,"},{"start":3213.37,"text":"this is m by d, this is the dimension."},{"start":3216.37,"text":"So m by d, because the input dimension is d,"},{"start":3219.45,"text":"the output dimension is m. And in a matrix that turns the d-dimensional input to m-dimensional"},{"start":3224.23,"text":"outputs, that's why you need m times d parameters. And then this guy has m parameters. So the total"}],"speech_gaps":[],"frame":"../frames/v050/019.webp","frame_time":3062.55},{"title":"神经网络架构与参数","segments":[{"id":415,"text":"parameters, the parameter count is md plus m. So d is the input dimension, m is the output dimension,","start":3229.95,"end":3242.55},{"id":416,"text":"dimension, and this is output dimension.","start":3242.55,"end":3244.33},{"id":417,"text":"Is the b sort of 1, as in the first layer there?","start":3245.69,"end":3251.43},{"id":418,"text":"This is b1, yes.","start":3251.67,"end":3252.65},{"id":419,"text":"And this b1 is this b1.","start":3254.73,"end":3256.37},{"id":420,"text":"So any questions?","start":3261.23,"end":3266.93},{"id":421,"text":"And I think eventually, actually, many of these details","start":3267.83,"end":3272.01},{"id":422,"text":"don't even matter if you don't care so for example you can even just write this like","start":3272.01,"end":3277.71},{"id":423,"text":"for example you can just say oh i i even simplify notation here you can say","start":3284.63,"end":3289.73},{"id":424,"text":"I think you can say, let's just say this is a matrix multiplication. So let's say you have a matrix multiplication with w and b. So w is the weight matrices, which is this w. And b is the bias. And you apply z. And this is just equals to wz plus b. And then you can say I'm going to apply a sigma.","start":3292.64,"end":3325.34},{"id":425,"text":"Sorry, let's say sigma is, I guess maybe I didn't, probably I go a little too fast. I see. So maybe just before I talk about that, I think I already alluded to it. So this red loop here can be also replaced to other nonlinear activations. So you can replace the red loop with some other nonlinear activations.","start":3329.41,"end":3367.92},{"id":426,"text":"And all the other activations are functions that maps R to R. So it's always a scalar function. But you can apply this to vectors by entrywise applying it, applying entrywise. And other activations could be like sigmoid. Sigmoid looks like this.","start":3368.46,"end":3389.53},{"id":427,"text":"Let me just save some time to now define the equations.","start":3391.59,"end":3394.93},{"id":428,"text":"You can read lecture notes to see the exact equations.","start":3395.19,"end":3397.87},{"id":429,"text":"There are also 10H,","start":3398.21,"end":3400.85},{"id":430,"text":"which looks like going through zero and like this.","start":3401.47,"end":3406.11}],"notes":["本段主要讲解神经网络的参数数量计算，其中输入维度为d，输出维度为m，参数数量为md加上m。接着，讲者提到偏置项b1，指出其在第一层中的位置，并强调这些细节在某些情况下可能并不重要。","讲者提到可以简化符号，将神经网络的计算视为矩阵乘法加上偏置项，即z = wz + b，然后应用激活函数σ。这表明神经网络的基本结构由权重矩阵、偏置项和激活函数组成。","讲者提到激活函数可以是任意从实数到实数的函数，例如sigmoid函数，并指出激活函数可以按元素方式应用于向量。这说明激活函数的非线性特性是神经网络能够学习复杂模式的关键。","讲者提到可以参考讲义中的方程来了解更详细的计算过程，但未具体展开。此外，讲者提到10H，但未明确其含义，可能是听不清或未展开的术语。","讲者强调在神经网络中，参数数量的计算和激活函数的选择是构建网络的基础，但这些细节在某些情况下可以被简化或忽略。","讲者提到可以将神经网络的计算简化为矩阵乘法和激活函数的组合，这表明神经网络的基本操作是线性变换加上非线性激活，从而实现非线性建模。"],"formulas":[],"uncertainties":["10H"],"diagram":"none","start":3229.95,"end":3406.11,"asr_flags":[420],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3229.95,"text":"parameters, parameter count is md plus m. So d is the input dimension, m is the output dimension,"},{"start":3242.55,"text":"dimension, and this is output dimension."},{"start":3245.69,"text":"Is the b sort of 1, as in the first layer there?"},{"start":3251.67,"text":"This is b1, yes."},{"start":3254.73,"text":"And this b1 is this b1."},{"start":3261.23,"text":"So any questions?"},{"start":3267.83,"text":"And I think eventually, actually, many of these details"},{"start":3272.01,"text":"don't even matter if you don't care so for example you can even just write this like"},{"start":3284.63,"text":"for example you can just say oh i i even simplify notation here you can say"},{"start":3292.64,"text":"I think you can say, let's just say this is a matrix multiplication. So let's say you have a matrix multiplication with w and b. So w is the weight matrices, which is this w. And b is the bias. And you apply z. And this is just equals to wz plus b. And then you can say I'm going to apply a sigma."},{"start":3329.41,"text":"Sorry, let's say sigma is, I guess maybe I didn't, probably I go a little too fast. I see. So maybe just before I talk about that, I think I already alluded to it. So this red loop here can be also replaced to other nonlinear activations. So you can replace the red loop with some other nonlinear activations."},{"start":3368.46,"text":"And all the other activations are functions that maps R to R. So it's always a scalar function. But you can apply this to vectors by entrywise applying it, applying entrywise. And other activations could be like sigmoid. Sigmoid looks like this."},{"start":3391.59,"text":"Let me just save some time to now define the equations."},{"start":3395.19,"text":"You can read lecture notes to see the exact equations."},{"start":3398.21,"text":"There are also 10H,"},{"start":3401.47,"text":"which looks like going through zero and like this."}],"speech_gaps":[],"frame":"../frames/v050/020.webp","frame_time":3241.95},{"title":"激活函数与神经网络架构","segments":[{"id":431,"text":"So all of these activations are generally increasing functions,","start":3406.37,"end":3410.07},{"id":432,"text":"but not always the case.","start":3410.39,"end":3411.87},{"id":433,"text":"I think there's also leaky value.","start":3412.43,"end":3414.03},{"id":434,"text":"There's a bunch of different activations functions.","start":3414.19,"end":3416.59},{"id":435,"text":"For example, leaky value looks like,","start":3416.83,"end":3418.49},{"id":436,"text":"Now, if this is actually used that much,","start":3419.07,"end":3420.83},{"id":437,"text":"if you want to see what's the use in the latest network,","start":3421.81,"end":3425.59},{"id":438,"text":"I think you have to check the lecture notes.","start":3425.69,"end":3427.17},{"id":439,"text":"I just added a few which I don't have it on my notes.","start":3427.31,"end":3429.91},{"id":440,"text":"But there's also functions like this.","start":3430.31,"end":3432.53},{"id":441,"text":"Anyway, generally, it's like some almost increasing functions and often","start":3434.05,"end":3438.33},{"id":442,"text":"on the left-hand side of the zero is close to zero, but not exactly.","start":3438.33,"end":3443.71},{"id":443,"text":"The one that I just draw,","start":3443.93,"end":3445.17},{"id":444,"text":"Well, this is called Jellu.","start":3445.17,"end":3447.01},{"id":445,"text":"Let me not write.","start":3448.65,"end":3449.69},{"id":446,"text":"I think the definition of it is the Jellu's definition","start":3449.99,"end":3452.45},{"id":447,"text":"is this, just in case you care about the exact equation.","start":3452.45,"end":3458.43},{"id":448,"text":"So it's not exactly nonlinear.","start":3458.87,"end":3460.77},{"id":449,"text":"It just dips a little bit.","start":3460.87,"end":3462.83},{"id":450,"text":"I think it doesn't go above 0, exactly speaking.","start":3463.09,"end":3466.99},{"id":451,"text":"So it dips a little bit, and then it goes up.","start":3468.43,"end":3470.63},{"id":452,"text":"So exactly why you use any of this","start":3470.81,"end":3473.49},{"id":453,"text":"it's kind of like a little kind of like a magic. I think people seem to find out that","start":3473.49,"end":3480.71},{"id":454,"text":"using some kind of somewhat smooth functions is actually useful.","start":3480.71,"end":3484.13},{"id":455,"text":"So ReLU is actually not necessarily great because it's not smooth in","start":3484.27,"end":3487.41},{"id":456,"text":"But other than that, I don't really know exactly. Sometimes it's just the ability thing. Sometimes it's just the trial and error. So that's the activations. So now I'm trying to compact it. I'm trying to have more and more abstract versions so that you don't have to deal with all these notations. So then once you have the activations, you can define this.","start":3488.28,"end":3515.62},{"id":457,"text":"You can, this is just the sigma of WZ plus B. This is the abstract version of that. And then you can compose many times. You can say, I'm going to apply another one. So my model can be like, say, apply a matching location on top of this sigma. And then, right, so WBZ. And then apply another thing, apply another thing, and so on and so forth. And each of this is one layer.","start":3517.36,"end":3546.83},{"id":458,"text":"And then if you apply another machine verification, sigma is another layer. And then if you do another one, it's another layer. The number of layers is defined pretty much as the number of machine verification. But here, one thing I'm going to describe to you about is that I didn't really tell you what's the parameters here in this machine verification. So technically, if you want to write this formula, you have to say, oh, this is W and B, and this is what? Is it still using W and B or some other W and some other B? So oftentimes, you use a different W and different B.","start":3548.38,"end":3575.52}],"notes":["本段主要讲解了激活函数的特性，指出大多数激活函数是单调递增的，但并非总是如此。还提到了漏活函数（leaky value）和Jellu函数，这些函数在神经网络中被使用，但具体定义和用途需要参考讲义。"],"formulas":[],"uncertainties":["leaky value","Jellu","machine verification"],"diagram":"none","start":3406.37,"end":3575.52,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3406.37,"text":"So all of these activations are generally increasing functions,"},{"start":3410.39,"text":"but not always the case."},{"start":3412.43,"text":"I think there's also leaky value."},{"start":3414.19,"text":"There's a bunch of different activations functions."},{"start":3416.83,"text":"For example, leaky value looks like,"},{"start":3419.07,"text":"Now, if this is actually used that much,"},{"start":3421.81,"text":"if you want to see what's the use in the latest network,"},{"start":3425.69,"text":"I think you have to check the lecture notes."},{"start":3427.31,"text":"I just added a few which I don't have it on my notes."},{"start":3430.31,"text":"But there's also functions like this."},{"start":3434.05,"text":"Anyway, generally, it's like some almost increasing functions and often"},{"start":3438.33,"text":"on the left-hand side of the zero is close to zero, but not exactly."},{"start":3443.93,"text":"For example, the one that I just draw,"},{"start":3445.17,"text":"Well, this is called Jellu."},{"start":3448.65,"text":"Let me not write."},{"start":3449.99,"text":"I think the definition of it is the Jellu's definition"},{"start":3452.45,"text":"is this, just in case you care about the exact equation."},{"start":3458.87,"text":"So it's not exactly nonlinear."},{"start":3460.87,"text":"It just dips a little bit."},{"start":3463.09,"text":"I think it doesn't go above 0, exactly speaking."},{"start":3468.43,"text":"So it dips a little bit, and then it goes up."},{"start":3470.81,"text":"So exactly why you use any of this"},{"start":3473.49,"text":"it's kind of like a little kind of like a magic. I think people seem to find out that"},{"start":3480.71,"text":"using some kind of somewhat smooth functions is actually useful."},{"start":3484.27,"text":"So ReLU is actually not necessarily great because it's not smooth in"},{"start":3488.28,"text":"But other than that, I don't really know exactly. Sometimes it's just the ability thing. Sometimes it's just the trial and error. So that's the activations. So now I'm trying to compact it. I'm trying to have more and more abstract versions so that you don't have to deal with all these notations. So then once you have the activations, you can define this."},{"start":3517.36,"text":"You can, this is just the sigma of WZ plus B. This is the abstract version of that. And then you can compose many times. You can say, I'm going to apply another one. So my model can be like, say, apply a matching location on top of this sigma. And then, right, so WBZ. And then apply another thing, apply another thing, and so on and so forth. And each of this is one layer."},{"start":3548.38,"text":"And then if you apply another machine verification, sigma is another layer. And then if you do another one, it's another layer. The number of layers is defined pretty much as the number of machine verification. But here, one thing I'm going to describe to you about is that I didn't really tell you what's the parameters here in this machine verification. So technically, if you want to write this formula, you have to say, oh, this is W and B, and this is what? Is it still using W and B or some other W and some other B? So oftentimes, you use a different W and different B."}],"speech_gaps":[],"frame":"../frames/v050/021.webp","frame_time":3418.37},{"title":"网络层的维度：上一层输出必须匹配下一层输入","start":3577.45,"end":3751.54,"segments":[{"id":459,"text":"The shape is similar, but the variables are different variables. So then you have to introduce the bracket again. So let's say this is the bracket 1, B1. And then here, the parameters are bracket W, bracket 2, B2, so on and so forth. And then you index each of them to fully specify the network. Is that matrix just a n plus 1? Which matrix, sorry?","start":3577.45,"end":3605.06},{"id":460,"text":"So this matrix?","start":3608.69,"end":3609.69},{"id":461,"text":"Yeah.","start":3609.97,"end":3610.21},{"id":462,"text":"Yeah.","start":3610.39,"end":3610.71},{"id":463,"text":"OK.","start":3610.75,"end":3611.09},{"id":464,"text":"Yeah.","start":3611.31,"end":3611.71},{"id":465,"text":"So what these matrix are, so the only requirement","start":3611.79,"end":3614.57},{"id":466,"text":"is that you need to make sure that dimensionality","start":3614.57,"end":3616.43},{"id":467,"text":"is compatible.","start":3616.43,"end":3617.71},{"id":468,"text":"So your input, wait, did I write z?","start":3624.25,"end":3627.39},{"id":469,"text":"Oh, yeah.","start":3627.61,"end":3628.05},{"id":470,"text":"So let's say, suppose your input z is, say, dimension d.","start":3628.25,"end":3632.83},{"id":471,"text":"Then you can only apply a matrix with, so to make wz","start":3633.45,"end":3638.23},{"id":472,"text":"Z makes sense, you have to make sure W is of dimension","start":3638.23,"end":3640.61},{"id":473,"text":"something by D. And then something","start":3641.89,"end":3645.07},{"id":474,"text":"is what you can choose almost freely.","start":3645.07,"end":3647.37},{"id":475,"text":"Of course, not all the options are the same, eventually,","start":3647.49,"end":3649.95},{"id":476,"text":"in terms of the results, but for the compatibility issue","start":3650.01,"end":3652.47},{"id":477,"text":"perspective, you can choose them arbitrarily.","start":3652.47,"end":3654.89},{"id":478,"text":"And let's say, suppose the first layer you choose,","start":3655.53,"end":3657.67},{"id":479,"text":"let's say, suppose you choose matrix simplification, say,","start":3658.27,"end":3663.65},{"id":480,"text":"say, w1, b1, z plus z.","start":3663.65,"end":3672.67},{"id":481,"text":"And suppose this w1 is m1 by d.","start":3673.35,"end":3679.51},{"id":482,"text":"So that means that you map this d-dimensional vector","start":3680.17,"end":3682.69},{"id":483,"text":"to m1-dimensional vector.","start":3682.69,"end":3684.19},{"id":484,"text":"So let's say, so this output is going","start":3684.47,"end":3686.13},{"id":485,"text":"to be m1-dimensional vector.","start":3686.13,"end":3687.27},{"id":486,"text":"And the next time, and if you apply a sigma,","start":3688.01,"end":3692.01},{"id":487,"text":"it's still m1-dimensional vector.","start":3692.11,"end":3693.15},{"id":488,"text":"And next time you apply the matrix multiplication,","start":3693.15,"end":3694.75},{"id":489,"text":"you have to make sure that the input dimension of that matrix","start":3695.27,"end":3698.93},{"id":490,"text":"to be compatible with M1.","start":3698.93,"end":3700.65},{"id":491,"text":"So basically, if you do another one, say, W2, V2,","start":3700.89,"end":3706.03},{"id":492,"text":"then it's required that W2 needs to be something times M1","start":3706.85,"end":3712.47},{"id":493,"text":"And the output dimension is still what you can choose freely, but the input dimension is not. And you have to do this again and again. So once you have multiple dimensions, then basically the","start":3714.1,"end":3725.8},{"id":494,"text":"Maybe the easy way to think about it is that you have a matrix times, say, z plus b. So this dimension is what I call the input dimension, because this dimension can multiply with the dimension of z. And this dimension is the output dimension. But the output dimension becomes the input dimension for the next round. So that's
