r nonlinear models, if it's not the only nonlinear models people are using. Of course, there are many, many variants of new networks. We are going to define some of them and some of the basics. And in Wednesday's lecture, we're going to talk about back propagation, which is about how do you compute the gradient of the loss function with respect to these models.","start":45.88,"end":64.42},{"id":3,"text":"that you can train these models by computing gradient and update based on the gradients.","start":64.9,"end":69.82},{"id":4,"text":"And I'm going to use the whiteboard. And the reason mostly just because I found that when","start":71.24,"end":76.86},{"id":5,"text":"I use the slides, there's only one slide there. So there's not enough memory there.","start":76.86,"end":81.1},{"id":6,"text":"So once I switch to the next slide, sometimes people don't remember the previous slide.","start":81.24,"end":85.84},{"id":7,"text":"And also this is a regulating effect for me to slow down a little bit because after teaching","start":86.2,"end":90.58},{"id":8,"text":"this for so many years. I tend to speak fast and go very fast. And this at least you see some,","start":90.58,"end":98.24},{"id":9,"text":"you see six words as memory. So you can check them if you forget and I can check them if I","start":98.34,"end":105.56},{"id":10,"text":"forget about something. And it's still not that slow in some sense. And feel free to ask me","start":105.56,"end":112.58},{"id":11,"text":"questions because as I said, once I teach this kind of lecture so many times, I tend to move a","start":112.58,"end":118.64},{"id":12,"text":"a little bit faster than I should do.","start":118.64,"end":120.34},{"id":13,"text":"And also, we did update the lectures over time.","start":121.26,"end":123.9},{"id":14,"text":"So some of these new materials are new,","start":124.12,"end":125.88},{"id":15,"text":"and we dropped some of the other materials","start":126.0,"end":128.62},{"id":16,"text":"that are a little bit out of date.","start":129.06,"end":130.2},{"id":17,"text":"Anyway, so generally, still, this lecture","start":131.14,"end":133.26},{"id":18,"text":"is still just a very basic stuff for today.","start":133.26,"end":135.68},{"id":19,"text":"So I guess I think you have, Chris","start":137.4,"end":141.38},{"id":20,"text":"has talked about a linear model, which is kind of like you","start":141.38,"end":143.66},{"id":21,"text":"have a model which is parametrized by theta,","start":143.66,"end":145.72},{"id":22,"text":"and the input is x.","start":146.56,"end":147.7},{"id":23,"text":"Let's just recall the notation so that we're on the same page","start":147.7,"end":150.04},{"id":24,"text":"about notation.","start":150.04,"end":150.48},{"id":25,"text":"I think Chris is using","start":151.1,"end":152.04},{"id":26,"text":"It cannot be exactly the same because sometimes it's not only a model. But for linear model, we call that if you have a linear model, then the model is kind of like this. You have theta h theta x, which is equal to theta 1 x1 plus theta 2 x2 up to theta d xd, where x is the input, which is a d-dimensional vector, and theta is the parameters, which are also a d-dimensional vector.","start":152.79,"end":180.37}],"notes":["本段讲解了线性模型的基本形式，即参数向量θ与输入向量x的线性组合。讲者指出，虽然Chris使用的符号几乎相同，但由于模型可能包含其他元素，因此不能完全一致。线性模型的表达式为θ₁x₁ + θ₂x₂ + ... + θₙxₙ，其中x是d维向量，θ也是d维向量。","讲者强调了线性模型的结构，即输入x与参数θ的线性组合，这为后续介绍非线性模型奠定了基础。讲者提到，非线性模型的构建方式与线性模型类似，但需要扩展以处理非线性关系。","讲者提到，课程内容会逐步展开，包括反向传播算法，这是训练模型的核心方法。反向传播通过计算损失函数相对于模型参数的梯度来更新模型。","讲者还提到，课程内容会根据时间进行更新，部分材料可能被替换或删除，以确保内容的时效性和相关性。","讲者在教学过程中会使用白板，以帮助学生更好地理解和记忆内容。同时，讲者也会在讲解过程中放慢语速，以确保学生能够跟上。","讲者鼓励学生在课堂上提问，因为即使讲授多次，讲者仍可能在讲解过程中加快语速，因此学生提问有助于澄清疑问。"],"formulas":[{"latex":"\\theta_1 x_1 + \\theta_2 x_2 + \\cdots + \\theta_d x_d","symbols":"线性模型的表达式","explanation":"公式正确表达了线性模型的参数形式，其中θ是参数向量，x是输入向量，公式中的各项表示参数与输入的乘积之和。","evidence":"almost exactly the same notation. It cannot be exactly the same because sometimes it's not only a model. But for linear model, we call that if you have a linear model, then the model is kind of like this. You have theta h theta x, which is equal to theta 1 x1 plus theta 2 x2 up to theta d xd, where x is the input, which is a d-dimensional vector, and theta is the parameters, which are also a d-dimensional vector."}],"uncertainties":[],"diagram":"none","start":5.14,"end":180.37,"asr_flags":[],"math_clarifications":["公式中的符号和表达式符合线性模型的标准形式，无需进一步修改。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.14,"text":"So this is mostly just the introduction to deep learning. We are going to talk about deep learning or the application of deep learning in other areas in future weeks as well, like in diffusion models, in large-language models, so on and so forth. So these two lectures are mostly just setting up the basics of deep learning, especially in the context of supervised learning. We are going to introduce"},{"start":29.07,"text":"just a general framework for SuperSRN for nonlinear models, which is pretty much the same as what you have seen in the lectures by Chris again about linear models. You just extend it in a pretty simple way to nonlinear models. Then we're going to define new networks, which is"},{"start":45.88,"text":"the most popular nonlinear models, if it's not the only nonlinear models people are using. Of course, there are many, many variants of new networks. We are going to define some of them and some of the basics. And in Wednesday's lecture, we're going to talk about back propagation, which is about how do you compute the gradient of the loss function with respect to these models."},{"start":64.9,"text":"that you can train these models by computing gradient and update based on the gradients."},{"start":71.24,"text":"And I'm going to use the whiteboard. And the reason mostly just because I found that when"},{"start":76.86,"text":"I use the slides, there's only one slide there. So there's not enough memory there."},{"start":81.24,"text":"So once I switch to the next slide, sometimes people don't remember the previous slide."},{"start":86.2,"text":"And also this is a regulating effect for me to slow down a little bit because after teaching"},{"start":90.58,"text":"this for so many years. I tend to speak fast and go very fast. And this at least you see some,"},{"start":98.34,"text":"you see six words as memory. So you can check them if you forget and I can check them if I"},{"start":105.56,"text":"forget about something. And it's still not that slow in some sense. And feel free to ask me"},{"start":112.58,"text":"questions because as I said, once I teach this kind of lecture so many times, I tend to move a"},{"start":118.64,"text":"a little bit faster than I should do."},{"start":121.26,"text":"And also, we did update the lectures over time."},{"start":124.12,"text":"So some of these new materials are new,"},{"start":126.0,"text":"and we dropped some of the other materials"},{"start":129.06,"text":"that are a little bit out of date."},{"start":131.14,"text":"Anyway, so generally, still, this lecture"},{"start":133.26,"text":"is still just a very basic stuff for today."},{"start":137.4,"text":"So I guess I think you have, Chris"},{"start":141.38,"text":"has talked about a linear model, which is kind of like you"},{"start":143.66,"text":"have a model which is parametrized by theta,"},{"start":146.56,"text":"and the input is x."},{"start":147.7,"text":"Let's just recall the notation so that we're on the same page"},{"start":150.04,"text":"about notation."},{"start":151.1,"text":"I think Chris is using"},{"start":152.79,"text":"almost exactly the same notation. It cannot be exactly the same because sometimes it's not only a model. But for linear model, we call that if you have a linear model, then the model is kind of like this. You have theta h theta x, which is equal to theta 1 x1 plus theta 2 x2 up to theta d xd, where x is the input, which is a d-dimensional vector, and theta is the parameters, which are also a d-dimensional vector."}],"speech_gaps":[],"frame":"../frames/v050/001.webp","frame_time":17.14},{"title":"非线性模型的定义与学习框架","segments":[{"id":27,"text":"And once you have nonlinear models, what does that mean? Generally, nonlinear just means that as long as this form is nonlinear, then it's nonlinear. And here, we are mostly talking about nonlinear in the parameters because this nonlinear in the data is not nonlinear enough in some sense. Suppose you have something like theta 1 x1 squared plus theta 2 x2 squared, so on and so forth.","start":181.62,"end":205.38},{"id":28,"text":"It's the dxd squared. I think we didn't talk about these kind of models because we skipped them, in some sense, in the new version. But this is not sufficiently nonlinear to be interesting because you can just define new data, which is the square of the old data. So suppose you say, I'm going to replace this by z1. I replace this by z2. And then it still becomes a linear model. Another way you are now learning","start":206.5,"end":229.66},{"id":29,"text":"you are not trying to learn the theta, theta i's.","start":230.16,"end":234.94},{"id":30,"text":"You're going to figure out the parameters of theta i.","start":234.96,"end":236.48},{"id":31,"text":"You don't really have to figure out.","start":236.72,"end":238.14},{"id":32,"text":"There's no learning on z i's.","start":238.58,"end":240.0},{"id":33,"text":"So whether it's z i or xi squared,","start":240.12,"end":241.92},{"id":34,"text":"it doesn't really matter.","start":242.18,"end":242.88},{"id":35,"text":"So that's why this is not exactly what we're talking about,","start":243.4,"end":245.86},{"id":36,"text":"even though some people will say this is still a nonlinear model,","start":245.96,"end":247.82},{"id":37,"text":"but this is not exactly what we are talking about.","start":248.0,"end":250.54},{"id":38,"text":"We are talking about cases like you have theta 1 squared,","start":250.66,"end":252.78},{"id":39,"text":"for example, x1, plus theta 2 maybe.","start":252.92,"end":255.58},{"id":40,"text":"I'm just giving an example, something like this.","start":256.42,"end":257.82},{"id":41,"text":"right? Whatever nonlinear model you can write as long as it's nonlinear, it's called a nonlinear","start":257.82,"end":261.82},{"id":42,"text":"model. OK. So of course, the real model we are talking about is not like this. This is just one","start":261.82,"end":267.52},{"id":43,"text":"example. So the model we are going to talk about is New Right Works, which is more structured and","start":267.52,"end":272.8},{"id":44,"text":"more in a specialized way. Anyway, but before talking about New Right Works, let's talk about","start":272.8,"end":280.8},{"id":45,"text":"how do you learn nonlinear models and what's the kind of the framework. This is, in some sense,","start":280.8,"end":286.54},{"id":46,"text":"is mostly just recalling what Chris was talking about","start":286.54,"end":289.26},{"id":47,"text":"with a little bit twist about the model.","start":289.26,"end":291.48},{"id":48,"text":"So basically, the model can be a general function as opposed","start":291.68,"end":294.56},{"id":49,"text":"to a linear function.","start":294.56,"end":295.96},{"id":50,"text":"So let's just quickly recall some of this.","start":296.62,"end":299.32},{"id":51,"text":"So let's say you have a data set.","start":299.5,"end":300.58},{"id":52,"text":"I think Chris probably mentions the concept","start":301.56,"end":303.86},{"id":53,"text":"of data set, which is a final data point with a pair","start":303.86,"end":308.26},{"id":54,"text":"of inputs and outputs.","start":308.26,"end":310.02},{"id":55,"text":"So here, let's talk about supervised learning, by the way.","start":310.64,"end":312.74},{"id":56,"text":"In other cases, we have data sets","start":313.4,"end":315.8},{"id":57,"text":"of different format. But here, if you have a superscript data set, you have a sequence of","start":315.8,"end":320.16},{"id":58,"text":"input and output pairs. And let's say we have n of this. And let's say we assume xi is in d.","start":320.16,"end":328.28},{"id":59,"text":"And just recall that in this lecture, in this whole course, we are trying to use this notation","start":328.66,"end":334.02},{"id":60,"text":"where the superscript is for the indices of the examples and the subscript is for the dimensions,","start":334.02,"end":340.34},{"id":61,"text":"the coordinates. So when I write x sub i, this is the first coordinate of the vector x i,","start":340.34,"end":345.96},{"id":62,"text":"and we have superscript is indexing one particular example.","start":346.14,"end":350.08},{"id":63,"text":"For example, go ahead.","start":350.08,"end":351.08},{"id":64,"text":"the problem where you explain the nonlinear","start":352.08,"end":356.54},{"id":65,"text":"was you're saying that it's not nonlinear just x","start":356.54,"end":360.0}],"notes":["本段主要讨论非线性模型的定义，指出非线性模型通常是指参数的非线性，而非数据本身的非线性。例如，如果模型是θ₁x₁² + θ₂x₂²，这种形式虽然包含平方项，但可以通过重新定义数据（如z₁ = x₁²）将其转化为线性模型，因此不被视为真正意义上的非线性模型。"],"formulas":[],"uncertainties":["New Right Works"],"diagram":"none","start":181.62,"end":360.0,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":181.62,"text":"And once you have nonlinear models, what does that mean? Generally, nonlinear just means that as long as this form is nonlinear, then it's nonlinear. And here, we are mostly talking about nonlinear in the parameters because this nonlinear in the data is not nonlinear enough in some sense. Suppose you have something like theta 1 x1 squared plus theta 2 x2 squared, so on and so forth."},{"start":206.5,"text":"It's the dxd squared. I think we didn't talk about these kind of models because we skipped them, in some sense, in the new version. But this is not sufficiently nonlinear to be interesting because you can just define new data, which is the square of the old data. So suppose you say, I'm going to replace this by z1. I replace this by z2. And then it still becomes a linear model. Another way you are now learning"},{"start":230.16,"text":"you are not trying to learn the theta, theta i's."},{"start":234.96,"text":"You're going to figure out the parameters of theta i."},{"start":236.72,"text":"You don't really have to figure out."},{"start":238.58,"text":"There's no learning on z i's."},{"start":240.12,"text":"So whether it's z i or xi squared,"},{"start":242.18,"text":"it doesn't really matter."},{"start":243.4,"text":"So that's why this is not exactly what we're talking about,"},{"start":245.96,"text":"even though some people will say this is still a nonlinear model,"},{"start":248.0,"text":"but this is not exactly what we are talking about."},{"start":250.66,"text":"We are talking about cases like you have theta 1 squared,"},{"start":252.92,"text":"for example, x1, plus theta 2 maybe."},{"start":256.42,"text":"I'm just giving an example, something like this."},{"start":257.82,"text":"right? Whatever nonlinear model you can write as long as it's nonlinear, it's called a nonlinear"},{"start":261.82,"text":"model. OK. So of course, the real model we are talking about is not like this. This is just one"},{"start":267.52,"text":"example. So the model we are going to talk about is New Right Works, which is more structured and"},{"start":272.8,"text":"more in a specialized way. Anyway, but before talking about New Right Works, let's talk about"},{"start":280.8,"text":"how do you learn nonlinear models and what's the kind of the framework. This is, in some sense,"},{"start":286.54,"text":"is mostly just recalling what Chris was talking about"},{"start":289.26,"text":"with a little bit twist about the model."},{"start":291.68,"text":"So basically, the model can be a general function as opposed"},{"start":294.56,"text":"to a linear function."},{"start":296.62,"text":"So let's just quickly recall some of this."},{"start":299.5,"text":"So let's say you have a data set."},{"start":301.56,"text":"I think Chris probably mentions the concept"},{"start":303.86,"text":"of data set, which is a final data point with a pair"},{"start":308.26,"text":"of inputs and outputs."},{"start":310.64,"text":"So here, let's talk about supervised learning, by the way."},{"start":313.4,"text":"In other cases, we have data sets"},{"start":315.8,"text":"of different format. But here, if you have a superscript data set, you have a sequence of"},{"start":320.16,"text":"input and output pairs. And let's say we have n of this. And let's say we assume xi is in d."},{"start":328.66,"text":"And just recall that in this lecture, in this whole course, we are trying to use this notation"},{"start":334.02,"text":"where the superscript is for the indices of the examples and the subscript is for the dimensions,"},{"start":340.34,"text":"the coordinates. So when I write x sub i, this is the first coordinate of the vector x i,"},{"start":346.14,"text":"and we have superscript is indexing one particular example."},{"start":350.08,"text":"For example, go ahead."},{"start":352.08,"text":"the problem where you explain the nonlinear"},{"start":356.54,"text":"was you're saying that it's not nonlinear just x"}],"speech_gaps":[],"frame":"../frames/v050/002.webp","frame_time":193.62},{"title":"非线性模型与线性模型的区别","segments":[{"id":66,"text":"or it's also nonlinear, right?","start":360.0,"end":361.86},{"id":67,"text":"Yeah.","start":362.1,"end":362.56},{"id":68,"text":"And what is the difference between the square root","start":362.66,"end":364.98},{"id":69,"text":"expression and the nonlinear function?","start":364.98,"end":366.5},{"id":70,"text":"Yeah.","start":366.58,"end":366.74},{"id":71,"text":"That's a good question.","start":366.76,"end":367.48},{"id":72,"text":"And what is the difference between the square root expression and the nonlinear function?","start":367.6,"end":372.38},{"id":73,"text":"then it means that you can replace the x","start":372.64,"end":375.12},{"id":74,"text":"by something else, right?","start":375.12,"end":376.04},{"id":75,"text":"You can replace xi.","start":376.2,"end":377.34},{"id":76,"text":"For example, in this example, you","start":377.72,"end":379.02},{"id":77,"text":"you can replace x1 squared by z1.","start":379.02,"end":380.58},{"id":78,"text":"And then you just say, z is my inputs now.","start":381.0,"end":383.18},{"id":79,"text":"And then I have a linear model in both z and theta.","start":383.48,"end":386.38},{"id":80,"text":"So fundamental is the same as linear model","start":386.66,"end":388.56},{"id":81,"text":"from a learning perspective.","start":388.56,"end":389.74},{"id":82,"text":"But here, you cannot do this.","start":390.38,"end":391.8},{"id":83,"text":"There is no way you can easily transform it","start":391.94,"end":394.7},{"id":84,"text":"into a linear model.","start":394.7,"end":395.56},{"id":85,"text":"Actually, there's no way, just fundamentally.","start":395.8,"end":397.3},{"id":86,"text":"So that's why it requires slightly different techniques.","start":397.82,"end":403.72},{"id":87,"text":"So some of the linear model techniques cannot work anymore.","start":404.1,"end":406.44},{"id":88,"text":"Okay, and that's just one example of a potential nonlinear...","start":407.76,"end":411.12},{"id":89,"text":"Yeah, yeah, you can write, you know, yeah, yeah, this is just the one,","start":411.12,"end":413.62},{"id":90,"text":"you know, you can even add more things, you know, you can take more square roots, you know,","start":414.2,"end":417.26},{"id":91,"text":"whatever, you can take squares, you know, yeah, you see some real examples, yeah.","start":417.28,"end":421.88},{"id":92,"text":"In the talk, it's really weird if you just added, like, another data in the next one,","start":422.64,"end":426.48},{"id":93,"text":"but so not, like, an x1 squared with that certain value.","start":426.56,"end":429.96},{"id":94,"text":"In which cases? In this case?","start":430.56,"end":432.3},{"id":95,"text":"Yeah, like, if we just had, like, no big squ 463.54,"text":"so that you maintain the model's functionality, but you can reapply the same techniques that"},{"start":471.58,"text":"is useful for linear models. Okay, sounds good. So anyway, so"},{"start":480.76,"text":"okay, so how do we, so now let's just assume you have a general, you know, okay, so let's talk"},{"start":484.92,"text":"about the framework. So and you have, let's say we have a regression problem. I guess, you know,"},{"start":491.66,"text":"Chris's lecture talked about regression versus classification."},{"start":494.82,"text":"And for regression problem,"},{"start":498.06,"text":"let's say one of the distinction"},{"start":501.88,"text":"between regression classification is that we have regression problem,"},{"start":504.78,"text":"the yi, the labels are a real number."},{"start":508.3,"text":"These are real numbers."},{"start":509.66,"text":"And then your model, let's say is the h parametrized by theta,"},{"start":513.28,"text":"which is a function that maps the input,"},{"start":515.56,"text":"which is the rd to a real number r."},{"start":520.72,"text":"And you can have a cost function or maybe loss function."},{"start":525.26,"text":"I think these days people use the word loss function more often. In the lecture notes, we still use cost function, but most researchers understand what you are talking about. So this is most likely."}],"speech_gaps":[],"frame":"../frames/v050/003.webp","frame_time":372.0},{"title":"损失函数与回归问题","segments":[{"id":125,"text":"Of course, there are also many different types of error functions or loss functions you can define. By the way, error and loss and cost is the same. Let's just use loss for all the cases. And the loss function could be something like this. With j, for the ith example, the loss function is a function of the parameter because the data is not something you optimize for. It's not a variable. It's given. So loss function for the j's.","start":541.38,"end":569.52},{"id":126,"text":"Example is yi minus h theta xi. You apply the model to the data, you get some prediction, and you compare that with the real label, and you take the square. Something like this. And then you can also have the average loss, which is something like 1 over n times the sum of all the losses.","start":570.06,"end":596.49},{"id":127,"text":"And then you try to minimize this function over the parameter theta. So that's for regression. And let me give another example. I think this is mostly just repeating some of the stuff we have discussed. The only thing here is just that this is a nonlinear model as opposed to a linear model. So in quiz lecture, I think this is just theta 1 x1 plus x2, so on and so forth. And I guess for multiclass classification,","start":597.89,"end":624.27},{"id":128,"text":"We can also talk about single-class classification, which is actually in the lecture notes. I think I just thought, given the interest of time, let's just only talk about multi-class classification. Basically, you just have to define the loss function the same way as we have done for linear models, except that you replace the models by nonlinear functions. By the way, I think in most cases, you don't have to think about the superscript i because","start":627.24,"end":648.44},{"id":129,"text":"This is just indexing examples. So if you say, I only have one example, x and y, then everything without a superscript still works. Maybe I should just write in that notation to simplify it a little bit. So let's say you have, so in this case, the y, I can write y superscript i for the i label, or I can just use y to indicate one label. Let's say, suppose you have one label. In multiclassification, you have","start":649.35,"end":676.58},{"id":130,"text":"It's a discrete choice of labels, 1 to k. And here, I guess you can say you have a model, let's use h bar, which is mapping the input x. So the x is still in Rd. Think of this as an image. Think of this as some kind of labels for the image. And then the","start":677.4,"end":699.54}],"notes":["本段主要讲解损失函数的概念，指出误差、损失和成本在机器学习中是同一概念，通常使用损失函数来表示。损失函数是参数的函数，因为数据是给定的，不是优化变量。以回归问题为例，损失函数可以是预测值与真实值的差的平方，然后取所有样本的平均值作为平均损失。","接着，讲者提到损失函数的最小化是回归问题的核心目标。同时，讲者指出，虽然当前讨论的是回归问题，但也可以扩展到分类问题，特别是多类分类。在多类分类中，标签是离散的，从1到k，模型需要将输入映射到这些标签。","讲者还提到，对于单类分类，虽然在讲义中有涉及，但为了节省时间，主要讨论多类分类。在多类分类中，损失函数的定义方式与线性模型类似，只是将模型替换为非线性函数。","此外，讲者指出，索引符号i通常用于表示样本，但在只有一个样本的情况下，可以省略索引。讲者建议使用更简洁的符号表示方式，以简化理解。","最后，讲者提到输入x仍然属于Rd空间，可以是图像等数据，而标签是这些数据的类别。模型需要将输入映射到这些类别，从而进行分类任务。","整个段落强调了损失函数在回归和分类问题中的核心作用，以及如何通过非线性模型进行扩展。同时，讲者也提到符号表示的简化和索引的使用，以帮助理解模型的结构。"],"formulas":[],"uncertainties":[],"diagram":"none","start":541.38,"end":699.54,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":541.38,"text":"Of course, there are also many different types of error functions or loss functions you can define. By the way, error and loss and cost is the same. Let's just use loss for all the cases. And the loss function could be something like this. With j, for the ith example, the loss function is a function of the parameter because the data is not something you optimize for. It's not a variable. It's given. So loss function for the j's."},{"start":570.06,"text":"Example is yi minus h theta xi. You apply the model to the data, you get some prediction, and you compare that with the real label, and you take the square. Something like this. And then you can also have the average loss, which is something like 1 over n times the sum of all the losses."},{"start":597.89,"text":"And then you try to minimize this function over the parameter theta. So that's for regression. And let me give another example. I think this is mostly just repeating some of the stuff we have discussed. The only thing here is just that this is a nonlinear model as opposed to a linear model. So in quiz lecture, I think this is just theta 1 x1 plus x2, so on and so forth. And I guess for multiclass classification,"},{"start":627.24,"text":"We can also talk about single-class classification, which is actually in the lecture notes. I think I just thought, given the interest of time, let's just only talk about multi-class classification. Basically, you just have to define the loss function the same way as we have done for linear models, except that you replace the models by nonlinear functions. By the way, I think in most cases, you don't have to think about the superscript i because"},{"start":649.35,"text":"This is just indexing examples. So if you say, I only have one example, x and y, then everything without a superscript still works. Maybe I should just write in that notation to simplify it a little bit. So let's say you have, so in this case, the y, I can write y superscript i for the i label, or I can just use y to indicate one label. Let's say, suppose you have one label. In multiclassification, you have"},{"start":677.4,"text":"It's a discrete choice of labels, 1 to k. And here, I guess you can say you have a model, let's use h bar, which is mapping the input x. So the x is still in Rd. Think of this as an image. Think of this as some kind of labels for the image. And then the"}],"speech_gaps":[],"frame":"../frames/v050/004.webp","frame_time":553.38},{"title":"神经网络的架构与概率建模","segments":[{"id":131,"text":"which is matching the input to k numbers. And these k numbers are often called logits. This is the same logits in the linear case. And then you say the logits, the predicted probability of each class, for this example x, for each class, let's say class j, is this kind of exponential form.","start":701.08,"end":734.68},{"id":132,"text":"you look at the J's. This is the J's output, right? Index J means that this is the J's output of this k-dimensional vector. And then divided by the sum of the exponential of all the, this is the so-called softmax. So this is the so-called softmax. Sorry.","start":735.91,"end":765.55},{"id":133,"text":"So this is the so-called softmax function of this h. And then, so basically, you say, yeah. So basically, nputs, and you can compute the loss. But of course, the underlying math is this.","start":906.92,"end":934.93},{"id":139,"text":"Okay, this all sounds somewhat familiar to some degree. Okay, good. Any questions?","start":936.6,"end":941.14},{"id":140,"text":"Can you explain why it's called cross-entropy? Is there an entropy?","start":943.24,"end":946.94},{"id":141,"text":"Is cross-entropy... So what's the second part of the question?","start":948.44,"end":955.56},{"id":142,"text":"Where can we see entropy with the equation?","start":956.18,"end":958.34},{"id":143,"text":"Yeah, I think this is the cross-entropy between the","start":959.16,"end":961.68},{"id":144,"text":"the probability distribution defined by h theta x.","start":966.6,"end":970.3},{"id":145,"text":"So I think here's the thing.","start":971.14,"end":972.76},{"id":146,"text":"So the question is, why this is called cross entropy loss?","start":972.9,"end":975.98},{"id":147,"text":"I think if you, how do I write it in some sense?","start":976.88,"end":985.3},{"id":148,"text":"I think if you have a, let's say this distribution,","start":986.4,"end":990.22},{"id":149,"text":"let's call it maybe p theta.","start":990.42,"end":993.4},{"id":150,"text":"data.","start":993.4,"end":993.48},{"id":151,"text":"And I think this cross entropy loss is actually","start":995.44,"end":1000.0},{"id":152,"text":"equals to the cross entropy between the two.","start":1000.0,"end":1007.66},{"id":153,"text":"I guess you have to take on, if you take the expectation","start":1007.72,"end":1014.06},{"id":154,"text":"of this L cross entropy loss of this h bar","start":1015.9,"end":1022.88},{"id":155,"text":"star and y, and expecting y from the true distribution,","start":1022.88,"end":1027.0},{"id":156,"text":"from the true label distribution, whatever you call it.","start":1027.8,"end":1030.46},{"id":157,"text":"And then this is equal to a cross entropy","start":1030.58,"end":1032.68},{"id":158,"text":"between this distribution, :167,"text":"indexed by y. y is like 2 or 3 or 4 or k. But you can also encode y as a one-hot vector, which is the same thing. Then your math needs to be a little bit different. Then this is going to be the inner product between this vector times the one-hot vector. But here, I'm just using y as really a discrete choice between 1 to k.","start":1081.64,"end":1100.58},{"id":168,"text":"So can you repeat the question? Sorry. You mentioned like if regression is something is Gaussian distributed, you have some sort of, like it simplifies to. OK. So the question is why for the regression case, it also is not likelihood. So I think the, let me try to see if I can do it on the fly. I think it should be easy. So I think the modeling, so if you make the modeling assumption that if you assume,","start":1109.43,"end":1134.95},{"id":169,"text":"Suppose you assume that your modeling assumption is that y is generated from, say, h theta bar, theta x plus some Gaussian noise, but epsilon is from n0, maybe sigma squared, something like this. Then the likelihood of y given x is, I think, 1 over, I guess this is challenging my memory of this, something like this, exponential.","start":1136.56,"end":1166.67},{"id":170,"text":"y minus h theta x squared over 2 sigma squared, I guess. Something like this. And then you take the negative log likelihood. So then this is a log of p y given x is equal to some constant. You take the log, you get a constant, which doesn't really matter. And you've got the log of this, which is 1 over 2 sigma squared y minus h theta x squared.","start":1167.92,"end":1199.57}],"notes":["本段讨论了交叉熵的定义，指出交叉熵实际上是某一分布的概率乘以该概率的对数。这表明交叉熵是衡量两个概率分布差异的一种方式，通常用于分类任务中，如在神经网络中计算预测分布与真实分布之间的差异。","讲者提到在处理分类问题时，y通常是一个离散变量，并且可以使用one-hot编码来表示。这表明在处理多类别分类问题时，需要将输出变量转换为one-hot向量，以便进行数学建模。","讲者提到在回归问题中，假设y服从高斯分布，并且通过最小化负对数似然函数来实现模型训练。这表明在回归任务中，通常使用高斯分布作为先验假设，并通过最小化负对数似然来优化模型参数。","讲者提到在回归问题中，负对数似然函数可以简化为一个二次函数，这表明在回归任务中，模型的损失函数通常是一个二次函数，这与最小二乘法的损失函数形式一致。","讲者提到在回归问题中，负对数似然函数的推导过程可能较为复杂，但可以通过假设y服从高斯分布来简化。这表明在回归任务中，模型的损失函数可以通过概率模型的假设来推导。","讲者提到在回归问题中，负对数似然函数的推导过程可能较为复杂，但可以通过假设y服从高斯分布来简化。这表明在回归任务中，模型的损失函数可以通过概率模型的假设来推导。"],"formulas":[{"latex":"L(y|x) = \\text{exp}\\big(-\\frac{(y - h_\\theta x)^2}{2\\sigma^2}\\big)","symbols":"L(y|x) 表示给定输入x时输出y的似然函数，h_θ(x) 是模型的预测值，σ² 是高斯分布的方差","explanation":"该公式正确，表示在回归问题中，假设y服从均值为h_θ(x)、方差为σ²的高斯分布时的似然函数。","evidence":"y minus h theta x squared over 2 sigma squared, I guess. Something like this. And then you take the negative log likelihood. So then this is a log of p y given x is equal to some constant. You take the log, you get a constant, which doesn't really matter. And you've got the log of this, which is 1 over 2 sigma squared y minus h theta x squared."}],"uncertainties":["the derivative of the data distribution"],"diagram":"none","start":1044.8,"end":1199.57,"asr_flags":[162],"math_clarifications":["在回归问题中，假设y服从均值为h_θ(x)、方差为σ²的高斯分布时，似然函数应为指数形式，无需额外的常数因子。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1044.8,"text":"the cross entropy is actually the probability"},{"start":1047.44,"text":"of one distribution times the log of the probability"},{"start":1049.14,"text":"the derivative of the data distribution."},{"start":1053.0,"text":"Yeah, I think the derivation is probably a little bit long,"},{"start":1054.92,"text":"especially if you're reading this language"},{"start":1056.76,"text":"and have a cumbersome, but this"},{"start":1059.1,"text":"I think actually probably I have it in the lecture notes. I forgot exactly. Yeah. Any other questions? What would be a one-hot? What is a one-hot? In my case, in my notation, y is just a discrete variable. So that's why you can see I have h theta bar theta x."},{"start":1081.64,"text":"indexed by y. y is like 2 or 3 or 4 or k. But you can also encode y as a one-hot vector, which is the same thing. Then your math needs to be a little bit different. Then this is going to be the inner product between
