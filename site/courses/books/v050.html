ave an input x, and then apply","start":3789.77,"end":3792.49},{"id":498,"text":"a matrix modification, and then apply another, maybe sigma,","start":3793.57,"end":3797.39},{"id":499,"text":"and apply another matrix modification, so on and so","start":3797.61,"end":3800.79},{"id":500,"text":"forth.","start":3800.79,"end":3800.93},{"id":501,"text":"That's how people actually draw these networks","start":3801.05,"end":3803.51},{"id":502,"text":"And you can even merge these two together to call it MLP.","start":3803.51,"end":3805.33},{"id":503,"text":"And you can even merge these two together to call it MLP.","start":3805.97,"end":3809.73},{"id":504,"text":"So sometimes you will just draw this.","start":3809.93,"end":3811.75},{"id":505,"text":"And if MLP is called multilayer perception,","start":3811.83,"end":3812.39},{"id":506,"text":"And if MLP is called multilayer perception,","start":3812.71,"end":3815.89},{"id":507,"text":"When people say MLP, I think sometimes it's one matching application, one sigma,","start":3815.89,"end":3823.21},{"id":508,"text":"sometimes it's two matching applications, so on and so forth.","start":3823.55,"end":3827.65},{"id":509,"text":"sometimes it's two matching applications, so on and so forth.","start":3828.49,"end":3831.03},{"id":510,"text":"Any questions? So do you need to do the weight?","start":3832.09,"end":3834.49},{"id":511,"text":"Do you need to do the weight that could become the swarming side,","start":3835.55,"end":3839.51},{"id":512,"text":"or do you need to do the swarming side? Is there a common strategy there?","start":3839.61,"end":3843.79},{"id":513,"text":"I think, in most cases, you get smaller dimensions.","start":3844.79,"end":3847.55},{"id":514,"text":"The intermediate dimensions become smaller.","start":3848.35,"end":3850.21},{"id":515,"text":"And that's often because the input dimension is often","start":3850.29,"end":3852.29},{"id":516,"text":"very big.","start":3852.29,"end":3852.95},{"id":517,"text":"For example, for language, it's kind of like your initial,","start":3853.07,"end":3855.43},{"id":518,"text":"the vocab is kind of like the token.","start":3856.89,"end":3860.05},{"id":519,"text":"I guess I'm jumping ahead a little bit.","start":3860.33,"end":3862.09},{"id":520,"text":"But your initial dimension could be like 250k or something","start":3862.17,"end":3864.65},{"id":521,"text":"like that.","start":3864.65,"end":3864.87},{"id":522,"text":"you shrink it to probably 2K and then keep using 2K. Yeah, something like that. And for vision, I think the same thing, because initially you have an RGB encoded kind of like image. You have three channels, three RGB, three numbers, and each is like 256 by 256, or maybe depending on the resolution. And you have to shrink it a little bit. Yeah. OK, what else? I think one thing is called ResNet. I think that's still useful, so probably I should tell you about it. So let me erase something here.","start":3866.02,"end":3895.91},{"id":523,"text":"But eventually, you can define many components like this. Most of these components are matrix simplifications, activations. And I'll tell you a few other components that are still largely being used in different cases. And some of them vary more than cases using more than components like attention using","start":3898.94,"end":3921.72}],"notes":["本段主要讲解神经网络架构的基本概念，包括输入维度的固定性、网络层的构建方式以及维度缩减的常见策略。讲者提到输入维度通常是固定的，不能随意更改，且在训练过程中通常不会频繁改变维度，而是保持一段时间。对于高维输入（如语言和图像），通常会通过矩阵变换和激活函数逐步缩减维度，以降低计算复杂度。此外，讲者还提到ResNet等网络结构的使用，以及不同组件（如矩阵变换、激活函数）在神经网络中的作用。","讲者通过具体的例子说明维度缩减的必要性，例如语言处理中词汇量可能高达25万，但通常会缩减到2000左右，而图像处理中RGB通道的分辨率也会被压缩。这种缩减策略有助于减少计算量，同时保留关键信息。","讲者提到MLP（多层感知机）的结构，通常由多个矩阵变换和激活函数组成，层数可以是1层或2层，甚至更多。这种结构是神经网络的基础，但实际应用中可能会结合其他组件（如注意力机制）来增强模型性能。","讲者还提到在神经网络设计中，权重和激活函数的处理方式，以及如何通过维度缩减来优化模型。例如，输入维度较大时，通常会通过矩阵变换逐步降低维度，以减少计算负担。","讲者提到ResNet等网络结构的使用，说明在实际应用中，神经网络的设计需要考虑不同组件的组合和优化策略。例如，ResNet通过残差连接解决了深度网络中的梯度消失问题，是当前广泛使用的结构之一。","讲者最后提到神经网络中不同组件的使用情况，包括矩阵变换、激活函数以及注意力机制等。这些组件在不同任务中可能有不同的组合方式，需要根据具体需求进行调整。"],"formulas":[],"uncertainties":["swarming side","attention using"],"diagram":"none","start":3753.79,"end":3921.72,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3753.79,"text":"The original input dimension is something you cannot change. So that's fixed. That's based on our data. And then afterwards, you don't change dimensions that often. You typically use the same dimensions for quite a while. But maybe you change it once or twice, something like that. And just in case you read some of the old papers, which I think even these days, still the architecture papers sometimes draw like this. They just draw."},{"start":3788.27,"text":"People go more and more abstract, right?"},{"start":3789.77,"text":"They say, I have an input x, and then apply"},{"start":3793.57,"text":"a matrix modification, and then apply another, maybe sigma,"},{"start":3797.61,"text":"and apply another matrix modification, so on and so"},{"start":3800.79,"text":"forth."},{"start":3801.05,"text":"That's how people actually draw these networks"},{"start":3803.51,"text":"without specing all details."},{"start":3805.97,"text":"And you can even merge these two together to call it MLP."},{"start":3809.93,"text":"So sometimes you will just draw this."},{"start":3811.83,"text":"You have x."},{"start":3812.71,"text":"And if MLP is called multilayer perception,"},{"start":3815.89,"text":"often it encapsulates one or two layers of this, a few of these components."},{"start":3823.55,"text":"When people say MLP, I think sometimes it's one matching application, one sigma,"},{"start":3828.49,"text":"sometimes it's two matching applications, so on and so forth."},{"start":3832.09,"text":"Any questions? So do you need to do the weight?"},{"start":3835.55,"text":"Do you need to do the weight that could become the swarming side,"},{"start":3839.61,"text":"or do you need to do the swarming side? Is there a common strategy there?"},{"start":3844.79,"text":"I think, in most cases, you get smaller dimensions."},{"start":3848.35,"text":"The intermediate dimensions become smaller."},{"start":3850.29,"text":"And that's often because the input dimension is often"},{"start":3852.29,"text":"very big."},{"start":3853.07,"text":"For example, for language, it's kind of like your initial,"},{"start":3856.89,"text":"the vocab is kind of like the token."},{"start":3860.33,"text":"I guess I'm jumping ahead a little bit."},{"start":3862.17,"text":"But your initial dimension could be like 250k or something"},{"start":3864.65,"text":"like that."},{"start":3866.02,"text":"you shrink it to probably 2K and then keep using 2K. Yeah, something like that. And for vision, I think the same thing, because initially you have an RGB encoded kind of like image. You have three channels, three RGB, three numbers, and each is like 256 by 256, or maybe depending on the resolution. And you have to shrink it a little bit. Yeah. OK, what else? I think one thing is called ResNet. I think that's still useful, so probably I should tell you about it. So let me erase something here."},{"start":3898.94,"text":"But eventually, you can define many components like this. Most of these components are matrix simplifications, activations. And I'll tell you a few other components that are still largely being used in different cases. And some of them vary more than cases using more than components like attention using"}],"speech_gaps":[],"frame":"../frames/v050/023.webp","frame_time":3765.79},{"title":"残差网络（Residual Network）架构","segments":[{"id":524,"text":"language. I'm going to talk about those in a large language model lectures. So these are some, so one of the components called residual network or just a residual connections if you think about the component. So the residual connection is like this. So instead of using, keep using this","start":3923.14,"end":3946.57},{"id":525,"text":"The residual conduction is kind of like, let's call it residual z,","start":3947.0,"end":3951.76},{"id":526,"text":"is this interesting thing where you have two applications of this alternating between","start":3951.96,"end":3960.56},{"id":527,"text":"matrix modification and activations, and then you add your input again back to it.","start":3962.22,"end":3969.7},{"id":528,"text":"So one thing that is actually, at least by definition, it means that you don't change","start":3970.52,"end":3975.74},{"id":529,"text":"dimension here, right? Because to make this compatible, your input dimension and output","start":3975.74,"end":3981.08},{"id":530,"text":"dimension are exactly the same. And of course, these two metric applications are not using the","start":3981.08,"end":3987.04},{"id":531,"text":"same weight matrices. I'm not just right exactly what they are, but they are not using the same","start":3987.04,"end":3991.26},{"id":532,"text":"matrices. And this is called a residual block.","start":3991.26,"end":3995.42},{"id":533,"text":"And this was introduced in 2015 in this very famous residual network paper. I think the kind","start":4000.76,"end":4008.66},{"id":534,"text":"of the rationale was that if, let's say suppose, by the way this Z doesn't have to be our original","start":4008.66,"end":4017.42},{"id":535,"text":"raw input. This could be one intermediate layer and then you apply this Z, you apply this residual","start":4017.42,"end":4022.66},{"id":536,"text":"block and then you can actually apply many, many residual blocks. So eventually, this is","start":4022.66,"end":4028.12},{"id":537,"text":"how residual block and eventually the residual network, the residual net looks like, you know,","start":4028.12,"end":4035.62},{"id":538,"text":"with some approximation, it's kind of like you apply a lot of residual net many, many times.","start":4035.62,"end":4041.0},{"id":539,"text":"And at the beginning, you need to kind of do something maybe to change the dimension because you cannot work with the original dimension.","start":4043.23,"end":4049.65},{"id":540,"text":"So you first change the dimension to some dimension of the intermediate dimensions. And then you apply many, many residual network. And maybe you have to apply one more at the end to change the dimension again. But largely speaking, it's application of many, many residual blocks. And that's called residual network. And the original motivation was that why you apply this? That's because suppose you believe that at some point, you are already getting close to your labels. So suppose","start":4050.27,"end":4074.47},{"id":541,"text":"At some point, z is already approximately equal to y, let's say. y is your target and z is your intermediate variables in some intermediate layers.","start":4076.46,"end":4086.38}],"notes":["本段讲解了残差网络（Residual Network）的基本架构，其中残差连接（Residual Connection）是关键组成部分。残差连接通过在输入和输出之间添加一个残差项，使得网络可以学习到残差（即输入与输出之间的差异）。这种设计允许网络在训练过程中更有效地学习复杂的映射关系。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3923.14,"end":4086.38,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3923.14,"text":"language. I'm going to talk about those in a large language model lectures. So these are some, so one of the components called residual network or just a residual connections if you think about the component. So the residual connection is like this. So instead of using, keep using this"},{"start":3947.0,"text":"these kind of things. The residual conduction is kind of like, let's call it residual z,"},{"start":3951.96,"text":"is this interesting thing where you have two applications of this alternating between"},{"start":3962.22,"text":"matrix modification and activations, and then you add your input again back to it."},{"start":3970.52,"text":"So one thing that is actually, at least by definition, it means that you don't change"},{"start":3975.74,"text":"dimension here, right? Because to make this compatible, your input dimension and output"},{"start":3981.08,"text":"dimension are exactly the same. And of course, these two metric applications are not using the"},{"start":3987.04,"text":"same weight matrices. I'm not just right exactly what they are, but they are not using the same"},{"start":3991.26,"text":"matrices. And this is called a residual block."},{"start":4000.76,"text":"And this was introduced in 2015 in this very famous residual network paper. I think the kind"},{"start":4008.66,"text":"of the rationale was that if, let's say suppose, by the way this Z doesn't have to be our original"},{"start":4017.42,"text":"raw input. This could be one intermediate layer and then you apply this Z, you apply this residual"},{"start":4022.66,"text":"block and then you can actually apply many, many residual blocks. So eventually, this is"},{"start":4028.12,"text":"how residual block and eventually the residual network, the residual net looks like, you know,"},{"start":4035.62,"text":"with some approximation, it's kind of like you apply a lot of residual net many, many times."},{"start":4043.23,"text":"And at the beginning, you need to kind of do something maybe to change the dimension because you cannot work with the original dimension."},{"start":4050.27,"text":"So you first change the dimension to some dimension of the intermediate dimensions. And then you apply many, many residual network. And maybe you have to apply one more at the end to change the dimension again. But largely speaking, it's application of many, many residual blocks. And that's called residual network. And the original motivation was that why you apply this? That's because suppose you believe that at some point, you are already getting close to your labels. So suppose"},{"start":4076.46,"text":"At some point, z is already approximately equal to y, let's say. y is your target and z is your intermediate variables in some intermediate layers."}],"speech_gaps":[{"start":3996.16,"end":3997.68}],"frame":"../frames/v050/024.webp","frame_time":3935.14},{"title":"残差网络的架构与建模假设","segments":[{"id":542,"text":"You probably should model the differences explicitly. Because you are already kind of close, you just probably should use the networks to model only the differences. So basically, you should probably just model z minus y as some residual, or maybe y minus z, sorry. Say y minus z as some residual of z. And if you believe in that, sorry, not the residual of z, y minus z to be some kind of network, say something like this, plus like this.","start":4090.22,"end":4120.56},{"id":543,"text":"So if this is your belief, then if you move z to the other side, then you have y is equal to sigma mm z plus z. And you can see that this is almost the same as here. The only difference is that they found out, actually, you probably shouldn't use one layer to model the difference. You should use two layers to model the difference. So they say, oh, let's say you do two of this. And then the same thing you just have like this.","start":4121.58,"end":4146.34},{"id":544,"text":"So this is just a story. It's not like there's any formal proof there. And actually, people have tried to, you know, 10 years ago, people have tried, maybe seven years ago, people have tried to see how many blocks here you should do. You can do two layers, three layers, L layers. And eventually, I think two or three layers are the best. Also for reasons we don't fundamentally understand necessarily. Yeah, so that's residual network.","start":4148.26,"end":4175.02},{"id":545,"text":"So suppose this is the modeling assumption. You model only the differences. So this implies this, and they are the same. So which one is the hypothesis depends on what you believe in. But somehow, if you somehow believe that, it's more beneficial to model directly the residual.","start":4186.11,"end":4203.89},{"id":546,"text":"Then you do this, right? And then you change, and you rearrange, you get this. That's the only thing I'm saying. Nothing profound.","start":4204.68,"end":4212.55},{"id":547,"text":"And there are other kind of explanations for why this works. For example, some of the theorists, they try to analyze the optimization perspective of different modeling. So basically, if you don't add z here versus you add z, in some cases, you can argue that adding z will make the optimization easier, make your optimization more well-conditioned, including some of my papers.","start":4217.74,"end":4240.62}],"notes":["本段讲解了残差网络（Residual Network）的基本思想，即通过建模输入与输出之间的差异（残差）来简化网络设计。讲者指出，残差网络的核心假设是将输出表示为输入加上一个残差项，这使得网络可以更有效地学习复杂的映射关系。","讲者提到，残差网络的结构设计并非基于严格的数学证明，而是基于经验观察。例如，使用两个或三个层来建模残差比使用单层更有效，但具体原因尚不明确。","讲者进一步指出，残差网络的建模假设是只建模输入与输出之间的差异，而不是直接建模输出本身。这种假设在某些情况下可能更有利于优化过程。","讲者还提到，从优化的角度来看，添加输入（z）到网络中可以改善优化过程的条件，使优化更加稳定和高效。这种观点在一些理论研究中得到了支持。","讲者强调，残差网络的设计并非基于某种理论上的必然性，而是基于实验和经验的总结。因此，残差网络的成功部分归功于其简单而有效的结构设计。","讲者最后指出，残差网络的结构设计虽然看似简单，但其背后的原理和效果仍需进一步研究和理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4090.22,"end":4240.62,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4090.22,"text":"you probably should model the differences explicitly. Because you are already kind of close, you just probably should use the networks to model only the differences. So basically, you should probably just model z minus y as some residual, or maybe y minus z, sorry. Say y minus z as some residual of z. And if you believe in that, sorry, not the residual of z, y minus z to be some kind of network, say something like this, plus like this."},{"start":4121.58,"text":"So if this is your belief, then if you move z to the other side, then you have y is equal to sigma mm z plus z. And you can see that this is almost the same as here. The only difference is that they found out, actually, you probably shouldn't use one layer to model the difference. You should use two layers to model the difference. So they say, oh, let's say you do two of this. And then the same thing you just have like this."},{"start":4148.26,"text":"So this is just a story. It's not like there's any formal proof there. And actually, people have tried to, you know, 10 years ago, people have tried, maybe seven years ago, people have tried to see how many blocks here you should do. You can do two layers, three layers, L layers. And eventually, I think two or three layers are the best. Also for reasons we don't fundamentally understand necessarily. Yeah, so that's residual network."},{"start":4186.11,"text":"So suppose this is the modeling assumption. You model only the differences. So this implies this, and they are the same. So which one is the hypothesis depends on what you believe in. But somehow, if you somehow believe that, it's more beneficial to model directly the residual."},{"start":4204.68,"text":"then you do this, right? And then you change, and you rearrange, you get this. That's the only thing I'm saying. Nothing profound."},{"start":4217.74,"text":"And there are other kind of explanations for why this works. For example, some of the theorists, they try to analyze the optimization perspective of different modeling. So basically, if you don't add z here versus you add z, in some cases, you can argue that adding z will make the optimization easier, make your optimization more well-conditioned, including some of my papers."}],"speech_gaps":[{"start":4175.568,"end":4177.232},{"start":4177.456,"end":4185.71},{"start":4214.16,"end":4217.34}],"frame":"../frames/v050/025.webp","frame_time":4102.219999999999},{"title":"神经网络架构与层归一化","segments":[{"id":548,"text":"I think there's some degree of truth there as well. It's just that it's very hard to fundamentally... You have many explanations for it. It's very hard to know exactly which one is the right explanation. Maybe, let's see, I have seven minutes. Any questions? There's no... I got a question. What's the intuition?","start":4242.46,"end":4272.7},{"id":549,"text":"So the intuition could be that, oh, maybe this is already small. Then maybe I should directly model that, as opposed to model the original label. So it's a simpler task. The original label, predicting the original label is very hard. But if you predict the difference, probably it's easier. So that's why you model easier tasks with the two layer networks. And that's pretty much it. There's nothing more formal than that.","start":4275.06,"end":4297.68},{"id":550,"text":"Let's see, I have seven minutes. I think, let's see, should I have time to talk about two things? Okay, so maybe let me quickly talk about layer norm. And I can see whether I have time to talk about the convolutional network. So layer norm is also something that people still use in large language models. So, of course, in a slightly different form these days.","start":4301.85,"end":4329.55},{"id":551,"text":"the original layer norm is the following. So basically, still, it's a component, right? So it's a block. So you have some input that's called z. And this component is trying to normalize z in some way. And the way to normalize it is that you say you first turn z into some normalized version of z, which is z minus mu 1 over sigma 1 comma z minus mu m sigma m. Let's say z is m dimensional, sorry, z1.","start":4332.01,"end":4357.41},{"id":552,"text":"I should follow the notes more closely. I think this is of the same. Maybe I should even use... So let's say... I don't remember why I used hat, but let's use hat. So this is how you normalize. Where mu hat is the empirical mean, which is the average of all the z's. And sigma hat is the empirical...","start":4358.02,"end":4401.18}],"notes":["本段讲解了神经网络中层归一化（layer norm）的基本概念。层归一化是一种用于标准化输入数据的组件，其目的是通过减去均值并除以标准差来对输入进行归一化处理。讲者提到，层归一化在大型语言模型中仍然被使用，但形式上有所变化。","讲者指出，层归一化的过程是将输入向量z转换为标准化版本，即通过减去均值并除以标准差。其中，均值和标准差是基于输入数据的统计量，即经验均值和经验标准差。讲者提到，z是m维的，但随后似乎出现了断句问题，导致表达不够清晰。","讲者提到，他可能应该更仔细地遵循笔记，这表明他意识到自己在讲解过程中可能出现了不一致或不准确的地方。他提到使用了帽子符号（hat），但不确定原因，这可能与归一化后的变量命名有关。","讲者提到，层归一化的目标是标准化输入，使其具有零均值和单位方差。这有助于加速训练过程并提高模型的稳定性。讲者还提到，层归一化在现代模型中以不同的形式存在，这表明其应用和实现方式可能有所演变。","讲者在讲解过程中提到，他可能需要时间讨论两个主题，即层归一化和卷积网络。这表明课程内容涉及多个神经网络架构的讲解，而层归一化是其中之一。","讲者在讲解层归一化时，提到他可能需要更仔细地遵循笔记，这表明他意识到自己在讲解过程中可能存在不一致或不准确的地方。他提到使用了帽子符号（hat），但不确定原因，这可能与归一化后的变量命名有关。"],"formulas":[],"uncertainties":["z minus mu 1 over sigma 1 comma z minus mu m sigma m"],"diagram":"none","start":4242.46,"end":4401.18,"asr_flags":[],"math_clarifications":["标准化操作通常为 $ z - \bar{z} $ 除以标准差 $ \text{std}(z) $，但此处的表达式未正确反映标准化的数学定义，因此需移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4242.46,"text":"I think there's some degree of truth there as well. It's just that it's very hard to fundamentally... You have many explanations for it. It's very hard to know exactly which one is the right explanation. Maybe, let's see, I have seven minutes. Any questions? There's no... I got a question. What's the intuition?"},{"start":4275.06,"text":"So the intuition could be that, oh, maybe this is already small. Then maybe I should directly model that, as opposed to model the original label. So it's a simpler task. The original label, predicting the original label is very hard. But if you predict the difference, probably it's easier. So that's why you model easier tasks with the two layer networks. And that's pretty much it. There's nothing more formal than that."},{"start":4301.85,"text":"Let's see, I have seven minutes. I think, let's see, should I have time to talk about two things? Okay, so maybe let me quickly talk about layer norm. And I can see whether I have time to talk about the convolutional network. So layer norm is also something that people still use in large language models. So, of course, in a slightly different form these days."},{"start":4332.01,"text":"the original layer norm is the following. So basically, still, it's a component, right? So it's a block. So you have some input that's called z. And this component is trying to normalize z in some way. And the way to normalize it is that you say you first turn z into some normalized version of z, which is z minus mu 1 over sigma 1 comma z minus mu m sigma m. Let's say z is m dimensional, sorry, z1."},{"start":4358.02,"text":"I should follow the notes more closely. I think this is of the same. Maybe I should even use... So let's say... I don't remember why I used hat, but let's use hat. So this is how you normalize. Where mu hat is the empirical mean, which is the average of all the z's. And sigma hat is the empirical..."}],"speech_gaps":[],"frame":"../frames/v050/026.webp","frame_time":4254.46},{"title":"层归一化与RMSNorm的对比","segments":[{"id":553,"text":"Sigma hat squared is the empirical average of the standard deviation. So this will empirically normalize it to norm one, right? So you can see it's pretty. And then it's not done yet. And then you turn this into, sometimes people found out, oh, actually mean zero and norm one is not that great.","start":4402.34,"end":4428.87},{"id":554,"text":"for whatever reason. So they say, oh, let's be flexible. Let's also add a flexible tunable parameters, beta and gamma. So the next step is turn this into beta plus gamma z1 minus mu hat, sigma hat.","start":4429.53,"end":4450.59},{"id":555,"text":"where beta is a tunable parameter. Beta is a variable that you can train, and gamma is a variable you can train. And so basically, this make a mean beta and a standard deviation gamma. So that's the original layer norm. And then later, people realized, actually, you probably don't have to do this. So this is the layer norm. And now, I think there's something called RMSAM norm.","start":4457.98,"end":4482.25},{"id":556,"text":"which is even simpler. You don't subtract the mean anymore. You just divide by sigma. So you just say you do z is turned into z1 minus sigma 1 sigma hat. Say zm minus sigma hat. And the sigma hat is also different. Sigma hat is only the average. It's only kind of like the","start":4482.84,"end":4510.66},{"id":557,"text":"You are only averaging over like the, you don't have to, you don't subtract here. So you just try to make the, so sigma hat is something like 1 over m zi, sorry, zi squared. And then you still do the beta thing, right? And then you turn this into beta plus z1 over sigma hat.","start":4511.36,"end":4545.29},{"id":558,"text":"Why this is more better or not, I think it's mostly empirical. So basically here, you don't really want to make it... Let me think about this. Wait, sorry. I think you still need gamma. Sorry. Did I keep gamma or keep the beta? I keep the gamma. Sorry. Bye-bye.","start":4548.33,"end":4563.95},{"id":559,"text":"you do this. So gamma is a trainable parameter. So basically, this is saying that I don't have to care about the shifting mean. I don't really make a mean zero, but I still care about normalizing it in some way. But I still leave some degree of flexibility gamma, which is not really normalizing. I still allow it to...","start":4565.38,"end":4579.84}],"notes":["本段讲解了层归一化（Layer Normalization）的基本思想，即通过计算标准差的样本均值来对数据进行归一化，使其具有单位范数。然而，这种做法并不总是最优的，因此引入了可调参数beta和gamma，以提供更多的灵活性。","在层归一化中，beta和gamma是可训练参数，分别用于调整均值和标准差。这使得模型可以在归一化的基础上进一步调整数据的分布，从而更好地适应任务需求。","随后，课程提到RMSNorm（Root Mean Square Normalization），它比层归一化更简单，仅通过除以标准差来实现归一化，而不进行均值的减法。这种做法减少了计算复杂度，但仍然保留了gamma参数以提供一定的灵活性。","RMSNorm中的标准差计算方式与层归一化不同，它仅计算平方的平均值，而不是标准差的平均值。这种差异使得RMSNorm在某些情况下可能更有效。","课程还提到，RMSNorm的优劣主要基于经验，即在实际应用中通过实验来验证其效果。尽管它简化了归一化过程，但仍然保留了gamma参数以提供一定的调整能力。","最后，讲者提到在RMSNorm中，gamma仍然是一个可训练参数，用于调整数据的分布，但不再强制要求数据的均值为零，而是允许一定程度的灵活性。"],"formulas":[{"latex":"z = \\beta + \\gamma \\frac{z - \\hat{\\mu}}{\\hat{\\sigma}}","symbols":"z 是归一化后的数据，beta 和 gamma 是可训练参数","explanation":"公式正确，符合层归一化（Layer Normalization）的定义，即使用可训练参数 beta 和 gamma 对数据进行缩放和平移。","evidence":"for whatever reason. So they say, oh, let's be flexible. Let's also add a flexible tunable parameters, beta and gamma. So the next step is turn this into beta plus gamma z1 minus mu hat, sigma hat."},{"latex":"z = \\beta + \\gamma \\frac{z}{\\hat{\\sigma}}","symbols":"z 是归一化后的数据，beta 和 gamma 是可训练参数","explanation":"公式正确，符合 RMSNorm 的定义，即仅使用可训练参数 gamma 对数据进行缩放，不进行均值减去操作。","evidence":"You are only averaging over like the, you don't have to, you don't subtract here. So you just try to make the, so sigma hat is something like 1 over m zi, sorry, zi squared. And then you still do the beta thing, right? And then you turn this into beta plus z1 over sigma hat."}],"uncertainties":["sigma hat is only kind of like the"],"diagram":"none","start":4402.34,"end":4579.84,"asr_flags":[],"math_clarifications":["原文提到的 RMSNorm 是一种简化版的归一化方法，仅使用可训练参数 gamma 对数据进行缩放，不进行均值减去操作。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4402.34,"text":"Sigma hat squared is the empirical average of the standard deviation. So this will empirically normalize it to norm one, right? So you can see it's pretty. And then it's not done yet. And then you turn this into, sometimes people found out, oh, actually mean zero and norm one is not that great."},{"start":4429.53,"text":"for whatever reason. So they say, oh, let's be flexible. Let's also add a flexible tunable parameters, beta and gamma. So the next step is turn this into beta plus gamma z1 minus mu hat, sigma hat."},{"start":4457.98,"text":"where beta is a tunable parameter. Beta is a variable that you can train, and gamma is a variable you can train. And so basically, this make a mean beta and a standard deviation gamma. So that's the original layer norm. And then later, people realized, actually, you probably don't have to do this. So this is the layer norm. And now, I think there's something called RMSAM norm."},{"start":4482.84,"text":"which is even simpler. You don't subtract the mean anymore. You just divide by sigma. So you just say you do z is turned into z1 minus sigma 1 sigma hat. Say zm minus sigma hat. And the sigma hat is also different. Sigma hat is only the average. It's only kind of like the"},{"start":4511.36,"text":"You are only averaging over like the, you don't have to, you don't subtract here. So you just try to make the, so sigma hat is something like 1 over m zi, sorry, zi squared. And then you still do the beta thing, right? And then you turn this into beta plus z1 over sigma hat."},{"start":4548.33,"text":"Why this is more better or not, I think it's mostly empirical. So basically here, you don't really want to make it... Let me think about this. Wait, sorry. I think you still need gamma. Sorry. Did I keep gamma or keep the beta? I keep the gamma. Sorry. Bye-bye."},{"start":4565.38,"text":"you do this. So gamma is a trainable parameter. So basically, this is saying that I don't have to care about the shifting mean. I don't really make a mean zero, but I still care about normalizing it in some way. But I still leave some degree of flexibility gamma, which is not really normalizing. I still allow it to..."}],"speech_gaps":[],"frame":"../frames/v050/027.webp","frame_time":4414.34},{"title":"层归一化与缩放不变性","segments":[{"id":560,"text":"to be normalized to something that I will decide later in my training. So this is kind of like the magic here. It's not like you try to force it to normalize to 1, standard deviation 1. You actually say, I first normalize to 1, and then I leave a gamma parameter there so that in the training I can normalize to anything. And I think, let me see. Yeah, I only have one minute. So one benefit of all of this is that you make it kind of like a,","start":4580.57,"end":4608.39},{"id":561,"text":"scaling invariant for both the parameters and the data. So what does that mean is that if you multiply, so maybe let's say you call this whole thing called, let's say z. Let's just say, suppose this whole operation is called a layer norm. So you apply z and you get a layer norm of z. And you can find out that there's a scaling invariant, which means that if you apply","start":4610.29,"end":4636.17},{"id":562,"text":"a scalar, let's say you multiply a scalar, say alpha to z, and you get ln alpha z. But ln alpha z is actually equals to ln z. So basically, no matter how you multiply the input, you don't really change it.","start":4637.29,"end":4657.15},{"id":563,"text":"your matrices or you multiply your input data you never change the output unless you change the some of the parameters like beta and gamma which is you know your test time you're not supposed to change them so basically this makes the model more scaling invariant and in some cases it helps stabilize the model for example","start":4658.09,"end":4678.47},{"id":564,"text":"at least intuitively, with some degree of approximation. At least in the past, when people tuned all of these models, it happens that sometimes you apply these layers many times, and then the output becomes bigger and bigger. And it becomes really big. It's like 10 to the 20 or something like that. And then everything just blows up. So when you normalize every time, then you never got into this issue. And also, it makes the initialization a little more easier so that","start":4679.37,"end":4707.97},{"id":565,"text":"You don't have to, before, if you don't do something right, then suddenly everything just blows up. And now the scaling doesn't really matter that much. But there's also subtlety here, because when you have, OK, this might be a too advanced comment.","start":4708.29,"end":4720.17},{"id":566,"text":"One side effect of this is that when the forward passes scaling environment, but actually the gradient is not scaling environment still. So some of these issues got pushed into the optimization, which is a much more complex matter. Anyway, so I guess, let's see. So I think the only thing I didn't cover is the convolutional network. I think it's in the lecture notes. So if I spend one minute on it, I think it just means that","start":4721.21,"end":4749.83}],"notes":["本段讲解了层归一化（Layer Normalization）的缩放不变性原理。归一化操作通过引入gamma和beta参数，使得模型在训练过程中可以灵活调整缩放和偏移，而不会影响模型的缩放不变性。这种不变性意味着无论输入如何缩放，只要不改变gamma和beta参数，模型的输出不会发生变化。","归一化操作有助于防止梯度爆炸问题。在训练过程中，如果多次应用层，输出可能会变得非常大，导致数值不稳定。通过每次归一化，可以避免这种情况，从而提高模型的稳定性。","归一化还简化了模型的初始化过程。由于归一化操作使得缩放不再那么关键，因此在初始化模型参数时，可以更灵活地选择初始值，而不会导致数值问题。","尽管归一化带来了许多好处，但其也存在一些复杂性。例如，归一化操作可能会影响梯度的传播，使得优化过程变得更加复杂。因此，在实际应用中需要权衡归一化的利弊。","归一化操作在某些情况下可能并不完全有效，尤其是在模型结构较为复杂或数据分布变化较大的情况下。因此，归一化通常需要与其他技术（如权重初始化、正则化等）结合使用，以达到最佳效果。","本段还提到，归一化操作可能在某些情况下引入额外的复杂性，例如在反向传播过程中，梯度的计算可能会受到归一化操作的影响。因此，在实际应用中需要仔细考虑归一化对模型训练和优化的影响。"],"formulas":[],"uncertainties":["ln alpha z is actually equals to ln z","10 to the 20 or something like that"],"diagram":"none","start":4580.57,"end":4749.83,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4580.57,"text":"to be normalized to something that I will decide later in my training. So this is kind of like the magic here. It's not like you try to force it to normalize to 1, standard deviation 1. You actually say, I first normalize to 1, and then I leave a gamma parameter there so that in the training I can normalize to anything. And I think, let me see. Yeah, I only have one minute. So one benefit of all of this is that you make it kind of like a,"},{"start":4610.29,"text":"scaling invariant for both the parameters and the data. So what does that mean is that if you multiply, so maybe let's say you call this whole thing called, let's say z. Let's just say, suppose this whole operation is called a layer norm. So you apply z and you get a layer norm of z. And you can find out that there's a scaling invariant, which means that if you apply"},{"start":4637.29,"text":"a scalar, let's say you multiply a scalar, say alpha to z, and you get ln alpha z. But ln alpha z is actually equals to ln z. So basically, no matter how you multiply the input, you don't really change it. And so that's why no matter how you multiply your"},{"start":4658.09,"text":"your matrices or you multiply your input data you never change the output unless you change the some of the parameters like beta and gamma which is you know your test time you're not supposed to change them so basically this makes the model more scaling invariant and in some cases it helps stabilize the model for example"},{"start":4679.37,"text":"at least intuitively, with some degree of approximation. At least in the past, when people tuned all of these models, it happens that sometimes you apply these layers many times, and then the output becomes bigger and bigger. And it becomes really big. It's like 10 to the 20 or something like that. And then everything just blows up. So when you normalize every time, then you never got into this issue. And also, it makes the initialization a little more easier so that"},{"start":4708.29,"text":"You don't have to, before, if you don't do something right, then suddenly everything just blows up. And now the scaling doesn't really matter that much. But there's also subtlety here, because when you have, OK, this might be a too advanced comment."},{"start":4721.21,"text":"One side effect of this is that when the forward passes scaling environment, but actually the gradient is not scaling environment still. So some of these issues got pushed into the optimization, which is a much more complex matter. Anyway, so I guess, let's see. So I think the only thing I didn't cover is the convolutional network. I think it's in the lecture notes. So if I spend one minute on it, I think it just means that"}],"speech_gaps":[],"frame":"../frames/v050/028.webp","frame_time":4592.57},{"title":"神经网络架构与卷积概念","segments":[{"id":567,"text":"So instead of multiplying a full matrix, you actually multiply a topless matrix. I'm not sure you heard of this word. So basically, it's a matrix with some structures. So instead of having this matrix, convolutional network just basically means you have a matrix that's kind of like this. The non-zeros are only like this.","start":4750.62,"end":4770.31},{"id":568,"text":"And it's actually the same sort of non-zero. So you shift this vector here, and you put it here, and you put it here, and you put it here. It's actually called a filter in some sense. So this matrix, all the other parts of the matrix is zero, and only this.","start":4771.22,"end":4785.62},{"id":569,"text":"what I drew here is non-zero. And also, they share the parameters. So basically, this vector is the same as this vector. So you apply a shifting environment filter to the data. And it's called convolution. Of course, the real thing is a little bit more complicated. So when you have 2D and so on and so forth, it becomes complicated. But in the lecture notes, we have that. But convolutional network is not used that much, except for very hard correlation cases. Even for correlation cases, people use language models.","start":4786.05,"end":4814.83},{"id":570,"text":"transformers a lot. So that's why it's probably fine to skip them. Okay, sounds good.","start":4816.14,"end":4821.56}],"notes":["本段介绍了卷积网络的基本概念，即通过使用稀疏矩阵（topless matrix）来减少计算量。这种矩阵结构中，非零元素仅存在于特定位置，其余为零。这种结构被称为滤波器（filter），在数据处理过程中通过滑动窗口的方式进行操作。","讲者提到，卷积操作在二维数据中会变得更加复杂，但相关理论在讲义中已有说明。此外，讲者指出卷积网络在处理复杂相关性问题时使用较少，而更多情况下人们会使用语言模型（如transformers）来处理相关性问题。","讲者提到transformers在处理相关性问题时被广泛使用，因此建议可以跳过卷积网络的详细讲解。这表明在实际应用中，transformers可能比卷积网络更受欢迎。","讲者在讲解过程中使用了“topless matrix”这一术语，但不确定听众是否了解该术语。这表明在教学过程中，可能需要进一步解释该术语的含义，以确保听众理解。","讲者提到卷积网络的参数共享特性，即同一滤波器在不同位置重复使用，这有助于减少模型的参数数量，提高计算效率。","讲者在讲解过程中提到卷积操作的复杂性，特别是在二维数据中的应用，这表明卷积网络在处理图像等高维数据时具有一定的挑战性。"],"formulas":[],"uncertainties":["topless matrix"],"diagram":"none","start":4750.62,"end":4821.56,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4750.62,"text":"So instead of multiplying a full matrix, you actually multiply a topless matrix. I'm not sure you heard of this word. So basically, it's a matrix with some structures. So instead of having this matrix, convolutional network just basically means you have a matrix that's kind of like this. The non-zeros are only like this."},{"start":4771.22,"text":"And it's actually the same sort of non-zero. So you shift this vector here, and you put it here, and you put it here, and you put it here. It's actually called a filter in some sense. So this matrix, all the other parts of the matrix is zero, and only this."},{"start":4786.05,"text":"what I drew here is non-zero. And also, they share the parameters. So basically, this vector is the same as this vector. So you apply a shifting environment filter to the data. And it's called convolution. Of course, the real thing is a little bit more complicated. So when you have 2D and so on and so forth, it becomes complicated. But in the lecture notes, we have that. But convolutional network is not used that much, except for very hard correlation cases. Even for correlation cases, people use language models."},{"start":4816.14,"text":"transformers a lot. So that's why it's probably fine to skip them. Okay, sounds good."}],"speech_gaps":[],"frame":"../frames/v050/029.webp","frame_time":4762.62}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}

else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
