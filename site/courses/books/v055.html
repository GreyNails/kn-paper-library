t-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：AI项目策略 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v055","title":"斯坦福CS230：AI项目策略","course":"深度学习","pages":[{"title":"AI项目策略与实践","segments":[{"id":0,"text":"What I want to do today is continue our discussion on AI project strategy. If you're building a deep learning system,","start":1.68,"end":9.64},{"id":1,"text":"for some tasks. And today, for the first part of today, I'm going to use a speech recognition voice-activated device example. And then for the second half, I'm going to use an AIT researcher example. But what I want to do is walk you through a couple of concrete examples of projects you might work on.","start":10.49,"end":31.85},{"id":2,"text":"and let you understand what it feels like to be in the thick of building an AI system, making day-to-day decisions on what to do next. I find that, I think as you've heard me say before, understanding the algorithms is important. In this class, you learn a lot from the online videos about the deep learning algorithms, how to build pipelines, but even beyond understanding how the algorithms work.","start":32.85,"end":56.43},{"id":3,"text":"What really drives performance is a team's ability to have an efficient development process. How do you tune? How do you practice? How do you collect data? When you try something and it doesn't work the first time, which it often doesn't, what do you do next? Your skill at making those decisions is what often makes a massive, literally 10x difference in productivity. And as I was reflecting, I was preparing for what to say to you today, I was reflecting on quite a few projects where...","start":57.24,"end":81.96},{"id":4,"text":"that 10x difference in productivity is really not an exaggeration. Maybe more than 10x. But I've literally seen many teams in many well-known companies with good brands spend a year working on a project that I will see a more skilled team execute in like a month. So these differences in skill are real.","start":83.2,"end":105.4},{"id":5,"text":"And one of the challenges for new people learning this is if you work for some company, maybe you work on a different project every year or two.","start":106.11,"end":114.77},{"id":6,"text":"But it takes you like two years or a year of your life to gain experience on one more project. And then after, I don't know, 10 years, you've finally seen 10 projects and a pretty experience. But what I want to do is, in today's class, walk you through a few concrete examples of projects that are similar. So I want to kind of simplify versions of stuff that I've seen myself to try to accelerate your...","start":115.29,"end":140.47},{"id":7,"text":"hands-on experience looking at these projects and thinking through if you are the one in the hot seat building a system and it works or doesn't work or there's a problem or whatever, making those decisions for what you would do. So I try to get you through that today with a couple examples rather than you having to spend years and years of your life to finally see a small number of examples of how these projects can be driven.","start":140.99,"end":164.43}],"notes":["本段主要讲解了AI项目策略的重要性，强调了在实际开发过程中，团队的高效开发流程对性能的决定性作用。讲者指出，理解算法固然重要，但更重要的是如何在日常开发中做出决策，这种决策能力可以带来10倍甚至更多的生产力提升。","讲者通过对比不同团队在项目开发中的表现，说明了经验积累的重要性。新入行的人可能需要花费数年时间才能积累足够的项目经验，而通过课程中的具体案例，可以加速这一过程。","讲者提到，课程的目标是通过简化和具体化实际项目，帮助学生更快地获得实践经验。学生将通过分析这些案例，思考在实际开发中遇到问题时应如何应对，从而提升自己的决策能力。","讲者强调，AI项目的成功不仅依赖于算法本身，更依赖于团队的开发流程、数据收集、调试和迭代能力。这些能力的提升是实现高效开发的关键。","讲者指出，实际项目中经常遇到的问题包括：如何调试、如何优化、如何收集数据等。这些问题的解决需要团队的协作和经验积累。","通过这些具体案例，学生可以更好地理解AI项目的实际运作方式，以及如何在实际开发中做出关键决策。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1.68,"end":164.43,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1.68,"text":"What I want to do today is continue our discussion on AI project strategy. If you're building a deep learning system,"},{"start":10.49,"text":"for some tasks. And today, for the first part of today, I'm going to use a speech recognition voice-activated device example. And then for the second half, I'm going to use an AIT researcher example. But what I want to do is walk you through a couple of concrete examples of projects you might work on."},{"start":32.85,"text":"and let you understand what it feels like to be in the thick of building an AI system, making day-to-day decisions on what to do next. I find that, I think as you've heard me say before, understanding the algorithms is important. In this class, you learn a lot from the online videos about the deep learning algorithms, how to build pipelines, but even beyond understanding how the algorithms work."},{"start":57.24,"text":"What really drives performance is a team's ability to have an efficient development process. How do you tune? How do you practice? How do you collect data? When you try something and it doesn't work the first time, which it often doesn't, what do you do next? Your skill at making those decisions is what often makes a massive, literally 10x difference in productivity. And as I was reflecting, I was preparing for what to say to you today, I was reflecting on quite a few projects where..."},{"start":83.2,"text":"that 10x difference in productivity is really not an exaggeration. Maybe more than 10x. But I've literally seen many teams in many well-known companies with good brands spend a year working on a project that I will see a more skilled team execute in like a month. So these differences in skill are real."},{"start":106.11,"text":"And one of the challenges for new people learning this is if you work for some company, maybe you work on a different project every year or two."},{"start":115.29,"text":"But it takes you like two years or a year of your life to gain experience on one more project. And then after, I don't know, 10 years, you've finally seen 10 projects and a pretty experience. But what I want to do is, in today's class, walk you through a few concrete examples of projects that are similar. So I want to kind of simplify versions of stuff that I've seen myself to try to accelerate your..."},{"start":140.99,"text":"hands-on experience looking at these projects and thinking through if you are the one in the hot seat building a system and it works or doesn't work or there's a problem or whatever, making those decisions for what you would do. So I try to get you through that today with a couple examples rather than you having to spend years and years of your life to finally see a small number of examples of how these projects can be driven."}],"speech_gaps":[],"frame":"../frames/v055/001.webp","frame_time":13.68},{"title":"语音控制设备的简化设置","segments":[{"id":8,"text":"So the first two motivating examples I'm going to use today is building a voice-activated device. In my house, I have Amazon Echo. I have a lot of them, actually, and I think it's a delightful experience.","start":166.37,"end":183.97},{"id":9,"text":"But those devices like that, Amazon Echo or Google Home or the Apple 3 HomePod, they require quite a bit of setup. They require some setup. Connect to the Wi-Fi, figure out a way to connect to your phone. Actually, for a long time, even though I built smart speakers, for a long time in my house, I had one light bulb connected to my home.","start":184.87,"end":208.31},{"id":10,"text":"Wi-Fi internet, you know, because it's just so much of a hassle to set things up. I think now I have two light bulbs connected in my house. I guess I should connect my stuff. But so for this little example, I want to talk about if you are part of a startup, building a new product that makes it much easier to get these voice control devices without the user needing to do this home Wi-Fi.","start":208.91,"end":236.37},{"id":11,"text":"setup process. So, you know, I'm not very good at drawing, but if you could go to some store and buy a desk lamp, and the desk lamp already has a name, let's call this lamp Robert, and you could just take it, plug it into the electricity, plug it into your desk, and then say, Robert, turn on, and then it turns on. Say, Robert, turn on.","start":236.84,"end":260.73},{"id":12,"text":"that turns off without needing to be connected to the internet, there's a cloud access and all that. And that would give users an easier set of experience. There's a project that my friends and I actually discussed a few years ago that we thought would actually be a decent startup idea. We decided not to do it because there were too many other ideas that we were even more excited about. But we felt that it was actually a reasonable startup idea to build a little IC circuit, a little integrated circuit.","start":261.15,"end":285.45},{"id":13,"text":"to sell to, say, LAMP manufacturers and other device manufacturers to make it really easy if, say, some company sells LAMPs to build little things so they can very quickly make their devices voice-enabled. And if you have a few pre-built names, maybe give the users a choice. You can call your LAMP Robert or Lainer or, I don't know, or Johnny or, I don't know, Alice or whatever. Have a little switch. Then users could just buy a LAMP.","start":286.22,"end":314.3},{"id":14,"text":"Put it down and then immediately have it be voice controlled without needing to worry about","start":314.82,"end":318.9}],"notes":["本段讨论了如何简化语音控制设备的设置过程，以避免用户需要连接Wi-Fi或进行复杂的配置。讲者提到，理想情况下，用户只需购买一个带有预设名称的设备，例如灯泡，然后直接使用语音命令进行控制，而无需连接互联网。这种设想是基于一个曾经讨论过的创业想法，即开发一个小型集成电路，使其能够被灯泡制造商等设备制造商使用，从而快速实现语音控制功能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":166.37,"end":318.9,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":166.37,"text":"So the first two motivating examples I'm going to use today is building a voice-activated device. In my house, I have Amazon Echo. I have a lot of them, actually, and I think it's a delightful experience."},{"start":184.87,"text":"But those devices like that, Amazon Echo or Google Home or the Apple 3 HomePod, they require quite a bit of setup. They require some setup. Connect to the Wi-Fi, figure out a way to connect to your phone. Actually, for a long time, even though I built smart speakers, for a long time in my house, I had one light bulb connected to my home."},{"start":208.91,"text":"Wi-Fi internet, you know, because it's just so much of a hassle to set things up. I think now I have two light bulbs connected in my house. I guess I should connect my stuff. But so for this little example, I want to talk about if you are part of a startup, building a new product that makes it much easier to get these voice control devices without the user needing to do this home Wi-Fi."},{"start":236.84,"text":"setup process. So, you know, I'm not very good at drawing, but if you could go to some store and buy a desk lamp, and the desk lamp already has a name, let's call this lamp Robert, and you could just take it, plug it into the electricity, plug it into your desk, and then say, Robert, turn on, and then it turns on. Say, Robert, turn on."},{"start":261.15,"text":"that turns off without needing to be connected to the internet, there's a cloud access and all that. And that would give users an easier set of experience. There's a project that my friends and I actually discussed a few years ago that we thought would actually be a decent startup idea. We decided not to do it because there were too many other ideas that we were even more excited about. But we felt that it was actually a reasonable startup idea to build a little IC circuit, a little integrated circuit."},{"start":286.22,"text":"to sell to, say, LAMP manufacturers and other device manufacturers to make it really easy if, say, some company sells LAMPs to build little things so they can very quickly make their devices voice-enabled. And if you have a few pre-built names, maybe give the users a choice. You can call your LAMP Robert or Lainer or, I don't know, or Johnny or, I don't know, Alice or whatever. Have a little switch. Then users could just buy a LAMP."},{"start":314.82,"text":"Put it down and then immediately have it be voice controlled without needing to worry about"}],"speech_gaps":[],"frame":"../frames/v055/002.webp","frame_time":178.37},{"title":"语音助手与设备命名策略","segments":[{"id":15,"text":"How do you get this onto my Wi-Fi network? And if my internet is down, then my whole house stays dark as well. Bizarre things like that, right? And I actually did once have an, I was building a lot of voice assistants. I actually set up my office to have a lot of voice control devices. So I had different names with different lamps, standing desk with his name as well. So I'd say, I forget what my desk name was, you know, like, you know, Jonathan, go higher or whatever. And then my standing desk would go up and down. It's actually pretty cool.","start":319.41,"end":347.01},{"id":16,"text":"So what I want you to, so just for today's illustration.","start":349.65,"end":355.7},{"id":17,"text":"probably we should give the different devices different names because you can't have every device in your house called Robert. Otherwise, you say, Robert, turn on. The whole house illuminates. Then Robert, turn off. The whole house is plunged into darkness. So we found out you do need different devices to have different names. But just for today, I'm going to use as illustration the task of training a neural network or building a system that detects when someone says, Robert, turn on.","start":356.85,"end":384.99},{"id":18,"text":"And you need kind of Robert turn on, Robert turn off. If you have a choice of names, it would be Lena turn on, Lena turn off, a variety of handful of options of names. But just for simplicity, I'm going to worry only about detecting the phrase Robert turn on. And what do we do for this? You can rinse and repeat to get the turn off command and a handful of other names to make them user selectable. What name do you want to give this thing? So,","start":385.34,"end":413.82},{"id":19,"text":"This is something that needs to run on device, small IC circuits. And I'm going to ask you a question. When you've graduated from CS230, or maybe when you graduated from Stanford, if you are the CTO of a startup responsible for building this, what would you do?","start":415.98,"end":440.61},{"id":20,"text":"right? So call out. So imagine you just graduated from CS230 or just graduated from Stanford, and you're the CTO of a startup, and you want to build this lamp that can turn on when anyone says, Robert, turn on. How would you approach this problem? And I know this is an incredibly open-ended question, and it turns out life is incredibly open-ended, right? You graduate from CS230, you have to decide what to do. So if this is what you're doing, if you're going to raise your hand and call out, if you want to build this product,","start":441.02,"end":469.9},{"id":21,"text":"What's the first thing you do? How would you think about it?","start":471.25,"end":473.33},{"id":22,"text":"Go for it.","start":476.29,"end":476.89}],"notes":["本段主要讨论在构建语音助手系统时，如何为不同设备分配不同的名称以避免混淆。讲者提到在办公室中使用多个语音控制设备，并为每个设备分配了不同的名称，如灯和站立式办公桌，以确保命令的准确执行。","讲者进一步指出，如果所有设备都使用相同的名称，如'Robert'，则可能导致误操作，例如所有设备同时开启或关闭。因此，为不同设备分配不同的名称是必要的。","讲者以训练神经网络检测特定语音命令（如'Robert, turn on'）为例，说明如何构建一个能够响应特定指令的系统。他提到可以扩展此方法以支持其他命令，如'Robert, turn off'，并让用户选择不同的名称。","讲者还提到，该系统需要在小型集成电路（IC）上运行，这表明对硬件资源的限制。他随后提问，如果毕业生成为初创公司的首席技术官（CTO），如何解决这个问题，强调了实际工程挑战。","最后，讲者鼓励学生思考如何解决这个问题，并指出这是一个开放性问题，反映了现实世界中技术决策的复杂性。","整个段落通过实际例子说明了语音助手系统设计中的关键问题，包括设备命名、命令识别和系统部署，强调了理论与实践的结合。"],"formulas":[],"uncertainties":[],"diagram":"none","start":319.41,"end":476.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":319.41,"text":"How do you get this onto my Wi-Fi network? And if my internet is down, then my whole house stays dark as well. Bizarre things like that, right? And I actually did once have an, I was building a lot of voice assistants. I actually set up my office to have a lot of voice control devices. So I had different names with different lamps, standing desk with his name as well. So I'd say, I forget what my desk name was, you know, like, you know, Jonathan, go higher or whatever. And then my standing desk would go up and down. It's actually pretty cool."},{"start":349.65,"text":"So what I want you to, so just for today's illustration."},{"start":356.85,"text":"probably we should give the different devices different names because you can't have every device in your house called Robert. Otherwise, you say, Robert, turn on. The whole house illuminates. Then Robert, turn off. The whole house is plunged into darkness. So we found out you do need different devices to have different names. But just for today, I'm going to use as illustration the task of training a neural network or building a system that detects when someone says, Robert, turn on."},{"start":385.34,"text":"And you need kind of Robert turn on, Robert turn off. If you have a choice of names, it would be Lena turn on, Lena turn off, a variety of handful of options of names. But just for simplicity, I'm going to worry only about detecting the phrase Robert turn on. And what do we do for this? You can rinse and repeat to get the turn off command and a handful of other names to make them user selectable. What name do you want to give this thing? So,"},{"start":415.98,"text":"This is something that needs to run on device, small IC circuits. And I'm going to ask you a question. When you've graduated from CS230, or maybe when you graduated from Stanford, if you are the CTO of a startup responsible for building this, what would you do?"},{"start":441.02,"text":"right? So call out. So imagine you just graduated from CS230 or just graduated from Stanford, and you're the CTO of a startup, and you want to build this lamp that can turn on when anyone says, Robert, turn on. How would you approach this problem? And I know this is an incredibly open-ended question, and it turns out life is incredibly open-ended, right? You graduate from CS230, you have to decide what to do. So if this is what you're doing, if you're going to raise your hand and call out, if you want to build this product,"},{"start":471.25,"text":"What's the first thing you do? How would you think about it?"},{"start":476.29,"text":"Go for it."}],"speech_gaps":[],"frame":"../frames/v055/003.webp","frame_time":331.41},{"title":"AI项目策略与模型构建","segments":[{"id":23,"text":"Yeah, cool. Yeah, right. So get some, like, an open-source speech-to-text","start":495.25,"end":501.09},{"id":24,"text":"model or something and it's even running. Yeah, that'd be a good start. Anything else? Yeah, go ahead.","start":501.09,"end":507.07},{"id":25,"text":"Okay, sorry, three models. One that detects the robot and then one that...","start":523.13,"end":526.21},{"id":26,"text":"Well, the first one detects the word sound, the second one detects the word Robert, and the third one tries to understand what kind of sentence is after the word Robert.","st rs.","start":706.23,"end":733.35},{"id":80,"text":"But it turns out that if you look at the smart speakers, there's usually, if you want to train a neural network just to detect one phrase, be it a phrase like, you know, OK Google or Hey Siri or Alexa or whatever, and then the smart speaker trigger words, that can be done with a fairly small.","start":734.41,"end":754.46},{"id":81,"text":"neural network. Although, to your point, if we want to do different neural networks, different words, we'll need to swap out different neural networks and rinse and repeat that. But if you have only a small handful of names, phrases you want to take, I think that would be okay. And then one other piece of advice I would give if you're embarking on this is, the first thing I would do, actually, if I was working on this for the first time, is actually a literature search. And it turns out that","start":754.99,"end":780.61},{"id":82,"text":"I think we're fortunate that the AI world has a ton of open source software and a ton of open research papers.","start":781.81,"end":791.33},{"id":83,"text":"Somewhat surprisingly, despite smart speakers haven't been around for a long time, there still to this day isn't like a single architecture that everyone's agreed on, on the best way to do this. If you look at the literature, there's still actually a diversity of opinions on how to do this type of wake word or trigger word. So when you say something like, you know, OK Google or Hey Siri or Alexa, that's sometimes called a wake word because it wakes up the device or trigger word, triggers the device's activity.","start":792.62,"end":819.98},{"id":84,"text":"So somewhat surprisingly, even though we're smart speakers for a long time now, for a lot more than a decade, there still isn't a single agreed-on unified architecture that the community has agreed on. And what's the best algorithm to do this? But I feel like if you are embarking on this for the first time,","start":820.89,"end":840.72}],"no arning. So something I've often done is, you know, I will do my own work, right? I don't want to call random experts to try to bother them before I've at least done my work. But if you've...","start":969.61,"end":982.47},{"id":91,"text":"uh sometimes i'm reading a paper i'm really struggling to understand it and i find that instead of me struggling for another like four hours um if i send the authors a respectful email uh and say hey i read your paper try to understand this i'm still confused can you help me out can you explain this to me a lot of the time um including when you know i was","start":982.96,"end":1004.9}],"notes":["本段具体说明了在阅读论文时遇到困难时，可以向作者发送邮件请求帮助，这是一种有效的学习加速策略。讲者提到，当自己在理解论文时遇到困难，花费大量时间仍无法解决时，可以礼貌地向作者求助，以获得更清晰的解释。这种做法在实际学习中非常有用，尤其是在面对复杂或晦涩的论文时。","讲者强调了在学习过程中，主动寻求专家帮助的重要性。虽然讲者提到自己通常不会在没有完成自己工作之前就打扰专家，但一旦遇到难以解决的问题，向作者请教是一种有效的学习方式。这种策略可以帮助学习者更快地理解复杂概念。","讲者还提到，当阅读论文时，如果发现自己无法理解某些部分，可以尝试通过邮件与作者沟通。这种做法不仅有助于个人学习，还能促进学术交流，提高论文的理解深度。","讲者指出，有时即使花费大量时间阅读论文，仍然无法完全理解其内容。因此，主动寻求帮助是一种有效的学习策略，可以节省时间并提高学习效率。","讲者提到，当自己在阅读论文时遇到困难，可以发送邮件给作者，礼貌地请求帮助。这种做法在学术界是常见的，有助于促进知识的传播和理解。","讲者强调了在学习过程中，主动寻求帮助的重要性。虽然讲者提到自己通常不会在没有完成自己工作之前就打扰专家，但一旦遇到难以解决的问题，向作者请教是一种有效的学习方式。这种策略可以帮助学习者更快地理解复杂概念。"],"formulas":[],"uncertainties":["uh sometimes i'm reading a paper i'm really struggling to understand it and i find that instead of me struggling for another like four hours um if i send the authors a respectful email uh and say hey i read your paper try to understand this i'm still confused can you help me out can you explain this to me a lot of the time um including when you know i was"],"diagram":"none","start":842.3,"end":1004.9,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":842.3,"text":"the number one boost in your speed of learning, it could be implementing something, but I would say doing a literature search and trying open source software would be the even faster accelerator. And I want to give you a few tips for that, right? Real quick. S ne is, you know, I will do my own work, right? I don't want to call random experts to try to bother them before I've at least done my work. But if you've..."},{"start":982.96,"text":"uh sometimes i'm reading a paper i'm really struggling to understand it and i find that instead of me struggling for another like four hours um if i send the authors a respectful email uh and say hey i read your paper try to understand this i'm still confused can you help me out can you explain this to me a lot of the time um including when you know i was"}],"speech_gaps":[],"frame":"../frames/v055/006.webp","frame_time":854.3},{"title":"寻求专家帮助与数据集构建","segments":[{"id":92,"text":"That's well known, right? But I think a lot of people, if they see that you're doing your work and not just reaching out to them before you've even done anything, a lot of them, not everyone, but a lot of research authors would actually be quite understanding and try to help you out. And so I find that for a lot of projects I did, finding that one expert.","start":1005.33,"end":1026.33},{"id":93,"text":"Sometimes a Stanford professor, actually, we have a lot of speech faculty in the Stanford faculty as well. But when I had problems with my speech recognition system, you know, sometimes I called like, you know, Dan Jurowski, whatever. And then like a half-hour conversation or even a 10-minute conversation really accelerates.","start":1027.36,"end":1044.32},{"id":94,"text":"what I've been able to do. So I just encourage you to, it takes you like 10 minutes to send an email, and maybe there's a 50% chance of a spot, I don't know, right? Not 100% chance, but sometimes that tends to be really high ROI, right? And then what I think you find is that if you do a literature search, you will likely discover that","start":1045.1,"end":1067.58},{"id":95,"text":"Most of the robust enterprise-grade smart speaker systems all have a specialized system trained to detect the wake word or the trigger word. And again, there's a variety of architectures. You probably come up with some good neural network architectures for this.","start":1068.41,"end":1082.93},{"id":96,"text":"And it turns out that there was no data set on the internet with lots of people saying Robert Turnoff, right? That's just not a thing, right? So if you decide that the names are Robert and Lainer and, you know, I don't know, Jeremy and Alicia or whatever. Sorry, if there are people with those real names. It was actually kind of weird when we chose people's names, but we just did that for some reason. But it turns out that there is no...","start":1084.13,"end":1106.29},{"id":97,"text":"large data set on the internet of lots of people saying Robert Turnon. So if you want to train a neural network to detect if someone has said this phrase, you need to collect that data yourself. So let me then ask you another question. Say you've done a literature search, found some open source code you can try, but that has led you, say, to conclude that you need a data set of people saying Robert Turnon.","start":1106.61,"end":1131.75},{"id":98,"text":"you need a data set to train, to distinguish between someone saying Robert Turnon versus not someone saying Robert Turnon. How would you approach getting a data set like that? Yeah, go for it. Text-to-speech. Yeah, cool. You use text-to-speech as one method. I'll come back to that later. Oh, sorry?","start":1133.83,"end":1163.89}],"notes":["本段主要讨论在进行AI项目时，如何通过寻求专家帮助来加速问题解决。讲者提到，即使没有完成工作，也可以向专家请教，很多研究者会理解并提供帮助。此外，讲者还提到，发送一封简短的邮件只需要10分钟，虽然成功率可能只有50%，但回报率很高。","讲者进一步说明，当遇到具体问题时，如语音识别系统的问题，可以联系相关领域的专家进行咨询，例如斯坦福大学的语音教授。通过简短的电话交流，可以显著提升项目进展。","讲者提到，进行文献搜索是项目开发的重要步骤，可以帮助发现现有解决方案和相关技术。然而，有时可能发现没有现成的数据集，例如用于检测唤醒词的数据集。","讲者以“Robert Turnon”为例，说明在没有现成数据集的情况下，需要自行收集数据。这涉及到如何构建一个数据集来区分特定短语的出现与否，这通常需要使用文本到语音（TTS）技术来生成数据。","讲者强调，当没有现成数据集时，必须自行收集数据，这可能涉及使用文本到语音技术生成所需的数据。这为后续的模型训练提供了基础。","讲者最后提到，虽然文本到语音技术是一个可行的方法，但会稍后进一步讨论。这表明在实际项目中，数据收集和生成是关键步骤之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1005.33,"end":1163.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1005.33,"text":"That's well known, right? But I think a lot of people, if they see that you're doing your work and not just reaching out to them before you've even done anything, a lot of them, not everyone, but a lot of research authors would actually be quite understanding and try to help you out. And so I find that for a lot of projects I did, finding that one expert."},{"start":1027.36,"text":"Sometimes a Stanford professor, actually, we have a lot of speech faculty in the Stanford faculty as well. But when I had problems with my speech recognition system, you know, sometimes I called like, you know, Dan Jurowski, whatever. And then like a half-hour conversation or even a 10-minute conversation really accelerates."},{"start":1045.1,"text":"what I've been able to do. So I just encourage you to, it takes you like 10 minutes to send an email, and maybe there's a 50% chance of a spot, I don't know, right? Not 100% chance, but sometimes that tends to be really high ROI, right? And then what I think you find is that if you do a literature search, you will likely discover that"},{"start":1068.41,"text":"Most of the robust enterprise-grade smart speaker systems all have a specialized system trained to detect the wake word or the trigger word. And again, there's a variety of architectures. You probably come up with some good neural network architectures for this."},{"start":1084.13,"text":"And it turns out that there was no data set on the internet with lots of people saying Robert Turnoff, right? That's just not a thing, right? So if you decide that the names are Robert and Lainer and, you know, I don't know, Jeremy and Alicia or whatever. Sorry, if there are people with those real names. It was actually kind of weird when we chose people's names, but we just did that for some reason. But it turns out that there is no..."},{"start":1106.61,"text":"large data set on the internet of lots of people saying Robert Turnon. So if you want to train a neural network to detect if someone has said this phrase, you need to collect that data yourself. So let me then ask you another question. Say you've done a literature search, found some open source code you can try, but that has led you, say, to conclude that you need a data set of people saying Robert Turnon."},{"start":1133.83,"text":"you need a data set to train, to distinguish between someone saying Robert Turnon versus not someone saying Robert Turnon. How would you approach getting a data set like that? Yeah, go for it. Text-to-speech. Yeah, cool. You use text-to-speech as one method. I'll come back to that later. Oh, sorry?"}],"speech_gaps":[],"frame":"../frames/v055/007.webp","frame_time":1017.33},{"title":"数据收集与隐私问题","segments":[{"id":99,"text":"Yep, cool. Yep, I like that. So walk around and ask people. Tell them what you're doing. Get the permission to record and use their voice. And if they're okay giving permission, just record their voices. Yeah, I like that. Anything else? Cool. Yeah. Oh, sorry. Can you say that again? Oh, yep, cool. Yeah, yep, cool. Yep, right. So samples of people saying not Robert Turnoff. Yeah, yep. I see. Cool.","start":1170.66,"end":1242.88},{"id":100,"text":"Actually, right. So the data is what people are saying, rob it, but you don't want that to be a mistake. And that's a good point. I'll come back to that later. Yes. Did you say something? Oh, same thing. Oh, interesting. Cool. Awesome. Great. All right. So one of the...","start":1244.94,"end":1259.46},{"id":101,"text":"Yes. So I really like the idea of just going around and asking people for permission to record their voices. And by the way, in today's world, privacy is important. Consent is important. So don't do anything sneaky or weird. Just tell people clearly what you're doing. Ask them for permission. Make sure any permission is freely given. And if they don't give permission, it's fine. They really respect people's privacy. That is really important.","start":1260.5,"end":1284.22},{"id":102,"text":"Having said that, I find that a lot of people in the world are very nice. Not everyone, but the vast majority of people in the world seem very nice. And you ask them nicely, you know.","start":1284.97,"end":1293.03},{"id":103,"text":"I know this because I've done this myself. They will give permission for you to provide their data. And then just one of the framing I encourage you to think about as always is the speed. So how long will it take you to wander around campus or wander around San Francisco and collect a sample of voices? And I think you actually get a lot done. You'll get maybe dozens of samples, maybe hundreds of samples easily in a day. So I think those are...","start":1293.74,"end":1318.94},{"id":104,"text":"good tactics. Let me share with you some things. It turns out synthetic data using text-to-speech is an interesting tactic. I would usually not use that as the first thing I do, mainly because it turns out it's hard to know","start":1319.32,"end":1339.98}],"notes":["本段主要讨论数据收集过程中获取用户同意的重要性，强调隐私和知情同意原则。讲者指出，在收集语音数据时，必须明确告知用户并获得他们的同意，以确保数据使用的合法性。","讲者提到，虽然大多数人愿意提供数据，但并非所有人都会同意，因此必须尊重用户的隐私权。同时，讲者指出，收集数据的过程应透明，避免任何可能引起误解的行为。","讲者还提到，收集数据的效率问题，指出在校园或城市中，可以在一天内轻松收集数十甚至数百个语音样本，这表明数据收集的可行性。","此外，讲者提到合成数据（如使用文本到语音技术）是一种有趣的策略，但通常不会将其作为首选方法，因为其效果可能不如真实数据。","讲者强调，数据收集的策略应始终考虑速度和效率，同时确保数据的合法性和道德性。","最后，讲者提到，合成数据的使用可能涉及技术挑战，因此需要进一步研究和探索。"],"formulas":[],"uncertainties":["rob it"],"diagram":"none","start":1170.66,"end":1339.98,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1170.66,"text":"Yep, cool. Yep, I like that. So walk around and ask people. Tell them what you're doing. Get the permission to record and use their voice. And if they're okay giving permission, just record their voices. Yeah, I like that. Anything else? Cool. Yeah. Oh, sorry. Can you say that again? Oh, yep, cool. Yeah, yep, cool. Yep, right. So samples of people saying not Robert Turnoff. Yeah, yep. I see. Cool."},{"start":1244.94,"text":"Actually, right. So the data is what people are saying, rob it, but you don't want that to be a mistake. And that's a good point. I'll come back to that later. Yes. Did you say something? Oh, same thing. Oh, interesting. Cool. Awesome. Great. All right. So one of the..."},{"start":1260.5,"text":"Yes. So I really like the idea of just going around and asking people for permission to record their voices. And by the way, in today's world, privacy is important. Consent is important. So don't do anything sneaky or weird. Just tell people clearly what you're doing. Ask them for permission. Make sure any permission is freely given. And if they don't give permission, it's fine. They really respect people's privacy. That is really important."},{"start":1284.97,"text":"Having said that, I find that a lot of people in the world are very nice. Not everyone, but the vast majority of people in the world seem very nice. And you ask them nicely, you know."},{"start":1293.74,"text":"I know this because I've done this myself. They will give permission for you to provide their data. And then just one of the framing I encourage you to think about as always is the speed. So how long will it take you to wander around campus or wander around San Francisco and collect a sample of voices? And I think you actually get a lot done. You'll get maybe dozens of samples, maybe hundreds of samples easily in a day. So I think those are..."},{"start":1319.32,"text":"good tactics. Let me share with you some things. It turns out synthetic data using text-to-speech is an interesting tactic. I would usually not use that as the first thing I do, mainly because it turns out it's hard to know"}],"speech_gaps":[],"frame":"../frames/v055/008.webp","frame_time":1182.66},{"title":"合成数据在语音识别和自动驾驶中的应用","segments":[{"id":105,"text":"How accurate synthetic data is compared to true natural data. And maybe just show you one thing I've run into. I've actually done a lot of synthetic data for speech recognition, right? One thing you have to watch out for is...","start":1341.77,"end":1355.47},{"id":106,"text":"If you go to a lot of the synthetic sources of data, how many voices, how many different voices does it provide? And is it going to be a pain to get enough diversity in different people's voices? So it turns out, I don't know, for example, I often talk to...","start":1356.01,"end":1375.05},{"id":107,"text":"open voice on my phone, right, instead of typing. But the number of voices there is limited. And if you go to TTS provider, I guess there are now some services with a larger number of voices, but these are things you end up worrying about. And it's all solvable. Synthetic data does work for speech recognition, right? But it turns out that they're often...","start":1375.62,"end":1395.44},{"id":108,"text":"enough details associated with filling with the synthetic data generation process, that ends up taking longer. So for a lot of machine learning applications, using synthetic data is a good idea.","start":1395.94,"end":1409.0},{"id":109,"text":"And eventually you might get around to it. But using synthetic data is usually not the first type of data I would collect because usually there's just too many hyperparameters and too many knobs you have to worry about. And then at the back of your head, you'll be wondering whether there's something weird about the synthetic data that I've not thought of before. Whereas you collect natural data, collect real data, it's just one less thing to worry about.","start":1409.58,"end":1437.42},{"id":110,"text":"Maybe just to tell one more story, not as speech, but self-driving cars, right? So you're building self-driving cars, you want to detect other cars. Where do you get pictures of cars? It turns out that a lot of people will have the idea of, oh, there are lots of video games with cars driving around. Why don't we use video games to get pictures of cars out of the video game?","start":1439.05,"end":1462.37},{"id":111,"text":"But it turns out a problem with a lot of video games is there could be like 20 different cars in the entire video game.","start":1464.22,"end":1470.8},{"id":112,"text":"It depends on the video game.","start":1470.86,"end":1471.84},{"id":113,"text":"But it turns out that to have a realistic video game, you don't need a thousand different cars.","start":1471.98,"end":1477.2},{"id":114,"text":"There are tons of different car designs on the road, but you need a very narrow set of cars.","start":1477.36,"end":1482.16},{"id":115,"text":"And so to a human, seeing the same 20 cars over and over, it looks like a road, looks fine, the video game plays fine.","start":1482.4,"end":1488.62},{"id":116,"text":"But for a lot of video games, the data just isn't rich enough to capture anywhere near","start":1488.62,"end":1494.44},{"id":117,"text":"the richness of the real world.","start":1494.44,"end":1495.7},{"id":118,"text":"Whereas in contrast, if you've got real pictures, there's just one less thing to worry about.","start":1496.1,"end":1500.12},{"id":119,"text":"So I find that for society data, it works, it's very valuable to use it a lot, but I","start":1500.48,"end":1506.06},{"id":120,"text":"usually get to it only later in the process.","start":1506.06,"end":1508.98},{"id":121,"text":"And then in the interest of building these things quickly, let me share with you the","start":1511.78,"end":1520.7}],"notes":["本段讨论了合成数据在语音识别和自动驾驶中的应用，指出合成数据虽然在某些情况下有效，但存在多样性不足的问题。例如，在语音识别中，合成数据可能无法提供足够的语音多样性，导致训练效果不佳。在自动驾驶中，视频游戏中的车辆数据虽然丰富，但缺乏现实世界的复杂性。","合成数据在语音识别中可能需要更多的细节和时间来生成，这使得其在实际应用中需要权衡。合成数据虽然可以用于训练，但通常不是首选的数据来源，因为其涉及的超参数和调整项较多，且可能存在未考虑到的异常。","在自动驾驶的场景中，视频游戏中的车辆数据虽然数量多，但缺乏现实世界的多样性。例如，视频游戏中可能只有20种不同的车辆，而现实中车辆设计种类繁多，但自动驾驶系统只需要特定的车辆类型。","合成数据在某些情况下是有效的，但通常不是首选的数据来源。使用合成数据需要考虑其生成过程的复杂性和潜在的异常，而使用真实数据则可以减少这些担忧。","合成数据在某些领域如语音识别和自动驾驶中具有价值，但通常在项目后期才被使用。这主要是因为合成数据的生成和调整需要更多的时间和资源，而真实数据则更直接且易于处理。","合成数据的使用需要权衡其优缺点。虽然合成数据可以提供大量数据，但其多样性和现实性可能不足，而真实数据虽然更可靠，但获取和处理的成本较高。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1341.77,"end":1520.7,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1341.77,"text":"how accurate synthetic data is compared to true natural data. And maybe just show you one thing I've run into. I've actually done a lot of synthetic data for speech recognition, right? One thing you have to watch out for is..."},{"start":1356.01,"text":"If you go to a lot of the synthetic sources of data, how many voices, how many different voices does it provide? And is it going to be a pain to get enough diversity in different people's voices? So it turns out, I don't know, for example, I often talk to..."},{"start":1375.62,"text":"open voice on my phone, right, instead of typing. But the number of voices there is limited. And if you go to TTS provider, I guess there are now some services with a larger number of voices, but these are things you end up worrying about. And it's all solvable. Synthetic data does work for speech recognition, right? But it turns out that they're often..."},{"start":1395.94,"text":"enough details associated with filling with the synthetic data generation process, that ends up taking longer. So for a lot of machine learning applications, using synthetic data is a good idea."},{"start":1409.58,"text":"And eventually you might get around to it. But using synthetic data is usually not the first type of data I would collect because usually there's just too many hyperparameters and too many knobs you have to worry about. And then at the back of your head, you'll be wondering whether there's something weird about the synthetic data that I've not thought of before. Whereas you collect natural data, collect real data, it's just one less thing to worry about."},{"start":1439.05,"text":"Maybe just to tell one more story, not as speech, but self-driving cars, right? So you're building self-driving cars, you want to detect other cars. Where do you get pictures of cars? It turns out that a lot of people will have the idea of, oh, there are lots of video games with cars driving around. Why don't we use video games to get pictures of cars out of the video game?"},{"start":1464.22,"text":"But it turns out a problem with a lot of video games is there could be like 20 different cars in the entire video game."},{"start":1470.86,"text":"It depends on the video game."},{"start":1471.98,"text":"But it turns out that to have a realistic video game, you don't need a thousand different cars."},{"start":1477.36,"text":"There are tons of different car designs on the road, but you need a very narrow set of cars."},{"start":1482.4,"text":"And so to a human, seeing the same 20 cars over and over, it looks like a road, looks fine, the video game plays fine."},{"start":1488.62,"text":"But for a lot of video games, the data just isn't rich enough to capture anywhere near"},{"start":1494.44,"text":"the richness of the real world."},{"start":1496.1,"text":"Whereas in contrast, if you've got real pictures, there's just one less thing to worry about."},{"start":1500.48,"text":"So I find that for society data, it works, it's very valuable to use it a lot, but I"},{"start":1506.06,"text":"usually get to it only later in the process."},{"start":1511.78,"text":"And then in the interest of building these things quickly, let me share with you the"}],"speech_gaps":[{"start":1509.38,"end":1511.38}],"frame":"../frames/v055/009.webp","frame_time":1353.77},{"title":"数据收集与系统构建策略","segments":[{"id":122,"text":"types of things that my teams have done to collect data for this.","start":1520.7,"end":1524.68},{"id":123,"text":"And I feel like when you read research papers and you take courses, often you get a very","start":1524.84,"end":1532.28},{"id":124,"text":"very clean view of data, I'm going to tell you, you know, about one of the weird random","start":1532.28,"end":1538.18},{"id":125,"text 30 ratio, and your mileage may vary. Sometimes it works, sometimes it won't. In this case, it didn't work. But I find that if you have a 1 to 2 ratio, just usually not that worried about it. Your network is fine training like that.","start":2023.22,"end":2047.6},{"id":173,"text":"Maybe up to 1 to 10 is when I start to worry about it being a little bit too unbalanced for, you know, standard training procedures and when I might do something to make it a little bit more balanced.","start":2048.25,"end":2058.11},{"id":174,"text":"But duplicating the examples would be one tactic.","start":2059.47,"end":2061.95},{"id":175,"text":"Go ahead.","start":2062.31,"end":2062.83},{"id":176,"text":"Yes, so penalize false negatives.","start":2066.81,"end":2069.95},{"id":177,"text":"Yes, that would work too.","start":2070.11,"end":2071.15},{"id":178,"text":"So I think there are a few ways to train to change the cost function.","start":2071.25,"end":2075.57},{"id":179,"text":"You can give the positive examples more weight.","start":2075.73,"end":2077.89},{"id":180,"text":"Or penalizing false negatives would be another way to change the cost function that will work.","start":2080.59,"end":2085.87},{"id":181,"text":"Yeah, go ahead.","start":2089.31,"end":2090.29},{"id":182,"text":"Yeah, yes, so you can also decrease the number of negative examples.","start":2104.79,"end":2107.75},{"id":183,"text":"That will work too. The one downside of that is, it's okay. I think it's fine to do what she said.","start":2108.25,"end":2113.73},{"id":184,"text":"The one slight downside is if you are reducing the diversity of the negative examples,","start":2113.93,"end":2119.13},{"id":185,"text":"then your network has just a little bit less information to learn from.","start":2119.47,"end":2122.77},{"id":186,"text":"I think this is small. What I just said is a small difference though. I think that will","start":2123.85,"end":2127.03},{"id":187,"text":"also work as a quick way to try. I'll tell you what my team actually did. I'm telling you this","start":2127.03,"end":2136.75},{"id":188,"text":"not because it's a brilliant technique I'm proud of,","start":2136.75,"end":2138.97},{"id":189,"text":"but because I just want to tell you the examples","start":2139.05,"end":2141.33},{"id":190,"text":"of the types of hacks","start":2141.33,"end":2142.53},{"id":191,"text":"that actual commercial machine learning teams do","start":2142.53,"end":2145.45},{"id":192,"text":"that actually works, right?","start":2145.45,"end":2147.15},{"id":193,"text":"So I'll tell you what we did.","start":2147.25,"end":2148.19},{"id":194,"text":"It was very close to duplicating the positive examples,","start":2148.29,"end":2151.27},{"id":195,"text":"but we had just a slightly different variation,","start":2151.53,"end":2153.57},{"id":196,"text":"which was...","start":2153.79,"end":2154.47},{"id":197,"text":"We said that instead of the positive example being the one window where Robert turned on just finished. So here we're having a sequence of labels where zero corresponds to is that moment in time when someone just finished Robert turned on. And in the architecture I described, we are detecting a very, very narrow window in time where someone just finished Robert turned on and they got to turn on.","start":2155.49,"end":2183.12},{"id":198,"text":"But the hack that we used was actually just extend this out a little bit. So instead of saying, did someone just finish saying Robert Turner on his last yield?","start":2183.76,"end":2193.48}],"notes":["本段讨论了在处理不平衡数据集时的策略，指出当数据集不平衡比例达到1:10时，可能需要采取措施来平衡数据。例如，可以通过复制样本、增加正样本权重或惩罚误判来调整损失函数。同时，减少负样本数量也是一种方法，但可能会降低模型学习的信息多样性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2023.22,"end":2193.48,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2023.22,"text":"up to like a 1 to 10 ratio of unbalanced data sets. So people often worry, what if an unbalanced data set? In this example, we have like a 1 to 30 ratio, and your mileage may vary. Sometimes it works, sometimes it won't. In this case, it didn't work. But I find that if you have a 1 to 2 ratio, just usually not that worried about it. Your network is fine training like that."},{"start":2048.25,"text":"Maybe up to 1 to 10 is when I start to worry about it being a little bit too unbalanced for, you know, standard training procedures and when I might do something to make it a little bit more balanced."},{"start":2059.47,"text":"But duplicating the examples would be one tactic."},{"start":2062.31,"text":"Go ahead."},{"start":2066.81,"text":"Yes, so penalize false negatives."},{"start":2070.11,"text":"Yes, that would work too."},{"start":2071.25,"text":"So I think there are a few ways to train to change the cost function."},{"start":2075.73,"text":"You can give the positive examples more weight."},{"start":2080.59,"text":"Or penalizing false negatives would be another way to change the cost function that will work."},{"start":2089.31,"text":"Yeah, go ahead."},{"start":2104.79,"text":"Yeah, yes, so you can also decrease the number of negative examples."},{"start":2108.25,"text":"That will work too. The one downside of that is, it's okay. I think it's fine to do what she said."},{"start":2113.93,"text":"The one slight downside is if you are reducing the diversity of the negative examples,"},{"start":2119.47,"text":"then your network has just a little bit less information to learn from."},{"start":2123.85,"text":"I think this is small. What I just said is a small difference though. I think that will"},{"start":2127.03,"text":"also work as a quick way to try. I'll tell you what my team actually did. I'm telling you this"},{"start":2136.75,"text":"not because it's a brilliant technique I'm proud of,"},{"start":2139.05,"text":"but because I just want to tell you the examples"},{"start":2141.33,"text":"of the types of hacks"},{"start":2142.53,"text":"that actual commercial machine learning teams do"},{"start":2145.45,"text":"that actually works, right?"},{"start":2147.25,"text":"So I'll tell you what we did."},{"start":2148.29,"text":"It was very close to duplicating the positive examples,"},{"start":2151.53,"text":"but we had just a slightly different variation,"},{"start":2153.79,"text":"which was..."},{"start":2155.49,"text":"We said that instead of the positive example being the one window where Robert turned on just finished. So here we're having a sequence of labels where zero corresponds to is that moment in time when someone just finished Robert turned on. And in the architecture I described, we are detecting a very, very narrow window in time where someone just finished Robert turned on and they got to turn on."},{"start":2183.76,"text":"But the hack that we used was actually just extend this out a little bit. So instead of saying, did someone just finish saying Robert Turner on his last yield?"}],"speech_gaps":[{"start":2078.29,"end":2079.792},{"start":2092.048,"end":2093.808}],"frame":"../frames/v055/013.webp","frame_time":2035.22},{"title":"数据增强与训练集分布问题","segments":[{"id":199,"text":"100 milliseconds, we extended that out to half a second or a second. And so if someone finished saying, Robert, turn on any time in the last half second, let's turn on the light, right? And so this actually generates a few more training examples. The reason we did that, and again, it's a small difference, is this actually creates a little bit more diversity in the positive examples than just duplicating it. Because now this red rectangle is a positive example, and so is this one, and so is this one.","start":2194.03,"end":2223.01},{"id":200,"text":"And so is this one. So it just creates a little bit more diversity in the positive examples. I expect this will make a very small difference in the training, in the learning algorithms performance, but it's just, you know, maybe just slightly better to have slightly, yes, it covers the space of positive examples, just a little bit, just very, very, just a little bit better. So, okay, just to keep going with the story,","start":2223.46,"end":2252.74},{"id":201,"text":"Let's say you do this, and now you still do well on the training set. 95% accuracy on the training set, but 50% accuracy, so not good enough, on your dev set. So you fix one problem, and another one comes up. So what do you do next? Go for it. Cool, awesome. Overfitting is user organization. Go ahead.","start":2254.7,"end":2298.89},{"id":202,"text":"Is it that training and dev set distributions are not the same? In this example, because we collected the training and the dev sets, if we randomly shuffle between training and dev, then they would be the same distribution. Sometimes.","start":2306.16,"end":2320.47},{"id":203,"text":"There's one other thing I do see, which is if you, it turns out early in the history of machine learning, there was always this assumption of obsession with making the training set and the test set have the same distribution. I think it's because if the training set and the test set have the same distribution, it's easy to prove theorems, easy to give guarantees, whatever. So it's kind of academic machine learning.","start":2321.96,"end":2345.42},{"id":204,"text":"there was always this, you know, theoretical assumption, which makes the theory work way better. The training set and your test set come from the same distribution, right? It's just like from a publishing paper's point of view, that makes life much better.","start":2346.14,"end":2359.92}],"notes":["本段讨论了数据增强策略对训练集和开发集性能的影响。通过在最后半秒内生成更多正样本，可以增加正样本的多样性，从而略微提升模型的泛化能力。但这种改进可能非常有限，仅能略微覆盖正样本空间。","接下来，讲者指出模型在训练集上表现良好（95%准确率），但在开发集上表现不佳（50%准确率），这表明模型可能出现了过拟合问题。过拟合通常意味着模型在训练数据上表现良好，但在新数据上泛化能力差。","讲者进一步探讨了训练集和开发集分布不一致的问题。如果训练集和开发集来自不同的分布，模型可能无法很好地泛化。通过随机打乱训练集和开发集，可以使得它们的分布趋于一致，但这种情况并不总是成立。","在机器学习的历史中，一直存在一个理论假设，即训练集和测试集来自相同的分布。这种假设使得理论分析更加容易，也便于提供理论保证，因此在学术研究中被广泛采用。","讲者指出，这种假设在理论研究中非常重要，因为它使得理论分析更加有效。从论文发表的角度来看，这种假设也使得研究工作更加顺利。","最后，讲者强调了训练集和测试集分布一致的重要性，这在实际应用中可能并不总是成立，但仍然是理论研究和模型评估的重要前提。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2194.03,"end":2359.92,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2194.03,"text":"100 milliseconds, we extended that out to half a second or a second. And so if someone finished saying, Robert, turn on any time in the last half second, let's turn on the light, right? And so this actually generates a few more training examples. The reason we did that, and again, it's a small difference, is this actually creates a little bit more diversity in the positive examples than just duplicating it. Because now this red rectangle is a positive example, and so is this one, and so is this one."},{"start":2223.46,"text":"And so is this one. So it just creates a little bit more diversity in the positive examples. I expect this will make a very small difference in the training, in the learning algorithms performance, but it's just, you know, maybe just slightly better to have slightly, yes, it covers the space of positive examples, just a little bit, just very, very, just a little bit better. So, okay, just to keep going with the story,"},{"start":2254.7,"text":"Let's say you do this, and now you still do well on the training set. 95% accuracy on the training set, but 50% accuracy, so not good enough, on your dev set. So you fix one problem, and another one comes up. So what do you do next? Go for it. Cool, awesome. Overfitting is user organization. Go ahead."},{"start":2306.16,"text":"Is it that training and dev set distributions are not the same? In this example, because we collected the training and the dev sets, if we randomly shuffle between training and dev, then they would be the same distribution. Sometimes."},{"start":2321.96,"text":"There's one other thing I do see, which is if you, it turns out early in the history of machine learning, there was always this assumption of obsession with making the training set and the test set have the same distribution. I think it's because if the training set and the test set have the same distribution, it's easy to prove theorems, easy to give guarantees, whatever. So it's kind of academic machine learning."},{"start":2346.14,"text":"there was always this, you know, theoretical assumption, which makes the theory work way better. The training set and your test set come from the same distribution, right? It's just like from a publishing paper's point of view, that makes life much better."}],"speech_gaps":[],"frame":"../frames/v055/014.webp","frame_time":2206.03},{"title":"训练集与测试集分布差异及过拟合问题","segments":[{"id":205,"text":"For a practical point of view, what I see is a lot of the time your training set distribution is just different than your tested distribution. That's just life because it's hard to demand data of a certain sort. And so, for example, one common thing is if you do use synthetic data generation, you can...","start":2360.79,"end":2380.31},{"id":206,"text":"come up with really clever ways to generate synthetic training data, like using TTS or editing audio or whatever. There, these techniques let you generate a massive training set. But the price of that is, you know, your synthetic data, I mean, that's not how users talk, right? Users don't speak synthetic data, they speak real data. And so to be sure that your test metric truly reflects how users will perceive your product, you know, I would...","start":2380.7,"end":2409.55},{"id":207,"text":"put true data in your test set. And so you end up with a lot of systems where your training set distribution is synthetic data or other things you fit it with. And then your test set is whatever the world actually cares more about. And the two distributions is very different. And then I think the question you just asked is, is the training set distribution too different from the synthetic data? Then it's a problem. Those would be good questions to ask. All right. So,","start":2409.87,"end":2436.59},{"id":208,"text":"If you see this, this is overfitting because we're doing great on training set, not so well on dev. So one thing to try, the first thing to try is very regularization. So that would be a good thing to try. And then beyond using regularization, I find that for a lot of speech problems, if you're overfitting, getting more data is nice. And so just to share with you, I know your suggestion of synthetic data earlier, I'll share with you one thing for synthetic data that does work.","start":2438.25,"end":2465.93},{"id":209,"text":"uh which we eventually wound up using which is um it turns out that um sorry this is audio stream right it turns out that there are a lot of uh uh if you can get audio clips of background noise so for example in this room","start":2466.49,"end":2480.91},{"id":210,"text":"you know if i'm not if i'm quiet you can hear a little bit of air conditioning noise right so a lot of rooms have little background noise or if you're near a highway there's cars in the background so they're actually most most people where they may use the lab you know there's a little bit of background noise so if you're able to get audio of background noise","start":2481.61,"end":2501.37},{"id":211,"text":"And then additionally, record some very clean audio clips of Robert Tern on. It turns out that if you take two audio waveforms and sum them together.","start":2502.06,"end":2512.94},{"id":212,"text":"you end up with an audio waveform that sounds like someone is saying this in the presence of the background noise. I think it's called the superposition property of sound, but basically sound adds, which is why if you take two audio clips and you just add the audio waveforms together, then you end up with an audio recording that sounds like both sounds going on at the same time. So what we can do is take, you know, background noise.","start":2513.74,"end":2538.84}],"notes":["本段讨论了训练集与测试集分布差异的问题，指出实际应用中训练集分布往往与测试集分布不同，这是由于难以获取特定类型的数据。例如，使用合成数据生成时，虽然可以生成大量训练数据，但合成数据与真实用户数据存在差异，因此测试集应包含真实数据以确保评估结果反映用户实际体验。","讲者提到，如果训练集分布与合成数据差异过大，会导致过拟合问题，表现为在训练集表现良好但在开发集表现不佳。解决方法包括增加正则化和获取更多数据。此外，讲者还提到通过合成背景噪声和干净语音信号的叠加，可以生成更接近真实场景的音频数据。","讲者强调了合成数据的局限性，指出合成数据不能完全代表真实用户行为，因此测试集应包含真实数据。同时，讲者提到通过叠加背景噪声和语音信号，可以生成更真实的音频数据，这利用了声音的叠加特性。","讲者提到在语音处理任务中，过拟合问题可以通过增加正则化和获取更多数据来缓解。此外，合成数据的使用需要谨慎，因为合成数据与真实数据存在差异，因此测试集应包含真实数据以确保评估的有效性。","讲者还提到，通过记录背景噪声和干净语音信号，并将它们叠加，可以生成更接近真实场景的音频数据。这种方法利用了声音的叠加特性，即两个音频信号相加后，可以模拟出在背景噪声中说话的效果。","讲者最后提到，合成数据的使用需要结合真实数据，以确保模型在实际应用中的表现。因此，测试集应包含真实数据，而训练集可以使用合成数据，但需注意两者的分布差异。"],"formulas":[],"uncertainties":["Robert Tern on","uh which we eventually wound up using which is um it turns out that um sorry this is audio stream right it turns out that there are a lot of uh uh if you can get audio clips of background noise so for example in this room","you know if i'm not if i'm quiet you can hear a little bit of air conditioning noise right so a lot of rooms have little background noise or if you're near a highway there's cars in the background so they're actually most most people where they may use the lab you know there's a little bit of background noise so if you're able to get audio of background noise"],"diagram":"none","start":2360.79,"end":2538.84,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2360.79,"text":"For a practical point of view, what I see is a lot of the time your training set distribution is just different than your tested distribution. That's just life because it's hard to demand data of a certain sort. And so, for example, one common thing is if you do use synthetic data generation, you can..."},{"start":2380.7,"text":"come up with really clever ways to generate synthetic training data, like using TTS or editing audio or whatever. There, these techniques let you generate a massive training set. But the price of that is, you know, your synthetic data, I mean, that's not how users talk, right? Users don't speak synthetic data, they speak real data. And so to be sure that your test metric truly reflects how users will perceive your product, you know, I would..."},{"start":2409.87,"text":"put true data in your test set. And so you end up with a lot of systems where your training set distribution is synthetic data or other things you fit it with. And then your test set is whatever the world actually cares more about. And the two distributions is very different. And then I think the question you just asked is, is the training set distribution too different from the synthetic data? Then it's a problem. Those would be good questions to ask. All right. So,"},{"start":2438.25,"text":"If you see this, this is overfitting because we're doing great on training set, not so well on dev. So one thing to try, the first thing to try is very regularization. So that would be a good thing to try. And then beyond using regularization, I find that for a lot of speech problems, if you're overfitting, getting more data is nice. And so just to share with you, I know your suggestion of synthetic data earlier, I'll share with you one thing for synthetic data that does work."},{"start":2466.49,"text":"uh which we eventually wound up using which is um it turns out that um sorry this is audio stream right it turns out that there are a lot of uh uh if you can get audio clips of background noise so for example in this room"},{"start":2481.61,"text":"you know if i'm not if i'm quiet you can hear a little bit of air conditioning noise right so a lot of rooms have little background noise or if you're near a highway there's cars in the background so they're actually most most people where they may use the lab you know there's a little bit of background noise so if you're able to get audio of background noise"},{"start":2502.06,"text":"And then additionally, record some very clean audio clips of Robert Tern on. It turns out that if you take two audio waveforms and sum them together."},{"start":2513.74,"text":"you end up with an audio waveform that sounds like someone is saying this in the presence of the background noise. I think it's called the superposition property of sound, but basically sound adds, which is why if you take two audio clips and you just add the audio waveforms together, then you end up with an audio recording that sounds like both sounds going on at the same time. So what we can do is take, you know, background noise."}],"speech_gaps":[],"frame":"../frames/v055/015.webp","frame_time":2372.79},{"title":"音频数据合成与训练集构建","segments":[{"id":213,"text":"There's actually a lot of audio clips of background noise on YouTube as well and so on that check the licensing terms before you use stuff like that. But there are actually quite a lot of openly licensed audio clips of just someone, like a coffee shop noise or someone sitting in a house studying or whatever. And so if you can take some background noise audio clips and then take a...","start":2540.77,"end":2567.37},{"id":214,"text":"clean voice, someone saying, Robert, turn on. And if you add these two together, then you end up with background noise, Robert, turn on, and more background noise. And this becomes a positive example using the process that we talked about just now. And if you have a handful of clips of Robert, turn on.","start":2568.07,"end":2591.2},{"id":215,"text":"and a lot of clips of background noise. So you can synthesize the phrase Robert Turnon. It gives a lot of different types of background noise and create a pretty large training set.","start":2591.8,"end":2603.22},{"id":216,"text":"So it turns out one problem with what I just described is if you do exactly what you just said, you won't actually find a robot turn on detector. You end up with a voice activity detection detector because you have a lot of background noise. And anytime anyone says anything, the only thing people say is robot turn on. It's much easier to just decide, is there a loud sound of someone talking to actually recognize things? So the other thing we should do is instead of adding robot turn on.","start":2604.02,"end":2629.22},{"id":217,"text":"you know, pick a dictionary or find other types of audio. I think that's what you had to comment just now, make sure don't confuse all the things. I don't know, get someone to say the word.","start":2629.88,"end":2640.18},{"id":218,"text":"cardinal or whatever, or other words. So you have a bunch of examples of people saying words other than Robert Turnon, and then also a bunch of examples of people saying Robert Turnon. And by having a handful of clean recordings of Robert Turnon and a handful of clean recordings of people saying other stuff and synthesizing a dataset like this, you can get a dataset with maybe thousands of examples of Robert Turnon pretty efficiently. And if you train a neural network on this, you get like a","start":2641.68,"end":2670.14},{"id":219,"text":"decent wake word or trigger word detector. That make sense? So yeah, right. So with a process like this, so this is what working on a machine learning project feels like, right? You try something, doesn't work. Like you find out that you have a skewed data set.","start":2670.42,"end":2704.41}],"notes":["本段讲解了如何通过合成背景噪音和语音片段来构建训练数据集。讲者提到，可以使用YouTube上的背景噪音音频片段和干净的语音片段（如‘Robert, turn on’）进行合成，从而生成包含不同背景噪音的训练样本。这种方法可以创建一个较大的训练集，用于训练语音唤醒词检测器。","讲者指出，如果直接按照上述方法合成数据，可能会导致模型误判为语音活动检测器，而不是专门的唤醒词检测器。这是因为背景噪音过多，模型可能无法准确识别特定的唤醒词。因此，建议使用其他类型的音频数据，以避免混淆。","讲者进一步说明，为了构建更有效的训练集，应包含不同语音内容的样本，例如其他单词（如‘cardinal’）的语音片段，以及目标唤醒词（如‘Robert, turn on’）的语音片段。这样可以提高模型的泛化能力。","讲者提到，通过合成这样的数据集，可以高效地生成大量目标唤醒词的样本，并训练神经网络以实现一个有效的唤醒词检测器。这体现了机器学习项目中常见的试错过程，即尝试不同的方法，发现数据集的问题并进行调整。","讲者最后指出，机器学习项目通常涉及不断尝试和调整，例如发现数据集存在偏差后，需要重新设计数据合成策略。这反映了实际项目中常见的挑战和解决思路。","整个讲解强调了在构建训练数据集时需要注意的细节，包括数据的多样性、背景噪音的处理以及避免模型混淆的关键点。这些内容为实际项目中的数据准备提供了指导。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2540.77,"end":2704.41,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2540.77,"text":"There's actually a lot of audio clips of background noise on YouTube as well and so on that check the licensing terms before you use stuff like that. But there are actually quite a lot of openly licensed audio clips of just someone, like a coffee shop noise or someone sitting in a house studying or whatever. And so if you can take some background noise audio clips and then take a..."},{"start":2568.07,"text":"clean voice, someone saying, Robert, turn on. And if you add these two together, then you end up with background noise, Robert, turn on, and more background noise. And this becomes a positive example using the process that we talked about just now. And if you have a handful of clips of Robert, turn on."},{"start":2591.8,"text":"and a lot of clips of background noise. So you can synthesize the phrase Robert Turnon. It gives a lot of different types of background noise and create a pretty large training set."},{"start":2604.02,"text":"So it turns out one problem with what I just described is if you do exactly what you just said, you won't actually find a robot turn on detector. You end up with a voice activity detection detector because you have a lot of background noise. And anytime anyone says anything, the only thing people say is robot turn on. It's much easier to just decide, is there a loud sound of someone talking to actually recognize things? So the other thing we should do is instead of adding robot turn on."},{"start":2629.88,"text":"you know, pick a dictionary or find other types of audio. I think that's what you had to comment just now, make sure don't confuse all the things. I don't know, get someone to say the word."},{"start":2641.68,"text":"cardinal or whatever, or other words. So you have a bunch of examples of people saying words other than Robert Turnon, and then also a bunch of examples of people saying Robert Turnon. And by having a handful of clean recordings of Robert Turnon and a handful of clean recordings of people saying other stuff and synthesizing a dataset like this, you can get a dataset with maybe thousands of examples of Robert Turnon pretty efficiently. And if you train a neural network on this, you get like a"},{"start":2670.42,"text":"decent wake word or trigger word detector. That make sense? So yeah, right. So with a process like this, so this is what working on a machine learning project feels like, right? You try something, doesn't work. Like you find out that you have a skewed data set."}],"speech_gaps":[],"frame":"../frames/v055/016.webp","frame_time":2552.77},{"title":"数据收集与训练集多样性","segments":[{"id":220,"text":"be creative in how you collect data. You may find that you have a skewed data set and it just doesn't work. You may find it's overfitting. And I find that it is the ability to drive iterations of a system that determines how quickly you can get something to work. So for the Robert Turnon example, so if I found that there were a lot of users that were listening to music, then...","start":2705.0,"end":2748.74},{"id":221,"text":"I would probably synthesize data with music in the background and then have someone say, Robert, turn on. So if you think a lot of users listen to music and there's a desk lamp, we want to make sure we catch them saying, Robert, turn on. Then I would probably synthesize more training data to include, you know, loud-ish music in the background. Sorry, what are the genre of music?","start":2749.73,"end":2782.32},{"id":222,"text":"Yeah, so it turns out that if you have a... I feel like as a rule of thumb, if you can have a more diverse set of training data, it's usually better, right? So maybe I'm not sure what music my user base likes to listen to the most. Is it classical? Is it rock? Is it EDM? Is it whatever? If you could...","start":2799.61,"end":2823.49},{"id":223,"text":"collect a very rich training set that includes all of the above and even more, then usually they'll do better than going too narrow and risking picking wrong. And the one asterisk to what I said is so long as you can train a neural network that's big enough, usually more...","start":2824.08,"end":2844.96},{"id":224,"text":"diverse data, more data, more diverse data is better. If your network is too small, then it may lack the capacity or the intelligence to memorize all this stuff, which could be a problem. You need a very small network that runs at the edge. But usually, if you have the capacity to get more rich, more diverse training data, it ends up delivering better results.","start":2845.31,"end":2870.98}],"notes":["本段讨论了在AI项目中如何通过创造性地收集数据来提高模型性能。讲者指出，如果数据集存在偏差，模型可能无法正常工作，甚至出现过拟合现象。因此，关键在于系统迭代的能力，即不断调整和优化模型，以快速实现功能。","以Robert Turnon的例子说明，如果发现大量用户在听音乐，可以合成包含音乐背景的数据，并让测试者说出'Robert, turn on'。这样可以确保模型在真实场景中也能正确响应。讲者进一步提到，如果用户喜欢不同类型的音乐，应尽可能收集多样化的数据。","讲者强调，多样化的训练数据通常比狭窄的数据集更好。如果无法确定用户偏好哪种音乐类型，应尽可能收集涵盖所有可能类型的数据，以避免选择错误。同时，讲者指出，如果网络规模不够大，可能无法处理大量数据，导致性能问题。","讲者提到，如果网络规模较小，可能需要在边缘设备上运行，但通常情况下，如果具备足够的资源，收集更丰富、更多样化训练数据会带来更好的结果。这表明数据多样性和网络容量之间存在权衡关系。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2705.0,"end":2870.98,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2705.0,"text":"be creative in how you collect data. You may find that you have a skewed data set and it just doesn't work. You may find it's overfitting. And I find that it is the ability to drive iterations of a system that determines how quickly you can get something to work. So for the Robert Turnon example, so if I found that there were a lot of users that were listening to music, then..."},{"start":2749.73,"text":"I would probably synthesize data with music in the background and then have someone say, Robert, turn on. So if you think a lot of users listen to music and there's a desk lamp, we want to make sure we catch them saying, Robert, turn on. Then I would probably synthesize more training data to include, you know, loud-ish music in the background. Sorry, what are the genre of music?"},{"start":2799.61,"text":"Yeah, so it turns out that if you have a... I feel like as a rule of thumb, if you can have a more diverse set of training data, it's usually better, right? So maybe I'm not sure what music my user base likes to listen to the most. Is it classical? Is it rock? Is it EDM? Is it whatever? If you could..."},{"start":2824.08,"text":"collect a very rich training set that includes all of the above and even more, then usually they'll do better than going too narrow and risking picking wrong. And the one asterisk to what I said is so long as you can train a neural network that's big enough, usually more..."},{"start":2845.31,"text":"diverse data, more data, more diverse data is better. If your network is too small, then it may lack the capacity or the intelligence to memorize all this stuff, which could be a problem. You need a very small network that runs at the edge. But usually, if you have the capacity to get more rich, more diverse training data, it ends up delivering better results."}],"speech_gaps":[],"frame":"../frames/v055/017.webp","frame_time":2717.0},{"title":"构建机器学习系统时的调试流程","segments":[{"id":225,"text":"I want to share with you. So it turns out when you're building a machine learning system, very common experience is you try something and it doesn't work. And then you have to figure out all the wonderful ways it could be not working.","start":2881.87,"end":2901.61},{"id":226,"text":"and then going to fix whatever is not working, right? And even in this example we went through, is the training data too skewed? Is it overfitting? So you need a regularization of more data, or is it something else? Or is this synthetic data distribution not matching real data distribution? It turns out that when you're training a new network, when you're building an AI system, it's really difficult to know in advance what's going to go wrong next. I find that in...","start":2902.17,"end":2929.19},{"id":227,"text":"software development, if I'm writing traditional software, you kind of control all the code. And so it's more okay to write a spec, and then you just build it, and then it kind of works. You still need to debug it, but the bugs are my own bugs. In contrast, when you're building a machine learning system,","start":2929.53,"end":2948.89},{"id":228,"text":"It's much more like, I don't know what's going to happen next. Maybe because I don't know what the data will give me, how to predict how the algorithm will perform. And so the workflow of machine learning feels much more like debugging than development. And by debugging, I mean, there is a process where...","start":2949.85,"end":2966.71},{"id":229,"text":"You build a system and you're just repeatedly trying to find how it doesn't work and fix it. And if you're trying to do a task that humans can do, then the bugs or the gaps in performance is often whatever a human can clearly do, but the AI system is unable to do.","start":2967.08,"end":2981.98},{"id":230,"text":"For many machine learning teams that I've led or worked in, if you can get the team to a healthy rhythm of this debugging cycle, you can make really rapid progress. So for example, it turns out, let me give one example. I've been on teams where we would do the following, right? Morning, afternoon, evening. So we run our trading jobs at night, right?","start":2984.08,"end":3014.42},{"id":231,"text":"And for example, it turns out for some of these models we're training for speech recognition, let's say it takes four hours. So the training job takes about four hours to train. So training night, in the morning, we look at the results. We look at the results through error analysis, try to figure out what's wrong. In the afternoon, we write code to figure out how we're going to fix everything we discovered the day before. And in the evening,","start":3017.49,"end":3055.79}],"notes":["本段主要讲解构建机器学习系统时常见的调试流程。讲者指出，当构建机器学习系统时，尝试某些方法后发现其不工作，需要找出所有可能的问题所在。这包括训练数据是否失衡、是否过拟合、是否需要更多数据或正则化、合成数据分布是否与真实数据分布匹配等问题。讲者强调，构建AI系统时很难提前知道接下来会发生什么问题，因此机器学习的流程更像调试而非开发。","讲者对比了传统软件开发与机器学习系统的不同。在传统软件开发中，开发者可以完全控制代码，因此可以编写规范并逐步实现，虽然仍需调试，但错误是开发者自己引入的。而在机器学习系统中，由于数据和算法的不确定性，流程更像调试，需要不断尝试找出系统的问题并进行修复。","讲者提到，当尝试完成人类可以完成的任务时，AI系统在性能上的差距往往是人类可以清晰完成但AI无法完成的部分。因此，调试过程需要不断分析错误并进行修复。","讲者以实际例子说明机器学习团队如何通过建立健康的调试循环来快速推进项目。例如，团队会按照早晨、下午、晚上进行工作安排：晚上运行训练任务，早上分析结果，下午编写修复代码，晚上继续调试。","讲者指出，这种调试流程的节奏对于机器学习团队的成功至关重要。通过不断分析错误并进行修复，团队可以快速改进系统性能。","讲者强调，机器学习的调试流程需要团队成员的协作和持续的努力，以确保系统能够逐步接近人类水平的性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2881.87,"end":3055.79,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2881.87,"text":"I want to share with you. So it turns out when you're building a machine learning system, very common experience is you try something and it doesn't work. And then you have to figure out all the wonderful ways it could be not working."},{"start":2902.17,"text":"and then going to fix whatever is not working, right? And even in this example we went through, is the training data too skewed? Is it overfitting? So you need a regularization of more data, or is it something else? Or is this synthetic data distribution not matching real data distribution? It turns out that when you're training a new network, when you're building an AI system, it's really difficult to know in advance what's going to go wrong next. I find that in..."},{"start":2929.53,"text":"software development, if I'm writing traditional software, you kind of control all the code. And so it's more okay to write a spec, and then you just build it, and then it kind of works. You still need to debug it, but the bugs are my own bugs. In contrast, when you're building a machine learning system,"},{"start":2949.85,"text":"It's much more like, I don't know what's going to happen next. Maybe because I don't know what the data will give me, how to predict how the algorithm will perform. And so the workflow of machine learning feels much more like debugging than development. And by debugging, I mean, there is a process where..."},{"start":2967.08,"text":"You build a system and y
