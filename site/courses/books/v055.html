ou're just repeatedly trying to find how it doesn't work and fix it. And if you're trying to do a task that humans can do, then the bugs or the gaps in performance is often whatever a human can clearly do, but the AI system is unable to do."},{"start":2984.08,"text":"For many machine learning teams that I've led or worked in, if you can get the team to a healthy rhythm of this debugging cycle, you can make really rapid progress. So for example, it turns out, let me give one example. I've been on teams where we would do the following, right? Morning, afternoon, evening. So we run our trading jobs at night, right?"},{"start":3017.49,"text":"And for example, it turns out for some of these models we're training for speech recognition, let's say it takes four hours. So the training job takes about four hours to train. So training night, in the morning, we look at the results. We look at the results through error analysis, try to figure out what's wrong. In the afternoon, we write code to figure out how we're going to fix everything we discovered the day before. And in the evening,"}],"speech_gaps":[],"frame":"../frames/v055/018.webp","frame_time":2893.87},{"title":"AI项目策略：迭代与训练周期","segments":[{"id":232,"text":"Right before we go home, we launch the training job. And then it runs overnight. And the next morning, we do it again and again and again. And it turns out that if you can fix one problem a day,","start":3056.63,"end":3069.82},{"id":233,"text":"That's actually pretty good. And then you saw me walk through three or four problems. When I built this for real, there are slightly more problems than that. But I find that you can get a team and take treatments where you train stuff, look at the results, figure out if it's bias, variance, data mismatch. Oh, actually, this should be code on your data. Fix it.","start":3070.68,"end":3094.18},{"id":234,"text":"And in the evening, before you go home, launch the job. Maybe if you have time in the evening, just baby the training job a little bit, make sure it's still running. But then come back in the next morning to see how it did. Then you just do this over and over. And you can make really rapid progress. And I find it's often this discipline that lets you make progress. In contrast, the teams that...","start":3095.13,"end":3115.27},{"id":235,"text":"kind of wake up and they go, huh, what do we do next? Oh, let's call a meeting this afternoon. Wait, where's the data? Okay, I guess we'll meet tomorrow to look at the data. And then like, oh, our infra is down. And teams like that move much slower than the really disciplined teams that just keep on rolling forward. And one more observation. It turns out the iteration cycle, sometimes it is driven by this.","start":3115.76,"end":3139.77},{"id":236,"text":"So I've worked on machine learning jobs where it took us about four hours to train a model. And four hours is long enough. Don't want to wait for it. But, you know, running overnight is just fine. I've also worked on teams where a typical training job took about three weeks on average, right? And so if it takes three weeks to train a neural network for the type of model we're working on, then the pacing is very different. So how long it takes to train a neural network really drives the pacing of this, where sometimes we would, you know,","start":3140.58,"end":3170.1},{"id":237,"text":"launch a training job and then hope for the best. We would want to train during those three weeks. It's not that we do nothing for those three weeks, but you just go launch a training job and then frankly, hope that it works three weeks later. But we take three weeks and after that, tons of analysis and debugging and whatever work that would take us one to two weeks to set us up for the next training job. They're going to take us another three weeks to get a result. And then we're also parallelizing.","start":3170.58,"end":3195.0},{"id":238,"text":"While launching this job, we're analyzing the job from a previous job and we launch a few jobs asynchronously. But I find that how long it takes, this is a huge driver for how you do this.","start":3195.67,"end":3205.61},{"id":239,"text":"The other end of the spectrum is if it takes 10 minutes to train a neural network, then that's wonderful. You just train it, get a result, train it, get a coffee, come back, then do the analysis. And the bottleneck is how quickly can you analyze the data and get more data. So this really drives the design of this process. And one other thing that happens is for a lot of projects, you start off with a small thing that takes 10 minutes to train.","start":3206.57,"end":3230.67}],"notes":["本段讲授了AI项目中迭代训练的重要性，强调了持续训练、分析和调试的流程。讲者指出，通过每天解决一个问题，可以快速推进项目，而缺乏纪律的团队则会因为拖延和低效而进展缓慢。","讲者提到训练周期的长短对项目节奏有决定性影响。如果训练需要四小时，可以每天进行；但如果需要三周，则需要更长的等待时间，这会改变整个项目的节奏。","在训练周期较长的情况下，团队需要在训练期间进行分析和调试，为下一次训练做准备。这种周期性的流程是项目推进的关键。","讲者还提到，训练周期的长短决定了项目的设计方式。如果训练非常快，瓶颈会是数据分析和数据获取的速度，而不是训练本身。","最后，讲者指出，项目通常从一个小的、训练时间短的任务开始，逐步扩展到更复杂的模型，这有助于团队逐步建立信心和流程。","整个段落强调了在AI项目中保持纪律、持续迭代和适应训练周期的重要性，这些是成功推进项目的关键因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3056.63,"end":3230.67,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3056.63,"text":"Right before we go home, we launch the training job. And then it runs overnight. And the next morning, we do it again and again and again. And it turns out that if you can fix one problem a day,"},{"start":3070.68,"text":"That's actually pretty good. And then you saw me walk through three or four problems. When I built this for real, there are slightly more problems than that. But I find that you can get a team and take treatments where you train stuff, look at the results, figure out if it's bias, variance, data mismatch. Oh, actually, this should be code on your data. Fix it."},{"start":3095.13,"text":"And in the evening, before you go home, launch the job. Maybe if you have time in the evening, just baby the trading job a little bit, make sure it's still running. But then come back in the next morning to see how it did. Then you just do this over and over. And you can make really rapid progress. And I find it's often this discipline that lets you make progress. In contrast, the teams that..."},{"start":3115.76,"text":"kind of wake up and they go, huh, what do we do next? Oh, let's call a meeting this afternoon. Wait, where's the data? Okay, I guess we'll meet tomorrow to look at the data. And then like, oh, our infra is down. And teams like that move much slower than the really disciplined teams that just keep on rolling forward. And one more observation. It turns out the iteration cycle, sometimes it is driven by this."},{"start":3140.58,"text":"So I've worked on machine learning jobs where it took us about four hours to train a model. And four hours is long enough. Don't want to wait for it. But, you know, running overnight is just fine. I've also worked on teams where a typical training job took about three weeks on average, right? And so if it takes three weeks to train a neural network for the type of model we're working on, then the pacing is very different. So how long it takes to train a neural network really drives the pacing of this, where sometimes we would, you know,"},{"start":3170.58,"text":"launch a training job and then hope for the best. We would want to train during those three weeks. It's not that we do nothing for those three weeks, but you just go launch a training job and then frankly, hope that it works three weeks later. But we take three weeks and after that, tons of analysis and debugging and whatever work that would take us one to two weeks to set us up for the next training job. They're going to take us another three weeks to get a result. And then we're also parallelizing."},{"start":3195.67,"text":"While launching this job, we're analyzing the job from a previous job and we launch a few jobs asynchronously. But I find that how long it takes, this is a huge driver for how you do this."},{"start":3206.57,"text":"The other end of the spectrum is if it takes 10 minutes to train a neural network, then that's wonderful. You just train it, get a result, train it, get a coffee, come back, then do the analysis. And the bottleneck is how quickly can you analyze the data and get more data. So this really drives the design of this process. And one other thing that happens is for a lot of projects, you start off with a small thing that takes 10 minutes to train."}],"speech_gaps":[],"frame":"../frames/v055/019.webp","frame_time":3068.63},{"title":"训练时间与模型规模的关系","segments":[{"id":240,"text":"But then as you get more and more data, then you're bigger than that. But now it takes four hours to train. It goes even bigger. Then it takes two weeks to train. It's like, oh, now this thing takes a month and a half to train. So I've experienced that as well, where unfortunately, as the performance declined, we decided we had to train bigger and bigger models with more and more data. And then it went from this really fantastic 10-minute iterations to these months-long iterations. But they just had to be done because we were training bigger and bigger networks.","start":3231.27,"end":3257.27},{"id":241,"text":"Do you see a problem? Do you have to stop the model? We probably didn't stop the model that much. So sometimes you can look at checkpoints, and if you see that for some reason, so actually if you're training like a three-week job, you kind of expect the performance to be at a certain level after a couple days or after a week, and if it's way off, then before burning another two weeks, you can ask.","start":3265.29,"end":3293.21},{"id":242,"text":"is my learning rate clearly wrong? Or maybe this new data set we tried is clearly wrong. So you can actually start to run some analyses in the checkpoints and sometimes we will yank the job and just kill it. I don't see that happen very rarely. Yeah.","start":3293.66,"end":3308.5},{"id":243,"text":"Yeah, yes. So what you learn about in the online videos is transfer learning. We train a large data set and then maybe fine-tune on just a much smaller data set. And then if you process a fine-tuning on a much smaller data set, it takes half an hour, right? Then that's great. Then you can also drive much faster iterations based on that half hour as a limiting factor for the training time.","start":3317.23,"end":3336.73},{"id":244,"text":"time. Cool. All right. One of the reasons I'm obsessed about speed is because it turns","start":3336.73,"end":3352.01},{"id":245,"text":"out that if the x-axis, imagine you're building a startup to launch this product, right? I","start":3352.01,"end":3360.87},{"id":246,"text":"I find that if a team takes, you know, twice as long to do it,","start":3360.87,"end":3370.03},{"id":247,"text":"they're just much less competitive in the marketplace, right?","start":3370.49,"end":3373.57},{"id":248,"text":"So here's what I mean.","start":3373.65,"end":3374.41},{"id":249,"text":"So if this is era, and this is, you know, months, right?","start":3374.53,"end":3378.91},{"id":250,"text":"There's some machine learning systems that we work on for months","start":3379.61,"end":3382.11},{"id":251,"text":"to keep on trying to improve it.","start":3382.11,"end":3383.75},{"id":252,"text":"And if this is you, and if a competitor, say, takes twice as long to reach the same level","start":3383.75,"end":3394.61},{"id":253,"text":"point.","start":3394.61,"end":3394.87},{"id":254,"text":"So instead of taking this long to get here, they take this long to get here.","start":3394.93,"end":3398.97},{"id":255,"text":"Instead of taking this long to get here, they take twice as long to get here.","start":3399.47,"end":3403.25},{"id":256,"text":"So if a competitor kind of does that, right?","start":3403.37,"end":3406.17},{"id":257,"text":"They just take twice as long.","start":3406.29,"end":3407.29},{"id":258,"text":"You know, they take two days instead of one day to do something.","start":3407.47,"end":3409.51}],"notes":["本段主要讨论了随着数据量和模型规模的增加，训练时间也随之增加，导致迭代周期变长。这可能影响模型的性能，因此需要在训练过程中进行监控和调整。","讲者提到在训练过程中，如果发现性能没有达到预期，可以通过检查点（checkpoints）来判断问题所在，例如学习率是否设置错误或数据集是否存在问题。","讲者还提到，通过迁移学习（transfer learning）可以在训练大型数据集后，对较小的数据集进行微调，从而加快训练速度并提高迭代效率。","讲者强调了训练速度的重要性，特别是在创业公司中，训练时间过长会导致团队在市场竞争中处于劣势。","讲者通过对比不同团队的训练时间，说明了训练速度对竞争力的影响，指出如果一个团队的训练时间是另一个团队的两倍，那么它在市场上的竞争力会显著下降。","最后，讲者用图表形式（虽然未完整呈现）说明了训练时间与模型性能之间的关系，强调了在实际项目中需要平衡训练时间和模型性能。"],"formulas":[],"uncertainties":["out that if the x-axis"],"diagram":"none","start":3231.27,"end":3409.51,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3231.27,"text":"But then as you get more and more data, then you're bigger than that. But now it takes four hours to train. It goes even bigger. Then it takes two weeks to train. It's like, oh, now this thing takes a month and a half to train. So I've experienced that as well, where unfortunately, as the performance declined, we decided we had to train bigger and bigger models with more and more data. And then it went from this really fantastic 10-minute iterations to these months-long iterations. But they just had to be done because we were training bigger and bigger networks."},{"start":3265.29,"text":"Do you see a problem? Do you have to stop the model? We probably didn't stop the model that much. So sometimes you can look at checkpoints, and if you see that for some reason, so actually if you're training like a three-week job, you kind of expect the performance to be at a certain level after a couple days or after a week, and if it's way off, then before burning another two weeks, you can ask."},{"start":3293.66,"text":"is my learning rate clearly wrong? Or maybe this new data set we tried is clearly wrong. So you can actually start to run some analyses in the checkpoints and sometimes we will yank the job and just kill it. I don't see that happen very rarely. Yeah."},{"start":3317.23,"text":"Yeah, yes. So what you learn about in the online videos is transfer learning. We train a large data set and then maybe fine-tune on just a much smaller data set. And then if you process a fine-tuning on a much smaller data set, it takes half an hour, right? Then that's great. Then you can also drive much faster iterations based on that half hour as a limiting factor for the training time."},{"start":3336.73,"text":"time. Cool. All right. One of the reasons I'm obsessed about speed is because it turns"},{"start":3352.01,"text":"out that if the x-axis, imagine you're building a startup to launch this product, right? I"},{"start":3360.87,"text":"I find that if a team takes, you know, twice as long to do it,"},{"start":3370.49,"text":"they're just much less competitive in the marketplace, right?"},{"start":3373.65,"text":"So here's what I mean."},{"start":3374.53,"text":"So if this is era, and this is, you know, months, right?"},{"start":3379.61,"text":"There's some machine learning systems that we work on for months"},{"start":3382.11,"text":"to keep on trying to improve it."},{"start":3383.75,"text":"And if this is you, and if a competitor, say, takes twice as long to reach the same level"},{"start":3394.61,"text":"point."},{"start":3394.93,"text":"So instead of taking this long to get here, they take this long to get here."},{"start":3399.47,"text":"Instead of taking this long to get here, they take twice as long to get here."},{"start":3403.37,"text":"So if a competitor kind of does that, right?"},{"start":3406.29,"text":"They just take twice as long."},{"start":3407.47,"text":"You know, they take two days instead of one day to do something."}],"speech_gaps":[],"frame":"../frames/v055/020.webp","frame_time":3243.27},{"title":"AI项目策略中的效率与性能","segments":[{"id":259,"text":"But they always take two days to do what you would take one day to do.","start":3409.81,"end":3413.31},{"id":260,"text":"then the performance over time looks like this.","start":3413.75,"end":3416.03},{"id":261,"text":"And what the customer cares about","start":3419.31,"end":3421.35},{"id":262,"text":"at a certain moment in time","start":3421.35,"end":3422.59},{"id":263,"text":"is you are so much better than them, right?","start":3422.59,"end":3424.65},{"id":264,"text":"And what the customer cares about","start":3424.75,"end":3427.07},{"id":265,"text":"really translates into a massive difference","start":3427.79,"end":3430.23},{"id":266,"text":"is you are so much better than them, right?","start":3430.23,"end":3431.89},{"id":267,"text":"versus someone else's system in the marketplace.","start":3431.89,"end":3434.25},{"id":268,"text":"And I find that the fast-moving teams","start":3434.63,"end":3438.49},{"id":269,"text":"are just so much more effective.","start":3438.49,"end":3440.35},{"id":270,"text":"And you might think, yeah, you know,","start":3440.61,"end":3442.69},{"id":271,"text":"I took two days, they took one day.","start":3442.69,"end":3444.27},{"id":272,"text":"What's the big deal?","start":3444.33,"end":3444.93},{"id":273,"text":"The big deal is not that your day is slow.","start":3445.09,"end":3446.67},{"id":274,"text":"The big deal is you're two times slower.","start":3446.77,"end":3448.23},{"id":275,"text":"it's just in the marketplace, it's just not competitive if you take twice as long for some applications. All right, there's one other example I want to cover. Let me try to do that quickly. So what I've talked about so far is","start":3449.99,"end":3473.49},{"id":276,"text":"speech recognition, wake word detection, which is more of an end-to-end deep learning system where input audio goes to a neural network and in this output is this RTO robot turn on. So the entire system you're trying to build is just a single neural network.","start":3474.6,"end":3495.9},{"id":277,"text":"For a lot of applications you build, you end up building pipelines, or sometimes call them cascades. I'm going to use the term pipelines. We saw one example of this last time where to detect people coming up to unlock the door with face recognition, we had video that fed to visual activity detection to see if anyone is even in front of it. And then that fed to neural network to recognize, is this an authorized person?","start":3496.94,"end":3524.78},{"id":278,"text":"And then 01 to say, is this a person that we should unlock the door for? What I want to do is use a different example of a pipeline of an AI deep researcher. So it turns out all of the leading, well, almost all of the leading providers have deep researchers where you can ask a query or go and search the internet, look at a lot of web pages and come back and synthesize very thoughtful.","start":3525.37,"end":3558.44},{"id":279,"text":"report. I actually used the OpenAIT research quite a lot. I know some of the teams that built it really well, but I think some of us also did a good job. Input the query, this is an example I'm taking from the agentic AI calls online. Input the query, show me the latest research on black holes. Some query like that. And then","start":3558.92,"end":3587.3}],"notes":["本段讨论了客户在特定时间点对系统性能的关注，强调了速度差异对整体性能的显著影响。讲者指出，即使只是速度上的两倍差异，也会导致系统在市场上的竞争力大幅下降。","讲者通过一个具体的例子说明了效率的重要性，即如果一个团队完成任务的速度是另一个团队的两倍，那么在实际应用中，这种速度差异会带来巨大的性能差距。","讲者提到，快速的团队在项目执行中更加有效，这表明在AI项目中，效率不仅关乎时间成本，还直接影响最终成果的质量和市场竞争力。","讲者指出，客户关注的是系统在特定时间点的表现，而不是单个任务的完成时间。因此，速度的差异会直接影响客户对系统性能的感知。","讲者强调，速度的差异不仅仅是时间上的问题，而是对整个系统性能的显著影响。例如，如果一个系统比竞争对手慢两倍，那么它在市场上的竞争力就会大幅下降。","讲者通过一个具体的例子说明了效率的重要性，即如果一个团队完成任务的速度是另一个团队的两倍，那么在实际应用中，这种速度差异会带来巨大的性能差距。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3409.81,"end":3587.3,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3409.81,"text":"But they always take two days to do what you would take one day to do."},{"start":3413.75,"text":"then the performance over time looks like this."},{"start":3419.31,"text":"And what the customer cares about"},{"start":3421.35,"text":"at a certain moment in time"},{"start":3422.59,"text":"is you are so much better than them, right?"},{"start":3424.75,"text":"So these two X differences in speed"},{"start":3427.79,"text":"really translates into a massive difference"},{"start":3430.23,"text":"in the performance of your system"},{"start":3431.89,"text":"versus someone else's system in the marketplace."},{"start":3434.63,"text":"And I find that the fast-moving teams"},{"start":3438.49,"text":"are just so much more effective."},{"start":3440.61,"text":"And you might think, yeah, you know,"},{"start":3442.69,"text":"I took two days, they took one day."},{"start":3444.33,"text":"What's the big deal?"},{"start":3445.09,"text":"The big deal is not that your day is slow."},{"start":3446.77,"text":"The big deal is you're two times slower."},{"start":3449.99,"text":"it's just in the marketplace, it's just not competitive if you take twice as long for some applications. All right, there's one other example I want to cover. Let me try to do that quickly. So what I've talked about so far is"},{"start":3474.6,"text":"speech recognition, wake word detection, which is more of an end-to-end deep learning system where input audio goes to a neural network and in this output is this RTO robot turn on. So the entire system you're trying to build is just a single neural network."},{"start":3496.94,"text":"For a lot of applications you build, you end up building pipelines, or sometimes call them cascades. I'm going to use the term pipelines. We saw one example of this last time where to detect people coming up to unlock the door with face recognition, we had video that fed to visual activity detection to see if anyone is even in front of it. And then that fed to neural network to recognize, is this an authorized person?"},{"start":3525.37,"text":"And then 01 to say, is this a person that we should unlock the door for? What I want to do is use a different example of a pipeline of an AI deep researcher. So it turns out all of the leading, well, almost all of the leading providers have deep researchers where you can ask a query or go and search the internet, look at a lot of web pages and come back and synthesize very thoughtful."},{"start":3558.92,"text":"report. I actually used the OpenAIT research quite a lot. I know some of the teams that built it really well, but I think some of us also did a good job. Input the query, this is an example I'm taking from the agentic AI calls online. Input the query, show me the latest research on black holes. Some query like that. And then"}],"speech_gaps":[],"frame":"../frames/v055/021.webp","frame_time":3421.81},{"title":"深度学习中的AI项目策略","segments":[{"id":280,"text":"One thing you might do is take a query like, whatever, right? Black hole research. And then use an LLM, use a lot of engine model to generate search terms to feed to a web search engine. So it might generate a few terms like, you know, black hole research, latest in, I don't know, astronomy and black holes or whatever. So generate a handful of search terms.","start":3592.01,"end":3616.25},{"id":281,"text":"This then calls out a web search engine, be it Surfer, Google, Dr. Go, Bing, I don't know, I used to really quite a lot, but multiple, actually more and more web search engines designed for AI rather than for humans, which I think are pretty neat. So this can call the web search engine and then fetch the top pages other than the top URLs.","start":3617.53,"end":3654.15},{"id":282,"text":"So the web search engine returns 10 pages. You may not want to fetch all 10 of them. You can read the snippets, decide which ones are most relevant. Again, maybe with an LLM, with a large language model, to decide what are the pages you want to download. So just like a human, I'll do a web search. I won't click every single link. I'll take a glance and decide which ones I want to click. So identify and fetch the top URLs and then feed all that into writing. And this gives the final output.","start":3655.88,"end":3684.73},{"id":283,"text":"Right. So this is a, by the way, Isaac, this is a more traditional deep researcher article, sorry, deep researcher architecture. The more modern deep researcher architectures let the system decide when to do more web search, when to fetch more web pages, and are more autonomous, more agentic. But this is what the early deep researcher architectures look like. It's more of a linear.","start":3686.09,"end":3711.59},{"id":284,"text":"pipeline. There are more modern architectures where systems will fetch some pages and then autonomously decide, do I need to go back and do more research and solve more topics and iterate a few times? But this would be a pretty decent, basic deep researcher. And it turns out that if you actually build this, one of the","start":3712.12,"end":3736.05},{"id":285,"text":"In the speech recognition system, we talk a lot about how to improve one component, which is the neural network. If you have a pipeline like this, the other thing you need to do, which is critically important, is to decide, of all the different components in the pipeline, which one do you want to focus your attention on?","start":3736.73,"end":3757.03}],"notes":["本段讲解了AI项目中使用大型语言模型（LLM）进行网络搜索的策略。讲者提到，LLM可以生成搜索关键词，然后调用网络搜索引擎获取相关网页。接着，系统可以筛选出最相关的网页，而不是下载所有结果，这与人类的搜索行为类似。","讲者进一步说明了传统和现代的深度研究架构之间的区别。传统架构是线性的，系统在完成搜索后直接生成输出；而现代架构则更加自主，能够根据需要决定是否进行更多搜索或迭代。","在讨论AI项目时，讲者强调了在构建系统时需要关注的组件。他指出，虽然神经网络是关键部分，但更重要的是决定在整体流程中应优先优化哪个组件。","讲者提到，现代AI系统可以自主决定是否需要进行更多研究或迭代，这表明系统具备更高的自主性和智能化水平。这种能力使得系统能够更有效地处理复杂任务。","在讨论搜索策略时，讲者提到，系统可以生成多个搜索关键词，并通过LLM筛选出最相关的网页，而不是下载所有结果。这种策略提高了搜索效率。","最后，讲者提到在语音识别系统中，优化神经网络是关键，但更重要的是确定在整体流程中应优先优化哪个组件。这表明在构建AI系统时，需要综合考虑各个部分的优化策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3592.01,"end":3757.03,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3592.01,"text":"One thing you might do is take a query like, whatever, right? Black hole research. And then use an LLM, use a lot of engine model to generate search terms to feed to a web search engine. So it might generate a few terms like, you know, black hole research, latest in, I don't know, astronomy and black holes or whatever. So generate a handful of search terms."},{"start":3617.53,"text":"This then calls out a web search engine, be it Surfer, Google, Dr. Go, Bing, I don't know, I used to really quite a lot, but multiple, actually more and more web search engines designed for AI rather than for humans, which I think are pretty neat. So this can call the web search engine and then fetch the top URLs. Oh, sorry, I mean fetch the top pages other than the top URLs."},{"start":3655.88,"text":"So the web search engine returns 10 pages. You may not want to fetch all 10 of them. You can read the snippets, decide which ones are most relevant. Again, maybe with an LLM, with a large language model, to decide what are the pages you want to download. So just like a human, I'll do a web search. I won't click every single link. I'll take a glance and decide which ones I want to click. So identify and fetch the top URLs and then feed all that into writing. And this gives the final output."},{"start":3686.09,"text":"Right. So this is a, by the way, Isaac, this is a more traditional deep researcher article, sorry, deep researcher architecture. The more modern deep researcher architectures let the system decide when to do more web search, when to fetch more web pages, and are more autonomous, more agentic. But this is what the early deep researcher architectures look like. It's more of a linear."},{"start":3712.12,"text":"pipeline. There are more modern architectures where systems will fetch some pages and then autonomously decide, do I need to go back and do more research and solve more topics and iterate a few times? But this would be a pretty decent, basic deep researcher. And it turns out that if you actually build this, one of the"},{"start":3736.73,"text":"In the speech recognition system, we talk a lot about how to improve one component, which is the neural network. If you have a pipeline like this, the other thing you need to do, which is critically important, is to decide, of all the different components in the pipeline, which one do you want to focus your attention on?"}],"speech_gaps":[],"frame":"../frames/v055/022.webp","frame_time":3604.01},{"title":"AI项目策略中的系统评估与错误分析","segments":[{"id":286,"text":"So I find that one thing that makes a huge difference in a team's performance is, again, being able to drive a disciplined evaluation and error analysis process to decide what to work on. I find that a lot of machine learning is not wildly doing things to see what works. It's actually a very thoughtful, very disciplined process where the system maybe is not doing as well as we wish.","start":3757.67,"end":3784.77},{"id":287,"text":"So we should look at it to decide. It turns out lots of things could be wrong. Is it generating search terms? Not quite right, right?","start":3785.49,"end":3793.79},{"id":288,"text":"Or maybe we're using a web search engine that is returning results that aren't that good. So for example, is my web search engine comprehensive enough? Or is it just, you know, maybe I picked a lower cost web search service or something that's just not returning the latest materials. It turns out for some internet articles, many web search engines will do really well. But if you ever want to fetch news, really fresh news,","start":3795.19,"end":3821.75},{"id":289,"text":"there's actually a lot of difference in the performance. Some web search engines are much better at having really fresh content. Some just don't update as frequently. So I need to switch web search engines. Or...","start":3822.29,"end":3832.99},{"id":290,"text":"am I successfully identifying the best web pages to fetch? So if I have black hole science, I think nasa.gov is a very, very authoritative web page. But if a web search engine returns, I don't know, bobsbackdownastronomyblog.com that's less authoritative than nasa.gov, am I correctly fetching the most authoritative scientific articles versus whatever is hyped up? Or maybe","start":3833.36,"end":3861.72},{"id":291,"text":"It might affect a lot of random TikTok videos rather than really scientific, authoritative things. And then lastly, given all this information, am I writing a thoughtful article with an LM from a final research output? So it turns out that...","start":3863.3,"end":3881.3},{"id":292,"text":"With a pipeline like this, there are lots of steps that could go wrong. And your ability to decide what is the component you should focus your effort on, that's a massive driver of your productivity in improving a system like this. And the good news is that there's actually one other thing I've seen. Sometimes I've seen a few experienced machine learning people. It's actually one thing I've seen.","start":3881.63,"end":3910.15},{"id":293,"text":"Sometimes a team will build a system like this, and if it's a less experienced team, they'll build a system, it's not quite working, try to decide what to do next. One thing I've seen many times is if you get a few senior machine learning people around, at Stanford I've seen this quite a few times, sometimes the students on the project may build a system like this. If you get a few experienced professors to look at the system, you find that","start":3911.65,"end":3936.81}],"notes":["本段主要讲解了在AI项目中，团队如何通过系统化的评估和错误分析来决定下一步工作重点。讲者指出，机器学习并不是盲目尝试，而是一个需要深思熟虑和纪律性的过程，系统可能没有达到预期效果。","讲者提到，系统可能出错的原因有很多，例如搜索词生成不准确、使用的网络搜索引擎效果不佳等。他举了网络搜索引擎的例子，说明不同搜索引擎在获取最新新闻方面的表现差异很大。","讲者进一步指出，网络搜索引擎在获取权威科学文章方面可能存在差异，例如NASA官网与一些个人博客之间的权威性差异。他强调了正确识别权威信息的重要性。","最后，讲者提到在获取信息后，如何利用语言模型（LM）撰写有深度的文章，以及整个流程中可能存在的多个错误点。他指出，能够判断应该优先改进哪个组件，是提高系统性能的关键。","讲者还提到，经验丰富的机器学习人员能够帮助团队识别系统中的问题，特别是在系统构建初期，他们可以提供关键的反馈和指导。","整体上，本段强调了系统化评估和错误分析在AI项目中的重要性，以及团队中经验丰富的成员在项目成功中的作用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3757.67,"end":3936.81,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3757.67,"text":"So I find that one thing that makes a huge difference in a team's performance is, again, being able to drive a disciplined evaluation and error analysis process to decide what to work on. I find that a lot of machine learning is not wildly doing things to see what works. It's actually a very thoughtful, very disciplined process where the system maybe is not doing as well as we wish."},{"start":3785.49,"text":"So we should look at it to decide. It turns out lots of things could be wrong. Is it generating search terms? Not quite right, right?"},{"start":3795.19,"text":"Or maybe we're using a web search engine that is returning results that aren't that good. So for example, is my web search engine comprehensive enough? Or is it just, you know, maybe I picked a lower cost web search service or something that's just not returning the latest materials. It turns out for some internet articles, many web search engines will do really well. But if you ever want to fetch news, really fresh news,"},{"start":3822.29,"text":"there's actually a lot of difference in the performance. Some web search engines are much better at having really fresh content. Some just don't update as frequently. So I need to switch web search engines. Or..."},{"start":3833.36,"text":"am I successfully identifying the best web pages to fetch? So if I have black hole science, I think nasa.gov is a very, very authoritative web page. But if a web search engine returns, I don't know, bobsbackdownastronomyblog.com that's less authoritative than nasa.gov, am I correctly fetching the most authoritative scientific articles versus whatever is hyped up? Or maybe"},{"start":3863.3,"text":"It might affect a lot of random TikTok videos rather than really scientific, authoritative things. And then lastly, given all this information, am I writing a thoughtful article with an LM from a final research output? So it turns out that..."},{"start":3881.63,"text":"With a pipeline like this, there are lots of steps that could go wrong. And your ability to decide what is the component you should focus your effort on, that's a massive driver of your productivity in improving a system like this. And the good news is that there's actually one other thing I've seen. Sometimes I've seen a few experienced machine learning people. It's actually one thing I've seen."},{"start":3911.65,"text":"Sometimes a team will build a system like this, and if it's a less experienced team, they'll build a system, it's not quite working, try to decide what to do next. One thing I've seen many times is if you get a few senior machine learning people around, at Stanford I've seen this quite a few times, sometimes the students on the project may build a system like this. If you get a few experienced professors to look at the system, you find that"}],"speech_gaps":[],"frame":"../frames/v055/023.webp","frame_time":3769.67},{"title":"AI项目策略中的方法论与误差分析","segments":[{"id":294,"text":"Our opinions on what to do next, there's remarkably little variance. So you find that many experienced AI people look at it and will go, well, based on what it seems, we think this is a problem or this is wrong, we should try this. It's not that we always agree with each other 100%, but the variance is much less than you might think. And to me, I think there's a methodology behind how...","start":3937.46,"end":3963.02},{"id":295,"text":"to approach these problems, whereas the variance in what to try next among less experienced engineers is much larger. So to me, I think there's actually a systematic way of doing error analysis to figure out where it's actually underperforming. It doesn't mean experienced people are always right, there's just no variance, but there really is a methodology to figure out what to do next.","start":3963.46,"end":3987.48},{"id":296,"text":"And one of the key ideas is error analysis. And I talk about this on online videos as well, but this is so important. Let me just go through.","start":3988.68,"end":3997.22},{"id":297,"text":"One thing to do is to look at the outputs of each of these intermediate steps. And it's one of these things, I know I'll say it, you probably even agree it's a good idea, but the percentage of people that actually do it when the time comes are found to be far lower than 100%. But it's just, you know, take a handful of queries, be it, is it...","start":4003.31,"end":4026.65},{"id":298,"text":"latest in black hole science, or should I rent or buy an apartment, or help me make fun plans for a weekend in Santa Cruz, whatever. Some handful of queries for a deep researcher. And then look at what search terms it generates and see if it makes sense. Look at the web pages and fetches, see if they look good.","start":4027.23,"end":4048.29},{"id":299,"text":"look at the top pages in fetch and see if the top web pages selected is similar or if it's materially different than what you would pick. Like my example of, what if this decides to fetch Bob's Backyard Astronomy Page.com rather than NASA.gov, right? Then you go, okay, maybe I need to change how to do that. And then also look at the final writing to see, given the source articles, is it writing the appropriate articles? And what I find is, for a process like this,","start":4049.2,"end":4077.84},{"id":300,"text":"It turns out error analysis is often a very manual process because when the system isn't performing, error analysis or gap analysis is often a manual process of figuring out what a human would do that is better than what the AI system would do. And we're trying to inject knowledge from the human into the AI system. So because the AI doesn't have this knowledge yet, usually you do need a human time.","start":4080.73,"end":4107.89}],"notes":["本段讲授了AI项目中经验丰富的工程师与新手在决策过程中的差异。经验丰富的工程师在面对问题时，虽然不总是完全一致，但他们的决策差异较小，这表明存在一种系统性的方法论。而新手工程师在尝试下一步时，其决策的差异较大，这说明他们缺乏系统性的方法论。","误差分析是AI项目中一个关键的概念。它强调在系统表现不佳时，需要通过手动分析找出AI系统与人类行为之间的差距，并将人类的知识注入到AI系统中。这通常需要人类的参与，因为AI系统目前缺乏这些知识。","误差分析的具体实践包括检查系统各个中间步骤的输出，例如搜索关键词、获取的网页内容等。通过对比AI系统生成的内容与人类预期的结果，可以发现系统在哪些方面表现不佳。","在实际操作中，误差分析往往是一个手动过程。这包括分析AI系统生成的内容是否符合预期，以及是否需要调整系统的策略或参数。例如，如果AI系统选择了不相关的网页，可能需要调整其搜索策略。","误差分析的目的是找出AI系统在哪些环节表现不佳，并通过注入人类的知识来改进系统。这通常需要人类的参与，因为AI系统目前缺乏这些知识。","误差分析是AI项目中不可或缺的一部分，它帮助开发者理解系统在哪些方面需要改进，并通过手动分析来优化系统的表现。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3937.46,"end":4107.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3937.46,"text":"our opinions on what to do next, there's remarkably little variance. So you find that many experienced AI people look at it and will go, well, based on what it seems, we think this is a problem or this is wrong, we should try this. It's not that we always agree with each other 100%, but the variance is much less than you might think. And to me, I think there's a methodology behind how..."},{"start":3963.46,"text":"to approach these problems, whereas the variance in what to try next among less experienced engineers is much larger. So to me, I think there's actually a systematic way of doing error analysis to figure out where it's actually underperforming. It doesn't mean experienced people are always right, there's just no variance, but there really is a methodology to figure out what to do next."},{"start":3988.68,"text":"And one of the key ideas is error analysis. And I talk about this on online videos as well, but this is so important. Let me just go through."},{"start":4003.31,"text":"One thing to do is to look at the outputs of each of these intermediate steps. And it's one of these things, I know I'll say it, you probably even agree it's a good idea, but the percentage of people that actually do it when the time comes are found to be far lower than 100%. But it's just, you know, take a handful of queries, be it, is it..."},{"start":4027.23,"text":"latest in black hole science, or should I rent or buy an apartment, or help me make fun plans for a weekend in Santa Cruz, whatever. Some handful of queries for a deep researcher. And then look at what search terms it generates and see if it makes sense. Look at the web pages and fetches, see if they look good."},{"start":4049.2,"text":"look at the top pages in fetch and see if the top web pages selected is similar or if it's materially different than what you would pick. Like my example of, what if this decides to fetch Bob's Backyard Astronomy Page.com rather than NASA.gov, right? Then you go, okay, maybe I need to change how to do that. And then also look at the final writing to see, given the source articles, is it writing the appropriate articles? And what I find is, for a process like this,"},{"start":4080.73,"text":"It turns out error analysis is often a very manual process because when the system isn't performing, error analysis or gap analysis is often a manual process of figuring out what a human would do that is better than what the AI system would do. And we're trying to inject knowledge from the human into the AI system. So because the AI doesn't have this knowledge yet, usually you do need a human time."}],"speech_gaps":[],"frame":"../frames/v055/024.webp","frame_time":3949.46},{"title":"错误分析与人工监督在AI项目中的应用","segments":[{"id":301,"text":"to do this. And I know, you know, and people are talking about automating some of this and maybe there'll be problems there. But so far, I find error analysis, it just takes human to look at it and have the insights into where AI system is doing something different than an expert human would be. And it's that insight that then points you in the direction for how to improve it. And so often, I would build a spreadsheet like this, where I have a query that is, you know, black cosines. And then,","start":4108.46,"end":4137.34},{"id":302,"text":"Another one, do I rent versus buy, you know, in whatever, San Francisco, or, you know, weekend activities in Santa Cruz, right? Whatever. Just, I don't know, maybe up to 100. I find that I often have patients looking up to 100 examples, beyond 100, sometimes more than 100, but somewhere between 10 and 100, have a list of queries and have a list of steps. And so the steps would be,","start":4137.71,"end":4167.55},{"id":303,"text":"Search terms, web search, fetch pages. So this is what it feels like to do error analysis. It is a labor-intensive process because it's a process of identifying where a human outperforms AI to try to close the gap. You just do this over and over.","start":4168.77,"end":4203.6},{"id":304,"text":"But so what I would do is I'll sit down, often with a spreadsheet in front of me open like this, and I will run black hole signs through the whole system and then just read, are the search terms satisfactory? And if I'm not an expert in black hole signs, then we need to get an expert or do a bit of work to figure that out. But if I find that the search terms to send to a web search engine are completely satisfactory, then I'll just say, okay, this looks good.","start":4204.32,"end":4228.9},{"id":305,"text":"Then given those search terms, I'll look at the web search results and say, huh, did the web search engine retrieve reasonable things? And it looks good, then great. And then I'll look at, did my system, maybe an LLM, did it make a good choice in the top web pages to actually go and fetch? And maybe I found this retrieving, it chose to retrieve Bob's backyard astronomy blog, but skip NASA.gov. Then I'll say, okay, there's a problem there. And then I'll make a note.","start":4229.66,"end":4258.48},{"id":306,"text":"Bob instead of NASA. Just take notes on what you're seeing. And then I'll say, given these sources, is this writing okay? Maybe it's okay. And then the process is...","start":4259.39,"end":4273.49}],"notes":["本段主要讲解了错误分析在AI项目中的重要性，强调了人工监督在识别AI系统与专家人类表现差异中的作用。讲者提到，通过构建类似电子表格的工具，可以系统地分析AI系统在哪些方面表现不佳，并据此指导改进方向。","讲者以实际例子说明了如何构建查询列表和步骤列表，例如在决定是否租房还是买房，或规划周末活动时，通过分析不同查询的搜索结果来评估AI的表现。这表明错误分析需要人工参与，以确保搜索结果和系统选择的合理性。","错误分析是一个劳动密集型的过程，需要反复进行，以识别AI系统与人类表现的差距。讲者提到，通过检查搜索关键词、搜索结果以及系统选择的网页，可以发现AI系统的问题，例如选择不相关的网页（如选择Bob的博客而非NASA官网）。","讲者强调了在错误分析过程中记录观察的重要性，例如在发现AI系统选择错误的网页时，需要记录下来并进行后续改进。这表明错误分析不仅是发现问题，更是为后续优化提供依据。","讲者提到，即使搜索结果看起来合理，也需要进一步检查系统是否选择了合适的网页，例如是否忽略了权威来源（如NASA官网）。这说明错误分析需要多步骤的验证，以确保AI系统的输出质量。","最后，讲者指出错误分析是一个持续的过程，需要不断重复和优化，以逐步缩小AI系统与人类表现之间的差距。这表明错误分析是AI项目中不可或缺的一部分，需要人工监督和持续改进。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4108.46,"end":4273.49,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4108.46,"text":"to do this. And I know, you know, and people are talking about automating some of this and maybe there'll be problems there. But so far, I find error analysis, it just takes human to look at it and have the insights into where AI system is doing something different than an expert human would be. And it's that insight that then points you in the direction for how to improve it. And so often, I would build a spreadsheet like this, where I have a query that is, you know, black cosines. And then,"},{"start":4137.71,"text":"Another one, do I rent versus buy, you know, in whatever, San Francisco, or, you know, weekend activities in Santa Cruz, right? Whatever. Just, I don't know, maybe up to 100. I find that I often have patients looking up to 100 examples, beyond 100, sometimes more than 100, but somewhere between 10 and 100, have a list of queries and have a list of steps. And so the steps would be,"},{"start":4168.77,"text":"Search terms, web search, fetch pages. So this is what it feels like to do error analysis. It is a labor-intensive process because it's a process of identifying where a human outperforms AI to try to close the gap. You just do this over and over."},{"start":4204.32,"text":"But so what I would do is I'll sit down, often with a spreadsheet in front of me open like this, and I will run black hole signs through the whole system and then just read, are the search terms satisfactory? And if I'm not an expert in black hole signs, then we need to get an expert or do a bit of work to figure that out. But if I find that the search terms to send to a web search engine are completely satisfactory, then I'll just say, okay, this looks good."},{"start":4229.66,"text":"Then given those search terms, I'll look at the web search results and say, huh, did the web search engine retrieve reasonable things? And it looks good, then great. And then I'll look at, did my system, maybe an LLM, did it make a good choice in the top web pages to actually go and fetch? And maybe I found this retrieving, it chose to retrieve Bob's backyard astronomy blog, but skip NASA.gov. Then I'll say, okay, there's a problem there. And then I'll make a note."},{"start":4259.39,"text":"Bob instead of NASA. Just take notes on what you're seeing. And then I'll say, given these sources, is this writing okay? Maybe it's okay. And then the process is..."}],"speech_gaps":[],"frame":"../frames/v055/025.webp","frame_time":4120.46},{"title":"错误分析在AI项目中的应用","segments":[{"id":307,"text":"to take a handful, somewhere between 10, 20, and 100 articles where the performance is subpar. And it's called error analysis because I want to focus on where it's underperforming. So there's some articles that it's doing a great job on. I would tend to pay less attention to those. But I'll focus on finding anywhere from 10, 20, to 100 queries where it's clearly underperforming what I think are human.","start":4274.22,"end":4299.42},{"id":308,"text":"should be doing or what I hope this will do and then going through to just","start":4299.89,"end":4304.49},{"id":309,"text":"try to get a sense of how often the hotspots are in different parts of the pipeline. And so maybe for rent versus buy, I might say, boy, there's a really authoritative blogger that talks about this, but somehow web search misses. I don't know. Maybe I'm using the wrong web search engine. We can in Santa Cruz, yes, buy into some hyped up tourist things rather than actually finding locally interesting web pages and so on. And then by doing this,","start":4305.11,"end":4333.73},{"id":310,"text":"you know, 20, 30, 50 queries, you can then start to get a sense of where the hot spots are. Right. So again, all of these are subpar results. I'm focusing on queries where the performance is not good enough. And then if I find that, you know, I don't know, 40% of the time it's failing to fetch the top web pages. Only 5% of the time, right, it's failing to do that, actually, because of the machines. And I find that...","start":4334.75,"end":4362.13},{"id":311,"text":"70% of the time, I'm really not happy with this. 5% of the time, web search is not good enough. You know, maybe 20% of the time, search terms are wrong. And maybe 20% of the time, the writing is not good enough. These don't have to add up to 100%. Sometimes you have problems in one column. But if this is what it turns out to be, then we'll go, well, clearly...","start":4362.67,"end":4384.11},{"id":312,"text":"A lot of my dissatisfaction with the results is because it's just not choosing good pages from the web search to return. So let me go focus on that. And the thing about a lot of machine learning systems is you just don't know if you don't do this error analysis ahead of time in terms of what component to focus on.","start":4384.64,"end":4402.58},{"id":313,"text":"And so I find that teams that know how to drive this process systematically, and it sometimes takes us hours. Remember that daily schedule thing? Sometimes it takes us a few hours to go through this process to reach conclusions. But then the benefit of spending like whatever, you know, three, four hours on this is that it can save you weeks of otherwise heading in the wrong direction. So teams can drive this.","start":4403.02,"end":4430.16}],"notes":["本段讲授了在AI项目中进行错误分析的重要性，即通过分析系统在哪些方面表现不佳，来定位问题所在。讲者提到，应选择一些表现不佳的查询，以找出系统在哪些环节存在缺陷。","讲者指出，错误分析可以帮助识别系统在不同环节中的热点问题，例如在“租房还是买房”这类主题上，系统可能无法正确检索到权威的网页内容。这表明错误分析有助于发现系统在信息检索或内容理解上的不足。","讲者通过具体的数据说明了系统在不同方面的表现：70%的时间对结果不满意，5%的时间是由于网络搜索本身的问题，20%的时间是由于搜索关键词错误，20%的时间是由于内容撰写质量不高。这些数据表明，错误分析可以帮助量化问题的严重程度。","讲者强调，错误分析是机器学习系统开发过程中不可或缺的步骤，因为它可以帮助团队明确需要改进的组件。如果没有进行错误分析，团队可能会在错误的方向上投入大量时间。","讲者还提到，错误分析虽然耗时，但可以节省大量时间，避免在错误的方向上进行开发。因此，系统性地进行错误分析对于AI项目的成功至关重要。","讲者最后指出，团队如果能够系统性地进行错误分析，就可以更有效地定位问题并改进系统，从而提高整体性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4274.22,"end":4430.16,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4274.22,"text":"to take a handful, somewhere between 10, 20, and 100 articles where the performance is subpar. And it's called error analysis because I want to focus on where it's underperforming. So there's some articles that it's doing a great job on. I would tend to pay less attention to those. But I'll focus on finding anywhere from 10, 20, to 100 queries where it's clearly underperforming what I think are human."},{"start":4299.89,"text":"should be doing or what i hope this will do and then going through to just"},{"start":4305.11,"text":"try to get a sense of how often the hotspots are in different parts of the pipeline. And so maybe for rent versus buy, I might say, boy, there's a really authoritative blogger that talks about this, but somehow web search misses. I don't know. Maybe I'm using the wrong web search engine. We can in Santa Cruz, yes, buy into some hyped up tourist things rather than actually finding locally interesting web pages and so on. And then by doing this,"},{"start":4334.75,"text":"you know, 20, 30, 50 queries, you can then start to get a sense of where the hot spots are. Right. So again, all of these are subpar results. I'm focusing on queries where the performance is not good enough. And then if I find that, you know, I don't know, 40% of the time it's failing to fetch the top web pages. Only 5% of the time, right, it's failing to do that, actually, because of the machines. And I find that..."},{"start":4362.67,"text":"70% of the time, I'm really not happy with this. 5% of the time, web search is not good enough. You know, maybe 20% of the time, search terms are wrong. And maybe 20% of the time, the writing is not good enough. These don't have to add up to 100%. Sometimes you have problems in one column. But if this is what it turns out to be, then we'll go, well, clearly..."},{"start":4384.64,"text":"A lot of my dissatisfaction with the results is because it's just not choosing good pages from the web search to return. So let me go focus on that. And the thing about a lot of machine learning systems is you just don't know if you don't do this error analysis ahead of time in terms of what component to focus on."},{"start":4403.02,"text":"And so I find that teams that know how to drive this process systematically, and it sometimes takes us hours. Remember that daily schedule thing? Sometimes it takes us a few hours to go through this process to reach conclusions. But then the benefit of spending like whatever, you know, three, four hours on this is that it can save you weeks of otherwise heading in the wrong direction. So teams can drive this."}],"speech_gaps":[],"frame":"../frames/v055/026.webp","frame_time":4286.22},{"title":"评估与错误分析流程的重要性","segments":[{"id":314,"text":"evals and error analysis process in a very methodical way, you're much better at picking what direction to work in. And that allows your team to go way faster. And there's way more than a 2x difference. I've actually literally visited teams that have been working on something for six months. I go, gee, I could have told you six months ago this wasn't going to cut it. And then imagine if this was the problem. We're not writing the right web pages.","start":4430.93,"end":4459.17},{"id":315,"text":"But for some reason, the team kept on trying out different web search engines. Maybe there's someone trying to sell a new web search service to you. So you spend a lot of time with the sales team, do a lot of integration with the website. There's actually more web search services than most people know, right? And I actually swap between them whenever I feel like it.","start":4459.76,"end":4486.74},{"id":316,"text":"It just won't move the needle for the overall performance, which is why this type of error analysis process is so important. I walked through this with the example of one pipeline. The online videos go through other examples as well. But both for building deep learning pipelines and for kind of AI agentic pipelines, I think this is a very important concept to master.","start":4487.28,"end":4508.52}],"notes":["本段通过一个错误的案例说明了在AI项目中，缺乏系统性的评估与错误分析流程可能导致资源浪费。讲者指出，团队可能花费大量时间在错误的方向上，例如尝试不同的网络搜索引擎，而没有真正分析问题的根本原因。","讲者提到，错误分析流程的重要性在于它能帮助团队识别真正影响性能的关键因素，而不是盲目地尝试各种技术方案。这种系统性的方法可以显著提升项目的效率。","通过一个假设的案例，讲者强调了错误分析流程在AI项目中的实际应用价值。例如，如果团队没有进行错误分析，可能会持续投入时间在不相关的优化上，而无法真正提升整体性能。","讲者还指出，这种错误分析流程不仅适用于深度学习项目，也适用于更广泛的AI系统设计，如代理系统（agentic pipelines）。这表明错误分析是一个通用的、重要的方法论。","讲者通过一个具体的例子说明了错误分析流程的实施方式，即通过评估和分析错误，团队可以更有效地决定下一步的工作方向，从而加快项目进展。","最后，讲者强调了错误分析流程在AI项目中的核心地位，认为它是构建高效AI系统的关键概念之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4430.93,"end":4508.52,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4430.93,"text":"evals and error analysis process in a very methodical way, you're much better at picking what direction to work in. And that allows your team to go way faster. And there's way more than a 2x difference. I've actually literally visited teams that have been working on something for six months. I go, gee, I could have told you six months ago this wasn't going to cut it. And then imagine if this was the problem. We're not writing the right web pages."},{"start":4459.76,"text":"But for some reason, the team kept on trying out different web search engines. Maybe there's someone trying to sell a new web search service to you. So you spend a lot of time with the sales team, do a lot of integration with the website. There's actually more web search services than most people know, right? And I actually swap between them whenever I feel like it. So imagine you spend all your time trying to come up with a better web search service for six months. That's entirely possible. Then you could..."},{"start":4487.28,"text":"It just won't move the needle for the overall performance, which is why this type of error analysis process is so important. I walked through this with the example of one pipeline. The online videos go through other examples as well. But both for building deep learning pipelines and for kind of AI agentic pipelines, I think this is a very important concept to master."}],"speech_gaps":[],"frame":"../frames/v055/027.webp","frame_time":4442.93}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
