entor of this algorithm just name it as that.","zh":"这个算法的发明者只是这样命名的。","start":3414.89,"end":3418.07},{"id":528,"text":"You'll find that this algorithm actually doesn't really","zh":"你会发现这个算法实际上并不真的","start":3422.39,"end":3425.55},{"id":529,"text":"necessarily require all the backgrounds we have discussed.","zh":"并不一定需要我们之前讨论的所有背景知识。","start":3425.55,"end":3428.79},{"id":530,"text":"discussed is actually much simpler in some sense.","zh":"我们之前讨论的内容在某种意义上实际上要简单得多。","start":3428.79,"end":3431.47},{"id":531,"text":"To some degree, from some dimension.","zh":"在某种程度上，从某个维度来说。","start":3432.57,"end":3434.57},{"id":532,"text":"That's probably why it's easier to apply to large-anglish model,","zh":"这可能就是为什么它更容易应用于大型语言模型，","start":3435.93,"end":3438.65},{"id":533,"text":"which is have other weird features","zh":"这种模型具有其他奇怪的特性","start":3438.83,"end":3441.75},{"id":534,"text":"so that you can only allow some relatively simple algorithm.","zh":"因此你只能允许使用一些相对简单的算法。","start":3441.75,"end":3444.91}],"notes":["这段内容主要讨论了状态索引的设定，以及在机器学习算法选择上的考虑。讲者首先澄清了状态s的索引方式，指出状态从0到n-1，共有n个状态。接着，讲者提到在算法选择上，由于本学期课程重点放在大语言模型上，因此将直接跳过一些不常用的算法，转而介绍政策梯度（Policy Gradient）算法，也称为REINFORCE。讲者还提到该算法不需要太多背景知识，因此更适合应用于大语言模型。"],"formulas":[],"uncertainties":["large-anglish model"],"diagram":"none","start":3267.23,"end":3444.91,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":46,"raw_segments":[{"start":3267.23,"text":"Like I'm, yeah, I think I'm,"},{"start":3270.59,"text":"Maybe I should just use a different- I'm assuming"},{"start":3273.39,"text":"like the state s is indexed by one or maybe I start with zero,"},{"start":3278.21,"text":"then I should- maybe, okay, let's see."},{"start":3283.11,"text":"So maybe let's say,"},{"start":3287.69,"text":"suppose your state s is this,"},{"start":3290.31,"text":"zero, one, up to n minus one, let's say."},{"start":3293.91,"text":"Okay. I think your confusion is very valid."},{"start":3297.61,"text":"So let's say this is n minus 1."},{"start":3300.09,"text":"This is n minus 1."},{"start":3303.25,"text":"So you have n states."},{"start":3304.73,"text":"They are 0, 1, up to n minus 1."},{"start":3307.15,"text":"So on this last equation, on the left-hand side,"},{"start":3309.67,"text":"you have the n minus 1 state value function."},{"start":3312.85,"text":"This is n minus 1."},{"start":3314.01,"text":"It's the size."},{"start":3314.63,"text":"n is the size."},{"start":3315.47,"text":"n is the size."},{"start":3316.09,"text":"n minus 1 is the last state."},{"start":3317.45,"text":"Yeah, yeah, yeah."},{"start":3321.54,"text":"Yeah. Yeah. They say some people write that way, so I'm a little bit lazy. Anyway, okay, but this is clear. Sounds good. So, okay, let me think about this. So how much time I have here? Okay, so I think I'm going to talk about, use the next 20 minutes to talk about algorithm to learn the, to optimize the algorithm."},{"start":3354.51,"text":"So there are many, many different algorithms to find the optimal policy. So I think in the lecture notes, there are quite a few. I think because this quarter, we are focusing more on the large language model stuff. So I think I'm not going to discuss some of those."},{"start":3370.27,"text":"uh, algorithms that are not used very often for large-language models."},{"start":3374.35,"text":"So that's why we're gonna jump directly to one algorithm which is kind of"},{"start":3377.35,"text":"the precursor for all the other algorithms for training large-language models."},{"start":3381.51,"text":"Um, so, so it's called policy gradient,"},{"start":3383.63,"text":"also called reinforce,"},{"start":3384.81,"text":"and there are other algorithms,"},{"start":3386.45,"text":"other algorithms in the lecture notes."},{"start":3388.09,"text":"If you're interested, you can read them,"},{"start":3389.21,"text":"like in some of the sections."},{"start":3390.87,"text":"Okay. So, um, okay."},{"start":3395.73,"text":"I think we can just start from- so,"},{"start":3399.57,"text":"So, what's interesting about this policy,"},{"start":3401.45,"text":"so the algorithm we talked about is policy gradient,"},{"start":3407.31,"text":"or maybe the algorithm also have a name called"},{"start":3410.55,"text":"the Reinforced with all capital letter."},{"start":3413.15,"text":"This is some historical reason I think"},{"start":3414.89,"text":"the inventor of this algorithm just name it as that."},{"start":3422.39,"text":"You'll find that this algorithm actually doesn't really"},{"start":3425.55,"text":"necessarily require all the backgrounds we have discussed."},{"start":3428.79,"text":"discussed is actually much simpler in some sense."},{"start":3432.57,"text":"To some degree, from some dimension."},{"start":3435.93,"text":"That's probably why it's easier to apply to large-anglish model,"},{"start":3438.83,"text":"which is have other weird features"},{"start":3441.75,"text":"so that you can only allow some relatively simple algorithm."}],"speech_gaps":[{"start":3319.568,"end":3321.14},{"start":3419.44,"end":3421.296}],"frame":"../frames/v039/020.webp","frame_time":3279.23},{"title":"强化学习中的策略与回报定义","segments":[{"id":535,"text":"So the algorithm and also","zh":"所以这个算法以及","start":3445.67,"end":3449.27},{"id":536,"text":"this algorithm only applies for stochastic policy.","zh":"这个算法只适用于随机策略。","start":3449.27,"end":3452.11},{"id":537,"text":"As you can see that this algorithm","zh":"正如你所看到的，这个算法","start":3452.79,"end":3454.35},{"id":538,"text":"just can only work for stochastic policy,","zh":"只能适用于随机策略，","start":3454.35,"end":3455.87},{"id":539,"text":"Nope, nothing. Not a communistic one.","zh":"不，什么也没有。不是共产主义的。","start":3455.87,"end":3457.59},{"id":540,"text":"So here is the idea.","zh":"所以这里有一个想法。","start":3459.71,"end":3461.87},{"id":541,"text":"So first of all, you need to define a stochastic policy.","zh":"首先，你需要定义一个随机策略。","start":3462.45,"end":3464.73},{"id":542,"text":"I'm already like a stochastic policy.","zh":"我已经像一个随机策略了。","start":3464.89,"end":3468.01},{"id":543,"text":"each of the logits, each of the probability for every a and s, you can evaluate density with the new network. The new network will give you a density for every a and s, but you may not be able to list the whole distribution because the a can be a continuous set. So the distribution of the number of actions might be infinite or the number of actions could be continuous, so on and so forth. But the minimum requirement is that this new network will give you the density for a given s.","zh":"每个logits，每个动作a和状态s的概率，你都可以用新的网络来评估密度。新的网络会为每个a和s提供一个密度，但你可能无法列出整个分布，因为a可以是一个连续的集合。因此，动作的数量分布可能是无限的，或者动作可能是连续的，等等。但最低要求是，这个新网络会为你给定的状态s提供一个密度。","start":3468.68,"end":3491.7},{"id":544,"text":"So you have a way to sample from this density as well. So that's the two requirements for these algorithms to work. Then you can define this so-called return, which is basically you say you have the expected return, and here in this kind of exciting people often talk about finance steps, and you just say I have this discounted return.","zh":"因此，你也有办法从这个密度中进行采样。这就是这些算法能够工作的两个要求。然后你可以定义所谓的回报，这基本上是你所说的期望回报，而在这种类型的强化学习中，人们经常谈论折扣回报。","start":3492.38,"end":3520.7},{"id":545,"text":"And let's say I know the S0. So the S0 will come from some distribution on D0 and all the, so basically, so the S come from, of course, ST come from the transition dynamics. And the policy, the action come from your policy here. So the action, okay.","zh":"假设我知道初始状态S0。那么S0会来自D0上的某个分布，所有的情况都是如此。因此，状态S会来自，当然，ST会来自转移动态。而动作则来自你的策略。因此，动作，好的。","start":3521.26,"end":3553.13},{"id":546,"text":"And let's say I know the S0. So the S0 will come from some distribution on D0 and all the, so basically, so the S come from, of course, ST come from the transition dynamics. And the policy, the action come from your policy here. So the action, okay.","zh":"假设我知道初始状态S0。那么S0会来自D0上的某个分布，所有的情况都是如此。因此，状态S会来自，当然，ST会来自转移动态。而动作则来自你的策略。因此，动作，好的。","start":3556.46,"end":3585.5},{"id":547,"text":"So that's my definition of the return of this parameter, this policy. So every policy, I can evaluate the return. I'm using the letter eta as opposed to the value function here, just because in this literature, people use eta more often. And there's very minor differences, which is that here, your S0 is also randomized. The value function will make you fix the S in some sense. Your conditional S0 is equal to S. So that is the function of S. But here,","zh":"这就是我对这个参数、这个策略的回报的定义。因此，每个策略，我都可以评估其回报。我在这里使用字母eta而不是价值函数，仅仅是因为在这一文献中，人们更常使用eta。这里存在一些微小的差异，即在这里，你的S0也是随机化的。价值函数会让你在某种意义上固定S。你的条件S0等于S。因此，这是S的函数。但在这里，","start":3591.31,"end":3617.43}],"notes":["本段主要讲解强化学习中策略的定义，特别是随机策略（stochastic policy）的构建。讲者提到需要定义一个随机策略，即通过参数化的方式（如Pi A theta A given S）来表示策略，其中Pi表示策略，A是动作，S是状态，theta是参数。这种策略通过神经网络来实现，网络会为每个状态和动作对提供一个密度函数，但可能无法列出完整的分布，因为动作可能是连续的。","讲者进一步说明了策略的定义需要满足两个条件：一是能够通过网络生成密度函数，二是能够从该密度函数中进行采样。这是算法能够工作的前提条件。此外，讲者提到在强化学习中，通常会定义一个回报（return），即期望回报，其中包含折扣因子（discounted return）的概念。","讲者还提到，状态S0的初始分布来自某个分布D0，而后续的状态ST则来自状态转移动态（transition dynamics）。动作则来自当前的策略。讲者强调，这里的S0是随机化的，与价值函数（value function）不同，后者通常固定状态S。","在定义回报时，讲者使用了eta（η）而不是价值函数，这是因为在相关文献中，eta更常被使用。此外，讲者指出，这里的S0是随机化的，而价值函数通常会固定状态S，因此两者在定义上存在细微差别。","讲者还提到，回报的定义涉及期望值的计算，其中包含折扣因子，这在强化学习中是一个核心概念。同时，讲者指出，状态转移动态和策略的结合决定了动作的生成过程。","最后，讲者提到，对于每个策略，都可以计算其回报，这是评估策略性能的重要指标。通过这种方式，可以比较不同策略的优劣，并选择最优策略。"],"formulas":[],"uncertainties":["new right work","the new right work that will give you this probability distribution"],"diagram":"none","start":3445.67,"end":3617.43,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":3445.67,"text":"So the algorithm and also"},{"start":3449.27,"text":"this algorithm only applies for stochastic policy."},{"start":3452.79,"text":"As you can see that this algorithm"},{"start":3454.35,"text":"just can only work for stochastic policy,"},{"start":3455.87,"text":"Nope, nothing. Not a communistic one."},{"start":3459.71,"text":"So here is the idea."},{"start":3462.45,"text":"So first of all, you need to define a stochastic policy."},{"start":3464.89,"text":"I'm already like a stochastic policy."},{"start":3468.68,"text":"a randomized policy. I think I already wrote it here, which is the way that people do it is you say Pi A given S, but I also have to parametrize it because I'm going to use the new right work to parametrize my policy. So this is a Pi A theta A given S. So it's a new right work that will give you this probability distribution. The implicit assumption here is that the probability distribution"},{"start":3492.38,"text":"each of the logits, each of the probability for every a and s, you can evaluate density with the new network. The new network will give you a density for every a and s, but you may not be able to list the whole distribution because the a can be a continuous set. So the distribution of the number of actions might be infinite or the number of actions could be continuous, so on and so forth. But the minimum requirement is that this new network will give you the density for a given s."},{"start":3521.26,"text":"So you have a way to sample from this density as well. So that's the two requirements for these algorithms to work. Then you can define this so-called return, which is basically you say you have the expected return, and here in this kind of exciting people often talk about finance steps, and you just say I have this discounted return."},{"start":3556.46,"text":"And let's say I know the S0. So the S0 will come from some distribution on D0 and all the, so basically, so the S come from, of course, ST come from the transition dynamics. And the policy, the action come from your policy here. So the action, okay."},{"start":3591.31,"text":"So that's my definition of the return of this parameter, this policy. So every policy, I can evaluate the return. I'm using the letter eta as opposed to the value function here, just because in this literature, people use eta more often. And there's very minor differences, which is that here, your S0 is also randomized. The value function will make you fix the S in some sense. Your conditional S0 is equal to S. So that is the function of S. But here,"}],"speech_gaps":[],"frame":"../frames/v039/021.webp","frame_time":3457.67},{"title":"梯度计算与依赖关系","segments":[{"id":548,"text":"The initial state is also randomized. I assume I already know the initial distribution, and I'm only looking at the dependency on theta, on the parameter theta. So basically, this is what I'm trying to maximize. I'm trying to find the parameter theta, such that my expected return under this policy pi theta is maximized. And my approach is actually very simple. My approach is just trying to take gradient of this eta and take gradient sense. So that's the fundamental approach.","zh":"初始状态也是随机化的。我假设我已经知道初始分布，我只关注它对参数 theta 的依赖。因此，我实际上是在尝试最大化这个量。我试图找到参数 theta，使得在策略 pi theta 下的期望回报最大化。我的方法其实非常简单。我的方法就是尝试对这个 eta 取梯度，并在梯度意义上进行操作。这就是根本的方法。","start":3618.24,"end":3649.26},{"id":549,"text":"But it involves some details here. Why? The fundamental reason is that, if you want to take gradient sense, think about this. Or maybe, I mean, that's the question. Oh, sorry, sorry. This is, sorry, my bad. Yeah, sorry, sorry. Yeah, yeah. Like I was, yeah. Okay, thanks. Okay, so how do you take gradient of this? If you think about it, so this,","zh":"但这里涉及一些细节。为什么？根本的原因是，如果你想在梯度意义上进行操作，那么请思考这个问题。或者，我意思是，这就是问题所在。哦，抱歉，抱歉。这是我的错，抱歉，抱歉。是的，是的。就像我刚才说的，是的。好的，谢谢。好的，那么你如何对这个量取梯度？如果你仔细想想，那么这个，","start":3651.16,"end":3685.47},{"id":550,"text":"Where does theta come from? How do you take radii? So the theta is not even showing up in this what's inside expectation. There's no theta. The r is known. Gamma is known. St is your sampling of what you sampled. So in some sense, the dependence on theta comes from what is the distribution you are sampling from, but not from what's inside expectation. So this is very different from some of the other cases where you have a function theta.","zh":"theta 是从哪里来的？你如何取半径？所以 theta 甚至没有出现在期望内部的表达式中。里面没有 theta。r 是已知的。Gamma 是已知的。St 是你采样的结果。因此，在某种意义上，对 theta 的依赖来自于你从哪里进行采样，而不是期望内部的内容。这与一些其他情况非常不同，那些情况中你有一个函数 theta。","start":3686.48,"end":3713.92},{"id":551,"text":"Then you have some other things maybe you say, suppose you have something like this times w, and then you take expectation over w, and w is from Gaussian I say. So this case is very different from this case because here the dependency, maybe let's even have a more general case. Suppose you have a w from Gaussian, and your function f which is,","zh":"然后你可能还有其他东西，比如你有类似这样的表达式乘以 w，然后你对 w 取期望，而 w 是从高斯分布中采样的。这种情况与之前的情况非常不同，因为在这种情况中，依赖性可能让我们考虑一个更一般的情况。假设你有一个 w 从高斯分布中采样，而你的函数 f 是，","start":3715.15,"end":3741.58},{"id":552,"text":"a function of Theta and W.","zh":"theta 和 w 的函数。","start":3741.98,"end":3743.24},{"id":553,"text":"This whole thing is a function of Theta","zh":"整个表达式是 theta 的函数","start":3743.98,"end":3745.62},{"id":554,"text":"because W is averaged out.","zh":"因为 w 被平均掉了。","start":3745.62,"end":3747.26},{"id":555,"text":"So this whole thing,","zh":"整个表达式，","start":3748.28,"end":3749.58},{"id":556,"text":"let's say, is called F Theta.","zh":"比如说，这被称为 F_θ。","start":3749.6,"end":3751.66},{"id":557,"text":"Taking gradient of this is very easy because you just move the,","zh":"对这个求梯度是非常容易的，因为你只需要移动，","start":3752.62,"end":3756.18},{"id":558,"text":"suppose you have a gradient knob block here,","zh":"假设你有一个梯度旋钮块在这里，","start":3756.26,"end":3758.34},{"id":559,"text":"you just move knob block inside and that's your done.","zh":"你只需要将旋钮块移到里面，这样就完成了。","start":3758.52,"end":3760.42},{"id":560,"text":"Because this expectation is over a fixed random thing,","zh":"因为这个期望是针对一个固定的随机变量，","start":3761.78,"end":3767.08},{"id":561,"text":"you can just move it inside.","zh":"你可以直接将其移入内部。","start":3767.24,"end":3768.44},{"id":562,"text":"But here you cannot do that because if you add","zh":"但在这里你不能这样做，因为如果你在这里添加","start":3768.98,"end":3771.04},{"id":563,"text":"the knob block here,","zh":"旋钮块的话，","st mental approach."},{"start":3651.16,"text":"But it involves some details here. Why? The fundamental reason is that, if you want to take gradient sense, think about this. Or maybe, I mean, that's the question. Oh, sorry, sorry. This is, sorry, my bad. Yeah, sorry, sorry. Yeah, yeah. Like I was, yeah. Okay, thanks. Okay, so how do you take gradient of this? If you think about it, so this,"},{"start":3686.48,"text":"Where does theta come from? How do you take radii? So the theta is not even showing up in this what's inside expectation. There's no theta. The r is known. Gamma is known. St is your sampling of what you sampled. So in some sense, the dependence on theta comes from what is the distribution you are sampling from, but not from what's inside expectation. So this is very different from some of the other cases where you have a function theta."},{"start":3715.15,"text":"Then you have some other things maybe you say, suppose you have something like this times w, and then you take expectation over w, and w is from Gaussian I say. So this case is very different from this case because here the dependency, maybe let's even have a more general case. Suppose you have a w from Gaussian, and your function f which is,"},{"start":3741.98,"text":"a function of Theta and W."},{"start":3743.98,"text":"This whole thing is a function of Theta"},{"start":3745.62,"text":"because W is averaged out."},{"start":3748.28,"text":"So this whole thing,"},{"start":3749.6,"text":"let's say, is called F Theta."},{"start":3752.62,"text":"Taking gradient of this is very easy because you just move the,"},{"start":3756.26,"text":"suppose you have a gradient knob block here,"},{"start":3758.52,"text":"you just move knob block inside and that's your done."},{"start":3761.78,"text":"Because this expectation is over a fixed random thing,"},{"start":3767.24,"text":"you can just move it inside."},{"start":3768.98,"text":"But here you cannot do that because if you add"},{"start":3771.04,"text":"the knob block here,"},{"start":3772.74,"text":"then if you move the knob block inside,"},{"start":3774.56,"text":"this thing actually has no gradient. There's no even"},{"start":3776.84,"text":"dependency on theta. All the dependencies"},{"start":3778.82,"text":"come from what's in the sampling procedure."},{"start":3781.7,"text":"So that's pretty much"},{"start":3782.94,"text":"the whole thing we have to deal with."},{"start":3785.38,"text":"So how do you take gradient when"},{"start":3787.3,"text":"the"},{"start":3788.98,"text":"theta comes from the sampling part?"},{"start":3792.2,"text":"So"},{"start":3794.68,"text":"let's"},{"start":3795.16,"text":"try to abstract this question a little bit"}],"speech_gaps":[],"frame":"../frames/v039/022.webp","frame_time":3630.24},{"title":"梯度与期望的交换","segments":[{"id":576,"text":"so that we can have a more abstract view.","zh":"以便我们可以有一个更抽象的观点。","start":3796.8,"end":3798.98},{"id":577,"text":"view. So in some sense, the way to abstract this is that you","zh":"观点。因此，从某种意义上说，抽象这一问题的方法是，你","start":3798.98,"end":3805.94},{"id":578,"text":"say, in some sense, the question is this. You want to take the","zh":"在某种意义上说，问题就是这个。你想要对 theta 取梯度，而你的目标是某种","start":3808.04,"end":3811.58},{"id":579,"text":"gradient with respect to theta, and your object is something","zh":"关于 theta 的东西，但期望内部的内容不依赖于 theta，但采样过程依赖于 theta。","start":3811.58,"end":3824.96},{"id":580,"text":"What's inside the expectation doesn't depend on theta, but the sampling procedure depends on theta.","zh":"关于 theta 的东西，但采样过程依赖于 theta。","start":3824.96,"end":3827.84},{"id":581,"text":"on theta, but the sampling procedure depends on theta.","zh":"因此，从某种意义上说，如果你看一下这个，","start":3827.84,"end":3829.9},{"id":582,"text":"So in some sense, if you look at this,","zh":"这里的映射是，x 将会映射","start":3830.3,"end":3831.98},{"id":583,"text":"the mapping here is that the x will map","zh":"这里的映射是x将被映射","start":3832.02,"end":3834.3},{"id":584,"text":"to the sequence, the trajectory.","zh":"对于这个序列，轨迹。","start":3834.3,"end":3835.66},{"id":585,"text":"And your f is kind of like that reward function,","zh":"你的 f 类似于那个奖励函数，","start":3841.38,"end":3844.42},{"id":586,"text":"in some sense.","zh":"在某种意义上。","start":3847.34,"end":3848.42},{"id":587,"text":"So f is the reward function.","zh":"所以 f 是奖励函数。","start":3849.04,"end":3851.32},{"id":588,"text":"function.","zh":"函数。","start":3851.32,"end":3851.54},{"id":589,"text":"So f of the trajectory is, in some sense,","zh":"所以 f 作用于轨迹，在某种意义上，","start":3852.34,"end":3857.44},{"id":590,"text":"the sum of the rewards.","zh":"是奖励的总和。","start":3857.56,"end":3858.52},{"id":591,"text":"So that's the map structure.","zh":"这就是映射结构。","start":3861.7,"end":3863.26},{"id":592,"text":"But I want to deal with a simpler setting first.","zh":"但我首先想处理一个更简单的设定。","start":3864.3,"end":3866.2},{"id":593,"text":"So how do you take the gradient here? So eventually, the way is like this. So you first try to make the theta, depending on theta, more explicit. You say, let me try to integrate this. So what does this really mean? This means that expectation of this really means I integrate the probability, multiplied probability times the value, and I integrate over x.","zh":"那么在这里你如何计算梯度呢？最终的方法大致如下。你首先尝试让theta，依赖于theta的部分更加明确。你说，让我试着进行积分。那么这到底意味着什么呢？这意味着期望值实际上意味着我将概率乘以值进行积分，并对x进行积分。","start":3867.31,"end":3897.99},{"id":594,"text":"And now, when you write this way, then you can swap the gradient with the integration, because this integration doesn't depend on anything about theta. The integration is with respect to the very, very usual integration. So then you can just say this is integration of gradient of theta applied to p theta x fx dx. And then you say fx doesn't depend on theta.","zh":"现在，当你这样写的时候，就可以将梯度与积分交换，因为这个积分并不依赖于任何关于theta的内容。这个积分是相对于非常普通的积分进行的。因此，你可以直接说这就是梯度作用于p(theta,x)乘以f(x)的积分，然后你说f(x)不依赖于theta。","start":3901.63,"end":3935.63},{"id":595,"text":"So this is really just the integration of nabla p theta x times fx times dx. And in some sense, this is kind of like an OK formula. The problem is that if this is the formula we are dealing with, how do we integrate x?","zh":"因此，这实际上只是积分形式的nabla p(theta,x)乘以f(x)乘以dx。从某种意义上说，这类似于一个可以接受的公式。问题在于，如果我们处理的是这个公式，如何对x进行积分呢？","start":3936.16,"end":3956.17}],"notes":["本段讨论了如何对涉及期望的梯度进行处理，强调了期望内部的表达式不依赖于参数θ，但采样过程依赖于θ。这为后续的梯度交换提供了理论基础。","讲者提到，当期望表达式被写成积分形式时，可以将梯度与积分交换，前提是积分不依赖于θ。这种交换是可能的，因为积分是关于x的常规积分。","讲者进一步指出，积分后的表达式可以简化为对概率密度函数的梯度与奖励函数的乘积进行积分，这为后续的计算提供了结构。","然而，讲者也指出，这种形式的积分在实际操作中可能面临困难，特别是如何对x进行积分的问题，这可能需要进一步的数学工具或近似方法。","讲者通过将问题抽象为轨迹和奖励函数的映射，强调了梯度计算与期望结构之间的关系，这为后续的算法设计提供了理论支持。","整个段落围绕梯度与期望的交换展开，强调了数学结构的清晰性，以及在实际应用中可能遇到的挑战。"],"formulas":[{"latex":"E_{x \thicksim p_\\theta}[f(x)] = \\int p_\\theta(x) f(x) dx","symbols":"期望的积分形式","explanation":"保持原公式，使用标准积分符号代替文本描述，符合数学表达规范。","evidence":"So how do you take the gradient here? So eventually, the way is like this. So you first try to make the theta, depending on theta, more explicit. You say, let me try to integrate this. So what does this really mean? This means that expectation of this really means I integrate the probability, multiplied probability times the value, and I integrate over x."},{"latex":"\\nabla_\\theta E_{x \thicksim p_\\theta}[f(x)] = \\int \\nabla_\\theta p_\\theta(x) f(x) dx","symbols":"梯度与期望的交换","explanation":"保持原公式，使用标准积分符号代替文本描述，符合数学表达规范。","evidence":"And now, when you write this way, then you can swap the gradient with the integration, because this integration doesn't depend on anything about theta. The integration is with respect to the very, very usual integration. So then you can just say this is integration of gradient of theta applied to p theta x fx dx. And then you say fx doesn't depend on theta."}],"uncertainties":["nabla p theta x times fx times dx"],"diagram":"none","start":3796.8,"end":3956.17,"asr_flags":[577,579],"math_clarifications":["原公式中的文本描述被转换为标准数学符号，以确保表达的准确性和规范性。"],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":3796.8,"text":"so that we can have a more abstract view."},{"start":3798.98,"text":"view. So in some sense, the way to abstract this is that you"},{"start":3808.04,"text":"say, in some sense, the question is this. You want to take the"},{"start":3811.58,"text":"gradient with respect to theta, and your object is something"},{"start":3824.96,"text":"like of this form. What's inside the expectation doesn't depend"},{"start":3827.84,"text":"on theta, but the sampling procedure depends on theta."},{"start":3830.3,"text":"So in some sense, if you look at this,"},{"start":3832.02,"text":"the mapping here is that the x will map"},{"start":3834.3,"text":"to the sequence, the trajectory."},{"start":3841.38,"text":"And your f is kind of like that reward function,"},{"start":3847.34,"text":"in some sense."},{"start":3849.04,"text":"So f is the reward function."},{"start":3851.32,"text":"function."},{"start":3852.34,"text":"So f of the trajectory is, in some sense,"},{"start":3857.56,"text":"the sum of the rewards."},{"start":3861.7,"text":"So that's the map structure."},{"start":3864.3,"text":"But I want to deal with a simpler setting first."},{"start":3867.31,"text":"So how do you take the gradient here? So eventually, the way is like this. So you first try to make the theta, depending on theta, more explicit. You say, let me try to integrate this. So what does this really mean? This means that expectation of this really means I integrate the probability, multiplied probability times the value, and I integrate over x."},{"start":3901.63,"text":"And now, when you write this way, then you can swap the gradient with the integration, because this integration doesn't depend on anything about theta. The integration is with respect to the very, very usual integration. So then you can just say this is integration of gradient of theta applied to p theta x fx dx. And then you say fx doesn't depend on theta."},{"start":3936.16,"text":"So this is really just the integration of nabla p theta x times fx times dx. And in some sense, this is kind of like an OK formula. The problem is that if this is the formula we are dealing with, how do we integrate x?"}],"speech_gaps":[],"frame":"../frames/v039/023.webp","frame_time":3808.8},{"title":"梯度计算与期望形式的转换","segments":[{"id":596,"text":"Like I don't have a way to integrate x. So it's still very inconvenient for me to compute this. It's convenient for me to take the gradient because this is something I can compute, this is something I can compute, but I don't know exactly how to integrate. So eventually what I want to do is I want to actually come back to some sampling version so that I can sample the gradient. So what do I mean by that is that you do this trick where you rewrite this as","zh":"就像我没有什么办法来积分x。因此，对我来说计算这个仍然非常不方便。对我来说取梯度很方便，因为这是我可以计算的东西，这是我可以计算的东西，但我并不确切知道如何积分。所以最终我想做的是回到某种采样版本，这样我就可以采样梯度。我所说的这个意思是指，你使用这个技巧，将它重写为","start":3957.1,"end":3985.58},{"id":597,"text":"the gradient of theta of log of p theta and times p theta dx. So first, let's verify this is the identity. And there is identity just because, very simple, the gradient of log is just p theta x. It just equals to the gradient of p theta divided by p theta. This is a very simple chain rule.","zh":"θ关于log pθ的梯度乘以pθ dx。首先，让我们验证这是恒等式。这是因为，非常简单，log的梯度就是pθ x。它等于pθ的梯度除以pθ。这是一个非常简单的链式法则。","start":3986.9,"end":4015.57},{"id":598,"text":"And then you multiply this p theta with this p theta. If they got canceled, you get the first one. So that's why this is an entity. And why you really want this? The main reason is you want this term to show up so that you can get back to the expectation form. So basically, if this term shows up, this is equals to the expected value of nabla theta log p theta x.","zh":"然后你将这个pθ与这个pθ相乘。如果它们被抵消，你就会得到第一个表达式。这就是为什么这是个恒等式。你为什么真的想要这个？主要原因是你希望这个项出现，这样你就可以回到期望形式。基本上，如果这个项出现，它就等于θ关于x的log pθ的期望值。","start":4017.29,"end":4044.13},{"id":599,"text":"and where x come from p theta. So because this p come into the expectation, the expectation of something is the same as the probability times the value. Not really. I think even it's a product can do it. Even it's a...","zh":"并且x来自于pθ。因为这个p进入期望值，期望值的某种东西等于概率乘以值。不完全是。我想即使它是一个乘积也可以做到。即使它是一个……","start":4049.18,"end":4086.94}],"notes":["本段讲解了如何通过梯度计算和期望形式的转换来处理难以直接积分的概率分布。讲者指出，当无法直接对x进行积分时，可以通过将梯度表达式转换为期望形式来简化计算。具体来说，通过将梯度表达式重写为概率密度函数的期望形式，可以利用概率密度函数的性质来简化计算。","讲者提到，梯度的计算可以通过链式法则进行，即梯度的对数等于概率密度函数的梯度除以概率密度函数本身。这一过程是基于简单的链式法则，但需要特别注意概率密度函数的定义域和可微性。","在转换过程中，讲者强调了概率密度函数在期望计算中的作用。通过将概率密度函数引入期望表达式，可以将复杂的积分问题转化为更易处理的期望形式。这种转换是基于概率密度函数的性质，即期望值等于概率密度函数与相应函数值的乘积的积分。"],"formulas":[{"latex":"\\nabla_\\theta \\log p_\\theta(x) = \\frac{\\nabla_\\theta p_\\theta(x)}{p_\\theta(x)}","symbols":"梯度的对数等于概率密度函数的梯度除以概率密度函数本身","explanation":"该公式正确应用了链式法则，梯度的对数等于概率密度函数的梯度除以概率密度函数本身，符合数学规则。","evidence":"the gradient of theta of log of p theta and times p theta dx. So first, let's verify this is the identity. And there is identity just because, very simple, the gradient of log is just p theta x. It just equals to the gradient of p theta divided by p theta. This is a very simple chain rule."},{"latex":"\\mathbb{E}_{x \\sim p_\\theta} [\\nabla_\\theta \\log p_\\theta(x)]","symbols":"期望形式的梯度计算","explanation":"该公式正确表达了期望形式的梯度计算，适用于从概率分布中采样计算梯度的情况。","evidence":"And then you multiply this p theta with this p theta. If they got canceled, you get the first one. So that's why this is an entity. And why you really want this? The main reason is you want this term to show up so that you can get back to the expectation form. So basically, if this term shows up, this is equals to the expected value of nabla theta log p theta x."}],"uncertainties":["p theta x"],"diagram":"none","start":3957.1,"end":4086.94,"asr_flags":[],"math_clarifications":["原始文本中提到的积分问题和梯度计算的转换，符合变分推断和梯度估计的常见方法，但未涉及具体数学恒等关系的验证，因此未进行额外修复。"],"boards":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":3957.1,"text":"Like I don't have a way to integrate x. So it's still very inconvenient for me to compute this. It's convenient for me to take the gradient because this is something I can compute, this is something I can compute, but I don't know exactly how to integrate. So eventually what I want to do is I want to actually come back to some sampling version so that I can sample the gradient. So what do I mean by that is that you do this trick where you rewrite this as"},{"start":3986.9,"text":"the gradient of theta of log of p theta and times p theta dx. So first, let's verify this is the identity. And there is identity just because, very simple, the gradient of log is just p theta x. It just equals to the gradient of p theta divided by p theta. This is a very simple chain rule."},{"start":4017.29,"text":"And then you multiply this p theta with this p theta. If they got canceled, you get the first one. So that's why this is an entity. And why you really want this? The main reason is you want this term to show up so that you can get back to the expectation form. So basically, if this term shows up, this is equals to the expected value of nabla theta log p theta x."},{"start":4049.18,"text":"and where x come from p theta. So because this p come into the expectation, the expectation of something is the same as the probability times the value. Not really. I think even it's a product can do it. Even it's a..."}],"speech_gaps":[],"frame":"../frames/v039/024.webp","frame_time":3969.1},{"title":"梯度估计与EM算法中的概率处理","segments":[{"id":600,"text":"I think even if it's a product of the probabilities, you can still take the gradient with respect to the product of the probabilities. I don't think that's a fundamental issue. Sorry. Oh, yeah, sorry. I should follow my mouse more carefully. Yeah, but I think even if you have a product of probabilities, I think fundamentally there is no reason. Maybe there's some stability issues, but I don't think that's necessarily the main reason. Okay, so, sounds good? And, okay, so,","zh":"我认为即使它是概率的乘积，你仍然可以对概率的乘积取梯度。我不认为这是根本性的问题。抱歉。哦，对了，抱歉。我应该更仔细地跟随我的鼠标。是的，但我想即使你有概率的乘积，从根本上来说也没有理由。也许存在一些稳定性问题，但我不认为这一定是主要原因。好的，听起来没问题？而且，好的，所以，","start":4089.16,"end":4137.95},{"id":601,"text":"So that's our formula for taking a gradient. So everything here can be evaluated, right? So you can evaluate this, you can evaluate this, you can sample from this. And that's how you get a gradient estimator. And know that this is the estimate for the gradient, not for the original function. So, okay, I have five minutes. Let's see whether I can... So the rest of the thing is to apply this to the particular choice of x that we are seeing here. So if you apply this tool, then you will see","zh":"所以这就是我们取梯度的公式。这里的所有内容都可以被计算出来，对吧？你可以计算这个，你可以计算这个，你也可以从这个中进行采样。这就是如何得到梯度估计量。要知道，这是梯度的估计，而不是原始函数的估计。好的，我有五分钟时间。让我们看看我是否能够……所以剩下的部分是将这个工具应用到我们在这里看到的特定的x选择上。所以如果你应用这个工具，你就会看到","start":4138.98,"end":4171.47},{"id":602,"text":"The gradient of eta theta is the gradient of this guy. So it's the gradient of the expectation of the sum of the r's. And then you apply this tool. You know that you are taking, you can swap this in this way. So still, the trajectories, right? So S0 and A0, so on and so forth, are from the...","zh":"eta theta 的梯度是这个的梯度。所以它是期望值的梯度，期望值是 r 的和。然后你应用这个工具。你知道你可以以这种方式交换。所以仍然，轨迹，对吧？所以 S0 和 A0，依此类推，是从……","start":4172.78,"end":4202.87},{"id":603,"text":"the theta, the pi theta. And here, this part is the same as f, which you keep, and you add another term, which is the gradient. Gradient of theta of the log of the probability. So what's the log of the probability of S0 times the probability of S0? OK, log of this times the probability of A0 given S0.","zh":"theta，pi theta。在这里，这一部分与 f 相同，你保留它，并添加另一个项，即梯度。梯度 theta 的对数概率。所以，S0 的概率乘以 S0 的概率的对数？好的，这个的对数乘以 S0 的概率？A0 在 S0 下的概率。","start":4204.79,"end":4235.48}],"notes":["本段讨论了在概率乘积中对梯度的计算，指出即使是对概率乘积求梯度，也不是根本性的问题，但可能存在稳定性问题。讲者强调梯度估计器是针对梯度的估计，而不是原始函数的估计。","讲者提到梯度估计器的构建过程，包括对期望值和求和项的处理，以及如何通过工具进行交换操作。这表明在实际应用中，需要考虑轨迹（如S0、A0等）的来源。","讲者进一步说明了梯度的计算方式，即对log概率的梯度，涉及S0和A0的概率计算。这表明在具体实现中，需要对状态和动作的概率进行处理。","讲者提到梯度的计算需要考虑 you add another term, which is the gradient. Gradient of theta of the log of the probability. So what's the log of the probability of S0 times the probability of S0? OK, log of this times the probability of A0 given S0."}],"speech_gaps":[],"frame":"../frames/v039/025.webp","frame_time":4101.16},{"title":"强化学习中的目标函数与梯度计算","segments":[{"id":604,"text":"times the probability of S1, which is S0, A0, S1, so on and so forth. And so basically, eventually, you get P of A, T given S, T, and P, S, T, A, T, S, T plus 1. And then this times the sum of the reward, gamma T, R, S, T. So that's the formula. OK, so fundamentally, we already kind of almost solved the problem, because you see everything here you can compute.","zh":"乘以状态S1的概率，即S0, A0, S1，依此类推。因此，最终你得到的是P(A, T | S, T, P)，以及P(S, T, A, T, S, T+1)。然后这个乘以奖励的总和，gamma^T R(S, T)。这就是公式。好的，所以从根本上说，我们已经几乎解决了这个问题，因为这里的所有内容都可以计算。","start":4236.51,"end":4272.26},{"id":605,"text":"we can still simplify it.","zh":"我们仍然可以进一步简化它。","start":4273.65,"end":4275.01},{"id":606,"text":"I think we'll see whether we can simplify a little more","zh":"我想我们会看到是否还能进一步简化一些。","start":4275.07,"end":4277.17},{"id":607,"text":"in four minutes, but eventually, I think fundamentally,","zh":"在四分钟后，但我认为从根本上说，","start":4277.71,"end":4280.23},{"id":608,"text":"we already achieved the goal in some sense","zh":"我们已经以某种意义达到了目标。","start":4280.47,"end":4282.11},{"id":609,"text":"because everything here can be computed.","zh":"因为这里的所有内容都可以计算。","start":4282.11,"end":4286.29},{"id":610,"text":"Okay, so, and now let's try to simplify a little bit.","zh":"好的，现在让我们尝试稍微简化一下。","start":4298.25,"end":4301.17},{"id":611,"text":"But, okay, so actually maybe I'm not entirely corrected","zh":"不过，好吧，实际上我可能并没有完全正确。","start":4301.17,"end":4305.57},{"id":612,"text":"in the sense that everything is computable here.","zh":"也就是说，这里的任何东西都是可以计算的。","start":4305.57,"end":4308.33},{"id":613,"text":"So, these terms may not be computable,","zh":"因此，这些项可能无法计算，","start":4309.63,"end":4314.31},{"id":614,"text":"but they don't contribute to, they don't depend on theta.","zh":"但它们不贡献于，也不依赖于θ。","start":4314.43,"end":4316.53},{"id":615,"text":"So, especially if you write down more carefully,","zh":"因此，如果你更仔细地写出这些内容，","start":4318.43,"end":4321.07},{"id":616,"text":"so you have this expectation,","zh":"你就会得到这个期望值，","start":4321.21,"end":4323.65},{"id":617,"text":"So this is the log of a product, which is the sum of the log of each of the terms.","zh":"因此，这是对一个乘积取对数，即每个项的对数之和。","start":4325.17,"end":4329.29},{"id":618,"text":"So this is the log of a product,","zh":"因此，这是对一个乘积取对数，","start":4329.29,"end":4332.31},{"id":619,"text":"which is the sum of the log of each of the terms.","zh":"即每个项的对数之和。","start":4332.43,"end":4334.85},{"id":620,"text":"So you have gradient of Theta with respect to Theta,","zh":"因此，你有关于Theta对Theta的梯度，","start":4335.01,"end":4339.05},{"id":621,"text":"sum of log of Pst,","zh":"log of Pst的总和，","start":4339.15,"end":4347.57},{"id":622,"text":"At, St plus one plus the sum of the log of P,","zh":"At, St plus one加上log of P的总和，","start":4347.87,"end":4355.63},{"id":623,"text":"a t given s t and then this times another sum of r gamma t r s t","zh":"在给定s t的情况下，a t然后乘以另一个r gamma t r s t的和","start":4355.63,"end":4365.27},{"id":624,"text":"and these terms you may now know the transition dynamics you know we at least so far we didn't","zh":"以及这些项你现在可能已经知道转移动态，我们知道至少到目前为止，我们并没有","start":4369.29,"end":4376.01},{"id":625,"text":"assume they are known and in this algorithm you don't have to know them you don't have to know","zh":"假设它们是已知的，并且在这个算法中你不需要知道它们，你也不需要知道","start":4376.01,"end":4380.79},{"id":626,"text":"the transition dynamics but you can drop this term because the gradient with respect to theta","zh":"转移动态，但你可以省略这一项，因为关于theta的梯度","start":4380.79,"end":4385.13},{"id":627,"text":"So gradient of this is zero, just, it's gone.","zh":"因此，这个梯度为零，它已经消失了。","start":4385.13,"end":4386.99},{"id":628,"text":"So green of this is zero, just, it's gone.","zh":"所以这个绿色的部分是零，只是，它已经消失了。","start":4387.63,"end":4390.03},{"id":629,"text":"And so basically you only care about the rest of them.","zh":"因此，你实际上只关心其余的部分。","start":4390.77,"end":4392.93},{"id":630,"text":"So then you get...","zh":"所以你得到...","start":4393.49,"end":4395.29},{"id":631,"text":"Okay, so this is much more simplified.","zh":"好的，所以这大大简化了。","start":4411.11,"end":4413.03}],"notes":["本段主要讨论强化学习中目标函数的梯度计算，讲者指出目标函数可以分解为多个部分，其中一部分与参数θ无关，因此在计算梯度时可以忽略。讲者提到，目标函数是概率乘积的对数，因此可以拆分为各个项的对数之和。"],"formulas":[],"uncertainties":["可能的术语错误：'gamma T, R, S, T' 可能应为 'gamma_t R(S_t, A_t)'，但无法确定具体含义。","可能的术语错误：'P, S, T, A, T, S, T plus 1' 可能应为 'P(S_{t+1} | S_t, A_t)'，但无法确定具体含义。"],"diagram":"none","start":4236.51,"end":4413.03,"asr_flags":[621],"math_clarifications":["原始片段中未明确数学公式，且未提供完整的数学表达，因此无法进行有效的数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":4236.51,"text":"times the probability of S1, which is S0, A0, S1, so on and so forth. And so basically, eventually, you get P of A, T given S, T, and P, S, T, A, T, S, T plus 1. And then this times the sum of the reward, gamma T, R, S, T. So that's the formula. OK, so fundamentally, we already kind of almost solved the problem, because you see everything here you can compute."},{"start":4273.65,"text":"we can still simplify it."},{"start":4275.07,"text":"I think we'll see whether we can simplify a little more"},{"start":4277.71,"text":"in four minutes, but eventually, I think fundamentally,"},{"start":4280.47,"text":"we already achieved the goal in some sense"},{"start":4282.11,"text":"because everything here can be computed."},{"start":4298.25,"text":"Okay, so, and now let's try to simplify a little bit."},{"start":4301.17,"text":"But, okay, so actually maybe I'm not entirely corrected"},{"start":4305.57,"text":"in the sense that everything is computable here."},{"start":4309.63,"text":"So, these terms may not be computable,"},{"start":4314.43,"text":"but they don't contribute to, they don't depend on theta."},{"start":4318.43,"text":"So, especially if you write down more carefully,"},{"start":4321.21,"text":"so you have this expectation,"},{"start":4325.17,"text":"and the first one is a gradient of the log of the problem."},{"start":4329.29,"text":"So this is the log of a product,"},{"start":4332.43,"text":"which is the sum of the log of each of the terms."},{"start":4335.01,"text":"So you have gradient of Theta with respect to Theta,"},{"start":4339.15,"text":"sum of log of Pst,"},{"start":4347.87,"text":"At, St plus one plus the sum of the log of P,"},{"start":4355.63,"text":"a t given s t and then this times another sum of r gamma t r s t"},{"start":4369.29,"text":"and these terms you may now know the transition dynamics you know we at least so far we didn't"},{"start":4376.01,"text":"assume they are known and in this algorithm you don't have to know them you don't have to know"},{"start":4380.79,"text":"the transition dynamics but you can drop this term because the gradient with respect to theta"},{"start":4385.13,"text":"theta is zero, because they don't even depend on theta."},{"start":4387.63,"text":"So green of this is zero, just, it's gone."},{"start":4390.77,"text":"And so basically you only care about the rest of them."},{"start":4393.49,"text":"So then you get..."},{"start":4411.11,"text":"Okay, so this is much more simplified."}],"speech_gaps":[],"frame":"../frames/v039/026.webp","frame_time":4248.51},{"title":"关于期望估计与方差的讨论","segments":[{"id":632,"text":"and there is another further simplification which is the following so let me see whether","zh":"还有另一个进一步的简化，如下所示，让我看看是否","start":4414.19,"end":4420.69},{"id":633,"text":"i have time okay i may have to refer to the node","zh":"我有时间，好吧，我可能不得不参考这个节点","start":4420.69,"end":4423.41},{"id":634,"text":"So you can see that this is the product of two sums.","zh":"你可以看到，这是两个和的乘积。","start":4429.11,"end":4432.95},{"id":635,"text":"So you have many terms here.","zh":"你这里有很多项。","start":4434.63,"end":4437.29},{"id":636,"text":"Let me see, how do I express this in one minute?","zh":"让我想想，如何在一分钟内表达这个？","start":4447.79,"end":4450.99},{"id":637,"text":"So maybe I'll probably just stop here so that it's a little bit","zh":"所以也许我大概会在这里停下来，这样会有点","start":4451.29,"end":4455.11},{"id":638,"text":"I think it will take like five minutes","zh":"我想这可能需要五分钟","start":4455.11,"end":4458.07},{"id":639,"text":"so that these people are kicking out.","zh":"这样这些人就会被踢出去了。","start":4458.07,"end":4459.29},{"id":640,"text":"So maybe five, 10 minutes.","start":4460.15,"end":4462.03},{"id":641,"text":"So but this is already very simplified in some sense, right?","start":4462.25,"end":4465.71},{"id":642,"text":"Like, like everything you can compute and you can just take the product.","start":4465.79,"end":4468.41},{"id":643,"text":".","start":4469.77,"end":4470.17},{"id":644,"text":"So where did you enumerate all the output generations?","start":4482.67,"end":4485.57},{"id":645,"text":"What do you mean by that?","start":4485.79,"end":4486.49},{"id":646,"text":"Like the expectation of S0, A0, and then if you wanted to do that with a sequence length of like T, or T is like somewhat large, then you would have like the power, which is...","start":4486.49,"end":4500.55},{"id":647,"text":"Oh, but you never enumerate all of them. You just sample from it. You just actually sample one trajectory sometimes. You sample five with ten.","start":4500.55,"end":4507.37},{"id":648,"text":"I, you know,","start":4518.33,"end":4519.23},{"id":649,"text":"there is no multi-color estimation here.","start":4519.61,"end":4521.51},{"id":650,"text":"It's just a, you know, it's just a very simple.","start":4521.63,"end":4523.37},{"id":651,"text":"You sample from the distribution.","start":4523.47,"end":4524.57},{"id":652,"text":"You want to compute the expectation of a random variable.","start":4525.23,"end":4527.49},{"id":653,"text":"You just sample from the random variable and then take the empirical.","start":4527.63,"end":4530.39},{"id":654,"text":"Yes, how large the variance it is, it's a little bit hard to say. I think we'll discuss next time how to reduce the variance, the size of the variance. But I don't think the variance here is kind of like crazily big. Of course, you still want to reduce it. But I don't think it's something like you say that the variance is like exponential in T or anything like that. Yeah, yeah. Sorry?","start":4532.93,"end":4558.14},{"id":655,"text":"You know, in practice, you always kind of want to reduce your variance, you know. Even the variance is not huge, you still want to reduce it. I think people have many ways, right? Yep. But it's not like astronomical in some sense. Yeah. Exactly, exactly. Okay, thanks.","start":4560.48,"end":4578.6}],"notes":["本段讨论了期望估计的计算方法，指出在计算随机变量的期望时，通常不需要枚举所有可能的输出，而是通过从分布中采样来估计期望值。讲者提到，即使序列长度T较大，也不需要枚举所有可能的轨迹，而是通过采样来近似期望。","讲者进一步指出，虽然方差可能较大，但通常不会达到指数级增长，因此在实际应用中仍然可以通过多种方法来减少方差。讲者强调，即使方差不是特别大，仍然需要对其进行优化。","讲者提到，采样方法是计算期望的一种常见方式，即通过从分布中采样并计算经验均值来估计期望。这种方法在实际应用中被广泛使用。","讲者还提到，虽然方差的大小可能难以直接判断，但可以通过后续的讨论和方法来减少方差。这表明在实际应用中，方差的控制是一个重要的问题。","讲者指出，即使方差不是特别大，仍然需要对其进行优化，因为减少方差可以提高估计的准确性。这表明在实际应用中，方差的控制是一个重要的问题。","讲者最后提到，人们有多种方法来减少方差，但方差的大小通常不会达到天文数字的程度。这表明在实际应用中，方差的控制是一个重要的问题，但并非不可解决。"],"formulas":[],"uncertainties":["power, which is..."],"diagram":"none","start":4414.19,"end":4578.6,"asr_flags":[],"boards":[],"translation_complete":false,"translated_segments":8,"raw_segments":[{"start":4414.19,"text":"and there is another further simplification which is the following so let me see whether"},{"start":4420.69,"text":"i have time okay i may have to refer to the node"},{"start":4429.11,"text":"So you can see that this is the product of two sums."},{"start":4434.63,"text":"So you have many terms here."},{"start":4447.79,"text":"Let me see, how do I express this in one minute?"},{"start":4451.29,"text":"So maybe I'll probably just stop here so that it's a little bit"},{"start":4455.11,"text":"I think it will take like five minutes"},{"start":4458.07,"text":"so that these people are kicking out."},{"start":4460.15,"text":"So maybe five, 10 minutes."},{"start":4462.25,"text":"So but this is already very simplified in some sense, right?"},{"start":4465.79,"text":"Like, like everything you can compute and you can just take the product."},{"start":4469.77,"text":"."},{"start":4482.67,"text":"So where did you enumerate all the output generations?"},{"start":4485.79,"text":"What do you mean by that?"},{"start":4486.49,"text":"Like the expectation of S0, A0, and then if you wanted to do that with a sequence length of like T, or T is like somewhat large, then you would have like the power, which is..."},{"start":4500.55,"text":"Oh, but you never enumerate all of them. You just sample from it. You just actually sample one trajectory sometimes. You sample five with ten."},{"start":4518.33,"text":"I, you know,"},{"start":4519.61,"text":"there is no multi-color estimation here."},{"start":4521.63,"text":"It's just a, you know, it's just a very simple."},{"start":4523.47,"text":"You sample from the distribution."},{"start":4525.23,"text":"You want to compute the expectation of a random variable."},{"start":4527.63,"text":"You just sample from the random variable and then take the empirical."},{"start":4532.93,"text":"Yes, how large the variance it is, it's a little bit hard to say. I think we'll discuss next time how to reduce the variance, the size of the variance. But I don't think the variance here is kind of like crazily big. Of course, you still want to reduce it. But I don't think it's something like you say that the variance is like exponential in T or anything like that. Yeah, yeah. Sorry?"},{"start":4560.48,"text":"You know, in practice, you always kind of want to reduce your variance, you know. Even the variance is not huge, you still want to reduce it. I think people have many ways, right? Yep. But it's not like astronomical in some sense. Yeah. Exactly, exactly. Okay, thanks."}],"speech_gaps":[{"start":4472.4,"end":4474.32},{"start":4474.32,"end":4476.176},{"start":4478.288,"end":4480.176},{"start":4530.79,"end":4532.53}],"frame":"../frames/v039/027.webp","frame_time":4426.19}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v039.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
