ideo,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">bilidown检测到重名文件-l78n-【斯坦福CS229】混合高斯模型（EM）与主成分分析 · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v039","title":"bilidown检测到重名文件-l78n-【斯坦福CS229】混合高斯模型（EM）与主成分分析","course":"机器学习","pages":[{"title":"强化学习基础与应用","segments":[{"id":0,"text":"Starting from this week, we're going to talk about reinforcement learning. So today is pretty much basics about reinforcement learning. Then next week, we're going to talk about reinforcement learning applied to large language models, especially in training some of these models with long chain of thought."},{"id":1,"text":"So, yeah, but today is mostly on, we're going to use probably robotics as the target applications because I think it's the easiest to think of."},{"id":2,"text":"understand reinforcement learning in those contexts, the basics. Because otherwise, you have to deal with two things together. One is the reinforcement learning setting, and the other one is how do you apply it to large language models. So today, we're going to make it clean just a relatively simple kind of like robotics or sequential decision-making scenario, and we're going to introduce this algorithm called policy gradient, which is one of the core algorithm for both the robotics case and"},{"id":3,"text":"and the large-language model case. So reinforcement learning, the marker is great. The main concept here is that, so this is a technique in some sense. It's an algorithmic technique. The question we are trying to solve here is the so-called sequential decision-making."},{"id":4,"text":"Let's unpack this. First of all, decision-making, as the name suggests, it means that you are making decisions that can affect our future."},{"id":5,"text":"kind of like that have ramifications in the future. So it's not like you just predict something and that's it. You make some decisions and then it will affect the world. It's kind of like an action, but not just only a prediction. So it's kind of like you operate the robot or maybe you make an Amazon order, so on and so forth. And sequential."},{"id":6,"text":"means that it's not just only one round. It's not like you make a decision and then it's done. You evaluate the decision. Actual decision will be done in a sequential way. For example, when you operate the robot, you have to give it instructions at every time step. You say you go left, you go right, and then raise the arm, so on and so forth. So in some sense, both of these combined make it complicated because"},{"id":7,"text":"like a greedy algorithm wouldn't work. What is the optimal for the moment may not be optimal for the future, and you have to think about the downstream consequence or the ramification. Another thing that we don't discuss that much is that when you are making decision, you also have to balance"}],"notes":["本段介绍了强化学习的基本概念，强调其应用于机器人和大语言模型的场景。课程指出，强化学习的核心是解决序列决策问题，即通过决策影响未来状态。课程提到，决策不仅涉及当前动作，还涉及对未来结果的考虑，因此需要平衡短期和长期收益。","课程提到，强化学习的决策过程是序列化的，即在每个时间步都需要做出决策，并且这些决策会持续影响后续状态。例如，在操作机器人时，需要在每个时间步给出指令，如左转、右转、抬起手臂等，这些决策会逐步影响机器人的行为。","课程指出，简单的贪心算法在强化学习中可能不适用，因为当前最优决策可能对未来的整体表现不利。因此，需要考虑决策的长期后果，而不仅仅是当前的收益。这种权衡是强化学习中的关键挑战之一。","课程还提到，在决策过程中需要平衡多个因素，例如探索与利用、短期收益与长期收益等。这表明强化学习不仅仅是选择最优动作，还需要在不同目标之间进行权衡，以实现整体最优。","课程强调，强化学习的算法（如策略梯度）在机器人和大语言模型中都有广泛应用。这表明强化学习不仅适用于物理世界中的机器人控制，也适用于复杂的语言模型训练任务。","课程通过机器人操作和亚马逊订单等例子，帮助学生理解强化学习的序列决策特性。这些例子展示了决策如何影响未来状态，并强调了决策过程的动态性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.33,"end":175.37,"asr_flags":[],"raw_segments":[{"start":5.33,"text":"Starting from this week, we're going to talk about reinforcement learning. So today is pretty much basics about reinforcement learning. Then next week, we're going to talk about reinforcement learning applied to large language models, especially in training some of these models with long chain of thought."},{"start":25.82,"text":"So, yeah, but today is mostly on, we're going to use probably robotics as the target applications because I think it's the easiest to think of."},{"start":37.87,"text":"understand reinforcement learning in those contexts, the basics. Because otherwise, you have to deal with two things together. One is the reinforcement learning setting, and the other one is how do you apply it to large language models. So today, we're going to make it clean just a relatively simple kind of like robotics or sequential decision-making scenario, and we're going to introduce this algorithm called policy gradient, which is one of the core algorithm for both the robotics case and"},{"start":64.79,"text":"and the large-language model case. So reinforcement learning, the marker is great. The main concept here is that, so this is a technique in some sense. It's an algorithmic technique. The question we are trying to solve here is the so-called sequential decision-making."},{"start":99.86,"text":"Let's unpack this. First of all, decision-making, as the name suggests, it means that you are making decisions that can affect our future."},{"start":109.36,"text":"kind of like that have ramifications in the future. So it's not like you just predict something and that's it. You make some decisions and then it will affect the world. It's kind of like an action, but not just only a prediction. So it's kind of like you operate the robot or maybe you make an Amazon order, so on and so forth. And sequential."},{"start":130.58,"text":"means that it's not just only one round. It's not like you make a decision and then it's done. You evaluate the decision. Actual decision will be done in a sequential way. For example, when you operate the robot, you have to give it instructions at every time step. You say you go left, you go right, and then raise the arm, so on and so forth. So in some sense, both of these combined make it complicated because"},{"start":156.09,"text":"like a greedy algorithm wouldn't work. What is the optimal for the moment may not be optimal for the future, and you have to think about the downstream consequence or the ramification. Another thing that we don't discuss that much is that when you are making decision, you also have to balance"}],"speech_gaps":[],"frame":"../frames/v039/001.webp","frame_time":17.33},{"title":"探索与利用的权衡与强化学习的基本概念","segments":[{"id":8,"text":"on the return versus risk. So for example, some of the decisions you made may not be the optimal for the moment, but it's actually..."},{"id":9,"text":"collecting information to some degree. For example, suppose you are thinking about, you go to a new city and you want to explore the restaurants there, right? So, some of the restaurants you go just for exploration. Not necessarily is that necessarily the optimal, given the current information, but it's in some sense collecting information so that in the future you can make better decisions. You can decide to go to this restaurant more times or not going at all, right? So, the risk versus return trade-off, I mean, the technical term is called exploration."},{"id":10,"text":"versus exploration trade-off. Exploration has the benefit that maybe in the future you understand the world better, and then you can exploit much better. And exploitation is more like a more"},{"id":11,"text":"myopic thing which is that you're given the current amount of information, you just try to do the best thing you know in some sense. So this is exportation exploration trade-off. Actually, the reason why I mentioned at the very beginning is because we are not going to discuss it too much in most of the cases because in some of the applications we are seeing right now, this trade-off, how do you trade-off the exploration versus exportation is very subtle and in many cases,"},{"id":12,"text":"do it. You just don't do much exploration. Naturally, the algorithm has some degree of exploration and that's enough. So only for some of the more classic settings, the exploitation versus exploration trade-off is well understood. So that's why we don't discuss that much. We mostly focus on the sequential part where you have to deal with the long-term ramification. So that's one aspect of reinforcement learning. Another aspect of reinforcement learning is that"},{"id":13,"text":"almost most of the reinforced learning you are dealing with almost no supervision."},{"id":14,"text":"Of course, there are different setups, different variants of setups, but the most classical setup for reinforcement learning, and also for sequential decision-making, is that you don't have supervision. At least you don't have the same type of supervision in the classification or in the supervisor setting. So what you only have is that you only have, for example, in many cases, you don't have the optimal actions. You don't know what is the optimal actions, even in your training dataset."},{"id":15,"text":"and you rely on the so-called reward."},{"id":16,"text":"So, we are learning from reward as opposed to labels."},{"id":17,"text":"I will define what reward means."},{"id":18,"text":"Reward is often a scalar that"},{"id":19,"text":"just tells you whether the sequence of actions is good or bad."},{"id":20,"text":"It doesn't tell you which is the good option."},{"id":21,"text":"It doesn't tell you the optimum action."}],"notes":["本段讲解了探索与利用的权衡概念，即在决策过程中，有时需要牺牲当前的最优选择以获取更多信息，从而在未来做出更好的决策。例如，在新城市探索餐厅时，可能不会立即选择最优的餐厅，而是通过尝试不同的餐厅来收集信息，以便未来做出更优的选择。这种权衡被称为探索与利用的权衡（exploration-exploitation trade-off）。"],"formulas":[],"uncertainties":["exportation"],"diagram":"none","start":176.91,"end":351.04,"asr_flags":[],"raw_segments":[{"start":176.91,"text":"on the return versus risk. So for example, some of the decisions you made may not be the optimal for the moment, but it's actually..."},{"start":186.94,"text":"collecting information to some degree. For example, suppose you are thinking about, you go to a new city and you want to explore the restaurants there, right? So, some of the restaurants you go just for exploration. Not necessarily is that necessarily the optimal, given the current information, but it's in some sense collecting information so that in the future you can make better decisions. You can decide to go to this restaurant more times or not going at all, right? So, the risk versus return trade-off, I mean, the technical term is called export."},{"start":216.24,"text":"versus exploration trade-off. Exploration has the benefit that maybe in the future you understand the world better, and then you can exploit much better. And exploitation is more like a more"},{"start":227.09,"text":"myopic thing which is that you're given the current amount of information, you just try to do the best thing you know in some sense. So this is exportation exploration trade-off. Actually, the reason why I mentioned at the very beginning is because we are not going to discuss it too much in most of the cases because in some of the applications we are seeing right now, this trade-off, how do you trade-off the exploration versus exportation is very subtle and in many cases,"},{"start":255.5,"text":"do it. You just don't do much exploration. Naturally, the algorithm has some degree of exploration and that's enough. So only for some of the more classic settings, the exploitation versus exploration trade-off is well understood. So that's why we don't discuss that much. We mostly focus on the sequential part where you have to deal with the long-term ramification. So that's one aspect of reinforcement learning. Another aspect of reinforcement learning is that"},{"start":284.37,"text":"almost most of the reinforced learning you are dealing with almost no supervision."},{"start":293.96,"text":"Of course, there are different setups, different variants of setups, but the most classical setup for reinforcement learning, and also for sequential decision-making, is that you don't have supervision. At least you don't have the same type of supervision in the classification or in the supervisor setting. So what you only have is that you only have, for example, in many cases, you don't have the optimal actions. You don't know what is the optimal actions, even in your training dataset."},{"start":323.6,"text":"and you rely on the so-called reward."},{"start":326.22,"text":"So, we are learning from reward as opposed to labels."},{"start":339.14,"text":"I will define what reward means."},{"start":341.1,"text":"Reward is often a scalar that"},{"start":343.82,"text":"just tells you whether the sequence of actions is good or bad."},{"start":346.8,"text":"It doesn't tell you which is the good option."},{"start":348.66,"text":"It doesn't tell you the optimum action."}],"speech_gaps":[],"frame":"../frames/v039/002.webp","frame_time":188.91},{"title":"强化学习与马尔可夫决策过程","segments":[{"id":22,"text":"It only evaluates whether actions you output is good or not, so and as a result you know um like"},{"id":23,"text":"um I guess maybe here I should say no human supervision, I mean no or little human supervision"},{"id":24,"text":"and as a result of this you know another feature of it is that in most of these reinforcement"},{"id":25,"text":"learning algorithms you need to collect data yourself, you know in an active way right so like"},{"id":26,"text":"Like, in some sense, for example, think about how to learn the robot."},{"id":27,"text":"You let the robot, you know, you generate some actions for the robot,"},{"id":28,"text":"and you let the robot try it out in the real world."},{"id":29,"text":"And if it doesn't work, then you say, oh, the reward is back."},{"id":30,"text":"you shouldn't do it anymore, then you penalize it. Then if it happens to do well, then you say, oh, this is a good action, then keep doing this in the future. So in some sense, it's like a trial and error approach. You try some trajectories or you try some actions, and then you have a mechanism to reinforce the good actions and penalize the bad actions. So that's the general framework. So there's this data collection and training loop."},{"id":31,"text":"you collect some data and you find out the good data and then you reinforce by training on the good data."},{"id":32,"text":"So that's some of the features, high-level features. Of course, there are many different details depending on the setting, so on and so forth. But most of the cases, you should see all of these dimensions. Next, I'm going to discuss the basic modeling framework for applying reinforcement learning. It's called the Markov Decision Process. In some sense, you have to have a way to describe"},{"id":33,"text":"the world and how to interact with the world to even talk about these algorithms. So it's not as simple as just making a prediction. You are making some decisions. You have to model how does the decision affect the environment and affect you in the future. The modeling is called Markov Decision Process, which is actually a very powerful framework. So it's called MDP."},{"id":34,"text":"And so I think we're going to use probably a running example like this. Something like you are navigating a robot on a 1D tape. It's a kind of like a pretty trivial task. Let's say, suppose you have a 1D tape. You have some cells, 1 to 10. And you have a robot. Let's say you have a robot."},{"id":35,"text":"somewhere on one of the cell and you want to navigate the robot to the left or to the right and maybe there's a goal you want to achieve. So you want to navigate the robots to achieve the goal, something like that. So I'm going to use this as a running example to map the abstract notations into the real world. You can also think of this as, for example, you have"}],"notes":["本段介绍了强化学习的基本概念，强调了没有或很少人工监督的特点，以及数据收集和训练循环的重要性。讲者提到强化学习算法需要主动收集数据，并通过试错机制来强化好的动作和惩罚坏的动作。这种机制类似于试错法，通过尝试不同的轨迹或动作，并根据结果调整策略。","讲者进一步说明了强化学习的建模框架，即马尔可夫决策过程（MDP）。MDP是一种强大的框架，用于描述如何与环境互动并做出决策。讲者指出，与单纯的预测不同，强化学习涉及决策过程，并需要建模决策如何影响环境和未来的结果。","为了更好地理解MDP，讲者提出一个运行示例：在一条1D磁带上导航机器人。这个例子包括10个单元格，机器人位于其中一个单元格，目标是向左或向右移动以达到某个目标。这个例子用于将抽象的符号映射到现实世界中，帮助学生理解MDP的结构。","讲者提到，强化学习的建模需要考虑环境和决策之间的相互作用，以及如何通过奖励机制来调整策略。这种机制是强化学习的核心，即通过奖励和惩罚来引导机器人学习有效的动作。","在讲授过程中，讲者强调了强化学习的高阶特征，包括数据收集、训练循环和试错机制。这些特征构成了强化学习的基本框架，并为后续讨论MDP提供了基础。","讲者还提到，不同的设置会导致不同的细节，但大多数情况下，这些高阶特征是共通的。因此，理解这些基本概念对于掌握强化学习至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":351.04,"end":520.79,"asr_flags":[],"raw_segments":[{"start":351.04,"text":"it only evaluates whether actions you output is good or not so and as a result you know um like"},{"start":359.68,"text":"um i guess maybe here i should say no human supervision i mean no or little human supervision"},{"start":366.32,"text":"and as a result of this you know another feature of it is that in most of these reinforcement"},{"start":370.92,"text":"learning algorithms you need to collect data yourself you know in an active way right so like"},{"start":376.82,"text":"Like, in some sense, for example, think about how to learn the robot."},{"start":380.18,"text":"You let the robot, you know, you generate some actions for the robot,"},{"start":383.68,"text":"and you let the robot try it out in the real world."},{"start":386.28,"text":"And if it doesn't work, then you say, oh, the reward is back."},{"start":389.51,"text":"you shouldn't do it anymore, then you penalize it. Then if it happens to do well, then you say, oh, this is a good action, then keep doing this in the future. So in some sense, it's like a trial and error approach. You try some trajectories or you try some actions, and then you have a mechanism to reinforce the good actions and penalize the bad actions. So that's the general framework. So there's this data collection and training loop."},{"start":416.27,"text":"you collect some data and you find out the good data and then you reinforce by training on the good data."},{"start":427.15,"text":"So that's some of the features, high-level features. Of course, there are many different details depending on the setting, so on and so forth. But most of the cases, you should see all of these dimensions. Next, I'm going to discuss the basic modeling framework for applying reinforcement learning. It's called the Markov Decision Process. In some sense, you have to have a way to describe"},{"start":449.87,"text":"the world and how to interact with the world to even talk about these algorithms. So it's not as simple as just making a prediction. You are making some decisions. You have to model how does the decision affect the environment and affect you in the future. The modeling is called Markov Decision Process, which is actually a very powerful framework. So it's called MDP."},{"start":477.3,"text":"And so I think we're going to use probably a running example like this. Something like you are navigating a robot on a 1D tape. It's a kind of like a pretty trivial task. Let's say, suppose you have a 1D tape. You have some cells, 1 to 10. And you have a robot. Let's say you have a robot."},{"start":498.53,"text":"somewhere on one of the cell and you want to navigate the robot to the left or to the right and maybe there's a goal you want to achieve. So you want to navigate the robots to achieve the goal, something like that. So I'm going to use this as a running example to map the abstract notations into the real world. You can also think of this as, for example, you have"}],"speech_gaps":[],"frame":"../frames/v039/003.webp","frame_time":363.04},{"title":"状态、动作与建模选择","segments":[{"id":36,"text":"you have Go, you are playing Go, and you have a board, which is gonna be 2D, and then every action is kind of like  on a state S."},{"id":56,"text":"So basically, the transition dynamics is asking,"},{"id":57,"text":"if you're given a state S in capital S"},{"id":58,"text":"and you apply an action A in capital A,"},{"id":59,"text":"so what will happen next?"},{"id":60,"text":"So which state I'm going to move to?"},{"id":61,"text":"And it's a probability distribution."},{"id":62,"text":"So the typical way people do this"},{"id":63,"text":"is that this is the state,"},{"id":64,"text":"the concrete state you are at."},{"id":65,"text":"This is the concrete action you apply."},{"id":66,"text":"And this is a probabilistic distribution over the next state, the set of possible states, right?"},{"id":67,"text":"So this is describing what is the chance you arrive at each of the state."},{"id":68,"text":"So in some sense, you know,"},{"id":69,"text":"p, s, z"},{"id":70,"text":"Z, this is the chance to arrive at Z after taking action A on the state S. So it's a probability distribution over the entire state space. So PSA, this is actual vector in dimension."},{"id":71,"text":"the s, right, the cardinality of s. So, of course, in many cases, PSA can be deterministic. You exactly know which is the next state you want to verify it. So in those cases, PSA can just output exactly the s prime, the next state you want. But in many other cases, it's stochastic. Then it's the distribution. So, for example, in this case, you can imagine, for example, suppose your controller is not very accurate, right? So there's some kind of, like,"},{"id":72,"text":"errors in your controller. When you say, I'm going left, with some chances it's going left, and with some other chances it's actually going right. So then you can, in this example, then you can say, oh, maybe I can say, given, let's say, the P, let's say, seven L, given I'm at the cell seven, I'm instructed to go left, what is the chance to go to the next?"}],"notes":["本段讲解了状态与动作的转移动态，即在给定当前状态和动作的情况下，系统将转移到下一个状态的概率分布。这种分布可以是确定性的，也可以是随机性的，取决于系统的设计。","在确定 te."}],"speech_gaps":[],"frame":"../frames/v039/006.webp","frame_time":891.03},{"title":"强化学习中的状态、动作与奖励","segments":[{"id":80,"text":"given the action A0 on the state S0. So you sample one state from that distribution. It's a stochastic step. And then you get S1. And then the next time, the algorithm will choose action A1, mostly likely from the observation S1. We're going to talk about how the algorithm choose the action A1. But the algorithm choose the action A1 in some way. And then you do the environment step again."},{"id":81,"text":"So S2 is from P S1 A1. And then you just loop over this. So each time you're making a decision on the actions and then you transition to a new state. Okay, so that describes how the world is changing over time based on our decision. And then the next concept is the reward."},{"id":82,"text":"Recall that this is actually how we learn this thing."},{"id":83,"text":"It's also how we define success,"},{"id":84,"text":"because so far we are just talking about how do we interact with the world,"},{"id":85,"text":"but we also have to define what does it mean by successfully achieving some goal."},{"id":86,"text":"So the reward is a function."},{"id":87,"text":"This is a function that maps the state set,"},{"id":88,"text":"the set of states to real number."},{"id":89,"text":"Also it's non-active in the real number,"},{"id":90,"text":"but you can also have negative reward."},{"id":91,"text":"reward. So, and, you know,"},{"id":92,"text":"often this is kind of like something close to"},{"id":93,"text":"probably minus one to one, something like that."},{"id":94,"text":"And, and this reward just really means that"},{"id":95,"text":"how good is this state is, right?"},{"id":96,"text":"So, you see that this is a function, you know."},{"id":97,"text":"So, this is a function of the state, right?"},{"id":98,"text":"So, it's describing whether the state is preferable or not."},{"id":99,"text":"And in other cases, you know,"},{"id":100,"text":"people have defined reward,"},{"id":101,"text":"reward which is a function of the state and action."},{"id":102,"text":"So, you are saying that this pair"},{"id":103,"text":"of the state and action is good or not."},{"id":104,"text":"you can even define reward as a function of state,"},{"id":105,"text":"you can even define reward as a function of state,"},{"id":106,"text":"so that the reward is a function of the tuple, S, A, and S."},{"id":107,"text":"so that the reward is a function of the tuple, S, A, and S."},{"id":108,"text":"almost doesn't change at all if you use this version or this version. But for simplicity, we're just going to work with this simple reward function which is only a function of the state. In this case, suppose you are trying to achieve some goal here. I guess my drawing is a little bit, maybe let's say this is like 20, and let's say this goal is like maybe let's say nine. So how do you describe, how do you encode"}],"notes":["本段讲解了强化学习中状态、动作和奖励的基本概念。首先，课程描述了智能体如何在状态空间中进行决策，通过选择动作来转移到新的状态。接着，课程引入了奖励函数的概念，说明奖励是状态到实数的映射，用于衡量状态的好坏。奖励可以是正数或负数，通常范围在-1到1之间。此外，课程还提到奖励函数可以扩展为状态和动作的函数，甚至可以包括下一个状态，以更全面地描述奖励的来源。","课程进一步指出，奖励函数的定义方式会影响智能体的学习过程。在某些情况下，奖励仅依赖于当前状态，而在其他情况下，奖励可能依赖于状态、动作以及下一个状态的组合。这种扩展的奖励函数可以更细致地捕捉智能体在执行动作后所获得的即时反馈。","课程还提到，奖励函数的定义方式对学习目标的实现至关重要。通过定义奖励函数，智能体可以学习如何在环境中做出最优决策，以最大化累积奖励。这种机制是强化学习的核心思想之一。","在实际应用中，奖励函数的设计需要根据具体任务进行调整。例如，在某些任务中，奖励可能仅依赖于当前状态，而在其他任务中，奖励可能依赖于动作和下一个状态的组合。这种灵活性使得强化学习能够适应各种不同的应用场景。"],"formulas":[],"uncertainties":["reward is a function of the tuple, S, A, and S."],"diagram":"none","start":1037.65,"end":1201.16,"asr_flags":[],"raw_segments":[{"start":1037.65,"text":"given the action A0 on the state S0. So you sample one state from that distribution. It's a stochastic step. And then you get S1. And then the next time, the algorithm will choose action A1, mostly likely from the observation S1. We're going to talk about how the algorithm choose the action A1. But the algorithm choose the action A1 in some way. And then you do the environment step again."},{"start":1070.35,"text":"So S2 is from P S1 A1. And then you just loop over this. So each time you're making a decision on the actions and then you transition to a new state. Okay, so that describes how the world is changing over time based on our decision. And then the next concept is the reward."},{"start":1095.49,"text":"Recall that this is actually how we learn this thing."},{"start":1098.53,"text":"It's also how we define success,"},{"start":1100.31,"text":"because so far we are just talking about how do we interact with the world,"},{"start":1104.23,"text":"but we also have to define what does it mean by successfully achieving some goal."},{"start":1110.17,"text":"So the reward is a function."},{"start":1113.07,"text":"This is a function that maps the state set,"},{"start":1115.25,"text":"the set of states to real number."},{"start":1119.01,"text":"Also it's non-active in the real number,"},{"start":1120.95,"text":"but you can also have negative reward."},{"start":1122.43,"text":"reward. So, and, you know,"},{"start":1127.27,"text":"often this is kind of like something close to"},{"start":1128.95,"text":"probably minus one to one, something like that."},{"start":1132.11,"text":"And, and this reward just really means that"},{"start":1134.29,"text":"how good is this state is, right?"},{"start":1139.43,"text":"So, you see that this is a function, you know."},{"start":1141.41,"text":"So, this is a function of the state, right?"},{"start":1143.45,"text":"So, it's describing whether the state is preferable or not."},{"start":1146.47,"text":"And in other cases, you know,"},{"start":1148.37,"text":"people have defined reward,"},{"start":1149.49,"text":"reward which is a function of the state and action."},{"start":1152.45,"text":"So, you are saying that this pair"},{"start":1154.55,"text":"of the state and action is good or not."},{"start":1157.11,"text":"Sometimes, in the extreme case,"},{"start":1158.79,"text":"you can even define reward as a function of state,"},{"start":1161.27,"text":"action, and the next state,"},{"start":1163.05,"text":"so that the reward is a function of the tuple, S, A, and S."},{"start":1172.02,"text":"almost doesn't change at all if you use this version or this version. But for simplicity, we're just going to work with this simple reward function which is only a function of the state. In this case, suppose you are trying to achieve some goal here. I guess my drawing is a little bit, maybe let's say this is like 20, and let's say this goal is like maybe let's say nine. So how do you describe, how do you encode"}],"speech_gaps":[{"start":1167.69,"end":1169.296}],"frame":"../frames/v039/007.webp","frame_time":1049.65},{"title":"奖励函数设计与奖励塑造","segments":[{"id":109,"text":"the goal being 9 into a reward function, it's very simple. You just say the reward at this goal state 9 is 1, let's say. So reaching any other state, let's say, is a minus 1, minus 0.1, let's say, for any state that is not equal to 9."},{"id":110,"text":"So suppose you define it like this, then naturally, if the reward is higher, then you are reaching the state 9 that you prefer. And you are costing yourself some negative reward if you are wandering around on other states. So basically, if you define a reward like this, in some sense, you are encouraging the robot to reach the state 9 as fast as possible and stay there."},{"id":111,"text":"spending time on any other states is actually costing you negative reward, which is definitely not good. So that's possible, but I think there is a little bit subtlety here. First of all, this is our choice. You can define the reward any way you want in some sense. So if you believe that getting close is"},{"id":112,"text":"already being at eight is better than being at seven."},{"id":113,"text":"So there are two things. One reason you do this is because you just fundamentally believe that being at eight is better than being at seven. And being at eight is somehow useful for you, even though it's not exactly at nine. So that's one possibility. It's just from some external information, this is your preferences. You can also do this, but it could also be that I only care about being at nine, I don't really care about being at any other position, but I still define my reward with a gradual,"},{"id":114,"text":"like a slope. So that could have an algorithmic effect. So in a sense that if you define a reward like that, then maybe the algorithm is learning more easily because you have more gradient, so on and so forth. So that's like a definition of reward is called reward shaping."},{"id":115,"text":"So basically, you care about some very discrete, fundamentally, just only one thing. But actually, you change your reward a little bit to make it smoother in some sense. So these are two different ways to define different rewards. But fundamentally, this is your option. Whatever you want to do is fine. And the reward-shaping stuff sometimes has unexpected downside. For example, suppose there is a"}],"notes":["本段讲解了奖励函数的设计方法，其中提到将目标状态9的奖励设为1，其他状态的奖励设为-1或-0.1。这种设计鼓励智能体快速到达目标状态并保持在那里，避免在其他状态花费时间。"],"formulas":[],"uncertainties":["getting close is"],"diagram":"none","start":1203.31,"end":1369.3,"asr_flags":[111],"raw_segments":[{"start":1203.31,"text":"the goal being 9 into a reward function, it's very simple. You just say the reward at this goal state 9 is 1, let's say. So reaching any other state, let's say, is a minus 1, minus 0.1, let's say, for any state that is not equal to 9."},{"start":1228.36,"text":"So suppose you define it like this, then naturally, if the reward is higher, then you are reaching the state 9 that you prefer. And you are costing yourself some negative reward if you are wandering around on other states. So basically, if you define a reward like this, in some sense, you are encouraging the robot to reach the state 9 as fast as possible and stay there."},{"start":1255.55,"text":"spending time on any other states is actually costing you negative reward, which is definitely not good. So that's possible, but I think there is a little bit subtlety here. First of all, this is our choice. You can define the reward any way you want in some sense. So if you believe that getting close is"},{"start":1288.35,"text":"already being at eight is better than being at seven."},{"start":1293.41,"text":"So there are two things. One reason you do this is because you just fundamentally believe that being at eight is better than being at seven. And being at eight is somehow useful for you, even though it's not exactly at nine. So that's one possibility. It's just from some external information, this is your preferences. You can also do this, but it could also be that I only care about being at nine, I don't really care about being at any other position, but I still define my reward with a gradual,"},{"start":1323.09,"text":"like a slope. So that could have an algorithmic effect. So in a sense that if you define a reward like that, then maybe the algorithm is learning more easily because you have more gradient, so on and so forth. So that's like a definition of reward is called reward shaping."},{"start":1340.32,"text":"So basically, you care about some very discrete, fundamentally, just only one thing. But actually, you change your reward a little bit to make it smoother in some sense. So these are two different ways to define different rewards. But fundamentally, this is your option. Whatever you want to do is fine. And the reward-shaping stuff sometimes has unexpected downside. For example, suppose there is a"}],"speech_gaps":[{"start":1252.2,"end":1255.15}],"frame":"../frames/v039/008.webp","frame_time":1215.31},{"title":"奖励函数设计与轨迹回报","segments":[{"id":116,"text":"Because you never know. Suppose in this case, it's very clear, but what if you have a teleporting tunnel from state 2 to state 9, and which you didn't know when you define the reward?"},{"id":117,"text":"So then you say getting closer to nine is better,"},{"id":118,"text":"but actually the best option you might be just going to two and then"},{"id":119,"text":"somehow do something crazy to teleport to nine in some way."},{"id":120,"text":"Here it's crazy, but it's more likely in the robotics case."},{"id":121,"text":"For example, if you want to reach some object,"},{"id":122,"text":"you may naturally think, okay,"},{"id":123,"text":"the closer I am the better."},{"id":124,"text":"So basically I have reward 0.9 here and 0.8 here and 0.7 here."},{"id":125,"text":"here but what if there's something blocking here,"},{"id":126,"text":"and you have to go around,"},{"id":127,"text":"and then your reward function is not"},{"id":128,"text":"actually meaningful in some sense."},{"id":129,"text":"You are doing some damage to,"},{"id":130,"text":"you are misguiding the robot."},{"id":131,"text":"So you should just really care about the final outcome."},{"id":132,"text":"."},{"id":133,"text":"Sometimes you know, right?"},{"id":134,"text":"Yeah."},{"id":135,"text":"Yeah, so when you know, then you probably can do the reward shaping more effectively."},{"id":136,"text":"If you don't know or you have little understanding, sometimes you know, but you cannot understand it."},{"id":137,"text":"But it's too complex and so on and so forth."},{"id":138,"text":"Then maybe it's better to just focus on the core requests."},{"id":139,"text":"Sometimes it's kind of like, suppose you have a manager who manages a team."},{"id":140,"text":"And if the manager knows exactly what to do, then you probably get very fine-grained reward functions."},{"id":141,"text":"But some managers just be very hands off and say,"},{"id":142,"text":"this is my final goal."},{"id":143,"text":"Whatever, how you achieve it, I don't care, right?"},{"id":144,"text":"."},{"id":145,"text":"Agents changing their ."},{"id":146,"text":"No, no, no, not here."},{"id":147,"text":"Yeah, I think generally not very, yeah. So the agent is, the reward is actually the overarching incentive mechanism for the agent. I don't think you can change that, you know, in most of cases, yeah. So, okay, sounds good. So, okay."},{"id":148,"text":"But this is only a reward for one state. Actually, we haven't defined the reward or return or payoff for the whole trajectory. So what happens is that you have a sequence of steps. So you start with S0, as we discussed, and you generate action A0, and then you reach action S1, and you generate another action A1, and you do this, so on and so forth."}],"notes":["本段讨论了奖励函数设计中的潜在问题，特别是在存在障碍物或复杂环境时，简单的距离奖励可能无法准确反映实际效果。讲者指出，如果直接使用距离作为奖励，可能会误导智能体，使其采取不合理的路径，从而影响最终目标的实现。","讲者通过机器人导航的例子说明，当环境复杂时，仅依赖局部奖励（如距离）可能无法有效引导智能体完成任务。例如，如果路径被阻挡，智能体可能需要绕行，此时距离奖励可能不再有意义，甚至可能误导其行为。","讲者进一步强调，奖励函数的设计应关注最终目标，而非局部状态。如果奖励函数无法准确反映最终目标，可能会导致智能体采取次优策略，甚至产生有害行为。","讲者还提到，奖励函数的设计需要根据对环境的理解程度进行调整。如果对环境了解有限，可能需要简化奖励函数，仅关注核心目标，避免过度复杂化。","讲者以经理管理团队的类比说明，奖励函数的设计类似于管理方式：如果管理者了解具体任务，可以设计精细的奖励；如果管理者只关注最终目标，可能采用更粗略的奖励机制。","最后，讲者指出，奖励函数是智能体行为的核心激励机制，不能随意更改。因此，在设计奖励函数时，需要充分考虑环境特性和任务目标，以确保智能体能够有效完成任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1370.08,"end":1534.06,"asr_flags":[135,136,137,138,139,140],"raw_segments":[{"start":1370.08,"text":"Because you never know. Suppose in this case, it's very clear, but what if you have a teleporting tunnel from state 2 to state 9, and which you didn't know when you define the reward?"},{"start":1385.22,"text":"So then you say getting closer to nine is better,"},{"start":1388.36,"text":"but actually the best option you might be just going to two and then"},{"start":1391.1,"text":"somehow do something crazy to teleport to nine in some way."},{"start":1398.14,"text":"Here it's crazy, but it's more likely in the robotics case."},{"start":1401.42,"text":"For example, if you want to reach some object,"},{"start":1404.04,"text":"you may naturally think, okay,"},{"start":1405.6,"text":"the closer I am the better."},{"start":1407.8,"text":"So basically I have reward 0.9 here and 0.8 here and 0.7 here."},{"s ly modify this return."},{"start":1605.74,"text":"So you say you add a Gamma here and then this is Gamma to the power t."},{"start":1610.64,"text":"For the t-th term, you add Gamma to the power t,"},{"start":1613.08,"text":"where Gamma is a number between 0 and 1 and it's often very close to 1."},{"start":1618.28,"text":"So Gamma is something like maybe 0.99 or something like that."},{"start":1621.2,"text":"So this is in some sense a little bit more, you know,"},{"start":1623.56,"text":"I think the easiest way to think about it is that it's a little bit"},{"start":1625.4,"text":"kind of like an interest rate kind of stuff, right?"},{"start":1627.54,"text":"You are discounting the reward you get in the future."},{"start":1629.76,"text":"if it's too far away from the future,"},{"start":1632.16,"text":"then it's less valuable than the reward near term."},{"start":1635.04,"text":"So if you earn the same $1 today versus 100 years later,"},{"start":1643.84,"text":"then $1 today is worth a little bit more."},{"start":1646.88,"text":"So this doesn't mean that you are myopic."},{"start":1648.88,"text":"You only focus on today."},{"start":1650.4,"text":"But I'm just saying if you can exchange when you get the reward,"},{"start":1654.52,"text":"then you should do it early."},{"start":1656.08,"text":"But sometimes the optimal action is"},{"start":1658.18,"text":"is that you don't get any reward at"},{"start":1659.3,"text":"the beginning because otherwise you"},{"start":1660.56,"text":"don't get enough reward in the future."},{"start":1662.48,"text":"So anyway, once you do this,"},{"start":1666.08,"text":"you also have the benefit that with the discount factor,"},{"start":1671.32,"text":"another small benefit is that the payoff is"},{"start":1676.02,"text":"bounded for any number of steps."},{"start":1682.52,"text":"Here, I didn't even specify how many steps you have."},{"start":1684.96,"text":"I'm indicating that you actually can run it forever."},{"start":1686.92,"text":"So even if you run it forever,"},{"start":1689.34,"text":"so you know that if each of the individual reward,"}],"speech_gaps":[],"frame":"../frames/v039/010.webp","frame_time":1548.31},{"title":"马尔可夫决策过程（MDP）与折扣因子","segments":[{"id":180,"text":"Let's say it is bounded by some constraint M, then the total payoff is bounded by M over one minus Gamma in absolute value. So this is just because if you take the sum of all of this, so this is just a very simple math which is like one plus Gamma. The first time you get at most M,"},{"id":181,"text":"the second time you get at most Gamma times M,"},{"id":182,"text":"and then Gamma squared times M, all of this way."},{"id":183,"text":"This whole thing is less than M over one minus Gamma."},{"id":184,"text":"So this way, you can more effectively talk about infinite number of steps,"},{"id":185,"text":"which is not that common anymore,"},{"id":186,"text":"but if you want to do this in some of the settings,"},{"id":187,"text":"you do care about steps being a variable that can be possibly infinite."},{"id":188,"text":"Infinite. And also, as you can see,"},{"id":189,"text":"like the discount factor encourages you to get the reward earlier,"},{"id":190,"text":"which is sometimes useful."},{"id":191,"text":"For example, if you want to reach this cup here,"},{"id":192,"text":"you do probably want the robots to find"},{"id":193,"text":"the shortest path to reach the cup as opposed to"},{"id":194,"text":"spending like a year to reach the cup or something like that."},{"id":195,"text":"Anyway, so these are just some variants here."},{"id":196,"text":"So once you have all of this, you've got a so-called MDP."},{"id":197,"text":"So the MDP is pretty much a top of all of this,"},{"id":198,"text":"the state set, the action set, the transition dynamics,"},{"id":199,"text":"the reward function, and the discount factor."},{"id":200,"text":"So this describes the MDP."},{"id":201,"text":"Okay."},{"id":202,"text":"Okay, so."},{"id":203,"text":"."},{"i o care about steps being a variable that can be possibly infinite."},{"start":1750.78,"text":"infinite. And also, as you can see,"},{"start":1755.02,"text":"like the discount factor encourage you to get the reward earlier,"},{"start":1758.08,"text":"which is sometimes useful."},{"start":1759.4,"text":"For example, if you want to reach this cup here,"},{"start":1764.4,"text":"you do probably want the robots to find"},{"start":1767.2,"text":"the shortest path to reach the cup as opposed to"},{"start":1770.06,"text":"spending like a year to reach the cup or something like that."},{"start":1773.0,"text":"Anyway, so these are just some variants here."},{"start":1778.32,"text":"So once you have all of this, you've got a so-called MDP."},{"start":1783.48,"text":"So the MDP is pretty much a top of all of this,"},{"start":1790.12,"text":"the state set, the action set, the transition dynamics,"},{"start":1794.42,"text":"the reward function, and the discount factor."},{"start":1798.58,"text":"So this describes the MDP."},{"start":1802.56,"text":"Okay."},{"start":1803.12,"text":"Okay, so."},{"start":1804.88,"text":"."},{"start":1812.7,"text":"Yes."},{"start":1814.24,"text":"."},{"start":1818.14,"text":"Yes."},{"start":1819.06,"text":"."},{"start":1821.42,"text":"Yeah, I guess I wouldn't use the word rules, but I think I understand what you mean. It's a probabilistic discussion, right? Probabilistic discussion. Not really, right? So I don't think, you know, in theory, yes, but at least for Jones, it's actually very easy. The state space is probably just, maybe you just need to, you know, depending on what you, you know, depending on what environment you are flying in, so you can just say the height,"}],"speech_gaps":[{"start":1806.224,"end":1807.824}],"frame":"../frames/v039/011.webp","frame_time":1710.13},{"title":"马尔可夫决策过程与状态空间","segments":[{"id":209,"text":"like how far some of the velocities, you know, maybe like whether the motor is on, you know, and maybe just actually pretty easy. No, no, but you have continuous states, right? So, like, this set doesn't have to be, doesn't have to be discrete, right? So, like, it's just a scalar. In your state space, there's one dimension, which is a scalar, which is the height."},{"id":210,"text":"And even if it's criticized, it doesn't have to be finite."},{"id":211,"text":"The state space doesn't have to be finite."},{"id":212,"text":"So after you have this MVP, the goal is just"},{"id":213,"text":"to maximize the payoff."},{"id":214,"text":"Maximize the expected payoff, which is defined here."},{"id":215,"text":"here."},{"id":216,"text":"So they'll expect a return."},{"id":217,"text":"And how do you maximize the expected payoff?"},{"id":218,"text":"You have to decide the right actions, the sequence"},{"id":219,"text":"of actions to maximize the payoff."},{"id":220,"text":"And one important thing to realize"},{"id":221,"text":"is that because of the Markov property,"},{"id":222,"text":"so because of the Markov property in the sense that,"},{"id":223,"text":"So this is Markov in a sense that every time you take an action,"},{"id":224,"text":"the transition, so where you transition"},{"id":225,"text":"to only depends on where you are at right now."},{"id":226,"text":"It doesn't depend on history."},{"id":227,"text":"It doesn't depend on anything else."},{"id":228,"text":"It only depends on the state you are at."},{"id":229,"text":"So if you choose action A1,"},{"id":230,"text":"the transition to S2 only depends on S1 and A1."},{"id":231,"text":"So in some sense,"},{"id":232,"text":"you don't have to remember the history with this Markov property."},{"id":233,"text":"And that means that"},{"id":234,"text":"the optimal action you make at this moment, it means two things. First thing it means that what will happens in the future will only depends on what is now and all the actions in the future. So if you add some state as t, then what happens as t plus one doesn't depend on anything before t. What happens as state as t plus j only depends on what happens between this time but nothing before. So there's no history dependency and as a result,"},{"id":235,"text":"the optimal action at time t only depends on st. Because everything happens before st is irrelevant."}],"notes":["本段主要讲解马尔可夫决策过程（MDP）中的状态空间和马尔可夫性质。首先指出状态空间可以是连续的，不一定是离散的，且可以是无限的。接着提到在MDP中，目标是最大化预期收益，这需要选择一系列最优动作。马尔可夫性质强调当前状态和动作决定了下一个状态，与历史无关，因此不需要记忆历史信息。","马尔可夫性质是MDP的核心概念，它意味着状态转移仅依赖于当前状态和当前动作，而不依赖于之前的状态或动作。这种性质简化了决策过程，使得在每个时间点只需要考虑当前状态，而不需要考虑历史信息。","在马尔可夫决策过程中，最优动作的选择仅依赖于当前状态，而不是之前的状态或动作。这是因为未来的状态转移仅依赖于当前状态和动作，因此历史信息对未来的决策没有影响。","马尔可夫性质使得在MDP中可以使用动态规划等方法进行最优策略的求解。由于状态转移仅依赖于当前状态，因此可以将问题分解为一系列子问题，每个子问题仅依赖于当前状态。","在实际应用中，马尔可夫性质允许模型忽略历史信息，从而简化计算。例如，在机器人导航问题中，机器人的下一步动作仅依赖于当前位置和当前动作，而不需要考虑之前的位置。","马尔可夫性质是构建强化学习算法的基础，它使得在复杂环境中可以有效地进行决策和优化。通过利用马尔可夫性质，可以设计出高效的策略来最大化长期回报。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1874.87,"end":2035.22,"asr_flags":[215],"raw_segments":[{"start":1874.87,"text":"like how far some of the velocities, you know, maybe like whether the motor is on, you know, and maybe just actually pretty easy. No, no, but you have continuous states, right? So, like, this set doesn't have to be, doesn't have to be discrete, right? So, like, it's just a scalar. In your state space, there's one dimension, which is a scalar, which is the height."},{"start":1905.55,"text":"And even if it's criticized, it doesn't have to be finite."},{"start":1910.11,"text":"The state space doesn't have to be finite."},{"start":1917.19,"text":"So after you have this MVP, the goal is just"},{"start":1922.73,"text":"to maximize the payoff."},{"start":1926.27,"text":"Maximize the expected payoff, which is defined here."},{"start":1933.93,"text":"here."},{"start":1935.21,"text":"So they'll expect a return."},{"start":1939.41,"text":"And how do you maximize the expected payoff?"},{"start":1941.85,"text":"You have to decide the right actions, the sequence"},{"start":1944.11,"text":"of actions to maximize the payoff."},{"start":1946.13,"text":"And one important thing to realize"},{"start":1948.25,"text":"is that because of the Markov property,"},{"start":1957.01,"text":"so because of the Markov property in the sense that,"},{"start":1961.07,"text":"So this is Markov in a sense that every time you take an action,"},{"start":1965.31,"text":"the transition, so where you transition"},{"start":1968.61,"text":"to only depends on where you are at right now."},{"start":1971.01,"text":"It doesn't depend on history."},{"start":1972.37,"text":"It doesn't depend on anything else."},{"start":1973.47,"text":"It only depends on the state you are at."},{"start":1976.27,"text":"So if you choose action A1,"},{"start":1978.23,"text":"the transition to S2 only depends on S1 and A1."},{"start":1981.91,"text":"So in some sense,"},{"start":1983.23,"text":"you don't have to remember the history with this Markov property."},{"start":1989.67,"text":"And that means that"},{"start":1991.1,"text":"the optimal action you make at this moment, it means two things. First thing it means that what will happens in the future will only depends on what is now and all the actions in the future. So if you add some state as t, then what happens as t plus one doesn't depend on anything before t. What happens as state as t plus j only depends on what happens between this time but nothing before. So there's no history dependency and as a result,"},{"start":2019.49,"text":"the optimal action at time t only depends on st. Because everything happens before st is irrelevant."}],"speech_gaps":[{"start":1914.16,"end":1916.144}],"frame":"../frames/v039/012.webp","frame_time":1886.87},{"title":"强化学习中的策略概念","segments":[{"id":236,"text":"the past is the past, whatever, how you arrive at ST doesn't really matter. As long as I'm at ST, I can ignore the past and the future doesn't depend on the past anymore. So that's why the optimal action only is a function of ST. So that's why you can define this notion called policy. This is a very special term, specific term in RL settings. So a policy means that a mapping from"},{"id":237,"text":"ST to AT, or maybe from S to T. Abstract speaking, I'm saying it's mapping from the set of the state to the set of action. So basically, you are saying that AT is a function of ST."},{"id":238,"text":"And this function is called policy."},{"id":239,"text":"And this is something you are looking for."},{"id":240,"text":"You're looking for what is the right policy"},{"id":241,"text":"for me to get the next AT."},{"id":242,"text":"So that's actually the only thing you care about"},{"id":243,"text":"when you try to achieve this goal."},{"id":244,"text":"So basically, to achieve this goal,"},{"id":245,"text":"you just have to understand"},{"id":246,"text":"what is the optimal action as a function of the state."},{"id":247,"text":"And this is called policy."},{"id":248,"text":"So for example, in this example,"},{"id":249,"text":"if there's no this kind of teleporting tunnel,"},{"id":250,"text":"then the optimal action probably just be that,"},{"id":251,"text":"if you're on the left-hand side of the goal state,"},{"id":252,"text":"you just try to go right,"},{"id":253,"text":"otherwise you go left."},{"id":254,"text":"So, that's the policy you should follow."},{"id":255,"text":"So, this is a deterministic policy."},{"id":256,"text":"Deterministic policy in a sense that for a fixed ST,"},{"id":257,"text":"you only output is a deterministic function, right?"},{"id":258,"text":"Given a state, you output a single action."},{"id":259,"text":"Actually, it's knowing that there's"},{"id":260,"text":"always a deterministic optimal policy."},{"id":261,"text":"The reason is actually very simple."},{"id":262,"text":"It's just because you take the optimal one."},{"id":263,"text":"If there's a tie, then you just pick any of them."},{"id":264,"text":"You make it deterministic and that's the optimal policy."},{"id":265,"text":"So, there's no reason to"},{"id":266,"text":"randomize because there's always one option that"},{"id":267,"text":"is better than all the others or as good as all the others."},{"id":268,"text":"So, the optimal policy is deterministic,"},{"id":269,"text":"or at least there exists one deterministic policy that is optimal."},{"id":270,"text":"However, in practice,"},{"id":271,"text":"people also talk about randomized policies."},{"id":272,"text":"So, randomized policy just means that"}],"notes":["本段讲解了强化学习（RL）中策略（policy）的基本概念。策略是状态到动作的映射，即给定当前状态，策略决定了采取的动作。策略可以是确定性的，也可以是随机的。确定性策略意味着对于每个状态，策略输出一个确定的动作，而随机策略则可能输出多个动作的概率分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2036.38,"end":2192.96,"asr_flags":[],"raw_segments":[{"start":2036.38,"text":"the past is the past, whatever, how you arrive at ST doesn't really matter. As long as I'm at ST, I can ignore the past and the future doesn't depend on the past anymore. So that's why the optimal action only is a function of ST. So that's why you can define this notion called policy. This is a very special term, specific term in RL settings. So a policy means that a mapping from"},{"start":2067.13,"text":"ST to AT, or maybe from S to T. Abstract speaking, I'm saying it's mapping from the set of the state to the set of action. So basically, you are saying that AT is a function of ST."},{"start":2086.24,"text":"And this function is called policy."},{"start":2088.64,"text":"And this is something you are looking for."},{"start":2090.26,"text":"You're looking for what is the right policy"},{"start":2092.48,"text":"for me to get the next AT."},{"start":2095.3,"text":"So that's actually the only thing you care about"},{"start":2097.2,"text":"when you try to achieve this goal."},{"start":2100.42,"text":"So basically, to achieve this goal,"},{"start":2102.18,"text":"you just have to understand"},{"start":2103.42,"text":"what is the optimal action as a function of the state."},{"start":2109.48,"text":"And this is called policy."},{"start":2111.24,"text":"So for example, in this example,"},{"start":2113.12,"text":"if there's no this kind of teleporting tunnel,"},{"start":2115.5,"text":"then the optimal action probably just be that,"},{"start":2117.78,"text":"if you're on the left-hand side of the goal state,"},{"start":2120.02,"text":"you just try to go right,"},{"start":2121.24,"text":"otherwise you go left."},{"start":2123.0,"text":"So, that's the policy you should follow."},{"start":2136.26,"text":"So, this is a deterministic policy."},{"start":2142.4,"text":"Deterministic policy in a sense that for a fixed ST,"},{"start":2147.84,"text":"you only output is a deterministic function, right?"},{"start":2150.88,"text":"Given a state, you output a single action."},{"start":2154.28,"text":"Actually, it's knowing that there's"},{"start":2156.36,"text":"always a deterministic optimal policy."},{"start":2158.86,"text":"The reason is actually very simple."},{"start":2160.82,"text":"It's just because you take the optimal one."},{"start":2165.82,"text":"If there's a tie, then you just pick any of them."},{"start":2168.62,"text":"You make it deterministic and that's the optimal policy."},{"start":2171.28,"text":"So, there's no reason to"},{"start":2174.26,"text":"randomize because there's always one option that"},{"start":2176.4,"text":"is better than all the others or as good as all the others."},{"start":2179.52,"text":"So, the optimal policy is deterministic,"},{"start":2182.52,"text":"or at least there exists one deterministic policy that is optimal."},{"start":2186.96,"text":"However, in practice,"},{"start":2188.48,"text":"people also talk about randomized policies."},{"start":2191.02,"text":"So, randomized policy just means that"}],"speech_gaps":[{"start":2127.28,"end":2129.52},{"start":2129.872,"end":2131.536},{"start":2139.824,"end":2141.52}],"frame":"../frames/v039/013.webp","frame_time":2048.38},{"title":"随机策略与确定性策略的比较","segments":[{"id":273,"text":"means that given a state S, and often the notation is like this. The often the notation is P of A given S. So basically, you're saying that given a state S, I need to generate distribution of actions. So a randomized policy in most cases is actually not as good as a deterministic one, but often in a training, you need to have some continuity in some sense. You need to model this."},{"id":274,"text":"this randomized policy with some new networks with some sampling procedures. So randomization is actually somewhat useful in a training process. Because let's say suppose you pick action."},{"id":275,"text":"Suppose your randomized policy is that you pick action 1 with probability 0.9 and pick action 2 with probability 0.1, let's say. That's your distribution of the actions, right? Action 1, 0.9 probability, action 2, 0.1 probability. And in this case, you can kind of prove that at least one of the action 1 or action 2 will be at least as good as your randomized policy."},{"id":276,"text":"So either action one or action two. So in some sense, there's no point of hedging in some sense. Does it make sense? You're in between the two options, yes. It's kind of like, let's say, suppose..."},{"id":277,"text":"action is one, this give you a payoff like maybe 1.0, and action two give you a payoff like maybe 2.0. If you're hedging between this, you are getting some reward between 1.0 and 2.0. But what you should have done is just taking action two. Exactly. You don't have to think about action one."},{"id":278,"text":"Fortunately, you do want to have some kind of sarcasm. There are so many reasons. So I think it depends on exactly which settings you want to use. But generally speaking, I think the fundamental thing is you want some kind of continuity in some sense. Because if it's really deterministic, often the case is that..."},{"id":279,"text":"you have a hard switch between action one and action two. It's not continuous. For some parameter, you are choosing action one. And then suddenly, you have to jump to action two if you update the parameter. Or you have to figure out how to jump to another action. But if it's kind of a probability distribution, then you have a continuous spectrum. So say, for example, at this moment, you are at 50-50. And then next time you update your parameter, you move to 40-60. And next time, you move to 30-70. So it's a more smooth dynamics."}],"notes":["本段讨论了随机策略与确定性策略的比较，指出在某些情况下随机策略可能不如确定性策略有效，但训练过程中需要一定的连续性。讲者提到，随机策略通过概率分布生成动作，而确定性策略则直接选择动作。","讲者通过一个例子说明，当随机策略选择动作1的概率为0.9，动作2的概率为0.1时，至少有一个动作的表现不会比随机策略差。这表明在某些情况下，随机策略的随机性可能并不必要。","讲者进一步指出，随机策略可以提供连续的动态变化，而确定性策略则可能导致突变。例如，参数变化时，确定性策略可能需要突然切换动作，而随机策略则可以平滑地过渡。","讲者提到，随机策略在训练过程中具有一定的优势，因为它可以提供连续性，避免突变带来的问题。然而，是否使用随机策略取决于具体的应用场景。","讲者强调了在策略设计中连续性的重要性，指出确定性策略可能导致不连续的切换，而随机策略则可以提供更平滑的动态变化。","讲者通过一个具体的例子说明了随机策略的连续性，即参数变化时，动作的概率分布可以平滑地从50-50过渡到40-60，再到30-70，从而避免了突变。"],"formulas":[],"uncertainties":["sarcasm"],"diagram":"none","start":2196.76,"end":2361.66,"asr_flags":[],"raw_segments":[{"start":2196.76,"text":"means that given a state S, and often the notation is like this. The often the notation is Pi of A given S. So basically, you're saying that given a state S, I need to generate distribution of actions. So a randomized policy in most cases is actually not as good as a deterministic one, but often in a training, you need to have some continuity in some sense. You need to model this."},{"start":2226.81,"text":"this randomized policy with some new networks with some sampling procedures. So randomization is actually somewhat useful in a training process. Because let's say suppose you pick action."},{"start":2245.8,"text":"Suppose your randomized policy is that you pick action 1 with probability 0.9 and pick action 2 with probability 0.1, let's say. That's your distribution of the actions, right? Action 1, 0.9 probability, action 2, 0.1 probability. And in this case, you can kind of prove that at least one of the action 1 or action 2 will be at least as good as your randomized policy."},{"start":2272.34,"text":"So either action one or action two. So in some sense, there's no point of hedging in some sense. Does it make sense? You're in between the two options, yes. It's kind of like, let's say, suppose..."},{"start":2292.65,"text":"action is one, this give you a payoff like maybe 1.0, and action two give you a payoff like maybe 2.0. If you're hedging between this, you are getting some reward between 1.0 and 2.0. But what you should have done is just taking action two. Exactly. You don't have to think about action one."},{"start":2315.76,"text":"Fortunately, you do want to have some kind of sarcasticity. There are so many reasons. So I think it depends on exactly which settings you want to use. But generally speaking, I think the fundamental thing is you want some kind of continuity in some sense. Because if it's really deterministic, often the case is that..."},{"start":2334.54,"text":"you have a hard switch between action one and action two. It's not continuous. For some parameter, you are choosing action one. And then suddenly, you have to jump to action two if you update the parameter. Or you have to figure out how to jump to another action. But if it's kind of a probability distribution, then you have a continuous spectrum. So say, for example, at this moment, you are at 50-50. And then next time you update your parameter, you move to 40-60. And next time, you move to 30-70. So it's a more smooth dynamics."}],"speech_gaps":[],"frame":"../frames/v039/014.webp","frame_time":2208.76},{"title":"价值函数与策略优化","segments":[{"id":280,"text":"And in some other cases, it's just like the policy has to be stochastic for some other reason, which we'll get into later. Cool. So let's see how, let me have a time check. Okay. So now, another important concept before we talk about the algorithm. So let me think about this, how much time I have. Okay. So I think the next concept is called the so-called value function."},{"id":281,"text":"So the value function is, in some sense, very similar to the return we talked about. But the value function is a function of the policy. So you can define the value function of a policy at state s as the expected total payoff starting from state s."},{"id":282,"text":"So sometimes it's not very different from the return, the total payoff. It's just that you are specifying where you are starting with and also which policy you are applying. So basically, this means that if you start with state s, you'll keep applying policy pi. What's your expected return? So mathematically, you just write this as the expected return."},{"id":283,"text":"Conditioned on this initial state is equal to S. Also, the randomness, how do you draw this random variable that S1 is drawn from PS0A0, and the action AT is drawn from policy Pi."},{"id":284,"text":"So that's why this is superscript pi here. So I'm describing what is the expected return for this policy starting from the state S. It's just a definition. And then you can also say, you can define a so-called V star of S. So this doesn't depend on policy. This is just the max over all the possible policy."},{"id":285,"text":"So basically you're asking what is the best policy"},{"id":286,"text":"so that I can get the maximum return."},{"id":287,"text":"So in some sense this is the goal"},{"id":288,"text":"that you are trying to solve."},{"id":289,"text":"So you are trying to find a policy such that"},{"id":290,"text":"you maximize the return."}],"notes":["本段讲解了价值函数的概念，它与回报相似，但价值函数是策略的函数。价值函数定义为从状态s出发，按照策略π执行时的期望总回报。讲者提到，价值函数的定义需要考虑初始状态和策略的随机性，例如状态转移和动作选择的随机性。","讲者进一步指出，价值函数的定义中，初始状态为S，状态转移和动作选择的随机性由策略π决定。因此，价值函数的定义中包含策略π的上标，以表示其依赖于特定策略。此外，讲者提到可以定义一个不依赖于策略的V星（V*）函数，它表示所有可能策略中的最大回报。","讲者强调，寻找最佳策略的目标是最大化回报。这表明，价值函数和策略优化是强化学习中的核心概念，价值函数用于评估策略的性能，而策略优化的目标是找到能够最大化回报的策略。","讲者提到，价值函数的定义需要考虑状态转移和动作选择的随机性，例如状态S1是从PS0A0中抽取的，动作AT是从策略π中抽取的。这表明，价值函数的计算涉及概率分布和期望值的计算。","讲者还提到，V星（V*）函数是所有可能策略中的最大回报，这表明在强化学习中，策略优化的目标是找到能够最大化期望回报的策略。这与价值函数的定义密切相关，因为价值函数评估的是特定策略的性能，而V星函数则代表最优策略的性能。","讲者最后指出，寻找最佳策略的目标是最大化回报，这表明在强化学习中，策略优化是核心问题，而价值函数是评估策略性能的重要工具。"],"formulas":[],"uncertainties":["PS0A0","AT"],"diagram":"none","start":2364.32,"end":2541.41,"asr_flags":[],"raw_segments":[{"start":2364.32,"text":"And in some other cases, it's just like the policy have to be stochastic for some other reason, which we'll get into later. Cool. So let's see how, let me have a time check. Okay. So now, another important concept before we talk about the algorithm. So let me think about this, how much time I have. Okay. So I think the next concept is called the so-called value function."},{"start":2413.77,"text":"So the value function is, in some sense, very similar to the return we talked about. But the value function is a function of the policy. So you can define the value function of a policy at state s as the expected total payoff starting from state s."},{"start":2449.42,"text":"So sometimes it's not very different from the return, the total payoff. It's just that you are specifying where you are starting with and also which policy you are applying. So basically, this means that if you start with state s, you'll keep applying policy pi. What's your expected return? So mathematically, you just write this as the expected return."},{"start":2475.16,"text":"conditioned on this initial state is equal to S. Also, the randomness, how do you draw this random variable that S1 is draw from PS0A0, and the action AT is drawn from policy Pi."},{"start":2497.36,"text":"So that's why this is superscript pi here. So I'm describing what is the expected return for this policy starting from the state S. It's just a definition. And then you can also say, you can define a so-called V star of S. So this doesn't depend on policy. This is just the max over all the possible policy."},{"start":2529.29,"text":"So basically you're asking what is the best policy"},{"start":2531.87,"text":"so that I can get the maximum return."},{"start":2534.83,"text":"So in some sense this is the goal"},{"start":2536.41,"text":"that you are trying to solve."},{"start":2538.13,"text":"So you are trying to find a policy such that"},{"start":2540.61,"text":"you maximize the return."}],"speech_gaps":[{"start":2527.072,"end":2528.89}],"frame":"../frames/v039/015.webp","frame_time":2376.32},{"title":"递归与贝尔曼方程","segments":[{"id":334,"text":"Then you can see this part is the same as v."},{"id":335,"text":"It has the same form as v, exactly."},{"id":336,"text":"So it's just equal to v. So then you get the so-called recursion,"},{"id":337,"text":"which means that you have a formula for v,"},{"id":338,"text":"where on the right-hand side also v is involved."},{"id":339,"text":"So I think that's fundamental what recursion mean."},{"id":340,"text":"So this is not telling you what v is exactly."},{"id":341,"text":"On the left-hand side you have v,"},{"id":342,"text":"but on the right-hand side you also have v."},{"id":343,"text":"But the nice thing is that once you have this, you can solve it."},{"id":344,"text":"You can solve the equation."},{"id":345,"text":"You solve it by say you move it to the left,"},{"id":346,"text":"you say v times one minus Gamma is one"},{"id":347,"text":"and then this implies v is equals to one minus Gamma"},{"id":348,"text":"Fundamentally, the Bellman equation is just exactly the same idea"},{"id":349,"text":"with more complex settings we are dealing with."},{"id":350,"text":"So let me give you one."},{"id":351,"text":"So let's derive the Bellman equation for v Pi."},{"id":352,"text":"pi."},{"id":353,"text":"So how do we compute v pi?"},{"id":354,"text":"Let's try to apply the same idea."},{"id":355,"text":"So v pi is what?"},{"id":356,"text":"v pi is equal to this thing, right?"},{"id":357,"text":"So maybe let me just, for the sake of kind of like clarity,"},{"id":358,"text":"let's rewrite it."},{"id":359,"text":"Let's copy it again."},{"id":360,"text":"So and here, I guess implicitly,"},{"id":361,"text":"the actions are drawn from the Pi as we discussed here, right?"},{"id":362,"text":"So then you try to take out the first term like that."},{"id":363,"text":"You see the first term is I0,"},{"id":364,"text":"which is actually deterministic because I0 is equal to S."},{"id":365,"text":"So actually, the first term is Vs."},{"id":366,"text":"Then you look at the rest of the terms."},{"id":367,"text":"There's a Gamma here as well,"},{"id":368,"text":"and maybe the t's term"},{"id":369,"text":"and you have many many other terms"},{"id":370,"text":"and you have many many other terms"},{"id":371,"text":"let's say you have infinite number of terms"},{"id":372,"text":"which makes these things a little bit simpler"},{"id":373,"text":"and then I take"},{"id":374,"text":"the first term and then I have"},{"id":375,"text":"the rest of them and I remove the gamma"},{"id":376,"text":"so I have gamma"},{"id":377,"text":"times expectation"},{"id":378,"text":"rs1"},{"id":379,"text":"plus blah blah blah"},{"id":380,"text":"times r"},{"id":381,"text":"rt to the gamma to the t minus 1 times rst, given what?"},{"id":382,"text":"Given S0 is equal to S. But you know that S0 is equal to S."},{"id":383,"text":"OK."},{"id":384,"text":"So and you see this one is really"},{"id":385,"text":"just the total expected payoff if you start with S1."},{"id":386,"text":"The only thing is that S1 is a little bit non-deterministic here."},{"id":387,"text":"You don't even know exactly,"},{"id":388,"text":"S1 is a random variable."},{"id":389,"text":"You're not 100% sure which one S1 is,"},{"id":390,"text":"but if you know what S1 is,"},{"id":391,"text":"then this is just the expected payoff in the future of S1,"},{"id":392,"text":"which is like a V-Pi S1, something like that."}],"notes":["本段讲解了递归的基本概念，即一个变量在等式两边同时出现，通过移项可以求解。这与贝尔曼方程的思想一致，即状态值函数可以表示为当前奖励加上未来期望奖励的加权和。","讲者通过将v表示为一个包含Gamma的表达式，展示了如何通过代数操作求解递归关系。这为后续推导贝尔曼方程奠定了基础。","在推导贝尔曼方程时，讲者提到v_pi的计算需要考虑动作的分布和状态转移的不确定性。这表明贝尔曼方程不仅适用于确定性环境，也适用于随机环境。","讲者通过将v_pi分解为初始奖励和未来期望奖励的组合，展示了贝尔曼方程的结构。其中，初始奖励是确定的，而未来奖励则依赖于状态转移的概率分布。","在处理无限项时，讲者指出可以通过将Gamma因子提取出来，将问题转化为一个期望值的计算。这体现了贝尔曼方程在处理无限时间序列时的 or of this algorithm just name it as that."},{"start":3422.39,"text":"You'll find that this algorithm actually doesn't really"},{"start":3425.55,"text":"necessarily require all the backgrounds we have discussed."},{"start":3428.79,"text":"discussed is actually much simpler in some sense."},{"start":3432.57,"text":"To some degree, from some dimension."},{"start":3435.93,"text":"That's probably why it's easier to apply to large-anglish model,"},{"start":3438.83,"text":"which is have other weird features"},{"start":3441.75,"text":"so that you can only allow some relatively simple algorithm."}],"speech_gaps":[{"start":3319.568,"end":3321.14},{"start":3419.44,"end":3421.296}],"frame":"../frames/v039/020.webp","frame_time":3279.23},{"title":"强化学习中的策略与回报定义","segments":[{"id":535,"text":"So the algorithm and also"},{"id":536,"text":"this algorithm only applies for stochastic policy."},{"id":537,"text":"As you can see that this algorithm"},{"id":538,"text":"just can only work for stochastic policy,"},{"id":539,"text":"Nope, nothing. Not a communistic one."},{"id":540,"text":"So here is the idea."},{"id":541,"text":"So first of all, you need to define a stochastic policy."},{"id":542,"text":"I'm already like a stochastic policy."},{"id":543,"text":"each of the logits, each of the probability for every a and s, you can evaluate density with the new network. The new network will give you a density for every a and s, but you may not be able to list the whole distribution because the a can be a continuous set. So the distribution of the number of actions might be infinite or the number of actions could be continuous, so on and so forth. But the minimum requirement is that this new network will give you the density for a given s."},{"id":544,"text":"So you have a way to sample from this density as well. So that's the two requirements for these algorithms to work. Then you can define this so-called return, which is basically you say you have the expected return, and here in this kind of exciting people often talk about finance steps, and you just say I have this discounted return."},{"id":545,"text":"And let's say I know the S0. So the S0 will come from some distribution on D0 and all the, so basically, so the S come from, of course, ST come from the transition dynamics. And the policy, the action come from your policy here. So the action, okay."},{"id":546,"text":"And let's say I know the S0. So the S0 will come from some distribution on D0 and all the, so basically, so the S come from, of course, ST come from the transition dynamics. And the policy, the action come from your policy here. So the action, okay."},{"id":547,"text":"So that's my definition of the return of this parameter, this policy. So every policy, I can evaluate the return. I'm using the letter eta as opposed to the value function here, just because in this literature, people use eta more often. And there's very minor differences, which is that here, your S0 is also randomized. The value function will make you fix the S in some sense. Your conditional S0 is equal to S. So that is the function of S. But here,"}],"notes":["本段主要讲解强化学习中策略的定义，特别是随机策略（stochastic policy）的构建。讲者提到需要定义一个随机策略，即通过参数化的方式（如Pi A theta A given S）来表示策略，其中Pi表示策略，A是动作，S是状态，theta是参数。这种策略通过神经网络来实现，网络会为每个状态和动作对提供一个密度函数，但可能无法列出完整的分布，因为动作可能是连续的。","讲者进一步说明了策略的定义需要满足两个条件：一是能够通过网络生成密度函数，二是能够从该密度函数中进行采样。这是算法能够工作的前提条件。此外，讲者提到在强化学习中，通常会定义一个回报（return），即期望回报，其中包含折扣因子（discounted return）的概念。","讲者还提到，状态S0的初始分布来自某个分布D0，而后续的状态ST则来自状态转移动态（transition dynamics）。动作则来自当前的策略。讲者强调，这里的S0是随机化的，与价值函数（value function）不同，后者通常固定状态S。","在定义回报时，讲者使用了eta（η）而不是价值函数，这是因为在相关文献中，eta更常被使用。此外，讲者指出，这里的S0是随机化的，而价值函数通常会固定状态S，因此两者在定义上存在细微差别。","讲者还提到，回报的定义涉及期望值的计算，其中包含折扣因子，这在强化学习中是一个核心概念。同时，讲者指出，状态转移动态和策略的结合决定了动作的生成过程。","最后，讲者提到，对于每个策略，都可以计算其回报，这是评估策略性能的重要指标。通过这种方式，可以比较不同策略的优劣，并选择最优策略。"],"formulas":[],"uncertainties":["new right work","the new right work that will give you this probability distribution"],"diagram":"none","start":3445.67,"end":3617.43,"asr_  course, ST come from the transition dynamics. And the policy, the action come from your policy here. So the action, okay."},{"start":3591.31,"text":"So that's my definition of the return of this parameter, this policy. So every policy, I can evaluate the return. I'm using the letter eta as opposed to the value function here, just because in this literature, people use eta more often. And there's very minor differences, which is that here, your S0 is also randomized. The value function will make you fix the S in some sense. Your conditional S0 is equal to S. So that is the function of S. But here,"}],"speech_gaps":[],"frame":"../frames/v039/021.webp","frame_time":3457.67},{"title":"梯度计算与依赖关系","segments":[{"id":548,"text":"The initial state is also randomized. I assume I already know the initial distribution, and I'm only looking at the dependency on theta, on the parameter theta. So basically, this is what I'm trying to maximize. I'm trying to find the parameter theta, such that my expected return under this policy pi theta is maximized. And my approach is actually very simple. My approach is just trying to take gradient of this eta and take gradient sense. So that's the fundamental approach."},{"id":549,"text":"But it involves some details here. Why? The fundamental reason is that, if you want to take gradient sense, think about this. Or maybe, I mean, that's the question. Oh, sorry, sorry. This is, sorry, my bad. Yeah, sorry, sorry. Yeah, yeah. Like I was, yeah. Okay, thanks. Okay, so how do you take gradient of this? If you think about it, so this,"},{"id":550,"text":"Where does theta come from? How do you take radii? So the theta is not even showing up in this what's inside expectation. There's no theta. The r is known. Gamma is known. St is your sampling of what you sampled. So in some sense, the dependence on theta comes from what is the distribution you are sampling from, but not from what's inside expectation. So this is very different from some of the other cases where you have a function theta."},{"id":551,"text":"Then you have some other things maybe you say, suppose you have something like this times w, and then you take expectation over w, and w is from Gaussian I say. So this case is very different from this case because here the dependency, maybe let's even have a more general case. Suppose you have a w from Gaussian, and your function f which is,"},{"id":552,"text":"a function of Theta and W."},{"id":553,"text":"This whole thing is a function of Theta"},{"id":554,"text":"because W is averaged out."},{"id":555,"text":"So this whole thing,"},{"id":556,"text":"let's say, is called F Theta."},{"id":557,"text":"Taking gradient of this is very easy because you just move the,"},{"id":558,"text":"suppose you have a gradient knob block here,"},{"id":559,"text":"you just move knob block inside and that's your done."},{"id":560,"text":"Because this expectation is over a fixed random thing,"},{"id":561,"text":"you can just move it inside."},{"id":562,"text":"But here you cannot do that because if you add"},{"id":563,"text":"the knob block here,"},{"id":564,"text":"then if you move the knob block inside,"},{"id":565,"text":"this thing actually has no gradient. There's no even"},{"id":566,"text":"dependency on theta. All the dependencies"},{"id":567,"text":"come from what's in the sampling procedure."},{"id":568,"text":"So that's pretty much"},{"id":569,"text":"the whole thing we have to deal with."},{"id":570,"text":"So how do you take gradient when"},{"id":571,"text":"the"},{"id":572,"text":"theta comes from the sampling part?"},{"id":573,"text":"So"},{"id":574,"text":"let's"},{"id":575,"text":"try to abstract this question a little bit"}],"notes":["本段讨论了在梯度计算中，参数θ的依赖关系。讲者指出，θ并不直接出现在期望值内部，而是通过采样过程中的分布来体现。因此，梯度计算需要考虑θ如何影响采样过程，而不是直接作用于期望值内部的表达式。"],"formulas":[],"uncertainties":["radii","knob block"],"diagram":"none","start":3618.24,"end":3796.8,"asr_flags":[],"raw_segments":[{"start":3618.24,"text":"The initial state is also randomized. I assume I already know the initial distribution, and I'm only looking at the dependency on theta, on the parameter theta. So basically, this is what I'm trying to maximize. I'm trying to find the parameter theta, such that my expected return under this policy pi theta is maximized. And my approach is actually very simple. My approach is just trying to take gradient of this eta and take gradient sense. So that's the fundamental approach."},{"start":3651.16,"text":"But it involves some details here. Why? The fundamental reason is that, if you want to take gradient sense, think about this. Or maybe, I mean, that's the question. Oh, sorry, sorry. This is, sorry, my bad. Yeah, sorry, sorry. Yeah, yeah. Like I was, yeah. Okay, thanks. Okay, so how do you take gradient of this? If you think about it, so this,"},{"start":3686.48,"text":"Where does theta come from? How do you take radii? So the theta is not even showing up in this what's inside expectation. There's no theta. The r is known. Gamma is known. St is your sampling of what you sampled. So in some sense, the dependence on theta comes from what is the distribution you are sampling from, but not from what's inside expectation. So this is very different from some of the other cases where you have a function theta."},{"start":3715.15,"text":"Then you have some other things maybe you say, suppose you have something like this times w, and then you take expectation over w, and w is from Gaussian I say. So this case is very different from this case because here the dependency, maybe let's even have a more general case. Suppose you have a w from Gaussian, and your function f which is,"},{"start":3741.98,"text":"a function of Theta and W."},{"start":3743.98,"text":"This whole thing is a function of Theta"},{"start":3745.62,"text":"because W is averaged out."},{"start":3748.28,"text":"So this whole thing,"},{"start":3749.6,"text":"let's say, is called F Theta."},{"start":3752.62,"text":"Taking gradient of this i ext":"in some sense."},{"id":587,"text":"So f is the reward function."},{"id":588,"text":"function."},{"id":589,"text":"So f of the trajectory is, in some sense,"},{"id":590,"text":"the sum of the rewards."},{"id":591,"text":"So that's the map structure."},{"id":592,"text":"But I want to deal with a simpler setting first."},{"id":593,"text":"So how do you take the gradient here? So eventually, the way is like this. So you first try to make the theta, depending on theta, more explicit. You say, let me try to integrate this. So what does this really mean? This means that expectation of this really means I integrate the probability, multiplied probability times the value, and I integrate over x."},{"id":594,"text":"And now, when you write this way, then you can swap the gradient with the integration, because this integration doesn't depend on anything about theta. The integration is with respect to the very, very usual integration. So then you can just say this is integration of gradient of theta applied to p theta x fx dx. And then you say fx doesn't depend on theta."},{"id":595,"text":"So this is really just the integration of nabla p theta x times fx times dx. And in some sense, this is kind of like an OK formula. The problem is that if this is the formula we are dealing with, how do we integrate x?"}],"notes":["本段讨论了如何对涉及期望的梯度进行处理，强调了期望内部的表达式不依赖于参数θ，但采样过程依赖于θ。这为后续的梯度交换提供了理论基础。","讲者提到，当期望表达式被写成积分形式时，可以将梯度与积分交换，前提是积分不依赖于θ。这种交换是可能的，因为积分是关于x的常规积分。","讲者进一步指出，积分后的表达式可以简化为对概率密度函数的梯度与奖励函数的乘积进行积分，这为后续的计算提供了结构。","然而，讲者也指出，这种形式的积分在实际操作中可能面临困难，特别是如何对x进行积分的问题，这可能需要进一步的数学工具或近似方法。","讲者通过将问题抽象为轨迹和奖励函数的映射，强调了梯度计算与期望结构之间的关系，这为后续的算法设计提供了理论支持。","整个段落围绕梯度与期望的交换展开，强调了数学结构的清晰性，以及在实际应用中可能遇到的挑战。"],"formulas":[{"latex":"E_{x \thicksim p_\\theta}[f(x)] = \\int p_\\theta(x) f(x) dx","symbols":"期望的积分形式","explanation":"保持原公式，使用标准积分符号代替文本描述，符合数学表达规范。","evidence":"So how do you take the gradient here? So eventually, the way is like this. So you first try to make the theta, depending on theta, mor
