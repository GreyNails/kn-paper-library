,"diagram":"none","start":1698.13,"end":1873.46,"asr_flags":[202,203,204,205,206,207],"math_clarifications":["原始片段中提到的总回报上界为 $ M / (1 - \\\backslash gamma) $，但公式中错误地使用了求和表达式 $ \\\backslash sum_{t=0}^\\infty \\\backslash gamma^t M $。正确的表达式应为 $ M / (1 - \\\backslash gamma) $，因为这是一个几何级数求和的结果，而不是对 $ \\\backslash gamma^t M $ 的直接求和。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":false,"translated_segments":24,"raw_segments":[{"start":1698.13,"text":"let's say is bounded by some constraint M, then the total payoff is bounded by M over one minus Gamma in absolute value. So this is just because if you take the sum of all of this, so this is just a very simple math which is like one plus Gamma. The first time you get at most M,"},{"start":1725.18,"text":"the second time you get at most Gamma times M,"},{"start":1727.08,"text":"and then Gamma squared times M, all of this way."},{"start":1729.7,"text":"This whole thing is less than M over one minus Gamma."},{"start":1733.36,"text":"So this way, you can more effectively talk about infinite number of steps,"},{"start":1737.98,"text":"which is not that common anymore,"},{"start":1743.02,"text":"but if you want to do this in some of the settings,"},{"start":1747.16,"text":"you do care about steps being a variable that can be possibly infinite."},{"start":1750.78,"text":"infinite. And also, as you can see,"},{"start":1755.02,"text":"like the discount factor encourage you to get the reward earlier,"},{"start":1758.08,"text":"which is sometimes useful."},{"start":1759.4,"text":"For example, if you want to reach this cup here,"},{"start":1764.4,"text":"you do probably want the robots to find"},{"start":1767.2,"text":"the shortest path to reach the cup as opposed to"},{"start":1770.06,"text":"spending like a year to reach the cup or something like that."},{"start":1773.0,"text":"Anyway, so these are just some variants here."},{"start":1778.32,"text":"So once you have all of this, you've got a so-called MDP."},{"start":1783.48,"text":"So the MDP is pretty much a top of all of this,"},{"start":1790.12,"text":"the state set, the action set, the transition dynamics,"},{"start":1794.42,"text":"the reward function, and the discount factor."},{"start":1798.58,"text":"So this describes the MDP."},{"start":1802.56,"text":"Okay."},{"start":1803.12,"text":"Okay, so."},{"start":1804.88,"text":"."},{"start":1812.7,"text":"Yes."},{"start":1814.24,"text":"."},{"start":1818.14,"text":"Yes."},{"start":1819.06,"text":"."},{"start":1821.42,"text":"Yeah, I guess I wouldn't use the word rules, but I think I understand what you mean. It's a probabilistic discussion, right? Probabilistic discussion. Not really, right? So I don't think, you know, in theory, yes, but at least for Jones, it's actually very easy. The state space is probably just, maybe you just need to, you know, depending on what you, you know, depending on what environment you are flying in, so you can just say the height,"}],"speech_gaps":[{"start":1806.224,"end":1807.824}],"frame":"../frames/v039/011.webp","frame_time":1710.13},{"title":"马尔可夫决策过程与状态空间","segments":[{"id":209,"text":"like how far some of the velocities, you know, maybe like whether the motor is on, you know, and maybe just actually pretty easy. No, no, but you have continuous states, right? So, like, this set doesn't have to be, doesn't have to be discrete, right? So, like, it's just a scalar. In your state space, there's one dimension, which is a scalar, which is the height.","zh":"比如，像一些速度有多远，你知道的，也许像电机是否开启，你知道的，也许实际上就非常容易。不，不，但你有连续的状态，对吧？所以，像，这个集合不必是，不必是离散的，对吧？所以，像，它只是一个标量。在你的状态空间中，有一个维度，它是一个标量，也就是高度。","start":1874.87,"end":1902.72},{"id":210,"text":"And even if it's criticized, it doesn't have to be finite.","zh":"即使它受到批评，也不必是有限的。","start":1905.55,"end":1908.69},{"id":211,"text":"The state space doesn't have to be finite.","zh":"状态空间不必是有限的。","start":1910.11,"end":1911.29},{"id":212,"text":"So after you have this MVP, the goal is just","zh":"所以在你有了这个最小可行产品之后，目标只是","start":1917.19,"end":1922.73},{"id":213,"text":"to maximize the payoff.","zh":"最大化回报。","start":1922.73,"end":1923.67},{"id":214,"text":"Maximize the expected payoff, which is defined here.","zh":"最大化预期回报，它在这里被定义。","start":1926.27,"end":1933.93},{"id":215,"text":"here.","zh":"在这里。","start":1933.93,"end":1934.01},{"id":216,"text":"So they'll expect a return.","zh":"所以他们会期望一个回报。","start":1935.21,"end":1936.67},{"id":217,"text":"And how do you maximize the expected payoff?","zh":"那么你如何最大化预期收益？","start":1939.41,"end":1941.61},{"id":218,"text":"You have to decide the right actions, the sequence","zh":"你必须决定正确的动作，动作序列","start":1941.85,"end":1944.11},{"id":219,"text":"of actions to maximize the payoff.","zh":"以最大化收益。","start":1944.11,"end":1945.35},{"id":220,"text":"And one important thing to realize","zh":"有一个重要的事情需要认识到","start":1946.13,"end":1948.25},{"id":221,"text":"is that because of the Markov property,","zh":"即由于马尔可夫性质，","start":1948.25,"end":1950.45},{"id":222,"text":"so because of the Markov property in the sense that,","zh":"即由于马尔可夫性质意味着，","start":1957.01,"end":1959.67},{"id":223,"text":"So this is Markov in a sense that every time you take an action,","zh":"因此，这是马尔可夫性质的一种体现，即每次你采取一个动作，","start":1961.07,"end":1965.17},{"id":224,"text":"the transition, so where you transition","zh":"转移，即你转移到哪里","start":1965.31,"end":1968.61},{"id":225,"text":"to only depends on where you are at right now.","zh":"它只取决于你现在所处的位置。","start":1968.61,"end":1970.79},{"id":226,"text":"It doesn't depend on history.","zh":"它不依赖于历史。","start":1971.01,"end":1972.15},{"id":227,"text":"It doesn't depend on anything else.","zh":"它不依赖于任何其他东西。","start":1972.37,"end":1973.31},{"id":228,"text":"It only depends on the state you are at.","zh":"它只取决于你所处的状态。","start":1973.47,"end":1976.19},{"id":229,"text":"So if you choose action A1,","zh":"因此，如果你选择动作A1，","start":1976.27,"end":1978.03},{"id":230,"text":"the transition to S2 only depends on S1 and A1.","zh":"转移到S2只取决于S1和A1。","start":1978.23,"end":1981.19},{"id":231,"text":"So in some sense,","zh":"所以从某种意义上说，","start":1981.91,"end":1983.15},{"id":232,"text":"you don't have to remember the history with this Markov property.","zh":"你不需要用这个马尔可夫性质来记住历史。","start":1983.23,"end":1988.93},{"id":233,"text":"And that means that","zh":"这意味着","start":1989.67,"end":1990.39},{"id":234,"text":"the optimal action you make at this moment, it means two things. First thing it means that what will happens in the future will only depends on what is now and all the actions in the future. So if you add some state as t, then what happens as t plus one doesn't depend on anything before t. What happens as state as t plus j only depends on what happens between this time but nothing before. So there's no history dependency and as a result,","zh":"你在当前时刻采取的最优动作意味着两件事。第一，这意味着未来发生的事情只取决于现在以及未来的动作。因此，如果你引入一个状态t，那么在t+1时刻发生的事情不依赖于t时刻之前的内容。在状态t+j时刻发生的事情只取决于这段时间内发生的事情，而与之前的内容无关。因此，没有历史依赖性，结果是,","start":1991.1,"end":2018.76},{"id":235,"text":"the optimal action at time t only depends on st. Because everything happens before st is irrelevant.","zh":"在时间t时刻的最优动作只依赖于状态st。因为所有发生在st之前的事情都是无关的。","start":2019.49,"end":2035.22}],"notes":["本段主要讲解马尔可夫决策过程（MDP）中的状态空间和马尔可夫性质。首先指出状态空间可以是连续的，不一定是离散的，且可以是无限的。接着提到在MDP中，目标是最大化预期收益，这需要选择一系列最优动作。马尔可夫性质强调当前状态和动作决定了下一个状态，与历史无关，因此不需要记忆历史信息。","马尔可夫性质是MDP的核心概念，它意味着状态转移仅依赖于当前状态和当前动作，而不依赖于之前的状态或动作。这种性质简化了决策过程，使得在每个时间点只需要考虑当前状态，而不需要考虑历史信息。","在马尔可夫决策过程中，最优动作的选择仅依赖于当前状态，而不是之前的状态或动作。这是因为未来的状态转移仅依赖于当前状态和动作，因此历史信息对未来的决策没有影响。","马尔可夫性质使得在MDP中可以使用动态规划等方法进行最优策略的求解。由于状态转移仅依赖于当前状态，因此可以将问题分解为一系列子问题，每个子问题仅依赖于当前状态。","在实际应用中，马尔可夫性质允许模型忽略历史信息，从而简化计算。例如，在机器人导航问题中，机器人的下一步动作仅依赖于当前位置和当前动作，而不需要考虑之前的位置。","马尔可夫性质是构建强化学习算法的基础，它使得在复杂环境中可以有效地进行决策和优化。通过利用马尔可夫性质，可以设计出高效的策略来最大化长期回报。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1874.87,"end":2035.22,"asr_flags":[215],"boards":[],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":1874.87,"text":"like how far some of the velocities, you know, maybe like whether the motor is on, you know, and maybe just actually pretty easy. No, no, but you have continuous states, right? So, like, this set doesn't have to be, doesn't have to be discrete, right? So, like, it's just a scalar. In your state space, there's one dimension, which is a scalar, which is the height."},{"start":1905.55,"text":"And even if it's criticized, it doesn't have to be finite."},{"start":1910.11,"text":"The state space doesn't have to be finite."},{"start":1917.19,"text":"So after you have this MVP, the goal is just"},{"start":1922.73,"text":"to maximize the payoff."},{"start":1926.27,"text":"Maximize the expected payoff, which is defined here."},{"start":1933.93,"text":"here."},{"start":1935.21,"text":"So they'll expect a return."},{"start":1939.41,"text":"And how do you maximize the expected payoff?"},{"start":1941.85,"text":"You have to decide the right actions, the sequence"},{"start":1944.11,"text":"of actions to maximize the payoff."},{"start":1946.13,"text":"And one important thing to realize"},{"start":1948.25,"text":"is that because of the Markov property,"},{"start":1957.01,"text":"so because of the Markov property in the sense that,"},{"start":1961.07,"text":"So this is Markov in a sense that every time you take an action,"},{"start":1965.31,"text":"the transition, so where you transition"},{"start":1968.61,"text":"to only depends on where you are at right now."},{"start":1971.01,"text":"It doesn't depend on history."},{"start":1972.37,"text":"It doesn't depend on anything else."},{"start":1973.47,"text":"It only depends on the state you are at."},{"start":1976.27,"text":"So if you choose action A1,"},{"start":1978.23,"text":"the transition to S2 only depends on S1 and A1."},{"start":1981.91,"text":"So in some sense,"},{"start":1983.23,"text":"you don't have to remember the history with this Markov property."},{"start":1989.67,"text":"And that means that"},{"start":1991.1,"text":"the optimal action you make at this moment, it means two things. First thing it means that what will happens in the future will only depends on what is now and all the actions in the future. So if you add some state as t, then what happens as t plus one doesn't depend on anything before t. What happens as state as t plus j only depends on what happens between this time but nothing before. So there's no history dependency and as a result,"},{"start":2019.49,"text":"the optimal action at time t only depends on st. Because everything happens before st is irrelevant."}],"speech_gaps":[{"start":1914.16,"end":1916.144}],"frame":"../frames/v039/012.webp","frame_time":1886.87},{"title":"强化学习中的策略概念","segments":[{"id":236,"text":"the past is the past, whatever, how you arrive at ST doesn't really matter. As long as I'm at ST, I can ignore the past and the future doesn't depend on the past anymore. So that's why the optimal action only is a function of ST. So that's why you can define this notion called policy. This is a very special term, specific term in RL settings. So a policy means that a mapping from","zh":"过去已经过去了，不管怎样，你如何到达ST并不重要。只要我处于ST，就可以忽略过去，未来也不再依赖于过去。这就是为什么最优动作仅仅是ST的函数。这就是为什么你可以定义这样一个概念叫做策略。这是一个在强化学习设置中非常特殊的术语。所以策略意味着从","start":2036.38,"end":2063.97},{"id":237,"text":"ST to AT, or maybe from S to T. Abstract speaking, I'm saying it's mapping from the set of the state to the set of action. So basically, you are saying that AT is a function of ST.","zh":"ST到AT，或者也许从S到T。抽象地说，我是在说它是从状态集合到动作集合的映射。所以基本上，你是在说AT是ST的函数。","start":2067.13,"end":2085.53},{"id":238,"text":"And this function is called policy.","zh":"这个函数被称为策略。","start":2086.24,"end":2088.22},{"id":239,"text":"And this is something you are looking for.","zh":"这就是你所寻找的东西。","start":2088.64,"end":2090.22},{"id":240,"text":"You're looking for what is the right policy","zh":"你正在寻找的是什么是我能得到下一个AT的正确策略。","start":2090.26,"end":2092.48},{"id":241,"text":"for me to get the next AT.","zh":"这就是当你试图实现这个目标时唯一需要关注的事情。","start":2092.48,"end":2094.32},{"id":242,"text":"So that's actually the only thing you care about","zh":"这就是当你试图实现这个目标时唯一需要关注的事情。","start":2095.3,"end":2097.2},{"id":243,"text":"when you try to achieve this goal.","zh":"当你试图实现这个目标时。","start":2097.2,"end":2099.84},{"id":244,"text":"So basically, to achieve this goal,","zh":"所以基本上，要实现这个目标，","start":2100.42,"end":2102.14},{"id":245,"text":"you just have to understand","zh":"你只需要理解","start":2102.18,"end":2102.94},{"id":246,"text":"what is the optimal action as a function of the state.","zh":"在状态函数下的最优动作是什么。","start":2103.42,"end":2107.42},{"id":247,"text":"And this is called policy.","zh":"而这被称为策略。","start":2109.48,"end":2110.84},{"id":248,"text":"So for example, in this example,","zh":"例如，在这个例子中，","start":2111.24,"end":2112.92},{"id":249,"text":"if there's no this kind of teleporting tunnel,","zh":"如果没有这种传送隧道的话，","start":2113.12,"end":2115.5},{"id":250,"text":"then the optimal action probably just be that,","zh":"那么最优动作可能只是这样，","start":2115.5,"end":2117.62},{"id":251,"text":"if you're on the left-hand side of the goal state,","zh":"如果你处于目标状态的左侧，","start":2117.78,"end":2119.76},{"id":252,"text":"you just try to go right,","zh":"你只是尝试向右走，","start":2120.02,"end":2120.98},{"id":253,"text":"otherwise you go left.","zh":"否则你就向左走。","start":2121.24,"end":2122.72},{"id":254,"text":"So, that's the policy you should follow.","zh":"因此，这就是你应该遵循的策略。","start":2123.0,"end":2125.9},{"id":255,"text":"So, this is a deterministic policy.","zh":"因此，这是一个确定性策略。","start":2136.26,"end":2138.34},{"id":256,"text":"Deterministic policy in a sense that for a fixed ST,","zh":"确定性策略的意思是，对于一个固定的环境状态 ST，","start":2142.4,"end":2147.62},{"id":257,"text":"you only output is a deterministic function, right?","zh":"你的输出只是一个确定性函数，对吧？","start":2147.84,"end":2150.74},{"id":258,"text":"Given a state, you output a single action.","zh":"给定一个状态，你输出一个单一的动作。","start":2150.88,"end":2152.82},{"id":259,"text":"Actually, it's knowing that there's","zh":"实际上，你知道存在","start":2154.28,"end":2156.36},{"id":260,"text":"always a deterministic optimal policy.","zh":"总是存在一个确定性的最优策略。","start":2156.36,"end":2158.28},{"id":261,"text":"The reason is actually very simple.","zh":"原因其实非常简单。","start":2158.86,"end":2160.58},{"id":262,"text":"It's just because you take the optimal one.","zh":"只是因为你选择了最优的那个。","start":2160.82,"end":2165.82},{"id":263,"text":"If there's a tie, then you just pick any of them.","zh":"如果有平局的情况，你只需要从中任选一个即可。","start":2165.82,"end":2168.48},{"id":264,"text":"You make it deterministic and that's the optimal policy.","zh":"你将其设为确定性，这就是最优策略。","start":2168.62,"end":2171.12},{"id":265,"text":"So, there's no reason to","zh":"因此，","start":2171.28,"end":2172.94},{"id":266,"text":"randomize because there's always one option that","zh":"没有必要随机化，因为总有一个选项","start":2174.26,"end":2176.4},{"id":267,"text":"is better than all the others or as good as all the others.","zh":"比所有其他选项更好或至少和所有其他选项一样好。","start":2176.4,"end":2179.28},{"id":268,"text":"So, the optimal policy is deterministic,","zh":"因此，最优策略是确定性的，","start":2179.52,"end":2182.52},{"id":269,"text":"or at least there exists one deterministic policy that is optimal.","zh":"或者至少存在一个确定性的最优策略。","start":2182.52,"end":2185.26},{"id":270,"text":"However, in practice,","zh":"然而，在实践中，","start":2186.96,"end":2188.4},{"id":271,"text":"people also talk about randomized policies.","zh":"人们也会讨论随机策略。","start":2188.48,"end":2190.52},{"id":272,"text":"So, randomized policy just means that","zh":"因此，随机策略仅仅意味着","start":2191.02,"end":2192.96}],"notes":["本段讲解了强化学习（RL）中策略（policy）的基本概念。策略是状态到动作的映射，即给定当前状态，策略决定了采取的动作。策略可以是确定性的，也可以是随机的。确定性策略意味着对于每个状态，策略输出一个确定的动作，而随机策略则可能输出多个动作的概率分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2036.38,"end":2192.96,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":37,"raw_segments":[{"start":2036.38,"text":"the past is the past, whatever, how you arrive at ST doesn't really matter. As long as I'm at ST, I can ignore the past and the future doesn't depend on the past anymore. So that's why the optimal action only is a function of ST. So that's why you can define this notion called policy. This is a very special term, specific term in RL settings. So a policy means that a mapping from"},{"start":2067.13,"text":"ST to AT, or maybe from S to T. Abstract speaking, I'm saying it's mapping from the set of the state to the set of action. So basically, you are saying that AT is a function of ST."},{"start":2086.24,"text":"And this function is called policy."},{"start":2088.64,"text":"And this is something you are looking for."},{"start":2090.26,"text":"You're looking for what is the right policy"},{"start":2092.48,"text":"for me to get the next AT."},{"start":2095.3,"text":"So that's actually the only thing you care about"},{"start":2097.2,"text":"when you try to achieve this goal."},{"start":2100.42,"text":"So basically, to achieve this goal,"},{"start":2102.18,"text":"you just have to understand"},{"start":2103.42,"text":"what is the optimal action as a function of the state."},{"start":2109.48,"text":"And this is called policy."},{"start":2111.24,"text":"So for example, in this example,"},{"start":2113.12,"text":"if there's no this kind of teleporting tunnel,"},{"start":2115.5,"text":"then the optimal action probably just be that,"},{"start":2117.78,"text":"if you're on the left-hand side of the goal state,"},{"start":2120.02,"text":"you just try to go right,"},{"start":2121.24,"text":"otherwise you go left."},{"start":2123.0,"text":"So, that's the policy you should follow."},{"start":2136.26,"text":"So, this is a deterministic policy."},{"start":2142.4,"text":"Deterministic policy in a sense that for a fixed ST,"},{"start":2147.84,"text":"you only output is a deterministic function, right?"},{"start":2150.88,"text":"Given a state, you output a single action."},{"start":2154.28,"text":"Actually, it's knowing that there's"},{"start":2156.36,"text":"always a deterministic optimal policy."},{"start":2158.86,"text":"The reason is actually very simple."},{"start":2160.82,"text":"It's just because you take the optimal one."},{"start":2165.82,"text":"If there's a tie, then you just pick any of them."},{"start":2168.62,"text":"You make it deterministic and that's the optimal policy."},{"start":2171.28,"text":"So, there's no reason to"},{"start":2174.26,"text":"randomize because there's always one option that"},{"start":2176.4,"text":"is better than all the others or as good as all the others."},{"start":2179.52,"text":"So, the optimal policy is deterministic,"},{"start":2182.52,"text":"or at least there exists one deterministic policy that is optimal."},{"start":2186.96,"text":"However, in practice,"},{"start":2188.48,"text":"people also talk about randomized policies."},{"start":2191.02,"text":"So, randomized policy just means that"}],"speech_gaps":[{"start":2127.28,"end":2129.52},{"start":2129.872,"end":2131.536},{"start":2139.824,"end":2141.52}],"frame":"../frames/v039/013.webp","frame_time":2048.38},{"title":"随机策略与确定性策略的比较","segments":[{"id":273,"text":"means that given a state S, and often the notation is like this. The often the notation is P of A given S. So basically, you're saying that given a state S, I need to generate distribution of actions. So a randomized policy in most cases is actually not as good as a deterministic one, but often in a training, you need to have some continuity in some sense. You need to model this.","zh":"这意味着给定一个状态 S，通常记号是这样的。通常记号是 P(A|S)。基本上，你是在说，给定一个状态 S，你需要生成动作的分布。因此，在大多数情况下，随机策略实际上并不如确定性策略好，但在训练过程中，你通常需要在某种意义上保持连续性。你需要建模这一点。","start":2196.76,"end":2225.82},{"id":274,"text":"this randomized policy with some new networks with some sampling procedures. So randomization is actually somewhat useful in a training process. Because let's say suppose you pick action.","zh":"这种随机策略结合了一些新的网络和一些采样过程。因此，随机化在训练过程中实际上是有用的。例如，假设你选择动作。","start":2226.81,"end":2244.67},{"id":275,"text":"Suppose your randomized policy is that you pick action 1 with probability 0.9 and pick action 2 with probability 0.1, let's say. That's your distribution of the actions, right? Action 1, 0.9 probability, action 2, 0.1 probability. And in this case, you can kind of prove that at least one of the action 1 or action 2 will be at least as good as your randomized policy.","zh":"假设你的随机策略是：以 0.9 的概率选择动作 1，以 0.1 的概率选择动作 2。这就是你的动作分布，对吧？动作 1 的概率是 0.9，动作 2 的概率是 0.1。在这种情况下，你可以证明至少有一个动作（动作 1 或动作 2）至少和你的随机策略一样好。","start":2245.8,"end":2270.76},{"id":276,"text":"So either action one or action two. So in some sense, there's no point of hedging in some sense. Does it make sense? You're in between the two options, yes. It's kind of like, let's say, suppose...","zh":"所以要么是动作 1，要么是动作 2。从某种意义上说，这种在两者之间犹豫是没有意义的。这有意义吗？你在两个选项之间，是的。这有点像，比如说，","start":2272.34,"end":2291.96},{"id":277,"text":"action is one, this give you a payoff like maybe 1.0, and action two give you a payoff like maybe 2.0. If you're hedging between this, you are getting some reward between 1.0 and 2.0. But what you should have done is just taking action two. Exactly. You don't have to think about action one.","zh":"动作是 1，这会给你一个收益，比如可能是 1.0，而动作 2 会给你一个收益，比如可能是 2.0。如果你在两者之间犹豫，你会得到介于 1.0 和 2.0 之间的奖励。但你应该做的就是选择动作 2。没错。你不需要考虑动作 1。","start":2292.65,"end":2312.91},{"id":278,"text":"Fortunately, you do want to have some kind of sarcasm. There are so many reasons. So I think it depends on exactly which settings you want to use. But generally speaking, I think the fundamental thing is you want some kind of continuity in some sense. Because if it's really deterministic, often the case is that...","zh":"幸运的是，你确实想要一些随机性。有很多原因。我认为这取决于你具体想用的设置。但总的来说，我认为根本的一点是你想要某种意义上的连续性。因为如果它是完全确定性的，通常的情况是……","start":2315.76,"end":2333.82},{"id":279,"text":"you have a hard switch between action one and action two. It's not continuous. For some parameter, you are choosing action one. And then suddenly, you have to jump to action two if you update the parameter. Or you have to figure out how to jump to another action. But if it's kind of a probability distribution, then you have a continuous spectrum. So say, for example, at this moment, you are at 50-50. And then next time you update your parameter, you move to 40-60. And next time, you move to 30-70. So it's a more smooth dynamics.","zh":"你必须在动作一和动作二之间进行硬切换。它不是连续的。对于某个参数，你选择动作一。然后，如果你更新参数，你必须突然跳转到动作二，或者必须想办法跳转到另一个动作。但如果它是一种概率分布，那么你就会有一个连续的谱系。例如，此时你处于50-50的状态。下一次你更新参数时，你会移动到40-60的状态。再下一次，你会移动到30-70的状态。因此，这种动态变化更加平滑。","start":2334.54,"end":2361.66}],"notes":["本段讨论了随机策略与确定性策略的比较，指出在某些情况下随机策略可能不如确定性策略有效，但训练过程中需要一定的连续性。讲者提到，随机策略通过概率分布生成动作，而确定性策略则直接选择动作。","讲者通过一个例子说明，当随机策略选择动作1的概率为0.9，动作2的概率为0.1时，至少有一个动作的表现不会比随机策略差。这表明在某些情况下，随机策略的随机性可能并不必要。","讲者进一步指出，随机策略可以提供连续的动态变化，而确定性策略则可能导致突变。例如，参数变化时，确定性策略可能需要突然切换动作，而随机策略则可以平滑地过渡。","讲者提到，随机策略在训练过程中具有一定的优势，因为它可以提供连续性，避免突变带来的问题。然而，是否使用随机策略取决于具体的应用场景。","讲者强调了在策略设计中连续性的重要性，指出确定性策略可能导致不连续的切换，而随机策略则可以提供更平滑的动态变化。","讲者通过一个具体的例子说明了随机策略的连续性，即参数变化时，动作的概率分布可以平滑地从50-50过渡到40-60，再到30-70，从而避免了突变。"],"formulas":[],"uncertainties":["sarcasm"],"diagram":"none","start":2196.76,"end":2361.66,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2196.76,"text":"means that given a state S, and often the notation is like this. The often the notation is Pi of A given S. So basically, you're saying that given a state S, I need to generate distribution of actions. So a randomized policy in most cases is actually not as good as a deterministic one, but often in a training, you need to have some continuity in some sense. You need to model this."},{"start":2226.81,"text":"this randomized policy with some new networks with some sampling procedures. So randomization is actually somewhat useful in a training process. Because let's say suppose you pick action."},{"start":2245.8,"text":"Suppose your randomized policy is that you pick action 1 with probability 0.9 and pick action 2 with probability 0.1, let's say. That's your distribution of the actions, right? Action 1, 0.9 probability, action 2, 0.1 probability. And in this case, you can kind of prove that at least one of the action 1 or action 2 will be at least as good as your randomized policy."},{"start":2272.34,"text":"So either action one or action two. So in some sense, there's no point of hedging in some sense. Does it make sense? You're in between the two options, yes. It's kind of like, let's say, suppose..."},{"start":2292.65,"text":"action is one, this give you a payoff like maybe 1.0, and action two give you a payoff like maybe 2.0. If you're hedging between this, you are getting some reward between 1.0 and 2.0. But what you should have done is just taking action two. Exactly. You don't have to think about action one."},{"start":2315.76,"text":"Fortunately, you do want to have some kind of sarcasticity. There are so many reasons. So I think it depends on exactly which settings you want to use. But generally speaking, I think the fundamental thing is you want some kind of continuity in some sense. Because if it's really deterministic, often the case is that..."},{"start":2334.54,"text":"you have a hard switch between action one and action two. It's not continuous. For some parameter, you are choosing action one. And then suddenly, you have to jump to action two if you update the parameter. Or you have to figure out how to jump to another action. But if it's kind of a probability distribution, then you have a continuous spectrum. So say, for example, at this moment, you are at 50-50. And then next time you update your parameter, you move to 40-60. And next time, you move to 30-70. So it's a more smooth dynamics."}],"speech_gaps":[],"frame":"../frames/v039/014.webp","frame_time":2208.76},{"title":"价值函数与策略优化","segments":[{"id":280,"text":"And in some other cases, it's just like the policy has to be stochastic for some other reason, which we'll get into later. Cool. So let's see how, let me have a time check. Okay. So now, another important concept before we talk about the algorithm. So let me think about this, how much time I have. Okay. So I think the next concept is called the so-called value function.","zh":"在某些情况下，策略必须是随机的，这是出于其他原因，我们之后会详细讨论。好。那么让我们看看，让我检查一下时间。好。现在，在讨论算法之前，另一个重要的概念。让我想想，我还有多少时间。好。我想下一个概念叫做所谓的价值函数。","start":2364.32,"end":2406.76},{"id":281,"text":"So the value function is, in some sense, very similar to the return we talked about. But the value function is a function of the policy. So you can define the value function of a policy at state s as the expected total payoff starting from state s.","zh":"价值函数在某种意义上非常类似于我们讨论过的回报。但价值函数是策略的函数。因此，你可以将策略在状态 s 的价值函数定义为从状态 s 开始的预期总收益。","start":2413.77,"end":2443.06},{"id":282,"text":"So sometimes it's not very different from the return, the total payoff. It's just that you are specifying where you are starting with and also which policy you are applying. So basically, this means that if you start with state s, you'll keep applying policy pi. What's your expected return? So mathematically, you just write this as the expected return.","zh":"有时候，它与回报、总收益几乎没有区别。只是你指定了起始状态以及所应用的策略。基本上，这意味着如果你从状态 s 开始，你将持续应用策略 π。你的预期回报是多少？数学上，你可以将这表示为预期回报。","start":2449.42,"end":2466.52},{"id":283,"text":"Conditioned on this initial state is equal to S. Also, the randomness, how do you draw this random variable that S1 is drawn from PS0A0, and the action AT is drawn from policy Pi.","zh":"条件是这个初始状态等于 S。此外，随机性如何？如何从 PS0A0 中抽取这个随机变量 S1，以及动作 AT 从策略 π 中抽取。","start":2475.16,"end":2496.53},{"id":284,"text":"So that's why this is superscript pi here. So I'm describing what is the expected return for this policy starting from the state S. It's just a definition. And then you can also say, you can define a so-called V star of S. So this doesn't depend on policy. This is just the max over all the possible policy.","zh":"这就是为什么这里使用上标 π。我在描述从状态 S 开始应用该策略的预期回报。这只是定义。然后你也可以定义所谓的 V 星号（V*）的 S。这不依赖于策略。这只是所有可能策略中的最大值。","start":2497.36,"end":2526.49},{"id":285,"text":"So basically you're asking what is the best policy","zh":"基本上，你是在问什么是最优策略","start":2529.29,"end":2531.87},{"id":286,"text":"so that I can get the maximum return.","zh":"以便我可以获得最大回报。","start":2531.87,"end":2534.49},{"id":287,"text":"So in some sense this is the goal","zh":"在某种意义上，这就是目标","start":2534.83,"end":2536.41},{"id":288,"text":"that you are trying to solve.","zh":"你正在尝试解决的问题。","start":2536.41,"end":2537.99},{"id":289,"text":"So you are trying to find a policy such that","zh":"因此，你正在尝试寻找一个策略，使得","start":2538.13,"end":2539.91},{"id":290,"text":"you maximize the return.","zh":"你最大化回报。","start":2540.61,"end":2541.41}],"notes":["本段讲解了价值函数的概念，它与回报相似，但价值函数是策略的函数。价值函数定义为从状态s出发，按照策略π执行时的期望总回报。讲者提到，价值函数的定义需要考虑初始状态和策略的随机性，例如状态转移和动作选择的随机性。","讲者进一步指出，价值函数的定义中，初始状态为S，状态转移和动作选择的随机性由策略π决定。因此，价值函数的定义中包含策略π的上标，以表示其依赖于特定策略。此外，讲者提到可以定义一个不依赖于策略的V星（V*）函数，它表示所有可能策略中的最大回报。","讲者强调，寻找最佳策略的目标是最大化回报。这表明，价值函数和策略优化是强化学习中的核心概念，价值函数用于评估策略的性能，而策略优化的目标是找到能够最大化回报的策略。","讲者提到，价值函数的定义需要考虑状态转移和动作选择的随机性，例如状态S1是从PS0A0中抽取的，动作AT是从策略π中抽取的。这表明，价值函数的计算涉及概率分布和期望值的计算。","讲者还提到，V星（V*）函数是所有可能策略中的最大回报，这表明在强化学习中，策略优化的目标是找到能够最大化期望回报的策略。这与价值函数的定义密切相关，因为价值函数评估的是特定策略的性能，而V星函数则代表最优策略的性能。","讲者最后指出，寻找最佳策略的目标是最大化回报，这表明在强化学习中，策略优化是核心问题，而价值函数是评估策略性能的重要工具。"],"formulas":[],"uncertainties":["PS0A0","AT"],"diagram":"none","start":2364.32,"end":2541.41,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":2364.32,"text":"And in some other cases, it's just like the policy have to be stochastic for some other reason, which we'll get into later. Cool. So let's see how, let me have a time check. Okay. So now, another important concept before we talk about the algorithm. So let me think about this, how much time I have. Okay. So I think the next concept is called the so-called value function."},{"start":2413.77,"text":"So the value function is, in some sense, very similar to the return we talked about. But the value function is a function of the policy. So you can define the value function of a policy at state s as the expected total payoff starting from state s."},{"start":2449.42,"text":"So sometimes it's not very different from the return, the total payoff. It's just that you are specifying where you are starting with and also which policy you are applying. So basically, this means that if you start with state s, you'll keep applying policy pi. What's your expected return? So mathematically, you just write this as the expected return."},{"start":2475.16,"text":"conditioned on this initial state is equal to S. Also, the randomness, how do you draw this random variable that S1 is draw from PS0A0, and the action AT is drawn from policy Pi."},{"start":2497.36,"text":"So that's why this is superscript pi here. So I'm describing what is the expected return for this policy starting from the state S. It's just a definition. And then you can also say, you can define a so-called V star of S. So this doesn't depend on policy. This is just the max over all the possible policy."},{"start":2529.29,"text":"So basically you're asking what is the best policy"},{"start":2531.87,"text":"so that I can get the maximum return."},{"start":2534.83,"text":"So in some sense this is the goal"},{"start":2536.41,"text":"that you are trying to solve."},{"start":2538.13,"text":"So you are trying to find a policy such that"},{"start":2540.61,"text":"you maximize the return."}],"speech_gaps":[{"start":2527.072,"end":2528.89}],"frame":"../frames/v039/015.webp","frame_time":2376.32},{"title":"强化学习中的贝尔曼方程","segments":[{"id":291,"text":"And the return will be a function of your initial state","zh":"回报将是一个初始状态的函数","start":2542.13,"end":2545.49},{"id":292,"text":"because if your initial state is as,","zh":"因为如果你的初始状态是，","start":2545.49,"end":2546.85},{"id":293,"text":"you may have higher return than a different initial state.","zh":"你可能会比不同的初始状态获得更高的回报。","start":2547.01,"end":2549.71},{"id":294,"text":"So, but I'm getting the,","zh":"所以，但我正在得到，","start":2550.09,"end":2551.63},{"id":295,"text":"so basically V star is that","zh":"所以基本上 V 星是那个","start":2552.85,"end":2555.09},{"id":296,"text":"that if I'm optimal in my future decisions,","zh":"如果你在未来的决策中是最佳的，","start":2555.09,"end":2558.59},{"id":297,"text":"how much return I can get from state S.","zh":"从状态 S 可以获得多少回报。","start":2558.81,"end":2561.47},{"id":298,"text":"And the policy Pi star is just the argmax of this.","zh":"而策略 Pi 星只是这个的 argmax。","start":2563.17,"end":2568.27},{"id":299,"text":"This is the so-called optimal policy.","zh":"这就是所谓的最优策略。","start":2569.47,"end":2571.65},{"id":300,"text":"So basically, the optimizer of this is","zh":"所以基本上，这个的优化器是","start":2575.49,"end":2580.17},{"id":301,"text":"the optimal policy because that means it's pretty much a total.","zh":"最优策略，因为这意味着它几乎是一个完整的总和。","start":2580.17,"end":2584.39},{"id":302,"text":"it's just the definition, right?","zh":"它只是定义，对吧？","start":2584.39,"end":2586.13},{"id":303,"text":"You are defining the optimal policy","zh":"你是在定义最优策略","start":2586.17,"end":2587.35},{"id":304,"text":"as the one that is maximizing","zh":"为那个最大化","start":2587.35,"end":2588.65},{"id":305,"text":"your future return from this status.","zh":"从这个状态的未来回报。","start":2588.65,"end":2590.37},{"id":306,"text":"Okay, so those are some notations.","zh":"好的，这些是一些符号。","start":2591.93,"end":2595.21},{"id":307,"text":"I think, let me try to","zh":"我想，让我试着","start":2596.29,"end":2597.93},{"id":308,"text":"introduce one important concept,","zh":"介绍一个重要的概念，","start":2602.17,"end":2603.83},{"id":309,"text":"which is not that useful for the rest of the lecture,","zh":"这个概念对接下来的课程内容不是特别有用，","start":2603.93,"end":2607.29},{"id":310,"text":"but I think you probably should know this,","zh":"但我认为你们应该知道这个，","start":2607.39,"end":2608.89},{"id":311,"text":"at least once, you know,","zh":"至少一次，你们知道，","start":2609.97,"end":2611.17},{"id":312,"text":"I should know the existence of it","zh":"我应该知道它的存在","start":2611.17,"end":2612.41},{"id":313,"text":"of it and some of the general ideas.","zh":"以及一些一般性的想法。","start":2612.41,"end":2613.75},{"id":314,"text":"So one of the very important concept in reinforcement learning,","zh":"所以，在强化学习中，一个非常重要的概念是，","start":2614.19,"end":2616.67},{"id":315,"text":"not that important for using reinforcement learning in","zh":"对于在大型语言模型中使用强化学习并不是那么重要","start":2617.99,"end":2621.19},{"id":316,"text":"large language models but very","zh":"但在更经典的领域中却非常","start":2621.19,"end":2622.17},{"id":317,"text":"important in the more classical.","zh":"重要。所谓的贝尔曼方程","start":2622.17,"end":2624.05},{"id":318,"text":"is the so-called Bellman equation. The fundamental idea here is that you can write down some recursions to reason about this whole world because the whole thing is recursive, it's sequential, and you have this time thing, it's very complex to think about. But in some sense, you can use these techniques to get rid of the sequential.","zh":"是核心思想。这里的根本想法是，你可以写出一些递归关系来推理整个世界，因为整个系统是递归的，是顺序的，而且有时间的因素，这使得思考变得非常复杂。但某种意义上，你可以通过求解一个递归关系来消除这种顺序性。因此，我认为根本上，这种技术与如何计算这些事物的方法非常相似。假设你有一个序列，你有一个无限级数，比如 1 加上 gamma，加上 gamma 平方，加上 gamma 立方，一直到 gamma 的 t 次方，依此类推。那么你是如何计算这个值的？","start":2625.3,"end":2647.38},{"id":319,"text":"aspect in some sense by solving a recursion. So I think fundamentally, the technique is very similar to how do you compute these kind of things. Suppose you have a sequence, you have an infinite sum like this, 1 plus gamma, plus gamma squared, plus gamma cubed, up to gamma to the t, so on and so forth. So how do you compute this?","zh":"当然，你可以查阅书籍，找到这个的公式。但实际上，有一种简单的方法来推导和计算这个值，如下所示。你创建一个递归关系，把这个数称为 v，比如说。","start":2648.11,"end":2672.75},{"id":320,"text":"So, of course, you can look up the book and see a formula for this. But actually, one of the simple way to derive, to compute this value is the following. You create a recursion. You call this number v, let's say.","zh":"所以，当然，你可以查阅书籍，看到这个的公式。但实际上，计算这个值的一种简单方法如下。你创建一个递归关系。你把这个数称为v，比如说。","start":2674.3,"end":2689.66},{"id":321,"text":"Actually, I'm using the same number because it's","zh":"实际上代表的是同一个概念。","start":2690.43,"end":2692.55},{"id":322,"text":"actually the same concept.","zh":"实际上，是同样的概念。","start":2692.55,"end":2693.91},{"id":323,"text":"Then you try to do this following.","zh":"然后你尝试按照这个来做。","start":2694.39,"end":2696.53},{"id":324,"text":"You say v is equal to this, right?","zh":"你说 v 等于这个，对吧？","start":2696.65,"end":2697.89},{"id":325,"text":"But I can rewrite this equation as I take our first term one,","zh":"但我可以把这个方程重写为，我取第一个项，","start":2698.03,"end":2702.07},{"id":326,"text":"and then for the rest of the term,","zh":"然后对于剩下的项，","start":2702.65,"end":2704.15},{"id":327,"text":"they're all multiples of Gamma,","zh":"它们都是 Gamma 的倍数，","start":2704.23,"end":2705.43},{"id":328,"text":"and I take out that Gamma in front.","zh":"我把那个 Gamma 提到前面。","start":2705.45,"end":2707.43},{"id":329,"text":"So I get Gamma times,","zh":"所以我得到 Gamma 乘以，","start":2707.83,"end":2709.43},{"id":330,"text":"because I removed one of the Gammas,","zh":"因为我移除了一个 Gamma。","start":2710.17,"end":2711.79},{"id":331,"text":"and then this Gamma becomes one,","zh":"然后这个Gamma就变成了1，","start":2711.79,"end":2712.95},{"id":332,"text":"and then you have Gamma, Gamma squared, right?","zh":"然后你就有Gamma，Gamma的平方，对吧？","start":2713.13,"end":2719.45},{"id":333,"text":"So this is the equality.","zh":"所以这就是等式。","start":2719.45,"end":2720.61}],"notes":["本段讲解了强化学习中的价值函数和最优策略的概念。价值函数V*表示从某个状态S出发，在最优策略下可以获得的最大回报。最优策略π*是使这个价值函数最大化的选择。这些概念是强化学习的基础，用于描述智能体如何在环境中做出最优决策。","讲者提到贝尔曼方程是强化学习中的核心概念，它通过递归关系来处理序列问题。贝尔曼方程的基本思想是将问题分解为当前步骤和后续步骤，从而简化复杂的时间序列问题。","讲者通过一个无限级数的例子来说明如何推导贝尔曼方程。他提到通过递归方法，可以将无限级数转化为一个简单的等式，从而计算出总和。这种方法类似于贝尔曼方程的推导过程。","讲者强调贝尔曼方程在经典强化学习中的重要性，但在大型语言模型等现代应用中可能不是那么关键。这表明贝尔曼方程是理解强化学习基础理论的重要工具。","讲者提到贝尔曼方程的推导过程，通过将无限级数分解为第一项和剩余项，并提取公共因子γ，从而得到一个递归关系。这种方法展示了如何将复杂问题简化为更易处理的形式。","讲者指出，贝尔曼方程的核心思想是通过递归关系来处理时间序列问题，从而避免直接处理复杂的序列结构。这种方法在强化学习中被广泛应用，用于计算价值函数和策略优化。"],"formulas":[{"latex":"V^*","symbols":"价值函数","explanation":"保持原样，V^* 是价值函数的符号，符合强化学习中对最优价值函数的表示。","evidence":"how much return I can get from state S."},{"latex":"\\pi^*","symbols":"最优策略","explanation":"保持原样，\\pi^* 是最优策略的符号，符合强化学习中对最优策略的表示。","evidence":"And the policy Pi star is just the argmax of this."},{"latex":"v = 1 + \\gamma + \\gamma^2 + \\gamma^3 + \\cdots","symbols":"无限级数","explanation":"保持原样，该公式表示一个无限级数，符合上下文中的描述。","evidence":"aspect in some sense by solving a recursion. So I think fundamentally, the technique is very similar to how do you compute these kind of things. Suppose you have a sequence, you have an infinite sum like this, 1 plus gamma, plus gamma squared, plus gamma cubed, up to gamma to the t, so on and so forth. So how do you compute this?"}],"uncertainties":[],"diagram":"none","start":2542.13,"end":2720.61,"asr_flags":[],"math_clarifications":["公式 $ v = \\gamma (v - 1) $ 存在数学错误，正确的递归关系应为 $ v = 1 + \\\\$gamma v $，因此该公式应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":43,"raw_segments":[{"start":2542.13,"text":"And the return will be a function of your initial state"},{"start":2545.49,"text":"because if your initial state is as,"},{"start":2547.01,"text":"you may have higher return than a different initial state."},{"start":2550.09,"text":"So, but I'm getting the,"},{"start":2552.85,"text":"so basically V star is that"},{"start":2555.09,"text":"that if I'm optimal in my future decisions,"},{"start":2558.81,"text":"how much return I can get from state S."},{"start":2563.17,"text":"And the policy Pi star is just the argmax of this."},{"start":2569.47,"text":"This is the so-called optimal policy."},{"start":2575.49,"text":"So basically, the optimizer of this is"},{"start":2580.17,"text":"the optimal policy because that means it's pretty much a total."},{"start":2584.39,"text":"it's just the definition, right?"},{"start":2586.17,"text":"You are defining the optimal policy"},{"start":2587.35,"text":"as the one that is maximizing"},{"start":2588.65,"text":"your future return from this status."},{"start":2591.93,"text":"Okay, so those are some notations."},{"start":2596.29,"text":"I think, let me try to"},{"start":2602.17,"text":"introduce one important concept,"},{"start":2603.93,"text":"which is not that useful for the rest of the lecture,"},{"start":2607.39,"text":"but I think you probably should know this,"},{"start":2609.97,"text":"at least once, you know,"},{"start":2611.17,"text":"I should know the existence of it"},{"start":2612.41,"text":"of it and some of the general ideas."},{"start":2614.19,"text":"So one of the very important concept in reinforcement learning,"},{"start":2617.99,"text":"not that important for using reinforcement learning in"},{"start":2621.19,"text":"large language models but very"},{"start":2622.17,"text":"important in the more classical."},{"start":2625.3,"text":"is the so-called Bellman equation. The fundamental idea here is that you can write down some recursions to reason about this whole world because the whole thing is recursive, it's sequential, and you have this time thing, it's very complex to think about. But in some sense, you can use these techniques to get rid of the sequential."},{"start":2648.11,"text":"aspect in some sense by solving a recursion. So I think fundamentally, the technique is very similar to how do you compute these kind of things. Suppose you have a sequence, you have an infinite sum like this, 1 plus gamma, plus gamma squared, plus gamma cubed, up to gamma to the t, so on and so forth. So how do you compute this?"},{"start":2674.3,"text":"So, of course, you can look up the book and see a formula for this. But actually, one of the simple way to derive, to compute this value is the following. You create a recursion. You call this number v, let's say."},{"start":2690.43,"text":"Actually, I'm using the same number because it's"},{"start":2692.55,"text":"actually the same concept."},{"start":2694.39,"text":"Then you try to do this following."},{"start":2696.65,"text":"You say v is equal to this, right?"},{"start":2698.03,"text":"But I can rewrite this equation as I take our first term one,"},{"start":2702.65,"text":"and then for the rest of the term,"},{"start":2704.23,"text":"they're all multiples of Gamma,"},{"start":2705.45,"text":"and I take out that Gamma in front."},{"start":2707.83,"text":"So I get Gamma times,"},{"start":2710.17,"text":"because I removed one of the Gammas,"},{"start":2711.79,"text":"and then this Gamma becomes one,"},{"start":2713.13,"text":"and then you have Gamma, Gamma squared, right?"},{"start":2719.45,"text":"So this is the equality."}],"speech_gaps":[{"start":2599.952,"end":2601.648}],"frame":"../frames/v039/016.webp","frame_time":2554.13},{"title":"递归与贝尔曼方程","segments":[{"id":334,"text":"Then you can see this part is the same as v.","zh":"然后你可以看到这一部分与 v 是相同的。","start":2721.93,"end":2725.23},{"id":335,"text":"It has the same form as v, exactly.","zh":"它与 v 的形式完全相同。","start":2726.43,"end":2728.35},{"id":336,"text":"So it's just equal to v. So then you get the so-called recursion,","zh":"因此它就等于 v。因此你得到了所谓的递归关系，","start":2728.45,"end":2731.53},{"id":337,"text":"which means that you have a formula for v,","zh":"这意味着你有一个关于 v 的公式，","start":2731.59,"end":2734.95},{"id":338,"text":"where on the right-hand side also v is involved.","zh":"其中右边也涉及了 v。","start":2735.01,"end":2736.85},{"id":339,"text":"So I think that's fundamental what recursion mean.","zh":"我认为这就是递归的基本含义。","start":2737.71,"end":2741.85},{"id":340,"text":"So this is not telling you what v is exactly.","zh":"所以这并没有告诉你 v 的确切值。","start":2741.99,"end":2744.57},{"id":341,"text":"On the left-hand side you have v,","zh":"左边你有 v，","start":2745.15,"end":2746.29},{"id":342,"text":"but on the right-hand side you also have v.","zh":"但在右边你也有 v。","start":2746.39,"end":2747.49},{"id":343,"text":"But the nice thing is that once you have this, you can solve it.","zh":"但好的一点是，一旦你有了这个，你就可以解它。","start":2747.49,"end":2750.45},{"id":344,"text":"You can solve the equation.","zh":"你可以解这个方程。","start":2750.53,"end":2751.43},{"id":345,"text":"You solve it by say you move it to the left,","zh":"你解它的方式是说你把它移到左边，","start":2751.77,"end":2754.27},{"id":346,"text":"you say v times one minus Gamma is one","zh":"你说 v 乘以 1 减去 Gamma 等于 1","start":2754.31,"end":2756.53},{"id":347,"text":"and then this implies v is equals to one minus Gamma","zh":"然后这就意味着 v 等于 1 减去 Gamma","start":2756.77,"end":2759.55},{"id":348,"text":"Fundamentally, the Bellman equation is just exactly the same idea","zh":"从根本上说，贝尔曼方程正是同样的想法","start":2764.13,"end":2766.45},{"id":349,"text":"with more complex settings we are dealing with.","zh":"只是我们在处理更复杂的场景。","start":2766.45,"end":2769.35},{"id":350,"text":"So let me give you one.","start":2769.63,"end":2770.61},{"id":351,"text":"So let's derive the Bellman equation for v Pi.","start":2771.51,"end":2774.39},{"id":352,"text":"pi.","start":2774.39,"end":2774.57},{"id":353,"text":"So how do we compute v pi?","start":2774.85,"end":2777.01},{"id":354,"text":"Let's try to apply the same idea.","start":2777.61,"end":2778.89},{"id":355,"text":"So v pi is what?","start":2779.21,"end":2780.27},{"id":356,"text":"v pi is equal to this thing, right?","start":2780.39,"end":2783.51},{"id":357,"text":"So maybe let me just, for the sake of kind of like clarity,","start":2783.61,"end":2787.65},{"id":358,"text":"let's rewrite it.","start":2787.89,"end":2788.55},{"id":359,"text":"Let's copy it again.","start":2789.67,"end":2790.15},{"id":360,"text":"So and here, I guess implicitly,","start":2800.26,"end":2804.88},{"id":361,"text":"the actions are drawn from the Pi as we discussed here, right?","start":2804.88,"end":2808.36},{"id":362,"text":"So then you try to take out the first term like that.","start":2808.46,"end":2812.26},{"id":363,"text":"You see the first term is I0,","start":2812.72,"end":2814.44},{"id":364,"text":"which is actually deterministic because I0 is equal to S.","start":2814.64,"end":2817.2},{"id":365,"text":"So actually, the first term is Vs.","start":2817.46,"end":2821.14},{"id":366,"text":"Then you look at the rest of the terms.","start":2823.2,"end":2825.2},{"id":367,"text":"There's a Gamma here as well,","start":2826.66,"end":2827.94},{"id":368,"text":"and maybe the t's term","start":2827.94,"end":2830.06},{"id":369,"text":"and you have many many other terms","start":2830.06,"end":2831.8},{"id":370,"text":"and you have many many other terms","start":2831.8,"end":2833.88},{"id":371,"text":"let's say you have infinite number of terms","start":2833.88,"end":2835.58},{"id":372,"text":"which makes these things a little bit simpler","start":2835.58,"end":2838.14},{"id":373,"text":"and then I take","start":2840.6,"end":2841.98},{"id":374,"text":"the first term and then I have","start":2841.98,"end":2844.04},{"id":375,"text":"the rest of them and I remove the gamma","start":2844.04,"end":2846.16},{"id":376,"text":"so I have gamma","start":2846.16,"end":2847.52},{"id":377,"text":"times expectation","start":2847.52,"end":2848.92},{"id":378,"text":"rs1","start":2850.76,"end":2851.22},{"id":379,"text":"plus blah blah blah","start":2852.38,"end":2853.6},{"id":380,"text":"times r","start":2853.6,"end":2855.7},{"id":381,"text":"rt to the gamma to the t minus 1 times rst, given what?","start":2856.28,"end":2863.8},{"id":382,"text":"Given S0 is equal to S. But you know that S0 is equal to S.","start":2863.88,"end":2871.44},{"id":383,"text":"OK.","start":2872.8,"end":2873.2},{"id":384,"text":"So and you see this one is really","start":2873.44,"end":2881.24},{"id":385,"text":"just the total expected payoff if you start with S1.","start":2881.24,"end":2884.92},{"id":386,"text":"The only thing is that S1 is a little bit non-deterministic here.","start":2885.86,"end":2888.18},{"id":387,"text":"You don't even know exactly,","start":2888.32,"end":2889.08},{"id":388,"text":"S1 is a random variable.","start":2889.3,"end":2890.18},{"id":389,"text":"You're not 100% sure which one S1 is,","start":2890.72,"end":2892.96},{"id":390,"text":"but if you know what S1 is,","start":2893.02,"end":2894.66},{"id":391,"text":"then this is just the expected payoff in the future of S1,","start":2894.8,"end":2899.2},{"id":392,"text":"which is like a V-Pi S1, something like that.","start":2899.26,"end":2901.12}],"notes":["本段讲解了递归的基本概念，即一个变量在等式两边同时出现，通过移项可以求解。这与贝尔曼方程的思想一致，即状态值函数可以表示为当前奖励加上未来期望奖励的加权和。","讲者通过将v表示为一个包含Gamma的表达式，展示了如何通过代数操作求解递归关系。这为后续推导贝尔曼方程奠定了基础。","在推导贝尔曼方程时，讲者提到v_pi的计算需要考虑动作的分布和状态转移的不确定性。这表明贝尔曼方程不仅适用于确定性环境，也适用于随机环境。","讲者通过将v_pi分解为初始奖励和未来期望奖励的组合，展示了贝尔曼方程的结构。其中，初始奖励是确定的，而未来奖励则依赖于状态转移的概率分布。","在处理无限项时，讲者指出可以通过将Gamma因子提取出来，将问题转化为一个期望值的计算。这体现了贝尔曼方程在处理无限时间序列时的简洁性。","最后，讲者强调了状态转移的随机性，指出S1是一个随机变量，因此未来的期望奖励需要基于S1的分布进行计算。这进一步说明了贝尔曼方程在处理随机环境时的重要性。"],"formulas":[{"latex":"v_{\\pi} = r_0 + \\text{Gamma} \\times \\mathbb{E}[v_{\\pi}(S_1)]","symbols":"v_pi 是策略 pi 下的状态值函数，r_0 是初始奖励，Gamma 是折扣因子，E[.] 表示期望","explanation":"公式正确，符合Bellman方程的定义，其中v_pi表示策略pi下的状态值函数，r_0是初始奖励，Gamma是折扣因子，E[.]表示期望。","evidence":"So let's derive the Bellman equation for v Pi. pi. So how do we compute v pi? Let's try to apply the same idea. So v pi is what? v pi is equal to this thing, right? So maybe let me just, for the sake of kind of like clarity, let's rewrite it. Let's copy it again. So and here, I guess implicitly, the actions are drawn from the Pi as we discussed here, right? So then you try to take out the first term like that. You see the first term is I0, which is actually deterministic because I0 is equal to S. So actually, the first term is Vs. Then you look at the rest of the terms. There's a Gamma here as well, and maybe the t's term is rt to the rst and you have many many other terms let's say you have infinite number of terms which makes these things a little bit simpler and then I take the first term and then I have the rest of them and I remove the gamma so I have gamma times expectation rs1 plus blah blah blah times r rt to the gamma to the t minus 1 times rst, given what? Given S0 is equal to S. But you know that S0 is equal to S. OK. So and you see this one is really just the total expected payoff if you start with S1. The only thing is that S1 is a little bit non-deterministic here. You don't even know exactly, S1 is a random variable. You're not 100% sure which one S1 is, but if you know what S1 is, then this is just the expected payoff in the future of S1, which is like a V-Pi S1, something like that."}],"uncertainties":["rt to the gamma to the t minus 1 times rst, given what?"],"diagram":"bellman","start":2721.93,"end":2901.12,"asr_flags":[],"math_clarifications":["公式v = 1 - Gamma无法核对，因为没有提供足够的上下文来验证其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":false,"translated_segments":16,"raw_segments":[{"start":2721.93,"text":"Then you can see this part is the same as v."},{"start":2726.43,"text":"It has the same form as v, exactly."},{"start":2728.45,"text":"So it's just equal to v. So then you get the so-called recursion,"},{"start":2731.59,"text":"which means that you have a formula for v,"},{"start":2735.01,"text":"where on the right-hand side also v is involved."},{"start":2737.71,"text":"So I think that's fundamental what recursion mean."},{"start":2741.99,"text":"So this is not telling you what v is exactly."},{"start":2745.15,"text":"On the left-hand side you have v,"},{"start":2746.39,"text":"but on the right-hand side you also have v."},{"start":2747.49,"text":"But the nice thing is that once you have this, you can solve it."},{"start":2750.53,"text":"You can solve the equation."},{"start":2751.77,"text":"You solve it by say you move it to the left,"},{"start":2754.31,"text":"you say v times one minus Gamma is one,"},{"start":2756.77,"text":"and then this implies v is equals to one minus Gamma."},{"start":2764.13,"text":"Fundamentally, the Bellman equation is just exactly the same idea"},{"start":2766.45,"text":"with more complex settings we are dealing with."},{"start":2769.63,"text":"So let me give you one."},{"start":2771.51,"text":"So let's derive the Bellman equation for v Pi."},{"start":2774.39,"text":"pi."},{"start":2774.85,"text":"So how do we compute v pi?"},{"start":2777.61,"text":"Let's try to apply the same idea."},{"start":2779.21,"text":"So v pi is what?"},{"start":2780.39,"text":"v pi is equal to this thing, right?"},{"start":2783.61,"text":"So maybe let me just, for the sake of kind of like clarity,"},{"start":2787.89,"text":"let's rewrite it."},{"start":2789.67,"text":"Let's copy it again."},{"start":2800.26,"text":"So and here, I guess implicitly,"},{"start":2804.88,"text":"the actions are drawn from the Pi as we discussed here, right?"},{"start":2808.46,"text":"So then you try to take out the first term like that."},{"start":2812.72,"text":"You see the first term is I0,"},{"start":2814.64,"text":"which is actually deterministic because I0 is equal to S."},{"start":2817.46,"text":"So actually, the first term is Vs."},{"start":2823.2,"text":"Then you look at the rest of the terms."},{"start":2826.66,"text":"There's a Gamma here as well,"},{"start":2827.94,"text":"and maybe the t's term"},{"start":2830.06,"text":"is rt to the rst"},{"start":2831.8,"text":"and you have many many other terms"},{"start":2833.88,"text":"let's say you have infinite number of terms"},{"start":2835.58,"text":"which makes these things a little bit simpler"},{"start":2840.6,"text":"and then I take"},{"start":2841.98,"text":"the first term and then I have"},{"start":2844.04,"text":"the rest of them and I remove the gamma"},{"start":2846.16,"text":"so I have gamma"},{"start":2847.52,"text":"times expectation"},{"start":2850.76,"text":"rs1"},{"start":2852.38,"text":"plus blah blah blah"},{"start":2853.6,"text":"times r"},{"start":2856.28,"text":"rt to the gamma to the t minus 1 times rst, given what?"},{"start":2863.88,"text":"Given S0 is equal to S. But you know that S0 is equal to S."},{"start":2872.8,"text":"OK."},{"start":2873.44,"text":"So and you see this one is really"},{"start":2881.24,"text":"just the total expected payoff if you start with S1."},{"start":2885.86,"text":"The only thing is that S1 is a little bit non-deterministic here."},{"start":2888.32,"text":"You don't even know exactly,"},{"start":2889.3,"text":"S1 is a random variable."},{"start":2890.72,"text":"You're not 100% sure which one S1 is,"},{"start":2893.02,"text":"but if you know what S1 is,"},{"start":2894.8,"text":"then this is just the expected payoff in the future of S1,"},{"start":2899.26,"text":"which is like a V-Pi S1, something like that."}],"speech_gaps":[{"start":2790.55,"end":2792.432}],"frame":"../frames/v039/017.webp","frame_time":2733.93},{"title":"强化学习中的价值函数与贝尔曼方程","segments":[{"id":393,"text":"So the only thing we have to deal with is, what is S1?","zh":"所以我们唯一需要处理的问题是，S1是什么？","start":2901.42,"end":2903.6},{"id":394,"text":"So we just try to enumerate all the possibilities of S1.","zh":"因此，我们只需列举所有S1的可能情况。","start":2904.0,"end":2907.2},{"id":395,"text":"So this is RS plus,","zh":"所以这是RS加上，","start":2907.42,"end":2910.48},{"id":396,"text":"so you look at all the Gamma,","zh":"所以你要查看所有的Gamma，","start":2911.48,"end":2913.3},{"id":397,"text":"which is this one, and then you try","zh":"也就是这个，然后你尝试","start":2913.36,"end":2915.46},{"id":398,"text":"try to expand this, so you say this is actually equals to,","zh":"尝试展开这个，所以你说这实际上等于，","start":2915.46,"end":2920.04},{"id":399,"text":"you look at all the possibilities of S1.","zh":"你查看所有S1的可能情况。","start":2922.44,"end":2924.58},{"id":400,"text":"What is the chance of seeing S1?","zh":"看到S1的概率是多少？","start":2926.62,"end":2928.48},{"id":401,"text":"The chance of seeing S1 is P .","zh":"看到S1的概率是P。","start":2928.72,"end":2931.22},{"id":402,"text":"This is the chance of seeing S1 starting","zh":"这是从状态S采取动作A0后看到S1的概率。","start":2935.72,"end":2938.42},{"id":403,"text":"from state S and taking action A0.","zh":"从状态S采取动作A0后看到S1的概率。","start":2938.42,"end":2940.62},{"id":404,"text":"Sorry, and A0 is what?","zh":"抱歉，A0是什么？","start":2946.86,"end":2948.48},{"id":405,"text":"A0 is my policy.","zh":"A0是我的策略。","start":2948.58,"end":2949.76},{"id":406,"text":"What is A0? A0 is,","zh":"A0是什么？A0是，","start":2950.06,"end":2951.96},{"id":407,"text":"I'm sampling from the policy Pi.","zh":"我是在从策略Pi中进行采样。","start":2952.58,"end":2954.28},{"id":408,"text":"So A0 is really just Pi S,","zh":"所以A0其实就是Pi(S)，","start":2954.46,"end":2956.34},{"id":409,"text":"which is A0 as well.","zh":"这也是 A0。","start":2957.56,"end":2958.96},{"id":410,"text":"So I'm using the chemist policy to make it simpler.","zh":"所以我使用化学家策略来简化问题。","start":2959.16,"end":2961.62},{"id":411,"text":"So I have the probability of seeing S1,","zh":"所以我有看到 S1 的概率，","start":2962.18,"end":2964.42},{"id":412,"text":"and then I multiply the return.","zh":"然后我乘以回报。","start":2964.56,"end":2967.66},{"id":413,"text":"So this is the expectation of the future returns,","zh":"因此，这是未来回报的期望，","start":2967.9,"end":2971.96},{"id":414,"text":"as rs1 given s1.","zh":"即 rs1 给定 s1。","start":2971.96,"end":2977.7},{"id":415,"text":"So you condition s1, and all the features","zh":"因此，你对 s1 进行条件化，","start":2977.9,"end":2980.42},{"id":416,"text":"are still somewhat stochastic, but those are conditional s1.","zh":"所有特征仍然具有一定的随机性，但这些是条件在 s1 上的。","start":2980.42,"end":2985.0},{"id":417,"text":"So then this part is the expected payoff from s1.","zh":"那么这一部分就是从状态 s1 的预期收益。","start":2985.86,"end":2994.26},{"id":418,"text":"And it has a similar to this thing.","zh":"它与这个东西类似。","start":2996.8,"end":3000.72},{"id":419,"text":"Right?","zh":"对吗？","start":3000.72,"end":3000.9},{"id":420,"text":"It's exactly the same thing, but just starting","zh":"它完全是一样的东西，只是从不同的初始状态开始。","start":3001.02,"end":3002.74},{"id":421,"text":"from different initial state.","zh":"所以基本上，这就是 rs 加上 gamma 乘以 v pi s1。","start":3002.74,"end":3004.34},{"id":422,"text":"So basically, this is just the rs plus gamma times v pi s1.","zh":"所以基本上，这其实就是 rs 加上 gamma 乘以 v pi s1。","start":3004.58,"end":3017.86},{"id":423,"text":"So that's my equation.","zh":"因此，我在左边表达的是 v pi s。","start":3021.66,"end":3022.98},{"id":424,"text":"So I express on the left-hand side, I have v pi s.","zh":"因此我在左边表达式中，我有 v pi s。","start":3023.5,"end":3025.98},{"id":425,"text":"And on the right-hand side, I still have an equation,","zh":"在右边，我仍然有一个方程，","start":3026.46,"end":3030.44},{"id":426,"text":"by the equation on the right-hand side, there's still v pi s.","zh":"通过右边的方程，仍然有 v pi s。","start":3030.44,"end":3032.54},{"id":427,"text":"And here, actually, it's not only just one s.","zh":"实际上，这里不仅仅只是单个 s。","start":3032.82,"end":3034.64},{"id":428,"text":"Every s actually shows up here, because it's","zh":"实际上，每个 s 都会出现在这里，因为它是","start":3034.88,"end":3038.06},{"id":429,"text":"a sum over all possible s1.","zh":"对所有可能的 s1 的求和。","start":3038.06,"end":3039.48},{"id":430,"text":"It's just the difference of this is weighted differently.","zh":"这只是这个的差异在于权重不同。","start":3039.92,"end":3042.4},{"id":431,"text":"This is the second step?","zh":"这是第二步吗？","start":3047.82,"end":3053.2},{"id":432,"text":"Oh, yeah, the second step, the first step, the rs step.","zh":"哦，对，第二步，第一步，rs 步。","start":3053.52,"end":3055.76},{"id":433,"text":"This one.","zh":"这个。","start":3055.98,"end":3056.46},{"id":434,"text":"This isn't just a function, right?","zh":"这不仅仅是一个函数，对吧？","start":3057.38,"end":3058.76},{"id":435,"text":"This is just because, yes, exactly.","zh":"这正是因为它，是的，没错。","start":3058.76,"end":3060.04},{"id":436,"text":"Okay.","zh":"好的。","start":3060.26,"end":3060.46},{"id":437,"text":"Because S0 is fixed, yes.","zh":"因为 S0 是固定的，是的。","start":3060.76,"end":3062.58},{"id":438,"text":"Right.","zh":"对的。","start":3062.76,"end":3063.1},{"id":439,"text":"Exactly.","zh":"没错。","start":3063.2,"end":3063.6},{"id":440,"text":"Call it R0.","zh":"称它为 R0。","start":3063.9,"end":3064.66},{"id":441,"text":"You know, no, I think I should call it R0","zh":"你知道，不，我想我应该称它为 R0","start":3065.5,"end":3067.8},{"id":442,"text":"because S is the deterministic variable,","zh":"因为 S 是一个确定性变量，","start":3067.8,"end":3069.44},{"id":443,"text":"is the number.","zh":"是一个数值。","start":3069.66,"end":3070.44},{"id":444,"text":"S0 is kind of like a random variable.","zh":"S0 有点像一个随机变量。","start":3070.6,"end":3072.22},{"id":445,"text":"Oh.","zh":"哦。","start":3072.58,"end":3072.8},{"id":446,"text":"Right, so that's why I'm conditioning R0,","zh":"对，这就是为什么我要对 R0 进行条件期望，","start":3072.94,"end":3075.66},{"id":447,"text":"the random variable, taking a value S.","zh":"这个随机变量取值为 S。","start":3075.84,"end":3078.02},{"id":448,"text":"Oh, I see.","zh":"哦，我明白了。","start":3078.44,"end":3079.1},{"id":449,"text":"Yeah.","zh":"是的。","start":3079.32,"end":3079.46}],"notes":["本段主要讲解强化学习中的价值函数和贝尔曼方程。讲者首先讨论了状态S1的概率，指出S1的概率是P，即从状态S采取动作A0的概率。A0是策略π的样本，因此A0等于π(S)。接着，讲者提到期望未来回报的计算，即rs1给定s1的期望值。这部分涉及条件概率和随机变量的概念，S1是随机变量，而S是确定性变量。"],"formulas":[],"uncertainties":["chemist policy 可能是 'champion policy' 或 'chemist policy' 的误识别","rs plus gamma times v pi s1 中的 rs 可能是奖励 R 的缩写，但具体含义需要进一步确认"],"diagram":"none","start":2901.42,"end":3079.46,"asr_flags":[417,422,431],"math_clarifications":["公式中的期望符号应明确条件，如状态转移概率和动作选择策略。R0应为R_s，表示当前状态s的即时奖励，而非初始奖励。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":57,"raw_segments":[{"start":2901.42,"text":"So the only thing we have to deal with is, what is S1?"},{"start":2904.0,"text":"So we just try to enumerate all the possibilities of S1."},{"start":2907.42,"text":"So this is RS plus,"},{"start":2911.48,"text":"so you look at all the Gamma,"},{"start":2913.36,"text":"which is this one, and then you try"},{"start":2915.46,"text":"try to expand this, so you say this is actually equals to,"},{"start":2922.44,"text":"you look at all the possibilities of S1."},{"start":2926.62,"text":"What is the chance of seeing S1?"},{"start":2928.72,"text":"The chance of seeing S1 is P ."},{"start":2935.72,"text":"This is the chance of seeing S1 starting"},{"start":2938.42,"text":"from state S and taking action A0."},{"start":2946.86,"text":"Sorry, and A0 is what?"},{"start":2948.58,"text":"A0 is my policy."},{"start":2950.06,"text":"What is A0? A0 is,"},{"start":2952.58,"tex ":"Right."},{"start":3063.2,"text":"Exactly."},{"start":3063.9,"text":"Call it R0."},{"start":3065.5,"text":"You know, no, I think I should call it R0"},{"start":3067.8,"text":"because S is the deterministic variable,"},{"start":3069.66,"text":"is the number."},{"start":3070.6,"text":"S0 is kind of like a random variable."},{"start":3072.58,"text":"Oh."},{"start":3072.94,"text":"Right, so that's why I'm conditioning R0,"},{"start":3075.84,"text":"the random variable, taking a value S."},{"start":3078.44,"text":"Oh, I see."},{"start":3079.32,"text":"Yeah."}],"speech_gaps":[{"start":2941.52,"end":2943.344},{"start":3045.648,"end":3047.232}],"frame":"../frames/v039/018.webp","frame_time":2913.42},{"title":"递归方程与线性系统","segments":[{"id":450,"text":"Make sense?","zh":"明白吗？","start":3087.7,"end":3088.5},{"id":451,"text":"So let's examine the equations and see what we got.","zh":"那么让我们检查这些方程，看看我们得到了什么。","start":3090.42,"end":3093.36},{"id":452,"text":"So why are we getting a recursion?","zh":"那么我们为什么会得到一个递归？","start":3093.5,"end":3095.16},{"id":453,"text":"It's a recursion because on the left-hand side,","zh":"这是因为左边，","start":3095.24,"end":3096.94},{"id":454,"text":"you're trying to describe v-pi,","zh":"你试图描述 v-π，","start":3097.04,"end":3099.38},{"id":455,"text":"and on the right-hand side, you still have v-pi.","zh":"而右边你仍然有 v-π。","start":3099.5,"end":3101.3},{"id":456,"text":"Also, this recursion is a linear system equations.","zh":"此外，这个递归是一个线性方程组。","start":3101.64,"end":3103.78},{"id":457,"text":"Because in some sense,","zh":"因为某种意义上，","start":3105.24,"end":3106.52},{"id":458,"text":"for every option of s,","zh":"对于每一个状态 s 的选项，","start":3107.38,"end":3109.64},{"id":459,"text":"it's described as a linear combination of","zh":"它被描述为其他状态值 v-π s 的线性组合。","start":3110.9,"end":3112.62},{"id":460,"text":"the v-pi s for other value of s.","zh":"因此，基本上，如果你列出所有状态的值，","start":3112.62,"end":3114.98},{"id":461,"text":"So basically, if you list all the","zh":"对于每个状态 s，你都有一个这样的方程。因此，你得到一个方程组，且每个方程在所有值 v-π s 上都是线性的。","start":3115.74,"end":3117.98},{"id":462,"text":"For each of the s, you have an equation like this. So you have a system of equations, and every equation is linear in all the values v pi s. So in some sense, it's kind of like if you really root for, say, let's say, this is a kind of equation where, say, v pi 0 is equals to some constant, which is the r0 plus a linear combination of","zh":"某种意义上，这类似于如果你真的关注，比如说，这是一个方程类型，比如说，v-π 0 等于某个常数，这个常数是 r0 加上 v-π 0 到 v-π s 的线性组合。","start":3118.89,"end":3147.43},{"id":463,"text":"all the v-pi zero up to v-pi, say, s. V-pi one is the same thing, another linear combination. Every of this is a linear combination. Of course, the linear combination coefficient are different because these coefficients are different. But eventually, you get a set of equations like this. They're all linear functions of this set of variables.","zh":"v-π 1 是同样的情况，另一个线性组合。每一个都是线性组合。当然，线性组合的系数是不同的，因为这些系数是不同的。但最终，你会得到一组这样的方程。它们都是这些变量的线性函数。","start":3150.76,"end":3181.65},{"id":464,"text":"so many variables, right?","zh":"所以，有很多变量，对吧？","start":3183.59,"end":3185.01},{"id":465,"text":"So, and then you can solve the linear system equation","zh":"因此，然后你可以解这个线性方程组","start":3185.21,"end":3187.35},{"id":466,"text":"by just a linear solver.","zh":"只需一个线性求解器。","start":3188.03,"end":3189.39},{"id":467,"text":"You can get all these V pies.","zh":"你可以得到所有的V值。","start":3189.47,"end":3191.91},{"id":468,"text":"Yeah, so in this case, S is fine as discrete, yes.","zh":"是的，在这种情况下，S作为离散是没问题的，对吧。","start":3197.95,"end":3200.79},{"id":469,"text":"But the equation itself works for infinite.","zh":"但这个方程本身适用于无限的情况。","start":3200.95,"end":3203.63},{"id":470,"text":"Like this equation in this form is true for any,","zh":"比如，这个方程以这种形式对于任何情况都是成立的，","start":3204.95,"end":3208.29},{"id":471,"text":"any infinite number of S is still true.","zh":"任何无限数量的S仍然成立。","start":3209.01,"end":3210.65},{"id":472,"text":"And just like if you have infinite S,","zh":"就像你有无限个S，","start":3210.95,"end":3212.51},{"id":473,"text":"as continuous as you just have so many equations.","zh":"就像你有连续的方程一样，只要方程足够多。","start":3212.51,"end":3215.03},{"id":474,"text":"So it becomes like a linear functional equation,","zh":"因此，它就变成了一个线性函数方程，","start":3216.01,"end":3219.79},{"id":475,"text":"something like that.","zh":"类似这样的东西。","start":3220.03,"end":3220.45},{"id":476,"text":"Sorry, can you ask the question again?","zh":"抱歉，你能再问一遍问题吗？","start":3236.11,"end":3242.47},{"id":477,"text":"the last term in the development equation in that one.","zh":"刚才那个发展方程中的最后一项。","start":3242.47,"end":3246.65},{"id":478,"text":"This term?","zh":"这个项？","start":3247.01,"end":3247.57},{"id":479,"text":"No, sorry, in the above, about the borderline.","zh":"不，抱歉，在上面关于边界线的部分。","start":3248.01,"end":3251.17},{"id":480,"text":"Okay, here, okay.","zh":"好的，这里，好的。","start":3251.57,"end":3252.19},{"id":481,"text":"Here at the end, the re-bias.","zh":"在这里结尾处，重新偏置。","start":3252.21,"end":3253.93},{"id":482,"text":"Yes, yes.","zh":"是的，是的。","start":3254.05,"end":3254.39},{"id":483,"text":"This represents like,","zh":"这表示类似于，","start":3254.61,"end":3255.69},{"id":484,"text":"this would be the last one in my version,","zh":"这在我的版本中将是最后一个。","start":3256.19,"end":3258.47},{"id":485,"text":"so this is just representing the defining function","zh":"所以这只是表示整个状态空间的定义函数。","start":3258.61,"end":3261.27},{"id":486,"text":"of like the entire state space?","zh":"不，不，不，不。","start":3261.27,"end":3264.11},{"id":487,"text":"No, no, no, no.","zh":"不，不，不，不。","start":3264.47,"end":3264.85},{"id":488,"text":"Cardinality of x is the last state.","zh":"x 的基数是最后一个状态。","start":3265.71,"end":3267.13}],"notes":["本段讨论了递归方程的形成原因，指出在方程的左右两边都出现了v-pi，因此形成了递归关系。这种递归关系本质上是一个线性系统方程，因为每个状态s的v-pi都可以表示为其他状态s的线性组合。这种线性系统可以通过线性求解器来求解，从而得到所有v-pi的值。"],"formulas":[],"uncertainties":["v-pi","r0","Cardinality of x is the last state"],"diagram":"none","start":3087.7,"end":3267.13,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":3087.7,"text":"Make sense?"},{"start":3090.42,"text":"So let's examine the equations and see what we got."},{"start":3093.5,"text":"So why are we getting a recursion?"},{"start":3095.24,"text":"It's a recursion because on the left-hand side,"},{"start":3097.04,"text":"you're trying to describe v-pi,"},{"start":3099.5,"text":"and on the right-hand side, you still have v-pi."},{"start":3101.64,"text":"Also, this recursion is a linear system equations."},{"start":3105.24,"text":"Because in some sense,"},{"start":3107.38,"text":"for every option of s,"},{"start":3110.9,"text":"it's described as a linear combination of"},{"start":3112.62,"text":"the v-pi s for other value of s."},{"start":3115.74,"text":"So basically, if you list all the"},{"start":3118.89,"text":"For each of the s, you have an equation like this. So you have a system of equations, and every equation is linear in all the values v pi s. So in some sense, it's kind of like if you really root for, say, let's say, this is a kind of equation where, say, v pi 0 is equals to some constant, which is the r0 plus a linear combination of"},{"start":3150.76,"text":"all the v-pi zero up to v-pi, say, s. V-pi one is the same thing, another linear combination. Every of this is a linear combination. Of course, the linear combination coefficient are different because these coefficients are different. But eventually, you get a set of equations like this. They're all linear functions of this set of variables."},{"start":3183.59,"text":"so many variables, right?"},{"start":3185.21,"text":"So, and then you can solve the linear system equation"},{"start":3188.03,"text":"by just a linear solver."},{"start":3189.47,"text":"You can get all these V pies."},{"start":3197.95,"text":"Yeah, so in this case, S is fine as discrete, yes."},{"start":3200.95,"text":"But the equation itself works for infinite."},{"start":3204.95,"text":"Like this equation in this form is true for any,"},{"start":3209.01,"text":"any infinite number of S is still true."},{"start":3210.95,"text":"And just like if you have infinite S,"},{"start":3212.51,"text":"as continuous as you just have so many equations."},{"start":3216.01,"text":"So it becomes like a linear functional equation,"},{"start":3220.03,"text":"something like that."},{"start":3236.11,"text":"Sorry, can you ask the question again?"},{"start":3242.47,"text":"the last term in the development equation in that one."},{"start":3247.01,"text":"This term?"},{"start":3248.01,"text":"No, sorry, in the above, about the borderline."},{"start":3251.57,"text":"Okay, here, okay."},{"start":3252.21,"text":"Here at the end, the re-bias."},{"start":3254.05,"text":"Yes, yes."},{"start":3254.61,"text":"This represents like,"},{"start":3256.19,"text":"this would be the last one in my version,"},{"start":3258.61,"text":"so this is just representing the defining function"},{"start":3261.27,"text":"of like the entire state space?"},{"start":3264.47,"text":"No, no, no, no."},{"start":3265.71,"text":"Cardinality of x is the last state."}],"speech_gaps":[],"frame":"../frames/v039/019.webp","frame_time":3099.7},{"title":"关于状态索引与算法选择的讨论","segments":[{"id":489,"text":"Like I'm, yeah, I think I'm,","zh":"就像我，嗯，我想我，","start":3267.23,"end":3269.69},{"id":490,"text":"Maybe I should just use a different- I'm assuming","zh":"也许我应该使用不同的——我假设","start":3270.59,"end":3273.39},{"id":491,"text":"like the state s is indexed by one or maybe I start with zero,","zh":"比如状态 s 是通过一个或也许我从零开始索引的，","start":3273.39,"end":3278.15},{"id":492,"text":"then I should- maybe, okay, let's see.","zh":"那么我应该——也许，好的，我们来看看。","start":3278.21,"end":3282.99},{"id":493,"text":"So maybe let's say,","zh":"所以也许让我们说，","start":3283.11,"end":3287.63},{"id":494,"text":"suppose your state s is this,","zh":"假设你的状态 s 是这样的，","start":3287.69,"end":3288.85},{"id":495,"text":"zero, one, up to n minus one, let's say.","zh":"零，一，一直到 n 减一，让我们说。","start":3290.31,"end":3293.07},{"id":496,"text":"Okay. I think your confusion is very valid.","zh":"好的。我想你的困惑是非常合理的。","start":3293.91,"end":3297.61},{"id":497,"text":"So let's say this is n minus 1.","zh":"那么我们可以说这是 n 减 1。","start":3297.61,"end":3298.95},{"id":498,"text":"This is n minus 1.","zh":"这是 n 减 1。","start":3300.09,"end":3301.03},{"id":499,"text":"So you have n states.","zh":"因此你有 n 个状态。","start":3303.25,"end":3304.53},{"id":500,"text":"They are 0, 1, up to n minus 1.","zh":"它们是 0, 1，一直到 n 减 1。","start":3304.73,"end":3306.47},{"id":501,"text":"So on this last equation, on the left-hand side,","zh":"所以在最后一个等式中，左边","start":3307.15,"end":3309.61},{"id":502,"text":"you have the n minus 1 state value function.","zh":"你有 n 减 1 个状态的价值函数。","start":3309.67,"end":3311.77},{"id":503,"text":"This is n minus 1.","zh":"这是 n 减 1。","start":3312.85,"end":3313.91},{"id":504,"text":"It's the size.","zh":"这是尺寸。","start":3314.01,"end":3314.51},{"id":505,"text":"n is the size.","zh":"n 是大小。","start":3314.63,"end":3315.37},{"id":506,"text":"n is the size.","zh":"n 是大小。","start":3315.47,"end":3316.07},{"id":507,"text":"n minus 1 is the last state.","zh":"n 减 1 是最后一个状态。","start":3316.09,"end":3316.99},{"id":508,"text":"Yeah, yeah, yeah.","zh":"是的，是的，是的。","start":3317.45,"end":3318.09},{"id":509,"text":"Yeah. Yeah. They say some people write that way, so I'm a little bit lazy. Anyway, okay, but this is clear. Sounds good. So, okay, let me think about this. So how much time I have here? Okay, so I think I'm going to talk about, use the next 20 minutes to talk about algorithm to learn the, to optimize the algorithm.","zh":"是的。是的。有些人是这样写的，所以我有点懒。不管怎样，好吧，但这是很清楚的。听起来不错。所以，好吧，让我想想。我在这里有多少时间？好吧，我想我接下来要用20分钟来谈论算法，以学习并优化算法。","start":3321.54,"end":3351.58},{"id":510,"text":"So there are many, many different algorithms to find the optimal policy. So I think in the lecture notes, there are quite a few. I think because this quarter, we are focusing more on the large language model stuff. So I think I'm not going to discuss some
