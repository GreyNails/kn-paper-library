</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">bilidown检测到重名文件-l78n-【斯坦福CS229】混合高斯模型（EM）与主成分分析 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v039.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v039","title":"bilidown检测到重名文件-l78n-【斯坦福CS229】混合高斯模型（EM）与主成分分析","course":"机器学习","pages":[{"title":"强化学习基础与应用","segments":[{"id":0,"text":"Starting from this week, we're going to talk about reinforcement learning. So today is pretty much basics about reinforcement learning. Then next week, we're going to talk about reinforcement learning applied to large language models, especially in training some of these models with long chain of thought.","zh":"从本周开始，我们将讨论强化学习。因此，今天主要是关于强化学习的基础知识。下周，我们将讨论强化学习在大型语言模型中的应用，特别是如何用长提示链来训练这些模型。","start":5.33,"end":23.79},{"id":1,"text":"So, yeah, but today is mostly on, we're going to use probably robotics as the target applications because I think it's the easiest to think of.","zh":"所以，是的，但今天主要是围绕，我们将可能使用机器人作为目标应用，因为我觉得这是最容易想象的。","start":25.82,"end":35.94},{"id":2,"text":"understand reinforcement learning in those contexts, the basics. Because otherwise, you have to deal with two things together. One is the reinforcement learning setting, and the other one is how do you apply it to large language models. So today, we're going to make it clean just a relatively simple kind of like robotics or sequential decision-making scenario, and we're going to introduce this algorithm called policy gradient, which is one of the core algorithm for both the robotics case and","zh":"理解这些背景下的强化学习基础，因为否则你必须同时处理两件事。一个是强化学习的设置，另一个是如何将其应用于大型语言模型。因此，今天我们将保持简单，只讨论类似机器人或序列决策的场景，并介绍一种叫做策略梯度的算法，这是机器人案例和","start":37.87,"end":63.47},{"id":3,"text":"and the large-language model case. So reinforcement learning, the marker is great. The main concept here is that, so this is a technique in some sense. It's an algorithmic technique. The question we are trying to solve here is the so-called sequential decision-making.","zh":"以及大型语言模型案例中的核心算法之一。因此，强化学习，其标记是很好的。这里的主要概念是，这在某种意义上是一种技术。它是一种算法技术。我们试图解决的问题是所谓的序列决策。","start":64.79,"end":94.08},{"id":4,"text":"Let's unpack this. First of all, decision-making, as the name suggests, it means that you are making decisions that can affect our future.","zh":"让我们来拆解一下。首先，决策，顾名思义，意味着你做出的决策会影响未来。","start":99.86,"end":108.92},{"id":5,"text":"kind of like that have ramifications in the future. So it's not like you just predict something and that's it. You make some decisions and then it will affect the world. It's kind of like an action, but not just only a prediction. So it's kind of like you operate the robot or maybe you make an Amazon order, so on and so forth. And sequential.","zh":"类似于那些对未来有影响的决策。因此，它不像你只是预测某件事然后就结束了。你做出一些决策，然后它会影响世界。它有点像一个动作，但不仅仅是预测。因此，它有点像你操作机器人或可能下亚马逊订单，等等。并且是序列的。","start":109.36,"end":129.68},{"id":6,"text":"means that it's not just only one round. It's not like you make a decision and then it's done. You evaluate the decision. Actual decision will be done in a sequential way. For example, when you operate the robot, you have to give it instructions at every time step. You say you go left, you go right, and then raise the arm, so on and so forth. So in some sense, both of these combined make it complicated because","zh":"意味着它不仅仅是一轮。它不像你做出一个决策然后就完成了。你评估决策。实际的决策将以序列方式进行。例如，当你操作机器人时，你必须在每个时间步给出指令。你说左转、右转，然后抬起手臂，等等。因此，从某种意义上说，这两者结合在一起会变得复杂，因为","start":130.58,"end":154.08},{"id":7,"text":"like a greedy algorithm wouldn't work. What is the optimal for the moment may not be optimal for the future, and you have to think about the downstream consequence or the ramification. Another thing that we don't discuss that much is that when you are making decision, you also have to balance","zh":"比如，像贪心算法这样的方法可能行不通。当前最优的选择可能并不适用于未来，因此你必须考虑后续的影响或后果。另一个我们不太讨论的问题是，在做决策时，你还需要在不同因素之间进行权衡","start":156.09,"end":175.37}],"notes":["本段介绍了强化学习的基本概念，强调其应用于机器人和大语言模型的场景。课程指出，强化学习的核心是解决序列决策问题，即通过决策影响未来状态。课程提到，决策不仅涉及当前动作，还涉及对未来结果的考虑，因此需要平衡短期和长期收益。","课程提到，强化学习的决策过程是序列化的，即在每个时间步都需要做出决策，并且这些决策会持续影响后续状态。例如，在操作机器人时，需要在每个时间步给出指令，如左转、右转、抬起手臂等，这些决策会逐步影响机器人的行为。","课程指出，简单的贪心算法在强化学习中可能不适用，因为当前最优决策可能对未来的整体表现不利。因此，需要考虑决策的长期后果，而不仅仅是当前的收益。这种权衡是强化学习中的关键挑战之一。","课程还提到，在决策过程中需要平衡多个因素，例如探索与利用、短期收益与长期收益等。这表明强化学习不仅仅是选择最优动作，还需要在不同目标之间进行权衡，以实现整体最优。","课程强调，强化学习的算法（如策略梯度）在机器人和大语言模型中都有广泛应用。这表明强化学习不仅适用于物理世界中的机器人控制，也适用于复杂的语言模型训练任务。","课程通过机器人操作和亚马逊订单等例子，帮助学生理解强化学习的序列决策特性。这些例子展示了决策如何影响未来状态，并强调了决策过程的动态性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.33,"end":175.37,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.33,"text":"Starting from this week, we're going to talk about reinforcement learning. So today is pretty much basics about reinforcement learning. Then next week, we're going to talk about reinforcement learning applied to large language models, especially in training some of these models with long chain of thought."},{"start":25.82,"text":"So, yeah, but today is mostly on, we're going to use probably robotics as the target applications because I think it's the easiest to think of."},{"start":37.87,"text":"understand reinforcement learning in those contexts, the basics. Because otherwise, you have to deal with two things together. One is the reinforcement learning setting, and the other one is how do you apply it to large language models. So today, we're going to make it clean just a relatively simple kind of like robotics or sequential decision-making scenario, and we're going to introduce this algorithm called policy gradient, which is one of the core algorithm for both the robotics case and"},{"start":64.79,"text":"and the large-language model case. So reinforcement learning, the marker is great. The main concept here is that, so this is a technique in some sense. It's an algorithmic technique. The question we are trying to solve here is the so-called sequential decision-making."},{"start":99.86,"text":"Let's unpack this. First of all, decision-making, as the name suggests, it means that you are making decisions that can affect our future."},{"start":109.36,"text":"kind of like that have ramifications in the future. So it's not like you just predict something and that's it. You make some decisions and then it will affect the world. It's kind of like an action, but not just only a prediction. So it's kind of like you operate the robot or maybe you make an Amazon order, so on and so forth. And sequential."},{"start":130.58,"text":"means that it's not just only one round. It's not like you make a decision and then it's done. You evaluate the decision. Actual decision will be done in a sequential way. For example, when you operate the robot, you have to give it instructions at every time step. You say you go left, you go right, and then raise the arm, so on and so forth. So in some sense, both of these combined make it complicated because"},{"start":156.09,"text":"like a greedy algorithm wouldn't work. What is the optimal for the moment may not be optimal for the future, and you have to think about the downstream consequence or the ramification. Another thing that we don't discuss that much is that when you are making decision, you also have to balance"}],"speech_gaps":[],"frame":"../frames/v039/001.webp","frame_time":17.33},{"title":"探索与利用的权衡与强化学习的基本概念","segments":[{"id":8,"text":"on the return versus risk. So for example, some of the decisions you made may not be the optimal for the moment, but it's actually...","zh":"关于回报与风险的权衡。例如，你所做出的一些决策可能并不是当前最优的，但实际上……","start":176.91,"end":186.73},{"id":9,"text":"collecting information to some degree. For example, suppose you are thinking about, you go to a new city and you want to explore the restaurants there, right? So, some of the restaurants you go just for exploration. Not necessarily is that necessarily the optimal, given the current information, but it's in some sense collecting information so that in the future you can make better decisions. You can decide to go to this restaurant more times or not going at all, right? So, the risk versus return trade-off, I mean, the technical term is called exploration.","zh":"在某种程度上是在收集信息。例如，假设你正在考虑，你去一个新城市并想探索那里的餐馆，对吧？所以，你去一些餐馆只是为了探索。这并不一定是在当前信息下最优的，但某种程度上是在收集信息，以便将来做出更好的决策。你可以决定是否多次去这家餐馆，或者根本不去，对吧？所以，风险与回报的权衡，我指的是技术术语叫做探索。","start":186.94,"end":216.16},{"id":10,"text":"versus exploration trade-off. Exploration has the benefit that maybe in the future you understand the world better, and then you can exploit much better. And exploitation is more like a more","zh":"与探索的权衡。探索的好处是，也许将来你对世界理解得更好，然后你可以更好地利用。而利用则更像是一种短视的行为，即你根据当前的信息，只是尝试做你知道的最好的事情。因此，这就是利用与探索的权衡。实际上，我一开始提到这个原因是因为在大多数情况下，我们不会过多讨论这个权衡，因为在目前的一些应用中，如何权衡探索与利用是非常微妙的，在很多情况下，","start":216.24,"end":226.4},{"id":11,"text":"myopic thing which is that you're given the current amount of information, you just try to do the best thing you know in some sense. So this is exportation exploration trade-off. Actually, the reason why I mentioned at the very beginning is because we are not going to discuss it too much in most of the cases because in some of the applications we are seeing right now, this trade-off, how do you trade-off the exploration versus exportation is very subtle and in many cases,","zh":"你并不需要做太多的探索。自然，算法会有一些程度的探索，这已经足够了。因此，只有在一些更经典的设置中，利用与探索的权衡才被很好地理解。这就是为什么我们不会过多讨论这个话题。我们主要关注的是序列部分，你必须处理长期的影响。因此，这是强化学习的一个方面。强化学习的另一个方面是，","start":227.09,"end":254.81},{"id":12,"text":"do it. You just don't do much exploration. Naturally, the algorithm has some degree of exploration and that's enough. So only for some of the more classic settings, the exploitation versus exploration trade-off is well understood. So that's why we don't discuss that much. We mostly focus on the sequential part where you have to deal with the long-term ramification. So that's one aspect of reinforcement learning. Another aspect of reinforcement learning is that","zh":"做吧。你只是不会进行很多探索。自然地，算法会有一些程度的探索，这已经足够了。因此，只有在一些更经典的设置中，探索与利用的权衡才被很好地理解。这就是为什么我们不会过多讨论这个话题。我们主要关注需要处理长期影响的序列部分。这就是强化学习的一个方面。强化学习的另一个方面是","start":255.5,"end":283.78},{"id":13,"text":"almost most of the reinforced learning you are dealing with almost no supervision.","zh":"几乎所有的强化学习你所处理的几乎都没有监督。","start":284.37,"end":289.87},{"id":14,"text":"Of course, there are different setups, different variants of setups, but the most classical setup for reinforcement learning, and also for sequential decision-making, is that you don't have supervision. At least you don't have the same type of supervision in the classification or in the supervisor setting. So what you only have is that you only have, for example, in many cases, you don't have the optimal actions. You don't know what is the optimal actions, even in your training dataset.","zh":"当然，存在不同的设置，也存在不同变体的设置，但强化学习以及序列决策的最经典设置是：你没有监督。至少，你不像在分类或监督设置中那样拥有相同的监督类型。因此，你所拥有的只是，例如，在许多情况下，你并不知道最优动作是什么，甚至在你的训练数据集中也不知道最优动作是什么。","start":293.96,"end":322.72},{"id":15,"text":"and you rely on the so-called reward.","zh":"你依赖于所谓的奖励。","start":323.6,"end":325.92},{"id":16,"text":"So, we are learning from reward as opposed to labels.","zh":"因此，我们是从奖励中进行学习，而不是从标签中进行学习。","start":326.22,"end":332.56},{"id":17,"text":"I will define what reward means.","zh":"我将定义什么是奖励。","start":339.14,"end":340.86},{"id":18,"text":"Reward is often a scalar that","zh":"奖励通常是标量，","start":341.1,"end":343.82},{"id":19,"text":"just tells you whether the sequence of actions is good or bad.","zh":"它只是告诉你动作序列是好还是坏。","start":343.82,"end":346.34},{"id":20,"text":"It doesn't tell you which is the good option.","zh":"它不会告诉你哪个选项是好的。","start":346.8,"end":348.46},{"id":21,"text":"It doesn't tell you the optimum action.","zh":"它不会告诉你最优动作是什么。","start":348.66,"end":351.04}],"notes":["本段讲解了探索与利用的权衡概念，即在决策过程中，有时需要牺牲当前的最优选择以获取更多信息，从而在未来做出更好的决策。例如，在新城市探索餐厅时，可能不会立即选择最优的餐厅，而是通过尝试不同的餐厅来收集信息，以便未来做出更优的选择。这种权衡被称为探索与利用的权衡（exploration-exploitation trade-off）。"],"formulas":[],"uncertainties":["exportation"],"diagram":"none","start":176.91,"end":351.04,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":176.91,"text":"on the return versus risk. So for example, some of the decisions you made may not be the optimal for the moment, but it's actually..."},{"start":186.94,"text":"collecting information to some degree. For example, suppose you are thinking about, you go to a new city and you want to explore the restaurants there, right? So, some of the restaurants you go just for exploration. Not necessarily is that necessarily the optimal, given the current information, but it's in some sense collecting information so that in the future you can make better decisions. You can decide to go to this restaurant more times or not going at all, right? So, the risk versus return trade-off, I mean, the technical term is called export."},{"start":216.24,"text":"versus exploration trade-off. Exploration has the benefit that maybe in the future you understand the world better, and then you can exploit much better. And exploitation is more like a more"},{"start":227.09,"text":"myopic thing which is that you're given the current amount of information, you just try to do the best thing you know in some sense. So this is exportation exploration trade-off. Actually, the reason why I mentioned at the very beginning is because we are not going to discuss it too much in most of the cases because in some of the applications we are seeing right now, this trade-off, how do you trade-off the exploration versus exportation is very subtle and in many cases,"},{"start":255.5,"text":"do it. You just don't do much exploration. Naturally, the algorithm has some degree of exploration and that's enough. So only for some of the more classic settings, the exploitation versus exploration trade-off is well understood. So that's why we don't discuss that much. We mostly focus on the sequential part where you have to deal with the long-term ramification. So that's one aspect of reinforcement learning. Another aspect of reinforcement learning is that"},{"start":284.37,"text":"almost most of the reinforced learning you are dealing with almost no supervision."},{"start":293.96,"text":"Of course, there are different setups, different variants of setups, but the most classical setup for reinforcement learning, and also for sequential decision-making, is that you don't have supervision. At least you don't have the same type of supervision in the classification or in the supervisor setting. So what you only have is that you only have, for example, in many cases, you don't have the optimal actions. You don't know what is the optimal actions, even in your training dataset."},{"start":323.6,"text":"and you rely on the so-called reward."},{"start":326.22,"text":"So, we are learning from reward as opposed to labels."},{"start":339.14,"text":"I will define what reward means."},{"start":341.1,"text":"Reward is often a scalar that"},{"start":343.82,"text":"just tells you whether the sequence of actions is good or bad."},{"start":346.8,"text":"It doesn't tell you which is the good option."},{"start":348.66,"text":"It doesn't tell you the optimum action."}],"speech_gaps":[],"frame":"../frames/v039/002.webp","frame_time":188.91},{"title":"强化学习与马尔可夫决策过程","segments":[{"id":22,"text":"It only evaluates whether actions you output is good or not, so and as a result you know um like","zh":"它只是评估你输出的动作是否好，因此你就会知道，比如","start":351.04,"end":359.68},{"id":23,"text":"um I guess maybe here I should say no human supervision, I mean no or little human supervision","zh":"嗯，我想这里应该说没有人类监督，我是说没有或很少人类监督","start":359.68,"end":365.76},{"id":24,"text":"and as a result of this you know another feature of it is that in most of these reinforcement","zh":"因此，它的另一个特点是，在大多数这些强化学习算法中，你需要自己收集数据，你知道，以一种主动的方式，比如","start":366.32,"end":370.92},{"id":25,"text":"learning algorithms you need to collect data yourself, you know in an active way right so like","zh":"比如说，在某种意义上，比如，想想如何教机器人学习。","start":370.92,"end":376.82},{"id":26,"text":"Like, in some sense, for example, think about how to learn the robot.","zh":"你让机器人，你知道的，生成一些动作给机器人，","start":376.82,"end":379.76},{"id":27,"text":"You let the robot, you know, you generate some actions for the robot,","zh":"然后你让机器人在现实世界中尝试这些动作。","start":380.18,"end":383.6},{"id":28,"text":"and you let the robot try it out in the real world.","zh":"如果它不起作用，那么你就说，哦，奖励又回来了。","start":383.68,"end":385.78},{"id":29,"text":"And if it doesn't work, then you say, oh, the reward is back.","zh":"如果这不起作用，那么你会说，哦，奖励回来了。","start":386.28,"end":389.02},{"id":30,"text":"you shouldn't do it anymore, then you penalize it. Then if it happens to do well, then you say, oh, this is a good action, then keep doing this in the future. So in some sense, it's like a trial and error approach. You try some trajectories or you try some actions, and then you have a mechanism to reinforce the good actions and penalize the bad actions. So that's the general framework. So there's this data collection and training loop.","zh":"如果你不再这样做，那么你就会惩罚它。然后如果它表现得不错，你就会说，哦，这是一个好的动作，那么在未来继续这样做。因此，在某种意义上，这就像一种试错的方法。你尝试一些轨迹或一些动作，然后你有一个机制来强化好的动作并惩罚坏的动作。这就是总体框架。因此，存在数据收集和训练循环。","start":389.51,"end":414.47},{"id":31,"text":"you collect some data and you find out the good data and then you reinforce by training on the good data.","zh":"你收集一些数据，然后找出好的数据，然后通过在好数据上进行训练来强化。","start":416.27,"end":425.42},{"id":32,"text":"So that's some of the features, high-level features. Of course, there are many different details depending on the setting, so on and so forth. But most of the cases, you should see all of these dimensions. Next, I'm going to discuss the basic modeling framework for applying reinforcement learning. It's called the Markov Decision Process. In some sense, you have to have a way to describe","zh":"因此，这就是一些高层次的特征。当然，根据不同的设置，有许多不同的细节，所以等等。但大多数情况下，你应该看到所有这些维度。接下来，我将讨论应用强化学习的基本建模框架。它被称为马尔可夫决策过程。在某种意义上，你必须有一种方法来描述","start":427.15,"end":449.13},{"id":33,"text":"the world and how to interact with the world to even talk about these algorithms. So it's not as simple as just making a prediction. You are making some decisions. You have to model how does the decision affect the environment and affect you in the future. The modeling is called Markov Decision Process, which is actually a very powerful framework. So it's called MDP.","zh":"这个世界以及如何与这个世界互动，才能谈论这些算法。因此，这不仅仅是简单地进行预测。你是在做决策。你必须建模决策如何影响环境以及如何影响你未来。这种建模被称为马尔可夫决策过程，实际上是一个非常强大的框架。因此，它被称为MDP。","start":449.87,"end":474.75},{"id":34,"text":"And so I think we're going to use probably a running example like this. Something like you are navigating a robot on a 1D tape. It's a kind of like a pretty trivial task. Let's say, suppose you have a 1D tape. You have some cells, 1 to 10. And you have a robot. Let's say you have a robot.","zh":"因此，我想我们会使用一个运行的例子，比如这样。例如，你正在一个1D磁带上导航一个机器人。这是一个相当简单的任务。假设你有一个1D磁带。你有一些单元格，从1到10。你有一个机器人。比如说，你有一个机器人。","start":477.3,"end":496.53},{"id":35,"text":"somewhere on one of the cell and you want to navigate the robot to the left or to the right and maybe there's a goal you want to achieve. So you want to navigate the robots to achieve the goal, something like that. So I'm going to use this as a running example to map the abstract notations into the real world. You can also think of this as, for example, you have","zh":"在其中一个单元格上，你想将机器人向左或向右导航，也许有一个你想要实现的目标。因此，你想导航机器人以实现目标，类似这样的事情。我将使用这个作为运行的例子，将抽象的符号映射到现实世界中。你也可以将此视为，例如，你有","start":498.53,"end":520.79}],"notes":["本段介绍了强化学习的基本概念，强调了没有或很少人工监督的特点，以及数据收集和训练循环的重要性。讲者提到强化学习算法需要主动收集数据，并通过试错机制来强化好的动作和惩罚坏的动作。这种机制类似于试错法，通过尝试不同的轨迹或动作，并根据结果调整策略。","讲者进一步说明了强化学习的建模框架，即马尔可夫决策过程（MDP）。MDP是一种强大的框架，用于描述如何与环境互动并做出决策。讲者指出，与单纯的预测不同，强化学习涉及决策过程，并需要建模决策如何影响环境和未来的结果。","为了更好地理解MDP，讲者提出一个运行示例：在一条1D磁带上导航机器人。这个例子包括10个单元格，机器人位于其中一个单元格，目标是向左或向右移动以达到某个目标。这个例子用于将抽象的符号映射到现实世界中，帮助学生理解MDP的结构。","讲者提到，强化学习的建模需要考虑环境和决策之间的相互作用，以及如何通过奖励机制来调整策略。这种机制是强化学习的核心，即通过奖励和惩罚来引导机器人学习有效的动作。","在讲授过程中，讲者强调了强化学习的高阶特征，包括数据收集、训练循环和试错机制。这些特征构成了强化学习的基本框架，并为后续讨论MDP提供了基础。","讲者还提到，不同的设置会导致不同的细节，但大多数情况下，这些高阶特征是共通的。因此，理解这些基本概念对于掌握强化学习至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":351.04,"end":520.79,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":351.04,"text":"it only evaluates whether actions you output is good or not so and as a result you know um like"},{"start":359.68,"text":"um i guess maybe here i should say no human supervision i mean no or little human supervision"},{"start":366.32,"text":"and as a result of this you know another feature of it is that in most of these reinforcement"},{"start":370.92,"text":"learning algorithms you need to collect data yourself you know in an active way right so like"},{"start":376.82,"text":"Like, in some sense, for example, think about how to learn the robot."},{"start":380.18,"text":"You let the robot, you know, you generate some actions for the robot,"},{"start":383.68,"text":"and you let the robot try it out in the real world."},{"start":386.28,"text":"And if it doesn't work, then you say, oh, the reward is back."},{"start":389.51,"text":"you shouldn't do it anymore, then you penalize it. Then if it happens to do well, then you say, oh, this is a good action, then keep doing this in the future. So in some sense, it's like a trial and error approach. You try some trajectories or you try some actions, and then you have a mechanism to reinforce the good actions and penalize the bad actions. So that's the general framework. So there's this data collection and training loop."},{"start":416.27,"text":"you collect some data and you find out the good data and then you reinforce by training on the good data."},{"start":427.15,"text":"So that's some of the features, high-level features. Of course, there are many different details depending on the setting, so on and so forth. But most of the cases, you should see all of these dimensions. Next, I'm going to discuss the basic modeling framework for applying reinforcement learning. It's called the Markov Decision Process. In some sense, you have to have a way to describe"},{"start":449.87,"text":"the world and how to interact with the world to even talk about these algorithms. So it's not as simple as just making a prediction. You are making some decisions. You have to model how does the decision affect the environment and affect you in the future. The modeling is called Markov Decision Process, which is actually a very powerful framework. So it's called MDP."},{"start":477.3,"text":"And so I think we're going to use probably a running example like this. Something like you are navigating a robot on a 1D tape. It's a kind of like a pretty trivial task. Let's say, suppose you have a 1D tape. You have some cells, 1 to 10. And you have a robot. Let's say you have a robot."},{"start":498.53,"text":"somewhere on one of the cell and you want to navigate the robot to the left or to the right and maybe there's a goal you want to achieve. So you want to navigate the robots to achieve the goal, something like that. So I'm going to use this as a running example to map the abstract notations into the real world. You can also think of this as, for example, you have"}],"speech_gaps":[],"frame":"../frames/v039/003.webp","frame_time":363.04},{"title":"状态、动作与建模选择","segments":[{"id":36,"text":"you have Go, you are playing Go, and you have a board, which is gonna be 2D, and then every action is kind of like putting out some, making some moves, and so on and so forth. So anyway, so, and the basic kind of like, oh, I realize I have to raise it now. I hope I don't have to do this once. Okay, so the basic framework is the following. So you have one thing called capital S, which is the set of states. So states are pretty much,","zh":"你正在下围棋，你有一个棋盘，它是二维的，每一个动作都像是放置一些棋子，进行一些移动，等等。总之，我意识到我现在必须提出这个问题。我希望我不会不得不这样做一次。好的，所以基本框架如下。你有一个叫做大S的东西，它是状态的集合。状态基本上是，","start":521.64,"end":556.03},{"id":37,"text":"everything you need to describe the world right so in this case the state is pretty much where the robot is at right now right so your state side the the set of states is very simple in some sense it's just you know in this case you know in the example","zh":"你描述世界所需要的一切。在这种情况下，状态基本上就是机器人现在所处的位置。因此，状态集合在某种意义上是非常简单的，它只是比如说在这种情况下，比如说在例子中，","start":556.49,"end":572.13},{"id":38,"text":"It's just a 1, 2, say 10, something like this. If you are thinking about a real robot, then the state will be something like all the positions of the arms, all the angles, the locations or the relative joint locations, so on and so forth. So it's going to be a much more complicated state.","zh":"它只是1、2，比如说10，类似这样的数字。如果你在考虑一个真实的机器人，那么状态会是所有手臂的位置，所有角度，位置或相对关节位置，等等。因此，它会是一个更加复杂的状态。","start":574.17,"end":593.07},{"id":39,"text":"So and sometimes the state also includes like a visual state, right? For example, a robot may have a camera and that's also part of the state as well for the robot. So and if you are playing Go, then this kind of like the whole configuration of the board is the state. And S is the set of all possible states, right? So in some sense, this is the set of all possible configurations of the robot or set of all configurations on a board, which is for Go is like,","zh":"有时状态还包括视觉状态，对吧？例如，机器人可能有一个摄像头，这也是机器人状态的一部分。如果你在下围棋，那么这种棋盘的整个配置就是状态。S是所有可能状态的集合，对吧？在某种意义上，这是机器人所有可能配置的集合，或者在围棋中是棋盘上所有可能配置的集合，","start":594.85,"end":621.69},{"id":40,"text":"So I think there is a choice. So you could include some of those as the states, depending on whether you think you want to model them. So in some sense, this is a modeling choice. Of course, in theory, the states should involve everything, but you cannot model every.","zh":"我认为这是一个选择。你可以根据是否想建模它们，将其中一些包括在状态中。在某种意义上，这是建模的选择。当然，在理论上，状态应该包括一切，但你无法建模每一个细节。","start":622.28,"end":650.54},{"id":41,"text":"little details about everything. So you have to abstract away something. I think generally speaking, people don't have, for example, whether the 3D map of the world is part of the state. Generally, no, I think it's too much. So you mostly just use the camera images to capture some of those. Then there's a set of actions. So A is the set of actions.","zh":"你必须抽象掉一些东西。我认为一般来说，人们不会将世界的3D地图作为状态的一部分。一般来说，不，我认为这太多了。因此，你通常只是使用摄像头图像来捕捉其中的一些信息。然后有一个动作的集合。A是动作的集合。","start":651.26,"end":681.31},{"id":42,"text":"And in my toy example, I'm going to define the set of actions","zh":"在我的玩具例子中，我将定义动作的集合","start":684.08,"end":686.36},{"id":43,"text":"to be just you try to move it left","zh":"为只是尝试向左移动","start":686.36,"end":688.94},{"id":44,"text":"or you try to move it right, something like that.","zh":"或者你试图把它向右移动，类似这样的操作。","start":688.94,"end":690.6},{"id":45,"text":"So maybe just you have some kind of control","zh":"所以也许你拥有一种控制方式","start":691.04,"end":693.98},{"id":46,"text":"which is going left or going right.","zh":"它要么向左，要么向右。","start":693.98,"end":696.3},{"id":47,"text":"And for the real robots, the set of actions","zh":"而对于真实的机器人，动作的集合","start":697.02,"end":699.7}],"notes":["本段讲解了状态（state）和动作（action）的基本概念，以及建模时如何选择状态空间。状态是描述世界所需的所有信息，例如机器人的位置、角度、相机图像等。动作是系统可以执行的操作，如左右移动。","在建模时，需要根据实际需求选择是否将某些细节纳入状态空间。理论上，状态应包含所有信息，但实际中由于计算复杂度，通常需要抽象简化。例如，3D地图可能过于复杂，因此通常使用相机图像来捕捉环境信息。"],"formulas":[],"uncertainties":[],"diagram":"none","start":521.64,"end":699.7,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":521.64,"text":"you have Go, you are playing Go, and you have a board, which is gonna be 2D, and then every action is kind of like putting out some, making some moves, and so on and so forth. So anyway, so, and the basic kind of like, oh, I realize I have to raise it now. I hope I don't have to do this once. Okay, so the basic framework is the following. So you have one thing called capital S, which is the set of states. So states are pretty much,"},{"start":556.49,"text":"everything you need to describe the world right so in this case the state is pretty much where the robot is at right now right so your state side the the set of states is very simple in some sense it's just you know in this case you know in the example"},{"start":574.17,"text":"It's just a 1, 2, say 10, something like this. If you are thinking about a real robot, then the state will be something like all the positions of the arms, all the angles, the locations or the relative joint locations, so on and so forth. So it's going to be a much more complicated state."},{"start":594.85,"text":"So and sometimes the state also includes like a visual state, right? For example, a robot may have a camera and that's also part of the state as well for the robot. So and if you are playing Go, then this kind of like the whole configuration of the board is the state. And S is the set of all possible states, right? So in some sense, this is the set of all possible configurations of the robot or set of all configurations on a board, which is for Go is like,"},{"start":622.28,"text":"three to the power of 361. So I think there is a choice. So you could include some of those as the states, depending on whether you think you want to model them. So in some sense, this is a modeling choice. Of course, in theory, the states should involve everything, but you cannot model every."},{"start":651.26,"text":"little details about everything. So you have to abstract away something. I think generally speaking, people don't have, for example, whether the 3D map of the world is part of the state. Generally, no, I think it's too much. So you mostly just use the camera images to capture some of those. Then there's a set of actions. So A is the set of actions."},{"start":684.08,"text":"And in my toy example, I'm going to define the set of actions"},{"start":686.36,"text":"to be just you try to move it left"},{"start":688.94,"text":"or you try to move it right, something like that."},{"start":691.04,"text":"So maybe just you have some kind of control"},{"start":693.98,"text":"which is going left or going right."},{"start":697.02,"text":"And for the real robots, the set of actions"}],"speech_gaps":[],"frame":"../frames/v039/004.webp","frame_time":533.64},{"title":"状态与动作的转移动态","segments":[{"id":48,"text":"could be how much force you apply on each of the joints,","zh":"可能是你在每个关节上施加的力的大小，","start":699.7,"end":702.82},{"id":49,"text":"so on and so forth.","zh":"等等。","start":703.02,"end":703.84},{"id":50,"text":"And for Go, it's kind of like which location","zh":"而对于围棋，它类似于你选择在哪个位置进行落子，","start":705.72,"end":708.58},{"id":51,"text":"you make a move at.","zh":"即你进行移动的位置。","start":708.58,"end":711.72},{"id":52,"text":"that. So that's the set of state actions.","zh":"这就是状态动作的集合。","start":711.72,"end":717.56},{"id":53,"text":"Now, the third concept is the so-called transition dynamics.","zh":"现在，第三个概念是所谓的转移动态。","start":718.08,"end":722.2},{"id":54,"text":"What does that mean is that this is describing","zh":"这意味着这是在描述","start":729.76,"end":731.88},{"id":55,"text":"what will happen if you take an action on a state S.","zh":"如果你在一个状态 S 上采取一个动作会发生什么。","start":732.54,"end":736.52},{"id":56,"text":"So basically, the transition dynamics is asking,","zh":"所以基本上，状态转移动态是在问，","start":736.7,"end":739.02},{"id":57,"text":"if you're given a state S in capital S","zh":"如果你被给定一个状态 S（大写 S）","start":739.02,"end":743.76},{"id":58,"text":"and you apply an action A in capital A,","zh":"并且你执行一个动作 A（大写 A）","start":743.76,"end":747.02},{"id":59,"text":"so what will happen next?","zh":"那么接下来会发生什么？","start":747.56,"end":749.08},{"id":60,"text":"So which state I'm going to move to?","zh":"我会转移到哪个状态？","start":754.54,"end":756.4},{"id":61,"text":"And it's a probability distribution.","zh":"这是一个概率分布。","start":758.0,"end":759.76},{"id":62,"text":"So the typical way people do this","zh":"所以人们通常这样处理这个问题","start":760.26,"end":763.2},{"id":63,"text":"is that this is the state,","zh":"这就是状态，","start":763.2,"end":764.06},{"id":64,"text":"the concrete state you are at.","start":764.2,"end":766.12},{"id":65,"text":"This is the concrete action you apply.","start":766.16,"end":767.36},{"id":66,"text":"And this is a probabilistic distribution over the next state, the set of possible states, right?","start":767.36,"end":773.62},{"id":67,"text":"So this is describing what is the chance you arrive at each of the state.","start":773.7,"end":776.96},{"id":68,"text":"So in some sense, you know,","start":778.26,"end":779.9},{"id":69,"text":"p, s, z","start":779.94,"end":781.44},{"id":70,"text":"Z, this is the chance to arrive at Z after taking action A on the state S. So it's a probability distribution over the entire state space. So PSA, this is actual vector in dimension.","start":783.79,"end":816.64},{"id":71,"text":"the s, right, the cardinality of s. So, of course, in many cases, PSA can be deterministic. You exactly know which is the next state you want to verify it. So in those cases, PSA can just output exactly the s prime, the next state you want. But in many other cases, it's stochastic. Then it's the distribution. So, for example, in this case, you can imagine, for example, suppose your controller is not very accurate, right? So there's some kind of, like,","start":818.75,"end":849.47},{"id":72,"text":"errors in your controller. When you say, I'm going left, with some chances it's going left, and with some other chances it's actually going right. So then you can, in this example, then you can say, oh, maybe I can say, given, let's say, the P, let's say, seven L, given I'm at the cell seven, I'm instructed to go left, what is the chance to go to the next?","start":849.98,"end":877.96}],"notes":["本段讲解了状态与动作的转移动态，即在给定当前状态和动作的情况下，系统将转移到下一个状态的概率分布。这种分布可以是确定性的，也可以是随机性的，取决于系统的设计。","在确定性情况下，转移动态会精确地给出下一个状态；而在随机性情况下，它会给出一个概率分布，表示到达各个可能状态的可能性。","举例说明了控制器不准确时的情况，即在执行动作时可能会出现误差，导致实际转移状态与预期不同。这种情况下，转移动态的概率分布可以用来描述这种不确定性。","讲者提到，当在某个状态执行某个动作时，系统会转移到下一个状态，而这个转移过程的概率分布是整个状态空间上的分布。","讲者还提到，PSA（可能指概率转移函数）可以是一个向量，其维度与状态空间的大小有关，这表明状态空间的大小会影响转移动态的表示方式。","最后，讲者以一个具体的例子说明了如何计算在某个状态执行某个动作后，转移到下一个状态的概率。"],"formulas":[],"uncertainties":["PSA可能指概率转移函数，但未明确说明","讲者提到PSA是实际向量，但未明确其数学表达式","讲者提到PSA的维度与状态空间的大小有关，但未明确数学关系"],"diagram":"none","start":699.7,"end":877.96,"asr_flags":[],"boards":[],"translation_complete":false,"translated_segments":16,"raw_segments":[{"start":699.7,"text":"could be how much force you apply on each of the joints,"},{"start":703.02,"text":"so on and so forth."},{"start":705.72,"text":"And for Go, it's kind of like which location"},{"start":708.58,"text":"you make a move at."},{"start":711.72,"text":"that. So that's the set of state actions."},{"start":718.08,"text":"Now, the third concept is the so-called transition dynamics."},{"start":729.76,"text":"What does that mean is that this is describing"},{"start":732.54,"text":"what will happen if you take an action on a state S."},{"start":736.7,"text":"So basically, the transition dynamics is asking,"},{"start":739.02,"text":"if you're given a state S in capital S"},{"start":743.76,"text":"and you apply an action A in capital A,"},{"start":747.56,"text":"so what will happen next?"},{"start":754.54,"text":"So which state I'm going to move to?"},{"start":758.0,"text":"And it's a probability distribution."},{"start":760.26,"text":"So the typical way people do this"},{"start":763.2,"text":"is that this is the state,"},{"start":764.2,"text":"the concrete state you are at."},{"start":766.16,"text":"This is the concrete action you apply."},{"start":767.36,"text":"And this is a probabilistic distribution over the next state, the set of possible states, right?"},{"start":773.7,"text":"So this is describing what is the chance you arrive at each of the state."},{"start":778.26,"text":"So in some sense, you know,"},{"start":779.94,"text":"p, s, z"},{"start":783.79,"text":"Z, this is the chance to arrive at Z after taking action A on the state S. So it's a probability distribution over the entire state space. So PSA, this is actual vector in dimension."},{"start":818.75,"text":"the s, right, the cardinality of s. So, of course, in many cases, PSA can be deterministic. You exactly know which is the next state you want to verify it. So in those cases, PSA can just output exactly the s prime, the next state you want. But in many other cases, it's stochastic. Then it's the distribution. So, for example, in this case, you can imagine, for example, suppose your controller is not very accurate, right? So there's some kind of, like,"},{"start":849.98,"text":"errors in your controller. When you say, I'm going left, with some chances it's going left, and with some other chances it's actually going right. So then you can, in this example, then you can say, oh, maybe I can say, given, let's say, the P, let's say, seven L, given I'm at the cell seven, I'm instructed to go left, what is the chance to go to the next?"}],"speech_gaps":[{"start":781.84,"end":783.39}],"frame":"../frames/v039/005.webp","frame_time":711.7},{"title":"马尔可夫决策过程与状态转移概率","segments":[{"id":73,"text":"Let's say suppose this is seven and you instruct it to go left, what is the chance to go to six? You say the chance to go to six is probably 0.9 because I'm instructing it to go to left, but there's also a chance that it stays at seven. Let's say you also have a chance that T7L7 is 0.1. These two sum up to one and all the other states have zero mass because you cannot go to any other states, let's say.","zh":"假设这个状态是七，你指示它向左移动，那么转移到六的概率是多少？你说转移到六的概率大概是0.9，因为你是指示它向左移动，但也有可能它留在七。假设你还有转移到七的概率是0.1。这两个概率加起来等于1，而其他所有状态的概率都是零，因为不能转移到其他状态。","start":879.03,"end":904.75},{"id":74,"text":"This is just an example. But you have to define this for every possible S and A and the next state S prime. So you can say only PSL8 is zero because if I tell you to go to left, you probably shouldn't go right. PS7L5 should be zero as well because it's very hard to go.","zh":"这只是个例子。但你必须为每一个可能的S和A以及下一个状态S prime定义这些概率。因此你可以只说PSL8为零，因为如果你被指示向左移动，你大概率不应该向右移动。PS7L5也应该为零，因为很难跳转到那里。","start":905.46,"end":927.64},{"id":75,"text":"to jump to two cells. All the other argument here will result in zero.","zh":"跳转到两个单元格。这里的所有其他参数都会导致零。","start":928.09,"end":936.73},{"id":76,"text":"Then you define this for every possible S, A, and S prime or Z. I guess I'm using Z here. Maybe I should use S prime just to be more consistent. Sorry. For every S, A, S prime, you have a probability number and you have to make sure the sum of this is one for each of the fixed S and A.","zh":"然后你为每一个可能的S、A和S prime或Z定义这些概率。我想我在这里用了Z。也许我应该用S prime来保持更一致。抱歉。对于每一个S、A和S prime，你都有一个概率值，并且必须确保对于每个固定的S和A，这些概率值的总和等于1。","start":937.4,"end":959.48},{"id":77,"text":"So that's how you, yeah, so basically the constraint is that the sum over all the S prime in the possible dynamic state, P, S, A, S prime is equal to one. This is a probability distribution. Okay, so this is, then you describe the dynamics.","zh":"因此，这就是如何描述这个过程。是的，所以基本上约束条件是，所有可能动态状态S prime上的概率总和等于1。这是一个概率分布。好的，因此，这就是如何描述动态。","start":961.61,"end":979.68},{"id":78,"text":"So after you have these three things, you can describe the game. It's kind of like a sequential decision, how you interact. The way to interact is very intuitive. So you have S0, let's say, this is the initial state. Here, this is indexing time, initial state. And then the algorithm or the agent, the algorithm, these days people call it agent. So choose this action, say action.","zh":"在你有了这三个要素之后，你就可以描述这个游戏了。它有点像一个顺序决策过程，描述你如何与环境互动。互动的方式非常直观。你有S0，假设这是初始状态。这里，这是时间索引，初始状态。然后算法或智能体，现在人们称之为智能体。所以选择这个动作，比如说动作。","start":980.38,"end":1009.91},{"id":79,"text":"let's say A0 from the set of states. Then there is an environment step, meaning that you are interacting with the environments. Your action is making an effect. That means you are sampling from this distribution P as 0, A0, because we recall that this is the distribution of the next state.","zh":"假设从状态集合中选择A0。然后有一个环境步骤，意味着你正在与环境互动。你的动作会产生影响。这意味着你从这个分布P作为0、A0中进行采样，因为我们记得这是下一个状态的分布。","start":1010.79,"end":1036.74}],"notes":["本段讲解了马尔可夫决策过程（MDP）中的状态转移概率定义。通过一个具体例子，说明了在给定当前状态和动作的情况下，如何计算转移到下一个状态的概率。例如，当处于状态7并执行左移动作时，转移到状态6的概率为0.9，留在状态7的概率为0.1，其他状态的概率为0。","讲者强调，对于每一个可能的状态S、动作A和下一个状态S'，都需要定义相应的转移概率，并且这些概率的总和必须为1。这是概率分布的基本性质，确保了所有可能的转移都被考虑。","讲者指出，对于某些状态转移，如从状态7到状态5，由于物理限制或动作定义，其转移概率应为0。这体现了状态转移概率的约束条件。","讲者提到，为了保持一致性，应使用S'表示下一个状态，而不是Z。这表明在定义状态转移概率时，符号的使用需要统一。","讲者进一步说明，状态转移概率的定义需要满足总和为1的条件，这是概率分布的基本要求。这为后续的动态过程建模奠定了基础。","最后，讲者介绍了MDP的基本框架，包括初始状态S0、动作选择A0以及环境步骤，即根据状态转移概率进行状态采样。这展示了MDP如何建模序列决策过程。"],"formulas":[],"uncertainties":["P as 0, A0"],"diagram":"none","start":879.03,"end":1036.74,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":879.03,"text":"Let's say suppose this is seven and you instruct it to go left, what is the chance to go to six? You say the chance to go to six is probably 0.9 because I'm instructing it to go to left, but there's also a chance that it stays at seven. Let's say you also have a chance that T7L7 is 0.1. These two sum up to one and all the other states have zero mass because you cannot go to any other states, let's say."},{"start":905.46,"text":"This is just an example. But you have to define this for every possible S and A and the next state S prime. So you can say only PSL8 is zero because if I tell you to go to left, you probably shouldn't go right. PS7L5 should be zero as well because it's very hard to go."},{"start":928.09,"text":"to jump to two cells. All the other argument here will result in zero."},{"start":937.4,"text":"Then you define this for every possible S, A, and S prime or Z. I guess I'm using Z here. Maybe I should use S prime just to be more consistent. Sorry. For every S, A, S prime, you have a probability number and you have to make sure the sum of this is one for each of the fixed S and A."},{"start":961.61,"text":"So that's how you, yeah, so basically the constraint is that the sum over all the S prime in the possible dynamic state, P, S, A, S prime is equal to one. This is a probability distribution. Okay, so this is, then you describe the dynamics."},{"start":980.38,"text":"So after you have these three things, you can describe the game. It's kind of like a sequential decision, how you interact. The way to interact is very intuitive. So you have S0, let's say, this is the initial state. Here, this is indexing time, initial state. And then the algorithm or the agent, the algorithm, these days people call it agent. So choose this action, say action."},{"start":1010.79,"text":"let's say A0 from the set of states. Then there is an environment step, meaning that you are interacting with the environments. Your action is making an effect. That means you are sampling from this distribution P as 0, A0, because we recall that this is the distribution of the next state."}],"speech_gaps":[],"frame":"../frames/v039/006.webp","frame_time":891.03},{"title":"强化学习中的状态、动作与奖励","segments":[{"id":80,"text":"given the action A0 on the state S0. So you sample one state from that distribution. It's a stochastic step. And then you get S1. And then the next time, the algorithm will choose action A1, mostly likely from the observation S1. We're going to talk about how the algorithm choose the action A1. But the algorithm choose the action A1 in some way. And then you do the environment step again.","zh":"给定在状态 S0 上采取的动作 A0。因此，你从该分布中采样一个状态。这是一个随机步骤。然后你得到 S1。接下来，算法会根据观察到的 S1 选择动作 A1，最有可能的是。我们将讨论算法如何选择动作 A1。但算法以某种方式选择动作 A1。然后你再次执行环境步骤。","start":1037.65,"end":1068.78},{"id":81,"text":"So S2 is from P S1 A1. And then you just loop over this. So each time you're making a decision on the actions and then you transition to a new state. Okay, so that describes how the world is changing over time based on our decision. And then the next concept is the reward.","zh":"因此，S2 来自 P(S1, A1)。然后你只需循环这个过程。每次你都在做出动作的决策，然后转移到新的状态。好的，因此这描述了我们的决策如何随时间改变世界。接下来的概念是奖励。","start":1070.35,"end":1093.94},{"id":82,"text":"Recall that this is actually how we learn this thing.","zh":"请记住，这实际上是我们在学习这个事物的方式。","start":1095.49,"end":1098.35},{"id":83,"text":"It's also how we define success,","zh":"这也是我们定义成功的方式，","start":1098.53,"end":1099.99},{"id":84,"text":"because so far we are just talking about how do we interact with the world,","zh":"因为到目前为止，我们只是在讨论如何与世界互动，","start":1100.31,"end":1104.07},{"id":85,"text":"but we also have to define what does it mean by successfully achieving some goal.","zh":"但我们还必须定义什么是成功地实现某个目标。","start":1104.23,"end":1108.79},{"id":86,"text":"So the reward is a function.","zh":"因此，奖励是一个函数。","start":1110.17,"end":1112.63},{"id":87,"text":"This is a function that maps the state set,","zh":"这是一个将状态集映射的函数，","start":1113.07,"end":1115.17},{"id":88,"text":"the set of states to real number.","zh":"状态到实数的集合。","start":1115.25,"end":1118.35},{"id":89,"text":"Also it's non-active in the real number,","zh":"它在实数中也是非活跃的，","start":1119.01,"end":1120.79},{"id":90,"text":"but you can also have negative reward.","zh":"但你也可以有负奖励。","start":1120.95,"end":1122.43},{"id":91,"text":"reward. So, and, you know,","zh":"奖励。所以，而且，你明白，","start":1122.43,"end":1127.27},{"id":92,"text":"often this is kind of like something close to","zh":"这通常类似于某种接近","start":1127.27,"end":1128.95},{"id":93,"text":"probably minus one to one, something like that.","zh":"可能在负一到一之间，类似这样的范围。","start":1128.95,"end":1130.89},{"id":94,"text":"And, and this reward just really means that","zh":"而且，这个奖励实际上只是意味着","start":1132.11,"end":1134.29},{"id":95,"text":"how good is this state is, right?","zh":"这个状态有多好，对吧？","start":1134.29,"end":1139.37},{"id":96,"text":"So, you see that this is a function, you know.","zh":"所以，你能看出这是一个函数，对吧。","start":1139.43,"end":1141.05},{"id":97,"text":"So, this is a function of the state, right?","zh":"所以，这是状态的函数，对吧。","start":1141.41,"end":1143.41},{"id":98,"text":"So, it's describing whether the state is preferable or not.","zh":"所以，它是在描述这个状态是否更可取。","start":1143.45,"end":1145.93},{"id":99,"text":"And in other cases, you know,","zh":"在其他情况下，你知道的，","start":1146.47,"end":1148.37},{"id":100,"text":"people have defined reward,","zh":"人们已经定义了奖励，","start":1148.37,"end":1149.49},{"id":101,"text":"reward which is a function of the state and action.","zh":"奖励是一个状态和动作的函数。","start":1149.49,"end":1152.21},{"id":102,"text":"So, you are saying that this pair","zh":"所以，你在说这个状态和动作的组合","start":1152.45,"end":1154.55},{"id":103,"text":"of the state and action is good or not.","zh":"是好还是坏。","start":1154.55,"end":1156.15},{"id":104,"text":"you can even define reward as a function of state,","zh":"你可以将奖励定义为状态的函数，","start":1157.11,"end":1158.69},{"id":105,"text":"you can even define reward as a function of state,","zh":"你可以将奖励定义为状态的函数，","start":1158.79,"end":1161.13},{"id":106,"text":"so that the reward is a function of the tuple, S, A, and S.","zh":"这样奖励就是状态、动作和下一个状态这个元组的函数。","start":1161.27,"end":1162.93},{"id":107,"text":"so that the reward is a function of the tuple, S, A, and S.","zh":"这样奖励就是状态、动作和下一个状态这个元组的函数。","start":1163.05,"end":1167.29},{"id":108,"text":"almost doesn't change at all if you use this version or this version. But for simplicity, we're just going to work with this simple reward function which is only a function of the state. In this case, suppose you are trying to achieve some goal here. I guess my drawing is a little bit, maybe let's say this is like 20, and let's say this goal is like maybe let's say nine. So how do you describe, how do you encode","zh":"如果你使用这种版本或那种版本，几乎不会有任何变化。但为了简化，我们只考虑这种简单的奖励函数，它仅是状态的函数。在这种情况下，假设你正在尝试实现某个目标。我想我的画可能有点问题，也许我们可以这样说，这里是一个20，而目标可能是比如说9。那么你如何描述，如何编码","start":1172.02,"end":1201.16}],"notes":["本段讲解了强化学习中状态、动作和奖励的基本概念。首先，课程描述了智能体如何在状态空间中进行决策，通过选择动作来转移到新的状态。接着，课程引入了奖励函数的概念，说明奖励是状态到实数的映射，用于衡量状态的好坏。奖励可以是正数或负数，通常范围在-1到1之间。此外，课程还提到奖励函数可以扩展为状态和动作的函数，甚至可以包括下一个状态，以更全面地描述奖励的来源。","课程进一步指出，奖励函数的定义方式会影响智能体的学习过程。在某些情况下，奖励仅依赖于当前状态，而在其他情况下，奖励可能依赖于状态、动作以及下一个状态的组合。这种扩展的奖励函数可以更细致地捕捉智能体在执行动作后所获得的即时反馈。","课程还提到，奖励函数的定义方式对学习目标的实现至关重要。通过定义奖励函数，智能体可以学习如何在环境中做出最优决策，以最大化累积奖励。这种机制是强化学习的核心思想之一。","在实际应用中，奖励函数的设计需要根据具体任务进行调整。例如，在某些任务中，奖励可能仅依赖于当前状态，而在其他任务中，奖励可能依赖于动作和下一个状态的组合。这种灵活性使得强化学习能够适应各种不同的应用场景。"],"formulas":[],"uncertainties":["reward is a function of the tuple, S, A, and S."],"diagram":"none","start":1037.65,"end":1201.16,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":1037.65,"text":"given the action A0 on the state S0. So you sample one state from that distribution. It's a stochastic step. And then you get S1. And then the next time, the algorithm will choose action A1, mostly likely from the observation S1. We're going to talk about how the algorithm choose the action A1. But the algorithm choose the action A1 in some way. And then you do the environment step again."},{"start":1070.35,"text":"So S2 is from P S1 A1. And then you just loop over this. So each time you're making a decision on the actions and then you transition to a new state. Okay, so that describes how the world is changing over time based on our decision. And then the next concept is the reward."},{"start":1095.49,"text":"Recall that this is actually how we learn this thing."},{"start":1098.53,"text":"It's also how we define success,"},{"start":1100.31,"text":"because so far we are just talking about how do we interact with the world,"},{"start":1104.23,"text":"but we also have to define what does it mean by successfully achieving some goal."},{"start":1110.17,"text":"So the reward is a function."},{"start":1113.07,"text":"This is a function that maps the state set,"},{"start":1115.25,"text":"the set of states to real number."},{"start":1119.01,"text":"Also it's non-active in the real number,"},{"start":1120.95,"text":"but you can also have negative reward."},{"start":1122.43,"text":"reward. So, and, you know,"},{"start":1127.27,"text":"often this is kind of like something close to"},{"start":1128.95,"text":"probably minus one to one, something like that."},{"start":1132.11,"text":"And, and this reward just really means that"},{"start":1134.29,"text":"how good is this state is, right?"},{"start":1139.43,"text":"So, you see that this is a function, you know."},{"start":1141.41,"text":"So, this is a function of the state, right?"},{"start":1143.45,"text":"So, it's describing whether the state is preferable or not."},{"start":1146.47,"text":"And in other cases, you know,"},{"start":1148.37,"text":"people have defined reward,"},{"start":1149.49,"text":"reward which is a function of the state and action."},{"start":1152.45,"text":"So, you are saying that this pair"},{"start":1154.55,"text":"of the state and action is good or not."},{"start":1157.11,"text":"Sometimes, in the extreme case,"},{"start":1158.79,"text":"you can even define reward as a function of state,"},{"start":1161.27,"text":"action, and the next state,"},{"start":1163.05,"text":"so that the reward is a function of the tuple, S, A, and S."},{"start":1172.02,"text":"almost doesn't change at all if you use this version or this version. But for simplicity, we're just going to work with this simple reward function which is only a function of the state. In this case, suppose you are trying to achieve some goal here. I guess my drawing is a little bit, maybe let's say this is like 20, and let's say this goal is like maybe let's say nine. So how do you describe, how do you encode"}],"speech_gaps":[{"start":1167.69,"end":1169.296}],"frame":"../frames/v039/007.webp","frame_time":1049.65},{"title":"奖励函数设计与奖励塑造","segments":[{"id":109,"text":"the goal being 9 into a reward function, it's very simple. You just say the reward at this goal state 9 is 1, let's say. So reaching any other state, let's say, is a minus 1, minus 0.1, let's say, for any state that is not equal to 9.","zh":"将目标9转化为奖励函数，这非常简单。你只需说在目标状态9处的奖励为1，比如说。到达任何其他状态，比如说，会给予-1或-0.1的奖励，对于任何不等于9的状态。","start":1203.31,"end":1226.72},{"id":110,"text":"So suppose you define it like this, then naturally, if the reward is higher, then you are reaching the state 9 that you prefer. And you are costing yourself some negative reward if you are wandering around on other states. So basically, if you define a reward like this, in some sense, you are encouraging the robot to reach the state 9 as fast as possible and stay there.","zh":"因此，如果你这样定义奖励，那么奖励越高，你就越倾向于到达你偏好的状态9。如果你在其他状态徘徊，就会被给予一些负奖励。因此，基本上，如果你这样定义奖励，从某种意义上说，你是在鼓励机器人尽可能快地到达状态9并停留在那里。","start":1228.36,"end":1251.8},{"id":111,"text":"spending time on any other states is actually costing you negative reward, which is definitely not good. So that's possible, but I think there is a little bit subtlety here. First of all, this is our choice. You can define the reward any way you want in some sense. So if you believe that getting close is","zh":"在任何其他状态上花费时间实际上是在消耗负奖励，这显然是不好的。所以这是可能的，但我认为这里有一些微妙之处。首先，这是我们的选择。从某种意义上说，你可以以任何方式定义奖励。因此，如果你相信到达8比到达7更好，","start":1255.55,"end":1287.75},{"id":112,"text":"already being at eight is better than being at seven.","zh":"那么已经到达8比到达7更好。","start":1288.35,"end":1292.81},{"id":113,"text":"So there are two things. One reason you do this is because you just fundamentally believe that being at eight is better than being at seven. And being at eight is somehow useful for you, even though it's not exactly at nine. So that's one possibility. It's just from some external information, this is your preferences. You can also do this, but it could also be that I only care about being at nine, I don't really care about being at any other position, but I still define my reward with a gradual,","zh":"有两个原因。一个原因是，你这样做是因为你根本上认为到达8比到达7更好。即使它还不是9，到达8对你来说在某种程度上是有用的。因此，这是其中一种可能性。这仅仅来自一些外部信息，这是你的偏好。你也可以这样做，但这也可能是我只关心到达9，对到达任何其他位置都不太在意，但我仍然用一种渐变的方式定义我的奖励，","start":1293.41,"end":1322.49},{"id":114,"text":"like a slope. So that could have an algorithmic effect. So in a sense that if you define a reward like that, then maybe the algorithm is learning more easily because you have more gradient, so on and so forth. So that's like a definition of reward is called reward shaping.","zh":"比如一个斜率。这可能会对算法产生影响。因此，从某种意义上说，如果你这样定义奖励，算法可能更容易学习，因为你会有更多的梯度，如此等等。这种奖励的定义被称为奖励塑造。","start":1323.09,"end":1339.71},{"id":115,"text":"So basically, you care about some very discrete, fundamentally, just only one thing. But actually, you change your reward a little bit to make it smoother in some sense. So these are two different ways to define different rewards. But fundamentally, this is your option. Whatever you want to do is fine. And the reward-shaping stuff sometimes has unexpected downside. For example, suppose there is a","zh":"基本上，你只关心一些非常离散、根本上只有一件事。但实际上，你稍微调整一下奖励，使其在某种意义上更平滑。因此，这是两种定义不同奖励的不同方式。但从根本上说，这是你的选择。无论你想做什么都是可以的。有时奖励塑造可能会带来意想不到的负面影响。例如，假设存在一个","start":1340.32,"end":1369.3}],"notes":["本段讲解了奖励函数的设计方法，其中提到将目标状态9的奖励设为1，其他状态的奖励设为-1或-0.1。这种设计鼓励智能体快速到达目标状态并保持在那里，避免在其他状态花费时间。"],"formulas":[],"uncertainties":["getting close is"],"diagram":"none","start":1203.31,"end":1369.3,"asr_flags":[111],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1203.31,"text":"the goal being 9 into a reward function, it's very simple. You just say the reward at this goal state 9 is 1, let's say. So reaching any other state, let's say, is a minus 1, minus 0.1, let's say, for any state that is not equal to 9."},{"start":1228.36,"text":"So suppose you define it like this, then naturally, if the reward is higher, then you are reaching the state 9 that you prefer. And you are costing yourself some negative reward if you are wandering around on other states. So basically, if you define a reward like this, in some sense, you are encouraging the robot to reach the state 9 as fast as possible and stay there."},{"start":1255.55,"text":"spending time on any other states is actually costing you negative reward, which is definitely not good. So that's possible, but I think there is a little bit subtlety here. First of all, this is our choice. You can define the reward any way you want in some sense. So if you believe that getting close is"},{"start":1288.35,"text":"already being at eight is better than being at seven."},{"start":1293.41,"text":"So there are two things. One reason you do this is because you just fundamentally believe that being at eight is better than being at seven. And being at eight is somehow useful for you, even though it's not exactly at nine. So that's one possibility. It's just from some external information, this is your preferences. You can also do this, but it could also be that I only care about being at nine, I don't really care about being at any other position, but I still define my reward with a gradual,"},{"start":1323.09,"text":"like a slope. So that could have an algorithmic effect. So in a sense that if you define a reward like that, then maybe the algorithm is learning more easily because you have more gradient, so on and so forth. So that's like a definition of reward is called reward shaping."},{"start":1340.32,"text":"So basically, you care about some very discrete, fundamentally, just only one thing. But actually, you change your reward a little bit to make it smoother in some sense. So these are two different ways to define different rewards. But fundamentally, this is your option. Whatever you want to do is fine. And the reward-shaping stuff sometimes has unexpected downside. For example, suppose there is a"}],"speech_gaps":[{"start":1252.2,"end":1255.15}],"frame":"../frames/v039/008.webp","frame_time":1215.31},{"title":"奖励函数设计与轨迹回报","segments":[{"id":116,"text":"Because you never know. Suppose in this case, it's very clear, but what if you have a teleporting tunnel from state 2 to state 9, and which you didn't know when you define the reward?","zh":"因为你不了解情况。假设在这个情况下，情况很明确，但如果存在从状态2到状态9的传送隧道，而你在定义奖励时并不知道这种情况呢？","start":1370.08,"end":1384.39},{"id":117,"text":"So then you say getting closer to nine is better,","zh":"那么你可能会说，离九越近越好，","start":1385.22,"end":1388.22},{"id":118,"text":"but actually the best option you might be just going to two and then","zh":"但实际上，你可能最好的选择是先去状态2，","start":1388.36,"end":1391.1},{"id":119,"text":"somehow do something crazy to teleport to nine in some way.","zh":"然后以某种方式做些疯狂的事情来传送至状态9。","start":1391.1,"end":1394.3},{"id":120,"text":"Here it's crazy, but it's more likely in the robotics case.","zh":"在这里，这种情况看起来很疯狂，但在机器人学的例子中更有可能出现。","start":1398.14,"end":1401.3},{"id":121,"text":"For example, if you want to reach some object,","zh":"例如，如果你想到达某个物体，","start":1401.42,"end":1403.38},{"id":122,"text":"you may naturally think, okay,","zh":"你可能会自然地认为，","start":1404.04,"end":1405.54},{"id":123,"text":"the closer I am the better.","zh":"我越接近越好。","start":1405.6,"end":1406.96},{"id":124,"text":"So basically I have reward 0.9 here and 0.8 here and 0.7 here.","zh":"所以基本上我这里奖励是0.9，这里0.8，这里0.7。","start":1407.8,"end":1412.66},{"id":125,"text":"here but what if there's something blocking here,","zh":"这里，但如果这里有什么东西挡着，","start":1412.66,"end":1415.26},{"id":126,"text":"and you have to go around,","zh":"你必须绕过去，","start":1415.42,"end":1416.96},{"id":127,"text":"and then your reward function is not","zh":"那么你的奖励函数就","start":1417.56,"end":1419.16},{"id":128,"text":"actually meaningful in some sense.","zh":"在某种意义上并不有意义。","start":1419.16,"end":1421.16},{"id":129,"text":"You are doing some damage to,","zh":"你在对","start":1421.24,"end":1422.28},{"id":130,"text":"you are misguiding the robot.","zh":"你正在误导机器人。","start":1423.02,"end":1425.04},{"id":131,"text":"So you should just really care about the final outcome.","zh":"所以你应该真正关注的是最终结果。","start":1426.14,"end":1428.28},{"id":132,"text":".","zh":".","start":1429.38,"end":1429.78},{"id":133,"text":"Sometimes you know, right?","zh":"有时候你是知道的，对吧？","start":1439.56,"end":1440.7},{"id":134,"text":"Yeah.","zh":"是的。","start":1440.86,"end":1441.26},{"id":135,"text":"Yeah, so when you know, then you probably can do the reward shaping more effectively.","zh":"是的，当你知道的时候，你可能就能更有效地进行奖励塑造。","start":1441.26,"end":1445.4},{"id":136,"text":"If you don't know or you have little understanding, sometimes you know, but you cannot understand it.","zh":"如果你不知道或者你了解得很少，有时候你是知道的，但你无法理解它。","start":1445.6,"end":1450.42},{"id":137,"text":"But it's too complex and so on and so forth.","zh":"但它太复杂了，诸如此类的问题。","start":1450.58,"end":1452.28},{"id":138,"text":"Then maybe it's better to just focus on the core requests.","zh":"那么也许更好的做法是专注于核心需求。","start":1452.4,"end":1456.76},{"id":139,"text":"Sometimes it's kind of like, suppose you have a manager who manages a team.","zh":"有时候这就像，假设你有一个经理在管理一个团队。","start":1457.78,"end":1463.16},{"id":140,"text":"And if the manager knows exactly what to do, then you probably get very fine-grained reward functions.","start":1463.4,"end":1468.02},{"id":141,"text":"But some managers just be very hands off and say,","start":1468.02,"end":1471.98},{"id":142,"text":"this is my final goal.","start":1472.02,"end":1472.9},{"id":143,"text":"Whatever, how you achieve it, I don't care, right?","start":1473.06,"end":1474.6},{"id":144,"text":".","start":1476.58,"end":1476.98},{"id":145,"text":"Agents changing their .","start":1478.82,"end":1480.46},{"id":146,"text":"No, no, no, not here.","start":1481.92,"end":1484.06},{"id":147,"text":"Yeah, I think generally not very, yeah. So the agent is, the reward is actually the overarching incentive mechanism for the agent. I don't think you can change that, you know, in most of cases, yeah. So, okay, sounds good. So, okay.","start":1485.64,"end":1508.36},{"id":148,"text":"But this is only a reward for one state. Actually, we haven't defined the reward or return or payoff for the whole trajectory. So what happens is that you have a sequence of steps. So you start with S0, as we discussed, and you generate action A0, and then you reach action S1, and you generate another action A1, and you do this, so on and so forth.","start":1509.02,"end":1534.06}],"notes":["本段讨论了奖励函数设计中的潜在问题，特别是在存在障碍物或复杂环境时，简单的距离奖励可能无法准确反映实际效果。讲者指出，如果直接使用距离作为奖励，可能会误导智能体，使其采取不合理的路径，从而影响最终目标的实现。","讲者通过机器人导航的例子说明，当环境复杂时，仅依赖局部奖励（如距离）可能无法有效引导智能体完成任务。例如，如果路径被阻挡，智能体可能需要绕行，此时距离奖励可能不再有意义，甚至可能误导其行为。","讲者进一步强调，奖励函数的设计应关注最终目标，而非局部状态。如果奖励函数无法准确反映最终目标，可能会导致智能体采取次优策略，甚至产生有害行为。","讲者还提到，奖励函数的设计需要根据对环境的理解程度进行调整。如果对环境了解有限，可能需要简化奖励函数，仅关注核心目标，避免过度复杂化。","讲者以经理管理团队的类比说明，奖励函数的设计类似于管理方式：如果管理者了解具体任务，可以设计精细的奖励；如果管理者只关注最终目标，可能采用更粗略的奖励机制。","最后，讲者指出，奖励函数是智能体行为的核心激励机制，不能随意更改。因此，在设计奖励函数时，需要充分考虑环境特性和任务目标，以确保智能体能够有效完成任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1370.08,"end":1534.06,"asr_flags":[135,136,137,138,139,140],"boards":[],"translation_complete":false,"translated_segments":24,"raw_segments":[{"start":1370.08,"text":"Because you never know. Suppose in this case, it's very clear, but what if you have a teleporting tunnel from state 2 to state 9, and which you didn't know when you define the reward?"},{"start":1385.22,"text":"So then you say getting closer to nine is better,"},{"start":1388.36,"text":"but actually the best option you might be just going to two and then"},{"start":1391.1,"text":"somehow do something crazy to teleport to nine in some way."},{"start":1398.14,"text":"Here it's crazy, but it's more likely in the robotics case."},{"start":1401.42,"text":"For example, if you want to reach some object,"},{"start":1404.04,"text":"you may naturally think, okay,"},{"start":1405.6,"text":"the closer I am the better."},{"start":1407.8,"text":"So basically I have reward 0.9 here and 0.8 here and 0.7 here."},{"start":1412.66,"text":"here but what if there's something blocking here,"},{"start":1415.42,"text":"and you have to go around,"},{"start":1417.56,"text":"and then your reward function is not"},{"start":1419.16,"text":"actually meaningful in some sense."},{"start":1421.24,"text":"You are doing some damage to,"},{"start":1423.02,"text":"you are misguiding the robot."},{"start":1426.14,"text":"So you should just really care about the final outcome."},{"start":1429.38,"text":"."},{"start":1439.56,"text":"Sometimes you know, right?"},{"start":1440.86,"text":"Yeah."},{"start":1441.26,"text":"Yeah, so when you know, then you probably can do the reward shaping more effectively."},{"start":1445.6,"text":"If you don't know or you have little understanding, sometimes you know, but you cannot understand it."},{"start":1450.58,"text":"But it's too complex and so on and so forth."},{"start":1452.4,"text":"Then maybe it's better to just focus on the core requests."},{"start":1457.78,"text":"Sometimes it's kind of like, suppose you have a manager who manages a team."},{"start":1463.4,"text":"And if the manager knows exactly what to do, then you probably get very fine-grained reward functions."},{"start":1468.02,"text":"But some managers just be very hands off and say,"},{"start":1472.02,"text":"this is my final goal."},{"start":1473.06,"text":"Whatever, how you achieve it, I don't care, right?"},{"start":1476.58,"text":"."},{"start":1478.82,"text":"Agents changing their ."},{"start":1481.92,"text":"No, no, no, not here."},{"start":1485.64,"text":"Yeah, I think generally not very, yeah. So the agent is, the reward is actually the overarching incentive mechanism for the agent. I don't think you can change that, you know, in most of cases, yeah. So, okay, sounds good. So, okay."},{"start":1509.02,"text":"But this is only a reward for one state. Actually, we haven't defined the reward or return or payoff for the whole trajectory. So what happens is that you have a sequence of steps. So you start with S0, as we discussed, and you generate action A0, and then you reach action S1, and you generate another action A1, and you do this, so on and so forth."}],"speech_gaps":[{"start":1394.7,"end":1397.74},{"start":1434.256,"end":1436.336}],"frame":"../frames/v039/009.webp","frame_time":1382.08},{"title":"强化学习中的轨迹、回报与折扣因子","segments":[{"id":149,"text":"So typically, the reward for the whole thing, I think this whole thing is often called a trajectory. In the old days, it's often called episode in the more standard RL settings. But I think trajectory seems to be more common word. So for this whole trajectory, you can define a payoff or reward function or return. I think often people call it return or payoff by just summing up the reward at every state.","zh":"通常，整个过程的奖励，我认为整个过程经常被称为轨迹。在更传统的强化学习设置中，它通常被称为episode。但我觉得轨迹似乎是一个更常用的词。因此，对于整个轨迹，你可以定义一个收益或奖励函数或回报。我认为人们通常通过将每个状态的奖励相加来称其为回报或收益。","start":1536.31,"end":1563.14},{"id":150,"text":"You can also talk about expected payoff or expected return by taking the expectation over the randomness of the states, because the states are not deterministic. Even you give me all the exact action A1 after AT, it's still not clear exactly which state I'm going to transition to, so that's why you take expectation over it. There's another thing which often people do is that they also introduce the so-called discount factor.","zh":"你也可以通过在状态的随机性上取期望来谈论预期收益或预期回报，因为状态不是确定性的。即使你给我所有精确的动作A1到AT，仍然不清楚会转移到哪个具体状态，这就是为什么你要对它取期望的原因。人们经常做的另一件事是引入所谓的折扣因子。","start":1569.74,"end":1595.1},{"id":151,"text":"which means that you add- maybe I'll just directly modify this return.","zh":"这意味着你添加——也许我直接修改这个回报。","start":1600.92,"end":1605.54},{"id":152,"text":"So you say you add a Gamma here and then this is Gamma to the power t.","zh":"所以你说你添加了一个Gamma在这里，然后这就是Gamma的t次方。","start":1605.74,"end":1610.46},{"id":153,"text":"For the t-th term, you add Gamma to the power t,","zh":"对于第t项，你添加Gamma的t次方，","start":1610.64,"end":1612.96},{"id":154,"text":"where Gamma is a number between 0 and 1 and it's often very close to 1.","zh":"其中Gamma是一个介于0和1之间的数，通常非常接近1。","start":1613.08,"end":1618.16},{"id":155,"text":"So Gamma is something like maybe 0.99 or something like that.","zh":"所以Gamma可能像0.99这样的数值。","start":1618.28,"end":1620.7},{"id":156,"text":"So this is in some sense a little bit more, you know,","zh":"从某种意义上说，这稍微多了一些，你知道的，","start":1621.2,"end":1623.5},{"id":157,"text":"I think the easiest way to think about it is that it's a little bit","zh":"我想最简单的方法是把它想成有点像利率之类的东西，对吧？","start":1623.56,"end":1625.4},{"id":158,"text":"kind of like an interest rate kind of stuff, right?","zh":"你在对未来的奖励进行折现。","start":1625.4,"end":1627.44},{"id":159,"text":"You are discounting the reward you get in the future.","zh":"如果未来太远，","start":1627.54,"end":1629.76},{"id":160,"text":"if it's too far away from the future,","zh":"那么它比近期的奖励价值更低。","start":1629.76,"end":1631.42},{"id":161,"text":"then it's less valuable than the reward near term.","zh":"所以如果你今天赚到1美元，和100年后赚到1美元相比，","start":1632.16,"end":1634.6},{"id":162,"text":"So if you earn the same $1 today versus 100 years later,","zh":"所以如果你今天赚到1美元和100年后赚到1美元，","start":1635.04,"end":1643.68},{"id":163,"text":"then $1 today is worth a little bit more.","zh":"那么今天的1美元价值略高一些。","start":1643.84,"end":1646.1},{"id":164,"text":"So this doesn't mean that you are myopic.","zh":"因此这并不意味着你是近视的。","start":1646.88,"end":1648.68},{"id":165,"text":"You only focus on today.","zh":"你只关注今天。","start":1648.88,"end":1649.82},{"id":166,"text":"But I'm just saying if you can exchange when you get the reward,","zh":"但我想说的是，如果你可以在获得奖励时进行交换，","start":1650.4,"end":1653.7},{"id":167,"text":"then you should do it early.","zh":"那么你应该尽早进行。","start":1654.52,"end":1655.8},{"id":168,"text":"But sometimes the optimal action is","zh":"但有时候最优的动作是","start":1656.08,"end":1658.18},{"id":169,"text":"is that you don't get any reward at","zh":"你在一开始不会获得任何奖励，","start":1658.18,"end":1659.3},{"id":170,"text":"the beginning because otherwise you","zh":"否则你将来就无法获得足够的奖励。","start":1659.3,"end":1660.56},{"id":171,"text":"don't get enough reward in the future.","zh":"所以无论如何，一旦你这样做，","start":1660.56,"end":1661.84},{"id":172,"text":"So anyway, once you do this,","zh":"就完成了。","start":1662.48,"end":1665.54},{"id":173,"text":"you also have the benefit that with the discount factor,","zh":"你还有一个好处，即通过折扣因子，","start":1666.08,"end":1671.18},{"id":174,"text":"another small benefit is that the payoff is","zh":"另一个小的好处是，回报是","start":1671.32,"end":1676.02},{"id":175,"text":"bounded for any number of steps.","zh":"对于任何步数都是有界的。","start":1676.02,"end":1681.46},{"id":176,"text":"Here, I didn't even specify how many steps you have.","zh":"在这里，我甚至没有指定你有多少步。","start":1682.52,"end":1684.82},{"id":177,"text":"I'm indicating that you actually can run it forever.","zh":"我在表明你实际上可以运行无限长时间。","start":1684.96,"end":1686.92},{"id":178,"text":"So even if you run it forever,","zh":"因此，即使你运行无限长时间，","start":1686.92,"end":1688.66},{"id":179,"text":"so you know that if each of the individual reward,","zh":"你都知道如果每个单独的奖励，","start":1689.34,"end":1694.84}],"notes":["本段讲解了强化学习中轨迹（trajectory）和回报（return）的概念，指出轨迹是整个交互过程的序列，而回报是通过将每个状态的奖励相加得到的。同时，提到由于状态的非确定性，回报需要取期望值。","讲者进一步引入了折扣因子（discount factor），用于对未来的奖励进行折现，强调了折扣因子Γ的取值范围在0到1之间，通常接近1，如0.99。折扣因子的引入使得回报在无限步数下仍然有界。","讲者将折扣因子类比为利率，说明未来的奖励价值会随着时间推移而减少，因此更倾向于在早期获得奖励。但讲者也指出，有时最优策略可能是在初期没有奖励，而是在未来获得更大的回报。","讲者提到，引入折扣因子的一个好处是即使在无限步数的情况下，回报仍然是有界的，这有助于模型的稳定性和计算可行性。","讲者强调，折扣因子的使用并不意味着模型是短视的（myopic），而是对未来的奖励进行合理评估，以平衡短期和长期收益。","讲者最后指出，即使在无限步数的情况下，每个步骤的奖励仍然可以被合理地计算和评估，这得益于折扣因子的引入。"],"formulas":[{"latex":"R = \\sum_{t=1}^{T} r_t","symbols":"R 表示回报，r_t 表示第 t 步的奖励","explanation":"公式正确，表示在 T 步内所有奖励的总和。","evidence":"So typically, the reward for the whole thing, I think this whole thing is often called a trajectory. In the old days, it's often called episode in the more standard RL settings. But I think trajectory seems to be more common word. So for this whole trajectory, you can define a payoff or reward function or return. I think often people call it return or payoff by just summing up the reward at every state. You can also talk about expected payoff or expected return by taking the expectation over the randomness of the states, because the states are not deterministic. Even you give me all the exact action A1 after AT, it's still not clear exactly which state I'm going to transition to, so that's why you take expectation over it. There's another thing which often people do is that they also introduce the so-called discount factor."}],"uncertainties":["可能听不清的部分，如 'you add- maybe I'll just directly modify this return.' 中的 'add-' 是否为 'add a discount factor' 的误识别","可能听不清的部分，如 'so you know that if each of the individual reward,' 是否完整表达"],"diagram":"none","start":1536.31,"end":1694.84,"asr_flags":[],"math_clarifications":["公式 1 中的 R 表示折扣后的回报，但未明确说明 Gamma 的定义和取值范围。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":31,"raw_segments":[{"start":1536.31,"text":"So typically, the reward for the whole thing, I think this whole thing is often called a trajectory. In the old days, it's often called episode in the more standard RL settings. But I think trajectory seems to be more common word. So for this whole trajectory, you can define a payoff or reward function or return. I think often people call it return or payoff by just summing up the reward at every state."},{"start":1569.74,"text":"You can also talk about expected payoff or expected return by taking the expectation over the randomness of the states, because the states are not deterministic. Even you give me all the exact action A1 after AT, it's still not clear exactly which state I'm going to transition to, so that's why you take expectation over it. There's another thing which often people do is that they also introduce the so-called discount factor."},{"start":1600.92,"text":"which means that you add- maybe I'll just directly modify this return."},{"start":1605.74,"text":"So you say you add a Gamma here and then this is Gamma to the power t."},{"start":1610.64,"text":"For the t-th term, you add Gamma to the power t,"},{"start":1613.08,"text":"where Gamma is a number between 0 and 1 and it's often very close to 1."},{"start":1618.28,"text":"So Gamma is something like maybe 0.99 or something like that."},{"start":1621.2,"text":"So this is in some sense a little bit more, you know,"},{"start":1623.56,"text":"I think the easiest way to think about it is that it's a little bit"},{"start":1625.4,"text":"kind of like an interest rate kind of stuff, right?"},{"start":1627.54,"text":"You are discounting the reward you get in the future."},{"start":1629.76,"text":"if it's too far away from the future,"},{"start":1632.16,"text":"then it's less valuable than the reward near term."},{"start":1635.04,"text":"So if you earn the same $1 today versus 100 years later,"},{"start":1643.84,"text":"then $1 today is worth a little bit more."},{"start":1646.88,"text":"So this doesn't mean that you are myopic."},{"start":1648.88,"text":"You only focus on today."},{"start":1650.4,"text":"But I'm just saying if you can exchange when you get the reward,"},{"start":1654.52,"text":"then you should do it early."},{"start":1656.08,"text":"But sometimes the optimal action is"},{"start":1658.18,"text":"is that you don't get any reward at"},{"start":1659.3,"text":"the beginning because otherwise you"},{"start":1660.56,"text":"don't get enough reward in the future."},{"start":1662.48,"text":"So anyway, once you do this,"},{"start":1666.08,"text":"you also have the benefit that with the discount factor,"},{"start":1671.32,"text":"another small benefit is that the payoff is"},{"start":1676.02,"text":"bounded for any number of steps."},{"start":1682.52,"text":"Here, I didn't even specify how many steps you have."},{"start":1684.96,"text":"I'm indicating that you actually can run it forever."},{"start":1686.92,"text":"So even if you run it forever,"},{"start":1689.34,"text":"so you know that if each of the individual reward,"}],"speech_gaps":[],"frame":"../frames/v039/010.webp","frame_time":1548.31},{"title":"马尔可夫决策过程（MDP）与折扣因子","segments":[{"id":180,"text":"Let's say it is bounded by some constraint M, then the total payoff is bounded by M over one minus Gamma in absolute value. So this is just because if you take the sum of all of this, so this is just a very simple math which is like one plus Gamma. The first time you get at most M,","zh":"假设它受到某个约束 M 的限制，那么总回报的绝对值将被 M 除以 1 减去 Gamma 所限制。这是因为如果你将所有这些相加，这就只是一个非常简单的数学运算，类似于 1 加上 Gamma。第一次你得到的回报最多是 M，","start":1698.13,"end":1724.6},{"id":181,"text":"the second time you get at most Gamma times M,","zh":"第二次你得到的回报最多是 Gamma 乘以 M，","start":1725.18,"end":1727.0},{"id":182,"text":"and then Gamma squared times M, all of this way.","zh":"然后是 Gamma 平方乘以 M，依此类推。","start":1727.08,"end":1729.58},{"id":183,"text":"This whole thing is less than M over one minus Gamma.","zh":"所有这些加起来的总和将小于 M 除以 1 减去 Gamma。","start":1729.7,"end":1732.8},{"id":184,"text":"So this way, you can more effectively talk about infinite number of steps,","zh":"这样，你可以更有效地讨论无限步数的情况，","start":1733.36,"end":1737.72},{"id":185,"text":"which is not that common anymore,","zh":"这在现在并不常见，","start":1737.98,"end":1741.8},{"id":186,"text":"but if you want to do this in some of the settings,","zh":"但如果你想在某些设置中这样做，","start":1743.02,"end":1747.02},{"id":187,"text":"you do care about steps being a variable that can be possibly infinite.","zh":"你确实需要考虑步数可能为无限的情况。","start":1747.16,"end":1750.78},{"id":188,"text":"Infinite. And also, as you can see,","zh":"无限的。而且，正如你可以看到的，","start":1750.78,"end":1754.94},{"id":189,"text":"like the discount factor encourages you to get the reward earlier,","zh":"就像折扣因子鼓励你尽早获得奖励，","start":1755.02,"end":1757.86},{"id":190,"text":"which is sometimes useful.","zh":"这在某些情况下是有用的。","start":1758.08,"end":1759.14},{"id":191,"text":"For example, if you want to reach this cup here,","zh":"例如，如果你想到达这里的杯子，","start":1759.4,"end":1764.1},{"id":192,"text":"you do probably want the robots to find","zh":"你可能希望机器人找到","start":1764.4,"end":1767.2},{"id":193,"text":"the shortest path to reach the cup as opposed to","zh":"到达杯子的最短路径，而不是","start":1767.2,"end":1770.06},{"id":194,"text":"spending like a year to reach the cup or something like that.","zh":"花费一年时间才能到达杯子之类的情况。","start":1770.06,"end":1772.08},{"id":195,"text":"Anyway, so these are just some variants here.","zh":"总之，这些都是这里的一些变体。","start":1773.0,"end":1778.32},{"id":196,"text":"So once you have all of this, you've got a so-called MDP.","zh":"所以一旦你有了所有这些内容，你就得到了所谓的马尔可夫决策过程（MDP）。","start":1778.32,"end":1783.18},{"id":197,"text":"So the MDP is pretty much a top of all of this,","zh":"因此，MDP基本上就是所有这些内容的顶层，","start":1783.48,"end":1790.1},{"id":198,"text":"the state set, the action set, the transition dynamics,","zh":"包括状态集、动作集、转移动态、","start":1790.12,"end":1793.12},{"id":199,"text":"the reward function, and the discount factor.","zh":"奖励函数以及折扣因子。","start":1794.42,"end":1797.42},{"id":200,"text":"So this describes the MDP.","zh":"因此，这描述了MDP。","start":1798.58,"end":1800.4},{"id":201,"text":"Okay.","zh":"好的。","start":1802.56,"end":1803.12},{"id":202,"text":"Okay, so.","zh":"好的，那么。","start":1803.12,"end":1803.6},{"id":203,"text":".","zh":".","start":1804.88,"end":1805.66},{"id":204,"text":"Yes.","start":1812.7,"end":1813.48},{"id":205,"text":".","start":1814.24,"end":1815.02},{"id":206,"text":"Yes.","start":1818.14,"end":1818.92},{"id":207,"text":".","start":1819.06,"end":1819.44},{"id":208,"text":"Yeah, I guess I wouldn't use the word rules, but I think I understand what you mean. It's a probabilistic discussion, right? Probabilistic discussion. Not really, right? So I don't think, you know, in theory, yes, but at least for Jones, it's actually very easy. The state space is probably just, maybe you just need to, you know, depending on what you, you know, depending on what environment you are flying in, so you can just say the height,","start":1821.42,"end":1873.46}],"notes":["本段讲解了马尔可夫决策过程（MDP）中折扣因子的作用，通过一个简单的数学推导说明了在无限步数情况下，总回报的上界。讲者指出，折扣因子鼓励智能体尽早获取奖励，这在某些应用场景中非常有用，例如机器人导航问题中，希望找到最短路径而不是花费大量时间。"],"formulas":[],"uncertainties":["infinite. And also, as you can see,","you do probably want the robots to find"]
