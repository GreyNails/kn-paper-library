odeling and geoengineering and just play in all of these important, hopefully important and interesting places. So I hope that you have that skill set as well by the end of this quarter. Yeah? How do you know if you have enough data for a neural network? It turns out to be really difficult to know.","zh":"我们实际上可以从事气候建模和地球工程，并在这些重要、希望重要且有趣的领域中发挥作用。我希望你们在本季度结束时也具备这样的技能集。嗯？你如何知道你是否有足够的数据用于神经网络？事实证明，这很难知道。","start":1956.94,"end":1988.16},{"id":99,"text":"So if it's an application that others have worked on or that you've worked on before, then you may have a sense. So for example, because I worked on face recognition, you kind of have a sense. You want to train a face recognition system from scratch, having like 50,000 images, 50,000 unique faces is pretty good. So if you worked on it or if you read the research literature for something people have worked on, that would give you a gut sense for how much data.","zh":"所以，如果你正在处理一个别人已经做过或者你之前做过过的应用，那么你可能有一些感觉。例如，因为我做过人脸识别，你大概也会有一些感觉。如果你想从头开始训练一个人脸识别系统，拥有大约50,000张图片，包含50,000个不同的面孔，这已经相当不错了。所以，如果你做过这个，或者如果你阅读过别人做过的相关研究文献，这会给你一个大致的感觉，知道需要多少数据。","start":1989.27,"end":2015.89},{"id":100,"text":"could be enough to get you started. But then for...","zh":"这可能已经足够让你开始。但接着对于……","start":2016.9,"end":2020.4}],"notes":["本段讨论了深度学习在多个实际应用领域的潜力，包括广告投放、网络搜索优化、电子商务、语音识别、船舶燃油效率提升以及金融欺诈检测。这些应用展示了深度学习在解决现实问题中的广泛适用性。","在金融欺诈检测中，讲者提到实时构建算法的重要性，因为每拖延一小时，资金就会从金融系统中流失。这说明了深度学习在应对时间敏感问题时的价值。","讲者强调了深度学习工具集的广泛适用性，不仅限于计算机视觉领域，还涉及气候科学等跨学科领域。这表明深度学习可以与不同领域的数据和问题相结合，产生新的研究方向。","关于数据需求，讲者指出判断数据是否足够是一个困难的问题。他以人脸识别为例，说明了在已有研究基础上，可以形成对所需数据量的直觉。","讲者提到，对于已有研究或实际应用的领域，可以通过经验或文献了解所需数据量，但对新领域则缺乏明确的指导。","最后，讲者提到数据量的判断是一个复杂的问题，需要结合具体应用场景和已有经验进行评估。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1851.69,"end":2020.4,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1851.69,"text":"Place more relevant ads. Maybe not the most inspiring thing I've worked on, but certainly very lucrative for some companies. Or improve web search rankings. Or improve safety. Get rid of the kind of negative toxic results you may not want search results to come back on. Or improve e-commerce retelling. Or improve speech recognition. Or help ships be more fuel efficient. All these are real examples. Or fight fraud, which is actually really exciting when you're fighting financial fraud."},{"start":1880.22,"text":"which is obviously a bad thing. But when you're fighting fraud, sometimes you wake up in the morning and your team's alerted you that there's a new scam, and then you just have to go and fight them and build algorithms in real time. And you know that every hour you take, more money actually leaks into the financial system. So it's kind of awful that there's financial fraud, but it's actually one of the most exhilarating things I've worked on because literally every hour you are slower."},{"start":1904.92,"text":"to, you know, formulate a response, you know more dollars are leaking out every hour. So anyway, so somehow when you have this tool set of deep learning, you just have a bewildering right to play or ability to play in a huge range of applications that could use your help, right? And I think on campus too."},{"start":1927.59,"text":"There's so many departments across campus in the sciences, engineering, humanities, business, that have interesting data where your skill set will let you, if you choose, collaborate with them to do interesting projects. And I find, for example, bizarrely, some of my PhD students are working on climate science. It's like, what do I know about climate science? I wish I knew more. But using machine learning tools,"},{"start":1956.94,"text":"We could actually work on climate modeling and geoengineering and just play in all of these important, hopefully important and interesting places. So I hope that you have that skill set as well by the end of this quarter. Yeah? How do you know if you have enough data for a neural network? It turns out to be really difficult to know."},{"start":1989.27,"text":"So if it's an application that others have worked on or that you've worked on before, then you may have a sense. So for example, because I worked on face recognition, you kind of have a sense. You want to train a face recognition system from scratch, having like 50,000 images, 50,000 unique faces is pretty good. So if you worked on it or if you read the research literature for something people have worked on, that would give you a gut sense for how much data."},{"start":2016.9,"text":"could be enough to get you started. But then for..."}],"speech_gaps":[],"frame":"../frames/v060/012.webp","frame_time":1863.69},{"title":"深度学习中的数据需求与生成式AI简介","segments":[{"id":101,"text":"greenfield brand new projects that no one in the world has worked on before. If you can't find parallel projects that are kind of comparable, it could be really hard to tell. And so common advice for completely greenfield, sorry, greenfield, I mean a brand new project, just similar than things. So for example, if someone has invented a new medical device and no one has collected this type of blood specimen data before, it's really hard to tell. And in that case, the most common advice is,","zh":"全新的项目，世界上没有人之前做过。如果你找不到类似可比的项目，就很难判断。因此，对于完全全新的项目，最常见的建议是，获取一些数据并尝试训练一个模型。你最初的模型是否有效，将帮助你更好地理解需要多少数据。你可能会感到惊讶。也许100个数据点就足够了，对吧？有时候我对此感到惊讶。有时我们也在处理一些应用，即使有1000亿个数据点，我们仍在努力获取更多数据。我觉得很难判断。这是个好问题。","start":2021.63,"end":2049.69},{"id":102,"text":"Get a little bit of data and just try training a model. And the degree to which your initial model works or does not work, that will help you hone your perspective on how much data may be needed. And you may be surprised. Maybe 100 data points is all you need, right? Sometimes I've been surprised by that. And then sometimes we've also worked on applications where, you know, 100 billion data points later, we're still trying to get a lot more data. And I find it really difficult to tell. Good question.","zh":"获取一些数据并尝试训练一个模型。你的初始模型是否有效或无效的程度，将帮助你更好地理解可能需要多少数据。你可能会感到惊讶。也许100个数据点就足够了，对吧？有时候我确实被这一点所惊讶。但有时候我们也在处理一些应用，即使已经处理了1000亿个数据点，我们仍在努力获取更多的数据。我觉得很难判断。这是一个好问题。","start":2050.28,"end":2080.13},{"id":103,"text":"Anything else? Oh, so this is a good time for me to pause and take questions because, so what I'm going to do is, right, what I'm going to do after this is switch tracks and talk a little bit about exciting trends in AI, kind of recent trends in AI that I'm excited about and how I view the AI landscape. So this is actually a good break point to see if people have other questions before I talk about some trends in AI.","zh":"还有其他问题吗？是的，请继续。我想，这些术语有些模糊，彼此之间也有些重叠。但当我提到生成式AI时，生成式AI指的是生成文本和有时也生成图像的一类工作。","start":2080.87,"end":2110.39},{"id":104,"text":"Anything else? Yeah, please. So I guess, let's see, many of these terms are blurry and kind of fuzz a little bit into each other. But when I refer to generative AI, generative AI is this body of work that generates text and sometimes also images.","zh":"有时也生成音频，使用深度学习算法以某种方式实现。我认为GenAI指的是这一类工作，其中大部分重点在于生成文本，可能也包括图像，而文本生成算法大多使用变压器神经网络实现，这些网络是在大量数据上直接训练的，这些数据来自互联网和其他来源。","start":2111.37,"end":2149.01},{"id":105,"text":"sometimes also audio, using deep learning algorithms in certain ways. So I think GenAI refers to this body of work with most of the center of gravity on generating text, maybe also images, and the text generation algorithms have been mostly implemented using transformer neural networks, trained on large amounts of data straight off the internet and elsewhere.","zh":"有时也包括音频，通过某些方式使用深度学习算法。因此我认为生成式AI指的是这一类工作，其中大部分重点在于生成文本，也许还包括图像，而文本生成算法大多使用变压器神经网络实现，这些模型是在大量从互联网和其他地方获取的数据上进行训练的。","start":2149.67,"end":2171.23}],"notes":["本段讨论了在数据需求方面，对于全新的项目，没有可比的平行项目时，很难判断需要多少数据。建议从少量数据开始训练模型，通过模型的表现来判断数据需求。有时可能只需要100个数据点，而有时即使拥有1000亿数据点，仍然需要更多数据。这说明数据需求因项目而异，无法一概而论。","讲者提到，生成式AI（Generative AI, GenAI）主要涉及文本生成，有时也包括图像和音频。文本生成算法大多使用Transformer神经网络，并在大量数据上进行训练，这些数据可能直接来自互联网或其他来源。这表明生成式AI的核心在于利用深度学习算法生成新的内容。","讲者强调，生成式AI的工作重点在于文本生成，但其应用范围也在扩展，包括图像和音频。这说明生成式AI是一个涵盖多种模态的领域，但文本生成仍是其核心。","讲者提到，生成式AI的实现依赖于Transformer神经网络，并且训练数据来自互联网等广泛来源。这表明生成式AI的训练过程需要大量的数据，并且这些数据可能具有多样性。","讲者指出，生成式AI的中心在于文本生成，但其应用范围也在扩展，包括图像和音频。这说明生成式AI是一个涵盖多种模态的领域，但文本生成仍是其核心。","讲者提到，生成式AI的实现依赖于Transformer神经网络，并且训练数据来自互联网等广泛来源。这表明生成式AI的训练过程需要大量的数据，并且这些数据可能具有多样性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2021.63,"end":2171.23,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2021.63,"text":"greenfield brand new projects that no one in the world has worked on before. If you can't find parallel projects that are kind of comparable, it could be really hard to tell. And so common advice for completely greenfield, sorry, greenfield, I mean a brand new project, just similar than things. So for example, if someone has invented a new medical device and no one has collected this type of blood specimen data before, it's really hard to tell. And in that case, the most common advice is,"},{"start":2050.28,"text":"Get a little bit of data and just try training a model. And the degree to which your initial model works or does not work, that will help you hone your perspective on how much data may be needed. And you may be surprised. Maybe 100 data points is all you need, right? Sometimes I've been surprised by that. And then sometimes we've also worked on applications where, you know, 100 billion data points later, we're still trying to get a lot more data. And I find it really difficult to tell. Good question."},{"start":2080.87,"text":"Anything else? Oh, so this is a good time for me to pause and take questions because, so what I'm going to do is, right, what I'm going to do after this is switch tracks and talk a little bit about exciting trends in AI, kind of recent trends in AI that I'm excited about and how I view the AI landscape. So this is actually a good break point to see if people have other questions before I talk about some trends in AI."},{"start":2111.37,"text":"Anything else? Yeah, please. So I guess, let's see, many of these terms are blurry and kind of fuzz a little bit into each other. But when I refer to generative AI, generative AI is this body of work that generates text and sometimes also images."},{"start":2149.67,"text":"sometimes also audio, using deep learning algorithms in certain ways. So I think GenAI refers to this body of work with most of the center of gravity on generating text, maybe also images, and the text generation algorithms have been mostly implemented using transformer neural networks, trained on large amounts of data straight off the internet and elsewhere."}],"speech_gaps":[],"frame":"../frames/v060/013.webp","frame_time":2033.63},{"title":"深度学习中的生成式AI与编程辅助","segments":[{"id":106,"text":"So when I refer to GenAI, I guess that's one particular application of deep learning models that has given us large language models like ChatGPT and Cloud and Gemini and MetaLamar and so on. Does that make sense? Yeah, cool. Anything else? Cool. All right. So let me, could we go to the slides, please? One of the nice things about this class is Ken and I can occasionally just share a view of things we're seeing in the","zh":"所以当我提到生成式AI时，我想这应该是深度学习模型的一个特定应用，它为我们带来了像ChatGPT、Cloud和Gemini、MetaLamar等大型语言模型。这样理解对吗？是的，很好。还有别的吗？很好。那么，我们能否切换到幻灯片，请？这门课的一个好处是Ken和我偶尔可以分享一些我们在更广阔世界中看到的观点。","start":2172.89,"end":2206.94},{"id":107,"text":"broader world. Hey, while we're doing that, I'm actually curious, how many of you use a specialized AI-assisted coding tool, like CloudCode, Cursor, GenICI, Codex, Kurt Windsor? Awesome. Almost everyone, but not everyone. Interesting. Oh, interesting. Oh, I thought, interesting. Okay, cool. So, you know, one of the most exciting things that's happened in programming is AI-assisted coding, and I feel like","zh":"嘿，当我们这样做时，我其实很好奇，有多少人使用专门的AI辅助编程工具，比如CloudCode、Cursor、GenICI、Codex、Kurt Windsor？太棒了。几乎每个人，但不是所有人。有趣。哦，有趣。哦，我觉得有趣。好的，很好。所以，你知道的，编程领域最令人兴奋的事情之一就是AI辅助编程，我觉得","start":2207.58,"end":2236.17},{"id":108,"text":"I personally hope I never ever have to go back to coding by hand, right?","zh":"我个人希望我永远都不用再手动编写代码，对吧？","start":2237.13,"end":2241.85},{"id":109,"text":"It's just, it's actually interesting. I often work in coffee shops on the weekend, and a few weekends ago, I was sitting in a coffee shop, and sitting next to me was someone that was, you know, coding by hand, and it looked so strange. I just asked them, what are you doing? In a respectful way, you know. And it turned out that they're doing homework from some other university that required to code by hand.","zh":"这其实很有趣。我经常在周末的咖啡店工作，前几天的一个周末，我坐在咖啡店，旁边坐着一个人，他是在手动编写代码，看起来非常奇怪。我礼貌地问他，你在做什么？然后发现他是在为另一所大学做作业，要求手动编写代码。","start":2243.21,"end":2268.81},{"id":110,"text":"But one of the things I find exciting is that individual programmer productivity is much higher than it ever used to be. And maybe I want to share with you just one thing, what I see. So I find that in the software work that I do, I maybe categorize it into two buckets. One is building quick and dirty prototypes to see if something works. And then sometimes I write...","zh":"但我发现令人兴奋的一点是，个体程序员的生产力比以往任何时候都要高。也许我想和你们分享一点我所看到的情况。我发现，在我所做的软件工作中，我可能将其分为两类。一类是快速构建粗糙原型以验证想法是否可行。然后有时我会编写...","start":2269.96,"end":2293.92},{"id":111,"text":"production-grade, enterprise-grade, robust, reliable software that has a scale, right? And I find that it's where AI-assisted coding has made the biggest difference is building the quick and dirty prototypes. Whereas I think actually literally one of my collaborators used one of the agent decoders that I named, but I won't say which one, but literally this morning he sent me a Slack message saying, sorry, you know, this agent decoder had a database migration error and we just wiped out.","zh":"生产级、企业级、稳健、可靠的软件，具有可扩展性，对吧？我发现AI辅助编程带来最大差异的地方是构建这些快速粗糙的原型。而我认为实际上，我的一位合作者昨天早上给我发了一条Slack消息，说抱歉，这个代理解码器出现了数据库迁移错误，我们刚刚把数据清空了。","start":2295.25,"end":2322.63},{"id":112,"text":"all of the database records. Fortunately for a test application with like five users, but it did happen. So I find that my use of the agentic code is, you know, for the production grade software is more careful, whereas for building quick and dirty prototypes, it kind of, so unless you're not shipping software in an irresponsible way, quick and dirty prototypes have","zh":"所有数据库记录。幸运的是，在一个有五个用户的测试应用中，这种情况并没有发生。因此，我发现我在使用代理代码时，对于生产级别的软件更加谨慎，而对于构建快速而粗糙的原型，则有所不同。除非你不负责任地发布软件，否则快速而粗糙的原型","start":2323.07,"end":2350.39}],"notes":["本段主要介绍了生成式AI（GenAI）作为深度学习的一个应用，列举了如ChatGPT、Gemini、MetaLamar等大型语言模型。讲者提到，AI辅助编程工具如CloudCode、Cursor、Codex等在编程领域的重要性，并指出几乎所有人都在使用这些工具，但并非所有人都在使用。","讲者分享了自己在咖啡馆工作时观察到的场景，发现有人仍在手动编程，这让他感到惊讶。他提到，这种手动编程通常出现在其他大学的课程作业中，这说明尽管AI辅助编程工具普及，但仍有部分人依赖传统方法。","讲者强调了AI辅助编程对提高程序员生产力的重要性，并将软件开发分为两类：快速原型开发和生产级软件开发。他指出，AI辅助编程在快速原型开发中发挥了更大的作用，而在生产级软件开发中则需要更加谨慎。","讲者提到，他的一个合作者使用了他命名的一种代理解码器，但未透露具体名称。该解码器在数据库迁移过程中出现了错误，导致所有数据库记录被清除。尽管这是一个测试应用，但这一事件说明了AI辅助编程在实际应用中可能遇到的问题。","讲者总结了自己对AI辅助编程的使用经验，指出在生产级软件开发中需要更加谨慎，而在快速原型开发中则可以更随意。他强调，除非不负责地发布软件，否则快速原型开发不应被忽视。","本段内容涉及生成式AI的应用、AI辅助编程工具的使用情况、编程方式的对比以及AI辅助编程在实际应用中可能遇到的问题。这些内容为理解AI在编程领域的现状和未来发展方向提供了实际案例和见解。"],"formulas":[],"uncertainties":["GenAI","MetaLamar","Kurt Windsor","agentic code"],"diagram":"none","start":2172.89,"end":2350.39,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2172.89,"text":"So when I refer to GenAI, I guess that's one particular application of deep learning models that has given us large language models like ChaiGP and Cloud and Gemini and MetaLamar and so on. Does that make sense? Yeah, cool. Anything else? Cool. All right. So let me, could we go to the slides, please? One of the nice things about this class is Ken and I can occasionally just share a view of things we're seeing in the,"},{"start":2207.58,"text":"broader world. Hey, while we're doing that, I'm actually curious, how many of you use a specialized AI-assisted coding tool, like CloudCode, Cursor, GenICI, Codex, Kurt Windsor? Awesome. Almost everyone, but not everyone. Interesting. Oh, interesting. Oh, I thought, interesting. Okay, cool. So, you know, one of the most exciting things that's happened in programming is AI-assisted coding, and I feel like"},{"start":2237.13,"text":"I personally hope I never ever have to go back to coding by hand, right?"},{"start":2243.21,"text":"It's just, it's actually interesting. I often work in coffee shops on the weekend, and a few weekends ago, I was sitting in a coffee shop, and sitting next to me was someone that was, you know, coding by hand, and it looked so strange. I just asked them, what are you doing? In a respectful way, you know. And it turned out that they're doing homework from some other university that required to code by hand."},{"start":2269.96,"text":"But one of the things I find exciting is that individual programmer productivity is much higher than it ever used to be. And maybe I want to share with you just one thing, what I see. So I find that in the software work that I do, I maybe categorize it into two buckets. One is building quick and dirty prototypes to see if something works. And then sometimes I write..."},{"start":2295.25,"text":"production-grade, enterprise-grade, robust, reliable software that has a scale, right? And I find that it's where AI-assisted coding has made the biggest difference is building the quick and dirty prototypes. Whereas I think actually literally one of my collaborators used one of the agent decoders that I named, but I won't say which one, but literally this morning he sent me a Slack message saying, sorry, you know, this agent decoder had a database migration error and we just wiped out."},{"start":2323.07,"text":"all of the database records. Fortunately for a test application with like five users, but it did happen. So I find that my use of the agentic code is, you know, for the production grade software is more careful, whereas for building quick and dirty prototypes, it kind of, so unless you're not shipping software in an irresponsible way, quick and dirty prototypes have"}],"speech_gaps":[],"frame":"../frames/v060/014.webp","frame_time":2184.89},{"title":"快速原型开发与机器学习的不确定性","segments":[{"id":113,"text":"lot fewer dependencies. You don't need to integrate with legacy data infrastructure. And then, you know, I'm going to say something that feels like something I'm not supposed to say, but I'll say it anyway, which is I find that","zh":"依赖项要少得多。你不需要与遗留数据基础设施集成。然后，我会说一些听起来像是我不该说的话，但我会说出来，那就是我发现","start":2350.81,"end":2365.49},{"id":114,"text":"When I am running code, I find that people often worry about safety and reliability of software or security of software. So one thing I often say to my teams is, if you are building a prototype that only runs on your own laptop and doesn't use any sensitive information, so there's no risk of sensitive information, then unless you are planning to maliciously hack into your own laptop,","zh":"当我运行代码时，我发现人们常常担心软件的安全性和可靠性或安全性。因此，我经常对我的团队说，如果你正在构建一个只在你自己的笔记本电脑上运行且不使用任何敏感信息的原型，那么就没有敏感信息泄露的风险，除非你计划恶意入侵你自己的笔记本电脑，","start":2367.6,"end":2393.62},{"id":115,"text":"the security requirements can be lower. And so I find that when building quick and dirty prototypes, having a sandbox environment that lets you operate within it quickly means that you can just make a lot of decisions faster without worrying as much about scalability or security or reliability. So unless the sandbox environment means this stuff isn't going to get out there or leak information or create a security loophole. So that's part of what lets us move much faster.","zh":"安全性要求可以更低。因此，我发现在构建快速而粗糙的原型时，拥有一个沙箱环境，让你能够快速在其中操作，意味着你可以更快地做出很多决策，而无需过多担心可扩展性、安全性和可靠性。因此，除非沙箱环境意味着这些东西不会被发布出去或泄露信息或造成安全漏洞。这就是让我们能够更快推进的部分。","start":2394.37,"end":2422.6},{"id":116,"text":"And so I find that because of the speed of prototyping, so once you can do so in a responsible way to pursue innovative ideas, my teams will increasingly try 20 things and see what sticks. And I know that a lot of teams are lamenting that many proof of concepts never make it into production. You try something and it doesn't work. And I know some teams are feeling angst about that. I actually have a different view.","zh":"因此，我发现由于原型开发的速度，一旦你能够以负责任的方式进行原型开发以追求创新想法，我的团队会越来越多地尝试20种方法并看看哪些可行。我知道很多团队都在抱怨许多概念验证从未进入生产环境。你尝试了某样东西，但它不起作用。我知道有些团队对此感到焦虑。我实际上有不同看法。","start":2423.98,"end":2452.8},{"id":117,"text":"I think if the cost of a proof of concept is low enough, then who cares if you have to do 20 of them? And that's the price for finding the one or two things that works really well. So one thing you hear about in this course is both when you're building a machine learning application, you usually don't know what's going to happen. And there's a specific reason for that. The reason is...","zh":"我认为如果概念验证的成本足够低，那么你不得不做20次又何妨？这就是找到一两个真正有效的方法所付出的代价。因此，你在这个课程中会听到的一件事是，当你构建机器学习应用时，你通常不知道会发生什么。有特定的原因。原因是...","start":2453.44,"end":2476.98},{"id":118,"text":"The output of a machine learning algorithm, it depends both on the code you write, as well as on the data you're training on. And while you control the code 100%, you don't really know, usually, what's really in the data, in the weird and wonderful data that the world has given you. So, for example,","zh":"机器学习算法的输出，既取决于你编写的代码，也取决于你所使用的训练数据。虽然你对代码拥有100%的控制权，但通常你并不真正了解数据中到底包含什么，尤其是这个世界给予你的那些奇特而有趣的数据。例如，","start":2477.31,"end":2498.29},{"id":119,"text":"worked on speech recognition a lot in multiple companies in multiple contexts. And even now, when I work on speech recognition, I'm still, you know, sometimes a little bit surprised that, oh, this data has people of a certain accent more than I realize.","zh":"我在多家公司和多种背景下都大量从事过语音识别的工作。即使到现在，当我继续从事语音识别工作时，我仍然有时会有点惊讶，哦，原来这些数据中包含比我自己意识到的更多某种口音的人。","start":2498.93,"end":2512.83}],"notes":["本段主要讨论快速原型开发在机器学习项目中的重要性，强调在开发初期阶段，由于数据的不确定性和算法输出的依赖性，团队需要快速试验多个想法以找到有效的解决方案。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2350.81,"end":2512.83,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2350.81,"text":"lot fewer dependencies. You don't need to integrate with legacy data infrastructure. And then, you know, I'm going to say something that feels like something I'm not supposed to say, but I'll say it anyway, which is I find that"},{"start":2367.6,"text":"When I am running code, I find that people often worry about safety and reliability of software or security of software. So one thing I often say to my teams is, if you are building a prototype that only runs on your own laptop and doesn't use any sensitive information, so there's no risk of sensitive information, then unless you are planning to maliciously hack into your own laptop,"},{"start":2394.37,"text":"the security requirements can be lower. And so I find that when building quick and dirty prototypes, having a sandbox environment that lets you operate within it quickly means that you can just make a lot of decisions faster without worrying as much about scalability or security or reliability. So unless the sandbox environment means this stuff isn't going to get out there or leak information or create a security loophole. So that's part of what lets us move much faster."},{"start":2423.98,"text":"And so I find that because of the speed of prototyping, so once you can do so in a responsible way to pursue innovative ideas, my teams will increasingly try 20 things and see what sticks. And I know that a lot of teams are lamenting that many proof of concepts never make it into production. You try something and it doesn't work. And I know some teams are feeling angst about that. I actually have a different view."},{"start":2453.44,"text":"I think if the cost of a proof of concept is low enough, then who cares if you have to do 20 of them? And that's the price for finding the one or two things that works really well. So one thing you hear about in this course is both when you're building a machine learning application, you usually don't know what's going to happen. And there's a specific reason for that. The reason is..."},{"start":2477.31,"text":"The output of a machine learning algorithm, it depends both on the code you write, as well as on the data you're training on. And while you control the code 100%, you don't really know, usually, what's really in the data, in the weird and wonderful data that the world has given you. So, for example,"},{"start":2498.93,"text":"worked on speech recognition a lot in multiple companies in multiple contexts. And even now, when I work on speech recognition, I'm still, you know, sometimes a little bit surprised that, oh, this data has people of a certain accent more than I realize."}],"speech_gaps":[],"frame":"../frames/v060/015.webp","frame_time":2362.81},{"title":"深度学习中的实际挑战与快速迭代","segments":[{"id":120,"text":"people somehow speak faster, or boy, there's a lot of background noise when people use it in a car, right? So even though I've worked on speech recognition multiple times, oh, and actually one recent example, application I was actually surprised by the number of background speakers. They talk to us, they come and talk to a different person, then they talk to us, and then we get confused, right? So I find that the data that the world gives us is often weird and wonderful. And so it is only by building a...","start":2514.22,"end":2542.36},{"id":121,"text":"that you then start to discover these things in the data that lets you make progress. And with a lot of software applications as well, separate from machine learning applications, a lot of what I end up having to discover is what do users actually want, right? So again, I control my code 100%. I can write whatever code I want. I control that. But you don't get to control how your users will react to your system.","start":2543.25,"end":2568.51},{"id":122,"text":"And I find that our ability to build quick and dirty prototypes rapidly, both to discover what's in the data and also to take the users to see if they like it, that allows us to drive faster feedback loops than was ever possible before to then help us build more and more valuable software. And I think, you know, I know that the mantra, move fast and break things, got the bad rep.","start":2569.01,"end":2597.73},{"id":123,"text":"because it broke things. And I find that some teams took away from this that we should not move fast, but I think that's a mistake. So what I usually tell my teams is move fast and be responsible. And despite all the hype about, you know, AI extinction risk, AI cause all that.","start":2598.51,"end":2618.57},{"id":124,"text":"somewhat bizarre hype, in my opinion. I find that when teams move really fast, we can then implement things, test it out in a responsible way, and much more quickly identify problems and fix them. So I find that a lot of the most responsible teams I know, teams able to really get stuff to work really quickly, they tend to be some of the fastest moving teams because it's that speed of execution that lets you finally implement it, figure out what's in your data, figure out what uses one, and that's the best way to figure out what could actually go wrong.","start":2619.47,"end":2648.21},{"id":125,"text":"to then make sure things don't actually go wrong. And somewhat related to that is AI coding assistance. And I assume almost everyone or everyone in this class knows how to code. If you haven't learned to code yet, you probably might not want to take this class yet. But I find that there have been people, including very senior...","start":2648.66,"end":2677.8}],"notes":["本段主要讨论了在实际应用中，语音识别系统面临的挑战，包括说话者语速较快、背景噪音多以及用户交互复杂性等问题。这些因素使得数据变得复杂且难以预测，因此需要通过构建快速原型来发现数据中的模式并验证用户需求。","讲者强调了快速迭代的重要性，认为通过快速构建和测试原型，可以更快地获得用户反馈，从而改进系统。同时，讲者指出，虽然‘快速行动并打破事物’的口号常被误解为不负责任，但正确的做法是‘快速行动并承担责任’，即在快速开发的同时确保系统的安全性和可靠性。","讲者提到，快速迭代不仅有助于发现数据中的问题，还能帮助团队更快地识别和修复潜在的错误。这种快速执行的能力使得团队能够更有效地实现目标，并确保系统不会出现严重问题。","此外，讲者还提到AI编码辅助工具的重要性，并指出如果学生尚未掌握编程技能，可能不适合参加这门课程。这表明课程对编程能力有基本要求，同时也强调了编码辅助工具在现代软件开发中的作用。","讲者通过实际案例说明了快速迭代和负责任开发的结合，强调了在快速开发过程中保持责任感的重要性。这种做法不仅提高了开发效率，还降低了系统出现错误的风险。","最后，讲者提到AI的炒作有时显得夸张，但快速迭代和负责任开发的结合仍然是实现高效软件开发的关键。这种理念适用于各种软件应用，而不仅仅是机器学习领域。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2514.22,"end":2677.8,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2514.22,"text":"people somehow speak faster, or boy, there's a lot of background noise when people use it in a car, right? So even though I've worked on speech recognition multiple times, oh, and actually one recent example, application I was actually surprised by the number of background speakers. They talk to us, they come and talk to a different person, then they talk to us, and then we get confused, right? So I find that the data that the world gives us is often weird and wonderful. And so it is only by building a..."},{"start":2543.25,"text":"that you then start to discover these things in the data that lets you make progress. And with a lot of software applications as well, separate from machine learning applications, a lot of what I end up having to discover is what do users actually want, right? So again, I control my code 100%. I can write whatever code I want. I control that. But you don't get to control how your users will react to your system."},{"start":2569.01,"text":"And I find that our ability to build quick and dirty prototypes rapidly, both to discover what's in the data and also to take the users to see if they like it, that allows us to drive faster feedback loops than was ever possible before to then help us build more and more valuable software. And I think, you know, I know that the mantra, move fast and break things, got the bad rep."},{"start":2598.51,"text":"because it broke things. And I find that some teams took away from this that we should not move fast, but I think that's a mistake. So what I usually tell my teams is move fast and be responsible. And despite all the hype about, you know, AI extinction risk, AI cause all that."},{"start":2619.47,"text":"somewhat bizarre hype, in my opinion. I find that when teams move really fast, we can then implement things, test it out in a responsible way, and much more quickly identify problems and fix them. So I find that a lot of the most responsible teams I know, teams able to really get stuff to work really quickly, they tend to be some of the fastest moving teams because it's that speed of execution that lets you finally implement it, figure out what's in your data, figure out what uses one, and that's the best way to figure out what could actually go wrong."},{"start":2648.66,"text":"to then make sure things don't actually go wrong. And somewhat related to that is AI coding assistance. And I assume almost everyone or everyone in this class knows how to code. If you haven't learned to code yet, you probably might not want to take this class yet. But I find that there have been people, including very senior..."}],"speech_gaps":[],"frame":"../frames/v060/016.webp","frame_time":2526.22},{"title":"编程技能的重要性与AI时代的职业发展","segments":[{"id":126,"text":"Business leaders advising others to not learn to code on the grounds that AI will automate it. And I want to share this with you, not because I think you need to learn to code, but because I hope you help me spread the word. Go to all of your friends in other departments to tell them, this advice to not learn to code, I think we'll look back on this as some of the worst career advice ever given.","zh":"商业领袖们建议他人不要学习编程，理由是AI将自动化编程。我想与你们分享这一点，并不是因为我认为你们需要学习编程，而是我希望你们帮助我传播这个观点。去告诉你们其他部门的朋友，这种建议不要学习编程，我认为我们将来会回顾这些建议为有史以来最糟糕的职业建议之一。","start":2678.74,"end":2698.28},{"id":127,"text":"And the reason is when coding becomes easier, more people should do it rather than fewer. So when humanity went from punch cards to keyboard and terminal, that made coding easier. And so more people...","zh":"原因在于，当编程变得更容易时，应该有更多人去学习编程，而不是更少的人。当人类从打孔卡过渡到键盘和终端时，这使得编程更容易。因此，更多的人...","start":2699.2,"end":2712.04},{"id":128,"text":"learn to code. When we went from assembly language to modern, well, at that time, modern programming languages, that made coding easier. More people learned to code. I went back and actually found these papers on when these articles on when COBOL, very old school programming language, right?","zh":"学习编程。当我们从汇编语言过渡到现代编程语言时，这使得编程更容易。更多的人学习编程。我回过头去，实际上找到了关于这些编程语言发明时间的论文，比如COBOL，这是一种非常古老的编程语言，对吧？","start":2712.36,"end":2729.96},{"id":129,"text":"was invented. And there were actually people that said, oh, wow, now we have the COBOL programming language. Coding is so easy. Who needs programmers anymore? And obviously, the opposite happened. We're in front of text editors, IDEs, and then AI-assisted coding. As coding becomes easier, people should code a lot more. A lot more people should learn to code.","zh":"被发明的时间。当时有人说道，哦，现在我们有了COBOL编程语言。编程变得如此简单。谁还需要程序员呢？显然，结果恰恰相反。我们现在使用文本编辑器、IDE，以及AI辅助编程。随着编程变得更容易，人们应该编写更多的代码。应该有更多的人学习编程。","start":2730.42,"end":2753.95},{"id":130,"text":"The other thing I'm seeing is, I just add just something like this on people's minds. I know that unemployment of recent computer science graduates has ticked up to higher than it's been compared to, I think, the last decade. And so I know that to people learning CS, that has caused some consternation. So I'm going to share my view on that.","zh":"我还注意到，我刚刚在人们脑海中添加了类似这样的观点。我知道，最近计算机科学毕业生的失业率已经上升到比过去十年更高的水平。因此，我知道对于正在学习计算机科学的人来说，这引起了一些担忧。因此，我想分享我的观点。","start":2755.28,"end":2776.52},{"id":131,"text":"It turns out that what I see in Silicon Valley and beyond Silicon Valley is we just can't find enough people with these skills. I know many businesses that would, well, I know large businesses that love to hire a thousand people with skills in Gen AI and deep learning and machine learning, but they are struggling to find people with these skills. Conversely, there are still universities with curricula that","zh":"事实上，我在硅谷以及硅谷以外的地方看到的是，我们找不到足够多具备这些技能的人。我知道许多企业，尤其是大型企业，非常希望雇佣一千名具备生成式AI、深度学习和机器学习技能的人，但他们却难以找到具备这些技能的人。相反，仍然有一些大学的课程设置","start":2778.29,"end":2806.27},{"id":132,"text":"has not changed much for the last, I don't know, since 2002, before the rise of Gen AI. And so I do see that many new CS grads, not from Stanford, but from around the country, are struggling with finding jobs. Because unfortunately, that older non-AI-enabled skill set, that is not as much in demand.","zh":"在过去的，我不确定，自从2002年以来，尤其是在生成式AI兴起之前，编程技能并没有发生太大变化。因此，我看到很多新的计算机科学毕业生，不来自斯坦福，而是来自全国各地，都在努力找工作。不幸的是，那种较旧的、未被AI赋能的技能集，现在已经不再那么有需求了。","start":2806.65,"end":2833.19},{"id":133,"text":"And maybe just for myself, today I will not hire a software engineer that doesn't know how to use AI to help them with co-opting. It just doesn't make sense.","zh":"也许就我自己而言，今天我不会雇佣一个不知道如何利用AI来协助他们的软件工程师。这根本不合理。","start":2833.65,"end":2841.79}],"notes":["本段讨论了编程技能在AI时代的重要性，指出尽管AI可以自动化许多任务，但编程技能仍然不可或缺。讲者认为，随着编程工具的不断进步，如从打孔卡到键盘终端，再到现代编程语言和AI辅助编程，编程变得更加容易，因此更多人应该学习编程。","讲者提到，历史上的编程语言如COBOL的出现曾被误认为会减少对程序员的需求，但事实相反，编程需求反而增加。这表明，随着编程变得更容易，学习编程的人数应该增加，而不是减少。","讲者还提到，近年来计算机科学毕业生的失业率有所上升，这引发了学习计算机科学的学生的担忧。然而，讲者认为，硅谷及其他地区仍然难以找到具备生成式AI、深度学习和机器学习技能的人才，这表明这些技能的需求正在增加。","讲者指出，许多大学的课程设置仍然没有随着生成式AI的兴起而改变，导致新毕业的计算机科学学生在求职时面临困难，因为他们的技能不再符合市场需求。","最后，讲者表示，他不会雇佣那些不懂如何利用AI辅助编程的软件工程师，强调了AI辅助编程在现代工作中的重要性。","整体来看，本段强调了编程技能在AI时代的重要性，并指出随着技术的发展，学习编程的人数应该增加，而大学课程需要与时俱进以适应市场需求。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2678.74,"end":2841.79,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2678.74,"text":"Business leaders advising others to not learn to code on the grounds that AI will automate it. And I want to share this with you, not because I think you need to learn to code, but because I hope you help me spread the word. Go to all of your friends in other departments to tell them, this advice to not learn to code, I think we'll look back on this as some of the worst career advice ever given."},{"start":2699.2,"text":"And the reason is when coding becomes easier, more people should do it rather than fewer. So when humanity went from punch cards to keyboard and terminal, that made coding easier. And so more people..."},{"start":2712.36,"text":"learn to code. When we went from assembly language to modern, well, at that time, modern programming languages, that made coding easier. More people learned to code. I went back and actually found these papers on when these articles on when COBOL, very old school programming language, right?"},{"start":2730.42,"text":"was invented. And there were actually people that said, oh, wow, now we have the COBOL programming language. Coding is so easy. Who needs programmers anymore? And obviously, the opposite happened. We're in front of text editors, IDEs, and then AI-assisted coding. As coding becomes easier, people should code a lot more. A lot more people should learn to code."},{"start":2755.28,"text":"The other thing I'm seeing is, I just add just something like this on people's minds. I know that unemployment of recent computer science graduates has ticked up to higher than it's been compared to, I think, the last decade. And so I know that to people learning CS, that has caused some consternation. So I'm going to share my view on that."},{"start":2778.29,"text":"It turns out that what I see in Silicon Valley and beyond Silicon Valley is we just can't find enough people with these skills. I know many businesses that would, well, I know large businesses that love to hire a thousand people with skills in Gen AI and deep learning and machine learning, but they are struggling to find people with these skills. Conversely, there are still universities with curricula that"},{"start":2806.65,"text":"has not changed much for the last, I don't know, since 2002, before the rise of Gen AI. And so I do see that many new CS grads, not from Stanford, but from around the country, are struggling with finding jobs. Because unfortunately, that older non-AI-enabled skill set, that is not as much in demand."},{"start":2833.65,"text":"And maybe just for myself, today I will not hire a software engineer that doesn't know how to use AI to help them with co-opting. It just doesn't make sense."}],"speech_gaps":[],"frame":"../frames/v060/017.webp","frame_time":2690.74},{"title":"AI辅助编程与技能需求的演变","segments":[{"id":134,"text":"Same reason why I just won't hire someone that uses a punch card instead of a keyboard and terminal, right? And I think when the world evolved from punch card to keyboard and terminal, people still had punch card jobs for a while, but eventually the punch card jobs just went away. It just doesn't make sense anymore. So today, there are still coding by hand jobs around. Maybe some specialties, some very low-level coding where AI is not very good. It turns out AI is not very good at some types of GP programming.","zh":"同样的原因，我不会雇佣那些仍然使用穿孔卡而不是键盘和终端的人，对吧？我认为当世界从穿孔卡演进到键盘和终端时，人们在一段时间内仍然有穿孔卡相关的工作，但最终这些穿孔卡相关的工作就消失了。这已经不再有意义了。所以今天，仍然存在一些手动编码的工作。也许是一些特殊领域，一些非常底层的编码，AI并不擅长。结果发现，AI在某些类型的通用编程（GP programming）方面并不擅长。","start":2842.48,"end":2867.96},{"id":135,"text":"There are some niches with coding by hand, actually still makes sense. But for building applications, you know, so I remember, this was a few months ago now, many months ago now, where I interviewed two engineers back to back. One had not yet graduated from college, but was highly on top of Gen AI coding. So, you know, spoke with that candidate, knew how to use AI, built ProRes, get started quickly. Right after that,","zh":"实际上，有些领域仍然需要手动编码，这仍然有意义。但就构建应用程序而言，我记得几个月前，我连续面试了两位工程师。其中一位尚未从大学毕业，但对生成式AI编程非常了解。因此，与这位候选人交谈时，我知道他如何使用AI，能够快速构建ProRes，并迅速上手。就在之后，","start":2868.75,"end":2897.02},{"id":136,"text":"I also interviewed someone with 10 years of experience as a full-stack engineer, but whose skill set was exactly the same as their 2002 skill set. Had not tried out any AI-assisted coding, really good full-stack engineer with 10 years of experience. And it was actually really clear to me, I picked the fresh college grad, well, he was about to graduate, over someone with 10 years of experience. So I think making sure...","zh":"我也面试了一位拥有10年全栈工程师经验的人，但他的技能集与2002年的技能集完全相同。他没有尝试过任何AI辅助的编程，是一位经验丰富的全栈工程师。但对我来说，这非常清楚，我选择了即将毕业的大学生，而不是那位有10年经验的人。因此，我认为掌握这些技能真的非常重要。","start":2897.66,"end":2923.62},{"id":137,"text":"you master these skills are really important. And what I'm seeing is there is a very large gap that businesses are having a hard time filling for people with these skills. But the demand for the 2022 skill set, software engineering, full-time engineering skill set, that is not there. So I think...","zh":"我看到的是，企业正在面临一个非常大的缺口，难以填补这些技能的人才。但对2022年技能集，即软件工程和全职工程师技能集的需求并不存在。因此，我认为……","start":2923.9,"end":2951.36},{"id":138,"text":"And then in terms of AI-assisted coding, I find that CS fundamentals really are important. So in addition, so I know I applied someone in fresh college grad over someone 10 years experience. That's a true story. There's actually one other part to this story, which is with respect to all of you about the graduate from college, the best programmers I know are also not fresh college grad. No disrespect intended to fresh college grads, someone about the graduate from Stanford.","zh":"就AI辅助编程而言，我发现计算机科学基础真的非常重要。此外，我知道我确实选择了即将毕业的大学生而不是有10年经验的人。这是一个真实的故事。这个故事还有另一部分，就是关于所有从大学毕业的人。我所认识的最好的程序员也不全是刚毕业的大学生。对刚毕业的大学生并无冒犯之意，只是说有一位来自斯坦福大学的毕业生。","start":2952.07,"end":2979.65},{"id":139,"text":"the best programs I know are really on top of AI-assisted coding, and additionally, deeply understand computer science fundamentals. So, it turns out, maybe I'll illustrate this as a quick story.","zh":"我所知道的最佳程序真的非常擅长利用AI辅助编程，而且还深刻理解计算机科学的基础知识。因此，也许我可以讲一个快速的小故事来说明这一点。","start":2980.38,"end":2993.46}],"notes":["本段讨论了AI辅助编程对软件工程师技能需求的影响。讲者提到，尽管AI在某些领域如通用编程（GP programming）表现不佳，但仍有特定领域需要手动编码。同时，讲者通过面试两个工程师的例子，说明了AI辅助编程的重要性，以及CS基础在AI辅助编程中的关键作用。","讲者提到，尽管AI辅助编程技术发展迅速，但某些领域如低级编程仍需手动完成。此外，讲者通过对比一位即将毕业的大学生和一位有10年经验的工程师，强调了掌握AI辅助编程技能的重要性。","讲者指出，尽管AI辅助编程技术在提升效率方面有显著作用，但CS基础仍然是不可或缺的。讲者还提到，最好的程序员不仅精通AI辅助编程，还深入理解计算机科学基础。","讲者通过一个真实故事说明，尽管AI辅助编程技术发展迅速，但CS基础仍然是关键。讲者还提到，最好的程序员并非刚毕业的学生，而是那些既掌握AI辅助编程又深入理解CS基础的人。","讲者强调，AI辅助编程技术正在改变软件工程师的技能需求，但CS基础仍然是不可替代的。同时，讲者指出，尽管AI辅助编程技术在某些领域表现优异，但在其他领域如低级编程仍需手动完成。","讲者通过对比不同背景的工程师，说明了AI辅助编程技术对技能需求的影响。讲者还提到，尽管AI辅助编程技术发展迅速，但CS基础仍然是关键，这表明AI辅助编程技术与传统编程技能并非对立，而是互补的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2842.48,"end":2993.46,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2842.48,"text":"Same reason why I just won't hire someone that uses a punch card instead of a keyboard and terminal, right? And I think when the world evolved from punch card to keyboard and terminal, people still had punch card jobs for a while, but eventually the punch card jobs just went away. It just doesn't make sense anymore. So today, there are still coding by hand jobs around. Maybe some specialties, some very low-level coding where AI is not very good. It turns out AI is not very good at some types of GP programming."},{"start":2868.75,"text":"There are some niches with coding by hand, actually still makes sense. But for building applications, you know, so I remember, this was a few months ago now, many months ago now, where I interviewed two engineers back to back. One had not yet graduated from college, but was highly on top of Gen AI coding. So, you know, spoke with that candidate, knew how to use AI, built ProRes, get started quickly. Right after that,"},{"start":2897.66,"text":"I also interviewed someone with 10 years of experience as a full-stack engineer, but whose skill set was exactly the same as their 2002 skill set. Had not tried out any AI-assisted coding, really good full-stack engineer with 10 years of experience. And it was actually really clear to me, I picked the fresh college grad, well, he was about to graduate, over someone with 10 years of experience. So I think making sure..."},{"start":2923.9,"text":"you master these skills are really important. And what I'm seeing is there is a very large gap that businesses are having a hard time filling for people with these skills. But the demand for the 2022 skill set, software engineering, full-time engineering skill set, that is not there. So I think..."},{"start":2952.07,"text":"And then in terms of AI-assisted coding, I find that CS fundamentals really are important. So in addition, so I know I applied someone in fresh college grad over someone 10 years experience. That's a true story. There's actually one other part to this story, which is with respect to all of you about the graduate from college, the best programmers I know are also not fresh college grad. No disrespect intended to fresh college grads, someone about the graduate from Stanford."},{"start":2980.38,"text":"the best programs I know are really on top of AI-assisted coding, and additionally, deeply understand computer science fundamentals. So, it turns out, maybe I'll illustrate this as a quick story."}],"speech_gaps":[],"frame":"../frames/v060/018.webp","frame_time":2854.48},{"title":"AI与计算机科学基础的重要性","segments":[{"id":140,"text":"When I was teaching an online course, my team wanted to generate background pictures like this, you know, just for decoration. So when I was working on this, this is a course generative AI for everyone, I was working for a collaborator, Tommy Nelson, that understood art history. And so my collaborator knew the language of art. He knew the artistic genre inspiration, the palette. So he could prompt mid-journey AI image generation with the language of art. And so he could generate","zh":"当我教在线课程时，我的团队想要生成这样的背景图片，你知道的，只是为了装饰。所以在处理这个问题时，这是一门面向所有人的生成式AI课程，我是在为一位名叫Tommy Nelson的合作者工作，他了解艺术史。因此，我的合作者懂得艺术语言。他了解艺术流派的灵感来源和调色板。因此，他能够使用艺术语言来提示Midjourney AI图像生成工具。因此，他能够生成","start":2994.31,"end":3023.17},{"id":141,"text":"beautiful pictures like these. In contrast, I don't know art history. I wish I did. And so all I could do was go to Midjourney or AI Image Generation and type, please make pretty pictures of robots for me. And I could never get the control that my collaborator Tommy could to generate pictures like these, which is why we use all of his pictures and none of mine. And I'm seeing the same thing in","zh":"这些美丽的图片。相比之下，我不懂艺术史。我希望我懂。因此，我所能做的只是去Midjourney或AI图像生成工具，输入『请为我生成漂亮的机器人图片』。而我永远无法像我的合作者Tommy那样控制生成图片，这就是为什么我们使用他所有的图片，而不用我的。我看到计算机科学中也出现了同样的情况。","start":3023.83,"end":3052.9},{"id":142,"text":"computer science. One of the most important skills for the future is to understand how computers work and understand how gen AI and deep learning and machine learning work so that you can use the language of AI, use the language of these tools.","zh":"未来最重要的技能之一是理解计算机是如何工作的，以及理解生成式AI、深度学习和机器学习是如何工作的，这样你才能使用AI的语言，使用这些工具的语言。","start":3053.36,"end":3071.28},{"id":143,"text":"to tell a computer exactly what you want so the computer can do it for you. And there is actually a huge difference in performance between someone that's learned to just prompt an LLM without understanding how computers or how AI really works versus people that can look at the problem, analyze it, and then with AI-assisted coding, tell a computer how to take the next steps, which is why I think that CS fundamentals is very...","zh":"告诉计算机你想要什么，这样计算机才能为你完成任务。实际上，那些只学会如何提示LLM而不理解计算机或AI如何运作的人，与那些能够分析问题、然后借助AI辅助编程告诉计算机下一步该怎么做的人之间，性能存在巨大的差异，这就是为什么我认为计算机科学基础非常重要。","start":3071.92,"end":3100.46},{"id":144,"text":"valuable. CS fundamentals, machine learning fundamentals, deep learning fundamentals. I and my teams, we use that knowledge every day in making pretty consequential decisions. So I hope that you get that from this class and many other classes at Stanford as well. All right. I think I might leave the rest. There's more I could say on trends in AI, but I find that","zh":"计算机科学基础、机器学习基础、深度学习基础。我和我的团队每天都在使用这些知识来做非常重要的决策。我希望你们能从这门课以及斯坦福的许多其他课程中获得这些知识。好了，我想我可能讲到这里了。关于AI的趋势，我还有更多可以说的，但我发现","start":3100.75,"end":3127.17},{"id":145,"text":"AI assistant. But one thing I hope you do, really, go to all your friends in all the departments across campus and encourage them to be a builder. Because the other thing I'm seeing is clearly for computer science professionals, use AI-assisted coding, no CS fundamentals, build cool stuff. But for other disciplines as well that is not computer science or not AI, I'm finding that","zh":"AI助手。但有一件事我希望你们真的去做，就是去校园里所有部门的所有朋友那里，鼓励他们成为建设者。因为我在明显看到的是，对于计算机科学专业人士来说，使用AI辅助编程，不需要计算机科学基础，就能构建出酷炫的东西。但对于其他非计算机科学或非AI领域的学科，比如教育专业人员、气候科学家或机械工程师，那些知道如何构建软件的人，他们则更加高效，能够完成更多工作。","start":3129.36,"end":3154.46},{"id":146,"text":"the education professional or the climate scientist or the mechanical engineer, the ones that know how to build software.","zh":"教育专业人士或气候科学家或机械工程师，那些知道如何构建软件的人。","start":3154.92,"end":3163.76},{"id":147,"text":"are just more productive and get a lot more done.","zh":"他们只是更加高效，能够完成更多工作。","start":3164.64,"end":3167.16},{"id":148,"text":"And the barrier to entry to AI to coding","zh":"而进入AI和编程的门槛","start":3167.38,"end":3170.48},{"id":149,"text":"is the lowest it's ever been in our lives.","zh":"是我们一生中最低的。","start":3170.48,"end":3172.88}],"notes":["本段讲授了AI生成图像与计算机科学基础的重要性。讲者通过与艺术历史学家Tommy Nelson的合作，展示了理解AI语言和艺术史的重要性，以及如何通过AI工具生成高质量图像。同时，讲者强调了计算机科学基础在AI应用中的关键作用，指出掌握这些基础可以显著提升AI工具的使用效果。","讲者指出，仅仅使用AI工具进行提示（prompting）而不理解其工作原理的人，与能够分析问题、利用AI辅助编程的人之间存在显著的性能差异。这表明，掌握计算机科学基础和AI原理对于有效使用AI工具至关重要。","讲者强调了计算机科学基础、机器学习和深度学习基础的重要性，并指出这些知识在日常决策中具有实际应用价值。他希望学生能够从课程和其他课程中获得这些知识。","讲者鼓励学生在校园内推广AI辅助编程，并鼓励跨学科的建设者（builders）利用AI工具进行创新。他指出，即使在非计算机科学领域，掌握软件构建能力也能显著提高生产力。","讲者提到，AI和编程的入门门槛已经降低到前所未有的水平，这表明AI技术正在变得更加普及和易于使用。","讲者强调了跨学科合作和AI辅助工具的重要性，指出无论是在计算机科学还是其他领域，掌握AI工具和软件构建能力都能带来更高的生产力和创新成果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2994.31,"end":3172.88,"asr_flags":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":2994.31,"text":"When I was teaching an online course, my team wanted to generate background pictures like this, you know, just for decoration. So when I was working on this, this is a course generative AI for everyone, I was working for a collaborator, Tommy Nelson, that understood art history. And so my collaborator knew the language of art. He knew the artistic genre inspiration, the palette. So he could prompt mid-journey AI image generation with the language of art. And so he could generate"},{"start":3023.83,"text":"beautiful pictures like these. In contrast, I don't know art history. I wish I did. And so all I could do was go to Midjourney or AI Image Generation and type, please make pretty pictures of robots for me. And I could never get the control that my collaborator Tommy could to generate pictures like these, which is why we use all of his pictures and none of mine. And I'm seeing the same thing in"},{"start":3053.36,"text":"computer science. One of the most important skills for the future is to understand how computers work and understand how gen AI and deep learning and machine learning work so that you can use the language of AI, use the language of these tools."},{"start":3071.92,"text":"to tell a computer exactly what you want so the computer can do it for you. And there is actually a huge difference in performance between someone that's learned to just prompt an LLM without understanding how computers or how AI really works versus people that can look at the problem, analyze it, and then with AI-assisted coding, tell a computer how to take the next steps, which is why I think that CS fundamentals is very..."},{"start":3100.75,"text":"valuable. CS fundamentals, machine learning fundamentals, deep learning fundamentals. I and my teams, we use that knowledge every day in making pretty consequential decisions. So I hope that you get that from this class and many other classes at Stanford as well. All right. I think I might leave the rest. There's more I could say on trends in AI, but I find that"},{"start":3129.36,"text":"AI assistant. But one thing I hope you do, really, go to all your friends in all the departments across campus and encourage them to be a builder. Because the other thing I'm seeing is clearly for computer science professionals, use AI-assisted coding, no CS fundamentals, build cool stuff. But for other disciplines as well that is not computer science or not AI, I'm finding that"},{"start":3154.92,"text":"the education professional or the climate scientist or the mechanical engineer, the ones that know how to build software."},{"start":3164.64,"text":"are just more productive and get a lot more done."},{"start":3167.38,"text":"And the barrier to entry to AI to coding"},{"start":3170.48,"text":"is the lowest it's ever been in our lives."}],"speech_gaps":[],"frame":"../frames/v060/019.webp","frame_time":3006.31},{"title":"AI技能的重要性与就业市场现状","segments":[{"id":150,"text":"And so this is a good time, frankly.","zh":"坦白说，这正是一个很好的时机。","start":3173.04,"end":3174.86},{"id":151,"text":"I wish every single Stanford student","zh":"我希望每一位斯坦福的学生","start":3175.08,"end":3178.56},{"id":152,"text":"will learn to build software with AI assistance.","zh":"都能学会借助人工智能来构建软件。","start":3178.56,"end":3181.48},{"id":153,"text":"So I hope you go help your friends across campus","zh":"因此，我希望你们去帮助校园里的朋友们","start":3181.88,"end":3185.22},{"id":154,"text":"to master those skills as well.","zh":"也掌握这些技能。","start":3186.02,"end":3187.8},{"id":155,"text":"Okay?","zh":"好的？","start":3188.26,"end":3188.82},{"id":156,"text":"Any other questions?","zh":"还有其他问题吗？","start":3191.06,"end":3192.52},{"id":157,"text":"Yes, go ahead.","zh":"是的，继续说。","start":3193.42,"end":3194.28},{"id":158,"text":"So would you say about the kind of online, knowing that you're from a different world,","zh":"那么你认为关于在线学习，知道你来自不同的世界，","start":3194.8,"end":3200.28},{"id":159,"text":"but also being in the field of AI, I kind of love it.","zh":"但你也处于AI领域，我有点喜欢它。","start":3200.28,"end":3202.8},{"id":160,"text":"Like, a lot of people are talking about how they would rather hire someone with 10 years","zh":"比如，很多人在谈论他们宁愿雇佣有10年经验的人","start":3202.9,"end":3209.24},{"id":161,"text":"of experience when no one's just trained in AI as is, like just using coding instead,","zh":"而不是那些没有接受过AI专门训练的人，比如只是用编码代替，","start":3209.24,"end":3214.66},{"id":162,"text":"rather than a freshman undergrad that does come, like that people are understanding of","zh":"而不是一个刚上大学的本科生，像那些人们理解的那样","start":3214.94,"end":3219.72},{"id":163,"text":"Yeah, so let me rank productivity, right, and I'll give you four levels.","zh":"是的，那么让我来排名生产力，对吧，我会给你四个等级。","start":3226.82,"end":3233.18},{"id":164,"text":"I think, and again, and I say this with a lot of respect for individuals,","zh":"我认为，再说一次，我对个人表示极大的尊重，","start":3233.42,"end":3236.78},{"id":165,"text":"so if I talk about productivity, it's not with any disrespect or any lack of affection","zh":"所以当我谈到生产力时，没有任何不尊重或缺乏感情的意味","start":3236.9,"end":3240.76},{"id":166,"text":"for anyone or for their work, right?","zh":"对于任何人或他们的工作，对吧？","start":3240.76,"end":3242.34},{"id":167,"text":"But I think, you know, least productive are people with no experience and don't know AI, right?","zh":"但我觉得，你知道的，最不具生产力的是那些没有任何经验且不了解AI的人，对吧？","start":3242.48,"end":3247.62},{"id":168,"text":"Right. One step on top of that is people with less experience, but on, sorry, one step on top of that","zh":"对。在那之上的一层是那些经验较少的人，但抱歉，在那之上的一层","start":3247.62,"end":3256.04},{"id":169,"text":"is people with, say, a decade of experience, but that don't know AI. On top of that, I would rather","zh":"是那些拥有十年经验但不了解AI的人。在那之上，我宁愿","start":3256.04,"end":3264.96},{"id":170,"text":"take a fresh college grad that doesn't know AI, but then even more productive is someone with,","zh":"录用一个刚毕业的大学生，即使他们不了解AI，但更有生产力的是那些既有十年经验，又非常了解AI的人。","start":3264.96,"end":3270.26},{"id":171,"text":"you know, a decade of experience and also really on top of AI. So I think between the two factors.","zh":"所以我觉得在这两个因素之间。","start":3270.36,"end":3275.54},{"id":172,"text":"Really, understanding AI is very important, but experience is also important. And so the best developers I know, we just work and we just ship code like no one's ever done, I think, even two, three years ago, are very experienced developers. They're also very on top of how they use the latest AI technologies.","zh":"真正了解AI是非常重要的，但经验同样重要。因此我认识的最佳开发者，他们只是工作并像以前从未有人做到过一样交付代码，我想，即使在两三年前，他们都是非常有经验的开发者。他们也非常了解如何使用最新的AI技术。","start":3276.39,"end":3296.41},{"id":173,"text":"Oh, sorry. And just one other thing about the job market. I find a lot of employers have not yet figured out how to hire appropriately. This is contributing. Frankly, a lot of employers, if a company has no one that knows Gen EI, how do they even know how to interview appropriately? So that is a problem that we need to solve as well. Go ahead.","zh":"哦，抱歉。还有关于就业市场的一件事。我发现很多雇主尚未弄清楚如何正确招聘。这在一定程度上是造成问题的原因。坦白说，很多雇主，如果一家公司没有人了解生成式AI，他们甚至如何知道如何进行适当的面试？因此，这也是我们需要解决的问题。你继续。","start":3300.45,"end":3315.89}],"notes":["本段主要讨论AI技能在就业市场中的重要性，以及当前雇主在招聘AI相关人才时面临的挑战。讲者指出，虽然有经验的开发者在传统编程方面可能更高效，但掌握AI技术的开发者在当前环境下更具生产力。同时，讲者提到雇主尚未完全理解如何正确招聘具备AI技能的人才，这导致了招聘过程中的问题。","讲者通过四个层次来评估生产力，从无经验且不了解AI的人，到有十年经验但不了解AI的人，再到有经验且了解AI的新人，最后是既有丰富经验又精通AI的开发者。这表明，AI技能与经验的结合是提升生产力的关键。","讲者强调，理解AI的重要性不亚于经验本身，因此，最佳的开发者不仅有丰富的经验，还能够充分利用最新的AI技术。这说明了在当前技术环境下，AI技能与传统编程经验的结合是开发者成功的重要因素。","讲者还提到，许多雇主尚未掌握如何正确招聘AI人才，这导致了招聘过程中的不匹配。讲者认为，这是一个需要解决的问题，因为缺乏对AI技术的理解会影响面试和招聘的准确性。","讲者在讨论中保持了对所有人的尊重，强调生产力的评估不应带有偏见或不尊重的态度。这表明，讲者在讨论AI技能和经验的重要性时，也关注到了对不同背景人才的公平性。","最后，讲者鼓励听众继续学习和掌握AI技能，以帮助自己和朋友在校园内提升相关能力。这表明，讲者认为AI技能的普及和学习是当前教育和职业发展的重要方向。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3173.04,"end":3315.89,"asr_flags":[158,159,160,161,162],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":3173.04,"text":"And so this is a good time, frankly."},{"start":3175.08,"text":"I wish every single Stanford student"},{"start":3178.56,"text":"will learn to build software with AI assistance."},{"start":3181.88,"text":"So I hope you go help your friends across campus"},{"start":3186.02,"text":"to master those skills as well."},{"start":3188.26,"text":"Okay?"},{"start":3191.06,"text":"Any other questions?"},{"start":3193.42,"text":"Yes, go ahead."},{"start":3194.8,"text":"So would you say about the kind of online, knowing that you're from a different world,"},{"start":3200.28,"text":"but also being in the field of AI, I kind of love it."},{"start":3202.9,"text":"Like, a lot of people are talking about how they would rather hire someone with 10 years"},{"start":3209.24,"text":"of experience when no one's just trained in AI as is, like just using coding instead,"},{"start":3214.94,"text":"rather than a freshman undergrad that does come, like that people are understanding of"},{"start":3226.82,"text":"Yeah, so let me rank productivity, right, and I'll give you four levels."},{"start":3233.42,"text":"I think, and again, and I say this with a lot of respect for individuals,"},{"start":3236.9,"text":"so if I talk about productivity, it's not with any disrespect or any lack of affection"},{"start":3240.76,"text":"for anyone or for their work, right?"},{"start":3242.48,"text":"But I think, you know, least productive are people with no experience and don't know AI, right?"},{"start":3247.62,"text":"Right. One step on top of that is people with less experience, but on, sorry, one step on top of that"},{"start":3256.04,"text":"is people with, say, a decade of experience, but that don't know AI. On top of that, I would rather"},{"start":3264.96,"text":"take a fresh college grad that doesn't know AI, but then even more productive is someone with,"},{"start":3270.36,"text":"you know, a decade of experience and also really on top of AI. So I think between the two factors."},{"start":3276.39,"text":"Really, understanding AI is very important, but experience is also important. And so the best developers I know, we just work and we just ship code like no one's ever done, I think, even two, three years ago, are very experienced developers. They're also very on top of how they use the latest AI technologies."},{"start":3300.45,"text":"Oh, sorry. And just one other thing about the job market. I find a lot of employers have not yet figured out how to hire appropriately. This is contributing. Frankly, a lot of employers, if a company has no one that knows Gen EI, how do they even know how to interview appropriately? So that is a problem that we need to solve as well. Go ahead."}],"speech_gaps":[{"start":3224.016,"end":3225.52}],"frame":"../frames/v060/020.webp","frame_time":3185.04},{"title":"课程建议与生成式AI技能分类","segments":[{"id":174,"text":"Yeah, boy. So CS117, CS111 are great. So do take them if you're considering them. I find that the fundamentals are important. How do I put it? Yeah, I'm not sure what else to say other than that. I think, honestly, Stanford were known for, CS department were known for really...","zh":"是的，伙计。所以CS117、CS111都很棒。如果你在考虑这些课程，我建议你选修它们。我发现基础非常重要。怎么说呢？是的，我不确定还有什么好说的了。老实说，我感觉斯坦福大学的计算机系以……","start":3336.47,"end":3359.41},{"id":175,"text":"I know I'm biased, but I want to say that probably the best entry-level CS program classes of any university in the world. I'm probably biased, so I shouldn't say that. But I think there are excellent courses if you want to learn the fundamentals in a really solid way. And I know the instructors are routinely thinking about how to update the curriculum and realities of Gen EI. So I think they do an excellent job with that mix.","zh":"我知道我有点偏见，但我想说，这可能是世界上任何大学里最好的入门级计算机科学课程。我可能有点偏见，所以我不该这么说。但我觉得如果你想要以非常扎实的方式学习基础知识，那里有非常优秀的课程。我知道授课教师经常思考如何更新课程内容以及应对Gen EI的现实情况。因此，我认为他们在这种结合上做得非常出色。","start":3360.15,"end":3380.39},{"id":176,"text":"Yeah, how do I define someone that really knows Gen AI compared to someone that just uses a tool and tests a problem? So I feel like in Gen AI, there are two buckets of skill. And again, by the way, deep learning is not Gen AI. Deep learning is also a very valuable skill, but since you asked about Gen AI, I think there are two things. One is I find it really useful to know how to use AI coding assistance. That's really valuable.","zh":"是的，我怎么定义一个真正了解Gen AI的人和仅仅使用工具并测试问题的人呢？我觉得在Gen AI领域，技能可以分为两个类别。顺便提一句，深度学习并不是Gen AI。深度学习也是一个非常有价值的技能，但既然你问的是Gen AI，我认为有两点。第一点，我发现了解如何使用AI编码辅助工具非常有用，这真的很有价值。","start":3391.9,"end":3412.62},{"id":177,"text":"But having, you know, kind of fundamental knowledge hosts, right? You do that. And then the other thing is in GenAI, there's a number of emerging tools. I'm going to toss up some buzzwords, okay? So if you don't know what any of these words mean, don't worry about it. But I think there are emerging tools like RAG, Retrieved Augmented Generation, or vector databases, how to do evals and error analysis, how to build guardrails, how to use knowledge drops, interface that with your OOM.","zh":"但你还需要有一定的基础知识，对吧？你得掌握这些。然后另一点是，在Gen AI领域，有许多新兴工具。我将列举一些 buzzwords，好吧。如果你不知道这些词的意思，不用担心。但我觉得有像RAG（Retrieved Augmented Generation，检索增强生成）、向量数据库、如何做评估和错误分析、如何构建护栏、如何使用知识滴、如何将这些与你的OOM（可能指大模型）接口等新兴工具。","start":3414.0,"end":3440.98},{"id":178,"text":"maybe how to do multimodal arms, how to fine-tune a model. What else? I'm probably blanking on something. Oh, how to build agentic workflows. But I feel like there are these categories of new techniques built on top of Gen AI that are like a useful bag of tools for building applications. So when, well, frankly, when I'm interviewing candidates, which I still do a fair amount of, is where Gen AI row is these skills I tend to look for. This set of tools, as well as AI-assisted coding.","zh":"也许如何进行多模态处理、如何微调模型。还有什么？我可能漏掉了什么。哦，如何构建代理工作流。但我觉得在Gen AI领域，这些新技巧是建立在Gen AI之上的，它们像是一套有用的工具，用于构建应用程序。所以，说实话，当我面试候选人时，我仍然做相当多的面试，我寻找的就是这些技能。这组工具，以及AI辅助编码。","start":3441.26,"end":3470.6},{"id":179,"text":"Yeah, so let me just give one tip about CS courses in general, not just 239 and CS230, which is I encourage you to think of AI courses at Stanford a bit like Pokemon. You've got to catch them all.","zh":"是的，让我再给一个关于计算机科学课程的一般性建议，不仅仅是239和CS230。我鼓励你们把斯坦福的人工智能课程当作宝可梦来想，你们必须把它们都捕捉到。","start":3488.81,"end":3504.34}],"notes":["本段主要讨论了斯坦福大学计算机科学课程的价值，特别是CS117和CS111的基础课程，强调了学习这些课程对掌握计算机科学基础的重要性。讲者提到斯坦福计算机系以提供高质量的入门课程而闻名，并指出课程内容会根据现实情况不断更新，以适应新一代学生的需求。","讲者进一步区分了生成式AI（Gen AI）技能与仅使用工具的技能，指出生成式AI需要两个方面的技能：一是掌握AI编码辅助工具的使用，二是理解生成式AI的新兴技术，如RAG（检索增强生成）、向量数据库、评估和错误分析、构建护栏、知识滴、多模态系统、微调模型以及构建代理工作流等。","讲者提到在面试候选人时，会特别关注这些生成式AI相关的技能，认为这些技能是构建实际应用的重要工具。此外，讲者还建议将斯坦福的AI课程视为类似“宝可梦”的收集过程，鼓励学生尽可能学习所有相关课程。","讲者强调了基础课程的重要性，并指出深度学习虽然是一个非常有价值的技能，但它并不等同于生成式AI。生成式AI涉及更广泛的新兴技术和工具，这些工具对于构建实际应用至关重要。","讲者提到在面试过程中，会特别关注候选人在生成式AI方面的技能，包括使用AI辅助编码、理解新兴工具以及构建代理工作流等。这些技能被认为是构建实际应用的重要工具。","讲者最后以一个比喻鼓励学生尽可能学习所有相关的AI课程，将它们视为需要“捕捉”的宝可梦，以获得全面的知识体系。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3336.47,"end":3504.34,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3336.47,"text":"Yeah, boy. So CS117, CS111 are great. So do take them if you're considering them. I find that the fundamentals are important. How do I put it? Yeah, I'm not sure what else to say other than that. I think, honestly, Stanford were known for, CS department were known for really..."},{"start":3360.15,"text":"I know I'm biased, but I want to say that probably the best entry-level CS program classes of any university in the world. I'm probably biased, so I shouldn't say that. But I think there are excellent courses if you want to learn the fundamentals in a really solid way. And I know the instructors are routinely thinking about how to update the curriculum and realities of Gen EI. So I think they do an excellent job with that mix."},{"start":3391.9,"text":"Yeah, how do I define someone that really knows Gen AI compared to someone that just uses a tool and tests a problem? So I feel like in Gen AI, there are two buckets of skill. And again, by the way, deep learning is not Gen AI. Deep learning is also a very valuable skill, but since you asked about Gen AI, I think there are two things. One is I find it really useful to know how to use AI coding assistance. That's really valuable."},{"start":3414.0,"text":"But having, you know, kind of fundamental knowledge hosts, right? You do that. And then the other thing is in GenAI, there's a number of emerging tools. I'm going to toss up some buzzwords, okay? So if you don't know what any of these words mean, don't worry about it. But I think there are emerging tools like RAG, Retrieved Augmented Generation, or vector databases, how to do evals and error analysis, how to build guardrails, how to use knowledge drops, interface that with your OOM."},{"start":3441.26,"text":"maybe how to do multimodal arms, how to fine-tune a model. What else? I'm probably blanking on something. Oh, how to build agentic workflows. But I feel like there are these categories of new techniques built on top of Gen AI that are like a useful bag of tools for building applications. So when, well, frankly, when I'm interviewing candidates, which I still do a fair amount of, is where Gen AI row is these skills I tend to look for. This set of tools, as well as AI-assisted coding."},{"start":3488.81,"text":"Yeah, so let me just give one tip about CS courses in general, not just 239 and CS230, which is I encourage you to think of AI courses at Stanford a bit like Pokemon. You've got to catch them all."}],"speech_gaps":[{"start":3382.192,"end":3383.696},{"start":3471.136,"end":3473.328},{"start":3475.696,"end":3477.776},{"start":3484.144,"end":3485.776}],"frame":"../frames/v060/021.webp","frame_time":3348.47},{"title":"课程对比与学习建议","segments":[{"id":180,"text":"But in all seriousness, I think taking more CS courses than AI, it is a good thing to do. Definitely encourage you to take multiple courses. I think in some years, we've had students do joint projects where the standard is higher, higher expectations for sure. But that's one option to look at. Yeah. All right. Go for it. Oh, so let's see. 239 and 230 are very different courses. 239, well, in 239, we have live instructors.","zh":"但认真来说，我认为比起人工智能，多修一些计算机科学课程是一件好事。强烈建议你们修读多门课程。我认为在某些年份，我们曾有学生进行联合项目，标准更高，期望也更高。但这是一种可以考虑的选择。是的。好了。去尝试吧。哦，那么我们来看看。239和230是非常不同的课程。在239中，我们有现场教师。","start":3506.63,"end":3546.55},{"id":181,"text":"doing the lectures in person rather than online content, so it's not the flipped classroom. So in CS230, we have most of the materials prepared kind of in online videos, highly edited online videos. And then, I think the other biggest difference is CS239 is more mathematical, theoretical, but there's important math, right? Whereas CS230 is more practical, and so...","zh":"课程内容不是在线内容，而是现场授课，因此不是翻转课堂。在CS230中，我们大部分材料是以在线视频形式准备的，而且这些视频经过高度编辑。我认为另一个最大的区别是CS239更加数学化、理论化，但也有重要的数学内容，对吧？而CS230更加实践化，因此……","start":3547.82,"end":3572.62},{"id":182,"text":"I don't know if we do even want a single, maybe we do like one proof somewhere in the lectures, but we just don't do a lot of math in CS230. And it's very, a lot of machine learning is very empirical. You should try to see what works, but have a disciplined approach for exploring what works. So we focus a lot more on that in CS230. And 239 covers a lot more techniques, right? So there are a lot of machine learning techniques, supervised learning, unsupervised learning, you know, I don't know, decision trees, boosting.","zh":"我不知道我们是否真的想要一个单一的证明，也许我们在课程中会有一个证明，但我们并不在CS230中做很多数学。而且，很多机器学习是非常经验性的。你应该尝试看看什么有效，但要有纪律地探索什么有效。因此，我们在CS230中更加注重这一点。而239涵盖了很多技术，对吧？因此，有很多机器学习技术，监督学习、无监督学习，比如决策树、提升方法。","start":3573.05,"end":3599.77},{"id":183,"text":"K-means clustering. So CS229 covers a much broader survey of a lot of machine learning techniques, whereas CS230 is just one thing. Well, we go really deep into deep learning.","zh":"K均值聚类。因此，CS229涵盖了大量机器学习技术的广泛调查，而CS230只专注于一个方面。我们深入探讨深度学习。","start":3600.73,"end":3610.99}],"notes":["本段主要对比了CS230与CS239两门课程的区别，强调CS230更注重实践，而CS239则更偏向理论数学。讲者建议学生根据自身兴趣和目标选择课程，同时鼓励多修读相关课程。","讲者提到CS230的课程内容以在线视频为主，且内容经过高度编辑，强调实践性，而CS239则有现场教师授课，课程内容更偏向数学理论。","在CS230中，虽然会涉及一些数学证明，但整体上数学内容较少，课程更注重机器学习的实证方法，鼓励学生通过实验探索有效的方法。","CS239涵盖更多机器学习技术，包括监督学习、无监督学习、决策树、提升方法（boosting）和K均值聚类等，而CS230则专注于深度学习，深入探讨该领域。","讲者指出CS229是一门更广泛的机器学习课程，覆盖多种技术，而CS230则专注于深度学习，深入探讨该领域。","讲者鼓励学生根据自己的兴趣和职业规划选择课程，并强调实践在机器学习中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3506.63,"end":3610.99,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":3506.63,"text":"But in all seriousness, I think taking more CS courses than AI, it is a good thing to do. Definitely encourage you to take multiple courses. I think in some years, we've had students do joint projects where the standard is higher, higher expectations for sure. But that's one option to look at. Yeah. All right. Go for it. Oh, so let's see. 239 and 230 are very different courses. 239, well, in 239, we have live instructors."},{"start":3547.82,"text":"doing the lectures in person rather than online content, so it's not the flipped classroom. So in CS230, we have most of the materials prepared kind of in online videos, highly edited online videos. And then, I think the other biggest difference is CS239 is more mathematical, theoretical, but there's important math, right? Whereas CS230 is more practical, and so..."},{"start":3573.05,"text":"I don't know if we do even want a single, maybe we do like one proof somewhere in the lectures, but we just don't do a lot of math in CS230. And it's very, a lot of machine learning is very empirical. You should try to see what works, but have a disciplined approach for exploring what works. So we focus a lot more on that in CS230. And 239 covers a lot more techniques, right? So there are a lot of machine learning techniques, supervised learning, unsupervised learning, you know, I don't know, decision trees, boosting."},{"start":3600.73,"text":"K-means clustering. So CS229 covers a much broader survey of a lot of machine learning techniques, whereas CS230 is just one thing. Well, we go really deep into deep learning."}],"speech_gaps":[],"frame":"../frames/v060/022.webp","frame_time":3518.63}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v060.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
