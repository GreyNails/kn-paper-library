<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斯坦福CS230：深度学习导论</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：深度学习导论 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v060","title":"斯坦福CS230：深度学习导论","course":"深度学习","pages":[{"title":"课程介绍与教学模式","segments":[{"id":0,"text":"What I want to do today is give an overview of this class. I'm actually curious, before we get started, this is now September 2025. How many of you just started at Stanford? Raise your hand. Wow, cool, awesome. So others, pay attention to who just raised their hands and do say hi to them and welcome all of the people that just joined Stanford in whatever program.","start":5.23,"end":32.89},{"id":1,"text":"CS 230 is a class that we offer in the flipped classroom format. And what that means is that instead of listening to me or Qian, my co-instructor that you meet next week, instead of listening to us lecture at you for an hour, 20 minutes or whatever, we actually ask you to watch a lot of the video lectures online so that we can then make use of the precious in-classroom time for much richer, deeper learning.","start":34.76,"end":63.2},{"id":2,"text":"discussions. So both today and for the entire quarter, I would really warmly welcome anyone raising questions, raise your hand. And in fact, I find that","start":63.42,"end":74.6},{"id":3,"text":"Instead of you sitting there, even though we have a longer session scheduled by the registrar, we'll use usually only up to an hour and 20 minutes for this course. And the goal is to, it turns out that a lot of Stanford students were watching the lectures on Segal.","start":75.39,"end":93.93},{"id":4,"text":"online videos anyway so rather than us delivering that lecture same lecture year after year we put a lot more effort to put very high quality lecture videos online and we'll ask you to just watch that online which people are doing anyway but just highly edited for offline watching um spend and spend the classroom time you know doing the things that make sense for us to get together in person too","start":94.91,"end":117.89},{"id":5,"text":"So because you haven't watched any of the lectures yet, or I assume most of you have not, today we'll even maybe have a slightly shorter session to introduce the class, talk over logistics, and so on. As many of you know, deep learning is one of the latest, hottest trends technologies of computer science and AI.","start":118.94,"end":141.73},{"id":6,"text":"say our PhD admissions or even master's admissions, a very large fraction of all students that come to Stanford or are applying to come to Stanford want to work on AI. I'm not sure I'm allowed to say the numbers, but they are extremely high, as you can imagine. And so my goal and my co-instructor Kian's goal, our collective goal, is through this quarter to help you get to...","start":141.95,"end":167.17}],"notes":["本段介绍了课程的教学模式，即翻转课堂（flipped classroom）模式。这种模式要求学生在课前观看在线视频讲座，以便在课堂上进行更深入的学习和讨论。教师强调了这种模式的优势，即节省课堂时间，用于更有价值的互动和学习活动。","教师提到，由于学生尚未观看讲座，因此今天的课程可能会稍短一些，用于介绍课程内容和相关事务。同时，教师指出深度学习是计算机科学和人工智能领域当前最热门的技术之一，吸引了大量学生申请斯坦福大学。","教师还提到，斯坦福大学的博士和硕士申请中，有很大比例的学生希望从事人工智能相关的工作，这表明深度学习在学术界和工业界的重要性。教师和助教的目标是通过本课程帮助学生掌握深度学习的核心概念和技能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":167.17,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.23,"text":"What I want to do today is give an overview of this class. I'm actually curious, before we get started, this is now September 2025. How many of you just started at Stanford? Raise your hand. Wow, cool, awesome. So others, pay attention to who just raised their hands and do say hi to them and welcome all of the people that just joined Stanford in whatever program."},{"start":34.76,"text":"CS 230 is a class that we offer in the flipped classroom format. And what that means is that instead of listening to me or Qian, my co-instructor that you meet next week, instead of listening to us lecture at you for an hour, 20 minutes or whatever, we actually ask you to watch a lot of the video lectures online so that we can then make use of the precious in-classroom time for much richer, deeper learning."},{"start":63.42,"text":"discussions. So both today and for the entire quarter, I would really warmly welcome anyone raising questions, raise your hand. And in fact, I find that"},{"start":75.39,"text":"Instead of you sitting there, even though we have a longer session scheduled by the registrar, we'll use usually only up to an hour and 20 minutes for this course. And the goal is to, it turns out that a lot of Stanford students were watching the lectures on Segal."},{"start":94.91,"text":"online videos anyway so rather than us delivering that lecture same lecture year after year we put a lot more effort to put very high quality lecture videos online and we'll ask you to just watch that online which people are doing anyway but just highly edited for offline watching um spend and spend the classroom time you know doing the things that make sense for us to get together in person too"},{"start":118.94,"text":"So because you haven't watched any of the lectures yet, or I assume most of you have not, today we'll even maybe have a slightly shorter session to introduce the class, talk over logistics, and so on. As many of you know, deep learning is one of the latest, hottest trends technologies of computer science and AI. If we look at..."},{"start":141.95,"text":"say our PhD admissions or even master's admissions, a very large fraction of all students that come to Stanford or are applying to come to Stanford want to work on AI. I'm not sure I'm allowed to say the numbers, but they are extremely high, as you can imagine. And so my goal and my co-instructor Kian's goal, our collective goal, is through this quarter to help you get to..."}],"speech_gaps":[],"frame":"../frames/v060/001.webp","frame_time":17.23},{"title":"深度学习的进展与数据的重要性","segments":[{"id":7,"text":"near or at pretty much state of the art with regard to deep learning. And make sure that all of you walk away from this class highly skilled at applying deep learning. And so it turns out that a lot of progress in AI over the last, I don't know, decade?","start":167.58,"end":187.63},{"id":8,"text":"maybe 10-15 years, was made by scaling.","start":188.4,"end":191.78},{"id":9,"text":"And one of the reasons why deep learning was so","start":192.14,"end":194.14},{"id":10,"text":"successful was because it's good at absorbing a lot of data.","start":194.14,"end":197.56},{"id":11,"text":"So, you know, if I draw a figure where on the x-axis,","start":198.28,"end":205.08},{"id":12,"text":"I plot the amount of data we have for a problem,","start":205.26,"end":211.02},{"id":13,"text":"then using more traditional machine learning algorithms,","start":211.96,"end":215.22},{"id":14,"text":"so, you know, logistic regression,","start":215.36,"end":216.64},{"id":15,"text":"regression, maybe decision trees, using all the generations of AI machine learning algorithms.","start":216.64,"end":221.2},{"id":16,"text":"As you gave it more and more data, the performance or the accuracy of the more traditional algorithms","start":225.88,"end":231.38},{"id":17,"text":"would plateau.","start":231.38,"end":232.12},{"id":18,"text":"It was as if, so take speech recognition, with all the generations of algorithms, even","start":232.54,"end":237.54},{"id":19,"text":"hundreds and thousands and tens of thousands of hours was a speech data","start":237.54,"end":242.3},{"id":20,"text":"was a speech data, the accuracy would often plateau, and it was as if the older generations","start":242.3,"end":248.52},{"id":21,"text":"of algorithms didn't know what to do with all the data that we now have.","start":248.52,"end":252.76},{"id":22,"text":"But what we started to find about 10, 15 years ago was that if you train a small neural network,","start":253.46,"end":263.34},{"id":23,"text":"also known as a small deep learning model, its performance would kind of maybe get better","start":263.52,"end":268.68},{"id":24,"text":"and if you train a medium-sized one, and if you train a very large neural","start":268.68,"end":275.46},{"id":25,"text":"network, the performance just keeps getting better and better.","start":275.46,"end":279.08},{"id":26,"text":"And I think the reason that deep learning has dominated the AIC for the last 10, 15","start":279.58,"end":285.22},{"id":27,"text":"years is because there is a recipe for training very large neural networks that we can then","start":285.22,"end":291.92},{"id":28,"text":"shove a lot of data into that results in exceptional performance.","start":291.92,"end":295.84},{"id":29,"text":"performance. So I think we started to see this because of some, frankly, some Stanford research","start":295.84,"end":302.2},{"id":30,"text":"papers about 15 years ago when, you know, did the first early work on using cooler programming","start":302.2,"end":309.1},{"id":31,"text":"GPUs to scale deep learning. Oh, by the way, actually, it's one fun fact. The first, my first","start":309.1,"end":315.66},{"id":32,"text":"GPU machine used to train neural networks using Coo there, which is a controversial thing at the time. It was built by a Stanford undergrad in his dorm room. His name was Ian Goodfellow. But I think that compute server built in the Stanford undergrad dorm room allowed us at Stanford...","start":316.61,"end":333.83}],"notes":["本段讲授了深度学习在人工智能领域取得成功的原因，强调了数据量对传统机器学习算法和深度学习模型性能的影响。传统算法在数据量增加时性能趋于平稳，而深度学习模型随着数据量的增加性能持续提升。","讲者通过语音识别的例子说明了传统算法在面对大量数据时的局限性，指出旧算法无法有效利用新增数据，而深度学习模型则能持续受益于更多数据。","讲者提到大约10到15年前，研究人员开始发现，训练不同规模的神经网络模型时，随着数据量的增加，模型性能会持续提升，这成为深度学习在AI领域占据主导地位的关键因素。","讲者还提到斯坦福大学的研究在早期推动了深度学习的发展，特别是利用GPU进行大规模计算，这为深度学习的扩展提供了重要支持。","讲者提到第一个用于训练神经网络的GPU机器是由斯坦福大学的一名本科生在宿舍里建造的，这表明早期的深度学习研究在资源有限的情况下也能取得突破。","讲者强调了深度学习模型在处理大量数据时的优势，以及这种优势如何推动了深度学习在人工智能领域的广泛应用。"],"formulas":[],"uncertainties":["hundreds and thousands and tens of thousands of hours was a speech data","was a speech data, the accuracy would often plateau","its performance would kind of maybe get better and better","and if you train a medium-sized one, and if you train a very large neural","network, the performance just keeps getting better and better."],"diagram":"none","start":167.58,"end":333.83,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":167.58,"text":"near or at pretty much state of the art with regard to deep learning. And make sure that all of you walk away from this class highly skilled at applying deep learning. And so it turns out that a lot of progress in AI over the last, I don't know, decade?"},{"start":188.4,"text":"maybe 10-15 years, was made by scaling."},{"start":192.14,"text":"And one of the reasons why deep learning was so"},{"start":194.14,"text":"successful was because it's good at absorbing a lot of data."},{"start":198.28,"text":"So, you know, if I draw a figure where on the x-axis,"},{"start":205.26,"text":"I plot the amount of data we have for a problem,"},{"start":211.96,"text":"then using more traditional machine learning algorithms,"},{"start":215.36,"text":"so, you know, logistic regression,"},{"start":216.64,"text":"regression, maybe decision trees, using all the generations of AI machine learning algorithms."},{"start":225.88,"text":"As you gave it more and more data, the performance or the accuracy of the more traditional algorithms"},{"start":231.38,"text":"would plateau."},{"start":232.54,"text":"It was as if, so take speech recognition, with all the generations of algorithms, even"},{"start":237.54,"text":"as you fed it more and more data, hundreds and thousands and tens of thousands of hours"},{"start":242.3,"text":"was a speech data, the accuracy would often plateau, and it was as if the older generations"},{"start":248.52,"text":"of algorithms didn't know what to do with all the data that we now have."},{"start":253.46,"text":"But what we started to find about 10, 15 years ago was that if you train a small neural network,"},{"start":263.52,"text":"also known as a small deep learning model, its performance would kind of maybe get better"},{"start":268.68,"text":"and better, and if you train a medium-sized one, and if you train a very large neural"},{"start":275.46,"text":"network, the performance just keeps getting better and better."},{"start":279.58,"text":"And I think the reason that deep learning has dominated the AIC for the last 10, 15"},{"start":285.22,"text":"years is because there is a recipe for training very large neural networks that we can then"},{"start":291.92,"text":"shove a lot of data into that results in exceptional performance."},{"start":295.84,"text":"performance. So I think we started to see this because of some, frankly, some Stanford research"},{"start":302.2,"text":"papers about 15 years ago when, you know, did the first early work on using cooler programming"},{"start":309.1,"text":"GPUs to scale deep learning. Oh, by the way, actually, it's one fun fact. The first, my first"},{"start":316.61,"text":"GPU machine used to train neural networks using Coo there, which is a controversial thing at the time. It was built by a Stanford undergrad in his dorm room. His name was Ian Goodfellow. But I think that compute server built in the Stanford undergrad dorm room allowed us at Stanford..."}],"speech_gaps":[{"start":221.6,"end":223.344}],"frame":"../frames/v060/002.webp","frame_time":179.58},{"title":"深度学习的起源与影响","segments":[{"id":33,"text":"to lay the early foundations of using CUDA, at that time, a modern language for training GPUs to train large neural networks. And then, you know, obviously that influenced a lot of people and helped scaling up deep learning take off. So I tell that story because sometimes the work that some of you can do, you know, in a dorm room or graduate student housing or whatever, or in a lab at Stanford, looking back.","start":334.03,"end":358.69},{"id":34,"text":"over some number of years, it can really have a huge impact. And maybe in this class, some of you will do work as impactful as that someday as well. But so what we started to find was that as you train larger and larger neural networks, they could soak up lots of data and drive exceptional performance. And then there was a research paper out of Baidu which showed that as you scale up...","start":359.15,"end":383.54},{"id":35,"text":"What would the performance be? And then later, OpenAI popularized the idea with a really influential paper on scaling laws and that predictability of how deep learning gets better in performance then drove a lot of the investments in data centers and building very large AI models with lots of data.","start":383.81,"end":393.75},{"id":36,"text":"Let's see. In terms of where this class sits. So in computer science, all of us build on each other's work, right? A lot of the way that computer science and AI has made progress is we build on top of other ideas that are in turn built on top of other ideas that are in turn built on top of other ideas. So maybe I want to give you a little map to show you maybe where deep learning sits. So I think there are...","start":394.16,"end":413.86},{"id":37,"text":"You know, machine learning is built on top of computer science, so I think it's actually helpful to learn CS fundamentals. And even though I use, and I suspect the vast majority of you use AI-assisted coding, be it tools like Cloud Code or Gemini CLI or OpenAI Codex or Cursor or WinServe or whatever, I find that people that know CS fundamentals, they really understand computer science, they really understand how computers work, rather than, like, I'm going to vibe code this. You know, when you understand CS fundamentals, you get things to work.","start":418.3,"end":445.16},{"id":38,"text":"much better. But on top of CS fundamentals, there's a set of machine learning skills. So how do you build algorithms that can learn from data? And then deep learning is a special type of machine learning. Well, that's really the most effective type of machine learning, as far as I can tell, in which we train neural networks. We train certain types of algorithms to learn from large amounts of data.","start":449.77,"end":477.89},{"id":39,"text":"much better. But on top of CS fundamentals, there's a set of machine learning skills. So how do you build algorithms that can learn from data? And then deep learning is a special type of machine learning. Well, that's really the most effective type of machine learning, as far as I can tell, in which we train neural networks. We train certain types of algorithms to learn from large amounts of data.","start":478.26,"end":509.48}],"notes":["本段讲授了深度学习的起源，强调了CUDA在训练GPU上的作用，以及早期研究对深度学习发展的推动作用。讲者提到，即使是个人在宿舍或实验室中进行的研究，也可能产生重大影响。","讲者指出，随着神经网络规模的扩大，它们能够吸收大量数据并实现卓越的性能。Baidu的研究论文表明，随着深度学习算法的扩展，性能提升是可预测的，这使得人们可以预测在购买一定数量的GPU和投入大量计算资源后，模型的性能表现。","OpenAI通过一篇关于扩展定律的有影响力的论文推广了这一理念，这种可预测性推动了数据中心的投资，并促使构建非常大的AI模型，这些模型使用大量数据进行训练。","讲者强调了计算机科学在深度学习中的基础地位，指出学习计算机科学基础对于理解计算机如何工作至关重要。即使使用AI辅助编程工具，掌握计算机科学基础的人更能理解代码的运行机制。","讲者进一步指出，除了计算机科学基础，还需要掌握机器学习技能，包括如何构建能够从数据中学习的算法。深度学习是机器学习的一个特殊类型，被认为是目前最有效的机器学习方法之一，通过训练神经网络来实现从大量数据中学习。","讲者通过构建知识体系的比喻，帮助学生理解深度学习在计算机科学和人工智能中的位置，强调了不同层次知识之间的相互依赖关系。"],"formulas":[],"uncertainties":[],"diagram":"none","start":334.03,"end":509.48,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":334.03,"text":"to lay the early foundations of using CUDA, at that time, a modern language for training GPUs to train large neural networks. And then, you know, obviously that influenced a lot of people and helped scaling up deep learning take off. So I tell that story because sometimes the work that some of you can do, you know, in a dorm room or graduate student housing or whatever, or in a lab at Stanford, looking back."},{"start":359.15,"text":"over some number of years, it can really have a huge impact. And maybe in this class, some of you will do work as impactful as that someday as well. But so what we started to find was that as you train larger and larger neural networks, they could soak up lots of data and drive exceptional performance. And then there was a research paper out of Baidu which showed that as you scale up..."},{"start":383.81,"text":"new networks, as you scale up deep learning algorithms, the performance gains are actually quite predictable. So you can forecast if you buy this many GPUs, throw this much compute and this much data at it."},{"start":394.16,"text":"What would the performance be? And then later, OpenAI popularized the idea with a really influential paper on scaling laws and that predictability of how deep learning gets better in performance then drove a lot of the investments in data centers and building very large AI models with lots of data."},{"start":418.3,"text":"Let's see. In terms of where this class sits. So in computer science, all of us build on each other's work, right? A lot of the way that computer science and AI has made progress is we build on top of other ideas that are in turn built on top of other ideas that are in turn built on top of other ideas. So maybe I want to give you a little map to show you maybe where deep learning sits. So I think there are..."},{"start":449.77,"text":"You know, machine learning is built on top of computer science, so I think it's actually helpful to learn CS fundamentals. And even though I use, and I suspect the vast majority of you use AI-assisted coding, be it tools like Cloud Code or Gemini CLI or OpenAI Codex or Cursor or WinServe or whatever, I find that people that know CS fundamentals, they really understand computer science, they really understand how computers work, rather than, like, I'm going to vibe code this. You know, when you understand CS fundamentals, you get things to work."},{"start":478.26,"text":"much better. But on top of CS fundamentals, there's a set of machine learning skills. So how do you build algorithms that can learn from data? And then deep learning is a special type of machine learning. Well, that's really the most effective type of machine learning, as far as I can tell, in which we train neural networks. We train certain types of algorithms to learn from large amounts of data."}],"speech_gaps":[{"start":416.176,"end":417.712}],"frame":"../frames/v060/003.webp","frame_time":346.03},{"title":"深度学习与神经网络术语的演变","segments":[{"id":40,"text":"So far in the last 10 minutes, you probably heard me use the words deep learning and neural networks. And I think today those two terms are almost interchangeable. Some purists will insist on some technical differences. Raw practices mean the same thing. But what happened was the term neural networks had been around for decades. But around 10, 15 years ago, a number of us realized that deep learning, it was just a much better brand.","start":510.34,"end":538.1},{"id":41,"text":"And so even though neural networks have been around for decades, starting about 10, 15 years ago, it was deep learning that took off. Because who doesn't want learning that is really deep? It's just a good brand. But you hear me use those terms kind of interchangeably. But deep learning algorithms, neural networks.","start":538.86,"end":560.34},{"id":42,"text":"They give us a way to take advantage of more and more and more compute capacity so they can build very large AI models with a lot of parameters to soak up the large amounts of data to get more and more intelligent or to make better and better predictions or generate more and more accurate outputs using a large amount of data that's available to us.","start":561.02,"end":585.98},{"id":43,"text":"But now, many years later, I still struggle with that. So I'll try my best, but please wave at me or kind of let me know if I start to drift lower again. I think my mother would be very happy to practice like this now. All right. So CS fundamentals, machine learning, deep learning, and then the recent generative AI revolution. You know, generative AI.","start":588.0,"end":618.66},{"id":44,"text":"sorry, bad handwriting, generative AI, which is mostly built by a specific type of neural network called the transformer neural network, which you learned about in this class. You actually learned what is the transformer architecture later in this quarter as well. It is in turn built on top of deep learning, right? So I assume all of you, you know, are regularly prompting LLMs, large language models, to help you get work done.","start":619.83,"end":648.85},{"id":45,"text":"And what I find is that While I use LLMs all the time, for a lot of applications, just prompting LLMs, it doesn't cut it. There are a lot of things that I cannot get to work just by prompting an LLM. And so I'll often have to go a layer deeper into the deep learning layer of abstraction and fiddle with deep learning algorithms in order to get certain things to work. And in fact...","start":649.43,"end":670.57}],"notes":["本段主要讲解了深度学习与神经网络这两个术语的演变关系。讲者指出，尽管这两个术语在实际使用中经常被互换，但严格来说它们存在一些技术上的差异。然而，由于‘深度学习’这一术语在品牌效应上的优势，它在过去的10到15年间迅速发展，成为主流的称呼。","讲者提到，神经网络的概念已经存在了几十年，但直到大约10到15年前，人们才意识到‘深度学习’是一个更有效的品牌，从而推动了该领域的快速发展。这表明术语的演变不仅与技术发展有关，也与市场接受度和品牌效应密切相关。","讲者进一步说明，深度学习和神经网络的结合使得我们能够利用更多的计算资源，构建具有大量参数的大型AI模型，从而更好地处理大量数据，实现更智能的预测和更准确的输出。","讲者还提到，尽管他经常使用大型语言模型（LLMs）来帮助完成任务，但在许多应用场景中，仅仅通过提示LLMs是不够的。因此，他需要深入到深度学习的抽象层次，调整深度学习算法以实现特定的目标。","最后，讲者指出，深度学习不仅仅是神经网络的延伸，它还构建在更广泛的机器学习和计算机科学基础之上，是当前生成式AI革命的核心技术之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":510.34,"end":670.57,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":510.34,"text":"So far in the last 10 minutes, you probably heard me use the words deep learning and neural networks. And I think today those two terms are almost interchangeable. Some purists will insist on some technical differences. Raw practices mean the same thing. But what happened was the term neural networks had been around for decades. But around 10, 15 years ago, a number of us realized that deep learning, it was just a much better brand."},{"start":538.86,"text":"And so even though neural networks have been around for decades, starting about 10, 15 years ago, it was deep learning that took off. Because who doesn't want learning that is really deep? It's just a good brand. But you hear me use those terms kind of interchangeably. But deep learning algorithms, neural networks."},{"start":561.02,"text":"They give us a way to take advantage of more and more and more compute capacity so they can build very large AI models with a lot of parameters to soak up the large amounts of data to get more and more intelligent or to make better and better predictions or generate more and more accurate outputs using a large amount of data that's available to us. Ever since I was a teenager, my mom's been trying to convince me to stop mumbling."},{"start":588.0,"text":"But now, many years later, I still struggle with that. So I'll try my best, but please wave at me or kind of let me know if I start to drift lower again. I think my mother would be very happy to practice like this now. All right. So CS fundamentals, machine learning, deep learning, and then the recent generative AI revolution. You know, generative AI."},{"start":619.83,"text":"sorry, bad handwriting, generative AI, which is mostly built by a specific type of neural network called the transformer neural network, which you learned about in this class. You actually learned what is the transformer architecture later in this quarter as well. It is in turn built on top of deep learning, right? So I assume all of you, you know, are regularly prompting LLMs, large language models, to help you get work done. And what I find is that"},{"start":649.43,"text":"While I use LLMs all the time, for a lot of applications, just prompting LLMs, it doesn't cut it. There are a lot of things that I cannot get to work just by prompting an LLM. And so I'll often have to go a layer deeper into the deep learning layer of abstraction and fiddle with deep learning algorithms in order to get certain things to work. And in fact..."}],"speech_gaps":[],"frame":"../frames/v060/004.webp","frame_time":522.3399999999999},{"title":"课程介绍与先修要求","segments":[{"id":46,"text":"So what this class covers is we'll try to make sure that you are near expert in deep learning by the end of this class, but we'll also kind of dip a little bit into machine learning concepts. We'll talk a lot about objective functions and tips and tricks for optimizing parameters in an efficient way. And then we'll also...","start":671.02,"end":692.98},{"id":47,"text":"actually reach up a little bit to cover some Gen AI. In particular, we'll talk about what is the transformer network. And then through this quarter, Jian and I will also chat a little bit about the job landscape as it relates to Gen AI and deep learning and how deep learning is enabling certain types of Gen AI applications. I have more to say about this, but let me just pause for a second and see if you have any questions. Yeah, go for it.","start":693.48,"end":722.76},{"id":48,"text":"Cause may end up going a little bit fast, may seem like it's going a little bit fast in the first, I don't know, two or three weeks, but some people do pick things up quickly that way. And maybe, actually, so a few causes that you may hear about.","start":726.67,"end":757.54},{"id":49,"text":"So 129 is a relatively easy entry point into machine learning that takes a longer time to go through the core concepts of machine learning. What's the optimization objective? How do you implement gradient descent? What is logistic regression? What's a very basic neural network? So this is a relatively applied...","start":758.86,"end":774.34},{"id":50,"text":"easiest of this list. CS229, which I'm also involved in co-teaching, is much more mathematical and theoretical, very high-paced, very intense, and very mathematical. And this is less applied than 129 and 230, but this will go over a lot more of the theory and the math derivations behind machine learning algorithms. So, for example, if you ever want to learn how to do calculus not using","start":779.06,"end":799.16},{"id":51,"text":"easiest of this list. CS229, which I'm also involved in co-teaching, is much more mathematical and theoretical, very high-paced, very intense, and very mathematical. And this is less applied than 129 and 230, but this will go over a lot more of the theory and the math derivations behind machine learning algorithms. So, for example, if you ever want to learn how to do calculus not using","start":800.08,"end":827.32},{"id":52,"text":"real numbers but calculus using matrices and vectors. You know, that's a bunch of sort of, I don't know, mildly complex math that's worth knowing. CS239 goes over that. CS230, this class is relatively applied and it focuses","start":827.76,"end":842.44}],"notes":["本段介绍了课程CS230的目标，即帮助学生在课程结束时成为深度学习方面的专家，并涉及一些机器学习概念。课程内容包括目标函数、优化参数的技巧，以及生成式人工智能（Gen AI）的相关内容，如Transformer网络。此外，还提到课程会涉及生成式人工智能和深度学习在实际应用中的关系。","讲者提到课程的先修要求，并指出机器学习并非该课程的先修条件。斯坦福大学的AI课程有多个入门点，包括CS129、CS239和CS230。CS129是较为容易的入门课程，注重应用，而CS229则更偏向数学和理论，节奏快且强度高。","CS239涉及更复杂的数学内容，如矩阵和向量的微积分，而CS230则更注重应用，强调实际操作。","讲者提到课程可能在前几周进展较快，但部分学生可能能快速掌握内容。此外，讲者还提到课程会涉及生成式人工智能和深度学习的就业前景。","讲者在回答问题时提到，如果学生没有机器学习背景，可能会觉得课程内容较难，但课程会逐步讲解核心概念，如优化目标、梯度下降、逻辑回归和基本神经网络。","讲者还提到，课程会涉及机器学习算法背后的理论和数学推导，如使用矩阵和向量进行微积分计算，这在CS229中会更深入地讲解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":671.02,"end":842.44,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":671.02,"text":"So what this class covers is we'll try to make sure that you are near expert in deep learning by the end of this class, but we'll also kind of dip a little bit into machine learning concepts. We'll talk a lot about objective functions and tips and tricks for optimizing parameters in an efficient way. And then we'll also..."},{"start":693.48,"text":"actually reach up a little bit to cover some Gen AI. In particular, we'll talk about what is the transformer network. And then through this quarter, Jian and I will also chat a little bit about the job landscape as it relates to Gen AI and deep learning and how deep learning is enabling certain types of Gen AI applications. I have more to say about this, but let me just pause for a second and see if you have any questions. Yeah, go for it."},{"start":726.67,"text":"Oh, good question. When I say prereq, congratulations, you've won the prize for the first question asked in CS230 2035. So well done. So is machine learning a prereq to this course? Not really. So I think two common entry points to AI at Stanford are CS, well, a few common entry points are CS129, CS239, and CS230. If you don't know any machine learning,"},{"start":758.86,"text":"Cause may end up going a little bit fast, may seem like it's going a little bit fast in the first, I don't know, two or three weeks, but some people do pick things up quickly that way. And maybe, actually, so a few causes that you may hear about."},{"start":779.06,"text":"So 129 is a relatively easy entry point into machine learning that takes a longer time to go through the core concepts of machine learning. What's the optimization objective? How do you implement gradient descent? What is logistic regression? What's a very basic neural network? So this is a relatively applied..."},{"start":800.08,"text":"easiest of this list. CS229, which I'm also involved in co-teaching, is much more mathematical and theoretical, very high-paced, very intense, and very mathematical. And this is less applied than 129 and 230, but this will go over a lot more of the theory and the math derivations behind machine learning algorithms. So, for example, if you ever want to learn how to do calculus not using"},{"start":827.76,"text":"real numbers but calculus using matrices and vectors. You know, that's a bunch of sort of, I don't know, mildly complex math that's worth knowing. CS239 goes over that. CS230, this class is relatively applied and it focuses"}],"speech_gaps":[],"frame":"../frames/v060/005.webp","frame_time":683.02},{"title":"深度学习课程概述与学习路径","segments":[{"id":53,"text":"just on deep learning. So of all the machine learning, there are a lot of machine learning algorithms out there, right? Supervised learning, unsupervised learning, a lot of machine learning algorithms out there. And many, many of them are very useful. And so they're all worth learning about. But of all the machine learning algorithms out there, the one category that is most useful, that's taken off the most, is deep learning. And this class focuses just on that, but the other algorithms also.","start":843.04,"end":866.5},{"id":54,"text":"worth learning about. So, 1.29 is the easiest on-ramp. But if you've done either 2.29 or 2.30, I would probably skip 1.29 at that point. But if you are getting started, there are multiple on-ramps. Yeah. Oh, yeah. Can you take 2.29 and 2.30 together? Yeah. Thank you, Price, for the second question. All right. If you don't want to clap, sure, go for it.","start":867.2,"end":892.35},{"id":55,"text":"Yes, you can take CS230 and CS2289 together. We designed the two curricula to be relatively low in overlap. So a very small amount of overlap between these two. All right. We won't clap for every single question, but go ahead.","start":896.43,"end":930.06},{"id":56,"text":"not the latest LLM variations in this course. I think a lot of the, it turns out that when you go to get a job, well, maybe, right? Assuming you go and work in industry, the number of people training LLMs is actually very small, right? So those...","start":932.33,"end":951.13},{"id":57,"text":"jobs have been incredibly well paid, so we hear about kind of very high salaries in the news media, but the vast majority of application builders end up sometimes working the Gen-EI level, not that often training a transformer from scratch, but then often using deep learning tools as well. So maybe one example.","start":951.41,"end":970.61},{"id":58,"text":"Something that many of my teams have done is we have trained transformable foundation models from scratch with relatively small ones in, say, startups. But one thing we do do quite a lot is take a pre-trained transformer network and then engineer our own data to further fine-tune it.","start":971.73,"end":990.69},{"id":59,"text":"Sorry, if I'm using words that you may not totally understand, you're pre-trained, fine-tuned, you know what all those terms are by the end of this quarter. So those are things that we actually do kind of day-to-day. This is important for getting a bunch of process work, so you will gain the foundations needed to do type of work in this course. The one thing we don't do is talk a lot about how to train the largest cutting-edge transformer networks. I think that is a very important skill set. It's a relatively niche one.","start":991.09,"end":1019.81}],"notes":["本段介绍了深度学习在机器学习中的重要性，指出虽然存在许多机器学习算法，但深度学习是最具实用性和广泛应用的类别。课程专注于深度学习，但也提到其他算法也值得学习。","本段讨论了课程的学习路径，指出1.29是入门课程，但如果有2.29或2.30的基础，可以跳过。同时提到可以同时修读CS230和CS2289，课程设计有较低的重叠。","本段提到课程不会深入讨论最新的LLM变体，而是关注实际应用。在工业界，训练LLM的人数较少，大多数应用开发者使用预训练模型进行微调，而不是从头开始训练。","本段举例说明团队如何训练小型基础模型，并强调使用预训练模型进行微调的常见做法。同时指出课程不会深入讨论训练最大规模的LLM网络，这是一个较为专业的技能。","本段提到课程会讲解预训练和微调的概念，并指出这些是日常工作中常见的任务。课程重点在于提供基础知识，而不是深入讨论最前沿的模型训练技术。","本段强调课程的目标是为学生打下基础，使他们能够进行相关工作，但不会深入讨论最前沿的模型训练技术，因为这是一个相对小众的技能。"],"formulas":[],"uncertainties":["transformable foundation models"],"diagram":"none","start":843.04,"end":1019.81,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":843.04,"text":"just on deep learning. So of all the machine learning, there are a lot of machine learning algorithms out there, right? Supervised learning, unsupervised learning, a lot of machine learning algorithms out there. And many, many of them are very useful. And so they're all worth learning about. But of all the machine learning algorithms out there, the one category that is most useful, that's taken off the most, is deep learning. And this class focuses just on that, but the other algorithms also."},{"start":867.2,"text":"worth learning about. So, 1.29 is the easiest on-ramp. But if you've done either 2.29 or 2.30, I would probably skip 1.29 at that point. But if you are getting started, there are multiple on-ramps. Yeah. Oh, yeah. Can you take 2.29 and 2.30 together? Yeah. Thank you, Price, for the second question. All right. If you don't want to clap, sure, go for it."},{"start":896.43,"text":"Yes, you can take CS230 and CS2289 together. We designed the two curricula to be relatively low in overlap. So a very small amount of overlap between these two. All right. We won't clap for every single question, but go ahead. Yeah, so when we cover the recent LLM developments, we will touch on the transformer neural network."},{"start":932.33,"text":"not the latest LLM variations in this course. I think a lot of the, it turns out that when you go to get a job, well, maybe, right? Assuming you go and work in industry, the number of people training LLMs is actually very small, right? So those..."},{"start":951.41,"text":"jobs have been incredibly well paid, so we hear about kind of very high salaries in the news media, but the vast majority of application builders end up sometimes working the Gen-EI level, not that often training a transformer from scratch, but then often using deep learning tools as well. So maybe one example."},{"start":971.73,"text":"Something that many of my teams have done is we have trained transformable foundation models from scratch with relatively small ones in, say, startups. But one thing we do do quite a lot is take a pre-trained transformer network and then engineer our own data to further fine-tune it."},{"start":991.09,"text":"Sorry, if I'm using words that you may not totally understand, you're pre-trained, fine-tuned, you know what all those terms are by the end of this quarter. So those are things that we actually do kind of day-to-day. This is important for getting a bunch of process work, so you will gain the foundations needed to do type of work in this course. The one thing we don't do is talk a lot about how to train the largest cutting-edge transformer networks. I think that is a very important skill set. It's a relatively niche one."}],"speech_gaps":[],"frame":"../frames/v060/006.webp","frame_time":855.04},{"title":"课程性质与目标","segments":[{"id":60,"text":"Some people are getting paid really, really well, but the number of people doing that in the world is actually small, whereas the number of people building applications with this set of skills is very large. Do I know any courses covering that? I think Percy Liang was thinking about doing something, but I don't remember what he's doing this quarter. A few people are thinking about doing something like that.","start":1020.37,"end":1044.43},{"id":61,"text":"So just repeating for the mic, for the home viewers. What portion is coding versus what portion is mathematical analysis? This course is relatively math-light. Sorry, maybe that was too strong a statement. But I think this course is very practical. I remember many years back, speaking with a mathematician.","start":1057.98,"end":1081.72},{"id":62,"text":"And, you know, we were just chatting and he was asking, he was just talking about his career, why he chose to be a mathematician. And I still remember, you know, he had like stars in his eyes when he told me that he chose his career path because he felt his role is to pursue truth and beauty in the universe. And that's why he became a mathematician. In this course, I'm not going to do any truth and beauty stuff, right?","start":1083.81,"end":1112.32},{"id":63,"text":"Truth and beauty is good, but you find that I want to take a very practical approach to talking about how to build applications and build software that works. Cool. Anything else? Cool. Awesome. All right. Thank you for all the questions. Please keep them coming. And feel free to interrupt me or Qian throughout this quarter as well with questions. I love it.","start":1115.3,"end":1138.13},{"id":64,"text":"So just to flesh this out a little bit more, this is what I see in terms of teams building practical applications. And I'm excited about applications because with improving machine learning algorithms, deep learning algorithms, generating algorithms, there are a lot of applications that you can build now that just were impossible or really inaccessible to any...","start":1140.04,"end":1166.3},{"id":65,"text":"person to build even a few years ago. And so I find that when I prompt Gen-AI, it works really well for a lot of","start":1166.7,"end":1177.83}],"notes":["本段主要讨论课程的性质，强调其实践性而非数学深度。讲者提到课程相对数学内容较少，但非常注重实际应用，这与他过去与一位数学家的对话形成对比，后者因追求真理与美而选择数学作为职业。","讲者明确表示，本课程不会涉及真理与美的探讨，而是专注于如何构建实际应用和软件。这种对比突出了课程的实用导向，同时也反映了讲者对数学与应用之间关系的看法。","讲者还提到，随着机器学习和深度学习算法的改进，现在可以构建许多以前无法实现的应用。这表明课程内容将涵盖当前技术发展的实际应用案例。","讲者鼓励学生继续提问，并在本季度中随时打断或提问，显示出他对互动教学的重视。这种开放的态度有助于学生更好地理解和参与课程。","讲者提到，他正在思考如何构建实际应用的团队，并对这些应用的前景感到兴奋。这表明课程内容将涉及团队合作和实际项目开发。","最后，讲者提到他正在与Gen-AI进行交互，并认为这在许多情况下效果很好。这暗示了课程可能涉及生成式人工智能的应用，但具体细节未明确说明。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1020.37,"end":1177.83,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1020.37,"text":"Some people are getting paid really, really well, but the number of people doing that in the world is actually small, whereas the number of people building applications with this set of skills is very large. Do I know any courses covering that? I think Percy Liang was thinking about doing something, but I don't remember what he's doing this quarter. A few people are thinking about doing something like that."},{"start":1057.98,"text":"So just repeating for the mic, for the home viewers. What portion is coding versus what portion is mathematical analysis? This course is relatively math-light. Sorry, maybe that was too strong a statement. But I think this course is very practical. I remember many years back, speaking with a mathematician."},{"start":1083.81,"text":"And, you know, we were just chatting and he was asking, he was just talking about his career, why he chose to be a mathematician. And I still remember, you know, he had like stars in his eyes when he told me that he chose his career path because he felt his role is to pursue truth and beauty in the universe. And that's why he became a mathematician. In this course, I'm not going to do any truth and beauty stuff, right?"},{"start":1115.3,"text":"Truth and beauty is good, but you find that I want to take a very practical approach to talking about how to build applications and build software that works. Cool. Anything else? Cool. Awesome. All right. Thank you for all the questions. Please keep them coming. And feel free to interrupt me or Qian throughout this quarter as well with questions. I love it."},{"start":1140.04,"text":"So just to flesh this out a little bit more, this is what I see in terms of teams building practical applications. And I'm excited about applications because with improving machine learning algorithms, deep learning algorithms, generating algorithms, there are a lot of applications that you can build now that just were impossible or really inaccessible to any..."},{"start":1166.7,"text":"person to build even a few years ago. And so I find that when I prompt Gen-AI, it works really well for a lot of"}],"speech_gaps":[],"frame":"../frames/v060/007.webp","frame_time":1032.37},{"title":"深度学习在不同数据类型中的应用与挑战","segments":[{"id":66,"text":"text-based applications. And there's work on multimodal LLMs, large multimodal models, so making inroads into vision, making inroads into audio, but really, gen-AI algorithms, especially transformer networks trained to output text, you know, like ChaiGPT, Cloud, Gemini, and so on, really fantastic for text-based applications. And I find myself regularly...","start":1178.22,"end":1203.43},{"id":67,"text":"working with deep learning algorithms directly when I am working with audio data, image, and video data, and then also a lot of structured data. Sorry, my handwriting is awful, right?","start":1204.02,"end":1226.81},{"id":68,"text":"So structured data refers to large tables of numbers, like Excel, Google Sheets, spreadsheets. So that's structured data. Unstructured data refers to text, audio, images, maybe video. And because a lot of Gen AI, large language models like ChaiGVD, have grown up being text-in, text-out.","start":1227.51,"end":1248.01},{"id":69,"text":"kinds of machines, they are remarkable for a lot of text processing applications. But for other types of data, I end up often dipping down directly to use various deep learning algorithms. And then it turns out that","start":1248.51,"end":1264.09},{"id":70,"text":"For text-based data, if all you do is prompting, you could usually go quite far. So a lot of applications are built by prompting OMs. But I've been on quite a few teams where after fiddling with the prompts for a month,","start":1264.55,"end":1280.07},{"id":71,"text":"you just can't get the performance to be better just by tuning the prompts. Or another good problem to have, it turns out use of GenAI tools are relatively inexpensive when you're prototyping, right? It's like, you know, a few dollars per million tokens. You can do a lot.","start":1280.66,"end":1301.38},{"id":72,"text":"his product market fit and a lot of users want to use. You know, multiple times I've been on teams where we basically did not care about our large language model bill, right? It was like, whatever, you know, $20 a month or $100 a month was fine. But when more and more users start using it, then to your team's kind of positive surprise, your AI bill really starts to skyrocket.","start":1302.55,"end":1325.03},{"id":73,"text":"And then at some point, you look at how much you're paying for your AI bill, for the large language models, and to bend the cost curve back down, often a lot of the techniques in deep learning become very relevant as well. So there are, I don't know, I'm thinking just some of our bills were really breathtaking. I don't want to say the numbers, but just kind of definitely more than we want to pay. As much as we love the companies providing OEMs, our bills that we're paying them were significantly larger than I wanted to pay.","start":1325.51,"end":1353.01}],"notes":["本段主要讨论深度学习在不同数据类型（结构化与非结构化）中的应用，以及生成式人工智能（Gen AI）在文本处理中的优势。结构化数据如表格数据，而非结构化数据包括文本、音频、图像和视频。生成式AI模型如ChaiGVD等，通常以文本输入和输出为主。","讲者提到，对于文本数据，仅通过提示（prompting）即可实现较好的性能，许多应用是通过提示大型语言模型（LLMs）构建的。然而，当提示调优无法进一步提升性能时，团队可能需要转向更复杂的解决方案。","在原型开发阶段，使用生成式AI工具的成本相对较低，例如每百万个标记只需几美元。但一旦产品市场匹配并有大量用户使用，AI的费用会迅速增加，这可能对团队的预算造成压力。","讲者指出，当AI费用变得过高时，深度学习技术变得尤为重要，以降低计算成本。这表明，尽管生成式AI在某些任务中表现优异，但其高昂的成本可能促使团队重新考虑使用传统深度学习方法。","讲者提到，尽管公司提供的生成式AI服务（如OEMs）非常有用，但其费用可能远超预期，这促使团队寻找更经济的解决方案。","本段强调了生成式AI在文本处理中的强大能力，但也指出了其在实际应用中可能遇到的成本问题，以及深度学习在应对这些挑战时的重要性。"],"formulas":[],"uncertainties":["ChaiGVD（可能为ChaiGPT的误听）","OEMs（可能指Original Equipment Manufacturer，但上下文未明确）"],"diagram":"none","start":1178.22,"end":1353.01,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1178.22,"text":"text-based applications. And there's work on multimodal LLMs, large multimodal models, so making inroads into vision, making inroads into audio, but really, gen-AI algorithms, especially transformer networks trained to output text, you know, like ChaiGPT, Cloud, Gemini, and so on, really fantastic for text-based applications. And I find myself regularly..."},{"start":1204.02,"text":"working with deep learning algorithms directly when I am working with audio data, image, and video data, and then also a lot of structured data. Sorry, my handwriting is awful, right?"},{"start":1227.51,"text":"So structured data refers to large tables of numbers, like Excel, Google Sheets, spreadsheets. So that's structured data. Unstructured data refers to text, audio, images, maybe video. And because a lot of Gen AI, large language models like ChaiGVD, have grown up being text-in, text-out."},{"start":1248.51,"text":"kinds of machines, they are remarkable for a lot of text processing applications. But for other types of data, I end up often dipping down directly to use various deep learning algorithms. And then it turns out that"},{"start":1264.55,"text":"For text-based data, if all you do is prompting, you could usually go quite far. So a lot of applications are built by prompting OMs. But I've been on quite a few teams where after fiddling with the prompts for a month,"},{"start":1280.66,"text":"you just can't get the performance to be better just by tuning the prompts. Or another good problem to have, it turns out use of GenAI tools are relatively inexpensive when you're prototyping, right? It's like, you know, a few dollars per million tokens. You can do a lot. But sometimes if you're lucky enough to be on a product that"},{"start":1302.55,"text":"his product market fit and a lot of users want to use. You know, multiple times I've been on teams where we basically did not care about our large language model bill, right? It was like, whatever, you know, $20 a month or $100 a month was fine. But when more and more users start using it, then to your team's kind of positive surprise, your AI bill really starts to skyrocket."},{"start":1325.51,"text":"And then at some point, you look at how much you're paying for your AI bill, for the large language models, and to bend the cost curve back down, often a lot of the techniques in deep learning become very relevant as well. So there are, I don't know, I'm thinking just some of our bills were really breathtaking. I don't want to say the numbers, but just kind of definitely more than we want to pay. As much as we love the companies providing OEMs, our bills that we're paying them were significantly larger than I wanted to pay."}],"speech_gaps":[],"frame":"../frames/v060/008.webp","frame_time":1190.22},{"title":"深度学习课程概述与技能重点","segments":[{"id":74,"text":"And then knowing how to use deep learning to fine-tune smaller models, that was really the critical skill set that just bent the cost curve back and just made the whole thing affordable to keep on providing a service, right? So, yeah, right. So that's the skill set I hope you get from this course. Let's see. All right. And to give a... Sorry, let me use this one.","start":1354.41,"end":1391.96},{"id":75,"text":"So to give a quick overview, this course, the online materials, is broken down into five modules. So just to give you an overview of it.","start":1401.1,"end":1411.18},{"id":76,"text":"the five of them. First one is on the basics of neural networks, NN neural networks, and DL deep learning. So you learn how to build a neural network or deep learning algorithm from Scratch and Python. I find that sometimes if you use the frameworks like TensorFlow or PyTorch, it hides a lot of the details. So actually work through how to build a basic neural network and how to build a basic deep learning algorithm just in raw Python so you really understand it.","start":1411.65,"end":1439.49},{"id":77,"text":"And then the second module, the second mini course, will be on how to improve, how to tune.","start":1440.24,"end":1447.96},{"id":78,"text":"your neural networks. So we have heard that when you're training a neural network, there are a lot of parameters, or we call them hyperparameters. Hyperparameters are parameters that control the parameters, right? So the weights of parameters, hyperparameters are things like the learning rate or what's the size of your neural network. And so there are actually a lot of hyperparameters that we end up tuning and try to give you a sense of what are the most important ones and practical skills for tuning them. It turns out that","start":1448.51,"end":1476.55},{"id":79,"text":"If I look at my PhD students, I think every one of them that, right? Well, I think that probably every one of them, definitely every PhD student I know that became great, I think, at some point wound up at 2 a.m. tuning hyperparameters, right? And I still have very clear recollections of being in the office.","start":1477.97,"end":1501.67},{"id":80,"text":"2 a.m., 3 a.m., filling with parameters, trying to get it to work. And it turns out that literally your skill at tuning hyperparameters, it really makes a difference. So there were some evenings that I knew my skill at tuning hyperparameters, frankly, it made the difference between whether I went home to sleep at 3 a.m. versus where I went home to sleep at 7 a.m. Maybe don't do what I do. I'm not encouraging this type of behavior.","start":1503.06,"end":1525.84}],"notes":["本段介绍了课程的结构，分为五个模块，其中第一个模块是关于神经网络和深度学习的基础知识，强调从零开始使用Python构建神经网络和深度学习算法，以加深理解。","第二模块关注如何改进和调整神经网络，特别是超参数的调优。超参数是控制模型参数的参数，如学习率和网络大小，调优这些参数对模型性能有重要影响。","讲者提到，超参数调优是深度学习中的关键技能，甚至提到自己和博士生在深夜进行调参，说明这一技能对实际应用的重要性。","讲者还提到，超参数调优的技能直接影响模型训练的效率和结果，例如决定是否能在凌晨3点回家睡觉还是凌晨7点。","最后，讲者以幽默的方式提醒听众不要效仿自己的行为，暗示超参数调优虽然重要，但应保持适度。","整体上，本段强调了深度学习课程中对超参数调优技能的重视，以及其在实际应用中的关键作用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1354.41,"end":1525.84,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1354.41,"text":"And then knowing how to use deep learning to fine-tune smaller models, that was really the critical skill set that just bent the cost curve back and just made the whole thing affordable to keep on providing a service, right? So, yeah, right. So that's the skill set I hope you get from this course. Let's see. All right. And to give a... Sorry, let me use this one."},{"start":1401.1,"text":"So to give a quick overview, this course, the online materials, is broken down into five modules. So just to give you an overview of it."},{"start":1411.65,"text":"the five of them. First one is on the basics of neural networks, NN neural networks, and DL deep learning. So you learn how to build a neural network or deep learning algorithm from Scratch and Python. I find that sometimes if you use the frameworks like TensorFlow or PyTorch, it hides a lot of the details. So actually work through how to build a basic neural network and how to build a basic deep learning algorithm just in raw Python so you really understand it."},{"start":1440.24,"text":"And then the second module, the second mini course, will be on how to improve, how to tune."},{"start":1448.51,"text":"your neural networks. So we have heard that when you're training a neural network, there are a lot of parameters, or we call them hyperparameters. Hyperparameters are parameters that control the parameters, right? So the weights of parameters, hyperparameters are things like the learning rate or what's the size of your neural network. And so there are actually a lot of hyperparameters that we end up tuning and try to give you a sense of what are the most important ones and practical skills for tuning them. It turns out that"},{"start":1477.97,"text":"If I look at my PhD students, I think every one of them that, right? Well, I think that probably every one of them, definitely every PhD student I know that became great, I think, at some point wound up at 2 a.m. tuning hyperparameters, right? And I still have very clear recollections of being in the office."},{"start":1503.06,"text":"2 a.m., 3 a.m., filling with parameters, trying to get it to work. And it turns out that literally your skill at tuning hyperparameters, it really makes a difference. So there were some evenings that I knew my skill at tuning hyperparameters, frankly, it made the difference between whether I went home to sleep at 3 a.m. versus where I went home to sleep at 7 a.m. Maybe don't do what I do. I'm not encouraging this type of behavior."}],"speech_gaps":[],"frame":"../frames/v060/009.webp","frame_time":1366.41},{"title":"构建机器学习项目的策略","segments":[{"id":81,"text":"But this is just my personal experiences, but it really makes a big difference, your practical skill at how quickly you can figure out the recipe to get these neural networks to train. And related to that is one thing we've chatted a lot about in this course is strategies for building machine learning projects.","start":1526.46,"end":1559.22},{"id":82,"text":"So it turns out that if you build a complex system, let's say you build, this is one example we'll go through later this quarter. Say you want to build a system that recognizes your face, a camera that recognizes your face, your friend's face, unlock a door, right? Security, safety, whatever. So systems like that, I've worked on systems like that, Chance has worked on systems like that. These are complex systems with multiple components. There's a camera, do you subtract, clean up the image?","start":1560.62,"end":1586.74},{"id":83,"text":"color the phase, how do you register the phase, how do you compare a phase, how do you decide to take another picture before you unlock the door, or someone trying to hold up a picture, print on a piece of paper. There are actually a lot of decisions. And so what I find is that the biggest...","start":1587.9,"end":1606.3},{"id":84,"text":"difference between a team that knows how to drive forward a project like this well and get it done in days rather than weeks or weeks rather than many months is the ability to drive a disciplined development process. It turns out when you have a complex system, less experienced teams will often almost pick things at random to work on. They'll read one research paper and say, oh, I read in the research paper we should get more data.","start":1606.87,"end":1632.05},{"id":85,"text":"Well, because some newspapers said, AI needs lots of data, so let's go spend six months to collect more data. Turns out a lot of the time, collecting more data does not help your application. But sometimes it's a huge help. So given your application, how do you decide? Should you spend more time collecting data? Maybe you should buy more GPUs. I actually definitely know people that read in the news, a lot of GPUs are helpful, right? And then I've literally met, you know,","start":1632.57,"end":1660.55},{"id":86,"text":"fairly senior business leaders that have spent a very large amount of money buying GPUs and then, you know, some funny stories. And then I go talk to them and say, what are you doing with these GPUs? And then sometimes, you know, there was one meeting I was in where literally a very large family-run business had bought a lot of GPUs and the CTO then pointed to his nephew","start":1660.91,"end":1689.85}],"notes":["本段讨论了在构建复杂机器学习系统时，团队如何通过有纪律的开发流程来提高效率。经验丰富的团队能够快速识别关键问题并采取有效措施，而缺乏经验的团队则可能随机选择任务，导致资源浪费。","讲者提到，一些团队会根据研究论文的建议增加数据量，但这种做法并不总是有效。因此，需要根据具体应用场景来决定是否增加数据或升级硬件。","讲者还举了一个实际例子，说明一些企业可能因为误解了GPU的作用而大量购买，但实际使用中并未充分利用这些资源。","这些例子强调了在实际项目中，理解问题本质和合理分配资源的重要性，而不是盲目追求技术趋势。","讲者通过这些实际案例，说明了在构建复杂系统时，团队的决策能力和执行力是决定项目成败的关键因素。","最后，讲者提到一个具体的例子，说明某些企业可能因为对技术理解不足而做出不合理的投资决策，这进一步强调了在项目初期进行充分规划和评估的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1526.46,"end":1689.85,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1526.46,"text":"But this is just my personal experiences, but it really makes a big difference, your practical skill at how quickly you can figure out the recipe to get these neural networks to train. And related to that is one thing we've chatted a lot about in this course is strategies for building machine learning projects."},{"start":1560.62,"text":"So it turns out that if you build a complex system, let's say you build, this is one example we'll go through later this quarter. Say you want to build a system that recognizes your face, a camera that recognizes your face, your friend's face, unlock a door, right? Security, safety, whatever. So systems like that, I've worked on systems like that, Chance has worked on systems like that. These are complex systems with multiple components. There's a camera, do you subtract, clean up the image?"},{"start":1587.9,"text":"color the phase, how do you register the phase, how do you compare a phase, how do you decide to take another picture before you unlock the door, or someone trying to hold up a picture, print on a piece of paper. There are actually a lot of decisions. And so what I find is that the biggest..."},{"start":1606.87,"text":"difference between a team that knows how to drive forward a project like this well and get it done in days rather than weeks or weeks rather than many months is the ability to drive a disciplined development process. It turns out when you have a complex system, less experienced teams will often almost pick things at random to work on. They'll read one research paper and say, oh, I read in the research paper we should get more data."},{"start":1632.57,"text":"Well, because some newspapers said, AI needs lots of data, so let's go spend six months to collect more data. Turns out a lot of the time, collecting more data does not help your application. But sometimes it's a huge help. So given your application, how do you decide? Should you spend more time collecting data? Maybe you should buy more GPUs. I actually definitely know people that read in the news, a lot of GPUs are helpful, right? And then I've literally met, you know,"},{"start":1660.91,"text":"fairly senior business leaders that have spent a very large amount of money buying GPUs and then, you know, some funny stories. And then I go talk to them and say, what are you doing with these GPUs? And then sometimes, you know, there was one meeting I was in where literally a very large family-run business had bought a lot of GPUs and the CTO then pointed to his nephew"}],"speech_gaps":[],"frame":"../frames/v060/010.webp","frame_time":1538.46},{"title":"课程目标与AI应用的现实考量","segments":[{"id":87,"text":"who's a current college student undergrad, and said, oh, my nephew knows AI. I'm giving him this very large budget in GPUs, and I think he'll do AI for me, right? And so I think that knowing how to make these decisions and not just buying into the hype that you read about in the newspapers is really important.","start":1691.91,"end":1710.43},{"id":88,"text":"And one thing I hope to do in this course is share with you what driving a disciplined development process looks like, because this is one of the things that really makes a 10x difference in the speed with which you can get something to work. I've literally seen teams take six months or 10 months pursuing an approach that experienced engineers would go in and go...","start":1711.54,"end":1733.68},{"id":89,"text":"you know what, I could have told you six months ago that spending all this time collecting data, this was not going to get your application to where you want it to go, right? But so how do you examine an application and figure out the diagnostics to figure out what are the productive things to do for your application? We actually spend a lot of time on that. And in fact,","start":1734.24,"end":1751.92},{"id":90,"text":"I'm excited about doing some simulation exercises in this classroom with you later this quarter, where I'll invite you later this quarter to say, in this scenario, what would you do? And see if you could make decisions in a more systematic way. All right. Then course four, we'll talk about convolutional networks.","start":1752.85,"end":1779.13},{"id":91,"text":"Very useful for computer vision applications. And then, so ConvNets are specialized models used mostly for vision applications, dealing with images. And then we'll talk finally about sequence models. So sequences could be time series or sequences of text, like words. So I'll start touching the transformer network that powered a lot of the Gen-AI revolution. And so,","start":1781.71,"end":1813.18},{"id":92,"text":"Throughout learning all of these things, I hope that you all gain a large tool chest that will enable you to tackle an almost bewildering range of applications. I think one of the things I've most enjoyed as an AI person is it turns out when you work in AI, there are so many other teams that have data.","start":1813.71,"end":1837.77},{"id":93,"text":"And they could use our hope, right? So I feel like as an AI person, you know, I somehow bizarrely had the right to play in, you know, building autonomous helicopters or hoping companies, I don't know.","start":1838.56,"end":1850.92}],"notes":["本段主要讨论了AI领域中实际应用与理论知识之间的差距，强调了在AI开发过程中需要具备批判性思维，避免盲目追随媒体宣传。讲者提到，许多学生或非专业人士可能因为看到AI的热门趋势而投入大量资源，但缺乏系统性的开发流程，导致效率低下。","讲者希望在课程中分享如何建立一个有纪律的开发流程，这在AI开发中可以带来显著的效率提升。他提到，有经验的工程师可以在短时间内识别出无效的开发路径，而缺乏经验的团队可能需要数月时间才能意识到错误。","讲者进一步指出，如何诊断应用问题并找到有效的解决方案是课程的重要内容。他提到，课程中会通过模拟练习来训练学生系统性地思考和决策，以提高他们在实际项目中的表现。","课程接下来将介绍卷积神经网络（ConvNets），这是一种专门用于计算机视觉任务的模型。讲者提到，ConvNets在处理图像数据时非常有效，并将介绍其在实际应用中的重要性。","此外，课程还将涉及序列模型，如Transformer网络，这些模型在自然语言处理和生成式AI中发挥了关键作用。讲者提到，Transformer网络是推动生成式AI革命的重要技术之一。","最后，讲者希望学生通过本课程能够掌握多种工具和方法，以应对各种复杂的AI应用问题。他提到，AI领域的一个重要特点是不同团队之间可以共享数据和资源，从而推动技术的快速发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1691.91,"end":1850.92,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1691.91,"text":"who's a current college student undergrad, and said, oh, my nephew knows AI. I'm giving him this very large budget in GPUs, and I think he'll do AI for me, right? And so I think that knowing how to make these decisions and not just buying into the hype that you read about in the newspapers is really important."},{"start":1711.54,"text":"And one thing I hope to do in this course is share with you what driving a disciplined development process looks like, because this is one of the things that really makes a 10x difference in the speed with which you can get something to work. I've literally seen teams take six months or 10 months pursuing an approach that experienced engineers would go in and go..."},{"start":1734.24,"text":"you know what, I could have told you six months ago that spending all this time collecting data, this was not going to get your application to where you want it to go, right? But so how do you examine an application and figure out the diagnostics to figure out what are the productive things to do for your application? We actually spend a lot of time on that. And in fact,"},{"start":1752.85,"text":"I'm excited about doing some simulation exercises in this classroom with you later this quarter, where I'll invite you later this quarter to say, in this scenario, what would you do? And see if you could make decisions in a more systematic way. All right. Then course four, we'll talk about convolutional networks."},{"start":1781.71,"text":"Very useful for computer vision applications. And then, so ConvNets are specialized models used mostly for vision applications, dealing with images. And then we'll talk finally about sequence models. So sequences could be time series or sequences of text, like words. So I'll start touching the transformer network that powered a lot of the Gen-AI revolution. And so,"},{"start":1813.71,"text":"Throughout learning all of these things, I hope that you all gain a large tool chest that will enable you to tackle an almost bewildering range of applications. I think one of the things I've most enjoyed as an AI person is it turns out when you work in AI, there are so many other teams that have data."},{"start":1838.56,"text":"And they could use our hope, right? So I feel like as an AI person, you know, I somehow bizarrely had the right to play in, you know, building autonomous helicopters or hoping companies, I don't know."}],"speech_gaps":[],"frame":"../frames/v060/011.webp","frame_time":1703.91},{"title":"深度学习的应用领域与数据需求","segments":[{"id":94,"text":"Place more relevant ads. Maybe not the most inspiring thing I've worked on, but certainly very lucrative for some companies. Or improve web search rankings. Or improve safety. Get rid of the kind of negative toxic results you may not want search results to come back on. Or improve e-commerce retelling. Or improve speech recognition. Or help ships be more fuel efficient. All these are real examples. Or fight fraud, which is actually really exciting when you're fighting financial fraud.","start":1851.69,"end":1879.39},{"id":95,"text":"which is obviously a bad thing. But when you're fighting fraud, sometimes you wake up in the morning and your team's alerted you that there's a new scam, and then you just have to go and fight them and build algorithms in real time. And you know that every hour you take, more money actually leaks into the financial system. So it's kind of awful that there's financial fraud, but it's actually one of the most exhilarating things I've worked on because literally every hour you are slower.","start":1880.22,"end":1904.5},{"id":96,"text":"to, you know, formulate a response, you know more dollars are leaking out every hour. So anyway, so somehow when you have this tool set of deep learning, you just have a bewildering right to play or ability to play in a huge range of applications that could use your help, right? And I think on campus too.","start":1904.92,"end":1927.06},{"id":97,"text":"There's so many departments across campus in the sciences, engineering, humanities, business, that have interesting data where your skill set will let you, if you choose, collaborate with them to do interesting projects. And I find, for example, bizarrely, some of my PhD students are working on climate science. It's like, what do I know about climate science? I wish I knew more. But using machine learning tools,","start":1927.59,"end":1956.29},{"id":98,"text":"We could actually work on climate modeling and geoengineering and just play in all of these important, hopefully important and interesting places. So I hope that you have that skill set as well by the end of this quarter. Yeah? How do you know if you have enough data for a neural network? It turns out to be really difficult to know.","start":1956.94,"end":1988.16},{"id":99,"text":"So if it's an application that others have worked on or that you've worked on before, then you may have a sense. So for example, because I worked on face recognition, you kind of have a sense. You want to train a face recognition system from scratch, having like 50,000 images, 50,000 unique faces is pretty good. So if you worked on it or if you read the research literature for something people have worked on, that would give you a gut sense for how much data.","start":1989.27,"end":2015.89},{"id":100,"text":"could be enough to get you started. But then for...","start":2016.9,"end":2020.4}],"notes":["本段讨论了深度学习在多个实际应用领域的潜力，包括广告投放、网络搜索优化、电子商务、语音识别、船舶燃油效率提升以及金融欺诈检测。这些应用展示了深度学习在解决现实问题中的广泛适用性。","在金融欺诈检测中，讲者提到实时构建算法的重要性，因为每拖延一小时，资金就会从金融系统中流失。这说明了深度学习在应对时间敏感问题时的价值。","讲者强调了深度学习工具集的广泛适用性，不仅限于计算机视觉领域，还涉及气候科学等跨学科领域。这表明深度学习可以与不同领域的数据和问题相结合，产生新的研究方向。","关于数据需求，讲者指出判断数据是否足够是一个困难的问题。他以人脸识别为例，说明了在已有研究基础上，可以形成对所需数据量的直觉。","讲者提到，对于已有研究或实际应用的领域，可以通过经验或文献了解所需数据量，但对新领域则缺乏明确的指导。","最后，讲者提到数据量的判断是一个复杂的问题，需要结合具体应用场景和已有经验进行评估。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1851.69,"end":2020.4,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1851.69,"text":"Place more relevant ads. Maybe not the most inspiring thing I've worked on, but certainly very lucrative for some companies. Or improve web search rankings. Or improve safety. Get rid of the kind of negative toxic results you may not want search results to come back on. Or improve e-commerce retelling. Or improve speech recognition. Or help ships be more fuel efficient. All these are real examples. Or fight fraud, which is actually really exciting when you're fighting financial fraud."},{"start":1880.22,"text":"which is obviously a bad thing. But when you're fighting fraud, sometimes you wake up in the morning and your team's alerted you that there's a new scam, and then you just have to go and fight them and build algorithms in real time. And you know that every hour you take, more money actually leaks into the financial system. So it's kind of awful that there's financial fraud, but it's actually one of the most exhilarating things I've worked on because literally every hour you are slower."},{"start":1904.92,"text":"to, you know, formulate a response, you know more dollars are leaking out every hour. So anyway, so somehow when you have this tool set of deep learning, you just have a bewildering right to play or ability to play in a huge range of applications that could use your help, right? And I think on campus too."},{"start":1927.59,"text":"There's so many departments across campus in the sciences, engineering, humanities, business, that have interesting data where your skill set will let you, if you choose, collaborate with them to do interesting projects. And I find, for example, bizarrely, some of my PhD students are working on climate science. It's like, what do I know about climate science? I wish I knew more. But using machine learning tools,"},{"start":1956.94,"text":"We could actually work on climate modeling and geoengineering and just play in all of these important, hopefully important and interesting places. So I hope that you have that skill set as well by the end of this quarter. Yeah? How do you know if you have enough data for a neural network? It turns out to be really difficult to know."},{"start":1989.27,"text":"So if it's an application that others have worked on or that you've worked on before, then you may have a sense. So for example, because I worked on face recognition, you kind of have a sense. You want to train a face recognition system from scratch, having like 50,000 images, 50,000 unique faces is pretty good. So if you worked on it or if you read the research literature for something people have worked on, that would give you a gut sense for how much data."},{"start":2016.9,"text":"could be enough to get you started. But then for..."}],"speech_gaps":[],"frame":"../frames/v060/012.webp","frame_time":1863.69},{"title":"深度学习中的数据需求与生成式AI简介","segments":[{"id":101,"text":"greenfield brand new projects that no one in the world has worked on before. If you can't find parallel projects that are kind of comparable, it could be really hard to tell. And so common advice for completely greenfield, sorry, greenfield, I mean a brand new project, just similar than things. So for example, if someone has invented a new medical device and no one has collected this type of blood specimen data before, it's really hard to tell. And in that case, the most common advice is,","start":2021.63,"end":2049.69},{"id":102,"text":"Get a little bit of data and just try training a model. And the degree to which your initial model works or does not work, that will help you hone your perspective on how much data may be needed. And you may be surprised. Maybe 100 data points is all you need, right? Sometimes I've been surprised by that. And then sometimes we've also worked on applications where, you know, 100 billion data points later, we're still trying to get a lot more data. And I find it really difficult to tell. Good question.","start":2050.28,"end":2080.13},{"id":103,"text":"Anything else? Oh, so this is a good time for me to pause and take questions because, so what I'm going to do is, right, what I'm going to do after this is switch tracks and talk a little bit about exciting trends in AI, kind of recent trends in AI that I'm excited about and how I view the AI landscape. So this is actually a good break point to see if people have other questions before I talk about some trends in AI.","start":2080.87,"end":2110.39},{"id":104,"text":"Anything else? Yeah, please. So I guess, let's see, many of these terms are blurry and kind of fuzz a little bit into each other. But when I refer to generative AI, generative AI is this body of work that generates text and sometimes also images.","start":2111.37,"end":2149.01},{"id":105,"text":"sometimes also audio, using deep learning algorithms in certain ways. So I think GenAI refers to this body of work with most of the center of gravity on generating text, maybe also images, and the text generation algorithms have been mostly implemented using transformer neural networks, trained on large amounts of data straight off the internet and elsewhere.","start":2149.67,"end":2171.23}],"notes":["本段讨论了在数据需求方面，对于全新的项目，没有可比的平行项目时，很难判断需要多少数据。建议从少量数据开始训练模型，通过模型的表现来判断数据需求。有时可能只需要100个数据点，而有时即使拥有1000亿数据点，仍然需要更多数据。这说明数据需求因项目而异，无法一概而论。","讲者提到，生成式AI（Generative AI, GenAI）主要涉及文本生成，有时也包括图像和音频。文本生成算法大多使用Transformer神经网络，并在大量数据上进行训练，这些数据可能直接来自互联网或其他来源。这表明生成式AI的核心在于利用深度学习算法生成新的内容。","讲者强调，生成式AI的工作重点在于文本生成，但其应用范围也在扩展，包括图像和音频。这说明生成式AI是一个涵盖多种模态的领域，但文本生成仍是其核心。","讲者提到，生成式AI的实现依赖于Transformer神经网络，并且训练数据来自互联网等广泛来源。这表明生成式AI的训练过程需要大量的数据，并且这些数据可能具有多样性。","讲者指出，生成式AI的中心在于文本生成，但其应用范围也在扩展，包括图像和音频。这说明生成式AI是一个涵盖多种模态的领域，但文本生成仍是其核心。","讲者提到，生成式AI的实现依赖于Transformer神经网络，并且训练数据来自互联网等广泛来源。这表明生成式AI的训练过程需要大量的数据，并且这些数据可能具有多样性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2021.63,"end":2171.23,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2021.63,"text":"greenfi
