</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>深度学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">斯坦福CS230：深度学习导论 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v060.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v060","title":"斯坦福CS230：深度学习导论","course":"深度学习","pages":[{"title":"课程介绍与教学模式","segments":[{"id":0,"text":"What I want to do today is give an overview of this class. I'm actually curious, before we get started, this is now September 2025. How many of you just started at Stanford? Raise your hand. Wow, cool, awesome. So others, pay attention to who just raised their hands and do say hi to them and welcome all of the people that just joined Stanford in whatever program.","zh":"我今天想做的就是给大家介绍一下这门课。实际上，在我们开始之前，现在是2025年9月。有多少人刚刚开始在斯坦福学习？请举手。哇，真棒，太好了。所以其他人，请注意谁举了手，并向他们打招呼，欢迎所有刚刚加入斯坦福的同学们，无论你们参加的是哪个项目。","start":5.23,"end":32.89},{"id":1,"text":"CS 230 is a class that we offer in the flipped classroom format. And what that means is that instead of listening to me or Qian, my co-instructor that you meet next week, instead of listening to us lecture at you for an hour, 20 minutes or whatever, we actually ask you to watch a lot of the video lectures online so that we can then make use of the precious in-classroom time for much richer, deeper learning.","zh":"CS 230 是一门采用翻转课堂模式授课的课程。这意味着我们不会像我或者你下周会见到的我的助教 Qian 那样，给你们讲一小时、二十分钟或者其他时间的讲座。相反，我们会要求你们在线观看大量的视频讲座，这样我们就可以在宝贵的课堂时间内进行更丰富、更深入的学习。","start":34.76,"end":63.2},{"id":2,"text":"discussions. So both today and for the entire quarter, I would really warmly welcome anyone raising questions, raise your hand. And in fact, I find that","zh":"讨论。因此，今天以及整个学期内，我非常热情地欢迎任何想要提问的同学举手。事实上，我发现","start":63.42,"end":74.6},{"id":3,"text":"Instead of you sitting there, even though we have a longer session scheduled by the registrar, we'll use usually only up to an hour and 20 minutes for this course. And the goal is to, it turns out that a lot of Stanford students were watching the lectures on Segal.","zh":"而不是你们坐在那里，尽管我们按照注册处安排的课程时间有一个较长的课程，我们通常只使用最多一小时二十分钟来上这门课。目标是，事实上，很多斯坦福学生已经在 Segal 上观看讲座视频了。","start":75.39,"end":93.93},{"id":4,"text":"online videos anyway so rather than us delivering that lecture same lecture year after year we put a lot more effort to put very high quality lecture videos online and we'll ask you to just watch that online which people are doing anyway but just highly edited for offline watching um spend and spend the classroom time you know doing the things that make sense for us to get together in person too","zh":"在线视频了，因此我们不需要每年重复同样的讲座。我们投入了更多努力制作高质量的讲座视频，并要求你们在线观看这些视频，因为人们本来就在这么做。不过这些视频经过高度剪辑，适合离线观看。你们可以花时间在课堂上做那些我们面对面交流更有意义的事情。","start":94.91,"end":117.89},{"id":5,"text":"So because you haven't watched any of the lectures yet, or I assume most of you have not, today we'll even maybe have a slightly shorter session to introduce the class, talk over logistics, and so on. As many of you know, deep learning is one of the latest, hottest trends technologies of computer science and AI.","zh":"由于你们还没有观看任何讲座，或者我假设大多数人都没有，今天我们会稍微缩短一点课程时间，来介绍这门课，讨论一些课程安排等。正如你们所知，深度学习是计算机科学和人工智能领域最新、最热门的技术趋势之一。","start":118.94,"end":141.73},{"id":6,"text":"say our PhD admissions or even master's admissions, a very large fraction of all students that come to Stanford or are applying to come to Stanford want to work on AI. I'm not sure I'm allowed to say the numbers, but they are extremely high, as you can imagine. And so my goal and my co-instructor Kian's goal, our collective goal, is through this quarter to help you get to...","zh":"比如说我们的博士生招生或者甚至是硕士生招生，来到斯坦福或申请来到斯坦福的绝大多数学生都希望从事人工智能领域的工作。我不确定我是否被允许说出具体数字，但这些数字非常高，正如你所能想象的那样。因此，我的目标以及我的合班导师Kian的目标，我们共同的目标，是通过这一个季度来帮助你们达到...","start":141.95,"end":167.17}],"notes":["本段介绍了课程的教学模式，即翻转课堂（flipped classroom）模式。这种模式要求学生在课前观看在线视频讲座，以便在课堂上进行更深入的学习和讨论。教师强调了这种模式的优势，即节省课堂时间，用于更有价值的互动和学习活动。","教师提到，由于学生尚未观看讲座，因此今天的课程可能会稍短一些，用于介绍课程内容和相关事务。同时，教师指出深度学习是计算机科学和人工智能领域当前最热门的技术之一，吸引了大量学生申请斯坦福大学。","教师还提到，斯坦福大学的博士和硕士申请中，有很大比例的学生希望从事人工智能相关的工作，这表明深度学习在学术界和工业界的重要性。教师和助教的目标是通过本课程帮助学生掌握深度学习的核心概念和技能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":167.17,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.23,"text":"What I want to do today is give an overview of this class. I'm actually curious, before we get started, this is now September 2025. How many of you just started at Stanford? Raise your hand. Wow, cool, awesome. So others, pay attention to who just raised their hands and do say hi to them and welcome all of the people that just joined Stanford in whatever program."},{"start":34.76,"text":"CS 230 is a class that we offer in the flipped classroom format. And what that means is that instead of listening to me or Qian, my co-instructor that you meet next week, instead of listening to us lecture at you for an hour, 20 minutes or whatever, we actually ask you to watch a lot of the video lectures online so that we can then make use of the precious in-classroom time for much richer, deeper learning."},{"start":63.42,"text":"discussions. So both today and for the entire quarter, I would really warmly welcome anyone raising questions, raise your hand. And in fact, I find that"},{"start":75.39,"text":"Instead of you sitting there, even though we have a longer session scheduled by the registrar, we'll use usually only up to an hour and 20 minutes for this course. And the goal is to, it turns out that a lot of Stanford students were watching the lectures on Segal."},{"start":94.91,"text":"online videos anyway so rather than us delivering that lecture same lecture year after year we put a lot more effort to put very high quality lecture videos online and we'll ask you to just watch that online which people are doing anyway but just highly edited for offline watching um spend and spend the classroom time you know doing the things that make sense for us to get together in person too"},{"start":118.94,"text":"So because you haven't watched any of the lectures yet, or I assume most of you have not, today we'll even maybe have a slightly shorter session to introduce the class, talk over logistics, and so on. As many of you know, deep learning is one of the latest, hottest trends technologies of computer science and AI. If we look at..."},{"start":141.95,"text":"say our PhD admissions or even master's admissions, a very large fraction of all students that come to Stanford or are applying to come to Stanford want to work on AI. I'm not sure I'm allowed to say the numbers, but they are extremely high, as you can imagine. And so my goal and my co-instructor Kian's goal, our collective goal, is through this quarter to help you get to..."}],"speech_gaps":[],"frame":"../frames/v060/001.webp","frame_time":17.23},{"title":"深度学习的进展与数据的重要性","segments":[{"id":7,"text":"near or at pretty much state of the art with regard to deep learning. And make sure that all of you walk away from this class highly skilled at applying deep learning. And so it turns out that a lot of progress in AI over the last, I don't know, decade?","zh":"在深度学习方面，接近或达到当前的最先进水平。确保你们所有人都能从这门课中掌握如何熟练地应用深度学习。结果发现，过去大约十年，甚至可能是10到15年的时间里，人工智能领域取得的很多进展都是通过扩大规模实现的。","start":167.58,"end":187.63},{"id":8,"text":"maybe 10-15 years, was made by scaling.","zh":"也许需要10到15年，这是通过扩展实现的。","start":188.4,"end":191.78},{"id":9,"text":"And one of the reasons why deep learning was so","zh":"所以，如果我画一个图，其中x轴表示一个问题中我们拥有的数据量，","start":192.14,"end":194.14},{"id":10,"text":"successful was because it's good at absorbing a lot of data.","zh":"那么使用传统的机器学习算法，比如逻辑回归，","start":194.14,"end":197.56},{"id":11,"text":"So, you know, if I draw a figure where on the x-axis,","zh":"就会发现，随着数据量的增加，模型的性能会有显著提升。","start":198.28,"end":205.08},{"id":12,"text":"I plot the amount of data we have for a problem,","zh":"我绘制了一个问题中我们拥有的数据量，","start":205.26,"end":211.02},{"id":13,"text":"then using more traditional machine learning algorithms,","zh":"然后使用更多的传统机器学习算法，","start":211.96,"end":215.22},{"id":14,"text":"so, you know, logistic regression,","zh":"比如逻辑回归，","start":215.36,"end":216.64},{"id":15,"text":"regression, maybe decision trees, using all the generations of AI machine learning algorithms.","zh":"回归，也许决策树，使用所有世代的AI机器学习算法。","start":216.64,"end":221.2},{"id":16,"text":"As you gave it more and more data, the performance or the accuracy of the more traditional algorithms","zh":"当你给它越来越多的数据时，更传统的算法的性能或准确性","start":225.88,"end":231.38},{"id":17,"text":"would plateau.","zh":"会趋于平稳。","start":231.38,"end":232.12},{"id":18,"text":"It was as if, so take speech recognition, with all the generations of algorithms, even","zh":"就像语音识别一样，使用所有世代的算法，甚至","start":232.54,"end":237.54},{"id":19,"text":"hundreds and thousands and tens of thousands of hours was a speech data","zh":"数百、数千、数万小时的语音数据","start":237.54,"end":242.3},{"id":20,"text":"was a speech data, the accuracy would often plateau, and it was as if the older generations","zh":"语音数据，准确性通常会趋于平稳，就像旧一代的算法","start":242.3,"end":248.52},{"id":21,"text":"of algorithms didn't know what to do with all the data that we now have.","zh":"似乎不知道如何处理我们现在拥有的所有数据。","start":248.52,"end":252.76},{"id":22,"text":"But what we started to find about 10, 15 years ago was that if you train a small neural network,","zh":"但大约10到15年前，我们开始发现，如果你训练一个小的神经网络，","start":253.46,"end":263.34},{"id":23,"text":"also known as a small deep learning model, its performance would kind of maybe get better","zh":"也被称为一个小的深度学习模型，它的性能可能会有点变好","start":263.52,"end":268.68},{"id":24,"text":"and if you train a medium-sized one, and if you train a very large neural","zh":"如果你训练一个中等大小的模型，如果你训练一个非常大的神经","start":268.68,"end":275.46},{"id":25,"text":"network, the performance just keeps getting better and better.","zh":"网络，性能就会持续变得越来越好。","start":275.46,"end":279.08},{"id":26,"text":"And I think the reason that deep learning has dominated the AIC for the last 10, 15","zh":"我认为深度学习在过去10到15年能够主导AIC的原因是，我们有一个训练非常大的神经网络的配方，","start":279.58,"end":285.22},{"id":27,"text":"years is because there is a recipe for training very large neural networks that we can then","zh":"我们可以将大量数据输入其中，从而获得卓越的性能。","start":285.22,"end":291.92},{"id":28,"text":"shove a lot of data into that results in exceptional performance.","zh":"性能。因此，我认为我们开始看到这种现象是因为一些，坦白说，一些斯坦福大学的研究","start":291.92,"end":295.84},{"id":29,"text":"performance. So I think we started to see this because of some, frankly, some Stanford research","zh":"论文大约在15年前，当时人们开始进行早期的工作，使用更先进的编程技术","start":295.84,"end":302.2},{"id":30,"text":"papers about 15 years ago when, you know, did the first early work on using cooler programming","zh":"关于15年前的论文，当时人们刚开始尝试使用更冷的编程方法进行早期工作","start":302.2,"end":309.1},{"id":31,"text":"GPUs to scale deep learning. Oh, by the way, actually, it's one fun fact. The first, my first","zh":"GPU用于扩展深度学习。哦，顺便提一下，其实这是一个有趣的事实。第一个，我第一个","start":309.1,"end":315.66},{"id":32,"text":"GPU machine used to train neural networks using Coo there, which is a controversial thing at the time. It was built by a Stanford undergrad in his dorm room. His name was Ian Goodfellow. But I think that compute server built in the Stanford undergrad dorm room allowed us at Stanford...","zh":"GPU机器曾被用来用Coo进行神经网络的训练，这在当时是一个有争议的做法。它是由一位斯坦福大学本科生在他的宿舍里建造的。他的名字是伊恩·古德费洛。但我认为，这个在斯坦福大学本科生宿舍里建造的计算服务器让我们在斯坦福大学...","start":316.61,"end":333.83}],"notes":["本段讲授了深度学习在人工智能领域取得成功的原因，强调了数据量对传统机器学习算法和深度学习模型性能的影响。传统算法在数据量增加时性能趋于平稳，而深度学习模型随着数据量的增加性能持续提升。","讲者通过语音识别的例子说明了传统算法在面对大量数据时的局限性，指出旧算法无法有效利用新增数据，而深度学习模型则能持续受益于更多数据。","讲者提到大约10到15年前，研究人员开始发现，训练不同规模的神经网络模型时，随着数据量的增加，模型性能会持续提升，这成为深度学习在AI领域占据主导地位的关键因素。","讲者还提到斯坦福大学的研究在早期推动了深度学习的发展，特别是利用GPU进行大规模计算，这为深度学习的扩展提供了重要支持。","讲者提到第一个用于训练神经网络的GPU机器是由斯坦福大学的一名本科生在宿舍里建造的，这表明早期的深度学习研究在资源有限的情况下也能取得突破。","讲者强调了深度学习模型在处理大量数据时的优势，以及这种优势如何推动了深度学习在人工智能领域的广泛应用。"],"formulas":[],"uncertainties":["hundreds and thousands and tens of thousands of hours was a speech data","was a speech data, the accuracy would often plateau","its performance would kind of maybe get better and better","and if you train a medium-sized one, and if you train a very large neural","network, the performance just keeps getting better and better."],"diagram":"none","start":167.58,"end":333.83,"asr_flags":[],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":167.58,"text":"near or at pretty much state of the art with regard to deep learning. And make sure that all of you walk away from this class highly skilled at applying deep learning. And so it turns out that a lot of progress in AI over the last, I don't know, decade?"},{"start":188.4,"text":"maybe 10-15 years, was made by scaling."},{"start":192.14,"text":"And one of the reasons why deep learning was so"},{"start":194.14,"text":"successful was because it's good at absorbing a lot of data."},{"start":198.28,"text":"So, you know, if I draw a figure where on the x-axis,"},{"start":205.26,"text":"I plot the amount of data we have for a problem,"},{"start":211.96,"text":"then using more traditional machine learning algorithms,"},{"start":215.36,"text":"so, you know, logistic regression,"},{"start":216.64,"text":"regression, maybe decision trees, using all the generations of AI machine learning algorithms."},{"start":225.88,"text":"As you gave it more and more data, the performance or the accuracy of the more traditional algorithms"},{"start":231.38,"text":"would plateau."},{"start":232.54,"text":"It was as if, so take speech recognition, with all the generations of algorithms, even"},{"start":237.54,"text":"as you fed it more and more data, hundreds and thousands and tens of thousands of hours"},{"start":242.3,"text":"was a speech data, the accuracy would often plateau, and it was as if the older generations"},{"start":248.52,"text":"of algorithms didn't know what to do with all the data that we now have."},{"start":253.46,"text":"But what we started to find about 10, 15 years ago was that if you train a small neural network,"},{"start":263.52,"text":"also known as a small deep learning model, its performance would kind of maybe get better"},{"start":268.68,"text":"and better, and if you train a medium-sized one, and if you train a very large neural"},{"start":275.46,"text":"network, the performance just keeps getting better and better."},{"start":279.58,"text":"And I think the reason that deep learning has dominated the AIC for the last 10, 15"},{"start":285.22,"text":"years is because there is a recipe for training very large neural networks that we can then"},{"start":291.92,"text":"shove a lot of data into that results in exceptional performance."},{"start":295.84,"text":"performance. So I think we started to see this because of some, frankly, some Stanford research"},{"start":302.2,"text":"papers about 15 years ago when, you know, did the first early work on using cooler programming"},{"start":309.1,"text":"GPUs to scale deep learning. Oh, by the way, actually, it's one fun fact. The first, my first"},{"start":316.61,"text":"GPU machine used to train neural networks using Coo there, which is a controversial thing at the time. It was built by a Stanford undergrad in his dorm room. His name was Ian Goodfellow. But I think that compute server built in the Stanford undergrad dorm room allowed us at Stanford..."}],"speech_gaps":[{"start":221.6,"end":223.344}],"frame":"../frames/v060/002.webp","frame_time":179.58},{"title":"深度学习的起源与影响","segments":[{"id":33,"text":"to lay the early foundations of using CUDA, at that time, a modern language for training GPUs to train large neural networks. And then, you know, obviously that influenced a lot of people and helped scaling up deep learning take off. So I tell that story because sometimes the work that some of you can do, you know, in a dorm room or graduate student housing or whatever, or in a lab at Stanford, looking back.","zh":"为使用CUDA奠定早期基础，当时CUDA是一种用于训练GPU以训练大型神经网络的现代语言。然后，很明显，这影响了很多人，并帮助深度学习的扩展起飞。所以我讲述这个故事，是因为有时你们在宿舍或研究生宿舍或任何地方，或者在斯坦福实验室里所做的工作，回顾起来可能会产生巨大的影响。","start":334.03,"end":358.69},{"id":34,"text":"over some number of years, it can really have a huge impact. And maybe in this class, some of you will do work as impactful as that someday as well. But so what we started to find was that as you train larger and larger neural networks, they could soak up lots of data and drive exceptional performance. And then there was a research paper out of Baidu which showed that as you scale up...","zh":"在若干年的时间里，它真的可以产生巨大的影响。也许在本课程中，你们中的一些人将来也会做出同样有影响力的工作。但随后我们开始发现，随着你训练越来越大的神经网络，它们能够吸收大量数据并实现卓越的性能。然后有一篇来自百度的研究论文表明，随着规模的扩大……","start":359.15,"end":383.54},{"id":35,"text":"What would the performance be? And then later, OpenAI popularized the idea with a really influential paper on scaling laws and that predictability of how deep learning gets better in performance then drove a lot of the investments in data centers and building very large AI models with lots of data.","zh":"性能会如何？后来，OpenAI通过一篇关于扩展定律的极具影响力的论文推广了这一想法，并且这种深度学习性能提升的可预测性推动了数据中心大量投资以及构建非常大的AI模型和大量数据。","start":383.81,"end":393.75},{"id":36,"text":"Let's see. In terms of where this class sits. So in computer science, all of us build on each other's work, right? A lot of the way that computer science and AI has made progress is we build on top of other ideas that are in turn built on top of other ideas that are in turn built on top of other ideas. So maybe I want to give you a little map to show you maybe where deep learning sits. So I think there are...","zh":"让我们看看。就本课程的位置而言。在计算机科学中，我们所有人都建立在彼此的工作之上，对吧？计算机科学和人工智能取得进展的很大一部分方式是，我们建立在其他想法之上，而这些想法又建立在其他想法之上，这些想法又建立在其他想法之上。因此，也许我想给你们一个小小的地图，来展示深度学习的位置。我认为存在……","start":394.16,"end":413.86},{"id":37,"text":"You know, machine learning is built on top of computer science, so I think it's actually helpful to learn CS fundamentals. And even though I use, and I suspect the vast majority of you use AI-assisted coding, be it tools like Cloud Code or Gemini CLI or OpenAI Codex or Cursor or WinServe or whatever, I find that people that know CS fundamentals, they really understand computer science, they really understand how computers work, rather than, like, I'm going to vibe code this. You know, when you understand CS fundamentals, you get things to work.","zh":"你知道，机器学习建立在计算机科学之上，因此我认为学习计算机科学的基础知识是有帮助的。尽管我使用，而且我相信你们中的大多数人也使用AI辅助编码，无论是Cloud Code、Gemini CLI、OpenAI Codex、Cursor、WinServe或其他工具，我发现那些了解计算机科学基础知识的人真正理解计算机科学，真正理解计算机是如何工作的，而不是像我随便写代码那样。当你理解计算机科学的基础知识时，你就能让事情正常运作。","start":418.3,"end":445.16},{"id":38,"text":"much better. But on top of CS fundamentals, there's a set of machine learning skills. So how do you build algorithms that can learn from data? And then deep learning is a special type of machine learning. Well, that's really the most effective type of machine learning, as far as I can tell, in which we train neural networks. We train certain types of algorithms to learn from large amounts of data.","zh":"要好得多。但除了计算机科学的基础知识之外，还有一套机器学习技能。那么，你是如何构建能够从数据中学习的算法的呢？然后，深度学习是一种特殊的机器学习类型。嗯，就我所知，这确实是效果最好的一种机器学习方式，我们通过训练神经网络来实现。我们训练某些类型的算法，使其能够从大量数据中学习。","start":449.77,"end":477.89},{"id":39,"text":"much better. But on top of CS fundamentals, there's a set of machine learning skills. So how do you build algorithms that can learn from data? And then deep learning is a special type of machine learning. Well, that's really the most effective type of machine learning, as far as I can tell, in which we train neural networks. We train certain types of algorithms to learn from large amounts of data.","zh":"要好得多。但除了计算机科学的基础知识之外，还有一套机器学习技能。那么，你是如何构建能够从数据中学习的算法的呢？然后，深度学习是一种特殊的机器学习类型。嗯，就我所知，这确实是效果最好的一种机器学习方式，我们通过训练神经网络来实现。我们训练某些类型的算法，使其能够从大量数据中学习。","start":478.26,"end":509.48}],"notes":["本段讲授了深度学习的起源，强调了CUDA在训练GPU上的作用，以及早期研究对深度学习发展的推动作用。讲者提到，即使是个人在宿舍或实验室中进行的研究，也可能产生重大影响。","讲者指出，随着神经网络规模的扩大，它们能够吸收大量数据并实现卓越的性能。Baidu的研究论文表明，随着深度学习算法的扩展，性能提升是可预测的，这使得人们可以预测在购买一定数量的GPU和投入大量计算资源后，模型的性能表现。","OpenAI通过一篇关于扩展定律的有影响力的论文推广了这一理念，这种可预测性推动了数据中心的投资，并促使构建非常大的AI模型，这些模型使用大量数据进行训练。","讲者强调了计算机科学在深度学习中的基础地位，指出学习计算机科学基础对于理解计算机如何工作至关重要。即使使用AI辅助编程工具，掌握计算机科学基础的人更能理解代码的运行机制。","讲者进一步指出，除了计算机科学基础，还需要掌握机器学习技能，包括如何构建能够从数据中学习的算法。深度学习是机器学习的一个特殊类型，被认为是目前最有效的机器学习方法之一，通过训练神经网络来实现从大量数据中学习。","讲者通过构建知识体系的比喻，帮助学生理解深度学习在计算机科学和人工智能中的位置，强调了不同层次知识之间的相互依赖关系。"],"formulas":[],"uncertainties":[],"diagram":"none","start":334.03,"end":509.48,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":334.03,"text":"to lay the early foundations of using CUDA, at that time, a modern language for training GPUs to train large neural networks. And then, you know, obviously that influenced a lot of people and helped scaling up deep learning take off. So I tell that story because sometimes the work that some of you can do, you know, in a dorm room or graduate student housing or whatever, or in a lab at Stanford, looking back."},{"start":359.15,"text":"over some number of years, it can really have a huge impact. And maybe in this class, some of you will do work as impactful as that someday as well. But so what we started to find was that as you train larger and larger neural networks, they could soak up lots of data and drive exceptional performance. And then there was a research paper out of Baidu which showed that as you scale up..."},{"start":383.81,"text":"new networks, as you scale up deep learning algorithms, the performance gains are actually quite predictable. So you can forecast if you buy this many GPUs, throw this much compute and this much data at it."},{"start":394.16,"text":"What would the performance be? And then later, OpenAI popularized the idea with a really influential paper on scaling laws and that predictability of how deep learning gets better in performance then drove a lot of the investments in data centers and building very large AI models with lots of data."},{"start":418.3,"text":"Let's see. In terms of where this class sits. So in computer science, all of us build on each other's work, right? A lot of the way that computer science and AI has made progress is we build on top of other ideas that are in turn built on top of other ideas that are in turn built on top of other ideas. So maybe I want to give you a little map to show you maybe where deep learning sits. So I think there are..."},{"start":449.77,"text":"You know, machine learning is built on top of computer science, so I think it's actually helpful to learn CS fundamentals. And even though I use, and I suspect the vast majority of you use AI-assisted coding, be it tools like Cloud Code or Gemini CLI or OpenAI Codex or Cursor or WinServe or whatever, I find that people that know CS fundamentals, they really understand computer science, they really understand how computers work, rather than, like, I'm going to vibe code this. You know, when you understand CS fundamentals, you get things to work."},{"start":478.26,"text":"much better. But on top of CS fundamentals, there's a set of machine learning skills. So how do you build algorithms that can learn from data? And then deep learning is a special type of machine learning. Well, that's really the most effective type of machine learning, as far as I can tell, in which we train neural networks. We train certain types of algorithms to learn from large amounts of data."}],"speech_gaps":[{"start":416.176,"end":417.712}],"frame":"../frames/v060/003.webp","frame_time":346.03},{"title":"深度学习与神经网络术语的演变","segments":[{"id":40,"text":"So far in the last 10 minutes, you probably heard me use the words deep learning and neural networks. And I think today those two terms are almost interchangeable. Some purists will insist on some technical differences. Raw practices mean the same thing. But what happened was the term neural networks had been around for decades. But around 10, 15 years ago, a number of us realized that deep learning, it was just a much better brand.","zh":"在过去的10分钟里，你可能已经听我使用了deep learning和neural networks这两个词。我认为今天这两个术语几乎是可以互换使用的。一些极端主义者会坚持某些技术上的区别。但实际应用中它们的意思是一样的。但发生的事情是，neural networks这个术语已经存在了几十年。但在大约10到15年前，我们中的一些人意识到，deep learning只是一个更好的品牌。","start":510.34,"end":538.1},{"id":41,"text":"And so even though neural networks have been around for decades, starting about 10, 15 years ago, it was deep learning that took off. Because who doesn't want learning that is really deep? It's just a good brand. But you hear me use those terms kind of interchangeably. But deep learning algorithms, neural networks.","zh":"因此，尽管neural networks已经存在了几十年，但从大约10到15年前开始，是deep learning迅速发展起来的。因为谁不想拥有真正深入的学习呢？这只是一个好品牌。但你可能会听到我交替使用这两个术语。但deep learning算法和neural networks。","start":538.86,"end":560.34},{"id":42,"text":"They give us a way to take advantage of more and more and more compute capacity so they can build very large AI models with a lot of parameters to soak up the large amounts of data to get more and more intelligent or to make better and better predictions or generate more and more accurate outputs using a large amount of data that's available to us.","zh":"它们使我们能够利用越来越多的计算能力，从而构建具有大量参数的非常大的AI模型，以吸收大量数据，使模型变得更智能，或者做出更好的预测，或者使用我们可用的大量数据生成更准确的输出。","start":561.02,"end":585.98},{"id":43,"text":"But now, many years later, I still struggle with that. So I'll try my best, but please wave at me or kind of let me know if I start to drift lower again. I think my mother would be very happy to practice like this now. All right. So CS fundamentals, machine learning, deep learning, and then the recent generative AI revolution. You know, generative AI.","zh":"但如今，多年过去了，我仍然在这一点上感到困惑。我会尽力而为，但请你们如果我开始偏离主题，请向我挥手或提醒我一下。我想我母亲看到我这样练习会非常高兴。好的。所以计算机科学基础、机器学习、深度学习，以及最近的生成式AI革命。你知道的，生成式AI。","start":588.0,"end":618.66},{"id":44,"text":"sorry, bad handwriting, generative AI, which is mostly built by a specific type of neural network called the transformer neural network, which you learned about in this class. You actually learned what is the transformer architecture later in this quarter as well. It is in turn built on top of deep learning, right? So I assume all of you, you know, are regularly prompting LLMs, large language models, to help you get work done.","zh":"抱歉，字迹不好，生成式AI，它主要是由一种特定类型的神经网络——transformer神经网络构建的，你在本节课中已经学习过。你实际上在本学期的后半部分也学习了transformer架构。它又是建立在深度学习之上的，对吧？因此，我假设你们都在经常使用大型语言模型（LLMs）来帮助完成工作。","start":619.83,"end":648.85},{"id":45,"text":"And what I find is that While I use LLMs all the time, for a lot of applications, just prompting LLMs, it doesn't cut it. There are a lot of things that I cannot get to work just by prompting an LLM. And so I'll often have to go a layer deeper into the deep learning layer of abstraction and fiddle with deep learning algorithms in order to get certain things to work. And in fact...","zh":"我发现，虽然我经常使用大语言模型（LLMs），但在很多应用中，仅仅通过提示（prompting）LLMs是不够的。有很多事情我无法仅通过提示LLMs来实现。因此，我常常需要深入到深度学习的抽象层次，调整深度学习算法，才能让某些事情正常运作。事实上...","start":649.43,"end":670.57}],"notes":["本段主要讲解了深度学习与神经网络这两个术语的演变关系。讲者指出，尽管这两个术语在实际使用中经常被互换，但严格来说它们存在一些技术上的差异。然而，由于‘深度学习’这一术语在品牌效应上的优势，它在过去的10到15年间迅速发展，成为主流的称呼。","讲者提到，神经网络的概念已经存在了几十年，但直到大约10到15年前，人们才意识到‘深度学习’是一个更有效的品牌，从而推动了该领域的快速发展。这表明术语的演变不仅与技术发展有关，也与市场接受度和品牌效应密切相关。","讲者进一步说明，深度学习和神经网络的结合使得我们能够利用更多的计算资源，构建具有大量参数的大型AI模型，从而更好地处理大量数据，实现更智能的预测和更准确的输出。","讲者还提到，尽管他经常使用大型语言模型（LLMs）来帮助完成任务，但在许多应用场景中，仅仅通过提示LLMs是不够的。因此，他需要深入到深度学习的抽象层次，调整深度学习算法以实现特定的目标。","最后，讲者指出，深度学习不仅仅是神经网络的延伸，它还构建在更广泛的机器学习和计算机科学基础之上，是当前生成式AI革命的核心技术之一。"],"formulas":[],"uncertainties":[],"diagram":"none","start":510.34,"end":670.57,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":510.34,"text":"So far in the last 10 minutes, you probably heard me use the words deep learning and neural networks. And I think today those two terms are almost interchangeable. Some purists will insist on some technical differences. Raw practices mean the same thing. But what happened was the term neural networks had been around for decades. But around 10, 15 years ago, a number of us realized that deep learning, it was just a much better brand."},{"start":538.86,"text":"And so even though neural networks have been around for decades, starting about 10, 15 years ago, it was deep learning that took off. Because who doesn't want learning that is really deep? It's just a good brand. But you hear me use those terms kind of interchangeably. But deep learning algorithms, neural networks."},{"start":561.02,"text":"They give us a way to take advantage of more and more and more compute capacity so they can build very large AI models with a lot of parameters to soak up the large amounts of data to get more and more intelligent or to make better and better predictions or generate more and more accurate outputs using a large amount of data that's available to us. Ever since I was a teenager, my mom's been trying to convince me to stop mumbling."},{"start":588.0,"text":"But now, many years later, I still struggle with that. So I'll try my best, but please wave at me or kind of let me know if I start to drift lower again. I think my mother would be very happy to practice like this now. All right. So CS fundamentals, machine learning, deep learning, and then the recent generative AI revolution. You know, generative AI."},{"start":619.83,"text":"sorry, bad handwriting, generative AI, which is mostly built by a specific type of neural network called the transformer neural network, which you learned about in this class. You actually learned what is the transformer architecture later in this quarter as well. It is in turn built on top of deep learning, right? So I assume all of you, you know, are regularly prompting LLMs, large language models, to help you get work done. And what I find is that"},{"start":649.43,"text":"While I use LLMs all the time, for a lot of applications, just prompting LLMs, it doesn't cut it. There are a lot of things that I cannot get to work just by prompting an LLM. And so I'll often have to go a layer deeper into the deep learning layer of abstraction and fiddle with deep learning algorithms in order to get certain things to work. And in fact..."}],"speech_gaps":[],"frame":"../frames/v060/004.webp","frame_time":522.3399999999999},{"title":"课程介绍与先修要求","segments":[{"id":46,"text":"So what this class covers is we'll try to make sure that you are near expert in deep learning by the end of this class, but we'll also kind of dip a little bit into machine learning concepts. We'll talk a lot about objective functions and tips and tricks for optimizing parameters in an efficient way. And then we'll also...","zh":"这门课的内容是，我们会努力确保你们在课程结束时接近深度学习专家水平，但我们也将会稍微涉及一些机器学习的概念。我们会大量讨论目标函数以及高效优化参数的技巧和窍门。然后我们还会……","start":671.02,"end":692.98},{"id":47,"text":"actually reach up a little bit to cover some Gen AI. In particular, we'll talk about what is the transformer network. And then through this quarter, Jian and I will also chat a little bit about the job landscape as it relates to Gen AI and deep learning and how deep learning is enabling certain types of Gen AI applications. I have more to say about this, but let me just pause for a second and see if you have any questions. Yeah, go for it.","zh":"实际上还会稍微深入一点，涵盖一些生成式人工智能的内容。特别是，我们会讨论什么是Transformer网络。在整个学期中，我和Jian还会稍微聊聊生成式人工智能和深度学习相关的就业前景，以及深度学习如何使某些类型的生成式人工智能应用成为可能。我还有更多要说的，但让我先暂停一下，看看你们有没有问题。是的，尽情提问吧。","start":693.48,"end":722.76},{"id":48,"text":"Cause may end up going a little bit fast, may seem like it's going a little bit fast in the first, I don't know, two or three weeks, but some people do pick things up quickly that way. And maybe, actually, so a few causes that you may hear about.","zh":"可能会有点快，可能在前一两周看起来有点快，但有些人就是能很快掌握这些内容。而且，实际上，你可能会听到一些原因。","start":726.67,"end":757.54},{"id":49,"text":"So 129 is a relatively easy entry point into machine learning that takes a longer time to go through the core concepts of machine learning. What's the optimization objective? How do you implement gradient descent? What is logistic regression? What's a very basic neural network? So this is a relatively applied...","zh":"129是进入机器学习的一个相对容易的入门点，它需要更长时间来学习机器学习的核心概念。什么是优化目标？如何实现梯度下降？什么是逻辑回归？什么是基本的神经网络？因此，这是一门相对应用性的……","start":758.86,"end":774.34},{"id":50,"text":"easiest of this list. CS229, which I'm also involved in co-teaching, is much more mathematical and theoretical, very high-paced, very intense, and very mathematical. And this is less applied than 129 and 230, but this will go over a lot more of the theory and the math derivations behind machine learning algorithms. So, for example, if you ever want to learn how to do calculus not using","zh":"这门课程是这个列表中最简单的。我同样参与教授的CS229则更加数学化和理论化，节奏非常快，强度非常高，而且非常数学化。与129和230相比，这门课的应用性较低，但会涵盖更多机器学习算法背后的理论和数学推导。例如，如果你曾经想学习如何不用……","start":779.06,"end":799.16},{"id":51,"text":"easiest of this list. CS229, which I'm also involved in co-teaching, is much more mathematical and theoretical, very high-paced, very intense, and very mathematical. And this is less applied than 129 and 230, but this will go over a lot more of the theory and the math derivations behind machine learning algorithms. So, for example, if you ever want to learn how to do calculus not using","zh":"这门课程是这个列表中最简单的。我同样参与教授的CS229则更加数学化和理论化，节奏非常快，强度非常高，而且非常数学化。与129和230相比，这门课的应用性较低，但会涵盖更多机器学习算法背后的理论和数学推导。例如，如果你曾经想学习如何不用……","start":800.08,"end":827.32},{"id":52,"text":"real numbers but calculus using matrices and vectors. You know, that's a bunch of sort of, I don't know, mildly complex math that's worth knowing. CS239 goes over that. CS230, this class is relatively applied and it focuses","zh":"实数，但使用矩阵和向量进行微积分。你知道的，这是一堆或多或少，我也不确定，稍微复杂一点的数学，是值得了解的。CS239会讲这些内容。CS230，这门课相对应用性更强，它侧重","start":827.76,"end":842.44}],"notes":["本段介绍了课程CS230的目标，即帮助学生在课程结束时成为深度学习方面的专家，并涉及一些机器学习概念。课程内容包括目标函数、优化参数的技巧，以及生成式人工智能（Gen AI）的相关内容，如Transformer网络。此外，还提到课程会涉及生成式人工智能和深度学习在实际应用中的关系。","讲者提到课程的先修要求，并指出机器学习并非该课程的先修条件。斯坦福大学的AI课程有多个入门点，包括CS129、CS239和CS230。CS129是较为容易的入门课程，注重应用，而CS229则更偏向数学和理论，节奏快且强度高。","CS239涉及更复杂的数学内容，如矩阵和向量的微积分，而CS230则更注重应用，强调实际操作。","讲者提到课程可能在前几周进展较快，但部分学生可能能快速掌握内容。此外，讲者还提到课程会涉及生成式人工智能和深度学习的就业前景。","讲者在回答问题时提到，如果学生没有机器学习背景，可能会觉得课程内容较难，但课程会逐步讲解核心概念，如优化目标、梯度下降、逻辑回归和基本神经网络。","讲者还提到，课程会涉及机器学习算法背后的理论和数学推导，如使用矩阵和向量进行微积分计算，这在CS229中会更深入地讲解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":671.02,"end":842.44,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":671.02,"text":"So what this class covers is we'll try to make sure that you are near expert in deep learning by the end of this class, but we'll also kind of dip a little bit into machine learning concepts. We'll talk a lot about objective functions and tips and tricks for optimizing parameters in an efficient way. And then we'll also..."},{"start":693.48,"text":"actually reach up a little bit to cover some Gen AI. In particular, we'll talk about what is the transformer network. And then through this quarter, Jian and I will also chat a little bit about the job landscape as it relates to Gen AI and deep learning and how deep learning is enabling certain types of Gen AI applications. I have more to say about this, but let me just pause for a second and see if you have any questions. Yeah, go for it."},{"start":726.67,"text":"Oh, good question. When I say prereq, congratulations, you've won the prize for the first question asked in CS230 2035. So well done. So is machine learning a prereq to this course? Not really. So I think two common entry points to AI at Stanford are CS, well, a few common entry points are CS129, CS239, and CS230. If you don't know any machine learning,"},{"start":758.86,"text":"Cause may end up going a little bit fast, may seem like it's going a little bit fast in the first, I don't know, two or three weeks, but some people do pick things up quickly that way. And maybe, actually, so a few causes that you may hear about."},{"start":779.06,"text":"So 129 is a relatively easy entry point into machine learning that takes a longer time to go through the core concepts of machine learning. What's the optimization objective? How do you implement gradient descent? What is logistic regression? What's a very basic neural network? So this is a relatively applied..."},{"start":800.08,"text":"easiest of this list. CS229, which I'm also involved in co-teaching, is much more mathematical and theoretical, very high-paced, very intense, and very mathematical. And this is less applied than 129 and 230, but this will go over a lot more of the theory and the math derivations behind machine learning algorithms. So, for example, if you ever want to learn how to do calculus not using"},{"start":827.76,"text":"real numbers but calculus using matrices and vectors. You know, that's a bunch of sort of, I don't know, mildly complex math that's worth knowing. CS239 goes over that. CS230, this class is relatively applied and it focuses"}],"speech_gaps":[],"frame":"../frames/v060/005.webp","frame_time":683.02},{"title":"深度学习课程概述与学习路径","segments":[{"id":53,"text":"just on deep learning. So of all the machine learning, there are a lot of machine learning algorithms out there, right? Supervised learning, unsupervised learning, a lot of machine learning algorithms out there. And many, many of them are very useful. And so they're all worth learning about. But of all the machine learning algorithms out there, the one category that is most useful, that's taken off the most, is deep learning. And this class focuses just on that, but the other algorithms also.","zh":"仅仅关于深度学习。所以，在所有的机器学习算法中，有很多机器学习算法存在，对吧？有监督学习、无监督学习，有很多机器学习算法。其中很多都非常有用，因此都值得学习。但在所有这些机器学习算法中，最有用、最流行的一类就是深度学习。这门课只专注于这一类，但其他算法也值得学习。","start":843.04,"end":866.5},{"id":54,"text":"worth learning about. So, 1.29 is the easiest on-ramp. But if you've done either 2.29 or 2.30, I would probably skip 1.29 at that point. But if you are getting started, there are multiple on-ramps. Yeah. Oh, yeah. Can you take 2.29 and 2.30 together? Yeah. Thank you, Price, for the second question. All right. If you don't want to clap, sure, go for it.","zh":"值得学习。因此，1.29是最容易入门的课程。但如果你已经修过2.29或2.30，我可能会跳过1.29。但如果你刚开始学习，有多种入门途径。是的。哦，是的。你能同时修读2.29和2.30吗？可以。谢谢Price提出的第二个问题。好了，如果你不想鼓掌，当然可以，随意。","start":867.2,"end":892.35},{"id":55,"text":"Yes, you can take CS230 and CS2289 together. We designed the two curricula to be relatively low in overlap. So a very small amount of overlap between these two. All right. We won't clap for every single question, but go ahead.","zh":"是的，你可以同时修读CS230和CS2289。我们设计这两个课程体系时，使其重叠较少。因此，这两门课之间的重叠内容非常小。好了，我们不会为每个问题鼓掌，但请继续。","start":896.43,"end":930.06},{"id":56,"text":"not the latest LLM variations in this course. I think a lot of the, it turns out that when you go to get a job, well, maybe, right? Assuming you go and work in industry, the number of people training LLMs is actually very small, right? So those...","zh":"这门课不会涉及最新的LLM变体。我认为，实际上，当你找工作时，也许会发现，假设你进入工业界，训练LLM的人实际上非常少，对吧？所以那些……","start":932.33,"end":951.13},{"id":57,"text":"jobs have been incredibly well paid, so we hear about kind of very high salaries in the news media, but the vast majority of application builders end up sometimes working the Gen-EI level, not that often training a transformer from scratch, but then often using deep learning tools as well. So maybe one example.","zh":"工作机会的薪资非常高，因此我们经常在新闻媒体中看到非常高的薪资报道。但大多数应用开发者最终有时只是在Gen-EI级别工作，而不是经常从头开始训练一个transformer，但通常也会使用深度学习工具。所以也许一个例子。","start":951.41,"end":970.61},{"id":58,"text":"Something that many of my teams have done is we have trained transformable foundation models from scratch with relatively small ones in, say, startups. But one thing we do do quite a lot is take a pre-trained transformer network and then engineer our own data to further fine-tune it.","zh":"我很多团队做过的事情是，我们在初创公司中使用相对较小的模型从头开始训练可转换的基础模型。但我们在做的一件事是，经常使用一个预训练的transformer网络，然后通过工程自己的数据进一步微调它。","start":971.73,"end":990.69},{"id":59,"text":"Sorry, if I'm using words that you may not totally understand, you're pre-trained, fine-tuned, you know what all those terms are by the end of this quarter. So those are things that we actually do kind of day-to-day. This is important for getting a bunch of process work, so you will gain the foundations needed to do type of work in this course. The one thing we don't do is talk a lot about how to train the largest cutting-edge transformer networks. I think that is a very important skill set. It's a relatively niche one.","zh":"抱歉，如果我使用了你可能不完全理解的词汇，你已经预训练、微调过，到本季度末你就会明白所有这些术语的含义。这些都是我们日常实际做的事情。这对于获得一系列流程性的工作非常重要，因此你将获得在这门课程中进行此类工作的基础知识。我们不做的一件事是，大量讨论如何训练最大的前沿变压器网络。我认为这是一个非常重要的技能，相对而言属于一个比较小众的领域。","start":991.09,"end":1019.81}],"notes":["本段介绍了深度学习在机器学习中的重要性，指出虽然存在许多机器学习算法，但深度学习是最具实用性和广泛应用的类别。课程专注于深度学习，但也提到其他算法也值得学习。","本段讨论了课程的学习路径，指出1.29是入门课程，但如果有2.29或2.30的基础，可以跳过。同时提到可以同时修读CS230和CS2289，课程设计有较低的重叠。","本段提到课程不会深入讨论最新的LLM变体，而是关注实际应用。在工业界，训练LLM的人数较少，大多数应用开发者使用预训练模型进行微调，而不是从头开始训练。","本段举例说明团队如何训练小型基础模型，并强调使用预训练模型进行微调的常见做法。同时指出课程不会深入讨论训练最大规模的LLM网络，这是一个较为专业的技能。","本段提到课程会讲解预训练和微调的概念，并指出这些是日常工作中常见的任务。课程重点在于提供基础知识，而不是深入讨论最前沿的模型训练技术。","本段强调课程的目标是为学生打下基础，使他们能够进行相关工作，但不会深入讨论最前沿的模型训练技术，因为这是一个相对小众的技能。"],"formulas":[],"uncertainties":["transformable foundation models"],"diagram":"none","start":843.04,"end":1019.81,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":843.04,"text":"just on deep learning. So of all the machine learning, there are a lot of machine learning algorithms out there, right? Supervised learning, unsupervised learning, a lot of machine learning algorithms out there. And many, many of them are very useful. And so they're all worth learning about. But of all the machine learning algorithms out there, the one category that is most useful, that's taken off the most, is deep learning. And this class focuses just on that, but the other algorithms also."},{"start":867.2,"text":"worth learning about. So, 1.29 is the easiest on-ramp. But if you've done either 2.29 or 2.30, I would probably skip 1.29 at that point. But if you are getting started, there are multiple on-ramps. Yeah. Oh, yeah. Can you take 2.29 and 2.30 together? Yeah. Thank you, Price, for the second question. All right. If you don't want to clap, sure, go for it."},{"start":896.43,"text":"Yes, you can take CS230 and CS2289 together. We designed the two curricula to be relatively low in overlap. So a very small amount of overlap between these two. All right. We won't clap for every single question, but go ahead. Yeah, so when we cover the recent LLM developments, we will touch on the transformer neural network."},{"start":932.33,"text":"not the latest LLM variations in this course. I think a lot of the, it turns out that when you go to get a job, well, maybe, right? Assuming you go and work in industry, the number of people training LLMs is actually very small, right? So those..."},{"start":951.41,"text":"jobs have been incredibly well paid, so we hear about kind of very high salaries in the news media, but the vast majority of application builders end up sometimes working the Gen-EI level, not that often training a transformer from scratch, but then often using deep learning tools as well. So maybe one example."},{"start":971.73,"text":"Something that many of my teams have done is we have trained transformable foundation models from scratch with relatively small ones in, say, startups. But one thing we do do quite a lot is take a pre-trained transformer network and then engineer our own data to further fine-tune it."},{"start":991.09,"text":"Sorry, if I'm using words that you may not totally understand, you're pre-trained, fine-tuned, you know what all those terms are by the end of this quarter. So those are things that we actually do kind of day-to-day. This is important for getting a bunch of process work, so you will gain the foundations needed to do type of work in this course. The one thing we don't do is talk a lot about how to train the largest cutting-edge transformer networks. I think that is a very important skill set. It's a relatively niche one."}],"speech_gaps":[],"frame":"../frames/v060/006.webp","frame_time":855.04},{"title":"课程性质与目标","segments":[{"id":60,"text":"Some people are getting paid really, really well, but the number of people doing that in the world is actually small, whereas the number of people building applications with this set of skills is very large. Do I know any courses covering that? I think Percy Liang was thinking about doing something, but I don't remember what he's doing this quarter. A few people are thinking about doing something like that.","zh":"有些人挣的钱真的非常多，但世界上真正这样的人其实很少，而具备这些技能并用其构建应用程序的人却非常多。我知道有课程涵盖这些内容吗？我想Percy Liang曾经考虑过做类似的事情，但我不记得他这个季度在做什么。有几个人在考虑做类似的事情。","start":1020.37,"end":1044.43},{"id":61,"text":"So just repeating for the mic, for the home viewers. What portion is coding versus what portion is mathematical analysis? This course is relatively math-light. Sorry, maybe that was too strong a statement. But I think this course is very practical. I remember many years back, speaking with a mathematician.","zh":"为了麦克风和在家观看的观众再重复一遍。编程部分占多少比例，数学分析部分占多少比例？这门课相对数学内容较少。抱歉，也许我刚才的说法太强烈了。但我觉得这门课非常实用。我记得多年前和一位数学家交谈。","start":1057.98,"end":1081.72},{"id":62,"text":"And, you know, we were just chatting and he was asking, he was just talking about his career, why he chose to be a mathematician. And I still remember, you know, he had like stars in his eyes when he told me that he chose his career path because he felt his role is to pursue truth and beauty in the universe. And that's why he became a mathematician. In this course, I'm not going to do any truth and beauty stuff, right?","zh":"当时我们只是聊天，他谈到自己的职业生涯，为什么选择成为数学家。我还记得，他告诉我他选择职业道路是因为他觉得自己的职责是追求宇宙中的真理与美。因此他成为了数学家。在这门课上，我不会做任何关于真理与美的内容，对吧？","start":1083.81,"end":1112.32},{"id":63,"text":"Truth and beauty is good, but you find that I want to take a very practical approach to talking about how to build applications and build software that works. Cool. Anything else? Cool. Awesome. All right. Thank you for all the questions. Please keep them coming. And feel free to interrupt me or Qian throughout this quarter as well with questions. I love it.","zh":"真理与美很好，但你会发现我想要以非常实用的方式讨论如何构建应用程序和构建能正常工作的软件。很好。还有别的吗？很好。太棒了。好的，感谢大家的问题。请继续提问。在整个季度中，也欢迎随时打断我或钱提问。我非常喜欢。","start":1115.3,"end":1138.13},{"id":64,"text":"So just to flesh this out a little bit more, this is what I see in terms of teams building practical applications. And I'm excited about applications because with improving machine learning algorithms, deep learning algorithms, generating algorithms, there are a lot of applications that you can build now that just were impossible or really inaccessible to any...","zh":"为了更具体地说明一下，这是我看到的在构建实用应用程序方面的团队情况。我之所以对应用程序感到兴奋，是因为随着机器学习算法、深度学习算法和生成算法的不断改进，现在可以构建的应用程序种类非常多，这些在过去甚至几年内对任何人来说都是不可能或难以实现的。","start":1140.04,"end":1166.3},{"id":65,"text":"person to build even a few years ago. And so I find that when I prompt Gen-AI, it works really well for a lot of","zh":"当我提示生成式AI时，它在很多方面都表现得非常好。","start":1166.7,"end":1177.83}],"notes":["本段主要讨论课程的性质，强调其实践性而非数学深度。讲者提到课程相对数学内容较少，但非常注重实际应用，这与他过去与一位数学家的对话形成对比，后者因追求真理与美而选择数学作为职业。","讲者明确表示，本课程不会涉及真理与美的探讨，而是专注于如何构建实际应用和软件。这种对比突出了课程的实用导向，同时也反映了讲者对数学与应用之间关系的看法。","讲者还提到，随着机器学习和深度学习算法的改进，现在可以构建许多以前无法实现的应用。这表明课程内容将涵盖当前技术发展的实际应用案例。","讲者鼓励学生继续提问，并在本季度中随时打断或提问，显示出他对互动教学的重视。这种开放的态度有助于学生更好地理解和参与课程。","讲者提到，他正在思考如何构建实际应用的团队，并对这些应用的前景感到兴奋。这表明课程内容将涉及团队合作和实际项目开发。","最后，讲者提到他正在与Gen-AI进行交互，并认为这在许多情况下效果很好。这暗示了课程可能涉及生成式人工智能的应用，但具体细节未明确说明。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1020.37,"end":1177.83,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1020.37,"text":"Some people are getting paid really, really well, but the number of people doing that in the world is actually small, whereas the number of people building applications with this set of skills is very large. Do I know any courses covering that? I think Percy Liang was thinking about doing something, but I don't remember what he's doing this quarter. A few people are thinking about doing something like that."},{"start":1057.98,"text":"So just repeating for the mic, for the home viewers. What portion is coding versus what portion is mathematical analysis? This course is relatively math-light. Sorry, maybe that was too strong a statement. But I think this course is very practical. I remember many years back, speaking with a mathematician."},{"start":1083.81,"text":"And, you know, we were just chatting and he was asking, he was just talking about his career, why he chose to be a mathematician. And I still remember, you know, he had like stars in his eyes when he told me that he chose his career path because he felt his role is to pursue truth and beauty in the universe. And that's why he became a mathematician. In this course, I'm not going to do any truth and beauty stuff, right?"},{"start":1115.3,"text":"Truth and beauty is good, but you find that I want to take a very practical approach to talking about how to build applications and build software that works. Cool. Anything else? Cool. Awesome. All right. Thank you for all the questions. Please keep them coming. And feel free to interrupt me or Qian throughout this quarter as well with questions. I love it."},{"start":1140.04,"text":"So just to flesh this out a little bit more, this is what I see in terms of teams building practical applications. And I'm excited about applications because with improving machine learning algorithms, deep learning algorithms, generating algorithms, there are a lot of applications that you can build now that just were impossible or really inaccessible to any..."},{"start":1166.7,"text":"person to build even a few years ago. And so I find that when I prompt Gen-AI, it works really well for a lot of"}],"speech_gaps":[],"frame":"../frames/v060/007.webp","frame_time":1032.37},{"title":"深度学习在不同数据类型中的应用与挑战","segments":[{"id":66,"text":"text-based applications. And there's work on multimodal LLMs, large multimodal models, so making inroads into vision, making inroads into audio, but really, gen-AI algorithms, especially transformer networks trained to output text, you know, like ChaiGPT, Cloud, Gemini, and so on, really fantastic for text-based applications. And I find myself regularly...","zh":"基于文本的应用。也有针对多模态大语言模型（LLMs）的研究，大型多模态模型，因此在视觉、音频领域取得了进展，但真正强大的生成式AI算法，尤其是那些被训练以输出文本的Transformer网络，例如ChaiGPT、Cloud、Gemini等，对于基于文本的应用来说非常出色。我自己经常……","start":1178.22,"end":1203.43},{"id":67,"text":"working with deep learning algorithms directly when I am working with audio data, image, and video data, and then also a lot of structured data. Sorry, my handwriting is awful, right?","zh":"在处理音频数据、图像和视频数据时，我直接使用深度学习算法，同时也处理大量结构化数据。抱歉，我的手写太糟糕了，对吧？","start":1204.02,"end":1226.81},{"id":68,"text":"So structured data refers to large tables of numbers, like Excel, Google Sheets, spreadsheets. So that's structured data. Unstructured data refers to text, audio, images, maybe video. And because a lot of Gen AI, large language models like ChaiGVD, have grown up being text-in, text-out.","zh":"结构化数据指的是大型数字表格，例如Excel、Google表格、电子表格。因此这就是结构化数据。非结构化数据指的是文本、音频、图像，也许还有视频。而且由于很多生成式AI，如ChaiGVD等大型语言模型，都是以文本输入、文本输出的方式成长起来的。","start":1227.51,"end":1248.01},{"id":69,"text":"kinds of machines, they are remarkable for a lot of text processing applications. But for other types of data, I end up often dipping down directly to use various deep learning algorithms. And then it turns out that","zh":"这些机器在很多文本处理应用中表现非凡。但对于其他类型的数据，我经常直接使用各种深度学习算法。结果发现，","start":1248.51,"end":1264.09},{"id":70,"text":"For text-based data, if all you do is prompting, you could usually go quite far. So a lot of applications are built by prompting OMs. But I've been on quite a few teams where after fiddling with the prompts for a month,","zh":"对于基于文本的数据，如果你只是通过提示（prompting）来操作，通常可以走得很远。因此很多应用都是通过提示大模型（OMs）构建的。但我在很多团队中都经历过，折腾提示语一个月后，","start":1264.55,"end":1280.07},{"id":71,"text":"you just can't get the performance to be better just by tuning the prompts. Or another good problem to have, it turns out use of GenAI tools are relatively inexpensive when you're prototyping, right? It's like, you know, a few dollars per million tokens. You can do a lot.","zh":"仅仅通过调整提示语就无法获得更好的性能。或者另一个好的问题，使用生成式AI工具在原型设计时相对成本较低，对吧？比如，每百万个标记只需几美元，你可以做很多事情。","start":1280.66,"end":1301.38},{"id":72,"text":"his product market fit and a lot of users want to use. You know, multiple times I've been on teams where we basically did not care about our large language model bill, right? It was like, whatever, you know, $20 a month or $100 a month was fine. But when more and more users start using it, then to your team's kind of positive surprise, your AI bill really starts to skyrocket.","zh":"产品市场契合度和很多用户想要使用。你知道，我多次参与的团队基本上都不太在意我们的大型语言模型费用，对吧？就像，不管怎样，每月20美元或100美元都算不了什么。但当越来越多的用户开始使用它时，你团队的积极惊喜是，AI费用真的开始飙升。","start":1302.55,"end":1325.03},{"id":73,"text":"And then at some point, you look at how much you're paying for your AI bill, for the large language models, and to bend the cost curve back down, often a lot of the techniques in deep learning become very relevant as well. So there are, I don't know, I'm thinking just some of our bills were really breathtaking. I don't want to say the numbers, but just kind of definitely more than we want to pay. As much as we love the companies providing OEMs, our bills that we're paying them were significantly larger than I wanted to pay.","zh":"然后在某个时候，你会看看自己为AI账单所支付的费用，尤其是为大型语言模型所支付的费用，为了将成本曲线拉回到下降趋势，很多时候深度学习中的许多技术也变得非常相关。所以，我很难说，我想到我们的一些账单真的令人震惊。我不想说出具体的数字，但可以肯定的是，这些费用明显超出了我们愿意支付的范围。尽管我们非常喜爱提供原始设备制造商（OEM）服务的公司，但我们支付给他们的账单却明显超过了我愿意支付的金额。","start":1325.51,"end":1353.01}],"notes":["本段主要讨论深度学习在不同数据类型（结构化与非结构化）中的应用，以及生成式人工智能（Gen AI）在文本处理中的优势。结构化数据如表格数据，而非结构化数据包括文本、音频、图像和视频。生成式AI模型如ChaiGVD等，通常以文本输入和输出为主。","讲者提到，对于文本数据，仅通过提示（prompting）即可实现较好的性能，许多应用是通过提示大型语言模型（LLMs）构建的。然而，当提示调优无法进一步提升性能时，团队可能需要转向更复杂的解决方案。","在原型开发阶段，使用生成式AI工具的成本相对较低，例如每百万个标记只需几美元。但一旦产品市场匹配并有大量用户使用，AI的费用会迅速增加，这可能对团队的预算造成压力。","讲者指出，当AI费用变得过高时，深度学习技术变得尤为重要，以降低计算成本。这表明，尽管生成式AI在某些任务中表现优异，但其高昂的成本可能促使团队重新考虑使用传统深度学习方法。","讲者提到，尽管公司提供的生成式AI服务（如OEMs）非常有用，但其费用可能远超预期，这促使团队寻找更经济的解决方案。","本段强调了生成式AI在文本处理中的强大能力，但也指出了其在实际应用中可能遇到的成本问题，以及深度学习在应对这些挑战时的重要性。"],"formulas":[],"uncertainties":["ChaiGVD（可能为ChaiGPT的误听）","OEMs（可能指Original Equipment Manufacturer，但上下文未明确）"],"diagram":"none","start":1178.22,"end":1353.01,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1178.22,"text":"text-based applications. And there's work on multimodal LLMs, large multimodal models, so making inroads into vision, making inroads into audio, but really, gen-AI algorithms, especially transformer networks trained to output text, you know, like ChaiGPT, Cloud, Gemini, and so on, really fantastic for text-based applications. And I find myself regularly..."},{"start":1204.02,"text":"working with deep learning algorithms directly when I am working with audio data, image, and video data, and then also a lot of structured data. Sorry, my handwriting is awful, right?"},{"start":1227.51,"text":"So structured data refers to large tables of numbers, like Excel, Google Sheets, spreadsheets. So that's structured data. Unstructured data refers to text, audio, images, maybe video. And because a lot of Gen AI, large language models like ChaiGVD, have grown up being text-in, text-out."},{"start":1248.51,"text":"kinds of machines, they are remarkable for a lot of text processing applications. But for other types of data, I end up often dipping down directly to use various deep learning algorithms. And then it turns out that"},{"start":1264.55,"text":"For text-based data, if all you do is prompting, you could usually go quite far. So a lot of applications are built by prompting OMs. But I've been on quite a few teams where after fiddling with the prompts for a month,"},{"start":1280.66,"text":"you just can't get the performance to be better just by tuning the prompts. Or another good problem to have, it turns out use of GenAI tools are relatively inexpensive when you're prototyping, right? It's like, you know, a few dollars per million tokens. You can do a lot. But sometimes if you're lucky enough to be on a product that"},{"start":1302.55,"text":"his product market fit and a lot of users want to use. You know, multiple times I've been on teams where we basically did not care about our large language model bill, right? It was like, whatever, you know, $20 a month or $100 a month was fine. But when more and more users start using it, then to your team's kind of positive surprise, your AI bill really starts to skyrocket."},{"start":1325.51,"text":"And then at some point, you look at how much you're paying for your AI bill, for the large language models, and to bend the cost curve back down, often a lot of the techniques in deep learning become very relevant as well. So there are, I don't know, I'm thinking just some of our bills were really breathtaking. I don't want to say the numbers, but just kind of definitely more than we want to pay. As much as we love the companies providing OEMs, our bills that we're paying them were significantly larger than I wanted to pay."}],"speech_gaps":[],"frame":"../frames/v060/008.webp","frame_time":1190.22},{"title":"深度学习课程概述与技能重点","segments":[{"id":74,"text":"And then knowing how to use deep learning to fine-tune smaller models, that was really the critical skill set that just bent the cost curve back and just made the whole thing affordable to keep on providing a service, right? So, yeah, right. So that's the skill set I hope you get from this course. Let's see. All right. And to give a... Sorry, let me use this one.","zh":"然后知道如何使用深度学习来微调较小的模型，这真的是一个关键技能集，它让成本曲线弯曲回来，使整个服务保持可负担，对吧？所以，是的，没错。所以这就是我希望你们从这门课程中获得的技能集。我们来看看。好的。为了给出一个……抱歉，让我用这个。","start":1354.41,"end":1391.96},{"id":75,"text":"So to give a quick overview, this course, the online materials, is broken down into five modules. So just to give you an overview of it.","zh":"为了快速概述，这门课程的在线材料分为五个模块。所以，只是为了给你一个概述。","start":1401.1,"end":1411.18},{"id":76,"text":"the five of them. First one is on the basics of neural networks, NN neural networks, and DL deep learning. So you learn how to build a neural network or deep learning algorithm from Scratch and Python. I find that sometimes if you use the frameworks like TensorFlow or PyTorch, it hides a lot of the details. So actually work through how to build a basic neural network and how to build a basic deep learning algorithm just in raw Python so you really understand it.","zh":"这五个模块。第一个模块是关于神经网络的基本知识，即神经网络和深度学习。你将学习如何从头开始用Python构建一个神经网络或深度学习算法。我发现，有时候如果你使用像TensorFlow或PyTorch这样的框架，它会隐藏很多细节。因此，实际上要工作地了解如何用原始Python构建一个基本的神经网络和一个基本的深度学习算法，以便你真正理解它。","start":1411.65,"end":1439.49},{"id":77,"text":"And then the second module, the second mini course, will be on how to improve, how to tune.","zh":"然后第二个模块，第二个小课程，将介绍如何改进，如何调整。","start":1440.24,"end":1447.96},{"id":78,"text":"your neural networks. So we have heard that when you're training a neural network, there are a lot of parameters, or we call them hyperparameters. Hyperparameters are parameters that control the parameters, right? So the weights of parameters, hyperparameters are things like the learning rate or what's the size of your neural network. And so there are actually a lot of hyperparameters that we end up tuning and try to give you a sense of what are the most important ones and practical skills for tuning them. It turns out that","zh":"你的神经网络。我们已经听说过，在训练神经网络时，有很多参数，或者说我们称之为超参数。超参数是控制参数的参数，对吧？所以参数的权重，超参数包括学习率或神经网络的大小。实际上，我们最终要调整的超参数有很多，我们试图让你了解哪些是最重要的，以及调整它们的实用技能。结果发现，","start":1448.51,"end":1476.55},{"id":79,"text":"If I look at my PhD students, I think every one of them that, right? Well, I think that probably every one of them, definitely every PhD student I know that became great, I think, at some point wound up at 2 a.m. tuning hyperparameters, right? And I still have very clear recollections of being in the office.","zh":"如果我看看我的博士生，我认为每一个人都会这样，对吧？嗯，我认为可能每一个人都会这样，肯定每一个我认识的成为优秀的博士生，我认为在某个时候都会在凌晨2点调整超参数，对吧？我仍然非常清楚地记得在办公室的情景。","start":1477.97,"end":1501.67},{"id":80,"text":"2 a.m., 3 a.m., filling with parameters, trying to get it to work. And it turns out that literally your skill at tuning hyperparameters, it really makes a difference. So there were some evenings that I knew my skill at tuning hyperparameters, frankly, it made the difference between whether I went home to sleep at 3 a.m. versus where I went home to sleep at 7 a.m. Maybe don't do what I do. I'm not encouraging this type of behavior.","zh":"凌晨2点，凌晨3点，填充参数，试图让它正常运行。结果发现，你调整超参数的技能真的会带来很大差别。有些晚上，我清楚地知道，我调整超参数的技能，实际上决定了我是否在凌晨3点回家睡觉，还是在下午7点回家睡觉。也许不要做我做的事情。我不鼓励这种行为。","start":1503.06,"end":1525.84}],"notes":["本段介绍了课程的结构，分为五个模块，其中第一个模块是关于神经网络和深度学习的基础知识，强调从零开始使用Python构建神经网络和深度学习算法，以加深理解。","第二模块关注如何改进和调整神经网络，特别是超参数的调优。超参数是控制模型参数的参数，如学习率和网络大小，调优这些参数对模型性能有重要影响。","讲者提到，超参数调优是深度学习中的关键技能，甚至提到自己和博士生在深夜进行调参，说明这一技能对实际应用的重要性。","讲者还提到，超参数调优的技能直接影响模型训练的效率和结果，例如决定是否能在凌晨3点回家睡觉还是凌晨7点。","最后，讲者以幽默的方式提醒听众不要效仿自己的行为，暗示超参数调优虽然重要，但应保持适度。","整体上，本段强调了深度学习课程中对超参数调优技能的重视，以及其在实际应用中的关键作用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1354.41,"end":1525.84,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1354.41,"text":"And then knowing how to use deep learning to fine-tune smaller models, that was really the critical skill set that just bent the cost curve back and just made the whole thing affordable to keep on providing a service, right? So, yeah, right. So that's the skill set I hope you get from this course. Let's see. All right. And to give a... Sorry, let me use this one."},{"start":1401.1,"text":"So to give a quick overview, this course, the online materials, is broken down into five modules. So just to give you an overview of it."},{"start":1411.65,"text":"the five of them. First one is on the basics of neural networks, NN neural networks, and DL deep learning. So you learn how to build a neural network or deep learning algorithm from Scratch and Python. I find that sometimes if you use the frameworks like TensorFlow or PyTorch, it hides a lot of the details. So actually work through how to build a basic neural network and how to build a basic deep learning algorithm just in raw Python so you really understand it."},{"start":1440.24,"text":"And then the second module, the second mini course, will be on how to improve, how to tune."},{"start":1448.51,"text":"your neural networks. So we have heard that when you're training a neural network, there are a lot of parameters, or we call them hyperparameters. Hyperparameters are parameters that control the parameters, right? So the weights of parameters, hyperparameters are things like the learning rate or what's the size of your neural network. And so there are actually a lot of hyperparameters that we end up tuning and try to give you a sense of what are the most important ones and practical skills for tuning them. It turns out that"},{"start":1477.97,"text":"If I look at my PhD students, I think every one of them that, right? Well, I think that probably every one of them, definitely every PhD student I know that became great, I think, at some point wound up at 2 a.m. tuning hyperparameters, right? And I still have very clear recollections of being in the office."},{"start":1503.06,"text":"2 a.m., 3 a.m., filling with parameters, trying to get it to work. And it turns out that literally your skill at tuning hyperparameters, it really makes a difference. So there were some evenings that I knew my skill at tuning hyperparameters, frankly, it made the difference between whether I went home to sleep at 3 a.m. versus where I went home to sleep at 7 a.m. Maybe don't do what I do. I'm not encouraging this type of behavior."}],"speech_gaps":[],"frame":"../frames/v060/009.webp","frame_time":1366.41},{"title":"构建机器学习项目的策略","segments":[{"id":81,"text":"But this is just my personal experiences, but it really makes a big difference, your practical skill at how quickly you can figure out the recipe to get these neural networks to train. And related to that is one thing we've chatted a lot about in this course is strategies for building machine learning projects.","zh":"但这只是我个人的经验，但它真的对你的实际技能有很大影响，即你能够多快地找出配方让这些神经网络开始训练。与此相关的是，我们在本课程中讨论了很多的一个话题，就是构建机器学习项目的策略。","start":1526.46,"end":1559.22},{"id":82,"text":"So it turns out that if you build a complex system, let's say you build, this is one example we'll go through later this quarter. Say you want to build a system that recognizes your face, a camera that recognizes your face, your friend's face, unlock a door, right? Security, safety, whatever. So systems like that, I've worked on systems like that, Chance has worked on systems like that. These are complex systems with multiple components. There's a camera, do you subtract, clean up the image?","zh":"结果发现，如果你构建一个复杂的系统，比如说你构建，这是我们在本季度稍后会讨论的一个例子。假设你想构建一个系统，能够识别你的脸，一个摄像头，能够识别你的脸、你朋友的脸，用来解锁门，对吧？安全、安全，无论什么用途。这样的系统，我曾经参与过这样的系统，Chance 也参与过这样的系统。这些都是包含多个组件的复杂系统。有摄像头，你是否需要减去背景，清理图像？","start":1560.62,"end":1586.74},{"id":83,"text":"color the phase, how do you register the phase, how do you compare a phase, how do you decide to take another picture before you unlock the door, or someone trying to hold up a picture, print on a piece of paper. There are actually a lot of decisions. And so what I find is that the biggest...","zh":"给图像上色，如何注册相位，如何比较相位，如何决定在解锁门之前是否需要再拍一张照片，或者有人试图用一张打印在纸上的照片来欺骗系统。实际上有很多决定需要做出。我发现，最大的差异在于一个团队是否知道如何有效地推进这样的项目，能够在几天而不是几周，或者几周而不是几个月内完成任务。","start":1587.9,"end":1606.3},{"id":84,"text":"difference between a team that knows how to drive forward a project like this well and get it done in days rather than weeks or weeks rather than many months is the ability to drive a disciplined development process. It turns out when you have a complex system, less experienced teams will often almost pick things at random to work on. They'll read one research paper and say, oh, I read in the research paper we should get more data.","zh":"这种差异在于团队是否能够执行一个有纪律的开发流程。结果发现，当处理一个复杂系统时，经验不足的团队往往会随机选择要处理的问题。他们会读一篇研究论文，然后说，哦，我在研究论文里看到，我们应该获取更多数据。","start":1606.87,"end":1632.05},{"id":85,"text":"Well, because some newspapers said, AI needs lots of data, so let's go spend six months to collect more data. Turns out a lot of the time, collecting more data does not help your application. But sometimes it's a huge help. So given your application, how do you decide? Should you spend more time collecting data? Maybe you should buy more GPUs. I actually definitely know people that read in the news, a lot of GPUs are helpful, right? And then I've literally met, you know,","zh":"因为有些报纸说，人工智能需要大量数据，所以他们可能会花六个月去收集更多数据。结果发现，很多时候，收集更多数据对你的应用并没有帮助。但有时候它确实非常有帮助。那么，根据你的应用，你如何决定？你应该花更多时间收集数据吗？也许你应该购买更多的 GPU。实际上，我确实认识一些人，他们在新闻中读到，很多 GPU 是有帮助的，对吧？我实际上见过一些人，","start":1632.57,"end":1660.55},{"id":86,"text":"fairly senior business leaders that have spent a very large amount of money buying GPUs and then, you know, some funny stories. And then I go talk to them and say, what are you doing with these GPUs? And then sometimes, you know, there was one meeting I was in where literally a very large family-run business had bought a lot of GPUs and the CTO then pointed to his nephew","zh":"一些相当资深的商业领袖，他们花了很多钱购买了GPU，然后还有一些有趣的故事。接着我去和他们交谈，问他们这些GPU是用来做什么的。有时候，在一次会议中，我遇到一个非常大的家族企业，他们购买了很多GPU，然后CTO指着他的侄子","start":1660.91,"end":1689.85}],"notes":["本段讨论了在构建复杂机器学习系统时，团队如何通过有纪律的开发流程来提高效率。经验丰富的团队能够快速识别关键问题并采取有效措施，而缺乏经验的团队则可能随机选择任务，导致资源浪费。","讲者提到，一些团队会根据研究论文的建议增加数据量，但这种做法并不总是有效。因此，需要根据具体应用场景来决定是否增加数据或升级硬件。","讲者还举了一个实际例子，说明一些企业可能因为误解了GPU的作用而大量购买，但实际使用中并未充分利用这些资源。","这些例子强调了在实际项目中，理解问题本质和合理分配资源的重要性，而不是盲目追求技术趋势。","讲者通过这些实际案例，说明了在构建复杂系统时，团队的决策能力和执行力是决定项目成败的关键因素。","最后，讲者提到一个具体的例子，说明某些企业可能因为对技术理解不足而做出不合理的投资决策，这进一步强调了在项目初期进行充分规划和评估的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1526.46,"end":1689.85,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1526.46,"text":"But this is just my personal experiences, but it really makes a big difference, your practical skill at how quickly you can figure out the recipe to get these neural networks to train. And related to that is one thing we've chatted a lot about in this course is strategies for building machine learning projects."},{"start":1560.62,"text":"So it turns out that if you build a complex system, let's say you build, this is one example we'll go through later this quarter. Say you want to build a system that recognizes your face, a camera that recognizes your face, your friend's face, unlock a door, right? Security, safety, whatever. So systems like that, I've worked on systems like that, Chance has worked on systems like that. These are complex systems with multiple components. There's a camera, do you subtract, clean up the image?"},{"start":1587.9,"text":"color the phase, how do you register the phase, how do you compare a phase, how do you decide to take another picture before you unlock the door, or someone trying to hold up a picture, print on a piece of paper. There are actually a lot of decisions. And so what I find is that the biggest..."},{"start":1606.87,"text":"difference between a team that knows how to drive forward a project like this well and get it done in days rather than weeks or weeks rather than many months is the ability to drive a disciplined development process. It turns out when you have a complex system, less experienced teams will often almost pick things at random to work on. They'll read one research paper and say, oh, I read in the research paper we should get more data."},{"start":1632.57,"text":"Well, because some newspapers said, AI needs lots of data, so let's go spend six months to collect more data. Turns out a lot of the time, collecting more data does not help your application. But sometimes it's a huge help. So given your application, how do you decide? Should you spend more time collecting data? Maybe you should buy more GPUs. I actually definitely know people that read in the news, a lot of GPUs are helpful, right? And then I've literally met, you know,"},{"start":1660.91,"text":"fairly senior business leaders that have spent a very large amount of money buying GPUs and then, you know, some funny stories. And then I go talk to them and say, what are you doing with these GPUs? And then sometimes, you know, there was one meeting I was in where literally a very large family-run business had bought a lot of GPUs and the CTO then pointed to his nephew"}],"speech_gaps":[],"frame":"../frames/v060/010.webp","frame_time":1538.46},{"title":"课程目标与AI应用的现实考量","segments":[{"id":87,"text":"who's a current college student undergrad, and said, oh, my nephew knows AI. I'm giving him this very large budget in GPUs, and I think he'll do AI for me, right? And so I think that knowing how to make these decisions and not just buying into the hype that you read about in the newspapers is really important.","zh":"有一位目前是大学本科生的学生，他说，哦，我侄子懂AI。我打算给他一个非常大的GPU预算，我认为他会为我做AI，对吧？因此，我认为知道如何做出这些决策，而不仅仅是被报纸上读到的炒作所影响，是非常重要的。","start":1691.91,"end":1710.43},{"id":88,"text":"And one thing I hope to do in this course is share with you what driving a disciplined development process looks like, because this is one of the things that really makes a 10x difference in the speed with which you can get something to work. I've literally seen teams take six months or 10 months pursuing an approach that experienced engineers would go in and go...","zh":"我希望在这门课中，与你们分享什么是遵循纪律的开发流程，因为这正是在你能够使事情运作起来的速度上产生10倍差异的一个因素。我实际上亲眼见过团队花费六个月或十个月去追求一种经验丰富的工程师会直接进入并……","start":1711.54,"end":1733.68},{"id":89,"text":"you know what, I could have told you six months ago that spending all this time collecting data, this was not going to get your application to where you want it to go, right? But so how do you examine an application and figure out the diagnostics to figure out what are the productive things to do for your application? We actually spend a lot of time on that. And in fact,","zh":"你知道吗，六个月前我就能告诉你，花这么多时间收集数据，这不会让你的应用达到你想要的目标，对吧？那么，你如何检查一个应用并找出诊断方法，以确定对你的应用来说哪些是有生产力的事情？我们实际上花了很多时间在这一点上。事实上，","start":1734.24,"end":1751.92},{"id":90,"text":"I'm excited about doing some simulation exercises in this classroom with you later this quarter, where I'll invite you later this quarter to say, in this scenario, what would you do? And see if you could make decisions in a more systematic way. All right. Then course four, we'll talk about convolutional networks.","zh":"我非常期待在这个学期的课堂上与你们一起做一些模拟练习，之后我会邀请你们在这个情境下说，你会怎么做？并看看你们是否能够以更系统的方式做出决策。好的。那么第四门课，我们将讨论卷积网络。","start":1752.85,"end":1779.13},{"id":91,"text":"Very useful for computer vision applications. And then, so ConvNets are specialized models used mostly for vision applications, dealing with images. And then we'll talk finally about sequence models. So sequences could be time series or sequences of text, like words. So I'll start touching the transformer network that powered a lot of the Gen-AI revolution. And so,","zh":"这对计算机视觉应用非常有用。然后，卷积网络是主要用于视觉应用的专用模型，处理图像。然后，我们将最后讨论序列模型。序列可以是时间序列或文本序列，比如单词。因此，我将开始介绍推动许多生成式AI革命的Transformer网络。因此，","start":1781.71,"end":1813.18},{"id":92,"text":"Throughout learning all of these things, I hope that you all gain a large tool chest that will enable you to tackle an almost bewildering range of applications. I think one of the things I've most enjoyed as an AI person is it turns out when you work in AI, there are so many other teams that have data.","zh":"在学习所有这些内容的过程中，我希望你们都能获得一个庞大的工具箱，使你们能够应对几乎令人困惑的各种应用。我认为作为一名AI从业者，我最享受的一件事是，当你从事AI工作时，会有许多其他团队拥有数据。","start":1813.71,"end":1837.77},{"id":93,"text":"And they could use our hope, right? So I feel like as an AI person, you know, I somehow bizarrely had the right to play in, you know, building autonomous helicopters or hoping companies, I don't know.","zh":"他们甚至可以利用我们的希望，对吧？所以我觉得作为一个AI从业者，你知道，我以某种奇怪的方式拥有参与，你知道，建造自主直升机或希望公司，我也不知道。","start":1838.56,"end":1850.92}],"notes":["本段主要讨论了AI领域中实际应用与理论知识之间的差距，强调了在AI开发过程中需要具备批判性思维，避免盲目追随媒体宣传。讲者提到，许多学生或非专业人士可能因为看到AI的热门趋势而投入大量资源，但缺乏系统性的开发流程，导致效率低下。","讲者希望在课程中分享如何建立一个有纪律的开发流程，这在AI开发中可以带来显著的效率提升。他提到，有经验的工程师可以在短时间内识别出无效的开发路径，而缺乏经验的团队可能需要数月时间才能意识到错误。","讲者进一步指出，如何诊断应用问题并找到有效的解决方案是课程的重要内容。他提到，课程中会通过模拟练习来训练学生系统性地思考和决策，以提高他们在实际项目中的表现。","课程接下来将介绍卷积神经网络（ConvNets），这是一种专门用于计算机视觉任务的模型。讲者提到，ConvNets在处理图像数据时非常有效，并将介绍其在实际应用中的重要性。","此外，课程还将涉及序列模型，如Transformer网络，这些模型在自然语言处理和生成式AI中发挥了关键作用。讲者提到，Transformer网络是推动生成式AI革命的重要技术之一。","最后，讲者希望学生通过本课程能够掌握多种工具和方法，以应对各种复杂的AI应用问题。他提到，AI领域的一个重要特点是不同团队之间可以共享数据和资源，从而推动技术的快速发展。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1691.91,"end":1850.92,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1691.91,"text":"who's a current college student undergrad, and said, oh, my nephew knows AI. I'm giving him this very large budget in GPUs, and I think he'll do AI for me, right? And so I think that knowing how to make these decisions and not just buying into the hype that you read about in the newspapers is really important."},{"start":1711.54,"text":"And one thing I hope to do in this course is share with you what driving a disciplined development process looks like, because this is one of the things that really makes a 10x difference in the speed with which you can get something to work. I've literally seen teams take six months or 10 months pursuing an approach that experienced engineers would go in and go..."},{"start":1734.24,"text":"you know what, I could have told you six months ago that spending all this time collecting data, this was not going to get your application to where you want it to go, right? But so how do you examine an application and figure out the diagnostics to figure out what are the productive things to do for your application? We actually spend a lot of time on that. And in fact,"},{"start":1752.85,"text":"I'm excited about doing some simulation exercises in this classroom with you later this quarter, where I'll invite you later this quarter to say, in this scenario, what would you do? And see if you could make decisions in a more systematic way. All right. Then course four, we'll talk about convolutional networks."},{"start":1781.71,"text":"Very useful for computer vision applications. And then, so ConvNets are specialized models used mostly for vision applications, dealing with images. And then we'll talk finally about sequence models. So sequences could be time series or sequences of text, like words. So I'll start touching the transformer network that powered a lot of the Gen-AI revolution. And so,"},{"start":1813.71,"text":"Throughout learning all of these things, I hope that you all gain a large tool chest that will enable you to tackle an almost bewildering range of applications. I think one of the things I've most enjoyed as an AI person is it turns out when you work in AI, there are so many other teams that have data."},{"start":1838.56,"text":"And they could use our hope, right? So I feel like as an AI person, you know, I somehow bizarrely had the right to play in, you know, building autonomous helicopters or hoping companies, I don't know."}],"speech_gaps":[],"frame":"../frames/v060/011.webp","frame_time":1703.91},{"title":"深度学习的应用领域与数据需求","segments":[{"id":94,"text":"Place more relevant ads. Maybe not the most inspiring thing I've worked on, but certainly very lucrative for some companies. Or improve web search rankings. Or improve safety. Get rid of the kind of negative toxic results you may not want search results to come back on. Or improve e-commerce retelling. Or improve speech recognition. Or help ships be more fuel efficient. All these are real examples. Or fight fraud, which is actually really exciting when you're fighting financial fraud.","zh":"放置更多相关的广告。这可能不是我做过最令人振奋的事情，但对某些公司来说肯定非常有利可图。或者改进网页搜索排名。或者提高安全性。去除那些你不希望搜索结果出现的负面有毒结果。或者改进电子商务的推荐。或者改进语音识别。或者帮助船只更加省油。这些都是真实的例子。或者打击欺诈，当在打击金融欺诈时，这实际上是非常令人兴奋的。","start":1851.69,"end":1879.39},{"id":95,"text":"which is obviously a bad thing. But when you're fighting fraud, sometimes you wake up in the morning and your team's alerted you that there's a new scam, and then you just have to go and fight them and build algorithms in real time. And you know that every hour you take, more money actually leaks into the financial system. So it's kind of awful that there's financial fraud, but it's actually one of the most exhilarating things I've worked on because literally every hour you are slower.","zh":"这显然是件坏事。但当你在打击欺诈时，有时你早上醒来，团队就会通知你有新的诈骗行为，然后你只需要去对抗它们，并实时构建算法。你知道，你每花一个小时，实际上就有更多的钱流入金融系统。所以，虽然金融欺诈很糟糕，但这也可能是我做过最令人激动的事情之一，因为实际上你每慢一个小时，就有更多的钱流失。","start":1880.22,"end":1904.5},{"id":96,"text":"to, you know, formulate a response, you know more dollars are leaking out every hour. So anyway, so somehow when you have this tool set of deep learning, you just have a bewildering right to play or ability to play in a huge range of applications that could use your help, right? And I think on campus too.","zh":"当你需要制定回应时，你知道每个小时都有更多的钱流失。总之，当你拥有这个深度学习的工具集时，你就有惊人的权利或能力在大量应用中发挥作用，这些应用可能需要你的帮助，对吧？我认为在校园里也是如此。","start":1904.92,"end":1927.06},{"id":97,"text":"There's so many departments across campus in the sciences, engineering, humanities, business, that have interesting data where your skill set will let you, if you choose, collaborate with them to do interesting projects. And I find, for example, bizarrely, some of my PhD students are working on climate science. It's like, what do I know about climate science? I wish I knew more. But using machine learning tools,","zh":"校园里各个部门，包括科学、工程、人文和商业领域，都有有趣的数据，你的技能集让你可以选择与他们合作，进行有趣的项目。例如，我惊讶地发现，我的一些博士生正在研究气候科学。这让我想到，我对气候科学了解多少？我希望我了解更多。但使用机器学习工具，","start":1927.59,"end":1956.29},{"id":98,"text":"We could actually work on climate m
