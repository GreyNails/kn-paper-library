e two errors are."},{"id":201,"text":"Some of those errors, as we'll talk about in just one second,"},{"id":202,"text":"are intrinsic to the test set."},{"id":203,"text":"There are some things that you just can't do better than"},{"id":204,"text":"because your test set has measurement error."},{"id":205,"text":"there. That will fall out from the analysis we do here. But there's no way that the training"},{"id":206,"text":"set, it's not like we want the training set to be random. This is the model. The model"},{"id":207,"text":"is that the data is produced according to a random process, and that's what we're analyzing."}],"notes":["本段讨论了机器学习中数据集划分和模型构建的基本概念，特别是关于噪声（epsilon）的引入及其在训练集和测试集中的作用。讲者强调了epsilon作为模型中引入的随机噪声，用于模拟数据生成过程中的测量误差，这在实际应用中是不可避免的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1703.28,"end":1865.42,"asr_flags":[],"raw_segments":[{"start":1703.28,"text":"its variance, all the rest of it. So I'm saying it's a complicated variable. In contrast,"},{"start":1707.44,"text":"Epsilon, just a normal random variable. We know almost everything about it by assumption. That"},{"start":1711.6,"text":"was the contrast I was making. Please. So Epsilon is going to be, again, great question. So what is"},{"start":1719.88,"text":"Epsilon? Epsilon is going to be this character right here, which is the noise that's introduced"},{"start":1724.04,"text":"on every point. So the way we set up our model is all data is generated according to this process."},{"start":1729.04,"text":"Both train and test are generated with this process. And that Epsilon happens to be the"},{"start":1732.84,"text":"Epsilon that I picked for that test point. Yeah, wonderful question."},{"start":1737.44,"text":"So why do you need this symmetry and not like epsilon?"},{"start":1739.72,"text":"Why can't you just run inference without error?"},{"start":1742.4,"text":"So you could."},{"start":1743.9,"text":"I mean, you could just set this to 0 if you wanted,"},{"start":1745.96,"text":"but then you would have a less expressive model."},{"start":1747.82,"text":"But that's also the other bit that we've talked about here"},{"start":1749.84,"text":"is you don't get rid of measurement error at test time."},{"start":1752.74,"text":"So the point that was like, what does epsilon actually capture?"},{"start":1755.82,"text":"If you had something that captured absolutely"},{"start":1757.9,"text":"every element of your domain, then"},{"start":1759.72,"text":"it would be appropriate to set epsilon equal to 0."},{"start":1761.86,"text":"But if you have any of the settings"},{"start":1763.36,"text":"that we've talked about, you have measurement error"},{"start":1764.94,"text":"in a sensor, or you have some bit"},{"start":1766.78,"text":"of little bias that's done or some lag in the measurement whatever it is all those things are"},{"start":1771.34,"text":"kind of generally thrown into there's some amount of measurement error or loss then and that's why"},{"start":1775.46,"text":"we set this up and so having these two processes be the same and have the same amount of errors"},{"start":1780.52,"text":"um you know you don't strictly speaking need to do it but it certainly makes things a lot easier"},{"start":1785.46,"text":"but you i would say the part that i would object to is the test data is also messy it's not some"},{"start":1791.28,"text":"things you want to do and if you want to figure out what happens when epsilon goes to zero just"},{"start":1794.68,"text":"Just set the variance to 0 in the next thing."},{"start":1796.52,"text":"It will fall out pretty cleanly."},{"start":1798.84,"text":"Please."},{"start":1800.24,"text":"similar, like,"},{"start":1802.22,"text":"why do we need epsilon to be having this boundary"},{"start":1806.38,"text":"?"},{"start":1808.4,"text":"Or is that not represented?"},{"start":1810.36,"text":"Yeah, wonderful question."},{"start":1811.38,"text":"So the question is, why do we have two sources of randomness"},{"start":1813.98,"text":"here, and what are they doing?"},{"start":1815.48,"text":"One is about selecting the points, the endpoints"},{"start":1818.04,"text":"that we're going to train on."},{"start":1819.36,"text":"That is one bit of randomness that we're going to analyze."},{"start":1821.84,"text":"Those points are brought in."},{"start":1822.94,"text":"They have the Xs and the Ys and all that data that's there."},{"start":1826.8,"text":"And then we're going to train on that point."},{"start":1828.3,"text":"The reason, conceptually, we want to then have a test error,"},{"start":1830.88,"text":"which is at test time, we've selected a new point."},{"start":1832.72,"text":"And that point also has errors."},{"start":1834.36,"text":"We want to be clear that there are things going on at train set and test set that are different."},{"start":1838.7,"text":"And that, in fact, when we look across them,"},{"start":1841.48,"text":"we want to understand what the effects of those two errors are."},{"start":1844.28,"text":"Some of those errors, as we'll talk about in just one second,"},{"start":1846.78,"text":"are intrinsic to the test set."},{"start":1848.4,"text":"There are some things that you just can't do better than"},{"start":1850.64,"text":"because your test set has measurement error."},{"start":1852.46,"text":"there. That will fall out from the analysis we do here. But there's no way that the training"},{"start":1856.4,"text":"set, it's not like we want the training set to be random. This is the model. The model"},{"start":1861.06,"text":"is that the data is produced according to a random process, and that's what we're analyzing."}],"speech_gaps":[],"frame":"../frames/v047/011.webp","frame_time":1715.28},{"title":"数据集划分与机器学习建议","segments":[{"id":208,"text":"So it's not something where we're saying, oh, we have some randomness, so we're good. It's just this is the way we've modeled the universe. This is the standard model that we've talked about in the course. And this is to capture, this epsilon is to capture different sources of errors. Some of those errors are measurement time. You can think about, maybe most cleanly, as measurement at train set."},{"id":209,"text":"and some of those are at test set. The test set randomness also buries this fact that by selecting a subset of points, that complicated training procedure that we're running could fit them. So imagine I had an extremely bad draw from S, just to think about why forgetting. Imagine epsilon is 0. If I just picked the same point again and again and again, I couldn't fit a line."},{"id":210,"text":"Even the simplest model, right? I would just have that one point. So clearly something interesting has to happen inside X. I have to get enough data to be able to fit my model. So my point is that's what's going on inside the training set underneath the covers. Great questions. Are there more? Please keep asking. All right. All right. So let's expand. So when we do this here, what we've done is we've substituted out at Y and we've looked at the squares."},{"id":211,"text":"And when we look at the squares, we see two things. One is we see this term that comes out when we expand the squares as sigma squared. This is exactly that test error we were just talking about. This is the error that's intrinsic inside. I think it's the next one. This is the unavoidable error. So this is the error that's just in the data. If you collected the data with perfect measurement and accuracy,"},{"id":212,"text":"This could be zero. If it has any error in how you've measured it, or it's lagged, or whatever else you're measuring, this is just the error that's going to be completely unavoidable. And that's coming from this term here. The second error here, if you look, let's look at this. The last term is going to be zero. Now, why is the last term zero? That's because epsilon is mean zero, and it's independent from H of S."},{"id":213,"text":"So the test error, when we do this decomposition, that error selection, whatever epsilon's value is, doesn't depend in any way on the training points. So those two are going to be zero, and that's going to cancel a cross term. And now we are looking at how far away is the true model from the one we train on an expected S. We're going to decompose that further. So it's basically sigma squared, this noise, plus the expected prediction gap between H star and S. And so if you wanted to set sigma equal to zero, well,"}],"notes":["本段讨论了机器学习中误差的来源，包括训练集和测试集的随机性。误差被分为三类：测量误差、模型拟合误差和数据固有误差。测量误差是由于数据收集过程中的不准确，而模型拟合误差是由于训练过程对数据的拟合能力不足。数据固有误差是无法避免的，即使数据完全准确，仍然存在误差。","讲者通过一个例子说明了为什么需要足够的数据来拟合模型。如果数据集中的点过于集中，模型可能无法正确拟合，因此需要足够的数据来捕捉数据的分布特征。","在讨论误差分解时，讲者提到测试误差可以分解为噪声项和模型预测误差。噪声项是数据固有的误差，而模型预测误差是由于模型与真实模型之间的差距。","讲者进一步解释了为什么最后一个项为零，因为误差项ε的均值为零，并且与模型H(S)独立。这说明测试误差与训练数据无关，因此可以独立分析。","最后，讲者提到测试误差可以分解为噪声项和模型预测误差，并指出如果噪声项为零，那么测试误差完全由模型预测误差决定。","整个段落强调了误差分解的重要性，以及如何通过分析不同误差来源来改进模型性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1867.66,"end":2017.67,"asr_flags":[],"math_clarifications":["测试误差通常分解为噪声和模型偏差（或方差）的总和，而不是三者之和。原始公式中的三者之和是不准确的，因此需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1867.66,"text":"So it's not something where we're saying, oh, we have some randomness, so we're good. It's just this is the way we've modeled the universe. This is the standard model that we've talked about in the course. And this is to capture, this epsilon is to capture different sources of errors. Some of those errors are measurement time. You can think about, maybe most cleanly, as measurement at train set."},{"start":1886.96,"text":"and some of those are at test set. The test set randomness also buries this fact that by selecting a subset of points, that complicated training procedure that we're running could fit them. So imagine I had an extremely bad draw from S, just to think about why forgetting. Imagine epsilon is 0. If I just picked the same point again and again and again, I couldn't fit a line."},{"start":1908.08,"text":"Even the simplest model, right? I would just have that one point. So clearly something interesting has to happen inside X. I have to get enough data to be able to fit my model. So my point is that's what's going on inside the training set underneath the covers. Great questions. Are there more? Please keep asking. All right. All right. So let's expand. So when we do this here, what we've done is we've substituted out at Y and we've looked at the squares."},{"start":1939.18,"text":"And when we look at the squares, we see two things. One is we see this term that comes out when we expand the squares as sigma squared. This is exactly that test error we were just talking about. This is the error that's intrinsic inside. I think it's the next one. This is the unavoidable error. So this is the error that's just in the data. If you collected the data with perfect measurement and accuracy,"},{"start":1961.66,"text":"This could be zero. If it has any error in how you've measured it, or it's lagged, or whatever else you're measuring, this is just the error that's going to be completely unavoidable. And that's coming from this term here. The second error here, if you look, let's look at this. The last term is going to be zero. Now, why is the last term zero? That's because epsilon is mean zero, and it's independent from H of S."},{"start":1988.57,"text":"So the test error, when we do this decomposition, that error selection, whatever epsilon's value is, doesn't depend in any way on the training points. So those two are going to be zero, and that's going to cancel a cross term. And now we are looking at how far away is the true model from the one we train on an expected S. We're going to decompose that further. So it's basically sigma squared, this noise, plus the expected prediction gap between H star and S. And so if you wanted to set sigma equal to zero, well,"}],"speech_gaps":[],"frame":"../frames/v047/012.webp","frame_time":1879.66},{"title":"数据集划分与机器学习建议","segments":[{"id":214,"text":"You would have this guy 0 and this guy 0 anyway. But this would be the new term that you would have. So now we're going to analyze this. All right. So we're going to define the long-run average prediction at x in the following way. We're going to think about, and this is what I said, we have one property of the random variable. h of average of x is going to be exactly this variable underneath the covers. And what it's going to do is it's going to sample some s, say that it's going to sample conceptually all the data sets of size 1,000. And then it's going to fit."},{"id":215,"text":"the hypothesis and we're going to worry about what that average hypothesis averaged all the datasets would actually be. I want to emphasize, this is a very complicated random variable. We just need to know that it exists. We're going to write h bar as h average here and h of s of x in this way. This is going to allow us to write this decomposition here."},{"id":216,"text":"inside the square. So we're going to take H star and we're going to look at the long run average version and we're going to look at H bar versus H . The reason we do that decomposition is this term here is going to be zero because this is the expected value of this guy under S. So this is equal to zero. This is just definitional."},{"id":217,"text":"Now, that leaves us with the fairly famous set of terms, bias and variance. And these are related exactly to what we talked about before. This is a mathematically precise way to say if h bar is away from the long-run average of what you would train, no matter which h you pick, whatever it is, there's just no matter the amount of data you feed me, I'm going to have bias. That's what this term is, this bias squared. This term variance, this depends on the long-run average."},{"id":218,"text":"and only the h of s I've picked, the data set I've picked. This is the part that's jumping around as I go from higher to higher degree polynomials. This basically says, this is how I can think about the errors. I look at this error and I have a noise term, a bias term, and a variance term."},{"id":219,"text":"And all the errors break down. And this decomposition is quite powerful to think about how we're going to do this because how can we reduce each one of them? Well, we motivated it in the setting where we had just polynomials. But now this applies to almost every prediction class. It's a large class of functions. So the bias is how far the average prediction is from the truth. And that's a property of the model class. But the sample that we pick from training doesn't enter in anywhere. That's just like you can't fit a parabola with a line."}],"notes":["本段讲解了机器学习中误差分解的概念，即误差可以分解为偏差（bias）和方差（variance）以及噪声（noise）三个部分。偏差是指平均预测值与真实值之间的差距，而方差是指预测值在不同数据集上的波动程度。噪声则是数据本身的随机性。这种分解有助于理解模型的性能，并指导如何优化模型。","讲者强调，偏差是模型类别的属性，与训练数据无关。这意味着，即使使用不同的训练数据集，偏差仍然存在。而方差则依赖于所选的模型和数据集，因此可以通过调整模型复杂度或增加数据量来减少方差。","讲者提到，这种误差分解适用于几乎所有的预测类，而不仅仅是多项式回归。这表明，误差分解是一种通用的分析工具，可以用于评估和改进各种机器学习模型。","讲者指出，偏差和方差的平衡是模型选择的关键。如果模型过于简单，偏差会很高；如果模型过于复杂，方差会很高。因此，需要在偏差和方差之间找到一个合适的平衡点。","讲者通过多项式回归的例子说明了偏差和方差的概念。例如，使用高次多项式可能会导致方差过高，而使用低次多项式可能会导致偏差过高。","最后，讲者指出，误差分解可以帮助我们理解模型的性能，并指导如何改进模型。例如，可以通过增加数据量来减少方差，或者通过调整模型复杂度来减少偏差。"],"formulas":[],"uncertainties":["h of average of x"],"diagram":"none","start":2018.4,"end":2183.96,"asr_flags":[],"math_clarifications":["原始片段中未提供足够的数学公式或上下文来验证这些公式，因此无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":2018.4,"text":"You would have this guy 0 and this guy 0 anyway. But this would be the new term that you would have. So now we're going to analyze this. All right. So we're going to define the long-run average prediction at x in the following way. We're going to think about, and this is what I said, we have one property of the random variable. h of average of x is going to be exactly this variable underneath the covers. And what it's going to do is it's going to sample some s, say that it's going to sample conceptually all the data sets of size 1,000. And then it's going to fit."},{"start":2050.72,"text":"the hypothesis and we're going to worry about what that average hypothesis averaged all the datasets would actually be. I want to emphasize, this is a very complicated random variable. We just need to know that it exists. We're going to write h bar as h average here and h of s of x in this way. This is going to allow us to write this decomposition here."},{"start":2081.02,"text":"inside the square. So we're going to take H star and we're going to look at the long run average version and we're going to look at H bar versus H . The reason we do that decomposition is this term here is going to be zero because this is the expected value of this guy under S. So this is equal to zero. This is just definitional."},{"start":2107.38,"text":"Now, that leaves us with the fairly famous set of terms, bias and variance. And these are related exactly to what we talked about before. This is a mathematically precise way to say if h bar is away from the long-run average of what you would train, no matter which h you pick, whatever it is, there's just no matter the amount of data you feed me, I'm going to have bias. That's what this term is, this bias squared. This term variance, this depends on the long-run average."},{"start":2136.53,"text":"and only the h of s I've picked, the data set I've picked. This is the part that's jumping around as I go from higher to higher degree polynomials. This basically says, this is how I can think about the errors. I look at this error and I have a noise term, a bias term, and a variance term."},{"start":2157.46,"text":"And all the errors break down. And this decomposition is quite powerful to think about how we're going to do this because how can we reduce each one of them? Well, we motivated it in the setting where we had just polynomials. But now this applies to almost every prediction class. It's a large class of functions. So the bias is how far the average prediction is from the truth. And that's a property of the model class. But the sample that we pick from training doesn't enter in anywhere. That's just like you can't fit a parabola with a lie."}],"speech_gaps":[],"frame":"../frames/v047/013.webp","frame_time":2030.4},{"title":"数据集划分与机器学习建议","segments":[{"id":220,"text":"That's intuitively what's going on in that term. The variance is how much the prediction jumps around. Maybe you have a super expressive model, but it's not stable. And we're going to look at terms to reduce that variance later. So one approach would be you could take a small model, fit it if it fails, fit a larger model, fit a larger model, and do that. The other is, and we'll talk about later, you could fit a large model and somehow regularize it, which means reduce its variance, as we'll see in a second."},{"id":221,"text":"so that it doesn't jump around so much. And that should intuitively make the models better. And better means they generalize better at test time. That's what we care about. So this error goes down. Please. The analysis we're doing is just for regressors, right? Right. So the analysis that we did here is just for regressors. This is the standard presentation of it. What I asserted without proof is that effectively the same decomposition"},{"id":222,"text":"holds when you do things like classification or other models. And the reason I show this to you is this is like canon for machine learning. You will constantly hear people talk about, if you read papers or other things, bias-variance decomposition or a bias-variance result. And it basically is separating out the two effects, one effect that's based on the model class and one effect that's based on how the sample was for the data. And this kind of decomposition happens everywhere. We happen to do it just for regression."},{"id":223,"text":"just for L2 regression, with a normal added is all we did. Please."},{"id":224,"text":"If you think about it, it makes your head hurt a little bit. So it is not the average"},{"id":225,"text":"of all the S necessarily. It should be if they're consistent, but it's not necessarily the same."},{"id":226,"text":"Here what it formally is, is imagine S is a random variable that says"},{"id":227,"text":"a sample from this population that has a million points."},{"id":228,"text":"It is the expected value over all the possible million points"},{"id":229,"text":"that you could get and the weight of each one of those"},{"id":230,"text":"sets."},{"id":231,"text":"It's a very complicated object."},{"id":232,"text":"It is not the take all of the data and fit it."},{"id":233,"text":"It's possible those estimates are the same,"},{"id":234,"text":"but not uniform."},{"id":235,"text":"That's called consistency."},{"id":236,"text":"When you're doing a linear model and the data's"},{"id":237,"text":"very quadratic, it is super odd."},{"id":238,"text":"There are averages that are saying that you'll buy it."},{"id":239,"text":"It's super high variance."},{"id":240,"text":"Yeah, so the variance that you get here"},{"id":241,"text":"is across training sets so if your data were quadratic underneath the covers and you were"},{"id":242,"text":"fitting it with a linear model then no matter what underneath every time you sampled from that model"},{"id":243,"text":"there would always be some bend in your data of the same shape just with a little bit of noise"},{"id":244,"text":"in that case your long run average would be like some line that goes just through the model you can"},{"id":245,"text":"actually see that it will it will actually be if your if your model is ax squared bx plus c"},{"id":246,"text":"it's actually going to be just the bx plus c term okay plus a constant which is called the offset"},{"id":247,"text":"depending on how you do it. So that term right there is going to be the best you can do. And"},{"id":248,"text":"so you're always just going to fit that very, very simple line underneath the covers."},{"id":249,"text":"The jumping around will happen if you have a model that's too expressive,"}],"notes":["本段讨论了模型的方差问题，即预测值在不同训练集上的波动情况。模型的方差越高，预测结果越不稳定。课程提到，可以通过使用较小的模型、逐步增加模型规模或对大模型进行正则化来减少方差。正则化是通过降低模型的方差来提高泛化能力的一种方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2184.92,"end":2362.99,"asr_flags":[],"raw_segments":[{"start":2184.92,"text":"That's intuitively what's going on in that term. The variance is how much the prediction jumps around. Maybe you have a super expressive model, but it's not stable. And we're going to look at terms to reduce that variance later. So one approach would be you could take a small model, fit it if it fails, fit a larger model, fit a larger model, and do that. The other is, and we'll talk about later, you could fit a large model and somehow regularize it, which means reduce its variance, as we'll see in a second."},{"start":2212.83,"text":"so that it doesn't jump around so much. And that should intuitively make the models better. And better means they generalize better at test time. That's what we care about. So this error goes down. Please. The analysis we're doing is just for regressors, right? Right. So the analysis that we did here is just for regressors. This is the standard presentation of it. What I asserted without proof is that effectively the same decomposition"},{"start":2237.92,"text":"holds when you do things like classification or other models. And the reason I show this to you is this is like canon for machine learning. You will constantly hear people talk about, if you read papers or other things, bias-variance decomposition or a bias-variance result. And it basically is separating out the two effects, one effect that's based on the model class and one effect that's based on how the sample was for the data. And this kind of decomposition happens everywhere. We happen to do it just for regression."},{"start":2264.19,"text":"just for L2 regression, with a normal added is all we did. Please."},{"start":2274.31,"text":"If you think about it, it makes your head hurt a little bit. So it is not the average"},{"start":2281.49,"text":"of all the S necessarily. It should be if they're consistent, but it's not necessarily the same."},{"start":2286.17,"text":"Here what it formally is, is imagine S is a random variable that says"},{"start":2290.11,"text":"a sample from this population that has a million points."},{"start":2294.19,"text":"It is the expected value over all the possible million points"},{"start":2297.65,"text":"that you could get and the weight of each one of those"},{"start":2300.61,"text":"sets."},{"start":2301.15,"text":"It's a very complicated object."},{"start":2303.01,"text":"It is not the take all of the data and fit it."},{"start":2306.51,"text":"It's possible those estimates are the same,"},{"start":2308.29,"text":"but not uniform."},{"start":2309.47,"text":"That's called consistency."},{"start":2310.85,"text":"When you're doing a linear model and the data's"},{"start":2313.69,"text":"very quadratic, it is super odd."},{"start":2315.87,"text":"There are averages that are saying that you'll buy it."},{"start":2319.85,"text":"It's super high variance."},{"start":2321.69,"text":"Yeah, so the variance that you get here"},{"start":2323.45,"text":"is across training sets so if your data were quadratic underneath the covers and you were"},{"start":2327.37,"text":"fitting it with a linear model then no matter what underneath every time you sampled from that model"},{"start":2332.03,"text":"there would always be some bend in your data of the same shape just with a little bit of noise"},{"start":2336.05,"text":"in that case your long run average would be like some line that goes just through the model you can"},{"start":2341.39,"text":"actually see that it will it will actually be if your if your model is ax squared bx plus c"},{"start":2346.49,"text":"it's actually going to be just the bx plus c term okay plus a constant which is called the offset"},{"start":2351.25,"text":"depending on how you do it. So that term right there is going to be the best you can do. And"},{"start":2355.31,"text":"so you're always just going to fit that very, very simple line underneath the covers."},{"start":2359.93,"text":"The jumping around will happen if you have a model that's too expressive,"}],"speech_gaps":[],"frame":"../frames/v047/014.webp","frame_time":2196.92},{"title":"数据集划分与机器学习建议","segments":[{"id":250,"text":"where because the noise is coming, each different sample you get from S,"},{"id":251,"text":"it's picking a different iteration. And so this variance is going to be higher."},{"id":252,"text":"That's what's going on. Please."},{"id":253,"text":"the question is why is the average predictor kind of the best you could do or is a good surrogate"},{"id":254,"text":"well the best you can do of course is h star right so it's not the best you could do in that sense"},{"id":255,"text":"what's going on here though is we're analyzing if you gave me a model class and you train that"},{"id":256,"text":"that model class, what would you get?"},{"id":257,"text":"And so what you're proposing is a different model class."},{"id":258,"text":"And in that model class, there is a new H star,"},{"id":259,"text":"or H bar, which may indeed be closer to H star"},{"id":260,"text":"over the expected value of all the places"},{"id":261,"text":"that it's going to be evaluated on this new text point."},{"id":262,"text":"And that would be a good thing to do,"},{"id":263,"text":"but that's how the abstraction works."},{"id":264,"text":"You give me the model class,"},{"id":265,"text":"we look at the long-running average."},{"id":266,"text":"Now, if you say, I have a different procedure that I'd like to"},{"id":267,"text":"run to be able to create that model class,"},{"id":268,"text":"like I'm going to pick a different h as I train,"},{"id":269,"text":"that also is a different model class."},{"id":270,"text":"That's called regularization."},{"id":271,"text":"That's one example of regularization."},{"id":272,"text":"We're going to see that exactly next."},{"id":273,"text":"It could have an effect on the bias,"},{"id":274,"text":"but primarily it's designed to reduce the variance."},{"id":275,"text":"It does have an effect that you'll see ridge regression where actually you trade a small"},{"id":276,"text":"amount of additional bias usually for a large reduction in variance. That's the usual way the"},{"id":277,"text":"trade works. I don't mean to be mysterious about it. That's usually what it is. You trade a little"},{"id":278,"text":"bit of bias for a big variance reduction. We've gone over these pieces before. I'm going to go"},{"id":279,"text":"through them all right so decomposition hands us the next two topics that we're going to look at"},{"id":280,"text":"we the combined effect of bias and variance this was an earlier wonderful point"},{"id":281,"text":"can be measured empirically with a dev or a holdout set what is a dev or a holdout set well"},{"id":282,"text":"what i could do is i could have a training set i could have a test set that i'm eventually going"},{"id":283,"text":"to test on and i could have some kind of random additional sample of my data set that i use just"},{"id":284,"text":"just for parameter tuning, fitting, testing fits,"},{"id":285,"text":"trying out procedures."},{"id":286,"text":"That set is called a holdout or a dev set."},{"id":287,"text":"And you can see that there."},{"id":288,"text":"It's separate from training, and it can estimate the test error"},{"id":289,"text":"locally."},{"id":290,"text":"So you don't have to spoil your test set. Statistical-minded people are very worried about spoiling their test set. So one thing that you could worry about if you're a statistician is, oh my gosh, once you see the test set, all this information leaks through, and now you're going to be able to cheat in some interesting way and then validate the statistical sanctity of that set. We're going to come back and talk about, at least in one of the most major competitions in machine learning over a decade, that did not happen."}],"notes":["本段讨论了在数据集划分中，使用验证集（dev set）或保留集（holdout set）来评估模型性能的重要性。讲者指出，验证集用于参数调优和模型选择，而测试集用于最终评估，以防止信息泄露和过拟合。","讲者提到，如果在训练过程中使用测试集进行调整，会导致测试集被污染，从而影响模型评估的可靠性。统计学家对此非常关注，因为一旦看到测试集，可能会产生信息泄露，导致模型评估不准确。","讲者还提到，在机器学习竞赛中，这种测试集污染的问题并未发生，这表明在实际应用中，通过合理划分数据集可以有效避免这一问题。","讲者强调了数据集划分的必要性，即训练集用于模型训练，验证集用于调优，测试集用于最终评估，以确保模型的泛化能力。","讲者指出，验证集可以估计测试误差，但仅限于局部范围，因此需要合理划分数据集以确保评估的准确性。","讲者最后提到，数据集划分是机器学习中的重要步骤，有助于理解偏差和方差的综合影响，并为后续讨论奠定基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2363.07,"end":2529.02,"asr_flags":[253],"raw_segments":[{"start":2363.07,"text":"where because the noise is coming, each different sample you get from S,"},{"start":2366.49,"text":"it's picking a different iteration. And so this variance is going to be higher."},{"start":2370.89,"text":"That's what's going on. Please."},{"start":2379.63,"text":"the question is why is the average predictor kind of the best you could do or is a good surrogate"},{"start":2388.45,"text":"well the best you can do of course is h star right so it's not the best you could do in that sense"},{"start":2393.13,"text":"what's going on here though is we're analyzing if you gave me a model class and you train that"},{"start":2398.35,"text":"that model class, what would you get?"},{"start":2399.97,"text":"And so what you're proposing is a different model class."},{"start":2402.77,"text":"And in that model class, there is a new H star,"},{"start":2404.83,"text":"or H bar, which may indeed be closer to H star"},{"start":2407.45,"text":"over the expected value of all the places"},{"start":2409.89,"text":"that it's going to be evaluated on this new text point."},{"start":2412.65,"text":"And that would be a good thing to do,"},{"start":2413.91,"text":"but that's how the abstraction works."},{"start":2416.19,"text":"You give me the model class,"},{"start":2417.43,"text":"we look at the long-running average."},{"start":2419.19,"text":"Now, if you say, I have a different procedure that I'd like to"},{"start":2421.71,"text":"run to be able to create that model class,"},{"start":2423.51,"text":"like I'm going to pick a different h as I train,"},{"start":2426.07,"text":"that also is a different model class."},{"start":2427.87,"text":"That's called regularization."},{"start":2429.09,"text":"That's one example of regularization."},{"start":2430.65,"text":"We're going to see that exactly next."},{"start":2434.47,"text":"It could have an effect on the bias,"},{"start":2438.21,"text":"but primarily it's designed to reduce the variance."},{"start":2445.01,"text":"It does have an effect that you'll see ridge regression where actually you trade a small"},{"start":2448.79,"text":"amount of additional bias usually for a large reduction in variance. That's the usual way the"},{"start":2453.09,"text":"trade works. I don't mean to be mysterious about it. That's usually what it is. You trade a little"},{"start":2456.47,"text":"bit of bias for a big variance reduction. We've gone over these pieces before. I'm going to go"},{"start":2465.03,"text":"through them all right so decomposition hands us the next two topics that we're going to look at"},{"start":2471.59,"text":"we the combined effect of bias and variance this was an earlier wonderful point"},{"start":2475.99,"text":"can be measured empirically with a dev or a holdout set what is a dev or a holdout set well"},{"start":2481.15,"text":"what i could do is i could have a training set i could have a test set that i'm eventually going"},{"start":2485.89,"text":"to test on and i could have some kind of random additional sample of my data set that i use just"},{"start":2490.43,"text":"just for parameter tuning, fitting, testing fits,"},{"start":2493.61,"text":"trying out procedures."},{"start":2494.67,"text":"That set is called a holdout or a dev set."},{"start":2496.91,"text":"And you can see that there."},{"start":2498.73,"text":"It's separate from training, and it can estimate the test error"},{"start":2501.63,"text":"locally."},{"start":2503.98,"text":"So you don't have to spoil your test set. Statistical-minded people are very worried about spoiling their test set. So one thing that you could worry about if you're a statistician is, oh my gosh, once you see the test set, all this information leaks through, and now you're going to be able to cheat in some interesting way and then validate the statistical sanctity of that set. We're going to come back and talk about, at least in one of the most major competitions in machine learning over a decade, that did not happen."}],"speech_gaps":[{"start":2373.216,"end":2377.84}],"frame":"../frames/v047/015.webp","frame_time":2375.07},{"title":"正则化与偏差-方差权衡","segments":[{"id":291,"text":"That's called adaptive overfitting. But that's what statisticians are often worried about here. And it does happen, just not in this case. The variance is typically reduced by regularization. This is exactly what we just described at the cost of a little extra bias. We'll talk about exactly what regularization is in a second. And we're going to come back to this modern picture. All right, so what is regularization?"},{"id":292,"text":"So we want to reduce variance in training to get a more robust model. So this is going to be the procedure that's going to design to reduce variance. We're going to allow it to put in a little bit of bias, potentially to get a more stable model, because our error is going to be a sum of those terms, and the win is going to be bias goes up by a smaller amount, then variance comes down. Then we would consider regularization a win."},{"id":293,"text":"So it's general, it's used far beyond linear regression, like you use it in every industrial model in the world in some form or another. The goal for the next slide is to show you how to use this in a couple of concrete places. Clear enough what the mechanism is, we have those three terms. We're going to try and get lower test error, hopefully by reducing variance by more than we increase bias squared."},{"id":294,"text":"So it's general, it's used far beyond linear regression, like you use it in every industrial model in the world in some form or another. The goal for the next slide is to show you how to use this in a couple of concrete places. Clear enough what the mechanism is, we have those three terms. We're going to try and get lower test error, hopefully by reducing variance by more than we increase bias squared."},{"id":295,"text":"Let's look at least squares. This is going to be ridge regression. We're going to be able to derive an estimator here and see everything that happens underneath the covers. So ridge regression, sorry to skip, ridge regression here is your favorite least squares that you've done before."},{"id":296,"text":"And then we add in this new term here, this new penalty term for some row that's going to be greater than zero. And this was the thing I was mentioning. Oh, theta, you know, it's squares. It's not too big. We don't know exactly how big theta is because it's an unknown parameter that we're learning. We don't want to fix its value. But we know that it's kind of not too big. And if we start to make it really big, it's got to be worth it that it fits the data a lot better. Is the intuition for what this formula is kind of roughly saying clear? We're going to derive kind of what happens as a result of adding this term. Please."},{"id":297,"text":"Why do we care about the size of the coefficients and not the order? Yeah, great question. So the thing is, why do we care about this size rather than the order? It turns out that regularization is one of those things that you can put all kinds of different penalties on it. You could ask that it's sparse. You could say, look, I only want to have a sparse set of coefficients. Or I want to have something that's nearly sparse. Or I want to look at the squares of the coefficients because I think the norm should be small. Or I should look through some test statistic and do it as well."}],"notes":["本段讨论了正则化在机器学习中的作用，特别是如何通过引入惩罚项来减少模型的方差。讲者提到正则化是一种权衡偏差和方差的策略，允许模型引入一定的偏差以换取更稳定的预测结果。"],"formulas":[{"latex":"E[\\text{error}] = \\text{bias}^2 + \\text{variance} + \\text{irreducible error}","symbols":"误差期望等于偏差平方、方差和不可约误差之和","explanation":"公式正确表达了误差期望的分解，包含偏差平方、方差和不可约误差三项，符合统计学习理论中的基本概念。","evidence":"So we want to reduce variance in training to get a more robust model. So this is going to be the procedure that's going to design to reduce variance. We're going to allow it to put in a little bit of bias, potentially to get a more stable model, because our error is going to be a sum of those terms, and the win is going to be bias goes up by a smaller amount, then variance comes down. Then we would consider regularization a win."}],"uncertainties":["在296段中提到的'for some row'可能是指某个特定的行或参数，但具体含义不明确，需要进一步澄清。"],"diagram":"none","start":2529.7,"end":2695.02,"asr_flags":[],"math_clarifications":["公式中的各项符号和数学类型正确，无需进一步修正。"],"raw_segments":[{"start":2529.7,"text":"That's called adaptive overfitting. But that's what statisticians are often worried about here. And it does happen, just not in this case. The variance is typically reduced by regularization. This is exactly what we just described at the cost of a little extra bias. We'll talk about exactly what regularization is in a second. And we're going to come back to this modern picture. All right, so what is regularization?"},{"start":2554.47,"text":"So we want to reduce variance in training to get a more robust model. So this is going to be the procedure that's going to design to reduce variance. We're going to allow it to put in a little bit of bias, potentially to get a more stable model, because our error is going to be a sum of those terms, and the win is going to be bias goes up by a smaller amount, then variance comes down. Then we would consider regularization a win."},{"start":2575.01,"text":"So the Bayesian view is what we're really doing is encoding prior knowledge. Some people find that helpful. Some people find this frequentist way I'm describing helpful. Oh, it's just a trade-off of errors. Or maybe I know something like, I know I'm fitting a line that isn't too steep. I know my line should be kind of flattish. That would be a prior distribution. I would say thetas, if I look at the size of the theta i's, they just shouldn't be too big on average."},{"start":2598.34,"text":"So it's general, it's used far beyond linear regression, like you use it in every industrial model in the world in some form or another. The goal for the next slide is to show you how to use this in a couple of concrete places. Clear enough what the mechanism is, we have those three terms. We're going to try and get lower test error, hopefully by reducing variance by more than we increase bias squared."},{"start":2622.79,"text":"Let's look at least squares. This is going to be ridge regression. We're going to be able to derive an estimator here and see everything that happens underneath the covers. So ridge regression, sorry to skip, ridge regression here is your favorite least squares that you've done before."},{"start":2640.64,"text":"And then we add in this new term here, this new penalty term for some row that's going to be greater than zero. And this was the thing I was mentioning. Oh, theta, you know, it's squares. It's not too big. We don't know exactly how big theta is because it's an unknown parameter that we're learning. We don't want to fix its value. But we know that it's kind of not too big. And if we start to make it really big, it's got to be worth it that it fits the data a lot better. Is the intuition for what this formula is kind of roughly saying clear? We're going to derive kind of what happens as a result of adding this term. Please."},{"start":2669.98,"text":"Why do we care about the size of the coefficients and not the order? Yeah, great question. So the thing is, why do we care about this size rather than the order? It turns out that regularization is one of those things that you can put all kinds of different penalties on it. You could ask that it's sparse. You could say, look, I only want to have a sparse set of coefficients. Or I want to have something that's nearly sparse. Or I want to look at the squares of the coefficients because I think the norm should be small. Or I should look through some test statistic and do it as well."}],"speech_gaps":[],"frame":"../frames/v047/016.webp","frame_time":2541.7},{"title":"数据集划分与机器学习建议","segments":[{"id":298,"text":"Those are all different modeling choices that you'll have, so there's no one that's right or wrong. The reason we're going to use this one is the math is super clean, it will boil down to exactly something we can see in these squares. And this is one of the more common things, like if you go and download like a PyTorch model, one of the ways that you'll probably do uh"},{"id":299,"text":"regression or regularization is, you may use something called dropout or you may use something called weight decay. Both of them can be actually interpreted as adding a form of L2 regression on the weights. One of them, model shrinking in weights, actually induces exactly this behavior. And dropout, also a wonderful paper, I think Percy wrote that paper, about how dropout and regularization are the same. Please. Yeah, it's outside the sum. I mean, it would just change normalization."},{"id":300,"text":"All right, so if this is going to shrink theta toward the origin, so it just means we don't think it should be too big. It's kind of a soft penalty, okay? Now, if we set it to zero, this is plain, ordinary least squares. If we set it really, really large, there's a value at which basically predicting zero is kind of the best thing to do, right? Because if this thing is massive, as we get closer and closer to setting that to infinity, this one wants zero and this one, and stop caring about the test error. So clearly my point is that there's some sweet spot."},{"id":301,"text":"For rho, that's going to give us good error. It's going to shrink that theta. And it's going to still respect some of the error that we have over here. Clear enough? So this is just staying at 0. It's playing ordinary squares, which has the issues we talked about. When it gets very large, then theta gets closer and closer to 0 to satisfy this penalty."},{"id":302,"text":"All right. So a good balanced row balances the two. The right ratio depends on the data. They're really hard to know up front. So we fit row from data. And this is sometimes called hyperparameter optimization. We'll get to that if we have time at the end of this lecture. Effectively, what happens is you have some little dev set that you're developing on. You try various different models. You train on one set. You hold out. You test on another. And you see which row does better. And we'll talk about ways to do that in a more parameter efficient way, or sorry, compute efficient way, where you run fewer."},{"id":303,"text":"or trials to bake off the different rows that you have. And we'll also see ways to do this in a more data efficient way, where you don't have to throw away a lot of your data to be able to have a holdout set. The latter one's called cross-validation. The first one is what this algorithm hyperband does. So this row is a very strange parameter, how it affects things. So why do we penalize?"}],"notes":["本段讲解了机器学习中不同的建模选择，如正则化方法（如Dropout和Weight Decay），它们都可以被解释为在权重上添加L2回归。其中，权重收缩（model shrinking）会诱导这种行为，而Dropout则通过论文指出与正则化是相同的。"],"formulas":[{"latex":"L2 \\text{ 正则化: } \\text{惩罚项} = \\frac{\\rho}{2} \\theta^T \\theta","symbols":"ρ：正则化系数；θ：权重向量","explanation":"公式正确表达了L2正则化惩罚项的形式，其中ρ是正则化系数，θ是权重向量。公式中的符号和数学类型均符合标准，无需修改。","evidence":"All right, so if this is going to shrink theta toward the origin, so it just means we don't think it should be too big. It's kind of a soft penalty, okay? Now, if we set it to zero, this is plain, ordinary least squares. If we set it really, really large, there's a value at which basically predicting zero is kind of the best thing to do, right? Because if this thing is massive, as we get closer and closer to setting that to infinity, this one wants zero and this one, and stop caring about the test error. So clearly my point is that there's some sweet spot."}],"uncertainties":["row","balanced row","hyperband","rows","bake off","parameter efficient","compute efficient","data efficient"],"diagram":"none","start":2695.5,"end":2857.28,"asr_flags":[],"math_clarifications":["公式中的符号ρ和θ的中文说明已补充，以确保清晰性。"],"raw_segments":[{"start":2695.5,"text":"those are all different modeling choices that you'll have so there's no one that's right or wrong the reason we're going to use this one is the math is super clean it will boil down to exactly something we can see in these squares and this is one of the more common things like if you go and download like a pytorch model one of the ways that you'll probably do uh"},{"start":2713.28,"text":"regression or regularization is, you may use something called dropout or you may use something called weight decay. Both of them can be actually interpreted as adding a form of L2 regression on the weights. One of them, model shrinking in weights, actually induces exactly this behavior. And dropout, also a wonderful paper, I think Percy wrote that paper, about how dropout and regularization are the same. Please. Yeah, it's outside the sum. I mean, it would just change normalization."},{"start":2747.95,"text":"All right, so if this is going to shrink theta toward the origin, so it just means we don't think it should be too big. It's kind of a soft penalty, okay? Now, if we set it to zero, this is plain, ordinary least squares. If we set it really, really large, there's a value at which basically predicting zero is kind of the best thing to do, right? Because if this thing is massive, as we get closer and closer to setting that to infinity, this one wants zero and this one, and stop caring about the test error. So clearly my point is that there's some sweet spot."},{"start":2778.25,"text":"for rho, that's going to give us good error. It's going to shrink that theta. And it's going to still respect some of the error that we have over here. Clear enough? So this is just staying at 0. It's playing ordinarily squares, which has the issues we talked about. When it gets very large, then theta gets closer and closer to 0 to satisfy this penalty."},{"start":2803.65,"text":"All right. So a good balanced row balances the two. The right ratio depends on the data. They're really hard to know up front. So we fit row from data. And this is sometimes called hyperparameter optimization. We'll get to that if we have time at the end of this lecture. Effectively, what happens is you have some little dev set that you're developing on. You try various different models. You train on one set. You hold out. You test on another. And you see which row does better. And we'll talk about ways to do that in a more parameter efficient way, or sorry, compute efficient way, where you run fewer."},{"start":2832.98,"text":"or trials to bake off the different rows that you have. And we'll also see ways to do this in a more data efficient way, where you don't have to throw away a lot of your data to be able to have a holdout set. The latter one's called cross-validation. The first one is what this algorithm hyperband does. So this row is a very strange parameter, how it affects things. So why do we penalize?"}],"speech_gaps":[],"frame":"../frames/v047/017.webp","frame_time":2707.5},{"title":"数据集划分与机器学习建议","segments":[{"id":304,"text":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in R^d with n less than d, fewer samples and dimensions. So x^T x here is not full rank. So for any theta we train and any v in the null space of x, this equation holds. That is, x times v is equal to 0. And so they give exactly the same predictions."},{"id":305,"text":"So the question in the underdetermined case is, which of theta among all of these should we pick? And intuitively, there are infinitely many of these optimal thetas. We can pick any one of them. What we're going to pick here is, when we add this in, is we're going to pay if we have any additional component that's"},{"id":306,"text":"something we don't need that's perpendicular to what we care about. So any v that's in the space, that's in this null space, we're going to pay by v squared. Is this decomposition clear? If you take two vectors that are orthogonal, their least squares sums break apart like this. This is just the inner product expansion. Not clear, please ask me a question. But the point is that penalizing this implicitly without knowing the direction,"},{"id":307,"text":"It says, shrink theta 0 a little bit. That's in the space I care about. But really penalize v. If you're doing an optimal procedure, it gets nothing out of v. It doesn't change the prediction. It will kind of set that to 0. Does that make sense? So is it clear why it's going to reduce the space of what we're after? Because v is going to go to 0. We're going to basically, everything that's in the null space, which is v, is going to get pressured to go to 0."},{"id":308,"text":"So another way to say this is that the penalty is trying to force us to pick what's called the minimum norm solution. So when we do those other methods of regularization, you could wonder, is setting the norm of the weights also doing a form of least squares regularization? Yeah, they all are. They're doing this sort of nice kind of smooth regularization to try and get out the tie. All right. So what happened there? When we did the solution, recall these solutions. If we make rho greater than 0,"},{"id":309,"text":"This is the equation for theta. Is it clear why? Let's look back to make sure. I don't know if I derived it properly. If we look, sorry to go back. Oops. If we look here, this character is nothing more than rho i rho, right? And so when I do the derivative, sorry, when I do this derivative, I get exactly back this least squares cost, rho i."},{"id":310,"text":"This is one of the reasons least squares is so nice with this ridge penalty,"},{"id":311,"text":"is that just that rho falls immediately inside."},{"id":312,"text":"How do I get that?"},{"id":313,"text":"Just take the derivative."},{"id":314,"text":"Take the derivative, you're going to get a theta that's there,"},{"id":315,"text":"so it's going to be theta rho i, right?"},{"id":316,"text":"Boom, you move it across."},{"id":317,"text":"If not clear, I'm happy to take two seconds to derive it."},{"id":318,"text":"All right."}],"notes":["本段讨论了在欠定情况下，如何选择最优的θ。由于存在无限多个最优解，选择最小范数解是常见的做法。通过惩罚向量v（属于零空间），可以减少模型的复杂度，同时保持预测结果不变。","在最小二乘法中，通过引入正则化项（如岭回归），可以实现对θ的约束。这种约束本质上是通过惩罚向量v的范数，从而减少模型的过拟合风险。","在正则化过程中，通过求导可以得到θ的表达式。这表明，正则化项的引入使得优化问题转化为一个带有惩罚项的最小二乘问题。","在欠定情况下，模型的解空间是无限的，因此需要通过某种方式选择最优解。最小范数解是其中一种常见选择，它通过惩罚向量v的范数来实现。","通过正则化项的引入，可以将优化问题转化为一个带有惩罚项的最小二乘问题。这种做法在机器学习中被广泛使用，因为它能够有效控制模型的复杂度。","在正则化过程中，通过求导可以得到θ的表达式。这表明，正则化项的引入使得优化问题转化为一个带有惩罚项的最小二乘问题。"],"formulas":[{"latex":"x^T x","symbols":"x的转置乘以x","explanation":"公式正确，表示向量x的转置与x的乘积，用于计算其平方范数。","evidence":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in nd with n less than d, fewer samples and dimensions. So xtx here is not full rank. So for any theta we train and any v in the null space of x, this equation holds. That is, x times v is equal to 0. And so they give exactly the same predictions."},{"latex":"x v = 0","symbols":"x乘以v等于0","explanation":"公式正确，表示向量v在x的零空间中，即x乘以v等于零向量。","evidence":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in nd with n less than d, fewer samples and dimensions. So xtx here i oing to get a theta that's there, so it's going to be theta rho i, right? Boom, you move it across. If not clear, I'm happy to take two seconds to derive it."}],"uncertainties":["rho i rho","theta rho i"],"diagram":"none","start":2858.17,"end":3036.69,"asr_flags":[],"math_clarifications":["公式中的符号和数学表达均符合标准线性代数和统计学惯例，无需进一步修正。"],"raw_segments":[{"start":2858.17,"text":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in nd with n less than d, fewer samples and dimensions. So xtx here is not full rank. So for any theta we train and any v in the null space of x, this equation holds. That is, x times v is equal to 0. And so they give exactly the same predictions."},{"start":2888.32,"text":"So the question in the underdetermined case is, which of theta among all of these should we pick? And intuitively, there are infinitely many of these optimal thetas. We can pick any one of them. What we're going to pick here is, when we add this in, is we're going to pay if we have any additional component that's"},{"start":2907.71,"text":"something we don't need that's perpendicular to what we care about. So any v that's in the space, that's in this null space, we're going to pay by v squared. Is this decomposition clear? If you take two vectors that are orthogonal, their least squares sums break apart like this. This is just the inner product expansion. Not clear, please ask me a question. But the point is that penalizing this implicitly without knowing the direction,"},{"start":2933.1,"text":"It says, shrink theta 0 a little bit. That's in the space I care about. But really penalize v. If you're doing an optimal procedure, it gets nothing out of v. It doesn't change the prediction. It will kind of set that to 0. Does that make sense? So is it clear why it's going to reduce the space of what we're after? Because v is going to go to 0. We're going to basically, everything that's in the null space, which is v, is going to get pressured to go to 0."},{"start":2963.11,"text":"So another way to say this is that the penalty is trying to force us to pick what's called the minimum norm solution. So when we do those other methods of regularization, you could wonder, is setting the norm of the weights also doing a form of least squares regularization? Yeah, they all are. They're doing this sort of nice kind of smooth regularization to try and get out the tie. All right. So what happened there? When we did the solution, recall these solutions. If we make rho greater than 0,"},{"start":2992.6,"text":"This is the equation for theta. Is it clear why? Let's look back to make sure. I don't know if I derived it properly. If we look, sorry to go back. Oops. If we look here, this character is nothing more than rho i rho, right? And so when I do the derivative, sorry, when I do this derivative, I get exactly back this least squares cost, rho i."},{"start":3016.39,"text":"This is one of the reasons least squares is so nice with this ridge penalty,"},{"start":3019.97,"text":"is that just that rho falls immediately inside."},{"start":3022.77,"text":"How do I get that?"},{"start":3023.79,"text":"Just take the derivative."},{"start":3024.89,"text":"Take the derivative, you're going to get a theta that's there,"},{"start":3026.95,"text":"so it's going to be theta rho i, right?"},{"start":3029.09,"text":"Boom, you move it across."},{"start":3030.45,"text":"If not clear, I'm happy to take two seconds to derive it."},{"start":3035.97,"text":"All right."}],"speech_gaps":[],"frame":"../frames/v047/018.webp","frame_time":2870.17},{"title":"数据集划分与机器学习建议","segments":[{"id":319,"text":"So now when the inverse exists,"},{"id":320,"text":"if lambda 1, lambda 2, and lambda d are all the eigenvalues"},{"id":321,"text":"of the dimensions that we have, the eigenvalues of this thing are all shifted by a constant rho."},{"id":322,"text":"This is the bias, right? We're shifting this thing in some direction, but the advantage we get is now"},{"id":323,"text":"this is full rank. Why doesn't one of these things end up equaling zero if rho is nonzero? What"},{"id":324,"text":"What property are we using?"},{"id":325,"text":"We're using the thought that xtx is positive semidefinite."},{"id":326,"text":"And so what that means is all of these lambda i's, great point,"},{"id":327,"text":"all these lambda i's are greater than or equal to 0."},{"id":328,"text":"And so when this thing can't introduce some extra element"},{"id":329,"text":"of the null space because this is a non-negative number"},{"id":330,"text":"plus a strictly positive number, that"},{"id":331,"text":"means this is going to be strictly positive."},{"id":332,"text":"Cool."},{"id":333,"text":"All right. All right. If you care, I derived it and put it in the appendix. The pseudo-inverse,"},{"id":334,"text":"what happens there, the Penrose pseudo-inverse, if you care what that is, that's another procedure"},{"id":335,"text":"to solve this equation. It also is a form of regularization. What it tries to pick is a"},{"id":336,"text":"minimum norm solution, which is sort of similar to what we're doing here. All right. Now,"},{"id":337,"text":"the variance of theta hat involves eigenvalues that shrink from this 1 by lambda i to roughly"},{"id":338,"text":"this expression and the risk"},{"id":339,"text":"And so the point that I'm making here is a small value here has huge variance. So it's not just a problem, by the way, if lambda i is exactly 0. But imagine I have a very, very small weak eigenvalue. I have lambda i 10 to the minus 5, 10 to the minus 6. What happens along that direction? That means huge changes."},{"id":340,"text":"right, in the eigenbasis there, do not change the error very much. So the worst case of this is when it's 0. When it's 0, the entire subspace does not change. But if it's really small, lambda i, and I take the corresponding eigenvector, any change on that direction doesn't really change the loss by very much. And when I'm optimizing, this can create a numerical instability. Here, by adding this, it bounds me away from 0. And so everything is kind of all the eigenvalues are kind of large enough."},{"id":341,"text":"This intuitively means that I'm going to get a better, more well-behaved optimization and a better model with lower variance because this is really where I pay for the variance and the model. Is that clear? Please ask me a question if not. So this behavior, just to be clear, lowers the variance even when xtx is full rank. Why does that happen? What is the variance a function of here?"}],"notes":["本段讨论了在特征值分解中，当添加一个常数rho时，所有特征值都会被平移。这种平移引入了偏差，但同时也避免了特征值为零的情况，从而保持矩阵的满秩性。这是因为xtx是半正定的，其特征值非负，加上一个正数后，结果仍然是正的。","当特征值非常小时，会导致模型的方差增大，从而影响优化过程的稳定性。即使xtx是满秩的，这种现象仍然会发生，因为方差与特征值的大小有关，而特征值的微小变化可能导致损失函数的显著变化。","通过添加一个正数，可以避免特征值为零，从而防止数值不稳定。这有助于获得更稳定、更易优化的模型，同时降低方差。","在优化过程中，特征值的大小直接影响模型的方差。当特征值非常小时，模型对输入的变化更加敏感，可能导致损失函数的剧烈波动。","本段强调了特征值在模型训练中的重要性，特别是在正则化和数值稳定性方面。通过调整特征值，可以改善模型的性能和优化过程。","最后，讲者询问了方差的计算方式，强调了特征值在方差计算中的作用，以及如何通过调整特征值来降低方差。"],"formulas":[{"latex":"x^T x","symbols":"x的转置乘以x","explanation":"x^T x 是一个常见的矩阵乘积表达式，表示向量x与其转置的乘积，结果是一个标量。该表达式在数学上是正确的，且符合正定矩阵的定义。","evidence":"We're using the thought that xtx is positive semidefinite."},{"latex":"\\lambda_i + \\rho","symbols":"特征值加上一个常数rho","explanation":"该表达式表示特征值λ_i加上一个常数ρ，这在特征值分析中是常见的操作，用于调整特征值的大小。","evidence":"of the dimensions that we have, the eigenvalues of this thing are all shifted by a constant rho."}],"uncertainties":["lambda i 10 to the minus 5, 10 to the minus 6"],"diagram":"none","start":3039.37,"end":3207.68,"asr_flags":[],"math_clarifications":["公式 Var(\\theta) = \\frac{1}{\\lambda_i} 存在数学错误，因为方差通常与特征值的倒数成正比，但该表达式没有明确说明其上下文和条件。此外，方差的表达式应包含更多细节，如矩阵的逆或特征值的分布。因此，该公式无法核定，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3039.37,"text":"So now when the inverse exists,"},{"start":3041.51,"text":"if lambda 1, lambda 2, and lambda d are all the eigenvalues"},{"start":3044.93,"text":"of the dimensions that we have, the eigenvalues of this thing are all shifted by a constant rho."},{"start":3050.71,"text":"This is the bias, right? We're shifting this thing in some direction, but the advantage we get is now"},{"start":3057.09,"text":"this is full rank. Why doesn't one of these things end up equaling zero if rho is nonzero? What"},{"start":3066.39,"text":"What property are we using?"},{"start":3071.93,"text":"We're using the thought that xtx is positive semidefinite."},{"start":3075.03,"text":"And so what that means is all of these lambda i's, great point,"},{"start":3078.83,"text":"all these lambda i's are greater than or equal to 0."},{"start":3081.79,"text":"And so when this thing can't introduce some extra element"},{"start":3086.05,"text":"of the null space because this is a non-negative number"},{"start":3088.25,"text":"plus a strictly positive number, that"},{"start":3090.63,"text":"means this is going to be strictly positive."},{"start":3094.09,"text":"Cool."},{"start":3094.49,"text":"All right. All right. If you care, I derived it and put it in the appendix. The pseudo-inverse,"},{"start":3101.89,"text":"what happens there, the Penrose pseudo-inverse, if you care what that is, that's another procedure"},{"start":3105.95,"text":"to solve this equation. It also is a form of regularization. What it tries to pick is a"},{"start":3110.15,"text":"minimum norm solution, which is sort of similar to what we're doing here. All right. Now,"},{"start":3116.97,"text":"the variance of theta hat involves eigenvalues that shrink from this 1 by lambda i to roughly"},{"start":3123.35,"text":"this expression and the risk"},{"start":3127.59,"text":"And so the point that I'm making here is a small value here has huge variance. So it's not just a problem, by the way, if lambda i is exactly 0. But imagine I have a very, very small weak eigenvalue. I have lambda i 10 to the minus 5, 10 to the minus 6. What happens along that direction? That means huge changes."},{"start":3149.04,"text":"right, in the eigenbasis there, do not change the error very much. So the worst case of this is when it's 0. When it's 0, the entire subspace does not change. But if it's really small, lambda i, and I take the corresponding eigenvector, any change on that direction doesn't really change the loss by very much. And when I'm optimizing, this can create a numerical instability. Here, by adding this, it bounds me away from 0. And so everything is kind of all the eigenvalues are kind of large enough."},{"start":3179.07,"text":"This intuitively means that I'm going to get a better, more well-behaved optimization and a better model with lower variance because this is really where I pay for the variance and the model. Is that clear? Please ask me a question if not. So this behavior, just to be clear, lowers the variance even when xtx is full rank. Why does that happen? What is the variance a function of here?"}],"speech_gaps":[{"start":3069.584,"end":3071.53}],"frame":"../frames/v047/019.webp","frame_time":3051.37},{"title":"条件数与方差的关系","segments":[{"id":342,"text":"If you have eigenvalues that are all the same in case one, and in the other case you have a really large eigenvalue and a really small eigenvalue, which one is going to have proportionally a higher or lower variance, you think? The second one, we have this widespread. It's going to be poorly conditioned, potentially. If you start to make them more homogenous and shrink back down in absolute values,"},{"id":343,"text":"close to zero, you're just going to have less variance. Remember how you compute the expected value of a random variable times a matrix, and you get out the covariance, right? It's exactly that computation. You guys are doing great. Questions?"},{"id":344,"text":"All right. So the point is, this is what I mean. I hopefully made this precise in math that you can go back and check or take a look at and make sure you evolve, which is that the trade-off here i
