<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>【斯坦福CS229】数据集划分与机器学习建议</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】数据集划分与机器学习建议 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v047","title":"【斯坦福CS229】数据集划分与机器学习建议","course":"机器学习","pages":[{"title":"数据集划分与机器学习建议","segments":[{"id":0,"text":"Welcome to Lecture 6. Today we're going to talk about bias and variance. So you're going to see a really canonical trade-off in machine learning between bias and variance, bias squared and variance."},{"id":1,"text":"That's going to lead us into some discussions about regularization, model selection, and some other things there. In particular, when we start to go through this, you're going to see some stuff that I hope is actually quite useful when you do machine learning in practice. We'll first talk about this fundamental tension in models, which are overfitting and underfitting. You'll go through this, we'll motivate exactly what those two concepts mean. Then I'm going to try and give you a modern twist on that a little bit later."},{"id":2,"text":"Overfitting and underfitting are naturally going to lead into bias and variance. So once we have kind of the picture version of how overfitting and underfitting work, we'll do the mathematical version. That will be the bias-variance trade-off that is very famous. It's one of those things you hear about for machine learning. And then that will motivate a particular technique regularization. It's really a class of techniques to reduce the variance for the models. And we'll see why that's so critical."},{"id":3,"text":"And I couldn't help myself. There are two places I put in kind of a modern twist that I think are helpful. One is I'm going to tell you about two fairly recent-ish papers, which are called Double Descent, which is how bias variance, the classical way I'm going to teach you for the first part of the lecture, how it deals with modern models, which I think is really interesting to know. And you should just be at least aware that it exists. This is something that..."},{"id":4,"text":"people are working on quite a bit. And we'll also talk about this very cool paper I was actually talking with one of the senior authors this morning, which is called ImageNet to ImageNet v2, which talks a little bit about another form of overfitting that you could worry about, which is called adaptive overfitting, and why that actually hasn't been a problem in models. So I really want to share those with you because I think they're pretty interesting lessons about where machine learning is going."},{"id":5,"text":"We'll talk about model and parameter selection, train, dev, and test splits. We'll talk about a very classical method from stats, which is called k-fold cross-validation. You may have seen this method before. We'll be able to analyze it quite cleanly. And then we'll talk about this compute-efficient algorithm called Hyperband, which is an algorithm I love. It's by some friends. One is at CMU now. One's at Washington. And it's a very compute-efficient way to fit parameters, to tune hyperparameters."},{"id":6,"text":"And it's just very simple and clean. It has four slide animation. And you get the idea. And it's actually really useful. It actually has nice theory underneath the covers. We won't do that here as well. But that's a good way to actually tune parameters in a bunch of places. So today, we're really wrestling with this really central question in machine learning. Given a finite, noisy sample,"}],"notes":["本段介绍了机器学习中偏差与方差的经典权衡，以及现代机器学习中的一些新趋势，如双下降现象和自适应过拟合。这些概念帮助理解模型在训练和泛化中的表现，以及如何通过正则化等技术来减少方差。","讲者提到双下降现象，这是近年来在机器学习领域引起广泛关注的新研究方向，表明随着模型复杂度的增加，测试误差可能先下降后上升，再下降，这与传统的偏差-方差权衡不同。","自适应过拟合是另一种过拟合形式，但讲者指出在现代模型中，这种现象并未成为主要问题，这可能与模型的结构或数据的特性有关。","讲者还介绍了模型选择和参数调整的方法，包括k折交叉验证和Hyperband算法。这些方法在实际应用中非常有用，能够帮助优化模型性能。","Hyperband算法是一种计算效率高的超参数调优方法，通过分层的随机搜索策略来减少计算资源的消耗，同时保持较高的搜索效率。","最后，讲者强调了在有限且带有噪声的数据样本下，如何选择合适的模型和参数是机器学习中的核心问题，这需要结合理论分析和实际经验。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.14,"end":168.66,"asr_flags":[],"raw_segments":[{"start":5.14,"text":"Welcome to Lecture 6. Today we're going to talk about bias and variance. So you're going to see a really canonical trade-off in machine learning between bias and variance, bias squared and variance."},{"start":16.53,"text":"That's going to lead us into some discussions about regularization, model selection, and some other things there. In particular, when we start to go through this, you're going to see some stuff that I hope is actually quite useful when you do machine learning in practice. We'll first talk about this fundamental tension in models, which are overfitting and underfitting. You'll go through this, we'll motivate exactly what those two concepts mean. Then I'm going to try and give you a modern twist on that a little bit later."},{"start":44.9,"text":"Overfitting and underfitting are naturally going to lead into bias and variance. So once we have kind of the picture version of how overfitting and underfitting work, we'll do the mathematical version. That will be the bias-variance trade-off that is very famous. It's one of those things you hear about for machine learning. And then that will motivate a particular technique regularization. It's really a class of techniques to reduce the variance for the models. And we'll see why that's so critical."},{"start":69.31,"text":"And then I couldn't help myself. There are two places I put in kind of a modern twist that I think are helpful. One is I'm going to tell you about two fairly recent-ish papers, which are called Double Descent, which is how bias variance, the classical way I'm going to teach you for the first part of the lecture, how it deals with modern models, which I think is really interesting to know. And you should just be at least aware that it exists. This is something that..."},{"start":94.54,"text":"people are working on quite a bit. And we'll also talk about this very cool paper I was actually talking with one of the senior authors this morning, which is called ImageNet to ImageNet v2, which talks a little bit about another form of overfitting that you could worry about, which is called adaptive overfitting, and why that actually hasn't been a problem in models. So I really want to share those with you because I think they're pretty interesting lessons about where machine learning is going."},{"start":118.78,"text":"We'll talk about model and parameter selection, train, dev, and test splits. We'll talk about a very classical method from stats, which is called k-fold cross-validation. You may have seen this method before. We'll be able to analyze it quite cleanly. And then we'll talk about this compute-efficient algorithm called Hyperband, which is an algorithm I love. It's by some friends. One is at CMU now. One's at Washington. And it's a very compute-efficient way to fit parameters, to tune hyperparameters."},{"start":146.7,"text":"And it's just very simple and clean. It has four slide animation. And you get the idea. And it's actually really useful. It actually has nice theory underneath the covers. We won't do that here as well. But that's a good way to actually tune parameters in a bunch of places. So today, we're really wrestling with this really central question in machine learning. Given a finite, noisy sample,"}],"speech_gaps":[],"frame":"../frames/v047/001.webp","frame_time":17.14},{"title":"数据集划分与机器学习建议","segments":[{"id":7,"text":"How do we pick a model that will generalize? And this is the key question in machine learning. This is what motivated both statistical theory and what we do now. We're going to train a model on some train set. We're going to apply it on some test set. And we'd like to have some procedure that on that training set guarantees, to the extent possible, that we behave in that form on future data sets. So this is the critical question in machine learning. We're going to talk about it."},{"id":8,"text":"Okay, so let's get some pictures about overfitting versus underfitting and hopefully make this concept crystal clear in your head. So here's the setup. There exists some true function in the world. We don't get to see those functions that are there. But this true function, which I've drawn here for illustration, is this function h of theta, which is going to be some quadratic."},{"id":9,"text":"Now, it's weighted by some parameters, theta 2, theta 1, and theta 0. And it generates the real world. So this is the forward model for our data. But we never, ever get to see h. We're going to try and learn h. So we'll only observe h through data. This is what we've been doing for the whole course, so hopefully not super surprising now. What that means is we're going to have yi, which is the data we observe. It's going to be some function h theta of xi plus some noise term. And here, I'm going to assume the noise is Gaussian."},{"id":10,"text":"Same setup we've done in a couple different ways. So here I've charted x and y in some particular nice example where x is going to just be some polynomial function. And indeed, there's the true function. And then we've gotten some noisy samples. These characters are really close to the line. These characters are a little bit further away from the line. There's a little bit more error there. So what I want to point out, though, is that when you get a training set, every set"},{"id":11,"text":"Every fresh data set is just a different set of points. And we're going to come back to, we're going to analyze what happens as we change those points in a bit. So we could judge our model based on exactly just the data we've seen. It turns out that's hard because we want to actually, the kind of guarantees that we can actually prove reliably are something that say, maybe we got a really bad training set. Maybe we just sampled one point again and again and again and ignored the rest of the function. That could be pretty bad."},{"id":12,"text":"Just the same point again and again and again. So we want to have this randomness over all the training sets that we could have seen. And we hope that our function trains well, meaning it's got to produce something that's close to this true set when it's fed different training sets. So is the model clear? So far, we've thought of there being training sets fixed, but now we're thinking about the training set itself is going to be a sample from some population."}],"notes":["本段讨论了机器学习中的核心问题，即如何选择一个能够泛化的模型。讲者指出，这是机器学习的关键问题，既推动了统计理论的发展，也指导了当前的实践。通过训练集和测试集的划分，讲者强调了模型在面对未来数据时的表现，这需要一种保证模型行为一致性的过程。","讲者通过一个具体的例子来解释过拟合和欠拟合的概念。他提到存在一个真实的函数，该函数是二次函数，并通过参数θ2、θ1和θ0进行加权，生成真实世界的数据。但这个真实函数h是不可见的，只能通过数据来学习。数据由真实函数加上高斯噪声组成，这为后续的模型训练和评估提供了基础。","讲者进一步说明了数据集的随机性对模型训练的重要性。他指出，每个训练集都是不同的点集合，而模型的泛化能力取决于它在不同训练集上的表现。如果训练集过于单一，比如只包含一个点，那么模型可能无法正确学习真实函数，从而导致性能下降。","讲者强调了训练集作为从总体中采样的重要性。他指出，模型的训练过程需要考虑训练集的随机性，以确保模型在面对不同数据时能够保持良好的性能。这为后续讨论数据集划分和模型评估提供了理论基础。","讲者通过具体的例子说明了数据集的随机性和模型泛化能力之间的关系。他指出，模型的泛化能力不仅取决于训练集的结构，还取决于训练集的多样性。因此，在实际应用中，需要确保训练集的随机性和代表性，以提高模型的泛化能力。","讲者最后总结了模型训练的基本思想，即模型需要在不同的训练集上表现良好，以确保其泛化能力。这为后续讨论数据集划分和模型评估提供了理论支持。"],"formulas":[{"latex":"y_i = h_{\\theta}(x_i) + \\epsilon","symbols":"y_i 是观测数据，h_θ(x_i) 是真实函数，ε 是高斯噪声","explanation":"公式正确，描述了观测数据与真实函数及噪声的关系，符合概率模型的设定。","evidence":"Now, it's weighted by some parameters, theta 2, theta 1, and theta 0. And it generates the real world. So this is the forward model for our data. But we never, ever get to see h. We're going to try and learn h. So we'll only observe h through data. This is what we've been doing for the whole course, so hopefully not super surprising now. What that means is we're going to have yi, which is the data we observe. It's going to be some function h theta of xi plus some noise term. And here, I'm going to assume the noise is Gaussian."}],"uncertainties":["characters"],"diagram":"none","start":169.5,"end":328.64,"asr_flags":[],"math_clarifications":["公式中的噪声项ε被正确地假设为高斯分布，但未明确写出其分布形式。"],"raw_segments":[{"start":169.5,"text":"How do we pick a model that will generalize? And this is the key question in machine learning. This is what motivated both statistical theory and what we do now. We're going to train a model on some train set. We're going to apply it on some test set. And we'd like to have some procedure that on that training set guarantees, to the extent possible, that we behave in that form on future data sets. So this is the critical question in machine learning. We're going to talk about it."},{"start":196.89,"text":"Okay, so let's get some pictures about overfitting versus underfitting and hopefully make this concept crystal clear in your head. So here's the setup. There exists some true function in the world. We don't get to see those functions that are there. But this true function, which I've drawn here for illustration, is this function h of theta, which is going to be some quadratic."},{"start":218.53,"text":"Now, it's weighted by some parameters, theta 2, theta 1, and theta 0. And it generates the real world. So this is the forward model for our data. But we never, ever get to see h. We're going to try and learn h. So we'll only observe h through data. This is what we've been doing for the whole course, so hopefully not super surprising now. What that means is we're going to have yi, which is the data we observe. It's going to be some function h theta of xi plus some noise term. And here, I'm going to assume the noise is Gaussian."},{"start":247.41,"text":"Same setup we've done in a couple different ways. So here I've charted x and y in some particular nice example where x is going to just be some polynomial function. And indeed, there's the true function. And then we've gotten some noisy samples. These characters are really close to the line. These characters are a little bit further away from the line. There's a little bit more error there. So what I want to point out, though, is that when you get a training set, every set"},{"start":275.69,"text":"Every fresh data set is just a different set of points. And we're going to come back to, we're going to analyze what happens as we change those points in a bit. So we could judge our model based on exactly just the data we've seen. It turns out that's hard because we want to actually, the kind of guarantees that we can actually prove reliably are something that say, maybe we got a really bad training set. Maybe we just sampled one point again and again and again and ignored the rest of the function. That could be pretty bad."},{"start":303.13,"text":"Just the same point again and again and again. So we want to have this randomness over all the training sets that we could have seen. And we hope that our function trains well, meaning it's got to produce something that's close to this true set when it's fed different training sets. So is the model clear? So far, we've thought of there being training sets fixed, but now we're thinking about the training set itself is going to be a sample from some population."}],"speech_gaps":[],"frame":"../frames/v047/002.webp","frame_time":181.5},{"title":"数据集划分与机器学习建议","segments":[{"id":13,"text":"Ask me a question if unclear. So let's imagine we produce three different samples of that data set. S1, S2, and S3. They're just different draws. Now you could imagine that they're drawn randomly if that makes you feel better. They could be drawn in some way, but right now they're just three different draws of the data set. Now underneath is the same true function. So all the Xi's are all the same."},{"id":14,"text":"And indeed, in this idea, there's a hypothesis. There's a true relationship in the world between x and y. So this curve is the same on every one of the samples. But the samples are different. And they have different noise on each point, potentially. And the points themselves are different. So the x's and the eventual y's are going to change. But they're a draw of the same underlying set. So far good?"},{"id":15,"text":"Awesome? All right. So now, what we're going to think about in this lecture, which gets us to bias and variance and all that other good stuff is, how does the model change when we fit the same model class to each one? So we'll fit it to S1, independently fit it to S2, independently fit it to S3. This is kind of the mental model. And we'll want to see if the model should change. And so intuitively, it should be that on any one of these data sets, no matter which one you throw at our procedure, if it were the ideal procedure, it would just spit back exactly the true model."},{"id":16,"text":"We'll see that that's not always the case. Some model classes will make systematic errors, and we'll try and capture those systematic errors. And that's what bias and variance are really going to be all about."},{"id":17,"text":"So what I've shown here is we took S1, and we fit a line. And boom, the line went off in some direction. And it has some errors on the points. On S2, I again get this data set, and I fit a different line. And S3, get a different line. Now, the point of this schematically"},{"id":18,"text":"is that this thing is kind of bouncing around a little bit on every different data set I give to it. It kind of fits a different line on each one of them. But also, it makes a lot of errors. So there's two different things going on. One is, if you think about this for a second, no matter which line I pick through these data sets, there's always going to be some amount of error. And if you actually compute it out, you can see that that error is going to be something related to the integral of that quadratic over the space."},{"id":19,"text":"Does that make sense? No matter which line you draw, you're never going to draw a line that has a nice curve like it. Doesn't matter which one you draw. You can sample all day long until you're blue in the face. That's one. So this is obvious, even from the training data that we have. Now the fix here, hopefully, is clear. This is what we call a high bias situation. We're going to do the math in a second. But we're underfitting the model. Our model is just not expressive enough to capture the phenomenon we're after. We're after a quadratic thing, but we only have a linear thing, a linear model to go after it."}],"notes":["本段讲授了机器学习中数据集划分的基本概念，包括如何从同一真实函数中抽取不同的样本，并强调了样本之间的差异性。讲者指出，尽管样本不同，但它们都来自同一个真实函数，且每个样本中的点都可能带有不同的噪声。"],"formulas":[],"uncertainties":[],"diagram":"none","start":331.05,"end":509.43,"asr_flags":[],"raw_segments":[{"start":331.05,"text":"Ask me a question if unclear. So let's imagine we produce three different samples of that data set. S1, S2, and S3. They're just different draws. Now you could imagine that they're drawn randomly if that makes you feel better. They could be drawn in some way, but right now they're just three different draws of the data set. Now underneath is the same true function. So all the Xi's are all the same."},{"start":354.98,"text":"And indeed, in this idea, there's a hypothesis. There's a true relationship in the world between x and y. So this curve is the same on every one of the samples. But the samples are different. And they have different noise on each point, potentially. And the points themselves are different. So the x's and the eventual y's are going to change. But they're a draw of the same underlying set. So far good?"},{"start":378.16,"text":"Awesome? All right. So now, what we're going to think about in this lecture, which gets us to bias and variance and all that other good stuff is, how does the model change when we fit the same model class to each one? So we'll fit it to S1, independently fit it to S2, independently fit it to S3. This is kind of the mental model. And we'll want to see if the model should change. And so intuitively, it should be that on any one of these data sets, no matter which one you throw at our procedure, if it were the ideal procedure, it would just spit back exactly the true model."},{"start":407.17,"text":"We'll see that that's not always the case. Some model classes will make systematic errors, and we'll try and capture those systematic errors. And that's what bias and variance are really going to be all about. So let's fit the simplest model. Let's just fit a line. Our function's quadratic. We're fitting a line."},{"start":425.99,"text":"Intuitively, it should be too simple. There should be a curve. The line is incapable of representing the curve. So what happens? So what I've shown here is we took S1, and we fit a line. And boom, the line went off in some direction. And it has some errors on the points. On S2, I again get this data set, and I fit a different line. And S3, get a different line. Now, the point of this schematically"},{"start":450.82,"text":"is that this thing is kind of bouncing around a little bit on every different data set I give to it. It kind of fits a different line on each one of them. But also, it makes a lot of errors. So there's two different things going on. One is, if you think about this for a second, no matter which line I pick through these data sets, there's always going to be some amount of error. And if you actually compute it out, you can see that that error is going to be something related to the integral of that quadratic over the space."},{"start":480.07,"text":"Does that make sense? No matter which line you draw, you're never going to draw a line that has a nice curve like it. Doesn't matter which one you draw. You can sample all day long until you're blue in the face. That's one. So this is obvious, even from the training data that we have. Now the fix here, hopefully, is clear. This is what we call a high bias situation. We're going to do the math in a second. But we're underfitting the model. Our model is just not expressive enough to capture the phenomenon we're after. We're after a quadratic thing, but we only have a linear thing, a linear model to go after it."}],"speech_gaps":[],"frame":"../frames/v047/003.webp","frame_time":343.05},{"title":"数据集划分与机器学习建议","segments":[{"id":20,"text":"So the fix is, well, let's add some degrees of freedom. Let's make our model more expressive. So now we're going to fit a really high-dimensional polynomial. We don't know what the true function is. We don't know what it is. So let's go and throw a true big function after it. So here, I think if you count, I think these are 9-degree polynomials. Maybe the notes accidentally said 5, but you can see how much they're oscillating."},{"id":21,"text":"So again, on each set, I'll fit a polynomial here, I'll fit a polynomial here, I'll fit this polynomial here on each set independently. When I look at those sets, if you remember your Lagrange interpolation, right? If you have more degrees than you have points, you can fit every point I give you. So this has kind of the opposite problem. Here on the training set that I give you, I'm getting down to zero error. In the last one, I was not getting zero error on the train or the test error."},{"id":22,"text":"This one, I'm fitting the training set perfectly, but somehow each time I give you a new sample, I get what looks like a completely unrecognizable function. And that would be very disturbing, for example, if I made a prediction here, I would get something that was in infinity, and here I'd get something large, but here I would get something small. Does that make sense? If I took the same x value across each of them, my predictions are no longer stable because it's wiggling around to such a crazy extent. So far, so good? Cool. All right."},{"id":23,"text":"So the curve changes a lot from one sample to the next, one sample here being an entire training set to the next. And here, this is an instance where the model is kind of comically too powerful. I wanted to fit a quadratic, but I had some huge polynomial underneath the covers. So the fix that we'll talk about here is using an expressive class with lower variance. Now, this is the classical story. This is what we're going to talk about for the next couple of minutes."},{"id":24,"text":"But I do want to point out that machine learning, as I said, and what we'll get to in the second half of the lecture, started training models that were actually larger than the dataset. So in the second half of lecture, we're going to come back and revisit this idea through some more interesting ideas from the last 5-10 years and talk about how this evolved in the future to modern models. But the classical, you must know anyone who passes through machine learning or stats needs to know."},{"id":25,"text":"is high variance and overfit. Another way to say that is what's likely to be on your test is the first part of what's going on, not the second part, which is basically me teaching you about what's going on in the last five years. Because this is a classical bias-variance decomposition. You should know what we're going to do."},{"id":26,"text":"All right. Now, another way to think about it is the model is fitting noise, not signal. The true signal is this nice, smooth parabola, and it's fitting to all the little noise. And as a result, it's jumping around wildly. We've done this in one dimension, but it's certainly true in higher dimensions as well. Higher dimensions even get worse because lines in higher dimensions are pretty expressive, as we've talked about. And so a higher dimensional line where you use too many dimensions, you can also get this kind of property where you figure out a line which almost perfectly fits all of your data."}],"notes":["本段讨论了模型复杂度过高导致的过拟合问题，通过高次多项式拟合数据时，模型在训练集上表现完美，但在测试集上表现不稳定，甚至出现极端预测值。这说明模型过度拟合了训练数据中的噪声，而非真实信号。","讲者提到，当模型的自由度（如多项式次数）超过数据点数量时，模型可以完美拟合训练数据，但这种拟合是不稳定的，因为模型会过度适应数据中的随机波动。这与拉格朗日插值中的现象类似，即当多项式次数过高时，插值结果会剧烈波动。","讲者指出，模型在高维空间中更容易出现这种问题，因为高维空间中的线性模型具有更强的表达能力，但这也可能导致模型过度拟合。例如，使用过多的特征维度可能导致模型在训练数据上表现良好，但在测试数据上泛化能力差。","讲者强调，过拟合问题在机器学习中是一个经典问题，通常通过引入正则化或使用更简单的模型来解决。此外，讲者提到现代机器学习模型（如深度学习）在处理大规模数据时，可能会出现模型规模超过数据集的情况，这需要更深入的分析。","讲者还提到，过拟合的另一种理解是模型在拟合数据时，不仅学习了真实信号，还学习了数据中的噪声。这会导致模型在面对新数据时表现不稳定，预测结果波动较大。","最后，讲者指出，高维空间中的模型更容易出现过拟合问题，因为高维空间中的线性模型具有更强的表达能力，但这也可能导致模型过度拟合。例如，使用过多的特征维度可能导致模型在训练数据上表现良好，但在测试数据上泛化能力差。"],"formulas":[],"uncertainties":[],"diagram":"none","start":510.13,"end":683.22,"asr_flags":[],"raw_segments":[{"start":510.13,"text":"So the fix is, well, let's add some degrees of freedom. Let's make our model more expressive. So now we're going to fit a really high-dimensional polynomial. We don't know what the true function is. We don't know what it is. So let's go and throw a true big function after it. So here, I think if you count, I think these are 9-degree polynomials. Maybe the notes accidentally said 5, but you can see how much they're oscillating."},{"start":533.75,"text":"So again, on each set, I'll fit a polynomial here, I'll fit a polynomial here, I'll fit this polynomial here on each set independently. When I look at those sets, if you remember your Lagrange interpolation, right? If you have more degrees than you have points, you can fit every point I give you. So this has kind of the opposite problem. Here on the training set that I give you, I'm getting down to zero error. In the last one, I was not getting zero error on the train or the test error."},{"start":560.12,"text":"This one, I'm fitting the training set perfectly, but somehow each time I give you a new sample, I get what looks like a completely unrecognizable function. And that would be very disturbing, for example, if I made a prediction here, I would get something that was in infinity, and here I'd get something large, but here I would get something small. Does that make sense? If I took the same x value across each of them, my predictions are no longer stable because it's wiggling around to such a crazy extent. So far, so good? Cool. All right."},{"start":588.1,"text":"So the curve changes a lot from one sample to the next, one sample here being an entire training set to the next. And here, this is an instance where the model is kind of comically too powerful. I wanted to fit a quadratic, but I had some huge polynomial underneath the covers. So the fix that we'll talk about here is using an expressive class with lower variance. Now, this is the classical story. This is what we're going to talk about for the next couple of minutes."},{"start":614.53,"text":"But I do want to point out that machine learning, as I said, and what we'll get to in the second half of the lecture, started training models that were actually larger than the dataset. So in the second half of lecture, we're going to come back and revisit this idea through some more interesting ideas from the last 5-10 years and talk about how this evolved in the future to modern models. But the classical, you must know anyone who passes through machine learning or stats needs to know."},{"start":638.46,"text":"is high variance and overfit. Another way to say that is what's likely to be on your test is the first part of what's going on, not the second part, which is basically me teaching you about what's going on in the last five years. Because this is a classical bias-variance decomposition. You should know what we're going to do."},{"start":655.06,"text":"All right. Now, another way to think about it is the model is fitting noise, not signal. The true signal is this nice, smooth parabola, and it's fitting to all the little noise. And as a result, it's jumping around wildly. We've done this in one dimension, but it's certainly true in higher dimensions as well. Higher dimensions even get worse because lines in higher dimensions are pretty expressive, as we've talked about. And so a higher dimensional line where you use too many dimensions, you can also get this kind of property where you figure out a line which almost perfectly fits all of your data."}],"speech_gaps":[],"frame":"../frames/v047/004.webp","frame_time":522.13},{"title":"数据集划分与机器学习建议","segments":[{"id":27,"text":"but it actually doesn't generalize well when you go to a test set. And to think about it just to be really concrete, imagine I trained on S1 and then S2 was my test set. I would make huge errors using the function that I use on S1 on S2 and vice versa. Clear enough what the concepts are that we're looking for? All right, we're going to do some math. Keep these pictures in your head. All the math is basically just these pictures. If you understand the pictures, the math is just some kind of plug and chug kind of stuff."},{"id":28,"text":"Now, the last case, of course, to fill it out is I get it just right. Now, just right doesn't mean it's perfect. That's all I want to get across on this slide. Just right means it has the right, the fancy term for this that you'll hear machine learning people say. You should always ask them to define it because they don't think they know they can define it. It's a tough thing. Inductive bias. It's the right inductive bias. It sounds really professional when you say that. It just means it has a degree that matches the model. The degrees are free to match the model."},{"id":29,"text":"More or less. So the fits are similar across samples, and they stay close to the data. And sure, they make some errors. But those errors somehow are the errors that are in the data. If I gave you a really bad sample of training data, your model class shouldn't kind of be held accountable that it also fit a poor model. And so what we're going to try and do is disentangle these three sources of error. What are errors when I come to test time?"},{"id":30,"text":"What are errors in terms of bias, which is how far I'm off, what the line is off, is what that term is going to be called. And the last one is that variance term, which is how much do I jump around effectively as I train the training set. And those are going to be the three terms and what comes out in the math we do next. So you've seen them kind of one, two, three. All right. Now, this is the classical picture."},{"id":31,"text":"These are the three terms. We're going to derive them momentarily, which is that we're going to talk about more precisely what happens at test time, because we're worried about generalization. I'm going to give you a formal model, but intuitively, you're going to pick a new point, however you want. That new point's going to have some error in it as well, because it's a point. And then we're going to try and understand what's called the noise. And then we're going to look at these terms, how bias and variance trade off. And this is the canonical chart that you usually see, which says, as I increase the model complexity,"},{"id":32,"text":"The bias reduces, right? So we did it with lines and degrees, but canonically, it'd be like more parameters, a more expressive function clash. The hypothesis class is bigger. The number of function you could fit. This thing goes down. But then after you get to some point, the variance, the ability to jump around and fit everything goes up. Okay? Okay. So far, so good? All right. Awesome. Okay. So what this looks like for polynomials, we already saw."}],"notes":["本段讲解了机器学习中模型拟合的三个主要误差来源：偏差、方差和噪声。偏差指的是模型对数据的偏离程度，方差指的是模型在训练数据上的波动程度，而噪声则是数据本身的随机误差。讲者强调了理解这些概念的重要性，并指出它们在模型复杂度变化时的相互作用。","讲者提到，模型的偏差和方差之间存在权衡关系。随着模型复杂度的增加，偏差会减少，但方差会增加。这种权衡关系是机器学习中一个经典的问题，通常通过调整模型复杂度来找到最佳平衡点。","讲者还提到，模型的偏差和方差是通过数学推导得出的，这些推导将帮助理解模型在测试时的表现。模型的复杂度增加会导致偏差减少，但方差增加，这可能导致模型在测试数据上的表现变差。","讲者指出，模型的偏差和方差是理解模型泛化能力的关键因素。偏差反映了模型对数据的拟合程度，而方差反映了模型对训练数据的敏感程度。在实际应用中，需要找到一个合适的模型复杂度，以平衡偏差和方差。","讲者还提到，模型的偏差和方差是通过数学推导得出的，这些推导将帮助理解模型在测试时的表现。模型的复杂度增加会导致偏差减少，但方差增加，这可能导致模型在测试数据上的表现变差。","讲者最后提到，对于多项式模型，偏差和方差的变化趋势已经有所展示。随着模型复杂度的增加，偏差减少，方差增加，这表明模型在测试数据上的表现会受到模型复杂度的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":684.05,"end":841.06,"asr_flags":[],"raw_segments":[{"start":684.05,"text":"but it actually doesn't generalize well when you go to a test set. And to think about it just to be really concrete, imagine I trained on S1 and then S2 was my test set. I would make huge errors using the function that I use on S1 on S2 and vice versa. Clear enough what the concepts are that we're looking for? All right, we're going to do some math. Keep these pictures in your head. All the math is basically just these pictures. If you understand the pictures, the math is just some kind of plug and chug kind of stuff."},{"start":711.14,"text":"Now, the last case, of course, to fill it out is I get it just right. Now, just right doesn't mean it's perfect. That's all I want to get across on this slide. Just right means it has the right, the fancy term for this that you'll hear machine learning people say. You should always ask them to define it because they don't think they know they can define it. It's a tough thing. Inductive bias. It's the right inductive bias. It sounds really professional when you say that. It just means it has a degree that matches the model. The degrees are free to match the model."},{"start":735.69,"text":"More or less. So the fits are similar across samples, and they stay close to the data. And sure, they make some errors. But those errors somehow are the errors that are in the data. If I gave you a really bad sample of training data, your model class shouldn't kind of be held accountable that it also fit a poor model. And so what we're going to try and do is disentangle these three sources of error. What are errors when I come to test time?"},{"start":758.88,"text":"What are errors in terms of bias, which is how far I'm off, what the line is off, is what that term is going to be called. And the last one is that variance term, which is how much do I jump around effectively as I train the training set. And those are going to be the three terms and what comes out in the math we do next. So you've seen them kind of one, two, three. All right. Now, this is the classical picture."},{"start":782.28,"text":"These are the three terms. We're going to derive them momentarily, which is that we're going to talk about more precisely what happens at test time, because we're worried about generalization. I'm going to give you a formal model, but intuitively, you're going to pick a new point, however you want. That new point's going to have some error in it as well, because it's a point. And then we're going to try and understand what's called the noise. And then we're going to look at these terms, how bias and variance trade off. And this is the canonical chart that you usually see, which says, as I increase the model complexity,"},{"start":812.17,"text":"The bias reduces, right? So we did it with lines and degrees, but canonically, it'd be like more parameters, a more expressive function clash. The hypothesis class is bigger. The number of function you could fit. This thing goes down. But then after you get to some point, the variance, the ability to jump around and fit everything goes up. Okay? Okay. So far, so good? All right. Awesome. Okay. So what this looks like for polynomials, we already saw."}],"speech_gaps":[],"frame":"../frames/v047/005.webp","frame_time":696.05},{"title":"数据集划分与机器学习建议","segments":[{"id":33,"text":"We're going to expect this. These are all just what's written in the chart. You see what each one of those terms are. But let's see what the terms actually are and derive them. It'll make it more clear than looking at this. This chart is really for you to look back at when you go through and say, OK, I've seen now the mapping from the math to the charts. And I want to make sure that I test my understanding. That's when you should come back to this chart. By the way, you'll hear me use this phrase. ough expressive power"},{"id":40,"text":"to fit the model. Below that, you're probably going to suffer bias. And then above that,"},{"id":41,"text":"you would expect that you get some amount of variance. And we're going to deal with that"},{"id":42,"text":"variance by regularization. So the idea is we don't know what d is. We don't know that it's"},{"id":43,"text":"to quadratic underneath the covers."},{"id":44,"text":"And so we're eventually going to develop methods"},{"id":45,"text":"that regularize."},{"id":46,"text":"They try something out."},{"id":47,"text":"They'll try something out to a high dimensional class."},{"id":48,"text":"And then they'll try and kind of smash down the complexity"},{"id":49,"text":"adaptively."},{"id":50,"text":"And so they didn't know that there was"},{"id":51,"text":"quadratic data underneath, but they'll"},{"id":52,"text":"kind of fit to that data."},{"id":53,"text":"That's the mental model of where we're going."},{"id":54,"text":"Please, go ahead."},{"id":55,"text":"Sorry."},{"id":56,"text":"The phi is completely gone."},{"id":57,"text":"d is greater than d is ."},{"id":58,"text":"The phi?"},{"id":59,"text":"Which one?"},{"id":60,"text":"Where's completely gone?"},{"id":61,"text":"Like this."},{"id":62,"text":"Oh, this is in the poly, this is just"},{"id":63,"text":"for polynomials. Don't read too much into it. It's because you can always fit a low-degree"},{"id":64,"text":"polynomial by zeroing out the higher-order coefficients. Yeah, yeah. Wonderful question."},{"id":65,"text":"Okay. I do want to point out before I do the math that I'm going to teach you this"},{"id":66,"text":"in regularization. Was there a question? Sorry. Oh, please."}],"notes":["本段主要讲解了机器学习中模型复杂度与偏差-方差权衡的概念。教授指出，当模型的复杂度（d）超过某个临界值（d*）时，偏差会消失，但方差会增加。这表明模型在足够复杂时可以拟合训练数据，但可能会过拟合。教授还提到，通过正则化可以控制方差，从而改善模型的泛化能力。","教授提到，当模型复杂度足够高时，即使在高维空间中，模型也能拟合训练数据，这与传统直觉相悖。他引用了一篇论文，指出某些深度网络可以实现这种插值，同时仍然具有泛化能力。这表明模型的复杂度和泛化能力之间存在复杂的相互作用。","教授强调，模型的复杂度（d）与数据的结构（如二次数据）之间存在关系。当模型复杂度超过某个阈值时，模型可以拟合数据，但需要通过正则化来控制方差。这表明模型的泛化能力不仅取决于其复杂度，还取决于数据的结构。","教授提到，模型的复杂度可以通过正则化方法进行控制。正则化的目标是减少方差，从而提高模型的泛化能力。这表明正则化是一种重要的技术，用于在模型复杂度和泛化能力之间取得平衡。","教授还提到，模型的复杂度可以通过适配性调整。例如，模型可以尝试在高维空间中拟合数据，然后通过某种方式降低复杂度。这表明模型的复杂度调整是一个动态过程，需要根据数据和任务进行调整。","教授最后提到，模型的复杂度和数据的结构之间存在关系，但具体细节可能需要进一步探讨。这表明模型的泛化能力不仅取决于其复杂度，还取决于数据的结构和模型的设计。"],"formulas":[],"uncertainties":["d is greater than d is .","quadratic data underneath"],"diagram":"none","start":841.73,"end":1018.37,"asr_flags":[55],"raw_segments":[{"start":841.73,"text":"We're going to expect this. These are all just what's written in the chart. You see what each one of those terms are. But let's see what the terms actually are and derive them. It'll make it more clear than looking at this. This chart is really for you to look back at when you go through and say, OK, I've seen now the mapping from the math to the charts. And I want to make sure that I test my understanding. That's when you should come back to this chart. By the way, you'll hear me use this phrase. I just want to point it out. Interpolation. This means something actually very precise to me. Interpolation means the ability to fit the training set with zero loss."},{"start":870.77,"text":"So when you say that a function is interpolating, it means it can fit exactly those points. And if you've ever seen what are called interpolative methods, like if you know what a Chebyshev series is or something, it doesn't matter if you don't. But if you've ever seen those methods, you take all the points exactly and then you weight the points. And it turns out, bizarrely enough, there exist large deep networks that interpolate their training set and still generalize."},{"start":895.03,"text":"which is something that you would think a high dimensional polynomial shouldn't be able to do. If I give you a high dimensional polynomial and exactly fit the points, it gets really weird and wiggly. And so you wouldn't expect that to happen. There's a wonderful paper written by some friends. Actually, the senior author on that was one of my dear friends I was talking to this morning about unrelated things. I shouldn't embarrass him. He also does strongman competitions. It was actually the bulk of what we were talking about. But the other side of what we were talking about did actually have to do with the update to these papers rethinking generalization, which are really interesting."},{"start":924.43,"text":"papers that show you things that you wouldn't think should happen super cool paper okay i'll probably embarrass the crap out of him but yeah ben rex's name i just want to put it out there so uh he's phenomenal any case um all right we'll keep going from there okay so the key is is that once you get larger in polynomial space"},{"start":944.85,"text":"this d gets bigger than d star. So we use this star notation to mean optimal,"},{"start":948.81,"text":"the optimal, like that's the right parameter class. Once you get bigger,"},{"start":951.95,"text":"the bias goes away intuitively in the classical picture because you have enough expressive power"},{"start":956.45,"text":"to fit the model. Below that, you're probably going to suffer bias. And then above that,"},{"start":961.45,"text":"you would expect that you get some amount of variance. And we're going to deal with that"},{"start":964.63,"text":"variance by regularization. So the idea is we don't know what d is. We don't know that it's"},{"start":971.15,"text":"to quadratic underneath the covers."},{"start":972.55,"text":"And so we're eventually going to develop methods"},{"start":974.57,"text":"that regularize."},{"start":976.41,"text":"They try something out."},{"start":978.13,"text":"They'll try something out to a high dimensional class."},{"start":981.61,"text":"And then they'll try and kind of smash down the complexity"},{"start":983.71,"text":"adaptively."},{"start":984.61,"text":"And so they didn't know that there was"},{"start":986.29,"text":"quadratic data underneath, but they'll"},{"start":988.25,"text":"kind of fit to that data."},{"start":989.83,"text":"That's the mental model of where we're going."},{"start":991.41,"text":"Please, go ahead."},{"start":991.95,"text":"Sorry."},{"start":992.49,"text":"The phi is completely gone."},{"start":993.89,"text":"d is greater than d is ."},{"start":996.53,"text":"The phi?"},{"start":997.33,"text":"Which one?"},{"start":997.75,"text":"Where's completely gone?"},{"start":999.01,"text":"Like this."},{"start":999.79,"text":"Oh, this is in the poly, this is just"},{"start":1001.05,"text":"for polynomials. Don't read too much into it. It's because you can always fit a low-degree"},{"start":1005.87,"text":"polynomial by zeroing out the higher-order coefficients. Yeah, yeah. Wonderful question."},{"start":1011.85,"text":"Okay. I do want to point out before I do the math that I'm going to teach you this"},{"start":1016.11,"text":"in regularization. Was there a question? Sorry. Oh, please."}],"speech_gaps":[],"frame":"../frames/v047/006.webp","frame_time":853.73},{"title":"数据集划分与机器学习建议","segments":[{"id":67,"text":"I was going to ask, is it true that train error reflects bias and test error reflects variance?"},{"id":68,"text":"Wonderful question. So the question is, does train error reflect bias? Is it captured in there?"},{"id":69,"text":"And does test error reflect the variance? It reflects a little bit more than variance"},{"id":70,"text":"because it also has noise. We're going to come to exactly what those terms are."},{"id":71,"text":"And the test error will also have this bias squared component to it. So bias will leak into"},{"id":72,"text":"that as well there. You're right to think about train error as primarily having something in bias"},{"id":73,"text":"of like, how poorly are you fitting your data? In practice, there could also be other errors"},{"id":74,"text":"that have to do with optimization. But assuming you got to the right model,"},{"id":75,"text":"then your intuitive understanding is absolutely perfect."},{"id":76,"text":"Great."},{"id":77,"text":"Great job."},{"id":78,"text":"Wonderful question."},{"id":79,"text":"Are there others?"},{"id":80,"text":"We're going to see exactly that decomposition of the test error"},{"id":81,"text":"in the next two, three slides."},{"id":82,"text":"Other questions?"},{"id":83,"text":"Awesome."},{"id":84,"text":"Let's keep going."},{"id":85,"text":"Oh, I wanted to make this point."},{"id":86,"text":"I know I made it brief."},{"id":87,"text":"of class the story is easy in regression the reason i'm going to show it in regression is"},{"id":88,"text":"because the math is really easy to see it's like all simple derivations classification also has"},{"id":89,"text":"this problem right where you have these high dimensional kinds of issues right like we talked"},{"id":90,"text":"about this almost briefly before you see how there's these kind of strange weird islands that"},{"id":91,"text":"are there this could be quite disturbing right if you just take your point here and wiggle it a"},{"id":92,"text":"little bit you go from one class to the other right if i look at any of these regions if there's"},{"id":93,"text":"a small little region there it could be that that is actually an island that is in you know the red"},{"id":94,"text":"class versus the blue class but probably we expect that the decision surface should be a little bit"},{"id":95,"text":"smoother okay and that's just intuition but hopefully that that makes sense you would be"},{"id":96,"text":"surprised if you had a small amount of error in your features that led to a different class for"},{"id":97,"text":"example underneath the covers so this all happens in classification it just happens more abruptly"},{"id":98,"text":"And the point is, it's about the model class that we're dealing with."},{"id":99,"text":"All right."},{"id":100,"text":"That was the intuitive piece. I hope it was intuitive."},{"id":101,"text":"You see what the main characters are. Please go ahead. Yeah."} s?"},{"start":1072.37,"text":"Awesome."},{"start":1072.87,"text":"Let's keep going."},{"start":1073.57,"text":"Oh, I wanted to make this point."},{"start":1074.91,"text":"I know I made it brief."},{"start":1077.12,"text":"of class the story is easy in regression the reason i'm going to show it in regression is"},{"start":1081.22,"text":"because the math is really easy to see it's like all simple derivations classification also has"},{"start":1087.0,"text":"this problem right where you have these high dimensional kinds of issues right like we talked"},{"start":1091.44,"text":"about this almost briefly before you see how there's these kind of strange weird islands that"},{"start":1095.38,"text":"are there this could be quite disturbing right if you just take your point here and wiggle it a"},{"start":1100.16,"text":"little bit you go from one class to the other right if i look at any of these regions if there's"},{"start":1104.22,"text":"a small little region there it could be that that is actually an island that is in you know the red"},{"start":1109.1,"text":"class versus the blue class but probably we expect that the decision surface should be a little bit"},{"start":1114.24,"text":"smoother okay and that's just intuition but hopefully that that makes sense you would be"},{"start":1118.84,"text":"surprised if you had a small amount of error in your features that led to a different class for"},{"start":1123.8,"text":"example underneath the covers so this all happens in classification it just happens more abruptly"},{"start":1127.98,"text":"And the point is, it's about the model class that we're dealing with."},{"start":1133.58,"text":"All right."},{"start":1136.3,"text":"That was the intuitive piece. I hope it was intuitive."},{"start":1138.56,"text":"You see what the main characters are. Please go ahead. Yeah."},{"start":1150.52,"text":"Awesome question. So the question is, are all little wiggles in changing class bad?"},{"start":1154.36,"text":"And the answer is, of course not."},{"start":1155.82,"text":"Even on this model, which I claimed was good, a little wiggle does change potentially the thing if you're close to the decision surface."},{"start":1162.22,"text":"It will always be the case that some models come in."},{"start":1165.18,"text":"What I'm trying to get across here, and it's a great point, I didn't do a wonderful job on it, is if you have these things which are somehow discontinuous in the space,"},{"start":1172.14,"text":"then the space, the featurization somehow doesn't quite capture the class."},{"start":1176.22,"text":"And so what's going on there is you have these little pockets or these little islands, and it can just be kind of overfitting."},{"start":1181.3,"text":"This is the analog of what you were seeing when you saw the function kind of wildly off."}],"speech_gaps":[{"start":1141.328,"end":1150.12}],"frame":"../frames/v047/007.webp","frame_time":1030.5700000000002},{"title":"数据集划分与机器学习建议","segments":[{"id":110,"text":"And so we tend to think, hey, this may be a warning sign. But you're exactly right that this could actually just be the class boundary. That could also be the case. It just seems intuitively less likely. Great question. Others? Awesome. All right. Bias, variance, decomposition. So we're going to talk about this precise model of overfitting and underfitting now. And it's going to be just a very simple mathematical thought procedure. So let's walk through exactly how it works. So here's a thought procedure. We're going to fix a test point x."},{"id":111,"text":"And really, I'm not going to be precise about how we pick x, but your reasoning shouldn't depend on x. You're not going to pick something specific about the function. You're not going to look at its decision surface or anything else. You're kind of picking a generic function x. Does that make sense? Then you're going to draw n training points, xi's and yi's. That's your si that you had from before, the last slide. This is one sample of the training set."},{"id":112,"text":"Then you're going to train a linear regressor or a hypothesis, whatever hypothesis you want. For this point of view, linear regressor is probably overkill. I should just cross that out. It doesn't really matter what we're going to do next. Who cares about this? You're going to train a hypothesis, H. Get that hypothesis on there."},{"id":113,"text":"And then you're going to measure this quantity, which has a fancy name. It's sometimes called statistical risk. But you're basically going to say, with the h that I've learned on the set, that's what this h of s notation means. So you've given me a training set. I fit a line or a quadratic or whatever my hypothesis class is. I'm going to use that to predict on the x that I selected at this test point, its y value. And I'm going to suffer in the terminology. It's kind of a grim way to put it, but it is the terminology. I'm going to suffer a loss."},{"id":114,"text":"And then you're going to measure this quantity, which has a fancy name. It's sometimes called statistical risk. But you're basically going to say, with the h that I've learned on the set, that's what this h of s notation means. So you've given me a training set. I fit a line or a quadratic or whatever my hypothesis class is. I'm going to use that to predict on the x that I selected at this test point, its y value. And I'm going to suffer in the terminology. It's kind of a grim way to put it, but it is the terminology. I'm going to suffer a loss."},{"id":115,"text":"But it's just uniformity. Train and test are the same. All right. Now, what we're going to analyze is a procedure that's actually quite complicated if you thought through the details of it, which is we're going to average over all the randomness that we did in this and try and analyze the quantities underneath the covers."}],"notes":["本段讲解了机器学习中模型评估的基本思想，即通过固定测试点并使用训练集训练模型，然后在测试集上评估模型的性能。这里强调了模型的预测误差，即统计风险，它与模型在测试点上的预测值和真实值之间的差异有关。","讲者提到，模型的预测误差可以分解为两部分：模型本身的偏差（bias）和数据的噪声（error）。偏差反映了模型对数据的拟合能力，而噪声则代表了数据本身的不确定性。","在讲解过程中，讲者指出，测试数据和训练数据的生成方式是相同的，因此模型在测试集上的表现可以用来评估其泛化能力。同时，讲者提到，模型的预测误差与测试点的噪声有关，这在后续的计算中会进一步展开。","讲者还提到，模型的预测误差可以通过平方损失来衡量，这与模型在测试点上的预测值和真实值之间的差异有关。这种损失函数是机器学习中常用的评估指标。","最后，讲者指出，为了分析模型的性能，需要对整个过程中的随机性进行平均，从而得到模型在不同数据集上的平均表现。这种分析方法是理解模型泛化能力的重要工具。","讲者强调，模型的预测误差不仅与模型本身的结构有关，还与数据的生成方式有关。因此，在评估模型时，需要考虑数据的噪声和模型的偏差，以全面理解模型的性能。"],"formulas":[{"latex":"L(h, x) = (Y - h(x))^2","symbols":"损失函数，表示模型预测值与真实值之间的平方误差","explanation":"该公式正确表达了平方误差损失函数，其中Y是真实值，h(x)是模型预测值。","evidence":"Proportional to the square. That's the risk. Please. Great question. So where does the question is, why are we adding this Y error underneath the covers? And that Y error is something that we would observe on any point, right? So the mental model is that this is the way that data are created. And the test data is created in the same way as the train is created, that we would have that underneath the covers. We will guess that it's this value. And we'll come to exactly how that epsilon figures into our calculations in just one second."},{"latex":"R(h) = \\mathbb{E}[L(h, x)]","symbols":"统计风险，表示模型在所有可能的测试点上的平均损失","explanation":"该公式正确表达了统计风险，即对损失函数L(h, x)在所有可能的测试点x上的期望值。","evidence":"Proportional to the square. That's the risk. Please. Great question. So where does the question is, why are we adding this Y error underneath the covers? And that Y error is something that we would observe on any point, right? So the mental model is that this is the way that data are created. And the test data is created in the same way as the train is created, that we would have that underneath the covers. We will guess that it's this value. And we'll come to exactly how that epsilon figures into our calculations in just one second."}],"uncertainties":["Y error"],"diagram":"none","start":1185.42,"end":1362.08,"asr_flags":[],"math_clarifications":["公式中的期望符号应使用\\mathbb{E}以符合数学惯例。"],"raw_segments":[{"start":1185.42,"text":"And so we tend to think, hey, this may be a warning sign. But you're exactly right that this could actually just be the class boundary. That could also be the case. It just seems intuitively less likely. Great question. Others? Awesome. All right. Bias, variance, decomposition. So we're going to talk about this precise model of overfitting and underfitting now. And it's going to be just a very simple mathematical thought procedure. So let's walk through exactly how it works. So here's a thought procedure. We're going to fix a test point x."},{"start":1220.6,"text":"And really, I'm not going to be precise about how we pick x, but your reasoning shouldn't depend on x. You're not going to pick something specific about the function. You're not going to look at its decision surface or anything else. You're kind of picking a generic function x. Does that make sense? Then you're going to draw n training points, xi's and yi's. That's your si that you had from before, the last slide. This is one sample of the training set."},{"start":1246.03,"text":"Then you're going to train a linear regressor or a hypothesis, whatever hypothesis you want. For this point of view, linear regressor is probably overkill. I should just cross that out. It doesn't really matter what we're going to do next. Who cares about this? You're going to train a hypothesis, H. Get that hypothesis on there. Then you're going to draw a fresh sample at test time, X and Y, and you're going to check this. You're going to compute what is the model, Y at that point."},{"start":1281.32,"text":"And then you're going to measure this quantity, which has a fancy name. It's sometimes called statistical risk. But you're basically going to say, with the h that I've learned on the set, that's what this h of s notation means. So you've given me a training set. I fit a line or a quadratic or whatever my hypothesis class is. I'm going to use that to predict on the x that I selected at this test point, its y value. And I'm going to suffer in the terminology. It's kind of a grim way to put it, but it is the terminology. I'm going to suffer a loss."},{"start":1310.96,"text":"Proportional to the square. That's the risk. Please. Great question. So where does the question is, why are we adding this Y error underneath the covers? And that Y error is something that we would observe on any point, right? So the mental model is that this is the way that data are created. And the test data is created in the same way as the train is created, that we would have that underneath the covers. We will guess that it's this value. And we'll come to exactly how that epsilon figures into our calculations in just one second."},{"start":1341.86,"text":"But it's just uniformity. Train and test are the same. All right. Now, what we're going to analyze is a procedure that's actually quite complicated if you thought through the details of it, which is we're going to average over all the randomness that we did in this and try and analyze the quantities underneath the covers."}],"speech_gaps":[],"frame":"../frames/v047/008.webp","frame_time":1197.42},{"title":"数据集划分与机器学习建议","segments":[{"id":116,"text":"This is different than the way we've been thinking, where just one training set comes to us. We're going to think about all the training sets that we could have produced. So we have two sources of randomness. The draw of S, that means this step here where we draw n training points. So it's going to be drawn according to some random process. And then the draw of epsilon at the test point, which is this epsilon we just discussed. Clear enough? Now, we talked about this already, but this is just to recap."},{"id":117,"text":"Why is this true data point? H star, this is the true model. Remember on our quadratic, which came before? This was the fact that there existed a quadratic with exactly the right theta 1, theta 2, theta 0 that we had before. And we generated all the data. And we fit this model, H of s, on our training data s. This is what we're looking at. Now, the quantity we care about from that last thing is this expected value."},{"id":118,"text":"This is the expected value over the epsilon error. This is the error that was introduced on the test point. And s, which was the draw, which produced this function. And we're going to try and decompose that error into three pieces. Please. Is there a way to assume that we have enough parameters in our points x to correctly predict y? Wonderful question."},{"id":119,"text":"This universal function can't be supported. That's the case, right? Wonderful question. So the question is, can we assume, or do we have to assume for this analysis, that h actually can get to a zero-loss solution, that there exists an h which exactly fits y? We don't have to assume that to get here. We'll see where we pay for that. If, for example, we're fitting h's that are too small, they're linear, and we wanted a quadratic, we should pay for that somewhere. And you're going to see one term that we pay for that in a little bit."},{"id":120,"text":"There's also going to be a separate variance term. But there's nothing here that requires, like, we could pick a completely insane set of H's here. We could still analyze it. Yeah. The true data generating process uses all the coordinates of X. So I don't know about coordinates. So it's true. OK, so one thing that you could think, which is not linked in my head, but just to make sure it's clear is,"},{"id":121,"text":"The data generating process is some function h star. You could say it's only reasonable that our h of s that we have down here contains h star. So a set of all h's that we could learn should contain h star. And that would be a fairly sensible thing to do, and in most setups we'll do it. But it's actually, strictly speaking, not necessary, because it could be that h is drawn from some other function class, and we're representing it in a different way. And everything I'm going to say will also go through."}],"notes":["本段讨论了机器学习中误差分解的三个组成部分，即偏差、方差和噪声。讲者指出，我们不需要假设模型能够达到零损失，因为即使模型无法完全拟合数据，分析仍然可以进行。此外，讲者提到数据生成过程使用了所有X的坐标，但并不需要假设模型集合包含真实函数h*，因为模型可以来自其他函数类。","讲者强调了模型复杂度与误差之间的关系，指出如果模型过于简单（如线性模型用于拟合二次函数），会导致误差增加。这种误差可以分解为偏差、方差和噪声三个部分，其中偏差与模型的复杂度有关，方差与训练数据的随机性有关，而噪声则是测试点本身的随机误差。","讲者提到，虽然通常会假设模型集合包含真实函数h*，但这并不是严格必要的。模型可以来自其他函数类，只要能够正确表示数据生成过程即可。这种灵活性使得分析仍然有效。","讲者指出，数据生成过程使用了所有X的坐标，但并未明确说明这些坐标的具体形式或分布。因此，关于数据生成过程的假设可能需要进一步澄清。","讲者提到，模型集合可以是任意的，包括完全不合理的集合，但分析仍然可以进行。这表明模型集合的选择对误差分解的分析具有重要影响。","讲者最后指出，即使模型集合不包含真实函数h*，分析仍然有效，因为所有讨论的内容都适用于不同的函数类。这表明误差分解的分析具有广泛的适用性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1362.69,"end":1522.57,"asr_flags":[],"raw_segments":[{"start":1362.69,"text":"This is different than the way we've been thinking, where just one training set comes to us. We're going to think about all the training sets that we could have produced. So we have two sources of randomness. The draw of S, that means this step here where we draw n training points. So it's going to be drawn according to some random process. And then the draw of epsilon at the test point, which is this epsilon we just discussed. Clear enough? Now, we talked about this already, but this is just to recap."},{"start":1391.87,"text":"Why is this true data point? H star, this is the true model. Remember on our quadratic, which came before? This was the fact that there existed a quadratic with exactly the right theta 1, theta 2, theta 0 that we had before. And we generated all the data. And we fit this model, H of s, on our training data s. This is what we're looking at. Now, the quantity we care about from that last thing is this expected value."},{"start":1418.34,"text":"This is the expected value over the epsilon error. This is the error that was introduced on the test point. And s, which was the draw, which produced this function. And we're going to try and decompose that error into three pieces. Please. Is there a way to assume that we have enough parameters in our points x to correctly predict y? Wonderful question."},{"start":1442.13,"text":"This universal function can't be supported. That's the case, right? Wonderful question. So the question is, can we assume, or do we have to assume for this analysis, that h actually can get to a zero-loss solution, that there exists an h which exactly fits y? We don't have to assume that to get here. We'll see where we pay for that. If, for example, we're fitting h's that are too small, they're linear, and we wanted a quadratic, we should pay for that somewhere. And you're going to see one term that we pay for that in a little bit."},{"start":1468.59,"text":"There's also going to be a separate variance term. But there's nothing here that requires, like, we could pick a completely insane set of H's here. We could still analyze it. Yeah. The true data generating process uses all the coordinates of X. So I don't know about coordinates. So it's true. OK, so one thing that you could think, which is not linked in my head, but just to make sure it's clear is,"},{"start":1497.95,"text":"The data generating process is some function h star. You could say it's only reasonable that our h of s that we have down here contains h star. So a set of all h's that we could learn should contain h star. And that would be a fairly sensible thing to do, and in most setups we'll do it. But it's actually, strictly speaking, not necessary, because it could be that h is drawn from some other function class, and we're representing it in a different way. And everything I'm going to say will also go through."}],"speech_gaps":[],"frame":"../frames/v047/009.webp","frame_time":1374.69},{"title":"数据集划分与机器学习建议","segments":[{"id":122,"text":"We'll see exactly what assumptions I need to make. Basically, what I'm going to need to make is I'm going to need to be able to analyze how H performs on the training set, and I'm going to be able to analyze the error. And let's come back and talk about it after we walk through. But there doesn't have to be an assumption that H star and H are related, or that even all of the coordinates of X. It could, for example, ignore some fraction of X, maybe the first two coordinates, and predict Y solely from that. H star is free to do kind of whatever it wants."},{"id":123,"text":"It's true, I will say, intuitively though, although that's true, it's a weird thing to do to predict a model that can't possibly be in the class. I'm just saying there's formally, there's no reason that you have to. Okay. All right. So there are two independent sources of randomness, the training set size and then epsilon. And why are they independent? Because of the way we set up the model. We did the sample, we took the points, and we added some independent noise. So they are going to be independent. And that's really what we're going to use here. Okay."},{"id":124,"text":"H of s, it's worth saying, this is a crazy difficult random variable. Think about how complicated it is. It's the random variable that comes from, I sample an entire training set, and then I train a model on top of it. So I randomly sample points, and I train a model on top of it. For maybe a linear model, you could think what this is. You compute some inverse over the data you sampled, all the rest. You can compute that answer. It's called a fixed design problem. You can't actually go through that. But if you have some complicated neural net, whatever it is,"},{"id":125,"text":"This is actually a very complex variable of S,"},{"id":126,"text":"but we only need certain properties of it,"},{"id":127,"text":"and those are the ones to fixate on."},{"id":128,"text":"We only need that we can take an expectation over it,"},{"id":129,"text":"that the expectation is well-defined in a way that I'll make precise."},{"id":130,"text":"The second thing is the test point."},{"id":131,"text":"This is a very simple random variable by contrast."},{"id":132,"text":"This is the one we've been dealing with for quite a bit."},{"id":133,"text":"It's just that we're adding in some epsilon noise,"},{"id":134,"text":"some zero mean epsilon noise."},{"id":135,"text":"All right, so let's go through it."},{"id":136,"text":"All right, so we're going to expand this function."},{"id":137,"text":"Okay? This is just expanding the definition of y."},{"id":138,"text":"And now we're going to expand the square. Oh, please."},{"id":139,"text":"."},{"id":140,"text":"You said that H of S is like a very complicated function, but like S is like something which"},{"id":141,"text":"is like randomly sampling from the entire set, and then that basically captures like"},{"id":142,"text":"a limited representation of the data."},{"id":143,"text":"So shouldn't H of S be like a similar function?"},{"id":144,"text":"Yeah, so you're making it relatively safe."},{"id":145,"text":"It's a great question."},{"id":146,"text":"So when I say it's complicated, the way that H is defined is as the result of a procedure"},{"id":147,"text":"which makes it difficult to analyze. And it's exactly the procedure you said. I've sampled"},{"id":148,"text":"some function s. I've then taken that point. Maybe it's a billion points that I have. I run"},{"id":149,"text":"some very complicated SGD, LBFGS, whatever algorithm on it. And I've produced the function"},{"id":150,"text":"that's my final estimate. And my point is that h would be very difficult for you to write down"},{"id":151,"text":"without performing the example I just said and being able to compute, say, its expectation,"}],"notes":["本段讨论了机器学习中关于假设和模型分析的问题。讲者指出，H（假设空间）和H星（最优模型）之间不需要有关系，甚至不需要使用所有特征。例如，模型可以忽略部分特征，仅基于部分特征进行预测。这说明了模型的灵活性和假设空间的定义。","讲者提到，训练集大小和epsilon（测试误差）是两个独立的随机源。这是因为模型的构建方式：我们从数据中采样，然后添加独立的噪声。这种独立性是分析模型性能的重要基础。","H of S（基于训练集的模型）是一个非常复杂的随机变量，因为它涉及从数据中采样并训练模型的过程。对于简单的模型（如线性模型），可以计算其逆，但对于复杂的模型（如神经网络），则难以直接写出其表达式。","讲者强调，我们只需要关注H of S的某些性质，例如期望值的定义。这表明在分析模型时，不需要完全理解其复杂性，而是关注关键的统计特性。","测试点是一个相对简单的随机变量，它仅涉及添加零均值的噪声。这与训练集的复杂性形成对比，说明了测试误差的来源。","讲者通过一个例子说明了H的复杂性：从数据中采样，运行复杂的优化算法（如SGD或LBFGS），最终得到一个难以直接写出的模型。这强调了模型训练过程的随机性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1523.1,"end":1703.06,"asr_flags":[],"raw_segments":[{"start":1523.1,"text":"We'll see exactly what assumptions I need to make. Basically, what I'm going to need to make is I'm going to need to be able to analyze how H performs on the training set, and I'm going to be able to analyze the error. And let's come back and talk about it after we walk through. But there doesn't have to be an assumption that H star and H are related, or that even all of the coordinates of X. It could, for example, ignore some fraction of X, maybe the first two coordinates, and predict Y solely from that. H star is free to do kind of whatever it wants."},{"start":1551.12,"text":"It's true, I will say, intuitively though, although that's true, it's a weird thing to do to predict a model that can't possibly be in the class. I'm just saying there's formally, there's no reason that you have to. Okay. All right. So there are two independent sources of randomness, the training set size and then epsilon. And why are they independent? Because of the way we set up the model. We did the sample, we took the points, and we added some independent noise. So they are going to be independent. And that's really what we're going to use here. Okay."},{"start":1583.07,"text":"H of s, it's worth saying, this is a crazy difficult random variable. Think about how complicated it is. It's the random variable that comes from, I sample an entire training set, and then I train a model on top of it. So I randomly sample points, and I train a model on top of it. For maybe a linear model, you could think what this is. You compute some inverse over the data you sampled, all the rest. You can compute that answer. It's called a fixed design problem. You can't actually go through that. But if you have some complicated neural net, whatever it is,"},{"start":1611.4,"text":"This is actually a very complex variable of S,"},{"start":1613.98,"text":"but we only need certain properties of it,"},{"start":1616.32,"text":"and those are the ones to fixate on."},{"start":1617.68,"text":"We only need that we can take an expectation over it,"},{"start":1620.04,"text":"that the expectation is well-defined in a way that I'll make precise."},{"start":1623.54,"text":"The second thing is the test point."},{"start":1625.98,"text":"This is a very simple random variable by contrast."},{"start":1628.44,"text":"This is the one we've been dealing with for quite a bit."},{"start":1630.68,"text":"It's just that we're adding in some epsilon noise,"},{"start":1633.42,"text":"some zero mean epsilon noise."},{"start":1635.76,"text":"All right, so let's go through it."},{"start":1638.44,"text":"All right, so we're going to expand this function."},{"start":1641.34,"text":"Okay? This is just expanding the definition of y."},{"start":1647.06,"text":"And now we're going to expand the square. Oh, please."},{"start":1650.06,"text":"."},{"start":1651.52,"text":"You said that H of S is like a very complicated function, but like S is like something which"},{"start":1657.36,"text":"is like randomly sampling from the entire set, and then that basically captures like"},{"start":1664.0,"text":"a limited representation of the data."},{"start":1665.3,"text":"So shouldn't H of S be like a similar function?"},{"start":1669.36,"text":"Yeah, so you're making it relatively safe."},{"start":1671.02,"text":"It's a great question."},{"start":1671.82,"text":"So when I say it's complicated, the way that H is defined is as the result of a procedure"},{"start":1678.68,"text":"which makes it difficult to analyze. And it's exactly the procedure you said. I've sampled"},{"start":1682.86,"text":"some function s. I've then taken that point. Maybe it's a billion points that I have. I run"},{"start":1687.58,"text":"some very complicated SGD, LBFGS, whatever algorithm on it. And I've produced the function"},{"start":1693.44,"text":"that's my final estimate. And my point is that h would be very difficult for you to write down"},{"start":1698.34,"text":"without performing the example I just said and being able to compute, say, its expectation,"}],"speech_gaps":[],"frame":"../frames/v047/010.webp","frame_time":1535.1},{"title":"数据集划分与机器学习建议","segments":[{"id":152,"text":"its variance, all the rest of it. So I'm saying it's a complicated variable. In contrast,"},{"id":153,"text":"Epsilon, just a normal random variable. We know almost everything about it by assumption. That"},{"id":154,"text":"was the contrast I was making. Please. So Epsilon is going to be, again, great question. So what is"},{"id":155,"text":"Epsilon? Epsilon is going to be this character right here, which is the noise that's introduced"},{"id":156,"text":"on every point. So the way we set up our model is all data is generated according to this process."},{"id":157,"text":"Both train and test are generated with this process. And that Epsilon happens to be the"},{"id":158,"text":"Epsilon that I picked for that test point. Yeah, wonderful question."},{"id":159,"text":"So why do you need this symmetry and not like epsilon?"},{"id":160,"text":"Why can't you just run inference without error?"},{"id":161,"text":"So you could."},{"id":162,"text":"I mean, you could just set this to 0 if you wanted,"},{"id":163,"text":"but then you would have a less expressive model."},{"id":164,"text":"But that's also the other bit that we've talked about here"},{"id":165,"text":"is you don't get rid of measurement error at test time."},{"id":166,"text":"So the point that was like, what does epsilon actually capture?"},{"id":167,"text":"If you had something that captured absolutely"},{"id":168,"text":"every element of your domain, then"},{"id":169,"text":"it would be appropriate to set epsilon equal to 0."},{"id":170,"text":"But if you have any of the settings"},{"id":171,"text":"that we've talked about, you have measurement error"},{"id":172,"text":"in a sensor, or you have some bit"},{"id":173,"text":"of little bias that's done or some lag in the measurement whatever it is all those things are"},{"id":174,"text":"kind of generally thrown into there's some amount of measurement error or loss then and that's why"},{"id":175,"text":"we set this up and so having these two processes be the same and have the same amount of errors"},{"id":176,"text":"um you know you don't strictly speaking need to do it but it certainly makes things a lot easier"},{"id":177,"text":"but you i would say the part that i would object to is the test data is also messy it's not some"},{"id":178,"text":"things you want to do and if you want to figure out what happens when epsilon goes to zero just"},{"id":179,"text":"Just set the variance to 0 in the next thing."},{"id":180,"text":"It will fall out pretty cleanly."},{"id":181,"text":"Please."},{"id":182,"text":"similar, like,"},{"id":183,"text":"why do we need epsilon to be having this boundary"},{"id":184,"text":"?"},{"id":185,"text":"Or is that not represented?"},{"id":186,"text":"Yeah, wonderful question."},{"id":187,"text":"So the question is, why do we have two sources of randomness"},{"id":188,"text":"here, and what are they doing?"},{"id":189,"text":"One is about selecting the points, the endpoints"},{"id":190,"text":"that we're going to train on."},{"id":191,"text":"That is one bit of randomness that we're going to analyze."},{"id":192,"text":"Those points are brought in."},{"id":193,"text":"They have the Xs and the Ys and all that data that's there."},{"id":194,"text":"And then we're going to train on that point."},{"id":195,"text":"The reason, conceptually, we want to then have a test error,"},{"id":196,"text":"which is at test time, we've selected a new point."},{"id":197,"text":"And that point also has errors."},{"id":198,"text":"We want to be clear that there are things going on at train set and test set that are different."},{"id":199,"text":"And that, in fact, when we look across them,"},{"id":200,"text":"we want to understand what the effects of thos
