</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】数据集划分与机器学习建议 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v047.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v047","title":"【斯坦福CS229】数据集划分与机器学习建议","course":"机器学习","pages":[{"title":"数据集划分与机器学习建议","segments":[{"id":0,"text":"Welcome to Lecture 6. Today we're going to talk about bias and variance. So you're going to see a really canonical trade-off in machine learning between bias and variance, bias squared and variance.","zh":"欢迎来到第6讲。今天我们将讨论偏差和方差。你将会看到机器学习中一个非常经典的权衡，即偏差和方差，偏差平方和方差。","start":5.14,"end":16.02},{"id":1,"text":"That's going to lead us into some discussions about regularization, model selection, and some other things there. In particular, when we start to go through this, you're going to see some stuff that I hope is actually quite useful when you do machine learning in practice. We'll first talk about this fundamental tension in models, which are overfitting and underfitting. You'll go through this, we'll motivate exactly what those two concepts mean. Then I'm going to try and give you a modern twist on that a little bit later.","zh":"这将引导我们进入关于正则化、模型选择以及其他相关话题的讨论。特别是在我们开始深入探讨时，你将会看到一些我认为在实际进行机器学习时非常有用的内容。我们将首先讨论模型中的这一根本性矛盾，即过拟合和欠拟合。你将会经历这些内容，我们将明确解释这两个概念的含义。然后，我稍后会尝试从现代的角度对这些内容进行一些补充。","start":16.53,"end":44.31},{"id":2,"text":"Overfitting and underfitting are naturally going to lead into bias and variance. So once we have kind of the picture version of how overfitting and underfitting work, we'll do the mathematical version. That will be the bias-variance trade-off that is very famous. It's one of those things you hear about for machine learning. And then that will motivate a particular technique regularization. It's really a class of techniques to reduce the variance for the models. And we'll see why that's so critical.","zh":"过拟合和欠拟合自然会引导我们进入偏差和方差的讨论。一旦我们对过拟合和欠拟合的工作原理有了大致的图景，我们将进行数学上的分析。这将是我们非常著名的偏差-方差权衡。这是你在机器学习中经常听到的一个概念。然后，这将引导我们进入一种特定的技术，即正则化。它实际上是一类用于降低模型方差的技术。我们将看到为什么这一点如此关键。","start":44.9,"end":68.64},{"id":3,"text":"And I couldn't help myself. There are two places I put in kind of a modern twist that I think are helpful. One is I'm going to tell you about two fairly recent-ish papers, which are called Double Descent, which is how bias variance, the classical way I'm going to teach you for the first part of the lecture, how it deals with modern models, which I think is really interesting to know. And you should just be at least aware that it exists. This is something that...","zh":"我忍不住要提到两个地方，我认为它们是有帮助的现代视角。一个是我要告诉你两篇相对较新的论文，它们被称为双重下降（Double Descent），这描述了偏差-方差的经典方式，即我在本讲前半部分将教给你的内容，如何处理现代模型，我认为这非常有趣。你应该至少了解它的存在。这是人们正在积极研究的一个领域。","start":69.31,"end":94.23},{"id":4,"text":"people are working on quite a bit. And we'll also talk about this very cool paper I was actually talking with one of the senior authors this morning, which is called ImageNet to ImageNet v2, which talks a little bit about another form of overfitting that you could worry about, which is called adaptive overfitting, and why that actually hasn't been a problem in models. So I really want to share those with you because I think they're pretty interesting lessons about where machine learning is going.","zh":"我们还将讨论一篇非常有趣的论文，我今天早上实际上和其中一位资深作者进行了交谈，这篇论文叫做ImageNet到ImageNet v2，它稍微提到了另一种你可能需要担心的过拟合形式，称为自适应过拟合，以及为什么这种形式在模型中实际上并没有成为问题。我真的很想与你们分享这些内容，因为我认为它们是关于机器学习发展方向的一些非常有趣的教训。","start":94.54,"end":117.24},{"id":5,"text":"We'll talk about model and parameter selection, train, dev, and test splits. We'll talk about a very classical method from stats, which is called k-fold cross-validation. You may have seen this method before. We'll be able to analyze it quite cleanly. And then we'll talk about this compute-efficient algorithm called Hyperband, which is an algorithm I love. It's by some friends. One is at CMU now. One's at Washington. And it's a very compute-efficient way to fit parameters, to tune hyperparameters.","zh":"我们将讨论模型和参数选择，训练集、开发集和测试集的划分。我们将讨论一种非常经典的统计方法，称为k折交叉验证。你可能之前已经见过这种方法。我们将能够对其做出相当清晰的分析。然后我们将讨论一种计算效率高的算法，称为Hyperband，这是一种我非常喜欢的算法。它是由一些朋友开发的。其中一位现在在卡内基梅隆大学，另一位在华盛顿大学。它是一种非常计算高效的参数拟合方法，用于调整超参数。","start":118.78,"end":146.26},{"id":6,"text":"And it's just very simple and clean. It has four slide animation. And you get the idea. And it's actually really useful. It actually has nice theory underneath the covers. We won't do that here as well. But that's a good way to actually tune parameters in a bunch of places. So today, we're really wrestling with this really central question in machine learning. Given a finite, noisy sample,","zh":"它非常简单且清晰。它有四个动画幻灯片。你可以从中得到大致的思路。实际上，它在背后有着非常有用的理论支持。我们在这里也不会深入讲解这部分内容。但这是实际在多个地方调整参数的一种很好的方法。今天，我们真正要解决的是机器学习中一个非常核心的问题。给定一个有限的、带有噪声的样本，","start":146.7,"end":168.66}],"notes":["本段介绍了机器学习中偏差与方差的经典权衡，以及现代机器学习中的一些新趋势，如双下降现象和自适应过拟合。这些概念帮助理解模型在训练和泛化中的表现，以及如何通过正则化等技术来减少方差。","讲者提到双下降现象，这是近年来在机器学习领域引起广泛关注的新研究方向，表明随着模型复杂度的增加，测试误差可能先下降后上升，再下降，这与传统的偏差-方差权衡不同。","自适应过拟合是另一种过拟合形式，但讲者指出在现代模型中，这种现象并未成为主要问题，这可能与模型的结构或数据的特性有关。","讲者还介绍了模型选择和参数调整的方法，包括k折交叉验证和Hyperband算法。这些方法在实际应用中非常有用，能够帮助优化模型性能。","Hyperband算法是一种计算效率高的超参数调优方法，通过分层的随机搜索策略来减少计算资源的消耗，同时保持较高的搜索效率。","最后，讲者强调了在有限且带有噪声的数据样本下，如何选择合适的模型和参数是机器学习中的核心问题，这需要结合理论分析和实际经验。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.14,"end":168.66,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.14,"text":"Welcome to Lecture 6. Today we're going to talk about bias and variance. So you're going to see a really canonical trade-off in machine learning between bias and variance, bias squared and variance."},{"start":16.53,"text":"That's going to lead us into some discussions about regularization, model selection, and some other things there. In particular, when we start to go through this, you're going to see some stuff that I hope is actually quite useful when you do machine learning in practice. We'll first talk about this fundamental tension in models, which are overfitting and underfitting. You'll go through this, we'll motivate exactly what those two concepts mean. Then I'm going to try and give you a modern twist on that a little bit later."},{"start":44.9,"text":"Overfitting and underfitting are naturally going to lead into bias and variance. So once we have kind of the picture version of how overfitting and underfitting work, we'll do the mathematical version. That will be the bias-variance trade-off that is very famous. It's one of those things you hear about for machine learning. And then that will motivate a particular technique regularization. It's really a class of techniques to reduce the variance for the models. And we'll see why that's so critical."},{"start":69.31,"text":"And then I couldn't help myself. There are two places I put in kind of a modern twist that I think are helpful. One is I'm going to tell you about two fairly recent-ish papers, which are called Double Descent, which is how bias variance, the classical way I'm going to teach you for the first part of the lecture, how it deals with modern models, which I think is really interesting to know. And you should just be at least aware that it exists. This is something that..."},{"start":94.54,"text":"people are working on quite a bit. And we'll also talk about this very cool paper I was actually talking with one of the senior authors this morning, which is called ImageNet to ImageNet v2, which talks a little bit about another form of overfitting that you could worry about, which is called adaptive overfitting, and why that actually hasn't been a problem in models. So I really want to share those with you because I think they're pretty interesting lessons about where machine learning is going."},{"start":118.78,"text":"We'll talk about model and parameter selection, train, dev, and test splits. We'll talk about a very classical method from stats, which is called k-fold cross-validation. You may have seen this method before. We'll be able to analyze it quite cleanly. And then we'll talk about this compute-efficient algorithm called Hyperband, which is an algorithm I love. It's by some friends. One is at CMU now. One's at Washington. And it's a very compute-efficient way to fit parameters, to tune hyperparameters."},{"start":146.7,"text":"And it's just very simple and clean. It has four slide animation. And you get the idea. And it's actually really useful. It actually has nice theory underneath the covers. We won't do that here as well. But that's a good way to actually tune parameters in a bunch of places. So today, we're really wrestling with this really central question in machine learning. Given a finite, noisy sample,"}],"speech_gaps":[],"frame":"../frames/v047/001.webp","frame_time":17.14},{"title":"数据集划分与机器学习建议","segments":[{"id":7,"text":"How do we pick a model that will generalize? And this is the key question in machine learning. This is what motivated both statistical theory and what we do now. We're going to train a model on some train set. We're going to apply it on some test set. And we'd like to have some procedure that on that training set guarantees, to the extent possible, that we behave in that form on future data sets. So this is the critical question in machine learning. We're going to talk about it.","zh":"我们如何选择一个能够泛化的模型？这是机器学习中的关键问题。这既是统计理论发展的动力，也是我们现在所做的事情。我们将在一个训练集上训练模型，然后将其应用于某个测试集。我们希望有一个过程，能够在训练集上保证，在尽可能大的程度上，我们在未来的数据集上也能表现出类似的行为。因此，这是机器学习中的核心问题。我们将对此进行讨论。","start":169.5,"end":196.15},{"id":8,"text":"Okay, so let's get some pictures about overfitting versus underfitting and hopefully make this concept crystal clear in your head. So here's the setup. There exists some true function in the world. We don't get to see those functions that are there. But this true function, which I've drawn here for illustration, is this function h of theta, which is going to be some quadratic.","zh":"好的，那么让我们通过一些图像来理解过拟合与欠拟合的区别，并希望能让这个概念在你的脑海中变得清晰。这里是一个设定：世界上存在一个真实的函数。我们无法直接看到这些存在的函数。但这里我画出的这个真实的函数，即h(theta)，将是一个二次函数。","start":196.89,"end":216.55},{"id":9,"text":"Now, it's weighted by some parameters, theta 2, theta 1, and theta 0. And it generates the real world. So this is the forward model for our data. But we never, ever get to see h. We're going to try and learn h. So we'll only observe h through data. This is what we've been doing for the whole course, so hopefully not super surprising now. What that means is we're going to have yi, which is the data we observe. It's going to be some function h theta of xi plus some noise term. And here, I'm going to assume the noise is Gaussian.","zh":"现在，这个函数被一些参数theta2、theta1和theta0加权。它生成了真实世界。因此，这是我们的数据的前向模型。但我们永远、永远看不到h。我们将尝试学习h。因此，我们只能通过数据来观察h。这是我们整个课程一直在做的事情，所以现在应该不会太令人惊讶。这意味着我们将有yi，即我们观察到的数据。它将是xi的某个函数h(theta)加上一个噪声项。在这里，我假设噪声是高斯分布的。","start":218.53,"end":247.07},{"id":10,"text":"Same setup we've done in a couple different ways. So here I've charted x and y in some particular nice example where x is going to just be some polynomial function. And indeed, there's the true function. And then we've gotten some noisy samples. These characters are really close to the line. These characters are a little bit further away from the line. There's a little bit more error there. So what I want to point out, though, is that when you get a training set, every set","zh":"这是我们以几种不同方式已经进行过的相同设定。在这里，我绘制了x和y在一个特定的、很好的例子中，其中x将只是一个多项式函数。确实，这就是真实的函数。然后我们得到了一些带有噪声的样本。这些字符非常接近直线。这些字符则稍微远离直线。那里的误差更大一些。不过，我想指出的是，当你获得一个训练集时，每一个集合","start":247.41,"end":275.23},{"id":11,"text":"Every fresh data set is just a different set of points. And we're going to come back to, we're going to analyze what happens as we change those points in a bit. So we could judge our model based on exactly just the data we've seen. It turns out that's hard because we want to actually, the kind of guarantees that we can actually prove reliably are something that say, maybe we got a really bad training set. Maybe we just sampled one point again and again and again and ignored the rest of the function. That could be pretty bad.","zh":"每一个新的数据集都只是不同的点集合。我们稍后会回到这一点，分析当我们改变这些点时会发生什么。因此，我们可以仅根据我们所看到的数据来评估我们的模型。实际上，这很困难，因为我们希望获得能够可靠证明的保证，比如，也许我们得到了一个非常糟糕的训练集。也许我们只是反复采样了一个点，而忽略了函数的其余部分。这可能会非常糟糕。","start":275.69,"end":302.67},{"id":12,"text":"Just the same point again and again and again. So we want to have this randomness over all the training sets that we could have seen. And we hope that our function trains well, meaning it's got to produce something that's close to this true set when it's fed different training sets. So is the model clear? So far, we've thought of there being training sets fixed, but now we're thinking about the training set itself is going to be a sample from some population.","zh":"只是不断地重复同一个点。因此，我们希望在所有可能的训练集中具有随机性。我们希望我们的模型能够很好地训练，这意味着当它被不同的训练集输入时，它必须产生一个接近真实集合的结果。那么，模型是否清晰？到目前为止，我们一直认为训练集是固定的，但现在我们考虑训练集本身是从某个总体中采样的。","start":303.13,"end":328.64}],"notes":["本段讨论了机器学习中的核心问题，即如何选择一个能够泛化的模型。讲者指出，这是机器学习的关键问题，既推动了统计理论的发展，也指导了当前的实践。通过训练集和测试集的划分，讲者强调了模型在面对未来数据时的表现，这需要一种保证模型行为一致性的过程。","讲者通过一个具体的例子来解释过拟合和欠拟合的概念。他提到存在一个真实的函数，该函数是二次函数，并通过参数θ2、θ1和θ0进行加权，生成真实世界的数据。但这个真实函数h是不可见的，只能通过数据来学习。数据由真实函数加上高斯噪声组成，这为后续的模型训练和评估提供了基础。","讲者进一步说明了数据集的随机性对模型训练的重要性。他指出，每个训练集都是不同的点集合，而模型的泛化能力取决于它在不同训练集上的表现。如果训练集过于单一，比如只包含一个点，那么模型可能无法正确学习真实函数，从而导致性能下降。","讲者强调了训练集作为从总体中采样的重要性。他指出，模型的训练过程需要考虑训练集的随机性，以确保模型在面对不同数据时能够保持良好的性能。这为后续讨论数据集划分和模型评估提供了理论基础。","讲者通过具体的例子说明了数据集的随机性和模型泛化能力之间的关系。他指出，模型的泛化能力不仅取决于训练集的结构，还取决于训练集的多样性。因此，在实际应用中，需要确保训练集的随机性和代表性，以提高模型的泛化能力。","讲者最后总结了模型训练的基本思想，即模型需要在不同的训练集上表现良好，以确保其泛化能力。这为后续讨论数据集划分和模型评估提供了理论支持。"],"formulas":[{"latex":"y_i = h_{\\theta}(x_i) + \\epsilon","symbols":"y_i 是观测数据，h_θ(x_i) 是真实函数，ε 是高斯噪声","explanation":"公式正确，描述了观测数据与真实函数及噪声的关系，符合概率模型的设定。","evidence":"Now, it's weighted by some parameters, theta 2, theta 1, and theta 0. And it generates the real world. So this is the forward model for our data. But we never, ever get to see h. We're going to try and learn h. So we'll only observe h through data. This is what we've been doing for the whole course, so hopefully not super surprising now. What that means is we're going to have yi, which is the data we observe. It's going to be some function h theta of xi plus some noise term. And here, I'm going to assume the noise is Gaussian."}],"uncertainties":["characters"],"diagram":"none","start":169.5,"end":328.64,"asr_flags":[],"math_clarifications":["公式中的噪声项ε被正确地假设为高斯分布，但未明确写出其分布形式。"],"boards":[{"title":"模型泛化能力与训练集划分","summary":"本知识点讨论了如何选择能够泛化的模型，强调了训练集和测试集划分的重要性。模型的泛化能力取决于其在不同训练集上的表现，因此需要一种保证模型行为一致性的过程。","relation":"推导顺序","conditions":"训练集和测试集需独立且随机划分","pitfall":"仅依赖单一训练集可能导致模型过拟合或欠拟合","note_indices":[0],"formula_indices":[],"source_ids":[7],"steps":["确定模型泛化能力是机器学习的核心问题","通过训练集和测试集划分评估模型性能","确保模型在不同训练集上的表现一致"],"nodes":[{"title":"训练集划分","text":"将数据集分为训练集和测试集，用于模型训练和评估"},{"title":"模型泛化","text":"模型在未见过的数据上的表现能力"},{"title":"测试集评估","text":"使用测试集验证模型在新数据上的性能"}],"id":"v047-002-1","start":169.5,"end":196.15,"formulas":[],"formula_candidates_removed":0,"frame":"../board-frames/v047/002-1.webp","frame_time":182.0},{"title":"真实函数与噪声模型","summary":"讲者介绍了真实函数h(θ)的结构，以及数据生成过程。真实函数通过参数加权生成数据，但实际观测数据包含高斯噪声，这为模型训练提供了基础。","relation":"概念关系","conditions":"噪声服从高斯分布","pitfall":"忽略噪声可能导致模型无法准确拟合真实函数","note_indices":[1],"formula_indices":[0],"source_ids":[8,9],"steps":["真实函数h(θ)通过参数加权生成数据","观测数据包含高斯噪声","模型的目标是拟合真实函数并减少噪声影响"],"nodes":[{"title":"真实函数","text":"生成数据的理论模型，不可直接观测"},{"title":"噪声模型","text":"观测数据与真实函数之间的差异，服从高斯分布"},{"title":"数据生成","text":"真实函数与噪声共同决定观测数据"}],"id":"v047-002-2","start":196.89,"end":247.07,"formulas":[{"latex":"y_i = h_{\\theta}(x_i) + \\epsilon","symbols":"y_i 是观测数据，h_θ(x_i) 是真实函数，ε 是高斯噪声","evidence":"Now, it's weighted by some parameters, theta 2, theta 1, and theta 0. And it generates the real world. So this is the forward model for our data. But we never, ever get to see h. We're going to try and learn h. So we'll only observe h through data. This is what we've been doing for the whole course, so hopefully not super surprising now. What that means is we're going to have yi, which is the data we observe. It's going to be some function h theta of xi plus some noise term. And here, I'm going to assume the noise is Gaussian.","explanation":"公式正确，描述了观测数据与真实函数及噪声的关系，符合概率模型的设定。"}],"formula_candidates_removed":0,"frame":"../board-frames/v047/002-2.webp","frame_time":209.39},{"title":"训练集多样性与模型泛化","summary":"讲者指出，训练集的多样性对模型泛化能力至关重要。每个训练集都是不同的点集合，模型需要在不同训练集上表现良好，以确保其泛化能力。","relation":"比较关系","conditions":"训练集需随机且多样化","pitfall":"单一训练集可能导致模型过拟合","note_indices":[2,4],"formula_indices":[],"source_ids":[10,11,12],"steps":["每个训练集是不同点的集合","模型需在不同训练集上表现一致","训练集多样性影响模型泛化能力"],"nodes":[{"title":"训练集多样性","text":"不同训练集包含不同数据点，影响模型泛化"},{"title":"模型泛化","text":"模型在不同训练集上的表现一致性"},{"title":"单一训练集风险","text":"仅使用单一训练集可能导致过拟合"}],"id":"v047-002-3","start":247.41,"end":328.64,"formulas":[],"formula_candidates_removed":0,"frame":"../board-frames/v047/002-3.webp","frame_time":259.90999999999997},{"title":"训练集随机性与模型评估","summary":"讲者强调了训练集作为总体样本的重要性。模型的训练过程需要考虑训练集的随机性，以确保模型在面对不同数据时能够保持良好的性能。","relation":"推导顺序","conditions":"训练集需从总体中随机采样","pitfall":"训练集非随机可能导致模型偏差","note_indices":[3,5],"formula_indices":[],"source_ids":[12],"steps":["训练集是总体的随机样本","模型需在不同训练集上表现良好","随机性确保模型泛化能力"],"nodes":[{"title":"总体样本","text":"训练集是从总体中随机采样的数据集合"},{"title":"模型评估","text":"模型在不同训练集上的表现评估"},{"title":"随机性保证","text":"随机训练集确保模型泛化能力"}],"id":"v047-002-4","start":303.13,"end":328.64,"formulas":[],"formula_candidates_removed":0,"frame":"../board-frames/v047/002-4.webp","frame_time":315.63}],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":169.5,"text":"How do we pick a model that will generalize? And this is the key question in machine learning. This is what motivated both statistical theory and what we do now. We're going to train a model on some train set. We're going to apply it on some test set. And we'd like to have some procedure that on that training set guarantees, to the extent possible, that we behave in that form on future data sets. So this is the critical question in machine learning. We're going to talk about it."},{"start":196.89,"text":"Okay, so let's get some pictures about overfitting versus underfitting and hopefully make this concept crystal clear in your head. So here's the setup. There exists some true function in the world. We don't get to see those functions that are there. But this true function, which I've drawn here for illustration, is this function h of theta, which is going to be some quadratic."},{"start":218.53,"text":"Now, it's weighted by some parameters, theta 2, theta 1, and theta 0. And it generates the real world. So this is the forward model for our data. But we never, ever get to see h. We're going to try and learn h. So we'll only observe h through data. This is what we've been doing for the whole course, so hopefully not super surprising now. What that means is we're going to have yi, which is the data we observe. It's going to be some function h theta of xi plus some noise term. And here, I'm going to assume the noise is Gaussian."},{"start":247.41,"text":"Same setup we've done in a couple different ways. So here I've charted x and y in some particular nice example where x is going to just be some polynomial function. And indeed, there's the true function. And then we've gotten some noisy samples. These characters are really close to the line. These characters are a little bit further away from the line. There's a little bit more error there. So what I want to point out, though, is that when you get a training set, every set"},{"start":275.69,"text":"Every fresh data set is just a different set of points. And we're going to come back to, we're going to analyze what happens as we change those points in a bit. So we could judge our model based on exactly just the data we've seen. It turns out that's hard because we want to actually, the kind of guarantees that we can actually prove reliably are something that say, maybe we got a really bad training set. Maybe we just sampled one point again and again and again and ignored the rest of the function. That could be pretty bad."},{"start":303.13,"text":"Just the same point again and again and again. So we want to have this randomness over all the training sets that we could have seen. And we hope that our function trains well, meaning it's got to produce something that's close to this true set when it's fed different training sets. So is the model clear? So far, we've thought of there being training sets fixed, but now we're thinking about the training set itself is going to be a sample from some population."}],"speech_gaps":[],"frame":"../frames/v047/002.webp","frame_time":181.5},{"title":"数据集划分与机器学习建议","segments":[{"id":13,"text":"Ask me a question if unclear. So let's imagine we produce three different samples of that data set. S1, S2, and S3. They're just different draws. Now you could imagine that they're drawn randomly if that makes you feel better. They could be drawn in some way, but right now they're just three different draws of the data set. Now underneath is the same true function. So all the Xi's are all the same.","zh":"如果有不清楚的地方，请向我提问。那么让我们想象我们产生了这个数据集的三个不同样本：S1、S2和S3。它们只是不同的抽样。你现在可以想象它们是随机抽样的，如果你觉得这样更舒服的话。它们可能是以某种方式抽样的，但目前它们只是数据集的三个不同抽样。而下面的真正函数是相同的。因此，所有的Xi都是相同的。","start":331.05,"end":353.7},{"id":14,"text":"And indeed, in this idea, there's a hypothesis. There's a true relationship in the world between x and y. So this curve is the same on every one of the samples. But the samples are different. And they have different noise on each point, potentially. And the points themselves are different. So the x's and the eventual y's are going to change. But they're a draw of the same underlying set. So far good?","zh":"事实上，在这个想法中，存在一个假设。世界上x和y之间存在一个真正的关系。因此，这条曲线在每一个样本上都是相同的。但样本是不同的。每个点上可能有不同的噪声。而且这些点本身也是不同的。因此，x和最终的y会变化。但它们是从相同的底层集合中抽取的。到目前为止，这样理解对吗？","start":354.98,"end":377.28},{"id":15,"text":"Awesome? All right. So now, what we're going to think about in this lecture, which gets us to bias and variance and all that other good stuff is, how does the model change when we fit the same model class to each one? So we'll fit it to S1, independently fit it to S2, independently fit it to S3. This is kind of the mental model. And we'll want to see if the model should change. And so intuitively, it should be that on any one of these data sets, no matter which one you throw at our procedure, if it were the ideal procedure, it would just spit back exactly the true model.","zh":"太棒了？好的。那么在这节课中，我们将思考的问题是，当我们用相同的模型类拟合每一个样本时，模型会发生怎样的变化。我们将用它拟合S1，独立地拟合S2，独立地拟合S3。这是一种心理模型。我们希望看到模型是否应该发生变化。直观上，如果这是一个理想的程序，那么无论你给它哪一个数据集，它都应该返回精确的真正模型。","start":378.16,"end":405.64},{"id":16,"text":"We'll see that that's not always the case. Some model classes will make systematic errors, and we'll try and capture those systematic errors. And that's what bias and variance are really going to be all about.","zh":"我们将看到，这并不总是成立的。某些模型类会产生系统性的误差，我们将尝试捕捉这些系统性误差。而这正是偏差和方差所要讨论的内容。","start":407.17,"end":424.88},{"id":17,"text":"So what I've shown here is we took S1, and we fit a line. And boom, the line went off in some direction. And it has some errors on the points. On S2, I again get this data set, and I fit a different line. And S3, get a different line. Now, the point of this schematically","zh":"我在这里展示的是，我们对S1拟合了一条直线。然后，这条直线朝着某个方向延伸。它在各个点上存在一些误差。在S2中，我又得到了这个数据集，并拟合了一条不同的直线。在S3中，又得到了一条不同的直线。现在，这个图示的目的是","start":425.99,"end":450.02},{"id":18,"text":"is that this thing is kind of bouncing around a little bit on every different data set I give to it. It kind of fits a different line on each one of them. But also, it makes a lot of errors. So there's two different things going on. One is, if you think about this for a second, no matter which line I pick through these data sets, there's always going to be some amount of error. And if you actually compute it out, you can see that that error is going to be something related to the integral of that quadratic over the space.","zh":"这是因为，无论我给它什么样的数据集，它都会在不同的数据集上有所波动。它会在每个数据集上拟合出不同的直线。但同时，它也会产生很多错误。因此，有两件不同的事情在发生。首先，如果你仔细想想，无论我选择哪条穿过这些数据集的直线，总会存在一定程度的误差。如果你实际计算一下，你会发现这种误差与该二次函数在整个空间上的积分有关。","start":450.82,"end":478.22},{"id":19,"text":"Does that make sense? No matter which line you draw, you're never going to draw a line that has a nice curve like it. Doesn't matter which one you draw. You can sample all day long until you're blue in the face. That's one. So this is obvious, even from the training data that we have. Now the fix here, hopefully, is clear. This is what we call a high bias situation. We're going to do the math in a second. But we're underfitting the model. Our model is just not expressive enough to capture the phenomenon we're after. We're after a quadratic thing, but we only have a linear thing, a linear model to go after it.","zh":"这听起来合理吗？无论你画出哪条直线，你都不可能画出一条具有优美曲线的直线。无论你选择哪一条，你都可以整天采样，直到眼睛发蓝。这是第一点。因此，即使从我们现有的训练数据中，这一点也是显而易见的。现在，解决这个问题的方法，希望是显而易见的。我们称之为高偏差情况。我们稍后会做数学推导。但我们现在是模型欠拟合。我们的模型表达能力不足，无法捕捉我们所追求的现象。我们追求的是一个二次函数，但我们只拥有一个线性模型去拟合它。","start":480.07,"end":509.43}],"notes":["本段讲授了机器学习中数据集划分的基本概念，包括如何从同一真实函数中抽取不同的样本，并强调了样本之间的差异性。讲者指出，尽管样本不同，但它们都来自同一个真实函数，且每个样本中的点都可能带有不同的噪声。"],"formulas":[],"uncertainties":[],"diagram":"none","start":331.05,"end":509.43,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":331.05,"text":"Ask me a question if unclear. So let's imagine we produce three different samples of that data set. S1, S2, and S3. They're just different draws. Now you could imagine that they're drawn randomly if that makes you feel better. They could be drawn in some way, but right now they're just three different draws of the data set. Now underneath is the same true function. So all the Xi's are all the same."},{"start":354.98,"text":"And indeed, in this idea, there's a hypothesis. There's a true relationship in the world between x and y. So this curve is the same on every one of the samples. But the samples are different. And they have different noise on each point, potentially. And the points themselves are different. So the x's and the eventual y's are going to change. But they're a draw of the same underlying set. So far good?"},{"start":378.16,"text":"Awesome? All right. So now, what we're going to think about in this lecture, which gets us to bias and variance and all that other good stuff is, how does the model change when we fit the same model class to each one? So we'll fit it to S1, independently fit it to S2, independently fit it to S3. This is kind of the mental model. And we'll want to see if the model should change. And so intuitively, it should be that on any one of these data sets, no matter which one you throw at our procedure, if it were the ideal procedure, it would just spit back exactly the true model."},{"start":407.17,"text":"We'll see that that's not always the case. Some model classes will make systematic errors, and we'll try and capture those systematic errors. And that's what bias and variance are really going to be all about. So let's fit the simplest model. Let's just fit a line. Our function's quadratic. We're fitting a line."},{"start":425.99,"text":"Intuitively, it should be too simple. There should be a curve. The line is incapable of representing the curve. So what happens? So what I've shown here is we took S1, and we fit a line. And boom, the line went off in some direction. And it has some errors on the points. On S2, I again get this data set, and I fit a different line. And S3, get a different line. Now, the point of this schematically"},{"start":450.82,"text":"is that this thing is kind of bouncing around a little bit on every different data set I give to it. It kind of fits a different line on each one of them. But also, it makes a lot of errors. So there's two different things going on. One is, if you think about this for a second, no matter which line I pick through these data sets, there's always going to be some amount of error. And if you actually compute it out, you can see that that error is going to be something related to the integral of that quadratic over the space."},{"start":480.07,"text":"Does that make sense? No matter which line you draw, you're never going to draw a line that has a nice curve like it. Doesn't matter which one you draw. You can sample all day long until you're blue in the face. That's one. So this is obvious, even from the training data that we have. Now the fix here, hopefully, is clear. This is what we call a high bias situation. We're going to do the math in a second. But we're underfitting the model. Our model is just not expressive enough to capture the phenomenon we're after. We're after a quadratic thing, but we only have a linear thing, a linear model to go after it."}],"speech_gaps":[],"frame":"../frames/v047/003.webp","frame_time":343.05},{"title":"数据集划分与机器学习建议","segments":[{"id":20,"text":"So the fix is, well, let's add some degrees of freedom. Let's make our model more expressive. So now we're going to fit a really high-dimensional polynomial. We don't know what the true function is. We don't know what it is. So let's go and throw a true big function after it. So here, I think if you count, I think these are 9-degree polynomials. Maybe the notes accidentally said 5, but you can see how much they're oscillating.","zh":"所以解决方法是，嗯，让我们添加一些自由度。让我们让我们的模型更具表现力。现在我们将拟合一个非常高维的多项式。我们不知道真正的函数是什么。我们不知道它是什么。所以让我们去拟合一个真正的复杂函数。在这里，我想如果你数一下，我想这些是9次多项式。也许笔记不小心写成了5次，但你可以看到它们的振荡程度有多大。","start":510.13,"end":533.1},{"id":21,"text":"So again, on each set, I'll fit a polynomial here, I'll fit a polynomial here, I'll fit this polynomial here on each set independently. When I look at those sets, if you remember your Lagrange interpolation, right? If you have more degrees than you have points, you can fit every point I give you. So this has kind of the opposite problem. Here on the training set that I give you, I'm getting down to zero error. In the last one, I was not getting zero error on the train or the test error.","zh":"同样，在每个数据集上，我将拟合一个多项式，我将拟合一个多项式，我将在每个数据集上独立地拟合这个多项式。当我查看这些数据集时，如果你还记得拉格朗日插值，对吧？如果你拥有的多项式次数比数据点的数量多，你就可以拟合每一个你给我的点。所以这里的问题正好相反。在我给你的训练集上，我得到了零误差。在之前的那个例子中，我在训练集或测试集上都没有得到零误差。","start":533.75,"end":559.09},{"id":22,"text":"This one, I'm fitting the training set perfectly, but somehow each time I give you a new sample, I get what looks like a completely unrecognizable function. And that would be very disturbing, for example, if I made a prediction here, I would get something that was in infinity, and here I'd get something large, but here I would get something small. Does that make sense? If I took the same x value across each of them, my predictions are no longer stable because it's wiggling around to such a crazy extent. So far, so good? Cool. All right.","zh":"在这个例子中，我完美地拟合了训练集，但每次我给你一个新的样本时，我得到的函数看起来完全无法识别。例如，如果我在这一点进行预测，我会得到一个无穷大的值，而在这里我会得到一个很大的值，而在这里我会得到一个很小的值。这有意义吗？如果我在每个数据集中使用相同的x值，我的预测结果就不再稳定，因为它在极端的程度上波动。到目前为止，这样好吗？很好。好的。","start":560.12,"end":587.22},{"id":23,"text":"So the curve changes a lot from one sample to the next, one sample here being an entire training set to the next. And here, this is an instance where the model is kind of comically too powerful. I wanted to fit a quadratic, but I had some huge polynomial underneath the covers. So the fix that we'll talk about here is using an expressive class with lower variance. Now, this is the classical story. This is what we're going to talk about for the next couple of minutes.","zh":"所以曲线在每次样本之间变化很大，一个样本在这里是一个完整的训练集，下一个样本也是如此。在这里，这是一个模型过于强大的例子。我原本想拟合一个二次函数，但实际使用的是一个非常大的多项式。我们将在这里讨论的解决方法是使用一个更具表现力但方差更低的模型类别。这是经典的故事情节。这是我们接下来几分钟要讨论的内容。","start":588.1,"end":613.92},{"id":24,"text":"But I do want to point out that machine learning, as I said, and what we'll get to in the second half of the lecture, started training models that were actually larger than the dataset. So in the second half of lecture, we're going to come back and revisit this idea through some more interesting ideas from the last 5-10 years and talk about how this evolved in the future to modern models. But the classical, you must know anyone who passes through machine learning or stats needs to know.","zh":"但我想指出的是，正如我之前所说，机器学习，以及我们将在讲座后半部分探讨的内容，开始训练的模型实际上比数据集还要大。因此，在讲座的后半部分，我们将通过过去5到10年的一些更有趣的思路重新审视这个想法，并讨论这种发展如何演变为现代模型。但经典的知识，任何通过机器学习或统计学的人必须了解。","start":614.53,"end":637.75},{"id":25,"text":"is high variance and overfit. Another way to say that is what's likely to be on your test is the first part of what's going on, not the second part, which is basically me teaching you about what's going on in the last five years. Because this is a classical bias-variance decomposition. You should know what we're going to do.","zh":"这是高方差和过拟合。另一种说法是，你的测试中很可能出现的是正在发生的事情的第一部分，而不是第二部分，第二部分基本上是我教你关于过去五年发生的事情。因为这是经典的偏差-方差分解。你应该知道我们将要做什么。","start":638.46,"end":652.52},{"id":26,"text":"All right. Now, another way to think about it is the model is fitting noise, not signal. The true signal is this nice, smooth parabola, and it's fitting to all the little noise. And as a result, it's jumping around wildly. We've done this in one dimension, but it's certainly true in higher dimensions as well. Higher dimensions even get worse because lines in higher dimensions are pretty expressive, as we've talked about. And so a higher dimensional line where you use too many dimensions, you can also get this kind of property where you figure out a line which almost perfectly fits all of your data.","zh":"好的，另一种思考方式是模型在拟合噪声，而不是信号。真实的信号是一个光滑的抛物线，而模型却在拟合所有的微小噪声。结果就是模型在剧烈波动。我们已经在一维中做过这个例子，但在更高维度中同样成立。更高维度甚至更糟，因为高维中的线具有很强的表达能力，正如我们之前讨论的。因此，当你使用过多维度时，你也可以得到这种性质，即找到一条几乎完美拟合你所有数据的线。","start":655.06,"end":683.22}],"notes":["本段讨论了模型复杂度过高导致的过拟合问题，通过高次多项式拟合数据时，模型在训练集上表现完美，但在测试集上表现不稳定，甚至出现极端预测值。这说明模型过度拟合了训练数据中的噪声，而非真实信号。","讲者提到，当模型的自由度（如多项式次数）超过数据点数量时，模型可以完美拟合训练数据，但这种拟合是不稳定的，因为模型会过度适应数据中的随机波动。这与拉格朗日插值中的现象类似，即当多项式次数过高时，插值结果会剧烈波动。","讲者指出，模型在高维空间中更容易出现这种问题，因为高维空间中的线性模型具有更强的表达能力，但这也可能导致模型过度拟合。例如，使用过多的特征维度可能导致模型在训练数据上表现良好，但在测试数据上泛化能力差。","讲者强调，过拟合问题在机器学习中是一个经典问题，通常通过引入正则化或使用更简单的模型来解决。此外，讲者提到现代机器学习模型（如深度学习）在处理大规模数据时，可能会出现模型规模超过数据集的情况，这需要更深入的分析。","讲者还提到，过拟合的另一种理解是模型在拟合数据时，不仅学习了真实信号，还学习了数据中的噪声。这会导致模型在面对新数据时表现不稳定，预测结果波动较大。","最后，讲者指出，高维空间中的模型更容易出现过拟合问题，因为高维空间中的线性模型具有更强的表达能力，但这也可能导致模型过度拟合。例如，使用过多的特征维度可能导致模型在训练数据上表现良好，但在测试数据上泛化能力差。"],"formulas":[],"uncertainties":[],"diagram":"none","start":510.13,"end":683.22,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":510.13,"text":"So the fix is, well, let's add some degrees of freedom. Let's make our model more expressive. So now we're going to fit a really high-dimensional polynomial. We don't know what the true function is. We don't know what it is. So let's go and throw a true big function after it. So here, I think if you count, I think these are 9-degree polynomials. Maybe the notes accidentally said 5, but you can see how much they're oscillating."},{"start":533.75,"text":"So again, on each set, I'll fit a polynomial here, I'll fit a polynomial here, I'll fit this polynomial here on each set independently. When I look at those sets, if you remember your Lagrange interpolation, right? If you have more degrees than you have points, you can fit every point I give you. So this has kind of the opposite problem. Here on the training set that I give you, I'm getting down to zero error. In the last one, I was not getting zero error on the train or the test error."},{"start":560.12,"text":"This one, I'm fitting the training set perfectly, but somehow each time I give you a new sample, I get what looks like a completely unrecognizable function. And that would be very disturbing, for example, if I made a prediction here, I would get something that was in infinity, and here I'd get something large, but here I would get something small. Does that make sense? If I took the same x value across each of them, my predictions are no longer stable because it's wiggling around to such a crazy extent. So far, so good? Cool. All right."},{"start":588.1,"text":"So the curve changes a lot from one sample to the next, one sample here being an entire training set to the next. And here, this is an instance where the model is kind of comically too powerful. I wanted to fit a quadratic, but I had some huge polynomial underneath the covers. So the fix that we'll talk about here is using an expressive class with lower variance. Now, this is the classical story. This is what we're going to talk about for the next couple of minutes."},{"start":614.53,"text":"But I do want to point out that machine learning, as I said, and what we'll get to in the second half of the lecture, started training models that were actually larger than the dataset. So in the second half of lecture, we're going to come back and revisit this idea through some more interesting ideas from the last 5-10 years and talk about how this evolved in the future to modern models. But the classical, you must know anyone who passes through machine learning or stats needs to know."},{"start":638.46,"text":"is high variance and overfit. Another way to say that is what's likely to be on your test is the first part of what's going on, not the second part, which is basically me teaching you about what's going on in the last five years. Because this is a classical bias-variance decomposition. You should know what we're going to do."},{"start":655.06,"text":"All right. Now, another way to think about it is the model is fitting noise, not signal. The true signal is this nice, smooth parabola, and it's fitting to all the little noise. And as a result, it's jumping around wildly. We've done this in one dimension, but it's certainly true in higher dimensions as well. Higher dimensions even get worse because lines in higher dimensions are pretty expressive, as we've talked about. And so a higher dimensional line where you use too many dimensions, you can also get this kind of property where you figure out a line which almost perfectly fits all of your data."}],"speech_gaps":[],"frame":"../frames/v047/004.webp","frame_time":522.13},{"title":"数据集划分与机器学习建议","segments":[{"id":27,"text":"but it actually doesn't generalize well when you go to a test set. And to think about it just to be really concrete, imagine I trained on S1 and then S2 was my test set. I would make huge errors using the function that I use on S1 on S2 and vice versa. Clear enough what the concepts are that we're looking for? All right, we're going to do some math. Keep these pictures in your head. All the math is basically just these pictures. If you understand the pictures, the math is just some kind of plug and chug kind of stuff.","zh":"但实际上，当你应用到测试集时，它并不能很好地泛化。为了更具体地思考这个问题，想象一下我是在S1上训练的，而S2是我的测试集。如果我使用在S1上得到的函数来处理S2，或者反过来，我会在S2上产生巨大的误差。清楚我们正在寻找的概念了吗？好的，我们现在要做一些数学推导。请把这些图像保留在脑海中。所有的数学内容基本上就是这些图像。如果你理解了这些图像，数学计算就只是某种插值和代入的过程。","start":684.05,"end":709.9},{"id":28,"text":"Now, the last case, of course, to fill it out is I get it just right. Now, just right doesn't mean it's perfect. That's all I want to get across on this slide. Just right means it has the right, the fancy term for this that you'll hear machine learning people say. You should always ask them to define it because they don't think they know they can define it. It's a tough thing. Inductive bias. It's the right inductive bias. It sounds really professional when you say that. It just means it has a degree that matches the model. The degrees are free to match the model.","zh":"现在，最后一个情况，当然，要完整地说明就是我刚好合适。‘刚好合适’并不意味着是完美的。这就是我想在这张幻灯片上传达的全部内容。‘刚好合适’意味着它具有正确的归纳偏差，这是机器学习人员会说的术语。你应该总是让他们定义这个概念，因为他们自己也不确定是否能定义它。这是一个很难理解的概念。归纳偏差指的是模型具有与数据匹配的程度。这种程度是自由的，可以匹配模型。","start":711.14,"end":735.02},{"id":29,"text":"More or less. So the fits are similar across samples, and they stay close to the data. And sure, they make some errors. But those errors somehow are the errors that are in the data. If I gave you a really bad sample of training data, your model class shouldn't kind of be held accountable that it also fit a poor model. And so what we're going to try and do is disentangle these three sources of error. What are errors when I come to test time?","zh":"大致如此。因此，样本之间的拟合情况是相似的，而且它们保持接近数据。当然，它们会有一些误差。但这些误差以某种方式就是数据中的误差。如果我给你一个非常差的训练数据样本，你的模型类别不应该因此被归咎于拟合了一个差的模型。因此，我们接下来要尝试区分这三个误差来源。在测试时，什么是误差？","start":735.69,"end":758.41},{"id":30,"text":"What are errors in terms of bias, which is how far I'm off, what the line is off, is what that term is going to be called. And the last one is that variance term, which is how much do I jump around effectively as I train the training set. And those are going to be the three terms and what comes out in the math we do next. So you've seen them kind of one, two, three. All right. Now, this is the classical picture.","zh":"从偏差的角度来看，什么是误差？偏差指的是我偏离了多少，也就是那条线偏离了多少，这就是这个术语的含义。最后一个就是方差项，它指的是我在训练训练集时，我有多大程度的波动。这三个项将会是我们接下来进行的数学推导中出现的内容。你已经大致看到了它们，一、二、三。好的，这就是经典的图像。","start":758.88,"end":781.22},{"id":31,"text":"These are the three terms. We're going to derive them momentarily, which is that we're going to talk about more precisely what happens at test time, because we're worried about generalization. I'm going to give you a formal model, but intuitively, you're going to pick a new point, however you want. That new point's going to have some error in it as well, because it's a point. And then we're going to try and understand what's called the noise. And then we're going to look at these terms, how bias and variance trade off. And this is the canonical chart that you usually see, which says, as I increase the model complexity,","zh":"这三个术语我们稍后会推导出来，这将更精确地说明在测试时会发生什么，因为我们担心泛化能力。我会给你一个形式化的模型，但直观上，你会以任何方式选择一个新的点。这个新点也会有误差，因为它是一个点。然后我们将尝试理解所谓的噪声。接着我们将观察这些术语，即偏差和方差之间的权衡。这是你通常会看到的经典图表，它说明随着模型复杂度的增加，","start":782.28,"end":811.43},{"id":32,"text":"The bias reduces, right? So we did it with lines and degrees, but canonically, it'd be like more parameters, a more expressive function clash. The hypothesis class is bigger. The number of function you could fit. This thing goes down. But then after you get to some point, the variance, the ability to jump around and fit everything goes up. Okay? Okay. So far, so good? All right. Awesome. Okay. So what this looks like for polynomials, we already saw.","zh":"偏差会减少，对吧？我们之前用直线和次数来举例，但经典的情况是更多的参数，更强大的函数表达能力。假设类更大。你可以拟合的函数数量。这个量会下降。但之后当你达到某个点时，方差，即跳跃和拟合一切的能力会上升。明白吗？到目前为止，还行吗？好的。太棒了。好的。对于多项式，这个情况我们已经看到了。","start":812.17,"end":841.06}],"notes":["本段讲解了机器学习中模型拟合的三个主要误差来源：偏差、方差和噪声。偏差指的是模型对数据的偏离程度，方差指的是模型在训练数据上的波动程度，而噪声则是数据本身的随机误差。讲者强调了理解这些概念的重要性，并指出它们在模型复杂度变化时的相互作用。","讲者提到，模型的偏差和方差之间存在权衡关系。随着模型复杂度的增加，偏差会减少，但方差会增加。这种权衡关系是机器学习中一个经典的问题，通常通过调整模型复杂度来找到最佳平衡点。","讲者还提到，模型的偏差和方差是通过数学推导得出的，这些推导将帮助理解模型在测试时的表现。模型的复杂度增加会导致偏差减少，但方差增加，这可能导致模型在测试数据上的表现变差。","讲者指出，模型的偏差和方差是理解模型泛化能力的关键因素。偏差反映了模型对数据的拟合程度，而方差反映了模型对训练数据的敏感程度。在实际应用中，需要找到一个合适的模型复杂度，以平衡偏差和方差。","讲者还提到，模型的偏差和方差是通过数学推导得出的，这些推导将帮助理解模型在测试时的表现。模型的复杂度增加会导致偏差减少，但方差增加，这可能导致模型在测试数据上的表现变差。","讲者最后提到，对于多项式模型，偏差和方差的变化趋势已经有所展示。随着模型复杂度的增加，偏差减少，方差增加，这表明模型在测试数据上的表现会受到模型复杂度的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":684.05,"end":841.06,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":684.05,"text":"but it actually doesn't generalize well when you go to a test set. And to think about it just to be really concrete, imagine I trained on S1 and then S2 was my test set. I would make huge errors using the function that I use on S1 on S2 and vice versa. Clear enough what the concepts are that we're looking for? All right, we're going to do some math. Keep these pictures in your head. All the math is basically just these pictures. If you understand the pictures, the math is just some kind of plug and chug kind of stuff."},{"start":711.14,"text":"Now, the last case, of course, to fill it out is I get it just right. Now, just right doesn't mean it's perfect. That's all I want to get across on this slide. Just right means it has the right, the fancy term for this that you'll hear machine learning people say. You should always ask them to define it because they don't think they know they can define it. It's a tough thing. Inductive bias. It's the right inductive bias. It sounds really professional when you say that. It just means it has a degree that matches the model. The degrees are free to match the model."},{"start":735.69,"text":"More or less. So the fits are similar across samples, and they stay close to the data. And sure, they make some errors. But those errors somehow are the errors that are in the data. If I gave you a really bad sample of training data, your model class shouldn't kind of be held accountable that it also fit a poor model. And so what we're going to try and do is disentangle these three sources of error. What are errors when I come to test time?"},{"start":758.88,"text":"What are errors in terms of bias, which is how far I'm off, what the line is off, is what that term is going to be called. And the last one is that variance term, which is how much do I jump around effectively as I train the training set. And those are going to be the three terms and what comes out in the math we do next. So you've seen them kind of one, two, three. All right. Now, this is the classical picture."},{"start":782.28,"text":"These are the three terms. We're going to derive them momentarily, which is that we're going to talk about more precisely what happens at test time, because we're worried about generalization. I'm going to give you a formal model, but intuitively, you're going to pick a new point, however you want. That new point's going to have some error in it as well, because it's a point. And then we're going to try and understand what's called the noise. And then we're going to look at these terms, how bias and variance trade off. And this is the canonical chart that you usually see, which says, as I increase the model complexity,"},{"start":812.17,"text":"The bias reduces, right? So we did it with lines and degrees, but canonically, it'd be like more parameters, a more expressive function clash. The hypothesis class is bigger. The number of function you could fit. This thing goes down. But then after you get to some point, the variance, the ability to jump around and fit everything goes up. Okay? Okay. So far, so good? All right. Awesome. Okay. So what this looks like for polynomials, we already saw."}],"speech_gaps":[],"frame":"../frames/v047/005.webp","frame_time":696.05},{"title":"数据集划分与机器学习建议","segments":[{"id":33,"text":"We're going to expect this. These are all just what's written in the chart. You see what each one of those terms are. But let's see what the terms actually are and derive them. It'll make it more clear than looking at this. This chart is really for you to look back at when you go through and say, OK, I've seen now the mapping from the math to the charts. And I want to make sure that I test my understanding. That's when you should come back to this chart. By the way, you'll hear me use this phrase. I just want to point it out. Interpolation. This means something actually very precise to me. Interpolation means the ability to fit the training set with zero loss.","zh":"我们会预料到这一点。这些都是图表中所写的。你能看到每个术语的含义。但让我们看看这些术语实际上是什么，并推导它们。这会比仅仅看这个图表更清楚。这张图表是你在回顾时用来对照数学与图表映射的。当你回顾时，你会说，哦，我现在已经看到了数学与图表之间的映射。我想要确保我理解正确。这时候你应该回到这张图表。顺便说一下，你会听到我使用这个短语。我想指出这一点。插值。这个词对我来说有非常精确的含义。插值意味着能够以零损失拟合训练集。","start":841.73,"end":869.91},{"id":34,"text":"So when you say that a function is interpolating, it means it can fit exactly those points. And if you've ever seen what are called interpolative methods, like if you know what a Chebyshev series is or something, it doesn't matter if you don't. But if you've ever seen those methods, you take all the points exactly and then you weight the points. And it turns out, bizarrely enough, there exist large deep networks that interpolate their training set and still generalize.","zh":"当你说到一个函数是插值的，这意味着它能够精确地拟合这些点。如果你曾经见过所谓的插值方法，比如你知道切比雪夫级数是什么，或者不知道也没关系。但如果你曾经见过这些方法，你会取所有点并给它们加权。结果出人意料，存在一些大型的深度网络，它们能够插值其训练集，同时仍然具有泛化能力。","start":870.77,"end":894.57},{"id":35,"text":"which is something that you would think a high dimensional polynomial shouldn't be able to do. If I give you a high dimensional polynomial and exactly fit the points, it gets really weird and wiggly. And so you wouldn't expect that to happen. There's a wonderful paper written by some friends. Actually, the senior author on that was one of my dear friends I was talking to this morning about unrelated things. I shouldn't embarrass him. He also does strongman competitions. It was actually the bulk of what we were talking about. But the other side of what we were talking about did actually have to do with the update to these papers rethinking generalization, which are really interesting.","zh":"这是一些你认为高维多项式不应该做到的事情。如果你给我一个高维多项式，并且精确地拟合这些点，它会变得非常奇怪和波动。因此，你不会期望这种情况发生。有一些非常棒的论文是由我的一些朋友写的。实际上，那篇论文的资深作者是我今天早上和他谈论其他事情时提到的好友之一。我不应该让他难堪。他同时也参加强人比赛。实际上，我们大部分谈话内容都是关于这个的。但我们谈话的另一部分确实涉及这些论文的更新，重新思考泛化，这些论文非常有趣。","start":895.03,"end":924.39},{"id":36,"text":"papers that show you things that you wouldn't think should happen super cool paper okay i'll probably embarrass the crap out of him but yeah ben rex's name i just want to put it out there so uh he's phenomenal any case um all right we'll keep going from there okay so the key is is that once you get larger in polynomial space","zh":"这些论文展示了你不会想到会发生的事情，超级酷的论文，嗯，我可能会让他难堪，但确实如此。Ben Rex的名字，我想提一下，他非常出色。总之，我们继续从那里开始。关键在于，一旦你在多项式空间中变得更大","start":924.43,"end":944.21},{"id":37,"text":"this d gets bigger than d star. So we use this star notation to mean optimal,","zh":"这个 d 比 d 星大。因此我们使用星号表示法来指代最优值，","start":944.85,"end":948.65},{"id":38,"text":"the optimal, like that's the right parameter class. Once you get bigger,","zh":"最优值，就像这是正确的参数类。一旦你变得更大，","start":948.81,"end":951.91},{"id":39,"text":"the bias goes away intuitively in the classical picture because you have enough expressive power","zh":"在经典图景中，偏差会直观地消失，因为你拥有足够的表达能力","start":951.95,"end":956.45},{"id":40,"text":"to fit the model. Below that, you're probably going to suffer bias. And then above that,","zh":"来拟合模型。低于这个水平，你可能会遭受偏差。而在高于这个水平时，","start":956.45,"end":961.39},{"id":41,"text":"you would expect that you get some amount of variance. And we're going to deal with that","zh":"你可以预期会有一些方差。我们将通过正则化来处理这种方差。因此，我们的想法是，我们不知道 d 是什么。我们不知道它","start":961.45,"end":964.63},{"id":42,"text":"variance by regularization. So the idea is we don't know what d is. We don't know that it's","zh":"在底层是二次的。","start":964.63,"end":971.15},{"id":43,"text":"to quadratic underneath the covers.","zh":"因此，我们最终将开发出一些方法","start":971.15,"end":972.33},{"id":44,"text":"And so we're eventually going to develop methods","zh":"来处理这些情况","start":972.55,"end":974.57},{"id":45,"text":"that regularize.","zh":"进行正则化。","start":974.57,"end":976.29},{"id":46,"text":"They try something out.","zh":"他们尝试一些方法。","start":976.41,"end":977.67},{"id":47,"text":"They'll try something out to a high dimensional class.","zh":"他们会在高维类别中尝试一些方法。","start":978.13,"end":981.37},{"id":48,"text":"And then they'll try and kind of smash down the complexity","zh":"然后他们会尝试降低复杂性。","start":981.61,"end":983.71},{"id":49,"text":"adaptively.","zh":"以自适应的方式。","start":983.71,"end":984.45},{"id":50,"text":"And so they didn't know that there was","zh":"因此他们并不知道存在","start":984.61,"end":986.29},{"id":51,"text":"quadratic data underneath, but they'll","zh":"二次数据","start":986.29,"end":988.25},{"id":52,"text":"kind of fit to that data.","zh":"但他们还是会拟合到这些数据上。","start":988.25,"end":989.67},{"id":53,"text":"That's the mental model of where we're going.","zh":"这就是我们即将前往的方向的心理模型。","start":989.83,"end":991.25},{"id":54,"text":"Please, go ahead.","zh":"请继续。","start":991.41,"end":991.91},{"id":55,"text":"Sorry.","zh":"抱歉。","start":991.95,"end":992.07},{"id":56,"text":"The phi is completely gone.","zh":"phi 已经完全消失了。","start":992.49,"end":993.63},{"id":57,"text":"d is greater than d is .","zh":"d 大于 d 是。","start":993.89,"end":995.87},{"id":58,"text":"The phi?","zh":"phi 是什么？","start":996.53,"end":997.27},{"id":59,"text":"Which one?","zh":"哪一个？","start":997.33,"end":997.69},{"id":60,"text":"Where's completely gone?","zh":"哪里完全消失了？","start":997.75,"end":998.49},{"id":61,"text":"Like this.","zh":"像这样。","start":999.01,"end":999.61},{"id":62,"text":"Oh, this is in the poly, this is just","zh":"哦，这个在多项式里面，这只是","start":999.79,"end":1001.05},{"id":63,"text":"for polynomials. Don't read too much into it. It's because you can always fit a low-degree","zh":"关于多项式的内容。不要过度解读。这是因为你总是可以通过将高次项系数设为零来拟合一个低次多项式。是的，是的。非常好的问题。","start":1001.05,"end":1005.87},{"id":64,"text":"polynomial by zeroing out the higher-order coefficients. Yeah, yeah. Wonderful question.","zh":"好的。在我进行数学推导之前，我想指出我将在正则化部分教你们这个","start":1005.87,"end":1009.79},{"id":65,"text":"Okay. I do want to point out before I do the math that I'm going to teach you this","zh":"内容。有疑问吗？抱歉。哦，请问。","start":1011.85,"end":1016.11},{"id":66,"text":"in regularization. Was there a question? Sorry. Oh, please.","zh":"在正则化方面。有问题吗？抱歉。哦，烦请。","start":1016.11,"end":1018.37}],"notes":["本段主要讲解了机器学习中模型复杂度与偏差-方差权衡的概念。教授指出，当模型的复杂度（d）超过某个临界值（d*）时，偏差会消失，但方差会增加。这表明模型在足够复杂时可以拟合训练数据，但可能会过拟合。教授还提到，通过正则化可以控制方差，从而改善模型的泛化能力。","教授提到，当模型复杂度足够高时，即使在高维空间中，模型也能拟合训练数据，这与传统直觉相悖。他引用了一篇论文，指出某些深度网络可以实现这种插值，同时仍然具有泛化能力。这表明模型的复杂度和泛化能力之间存在复杂的相互作用。","教授强调，模型的复杂度（d）与数据的结构（如二次数据）之间存在关系。当模型复杂度超过某个阈值时，模型可以拟合数据，但需要通过正则化来控制方差。这表明模型的泛化能力不仅取决于其复杂度，还取决于数据的结构。","教授提到，模型的复杂度可以通过正则化方法进行控制。正则化的目标是减少方差，从而提高模型的泛化能力。这表明正则化是一种重要的技术，用于在模型复杂度和泛化能力之间取得平衡。","教授还提到，模型的复杂度可以通过适配性调整。例如，模型可以尝试在高维空间中拟合数据，然后通过某种方式降低复杂度。这表明模型的复杂度调整是一个动态过程，需要根据数据和任务进行调整。","教授最后提到，模型的复杂度和数据的结构之间存在关系，但具体细节可能需要进一步探讨。这表明模型的泛化能力不仅取决于其复杂度，还取决于数据的结构和模型的设计。"],"formulas":[],"uncertainties":["d is greater than d is .","quadratic data underneath"],"diagram":"none","start":841.73,"end":1018.37,"asr_flags":[55],"boards":[],"translation_complete":true,"translated_segments":34,"raw_segments":[{"start":841.73,"text":"We're going to expect this. These are all just what's written in the chart. You see what each one of those terms are. But let's see what the terms actually are and derive them. It'll make it more clear than looking at this. This chart is really for you to look back at when you go through and say, OK, I've seen now the mapping from the math to the charts. And I want to make sure that I test my understanding. That's when you should come back to this chart. By the way, you'll hear me use this phrase. I just want to point it out. Interpolation. This means something actually very precise to me. Interpolation means the ability to fit the training set with zero loss."},{"start":870.77,"text":"So when you say that a function is interpolating, it means it can fit exactly those points. And if you've ever seen what are called interpolative methods, like if you know what a Chebyshev series is or something, it doesn't matter if you don't. But if you've ever seen those methods, you take all the points exactly and then you weight the points. And it turns out, bizarrely enough, there exist large deep networks that interpolate their training set and still generalize."},{"start":895.03,"text":"which is something that you would think a high dimensional polynomial shouldn't be able to do. If I give you a high dimensional polynomial and exactly fit the points, it gets really weird and wiggly. And so you wouldn't expect that to happen. There's a wonderful paper written by some friends. Actually, the senior author on that was one of my dear friends I was talking to this morning about unrelated things. I shouldn't embarrass him. He also does strongman competitions. It was actually the bulk of what we were talking about. But the other side of what we were talking about did actually have to do with the update to these papers rethinking generalization, which are really interesting."},{"start":924.43,"text":"papers that show you things that you wouldn't think should happen super cool paper okay i'll probably embarrass the crap out of him but yeah ben rex's name i just want to put it out there so uh he's phenomenal any case um all right we'll keep going from there okay so the key is is that once you get larger in polynomial space"},{"start":944.85,"text":"this d gets bigger than d star. So we use this star notation to mean optimal,"},{"start":948.81,"text":"the optimal, like that's the right parameter class. Once you get bigger,"},{"start":951.95,"text":"the bias goes away intuitively in the classical picture because you have enough expressive power"},{"start":956.45,"text":"to fit the model. Below that, you're probably going to suffer bias. And then above that,"},{"start":961.45,"text":"you would expect that you get some amount of variance. And we're going to deal with that"},{"start":964.63,"text":"variance by regularization. So the idea is we don't know what d is. We don't know that it's"},{"start":971.15,"text":"to quadratic underneath the covers."},{"start":972.55,"text":"And so we're eventually going to develop methods"},{"start":974.57,"text":"that regularize."},{"start":976.41,"text":"They try something out."},{"start":978.13,"text":"They'll try something out to a high dimensional class."},{"start":981.61,"text":"And then they'll try and kind of smash down the complexity"},{"start":983.71,"text":"adaptively."},{"start":984.61,"text":"And so they didn't know that there was"},{"start":986.29,"text":"quadratic data underneath, but they'll"},{"start":988.25,"text":"kind of fit to that data."},{"start":989.83,"text":"That's the mental model of where we're going."},{"start":991.41,"text":"Please, go ahead."},{"start":991.95,"text":"Sorry."},{"start":992.49,"text":"The phi is completely gone."},{"start":993.89,"text":"d is greater than d is ."},{"start":996.53,"text":"The phi?"},{"start":997.33,"text":"Which one?"},{"start":997.75,"text":"Where's completely gone?"},{"start":999.01,"text":"Like this."},{"start":999.79,"text":"Oh, this is in the poly, this is just"},{"start":1001.05,"text":"for polynomials. Don't read too much into it. It's because you can always fit a low-degree"},{"start":1005.87,"text":"polynomial by zeroing out the higher-order coefficients. Yeah, yeah. Wonderful question."},{"start":1011.85,"text":"Okay. I do want to point out before I do the math that I'm going to teach you this"},{"start":1016.11,"text":"in regularization. Was there a question? Sorry. Oh, please."}],"speech_gaps":[],"frame":"../frames/v047/006.webp","frame_time":853.73},{"title":"数据集划分与机器学习建议","segments":[{"id":67,"text":"I was going to ask, is it true that train error reflects bias and test error reflects variance?","zh":"我本来想问，是否训练误差反映了偏差，而测试误差反映了方差？","start":1018.57,"end":1026.63},{"id":68,"text":"Wonderful question. So the question is, does train error reflect bias? Is it captured in there?","zh":"非常好的问题。问题是，训练误差是否反映了偏差？它是否被包含在其中？","start":1026.63,"end":1031.35},{"id":69,"text":"And does test error reflect the variance? It reflects a little bit more than variance","zh":"而测试误差是否反映了方差？它反映的不仅仅是方差","start":1031.49,"end":1035.09},{"id":70,"text":"because it also has noise. We're going to come to exactly what those terms are.","zh":"因为测试误差还包含噪声。我们将会准确地解释这些术语。","start":1035.09,"end":1038.39},{"id":71,"text":"And the test error will also have this bias squared component to it. So bias will leak into","zh":"测试误差也会包含偏差平方的成分。因此，偏差也会渗入到测试误差中","start":1038.51,"end":1042.91},{"id":72,"text":"that as well there. You're right to think about train error as primarily having something in bias","zh":"同样，你认为训练误差主要反映的是你对数据拟合得如何不好，这是正确的","start":1042.91,"end":1048.07},{"id":73,"text":"of like, how poorly are you fitting your data? In practice, there could also be other errors","zh":"即，你拟合数据的程度有多差。在实践中，还可能存在其他与优化相关的误差","start":1048.07,"end":1052.97},{"id":74,"text":"that have to do with optimization. But assuming you got to the right model,","zh":"但假设你已经得到了正确的模型，","start":1052.97,"end":1056.03},{"id":75,"text":"then your intuitive understanding is absolutely perfect.","zh":"那么你的直觉理解是完全正确的。","start":1056.03,"end":1058.25},{"id":76,"text":"Great.","zh":"很好。","start":1058.39,"end":1058.55},{"id":77,"text":"Great job.","zh":"做得很好。","start":1058.59,"end":1058.93},{"id":78,"text":"Wonderful question.","zh":"非常好的问题。","start":1059.93,"end":1060.55},{"id":79,"text":"Are there others?","zh":"还有其他问题吗？","start":1060.73,"end":1061.19},{"id":80,"text":"We're going to see exactly that decomposition of the test error","zh":"我们将在接下来的两到三张幻灯片中看到测试误差的确切分解。","start":1062.77,"end":1065.25},{"id":81,"text":"in the next two, three slides.","zh":"其他问题吗？","start":1065.81,"end":1066.89},{"id":82,"text":"Other questions?","zh":"还有其他问题吗？","start":1069.99,"end":1070.63},{"id":83,"text":"Awesome.","zh":"太棒了。","start":1072.37,"end":1072.73},{"id":84,"text":"Let's keep going.","zh":"我们继续吧。","start":1072.87,"end":1073.45},{"id":85,"text":"Oh, I wanted to make this point.","zh":"哦，我想强调这一点。","start":1073.57,"end":1074.81},{"id":86,"text":"I know I made it brief.","zh":"我知道我讲得简短了些。","start":1074.91,"end":1075.69},{"id":87,"text":"of class the story is easy in regression the reason i'm going to show it in regression is","zh":"在回归问题中，这个故事很简单，我之所以在回归中展示它，是因为数学推导非常直观，所有的推导都很简单。分类问题也有类似的问题，","start":1077.12,"end":1081.22},{"id":88,"text":"because the math is really easy to see it's like all simple derivations classification also has","zh":"你面对这些高维问题，就像我们之前简要讨论过的那样，你会看到这些奇怪的、不寻常的岛屿状区域，","start":1081.22,"end":1087.0},{"id":89,"text":"this problem right where you have these high dimensional kinds of issues right like we talked","zh":"这些区域在数据分布中可能会出现，这会导致模型难以学习。","start":1087.0,"end":1091.44},{"id":90,"text":"about this almost briefly before you see how there's these kind of strange weird islands that","zh":"在你看到这些奇怪的岛屿之前，我们几乎简要地谈谈这个","start":1091.44,"end":1095.38},{"id":91,"text":"are there this could be quite disturbing right if you just take your point here and wiggle it a","zh":"这里可能会相当令人困扰，如果你只是在这里的点上稍微移动一下，你就会从一个类别跳到另一个类别，对吧？","start":1095.38,"end":1100.16},{"id":92,"text":"little bit you go from one class to the other right if i look at any of these regions if there's","zh":"如果你看一下这些区域中的任何一个，如果存在一个小区域，那可能实际上是一个岛屿，位于红色类别和蓝色类别之间，对吧？","start":1100.16,"end":1104.22},{"id":93,"text":"a small little region there it could be that that is actually an island that is in you know the red","zh":"但可能我们期望决策面应该稍微平滑一些，对吧？这只是一个直觉，但希望这能让你明白。如果你在特征中存在少量误差，却导致了不同的类别，你会感到惊讶，对吧？","start":1104.22,"end":1109.1},{"id":94,"text":"class versus the blue class but probably we expect that the decision surface should be a little bit","zh":"例如，在内部运作中，这种情况会发生，它在分类中发生，但更突然一些。","start":1109.1,"end":1114.24},{"id":95,"text":"smoother okay and that's just intuition but hopefully that that makes sense you would be","zh":"重点在于，我们处理的是模型的类别。","start":1114.24,"end":1118.84},{"id":96,"text":"surprised if you had a small amount of error in your features that led to a different class for","zh":"这里可能会相当令人困扰，如果你只是在这里的点上稍微移动一下，你就会从一个类别跳到另一个类别，对吧？","start":1118.84,"end":1123.8},{"id":97,"text":"example underneath the covers so this all happens in classification it just happens more abruptly","zh":"如果你看一下这些区域中的任何一个，如果存在一个小区域，那可能实际上是一个岛屿，位于红色类别和蓝色类别之间，对吧？","start":1123.8,"end":1127.98},{"id":98,"text":"And the point is, it's about the model class that we're dealing with.","zh":"但可能我们期望决策面应该稍微平滑一些，对吧？这只是一个直觉，但希望这能让你明白。如果你在特征中存在少量误差，却导致了不同的类别，你会感到惊讶，对吧？","start":1127.98,"end":1131.16},{"id":99,"text":"All right.","zh":"好的。","start":1133.58,"end":1134.1},{"id":100,"text":"That was the intuitive piece. I hope it was intuitive.","zh":"那是直观的部分。我希望它很直观。","start":1136.3,"end":1138.42},{"id":101,"text":"You see what the main characters are. Please go ahead. Yeah.","zh":"你看到了主要的角色。请继续。是的。","start":1138.56,"end":1140.52},{"id":102,"text":"Awesome question. So the question is, are all little wiggles in changing class bad?","zh":"非常好的问题。问题是，所有在类别变化中的小波动都是不好的吗？","start":1150.52,"end":1154.2},{"id":103,"text":"And the answer is, of course not.","zh":"答案当然是不是。","start":1154.36,"end":1155.82},{"id":104,"text":"Even on this model, which I claimed was good, a little wiggle does change potentially the thing if you're close to the decision surface.","zh":"即使在这个我声称是好的模型上，一个小波动在接近决策面时，可能会改变结果。","start":1155.82,"end":1161.96},{"id":105,"text":"It will always be the case that some models come in.","zh":"总会有一些模型出现。","start":1162.22,"end":1164.98},{"id":106,"text":"What I'm trying to get across here, and it's a great point, I didn't do a wonderful job on it, is if you have these things which are somehow discontinuous in the space,","zh":"我想传达的是，这是一个很好的观点，我在这方面做得不够好，如果你有一些在空间中某种不连续的东西，","start":1165.18,"end":1172.02},{"id":107,"text":"then the space, the featurization somehow doesn't quite capture the class.","zh":"那么这个空间，这种特征化方法在某种程度上并没有很好地捕捉到类别。","start":1172.14,"end":1175.88},{"id":108,"text":"And so what's going on there is you have these little pockets or these little islands, and it can just be kind of overfitting.","zh":"在这种情况下，你看到的是这些小区域或者小岛屿，这可能只是过拟合的表现。","start":1176.22,"end":1181.3},{"id":109,"text":"This is the analog of what you were seeing when you saw the function kind of wildly off.","zh":"这类似于你之前看到的函数表现得非常离谱的情况。","start":1181.3,"end":1185.12}],"notes":["本段讨论了分类问题中决策边界附近的不连续性问题，指出在高维空间中可能存在一些‘岛屿’区域，这些区域的类别可能突然变化，这与特征空间的表示能力有关。讲者强调，这种现象在分类任务中更为明显，因为决策边界的变化更突然。","讲者提到，即使在被认为表现良好的模型中，靠近决策边界的微小扰动也可能导致类别变化，这说明模型对输入的敏感性。这种现象可能与过拟合有关，即模型在训练数据上表现良好，但在测试数据上泛化能力不足。","讲者指出，特征空间的表示能力可能不足以捕捉类别之间的连续性，导致模型在某些区域出现不连续的决策边界。这种不连续性可能源于特征选择不当或模型复杂度过高。","讲者通过类比函数的剧烈波动，说明在分类任务中，模型可能在某些区域表现出不稳定的决策边界，这与特征空间的结构有关。这种现象在高维空间中尤为明显。","讲者强调，模型的类别选择（即模型的结构）对决策边界的性质有重要影响。不同的模型可能在处理高维数据时表现出不同的行为，例如更平滑或更不连续的决策边界。","讲者最后指出，这种不连续性可能与特征空间的表示能力有关，因此在实际应用中需要关注特征的选择和模型的复杂度，以避免过拟合和决策边界的不稳定性。"],"formulas":[],"uncertainties":["of class the story is easy in regression the reason i'm going to show it in regression is","because the math is really easy to see it's like all simple derivations classification also has","this problem right where you have these high dimensional kinds of issues right like we talked","about this almost briefly before you see how there's these kind of strange weird islands that","are there this could be quite disturbing right if you just take your point here and wiggle it a","little bit you go from one class to the other right if i look at any of these regions if there's","a small little region there it could be that that is actually an island that is in you know the red","class versus the blue class but probably we expect that the decision surface should be a little bit","smoother okay and that's just intuition but hopefully that that makes sense you would be","surprised if you had a small amount of error in your features that led to a different class for","example underneath the covers so this all happens in classification it just happens more abruptly"],"diagram":"none","start":1018.57,"end":1185.12,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":43,"raw_segments":[{"start":1018.57,"text":"I was going to ask, is it true that train error reflects bias and test error reflects variance?"},{"start":1026.63,"text":"Wonderful question. So the question is, does train error reflect bias? Is it captured in there?"},{"start":1031.49,"text":"And does test error reflect the variance? It reflects a little bit more than variance"},{"start":1035.09,"text":"because it also has noise. We're going to come to exactly what those terms are."},{"start":1038.51,"text":"And the test error will also have this bias squared component to it. So bias will leak into"},{"start":1042.91,"text":"that as well there. You're right to think about train error as primarily having something in bias"},{"start":1048.07,"text":"of like, how poorly are you fitting your data? In practice, there could also be other errors"},{"start":1052.97,"text":"that have to do with optimization. But assuming you got to the right model,"},{"start":1056.03,"text":"then your intuitive understanding is absolutely perfect."},{"start":1058.39,"text":"Great."},{"start":1058.59,"text":"Great job."},{"start":1059.93,"text":"Wonderful question."},{"start":1060.73,"text":"Are there others?"},{"start":1062.77,"text":"We're going to see exactly that decomposition of the test error"},{"start":1065.81,"text":"in the next two, three slides."},{"start":1069.99,"text":"Other questions?"},{"start":1072.37,"text":"Awesome."},{"start":1072.87,"text":"Let's keep going."},{"start":1073.57,"text":"Oh, I wanted to make this point."},{"start":1074.91,"text":"I know I made it brief."},{"start":1077.12,"text":"of class the story is easy in regression the reason i'm going to show it in regression is"},{"start":1081.22,"text":"because the math is really easy to see it's like all simple derivations classification also has"},{"start":1087.0,"text":"this problem right where you have these high dimensional kinds of issues right like we talked"},{"start":1091.44,"text":"about this almost briefly before you see how there's these kind of strange weird islands that"},{"start":1095.38,"text":"are there this could be quite disturbing right if you just take your point here and wiggle it a"},{"start":1100.16,"text":"little bit you go from one class to the other right if i look at any of these regions if there's"},{"start":1104.22,"text":"a small little region there it could be that that is actually an island that is in you know the red"},{"start":1109.1,"text":"class versus the blue class but probably we expect that the decision surface should be a little bit"},{"start":1114.24,"text":"smoother okay and that's just intuition but hopefully that that makes sense you would be"},{"start":1118.84,"text":"surprised if you had a small amount of error in your features that led to a different class for"},{"start":1123.8,"text":"example underneath the covers so this all happens in classification it just happens more abruptly"},{"start":1127.98,"text":"And the point is, it's about the model class that we're dealing with."},{"start":1133.58,"text":"All right."},{"start":1136.3,"text":"That was the intuitive piece. I hope it was intuitive."},{"start":1138.56,"text":"You see what the main characters are. Please go ahead. Yeah."},{"start":1150.52,"text":"Awesome question. So the question is, are all little wiggles in changing class bad?"},{"start":1154.36,"text":"And the answer is, of course not."},{"start":1155.82,"text":"Even on this model, which I claimed was good, a little wiggle does change potentially the thing if you're close to the decision surface."},{"start":1162.22,"text":"It will always be the case that some models come in."},{"start":1165.18,"text":"What I'm trying to get across here, and it's a great point, I didn't do a wonderful job on it, is if you have these things which are somehow discontinuous in the space,"},{"start":1172.14,"text":"then the space, the featurization somehow doesn't quite capture the class."},{"start":1176.22,"text":"And so what's going on there is you have these little pockets or these little islands, and it can just be kind of overfitting."},{"start":1181.3,"text":"This is the analog of what you were seeing when you saw the function kind of wildly off."}],"speech_gaps":[{"start":1141.328,"end":1150.12}],"frame":"../frames/v047/007.webp","frame_time":1030.5700000000002},{"title":"数据集划分与机器学习建议","segments":[{"id":110,"text":"And so we tend to think, hey, this may be a warning sign. But you're exactly right that this could actually just be the class boundary. That could also be the case. It just seems intuitively less likely. Great question. Others? Awesome. All right. Bias, variance, decomposition. So we're going to talk about this precise model of overfitting and underfitting now. And it's going to be just a very simple mathematical thought procedure. So let's walk through exactly how it works. So here's a thought procedure. We're going to fix a test point x.","zh":"因此，我们倾向于认为，这可能是一个警告信号。但你完全正确，这实际上可能只是类别边界。这也可能是这种情况。它看起来在直觉上不太可能。非常好的问题。还有其他人吗？太棒了。好的，偏差、方差分解。现在我们将讨论这个精确的过拟合和欠拟合模型。它将只是一个非常简单的数学思考过程。让我们详细地走一遍这个过程。这里有一个思考过程。我们将固定一个测试点x。","start":1185.42,"end":1219.65},{"id":111,"text":"And really, I'm not going to be precise about how we pick x, but your reasoning shouldn't depend on x. You're not going to pick something specific about the function. You're not going to look at its decision surface or anything else. You're kind of picking a generic function x. Does that make sense? Then you're going to draw n training points, xi's and yi's. That's your si that you had from before, the last slide. This is one sample of the training set.","zh":"实际上，我不会精确地说明我们如何选择x，但你的推理不应该依赖于x。你不会选择函数的特定部分。你不会查看它的决策面或任何其他东西。你基本上是在选择一个通用的函数x。这清楚吗？然后你将绘制n个训练点，xi和yi。这就是你之前从上一张幻灯片中得到的si。这是训练集的一个样本。","start":1220.6,"end":1243.59},{"id":112,"text":"Then you're going to train a linear regressor or a hypothesis, whatever hypothesis you want. For this point of view, linear regressor is probably overkill. I should just cross that out. It doesn't really matter what we're going to do next. Who cares about this? You're going to train a hypothesis, H. Get that hypothesis on there.","zh":"然后你将训练一个线性回归器或一个假设，无论你想选择什么假设。从这个角度来看，线性回归器可能过于复杂。我应该划掉它。我们接下来做什么其实并不重要。谁在乎这个？你将训练一个假设H。把那个假设放到那里。","start":1246.03,"end":1278.22},{"id":113,"text":"And then you're going to measure this quantity, which has a fancy name. It's sometimes called statistical risk. But you're basically going to say, with the h that I've learned on the set, that's what this h of s notation means. So you've given me a training set. I fit a line or a quadratic or whatever my hypothesis class is. I'm going to use that to predict on the x that I selected at this test point, its y value. And I'm going to suffer in the terminology. It's kind of a grim way to put it, but it is the terminology. I'm going to suffer a loss.","zh":"然后你将测量这个量，它有一个正式的名称。有时被称为统计风险。但你基本上会说，用我从数据集中学习到的h，这就是这个h of s符号的含义。你给了我一个训练集。我拟合一条线或一个二次曲线，或者我的假设类中的任何东西。我将使用它来预测我在测试点选择的x的y值。我将遭受损失。这是一种有点阴暗的说法，但这就是术语。我将遭受损失。","start":1281.32,"end":1309.4},{"id":114,"text":"And then you're going to measure this quantity, which has a fancy name. It's sometimes called statistical risk. But you're basically going to say, with the h that I've learned on the set, that's what this h of s notation means. So you've given me a training set. I fit a line or a quadratic or whatever my hypothesis class is. I'm going to use that to predict on the x that I selected at this test point, its y value. And I'm going to suffer in the terminology. It's kind of a grim way to put it, but it is the terminology. I'm going to suffer a loss.","zh":"然后你将测量这个量，它有一个 fancy 的名称，有时被称为统计风险。但你基本上会说，用我在训练集上学到的 h，这就是 h of s 的表示意思。你给了我一个训练集，我拟合了一条线或一个二次函数，或者我的假设类中的任何东西。我将用它来预测我在这个测试点选择的 x 的 y 值。并且我将承受这个术语。这是一种有点阴郁的说法，但这就是术语。我将承受损失。","start":1310.96,"end":1341.19},{"id":115,"text":"But it's just uniformity. Train and test are the same. All right. Now, what we're going to analyze is a procedure that's actually quite complicated if you thought through the details of it, which is we're going to average over all the randomness that we did in this and try and analyze the quantities underneath the covers.","zh":"但这只是统一性。训练和测试是相同的。好的。现在，我们将分析一个过程，如果你仔细考虑其细节，它实际上相当复杂，即我们将平均所有在这个过程中引入的随机性，并尝试分析其底层的量。","start":1341.86,"end":1362.08}],"notes":["本段讲解了机器学习中模型评估的基本思想，即通过固定测试点并使用训练集训练模型，然后在测试集上评估模型的性能。这里强调了模型的预测误差，即统计风险，它与模型在测试点上的预测值和真实值之间的差异有关。","讲者提到，模型的预测误差可以分解为两部分：模型本身的偏差（bias）和数据的噪声（error）。偏差反映了模型对数据的拟合能力，而噪声则代表了数据本身的不确定性。","在讲解过程中，讲者指出，测试数据和训练数据的生成方式是相同的，因此模型在测试集上的表现可以用来评估其泛化能力。同时，讲者提到，模型的预测误差与测试点的噪声有关，这在后续的计算中会进一步展开。","讲者还提到，模型的预测误差可以通过平方损失来衡量，这与模型在测试点上的预测值和真实值之间的差异有关。这种损失函数是机器学习中常用的评估指标。","最后，讲者指出，为了分析模型的性能，需要对整个过程中的随机性进行平均，从而得到模型在不同数据集上的平均表现。这种分析方法是理解模型泛化能力的重要工具。","讲者强调，模型的预测误差不仅与模型本身的结构有关，还与数据的生成方式有关。因此，在评估模型时，需要考虑数据的噪声和模型的偏差，以全面理解模型的性能。"],"formulas":[{"latex":"L(h, x) = (Y - h(x))^2","symbols":"损失函数，表示模型预测值与真实值之间的平方误差","explanation":"该公式正确表达了平方误差损失函数，其中Y是真实值，h(x)是模型预测值。","evidence":"Proportional to the square. That's the risk. Please. Great question. So where does the question is, why are we adding this Y error underneath the covers? And that Y error is something that we would observe on any point, right? So the mental model is that this is the way that data are created. And the test data is created in the same way as the train is created, that we would have that underneath the covers. We will guess that it's this value. And we'll come to exactly how that epsilon figures into our calculations in just one second."},{"latex":"R(h) = \\mathbb{E}[L(h, x)]","symbols":"统计风险，表示模型在所有可能的测试点上的平均损失","explanation":"该公式正确表达了统计风险，即对损失函数L(h, x)在所有可能的测试点x上的期望值。","evidence":"Proportional to the square. That's the risk. Please. Great question. So where does the question is, why are we adding this Y error underneath the covers? And that Y error is something that we would observe on any point, right? So the mental model is that this is the way that data are created. And the test data is created in the same way as the train is created, that we would have that underneath the covers. We will guess that it's this value. And we'll come to exactly how that epsilon figures into our calculations in just one second."}],"uncertainties":["Y error"],"diagram":"none","start":1185.42,"end":1362.08,"asr_flags":[],"math_clarifications":["公式中的期望符号应使用\\mathbb{E}以符合数学惯例。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1185.42,"text":"And so we tend to think, hey, this may be a warning sign. But you're exactly right that this could actually just be the class boundary. That could also be the case. It just seems intuitively less likely. Great question. Others? Awesome. All right. Bias, variance, decomposition. So we're going to talk about this precise model of overfitting and underfitting now. And it's going to be just a very simple mathematical thought procedure. So let's walk through exactly how it works. So here's a thought procedure. We're going to fix a test point x."},{"start":1220.6,"text":"And really, I'm not going to be precise about how we pick x, but your reasoning shouldn't depend on x. You're not going to pick something specific about the function. You're not going to look at its decision surface or anything else. You're kind of picking a generic function x. Does that make sense? Then you're going to draw n training points, xi's and yi's. That's your si that you had from before, the last slide. This is one sample of the training set."},{"start":1246.03,"text":"Then you're going to train a linear regressor or a hypothesis, whatever hypothesis you want. For this point of view, linear regressor is probably overkill. I should just cross that out. It doesn't really matter what we're going to do next. Who cares about this? You're going to train a hypothesis, H. Get that hypothesis on there. Then you're going to draw a fresh sample at test time, X and Y, and you're going to check this. You're going to compute what is the model, Y at that point."},{"start":1281.32,"text":"And then you're going to measure this quantity, which has a fancy name. It's sometimes called statistical risk. But you're basically going to say, with the h that I've learned on the set, that's what this h of s notation means. So you've given me a training set. I fit a line or a quadratic or whatever my hypothesis class is. I'm going to use that to predict on the x that I selected at this test point, its y value. And I'm going to su
