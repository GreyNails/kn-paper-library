"id":366,"text":"if anyone knows what that is, the format that you have a whole bunch of bits for precision,"},{"id":367,"text":"maybe that will be okay. As you go down in machine learning, we use lower and lower bits of"},{"id":368,"text":"precision. So numerical precision is like FP64. That's what a numericist cares about. But we may"},{"id":369,"text":"You may train in FPA."},{"id":370,"text":"That means we only have eight bits of precision. Three plus five is usually the way you do it. It doesn't really matter. The points is fewer. And so then those instabilities really compound. And so those numbers are picked so that you don't have numerical precision errors and also that you get this little bit of bias. And really machine learning has gone to lots of sloppy values."},{"id":371,"text":"thrown out a problem rather than really precise values. So if you went to a statistician and use the R package, they would really care about getting all of the bits of precision and they would be very careful about how the regularizers were set. Trevor Hastie has a wonderful set of papers about what's called the lasso path, which is instead of L2, you use L1. This is exactly what happens to the model and they know exactly how to compute every detail. Machine learning, we don't really care. If I'm honest, we're just like, yeah, sounds good. I'm going to show you in one second. Here are other ways to regularize your models."},{"id":372,"text":"Randomly zero out things while you're running. Take your data and screw with it. That's data augmentation. Take the data as it runs and say those numbers got too big and divide them. That's called layer norm. Literally, this is the stuff we do. You just look at the data and you're like, oh, it looks bad. Fix it. And these are the things that basically discourage the model from just fitting too much to one point."}],"notes":["本段讨论了在机器学习中使用正则化技术时，如何通过调整参数（如lambda）来控制模型复杂度。讲者提到，当修改模型时，不仅需要调整lambda，还需要修改输入特征x，以确保模型的稳定性。此外，还提到在数值计算中，浮点精度（如FP32和FP64）对模型训练的影响，以及如何通过设置合适的数值来避免数值误差。","讲者提到，一些数值（如Karpathy常数）是经验性设置的，用于在正则化中取得良好的效果。这些数值的设置不仅考虑了正则化性能，还涉及数值计算中的稳定性问题。例如，当系统条件数很高时，小的输入变化可能导致输出的大幅波动，因此需要设置合适的数值以避免这种不稳定性。","讲者还对比了统计学和机器学习在数值精度上的不同态度。统计学家会非常关注数值精度，而机器学习则更倾向于使用较为粗糙的数值设置。例如，使用L1正则化（lasso）而不是L2正则化（ridge），并提到Trevor Hastie的相关研究。","在模型训练中，除了正则化，还有其他方法可以用来控制模型复杂度，例如数据增强（随机零值化）和层归一化（layer norm）。这些方法通过调整数据或模型输出来防止模型过度拟合。","讲者强调，机器学习中经常使用经验性设置的数值，而不是精确的数学计算。这可能是因为在实际应用中，模型的性能往往比严格的数学精度更重要。","最后，讲者提到，机器学习中的正则化方法多种多样，包括随机零值化、数据增强和层归一化等。这些方法的共同目标是防止模型过度拟合，提高模型的泛化能力。"],"formulas":[],"uncertainties":["FP32和FP64的具体定义和区别","Karpathy常数的具体数值和应用场景","L1和L2正则化的具体数学表达式"],"diagram":"none","start":3388.73,"end":3548.44,"asr_flags":[],"raw_segments":[{"start":3388.73,"text":"from XTX, that's actually shooting back through here and only contributing a factor of 10 instead"},{"start":3393.61,"text":"of 10 to the 10, which is a huge win. Now, the reason that that lambda also comes in is when I"},{"start":3399.29,"text":"modify it in this way, I'm also modifying x. So yeah, all good. Awesome."},{"start":3406.73,"text":"Did you say a similar row with an epsilon, where epsilon is like"},{"start":3412.33,"text":"1 to the, or 10 to the negative 5, for example, but with this, would set row to something non-trivial?"},{"start":3421.49,"text":"Yeah, so this is a great question. I was actually going for a walk with Andre a little while ago."},{"start":3426.45,"text":"I believe in the lore, it's called the Karpathy constant, which is like 4e to the minus 3 or"},{"start":3431.87,"text":"something. So this is a joke. But basically, there are a bunch of these values that people"},{"start":3436.77,"text":"heuristically set to have good regularization performance. Part of those are set, by the way,"},{"start":3441.43,"text":"for a different reason, which is that when you do... So those are not for least squares."},{"start":3445.31,"text":"But traditionally, what they're set... That's a step size rule for Atom. But the traditional"},{"start":3449.27,"text":"way that these things are set is that you have other numeric concerns. So for the same reasons"},{"start":3453.67,"text":"we were just discussing, if you have an unstable linear system and the condition number is really"},{"start":3458.77,"text":"high, little changes are going to change data on the output. If you're doing that in FP32,"},{"start":3465.41,"text":"if anyone knows what that is, the format that you have a whole bunch of bits for precision,"},{"start":3468.83,"text":"maybe that will be okay. As you go down in machine learning, we use lower and lower bits of"},{"start":3473.17,"text":"precision. So numerical precision is like FP64. That's what a numericist cares about. But we may"},{"start":3478.45,"text":"You may train in FPA."},{"start":3479.7,"text":"That means we only have eight bits of precision. Three plus five is usually the way you do it. It doesn't really matter. The points is fewer. And so then those instabilities really compound. And so those numbers are picked so that you don't have numerical precision errors and also that you get this little bit of bias. And really machine learning has gone to lots of sloppy values."},{"start":3498.84,"text":"thrown out a problem rather than really precise values. So if you went to a statistician and use the R package, they would really care about getting all of the bits of precision and they would be very careful about how the regularizers were set. Trevor Hastie has a wonderful set of papers about what's called the lasso path, which is instead of L2, you use L1. This is exactly what happens to the model and they know exactly how to compute every detail. Machine learning, we don't really care. If I'm honest, we're just like, yeah, sounds good. I'm going to show you in one second. Here are other ways to regularize your models."},{"start":3527.06,"text":"Randomly zero out things while you're running. Take your data and screw with it. That's data augmentation. Take the data as it runs and say those numbers got too big and divide them. That's called layer norm. Literally, this is the stuff we do. You just look at the data and you're like, oh, it looks bad. Fix it. And these are the things that basically discourage the model from just fitting too much to one point."}],"speech_gaps":[],"frame":"../frames/v047/021.webp","frame_time":3400.73},{"title":"数据集划分与机器学习建议","segments":[{"id":373,"text":"So if all this discussion was lost on you, like, well, how are we getting to test and all the errors? The most engineer intuition you can get is what you're trying to prevent is the model from fitting into the noise, fitting those things that don't matter. So you want your model, you make your model more robust by doing nasty things to it. Okay. And maybe they'll never forgive us when our AI overloads come. Like we didn't want to have dropout. We didn't want you to do, it used to be called optimal brain damage, which is an old paper. Like we didn't want you to do that to us, but we did because we thought it made them more robust."},{"id":374,"text":"So the point is, all of these you can actually formally analyze in the same framework that I gave you earlier. If you go and read the papers, they all do bias, variance, decomposition, and they prove all these. I have a paper on data augmentation. Proves if you do a particular set of augmentations, you take the image, you rotate it a little bit, didn't change from a cat. If I take a picture of a cat and I rotate it a little bit, still a cat. I zoom in a little bit, still a cat. But the model may have picked up on noise, and so by doing those augmentations, I made it more robust. That's also a form of regularization. Please."},{"id":375,"text":"The standard intuition for picking real is obviously like if the Y values are much higher than that."},{"id":376,"text":"Awesome question."},{"id":377,"text":"So the question is, what is the intuition about picking row?"},{"id":378,"text":"There are some rules of thumb."},{"id":379,"text":"Most of them, I would say, are not all that useful."},{"id":380,"text":"Because what you want is you want them to all be the same scale."},{"id":381,"text":"In two weeks, so you get a well-deserved break for me"},{"id":382,"text":"next week, but in two weeks, I could come back"},{"id":383,"text":"and I'm going to tell you about how to standardize your data"},{"id":384,"text":"and whiten your data."},{"id":385,"text":"And that will deal with the fact when your x's and y's actually"},{"id":386,"text":"have very different scales."},{"id":387,"text":"We'll talk about exactly that problem"},{"id":388,"text":"and how that fits into a class of models which"},{"id":389,"text":"are unsupervised."},{"id":390,"text":"But that's kind of what you do."},{"id":391,"text":"The reason you pick these,"},{"id":392,"text":"it really does come down to trial and error."},{"id":393,"text":"You really do try out multiple values and see how well they generalize."},{"id":394,"text":"The existence of the DevSet is much more trusted by"},{"id":395,"text":"engineers than any amount of math in this space. Please."},{"id":396,"text":"When we're doing the first regularization thingy,"},{"id":397,"text":"we have the LP norm where P is equal to two."},{"id":398,"text":"Do we ever do instances where P is less than one?"},{"id":399,"text":"Wonderful question. So the question is,"},{"id":400,"text":"do we use... Those are not strictly norms. Do we ever use fractional norms or things below one?"},{"id":401,"text":"Traditionally, in machine learning, you'll use the one norm because it's convex."},{"id":402,"text":"That's underneath the covers. You don't use the zero norm, which is the one you want, which says,"},{"id":403,"text":"what are the support underneath? Sparse recovery was the hotness in machine learning 15 years ago."},{"id":404,"text":"So every form of sparse recovery has been beaten to death in some way in some annals paper. So it's"},{"id":405,"text":"all there. And so a lot of those are called gauges. All those things are done. Modern"},{"id":406,"text":"Modern machine learning models don't care about what's called certificates."},{"id":407,"text":"They don't care about getting the right X."},{"id":408,"text":"So that's why, in some ways, the story that I really am dying to tell you is, this is"},{"id":409,"text":"what I've told you right now is classical stats."},{"id":410,"text":"You could have gotten this lecture, maybe higher quality from the stats department 15,"},{"id":411,"text":"20 years ago."},{"id":412,"text":"What I'm going to try and tell you and what happens next is, what did we learn when we"},{"id":413,"text":"started to build these bigger models?"},{"id":414,"text":"And what's on the other side?"},{"id":415,"text":"Because there's a couple of ways that the story is..."}],"notes":["本段讨论了机器学习中防止模型过拟合的策略，强调了通过引入噪声（如Dropout）来增强模型鲁棒性。讲者提到，虽然这些方法可能看起来像是对模型的‘伤害’，但它们有助于模型更好地泛化。此外，讲者还提到数据增强是一种正则化方法，通过旋转、缩放等操作使模型对噪声更鲁棒。","讲者指出，所有这些方法都可以在统一的框架下进行形式化分析，包括偏差-方差分解。他提到，数据增强的论文证明了特定的增强操作（如旋转、缩放）不会改变图像的类别，但可以防止模型学习到噪声，从而提高鲁棒性。","讲者提到，选择数据集的特征时，通常希望所有特征具有相同的尺度。他提到，标准化和白化是处理不同尺度特征的方法，这些方法在无监督模型中尤为重要。","讲者强调，选择特征时需要通过试错来确定最佳方法，因为没有通用的规则。开发集（DevSet）在工程实践中比数学理论更受信任。","讲者讨论了正则化中的Lp范数，特别是L2范数的使用。他提到，虽然L1范数在传统机器学习中更常用，但L0范数（稀疏性）在稀疏恢复中曾是热门研究方向。","讲者指出，现代机器学习模型不再关注严格的数学证明或证书，而是更关注实际效果。他提到，当前的课程内容属于经典统计学，而后续内容将涉及构建更大模型时的新发现。"],"formulas":[{"latex":"L_p \\text{ norm where } p = 2","symbols":"L2范数","explanation":"公式正确，表示L2范数，即欧几里得范数，适用于机器学习中的正则化方法。","evidence":"we have the LP norm where P is equal to two."},{"latex":"L_1 \\text{ norm is convex}","symbols":"L1范数是凸函数","explanation":"公式正确，L1范数是凸函数，常用于稀疏性约束，如Lasso回归。","evidence":"Traditionally, in machine learning, you'll use the one norm because it's convex."}],"uncertainties":["在讲者提到的‘sparse recovery’部分，具体的技术细节和术语可能需要进一步澄清。","在讲者提到‘certificates’时，具体指代的内容可能需要更多上下文来明确。"],"diagram":"none","start":3548.72,"end":3723.8,"asr_flags":[],"math_clarifications":["原文中提到的L_p范数和L_1范数的数学描述准确，符合机器学习中的标准定义。"],"raw_segments":[{"start":3548.72,"text":"So if all this discussion was lost on you of like, well, how are we getting to test and all the errors? The most engineer intuition you can get is what you're trying to prevent is the model from fitting into the noise, fitting those things that don't matter. So you want your model, you make your model more robust by doing nasty things to it. Okay. And maybe they'll never forgive us when our AI overloads come. Like we didn't want to have dropout. We didn't want you to do, it used to be called optimal brain damage, which is a old paper. Like we didn't want you to do that to us, but we did because we thought it made them more robust."},{"start":3577.26,"text":"So the point is, all of these you can actually formally analyze in the same framework that I gave you earlier. If you go and read the papers, they all do bias, variance, decomposition, and they prove all these. I have a paper on data augmentation. Proves if you do a particular set of augmentations, you take the image, you rotate it a little bit, didn't change from a cat. If I take a picture of a cat and I rotate it a little bit, still a cat. I zoom in a little bit, still a cat. But the model may have picked up on noise, and so by doing those augmentations, I made it more robust. That's also a form of regularization. Please."},{"start":3607.71,"text":"The standard intuition for picking real is obviously like if the Y values are much higher than that."},{"start":3613.74,"text":"Awesome question."},{"start":3614.72,"text":"So the question is, what is the intuition about picking row?"},{"start":3617.46,"text":"There are some rules of thumb."},{"start":3619.24,"text":"Most of them, I would say, are not all that useful."},{"start":3621.76,"text":"Because what you want is you want them to all be the same scale."},{"start":3624.38,"text":"In two weeks, so you get a well-deserved break for me"},{"start":3627.38,"text":"next week, but in two weeks, I could come back"},{"start":3629.12,"text":"and I'm going to tell you about how to standardize your data"},{"start":3631.06,"text":"and whiten your data."},{"start":3631.9,"text":"And that will deal with the fact when your x's and y's actually"},{"start":3634.38,"text":"have very different scales."},{"start":3635.56,"text":"We'll talk about exactly that problem"},{"start":3637.1,"text":"and how that fits into a class of models which"},{"start":3639.36,"text":"are unsupervised."},{"start":3641.22,"text":"But that's kind of what you do."},{"start":3642.3,"text":"The reason you pick these,"},{"start":3643.72,"text":"it really does come down to trial and error."},{"start":3645.8,"text":"You really do try out multiple values and see how well they generalize."},{"start":3649.96,"text":"The existence of the DevSet is much more trusted by"},{"start":3652.36,"text":"engineers than any amount of math in this space. Please."},{"start":3656.68,"text":"When we're doing the first regularization thingy,"},{"start":3663.36,"text":"we have the LP norm where P is equal to two."},{"start":3666.62,"text":"Do we ever do instances where P is less than one?"},{"start":3670.16,"text":"Wonderful question. So the question is,"},{"start":3671.66,"text":"do we use... Those are not strictly norms. Do we ever use fractional norms or things below one?"},{"start":3675.66,"text":"Traditionally, in machine learning, you'll use the one norm because it's convex."},{"start":3678.68,"text":"That's underneath the covers. You don't use the zero norm, which is the one you want, which says,"},{"start":3682.94,"text":"what are the support underneath? Sparse recovery was the hotness in machine learning 15 years ago."},{"start":3688.42,"text":"So every form of sparse recovery has been beaten to death in some way in some annals paper. So it's"},{"start":3693.8,"text":"all there. And so a lot of those are called gauges. All those things are done. Modern"},{"start":3699.82,"text":"Modern machine learning models don't care about what's called certificates."},{"start":3702.72,"text":"They don't care about getting the right X."},{"start":3704.44,"text":"So that's why, in some ways, the story that I really am dying to tell you is, this is"},{"start":3708.7,"text":"what I've told you right now is classical stats."},{"start":3710.44,"text":"You could have gotten this lecture, maybe higher quality from the stats department 15,"},{"start":3715.38,"text":"20 years ago."},{"start":3716.12,"text":"What I'm going to try and tell you and what happens next is, what did we learn when we"},{"start":3719.26,"text":"started to build these bigger models?"},{"start":3720.74,"text":"And what's on the other side?"},{"start":3722.06,"text":"Because there's a couple of ways that the story is..."}],"speech_gaps":[],"frame":"../frames/v047/022.webp","frame_time":3560.72},{"title":"现代机器学习中的过拟合与泛化","segments":[{"id":416,"text":"you know, mathematically correct. Everything I've told you is correct. But there's a couple of things that it omits. And that's what I'm most interested to tell you about. Cool. Awesome. All right. I'm going to skip over this Bayesian thing. This is another way to say that I can motivate that theta comes from a Bayesian distribution. And this would be one of those ways to pick, you know, what is the ratio between them. So they are in the notes. But I really want to tell you the modern stuff because I genuinely love this stuff. All right. Okay."},{"id":417,"text":"So the surprise of modern machine learning. So the classical Bayan's variant story tells you beyond some complexity, the test error must rise. That was the picture I showed you. A high degree polynomial that interpolates 15 points should be a complete disaster. You have a model that's extremely powerful. You're fitting fewer points. Something bad is going to happen."},{"id":418,"text":"Now it turns out, and this is pretty interesting, we used to train models, we still do in some cases, train models that have many more parameters than their training points. They interpolate the training set perfectly. They exactly memorize it. But they also generalize. In some cases, generalize better than any model we know. So what the heck is going on here? So for much of the last decade, this puzzle for practitioners was not, how do we avoid overfitting, like I told you, but why aren't we overfitting?"},{"id":419,"text":"That was the crazy thing. We were warned by our statistical priests and priestesses that bad things would happen if we ventured into this dark, you know, woolly land. And then we started training big models and everything got awesome. That's kind of how you can tell which side of the debate I'm on. But, you know, that's kind of how it works. Like, GPT does not care about your least squares regularization. Anyway, it does do regularization stuff under the covers, right? It does do stuff. So it's not true, okay? There's a wonderful paper by Misha and friends. Misha Belkin is the first author."},{"id":420,"text":"And they showed, roughly speaking, that the following bizarre thing happens in a case called kernels, which we'll learn about later, but you don't need to know these particular things, where in the classical regime, you had this issue where the training set, the test error, indeed goes up."},{"id":421,"text":"So model capacity on the x-axis, test error on the y-axis, and this is the regime we've been talking about."},{"id":422,"text":"out. But it turns out, in a totally bizarre twist, that over into some regime where you're massively"},{"id":423,"text":"over-parameterized and past this threshold, the test error actually starts going down again."},{"id":424,"text":"We're going to talk about this in one second. Now, you have only been thinking about bias and"},{"id":425,"text":"variance for probably about 25 minutes or an hour, whatever it's been in the class."},{"id":426,"text":"If you've been thinking about this for 20 years, you're like, oh my god, what are these maniacs"},{"id":427,"text":"talking about. But Misha is brilliant. So when I read this paper, I was like, awesome. Now we"},{"id":428,"text":"understand. Misha wrote a bunch of awesome papers. I really love Misha. Anyway, so this is a"},{"id":429,"text":"classical regime. So here you have this variance explosion, and then all of a sudden it starts"}],"notes":["本段讨论了现代机器学习中一个令人惊讶的现象，即在模型参数远多于训练样本的情况下，测试误差反而会下降。这与传统的过拟合理论相矛盾，传统理论认为模型复杂度增加会导致测试误差上升。","讲者提到，过去人们认为在高复杂度模型中会出现过拟合，但现代研究表明，某些情况下模型反而能更好地泛化。这种现象被称为‘双下降’（double descent）现象。","讲者指出，Misha Belkin及其合作者的研究揭示了这一现象，特别是在核方法（kernels）中，模型在参数数量超过某个阈值后，测试误差开始下降。","讲者强调，这一发现挑战了传统的偏差-方差权衡理论，即模型复杂度增加会导致方差上升，而偏差下降，但传统理论认为方差上升会主导，导致测试误差上升。","讲者提到，这一现象在实际中被观察到，例如像GPT这样的大模型，即使没有显式的正则化，也能实现良好的泛化。","讲者最后指出，这一现象表明，传统的统计理论可能不足以解释现代机器学习的成功，需要新的理论框架来理解模型泛化能力。"],"formulas":[],"uncertainties":["over-parameterized and past this threshold","variance explosion"],"diagram":"none","start":3724.28,"end":3900.48,"asr_flags":[],"raw_segments":[{"start":3724.28,"text":"you know, mathematically correct. Everything I've told you is correct. But there's a couple of things that it omits. And that's what I'm most interested to tell you about. Cool. Awesome. All right. I'm going to skip over this Bayesian thing. This is another way to say that I can motivate that theta comes from a Bayesian distribution. And this would be one of those ways to pick, you know, what is the ratio between them. So they are in the notes. But I really want to tell you the modern stuff because I genuinely love this stuff. All right. Okay."},{"start":3755.89,"text":"So the surprise of modern machine learning. So the classical Bayan's variant story tells you beyond some complexity, the test error must rise. That was the picture I showed you. A high degree polynomial that interpolates 15 points should be a complete disaster. You have a model that's extremely powerful. You're fitting fewer points. Something bad is going to happen."},{"start":3777.33,"text":"Now it turns out, and this is pretty interesting, we used to train models, we still do in some cases, train models that have many more parameters than their training points. They interpolate the training set perfectly. They exactly memorize it. But they also generalize. In some cases, generalize better than any model we know. So what the heck is going on here? So for much of the last decade, this puzzle for practitioners was not, how do we avoid overfitting, like I told you, but why aren't we overfitting?"},{"start":3807.38,"text":"That was the crazy thing. We were warned by our statistical priests and priestesses that bad things would happen if we ventured into this dark, you know, woolly land. And then we started training big models and everything got awesome. That's kind of how you can tell which side of the debate I'm on. But, you know, that's kind of how it works. Like, GPT does not care about your least squares regularization. Anyway, it does do regularization stuff under the covers, right? It does do stuff. So it's not true, okay? There's a wonderful paper by Misha and friends. Misha Belkin is the first author."},{"start":3835.6,"text":"And they showed, roughly speaking, that the following bizarre thing happens in a case called kernels, which we'll learn about later, but you don't need to know these particular things, where in the classical regime, you had this issue where the training set, the test error, indeed goes up."},{"start":3849.38,"text":"So model capacity on the x-axis, test error on the y-axis, and this is the regime we've been talking about."},{"start":3854.3,"text":"out. But it turns out, in a totally bizarre twist, that over into some regime where you're massively"},{"start":3861.3,"text":"over-parameterized and past this threshold, the test error actually starts going down again."},{"start":3868.06,"text":"We're going to talk about this in one second. Now, you have only been thinking about bias and"},{"start":3872.7,"text":"variance for probably about 25 minutes or an hour, whatever it's been in the class."},{"start":3877.1,"text":"If you've been thinking about this for 20 years, you're like, oh my god, what are these maniacs"},{"start":3881.02,"text":"talking about. But Misha is brilliant. So when I read this paper, I was like, awesome. Now we"},{"start":3885.92,"text":"understand. Misha wrote a bunch of awesome papers. I really love Misha. Anyway, so this is a"},{"start":3891.54,"text":"classical regime. So here you have this variance explosion, and then all of a sudden it starts"}],"speech_gaps":[],"frame":"../frames/v047/023.webp","frame_time":3736.28},{"title":"数据集划分与机器学习建议","segments":[{"id":430,"text":"going down. So this phenomenon is called double descent. And the idea is that there are many"},{"id":431,"text":"zero loss solutions and optimizers when they're in this regime over here they'll"},{"id":432,"text":"actually be able to pick out a smooth one and so think back to the picture"},{"id":433,"text":"where you had those polynomials wiggling effectively what it's saying is if I had"},{"id":434,"text":"a massively over determined polynomial and I gave it enough data and I"},{"id":435,"text":"regularized it I let it kind of regular self it would come up with a zero"},{"id":436,"text":"solution that actually generalized that is a wild statement but turns out to be"},{"id":437,"text":"can be true in neural nets and provable in some things."},{"id":438,"text":"So now, does that make sense? So I just wanted to tell you, this is, to me, one of the crazy things. We tell you train and test error matters, and it does. This whole picture is there. But it turns out that most of the progress in the last decade was jumping over this line and trying things that we shouldn't have tried. I don't know what you should take from that, except for that I think it's awesome. And it's phenomenal. Things started to work. Things didn't work, then they started to work."},{"id":439,"text":"Let me tell you one other one. So a separate worry that you have if you've taken a stats class and you're well-versed in it, and it's an interesting worry is, and by the way, this is a real worry. So for example, there's a guy at Stanford, John Yanidis, if you know who John is. John, one of John's great contributions is he told the FDA."},{"id":440,"text":"You should make people register their drug trials in advance. You try a drug, you should tell me what it does in advance, and then I'll come back. And they were very worried if you've ever heard about what's called p-hacking or other things like this, where you try and torture your data into getting to your conclusions. And they had a whole bunch of things where they basically showed that by registering their trials in advance, drugs got safer."},{"id":441,"text":"Monstrous contribution. Every worry to believe that something like that could go on in machine learning, right? You show us the test sets, you give us a benchmark, we all hammer on it collectively, and secretly we're taking bits from the test set and leaking them back into our setup in a way that not even we understand. Is the concern clear? All right. So basically, are they overfitting across papers? And another way to say it is,"},{"id":442,"text":"Do the same good models stay good? That's what we'd be worried about. We'd be worried we tried all this fun stuff out, and then it turned out that one artifact of this dataset called ImageNet, which Fei-Fei created, was leading us in the wrong direction. We thought Model A was better than Model B, but actually it was an artifact of the dataset, and we had been wrong the whole time. All right. So Ben, that's Ben. Ben and Ludwig works here too. Schmidt, that's Ludwig."}],"notes":["本段讨论了机器学习中一个有趣的现象，称为双下降现象。当模型参数数量超过数据量时，模型的测试误差会再次下降，这表明模型在某些情况下能够找到更平滑的解，从而实现更好的泛化。这一现象在神经网络中已被证明，并且在某些情况下是可证明的。","接下来，讲者提到在机器学习中，数据集划分和验证方法的重要性。他指出，过去十年中，许多进展是通过跳过某些关键步骤（如数据集划分）来实现的，这可能带来风险。他强调了测试集和基准的重要性，以及数据泄露的潜在问题。","讲者进一步提到，统计学中的一些问题，如p-hacking，可能在机器学习中也存在。他举了John Yanidis的例子，说明提前注册实验的重要性，以防止数据被人为操控。他指出，如果测试集被泄露，模型可能会过拟合，导致结果不可靠。","最后，讲者提到ImageNet数据集可能对模型性能产生影响。他指出，某些模型的性能差异可能并非真实反映模型能力，而是由于数据集的特性。这提醒我们，在评估模型时，需要考虑数据集的潜在偏差。","讲者还提到，Ben和Ludwig等人的工作，表明在机器学习领域，数据集划分和验证方法的正确使用至关重要。他强调了模型泛化能力的重要性，并指出数据泄露和过拟合是需要警惕的问题。","整体来看，本段内容强调了机器学习中数据集划分、验证方法和模型泛化能力的重要性。讲者通过多个例子，说明了数据泄露、过拟合和数据集偏差可能对模型性能产生的影响，并提醒我们注意这些问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3900.48,"end":4055.76,"asr_flags":[],"raw_segments":[{"start":3900.48,"text":"going down. So this phenomenon is called double descent. And the idea is that there are many"},{"start":3906.16,"text":"zero loss solutions and optimizers when they're in this regime over here they'll"},{"start":3912.76,"text":"actually be able to pick out a smooth one and so think back to the picture"},{"start":3916.48,"text":"where you had those polynomials wiggling effectively what it's saying is if I had"},{"start":3920.56,"text":"a massively over determined polynomial and I gave it enough data and I"},{"start":3925.92,"text":"regularized it I let it kind of regular self it would come up with a zero"},{"start":3929.0,"text":"solution that actually generalized that is a wild statement but turns out to be"},{"start":3935.3,"text":"can be true in neural nets and provable in some things."},{"start":3941.95,"text":"So now, does that make sense? So I just wanted to tell you, this is, to me, one of the crazy things. We tell you train and test error matters, and it does. This whole picture is there. But it turns out that most of the progress in the last decade was jumping over this line and trying things that we shouldn't have tried. I don't know what you should take from that, except for that I think it's awesome. And it's phenomenal. Things started to work. Things didn't work, then they started to work."},{"start":3966.7,"text":"Let me tell you one other one. So a separate worry that you have if you've taken a stats class and you're well-versed in it, and it's an interesting worry is, and by the way, this is a real worry. So for example, there's a guy at Stanford, John Yanidis, if you know who John is. John, one of John's great contributions is he told the FDA."},{"start":3984.5,"text":"You should make people register your drug trials in advance. You try a drug, you should tell me what it does in advance, and then I'll come back. And they were very worried if you've ever heard about what's called p-hacking or other things like this, where you try and torture your data into getting to your conclusions. And they had a whole bunch of things where they basically showed that by registering their trials in advance, drugs got safer."},{"start":4004.1,"text":"Monstrous contribution. Every worry to believe that something like that could go on in machine learning, right? You show us the test sets, you give us a benchmark, we all hammer on it collectively, and secretly we're taking bits from the test set and leaking them back into our setup in a way that not even we understand. Is the concern clear? All right. So basically, are they overfitting across papers? And another way to say it is,"},{"start":4029.4,"text":"Do the same good models stay good? That's what we'd be worried about. We'd be worried we tried all this fun stuff out, and then it turned out that one artifact of this dataset called ImageNet, which Fei-Fei created, was leading us in the wrong direction. We thought Model A was better than Model B, but actually it was an artifact of the dataset, and we had been wrong the whole time. All right. So Ben, that's Ben. Ben and Ludwig works here too. Schmidt, that's Ludwig."}],"speech_gaps":[],"frame":"../frames/v047/024.webp","frame_time":3912.48},{"title":"数据集划分与机器学习建议","segments":[{"id":443,"text":"and the other ones are great too but they don't work here anyway so i didn't talk to them today anyway so built an image set they rebuilt the entire set by hand they went back it was just 10 years later and built it and paid for it and did it and scraped it and cleaned it and tried to replicate exactly the set just on different images it was hard because imaging technology changed a lot in 10 years what images people were changing were there a lot changed here are the results awesome this is the original"},{"id":444,"text":"Think, this is the original ImageNet accuracy. This is the new test set accuracy. If everything were perfect, you would expect it to live here. Something more interesting happened. All the models dropped by almost the same amount. And in fact, if you notice, since they're in a linear order, they didn't change ranking."},{"id":445,"text":"So in a very strange way, and you have to understand, ImageNet was so popular that you had people getting banned at companies for cheating, for trying to download bits of the service, like major companies. You had entire labs funding based on how they were doing at various points in this competition. You had a wild competition to try and climb to the top of this leaderboard where anyone who was doing computer vision effectively was testing, or large people were testing on ImageNet. And in spite of all that effort,"},{"id":446,"text":"A constant loss. And by the way, this constant loss is not mysterious either for another reason, which will come out. I was talking to Ben about it today. This fact that they drop is just basically because you have two different tests in the way that you've constructed them in weights. But the fact that their relative order stayed the same mean that also overfitting is a little bit overblown in this situation. Fascinating stuff. You could really worry about it. So does this mean that you can do whatever you want to your data? No."},{"id":447,"text":"but it does mean that something more robust is going on in these models than we otherwise understood. Super interesting paper. Okay. Yeah, it was exactly 11 points. Not that 11 points is significant. Okay. All right. All right. So I'm going to skip through this. We talked about these two things. We talked about double descent and we talked about robustness."},{"id":448,"text":"So double descent was this idea that beyond the interpolation threshold, implicit bias from the optimizer plays a role and that the explicit regularization used to do and actually it picks out a smooth model. The implicit bias I didn't cover exactly, but you could even see it in least squares. If you pick the least squares optimizer like Penrose inverse or you ran with SGD with a little bit of waiting, you can see that you'll select something interesting. The robustness is also interesting. Even when generalization works in distribution,"}],"notes":["本段讨论了ImageNet数据集的构建过程，包括手动重建数据集、清理和复制图像集，以及由于成像技术的变化带来的挑战。还提到ImageNet的流行程度，包括公司员工因作弊而被禁止，以及整个实验室的资金依赖于ImageNet竞赛的表现。","本段指出，尽管所有模型在新测试集上的准确率都下降了，但它们的相对排名保持不变。这表明模型的过拟合可能被夸大了，但并不意味着可以随意处理数据。","本段介绍了双下降现象，即在插值阈值之后，优化器的隐式偏差起作用，而显式正则化不再有效。隐式偏差在最小二乘法中也可以观察到，例如使用Penrose逆或带有少量等待的SGD。","本段提到模型的鲁棒性，即使在分布外泛化有效的情况下，模型仍然表现出一定的鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4056.64,"end":4208.11,"asr_flags":[],"raw_segments":[{"start":4056.64,"text":"and the other ones are great too but they don't work here anyway so i didn't talk to them today anyway so built an image set they rebuilt the entire set by hand they went back it was just 10 years later and built it and paid for it and did it and scraped it and cleaned it and tried to replicate exactly the set just on different images it was hard because imaging technology changed a lot in 10 years what images people were changing were there a lot changed here are the results awesome this is the original"},{"start":4084.08,"text":"Think, this is the original ImageNet accuracy. This is the new test set accuracy. If everything were perfect, you would expect it to live here. Something more interesting happened. All the models dropped by almost the same amount. And in fact, if you notice, since they're in a linear order, they didn't change ranking."},{"start":4104.52,"text":"So in a very strange way, and you have to understand, ImageNet was so popular that you had people getting banned at companies for cheating, for trying to download bits of the service, like major companies. You had entire labs funding based on how they were doing at various points in this competition. You had a wild competition to try and climb to the top of this leaderboard where anyone who was doing computer vision effectively was testing, or large people were testing on ImageNet. And in spite of all that effort,"},{"start":4132.8,"text":"A constant loss. And by the way, this constant loss is not mysterious either for another reason, which will come out. I was talking to Ben about it today. This fact that they drop is just basically because you have two different tests in the way that you've constructed them in weights. But the fact that their relative order stayed the same mean that also overfitting is a little bit overblown in this situation. Fascinating stuff. You could really worry about it. So does this mean that you can do whatever you want to your data? No."},{"start":4157.89,"text":"but it does mean that something more robust is going on in these models than we otherwise understood. Super interesting paper. Okay. Yeah, it was exactly 11 points. Not that 11 points is significant. Okay. All right. All right. So I'm going to skip through this. We talked about these two things. We talked about double descent and we talked about robustness."},{"start":4180.67,"text":"So double descent was this idea that beyond the interpolation threshold, implicit bias from the optimizer plays a role and that the explicit regularization used to do and actually it picks out a smooth model. The implicit bias I didn't cover exactly, but you could even see it in least squares. If you pick the least squares optimizer like Penrose inverse or you ran with SGD with a little bit of waiting, you can see that you'll select something interesting. The robustness is also interesting. Even when generalization works in distribution,"}],"speech_gaps":[],"frame":"../frames/v047/025.webp","frame_time":4068.64},{"title":"数据集划分与机器学习建议","segments":[{"id":449,"text":"This modest shift costs tens of accuracy points, but it still generalizes. That's the interesting part. It still generalizes even when you do these adaptive things that you think should lead to overfitting. Wild to me. All right. All right. So my point is here. This is the thing I care about for you. You may want to think that machine learning is like this giant solved space. It is not. There's so much stuff we just don't know. 2018 was a while ago, but it wasn't like 100 years ago."},{"id":450,"text":"we still don't know these basic, basic elements of how the world works. And they're coming out again and again and changing how we think about it. It's just a very exciting time in the field. All right. So the last like five or so minutes, I'm going to tell you, I think I'm just going to tell you one of these two things. I'm going to tell you what cross-validation is. And then I'm going to tell you what successive halving or hyperband is because I think it's genuinely useful."},{"id":451,"text":"All right. So cross-validation is basically solving the following problem. Your test set is sacred."},{"id":452,"text":"Every time you peek at it, you could leak information and inflate an estimate of how good you're doing, how well you're doing on the test set. You do typically want to have a dev set where you pick these hyperparameters. And the question is, how much data should you put in the dev set? How much should you put in the test set to ultimately get confidence? And how much should you keep in the training set? And what we found over the years is we want to cram as much as we can in the training set because that seems to lead to better models. But that's the fundamental trade-off that we're worried about."},{"id":453,"text":"So here's the basic idea. So let's say that you train on a set. You have the dev set and you have a set of models. For each candidate, you train a model D and you score on D and you pick the model with the best dev score. If you do that, you can pick a pretty good model. Now, why don't you pick on the train set? This is the only key question I care about."},{"id":454,"text":"Why don't you train a model on the train set and use the best train set as your potential value to pick one of these hyperparameters? Exactly right. You could pick, and the train set for the most expressive model, as we talked about, could be zero. It could go exactly to the bottom."},{"id":455,"text":"So you have this other set that was sampled in an interesting way,"},{"id":456,"text":"and that allows you to get around it."},{"id":457,"text":"Now, what cross-validation does is it says you want to be more data efficient."},{"id":458,"text":"So it says instead of taking the entire train set and splitting an entire dev set,"},{"id":459,"text":"you split it into small pieces."},{"id":460,"text":"This is a classical statistical thing."},{"id":461,"text":"You may have seen this before."},{"id":462,"text":"You split it into small pieces."},{"id":463,"text":"Say you have five pieces."},{"id":464,"text":"You train on four to predict the fifth."},{"id":465,"text":"And that is enough of a mix-up that you're not going to then pick"},{"id":466,"text":"pick the most expressive class because you're going to have this generalization and hold"},{"id":467,"text":"out to one piece."},{"id":468,"text":"But I'm going to tell you about the compute efficient thing in just five minutes."},{"id":469,"text":"Oops, sorry for the scanning."}],"notes":["本段讨论了数据集划分的重要性，特别是训练集、验证集和测试集的划分。讲者指出，测试集是神圣的，不能随意查看，否则会导致信息泄露并高估模型性能。验证集用于选择超参数，而训练集则用于模型训练。讲者强调，训练集应尽可能多，以获得更好的模型，但这也带来了训练集与验证集之间的权衡问题。","讲者提到，交叉验证是一种更高效的数据使用方法，它将数据集划分为多个小块，通过轮流使用其中一部分作为验证集，其余部分作为训练集，从而避免了单一验证集可能带来的偏差。这种方法能够更好地评估模型的泛化能力，防止选择过于复杂的模型。","讲者还提到，交叉验证的核心思想是通过多次划分数据集，使得模型在不同数据子集上的表现更加稳定，从而避免因数据划分方式不同而导致的模型选择偏差。这种方法在统计学中是经典的，也常用于机器学习模型的评估。","讲者指出，交叉验证不仅提高了数据使用效率，还能够帮助模型避免过拟合，尤其是在选择超参数时，通过多次验证可以更准确地评估模型的性能。这种方法在实际应用中非常有用，尤其是在数据量有限的情况下。","讲者提到，虽然交叉验证在数据使用效率方面有优势，但计算效率可能较低，因此还介绍了另一种更高效的算法——Successive Halving或Hyperband。这些方法在计算资源有限的情况下，能够更有效地进行超参数调优。","讲者最后提到，交叉验证的划分方式需要仔细考虑，以确保模型的泛化能力。同时，讲者也提醒听众，数据集划分是一个复杂的问题，需要根据具体任务和数据特点进行调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4208.94,"end":4383.16,"asr_flags":[],"raw_segments":[{"start":4208.94,"text":"This modest shift costs tens of accuracy points, but it still generalizes. That's the interesting part. It still generalizes even when you do these adaptive things that you think should lead to overfitting. Wild to me. All right. All right. So my point is here. This is the thing I care about for you. You may want to think that machine learning is like this giant solved space. It is not. There's so much stuff we just don't know. 2018 was a while ago, but it wasn't like 100 years ago."},{"start":4237.68,"text":"we still don't know these basic, basic elements of how the world works. And they're coming out again and again and changing how we think about it. It's just a very exciting time in the field. All right. So the last like five or so minutes, I'm going to tell you, I think I'm just going to tell you one of these two things. I'm going to tell you what cross-validation is. And then I'm going to tell you what successive halving or hyperband is because I think it's genuinely useful."},{"start":4260.54,"text":"All right. So cross-validation is basically solving the following problem. Your test set is sacred."},{"start":4268.37,"text":"Every time you peek at it, you could leak information and inflate an estimate of how good you're doing, how well you're doing on the test set. You do typically want to have a dev set where you pick these hyperparameters. And the question is, how much data should you put in the dev set? How much should you put in the test set to ultimately get confidence? And how much should you keep in the training set? And what we found over the years is we want to cram as much as we can in the training set because that seems to lead to better models. But that's the fundamental trade-off that we're worried about."},{"start":4297.66,"text":"So here's the basic idea. So let's say that you train on a set. You have the dev set and you have a set of models. For each candidate, you train a model D and you score on D and you pick the model with the best dev score. If you do that, you can pick a pretty good model. Now, why don't you pick on the train set? This is the only key question I care about."},{"start":4324.56,"text":"Why don't you train a model on the train set and use the best train set as your potential value to pick one of these hyperparameters? Exactly right. You could pick, and the train set for the most expressive model, as we talked about, could be zero. It could go exactly to the bottom."},{"start":4341.5,"text":"So you have this other set that was sampled in an interesting way,"},{"start":4344.52,"text":"and that allows you to get around it."},{"start":4346.56,"text":"Now, what cross-validation does is it says you want to be more data efficient."},{"start":4350.66,"text":"So it says instead of taking the entire train set and splitting an entire dev set,"},{"start":4355.04,"text":"you split it into small pieces."},{"start":4358.04,"text":"This is a classical statistical thing."},{"start":4360.3,"text":"You may have seen this before."},{"start":4361.76,"text":"You split it into small pieces."},{"start":4363.44,"text":"Say you have five pieces."},{"start":4364.72,"text":"You train on four to predict the fifth."},{"start":4367.28,"text":"And that is enough of a mix-up that you're not going to then pick"},{"start":4370.88,"text":"pick the most expressive class because you're going to have this generalization and hold"},{"start":4375.56,"text":"out to one piece."},{"start":4376.86,"text":"But I'm going to tell you about the compute efficient thing in just five minutes."},{"start":4380.98,"text":"Oops, sorry for the scanning."}],"speech_gaps":[],"frame":"../frames/v047/026.webp","frame_time":4220.94},{"title":"数据集划分与机器学习建议","segments":[{"id":470,"text":"All right, so here's the idea."},{"id":471,"text":"Okay, so this is Amit, he's at CMU, Jameson, he's at Washington."},{"id":472,"text":"So the core idea here is we're going to try and figure out from the models,"},{"id":473,"text":"we're going to try and run various different regularization parameters."},{"id":474,"text":"Say the row, we're going to pick all the different rows and we're going to run them."},{"id":475,"text":"And the idea is we're going to do the following."},{"id":476,"text":"We're going to run all candidate models for a small number of steps."},{"id":477,"text":"So we're going to grid our rows into small values."},{"id":478,"text":"Row one, row two, row three, just try them, maybe at different octaves, whatever you like."},{"id":479,"text":"We're going to score them all and we're going to drop the worst half."},{"id":480,"text":"Then we're going to run the survivor for twice as many steps."},{"id":481,"text":"Okay? And we're going to repeat this until one model remains. And so let's see it in action."},{"id":482,"text":"So each round is going to reuse roughly the same amount of total compute, but better models are"},{"id":483,"text":"going to receive exponentially more of it. Every round, better models are getting more and more"},{"id":484,"text":"data. Okay? So here's how it works. So we run the first set. We have these different configurations,"},{"id":485,"text":"A through eight."},{"id":486,"text":"And here we are basically picking the smallest scores. And so we pick the smallest scores, A wins, C wins, E wins, G wins, in a sense that they are in the top half of models. Then we run them, but we run them for twice as long. So A is getting actually three times as much compute as B. So we're devoting more resources to the things that we think are promising. When we run again, we see here that after the second half,"},{"id":487,"text":"A and C are scoring better than E and G, and so we keep them. We continue to run, and we continue to run. Clear enough how it works? Please. Here, there's no need to sample. Here, what we're doing is we are just running them all in parallel. There's no sampling going on whatsoever."},{"id":488,"text":"Here, yeah. Underneath the covers in this abstraction, they're just running for however long goes underneath the covers. This is just about saving compute. So what's going on here is, let's say that we're going to have to fit some big model, and that model is going to take two days to run. We have eight configurations of that model. So we can either rate 16 compute days, or we could try and figure out which one are we going to run faster. You continue. So each one of these continues. As you notice, the scores are going down monotonically. You got this exactly right."},{"id":489,"text":"Hopefully, though, this is clear. What I've done is, so all the compute, basically, that went into these characters in the final analysis is wasted. But a large fraction, you compute the exact fraction, went into the model that was eventually the winner, which I can then use to continue. So this very simple idea, by the way, did a huge, huge service because you could do very complicated things in tuning. But that simple trick is one that I use kind of all the time. Very simple to implement."}],"notes":["本段讲解了机器学习中一种模型选择和优化的策略，即通过逐步淘汰表现较差的模型，将更多计算资源分配给表现较好的模型。这种方法的核心思想是通过多次迭代，每次保留表现最好的一半模型，并将计算资源加倍分配给这些模型，从而更高效地找到最优模型。","在具体操作中，首先会运行所有候选模型，使用较小的计算步骤，然后根据模型表现淘汰较差的一半。剩下的模型将获得更多的计算资源，继续运行。这个过程会重复进行，直到只剩下一个模型为止。这种方法可以节省计算资源，同时提高模型选择的效率。","在实际操作中，模型的评分是关键，评分越低的模型越可能被淘汰。通过这种方式，可以确保资源被分配给最有潜力的模型。例如，模型A在第一次运行后表现较好，因此会获得更多的计算资源，从而在后续的迭代中进一步优化。","这种方法的一个重要特点是，每次迭代中，资源的分配是基于模型的表现，而不是随机选择。因此，资源的分配更加高效，能够更快地收敛到最优模型。","此外，这种方法还可以用于大规模模型的训练，例如需要两天时间运行的模型。通过这种方法，可以减少总的计算时间，同时确保最终模型的质量。","最后，作者提到这种方法虽然简单，但非常有效，可以用于复杂的模型调优任务。这种方法的实现也非常简单，只需要在每次迭代中根据模型表现调整资源分配即可。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4385.96,"end":4561.96,"asr_flags":[],"raw_segments":[{"start":4385.96,"text":"All right, so here's the idea."},{"start":4392.02,"text":"Okay, so this is Amit, he's at CMU, Jameson, he's at Washington."},{"start":4396.3,"text":"So the core idea here is we're going to try and figure out from the models,"},{"start":4400.62,"text":"we're going to try and run various different regularization parameters."},{"start":4403.52,"text":"Say the row, we're going to pick all the different rows and we're going to run them."},{"start":4407.18,"text":"And the idea is we're going to do the following."},{"start":4408.9,"text":"We're going to run all candidate models for a small number of steps."},{"start":4412.06,"text":"So we're going to grid our rows into small values."},{"start":4414.88,"text":"Row one, row two, row three, just try them, maybe at different octaves, whatever you like."},{"start":4419.46,"text":"We're going to score them all and we're going to drop the worst half."},{"start":4423.66,"text":"Then we're going to run the survivor for twice as many steps."},{"start":4427.68,"text":"Okay? And we're going to repeat this until one model remains. And so let's see it in action."},{"start":4432.5,"text":"So each round is going to reuse roughly the same amount of total compute, but better models are"},{"start":4437.04,"text":"going to receive exponentially more of it. Every round, better models are getting more and more"},{"start":4440.66,"text":"data. Okay? So here's how it works. So we run the first set. We have these different configurations,"},{"start":4447.32,"text":"A through eight."},{"start":4449.56,"text":"And here we are basically picking the smallest scores. And so we pick the smallest scores, A wins, C wins, E wins, G wins, in a sense that they are in the top half of models. Then we run them, but we run them for twice as long. So A is getting actually three times as much compute as B. So we're devoting more resources to the things that we think are promising. When we run again, we see here that after the second half,"},{"start":4477.51,"text":"A and C are scoring better than E and G, and so we keep them. We continue to run, and we continue to run. Clear enough how it works? Please. Here, there's no need to sample. Here, what we're doing is we are just running them all in parallel. There's no sampling going on whatsoever."},{"start":4499.85,"text":"Here, yeah. Underneath the covers in this abstraction, they're just running for however long goes underneath the covers. This is just about saving compute. So what's going on here is, let's say that we're going to have to fit some big model, and that model is going to take two days to run. We have eight configurations of that model. So we can either rate 16 compute days, or we could try and figure out which one are we going to run faster. You continue. So each one of these continues. As you notice, the scores are going down monotonically. You got this exactly right."},{"start":4533.04,"text":"Hopefully, though, this is clear. What I've done is, so all the compute, basically, that went into these characters in the final analysis is wasted. But a large fraction, you compute the exact fraction, went into the model that was eventually the winner, which I can then use to continue. So this very simple idea, by the way, did a huge, huge service because you could do very complicated things in tuning. But that simple trick is one that I use kind of all the time. Very simple to implement."}],"speech_gaps":[],"frame":"../frames/v047/027.webp","frame_time":4397.96},{"title":"数据集划分与机器学习建议","segments":[{"id":490,"text":"has very nice properties, and actually it has a bunch of analysis that says, if you have certain properties on the scores, this is about the optimal thing to do. And there are very complicated procedures that were proposed. I've listed a couple here. Some are quite good, but this is actually this tuning problem is a real problem."},{"id":491,"text":"Okay, so what do we talk about here? I'm just going to get to the thing. So we talked about a couple things. We talked about overfit versus underfit. We learn how the learn function changes when we redraw the training data. This was a change from what we had talked about before. Previously, we had talked about there is a training set, and then we wanted to understand and analyze. Now we're talking about how the training set itself was sampled so that we could talk about the model class. What would happen as we, what we expect to happen for a model on a new data source."},{"id":492,"text":"We then saw those pictures and we turned them into bias variants. We decomposed into three terms. The noise, which was intrinsic in the test set. The bias squared, that was the line that we talked about. And variance, how much it jumped around from training set to training set, how kind of stable things were. We then dealt to deal with variance. We added some regularization."},{"id":493,"text":"We went through fairly quickly ridge regression in detail. And what ridge regression showed us was we could hopefully add a little bit of bias to reduce variance by quite a bit. And that was a general thing of regularization. And I made the point there that there are lots of ways to regularize models in modern parlance. And that this idea really that you should take is anything that prevents us from kind of overfitting to a point or trusting our data too much usually has some interpretation as regularization."},{"id":494,"text":"I couldn't help myself. I don't think you have to know this for the course, but I don't care. I wanted to tell you. Modern models have this twist that past the U-curve that I showed you, the classical kind of bias-variant trade-off curve that I showed you, lives this other regime. And that's where most of the models that you probably use right now live. They live in that over-parameterized regime or in this regime where, as you said, you have huge models relative to the amount of data that's there."},{"id":495,"text":"We talked about double descent, which was that regime, and why robustness matters a little bit. And then this idea about adaptive overfitting, that is being able to take a new data set and apply it in the world. This is a very strong form of generalization. Somehow this still held up even when we were benchmarking. And then we talked a little bit briefly about model selection."}],"notes":["本段讲解了偏差-方差分解的概念，将模型误差分解为噪声、偏差平方和方差三个部分。噪声是测试集固有的随机误差，偏差平方是模型对数据的平均预测与真实值之间的差距，方差则是模型在不同训练集上的预测结果波动程度。通过添加正则化可以减少方差，从而提升模型的泛化能力。","本段介绍了岭回归作为正则化方法的实例，说明通过引入偏差可以显著降低方差。正则化不仅限于岭回归，还包括其他多种方法，其核心思想是防止模型过度拟合训练数据，从而提高模型的泛化能力。","本段讨论了现代机器学习模型所处的过参数化区域，即模型复杂度远高于数据量的区域。在这一区域，传统的偏差-方差权衡曲线不再适用，出现了双下降现象，即随着模型复杂度的增加，测试误差先下降后上升再下降。","本段提到双下降现象和鲁棒性的重要性，以及自适应过拟合的概念，即模型能够将新数据集应用到实际世界中，表现出强大的泛化能力。即使在基准测试中，这种能力仍然有效，说明模型具有良好的泛化性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4562.57,"end":4700.38,"asr_flags":[],"raw_segments":[{"start":4562.57,"text":"has very nice properties, and actually it has a bunch of analysis that says, if you have certain properties on the scores, this is about the optimal thing to do. And there are very complicated procedures that were proposed. I've listed a couple here. Some are quite good, but this is actually this tuning problem is a real problem."},{"start":4580.34,"text":"Okay, so what do we talk about here? I'm just going to get to the thing. So we talked about a couple things. We talked about overfit versus underfit. We learn how the learn function changes when we redraw the training data. This was a change from what we had talked about before. Previously, we had talked about there is a training set, and then we wanted to understand and analyze. Now we're talking about how the training set itself was sampled so that we could talk about the model class. What would happen as we, what we expect to happen for a model on a new data source."},{"start":4606.88,"text":"We then saw those pictures and we turned them into bias variants. We decomposed into three terms. The noise, which was intrinsic in the test set. The bias squared, that was the line that we talked about. And variance, how much it jumped around from training set to training set, how kind of stable things were. We then dealt to deal with variance. We added some regularization."},{"start":4628.26,"text":"We went through fairly quickly ridge regression in detail. And what ridge regression showed us was we could hopefully add a little bit of bias to reduce variance by quite a bit. And that was a general thing of regularization. And I made the point there that there are lots of ways to regularize models in modern parlance. And that this idea really that you should take is anything that prevents us from kind of overfitting to a point or trusting our data too much usually has some interpretation as regularization."},{"start":4653.46,"text":"I couldn't help myself. I don't think you have to know this for the course, but I don't care. I wanted to tell you. Modern models have this twist that past the U-curve that I showed you, the classical kind of bias-variant trade-off curve that I showed you, lives this other regime. And that's where most of the models that you probably use right now live. They live in that over-parameterized regime or in this regime where, as you said, you have huge models relative to the amount of data that's there."},{"start":4676.76,"text":"We talked about double descent, which was that regime, and why robustness matters a little bit. And then this idea about adaptive overfitting, that is being able to take a new data set and apply it in the world. This is a very strong form of generalization. Somehow this still held up even when we were benchmarking. And then we talked a little bit briefly about model selection. With that, thank you so much. Have a great rest of your week. Appreciate your time."}],"speech_gaps":[],"frame":"../frames/v047/028.webp","frame_time":4574.57}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
