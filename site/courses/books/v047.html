on the data. They're really hard to know up front. So we fit row from data. And this is sometimes called hyperparameter optimization. We'll get to that if we have time at the end of this lecture. Effectively, what happens is you have some little dev set that you're developing on. You try various different models. You train on one set. You hold out. You test on another. And you see which row does better. And we'll talk about ways to do that in a more parameter efficient way, or sorry, compute efficient way, where you run fewer.","zh":"好的。因此，一个良好的平衡行会平衡这两者。合适的比率取决于数据。在事先很难知道。因此，我们从数据中拟合行。这有时被称为超参数优化。如果时间允许，我们将在本讲座的末尾讨论这一点。实际上，会发生的是，你有一个小的开发数据集来进行开发。你尝试各种不同的模型。你在一个数据集上进行训练。你保留一部分。你再另一个数据集上进行测试。你看看哪一行表现更好。我们还将讨论更参数高效的方法，或者说更计算高效的方法，这样你运行的试验次数更少。","start":2803.65,"end":2832.93},{"id":303,"text":"or trials to bake off the different rows that you have. And we'll also see ways to do this in a more data efficient way, where you don't have to throw away a lot of your data to be able to have a holdout set. The latter one's called cross-validation. The first one is what this algorithm hyperband does. So this row is a very strange parameter, how it affects things. So why do we penalize?","zh":"或者试验次数来比较你拥有的不同行。我们还将看到如何以更数据高效的方式进行此操作，这样你不需要丢弃大量数据来拥有一个保留集。后者称为交叉验证。前者是该算法Hyperband所做的。因此，这一行是一个非常奇怪的参数，它如何影响事物。那么，为什么我们要进行惩罚？","start":2832.98,"end":2857.28}],"notes":["本段讲解了机器学习中不同的建模选择，如正则化方法（如Dropout和Weight Decay），它们都可以被解释为在权重上添加L2回归。其中，权重收缩（model shrinking）会诱导这种行为，而Dropout则通过论文指出与正则化是相同的。"],"formulas":[{"latex":"L2 \\text{ 正则化: } \\text{惩罚项} = \\frac{\\rho}{2} \\theta^T \\theta","symbols":"ρ：正则化系数；θ：权重向量","explanation":"公式正确表达了L2正则化惩罚项的形式，其中ρ是正则化系数，θ是权重向量。公式中的符号和数学类型均符合标准，无需修改。","evidence":"All right, so if this is going to shrink theta toward the origin, so it just means we don't think it should be too big. It's kind of a soft penalty, okay? Now, if we set it to zero, this is plain, ordinary least squares. If we set it really, really large, there's a value at which basically predicting zero is kind of the best thing to do, right? Because if this thing is massive, as we get closer and closer to setting that to infinity, this one wants zero and this one, and stop caring about the test error. So clearly my point is that there's some sweet spot."}],"uncertainties":["row","balanced row","hyperband","rows","bake off","parameter efficient","compute efficient","data efficient"],"diagram":"none","start":2695.5,"end":2857.28,"asr_flags":[],"math_clarifications":["公式中的符号ρ和θ的中文说明已补充，以确保清晰性。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2695.5,"text":"those are all different modeling choices that you'll have so there's no one that's right or wrong the reason we're going to use this one is the math is super clean it will boil down to exactly something we can see in these squares and this is one of the more common things like if you go and download like a pytorch model one of the ways that you'll probably do uh"},{"start":2713.28,"text":"regression or regularization is, you may use something called dropout or you may use something called weight decay. Both of them can be actually interpreted as adding a form of L2 regression on the weights. One of them, model shrinking in weights, actually induces exactly this behavior. And dropout, also a wonderful paper, I think Percy wrote that paper, about how dropout and regularization are the same. Please. Yeah, it's outside the sum. I mean, it would just change normalization."},{"start":2747.95,"text":"All right, so if this is going to shrink theta toward the origin, so it just means we don't think it should be too big. It's kind of a soft penalty, okay? Now, if we set it to zero, this is plain, ordinary least squares. If we set it really, really large, there's a value at which basically predicting zero is kind of the best thing to do, right? Because if this thing is massive, as we get closer and closer to setting that to infinity, this one wants zero and this one, and stop caring about the test error. So clearly my point is that there's some sweet spot."},{"start":2778.25,"text":"for rho, that's going to give us good error. It's going to shrink that theta. And it's going to still respect some of the error that we have over here. Clear enough? So this is just staying at 0. It's playing ordinarily squares, which has the issues we talked about. When it gets very large, then theta gets closer and closer to 0 to satisfy this penalty."},{"start":2803.65,"text":"All right. So a good balanced row balances the two. The right ratio depends on the data. They're really hard to know up front. So we fit row from data. And this is sometimes called hyperparameter optimization. We'll get to that if we have time at the end of this lecture. Effectively, what happens is you have some little dev set that you're developing on. You try various different models. You train on one set. You hold out. You test on another. And you see which row does better. And we'll talk about ways to do that in a more parameter efficient way, or sorry, compute efficient way, where you run fewer."},{"start":2832.98,"text":"or trials to bake off the different rows that you have. And we'll also see ways to do this in a more data efficient way, where you don't have to throw away a lot of your data to be able to have a holdout set. The latter one's called cross-validation. The first one is what this algorithm hyperband does. So this row is a very strange parameter, how it affects things. So why do we penalize?"}],"speech_gaps":[],"frame":"../frames/v047/017.webp","frame_time":2707.5},{"title":"数据集划分与机器学习建议","segments":[{"id":304,"text":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in R^d with n less than d, fewer samples and dimensions. So x^T x here is not full rank. So for any theta we train and any v in the null space of x, this equation holds. That is, x times v is equal to 0. And so they give exactly the same predictions.","zh":"这在最小二乘情况下只是一个示例，但它也适用于更昂贵模型的直觉。因此，考虑一个x，它存在于R^d中，且样本数n小于维度d，样本数量和维度较少。因此，这里的x^T x不是满秩的。因此，对于任何我们训练的theta和任何在x的零空间中的v，这个等式成立。也就是说，x乘以v等于0。因此，它们给出完全相同的预测。","start":2858.17,"end":2887.18},{"id":305,"text":"So the question in the underdetermined case is, which of theta among all of these should we pick? And intuitively, there are infinitely many of these optimal thetas. We can pick any one of them. What we're going to pick here is, when we add this in, is we're going to pay if we have any additional component that's","zh":"在欠定情况下，问题是：我们应该从所有这些theta中选择哪一个？直观上，存在无限多个这样的最优theta。我们可以选择其中任何一个。在这里，当我们加入这个惩罚项时，我们将会为任何额外的、与我们关心的内容垂直的成分付出代价。因此，任何位于这个零空间中的v，我们都会通过v的平方来付出代价。这种分解清楚吗？如果你取两个正交的向量，它们的最小二乘和会分解成这样。这只是内积展开。不清楚的话，请向我提问。但关键是，即使不知道方向，惩罚这个成分也是隐式的。","start":2888.32,"end":2906.93},{"id":306,"text":"something we don't need that's perpendicular to what we care about. So any v that's in the space, that's in this null space, we're going to pay by v squared. Is this decomposition clear? If you take two vectors that are orthogonal, their least squares sums break apart like this. This is just the inner product expansion. Not clear, please ask me a question. But the point is that penalizing this implicitly without knowing the direction,","zh":"它说，稍微缩小theta 0。这是我们在意的空间中的成分。但真正要惩罚的是v。如果你在进行最优过程，它从v中得不到任何东西。它不会改变预测。它会将这个成分大致设为0。这有意义吗？因此，为什么它会减少我们所追求的空间？因为v会趋近于0。我们将基本上把所有位于零空间中的成分（即v）都压向0。","start":2907.71,"end":2932.15},{"id":307,"text":"It says, shrink theta 0 a little bit. That's in the space I care about. But really penalize v. If you're doing an optimal procedure, it gets nothing out of v. It doesn't change the prediction. It will kind of set that to 0. Does that make sense? So is it clear why it's going to reduce the space of what we're after? Because v is going to go to 0. We're going to basically, everything that's in the null space, which is v, is going to get pressured to go to 0.","zh":"另一种说法是，这种惩罚试图迫使我们选择所谓的最小范数解。当我们使用其他正则化方法时，你可能会想，设置权重的范数是否也是一种最小二乘正则化形式？是的，它们都是。它们进行这种平滑的正则化，试图解决这种平局。好的，那么发生了什么？当我们进行求解时，回想这些解。如果我们让rho大于0，","start":2933.1,"end":2957.43},{"id":308,"text":"So another way to say this is that the penalty is trying to force us to pick what's called the minimum norm solution. So when we do those other methods of regularization, you could wonder, is setting the norm of the weights also doing a form of least squares regularization? Yeah, they all are. They're doing this sort of nice kind of smooth regularization to try and get out the tie. All right. So what happened there? When we did the solution, recall these solutions. If we make rho greater than 0,","zh":"所以另一种说法是，这种惩罚项试图迫使我们选择所谓的最小范数解。因此，当我们使用其他正则化方法时，你可能会想，设置权重的范数是否也是一种最小二乘正则化？是的，它们都是。它们都在尝试进行这种平滑的正则化，以解决歧义。好的，那么当时发生了什么？当我们求解时，回想一下这些解。如果我们让 rho 大于 0，","start":2963.11,"end":2991.9},{"id":309,"text":"This is the equation for theta. Is it clear why? Let's look back to make sure. I don't know if I derived it properly. If we look, sorry to go back. Oops. If we look here, this character is nothing more than rho i rho, right? And so when I do the derivative, sorry, when I do this derivative, I get exactly back this least squares cost, rho i.","zh":"这是theta的方程。清楚为什么吗？让我们回顾一下以确保。我不确定我是否正确地推导了它。如果我们看这里，抱歉又要回去。哦，如果我们看这里，这个字符不过就是rho i rho，对吧？因此当我进行导数运算时，抱歉，当我进行这个导数运算时，我正好得到这个最小二乘代价，rho i。","start":2992.6,"end":3015.35},{"id":310,"text":"This is one of the reasons least squares is so nice with this ridge penalty,","zh":"这是最小二乘法在使用岭正则化时如此优美的原因之一，","start":3016.39,"end":3019.71},{"id":311,"text":"is that just that rho falls immediately inside.","zh":"是因为rho会立即落在里面。","start":3019.97,"end":3022.45},{"id":312,"text":"How do I get that?","zh":"我是如何得到这个的？","start":3022.77,"end":3023.65},{"id":313,"text":"Just take the derivative.","zh":"只需取导数。","start":3023.79,"end":3024.71},{"id":314,"text":"Take the derivative, you're going to get a theta that's there,","zh":"取导数，你会得到一个theta，它就在那里，","start":3024.89,"end":3026.87},{"id":315,"text":"so it's going to be theta rho i, right?","zh":"因此它会是theta rho i，对吧？","start":3026.95,"end":3028.71},{"id":316,"text":"Boom, you move it across.","zh":"Boom，把它移到另一边。","start":3029.09,"end":3030.07},{"id":317,"text":"If not clear, I'm happy to take two seconds to derive it.","zh":"如果不清楚，我很乐意花两秒钟推导一下。","start":3030.45,"end":3032.71},{"id":318,"text":"All right.","zh":"好的。","start":3035.97,"end":3036.69}],"notes":["本段讨论了在欠定情况下，如何选择最优的θ。由于存在无限多个最优解，选择最小范数解是常见的做法。通过惩罚向量v（属于零空间），可以减少模型的复杂度，同时保持预测结果不变。","在最小二乘法中，通过引入正则化项（如岭回归），可以实现对θ的约束。这种约束本质上是通过惩罚向量v的范数，从而减少模型的过拟合风险。","在正则化过程中，通过求导可以得到θ的表达式。这表明，正则化项的引入使得优化问题转化为一个带有惩罚项的最小二乘问题。","在欠定情况下，模型的解空间是无限的，因此需要通过某种方式选择最优解。最小范数解是其中一种常见选择，它通过惩罚向量v的范数来实现。","通过正则化项的引入，可以将优化问题转化为一个带有惩罚项的最小二乘问题。这种做法在机器学习中被广泛使用，因为它能够有效控制模型的复杂度。","在正则化过程中，通过求导可以得到θ的表达式。这表明，正则化项的引入使得优化问题转化为一个带有惩罚项的最小二乘问题。"],"formulas":[{"latex":"x^T x","symbols":"x的转置乘以x","explanation":"公式正确，表示向量x的转置与x的乘积，用于计算其平方范数。","evidence":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in nd with n less than d, fewer samples and dimensions. So xtx here is not full rank. So for any theta we train and any v in the null space of x, this equation holds. That is, x times v is equal to 0. And so they give exactly the same predictions."},{"latex":"x v = 0","symbols":"x乘以v等于0","explanation":"公式正确，表示向量v在x的零空间中，即x乘以v等于零向量。","evidence":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in nd with n less than d, fewer samples and dimensions. So xtx here is not full rank. So for any theta we train and any v in the null space of x, this equation holds. That is, x times v is equal to 0. And so they give exactly the same predictions."},{"latex":"\\|v\\|^2","symbols":"v的范数平方","explanation":"公式正确，表示向量v的平方范数，用于衡量其长度的平方。","evidence":"something we don't need that's perpendicular to what we care about. So any v that's in the space, lated_segments":15,"raw_segments":[{"start":2858.17,"text":"This is just illustrative in the least squares case, but it carries over to the intuition on even more expensive models. So take x that lives in nd with n less than d, fewer samples and dimensions. So xtx here is not full rank. So for any theta we train and any v in the null space of x, this equation holds. That is, x times v is equal to 0. And so they give exactly the same predictions."},{"start":2888.32,"text":"So the question in the underdetermined case is, which of theta among all of these should we pick? And intuitively, there are infinitely many of these optimal thetas. We can pick any one of them. What we're going to pick here is, when we add this in, is we're going to pay if we have any additional component that's"},{"start":2907.71,"text":"something we don't need that's perpendicular to what we care about. So any v that's in the space, that's in this null space, we're going to pay by v squared. Is this decomposition clear? If you take two vectors that are orthogonal, their least squares sums break apart like this. This is just the inner product expansion. Not clear, please ask me a question. But the point is that penalizing this implicitly without knowing the direction,"},{"start":2933.1,"text":"It says, shrink theta 0 a little bit. That's in the space I care about. But really penalize v. If you're doing an optimal procedure, it gets nothing out of v. It doesn't change the prediction. It will kind of set that to 0. Does that make sense? So is it clear why it's going to reduce the space of what we're after? Because v is going to go to 0. We're going to basically, everything that's in the null space, which is v, is going to get pressured to go to 0."},{"start":2963.11,"text":"So another way to say this is that the penalty is trying to force us to pick what's called the minimum norm solution. So when we do those other methods of regularization, you could wonder, is setting the norm of the weights also doing a form of least squares regularization? Yeah, they all are. They're doing this sort of nice kind of smooth regularization to try and get out the tie. All right. So what happened there? When we did the solution, recall these solutions. If we make rho greater than 0,"},{"start":2992.6,"text":"This is the equation for theta. Is it clear why? Let's look back to make sure. I don't know if I derived it properly. If we look, sorry to go back. Oops. If we look here, this character is nothing more than rho i rho, right? And so when I do the derivative, sorry, when I do this derivative, I get exactly back this least squares cost, rho i."},{"start":3016.39,"text":"This is one of the reasons least squares is so nice with this ridge penalty,"},{"start":3019.97,"text":"is that just that rho falls immediately inside."},{"start":3022.77,"text":"How do I get that?"},{"start":3023.79,"text":"Just take the derivative."},{"start":3024.89,"text":"Take the derivative, you're going to get a theta that's there,"},{"start":3026.95,"text":"so it's going to be theta rho i, right?"},{"start":3029.09,"text":"Boom, you move it across."},{"start":3030.45,"text":"If not clear, I'm happy to take two seconds to derive it."},{"start":3035.97,"text":"All right."}],"speech_gaps":[],"frame":"../frames/v047/018.webp","frame_time":2870.17},{"title":"数据集划分与机器学习建议","segments":[{"id":319,"text":"So now when the inverse exists,","zh":"所以现在当逆矩阵存在时，","start":3039.37,"end":3040.89},{"id":320,"text":"if lambda 1, lambda 2, and lambda d are all the eigenvalues","zh":"如果我们有所有特征值 λ₁, λ₂ 和 λ_d，","start":3041.51,"end":3044.93},{"id":321,"text":"of the dimensions that we have, the eigenvalues of this thing are all shifted by a constant rho.","zh":"那么这个矩阵的特征值都会被一个常数 ρ 所偏移。","start":3044.93,"end":3050.47},{"id":322,"text":"This is the bias, right? We're shifting this thing in some direction, but the advantage we get is now","zh":"这就是偏差，对吧？我们在某个方向上偏移了这个矩阵，但我们现在获得的优势是","start":3050.71,"end":3056.47},{"id":323,"text":"this is full rank. Why doesn't one of these things end up equaling zero if rho is nonzero? What","zh":"这个矩阵是满秩的。如果 ρ 不为零，为什么其中一个特征值不会等于零呢？什么","start":3057.09,"end":3066.39},{"id":324,"text":"What property are we using?","zh":"我们使用了什么性质？","start":3066.39,"end":3067.15},{"id":325,"text":"We're using the thought that xtx is positive semidefinite.","zh":"我们使用了 x^T x 是半正定的这个想法。","start":3071.93,"end":3074.69},{"id":326,"text":"And so what that means is all of these lambda i's, great point,","zh":"这意味着所有的 λ_i 都是正的，非常好的点，","start":3075.03,"end":3078.63},{"id":327,"text":"all these lambda i's are greater than or equal to 0.","zh":"所有这些λ_i都大于或等于0。","start":3078.83,"end":3080.85},{"id":328,"text":"And so when this thing can't introduce some extra element","zh":"因此，当这个东西无法引入一些额外的零空间元素时","start":3081.79,"end":3086.05},{"id":329,"text":"of the null space because this is a non-negative number","zh":"因为它是一个非负数","start":3086.05,"end":3088.25},{"id":330,"text":"plus a strictly positive number, that","zh":"加上一个严格正数，这就意味着","start":3088.25,"end":3090.63},{"id":331,"text":"means this is going to be strictly positive.","zh":"这个结果将是严格正的。","start":3090.63,"end":3092.03},{"id":332,"text":"Cool.","zh":"酷。","start":3094.09,"end":3094.49},{"id":333,"text":"All right. All right. If you care, I derived it and put it in the appendix. The pseudo-inverse,","zh":"好了。好了。如果你感兴趣，我已经推导了这个结果，并把它放在附录里。伪逆矩阵","start":3094.49,"end":3101.67},{"id":334,"text":"what happens there, the Penrose pseudo-inverse, if you care what that is, that's another procedure","zh":"在那里会发生什么，Penrose伪逆矩阵，如果你想知道它是如何定义的，那是另一种方法","start":3101.89,"end":3105.95},{"id":335,"text":"to solve this equation. It also is a form of regularization. What it tries to pick is a","zh":"为了解决这个方程。它也是一种正则化形式。它试图选择的是一个最小范数解，这在某种程度上与我们在这里所做的类似。好的。现在，","start":3105.95,"end":3110.15},{"id":336,"text":"minimum norm solution, which is sort of similar to what we're doing here. All right. Now,","zh":"theta hat 的方差涉及从这个 1 除以 lambda i 缩小到大约","start":3110.15,"end":3116.41},{"id":337,"text":"the variance of theta hat involves eigenvalues that shrink from this 1 by lambda i to roughly","zh":"theta hat 的方差涉及的特征值会从这个 1 减小到大约 lambda i 的值","start":3116.97,"end":3123.35},{"id":338,"text":"this expression and the risk","zh":"因此，我想表达的要点是，这里的值很小会导致方差很大。顺便说一句，这不仅是一个问题，当 lambda i 恰好为 0 时。但想象一下，我有一个非常非常小的弱特征值。我有 lambda i 是 10 的负 5 次方，10 的负 6 次方。沿着这个方向会发生什么？这意味着巨大的变化。","start":3123.35,"end":3125.25},{"id":339,"text":"And so the point that I'm making here is a small value here has huge variance. So it's not just a problem, by the way, if lambda i is exactly 0. But imagine I have a very, very small weak eigenvalue. I have lambda i 10 to the minus 5, 10 to the minus 6. What happens along that direction? That means huge changes.","zh":"因此，我想表达的要点是，这里的微小值会导致巨大的方差。顺便说一句，这不仅是一个问题，当 lambda i 恰好为 0 的时候。想象一下，我有一个非常非常小的弱特征值，比如 lambda i 是 10 的负 5 次方或 10 的负 6 次方。沿着这个方向会发生什么？这意味着巨大的变化。","start":3127.59,"end":3148.37},{"id":340,"text":"right, in the eigenbasis there, do not change the error very much. So the worst case of this is when it's 0. When it's 0, the entire subspace does not change. But if it's really small, lambda i, and I take the corresponding eigenvector, any change on that direction doesn't really change the loss by very much. And when I'm optimizing, this can create a numerical instability. Here, by adding this, it bounds me away from 0. And so everything is kind of all the eigenvalues are kind of large enough.","zh":"对，在那个特征基底下，它不会对误差产生很大的变化。因此，最坏的情况是当它等于 0 的时候。当它等于 0 时，整个子空间不会发生变化。但如果 lambda i 非常小，我取对应的特征向量，沿着这个方向的任何变化都不会对损失产生很大的影响。而在优化过程中，这可能会导致数值不稳定。在这里，通过添加这个项，它将我远离 0。因此，所有特征值都足够大。","start":3149.04,"end":3178.47},{"id":341,"text":"This intuitively means that I'm going to get a better, more well-behaved optimization and a better model with lower variance because this is really where I pay for the variance and the model. Is that clear? Please ask me a question if not. So this behavior, just to be clear, lowers the variance even when xtx is full rank. Why does that happen? What is the variance a function of here?","zh":"这直观地意味着，我将得到一个更优、更稳定优化过程和一个方差更低的模型，因为这就是我为模型付出方差的地方。清楚吗？如果不清楚，请向我提问。为了明确，这种行为即使在 xtx 是满秩的情况下也会降低方差。为什么会这样？这里的方差是关于什么的函数？","start":3179.07,"end":3207.68}],"notes":["本段讨论了在特征值分解中，当添加一个常数rho时，所有特征值都会被平移。这种平移引入了偏差，但同时也避免了特征值为零的情况，从而保持矩阵的满秩性。这是因为xtx是半正定的，其特征值非负，加上一个正数后，结果仍然是正的。","当特征值非常小时，会导致模型的方差增大，从而影响优化过程的稳定性。即使xtx是满秩的，这种现象仍然会发生，因为方差与特征值的大小有关，而特征值的微小变化可能导致损失函数的显著变化。","通过添加一个正数，可以避免特征值为零，从而防止数值不稳定。这有助于获得更稳定、更易优化的模型，同时降低方差。","在优化过程中，特征值的大小直接影响模型的方差。当特征值非常小时，模型对输入的变化更加敏感，可能导致损失函数的剧烈波动。","本段强调了特征值在模型训练中的重要性，特别是在正则化和数值稳定性方面。通过调整特征值，可以改善模型的性能和优化过程。","最后，讲者询问了方差的计算方式，强调了特征值在方差计算中的作用，以及如何通过调整特征值来降低方差。"],"formulas":[{"latex":"x^T x","symbols":"x的转置乘以x","explanation":"x^T x 是一个常见的矩阵乘积表达式，表示向量x与其转置的乘积，结果是一个标量。该表达式在数学上是正确的，且符合正定矩阵的定义。","evidence":"We're using the thought that xtx is positive semidefinite."},{"latex":"\\lambda_i + \\rho","symbols":"特征值加上一个常数rho","explanation":"该表达式表示特征值λ_i加上一个常数ρ，这在特征值分析中是常见的操作，用于调整特征值的大小。","evidence":"of the dimensions that we have, the eigenvalues of this thing are all shifted by a constant rho."}],"uncertainties":["lambda i 10 to the minus 5, 10 to the minus 6"],"diagram":"none","start":3039.37,"end":3207.68,"asr_flags":[],"math_clarifications":["公式 Var(\\theta) = \\frac{1}{\\lambda_i} 存在数学错误，因为方差通常与特征值的倒数成正比，但该表达式没有明确说明其上下文和条件。此外，方差的表达式应包含更多细节，如矩阵的逆或特征值的分布。因此，该公式无法核定，应移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":3039.37,"text":"So now when the inverse exists,"},{"start":3041.51,"text":"if lambda 1, lambda 2, and lambda d are all the eigenvalues"},{"start":3044.93,"text":"of the dimensions that we have, the eigenvalues of this thing are all shifted by a constant rho."},{"start":3050.71,"text":"This is the bias, right? We're shifting this thing in some direction, but the advantage we get is now"},{"start":3057.09,"text":"this is full rank. Why doesn't one of these things end up equaling zero if rho is nonzero? What"},{"start":3066.39,"text":"What property are we using?"},{"start":3071.93,"text":"We're using the thought that xtx is positive semidefinite."},{"start":3075.03,"text":"And so what that means is all of these lambda i's, great point,"},{"start":3078.83,"text":"all these lambda i's are greater than or equal to 0."},{"start":3081.79,"text":"And so when this thing can't introduce some extra element"},{"start":3086.05,"text":"of the null space because this is a non-negative number"},{"start":3088.25,"text":"plus a strictly positive number, that"},{"start":3090.63,"text":"means this is going to be strictly positive."},{"start":3094.09,"text":"Cool."},{"start":3094.49,"text":"All right. All right. If you care, I derived it and put it in the appendix. The pseudo-inverse,"},{"start":3101.89,"text":"what happens there, the Penrose pseudo-inverse, if you care what that is, that's another procedure"},{"start":3105.95,"text":"to solve this equation. It also is a form of regularization. What it tries to pick is a"},{"start":3110.15,"text":"minimum norm solution, which is sort of similar to what we're doing here. All right. Now,"},{"start":3116.97,"text":"the variance of theta hat involves eigenvalues that shrink from this 1 by lambda i to roughly"},{"start":3123.35,"text":"this expression and the risk"},{"start":3127.59,"text":"And so the point that I'm making here is a small value here has huge variance. So it's not just a problem, by the way, if lambda i is exactly 0. But imagine I have a very, very small weak eigenvalue. I have lambda i 10 to the minus 5, 10 to the minus 6. What happens along that direction? That means huge changes."},{"start":3149.04,"text":"right, in the eigenbasis there, do not change the error very much. So the worst case of this is when it's 0. When it's 0, the entire subspace does not change. But if it's really small, lambda i, and I take the corresponding eigenvector, any change on that direction doesn't really change the loss by very much. And when I'm optimizing, this can create a numerical instability. Here, by adding this, it bounds me away from 0. And so everything is kind of all the eigenvalues are kind of large enough."},{"start":3179.07,"text":"This intuitively means that I'm going to get a better, more well-behaved optimization and a better model with lower variance because this is really where I pay for the variance and the model. Is that clear? Please ask me a question if not. So this behavior, just to be clear, lowers the variance even when xtx is full rank. Why does that happen? What is the variance a function of here?"}],"speech_gaps":[{"start":3069.584,"end":3071.53}],"frame":"../frames/v047/019.webp","frame_time":3051.37},{"title":"条件数与方差的关系","segments":[{"id":342,"text":"If you have eigenvalues that are all the same in case one, and in the other case you have a really large eigenvalue and a really small eigenvalue, which one is going to have proportionally a higher or lower variance, you think? The second one, we have this widespread. It's going to be poorly conditioned, potentially. If you start to make them more homogenous and shrink back down in absolute values,","zh":"如果你在一种情况下所有特征值都相同，而在另一种情况下你有一个非常大的特征值和一个非常小的特征值，你认为哪种情况的方差比例更高或更低？第二种情况，我们有这种广泛的情况。它可能会变得条件很差。如果你开始让它们更加同质化，并将它们的绝对值缩小到接近零，你就会有更小的方差。还记得你如何计算一个随机变量乘以矩阵的期望值，然后得到协方差，对吧？就是这个计算过程。你们做得很好。有问题吗？","start":3210.16,"end":3233.72},{"id":343,"text":"close to zero, you're just going to have less variance. Remember how you compute the expected value of a random variable times a matrix, and you get out the covariance, right? It's exactly that computation. You guys are doing great. Questions?","zh":"接近于零，你将只会拥有更小的方差。还记得你是如何计算一个随机变量乘以矩阵的期望值，然后得到协方差的，对吧？就是这个计算过程。你们做得很好。有问题吗？","start":3234.43,"end":3249.73},{"id":344,"text":"All right. So the point is, this is what I mean. I hopefully made this precise in math that you can go back and check or take a look at and make sure you evolve, which is that the trade-off here is a little bit of bias for a lot of variance reduction. That's when it's going to work. We're going to get a little bit of bias. We're going to take something that's like 10 to the minus 3 and set it up by a small amount, so say 0.1 instead. But that's going to cause a massive reduction in variance because that model was really nearly singular. It was really close to having this property that there was a whole specific","zh":"好的。所以重点是，这就是我的意思。我希望在数学上已经把这个内容说得更精确了，你可以回去检查或查看，确保你理解了，这里的权衡是用一点偏差来换取大量的方差减少。这就是它能够起作用的时候。我们将获得一点偏差。我们将把一个像10的负三次方这样的量，通过一个小的量进行设置，比如说0.1代替。但这将导致方差的大幅减少，因为那个模型实际上非常接近奇异。它几乎具有这样一个性质，即存在一个特定的子空间的解，因此θ没有很好地定义，这就是我们所做的权衡。明白吗？很好。请。我正在尝试理解这个概念。比如说，一个非常正常的，对于这个条件来说，基本上是因为我们的θ不等于0，然后我们的θ集可以在之后被确保为0。因此，我只是在尝试创造一个直觉，为什么会有小的θ，比如……","start":3251.36,"end":3280.86},{"id":345,"text":"subspace of solutions, and so theta wasn't well-defined, and that's the trade-off we're making. Okay? Cool. Please. I'm trying to get intuition for this thing. So, like, a very normal, like, for this condition, like, that is basically because our theta doesn't agree to 0, and then our theta set can be made sure to 0 after there. So, I'm just trying to create an intuition of, like, why are there, like, small theta's, like...","zh":"解空间的一个子空间，因此theta没有良好定义，这就是我们所做出的权衡。好的？很好。请。我正在尝试理解这个概念。比如，一个非常正常的情况，对于这个条件来说，基本上是因为我们的theta不等于0，然后我们的theta集合可以在之后被确保为0。我正在尝试建立一个直觉，即为什么会有小的theta，比如...","start":3280.94,"end":3308.56},{"id":346,"text":"How fast can we compare, like, a little bit of . OK, so one question. It's a good question. So one bit here is, if I imagine that xtx, because this is the way the first point is, when I actually compute this quantity,","zh":"抱歉，只需滚动回去。当我实际计算这个量时，如果我查看这个量的特征值，它们将是λ_i加上λ_i加上ρ。这里的东西将是λ_i加上ρ。但然后我对其进行求逆。","start":3308.86,"end":3324.8},{"id":347,"text":"Sorry, just scroll back. When I actually compute this quantity here, if I look at what are the eigenvalues of this quantity, they are going to be lambda i plus lambda i plus rho. This thing here is going to be lambda i plus rho. But then I invert it.","zh":"抱歉，只需滚动回去。当我实际计算这个量时，如果我查看这个量的特征值，它们将是λ_i加上λ_i加上ρ。这里的东西将是λ_i加上ρ。但然后我对其进行求逆。","start":3326.36,"end":3340.08},{"id":348,"text":"So you're going to have that little piece that happens there. When I have that inversion, if I have lambda i really, really small, then that's going to send a small change in xtx very far away. Because if it's 1 to the minus 10 or whatever, then I'm going to multiply that by 10 to the 10 when I actually go to find theta. So a tiny change over here is causing a huge change over there. You can think about it as conditioning. You can think about it as kind of whatever you'd want. But that's the fundamental issue, is that when these things get small, this equation becomes unstable.","zh":"因此，你将会有一个在那里发生的小部分。当我进行求逆时，如果我有一个非常小的λ_i，那么这将导致x^T x的微小变化被放大很多倍。因为如果它是10的负10次方之类的，那么当我实际计算θ时，我将乘以10的10次方。因此，这里的一个微小变化会导致那里出现巨大的变化。你可以把它看作是条件数的问题。你可以把它看作是任何你想要的，但根本的问题在于，当这些值变得很小时，这个方程就会变得不稳定。","start":3340.51,"end":3369.47},{"id":349,"text":"When I add in a little bit of value here, a small addition changes the inverse by quite a bit,","zh":"当我在这里添加一个小小的值时，这个小的添加会显著地改变逆矩阵。","start":3371.53,"end":3378.09},{"id":350,"text":"right? That's the asymmetry. If I take something that's 10 to the minus 10 and I add to it 0.1,","zh":"对吧？这就是不对称性。如果我有一个10的负10次方的值，并向它加上0.1，","start":3378.13,"end":3382.29},{"id":351,"text":"it's 0.1 plus 10 to the minus 10. It's really 0.1. So now some unit of label here that I get","zh":"那么它就是0.1加上10的负10次方。实际上就是0.1。因此，这里我得到的标签单位发生了变化。","start":3382.43,"end":3388.73}],"notes":["本段讨论了条件数与方差之间的关系，指出当特征值差异较大时，矩阵的条件数较高，导致方差较大。通过引入正则化项，可以减小方差，但会引入一定的偏差。这种权衡是机器学习中常见的问题。","讲者通过一个具体的例子说明了条件数对计算稳定性的影响。当特征值非常小时，矩阵的逆会变得非常敏感，导致计算结果不稳定。这种现象可以通过引入正则化项来缓解。","讲者提到，当特征值非常小时，矩阵的逆会变得非常敏感，导致计算结果不稳定。这种现象可以通过引入正则化项来缓解，从而减少方差。","讲者还提到，当特征值非常小时，矩阵的逆会变得非常敏感，导致计算结果不稳定。这种现象可以通过引入正则化项来缓解，从而减少方差。","讲者通过一个具体的例子说明了条件数对计算稳定性的影响。当特征值非常小时，矩阵的逆会变得非常敏感，导致计算结果不稳定。这种现象可以通过引入正则化项来缓解。","讲者还提到，当特征值非常小时，矩阵的逆会变得非常敏感，导 ecific"}],"uncertainties":["lambda i plus lambda i plus rho","1 to the minus 10","10 to the minus 10"],"diagram":"none","start":3210.16,"end":3388.73,"asr_flags":[],"math_clarifications":["公式2缺少条件分布的定义，且未明确说明条件变量Y的分布，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":3210.16,"text":"If you have eigenvalues that are all the same in case one, and in the other case you have a really large eigenvalue and a really small eigenvalue, which one is going to have proportionally a higher or lower variance, you think? The second one, we have this widespread. It's going to be poorly conditioned, potentially. If you start to make them more homogenous and shrink back down in absolute values,"},{"start":3234.43,"text":"close to zero, you're just going to have less variance. Remember how you compute the expected value of a random variable times a matrix, and you get out the covariance, right? It's exactly that computation. You guys are doing great. Questions?"},{"start":3251.36,"text":"All right. So the point is, this is what I mean. I hopefully made this precise in math that you can go back and check or take a look at and make sure you evolve, which is that the trade-off here is a little bit of bias for a lot of variance reduction. That's when it's going to work. We're going to get a little bit of bias. We're going to take something that's like 10 to the minus 3 and set it up by a small amount, so say 0.1 instead. But that's going to cause a massive reduction in variance because that model was really nearly singular. It was really close to having this property that there was a whole specific"},{"start":3280.94,"text":"subspace of solutions, and so theta wasn't well-defined, and that's the trade-off we're making. Okay? Cool. Please. I'm trying to get intuition for this thing. So, like, a very normal, like, for this condition, like, that is basically because our theta doesn't agree to 0, and then our theta set can be made sure to 0 after there. So, I'm just trying to create an intuition of, like, why are there, like, small theta's, like..."},{"start":3308.86,"text":"How fast can we compare, like, a little bit of . OK, so one question. It's a good question. So one bit here is, if I imagine that xtx, because this is the way the first point is, when I actually compute this quantity,"},{"start":3326.36,"text":"Sorry, just scroll back. When I actually compute this quantity here, if I look at what are the eigenvalues of this quantity, they are going to be lambda i plus lambda i plus rho. This thing here is going to be lambda i plus rho. But then I invert it."},{"start":3340.51,"text":"So you're going to have that little piece that happens there. When I have that inversion, if I have lambda i really, really small, then that's going to send a small change in xtx very far away. Because if it's 1 to the minus 10 or whatever, then I'm going to multiply that by 10 to the 10 when I actually go to find theta. So a tiny change over here is causing a huge change over there. You can think about it as conditioning. You can think about it as kind of whatever you'd want. But that's the fundamental issue, is that when these things get small, this equation becomes unstable."},{"start":3371.53,"text":"When I add in a little bit of value here, a small addition changes the inverse by quite a bit,"},{"start":3378.13,"text":"right? That's the asymmetry. If I take something that's 10 to the minus 10 and I add to it 0.1,"},{"start":3382.43,"text":"it's 0.1 plus 10 to the minus 10. It's really 0.1. So now some unit of label here that I get"}],"speech_gaps":[],"frame":"../frames/v047/020.webp","frame_time":3222.16},{"title":"数据集划分与机器学习建议","segments":[{"id":352,"text":"from XTX, that's actually shooting back through here and only contributing a factor of 10 instead","zh":"从XTX来看，实际上这是反向通过这里的，只贡献了一个10倍的因子","start":3388.73,"end":3393.61},{"id":353,"text":"of 10 to the 10, which is a huge win. Now, the reason that that lambda also comes in is when I","zh":"到10的10次方，这是一次巨大的胜利。现在，lambda也出现的原因是当我以这种方式进行修改时，我也在修改x。所以，一切都没问题。太棒了。","start":3393.61,"end":3399.29},{"id":354,"text":"modify it in this way, I'm also modifying x. So yeah, all good. Awesome.","zh":"你提到一个类似的行，其中epsilon是像","start":3399.29,"end":3405.33},{"id":355,"text":"Did you say a similar row with an epsilon, where epsilon is like","zh":"1的幂，或者像10的负5次方这样的例子，但用这个方法，会设置行到一个非平凡的值吗？","start":3406.73,"end":3411.57},{"id":356,"text":"1 to the, or 10 to the negative 5, for example, but with this, would set row to something non-trivial?","zh":"比如1到10的负5次方，但有了这个，会设置行到一个非平凡的值吗？","start":3412.33,"end":3421.15},{"id":357,"text":"Yeah, so this is a great question. I was actually going for a walk with Andre a little while ago.","zh":"我相信在传说中，它被称为Karpathy常数，大概是4乘以10的负3次方或","start":3421.49,"end":3426.45},{"id":358,"text":"I believe in the lore, it's called the Karpathy constant, which is like 4e to the minus 3 or","zh":"我相信在传说中，它被称为Karpathy常数，大概是4乘以10的负3次方或","start":3426.45,"end":3431.87},{"id":359,"text":"something. So this is a joke. But basically, there are a bunch of these values that people","zh":"之类的东西。所以这是一个玩笑。但基本上，人们会使用很多这样的值","start":3431.87,"end":3436.77},{"id":360,"text":"heuristically set to have good regularization performance. Part of those are set, by the way,","zh":"启发式地设置以获得良好的正则化性能。顺便提一下，其中一些设置是出于不同的原因，","start":3436.77,"end":3441.37},{"id":361,"text":"for a different reason, which is that when you do... So those are not for least squares.","zh":"这是因为当你进行……所以这些设置并不是为了最小二乘法。","start":3441.43,"end":3445.07},{"id":362,"text":"But traditionally, what they're set... That's a step size rule for Atom. But the traditional","zh":"但传统上，它们的设置……这是Atom的一个步长规则。但传统","start":3445.31,"end":3449.27},{"id":363,"text":"way that these things are set is that you have other numeric concerns. So for the same reasons","zh":": 这些设置的方式是，你还有其他的数值考虑。因此，正如我们刚刚讨论的，如果你有一个不稳定的线性系统，且条件数非常高，","start":3449.27,"end":3453.67},{"id":364,"text":"we were just discussing, if you have an unstable linear system and the condition number is really","zh":"微小的变化就会对输出数据产生显著影响。如果你在FP32中进行这样的操作，","start":3453.67,"end":3458.77},{"id":365,"text":"high, little changes are going to change data on the output. If you're doing that in FP32,","zh":"高，对输出数据的改变将很小。如果你在FP32中进行这样的操作，","start":3458.77,"end":3465.19},{"id":366,"text":"if anyone knows what that is, the format that you have a whole bunch of bits for precision,","zh":"也许这会是可行的。随着你深入机器学习，我们会使用越来越少的位数进行","start":3465.41,"end":3468.61},{"id":367,"text":"maybe that will be okay. As you go down in machine learning, we use lower and lower bits of","zh":"也许这就可以了。随着你在机器学习中深入，我们会使用越来越低的位数","start":3468.83,"end":3473.17},{"id":368,"text":"precision. So numerical precision is like FP64. That's what a numericist cares about. But we may","zh":"精度。所以数值精度就像FP64。这是数值主义者关心的内容。但我们可以","start":3473.17,"end":3478.45},{"id":369,"text":"You may train in FPA.","zh":"你也可以在FPA中进行训练。","start":3478.45,"end":3479.19},{"id":370,"text":"That means we only have eight bits of precision. Three plus five is usually the way you do it. It doesn't really matter. The points is fewer. And so then those instabilities really compound. And so those numbers are picked so that you don't have numerical precision errors and also that you get this little bit of bias. And really machine learning has gone to lots of sloppy values.","zh":"这意味着我们只有八位的精度。三加五通常是这样做的方式。其实并不太重要。点的数量更少。因此这些不稳定性会不断累积。因此这些数值的选择是为了避免数值精度错误，同时也能带来一点偏差。实际上，机器学习已经使用了很多松散的数值。","start":3479.7,"end":3497.8},{"id":371,"text":"thrown out a problem rather than really precise values. So if you went to a statistician and use the R package, they would really care about getting all of the bits of precision and they would be very careful about how the regularizers were set. Trevor Hastie has a wonderful set of papers about what's called the lasso path, which is instead of L2, you use L1. This is exactly what happens to the model and they know exactly how to compute every detail. Machine learning, we don't really care. If I'm honest, we're just like, yeah, sounds good. I'm going to show you in one second. Here are other ways to regularize your models.","zh":"而不是真正精确的数值，而是抛出了一个问题。因此如果你去找统计学家并使用R包，他们会非常关注获取所有的精度位数，并且会非常小心地设置正则化器。Trevor Hastie有一系列精彩的论文，讨论所谓的lasso路径，即不是使用L2，而是使用L1。这正是模型所发生的情况，他们知道如何精确地计算每一个细节。而在机器学习中，我们并不太在意。如果我诚实地说，我们只是说，听起来不错。我马上就会展示给你看。这里还有其他方式来正则化你的模型。","start":3498.84,"end":3526.52},{"id":372,"text":"Randomly zero out things while you're running. Take your data and screw with it. That's data augmentation. Take the data as it runs and say those numbers got too big and divide them. That's called layer norm. Literally, this is the stuff we do. You just look at the data and you're like, oh, it looks bad. Fix it. And these are the things that basically discourage the model from just fitting too much to one point.","zh":"在运行过程中随机将某些值置零。对你的数据进行一些处理。这就是数据增强。在数据运行时，说这些数值太大，然后将它们除以某个数。这被称为层归一化。字面上，这就是我们所做的工作。你只需看一下数据，然后说，哦，看起来不太好。进行修正。这些方法基本上会阻止模型过度拟合到某一个点上。","start":3527.06,"end":3548.44}],"notes":["本段讨论了在机器学习中使用正则化技术时，如何通过调整参数（如lambda）来控制模型复杂度。讲者提到，当修改模型时，不仅需要调整lambda，还需要修改输入特征x，以确保模型的稳定性。此外，还提到在数值计算中，浮点精度（如FP32和FP64）对模型训练的影响，以及如何通过设置合适的数值来避免数值误差。","讲者提到，一些数值（如Karpathy常数）是经验性设置的，用于在正则化中取得良好的效果。这些数值的设置不仅考虑了正则化性能，还涉及数值计算中的稳定性问题。例如，当系统条件数很高时，小的输入变化可能导致输出的大幅波动，因此需要设置合适的数值以避免这种不稳定性。","讲者还对比了统计学和机器学习在数值精度上的不同态度。统计学家会非常关注数值精度，而机器学习则更倾向于使用较为粗糙的数值设置。例如，使用L1正则化（lasso）而不是L2正则化（ridge），并提到Trevor Hastie的相关研究。","在模型训练中，除了正则化，还有其他方法可以用来控制模型复杂度，例如数据增强（随机零值化）和层归一化（layer norm）。这些方法通过调整数据或模型输出来防止模型过度拟合。","讲者强调，机器学习中经常使用经验性设置的数值，而不是精确的数学计算。这可能是因为在实际应用中，模型的性能往往比严格的数学精度更重要。","最后，讲者提到，机器学习中的正则化方法多种多样，包括随机零值化、数据增强和层归一化等。这些方法的共同目标是防止模型过度拟合，提高模型的泛化能力。"],"formulas":[],"uncertainties":["FP32和FP64的具体定义和区别","Karpathy常数的具体数值和应用场景","L1和L2正则化的具体数学表达式"],"diagram":"none","start":3388.73,"end":3548.44,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":3388.73,"text":"from XTX, that's actually shooting back through here and only contributing a factor of 10 instead"},{"start":3393.61,"text":"of 10 to the 10, which is a huge win. Now, the reason that that lambda also comes in is when I"},{"start":3399.29,"text":"modify it in this way, I'm also modifying x. So yeah, all good. Awesome."},{"start":3406.73,"text":"Did you say a similar row with an epsilon, where epsilon is like"},{"start":3412.33,"text":"1 to the, or 10 to the negative 5, for example, but with this, would set row to something non-trivial?"},{"start":3421.49,"text":"Yeah, so this is a great question. I was actually going for a walk with Andre a little while ago."},{"start":3426.45,"text":"I believe in the lore, it's called the Karpathy constant, which is like 4e to the minus 3 or"},{"start":3431.87,"text":"something. So this is a joke. But basically, there are a bunch of these values that people"},{"start":3436.77,"text":"heuristically set to have good regularization performance. Part of those are set, by the way,"},{"start":3441.43,"text":"for a different reason, which is that when you do... So those are not for least squares."},{"start":3445.31,"text":"But traditionally, what they're set... That's a step size rule for Atom. But the traditional"},{"start":3449.27,"text":"way that these things are set is that you have other numeric concerns. So for the same reasons"},{"start":3453.67,"text":"we were just discussing, if you have an unstable linear system and the condition number is really"},{"start":3458.77,"text":"high, little changes are going to change data on the output. If you're doing that in FP32,"},{"start":3465.41,"text":"if anyone knows what that is, the format that you have a whole bunch of bits for precision,"},{"start":3468.83,"text":"maybe that will be okay. As you go down in machine learning, we use lower and lower bits of"},{"start":3473.17,"text":"precision. So numerical precision is like FP64. That's what a numericist cares about. But we may"},{"start":3478.45,"text":"You may train in FPA."},{"start":3479.7,"text":"That means we only have eight bits of precision. Three plus five is usually the way you do it. It doesn't really matter. The points is fewer. And so then those instabilities really compound. And so those numbers are picked so that you don't have numerical precision errors and also that you get this little bit of bias. And really machine learning has gone to lots of sloppy values."},{"start":3498.84,"text":"thrown out a problem rather than really precise values. So if you went to a statistician and use the R package, they would really care about getting all of the bits of precision and they would be very careful about how the regularizers were set. Trevor Hastie has a wonderful set of papers about what's called the lasso path, which is instead of L2, you use L1. This is exactly what happens to the model and they know exactly how to compute every detail. Machine learning, we don't really care. If I'm honest, we're just like, yeah, sounds good. I'm going to show you in one second. Here are other ways to regularize your models."},{"start":3527.06,"text":"Randomly zero out things while you're running. Take your data and screw with it. That's data augmentation. Take the data as it runs and say those numbers got too big and divide them. That's called layer norm. Literally, this is the stuff we do. You just look at the data and you're like, oh, it looks bad. Fix it. And these are the things that basically discourage the model from just fitting too much to one point."}],"speech_gaps":[],"frame":"../frames/v047/021.webp","frame_time":3400.73},{"title":"数据集划分与机器学习建议","segments":[{"id":373,"text":"So if all this discussion was lost on you, like, well, how are we getting to test and all the errors? The most engineer intuition you can get is what you're trying to prevent is the model from fitting into the noise, fitting those things that don't matter. So you want your model, you make your model more robust by doing nasty things to it. Okay. And maybe they'll never forgive us when our AI overloads come. Like we didn't want to have dropout. We didn't want you to do, it used to be called optimal brain damage, which is an old paper. Like we didn't want you to do that to us, but we did because we thought it made them more robust.","zh":"所以如果刚才的讨论对你来说毫无意义，比如，好吧，我们怎么才能得到测试集和所有这些误差呢？你所能获得的最工程师直觉就是，你试图防止模型去拟合噪声，去拟合那些不重要的东西。因此，你希望你的模型通过对其施加恶劣的处理来变得更鲁棒。好的。也许当我们的AI过载发生时，他们永远不会原谅我们。比如我们不想使用dropout，以前它被称为最优脑损伤，这是篇旧论文。我们不想你这么做，但我们还是做了，因为我们认为这会让模型更鲁棒。","start":3548.72,"end":3576.72},{"id":374,"text":"So the point is, all of these you can actually formally analyze in the same framework that I gave you earlier. If you go and read the papers, they all do bias, variance, decomposition, and they prove all these. I have a paper on data augmentation. Proves if you do a particular set of augmentations, you take the image, you rotate it a little bit, didn't change from a cat. If I take a picture of a cat and I rotate it a little bit, still a cat. I zoom in a little bit, still a cat. But the model may have picked up on noise, and so by doing those augmentations, I made it more robust. That's also a form of regularization. Please.","zh":"所以重点是，所有这些都可以在我们之前给出的同一框架中正式地进行分析。如果你去阅读论文，它们都会做偏差、方差分解，并且证明所有这些内容。我有一篇关于数据增强的论文。它证明如果你进行特定的数据增强操作，比如对图像进行轻微旋转，图像仍然是一只猫。如果我拍了一张猫的照片，然后轻微旋转，它仍然是猫。稍微放大一点，仍然是猫。但模型可能会捕捉到噪声，因此通过进行这些增强操作，我让模型变得更鲁棒。这也是正则化的一种形式。请。","start":3577.26,"end":3607.03},{"id":375,"text":"The standard intuition for picking real is obviously like if the Y values are much higher than that.","zh":"选择真实值的标准直觉显然是如果Y值远高于那个值。","start":3607.71,"end":3612.77},{"id":376,"text":"Awesome question.","zh":"很棒的问题。","start":3613.74,"end":3614.3},{"id":377,"text":"So the question is, what is the intuition about picking row?","zh":"问题是，关于选择行的直觉是什么？","start":3614.72,"end":3617.3},{"id":378,"text":"There are some rules of thumb.","zh":"有一些经验法则。","start":3617.46,"end":3618.86},{"id":379,"text":"Most of them, I would say, are not all that useful.","zh":"其中大多数，我认为，都不是特别有用。","start":3619.24,"end":3621.64},{"id":380,"text":"Because what you want is you want them to all be the same scale.","zh":"因为你想要的是它们都在同一尺度上。","start":3621.76,"end":3624.12},{"id":381,"text":"In two weeks, so you get a well-deserved break for me","zh":"两周后，你可以好好休息一下","start":3624.38,"end":3627.38},{"id":382,"text":"next week, but in two weeks, I could come back","zh":"下周，但两周后，我可以回来","start":3627.38,"end":3629.12},{"id":383,"text":"and I'm going to tell you about how to standardize your data","zh":"我会告诉你如何对数据进行标准化","start":3629.12,"end":3631.06},{"id":384,"text":"and whiten your data.","zh":"以及如何对数据进行白化处理。","start":3631.06,"end":3631.74},{"id":385,"text":"And that will deal with the fact when your x's and y's actually","zh":"这将解决你的x和y实际上","start":3631.9,"end":3634.38},{"id":386,"text":"have very different scales.","zh":"具有非常不同尺度的情况。","start":3634.38,"end":3635.36},{"id":387,"text":"We'll talk about exactly that problem","zh":"我们会详细讨论这个问题","start":3635.56,"end":3637.1},{"id":388,"text":"and how that fits into a class of models which","zh":"以及它如何属于一类模型中的情况","start":3637.1,"end":3639.36},{"id":389,"text":"are unsupervised.","zh":"它们是无监督的。","start":3639.36,"end":3640.18},{"id":390,"text":"But that's kind of what you do.","zh":"但这就是你所做的。","start":3641.22,"end":3642.3},{"id":391,"text":"The reason you pick these,","zh":"你选择这些的原因，","start":3642.3,"end":3643.6},{"id":392,"text":"it really does come down to trial and error.","zh":"实际上归结为试错。","start":3643.72,"end":3645.66},{"id":393,"text":"You really do try out multiple values and see how well they generalize.","zh":"你真的会尝试多个值，并观察它们的泛化能力。","start":3645.8,"end":3649.78},{"id":394,"text":"The existence of the DevSet is much more trusted by","zh":"开发集的存在比这个领域中任何数量的数学都更受工程师信任。请。","start":3649.96,"end":3652.36},{"id":395,"text":"engineers than any amount of math in this space. Please.","zh":"当我们进行第一次正则化时，","start":3652.36,"end":3656.22},{"id":396,"text":"When we're doing the first regularization thingy,","zh":"当我们进行第一次正则化的时候，","start":3656.68,"end":3661.52},{"id":397,"text":"we have the LP norm where P is equal to two.","zh":"我们有Lp范数，其中p等于二。","start":3663.36,"end":3666.32},{"id":398,"text":"Do we ever do instances where P is less than one?","zh":"我们有没有处理过p小于一的情况？","start":3666.62,"end":3669.38},{"id":399,"text":"Wonderful question. So the question is,","zh":"非常好的问题。所以问题是，","start":3670.16,"end":3671.66},{"id":400,"text":"do we use... Those are not strictly norms. Do we ever use fractional norms or things below one?","zh":"我们是否使用……这些并不是严格的范数。我们有没有使用分数范数或低于一的范数？","start":3671.66,"end":3675.1},{"id":401,"text":"Traditionally, in machine learning, you'll use the one norm because it's convex.","zh":"传统上，在机器学习中，你会使用L1范数，因为它具有凸性。","start":3675.66,"end":3678.0},{"id":402,"text":"That's underneath the covers. You don't use the zero norm, which is the one you want, which says,","zh":"这是底层实现。你不会使用L0范数，这是你想要的范数，它表示，","start":3678.68,"end":3682.92},{"id":403,"text":"what are the support underneath? Sparse recovery was the hotness in machine learning 15 years ago.","zh":"支撑集是什么？稀疏恢复曾在15年前是机器学习的热门话题。","start":3682.94,"end":3688.32},{"id":404,"text":"So every form of sparse recovery has been beaten to death in some way in some annals paper. So it's","zh":"因此，各种形式的稀疏恢复在某些论文中已经被反复讨论过。因此，它","start":3688.42,"end":3693.8},{"id":405,"text":"all there. And so a lot of those are called gauges. All those things are done. Modern","zh":"所有这些都完成了。所有这些都被称作标度。所有这些事情都已经做完了。现代","start":3693.8,"end":3699.82},{"id":406,"text":"Modern machine learning models don't care about what's called certificates.","zh":"现代机器学习模型并不关心所谓的证书。","start":3699.82,"end":3702.52},{"id":407,"text":"They don't care about getting the right X.","zh":"它们并不关心得到正确的X。","start":3702.72,"end":3704.24},{"id":408,"text":"So that's why, in some ways, the story that I really am dying to tell you is, this is","zh":"因此，从某种意义上说，我真正想告诉你们的故事是，我现在告诉你们的内容就是经典统计学。","start":3704.44,"end":3708.7},{"id":409,"text":"what I've told you right now is classical stats.","zh":"你也许可以在15、20年前从统计系得到更高品质的这堂课。","start":3708.7,"end":3710.22},{"id":410,"text":"You could have gotten this lecture, maybe higher quality from the stats department 15,","zh":"你可能从统计系获得这堂课，也许质量更高，15。","start":3710.44,"end":3715.18},{"id":411,"text":"20 years ago.","zh":"你也许可以在15、20年前从统计系得到更高品质的这堂课。","start":3715.38,"end":3715.92},{"id":412,"text":"What I'm going to try and tell you and what happens next is, what did we learn when we","zh":"我现在要尝试告诉你们的，以及接下来要发生的事情是，当我们学习到什么的时候","start":3716.12,"end":3719.26},{"id":413,"text":"started to build these bigger models?","zh":"开始构建这些更大的模型了吗？","start":3719.26,"end":3720.62},{"id":414,"text":"And what's on the other side?","zh":"而另一边又是什么？","start":3720.74,"end":3721.88},{"id":415,"text":"Because there's a couple of ways that the story is...","zh":"因为这个故事有几个不同的说法...","start":3722.06,"end":3723.8}],"notes":["本段讨论了机器学习中防止模型过拟合的策略，强调了通过引入噪声（如Dropout）来增强模型鲁棒性。讲者提到，虽然这些方法可能看起来像是对模型的‘伤害’，但它们有助于模型更好地泛化。此外，讲者还提到数据增强是一种正则化方法，通过旋转、缩放等操作使模型对噪声更鲁棒。","讲者指出，所有这些方法都可以在统一的框架下进行形式化分析，包括偏差-方差分解。他提到，数据增强的论文证明了特定的增强操作（如旋转、缩放）不会改变图像的类别，但可以防止模型学习到噪声，从而提高鲁棒性。","讲者提到，选择数据集的特征时，通常希望所有特征具有相同的尺度。他提到，标准化和白化是处理不同尺度特征的方法，这些方法在无监督模型中尤为重要。","讲者强调，选择特征时需要通过试错来确定最佳方法，因为没有通用的规则。开发集（DevSet）在工程实践中比数学理论更受信任。","讲者讨论了正则化中的Lp范数，特别是L2范数的使用。他提到，虽然L1范数在传统机器学习中更常用，但L0范数（稀疏性）在稀疏恢复中曾是热门研究方向。","讲者指出，现代机器学习模型不再关注严格的数学证明或证书，而是更关注实际效果。他提到，当前的课程内容属于经典统计学，而后续内容将涉及构建更大模型时的新发现。"],"formulas":[{"latex":"L_p \\text{ norm where } p = 2","symbols":"L2范数","explanation":"公式正确，表示L2范数，即欧几里得范数，适用于机器学习中的正则化方法。","evidence":"we have the LP norm where P is equal to two."},{"latex":"L_1 \\text{ norm is convex}","symbols":"L1范数是凸函数","explanation":"公式正确，L1范数是凸函数，常用于稀疏性约束，如Lasso回归。","evidence":"Traditionally, in machine learning, you'll use the one norm because it's convex."}],"uncertainties":["在讲者提到的‘sparse recovery’部分，具体的技术细节和术语可能需要进一步澄清。","在讲者提到‘certificates’时，具体指代的内容可能需要更多上下文来明确。"],"diagram":"none","start":3548.72,"end":3723.8,"asr_flags":[],"math_clarifications":["原文中提到的L_p范数和L_1范数的数学描述准确，符合机器学习中的标准定义。"],"boards":[],"translation_complete":true,"translated_segments":43,"raw_segments":[{"start":3548.72,"text":"So if all this discussion was lost on you of like, well, how are we getting to test and all the errors? The most engineer intuition you can get is what you're trying to prevent is the model from fitting into the noise, fitting those things that don't matter. So you want your model, you make your model more robust by doing nasty things to it. Okay. And maybe they'll never forgive us when our AI overloads come. Like we didn't want to have dropout. We didn't want you to do, it used to be called optimal brain damage, which is a old paper. Like we didn't want you to do that to us, but we did because we thought it made them more robust."},{"start":3577.26,"text":"So the point is, all of these you can actually formally analyze in the same framework that I gave you earlier. If you go and read the papers, they all do bias, variance, decomposition, and they prove all these. I have a paper on data augmentation. Proves if you do a particular set of augmentations, you take the image, you rotate it a little bit, didn't change from a cat. If I take a picture of a cat and I rotate it a little bit, still a cat. I zoom in a little bit, still a cat. But the model may have picked up on noise, and so by doing those augmentations, I made it more robust. That's also a form of regularization. Please."},{"start":3607.71,"text":"The standard intuition for picking real is obviously like if the Y values are much higher than that."},{"start":3613.74,"text":"Awesome question."},{"start":3614.72,"text":"So the question is, what is the intuition about picking row?"},{"start":3617.46,"text":"There are some rules of thumb."},{"start":3619.24,"text":"Most of them, I would say, are not all that useful."},{"start":3621.76,"text":"Because what you want is you want them to all be the same scale."},{"start":3624.38,"text":"In two weeks, so you get a well-deserved break for me"},{"start":3627.38,"text":"next week, but in two weeks, I could come back"},{"start":3629.12,"text":"and I'm going to tell you about how to standardize your data"},{"start":3631.06,"text":"and whiten your data."},{"start":3631.9,"text":"And that will deal with the fact when your x's and y's actually"},{"start":3634.38,"text":"have very different scales."},{"start":3635.56,"text":"We'll talk about exactly that problem"},{"start":3637.1,"text":"and how that fits into a class of models which"},{"start":3639.36,"text":"are unsupervised."},{"start":3641.22,"text":"But that's kind of what you do."},{"start":3642.3,"text":"The reason you pick these,"},{"start":3643.72,"text":"it really does come down to trial and error."},{"start":3645.8,"text":"You really do try out multiple values and see how well they generalize."},{"start":3649.96,"text":"The existence of the DevSet is much more trusted by"},{"start":3652.36,"text":"engineers than any amount of math in this space. Please."},{"start":3656.68,"text":"When we're doing the first regularization thingy,"},{"start":3663.36,"text":"we have the LP norm where P is equal to two."},{"start":3666.62,"text":"Do we ever do instances where P is less than one?"},{"start":3670.16,"text":"Wonderful question. So the question is,"},{"start":3671.66,"text":"do we use... Those are not strictly norms. Do we ever use fractional norms or things below one?"},{"start":3675.66,"text":"Traditionally, in machine learning, you'll use the one norm because it's convex."},{"start":3678.68,"text":"That's underneath the covers. You don't use the zero norm, which is the one you want, which says,"},{"start":3682.94,"text":"what are the support underneath? Sparse recovery was the hotness in machine learning 15 years ago."},{"start":3688.42,"text":"So every form of sparse recovery has been beaten to death in some way in some annals paper. So it's"},{"start":3693.8,"text":"all there. And so a lot of those are called gauges. All those things are done. Modern"},{"start":3699.82,"text":"Modern machine learning models don't care about what's called certificates."},{"start":3702.72,"text":"They don't care about getting the right X."},{"start":3704.44,"text":"So that's why, in some ways, the story that I really am dying to tell you is, this is"},{"start":3708.7,"text":"what I've told you right now is classical stats."},{"start":3710.44,"text":"You could have gotten this lecture, maybe higher quality from the stats department 15,"},{"start":3715.38,"text":"20 years ago."},{"start":3716.12,"text":"What I'm going to try and tell you and what happens next is, what did we learn when we"},{"start":3719.26,"text":"started to build these bigger models?"},{"start":3720.74,"text":"And what's on the other side?"},{"start":3722.06,"text":"Because there's a couple of ways that the story is..."}],"speech_gaps":[],"frame":"../frames/v047/022.webp","frame_time":3560.72},{"title":"现代机器学习中的过拟合与泛化","segments":[{"id":416,"text":"you know, mathematically correct. Everything I've told you is correct. But there's a couple of things that it omits. And that's what I'm most interested to tell you about. Cool. Awesome. All right. I'm going to skip over this Bayesian thing. This is another way to say that I can motivate that theta comes from a Bayesian distribution. And this would be one of those ways to pick, you know, what is the ratio between them. So they are in the notes. But I really want to tell you the modern stuff because I genuinely love this stuff. All right. Okay.","zh":"你知道的，数学上是正确的。我告诉你的所有内容都是正确的。但有一些内容它省略了。而这些就是我最想告诉你们的。酷。太棒了。好的，我将跳过贝叶斯这一部分。这是另一种方式来说明我可以从贝叶斯分布中推导出θ。这将是选择它们之间比例的一种方式。这些内容在笔记中。但我真的想告诉你们现代的内容，因为我真心喜欢这些东西。好的。好的。","start":3724.28,"end":3754.31},{"id":417,"text":"So the surprise of modern machine learning. So the classical Bayan's variant story tells you beyond some complexity, the test error must rise. That was the picture I showed you. A high degree polynomial that interpolates 15 points should be a complete disaster. You have a model that's extremely powerful. You're fitting fewer points. Something bad is going to happen.","zh":"现代机器学习的惊喜之处。经典贝叶斯变体的故事告诉我们，当复杂度超过一定限度时，测试误差必须上升。这就是我给你们看的画面。一个高次多项式插值15个点，应该是一个彻底的灾难。你有一个非常强大的模型，你只拟合较少的点。糟糕的事情将会发生。","start":3755.89,"end":3775.67},{"id":418,"text":"Now it turns out, and this is pretty interesting, we used to train models, we still do in some cases, train models that have many more parameters than their training points. They interpolate the training set perfectly. They exactly memorize it. But they also generalize. In some cases, generalize better than any model we know. So what the heck is going on here? So for much of the last decade, this puzzle for practitioners was not, how do we avoid overfitting, like I told you, but why aren't we overfitting?","zh":"事实上，我们过去训练模型时，有时仍然在训练模型，这些模型的参数数量比训练点还要多。它们完美地插值训练集。它们精确地记忆训练集。但它们也能够泛化。在某些情况下，泛化效果甚至比我们已知的任何模型都要好。那么到底发生了什么呢？在过去的十年中，对于从业者来说，这个谜题并不是如何避免过拟合，就像我告诉你们的那样，而是为什么我们没有过拟合？","start":3777.33,"end":3806.72},{"id":419,"text":"That was the crazy thing. We were warned by our statistical priests and priestesses that bad things would happen if we ventured into this dark, you know, woolly land. And then we started training big models and everything got awesome. That's kind of how you can tell which side of the debate I'm on. But, you know, that's kind of how it works. Like, GPT does not care about your least squares regularization. Anyway, it does do regularization stuff under the covers, right? It does do stuff. So it's not true, okay? There's a wonderful paper by Misha and friends. Misha Belkin is the first author.","zh":"这真是个疯狂的事情。我们的统计教士和女祭司警告我们，如果我们进入这个黑暗、模糊的领域，将会发生糟糕的事情。然后我们开始训练大模型，一切变得非常棒。这基本上就是你能判断我站在辩论哪一边的方式。但你知道的，事情就是这样运作的。例如，GPT并不关心你的最小二乘正则化。无论如何，它在内部确实做了正则化的事情，对吧？它确实做了些事情。所以这并不是真的，对吧？有一篇由Misha和他的朋友们撰写的精彩论文。Misha Belkin是第一作者。","start":3807.38,"end":3835.05},{"id":420,"text":"And they showed, roughly speaking, that the following bizarre thing happens in a case called kernels, which we'll learn about later, but you don't need to know these particular things, where in the classical regime, you had this issue where the training set, the test error, indeed goes up.","zh":"他们展示了一个奇怪的现象，这种情况称为核方法，我们稍后会学习到，但你不需要了解这些特定的内容。在经典情况下，训练集的测试误差确实会上升。","start":3835.6,"end":3849.32},{"id":421,"text":"So model capacity on the x-axis, test error on the y-axis, and this is the regime we've been talking about.","zh":"模型容量在x轴上，测试误差在y轴上，这是我们一直在讨论的范围。","start":3849.38,"end":3854.3},{"id":422,"text":"out. But it turns out, in a totally bizarre twist, that over into some regime where you're massively","zh":"out。但事实上，出现了一个完全奇怪的转折，即进入一个你严重过参数化的范围，超过这个阈值后，测试误差实际上又开始下降了。","start":3854.3,"end":3861.3},{"id":423,"text":"over-parameterized and past this threshold, the test error actually starts going down again.","zh":"我们一会儿会讨论这一点。现在，你可能只思考了偏差和方差大约25分钟或一个小时，无论课堂上已经进行了多久。","start":3861.3,"end":3867.52},{"id":424,"text":"We're going to talk about this in one second. Now, you have only been thinking about bias and","zh":"如果你思考了20年，你可能会想，天哪，这些疯子在说什么。但米沙非常聪明。当我读这篇论文时，我感到非常棒。现在我们","start":3868.06,"end":3872.7},{"id":425,"text":"variance for probably about 25 minutes or an hour, whatever it's been in the class.","zh":"方差大概讨论了25分钟或一小时，不管在课堂上已经进行了多久。","start":3872.7,"end":3876.48},{"id":426,"text":"If you've been thinking about this for 20 years, you're like, oh my god, what are these maniacs","zh":"如果你已经思考这个问题20年了，你可能会想，天哪，这些疯子在说什么。","start":3877.1,"end":3881.02},{"id":427,"text":"talking about. But Misha is brilliant. So when I read this paper, I was like, awesome. Now we","zh":"但米沙非常聪明。当我读到这篇论文时，我感到非常棒。现在我们","start":3881.02,"end":3885.92},{"id":428,"text":"understand. Misha wrote a bunch of awesome papers. I really love Misha. Anyway, so this is a","zh":"理解。米沙写了很多很棒的论文。我真的很喜欢米沙。总之，这就是一个","start":3885.92,"end":3891.54},{"id":429,"text":"classical regime. So here you have this variance explosion, and then all of a sudden it starts","zh":"经典范式。在这里，你会遇到方差爆炸，然后突然之间它就开始","start":3891.54,"end":3900.48}],"notes":["本段讨论了现代机器学习中一个令人惊讶的现象，即在模型参数远多于训练样本的情况下，测试误差反而会下降。这与传统的过拟合理论相矛盾，传统理论认为模型复杂度增加会导致测试误差上升。","讲者提到，过去人们认为在高复杂度模型中会出现过拟合，但现代研究表明，某些情况下模型反而能更好地泛化。这种现象被称为‘双下降’（double descent）现象。","讲者指出，Misha Belkin及其合作者的研究揭示了这一现象，特别是在核方法（kernels）中，模型在参数数量超过某个阈值后，测试误差开始下降。","讲者强调，这一发现挑战了传统的偏差-方差权衡理论，即模型复杂度增加会导致方差上升，而偏差下降，但传统理论认为方差上升会主导，导致测试误差上升。","讲者提到，这一现象在实际中被观察到，例如像GPT这样的大模型，即使没有显式的正则化，也能实现良好的泛化。","讲者最后指出，这一现象表明，传统的统计理论可能不足以解释现代机器学习的成功，需要新的理论框架来理解模型泛化能力。"],"formulas":[],"uncertainties":["over-parameterized and past this threshold","variance explosion"],"diagram":"none","start":3724.28,"end":3900.48,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":3724.28,"text":"you know, mathematically correct. Everything I've told you is correct. But there's a couple of things that it omits. And that's what I'm most interested to tell you about. Cool. Awesome. All right. I'm going to skip over this Bayesian thing. This is another way to say that I can motivate that theta comes from a Bayesian distribution. And this would be one of those ways to pick, you know, what is the ratio between them. So they are in the notes. But I really want to tell you the modern stuff because I genuinely love this stuff. All right. Okay."},{"start":3755.89,"text":"So the surprise of modern machine learning. So the classical Bayan's variant story tells you beyond some complexity, the test error must rise. That was the picture I showed you. A high degree polynomial that interpolates 15 points should be a complete disaster. You have a model that's extremely powerful. You're fitting fewer points. Something bad is going to happen."},{"start":3777.33,"text":"Now it turns out, and this is pretty interesting, we used to train models, we still do in some cases, train models that have many more parameters than their training points. They interpolate the training set perfectly. They exactly memorize it. But they also generalize. In some cases, generalize better than any model we know. So what the heck is going on here? So for much of the last decade, this puzzle for practitioners was not, how do we avoid overfitting, like I told you, but why aren't we overfitting?"},{"start":3807.38,"text":"That was the crazy thing. We were warned by our statistical priests and priestesses that bad things would happen if we ventured into this dark, you know, woolly land. And then we started training big models and everything got awesome. That's kind of how you can tell which side of the debate I'm on. But, you know, that's kind of how it works. Like, GPT does not care about your least squares regularization. Anyway, it does do regularization stuff under the covers, right? It does do stuff. So it's not true, okay? There's a wonderful paper by Misha and friends. Misha Belkin is the first author."},{"start":3835.6,"text":"And they showed, roughly speaking, that the following bizarre thing happens in a case called kernels, which we'll learn about later, but you don't need to know these particular things, where in the classical regime, you had this issue where the training set, the test error, indeed goes up."},{"start":3849.38,"text":"So model capacity on the x-axis, test error on the y-axis, and this is the regime we've been talking about."},{"start":3854.3,"text":"out. But it turns out, in a totally bizarre twist, that over into some regime where you're massively"},{"start":3861.3,"text":"over-parameterized and past this threshold, the test error actually starts going down again."},{"start":3868.06,"text":"We're going to talk about this in one second. Now, you have only been thinking about bias and"},{"start":3872.7,"text":"variance for probably about 25 minutes or an hour, whatever it's been in the class."},{"start":3877.1,"text":"If you've been thinking about this for 20 years, you're like, oh my god, what are these maniacs"},{"start":3881.02,"text":"talking about. But Misha is brilliant. So when I read this paper, I was like, awesome. Now we"},{"start":3885.92,"text":"understand. Misha wrote a bunch of awesome papers. I really love Misha. Anyway, so this is a"},{"start":3891.54,"text":"classical regime. So here you have this variance explosion, and then all of a sudden it starts"}],"speech_gaps":[],"frame":"../frames/v047/023.webp","frame_time":3736.28},{"title":"数据集划分与机器学习建议","segments":[{"id":430,"text":"going down. So this phenomenon is called double descent. And the idea is that there are many","zh":"下降。因此，这种现象被称为双重下降。其想法是，当处于这个区域时，存在许多零损失解，优化器","start":3900.48,"end":3906.16},{"id":431,"text":"zero loss solutions and optimizers when they're in this regime over here they'll","zh":"实际上能够挑选出一个平滑的解，因此回想一下之前提到的图像","start":3906.16,"end":3912.76},{"id":432,"text":"actually be able to pick out a smooth one and so think back to the picture","zh":"你有那些在有效范围内摆动的多项式，它所表达的意思是，如果我有一个高度过确定的多项式，并且给了我足够的数据，","start":3912.76,"end":3916.48},{"id":433,"text":"where you had those polynomials wiggling effectively what it's saying is if I had","zh":"并且对它进行了正则化，让它能够自我正则化，它就会得出一个零损失解，这个解实际上能够泛化","start":3916.48,"end":3920.56},{"id":434,"text":"a massively over determined polynomial and I gave it enough data and I","zh":"这是一个激进的说法，但事实上在神经网络中可以成立，并且在某些情况下可以被证明。","start":3920.56,"end":3925.92},{"id":435,"text":"regularized it I let it kind of regular self it would come up with a zero","zh":"零损失解，这个解实际上能够泛化。这是一个激进的说法，但事实上在神经网络中可以成立，并且在某些情况下可以被证明。","start":3925.92,"end":3929.0},{"id":436,"text":"solution that actually generalized that is a wild statement but turns out to be","zh":"零损失解，这个解实际上能够泛化。这是一个激进的说法，但事实上在神经网络中可以成立，并且在某些情况下可以被证明。","start":3929.0,"end":3935.3},{"id":437,"text":"can be true in neural nets and provable in some things.","zh":"零损失解，这个解实际上能够泛化。这是一个激进的说法，但事实上在神经网络中可以成立，并且在某些情况下可以被证明。","start":3935.3,"end":3937.98},{"id":438,"text":"So now, does that make sense? So I just wanted to tell you, this is, to me, one of the crazy things. We tell you train and test error matters, and it does. This whole picture is there. But it turns out that most of the progress in the last decade was jumping over this line and trying things that we shouldn't have tried. I don't know what you should take from that, except for that I think it's awesome. And it's phenomenal. Things started to work. Things didn't work, then they started to work.","zh":"那么现在，这有没有道理呢？我只是想告诉你们，对我来说，这是其中一个疯狂的事情。我们告诉你们训练误差和测试误差很重要，确实如此。整个图景都摆在那里。但结果发现，过去十年中大多数进展都是跳过了这条线，尝试了一些我们不应该尝试的事情。我不确定你们应该从中得到什么，除了我认为这真的很棒。而且这非常令人惊叹。事情开始起作用了，事情没起作用，然后又开始起作用了。","start":3941.95,"end":3965.83},{"id":439,"text":"Let me tell you one other one. So a separate worry that you have if you've taken a stats class and you're well-versed in it, and it's an interesting worry is, and by the way, this is a real worry. So for example, there's a guy at Stanford, John Yanidis, if you know who John is. John, one of John's great contributions is he told the FDA.","zh":"让我再告诉你们一个。如果你上过统计课并且很熟悉这些内容，你可能会有另一个担忧，这是一个有趣的担忧，顺便说一句，这也是一个真实存在的担忧。例如，斯坦福大学有一位叫约翰·亚纳迪斯的人，如果你知道他是谁的话。约翰的一大贡献是他告诉了FDA（美国食品药品监督管理局）。","start":3966.7,"end":3983.7},{"id":440,"text":"You should make people register their drug trials in advance. You try a drug, you should tell me what it does in advance, and then I'll come back. And they were very worried if you've ever heard about what's called p-hacking or other things like this, where you try and torture your data into getting to your conclusions. And they had a whole bunch of things where they basically showed that by registering their trials in advance, drugs got safer.","zh":"你应该让人们在试验开始前就注册他们的药物试验。你尝试一种药物，你应该提前告诉我它会有什么效果，然后我会回来。他们非常担心如果你听说过所谓的p-hacking（p值操控行为）或其他类似的事情，即你试图通过折磨数据来得出结论。他们展示了一系列事情，基本上表明通过提前注册试验，药物变得更安全了。","start":3984.5,"end":4003.52},{"id":441,"text":"Monstrous contribution. Every worry to believe that something like that could go on in machine learning, right? You show us the test sets, you give us a benchmark, we all hammer on it collectively, and secretly we're taking bits from the test set and leaking them back into our setup in a way that not even we understand. Is the concern clear? All right. So basically, are they overfitting across papers? And another way to say it is,","zh":"这是一项巨大的贡献。每一个担忧都相信在机器学习中会发生类似的事情，对吧？你展示给我们测试集，给我们一个基准，我们所有人一起努力，而秘密地，我们从测试集中提取一些数据，并以我们甚至自己都不理解的方式将其泄露回我们的设置中。这个担忧是否清楚？好的。基本上，他们是否在跨论文进行过拟合？另一种说法是，","start":4004.1,"end":4028.68},{"id":442,"text":"Do the same good models stay good? That's what we'd be worried about. We'd be worried we tried all this fun stuff out, and then it turned out that one artifact of this dataset called ImageNet, which Fei-Fei created, was leading us in the wrong direction. We thought Model A was better than Model B, but actually it was an artifact of the dataset, and we had been wrong the whole time. All right. So Ben, that's Ben. Ben and Ludwig works here too. Schmidt, that's Ludwig.","zh":"同样的好模型是否仍然保持良好？这就是我们担心的。我们会担心我们尝试了所有这些有趣的东西，结果发现这个名为ImageNet的数据集的一个特征，由Fei-Fei创建，引导我们走向了错误的方向。我们认为模型A比模型B更好，但实际上这是数据集的一个特征，我们一直犯了错误。好的。所以Ben，这就是Ben。Ben和Ludwig在这里也做了工作。Schmidt，这就是Ludwig。","start":4029.4,"end":4055.76}],"notes":["本段讨论了机器学习中一个有趣的现象，称为双下降现象。当模型参数数量超过数据量时，模型的测试误差会再次下降，这表明模型在某些情况下能够找到更平滑的解，从而实现更好的泛化。这一现象在神经网络中已被证明，并且在某些情况下是可证明的。","接下来，讲者提到在机器学习中，数据集划分和验证方法的重要性。他指出，过去十年中，许多进展是通过跳过某些关键步骤（如数据集划分）来实现的，这可能带来风险。他强调了测试集和基准的重要性，以及数据泄露的潜在问题。","讲者进一步提到，统计学中的一些问题，如p-hacking，可能在机器学习中也存在。他举了John Yanidis的例子，说明提前注册实验的重要性，以防止数据被人为操控。他指出，如果测试集被泄露，模型可能会过拟合，导致结果不可靠。","最后，讲者提到ImageNet数据集可能对模型性能产生影响。他指出，某些模型的性能差异可能并非真实反映模型能力，而是由于数据集的特性。这提醒我们，在评估模型时，需要考虑数据集的潜在偏差。","讲者还提到，Ben和Ludwig等人的工作，表明在机器学习领域，数据集划分和验证方法的正确使用至关重要。他强调了模型泛化能力的重要性，并指出数据泄露和过拟合是需要警惕的问题。","整体来看，本段内容强调了机器学习中数据集划分、验证方法和模型泛化能力的重要性。讲者通过多个例子，说明了数据泄露、过拟合和数据集偏差可能对模型性能产生的影响，并提醒我们注意这些问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3900.48,"end":4055.76,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":3900.48,"text":"going down. So this phenomenon is called double descent. And the idea is that there are many"},{"start":3906.16,"text":"zero loss solutions and optimizers when they're in this regime over here they'll"},{"start":3912.76,"text":"actually be able to pick out a smooth one and so think back to the picture"},{"start":3916.48,"text":"where you had those polynomials wiggling effectively what it's saying is if I had"},{"start":3920.56,"text":"a massively over determined polynomial and I gave it enough data and I"},{"start":3925.92,"text":"regularized it I let it kind of regular self it would come up with a zero"},{"start":3929.0,"text":"solution that actually generalized that is a wild statement but turns out to be"},{"start":3935.3,"text":"can be true in neural nets and provable in some things."},{"start":3941.95,"text":"So now, does that make sense? So I just wanted to tell you, this is, to me, one of the crazy things. We tell you train and test error matters, and it does. This whole picture is there. But it turns out that most of the progress in the last decade was jumping over this line and trying things that we shouldn't have tried. I don't know what you should take from that, except for that I think it's awesome. And it's phenomenal. Things started to work. Things didn't work, then they started to work."},{"start":3966.7,"text":"Let me tell you one other one. So a separate worry that you have if you've taken a stats class and you're well-versed in it, and it's an interesting worry is, and by the way, this is a real worry. So for example, there's a guy at Stanford, John Yanidis, if you know who John is. John, one of John's great contributions is he told the FDA."},{"start":3984.5,"text":"You should make people register your drug trials in advance. You try a drug, you should tell me what it does in advance, and then I'll come back. And they were very worried if you've ever heard about what's called p-hacking or other things like this, where you try and torture your data into getting to your conclusions. And they had a whole bunch of things where they basically showed that by registering their trials in advance, drugs got safer."},{"start":4004.1,"text":"Monstrous contribution. Every worry to believe that something like that could go on in machine learning, right? You show us the test sets, you give us a benchmark, we all hammer on it collectively, and secretly we're taking bits from the test set and leaking them back into our setup in a way that not even we understand. Is the concern clear? All right. So basically, are they overfitting across papers? And another way to say it is,"},{"start":4029.4,"text":"Do the same good models stay good? That's what we'd be worried about. We'd be worried we tried all this fun stuff out, and then it turned out that one artifact of this dataset called ImageNet, which Fei-Fei created, was leading us in the wrong direction. We thought Model A was better than Model B, but actually it was an artifact of the dataset, and we had been wrong the whole time. All right. So Ben, that's Ben. Ben and Ludwig works here too. Schmidt, that's Ludwig."}],"speech_gaps":[],"frame":"../frames/v047/024.webp","frame_time":3912.48},{"title":"数据集划分与机器学习建议","segments":[{"id":443,"text":"and the other ones are great too but they don't work here anyway so i didn't talk to them today anyway so built an image set they rebuilt the entire set by hand they went back it was just 10 years later and built it and paid for it and did it and scraped it and cleaned it and tried to replicate exactly the set just on different images it was hard because imaging technology changed a lot in 10 years what images people were changing were there a lot changed here are the results awesome this is the original","zh":"其他的也很好，但无论如何它们在这里不起作用，所以我今天没有和它们交谈。他们构建了一个图像集，重新手工构建了整个集，十年后他们回去并构建了它，付了钱，做了它，抓取了数据，清理了数据，并试图在不同的图像上精确复制这个集。这很困难，因为十年间成像技术发生了很大变化。人们使用的图像发生了很大变化，这里的结果令人惊叹，这是原始的图像集。","start":4056.64,"end":4083.2},{"id":444,"text":"Think, this is the original ImageNet accuracy. This is the new test set accuracy. If everything were perfect, you would expect it to live here. Something more interesting happened. All the models dropped by almost the same amount. And in fact, if you notice, since they're in a linear order, they didn't change ranking.","zh":"思考一下，这是原始的ImageNet准确率。这是新的测试集准确率。如果一切完美，你期望它在这里。发生了更有趣的事情。所有模型的准确率都下降了几乎相同幅度。事实上，如果你注意，由于它们是线性排列的，它们的排名没有改变。","start":4084.08,"end":4103.19},{"id":445,"text":"So in a very strange way, and you have to understand, ImageNet was so popular that you had people getting banned at companies for cheating, for trying to download bits of the service, like major companies. You had entire labs funding based on how they were doing at various points in this competition. You had a wild competition to try and climb to the top of this leaderboard where anyone who was doing computer vision effectively was testing, or large people were testing on ImageNet. And in spite of all that effort,","zh":"以一种非常奇怪的方式，你必须理解，ImageNet如此流行，以至于有人因为作弊，试图下载服务的一部分而被公司禁止，像大公司。整个实验室的资金都是基于他们在这一竞赛中各个阶段的表现。有一个激烈的竞争，试图攀登这个排行榜的顶端，任何有效进行计算机视觉的人都在测试，或者大公司都在ImageNet上进行测试。尽管付出了所有努力，","start":4104.52,"end":4131.23},{"id":446,"text":"A constant loss. And by the way, this constant loss is not mysterious either for another reason, which will come out. I was talking to Ben about it today. This fact that they drop is just basically because you have two different tests in the way that you've constructed them in weights. But the fact that their relative order stayed the same mean that also overfitting is a little bit overblown in this situation. Fascinating stuff. You could really worry about it. So does this mean that you can do whatever you want to your data? No.","zh":"却持续下降。顺便说一句，这种持续下降也不是神秘的，还有一个原因将要出现。我今天和Ben谈到这一点。这种下降的事实基本上是因为你在构建测试集时使用了两种不同的测试方式。但它们的相对顺序保持不变意味着在这种情况下，过拟合可能被夸大了。这很有趣。你真的可以担心这一点。但这是否意味着你可以随意处理你的数据？不。","start":4132.8,"end":4157.12},{"id":447,"text":"but it does mean that something more robust is going on in these models than we otherwise understood. Super interesting paper. Okay. Yeah, it was exactly 11 points. Not that 11 points is significant. Okay. All right. All right. So I'm going to skip through this. We talked about these two things. We talked about double descent and we talked about robustness.","zh":"但这意味着这些模型中发生的事情比我们之前理解的更加稳健。这篇论文非常有趣。好的。是的，正好是11个点。并不是说11个点有显著性。好的。好的。那我跳过这部分吧。我们已经讨论了这两点。我们讨论了双下降现象，也讨论了稳健性。","start":4157.89,"end":4180.19},{"id":448,"text":"So double descent was this idea that beyond the interpolation threshold, implicit bias from the optimizer plays a role and that the explicit regularization used to do and actually it picks out a smooth model. The implicit bias I didn't cover exactly, but you could even see it in least squares. If you pick the least squares optimizer like Penrose inverse or you ran with SGD with a little bit of waiting, you can see that you'll select something interesting. The robustness is also interesting. Even when generalization works in distribution,","zh":"双下降是指在插值阈值之上，优化器的隐式偏差起作用，而显式的正则化原本起到的作用，实际上它会选择一个平滑的模型。隐式偏差我没有详细讲解，但你甚至可以在最小二乘中看到这一点。如果你选择像Penrose逆这样的最小二乘优化器，或者用带有少量等待的SGD，你就能看到它会选择一些有趣的东西。稳健性也很有趣。即使在分布上泛化有效时，","start":4180.67,"end":4208.11}],"notes":["本段讨论了ImageNet数据集的构建过程，包括手动重建数据集、清理和复制图像集，以及由于成像技术的变化带来的挑战。还提到ImageNet的流行程度，包括公司员工因作弊而被禁止，以及整个实验室的资金依赖于ImageNet竞赛的表现。","本段指出，尽管所有模型在新测试集上的准确率都下降了，但它们的相对排名保持不变。这表明模型的过拟合可能被夸大了，但并不意味着可以随意处理数据。","本段介绍了双下降现象，即在插值阈值之后，优化器的隐式偏差起作用，而显式正则化不再有效。隐式偏差在最小二乘法中也可以观察到，例如使用Penrose逆或带有少量等待的SGD。","本段提到模型的鲁棒性，即使在分布外泛化有效的情况下，模型仍然表现出一定的鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4056.64,"end":4208.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4056.64,"text":"and the other ones are great too but they don't work here anyway so i didn't talk to them today anyway so built an image set they rebuilt the entire set by hand they went back it was just 10 years later and built it and paid for it and did it and scraped it and cleaned it and tried to replicate exactly the set just on different images
