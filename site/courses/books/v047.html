it was hard because imaging technology changed a lot in 10 years what images people were changing were there a lot changed here are the results awesome this is the original"},{"start":4084.08,"text":"Think, this is the original ImageNet accuracy. This is the new test set accuracy. If everything were perfect, you would expect it to live here. Something more interesting happened. All the models dropped by almost the same amount. And in fact, if you notice, since they're in a linear order, they didn't change ranking."},{"start":4104.52,"text":"So in a very strange way, and you have to understand, ImageNet was so popular that you had people getting banned at companies for cheating, for trying to download bits of the service, like major companies. You had entire labs funding based on how they were doing at various points in this competition. You had a wild competition to try and climb to the top of this leaderboard where anyone who was doing computer vision effectively was testing, or large people were testing on ImageNet. And in spite of all that effort,"},{"start":4132.8,"text":"A constant loss. And by the way, this constant loss is not mysterious either for another reason, which will come out. I was talking to Ben about it today. This fact that they drop is just basically because you have two different tests in the way that you've constructed them in weights. But the fact that their relative order stayed the same mean that also overfitting is a little bit overblown in this situation. Fascinating stuff. You could really worry about it. So does this mean that you can do whatever you want to your data? No."},{"start":4157.89,"text":"but it does mean that something more robust is going on in these models than we otherwise understood. Super interesting paper. Okay. Yeah, it was exactly 11 points. Not that 11 points is significant. Okay. All right. All right. So I'm going to skip through this. We talked about these two things. We talked about double descent and we talked about robustness."},{"start":4180.67,"text":"So double descent was this idea that beyond the interpolation threshold, implicit bias from the optimizer plays a role and that the explicit regularization used to do and actually it picks out a smooth model. The implicit bias I didn't cover exactly, but you could even see it in least squares. If you pick the least squares optimizer like Penrose inverse or you ran with SGD with a little bit of waiting, you can see that you'll select something interesting. The robustness is also interesting. Even when generalization works in distribution,"}],"speech_gaps":[],"frame":"../frames/v047/025.webp","frame_time":4068.64},{"title":"数据集划分与机器学习建议","segments":[{"id":449,"text":"This modest shift costs tens of accuracy points, but it still generalizes. That's the interesting part. It still generalizes even when you do these adaptive things that you think should lead to overfitting. Wild to me. All right. All right. So my point is here. This is the thing I care about for you. You may want to think that machine learning is like this giant solved space. It is not. There's so much stuff we just don't know. 2018 was a while ago, but it wasn't like 100 years ago.","zh":"这种适度的转变会损失数十个准确率点，但它仍然具有泛化能力。这就是有趣的地方。即使你进行这些你认为会导致过拟合的自适应操作，它仍然能够泛化。这对我来说很不可思议。好吧。好吧。我的观点在这里。这是我想让你关注的事情。你可能会认为机器学习就像一个巨大的已解决领域。它并不是。我们还有很多东西是不知道的。2018年已经过去很久了，但也不像100年前那样久远。","start":4208.94,"end":4236.76},{"id":450,"text":"we still don't know these basic, basic elements of how the world works. And they're coming out again and again and changing how we think about it. It's just a very exciting time in the field. All right. So the last like five or so minutes, I'm going to tell you, I think I'm just going to tell you one of these two things. I'm going to tell you what cross-validation is. And then I'm going to tell you what successive halving or hyperband is because I think it's genuinely useful.","zh":"我们仍然不知道这些关于世界运作的基本、基本要素。它们不断出现并改变我们对它的看法。这正是该领域非常令人兴奋的时期。好吧。因此，在接下来的五分钟左右，我想告诉你们，我认为我只会告诉你们这两件事中的一件。我要告诉你们什么是交叉验证。然后我要告诉你们什么是 successive halving 或者 hyperband，因为我认为它确实很有用。","start":4237.68,"end":4259.3},{"id":451,"text":"All right. So cross-validation is basically solving the following problem. Your test set is sacred.","zh":"好吧。交叉验证基本上是解决以下问题。你的测试集是神圣的。","start":4260.54,"end":4267.5},{"id":452,"text":"Every time you peek at it, you could leak information and inflate an estimate of how good you're doing, how well you're doing on the test set. You do typically want to have a dev set where you pick these hyperparameters. And the question is, how much data should you put in the dev set? How much should you put in the test set to ultimately get confidence? And how much should you keep in the training set? And what we found over the years is we want to cram as much as we can in the training set because that seems to lead to better models. But that's the fundamental trade-off that we're worried about.","zh":"每次你查看它时，都可能泄露信息并夸大你表现良好的估计，即你在测试集上的表现。你通常希望有一个开发集来选择这些超参数。问题是，你应该在开发集中放入多少数据？为了最终获得信心，你应该在测试集中放入多少数据？你应该在训练集中保留多少数据？多年来我们发现，我们想要尽可能多地将数据放入训练集中，因为这似乎会导致更好的模型。但这是我们担心的基本权衡。","start":4268.37,"end":4294.83},{"id":453,"text":"So here's the basic idea. So let's say that you train on a set. You have the dev set and you have a set of models. For each candidate, you train a model D and you score on D and you pick the model with the best dev score. If you do that, you can pick a pretty good model. Now, why don't you pick on the train set? This is the only key question I care about.","zh":"所以这里的基本想法是。假设你在一个数据集上进行训练。你有一个开发集，你有一组模型。对于每个候选模型，你训练一个模型 D，并在 D 上进行评分，然后选择具有最佳开发集得分的模型。如果你这样做，你可以选择一个相当不错的模型。现在，为什么你不直接在训练集上进行选择？这是唯一一个我关心的关键问题。","start":4297.66,"end":4324.15},{"id":454,"text":"Why don't you train a model on the train set and use the best train set as your potential value to pick one of these hyperparameters? Exactly right. You could pick, and the train set for the most expressive model, as we talked about, could be zero. It could go exactly to the bottom.","zh":"为什么你不把模型训练在训练集上，并用最好的训练集作为你选择这些超参数的潜在价值呢？完全正确。你可以选择，并且正如我们之前讨论的，最具有表达力的模型的训练集可以是零。它可能直接降到最低点。","start":4324.56,"end":4340.86},{"id":455,"text":"So you have this other set that was sampled in an interesting way,","zh":"你还有一个以有趣方式采样的数据集，","start":4341.5,"end":4344.34},{"id":456,"text":"and that allows you to get around it.","zh":"这使你能够绕过这个问题。","start":4344.52,"end":4346.4},{"id":457,"text":"Now, what cross-validation does is it says you want to be more data efficient.","zh":"现在，交叉验证的作用是它告诉你想要更加高效地利用数据。","start":4346.56,"end":4350.4},{"id":458,"text":"So it says instead of taking the entire train set and splitting an entire dev set,","zh":"因此，它说你不要把整个训练集和整个开发集都拿来进行划分，","start":4350.66,"end":4354.86},{"id":459,"text":"you split it into small pieces.","zh":"而是将其分成小块。","start":4355.04,"end":4357.12},{"id":460,"text":"This is a classical statistical thing.","zh":"这是一个经典的统计学问题。","start":4358.04,"end":4360.22},{"id":461,"text":"You may have seen this before.","zh":"你可能以前见过这个。","start":4360.3,"end":4361.26},{"id":462,"text":"You split it into small pieces.","zh":"你把它分成小块。","start":4361.76,"end":4363.28},{"id":463,"text":"Say you have five pieces.","zh":"比如说你有五块。","start":4363.44,"end":4364.56},{"id":464,"text":"You train on four to predict the fifth.","zh":"你用四块来训练，预测第五块。","start":4364.72,"end":4367.02},{"id":465,"text":"And that is enough of a mix-up that you're not going to then pick","zh":"这种混合程度已经足够，以至于你不会因此选择","start":4367.28,"end":4370.88},{"id":466,"text":"pick the most expressive class because you're going to have this generalization and hold","zh":"最具有表达力的类别，因为你会有这种泛化和保留","start":4370.88,"end":4375.56},{"id":467,"text":"out to one piece.","zh":"一块出来。","start":4375.56,"end":4376.18},{"id":468,"text":"But I'm going to tell you about the compute efficient thing in just five minutes.","zh":"但我将在五分钟内告诉你关于计算效率的事情。","start":4376.86,"end":4379.58},{"id":469,"text":"Oops, sorry for the scanning.","zh":"啊，抱歉，扫描时出错了。","start":4380.98,"end":4383.16}],"notes":["本段讨论了数据集划分的重要性，特别是训练集、验证集和测试集的划分。讲者指出，测试集是神圣的，不能随意查看，否则会导致信息泄露并高估模型性能。验证集用于选择超参数，而训练集则用于模型训练。讲者强调，训练集应尽可能多，以获得更好的模型，但这也带来了训练集与验证集之间的权衡问题。","讲者提到，交叉验证是一种更高效的数据使用方法，它将数据集划分为多个小块，通过轮流使用其中一部分作为验证集，其余部分作为训练集，从而避免了单一验证集可能带来的偏差。这种方法能够更好地评估模型的泛化能力，防止选择过于复杂的模型。","讲者还提到，交叉验证的核心思想是通过多次划分数据集，使得模型在不同数据子集上的表现更加稳定，从而避免因数据划分方式不同而导致的模型选择偏差。这种方法在统计学中是经典的，也常用于机器学习模型的评估。","讲者指出，交叉验证不仅提高了数据使用效率，还能够帮助模型避免过拟合，尤其是在选择超参数时，通过多次验证可以更准确地评估模型的性能。这种方法在实际应用中非常有用，尤其是在数据量有限的情况下。","讲者提到，虽然交叉验证在数据使用效率方面有优势，但计算效率可能较低，因此还介绍了另一种更高效的算法——Successive Halving或Hyperband。这些方法在计算资源有限的情况下，能够更有效地进行超参数调优。","讲者最后提到，交叉验证的划分方式需要仔细考虑，以确保模型的泛化能力。同时，讲者也提醒听众，数据集划分是一个复杂的问题，需要根据具体任务和数据特点进行调整。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4208.94,"end":4383.16,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":4208.94,"text":"This modest shift costs tens of accuracy points, but it still generalizes. That's the interesting part. It still generalizes even when you do these adaptive things that you think should lead to overfitting. Wild to me. All right. All right. So my point is here. This is the thing I care about for you. You may want to think that machine learning is like this giant solved space. It is not. There's so much stuff we just don't know. 2018 was a while ago, but it wasn't like 100 years ago."},{"start":4237.68,"text":"we still don't know these basic, basic elements of how the world works. And they're coming out again and again and changing how we think about it. It's just a very exciting time in the field. All right. So the last like five or so minutes, I'm going to tell you, I think I'm just going to tell you one of these two things. I'm going to tell you what cross-validation is. And then I'm going to tell you what successive halving or hyperband is because I think it's genuinely useful."},{"start":4260.54,"text":"All right. So cross-validation is basically solving the following problem. Your test set is sacred."},{"start":4268.37,"text":"Every time you peek at it, you could leak information and inflate an estimate of how good you're doing, how well you're doing on the test set. You do typically want to have a dev set where you pick these hyperparameters. And the question is, how much data should you put in the dev set? How much should you put in the test set to ultimately get confidence? And how much should you keep in the training set? And what we found over the years is we want to cram as much as we can in the training set because that seems to lead to better models. But that's the fundamental trade-off that we're worried about."},{"start":4297.66,"text":"So here's the basic idea. So let's say that you train on a set. You have the dev set and you have a set of models. For each candidate, you train a model D and you score on D and you pick the model with the best dev score. If you do that, you can pick a pretty good model. Now, why don't you pick on the train set? This is the only key question I care about."},{"start":4324.56,"text":"Why don't you train a model on the train set and use the best train set as your potential value to pick one of these hyperparameters? Exactly right. You could pick, and the train set for the most expressive model, as we talked about, could be zero. It could go exactly to the bottom."},{"start":4341.5,"text":"So you have this other set that was sampled in an interesting way,"},{"start":4344.52,"text":"and that allows you to get around it."},{"start":4346.56,"text":"Now, what cross-validation does is it says you want to be more data efficient."},{"start":4350.66,"text":"So it says instead of taking the entire train set and splitting an entire dev set,"},{"start":4355.04,"text":"you split it into small pieces."},{"start":4358.04,"text":"This is a classical statistical thing."},{"start":4360.3,"text":"You may have seen this before."},{"start":4361.76,"text":"You split it into small pieces."},{"start":4363.44,"text":"Say you have five pieces."},{"start":4364.72,"text":"You train on four to predict the fifth."},{"start":4367.28,"text":"And that is enough of a mix-up that you're not going to then pick"},{"start":4370.88,"text":"pick the most expressive class because you're going to have this generalization and hold"},{"start":4375.56,"text":"out to one piece."},{"start":4376.86,"text":"But I'm going to tell you about the compute efficient thing in just five minutes."},{"start":4380.98,"text":"Oops, sorry for the scanning."}],"speech_gaps":[],"frame":"../frames/v047/026.webp","frame_time":4220.94},{"title":"数据集划分与机器学习建议","segments":[{"id":470,"text":"All right, so here's the idea.","zh":"好的，那么这里的想法是。","start":4385.96,"end":4390.12},{"id":471,"text":"Okay, so this is Amit, he's at CMU, Jameson, he's at Washington.","zh":"好的，所以这是Amit，他在CMU，Jameson，他在华盛顿。","start":4392.02,"end":4396.3},{"id":472,"text":"So the core idea here is we're going to try and figure out from the models,","zh":"所以这里的核心想法是，我们要从模型中尝试找出一些东西，","start":4396.3,"end":4400.24},{"id":473,"text":"we're going to try and run various different regularization parameters.","zh":"我们要尝试运行各种不同的正则化参数。","start":4400.62,"end":4403.4},{"id":474,"text":"Say the row, we're going to pick all the different rows and we're going to run them.","zh":"比如说，我们将会挑选所有的不同行，并运行它们。","start":4403.52,"end":4406.08},{"id":475,"text":"And the idea is we're going to do the following.","zh":"并且想法是，我们要做以下事情。","start":4407.18,"end":4408.68},{"id":476,"text":"We're going to run all candidate models for a small number of steps.","zh":"我们要对所有候选模型运行一个较小数量的步骤。","start":4408.9,"end":4411.9},{"id":477,"text":"So we're going to grid our rows into small values.","zh":"因此，我们将把我们的行网格化为较小的值。","start":4412.06,"end":4414.72},{"id":478,"text":"Row one, row two, row three, just try them, maybe at different octaves, whatever you like.","zh":"第一行，第二行，第三行，随便尝试一下，也许在不同的音高上，你喜欢的都可以。","start":4414.88,"end":4418.36},{"id":479,"text":"We're going to score them all and we're going to drop the worst half.","zh":"我们将对它们全部进行评分，然后丢弃最差的一半。","start":4419.46,"end":4422.6},{"id":480,"text":"Then we're going to run the survivor for twice as many steps.","zh":"接着我们将让幸存下来的模型运行两倍多的步骤。","start":4423.66,"end":4426.1},{"id":481,"text":"Okay? And we're going to repeat this until one model remains. And so let's see it in action.","zh":"明白了吗？我们将重复这个过程，直到只剩下一个模型。那么让我们看看实际操作是怎样的。","start":4427.68,"end":4432.38},{"id":482,"text":"So each round is going to reuse roughly the same amount of total compute, but better models are","zh":"每一轮所使用的总计算量大致相同，但更好的模型会获得指数级更多的计算资源。","start":4432.5,"end":4437.04},{"id":483,"text":"going to receive exponentially more of it. Every round, better models are getting more and more","zh":"每一轮，更好的模型会获得越来越多的数据。","start":4437.04,"end":4440.66},{"id":484,"text":"data. Okay? So here's how it works. So we run the first set. We have these different configurations,","zh":"明白了吗？那么它是如何运作的。我们首先运行第一组，我们有这些不同的配置，","start":4440.66,"end":4447.32},{"id":485,"text":"A through eight.","zh":"A到八。","start":4447.32,"end":4448.44},{"id":486,"text":"And here we are basically picking the smallest scores. And so we pick the smallest scores, A wins, C wins, E wins, G wins, in a sense that they are in the top half of models. Then we run them, but we run them for twice as long. So A is getting actually three times as much compute as B. So we're devoting more resources to the things that we think are promising. When we run again, we see here that after the second half,","zh":"在这里，我们基本上是在挑选最小的得分。因此，我们挑选最小的得分，A获胜，C获胜，E获胜，G获胜，从某种意义上说，它们位于模型的前半部分。然后我们运行它们，但运行时间是原来的两倍。因此，A实际上获得的计算资源是B的三倍。因此，我们将更多资源投入到我们认为有潜力的方面。当我们再次运行时，我们会看到，在第二阶段之后，","start":4449.56,"end":4476.97},{"id":487,"text":"A and C are scoring better than E and G, and so we keep them. We continue to run, and we continue to run. Clear enough how it works? Please. Here, there's no need to sample. Here, what we're doing is we are just running them all in parallel. There's no sampling going on whatsoever.","zh":"A和C的得分比E和G更好，因此我们保留它们。我们继续运行，我们继续运行。清楚这个过程是如何运作的吗？请。在这里，不需要进行采样。在这里，我们所做的只是将它们全部并行运行。根本没有进行任何采样。","start":4477.51,"end":4496.91},{"id":488,"text":"Here, yeah. Underneath the covers in this abstraction, they're just running for however long goes underneath the covers. This is just about saving compute. So what's going on here is, let's say that we're going to have to fit some big model, and that model is going to take two days to run. We have eight configurations of that model. So we can either rate 16 compute days, or we could try and figure out which one are we going to run faster. You continue. So each one of these continues. As you notice, the scores are going down monotonically. You got this exactly right.","zh":"在这里，是的。在这一抽象层之下，它们只是运行到覆盖层下的时间长度。这仅仅是为了节省计算资源。所以这里发生的事情是，假设我们要拟合一个大模型，而该模型需要运行两天。我们有八个该模型的配置。因此，我们可以选择使用16个计算天数，或者尝试找出哪些配置可以更快运行。你继续。因此，每一个都继续运行。正如你所注意到的，得分是单调递减的。你完全理解了这一点。","start":4499.85,"end":4529.19},{"id":489,"text":"Hopefully, though, this is clear. What I've done is, so all the compute, basically, that went into these characters in the final analysis is wasted. But a large fraction, you compute the exact fraction, went into the model that was eventually the winner, which I can then use to continue. So this very simple idea, by the way, did a huge, huge service because you could do very complicated things in tuning. But that simple trick is one that I use kind of all the time. Very simple to implement.","zh":"希望这已经很清楚了。我所做的就是，基本上所有投入到这些字符中的计算资源在最终分析中都被浪费了。但很大一部分，你可以计算出确切的比例，投入到最终获胜的模型中，我之后可以继续使用它。顺便说一句，这个非常简单的想法起到了巨大的作用，因为它允许你在调参中进行非常复杂的操作。但这个简单的技巧是我经常使用的一种方法。非常容易实现。","start":4533.04,"end":4561.96}],"notes":["本段讲解了机器学习中一种模型选择和优化的策略，即通过逐步淘汰表现较差的模型，将更多计算资源分配给表现较好的模型。这种方法的核心思想是通过多次迭代，每次保留表现最好的一半模型，并将计算资源加倍分配给这些模型，从而更高效地找到最优模型。","在具体操作中，首先会运行所有候选模型，使用较小的计算步骤，然后根据模型表现淘汰较差的一半。剩下的模型将获得更多的计算资源，继续运行。这个过程会重复进行，直到只剩下一个模型为止。这种方法可以节省计算资源，同时提高模型选择的效率。","在实际操作中，模型的评分是关键，评分越低的模型越可能被淘汰。通过这种方式，可以确保资源被分配给最有潜力的模型。例如，模型A在第一次运行后表现较好，因此会获得更多的计算资源，从而在后续的迭代中进一步优化。","这种方法的一个重要特点是，每次迭代中，资源的分配是基于模型的表现，而不是随机选择。因此，资源的分配更加高效，能够更快地收敛到最优模型。","此外，这种方法还可以用于大规模模型的训练，例如需要两天时间运行的模型。通过这种方法，可以减少总的计算时间，同时确保最终模型的质量。","最后，作者提到这种方法虽然简单，但非常有效，可以用于复杂的模型调优任务。这种方法的实现也非常简单，只需要在每次迭代中根据模型表现调整资源分配即可。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4385.96,"end":4561.96,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":4385.96,"text":"All right, so here's the idea."},{"start":4392.02,"text":"Okay, so this is Amit, he's at CMU, Jameson, he's at Washington."},{"start":4396.3,"text":"So the core idea here is we're going to try and figure out from the models,"},{"start":4400.62,"text":"we're going to try and run various different regularization parameters."},{"start":4403.52,"text":"Say the row, we're going to pick all the different rows and we're going to run them."},{"start":4407.18,"text":"And the idea is we're going to do the following."},{"start":4408.9,"text":"We're going to run all candidate models for a small number of steps."},{"start":4412.06,"text":"So we're going to grid our rows into small values."},{"start":4414.88,"text":"Row one, row two, row three, just try them, maybe at different octaves, whatever you like."},{"start":4419.46,"text":"We're going to score them all and we're going to drop the worst half."},{"start":4423.66,"text":"Then we're going to run the survivor for twice as many steps."},{"start":4427.68,"text":"Okay? And we're going to repeat this until one model remains. And so let's see it in action."},{"start":4432.5,"text":"So each round is going to reuse roughly the same amount of total compute, but better models are"},{"start":4437.04,"text":"going to receive exponentially more of it. Every round, better models are getting more and more"},{"start":4440.66,"text":"data. Okay? So here's how it works. So we run the first set. We have these different configurations,"},{"start":4447.32,"text":"A through eight."},{"start":4449.56,"text":"And here we are basically picking the smallest scores. And so we pick the smallest scores, A wins, C wins, E wins, G wins, in a sense that they are in the top half of models. Then we run them, but we run them for twice as long. So A is getting actually three times as much compute as B. So we're devoting more resources to the things that we think are promising. When we run again, we see here that after the second half,"},{"start":4477.51,"text":"A and C are scoring better than E and G, and so we keep them. We continue to run, and we continue to run. Clear enough how it works? Please. Here, there's no need to sample. Here, what we're doing is we are just running them all in parallel. There's no sampling going on whatsoever."},{"start":4499.85,"text":"Here, yeah. Underneath the covers in this abstraction, they're just running for however long goes underneath the covers. This is just about saving compute. So what's going on here is, let's say that we're going to have to fit some big model, and that model is going to take two days to run. We have eight configurations of that model. So we can either rate 16 compute days, or we could try and figure out which one are we going to run faster. You continue. So each one of these continues. As you notice, the scores are going down monotonically. You got this exactly right."},{"start":4533.04,"text":"Hopefully, though, this is clear. What I've done is, so all the compute, basically, that went into these characters in the final analysis is wasted. But a large fraction, you compute the exact fraction, went into the model that was eventually the winner, which I can then use to continue. So this very simple idea, by the way, did a huge, huge service because you could do very complicated things in tuning. But that simple trick is one that I use kind of all the time. Very simple to implement."}],"speech_gaps":[],"frame":"../frames/v047/027.webp","frame_time":4397.96},{"title":"数据集划分与机器学习建议","segments":[{"id":490,"text":"has very nice properties, and actually it has a bunch of analysis that says, if you have certain properties on the scores, this is about the optimal thing to do. And there are very complicated procedures that were proposed. I've listed a couple here. Some are quite good, but this is actually this tuning problem is a real problem.","zh":"它具有非常好的性质，实际上有一些分析表明，如果你在得分上具有某些性质，那么这就是应该采取的最佳做法。还提出了非常复杂的程序。我在这里列出了几个。有些相当不错，但事实上，这个调参问题是一个真实的问题。","start":4562.57,"end":4579.27},{"id":491,"text":"Okay, so what do we talk about here? I'm just going to get to the thing. So we talked about a couple things. We talked about overfit versus underfit. We learn how the learn function changes when we redraw the training data. This was a change from what we had talked about before. Previously, we had talked about there is a training set, and then we wanted to understand and analyze. Now we're talking about how the training set itself was sampled so that we could talk about the model class. What would happen as we, what we expect to happen for a model on a new data source.","zh":"好的，那么我们在这里要讨论什么呢？我直接进入主题。我们讨论了一些内容。我们讨论了过拟合与欠拟合。我们学习了当重新绘制训练数据时，学习函数是如何变化的。这与我们之前讨论的内容有所不同。之前我们讨论的是存在一个训练集，然后我们想要理解和分析。现在我们讨论的是训练集本身是如何采样的，以便我们可以讨论模型类。当我们面对新的数据源时，模型会发生什么，我们期望会发生什么。","start":4580.34,"end":4606.14},{"id":492,"text":"We then saw those pictures and we turned them into bias variants. We decomposed into three terms. The noise, which was intrinsic in the test set. The bias squared, that was the line that we talked about. And variance, how much it jumped around from training set to training set, how kind of stable things were. We then dealt to deal with variance. We added some regularization.","zh":"我们随后看到了这些图片，并将其转化为偏差变体。我们将它们分解为三个部分。噪声，这是测试集固有的。偏差平方，这是我们讨论的那条线。以及方差，即从一个训练集到另一个训练集时，模型有多大波动，事物有多稳定。我们随后处理了方差问题。我们添加了一些正则化。","start":4606.88,"end":4627.74},{"id":493,"text":"We went through fairly quickly ridge regression in detail. And what ridge regression showed us was we could hopefully add a little bit of bias to reduce variance by quite a bit. And that was a general thing of regularization. And I made the point there that there are lots of ways to regularize models in modern parlance. And that this idea really that you should take is anything that prevents us from kind of overfitting to a point or trusting our data too much usually has some interpretation as regularization.","zh":"我们快速地详细讨论了岭回归。岭回归向我们展示了，我们可以通过添加一点偏差来显著降低方差。这是一般正则化的一个例子。我在那时指出，在现代术语中，有许多方法可以正则化模型。这个想法实际上是任何防止我们过度拟合到某个程度或过于信任我们的数据的方法，通常都可以解释为正则化。","start":4628.26,"end":4652.76},{"id":494,"text":"I couldn't help myself. I don't think you have to know this for the course, but I don't care. I wanted to tell you. Modern models have this twist that past the U-curve that I showed you, the classical kind of bias-variant trade-off curve that I showed you, lives this other regime. And that's where most of the models that you probably use right now live. They live in that over-parameterized regime or in this regime where, as you said, you have huge models relative to the amount of data that's there.","zh":"我忍不住要说。我认为你们这门课可能不需要知道这些，但我无所谓。我想告诉你们。现代模型有一个特点，那就是在我们之前展示的U型曲线之后，还存在另一种经典的偏差-方差权衡曲线所处的区域。而大多数你现在可能使用的模型就处于这个区域中。它们处于一个参数过多的区域，或者处于这样一个区域，正如你所说，模型相对于数据量来说非常庞大。","start":4653.46,"end":4676.04},{"id":495,"text":"We talked about double descent, which was that regime, and why robustness matters a little bit. And then this idea about adaptive overfitting, that is being able to take a new data set and apply it in the world. This is a very strong form of generalization. Somehow this still held up even when we were benchmarking. And then we talked a little bit briefly about model selection.","zh":"我们讨论了双重下降现象，也就是那个区域，以及为什么鲁棒性在某种程度上很重要。然后我们简要地谈到了自适应过拟合的概念，即能够将新数据集应用到实际世界中。这是一种非常强的泛化能力。某种意义上，即使在我们进行基准测试时，这种能力仍然保持有效。接着我们还简短地谈了一下模型选择。","start":4676.76,"end":4700.38}],"notes":["本段讲解了偏差-方差分解的概念，将模型误差分解为噪声、偏差平方和方差三个部分。噪声是测试集固有的随机误差，偏差平方是模型对数据的平均预测与真实值之间的差距，方差则是模型在不同训练集上的预测结果波动程度。通过添加正则化可以减少方差，从而提升模型的泛化能力。","本段介绍了岭回归作为正则化方法的实例，说明通过引入偏差可以显著降低方差。正则化不仅限于岭回归，还包括其他多种方法，其核心思想是防止模型过度拟合训练数据，从而提高模型的泛化能力。","本段讨论了现代机器学习模型所处的过参数化区域，即模型复杂度远高于数据量的区域。在这一区域，传统的偏差-方差权衡曲线不再适用，出现了双下降现象，即随着模型复杂度的增加，测试误差先下降后上升再下降。","本段提到双下降现象和鲁棒性的重要性，以及自适应过拟合的概念，即模型能够将新数据集应用到实际世界中，表现出强大的泛化能力。即使在基准测试中，这种能力仍然有效，说明模型具有良好的泛化性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4562.57,"end":4700.38,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4562.57,"text":"has very nice properties, and actually it has a bunch of analysis that says, if you have certain properties on the scores, this is about the optimal thing to do. And there are very complicated procedures that were proposed. I've listed a couple here. Some are quite good, but this is actually this tuning problem is a real problem."},{"start":4580.34,"text":"Okay, so what do we talk about here? I'm just going to get to the thing. So we talked about a couple things. We talked about overfit versus underfit. We learn how the learn function changes when we redraw the training data. This was a change from what we had talked about before. Previously, we had talked about there is a training set, and then we wanted to understand and analyze. Now we're talking about how the training set itself was sampled so that we could talk about the model class. What would happen as we, what we expect to happen for a model on a new data source."},{"start":4606.88,"text":"We then saw those pictures and we turned them into bias variants. We decomposed into three terms. The noise, which was intrinsic in the test set. The bias squared, that was the line that we talked about. And variance, how much it jumped around from training set to training set, how kind of stable things were. We then dealt to deal with variance. We added some regularization."},{"start":4628.26,"text":"We went through fairly quickly ridge regression in detail. And what ridge regression showed us was we could hopefully add a little bit of bias to reduce variance by quite a bit. And that was a general thing of regularization. And I made the point there that there are lots of ways to regularize models in modern parlance. And that this idea really that you should take is anything that prevents us from kind of overfitting to a point or trusting our data too much usually has some interpretation as regularization."},{"start":4653.46,"text":"I couldn't help myself. I don't think you have to know this for the course, but I don't care. I wanted to tell you. Modern models have this twist that past the U-curve that I showed you, the classical kind of bias-variant trade-off curve that I showed you, lives this other regime. And that's where most of the models that you probably use right now live. They live in that over-parameterized regime or in this regime where, as you said, you have huge models relative to the amount of data that's there."},{"start":4676.76,"text":"We talked about double descent, which was that regime, and why robustness matters a little bit. And then this idea about adaptive overfitting, that is being able to take a new data set and apply it in the world. This is a very strong form of generalization. Somehow this still held up even when we were benchmarking. And then we talked a little bit briefly about model selection. With that, thank you so much. Have a great rest of your week. Appreciate your time."}],"speech_gaps":[],"frame":"../frames/v047/028.webp","frame_time":4574.57}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v047.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
