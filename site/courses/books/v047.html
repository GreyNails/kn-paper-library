ffer in the terminology. It's kind of a grim way to put it, but it is the terminology. I'm going to suffer a loss."},{"start":1310.96,"text":"Proportional to the square. That's the risk. Please. Great question. So where does the question is, why are we adding this Y error underneath the covers? And that Y error is something that we would observe on any point, right? So the mental model is that this is the way that data are created. And the test data is created in the same way as the train is created, that we would have that underneath the covers. We will guess that it's this value. And we'll come to exactly how that epsilon figures into our calculations in just one second."},{"start":1341.86,"text":"But it's just uniformity. Train and test are the same. All right. Now, what we're going to analyze is a procedure that's actually quite complicated if you thought through the details of it, which is we're going to average over all the randomness that we did in this and try and analyze the quantities underneath the covers."}],"speech_gaps":[],"frame":"../frames/v047/008.webp","frame_time":1197.42},{"title":"数据集划分与机器学习建议","segments":[{"id":116,"text":"This is different than the way we've been thinking, where just one training set comes to us. We're going to think about all the training sets that we could have produced. So we have two sources of randomness. The draw of S, that means this step here where we draw n training points. So it's going to be drawn according to some random process. And then the draw of epsilon at the test point, which is this epsilon we just discussed. Clear enough? Now, we talked about this already, but this is just to recap.","zh":"这与我们之前思考的方式不同，之前我们只考虑一个训练集。我们将考虑所有可能产生的训练集。因此，我们有两个随机来源。S的抽取，即此处我们抽取n个训练点的步骤。它将根据某种随机过程进行抽取。然后是测试点处的epsilon抽取，也就是我们刚刚讨论的epsilon。清楚吗？我们之前已经讨论过这一点，但这是为了回顾。","start":1362.69,"end":1391.18},{"id":117,"text":"Why is this true data point? H star, this is the true model. Remember on our quadratic, which came before? This was the fact that there existed a quadratic with exactly the right theta 1, theta 2, theta 0 that we had before. And we generated all the data. And we fit this model, H of s, on our training data s. This is what we're looking at. Now, the quantity we care about from that last thing is this expected value.","zh":"为什么这是真实的数据点？H星，这是真实模型。还记得我们之前的二次函数吗？这指的是存在一个具有恰好正确theta1、theta2和theta0的二次函数，我们之前已经讨论过。我们生成了所有数据，并在训练数据S上拟合了这个模型H of s。这就是我们正在关注的内容。我们从上一个内容中关心的量是这个期望值。","start":1391.87,"end":1417.58},{"id":118,"text":"This is the expected value over the epsilon error. This is the error that was introduced on the test point. And s, which was the draw, which produced this function. And we're going to try and decompose that error into three pieces. Please. Is there a way to assume that we have enough parameters in our points x to correctly predict y? Wonderful question.","zh":"这是对epsilon误差的期望值。这是在测试点引入的误差。以及S，即产生这个函数的抽取。我们将尝试将这个误差分解为三个部分。请问，有没有可能假设我们的点x具有足够的参数来正确预测y？非常好的问题。","start":1418.34,"end":1440.75},{"id":119,"text":"This universal function can't be supported. That's the case, right? Wonderful question. So the question is, can we assume, or do we have to assume for this analysis, that h actually can get to a zero-loss solution, that there exists an h which exactly fits y? We don't have to assume that to get here. We'll see where we pay for that. If, for example, we're fitting h's that are too small, they're linear, and we wanted a quadratic, we should pay for that somewhere. And you're going to see one term that we pay for that in a little bit.","zh":"这个通用函数无法被支持。这就是这种情况，对吧？非常好的问题。问题是，我们可以假设，或者我们必须假设在此次分析中，h实际上可以达到零损失解，即存在一个h能够完全拟合y？我们不需要假设这一点才能到达这里。我们稍后会看到这一点的代价。例如，如果我们拟合的h太小，比如是线性的，而我们想要的是二次的，那么我们会在某处为此付出代价。你稍后会看到一个与此相关的项。","start":1442.13,"end":1467.67},{"id":120,"text":"There's also going to be a separate variance term. But there's nothing here that requires, like, we could pick a completely insane set of H's here. We could still analyze it. Yeah. The true data generating process uses all the coordinates of X. So I don't know about coordinates. So it's true. OK, so one thing that you could think, which is not linked in my head, but just to make sure it's clear is,","zh":"还会有另一个方差项。但这里没有任何内容要求我们必须这样做，我们甚至可以在这里选择一个完全疯狂的H集合。我们仍然可以对其进行分析。是的。真实的数据生成过程使用了X的所有坐标。所以我不确定关于坐标的事情。所以这是真的。好的，你可以这样想，虽然这在我的脑海中没有直接联系，但只是为了确保清楚：","start":1468.59,"end":1497.25},{"id":121,"text":"The data generating process is some function h star. You could say it's only reasonable that our h of s that we have down here contains h star. So a set of all h's that we could learn should contain h star. And that would be a fairly sensible thing to do, and in most setups we'll do it. But it's actually, strictly speaking, not necessary, because it could be that h is drawn from some other function class, and we're representing it in a different way. And everything I'm going to say will also go through.","zh":"数据生成过程是一个函数h星。你可以认为，我们的下方所指的h of s包含h星是合理的。因此，我们能够学习的所有h的集合应该包含h星。这会是一个相当合理的做法，并且在大多数情况下我们会这样做。但实际上，严格来说，这并不是必要的，因为有可能h是从另一个函数类中抽取的，并以不同的方式表示。我接下来要说的一切同样适用。","start":1497.95,"end":1522.57}],"notes":["本段讨论了机器学习中误差分解的三个组成部分，即偏差、方差和噪声。讲者指出，我们不需要假设模型能够达到零损失，因为即使模型无法完全拟合数据，分析仍然可以进行。此外，讲者提到数据生成过程使用了所有X的坐标，但并不需要假设模型集合包含真实函数h*，因为模型可以来自其他函数类。","讲者强调了模型复杂度与误差之间的关系，指出如果模型过于简单（如线性模型用于拟合二次函数），会导致误差增加。这种误差可以分解为偏差、方差和噪声三个部分，其中偏差与模型的复杂度有关，方差与训练数据的随机性有关，而噪声则是测试点本身的随机误差。","讲者提到，虽然通常会假设模型集合包含真实函数h*，但这并不是严格必要的。模型可以来自其他函数类，只要能够正确表示数据生成过程即可。这种灵活性使得分析仍然有效。","讲者指出，数据生成过程使用了所有X的坐标，但并未明确说明这些坐标的具体形式或分布。因此，关于数据生成过程的假设可能需要进一步澄清。","讲者提到，模型集合可以是任意的，包括完全不合理的集合，但分析仍然可以进行。这表明模型集合的选择对误差分解的分析具有重要影响。","讲者最后指出，即使模型集合不包含真实函数h*，分析仍然有效，因为所有讨论的内容都适用于不同的函数类。这表明误差分解的分析具有广泛的适用性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1362.69,"end":1522.57,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1362.69,"text":"This is different than the way we've been thinking, where just one training set comes to us. We're going to think about all the training sets that we could have produced. So we have two sources of randomness. The draw of S, that means this step here where we draw n training points. So it's going to be drawn according to some random process. And then the draw of epsilon at the test point, which is this epsilon we just discussed. Clear enough? Now, we talked about this already, but this is just to recap."},{"start":1391.87,"text":"Why is this true data point? H star, this is the true model. Remember on our quadratic, which came before? This was the fact that there existed a quadratic with exactly the right theta 1, theta 2, theta 0 that we had before. And we generated all the data. And we fit this model, H of s, on our training data s. This is what we're looking at. Now, the quantity we care about from that last thing is this expected value."},{"start":1418.34,"text":"This is the expected value over the epsilon error. This is the error that was introduced on the test point. And s, which was the draw, which produced this function. And we're going to try and decompose that error into three pieces. Please. Is there a way to assume that we have enough parameters in our points x to correctly predict y? Wonderful question."},{"start":1442.13,"text":"This universal function can't be supported. That's the case, right? Wonderful question. So the question is, can we assume, or do we have to assume for this analysis, that h actually can get to a zero-loss solution, that there exists an h which exactly fits y? We don't have to assume that to get here. We'll see where we pay for that. If, for example, we're fitting h's that are too small, they're linear, and we wanted a quadratic, we should pay for that somewhere. And you're going to see one term that we pay for that in a little bit."},{"start":1468.59,"text":"There's also going to be a separate variance term. But there's nothing here that requires, like, we could pick a completely insane set of H's here. We could still analyze it. Yeah. The true data generating process uses all the coordinates of X. So I don't know about coordinates. So it's true. OK, so one thing that you could think, which is not linked in my head, but just to make sure it's clear is,"},{"start":1497.95,"text":"The data generating process is some function h star. You could say it's only reasonable that our h of s that we have down here contains h star. So a set of all h's that we could learn should contain h star. And that would be a fairly sensible thing to do, and in most setups we'll do it. But it's actually, strictly speaking, not necessary, because it could be that h is drawn from some other function class, and we're representing it in a different way. And everything I'm going to say will also go through."}],"speech_gaps":[],"frame":"../frames/v047/009.webp","frame_time":1374.69},{"title":"数据集划分与机器学习建议","segments":[{"id":122,"text":"We'll see exactly what assumptions I need to make. Basically, what I'm going to need to make is I'm going to need to be able to analyze how H performs on the training set, and I'm going to be able to analyze the error. And let's come back and talk about it after we walk through. But there doesn't have to be an assumption that H star and H are related, or that even all of the coordinates of X. It could, for example, ignore some fraction of X, maybe the first two coordinates, and predict Y solely from that. H star is free to do kind of whatever it wants.","zh":"我们将看到我需要做出哪些假设。基本上，我需要能够分析H在训练集上的表现，以及我需要能够分析误差。我们先走过一遍再回来讨论这个问题。但并不需要假设H星和H之间有关联，甚至不需要假设X的所有坐标。例如，它可以忽略X的一部分，比如前两个坐标，仅根据这些坐标来预测Y。H星可以自由地做任何它想做的事情。","start":1523.1,"end":1547.62},{"id":123,"text":"It's true, I will say, intuitively though, although that's true, it's a weird thing to do to predict a model that can't possibly be in the class. I'm just saying there's formally, there's no reason that you have to. Okay. All right. So there are two independent sources of randomness, the training set size and then epsilon. And why are they independent? Because of the way we set up the model. We did the sample, we took the points, and we added some independent noise. So they are going to be independent. And that's really what we're going to use here. Okay.","zh":"我必须承认，虽然这是真的，但从直觉上来说，这似乎是一个奇怪的做法，去预测一个不可能属于该类别的模型。我只是说，从形式上讲，你并没有必须这么做。好的。那么有两个独立的随机源，训练集的大小和ε。为什么它们是独立的？这是因为我们模型的设置方式。我们进行了采样，选取了点，并添加了独立的噪声。因此，它们将是独立的。而这正是我们在这里要使用的内容。好的。","start":1551.12,"end":1581.52},{"id":124,"text":"H of s, it's worth saying, this is a crazy difficult random variable. Think about how complicated it is. It's the random variable that comes from, I sample an entire training set, and then I train a model on top of it. So I randomly sample points, and I train a model on top of it. For maybe a linear model, you could think what this is. You compute some inverse over the data you sampled, all the rest. You can compute that answer. It's called a fixed design problem. You can't actually go through that. But if you have some complicated neural net, whatever it is,","zh":"H of s，值得一提的是，这是一个非常困难的随机变量。想想它有多复杂。它来自于，我随机采样一个完整的训练集，然后在它上面训练一个模型。因此，我随机采样点，并在它上面训练一个模型。对于可能的线性模型，你可以思考这是什么。你计算一些数据的逆，其余部分。你可以计算出这个答案。这被称为固定设计问题。你实际上不能真正经历这个过程。但如果有一些复杂的神经网络，无论它是什么，","start":1583.07,"end":1610.69},{"id":125,"text":"This is actually a very complex variable of S,","zh":"这实际上是一个非常复杂的变量S，","start":1611.4,"end":1613.86},{"id":126,"text":"but we only need certain properties of it,","zh":"但我们只需要它的某些属性，","start":1613.98,"end":1616.26},{"id":127,"text":"and those are the ones to fixate on.","zh":"而这些属性是我们需要重点关注的。","start":1616.32,"end":1617.52},{"id":128,"text":"We only need that we can take an expectation over it,","zh":"我们只需要能够对它进行期望值的计算，","start":1617.68,"end":1620.02},{"id":129,"text":"that the expectation is well-defined in a way that I'll make precise.","zh":"并且这种期望值以我将明确的方式是良好定义的。","start":1620.04,"end":1622.42},{"id":130,"text":"The second thing is the test point.","zh":"第二件事是测试点。","start":1623.54,"end":1625.72},{"id":131,"text":"This is a very simple random variable by contrast.","zh":"这是一个非常简单的随机变量，相比之下。","start":1625.98,"end":1628.14},{"id":132,"text":"This is the one we've been dealing with for quite a bit.","zh":"这是我们一直在处理的。","start":1628.44,"end":1630.3},{"id":133,"text":"It's just that we're adding in some epsilon noise,","zh":"只是我们添加了一些 epsilon 噪声，","start":1630.68,"end":1632.76},{"id":134,"text":"some zero mean epsilon noise.","zh":"一些零均值的 epsilon 噪声。","start":1633.42,"end":1634.94},{"id":135,"text":"All right, so let's go through it.","zh":"好的，那么我们来分析一下。","start":1635.76,"end":1636.96},{"id":136,"text":"All right, so we're going to expand this function.","zh":"好的，我们将展开这个函数。","start":1638.44,"end":1640.86},{"id":137,"text":"Okay? This is just expanding the definition of y.","zh":"明白了吗？这仅仅是展开 y 的定义。","start":1641.34,"end":1644.36},{"id":138,"text":"And now we're going to expand the square. Oh, please.","zh":"现在我们要展开这个平方。哦，烦死了。","start":1647.06,"end":1648.98},{"id":139,"text":".","zh":":","start":1650.06,"end":1650.44},{"id":140,"text":"You said that H of S is like a very complicated function, but like S is like something which","zh":"你说H of S就像是一个非常复杂的函数，但S就像是从整个数据集中随机采样得到的，然后这基本上捕捉到了数据的一个有限表示。","start":1651.52,"end":1657.36},{"id":141,"text":"is like randomly sampling from the entire set, and then that basically captures like","zh":"所以H of S不应该也是一个类似的函数吗？","start":1657.36,"end":1664.0},{"id":142,"text":"a limited representation of the data.","zh":"是的，这样你让它相对安全一些。","start":1664.0,"end":1665.2},{"id":143,"text":"So shouldn't H of S be like a similar function?","zh":"这是一个非常好的问题。","start":1665.3,"end":1668.18},{"id":144,"text":"Yeah, so you're making it relatively safe.","zh":"它是一个非常好的问题。","start":1669.36,"end":1671.02},{"id":145,"text":"It's a great question.","zh":"这是一个非常好的问题。","start":1671.02,"end":1671.58},{"id":146,"text":"So when I say it's complicated, the way that H is defined is as the result of a procedure","zh":"所以当我提到它很复杂时，H 的定义方式是通过一个过程的结果","start":1671.82,"end":1678.68},{"id":147,"text":"which makes it difficult to analyze. And it's exactly the procedure you said. I've sampled","zh":"这使得分析变得困难。而这正是你所说的那个过程。我采样了一些函数 s。然后我取了那个点。也许我有十亿个点。我在这个数据集上运行了一些非常复杂的 SGD、LBFGS 或其他算法","start":1678.68,"end":1682.86},{"id":148,"text":"some function s. I've then taken that point. Maybe it's a billion points that I have. I run","zh":"并产生了我的最终估计函数。我的观点是，除非你执行我刚才说的那个例子并能够计算，例如，它的期望值","start":1682.86,"end":1687.58},{"id":149,"text":"some very complicated SGD, LBFGS, whatever algorithm on it. And I've produced the function","zh":"否则你很难写出 H 的具体形式","start":1687.58,"end":1693.44},{"id":150,"text":"that's my final estimate. And my point is that h would be very difficult for you to write down","zh":"而我的观点是，除非你执行我刚才说的那个例子并能够计算，例如，它的期望值","start":1693.44,"end":1698.34},{"id":151,"text":"without performing the example I just said and being able to compute, say, its expectation,","zh":"在没有执行我刚才所说的例子并能够计算，例如，其期望值的情况下,","start":1698.34,"end":1703.06}],"notes":["本段讨论了机器学习中关于假设和模型分析的问题。讲者指出，H（假设空间）和H星（最优模型）之间不需要有关系，甚至不需要使用所有特征。例如，模型可以忽略部分特征，仅基于部分特征进行预测。这说明了模型的灵活性和假设空间的定义。","讲者提到，训练集大小和epsilon（测试误差）是两个独立的随机源。这是因为模型的构建方式：我们从数据中采样，然后添加独立的噪声。这种独立性是分析模型性能的重要基础。","H of S（基于训练集的模型）是一个非常复杂的随机变量，因为它涉及从数据中采样并训练模型的过程。对于简单的模型（如线性模型），可以计算其逆，但对于复杂的模型（如神经网络），则难以直接写出其表达式。","讲者强调，我们只需要关注H of S的某些性质，例如期望值的定义。这表明在分析模型时，不需要完全理解其复杂性，而是关注关键的统计特性。","测试点是一个相对简单的随机变量，它仅涉及添加零均值的噪声。这与训练集的复杂性形成对比，说明了测试误差的来源。","讲者通过一个例子说明了H的复杂性：从数据中采样，运行复杂的优化算法（如SGD或LBFGS），最终得到一个难以直接写出的模型。这强调了模型训练过程的随机性和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1523.1,"end":1703.06,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":1523.1,"text":"We'll see exactly what assumptions I need to make. Basically, what I'm going to need to make is I'm going to need to be able to analyze how H performs on the training set, and I'm going to be able to analyze the error. And let's come back and talk about it after we walk through. But there doesn't have to be an assumption that H star and H are related, or that even all of the coordinates of X. It could, for example, ignore some fraction of X, maybe the first two coordinates, and predict Y solely from that. H star is free to do kind of whatever it wants."},{"start":1551.12,"text":"It's true, I will say, intuitively though, although that's true, it's a weird thing to do to predict a model that can't possibly be in the class. I'm just saying there's formally, there's no reason that you have to. Okay. All right. So there are two independent sources of randomness, the training set size and then epsilon. And why are they independent? Because of the way we set up the model. We did the sample, we took the points, and we added some independent noise. So they are going to be independent. And that's really what we're going to use here. Okay."},{"start":1583.07,"text":"H of s, it's worth saying, this is a crazy difficult random variable. Think about how complicated it is. It's the random variable that comes from, I sample an entire training set, and then I train a model on top of it. So I randomly sample points, and I train a model on top of it. For maybe a linear model, you could think what this is. You compute some inverse over the data you sampled, all the rest. You can compute that answer. It's called a fixed design problem. You can't actually go through that. But if you have some complicated neural net, whatever it is,"},{"start":1611.4,"text":"This is actually a very complex variable of S,"},{"start":1613.98,"text":"but we only need certain properties of it,"},{"start":1616.32,"text":"and those are the ones to fixate on."},{"start":1617.68,"text":"We only need that we can take an expectation over it,"},{"start":1620.04,"text":"that the expectation is well-defined in a way that I'll make precise."},{"start":1623.54,"text":"The second thing is the test point."},{"start":1625.98,"text":"This is a very simple random variable by contrast."},{"start":1628.44,"text":"This is the one we've been dealing with for quite a bit."},{"start":1630.68,"text":"It's just that we're adding in some epsilon noise,"},{"start":1633.42,"text":"some zero mean epsilon noise."},{"start":1635.76,"text":"All right, so let's go through it."},{"start":1638.44,"text":"All right, so we're going to expand this function."},{"start":1641.34,"text":"Okay? This is just expanding the definition of y."},{"start":1647.06,"text":"And now we're going to expand the square. Oh, please."},{"start":1650.06,"text":"."},{"start":1651.52,"text":"You said that H of S is like a very complicated function, but like S is like something which"},{"start":1657.36,"text":"is like randomly sampling from the entire set, and then that basically captures like"},{"start":1664.0,"text":"a limited representation of the data."},{"start":1665.3,"text":"So shouldn't H of S be like a similar function?"},{"start":1669.36,"text":"Yeah, so you're making it relatively safe."},{"start":1671.02,"text":"It's a great question."},{"start":1671.82,"text":"So when I say it's complicated, the way that H is defined is as the result of a procedure"},{"start":1678.68,"text":"which makes it difficult to analyze. And it's exactly the procedure you said. I've sampled"},{"start":1682.86,"text":"some function s. I've then taken that point. Maybe it's a billion points that I have. I run"},{"start":1687.58,"text":"some very complicated SGD, LBFGS, whatever algorithm on it. And I've produced the function"},{"start":1693.44,"text":"that's my final estimate. And my point is that h would be very difficult for you to write down"},{"start":1698.34,"text":"without performing the example I just said and being able to compute, say, its expectation,"}],"speech_gaps":[],"frame":"../frames/v047/010.webp","frame_time":1535.1},{"title":"数据集划分与机器学习建议","segments":[{"id":152,"text":"its variance, all the rest of it. So I'm saying it's a complicated variable. In contrast,","zh":"它的方差，其余部分都是如此。因此，我在说这是一个复杂的变量。相比之下，","start":1703.28,"end":1707.44},{"id":153,"text":"Epsilon, just a normal random variable. We know almost everything about it by assumption. That","zh":"epsilon，只是一个普通的随机变量。我们几乎知道它的一切，这是假设的。那","start":1707.44,"end":1711.6},{"id":154,"text":"was the contrast I was making. Please. So Epsilon is going to be, again, great question. So what is","zh":"就是我刚才想对比的。请。所以epsilon是什么？epsilon又是一个好问题。所以什么是","start":1711.6,"end":1719.88},{"id":155,"text":"Epsilon? Epsilon is going to be this character right here, which is the noise that's introduced","zh":"epsilon？epsilon就是这里这个符号，它是被引入到每个数据点上的噪声。因此，我们建立模型的方式是所有数据都是根据这个过程生成的。","start":1719.88,"end":1724.04},{"id":156,"text":"on every point. So the way we set up our model is all data is generated according to this process.","zh":"训练集和测试集都是根据这个过程生成的。而且这个epsilon恰好是我为那个测试点所选的epsilon。是的，非常好的问题。","start":1724.04,"end":1728.86},{"id":157,"text":"Both train and test are generated with this process. And that Epsilon happens to be the","zh":"那么你为什么需要这种对称性，而不是像epsilon这样的？","start":1729.04,"end":1732.84},{"id":158,"text":"Epsilon that I picked for that test point. Yeah, wonderful question.","zh":"我为那个测试点选择的epsilon。是的，非常好的问题。","start":1732.84,"end":1735.84},{"id":159,"text":"So why do you need this symmetry and not like epsilon?","zh":"为什么你需要这种对称性，而不是像epsilon这样的？","start":1737.44,"end":1739.56},{"id":160,"text":"Why can't you just run inference without error?","zh":"为什么不能在没有误差的情况下进行推理？","start":1739.72,"end":1741.46},{"id":161,"text":"So you could.","zh":"所以你可以这样做。","start":1742.4,"end":1743.7},{"id":162,"text":"I mean, you could just set this to 0 if you wanted,","zh":"我的意思是，如果你想的话，你可以把这个设为0，","start":1743.9,"end":1745.8},{"id":163,"text":"but then you would have a less expressive model.","zh":"但这样你会得到一个表达能力较低的模型。","start":1745.96,"end":1747.46},{"id":164,"text":"But that's also the other bit that we've talked about here","zh":"但这也是我们在这里讨论的另一个方面，","start":1747.82,"end":1749.84},{"id":165,"text":"is you don't get rid of measurement error at test time.","zh":"就是在测试时你无法消除测量误差。","start":1749.84,"end":1752.26},{"id":166,"text":"So the point that was like, what does epsilon actually capture?","zh":"所以问题在于，epsilon实际上捕捉了什么？","start":1752.74,"end":1755.58},{"id":167,"text":"If you had something that captured absolutely","zh":"如果你有一个能够完全捕捉","start":1755.82,"end":1757.9},{"id":168,"text":"every element of your domain, then","zh":"你领域中的每一个元素，那么","start":1757.9,"end":1759.72},{"id":169,"text":"it would be appropriate to set epsilon equal to 0.","zh":"将 epsilon 设置为 0 是合适的。","start":1759.72,"end":1761.64},{"id":170,"text":"But if you have any of the settings","zh":"但如果你有任何我们讨论过的设置","start":1761.86,"end":1763.36},{"id":171,"text":"that we've talked about, you have measurement error","zh":"你有传感器中的测量误差，","start":1763.36,"end":1764.94},{"id":172,"text":"in a sensor, or you have some bit","zh":"或者你有一些微小的偏差，或者有一些测量的延迟，无论是什么，所有这些情况","start":1764.94,"end":1766.78},{"id":173,"text":"of little bias that's done or some lag in the measurement whatever it is all those things are","zh":"都大致被归入存在一定程度的测量误差或损失，因此","start":1766.78,"end":1771.34},{"id":174,"text":"kind of generally thrown into there's some amount of measurement error or loss then and that's why","zh":"我们这样设置，所以让这两个过程相同，并且具有相同的误差量","start":1771.34,"end":1775.46},{"id":175,"text":"we set this up and so having these two processes be the same and have the same amount of errors","zh":"我们这样设置，因此让这两个过程相同，并且具有相同的错误数量","start":1775.46,"end":1780.52},{"id":176,"text":"um you know you don't strictly speaking need to do it but it certainly makes things a lot easier","zh":"嗯，你知道，严格来说你不需要这么做，但这样做确实会让事情容易很多","start":1780.52,"end":1785.0},{"id":177,"text":"but you i would say the part that i would object to is the test data is also messy it's not some","zh":"但我会反对的是测试数据也是混乱的，它并不是一些","start":1785.46,"end":1791.28},{"id":178,"text":"things you want to do and if you want to figure out what happens when epsilon goes to zero just","zh":"你想要做的事情，如果你想弄清楚当 epsilon 趋近于零时会发生什么，就","start":1791.28,"end":1794.68},{"id":179,"text":"Just set the variance to 0 in the next thing.","zh":"在下一步中将方差设为 0。","start":1794.68,"end":1796.42},{"id":180,"text":"It will fall out pretty cleanly.","zh":"它会很干净地出现出来。","start":1796.52,"end":1797.96},{"id":181,"text":"Please.","zh":"请。","start":1798.84,"end":1799.28},{"id":182,"text":"similar, like,","zh":"类似地，","start":1800.24,"end":1801.72},{"id":183,"text":"why do we need epsilon to be having this boundary","zh":"我们为什么需要 epsilon 具有这个边界","start":1802.22,"end":1806.38},{"id":184,"text":"?","start":1806.38,"end":1806.76},{"id":185,"text":"Or is that not represented?","start":1808.4,"end":1809.94},{"id":186,"text":"Yeah, wonderful question.","start":1810.36,"end":1811.1},{"id":187,"text":"So the question is, why do we have two sources of randomness","start":1811.38,"end":1813.98},{"id":188,"text":"here, and what are they doing?","start":1813.98,"end":1815.1},{"id":189,"text":"One is about selecting the points, the endpoints","start":1815.48,"end":1818.04},{"id":190,"text":"that we're going to train on.","start":1818.04,"end":1819.14},{"id":191,"text":"That is one bit of randomness that we're going to analyze.","start":1819.36,"end":1821.7},{"id":192,"text":"Those points are brought in.","start":1821.84,"end":1822.94},{"id":193,"text":"They have the Xs and the Ys and all that data that's there.","start":1822.94,"end":1826.68},{"id":194,"text":"And then we're going to train on that point.","start":1826.8,"end":1828.06},{"id":195,"text":"The reason, conceptually, we want to then have a test error,","start":1828.3,"end":1830.8},{"id":196,"text":"which is at test time, we've selected a new point.","start":1830.88,"end":1832.62},{"id":197,"text":"And that point also has errors.","start":1832.72,"end":1834.16},{"id":198,"text":"We want to be clear that there are things going on at train set and test set that are different.","start":1834.36,"end":1838.52},{"id":199,"text":"And that, in fact, when we look across them,","start":1838.7,"end":1841.02},{"id":200,"text":"we want to understand what the effects of those two errors are.","start":1841.48,"end":1844.12},{"id":201,"text":"Some of those errors, as we'll talk about in just one second,","start":1844.28,"end":1846.62},{"id":202,"text":"are intrinsic to the test set.","start":1846.78,"end":1848.18},{"id":203,"text":"There are some things that you just can't do better than","start":1848.4,"end":1850.64},{"id":204,"text":"because your test set has measurement error.","start":1850.64,"end":1852.46},{"id":205,"text":"there. That will fall out from the analysis we do here. But there's no way that the training","start":1852.46,"end":1856.4},{"id":206,"text":"set, it's not like we want the training set to be random. This is the model. The model","start":1856.4,"end":1861.06},{"id":207,"text":"is that the data is produced according to a random process, and that's what we're analyzing.","start":1861.06,"end":1865.42}],"notes":["本段讨论了机器学习中数据集划分和模型构建的基本概念，特别是关于噪声（epsilon）的引入及其在训练集和测试集中的作用。讲者强调了epsilon作为模型中引入的随机噪声，用于模拟数据生成过程中的测量误差，这在实际应用中是不可避免的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1703.28,"end":1865.42,"asr_flags":[],"boards":[],"translation_complete":false,"translated_segments":32,"raw_segments":[{"start":1703.28,"text":"its variance, all the rest of it. So I'm saying it's a complicated variable. In contrast,"},{"start":1707.44,"text":"Epsilon, just a normal random variable. We know almost everything about it by assumption. That"},{"start":1711.6,"text":"was the contrast I was making. Please. So Epsilon is going to be, again, great question. So what is"},{"start":1719.88,"text":"Epsilon? Epsilon is going to be this character right here, which is the noise that's introduced"},{"start":1724.04,"text":"on every point. So the way we set up our model is all data is generated according to this process."},{"start":1729.04,"text":"Both train and test are generated with this process. And that Epsilon happens to be the"},{"start":1732.84,"text":"Epsilon that I picked for that test point. Yeah, wonderful question."},{"start":1737.44,"text":"So why do you need this symmetry and not like epsilon?"},{"start":1739.72,"text":"Why can't you just run inference without error?"},{"start":1742.4,"text":"So you could."},{"start":1743.9,"text":"I mean, you could just set this to 0 if you wanted,"},{"start":1745.96,"text":"but then you would have a less expressive model."},{"start":1747.82,"text":"But that's also the other bit that we've talked about here"},{"start":1749.84,"text":"is you don't get rid of measurement error at test time."},{"start":1752.74,"text":"So the point that was like, what does epsilon actually capture?"},{"start":1755.82,"text":"If you had something that captured absolutely"},{"start":1757.9,"text":"every element of your domain, then"},{"start":1759.72,"text":"it would be appropriate to set epsilon equal to 0."},{"start":1761.86,"text":"But if you have any of the settings"},{"start":1763.36,"text":"that we've talked about, you have measurement error"},{"start":1764.94,"text":"in a sensor, or you have some bit"},{"start":1766.78,"text":"of little bias that's done or some lag in the measurement whatever it is all those things are"},{"start":1771.34,"text":"kind of generally thrown into there's some amount of measurement error or loss then and that's why"},{"start":1775.46,"text":"we set this up and so having these two processes be the same and have the same amount of errors"},{"start":1780.52,"text":"um you know you don't strictly speaking need to do it but it certainly makes things a lot easier"},{"start":1785.46,"text":"but you i would say the part that i would object to is the test data is also messy it's not some"},{"start":1791.28,"text":"things you want to do and if you want to figure out what happens when epsilon goes to zero just"},{"start":1794.68,"text":"Just set the variance to 0 in the next thing."},{"start":1796.52,"text":"It will fall out pretty cleanly."},{"start":1798.84,"text":"Please."},{"start":1800.24,"text":"similar, like,"},{"start":1802.22,"text":"why do we need epsilon to be having this boundary"},{"start":1806.38,"text":"?"},{"start":1808.4,"text":"Or is that not represented?"},{"start":1810.36,"text":"Yeah, wonderful question."},{"start":1811.38,"text":"So the question is, why do we have two sources of randomness"},{"start":1813.98,"text":"here, and what are they doing?"},{"start":1815.48,"text":"One is about selecting the points, the endpoints"},{"start":1818.04,"text":"that we're going to train on."},{"start":1819.36,"text":"That is one bit of randomness that we're going to analyze."},{"start":1821.84,"text":"Those points are brought in."},{"start":1822.94,"text":"They have the Xs and the Ys and all that data that's there."},{"start":1826.8,"text":"And then we're going to train on that point."},{"start":1828.3,"text":"The reason, conceptually, we want to then have a test error,"},{"start":1830.88,"text":"which is at test time, we've selected a new point."},{"start":1832.72,"text":"And that point also has errors."},{"start":1834.36,"text":"We want to be clear that there are things going on at train set and test set that are different."},{"start":1838.7,"text":"And that, in fact, when we look across them,"},{"start":1841.48,"text":"we want to understand what the effects of those two errors are."},{"start":1844.28,"text":"Some of those errors, as we'll talk about in just one second,"},{"start":1846.78,"text":"are intrinsic to the test set."},{"start":1848.4,"text":"There are some things that you just can't do better than"},{"start":1850.64,"text":"because your test set has measurement error."},{"start":1852.46,"text":"there. That will fall out from the analysis we do here. But there's no way that the training"},{"start":1856.4,"text":"set, it's not like we want the training set to be random. This is the model. The model"},{"start":1861.06,"text":"is that the data is produced according to a random process, and that's what we're analyzing."}],"speech_gaps":[],"frame":"../frames/v047/011.webp","frame_time":1715.28},{"title":"数据集划分与机器学习建议","segments":[{"id":208,"text":"So it's not something where we're saying, oh, we have some randomness, so we're good. It's just this is the way we've modeled the universe. This is the standard model that we've talked about in the course. And this is to capture, this epsilon is to capture different sources of errors. Some of those errors are measurement time. You can think about, maybe most cleanly, as measurement at train set.","zh":"所以这不是我们说因为我们有一些随机性，所以我们做得很好的事情。这只是我们对宇宙建模的方式。这是我们在这门课中讨论的标准模型。这个epsilon是用来捕捉不同来源的误差的。其中一些误差是测量误差。你可以把它最清晰地想象为训练集上的测量。","start":1867.66,"end":1886.28},{"id":209,"text":"and some of those are at test set. The test set randomness also buries this fact that by selecting a subset of points, that complicated training procedure that we're running could fit them. So imagine I had an extremely bad draw from S, just to think about why forgetting. Imagine epsilon is 0. If I just picked the same point again and again and again, I couldn't fit a line.","zh":"其中一些误差是在测试集上。测试集的随机性也隐藏了这样一个事实：通过选择数据点的子集，我们运行的复杂训练过程可能会拟合这些点。想象一下，我从S中抽到了一个极其糟糕的样本，只是为了思考为什么忘记。想象epsilon是0。如果我反复选择同一个点，我就无法拟合一条直线。","start":1886.96,"end":1907.7},{"id":210,"text":"Even the simplest model, right? I would just have that one point. So clearly something interesting has to happen inside X. I have to get enough data to be able to fit my model. So my point is that's what's going on inside the training set underneath the covers. Great questions. Are there more? Please keep asking. All right. All right. So let's expand. So when we do this here, what we've done is we've substituted out at Y and we've looked at the squares.","zh":"即使是最简单的模型，对吧？我只会有一个点。显然，有一些有趣的事情发生在X里面。我必须获得足够的数据来拟合我的模型。所以我的观点是，这正是训练集下面发生的事情。很好的问题。还有更多吗？请继续提问。好的。好的。那么让我们扩展一下。当我们在这里这样做时，我们所做的就是替换了Y，并查看了平方项。","start":1908.08,"end":1938.58},{"id":211,"text":"And when we look at the squares, we see two things. One is we see this term that comes out when we expand the squares as sigma squared. This is exactly that test error we were just talking about. This is the error that's intrinsic inside. I think it's the next one. This is the unavoidable error. So this is the error that's just in the data. If you collected the data with perfect measurement and accuracy,","zh":"当我们查看平方项时，我们会看到两件事。一个是当我们展开平方项时出现的项，即sigma平方。这正是我们刚刚讨论的测试误差。这是数据内部的固有误差。我认为这是下一个。这是不可避免的误差。这是数据本身的误差。如果你以完美的测量和准确性收集了数据，","start":1939.18,"end":1960.94},{"id":212,"text":"This could be zero. If it has any error in how you've measured it, or it's lagged, or whatever else you're measuring, this is just the error that's going to be completely unavoidable. And that's coming from this term here. The second error here, if you look, let's look at this. The last term is going to be zero. Now, why is the last term zero? That's because epsilon is mean zero, and it's independent from H of S.","zh":"这可以是零。如果你在测量过程中有任何误差，或者数据滞后，或者其他任何你测量的内容，这仅仅是完全不可避免的误差。它来自于这里的项。这里的第二个误差，如果你看一下，最后一项将是零。现在，为什么最后一项是零？这是因为epsilon的均值为零，并且它与H of S独立。","start":1961.66,"end":1987.88},{"id":213,"text":"So the test error, when we do this decomposition, that error selection, whatever epsilon's value is, doesn't depend in any way on the training points. So those two are going to be zero, and that's going to cancel a cross term. And now we are looking at how far away is the true model from the one we train on an expected S. We're going to decompose that further. So it's basically sigma squared, this noise, plus the expected prediction gap between H star and S. And so if you wanted to set sigma equal to zero, well,","zh":"因此，当我们进行这种分解时，这个测试误差，无论epsilon的值如何，都不依赖于训练点。因此，这两个项将为零，并且会抵消交叉项。现在我们关注的是，真正的模型与我们在期望S上训练的模型之间的差距有多大。我们将进一步分解这一点。这基本上是噪声的方差，加上H星与S之间的期望预测差距。因此，如果你想让sigma等于零，那么","start":1988.57,"end":2017.67}],"notes":["本段讨论了机器学习中误差的来源，包括训练集和测试集的随机性。误差被分为三类：测量误差、模型拟合误差和数据固有误差。测量误差是由于数据收集过程中的不准确，而模型拟合误差是由于训练过程对数据的拟合能力不足。数据固有误差是无法避免的，即使数据完全准确，仍然存在误差。","讲者通过一个例子说明了为什么需要足够的数据来拟合模型。如果数据集中的点过于集中，模型可能无法正确拟合，因此需要足够的数据来捕捉数据的分布特征。","在讨论误差分解时，讲者提到测试误差可以分解为噪声项和模型预测误差。噪声项是数据固有的误差，而模型预测误差是由于模型与真实模型之间的差距。","讲者进一步解释了为什么最后一个项为零，因为误差项ε的均值为零，并且与模型H(S)独立。这说明测试误差与训练数据无关，因此可以独立分析。","最后，讲者提到测试误差可以分解为噪声项和模型预测误差，并指出如果噪声项为零，那么测试误差完全由模型预测误差决定。","整个段落强调了误差分解的重要性，以及如何通过分析不同误差来源来改进模型性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1867.66,"end":2017.67,"asr_flags":[],"math_clarifications":["测试误差通常分解为噪声和模型偏差（或方差）的总和，而不是三者之和。原始公式中的三者之和是不准确的，因此需要移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1867.66,"text":"So it's not something where we're saying, oh, we have some randomness, so we're good. It's just this is the way we've modeled the universe. This is the standard model that we've talked about in the course. And this is to capture, this epsilon is to capture different sources of errors. Some of those errors are measurement time. You can think about, maybe most cleanly, as measurement at train set."},{"start":1886.96,"text":"and some of those are at test set. The test set randomness also buries this fact that by selecting a subset of points, that complicated training procedure that we're running could fit them. So imagine I had an extremely bad draw from S, just to think about why forgetting. Imagine epsilon is 0. If I just picked the same point again and again and again, I couldn't fit a line."},{"start":1908.08,"text":"Even the simplest model, right? I would just have that one point. So clearly something interesting has to happen inside X. I have to get enough data to be able to fit my model. So my point is that's what's going on inside the training set underneath the covers. Great questions. Are there more? Please keep asking. All right. All right. So let's expand. So when we do this here, what we've done is we've substituted out at Y and we've looked at the squares."},{"start":1939.18,"text":"And when we look at the squares, we see two things. One is we see this term that comes out when we expand the squares as sigma squared. This is exactly that test error we were just talking about. This is the error that's intrinsic inside. I think it's the next one. This is the unavoidable error. So this is the error that's just in the data. If you collected the data with perfect measurement and accuracy,"},{"start":1961.66,"text":"This could be zero. If it has any error in how you've measured it, or it's lagged, or whatever else you're measuring, this is just the error that's going to be completely unavoidable. And that's coming from this term here. The second error here, if you look, let's look at this. The last term is going to be zero. Now, why is the last term zero? That's because epsilon is mean zero, and it's independent from H of S."},{"start":1988.57,"text":"So the test error, when we do this decomposition, that error selection, whatever epsilon's value is, doesn't depend in any way on the training points. So those two are going to be zero, and that's going to cancel a cross term. And now we are looking at how far away is the true model from the one we train on an expected S. We're going to decompose that further. So it's basically sigma squared, this noise, plus the expected prediction gap between H star and S. And so if you wanted to set sigma equal to zero, well,"}],"speech_gaps":[],"frame":"../frames/v047/012.webp","frame_time":1879.66},{"title":"数据集划分与机器学习建议","segments":[{"id":214,"text":"You would have this guy 0 and this guy 0 anyway. But this would be the new term that you would have. So now we're going to analyze this. All right. So we're going to define the long-run average prediction at x in the following way. We're going to think about, and this is what I said, we have one property of the random variable. h of average of x is going to be exactly this variable underneath the covers. And what it's going to do is it's going to sample some s, say that it's going to sample conceptually all the data sets of size 1,000. And then it's going to fit.","zh":"你无论如何都会拥有这个0和这个0。但这里会出现一个新的项。现在我们将分析这个。好的，我们将以以下方式定义x的长期平均预测。我们将考虑，正如我所说，随机变量的一个属性。h的平均值在底层实际上是这个变量。它所做的就是抽样一些s，概念上抽样所有大小为1,000的数据集，然后进行拟合。","start":2018.4,"end":2050.2},{"id":215,"text":"the hypothesis and we're going to worry about what that average hypothesis averaged all the datasets would actually be. I want to emphasize, this is a very complicated random variable. We just need to know that it exists. We're going to write h bar as h average here and h of s of x in this way. This is going to allow us to write this decomposition here.","zh":"假设，并且我们将关注这个平均假设在所有数据集上的实际表现。我想强调，这是一个非常复杂的随机变量。我们只需要知道它存在即可。我们将在这里将h bar写成h average，并以这种方式写成h of s of x。这将允许我们写出这里的分解。","start":2050.72,"end":2080.28},{"id":216,"text":"inside the square. So we're going to take H star and we're going to look at the long run average version and we're going to look at H bar versus H . The reason we do that decomposition is this term here is going to be zero because this is the expected value of this guy under S. So this is equal to zero. This is just definitional.","zh":"在平方内部。我们将取H star，并查看其长期平均版本，我们将比较H bar与H。我们进行这种分解的原因是这里的项将为零，因为这是在S下该变量的期望值。因此，这等于零。这只是定义上的结果。","start":2081.02,"end":2105.35},{"id":217,"text":"Now, that leaves us with the fairly famous set of terms, bias and variance. And these are related exactly to what we talked about before. This is a mathematically precise way to say if h bar is away from the long-run average of what you would train, no matter which h you pick, whatever it is, there's just no matter the amount of data you feed me, I'm going to have bias. That's what this term is, this bias squared. This term variance, this depends on the long-run average.","zh":"现在，这留下了我们非常熟悉的项，偏差和方差。这些与我们之前讨论的内容完全相关。这是数学上精确的说法：如果h bar远离你训练的长期平均值，无论你选择哪个h，无论你给我多少数据，我都会有偏差。这就是这个项，偏差的平方。这个项方差，它取决于长期平均值。","start":2107.38,"end":2135.83},{"id":218,"text":"and only the h of s I've picked, the data set I've picked. This is the part that's jumping around as I go from higher to higher degree polynomials. This basically says, this is how I can think about the errors. I look at this error and I have a noise term, a bias term, and a variance term.","zh":"并且只取决于我选择的h of s和数据集。这是我在从更高次多项式转向更高次多项式时波动的部分。这基本上说明了我可以如何思考这些误差。我查看这个误差，并且有噪声项、偏差项和方差项。","start":2136.53,"end":2156.61},{"id":219,"text":"And all the errors break down. And this decomposition is quite powerful to think about how we're going to do this because how can we reduce each one of them? Well, we motivated it in the setting where we had just polynomials. But now this applies to almost every prediction class. It's a large class of functions. So the bias is how far the average prediction is from the truth. And that's a property of the model class. But the sample that we pick from training doesn't enter in anywhere. That's just like you can't fit a parabola with a line.","zh":"所有的误差都会分解。这种分解对于思考我们该如何处理这些问题非常有帮助，因为我们可以如何减少每一个误差呢？我们最初是在多项式的情况下进行动机分析的，但现在这种分解几乎适用于每一个预测类别。这是一个很大的函数类。偏差是指平均预测值与真实值之间的差距，这是模型类的属性。但是我们从训练集中选取的样本并不会影响这一点。这就像你无法用一条直线拟合一个抛物线。","start":2157.46,"end":2183.96}],"notes":["本段讲解了机器学习中误差分解的概念，即误差可以分解为偏差（bias）和方差（variance）以及噪声（noise）三个部分。偏差是指平均预测值与真实值之间的差距，而方差是指预测值在不同数据集上的波动程度。噪声则是数据本身的随机性。这种分解有助于理解模型的性能，并指导如何优化模型。","讲者强调，偏差是模型类别的属性，与训练数据无关。这意味着，即使使用不同的训练数据集，偏差仍然存在。而方差则依赖于所选的模型和数据集，因此可以通过调整模型复杂度或增加数据量来减少方差。","讲者提到，这种误差分解适用于几乎所有的预测类，而不仅仅是多项式回归。这表明，误差分解是一种通用的分析工具，可以用于评估和改进各种机器学习模型。","讲者指出，偏差和方差的平衡是模型选择的关键。如果模型过于简单，偏差会很高；如果模型过于复杂，方差会很高。因此，需要在偏差和方差之间找到一个合适的平衡点。","讲者通过多项式回归的例子说明了偏差和方差的概念。例如，使用高次多项式可能会导致方差过高，而使用低次多项式可能会导致偏差过高。","最后，讲者指出，误差分解可以帮助我们理解模型的性能，并指导如何改进模型。例如，可以通过增加数据量来减少方差，或者通过调整模型复杂度来减少偏差。"],"formulas":[],"uncertainties":["h of average of x"],"diagram":"none","start":2018.4,"end":2183.96,"asr_flags":[],"math_clarifications":["原始片段中未提供足够的数学公式或上下文来验证这些公式，因此无法确定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2018.4,"text":"You would have this guy 0 and this guy 0 anyway. But this would be the new term that you would have. So now we're going to analyze this. All right. So we're going to define the long-run average prediction at x in the following way. We're going to think about, and this is what I said, we have one property of the random variable. h of average of x is going to be exactly this variable underneath the covers. And what it's going to do is it's going to sample some s, say that it's going to sample conceptually all the data sets of size 1,000. And then it's going to fit."},{"start":2050.72,"text":"the hypothesis and we're going to worry about what that average hypothesis averaged all the datasets would actually be. I want to emphasize, this is a very complicated random variable. We just need to know that it exists. We're going to write h bar as h average here and h of s of x in this way. This is going to allow us to write this decomposition here."},{"start":2081.02,"text":"inside the square. So we're going to take H star and we're going to look at the long run average version and we're going to look at H bar versus H . The reason we do that decomposition is this term here is going to be zero because this is the expected value of this guy under S. So this is equal to zero. This is just definitional."},{"start":2107.38,"text":"Now, that leaves us with the fairly famous set of terms, bias and variance. And these are related exactly to what we talked about before. This is a mathematically precise way to say if h bar is away from the long-run average of what you would train, no matter which h you pick, whatever it is, there's just no matter the amount of data you feed me, I'm going to have bias. That's what this term is, this bias squared. This term variance, this depends on the long-run average."},{"start":2136.53,"text":"and only the h of s I've picked, the data set I've picked. This is the part that's jumping around as I go from higher to higher degree polynomials. This basically says, this is how I can think about the errors. I look at this error and I have a noise term, a bias term, and a variance term."},{"start":2157.46,"text":"And all the errors break down. And this decomposition is quite powerful to think about how we're going to do this because how can we reduce each one of them? Well, we motivated it in the setting where we had just polynomials. But now this applies to almost every prediction class. It's a large class of functions. So the bias is how far the average prediction is from the truth. And that's a property of the model class. But the sample that we pick from training doesn't enter in anywhere. That's just like you can't fit a parabola with a lie."}],"speech_gaps":[],"frame":"../frames/v047/013.webp","frame_time":2030.4},{"title":"数据集划分与机器学习建议","segments":[{"id":220,"text":"That's intuitively what's going on in that term. The variance is how much the prediction jumps around. Maybe you have a super expressive model, but it's not stable. And we're going to look at terms to reduce that variance later. So one approach would be you could take a small model, fit it if it fails, fit a larger model, fit a larger model, and do that. The other is, and we'll talk about later, you could fit a large model and somehow regularize it, which means reduce its variance, as we'll see in a second.","zh":"这正是那个术语所直观表达的内容。方差表示预测值的波动程度。也许你有一个非常强大的模型，但它并不稳定。我们之后会看到一些术语来减少这种方差。因此，一种方法是你可以先使用一个小模型，如果它失败了，再使用一个更大的模型，继续拟合更大的模型，以此类推。另一种方法是，我们之后会讨论，你可以拟合一个大模型，并通过某种方式对其进行正则化，这意味着减少其方差，正如我们稍后会看到的那样。","start":2184.92,"end":2212.3},{"id":221,"text":"so that it doesn't jump around so much. And that should intuitively make the models better. And better means they generalize better at test time. That's what we care about. So this error goes down. Please. The analysis we're doing is just for regressors, right? Right. So the analysis that we did here is just for regressors. This is the standard presentation of it. What I asserted without proof is that effectively the same decomposition","zh":"这样它就不会波动那么大。这应该直观地使模型更好。更好意味着它们在测试时具有更好的泛化能力。这是我们关心的。因此，这个误差会下降。请记住。我们进行的分析只是针对回归器的，对吧？对的。因此，我们在这里进行的分析只是针对回归器的。这是该主题的标准呈现方式。我未经证明地断言的是，当你进行分类或其他模型时，同样的分解也适用。我向你们展示这一点的原因是，这在机器学习中是标准做法。你读论文或其他资料时，会经常听到人们谈论偏差-方差分解或偏差-方差结果。它基本上是将两种效应分开：一种是基于模型类别的效应，另一种是基于数据样本的效应。这种分解在各个地方都会出现。我们只是针对回归进行了这种分解。","start":2212.83,"end":2237.19},{"id":222,"text":"holds when you do things like classification or other models. And the reason I show this to you is this is like canon for machine learning. You will constantly hear people talk about, if you read papers or other things, bias-variance decomposition or a bias-variance result. And it basically is separating out the two effects, one effect that's based on the model class and one effect that's based on how the sample was for the data. And this kind of decomposition happens everywhere. We happen to do it just for regression.","zh":"这在你进行分类或其他模型时成立。我向你们展示这个的原因是，这在机器学习中就像一个准则。你们会经常听到人们谈论，如果你阅读论文或其他内容，偏差-方差分解或偏差-方差结果。它基本上是将两个效应分开，一个是基于模型类别的效应，另一个是基于数据样本如何选取的效应。这种分解在各个地方都会发生。我们只是恰好将其用于回归。","start":2237.92,"end":2262.98},{"id":223,"text":"just for L2 regression, with a normal added is all we did. Please.","zh":"仅仅是针对L2回归，加上一个正态分布就是我们所做的一切。请。","start":2264.19,"end":2269.83},{"id":224,"text":"If you think about it, it makes your head hurt a little bit. So it is not the average","zh":"这里，它正式的定义是，想象S是一个随机变量，表示从这个拥有百万个数据点的人群中抽取的一个样本。","start":2274.31,"end":2281.49},{"id":225,"text":"of all the S necessarily. It should be if they're consistent, but it's not necessarily the same.","zh":"所有S的必要性。如果它们是一致的，它应该是这样的，但不一定是相同的。","start":2281.49,"end":2285.95},{"id":226,"text":"Here what it formally is, is imagine S is a random variable that says","zh":"这里它正式的定义是，想象S是一个随机变量，它表示","start":2286.17,"end":2289.33},{"id":227,"text":"a sample from this population that has a million points.","zh":"从这个拥有百万个点的人群中抽取的一个样本。","start":2290.11,"end":2293.27},{"id":228,"text":"It is the expected value over all the possible million points","zh":"这是在所有可能的百万个点上的期望值","start":2294.19,"end":2297.65},{"id":229,"text":"that you could get and the weight of each one of those","zh":"你可能得到的每一个集合的权重","start":2297.65,"end":2300.61},{"id":230,"text":"sets.","zh":"数据集。","start":2300.61,"end":2300.89},{"id":231,"text":"It's a very complicated object.","zh":"这是一个非常复杂的对象。","start":2301.15,"end":2302.75},{"id":232,"text":"It is not the take all of the data and fit it.","zh":"它并不是把所有数据都拿来拟合。","start":2303.01,"end":2305.45},{"id":233,"text":"It's possible those estimates are the same,","zh":"这些估计值可能是相同的，","start":2306.51,"end":2308.23},{"id":234,"text":"but not uniform.","zh":"但不是均匀的。","start":2308.29,"end":2309.25},{"id":235,"text":"That's called consistency.","zh":"这被称为一致性。","start":2309.47,"end":2310.13},{"id":236,"text":"When you're doing a linear model and the data's","zh":"当你在做线性模型并且数据非常二次的时候，这非常奇怪。","start":2310.85,"end":2313.69},{"id":237,"text":"very quadratic, it is super odd.","zh":"有一些平均值表明你会购买它。","start":2313.69,"end":2315.63},{"id":238,"text":"There are averages that are saying that you'll buy it.","zh":"它的方差非常高。","start":2315.87,"end":2318.53},{"id":239,"text":"It's super high variance.","zh":"它的方差非常高。","start":2319.85,"end":2321.43},{"id":240,"text":"Yeah, so the variance that you get here","zh":"是的，你在这里得到的方差","start":2321.69,"end":2323.45},{"id":241,"text":"is across training sets so if your data were quadratic underneath the covers and you were","zh":"是在训练集之间的方差，所以如果你的数据在底层是二次的，而你用线性模型来拟合它，那么无论你从该模型中采样多少次，","start":2323.45,"end":2327.37},{"id":242,"text":"fitting it with a linear model then no matter what underneath every time you sampled from that model","zh":"你的数据总会有一些相同形状的弯曲，只是带有一点噪声。","start":2327.37,"end":2332.03},{"id":243,"text":"there would always be some bend in your data of the same shape just with a little bit of noise","zh":"你的数据中总会有一些形状相同但带有一点噪声的弯曲部分","start":2332.03,"end":2336.05},{"id":244,"text":"in that case your long run average would be like some line that goes just through the model you can","zh":"在这种情况下，你的长期平均值会像一条穿过模型的线那样","start":2336.05,"end":2341.39},{"id":245,"text":"actually see that it will it will actually be if your if your model is ax squared bx plus c","zh":"实际上你可以看到，它实际上会是这样的：如果你的模型是ax平方加bx加c","start":2341.39,"end":2346.49},{"id":246,"text":"it's actually going to be just the bx plus c term okay plus a constant which is called the offset","zh":"它实际上只会是bx加c这一项，也就是一个常数项，称为偏置项","start":2346.49,"end":2351.25},{"id":247,"text":"depending on how you do it. So that term right there is going to be the best you can do. And","zh":"这取决于你如何进行操作。所以，那一项就是你能做到的最佳结果。而","start":2351.25,"end":2355.31},{"id":248,"text":"so you're always just going to fit that very, very simple line underneath the covers.","zh":"你总是只会拟合那条非常简单的线，隐藏在模型之下。","start":2355.31,"end":2358.33},{"id":249,"text":"The jumping around will happen if you have a model that's too expressive,","zh":"如果你的模型过于复杂，就会出现跳动的现象，","start":2359.93,"end":2362.99}],"notes":["本段讨论了模型的方差问题，即预测值在不同训练集上的波动情况。模型的方差越高，预测结果越不稳定。课程提到，可以通过使用较小的模型、逐步增加模型规模或对大模型进行正则化来减少方差。正则化是通过降低模型的方差来提高泛化能力的一种方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2184.92,"end":2362.99,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":2184.92,"text":"That's intuitively what's going on in that term. The variance is how much the prediction jumps around. Maybe you have a super expressive model, but it's not stable. And we're going to look at terms to reduce that variance later. So one approach would be you could take a small model, fit it if it fails, fit a larger model, fit a larger model, and do that. The other is, and we'll talk about later, you could fit a large model and somehow regularize it, which means reduce its variance, as we'll see in a second."},{"start":2212.83,"text":"so that it doesn't jump around so much. And that should intuitively make the models better. And better means they generalize better at test time. That's what we care about. So this error goes down. Please. The analysis we're doing is just for regressors, right? Right. So the analysis that we did here is just for regressors. This is the standard presentation of it. What I asserted without proof is that effectively the same decomposition"},{"start":2237.92,"text":"holds when you do things like classification or other models. And the reason I show this to you is this is like canon for machine learning. You will constantly hear people talk about, if you read papers or other things, bias-variance decomposition or a bias-variance result. And it basically is separating out the two effects, one effect that's based on the model class and one effect that's based on how the sample was for the data. And this kind of decomposition happens everywhere. We happen to do it just for regression."},{"start":2264.19,"text":"just for L2 regression, with a normal added is all we did. Please."},{"start":2274.31,"text":"If you think about it, it makes your head hurt a little bit. So it is not the average"},{"start":2281.49,"text":"of all the S necessarily. It should be if they're consistent, but it's not necessarily the same."},{"start":2286.17,"text":"Here what it formally is, is imagine S is a random variable that says"},{"start":2290.11,"text":"a sample from this population that has a million points."},{"start":2294.19,"text":"It is the expected value over all the possible million points"},{"start":2297.65,"text":"that you could get and the weight of each one of those"},{"start":2300.61,"text":"sets."},{"start":2301.15,"text":"It's a very complicated object."},{"start":2303.01,"text":"It is not the take all of the data and fit it."},{"start":2306.51,"text":"It's possible those estimates are the same,"},{"start":2308.29,"text":"but not uniform."},{"start":2309.47,"text":"That's called consistency."},{"start":2310.85,"text":"When you're doing a linear model and the data's"},{"start":2313.69,"text":"very quadratic, it is super odd."},{"start":2315.87,"text":"There are averages that are saying that you'll buy it."},{"start":2319.85,"text":"It's super high variance."},{"start":2321.69,"text":"Yeah, so the variance that you get here"},{"start":2323.45,"text":"is across training sets so if your data were quadratic underneath the covers and you were"},{"start":2327.37,"text":"fitting it with a linear model then no matter what underneath every time you sampled from that model"},{"start":2332.03,"text":"there would always be some bend in your data of the same shape just with a little bit of noise"},{"start":2336.05,"text":"in that case your long run average would be like some line that goes just through the model you can"},{"start":2341.39,"text":"actually see that it will it will actually be if your if your model is ax squared bx plus c"},{"start":2346.49,"text":"it's actually going to be just the bx plus c term okay plus a constant which is called the offset"},{"start":2351.25,"text":"depending on how you do it. So that term right there is going to be the best you can do. And"},{"start":2355.31,"text":"so you're always just going to fit that very, very simple line underneath the covers."},{"start":2359.93,"text":"The jumping around will happen if you have a model that's too expressive,"}],"speech_gaps":[],"frame":"../frames/v047/014.webp","frame_time":2196.92},{"title":"数据集划分与机器学习建议","segments":[{"id":250,"text":"where because the noise is coming, each different sample you get from S,","zh":"因为噪声的存在，你从S中得到的每个不同的样本，","start":2363.07,"end":2366.39},{"id":251,"text":"it's picking a different iteration. And so this variance is going to be higher.","zh":"都会选择不同的迭代。因此，这种方差将会更高。","start":2366.49,"end":2370.67},{"id":252,"text":"That's what's going on. Please.","zh":"这就是发生的情况。请。","start":2370.89,"end":2372.71},{"id":253,"text":"the question is why is the average predictor kind of the best you could do or is a good surrogate","zh":"问题是，为什么平均预测器在某种程度上是你能做到的最好的，或者是一个不错的替代方案？","start":2379.63,"end":2388.45},{"id":254,"text":"well the best you can do of course is h star right so it's not the best you could do in that sense","zh":"当然，你所能做到的最好的当然是h星，所以在这种意义上，它并不是你能做到的最好的。","start":2388.45,"end":2392.57},{"id":255,"text":"what's going on here though is we're analyzing if you gave me a model class and you train that","zh":"不过，这里发生的情况是，如果你给我一个模型类，并且你训练那个模型类，","start":2393.13,"end":2398.35},{"id":256,"text":"that model class, what would you get?","zh":"那么你将会得到什么？","start":2398.35,"end":2399.79},{"id":257,"text":"And so what you're proposing is a different model class.","zh":"因此，你所提出的是一种不同的模型类。","start":2399.97,"end":2402.65},{"id":258,"text":"And in that model class, there is a new H star,","zh":"在这个模型类中，有一个新的 H 星","start":2402.77,"end":2404.73},{"id":259,"text":"or H bar, which may indeed be closer to H star","zh":"或者 H 条，它确实可能更接近 H 星","start":2404.83,"end":2407.45},{"id":260,"text":"over the expected value of all the places","zh":"相对于所有它将在该新文本点上被评估的位置的期望值","start":2407.45,"end":2409.89},{"id":261,"text":"that it's going to be evaluated on this new text point.","zh":"这将是一个值得做的事情","start":2409.89,"end":2412.01},{"id":262,"text":"And that would be a good thing to do,","zh":"但这就是抽象的工作方式","start":2412.65,"end":2413.83},{"id":263,"text":"but that's how the abstraction works.","zh":"你给我一个模型类","start":2413.91,"end":2415.63},{"id":264,"text":"You give me the model class,","zh":"我们会查看长期平均值","start":2416.19,"end":2417.25},{"id":265,"text":"we look at the long-running average.","zh":"我们关注长期平均值。","start":2417.43,"end":2418.97},{"id":266,"text":"Now, if you say, I have a different procedure that I'd like to","zh":"现在，如果你说，我有一个不同的过程，我想运行它以创建那个模型类，","start":2419.19,"end":2421.71},{"id":267,"text":"run to be able to create that model class,","zh":"比如我在训练时会选择不同的 h，","start":2421.71,"end":2423.41},{"id":268,"text":"like I'm going to pick a different h as I train,","zh":"这也是一种不同的模型类。","start":2423.51,"end":2425.85},{"id":269,"text":"that also is a different model class.","zh":"这被称为正则化。","start":2426.07,"end":2427.69},{"id":270,"text":"That's called regularization.","zh":"这是正则化的一个例子。","start":2427.87,"end":2428.89},{"id":271,"text":"That's one example of regularization.","zh":"我们将在下一节中看到这一点。","start":2429.09,"end":2430.47},{"id":272,"text":"We're going to see that exactly next.","zh":"它可能会对偏差产生影响，","start":2430.65,"end":2431.81},{"id":273,"text":"It could have an effect on the bias,","zh":"它可能会对偏差产生影响，","start":2434.47,"end":2438.13},{"id":274,"text":"but primarily it's designed to reduce the variance.","zh":"但主要目的是减少方差。","start":2438.21,"end":2439.87},{"id":275,"text":"It does have an effect that you'll see ridge regression where actually you trade a small","zh":"它确实会产生一种效果，你会在岭回归中看到，实际上你用一点额外的偏差来换取显著的方差减少。","start":2445.01,"end":2448.79},{"id":276,"text":"amount of additional bias usually for a large reduction in variance. That's the usual way the","zh":"通常来说，这是偏差与方差之间权衡的常规方式。","start":2448.79,"end":2453.09},{"id":277,"text":"trade works. I don't mean to be mysterious about it. That's usually what it is. You trade a little","zh":"我不打算对此神秘化。这通常是它的作用。你用一点偏差来换取显著的方差减少。","start":2453.09,"end":2456.47},{"id":278,"text":"bit of bias for a big variance reduction. We've gone over these pieces before. I'm going to go","zh":"我们之前已经讨论过这些部分。我现在会一一回顾它们，分解将为我们带来接下来要探讨的两个主题","start":2456.47,"end":2465.03},{"id":279,"text":"through them all right so decomposition hands us the next two topics that we're going to look at","zh":"我们将会看到偏差与方差的综合影响，这是之前一个很好的观点","start":2465.03,"end":2471.05},{"id":280,"text":"we the combined effect of bias and variance this was an earlier wonderful point","zh":"可以用开发集或保留集进行实证测量。什么是开发集或保留集呢？","start":2471.59,"end":2475.53},{"id":281,"text":"can be measured empirically with a dev or a holdout set what is a dev or a holdout set well","zh":"可以通过开发集或保留集进行实证测量 什么是开发集或保留集 好吧","start":2475.99,"end":2481.15},{"id":282,"text":"what i could do is i could have a training set i could have a test set that i'm eventually going","zh":"我可以有一个训练集，我可以有一个最终用于测试的测试集，","start":2481.15,"end":2485.89},{"id":283,"text":"to test on and i could have some kind of random additional sample of my data set that i use just","zh":"并且我可以有一些随机的额外样本，这些样本只是用来","start":2485.89,"end":2490.43},{"id":284,"text":"just for parameter tuning, fitting, testing fits,","zh":"进行参数调整、拟合、测试拟合效果，","start":2490.43,"end":2493.41},{"id":285,"text":"trying out procedures.","zh":"尝试各种过程。","start":2493.61,"end":2494.45},{"id":286,"text":"That set is called a holdout or a dev set.","zh":"这个集合被称为保留集或开发集。","start":2494.67,"end":2496.73},{"id":287,"text":"And you can see that there.","zh":"你可以在那里看到。","start":2496.91,"end":2498.53},{"id":288,"text":"It's separate from training, and it can estimate the test error","zh":"它与训练集是分开的，它可以估计测试误差","start":2498.73,"end":2501.63},{"id":289,"text":"locally.","zh":"在局部范围内。","start":2501.63,"end":2501.87},{"id":290,"text":"So you don't have to spoil your test set. Statistical-minded people are very worried about spoiling their test set. So one thing that you could worry about if you're a statistician is, oh my gosh, once you see the test set, all this information leaks through, and now you're going to be able to cheat in some interesting way and then validate the statistical sanctity of that set. We're going to come back and talk about, at least in one of the most major competitions in machine learning over a decade, that did not happen.","zh":"所以你不需要破坏你的测试集。统计学思维的人非常担心破坏他们的测试集。所以如果你是一个统计学家，你可能会担心的一件事是，天啊，一旦你看到了测试集，所有这些信息都会泄露出来，你现在就能以某种有趣的方式作弊，并验证这个测试集的统计学纯洁性。我们之后会回到这个话题，至少在机器学习领域过去十年中最主要的竞赛之一中，这种情况并没有发生。","start":2503.98,"end":2529.02}],"notes":["本段讨论了在数据集划分中，使用验证集（dev set）或保留集（holdout set）来评估模型性能的重要性。讲者指出，验证集用于参数调优和模型选择，而测试集用于最终评估，以防止信息泄露和过拟合。","讲者提到，如果在训练过程中使用测试集进行调整，会导致测试集被污染，从而影响模型评估的可靠性。统计学家对此非常关注，因为一旦看到测试集，可能会产生信息泄露，导致模型评估不准确。","讲者还提到，在机器学习竞赛中，这种测试集污染的问题并未发生，这表明在实际应用中，通过合理划分数据集可以有效避免这一问题。","讲者强调了数据集划分的必要性，即训练集用于模型训练，验证集用于调优，测试集用于最终评估，以确保模型的泛化能力。","讲者指出，验证集可以估计测试误差，但仅限于局部范围，因此需要合理划分数据集以确保评估的准确性。","讲者最后提到，数据集划分是机器学习中的重要步骤，有助于理解偏差和方差的综合影响，并为后续讨论奠定基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2363.07,"end":2529.02,"asr_flags":[253],"boards":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":2363.07,"text":"where because the noise is coming, each different sample you get from S,"},{"start":2366.49,"text":"it's picking a different iteration. And so this variance is going to be higher."},{"start":2370.89,"text":"That's what's going on. Please."},{"start":2379.63,"text":"the question is why is the average predictor kind of the best you could do or is a good surrogate"},{"start":2388.45,"text":"well the best you can do of course is h star right so it's not the best you could do in that sense"},{"start":2393.13,"text":"what's going on here though is we're analyzing if you gave me a model class and you train that"},{"start":2398.35,"text":"that model class, what would you get?"},{"start":2399.97,"text":"And so what you're proposing is a different model class."},{"start":2402.77,"text":"And in that model class, there is a new H star,"},{"start":2404.83,"text":"or H bar, which may indeed be closer to H star"},{"start":2407.45,"text":"over the expected value of all the places"},{"start":2409.89,"text":"that it's going to be evaluated on this new text point."},{"start":2412.65,"text":"And that would be a good thing to do,"},{"start":2413.91,"text":"but that's how the abstraction works."},{"start":2416.19,"text":"You give me the model class,"},{"start":2417.43,"text":"we look at the long-running average."},{"start":2419.19,"text":"Now, if you say, I have a different procedure that I'd like to"},{"start":2421.71,"text":"run to be able to create that model class,"},{"start":2423.51,"text":"like I'm going to pick a different h as I train,"},{"start":2426.07,"text":"that also is a different model class."},{"start":2427.87,"text":"That's called regularization."},{"start":2429.09,"text":"That's one example of regularization."},{"start":2430.65,"text":"We're going to see that exactly next."},{"start":2434.47,"text":"It could have an effect on the bias,"},{"start":2438.21,"text":"but primarily it's designed to reduce the variance."},{"start":2445.01,"text":"It does have an effect that you'll see ridge regression where actually you trade a small"},{"start":2448.79,"text":"amount of additional bias usually for a large reduction in variance. That's the usual way the"},{"start":2453.09,"text":"trade works. I don't mean to be mysterious about it. That's usually what it is. You trade a little"},{"start":2456.47,"text":"bit of bias for a big variance reduction. We've gone over these pieces before. I'm going to go"},{"start":2465.03,"text":"through them all right so decomposition hands us the next two topics that we're going to look at"},{"start":2471.59,"text":"we the combined effect of bias and variance this was an earlier wonderful point"},{"start":2475.99,"text":"can be measured empirically with a dev or a holdout set what is a dev or a holdout set well"},{"start":2481.15,"text":"what i could do is i could have a training set i could have a test set that i'm eventually going"},{"start":2485.89,"text":"to test on and i could have some kind of random additional sample of my data set that i use just"},{"start":2490.43,"text":"just for parameter tuning, fitting, testing fits,"},{"start":2493.61,"text":"trying out procedures."},{"start":2494.67,"text":"That set is called a holdout or a dev set."},{"start":2496.91,"text":"And you can see that there."},{"start":2498.73,"text":"It's separate from training, and it can estimate the test error"},{"start":2501.63,"text":"locally."},{"start":2503.98,"text":"So you don't have to spoil your test set. Statistical-minded people are very worried about spoiling their test set. So one thing that you could worry about if you're a statistician is, oh my gosh, once you see the test set, all this information leaks through, and now you're going to be able to cheat in some interesting way and then validate the statistical sanctity of that set. We're going to come back and talk about, at least in one of the most major competitions in machine learning over a decade, that did not happen."}],"speech_gaps":[{"start":2373.216,"end":2377.84}],"frame":"../frames/v047/015.webp","frame_time":2375.07},{"title":"正则化与偏差-方差权衡","segments":[{"id":291,"text":"That's called adaptive overfitting. But that's what statisticians are often worried about here. And it does happen, just not in this case. The variance is typically reduced by regularization. This is exactly what we just described at the cost of a little extra bias. We'll talk about exactly what regularization is in a second. And we're going to come back to this modern picture. All right, so what is regularization?","zh":"这就是所谓的自适应过拟合。但这是统计学家们经常担心的问题。这种情况确实会发生，只是不在这种情况下。通常通过正则化来减少方差。这正是我们刚才描述的，以稍微增加一点偏差为代价。我们马上就会讨论正则化到底是什么。我们还会回到这个现代的视角。好了，那么什么是正则化？","start":2529.7,"end":2553.57},{"id":292,"text":"So we want to reduce variance in training to get a more robust model. So this is going to be the procedure that's going to design to reduce variance. We're going to allow it to put in a little bit of bias, potentially to get a more stable model, because our error is going to be a sum of those terms, and the win is going to be bias goes up by a smaller amount, then variance comes down. Then we would consider regularization a win.","zh":"我们希望减少训练中的方差，以得到一个更稳健的模型。因此，这将是一个设计用来减少方差的过程。我们将允许它引入一点偏差，从而得到一个更稳定的模型，因为我们的误差将是这些项的总和，而优势在于偏差增加的幅度较小，而方差则会下降。这样我们就会认为正则化是成功的。","start":2554.47,"end":2573.13},{"id":293,"text":"So it's general, it's used far beyond linear regression, like you use it in every industrial model in the world in some form or another. The goal for the next slide is to show you how to use this in a couple of concrete places. Clear enough what the mechanism is, we have those three terms. We're going to try and get lower test error, hopefully by reducing variance by more than we increase bias squared.","zh":"这是一般性的方法，它不仅用于线性回归，你还会以某种形式在世界上每一个工业模型中使用它。下一张幻灯片的目标是向你展示如何在几个具体的地方使用它。机制已经很清楚了，我们有这三个项。我们将尝试获得更低的测试误差，希望通过对方差的减少超过我们对偏差平方的增加。","start":2575.01,"end":2596.25},{"id":294,"text":"So it's general, it's used far beyond linear regression, like you use it in every industrial model in the world in some form or another. The goal for the next slide is to show you how to use this in a couple of concrete places. Clear enough what the mechanism is, we have those three terms. We're going to try and get lower test error, hopefully by reducing variance by more than we increase bias squared.","zh":"这是一般性的方法，它不仅用于线性回归，你还会以某种形式在世界上每一个工业模型中使用它。下一张幻灯片的目标是向你展示如何在几个具体的地方使用它。机制已经很清楚了，我们有这三个项。我们将尝试获得更低的测试误差，希望通过对方差的减少超过我们对偏差平方的增加。","start":2598.34,"end":2620.43},{"id":295,"text":"Let's look at least squares. This is going to be ridge regression. We're going to be able to derive an estimator here and see everything that happens underneath the covers. So ridge regression, sorry to skip, ridge regression here is your favorite least squares that you've done before.","zh":"让我们看一下最小二乘法。这将是岭回归。我们将能够在这里推导出一个估计量，并看到所有底层发生的事情。岭回归，抱歉跳过了，这里的岭回归是你之前做过的最喜欢的最小二乘法。","start":2622.79,"end":2639.02},{"id":296,"text":"And then we add in this new term here, this new penalty term for some row that's going to be greater than zero. And this was the thing I was mentioning. Oh, theta, you know, it's squares. It's not too big. We don't know exactly how big theta is because it's an unknown parameter that we're learning. We don't want to fix its value. But we know that it's kind of not too big. And if we start to make it really big, it's got to be worth it that it fits the data a lot better. Is the intuition for what this formula is kind of roughly saying clear? We're going to derive kind of what happens as a result of adding this term. Please.","zh":"然后我们在这里添加一个新的项，这个新的惩罚项对于某些行来说会大于零。这就是我之前提到的事情。哦，θ，你知道的，它是平方的。它不会太大。我们不知道θ确切有多大，因为它是一个未知参数，我们正在学习。我们不希望固定它的值。但我们知道它大概不会太大。如果我们让它变得非常大，就必须确保它能更好地拟合数据。这个公式的大致直觉是否清楚？我们将推导添加这个项之后会发生什么。请。","start":2640.64,"end":2669.36},{"id":297,"text":"Why do we care about the size of the coefficients and not the order? Yeah, great question. So the thing is, why do we care about this size rather than the order? It turns out that regularization is one of those things that you can put all kinds of different penalties on it. You could ask that it's sparse. You could say, look, I only want to have a sparse set of coefficients. Or I want to have something that's nearly sparse. Or I want to look at the squares of the coefficients because I think the norm should be small. Or I should look through some test statistic and do it as well.","zh":"为什么我们关心系数的大小而不是顺序？是的，非常好的问题。事情是这样的，为什么我们关心这个大小而不是顺序？事实上，正则化是一种可以施加各种不同惩罚的方法。你可以要求它稀疏。你可以表示，我只想拥有一个稀疏的系数集合。或者我希望有一个几乎稀疏的结构。或者我希望查看系数的平方，因为我认为范数应该很小。或者我可以使用某种检验统计量来实现这一点。","start":2669.98,"end":2695.02}],"notes":["本段讨论了正则化在机器学习中的作用，特别是如何通过引入惩罚项来减少模型的方差。讲者提到正则化是一种权衡偏差和方差的策略，允许模型引入一定的偏差以换取更稳定的预测结果。"],"formulas":[{"latex":"E[\\text{error}] = \\text{bias}^2 + \\text{variance} + \\text{irreducible error}","symbols":"误差期望等于偏差平方、方差和不可约误差之和","explanation":"公式正确表达了误差期望的分解，包含偏差平方、方差和不可约误差三项，符合统计学习理论中的基本概念。","evidence":"So we want to reduce variance in training to get a more robust model. So this is going to be the procedure that's going to design to reduce variance. We're going to allow it to put in a little bit of bias, potentially to get a more stable model, because our error is going to be a sum of those terms, and the win is going to be bias goes up by a smaller amount, then variance comes down. Then we would consider regularization a win."}],"uncertainties":["在296段中提到的'for some row'可能是指某个特定的行或参数，但具体含义不明确，需要进一步澄清。"],"diagram":"none","start":2529.7,"end":2695.02,"asr_flags":[],"math_clarifications":["公式中的各项符号和数学类型正确，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2529.7,"text":"That's called adaptive overfitting. But that's what statisticians are often worried about here. And it does happen, just not in this case. The variance is typically reduced by regularization. This is exactly what we just described at the cost of a little extra bias. We'll talk about exactly what regularization is in a second. And we're going to come back to this modern picture. All right, so what is regularization?"},{"start":2554.47,"text":"So we want to reduce variance in training to get a more robust model. So this is going to be the procedure that's going to design to reduce variance. We're going to allow it to put in a little bit of bias, potentially to get a more stable model, because our error is going to be a sum of those terms, and the win is going to be bias goes up by a smaller amount, then variance comes down. Then we would consider regularization a win."},{"start":2575.01,"text":"So the Bayesian view is what we're really doing is encoding prior knowledge. Some people find that helpful. Some people find this frequentist way I'm describing helpful. Oh, it's just a trade-off of errors. Or maybe I know something like, I know I'm fitting a line that isn't too steep. I know my line should be kind of flattish. That would be a prior distribution. I would say thetas, if I look at the size of the theta i's, they just shouldn't be too big on average."},{"start":2598.34,"text":"So it's general, it's used far beyond linear regression, like you use it in every industrial model in the world in some form or another. The goal for the next slide is to show you how to use this in a couple of concrete places. Clear enough what the mechanism is, we have those three terms. We're going to try and get lower test error, hopefully by reducing variance by more than we increase bias squared."},{"start":2622.79,"text":"Let's look at least squares. This is going to be ridge regression. We're going to be able to derive an estimator here and see everything that happens underneath the covers. So ridge regression, sorry to skip, ridge regression here is your favorite least squares that you've done before."},{"start":2640.64,"text":"And then we add in this new term here, this new penalty term for some row that's going to be greater than zero. And this was the thing I was mentioning. Oh, theta, you know, it's squares. It's not too big. We don't know exactly how big theta is because it's an unknown parameter that we're learning. We don't want to fix its value. But we know that it's kind of not too big. And if we start to make it really big, it's got to be worth it that it fits the data a lot better. Is the intuition for what this formula is kind of roughly saying clear? We're going to derive kind of what happens as a result of adding this term. Please."},{"start":2669.98,"text":"Why do we care about the size of the coefficients and not the order? Yeah, great question. So the thing is, why do we care about this size rather than the order? It turns out that regularization is one of those things that you can put all kinds of different penalties on it. You could ask that it's sparse. You could say, look, I only want to have a sparse set of coefficients. Or I want to have something that's nearly sparse. Or I want to look at the squares of the coefficients because I think the norm should be small. Or I should look through some test statistic and do it as well."}],"speech_gaps":[],"frame":"../frames/v047/016.webp","frame_time":2541.7},{"title":"数据集划分与机器学习建议","segments":[{"id":298,"text":"Those are all different modeling choices that you'll have, so there's no one that's right or wrong. The reason we're going to use this one is the math is super clean, it will boil down to exactly something we can see in these squares. And this is one of the more common things, like if you go and download like a PyTorch model, one of the ways that you'll probably do uh","zh":"这些都是不同的建模选择，所以没有一个是正确或错误的。我们之所以使用这个方法，是因为数学非常干净，它会简化为我们可以在这些方框中看到的某种形式。这是一些更常见的做法，比如如果你下载一个PyTorch模型，你可能会用到一种叫做dropout或叫做权重衰减的方法。两者实际上都可以被解释为在权重上添加一种L2回归的形式。其中一种方法，即权重收缩，实际上会诱导出这种行为。而dropout，也是一篇很棒的论文，我认为Percy写的那篇论文，讨论了dropout和正则化其实是相同的。请。是的，它是在求和之外。我的意思是，它只会改变归一化。","start":2695.5,"end":2712.0},{"id":299,"text":"regression or regularization is, you may use something called dropout or you may use something called weight decay. Both of them can be actually interpreted as adding a form of L2 regression on the weights. One of them, model shrinking in weights, actually induces exactly this behavior. And dropout, also a wonderful paper, I think Percy wrote that paper, about how dropout and regularization are the same. Please. Yeah, it's outside the sum. I mean, it would just change normalization.","zh":"好的，如果这会将theta向原点收缩，那就意味着我们认为它不应该太大。这是一种软性惩罚，对吧？如果我们把它设为零，这就是普通的最小二乘法。如果我们把它设得非常大，在某个值时，基本上预测零就是最好的做法，对吧？因为如果这个值非常大，随着我们越来越接近将它设为无穷大，这个方法会希望得到零，而不再关心测试误差。显然我的观点是，存在一个最佳的平衡点。","start":2713.28,"end":2744.26},{"id":300,"text":"All right, so if this is going to shrink theta toward the origin, so it just means we don't think it should be too big. It's kind of a soft penalty, okay? Now, if we set it to zero, this is plain, ordinary least squares. If we set it really, really large, there's a value at which basically predicting zero is kind of the best thing to do, right? Because if this thing is massive, as we get closer and closer to setting that to infinity, this one wants zero and this one, and stop caring about the test error. So clearly my point is that there's some sweet spot.","zh":"对于rho，它会给我们带来良好的误差。它会将theta收缩。它仍然会尊重我们这边的一些误差。清楚吗？所以这只是一个保持在零的状态。它在进行普通的平方计算，这会带来我们之前讨论过的问题。当它变得非常大时，theta会越来越接近零以满足这个惩罚。","start":2747.95,"end":2777.67},{"id":301,"text":"For rho, that's going to give us good error. It's going to shrink that theta. And it's going to still respect some of the error that we have over here. Clear enough? So this is just staying at 0. It's playing ordinary squares, which has the issues we talked about. When it gets very large, then theta gets closer and closer to 0 to satisfy this penalty.","zh":"对于rho，它会给我们带来良好的误差。它会将theta收缩。它仍然会尊重我们这边的一些误差。清楚吗？所以这只是一个保持在零的状态。它在进行普通的平方计算，这会带来我们之前讨论过的问题。当它变得非常大时，theta会越来越接近零以满足这个惩罚。","start":2778.25,"end":2800.04},{"id":302,"text":"All right. So a good balanced row balances the two. The right ratio depends
