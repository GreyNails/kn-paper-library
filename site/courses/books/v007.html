ptimization. Now, just to put this in context, we looked at vector inequalities. And a vector inequality, what happens is, you know, something like that is a vector, and this inequality is now to be interpreted in a vector sense. Like, this could state that a matrix variable is positive semidefinite. That would be an example."},{"id":4,"text":"Now, when we were doing that, we did not change the semantics of an optimization problem, right? The semantics was identical. And the semantics, I'll repeat it one more time, it's this. Semantics of an optimization problem is, if a point does not satisfy all the constraints, if it is not feasible, it's completely unacceptable. And there's no more discussion."},{"id":5,"text":"Among those that do satisfy all the constraints, the one with this least objective, which is a scalar in a standard optimization problem, is the best one. Everybody got that? So that's the semantics, there's nothing else to it. Now we're going to be talking about vector optimization, and what we're going to do is we're actually going to..."},{"id":6,"text":"Now, generalize not constraints, but the objective to be a vector. Now, there we're actually going to have to mess with the semantics, because what does it mean to say, you know, minimize a vector? Like, offhand, and it turns out it can mean lots of things, and not surprisingly, the main distinction is going to be things like minimal versus minimum, right?"}],"notes":["本段介绍了课程将要讨论的向量优化问题，这是课程中最后一个理论主题之一，之后将进入对偶性（duality）的讨论。对偶性是一个有趣且重要的概念，可能在统计学、经济学等其他课程中有所涉及，但通常不会明确使用‘对偶’这个词。","在标准优化问题中，语义是明确的：如果一个点不满足所有约束条件，则完全不可接受；而在满足所有约束的点中，目标函数值最小的点是最优的。然而，在向量优化中，目标函数变为向量，因此需要重新定义语义，因为‘最小化一个向量’可以有多种解释。","向量优化的核心挑战在于如何定义‘最小化’一个向量。这通常涉及到‘最小’（minimum）和‘极小’（minimal）之间的区别，这在优化理论中是一个关键概念。","课程强调，向量优化的语义与标准优化问题不同，因为目标函数不再是标量，而是向量，因此需要重新考虑优化问题的定义和求解方法。","在向量优化中，可能需要引入新的概念，如帕累托最优（Pareto optimality）或向量最小化（vector minimization），这些概念在标准优化问题中并不存在。","课程还提到，对偶性（duality）将在本周讨论，这表明对偶性是向量优化之后的重要主题，可能涉及对偶问题的构造和求解方法。"],"formulas":[],  is basically down and to the left is good. If you take that to be the objective, then it could be that O looks like this. And here you see there's a minimum point, in which case you just simply say it's optimal, period. It's just optimal. And we'll..."},{"start":318.8,"text":"That's what it means to be optimal. Basically, that happens pretty rarely, but it does happen in some very famous examples in, let's say, statistics and estimation. But generally, it's not."}],"speech_gaps":[],"frame":"../frames/v007/002.webp","frame_time":177.01},{"title":"Pareto最优与向量优化问题的语义","segments":[{"id":14,"text":"Pareto optimal is the name that you would give to a point if f0 of x, that's a vector remember, is a minimal value of this. And so what that means is like, here's the achievable thing. Here's what you can do. Remember in this one, r plus squared is the vector, is the cone we use to compare vectors, right? And so what that means is if you have a point here, everything to the left and down"},{"id":15,"text":"These things are better than that point, right? So when we talked about minimal points, there was no, we didn't assign like something's better than something. Now we are because we're doing minimization and we want that quote small, but that means small in this vector sense. So these are the things that are better, right? So for example, if you, there's an X that achieves this value."},{"id":16,"text":"Okay. And I mean, the technical name for that is a stupid choice of X, right? Because basically it's silly. You're so like, look, if you take this thing, there's all sorts of points over here, which actually are unambiguously better than that choice. This is in the vector sense, right?"},{"id":17,"text":"The minimal points of this set O are these over here. It's this boundary here, and then that's open, and then this boundary here. So for every single one of those points, there's no point that is strictly better than that point. So these are the minimal, they're literally the minimal points of O, which is the achievable objectives. And it kind of..."},{"id":18,"text":"All really makes, I mean, this makes perfect sense, right? So, and then actually if someone says, can you compare this and this? And the answer would be no. And no one could say for, you can't say without further information. You couldn't say that that's better than that. You could just, in fact, a very good name, another name for Pareto is a great name. I forget which field uses it. It's called non-dominated."},{"id":19,"text":"right? So a non-dominated point, right? Because something like this point here is dominated. It's dominated. In other words, there are choices which are simply better. They're strictly down and to the left, okay?"},{"id":20,"text":"So that's dominated. And the points that are not dominated is this boundary. It's the set of minimal points. These are called Pareto optimal. There's another name for it. That's from economics, actually, I think from the 1890s. Something like that. This is not exactly new material. Okay. So this is the new semantics of a vector optimization problem. Okay. It's clearest."}],"notes":["本段讲解了Pareto最优的概念，即在向量优化问题中，一个点如果无法被其他点在所有目标函数上都严格优于，则称为Pareto最优。这与传统的最小化问题不同，因为此时的‘更优’是基于向量的比较，而不是单一标量值。","在向量优化问题中，我们使用锥（如r plus squared）来比较向量。如果一个点在所有目标函数上都比另一个点更优，则称其为‘更优’。这种比较方式使得我们能够识别出那些无法被其他点严格优于的点，即Pareto最优。","Pareto最优点集合构成了一个边界，这些点在所有目标函数上都无法被其他点严格优于。因此，这些点被称为‘最小点’，即在向量优化问题中，这些点是‘最小的’。","Pareto最优的概念来源于经济学，通常被称为‘非支配点’。一个点如果被其他点在所有目标函数上都严格优于，则称为支配点，而非支配点即为Pareto最优。","在向量优化问题中，我们不能直接比较两个点，除非有额外的信息。因此，Pareto最优提供了一种在多目标优化中进行比较的框架。","本段还提到，Pareto最优是向量优化问题的新语义，即在多目标优化中，我们不再追求单一最优解，而是寻找一组无法被其他点严格优于的解集。"],"formulas":[],"uncertainties":[],"diagram":"none","start":332.73,"end":503.11,"asr_flags":[],"raw_segments":[{"start":332.73,"text":"Pareto optimal is the name that you would give to a point if f0 of x, that's a vector remember, is a minimal value of this. And so what that means is like, here's the achievable thing. Here's what you can do. R  dominated. And the points that are not dominated is this boundary. It's the set of minimal points. These are called Pareto optimal. There's another name for it. That's from economics, actually, I think from the 1890s. Something like that. This is not exactly new material. Okay. So this is the new semantics of a vector optimization problem. Okay. It's clearest."}],"speech_gaps":[],"frame":"../frames/v007/003.webp","frame_time":344.73},{"title":"多目标优化与帕累托最优","segments":[{"id":21,"text":"in the case, in what's called multi-criterion optimization. And this is a vector problem where we just have the cone. And our objectives actually have, so we would literally refer to these as our objectives, F1 up to FQ, right? Those are our objectives. Altogether, they become a vector objective. But literally, you'd call these, these are the objectives, right? I mean, okay, and let's see what it means. So here's what it would mean."},{"id":22,"text":"If you have these two different objectives and basically, roughly speaking, you want all of them small. That's that's that's the idea. Right. And so if you have a point that's optimal, what it means is it's both feasible and it says basically what that says, that there is a choice of X where."},{"id":23,"text":"It minimizes F1 and it minimizes F2 and it minimizes F3 and it minimizes all of them, right? That's what it's, it simultaneously minimizes all of them. Here's, this is an example like this, right? And this says that there was no competition among them. I just, I found a single point that just minimized everything. Like, so, I mean, and I should add, you know, this is, this should be kind of obvious, but."},{"id":24,"text":"I'm not aware of any problem in a practical setting that's not a multi-criterion problem, right? Because everything, you know, doesn't matter. You'll see very shortly how to solve them. It's a big deal. Some people actually make this into a field, which I find ridiculous, because if you know how to do these things, it's extremely straightforward. So any field there is, there are going to be trade-offs."},{"id":25,"text":"among competing objectives, right? I mean, if you're fitting a model in machine learning, you'd have a loss function and you'd have a regularizer and you'd want to trade off among them, right? In control, you know, you want to hit your target and you could trade off fuel and the comfort of the ride, right? Or something like that, right? So there's just..."},{"id":26,"text":"Pretty much any problem I can possibly imagine. But they're very easily, as we'll see shortly, handled by straight-up optimization. Anyway, back to this. By the way, this happens very rarely. If you would say, oh, I'm doing this circuit design, I care about the area, I care about the power, I care about the dynamic power, and it doesn't matter, that's it. And I care about the..."},{"id":27,"text":"you know, the maximum power output of my amplifier. There you go. Okay. So I have like four objectives. And then you come back and you go, cool, here's a design. You go, well, what does it do? You say, oh, it minimizes all four of them simultaneously. Everybody got that? I mean, that would be awesome, right? But this happens like basically never, almost never. Okay. Pareto optimal is actually interesting. So to be Pareto optimal, what it means is"}],"notes":["本段讲授了多目标优化的基本概念，即多个目标函数同时最小化的问题。讲者指出，这种情况下，一个点如果是最优的，它必须同时满足所有目标函数的最小化，且在可行域内。然而，这种情况在实际问题中非常罕见，因为通常存在目标之间的竞争关系。","讲者通过多个例子说明了多目标优化的常见性，例如在机器学习中，损失函数和正则化项之间需要权衡；在控制问题中，需要在燃料消耗和乘坐舒适度之间进行取舍。这些例子表明，多目标优化在实际应用中是普遍存在的。","讲者强调，虽然多目标优化在实际中很常见，但通过优化方法可以有效地处理这些问题。他指出，虽然有些人将多目标优化视为一个独立的领域，但讲者认为这并不必要，因为这些方法本质上是直接的优化问题。","讲者提到，帕累托最优是多目标优化中的一个重要概念，它指的是在不使其他目标变差的情况下，无法进一步改善某个目标的点。然而，讲者指出，找到这样的点在实际中几乎不可能，因为目标之间通常存在竞争。","讲者通过电路设计的例子进一步说明了多目标优化的挑战，即在面积、功耗、动态功耗和最大输出功率等多个目标之间进行权衡。他指出，找到一个同时最小化所有目标的点几乎不可能，因此需要进行权衡。","最后，讲者提到帕累托最优的概念，并指出在实际问题中，找到帕累托最优解几乎不可能，因为目标之间存在竞争关系。因此，多目标优化通常需要在不同目标之间进行权衡，而不是同时最小化所有目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":503.74,"end":675.81,"asr_flags":[],"raw_segments":[{"start":503.74,"text":"in the case, in what's called multi-criterion optimization. And this is a vector problem where we just have the cone. And our objectives actually have, so we would literally refer to these as our objectives, F1 up to FQ, right? Those are our objectives. Altogether, they become a vector objective. But literally, you'd call these, these are the objectives, right? I mean, okay, and let's see what it means. So here's what it would mean."},{"start":531.5,"text":"If you have these two different objectives and basically, roughly speaking, you want all of them small. That's that's that's the idea. Right. And so if you have a point that's optimal, what it means is it's both feasible and it says basically what that says, that there is a choice of X where."},{"start":552.54,"text":"It minimizes F1 and it minimizes F2 and it minimizes F3 and it minimizes all of them, right? That's what it's, it simultaneously minimizes all of them. Here's, this is an example like this, right? And this says that there was no competition among them. I just, I found a single point that just minimized everything. Like, so, I mean, and I should add, you know, this is, this should be kind of obvious, but."},{"start":576.21,"text":"I'm not aware of any problem in a practical setting that's not a multi-criterion problem, right? Because everything, you know, doesn't matter. You'll see very shortly how to solve them. It's a big deal. Some people actually make this into a field, which I find ridiculous, because if you know how to do these things, it's extremely straightforward. So any field there is, there are going to be trade-offs."},{"start":599.45,"text":"among competing objectives, right? I mean, if you're fitting a model in machine learning, you'd have a loss function and you'd have a regularizer and you'd want to trade off among them, right? In control, you know, you want to hit your target and you could trade off fuel and the comfort of the ride, right? Or something like that, right? So there's just..."},{"start":621.9,"text":"Pretty much any problem I can possibly imagine. But they're very easily, as we'll see shortly, handled by straight-up optimization. Anyway, back to this. By the way, this happens very rarely. If you would say, oh, I'm doing this circuit design, I care about the area, I care about the power, I care about the dynamic power, and it doesn't matter, that's it. And I care about the..."},{"start":651.1,"text":"you know, the maximum power output of my amplifier. There you go. Okay. So I have like four objectives. And then you come back and you go, cool, here's a design. You go, well, what does it do? You say, oh, it minimizes all four of them simultaneously. Everybody got that? I mean, that would be awesome, right? But this happens like basically never, almost never. Okay. Pareto optimal is actually interesting. So to be Pareto optimal, what it means is"}],"speech_gaps":[],"frame":"../frames/v007/004.webp","frame_time":515.74},{"title":"帕累托最优与权衡曲线","segments":[{"id":28,"text":"It means you're non-dominated. It means you say, well, I have an X, and you get these Q different scores or objective values. Then what you know if you are Pareto optimal is that nobody can embarrass you. Embarrass you means, oh yeah, well, I've got an X that matches you on all and beats you on at least one. That was informal, but it was actually a precise statement of what it meant to be Pareto optimal. Everybody got that?"},{"id":29,"text":"Right. So, yeah, so you'd say, well, I know how to I know how to do my production. So I will use I'll take your plan for production and I'll say, yeah, I got a plan. Mine of the 12 resources that we both use, I match you on all and I beat you on two. That means my plan dominates yours."},{"id":30,"text":"Which means yours is not Pareto optimal. Of course, mine need not be either. But that's what it means. So I think these are ideas you've seen before. They're very simple and I think intuitive. But I think it's not a bad thing to actually have it called out with a name associated with it. So the one thing that people in a lot of areas, when you talk about Pareto optimal, they talk about..."},{"id":31,"text":"you talk about trade-offs, which is, I think, an extremely good way to say it. So if you look back over here, remember this is an optimization problem where we're basically optimizing two things. We want the first component small, so left is good, and we want the second component small, which means down is good. And then..."},{"id":32,"text":"And so what we would do is, if someone pointed to... So that's a stupid choice. That's an impossible choice. Perfectly nice one, but impossible. This is possible, but stupid. These are the not stupid ones, or the Pareto ones, or something like that. And they refer to this as an optimal trade-off curve. And then if you were to choose these two points and say, let's discuss..."},{"id":33,"text":"Right? Let's compare. And you would say, well, neither is better than the other. Right? Because they're not comparable. It is not the case that, you know, one does. And then you'd say, well, what happened? And you'd say, well, if I was going to compare this point and this point, what I would say is this point up here beats this one in the first objective, but pays for it with the second because it's higher."},{"id":34,"text":"Okay, and so that's and that actually gets you kind of to some economics. I mean a simple economic interpretation where you are exchanging these between the two objectives and you're sort of paying for one with the other everybody These are all just vague ideas, but they're about to be not vague very soon that okay"}],"notes":["本段讲解了帕累托最优的概念，即一个解在多个目标上无法被其他解全面超越。讲者指出，帕累托最优意味着没有人能通过一个解在所有目标上与之匹配并至少在一个目标上超越它。这种概念在优化问题中非常重要，尤其是在多目标优化中。","讲者通过一个生产计划的例子来说明帕累托最优。他提到，如果一个计划在所有资源上与另一个计划匹配，并且在至少两个资源上超越它，那么该计划就支配了另一个计划，而被支配的计划就不是帕累托最优的。","讲者进一步指出，帕累托最优的解集合被称为帕累托前沿，这些解之间无法直接比较，因为它们在不同的目标上各有优劣。这种权衡关系可以用权衡曲线来表示，即最优权衡曲线。","讲者提到，权衡曲线上的点代表了在不同目标之间进行权衡的最优解。这些点之间无法直接比较，因为它们在不同的目标上各有优势，因此需要通过权衡来选择。","讲者还提到，帕累托最优的概念可以与经济学中的交换和支付关系联系起来，即在不同目标之间进行交换时，需要付出相应的代价。这种经济解释为帕累托最优提供了直观的理解。","最后，讲者指出，虽然这些概念目前还比较模糊，但接下来的内容将更加具体和明确，帮助学生更好地理解帕累托最优和权衡曲线的概念。"],"formulas":[],"uncertainties":["exchanging these between the two objectives and you're sort of paying for one with the other everybody"],"diagram":"none","start":676.86,"end":847.38,"asr_flags":[],"raw_segments":[{"start":676.86,"text":"It means you're non-dominated. It means you say, well, I have an X, and you get these Q different scores or objective values. Then what you know if you are Pareto optimal is that nobody can embarrass you. Embarrass you means, oh yeah, well, I've got an X that matches you on all and beats you on at least one. That was informal, but it was actually a precise statement of what it meant to be Pareto optimal. Everybody got that?"},{"start":705.34,"text":"Right. So, yeah, so you'd say, well, I know how to I know how to do my production. So I will use I'll take your plan for production and I'll say, yeah, I got a plan. Mine of the 12 resources that we both use, I match you on all and I beat you on two. That means my plan dominates yours."},{"start":724.39,"text":"Which means yours is not Pareto optimal. Of course, mine need not be either. But that's what it means. So I think these are ideas you've seen before. They're very simple and I think intuitive. But I think it's not a bad thing to actually have it called out with a name associated with it. So the one thing that people in a lot of areas, when you talk about Pareto optimal, they talk about..."},{"start":749.8,"text":"you talk about trade-offs, which is, I think, an extremely good way to say it. So if you look back over here, remember this is an optimization problem where we're basically optimizing two things. We want the first component small, so left is good, and we want the second component small, which means down is good. And then..."},{"start":774.45,"text":"And so what we would do is, if someone pointed to... So that's a stupid choice. That's an impossible choice. Perfectly nice one, but impossible. This is possible, but stupid. These are the not stupid ones, or the Pareto ones, or something like that. And they refer to this as an optimal trade-off curve. And then if you were to choose these two points and say, let's discuss..."},{"start":800.42,"text":"Right? Let's compare. And you would say, well, neither is better than the other. Right? Because they're not comparable. It is not the case that, you know, one does. And then you'd say, well, what happened? And you'd say, well, if I was going to compare this point and this point, what I would say is this point up here beats this one in the first objective, but pays for it with the second because it's higher."},{"start":825.5,"text":"Okay, and so that's and that actually gets you kind of to some economics. I mean a simple economic interpretation where you are Exchanging these between the two objectives and you're sort of paying for one with the other everybody These are all just vague ideas, but they're about to be not vague very soon that okay Okay"}],"speech_gaps":[],"frame":"../frames/v007/005.webp","frame_time":688.86},{"title":"多目标优化与投资组合构建","segments":[{"id":35,"text":"So, I mean, here's an example. It's a bicriterion problem with two objectives, right? And in fact, the object, I mean, this is basically a least squares objective. So this might be a, you know, this could be your least squares training error or something. Sorry, you know, and then this would be like."},{"id":36,"text":"you know if you're doing ridge regression which we'll get to later um you know then then so this but actually this is interesting what this does is it says here's what i mean the semantics of this is someone saying choose an x and you say how will you be judged and you say you will be judged by two numbers number one this thing you want to call that your tracking error training error whatever you like i don't care you'll be judged by that one number and you'd say"},{"id":37,"text":"I want you to please try to satisfy approximately AX equals B. You say, oh, but at the same time, I don't want X to be too big. And that's the second number you are judged by. And so this is an example of that set O. And so what it says is, well, we didn't do it this way because you can actually calculate that set, but it doesn't matter. But in principle, what we did is we took all Xs in Rn."},{"id":38,"text":"We evaluated that number and that number. That's a two vector. And I put a dark spot wherever that happened. Everybody got it? And so this is what's achievable. Now, everything up here is ridiculous and silly, right? Because the semantics is left is good, down is good, right? So it turns out the only ones you should possibly ever consider are the, you could say either the minimal ones in O or the Pareto optimal ones or something like that. And that's this little curve right here."},{"id":39,"text":"Okay, including the endpoints, right? So that's the, everybody got that? So you would, if in fact you cared only in your choice of x about these two numbers, then it would be extremely silly to choose any choice of x other than the ones on that line."},{"id":40,"text":"And then the way we would say this is we'd say things like, if you wanted to compare this point and this point, we would say, oh, you just traded off fitting error with the size of your parameters or however you want to say it. That's how you would say it. So again, this is all kind of obvious, but this is what it looks like. Okay. Here's a famous one. So in..."},{"id":41,"text":"You're doing portfolio construction. So I'll say a little bit about it just so everybody is kind of on the same page. So X, that's an investment portfolio. And it's usually normalized to one. Actually, this is the case where they're all non-negative and add up to one. So it's actually a set of mixture weights. And basically tells you what fraction of your wealth."}],"notes":["本段讲解了多目标优化问题，其中涉及两个目标函数，例如最小化训练误差和控制参数大小。讲者提到，这种问题可以通过将两个目标函数组合成一个向量来表示，并在二维空间中寻找可行解。讲者还指出，只有那些在Pareto最优解集中的点才值得考虑，因为其他点在两个目标上都不如这些点优。","讲者通过一个投资组合构建的例子来说明多目标优化的应用。投资组合通常被归一化为1，且所有权重非负且总和为1。这表示了不同资产在投资组合中的比例，从而帮助投资者在风险和收益之间进行权衡。","讲者强调，在多目标优化中，选择不在Pareto前沿的点是不合理的，因为这些点在两个目标上都不如前沿上的点。因此，优化问题的解通常集中在Pareto前沿上。","讲者提到，当两个目标函数被组合成一个向量时，可以通过在二维空间中寻找可行解来表示问题。这种表示方法有助于直观地理解不同解之间的权衡关系。","讲者指出，多目标优化问题的解通常是一个曲线，称为Pareto前沿。这个曲线上的点代表了在两个目标之间进行权衡的最优解。","讲者通过投资组合构建的例子，说明了多目标优化在实际中的应用。投资组合的构建需要在风险和收益之间进行权衡，这正是多目标优化问题的一个典型应用场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":849.82,"end":1014.21,"asr_flags":[],"raw_segments":[{"start":849.82,"text":"So, I mean, here's an example. It's a bicriterion problem with two objectives, right? And in fact, the object, I mean, this is basically a least squares objective. So this might be a, you know, this could be your least squares training error or something. Sorry, you know, and then this would be like."},{"start":867.85,"text":"you know if you're doing ridge regression which we'll get to later um you know then then so this but actually this is interesting what this does is it says here's what i mean the semantics of this is someone saying choose an x and you say how will you be judged and you say you will be judged by two numbers number one this thing you want to call that your tracking error training error whatever you like i don't care you'll be judged by that one number and you'd say"},{"start":891.43,"text":"I want you to please try to satisfy approximately AX equals B. You say, oh, but at the same time, I don't want X to be too big. And that's the second number you are judged by. And so this is an example of that set O. And so what it says is, well, we didn't do it this way because you can actually calculate that set, but it doesn't matter. But in principle, what we did is we took all Xs in Rn."},{"start":917.68,"text":"We evaluated ctually one of the"},{"id":43,"text":"assets in Stanford's endowment, right? So that's this. And then this is asking, you know, how to make a mixture of it. By the way, later we'll talk about it, but you can violate this, right? So, and it has a meaning, right? So you can actually have, oh, and you can interpret the Xs as percentages, right? So if I could give you, if X was, if I had four asset class, I mean, this would be like really dumb, but, you know, be like, you know, stocks, bonds, and cash."},{"id":44,"text":"You know, and I could give you like 60, 40 and zero or something. Right. Something like that. That would you've heard of these things. Right. But in fact, you can actually in stuff that we'll see later, you can actually let X get negative. And you might ask, that's weird. What does it mean to hold negative five percent of your portfolio in? I don't know. You know, whatever. It doesn't matter. You know, medium term corporate bonds. Everybody see what I'm saying? So if you."},{"id":45,"text":"So I can explain, again, this is, by the way, all of this for most of you, this is nothing but like cultural enrichment. Just so if you ever bump into someone who is interested in this, you know what they're talking about. So if you do genetics, too bad. Sorry about that. But it's not bad to know these things, right? To know how optimization is used in other fields. Okay, so what does it mean to own negative 5% in whatever medium-term corporate bonds, right?"},{"id":46,"text":"What it means is you borrow that asset from someone, right? You now have the obligation to pay them back, right? And so you borrow it and immediately sell it, okay? Then later when they come ask, when the investment period is over, they go, you know, hey, give me my bond back. You buy it."},{"id":47,"text":"um, on the open market. If the price went down, it's cheaper and you did well, everybody got that. So again, you don't need it, but what's really cool about it is all the math goes through.  the covariance of these things. Okay. Everybody following this? Okay. You care about two things, which is you would like a portfolio, which on average kind of goes up."},{"start":1281.92,"text":"So you want high mean return. And a lot of people drop the mean and just say high return, right? So that would be how they would say. Of course, that doesn't tell you that every day it's going to go up. It just tells you that if you believe the statistical models, which, by the way, are not very good, and if you were to wind back and repeat that day 10,000 times and take the average, it would have gone up."},{"start":1306.54,"text":"Since the latter is impossible and the first is also false, that's the rough idea. And this thing, that's the variance, that measures actually, that's called the risk of the portfolio. And if you take the square root, it's the standard deviation. And it says, if I'm a portfolio manager and I wake up in the morning, have my coffee, then try to find out, did Stanford's endowment go up or down today? Then I take the mean square value of that."},{"start":1334.13,"text":"That's going to be the risk of the portfolio. It's called volatility or something like that. Again, this is just so you get the idea. So this is really a bi-criterion problem. So I've got two objectives, which is risk and return. Well, the return I want big and the risk I want small. So I could have done this with some sick cone."}],"speech_gaps":[],"frame":"../frames/v007/008.webp","frame_time":1194.42},{"title":"风险与回报的权衡曲线","segments":[{"id":56,"text":"that was kind of like r plus cross minus r plus or something like that, so but the problem with that is then your head explodes if you, I mean, it's correct but it's hard to keep track of, so we'll just we'll just do it this way, we're going to minimize that negative return because we really want that to be high, and the and the variance right, so that's the idea, okay, um, that's what it looks like, um, and then what you could do uh here is you can actually just"},{"id":57,"text":"look through, you can walk through, there's a Pareto surface, right? Here, which is on, and those correspond to the non-dominated portfolios. And they actually will trade, they'll trade off a curve that will look like this. This is a very standard curve. It's a risk return trade-off curve, right? And now I haven't drawn it. If I was going to do this, I would flip one sign of it and all that kind of stuff. But this is the traditional way people show it with risk, sorry, return this way and risk this way."},{"id":58,"text":"Okay? So that's the idea. So in this, without the flips of sign here, left is good, right? And up is good, right? And so you get something that looks like that. Yeah, there's a question. Is this considered convex because the negative changes things a little bit?"},{"id":59,"text":"This is absolutely, this is convex, right? Because here, the rule to, in multi-criterion, if I'm minimizing, each objective has to be convex, right? So this is convex quadratic, the risk, right? And the negative return is affine. So it's convex. Cool? Okay. But yeah, do check, right? I just write these things down without saying that, but that's what it is. Okay."},{"id":60,"text":"Anyway, so this shows you, and you would describe this as the risk-return trade-off curve. And there's some, I don't know, there's even some name which I've forgotten. I forget what this is called. This is called the, I don't even remember anymore. But it's got some, is someone here know? Anyway, it doesn't matter. It's the risk-return trade-off curve. Let's just leave it that way. Or the risk-return optimal trade-off curve. And so this is what it looks like."},{"id":61,"text":"And what this shows is actually the... So here I have four assets, so they add to one. This is a stack plot, right? So a stack plot says if you... Each vertical here gives you a point on the optimal risk-return trade-off curve. And at this point, you've got a little bit of X1, a little bit of X2, ooh, a bunch of X3, and a bunch of X4."},{"id":62,"text":"So over here, when you insist on 0% return, you get x4. By the way, x4 is probably cash, which would have no risk."}],"notes":["本段讲授了风险与回报的权衡曲线，即Pareto前沿。在投资组合优化中，投资者需要在风险和回报之间进行权衡，而Pareto前沿表示了非支配的最优解集合。曲线上的每个点代表一个投资组合，它在风险和回报之间达到某种平衡。","课程中提到，风险与回报的权衡曲线是凸优化问题的一个典型例子。在多目标优化中，每个目标函数需要是凸函数，这样整个问题才是凸的。这里，风险是凸二次函数，而负回报是仿射函数，因此整体问题保持凸性。","在讨论凸性时，讲者指出，即使有负号，只要每个目标函数是凸的，整个问题仍然是凸的。这表明，即使在处理负回报时，只要保持函数的凸性，问题仍然是可解的。","讲者还提到，风险与回报的权衡曲线通常被称为风险-回报权衡曲线或最优风险-回报权衡曲线。曲线上的每个点对应一个投资组合，它在风险和回报之间达到某种平衡。","在具体例子中，讲者提到有四个资产，它们的权重总和为1。通过堆叠图（stack plot），可以直观地看到每个投资组合在风险-回报曲线上的位置。例如，当要求0%回报时，投资组合主要由无风险资产（x4）构成。","最后，讲者指出，x4可能代表现金，因为它没有风险。这说明在投资组合中，无风险资产可以用来调整整体的风险水平，从而达到特定的回报目标。"],"formulas":[],"uncertainties":["r plus cross minus r plus or something like that","flip one sign of it and all that kind of stuff"],"diagram":"none","start":1360.89,"end":1529.21,"asr_flags":[],"math_clarifications":["原始文本中提到的公式缺乏明确的数学表达和上下文，无法核定其正确性。"],"raw_segments":[{"start":1360.89,"text":"that was kind of like r plus cross minus r plus or something like that so but the problem with that is then your head explodes if you i mean it's correct but it's hard to keep track of so we'll just we'll just do it this way we're going to minimize that negative return because we really want that to be high and and the and the variance right so that's the idea okay um that's what it looks like um and then what you could do uh here is you can actually just"},{"start":1388.12,"text":"look through, you can walk through, there's a Pareto surface, right? Here, which is on, and those correspond to the non-dominated portfolios. And they actually will trade, they'll trade off a curve that will look like this. This is a very standard curve. It's a risk return trade-off curve, right? And now I haven't drawn it. If I was going to do this, I would flip one sign of it and all that kind of stuff. But this is the traditional way people show it with risk, sorry, return this way and risk this way."},{"start":1418.28,"text":"Okay? So that's the idea. So in this, without the flips of sign here, left is good, right? And up is good, right? And so you get something that looks like that. Yeah, there's a question. Is this considered convex because the negative changes things a little bit?"},{"start":1439.44,"text":"This is absolutely, this is convex, right? Because here, the rule to, in multi-criterion, if I'm minimizing, each objective has to be convex, right? So this is convex quadratic, the risk, right? And the negative return is affine. So it's convex. Cool? Okay. But yeah, do check, right? I just write these things down without saying that, but that's what it is. Okay."},{"start":1469.74,"text":"Anyway, so this shows you, and you would describe this as the risk-return trade-off curve. And there's some, I don't know, there's even some name which I've forgotten. I forget what this is called. This is called the, I don't even remember anymore. But it's got some, is someone here know? Anyway, it doesn't matter. It's the risk-return trade-off curve. Let's just leave it that way. Or the risk-return optimal trade-off curve. And so this is what it looks like."},{"start":1496.43,"text":"And what this shows is actually the... So here I have four assets, so they add to one. This is a stack plot, right? So a stack plot says if you... Each vertical here gives you a point on the optimal risk-return trade-off curve. And at this point, you've got a little bit of X1, a little bit of X2, ooh, a bunch of X3, and a bunch of X4."},{"start":1520.65,"text":"So over here, when you insist on 0% return, you get x4. By the way, x4 is probably cash, which would have no risk."}],"speech_gaps":[],"frame":"../frames/v007/009.webp","frame_time":1372.89},{"title":"凸优化中的风险资产与标量化","segments":[{"id":63,"text":"Right. I don't know what X1 is, but it's probably the most risky of the assets. Right. And so as you take you would say, I'll use the language people would use as you take on more risk. You get a portfolio that actually at some point you stop holding any cash and you only hold this. Maybe these are like bonds or something. I don't know. Right. Then then you start taking on, you know."},{"id":64,"text":"uh whatever you know some some type and then this this would be large cap stocks and these would be like small cap or something i'm i'm just making this up but not entirely right so it would look something like this so this all this makes sense so this is this is the picture and you'll you'll see variations on this on this sort of thing all over the place um okay"},{"id":65,"text":"By the way, a little bit later, I will show how you actually compute this. And for that matter, you will be doing it on your homework. It's due Friday. So it's actually quite straightforward to do this. So now we're going to talk about scalarization. So scalarization, it refers to taking a vector objective and then mapping it down to a single score."},{"id":66,"text":"That will give you a linear ordering because when we scalarize, you had a production design and I had one, one of ours is better because it comes up to a certain number. Now, let's see how to do that."},{"id":67,"text":"Well, you'll remember from a couple weeks ago, we talked about what happens if you take a vector that's positive in the dual cone, right? And you minimize lambda transpose f of x, that's guaranteed to give you a minimal point, which we now in this context refer to as a Pareto optimal point. Okay? So, it says..."},{"id":68,"text":"This problem here is an ordinary convex optimization problem. There's a whole bunch of subtleties that I'm not mentioning. Here's one. If f0 of x is k-convex, that means it's a vector function, which is k-convex. It's convex with respect to the cone k. If I take lambda as positive in the dual cone, then that's a scalar function."},{"id":69,"text":"That scalar function is convex. So that's the first thing. So this is an ordinary old convex optimization problem. And, you know, the picture is pretty cool, right? It basically says if here's O, what I do is let me look at level curves of lambda transpose F0 of X, right? And so those are going to be basically hyperplanes in this O space. And then what you want to do is you want to go as far as you can this way, right?"}],"notes":["本段首先讨论了风险资产的配置问题，其中X1被假设为最风险的资产。讲者提到随着风险的增加，投资组合会逐渐减少现金持有，转而持有更多高风险资产，如股票或债券。这些例子帮助理解资产配置的动态变化。","接下来，讲者提到将向量目标函数映射为单一标量值的过程，即标量化。这一过程可以产生线性排序，因为标量化后可以比较不同方案的优劣。","在标量化过程中，讲者回顾了之前讨论的内容，即当向量在对偶锥中为正时，通过最小化lambda转置f(x)可以得到一个Pareto最优解。这表明标量化方法在优化问题中的应用。","讲者进一步指出，该问题是一个普通的凸优化问题，其中f0(x)是k-凸函数，即相对于锥k是凸的。当lambda在对偶锥中为正时，标量函数是凸的，这保证了问题的凸性。","最后，讲者提到通过观察lambda转置F0(x)的等高线（即超平面）来寻找最优解。这表明在凸优化中，通过几何方法可以直观地理解优化过程。","整个段落强调了凸优化在实际问题中的应用，如资产配置和标量化方法，同时指出这些方法在计算和理论上的基础。"],"formulas":[{"latex":"\\text{minimize } \\boldsymbol{\\lambda}^T f(x)","symbols":"最小化 lambda 转置 f(x)","explanation":"该公式正确表达了通过最小化lambda转置f(x)来得到Pareto最优解的标量化方法，符合原文描述。","evidence":"Well, you'll remember from a couple weeks ago, we talked about what happens if you take a vector that's positive in the dual cone, right? And you minimize lambda transpose f of x, that's guaranteed to give you a minimal point, which we now in this context refer to as a Pareto optimal point. Okay? So, it says..."},{"latex":"\\text{level curves of } \\boldsymbol{\\lambda}^T F_0(x)","symbols":"lambda 转置 F0(x) 的等高线","explanation":"该公式正确描述了lambda转置F0(x)的等高线，即超平面，用于寻找凸优化问题的最优解，符合原文描述。","evidence":"That scalar function is convex. So that's the first thing. So this is an ordinary old convex optimization problem. And, you know, the picture is pretty cool, right? It basically says if here's O, what I do is let me look at level curves of lambda transpose F0 of X, right? And so those are going to be basically hyperplanes in this O space. And then what you want to do is you want to go as far as you can this way, right?"}],"uncertainties":["lambda transpose f of x"],"diagram":"none","start":1529.99,"end":1688.03,"asr_flags":[],"math_clarifications":["公式0无法核定，因为原文未明确说明k-凸函数的定义和条件，且未提供足够的上下文来验证其数学正确性。"],"raw_segments":[{"start":1529.99,"text":"Right. I don't know what X1 is, but it's probably the most risky of the assets. Right. And so as you take you would say, I'll use the language people would use as you take on more risk. You get a portfolio that actually at some point you stop holding any cash and you only hold this. Maybe these are like bonds or something. I don't know. Right. Then then you start taking on, you know."},{"start":1551.7,"text":"uh whatever you know some some type and then this this would be large cap stocks and these would be like small cap or something i'm i'm just making this up but not entirely right so it would look something like this so this all this makes sense so this is this is the picture and you'll you'll see variations on this on this sort of thing all over the place um okay"},{"start":1572.79,"text":"By the way, a little bit later, I will show how you actually compute this. And for that matter, you will be doing it on your homework. It's due Friday. So it's actually quite straightforward to do this. So now we're going to talk about scalarization. So scalarization, it refers to taking a vector objective and then mapping it down to a single score."},{"start":1597.73,"text":"That will give you a linear ordering because when we scalarize, you had a production design and I had one, one of ours is better because it comes up to a certain number. Now, let's see how to do that."},{"start":1613.55,"text":"Well, you'll remember from a couple weeks ago, we talked about what happens if you take a vector that's positive in the dual cone, right? And you minimize lambda transpose f of x, that's guaranteed to give you a minimal point, which we now in this context refer to as a Pareto optimal point. Okay? So, it says..."},{"start":1636.77,"text":"This problem here is an ordinary convex optimization problem. There's a whole bunch of subtleties that I'm not mentioning. Here's one. If f0 of x is k-convex, that means it's a vector function, which is k-convex. It's convex with respect to the cone k. If I take lambda as positive in the dual cone, then that's a scalar function."},{"start":1661.47,"text":"That scalar function is convex. So that's the first thing. So this is an ordinary old convex optimization problem. And, you know, the picture is pretty cool, right? It basically says if here's O, what I do is let me look at level curves of lambda transpose F0 of X, right? And so those are going to be basically hyperplanes in this O space. And then what you want to do is you want to go as far as you can this way, right?"}],"speech_gaps":[],"frame":"../frames/v007/010.webp","frame_time":1541.99},{"title":"多目标优化与标量化","segments":[{"id":70,"text":"And in this case, you would find this point. And sure enough, it is indeed an optimal point, right? And also, a lot of other ideas come up here that you would see. You could see that right here, this is tangent to this thing. And that roughly means it's got a slope that's like, you know, minus one over lambda or something. But it basically tells you locally the trade-off between the two variables. Between, sorry, the two objectives."},{"id":71,"text":"Right? So there's going to be... It's like an exchange rate. We'll get to that. And in fact, it is correct to think of the lambda here as a vector of prices. We'll get to that. Okay. So in some ways, this is making something very intuitive, kind of fancy. But that's okay. This doesn't bother me, right? Like, I mean, a gazillion people see multi-criterion optimization all the time."},{"id":72,"text":"But all they do is they just immediately do without even saying anything. They just say, how do we solve it? And you go, we'll just throw in some weights, right? Like you're doing regularization in machine learning. So you throw in loss plus lambda. Why is this dinging at me?"},{"id":73,"text":"There we go. You throw in loss plus lambda times your regularizer. Everybody, you've seen this and you've seen this in lots of it. And people, they don't even say anything about it, but it's because it's obvious and it's fine. But this is kind of, this is what you were doing."},{"id":74,"text":"Okay. Now for multi-criterion problems, we can be a lot more specific about what... what this particular scalarization does. So what it does is, it's actually kind of cool. It basically says, here are these things that you want small. F capital F1 all the way to capital FQ. You want them all small. Then these are positive numbers. And we can actually literally interpret the lambdas as literally the price of"},{"id":75,"text":"that objective. That's how much you will pay. If that's 12 and that's like, you know, whatever, 10, then this is going to cost you 120 bucks. So the lambdas are literally prices here, right? And this would be like, for example, if we had two production, you say, well, I know how to do, or, you know, if I'm designing a circuit and I say I want both the area to be small, the dynamic power to be small, you know, these kinds of, these types of things, we would just set prices."},{"id":76,"text":"for those objectives and then this is the total price what's interesting there is you can change the prices and you'll get a different choice in fact this is what will allow you to actually move along the trade-off curve if there's two if there's more people call it the trade-off surface everybody got this so it's all pretty straightforward but it's kind of it it's interesting to look at so here we go um let's do the regularized least square i mean this is uh"}],"notes":["本段讲授了多目标优化问题中标量化方法的直观解释，将λ视为不同目标的权重或价格。通过将多个目标函数加权求和，可以将多目标问题转化为单目标问题，从而更容易求解。","讲者提到，这种标量化方法在机器学习中非常常见，例如正则化方法中将损失函数与正则项相加，其中λ作为正则化系数，控制不同目标之间的权衡。","讲者进一步说明，λ可以被理解为不同目标的“价格”，即在优化过程中需要付出的代价。例如，如果一个目标的权重较大，那么在优化过程中需要付出更多的代价来满足该目标。","讲者还提到，通过调整λ的值，可以沿着权衡曲线（trade-off curve）移动，从而找到不同的最优解。当有多个目标时，这种权衡关系会形成一个权衡曲面（trade-off surface）。","讲者指出，虽然这种标量化方法在实际中被广泛使用，但其背后的数学原理和经济学意义（如价格机制）需要更深入的理解。","最后，讲者提到将要讲解正则化最小二乘法（regularized least square），并指出这是多目标优化的一个典型应用。"],"formulas":[{"latex":"F_1 + \\lambda \\times F_2","symbols":"lambda 表示不同目标的权重或价格","explanation":"公式正确表达了多目标优化中通过引入权重λ来对不同目标进行加权求和，λ可视为各目标的相对价格或权重。","evidence":"But all they do is they just immediately do without even saying anything. They just say, how do we solve it? And you go, we'll just throw in some weights, right? Like you're doing regularization in machine learning. So you throw in loss plus lambda. Why is this dinging at me? that objective. That's how much you will pay. If that's 12 and that's like, you know, whatever, 10, then this is going to cost you 120 bucks. So the lambdas are literally prices here, right? And this would be like, for example, if we had two production, you say, well, I know how to do, or, you know, if I'm designing a circuit and I say I want both the area to be small, the dynamic power to be small, you know, these kinds of, these types of things, we would just set prices."}],"uncertainties":["what's interesting there is you can change the prices and you'll get a different choice in fact this is what will allow you to actually move along the trade-off curve if there's two if there's more people call it the trade-off surface everybody got this so it's all pretty straightforward but it's kind of it it's interesting to look at so here we go um let's do the regularized least square i mean this is uh"],"diagram":"none","start":1689.41,"end":1865.49,"asr_flags":[],"math_clarifications":["公式F_1 + \\lambda \\times F_2是多目标优化中常见的标量化方法，其中λ表示不同目标的权重或价格。"],"raw_segments":[{"start":1689.41,"text":"And in this case, you would find this point. And sure enough, it is indeed an optimal point, right? And also, a lot of other ideas come up here that you would see. You could see that right here, this is tangent to this thing. And that roughly means it's got a slope that's like, you know, minus one over lambda or something. But it basically tells you locally the trade-off between the two variables. Between, sorry, the two objectives."},{"start":1716.3,"text":"Right? So there's going to be... It's like an exchange rate. We'll get to that. And in fact, it is correct to think of the lambda here as a vector of prices. We'll get to that. Okay. So in some ways, this is making something very intuitive, kind of fancy. But that's okay. This doesn't bother me, right? Like, I mean, a gazillion people see multi-criterion optimization all the time."},{"start":1743.96,"text":"But all they do is they just immediately do without even saying anything. They just say, how do we solve it? And you go, we'll just throw in some weights, right? Like you're doing regularization in machine learning. So you throw in loss plus lambda. Why is this dinging at me?"},{"start":1763.58,"text":"There we go. You throw in loss plus lambda times your regularizer. Everybody, you've seen this and you've seen this in lots of it. And people, they don't even say anything about it, but it's because it's obvious and it's fine. But this is kind of, this is what you were doing. Okay. Now for multi-criterion problems, we can be a lot more specific about what..."},{"start":1783.57,"text":"what this particular scalarization does. So what it does is, it's actually kind of cool. It basically says, here are these things that you want small. F capital F1 all the way to capital FQ. You want them all small. Then these are positive numbers. And we can actually literally interpret the lambdas as literally the price of"},{"start":1809.4,"text":"that objective. That's how much you will pay. If that's 12 and that's like, you know, whatever, 10, then this is going to cost you 120 bucks. So the lambdas are literally prices here, right? And this would be like, for example, if we had two production, you say, well, I know how to do, or, you know, if I'm designing a circuit and I say I want both the area to be small, the dynamic power to be small, you know, these kinds of, these types of things, we would just set prices."},{"start":1838.03,"text":"for those objectives and then this is the total price what's interesting there is you can change the prices and you'll get a different choice in fact this is what will allow you to actually move along the trade-off curve if there's two if there's more people call it the trade-off surface everybody got this so it's all pretty straightforward but it's kind of it it's interesting to look at so here we go um let's do the regularized least square i mean this is uh"}],"speech_gaps":[],"frame":"../frames/v007/011.webp","frame_time":1701.41},{"title":"正则化最小二乘法与多目标优化","segments":[{"id":77,"text":"Here we go. Regularized least squares is, I want this thing interpreted as a fitting error to small, and then I want also the x, which in this case we'd interpret as the parameters in a regression model. I want those to be small. We'll talk much more about that later. So how do I do that?"},{"id":78,"text":"I will take something that's a positive two vector. By the way, if I multiply that vector, I can scale it by any positive number, and I'm going to get, when I solve this problem, I'm going to get this. It's just a multiple of this. So I can, without loss generality, make the first one one. By the way, people often call, they often interpret the first objective, they call that their primary objective. And then, in this case, you'd say, well, our training loss is the..."},{"id":79,"text":"By the way, people often call, they often interpret the first objective, they call that their primary objective. And then, in this case, you'd say, well, our training loss is the primary objective and your secondary objective is that the parameter shouldn't be big, right? And so that gives you, and so basically gamma is a translation, it's an exchange rate that tells you how much large x irritates you compared to large residual. That's what it tells you."},{"id":80,"text":"If it's 15, it means, I don't know, it means something, right? A lot. It depends on the units of these things, right? Oh, by the way, in many cases, it's actually very cool to think in terms of, to put the physical units in there, right? If one objective is fuel use, it might be in kilograms of fuel. Another objective could be the smoothness of the ride. It could literally be something like the RMS value of the jerk."},{"id":81,"text":"People know what that is? Sorry. Okay, that was quasi-slang, quasi-dialect. So in control and mechanical engineering, you have the position, first derivative, second derivative is acceleration, and the third is jerk. And then after that, the fourth derivative is snap. Good, snap, right? So this is just universal."},{"id":82,"text":"So for example, when you get on a fancy modern elevator, Not in this country, but if you had one that had real technology, you got a fancy one. You wouldn't even feel moving. The reason is they actually have a trajectory that has minimized the snap. Everybody got that? Also, I think drone trajectories are designed to minimize snap. So if you minimize the snap, that's the fourth derivative. Again, this is cultural enrichment. You don't need to know this, but it's fun."}],"notes":["本段讲解了正则化最小二乘法中如何通过引入正则项来控制参数的大小，同时强调了目标函数中不同项的优先级。讲者提到，正则化项可以视为一种‘交换率’，用于衡量参数大小与残差大小之间的相对重要性。","讲者通过一个实际例子说明了如何将物理单位引入优化问题中，例如将燃油消耗作为目标函数的一部分，或者将乘坐舒适度（如加速度的均方根值）作为另一个目标。这种做法有助于更直观地理解优化问题的物理意义。","讲者进一步解释了控制和机械工程中常用的导数术语，如位置、速度、加速度、加加速度（jerk）和加加加速度（snap）。这些术语在优化问题中用于描述系统动态行为，例如电梯和无人机轨迹设计中对平滑性的要求。","讲者提到，虽然这些术语在某些领域是文化背景知识，但它们在优化问题中具有实际意义。例如，电梯轨迹设计中通过最小化snap来实现平滑运动，而无人机轨迹设计也遵循类似原则。","讲者强调了正则化项中参数γ的作用，即它决定了参数大小与残差大小之间的权衡。γ的取值会影响最终的优化结果，因此需要根据具体问题进行调整。","讲者通过举例说明了如何将物理单位和工程术语融入优化问题，这有助于更直观地理解和解释优化模型的实际应用。"],"formulas":[{"latex":"||Ax - b||^2 + \\rho ||x||^2","symbols":"正则化最小二乘法的目标函数","explanation":"该公式表示正则化最小二乘法的目标函数，其中第一项是拟合误差的平方和，第二项是参数的正则化项，用于控制参数的大小。适用假设为A为设计矩阵，x为参数向量，b为观测向量，ρ为正则化参数。","evidence":"Here we go. Regularized least squares is, I want this thing interpreted as a fitting error hat line, is not a good approximation of the true one. Also, it shows you all sorts of weird differences, right? Like, in the true optimization problem, if you have, like..."}],"notes":["本段讲解了约束优化问题的基本概念，即通过定义目标函数和约束函数来构建优化问题。当约束被违反时，问题变得不可接受，因此需要通过某种方式处理约束，例如使用指示函数将约束问题转化为无约束问题。","讲者提到，可以通过引入一个指示函数，将约束条件转化为一个惩罚项，该惩罚项在约束被满足时为零，在被违反时为无穷大。这样，原约束优化问题就等价于最小化目标函数加上这个惩罚项的组合。","在处理约束优化问题时，拉格朗日函数被引入，它由目标函数和约束函数的线性组合构成，其中拉格朗日乘子λ决定了约束的权重。讲者指出，这种近似方法并不理想，因为拉格朗日函数的线性近似无法准确反映原问题的结构。","讲者强调，这种将约束问题转化为无约束问题的方法虽然在理论上可行，但在实际应用中并不总是有效，因为拉格朗日函数的线性近似可能无法捕捉到原问题的复杂性。","此外，讲者还提到，这种近似方法可能会导致一些奇怪的差异，例如在原问题中，某些点可能被错误地认为是可行解，而实际上它们并不满足约束条件。","最后，讲者指出，这种将约束问题转化为无约束问题的方法虽然在某些情况下有用，但需要谨慎使用，因为它可能无法准确反映原问题的性质。"],"formulas":[],"uncertainties":["indicator function of f1 of x is less than zero","lambda f1 of x"],"diagram":"none","start":2538.02,"end":2703.74,"asr_flags":[],"math_clarifications":["原句中未明确指示函数的数学定义，且未说明其与目标函数的组合方式，因此无法核定。"],"raw_segments":[{"start":2538.02,"text":"So I'm just going to draw, let's have a problem, this is zero, and this is going to be f1 of"},{"start":2543.44,"text":"x, right? This is just f1 of x. And I'm going to have an objective, so I'm going to plot"},{"start":2549.76,"text":"plot f0 of x here, right? So here, if you propose to me an x, we will evaluate f0 and f1. And the"},{"start":2559.8,"text":"semantics of an optimization problem is, if you're over here, it's completely unacceptable"},{"start":2566.1,"text":"because you violate the constraint because f1 of x is positive, right? So this is unacceptable,"},{"start":2571.16,"text":"right? If you're on the left side, everything is cool and you want to go as low as possible,"},{"start":2575.92,"text":"In fact, that's the semantics of an optimization problem."},{"start":2579.14,"text":"Everybody got this?"},{"start":2580.12,"text":"So roughly speaking, you're saying, here's how I care."},{"start":2584.86,"text":"I could also make it an unconstrained problem by just writing it this way."},{"start":2589.26,"text":"The in  says, if you wanted to solve this problem, then it says immediately, if you pick any vector nu at all, and you evaluate that function, that is a lower bound on this problem. Okay? I don't know. Let's try some. Here's one. Nu equals zero."},{"id":195,"text":"What's the lower bound on this problem? If I take nu equals zero, what lower bound do I get? Zero. Okay, so then I say to you, I say to you, oh, wow, yeah, thanks for showing me your problem. I can tell you this. You ready for this? By duality, I can tell you this optimal value could never be negative. People would look at you like you're an idiot because, of course, the objective is like non-negative. Okay, everybody see what I'm saying? Okay, so, okay."},{"id":196,"text":"Let's see. Okay, so that's the lower bound. Anyway, that's the idea. But this actually already has weird applications, right? Because you could have some gigantic problem like this. We can solve it analytically. But you have some quick heuristic to do it. I mean, it could have a billion variables. And you have some quick heuristic to do it. And then you could just ask yourself, how far am I from optimal? And you would just calculate this bound."}],"notes":["本段讲解了对偶函数的性质，即对偶函数是凹函数。这是因为原问题的拉格朗日函数是凸函数，而对偶函数是拉格朗日函数关于拉格朗日乘数的下确界，因此是凹函数。","通过一个具体的例子，即最小化向量的平方和并满足约束条件x = b的问题，展示了如何构造拉格朗日函数，并通过求导得到对偶函数。该对偶函数的凹性被验证，因为其构造中包含了凸函数的负数。","对偶函数的凹性意味着它在任何拉格朗日乘数向量ν下都能提供原问题的下界。例如，当ν = 0时，对偶函数的值为0，这表明原问题的最优值不可能为负数。","该段还提到对偶函数的应用，即使在变量数量巨大的情况下，也可以通过解析方法快速求解，并通过计算对偶函数的值来评估与最优解的距离。","讲者强调了对偶函数在实际问题中的重要性，特别是在优化问题中，对偶函数可以作为评估解质量的工具。","通过具体例子和数学推导，讲者展示了对偶函数的构造过程及其性质，帮助学生理解对偶问题与原问题之间的关系。"],"formulas":[{"latex":"L(x, \\nu) = \\frac{1}{2}x^T x - \\nu^T (Ax - b)","symbols":"L(x, ν) 是拉格朗日函数，x 是变量，ν 是拉格朗日乘数，A 是矩阵，b 是向量","explanation":"此式依据本段讲述统一排版；符号含义见上文，必要时对照原视频板书。","evidence":"So here's what we do, we form the Lagrangian, that's the objective, plus New transpose, that's an equality constraint. New transpose AX minus B, that's the violation. This is a convex quadratic function. We minimize that to get the dual function. To minimize that, you just set the gradient equal to zero. It's a set of linear equations. And you get X is that. Now I plug this X back in to L."},{"latex":"g(\\nu) = \\text{inf}_{x} L(x, \\nu)","symbols":"g(ν) 是对偶函数，表示拉格朗日函数关于x的下确界","explanation":"此式依据本段讲述统一排版；符号含义见上文，必要时对照原视频板书。","evidence":"That's the Lagrangian to find what g of nu is. And when I do that, I get g of nu is this thing here. I'm not going over the algebra, but it's not much. And sure enough, look at that. That is concave. Why? Because this is convex. AA transpose is convex here. Sorry, is positive semi-definite. This is convex with the minus sign. It's going to be concave, right?"},{"latex":"g(\\nu) = -\\frac{1}{2} \\nu^T A^T A \\nu + \\nu^T b","symbols":"对偶函数的表达式，其中A^T A 是正半定矩阵，因此g(ν) 是凹函数","explanation":"此式依据本段讲述统一排版；符号含义见上文，必要时对照原视频板书。","evidence":"That's the Lagrangian to find what g of nu is. And when I do that, I get g of nu is this thing here. I'm not going over the algebra, but it's not much. And sure enough, look at that. That is concave. Why? Because this is convex. AA transpose is convex here. Sorry, is positive semi-definite. This is convex with the minus sign. It's going to be concave, right?"}],"uncertainties":[],"diagram":"none","start":3396.06,"end":3557.43,"asr_flags":[],"math_clarifications":["公式中的符号和表达式均符合数学规范，未发现明显错误。"],"raw_segments":[{"start":3396.06,"text":"Cool, okay."},{"start":3399.06,"text":"Alright, okay, let's look at some examples."},{"start":3405.14,"text":"So here's one, minimize the sum of squares of a vector subject to x equals b, it's like"},{"start":3409.92,"text":"a least norm or something like that problem, and you know there's an analytical solution"},{"start":3413.48,"text":"so this is silly, but just to see how this works, right?"},{"start":3416.84,"text":"So here's what we do, we form the Lagrangian, that's the objective, plus"},{"start":3422.28,"text":"New transpose, that's an equality constraint. New transpose AX minus B, that's the violation. This is a convex quadratic function. We minimize that to get the dual function. To minimize that, you just set the gradient equal to zero. It's a set of linear equations. And you get X is that. Now I plug this X back in to L."},{"start":3446.38,"text":"That's the Lagrangian to find what g of nu is. And when I do that, I get g of nu is this thing here. I'm not going over the algebra, but it's not much. And sure enough, look at that. That is concave. Why? Because this is convex. AA transpose is convex here. Sorry, is positive semi-definite. This is convex with the minus sign. It's going to be concave, right?"},{"start":3473.4,"text":"Sure enough, so that's good. I mean, we knew it had to be, right? But now, what's interesting about that is it says, if you wanted to solve this problem, then it says immediately, if you pick any vector nu at all, and you evaluate that function, that is a lower bound on this problem. Okay? I don't know. Let's try some. Here's one. Nu equals zero."},{"start":3504.15,"text":"What's the lower bound on this problem? If I take nu equals zero, what lower bound do I get? Zero. Okay, so then I say to you, I say to you, oh, wow, yeah, thanks for showing me your problem. I can tell you this. You ready for this? By duality, I can tell you this optimal value could never be negative. People would look at you like you're an idiot because, of course, the objective is like non-negative. Okay, everybody see what I'm saying? Okay, so, okay."},{"start":3535.31,"text":"Let's see. Okay, so that's the lower bound. Anyway, that's the idea. But this actually already has weird applications, right? Because you could have some gigantic problem like this. We can solve it analytically. But you have some quick heuristic to do it. I mean, it could have a billion variables. And you have some quick heuristic to do it. And then you could just ask yourself, how far am I from optimal? And you would just calculate this bound."}],"spee ut here it's going to be q, and that's if p equals zero. Okay? Everybody got that? So that's, okay, that was a pretty quick calculation there. And then that's what we have over here. So when I minimize this Lagrangian over x to get g,"},{"id":203,"text":"That's the dual function. I minimize this, and basically what happens is, you know, if this is non-zero, the minimum is minus infinity. Otherwise, I assume this is zero, and it's equal to that thing. So this is what I get, okay? Okay, so g is, in fact, it's a linear function restricted to a hyperplane. That's a, not a hyperplane, an affine set."}],"notes":["本段讲解了对偶函数的性质，特别是当目标函数为仿射函数时的最小值情况。当仿射函数的线性部分不为零时，最小值通常为负无穷，只有当线性部分为零时，最小值才为常数项。这说明了对偶函数在某些情况下可能不具有有限值，这与原问题的约束条件有关。","讲者通过一个具体的例子说明了仿射函数的最小值情况，即当线性部分为零时，最小值为常数项。这表明对偶函数的结构取决于原问题的约束条件和目标函数的形式。","讲者指出，当最小化仿射函数时，如果线性部分不为零，最小值为负无穷，这说明了对偶函数在某些情况下可能无法提供有用的信息，需要进一步的约束条件。","讲者还提到，对偶函数实际上是一个仿射集，这表明对偶函数的结构与原问题的约束条件密切相关，特别是在处理线性规划问题时。","讲者强调了对偶函数的计算过程，即通过最小化拉格朗日函数得到对偶函数，这需要考虑原问题的约束条件和目标函数的形式。","讲者通过具体的例子和解释，帮助学生理解对偶函数的性质，特别是在处理线性规划问题时，对偶函数的结构和最小值情况。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3558.01,"end":3735.5,"asr_flags":[],"math_clarifications":["原始片段中未明确说明 g(x) 的定义，且公式中未出现 g(x) 的定义，因此无法核对。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3558.01,"text":"You'd have to find a good choice of new, and you get a lower bound. You go, I'm 5% optimal, and you're like, totally cool, because our original problem, nothing there was accurate to more than 5% anyway. So we'll get to that. There are going to be a lot of applications of this, which we'll get to shortly. Now it's going to be not obvious. So let's do standard form linear program. So here..."},{"start":3581.6,"text":"I want to minimize this linear function subject to equality constraints and a non-negativity on x. So my Lagrangian is this. It's the objective plus equality constraints interproducted with this Lagrange multiplier nu."},{"start": his."},{"id":209,"text":"new transpose, then this must be true, right? Because x is feasible, so ax equals b, so this surely holds, right? Oh, and I'm assuming somebody came up with a new that satisfies this. Everybody agree with that? I mean, you kind of have to, right? It's like simple stuff. Okay. But then I'm going to write this thing. This says that a transpose, here, this is a transpose new."}],"notes":["本段主要讲解了对偶函数的性质，特别是其如何提供原问题的下界。讲者指出，对偶函数的下界性质来源于原问题的可行性条件，即对于任何满足约束条件的向量，对偶函数的值不会超过原问题的最优值。","讲者通过一个具体的例子来说明这一性质，即原问题是一个线性规划问题，目标是最小化c^T x，约束条件为Ax = b和x ≥ 0。对于满足a^T ν + c ≥ 0的向量ν，对偶函数的值提供了原问题最优值的下界。","讲者强调，虽然这个性质看起来很深奥，但实际上它只是基于一些基本的步骤，即原问题的可行性条件和对偶函数的定义。因此，可以通过直接证明来验证这一性质。","讲者还提到，如果有人在街上问这个问题，或者将其作为作业题，学生可能无法直接解决，因为需要理解对偶函数和原问题之间的关系。","讲者通过假设x是可行的，即满足Ax = b和x ≥ 0，来推导出对偶函数的下界性质。这表明，只要满足这些条件，对偶函数的值就会提供原问题最优值的下界。","最后，讲者指出，对偶函数的下界性质是凸优化中的一个重要概念，它帮助我们理解原问题和对偶问题之间的关系，并为后续的优化算法提供了理论基础。"],"formulas":[{"latex":"P^* \\geq -b^T \\nu","symbols":"P* ≥ -b^T ν","explanation":"原问题的最优值P*大于等于对偶函数的值，即 -b^T ν。","evidence":"That is, in fact, a concave function, right? I mean, it kind of has to be, right? And you know what this says? I'm going to rewrite this. This says that A transpose nu minus lambda plus C is zero. That means A transpose nu plus C equals lambda. Lambda is any parameter that's bigger than or equal to zero. And then I get this lower bound property. It says this. It says, you look at this linear program, and it says, yeah, you know what? The optimal value of this thing..."},{"latex":"a^T \\nu + c \\geq 0","symbols":"a^T ν + c ≥ 0","explanation":"对偶函数的约束条件，即a^T ν + c ≥ 0。","evidence":"c transpose x, and then subject to, I think it's ax equals b, and x is bigger than zero, right? And then the claim is, if somebody walks up to me on the street and says, I have a vector nu, and what is it, a transpose nu plus c is bigger than zero, they claim then, this implies that minus b transpose,"},{"latex":"Ax = b, x \\geq 0","symbols":"Ax = b, x ≥ 0","explanation":"原问题的约束条件，即A  And then we have to minimize this."},{"id":230,"text":"Now, by the way, if you look at this, you'll already see something clear. B transpose nu"},{"id":231,"text":"has nothing to do with x, so that comes out of the infimum here. But here, this is a norm"},{"id":232,"text":"minus a linear function. That's actually, that's the conjugate, actually, that's the"},{"id":233,"text":"conjugate function. So what happens, and you can also work out what that is, right? That"},{"id":234,"text":"the norm"},{"id":235,"text":"minus a linear function. When I minimize that, I either get zero or I get minus infinity, right? And so here you would get this thing. And again, I'm not going over the details. I would let you do that, but you'd get something like that. So the dual function is this linear function B transpose nu provided A transpose nu in the dual norm is less than one, right? So that's what you get. Then it says this. You want to solve this problem?"},{"id":236,"text":"Then here's a lower bound. It says a lower bound is B transpose nu for any nu that satisfies this, right? In the dual norm, right? So let's suppose this is a minimum fuel trajectory generation problem, and you want to take a satellite from where it is to where it is supposed to be, and you want to use minimum fuel. This would probably be something like an L1 norm, okay? That's your job. You work this out, and what's cool is this says,"},{"id":237,"text":"I can give, if I take any vector at all and it satisfies this, then if I evaluate B transpose nu, that's a lower bound on the minimum amount of fuel it's going to take you to get from where you are to where you're supposed to be. Everybody got this? This is already getting kind of interesting. And there should be at least very strong hints that a lot of this is unbelievably useful. So, everybody?"}],"notes":["本段讲解了对偶证书的概念，即在优化问题中，通过构造一个对偶证书来证明某个点是最优解。同时，讲者提到对偶函数的构造，即通过将原问题转化为对偶问题，并利用对偶变量来构造下界。","讲者通过一个最小燃料轨迹生成问题作为例子，说明对偶函数如何提供一个下界。这个例子中，原问题可能涉及L1范数，而对偶函数则通过对
