</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">07 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 7 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v007.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v007","title":"07 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 7","course":"凸优化","pages":[{"title":"向量优化与对偶性","segments":[{"id":0,"text":"So today, we're going to finish off with an important topic. And actually, it's one that actually you need to know a little bit in order to actually solve, I think, one of the problems on this week's homework. And that's our targeted social contract, is that for a homework due Friday, we cover all the material by the Tuesday lecture. We don't always make it, but that's our goal. That's our aspiration. Okay.","zh":"所以今天，我们将结束一个重要的主题。实际上，这个主题是你解决本周作业中一个问题所需要的。我们的目标社会契约是，对于周五截止的作业，我们将在周二的课程中覆盖所有材料。我们并不总是能做到这一点，但这是我们目标。这是我们抱负。好的。","start":5.23,"end":33.88},{"id":1,"text":"So, and then we're going to start, actually our...","zh":"然后，我们将开始，实际上我们的...","start":35.41,"end":38.45},{"id":2,"text":"One of our last theory topics, it's actually super interesting. After we cover this, we're going to jump into duality, which is fun. And we'll do that for this week. That's super interesting. And these are probably things that most of you haven't seen. Or if you've seen, people describing it didn't use the D word for that. But you will have seen arguments for it maybe in a statistics class or in other classes, certainly in economics.","zh":"我们最后一个理论主题之一，实际上非常有趣。在我们讲完这个之后，我们将进入对偶性，这很有趣。我们将在这周完成这个内容。这非常有趣。这些可能是你们大多数人没有见过的内容。或者即使你们见过，人们描述它时也没有使用“对偶”这个词。但你们可能在统计学课程或其他课程中见过相关的论证，特别是在经济学中。","start":39.02,"end":67.18},{"id":3,"text":"I don't know if they use that word or not there. We'll find out. Okay. All right. So let's go over vector optimization. Now, just to put this in context, we looked at vector inequalities. And a vector inequality, what happens is, you know, something like that is a vector, and this inequality is now to be interpreted in a vector sense. Like, this could state that a matrix variable is positive semidefinite. That would be an example.","zh":"我不知道他们是否在那些课程中使用这个词。我们到时候会知道。好的。那么，让我们回顾一下向量优化。现在，为了将其放在上下文中，我们之前讨论了向量不等式。向量不等式的情况是，比如像这样，这是一个向量，而这个不等式现在需要以向量的方式进行解释。例如，这可以表示一个矩阵变量是半正定的。这就是一个例子。","start":67.95,"end":95.39},{"id":4,"text":"Now, when we were doing that, we did not change the semantics of an optimization problem, right? The semantics was identical. And the semantics, I'll repeat it one more time, it's this. Semantics of an optimization problem is, if a point does not satisfy all the constraints, if it is not feasible, it's completely unacceptable. And there's no more discussion.","zh":"当我们进行这些讨论时，我们并没有改变优化问题的语义，对吧？语义是相同的。我再重复一遍，优化问题的语义是，如果一个点不满足所有约束条件，如果它是不可行的，那么它完全不可接受。没有更多的讨论。","start":96.8,"end":117.48},{"id":5,"text":"Among those that do satisfy all the constraints, the one with this least objective, which is a scalar in a standard optimization problem, is the best one. Everybody got that? So that's the semantics, there's nothing else to it. Now we're going to be talking about vector optimization, and what we're going to do is we're actually going to...","zh":"在那些满足所有约束条件的点中，具有最小目标值的点，即在标准优化问题中是一个标量的点，是最好的点。大家明白了吗？这就是语义，除此之外没有其他内容。现在我们将讨论向量优化，我们将实际上进行...","start":119.27,"end":138.13},{"id":6,"text":"Now, generalize not constraints, but the objective to be a vector. Now, there we're actually going to have to mess with the semantics, because what does it mean to say, you know, minimize a vector? Like, offhand, and it turns out it can mean lots of things, and not surprisingly, the main distinction is going to be things like minimal versus minimum, right?","zh":"现在，我们不推广约束，而是将目标函数推广为向量。现在，我们实际上必须处理语义问题，因为说‘最小化一个向量’是什么意思呢？说起来，这可以有多种含义，不出所料，主要的区别在于诸如最小值与极小值之类的概念，对吧？","start":138.89,"end":164.49}],"notes":["本段介绍了课程将要讨论的向量优化问题，这是课程中最后一个理论主题之一，之后将进入对偶性（duality）的讨论。对偶性是一个有趣且重要的概念，可能在统计学、经济学等其他课程中有所涉及，但通常不会明确使用‘对偶’这个词。","在标准优化问题中，语义是明确的：如果一个点不满足所有约束条件，则完全不可接受；而在满足所有约束的点中，目标函数值最小的点是最优的。然而，在向量优化中，目标函数变为向量，因此需要重新定义语义，因为‘最小化一个向量’可以有多种解释。","向量优化的核心挑战在于如何定义‘最小化’一个向量。这通常涉及到‘最小’（minimum）和‘极小’（minimal）之间的区别，这在优化理论中是一个关键概念。","课程强调，向量优化的语义与标准优化问题不同，因为目标函数不再是标量，而是向量，因此需要重新考虑优化问题的定义和求解方法。","在向量优化中，可能需要引入新的概念，如帕累托最优（Pareto optimality）或向量最小化（vector minimization），这些概念在标准优化问题中并不存在。","课程还提到，对偶性（duality）将在本周讨论，这表明对偶性是向量优化之后的重要主题，可能涉及对偶问题的构造和求解方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":164.49,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.23,"text":"So today, we're going to finish off with an important topic. And actually, it's one that actually you need to know a little bit in order to actually solve, I think, one of the problems on this week's homework. And that's our targeted social contract, is that for a homework due Friday, we cover all the material by the Tuesday lecture. We don't always make it, but that's our goal. That's our aspiration. Okay."},{"start":35.41,"text":"So, and then we're going to start, actually our..."},{"start":39.02,"text":"One of our last theory topics, it's actually super interesting. After we cover this, we're going to jump into duality, which is fun. And we'll do that for this week. That's super interesting. And these are probably things that most of you haven't seen. Or if you've seen, people describing it didn't use the D word for that. But you will have seen arguments for it maybe in a statistics class or in other classes, certainly in economics."},{"start":67.95,"text":"I don't know if they use that word or not there. We'll find out. Okay. All right. So let's go over vector optimization. Now, just to put this in context, we looked at vector inequalities. And a vector inequality, what happens is, you know, something like that is a vector, and this inequality is now to be interpreted in a vector sense. Like, this could state that a matrix variable is positive semidefinite. That would be an example."},{"start":96.8,"text":"Now, when we were doing that, we did not change the semantics of an optimization problem, right? The semantics was identical. And the semantics, I'll repeat it one more time, it's this. Semantics of an optimization problem is, if a point does not satisfy all the constraints, if it is not feasible, it's completely unacceptable. And there's no more discussion."},{"start":119.27,"text":"Among those that do satisfy all the constraints, the one with this least objective, which is a scalar in a standard optimization problem, is the best one. Everybody got that? So that's the semantics, there's nothing else to it. Now we're going to be talking about vector optimization, and what we're going to do is we're actually going to..."},{"start":138.89,"text":"Now, generalize not constraints, but the objective to be a vector. Now, there we're actually going to have to mess with the semantics, because what does it mean to say, you know, minimize a vector? Like, offhand, and it turns out it can mean lots of things, and not surprisingly, the main distinction is going to be things like minimal versus minimum, right? Because..."}],"speech_gaps":[],"frame":"../frames/v007/001.webp","frame_time":17.23},{"title":"优化问题的语义与目标函数的最小化","segments":[{"id":7,"text":"Well, vectors are generally not, the most orderings you have on them are not linear orderings. Okay, so this is what we're going to do. So it's going to look like this. And now this one, we can state what it is. That's its syntax. What we have not yet given you is the semantics, right? So I could say, I could do things like say, I mean, here'd be an example. I could say, hey,","zh":"嗯，向量通常并不是，你对它们的排序并不是线性排序。好的，所以这就是我们要做的事情。所以它看起来会是这样的。现在这个，我们可以说明它是什么。这是它的语法。我们还没有给你们的是语义，对吧？所以我可以说，我可以做一些事情，比如，我的意思是，这里会有一个例子。我可以这样说，嘿，","start":165.01,"end":188.69},{"id":8,"text":"Please find an estimator. And you go, what's your objective? And you go, make my error covariance matrix small. Everybody got that? That is a problem just like that. Of course, immediately someone would say, what do you mean by small? Right?","zh":"请找到一个估计量。然后你会说，你的目标是什么？然后你会说，让我的误差协方差矩阵尽可能小。大家明白了吗？这就是一个类似的问题。当然，马上有人会问，你所说的『小』是什么意思？对吧？","start":189.31,"end":206.44},{"id":9,"text":"Because then there could be lots of ways to say a covariance matrix is small, right? Oh, one way that would be clear is if there was one choice for which a covariance matrix was actually smaller than all others, otherwise known as a minimum, then it'd be completely unambiguous that that's what would have to be the solution of this. Everybody got that? But we'll get into this. This is kind of the idea. Okay. All right.","zh":"因为这样的话，有很多方式可以说一个协方差矩阵是小的，对吧？哦，有一种方式会很明确，那就是如果有一个选择使得协方差矩阵实际上比所有其他选择都小，也就是一个最小值，那么这就完全明确地说明这个就是这个问题的解。大家明白了吗？但我们会深入讨论这一点。这就是这个想法。好的。好了。","start":206.81,"end":235.47},{"id":10,"text":"So the first thing we'll do is let's look at the set of achievable objective values. So what that means is we screen out all choices of x which are not feasible, and we only look at the ones that are feasible. So they're the ones that don't get an immediate rejection. So we look at the ones that are feasible, and then we look at the set of objectives. Now, if this was a scalar, this O would be a subset of R. In fact, it would probably be continuous.","zh":"所以我们将首先看一下可实现的目标值集合。这意味着我们排除掉所有不可行的x的选择，只关注那些可行的选择。它们是那些不会被立即拒绝的选择。我们看一下那些可行的选择，然后看一下目标值的集合。如果这是一个标量，那么这个O就是实数集的一个子集。实际上，它可能是连续的。","start":236.21,"end":263.13},{"id":11,"text":"So therefore, it would be an interval of some kind, right? And then it's completely simple to say what the semantics is for a scalar op. It's basically the one farthest to the left, which is the smallest, right? Point in that interval. So that would be that. Here, this is like a weird set. Like, for example, let's pretend that this is with respect to r plus to the 2.","zh":"因此，它会是一个某种类型的区间，对吧？然后说一个标量目标函数的语义就非常简单。基本上就是这个区间中最左边的那个点，也就是最小的那个点，对吧？这个区间中的一个点。所以这就是那个。在这里，这是一个奇怪的集合。例如，让我们假设这是关于r加2的。","start":264.22,"end":290.37},{"id":12,"text":"So let's say that here are the objective. What that means is basically down and to the left is good. If you take that to be the objective, then it could be that O looks like this. And here you see there's a minimum point, in which case you just simply say it's optimal, period. It's just optimal. And we'll...","zh":"所以让我们说，这里的目标是什么。这意味着基本上越往左下方越好。如果你把这个作为目标，那么可能会出现O看起来像这样的情况。在这里你可以看到有一个最小点，这时候你就可以简单地说它是最优的，完事。它就是最优的。我们会……","start":292.28,"end":317.96},{"id":13,"text":"That's what it means to be optimal. Basically, that happens pretty rarely, but it does happen in some very famous examples in, let's say, statistics and estimation. But generally, it's not.","zh":"这就是最优性的含义。基本上，这种情况很少发生，但在一些非常著名的例子中确实会发生，比如说在统计学和估计理论中。但一般来说，这种情况并不存在。","start":318.8,"end":329.3}],"notes":["本段讨论了优化问题中目标函数的语义，即如何定义‘小’或‘最优’。讲者指出，对于向量，通常没有线性顺序，因此需要明确目标函数的最小化标准。例如，在估计问题中，目标是使误差协方差矩阵尽可能小，但‘小’的定义可能有多种，只有当存在唯一最小值时，才能明确最优解。","讲者进一步说明，对于标量目标函数，其可行解集的最小值可以通过寻找最左端的点来确定，即最小值。然而，对于更一般的向量目标函数，这种直观的最小化方式可能不适用，需要更复杂的分析。","讲者以统计和估计中的例子说明，虽然最优解在某些经典问题中存在，但通常情况下，目标函数的最小值可能并不唯一，因此需要更深入的分析来确定最优解。","讲者提到，优化问题的语义在于明确目标函数的最小化标准，这需要结合具体问题的上下文。例如，在估计问题中，目标是使误差协方差矩阵尽可能小，但如何定义‘小’是关键。","讲者指出，对于标量目标函数，可行解集的最小值可以通过寻找最左端的点来确定，但这一方法不适用于向量目标函数，因为向量之间没有自然的线性顺序。","讲者强调，优化问题的语义和目标函数的最小化是优化理论的核心内容，需要结合具体问题的上下文来定义和分析。"],"formulas":[],"uncertainties":["r plus to the 2"],"diagram":"none","start":165.01,"end":329.3,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":165.01,"text":"Well, vectors are generally not, the most orderings you have on them are not linear orderings. Okay, so this is what we're going to do. So it's going to look like this. And now this one, we can state what it is. That's its syntax. What we have not yet given you is the semantics, right? So I could say, I could do things like say, I mean, here'd be an example. I could say, hey,"},{"start":189.31,"text":"Please find an estimator. And you go, what's your objective? And you go, make my error covariance matrix small. Everybody got that? That is a problem just like that. Of course, immediately someone would say, what do you mean by small? Right?"},{"start":206.81,"text":"Because then there could be lots of ways to say a covariance matrix is small, right? Oh, one way that would be clear is if there was one choice for which a covariance matrix was actually smaller than all others, otherwise known as a minimum, then it'd be completely unambiguous that that's what would have to be the solution of this. Everybody got that? But we'll get into this. This is kind of the idea. Okay. All right."},{"start":236.21,"text":"So the first thing we'll do is let's look at the set of achievable objective values. So what that means is we screen out all choices of x which are not feasible, and we only look at the ones that are feasible. So they're the ones that don't get an immediate rejection. So we look at the ones that are feasible, and then we look at the set of objectives. Now, if this was a scalar, this O would be a subset of R. In fact, it would probably be continuous."},{"start":264.22,"text":"So therefore, it would be an interval of some kind, right? And then it's completely simple to say what the semantics is for a scalar op. It's basically the one farthest to the left, which is the smallest, right? Point in that interval. So that would be that. Here, this is like a weird set. Like, for example, let's pretend that this is with respect to r plus to the 2."},{"start":292.28,"text":"So let's say that here are the objective. What that means is basically down and to the left is good. If you take that to be the objective, then it could be that O looks like this. And here you see there's a minimum point, in which case you just simply say it's optimal, period. It's just optimal. And we'll..."},{"start":318.8,"text":"That's what it means to be optimal. Basically, that happens pretty rarely, but it does happen in some very famous examples in, let's say, statistics and estimation. But generally, it's not."}],"speech_gaps":[],"frame":"../frames/v007/002.webp","frame_time":177.01},{"title":"Pareto最优与向量优化问题的语义","segments":[{"id":14,"text":"Pareto optimal is the name that you would give to a point if f0 of x, that's a vector remember, is a minimal value of this. And so what that means is like, here's the achievable thing. Here's what you can do. Remember in this one, r plus squared is the vector, is the cone we use to compare vectors, right? And so what that means is if you have a point here, everything to the left and down","zh":"Pareto最优是指如果你给一个点命名，当x的f0值，记住这是一个向量，是这个向量的最小值。这意味着，这里是你能够实现的事情。这里是你能够做到的。记住在这个例子中，r加上平方是向量，是我们用来比较向量的锥体，对吧？因此，这意味着如果你有一个点在这里，左边和下方的所有点","start":332.73,"end":361.13},{"id":15,"text":"These things are better than that point, right? So when we talked about minimal points, there was no, we didn't assign like something's better than something. Now we are because we're doing minimization and we want that quote small, but that means small in this vector sense. So these are the things that are better, right? So for example, if you, there's an X that achieves this value.","zh":"这些点都比这个点更好，对吧？当我们谈论最小点时，是没有这样的说法的，我们没有说某个东西比另一个东西更好。现在我们这样做是因为我们进行的是最小化，我们想要的是“小”，但这里的“小”是指向量意义上的。因此，这些是更好的点，对吧？例如，如果你有一个X实现了这个值。","start":361.63,"end":386.85},{"id":16,"text":"Okay. And I mean, the technical name for that is a stupid choice of X, right? Because basically it's silly. You're so like, look, if you take this thing, there's all sorts of points over here, which actually are unambiguously better than that choice. This is in the vector sense, right?","zh":"好的。我意思是，这个技术术语叫做“愚蠢的选择”X，对吧？因为基本上这是很傻的。你看看，如果你选择这个东西，这里有很多点，实际上比这个选择更明确地更好。这是在向量意义上的，对吧？","start":387.52,"end":406.81},{"id":17,"text":"The minimal points of this set O are these over here. It's this boundary here, and then that's open, and then this boundary here. So for every single one of those points, there's no point that is strictly better than that point. So these are the minimal, they're literally the minimal points of O, which is the achievable objectives. And it kind of...","zh":"这个集合O的最小点就是这些在这里的点。这是这里的边界，然后是开放的，然后是这里的边界。因此，对于每一个这样的点，都没有比它更严格更好的点。因此，这些是最小点，它们是O的最小点，也就是可实现的目标。这有点……","start":407.46,"end":434.25},{"id":18,"text":"All really makes, I mean, this makes perfect sense, right? So, and then actually if someone says, can you compare this and this? And the answer would be no. And no one could say for, you can't say without further information. You couldn't say that that's better than that. You could just, in fact, a very good name, another name for Pareto is a great name. I forget which field uses it. It's called non-dominated.","zh":"所有这一切都完全合乎逻辑，对吧？因此，如果有人问，你能比较这个和这个吗？答案是不能。没有人能在没有更多信息的情况下做出判断。你不能说这个比那个更好。事实上，一个非常好的名字，另一个Pareto的名字叫做非支配。","start":434.62,"end":461.9},{"id":19,"text":"right? So a non-dominated point, right? Because something like this point here is dominated. It's dominated. In other words, there are choices which are simply better. They're strictly down and to the left, okay?","zh":"对吧？因此，一个非支配点，对吧？因为像这个点在这里是被支配的。它被支配了。换句话说，存在一些选择，它们只是更好。它们严格地在左下方，对吧？","start":463.02,"end":476.49},{"id":20,"text":"So that's dominated. And the points that are not dominated is this boundary. It's the set of minimal points. These are called Pareto optimal. There's another name for it. That's from economics, actually, I think from the 1890s. Something like that. This is not exactly new material. Okay. So this is the new semantics of a vector optimization problem. Okay. It's clearest.","zh":"所以这就是被支配的点。而那些没有被支配的点就是这个边界。它是最小点的集合。这些被称为帕累托最优。它还有另一个名称。这个名称实际上来自经济学，我想是1890年代左右。类似这样的。这并不是全新的内容。好的。所以这就是向量优化问题的新语义。好的。它是最清晰的。","start":476.98,"end":503.11}],"notes":["本段讲解了Pareto最优的概念，即在向量优化问题中，一个点如果无法被其他点在所有目标函数上都严格优于，则称为Pareto最优。这与传统的最小化问题不同，因为此时的‘更优’是基于向量的比较，而不是单一标量值。","在向量优化问题中，我们使用锥（如r plus squared）来比较向量。如果一个点在所有目标函数上都比另一个点更优，则称其为‘更优’。这种比较方式使得我们能够识别出那些无法被其他点严格优于的点，即Pareto最优。","Pareto最优点集合构成了一个边界，这些点在所有目标函数上都无法被其他点严格优于。因此，这些点被称为‘最小点’，即在向量优化问题中，这些点是‘最小的’。","Pareto最优的概念来源于经济学，通常被称为‘非支配点’。一个点如果被其他点在所有目标函数上都严格优于，则称为支配点，而非支配点即为Pareto最优。","在向量优化问题中，我们不能直接比较两个点，除非有额外的信息。因此，Pareto最优提供了一种在多目标优化中进行比较的框架。","本段还提到，Pareto最优是向量优化问题的新语义，即在多目标优化中，我们不再追求单一最优解，而是寻找一组无法被其他点严格优于的解集。"],"formulas":[],"uncertainties":[],"diagram":"none","start":332.73,"end":503.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":332.73,"text":"Pareto optimal is the name that you would give to a point if f0 of x, that's a vector remember, is a minimal value of this. And so what that means is like, here's the achievable thing. Here's what you can do. Remember in this one, r plus squared is the vector, is the cone we use to compare vectors, right? And so what that means is if you have a point here, everything to the left and down,"},{"start":361.63,"text":"These things are better than that point, right? So when we talked about minimal points, there was no, we didn't assign like something's better than something. Now we are because we're doing minimization and we want that quote small, but that means small in this vector sense. So these are the things that are better, right? So for example, if you, there's an X that achieves this value."},{"start":387.52,"text":"Okay. And I mean, the technical name for that is a stupid choice of X, right? Because basically it's silly. You're so like, look, if you take this thing, there's all sorts of points over here, which actually are unambiguously better than that choice. This is in the vector sense, right?"},{"start":407.46,"text":"The minimal points of this set O are these over here. It's this boundary here, and then that's open, and then this boundary here. So for every single one of those points, there's no point that is strictly better than that point. So these are the minimal, they're literally the minimal points of O, which is the achievable objectives. And it kind of..."},{"start":434.62,"text":"All really makes, I mean, this makes perfect sense, right? So, and then actually if someone says, can you compare this and this? And the answer would be no. And no one could say for, you can't say without further information. You couldn't say that that's better than that. You could just, in fact, a very good name, another name for Pareto is a great name. I forget which field uses it. It's called non-dominated."},{"start":463.02,"text":"right? So a non-dominated point, right? Because something like this point here is dominated. It's dominated. In other words, there are choices which are simply better. They're strictly down and to the left, okay?"},{"start":476.98,"text":"So that's dominated. And the points that are not dominated is this boundary. It's the set of minimal points. These are called Pareto optimal. There's another name for it. That's from economics, actually, I think from the 1890s. Something like that. This is not exactly new material. Okay. So this is the new semantics of a vector optimization problem. Okay. It's clearest."}],"speech_gaps":[],"frame":"../frames/v007/003.webp","frame_time":344.73},{"title":"多目标优化与帕累托最优","segments":[{"id":21,"text":"in the case, in what's called multi-criterion optimization. And this is a vector problem where we just have the cone. And our objectives actually have, so we would literally refer to these as our objectives, F1 up to FQ, right? Those are our objectives. Altogether, they become a vector objective. But literally, you'd call these, these are the objectives, right? I mean, okay, and let's see what it means. So here's what it would mean.","zh":"在这种情况下，我们称之为多准则优化。这是一个向量问题，其中我们只涉及锥体。我们的目标实际上有，因此我们实际上会把这些称为我们的目标，F1到FQ，对吧？这些就是我们的目标。总体而言，它们构成了一个向量目标。但严格来说，你会称这些为我们的目标，对吧？我是说，好吧，让我们看看这意味着什么。所以，这就是它的含义。","start":503.74,"end":529.02},{"id":22,"text":"If you have these two different objectives and basically, roughly speaking, you want all of them small. That's that's that's the idea. Right. And so if you have a point that's optimal, what it means is it's both feasible and it says basically what that says, that there is a choice of X where.","zh":"如果你有两个不同的目标，基本上，粗略地说，你希望所有目标都尽可能小。这就是这个意思。对吧？因此，如果你有一个最优解点，这意味着它既是可行的，而且它基本上说明了这一点，即存在一个X的选择，使得。","start":531.5,"end":551.58},{"id":23,"text":"It minimizes F1 and it minimizes F2 and it minimizes F3 and it minimizes all of them, right? That's what it's, it simultaneously minimizes all of them. Here's, this is an example like this, right? And this says that there was no competition among them. I just, I found a single point that just minimized everything. Like, so, I mean, and I should add, you know, this is, this should be kind of obvious, but.","zh":"它最小化F1，并且最小化F2，同时最小化F3，以及最小化所有目标，对吧？这就是它的含义，它同时最小化所有目标。这里有一个例子，对吧？这说明这些目标之间没有竞争。我找到了一个单一的点，它能够最小化所有目标。比如，我是说，我应该补充一点，这应该是显而易见的，但。","start":552.54,"end":574.3},{"id":24,"text":"I'm not aware of any problem in a practical setting that's not a multi-criterion problem, right? Because everything, you know, doesn't matter. You'll see very shortly how to solve them. It's a big deal. Some people actually make this into a field, which I find ridiculous, because if you know how to do these things, it's extremely straightforward. So any field there is, there are going to be trade-offs.","zh":"我并不知道在实际应用中存在任何不是多准则问题的情况，对吧？因为一切，你知道的，都不重要。你很快就会看到如何解决这些问题。这非常重要。有些人甚至将这发展成一个领域，我觉得这很荒谬，因为如果你知道如何做这些事情，它是非常直接的。因此，任何存在的领域，都会有权衡。","start":576.21,"end":598.97},{"id":25,"text":"among competing objectives, right? I mean, if you're fitting a model in machine learning, you'd have a loss function and you'd have a regularizer and you'd want to trade off among them, right? In control, you know, you want to hit your target and you could trade off fuel and the comfort of the ride, right? Or something like that, right? So there's just...","zh":"在竞争性目标之间，对吧？我是说，如果你在机器学习中拟合一个模型，你会有一个损失函数，还有一个正则化项，你希望在这两者之间进行权衡，对吧？在控制领域，你知道的，你希望达到目标，同时可以权衡燃料消耗和乘坐的舒适度，对吧？或者类似的事情，对吧？所以，这仅仅是……","start":599.45,"end":621.41},{"id":26,"text":"Pretty much any problem I can possibly imagine. But they're very easily, as we'll see shortly, handled by straight-up optimization. Anyway, back to this. By the way, this happens very rarely. If you would say, oh, I'm doing this circuit design, I care about the area, I care about the power, I care about the dynamic power, and it doesn't matter, that's it. And I care about the...","zh":"我几乎可以想象到的任何问题。但正如我们很快就会看到的，这些问题非常容易通过直接的优化方法来处理。总之，回到这个话题。顺便说一句，这种情况非常罕见。如果你会说，哦，我在进行电路设计，我关心面积，我关心功耗，我关心动态功耗，这已经够了。我还关心……","start":621.9,"end":650.1},{"id":27,"text":"you know, the maximum power output of my amplifier. There you go. Okay. So I have like four objectives. And then you come back and you go, cool, here's a design. You go, well, what does it do? You say, oh, it minimizes all four of them simultaneously. Everybody got that? I mean, that would be awesome, right? But this happens like basically never, almost never. Okay. Pareto optimal is actually interesting. So to be Pareto optimal, what it means is","zh":"你知道，我的放大器的最大输出功率。就是这样。好的，我有四个目标。然后你回来，你说，好，这里有一个设计方案。你接着问，那它会怎样？你会说，哦，它同时最小化了这四个目标。大家明白了吗？我的意思是，这会很棒，对吧？但这种情况基本上从不发生，几乎从不发生。好的，帕累托最优实际上很有趣。所谓帕累托最优，它的意思是","start":651.1,"end":675.81}],"notes":["本段讲授了多目标优化的基本概念，即多个目标函数同时最小化的问题。讲者指出，这种情况下，一个点如果是最优的，它必须同时满足所有目标函数的最小化，且在可行域内。然而，这种情况在实际问题中非常罕见，因为通常存在目标之间的竞争关系。","讲者通过多个例子说明了多目标优化的常见性，例如在机器学习中，损失函数和正则化项之间需要权衡；在控制问题中，需要在燃料消耗和乘坐舒适度之间进行取舍。这些例子表明，多目标优化在实际应用中是普遍存在的。","讲者强调，虽然多目标优化在实际中很常见，但通过优化方法可以有效地处理这些问题。他指出，虽然有些人将多目标优化视为一个独立的领域，但讲者认为这并不必要，因为这些方法本质上是直接的优化问题。","讲者提到，帕累托最优是多目标优化中的一个重要概念，它指的是在不使其他目标变差的情况下，无法进一步改善某个目标的点。然而，讲者指出，找到这样的点在实际中几乎不可能，因为目标之间通常存在竞争。","讲者通过电路设计的例子进一步说明了多目标优化的挑战，即在面积、功耗、动态功耗和最大输出功率等多个目标之间进行权衡。他指出，找到一个同时最小化所有目标的点几乎不可能，因此需要进行权衡。","最后，讲者提到帕累托最优的概念，并指出在实际问题中，找到帕累托最优解几乎不可能，因为目标之间存在竞争关系。因此，多目标优化通常需要在不同目标之间进行权衡，而不是同时最小化所有目标。"],"formulas":[],"uncertainties":[],"diagram":"none","start":503.74,"end":675.81,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":503.74,"text":"in the case, in what's called multi-criterion optimization. And this is a vector problem where we just have the cone. And our objectives actually have, so we would literally refer to these as our objectives, F1 up to FQ, right? Those are our objectives. Altogether, they become a vector objective. But literally, you'd call these, these are the objectives, right? I mean, okay, and let's see what it means. So here's what it would mean."},{"start":531.5,"text":"If you have these two different objectives and basically, roughly speaking, you want all of them small. That's that's that's the idea. Right. And so if you have a point that's optimal, what it means is it's both feasible and it says basically what that says, that there is a choice of X where."},{"start":552.54,"text":"It minimizes F1 and it minimizes F2 and it minimizes F3 and it minimizes all of them, right? That's what it's, it simultaneously minimizes all of them. Here's, this is an example like this, right? And this says that there was no competition among them. I just, I found a single point that just minimized everything. Like, so, I mean, and I should add, you know, this is, this should be kind of obvious, but."},{"start":576.21,"text":"I'm not aware of any problem in a practical setting that's not a multi-criterion problem, right? Because everything, you know, doesn't matter. You'll see very shortly how to solve them. It's a big deal. Some people actually make this into a field, which I find ridiculous, because if you know how to do these things, it's extremely straightforward. So any field there is, there are going to be trade-offs."},{"start":599.45,"text":"among competing objectives, right? I mean, if you're fitting a model in machine learning, you'd have a loss function and you'd have a regularizer and you'd want to trade off among them, right? In control, you know, you want to hit your target and you could trade off fuel and the comfort of the ride, right? Or something like that, right? So there's just..."},{"start":621.9,"text":"Pretty much any problem I can possibly imagine. But they're very easily, as we'll see shortly, handled by straight-up optimization. Anyway, back to this. By the way, this happens very rarely. If you would say, oh, I'm doing this circuit design, I care about the area, I care about the power, I care about the dynamic power, and it doesn't matter, that's it. And I care about the..."},{"start":651.1,"text":"you know, the maximum power output of my amplifier. There you go. Okay. So I have like four objectives. And then you come back and you go, cool, here's a design. You go, well, what does it do? You say, oh, it minimizes all four of them simultaneously. Everybody got that? I mean, that would be awesome, right? But this happens like basically never, almost never. Okay. Pareto optimal is actually interesting. So to be Pareto optimal, what it means is"}],"speech_gaps":[],"frame":"../frames/v007/004.webp","frame_time":515.74},{"title":"帕累托最优与权衡曲线","segments":[{"id":28,"text":"It means you're non-dominated. It means you say, well, I have an X, and you get these Q different scores or objective values. Then what you know if you are Pareto optimal is that nobody can embarrass you. Embarrass you means, oh yeah, well, I've got an X that matches you on all and beats you on at least one. That was informal, but it was actually a precise statement of what it meant to be Pareto optimal. Everybody got that?","zh":"这意味着你不是被支配的。这意味着你会说，好吧，我有一个X，而你得到了这些Q个不同的得分或目标值。那么如果你是帕累托最优的，你知道的是没有人能让你难堪。让你难堪的意思是，哦，是的，我有一个X，在所有方面都与你相同，并且在至少一个方面打败你。这是非正式的说法，但实际上是帕累托最优的精确定义。大家都明白了吗？","start":676.86,"end":704.88},{"id":29,"text":"Right. So, yeah, so you'd say, well, I know how to I know how to do my production. So I will use I'll take your plan for production and I'll say, yeah, I got a plan. Mine of the 12 resources that we both use, I match you on all and I beat you on two. That means my plan dominates yours.","zh":"对的。所以，是的，你会说，好吧，我知道如何做我的生产。所以我将采用你的生产计划，并说，是的，我有一个计划。在我们双方使用的12种资源中，我在所有方面都与你相同，并且在两个方面打败你。这意味着我的计划支配了你的计划。","start":705.34,"end":723.8},{"id":30,"text":"Which means yours is not Pareto optimal. Of course, mine need not be either. But that's what it means. So I think these are ideas you've seen before. They're very simple and I think intuitive. But I think it's not a bad thing to actually have it called out with a name associated with it. So the one thing that people in a lot of areas, when you talk about Pareto optimal, they talk about...","zh":"这意味着你的计划不是帕累托最优的。当然，我的计划也不一定是。但这正是它的意思。我认为这些是你以前见过的概念。它们非常简单，我认为也很直观。但我认为，实际上给它一个名字是很有帮助的。因此，人们在很多领域谈到帕累托最优时，他们谈到的是权衡，我认为这是一种非常好的说法方式。","start":724.39,"end":748.35},{"id":31,"text":"you talk about trade-offs, which is, I think, an extremely good way to say it. So if you look back over here, remember this is an optimization problem where we're basically optimizing two things. We want the first component small, so left is good, and we want the second component small, which means down is good. And then...","zh":"如果你回顾这里，记住这是一个优化问题，我们基本上在优化两个方面。我们希望第一个分量小，左边是好的，我们希望第二个分量小，这意味着向下是好的。然后……","start":749.8,"end":773.96},{"id":32,"text":"And so what we would do is, if someone pointed to... So that's a stupid choice. That's an impossible choice. Perfectly nice one, but impossible. This is possible, but stupid. These are the not stupid ones, or the Pareto ones, or something like that. And they refer to this as an optimal trade-off curve. And then if you were to choose these two points and say, let's discuss...","zh":"因此，如果我们有人指着……这是一个愚蠢的选择。这是一个不可能的选择。完全不错的一个选择，但不可能。这个是可能的，但愚蠢的。这些都是不愚蠢的选择，或者说是帕累托选择，或者类似的东西。他们把这个称为最优权衡曲线。然后如果你选择这两个点并说，让我们讨论……","start":774.45,"end":799.65},{"id":33,"text":"Right? Let's compare. And you would say, well, neither is better than the other. Right? Because they're not comparable. It is not the case that, you know, one does. And then you'd say, well, what happened? And you'd say, well, if I was going to compare this point and this point, what I would say is this point up here beats this one in the first objective, but pays for it with the second because it's higher.","zh":"对吧？让我们来比较一下。你可能会说，好吧，两者都不比对方更好。对吧？因为它们不可比较。并不是说，其中一个会做到另一个做不到的事情。然后你可能会问，那发生了什么呢？你可能会说，如果我要比较这个点和那个点，我会说这个上面的点在第一个目标上优于这个点，但用第二个目标来换取。","start":800.42,"end":824.96},{"id":34,"text":"Okay, and so that's and that actually gets you kind of to some economics. I mean a simple economic interpretation where you are exchanging these between the two objectives and you're sort of paying for one with the other everybody These are all just vague ideas, but they're about to be not vague very soon that okay","zh":"好的，所以这就是，实际上这让你接近一些经济学的概念。我的意思是，一个简单的经济解释，就是你在两个目标之间进行交换，并且用其中一个来换取另一个。这些都是些模糊的想法，但很快它们就不再模糊了，好吧。","start":825.5,"end":847.38}],"notes":["本段讲解了帕累托最优的概念，即一个解在多个目标上无法被其他解全面超越。讲者指出，帕累托最优意味着没有人能通过一个解在所有目标上与之匹配并至少在一个目标上超越它。这种概念在优化问题中非常重要，尤其是在多目标优化中。","讲者通过一个生产计划的例子来说明帕累托最优。他提到，如果一个计划在所有资源上与另一个计划匹配，并且在至少两个资源上超越它，那么该计划就支配了另一个计划，而被支配的计划就不是帕累托最优的。","讲者进一步指出，帕累托最优的解集合被称为帕累托前沿，这些解之间无法直接比较，因为它们在不同的目标上各有优劣。这种权衡关系可以用权衡曲线来表示，即最优权衡曲线。","讲者提到，权衡曲线上的点代表了在不同目标之间进行权衡的最优解。这些点之间无法直接比较，因为它们在不同的目标上各有优势，因此需要通过权衡来选择。","讲者还提到，帕累托最优的概念可以与经济学中的交换和支付关系联系起来，即在不同目标之间进行交换时，需要付出相应的代价。这种经济解释为帕累托最优提供了直观的理解。","最后，讲者指出，虽然这些概念目前还比较模糊，但接下来的内容将更加具体和明确，帮助学生更好地理解帕累托最优和权衡曲线的概念。"],"formulas":[],"uncertainties":["exchanging these between the two objectives and you're sort of paying for one with the other everybody"],"diagram":"none","start":676.86,"end":847.38,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":676.86,"text":"It means you're non-dominated. It means you say, well, I have an X, and you get these Q different scores or objective values. Then what you know if you are Pareto optimal is that nobody can embarrass you. Embarrass you means, oh yeah, well, I've got an X that matches you on all and beats you on at least one. That was informal, but it was actually a precise statement of what it meant to be Pareto optimal. Everybody got that?"},{"start":705.34,"text":"Right. So, yeah, so you'd say, well, I know how to I know how to do my production. So I will use I'll take your plan for production and I'll say, yeah, I got a plan. Mine of the 12 resources that we both use, I match you on all and I beat you on two. That means my plan dominates yours."},{"start":724.39,"text":"Which means yours is not Pareto optimal. Of course, mine need not be either. But that's what it means. So I think these are ideas you've seen before. They're very simple and I think intuitive. But I think it's not a bad thing to actually have it called out with a name associated with it. So the one thing that people in a lot of areas, when you talk about Pareto optimal, they talk about..."},{"start":749.8,"text":"you talk about trade-offs, which is, I think, an extremely good way to say it. So if you look back over here, remember this is an optimization problem where we're basically optimizing two things. We want the first component small, so left is good, and we want the second component small, which means down is good. And then..."},{"start":774.45,"text":"And so what we would do is, if someone pointed to... So that's a stupid choice. That's an impossible choice. Perfectly nice one, but impossible. This is possible, but stupid. These are the not stupid ones, or the Pareto ones, or something like that. And they refer to this as an optimal trade-off curve. And then if you were to choose these two points and say, let's discuss..."},{"start":800.42,"text":"Right? Let's compare. And you would say, well, neither is better than the other. Right? Because they're not comparable. It is not the case that, you know, one does. And then you'd say, well, what happened? And you'd say, well, if I was going to compare this point and this point, what I would say is this point up here beats this one in the first objective, but pays for it with the second because it's higher."},{"start":825.5,"text":"Okay, and so that's and that actually gets you kind of to some economics. I mean a simple economic interpretation where you are Exchanging these between the two objectives and you're sort of paying for one with the other everybody These are all just vague ideas, but they're about to be not vague very soon that okay Okay"}],"speech_gaps":[],"frame":"../frames/v007/005.webp","frame_time":688.86},{"title":"多目标优化与投资组合构建","segments":[{"id":35,"text":"So, I mean, here's an example. It's a bicriterion problem with two objectives, right? And in fact, the object, I mean, this is basically a least squares objective. So this might be a, you know, this could be your least squares training error or something. Sorry, you know, and then this would be like.","zh":"所以，我的意思是，这里有一个例子。这是一个具有两个目标的双目标问题，对吧？事实上，这个目标，我的意思是，这基本上是一个最小二乘目标。所以这可能是一个，你知道的，这可能是你的最小二乘训练误差或者其他什么。抱歉，你知道的，然后这会像这样。","start":849.82,"end":867.46},{"id":36,"text":"you know if you're doing ridge regression which we'll get to later um you know then then so this but actually this is interesting what this does is it says here's what i mean the semantics of this is someone saying choose an x and you say how will you be judged and you say you will be judged by two numbers number one this thing you want to call that your tracking error training error whatever you like i don't care you'll be judged by that one number and you'd say","zh":"你知道的，如果你在做岭回归，我们之后会讲到，你知道的，那么，那么，所以这个，实际上，这个很有趣，它说的是，这里我的意思是什么，这个语义是有人在说，选择一个x，你说你会怎么被评判，你说你会被这两个数字评判，第一个数字你想要叫它跟踪误差、训练误差或者其他你喜欢的名称，我不在乎，你会被这个数字评判，你会说","start":867.85,"end":891.07},{"id":37,"text":"I want you to please try to satisfy approximately AX equals B. You say, oh, but at the same time, I don't want X to be too big. And that's the second number you are judged by. And so this is an example of that set O. And so what it says is, well, we didn't do it this way because you can actually calculate that set, but it doesn't matter. But in principle, what we did is we took all Xs in Rn.","zh":"我希望你尽量满足AX等于B。你说，哦，但同时，我不想让X太大。而这第二个数字就是你被评判的标准。因此，这就是那个集合O的一个例子。因此，它说的是，我们没有这样做，因为实际上你可以计算出这个集合，但这没关系。但原则上，我们做了的是，我们取了所有Rn中的X。","start":891.43,"end":916.71},{"id":38,"text":"We evaluated that number and that number. That's a two vector. And I put a dark spot wherever that happened. Everybody got it? And so this is what's achievable. Now, everything up here is ridiculous and silly, right? Because the semantics is left is good, down is good, right? So it turns out the only ones you should possibly ever consider are the, you could say either the minimal ones in O or the Pareto optimal ones or something like that. And that's this little curve right here.","zh":"我们评估了这两个数字，这是一个二维向量。我在那个发生的地方画了一个暗点。大家明白了吗？因此，这就是可以实现的。现在，这里的一切都是荒谬和愚蠢的，对吧？因为语义是左边好，下面好，对吧？结果发现，你唯一应该考虑的可能是集合O中的最小值或者帕累托最优解之类的。这就是这里这条小曲线。","start":917.68,"end":944.8},{"id":39,"text":"Okay, including the endpoints, right? So that's the, everybody got that? So you would, if in fact you cared only in your choice of x about these two numbers, then it would be extremely silly to choose any choice of x other than the ones on that line.","zh":"好的，包括端点，对吧？所以，大家明白了吗？所以，如果你实际上只关心你在选择x时的这两个数字，那么选择任何不在那条线上的x都是极其愚蠢的。","start":945.8,"end":961.68},{"id":40,"text":"And then the way we would say this is we'd say things like, if you wanted to compare this point and this point, we would say, oh, you just traded off fitting error with the size of your parameters or however you want to say it. That's how you would say it. So again, this is all kind of obvious, but this is what it looks like. Okay. Here's a famous one. So in...","zh":"然后，我们会这样表述这个问题，比如说，如果你想比较这个点和这个点，我们会说，哦，你只是在拟合误差和参数的大小之间进行了权衡，或者你想要怎么表述都可以。这就是你会这么说的方式。所以再次强调，这看起来都很明显，但这就是它的样子。好的。这里有一个著名的例子。所以在……","start":962.19,"end":989.83},{"id":41,"text":"You're doing portfolio construction. So I'll say a little bit about it just so everybody is kind of on the same page. So X, that's an investment portfolio. And it's usually normalized to one. Actually, this is the case where they're all non-negative and add up to one. So it's actually a set of mixture weights. And basically tells you what fraction of your wealth.","zh":"你正在做投资组合构建。我会稍微讲一点，这样大家大致在同一页面上。X，这是一个投资组合。它通常被归一化为1。实际上，这里的情况是它们都是非负的，并且总和为1。因此，它实际上是一组混合权重，基本上告诉你你的财富中有多少比例","start":990.25,"end":1014.21}],"notes":["本段讲解了多目标优化问题，其中涉及两个目标函数，例如最小化训练误差和控制参数大小。讲者提到，这种问题可以通过将两个目标函数组合成一个向量来表示，并在二维空间中寻找可行解。讲者还指出，只有那些在Pareto最优解集中的点才值得考虑，因为其他点在两个目标上都不如这些点优。","讲者通过一个投资组合构建的例子来说明多目标优化的应用。投资组合通常被归一化为1，且所有权重非负且总和为1。这表示了不同资产在投资组合中的比例，从而帮助投资者在风险和收益之间进行权衡。","讲者强调，在多目标优化中，选择不在Pareto前沿的点是不合理的，因为这些点在两个目标上都不如前沿上的点。因此，优化问题的解通常集中在Pareto前沿上。","讲者提到，当两个目标函数被组合成一个向量时，可以通过在二维空间中寻找可行解来表示问题。这种表示方法有助于直观地理解不同解之间的权衡关系。","讲者指出，多目标优化问题的解通常是一个曲线，称为Pareto前沿。这个曲线上的点代表了在两个目标之间进行权衡的最优解。","讲者通过投资组合构建的例子，说明了多目标优化在实际中的应用。投资组合的构建需要在风险和收益之间进行权衡，这正是多目标优化问题的一个典型应用场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":849.82,"end":1014.21,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":849.82,"text":"So, I mean, here's an example. It's a bicriterion problem with two objectives, right? And in fact, the object, I mean, this is basically a least squares objective. So this might be a, you know, this could be your least squares training error or something. Sorry, you know, and then this would be like."},{"start":867.85,"text":"you know if you're doing ridge regression which we'll get to later um you know then then so this but actually this is interesting what this does is it says here's what i mean the semantics of this is someone saying choose an x and you say how will you be judged and you say you will be judged by two numbers number one this thing you want to call that your tracking error training error whatever you like i don't care you'll be judged by that one number and you'd say"},{"start":891.43,"text":"I want you to please try to satisfy approximately AX equals B. You say, oh, but at the same time, I don't want X to be too big. And that's the second number you are judged by. And so this is an example of that set O. And so what it says is, well, we didn't do it this way because you can actually calculate that set, but it doesn't matter. But in principle, what we did is we took all Xs in Rn."},{"start":917.68,"text":"We evaluated that number and that number. That's a two vector. And I put a dark spot wherever that happened. Everybody got it? And so this is what's achievable. Now, everything up here is ridiculous and silly, right? Because the semantics is left is good, down is good, right? So it turns out the only ones you should possibly ever consider are the, you could say either the minimal ones in O or the Pareto optimal ones or something like that. And that's this little curve right here."},{"start":945.8,"text":"Okay, including the endpoints, right? So that's the, everybody got that? So you would, if in fact you cared only in your choice of x about these two numbers, then it would be extremely silly to choose any choice of x other than the ones on that line."},{"start":962.19,"text":"And then the way we would say this is we'd say things like, if you wanted to compare this point and this point, we would say, oh, you just traded off fitting error with the size of your parameters or however you want to say it. That's how you would say it. So again, this is all kind of obvious, but this is what it looks like. Okay. Here's a famous one. So in..."},{"start":990.25,"text":"You're doing portfolio construction. So I'll say a little bit about it just so everybody is kind of on the same page. So X, that's an investment portfolio. And it's usually normalized to one. Actually, this is the case where they're all non-negative and add up to one. So it's actually a set of mixture weights. And basically tells you what fraction of your wealth."}],"speech_gaps":[],"frame":"../frames/v007/006.webp","frame_time":861.82},{"title":"投资组合优化与负权重解释","segments":[{"id":42,"text":"Do you invest in each of these things right, so and this is used like absolutely everywhere it's used on a kind of a macroscopic scale like Stanford endowment sits there but there the individual investments are like asset classes like you know U.S. equities European equities alternative investments venture capital has a named you know is actually one of the","zh":"你是否正确地投资于这些事物，这在宏观尺度上被广泛使用，例如斯坦福大学的捐赠基金就存在于此，但其中的个别投资是像资产类别这样的东西，比如你知道的美国股票、欧洲股票、另类投资、风险投资，这些都有具体的名称，实际上就是斯坦福捐赠基金中的一个资产。","start":1014.61,"end":1036.63},{"id":43,"text":"assets in Stanford's endowment, right? So that's this. And then this is asking, you know, how to make a mixture of it. By the way, later we'll talk about it, but you can violate this, right? So, and it has a meaning, right? So you can actually have, oh, and you can interpret the Xs as percentages, right? So if I could give you, if X was, if I had four asset class, I mean, this would be like really dumb, but, you know, be like, you know, stocks, bonds, and cash.","zh":"对吧？所以这就是这个。然后这个问题是在问，你知道的，如何将这些资产混合起来。顺便说一句，我们之后会谈到这一点，但你可以违反这个规则，对吧？所以，它有其意义，对吧？实际上，你可以将X解释为百分比，对吧？比如，如果你有四个资产类别，这会像非常愚蠢，但你知道的，比如股票、债券和现金。","start":1037.24,"end":1062.02},{"id":44,"text":"You know, and I could give you like 60, 40 and zero or something. Right. Something like that. That would you've heard of these things. Right. But in fact, you can actually in stuff that we'll see later, you can actually let X get negative. And you might ask, that's weird. What does it mean to hold negative five percent of your portfolio in? I don't know. You know, whatever. It doesn't matter. You know, medium term corporate bonds. Everybody see what I'm saying? So if you.","zh":"你知道的，我可以给你像60%、40%和0%这样的比例，对吧？像这样。你可能听说过这些事情。对吧？但事实上，在我们之后会看到的内容中，你实际上可以让X变成负数。你可能会问，这很奇怪。在你的投资组合中持有负5%是什么意思？我不知道。你知道的，随便什么。这没关系。你知道的，中期公司债券。大家明白我的意思吗？所以如果你。","start":1062.82,"end":1092.29},{"id":45,"text":"So I can explain, again, this is, by the way, all of this for most of you, this is nothing but like cultural enrichment. Just so if you ever bump into someone who is interested in this, you know what they're talking about. So if you do genetics, too bad. Sorry about that. But it's not bad to know these things, right? To know how optimization is used in other fields. Okay, so what does it mean to own negative 5% in whatever medium-term corporate bonds, right?","zh":"所以，我可以再次解释，顺便说一句，对你们大多数人来说，这不过是一种文化上的丰富。只是为了当你遇到对这个感兴趣的人时，你知道他们在说什么。如果你做遗传学，那太糟糕了。抱歉。但了解这些事情并不坏，对吧？了解优化在其他领域中的应用。好的，那么拥有负5%的某种中期公司债券是什么意思，对吧？","start":1092.77,"end":1119.03},{"id":46,"text":"What it means is you borrow that asset from someone, right? You now have the obligation to pay them back, right? And so you borrow it and immediately sell it, okay? Then later when they come ask, when the investment period is over, they go, you know, hey, give me my bond back. You buy it.","zh":"这意味着你从某人那里借入这种资产，对吧？你现在有义务偿还他们，对吧？所以你借入它并立即卖出，对吧？之后当投资期结束时，他们来问，你知道的，嘿，把我的债券还给我。你买回来。","start":1120.3,"end":1139.5},{"id":47,"text":"um, on the open market. If the price went down, it's cheaper and you did well, everybody got that. So again, you don't need it, but what's really cool about it is all the math goes through. And so you could actually have, uh, you can own negative, you know, anyway. So yeah, I mean, that's the idea. Fine. All right. This is just a discussion of this because this is the first time we're seeing this. Okay. So, um,","zh":"嗯，在公开市场上。如果价格下跌了，那就更便宜了，你做得很好，大家都能理解。所以再次强调，你并不需要它，但真正酷的是所有的数学推导都可以进行。因此，你实际上可以拥有负权重，你知道的。所以是的，我的意思是，这就是这个想法。好吧。好了，这只是对这一点的讨论，因为我们第一次见到这一点。好的，所以，嗯，","start":1139.94,"end":1161.26},{"id":48,"text":"This is sort of a very classic analysis. It's kind of like, although it's got parts of it that were not in the original thing, this goes back to like 1953 about with someone named Harry Markowitz, right? So here's what it is. Care about two things. So I'm going to make this investment portfolio and there's going to be a return.","zh":"这是一种非常经典的分析。虽然它包含了一些原版中没有的部分，但这种分析可以追溯到1953年，与一位名叫哈里·马科维茨的人有关，对吧？所以这里的情况是，我们关心两件事。我将构建一个投资组合，其中会有回报。","start":1162.2,"end":1180.54}],"notes":["本段讲解了投资组合优化的基本概念，即如何将资金分配到不同的资产类别中，如股票、债券和现金等。讲者提到，投资组合中的权重可以是正数或负数，负数权重意味着借入资产并立即卖出，之后再以较低价格回购。这种做法在数学上是可行的，但需要理解其背后的逻辑。","讲者指出，负权重在投资组合中并不罕见，它代表了借入资产的行为，这在实际操作中可能带来收益，也可能带来风险。讲者还提到，这种做法在数学上是允许的，因为优化模型可以处理负数权重。","讲者强调，虽然这些内容对大多数学生来说可能只是文化上的补充，但了解这些概念有助于理解优化在其他领域的应用，如金融。讲者还提到，负权重的解释与借入资产有关，这在投资组合优化中是一个重要的概念。","讲者提到，投资组合优化的理论可以追溯到1953年，由Harry Markowitz提出。他关注的是投资组合的两个关键因素：收益和风险。讲者还提到，这种分析方法在现代金融中仍然具有重要地位。","讲者通过具体的例子解释了负权重的含义，即借入资产并立即卖出，之后再以较低价格回购。这种做法在数学上是可行的，但需要理解其背后的逻辑和风险。","讲者还提到，虽然负权重在投资组合中可能看起来奇怪，但它是优化模型的一部分，允许数学上的处理。讲者强调，这种做法在实际操作中可能带来收益，但也可能带来风险，因此需要谨慎对待。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1014.61,"end":1180.54,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1014.61,"text":"do you invest in each of these things right so and this is used like absolutely everywhere it's used on a kind of a macroscopic scale like stanford endowment sits there but there the individual investments are like asset classes like you know u.s equities european equities alternative investments venture capital has a named you know is actually one of the"},{"start":1037.24,"text":"assets in Stanford's endowment, right? So that's this. And then this is asking, you know, how to make a mixture of it. By the way, later we'll talk about it, but you can violate this, right? So, and it has a meaning, right? So you can actually have, oh, and you can interpret the Xs as percentages, right? So if I could give you, if X was, if I had four asset class, I mean, this would be like really dumb, but, you know, be like, you know, stocks, bonds, and cash."},{"start":1062.82,"text":"You know, and I could give you like 60, 40 and zero or something. Right. Something like that. That would you've heard of these things. Right. But in fact, you can actually in stuff that we'll see later, you can actually let X get negative. And you might ask, that's weird. What does it mean to hold negative five percent of your portfolio in? I don't know. You know, whatever. It doesn't matter. You know, medium term corporate bonds. Everybody see what I'm saying? So if you."},{"start":1092.77,"text":"So I can explain, again, this is, by the way, all of this for most of you, this is nothing but like cultural enrichment. Just so if you ever bump into someone who is interested in this, you know what they're talking about. So if you do genetics, too bad. Sorry about that. But it's not bad to know these things, right? To know how optimization is used in other fields. Okay, so what does it mean to own negative 5% in whatever medium-term corporate bonds, right?"},{"start":1120.3,"text":"What it means is you borrow that asset from someone, right? You now have the obligation to pay them back, right? And so you borrow it and immediately sell it, okay? Then later when they come ask, when the investment period is over, they go, you know, hey, give me my bond back. You buy it."},{"start":1139.94,"text":"um, on the open market. If the price went down, it's cheaper and you did well, everybody got that. So again, you don't need it, but what's really cool about it is all the math goes through. And so you could actually have, uh, you can own negative, you know, anyway. So yeah, I mean, that's the idea. Fine. All right. This is just a discussion of this because this is the first time we're seeing this. Okay. So, um,"},{"start":1162.2,"text":"This is sort of a very classic analysis. It's kind of like, although it's got parts of it that were not in the original thing, this goes back to like 1953 about with someone named Harry Markowitz, right? So here's what it is. Care about two things. So I'm going to make this investment portfolio and there's going to be a return."}],"speech_gaps":[],"frame":"../frames/v007/007.webp","frame_time":1026.6100000000001},{"title":"投资组合的期望收益与风险","segments":[{"id":49,"text":"Here is there's going to be a return and the return on your so you know return is like you know the return might look like this right it might be plus 0.02 minus 0.01 you know and and plus 0.02 or something and this means asset one","zh":"这里将有一个回报，而你的回报可能看起来像这样，比如可能是加0.02，减0.01，或者加0.02之类的，这表示资产一","start":1182.42,"end":1201.88},{"id":50,"text":"went up two percent so did asset three asset one went down one percent right that's what it means so and if you form r transpose x that's going to tell you the portfolio uh return right so you know if you have like you know 80 percent here 10 and 10 you just work it out and figure out how well you did and you cut probably went up about you you got dinged a little bit here you probably went up most somewhere near two percent but not quite everybody got that","zh":"上涨了2%，资产三也上涨了2%，资产一下跌了1%，这就是它的意思。所以如果你计算r的转置乘以x，这将告诉你投资组合的回报。比如你有80%在这里，10%和10%，你只需要计算一下，看看你做得怎么样，你可能上涨了大约两 percent，但你在这里被稍微拖累了一下，你可能上涨了接近两 percent，但不是所有人都得到了这个结果","start":1202.47,"end":1229.13},{"id":51,"text":"Okay, so that's what that, okay. So the model of R is that R is a random vector and will give its first two moments. And those first two moments are going to be the expected value. And P bar transpose, that's going to be the relative price changes, the returns. That's this thing. Oh, I guess I'm using bad notation here. That's fine.","zh":"好的，这就是这个意思，好的。所以R的模型是R是一个随机向量，并且会给出它的前两个矩。这些前两个矩将是期望值。而P bar的转置，这将是相对价格变化，也就是回报。这就是这个东西。哦，我想我在这里用了不好的记号。没关系。","start":1229.61,"end":1254.69},{"id":52,"text":"or inconsistent. Okay. So that's going to be the expected return of the portfolio. And then the variance is going to be X transpose sigma X, right? And so you should have some estimates of what things are going to, you know, the mean and the covariance of these things. Okay. Everybody following this? Okay. You care about two things, which is you would like a portfolio, which on average kind of goes up.","zh":"或者不一致。好的。所以这将是投资组合的期望回报。然后方差将是X的转置乘以sigma乘以X，对吧？所以你应该有一些对这些事物的估计值，你知道的，均值和协方差。好的。大家跟上了吗？好的。你关心的两件事是你希望一个投资组合，平均来说能够上涨。","start":1255.82,"end":1281.58},{"id":53,"text":"So you want high mean return. And a lot of people drop the mean and just say high return, right? So that would be how they would say. Of course, that doesn't tell you that every day it's going to go up. It just tells you that if you believe the statistical models, which, by the way, are not very good, and if you were to wind back and repeat that day 10,000 times and take the average, it would have gone up.","zh":"所以你想要高均值回报。而很多人会省略均值，只说高回报，对吧？所以这就是他们说的方式。当然，这并不意味着每一天它都会上涨。它只是告诉你，如果你相信这些统计模型，这些模型其实并不很好，如果你把时间倒回去，重复那一天10,000次，并取平均值，它就会上涨。","start":1281.92,"end":1305.29},{"id":54,"text":"Since the latter is impossible and the first is also false, that's the rough idea. And this thing, that's the variance, that measures actually, that's called the risk of the portfolio. And if you take the square root, it's the standard deviation. And it says, if I'm a portfolio manager and I wake up in the morning, have my coffee, then try to find out, did Stanford's endowment go up or down today? Then I take the mean square value of that.","zh":"由于后者是不可能的，而前者也是错误的，这就是大致的想法。这个东西，也就是方差，它实际上衡量的是风险，这就是投资组合的风险。如果你对它开平方，就是标准差。它表示，如果我是投资组合经理，早上醒来，喝完咖啡，然后试图弄清楚斯坦福大学捐赠基金今天是涨了还是跌了，那么我会计算这个的均方值。","start":1306.54,"end":1333.64},{"id":55,"text":"That's going to be the risk of the portfolio. It's called volatility or something like that. Again, this is just so you get the idea. So this is really a bi-criterion problem. So I've got two objectives, which is risk and return. Well, the return I want big and the risk I want small. So I could have done this with some sick cone.","zh":"这就是投资组合的风险。它也被称为波动性或其他类似的说法。再次强调，这只是为了让你理解这个概念。因此，这实际上是一个双目标问题。我有两个目标，即风险和收益。我希望收益大，而希望风险小。因此，我可以用一个尖锥来处理这个问题。","start":1334.13,"end":1360.21}],"notes":["本段讲解了投资组合的期望收益和风险的基本概念。首先，通过举例说明了资产收益的计算方式，如资产收益可能为正或负，如+0.02或-0.01。接着，介绍了如何通过向量r和权重向量x的转置乘积来计算投资组合的收益。"],"formulas":[{"latex":"X^T \\Sigma X","symbols":"投资组合的方差","explanation":"投资组合的方差是通过权重向量X和协方差矩阵\\Sigma的乘积来计算的，这表示投资组合的风险。公式中的\\Sigma应为协方差矩阵，而非Sigma，以符合数学符号规范。","evidence":"or inconsistent. Okay. So that's going to be the expected return of the portfolio. And then the variance is going to be X transpose sigma X, right? And so you should have some estimates of what things are going to, you know, the mean and the covariance of these things. Okay. Everybody following this? Okay. You care about two things, which is you would like a portfolio, which on average kind of goes up."},{"latex":"r^T x","symbols":"投资组合的期望收益","explanation":"投资组合的期望收益是通过收益向量r和权重向量x的转置乘积来计算的，这表示投资组合的平均收益。公式中的r应为收益向量，x为权重向量，符合数学符号规范。","evidence":"went up two percent so did asset three asset one went down one percent right that's what it means so and if you form r transpose x that's going to tell you the portfolio uh return right so you know if you have like you know 80 percent here 10 and 10 you just work it out and figure out how well you did and you cut probably went up about you you got dinged a little bit here you probably went up most somewhere near two percent but not quite everybody got that"}],"uncertainties":["sick cone"],"diagram":"none","start":1182.42,"end":1360.21,"asr_flags":[],"math_clarifications":["公式中的\\Sigma应为协方差矩阵，而非Sigma，以符合数学符号规范。公式中的r应为收益向量，x为权重向量，符合数学符号规范。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1182.42,"text":"here is there's going to be a return and the return on your so you know return is like you know the return might look like this right it might be plus 0.02 minus 0.01 you know and and plus 0.02 or something and this means asset one"},{"start":1202.47,"text":"went up two percent so did asset three asset one went down one percent right that's what it means so and if you form r transpose x that's going to tell you the portfolio uh return right so you know if you have like you know 80 percent here 10 and 10 you just work it out and figure out how well you did and you cut probably went up about you you got dinged a little bit here you probably went up most somewhere near two percent but not quite everybody got that"},{"start":1229.61,"text":"Okay, so that's what that, okay. So the model of R is that R is a random vector and will give its first two moments. And those first two moments are going to be the expected value. And P bar transpose, that's going to be the relative price changes, the returns. That's this thing. Oh, I guess I'm using bad notation here. That's fine."},{"start":1255.82,"text":"or inconsistent. Okay. So that's going to be the expected return of the portfolio. And then the variance is going to be X transpose sigma X, right? And so you should have some estimates of what things are going to, you know, the mean and the covariance of these things. Okay. Everybody following this? Okay. You care about two things, which is you would like a portfolio, which on average kind of goes up."},{"start":1281.92,"text":"So you want high mean return. And a lot of people drop the mean and just say high return, right? So that would be how they would say. Of course, that doesn't tell you that every day it's going to go up. It just tells you that if you believe the statistical models, which, by the way, are not very good, and if you were to wind back and repeat that day 10,000 times and take the average, it would have gone up."},{"start":1306.54,"text":"Since the latter is impossible and the first is also false, that's the rough idea. And this thing, that's the variance, that measures actually, that's called the risk of the portfolio. And if you take the square root, it's the standard deviation. And it says, if I'm a portfolio manager and I wake up in the morning, have my coffee, then try to find out, did Stanford's endowment go up or down today? Then I take the mean square value of that."},{"start":1334.13,"text":"That's going to be the risk of the portfolio. It's called volatility or something like that. Again, this is just so you get the idea. So this is really a bi-criterion problem. So I've got two objectives, which is risk and return. Well, the return I want big and the risk I want small. So I could have done this with some sick cone."}],"speech_gaps":[],"frame":"../frames/v007/008.webp","frame_time":1194.42},{"title":"风险与回报的权衡曲线","segments":[{"id":56,"text":"that was kind of like r plus cross minus r plus or something like that, so but the problem with that is then your head explodes if you, I mean, it's correct but it's hard to keep track of, so we'll just we'll just do it this way, we're going to minimize that negative return because we really want that to be high, and the and the variance right, so that's the idea, okay, um, that's what it looks like, um, and then what you could do uh here is you can actually just","zh":"那有点像r加上交叉减去r加上或类似的东西，但问题在于如果你这样想，你的脑袋就会爆炸，我的意思是，这是正确的，但很难跟踪，所以我们就这样做，我们要最小化那个负回报，因为我们真的希望它很高，还有方差，对吧，这就是这个想法，嗯，这就是它看起来的样子，嗯，然后你在这里可以做的是，你可以实际浏览一下，你可以走一遍，这里有一个帕累托曲面，对吧？这里，这些对应于非支配的投资组合。它们实际上会进行权衡，它们会在一条看起来像这样的曲线上进行权衡。这是一条非常标准的曲线。这是一条风险回报权衡曲线，对吧？现在我还没有画出来。如果我要这么做，我会翻转其中一个符号，以及所有那种事情。但这是人们传统上用风险这种方式和回报这种方式来展示它的方法。","start":1360.89,"end":1387.65},{"id":57,"text":"look through, you can walk through, there's a Pareto surface, right? Here, which is on, and those correspond to the non-dominated portfolios. And they actually will trade, they'll trade off a curve that will look like this. This is a very standard curve. It's a risk return trade-off curve, right? And now I haven't drawn it. If I was going to do this, I would flip one sign of it and all that kind of stuff. But this is the traditional way people show it with risk, sorry, return this way and risk this way.","zh":"好的，这就是这个想法。所以在这种情况下，不翻转符号的话，左边是好的，对吧？上方也是好的，对吧？因此你会得到看起来像这样的东西。是的，有一个问题。这是否被认为是凸的，因为负号会稍微改变一些情况？","start":1388.12,"end":1417.5},{"id":58,"text":"Okay? So that's the idea. So in this, without the flips of sign here, left is good, right? And up is good, right? And so you get something that looks like that. Yeah, there's a question. Is this considered convex because the negative changes things a little bit?","zh":"这绝对是凸的，对吧？因为在多目标的情况下，如果我在最小化，每个目标都必须是凸的，对吧？所以这是凸二次的，风险，对吧？而负回报是仿射的。因此它是凸的。好？好的。但确实要检查一下，对吧？我只是把这些内容写下来而没有说这些，但这就是它的样子。好的。","start":1418.28,"end":1439.09},{"id":59,"text":"This is absolutely, this is convex, right? Because here, the rule to, in multi-criterion, if I'm minimizing, each objective has to be convex, right? So this is convex quadratic, the risk, right? And the negative return is affine. So it's convex. Cool? Okay. But yeah, do check, right? I just write these things down without saying that, but that's what it is. Okay.","zh":"总之，这向你展示了，你会把这描述为风险回报权衡曲线。有一些，我不知道，甚至有一些名字我忘记了。我忘了这叫什么。这叫什么，我甚至不记得了。但它有一些，有人知道吗？不管怎样，这没关系。这就是风险回报权衡曲线。让我们就这样留着。或者叫风险回报最优权衡曲线。这就是它看起来的样子。","start":1439.44,"end":1468.17},{"id":60,"text":"Anyway, so this shows you, and you would describe this as the risk-return trade-off curve. And there's some, I don't know, there's even some name which I've forgotten. I forget what this is called. This is called the, I don't even remember anymore. But it's got some, is someone here know? Anyway, it doesn't matter. It's the risk-return trade-off curve. Let's just leave it that way. Or the risk-return optimal trade-off curve. And so this is what it looks like.","zh":"总之，这向你展示了，你会把这描述为风险回报权衡曲线。有一些，我不知道，甚至有一些名字我忘记了。我忘了这叫什么。这叫什么，我甚至不记得了。但它有一些，有人知道吗？不管怎样，这没关系。这就是风险回报权衡曲线。让我们就这样留着。或者叫风险回报最优权衡曲线。这就是它看起来的样子。","start":1469.74,"end":1494.82},{"id":61,"text":"And what this shows is actually the... So here I have four assets, so they add to one. This is a stack plot, right? So a stack plot says if you... Each vertical here gives you a point on the optimal risk-return trade-off curve. And at this point, you've got a little bit of X1, a little bit of X2, ooh, a bunch of X3, and a bunch of X4.","zh":"而这实际上展示的是……所以这里我有四种资产，它们的总和为1。这是一个堆叠图，对吧？所以堆叠图表示，如果你……每个垂直条都给你一个在最优风险-回报权衡曲线上的点。在这个点上，你拥有一点X1，有一点X2，哦，有很多X3，还有很多X4。","start":1496.43,"end":1519.97},{"id":62,"text":"So over here, when you insist on 0% return, you get x4. By the way, x4 is probably cash, which would have no risk.","zh":"在这里，当你坚持要求0%的回报时，你会得到x4。顺便说一下，x4可能代表现金，它没有风险。","start":1520.65,"end":1529.21}],"notes":["本段讲授了风险与回报的权衡曲线，即Pareto前沿。在投资组合优化中，投资者需要在风险和回报之间进行权衡，而Pareto前沿表示了非支配的最优解集合。曲线上的每个点代表一个投资组合，它在风险和回报之间达到某种平衡。","课程中提到，风险与回报的权衡曲线是凸优化问题的一个典型例子。在多目标优化中，每个目标函数需要是凸函数，这样整个问题才是凸的。这里，风险是凸二次函数，而负回报是仿射函数，因此整体问题保持凸性。","在讨论凸性时，讲者指出，即使有负号，只要每个目标函数是凸的，整个问题仍然是凸的。这表明，即使在处理负回报时，只要保持函数的凸性，问题仍然是可解的。","讲者还提到，风险与回报的权衡曲线通常被称为风险-回报权衡曲线或最优风险-回报权衡曲线。曲线上的每个点对应一个投资组合，它在风险和回报之间达到某种平衡。","在具体例子中，讲者提到有四个资产，它们的权重总和为1。通过堆叠图（stack plot），可以直观地看到每个投资组合在风险-回报曲线上的位置。例如，当要求0%回报时，投资组合主要由无风险资产（x4）构成。","最后，讲者指出，x4可能代表现金，因为它没有风险。这说明在投资组合中，无风险资产可以用来调整整体的风险水平，从而达到特定的回报目标。"],"formulas":[],"uncertainties":["r plus cross minus r plus or something like that","flip one sign of it and all that kind of stuff"],"diagram":"none","start":1360.89,"end":1529.21,"asr_flags":[],"math_clarifications":["原始文本中提到的公式缺乏明确的数学表达和上下文，无法核定其正确性。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1360.89,"text":"that was kind of like r plus cross minus r plus or something like that so but the problem with that is then your head explodes if you i mean it's correct but it's hard to keep track of so we'll just we'll just do it this way we're going to minimize that negative return because we really want that to be high and and the and the variance right so that's the idea okay um that's what it looks like um and then what you could do uh here is you can actually just"},{"start":1388.12,"text":"look through, you can walk through, there's a Pareto surface, right? Here, which is on, and those correspond to the non-dominated portfolios. And they actually will trade, they'll trade off a curve that will look like this. This is a very standard curve. It's a risk return trade-off curve, right? And now I haven't drawn it. If I was going to do this, I would flip one sign of it and all that kind of stuff. But this is the traditional way people show it with risk, sorry, return this way and risk this way."},{"start":1418.28,"text":"Okay? So that's the idea. So in this, without the flips of sign here, left is good, right? And up is good, right? And so you get something that looks like that. Yeah, there's a question. Is this considered convex because the negative changes things a little bit?"},{"start":1439.44,"text":"This is absolutely, this is convex, right? Because here, the rule to, in multi-criterion, if I'm minimizing, each objective has to be convex, right? So this is convex quadratic, the risk, right? And the negative return is affine. So it's convex. Cool? Okay. But yeah, do check, right? I just write these things down without saying that, but that's what it is. Okay."},{"start":1469.74,"text":"Anyway, so this shows you, and you would describe this as the risk-return trade-off curve. And there's some, I don't know, there's even some name which I've forgotten. I forget what this is called. This is called the, I don't even remember anymore. But it's got some, is someone here know? Anyway, it doesn't matter. It's the risk-return trade-off curve. Let's just leave it that way. Or the risk-return optimal trade-off curve. And so this is what it looks like."},{"start":1496.43,"text":"And what this shows is actually the... So here I have four assets, so they add to one. This is a stack plot, right? So a stack plot says if you... Each vertical here gives you a point on the optimal risk-return trade-off curve. And at this point, you've got a little bit of X1, a little bit of X2, ooh, a bunch of X3, and a bunch of X4."},{"start":1520.65,"text":"So over here, when you insist on 0% return, you get x4. By the way, x4 is probably cash, which would have no risk."}],"speech_gaps":[],"frame":"../frames/v007/009.webp","frame_time":1372.89},{"title":"凸优化中的风险资产与标量化","segments":[{"id":63,"text":"Right. I don't know what X1 is, but it's probably the most risky of the assets. Right. And so as you take you would say, I'll use the language people would use as you take on more risk. You get a portfolio that actually at some point you stop holding any cash and you only hold this. Maybe these are like bonds or something. I don't know. Right. Then then you start taking on, you know.","zh":"对的。我不知道X1是什么，但它可能是这些资产中最风险的。对的。因此，当你承担更多风险时，你会说，我会用人们常用的语言，你会得到一个投资组合，最终你不再持有任何现金，只持有这个资产。也许这些是债券之类的。我不知道。对的。然后你开始承担，你知道的，某种类型的风险，然后这个会是大盘股，这些可能是小盘股或者其他什么，我只是在编造，但不完全正确。它看起来会像这样，所以这一切都有道理。这就是这个画面，你会在很多地方看到这种变体。嗯，好的。","start":1529.99,"end":1551.35},{"id":64,"text":"uh whatever you know some some type and then this this would be large cap stocks and these would be like small cap or something i'm i'm just making this up but not entirely right so it would look something like this so this all this makes sense so this is this is the picture and you'll you'll see variations on this on this sort of thing all over the place um okay","zh":"顺便说一句，稍后我会展示如何实际计算这个。而且，你们会在作业中做这个。截止日期是星期五。所以实际上做这个相当简单。现在我们将讨论标量化。标量化指的是将向量目标映射到一个单一的得分。","start":1551.7,"end":1571.88},{"id":65,"text":"By the way, a little bit later, I will show how you actually compute this. And for that matter, you will be doing it on your homework. It's due Friday. So it's actually quite straightforward to do this. So now we're going to talk about scalarization. So scalarization, it refers to taking a vector objective and then mapping it down to a single score.","zh":"这将给你一个线性排序，因为在标量化时，你有一个生产设计，我有一个，其中一个更好，因为它达到某个数值。现在，让我们看看如何做到这一点。","start":1572.79,"end":1596.16},{"id":66,"text":"That will give you a linear ordering because when we scalarize, you had a production design and I had one, one of ours is better because it comes up to a certain number. Now, let's see how to do that.","zh":"你会记得几周前我们讨论过，如果你取一个在对偶锥中为正的向量，对吧？然后你最小化lambda转置f(x)，这保证会给你一个最小点，我们现在在这个上下文中称之为帕累托最优解。好的？所以，它说……","start":1597.73,"end":1613.06},{"id":67,"text":"Well, you'll remember from a couple weeks ago, we talked about what happens if you take a vector that's positive in the dual cone, right? And you minimize lambda transpose f of x, that's guaranteed to give you a minimal point, which we now in this context refer to as a Pareto optimal point. Okay? So, it says...","zh":"这个问题是一个普通的凸优化问题。有很多细微差别我没有提到。这里有一个：如果f0(x)是k-凸的，这意味着它是一个向量函数，它是相对于锥k凸的。如果我取lambda在对偶锥中为正，那么这就是一个标量函数。","start":1613.55,"end":1636.41},{"id":68,"text":"This problem here is an ordinary convex optimization problem. There's a whole bunch of subtleties that I'm not mentioning. Here's one. If f0 of x is k-convex, that means it's a vector function, which is k-convex. It's convex with respect to the cone k. If I take lambda as positive in the dual cone, then that's a scalar function.","zh":"这个问题是一个普通的凸优化问题。有很多细微差别我没有提到。这里有一个：如果f0(x)是k-凸的，这意味着它是一个向量函数，它是相对于锥k凸的。如果我取lambda在对偶锥中为正，那么这就是一个标量函数。","start":1636.77,"end":1660.93},{"id":69,"text":"That scalar function is convex. So that's the first thing. So this is an ordinary old convex optimization problem. And, you know, the picture is pretty cool, right? It basically says if here's O, what I do is let me look at level curves of lambda transpose F0 of X, right? And so those are going to be basically hyperplanes in this O space. And then what you want to do is you want to go as far as you can this way, right?","zh":"这个标量函数是凸的。所以这是第一点。因此，这是一个普通的凸优化问题。你明白吧，这个图像相当漂亮，对吧？基本上它说的是，如果这里有一个原点O，我的做法是查看lambda转置F0的X的等值线，对吧？这些等值线基本上是在这个O空间中的超平面。然后你想要做的就是沿着这个方向尽可能地走远，对吧？","start":1661.47,"end":1688.03}],"notes":["本段首先讨论了风险资产的配置问题，其中X1被假设为最风险的资产。讲者提到随着风险的增加，投资组合会逐渐减少现金持有，转而持有更多高风险资产，如股票或债券。这些例子帮助理解资产配置的动态变化。","接下来，讲者提到将向量目标函数映射为单一标量值的过程，即标量化。这一过程可以产生线性排序，因为标量化后可以比较不同方案的优劣。","在标量化过程中，讲者回顾了之前讨论的内容，即当向量在对偶锥中为正时，通过最小化lambda转置f(x)可以得到一个Pareto最优解。这表明标量化方法在优化问题中的应用。","讲者进一步指出，该问题是一个普通的凸优化问题，其中f0(x)是k-凸函数，即相对于锥k是凸的。当lambda在对偶锥中为正时，标量函数是凸的，这保证了问题的凸性。","最后，讲者提到通过观察lambda转置F0(x)的等高线（即超平面）来寻找最优解。这表明在凸优化中，通过几何方法可以直观地理解优化过程。","整个段落强调了凸优化在实际问题中的应用，如资产配置和标量化方法，同时指出这些方法在计算和理论上的基础。"],"formulas":[{"latex":"\\text{minimize } \\boldsymbol{\\lambda}^T f(x)","symbols":"最小化 lambda 转置 f(x)","explanation":"该公式正确表达了通过最小化lambda转置f(x)来得到Pareto最优解的标量化方法，符合原文描述。","evidence":"Well, you'll remember from a couple weeks ago, we talked about what happens if you take a vector that's positive in the dual cone, right? And you minimize lambda transpose f of x, that's guaranteed to give you a minimal point, which we now in this context refer to as a Pareto optimal point. Okay? So, it says..."},{"latex":"\\text{level curves of } \\boldsymbol{\\lambda}^T F_0(x)","symbols":"lambda 转置 F0(x) 的等高线","explanation":"该公式正确描述了lambda转置F0(x)的等高线，即超平面，用于寻找凸优化问题的最优解，符合原文描述。","evidence":"That scalar function is convex. So that's the first thing. So this is an ordinary old convex optimization problem. And, you know, the picture is pretty cool, right? It basically says if here's O, what I do is let me look at level curves of lambda transpose F0 of X, right? And so those are going to be basically hyperplanes in this O space. And then what you want to do is you want to go as far as you can this way, right?"}],"uncertainties":["lambda transpose f of x"],"diagram":"none","start":1529.99,"end":1688.03,"asr_flags":[],"math_clarifications":["公式0无法核定，因为原文未明确说明k-凸函数的定义和条件，且未提供足够的上下文来验证其数学正确性。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1529.99,"text":"Right. I don't know what X1 is, but it's probably the most risky of the assets. Right. And so as you take you would say, I'll use the language people would use as you take on more risk. You get a portfolio that actually at some point you stop holding any cash and you only hold this. Maybe these are like bonds or something. I don't know. Right. Then then you start taking on, you know."},{"start":1551.7,"text":"uh whatever you know some some type and then this this would be large cap stocks and these would be like small cap or something i'm i'm just making this up but not entirely right so it would look something like this so this all this makes sense so this is this is the picture and you'll you'll see variations on this on this sort of thing all over the place um okay"},{"start":1572.79,"text":"By the way, a little bit later, I will show how you actually compute this. And for that matter, you will be doing it on your homework. It's due Friday. So it's actually quite straightforward to do this. So now we're going to talk about scalarization. So scalarization, it refers to taking a vector objective and then mapping it down to a single score."},{"start":1597.73,"text":"That will give you a linear ordering because when we scalarize, you had a production design and I had one, one of ours is better because it comes up to a certain number. Now, let's see how to do that."},{"start":1613.55,"text":"Well, you'll remember from a couple weeks ago, we talked about what happens if you take a vector that's positive in the dual cone, right? And you minimize lambda transpose f of x, that's guaranteed to give you a minimal point, which we now in this context refer to as a Pareto optimal point. Okay? So, it says..."},{"start":1636.77,"text":"This problem here is an ordinary convex optimization problem. There's a whole bunch of subtleties that I'm not mentioning. Here's one. If f0 of x is k-convex, that means it's a vector function, which is k-convex. It's convex with respect to the cone k. If I take lambda as positive in the dual cone, then that's a scalar function."},{"start":1661.47,"text":"That scalar function is convex. So that's the first thing. So this is an ordinary old convex optimization problem. And, you know, the picture is pretty cool, right? It basically says if here's O, what I do is let me look at level curves of lambda transpose F0 of X, right? And so those are going to be basically hyperplanes in this O space. And then what you want to do is you want to go as far as you can this way, right?"}],"speech_gaps":[],"frame":"../frames/v007/010.webp","frame_time":1541.99},{"title":"多目标优化与标量化","segments":[{"id":70,"text":"And in this case, you would find this point. And sure enough, it is indeed an optimal point, right? And also, a lot of other ideas come up here that you would see. You could see that right here, this is tangent to this thing. And that roughly means it's got a slope that's like, you know, minus one over lambda or something. But it basically tells you locally the trade-off between the two variables. Between, sorry, the two objectives.","zh":"在这种情况下，你会找到这个点。确实，它确实是一个最优解，对吧？此外，这里还会出现很多其他想法，你会看到。你可以看到，这里与这个东西相切。这大致意味着它的斜率类似于负一除以λ或者类似的东西。但基本上，它告诉你在两个变量之间局部的权衡关系。在，抱歉，两个目标之间。","start":1689.41,"end":1715.53},{"id":71,"text":"Right? So there's going to be... It's like an exchange rate. We'll get to that. And in fact, it is correct to think of the lambda here as a vector of prices. We'll get to that. Okay. So in some ways, this is making something very intuitive, kind of fancy. But that's okay. This doesn't bother me, right? Like, I mean, a gazillion people see multi-criterion optimization all the time.","zh":"对吧？所以这里会有一种类似于汇率的东西。我们之后会讲到。事实上，将这里的λ视为价格向量是正确的。我们之后会讲到。好的。在某种程度上，这在做非常直观的事情，有点复杂。但这没关系。这对我来说并不困扰，对吧？我的意思是，无数人一直在处理多目标优化。","start":1716.3,"end":1743.32},{"id":72,"text":"But all they do is they just immediately do without even saying anything. They just say, how do we solve it? And you go, we'll just throw in some weights, right? Like you're doing regularization in machine learning. So you throw in loss plus lambda. Why is this dinging at me?","zh":"但是他们所做的只是直接去做，甚至不提任何事情。他们只是问，我们如何解决它？然后你会说，我们只需加入一些权重，对吧？就像你在机器学习中做正则化。所以你加入损失加上λ。为什么这会让我感到困扰？","start":1743.96,"end":1761.36},{"id":73,"text":"There we go. You throw in loss plus lambda times your regularizer. Everybody, you've seen this and you've seen this in lots of it. And people, they don't even say anything about it, but it's because it's obvious and it's fine. But this is kind of, this is what you were doing.","zh":"就是这样。你加入损失加上λ乘以你的正则化项。每个人，你们都见过这个，而且在很多地方都见过。人们甚至不谈论它，但这是因为这是显而易见的，而且是合理的。但这就是你们一直在做的事情。","start":1763.58,"end":1782.15},{"id":74,"text":"Okay. Now for multi-criterion problems, we can be a lot more specific about what... what this particular scalarization does. So what it does is, it's actually kind of cool. It basically says, here are these things that you want small. F capital F1 all the way to capital FQ. You want them all small. Then these are positive numbers. And we can actually literally interpret the lambdas as literally the price of","zh":"好的。对于多目标问题，我们可以更具体地说明这种标量化做了什么。所以它所做的，实际上相当有趣。它基本上说，这里有你想要小的东西。F大F1一直到大FQ。你希望它们全部都小。然后这些是正数。我们实际上可以将λ字面地解释为这些的代价。","start":1783.57,"end":1808.87},{"id":75,"text":"that objective. That's how much you will pay. If that's 12 and that's like, you know, whatever, 10, then this is going to cost you 120 bucks. So the lambdas are literally prices here, right? And this would be like, for example, if we had two production, you say, well, I know how to do, or, you know, if I'm designing a circuit and I say I want both the area to be small, the dynamic power to be small, you know, these kinds of, these types of things, we would just set prices.","zh":"这个目标。这就是你将要支付的代价。如果这个是12，而那个是，你知道的，随便什么，比如10，那么这将花费你120美元。因此，这里的lambda实际上就是价格，对吧？例如，如果我们有两个生产目标，你可以说，我了解如何做，或者，你知道的，如果我在设计一个电路，并且我说我希望面积小，动态功耗也小，这种类型的事情，我们只需要设置这些价格。","start":1809.4,"end":1837.18},{"id":76,"text":"for those objectives and then this is the total price what's interesting there is you can change the prices and you'll get a different choice in fact this is what will allow you to actually move along the trade-off curve if there's two if there's more people call it the trade-off surface
