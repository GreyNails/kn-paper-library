62,"text":"And that would be this constraint here."},{"start":3393.84,"text":"Sorry, inequality, right?"}],"speech_gaps":[],"frame":"../frames/v007/020.webp","frame_time":3227.95},{"title":"对偶函数的性质与应用","segments":[{"id":186,"text":"Cool, okay.","zh":"不错，好的。","start":3396.06,"end":3397.0},{"id":187,"text":"Alright, okay, let's look at some examples.","zh":"好的，好的，我们来看一些例子。","start":3399.06,"end":3402.48},{"id":188,"text":"So here's one, minimize the sum of squares of a vector subject to x equals b, it's like","zh":"所以这里有一个例子，最小化一个向量的平方和，约束条件是x等于b，这类似于最小范数问题，你知道这是有解析解的","start":3405.14,"end":3409.92},{"id":189,"text":"a least norm or something like that problem, and you know there's an analytical solution","zh":"所以这个例子有点傻，但只是为了看看它是怎么运作的，对吧？","start":3409.92,"end":3413.48},{"id":190,"text":"so this is silly, but just to see how this works, right?","zh":"所以这里我们怎么做呢？我们构造拉格朗日函数，这是目标函数，加上","start":3413.48,"end":3416.66},{"id":191,"text":"So here's what we do, we form the Lagrangian, that's the objective, plus","zh":"新转置，这是等式约束。新转置AX减去B，这是违反约束的程度。这是一个凸二次函数。我们通过最小化它来得到对偶函数。为了最小化它，只需要将梯度设为零。这是一组线性方程。然后我们得到X等于这个值。现在我将这个X代入L中。","start":3416.84,"end":3421.62},{"id":192,"text":"New transpose, that's an equality constraint. New transpose AX minus B, that's the violation. This is a convex quadratic function. We minimize that to get the dual function. To minimize that, you just set the gradient equal to zero. It's a set of linear equations. And you get X is that. Now I plug this X back in to L.","zh":"这就是拉格朗日函数，用来找到g of nu的值。当我这样做时，我得到g of nu等于这里的东西。我不再详细推导代数运算，但也不复杂。而且确实如此，看看这个。它是凹函数。为什么？因为这是凸函数。AA转置在这里是半正定的。抱歉，是半正定的。这个带有负号的凸函数，它将是一个凹函数，对吧？","start":3422.28,"end":3445.68},{"id":193,"text":"That's the Lagrangian to find what g of nu is. And when I do that, I get g of nu is this thing here. I'm not going over the algebra, but it's not much. And sure enough, look at that. That is concave. Why? Because this is convex. AA transpose is convex here. Sorry, is positive semi-definite. This is convex with the minus sign. It's going to be concave, right?","zh":"这就是用于求解g(ν)的拉格朗日函数。当我这样做时，我得到了这里的g(ν)。我不再详细讲解代数运算，但其实并不复杂。确实如此，看看这里。这是凹函数。为什么？因为这里是凸函数。AA的转置在这里是半正定的。抱歉，应该是半正定的。这里带有负号的凸函数，结果会是凹函数，对吧？","start":3446.38,"end":3472.36},{"id":194,"text":"Sure enough, so that's good. I mean, we knew it had to be, right? But now, what's interesting about that is it says, if you wanted to solve this problem, then it says immediately, if you pick any vector nu at all, and you evaluate that function, that is a lower bound on this problem. Okay? I don't know. Let's try some. Here's one. Nu equals zero.","zh":"确实如此，这很好。我的意思是，我们知道它必须如此，对吧？但现在，有趣的是，它指出，如果你想解决这个问题，那么它立即说明，如果你选择任何向量nu，然后计算该函数的值，它就是这个问题的一个下界。明白吗？我不确定。让我们试一下。例如，nu等于零。","start":3473.4,"end":3502.08},{"id":195,"text":"What's the lower bound on this problem? If I take nu equals zero, what lower bound do I get? Zero. Okay, so then I say to you, I say to you, oh, wow, yeah, thanks for showing me your problem. I can tell you this. You ready for this? By duality, I can tell you this optimal value could never be negative. People would look at you like you're an idiot because, of course, the objective is like non-negative. Okay, everybody see what I'm saying? Okay, so, okay.","zh":"这个问题的下界是什么？如果我取nu等于零，我会得到什么样的下界？零。好的，那么我对你说，哇，是的，谢谢你展示你的问题。我可以告诉你，这个最优值永远不会是负数。人们会看你像傻子一样，因为当然，目标函数是非负的。大家明白我在说什么吗？好的，那么，好的。","start":3504.15,"end":3532.9},{"id":196,"text":"Let's see. Okay, so that's the lower bound. Anyway, that's the idea. But this actually already has weird applications, right? Because you could have some gigantic problem like this. We can solve it analytically. But you have some quick heuristic to do it. I mean, it could have a billion variables. And you have some quick heuristic to do it. And then you could just ask yourself, how far am I from optimal? And you would just calculate this bound.","zh":"让我们看看。好的，这就是下界。不管怎样，这就是这个想法。但事实上，这已经有一些奇怪的应用，对吧？因为你可能会有一些巨大的问题像这样。我们可以用解析的方法来解决它。但你也可以有一些快速的启发式方法来处理它。我的意思是，它可能有十亿个变量。你也可以有一些快速的启发式方法来处理它。然后你只需要问自己，我离最优解有多远？你只需要计算这个下界。","start":3535.31,"end":3557.43}],"notes":["本段讲解了对偶函数的性质，即对偶函数是凹函数。这是因为原问题的拉格朗日函数是凸函数，而对偶函数是拉格朗日函数关于拉格朗日乘数的下确界，因此是凹函数。","通过一个具体的例子，即最小化向量的平方和并满足约束条件x = b的问题，展示了如何构造拉格朗日函数，并通过求导得到对偶函数。该对偶函数的凹性被验证，因为其构造中包含了凸函数的负数。","对偶函数的凹性意味着它在任何拉格朗日乘数向量ν下都能提供原问题的下界。例如，当ν = 0时，对偶函数的值为0，这表明原问题的最优值不可能为负数。","该段还提到对偶函数的应用，即使在变量数量巨大的情况下，也可以通过解析方法快速求解，并通过计算对偶函数的值来评估与最优解的距离。","讲者强调了对偶函数在实际问题中的重要性，特别是在优化问题中，对偶函数可以作为评估解质量的工具。","通过具体例子和数学推导，讲者展示了对偶函数的构造过程及其性质，帮助学生理解对偶问题与原问题之间的关系。"],"formulas":[{"latex":"L(x, \\nu) = \\frac{1}{2}x^T x - \\nu^T (Ax - b)","symbols":"L(x, ν) 是拉格朗日函数，x 是变量，ν 是拉格朗日乘数，A 是矩阵，b 是向量","explanation":"此式依据本段讲述统一排版；符号含义见上文，必要时对照原视频板书。","evidence":"So here's what we do, we form the Lagrangian, that's the objective, plus New transpose, that's an equality constraint. New transpose AX minus B, that's the violation. This is a convex quadratic function. We minimize that to get the dual function. To minimize that, you just set the gradient equal to zero. It's a set of linear equations. And you get X is that. Now I plug this X back in to L."},{"latex":"g(\\nu) = \\text{inf}_{x} L(x, \\nu)","symbols":"g(ν) 是对偶函数，表示拉格朗日函数关于x的下确界","explanation":"此式依据本段讲述统一排版；符号含义见上文，必要时对照原视频板书。","evidence":"That's the Lagrangian to find what g of nu is. And when I do that, I get g of nu is this thing here. I'm not going over the algebra, but it's not much. And sure enough, look at that. That is concave. Why? Because this is convex. AA transpose is convex here. Sorry, is positive semi-definite. This is convex with the minus sign. It's going to be concave, right?"},{"latex":"g(\\nu) = -\\frac{1}{2} \\nu^T A^T A \\nu + \\nu^T b","symbols":"对偶函数的表达式，其中A^T A 是正半定矩阵，因此g(ν) 是凹函数","explanation":"此式依据本段讲述统一排版；符号含义见上文，必要时对照原视频板书。","evidence":"That's the Lagrangian to find what g of nu is. And when I do that, I get g of nu is this thing here. I'm not going over the algebra, but it's not much. And sure enough, look at that. That is concave. Why? Because this is convex. AA transpose is convex here. Sorry, is positive semi-definite. This is convex with the minus sign. It's going to be concave, right?"}],"uncertainties":[],"diagram":"none","start":3396.06,"end":3557.43,"asr_flags":[],"math_clarifications":["公式中的符号和表达式均符合数学规范，未发现明显错误。"],"boards":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":3396.06,"text":"Cool, okay."},{"start":3399.06,"text":"Alright, okay, let's look at some examples."},{"start":3405.14,"text":"So here's one, minimize the sum of squares of a vector subject to x equals b, it's like"},{"start":3409.92,"text":"a least norm or something like that problem, and you know there's an analytical solution"},{"start":3413.48,"text":"so this is silly, but just to see how this works, right?"},{"start":3416.84,"text":"So here's what we do, we form the Lagrangian, that's the objective, plus"},{"start":3422.28,"text":"New transpose, that's an equality constraint. New transpose AX minus B, that's the violation. This is a convex quadratic function. We minimize that to get the dual function. To minimize that, you just set the gradient equal to zero. It's a set of linear equations. And you get X is that. Now I plug this X back in to L."},{"start":3446.38,"text":"That's the Lagrangian to find what g of nu is. And when I do that, I get g of nu is this thing here. I'm not going over the algebra, but it's not much. And sure enough, look at that. That is concave. Why? Because this is convex. AA transpose is convex here. Sorry, is positive semi-definite. This is convex with the minus sign. It's going to be concave, right?"},{"start":3473.4,"text":"Sure enough, so that's good. I mean, we knew it had to be, right? But now, what's interesting about that is it says, if you wanted to solve this problem, then it says immediately, if you pick any vector nu at all, and you evaluate that function, that is a lower bound on this problem. Okay? I don't know. Let's try some. Here's one. Nu equals zero."},{"start":3504.15,"text":"What's the lower bound on this problem? If I take nu equals zero, what lower bound do I get? Zero. Okay, so then I say to you, I say to you, oh, wow, yeah, thanks for showing me your problem. I can tell you this. You ready for this? By duality, I can tell you this optimal value could never be negative. People would look at you like you're an idiot because, of course, the objective is like non-negative. Okay, everybody see what I'm saying? Okay, so, okay."},{"start":3535.31,"text":"Let's see. Okay, so that's the lower bound. Anyway, that's the idea. But this actually already has weird applications, right? Because you could have some gigantic problem like this. We can solve it analytically. But you have some quick heuristic to do it. I mean, it could have a billion variables. And you have some quick heuristic to do it. And then you could just ask yourself, how far am I from optimal? And you would just calculate this bound."}],"speech_gaps":[{"start":3403.168,"end":3404.74}],"frame":"../frames/v007/021.webp","frame_time":3408.06},{"title":"对偶函数的性质","segments":[{"id":197,"text":"You'd have to find a good choice of new, and you get a lower bound. You go, I'm 5% optimal, and you're like, totally cool, because our original problem, nothing there was accurate to more than 5% anyway. So we'll get to that. There are going to be a lot of applications of this, which we'll get to shortly. Now it's going to be not obvious. So let's do standard form linear program. So here...","zh":"你得找到一个好的新选择，并且你会得到一个下界。你会说，我有5%的最优性，而你会觉得这完全没问题，因为原来的问题中，没有任何地方的准确性超过5%。所以我们会讲到这一点。这将有很多应用，我们很快就会讲到。现在这将不那么明显。所以让我们做标准形式的线性规划。所以这里……","start":3558.01,"end":3581.19},{"id":198,"text":"I want to minimize this linear function subject to equality constraints and a non-negativity on x. So my Lagrangian is this. It's the objective plus equality constraints interproducted with this Lagrange multiplier nu.","zh":"我想最小化这个线性函数，受到等式约束和对x的非负性约束。因此我的拉格朗日函数是这个。它是目标函数加上等式约束与这个拉格朗日乘子nu的乘积。","start":3581.6,"end":3595.48},{"id":199,"text":"And then I'm going to rewrite this silently as minus x less than or equal to zero. So it's in our standard form. And then you get minus lambda transpose x. And so this is the Lagrangian. What kind of function of x is this function? What is it? It's affine, right? So to find g, we have to minimize that function over x, right? What's the minimum of an affine function?","zh":"然后我会默默地将这个重写为减去x小于等于零。因此它处于我们的标准形式。然后你会得到减去lambda转置x。因此这就是拉格朗日函数。这个函数关于x是什么类型的函数？它是什么？它是仿射函数，对吧？为了找到g，我们必须在x上最小化这个函数，对吧？仿射函数的最小值是什么？","start":3596.58,"end":3623.2},{"id":200,"text":"Yeah, basically it's minus infinity. Usually. There is one exception. How could the minimum of an affine function not be minus infinity? Restricted on the domain. No, I'm not restricting on the domain. I'm just having an ordinary old affine function. Here's my affine function. Here, let's go...","zh":"是的，基本上它是负无穷大。通常如此。有一个例外情况。为什么仿射函数的最小值不是负无穷大？受到定义域的限制。不，我没有对定义域进行限制。我只是有一个普通的仿射函数。这里是我的仿射函数。让我们来看……","start":3626.14,"end":3653.78},{"id":201,"text":"p transpose x plus q. There's my affine function. I'd like to minimize that over x, and I'd like to know what the minimum is. Well, it's usually minus infinity, right? But there's one case where it's not. If p is zero, which means that there's no, if the linear part vanishes, then what is this thing? So if I write, so I would write something like this. Inf over x of this, whoops.","zh":"p转置x加上q。这就是我的仿射函数。我想在x上最小化它，并想知道最小值是什么。通常它是负无穷大，对吧？但有一个情况不是。如果p为零，这意味着线性部分消失，那么这个是什么？所以我会写成这样。关于x的下确界，啊，对不起。","start":3655.21,"end":3682.33},{"id":202,"text":"Right? This is going to equal, it's going to be, mostly it's going to be minus infinity, but here it's going to be q, and that's if p equals zero. Okay? Everybody got that? So that's, okay, that was a pretty quick calculation there. And then that's what we have over here. So when I minimize this Lagrangian over x to get g,","zh":"对吧？这将等于，它将等于，大部分情况下是负无穷大，但在这里它将等于q，当且仅当p等于零。明白了吗？所以这就是我们在这里的情况。当我通过x最小化这个拉格朗日函数以得到g时，","start":3682.8,"end":3705.72},{"id":203,"text":"That's the dual function. I minimize this, and basically what happens is, you know, if this is non-zero, the minimum is minus infinity. Otherwise, I assume this is zero, and it's equal to that thing. So this is what I get, okay? Okay, so g is, in fact, it's a linear function restricted to a hyperplane. That's a, not a hyperplane, an affine set.","zh":"这就是对偶函数。我最小化这个函数，基本上会发生的是，如果你这个值不为零，那么最小值就是负无穷。否则，我假设这个值为零，它就等于那个表达式。所以这就是我得到的结果，对吧？好的，所以g实际上是一个在超平面上的线性函数。这是个仿射集，而不是超平面。","start":3706.43,"end":3735.5}],"notes":["本段讲解了对偶函数的性质，特别是当目标函数为仿射函数时的最小值情况。当仿射函数的线性部分不为零时，最小值通常为负无穷，只有当线性部分为零时，最小值才为常数项。这说明了对偶函数在某些情况下可能不具有有限值，这与原问题的约束条件有关。","讲者通过一个具体的例子说明了仿射函数的最小值情况，即当线性部分为零时，最小值为常数项。这表明对偶函数的结构取决于原问题的约束条件和目标函数的形式。","讲者指出，当最小化仿射函数时，如果线性部分不为零，最小值为负无穷，这说明了对偶函数在某些情况下可能无法提供有用的信息，需要进一步的约束条件。","讲者还提到，对偶函数实际上是一个仿射集，这表明对偶函数的结构与原问题的约束条件密切相关，特别是在处理线性规划问题时。","讲者强调了对偶函数的计算过程，即通过最小化拉格朗日函数得到对偶函数，这需要考虑原问题的约束条件和目标函数的形式。","讲者通过具体的例子和解释，帮助学生理解对偶函数的性质，特别是在处理线性规划问题时，对偶函数的结构和最小值情况。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3558.01,"end":3735.5,"asr_flags":[],"math_clarifications":["原始片段中未明确说明 g(x) 的定义，且公式中未出现 g(x) 的定义，因此无法核对。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3558.01,"text":"You'd have to find a good choice of new, and you get a lower bound. You go, I'm 5% optimal, and you're like, totally cool, because our original problem, nothing there was accurate to more than 5% anyway. So we'll get to that. There are going to be a lot of applications of this, which we'll get to shortly. Now it's going to be not obvious. So let's do standard form linear program. So here..."},{"start":3581.6,"text":"I want to minimize this linear function subject to equality constraints and a non-negativity on x. So my Lagrangian is this. It's the objective plus equality constraints interproducted with this Lagrange multiplier nu."},{"start":3596.58,"text":"And then I'm going to rewrite this silently as minus x less than or equal to zero. So it's in our standard form. And then you get minus lambda transpose x. And so this is the Lagrangian. What kind of function of x is this function? What is it? It's affine, right? So to find g, we have to minimize that function over x, right? What's the minimum of an affine function?"},{"start":3626.14,"text":"Yeah, basically it's minus infinity. Usually. There is one exception. How could the minimum of an affine function not be minus infinity? Restricted on the domain. No, I'm not restricting on the domain. I'm just having an ordinary old affine function. Here's my affine function. Here, let's go..."},{"start":3655.21,"text":"p transpose x plus q. There's my affine function. I'd like to minimize that over x, and I'd like to know what the minimum is. Well, it's usually minus infinity, right? But there's one case where it's not. If p is zero, which means that there's no, if the linear part vanishes, then what is this thing? So if I write, so I would write something like this. Inf over x of this, whoops."},{"start":3682.8,"text":"Right? This is going to equal, it's going to be, mostly it's going to be minus infinity, but here it's going to be q, and that's if p equals zero. Okay? Everybody got that? So that's, okay, that was a pretty quick calculation there. And then that's what we have over here. So when I minimize this Lagrangian over x to get g,"},{"start":3706.43,"text":"That's the dual function. I minimize this, and basically what happens is, you know, if this is non-zero, the minimum is minus infinity. Otherwise, I assume this is zero, and it's equal to that thing. So this is what I get, okay? Okay, so g is, in fact, it's a linear function restricted to a hyperplane. That's a, not a hyperplane, an affine set."}],"speech_gaps":[],"frame":"../frames/v007/022.webp","frame_time":3570.01},{"title":"对偶函数与下界性质","segments":[{"id":204,"text":"That is, in fact, a concave function, right? I mean, it kind of has to be, right? And you know what this says? I'm going to rewrite this. This says that A transpose nu minus lambda plus C is zero. That means A transpose nu plus C equals lambda. Lambda is any parameter that's bigger than or equal to zero. And then I get this lower bound property. It says this. It says, you look at this linear program, and it says, yeah, you know what? The optimal value of this thing...","zh":"也就是说，实际上这是一个凹函数，对吧？我的意思是，它几乎不得不如此，对吧？你们知道这说明了什么吗？我要重新写下这个。它说明A的转置乘以nu减去lambda加上C等于零。这意味着A的转置乘以nu加上C等于lambda。lambda是任何大于等于零的参数。然后我得到了这个下界性质。它说，你看这个线性规划问题，它说，是的，你知道吗？这个东西的最优值……","start":3735.95,"end":3762.95},{"id":205,"text":"is bigger than or equal to minus b transpose nu. For any nu that satisfies a transpose nu plus c is bigger than or equal to zero. Okay? Everybody... And that just came straight from the dual function. Now, it turns out for a lot of these, you can just show it directly and it's not hard. I mean, I could do it. Let me do it for that one. And then I don't think I'll ever do it again. But I'll do it for that one. Let's do that. So, my original problem is minimize.","zh":"大于等于负的b转置乘以nu。对于任何满足a转置乘以nu加上c大于等于零的nu来说都是如此。好吗？大家……而这直接来自于对偶函数。事实上，对于很多这类问题，你只需直接证明它，而且并不困难。我的意思是，我能做到。让我为那个问题做一次。然后我想我不会再做第二次了。但我会为那个问题做一次。让我们来做这个。我的原始问题是最小化。","start":3763.28,"end":3792.98},{"id":206,"text":"c transpose x, and then subject to, I think it's ax equals b, and x is bigger than zero, right? And then the claim is, if somebody walks up to me on the street and says, I have a vector nu, and what is it, a transpose nu plus c is bigger than zero, they claim then, this implies that minus b transpose,","zh":"c转置乘以x，然后受到约束，我认为是ax等于b，且x大于零，对吧？然后这个主张是，如果有人走上前来对我说，我有一个向量nu，它是什么，a转置乘以nu加上c大于零，他们声称，这将意味着负的b转置乘以……","start":3793.9,"end":3822.63},{"id":207,"text":"Sorry, you have to look at it over here. New is a lower bound on P star. Okay? So this is pretty cool, right? So that's what it says, right? Now, I mean, if we just asked, so you came up to someone on the street, or now if we put that on a homework, you couldn't, I mean, you couldn't do that. It's like...","zh":"抱歉，你必须在这里看。新的是一个对P星的下界。好吗？所以这很酷，对吧？这就是它所说的，对吧？现在，我的意思是，如果我们只是问，所以你走上前来问某人，或者现在如果我们把它放在作业上，你不能，我的意思是，你不能这么做。这就像……","start":3824.39,"end":3843.96},{"id":208,"text":"How would you show that? It looks very deep, but in fact it used absolutely nothing but the completely trivial steps I had before. So this we can show, let's just show this directly just for fun, right? So here's what we're going to do. Suppose x is feasible. Any x is feasible. That means ax equals b, x is bigger than or equal to zero. Okay, now if that's the case, then let me take, let me look at this.","zh":"你怎么证明这一点？看起来非常深刻，但实际上它只用了我之前完全平凡的步骤。所以我们可以证明这一点，让我们为了好玩直接证明一下，对吧？所以这里我们将会怎么做。假设x是可行的。任何x都是可行的。这意味着ax等于b，x大于等于零。好的，现在如果这种情况成立，那么让我取，让我看一下这个。","start":3845.26,"end":3872.71},{"id":209,"text":"new transpose, then this must be true, right? Because x is feasible, so ax equals b, so this surely holds, right? Oh, and I'm assuming somebody came up with a new that satisfies this. Everybody agree with that? I mean, you kind of have to, right? It's like simple stuff. Okay. But then I'm going to write this thing. This says that a transpose, here, this is a transpose new.","zh":"新的转置，那么这必须成立，对吧？因为x是可行的，所以ax等于b，所以这肯定成立，对吧？哦，而且我假设有人提出了一个新的满足这个条件的。大家同意这一点吗？我是说，你其实不得不这样，对吧？这就像很简单的东西。好的。但接下来我要写下这个式子。这里说的是a的转置，这里是新的转置。","start":3873.43,"end":3900.56}],"notes":["本段主要讲解了对偶函数的性质，特别是其如何提供原问题的下界。讲者指出，对偶函数的下界性质来源于原问题的可行性条件，即对于任何满足约束条件的向量，对偶函数的值不会超过原问题的最优值。","讲者通过一个具体的例子来说明这一性质，即原问题是一个线性规划问题，目标是最小化c^T x，约束条件为Ax = b和x ≥ 0。对于满足a^T ν + c ≥ 0的向量ν，对偶函数的值提供了原问题最优值的下界。","讲者强调，虽然这个性质看起来很深奥，但实际上它只是基于一些基本的步骤，即原问题的可行性条件和对偶函数的定义。因此，可以通过直接证明来验证这一性质。","讲者还提到，如果有人在街上问这个问题，或者将其作为作业题，学生可能无法直接解决，因为需要理解对偶函数和原问题之间的关系。","讲者通过假设x是可行的，即满足Ax = b和x ≥ 0，来推导出对偶函数的下界性质。这表明，只要满足这些条件，对偶函数的值就会提供原问题最优值的下界。","最后，讲者指出，对偶函数的下界性质是凸优化中的一个重要概念，它帮助我们理解原问题和对偶问题之间的关系，并为后续的优化算法提供了理论基础。"],"formulas":[{"latex":"P^* \\geq -b^T \\nu","symbols":"P* ≥ -b^T ν","explanation":"原问题的最优值P*大于等于对偶函数的值，即 -b^T ν。","evidence":"That is, in fact, a concave function, right? I mean, it kind of has to be, right? And you know what this says? I'm going to rewrite this. This says that A transpose nu minus lambda plus C is zero. That means A transpose nu plus C equals lambda. Lambda is any parameter that's bigger than or equal to zero. And then I get this lower bound property. It says this. It says, you look at this linear program, and it says, yeah, you know what? The optimal value of this thing..."},{"latex":"a^T \\nu + c \\geq 0","symbols":"a^T ν + c ≥ 0","explanation":"对偶函数的约束条件，即a^T ν + c ≥ 0。","evidence":"c transpose x, and then subject to, I think it's ax equals b, and x is bigger than zero, right? And then the claim is, if somebody walks up to me on the street and says, I have a vector nu, and what is it, a transpose nu plus c is bigger than zero, they claim then, this implies that minus b transpose,"},{"latex":"Ax = b, x \\geq 0","symbols":"Ax = b, x ≥ 0","explanation":"原问题的约束条件，即Ax = b和x ≥ 0。","evidence":"c transpose x, and then subject to, I think it's ax equals b, and x is bigger than zero, right? And then the claim is, if somebody walks up to me on the street and says, I have a vector nu, and what is it, a transpose nu plus c is bigger than zero, they claim then, this implies that minus b transpose,"}],"uncertainties":[],"diagram":"none","start":3735.95,"end":3900.56,"asr_flags":[],"math_clarifications":["公式0中的等号不正确，因为对偶函数的表达式应为A^T ν - λ + C = 0，而不是A^T ν + C = λ。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3735.95,"text":"That is, in fact, a concave function, right? I mean, it kind of has to be, right? And you know what this says? I'm going to rewrite this. This says that A transpose nu minus lambda plus C is zero. That means A transpose nu plus C equals lambda. Lambda is any parameter that's bigger than or equal to zero. And then I get this lower bound property. It says this. It says, you look at this linear program, and it says, yeah, you know what? The optimal value of this thing..."},{"start":3763.28,"text":"is bigger than or equal to minus b transpose nu. For any nu that satisfies a transpose nu plus c is bigger than or equal to zero. Okay? Everybody... And that just came straight from the dual function. Now, it turns out for a lot of these, you can just show it directly and it's not hard. I mean, I could do it. Let me do it for that one. And then I don't think I'll ever do it again. But I'll do it for that one. Let's do that. So, my original problem is minimize."},{"start":3793.9,"text":"c transpose x, and then subject to, I think it's ax equals b, and x is bigger than zero, right? And then the claim is, if somebody walks up to me on the street and says, I have a vector nu, and what is it, a transpose nu plus c is bigger than zero, they claim then, this implies that minus b transpose,"},{"start":3824.39,"text":"Sorry, you have to look at it over here. New is a lower bound on P star. Okay? So this is pretty cool, right? So that's what it says, right? Now, I mean, if we just asked, so you came up to someone on the street, or now if we put that on a homework, you couldn't, I mean, you couldn't do that. It's like..."},{"start":3845.26,"text":"How would you show that? It looks very deep, but in fact it used absolutely nothing but the completely trivial steps I had before. So this we can show, let's just show this directly just for fun, right? So here's what we're going to do. Suppose x is feasible. Any x is feasible. That means ax equals b, x is bigger than or equal to zero. Okay, now if that's the case, then let me take, let me look at this."},{"start":3873.43,"text":"new transpose, then this must be true, right? Because x is feasible, so ax equals b, so this surely holds, right? Oh, and I'm assuming somebody came up with a new that satisfies this. Everybody agree with that? I mean, you kind of have to, right? It's like simple stuff. Okay. But then I'm going to write this thing. This says that a transpose, here, this is a transpose new."}],"speech_gaps":[],"frame":"../frames/v007/023.webp","frame_time":3747.95},{"title":"线性规划的对偶性与对偶证书","segments":[{"id":210,"text":"plus C is bigger than or equal to zero. We agree with that, right? Now, X is also bigger than zero, right? And now I'm going to use an extremely deep fact. The inner product of two non-negative vectors is non-negative, okay? So we kind of, right? Again, it's just not hard, right? So I'll put, you know, I'll put this on the other side. So I'll write nu transpose A, and I'll multiply, let's see, plus C transpose X.","zh":"加上C大于等于零。我们同意这一点，对吧？现在，X也大于零，对吧？现在我要用一个极其深刻的事实。两个非负向量的内积是非负的，对吧？所以我们大概，对吧？这并不难，对吧？所以我把它放到另一边。所以我写下nu转置乘以A，然后乘以，让我们看看，加上C转置乘以X。","start":3902.07,"end":3930.85},{"id":211,"text":"That's bigger than or equal to zero, right? Everyone agrees with that. And I'm just using the fact that that's an inner product of two non-negative vectors. So you have this, okay? Expand this out. You get nu transpose AX plus C transpose X is bigger than zero. But wait a minute. This thing is equal to nu transpose B, right? So this is nu transpose B.","zh":"这大于等于零，对吧？大家都同意这一点。我只是用到了这是两个非负向量的内积的事实。所以你有这个，对吧？展开这个表达式。你得到nu转置乘以AX加上C转置乘以X大于零。但等等。这个表达式等于nu转置乘以B，对吧？所以这就是nu转置乘以B。","start":3931.7,"end":3960.11},{"id":212,"text":"And then I put this over here, and I have minus nu transpose b, and I get this. So here's what I just showed you. I said, take any x that's feasible for this linear program. And what I showed you is, I don't know what c transpose x is, but I'll tell you one thing about it. It cannot be smaller than minus nu transpose b. So everyone see that I just completely derived it from scratch with none of this Lagrangian and blah, blah, blah, and dual function. Everybody see it? So, okay.","zh":"然后我把这个放到这边，减去nu转置乘以b，我就得到了这个。所以刚才我展示给你们的是，我说，取任何满足这个线性规划可行性的x。而我展示给你们的是，我不知道c转置乘以x是多少，但我会告诉你们一件事。它不能小于负的nu转置乘以b。大家看到这一点了吗？我刚刚完全从头推导出来，没有使用拉格朗日乘数和那些杂七杂八的东西，以及对偶函数。大家看到这一点了吗？好的。","start":3961.16,"end":3991.59},{"id":213,"text":"So that's how that goes. Now this is already kind of interesting. As a matter of fact, later, here's what you're going to find. It's pretty awesome. When we do numerical solution of an LP, here's what's going to happen. When you solve that LP, you will get x back. Whether you like it or not, you're also going to get a new. And this is going to be true for all the convex problems you solve.","zh":"这就是这样的过程。现在这已经有点意思了。事实上，之后，你们会发现。这非常棒。当我们对一个线性规划问题进行数值求解时，会发生这样的事情。当你求解这个线性规划问题时，你会得到x。无论你是否喜欢，你也会得到一个新的东西。这将适用于你解决的所有凸问题。","start":3992.45,"end":4021.3},{"id":214,"text":"And which is amazing, right? Because you're going to get a new and the bound is going to be tight. So it's going to be say, so what's going to happen? So your model of a solver is going to look like this. Here's my problem. And they go, no problem. They say, here's X, right? You check as feasible and its objective value is like 3.7. Everybody following this? Okay. You will also be given what's called a dual certificate. A dual certificate is it'll give you dual variables.","zh":"这真是令人惊叹，对吧？因为你会得到一个新东西，而这个界限将是紧的。所以会发生什么呢？你的求解器模型会是这样的。这是我的问题。他们会说，没问题。他们会说，这是X，对吧？你检查它是否可行，它的目标值大概是3.7。大家跟得上吗？好的。你还会被提供一个叫做对偶证书的东西。对偶证书会给你对偶变量。","start":4022.88,"end":4048.51},{"id":215,"text":"Which, if you evaluate the dual objective, which is g, you would get a lower bound on the optimal value.","zh":"如果你计算对偶目标函数，也就是g，你会得到一个最优值的下界。","start":4049.12,"end":4055.42},{"id":216,"text":"Everybody following this?","zh":"大家都能跟上吗？","start":4056.12,"end":4056.96},{"id":217,"text":"When you evaluate it, it's actually equal to the value, the primal value you were given, right?","zh":"当你计算它时，实际上它等于你所给的原始问题的值，对吧？","start":4057.16,"end":4062.66},{"id":218,"text":"The objective value.","zh":"目标值。","start":4062.72,"end":4064.0},{"id":219,"text":"Everybody see this?","zh":"大家都能看到这一点吗？","start":4064.06,"end":4064.56},{"id":220,"text":"That's called a dual certificate.","zh":"这被称为对偶证书。","start":4064.7,"end":4066.1},{"id":221,"text":"So it means you don't even have to trust the solver.","zh":"这意味着你甚至不需要信任求解器。","start":4066.72,"end":4070.3},{"id":222,"text":"It basically, abstractly, I think it's beautiful, it actually returns two things.","zh":"它基本上，抽象地说，我认为这是很美的，它实际上返回了两个结果。","start":4071.8,"end":4076.18}],"notes":["本段讲解了线性规划中对偶性的一个重要推导过程，通过使用两个非负向量的内积非负这一性质，推导出一个关于可行解的下界。这一推导过程没有使用拉格朗日乘数法或对偶函数，而是从头开始推导，展示了对偶性的基本原理。","接下来，讲者提到在求解线性规划问题时，除了得到原始变量x外，还会得到一个称为对偶证书（dual certificate）的额外信息。对偶证书提供了对偶变量，这些变量可以用来计算对偶目标函数的值，从而得到原始问题最优值的下界。","对偶证书的一个重要特性是，当它被计算出来时，其对应的对偶目标函数值实际上等于原始问题的最优值。这意味着，即使不信任求解器，也可以通过对偶证书验证结果的正确性。","讲者强调，对偶证书的存在使得求解器不仅返回原始变量，还返回了对偶变量，从而提供了对原始问题的更全面的理解。这种双重返回的特性在凸优化问题中是普遍存在的。","此外，讲者提到，对偶证书的计算过程是基于对偶性原理的，即通过原始问题的可行解和对偶变量之间的关系，推导出对偶目标函数的值。这一过程展示了对偶性在优化问题中的核心作用。","最后，讲者指出，对偶证书的引入使得求解器的输出更加可靠，因为它不仅提供了原始问题的解，还提供了对偶问题的解，从而确保了结果的正确性。"],"formulas":[{"latex":"C^T X + \\nu^T A = \\nu^T B","symbols":"C^T X + ν^T A = ν^T B","explanation":"该等式在原始文本中被明确提及，表示通过展开表达式得出的等式，无需修改。","evidence":"That's bigger than or equal to zero, right? Everyone agrees with that. And I'm just using the fact that that's an inner product of two non-negative vectors. So you have this, okay? Expand this out. You get nu transpose AX plus C transpose X is bigger than zero. But wait a minute. This thing is equal to nu transpose B, right? So this is nu transpose B."},{"latex":"c^T x \\text{ 不能小于 } -\\nu^T b","symbols":"c^T x 不能小于 -ν^T b","explanation":"该不等式在原始文本中被明确提及，表示对偶性的一个重要结论，无需修改。","evidence":"And then I put this over here, and I have minus nu transpose b, and I get this. So here's what I just showed you. I said, take any x that's feasible for this linear program. And what I showed you is, I don't know what c transpose x is, but I'll tell you one thing about it. It cannot be smaller than minus nu transpose b. So everyone see that I just completely derived it from scratch with none of this Lagrangian and blah, blah, blah, and dual function. Everybody see it? So, okay."},{"latex":"g \\text{ 是最优值的下界}","symbols":"g 是最优值的下界","explanation":"该陈述在原始文本中被明确提及，表示对偶目标函数 g 的性质，无需修改。","evidence":"Which, if you evaluate the dual objective, which is g, you would get a lower bound on the optimal value."},{"latex":"g = \\text{primal value}","symbols":"g 等于原始值","explanation":"该等式在原始文本中被明确提及，表示对偶证书的一个关键特性，无需修改。","evidence":"When you evaluate it, it's actually equal to the value, the primal value you were given, right?"}],"uncertainties":["new"],"diagram":"none","start":3902.07,"end":4076.18,"asr_flags":[],"math_clarifications":["原始文本中未明确说明 C^T X 是非负的，仅提到 'plus C is bigger than or equal to zero'，但未明确 C^T X 的非负性。"],"boards":[],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":3902.07,"text":"plus C is bigger than or equal to zero. We agree with that, right? Now, X is also bigger than zero, right? And now I'm going to use an extremely deep fact. Interproduct of two non-negative vectors is non-negative, okay? So we kind of, right? Again, it's just not hard, right? So I'll put, you know, I'll put this on the other side. So I'll write nu transpose A, and I'll multiply, let's see, plus C transpose X."},{"start":3931.7,"text":"That's bigger than or equal to zero, right? Everyone agrees with that. And I'm just using the fact that that's an inner product of two non-negative vectors. So you have this, okay? Expand this out. You get nu transpose AX plus C transpose X is bigger than zero. But wait a minute. This thing is equal to nu transpose B, right? So this is nu transpose B."},{"start":3961.16,"text":"And then I put this over here, and I have minus nu transpose b, and I get this. So here's what I just showed you. I said, take any x that's feasible for this linear program. And what I showed you is, I don't know what c transpose x is, but I'll tell you one thing about it. It cannot be smaller than minus nu transpose b. So everyone see that I just completely derived it from scratch with none of this Lagrangian and blah, blah, blah, and dual function. Everybody see it? So, okay."},{"start":3992.45,"text":"So that's how that goes. Now this is already kind of interesting. As a matter of fact, later, here's what you're going to find. It's pretty awesome. When we do numerical solution of an LP, here's what's going to happen. When you solve that LP, you will get x back. Whether you like it or not, you're also going to get a new. And this is going to be true for all the convex problems you solve."},{"start":4022.88,"text":"And which is amazing, right? Because you're going to get a new and the bound is going to be tight. So it's going to be say, so what's going to happen? So your model of a solver is going to look like this. Here's my problem. And they go, no problem. They say, here's X, right? You check as feasible and its objective value is like 3.7. Everybody following this? Okay. You will also be given what's called a dual certificate. A dual certificate is it'll give you dual variables."},{"start":4049.12,"text":"Which, if you evaluate the dual objective, which is g, you would get a lower bound on the optimal value."},{"start":4056.12,"text":"Everybody following this?"},{"start":4057.16,"text":"When you evaluate it, it's actually equal to the value, the primal value you were given, right?"},{"start":4062.72,"text":"The objective value."},{"start":4064.06,"text":"Everybody see this?"},{"start":4064.7,"text":"That's called a dual certificate."},{"start":4066.72,"text":"So it means you don't even have to trust the solver."},{"start":4071.8,"text":"It basically, abstractly, I think it's beautiful, it actually returns two things."}],"speech_gaps":[],"frame":"../frames/v007/024.webp","frame_time":3914.07},{"title":"对偶证书与对偶函数","segments":[{"id":223,"text":"things. An optimal point and a very short self-contained proof that no one could do","zh":"事物。一个最优解和一个非常简短的、自洽的证明，没有人能做到更好。","start":4076.18,"end":4082.86},{"id":224,"text":"better. Everybody got it? That's what a dual certificate is. We'll talk much more about","zh":"每个人都明白了？这就是对偶证书。我们之后会更详细地讨论这个，但它非常、非常有趣，对吧？这大致上讲得通吗？好的。","start":4082.86,"end":4088.18},{"id":225,"text":"this later, but it's very, it's super interesting, right? Is this making sense, vaguely? Okay.","zh":"这里有一个例子。我们可以进行带质量约束的最小化。所以这里我只使用了一个一般的范数，对吧？因此，我要在满足 AX 等于 B 的条件下最小化一个范数。这是拉格朗日函数。","start":4088.18,"end":4095.9},{"id":226,"text":"Here's one. We can do a quality-constrained minimization. So here I just have a general","zh":"我将范数减去，并且我有 nu 的转置乘以 AX 减去 B，或者在这个例子中，我把它写成 B 减去 AX，然后得到这个式子，对吧？然后我们必须最小化这个式子。","start":4098.44,"end":4103.48},{"id":227,"text":"norm, right? So I'm going to minimize a norm subject to AX equals B. This is the Lagrangian.","zh":"顺便提一下，如果你看一下这个式子，你已经会看到一些明显的东西。B 转置 nu","start":4103.48,"end":4110.58},{"id":228,"text":"I take the norm minus, and then I have nu transpose times AX minus B, or in this case,","zh":"我取范数减去，然后我有 nu 的转置乘以 AX 减去 B，或者在这种情况下，","start":4110.68,"end":4117.14},{"id":229,"text":"I wrote it as B minus AX, and I get this thing, right? And then we have to minimize this.","zh":"我把它写成 B 减去 AX，然后我得到这个东西，对吧？然后我们必须最小化这个。","start":4117.16,"end":4122.3},{"id":230,"text":"Now, by the way, if you look at this, you'll already see something clear. B transpose nu","zh":"顺便说一句，如果你看一下这个，你已经会看到一些明显的东西。B 转置乘以 nu","start":4122.94,"end":4128.82},{"id":231,"text":"has nothing to do with x, so that comes out of the infimum here. But here, this is a norm","zh":"这与x无关，因此可以提取出这里的下确界。但在这里，这是一个范数","start":4128.82,"end":4133.8},{"id":232,"text":"minus a linear function. That's actually, that's the conjugate, actually, that's the","zh":"减去一个线性函数。实际上，这就是共轭函数。所以会发生什么，你也可以推导出这个结果，对吧？那","start":4134.26,"end":4139.54},{"id":233,"text":"conjugate function. So what happens, and you can also work out what that is, right? That","zh":"范数","start":4139.54,"end":4144.02},{"id":234,"text":"the norm","zh":"减去一个线性函数。当我最小化这个表达式时，我得到的要么是零，要么是负无穷，对吧？因此在这里你会得到这个结果。同样，我不再详细讲解。我会让你自己推导，但你会得到类似这样的结果。因此，对偶函数是这个线性函数B的转置乘以nu，前提是A的转置乘以nu在对偶范数中小于等于1，对吧？这就是你得到的结果。然后它说，你想要解决这个问题吗？","start":4144.02,"end":4144.72},{"id":235,"text":"minus a linear function. When I minimize that, I either get zero or I get minus infinity, right? And so here you would get this thing. And again, I'm not going over the details. I would let you do that, but you'd get something like that. So the dual function is this linear function B transpose nu provided A transpose nu in the dual norm is less than one, right? So that's what you get. Then it says this. You want to solve this problem?","zh":"然后这里有一个下界。它说，对于任何满足这个条件的nu，下界是B的转置乘以nu，对吧？在对偶范数中，对吧？让我们假设这是一个最小燃料轨迹生成问题，你想要将一颗卫星从当前位置移动到目标位置，并且希望使用最小的燃料。这可能类似于L1范数，对吧？这就是你的任务。你来推导这个，而有趣的是，它说，","start":4145.57,"end":4174.79},{"id":236,"text":"Then here's a lower bound. It says a lower bound is B transpose nu for any nu that satisfies this, right? In the dual norm, right? So let's suppose this is a minimum fuel trajectory generation problem, and you want to take a satellite from where it is to where it is supposed to be, and you want to use minimum fuel. This would probably be something like an L1 norm, okay? That's your job. You work this out, and what's cool is this says,","zh":"如果我取任何满足这个条件的向量，那么如果我计算B的转置乘以nu，这就是从当前位置移动到目标位置所需的最小燃料量的一个下界。大家明白了吗？这已经变得相当有趣了。而且应该有很强的迹象表明，很多内容都是极其有用的。所以，大家明白了吗？","start":4175.8,"end":4204.96},{"id":237,"text":"I can give, if I take any vector at all and it satisfies this, then if I evaluate B transpose nu, that's a lower bound on the minimum amount of fuel it's going to take you to get from where you are to where you're supposed to be. Everybody got this? This is already getting kind of interesting. And there should be at least very strong hints that a lot of this is unbelievably useful. So, everybody?","zh":"如果我随便取任何向量，只要它满足这个条件，那么如果我计算B的转置乘以nu，这将是对从当前位置到目标位置所需最少燃料量的一个下界。大家明白了吗？这已经有点意思了。而且应该至少有非常强烈的迹象表明，这其中的很多内容是极其有用的。大家明白吗？","start":4205.51,"end":4231.36}],"notes":["本段讲解了对偶证书的概念，即在优化问题中，通过构造一个对偶证书来证明某个点是最优解。同时，讲者提到对偶函数的构造，即通过将原问题转化为对偶问题，并利用对偶变量来构造下界。","讲者通过一个最小燃料轨迹生成问题作为例子，说明对偶函数如何提供一个下界。这个例子中，原问题可能涉及L1范数，而对偶函数则通过对偶变量来提供一个下界，从而帮助求解最优解。","讲者强调了对偶函数的构造过程，即通过将原问题的约束条件引入到对偶问题中，并利用对偶变量来构造目标函数。同时，讲者指出，当对偶变量满足一定条件时，对偶函数可以提供一个有效的下界。","讲者提到，当对偶变量满足一定条件时，对偶函数的值可以作为原问题的下界。这表明，对偶函数在优化问题中具有重要的作用，可以帮助我们找到最优解的下界。","讲者还提到，对偶函数的构造过程涉及对偶变量的选取和约束条件的满足。这表明，对偶函数的构造需要满足一定的数学条件，以确保其有效性。","最后，讲者指出，对偶函数的构造和应用在实际问题中具有重要的意义，特别是在需要找到最优解的下界时，对偶函数可以提供一个有效的工具。"],"formulas":[],"uncertainties":["可能对偶证书的具体构造过程存在理解上的模糊","对偶函数的构造中，某些数学细节可能未完全明确"],"diagram":"none","start":4076.18,"end":4231.36,"asr_flags":[],"math_clarifications":["原始片段中提到的拉格朗日函数、对偶函数和对偶范数条件缺乏明确的数学定义和符号规范，无法准确核对。"],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":4076.18,"text":"things. An optimal point and a very short self-contained proof that no one could do"},{"start":4082.86,"text":"better. Everybody got it? That's what a dual certificate is. We'll talk much more about"},{"start":4088.18,"text":"this later, but it's very, it's super interesting, right? Is this making sense, vaguely? Okay."},{"start":4098.44,"text":"Here's one. We can do a quality-constrained minimization. So here I just have a general"},{"start":4103.48,"text":"norm, right? So I'm going to minimize a norm subject to AX equals B. This is the Lagrangian."},{"start":4110.68,"text":"I take the norm minus, and then I have nu transpose times AX minus B, or in this case,"},{"start":4117.16,"text":"I wrote it as B minus AX, and I get this thing, right? And then we have to minimize this."},{"start":4122.94,"text":"Now, by the way, if you look at this, you'll already see something clear. B transpose nu"},{"start":4128.82,"text":"has nothing to do with x, so that comes out of the infimum here. But here, this is a norm"},{"start":4134.26,"text":"minus a linear function. That's actually, that's the conjugate, actually, that's the"},{"start":4139.54,"text":"conjugate function. So what happens, and you can also work out what that is, right? That"},{"start":4144.02,"text":"the norm"},{"start":4145.57,"text":"minus a linear function. When I minimize that, I either get zero or I get minus infinity, right? And so here you would get this thing. And again, I'm not going over the details. I would let you do that, but you'd get something like that. So the dual function is this linear function B transpose nu provided A transpose nu in the dual norm is less than one, right? So that's what you get. Then it says this. You want to solve this problem?"},{"start":4175.8,"text":"Then here's a lower bound. It says a lower bound is B transpose nu for any nu that satisfies this, right? In the dual norm, right? So let's suppose this is a minimum fuel trajectory generation problem, and you want to take a satellite from where it is to where it is supposed to be, and you want to use minimum fuel. This would probably be something like an L1 norm, okay? That's your job. You work this out, and what's cool is this says,"},{"start":4205.51,"text":"I can give, if I take any vector at all and it satisfies this, then if I evaluate B transpose nu, that's a lower bound on the minimum amount of fuel it's going to take you to get from where you are to where you're supposed to be. Everybody got this? This is already getting kind of interesting. And there should be at least very strong hints that a lot of this is unbelievably useful. So, everybody?"}],"speech_gaps":[{"start":4096.368,"end":4098.0}],"frame":"../frames/v007/025.webp","frame_time":4088.18},{"title":"二元划分问题与二次形式","segments":[{"id":238,"text":"So this is not obvious, right? These things are not obvious. I could give just a simple proof directly that this is a lower bound and so on. Now it's about to get even more interesting because we're going to look at a problem. Well, it'll come up again. So it's two-way partitioning. So this is the two-way partitioning problem. I have a set of n objects, and I want to partition them.","zh":"所以这并不明显，对吧？这些事情并不明显。我可以直接给出一个简单的证明，说明这是下界等等。现在情况将变得更加有趣，因为我们即将探讨一个问题。这个问题会再次出现。因此，这是二元划分问题。我有一组n个对象，我想将它们划分。","start":4232.16,"end":4263.08},{"id":239,"text":"into two groups, right? And the way I'll do that is I'll encode it with a vector x that has plus one. If xi equals plus one means, you know, item i is in the first group. xi equals minus one if you're in the second group. Everybody got it? So that's what this says. That says that each x is either plus or minus one.","zh":"分成两个组，对吧？我将通过一个向量x来编码，其中x的元素为+1。如果xi等于+1，意味着第i个元素在第一组；如果xi等于-1，则意味着在第二组。大家明白了吗？这就是所说的，每个x要么是+1，要么是-1。","start":4263.95,"end":4286.04},{"id":240,"text":"And then my objective is this thing. And to get a rough idea, we should actually say what X transpose WX is. Because it's an interesting problem, and maybe you've seen it in some other class or something like that. But it's worth saying what it is. Is it X transpose WX? Yeah. Okay, so it's X transpose WX, but that's equal to this. It's the sum over I and J of WIJ.","zh":"然后我的目标函数是这个。为了有一个大致的了解，我们应该明确说明X^T W X是什么。因为这是一个有趣的问题，也许你们在其他课程中见过类似的问题。但值得说明的是，它是什么。是X^T W X吗？是的。好的，所以它是X^T W X，但等于这个。它是对所有i和j的WIJ求和。","start":4287.04,"end":4315.82},{"id":241,"text":"xi, xj. I mean, so we all agree with that. That's a quadratic form. Now, xi and xj are each plus or minus one. So this product is plus one if items i and j are in the same group, and it's minus one if they're in different groups, right? And so this is equal to the sum of the w's when they're in the same group minus the sum of w's when they're in different groups.","zh":"xi乘以xj。我的意思是，我们都同意这一点。这是一个二次型。现在，xi和xj每个都是+1或-1。因此，这个乘积在i和j处于同一组时为+1，在处于不同组时为-1，对吧？因此，这等于同一组中的w之和减去不同组中的w之和。","start":4316.86,"end":4343.36},{"id":242,"text":"Right? That's what this says. And so you should interpret, what are we doing? Are we maximizing or minimizing? We are minimizing. So if we're minimizing this, it basically says w i is the cost of having, let's say you're doing, we're going to split a group of people into two groups, right? So this says if w i j is the cost of having person i and person j in the same team, if we're making two teams. Everybody?","zh":"对吧？这就是所说的。因此，我们应该理解，我们是在最大化还是最小化？我们是在最小化。所以如果我们最小化这个，它基本上意味着wi是将某人i和某人j放在同一组的成本。比如说，我们将一群人分成两组，对吧？因此，这表示如果wij是将人i和人j放在同一队的成本，当我们分成两队时。大家明白了吗？","start":4344.01,"end":4369.55},{"id":243,"text":"Got this? So if W, I, J is positive, it means they don't like each other. If it's negative, that's totally cool. It means there's a strong affinity and we would like them to be in the same group. Everybody got it? And the same is true for, basically, you have an equal and opposite charge. So if you say, if W, I, J is plus 3, it means you will pay 3 if you assign I and J to the same group. And you will have a revenue or income of 3.","zh":"明白了吗？所以如果W, I, J是正的，这意味着他们彼此不喜欢。如果是负的，那就完全没问题。这意味着他们之间有很强的亲和力，我们希望他们被分到同一个组。大家明白了吗？同样的道理也适用于，基本上，你有一个相等且相反的电荷。所以如果你说，如果W, I, J是加3，这意味着如果你把I和J分到同一个组，你将支付3。而你将获得3的收入或收益。","start":4370.14,"end":4399.42}],"notes":["本段讲解了二元划分问题，即如何将一组对象分成两个子集。通过引入一个向量x，其中每个元素为+1或-1，表示对象属于哪个子集。这为后续的优化问题奠定了基础。","讲者提到目标函数X^T W X，这是一个二次形式，用于衡量对象在相同或不同子集时的代价。具体来说，当两个对象在同一个子集时，其乘积为+1，否则为-1，从而影响总代价。","讲者进一步解释了目标函数的含义：如果W_ij为正，表示两个对象之间有冲突，需要付出代价；如果为负，则表示有亲和力，希望它们在同一个子集。这种解释帮助理解如何通过优化来划分对象。","讲者强调了问题的最小化目标，即通过最小化总代价来实现最优划分。这与实际应用中的场景（如团队划分）相呼应，展示了理论与实际的联系。","讲者通过具体的数值例子（如W_ij为+3）来说明代价和收益的计算方式，帮助听众更直观地理解目标函数的结构。","本段内容为后续的凸优化问题提供了背景，特别是如何将实际问题转化为数学形式，并通过优化方法求解。"],"formulas":[{"latex":"X^T W X","symbols":"X^T W X 表示目标函数，其中X是划分向量，W是权重矩阵。","explanation":"公式正确，表示目标函数，X是划分向量，W是权重矩阵。","evidence":"And then my objective is this thing. And to get a rough idea, we should actually say what X transpose WX is. Because it's an interesting problem, and maybe you've seen it in some other class or something like that. But it's worth saying what it is. Is it X transpose WX? Yeah. Okay, so it's X transpose WX, but that's equal to this. It's the sum over I and J of WIJ."}],"uncertainties":[],"diagram":"none","start":4232.16,"end":4399.42,"asr_flags":[],"math_clarifications":["公式正确，无需修改。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原 is says if w i j is the cost of having person i and person j in the same team, if we're making two teams. Everybody?"},{"start":4370.14,"text":"Got this? So if W, I, J is positive, it means they don't like each other. If it's negative, that's totally cool. It means there's a strong affinity and we would like them to be in the same group. Everybody got it? And the same is true for, basically, you have an equal and opposite charge. So if you say, if W, I, J is plus 3, it means you will pay 3 if you assign I and J to the same group. And you will have a revenue or income of 3."}],"speech_gaps":[],"frame":"../frames/v007/026.webp","frame_time":4244.16},{"title":"对偶函数的性质与二次形式最小化","segments":[{"id":244,"text":"Because it'll become minus 3. And if it's minus 3, it's the other way around. So the w's specify how much it irritates us to have items in the same group or different groups. So this is the problem. So let's look at the dual function. Oh, it's obviously non-convex for two reasons. w need not be positive semi-definite. We didn't say that it was.","zh":"因为它会变成负3。如果它是负3，情况就会反过来。所以w值表示我们对同一组或不同组中包含物品的不满程度。这就是这个问题。那么让我们看一下对偶函数。哦，显然它是非凸的，有两个原因。w不一定需要是半正定的。我们并没有说它是。","start":4400.23,"end":4428.38},{"id":245,"text":"Reason two is we got a big old fail right there, right? Because we have squares equal to one, right? By the way, if I take xi squared less than or equal to one, that's convex if w is positive semi-definite, right? So, but okay. So we take this, the dual function is we take the objective, right? Plus, and then I just simply add up new i times these xi squared minus one. And what I end up with is a quadratic.","zh":"第二个原因是我们在那里犯了一个大错误，对吧？因为我们有平方等于1，对吧？顺便说一句，如果我取xi平方小于等于1，当w是半正定时，这是凸的，对吧？所以，好吧。那么我们来处理这个，对偶函数是取目标函数，对吧？加上，然后我简单地将新的i乘以这些xi平方减1相加。最后得到的是一个二次函数。","start":4430.65,"end":4459.14},{"id":246,"text":"function of a quadratic form in x plus a constant. And now we're going to have our quadratic form minimization. Earlier today we had our how do you minimize an affine function conversation. Now we're going to have a quadratic form minimization conversation. So if you minimize a quadratic form, what do you get?","zh":"这是一个关于x的二次型函数加上一个常数。现在我们将进行二次型最小化。今天早些时候我们讨论了如何最小化一个仿射函数。现在我们将讨论二次型最小化。如果你最小化一个二次型，你会得到什么？","start":4459.92,"end":4479.99},{"id":247,"text":"Someone walks up in the street and says, here's my X transpose, you know, whatever, not W, but X transpose, you know, AX. A is symmetric. What's the minimum of that? Well, if that matrix has a negative, it's got real eigenvalue, it's symmetric, right? If that matrix has a negative eigenvalue, that minimum is for sure minus infinity. Because you sail out along that, find a negative eigenvalue. For that matter, just find a point where the quadratic form is negative, right?","zh":"有人走在街上，说：‘这里是我的X转置，不管怎样，不是W，而是X转置，也就是AX。A是对称的。那这个的最小值是多少？’好吧，如果这个矩阵有一个负值，它有实特征值，它是对称的，对吧？如果这个矩阵有一个负特征值，那么这个最小值肯定是负无穷大。因为你沿着那个方向航行，找到一个负特征值。事实上，只需找到一个二次型为负的点，对吧？","start":4483.28,"end":4515.9},{"id":248,"text":"If you just go out farther and farther, it'll get more and more negative. In fact, quadratically so. So then the minimum is minus infinity. Everybody got it? But if that matrix is positive semi-definite, and I ask what's the minimum, the answer's real simple. It's zero. Because you could take zero as your x equals zero, but because it's positive semi-definite, it can't be anything less than that, so that's it, right? Everybody follow that? So g is this function. It's minus one transpose nu.","zh":"如果你继续远离原点，它会变得越来越负。实际上，是二次地变得更负。因此，最小值是负无穷大。大家明白了吗？但如果这个矩阵是半正定的，我问最小值是多少，答案很简单。是零。因为你可以用x等于零，但因为它是半正定的，它不能比零更小，就是这样，对吧？大家明白了吗？所以g是这个函数。它是负一转置nu。","start":4517.34,"end":4546.23},{"id":249,"text":"provided w plus diag of nu is bigger than or equal to zero. That's in a symmetric matrix sense, right? Okay. And the lower bound property says, you see this problem here? You know what? Here's a bound on its objective. That's a lower bound on its objective. It's minus one transpose nu, for any nu you can find that satisfies this. Okay? So that's what that says, right?","zh":"给定 w 加上 nu 的对角线矩阵大于等于零。这是在对称矩阵的意义下，对吧？好的。下界性质说明，你看到这个问题了吗？你知道吗？这里是对目标函数的一个下界。这是目标函数的一个下界。对于任何满足这个条件的 nu，都是减去一转置 nu。明白吗？这就是它的含义，对吧？","start":4546.98,"end":4576.7}],"notes":["本段讨论了对偶函数的非凸性，指出其非凸性的两个原因：一是w不一定是半正定矩阵，二是约束条件中存在平方等于1的项。当w是半正定时，xi平方小于等于1是凸的，但整体问题仍可能非凸。","接着，讲者解释了对偶函数的结构，指出其为一个二次形式加上常数项，并强调了二次形式最小化的问题。这与之前讨论的仿射函数最小化形成对比。","在讨论二次形式最小化时，讲者通过一个例子说明，如果矩阵有负特征值，则二次形式的最小值为负无穷；如果矩阵是半正定的，则最小值为零。这是基于矩阵的特征值性质。","最后，讲者提到对偶函数g的形式为负的1转置乘以nu，并指出该函数在满足w加上diag(nu)大于等于零的条件下成立。这说明了对偶函数的约束条件。","讲者还强调了下界性质，即对于原问题的最优值，对偶函数提供了下界。这一性质是凸优化中的重要概念，有助于理解对偶问题与原问题之间的关系。","整个段落围绕对偶函数的性质展开，包括其非凸性、结构、最小化问题以及下界性质，这些都是凸优化中的核心内容。"],"formulas":[{"latex":"x^T A x","symbols":"二次形式","explanation":"该公式表示一个向量x与对称矩阵A的二次形式，符合数学定义。","evidence":"Someone walks up in the street and says, here's my X transpose, you know, whatever, not W, but X transpose, you know, AX. A is symmetric. What's the minimum of that? Well, if that matrix has a negative, it's got real eigenvalue, it's symmetric, right? If that matrix has a negative eigenvalue, that minimum is for sure minus infinity. Because you sail out along that, find a negative eigenvalue. For that matter, just find a point where the quadratic form is negative, right?"},{"latex":"g(x) = -1^T \\nu","symbols":"对偶函数","explanation":"该公式表示对偶函数g(x)，其中1^T表示行向量，ν为满足条件的向量。","evidence":"provided w plus diag of nu is bigger than or equal to zero. That's in a symmetric matrix sense, right? Okay. And the lower bound property says, you see this problem here? You know what? Here's a bound on its objective. That's a lower bound on its objective. It's minus one transpose nu, for any nu you can find that satisfies this. Okay? So that's what that says, right?"}],"uncertainties":[],"diagram":"none","start":4400.23,"end":4576.7,"asr_flags":[],"math_clarifications":["公式1的最小值未在原始文本中明确说明，且未提供足够的数学条件或推导过程，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6 ur x equals zero, but because it's positive semi-definite, it can't be anything less than that, so that's it, right? Everybody follow that? So g is this function. It's minus one transpose nu."},{"start":4546.98,"text":"provided w plus diag of nu is bigger than or equal to zero. That's in a symmetric matrix sense, right? Okay. And the lower bound property says, you see this problem here? You know what? Here's a bound on its objective. That's a lower bound on its objective. It's minus one transpose nu, for any nu you can find that satisfies this. Okay? So that's what that says, right?"}],"speech_gaps":[],"frame":"../frames/v007/027.webp","frame_time":4412.23},{"title":"凸优化中的松弛与谱划分","segments":[{"id":250,"text":"Um, and it turns out you can get all sorts of famous bounds out of this by just plugging numbers in. Um, so, but that's, that's the idea. And this is related to, um, spectral partitioning. Um, how many people have seen that? Oh, one hand, just a hand. Ooh, I'm sorry. Everybody needs to know about spectral partitioning, right? You're not going to be able to do any kind of like any serious street fighting applied math if you don't know about that.","zh":"嗯，事实上，只需代入一些数值，你就能从这里得到各种著名的界限。嗯，但这就是这个想法。这与谱划分有关。嗯，有多少人见过这个？哦，一只手，只有一只手。哦，对不起。每个人都需要了解谱划分，对吧？如果你不知道这一点，就无法进行任何严肃的街头战斗式的应用数学。","start":4577.3,"end":4603.13},{"id":251,"text":"Right? Because partitioning problems come up all the time, and you need to know about it. I'll just show you quickly what it is here, just for fun. I won't go into the details, but it's actually, weirdly, another... Let me just explain it very quickly. So, you... And I won't go into the... I'll give a very simple version of it. Right? So...","zh":"对吧？因为划分问题经常出现，你需要了解它。我在这里快速展示一下它是什么，只是为了好玩。我不会深入细节，但事实上，这其实是另一种……让我快速解释一下。所以，你……我不会深入……我会给出一个非常简单的版本。对吧？所以……","start":4603.57,"end":4628.35},{"id":252,"text":"You have this thing, and then subject, then we have, we're going to minimize this thing, subject to xi squared equals one. That's not convex, right? But if this is true, if xi squared is one, then everyone here would have to, I would hope, agree that that's the case, right? Now, by the way, this is a relaxation, right? Because if the former constraint holds, then this one has to.","zh":"你有这个东西，然后受约束，然后我们要最小化这个东西，受约束于xi平方等于一。这不凸，对吧？但如果这个约束成立，那么这里每个人都应该同意这一点，对吧？顺便说一句，这是一个松弛，对吧？因为如果前面的约束成立，那么这个约束就必须成立。","start":4628.89,"end":4657.36},{"id":253,"text":"Okay, W is symmetric. Anybody take a look at that? You know how to solve that problem? First of all, is it convex? Is that convex? No. Because of this, right? If that was less than or equal to, it would be convex, right? But this is not convex, okay? This is one of the, like, there's about seven problems we can solve that are not convex. This is one of them. It's just an eigenvalue problem, right? What's the solution of this? In terms of the eigenvectors.","zh":"好的，W是对称的。有人注意到了吗？你知道如何解决这个问题吗？首先，这个问题是凸的吗？是凸的吗？不，因为这个原因，对吧？如果这个是小于等于，那就会是凸的，对吧？但这个不是凸的，对吧？这是其中一种，大约有七个非凸问题是我们可以解决的，这是其中之一。它只是一个特征值问题，对吧？这个的解是什么？从特征向量的角度来看。","start":4658.04,"end":4695.64},{"id":254,"text":"What's that? Yeah, we know how to do this. You find the smallest eigenvalue of w, you find its associated eigenvector, and you scale it by n. And that's literally the solution. That's not a heuristic or anything like that. Oh, by the way, when you do that, what have I done here? When you do that, you get something really interesting.","zh":"什么？是的，我们知道如何做这个。你找到W的最小特征值，找到其对应的特征向量，然后将其乘以n。这实际上是解，而不是一种启发式方法或类似的东西。哦，顺便问一句，当你这样做时，你在这里做了什么？当你这样做时，你会得到一些非常有趣的东西。","start":4698.17,"end":4723.54},{"id":255,"text":"First of all, you get a number because this is a relaxation. That's a lower bound on the original problem. But then you also get this. I get an x's which are all, you know, they're all, they're not, they satisfy this, but they're definitely not all plus minus one. Somebody want to make a suggestion to make a heuristic assignment at that point? You have a vector. They're all floats. Some of the squares is n.","zh":"首先，你得到一个数值，因为这是个松弛问题。这是原始问题的一个下界。但你也会得到这个。我得到的x值都是浮点数，它们并不满足全为加减一的情况。有人想在这个时候提出一个启发式的赋值建议吗？你有一个向量，它们都是浮点数。其中一些平方和是n。","start":4724.86,"end":4749.04}],"notes":["本段主要讲解了凸优化中的松弛方法，通过将非凸问题转化为凸问题来求解。讲者提到，当约束条件为xi平方等于1时，该问题不是凸的，但可以通过松弛方法将其转化为一个凸问题。松弛方法可以得到原问题的下界，但解可能不是精确的。","讲者进一步说明了松弛方法的原理，即通过放宽约束条件，将非凸问题转化为凸问题，从而更容易求解。例如，当约束条件为xi平方等于1时，可以将其松弛为xi平方小于等于1，从而得到一个凸问题。","讲者提到，松弛方法得到的解可能不是精确的，但可以作为启发式方法使用。例如，当求解一个非凸问题时，可以通过松弛方法得到一个近似解，然后通过某种方式将其转换为一个可行解。","讲者还提到，松弛方法可以用于谱划分问题，即通过将问题转化为一个特征值问题来求解。例如，当求解一个非凸问题时，可以通过找到最小特征值及其对应的特征向量来得到一个近似解。","讲者指出，松弛方法得到的解可能不是精确的，但可以作为启发式方法使用。例如，当求解一个非凸问题时，可以通过松弛方法得到一个近似解，然后通过某种方式将其转换为一个可行解。","讲者最后提到，松弛方法可以用于谱划分问题，即通过将问题转化为一个特征值问题来求解。例如，当求解一个非凸问题时，可以通过找到最小特征值及其对应的特征向量来得到一个近似解。"],"formulas":[],"uncertainties":["xi squared equals one"],"diagram":"none","start":4577.3,"end":4749.04,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的上下文支持这些公式作为数学表达式，因此无法核定其数学类型、记号、条件、等号、期望、系数、符号等。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4577.3,"text":"Um, and it turns out you can get all sorts of famous bounds out of this by just plugging numbers in. Um, so, but that's, that's the idea. And this is related to, um, spectral partitioning. Um, how many people have seen that? Oh, one hand, just a hand. Ooh, I'm sorry. Everybody needs to know about spectral partitioning, right? You're not going to be able to do any kind of like any serious street fighting applied math if you don't know about that."},{"start":4603.57,"text":"Right? Because partitioning problems come up all the time, and you need to know about it. I'll just show you quickly what it is here, just for fun. I won't go into the details, but it's actually, weirdly, another... Let me just explain it very quickly. So, you... And I won't go into the... I'll give a very simple version of it. Right? So..."},{"start":4628.89,"text":"You have this thing, and then subject, then we have, we're going to minimize this thing, subject to xi squared equals one. That's not convex, right? But if this is true, if xi squared is one, then everyone here would have to, I would hope, agree that that's the case, right? Now, by the way, this is a relaxation, right? Because if the former constraint holds, then this one has to."},{"start":4658.04,"text":"Okay, W is symmetric. Anybody take a look at that? You know how to solve that problem? First of all, is it convex? Is that convex? No. Because of this, right? If that was less than or equal to, it would be convex, right? But this is not convex, okay? This is one of the, like, there's about seven problems we can solve that are not convex. This is one of them. It's just an eigenvalue problem, right? What's the solution of this? In terms of the eigenvectors."},{"start":4698.17,"text":"What's that? Yeah, we know how to do this. You find the smallest eigenvalue of w, you find its associated eigenvector, and you scale it by n. And that's literally the solution. That's not a heuristic or anything like that. Oh, by the way, when you do that, what have I done here? When you do that, you get something really interesting."},{"start":4724.86,"text":"First of all, you get a number because this is a relaxation. That's a lower bound on the original problem. But then you also get this. I get an x's which are all, you know, they're all, they're not, they satisfy this, but they're definitely not all plus minus one. Somebody want to make a suggestion to make a heuristic assignment at that point? You have a vector. They're all floats. Some of the squares is n."}],"speech_gaps":[],"frame":"../frames/v007/028.webp","frame_time":4589.3},{"title":"谱分割与矩阵对称性","segments":[{"id":256,"text":"But the original problem, you wanted all the x high-speed plus or minus one. Someone please make a suggestion. Round them. Done. Take the sign. Done. Congratulations. That is spectral partitioning. Except for one thing I didn't tell you about, which is we can adjust the diagonal of w in a way that will make that slightly better. That's spectral partitioning. This works for gigantic problems. It works super well. So there you go. Yeah.","zh":"但是原来的问题，你想要所有x的值是加减一。有人能提出建议吗？四舍五入。完成。取符号。完成。恭喜。这就是谱分割。除了一个地方我没有告诉你们，那就是我们可以以一种方式调整w的对角线，使得结果稍好一些。这就是谱分割。这种方法适用于巨大的问题。它效果非常好。就是这样。是的。","start":4750.59,"end":4780.13},{"id":257,"text":"Does it have to be symmetric or positive semidefinite? Oh, no, no, no. In this problem? Well, okay, non-symmetric doesn't even make sense, although you just, because you just replace w with its quadratic part. I mean, sorry, its symmetric part, right? If I have a quadratic form, and I replace, the matrix is non-symmetric, I just replace that matrix with that matrix plus its transpose divided by 2. Number one. Then, does it have to be positive semidefinite? Absolutely not. We know, we know this problem we can solve completely.","zh":"它必须是对称的或者半正定的吗？哦，不，不，不。在这个问题中？好吧，其实不对称是没有意义的，尽管你刚刚，因为你可以用它的二次部分来代替w。我的意思是，抱歉，应该是它的对称部分，对吧？如果我有一个二次型，而矩阵是非对称的，我只需要将该矩阵替换为该矩阵加上其转置除以2。第一点。那么，它必须是半正定的吗？绝对不是。我们知道，我们完全能够解决这个问题。","start":4781.89,"end":4810.01},{"id":258,"text":"As long as w is symmetric, this can have negative eigenvalues, positive eigenvalues, couldn't care less. The solution to this is x is a scaled version of the minimizing eigenvector. Right? Is that okay? I think we'll quit here. It's already getting kind of interesting. And we'll keep going on Thursday.","zh":"只要w是对称的，这个情况可以有负的特征值，也可以有正的特征值，我完全不在乎。这个问题的解是x是使最小特征向量的缩放版本。对吧？这样可以吗？我想我们到这里就结束了。它已经变得有点有趣了。我们将在星期四继续。","start":4811.02,"end":4831.98}],"notes":["本段讲解了谱分割方法的基本思想，即通过将问题转化为特征向量问题来求解。讲者提到，原始问题中要求所有x的值为±1，可以通过取符号的方式实现。此外，讲者指出可以通过调整矩阵w的对角线来优化结果，这使得谱分割方法适用于大规模问题。","讲者进一步讨论了矩阵w是否需要对称或半正定的问题。他指出，虽然问题本身可能涉及非对称矩阵，但可以通过将矩阵替换为其对称部分（即矩阵加上其转置除以2）来处理。此外，讲者强调，w不需要是半正定的，因为该问题可以完全求解。","最后，讲者提到只要w是对称的，其特征值可以是正的或负的，这并不影响结果。解是x作为最小化特征向量的缩放版本。讲者表示，课程内容已经足够有趣，并将在下周继续深入讲解。"],"formulas":[],"uncertainties":["high-speed"],"diagram":"none","start":4750.59,"end":4831.98,"asr_flags":[],"math_clarifications":["原文中提到的谱分割问题涉及特征向量和特征值，但未提供具体的数学公式或表达式。因此，无法确定该公式是否准确或需要修正。"],"boards":[],"translation_complete":true,"translated_segments":3,"raw_segments":[{"start":4750.59,"text":"But the original problem, you wanted all the x-high speed plus or minus one. Someone please make a suggestion. Round them. Done. Take the sign. Done. Congratulations. That is spectral partitioning. Except for one thing I didn't tell you about, which is we can adjust the diagonal of w in a way that will make that slightly better. That's spectral partitioning. This works for gigantic problems. It works super well. So there you go. Yeah."},{"start":4781.89,"text":"Does it have to be symmetric or positive semidefinite? Oh, no, no, no. In this problem? Well, okay, non-symmetric doesn't even make sense, although you just, because you just replace w with its quadratic part. I mean, sorry, its symmetric part, right? If I have a quadratic form, and I replace, the matrix is non-symmetric, I just replace that matrix with that matrix plus its transpose divided by 2. Number one. Then, does it have to be positive semidefinite? Absolutely not. We know, we know this problem we can solve completely."},{"start":4811.02,"text":"As long as w is symmetric, this can have negative eigenvalues, positive eigenvalues, couldn't care less. The solution to this is x is a scaled version of the minimizing eigenvector. Right? Is that okay? I think we'll quit here. It's already getting kind of interesting. And we'll keep going on Thursday."}],"speech_gaps":[],"frame":"../frames/v007/029.webp","frame_time":4762.59}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v007.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>${point.visual_source?.verified?'原PPT提取与重绘':'讲解梳理 · 原PPT待核对'} · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p>${point.visual_source?.verified?`<section class="ppt-source"><h3>原PPT对照 · ${esc(point.visual_source.slide_number)}</h3><a href="${esc(point.visual_source.slide_image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.visual_source.slide_image)}" style="width:100%;border:1px solid #ccd9dd;border-radius:8px" alt="原PPT第${esc(point.visual_source.slide_number)}页"></a><p class="muted">已对照本讲视频 ${stamp(point.visual_source.video_time)} 的画面。<a href="${esc(point.visual_source.source_url)}" target="_blank" rel="noopener">原始讲义 PDF</a> · PDF 第 ${point.visual_source.pdf_page} 页</p><p><b>从原页提取：</b>${point.visual_source.items.map(esc).join('；')}</p></section>`:''}<div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(f=>'<p class="muted">'+esc(f.origin||'讲者讲述与既有整理')+'</p>'+formula(f)).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length,verified=data.pages.flatMap(p=>p.boards||[]).filter(b=>b.visual_source?.verified).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页含讲解画板 · '+verified+' 个已核对原PPT</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();

boardMap();</script></html>
