everybody got this so it's all pretty straightforward but it's kind of it it's interesting to look at so here we go um let's do the regularized least square i mean this is uh","zh":"对于这些目标，然后这就是总价格。有趣的是，你可以改变这些价格，从而得到不同的选择。事实上，这就是让你沿着权衡曲线移动的方法，如果有两个目标的话；如果有更多目标的话，就称之为权衡曲面。大家应该都明白这一点，所以这其实相当直接。不过，它有点意思，所以让我们继续。嗯，让我们来做正则化的最小二乘法，我意思是，这……","start":1838.03,"end":1865.49}],"notes":["本段讲授了多目标优化问题中标量化方法的直观解释，将λ视为不同目标的权重或价格。通过将多个目标函数加权求和，可以将多目标问题转化为单目标问题，从而更容易求解。","讲者提到，这种标量化方法在机器学习中非常常见，例如正则化方法中将损失函数与正则项相加，其中λ作为正则化系数，控制不同目标之间的权衡。","讲者进一步说明，λ可以被理解为不同目标的“价格”，即在优化过程中需要付出的代价。例如，如果一个目标的权重较大，那么在优化过程中需要付出更多的代价来满足该目标。","讲者还提到，通过调整λ的值，可以沿着权衡曲线（trade-off curve）移动，从而找到不同的最优解。当有多个目标时，这种权衡关系会形成一个权衡曲面（trade-off surface）。","讲者指出，虽然这种标量化方法在实际中被广泛使用，但其背后的数学原理和经济学意义（如价格机制）需要更深入的理解。","最后，讲者提到将要讲解正则化最小二乘法（regularized least square），并指出这是多目标优化的一个典型应用。"],"formulas":[{"latex":"F_1 + \\lambda \\times F_2","symbols":"lambda 表示不同目标的权重或价格","explanation":"公式正确表达了多目标优化中通过引入权重λ来对不同目标进行加权求和，λ可视为各目标的相对价格或权重。","evidence":"But all they do is they just immediately do without even saying anything. They just say, how do we solve it? And you go, we'll just throw in some weights, right? Like you're doing regularization in machine learning. So you throw in loss plus lambda. Why is this dinging at me? that objective. That's how much you will pay. If that's 12 and that's like, you know, whatever, 10, then this is going to cost you 120 bucks. So the lambdas are literally prices here, right? And this would be like, for example, if we had two production, you say, well, I know how to do, or, you know, if I'm designing a circuit and I say I want both the area to be small, the dynamic power to be small, you know, these kinds of, these types of things, we would just set prices."}],"uncertainties":["what's interesting there is you can change the prices and you'll get a different choice in fact this is what will allow you to actually move along the trade-off curve if there's two if there's more people call it the trade-off surface everybody got this so it's all pretty straightforward but it's kind of it it's interesting to look at so here we go um let's do the regularized least square i mean this is uh"],"diagram":"none","start":1689.41,"end":1865.49,"asr_flags":[],"math_clarifications":["公式F_1 + \\lambda \\times F_2是多目标优化中常见的标量化方法，其中λ表示不同目标的权重或价格。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1689.41,"text":"And in this case, you would find this point. And sure enough, it is indeed an optimal point, right? And also, a lot of other ideas come up here that you would see. You could see that right here, this is tangent to this thing. And that roughly means it's got a slope that's like, you know, minus one over lambda or something. But it basically tells you locally the trade-off between the two variables. Between, sorry, the two objectives."},{"start":1716.3,"text":"Right? So there's going to be... It's like an exchange rate. We'll get to that. And in fact, it is correct to think of the lambda here as a vector of prices. We'll get to that. Okay. So in some ways, this is making something very intuitive, kind of fancy. But that's okay. This doesn't bother me, right? Like, I mean, a gazillion people see multi-criterion optimization all the time."},{"start":1743.96,"text":"But all they do is they just immediately do without even saying anything. They just say, how do we solve it? And you go, we'll just throw in some weights, right? Like you're doing regularization in machine learning. So you throw in loss plus lambda. Why is this dinging at me?"},{"start":1763.58,"text":"There we go. You throw in loss plus lambda times your regularizer. Everybody, you've seen this and you've seen this in lots of it. And people, they don't even say anything about it, but it's because it's obvious and it's fine. But this is kind of, this is what you were doing. Okay. Now for multi-criterion problems, we can be a lot more specific about what..."},{"start":1783.57,"text":"what this particular scalarization does. So what it does is, it's actually kind of cool. It basically says, here are these things that you want small. F capital F1 all the way to capital FQ. You want them all small. Then these are positive numbers. And we can actually literally interpret the lambdas as literally the price of"},{"start":1809.4,"text":"that objective. That's how much you will pay. If that's 12 and that's like, you know, whatever, 10, then this is going to cost you 120 bucks. So the lambdas are literally prices here, right? And this would be like, for example, if we had two production, you say, well, I know how to do, or, you know, if I'm designing a circuit and I say I want both the area to be small, the dynamic power to be small, you know, these kinds of, these types of things, we would just set prices."},{"start":1838.03,"text":"for those objectives and then this is the total price what's interesting there is you can change the prices and you'll get a different choice in fact this is what will allow you to actually move along the trade-off curve if there's two if there's more people call it the trade-off surface everybody got this so it's all pretty straightforward but it's kind of it it's interesting to look at so here we go um let's do the regularized least square i mean this is uh"}],"speech_gaps":[],"frame":"../frames/v007/011.webp","frame_time":1701.41},{"title":"正则化最小二乘法与多目标优化","segments":[{"id":77,"text":"Here we go. Regularized least squares is, I want this thing interpreted as a fitting error to small, and then I want also the x, which in this case we'd interpret as the parameters in a regression model. I want those to be small. We'll talk much more about that later. So how do I do that?","zh":"我们开始吧。正则化最小二乘法，我想让这个东西被解释为一个拟合误差，要小，然后我还想让x，在这种情况下，我们将其解释为回归模型中的参数，这些参数也要小。我们之后会更详细地讨论这一点。那么我该如何做到这一点呢？","start":1866.18,"end":1885.24},{"id":78,"text":"I will take something that's a positive two vector. By the way, if I multiply that vector, I can scale it by any positive number, and I'm going to get, when I solve this problem, I'm going to get this. It's just a multiple of this. So I can, without loss generality, make the first one one. By the way, people often call, they often interpret the first objective, they call that their primary objective. And then, in this case, you'd say, well, our training loss is the...","zh":"我会取一个正的两个向量。顺便说一句，如果我乘以这个向量，我可以将其乘以任何正数，当我解决这个问题时，我会得到这个结果，它只是这个向量的一个倍数。因此，我可以不丢失一般性地将第一个设为1。顺便说一句，人们通常称，他们通常将第一个目标解释为他们的主要目标。在这种情况下，你会说，我们的训练损失是主要目标，而次要目标是参数不应该太大，对吧？这给了你一个概念，gamma实际上是一个转换，它是一个汇率，告诉你相对于大的残差，大的x会有多令人烦恼。这就是它告诉你的。","start":1887.73,"end":1914.77},{"id":79,"text":"By the way, people often call, they often interpret the first objective, they call that their primary objective. And then, in this case, you'd say, well, our training loss is the primary objective and your secondary objective is that the parameter shouldn't be big, right? And so that gives you, and so basically gamma is a translation, it's an exchange rate that tells you how much large x irritates you compared to large residual. That's what it tells you.","zh":"顺便说一句，人们通常称，他们通常将第一个目标解释为他们的主要目标。在这种情况下，你会说，我们的训练损失是主要目标，而次要目标是参数不应该太大，对吧？这给了你一个概念，gamma实际上是一个转换，它是一个汇率，告诉你相对于大的残差，大的x会有多令人烦恼。这就是它告诉你的。","start":1915.16,"end":1939.81},{"id":80,"text":"If it's 15, it means, I don't know, it means something, right? A lot. It depends on the units of these things, right? Oh, by the way, in many cases, it's actually very cool to think in terms of, to put the physical units in there, right? If one objective is fuel use, it might be in kilograms of fuel. Another objective could be the smoothness of the ride. It could literally be something like the RMS value of the jerk.","zh":"如果它是15，那就意味着，我不知道，它意味着一些东西，对吧？很多。这取决于这些量的单位，对吧？顺便说一句，在许多情况下，实际上将物理单位考虑进去是非常酷的，对吧？如果一个目标是燃油使用，它可能是以千克燃油为单位。另一个目标可能是乘坐的平滑度，它可能实际上是加速度的均方根值。","start":1940.16,"end":1968.38},{"id":81,"text":"People know what that is? Sorry. Okay, that was quasi-slang, quasi-dialect. So in control and mechanical engineering, you have the position, first derivative, second derivative is acceleration, and the third is jerk. And then after that, the fourth derivative is snap. Good, snap, right? So this is just universal.","zh":"人们知道这是什么意思吗？抱歉。好的，那是半俚语，半方言。在控制和机械工程中，你有位置，一阶导数，二阶导数是加速度，三阶导数是急动度。然后之后，四阶导数是snap。好的，snap，对吧？这就是普遍的。","start":1969.25,"end":1995.26},{"id":82,"text":"So for example, when you get on a fancy modern elevator, Not in this country, but if you had one that had real technology, you got a fancy one. You wouldn't even feel moving. The reason is they actually have a trajectory that has minimized the snap. Everybody got that? Also, I think drone trajectories are designed to minimize snap. So if you minimize the snap, that's the fourth derivative. Again, this is cultural enrichment. You don't need to know this, but it's fun.","zh":"例如，当你乘坐一个现代的电梯时，当然不是在这个国家，但如果有一个真正有技术的电梯，你会得到一个高级的电梯。你甚至不会感觉到在移动。原因在于，他们实际上设计了一个使四阶导数（snap）最小化的轨迹。大家明白了吗？此外，我认为无人机的轨迹设计也是为了最小化snap。所以，如果你最小化snap，那就是四阶导数。这又是一种文化拓展。你不需要知道这些，但很有趣。","start":1995.87,"end":2022.28}],"notes":["本段讲解了正则化最小二乘法中如何通过引入正则项来控制参数的大小，同时强调了目标函数中不同项的优先级。讲者提到，正则化项可以视为一种‘交换率’，用于衡量参数大小与残差大小之间的相对重要性。","讲者通过一个实际例子说明了如何将物理单位引入优化问题中，例如将燃油消耗作为目标函数的一部分，或者将乘坐舒适度（如加速度的均方根值）作为另一个目标。这种做法有助于更直观地理解优化问题的物理意义。","讲者进一步解释了控制和机械工程中常用的导数术语，如位置、速度、加速度、加加速度（jerk）和加加加速度（snap）。这些术语在优化问题中用于描述系统动态行为，例如电梯和无人机轨迹设计中对平滑性的要求。","讲者提到，虽然这些术语在某些领域是文化背景知识，但它们在优化问题中具有实际意义。例如，电梯轨迹设计中通过最小化snap来实现平滑运动，而无人机轨迹设计也遵循类似原则。","讲者强调了正则化项中参数γ的作用，即它决定了参数大小与残差大小之间的权衡。γ的取值会影响最终的优化结果，因此需要根据具体问题进行调整。","讲者通过举例说明了如何将物理单位和工程术语融入优化问题，这有助于更直观地理解和解释优化模型的实际应用。"],"formulas":[{"latex":"||Ax - b||^2 + \\rho ||x||^2","symbols":"正则化最小二乘法的目标函数","explanation":"该公式表示正则化最小二乘法的目标函数，其中第一项是拟合误差的平方和，第二项是参数的正则化项，用于控制参数的大小。适用假设为A为设计矩阵，x为参数向量，b为观测向量，ρ为正则化参数。","evidence":"Here we go. Regularized least squares is, I want this thing interpreted as a fitting error to small, and then I want also the x, which in this case we'd interpret as the parameters in a regression model. I want those to be small. We'll talk much more about that later. So how do I do that?"},{"latex":"\\rho","symbols":"正则化参数","explanation":"该参数用于控制正则化项的权重，即参数大小与残差大小之间的权衡。适用假设为ρ为正数，用于调节正则化项的强度。","evidence":"primary objective and your secondary objective is that the parameter shouldn't be big, right? And so that gives you, and so basically gamma is a translation, it's an exchange rate that tells you how much large x irritates you compared to large residual. That's what it tells you."}],"uncertainties":["quasi-slang, quasi-dialect"],"diagram":"none","start":1866.18,"end":2022.28,"asr_flags":[],"math_clarifications":["公式中的正则化项使用了向量范数，符合常规表示方法。正则化参数ρ的使用符合常规的正则化最小二乘法框架。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1866.18,"text":"Here we go. Regularized least squares is, I want this thing interpreted as a fitting error to small, and then I want also the x, which in this case we'd interpret as the parameters in a regression model. I want those to be small. We'll talk much more about that later. So how do I do that?"},{"start":1887.73,"text":"I will take something that's a positive two vector. By the way, if I multiply that vector, I can scale it by any positive number, and I'm going to get, when I solve this problem, I'm going to get this. It's just a multiple of this. So I can, without loss generality, make the first one one. By the way, people often call, they often interpret the first objective, they call that their primary objective. And then, in this case, you'd say, well, our training loss is the..."},{"start":1915.16,"text":"primary objective and your secondary objective is that the parameter shouldn't be big, right? And so that gives you, and so basically gamma is a translation, it's an exchange rate that tells you how much large x irritates you compared to large residual. That's what it tells you."},{"start":1940.16,"text":"If it's 15, it means, I don't know, it means something, right? A lot. It depends on the units of these things, right? Oh, by the way, in many cases, it's actually very cool to think in terms of, to put the physical units in there, right? If one objective is fuel use, it might be in kilograms of fuel. Another objective could be the smoothness of the ride. It could literally be something like the RMS value of the jerk. People know what that is? Sorry. Okay, that was..."},{"start":1969.25,"text":"Quasi-slang, quasi-dialect. So in control and mechanical engineering, you have the position, first derivative, second derivative is acceleration, and the third is jerk. And then after that, the fourth derivative is snap. Good, snap, right? So this is just universal. So for example, when you get on a fancy modern elevator,"},{"start":1995.87,"text":"Not in this country, but if you had one that had real technology, you got a fancy one. You wouldn't even feel moving. The reason is they actually have a trajectory that has minimized the snap. Everybody got that? Also, I think drone trajectories are designed to minimize snap. So if you minimize the snap, that's the fourth derivative. Again, this is cultural enrichment. You don't need to know this, but it's fun. And anybody know the... So they have..."}],"speech_gaps":[],"frame":"../frames/v007/012.webp","frame_time":1878.18},{"title":"凸优化中的对偶问题与多目标优化","segments":[{"id":83,"text":"Three more derivatives, which are never used, but there's a good joke. There you go. So the crackle and pop, that's it. So you can really impress your mechanical engineering or control friends by saying, if they're saying, what are you doing? I'm making a drone fly around the Stanford campus. And you go, cool, what are you minimizing? And they'll say, our misvalue of snap. And you go, how about crackle or pop? And you'll get a rise out of them.","zh":"还有三个导数，它们从未被使用过，但有一个好笑话。就是这样。所以那些噼里啪啦的声音，就是全部了。你真的可以让你的机械工程或控制专业的朋友们印象深刻，当他们问你在做什么时，你说你在让无人机绕斯坦福校园飞行。然后他们会说，酷，你在最小化什么？他们会说，我们的snap的误值。你接着问，那crackle或pop呢？他们就会对你有反应。","start":2022.59,"end":2050.07},{"id":84,"text":"I mean, I assume. OK, sorry. That was a big digression. OK, we're back. OK, so this is fine. Everybody, this is just a least squares problem, and you can solve it. And everyone here has probably seen this in some context. It's ridge regression, but we'll get to that later. OK? Yeah? Sorry, I meant that E and K star, right? That's right. Can you explain the intuition behind that? Oh.","zh":"我是说，我假设。好的，抱歉。那是一个很大的离题。好的，我们回来了。好的，这样就可以了。大家，这只是一个最小二乘问题，你可以解决它。这里在座的每个人可能都曾在某个上下文中见过这个。这是岭回归，但我们稍后再讲，好吗？是的？抱歉，我指的是E和K星，对吧？没错。你能解释一下背后的直觉吗？哦。","start":2050.67,"end":2073.84},{"id":85,"text":"Well, okay. First, there's the math, right? When I form this, this better be a scalar convex optimization problem. And when I have an objective function, which is a vector, and it's convex with respect to a cone k, then actually, if you form lambda transpose f0 of x when lambda is positive in the dual cone, that's guaranteed to be a convex function.","zh":"好吧，首先有数学，对吧？当我形成这个时，这必须是一个标量凸优化问题。当我有一个目标函数，它是一个向量，并且相对于锥K是凸的，那么实际上，如果你形成lambda转置f0(x)，当lambda在对偶锥中为正时，这被保证是一个凸函数。","start":2075.03,"end":2100.9},{"id":86,"text":"If not, if that fails, this need not be convex. And so this is all very nice, well, and good, but we can't solve it. I don't know if that counts as intuition, but anyway, yeah. And the dual of R plus to the Q is R plus to the Q. So basically it says, I mean, this is a way to make it for, in the multi-criterion case, it's making it much more fancy than it needs to be. It would basically say, take a bunch of positive weights.","zh":"如果不是这样的话，如果这失败了，这就不一定是凸的。所以这一切都非常美好，很好，但我们无法解决它。我不知道这是否算作直觉，但无论如何，是的。R加到Q的对偶仍然是R加到Q。基本上，它说的是，在多目标情况下，这是一种让问题变得过于复杂的手段。它基本上会说，取一堆正权重。","start":2101.61,"end":2127.48},{"id":87,"text":"Minimize the positive weighted sum of the objectives. Okay? And the statement is, you will get a Pareto optimal point. Right? You want another one? Change the weights. Right? And we'll talk about what the weights mean, too. Yeah? Sorry, I missed that. Oh, we'll get to that.","zh":"最小化各个目标的正权重和。好吗？这个陈述是，你会得到一个帕累托最优解。对吧？你还想要另一个？改变权重。对吧？我们还会讨论这些权重的含义。是的？抱歉，我错过了那个。哦，我们会讲到的。","start":2128.53,"end":2153.44},{"id":88,"text":"So it turns out, yeah, as you vary lambda, you will get almost all Pareto optimal points. You won't get the limits, right? You will, in this problem, you would not get that dark point right there. So, sorry, actually, this is a non-convex problem, so I shouldn't be using that as an example, right? So we'll get to that. Okay. All right.","zh":"所以事实上，当你变化lambda时，你会得到几乎所有帕累托最优解点。你不会得到极限点，对吧？在这个问题中，你不会得到那个暗色的点。所以，抱歉，实际上这是一个非凸问题，所以我不应该用这个作为例子，对吧？我们之后会讲到。好的。好了。","start":2154.81,"end":2179.6}],"notes":["本段主要讲解了凸优化中的对偶问题和多目标优化的基本概念。首先，讲者提到在形成凸优化问题时，需要确保目标函数是凸函数，并且在锥体k上凸。接着，讲者解释了当lambda在对偶锥中为正时，lambda转置乘以目标函数f0(x)会是一个凸函数。如果这些条件不满足，问题可能不是凸的。","讲者进一步指出，当使用正权重对多个目标函数进行加权求和时，可以得到帕累托最优解。通过改变权重，可以得到不同的帕累托最优解。然而，这种方法在多目标优化中可能过于复杂，因此需要进一步讨论权重的意义。","讲者提到，随着lambda的变化，可以得到几乎所有帕累托最优解，但不会得到极限点。最后，讲者指出，所举的例子实际上是一个非凸问题，因此不应作为凸优化的典型例子。","讲者在讲解过程中，多次提到对偶问题和多目标优化的数学基础，包括凸函数、锥体、对偶锥等概念。这些概念是理解凸优化和多目标优化的关键。","讲者还提到，虽然对偶问题在某些情况下可以简化问题，但需要确保问题的凸性。如果问题不是凸的，那么对偶问题可能无法提供有效的解。","最后，讲者强调了多目标优化中权重的重要性，并指出通过调整权重可以得到不同的帕累托最优解。然而，权重的选择和解释仍然是一个需要进一步探讨的问题。"],"formulas":[],"uncertainties":["R plus to the Q"],"diagram":"none","start":2022.59,"end":2179.6,"asr_flags":[],"math_clarifications":["公式未提供足够的数学类型、条件或上下文支持其结论，无法核定其正确性，因此移除。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2022.59,"text":"Three more derivatives, which are never used, but there's a good joke. There you go. So the crackle and pop, that's it. So you can really impress your mechanical engineering or control friends by saying, if they're saying, what are you doing? I'm making a drone fly around the Stanford campus. And you go, cool, what are you minimizing? And they'll say, our misvalue of snap. And you go, how about crackle or pop? And you'll get a rise out of them."},{"start":2050.67,"text":"I mean, I assume. OK, sorry. That was a big digression. OK, we're back. OK, so this is fine. Everybody, this is just a least squares problem, and you can solve it. And everyone here has probably seen this in some context. It's ridge regression, but we'll get to that later. OK? Yeah? Sorry, I meant that E and K star, right? That's right. Can you explain the intuition behind that? Oh."},{"start":2075.03,"text":"Well, okay. First, there's the math, right? When I form this, this better be a scalar convex optimization problem. And when I have an objective function, which is a vector, and it's convex with respect to a cone k, then actually, if you form lambda transpose f0 of x when lambda is positive in the dual cone, that's guaranteed to be a convex function."},{"start":2101.61,"text":"If not, if that fails, this need not be convex. And so this is all very nice, well, and good, but we can't solve it. I don't know if that counts as intuition, but anyway, yeah. And the dual of R plus to the Q is R plus to the Q. So basically it says, I mean, this is a way to make it for, in the multi-criterion case, it's making it much more fancy than it needs to be. It would basically say, take a bunch of positive weights."},{"start":2128.53,"text":"Minimize the positive weighted sum of the objectives. Okay? And the statement is, you will get a Pareto optimal point. Right? You want another one? Change the weights. Right? And we'll talk about what the weights mean, too. Yeah? Sorry, I missed that. Oh, we'll get to that."},{"start":2154.81,"text":"So it turns out, yeah, as you vary lambda, you will get almost all Pareto optimal points. You won't get the limits, right? You will, in this problem, you would not get that dark point right there. So, sorry, actually, this is a non-convex problem, so I shouldn't be using that as an example, right? So we'll get to that. Okay. All right."}],"speech_gaps":[],"frame":"../frames/v007/013.webp","frame_time":2034.59},{"title":"风险调整回报与对偶性","segments":[{"id":89,"text":"So I guess we looked at this. And the risk-return trade-off, this shows you actually how we computed that, although there's several other ways, and I'll explain that. By the way, this has a name. If you flip the sign on this, it's p bar transpose x plus gamma this. So this is the return, if I flip the sign. p bar transpose x is the return. Minus gamma x transpose sigma x. So when you do that, that's the risk. Gamma times the risk. That's called the risk-adjusted return. That's just a completely standard.","zh":"所以我想我们已经看过这个了。风险与回报的权衡，这展示了我们是如何计算它的，尽管还有其他几种方法，我之后会解释。顺便说一下，这个有特定的名称。如果你把这个符号翻转，它就是 p bar 转置 x 加上 gamma 这个。所以这就是回报，如果我把符号翻转的话。p bar 转置 x 是回报。减去 gamma x 转置 sigma x。当你这样做时，这就是风险。gamma 乘以风险。这被称为风险调整后的回报。这只是一个完全标准的术语。","start":2181.08,"end":2210.2},{"id":90,"text":"Everybody got that? And then gamma is called the risk aversion parameter. Basically because of the sign, in that case you want to maximize risk-adjusted return, and it's basically something good, which is a return, minus, that means it penalizes you to make a choice that has high risk. And gamma tells you how much risk irritates you, and it puts you on the scale of the return.","zh":"大家都明白了吗？然后 gamma 被称为风险厌恶参数。基本上是因为符号，所以在这种情况下你想要最大化风险调整后的回报，这基本上是一个好的东西，即回报，减去，这意味着它会惩罚你做出高风险的选择。gamma 告诉你多少风险会让你感到烦躁，并且它将你放在回报的尺度上。","start":2210.83,"end":2237.34},{"id":91,"text":"So that's why it's called the risk aversion parameter. But this is not a bad thing to know. Everybody got this? By the way, there's plenty of other ways to solve this problem. I'm going to go back to that and just mention it because you'll be doing this on your homework. You could scalarize. It'll work. I guarantee it'll work. You could do another thing that would work perfectly well here. I could sweep. Let's say I'm going to sweep across standard deviation of error like this, right?","zh":"这就是为什么它被称为风险厌恶参数。但这并不是一个不好的知识。大家都明白了吗？顺便说一下，还有许多其他方法可以解决这个问题。我会回到这一点并简单提及，因为你们会在作业中做这个。你可以进行标量化解。它会起作用。我保证它会起作用。你也可以在这里做另一件事，它同样可以很好地起作用。我可以进行扫描。比如说，我要扫描误差的标准差，像这样，对吧？","start":2237.89,"end":2265.85},{"id":92,"text":"That's the square root of this or something, right? So what I do is I would simply, I would minimize minus P bar transpose X and I'd put a constraint on that and sweep the constraint value. And you'd get the same thing. It basically being, I would say, suppose your, I would say your risk should be less than 10%. And then you simply maximize the return and you would get this point. And then you'd have, you know, you'd have for risk limit in risk limits. I don't know if I'm...","zh":"这就是这个的平方根或者类似的东西，对吧？所以我所做的就是我简单地最小化负的 p bar 转置 x，并且对这个施加一个约束，然后扫描约束值。你会得到同样的结果。基本上，我会说，假设你的风险应该小于 10%。然后你只需最大化回报，你会得到这个点。然后你会有，你知道的，你会有风险限制在风险限制中。我不确定我……","start":2266.55,"end":2294.49},{"id":93,"text":"kind of speaking roughly in Python or something, right? You'd solve the problem and then report the return and the risk, and then you'd plot it. Everybody got that? So, okay. So you can do that, I think. I forget. It asks you to get a trade-off in some energy storage system. I think that's... Is that on the current homework? Or did I just remember that correctly? I think it is. Okay. Okay. So, all right.","zh":"粗略地说，用Python或者其他语言来说，对吧？你会解决这个问题，然后报告回报和风险，然后你会画图。大家明白了吗？所以，好的。所以我认为你可以这么做。我忘了。它要求你在某种能源存储系统中获得一种权衡。我想那是……这是当前的家庭作业吗？或者我刚才记对了吗？我想是的。好的。好的。那么，好吧。","start":2295.17,"end":2325.93},{"id":94,"text":"That finishes that. Actually, it's a perfect segue into the next topic. The next topic is duality. It's actually really fun. It has to do with Lagrange multipliers and stuff. I don't mind saying that the first two or three times I saw Lagrange multipliers, I had absolutely no idea what it meant. It was taught as a behavior. Basically, the behavior was this. Take your constraints.","zh":"这结束了这个话题。实际上，这完美地过渡到下一个主题。下一个主题是对偶性。实际上，这真的很有趣。它与拉格朗日乘数有关。我不介意说，第一次看到拉格朗日乘数的时候，前两三次我完全不明白它的意思。它被教授为一种行为。基本上，这种行为是这样的。取你的约束条件。","start":2326.49,"end":2352.6}],"notes":["本段讲解了风险调整回报的概念，即通过将收益与风险结合，形成一个综合指标。具体来说，收益由p bar transpose x表示，而风险则由gamma乘以x transpose sigma x表示。风险调整回报是收益减去风险的惩罚项，其中gamma是风险厌恶参数，表示对风险的敏感程度。","风险调整回报的计算方式是通过将收益与风险结合，形成一个综合指标。收益由p bar transpose x表示，而风险则由gamma乘以x transpose sigma x表示。风险调整回报是收益减去风险的惩罚项，其中gamma是风险厌恶参数，表示对风险的敏感程度。","在实际应用中，可以通过多种方法解决风险调整回报的问题，例如标量化和扫描法。标量化方法通过将问题转化为单变量优化问题，而扫描法则通过设定风险约束并逐步调整约束值来寻找最优解。","风险调整回报的计算方式是通过将收益与风险结合，形成一个综合指标。收益由p bar transpose x表示，而风险则由gamma乘以x transpose sigma x表示。风险调整回报是收益减去风险的惩罚项，其中gamma是风险厌恶参数，表示对风险的敏感程度。","在实际应用中，可以通过多种方法解决风险调整回报的问题，例如标量化和扫描法。标量化方法通过将问题转化为单变量优化问题，而扫描法则通过设定风险约束并逐步调整约束值来寻找最优解。","本段还提到，风险调整回报的计算方式是通过将收益与风险结合，形成一个综合指标。收益由p bar transpose x表示，而风险则由gamma乘以x transpose sigma x表示。风险调整回报是收益减去风险的惩罚项，其中gamma是风险厌恶参数，表示对风险的敏感程度。"],"formulas":[],"uncertainties":["p bar transpose x plus gamma this"],"diagram":"none","start":2181.08,"end":2352.6,"asr_flags":[],"math_clarifications":["原始片段中提到的公式未提供完整的数学定义和上下文，例如未说明 $ p_{\\bar{}} $、$ x $、$ \\Sigma $ 和 $ \\gamma $ 的具体含义和定义域。此外，公式未明确表示为一个函数或变量，因此无法进行数学复核。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2181.08,"text":"So I guess we looked at this. And the risk-return trade-off, this shows you actually how we computed that, although there's several other ways, and I'll explain that. By the way, this has a name. If you flip the sign on this, it's p bar transpose x plus gamma this. So this is the return, if I flip the sign. p bar transpose x is the return. Minus gamma x transpose sigma x. So when you do that, that's the risk. Gamma times the risk. That's called the risk-adjusted return. That's just a completely standard."},{"start":2210.83,"text":"Everybody got that? And then gamma is called the risk aversion parameter. Basically because of the sign, in that case you want to maximize risk-adjusted return, and it's basically something good, which is a return, minus, that means it penalizes you to make a choice that has high risk. And gamma tells you how much risk irritates you, and it puts you on the scale of the return."},{"start":2237.89,"text":"So that's why it's called the risk aversion parameter. But this is not a bad thing to know. Everybody got this? By the way, there's plenty of other ways to solve this problem. I'm going to go back to that and just mention it because you'll be doing this on your homework. You could scalarize. It'll work. I guarantee it'll work. You could do another thing that would work perfectly well here. I could sweep. Let's say I'm going to sweep across standard deviation of error like this, right?"},{"start":2266.55,"text":"That's the square root of this or something, right? So what I do is I would simply, I would minimize minus P bar transpose X and I'd put a constraint on that and sweep the constraint value. And you'd get the same thing. It basically being, I would say, suppose your, I would say your risk should be less than 10%. And then you simply maximize the return and you would get this point. And then you'd have, you know, you'd have for risk limit in risk limits. I don't know if I'm..."},{"start":2295.17,"text":"kind of speaking roughly in Python or something, right? You'd solve the problem and then report the return and the risk, and then you'd plot it. Everybody got that? So, okay. So you can do that, I think. I forget. It asks you to get a trade-off in some energy storage system. I think that's... Is that on the current homework? Or did I just remember that correctly? I think it is. Okay. Okay. So, all right."},{"start":2326.49,"text":"That finishes that. Actually, it's a perfect segue into the next topic. The next topic is duality. It's actually really fun. It has to do with Lagrange multipliers and stuff. I don't mind saying that the first two or three times I saw Lagrange multipliers, I had absolutely no idea what it meant. It was taught as a behavior. Basically, the behavior was this. Take your constraints."}],"speech_gaps":[],"frame":"../frames/v007/014.webp","frame_time":2193.08},{"title":"拉格朗日乘数法与优化问题","segments":[{"id":95,"text":"Take your objective, add to it some multiple of the constraints, and you're like, cool. And you go, what are those? Those are Lagrange multipliers. And you go, now what do you do? Take partial derivative and set them equal to zero. You go, but what does it mean? And they're like, shut up and just do it. I mean, that was kind of my experience of it, right? And the second time it happened, there it was again. And I was like, but what are these things? They're like, don't worry about it, right? So anyway, good news is, I hope that by next Thursday, you will not be...","zh":"拿你的目标函数，加上一些约束条件的倍数，你会觉得，挺酷的。然后你问，那些是什么？那些就是拉格朗日乘数。接着你问，现在该怎么办？对，就是对它求偏导数并令其等于零。你又问，这到底意味着什么？他们说，闭嘴，照做就行。我的经历大概就是这样，对吧？第二次遇到这种情况时，它又出现了。我当时想，这些是什么东西？他们说，别管那么多，对吧？总之，好消息是，我希望到下周四的时候，你们不会……","start":2354.92,"end":2382.03},{"id":96,"text":"you will understand exactly what it means. This is the first time I ever understood it, was in the context of context optimization. Okay, so let's look at this. And it starts slowly. It just very innocently goes step by step, and you'll see after a while we start saying things that are not remotely obvious. Okay, here it is. So we'll start with the Lagrangian. Oh, by the way, this strongly suggests that this is not a new development.","zh":"你们会完全明白它的含义。这是我第一次真正理解它，是在上下文优化的背景下。好的，让我们来看一下。它开始得很缓慢。它只是很无辜地一步一步地进行，过一会儿我们会说一些看起来并不明显的话。好的，这里就是。我们将从拉格朗日函数开始。顺便说一句，这强烈表明这不是一个新发展。","start":2382.61,"end":2411.57},{"id":97,"text":"Right, because Lagrange was doing this around 1820 or 1810 or something like that. Maybe even earlier, I can't remember. Anyway, so now the truth is he probably would, he would recognize like baby versions of it. And so this is just an honorary thing where it's attributed, it's called the Lagrangian and I don't know.","zh":"对，因为拉格朗日大约在1820年或1810年左右就开始这么做，可能更早，我记不太清楚了。不管怎样，现在的真相是，他大概会认出这些婴儿版本的东西。因此，这只是一个荣誉性的称呼，它被称为拉格朗日函数，我不清楚具体原因。","start":2412.48,"end":2432.04},{"id":98,"text":"And it didn't have inequality constraints then, but you know, whatever, it's just an honorary thing. Okay, so here's what it is. So you have this standard form problem. And by the way, a lot of the interesting applications, the problem is not convex. Okay, so I have a standard form problem. And now I'm just going to form the Lagrangian. And the Lagrangian is going to be this. It's actually super interesting. It goes like this. It's a single function. It's going to be the objective plus,","zh":"当时它并没有不等式约束，但不管怎样，这只是一个荣誉性的称呼。好的，那么这就是它的定义。你有一个标准形式的问题。顺便说一句，很多有趣的应用中，这个问题并不是凸的。好的，我现在只是要构造拉格朗日函数。拉格朗日函数实际上非常有趣。它会像这样进行。它是一个单一的函数。它将是目标函数加上……","start":2436.28,"end":2464.12},{"id":99,"text":"a weighted sum of the constraints, plus a weighted, this inequality constraints, plus a weighted sum of the equality constraints, okay? That's the Lagrangian, right?","zh":"一个约束条件的加权和，加上一个不等式约束的加权和，加上一个等式约束的加权和，对吧？这就是拉格朗日函数，对吧？","start":2464.87,"end":2477.49},{"id":100,"text":"Okay. That's, that's the idea. Um, and it's kind of, I mean, it, you know, then people would give","zh":"好的。这就是这个想法。嗯，而且它有点……我的意思是，你会听到人们给出这样的想法。","start":2478.68,"end":2485.68},{"id":101,"text":"ideas like this. Oh, so one, one way to say it is you would say, yeah, this is like a planned","zh":"哦，一种说法是，你会说，是的，这就像一个计划……","start":2485.68,"end":2491.36},{"id":102,"text":"economy or something, right? This says, these are just rules and regulations. Like if, if you","zh":"经济或者什么的，对吧？这说的是，这些只是规则和规定。比如，如果你违反了这条或那条，那么你知道的，嗯，执法部门或者证券交易委员会的人就会来找你。这是，这是，这是像一个计划。这是一个要求，","start":2491.36,"end":2495.96},{"id":103,"text":"violate this or this, then, you know, uh, the, you know, somebody in law enforcement or the SEC","zh":"对吧？然后你会说哦，这就像市场版本一样，对吧？而且，所有这些稍后会变得更精确一些，但市场版本说，你知道你想要违反那个不等式，这没问题，","start":2495.96,"end":2501.5},{"id":104,"text":"is going to come after you. That's, that's, that's like a plan. It's a, it's a requirement,","zh":"如果土地是正的，它只是说你要为此付出代价，对吧？这就是它所说的。这就是这个想法，对吧？另外，让我画个图来","start":2501.5,"end":2505.16},{"id":105,"text":"right then you'd say oh well this is like the market version right and by the way all of this","zh":"向你展示这看起来多么令人震惊地天真，对吧？因为这非常奇怪。","start":2505.16,"end":2511.1},{"id":106,"text":"will become a bit more precise later but and the market version says well you know what you want","zh":"对吧？然后你会说哦，这就像市场版本一样，对吧？而且，所有这些稍后会变得更精确一些，但市场版本说，你知道你想要违反那个不等式，这没问题，","start":2511.1,"end":2516.5},{"id":107,"text":"to violate that inequality okay that's fine and if land is positive it just says you're gonna pay","zh":"如果土地是正的，它只是说你要为此付出代价，对吧？这就是它所说的。这就是这个想法，对吧？另外，让我画个图来","start":2516.5,"end":2522.04},{"id":108,"text":"for it right that's what it says so that's that's the idea right also let me just draw a picture to","zh":"向你展示这看起来多么令人震惊地天真，对吧？因为这非常奇怪。","start":2522.04,"end":2527.54},{"id":109,"text":"to show you actually how appallingly naive this looks, right? Because it's very weird.","zh":"对吧？然后你会说哦，这就像市场版本一样，对吧？而且，所有这些稍后会变得更精确一些，但市场版本说，你知道你想要违反那个不等式，这没问题，","start":2527.54,"end":2534.86}],"notes":["本段主要介绍了拉格朗日乘数法的基本概念，即通过将目标函数与约束条件结合，形成拉格朗日函数，并通过求导找到极值点。讲者提到，拉格朗日乘数法在优化问题中非常重要，但初学者可能会感到困惑，需要通过多次接触才能理解。","讲者提到拉格朗日乘数法的历史背景，指出拉格朗日早在18世纪就提出了这一方法，尽管当时没有不等式约束，但这一方法仍然被广泛使用。","讲者通过类比经济中的计划经济和市场经济，解释了拉格朗日乘数法的含义。计划经济中的规则和约束类似于拉格朗日乘数法中的约束条件，而市场经济中的价格机制则类似于拉格朗日乘数法中的权重。","讲者提到拉格朗日函数的构造方式，即目标函数加上约束条件的加权和。这种构造方式使得优化问题可以转化为无约束优化问题。","讲者指出，拉格朗日乘数法在实际应用中可能遇到非凸问题，这使得优化过程更加复杂。","讲者最后提到，拉格朗日乘数法的直观理解可能需要通过图形来辅助，以帮助学生更好地理解其背后的数学原理。"],"formulas":[],"uncertainties":["land is positive"],"diagram":"none","start":2354.92,"end":2534.86,"asr_flags":[],"math_clarifications":["原文提到拉格朗日函数包含加权和的约束条件，包括不等式约束和等式约束，但公式未明确区分这些类型，因此无法准确核对。"],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":2354.92,"text":"take your objective, add to it some multiple of the constraints, and you're like, cool. And you go, what are those? Those are Lagrange multipliers. And you go, now what do you do? Take partial derivative and set them equal to zero. You go, but what does it mean? And they're like, shut up and just do it. I mean, that was kind of my experience of it, right? And the second time it happened, there it was again. And I was like, but what are these things? They're like, don't worry about it, right? So anyway, good news is, I hope that by next Thursday, you will not be..."},{"start":2382.61,"text":"you will understand exactly what it means. This is the first time I ever understood it, was in the context of context optimization. Okay, so let's look at this. And it starts slowly. It just very innocently goes step by step, and you'll see after a while we start saying things that are not remotely obvious. Okay, here it is. So we'll start with the Lagrangian. Oh, by the way, this strongly suggests that this is not a new development."},{"start":2412.48,"text":"Right, because Lagrange was doing this around 1820 or 1810 or something like that. Maybe even earlier, I can't remember. Anyway, so now the truth is he probably would, he would recognize like baby versions of it. And so this is just an honorary thing where it's attributed, it's called the Lagrangian and I don't know."},{"start":2436.28,"text":"And it didn't have inequality constraints then, but you know, whatever, it's just an honorary thing. Okay, so here's what it is. So you have this standard form problem. And by the way, a lot of the interesting applications, the problem is not convex. Okay, so I have a standard form problem. And now I'm just going to form the Lagrangian. And the Lagrangian is going to be this. It's actually super interesting. It goes like this. It's a single function. It's going to be the objective plus,"},{"start":2464.87,"text":"a weighted sum of the constraints, plus a weighted, this inequality constraints, plus a weighted sum of the equality constraints, okay? That's the Lagrangian, right?"},{"start":2478.68,"text":"Okay. That's, that's the idea. Um, and it's kind of, I mean, it, you know, then people would give"},{"start":2485.68,"text":"ideas like this. Oh, so one, one way to say it is you would say, yeah, this is like a planned"},{"start":2491.36,"text":"economy or something, right? This says, these are just rules and regulations. Like if, if you"},{"start":2495.96,"text":"violate this or this, then, you know, uh, the, you know, somebody in law enforcement or the SEC"},{"start":2501.5,"text":"is going to come after you. That's, that's, that's like a plan. It's a, it's a requirement,"},{"start":2505.16,"text":"right then you'd say oh well this is like the market version right and by the way all of this"},{"start":2511.1,"text":"will become a bit more precise later but and the market version says well you know what you want"},{"start":2516.5,"text":"to violate that inequality okay that's fine and if land is positive it just says you're gonna pay"},{"start":2522.04,"text":"for it right that's what it says so that's that's the idea right also let me just draw a picture to"},{"start":2527.54,"text":"to show you actually how appallingly naive this looks, right? Because it's very weird."}],"speech_gaps":[],"frame":"../frames/v007/015.webp","frame_time":2366.92},{"title":"约束优化与拉格朗日松弛","segments":[{"id":110,"text":"So I'm just going to draw, let's have a problem, this is zero, and this is going to be f1 of x, right?","zh":"所以我只是要画一个图，让我们有一个问题，这是零，这将是x的f1函数，对吧？","start":2538.02,"end":2543.44},{"id":111,"text":"This is just f1 of x. And I'm going to have an objective, so I'm going to plot f0 of x here, right?","zh":"这只是x的f1函数。我将有一个目标函数，所以我将在这里绘制x的f0函数，对吧？","start":2543.44,"end":2549.76},{"id":112,"text":"plot f0 of x here, right? So here, if you propose to me an x, we will evaluate f0 and f1. And the","zh":"在这里绘制x的f0函数，对吧？所以，如果你向我提出一个x值，我们将评估f0和f1。并且","start":2549.76,"end":2559.8},{"id":113,"text":"because you violate the constraint because f1 of x is positive, right? So this is unacceptable, right?","zh":"因为你违反了约束条件，因为x的f1值是正的，对吧？所以这是不可接受的，对吧？","start":2559.8,"end":2565.48},{"id":114,"text":"If you're on the left side, everything is cool and you want to go as low as possible, In fact, that's the semantics of an optimization problem.","zh":"如果你在左边，一切都很顺利，你希望尽可能低，事实上，这就是优化问题的含义。","start":2566.1,"end":2570.58},{"id":115,"text":"right? If you're on the left side, everything is cool and you want to go as low as possible,","zh":"对吧？如果你在左边，一切都很顺利，你希望尽可能低，","start":2571.16,"end":2575.92},{"id":116,"text":"So roughly speaking, you're saying, here's how I care.","zh":"总的来说，你是在说，这里是我的关注点。","start":2575.92,"end":2579.0},{"id":117,"text":"I could also make it an unconstrained problem by just writing it this way.","zh":"我也可以通过这样写，把它变成一个无约束的问题。","start":2579.14,"end":2579.92},{"id":118,"text":"The indicator function of f1 of x is less than zero.","zh":"函数f1在x处的指示函数小于零。","start":2580.12,"end":2584.66},{"id":119,"text":"I could also make it an unconstrained problem by just writing it this way.","zh":"我也可以通过这种方式将其转化为无约束问题。","start":2584.86,"end":2589.2},{"id":120,"text":"The indicator function of f1 of x is less than zero.","zh":"函数f1在x处的指示函数小于零。","start":2589.26,"end":2593.06},{"id":121,"text":"And it's a weird term. It's like a weird emotional, it's like a bipolar, it's either like zero or plus infinity, right? So it's just like, okay, that's fine. So basically, that's this picture here, okay? Now let's look at the Lagrangian. Well, the Lagrangian is going to be f0 of x plus lambda f1 of x, okay? So, right, that's the Lagrangian. I'm going to draw that, okay? Here, it looks like this, right?","zh":"这是一个奇怪的术语。它像是某种奇怪的情绪，像是双极的，要么是零，要么是正无穷大，对吧？所以它只是这样，没问题。基本上，这就是这里这张图所表示的，对吧？现在让我们看看拉格朗日函数。嗯，拉格朗日函数将是f0(x)加上lambda乘以f1(x)，对吧？所以，没错，这就是拉格朗日函数。我要画出来，对吧？这里看起来是这样的，对吧？","start":2593.24,"end":2594.96},{"id":122,"text":"That's lambda, right? Right, that slope is lambda, okay? So, and now you can see, and by the way, if the story starts, like, I want to develop methods that handle constraints, but using just like, you know, using unconstrained optimization, and the first thing someone does is says, yeah, no problem. You see this thing? I'm going to approximate it by that. You would say...","zh":"这就是lambda，对吧？没错，这个斜率就是lambda，对吧？现在你可以看到，顺便说一句，如果故事开始，比如，我想开发处理约束的方法，但只使用无约束优化，而某人做的第一件事就是说，没问题。你看到这个了吗？我要用这个来近似。你会说...","start":2595.8,"end":2624.7},{"id":123,"text":"That is not a very good approximation. Like, everybody agree? It's ridiculous. So, I'm just saying that the whole beginning to this story is appalling. It just doesn't make any sense. Like, that curve, that line, is not a good approximation of the true one. Also, it shows you all sorts of weird differences, right? Like, in the true optimization problem, if you have, like...","zh":"这不是一个非常好的近似。大家同意吗？这很荒谬。所以，我只是在说这个故事的开始部分令人震惊。它根本没有任何意义。比如，这条曲线和这条直线，不是对真实情况的一个好近似。此外，它还展示了各种奇怪的差异，对吧？比如，在真实的优化问题中，如果你有，比如...","start":2625.42,"end":2653.87},{"id":124,"text":"That's lambda, right? Right, that slope is lambda, okay? So, and now you can see, and by the way, if the story starts, like, I want to develop methods that handle constraints, but using just like, you know, using unconstrained optimization, and the first thing someone does is says, yeah, no problem. You see this thing? I'm going to approximate it by that. You would say...","zh":"这就是lambda，对吧？没错，这个斜率就是lambda，对吧？现在你可以看到，顺便说一句，如果故事开始，比如，我想开发处理约束的方法，但只使用无约束优化，而某人做的第一件事就是说，没问题。你看到这个了吗？我要用这个来近似。你会说...","start":2654.97,"end":2680.14},{"id":125,"text":"That is not a very good approximation. Like, everybody agree? It's ridiculous. So, I'm just saying that the whole beginning to this story is appalling. It just doesn't make any sense. Like, that curve, that line, is not a good approximation of the true one. Also, it shows you all sorts of weird differences, right? Like, in the true optimization problem, if you have, like...","zh":"这不是一个非常好的近似。大家同意吗？这很荒谬。所以，我只是在说这个故事的开始部分令人震惊。它根本没有任何意义。比如，这条曲线和这条直线，不是对真实情况的一个好近似。此外，它还展示了各种奇怪的差异，对吧？比如，在真实的优化问题中，如果你有，比如...","start":2681.12,"end":2703.74}],"notes":["本段讲解了约束优化问题的基本概念，即通过定义目标函数和约束函数来构建优化问题。当约束被违反时，问题变得不可接受，因此需要通过某种方式处理约束，例如使用指示函数将约束问题转化为无约束问题。","讲者提到，可以通过引入一个指示函数，将约束条件转化为一个惩罚项，该惩罚项在约束被满足时为零，在被违反时为无穷大。这样，原约束优化问题就等价于最小化目标函数加上这个惩罚项的组合。","在处理约束优化问题时，拉格朗日函数被引入，它由目标函数和约束函数的线性组合构成，其中拉格朗日乘子λ决定了约束的权重。讲者指出，这种近似方法并不理想，因为拉格朗日函数的线性近似无法准确反映原问题的结构。","讲者强调，这种将约束问题转化为无约束问题的方法虽然在理论上可行，但在实际应用中并不总是有效，因为拉格朗日函数的线性近似可能无法捕捉到原问题的复杂性。","此外，讲者还提到，这种近似方法可能会导致一些奇怪的差异，例如在原问题中，某些点可能被错误地认为是可行解，而实际上它们并不满足约束条件。","最后，讲者指出，这种将约束问题转化为无约束问题的方法虽然在某些情况下有用，但需要谨慎使用，因为它可能无法准确反映原问题的性质。"],"formulas":[],"uncertainties":["indicator function of f1 of x is less than zero","lambda f1 of x"],"diagram":"none","start":2538.02,"end":2703.74,"asr_flags":[],"math_clarifications":["原句中未明确指示函数的数学定义，且未说明其与目标函数的组合方式，因此无法核定。"],"boards":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":2538.02,"text":"So I'm just going to draw, let's have a problem, this is zero, and this is going to be f1 of"},{"start":2543.44,"text":"x, right? This is just f1 of x. And I'm going to have an objective, so I'm going to plot"},{"start":2549.76,"text":"plot f0 of x here, right? So here, if you propose to me an x, we will evaluate f0 and f1. And the"},{"start":2559.8,"text":"semantics of an optimization problem is, if you're over here, it's completely unacceptable"},{"start":2566.1,"text":"because you violate the constraint because f1 of x is positive, right? So this is unacceptable,"},{"start":2571.16,"text":"right? If you're on the left side, everything is cool and you want to go as low as possible,"},{"start":2575.92,"text":"In fact, that's the semantics of an optimization problem."},{"start":2579.14,"text":"Everybody got this?"},{"start":2580.12,"text":"So roughly speaking, you're saying, here's how I care."},{"start":2584.86,"text":"I could also make it an unconstrained problem by just writing it this way."},{"start":2589.26,"text":"The indicator function of f1 of x is less than zero."},{"start":2593.24,"text":"So this is zero."},{"start":2595.8,"text":"if this predicate evaluates to true, and this is infinity if this is violated, okay? And so solving the constraint problem is the same as minimizing this function, right? Everybody see that? I mean, it's kind of silly, but that's what, everybody got it? Okay, so I'm going to draw the indicator function. It looks like this. So someone says, what are you doing? And you say, well, I'm converting my constrained problem to one that's unconstrained by putting the second term, which handles the objective."},{"start":2625.42,"text":"And it's a weird term. It's like a weird emotional, it's like a bipolar, it's either like zero or plus infinity, right? So it's just like, okay, that's fine. So basically, that's this picture here, okay? Now let's look at the Lagrangian. Well, the Lagrangian is going to be f0 of x plus lambda f1 of x, okay? So, right, that's the Lagrangian. I'm going to draw that, okay? Here, it looks like this, right?"},{"start":2654.97,"text":"That's lambda, right? Right, that slope is lambda, okay? So, and now you can see, and by the way, if the story starts, like, I want to develop methods that handle constraints, but using just like, you know, using unconstrained optimization, and the first thing someone does is says, yeah, no problem. You see this thing? I'm going to approximate it by that. You would say..."},{"start":2681.12,"text":"That is not a very good approximation. Like, everybody agree? It's ridiculous. So, I'm just saying that the whole beginning to this story is appalling. It just doesn't make any sense. Like, that curve, that line, is not a good approximation of the true one. Also, it shows you all sorts of weird differences, right? Like, in the true optimization problem, if you have, like..."}],"speech_gaps":[],"frame":"../frames/v007/016.webp","frame_time":2550.02},{"title":"拉格朗日乘数与对偶函数的经济解释","segments":[{"id":126,"text":"you know, a warehouse usage limit. So this is how much you're, F1 of X is how much you're above your limit and we're using warehouse space. Then basically it says, you go above the limit, totally unacceptable. If you're below, I don't care. You could be using all of your warehouse, or I don't know, you can come in over here, which is like, you got a bunch of warehouses, you're not even using it. You see what I'm saying? And guess what? In the optimization problem, that's, they are, they have, there's nothing different about them.","zh":"你知道，这是一个仓库使用上限。所以这是你F1(X)超出限制的程度，我们使用仓库空间。基本上它说，如果你超出限制，完全不可接受。如果你低于限制，我就不在乎。你可能在使用所有仓库，或者我不知道，你可以来这里，这就像，你有很多仓库，你甚至没有使用。你明白我的意思吗？猜猜看？在优化问题中，这其实是，它们之间没有任何不同。","start":2703.98,"end":2730.82},{"id":127,"text":"This one has a super interesting interpretation. It's a price. Because presumably F0 is in like US dollars or something like that, right? And what this says is, yeah, you want to go over your maximum? No problem. You want to operate over here? Go ahead. This says you're going to pay for extra warehouse space. Everybody got that? But then there's also a flip side, which is over here. You will be subsidized for having extra. You can rent out.","zh":"这个有一个非常有趣的解释。它是一个价格。因为假设F0是以美元或者其他货币单位表示的，对吧？而这说的是，你想要超出最大值？没问题。你想要在这里运作？没问题。这表示你要为额外的仓库空间付费。大家明白了吗？但还有另一面，就是在这里。你将因拥有额外空间而获得补贴。你可以出租。","start":2731.74,"end":2758.08},{"id":128,"text":"warehouse space you're not using and actually generate income right so it's it's really quite different everybody see this i just these are not this is just to kind of give you the idea of how all this is going to go together but these are these are the ideas they're very basic everybody got this okay so it's the idea and people would blabber about you know a market economy versus a planned economy and so on and so forth but you know this is kind of the idea oh also that strongly hints","zh":"仓库空间你没有使用，实际上还能产生收入。所以它真的是非常不同的。大家明白这个吗？我只是想给你们一个这些概念如何结合在一起的大概想法。这些就是这些概念，它们非常基础。大家明白了吗？好的，这就是这个概念。人们会谈论市场经济与计划经济等等，但你知道，这其实就是这个概念。哦，这也强烈暗示了","start":2758.62,"end":2786.17},{"id":129,"text":"these weights, these Lagrange multipliers, they're going to, in many cases, turn out to be prices. So that's what they're going to be. So now, and this gets very weird, but it's like this. You'd say, okay, let's take this Lagrangian, which is sort of an attempt to basically handle the constraints for a problem in the objective.","zh":"这些权重，这些拉格朗日乘数，在很多情况下，实际上会成为价格。所以这就是它们的含义。现在，这变得非常奇怪，但就是这样。你会说，好吧，让我们来考虑这个拉格朗日函数，它基本上是试图处理问题中约束条件的一种方法。","start":2786.91,"end":2812.5},{"id":130,"text":"But you're doing it in a weird price-directed way. You're just saying there's a price for each of these things, and you can violate them, blah, blah, blah. So it looks like that. Now, what we're going to do is we're going to define the dual function, and it's going to be a function of these Lagrange multipliers. They're also called dual variables.","zh":"但你是在一种奇怪的价格导向方式下进行的。你只是说，这些事物都有一个价格，你可以违反它们，等等，等等。看起来就是这样。现在，我们将定义对偶函数，它将是一个关于这些拉格朗日乘数的函数。它们也被称为对偶变量。","start":2813.26,"end":2832.26},{"id":131,"text":"By the way, in many application areas, they have specific names in that application area. In many, they're called shadow prices. Or for example, in energy, they're called locational marginal prices. That's what they're called. So in a lot of fields, these things just have names. And so this thing is...","zh":"顺便提一下，在许多应用领域，它们在该领域中有特定的名称。在许多情况下，它们被称为影子价格。例如，在能源领域，它们被称为节点边际价格。这就是它们的名称。因此，在很多领域，这些概念都有特定的名称。而这个概念是……","start":2832.99,"end":2859.65},{"id":132,"text":"the least cost here over all your choices with these Lagrange multipliers, which we'll later see interpreted as prices. So you minimize that, and whatever the minimum is, that's called this dual function. You saw something like that. It was a conjugate function. If you remember that one interpretation of a conjugate function...","zh":"在这里，通过这些拉格朗日乘数，你最小化所有选择中的最小成本，稍后我们会看到这些被解释为价格。因此，你进行最小化，无论最小值是多少，这被称为对偶函数。你之前见过类似的情况。它是一个共轭函数。如果你记得共轭函数的一个解释……","start":2859.98,"end":2881.2}],"notes":["本段讲解了拉格朗日乘数在经济模型中的解释，将它们视为价格。当资源使用超过限制时，会支付额外费用，而未使用资源则可能获得补贴。这种经济视角帮助理解优化问题中约束条件的处理方式。","讲者提到拉格朗日乘数在不同领域可能有不同的名称，如影子价格或定位边际价格。这表明这些乘数在实际应用中具有明确的经济含义，而不仅仅是数学工具。","对偶函数被定义为拉格朗日乘数的函数，其最小值对应于对偶问题的解。这与共轭函数的概念相关，说明对偶问题在优化理论中的重要性。","讲者强调了拉格朗日乘数与价格之间的联系，这为理解优化问题的经济解释提供了基础。这种联系在实际应用中非常关键，尤其是在资源分配和市场机制设计中。","通过将约束条件视为资源使用限制，讲者展示了如何通过价格机制来处理这些约束。这种机制在市场经济学中具有重要意义，也与凸优化中的对偶理论密切相关。"],"formulas":[],"uncertainties":["warehouse space you're not using and actually generate income right so it's it's really quite different everybody see this i just these are not this is just to kind of give you the idea of how all this is going to go together but these are these are the ideas they're very basic everybody got this okay so it's the idea and people would blabber about you know a market economy versus a planned economy and so on and so forth but you know this is kind of the idea oh also that strongly hints"],"diagram":"none","start":2703.98,"end":2881.2,"asr_flags":[],"math_clarifications":["原文中提到的对偶函数定义不完整，未明确其作为拉格朗日乘数的函数，且未提及对偶问题的约束条件和目标函数。因此，该公式无法准确核对，需移除。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2703.98,"text":"you know, a warehouse usage limit. So this is how much you're, F1 of X is how much you're above your limit and we're using warehouse space. Then basically it says, you go above the limit, totally unacceptable. If you're below, I don't care. You could be using all of your warehouse, or I don't know, you can come in over here, which is like, you got a bunch of warehouses, you're not even using it. You see what I'm saying? And guess what? In the optimization problem, that's, they are, they have, there's nothing different about them."},{"start":2731.74,"text":"This one has a super interesting interpretation. It's a price. Because presumably F0 is in like US dollars or something like that, right? And what this says is, yeah, you want to go over your maximum? No problem. You want to operate over here? Go ahead. This says you're going to pay for extra warehouse space. Everybody got that? But then there's also a flip side, which is over here. You will be subsidized for having extra. You can rent out."},{"start":2758.62,"text":"warehouse space you're not using and actually generate income right so it's it's really quite different everybody see this i just these are not this is just to kind of give you the idea of how all this is going to go together but these are these are the ideas they're very basic everybody got this okay so it's the idea and people would blabber about you know a market economy versus a planned economy and so on and so forth but you know this is kind of the idea oh also that strongly hints"},{"start":2786.91,"text":"these weights, these Lagrange multipliers, they're going to, in many cases, turn out to be prices. So that's what they're going to be. So now, and this gets very weird, but it's like this. You'd say, okay, let's take this Lagrangian, which is sort of an attempt to basically handle the constraints for a problem in the objective."},{"start":2813.26,"text":"But you're doing it in a weird price-directed way. You're just saying there's a price for each of these things, and you can violate them, blah, blah, blah. So it looks like that. Now, what we're going to do is we're going to define the dual function, and it's going to be a function of these Lagrange multipliers. They're also called dual variables."},{"start":2832.99,"text":"By the way, in many application areas, they have specific names in that application area. In many, they're called shadow prices. Or for example, in energy, they're called locational marginal prices. That's what they're called. So in a lot of fields, these things just have names. And so this thing is..."},{"start":2859.98,"text":"the least cost here over all your choices with these Lagrange multipliers, which we'll later see interpreted as prices. So you minimize that, and whatever the minimum is, that's called this dual function. You saw something like that. It was a conjugate function. If you remember that one interpretation of a conjugate function..."}],"speech_gaps":[],"frame":"../frames/v007/017.webp","frame_time":2715.98},{"title":"对偶函数的凹性与对偶问题的性质","segments":[{"id":133,"text":"One is you interpreted y as a vector of prices, and then the conjugate function was the optimal cost, the minimal cost as a function of the prices. I don't know if you remember that interpretation. This is exactly that. If you think of these as prices, which you will shortly, then basically the dual function is the optimal cost as a function of the prices. Right? Everybody? Okay.","zh":"一种可能是你将y解释为价格向量，然后共轭函数就是最优成本，即作为价格函数的最小成本。我不确定你是否记得这个解释。这正是如此。如果你将这些视为价格，很快你就会明白，那么对偶函数基本上就是作为价格函数的最优成本。对吧？大家明白吗？好的。","start":2881.63,"end":2908.53},{"id":134,"text":"The first is this. Okay, oh, the first one is not... This function g is concave. The dual function is concave, even when the original problem is not convex. It's just concave. Actually, somebody want to explain why? Why is g concave? The minimum of convex functions.","zh":"第一个是这个。好的，哦，第一个不是……这个函数g是凹的。对偶函数是凹的，即使原始问题不是凸的。它只是凹的。实际上，有人想解释一下为什么？为什么g是凹的？这是凸函数的最小值。","start":2909.65,"end":2940.8},{"id":135,"text":"Yeah, it's a minimum of affine functions which promote to convex. So if you look at the Lagrangian, it is an affine function of lambda and nu. If you consider lambda and nu the variables, it's an affine function. Now, it might be really complicated because that's for any particular value of x. It's an affine function. This says, just take the infimum or minimum over a family of affine functions. That's concave, period. So the first one is, this thing is concave.","zh":"是的，它是所有仿射函数的最小值，这会推广为凸函数。所以如果你看一下拉格朗日函数，它是lambda和nu的仿射函数。如果你将lambda和nu视为变量，它就是一个仿射函数。现在，它可能真的很复杂，因为这是针对任何特定的x值。它是一个仿射函数。这说明，只需对一组仿射函数取下确界或最小值。这本身就是凹的。因此，第一个是，这个东西是凹的。","start":2941.36,"end":2970.1},{"id":136,"text":"No matter what. Always. Just period. Okay? Second one is weird. And it looks very deep and all that kind of stuff. And you will soon see stunningly non-obvious consequences come out of it. But it just says this. It says, as long as the Lagrange multipliers associated with the inequality constraints are non-negative, then it says that g of lambda and nu is less than p star. Okay? So, why would that be?","zh":"无论怎样，总是如此。只是如此。好的？第二个看起来很奇怪。而且看起来非常深刻，各种各样的东西。你很快就会看到它会带来惊人且不明显的后果。但它只是说这个。它说，只要与不等式约束相关的拉格朗日乘子是非负的，那么g的lambda和nu就小于等于p星。好的？那么为什么会这样呢？","start":2970.56,"end":2999.94},{"id":137,"text":"Well, suppose x tilde is feasible. If x tilde is feasible, then fi of x tilde, these things are all non-positive, right? These are all zero. So if x tilde is feasible, then this term just goes away. The lambda i's, I'm going to assume, the prices are non-negative. The fi of x are less than or equal to zero because it's feasible, right? So this term...","zh":"假设x tilde是可行的。如果x tilde是可行的，那么fi of x tilde，这些值都是非正的，对吧？这些值都是零。所以如果x tilde是可行的，那么这一项就消失了。lambda i，我假设，价格是非负的。fi of x小于等于零，因为它是可行的，对吧？所以这一项……","start":3001.61,"end":3027.63},{"id":138,"text":"is less than or equal to zero. By the way, I'm using extremely deep mathematics here. Basically, the fact that the product of a non-negative number and a non-positive number is non-positive. And that when you sum non-positive numbers, you get something that's non-positive. Oh, and one more deep fact. If you take a number and you add a non-positive number to it, it's less than the original number. So I'm just saying, there's nothing deep yet. I will tell you when we get to the deep part. But this wasn't it.","zh":"小于或等于零。顺便说一句，我在这里使用了极其深奥的数学知识。基本上，非负数与非正数的乘积是非正的。而且当你把多个非正数相加时，结果也是非正的。哦，还有一个更深层的事实：如果你取一个数并加上一个非正数，结果会比原来的数小。所以我说，目前还没有什么深奥的内容。等我们到了真正深奥的部分，我会告诉你们。但这个并不是。","start":3028.01,"end":3057.06}],"notes":["本段讲解了对偶函数的凹性，即使原始问题不是凸的，对偶函数仍然是凹的。这是因为对偶函数是关于拉格朗日乘子的最小值，而最小值操作在凸函数上保持凹性。","接着，讲者指出对偶函数的凹性是由于拉格朗日函数是关于拉格朗日乘子的仿射函数，而对偶函数是这些仿射函数的最小值，因此是凹的。","随后，讲者提到对偶函数的值总是小于或等于原始问题的最优值，前提是拉格朗日乘子是非负的。这是因为当可行点存在时，约束条件的值为非正，乘以非负的拉格朗日乘子后结果为非正，从而保证了对偶函数的值小于或等于原始问题的最优值。","讲者还强调了这些结论背后的数学原理，包括非负数与非正数的乘积为非正数，以及非正数的和仍然是非正数，这些是基础的数学事实，但被用来推导更深层次的结论。","最后，讲者指出这些结论本身并不深奥，只是为后续更复杂的分析做铺垫，强调了对偶问题的基本性质和其在优化理论中的重要性。"],"formulas":[{"latex":"g(\\lambda, \\nu) = \\inf_{x} L(x, \\lambda, \\nu)","symbols":"g(λ, ν) 是拉格朗日函数 L(x, λ, ν) 关于 x 的下确界","explanation":"公式正确，符号和数学类型无误，符合上下文描述的对偶函数定义。","evidence":"Yeah, it's a minimum of affine functions which promote to convex. So if you look at the Lagrangian, it is an affine function of lambda and nu. If you consider lambda and nu the variables, it's an affine function. Now, it might be really complicated because that's for any particular value of x. It's an affine function. This says, just take the infimum or minimum over a family of affine functions. That's concave, period. So the first one is, this thing is concave."},{"latex":"L(x, \\lambda, \\nu) = f_0(x) + \\sum_{i=1}^m \\lambda_i f_i(x) + \\sum_{j=1}^p \\nu_j h_j(x)","symbols":"拉格朗日函数 L(x, λ, ν) 是目标函数和约束函数的加权和","explanation":"公式正确，符号和数学类型无误，符合上下文描述的拉格朗日函数定义。","evidence":"Yeah, it's a minimum of affine functions which promote to convex. So if you look at the Lagrangian, it is an affine function of lambda and nu. If you consider lambda and nu the variables, it's an affine function. Now, it might be really complicated because that's for any particular value of x. It's an affine function. This says, just take the infimum or minimum over a family of affine functions. That's concave, period. So the first one is, this thing is concave."},{"latex":"g(\\lambda, \\nu) \\leq p^*","symbols":"对偶函数的值小于或等于原始问题的最优值","explanation":"公式正确，符号和数学类型无误，符合上下文描述的对偶函数性质。","evidence":"No matter what. Always. Just period. Okay? Second one is weird. And it looks very deep and all that kind of stuff. And you will soon see stunningly non-obvious consequences come out of it. But it just says this. It says, as long as the Lagrange multipliers associated with the inequality constraints are non-negative, then it says that g of lambda and nu is less than p star. Okay? So, why would that be?"}],"uncertainties":[],"diagram":"none","start":2881.63,"end":3057.06,"asr_flags":[],"math_clarifications":["所有公式均符合数学规范，无需额外修复。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2881.63,"text":"One is you interpreted y as a vector of prices, and then the conjugate function was the optimal cost, the minimal cost as a function of the prices. I don't know if you remember that interpretation. This is exactly that. If you think of these as prices, which you will shortly, then basically the dual function is the optimal cost as a function of the prices. Right? Everybody? Okay."},{"start":2909.65,"text":"Now, we're going to make some extremely simple observations, right? The first is this. Okay, oh, the first one is not... This function g is concave. The dual function is concave, even when the original problem is not convex. It's just concave. Actually, somebody want to explain why? Why is g concave? The minimum of convex functions."},{"start":2941.36,"text":"Yeah, it's a minimum of affine functions which promote to convex. So if you look at the Lagrangian, it is an affine function of lambda and nu. If you consider lambda and nu the variables, it's an affine function. Now, it might be really complicated because that's for any particular value of x. It's an affine function. This says, just take the infimum or minimum over a family of affine functions. That's concave, period. So the first one is, this thing is concave."},{"start":2970.56,"text":"No matter what. Always. Just period. Okay? Second one is weird. And it looks very deep and all that kind of stuff. And you will soon see stunningly non-obvious consequences come out of it. But it just says this. It says, as long as the Lagrange multipliers associated with the inequality constraints are non-negative, then it says that g of lambda and nu is less than p star. Okay? So, why would that be?"},{"start":3001.61,"text":"Well, suppose x tilde is feasible. If x tilde is feasible, then fi of x tilde, these things are all non-positive, right? These are all zero. So if x tilde is feasible, then this term just goes away. The lambda i's, I'm going to assume, the prices are non-negative. The fi of x are less than or equal to zero because it's feasible, right? So this term..."},{"start":3028.01,"text":"is less than or equal to zero. By the way, I'm using extremely deep mathematics here. Basically, the fact that the product of a non-negative number and a non-positive number is non-positive. And that when you sum non-positive numbers, you get something that's non-positive. Oh, and one more deep fact. If you take a number and you add a non-positive number to it, it's less than the original number. So I'm just saying, there's nothing deep yet. I will tell you when we get to the deep part. But this wasn't it."}],"speech_gaps":[],"frame":"../frames/v007/018.webp","frame_time":2893.63},{"title":"拉格朗日对偶性与约束条件的解释","segments":[{"id":139,"text":"Okay, and that says that if you had any feasible, if X tilde is feasible, then the Lagrangian is less than or equal to F zero of X, the objective, right? Now, therefore, if you minimize over that, you're going to get something that's a lower bound. So you get G of lambda and nu is actually a lower bound on the optimal value of your problem. Okay, so everybody got that? Again, it's not, yeah?","zh":"好的，这说明如果X tilde是可行的，那么拉格朗日函数将小于或等于F零的X，也就是目标函数，对吧？因此，如果你在这个基础上进行最小化，你将得到一个下界。所以，G的lambda和nu实际上是问题最优值的一个下界。好的，大家明白了吗？再次强调，是的？","start":3058.53,"end":3087.43},{"id":140,"text":"This property holds for mu, right, as well as lambda? I missed that. What was that? This property also holds for mu in addition to lambda, right? There's nothing special about lambda in this case? No, no, no. What's required is that the Lagrange multipliers associated with the inequality constraints have to be non-negative. By the way, it makes perfect sense over here, right? Because while this is not a good approximation here, I mean, it's not a good approximation, right?","zh":"这个性质也适用于mu，对吧？我刚才漏说了。刚才说的是什么？这个性质同样适用于mu，而不仅仅是lambda，对吧？在这种情况下，lambda并没有什么特别之处？不，不，不。所要求的是与不等式约束相关的拉格朗日乘子必须是非负的。顺便说一句，这里完全合乎逻辑，对吧？因为虽然这不是一个很好的近似，我的意思是，它并不是一个很好的近似，对吧？","start":3088.4,"end":3117.04},{"id":141,"text":"But what if someone came up to you and said, oh yeah, I can handle that for you. Yeah, your warehouse space? Yeah, I'm going to approximate this function by that. Now, that's weird, because what this says is...","zh":"但如果有人走到你面前说，哦，我来帮你处理这个问题。是的，你的仓库空间？是的，我要用这个函数来近似这个函数。现在，这很奇怪，因为这说明……","start":3117.5,"end":3131.68},{"id":142,"text":"This basically says, in fact, I'll pay you more and more to violate your warehouse space limit. That's what it says. Oh, and by the way, if you actually satisfy the constraint, I'm going to start charging you. I mean, so the other one was merely a bad approximation. This one is appallingly stupid. Okay, so I'm just saying if you wanted a quick interpretation of why lambda has to be bigger than or equal to zero here, is that this doesn't even make sense.","zh":"这实际上意味着，我会越来越多地支付你来违反你的仓库空间限制。这就是它所说的。顺便说一句，如果你实际上满足了约束条件，我就会开始向你收费。我的意思是，另一个只是单纯的糟糕近似，而这个则是令人难以置信的愚蠢。好的，我只是说，如果你想快速理解为什么lambda必须大于或等于零，那就是这个根本就说不通。","start":3132.01,"end":3156.97},{"id":143,"text":"Actually, if you think about it, it's a scalarization with a negative number in there or something like that. Sorry, I didn't mean that lambda can be less than zero. It's also the case that if nu is greater than or equal to zero, then g of lambda nu is less or equal to zero. That's true, but in fact, it's a stronger statement. There are no conditions on nu whatsoever. It could be negative, it could be positive, it doesn't matter.","zh":"实际上，如果你仔细想想，这其实是一种带有负数的标量化的操作，或者类似的东西。抱歉，我不是说lambda可以小于零。同样，如果nu大于或等于零，那么g的lambda nu将小于或等于零。这是正确的，但事实上，这是一个更强的陈述。对nu没有任何条件。它可以是负数，也可以是正数，这都无所谓。","start":3157.89,"end":3185.22},{"id":144,"text":"What you said is the strength, and you said, yeah, but if nu is non-negative, and you go, well, yeah, I agree. And we'll see a lot of times, we'll get to it. It'll be interesting when nu, so the point is, there's no constraint on nu. Nu could be negative or positive. Right? Yeah? Is there a similar intuition behind nu, like in terms of, yeah, because I feel like it's all the same. Yeah, yeah. I will show you what it is. Okay? Yeah. What's the interpretation for this? So let's do,","zh":"你说的是对的，你说，是的，但是如果nu是非负的，那么，嗯，是的，我同意。我们会经常遇到这种情况，到时候会很有趣。nu的点在于，它没有约束。nu可以是负数或正数。对吧？是的？关于nu是否有类似的直觉，比如在某种程度上，我觉得它们都是一样的。是的，是的。我会告诉你它是什么。好吗？是的。这个的解释是什么？那么，我们来谈谈，","start":3185.78,"end":3214.29}],"notes":["本段主要讲解了拉格朗日对偶性中的一个重要性质，即拉格朗日乘子必须满足非负条件。这是因为在处理不等式约束时，拉格朗日乘子代表了对约束的惩罚力度，因此必须非负。同时，讲者还通过一个仓库空间限制的例子，说明了拉格朗日乘子的非负性如何影响对偶问题的构建。","讲者提到，虽然拉格朗日乘子λ和μ都具有类似的性质，但λ对应的是不等式约束，而μ可能对应于等式约束。对于不等式约束，拉格朗日乘子必须非负，而μ则没有这样的限制。这表明，不同类型的约束对拉格朗日乘子的性质有不同的要求。","讲者通过一个直观的例子，说明了拉格朗日乘子λ的非负性如何影响对偶问题的构建。如果λ为负数，那么对偶问题的构建将失去意义，因为这相当于允许违反约束条件而获得收益，这在实际中是不合理的。","讲者还提到，对于ν（可能对应于等式约束的拉格朗日乘子），没有非负性的限制，它可以是正数或负数。这表明，不同类型的约束对拉格朗日乘子的性质有不同的要求，而ν的取值范围更广。","讲者通过对比两种不同的拉格朗日乘子（λ和ν）的性质，强调了在构建对偶问题时，必须根据约束类型来确定拉格朗日乘子的性质。这有助于理解对偶问题的结构和求解方法。","最后，讲者提到，虽然ν的取值范围更广，但其背后的直观解释可能与λ类似，但需要进一步的分析和解释。这表明，对偶问题的构建和求解需要对不同类型的约束进行细致的分析。"],"formulas":[],"uncertainties":["nu is greater than or equal to zero"],"diagram":"none","start":3058.53,"end":3214.29,"asr_flags":[],"math_clarifications":["原始片段中没有明确的数学公式，仅包含口头描述。因此，无法核对数学公式是否正确，所有公式均被移除。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3058.53,"text":"Okay, and that says that if you had any feasible, if X tilde is feasible, then the Lagrangian is less than or equal to F zero of X, the objective, right? Now, therefore, if you minimize over that, you're going to get something that's a lower bound. So you get G of lambda and nu is actually a lower bound on the optimal value of your problem. Okay, so everybody got that? Again, it's not, yeah?"},{"start":3088.4,"text":"This property holds for mu, right, as well as lambda? I missed that. What was that? This property also holds for mu in addition to lambda, right? There's nothing special about lambda in this case? No, no, no. What's required is that the Lagrange multipliers associated with the inequality constraints have to be non-negative. By the way, it makes perfect sense over here, right? Because while this is not a good approximation here, I mean, it's not a good approximation, right?"},{"start":3117.5,"text":"But what if someone came up to you and said, oh yeah, I can handle that for you. Yeah, your warehouse space? Yeah, I'm going to approximate this function by that. Now, that's weird, because what this says is..."},{"start":3132.01,"text":"This basically says, in fact, I'll pay you more and more to violate your warehouse space limit. That's what it says. Oh, and by the way, if you actually satisfy the constraint, I'm going to start charging you. I mean, so the other one was merely a bad approximation. This one is appallingly stupid. Okay, so I'm just saying if you wanted a quick interpretation of why lambda has to be bigger than or equal to zero here, is that this doesn't even make sense."},{"start":3157.89,"text":"Actually, if you think about it, it's a scalarization with a negative number in there or something like that. Sorry, I didn't mean that lambda can be less than zero. It's also the case that if nu is greater than or equal to zero, then g of lambda nu is less or equal to zero. That's true, but in fact, it's a stronger statement. There are no conditions on nu whatsoever. It could be negative, it could be positive, it doesn't matter."},{"start":3185.78,"text":"What you said is the strength, and you said, yeah, but if nu is non-negative, and you go, well, yeah, I agree. And we'll see a lot of times, we'll get to it. It'll be interesting when nu, so the point is, there's no constraint on nu. Nu could be negative or positive. Right? Yeah? Is there a similar intuition behind nu, like in terms of, yeah, because I feel like it's all the same. Yeah, yeah. I will show you what it is. Okay? Yeah. What's the interpretation for this? So let's do,"}],"speech_gaps":[],"frame":"../frames/v007/019.webp","frame_time":3070.53},{"title":"凸优化中的近似方法与约束处理","segments":[{"id":145,"text":"What are the names of their H? Is H the name? Yeah, so let's do this. Okay, so it looks like that. This is now going to be H1, right? And now I'm going to draw the true objective. So the true objective is this. If H1 is 0, it's cool. You're satisfying your equality constraint, and you get a 0. Outside that, it's out here.","zh":"他们的H叫什么名字？H是名字吗？是的，那我们这样做吧。好的，看起来就是这样。现在这将是H1，对吧？现在我要画出真实的优化目标。所以真实的优化目标就是这个。如果H1是0，那就很好。你满足了等式约束，得到0。在那之外，它就在这里。","start":3215.95,"end":3244.22},{"id":146,"text":"This is plus infinity. Everybody agree? So it's a function that kind of looks like super big, goes down to zero if you're zero, and then goes back up again. Right? Okay. Now, what this says is I'm going to approximate that with a linear function.","zh":"这是正无穷大。大家同意吗？所以这是一个看起来非常大的函数，如果你是0，它会降到0，然后又回升。对吧？好的。现在，这句话的意思是我要用一个线性函数来近似这个函数。","start":3244.94,"end":3260.03},{"id":147,"text":"I mean, it's appallingly bad approximation, but it's saying something like this, right?","zh":"我的意思是，这是一个糟糕的近似，但它在说类似这样的话，对吧？","start":3260.64,"end":3265.28},{"id":148,"text":"So, that's a bad approximation, but this, so is that one, and they're all kind of, they're all a little bit, they're similar, right?","zh":"所以，这是一个糟糕的近似，但那个也是，它们都差不多，都有一点点相似，对吧？","start":3265.38,"end":3272.44},{"id":149,"text":"So, anyway, that's, this is the picture for that.","zh":"总之，这就是这个情况的图示。","start":3272.5,"end":3274.84},{"id":150,"text":"Does that make sense?","zh":"这有意义吗？","start":3275.88,"end":3276.62},{"id":151,"text":"Yeah, but it still kind of says that, like, we can just, like, increase it in some direction to, like, make it smaller and smaller, right?","zh":"是的，但它仍然在说，我们可以像这样，在某个方向上增加它，使其越来越小，对吧？","start":3277.0,"end":3283.72},{"id":152,"text":"We'll get to that.","zh":"我们会讲到这一点。","start":3283.88,"end":3284.94},{"id":153,"text":"actually my point about this approximation is that when I explain it","zh":"实际上，我想说的是，当我这样解释这个近似方法时","start":3284.94,"end":3289.18},{"id":154,"text":"this way it doesn't look like a good approach it doesn't look like a story","zh":"它看起来并不是一个好方法，它看起来不是一个好故事","start":3289.18,"end":3293.4},{"id":155,"text":"that starts this when someone walks up to you and says yeah no problem I have","zh":"当有人走过来对你说，没问题，我有","start":3293.4,"end":3296.92},{"id":156,"text":"this thing that looks like this or this even worse this thing that looks like","zh":"这个看起来像这样的东西，甚至更糟糕，这个看起来像","start":3296.92,"end":3299.58},{"id":157,"text":"this jumps down to zero I go I'm gonna approximate it with a line a normal","zh":"这个突然跳到零，我会说，我要用一条直线来近似它，一个正常","start":3299.58,"end":3304.54},{"id":158,"text":"person would say dude that's a terrible approximation like that story is not","zh":"人会说，伙计，这真是一个糟糕的近似，这个故事不会","start":3304.54,"end":3308.42},{"id":159,"text":"going to end well right everybody that that's my that's I mean if someone told","zh":"有一个好的结局，对吧？这就是我的意思，我是说，如果有人告诉","start":3308.42,"end":3313.0},{"id":160,"text":"me that it'd be ridiculous right but obviously the story is going to end well or i wouldn't be","zh":"我这个，那听起来很荒谬，对吧？但显然这个故事会有一个好的结局，否则我就不","start":3313.0,"end":3317.92},{"id":161,"text":"telling it to you right but the point is it's shocking right when someone first says what it","zh":"告诉你的时候就是对的，但重点是，当有人第一次说的时候，这真的很令人震惊，对吧？","start":3317.92,"end":3322.72},{"id":162,"text":"is right so that's i guess that's my my so i haven't said it's obvious in fact to me right","zh":"所以，这大概就是我的意思，我猜我还没有说这是显而易见的，对吧？","start":3322.72,"end":3328.46},{"id":163,"text":"now the intuition should be this is this is ridiculous it's completely ridiculous how could","zh":"现在直觉应该是这样的，这简直是荒谬的，完全荒谬，怎么可能会有好的结果来自于这么糟糕的近似呢，对吧？我意思是，至少在lambda的情况下，","start":3328.46,"end":3334.42},{"id":164,"text":"anything good come of such a crappy approximation right i mean like at least with lambda we","zh":"我们说它必须是正的","start":3334.42,"end":3339.2},{"id":165,"text":"like we say it has to be positive","zh":"所以它总是像一个额外的成本","start":3339.2,"end":3341.4},{"id":166,"text":"so it's always like an additional cost","zh":"而这正是让它变得不太直观的原因","start":3341.4,"end":3343.12},{"id":167,"text":"and that's what makes it like less intuitive","zh":"到这个时候","start":3343.12,"end":3345.72},{"id":168,"text":"at this point","zh":"在这个时候","start":3345.72,"end":3346.4},{"id":169,"text":"I'm saying this is a bad","zh":"我说这主意很糟糕","start":3346.4,"end":3350.44},{"id":170,"text":"this looks, when I describe it this way","zh":"当我这样描述它时，看起来很糟糕","start":3350.44,"end":3352.04},{"id":171,"text":"it sounds like a really bad idea","zh":"听起来像是一个非常糟糕的主意","start":3352.04,"end":3353.78},{"id":172,"text":"okay, I totally admit that","zh":"好的，我完全承认这一点","start":3353.78,"end":3356.36},{"id":173,"text":"right, so","zh":"对，所以","start":3356.9,"end":3357.76},{"id":174,"text":"okay, fine","zh":"好的，好吧","start":3357.76,"end":3359.82},{"id":175,"text":"let's look at some examples to see how this works","zh":"让我们看一些例子，看看它是如何运作的","start":3359.82,"end":3362.2},{"id":176,"text":"yeah","zh":"是的","start":3362.2,"end":3362.64},{"id":177,"text":"the x bar","zh":"x 的平均值","start":3362.64,"end":3365.62},{"id":178,"text":"x tilde","zh":"x̃，即上方带波浪号的 x。","start":3366.4,"end":3367.44},{"id":179,"text":"Oh, this just says, suppose X tilde is anything that's feasible for the original problem, right?","zh":"哦，这仅仅表示，假设X tilde是原问题的任何可行解，对吧？","start":3367.44,"end":3373.9},{"id":180,"text":"Right, right.","zh":"对，对。","start":3373.98,"end":3375.2},{"id":181,"text":"Then what we're doing is showing that the objective for X tilde is bigger than that, right?","zh":"那么我们所做的就是展示，对于X tilde的目标函数值比那个更大，对吧？","start":3375.4,"end":3384.04},{"id":182,"text":"But X tilde was anything.","zh":"但X tilde可以是任何东西。","start":3384.08,"end":3385.84},{"id":183,"text":"So if you pick, for example, an optimal point for the original problem, this would be P star, and that would be G.","zh":"例如，如果你选择原问题的一个最优解，这将是P star，而这就是G。","start":3386.02,"end":3391.44},{"id":184,"text":"And that would be this constraint here.","zh":"而这将是这里的这个约束。","start":3391.62,"end":3393.5},{"id":185,"text":"Sorry, inequality, right?","zh":"抱歉，是不等式，对吧？","start":3393.84,"end":3395.54}],"notes":["本段主要讨论了凸优化中使用线性近似方法的直观感受。教授指出，虽然这种近似看起来非常糟糕，但其背后可能有合理的解释。他通过一个例子说明，当目标函数在某个点附近为零时，使用线性近似可能是一个有效的策略，尽管在直觉上可能难以接受。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3215.95,"end":3395.54,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":41,"raw_segments":[{"start":3215.95,"text":"What are the names of their H? Is H the name? Yeah, so let's do this. Okay, so it looks like that. This is now going to be H1, right? And now I'm going to draw the true objective. So the true objective is this. If H1 is 0, it's cool. You're satisfying your equality constraint, and you get a 0. Outside that, it's out here."},{"start":3244.94,"text":"This is plus infinity. Everybody agree? So it's a function that kind of looks like super big, goes down to zero if you're zero, and then goes back up again. Right? Okay. Now, what this says is I'm going to approximate that with a linear function."},{"start":3260.64,"text":"I mean, it's appallingly bad approximation, but it's saying something like this, right?"},{"start":3265.38,"text":"So, that's a bad approximation, but this, so is that one, and they're all kind of, they're all a little bit, they're similar, right?"},{"start":3272.5,"text":"So, anyway, that's, this is the picture for that."},{"start":3275.88,"text":"Does that make sense?"},{"start":3277.0,"text":"Yeah, but it still kind of says that, like, we can just, like, increase it in some direction to, like, make it smaller and smaller, right?"},{"start":3283.88,"text":"We'll get to that."},{"start":3284.94,"text":"actually my point about this approximation is that when I explain it"},{"start":3289.18,"text":"this way it doesn't look like a good approach it doesn't look like a story"},{"start":3293.4,"text":"that starts this when someone walks up to you and says yeah no problem I have"},{"start":3296.92,"text":"this thing that looks like this or this even worse this thing that looks like"},{"start":3299.58,"text":"this jumps down to zero I go I'm gonna approximate it with a line a normal"},{"start":3304.54,"text":"person would say dude that's a terrible approximation like that story is not"},{"start":3308.42,"text":"going to end well right everybody that that's my that's I mean if someone told"},{"start":3313.0,"text":"me that it'd be ridiculous right but obviously the story is going to end well or i wouldn't be"},{"start":3317.92,"text":"telling it to you right but the point is it's shocking right when someone first says what it"},{"start":3322.72,"text":"is right so that's i guess that's my my so i haven't said it's obvious in fact to me right"},{"start":3328.46,"text":"now the intuition should be this is this is ridiculous it's completely ridiculous how could"},{"start":3334.42,"text":"anything good come of such a crappy approximation right i mean like at least with lambda we"},{"start":3339.2,"text":"like we say it has to be positive"},{"start":3341.4,"text":"so it's always like an additional cost"},{"start":3343.12,"text":"and that's what makes it like less intuitive"},{"start":3345.72,"text":"at this point"},{"start":3346.4,"text":"I'm saying this is a bad"},{"start":3350.44,"text":"this looks, when I describe it this way"},{"start":3352.04,"text":"it sounds like a really bad idea"},{"start":3353.78,"text":"okay, I totally admit that"},{"start":3356.9,"text":"right, so"},{"start":3357.76,"text":"okay, fine"},{"start":3359.82,"text":"let's look at some examples to see how this works"},{"start":3362.2,"text":"yeah"},{"start":3362.64,"text":"the x bar"},{"start":3366.4,"text":"x tilde"},{"start":3367.44,"text":"Oh, this just says, suppose X tilde is anything that's feasible for the original problem, right?"},{"start":3373.98,"text":"Right, right."},{"start":3375.4,"text":"Then what we're doing is showing that the objective for X tilde is bigger than that, right?"},{"start":3384.08,"text":"But X tilde was anything."},{"start":3386.02,"text":"So if you pick, for example, an optimal point for the original problem, this would be P star, and that would be G."},{"start":3391.
