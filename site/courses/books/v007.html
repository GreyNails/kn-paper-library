re you would get this thing. And again, I'm not going over the details. I would let you do that, but you'd get something like that. So the dual function is this linear function B transpose nu provided A transpose nu in the dual norm is less than one, right? So that's what you get. Then it says this. You want to solve this problem?"},{"start":4175.8,"text":"Then here's a lower bound. It says a lower bound is B transpose nu for any nu that satisfies this, right? In the dual norm, right? So let's suppose this is a minimum fuel trajectory generation problem, and you want to take a satellite from where it is to where it is supposed to be, and you want to use minimum fuel. This would probably be something like an L1 norm, okay? That's your job. You work this out, and what's cool is this says,"},{"start":4205.51,"text":"I can give, if I take any vector at all and it satisfies this, then if I evaluate B transpose nu, that's a lower bound on the minimum amount of fuel it's going to take you to get from where you are to where you're supposed to be. Everybody got this? This is already getting kind of interesting. And there should be at least very strong hints that a lot of this is unbelievably useful. So, everybody?"}],"speech_gaps":[{"start":4096.368,"end":4098.0}],"frame":"../frames/v007/025.webp","frame_time":4088.18},{"title":"二元划分问题与二次形式","segments":[{"id":238,"text":"So this is not obvious, right? These things are not obvious. I could give just a simple proof directly that this is a lower bound and so on. Now it's about to get even more interesting because we're going to look at a problem. Well, it'll come up again. So it's two-way partitioning. So this is the two-way partitioning problem. I have a set of n objects, and I want to partition them."},{"id":239,"text":"into two groups, right? And the way I'll do that is I'll encode it with a vector x that has plus one. If xi equals plus one means, you know, item i is in the first group. xi equals minus one if you're in the second group. Everybody got it? So that's what this says. That says that each x is either plus or minus one."},{"id":240,"text":"And then my objective is this thing. And to get a rough idea, we should actually say what X transpose WX is. Because it's an interesting problem, and maybe you've seen it in some other class or something like that. But it's worth saying what it is. Is it X transpose WX? Yeah. Okay, so it's X transpose WX, but that's equal to this. It's the sum over I and J of WIJ."},{"id":241,"text":"xi, xj. I mean, so we all agree with that. That's a quadratic form. Now, xi and xj are each plus or minus one. So this product is plus one if items i and j are in the same group, and it's minus one if they're in different groups, right? And so this is equal to the sum of the w's when they're in the same group minus the sum of w's when they're in different groups."},{"id":242,"text":"Right? That's what this says. And so you should interpret, what are we doing? Are we maximizing or minimizing? We are minimizing. So if we're minimizing this, it basically says w i is the cost of having, let's say you're doing, we're going to split a group of people into two groups, right? So this says if w i j is the cost of having person i and person j in the same team, if we're making two teams. Everybody?"},{"id":243,"text":"Got this? So if W, I, J is positive, it means they don't like each other. If it's negative, that's totally cool. It means there's a strong affinity and we would like them to be in the same group. Everybody got it? And the same is true for, basically, you have an equal and opposite charge. So if you say, if W, I, J is plus 3, it means you will pay 3 if you assign I and J to the same group. And you will have a revenue or income of 3."}],"notes":["本段讲解了二元划分问题，即如何将一组对象分成两个子集。通过引入一个向量x，其中每个元素为+1或-1，表示对象属于哪个子集。这为后续的优化问题奠定了基础。","讲者提到目标函数X^T W X，这是一个二次形式，用于衡量对象在相同或不同子集时的代价。具体来说，当两个对象在同一个子集时，其乘积为+1，否则为-1，从而影响总代价。","讲者进一步解释了目标函数的含义：如果W_ij为正，表示两个对象之间有冲突，需要付出代价；如果为负，则表示有亲和力，希望它们在同一个子集。这种解释帮助理解如何通过优化来划分对象。","讲者强调了问题的最小化目标，即通过最小化总代价来实现最优划分。这与实际应用中的场景（如团队划分）相呼应，展示了理论与实际的联系。","讲者通过具体的数值例子（如W_ij为+3）来说明代价和收益的计算方式，帮助听众更直观地理解目标函数的结构。","本段内容为后续的凸优化问题提供了背景，特别是如何将实际问题转化为数学形式，并通过优化方法求解。"],"formulas":[{"latex":"X^T W X","symbols":"X^T W X 表示目标函数，其中X是划分向量，W是权重矩阵。","explanation":"公式正确，表示目标函数，X是划分向量，W是权重矩阵。","evidence":"And then my objective is this thing. And to get a rough idea, we should actually say what X transpose WX is. Because it's an interesting problem, and maybe you've seen it in some other class or something like that. But it's worth saying what it is. Is it X transpose WX? Yeah. Okay, so it's X transpose WX, but that's equal to this. It's the sum over I and J of WIJ."}],"uncertainties":[],"diagram":"none","start":4232.16,"end":4399.42,"asr_flags":[],"math_clarifications":["公式正确，无需修改。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4232.16,"text":"So this is not obvious, right? These things are not obvious. I could give just a simple proof directly that this is a lower bound and so on. Now it's about to get even more interesting because we're going to look at a problem. Well, it'll come up again. So it's two-way partitioning. So this is the two-way partitioning problem. I have a set of n objects, and I want to partition them."},{"start":4263.95,"text":"into two groups, right? And the way I'll do that is I'll encode it with a vector x that has plus one. If xi equals plus one means, you know, item i is in the first group. xi equals minus one if you're in the second group. Everybody got it? So that's what this says. That says that each x is either plus or minus one."},{"start":4287.04,"text":"And then my objective is this thing. And to get a rough idea, we should actually say what X transpose WX is. Because it's an interesting problem, and maybe you've seen it in some other class or something like that. But it's worth saying what it is. Is it X transpose WX? Yeah. Okay, so it's X transpose WX, but that's equal to this. It's the sum over I and J of WIJ."},{"start":4316.86,"text":"xi, xj. I mean, so we all agree with that. That's a quadratic form. Now, xi and xj are each plus or minus one. So this product is plus one if items i and j are in the same group, and it's minus one if they're in different groups, right? And so this is equal to the sum of the w's when they're in the same group minus the sum of w's when they're in different groups."},{"start":4344.01,"text":"Right? That's what this says. And so you should interpret, what are we doing? Are we maximizing or minimizing? We are minimizing. So if we're minimizing this, it basically says w i is the cost of having, let's say you're doing, we're going to split a group of people into two groups, right? So this says if w i j is the cost of having person i and person j in the same team, if we're making two teams. Everybody?"},{"start":4370.14,"text":"Got this? So if W, I, J is positive, it means they don't like each other. If it's negative, that's totally cool. It means there's a strong affinity and we would like them to be in the same group. Everybody got it? And the same is true for, basically, you have an equal and opposite charge. So if you say, if W, I, J is plus 3, it means you will pay 3 if you assign I and J to the same group. And you will have a revenue or income of 3."}],"speech_gaps":[],"frame":"../frames/v007/026.webp","frame_time":4244.16},{"title":"对偶函数的性质与二次形式最小化","segments":[{"id":244,"text":"Because it'll become minus 3. And if it's minus 3, it's the other way around. So the w's specify how much it irritates us to have items in the same group or different groups. So this is the problem. So let's look at the dual function. Oh, it's obviously non-convex for two reasons. w need not be positive semi-definite. We didn't say that it was."},{"id":245,"text":"Reason two is we got a big old fail right there, right? Because we have squares equal to one, right? By the way, if I take xi squared less than or equal to one, that's convex if w is positive semi-definite, right? So, but okay. So we take this, the dual function is we take the objective, right? Plus, and then I just simply add up new i times these xi squared minus one. And what I end up with is a quadratic."},{"id":246,"text":"function of a quadratic form in x plus a constant. And now we're going to have our quadratic form minimization. Earlier today we had our how do you minimize an affine function conversation. Now we're going to have a quadratic form minimization conversation. So if you minimize a quadratic form, what do you get?"},{"id":247,"text":"Someone walks up in the street and says, here's my X transpose, you know, whatever, not W, but X transpose, you know, AX. A is symmetric. What's the minimum of that? Well, if that matrix has a negative, it's got real eigenvalue, it's symmetric, right? If that matrix has a negative eigenvalue, that minimum is for sure minus infinity. Because you sail out along that, find a negative eigenvalue. For that matter, just find a point where the quadratic form is negative, right?"},{"id":248,"text":"If you just go out farther and farther, it'll get more and more negative. In fact, quadratically so. So then the minimum is minus infinity. Everybody got it? But if that matrix is positive semi-definite, and I ask what's the minimum, the answer's real simple. It's zero. Because you could take zero as your x equals zero, but because it's positive semi-definite, it can't be anything less than that, so that's it, right? Everybody follow that? So g is this function. It's minus one transpose nu."},{"id":249,"text":"provided w plus diag of nu is bigger than or equal to zero. That's in a symmetric matrix sense, right? Okay. And the lower bound property says, you see this problem here? You know what? Here's a bound on its objective. That's a lower bound on its objective. It's minus one transpose nu, for any nu you can find that satisfies this. Okay? So that's what that says, right?"}],"notes":["本段讨论了对偶函数的非凸性，指出其非凸性的两个原因：一是w不一定是半正定矩阵，二是约束条件中存在平方等于1的项。当w是半正定时，xi平方小于等于1是凸的，但整体问题仍可能非凸。","接着，讲者解释了对偶函数的结构，指出其为一个二次形式加上常数项，并强调了二次形式最小化的问题。这与之前讨论的仿射函数最小化形成对比。","在讨论二次形式最小化时，讲者通过一个例子说明，如果矩阵有负特征值，则二次形式的最小值为负无穷；如果矩阵是半正定的，则最小值为零。这是基于矩阵的特征值性质。","最后，讲者提到对偶函数g的形式为负的1转置乘以nu，并指出该函数在满足w加上diag(nu)大于等于零的条件下成立。这说明了对偶函数的约束条件。","讲者还强调了下界性质，即对于原问题的最优值，对偶函数提供了下界。这一性质是凸优化中的重要概念，有助于理解对偶问题与原问题之间的关系。","整个段落围绕对偶函数的性质展开，包括其非凸性、结构、最小化问题以及下界性质，这些都是凸优化中的核心内容。"],"formulas":[{"latex":"x^T A x","symbols":"二次形式","explanation":"该公式表示一个向量x与对称矩阵A的二次形式，符合数学定义。","evidence":"Someone walks up in the street and says, here's my X transpose, you know, whatever, not W, but X transpose, you know, AX. A is symmetric. What's the minimum of that? Well, if that matrix has a negative, it's got real eigenvalue, it's symmetric, right? If that matrix has a negative eigenvalue, that minimum is for sure minus infinity. Because you sail out along that, find a negative eigenvalue. For that matter, just find a point where the quadratic form is negative, right?"},{"latex":"g(x) = -1^T \\nu","symbols":"对偶函数","explanation":"该公式表示对偶函数g(x)，其中1^T表示行向量，ν为满足条件的向量。","evidence":"provided w plus diag of nu is bigger than or equal to zero. That's in a symmetric matrix sense, right? Okay. And the lower bound property says, you see this problem here? You know what? Here's a bound on its objective. That's a lower bound on its objective. It's minus one transpose nu, for any nu you can find that satisfies this. Okay? So that's what that says, right?"}],"uncertainties":[],"diagram":"none","start":4400.23,"end":4576.7,"asr_flags":[],"math_clarifications":["公式1的最小值未在原始文本中明确说明，且未提供足够的数学条件或推导过程，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4400.23,"text":"Because it'll become minus 3. And if it's minus 3, it's the other way around. So the w's specify how much it irritates us to have items in the same group or different groups. So this is the problem. So let's look at the dual function. Oh, it's obviously non-convex for two reasons. w need not be positive semi-definite. We didn't say that it was."},{"start":4430.65,"text":"Reason two is we got a big old fail right there, right? Because we have squares equal to one, right? By the way, if I take xi squared less than or equal to one, that's convex if w is positive semi-definite, right? So, but okay. So we take this, the dual function is we take the objective, right? Plus, and then I just simply add up new i times these xi squared minus one. And what I end up with is a quadratic."},{"start":4459.92,"text":"function of a quadratic form in x plus a constant. And now we're going to have our quadratic form minimization. Earlier today we had our how do you minimize an affine function conversation. Now we're going to have a quadratic form minimization conversation. So if you minimize a quadratic form, what do you get?"},{"start":4483.28,"text":"Someone walks up in the street and says, here's my X transpose, you know, whatever, not W, but X transpose, you know, AX. A is symmetric. What's the minimum of that? Well, if that matrix has a negative, it's got real eigenvalue, it's symmetric, right? If that matrix has a negative eigenvalue, that minimum is for sure minus infinity. Because you sail out along that, find a negative eigenvalue. For that matter, just find a point where the quadratic form is negative, right?"},{"start":4517.34,"text":"If you just go out farther and farther, it'll get more and more negative. In fact, quadratically so. So then the minimum is minus infinity. Everybody got it? But if that matrix is positive semi-definite, and I ask what's the minimum, the answer's real simple. It's zero. Because you could take zero as your x equals zero, but because it's positive semi-definite, it can't be anything less than that, so that's it, right? Everybody follow that? So g is this function. It's minus one transpose nu."},{"start":4546.98,"text":"provided w plus diag of nu is bigger than or equal to zero. That's in a symmetric matrix sense, right? Okay. And the lower bound property says, you see this problem here? You know what? Here's a bound on its objective. That's a lower bound on its objective. It's minus one transpose nu, for any nu you can find that satisfies this. Okay? So that's what that says, right?"}],"speech_gaps":[],"frame":"../frames/v007/027.webp","frame_time":4412.23},{"title":"凸优化中的松弛与谱划分","segments":[{"id":250,"text":"Um, and it turns out you can get all sorts of famous bounds out of this by just plugging numbers in. Um, so, but that's, that's the idea. And this is related to, um, spectral partitioning. Um, how many people have seen that? Oh, one hand, just a hand. Ooh, I'm sorry. Everybody needs to know about spectral partitioning, right? You're not going to be able to do any kind of like any serious street fighting applied math if you don't know about that."},{"id":251,"text":"Right? Because partitioning problems come up all the time, and you need to know about it. I'll just show you quickly what it is here, just for fun. I won't go into the details, but it's actually, weirdly, another... Let me just explain it very quickly. So, you... And I won't go into the... I'll give a very simple version of it. Right? So..."},{"id":252,"text":"You have this thing, and then subject, then we have, we're going to minimize this thing, subject to xi squared equals one. That's not convex, right? But if this is true, if xi squared is one, then everyone here would have to, I would hope, agree that that's the case, right? Now, by the way, this is a relaxation, right? Because if the former constraint holds, then this one has to."},{"id":253,"text":"Okay, W is symmetric. Anybody take a look at that? You know how to solve that problem? First of all, is it convex? Is that convex? No. Because of this, right? If that was less than or equal to, it would be convex, right? But this is not convex, okay? This is one of the, like, there's about seven problems we can solve that are not convex. This is one of them. It's just an eigenvalue problem, right? What's the solution of this? In terms of the eigenvectors."},{"id":254,"text":"What's that? Yeah, we know how to do this. You find the smallest eigenvalue of w, you find its associated eigenvector, and you scale it by n. And that's literally the solution. That's not a heuristic or anything like that. Oh, by the way, when you do that, what have I done here? When you do that, you get something really interesting."},{"id":255,"text":"First of all, you get a number because this is a relaxation. That's a lower bound on the original problem. But then you also get this. I get an x's which are all, you know, they're all, they're not, they satisfy this, but they're definitely not all plus minus one. Somebody want to make a suggestion to make a heuristic assignment at that point? You have a vector. They're all floats. Some of the squares is n."}],"notes":["本段主要讲解了凸优化中的松弛方法，通过将非凸问题转化为凸问题来求解。讲者提到，当约束条件为xi平方等于1时，该问题不是凸的，但可以通过松弛方法将其转化为一个凸问题。松弛方法可以得到原问题的下界，但解可能不是精确的。","讲者进一步说明了松弛方法的原理，即通过放宽约束条件，将非凸问题转化为凸问题，从而更容易求解。例如，当约束条件为xi平方等于1时，可以将其松弛为xi平方小于等于1，从而得到一个凸问题。","讲者提到，松弛方法得到的解可能不是精确的，但可以作为启发式方法使用。例如，当求解一个非凸问题时，可以通过松弛方法得到一个近似解，然后通过某种方式将其转换为一个可行解。","讲者还提到，松弛方法可以用于谱划分问题，即通过将问题转化为一个特征值问题来求解。例如，当求解一个非凸问题时，可以通过找到最小特征值及其对应的特征向量来得到一个近似解。","讲者指出，松弛方法得到的解可能不是精确的，但可以作为启发式方法使用。例如，当求解一个非凸问题时，可以通过松弛方法得到一个近似解，然后通过某种方式将其转换为一个可行解。","讲者最后提到，松弛方法可以用于谱划分问题，即通过将问题转化为一个特征值问题来求解。例如，当求解一个非凸问题时，可以通过找到最小特征值及其对应的特征向量来得到一个近似解。"],"formulas":[],"uncertainties":["xi squared equals one"],"diagram":"none","start":4577.3,"end":4749.04,"asr_flags":[],"math_clarifications":["原始文本中未提供足够的上下文支持这些公式作为数学表达式，因此无法核定其数学类型、记号、条件、等号、期望、系数、符号等。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4577.3,"text":"Um, and it turns out you can get all sorts of famous bounds out of this by just plugging numbers in. Um, so, but that's, that's the idea. And this is related to, um, spectral partitioning. Um, how many people have seen that? Oh, one hand, just a hand. Ooh, I'm sorry. Everybody needs to know about spectral partitioning, right? You're not going to be able to do any kind of like any serious street fighting applied math if you don't know about that."},{"start":4603.57,"text":"Right? Because partitioning problems come up all the time, and you need to know about it. I'll just show you quickly what it is here, just for fun. I won't go into the details, but it's actually, weirdly, another... Let me just explain it very quickly. So, you... And I won't go into the... I'll give a very simple version of it. Right? So..."},{"start":4628.89,"text":"You have this thing, and then subject, then we have, we're going to minimize this thing, subject to xi squared equals one. That's not convex, right? But if this is true, if xi squared is one, then everyone here would have to, I would hope, agree that that's the case, right? Now, by the way, this is a relaxation, right? Because if the former constraint holds, then this one has to."},{"start":4658.04,"text":"Okay, W is symmetric. Anybody take a look at that? You know how to solve that problem? First of all, is it convex? Is that convex? No. Because of this, right? If that was less than or equal to, it would be convex, right? But this is not convex, okay? This is one of the, like, there's about seven problems we can solve that are not convex. This is one of them. It's just an eigenvalue problem, right? What's the solution of this? In terms of the eigenvectors."},{"start":4698.17,"text":"What's that? Yeah, we know how to do this. You find the smallest eigenvalue of w, you find its associated eigenvector, and you scale it by n. And that's literally the solution. That's not a heuristic or anything like that. Oh, by the way, when you do that, what have I done here? When you do that, you get something really interesting."},{"start":4724.86,"text":"First of all, you get a number because this is a relaxation. That's a lower bound on the original problem. But then you also get this. I get an x's which are all, you know, they're all, they're not, they satisfy this, but they're definitely not all plus minus one. Somebody want to make a suggestion to make a heuristic assignment at that point? You have a vector. They're all floats. Some of the squares is n."}],"speech_gaps":[],"frame":"../frames/v007/028.webp","frame_time":4589.3},{"title":"谱分割与矩阵对称性","segments":[{"id":256,"text":"But the original problem, you wanted all the x high-speed plus or minus one. Someone please make a suggestion. Round them. Done. Take the sign. Done. Congratulations. That is spectral partitioning. Except for one thing I didn't tell you about, which is we can adjust the diagonal of w in a way that will make that slightly better. That's spectral partitioning. This works for gigantic problems. It works super well. So there you go. Yeah."},{"id":257,"text":"Does it have to be symmetric or positive semidefinite? Oh, no, no, no. In this problem? Well, okay, non-symmetric doesn't even make sense, although you just, because you just replace w with its quadratic part. I mean, sorry, its symmetric part, right? If I have a quadratic form, and I replace, the matrix is non-symmetric, I just replace that matrix with that matrix plus its transpose divided by 2. Number one. Then, does it have to be positive semidefinite? Absolutely not. We know, we know this problem we can solve completely."},{"id":258,"text":"As long as w is symmetric, this can have negative eigenvalues, positive eigenvalues, couldn't care less. The solution to this is x is a scaled version of the minimizing eigenvector. Right? Is that okay? I think we'll quit here. It's already getting kind of interesting. And we'll keep going on Thursday."}],"notes":["本段讲解了谱分割方法的基本思想，即通过将问题转化为特征向量问题来求解。讲者提到，原始问题中要求所有x的值为±1，可以通过取符号的方式实现。此外，讲者指出可以通过调整矩阵w的对角线来优化结果，这使得谱分割方法适用于大规模问题。","讲者进一步讨论了矩阵w是否需要对称或半正定的问题。他指出，虽然问题本身可能涉及非对称矩阵，但可以通过将矩阵替换为其对称部分（即矩阵加上其转置除以2）来处理。此外，讲者强调，w不需要是半正定的，因为该问题可以完全求解。","最后，讲者提到只要w是对称的，其特征值可以是正的或负的，这并不影响结果。解是x作为最小化特征向量的缩放版本。讲者表示，课程内容已经足够有趣，并将在下周继续深入讲解。"],"formulas":[],"uncertainties":["high-speed"],"diagram":"none","start":4750.59,"end":4831.98,"asr_flags":[],"math_clarifications":["原文中提到的谱分割问题涉及特征向量和特征值，但未提供具体的数学公式或表达式。因此，无法确定该公式是否准确或需要修正。"],"raw_segments":[{"start":4750.59,"text":"But the original problem, you wanted all the x-high speed plus or minus one. Someone please make a suggestion. Round them. Done. Take the sign. Done. Congratulations. That is spectral partitioning. Except for one thing I didn't tell you about, which is we can adjust the diagonal of w in a way that will make that slightly better. That's spectral partitioning. This works for gigantic problems. It works super well. So there you go. Yeah."},{"start":4781.89,"text":"Does it have to be symmetric or positive semidefinite? Oh, no, no, no. In this problem? Well, okay, non-symmetric doesn't even make sense, although you just, because you just replace w with its quadratic part. I mean, sorry, its symmetric part, right? If I have a quadratic form, and I replace, the matrix is non-symmetric, I just replace that matrix with that matrix plus its transpose divided by 2. Number one. Then, does it have to be positive semidefinite? Absolutely not. We know, we know this problem we can solve completely."},{"start":4811.02,"text":"As long as w is symmetric, this can have negative eigenvalues, positive eigenvalues, couldn't care less. The solution to this is x is a scaled version of the minimizing eigenvector. Right? Is that okay? I think we'll quit here. It's already getting kind of interesting. And we'll keep going on Thursday."}],"speech_gaps":[],"frame":"../frames/v007/029.webp","frame_time":4762.59}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
