nds, millions, billions, trillions of parameters. Some of the models now have trillions of parameters in them. They're not all fed into a line like this. But they'll conventionally have 10,000 dimensional spaces that are the last piece of the model. That's really hard to visualize. So we're going to use a lot of vector notation and other things to deal with it. And that's why we use this notation, so you can simplify and think about it and understand how to manipulate it. In one or two dimensions, you can kind of picture it. But high dimensional space is a weird thing. OK."},{"start":1432.48,"text":"All right. OK. So let's get back to it. So we want to choose some theta such that, as we talked about multiple times, h of x is approximately equal to y. If I give you an x and a new thing, you want to be approximately close. You'd like the price to be close and so on. So how do we do it? Well, here comes least squares. So maybe you've seen this before. I hope you've seen it before. By show of hands, who's seen least squares before? Awesome. Fantastic. All right. Good."},{"start":1464.89,"text":"Least squares, super conventional thing. If you haven't seen it before, please, again, Friday is a good place to look at it. We'll cover it again just in our notation to make sure everything is all right. Now, what happens? So you have this idea here, j theta. That's going to be the loss that you incur. And it's broken down into terms on every single element of the data set. And here you have h theta of xi minus yi. So this is the error."},{"start":1490.45,"text":"remember we kept drawing those pictures like this guy right here? These two things are the same."},{"start":1494.55,"text":"This error, oops, that looks terrible. We'll wait for it to go away. Anyway, so h theta of x i minus"},{"start":1501.99,"text":"y i, that's the prediction error. Then what we do is we square it. And we square it because we want"},{"start":1506.73,"text":"to have something that we have a positive or non-negative number there. It could be zero if"},{"start":1511.07,"text":"it were exactly equal. And then what we're going to do is we're going to try and pick the theta"},{"start":1514.61,"text":"that minimizes it, okay? Just by show of hands, how many people know the arg min notation?"},{"start":1520.87,"text":"Perfect. All right, we're doing great. Okay, so then in that case you know"},{"start":1524.69,"text":"exactly what goes on here. We're gonna solve over j theta and we're gonna try"},{"start":1527.91,"text":"and pick the thing that minimizes this function. And so intuitively what that"},{"start":1531.73,"text":"says is we're gonna pick the theta so that on average over all of our training"},{"start":1535.15,"text":"points, we minimize that squared error. Okay, so we're gonna instead of measuring"},{"start":1540.27,"text":"the error just as a sum, we're gonna square that distance. So things that are"},{"start":1543.73,"text":"really close, they're gonna, you know, go down. Things are really big, we're gonna"},{"start":1546.93,"text":"going to pay for."},{"start":1548.81,"text":"Now, why do we do squared error?"},{"start":1550.37,"text":"Oh, go ahead."},{"start":1551.39,"text":"Sorry, I might be, you might be about to say it,"},{"start":1556.43,"text":"but the squaring, presumably you could take another power."},{"start":1561.57,"text":"Yeah, yeah, sure thing."},{"start":1562.61,"text":"To even be even stricter on room picking."},{"start":1565.85,"text":"Yeah, exactly right."},{"start":1567.03,"text":"So the question is, is why did you pick two here?"},{"start":1569.49,"text":"And why did you do it?"},{"start":1571.11,"text":"That's a great question."},{"start":1571.91,"text":"So could you pick other values?"},{"start":1573.39,"text":"Certainly, you could pick another power."},{"start":1575.05,"text":"You could pick the absolute value, right?"}],"speech_gaps":[],"frame":"../frames/v049/009.webp","frame_time":1412.11},{"title":"监督学习设定中的最小二乘法与优化","segments":[{"id":88,"text":"That's a fine thing to do as well. That's a value regression kind of thing.","zh":"这也是一个很好的做法，这类似于一种值回归的方法。","start":1576.71,"end":1581.09},{"id":89,"text":"2 has a nice property, which we're cheating on for a lot of least squares.","zh":"2 有一个很好的性质，我们在很多最小二乘法中都利用了这个性质。","start":1581.57,"end":1584.75},{"id":90,"text":"2 we can solve exactly. And that just turns out to be because 2 is, as you'll see in a second,","zh":"2 我们可以精确求解。而这仅仅是因为 2，正如你马上就会看到的，","start":1585.03,"end":1589.81},{"id":91,"text":"when we compute all the derivatives and do all the nice things, the derivative has a really nice form","zh":"当我们计算所有导数并完成所有良好的步骤时，导数具有非常简洁的形式","start":1589.85,"end":1594.03},{"id":92,"text":"or the gradient has a really nice form. And that's going to let us solve it exactly.","zh":"或者梯度具有非常简洁的形式。而这将使我们能够精确求解它。","start":1594.03,"end":1597.27},{"id":93,"text":"Historically, also if you care, like","zh":"历史上，如果你感兴趣的话，","start":1598.11,"end":1599.79},{"id":94,"text":"many of the people who were doing science way back when, when Gauss was doing least squares, because of that computational advantage, they could predict all kinds of nice things. It was an easy problem. Now, you could look at that, and I will derive for you in the next class, I'll derive for you how that least squares comes up and relates to a fancy statistical assumption, which is that the errors are approximately normal, which we'll come in and talk about a little bit later.","zh":"许多在高斯进行最小二乘法研究时从事科学工作的人都利用了这种计算优势，他们能够预测各种美好的事物。这是一个容易的问题。现在，你可以看一下，我将在下一节课中为你推导，我会为你推导最小二乘法是如何出现并与一个复杂的统计假设相关联的，即误差近似服从正态分布，我们稍后会稍作讨论。","start":1600.38,"end":1623.7},{"id":95,"text":"And so you'll be able to derive other regressions that are in there. But the special things about least squares are it's extremely popular.","zh":"因此，你将能够推导出其中的其他回归方法。但最小二乘法的特殊之处在于它非常流行。","start":1624.52,"end":1630.44},{"id":96,"text":"uh in like history not like you know i think it's great right now like it's extremely popular in history and it's very easy to solve okay and that the reason i hammer on this so hard is a lot of machine learning if you look at it and i think honestly i was guilty of this so i grew up as like a math person and so when i came to machine learning and ai i kind of had this idea that i was like well why are you doing like simple algorithms why are you like you know worried about these other things and i've come to realize that really what goes on in machine learning that makes it so powerful is this trade-off between kind of how we compute things and kind of how we predict them.","zh":"嗯，在历史上，不像你知道的那样，我觉得现在它非常棒，现在它极其流行，而且非常容易解决。好吧，我之所以这么强调这一点，是因为很多机器学习，如果你仔细看看，我想我其实也做过这样的事，我从小就是个数学爱好者，当我进入机器学习和人工智能领域时，我有一种想法，就是为什么你们在做这么简单的算法，为什么你们这么担心这些其他的事情。后来我意识到，真正让机器学习如此强大的东西，是在计算方式和预测方式之间的一种权衡。","start":1631.03,"end":1660.33},{"id":97,"text":"compute things and kind of how we predict them. And actually, when machine learning to me really intellectually came into its own as a field was when it broke away a little bit from stats and started to train these crazy large models and understand more what were the computational limits of what kind of models we could have. So sorry for the long digression, but I love questions. So I'm just pumping, trying to get more. That was a wonderful question. Please.","zh":"计算方式和预测方式。实际上，当机器学习作为一个领域真正从学术上独立出来时，是当它从统计学中稍微脱离出来，开始训练这些非常庞大的模型，并更深入地理解我们能够拥有的模型的计算限制。抱歉，我刚才说了这么多，但我喜欢问题。我只是在不断提问，试图获得更多。这是一个非常好的问题。请。","start":1660.46,"end":1680.4},{"id":98,"text":"Yeah, the 1 half is there just by convention. So one of the things is, this arg min is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for.","zh":"是的，1/2的存在只是出于惯例。其中一件事是，这个arg min对常数不敏感。如果我把这个改成25除以1/2，这完全不会受到影响。我会得到同样的theta。所以常数并不重要。我们这样做是因为，当我们稍后计算导数时，这些项会相互抵消。这会让事情稍微好一点。这有点像烹饪节目中的数学观，我们设置它以便看起来更整洁。当你自己做时，总是会是一场巨大的混乱。然后你再之后清理一下。这就是它存在的全部原因。","start":1682.92,"end":1711.82},{"id":99,"text":"Please.","zh":"请。","start":1712.31,"end":1712.61},{"id":100,"text":"With argument, like the data that you kind of put in,","zh":"以你输入的数据为论据，","start":1713.17,"end":1716.17},{"id":101,"text":"like are they discrete or?","zh":"它们是离散的还是？","start":1716.19,"end":1718.19},{"id":102,"text":"Oh, fantastic.","zh":"哦，太棒了。","start":1718.89,"end":1719.53},{"id":103,"text":"Yeah.","zh":"是的。","start":1719.77,"end":1719.93},{"id":104,"text":"So one of the things is, is remember,","zh":"所以其中一件事是，要记住，","start":1719.99,"end":1721.41},{"id":105,"text":"our hypothesis class right now,","zh":"我们现在的假设类，","start":1721.53,"end":1723.07},{"id":106,"text":"the way we picked it was to be continuous.","zh":"我们选择它的方式是连续的。","start":1723.21,"end":1725.13},{"id":107,"text":"So these can be any real value that we want.","zh":"因此，这些可以是我们想要的任何实数值。","start":1725.25,"end":1727.15},{"id":108,"text":"And so when we plug these things in here,","zh":"因此，当我们把这些代入到这里时，","start":1727.27,"end":1729.15},{"id":109,"text":"we're going to have continuous value.","zh":"我们将得到连续值。","start":1729.27,"end":1730.45},{"id":110,"text":"So we're going to do continuous optimization.","zh":"因此，我们将进行连续优化。","start":1730.57,"end":1731.75},{"id":111,"text":"Discrete optimization, you can do.","zh":"离散优化，你也可以进行。","start":1732.81,"end":1734.39},{"id":112,"text":"There are procedures that people do,","zh":"有一些人们执行的程序，","start":1734.53,"end":1736.45},{"id":113,"text":"fancy ones, you know, integer linear programming, yada, yada, yada.","zh":"一些花哨的程序，你知道的，整数线性规划，呀，呀，呀。","start":1736.59,"end":1738.89},{"id":114,"text":"yada, yada, yada.","zh":"呀，呀，呀。","start":1738.91,"end":1739.55},{"id":115,"text":"Those are generally pretty hard.","zh":"这些通常都非常困难。","start":1739.89,"end":1741.37},{"id":116,"text":"Most modern machine learning, one of the tricks","zh":"大多数现代机器学习，其中一个技巧是","start":1741.37,"end":1743.33},{"id":117,"text":"are, even when you have something that's discrete,","zh":"即使你有某种离散的东西，","start":1743.33,"end":1745.23},{"id":118,"text":"like our models that work on words,","zh":"比如我们的处理词语的模型，","start":1745.39,"end":1747.01},{"id":119,"text":"underneath their covers, they're actually","zh":"在它们的内部，它们实际上","start":1747.19,"end":1748.81},{"id":120,"text":"doing something continuous.","zh":"进行连续的操作。","start":1748.81,"end":1749.77},{"id":121,"text":"And so the parameter space will almost always be continuous.","zh":"因此，参数空间几乎总是连续的。","start":1749.99,"end":1752.39},{"id":122,"text":"So you can compute things like gradients and derivatives","zh":"因此，你可以计算梯度和导数等量。","start":1752.55,"end":1755.23}],"notes":["本段主要讲解了最小二乘法的计算优势，以及其在历史上的应用。教授提到，最小二乘法之所以受欢迎，是因为它计算简单，且在统计假设下（误差近似正态分布）具有良好的性质。此外，教授还强调了机器学习中计算与预测之间的权衡，以及现代机器学习如何通过连续优化来处理离散问题。"],"formulas":[{"latex":"arg\\min_{\\theta} \\frac{1}{2} \\sum_{i=1}^{n} (y_i - \\theta x_i)^2","symbols":"最小二乘法的目标函数","explanation":"公式正确，表示最小化均方误差的目标函数，其中1/2是为简化导数计算而引入的常数因子。","evidence":"Yeah, the 1 half is there just by convention. So one of the things is, this arg min is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for."},{"latex":"\\frac{\\partial}{\\partial \\theta} \\left(\\frac{1}{2} \\sum_{i=1}^{n} (y_i - \\theta x_i)^2\\right) = 0","symbols":"最小二乘法的导数为零","explanation":"公式正确，表示对目标函数求导并令其为零，以找到最小值点。","evidence":"Yeah, the 1 half is there just by convention. So one of the things is, this arg min is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for."}],"uncertainties":["1/2 的存在是否完全由惯例决定","离散优化的具体方法（如整数线性规划）是否被正确提及"],"diagram":"none","start":1576.71,"end":1755.23,"asr_flags":[],"math_clarifications":["公式中的1/2因子是为了简化导数计算，不影响最小值点的位置。"],"translation_complete":true,"translated_segments":35,"raw_segments":[{"start":1576.71,"text":"That's a fine thing to do as well. That's a value regression kind of thing."},{"start":1581.57,"text":"2 has a nice property, which we're cheating on for a lot of least squares."},{"start":1585.03,"text":"2 we can solve exactly. And that just turns out to be because 2 is, as you'll see in a second,"},{"start":1589.85,"text":"when we compute all the derivatives and do all the nice things, the derivative has a really nice form"},{"start":1594.03,"text":"or the gradient has a really nice form. And that's going to let us solve it exactly."},{"start":1598.11,"text":"Historically, also if you care, like"},{"start":1600.38,"text":"many of the people who were doing science way back when, when Gauss was doing least squares, because of that computational advantage, they could predict all kinds of nice things. It was an easy problem. Now, you could look at that, and I will derive for you in the next class, I'll derive for you how that least squares comes up and relates to a fancy statistical assumption, which is that the errors are approximately normal, which we'll come in and talk about a little bit later."},{"start":1624.52,"text":"And so you'll be able to derive other regressions that are in there. But the special things about least squares are it's extremely popular."},{"start":1631.03,"text":"uh in like history not like you know i think it's great right now like it's extremely popular in history and it's very easy to solve okay and that the reason i hammer on this so hard is a lot of machine learning if you look at it and i think honestly i was guilty of this so i grew up as like a math person and so when i came to machine learning and ai i kind of had this idea that i was like well why are you doing like simple algorithms why are you like you know worried about these other things and i've come to realize that really what goes on in machine learning that makes it so powerful is this trade-off between kind of how we"},{"start":1660.46,"text":"compute things and kind of how we predict them. And actually, when machine learning to me really intellectually came into its own as a field was when it broke away a little bit from stats and started to train these crazy large models and understand more what were the computational limits of what kind of models we could have. So sorry for the long digression, but I love questions. So I'm just pumping, trying to get more. That was a wonderful question. Please."},{"start":1682.92,"text":"Yeah, the 1 half is there just by convention. So one of the things is, this arg min is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for."},{"start":1712.31,"text":"Please."},{"start":1713.17,"text":"With argument, like the data that you kind of put in,"},{"start":1716.19,"text":"like are they discrete or?"},{"start":1718.89,"text":"Oh, fantastic."},{"start":1719.77,"text":"Yeah."},{"start":1719.99,"text":"So one of the things is, is remember,"},{"start":1721.53,"text":"our hypothesis class right now,"},{"start":1723.21,"text":"the way we picked it was to be continuous."},{"start":1725.25,"text":"So these can be any real value that we want."},{"start":1727.27,"text":"And so when we plug these things in here,"},{"start":1729.27,"text":"we're going to have continuous value."},{"start":1730.57,"text":"So we're going to do continuous optimization."},{"start":1732.81,"text":"Discrete optimization, you can do."},{"start":1734.53,"text":"There are procedures that people do,"},{"start":1736.59,"text":"fancy ones, you know, integer linear programming,"},{"start":1738.91,"text":"yada, yada, yada."},{"start":1739.89,"text":"Those are generally pretty hard."},{"start":1741.37,"text":"Most modern machine learning, one of the tricks"},{"start":1743.33,"text":"are, even when you have something that's discrete,"},{"start":1745.39,"text":"like our models that work on words,"},{"start":1747.19,"text":"underneath their covers, they're actually"},{"start":1748.81,"text":"doing something continuous."},{"start":1749.99,"text":"And so the parameter space will almost always be continuous."},{"start":1752.55,"text":"So you can compute things like gradients and derivatives"}],"speech_gaps":[],"frame":"../frames/v049/010.webp","frame_time":1588.71},{"title":"监督学习设定与误差函数","segments":[{"id":123,"text":"and for other optimization reasons.","zh":"还有其他优化原因。","start":1755.23,"end":1756.79},{"id":124,"text":"It's a very insightful question.","zh":"这是一个非常有见地的问题。","start":1757.15,"end":1758.41},{"id":125,"text":"Please.","zh":"请。","start":1759.51,"end":1760.01},{"id":126,"text":"Does this mean that the larger differences","zh":"这意味着更大的差异","start":1760.43,"end":1763.75},{"id":127,"text":"Does this mean that the larger differences get more ?","zh":"这意味着更大的差异会得到更多的？","start":1763.75,"end":1766.03},{"id":128,"text":"Yeah, that's a great question to think about.","zh":"是的，这是一个值得思考的好问题。","start":1766.03,"end":1768.29},{"id":129,"text":"So these error functions, this thing here,","zh":"因此，这些误差函数，这里的东西，","start":1768.47,"end":1770.71},{"id":130,"text":"or when we incur an error in prediction,","zh":"或者当我们预测出现误差时，","start":1770.71,"end":1772.37},{"id":131,"text":"the question is how much penalty do we pay?","zh":"问题是：我们要付出多少代价？","start":1772.63,"end":1774.45},{"id":132,"text":"Right now we're paying with this square.","zh":"现在我们用的是平方项来付出代价。","start":1774.77,"end":1776.27},{"id":133,"text":"And as we've talked about,","zh":"正如我们之前讨论的，","start":1776.45,"end":1777.09},{"id":134,"text":"it's for computational and modeling reasons,","zh":"这是出于计算和建模的考虑，","start":1777.25,"end":1779.35},{"id":135,"text":"kind of a good mix.","zh":"某种程度上是一个不错的折中方案。","start":1779.47,"end":1780.25},{"id":136,"text":"You could put other things in there.","zh":"你也可以在其中加入其他项。","start":1780.67,"end":1782.01},{"id":137,"text":"I don't wanna make too big a deal out of it","zh":"我不想对此过分强调","start":1782.27,"end":1784.23},{"id":138,"text":"because honestly, when you get to a lot of data,","zh":"因为说实话，当数据量很大的时候，","start":1784.23,"end":1786.95},{"id":139,"text":"the form of this doesn't really matter too much.","zh":"这种形式其实并不太重要。","start":1787.49,"end":1790.65},{"id":140,"text":"There is one very important form","zh":"有一种非常重要的形式","start":1790.97,"end":1792.89},{"id":141,"text":"that we'll cover next lecture,","zh":"我们将在下节课讲解，","start":1792.89,"end":1794.03},{"id":142,"text":"which is for classification when you have a discrete set,","zh":"它用于分类问题，当你的数据集是离散的时，","start":1794.17,"end":1798.21},{"id":143,"text":"and then you do something called softmax.","zh":"然后你会使用一种叫做softmax的函数。","start":1798.37,"end":1799.83},{"id":144,"text":"And softmax is probably the function that I use most in my day when you build these systems.","zh":"而softmax可能是我在构建这些系统时使用最多的函数。","start":1799.83,"end":1806.07},{"id":145,"text":"And probably if you are doing all your homework with ChatGPT like the rest of your classmates, then you probably use it too.","zh":"如果你像其他同学一样，用ChatGPT完成所有作业，那你可能也在使用它。","start":1806.19,"end":1811.19},{"id":146,"text":"Because that's the workhorse that's underneath it.","zh":"因为这是其背后的核心工具。","start":1811.33,"end":1813.49},{"id":147,"text":"But this one is just the one we're going to do for computational reasons. It has a nastier derivative. Other questions? This is awesome. Please ask me questions. All right. We'll keep going. All right. So what do we see? We're at the end of our linear regression.","zh":"但这个就是我们出于计算原因要做的。它有一个更复杂的导数。还有其他问题吗？这太棒了。请向我提问。好了，我们继续。好了，我们看到了什么？我们已经结束了线性回归。","start":1813.85,"end":1830.69},{"id":148,"text":"We're at the end of our linear regression. We saw our first hypothesis class, affine and linear. We're going to see many, many more richer classes throughout this. And richer means that they're more expressive. It means not only do they have more parameters, which as I've hinted several, several times, modern models do, but they're actually going to have crazier surfaces as well. So they're not just going to be lines. They're going to have kind of crazy, interesting surfaces underneath them. We refreshed ourselves. And as I said, if this part was unfamiliar to you, you were looking at this and you're like, I've never heard anything this guy's talking about.","zh":"我们已经结束了线性回归。我们看到了我们的第一个假设类，仿射和线性。在整个课程中，我们将看到许多更丰富的类。更丰富意味着它们更具表达力。这意味着它们不仅有更多参数，正如我多次暗示的，现代模型就是这样，而且它们实际上还会具有更复杂的表面。它们不仅仅是直线。它们会有一些相当复杂、有趣的表面。我们重新梳理了这些内容。正如我所说，如果这部分对你来说不熟悉，你看到这些内容时可能会觉得，我讲的东西你从未听说过。","start":1832.29,"end":1859.11},{"id":149,"text":"Okay, maybe I did a bad job. I'm willing to admit that. But if I didn't do a terrible job, then look and say, maybe I need to refresh. And I cannot tell you how much I want you to, if you need to, go take advantage of those TA resources and others, because putting in a little bit of investment now makes the class go a lot, lot more smoothly for you. We also saw something that was this paradigm that you guys picked up on right away, which is great, which is that a good hypothesis is one that's close to the data.","zh":"好吧，也许我做得不好。我愿意承认这一点。但如果我没做得很糟糕，那么请看一下并说，也许我需要重新梳理。我无法告诉你有多希望你们如果需要的话，去利用那些助教资源和其他资源，因为现在投入一点努力会让这门课对你来说顺畅得多。我们还看到了一种你们立刻就抓住的范式，这很好，那就是一个好的假设是接近数据的。","start":1859.85,"end":1884.55},{"id":150,"text":"And I want to point out something which is a little bit kind of spooky about what we're going to claim here. And this is like a foundation of statistics. It's not that spooky. But it is, if we believe that training set, if we fit our hypothesis on that training set, we believe it's going to work well in the real world. That's a little bit of a leap of faith.","zh":"我想指出一点，那就是我们在这里要声称的内容有点令人不安。这实际上是统计学的基础。它并不那么令人不安。但如果我们相信训练集，如果我们在这个训练集上拟合我们的假设，我们相信它在现实世界中会表现良好。这有点像是一个信仰的飞跃。","start":1885.0,"end":1902.37},{"id":151,"text":"And so we'll justify that leap of faith in all kinds of ways, some of which I'll give you a lecture in the middle about how they can go terribly wrong. And I will pick from my own work where we thought we were selecting data in a way at training time that was going to match test. And we were completely wrong and made fools of ourselves. So economic indicators and all kinds of fun stuff like that. And so that can happen. But I want to be aware this paradigm is what machine learning does. It says, look.","zh":"因此，我们将通过各种方式来证明这个跳跃式的信念，其中一些方式我将在中间的课程中向你们讲解，说明它们可能会多么严重地出错。我会从我自己的工作中选取例子，当时我们认为在训练时选择的数据方式会与测试数据相匹配，但结果我们完全错了，甚至让自己出尽了洋相。比如经济指标和各种有趣的事情。因此，这种情况可能发生。但我要让大家意识到，这就是机器学习所采用的范式。它说，看。","start":1902.8,"end":1926.96}],"notes":["本段讨论了监督学习中误差函数的选择及其对模型训练的影响。讲者提到，误差函数的设计不仅影响模型的性能，还涉及计算和建模的考虑。例如，平方误差函数因其计算简单和可导性而被广泛使用，但其他形式的误差函数也可以被采用。讲者还指出，在数据量大的情况下，误差函数的形式对结果的影响可能不大。","讲者强调了监督学习中一个核心假设，即训练集能够代表真实世界的数据分布。这一假设是机器学习的基础，但同时也存在一定的风险，因为训练集可能无法完全反映真实情况。讲者提到，这种假设需要通过多种方法进行验证，以避免模型在实际应用中表现不佳。","讲者提到，监督学习的目标是找到一个假设函数，使其在训练集上的表现良好，并且能够推广到未见过的数据。这涉及到模型的泛化能力，而泛化能力的提升通常需要更复杂的模型结构，如非线性模型。","讲者指出，现代机器学习模型通常具有更多的参数，并且能够拟合更复杂的函数表面。这使得模型能够捕捉到数据中的非线性关系，从而提高预测性能。然而，这种复杂性也带来了计算上的挑战，需要在模型的表达能力和计算效率之间进行权衡。","讲者提到，监督学习的假设是训练集能够代表真实世界的数据分布，但这一假设并不总是成立。讲者通过自己的经验指出，有时训练集的选择可能与测试集存在差异，导致模型在实际应用中表现不佳。因此，需要通过多种方法来验证和改进模型的泛化能力。","讲者强调了监督学习的基本思想，即通过训练集学习一个假设函数，使其在未见过的数据上表现良好。这一思想是机器学习的核心，但同时也需要谨慎对待，因为训练集可能无法完全反映真实世界的数据分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1755.23,"end":1926.96,"asr_flags":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":1755.23,"text":"and for other optimization reasons."},{"start":1757.15,"text":"It's a very insightful question."},{"start":1759.51,"text":"Please."},{"start":1760.43,"text":"Does this mean that the larger differences"},{"start":1763.75,"text":"get more ?"},{"start":1766.03,"text":"Yeah, that's a great question to think about."},{"start":1768.47,"text":"So these error functions, this thing here,"},{"start":1770.71,"text":"or when we incur an error in prediction,"},{"start":1772.63,"text":"the question is how much penalty do we pay?"},{"start":1774.77,"text":"Right now we're paying with this square."},{"start":1776.45,"text":"And as we've talked about,"},{"start":1777.25,"text":"it's for computational and modeling reasons,"},{"start":1779.47,"text":"kind of a good mix."},{"start":1780.67,"text":"You could put other things in there."},{"start":1782.27,"text":"I don't wanna make too big a deal out of it"},{"start":1784.23,"text":"because honestly, when you get to a lot of data,"},{"start":1787.49,"text":"the form of this doesn't really matter too much."},{"start":1790.97,"text":"There is one very important form"},{"start":1792.89,"text":"that we'll cover next lecture,"},{"start":1794.17,"text":"which is for classification when you have a discrete set,"},{"start":1798.37,"text":"and then you do something called softmax."},{"start":1799.83,"text":"And softmax is probably the function that I use most in my day when you build these systems."},{"start":1806.19,"text":"And probably if you are doing all your homework with ChatGPT like the rest of your classmates, then you probably use it too."},{"start":1811.33,"text":"Because that's the workhorse that's underneath it."},{"start":1813.85,"text":"But this one is just the one we're going to do for computational reasons. It has a nastier derivative. Other questions? This is awesome. Please ask me questions. All right. We'll keep going. All right. So what do we see? We're at the end of our linear regression."},{"start":1832.29,"text":"We saw our first hypothesis class, affine and linear. We're going to see many, many more richer classes throughout this. And richer means that they're more expressive. It means not only do they have more parameters, which as I've hinted several, several times, modern models do, but they're actually going to have crazier surfaces as well. So they're not just going to be lines. They're going to have kind of crazy, interesting surfaces underneath them. We refreshed ourselves. And as I said, if this part was unfamiliar to you, you were looking at this and you're like, I've never heard anything this guy's talking about."},{"start":1859.85,"text":"Okay, maybe I did a bad job. I'm willing to admit that. But if I didn't do a terrible job, then look and say, maybe I need to refresh. And I cannot tell you how much I want you to, if you need to, go take advantage of those TA resources and others, because putting in a little bit of investment now makes the class go a lot, lot more smoothly for you. We also saw something that was this paradigm that you guys picked up on right away, which is great, which is that a good hypothesis is one that's close to the data."},{"start":1885.0,"text":"And I want to point out something which is a little bit kind of spooky about what we're going to claim here. And this is like a foundation of statistics. It's not that spooky. But it is, if we believe that training set, if we fit our hypothesis on that training set, we believe it's going to work well in the real world. That's a little bit of a leap of faith."},{"start":1902.8,"text":"And so we'll justify that leap of faith in all kinds of ways, some of which I'll give you a lecture in the middle about how they can go terribly wrong. And I will pick from my own work where we thought we were selecting data in a way at training time that was going to match test. And we were completely wrong and made fools of ourselves. So economic indicators and all kinds of fun stuff like that. And so that can happen. But I want to be aware this paradigm is what machine learning does. It says, look."}],"speech_gaps":[],"frame":"../frames/v049/011.webp","frame_time":1767.23},{"title":"监督学习设定与优化基础","segments":[{"id":152,"text":"This training set is somehow a reflection. It's captured the real world. You have to believe that. And then fitting on that data set is somehow going to carry out something nice in the real world. It's like the cornerstone of statistical estimation and inference. Cool. Great. We also talked a bunch about objective functions, Jay. We're going to see those over the next lecture. We're going to see the canonical one for regression today, and we'll see the canonical one for classification next week. OK.","zh":"这个训练集在某种程度上是一种反映。它捕捉了现实世界。你必须相信这一点。然后在这样的数据集上进行拟合，某种程度上会在现实世界中实现一些好的效果。它是统计估计和推断的基石。很酷。很好。我们还讨论了很多关于目标函数的问题，Jay。在接下来的课程中我们会看到这些内容。今天我们会看到回归问题的典型目标函数，下周我们会看到分类问题的典型目标函数。好的。","start":1927.25,"end":1954.62},{"id":153,"text":"All right. Now, as I mentioned, and I'm biased here, so I should also tell you about that. So what I work on in research, as I mentioned, is I really like the problems of scaling up these models. We've done all kinds of things underneath the covers to do that, to make these large models that today run on GPUs. We've contributed our little brick to that out of my lab, which I'm very proud of. Wonderful students and collaborators. But one of the things that you'll see in machine learning is this ability to compute.","zh":"好的。正如我之前提到的，我在这里有些偏见，所以我也应该告诉你这一点。正如我之前提到的，我研究的方向是喜欢将这些模型扩展到更大规模的问题。我们已经做了很多底层的工作来实现这一点，使得这些大型模型今天能够在GPU上运行。我们实验室也为此贡献了一点点砖瓦，我对此感到非常自豪。优秀的学生们和合作者们。但你在机器学习中会看到的一件事就是这种计算能力。","start":1955.41,"end":1980.87},{"id":154,"text":"These functions at large scales is critically important. That's been the revolution that's allowed us to break away from doing small kinds of problems to the large. And that's what we're going to cover over the next couple of weeks. But we'll start where the field started. What that boils down to is basically solving a set of these equations, that argmin that we talked about before. This is also called, as we'll talk about, a loss function.","zh":"在大规模上计算这些函数至关重要。这是一场革命，使我们能够从解决小规模问题转向大规模问题。接下来的几周我们会覆盖这些内容。但我们将会从这个领域开始的地方入手。这实际上归结为求解一组这样的方程，也就是我们之前讨论过的argmin。这也被称为损失函数。","start":1981.47,"end":2002.58},{"id":155,"text":"Being able to take a loss function and run an optimization procedure, fancy one called backprop that you'll learn in the course, underpins pretty much 99% of the models that you're likely to encounter today. So we're going to see the warm-ups to how you get to backprop, the simplest thing that starts there, which is the computation of a derivative. And then in this case, we'll also see how to solve these equations exactly. That's very unusual that you can do that.","zh":"能够将损失函数与优化过程结合起来，这种被称为反向传播的高级方法是你将在本课程中学习的，支撑了你今天很可能遇到的几乎所有模型的99%。因此，我们将看到如何逐步引导到反向传播，最简单的开始就是导数的计算。在本案例中，我们还将看到如何精确地求解这些方程。这非常不寻常，你能够做到这一点。","start":2003.24,"end":2026.6},{"id":156,"text":"But it will basically be an exercise with some of that notation. So if I haven't made it clear, we'd really love you to use those Friday lectures. All right. I'm not getting paid if you go. I know you probably at this point, you're like, oh, you must be getting paid. No, no. I think it's good for you. All right. So let me solve these least squares problems. All right. So I'm going to draw a little picture here. All right. So let's take a function.","zh":"但这基本上是一个涉及一些符号的练习。所以如果我还没有讲清楚，我们真的希望你们使用这些星期五的讲座。好了，如果你去的话，我不会得到报酬。我知道你们此刻可能在想，哦，你一定是在拿报酬。不，不。我认为这对你们有好处。好了，让我来解决这些最小二乘问题。好了，我将在这里画一个小图。好了，让我们取一个函数。","start":2027.32,"end":2050.73},{"id":157,"text":"This will be our quadratic, which is kind of like our classical function. And we'll look at this kind of bowl-shaped function. Now, when we compute the quadratic, so we'll take something here, which like we'll say it's x squared on my right here. So it's like x squared plus, I don't know, some theta 0, whatever, something right here. Now, I can make this call this 2x squared. I don't know, whatever you want. Now, this is f.","zh":"这将是我们的二次函数，类似于我们的经典函数。我们将观察这种碗状的函数。当我们计算二次函数时，我们会取这里的一个东西，比如说，它在我的右边是x平方。所以它类似于x平方加上，我不知道，某个theta 0，或者其他什么，这里的东西。现在，我可以称这个为2x平方。我不知道，随便你们怎么想。现在，这是f。","start":2051.37,"end":2079.07},{"id":158,"text":"You all remember how to compute derivatives for this, I hope. But if you don't, remember the picture. You pick a point. Let's say your first point here, which is going to be theta 0, which is going to be our first guess. You then pick this line, which is the gradient, the best linear approximation. You remember your Taylor expansion. You're going to be f of theta 0. And then you're going to be plus f prime of theta 0.","zh":"我希望你们还记得如何计算这个的导数。如果你们不记得，就记住这个图。你们选择一个点。比如说，你们的第一个点在这里，这将是theta 0，这将是我们的第一个猜测。然后你们选择这条线，这是梯度，也就是最佳的线性近似。你们记得泰勒展开。你们将得到f在theta 0处的值，然后再加上f在theta 0处的一阶导数。","start":2079.57,"end":2107.22}],"notes":["本段主要讲解监督学习中训练集的作用，强调训练集反映真实世界的重要性，并指出模型在真实世界中的应用。同时，提到课程将介绍目标函数，包括回归和分类的典型目标函数。","本段讨论了机器学习中计算大规模函数的重要性，这是从解决小规模问题转向大规模问题的革命性突破。课程接下来几周将重点讲解如何解决这些方程，即求解argmin问题，这被称为损失函数。","本段强调了优化过程在现代机器学习中的核心地位，特别是反向传播算法。课程将从基础开始，讲解如何计算导数，并展示如何精确求解这些方程，这在实际中较为罕见。","本段提到周五的讲座，鼓励学生参加。虽然讲师未获得报酬，但认为这些讲座对学习有帮助。随后，讲师将讲解最小二乘问题，并通过图像展示二次函数及其导数的计算。","本段通过图像说明二次函数的形状，并引入参数θ₀作为初始猜测。接着，讲师提到梯度作为最佳线性近似，并使用泰勒展开来解释函数在θ₀处的值及其导数。","本段强调了导数计算在机器学习中的重要性，并通过图像和数学表达式说明如何利用梯度进行优化。这为后续反向传播算法的讲解奠定了基础。"],"formulas":[{"latex":"\\operatorname{argmin}","symbols":"最小化","explanation":"保留argmin，这是数学中常用的最小化操作符，无需修改。","evidence":"These functions at large scales is critically important. That's been the revolution that's allowed us to break away from doing small kinds of problems to the large. And that's what we're going to cover over the next couple of weeks. But we'll start where the field started. What that boils down to is basically solving a set of these equations, that argmin that we talked about before. This is also called, as we'll talk about, a loss function."}],"uncertainties":["Some theta 0, whatever, something right here"],"diagram":"none","start":1927.25,"end":2107.22,"asr_flags":[],"math_clarifications":["公式1无法核定，因为没有明确的数学恒等关系支持，且上下文未提供足够的信息来验证其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1927.25,"text":"This training set is somehow a reflection. It's captured the real world. You have to believe that. And then fitting on that data set is somehow going to carry out something nice in the real world. It's like the cornerstone of statistical estimation and inference. Cool. Great. We also talked a bunch about objective functions, Jay. We're going to see those over the next lecture. We're going to see the canonical one for regression today, and we'll see the canonical one for classification next week. OK."},{"start":1955.41,"text":"All right. Now, as I mentioned, and I'm biased here, so I should also tell you about that. So what I work on in research, as I mentioned, is I really like the problems of scaling up these models. We've done all kinds of things underneath the covers to do that, to make these large models that today run on GPUs. We've contributed our little brick to that out of my lab, which I'm very proud of. Wonderful students and collaborators. But one of the things that you'll see in machine learning is this ability to compute."},{"start":1981.47,"text":"These functions at large scales is critically important. That's been the revolution that's allowed us to break away from doing small kinds of problems to the large. And that's what we're going to cover over the next couple of weeks. But we'll start where the field started. What that boils down to is basically solving a set of these equations, that argmin that we talked about before. This is also called, as we'll talk about, a loss function."},{"start":2003.24,"text":"Being able to take a loss function and run an optimization procedure, fancy one called backprop that you'll learn in the course, underpins pretty much 99% of the models that you're likely to encounter today. So we're going to see the warm-ups to how you get to backprop, the simplest thing that starts there, which is the computation of a derivative. And then in this case, we'll also see how to solve these equations exactly. That's very unusual that you can do that."},{"start":2027.32,"text":"But it will basically be an exercise with some of that notation. So if I haven't made it clear, we'd really love you to use those Friday lectures. All right. I'm not getting paid if you go. I know you probably at this point, you're like, oh, you must be getting paid. No, no. I think it's good for you. All right. So let me solve these least squares problems. All right. So I'm going to draw a little picture here. All right. So let's take a function."},{"start":2051.37,"text":"This will be our quadratic, which is kind of like our classical function. And we'll look at this kind of bowl-shaped function. Now, when we compute the quadratic, so we'll take something here, which like we'll say it's x squared on my right here. So it's like x squared plus, I don't know, some theta 0, whatever, something right here. Now, I can make this call this 2x squared. I don't know, whatever you want. Now, this is f."},{"start":2079.57,"text":"You all remember how to compute derivatives for this, I hope. But if you don't, remember the picture. You pick a point. Let's say your first point here, which is going to be theta 0, which is going to be our first guess. You then pick this line, which is the gradient, the best linear approximation. You remember your Taylor expansion. You're going to be f of theta 0. And then you're going to be plus f prime of theta 0."}],"speech_gaps":[],"frame":"../frames/v049/012.webp","frame_time":1939.25},{"title":"梯度下降法与凸性","segments":[{"id":159,"text":"times x minus x theta, or theta. Whoa, that's bad. All right, I'm going to rewrite this. f of theta 0 plus f prime of theta 0. And then I was just trying to write theta minus theta 0. Nothing deep going on. This Taylor's rule for the first derivative. And that's that line that I've drawn there. And if you don't remember that, remember it's the secant that comes in and approximates the gradient. Slide it down in your head. OK, once we do that, we have the direction of maximal increase.","zh":"times x 减去 x theta，或者 theta。哇，这很糟糕。好吧，我现在要重新写下这个。f of theta 0 加上 f prime of theta 0。然后我只是试图写下 theta 减去 theta 0。没有什么深层次的内容。这就是一阶导数的泰勒法则。这就是我画出的那条线。如果你不记得这个，记得它是切线，用来近似梯度。在脑海中滑动一下。好的，一旦我们这样做，我们就有了最大增加的方向。","start":2108.07,"end":2136.13},{"id":160,"text":"And so then we plug that character in, this fun gradient here. We're going to plug that in in this notation. Now, j may have some higher dimensional structure. So this guy is not a derivative of one variable. It's a partial derivative. If you don't remember that thing, please go ahead and look it up. And the idea here is that what we're going to do is we're going to iterate and walk down in the direction until we get to the...","zh":"因此，我们将这个字符代入，这里的有趣梯度。我们将在这种记号中代入它。现在，j 可能具有更高维的结构。因此，这个家伙不是一个变量的导数。它是偏导数。如果你不记得这个概念，请继续查阅。这里的思路是，我们将进行迭代，并沿着方向行走，直到到达……","start":2136.9,"end":2164.68},{"id":161,"text":"bottom here. And so what's happening is we start with initial guess. I didn't start at zero. I should have slid this over at zero. We start with initial guess. Could be a random number. Could be zero. Interestingly, in modern models, where you start matters. Doesn't matter for least squares. Does matter in general. And then we're going to iterate these equations. We're going to start with our current guess. We're going to compute this gradient or derivative. And we're going to try and minimize it. So we're going to walk in the opposite direction. How far are we going to walk? This thing here is going to tell us. This is called a step size.","zh":"这里底部。因此，发生的事情是我们从初始猜测开始。我没有从零开始。我应该把这滑动到零的位置。我们从初始猜测开始。可以是随机数，也可以是零。有趣的是，在现代模型中，开始的位置很重要。对于最小二乘法来说并不重要。在一般情况下则重要。然后我们将迭代这些方程。我们将从当前猜测开始。我们将计算这个梯度或导数。并尝试最小化它。因此，我们将沿着相反方向行走。我们要走多远？这个东西会告诉我们。这被称为步长。","start":2165.26,"end":2194.85},{"id":162,"text":"This guy here is the step size. Now if you look at this and you're mathematically minded, you may think that this is horrifying. You're computing only first-order information. You're just looking at a gradient.","zh":"这里这个家伙是步长。如果你看着这个并具有数学思维，你可能会觉得这很可怕。你只计算了一阶信息。你只是在查看梯度。","start":2196.92,"end":2209.83},{"id":163,"text":"You are only taking a step size that's not searching to the most minimal part you could get, what's called line search. You're not doing that. You're just kind of grabbing some information about the function locally and taking a quick step. And the reason that can be so disastrous, you may have been told in your calculus classes, is because you could have a function that looks like this. And then here, you walk down and you get stuck in a local regime. So hopefully this is familiar to you. By show of hands, do people understand the difference convexity, non-convexity? Awesome. Perfect. Okay.","zh":"你所采取的步长并不是在寻找你所能得到的最小部分，这种做法被称为线搜索。你并没有这样做。你只是简单地获取一些函数的局部信息并快速地迈出一步。而这种做法可能带来灾难性后果的原因，你可能在微积分课上被告知过，是因为你可能会遇到一个看起来像这样的函数。然后在这里，你向下走，却陷入了一个局部区域。希望这个概念对你来说是熟悉的。举手示意，大家是否理解凸性和非凸性的区别？太棒了。完美。好的。","start":2211.0,"end":2239.92},{"id":164,"text":"So that's how it looks. All right, fantastic. We do this for every single component and we update. That's how we solve it. All right. So when we do this, we get this learning rate or step size. You'll hear me say those terms mean the same thing. I wish that they were unified in my head, but I will use them interchangeably. Apologies in advance.","zh":"这就是它的样子。好的，太棒了。我们对每一个组件都这样做并进行更新。这就是我们解决问题的方式。好的。当我们这样做时，我们会得到一个学习率或步长。你会听到我说这两个术语意思相同。我希望在我的脑海中它们是统一的，但我会交替使用它们。提前道歉。","start":2240.86,"end":2264.25}],"notes":["本段讲解了梯度下降法的基本思想，即通过计算梯度并沿着负梯度方向进行迭代更新，以最小化目标函数。讲者提到梯度是偏导数，适用于多维情况，并强调了初始猜测的重要性，特别是在现代模型中，初始点的选择会影响收敛结果。","讲者指出，梯度下降法仅使用一阶信息（梯度），并采用固定步长进行更新，这可能导致陷入局部极小值。因此，讲者提到需要理解凸性和非凸性的区别，以避免算法失效。","讲者通过举例说明，如果目标函数是非凸的，梯度下降法可能无法找到全局最优解，而只能收敛到局部最优解。因此，理解函数的凸性对于选择合适的优化方法至关重要。","讲者提到，学习率（step size）是控制梯度下降步长的关键参数，它决定了每次迭代的更新幅度。学习率的选择对算法的收敛性和稳定性有重要影响。","讲者强调，虽然学习率和步长在语义上是相同的，但在实际应用中，这两个术语可能被交替使用，但讲者表示希望在自己的理解中统一这两个概念。","讲者最后提到，梯度下降法是一种基础的优化方法，广泛应用于机器学习中，但其局限性也需要被充分认识，特别是在处理非凸问题时。"],"formulas":[{"latex":"f(\\theta) \\text{ 的泰勒展开为 } f(\\theta_0) + f'(\\theta_0)(\\theta - \\theta_0)","symbols":"f(θ) 的泰勒展开式","explanation":"公式正确，表示函数在θ₀处的一阶泰勒展开，适用于可微函数。","evidence":"times x minus x theta, or theta. Whoa, that's bad. All right, I'm going to rewrite this. f of theta 0 plus f prime of theta 0. And then I was just trying to write theta minus theta 0. Nothing deep going on. This Taylor's rule for the first derivative. And that's that line that I've drawn there. And if you don't remember that, remember it's the secant that comes in and approximates the gradient. Slide it down in your head. OK, once we do that, we have the direction of maximal increase."},{"latex":"学习率（step size）控制更新幅度","symbols":"学习率","explanation":"描述正确，学习率控制梯度下降的更新幅度，适用于优化算法中的基本概念。","evidence":"bottom here. And so what's happening is we start with initial guess. I didn't start at zero. I should have slid this over at zero. We start with initial guess. Could be a random number. Could be zero. Interestingly, in modern models, where you start matters. Doesn't matter for least squares. Does matter in general. And then we're going to iterate these equations. We're going to start with our current guess. We're going to compute this gradient or derivative. And we're going to try and minimize it. So we're going to walk in the opposite direction. How far are we going to walk? This thing here is going to tell us. This is called a step size."}],"uncertainties":["可能的术语混淆：讲者提到 'learning rate' 和 'step size' 为同一概念，但未明确说明其数学定义是否完全一致。","未明确的函数形式：讲者提到函数可能具有非凸性，但未给出具体函数形式或数学表达式。","未明确的凸性定义：讲者提到凸性和非凸性的区别，但未给出数学定义或具体例子。"],"diagram":"none","start":2108.07,"end":2264.25,"asr_flags":[],"math_clarifications":["公式1中未明确step size的数学定义，且未说明其与梯度下降的关联，需进一步明确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2108.07,"text":"times x minus x theta, or theta. Whoa, that's bad. All right, I'm going to rewrite this. f of theta 0 plus f prime of theta 0. And then I was just trying to write theta minus theta 0. Nothing deep going on. This Taylor's rule for the first derivative. And that's that line that I've drawn there. And if you don't remember that, remember it's the secant that comes in and approximates the gradient. Slide it down in your head. OK, once we do that, we have the direction of maximal increase."},{"start":2136.9,"text":"And so then we plug that character in, this fun gradient here. We're going to plug that in in this notation. Now, j may have some higher dimensional structure. So this guy is not a derivative of one variable. It's a partial derivative. If you don't remember that thing, please go ahead and look it up. And the idea here is that what we're going to do is we're going to iterate and walk down in the direction until we get to the..."},{"start":2165.26,"text":"bottom here. And so what's happening is we start with initial guess. I didn't start at zero. I should have slid this over at zero. We start with initial guess. Could be a random number. Could be zero. Interestingly, in modern models, where you start matters. Doesn't matter for least squares. Does matter in general. And then we're going to iterate these equations. We're going to start with our current guess. We're going to compute this gradient or derivative. And we're going to try and minimize it. So we're going to walk in the opposite direction. How far are we going to walk? This thing here is going to tell us. This is called a step size."},{"start":2196.92,"text":"This guy here is the step size. Now if you look at this and you're mathematically minded, you may think that this is horrifying. You're computing only first-order information. You're just looking at a gradient."},{"start":2211.0,"text":"You are only taking a step size that's not searching to the most minimal part you could get, what's called line search. You're not doing that. You're just kind of grabbing some information about the function locally and taking a quick step. And the reason that can be so disastrous, you may have been told in your calculus classes, is because you could have a function that looks like this. And then here, you walk down and you get stuck in a local regime. So hopefully this is familiar to you. By show of hands, do people understand the difference convexity, non-convexity? Awesome. Perfect. Okay."},{"start":2240.86,"text":"So that's how it looks. All right, fantastic. We do this for every single component and we update. That's how we solve it. All right. So when we do this, we get this learning rate or step size. You'll hear me say those terms mean the same thing. I wish that they were unified in my head, but I will use them interchangeably. Apologies in advance."}],"speech_gaps":[],"frame":"../frames/v049/013.webp","frame_time":2120.07},{"title":"监督学习中的梯度下降与步长设置","segments":[{"id":165,"text":"Here's me computing the derivative. So those folks who were asking, as you were asking earlier, what's this 2 for? It's so that I can cancel this guy. That's all that's happening. I have my error term here and then a gradient here. Now hopefully this is not calculus that's bothering you. If it bothers you, again, see the Friday lectures. But there's one thing here in the way that I've written it that I want to call out because we're going to use it again and again. This thing here, this error term,","zh":"这里是我计算导数的过程。所以那些之前提问的人，你们问的那个2是为什么？它只是为了抵消这个项。这就是全部的内容。我这里有一个误差项，还有一个梯度。希望这并不是在困扰你们的微积分。如果它困扰你们，再次建议你们观看周五的讲座。但这里有一个我在写作方式上想强调的地方，因为我们将会反复使用它。这个项，这个误差项，","start":2265.15,"end":2289.74},{"id":166,"text":"You basically always have this in a ton of these rules.","zh":"在很多这些规则中，你基本上总是会看到这个。","start":2290.37,"end":2292.91},{"id":167,"text":"You have the error, what you have, and then you have it multiplied by something.","zh":"你有误差，你所拥有的，然后你把它乘以某个东西。","start":2293.11,"end":2296.99},{"id":168,"text":"Here, it's just going to be the gradient of the function.","zh":"在这里，它只是函数的梯度。","start":2297.25,"end":2299.21},{"id":169,"text":"But in general, for a nonlinear, there'd be some extra, extra stuff there.","zh":"但一般来说，在非线性情况下，那里会有额外的额外内容。","start":2299.37,"end":2303.33},{"id":170,"text":"And you'll see this form again and again.","zh":"你们会再次看到这种形式。","start":2304.17,"end":2305.95},{"id":171,"text":"So it's like kind of an artificial way to write it,","zh":"所以这是一种类似人为的写法，","start":2306.11,"end":2307.93},{"id":172,"text":"but it's an important artificial way to write it.","zh":"但这是一种重要的、人为的写法。","start":2307.97,"end":2309.49},{"id":173,"text":"So what's going on here when I compute the derivatives?","zh":"那么当我计算导数的时候，到底发生了什么呢？","start":2310.05,"end":2312.07},{"id":174,"text":"I'm computing the derivatives on all points in my training set.","zh":"我在训练集中的所有点上计算导数。","start":2312.27,"end":2315.23},{"id":175,"text":"Now, if you think about that, if I give you the entire internet","zh":"现在，如果你想想这一点，如果我给你整个互联网","start":2316.17,"end":2319.73},{"id":176,"text":"and asks you to predict the next word in the entire internet,","zh":"并让你预测整个互联网中的下一个词，","start":2319.73,"end":2322.27},{"id":177,"text":"that's going to be pretty slow.","zh":"那将会非常慢。","start":2322.87,"end":2324.01},{"id":178,"text":"If every time you update your model,","zh":"每次你更新你的模型，","start":2324.15,"end":2326.33},{"id":179,"text":"you have to scan the entire internet,","zh":"你都需要扫描整个互联网，","start":2326.39,"end":2327.73},{"id":180,"text":"that seems really slow.","zh":"这看起来真的很慢。","start":2328.65,"end":2329.71},{"id":181,"text":"And so what machine learning people did","zh":"因此，机器学习领域的人们","start":2329.99,"end":2331.59},{"id":182,"text":"is they started to try and get algorithms","zh":"开始尝试开发甚至比这更简单的算法","start":2331.59,"end":2333.31},{"id":183,"text":"which were even simpler than this,","zh":"甚至更傻的算法。","start":2333.31,"end":2335.05},{"id":184,"text":"even dumber than this.","zh":"你会想，梯度下降，你怎么能变得更傻呢？","start":2335.15,"end":2336.29},{"id":185,"text":"You're like, gradient descent, how could you get dumber?","zh":"别担心，机器学习会为你解决这个问题。","start":2336.35,"end":2337.77},{"id":186,"text":"Don't worry, machine learning's got you covered.","zh":"我们还有更多更傻的算法。","start":2337.89,"end":2339.37},{"id":187,"text":"We have a lot more dumb algorithms.","zh":"它是如何工作的？","start":2339.49,"end":2340.53},{"id":188,"text":"How does it work?","zh":"它是如何工作的？","start":2341.21,"end":2341.97},{"id":189,"text":"Okay?","zh":"好的？","start":2344.53,"end":2344.93},{"id":190,"text":"We'll get there in one second.","zh":"我们马上就会讲到。","start":2346.89,"end":2347.81},{"id":191,"text":"So we computed the derivatives.","zh":"所以我们计算了导数。","start":2347.87,"end":2349.03},{"id":192,"text":"we have this one thing i don't need to talk about this all right okay get to it now one thing i did","zh":"我们有这个事情，我就不需要再谈论这个了，好吧，现在开始讲吧，有一点我确实","start":2349.03,"end":2356.95},{"id":193,"text":"want to cover before we get there is apologies this thing here about how do you set the step","zh":"在我们讲到之前，我想先说明一下，对此处这个关于如何设置步长的问题表示歉意","start":2356.95,"end":2361.49},{"id":194,"text":"size okay now when you set this step size think about what it means the step size is basically","zh":"好的，现在当你设置这个步长时，请考虑它的含义，步长基本上","start":2361.49,"end":2370.25},{"id":195,"text":"how sure you are in that information in some way you get the information if you really trusted that","zh":"表示你对这个信息的确定程度，某种程度上，你获得的信息，如果你非常信任这个","start":2370.25,"end":2375.79},{"id":196,"text":"that gradient that it was leading you really steeply down the hill you would","zh":"梯度，它引导你非常陡峭地向下走，那么你就会","start":2375.79,"end":2379.61},{"id":197,"text":"want to take a really big step if you're far away from the optimal right and so","zh":"如果你想离最优解很远时，想要采取一个非常大的步长，那么","start":2379.61,"end":2382.95},{"id":198,"text":"it turns out for functions that are nice in bowl shape which are called convex if","zh":"事实上，对于那些形状良好的函数，也就是所谓的凸函数，如果你离最优解非常远，通常梯度会非常陡峭，对吧，这就是","start":2382.95,"end":2386.05},{"id":199,"text":"you're really far away from the optimal it's usually very steep okay that's the","zh":"存在一个正式的版本，但这就是所发生的情况，因此你想要","start":2386.05,"end":2389.29},{"id":200,"text":"there's a formal version of that but that's what's going on so you want to","zh":"采取一个步长","start":2389.29,"end":2392.23},{"id":201,"text":"take a step","zh":"在机器学习中，我们经常处理非常糟糕的函数。我们处理那些非常弯曲的函数，或者我们不知道表面形状的函数。因此我们倾向于采取相对较小的步长。如果你采取的步长太小，会发生的是你无法足够快地到达最优解。","start":2392.23,"end":2392.55},{"id":202,"text":"Often in machine learning, we're dealing with really nasty functions. We're dealing with those functions that are really curvy, or we don't know what the surface looks like. And so we tend to take relatively small steps. If you take steps that are too small, what happens is you just don't get to the optimum fast enough.","zh":"如果你采取的步长太大，这看起来对我来说相当不错。它说太大，但如果你只采取一步就到达了最优解，你就会非常高兴。所以如果能做到这一点那就太好了。所以这种太大是有点奇怪的。就像炫耀一样。比如，哦，太大了。它工作得太好了。我不确定。一般来说，当步长太大时，我稍后会向你展示，会发生的是你来回震荡。你采取一个步长，但你跳过了最优解。如果你想象一下我们之前谈到的那个碗形，你会从两侧来回震荡。我会向你展示一张这样的图。感谢你的提问。","start":2393.39,"end":2409.54},{"id":203,"text":"If you take steps that are too big, this actually looks pretty good to me. It says too large, but if you just take one step and got to the optimum, you'd be really happy. So that'd be great if you did that. So this is like too large is kind of weird. It's like bragging. Like, oh, it's too large. It works too well. I don't know. In general, what happens in too large, I'll show you in a minute, is that you bounce around. So you take a step, but you shoot past the optimal. So if you picture that bowl that we were talking about before, you would bounce around from both sides. And I'll show you a picture of that. Appreciate the question.","zh":"如果你采取的步长太大，这看起来对我来说其实还挺不错的。它说太大了，但如果你只走一步就到达了最优解，你就会非常高兴。所以如果你能做到这一点，那就太棒了。所以这种太大步长的情况有点奇怪。就像是在炫耀。比如，哦，步长太大了，但它却运作得太好了。我不确定。一般来说，当步长太大时，我稍后会向你展示，会发生的是你来回震荡。你采取一步，但会跳过最优解。所以如果你想象一下我们之前讨论的那个碗形图，你会在两侧来回弹动。我会向你展示这样的图片。感谢你的提问。","start":2411.06,"end":2435.16}],"notes":["本段主要讲解梯度下降算法中步长（learning rate）的设置及其对优化过程的影响。讲者指出，步长的大小决定了模型更新时的步幅，如果步长太大，模型可能会跳过最优解，导致在损失函数的曲面上来回震荡；如果步长太小，模型收敛速度会变慢。讲者还提到，对于凸函数（bowl-shaped function），在远离最优解时梯度较大，因此可以采取较大的步长，而在接近最优解时则需要较小的步长。","讲者通过一个比喻说明步长的含义，即步长反映了对梯度信息的信任程度。如果对梯度非常信任，认为它能很好地引导模型下降，那么可以采取较大的步长；反之，如果对梯度信息不确定，就需要采取较小的步长。","讲者还提到，在实际机器学习中，我们通常处理的是非凸函数，这些函数的表面可能非常复杂，因此通常采用较小的步长以避免震荡。讲者指出，步长的选择是优化过程中的关键问题，需要根据具体情况进行调整。","讲者通过一个例子说明步长过大的后果，即模型可能会在最优解附近来回震荡，而不是直接收敛到最优解。这种现象在凸函数中尤为明显，因为当模型接近最优解时，梯度会变得非常小，如果步长过大，模型可能会跳过最优解。","讲者还提到，对于非凸函数，由于其表面可能非常复杂，因此通常采用较小的步长以确保模型能够稳定地收敛到局部最优解。讲者指出，步长的选择需要在收敛速度和稳定性之间进行权衡。","最后，讲者提到，他将在接下来的讲解中展示步长过大的具体影响，并通过一个图像来说明模型在损失函数曲面上的震荡现象。这表明，步长的选择对优化过程的稳定性和效率具有重要影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2265.15,"end":2435.16,"asr_flags":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":2265.15,"text":"Here's me computing the derivative. So those folks who were asking, as you were asking earlier, what's this 2 for? It's so that I can cancel this guy. That's all that's happening. I have my error term here and then a gradient here. Now hopefully this is not calculus that's bothering you. If it bothers you, again, see the Friday lectures. But there's one thing here in the way that I've written it that I want to call out because we're going to use it again and again. This thing here, this error term,"},{"start":2290.37,"text":"You basically always have this in a ton of these rules."},{"start":2293.11,"text":"You have the error, what you have, and then you have it multiplied by something."},{"start":2297.25,"text":"Here, it's just going to be the gradient of the function."},{"start":2299.37,"text":"But in general, for a nonlinear, there'd be some extra, extra stuff there."},{"start":2304.17,"text":"And you'll see this form again and again."},{"start":2306.11,"text":"So it's like kind of an artificial way to write it,"},{"start":2307.97,"text":"but it's an important artificial way to write it."},{"start":2310.05,"text":"So what's going on here when I compute the derivatives?"},{"start":2312.27,"text":"I'm computing the derivatives on all points in my training set."},{"start":2316.17,"text":"Now, if you think about that, if I give you the entire internet"},{"start":2319.73,"text":"and asks you to predict the next word in the entire internet,"},{"start":2322.87,"text":"that's going to be pretty slow."},{"start":2324.15,"text":"If every time you update your model,"},{"start":2326.39,"text":"you have to scan the entire internet,"},{"start":2328.65,"text":"that seems really slow."},{"start":2329.99,"text":"And so what machine learning people did"},{"start":2331.59,"text":"is they started to try and get algorithms"},{"start":2333.31,"text":"which were even simpler than this,"},{"start":2335.15,"text":"even dumber than this."},{"start":2336.35,"text":"You're like, gradient descent, how could you get dumber?"},{"start":2337.89,"text":"Don't worry, machine learning's got you covered."},{"start":2339.49,"text":"We have a lot more dumb algorithms."},{"start":2341.21,"text":"How does it work?"},{"start":2344.53,"text":"Okay?"},{"start":2346.89,"text":"We'll get there in one second."},{"start":2347.87,"text":"So we computed the derivatives."},{"start":2349.03,"text":"we have this one thing i don't need to talk about this all right okay get to it now one thing i did"},{"start":2356.95,"text":"want to cover before we get there is apologies this thing here about how do you set the step"},{"start":2361.49,"text":"size okay now when you set this step size think about what it means the step size is basically"},{"start":2370.25,"text":"how sure you are in that information in some way you get the information if you really trusted that"},{"start":2375.79,"text":"that gradient that it was leading you really steeply down the hill you would"},{"start":2379.61,"text":"want to take a really big step if you're far away from the optimal right and so"},{"start":2382.95,"text":"it turns out for functions that are nice in bowl shape which are called convex if"},{"start":2386.05,"text":"you're really far away from the optimal it's usually very steep okay that's the"},{"start":2389.29,"text":"there's a formal version of that but that's what's going on so you want to"},{"start":2392.23,"text":"take a step"},{"start":2393.39,"text":"Often in machine learning, we're dealing with really nasty functions. We're dealing with those functions that are really curvy, or we don't know what the surface looks like. And so we tend to take relatively small steps. If you take steps that are too small, what happens is you just don't get to the optimum fast enough."},{"start":2411.06,"text":"If you take steps that are too big, this actually looks pretty good to me. It says too large, but if you just take one step and got to the optimum, you'd be really happy. So that'd be great if you did that. So this is like too large is kind of weird. It's like bragging. Like, oh, it's too large. It works too well. I don't know. In general, what happens in too large, I'll show you in a minute, is that you bounce around. So you take a step, but you shoot past the optimal. So if you picture that bowl that we were talking about before, you would bounce around from both sides. And I'll show you a picture of that. Appreciate the question."}],"speech_gaps":[],"frame":"../frames/v049/014.webp","frame_time":2277.15},{"title":"监督学习设定与优化方法","segments":[{"id":204,"text":"It's not what happens. Yeah, exactly right. And so when you see, I have those for the SGD. So you're exactly right. This is what happens. When we stock for things like SGD, what happens is you bounce around in a ball, a high dimensional ball. That's kind of proportional to that step size. And this has some profound implications. Because if you've taken a statistics course, you've been told that what you really care about is recovering the parameters. You want to be technical about it. You really care about getting the right theta zeros. This is called a recovery guarantee. If I see the data,","zh":"这不是发生的事情。是的，完全正确。当你看到，我有这些用于SGD（随机梯度下降）。所以你完全正确。这就是发生的事情。当我们为像SGD这样的方法进行训练时，发生的是你在高维球体中来回跳跃。这在某种程度上与步长成比例。这有一些深远的含义。因为如果你上过统计学课程，你被告知你真正关心的是恢复参数。你想要技术性地处理这个问题。你真正关心的是得到正确的θ零值。这被称为恢复保证。如果我看到数据，","start":2436.08,"end":2465.48},{"id":205,"text":"then I can prove that I get the right theta zeros. Machine learning people do not care about this. Absolutely not. And they're right not to, if you want to do what we were doing, right? Not if you're doing stats. And what that means is there could be many, many thetas. As long as we're close, good enough. And so a lot of modern machine learning is like running these models and like, when do you stop? Like in statistics, we would do these very fancy tests. When the gradient goes below this and all the rest we can prove, we're within blah, blah, blah, blah, blah of theta naught, the theta star, the optimal theta star.","zh":"那么我就能证明我得到了正确的θ零值。机器学习领域的人并不关心这一点。绝对不关心。如果你想要做我们之前所做的工作，他们是对的。但如果你在做统计学，那就不是了。这意味着可能存在许多许多θ值。只要我们足够接近，就足够好了。因此，现代机器学习的很多内容是运行这些模型，像，什么时候停止？在统计学中，我们会做这些非常复杂的测试。当梯度低于某个值，并且我们能够证明我们接近θ零、θ星，即最优θ星时，我们就会停止。","start":2465.67,"end":2493.53},{"id":206,"text":"In AI, we're like, we ran out of compute credits. We'll stop. Feels good. Let's go to the next model. And that's crazy enough how it works. All right.","zh":"在人工智能领域，我们则是用完了计算信用额度。我们就停止吧。感觉很好。我们去下一个模型吧。这种运作方式有多么疯狂，真是令人惊讶。好的。","start":2494.6,"end":2503.62},{"id":207,"text":"OK, so when you set these at home, you're going to have some assignments where you play with some step sizes. You'll see if it's converging slowly, try and set better step sizes. In a couple of weeks, I'll teach you something called Hyperband, which was one of my personal favorite algorithms. It was written by friends of how to adaptively set these step sizes in a nice way. And it uses something called Bandits, which we need a lot of notation. And once you've gotten familiar with the notation, it's really straightforward. It's Kevin's algorithm. Cool. All right.","zh":"好的，当你在家设置这些参数时，你会有一些作业，让你尝试不同的步长。你会看到它是否收敛缓慢，尝试设置更好的步长。几周后，我会教你们一种叫做Hyperband的算法，这是我个人最喜欢的算法之一。它是由我的朋友开发的，用于以一种很好的方式自适应地设置这些步长。它使用了一种叫做Bandits的机制，这需要大量的符号表示。一旦你熟悉了这些符号，它就非常简单。这是Kevin的算法。酷。好的。","start":2504.28,"end":2529.64},{"id":208,"text":"All right. So this just says what I said and doesn't have all the weird rants in it. All right. Good enough. Okay. Now, as I mentioned, we want to get even simpler because that N, this data set, could be very large. And in fact, machine learning is anchored towards more data, not better estimation.","zh":"好的。所以这仅仅重复了我说的话，并没有包含所有奇怪的抱怨。好的，足够了。嗯，正如我之前提到的，我们想要更加简单，因为这个N，也就是这个数据集，可能非常大。事实上，机器学习更依赖于更多的数据，而不是更好的估计。","start":2530.25,"end":2547.53},{"id":209,"text":"just that's not a formal statement but just intuitively what we're after is we're after these models that we're going to crank tons and tons and tons of data through them we think that's a way to improve them by making them bigger and consume more information than necessarily estimating these parameters very finely and so we'll tell you the techniques that we used to use to estimate those parameters down to like you know 10 significant digits but that's not the vibe that's not what we're going for we want to get bigger models that we're going to kind of fit","zh":"这只是不是一个正式的陈述，但直观上我们想要的是这些模型，我们将通过大量的数据来训练它们，我们认为这是通过让模型更大、吸收更多信息来改进它们的一种方式，而不是精细地估计这些参数。因此，我们会告诉你我们过去用来估计这些参数的技术，精确到小数点后十位左右，但这并不是我们的目标。我们想要的是更大的模型，这些模型我们只是大致地拟合。","start":2548.17,"end":2574.83},{"id":210,"text":"less well than our predecessors. And that's what leads to all kinds of interesting behaviors that we'll tell you about later, like scaling laws and things. So why does that matter? This is really an algorithm that I owe a lot to and that is actually widely used. And it's an old algorithm too. So this is the algorithm update rule written for one different component. We've looked at xj here. It only depends on the jth component. We look at the whole error term, look at all the data, and we update.","zh":"这些模型的拟合效果可能不如我们的前辈。而这会导致各种有趣的行为，我们之后会告诉你，比如扩展定律之类的东西。那么这有什么意义呢？这其实是一个我非常感激的算法，而且它实际上被广泛使用。它还是一种古老的算法。所以这是针对一个不同组件的算法更新规则。我们在这里查看了xj，它只依赖于第j个组件。我们查看整个误差项，查看所有数据，并进行更新。","start":2575.32,"end":2603.25}],"notes":["本段讨论了监督学习中优化算法的差异，特别是在统计学和机器学习领域。在统计学中，人们关注的是参数估计的准确性，即恢复正确的参数值，这被称为恢复保证。而在机器学习中，人们更关注模型的性能，即使参数估计不完全准确，只要模型表现良好即可。","在统计学中，人们会使用复杂的测试来判断是否接近最优参数，而在机器学习中，人们更倾向于使用计算资源来训练模型，直到资源耗尽为止。这种做法虽然简单，但更符合实际应用需求。","本段还提到，随着数据集的增大，机器学习更倾向于使用更多的数据而不是更精确的参数估计。这反映了机器学习的一个核心理念，即通过增加数据量来提升模型性能，而不是追求参数的精确估计。","在优化过程中，梯度下降算法会根据梯度的大小来调整参数，而机器学习中通常会使用更简单的停止条件，如计算资源耗尽，而不是严格的数学证明。","本段还提到，机器学习中使用了如Hyperband这样的算法，用于自适应地调整学习率，这需要大量的符号表示，但一旦熟悉了这些符号，算法就变得非常直观。","最后，本段强调了机器学习与统计学在目标上的不同，机器学习更关注模型的规模和数据量，而不是参数的精确估计。这种差异导致了机器学习中出现了一些有趣的行为，如扩展定律等。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2436.08,"end":2603.25,"asr_flags":[205],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2436.08,"text":"It's not what happens. Yeah, exactly right. And so when you see, I have those for the SGD. So you're exactly right. This is what happens. When we stock for things like SGD, what happens is you bounce around in a ball, a high dimensional ball. That's kind of proportional to that step size. And this has some profound implications. Because if you've taken a statistics course, you've been told that what you really care about is recovering the parameters. You want to be technical about it. You really care about getting the right theta zeros. This is called a recovery guarantee. If I see the data,"},{"start":2465.67,"text":"then I can prove that I get the right theta zeros. Machine learning people do not care about this. Absolutely not. And they're right not to, if you want to do what we were doing, right? Not if you're doing stats. And what that means is there could be many, many thetas. As long as we're close, good enough. And so a lot of modern machine learning is like running these models and like, when do you stop? Like in statistics, we would do these very fancy tests. When the gradient goes below this and all the rest we can prove, we're within blah, blah, blah, blah, blah of theta naught, the theta star, the optimal theta star."},{"start":2494.6,"text":"In AI, we're like, we ran out of compute credits. We'll stop. Feels good. Let's go to the next model. And that's crazy enough how it works. All right."},{"start":2504.28,"text":"OK, so when you set these at home, you're going to have some assignments where you play with some step sizes. You'll see if it's converging slowly, try and set better step sizes. In a couple of weeks, I'll teach you something called Hyperband, which was one of my personal favorite algorithms. It was written by friends of how to adaptively set these step sizes in a nice way. And it uses something called Bandits, which we need a lot of notation. And once you've gotten familiar with the notation, it's really straightforward. It's Kevin's algorithm. Cool. All right."},{"start":2530.25,"text":"All right. So this just says what I said and doesn't have all the weird rants in it. All right. Good enough. Okay. Now, as I mentioned, we want to get even simpler because that N, this data set, could be very large. And in fact, machine learning is anchored towards more data, not better estimation."},{"start":2548.17,"text":"just that's not a formal statement but just intuitively what we're after is we're after these models that we're going to crank tons and tons and tons of data through them we think that's a way to improve them by making them bigger and consume more information than necessarily estimating these parameters very finely and so we'll tell you the techniques that we used to use to estimate those parameters down to like you know 10 significant digits but that's not the vibe that's not what we're going for we want to get bigger models that we're going to kind of fit"},{"start":2575.32,"text":"less well than our predecessors. And that's what leads to all kinds of interesting behaviors that we'll tell you about later, like scaling laws and things. So why does that matter? This is really an algorithm that I owe a lot to and that is actually widely used. And it's an old algorithm too. So this is the algorithm update rule written for one different component. We've looked at xj here. It only depends on the jth component. We look at the whole error term, look at all the data, and we update."}],"speech_gaps":[],"frame":"../frames/v049/015.webp","frame_time":2448.08},{"title":"监督学习设定中的随机梯度下降","segments":[{"id":211,"text":"Now, here I'm just showing that the vector, we're writing in vector notation. This is, again, just why does the vector save us? Well, I just erased all the j's. You will see me very freely go back and forth between these. All right. Okay. This is what I actually wanted to talk about. Okay. Now, consider our rule. So I've said this multiple times already. Sorry, I got excited. This is a thing that I like. So I know it's weird to get excited about this, but I cannot tell you. So just as a small digression.","zh":"现在，我只是在展示这个向量，我们用向量符号来写。这再次只是在问，为什么向量能帮我们？好吧，我刚刚擦去了所有的j。你会看到我非常自由地在这两种方式之间来回切换。好的。好的。这就是我想实际谈论的内容。好的。现在，考虑我们的规则。我已经多次说过这一点了。抱歉，我有点激动。这是一个我喜欢的东西。我知道这听起来有点奇怪，但我无法告诉你。所以，这只是一个小小的离题。","start":2607.17,"end":2630.61},{"id":212,"text":"I worked a lot of my life on the algorithm I'm about to show you. It's extremely simple. We did all kinds of fun things about this algorithm and how we scaled it up and how we built it. It's called stochastic mini-batch or stochastic gradient descent. Or in the old days, it was called incremental gradient. And it goes back at least to the 1950s, Robbins and Monroe. It's like an old classical algorithm. People rediscover it every 10, 15 years. It is the workhorse. So by show of hands, how many people have used PyTorch or anything?","zh":"我花了很多时间在我的生活里研究我现在要展示给你的算法。它极其简单。我们做了各种有趣的事情，关于这个算法如何扩展它，如何构建它。它被称为随机小批量或随机梯度下降。或者在以前，它被称为增量梯度。它至少可以追溯到1950年代，Robbins和Monroe。它就像一个古老的经典算法。人们每隔10、15年就会重新发现它。它是工作马。那么，举手示意一下，有多少人使用过PyTorch或任何其他工具？","start":2631.39,"end":2658.41},{"id":213,"text":"OK, more people use PyTorch. That's dangerous, but awesome. So if you do backprop in there, then you have to have used minibatch. The entire system is set up for you so that you're going to take a small batch of data. You're not going to look at everything in your data set. You're going to feed through five images of cats and dogs at the same time, not all the images of cats and dogs that are on your phone or whatever. So that is the minibatching rule. So how does that look mathematically?","zh":"好的，更多人使用PyTorch。这很危险，但很酷。如果你在其中进行反向传播，那么你一定使用过小批量。整个系统都是为你设置的，让你取一小部分数据。你不会查看数据集中的所有内容。你会同时输入五张猫和狗的图片，而不是你手机或其他设备上所有的猫和狗图片。这就是小批量规则。那么，这在数学上看起来是什么样子？","start":2659.11,"end":2684.31},{"id":214,"text":"The idea is we're going to sample this thing. Mathematically, the way we'll think about it is we're going to take a random set. Now, honestly, when you run, this is a thing that I, again, spend a lot of my life in weird ways. One slice of my life. It wasn't like I was doing it all day long, but it was like a piece of things I was working on. I worked on understanding what happens if you randomly sample versus if you just randomly sort your data and go through it once.","zh":"想法是我们要对这个东西进行抽样。从数学上讲，我们会这样考虑：我们取一个随机集合。说实话，当你运行这个时，这又是我花了很多时间以奇怪的方式研究的一个方面。我生活的一个切片。并不是我整天都在做这件事，但它是我所从事的工作的一部分。我研究了如果你随机抽样与如果你只是随机排序数据并一次遍历它们会发生什么。","start":2689.67,"end":2715.66},{"id":215,"text":"Turns out they're kind of okay. And that latter one is basically what we do. Took a lot of math to prove that those things are about the same for a variety of reasons. When you get to the end of the data set, it gets nasty. The first part of the data set, they're obviously kind of close. But this is what SGD is. Sample from your data set. Don't pick those samples in a weird way. Now, what could go wrong if you pick those samples in a weird way? Just intuitively. If, for example, let's say that I showed you all the cats first, then I showed you all the dogs.","zh":"结果发现它们其实还不错。而后者基本上就是我们所做的。为了证明这些在各种原因下大致相同，我们花了很多数学推导。当你到达数据集的末尾时，情况会变得很糟糕。数据集的前半部分，它们显然比较接近。但这就是随机梯度下降（SGD）的工作方式。从你的数据集中进行抽样。不要以奇怪的方式选择这些样本。如果以奇怪的方式选择这些样本，会发生什么问题？直观上来说。例如，假设我先向你展示了所有的猫，然后展示了所有的狗。","start":2718.04,"end":2746.9},{"id":216,"text":"And you put them in those little batches.","zh":"并将它们分组到这些小批次中。","start":2748.65,"end":2750.31},{"id":217,"text":"What do you think would happen to the underlying model?","zh":"你认为这会对底层模型产生什么影响？","start":2750.35,"end":2752.11},{"id":218,"text":"It would first just keep predicting cats,","zh":"它会先一直预测猫，","start":2753.17,"end":2754.91},{"id":219,"text":"and then it would stop predicting cats for everything.","zh":"然后停止对所有事物预测猫。","start":2755.09,"end":2756.81},{"id":220,"text":"Exactly right.","zh":"完全正确。","start":2757.13,"end":2757.59},{"id":221,"text":"So it would learn some trivial surface that was like only predicting the cats.","zh":"它会学习到一个非常表面的特征，只预测猫。","start":2757.65,"end":2760.49},{"id":222,"text":"You got it exactly right.","zh":"你完全正确。","start":2760.55,"end":2761.35},{"id":223,"text":"And it would get really confident about cats,","zh":"并且它会对猫变得非常自信，","start":2761.53,"end":2763.61},{"id":224,"text":"but it wouldn't know anything about dogs.","zh":"但它对狗却一无所知。","start":2763.61,"end":2764.69},{"id":225,"text":"Then it would see the dogs, and it would race to the other side.","zh":"然后它会看到狗，就会迅速跑到另一边去。","start":2764.81,"end":2767.05},{"id":226,"text":"So why do I tell you this?","zh":"那么我为什么告诉你们这个呢？","start":2767.77,"end":2769.01},{"id":227,"text":"Intuitively, what do you want in that batch?","zh":"从直觉上来说，你们在那个批次中希望得到什么？","start":2769.33,"end":2770.89},{"id":228,"text":"You want it to be kind of a sample of the population.","zh":"你们希望它能够代表总体的一个样本。","start":2770.99,"end":2772.99},{"id":229,"text":"This is the second statistical assumption we're making.","zh":"这是我们在做的第二个统计学假设。","start":2773.37,"end":2775.43},{"id":230,"text":"the first one was my training set reflects the real world my second one is","zh":"第一个假设是我的训练集反映了现实世界，第二个假设是","start":2775.43,"end":2779.87},{"id":231,"text":"my mini batches again reflect my overall data set that one as I start to get more","zh":"我的小批量数据再次反映了我整体的数据集，当我开始获得更多数据时","start":2779.87,"end":2785.95}],"notes":["本段继续讨论监督学习中的随机梯度下降（SGD）算法，强调了在训练过程中使用小批量数据的重要性。讲者指出，SGD是一种经典算法，最早可追溯至1950年代，由Robbins和Monroe提出。该算法在现代深度学习框架如PyTorch中被广泛应用，因为其能够高效地处理大规模数据集。","讲者通过一个直观的例子说明了如果在训练过程中不随机采样数据，而是按类别顺序输入数据，会导致模型学习到一个过于简单的表面特征，例如只预测猫而不学习狗的特征。这说明了随机采样的重要性，以确保每个小批量数据能够代表整个数据集的分布。","讲者提到，随机采样与随机排序数据在某些情况下效果相近，但当数据集遍历结束时，随机排序可能会导致模型性能下降。因此，随机采样是SGD算法中一个关键的统计假设，即每个小批量数据应是整个数据集的一个代表性样本。","讲者指出，SGD的第二个统计假设是小批量数据应反映整个数据集的分布，这与第一个假设（训练集反映真实世界）相辅相成。这一假设确保了模型在训练过程中能够学习到数据的全局特征，而不是局部特征。","讲者通过提问引导学生思考在小批量数据中应包含哪些内容，以确保模型能够正确学习。这表明，随机采样是SGD算法成功的关键因素之一，能够避免模型过早收敛到局部最优解。","讲者强调了SGD算法的广泛应用和其在现代机器学习中的重要性，同时指出其背后的数学原理和统计假设。这表明，SGD不仅是一个简单的优化算法，还涉及复杂的统计和计算理论。"],"formulas":[],"uncertainties":["the first one was my training set reflects the real world my second one is","my mini batches again reflect my overall data set that one as I start to get more"],"diagram":"none","start":2607.17,"end":2785.95,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":2607.17,"text":"Now, here I'm just showing that the vector, we're writing in vector notation. This is, again, just why does the vector save us? Well, I just erased all the j's. You will see me very freely go back and forth between these. All right. Okay. This is what I actually wanted to talk about. Okay. Now, consider our rule. So I've said this multiple times already. Sorry, I got excited. This is a thing that I like. So I know it's weird to get excited about this, but I cannot tell you. So just as a small digression."},{"start":2631.39,"text":"I worked a lot of my life on the algorithm I'm about to show you. It's extremely simple. We did all kinds of fun things about this algorithm and how we scaled it up and how we built it. It's called stochastic mini-batch or stochastic gradient descent. Or in the old days, it was called incremental gradient. And it goes back at least to the 1950s, Robbins and Monroe. It's like an old classical algorithm. People rediscover it every 10, 15 years. It is the workhorse. So by show of hands, how many people have used PyTorch or anything?"},{"start":2659.11,"text":"OK, more people use PyTorch. That's dangerous, but awesome. So if you do backprop in there, then you have to have used minibatch. The entire system is set up for you so that you're going to take a small batch of data. You're not going to look at everything in your data set. You're going to feed through five images of cats and dogs at the same time, not all the images of cats and dogs that are on your phone or whatever. So that is the minibatching rule. So how does that look mathematically?"},{"start":2689.67,"text":"The idea is we're going to sample this thing. Mathematically, the way we'll think about it is we're going to take a random set. Now, honestly, when you run, this is a thing that I, again, spend a lot of my life in weird ways. One slice of my life. It wasn't like I was doing it all day long, but it was like a piece of things I was working on. I worked on understanding what happens if you randomly sample versus if you just randomly sort your data and go through it once."},{"start":2718.04,"text":"Turns out they're kind of okay. And that latter one is basically what we do. Took a lot of math to prove that those things are about the same for a variety of reasons. When you get to the end of the data set, it gets nasty. The first part of the data set, they're obviously kind of close. But this is what SGD is. Sample from your data set. Don't pick those samples in a weird way. Now, what could go wrong if you pick those samples in a weird way? Just intuitively. If, for example, let's say that I showed you all the cats first, then I showed you all the dogs."},{"start":2748.65,"text":"And you put them in those little batches."},{"start":2750.35,"text":"What do you think would happen to the underlying model?"},{"start":2753.17,"text":"It would first just keep predicting cats,"},{"start":2755.09,"text":"and then it would stop predicting cats for everything."},{"start":2757.13,"text":"Exactly right."},{"start":2757.65,"text":"So it would learn some trivial surface that was like only predicting the cats."},{"start":2760.55,"text":"You got it exactly right."},{"start":2761.53,"text":"And it would get really confident about cats,"},{"start":2763.61,"text":"but it wouldn't know anything about dogs."},{"start":2764.81,"text":"Then it would see the dogs, and it would race to the other side."},{"start":2767.77,"text":"So why do I tell you this?"},{"start":2769.33,"text":"Intuitively, what do you want in that batch?"},{"start":2770.99,"text":"You want it to be kind of a sample of the population."},{"start":2773.37,"text":"This is the second statistical assumption we're making."},{"start":2775.43,"text":"the first one was my training set reflects the real world my second one is"},{"start":2779.87,"text":"my mini batches again reflect my overall data set that one as I start to get more"}],"speech_gaps":[],"frame":"../frames/v049/016.w
