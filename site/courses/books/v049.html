st started teaching this course till now is the amount of what you would say"},{"start":3814.53,"text":"is CapEx, the amount of capital expenditure to build these models. We're talking about"},{"start":3818.51,"text":"building gigawatt facilities. This was unimaginable. Gigawatt is a lot of compute. Okay. Those"},{"start":3823.93,"text":"giga multi gigawatt facilities, you have to keep them at high utilization. So if you ask"},{"start":3828.41,"text":"asked me what I care about, I would say,"}],"speech_gaps":[],"frame":"../frames/v049/022.webp","frame_time":3678.13},{"title":"监督学习设定与模型优化","segments":[{"id":385,"text":"I care quite a bit about making sure the utilization of the model is high, that I get in more steps. The statistical concerns that we'll talk about they don't take a complete back seat, but if you're doing it like if you see how people report their training, they report MFU model flops, you know utilization. They care about how much they're getting out of those GPUs. The statistical properties are sometimes harder to pin down, and that's one thing by the way that is actually quite a blessing. Like one thing that I think is very underappreciated about machine learning, you can get this. So we're going to teach you these different","zh":"我非常关心确保模型的利用率很高，能够进行更多的步骤。我们将会讨论的统计问题并不完全被忽视，但如果你看到人们如何报告他们的训练情况，他们会报告模型的MFU（模型浮点运算次数），也就是利用率。他们关心的是如何从这些GPU中获取更多的性能。统计特性有时很难明确界定，这也是实际上非常有益的一点。我认为机器学习中这一点被低估了，你能够获得这样的结果。因此，我们将教你这些不同的构建模块。","start":3830.38,"end":3859.68},{"id":386,"text":"different building blocks. But sometimes what happens in this field is that people think those building blocks in their head occupy entirely different spaces. One of the beautiful things about machine learning, which is kind of amazing, is many of these things work. Like one experiment, like I'm going to tell you in the next lecture how you should use a different loss function for classification.","zh":"但有时在这个领域中，人们会认为这些构建模块在脑海中占据完全不同的空间。机器学习的一个美丽之处，这有点令人惊讶，是许多这些方法都有效。例如，在下一讲中，我会告诉你如何为分类任务使用不同的损失函数。","start":3859.69,"end":3877.39},{"id":387,"text":"But it kind of works if you use the loss function from this, even though it kind of makes no sense. And I'll show you why it shouldn't make much sense, but it will still kind of work. There's a robustness to the underlying elements that is pretty surprising. So it's very easy to fixate on the statistical definitions of what's going on. And we will tell you the most important. But I want to highlight that sometimes tweaking the batch size or tweaking these rates doesn't matter nearly as much as making your model get bigger or running it for longer. And so those principal components are the ones that have driven the progress.","zh":"但如果你使用这个损失函数，它似乎没有意义，它仍然可以工作。我会向你展示为什么它不应该有意义，但它仍然会起作用。底层元素的鲁棒性相当令人惊讶。因此，很容易专注于统计定义上正在发生的事情。我们将告诉你最重要的内容。但我想强调的是，有时调整批量大小或调整这些率并不像让模型更大或运行更长时间那样重要。因此，这些主要成分是推动进展的关键。","start":3878.32,"end":3907.82},{"id":388,"text":"Over the last couple of years. That may saturate at some point. Please. Yeah, we just normalize it into the alpha because it's a number that we don't know how to interpret anyway, so we might as well just multiply it by something. Yeah, awesome. Great questions.","zh":"在过去几年中。这可能会在某个时候饱和。请。是的，我们只是将其归一化到alpha中，因为我们不知道如何解释这个数字，所以不妨直接乘以某个数。是的，太棒了。很好的问题。","start":3907.92,"end":3931.05},{"id":389,"text":"Okay. All right. So I promised this graph earlier. It's not that great. If you were really on the edge of your seat waiting for it, apologies. But this is how it works. So these are the batch versus gradient descent on a very smooth problem.","zh":"好的。那么我之前承诺的这张图。它并不是很好。如果你一直在焦急地等待它，我表示歉意。但这就是它的运作方式。这些是批量大小与梯度下降在非常平滑的问题上的对比。","start":3933.18,"end":3945.66},{"id":390,"text":"Okay, so a smooth problem. What is it? How do I know this problem is smooth by looking at it? Well, these things here are the isoclines for the function. That's an equal loss. Okay, that's where the loss is all one value. This is a quadratic that we've been looking at. Quadratics, if you remember, produce ellipses as isoclines. Is that familiar? Show of hands familiar?","zh":"好的，这是一个光滑的问题。什么是光滑问题？我怎么知道这个问题是光滑的？这些是这个函数的等值线。也就是等损失线。好的，这是损失值都相同的地方。这是一个我们一直在研究的二次函数。如果你还记得，二次函数的等值线是椭圆。这熟悉吗？举手示意一下是否熟悉？","start":3946.29,"end":3964.65},{"id":391,"text":"OK. I'll remember next time. All right. So that's what they look like. We'll come back to that in more depth. Not critical now. So this function is very smooth and bowl-shaped. Because this says all of the losses here and all of the losses here are the same. These guys are all, each rung is kind of the same. So it's this nice bowl-shaped function. Gradient descent goes down and comes right to the optimal value, which we've put right here in the middle.","zh":"好的，我会记住下次。那么这就是它们的形状。我们之后会更深入地讨论这一点。现在不是关键点。所以这个函数非常光滑，呈碗状。因为这里所有的损失值和这里所有的损失值都相同。这些点，每个点都差不多。因此这是一个很好的碗状函数。梯度下降会向下移动，并直接到达最优值，我们已经把最优值放在中间这里。","start":3965.68,"end":3987.88},{"id":392,"text":"SGD, as we talked about, makes these little wiggles. Sometimes it's going the right direction, sometimes it's going the wrong direction. It bounces around. And if alpha is set too large, it will bounce around in a ball, okay? And it won't get close to the optimal.","zh":"正如我们讨论的，随机梯度下降（SGD）会产生这些小的波动。有时候它朝着正确方向移动，有时候则朝着错误方向移动。它会在周围来回跳跃。如果学习率α设置得太大，它会在一个球形区域内来回跳跃，对吧？并且无法接近最优值。","start":3989.49,"end":4001.97}],"notes":["本段主要讨论了机器学习中模型利用效率的重要性，以及统计性质在模型训练中的作用。讲者指出，虽然统计性质有时难以确定，但这种不确定性反而成为机器学习的优势之一。此外，讲者提到模型的规模和训练时间对性能的影响远大于调整批量大小或学习率。","讲者强调了机器学习中不同构建模块的相互作用，指出这些模块虽然在概念上可能属于不同领域，但它们在实际应用中往往能协同工作。例如，即使使用不合理的损失函数，模型仍可能表现出良好的性能，这体现了底层元素的鲁棒性。","讲者提到，模型的优化过程涉及梯度下降和随机梯度下降（SGD）的对比。SGD在优化过程中会表现出波动，而学习率（alpha）的设置对收敛性有重要影响。如果学习率过大，SGD可能会在最优解附近震荡，无法有效收敛。","讲者通过一个光滑问题的示意图，解释了如何通过等损失线（isoclines）来判断问题的光滑性。对于二次函数，等损失线形成椭圆，这表明问题具有光滑的结构，梯度下降方法可以有效地找到最优解。","讲者指出，模型的优化过程需要关注统计定义和实际性能之间的平衡。虽然统计性质可能难以精确确定，但模型的规模和训练时间仍然是提升性能的关键因素。","讲者通过示意图展示了梯度下降和随机梯度下降在光滑问题上的表现，强调了学习率对收敛速度和稳定性的影响。同时，讲者提到，模型的优化过程需要综合考虑多个因素，如批量大小、学习率和模型规模。"],"formulas":[],"uncertainties":["MFU model flops"],"diagram":"none","start":3830.38,"end":4001.97,"asr_flags":[],"math_clarifications":["原文中未提供完整的数学公式或上下文，无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":3830.38,"text":"i care quite a bit about making sure the utilization of the model is high that i get in more steps the statistical concerns that we'll talk about they don't take a complete back seat but if you're doing it like if you see how people report their training they report mfu model flops you know utilization they care about how much they're getting out of those gpus the statistical properties are sometimes harder to pin down and that's one thing by the way that is actually quite a blessing like one thing that i think is very underappreciated about machine learning you can get this so we're going to teach you these different"},{"start":3859.69,"text":"different building blocks. But sometimes what happens in this field is that people think those building blocks in their head occupy entirely different spaces. One of the beautiful things about machine learning, which is kind of amazing, is many of these things work. Like one experiment, like I'm going to tell you in the next lecture how you should use a different loss function for classification."},{"start":3878.32,"text":"But it kind of works if you use the loss function from this, even though it kind of makes no sense. And I'll show you why it shouldn't make much sense, but it will still kind of work. There's a robustness to the underlying elements that is pretty surprising. So it's very easy to fixate on the statistical definitions of what's going on. And we will tell you the most important. But I want to highlight that sometimes tweaking the batch size or tweaking these rates doesn't matter nearly as much as making your model get bigger or running it for longer. And so those principal components are the ones that have driven the progress."},{"start":3907.92,"text":"over the last couple of years. That may saturate at some point. Please. Yeah, we just normalize it into the alpha because it's a number that we don't know how to interpret anyway, so we might as well just multiply it by something. Yeah, awesome. Great questions."},{"start":3933.18,"text":"Okay. All right. So I promised this graph earlier. It's not that great. If you were really on the edge of your seat waiting for it, apologies. But this is how it works. So these are the batch versus gradient descent on a very smooth problem."},{"start":3946.29,"text":"Okay, so a smooth problem. What is it? How do I know this problem is smooth by looking at it? Well, these things here are the isoclines for the function. That's an equal loss. Okay, that's where the loss is all one value. This is a quadratic that we've been looking at. Quadratics, if you remember, produce ellipses as isoclines. Is that familiar? Show of hands familiar?"},{"start":3965.68,"text":"OK. I'll remember next time. All right. So that's what they look like. We'll come back to that in more depth. Not critical now. So this function is very smooth and bowl-shaped. Because this says all of the losses here and all of the losses here are the same. These guys are all, each rung is kind of the same. So it's this nice bowl-shaped function. Gradient descent goes down and comes right to the optimal value, which we've put right here in the middle."},{"start":3989.49,"text":"SGD, as we talked about, makes these little wiggles. Sometimes it's going the right direction, sometimes it's going the wrong direction. It bounces around. And if alpha is set too large, it will bounce around in a ball, okay? And it won't get close to the optimal."}],"speech_gaps":[],"frame":"../frames/v049/023.webp","frame_time":3842.38},{"title":"监督学习设定中的优化与训练行为","segments":[{"id":393,"text":"So one trick that people do, by the way, is they do something called averaging the iterates. They may average over a trajectory of those bounces to kind of simulate a larger batch size. But hopefully, intuitively, this makes sense. The reason I highlight this for you is when you're training a model, you will observe this behavior. You will see the loss start to go and bounce around. And you'll realize, maybe I set alpha too high, right? So those are the kinds of things that you'll see.","zh":"顺便提一下，人们会使用一种叫做平均迭代的方法。他们可能会在这些弹跳轨迹上进行平均，以模拟更大的批量大小。但希望你能直观地理解这一点。我之所以强调这一点，是因为当你训练模型时，你会观察到这种行为。你会看到损失开始上下波动。你会意识到，也许我把学习率设得太高了，对吧？这就是你可能会看到的情况。","start":4002.46,"end":4027.6},{"id":394,"text":"Now, in machine learning, in the second half of the course, the functions will not be so nice. They will not be these nice bowl-shaped functions, these convex functions. They're going to be nasty. And when they're nasty, then this is relying on the fact that it's quite smooth to go fast, to get rapidly down to the optimal. This is not relying on this. This is just kind of drunkenly stumbling its way to the loss function. And this one we prefer, as weird as it is, but for all the reasons I outlined. Okay, cool. All right.","zh":"现在，在机器学习中，课程后半部分的函数将不会这么美好。它们不会是这些漂亮的碗状函数，这些凸函数。它们会很糟糕。当它们很糟糕时，这就依赖于函数足够平滑，从而快速下降到最优解。这不是依赖于这一点。这更像是醉酒般地摸索着走向损失函数。而我们更喜欢这种方法，尽管它看起来很奇怪，但正如我之前所列出的所有原因。好的，不错。好的。","start":4028.29,"end":4056.27},{"id":395,"text":"Okay, so just to make sure that I got across what I wanted to get across, our goal was to optimize a loss function to find a good predictor. We did that by minimizing this loss. We talked a lot. I talked a lot about what it means to kind of assume about your data, that it's representative of the world. We'll talk about that even more later.","zh":"好的，为了确保我传达了我想传达的内容，我们的目标是优化损失函数以找到一个好的预测器。我们通过最小化这个损失来实现这一点。我们讨论了很多，我谈论了很多关于对数据做出假设的意义，即数据代表了世界。我们之后还会更深入地讨论这一点。","start":4058.71,"end":4075.47},{"id":396,"text":"We learned about an algorithm which hopefully looked relatively simple to you. All the folks here knew about derivatives and computing gradients and partial derivatives. Awesome. And we did this kind of weird, simple thing where we started looking at not our entire data, but a batch of data, a subset of data. And when we did that, that somehow unlocked a bunch of runtime performance and, I claim, these really large models. That algorithm was called stochastic gradient descent. We talked about all the ways to select batches. The most important one is select them at random.","zh":"我们学习了一个算法，希望它对你来说看起来相对简单。这里的所有人都了解导数、计算梯度和偏导数。太棒了。我们做了一件有点奇怪但简单的事情，即不查看全部数据，而是查看数据的一个批次，一个子集。当我们这样做时，某种方式解锁了大量运行时性能，我声称，这些非常大的模型。这个算法被称为随机梯度下降。我们讨论了所有选择批次的方法。最重要的是随机选择它们。","start":4076.38,"end":4104.38},{"id":397,"text":"We touched a little bit on these trade-offs of using the right batch size through our conversations about when it's too small and when it's too large. What are the considerations inside a batch? And that's to hopefully give you a feel when you start to actually play with and tune some of these models. That's different, by the way, than what you would do if you were training a traditional stats model where you were trying to get down to the optimal value. There's just different concerns. And hopefully some of those concerns have been highlighted and will become more clear over the next couple of lectures. Any questions on this before I move on? Please.","zh":"我们在讨论批次大小太小和太大时，简要提到了使用合适批次大小的权衡。在批次内部有哪些考虑因素？希望这能帮助你们在实际开始调整这些模型时，有一个大致的感觉。顺便说一句，这与你们在训练传统统计模型时的做法是不同的，那时你们的目标是找到最优值。存在不同的关注点。希望其中的一些关注点已经被强调，并将在接下来的几节课中变得更加清晰。在我继续之前，有关这个问题还有问题吗？请。","start":4105.84,"end":4136.43},{"id":398,"text":"How do you know when to stop?","zh":"你如何知道何时停止？","start":4138.03,"end":4139.01},{"id":399,"text":"Awesome. Great question. So the question is, as you're bouncing around near the optimum, how do you know where to stop? And unfortunately, you don't. You don't know if you're bouncing around. These models have these very weird behaviors. So one of the things that they have is a behavior sometimes, and if you watch and measure them, all of a sudden, they're running, they're running, the loss is kind of doing something, and then all of a sudden, a capability turns on. So it just gets a little bit better. The representation clicks in when you're training more sophisticated models. So you don't know if you're stuck in kind of one of those local areas.","zh":"太棒了。非常好的问题。问题是，当你在最优值附近来回震荡时，如何知道何时停止？不幸的是，你并不知道。你不知道自己是否在震荡。这些模型具有非常奇怪的行为。其中一种行为是，当你观察并测量它们时，它们突然开始运行，损失函数似乎在做某些事情，然后突然间，某种能力被激活了。它只是变得稍微好一点。当你训练更复杂的模型时，表示会突然变得清晰。因此，你不知道自己是否陷入了其中的一个局部区域。","start":4141.18,"end":4167.88}],"notes":["本段主要讲解了在监督学习中，优化损失函数时可能遇到的训练行为，如损失值在最优解附近波动的现象。讲者提到，这种波动可能是因为学习率设置过高，从而导致模型在最优解附近来回震荡。此外，还提到在训练过程中，模型可能会突然表现出更好的性能，这种现象在训练更复杂的模型时尤为明显。","讲者指出，在机器学习的后半部分，目标函数通常不是光滑的凸函数，而是更复杂的非凸函数。这种情况下，优化过程可能更加困难，模型可能需要通过随机梯度下降等方法进行探索，而不是直接快速收敛到最优解。","讲者强调了在监督学习中，优化目标是找到一个良好的预测器，这通常通过最小化损失函数来实现。同时，讲者还提到，假设数据能够代表真实世界是重要的前提，这一点将在后续课程中进一步探讨。","讲者介绍了随机梯度下降（SGD）算法，并指出其通过使用数据子集（即小批量）来提高计算效率。讲者还提到，选择小批量时，随机选择是最重要的一种方式。","讲者讨论了批量大小对训练过程的影响，包括当批量过小时可能带来的噪声问题，以及当批量过大时可能带来的计算负担。此外，讲者还指出，训练模型时需要考虑不同的因素，这些因素与传统统计模型的训练目标有所不同。","讲者最后提出了一个关于何时停止训练的问题，并指出在训练过程中，模型可能在最优解附近波动，因此很难确定何时停止训练。讲者还提到，模型可能会突然表现出更好的性能，这种现象在训练更复杂的模型时尤为明显。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4002.46,"end":4167.88,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4002.46,"text":"So one trick that people do, by the way, is they do something called averaging the iterates. They may average over a trajectory of those bounces to kind of simulate a larger batch size. But hopefully, intuitively, this makes sense. The reason I highlight this for you is when you're training a model, you will observe this behavior. You will see the loss start to go and bounce around. And you'll realize, maybe I set alpha too high, right? So those are the kinds of things that you'll see. Now, in machine learning, in the second half of the course,"},{"start":4028.29,"text":"the functions will not be so nice. They will not be these nice bowl-shaped functions, these convex functions. They're going to be nasty. And when they're nasty, then this is relying on the fact that it's quite smooth to go fast, to get rapidly down to the optimal. This is not relying on this. This is just kind of drunkenly stumbling its way to the loss function. And this one we prefer, as weird as it is, but for all the reasons I outlined. Okay, cool. All right."},{"start":4058.71,"text":"Okay, so just to make sure that I got across what I wanted to get across, our goal was to optimize a loss function to find a good predictor. We did that by minimizing this loss. We talked a lot. I talked a lot about what it means to kind of assume about your data, that it's representative of the world. We'll talk about that even more later."},{"start":4076.38,"text":"We learned about an algorithm which hopefully looked relatively simple to you. All the folks here knew about derivatives and computing gradients and partial derivatives. Awesome. And we did this kind of weird, simple thing where we started looking at not our entire data, but a batch of data, a subset of data. And when we did that, that somehow unlocked a bunch of runtime performance and, I claim, these really large models. That algorithm was called stochastic gradient descent. We talked about all the ways to select batches. The most important one is select them at random."},{"start":4105.84,"text":"We touched a little bit on these trade-offs of using the right batch size through our conversations about when it's too small and when it's too large. What are the considerations inside a batch? And that's to hopefully give you a feel when you start to actually play with and tune some of these models. That's different, by the way, than what you would do if you were training a traditional stats model where you were trying to get down to the optimal value. There's just different concerns. And hopefully some of those concerns have been highlighted and will become more clear over the next couple of lectures. Any questions on this before I move on? Please."},{"start":4138.03,"text":"How do you know when to stop?"},{"start":4141.18,"text":"Awesome. Great question. So the question is, as you're bouncing around near the optimum, how do you know where to stop? And unfortunately, you don't. You don't know if you're bouncing around. These models have these very weird behaviors. So one of the things that they have is a behavior sometimes, and if you watch and measure them, all of a sudden, they're running, they're running, the loss is kind of doing something, and then all of a sudden, a capability turns on. So it just gets a little bit better. The representation clicks in when you're training more sophisticated models. So you don't know if you're stuck in kind of one of those local areas."}],"speech_gaps":[],"frame":"../frames/v049/024.webp","frame_time":4014.46},{"title":"监督学习设定与模型复杂性","segments":[{"id":400,"text":"Or if you're going to get to something if you're really close to the answer. And so that is actually a very computationally difficult problem. For everything in the next couple of sections, it's going to turn out that the models, if you're familiar, are going to be convex underneath the covers. They're going to be generalized linear models. That's what we're going to talk about for two weeks. In those situations, we can actually tell how far we are from the optimum. I'm not going to beat you in the head about this too much, because you should just take Steven's course. It's wonderful. I love Steven Boyd.","zh":"或者，如果你离正确答案非常接近，你就能得到一些结果。因此，这实际上是一个计算上非常困难的问题。在接下来的几节中，你会发现这些模型，如果你熟悉的话，本质上都是凸的。它们将是广义线性模型。接下来的两周，我们都会讨论这个内容。在这些情况下，我们实际上可以判断自己离最优解有多远。我不会过多地强调这一点，因为你应该去上Steven的课。那门课很棒。我非常喜欢Steven Boyd。","start":4168.71,"end":4192.75},{"id":401,"text":"But also, those won't really do us much good when we get to the wild world of neural nets and unsupervised and all the rest. And the truth is there, we don't know. And so how do you run? You kind of run like if I watch how I do it or my students do it, you look at like weights and biases, you watch so the thing goes down, you're like, I don't know, if I train for another two days, I can't go out with my friends.","zh":"但当我们进入神经网络、无监督学习等更复杂的领域时，这些方法就不太有用了。事实上，我们并不知道该怎么办。那么你该怎么办呢？你大概会像这样运行：如果你看着自己或学生是如何做的，你会观察权重和偏差，看着这些数值下降，然后你会想，我不知道，如果再训练两天，我就不能和朋友们出去了。","start":4193.73,"end":4212.51},{"id":402,"text":"I'm going to cut it off now. And that is unfortunately how it works. And so you basically provision. We're doing a pretty big train right now. The way we're provisioning it is like, well, we have these GPUs for two months for this project that are donated, some DNA model thing, whatever. We're going to train that right now. And so it kind of just is an engineering consideration more than it's a principled one.","zh":"我现在就停下来吧。不幸的是，事情就是这样运作的。因此，你基本上是在进行资源分配。我们现在正在进行一个相当大的训练。我们进行资源分配的方式是，我们有这些捐赠的GPU，用于这个项目两个月，一些DNA模型之类的东西，不管怎样。我们现在就来训练它。因此，这更像是一个工程上的考虑，而不是一个原则性的考虑。","start":4213.26,"end":4233.84},{"id":403,"text":"I'm not really embarrassed to say, because the stuff we've been building is great. I used to be embarrassed when nothing worked. So my wife said, you know, we've been together forever. She's like, you know, you've been building the same demo since I've known you, since undergrad, but now stuff works, so it's okay. So, all right. Anyway, so yeah, so these squares are really special. I want to do this basically just for notation. We have a couple minutes left, so I want to just highlight this notation about normal equations. If you haven't seen this before,","zh":"我不觉得不好意思说，因为我们一直在构建的东西真的很棒。我以前如果什么都没成功，就会感到不好意思。我的妻子说，你知道的，我们在一起已经很久了。她会说，你知道的，你从我认识你以来，从本科开始，一直在做同样的演示，但现在事情开始起作用了，所以没关系。好吧，总之，这些平方真的很有意思。我想这样做主要是为了记号。我们还有几分钟时间，我想简要强调一下关于正规方程的记号。如果你以前没看过这个内容，","start":4235.1,"end":4262.04},{"id":404,"text":"Take a look, do a review. So we're going to derive the normal equations. So mainly this is to make sure you're comfortable with the notation, if I'm honest, but also to make sure that you know basic things about linear algebra. So if you don't know what rank is, you don't know what inverses are, then you should study up because we use that terminology pretty freely. So we have some loss function here.","zh":"看一下，复习一下。因此，我们将推导正规方程。说实话，这主要是为了确保你们对符号感到舒适，同时也为了确保你们了解线性代数的一些基础知识。如果你们不知道秩是什么，不知道逆矩阵是什么，那么你们应该好好学习一下，因为我们会频繁使用这些术语。因此，我们这里有一个损失函数。","start":4263.52,"end":4288.43},{"id":405,"text":"We have some loss function j here. We have, again, our vector notation. This is actually now going to be these n's are going to be laid out by rows. This is going to be n by d matrix. So it's going to have n rows where the examples are there, and then d plus 1.","zh":"我们这里有一个损失函数 j。我们再次使用向量符号。现在，这些 n 将以行的形式排列。这将是一个 n 乘 d 的矩阵。它将有 n 行，其中包含示例，然后是 d 加 1。","start":4290.16,"end":4303.0},{"id":406,"text":"are the feature size that we talked about. So this is examples. This is each one of our examples. Then we're going to have correspondingly an element of Rn, which is going to be this vector here, y. You may hear me call x the design matrix. This is really old terminology, but it's one that we use. And it just means the matrix of x after we've done the featurization. So after it's been kind of loaded and pre-processed into this form. Sometimes we'll worry about properties of the design matrix. So that's what that means. OK. All right. Now, if it's linear, let's see if we can get here.","zh":"这些是我们在前面讨论的特征大小。因此，这是示例。这是我们的每一个示例。然后我们将相应地有一个属于 R^n 的元素，即这里的向量 y。你们可能会听到我称 x 为设计矩阵。这是一个非常传统的术语，但这是我们使用的术语。它仅仅意味着在完成特征化之后的 x 矩阵。也就是说，在将其加载并预处理成这种形式之后。有时我们会关注设计矩阵的性质。这就是它的意思。好的。那么，如果是线性的，我们来看看能否得到这里的结果。","start":4303.55,"end":4336.28}],"notes":["本段主要讨论监督学习中的模型复杂性问题，特别是凸优化和非凸优化的对比。讲者提到，对于接下来几节的内容，模型在底层实际上是凸的，属于广义线性模型，这使得我们可以判断离最优解的距离。然而，当进入神经网络和无监督学习领域时，这种凸性不再适用，因此无法直接判断优化过程的进展。","讲者提到在实际训练过程中，如何判断模型是否收敛，通常通过观察权重和偏差的变化，以及损失函数的下降趋势。但这种判断更多是工程上的考虑，而非理论上的严谨性。","讲者提到在训练过程中，资源的分配（如GPU的使用）是一个重要的工程问题，而不是理论上的原则问题。这表明在实际应用中，模型训练的效率和资源管理是关键。","讲者提到自己不再为模型无法工作而感到羞愧，因为现在模型已经能够正常运行。这反映了在机器学习实践中，模型的可操作性和实用性的重要性。","讲者提到将使用正常方程（normal equations）来推导线性模型的参数估计，这需要熟悉线性代数的基本概念，如矩阵的秩和逆矩阵。这表明在监督学习中，线性代数是基础工具。","讲者提到设计矩阵（design matrix）的概念，这是将特征向量组织成矩阵的形式，以便进行线性回归等操作。设计矩阵的性质（如秩、正则性）在模型训练中起着重要作用。"],"formulas":[],"uncertainties":["在讲者提到的 'design matrix' 的具体定义和性质上，可能存在一些模糊之处，需要进一步澄清。"],"diagram":"none","start":4168.71,"end":4336.28,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4168.71,"text":"or if you're going to get to something if you're really close to the answer. And so that is actually a very computationally difficult problem. For everything in the next couple of sections, it's going to turn out that the models, if you're familiar, are going to be convex underneath the covers. They're going to be generalized linear models. That's what we're going to talk about for two weeks. In those situations, we can actually tell how far we are from the optimum. I'm not going to beat you in the head about this too much, because you should just take Steven's course. It's wonderful. I love Steven Boyd."},{"start":4193.73,"text":"But also, those won't really do us much good when we get to the wild world of neural nets and unsupervised and all the rest. And the truth is there, we don't know. And so how do you run? You kind of run like if I watch how I do it or my students do it, you look at like weights and biases, you watch so the thing goes down, you're like, I don't know, if I train for another two days, I can't go out with my friends."},{"start":4213.26,"text":"I'm going to cut it off now. And that is unfortunately how it works. And so you basically provision. We're doing a pretty big train right now. The way we're provisioning it is like, well, we have these GPUs for two months for this project that are donated, some DNA model thing, whatever. We're going to train that right now. And so it kind of just is an engineering consideration more than it's a principled one."},{"start":4235.1,"text":"I'm not really embarrassed to say, because the stuff we've been building is great. I used to be embarrassed when nothing worked. So my wife said, you know, we've been together forever. She's like, you know, you've been building the same demo since I've known you, since undergrad, but now stuff works, so it's okay. So, all right. Anyway, so yeah, so these squares are really special. I want to do this basically just for notation. We have a couple minutes left, so I want to just highlight this notation about normal equations. If you haven't seen this before,"},{"start":4263.52,"text":"Take a look, do a review. So we're going to derive the normal equations. So mainly this is to make sure you're comfortable with the notation, if I'm honest, but also to make sure that you know basic things about linear algebra. So if you don't know what rank is, you don't know what inverses are, then you should study up because we use that terminology pretty freely. So we have some loss function here."},{"start":4290.16,"text":"We have some loss function j here. We have, again, our vector notation. This is actually now going to be these n's are going to be laid out by rows. This is going to be n by d matrix. So it's going to have n rows where the examples are there, and then d plus 1."},{"start":4303.55,"text":"are the feature size that we talked about. So this is examples. This is each one of our examples. Then we're going to have correspondingly an element of Rn, which is going to be this vector here, y. You may hear me call x the design matrix. This is really old terminology, but it's one that we use. And it just means the matrix of x after we've done the featurization. So after it's been kind of loaded and pre-processed into this form. Sometimes we'll worry about properties of the design matrix. So that's what that means. OK. All right. Now, if it's linear, let's see if we can get here."}],"speech_gaps":[],"frame":"../frames/v049/025.webp","frame_time":4180.71},{"title":"监督学习设定中的梯度与矩阵运算","segments":[{"id":407,"text":"Notice that J has this particularly lovely form. Now if this is not obvious to you that it has it, this is a good signal that you should do some work on kind of your vector.","zh":"请注意，J 具有这种特别优美的形式。现在如果你觉得它不明显，这说明你应该花些时间来练习你的向量运算。","start":4338.15,"end":4349.2},{"id":408,"text":"manipulation, matrix manipulation stuff. This is the inner product. That's all I've written here. So L2 is important because it's the inner product. That's the other succinct way to say this. And so this is computing squares. And if you are rusty about this, please just compute it by hand. It's not some deep, mysterious thing. I'm just saying this thing here equals this thing here. OK, cool. So now we've stacked the design.","zh":"矩阵运算，矩阵运算的东西。这是内积。这就是我在这里所写的全部内容。因此，L2 很重要，因为它就是内积。这是另一种简洁的说法。因此，这是在计算平方。如果你对这个概念有些生疏，请直接手动计算。这并不是什么深奥神秘的东西。我只是在说这个东西等于那个东西。好的，酷。现在我们已经将设计矩阵堆叠起来了。","start":4350.4,"end":4377.88},{"id":409,"text":"If you don't remember this, please, again, review. But basically, when we compute a gradient of a matrix, it means that we're computing derivatives according to A of each underlying element and just stacking them in the corresponding type. So if you had a matrix coming in, you're going to have a matrix coming out. They're going to have all the same types. They're going to have the partial derivatives computed. This is the object. These are derivatives in the sense you're used to them.","zh":"如果你不记得这个，请再次复习。但基本上，当我们计算一个矩阵的梯度时，这意味着我们按照矩阵 A 对每个基础元素计算导数，并将它们按相应的类型堆叠起来。因此，如果你有一个矩阵输入，你将得到一个矩阵输出。它们的类型都是一样的。它们将包含所有计算出的偏导数。这就是目标。这些导数是你所熟悉的那种导数。","start":4380.29,"end":4406.02},{"id":410,"text":"In that, if you want to find a minimum and it's a convex function and all those nice things, you set the gradient equal to zero. Why does this work intuitively? Well, intuitively what's happening is the function is going to be bowl-shaped. It's going to be strictly bowl-shaped. If there's a change, the function changes in one direction, you're not at the bottom. When you get to the bottom, you're done. This means there's no change in a local direction, just like if you computed the derivative for a single 1D function. All right.","zh":"在这种情况下，如果你想找到一个最小值，并且这是一个凸函数，以及所有这些好的性质，你将梯度设为零。为什么这在直觉上是有效的呢？直观地说，函数将呈现碗状。它将严格呈碗状。如果有变化，函数在一个方向上变化，你就还没有到达底部。当你到达底部时，你就完成了。这意味着在局部方向上没有变化，就像你计算一个单变量一维函数的导数一样。好的。","start":4406.77,"end":4433.49},{"id":411,"text":"So far so good? All right. I got to get better at that. Anyway, so from our previous derivation, this is just some arithmetic. We're going to multiply this thing out and normalize. The 2 does us a little bit of value. We multiply out. We get the x theta as the xty's, and we get this derivative. If that's unfamiliar to you, what's going on? We're multiplying these terms out. We get an xtx theta on each side.","zh":"到目前为止都还好吗？好的。我得在这方面做得更好。不管怎样，从我们之前的推导来看，这只是些算术运算。我们将把这个式子展开并归一化。数字 2 对我们有点帮助。我们将展开这个式子。我们将得到 xθ 作为 xty 的形式，并得到这个导数。如果你对此不熟悉，发生了什么？我们正在展开这些项。我们将得到 xtxθ 在每一侧。","start":4437.06,"end":4468.03},{"id":412,"text":"When we take the derivative with respect to theta, we get the term on one side and the other, but it's symmetric. We have the one half, we get this term, okay? So it's this term in the FOIL. When we multiply the y's, we're not taking the derivative, they don't depend on theta, they get knocked out. When we do the cross terms, we get the cross term represented like so, twice, and that's the derivative. We set this equal to zero.","zh":"当我们对theta求导时，我们得到一边的项和另一边的项，但它是对称的。我们有一个一半，我们得到这个项，对吧？所以这是FOIL中的这个项。当我们相乘y时，我们并没有对它们求导，它们不依赖于theta，因此会被消去。当我们处理交叉项时，我们得到像这样表示的交叉项，两次，这就是导数。我们将这个等于零。","start":4468.53,"end":4494.27}],"notes":["本段主要讲解了梯度计算和矩阵运算的基本概念。讲者指出，J函数具有特别优美的形式，如果对这一点不明显，说明需要加强向量运算的基础知识。讲者强调，L2范数的重要性在于它等价于内积，这是另一种简洁的表达方式。此外，讲者提到，计算平方时，如果对相关概念不熟悉，可以通过手动计算来加深理解。","讲者进一步解释了梯度的计算方法，指出当计算矩阵的梯度时，实际上是针对每个基础元素计算导数，并将它们按对应类型堆叠起来。因此，输入矩阵和输出矩阵的类型相同，且包含所有偏导数的计算。讲者还提到，梯度的计算与单变量函数的导数概念类似。","讲者讨论了如何通过设置梯度为零来寻找函数的最小值，并指出这适用于凸函数的情况。讲者用直观的碗形函数来解释这一过程，说明当函数在某个方向上发生变化时，说明尚未到达底部；当到达底部时，函数在局部方向上不再变化。","讲者继续讲解了如何通过展开和归一化来计算导数。讲者提到，乘以2对计算有帮助，并指出在展开过程中，会得到xθ和xty的项。对于不熟悉这一过程的听众，讲者建议手动计算以加深理解。","讲者进一步解释了如何对θ求导，并指出在展开过程中，y项不依赖于θ，因此在求导时会被排除。交叉项则会以两次的形式出现，最终得到导数。讲者最后指出，将导数设为零是求解最小值的关键步骤。","讲者强调了矩阵运算和梯度计算的基础性，指出这些概念是监督学习中非常重要的部分。通过这些计算，可以找到函数的最小值，并且这些方法在实际应用中非常常见。"],"formulas":[{"latex":"J = \\frac{1}{2} \\text{tr}((X\\theta - y)^T(X\\theta - y))","symbols":"J 是损失函数，X 是设计矩阵，θ 是参数向量，y 是目标向量","explanation":"公式正确，J 是均方误差损失函数，使用迹函数来计算向量的平方范数。","evidence":"So far so good? All right. I got to get better at that. Anyway, so from our previous derivation, this is just some arithmetic. We're going to multiply this thing out and normalize. The 2 does us a little bit of value. We multiply out. We get the x theta as the xty's, and we get this derivative. If that's unfamiliar to you, what's going on? We're multiplying these terms out. We get an xtx theta on each side."},{"latex":"\\frac{\\text{d}J}{\\text{d}\\theta} = X^T(X\\theta - y)","symbols":"梯度是通过矩阵运算得到的，X^T 是 X 的转置，Xθ - y 是预测值与真实值的差","explanation":"公式正确，梯度计算正确，使用矩阵微分规则，X^T(Xθ - y) 是损失函数 J 关于 θ 的梯度。","evidence":"When we take the derivative with respect to theta, we get the term on one side and the other, but it's symmetric. We have the one half, we get this term, okay? So it's this term in the FOIL. When we multiply the y's, we're not taking the derivative, they don't depend on theta, they get knocked out. When we do the cross terms, we get the cross term represented like so, twice, and that's the derivative. We set this equal to zero."}],"uncertainties":[],"diagram":"none","start":4338.15,"end":4494.27,"asr_flags":[],"math_clarifications":["公式中的迹函数 tr 是为了将向量的平方范数转换为标量，这是标准的线性回归损失函数的写法。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4338.15,"text":"Notice that J has this particularly lovely form. Now if this is not obvious to you that it has it, this is a good signal that you should do some work on kind of your vector."},{"start":4350.4,"text":"manipulation, matrix manipulation stuff. This is the inner product. That's all I've written here. So L2 is important because it's the inner product. That's the other succinct way to say this. And so this is computing squares. And if you are rusty about this, please just compute it by hand. It's not some deep, mysterious thing. I'm just saying this thing here equals this thing here. OK, cool. So now we've stacked the design."},{"start":4380.29,"text":"If you don't remember this, please, again, review. But basically, when we compute a gradient of a matrix, it means that we're computing derivatives according to A of each underlying element and just stacking them in the corresponding type. So if you had a matrix coming in, you're going to have a matrix coming out. They're going to have all the same types. They're going to have the partial derivatives computed. This is the object. These are derivatives in the sense you're used to them."},{"start":4406.77,"text":"In that, if you want to find a minimum and it's a convex function and all those nice things, you set the gradient equal to zero. Why does this work intuitively? Well, intuitively what's happening is the function is going to be bowl-shaped. It's going to be strictly bowl-shaped. If there's a change, the function changes in one direction, you're not at the bottom. When you get to the bottom, you're done. This means there's no change in a local direction, just like if you computed the derivative for a single 1D function. All right."},{"start":4437.06,"text":"So far so good? All right. I got to get better at that. Anyway, so from our previous derivation, this is just some arithmetic. We're going to multiply this thing out and normalize. The 2 does us a little bit of value. We multiply out. We get the x theta as the xty's, and we get this derivative. If that's unfamiliar to you, what's going on? We're multiplying these terms out. We get an xtx theta on each side."},{"start":4468.53,"text":"When we take the derivative with respect to theta, we get the term on one side and the other, but it's symmetric. We have the one half, we get this term, okay? So it's this term in the FOIL. When we multiply the y's, we're not taking the derivative, they don't depend on theta, they get knocked out. When we do the cross terms, we get the cross term represented like so, twice, and that's the derivative. We set this equal to zero."}],"speech_gaps":[],"frame":"../frames/v049/026.webp","frame_time":4350.15},{"title":"监督学习设定中的线性回归与矩阵求逆","segments":[{"id":413,"text":"So that means that this thing is equal to 0. So how do we solve for that? We make these two terms equal to each other. Well, we have to take the inverse to get rid of the side, xtx inverse times xty. And this is the least square solution. This is an optimal solution for theta. Now, I cheated in one part of this derivation. This is something I assumed about x when I did this.","zh":"这意味着这个量等于0。那么我们如何求解呢？我们将这两个项设为相等。好吧，我们必须取逆矩阵来消除一边，即x^T x的逆乘以x^T y。这就是最小二乘解。这是对于theta的一个最优解。现在，在这个推导过程中，我有一点作弊。这是我在处理x时所做的一个假设。","start":4494.93,"end":4521.15},{"id":414,"text":"Exactly right. I assume that X, T, X is invertible. If, for example, I had relatively few examples and a huge set of dimensions, this would be a nonsensical kind of thing. So here, when I'm looking at it, I think that I have many, many data points more than my parameters. Okay? And hopefully, that inverse exists. But what happens if it doesn't exist? What is it defined up to? The theta that I get.","zh":"完全正确。我假设X^T X是可逆的。例如，如果我有相对较少的例子和一个巨大的维度集合，这将是一个毫无意义的事情。因此，当我观察这个问题时，我认为我拥有的数据点比参数多得多。好吗？希望这个逆矩阵存在。但如果它不存在呢？它定义到什么程度？我得到的theta是什么？","start":4523.58,"end":4553.32},{"id":415,"text":"So yeah, so if this is unfamiliar to you, take a look. So there will be a null space. And in that null space, I won't prefer one solution over another. All of them would be valuable. So anything in the null space of xtx, I can add that to theta, and it doesn't change the answer at all. So now there goes from being one single explanation, one single theta, theta star, to being an entire subspace of them, effectively the entire null space of xtx.","zh":"是的，如果这个内容对你来说不熟悉，那就看一下。这里将存在一个零空间。在该零空间中，我不会偏向任何一个解。所有解都是有价值的。因此，任何位于x^T x的零空间中的元素，我都可以将其加到theta上，而不会改变结果。因此，从一个单一的解释，一个单一的theta，theta星，变成了整个子空间中的所有解，实际上就是x^T x的整个零空间。","start":4558.44,"end":4580.56},{"id":416,"text":"If you're seeing this and going, oh, yeah, I remember that linear algebra. Sounds great. Do a little review. If you've never heard that and it sounds like I'm speaking a foreign language, please, please, please use the Friday lectures. Because after this, I'm going to assume we know all this stuff. That's basically the thing there. It will turn out, by the way, you could also worry that XCX here is also going to be, it turns out, positive semi-definite. By show of hands, who knows what PSD means? Positive semi-definite.","zh":"如果你看到这里并想，哦，对了，我记得线性代数。听起来不错。做一点复习。如果你从未听说过这些内容，听起来像是我在说外语，请，请，请使用周五的讲座。因为在之后，我将假设我们已经知道所有这些内容。基本上就是这个意思。顺便说一句，你可能会担心这里的X C X也会是正半定的。事实上，正半定是什么意思？正半定。","start":4581.32,"end":4604.34},{"id":417,"text":"Awesome. We're doing great. OK, fantastic. OK, so this is unfamiliar. I even wrote it down. Practice on Friday. And I just want to make sure that's clear. We're going to use these concepts, positive semi-definite. We're going to use these concepts like it's invertible. We're going to use them pretty freely. We're going to compute vector derivatives and matrix derivatives in this way. If it's unfamiliar, spend a little bit of time to make it familiar. It will make your life a little bit more easy. It's much easier to compute this way, I think, than the other way just by hand.","zh":"太棒了。我们做得很好。好的，太好了。好的，所以这有点陌生。我甚至把它写下来了。星期五练习。我只是想确保这一点很清楚。我们将使用这些概念，比如半正定。我们将像它可逆一样使用这些概念。我们将自由地使用它们。我们将以这种方式计算向量导数和矩阵导数。如果它对你来说很陌生，花一点时间去熟悉它。这会让你的生活稍微容易一点。我觉得用这种方式计算会比手动计算更容易。","start":4604.8,"end":4633.14},{"id":418,"text":"All right. Almost pretty good on time. Not so bad. Usually I'm pretty bad about this. All right. So we saw lots of notation today. That was the intent of the lecture in some ways. I wanted to give you a little bit of machine learning stuff and lore, but I wanted to make sure that you understood all the pieces that go on. We learned a little bit about linear regression. We learned what the model is, right? So this is one of n models that you'll see in this class. We learned how to solve it.","zh":"好的。几乎准时了。还不错。通常我对这方面很糟糕。好的，今天我们看到了很多符号。这在某种程度上是课程的意图。我想给你们一些机器学习的内容和知识，但我也想确保你们理解所有涉及的部分。我们学习了一点线性回归。我们了解了模型是什么，对吧？所以这是你们在本课程中会看到的n个模型之一。我们学习了如何解决它。","start":4635.36,"end":4658.93}],"notes":["本段讲解了线性回归中如何通过矩阵求逆来求解参数θ。讲者指出，当XTX可逆时，可以通过求逆得到最小二乘解，这是θ的最优解。但讲者也承认在推导过程中假设了XTX可逆，这在某些情况下可能不成立，例如数据点数量远少于特征维度时。","讲者进一步说明，当XTX不可逆时，解将不唯一，所有位于XTX零空间中的解都是有效的。这意味着θ的解将是一个子空间，而不是单一解。讲者提醒学生注意线性代数中的零空间概念。","讲者提到，XTX是正定的，这在机器学习中是一个重要性质。正定矩阵具有良好的性质，如可逆性，这在优化问题中非常重要。讲者还提到，如果XTX是半正定的，那么它可能不可逆，这需要学生进一步理解。","讲者强调，学生需要掌握正定矩阵和半正定矩阵的概念，并能够计算向量和矩阵的导数。这些概念在后续课程中将频繁使用，因此学生需要花时间熟悉这些内容。","讲者指出，线性回归是监督学习中的一种基本模型，是课程中将要学习的多种模型之一。学生需要理解线性回归的模型结构以及如何求解参数θ。","讲者最后提到，课程中将使用大量符号和数学表达式，因此学生需要理解这些符号的含义，并掌握相关的数学工具，如线性代数和微积分。"],"formulas":[{"latex":"X^T X \\theta = X^T y","symbols":"X^T X θ = X^T y","explanation":"公式正确，表示线性回归的正规方程，其中X是设计矩阵，θ是参数向量，y是目标向量。","evidence":"So that means that this thing is equal to 0. So how do we solve for that? We make these two terms equal to each other. Well, we have to take the inverse to get rid of the side, xtx inverse times xty. And this is the least square solution. This is an optimal solution for theta. Now, I cheated in one part of this derivation. This is something I assumed about x when I did this."}],"uncertainties":[],"diagram":"none","start":4494.93,"end":4658.93,"asr_flags":[],"math_clarifications":["公式index 0是线性回归的正规方程，正确且完整。其他公式重复或不完整，无法核定其数学意义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4494.93,"text":"So that means that this thing is equal to 0. So how do we solve for that? We make these two terms equal to each other. Well, we have to take the inverse to get rid of the side, xtx inverse times xty. And this is the least square solution. This is an optimal solution for theta. Now, I cheated in one part of this derivation. This is something I assumed about x when I did this."},{"start":4523.58,"text":"Exactly right. I assume that X, T, X is invertible. If, for example, I had relatively few examples and a huge set of dimensions, this would be a nonsensical kind of thing. So here, when I'm looking at it, I think that I have many, many data points more than my parameters. Okay? And hopefully, that inverse exists. But what happens if it doesn't exist? What is it defined up to? The theta that I get."},{"start":4558.44,"text":"So yeah, so if this is unfamiliar to you, take a look. So there will be a null space. And in that null space, I won't prefer one solution over another. All of them would be valuable. So anything in the null space of xtx, I can add that to theta, and it doesn't change the answer at all. So now there goes from being one single explanation, one single theta, theta star, to being an entire subspace of them, effectively the entire null space of xtx."},{"start":4581.32,"text":"If you're seeing this and going, oh, yeah, I remember that linear algebra. Sounds great. Do a little review. If you've never heard that and it sounds like I'm speaking a foreign language, please, please, please use the Friday lectures. Because after this, I'm going to assume we know all this stuff. That's basically the thing there. It will turn out, by the way, you could also worry that XCX here is also going to be, it turns out, positive semi-definite. By show of hands, who knows what PSD means? Positive semi-definite."},{"start":4604.8,"text":"Awesome. We're doing great. OK, fantastic. OK, so this is unfamiliar. I even wrote it down. Practice on Friday. And I just want to make sure that's clear. We're going to use these concepts, positive semi-definite. We're going to use these concepts like it's invertible. We're going to use them pretty freely. We're going to compute vector derivatives and matrix derivatives in this way. If it's unfamiliar, spend a little bit of time to make it familiar. It will make your life a little bit more easy. It's much easier to compute this way, I think, than the other way just by hand."},{"start":4635.36,"text":"All right. Almost pretty good on time. Not so bad. Usually I'm pretty bad about this. All right. So we saw lots of notation today. That was the intent of the lecture in some ways. I wanted to give you a little bit of machine learning stuff and lore, but I wanted to make sure that you understood all the pieces that go on. We learned a little bit about linear regression. We learned what the model is, right? So this is one of n models that you'll see in this class. We learned how to solve it."}],"speech_gaps":[],"frame":"../frames/v049/027.webp","frame_time":4506.93},{"title":"监督学习设定与算法概述","segments":[{"id":419,"text":"And we learned that there's a very basic algorithm to solve it called stochastic gradient descent. It's our workhorse. And so we're going to see that algorithm come back again and again and again. Next time, what we're going to learn about is not regression problems. We're going to learn about classification. So instead of lurking at house prices, we're going to learn how to classify cats versus dogs or next word in the sentence and all those discrete functions. Thanks so much. Have a wonderful weekend.","zh":"我们还了解到，有一种非常基础的算法可以解决这个问题，称为随机梯度下降。这是我们主要使用的工具。接下来，我们将看到这个算法反复出现。下一次，我们将学习的内容不是回归问题，而是分类问题。我们将学习如何区分猫和狗，或者句子中的下一个词等离散函数。非常感谢。祝大家周末愉快。","start":4659.18,"end":4684.08}],"notes":["本段介绍了监督学习的基本算法——随机梯度下降（stochastic gradient descent），并指出该算法是解决监督学习问题的核心工具。讲者强调该算法将在后续课程中反复出现。","接下来的课程内容将转向分类问题，而不是回归问题。讲者举例说明分类任务，如猫狗分类、句子中下一个词的预测等，这些任务涉及离散输出。","讲者以感谢和祝福结束本段内容，表明课程即将进入新的主题，即分类问题。","本段内容为课程的过渡部分，旨在引导学生从回归问题转向分类问题，并强调随机梯度下降作为核心算法的重要性。","讲者通过具体例子（如猫狗分类、句子预测）帮助学生理解分类任务的性质，即输出为离散值。","本段未涉及数学公式，但为后续课程内容（如分类算法）做了铺垫。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4659.18,"end":4684.08,"asr_flags":[],"translation_complete":true,"translated_segments":1,"raw_segments":[{"start":4659.18,"text":"And we learned that there's a very basic algorithm to solve it called stochastic gradient descent. It's our workhorse. And so we're going to see that algorithm come back again and again and again. Next time, what we're going to learn about is not regression problems. We're going to learn about classification. So instead of lurking at house prices, we're going to learn how to classify cats versus dogs or next word in the sentence and all those discrete functions. Thanks so much. Have a wonderful weekend."}],"speech_gaps":[],"frame":"../frames/v049/028.webp","frame_time":4671.18}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v049.mp4"}</script><script src="../assets/katex.min.js"></script><script>
const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
