xt-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】监督学习设定 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v049.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v049","title":"【斯坦福CS229】监督学习设定","course":"机器学习","pages":[{"title":"监督学习设定","segments":[{"id":0,"text":"So good afternoon. Welcome to CS 229. I'm sorry I didn't get a chance to see you all on Monday, but this next section of the course I'll be teaching, Teng, you and I are going to swap off as we go through the lecture.","zh":"下午好。欢迎来到CS 229。很抱歉周一没能见到你们所有人，但接下来这门课的这一部分，我会和Teng轮流讲解，随着课程的进行，我们会交替进行。","start":5.26,"end":17.46},{"id":1,"text":"This next segment, we're going to cover the basics of machine learning and AI, which is supervised machine learning. As you're going to see, this is when you explicitly tell the machine what you want it to label. So you could show it an image of a cat or a dog and tell it to classify as a cat or a dog.","zh":"接下来这一部分，我们将介绍机器学习和人工智能的基础知识，也就是监督机器学习。你们将看到，这是当你明确告诉机器你想要它进行什么标签分类的时候。例如，你可以展示一张猫或狗的图片，并告诉它进行猫或狗的分类。","start":18.2,"end":34.9},{"id":2,"text":"We'll start off with something else that's called regression, which is just a little bit more kind of mathematically simple. And today we'll go through kind of all the building blocks of what a learning algorithm looks like, and hopefully something that makes a little bit of intuitive sense. And just by way of introduction, I've been working on machine learning and AI for most of my professional career. It's been really exciting to watch it grow from something that was very obscure to now something that has products in your hand that you can use. And so I'm super excited about that. So these classes are always really fun for me because...","zh":"我们将从另一种叫做回归的内容开始，这在数学上稍微简单一些。今天我们将介绍学习算法的基本构成，希望这些内容能有一些直观的理解。作为引言，我大部分的职业生涯都在从事机器学习和人工智能领域。看着它从一个非常冷门的领域发展到现在你手中有各种产品可以使用，这真的令人兴奋。因此，我对这些课程感到非常兴奋。","start":35.29,"end":64.43},{"id":3,"text":"This stuff that we're teaching here, in some ways, is the foundation for so much of what now you use on a daily basis. So it's really exciting to do that. We're going to teach in a very abstract and mathematical style, I'm sure as Teng shared with you, so we can communicate really, really precisely. So a couple of disclaimers. Let me see if I can get this guy up.","zh":"我们在这里教授的内容，在某种程度上是你们日常使用的一切的基础。因此，进行这些教学真的令人兴奋。我们将会以非常抽象和数学的方式进行教学，正如Teng向你们分享的那样，这样我们可以非常精确地进行沟通。让我看看是否能将这个家伙（幻灯片）打开。","start":64.68,"end":85.8},{"id":4,"text":"So I'm using this format with slides. So you can always download the slides online. I teched them all up, at least for my section. Please look at them. It's just because when we're doing things with math, there's all kinds of little I's and J's and indices. And it's just nice to have them all clean. If you see any bugs, please send them to me. These are like handwritten notes that have been passed down that I wrote a long time ago. But the best lecture for everything is Teng Yu's course notes. So if you get confused what's here, this is meant to be a subset of the course notes.","zh":"我使用这种幻灯片格式进行教学。你们可以随时在线下载这些幻灯片。至少在我的部分，我已经将它们整理好了。请查看它们。这是因为当我们进行数学运算时，会有各种各样的小i和j以及索引。拥有这些清晰的幻灯片会很舒服。如果你们发现任何错误，请发送给我。这些幻灯片就像是流传下来的 handwritten notes（手写笔记），是我很久以前写的。但最好的讲座内容是Teng Yu的课程笔记。如果你们对这里的内容感到困惑，这里的内容旨在作为课程笔记的一个子集。","start":89.48,"end":119.1},{"id":5,"text":"course notes. And it's just meant to give you kind of the tune of what's going on. It's, you know, precise enough that you can understand how all the pieces get together. But if you want to go back and rigorously study, I would really suggest those notes, saying you work quite hard on getting those notes in shape.","zh":"课程笔记。这只是为了让你们大致了解正在发生的事情。它足够精确，以便你们能够理解所有部分是如何组合在一起的。但如果你想回去严谨地学习，我强烈建议你们去阅读这些笔记，并努力把它们整理好。","start":119.08,"end":132.34},{"id":6,"text":"I'm in general worried that the lecture pacing will be too quick with these. I used to in antiquity give them on these whiteboards. I really like whiteboards because it forces me to slow down and talk and walk through it. So that's kind of another way of me asking you, please just go ahead and ask questions. Like I have given these lectures a bunch of times.","zh":"我一般担心这些讲座的节奏会太快。我以前在古代用白板来展示这些内容。我真的很喜欢白板，因为它迫使我去放慢速度，讲解并逐步推导。所以这也是我在另一种方式上请求你们，请你们随时提问。就像我已经多次做过这些讲座一样。","start":133.62,"end":150.52},{"id":7,"text":"These are topics that I've talked about. I would much rather talk to you. If I'm totally honest with you, as a faculty member, I do things outside the university. The reason I stay affiliated with Stanford is because I like mentoring students. It's a way to have a meaningful life. I also run companies and do other stuff in another life. But this is what I enjoy, is talking to you all. So please, please feel free to ask whatever questions you like as we go. I will do my best to answer them.","zh":"这些都是我讲过的话题。我更愿意和你们交流。如果我完全诚实地说，作为一名教职员工，我在大学之外也做很多事情。我之所以仍然与斯坦福保持联系，是因为我喜欢指导学生。这是让生活有意义的一种方式。我也在另一个生活中经营公司并做其他事情。但这是我享受的，就是和你们所有人交谈。所以请，请随意在我们进行的过程中提出你们喜欢的任何问题。我会尽我最大的努力来回答它们。","start":151.23,"end":177.45}],"notes":["本段介绍了课程的基本设定，包括监督学习的概念，即通过明确告诉机器期望的标签来进行学习。例如，通过展示猫或狗的图像并告诉机器进行分类。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":177.45,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":5.26,"text":"So good afternoon. Welcome to CS 229. I'm sorry I didn't get a chance to see you all on Monday, but this next section of the course I'll be teaching, Teng, you and I are going to swap off as we go through the lecture."},{"start":18.2,"text":"This next segment, we're going to cover the basics of machine learning and AI, which is supervised machine learning. As you're going to see, this is when you explicitly tell the machine what you want it to label. So you could show it an image of a cat or a dog and tell it to classify as a cat or a dog."},{"start":35.29,"text":"We'll start off with something else that's called regression, which is just a little bit more kind of mathematically simple. And today we'll go through kind of all the building blocks of what a learning algorithm looks like, and hopefully something that makes a little bit of intuitive sense. And just by way of introduction, I've been working on machine learning and AI for most of my professional career. It's been really exciting to watch it grow from something that was very obscure to now something that has products in your hand that you can use. And so I'm super excited about that. So these classes are always really fun for me because..."},{"start":64.68,"text":"This stuff that we're teaching here, in some ways, is the foundation for so much of what now you use on a daily basis. So it's really exciting to do that. We're going to teach in a very abstract and mathematical style, I'm sure as Teng shared with you, so we can communicate really, really precisely. So a couple of disclaimers. Let me see if I can get this guy up."},{"start":89.48,"text":"So I'm using this format with slides. So you can always download the slides online. I teched them all up, at least for my section. Please look at them. It's just because when we're doing things with math, there's all kinds of little I's and J's and indices. And it's just nice to have them all clean. If you see any bugs, please send them to me. These are like handwritten notes that have been passed down that I wrote a long time ago. But the best lecture for everything is Teng Yu's course notes. So if you get confused what's here, this is meant to be a subset of the course notes."},{"start":119.08,"text":"course notes. And it's just meant to give you kind of the tune of what's going on. It's, you know, precise enough that you can understand how all the pieces get together. But if you want to go back and rigorously study, I would really suggest those notes, saying you work quite hard on getting those notes in shape."},{"start":133.62,"text":"I'm in general worried that the lecture pacing will be too quick with these. I used to in antiquity give them on these whiteboards. I really like whiteboards because it forces me to slow down and talk and walk through it. So that's kind of another way of me asking you, please just go ahead and ask questions. Like I have given these lectures a bunch of times."},{"start":151.23,"text":"These are topics that I've talked about. I would much rather talk to you. If I'm totally honest with you, as a faculty member, I do things outside the university. The reason I stay affiliated with Stanford is because I like mentoring students. It's a way to have a meaningful life. I also run companies and do other stuff in another life. But this is what I enjoy, is talking to you all. So please, please feel free to ask whatever questions you like as we go. I will do my best to answer them."}],"speech_gaps":[],"frame":"../frames/v049/001.webp","frame_time":17.259999999999998},{"title":"监督学习设定","segments":[{"id":8,"text":"I generally talk fast when I get excited. I'm not that excited right now, I guess, but I will be excited later. And when I get excited, I'll talk fast. Thank goodness that most of you will watch these on recordings and you can watch them at 50% speed. I'll do my best to slow down, but genetically it's been rough. All right, so let's get to it. So we're going to talk about our first...","zh":"我通常在激动的时候说话很快。我现在大概不太激动，但之后我会激动起来。当我激动的时候，我会说话很快。幸好你们大多数人会通过录像观看这些内容，你们可以以50%的速度观看。我会尽我最大的努力放慢语速，但基因上这很困难。好吧，那我们开始吧。所以我们今天要讨论的是我们第一次……","start":177.72,"end":197.3},{"id":9,"text":"first kind of exposure to a formal learning algorithm. The hope is maybe you've seen some of these concepts before. So today is going to be a little bit heavier on notation. It's going to be heavier on kind of the basics that we're going to use. And we're going to talk about kind of the most classical learning algorithm, which predates machine learning by a lot, which is linear regression.","zh":"我们第一次接触正式的学习算法。希望你们可能之前见过一些这些概念。今天的内容会更侧重于符号表示，也会更侧重于我们将要使用的基础知识。我们将讨论一种最经典的机器学习算法，它比机器学习早了很多，这就是线性回归。","start":198.14,"end":216.68},{"id":10,"text":"Then we're going to see linear regression. We're going to see that this kind of way of fitting a line is actually quite interesting. It's actually a pretty robust technique. A lot of science was done on it. A lot of machine learning was done on it. And we're going to see elements that have really dominated a lot of what machine learning does now. So one of the big things that happened in machine learning were as kind of strange and bizarre as this is to say, we made the models a lot bigger. It's kind of that dumb. We made the models that bigger. And as they say, we made the GPUs go burn.","zh":"然后我们将看到线性回归。我们将看到这种拟合直线的方式实际上非常有趣。它实际上是一种相当稳健的技术。很多科学成果都是基于它的，很多机器学习成果也是基于它的。我们将看到一些现在机器学习中占主导地位的元素。机器学习中的一大突破，听起来可能很奇怪，就是我们让模型变得更大。这听起来有点傻，我们让模型变得更大。正如人们所说，我们让GPU烧了起来。","start":217.68,"end":246.46},{"id":11,"text":"and then we got AI. Now that version is not too far away. And I worked on it. You should see my Stanford job talk about making models bigger way back when.","zh":"然后我们就有了人工智能。这个版本并不太遥远。我曾经参与过这项工作。你应该看看我斯坦福的就职演讲，那时我关于如何让模型变得更大。","start":246.48,"end":255.02},{"id":12,"text":"The workhorse algorithm we're going to cover today is this thing called batch and stochastic gradient descent. Now, if you look at these and you have kind of a mathematical mind or statistical mind, you're going to realize that these are really stupid algorithms, hopefully. They're really simple. But that simplicity is what allowed us to scale them up and run them on huge amounts of data and build these crazy models. And so like stochastic gradient descent, I've run in the last 24 hours for whatever it's worth. There are much more sophisticated algorithms that you may have seen in optimization classes.","zh":"我们今天要讲的主力算法就是批量梯度下降和随机梯度下降。如果你有数学或统计学的思维，你可能会意识到这些算法其实真的很简单，希望如此。它们非常简单。但正是这种简单性使我们能够将它们扩展并运行在大量数据上，构建这些疯狂的模型。例如，随机梯度下降，我过去24小时内就运行过。有很多更复杂的算法，你可能在优化课程中见过。","start":256.16,"end":283.36},{"id":13,"text":"We're not going to cover those. And the last bit, I'm going to tell you a little bit about normal equations. The normal equations basically are an excuse for me to give you some notation about matrices and vectors. And that's because if this part of the section feels a little bit unclear to you, like it's just not kind of clicking to you, you kind of either vaguely remember it or maybe you haven't seen it.","zh":"我们不会讲那些内容。最后一点，我会稍微讲一下正规方程。正规方程基本上是我给你一些关于矩阵和向量的符号记号的借口。这是因为如果你觉得这一部分有点不清楚，像是它对你来说没有点击到，你可能只是模糊地记得，或者甚至还没见过。","start":284.02,"end":301.42},{"id":14,"text":"we have these wonderful classes on friday where you can practice things like this and you will have kind of a little bit of calculus over matrices and vectors you will end up by the end of this course using that kind of stuff as second hand but it can be mysterious so spend a little bit of time at the beginning and invest and use these great ta courses like this course one of the nice things about it you know the professors are kind of interchangeable but the course staff like what sets it up so that you have homeworks and you have great ta sections and all the rest","zh":"我们周五有很棒的课程，你可以练习像这样的内容，你将会学到一些关于矩阵和向量的微积分知识，到这门课结束时，你会用到这些知识，但它们可能看起来有点神秘。因此，在一开始花点时间，投入一些精力，利用这些很棒的助教课程。像这门课这样的课程有一个很好的地方，你知道教授们可以互换，但课程助教团队设置得很好，让你有作业和很棒的助教辅导课，以及所有其他资源。","start":302.19,"end":330.27},{"id":15,"text":"Please avail yourself of that. We want everybody to get through and have a great time. Okay? All right. So that's what the last part is. In this part, if you find yourself being like, I don't understand what that symbol means, or I don't understand why that transformation, please, of course, feel free to ask. But if it's kind of not sticking with you, please take advantage of those Friday TA lectures and the rest of the resources that are out there. Okay? All right. Let's get started. Okay. So...","zh":"请充分利用这些资源。我们希望每个人都能顺利通过并享受这门课。好吗？好了，这就是最后部分的内容。在这一部分，如果你发现自己不明白某个符号的含义，或者不明白为什么会有这样的变换，请当然可以自由提问。但如果这些内容对你来说还不是很清楚，请利用周五的助教课程和其他现有的资源。好吗？好了，我们开始吧。好吗？","start":330.88,"end":354.64}],"notes":["本段主要讲解课程中涉及的矩阵和向量微积分内容，强调学生需要在课程初期投入时间学习这些基础知识。讲者提到周五的助教课程是练习这些内容的好机会，并指出课程设置包括作业和优秀的助教辅导，帮助学生掌握这些概念。","讲者提到矩阵和向量的微积分可能对部分学生来说比较神秘，因此建议学生在课程初期花时间学习这些内容，并利用助教课程和课程资源来加深理解。","讲者强调课程的结构设计，包括作业和助教辅导，旨在帮助学生掌握课程内容。同时，讲者指出教授之间可以互换，但课程团队的设置确保了学习资源的丰富性。","讲者鼓励学生充分利用课程提供的资源，包括助教课程和其他学习材料，以确保能够顺利通过课程并获得良好的学习体验。","讲者提到，虽然课程内容可能在初期显得复杂，但通过持续的学习和利用资源，学生可以逐步掌握这些概念。","讲者最后提醒学生，如果在学习过程中遇到不理解的符号或变换，应主动提问并利用课程提供的资源进行学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.72,"end":354.64,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":177.72,"text":"I generally talk fast when I get excited. I'm not that excited right now, I guess, but I will be excited later. And when I get excited, I'll talk fast. Thank goodness that most of you will watch these on recordings and you can watch them at 50% speed. I'll do my best to slow down, but genetically it's been rough. All right, so let's get to it. So we're going to talk about our first..."},{"start":198.14,"text":"first kind of exposure to a formal learning algorithm. The hope is maybe you've seen some of these concepts before. So today is going to be a little bit heavier on notation. It's going to be heavier on kind of the basics that we're going to use. And we're going to talk about kind of the most classical learning algorithm, which predates machine learning by a lot, which is linear regression."},{"start":217.68,"text":"Then we're going to see linear regression. We're going to see that this kind of way of fitting a line is actually quite interesting. It's actually a pretty robust technique. A lot of science was done on it. A lot of machine learning was done on it. And we're going to see elements that have really dominated a lot of what machine learning does now. So one of the big things that happened in machine learning were as kind of strange and bizarre as this is to say, we made the models a lot bigger. It's kind of that dumb. We made the models that bigger. And as they say, we made the GPUs go burn."},{"start":246.48,"text":"and then we got AI. Now that version is not too far away. And I worked on it. You should see my Stanford job talk about making models bigger way back when."},{"start":256.16,"text":"The workhorse algorithm we're going to cover today is this thing called batch and stochastic gradient descent. Now, if you look at these and you have kind of a mathematical mind or statistical mind, you're going to realize that these are really stupid algorithms, hopefully. They're really simple. But that simplicity is what allowed us to scale them up and run them on huge amounts of data and build these crazy models. And so like stochastic gradient descent, I've run in the last 24 hours for whatever it's worth. There are much more sophisticated algorithms that you may have seen in optimization classes."},{"start":284.02,"text":"We're not going to cover those. And the last bit, I'm going to tell you a little bit about normal equations. The normal equations basically are an excuse for me to give you some notation about matrices and vectors. And that's because if this part of the section feels a little bit unclear to you, like it's just not kind of clicking to you, you kind of either vaguely remember it or maybe you haven't seen it."},{"start":302.19,"text":"we have these wonderful classes on friday where you can practice things like this and you'll have kind of a little bit of calculus over matrices and vectors you will end up by the end of this course using that kind of stuff as second hand but it can be mysterious so spend a little bit of time at the beginning and invest and use these great ta courses like this course one of the nice things about it you know the professors are kind of interchangeable but the course staff like what sets it up so that you have homeworks and you have great ta sections and all the rest"},{"start":330.88,"text":"Please avail yourself of that. We want everybody to get through and have a great time. Okay? All right. So that's what the last part is. In this part, if you find yourself being like, I don't understand what that symbol means, or I don't understand why that transformation, please, of course, feel free to ask. But if it's kind of not sticking with you, please take advantage of those Friday TA lectures and the rest of the resources that are out there. Okay? All right. Let's get started. Okay. So..."}],"speech_gaps":[],"frame":"../frames/v049/002.webp","frame_time":189.72},{"title":"监督学习的基本设定","segments":[{"id":16,"text":"The basics of supervised learning is going to be a hypothesis. And this is just a function from some abstract set X to some abstract set Y that we're going to do. And it's that hypothesis or prediction. We'll talk a lot about what it means to make a good hypothesis or prediction, but let's look at some examples of kind of the types that we might deal with.","zh":"监督学习的基本设定是一个假设。这是一个从某个抽象集合X到另一个抽象集合Y的函数，我们将进行这样的操作。这就是假设或预测。我们将大量讨论什么是良好的假设或预测，但让我们先看一下我们可能会处理的一些类型示例。","start":356.03,"end":375.05},{"id":17,"text":"So one example is we could have X being the space of all images, and then Y can be a fixed set of labels like, does it contain a cat or a dog or a horse or a person or a building, whatever. Those fixed set of labels are something that we could learn a function H that we hopefully apply to a bunch of images, and then learn when a new image comes that wasn't something that we saw ahead of time, we can still classify it as a horse or car or whatever. It can be text.","zh":"一个例子是，我们可以让X是所有图像的空间，然后Y可以是一个固定的标签集合，比如是否包含猫、狗、马、人或建筑物，等等。这些固定的标签集合是我们可以学习一个函数H的东西，我们希望将其应用于一批图像，当一个新的图像出现，而这个图像在事先没有见过时，我们仍然可以将其分类为马或汽车等。它也可以是文本。","start":375.76,"end":402.96},{"id":18,"text":"It can be house data. In text, you could imagine classifying things, whether they're positive or negative, whether it was a positive review about a product, all the rest of it. When it's house data, we'll look at this. It could also be a price. So Y doesn't have to be just categorical labels. It doesn't have to be yes or no. It doesn't have to be cat or dog. It could be a real number. It could be a scalar value. It could be the price of a house or something like this. So this is kind of what we're doing. Now, what makes it supervised is this training set.","zh":"它也可以是房屋数据。在文本中，你可以想象对事物进行分类，判断它们是正面还是负面，是否是对产品的正面评价，其余的都如此。当处理房屋数据时，我们将看一下这一点。它也可以是一个价格。因此，Y不一定要是分类标签。它不一定要是是或否。它不一定要是猫或狗。它也可以是一个实数。它也可以是一个标量值。它也可以是房屋的价格，或者其他类似的东西。这就是我们正在做的事情。现在，使它成为监督学习的是这个训练集。","start":403.58,"end":434.73},{"id":19,"text":"So what we do is we imagine that we've collected some data. So we collect some data, which are these pairs, x and y pairs. And each one of them, as you can imagine, is some kind of image and some kind of label for that image. This is a picture. This is an image of a cat. This is an image. This is an image of a dog. The x is the image. The y is the label set that's there. Now, we'll use this notation.","zh":"因此，我们所做的就是想象我们已经收集了一些数据。我们收集了一些数据，这些数据是x和y的配对。每一个，你可以想象，都是一种图像和该图像的一种标签。这是一个图片。这是一个猫的图像。这是一个图像。这是一个狗的图像。x是图像，y是存在的标签集合。现在，我们将使用这种记号。","start":435.24,"end":456.32},{"id":20,"text":"this kind of superscript notation, what that indicates is that's the first example, that's the nth example, if I ever want to refer to them. The ith example, the jth example, something like that. Now, I've been pretty vague. This is a pretty vague definition. I mean, it's a pretty general one. X is just some set and Y is just some set. But that's what's kind of exciting about supervised machine learning. It applies to a huge range of different data types and different things that you may want to do with it.","zh":"这种上标表示法所表示的是第一个样本，第n个样本，如果我需要引用它们的话。第i个样本，第j个样本，等等。现在，我之前说得比较模糊。这是一个相当模糊的定义。我的意思是，这是一个相当一般的定义。X只是某个集合，Y也只是某个集合。但这就是监督机器学习令人兴奋的地方。它适用于各种不同类型的数据和你可能想用它做的事情。","start":457.33,"end":481.93},{"id":21,"text":"Among all of those hypotheses that are out there, and if you've taken any kind of math classes, you know there's a huge range of hypotheses that go from one set X to another set Y, just potentially uncountably many if Y is some big continuous set. So the question is, what makes a good prediction?","zh":"在所有这些假设中，如果你上过任何数学课，你就知道从一个集合X到另一个集合Y的假设范围非常广泛，如果Y是一个大的连续集合，那么潜在的假设数量可能是不可数的。因此，问题是，什么构成一个好的预测？","start":488.88,"end":504.6},{"id":22,"text":"Now, this is a subtle problem. This is something we're going to talk about for a while. We're going to talk about good in several contexts and more refined notions of good over the next couple of weeks. But kind of intuitively what we're after in this modeling question is we want a function that, you know, to use a fancy word that you don't have to use now, we want it to generalize. So what we would like to do is that this X and Y that we're selecting here, we'd like it to come from some set that's representative in some way that we can make precise. And then later when we're shown new images that are not from that original set,","zh":"现在，这是一个微妙的问题。我们将对此进行长时间的讨论。我们将从多个角度讨论什么是好的，并在接下来的几周内更精细地探讨好的定义。但直观地说，在这个建模问题中，我们想要的是一个函数，它能够推广。换句话说，我们希望所选择的X和Y来自某种具有代表性的集合，这种代表性可以被精确地定义。然后，当后来展示给我们新的图像，这些图像并不来自原始集合时，","start":505.2,"end":533.74}],"notes":["本段介绍了监督学习的基本设定，即通过一个从输入空间X到输出空间Y的假设函数来进行预测。监督学习的核心在于利用训练集中的数据对模型进行训练，从而使得模型能够对新的输入数据做出准确的预测。","课程中举了多个例子来说明监督学习的应用场景，包括图像分类、文本分类以及房价预测等。这些例子展示了监督学习可以处理不同类型的输出，如分类标签或连续值。","监督学习的关键在于训练集的使用，训练集由输入-输出对组成，用于训练模型以学习从输入到输出的映射关系。这种映射关系可以是任意的，只要能够满足模型的泛化能力。","课程还提到，监督学习的定义非常广泛，适用于各种不同的数据类型和任务。这种广泛性使得监督学习成为机器学习中非常重要的方法之一。","在监督学习中，模型的目标是找到一个能够很好地泛化到新数据的假设函数。这意味着模型不仅要能够准确地拟合训练数据，还要能够对未见过的数据做出合理的预测。","课程最后提到，监督学习的定义虽然非常一般，但其应用范围非常广泛，这使得监督学习成为解决各种实际问题的重要工具。"],"formulas":[],"uncertainties":[],"diagram":"none","start":356.03,"end":533.74,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":356.03,"text":"The basics of supervised learning is going to be a hypothesis. And this is just a function from some abstract set X to some abstract set Y that we're going to do. And it's that hypothesis or prediction. We'll talk a lot about what it means to make a good hypothesis or prediction, but let's look at some examples of kind of the types that we might deal with."},{"start":375.76,"text":"So one example is we could have X being the space of all images, and then Y can be a fixed set of labels like, does it contain a cat or a dog or a horse or a person or a building, whatever. Those fixed set of labels are something that we could learn a function H that we hopefully apply to a bunch of images, and then learn when a new image comes that wasn't something that we saw ahead of time, we can still classify it as a horse or car or whatever. It can be text."},{"start":403.58,"text":"It can be house data. In text, you could imagine classifying things, whether they're positive or negative, whether it was a positive review about a product, all the rest of it. When it's house data, we'll look at this. It could also be a price. So Y doesn't have to be just categorical labels. It doesn't have to be yes or no. It doesn't have to be cat or dog. It could be a real number. It could be a scalar value. It could be the price of a house or something like this. So this is kind of what we're doing. Now, what makes it supervised is this training set."},{"start":435.24,"text":"So what we do is we imagine that we've collected some data. So we collect some data, which are these pairs, x and y pairs. And each one of them, as you can imagine, is some kind of image and some kind of label for that image. This is a picture. This is an image of a cat. This is an image. This is an image of a dog. The x is the image. The y is the label set that's there. Now, we'll use this notation."},{"start":457.33,"text":"this kind of superscript notation, what that indicates is that's the first example, that's the nth example, if I ever want to refer to them. The ith example, the jth example, something like that. Now, I've been pretty vague. This is a pretty vague definition. I mean, it's a pretty general one. X is just some set and Y is just some set. But that's what's kind of exciting about supervised machine learning. It applies to a huge range of different data types and different things that you may want to do with it."},{"start":488.88,"text":"Among all of those hypotheses that are out there, and if you've taken any kind of math classes, you know there's a huge range of hypotheses that go from one set X to another set Y, just potentially uncountably many if Y is some big continuous set. So the question is, what makes a good prediction?"},{"start":505.2,"text":"Now, this is a subtle problem. This is something we're going to talk about for a while. We're going to talk about good in several contexts and more refined notions of good over the next couple of weeks. But kind of intuitively what we're after in this modeling question is we want a function that, you know, to use a fancy word that you don't have to use now, we want it to generalize. So what we would like to do is that this X and Y that we're selecting here, we'd like it to come from some set that's representative in some way that we can make precise. And then later when we're shown new images that are not from that original set,"}],"speech_gaps":[],"frame":"../frames/v049/003.webp","frame_time":368.03},{"title":"监督学习设定","segments":[{"id":23,"text":"this thing is going to label it. It's going to be able to look at a new picture of a cat and say, yep, that's a cat, not a dog. And so that's something that's good, that generalization. That's going to be the heart of machine learning. I train on this training set. I look at that. I'm going to compute my age. And somehow, some properties of the training set and the hypothesis class, that is, the ages that I consider,","zh":"这个东西会对其进行标记。它能够查看一张新的猫的图片并说，是的，那是一只猫，而不是狗。因此，这种泛化能力是很好的，这也是机器学习的核心。我在这个训练集上进行训练。我会查看这些数据。我会计算我的年龄。通过某种方式，训练集的一些属性以及假设类，也就是我考虑的年龄，将意味着我能够泛化到新的、未见过的事物上。之前我提到过，我们首先会讨论那些非常简单的H。我们可以证明，如果它们非常简单，它们就会具有这种属性，即能够迁移。但过去10年或更久以来，实际上发生的革命是训练那些非常大的H。这意味着它们由巨大的程序编码，由大量的所谓权重组成。随着我们深入课程内容，我们会讨论这些。这就是它的运作方式。这就是基本的设定。","start":534.7,"end":552.55},{"id":24,"text":"are going to mean that I generalize to new and unseen things. And what I mentioned before, what we'll talk about first, there's H's that are really simple. And we can prove that if they're really simple, they have this kind of property that they will transfer. But what has been the revolution for the last 10 or so years, maybe more, is actually training H's that are really, really big. That means that they are encoded by huge programs, huge numbers of what are called weights. And we're going to talk about that as we get into more of the class. So this is the way it works. This is the basic setup.","zh":"这意味着我要将所学知识泛化到新事物和未见过的事物上。之前我提到的，我们首先会讨论一些非常简单的H。我们可以证明，如果它们非常简单，它们就会具有这种性质，即能够迁移。但过去10年甚至更久以来的革命性进展，实际上是训练非常大的H。这意味着它们由庞大的程序编码，包含大量的所谓权重。随着我们进入课程的更多内容，我们会详细讨论这一点。这就是其运作方式。这就是基本的设定。","start":553.26,"end":582.71},{"id":25,"text":"Please feel free to ask questions about it. But this is kind of how it works. And so we're going to study this. Now, you could say, what else would you do? Well, in the second half of the course, I'm going to tell you about what happens if you don't have any labels. So this is just one of many machine learning setups you can have. But this is by far one of the most common and kind of working. Actually, it's kind of interesting. In my career, this is a technology. You can reliably do this in a number of situations. You can make these functions that generalize. That's really exciting. All right.","zh":"现在，最后一点术语。如果Y是连续的，我们称之为回归问题。这是实数，比如价格。我们今天将研究回归。它的数学计算会更容易。导数，我们需要计算的东西，它们手工计算起来会更容易。希望这些会更熟悉一些。如果Y是离散的，那么这就是一个分类问题。分类问题可能是如今在机器学习中你更常解决的问题，原因有很多。","start":583.53,"end":610.44},{"id":26,"text":"Now, a little bit of terminology here at the end. If Y is continuous, we call it a regression problem. That's real numbers, prices. We're going to look at regression today. The math for that is just easier. The derivatives, the things that we have to compute, they're just easier to compute by hand. They'll hopefully be a bit more familiar. If Y is discrete, then it's a classification problem. Classification problems are probably things that you end up solving more in machine learning these days for a variety of reasons.","zh":"现在，最后一点术语。如果Y是连续的，我们称之为回归问题。这是实数，比如价格。我们今天将研究回归。它的数学计算会更容易。导数，我们需要计算的东西，它们手工计算起来会更容易。希望这些会更熟悉一些。如果Y是离散的，那么这就是一个分类问题。分类问题可能是如今在机器学习中你更常解决的问题，原因有很多。","start":611.26,"end":637.47},{"id":27,"text":"For example, the way your chat GPT works is that it actually has a classifier head at the end that is guessing what's the next word. That's the way this stuff works. We'll talk about how those systems work as well. Awesome. Let's look at a first example of this using probably the most canonical, the most widely used dataset out there, which is this housing dataset, the AIMS housing dataset. This is real data. You can pull it down and play with it.","zh":"例如，你的聊天GPT的工作方式是，它实际上在最后有一个分类器头，猜测下一个词是什么。这就是这些系统的工作方式。我们也会讨论这些系统是如何工作的。太棒了。让我们通过使用最经典、最广泛使用的数据集来查看一个第一个例子，这就是AIMS住房数据集。这是真实的数据。你可以下载并对其进行操作。","start":638.41,"end":664.4},{"id":28,"text":"All right. So these are not Bay Area prices, but don't hold that against themselves. Now, what I've done here is I've just taken some data and I put it in a Python data frame. You can do the same. And then I just looked at the sale prices and the lot sizes and all the rest. And then on the right, I visualize the data. So just one thing in general, if you have the ability to do it, look at your data. I can't stress that enough. Look at your data. It's like...","zh":"好了，这些并不是湾区的价格，但不要因此责怪自己。现在，我所做的就是我仅仅取了一些数据并将其放入一个Python数据框中。你也可以这样做。然后我只查看了销售价格和地块面积以及其他所有内容。然后在右侧，我可视化了这些数据。总的来说，如果你有能力的话，请查看你的数据。我无法强调这一点。查看你的数据。就像……","start":666.25,"end":692.13},{"id":29,"text":"you're pretty good pattern recognizers take advantage of that okay even if you're building some complicated crazy ai system still look at your data you will discover things all right so we're looking at this data here we have the sale price we have the lot area and i've plotted it in some way there okay all right now","zh":"你是一个相当好的模式识别器，要利用这一点，好吧，即使你正在构建一些复杂的疯狂的AI系统，仍然要查看你的数据，你会发现一些东西。好了，我们在这里查看这些数据，我们有销售价格，我们有地块面积，并以某种方式绘制了它。好吧，现在","start":692.38,"end":708.97}],"notes":["本段介绍了监督学习的基本设定，即通过训练集训练模型，使其能够对新数据进行泛化。讲者提到，泛化能力是机器学习的核心，而模型的泛化能力取决于训练集和假设类的性质。","讲者指出，简单的假设类（H）可以证明其泛化能力，但近年来的突破在于训练非常大的假设类，这些假设类由大量参数（权重）编码，这在后续课程中会进一步讨论。","监督学习有两种主要类型：回归和分类。如果输出Y是连续的，称为回归问题，如房价预测；如果Y是离散的，则称为分类问题，如文本生成中的下一个词预测。","讲者以住房数据集为例，说明了如何使用Python数据框处理数据，并可视化数据。强调了在构建复杂模型之前，应先查看数据以发现潜在模式。","讲者提到，即使在构建复杂的AI系统时，也应查看数据，因为数据中可能包含有价值的信息，有助于模型的改进。","讲者最后提到，住房数据集并非湾区房价，但强调了数据可视化的重要性，并鼓励学生在处理数据时进行探索。"],"formulas":[],"uncertainties":["compute my age"],"diagram":"none","start":534.7,"end":708.97,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":534.7,"text":"this thing is going to label it. It's going to be able to look at a new picture of a cat and say, yep, that's a cat, not a dog. And so that's something that's good, that generalization. That's going to be the heart of machine learning. I train on this training set. I look at that. I'm going to compute my age. And somehow, some properties of the training set and the hypothesis class, that is, the ages that I consider,"},{"start":553.26,"text":"are going to mean that I generalize to new and unseen things. And what I mentioned before, what we'll talk about first, there's H's that are really simple. And we can prove that if they're really simple, they have this kind of property that they will transfer. But what has been the revolution for the last 10 or so years, maybe more, is actually training H's that are really, really big. That means that they are encoded by huge programs, huge numbers of what are called weights. And we're going to talk about that as we get into more of the class. So this is the way it works. This is the basic setup."},{"start":583.53,"text":"Please feel free to ask questions about it. But this is kind of how it works. And so we're going to study this. Now, you could say, what else would you do? Well, in the second half of the course, I'm going to tell you about what happens if you don't have any labels. So this is just one of many machine learning setups you can have. But this is by far one of the most common and kind of working. Actually, it's kind of interesting. In my career, this is a technology. You can reliably do this in a number of situations. You can make these functions that generalize. That's really exciting. All right."},{"start":611.26,"text":"Now, a little bit of terminology here at the end. If Y is continuous, we call it a regression problem. That's real numbers, prices. We're going to look at regression today. The math for that is just easier. The derivatives, the things that we have to compute, they're just easier to compute by hand. They'll hopefully be a bit more familiar. If Y is discrete, then it's a classification problem. Classification problems are probably things that you end up solving more in machine learning these days for a variety of reasons."},{"start":638.41,"text":"For example, the way your chat GPT works is that it actually has a classifier head at the end that is guessing what's the next word. That's the way this stuff works. We'll talk about how those systems work as well. Awesome. Let's look at a first example of this using probably the most canonical, the most widely used dataset out there, which is this housing dataset, the AIMS housing dataset. This is real data. You can pull it down and play with it."},{"start":666.25,"text":"All right. So these are not Bay Area prices, but don't hold that against themselves. Now, what I've done here is I've just taken some data and I put it in a Python data frame. You can do the same. And then I just looked at the sale prices and the lot sizes and all the rest. And then on the right, I visualize the data. So just one thing in general, if you have the ability to do it, look at your data. I can't stress that enough. Look at your data. It's like..."},{"start":692.38,"text":"you're pretty good pattern recognizers take advantage of that okay even if you're building some complicated crazy ai system still look at your data you will discover things all right so we're looking at this data here we have the sale price we have the lot area and i've plotted it in some way there okay all right now"}],"speech_gaps":[],"frame":"../frames/v049/004.webp","frame_time":546.7},{"title":"监督学习设定中的线性假设","segments":[{"id":30,"text":"We need to get one more character in our story. We need to get a hypothesis. So one popular choice are these linear hypotheses, right? And you may think that these linear hypotheses, you know, they seem relatively simple. That's the hope. But they're actually industrially used, right? These are kind of the workhorse of what we're going to do. These kind of linear classification models, they show up inside pretty much every model that you use. The last step is this linear model. So these are actually, in spite of their simplicity, pretty widely used.","zh":"我们需要在故事中再添加一个角色。我们需要一个假设。因此，一个流行的选择是这些线性假设，对吧？你可能会认为这些线性假设看起来相对简单。这是我们的希望。但实际上它们被广泛使用，对吧？这些就是我们将要进行工作的主力。这些类型的线性分类模型，几乎出现在你使用的每一个模型中。最后一步就是这个线性模型。因此，尽管它们很简单，实际上它们被广泛使用。","start":709.94,"end":738.02},{"id":31,"text":"We call them linear. It's a little bit of an abusive terminology. You'll see why we do in a second. It's because of a convention. This is technically an affine function because it has this little offset here. The way it works is you feed me an x. So let's imagine x is a scalar. And then I'm going to multiply it here times that theta 1 and then add it to theta 0. And so this gives me something wherever my x is. This is a very simple function that's taking in scalars. But this is my hypothesis class.","zh":"我们称它们为线性。这是一个有点滥用术语的说法。你马上就会明白我们这样做的原因。这是由于一种惯例。从技术上讲，这是一个仿射函数，因为它这里有一个小的偏移量。它的运作方式是，你给我一个x。让我们想象x是一个标量。然后我会将它乘以这里的theta 1，再加到theta 0上。这样，无论我的x是什么，都能得到一个结果。这是一个非常简单的函数，它接受标量作为输入。但这就是我们的假设类。","start":738.41,"end":763.55},{"id":32,"text":"If you look at an example prediction here, let's say that you wanted to, in our setting, we have a bunch of x's that are right here that we want to predict. And we like to predict some function that goes from the size of the house to the price in whatever units. Don't worry. Don't think too hard about what size and price mean here. I don't know what reasonable mapping. I don't think I've actually been to Ames. But these are apparently real prices. All right. So we have to do this example prediction from size to price. So we want to get a function, a linear function.","zh":"如果你看一下一个示例预测，比如说，在我们的设定中，我们有一堆在这里的x，我们想要预测它们。我们喜欢预测一个从房屋大小到价格的函数，不管单位是什么。不要担心。不要过于深入思考这里的大小和价格意味着什么。我不知道合理的映射是什么。我不认为我实际上去过阿姆斯。但这些显然是真实的价格。好的。因此，我们必须进行从大小到价格的示例预测。因此，我们想要得到一个函数，一个线性函数。","start":768.65,"end":795.89},{"id":33,"text":"that takes this size in as the x, and then out comes a price. Clear enough what our goals are? All right. Man, that's got to stop. All right. So notice that this prediction now is instead of all the wild hypotheses that could be out there, right? There's a ton of things that go from functions that go from a set of real numbers to another set of real numbers. We've now really constrained it. It's entirely defined. The fancy word for this is parametrically. It's entirely defined by these two little parameters.","zh":"它将这个大小作为输入x，然后输出一个价格。我们的目标足够清晰了吗？好的。天啊，这必须停止。好的。请注意，这个预测现在不再是所有可能的假设中的一种，对吧？有很多从实数集合到另一个实数集合的函数。我们现在真的限制了它。它完全被定义了。这个术语的正式说法是参数化。它完全由这两个小参数定义。","start":796.42,"end":825.15},{"id":34,"text":"No matter how many houses we see, we're only going to, as we'll say, learn those two parameters or estimate those two parameters. And that's going to be the way that we transfer.","zh":"无论我们看到多少房子，我们只会学习或估计这两个参数。这就是我们进行转换的方式。","start":825.93,"end":833.61},{"id":35,"text":"So it's a huge reduction in the space of functions that we've just done. So it seems like maybe not very much happened on the slide, but we went from uncountably many functions, we still have uncountably many functions, went to this really small class of lines. So what do these look like, by the way, just to draw them, just to make sure it's extra clear why we call them linear functions? Well, what is their value at 0? Well, that value of 0 is going to be theta 0.","zh":"因此，我们刚刚完成的函数空间中发生了巨大的缩减。看起来幻灯片上似乎没有发生太多变化，但我们从不可数的函数集合，仍然保持不可数的函数集合，转变到了一个非常小的线性函数类。那么这些函数看起来是什么样的呢？为了画出来，为了确保清楚为什么我们称它们为线性函数，它们在0点的值是什么呢？这个值就是theta 0。","start":834.55,"end":856.65},{"id":36,"text":"And then it's going to have a slope. And that slope at 1 is going to be here, theta 0 plus theta 1. This is 1. Hopefully, that's clear. All right, awesome. So with that, we're going to fit a line to this data. Now, which line are we going to fit? We're going to come to that in a second. But intuitively, what should that line, what would be a good line to fit? Well, it's one that when we give it an x, so I feed it in some x here, let's say this point.","zh":"然后它会有一个斜率。这个斜率在1点的值是theta 0加上theta 1。这是1。希望这很清楚。好的，太棒了。有了这些，我们将拟合一条线到这些数据上。现在，我们要拟合哪条线呢？我们稍后会讲到。但直观上，这条线应该是什么样的呢？什么样的线是适合拟合的呢？当给它一个x值时，比如我输入这个点，它应该给出一个合适的输出。","start":857.33,"end":886.46}],"notes":["本段介绍了监督学习中线性假设的基本概念，强调了线性模型的简单性和广泛使用。线性模型虽然简单，但被广泛应用于各种模型中，是机器学习中的基础工具。","讲者指出，线性模型实际上是仿射函数，因为它包含了一个偏置项（theta 0）。这种模型通过将输入特征（x）乘以权重（theta 1）并加上偏置项（theta 0）来生成输出。","在实际应用中，线性模型被用来预测从输入特征（如房屋大小）到输出（如价格）的映射关系。虽然具体的映射意义可能不明确，但这些数据是真实的。","线性模型通过参数（theta 0 和 theta 1）完全定义，这使得模型的假设空间大大缩小，从无限多的函数减少到所有可能的直线。","讲者通过解释线性函数在0点的值（theta 0）和斜率（theta 0 + theta 1）来进一步说明线性模型的结构，强调了参数对模型行为的影响。","最后，讲者提到接下来将讨论如何选择合适的线性模型来拟合数据，这为后续的模型训练和优化奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":709.94,"end":886.46,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":709.94,"text":"We need to get one more character in our story. We need to get a hypothesis. So one popular choice are these linear hypotheses, right? And you may think that these linear hypotheses, you know, they seem relatively simple. That's the hope. But they're actually industrially used, right? These are kind of the workhorse of what we're going to do. These kind of linear classification models, they show up inside pretty much every model that you use. The last step is this linear model. So these are actually, in spite of their simplicity, pretty widely used. Okay, so what is age?"},{"start":738.41,"text":"We call them linear. It's a little bit of an abusive terminology. You'll see why we do in a second. It's because of a convention. This is technically an affine function because it has this little offset here. The way it works is you feed me an x. So let's imagine x is a scalar. And then I'm going to multiply it here times that theta 1 and then add it to theta 0. And so this gives me something wherever my x is. This is a very simple function that's taking in scalars. But this is my hypothesis class."},{"start":768.65,"text":"If you look at an example prediction here, let's say that you wanted to, in our setting, we have a bunch of x's that are right here that we want to predict. And we like to predict some function that goes from the size of the house to the price in whatever units. Don't worry. Don't think too hard about what size and price mean here. I don't know what reasonable mapping. I don't think I've actually been to Ames. But these are apparently real prices. All right. So we have to do this example prediction from size to price. So we want to get a function, a linear function."},{"start":796.42,"text":"that takes this size in as the x, and then out comes a price. Clear enough what our goals are? All right. Man, that's got to stop. All right. So notice that this prediction now is instead of all the wild hypotheses that could be out there, right? There's a ton of things that go from functions that go from a set of real numbers to another set of real numbers. We've now really constrained it. It's entirely defined. The fancy word for this is parametrically. It's entirely defined by these two little parameters."},{"start":825.93,"text":"No matter how many houses we see, we're only going to, as we'll say, learn those two parameters or estimate those two parameters. And that's going to be the way that we transfer."},{"start":834.55,"text":"So it's a huge reduction in the space of functions that we've just done. So it seems like maybe not very much happened on the slide, but we went from uncountably many functions, we still have uncountably many functions, went to this really small class of lines. So what do these look like, by the way, just to draw them, just to make sure it's extra clear why we call them linear functions? Well, what is their value at 0? Well, that value of 0 is going to be theta 0."},{"start":857.33,"text":"And then it's going to have a slope. And that slope at 1 is going to be here, theta 0 plus theta 1. This is 1. Hopefully, that's clear. All right, awesome. So with that, we're going to fit a line to this data. Now, which line are we going to fit? We're going to come to that in a second. But intuitively, what should that line, what would be a good line to fit? Well, it's one that when we give it an x, so I feed it in some x here, let's say this point."}],"speech_gaps":[],"frame":"../frames/v049/005.webp","frame_time":721.94},{"title":"监督学习设定中的预测与误差最小化","segments":[{"id":37,"text":"When I look at the line, my prediction is on the line. So if I fed it in something at 1200, my prediction would be this point here. If I could draw straight with this thing. Let me try to draw a little bit straighter. Anyway, my prediction would be on that line. Is that clear? When I take the x, I put it into the hypothesis, it gives me that line. Cool. Now, what would be good? Well, one thing that would be good is because we have this training set, is that every time we put a point into this data set, whether it's here, here we didn't do such a good job, right? We're really, really far from the line.","zh":"当我看这条线时，我的预测是在这条线上。所以如果我输入一个1200的值，我的预测结果会是这里这个点。如果我能用这个工具画一条直线的话。让我试着画得更直一点。无论如何，我的预测结果会在那条线上。清楚吗？当我取一个x值，把它输入假设函数，它就会给出这条线。很好。那么什么会是好的呢？其中一个好之处是，因为我们有这个训练集，每次我们把这个数据集中的一个点输入进去，无论它是在这里还是这里，我们都没有做得很好，对吧？我们离这条线真的非常远。","start":887.4,"end":914.58},{"id":38,"text":"Here and here, we seem to have done a really, really great job. And so that we're going to try and do those errors that we make. Those are how far off we are in the price. We're going to try and minimize those. This has a really fancy name. It's called empirical risk minimization. I don't think you need to know that name, but you'll sometimes hear me slip and say ERM. And that's what your empirical risk minimization means. Okay, cool.","zh":"在这里和这里，我们似乎做得非常非常出色。因此，我们要尝试减少这些误差。这些误差表示我们在价格上的偏离程度。我们要尝试最小化这些误差。这有一个非常 fancy 的名字，叫做经验风险最小化。我不认为你需要记住这个名字，但有时我会不小心说 ERM。这就是你所说的经验风险最小化。好的，很好。","start":915.29,"end":937.2},{"id":39,"text":"So here's a nicer picture that I generated where the function's behaving much more nicely. So each point here is one of those data points that we saw. And here, we're trying to minimize this little line through it. Now, the idea, of course, which is nice about the line is if you just had the training set, the way you would potentially do a prediction, there's actually not a bad way to do it. We won't talk about it too much today. You do what's called nearest neighbors. You take in an x. You kind of look in the neighbor of x. Maybe you average them.","zh":"这里有一个更清晰的图片，我生成的函数表现得更加平滑。这里的每个点都是我们之前看到的数据点之一。在这里，我们试图最小化穿过这些点的那条小线。当然，这个想法很美好，即如果你只有训练集，你进行预测的方式其实并不差。我们今天不会过多讨论这一点。你所做的是一种叫做最近邻的方法。你输入一个x值，然后你大致查看x的邻域，也许你会对它们进行平均。","start":938.56,"end":966.19},{"id":40,"text":"That could be an interesting prediction function. What's nice about H is it extends to every single value. And it extends in kind of a smooth way. And so hopefully what that means is that if there's lots of gyrations here, we capture that main trend. We get the main part of the prediction, which makes it kind of a good predictor overall. OK. All right. Now, one other thing which you can see from this. Oops. Let's get that guy up.","zh":"这可能是一个有趣的预测函数。H 的好处在于它能够延伸到每一个值，并且是以一种平滑的方式延伸的。因此，希望这意味着如果这里有很多波动，我们能够捕捉到主要趋势。我们得到预测的主要部分，这使得它整体上成为一个不错的预测器。好的。好了。还有一个事情你可以从这里看到。哎呀。让我们把那个家伙调上来。","start":966.81,"end":996.04},{"id":41,"text":"There's a slight mismatch there. Sorry for that. So as we look through here, if you look at that line that I drew, you could argue that you should draw a different line. You're like, oh, I like this other line a little bit better. You know, it kind of goes, oops, let's go in here. It goes like this, all the way. Oh, I definitely don't like that line.","zh":"那里有一个轻微的不匹配。对此我表示歉意。当我们在这里观察时，如果你看一下我画的那条线，你可能会认为应该画一条不同的线。你会说，哦，我更喜欢那条其他的线。你知道，它有点像，哎呀，让我们在这里。它会像这样一直延伸下去。哦，我 definitely 不喜欢那条线。","start":996.58,"end":1012.9},{"id":42,"text":"There's one line there. Maybe I draw like this. It's a terrible line. So how did I pick this one line that's in there? And that's what we're going to do, this ERM, this thing. We're going to look at the data, and we're going to have to be able to compute that. But the point is, is no line looks like it's absolutely perfect. And that's going to be a theme throughout most of what we do. Your data has a couple of different things in it. Sometimes...","zh":"那里有一条线。也许我画得像这样。这是一条糟糕的线。那么我是如何选择出那条线的呢？这就是我们要做的，这个 ERM（经验风险最小化）。我们会观察数据，并且必须能够计算出这个。但重点是，没有任何一条线看起来是绝对完美的。这将是我们大部分内容中的一个主题。你的数据中包含着一些不同的因素。有时候……","start":1013.5,"end":1032.58},{"id":43,"text":"It's imperfect because we're not modeling something. So probably the rate that you're willing to pay for a house depends on more than the lot size. You don't just care how big the lot is. You may care if it's a nice house, if it's close to things you care about, all the rest. We'll come back in a minute to about how we incorporate that. But the other thing is, even if we added in all those features, usually, there will be some error. And so we're going to worry a lot in this class about the error.","zh":"它是不完美的，因为我们没有对某事物进行建模。因此，你愿意为房子支付的价格率可能不仅仅取决于地块大小。你不仅仅关心地块有多大。你可能还关心房子是否漂亮，是否靠近你关心的事物，等等。我们稍后会回到如何将这些因素纳入考虑的问题。但另一个问题是，即使我们加入了所有这些特征，通常也会有一些误差。因此，在本课程中，我们将非常关注误差的问题。","start":1033.31,"end":1057.66}],"notes":["本段讲解了监督学习中预测模型的基本概念，即通过训练数据拟合一条直线，预测输入值对应的输出。讲者提到，预测结果会落在这条直线上，例如输入1200时，预测值为该点。同时，讲者指出，模型在某些点上表现良好，而在其他点上则存在较大误差。","讲者提到，误差最小化是监督学习中的核心目标之一，称为经验风险最小化（ERM）。虽然这个术语可能不需要特别记忆，但讲者会偶尔使用。讲者强调，ERM的目标是减少预测值与实际值之间的差距。","讲者进一步解释了预测函数的性质，即它能够扩展到所有可能的输入值，并以平滑的方式进行预测。这使得模型能够捕捉数据中的主要趋势，从而成为整体预测的有力工具。","讲者指出，模型在拟合数据时无法完美匹配所有点，这是监督学习中的一个普遍现象。数据本身可能包含多种因素，而模型无法完全捕捉所有影响因素，因此存在误差。","讲者以房价预测为例，说明模型可能无法完全反映所有影响房价的因素，如房屋质量、地理位置等。即使引入了这些特征，仍然可能存在误差，因此需要关注误差的建模和分析。","讲者强调，监督学习的核心目标之一是减少预测误差，而误差的存在是由于模型无法完全捕捉数据中的所有信息。因此，学习和建模过程需要关注如何有效减少误差。"],"formulas":[],"uncertainties":[],"diagram":"none","start":887.4,"end":1057.66,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":887.4,"text":"When I look at the line, my prediction is on the line. So if I fed it in something at 1200, my prediction would be this point here. If I could draw straight with this thing. Let me try to draw a little bit straighter. Anyway, my prediction would be on that line. Is that clear? When I take the x, I put it into the hypothesis, it gives me that line. Cool. Now, what would be good? Well, one thing that would be good is because we have this training set, is that every time we put a point into this data set, whether it's here, here we didn't do such a good job, right? We're really, really far from the line."},{"start":915.29,"text":"Here and here, we seem to have done a really, really great job. And so that we're going to try and do those errors that we make. Those are how far off we are in the price. We're going to try and minimize those. This has a really fancy name. It's called empirical risk minimization. I don't think you need to know that name, but you'll sometimes hear me slip and say ERM. And that's what your empirical risk minimization means. Okay, cool."},{"start":938.56,"text":"So here's a nicer picture that I generated where the function's behaving much more nicely. So each point here is one of those data points that we saw. And here, we're trying to minimize this little line through it. Now, the idea, of course, which is nice about the line is if you just had the training set, the way you would potentially do a prediction, there's actually not a bad way to do it. We won't talk about it too much today. You do what's called nearest neighbors. You take in an x. You kind of look in the neighbor of x. Maybe you average them."},{"start":966.81,"text":"That could be an interesting prediction function. What's nice about H is it extends to every single value. And it extends in kind of a smooth way. And so hopefully what that means is that if there's lots of gyrations here, we capture that main trend. We get the main part of the prediction, which makes it kind of a good predictor overall. OK. All right. Now, one other thing which you can see from this. Oops. Let's get that guy up."},{"start":996.58,"text":"There's a slight mismatch there. Sorry for that. So as we look through here, if you look at that line that I drew, you could argue that you should draw a different line. You're like, oh, I like this other line a little bit better. You know, it kind of goes, oops, let's go in here. It goes like this, all the way. Oh, I definitely don't like that line."},{"start":1013.5,"text":"There's one line there. Maybe I draw like this. It's a terrible line. So how did I pick this one line that's in there? And that's what we're going to do, this ERM, this thing. We're going to look at the data, and we're going to have to be able to compute that. But the point is, is no line looks like it's absolutely perfect. And that's going to be a theme throughout most of what we do. Your data has a couple of different things in it. Sometimes..."},{"start":1033.31,"text":"It's imperfect because we're not modeling something. So probably the rate that you're willing to pay for a house depends on more than the lot size. You don't just care how big the lot is. You may care if it's a nice house, if it's close to things you care about, all the rest. We'll come back in a minute to about how we incorporate that. But the other thing is, even if we added in all those features, usually, there will be some error. And so we're going to worry a lot in this class about the error."}],"speech_gaps":[],"frame":"../frames/v049/006.webp","frame_time":899.4},{"title":"监督学习设定中的线性模型与特征扩展","segments":[{"id":44,"text":"of how we do in these predictions and how well the error on our training sets manifest on what are called the test sets when we take it out into real life. All right. So look at something slightly more interesting. So here we're going to add in the number of bedrooms. So what do you think is going to happen? Well, now we need a function that can take in pairs instead of single values. So we need to change our hypothesis class a little bit.","zh":"我们如何在这些预测中表现以及我们的训练集上的误差在现实生活中被称为测试集时的表现。好的。那么让我们看看稍微有趣一点的情况。在这里，我们将加入卧室的数量。你们认为会发生什么呢？现在我们需要一个函数，它可以接受成对的输入，而不是单个值。因此，我们需要稍微改变一下我们的假设类。","start":1058.19,"end":1080.43},{"id":45,"text":"Lot size and size. I guess size refers to the house size. Apologies. Now we have this function here. So how does it work? Well, if you feed me an x, then I take this guy, put him here, put this one here, put this one here. And then I hopefully have weights now I'm parameterized by. Oh, that came all back. By just those weights now. So now my function is parameterized by four weights. And hopefully it's going to fit my data a little bit better.","zh":"土地面积和面积。我想这里的面积指的是房屋面积。抱歉。现在我们有了这个函数。它是如何工作的呢？如果你给我一个x，那么我会把这个值放在这里，把这个放在这里，把这个放在这里。然后我希望现在有了权重，这些权重参数化了我。哦，这又回来了。仅仅通过这些权重。现在我的函数由四个权重参数化。我希望它能更好地拟合我的数据。","start":1082.66,"end":1109.48},{"id":46,"text":"The reason it should be a little bit better is I could always set some of those weights to zero and get back to the case where I only had two weights. So it seems like it's a larger or more expressive class. But if lot size and bedrooms influence price, we would hope that this hypothesis class is richer is the terminology. And that would allow us to fit our data a little bit better.","zh":"它应该会更好一点的原因是我总是可以将其中一些权重设为零，从而回到只有两个权重的情况。因此，这似乎是一个更大或更丰富的类。但如果土地面积和卧室数量影响价格，我们希望这个假设类更丰富，这是术语。这将允许我们更好地拟合我们的数据。","start":1110.38,"end":1128.58},{"id":47,"text":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have.","zh":"这就是我们称这些函数为线性而不是仿射函数的一个原因，因为我们将在这种小而方便的约定下操作，即我们总是假设x0是1，而我们甚至没有写出来。我强调这个约定，因为它贯穿了整个笔记。当我偏离它时，我会明确告诉你。但无论我们进行回归还是分类，这都是我们所拥有的。","start":1132.6,"end":1152.34},{"id":48,"text":"So that allows us to write a nice little form like this. h of x is just this nice little sum. We don't have to special case the theta 0 term. And we can easily extend from 3 to however many dimensions. Awesome. OK. So that all leads into, as I said, notation. So if this is unfamiliar to you, please go to the Friday.","zh":"这使我们能够写出这种漂亮的形式。h(x)只是一个漂亮的求和。我们不需要特别处理θ0项。而且我们可以轻松地从三维扩展到任意多维。太棒了。好的。因此，正如我所说的，这都引出了记号的问题。如果这对你来说不熟悉，请去周五的课程。","start":1153.55,"end":1178.55},{"id":49,"text":"you know, sessions. A lot of this is us kind of recalling notation where you're like, oh, I know that I need to look at it, or oh, I need to go and, you know, avail myself of some of the extra resources. So this notation here, we'll write theta, but we really mean this vector, which will also live in R4. It's four real numbers, okay? Four scalars. This thing here, notice now this X1, we're writing the entire example in here, and this one is 1.","zh":"你知道，这些内容。很多都是我们在回忆一些符号，比如，哦，我知道我需要看一下，或者哦，我需要去利用一些额外的资源。这里的符号，我们写成 theta，但我们真正指的是这个向量，它也存在于 R4 中。这是四个实数，对吧？四个标量。这里的东西，注意现在这个 X1，我们在这里写入了整个示例，而这个是 1。","start":1179.5,"end":1206.42},{"id":50,"text":"Okay, so here's 1, here's 2104 here, 4, 4, 45, 45. Clear enough? Okay.","zh":"好的，这里的是 1，这里是 2104，这里是 4，4，45，45。清楚吗？好的。","start":1207.03,"end":1215.91}],"notes":["本段讲解了监督学习中线性模型的构建过程，特别是如何通过引入更多特征（如卧室数量）来扩展模型的表达能力。讲者指出，当特征数量增加时，模型需要能够处理多维输入，因此需要调整假设空间，使其能够处理多个特征的组合。","讲者提到，当特征数量增加时，模型参数的数量也随之增加，这使得模型能够更灵活地拟合数据。但讲者也指出，如果某些特征对目标变量（如房价）没有影响，可以通过将对应参数设为零来简化模型，从而回到更简单的形式。","讲者强调了线性模型中一个重要的约定，即假设输入向量的第一个元素始终为1，这一约定在后续的推导和公式中被广泛使用。这一约定使得模型可以统一处理常数项（如截距项）和其他特征项。","讲者进一步说明了线性模型的表达形式，即通过将参数向量与输入向量进行点积来得到预测值。这种形式使得模型可以轻松地扩展到任意维度，而无需对特定参数（如截距项）进行特殊处理。","讲者提到，为了帮助学生理解这些概念，建议他们回顾相关的课程资料或参加周五的复习会。这表明课程内容较为复杂，需要学生主动查阅资料以加深理解。","讲者最后通过具体的数值示例（如1、2104、4、45等）来说明输入向量的结构，并指出其中某些元素对应的是特征值，而某些元素（如1）则用于表示模型中的常数项。"],"formulas":[{"latex":"h(x) = \\theta_0 x_0 + \\theta_1 x_1 + \\theta_2 x_2 + \\theta_3 x_3","symbols":"h(x) 表示预测值，θ 表示参数向量，x 表示输入向量","explanation":"公式正确，表示线性回归模型，其中x_0是输入向量的第一个元素，通常设为1以包含截距项。","evidence":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have."},{"latex":"x_0 = 1","symbols":"x_0 是输入向量的第一个元素，始终设为1","explanation":"公式正确，表示输入向量的第一个元素x_0始终设为1，以包含截距项。","evidence":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have."}],"uncertainties":["在段落45中，'size refers to the house size' 的表述可能存在歧义，但根据上下文可以推断为房屋面积。"],"diagram":"none","start":1058.19,"end":1215.91,"asr_flags":[],"math_clarifications":["公式正确，无需修改。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1058.19,"text":"of how we do in these predictions and how well the error on our training sets manifest on what are called the test sets when we take it out into real life. All right. So look at something slightly more interesting. So here we're going to add in the number of bedrooms. So what do you think is going to happen? Well, now we need a function that can take in pairs instead of single values. So we need to change our hypothesis class a little bit."},{"start":1082.66,"text":"Lot size and size. I guess size refers to the house size. Apologies. Now we have this function here. So how does it work? Well, if you feed me an x, then I take this guy, put him here, put this one here, put this one here. And then I hopefully have weights now I'm parameterized by. Oh, that came all back. By just those weights now. So now my function is parameterized by four weights. And hopefully it's going to fit my data a little bit better."},{"start":1110.38,"text":"The reason it should be a little bit better is I could always set some of those weights to zero and get back to the case where I only had two weights. So it seems like it's a larger or more expressive class. But if lot size and bedrooms influence price, we would hope that this hypothesis class is richer is the terminology. And that would allow us to fit our data a little bit better."},{"start":1132.6,"text":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have."},{"start":1153.55,"text":"So that allows us to write a nice little form like this. h of x is just this nice little sum. We don't have to special case the theta 0 term. And we can easily extend from 3 to however many dimensions. Awesome. OK. So that all leads into, as I said, notation. So if this is unfamiliar to you, please go to the Friday."},{"start":1179.5,"text":"you know, sessions. A lot of this is us kind of recalling notation where you're like, oh, I know that I need to look at it, or oh, I need to go and, you know, avail myself of some of the extra resources. So this notation here, we'll write theta, but we really mean this vector, which will also live in R4. It's four real numbers, okay? Four scalars. This thing here, notice now this X1, we're writing the entire example in here, and this one is 1."},{"start":1207.03,"text":"Okay, so here's 1, here's 2104 here, 4, 4, 45, 45. Clear enough? Okay."}],"speech_gaps":[],"frame":"../frames/v049/007.webp","frame_time":1070.19},{"title":"监督学习设定中的参数与特征","segments":[{"id":51,"text":"We're going to call these thetas here parameters. And these xi are going to be input or features. Remember when I talked to you about before, which I said you could add in these extra features of your problem? That's, for now, going to be a modeling decision. Later, we're going to see an interesting idea about how we can even learn those features. That was part of what was called the deep learning revolution, where you were able to actually impute the representation of your data just by throwing more data at it. We'll see that in a couple of weeks. But for now, it's a modeling decision. You come and write some rule, some piece of code that","zh":"在这里，我们将这些称为θ，它们是参数。而这些ξ将作为输入或特征。还记得我之前和你们谈到的吗，我说过你们可以在问题中添加这些额外的特征？现在，这将是一个建模决策。之后，我们将看到一个有趣的想法，即我们甚至可以学习这些特征。这就是所谓的深度学习革命的一部分，你们可以通过投入更多的数据来实际推断数据的表示。我们将在几周后看到这一点。但目前，这是一个建模决策。你们会编写一些规则，一些代码，","start":1220.78,"end":1249.84},{"id":52,"text":"takes the number and puts it in as the feature. And it's not trivial. It normalized the lot size here. It said 45 instead of 45k. But in general, they could be even more interesting features of your problem. And the point is that extends naturally to linear models. So far, so good? All right.","zh":"将数字作为特征输入。这并不简单。这里对面积进行了归一化处理，将45k变成了45。但一般来说，这些可以是你们问题中更加有趣的特征。重点是，这自然地扩展到了线性模型。到目前为止，一切顺利吗？好的。","start":1250.1,"end":1267.88},{"id":53,"text":"So X and Y has a fancy name, training example. It's an element of the training set. And the reason that we call it training is we're going to take that set and we're going to train our model on it. It's kind of the terminology for it. We're going to try and figure out among all the thetas, which are our predictions, which ones fit our data best. We've been vague about what data best means, but there's a lot of ways to do that, it turns out. But they all follow the same recipe. And then, as I said before, I just wanted to highlight the example again, that XI and YI are an individual example.","zh":"所以X和Y有一个更正式的名称，称为训练示例。它是训练集的一个元素。我们称之为训练的原因是我们将使用这个集合来训练我们的模型。这是术语的用法。我们将尝试在所有θ中，也就是我们的预测中，找出最符合数据的那些。我们之前对“最佳数据”这一概念有些模糊，但事实上有很多方法可以做到这一点，它们都遵循相同的步骤。正如我之前所说，我想再次强调这个例子，即XI和YI是一个单独的示例。","start":1268.68,"end":1296.38},{"id":54,"text":"All right. So in notation in the class, you will always see this is something that you will see. This is as convention. We'll always have n be the number of examples. So you should kind of get that in your mind. And d be the number of dimensions or features. So we'll consider these either d or d plus 1 dimensional, plus 1 because of that convention. Bless you. That x0 equals 1. Please.","zh":"好的。在课堂上的符号表示中，你们总是会看到这一点，这是惯例。我们将始终用n表示示例的数量，你们应该在脑海中记住这一点。用d表示维度或特征的数量。我们将考虑这些是d维或d+1维的，因为有这个惯例。谢谢。请记住x0等于1。","start":1298.98,"end":1322.76},{"id":55,"text":"Yeah, so we will almost always use lowercase n. We will try not to abuse you by having upper and lowercase n's in the same lectures, but I cannot guarantee that because especially if they're copied from handwriting, often we'll use them. We'll try not to use them both in the lecture to mean two different things. So usually we'll be a little bit consistent. The other convention you'll sometimes see sneak in is p's for parameters, but that's like a stats convention, and it doesn't really matter. None of this will really matter. If you're confused, just ask. Cool. All right.","zh":"是的，所以我们几乎总是使用小写n。我们尽量不让你在同一个讲座中看到大写和小写的n，但我不能保证，因为特别是当它们是从手写体复制过来时，我们经常会使用它们。我们尽量在讲座中不同时用它们表示两个不同的意思。所以通常我们会保持一定的连贯性。你有时还会看到另一种惯例，用p表示参数，但这是一种统计学惯例，其实并不重要。这些都不会真正重要。如果你感到困惑，随时可以提问。好的，好了。","start":1326.51,"end":1354.51},{"id":56,"text":"All right, so what do these things look like, these linear models look like? Here's one in two dimensions. This is about as high as you can really reasonably look on your data set. So here we have a bunch of different points. We have price. We have bedrooms and square feet at the bottom. And I've plotted a plane here, an affine surface.","zh":"好的，那么这些模型看起来是什么样子的呢？这里是二维空间中的一个例子。这已经是你们数据集中可以合理观察到的最高维度了。这里我们有一些不同的点，我们有价格，底部有卧室数量和平方英尺数。我在图中绘制了一个平面，一个仿射曲面。","start":1355.6,"end":1373.24},{"id":57,"text":"You could imagine a classification that was some kind of crazy curve. We'll see how to do that later. There's all kinds of nice ways to do that. But for right now, we're looking at these big linear models. And you see this is kind of a good thing in the same way. So how would you define error? Well, how close is your prediction? If you took that point, that feature point, and you went into space, how far away are you from this plane? Now, we're going to consider, as we get here, like modern models, as I mentioned, just got bigger.","zh":"你可以想象一种分类，它是一些奇怪的曲线。我们之后会看到如何实现这一点，有很多漂亮的方法可以做到这一点。但目前，我们关注的是这些大的线性模型。你可以看到，这在某种程度上也是好事。那么如何定义误差呢？你的预测有多接近呢？如果你取那个点，那个特征点，然后进入空间，你离这个平面有多远？现在，我们将考虑，正如我之前提到的，现代模型，只是变得更大了。","start":1374.36,"end":1399.12}],"notes":["本段主要讲解监督学习中的参数和特征的概念。参数（thetas）是模型中需要学习的变量，而特征（xi）是输入数据的属性。这些特征可以是用户手动添加的，也可以通过深度学习自动学习。在模型训练过程中，我们需要找到最佳的参数来拟合数据。","在监督学习中，训练示例（X和Y）是训练集中的元素，用于训练模型。模型的目标是找到能够最好地拟合数据的参数。虽然“最好”这个概念可能模糊，但不同的方法都遵循相同的训练流程。","课程中提到，n通常表示样本数量，d表示特征数量。在某些情况下，特征数量可能加上一个常数项（如x0=1），以方便计算。这种约定在机器学习中非常常见。","在讲解线性模型时，课程提到线性模型在二维空间中表现为一个平面，而在更高维空间中则表现为一个超平面。模型的误差可以通过预测值与真实值之间的距离来衡量。","课程还提到，线性模型虽然简单，但可以通过添加更多特征或使用更复杂的模型（如深度学习）来提高性能。这些概念为后续课程内容奠定了基础。","在讨论模型误差时，课程强调了如何衡量预测值与真实值之间的距离，这为后续的损失函数和优化方法提供了理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1220.78,"end":1399.12,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1220.78,"text":"We're going to call these thetas here parameters. And these xi are going to be input or features. Remember when I talked to you about before, which I said you could add in these extra features of your problem? That's, for now, going to be a modeling decision. Later, we're going to see an interesting idea about how we can even learn those features. That was part of what was called the deep learning revolution, where you were able to actually impute the representation of your data just by throwing more data at it. We'll see that in a couple of weeks. But for now, it's a modeling decision. You come and write some rule, some piece of code that"},{"start":1250.1,"text":"takes the number and puts it in as the feature. And it's not trivial. It normalized the lot size here. It said 45 instead of 45k. But in general, they could be even more interesting features of your problem. And the point is that extends naturally to linear models. So far, so good? All right."},{"start":1268.68,"text":"So X and Y has a fancy name, training example. It's an element of the training set. And the reason that we call it training is we're going to take that set and we're going to train our model on it. It's kind of the terminology for it. We're going to try and figure out among all the thetas, which are our predictions, which ones fit our data best. We've been vague about what data best means, but there's a lot of ways to do that, it turns out. But they all follow the same recipe. And then, as I said before, I just wanted to highlight the example again, that XI and YI are an individual example."},{"start":1298.98,"text":"All right. So in notation in the class, you will always see this is something that you will see. This is as convention. We'll always have n be the number of examples. So you should kind of get that in your mind. And d be the number of dimensions or features. So we'll consider these either d or d plus 1 dimensional, plus 1 because of that convention. Bless you. That x0 equals 1. Please."},{"start":1326.51,"text":"Yeah, so we will almost always use lowercase n. We will try not to abuse you by having upper and lowercase n's in the same lectures, but I cannot guarantee that because especially if they're copied from handwriting, often we'll use them. We'll try not to use them both in the lecture to mean two different things. So usually we'll be a little bit consistent. The other convention you'll sometimes see sneak in is p's for parameters, but that's like a stats convention, and it doesn't really matter. None of this will really matter. If you're confused, just ask. Cool. All right."},{"start":1355.6,"text":"All right, so what do these things look like, these linear models look like? Here's one in two dimensions. This is about as high as you can really reasonably look on your data set. So here we have a bunch of different points. We have price. We have bedrooms and square feet at the bottom. And I've plotted a plane here, an affine surface."},{"start":1374.36,"text":"You could imagine a classification that was some kind of crazy curve. We'll see how to do that later. There's all kinds of nice ways to do that. But for right now, we're looking at these big linear models. And you see this is kind of a good thing in the same way. So how would you define error? Well, how close is your prediction? If you took that point, that feature point, and you went into space, how far away are you from this plane? Now, we're going to consider, as we get here, like modern models, as I mentioned, just got bigger."}],"speech_gaps":[],"frame":"../frames/v049/008.webp","frame_time":1232.78},{"title":"监督学习设定与最小二乘法","segments":[{"id":58,"text":"They have thousands, hundreds of thousands, millions, billions, trillions of parameters. Some of the models now have trillions of parameters in them. They're not all fed into a line like this. But they'll conventionally have 10,000 dimensional spaces that are the last piece of the model. That's really hard to visualize. So we're going to use a lot of vector notation and other things to deal with it. And that's why we use this notation, so you can simplify and think about it and understand how to manipulate it. In one or two dimensions, you can kind of picture it. But high dimensional space is a weird thing. OK.","zh":"它们有成千上万、几十万、几百万、几十亿甚至几万亿的参数。现在有些模型内部包含几万亿个参数。它们并不是全部都像这样输入到一条线上。但它们通常会有一个10,000维的空间，这是模型的最后一部分。这真的很难可视化。因此，我们将使用大量的向量符号和其他方法来处理这个问题。这就是我们使用这种符号的原因，以便简化并思考如何操作它。在一维或二维空间中，你可以大致想象出来。但高维空间是一个奇怪的东西。好的。","start":1400.11,"end":1431.22},{"id":59,"text":"All right. OK. So let's get back to it. So we want to choose some theta such that, as we talked about multiple times, h of x is approximately equal to y. If I give you an x and a new thing, you want to be approximately close. You'd like the price to be close and so on. So how do we do it? Well, here comes least squares. So maybe you've seen this before. I hope you've seen it before. By show of hands, who's seen least squares before? Awesome. Fantastic. All right. Good.","zh":"好的。好的。那我们回到主题。我们想要选择一个θ，使得，正如我们多次讨论过的那样，h(x)近似等于y。如果你给我一个x和一个新事物，你希望它近似接近。你希望价格接近，等等。那么我们该如何做到这一点呢？这里出现了最小二乘法。也许你之前见过这个方法。我希望你之前见过。举手示意，谁之前见过最小二乘法？太棒了。太好了。好的。","start":1432.48,"end":1463.35},{"id":60,"text":"Least squares, super conventional thing. If you haven't seen it before, please, again, Friday is a good place to look at it. We'll cover it again just in our notation to make sure everything is all right. Now, what happens? So you have this idea here, j theta. That's going to be the loss that you incur. And it's broken down into terms on every single element of the data set. And here you have h theta of xi minus yi. So this is the error.","zh":"最小二乘法，这是一个非常常规的方法。如果你之前没有见过，那么请再次查看周五的内容。我们将在我们的符号中再次讲解它，以确保一切顺利。那么会发生什么呢？你有这个想法，即jθ。这将是你要承担的损失。它被分解为数据集中每一个元素的项。在这里，你有hθ(xi)减去yi。这就是误差。","start":1464.89,"end":1489.82},{"id":61,"text":"remember we kept drawing those pictures like this guy right here? These two things are the same.","zh":"还记得我们一直画这样的图，像这个家伙一样吗？这两个东西是相同的。","start":1490.45,"end":1494.45},{"id":62,"text":"remember we kept drawing those pictures like this guy right here? These two things are the same.","zh":"还记得我们一直画这样的图，像这个家伙一样吗？这两个东西是相同的。","start":1494.55,"end":1501.99},{"id":63,"text":"y i, that's the prediction error. Then what we do is we square it. And we square it because we want","zh":"yi，这是预测误差。然后我们做的是将它平方。我们将它平方是因为我们想要","start":1501.99,"end":1506.73},{"id":64,"text":"to have something that we have a positive or non-negative number there. It could be zero if","zh":"得到一个正数或非负数。如果它完全相等，它可能会是零。","start":1506.73,"end":1511.07},{"id":65,"text":"it were exactly equal. And then what we're going to do is we're going to try and pick the theta","zh":"然后我们将尝试选择θ","start":1511.07,"end":1514.61},{"id":66,"text":"that minimizes it, okay? Just by show of hands, how many people know the arg min notation?","zh":"那个最小化它，好吗？仅仅通过举手，有多少人知道arg min符号？","start":1514.61,"end":1519.43},{"id":67,"text":"Perfect. All right, we're doing great. Okay, so then in that case you know","zh":"完美。很好，我们进行得非常顺利。好的，那么在这种情况下，你们都知道","start":1520.87,"end":1524.69},{"id":68,"text":"exactly what goes on here. We're gonna solve over j theta and we're gonna try","zh":"这里到底发生了什么。我们将对j theta进行求解，并且我们将尝试","start":1524.69,"end":1527.91},{"id":69,"text":"and pick the thing that minimizes this function. And so intuitively what that","zh":"并选择使这个函数最小化的项。因此，直观上来说，这表示我们要选择一个theta，使得在所有训练点上的平均","start":1527.91,"end":1531.73},{"id":70,"text":"says is we're gonna pick the theta so that on average over all of our training","zh":"平方误差被最小化。好的，因此，我们不再仅仅将误差作为总和来衡量，而是将这个距离平方。","start":1531.73,"end":1535.15},{"id":71,"text":"points, we minimize that squared error. Okay, so we're gonna instead of measuring","zh":"那些非常接近的项，它们会下降。那些非常大的项，我们会","start":1535.15,"end":1540.27},{"id":72,"text":"the error just as a sum, we're gonna square that distance. So things that are","zh":"将它们进行平方处理。","start":1540.27,"end":1543.73},{"id":73,"text":"really close, they're gonna, you know, go down. Things are really big, we're gonna","zh":"真的非常接近，它们会，你知道的，下降。事情真的很大，我们就要","start":1543.73,"end":1546.93},{"id":74,"text":"going to pay for.","zh":"将会付出代价。","start":1546.93,"end":1547.29},{"id":75,"text":"Now, why do we do squared error?","zh":"现在，为什么我们要用平方误差？","start":1548.81,"end":1550.29},{"id":76,"text":"Oh, go ahead.","zh":"哦，你尽管说吧。","start":1550.37,"end":1550.57},{"id":77,"text":"Sorry, I might be, you might be about to say it,","zh":"抱歉，我可能，你可能即将说它，","start":1551.39,"end":1556.33},{"id":78,"text":"but the squaring, presumably you could take another power.","zh":"但平方，想必你可以取另一个幂。","start":1556.43,"end":1561.45},{"id":79,"text":"Yeah, yeah, sure thing.","zh":"是的，是的，当然。","start":1561.57,"end":1562.41},{"id":80,"text":"To even be even stricter on room picking.","zh":"为了更严格地限制房间选择。","start":1562.61,"end":1565.59},{"id":81,"text":"Yeah, exactly right.","zh":"是的，完全正确。","start":1565.85,"end":1566.93},{"id":82,"text":"So the question is, is why did you pick two here?","zh":"那么问题是，你为什么在这里选择了两个？","start":1567.03,"end":1569.27},{"id":83,"text":"And why did you do it?","zh":"你为什么这么做？","start":1569.49,"end":1570.79},{"id":84,"text":"That's a great question.","zh":"这是一个非常好的问题。","start":1571.11,"end":1571.77},{"id":85,"text":"So could you pick other values?","zh":"你能选择其他数值吗？","start":1571.91,"end":1573.29},{"id":86,"text":"Certainly, you could pick another power.","zh":"当然，你可以选择另一个幂次。","start":1573.39,"end":1574.95},{"id":87,"text":"You could pick the absolute value, right?","zh":"你也可以选择绝对值，对吧？","start":1575.05,"end":1576.71}],"notes":["本段讨论监督学习中模型的参数规模和高维空间的可视化问题，强调使用向量符号来处理高维数据。接着，课程转向最小二乘法，解释其基本思想：通过最小化预测误差的平方来选择最佳参数θ。","最小二乘法是一种常规方法，通过将预测误差平方来确保非负性，并选择使总误差最小的θ。课程还提到，虽然可以使用其他幂次（如绝对值），但平方误差是更常见的选择。","课程提到，平方误差的使用并非唯一选择，但其优势在于数学上的便利性，例如可以使用解析解求解。此外，课程还提到，平方误差的使用与对误差的严格性有关。","课程通过提问的方式引导学生思考为什么选择平方误差而不是其他形式，例如绝对值。这表明平方误差的选择有其理论依据，但具体原因需要进一步解释。","课程提到，虽然可以使用其他形式的误差函数，但平方误差在实际应用中更为常见，因为它允许解析解，并且在优化过程中更容易处理。","课程还提到，平方误差的使用与对误差的严格性有关，即通过平方来放大大误差的影响，从而鼓励模型更精确地拟合数据。"],"formulas":[],"uncertainties":["room picking"],"diagram":"none","start":1400.11,"end":1576.71,"asr_flags":[76],"math_clarifications":["原始片段中提到的最小化平方误差的目标未被正确表达为数学公式。公式中缺少了关键的平方误差项，且 'argmin' 和 'loss' 的使用不明确，无法准确反映最小化目标。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":30,"raw_segments":[{"start":1400.11,"text":"They have thousands, hundreds of thousa
