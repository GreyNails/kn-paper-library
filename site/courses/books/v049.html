re just kind of grabbing some information about the function locally and taking a quick step. And the reason that can be so disastrous, you may have been told in your calculus classes, is because you could have a function that looks like this. And then here, you walk down and you get stuck in a local regime. So hopefully this is familiar to you. By show of hands, do people understand the difference convexity, non-convexity? Awesome. Perfect. Okay."},{"start":2240.86,"text":"So that's how it looks. All right, fantastic. We do this for every single component and we update. That's how we solve it. All right. So when we do this, we get this learning rate or step size. You'll hear me say those terms mean the same thing. I wish that they were unified in my head, but I will use them interchangeably. Apologies in advance."}],"speech_gaps":[],"frame":"../frames/v049/013.webp","frame_time":2120.07},{"title":"监督学习中的梯度下降与步长设置","segments":[{"id":165,"text":"Here's me computing the derivative. So those folks who were asking, as you were asking earlier, what's this 2 for? It's so that I can cancel this guy. That's all that's happening. I have my error term here and then a gradient here. Now hopefully this is not calculus that's bothering you. If it bothers you, again, see the Friday lectures. But there's one thing here in the way that I've written it that I want to call out because we're going to use it again and again. This thing here, this error term,","start":2265.15,"end":2289.74},{"id":166,"text":"You basically always have this in a ton of these rules.","start":2290.37,"end":2292.91},{"id":167,"text":"You have the error, what you have, and then you have it multiplied by something.","start":2293.11,"end":2296.99},{"id":168,"text":"Here, it's just going to be the gradient of the function.","start":2297.25,"end":2299.21},{"id":169,"text":"But in general, for a nonlinear, there'd be some extra, extra stuff there.","start":2299.37,"end":2303.33},{"id":170,"text":"And you'll see this form again and again.","start":2304.17,"end":2305.95},{"id":171,"text":"So it's like kind of an artificial way to write it,","start":2306.11,"end":2307.93},{"id":172,"text":"but it's an important artificial way to write it.","start":2307.97,"end":2309.49},{"id":173,"text":"So what's going on here when I compute the derivatives?","start":2310.05,"end":2312.07},{"id":174,"text":"I'm computing the derivatives on all points in my training set.","start":2312.27,"end":2315.23},{"id":175,"text":"Now, if you think about that, if I give you the entire internet","start":2316.17,"end":2319.73},{"id":176,"text":"and asks you to predict the next word in the entire internet,","start":2319.73,"end":2322.27},{"id":177,"text":"that's going to be pretty slow.","start":2322.87,"end":2324.01},{"id":178,"text":"If every time you update your model,","start":2324.15,"end":2326.33},{"id":179,"text":"you have to scan the entire internet,","start":2326.39,"end":2327.73},{"id":180,"text":"that seems really slow.","start":2328.65,"end":2329.71},{"id":181,"text":"And so what machine learning people did","start":2329.99,"end":2331.59},{"id":182,"text":"is they started to try and get algorithms","start":2331.59,"end":2333.31},{"id":183,"text":"which were even simpler than this,","start":2333.31,"end":2335.05},{"id":184,"text":"even dumber than this.","start":2335.15,"end":2336.29},{"id":185,"text":"You're like, gradient descent, how could you get dumber?","start":2336.35,"end":2337.77},{"id":186,"text":"Don't worry, machine learning's got you covered.","start":2337.89,"end":2339.37},{"id":187,"text":"We have a lot more dumb algorithms.","start":2339.49,"end":2340.53},{"id":188,"text":"How does it work?","start":2341.21,"end":2341.97},{"id":189,"text":"Okay?","start":2344.53,"end":2344.93},{"id":190,"text":"We'll get there in one second.","start":2346.89,"end":2347.81},{"id":191,"text":"So we computed the derivatives.","start":2347.87,"end":2349.03},{"id":192,"text":"we have this one thing i don't need to talk about this all right okay get to it now one thing i did","start":2349.03,"end":2356.95},{"id":193,"text":"want to cover before we get there is apologies this thing here about how do you set the step","start":2356.95,"end":2361.49},{"id":194,"text":"size okay now when you set this step size think about what it means the step size is basically","start":2361.49,"end":2370.25},{"id":195,"text":"how sure you are in that information in some way you get the information if you really trusted that","start":2370.25,"end":2375.79},{"id":196,"text":"that gradient that it was leading you really steeply down the hill you would","start":2375.79,"end":2379.61},{"id":197,"text":"want to take a really big step if you're far away from the optimal right and so","start":2379.61,"end":2382.95},{"id":198,"text":"it turns out for functions that are nice in bowl shape which are called convex if","start":2382.95,"end":2386.05},{"id":199,"text":"you're really far away from the optimal it's usually very steep okay that's the","start":2386.05,"end":2389.29},{"id":200,"text":"there's a formal version of that but that's what's going on so you want to","start":2389.29,"end":2392.23},{"id":201,"text":"take a step","start":2392.23,"end":2392.55},{"id":202,"text":"Often in machine learning, we're dealing with really nasty functions. We're dealing with those functions that are really curvy, or we don't know what the surface looks like. And so we tend to take relatively small steps. If you take steps that are too small, what happens is you just don't get to the optimum fast enough.","start":2393.39,"end":2409.54},{"id":203,"text":"If you take steps that are too big, this actually looks pretty good to me. It says too large, but if you just take one step and got to the optimum, you'd be really happy. So that'd be great if you did that. So this is like too large is kind of weird. It's like bragging. Like, oh, it's too large. It works too well. I don't know. In general, what happens in too large, I'll show you in a minute, is that you bounce around. So you take a step, but you shoot past the optimal. So if you picture that bowl that we were talking about before, you would bounce around from both sides. And I'll show you a picture of that. Appreciate the question.","start":2411.06,"end":2435.16}],"notes":["本段主要讲解梯度下降算法中步长（learning rate）的设置及其对优化过程的影响。讲者指出，步长的大小决定了模型更新时的步幅，如果步长太大，模型可能会跳过最优解，导致在损失函数的曲面上来回震荡；如果步长太小，模型收敛速度会变慢。讲者还提到，对于凸函数（bowl-shaped function），在远离最优解时梯度较大，因此可以采取较大的步长，而在接近最优解时则需要较小的步长。","讲者通过一个比喻说明步长的含义，即步长反映了对梯度信息的信任程度。如果对梯度非常信任，认为它能很好地引导模型下降，那么可以采取较大的步长；反之，如果对梯度信息不确定，就需要采取较小的步长。","讲者还提到，在实际机器学习中，我们通常处理的是非凸函数，这些函数的表面可能非常复杂，因此通常采用较小的步长以避免震荡。讲者指出，步长的选择是优化过程中的关键问题，需要根据具体情况进行调整。","讲者通过一个例子说明步长过大的后果，即模型可能会在最优解附近来回震荡，而不是直接收敛到最优解。这种现象在凸函数中尤为明显，因为当模型接近最优解时，梯度会变得非常小，如果步长过大，模型可能会跳过最优解。","讲者还提到，对于非凸函数，由于其表面可能非常复杂，因此通常采用较小的步长以确保模型能够稳定地收敛到局部最优解。讲者指出，步长的选择需要在收敛速度和稳定性之间进行权衡。","最后，讲者提到，他将在接下来的讲解中展示步长过大的具体影响，并通过一个图像来说明模型在损失函数曲面上的震荡现象。这表明，步长的选择对优化过程的稳定性和效率具有重要影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2265.15,"end":2435.16,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2265.15,"text":"Here's me computing the derivative. So those folks who were asking, as you were asking earlier, what's this 2 for? It's so that I can cancel this guy. That's all that's happening. I have my error term here and then a gradient here. Now hopefully this is not calculus that's bothering you. If it bothers you, again, see the Friday lectures. But there's one thing here in the way that I've written it that I want to call out because we're going to use it again and again. This thing here, this error term,"},{"start":2290.37,"text":"You basically always have this in a ton of these rules."},{"start":2293.11,"text":"You have the error, what you have, and then you have it multiplied by something."},{"start":2297.25,"text":"Here, it's just going to be the gradient of the function."},{"start":2299.37,"text":"But in general, for a nonlinear, there'd be some extra, extra stuff there."},{"start":2304.17,"text":"And you'll see this form again and again."},{"start":2306.11,"text":"So it's like kind of an artificial way to write it,"},{"start":2307.97,"text":"but it's an important artificial way to write it."},{"start":2310.05,"text":"So what's going on here when I compute the derivatives?"},{"start":2312.27,"text":"I'm computing the derivatives on all points in my training set."},{"start":2316.17,"text":"Now, if you think about that, if I give you the entire internet"},{"start":2319.73,"text":"and asks you to predict the next word in the entire internet,"},{"start":2322.87,"text":"that's going to be pretty slow."},{"start":2324.15,"text":"If every time you update your model,"},{"start":2326.39,"text":"you have to scan the entire internet,"},{"start":2328.65,"text":"that seems really slow."},{"start":2329.99,"text":"And so what machine learning people did"},{"start":2331.59,"text":"is they started to try and get algorithms"},{"start":2333.31,"text":"which were even simpler than this,"},{"start":2335.15,"text":"even dumber than this."},{"start":2336.35,"text":"You're like, gradient descent, how could you get dumber?"},{"start":2337.89,"text":"Don't worry, machine learning's got you covered."},{"start":2339.49,"text":"We have a lot more dumb algorithms."},{"start":2341.21,"text":"How does it work?"},{"start":2344.53,"text":"Okay?"},{"start":2346.89,"text":"We'll get there in one second."},{"start":2347.87,"text":"So we computed the derivatives."},{"start":2349.03,"text":"we have this one thing i don't need to talk about this all right okay get to it now one thing i did"},{"start":2356.95,"text":"want to cover before we get there is apologies this thing here about how do you set the step"},{"start":2361.49,"text":"size okay now when you set this step size think about what it means the step size is basically"},{"start":2370.25,"text":"how sure you are in that information in some way you get the information if you really trusted that"},{"start":2375.79,"text":"that gradient that it was leading you really steeply down the hill you would"},{"start":2379.61,"text":"want to take a really big step if you're far away from the optimal right and so"},{"start":2382.95,"text":"it turns out for functions that are nice in bowl shape which are called convex if"},{"start":2386.05,"text":"you're really far away from the optimal it's usually very steep okay that's the"},{"start":2389.29,"text":"there's a formal version of that but that's what's going on so you want to"},{"start":2392.23,"text":"take a step"},{"start":2393.39,"text":"Often in machine learning, we're dealing with really nasty functions. We're dealing with those functions that are really curvy, or we don't know what the surface looks like. And so we tend to take relatively small steps. If you take steps that are too small, what happens is you just don't get to the optimum fast enough."},{"start":2411.06,"text":"If you take steps that are too big, this actually looks pretty good to me. It says too large, but if you just take one step and got to the optimum, you'd be really happy. So that'd be great if you did that. So this is like too large is kind of weird. It's like bragging. Like, oh, it's too large. It works too well. I don't know. In general, what happens in too large, I'll show you in a minute, is that you bounce around. So you take a step, but you shoot past the optimal. So if you picture that bowl that we were talking about before, you would bounce around from both sides. And I'll show you a picture of that. Appreciate the question."}],"speech_gaps":[],"frame":"../frames/v049/014.webp","frame_time":2277.15},{"title":"监督学习设定与优化方法","segments":[{"id":204,"text":"It's not what happens. Yeah, exactly right. And so when you see, I have those for the SGD. So you're exactly right. This is what happens. When we stock for things like SGD, what happens is you bounce around in a ball, a high dimensional ball. That's kind of proportional to that step size. And this has some profound implications. Because if you've taken a statistics course, you've been told that what you really care about is recovering the parameters. You want to be technical about it. You really care about getting the right theta zeros. This is called a recovery guarantee. If I see the data,","start":2436.08,"end":2465.48},{"id":205,"text":"then I can prove that I get the right theta zeros. Machine learning people do not care about this. Absolutely not. And they're right not to, if you want to do what we were doing, right? Not if you're doing stats. And what that means is there could be many, many thetas. As long as we're close, good enough. And so a lot of modern machine learning is like running these models and like, when do you stop? Like in statistics, we would do these very fancy tests. When the gradient goes below this and all the rest we can prove, we're within blah, blah, blah, blah, blah of theta naught, the theta star, the optimal theta star.","start":2465.67,"end":2493.53},{"id":206,"text":"In AI, we're like, we ran out of compute credits. We'll stop. Feels good. Let's go to the next model. And that's crazy enough how it works. All right.","start":2494.6,"end":2503.62},{"id":207,"text":"OK, so when you set these at home, you're going to have some assignments where you play with some step sizes. You'll see if it's converging slowly, try and set better step sizes. In a couple of weeks, I'll teach you something called Hyperband, which was one of my personal favorite algorithms. It was written by friends of how to adaptively set these step sizes in a nice way. And it uses something called Bandits, which we need a lot of notation. And once you've gotten familiar with the notation, it's really straightforward. It's Kevin's algorithm. Cool. All right.","start":2504.28,"end":2529.64},{"id":208,"text":"All right. So this just says what I said and doesn't have all the weird rants in it. All right. Good enough. Okay. Now, as I mentioned, we want to get even simpler because that N, this data set, could be very large. And in fact, machine learning is anchored towards more data, not better estimation.","start":2530.25,"end":2547.53},{"id":209,"text":"just that's not a formal statement but just intuitively what we're after is we're after these models that we're going to crank tons and tons and tons of data through them we think that's a way to improve them by making them bigger and consume more information than necessarily estimating these parameters very finely and so we'll tell you the techniques that we used to use to estimate those parameters down to like you know 10 significant digits but that's not the vibe that's not what we're going for we want to get bigger models that we're going to kind of fit","start":2548.17,"end":2574.83},{"id":210,"text":"less well than our predecessors. And that's what leads to all kinds of interesting behaviors that we'll tell you about later, like scaling laws and things. So why does that matter? This is really an algorithm that I owe a lot to and that is actually widely used. And it's an old algorithm too. So this is the algorithm update rule written for one different component. We've looked at xj here. It only depends on the jth component. We look at the whole error term, look at all the data, and we update.","start":2575.32,"end":2603.25}],"notes":["本段讨论了监督学习中优化算法的差异，特别是在统计学和机器学习领域。在统计学中，人们关注的是参数估计的准确性，即恢复正确的参数值，这被称为恢复保证。而在机器学习中，人们更关注模型的性能，即使参数估计不完全准确，只要模型表现良好即可。","在统计学中，人们会使用复杂的测试来判断是否接近最优参数，而在机器学习中，人们更倾向于使用计算资源来训练模型，直到资源耗尽为止。这种做法虽然简单，但更符合实际应用需求。","本段还提到，随着数据集的增大，机器学习更倾向于使用更多的数据而不是更精确的参数估计。这反映了机器学习的一个核心理念，即通过增加数据量来提升模型性能，而不是追求参数的精确估计。","在优化过程中，梯度下降算法会根据梯度的大小来调整参数，而机器学习中通常会使用更简单的停止条件，如计算资源耗尽，而不是严格的数学证明。","本段还提到，机器学习中使用了如Hyperband这样的算法，用于自适应地调整学习率，这需要大量的符号表示，但一旦熟悉了这些符号，算法就变得非常直观。","最后，本段强调了机器学习与统计学在目标上的不同，机器学习更关注模型的规模和数据量，而不是参数的精确估计。这种差异导致了机器学习中出现了一些有趣的行为，如扩展定律等。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2436.08,"end":2603.25,"asr_flags":[205],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2436.08,"text":"It's not what happens. Yeah, exactly right. And so when you see, I have those for the SGD. So you're exactly right. This is what happens. When we stock for things like SGD, what happens is you bounce around in a ball, a high dimensional ball. That's kind of proportional to that step size. And this has some profound implications. Because if you've taken a statistics course, you've been told that what you really care about is recovering the parameters. You want to be technical about it. You really care about getting the right theta zeros. This is called a recovery guarantee. If I see the data,"},{"start":2465.67,"text":"then I can prove that I get the right theta zeros. Machine learning people do not care about this. Absolutely not. And they're right not to, if you want to do what we were doing, right? Not if you're doing stats. And what that means is there could be many, many thetas. As long as we're close, good enough. And so a lot of modern machine learning is like running these models and like, when do you stop? Like in statistics, we would do these very fancy tests. When the gradient goes below this and all the rest we can prove, we're within blah, blah, blah, blah, blah of theta naught, the theta star, the optimal theta star."},{"start":2494.6,"text":"In AI, we're like, we ran out of compute credits. We'll stop. Feels good. Let's go to the next model. And that's crazy enough how it works. All right."},{"start":2504.28,"text":"OK, so when you set these at home, you're going to have some assignments where you play with some step sizes. You'll see if it's converging slowly, try and set better step sizes. In a couple of weeks, I'll teach you something called Hyperband, which was one of my personal favorite algorithms. It was written by friends of how to adaptively set these step sizes in a nice way. And it uses something called Bandits, which we need a lot of notation. And once you've gotten familiar with the notation, it's really straightforward. It's Kevin's algorithm. Cool. All right."},{"start":2530.25,"text":"All right. So this just says what I said and doesn't have all the weird rants in it. All right. Good enough. Okay. Now, as I mentioned, we want to get even simpler because that N, this data set, could be very large. And in fact, machine learning is anchored towards more data, not better estimation."},{"start":2548.17,"text":"just that's not a formal statement but just intuitively what we're after is we're after these models that we're going to crank tons and tons and tons of data through them we think that's a way to improve them by making them bigger and consume more information than necessarily estimating these parameters very finely and so we'll tell you the techniques that we used to use to estimate those parameters down to like you know 10 significant digits but that's not the vibe that's not what we're going for we want to get bigger models that we're going to kind of fit"},{"start":2575.32,"text":"less well than our predecessors. And that's what leads to all kinds of interesting behaviors that we'll tell you about later, like scaling laws and things. So why does that matter? This is really an algorithm that I owe a lot to and that is actually widely used. And it's an old algorithm too. So this is the algorithm update rule written for one different component. We've looked at xj here. It only depends on the jth component. We look at the whole error term, look at all the data, and we update."}],"speech_gaps":[],"frame":"../frames/v049/015.webp","frame_time":2448.08},{"title":"监督学习设定中的随机梯度下降","segments":[{"id":211,"text":"Now, here I'm just showing that the vector, we're writing in vector notation. This is, again, just why does the vector save us? Well, I just erased all the j's. You will see me very freely go back and forth between these. All right. Okay. This is what I actually wanted to talk about. Okay. Now, consider our rule. So I've said this multiple times already. Sorry, I got excited. This is a thing that I like. So I know it's weird to get excited about this, but I cannot tell you. So just as a small digression.","start":2607.17,"end":2630.61},{"id":212,"text":"I worked a lot of my life on the algorithm I'm about to show you. It's extremely simple. We did all kinds of fun things about this algorithm and how we scaled it up and how we built it. It's called stochastic mini-batch or stochastic gradient descent. Or in the old days, it was called incremental gradient. And it goes back at least to the 1950s, Robbins and Monroe. It's like an old classical algorithm. People rediscover it every 10, 15 years. It is the workhorse. So by show of hands, how many people have used PyTorch or anything?","start":2631.39,"end":2658.41},{"id":213,"text":"OK, more people use PyTorch. That's dangerous, but awesome. So if you do backprop in there, then you have to have used minibatch. The entire system is set up for you so that you're going to take a small batch of data. You're not going to look at everything in your data set. You're going to feed through five images of cats and dogs at the same time, not all the images of cats and dogs that are on your phone or whatever. So that is the minibatching rule. So how does that look mathematically?","start":2659.11,"end":2684.31},{"id":214,"text":"The idea is we're going to sample this thing. Mathematically, the way we'll think about it is we're going to take a random set. Now, honestly, when you run, this is a thing that I, again, spend a lot of my life in weird ways. One slice of my life. It wasn't like I was doing it all day long, but it was like a piece of things I was working on. I worked on understanding what happens if you randomly sample versus if you just randomly sort your data and go through it once.","start":2689.67,"end":2715.66},{"id":215,"text":"Turns out they're kind of okay. And that latter one is basically what we do. Took a lot of math to prove that those things are about the same for a variety of reasons. When you get to the end of the data set, it gets nasty. The first part of the data set, they're obviously kind of close. But this is what SGD is. Sample from your data set. Don't pick those samples in a weird way. Now, what could go wrong if you pick those samples in a weird way? Just intuitively. If, for example, let's say that I showed you all the cats first, then I showed you all the dogs.","start":2718.04,"end":2746.9},{"id":216,"text":"And you put them in those little batches.","start":2748.65,"end":2750.31},{"id":217,"text":"What do you think would happen to the underlying model?","start":2750.35,"end":2752.11},{"id":218,"text":"It would first just keep predicting cats,","start":2753.17,"end":2754.91},{"id":219,"text":"and then it would stop predicting cats for everything.","start":2755.09,"end":2756.81},{"id":220,"text":"Exactly right.","start":2757.13,"end":2757.59},{"id":221,"text":"So it would learn some trivial surface that was like only predicting the cats.","start":2757.65,"end":2760.49},{"id":222,"text":"You got it exactly right.","start":2760.55,"end":2761.35},{"id":223,"text":"And it would get really confident about cats,","start":2761.53,"end":2763.61},{"id":224,"text":"but it wouldn't know anything about dogs.","start":2763.61,"end":2764.69},{"id":225,"text":"Then it would see the dogs, and it would race to the other side.","start":2764.81,"end":2767.05},{"id":226,"text":"So why do I tell you this?","start":2767.77,"end":2769.01},{"id":227,"text":"Intuitively, what do you want in that batch?","start":2769.33,"end":2770.89},{"id":228,"text":"You want it to be kind of a sample of the population.","start":2770.99,"end":2772.99},{"id":229,"text":"This is the second statistical assumption we're making.","start":2773.37,"end":2775.43},{"id":230,"text":"the first one was my training set reflects the real world my second one is","start":2775.43,"end":2779.87},{"id":231,"text":"my mini batches again reflect my overall data set that one as I start to get more","start":2779.87,"end":2785.95}],"notes":["本段继续讨论监督学习中的随机梯度下降（SGD）算法，强调了在训练过程中使用小批量数据的重要性。讲者指出，SGD是一种经典算法，最早可追溯至1950年代，由Robbins和Monroe提出。该算法在现代深度学习框架如PyTorch中被广泛应用，因为其能够高效地处理大规模数据集。","讲者通过一个直观的例子说明了如果在训练过程中不随机采样数据，而是按类别顺序输入数据，会导致模型学习到一个过于简单的表面特征，例如只预测猫而不学习狗的特征。这说明了随机采样的重要性，以确保每个小批量数据能够代表整个数据集的分布。","讲者提到，随机采样与随机排序数据在某些情况下效果相近，但当数据集遍历结束时，随机排序可能会导致模型性能下降。因此，随机采样是SGD算法中一个关键的统计假设，即每个小批量数据应是整个数据集的一个代表性样本。","讲者指出，SGD的第二个统计假设是小批量数据应反映整个数据集的分布，这与第一个假设（训练集反映真实世界）相辅相成。这一假设确保了模型在训练过程中能够学习到数据的全局特征，而不是局部特征。","讲者通过提问引导学生思考在小批量数据中应包含哪些内容，以确保模型能够正确学习。这表明，随机采样是SGD算法成功的关键因素之一，能够避免模型过早收敛到局部最优解。","讲者强调了SGD算法的广泛应用和其在现代机器学习中的重要性，同时指出其背后的数学原理和统计假设。这表明，SGD不仅是一个简单的优化算法，还涉及复杂的统计和计算理论。"],"formulas":[],"uncertainties":["the first one was my training set reflects the real world my second one is","my mini batches again reflect my overall data set that one as I start to get more"],"diagram":"none","start":2607.17,"end":2785.95,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2607.17,"text":"Now, here I'm just showing that the vector, we're writing in vector notation. This is, again, just why does the vector save us? Well, I just erased all the j's. You will see me very freely go back and forth between these. All right. Okay. This is what I actually wanted to talk about. Okay. Now, consider our rule. So I've said this multiple times already. Sorry, I got excited. This is a thing that I like. So I know it's weird to get excited about this, but I cannot tell you. So just as a small digression."},{"start":2631.39,"text":"I worked a lot of my life on the algorithm I'm about to show you. It's extremely simple. We did all kinds of fun things about this algorithm and how we scaled it up and how we built it. It's called stochastic mini-batch or stochastic gradient descent. Or in the old days, it was called incremental gradient. And it goes back at least to the 1950s, Robbins and Monroe. It's like an old classical algorithm. People rediscover it every 10, 15 years. It is the workhorse. So by show of hands, how many people have used PyTorch or anything?"},{"start":2659.11,"text":"OK, more people use PyTorch. That's dangerous, but awesome. So if you do backprop in there, then you have to have used minibatch. The entire system is set up for you so that you're going to take a small batch of data. You're not going to look at everything in your data set. You're going to feed through five images of cats and dogs at the same time, not all the images of cats and dogs that are on your phone or whatever. So that is the minibatching rule. So how does that look mathematically?"},{"start":2689.67,"text":"The idea is we're going to sample this thing. Mathematically, the way we'll think about it is we're going to take a random set. Now, honestly, when you run, this is a thing that I, again, spend a lot of my life in weird ways. One slice of my life. It wasn't like I was doing it all day long, but it was like a piece of things I was working on. I worked on understanding what happens if you randomly sample versus if you just randomly sort your data and go through it once."},{"start":2718.04,"text":"Turns out they're kind of okay. And that latter one is basically what we do. Took a lot of math to prove that those things are about the same for a variety of reasons. When you get to the end of the data set, it gets nasty. The first part of the data set, they're obviously kind of close. But this is what SGD is. Sample from your data set. Don't pick those samples in a weird way. Now, what could go wrong if you pick those samples in a weird way? Just intuitively. If, for example, let's say that I showed you all the cats first, then I showed you all the dogs."},{"start":2748.65,"text":"And you put them in those little batches."},{"start":2750.35,"text":"What do you think would happen to the underlying model?"},{"start":2753.17,"text":"It would first just keep predicting cats,"},{"start":2755.09,"text":"and then it would stop predicting cats for everything."},{"start":2757.13,"text":"Exactly right."},{"start":2757.65,"text":"So it would learn some trivial surface that was like only predicting the cats."},{"start":2760.55,"text":"You got it exactly right."},{"start":2761.53,"text":"And it would get really confident about cats,"},{"start":2763.61,"text":"but it wouldn't know anything about dogs."},{"start":2764.81,"text":"Then it would see the dogs, and it would race to the other side."},{"start":2767.77,"text":"So why do I tell you this?"},{"start":2769.33,"text":"Intuitively, what do you want in that batch?"},{"start":2770.99,"text":"You want it to be kind of a sample of the population."},{"start":2773.37,"text":"This is the second statistical assumption we're making."},{"start":2775.43,"text":"the first one was my training set reflects the real world my second one is"},{"start":2779.87,"text":"my mini batches again reflect my overall data set that one as I start to get more"}],"speech_gaps":[],"frame":"../frames/v049/016.webp","frame_time":2619.17},{"title":"监督学习设定中的注意事项","segments":[{"id":232,"text":"complicated things it becomes tricky to guarantee please","start":2785.95,"end":2788.91},{"id":233,"text":"exactly right yeah wonderful yeah so here this this H of theta should","start":2796.97,"end":2800.85},{"id":234,"text":"actually be the theta T sorry if that's not clear I'll just write it in here so","start":2800.85,"end":2804.51},{"id":235,"text":"wonderful observation. So the observation is which theta is talking about here and it's the","start":2804.51,"end":2808.85},{"id":236,"text":"theta from the last step. That's just a notational bug. You got it exactly right.","start":2808.85,"end":2811.83},{"id":237,"text":"Other questions? Oh please, did you have a question?","start":2814.35,"end":2817.13},{"id":238,"text":"Yeah, so the question is if you sample with versus without replacement, how does that change","start":2827.25,"end":2831.87},{"id":239,"text":"change the situation. And it turns out that basically the moral of the story is we have","start":2831.87,"end":2837.63},{"id":240,"text":"increasing theory and empirical evidence that it doesn't matter if you do the with replacement","start":2837.63,"end":2841.45},{"id":241,"text":"versus without replacement. But without replacement is, in fact, a lot easier to implement. Because","start":2841.45,"end":2846.19},{"id":242,"text":"what you can do is you can hash or you can sort on a random key and do it once and then plow through","start":2846.19,"end":2851.15},{"id":243,"text":"all of your data. In fact, by default, PyTorch will often not sample from the data and just take","start":2851.15,"end":2855.73},{"id":244,"text":"the batches in the order that","start":2855.73,"end":2856.83},{"id":245,"text":"you get it. So that once the data set is very, very large, the change in this distribution should not be very big. If I have a billion points and I shuffle them versus picking them up. Now, one other thing that people have observed, you don't have to know any of this. So please don't worry about it. But one other thing that people have observed, and this came from a paper that we wrote 10 years ago about this. It turns out, and lots of people observe this, not just us. If you do the random reshuffle, the model converges faster.","start":2856.98,"end":2885.12},{"id":246,"text":"And this is something that if you think about it intuitively, by show of hands, who knows what the coupon collector problem is? Oh, phew. All right. PyTorch, but not coupon collector. Interesting times. Anyway, that used to be like CS Canon. You had to know that. But I'll just say this has nothing to do with what I'm talking about. How many people know what a DFA is, an automata?","start":2886.07,"end":2903.67},{"id":247,"text":"Oh, that's good. Good for us. All right. We're still doing it. All right. Anyway, back to this. So the point is, is when you did that shuffle, you had a kind of a coupon collector phenomenon. What happens in a coupon collector is let's say that I give you 10 coupons that you want to collect and you run around and you're randomly sampling. So you get a random sample every time. It turns out that all of your variants, how long it takes you is how long it takes to get the last coupon.","start":2904.81,"end":2925.41},{"id":248,"text":"Why? Because if I'm sampling from all 10, I'm getting the first nine again and again, 90% odds when I get to the end. And so I only have a 10% odds of getting it when I get to that final one. Turns out that skews all the variance to the end. So back to these models.","start":2925.94,"end":2939.02},{"id":249,"text":"If you're looking for something that's relatively rare in your data set, you're just not going to encounter it. You're going to encounter the mean a little bit too often, and you're not going to encounter the thing you want. So the folklore is that, and there's a bunch of math that says, under situations, the story I just told you is true. But not all situations. There are obvious counterexamples. Awesome. These are wonderful questions. Super happy to talk about this stuff. Please.","start":2939.77,"end":2960.38}],"notes":["本段讨论了监督学习中的一些注意事项，包括如何处理复杂问题、符号表示的澄清以及采样方法（有放回与无放回）对模型训练的影响。讲者指出，虽然有放回和无放回采样在理论上可能没有显著差异，但无放回采样在实现上更简单，且PyTorch默认采用无放回采样。此外，讲者还提到随机重排数据可以加快模型收敛速度，但这一现象与‘优惠券收集问题’有关，即在数据集中某些元素出现频率较低时，可能会影响模型的训练效果。","讲者通过‘优惠券收集问题’来类比模型训练中的采样过程，指出在数据集中某些元素出现频率较低时，模型可能难以遇到这些元素，从而影响训练效果。这一现象在某些情况下成立，但并非所有情况都适用，存在明显的反例。","讲者强调，虽然采样方法对模型训练有一定影响，但实际应用中无需过度担忧，因为PyTorch等工具默认采用无放回采样，且随机重排数据可以加快模型收敛速度。此外，讲者还提到‘优惠券收集问题’在计算机科学中曾是经典问题，但如今已不再作为必修内容。","讲者通过提问的方式引导学生思考‘优惠券收集问题’和‘确定性有限自动机（DFA）’等概念，但指出这些内容与当前讨论的主题无关。这表明讲者在课堂上会适时引入相关知识，但不会偏离当前主题。","讲者在讨论中提到，当数据集中某些元素出现频率较低时，模型可能难以遇到这些元素，从而影响训练效果。这一现象在某些情况下成立，但并非所有情况都适用，存在明显的反例。因此，讲者强调需要根据具体情况判断采样方法的影响。","讲者在课堂上鼓励学生提问，并对学生的提问表示欢迎。这表明讲者重视学生的参与和互动，同时也展示了对教学内容的深入理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2785.95,"end":2960.38,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2785.95,"text":"complicated things it becomes tricky to guarantee please"},{"start":2796.97,"text":"exactly right yeah wonderful yeah so here this this H of theta should"},{"start":2800.85,"text":"actually be the theta T sorry if that's not clear I'll just write it in here so"},{"start":2804.51,"text":"wonderful observation. So the observation is which theta is talking about here and it's the"},{"start":2808.85,"text":"theta from the last step. That's just a notational bug. You got it exactly right."},{"start":2814.35,"text":"Other questions? Oh please, did you have a question?"},{"start":2827.25,"text":"Yeah, so the question is if you sample with versus without replacement, how does that change"},{"start":2831.87,"text":"change the situation. And it turns out that basically the moral of the story is we have"},{"start":2837.63,"text":"increasing theory and empirical evidence that it doesn't matter if you do the with replacement"},{"start":2841.45,"text":"versus without replacement. But without replacement is, in fact, a lot easier to implement. Because"},{"start":2846.19,"text":"what you can do is you can hash or you can sort on a random key and do it once and then plow through"},{"start":2851.15,"text":"all of your data. In fact, by default, PyTorch will often not sample from the data and just take"},{"start":2855.73,"text":"the batches in the order that"},{"start":2856.98,"text":"you get it. So that once the data set is very, very large, the change in this distribution should not be very big. If I have a billion points and I shuffle them versus picking them up. Now, one other thing that people have observed, you don't have to know any of this. So please don't worry about it. But one other thing that people have observed, and this came from a paper that we wrote 10 years ago about this. It turns out, and lots of people observe this, not just us. If you do the random reshuffle, the model converges faster."},{"start":2886.07,"text":"And this is something that if you think about it intuitively, by show of hands, who knows what the coupon collector problem is? Oh, phew. All right. PyTorch, but not coupon collector. Interesting times. Anyway, that used to be like CS Canon. You had to know that. But I'll just say this has nothing to do with what I'm talking about. How many people know what a DFA is, an automata?"},{"start":2904.81,"text":"Oh, that's good. Good for us. All right. We're still doing it. All right. Anyway, back to this. So the point is, is when you did that shuffle, you had a kind of a coupon collector phenomenon. What happens in a coupon collector is let's say that I give you 10 coupons that you want to collect and you run around and you're randomly sampling. So you get a random sample every time. It turns out that all of your variants, how long it takes you is how long it takes to get the last coupon."},{"start":2925.94,"text":"Why? Because if I'm sampling from all 10, I'm getting the first nine again and again, 90% odds when I get to the end. And so I only have a 10% odds of getting it when I get to that final one. Turns out that skews all the variance to the end. So back to these models."},{"start":2939.77,"text":"If you're looking for something that's relatively rare in your data set, you're just not going to encounter it. You're going to encounter the mean a little bit too often, and you're not going to encounter the thing you want. So the folklore is that, and there's a bunch of math that says, under situations, the story I just told you is true. But not all situations. There are obvious counterexamples. Awesome. These are wonderful questions. Super happy to talk about this stuff. Please."}],"speech_gaps":[{"start":2790.224,"end":2796.57}],"frame":"../frames/v049/017.webp","frame_time":2797.95},{"title":"监督学习中的批量大小选择","segments":[{"id":250,"text":"Batch size. Sometimes we just say this is how much GPU I have, this is what my batch size will be. Is there some scientific way to say I should have a batch size of 1 or 10 or 12? Oh, wonderful question. So the question is about batch size and how do you pick it.","start":2962.15,"end":2976.51},{"id":251,"text":"So I'm going to tell you something. So a couple of things. So there's a couple of heuristics that people have, but I want to tell you as a personal matter, batch size was actually one of the things that broke me intellectually in a while ago. So there was a while when, I would say about 15 years ago, when what we thought was that smaller batch sizes were better because they were exploring the data more. You can tell yourself a story about why this is better. And from an optimization perspective, you can prove that in many situations, a tiny batch size is just as good as a big batch size. And so you want...","start":2976.95,"end":3006.37},{"id":252,"text":"to run in these tiny batch sizes then there was a paper that came out of when it was facebook the facebook labs that basically showed this really interesting thing that was done by friends and they sent me as a pre-print that said we're getting better generalization i'll explain what i mean in a second by using larger batches now this","start":3006.38,"end":3022.2},{"id":253,"text":"was very strange. Their loss was worse, their training set was worse, but they were generalizing better to the real world. Now, as a mathematical or an optimization person, at first, I was like, this is heresy. As I just told you, we assume that the training sets have this statistical relationship, so doing better on the training set should always mean doing better on the test set. But in this paper, they showed that wasn't the case all the time. And that's one of the things, the reason I tell you this story is, first, it was like, personally, as I was working on this, it changed the mathematics of it.","start":3022.71,"end":3050.71},{"id":254,"text":"The second piece of it, as we went through it, was basically the batch size we don't fully understand. And so the convention now, we have this idea that larger batches are better because they have lower variance. They're a better estimate. And so the practice that you just mentioned, how do you pitch the batch size? How big is your GPU memory, right? You have this much HBM, you have this much batch size. That's basically what people do for systems reasons.","start":3051.19,"end":3076.22},{"id":255,"text":"But the theory of how and why this works and the fact that optimization is a leaky abstraction is really interesting. And it should have been more interesting. I didn't recognize this when I first saw it. But it was a really important theoretical moment for me because what it revealed to me is... Remember when I was telling you, machine learning is not stats. I think we're still co-listed with stats. No offense to statisticians. I love you very much. Some of my best friends are statisticians. But...","start":3077.1,"end":3099.0},{"id":256,"text":"Machine learning is not stats. And one of the things is, is statistics, as I mentioned, is very interested in when the optimization problem recovers the right answer. And as I told you, machine learning people are not interested in that. And so the fact that you have a model that doesn't get the right answer with this batch size change.","start":3099.74,"end":3113.7},{"id":257,"text":"right answer, the lower loss, the minimum loss, but generalize is better. We're going to throw away all the theory and try and figure out what's happening there. And so now your heuristic is the right one. Set the batch size according to what you can do. And there's a little bit of tuning that people do underneath the covers about how they set their batches. It's a little bit folklore, if I'm honest. I can tell you the tricks. I have mine. Other people have theirs. I'm not super sure. Great question. Please.","start":3114.26,"end":3138.64}],"notes":["本段讨论了监督学习中批量大小（batch size）的选择问题。讲者提到，批量大小的选择没有明确的科学方法，通常取决于硬件资源，如GPU内存。然而，讲者指出，过去人们认为较小的批量大小更好，因为它能更充分地探索数据，但后来有研究发现，较大的批量大小反而能带来更好的泛化能力，尽管训练损失可能更高。这挑战了传统上认为训练损失与测试损失正相关的假设。","讲者提到，这一发现改变了他对机器学习和统计学之间关系的理解。他指出，统计学关注的是优化问题能否恢复正确的答案，而机器学习更关注模型的泛化能力，即使损失函数没有达到最小值。这表明，机器学习和统计学在目标和方法上存在差异。","讲者强调，批量大小的选择更多是基于系统原因（如硬件限制），而不是严格的理论依据。虽然有一些经验法则，但这些方法更多是基于实践的调整，而非严格的数学证明。","讲者提到，优化过程是一个不完美的抽象（leaky abstraction），这意味着优化方法的理论和实际效果之间可能存在差异。这一观点对理解机器学习的理论基础和实践应用具有重要意义。","讲者还提到，他与统计学家有良好的关系，但认为机器学习和统计学在目标上有所不同。统计学更关注模型能否找到正确的解，而机器学习更关注模型在实际应用中的泛化能力。","最后，讲者总结说，批量大小的选择应基于实际可行性和系统限制，而不是严格的理论依据。尽管存在一些经验法则，但这些方法更多是基于实践的调整，而非严格的数学证明。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2962.15,"end":3138.64,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2962.15,"text":"Batch size. Sometimes we just say this is how much GPU I have, this is what my batch size will be. Is there some scientific way to say I should have a batch size of 1 or 10 or 12? Oh, wonderful question. So the question is about batch size and how do you pick it."},{"start":2976.95,"text":"So I'm going to tell you something. So a couple of things. So there's a couple of heuristics that people have, but I want to tell you as a personal matter, batch size was actually one of the things that broke me intellectually in a while ago. So there was a while when, I would say about 15 years ago, when what we thought was that smaller batch sizes were better because they were exploring the data more. You can tell yourself a story about why this is better. And from an optimization perspective, you can prove that in many situations, a tiny batch size is just as good as a big batch size. And so you want..."},{"start":3006.38,"text":"to run in these tiny batch sizes then there was a paper that came out of when it was facebook the facebook labs that basically showed this really interesting thing that was done by friends and they sent me as a pre-print that said we're getting better generalization i'll explain what i mean in a second by using larger batches now this"},{"start":3022.71,"text":"was very strange. Their loss was worse, their training set was worse, but they were generalizing better to the real world. Now, as a mathematical or an optimization person, at first, I was like, this is heresy. As I just told you, we assume that the training sets have this statistical relationship, so doing better on the training set should always mean doing better on the test set. But in this paper, they showed that wasn't the case all the time. And that's one of the things, the reason I tell you this story is, first, it was like, personally, as I was working on this, it changed the mathematics of it."},{"start":3051.19,"text":"The second piece of it, as we went through it, was basically the batch size we don't fully understand. And so the convention now, we have this idea that larger batches are better because they have lower variance. They're a better estimate. And so the practice that you just mentioned, how do you pitch the batch size? How big is your GPU memory, right? You have this much HBM, you have this much batch size. That's basically what people do for systems reasons."},{"start":3077.1,"text":"But the theory of how and why this works and the fact that optimization is a leaky abstraction is really interesting. And it should have been more interesting. I didn't recognize this when I first saw it. But it was a really important theoretical moment for me because what it revealed to me is... Remember when I was telling you, machine learning is not stats. I think we're still co-listed with stats. No offense to statisticians. I love you very much. Some of my best friends are statisticians. But..."},{"start":3099.74,"text":"Machine learning is not stats. And one of the things is, is statistics, as I mentioned, is very interested in when the optimization problem recovers the right answer. And as I told you, machine learning people are not interested in that. And so the fact that you have a model that doesn't get the right answer with this batch size change."},{"start":3114.26,"text":"right answer, the lower loss, the minimum loss, but generalize is better. We're going to throw away all the theory and try and figure out what's happening there. And so now your heuristic is the right one. Set the batch size according to what you can do. And there's a little bit of tuning that people do underneath the covers about how they set their batches. It's a little bit folklore, if I'm honest. I can tell you the tricks. I have mine. Other people have theirs. I'm not super sure. Great question. Please."}],"speech_gaps":[],"frame":"../frames/v049/018.webp","frame_time":2974.15},{"title":"监督学习中的批量大小与数据采样","segments":[{"id":258,"text":"I'd say it's potentially be better because... Oh, great question. Because when we examine people like cats and dogs, wouldn't you end up with, if you have smaller batches, wouldn't you have much more extreme, non-comportable... Yeah, yeah, wonderful question.","start":3140.3,"end":3154.72},{"id":259,"text":"yeah so the question is why would why did you fools ever think that low small batch sizes were going to work uh it was obvious the whole time you were wrong probably but the reason you would think a small batch size would help is a bit a little bit of a calculation which is actually in the slides in the appendix which shows that imagine a situation where i have a data set that contains a lot of redundancy okay if it contains a lot of redundancy and i look at a whole batch","start":3155.27,"end":3177.91},{"id":260,"text":"then I'm basically seeing the same example. You know, it's just like 90 pictures of the same cat again and again and again, right? And so I've wasted all those steps. I could have been using those 90 cats to refine the model 90 times. So really what it's a trade-off is how statistically meaningful is the data sample that you're seeing versus how big of a step should you take? So it's not an obvious trade-off either direction. The heuristic of why smaller was better was that you were able to polish the model, that more parameter updates were better than what you were doing.","start":3178.47,"end":3207.15},{"id":261,"text":"probably true if you have small classes or a relatively compact domain where you have two classes and they're well-established and separated. In those situations, this redundancy argument is actually provable. SGD with small batches will do better. And so that gave us false confidence that that was explaining the whole world.","start":3207.82,"end":3226.26},{"id":262,"text":"When we move to more interesting examples,","start":3226.84,"end":3228.3},{"id":263,"text":"larger batch sizes started to work better and better and better.","start":3228.58,"end":3231.32},{"id":264,"text":"The other thing that happened is the way we treat the batches,","start":3231.68,"end":3234.56},{"id":265,"text":"as you'll see in the second half of the course,","start":3234.56,"end":3236.08},{"id":266,"text":"we also want to embed information in them.","start":3236.24,"end":3238.28},{"id":267,"text":"When we get to other concerns about how you supervise your data,","start":3238.48,"end":3241.74},{"id":268,"text":"it's interesting to have a mix of, say, positive and negatives.","start":3241.92,"end":3244.76},{"id":269,"text":"Exactly as you said,","start":3244.88,"end":3245.84},{"id":270,"text":"I want every batch to have a couple of cats and a couple of dogs,","start":3246.0,"end":3248.56},{"id":271,"text":"and ideally, I'd like them to be close together intuitively.","start":3248.68,"end":3251.36},{"id":272,"text":"I don't want a dog like a Great Dane and some little tiny cat.","start":3251.78,"end":3255.08},{"id":273,"text":"I kind of want the most cat-like looking dog I can get to help me separate them.","start":3255.08,"end":3259.38},{"id":274,"text":"I'll learn the most interesting information.","start":3259.44,"end":3260.66},{"id":275,"text":"We'll talk about that in that course.","start":3261.04,"end":3262.38},{"id":276,"text":"But you're getting, you guys have got this exactly right.","start":3262.5,"end":3264.74},{"id":277,"text":"What are the key issues underneath the batch?","start":3264.9,"end":3267.16},{"id":278,"text":"Please.","start":3267.28,"end":3267.5},{"id":279,"text":"Awesome.","start":3271.84,"end":3272.24},{"id":280,"text":"Yeah, great question.","start":3274.78,"end":3275.54},{"id":281,"text":"So in the way that we'll teach the traditional stochastic gradient descent,","start":3275.66,"end":3279.56},{"id":282,"text":"it is completely random sampling.","start":3279.82,"end":3281.64},{"id":283,"text":"With replacement sampling, you take it and you pull it up.","start":3281.7,"end":3284.26},{"id":284,"text":"What I'm trying to emphasize from some of this discussion","start":3284.26,"end":3286.3},{"id":285,"text":"is, in practice, it's actually not really done that way.","start":3286.3,"end":3288.78},{"id":286,"text":"Sometimes it's done with this sort that I mentioned,","start":3288.94,"end":3290.88},{"id":287,"text":"where you sort it in a random order.","start":3290.92,"end":3292.2},{"id":288,"text":"We talked about how to cut down on variance.","start":3292.34,"end":3293.74},{"id":289,"text":"And then what I was just saying is","start":3294.02,"end":3295.3},{"id":290,"text":"that some objective functions, some loss functions,","start":3295.3,"end":3297.26},{"id":291,"text":"actually prefer that you have kind of near-miss examples","start":3297.38,"end":3300.14},{"id":292,"text":"to each other, which is also quite intuitive.","start":3300.14,"end":3302.18},{"id":293,"text":"And so people do engineer their batches.","start":3302.42,"end":3304.6},{"id":294,"text":"And then the last piece is, you do","start":3304.66,"end":3306.24},{"id":295,"text":"pick the batches in modern applications","start":3306.24,"end":3307.94},{"id":296,"text":"based on how fast they are.","start":3308.5,"end":3309.38}],"notes":["本段讨论了监督学习中批量大小对模型训练的影响。讲者指出，小批量大小在某些情况下可能更有效，因为它能提供更丰富的数据样本，但同时也可能引入冗余，导致训练效率低下。在数据集具有大量冗余的情况下，小批量可能无法有效利用数据，而大批次则能更高效地更新模型参数。","讲者提到，当数据集中的类别较少或分布较为紧凑时，小批量的冗余问题可能被证明是有效的。然而，这种优势并不适用于所有情况，特别是在更复杂的例子中，大批次可能表现更好。","在实际应用中，批量的处理方式并非完全随机采样，而是可能通过排序或其他方式来优化数据分布。讲者强调，这种做法有助于减少方差并提高模型的学习效果。","讲者还提到，某些损失函数可能更倾向于包含接近的样本，以帮助模型更好地学习区分不同类别。因此，工程师会根据具体需求设计批次，以优化模型性能。","最后，讲者指出，在现代应用中，批量的选择通常基于计算速度，这表明实际应用中需要在模型性能和计算效率之间进行权衡。","整体来看，本段内容强调了批量大小对模型训练的影响，以及如何通过合理设计批次来优化学习效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3140.3,"end":3309.38,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3140.3,"text":"I'd say it's potentially be better because... Oh, great question. Because when we examine people like cats and dogs, wouldn't you end up with, if you have smaller batches, wouldn't you have much more extreme, non-comportable... Yeah, yeah, wonderful question."},{"start":3155.27,"text":"yeah so the question is why would why did you fools ever think that low small batch sizes were going to work uh it was obvious the whole time you were wrong probably but the reason you would think a small batch size would help is a bit a little bit of a calculation which is actually in the slides in the appendix which shows that imagine a situation where i have a data set that contains a lot of redundancy okay if it contains a lot of redundancy and i look at a whole batch"},{"start":3178.47,"text":"then I'm basically seeing the same example. You know, it's just like 90 pictures of the same cat again and again and again, right? And so I've wasted all those steps. I could have been using those 90 cats to refine the model 90 times. So really what it's a trade-off is how statistically meaningful is the data sample that you're seeing versus how big of a step should you take? So it's not an obvious trade-off either direction. The heuristic of why smaller was better was that you were able to polish the model, that more parameter updates were better than what you were doing."},{"start":3207.82,"text":"probably true if you have small classes or a relatively compact domain where you have two classes and they're well-established and separated. In those situations, this redundancy argument is actually provable. SGD with small batches will do better. And so that gave us false confidence that that was explaining the whole world."},{"start":3226.84,"text":"When we move to more interesting examples,"},{"start":3228.58,"text":"larger batch sizes started to work better and better and better."},{"start":3231.68,"text":"The other thing that happened is the way we treat the batches,"},{"start":3234.56,"text":"as you'll see in the second half of the course,"},{"start":3236.24,"text":"we also want to embed information in them."},{"start":3238.48,"text":"When we get to other concerns about how you supervise your data,"},{"start":3241.92,"text":"it's interesting to have a mix of, say, positive and negatives."},{"start":3244.88,"text":"Exactly as you said,"},{"start":3246.0,"text":"I want every batch to have a couple of cats and a couple of dogs,"},{"start":3248.68,"text":"and ideally, I'd like them to be close together intuitively."},{"start":3251.78,"text":"I don't want a dog like a Great Dane and some little tiny cat."},{"start":3255.08,"text":"I kind of want the most cat-like looking dog I can get to help me separate them."},{"start":3259.44,"text":"I'll learn the most interesting information."},{"start":3261.04,"text":"We'll talk about that in that course."},{"start":3262.5,"text":"But you're getting, you guys have got this exactly right."},{"start":3264.9,"text":"What are the key issues underneath the batch?"},{"start":3267.28,"text":"Please."},{"start":3271.84,"text":"Awesome."},{"start":3274.78,"text":"Yeah, great question."},{"start":3275.66,"text":"So in the way that we'll teach the traditional stochastic gradient descent,"},{"start":3279.82,"text":"it is completely random sampling."},{"start":3281.7,"text":"With replacement sampling, you take it and you pull it up."},{"start":3284.26,"text":"What I'm trying to emphasize from some of this discussion"},{"start":3286.3,"text":"is, in practice, it's actually not really done that way."},{"start":3288.94,"text":"Sometimes it's done with this sort that I mentioned,"},{"start":3290.92,"text":"where you sort it in a random order."},{"start":3292.34,"text":"We talked about how to cut down on variance."},{"start":3294.02,"text":"And then what I was just saying is"},{"start":3295.3,"text":"that some objective functions, some loss functions,"},{"start":3297.38,"text":"actually prefer that you have kind of near-miss examples"},{"start":3300.14,"text":"to each other, which is also quite intuitive."},{"start":3302.42,"text":"And so people do engineer their batches."},{"start":3304.66,"text":"And then the last piece is, you do"},{"start":3306.24,"text":"pick the batches in modern applications"},{"start":3308.5,"text":"based on how fast they are."}],"speech_gaps":[{"start":3268.56,"end":3271.44},{"start":3272.64,"end":3274.38}],"frame":"../frames/v049/019.webp","frame_time":3152.3},{"title":"监督学习设定中的批量处理与优化","segments":[{"id":297,"text":"run, as I was talking about in the HBM case. If you haven't optimized the GPU, if you can store your whole model or your whole computation in the HBM, the memory that's on the chip, it's just dramatically faster. And so you optimize for systems concerns. So this very small tweak here that looks like a one-line change of going from N to B, basically, that change","start":3309.45,"end":3330.33},{"id":298,"text":"is actually, in engineering and practice, I'm trying to say, is quite rich. For the point of view of the course, I think you have to know nothing of what I just described, by the way. You just need to say, oh, yeah, your random sample. That's good enough. But I wanted you to understand this stuff is actually fairly interesting and fairly accessible. There's someone right now at one of the frontier labs who's tuning the batch size, as weird as that is to say. And they're getting paid a lot of money, which is great. I hope they're one of my former students. Anyway, all right.","start":3330.95,"end":3353.37},{"id":299,"text":"So this is the definition right here. We take the batch and we average it. And I'm just saying that that rule to select the B, random sampling is good enough. You'll do that for most of the course. But it is actually like making a statistical assumption. And if you really care about what's going on there, it's just an interesting thing. And there's stuff to know. If you're a curious person, there's stuff to know. Wonderful questions. These are really great. All right. All right.","start":3353.9,"end":3384.39},{"id":300,"text":"So hopefully, this is clear. I said this. I should have gone to this slide earlier. Sorry. Here, I would point out one thing, which is you're going to sum over the batch, that mini batch. So b is usually less than the full data set. You compute the errors on each one with your current theta, which was pointed out. This should be theta t.","start":3384.95,"end":3401.73},{"id":301,"text":"You then just do the updates. The point is you don't have to look at the rest of the dataset. You just look at the model and the dataset, your data samples from the batch. Then you're going to take this step size, and I'm highlighting here that it's an alpha b, and that's because it's potentially a different step size.","start":3402.9,"end":3417.18},{"id":302,"text":"You're not going to use the same step size that you would use on the full data set. And in fact, the step size kind of mysteriously depends on other quantities that are there. We'll talk about good rules of thumb. In fact, one of the major pieces of technology that you probably use and so many of you have used step size are basically what are called adaptive optimizers that pick the step size for you within range. They see that you're having some of these problems. Adam, for example, if you know what Adam is, or Adam W.","start":3417.84,"end":3443.14},{"id":303,"text":"or AttaGrad, which was developed by our own John Ducci. Those are the kinds of things that go on","start":3445.19,"end":3450.89},{"id":304,"text":"under the covers. But for now, when we're studying in its purest setting, like if you wanted to do it","start":3450.89,"end":3454.67},{"id":305,"text":"with code and write it out, you would have to pick that alpha b. And that's what goes on.","start":3454.67,"end":3459.85},{"id":306,"text":"Any other questions there? Oh, please.","start":3460.03,"end":3464.11},{"id":307,"text":"Oh yeah, sorry that this wasn't clear. Yeah, so the operation that you're doing here,","start":3468.13,"end":3472.11},{"id":308,"text":"sorry this is unclear is you're going to pick a random batch on each iteration so at every time","start":3472.11,"end":3476.87},{"id":309,"text":"step t you pick a new random batch okay you don't want to feed the same dogs and cats through every","start":3476.87,"end":3482.45},{"id":310,"text":"single time or houses through every time because you'll just learn a model of the data that you've","start":3482.45,"end":3486.15}],"notes":["本段主要讲解监督学习中批量处理（batch processing）的概念，强调在训练过程中使用随机批量数据进行模型更新。讲者指出，批量处理不仅是一种计算优化手段，还涉及统计假设，即通过随机采样来近似整体数据集的分布。"],"formulas":[],"uncertainties":["step size kind of mysteriously depends on other quantities that are there","alpha b"],"diagram":"none","start":3309.45,"end":3486.15,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3309.45,"text":"run, as I was talking about in the HBM case. If you haven't optimized the GPU, if you can store your whole model or your whole computation in the HBM, the memory that's on the chip, it's just dramatically faster. And so you optimize for systems concerns. So this very small tweak here that looks like a one-line change of going from N to B, basically, that change"},{"start":3330.95,"text":"is actually, in engineering and practice, I'm trying to say, is quite rich. For the point of view of the course, I think you have to know nothing of what I just described, by the way. You just need to say, oh, yeah, your random sample. That's good enough. But I wanted you to understand this stuff is actually fairly interesting and fairly accessible. There's someone right now at one of the frontier labs who's tuning the batch size, as weird as that is to say. And they're getting paid a lot of money, which is great. I hope they're one of my former students. Anyway, all right."},{"start":3353.9,"text":"So this is the definition right here. We take the batch and we average it. And I'm just saying that that rule to select the B, random sampling is good enough. You'll do that for most of the course. But it is actually like making a statistical assumption. And if you really care about what's going on there, it's just an interesting thing. And there's stuff to know. If you're a curious person, there's stuff to know. Wonderful questions. These are really great. All right. All right."},{"start":3384.95,"text":"So hopefully, this is clear. I said this. I should have gone to this slide earlier. Sorry. Here, I would point out one thing, which is you're going to sum over the batch, that mini batch. So b is usually less than the full data set. You compute the errors on each one with your current theta, which was pointed out. This should be theta t."},{"start":3402.9,"text":"You then just do the updates. The point is you don't have to look at the rest of the dataset. You just look at the model and the dataset, your data samples from the batch. Then you're going to take this step size, and I'm highlighting here that it's an alpha b, and that's because it's potentially a different step size."},{"start":3417.84,"text":"You're not going to use the same step size that you would use on the full data set. And in fact, the step size kind of mysteriously depends on other quantities that are there. We'll talk about good rules of thumb. In fact, one of the major pieces of technology that you probably use and so many of you have used step size are basically what are called adaptive optimizers that pick the step size for you within range. They see that you're having some of these problems. Adam, for example, if you know what Adam is, or Adam W."},{"start":3445.19,"text":"or AttaGrad, which was developed by our own John Ducci. Those are the kinds of things that go on"},{"start":3450.89,"text":"under the covers. But for now, when we're studying in its purest setting, like if you wanted to do it"},{"start":3454.67,"text":"with code and write it out, you would have to pick that alpha b. And that's what goes on."},{"start":3460.03,"text":"Any other questions there? Oh, please."},{"start":3468.13,"text":"Oh yeah, sorry that this wasn't clear. Yeah, so the operation that you're doing here,"},{"start":3472.11,"text":"sorry this is unclear is you're going to pick a random batch on each iteration so at every time"},{"start":3476.87,"text":"step t you pick a new random batch okay you don't want to feed the same dogs and cats through every"},{"start":3482.45,"text":"single time or houses through every time because you'll just learn a model of the data that you've"}],"speech_gaps":[{"start":3464.51,"end":3467.73}],"frame":"../frames/v049/020.webp","frame_time":3321.45},{"title":"监督学习设定中的批量大小与采样方法","segments":[{"id":311,"text":"seen so it is a random sampling procedure yeah wonderful question and clarification please","start":3486.15,"end":3490.91},{"id":312,"text":"Yeah, that's a wonderful question. So how the batch size scales, you would indeed expect","start":3498.17,"end":3503.55},{"id":313,"text":"that as you ramp up the batch size, right? When you go all the way from one to the limit,","start":3503.55,"end":3508.63},{"id":314,"text":"you're going to get to a batch size of one over N. You very rarely use one over N as your SGD","start":3508.75,"end":3513.19},{"id":315,"text":"batch size. It turns out for like folklore reasons that lots of people write their models,","start":3513.19,"end":3518.59},{"id":316,"text":"models, not linear models, but write their models so that there's the same kind of normalization","start":3518.59,"end":3522.59},{"id":317,"text":"and batch size across all of them.","start":3522.59,"end":3524.11},{"id":318,"text":"And so that is like a thing that you do.","start":3524.31,"end":3526.41},{"id":319,"text":"So if you've played with deep learning things and use like layer norms or sandwich norms","start":3526.51,"end":3530.05},{"id":320,"text":"or other things, they're trying to get you in the right regime where like the step sizes","start":3530.05,"end":3533.61},{"id":321,"text":"are kind of all what's called fancy word is isotropic, but kind of all the dimensions","start":3533.61,"end":3537.19},{"id":322,"text":"are the same.","start":3537.19,"end":3537.69},{"id":323,"text":"So what does that mean?","start":3537.93,"end":3538.81},{"id":324,"text":"For alpha, that means you would intuitively expect that if the model is taking a little","start":3539.01,"end":3545.31},{"id":325,"text":"you don't trust it very much and alpha would be lower almost exactly as you said","start":3545.31,"end":3549.45},{"id":326,"text":"oh yeah wonderful question so we haven't talked about this again you don't need to know this but","start":3552.55,"end":3563.03},{"id":327,"text":"i'm super happy to tell you so it turns out there's actually a wonderful study written by","start":3563.03,"end":3566.85},{"id":328,"text":"this guy at the navy named leslie who wrote this study about how do you do various what are called","start":3566.85,"end":3570.49},{"id":329,"text":"scheduling rules or step size rules so there's two great papers if you ever wonder there's one","start":3570.49,"end":3574.25},{"id":330,"text":"which is called cosine scaling, where you actually make the batch size go up and down as you run.","start":3574.25,"end":3577.55},{"id":331,"text":"where you actually make the batch size go up and down as you run. The idea being that you","start":3577.69,"end":3581.27},{"id":332,"text":"zoom into a local minimum and then it kicks you out. And he showed that this cosine scaling was","start":3581.27,"end":3585.57},{"id":333,"text":"actually one of the best at the time for image models. There's another paper which I love,","start":3585.57,"end":3590.43},{"id":334,"text":"which is from the 90s, which is the OnStriker paper, which shows that a bunch of rules that","start":3590.49,"end":3594.61},{"id":335,"text":"people are using in gradient descent and stochastic gradient descent are actually all","start":3594.61,"end":3598.19},{"id":336,"text":"the same. So called linear and exponential back off and all the rest. Now, I would doubt that","start":3598.19,"end":3603.29},{"id":337,"text":"most people here in production are tuning their schedules unless they're doing something that like","start":3603.29,"end":3608.99},{"id":338,"text":"Well, for a product you would, I guess you would say. But researchers are kind of just putting in the numbers and letting the defaults work most of the time. Yeah, wonderful questions. Please. Awesome. So the thing is, if you look at this, it's a wonderful question. So the question is,","start":3609.63,"end":3637.92},{"id":339,"text":"If you sample your data, you kind of want to see all of your data. You don't want to have repetition in there. And this exactly gets back to the difference between with replacement sampling, where you would see, as I was talking about, those coupons many, many times, versus without replacement sampling, where you shuffle the data set. And when you shuffle that data set, you're guaranteed that you're only going to see every data set exactly once. And so the belief is that that would help you exactly for the reason you said, that you're going to see many of the examples again and again.","start":3638.62,"end":3664.9}],"notes":["本段讨论了监督学习中批量大小（batch size）的选取及其对模型训练的影响。讲者指出，批量大小通常不会设置为1/N，因为这在实际应用中很少见。此外，讲者提到模型设计时会考虑归一化和批量大小的一致性，以确保各维度的更新步长具有各向同性（isotropic）特性。","讲者进一步解释了各向同性（isotropic）的概念，即模型在不同维度上的更新步长应保持一致。这通常通过使用层归一化（layer normalization）等技术来实现，以确保模型在训练过程中处于合适的更新步长范围内。","讲者提到，批量大小的调整策略（如cosine scaling）在训练过程中会动态变化，以帮助模型在局部最小值附近进行探索。这种策略在图像模型中表现优异，且有相关研究支持。","讲者还讨论了采样方法，包括有放回采样（with replacement sampling）和无放回采样（without replacement sampling）。有放回采样会导致数据重复，而无放回采样则通过洗牌数据集确保每个样本仅被访问一次。","讲者强调，无放回采样有助于模型更好地泛化，因为它避免了数据重复带来的偏差。这种采样方法在训练过程中能更有效地利用数据，提高模型性能。","最后，讲者回应了学生的问题，指出在实际生产中，大多数情况下人们不会手动调整学习率调度（learning rate scheduling），而是依赖默认设置。然而，研究人员通常会根据具体情况调整这些参数。"],"formulas":[{"latex":"Cov(cX) = c^2 Cov(X)","symbols":"协方差的线性变换性质","explanation":"该公式正确表达了协方差在标量乘法下的性质，即协方差的线性变换性质。","evidence":"and batch size across all of them."}],"uncertainties":["cosine scaling 的具体数学表达式未明确给出","各向同性（isotropic）的数学定义未明确给出","alpha 的具体数学定义未明确给出"],"diagram":"none","start":3486.15,"end":3664.9,"asr_flags":[326],"math_clarifications":["原始文本中未提及任何需要核对的数学公式或概念，因此无需额外说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3486.15,"text":"seen so it is a random sampling procedure yeah wonderful question and clarification please"},{"start":3498.17,"text":"Yeah, that's a wonderful question. So how the batch size scales, you would indeed expect"},{"start":3503.55,"text":"that as you ramp up the batch size, right? When you go all the way from one to the limit,"},{"start":3508.75,"text":"you're going to get to a batch size of one over N. You very rarely use one over N as your SGD"},{"start":3513.19,"text":"batch size. It turns out for like folklore reasons that lots of people write their models,"},{"start":3518.59,"text":"models, not linear models, but write their models so that there's the same kind of normalization"},{"start":3522.59,"text":"and batch size across all of them."},{"start":3524.31,"text":"And so that is like a thing that you do."},{"start":3526.51,"text":"So if you've played with deep learning things and use like layer norms or sandwich norms"},{"start":3530.05,"text":"or other things, they're trying to get you in the right regime where like the step sizes"},{"start":3533.61,"text":"are kind of all what's called fancy word is isotropic, but kind of all the dimensions"},{"start":3537.19,"text":"are the same."},{"start":3537.93,"text":"So what does that mean?"},{"start":3539.01,"text":"For alpha, that means you would intuitively expect that if the model is taking a little"},{"start":3545.31,"text":"bit of information you don't trust it very much and alpha would be lower almost exactly as you said"},{"start":3552.55,"text":"oh yeah wonderful question so we haven't talked about this again you don't need to know this but"},{"start":3563.03,"text":"i'm super happy to tell you so it turns out there's actually a wonderful study written by"},{"start":3566.85,"text":"this guy at the navy named leslie who wrote this study about how do you do various what are called"},{"start":3570.49,"text":"scheduling rules or step size rules so there's two great papers if you ever wonder there's one"},{"start":3574.25,"text":"where he basically did what's actually quite widely used, which is called cosine scaling,"},{"start":3577.69,"text":"where you actually make the batch size go up and down as you run. The idea being that you"},{"start":3581.27,"text":"zoom into a local minimum and then it kicks you out. And he showed that this cosine scaling was"},{"start":3585.57,"text":"actually one of the best at the time for image models. There's another paper which I love,"},{"start":3590.49,"text":"which is from the 90s, which is the OnStriker paper, which shows that a bunch of rules that"},{"start":3594.61,"text":"people are using in gradient descent and stochastic gradient descent are actually all"},{"start":3598.19,"text":"the same. So called linear and exponential back off and all the rest. Now, I would doubt that"},{"start":3603.29,"text":"most people here in production are tuning their schedules unless they're doing something that like"},{"start":3609.63,"text":"Well, for a product you would, I guess you would say. But researchers are kind of just putting in the numbers and letting the defaults work most of the time. Yeah, wonderful questions. Please. Awesome. So the thing is, if you look at this, it's a wonderful question. So the question is,"},{"start":3638.62,"text":"If you sample your data, you kind of want to see all of your data. You don't want to have repetition in there. And this exactly gets back to the difference between with replacement sampling, where you would see, as I was talking about, those coupons many, many times, versus without replacement sampling, where you shuffle the data set. And when you shuffle that data set, you're guaranteed that you're only going to see every data set exactly once. And so the belief is that that would help you exactly for the reason you said, that you're going to see many of the examples again and again."}],"speech_gaps":[{"start":3491.664,"end":3497.77}],"frame":"../frames/v049/021.webp","frame_time":3498.15},{"title":"监督学习设定中的数据分布与模型差异","segments":[{"id":340,"text":"Now, that assumes that all the examples are equally informative, and that's not always true.","start":3666.13,"end":3670.51},{"id":341,"text":"Sometimes there's a core, a hardcore set that you wish you could see again and again. And if you","start":3670.65,"end":3675.83},{"id":342,"text":"look at modern training for like LLMs that are in the wild, that large language models that are in","start":3675.83,"end":3679.81},{"id":343,"text":"the wild, you'll see that actually there are places where people actually do repetition on","start":3679.81,"end":3683.69},{"id":344,"text":"things. Like code is very popular to do multiple times because of the belief as you put in some","start":3683.69,"end":3687.97},{"id":345,"text":"structure. There's a great paper about this. If you're interested about data mixing, please send","start":3687.97,"end":3692.49},{"id":346,"text":"a note or post to ed i'm happy to post something about about what people know about how you mix","start":3692.49,"end":3696.55},{"id":347,"text":"schedule paper they did it with image models right is there a reason why","start":3696.55,"end":3701.09},{"id":348,"text":"schedule paper they did it with image models right is there a reason why","start":3703.49,"end":3706.89},{"id":349,"text":"like learning rate things are different from the models","start":3706.89,"end":3711.05},{"id":350,"text":"yeah so the question is why does the why would you care that it's from image models versus text","start":3711.05,"end":3717.47},{"id":351,"text":"models what would change there there's two things that change one are the architectures at the time","start":3717.47,"end":3722.39},{"id":352,"text":"the architectures were different we're talking about neural net architectures that has actually","start":3722.39,"end":3726.09},{"id":353,"text":"changed over time now we've converged and built a bunch of technology where you can use kind of","start":3726.09,"end":3730.13},{"id":354,"text":"transformer stacks for both of them the other thing is that the distributions may actually be","start":3730.13,"end":3734.13},{"id":355,"text":"quite different so if you think about images they have a set of national distributions that are in","start":3734.13,"end":3738.49},{"id":356,"text":"the world that like has some smooth variations right like i don't know about you but like you","start":3738.49,"end":3742.97},{"id":357,"text":"know i take pictures of my kids it's like in burst mode i've got a thousand pictures of you know like","start":3742.97,"end":3746.49},{"id":358,"text":"one of my daughters dancing right that thing they're all little tiny variations of each other","start":3746.49,"end":3751.13},{"id":359,"text":"that distribution is kind of compact i don't tend to write the same sentence a thousand times like","start":3751.13,"end":3755.69},{"id":360,"text":"a crazy person maybe i i have over like you know longitudinally in my life but like it's not kind","start":3755.69,"end":3760.75},{"id":361,"text":"of compact in that way and so those differences in distributions they may have an effect on the","start":3760.75,"end":3765.45},{"id":362,"text":"learning rates and so you can't they don't transfer well like if you had clean theory you","start":3765.45,"end":3770.17},{"id":363,"text":"would know what goes from a to b we don't know what goes from a to b in different situations","start":3770.17,"end":3774.35},{"id":364,"text":"so that caveat turned out to be important it caught on quite a bit in images and some of those","start":3774.35,"end":3778.97},{"id":365,"text":"those ideas were adopted,","start":3778.97,"end":3779.93},{"id":366,"text":"but those aren't the ones that we use today","start":3780.11,"end":3781.67},{"id":367,"text":"in engineering text models.","start":3781.67,"end":3783.87},{"id":368,"text":"Yeah.","start":3784.29,"end":3784.65},{"id":369,"text":"Cool.","start":3786.03,"end":3786.39},{"id":370,"text":"How do you feel about changing anything right now?","start":3788.89,"end":3792.73},{"id":371,"text":"I would pick them.","start":3795.19,"end":3796.31},{"id":372,"text":"Yeah, so I would pick the way I would do this.","start":3796.39,"end":3798.15},{"id":373,"text":"Oh, sorry.","start":3798.21,"end":3798.53},{"id":374,"text":"The way I would do this is, oops.","start":3798.63,"end":3800.99},{"id":375,"text":"Yeah, so this covers many of our points.","start":3801.53,"end":3803.29},{"id":376,"text":"So the way I would do this, honestly,","start":3803.41,"end":3804.97},{"id":377,"text":"is I would try and figure out","start":3805.05,"end":3806.17},{"id":378,"text":"what makes the GPU most efficient.","start":3806.17,"end":3807.49},{"id":379,"text":"efficient. So if you look at the cost of these models, like one thing that changed since","start":3807.49,"end":3811.15},{"id":380,"text":"say, like I first
