ut data mixing, please send"},{"start":3692.49,"text":"a note or post to ed i'm happy to post something about about what people know about how you mix"},{"start":3696.55,"text":"your data for for foundation models not part of the course but super happy to tell you yeah"},{"start":3703.49,"text":"schedule paper they did it with image models right is there a reason why"},{"start":3706.89,"text":"like learning rate things are different from the models"},{"start":3711.05,"text":"yeah so the question is why does the why would you care that it's from image models versus text"},{"start":3717.47,"text":"models what would change there there's two things that change one are the architectures at the time"},{"start":3722.39,"text":"the architectures were different we're talking about neural net architectures that has actually"},{"start":3726.09,"text":"changed over time now we've converged and built a bunch of technology where you can use kind of"},{"start":3730.13,"text":"transformer stacks for both of them the other thing is that the distributions may actually be"},{"start":3734.13,"text":"quite different so if you think about images they have a set of national distributions that are in"},{"start":3738.49,"text":"the world that like has some smooth variations right like i don't know about you but like you"},{"start":3742.97,"text":"know i take pictures of my kids it's like in burst mode i've got a thousand pictures of you know like"},{"start":3746.49,"text":"one of my daughters dancing right that thing they're all little tiny variations of each other"},{"start":3751.13,"text":"that distribution is kind of compact i don't tend to write the same sentence a thousand times like"},{"start":3755.69,"text":"a crazy person maybe i i have over like you know longitudinally in my life but like it's not kind"},{"start":3760.75,"text":"of compact in that way and so those differences in distributions they may have an effect on the"},{"start":3765.45,"text":"learning rates and so you can't rns that we'll talk about they don't take a complete back seat, but if you're doing it like if you see how people report their training, they report MFU model flops, you know utilization. They care about how much they're getting out of those GPUs. The statistical properties are sometimes harder to pin down, and that's one thing by the way that is actually quite a blessing. Like one thing that I think is very underappreciated about machine learning, you can get this. So we're going to teach you these different","start":3830.38,"end":3859.68},{"id":386,"text":"different building blocks. But sometimes what happens in this field is that people think those building blocks in their head occupy entirely different spaces. One of the beautiful things about machine learning, which is kind of amazing, is many of these things work. Like one experiment, like I'm going to tell you in the next lecture how you should use a different loss function for classification.","start":3859.69,"end":3877.39},{"id":387,"text":"But it kind of works if you use the loss function from this, even though it kind of makes no sense. And I'll show you why it shouldn't make much sense, but it will still kind of work. There's a robustness to the underlying elements that is pretty surprising. So it's very easy to fixate on the statistical definitions of what's going on. And we will tell you the most important. But I want to highlight that sometimes tweaking the batch size or tweaking these rates doesn't matter nearly as much as making your model get bigger or running it for longer. And so those principal components are the ones that have driven the progress.","start":3878.32,"end":3907.82},{"id":388,"text":"Over the last couple of years. That may saturate at some point. Please. Yeah, we just normalize it into the alpha because it's a number that we don't know how to interpret anyway, so we might as well just multiply it by something. Yeah, awesome. Great questions.","start":3907.92,"end":3931.05},{"id":389,"text":"Okay. All right. So I promised this graph earlier. It's not that great. If you were really on the edge of your seat waiting for it, apologies. But this is how it works. So these are the batch versus gradient descent on a very smooth problem.","start":3933.18,"end":3945.66},{"id":390,"text":"Okay, so a smooth problem. What is it? How do I know this problem is smooth by looking at it? Well, these things here are the isoclines for the function. That's an equal loss. Okay, that's where the loss is all one value. This is a quadratic that we've been looking at. Quadratics, if you remember, produce ellipses as isoclines. Is that familiar? Show of hands familiar?","start":3946.29,"end":3964.65},{"id":391,"text":"OK. I'll remember next time. All right. So that's what they look like. We'll come back to that in more depth. Not critical now. So this function is very smooth and bowl-shaped. Because this says all of the losses here and all of the losses here are the same. These guys are all, each rung is kind of the same. So it's this nice bowl-shaped function. Gradient descent goes down and comes right to the optimal value, which we've put right here in the middle.","start":3965.68,"end":3987.88},{"id":392,"text":"SGD, as we talked about, makes these little wiggles. Sometimes it's going the right direction, sometimes it's going the wrong direction. It bounces around. And if alpha is set too large, it will bounce around in a ball, okay? And it won't get close to the optimal.","start":3989.49,"end":4001.97}],"notes":["本段主要讨论了机器学习中模型利用效率的重要性，以及统计性质在模型训练中的作用。讲者指出，虽然统计性质有时难以确定，但这种不确定性反而成为机器学习的优势之一。此外，讲者提到模型的规模和训练时间对性能的影响远大于调整批量大小或学习率。","讲者强调了机器学习中不同构建模块的相互作用，指出这些模块虽然在概念上可能属于不同领域，但它们在实际应用中往往能协同工作。例如，即使使用不合理的损失函数，模型仍可能表现出良好的性能，这体现了底层元素的鲁棒性。","讲者提到，模型的优化过程涉及梯度下降和随机梯度下降（SGD）的对比。SGD在优化过程中会表现出波动，而学习率（alpha）的设置对收敛性有重要影响。如果学习率过大，SGD可能会在最优解附近震荡，无法有效收敛。","讲者通过一个光滑问题的示意图，解释了如何通过等损失线（isoclines）来判断问题的光滑性。对于二次函数，等损失线形成椭圆，这表明问题具有光滑的结构，梯度下降方法可以有效地找到最优解。","讲者指出，模型的优化过程需要关注统计定义和实际性能之间的平衡。虽然统计性质可能难以精确确定，但模型的规模和训练时间仍然是提升性能的关键因素。","讲者通过示意图展示了梯度下降和随机梯度下降在光滑问题上的表现，强调了学习率对收敛速度和稳定性的影响。同时，讲者提到，模型的优化过程需要综合考虑多个因素，如批量大小、学习率和模型规模。"],"formulas":[],"uncertainties":["MFU model flops"],"diagram":"none","start":3830.38,"end":4001.97,"asr_flags":[],"math_clarifications":["原文中未提供完整的数学公式或上下文，无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3830.38,"text":"i care quite a bit about making sure the utilization of the model is high that i get in more steps the statistical concerns that we'll talk about they don't take a complete back seat but if you're doing it like if you see how people report their training they report mfu model flops you know utilization they care about how much they're getting out of those gpus the statistical properties are sometimes harder to pin down and that's one thing by the way that is actually quite a blessing like one thing that i think is very underappreciated about machine learning you can get this so we're going to teach you these different"},{"start":3859.69,"text":"different building blocks. But sometimes what happens in this field is that people think those building blocks in their head occupy entirely different spaces. One of the beautiful things about machine learning, which is kind of amazing, is many of these things work. Like one experiment, like I'm going to tell you in the next lecture how you should use a different loss function for classification."},{"start":3878.32,"text":"But it kind of works if you use the loss function from this, even though it kind of makes no sense. And I'll show you why it shouldn't make much sense, but it will still kind of work. There's a robustness to the underlying elements that is pretty surprising. So it's very easy to fixate on the statistical definitions of what's going on. And we will tell you the most important. But I want to highlight that sometimes tweaking the batch size or tweaking these rates doesn't matter nearly as much as making your model get bigger or running it for longer. And so those principal components are the ones that have driven the progress."},{"start":3907.92,"text":"over the last couple of years. That may saturate at some point. Please. Yeah, we just normalize it into the alpha because it's a number that we don't know how to interpret anyway, so we might as well just multiply it by something. Yeah, awesome. Great questions."},{"start":3933.18,"text":"Okay. All right. So I promised this graph earlier. It's not that great. If you were really on the edge of your seat waiting for it, apologies. But this is how it works. So these are the batch versus gradient descent on a very smooth problem."},{"start":3946.29,"text":"Okay, so a smooth problem. What is it? How do I know this problem is smooth by looking at it? Well, these things here are the isoclines for the function. That's an equal loss. Okay, that's where the loss is all one value. This is a quadratic that we've been looking at. Quadratics, if you remember, produce ellipses as isoclines. Is that familiar? Show of hands familiar?"},{"start":3965.68,"text":"OK. I'll remember next time. All right. So that's what they look like. We'll come back to that in more depth. Not critical now. So this function is very smooth and bowl-shaped. Because this says all of the losses here and all of the losses here are the same. These guys are all, each rung is kind of the same. So it's this nice bowl-shaped function. Gradient descent goes down and comes right to the optimal value, which we've put right here in the middle."},{"start":3989.49,"text":"SGD, as we talked about, makes these little wiggles. Sometimes it's going the right direction, sometimes it's going the wrong direction. It bounces around. And if alpha is set too large, it will bounce around in a ball, okay? And it won't get close to the optimal."}],"speech_gaps":[],"frame":"../frames/v049/023.webp","frame_time":3842.38},{"title":"监督学习设定中的优化与训练行为","segments":[{"id":393,"text":"So one trick that people do, by the way, is they do something called averaging the iterates. They may average over a trajectory of those bounces to kind of simulate a larger batch size. But hopefully, intuitively, this makes sense. The reason I highlight this for you is when you're training a model, you will observe this behavior. You will see the loss start to go and bounce around. And you'll realize, maybe I set alpha too high, right? So those are the kinds of things that you'll see.","start":4002.46,"end":4027.6},{"id":394,"text":"Now, in machine learning, in the second half of the course, the functions will not be so nice. They will not be these nice bowl-shaped functions, these convex functions. They're going to be nasty. And when they're nasty, then this is relying on the fact that it's quite smooth to go fast, to get rapidly down to the optimal. This is not relying on this. This is just kind of drunkenly stumbling its way to the loss function. And this one we prefer, as weird as it is, but for all the reasons I outlined. Okay, cool. All right.","start":4028.29,"end":4056.27},{"id":395,"text":"Okay, so just to make sure that I got across what I wanted to get across, our goal was to optimize a loss function to find a good predictor. We did that by minimizing this loss. We talked a lot. I talked a lot about what it means to kind of assume about your data, that it's representative of the world. We'll talk about that even more later.","start":4058.71,"end":4075.47},{"id":396,"text":"We learned about an algorithm which hopefully looked relatively simple to you. All the folks here knew about derivatives and computing gradients and partial derivatives. Awesome. And we did this kind of weird, simple thing where we started looking at not our entire data, but a batch of data, a subset of data. And when we did that, that somehow unlocked a bunch of runtime performance and, I claim, these really large models. That algorithm was called stochastic gradient descent. We talked about all the ways to select batches. The most important one is select them at random.","start":4076.38,"end":4104.38},{"id":397,"text":"We touched a little bit on these trade-offs of using the right batch size through our conversations about when it's too small and when it's too large. What are the considerations inside a batch? And that's to hopefully give you a feel when you start to actually play with and tune some of these models. That's different, by the way, than what you would do if you were training a traditional stats model where you were trying to get down to the optimal value. There's just different concerns. And hopefully some of those concerns have been highlighted and will become more clear over the next couple of lectures. Any questions on this before I move on? Please.","start":4105.84,"end":4136.43},{"id":398,"text":"How do you know when to stop?","start":4138.03,"end":4139.01},{"id":399,"text":"Awesome. Great question. So the question is, as you're bouncing around near the optimum, how do you know where to stop? And unfortunately, you don't. You don't know if you're bouncing around. These models have these very weird behaviors. So one of the things that they have is a behavior sometimes, and if you watch and measure them, all of a sudden, they're running, they're running, the loss is kind of doing something, and then all of a sudden, a capability turns on. So it just gets a little bit better. The representation clicks in when you're training more sophisticated models. So you don't know if you're stuck in kind of one of those local areas.","start":4141.18,"end":4167.88}],"notes":["本段主要讲解了在监督学习中，优化损失函数时可能遇到的训练行为，如损失值在最优解附近波动的现象。讲者提到，这种波动可能是因为学习率设置过高，从而导致模型在最优解附近来回震荡。此外，还提到在训练过程中，模型可能会突然表现出更好的性能，这种现象在训练更复杂的模型时尤为明显。","讲者指出，在机器学习的后半部分，目标函数通常不是光滑的凸函数，而是更复杂的非凸函数。这种情况下，优化过程可能更加困难，模型可能需要通过随机梯度下降等方法进行探索，而不是直接快速收敛到最优解。","讲者强调了在监督学习中，优化目标是找到一个良好的预测器，这通常通过最小化损失函数来实现。同时，讲者还提到，假设数据能够代表真实世界是重要的前提，这一点将在后续课程中进一步探讨。","讲者介绍了随机梯度下降（SGD）算法，并指出其通过使用数据子集（即小批量）来提高计算效率。讲者还提到，选择小批量时，随机选择是最重要的一种方式。","讲者讨论了批量大小对训练过程的影响，包括当批量过小时可能带来的噪声问题，以及当批量过大时可能带来的计算负担。此外，讲者还指出，训练模型时需要考虑不同的因素，这些因素与传统统计模型的训练目标有所不同。","讲者最后提出了一个关于何时停止训练的问题，并指出在训练过程中，模型可能在最优解附近波动，因此很难确定何时停止训练。讲者还提到，模型可能会突然表现出更好的性能，这种现象在训练更复杂的模型时尤为明显。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4002.46,"end":4167.88,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4002.46,"text":"So one trick that people do, by the way, is they do something called averaging the iterates. They may average over a trajectory of those bounces to kind of simulate a larger batch size. But hopefully, intuitively, this makes sense. The reason I highlight this for you is when you're training a model, you will observe this behavior. You will see the loss start to go and bounce around. And you'll realize, maybe I set alpha too high, right? So those are the kinds of things that you'll see. Now, in machine learning, in the second half of the course,"},{"start":4028.29,"text":"the functions will not be so nice. They will not be these nice bowl-shaped functions, these convex functions. They're going to be nasty. And when they're nasty, then this is relying on the fact that it's quite smooth to go fast, to get rapidly down to the optimal. This is not relying on this. This is just kind of drunkenly stumbling its way to the loss function. And this one we prefer, as weird as it is, but for all the reasons I outlined. Okay, cool. All right."},{"start":4058.71,"text":"Okay, so just to make sure that I got across what I wanted to get across, our goal was to optimize a loss function to find a good predictor. We did that by minimizing this loss. We talked a lot. I talked a lot about what it means to kind of assume about your data, that it's representative of the world. We'll talk about that even more later."},{"start":4076.38,"text":"We learned about an algorithm which hopefully looked relatively simple to you. All the folks here knew about derivatives and computing gradients and partial derivatives. Awesome. And we did this kind of weird, simple thing where we started looking at not our entire data, but a batch of data, a subset of data. And when we did that, that somehow unlocked a bunch of runtime performance and, I claim, these really large models. That algorithm was called stochastic gradient descent. We talked about all the ways to select batches. The most important one is select them at random."},{"start":4105.84,"text":"We touched a little bit on these trade-offs of using the right batch size through our conversations about when it's too small and when it's too large. What are the considerations inside a batch? And that's to hopefully give you a feel when you start to actually play with and tune some of these models. That's different, by the way, than what you would do if you were training a traditional stats model where you were trying to get down to the optimal value. There's just different concerns. And hopefully some of those concerns have been highlighted and will become more clear over the next couple of lectures. Any questions on this before I move on? Please."},{"start":4138.03,"text":"How do you know when to stop?"},{"start":4141.18,"text":"Awesome. Great question. So the question is, as you're bouncing around near the optimum, how do you know where to stop? And unfortunately, you don't. You don't know if you're bouncing around. These models have these very weird behaviors. So one of the things that they have is a behavior sometimes, and if you watch and measure them, all of a sudden, they're running, they're running, the loss is kind of doing something, and then all of a sudden, a capability turns on. So it just gets a little bit better. The representation clicks in when you're training more sophisticated models. So you don't know if you're stuck in kind of one of those local areas."}],"speech_gaps":[],"frame":"../frames/v049/024.webp","frame_time":4014.46},{"title":"监督学习设定与模型复杂性","segments":[{"id":400,"text":"Or if you're going to get to something if you're really close to the answer. And so that is actually a very computationally difficult problem. For everything in the next couple of sections, it's going to turn out that the models, if you're familiar, are going to be convex underneath the covers. They're going to be generalized linear models. That's what we're going to talk about for two weeks. In those situations, we can actually tell how far we are from the optimum. I'm not going to beat you in the head about this too much, because you should just take Steven's course. It's wonderful. I love Steven Boyd.","start":4168.71,"end":4192.75},{"id":401,"text":"But also, those won't really do us much good when we get to the wild world of neural nets and unsupervised and all the rest. And the truth is there, we don't know. And so how do you run? You kind of run like if I watch how I do it or my students do it, you look at like weights and biases, you watch so the thing goes down, you're like, I don't know, if I train for another two days, I can't go out with my friends.","start":4193.73,"end":4212.51},{"id":402,"text":"I'm going to cut it off now. And that is unfortunately how it works. And so you basically provision. We're doing a pretty big train right now. The way we're provisioning it is like, well, we have these GPUs for two months for this project that are donated, some DNA model thing, whatever. We're going to train that right now. And so it kind of just is an engineering consideration more than it's a principled one.","start":4213.26,"end":4233.84},{"id":403,"text":"I'm not really embarrassed to say, because the stuff we've been building is great. I used to be embarrassed when nothing worked. So my wife said, you know, we've been together forever. She's like, you know, you've been building the same demo since I've known you, since undergrad, but now stuff works, so it's okay. So, all right. Anyway, so yeah, so these squares are really special. I want to do this basically just for notation. We have a couple minutes left, so I want to just highlight this notation about normal equations. If you haven't seen this before,","start":4235.1,"end":4262.04},{"id":404,"text":"Take a look, do a review. So we're going to derive the normal equations. So mainly this is to make sure you're comfortable with the notation, if I'm honest, but also to make sure that you know basic things about linear algebra. So if you don't know what rank is, you don't know what inverses are, then you should study up because we use that terminology pretty freely. So we have some loss function here.","start":4263.52,"end":4288.43},{"id":405,"text":"We have some loss function j here. We have, again, our vector notation. This is actually now going to be these n's are going to be laid out by rows. This is going to be n by d matrix. So it's going to have n rows where the examples are there, and then d plus 1.","start":4290.16,"end":4303.0},{"id":406,"text":"are the feature size that we talked about. So this is examples. This is each one of our examples. Then we're going to have correspondingly an element of Rn, which is going to be this vector here, y. You may hear me call x the design matrix. This is really old terminology, but it's one that we use. And it just means the matrix of x after we've done the featurization. So after it's been kind of loaded and pre-processed into this form. Sometimes we'll worry about properties of the design matrix. So that's what that means. OK. All right. Now, if it's linear, let's see if we can get here.","start":4303.55,"end":4336.28}],"notes":["本段主要讨论监督学习中的模型复杂性问题，特别是凸优化和非凸优化的对比。讲者提到，对于接下来几节的内容，模型在底层实际上是凸的，属于广义线性模型，这使得我们可以判断离最优解的距离。然而，当进入神经网络和无监督学习领域时，这种凸性不再适用，因此无法直接判断优化过程的进展。","讲者提到在实际训练过程中，如何判断模型是否收敛，通常通过观察权重和偏差的变化，以及损失函数的下降趋势。但这种判断更多是工程上的考虑，而非理论上的严谨性。","讲者提到在训练过程中，资源的分配（如GPU的使用）是一个重要的工程问题，而不是理论上的原则问题。这表明在实际应用中，模型训练的效率和资源管理是关键。","讲者提到自己不再为模型无法工作而感到羞愧，因为现在模型已经能够正常运行。这反映了在机器学习实践中，模型的可操作性和实用性的重要性。","讲者提到将使用正常方程（normal equations）来推导线性模型的参数估计，这需要熟悉线性代数的基本概念，如矩阵的秩和逆矩阵。这表明在监督学习中，线性代数是基础工具。","讲者提到设计矩阵（design matrix）的概念，这是将特征向量组织成矩阵的形式，以便进行线性回归等操作。设计矩阵的性质（如秩、正则性）在模型训练中起着重要作用。"],"formulas":[],"uncertainties":["在讲者提到的 'design matrix' 的具体定义和性质上，可能存在一些模糊之处，需要进一步澄清。"],"diagram":"none","start":4168.71,"end":4336.28,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4168.71,"text":"or if you're going to get to something if you're really close to the answer. And so that is actually a very computationally difficult problem. For everything in the next couple of sections, it's going to turn out that the models, if you're familiar, are going to be convex underneath the covers. They're going to be generalized linear models. That's what we're going to talk about for two weeks. In those situations, we can actually tell how far we are from the optimum. I'm not going to beat you in the head about this too much, because you should just take Steven's course. It's wonderful. I love Steven Boyd."},{"start":4193.73,"text":"But also, those won't really do us much good when we get to the wild world of neural nets and unsupervised and all the rest. And the truth is there, we don't know. And so how do you run? You kind of run like if I watch how I do it or my students do it, you look at like weights and biases, you watch so the thing goes down, you're like, I don't know, if I train for another two days, I can't go out with my friends."},{"start":4213.26,"text":"I'm going to cut it off now. And that is unfortunately how it works. And so you basically provision. We're doing a pretty big train right now. The way we're provisioning it is like, well, we have these GPUs for two months for this project that are donated, some DNA model thing, whatever. We're going to train that right now. And so it kind of just is an engineering consideration more than it's a principled one."},{"start":4235.1,"text":"I'm not really embarrassed to say, because the stuff we've been building is great. I used to be embarrassed when nothing worked. So my wife said, you know, we've been together forever. She's like, you know, you've been building the same demo since I've known you, since undergrad, but now stuff works, so it's okay. So, all right. Anyway, so yeah, so these squares are really special. I want to do this basically just for notation. We have a couple minutes left, so I want to just highlight this notation about normal equations. If you haven't seen this before,"},{"start":4263.52,"text":"Take a look, do a review. So we're going to derive the normal equations. So mainly this is to make sure you're comfortable with the notation, if I'm honest, but also to make sure that you know basic things about linear algebra. So if you don't know what rank is, you don't know what inverses are, then you should study up because we use that terminology pretty freely. So we have some loss function here."},{"start":4290.16,"text":"We have some loss function j here. We have, again, our vector notation. This is actually now going to be these n's are going to be laid out by rows. This is going to be n by d matrix. So it's going to have n rows where the examples are there, and then d plus 1."},{"start":4303.55,"text":"are the feature size that we talked about. So this is examples. This is each one of our examples. Then we're going to have correspondingly an element of Rn, which is going to be this vector here, y. You may hear me call x the design matrix. This is really old terminology, but it's one that we use. And it just means the matrix of x after we've done the featurization. So after it's been kind of loaded and pre-processed into this form. Sometimes we'll worry about properties of the design matrix. So that's what that means. OK. All right. Now, if it's linear, let's see if we can get here."}],"speech_gaps":[],"frame":"../frames/v049/025.webp","frame_time":4180.71},{"title":"监督学习设定中的梯度与矩阵运算","segments":[{"id":407,"text":"Notice that J has this particularly lovely form. Now if this is not obvious to you that it has it, this is a good signal that you should do some work on kind of your vector.","start":4338.15,"end":4349.2},{"id":408,"text":"manipulation, matrix manipulation stuff. This is the inner product. That's all I've written here. So L2 is important because it's the inner product. That's the other succinct way to say this. And so this is computing squares. And if you are rusty about this, please just compute it by hand. It's not some deep, mysterious thing. I'm just saying this thing here equals this thing here. OK, cool. So now we've stacked the design.","start":4350.4,"end":4377.88},{"id":409,"text":"If you don't remember this, please, again, review. But basically, when we compute a gradient of a matrix, it means that we're computing derivatives according to A of each underlying element and just stacking them in the corresponding type. So if you had a matrix coming in, you're going to have a matrix coming out. They're going to have all the same types. They're going to have the partial derivatives computed. This is the object. These are derivatives in the sense you're used to them.","start":4380.29,"end":4406.02},{"id":410,"text":"In that, if you want to find a minimum and it's a convex function and all those nice things, you set the gradient equal to zero. Why does this work intuitively? Well, intuitively what's happening is the function is going to be bowl-shaped. It's going to be strictly bowl-shaped. If there's a change, the function changes in one direction, you're not at the bottom. When you get to the bottom, you're done. This means there's no change in a local direction, just like if you computed the derivative for a single 1D function. All right.","start":4406.77,"end":4433.49},{"id":411,"text":"So far so good? All right. I got to get better at that. Anyway, so from our previous derivation, this is just some arithmetic. We're going to multiply this thing out and normalize. The 2 does us a little bit of value. We multiply out. We get the x theta as the xty's, and we get this derivative. If that's unfamiliar to you, what's going on? We're multiplying these terms out. We get an xtx theta on each side.","start":4437.06,"end":4468.03},{"id":412,"text":"When we take the derivative with respect to theta, we get the term on one side and the other, but it's symmetric. We have the one half, we get this term, okay? So it's this term in the FOIL. When we multiply the y's, we're not taking the derivative, they don't depend on theta, they get knocked out. When we do the cross terms, we get the cross term represented like so, twice, and that's the derivative. We set this equal to zero.","start":4468.53,"end":4494.27}],"notes":["本段主要讲解了梯度计算和矩阵运算的基本概念。讲者指出，J函数具有特别优美的形式，如果对这一点不明显，说明需要加强向量运算的基础知识。讲者强调，L2范数的重要性在于它等价于内积，这是另一种简洁的表达方式。此外，讲者提到，计算平方时，如果对相关概念不熟悉，可以通过手动计算来加深理解。","讲者进一步解释了梯度的计算方法，指出当计算矩阵的梯度时，实际上是针对每个基础元素计算导数，并将它们按对应类型堆叠起来。因此，输入矩阵和输出矩阵的类型相同，且包含所有偏导数的计算。讲者还提到，梯度的计算与单变量函数的导数概念类似。","讲者讨论了如何通过设置梯度为零来寻找函数的最小值，并指出这适用于凸函数的情况。讲者用直观的碗形函数来解释这一过程，说明当函数在某个方向上发生变化时，说明尚未到达底部；当到达底部时，函数在局部方向上不再变化。","讲者继续讲解了如何通过展开和归一化来计算导数。讲者提到，乘以2对计算有帮助，并指出在展开过程中，会得到xθ和xty的项。对于不熟悉这一过程的听众，讲者建议手动计算以加深理解。","讲者进一步解释了如何对θ求导，并指出在展开过程中，y项不依赖于θ，因此在求导时会被排除。交叉项则会以两次的形式出现，最终得到导数。讲者最后指出，将导数设为零是求解最小值的关键步骤。","讲者强调了矩阵运算和梯度计算的基础性，指出这些概念是监督学习中非常重要的部分。通过这些计算，可以找到函数的最小值，并且这些方法在实际应用中非常常见。"],"formulas":[{"latex":"J = \\frac{1}{2} \\text{tr}((X\\theta - y)^T(X\\theta - y))","symbols":"J 是损失函数，X 是设计矩阵，θ 是参数向量，y 是目标向量","explanation":"公式正确，J 是均方误差损失函数，使用迹函数来计算向量的平方范数。","evidence":"So far so good? All right. I got to get better at that. Anyway, so from our previous derivation, this is just some arithmetic. We're going to multiply this thing out and normalize. The 2 does us a little bit of value. We multiply out. We get the x theta as the xty's, and we get this derivative. If that's unfamiliar to you, what's going on? We're multiplying these terms out. We get an xtx theta on each side."},{"latex":"\\frac{\\text{d}J}{\\text{d}\\theta} = X^T(X\\theta - y)","symbols":"梯度是通过矩阵运算得到的，X^T 是 X 的转置，Xθ - y 是预测值与真实值的差","explanation":"公式正确，梯度计算正确，使用矩阵微分规则，X^T(Xθ - y) 是损失函数 J 关于 θ 的梯度。","evidence":"When we take the derivative with respect to theta, we get the term on one side and the other, but it's symmetric. We have the one half, we get this term, okay? So it's this term in the FOIL. When we multiply the y's, we're not taking the derivative, they don't depend on theta, they get knocked out. When we do the cross terms, we get the cross term represented like so, twice, and that's the derivative. We set this equal to zero."}],"uncertainties":[],"diagram":"none","start":4338.15,"end":4494.27,"asr_flags":[],"math_clarifications":["公式中的迹函数 tr 是为了将向量的平方范数转换为标量，这是标准的线性回归损失函数的写法。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4338.15,"text":"Notice that J has this particularly lovely form. Now if this is not obvious to you that it has it, this is a good signal that you should do some work on kind of your vector."},{"start":4350.4,"text":"manipulation, matrix manipulation stuff. This is the inner product. That's all I've written here. So L2 is important because it's the inner product. That's the other succinct way to say this. And so this is computing squares. And if you are rusty about this, please just compute it by hand. It's not some deep, mysterious thing. I'm just saying this thing here equals this thing here. OK, cool. So now we've stacked the design."},{"start":4380.29,"text":"If you don't remember this, please, again, review. But basically, when we compute a gradient of a matrix, it means that we're computing derivatives according to A of each underlying element and just stacking them in the corresponding type. So if you had a matrix coming in, you're going to have a matrix coming out. They're going to have all the same types. They're going to have the partial derivatives computed. This is the object. These are derivatives in the sense you're used to them."},{"start":4406.77,"text":"In that, if you want to find a minimum and it's a convex function and all those nice things, you set the gradient equal to zero. Why does this work intuitively? Well, intuitively what's happening is the function is going to be bowl-shaped. It's going to be strictly bowl-shaped. If there's a change, the function changes in one direction, you're not at the bottom. When you get to the bottom, you're done. This means there's no change in a local direction, just like if you computed the derivative for a single 1D function. All right."},{"start":4437.06,"text":"So far so good? All right. I got to get better at that. Anyway, so from our previous derivation, this is just some arithmetic. We're going to multiply this thing out and normalize. The 2 does us a little bit of value. We multiply out. We get the x theta as the xty's, and we get this derivative. If that's unfamiliar to you, what's going on? We're multiplying these terms out. We get an xtx theta on each side."},{"start":4468.53,"text":"When we take the derivative with respect to theta, we get the term on one side and the other, but it's symmetric. We have the one half, we get this term, okay? So it's this term in the FOIL. When we multiply the y's, we're not taking the derivative, they don't depend on theta, they get knocked out. When we do the cross terms, we get the cross term represented like so, twice, and that's the derivative. We set this equal to zero."}],"speech_gaps":[],"frame":"../frames/v049/026.webp","frame_time":4350.15},{"title":"监督学习设定中的线性回归与矩阵求逆","segments":[{"id":413,"text":"So that means that this thing is equal to 0. So how do we solve for that? We make these two terms equal to each other. Well, we have to take the inverse to get rid of the side, xtx inverse times xty. And this is the least square solution. This is an optimal solution for theta. Now, I cheated in one part of this derivation. This is something I assumed about x when I did this.","start":4494.93,"end":4521.15},{"id":414,"text":"Exactly right. I assume that X, T, X is invertible. If, for example, I had relatively few examples and a huge set of dimensions, this would be a nonsensical kind of thing. So here, when I'm looking at it, I think that I have many, many data points more than my parameters. Okay? And hopefully, that inverse exists. But what happens if it doesn't exist? What is it defined up to? The theta that I get.","start":4523.58,"end":4553.32},{"id":415,"text":"So yeah, so if this is unfamiliar to you, take a look. So there will be a null space. And in that null space, I won't prefer one solution over another. All of them would be valuable. So anything in the null space of xtx, I can add that to theta, and it doesn't change the answer at all. So now there goes from being one single explanation, one single theta, theta star, to being an entire subspace of them, effectively the entire null space of xtx.","start":4558.44,"end":4580.56},{"id":416,"text":"If you're seeing this and going, oh, yeah, I remember that linear algebra. Sounds great. Do a little review. If you've never heard that and it sounds like I'm speaking a foreign language, please, please, please use the Friday lectures. Because after this, I'm going to assume we know all this stuff. That's basically the thing there. It will turn out, by the way, you could also worry that XCX here is also going to be, it turns out, positive semi-definite. By show of hands, who knows what PSD means? Positive semi-definite.","start":4581.32,"end":4604.34},{"id":417,"text":"Awesome. We're doing great. OK, fantastic. OK, so this is unfamiliar. I even wrote it down. Practice on Friday. And I just want to make sure that's clear. We're going to use these concepts, positive semi-definite. We're going to use these concepts like it's invertible. We're going to use them pretty freely. We're going to compute vector derivatives and matrix derivatives in this way. If it's unfamiliar, spend a little bit of time to make it familiar. It will make your life a little bit more easy. It's much easier to compute this way, I think, than the other way just by hand.","start":4604.8,"end":4633.14},{"id":418,"text":"All right. Almost pretty good on time. Not so bad. Usually I'm pretty bad about this. All right. So we saw lots of notation today. That was the intent of the lecture in some ways. I wanted to give you a little bit of machine learning stuff and lore, but I wanted to make sure that you understood all the pieces that go on. We learned a little bit about linear regression. We learned what the model is, right? So this is one of n models that you'll see in this class. We learned how to solve it.","start":4635.36,"end":4658.93}],"notes":["本段讲解了线性回归中如何通过矩阵求逆来求解参数θ。讲者指出，当XTX可逆时，可以通过求逆得到最小二乘解，这是θ的最优解。但讲者也承认在推导过程中假设了XTX可逆，这在某些情况下可能不成立，例如数据点数量远少于特征维度时。","讲者进一步说明，当XTX不可逆时，解将不唯一，所有位于XTX零空间中的解都是有效的。这意味着θ的解将是一个子空间，而不是单一解。讲者提醒学生注意线性代数中的零空间概念。","讲者提到，XTX是正定的，这在机器学习中是一个重要性质。正定矩阵具有良好的性质，如可逆性，这在优化问题中非常重要。讲者还提到，如果XTX是半正定的，那么它可能不可逆，这需要学生进一步理解。","讲者强调，学生需要掌握正定矩阵和半正定矩阵的概念，并能够计算向量和矩阵的导数。这些概念在后续课程中将频繁使用，因此学生需要花时间熟悉这些内容。","讲者指出，线性回归是监督学习中的一种基本模型，是课程中将要学习的多种模型之一。学生需要理解线性回归的模型结构以及如何求解参数θ。","讲者最后提到，课程中将使用大量符号和数学表达式，因此学生需要理解这些符号的含义，并掌握相关的数学工具，如线性代数和微积分。"],"formulas":[{"latex":"X^T X \\theta = X^T y","symbols":"X^T X θ = X^T y","explanation":"公式正确，表示线性回归的正规方程，其中X是设计矩阵，θ是参数向量，y是目标向量。","evidence":"So that means that this thing is equal to 0. So how do we solve for that? We make these two terms equal to each other. Well, we have to take the inverse to get rid of the side, xtx inverse times xty. And this is the least square solution. This is an optimal solution for theta. Now, I cheated in one part of this derivation. This is something I assumed about x when I did this."}],"uncertainties":[],"diagram":"none","start":4494.93,"end":4658.93,"asr_flags":[],"math_clarifications":["公式index 0是线性回归的正规方程，正确且完整。其他公式重复或不完整，无法核定其数学意义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4494.93,"text":"So that means that this thing is equal to 0. So how do we solve for that? We make these two terms equal to each other. Well, we have to take the inverse to get rid of the side, xtx inverse times xty. And this is the least square solution. This is an optimal solution for theta. Now, I cheated in one part of this derivation. This is something I assumed about x when I did this."},{"start":4523.58,"text":"Exactly right. I assume that X, T, X is invertible. If, for example, I had relatively few examples and a huge set of dimensions, this would be a nonsensical kind of thing. So here, when I'm looking at it, I think that I have many, many data points more than my parameters. Okay? And hopefully, that inverse exists. But what happens if it doesn't exist? What is it defined up to? The theta that I get."},{"start":4558.44,"text":"So yeah, so if this is unfamiliar to you, take a look. So there will be a null space. And in that null space, I won't prefer one solution over another. All of them would be valuable. So anything in the null space of xtx, I can add that to theta, and it doesn't change the answer at all. So now there goes from being one single explanation, one single theta, theta star, to being an entire subspace of them, effectively the entire null space of xtx."},{"start":4581.32,"text":"If you're seeing this and going, oh, yeah, I remember that linear algebra. Sounds great. Do a little review. If you've never heard that and it sounds like I'm speaking a foreign language, please, please, please use the Friday lectures. Because after this, I'm going to assume we know all this stuff. That's basically the thing there. It will turn out, by the way, you could also worry that XCX here is also going to be, it turns out, positive semi-definite. By show of hands, who knows what PSD means? Positive semi-definite."},{"start":4604.8,"text":"Awesome. We're doing great. OK, fantastic. OK, so this is unfamiliar. I even wrote it down. Practice on Friday. And I just want to make tainties":[],"diagram":"none","start":4659.18,"end":4684.08,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4659.18,"text":"And we learned that there's a very basic algorithm to solve it called stochastic gradient descent. It's our workhorse. And so we're going to see that algorithm come back again and again and again. Next time, what we're going to learn about is not regression problems. We're going to learn about classification. So instead of lurking at house prices, we're going to learn how to classify cats versus dogs or next word in the sentence and all those discrete functions. Thanks so much. Have a wonderful weekend."}],"speech_gaps":[],"frame":"../frames/v049/028.webp","frame_time":4671.18}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}

else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
