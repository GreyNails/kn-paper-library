ebp","frame_time":2619.17},{"title":"监督学习设定中的注意事项","segments":[{"id":232,"text":"complicated things it becomes tricky to guarantee please","zh":"复杂的事情变得难以保证请","start":2785.95,"end":2788.91},{"id":233,"text":"exactly right yeah wonderful yeah so here this this H of theta should","zh":"完全正确，是的，太好了，是的，所以这里的这个H of theta应该","start":2796.97,"end":2800.85},{"id":234,"text":"actually be the theta T sorry if that's not clear I'll just write it in here so","zh":"实际上就是 theta 的转置，抱歉如果不清楚的话，我在这里再写一遍","start":2800.85,"end":2804.51},{"id":235,"text":"wonderful observation. So the observation is which theta is talking about here and it's the","zh":"精彩的观察。因此，这个观察是关于这里的theta，它指的是","start":2804.51,"end":2808.85},{"id":236,"text":"theta from the last step. That's just a notational bug. You got it exactly right.","zh":"上一步的theta。这只是记号上的错误。你完全理解正确。","start":2808.85,"end":2811.83},{"id":237,"text":"Other questions? Oh please, did you have a question?","zh":"还有其他问题吗？哦，请问您有问题吗？","start":2814.35,"end":2817.13},{"id":238,"text":"Yeah, so the question is if you sample with versus without replacement, how does that change","zh":"是的，所以问题是，如果你有放回地采样还是无放回地采样，这会如何改变","start":2827.25,"end":2831.87},{"id":239,"text":"change the situation. And it turns out that basically the moral of the story is we have","zh":"改变局势。事实上，故事的寓意基本上是，我们有","start":2831.87,"end":2837.63},{"id":240,"text":"increasing theory and empirical evidence that it doesn't matter if you do the with replacement","zh":"越来越多的理论和实证证据表明，如果你使用有放回的方式进行采样，其实并不重要。","start":2837.63,"end":2841.45},{"id":241,"text":"versus without replacement. But without replacement is, in fact, a lot easier to implement. Because","zh":"与无放回采样相比，无放回采样实际上更容易实现。因为","start":2841.45,"end":2846.19},{"id":242,"text":"what you can do is you can hash or you can sort on a random key and do it once and then plow through","zh":"你可以通过哈希或根据随机键排序，只需进行一次操作，然后遍历所有数据。","start":2846.19,"end":2851.15},{"id":243,"text":"all of your data. In fact, by default, PyTorch will often not sample from the data and just take","zh":"事实上，PyTorch 默认情况下通常不会从数据中进行采样，而是按照你获得数据的顺序来取批次。","start":2851.15,"end":2855.73},{"id":244,"text":"the batches in the order that","zh":"所以，一旦数据集非常大，这种分布的变化应该不会很大。","start":2855.73,"end":2856.83},{"id":245,"text":"you get it. So that once the data set is very, very large, the change in this distribution should not be very big. If I have a billion points and I shuffle them versus picking them up. Now, one other thing that people have observed, you don't have to know any of this. So please don't worry about it. But one other thing that people have observed, and this came from a paper that we wrote 10 years ago about this. It turns out, and lots of people observe this, not just us. If you do the random reshuffle, the model converges faster.","zh":"如果你有一十亿个数据点，无论是洗牌还是随机选取，这种变化都不会很大。现在，人们还观察到另一个现象，你不需要知道这些。所以请不要担心。但人们还观察到另一个现象，这来自我们十年前写的一篇关于这个问题的论文。结果发现，很多人观察到这一点，不仅仅是我们。如果你进行随机洗牌，模型会收敛得更快。","start":2856.98,"end":2885.12},{"id":246,"text":"And this is something that if you think about it intuitively, by show of hands, who knows what the coupon collector problem is? Oh, phew. All right. PyTorch, but not coupon collector. Interesting times. Anyway, that used to be like CS Canon. You had to know that. But I'll just say this has nothing to do with what I'm talking about. How many people know what a DFA is, an automata?","zh":"这是一点，如果你从直觉上思考，举手示意，谁知道“优惠券收集问题”是什么？哦，太好了。好吧。PyTorch，但不是优惠券收集问题。有趣的时代。不管怎样，这曾经是计算机科学的经典内容。你必须知道这一点。但我要说的是，这与我正在谈论的内容毫无关系。有多少人知道什么是DFA，什么是自动机？","start":2886.07,"end":2903.67},{"id":247,"text":"Oh, that's good. Good for us. All right. We're still doing it. All right. Anyway, back to this. So the point is, is when you did that shuffle, you had a kind of a coupon collector phenomenon. What happens in a coupon collector is let's say that I give you 10 coupons that you want to collect and you run around and you're randomly sampling. So you get a random sample every time. It turns out that all of your variants, how long it takes you is how long it takes to get the last coupon.","zh":"哦，这很好。对我们来说很好。好吧。我们还在继续。好吧。不管怎样，回到这个话题。要点是，当你进行洗牌时，你会经历一种优惠券收集现象。在优惠券收集中，假设我给你10张优惠券，你想要收集它们，然后你四处走动，随机采样。每次你都会得到一个随机样本。结果发现，所有变体中，你需要多长时间取决于你得到最后一张优惠券所需的时间。","start":2904.81,"end":2925.41},{"id":248,"text":"Why? Because if I'm sampling from all 10, I'm getting the first nine again and again, 90% odds when I get to the end. And so I only have a 10% odds of getting it when I get to that final one. Turns out that skews all the variance to the end. So back to these models.","zh":"为什么？因为如果我从全部10个样本中进行采样，我会反复得到前9个样本，当接近末尾时，我有90%的概率再次遇到它们。因此，当我到达最后一个样本时，只有10%的概率遇到它。结果是所有的方差都被集中在了末尾。所以回到这些模型上。","start":2925.94,"end":2939.02},{"id":249,"text":"If you're looking for something that's relatively rare in your data set, you're just not going to encounter it. You're going to encounter the mean a little bit too often, and you're not going to encounter the thing you want. So the folklore is that, and there's a bunch of math that says, under situations, the story I just told you is true. But not all situations. There are obvious counterexamples. Awesome. These are wonderful questions. Super happy to talk about this stuff. Please.","zh":"如果你在数据集中寻找一个相对罕见的事物，你根本不会遇到它。你会过于频繁地遇到平均值，而不会遇到你想要的那个事物。所以有句谚语说，而且有一系列数学理论表明，在某些情况下，我刚才讲的故事是正确的。但并非所有情况都是如此。存在明显的反例。太棒了，这些问题非常好。非常高兴能讨论这些内容。请继续。","start":2939.77,"end":2960.38}],"notes":["本段讨论了监督学习中的一些注意事项，包括如何处理复杂问题、符号表示的澄清以及采样方法（有放回与无放回）对模型训练的影响。讲者指出，虽然有放回和无放回采样在理论上可能没有显著差异，但无放回采样在实现上更简单，且PyTorch默认采用无放回采样。此外，讲者还提到随机重排数据可以加快模型收敛速度，但这一现象与‘优惠券收集问题’有关，即在数据集中某些元素出现频率较低时，可能会影响模型的训练效果。","讲者通过‘优惠券收集问题’来类比模型训练中的采样过程，指出在数据集中某些元素出现频率较低时，模型可能难以遇到这些元素，从而影响训练效果。这一现象在某些情况下成立，但并非所有情况都适用，存在明显的反例。","讲者强调，虽然采样方法对模型训练有一定影响，但实际应用中无需过度担忧，因为PyTorch等工具默认采用无放回采样，且随机重排数据可以加快模型收敛速度。此外，讲者还提到‘优惠券收集问题’在计算机科学中曾是经典问题，但如今已不再作为必修内容。","讲者通过提问的方式引导学生思考‘优惠券收集问题’和‘确定性有限自动机（DFA）’等概念，但指出这些内容与当前讨论的主题无关。这表明讲者在课堂上会适时引入相关知识，但不会偏离当前主题。","讲者在讨论中提到，当数据集中某些元素出现频率较低时，模型可能难以遇到这些元素，从而影响训练效果。这一现象在某些情况下成立，但并非所有情况都适用，存在明显的反例。因此，讲者强调需要根据具体情况判断采样方法的影响。","讲者在课堂上鼓励学生提问，并对学生的提问表示欢迎。这表明讲者重视学生的参与和互动，同时也展示了对教学内容的深入理解。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2785.95,"end":2960.38,"asr_flags":[],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":2785.95,"text":"complicated things it becomes tricky to guarantee please"},{"start":2796.97,"text":"exactly right yeah wonderful yeah so here this this H of theta should"},{"start":2800.85,"text":"actually be the theta T sorry if that's not clear I'll just write it in here so"},{"start":2804.51,"text":"wonderful observation. So the observation is which theta is talking about here and it's the"},{"start":2808.85,"text":"theta from the last step. That's just a notational bug. You got it exactly right."},{"start":2814.35,"text":"Other questions? Oh please, did you have a question?"},{"start":2827.25,"text":"Yeah, so the question is if you sample with versus without replacement, how does that change"},{"start":2831.87,"text":"change the situation. And it turns out that basically the moral of the story is we have"},{"start":2837.63,"text":"increasing theory and empirical evidence that it doesn't matter if you do the with replacement"},{"start":2841.45,"text":"versus without replacement. But without replacement is, in fact, a lot easier to implement. Because"},{"start":2846.19,"text":"what you can do is you can hash or you can sort on a random key and do it once and then plow through"},{"start":2851.15,"text":"all of your data. In fact, by default, PyTorch will often not sample from the data and just take"},{"start":2855.73,"text":"the batches in the order that"},{"start":2856.98,"text":"you get it. So that once the data set is very, very large, the change in this distribution should not be very big. If I have a billion points and I shuffle them versus picking them up. Now, one other thing that people have observed, you don't have to know any of this. So please don't worry about it. But one other thing that people have observed, and this came from a paper that we wrote 10 years ago about this. It turns out, and lots of people observe this, not just us. If you do the random reshuffle, the model converges faster."},{"start":2886.07,"text":"And this is something that if you think about it intuitively, by show of hands, who knows what the coupon collector problem is? Oh, phew. All right. PyTorch, but not coupon collector. Interesting times. Anyway, that used to be like CS Canon. You had to know that. But I'll just say this has nothing to do with what I'm talking about. How many people know what a DFA is, an automata?"},{"start":2904.81,"text":"Oh, that's good. Good for us. All right. We're still doing it. All right. Anyway, back to this. So the point is, is when you did that shuffle, you had a kind of a coupon collector phenomenon. What happens in a coupon collector is let's say that I give you 10 coupons that you want to collect and you run around and you're randomly sampling. So you get a random sample every time. It turns out that all of your variants, how long it takes you is how long it takes to get the last coupon."},{"start":2925.94,"text":"Why? Because if I'm sampling from all 10, I'm getting the first nine again and again, 90% odds when I get to the end. And so I only have a 10% odds of getting it when I get to that final one. Turns out that skews all the variance to the end. So back to these models."},{"start":2939.77,"text":"If you're looking for something that's relatively rare in your data set, you're just not going to encounter it. You're going to encounter the mean a little bit too often, and you're not going to encounter the thing you want. So the folklore is that, and there's a bunch of math that says, under situations, the story I just told you is true. But not all situations. There are obvious counterexamples. Awesome. These are wonderful questions. Super happy to talk about this stuff. Please."}],"speech_gaps":[{"start":2790.224,"end":2796.57}],"frame":"../frames/v049/017.webp","frame_time":2797.95},{"title":"监督学习中的批量大小选择","segments":[{"id":250,"text":"Batch size. Sometimes we just say this is how much GPU I have, this is what my batch size will be. Is there some scientific way to say I should have a batch size of 1 or 10 or 12? Oh, wonderful question. So the question is about batch size and how do you pick it.","zh":"批量大小。有时候我们只是说，这取决于我有多少GPU，这就是我的批量大小。有没有什么科学的方法可以说我应该选择批量大小为1、10或12呢？哦，这是一个非常好的问题。这个问题是关于批量大小的，你是如何选择它的。","start":2962.15,"end":2976.51},{"id":251,"text":"So I'm going to tell you something. So a couple of things. So there's a couple of heuristics that people have, but I want to tell you as a personal matter, batch size was actually one of the things that broke me intellectually in a while ago. So there was a while when, I would say about 15 years ago, when what we thought was that smaller batch sizes were better because they were exploring the data more. You can tell yourself a story about why this is better. And from an optimization perspective, you can prove that in many situations, a tiny batch size is just as good as a big batch size. And so you want...","zh":"我要告诉你一些事情。有一些人们常用的启发式方法，但我想以个人的角度告诉你，批量大小曾经是我理解上的一个突破点。大约15年前，我们认为较小的批量大小更好，因为它们能更充分地探索数据。你可以为自己编造一个理由来说明为什么这更好。从优化的角度来看，你可以在许多情况下证明，极小的批量大小和极大的批量大小效果几乎一样好。因此，你想要……","start":2976.95,"end":3006.37},{"id":252,"text":"to run in these tiny batch sizes then there was a paper that came out of when it was facebook the facebook labs that basically showed this really interesting thing that was done by friends and they sent me as a pre-print that said we're getting better generalization i'll explain what i mean in a second by using larger batches now this","zh":"运行在这些极小的批量大小上，但有一篇论文来自Facebook实验室，他们展示了这样一个非常有趣的现象，是由我的朋友完成的，他们将这篇预印本论文寄给了我，论文中说我们现在使用更大的批量大小可以获得更好的泛化能力。我稍后会解释我是什么意思。","start":3006.38,"end":3022.2},{"id":253,"text":"was very strange. Their loss was worse, their training set was worse, but they were generalizing better to the real world. Now, as a mathematical or an optimization person, at first, I was like, this is heresy. As I just told you, we assume that the training sets have this statistical relationship, so doing better on the training set should always mean doing better on the test set. But in this paper, they showed that wasn't the case all the time. And that's one of the things, the reason I tell you this story is, first, it was like, personally, as I was working on this, it changed the mathematics of it.","zh":"这看起来非常奇怪。他们的损失函数表现更差，训练集的表现也更差，但他们却在现实世界中泛化得更好。作为一个数学或优化研究者，起初我对此感到震惊。正如我刚才告诉你的，我们假设训练集具有这种统计关系，因此在训练集上表现更好应该总是意味着在测试集上表现更好。但在这篇论文中，他们展示了这种情况并非总是成立。这也是我告诉你这个故事的原因，首先，当我正在研究这个问题时，这改变了我对它的数学理解。","start":3022.71,"end":3050.71},{"id":254,"text":"The second piece of it, as we went through it, was basically the batch size we don't fully understand. And so the convention now, we have this idea that larger batches are better because they have lower variance. They're a better estimate. And so the practice that you just mentioned, how do you pitch the batch size? How big is your GPU memory, right? You have this much HBM, you have this much batch size. That's basically what people do for systems reasons.","zh":"我们在讨论的第二部分，基本上是我们对批量大小的理解仍然不完全。因此，现在有一种惯例，我们认为更大的批量更好，因为它们的方差更低。它们是更好的估计。你刚才提到的实践，如何确定批量大小？你的GPU内存有多大，对吧？你有这么多HBM，你有这么多批量大小。基本上，人们就是这样出于系统原因来做的。","start":3051.19,"end":3076.22},{"id":255,"text":"But the theory of how and why this works and the fact that optimization is a leaky abstraction is really interesting. And it should have been more interesting. I didn't recognize this when I first saw it. But it was a really important theoretical moment for me because what it revealed to me is... Remember when I was telling you, machine learning is not stats. I think we're still co-listed with stats. No offense to statisticians. I love you very much. Some of my best friends are statisticians. But...","zh":"但关于为什么以及如何起作用的理论，以及优化是一个有缺陷的抽象概念，这真的很有趣。它本应更加有趣。我第一次看到它时没有意识到这一点。但对我而言，这是一个非常重要的理论时刻，因为它向我揭示了……还记得我告诉过你，机器学习并不是统计学。我认为我们仍然与统计学并列。对统计学家没有冒犯之意。我非常喜爱你们。我最好的朋友中有一些是统计学家。但是……","start":3077.1,"end":3099.0},{"id":256,"text":"Machine learning is not stats. And one of the things is, is statistics, as I mentioned, is very interested in when the optimization problem recovers the right answer. And as I told you, machine learning people are not interested in that. And so the fact that you have a model that doesn't get the right answer with this batch size change.","zh":"机器学习并不是统计学。其中一件事是，统计学，正如我所提到的，非常关注优化问题能否恢复正确的答案。而正如我告诉过你的，机器学习人员并不关心这一点。因此，你有一个模型，当批量大小改变时，无法得到正确的答案。","start":3099.74,"end":3113.7},{"id":257,"text":"right answer, the lower loss, the minimum loss, but generalize is better. We're going to throw away all the theory and try and figure out what's happening there. And so now your heuristic is the right one. Set the batch size according to what you can do. And there's a little bit of tuning that people do underneath the covers about how they set their batches. It's a little bit folklore, if I'm honest. I can tell you the tricks. I have mine. Other people have theirs. I'm not super sure. Great question. Please.","zh":"正确的答案，较低的损失，最小的损失，但泛化能力更好。我们将抛开所有理论，尝试弄清楚那里发生了什么。因此，你现在采用的启发式方法是正确的。根据你能做到的来设置批量大小。人们在幕后会做一些微调，关于如何设置他们的批量大小。老实说，这有点像民间传说。我可以告诉你一些技巧。我有自己的方法。其他人也有他们的方法。我不太确定。非常好的问题。请。","start":3114.26,"end":3138.64}],"notes":["本段讨论了监督学习中批量大小（batch size）的选择问题。讲者提到，批量大小的选择没有明确的科学方法，通常取决于硬件资源，如GPU内存。然而，讲者指出，过去人们认为较小的批量大小更好，因为它能更充分地探索数据，但后来有研究发现，较大的批量大小反而能带来更好的泛化能力，尽管训练损失可能更高。这挑战了传统上认为训练损失与测试损失正相关的假设。","讲者提到，这一发现改变了他对机器学习和统计学之间关系的理解。他指出，统计学关注的是优化问题能否恢复正确的答案，而机器学习更关注模型的泛化能力，即使损失函数没有达到最小值。这表明，机器学习和统计学在目标和方法上存在差异。","讲者强调，批量大小的选择更多是基于系统原因（如硬件限制），而不是严格的理论依据。虽然有一些经验法则，但这些方法更多是基于实践的调整，而非严格的数学证明。","讲者提到，优化过程是一个不完美的抽象（leaky abstraction），这意味着优化方法的理论和实际效果之间可能存在差异。这一观点对理解机器学习的理论基础和实践应用具有重要意义。","讲者还提到，他与统计学家有良好的关系，但认为机器学习和统计学在目标上有所不同。统计学更关注模型能否找到正确的解，而机器学习更关注模型在实际应用中的泛化能力。","最后，讲者总结说，批量大小的选择应基于实际可行性和系统限制，而不是严格的理论依据。尽管存在一些经验法则，但这些方法更多是基于实践的调整，而非严格的数学证明。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2962.15,"end":3138.64,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2962.15,"text":"Batch size. Sometimes we just say this is how much GPU I have, this is what my batch size will be. Is there some scientific way to say I should have a batch size of 1 or 10 or 12? Oh, wonderful question. So the question is about batch size and how do you pick it."},{"start":2976.95,"text":"So I'm going to tell you something. So a couple of things. So there's a couple of heuristics that people have, but I want to tell you as a personal matter, batch size was actually one of the things that broke me intellectually in a while ago. So there was a while when, I would say about 15 years ago, when what we thought was that smaller batch sizes were better because they were exploring the data more. You can tell yourself a story about why this is better. And from an optimization perspective, you can prove that in many situations, a tiny batch size is just as good as a big batch size. And so you want..."},{"start":3006.38,"text":"to run in these tiny batch sizes then there was a paper that came out of when it was facebook the facebook labs that basically showed this really interesting thing that was done by friends and they sent me as a pre-print that said we're getting better generalization i'll explain what i mean in a second by using larger batches now this"},{"start":3022.71,"text":"was very strange. Their loss was worse, their training set was worse, but they were generalizing better to the real world. Now, as a mathematical or an optimization person, at first, I was like, this is heresy. As I just told you, we assume that the training sets have this statistical relationship, so doing better on the training set should always mean doing better on the test set. But in this paper, they showed that wasn't the case all the time. And that's one of the things, the reason I tell you this story is, first, it was like, personally, as I was working on this, it changed the mathematics of it."},{"start":3051.19,"text":"The second piece of it, as we went through it, was basically the batch size we don't fully understand. And so the convention now, we have this idea that larger batches are better because they have lower variance. They're a better estimate. And so the practice that you just mentioned, how do you pitch the batch size? How big is your GPU memory, right? You have this much HBM, you have this much batch size. That's basically what people do for systems reasons."},{"start":3077.1,"text":"But the theory of how and why this works and the fact that optimization is a leaky abstraction is really interesting. And it should have been more interesting. I didn't recognize this when I first saw it. But it was a really important theoretical moment for me because what it revealed to me is... Remember when I was telling you, machine learning is not stats. I think we're still co-listed with stats. No offense to statisticians. I love you very much. Some of my best friends are statisticians. But..."},{"start":3099.74,"text":"Machine learning is not stats. And one of the things is, is statistics, as I mentioned, is very interested in when the optimization problem recovers the right answer. And as I told you, machine learning people are not interested in that. And so the fact that you have a model that doesn't get the right answer with this batch size change."},{"start":3114.26,"text":"right answer, the lower loss, the minimum loss, but generalize is better. We're going to throw away all the theory and try and figure out what's happening there. And so now your heuristic is the right one. Set the batch size according to what you can do. And there's a little bit of tuning that people do underneath the covers about how they set their batches. It's a little bit folklore, if I'm honest. I can tell you the tricks. I have mine. Other people have theirs. I'm not super sure. Great question. Please."}],"speech_gaps":[],"frame":"../frames/v049/018.webp","frame_time":2974.15},{"title":"监督学习中的批量大小与数据采样","segments":[{"id":258,"text":"I'd say it's potentially be better because... Oh, great question. Because when we examine people like cats and dogs, wouldn't you end up with, if you have smaller batches, wouldn't you have much more extreme, non-comportable... Yeah, yeah, wonderful question.","zh":"我认为这可能更好，因为……噢，非常好的问题。当我们研究像猫和狗这样的例子时，如果你使用较小的批量，你是否会最终得到更加极端、不一致的……是的，是的，非常好的问题。","start":3140.3,"end":3154.72},{"id":259,"text":"yeah so the question is why would why did you fools ever think that low small batch sizes were going to work uh it was obvious the whole time you were wrong probably but the reason you would think a small batch size would help is a bit a little bit of a calculation which is actually in the slides in the appendix which shows that imagine a situation where i have a data set that contains a lot of redundancy okay if it contains a lot of redundancy and i look at a whole batch","zh":"是的，问题是为什么你们会认为小批量尺寸会有效？你们之前怎么会这么想的？这一直很明显，你们可能一直都是错的。但你们会认为小批量尺寸会有帮助的原因是一个小小的计算，这个计算实际上在幻灯片的附录中有所展示，它显示了想象一个情况，我有一个数据集，其中包含大量冗余。如果它包含大量冗余，当我查看一个完整的批量时，","start":3155.27,"end":3177.91},{"id":260,"text":"then I'm basically seeing the same example. You know, it's just like 90 pictures of the same cat again and again and again, right? And so I've wasted all those steps. I could have been using those 90 cats to refine the model 90 times. So really what it's a trade-off is how statistically meaningful is the data sample that you're seeing versus how big of a step should you take? So it's not an obvious trade-off either direction. The heuristic of why smaller was better was that you were able to polish the model, that more parameter updates were better than what you were doing.","zh":"那么我基本上是在看到同样的例子。你知道的，就像一遍又一遍地重复90张同一张猫的图片。所以，我浪费了所有这些步骤。我本可以用这90张猫的图片来改进模型90次。因此，真正需要权衡的是你看到的数据样本在统计上有多有意义，以及你应该采取多大的步骤。因此，这也不是一个明显的权衡，无论哪个方向都未必明显。认为较小批量尺寸更好的启发式方法是，你能够对模型进行微调，更多的参数更新比你正在做的事情更好。","start":3178.47,"end":3207.15},{"id":261,"text":"probably true if you have small classes or a relatively compact domain where you have two classes and they're well-established and separated. In those situations, this redundancy argument is actually provable. SGD with small batches will do better. And so that gave us false confidence that that was explaining the whole world.","zh":"这可能在你有小类别或相对紧凑的领域时是正确的，比如你有两个类别且它们被很好地建立和区分的情况。在这些情况下，这种冗余论点实际上是可证明的。使用小批量的随机梯度下降（SGD）会表现得更好。因此，这给了我们一种虚假的信心，认为这能解释整个世界。","start":3207.82,"end":3226.26},{"id":262,"text":"When we move to more interesting examples,","zh":"当我们转向更有趣的例子时，","start":3226.84,"end":3228.3},{"id":263,"text":"larger batch sizes started to work better and better and better.","zh":"更大的批量尺寸开始表现得越来越好，越来越好。","start":3228.58,"end":3231.32},{"id":264,"text":"The other thing that happened is the way we treat the batches,","zh":"另一件事是，我们对待批量的方式，","start":3231.68,"end":3234.56},{"id":265,"text":"as you'll see in the second half of the course,","zh":"如你将在课程的后半部分所见，","start":3234.56,"end":3236.08},{"id":266,"text":"we also want to embed information in them.","zh":"我们还想在其中嵌入信息。","start":3236.24,"end":3238.28},{"id":267,"text":"When we get to other concerns about how you supervise your data,","zh":"当我们谈到如何监督你的数据的其他问题时，","start":3238.48,"end":3241.74},{"id":268,"text":"it's interesting to have a mix of, say, positive and negatives.","zh":"混合一些正样本和负样本是很有趣的。","start":3241.92,"end":3244.76},{"id":269,"text":"Exactly as you said,","zh":"正如你所说的，","start":3244.88,"end":3245.84},{"id":270,"text":"I want every batch to have a couple of cats and a couple of dogs,","zh":"我希望每个批次都包含几只猫和几只狗，","start":3246.0,"end":3248.56},{"id":271,"text":"and ideally, I'd like them to be close together intuitively.","zh":"理想情况下，我希望它们在直觉上彼此接近。","start":3248.68,"end":3251.36},{"id":272,"text":"I don't want a dog like a Great Dane and some little tiny cat.","zh":"我不希望有一只像大丹犬这样的狗和一些小而矮的小猫。","start":3251.78,"end":3255.08},{"id":273,"text":"I kind of want the most cat-like looking dog I can get to help me separate them.","zh":"我想尽可能找到最像猫的狗来帮助我区分它们。","start":3255.08,"end":3259.38},{"id":274,"text":"I'll learn the most interesting information.","zh":"我会学到最有趣的信息。","start":3259.44,"end":3260.66},{"id":275,"text":"We'll talk about that in that course.","zh":"我们会在那门课上讨论这个。","start":3261.04,"end":3262.38},{"id":276,"text":"But you're getting, you guys have got this exactly right.","zh":"但你们已经完全理解了，你们搞得很对。","start":3262.5,"end":3264.74},{"id":277,"text":"What are the key issues underneath the batch?","zh":"在批量背后有哪些关键问题？","start":3264.9,"end":3267.16},{"id":278,"text":"Please.","zh":"请。","start":3267.28,"end":3267.5},{"id":279,"text":"Awesome.","zh":"太棒了。","start":3271.84,"end":3272.24},{"id":280,"text":"Yeah, great question.","zh":"是的，非常好的问题。","start":3274.78,"end":3275.54},{"id":281,"text":"So in the way that we'll teach the traditional stochastic gradient descent,","zh":"所以我们会以传统随机梯度下降的方式进行教学，","start":3275.66,"end":3279.56},{"id":282,"text":"it is completely random sampling.","zh":"这是完全的随机抽样。","start":3279.82,"end":3281.64},{"id":283,"text":"With replacement sampling, you take it and you pull it up.","zh":"有放回抽样时，你取出它并把它提上来。","start":3281.7,"end":3284.26},{"id":284,"text":"What I'm trying to emphasize from some of this discussion","zh":"我想从一些讨论中强调的是","start":3284.26,"end":3286.3},{"id":285,"text":"is, in practice, it's actually not really done that way.","zh":"实际上在实践中并不是这样进行的。","start":3286.3,"end":3288.78},{"id":286,"text":"Sometimes it's done with this sort that I mentioned,","zh":"有时它是这样进行的，正如我之前提到的，","start":3288.94,"end":3290.88},{"id":287,"text":"where you sort it in a random order.","zh":"你将其以随机顺序排列。","start":3290.92,"end":3292.2},{"id":288,"text":"We talked about how to cut down on variance.","zh":"我们讨论过如何减少方差。","start":3292.34,"end":3293.74},{"id":289,"text":"And then what I was just saying is","zh":"然后我刚才说的是","start":3294.02,"end":3295.3},{"id":290,"text":"that some objective functions, some loss functions,","zh":"有些目标函数，有些损失函数，","start":3295.3,"end":3297.26},{"id":291,"text":"actually prefer that you have kind of near-miss examples","zh":"实际上更倾向于你拥有彼此接近的近似样本","start":3297.38,"end":3300.14},{"id":292,"text":"to each other, which is also quite intuitive.","zh":"，这也很直观。","start":3300.14,"end":3302.18},{"id":293,"text":"And so people do engineer their batches.","zh":"因此，人们会设计他们的批次。","start":3302.42,"end":3304.6},{"id":294,"text":"And then the last piece is, you do","zh":"然后最后一部分是，你","start":3304.66,"end":3306.24},{"id":295,"text":"pick the batches in modern applications","zh":"在现代应用中根据批次的速度来选择","start":3306.24,"end":3307.94},{"id":296,"text":"based on how fast they are.","zh":"批次。","start":3308.5,"end":3309.38}],"notes":["本段讨论了监督学习中批量大小对模型训练的影响。讲者指出，小批量大小在某些情况下可能更有效，因为它能提供更丰富的数据样本，但同时也可能引入冗余，导致训练效率低下。在数据集具有大量冗余的情况下，小批量可能无法有效利用数据，而大批次则能更高效地更新模型参数。","讲者提到，当数据集中的类别较少或分布较为紧凑时，小批量的冗余问题可能被证明是有效的。然而，这种优势并不适用于所有情况，特别是在更复杂的例子中，大批次可能表现更好。","在实际应用中，批量的处理方式并非完全随机采样，而是可能通过排序或其他方式来优化数据分布。讲者强调，这种做法有助于减少方差并提高模型的学习效果。","讲者还提到，某些损失函数可能更倾向于包含接近的样本，以帮助模型更好地学习区分不同类别。因此，工程师会根据具体需求设计批次，以优化模型性能。","最后，讲者指出，在现代应用中，批量的选择通常基于计算速度，这表明实际应用中需要在模型性能和计算效率之间进行权衡。","整体来看，本段内容强调了批量大小对模型训练的影响，以及如何通过合理设计批次来优化学习效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3140.3,"end":3309.38,"asr_flags":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":3140.3,"text":"I'd say it's potentially be better because... Oh, great question. Because when we examine people like cats and dogs, wouldn't you end up with, if you have smaller batches, wouldn't you have much more extreme, non-comportable... Yeah, yeah, wonderful question."},{"start":3155.27,"text":"yeah so the question is why would why did you fools ever think that low small batch sizes were going to work uh it was obvious the whole time you were wrong probably but the reason you would think a small batch size would help is a bit a little bit of a calculation which is actually in the slides in the appendix which shows that imagine a situation where i have a data set that contains a lot of redundancy okay if it contains a lot of redundancy and i look at a whole batch"},{"start":3178.47,"text":"then I'm basically seeing the same example. You know, it's just like 90 pictures of the same cat again and again and again, right? And so I've wasted all those steps. I could have been using those 90 cats to refine the model 90 times. So really what it's a trade-off is how statistically meaningful is the data sample that you're seeing versus how big of a step should you take? So it's not an obvious trade-off either direction. The heuristic of why smaller was better was that you were able to polish the model, that more parameter updates were better than what you were doing."},{"start":3207.82,"text":"probably true if you have small classes or a relatively compact domain where you have two classes and they're well-established and separated. In those situations, this redundancy argument is actually provable. SGD with small batches will do better. And so that gave us false confidence that that was explaining the whole world."},{"start":3226.84,"text":"When we move to more interesting examples,"},{"start":3228.58,"text":"larger batch sizes started to work better and better and better."},{"start":3231.68,"text":"The other thing that happened is the way we treat the batches,"},{"start":3234.56,"text":"as you'll see in the second half of the course,"},{"start":3236.24,"text":"we also want to embed information in them."},{"start":3238.48,"text":"When we get to other concerns about how you supervise your data,"},{"start":3241.92,"text":"it's interesting to have a mix of, say, positive and negatives."},{"start":3244.88,"text":"Exactly as you said,"},{"start":3246.0,"text":"I want every batch to have a couple of cats and a couple of dogs,"},{"start":3248.68,"text":"and ideally, I'd like them to be close together intuitively."},{"start":3251.78,"text":"I don't want a dog like a Great Dane and some little tiny cat."},{"start":3255.08,"text":"I kind of want the most cat-like looking dog I can get to help me separate them."},{"start":3259.44,"text":"I'll learn the most interesting information."},{"start":3261.04,"text":"We'll talk about that in that course."},{"start":3262.5,"text":"But you're getting, you guys have got this exactly right."},{"start":3264.9,"text":"What are the key issues underneath the batch?"},{"start":3267.28,"text":"Please."},{"start":3271.84,"text":"Awesome."},{"start":3274.78,"text":"Yeah, great question."},{"start":3275.66,"text":"So in the way that we'll teach the traditional stochastic gradient descent,"},{"start":3279.82,"text":"it is completely random sampling."},{"start":3281.7,"text":"With replacement sampling, you take it and you pull it up."},{"start":3284.26,"text":"What I'm trying to emphasize from some of this discussion"},{"start":3286.3,"text":"is, in practice, it's actually not really done that way."},{"start":3288.94,"text":"Sometimes it's done with this sort that I mentioned,"},{"start":3290.92,"text":"where you sort it in a random order."},{"start":3292.34,"text":"We talked about how to cut down on variance."},{"start":3294.02,"text":"And then what I was just saying is"},{"start":3295.3,"text":"that some objective functions, some loss functions,"},{"start":3297.38,"text":"actually prefer that you have kind of near-miss examples"},{"start":3300.14,"text":"to each other, which is also quite intuitive."},{"start":3302.42,"text":"And so people do engineer their batches."},{"start":3304.66,"text":"And then the last piece is, you do"},{"start":3306.24,"text":"pick the batches in modern applications"},{"start":3308.5,"text":"based on how fast they are."}],"speech_gaps":[{"start":3268.56,"end":3271.44},{"start":3272.64,"end":3274.38}],"frame":"../frames/v049/019.webp","frame_time":3152.3},{"title":"监督学习设定中的批量处理与优化","segments":[{"id":297,"text":"run, as I was talking about in the HBM case. If you haven't optimized the GPU, if you can store your whole model or your whole computation in the HBM, the memory that's on the chip, it's just dramatically faster. And so you optimize for systems concerns. So this very small tweak here that looks like a one-line change of going from N to B, basically, that change","zh":"正如我在HBM情况中谈到的那样，如果你没有优化GPU，如果你能够将整个模型或整个计算存储在HBM中，也就是芯片上的内存，那么这会快得多。因此，你应优化系统层面的考虑。所以，这里这个看起来像是将N改为B的一行小改动，实际上在工程实践中，我所说的这一点是非常丰富的。从课程的角度来看，我认为你们不需要了解我刚才描述的内容，你们只需要说，哦，是的，你的随机样本。这已经足够好了。但我想让你们明白，这些内容实际上相当有趣且易于理解。现在，有人正在某个前沿实验室里调整批量大小，尽管这样说听起来很奇怪。他们赚了很多钱，这很好。我希望他们是我以前的学生。总之，好了。","start":3309.45,"end":3330.33},{"id":298,"text":"is actually, in engineering and practice, I'm trying to say, is quite rich. For the point of view of the course, I think you have to know nothing of what I just described, by the way. You just need to say, oh, yeah, your random sample. That's good enough. But I wanted you to understand this stuff is actually fairly interesting and fairly accessible. There's someone right now at one of the frontier labs who's tuning the batch size, as weird as that is to say. And they're getting paid a lot of money, which is great. I hope they're one of my former students. Anyway, all right.","zh":"所以，这就是这里的定义。我们取批量并对其进行平均。我只是说，选择B的这个规则，即随机抽样，已经足够好。你们在课程的大部分时间里都会这样做。但事实上，这实际上是一种统计假设。如果你真的关心其中发生了什么，这只是一个有趣的问题。而且，有一些知识需要了解。如果你是一个好奇的人，有一些知识值得去了解。非常好的问题。这些真的很好。好了。好了。","start":3330.95,"end":3353.37},{"id":299,"text":"So this is the definition right here. We take the batch and we average it. And I'm just saying that that rule to select the B, random sampling is good enough. You'll do that for most of the course. But it is actually like making a statistical assumption. And if you really care about what's going on there, it's just an interesting thing. And there's stuff to know. If you're a curious person, there's stuff to know. Wonderful questions. These are really great. All right. All right.","zh":"所以，希望这已经很清楚了。我说过这一点。我应该更早地转到这张幻灯片上。抱歉。在这里，我想指出一点，即你将对批量进行求和，也就是这个小批量。通常情况下，b会小于完整的数据集。你用当前的theta计算每个样本的误差，这一点已经指出。这应该是theta t。","start":3353.9,"end":3384.39},{"id":300,"text":"So hopefully, this is clear. I said this. I should have gone to this slide earlier. Sorry. Here, I would point out one thing, which is you're going to sum over the batch, that mini batch. So b is usually less than the full data set. You compute the errors on each one with your current theta, which was pointed out. This should be theta t.","zh":"然后你只需进行更新。重点是你不需要查看数据集的其余部分。你只需查看模型和数据集，即从批量中抽取的数据样本。然后你将采取这一步长，我在这里强调这是alpha b，因为这可能是不同的步长。","start":3384.95,"end":3401.73},{"id":301,"text":"You then just do the updates. The point is you don't have to look at the rest of the dataset. You just look at the model and the dataset, your data samples from the batch. Then you're going to take this step size, and I'm highlighting here that it's an alpha b, and that's because it's potentially a different step size.","zh":"你然后只需进行更新。重点是你不需要查看数据集的其余部分。你只需查看模型和数据集，即从批量中抽取的数据样本。然后你将采取这一步长，我在这里强调这是alpha b，因为这可能是不同的步长。","start":3402.9,"end":3417.18},{"id":302,"text":"You're not going to use the same step size that you would use on the full data set. And in fact, the step size kind of mysteriously depends on other quantities that are there. We'll talk about good rules of thumb. In fact, one of the major pieces of technology that you probably use and so many of you have used step size are basically what are called adaptive optimizers that pick the step size for you within range. They see that you're having some of these problems. Adam, for example, if you know what Adam is, or Adam W.","zh":"你不会使用与完整数据集上相同的步长。事实上，步长在某种程度上依赖于其他存在的量。我们会讨论一些好的经验法则。事实上，你可能已经使用过，而且很多人已经使用过的步长选择技术，基本上被称为自适应优化器，它们会在一定范围内为你选择步长。它们会察觉到你遇到的一些问题。例如，如果你知道Adam，或者Adam W。","start":3417.84,"end":3443.14},{"id":303,"text":"or AttaGrad, which was developed by our own John Ducci. Those are the kinds of things that go on","zh":"或者AttaGrad，这是由我们自己的John Ducci开发的。这些就是背后发生的事情。","start":3445.19,"end":3450.89},{"id":304,"text":"under the covers. But for now, when we're studying in its purest setting, like if you wanted to do it","zh":"但目前，当我们研究其最纯粹的设定时，比如如果你想用代码实现并写出它，你将不得不选择这个alpha b。","start":3450.89,"end":3454.67},{"id":305,"text":"with code and write it out, you would have to pick that alpha b. And that's what goes on.","zh":"这就是所发生的事情。","start":3454.67,"end":3459.85},{"id":306,"text":"Any other questions there? Oh, please.","zh":"还有其他问题吗？哦，请问。","start":3460.03,"end":3464.11},{"id":307,"text":"Oh yeah, sorry that this wasn't clear. Yeah, so the operation that you're doing here,","zh":"哦，是的，抱歉刚才不清楚。是的，你在这里进行的操作，","start":3468.13,"end":3472.11},{"id":308,"text":"sorry this is unclear is you're going to pick a random batch on each iteration so at every time","zh":"抱歉不清楚的是，你将在每次迭代中选择一个随机批次，所以在每个时间步t，你会选择一个新的随机批次，好吧，你不希望每次都将同样的狗和猫都输入进去","start":3472.11,"end":3476.87},{"id":309,"text":"step t you pick a new random batch okay you don't want to feed the same dogs and cats through every","zh":"通过每一个","start":3476.87,"end":3482.45},{"id":310,"text":"single time or houses through every time because you'll just learn a model of the data that you've","zh":"单次处理或每次处理所有房屋，因为你会仅仅学习你所拥有的数据的模型","start":3482.45,"end":3486.15}],"notes":["本段主要讲解监督学习中批量处理（batch processing）的概念，强调在训练过程中使用随机批量数据进行模型更新。讲者指出，批量处理不仅是一种计算优化手段，还涉及统计假设，即通过随机采样来近似整体数据集的分布。"],"formulas":[],"uncertainties":["step size kind of mysteriously depends on other quantities that are there","alpha b"],"diagram":"none","start":3309.45,"end":3486.15,"asr_flags":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":3309.45,"text":"run, as I was talking about in the HBM case. If you haven't optimized the GPU, if you can store your whole model or your whole computation in the HBM, the memory that's on the chip, it's just dramatically faster. And so you optimize for systems concerns. So this very small tweak here that looks like a one-line change of going from N to B, basically, that change"},{"start":3330.95,"text":"is actually, in engineering and practice, I'm trying to say, is quite rich. For the point of view of the course, I think you have to know nothing of what I just described, by the way. You just need to say, oh, yeah, your random sample. That's good enough. But I wanted you to understand this stuff is actually fairly interesting and fairly accessible. There's someone right now at one of the frontier labs who's tuning the batch size, as weird as that is to say. And they're getting paid a lot of money, which is great. I hope they're one of my former students. Anyway, all right."},{"start":3353.9,"text":"So this is the definition right here. We take the batch and we average it. And I'm just saying that that rule to select the B, random sampling is good enough. You'll do that for most of the course. But it is actually like making a statistical assumption. And if you really care about what's going on there, it's just an interesting thing. And there's stuff to know. If you're a curious person, there's stuff to know. Wonderful questions. These are really great. All right. All right."},{"start":3384.95,"text":"So hopefully, this is clear. I said this. I should have gone to this slide earlier. Sorry. Here, I would point out one thing, which is you're going to sum over the batch, that mini batch. So b is usually less than the full data set. You compute the errors on each one with your current theta, which was pointed out. This should be theta t."},{"start":3402.9,"text":"You then just do the updates. The point is you don't have to look at the rest of the dataset. You just look at the model and the dataset, your data samples from the batch. Then you're going to take this step size, and I'm highlighting here that it's an alpha b, and that's because it's potentially a different step size."},{"start":3417.84,"text":"You're not going to use the same step size that you would use on the full data set. And in fact, the step size kind of mysteriously depends on other quantities that are there. We'll talk about good rules of thumb. In fact, one of the major pieces of technology that you probably use and so many of you have used step size are basically what are called adaptive optimizers that pick the step size for you within range. They see that you're having some of these problems. Adam, for example, if you know what Adam is, or Adam W."},{"start":3445.19,"text":"or AttaGrad, which was developed by our own John Ducci. Those are the kinds of things that go on"},{"start":3450.89,"text":"under the covers. But for now, when we're studying in its purest setting, like if you wanted to do it"},{"start":3454.67,"text":"with code and write it out, you would have to pick that alpha b. And that's what goes on."},{"start":3460.03,"text":"Any other questions there? Oh, please."},{"start":3468.13,"text":"Oh yeah, sorry that this wasn't clear. Yeah, so the operation that you're doing here,"},{"start":3472.11,"text":"sorry this is unclear is you're going to pick a random batch on each iteration so at every time"},{"start":3476.87,"text":"step t you pick a new random batch okay you don't want to feed the same dogs and cats through every"},{"start":3482.45,"text":"single time or houses through every time because you'll just learn a model of the data that you've"}],"speech_gaps":[{"start":3464.51,"end":3467.73}],"frame":"../frames/v049/020.webp","frame_time":3321.45},{"title":"监督学习设定中的批量大小与采样方法","segments":[{"id":311,"text":"seen so it is a random sampling procedure yeah wonderful question and clarification please","zh":"已经看到了，所以这是一个随机采样过程，是的，非常好的问题和澄清，请","start":3486.15,"end":3490.91},{"id":312,"text":"Yeah, that's a wonderful question. So how the batch size scales, you would indeed expect","zh":"是的，这是一个非常好的问题。因此，批量大小的缩放，你确实会期望","start":3498.17,"end":3503.55},{"id":313,"text":"that as you ramp up the batch size, right? When you go all the way from one to the limit,","zh":"当批量大小从1增加到极限时，你会得到一个批量大小为1/N。你很少将1/N作为SGD的批量大小使用","start":3503.55,"end":3508.63},{"id":314,"text":"you're going to get to a batch size of one over N. You very rarely use one over N as your SGD","zh":"事实上，出于一些常识性原因，很多人在编写模型时，不仅限于线性模型，都会编写模型，使得它们在所有模型中具有相同的归一化和批量大小","start":3508.75,"end":3513.19},{"id":315,"text":"batch size. It turns out for like folklore reasons that lots of people write their models,","zh":"因此，这就是你做的一件事。","start":3513.19,"end":3518.59},{"id":316,"text":"models, not linear models, but write their models so that there's the same kind of normalization","zh":"模型，不是线性模型，但要将它们的模型写成相同类型的归一化形式","start":3518.59,"end":3522.59},{"id":317,"text":"and batch size across all of them.","zh":"并在所有模型中使用相同的批量大小。","start":3522.59,"end":3524.11},{"id":318,"text":"And so that is like a thing that you do.","zh":"因此，这是你应当做的一件事。","start":3524.31,"end":3526.41},{"id":319,"text":"So if you've played with deep learning things and use like layer norms or sandwich norms","zh":"所以如果你玩过深度学习的东西，比如使用了层归一化或夹心归一化等方法","start":3526.51,"end":3530.05},{"id":320,"text":"or other things, they're trying to get you in the right regime where like the step sizes","zh":"或者其他类似的东西，它们试图让你进入一个合适的领域，其中步长","start":3530.05,"end":3533.61},{"id":321,"text":"are kind of all what's called fancy word is isotropic, but kind of all the dimensions","zh":"大致上被称为各向同性，但所有维度","start":3533.61,"end":3537.19},{"id":322,"text":"are the same.","zh":"都差不多。","start":3537.19,"end":3537.69},{"id":323,"text":"So what does that mean?","zh":"那么这意味着什么？","start":3537.93,"end":3538.81},{"id":324,"text":"For alpha, that means you would intuitively expect that if the model is taking a little","zh":"对于α，这意味着你直觉上会预期，如果模型采取的步长很小","start":3539.01,"end":3545.31},{"id":325,"text":"you don't trust it very much and alpha would be lower almost exactly as you said","zh":"你不太信任它，α几乎会像你说的那样更低","start":3545.31,"end":3549.45},{"id":326,"text":"oh yeah wonderful question so we haven't talked about this again you don't need to know this but","zh":"哦，是的，非常好的问题，我们之前没有再讨论过，你不需要知道这个，但","start":3552.55,"end":3563.03},{"id":327,"text":"i'm super happy to tell you so it turns out there's actually a wonderful study written by","zh":"我非常高兴地告诉你们，事实上有一项非常棒的研究是由海军的一位名叫Leslie的人写的","start":3563.03,"end":3566.85},{"id":328,"text":"this guy at the navy named leslie who wrote this study about how do you do various what are called","zh":"这项研究探讨了如何进行所谓的调度规则或步长规则","start":3566.85,"end":3570.49},{"id":329,"text":"scheduling rules or step size rules so there's two great papers if you ever wonder there's one","zh":"如果你曾经好奇过，那么有两篇非常重要的论文","start":3570.49,"end":3574.25},{"id":330,"text":"which is called cosine scaling, where you actually make the batch size go up and down as you run.","zh":"其中一篇叫做余弦缩放，它实际上是在运行过程中让批量大小上下波动","start":3574.25,"end":3577.55},{"id":331,"text":"where you actually make the batch size go up and down as you run. The idea being that you","zh":"其中一篇叫做余弦缩放，它实际上是在运行过程中让批量大小上下波动。其想法是","start":3577.69,"end":3581.27},{"id":332,"text":"zoom into a local minimum and then it kicks you out. And he showed that this cosine scaling was","zh":"你放大到一个局部最小值，然后将其踢出去。他展示了这种余弦缩放","start":3581.27,"end":3585.57},{"id":333,"text":"actually one of the best at the time for image models. There's another paper which I love,","zh":"在当时实际上是图像模型中表现最好的方法之一。还有一篇论文我非常喜欢，","start":3585.57,"end":3590.43},{"id":334,"text":"which is from the 90s, which is the OnStriker paper, which shows that a bunch of rules that","zh":"那是来自90年代的OnStriker论文，它展示了多种规则","start":3590.49,"end":3594.61},{"id":335,"text":"people are using in gradient descent and stochastic gradient descent are actually all","zh":"人们在梯度下降和随机梯度下降中使用的实际上都是相同的。所谓的线性退火和指数退火以及其他方法。","start":3594.61,"end":3598.19},{"id":336,"text":"the same. So called linear and exponential back off and all the rest. Now, I would doubt that","zh":"现在，我怀疑在生产环境中大多数人并没有调整他们的调度，除非他们正在做像","start":3598.19,"end":3603.29},{"id":337,"text":"most people here in production are tuning their schedules unless they're doing something that like","zh":"嗯，对于一个产品来说，你可能会说。但研究人员通常只是输入一些数值，让默认设置大部分时间起作用。是的，非常好的问题。请。太棒了。所以问题是，","start":3603.29,"end":3608.99},{"id":338,"text":"Well, for a product you would, I guess you would say. But researchers are kind of just putting in the numbers and letting the defaults work most of the time. Yeah, wonderful questions. Please. Awesome. So the thing is, if you look at this, it's a wonderful question. So the question is,","zh":"如果你采样你的数据，你希望看到所有的数据。你不希望其中有重复。这正好回到了有放回采样和无放回采样的区别，正如我之前谈到的，你会看到那些优惠券很多次，而无放回采样则是将数据集打乱。当你打乱这个数据集时，你可以保证你只会看到每个数据集一次。因此，人们的信念是，这会对你有帮助，正如你所说的那样，因为你将再次看到很多例子。","start":3609.63,"end":3637.92},{"id":339,"text":"If you sample your data, you kind of want to see all of your data. You don't want to have repetition in there. And this exactly gets back to the difference between with replacement sampling, where you would see, as I was talking about, those coupons many, many times, versus without replacement sampling, where you shuffle the data set. And when you shuffle that data set, you're guaranteed that you're only going to see every data set exactly once. And so the belief is that that would help you exactly for the reason you said, that you're going to see many of the examples again and again.","zh":"如果你采样你的数据，你希望看到所有的数据。你不希望其中有重复。这正好回到了有放回采样和无放回采样的区别，正如我之前谈到的，你会看到那些优惠券很多次，而无放回采样则是将数据集打乱。当你打乱这个数据集时，你可以保证你只会看到每个数据集一次。因此，人们的信念是，这会对你有帮助，正如你所说的那样，因为你将再次看到很多例子。","start":3638.62,"end":3664.9}],"notes":["本段讨论了监督学习中批量大小（batch size）的选取及其对模型训练的影响。讲者指出，批量大小通常不会设置为1/N，因为这在实际应用中很少见。此外，讲者提到模型设计时会考虑归一化和批量大小的一致性，以确保各维度的更新步长具有各向同性（isotropic）特性。","讲者进一步解释了各向同性（isotropic）的概念，即模型在不同维度上的更新步长应保持一致。这通常通过使用层归一化（layer normalization）等技术来实现，以确保模型在训练过程中处于合适的更新步长范围内。","讲者提到，批量大小的调整策略（如cosine scaling）在训练过程中会动态变化，以帮助模型在局部最小值附近进行探索。这种策略在图像模型中表现优异，且有相关研究支持。","讲者还讨论了采样方法，包括有放回采样（with replacement sampling）和无放回采样（without replacement sampling）。有放回采样会导致数据重复，而无放回采样则通过洗牌数据集确保每个样本仅被访问一次。","讲者强调，无放回采样有助于模型更好地泛化，因为它避免了数据重复带来的偏差。这种采样方法在训练过程中能更有效地利用数据，提高模型性能。","最后，讲者回应了学生的问题，指出在实际生产中，大多数情况下人们不会手动调整学习率调度（learning rate scheduling），而是依赖默认设置。然而，研究人员通常会根据具体情况调整这些参数。"],"formulas":[{"latex":"Cov(cX) = c^2 Cov(X)","symbols":"协方差的线性变换性质","explanation":"该公式正确表达了协方差在标量乘法下的性质，即协方差的线性变换性质。","evidence":"and batch size across all of them."}],"uncertainties":["cosine scaling 的具体数学表达式未明确给出","各向同性（isotropic）的数学定义未明确给出","alpha 的具体数学定义未明确给出"],"diagram":"none","start":3486.15,"end":3664.9,"asr_flags":[326],"math_clarifications":["原始文本中未提及任何需要核对的数学公式或概念，因此无需额外说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":3486.15,"text":"seen so it is a random sampling procedure yeah wonderful question and clarification please"},{"start":3498.17,"text":"Yeah, that's a wonderful question. So how the batch size scales, you would indeed expect"},{"start":3503.55,"text":"that as you ramp up the batch size, right? When you go all the way from one to the limit,"},{"start":3508.75,"text":"you're going to get to a batch size of one over N. You very rarely use one over N as your SGD"},{"start":3513.19,"text":"batch size. It turns out for like folklore reasons that lots of people write their models,"},{"start":3518.59,"text":"models, not linear models, but write their models so that there's the same kind of normalization"},{"start":3522.59,"text":"and batch size across all of them."},{"start":3524.31,"text":"And so that is like a thing that you do."},{"start":3526.51,"text":"So if you've played with deep learning things and use like layer norms or sandwich norms"},{"start":3530.05,"text":"or other things, they're trying to get you in the right regime where like the step sizes"},{"start":3533.61,"text":"are kind of all what's called fancy word is isotropic, but kind of all the dimensions"},{"start":3537.19,"text":"are the same."},{"start":3537.93,"text":"So what does that mean?"},{"start":3539.01,"text":"For alpha, that means you would intuitively expect that if the model is taking a little"},{"start":3545.31,"text":"bit of information you don't trust it very much and alpha would be lower almost exactly as you said"},{"start":3552.55,"text":"oh yeah wonderful question so we haven't talked about this again you don't need to know this but"},{"start":3563.03,"text":"i'm super happy to tell you so it turns out there's actually a wonderful study written by"},{"start":3566.85,"text":"this guy at the navy named leslie who wrote this study about how do you do various what are called"},{"start":3570.49,"text":"scheduling rules or step size rules so there's two great papers if you ever wonder there's one"},{"start":3574.25,"text":"where he basically did what's actually quite widely used, which is called cosine scaling,"},{"start":3577.69,"text":"where you actually make the batch size go up and down as you run. The idea being that you"},{"start":3581.27,"text":"zoom into a local minimum and then it kicks you out. And he showed that this cosine scaling was"},{"start":3585.57,"text":"actually one of the best at the time for image models. There's another paper which I love,"},{"start":3590.49,"text":"which is from the 90s, which is the OnStriker paper, which shows that a bunch of rules that"},{"start":3594.61,"text":"people are using in gradient descent and stochastic gradient descent are actually all"},{"start":3598.19,"text":"the same. So called linear and exponential back off and all the rest. Now, I would doubt that"},{"start":3603.29,"text":"most people here in production are tuning their schedules unless they're doing something that like"},{"start":3609.63,"text":"Well, for a product you would, I guess you would say. But researchers are kind of just putting in the numbers and letting the defaults work most of the time. Yeah, wonderful questions. Please. Awesome. So the thing is, if you look at this, it's a wonderful question. So the question is,"},{"start":3638.62,"text":"If you sample your data, you kind of want to see all of your data. You don't want to have repetition in there. And this exactly gets back to the difference between with replacement sampling, where you would see, as I was talking about, those coupons many, many times, versus without replacement sampling, where you shuffle the data set. And when you shuffle that data set, you're guaranteed that you're only going to see every data set exactly once. And so the belief is that that would help you exactly for the reason you said, that you're going to see many of the examples again and again."}],"speech_gaps":[{"start":3491.664,"end":3497.77}],"frame":"../frames/v049/021.webp","frame_time":3498.15},{"title":"监督学习设定中的数据分布与模型差异","segments":[{"id":340,"text":"Now, that assumes that all the examples are equally informative, and that's not always true.","zh":"现在，这假设所有的例子都同样具有信息量，但这种情况并不总是成立。","start":3666.13,"end":3670.51},{"id":341,"text":"Sometimes there's a core, a hardcore set that you wish you could see again and again. And if you","zh":"有时候存在一个核心集，一个你希望反复看到的硬核集合。并且如果你","start":3670.65,"end":3675.83},{"id":342,"text":"look at modern training for like LLMs that are in the wild, that large language models that are in","zh":"观察现代训练，比如那些在实际中使用的大型语言模型，你会发现实际上在某些地方人们确实会重复","start":3675.83,"end":3679.81},{"id":343,"text":"the wild, you'll see that actually there are places where people actually do repetition on","zh":"进行训练。例如，代码非常受欢迎，因为人们相信通过多次重复可以建立某种结构。","start":3679.81,"end":3683.69},{"id":344,"text":"things. Like code is very popular to do multiple times because of the belief as you put in some","zh":"有一篇很棒的论文讨论了这个问题。如果你对数据混合感兴趣，请发送一条消息或留言给我，我很乐意分享一些关于人们如何混合","start":3683.69,"end":3687.97},{"id":345,"text":"structure. There's a great paper about this. If you're interested about data mixing, please send","zh":"训练计划的论文内容。他们是在图像模型上进行的，那么是否存在这样的原因呢？","start":3687.97,"end":3692.49},{"id":346,"text":"a note or post to ed i'm happy to post something about about what people know about how you mix","zh":"他们是在图像模型上进行的，那么是否存在这样的原因呢？","start":3692.49,"end":3696.55},{"id":347,"text":"schedule paper they did it with image models right is there a reason why","zh":"安排论文他们用图像模型做了，对吧，有没有什么原因","start":3696.55,"end":3701.09},{"id":348,"text":"schedule paper they did it with image models right is there a reason why","zh":"他们用图像模型做这个实验，对吧？为什么会有这样的原因？","start":3703.49,"end":3706.89},{"id":349,"text":"like learning rate things are different from the models","zh":"比如学习率，这些和模型是不同的","start":3706.89,"end":3711.05},{"id":350,"text":"yeah so the question is why does the why would you care that it's from image models versus text","zh":"是的，问题是为什么你会在意它是来自图像模型还是文本模型","start":3711.05,"end":3717.47},{"id":351,"text":"models what would change there there's two things that change one are the architectures at the time","zh":"模型有什么不同呢？有两个方面会变化，一个是当时的架构","start":3717.47,"end":3722.39},{"id":352,"text":"the architectures were different we're talking about neural net architectures that has actually","zh":"架构是不同的，我们谈论的是实际上随着时间变化的神经网络架构","start":3722.39,"end":3726.09},{"id":353,"text":"changed over time now we've converged and built a bunch of technology where you can use kind of","zh":"现在我们已经收敛并构建了一堆技术，可以使用类似","start":3726.09,"end":3730.13},{"id":354,"text":"transformer stacks for both of them the other thing is that the distributions may actually be","zh":"的Transformer堆栈来处理两者","start":3730.13,"end":3734.13},{"id":355,"text":"quite different so if you think about images they have a set of national distributions that are in","zh":"另一个方面是分布可能实际上差异很大，所以如果你考虑图像，它们有一套国家分布，这些分布是","start":3734.13,"end":3738.49},{"id":356,"text":"the world that like has some smooth variations right like i don't know about you but like you","zh":"这个世界就像有一些平滑的变化，比如我不知道你怎么样，但你","start":3738.49,"end":3742.97},{"id":357,"text":"know i take pictures of my kids it's like in burst mode i've got a thousand pictures of you know like","zh":"知道我经常给我孩子拍照，就像用连拍模式，我有上千张你懂的，像","start":3742.97,"end":3746.49},{"id":358,"text":"one of my daughters dancing right that thing they're all little tiny variations of each other","zh":"我其中一个女儿跳舞的照片，那些东西它们都是彼此之间很小的微小变化","start":3746.49,"end":3751.13},{"id":359,"text":"that distribution is kind of compact i don't tend to write the same sentence a thousand times like","zh":"那个分布有点紧凑，我不太会重复写同样的句子上千次，像","start":3751.13,"end":3755.69},{"id":360,"text":"a crazy person maybe i i have over like you know longitudinally in my life but like it's not kind","zh":"一个疯狂的人也许，我在我的一生中纵向有过度，但像它并不是那种方式的紧凑","start":3755.69,"end":3760.75},{"id":361,"text":"of compact in that way and so those differences in distributions they may have an effect on the","zh":"所以这些分布之间的差异可能会对学习率产生影响，所以你不能，它们不会很好地迁移，像如果你有干净的理论你","start":3760.75,"end":3765.45},{"id":362,"text":"learning rates and so you can't they don't transfer well like if you had clean theory you","zh":"会知道从a到b是什么，但我们不知道在不同情况下从a到b是什么","start":3765.45,"end":3770.17},{"id":363,"text":"would know what goes from a to b we don't know what goes from a to b in different situations","zh":"我们会知道从a到b的情况，但我们不知道在不同情况下从a到b的情况","start":3770.17,"end":3774.35},{"id":364,"text":"so that caveat turned out to be important it caught on quite a bit in images and some of those","zh":"所以这个警告被证明是重要的，它在图像领域和一些其他领域得到了广泛的应用","start":3774.35,"end":3778.97},{"id":365,"text":"those ideas were adopted,","zh":"这些想法被采纳了，","start":3778.97,"end":3779.93},{"id":366,"text":"but those aren't the ones that we use today","zh":"但我们现在并不使用这些","start":3780.11,"end":3781.67},{"id":367,"text":"in engineering text models.","zh":"在工程文本模型中。","start":3781.67,"end":3783.87},{"id":368,"text":"Yeah.","zh":"是的。","start":3784.29,"end":3784.65},{"id":369,"text":"Cool.","zh":"很酷。","start":3786.03,"end":3786.39},{"id":370,"text":"How do you feel about changing anything right now?","zh":"你现在觉得改变什么吗？","start":3788.89,"end":3792.73},{"id":371,"text":"I would pick them.","zh":"我会选择它们。","start":3795.19,"end":3796.31},{"id":372,"text":"Yeah, so I would pick the way I would do this.","zh":"是的，我会这样来做。","start":3796.39,"end":3798.15},{"id":373,"text":"Oh, sorry.","zh":"哦，抱歉。","start":3798.21,"end":3798.53},{"id":374,"text":"The way I would do this is, oops.","zh":"我会这样来做，哎呀。","start":3798.63,"end":3800.99},{"id":375,"text":"Yeah, so this covers many of
