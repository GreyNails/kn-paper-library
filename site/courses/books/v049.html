n is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for."},{"start":1712.31,"text":"Please."},{"start":1713.17,"text":"With argument, like the data that you kind of put in,"},{"start":1716.19,"text":"like are they discrete or?"},{"start":1718.89,"text":"Oh, fantastic."},{"start":1719.77,"text":"Yeah."},{"start":1719.99,"text":"So one of the things is, is remember,"},{"start":1721.53,"text":"our hypothesis class right now,"},{"start":1723.21,"text":"the way we picked it was to be continuous."},{"start":1725.25,"text":"So these can be any real value that we want."},{"start":1727.27,"text":"And so when we plug these things in here,"},{"start":1729.27,"text":"we're going to have continuous value."},{"start":1730.57,"text":"So we're going to do continuous optimization."},{"start":1732.81,"text":"Discrete optimization, you can do."},{"start":1734.53,"text":"There are procedures that people do,"},{"start":1736.59,"text":"fancy ones, you know, integer linear programming,"},{"start":1738.91,"text":"yada, yada, yada."},{"start":1739.89,"text":"Those are generally pretty hard."},{"start":1741.37,"text":"Most modern machine learning, one of the tricks"},{"start":1743.33,"text":"are, even when you have something that's discrete,"},{"start":1745.39,"text":"like our models that work on words,"},{"start":1747.19,"text":"underneath their covers, they're actually"},{"start":1748.81,"text":"doing something continuous."},{"start":1749.99,"text":"And so the parameter space will almost always be continuous."},{"start":1752.55,"text":"So you can compute things like gradients and derivatives"}],"speech_gaps":[],"frame":"../frames/v049/010.webp","frame_time":1588.71},{"title":"监督学习设定与误差函数","segments":[{"id":123,"text":"and for other optimization reasons.","start":1755.23,"end":1756.79},{"id":124,"text":"It's a very insightful question.","start":1757.15,"end":1758.41},{"id":125,"text":"Please.","start":1759.51,"end":1760.01},{"id":126,"text":"Does this mean that the larger differences","start":1760.43,"end":1763.75},{"id":127,"text":"Does this mean that the larger differences get more ?","start":1763.75,"end":1766.03},{"id":128,"text":"Yeah, that's a great question to think about.","start":1766.03,"end":1768.29},{"id":129,"text":"So these error functions, this thing here,","start":1768.47,"end":1770.71},{"id":130,"text":"or when we incur an error in prediction,","start":1770.71,"end":1772.37},{"id":131,"text":"the question is how much penalty do we pay?","start":1772.63,"end":1774.45},{"id":132,"text":"Right now we're paying with this square.","start":1774.77,"end":1776.27},{"id":133,"text":"And as we've talked about,","start":1776.45,"end":1777.09},{"id":134,"text":"it's for computational and modeling reasons,","start":1777.25,"end":1779.35},{"id":135,"text":"kind of a good mix.","start":1779.47,"end":1780.25},{"id":136,"text":"You could put other things in there.","start":1780.67,"end":1782.01},{"id":137,"text":"I don't wanna make too big a deal out of it","start":1782.27,"end":1784.23},{"id":138,"text":"because honestly, when you get to a lot of data,","start":1784.23,"end":1786.95},{"id":139,"text":"the form of this doesn't really matter too much.","start":1787.49,"end":1790.65},{"id":140,"text":"There is one very important form","start":1790.97,"end":1792.89},{"id":141,"text":"that we'll cover next lecture,","start":1792.89,"end":1794.03},{"id":142,"text":"which is for classification when you have a discrete set,","start":1794.17,"end":1798.21},{"id":143,"text":"and then you do something called softmax.","start":1798.37,"end":1799.83},{"id":144,"text":"And softmax is probably the function that I use most in my day when you build these systems.","start":1799.83,"end":1806.07},{"id":145,"text":"And probably if you are doing all your homework with ChatGPT like the rest of your classmates, then you probably use it too.","start":1806.19,"end":1811.19},{"id":146,"text":"Because that's the workhorse that's underneath it.","start":1811.33,"end":1813.49},{"id":147,"text":"But this one is just the one we're going to do for computational reasons. It has a nastier derivative. Other questions? This is awesome. Please ask me questions. All right. We'll keep going. All right. So what do we see? We're at the end of our linear regression.","start":1813.85,"end":1830.69},{"id":148,"text":"We're at the end of our linear regression. We saw our first hypothesis class, affine and linear. We're going to see many, many more richer classes throughout this. And richer means that they're more expressive. It means not only do they have more parameters, which as I've hinted several, several times, modern models do, but they're actually going to have crazier surfaces as well. So they're not just going to be lines. They're going to have kind of crazy, interesting surfaces underneath them. We refreshed ourselves. And as I said, if this part was unfamiliar to you, you were looking at this and you're like, I've never heard anything this guy's talking about.","start":1832.29,"end":1859.11},{"id":149,"text":"Okay, maybe I did a bad job. I'm willing to admit that. But if I didn't do a terrible job, then look and say, maybe I need to refresh. And I cannot tell you how much I want you to, if you need to, go take advantage of those TA resources and others, because putting in a little bit of investment now makes the class go a lot, lot more smoothly for you. We also saw something that was this paradigm that you guys picked up on right away, which is great, which is that a good hypothesis is one that's close to the data.","start":1859.85,"end":1884.55},{"id":150,"text":"And I want to point out something which is a little bit kind of spooky about what we're going to claim here. And this is like a foundation of statistics. It's not that spooky. But it is, if we believe that training set, if we fit our hypothesis on that training set, we believe it's going to work well in the real world. That's a little bit of a leap of faith.","start":1885.0,"end":1902.37},{"id":151,"text":"And so we'll justify that leap of faith in all kinds of ways, some of which I'll give you a lecture in the middle about how they can go terribly wrong. And I will pick from my own work where we thought we were selecting data in a way at training time that was going to match test. And we were completely wrong and made fools of ourselves. So economic indicators and all kinds of fun stuff like that. And so that can happen. But I want to be aware this paradigm is what machine learning does. It says, look.","start":1902.8,"end":1926.96}],"notes":["本段讨论了监督学习中误差函数的选择及其对模型训练的影响。讲者提到，误差函数的设计不仅影响模型的性能，还涉及计算和建模的考虑。例如，平方误差函数因其计算简单和可导性而被广泛使用，但其他形式的误差函数也可以被采用。讲者还指出，在数据量大的情况下，误差函数的形式对结果的影响可能不大。","讲者强调了监督学习中一个核心假设，即训练集能够代表真实世界的数据分布。这一假设是机器学习的基础，但同时也存在一定的风险，因为训练集可能无法完全反映真实情况。讲者提到，这种假设需要通过多种方法进行验证，以避免模型在实际应用中表现不佳。","讲者提到，监督学习的目标是找到一个假设函数，使其在训练集上的表现良好，并且能够推广到未见过的数据。这涉及到模型的泛化能力，而泛化能力的提升通常需要更复杂的模型结构，如非线性模型。","讲者指出，现代机器学习模型通常具有更多的参数，并且能够拟合更复杂的函数表面。这使得模型能够捕捉到数据中的非线性关系，从而提高预测性能。然而，这种复杂性也带来了计算上的挑战，需要在模型的表达能力和计算效率之间进行权衡。","讲者提到，监督学习的假设是训练集能够代表真实世界的数据分布，但这一假设并不总是成立。讲者通过自己的经验指出，有时训练集的选择可能与测试集存在差异，导致模型在实际应用中表现不佳。因此，需要通过多种方法来验证和改进模型的泛化能力。","讲者强调了监督学习的基本思想，即通过训练集学习一个假设函数，使其在未见过的数据上表现良好。这一思想是机器学习的核心，但同时也需要谨慎对待，因为训练集可能无法完全反映真实世界的数据分布。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1755.23,"end":1926.96,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1755.23,"text":"and for other optimization reasons."},{"start":1757.15,"text":"It's a very insightful question."},{"start":1759.51,"text":"Please."},{"start":1760.43,"text":"Does this mean that the larger differences"},{"start":1763.75,"text":"get more ?"},{"start":1766.03,"text":"Yeah, that's a great question to think about."},{"start":1768.47,"text":"So these error functions, this thing here,"},{"start":1770.71,"text":"or when we incur an error in prediction,"},{"start":1772.63,"text":"the question is how much penalty do we pay?"},{"start":1774.77,"text":"Right now we're paying with this square."},{"start":1776.45,"text":"And as we've talked about,"},{"start":1777.25,"text":"it's for computational and modeling reasons,"},{"start":1779.47,"text":"kind of a good mix."},{"start":1780.67,"text":"You could put other things in there."},{"start":1782.27,"text":"I don't wanna make too big a deal out of it"},{"start":1784.23,"text":"because honestly, when you get to a lot of data,"},{"start":1787.49,"text":"the form of this doesn't really matter too much."},{"start":1790.97,"text":"There is one very important form"},{"start":1792.89,"text":"that we'll cover next lecture,"},{"start":1794.17,"text":"which is for classification when you have a discrete set,"},{"start":1798.37,"text":"and then you do something called softmax."},{"start":1799.83,"text":"And softmax is probably the function that I use most in my day when you build these systems."},{"start":1806.19,"text":"And probably if you are doing all your homework with ChatGPT like the rest of your classmates, then you probably use it too."},{"start":1811.33,"text":"Because that's the workhorse that's underneath it."},{"start":1813.85,"text":"But this one is just the one we're going to do for computational reasons. It has a nastier derivative. Other questions? This is awesome. Please ask me questions. All right. We'll keep going. All right. So what do we see? We're at the end of our linear regression."},{"start":1832.29,"text":"We saw our first hypothesis class, affine and linear. We're going to see many, many more richer classes throughout this. And richer means that they're more expressive. It means not only do they have more parameters, which as I've hinted several, several times, modern models do, but they're actually going to have crazier surfaces as well. So they're not just going to be lines. They're going to have kind of crazy, interesting surfaces underneath them. We refreshed ourselves. And as I said, if this part was unfamiliar to you, you were looking at this and you're like, I've never heard anything this guy's talking about."},{"start":1859.85,"text":"Okay, maybe I did a bad job. I'm willing to admit that. But if I didn't do a terrible job, then look and say, maybe I need to refresh. And I cannot tell you how much I want you to, if you need to, go take advantage of those TA resources and others, because putting in a little bit of investment now makes the class go a lot, lot more smoothly for you. We also saw something that was this paradigm that you guys picked up on right away, which is great, which is that a good hypothesis is one that's close to the data."},{"start":1885.0,"text":"And I want to point out something which is a little bit kind of spooky about what we're going to claim here. And this is like a foundation of statistics. It's not that spooky. But it is, if we believe that training set, if we fit our hypothesis on that training set, we believe it's going to work well in the real world. That's a little bit of a leap of faith."},{"start":1902.8,"text":"And so we'll justify that leap of faith in all kinds of ways, some of which I'll give you a lecture in the middle about how they can go terribly wrong. And I will pick from my own work where we thought we were selecting data in a way at training time that was going to match test. And we were completely wrong and made fools of ourselves. So economic indicators and all kinds of fun stuff like that. And so that can happen. But I want to be aware this paradigm is what machine learning does. It says, look."}],"speech_gaps":[],"frame":"../frames/v049/011.webp","frame_time":1767.23},{"title":"监督学习设定与优化基础","segments":[{"id":152,"text":"This training set is somehow a reflection. It's captured the real world. You have to believe that. And then fitting on that data set is somehow going to carry out something nice in the real world. It's like the cornerstone of statistical estimation and inference. Cool. Great. We also talked a bunch about objective functions, Jay. We're going to see those over the next lecture. We're going to see the canonical one for regression today, and we'll see the canonical one for classification next week. OK.","start":1927.25,"end":1954.62},{"id":153,"text":"All right. Now, as I mentioned, and I'm biased here, so I should also tell you about that. So what I work on in research, as I mentioned, is I really like the problems of scaling up these models. We've done all kinds of things underneath the covers to do that, to make these large models that today run on GPUs. We've contributed our little brick to that out of my lab, which I'm very proud of. Wonderful students and collaborators. But one of the things that you'll see in machine learning is this ability to compute.","start":1955.41,"end":1980.87},{"id":154,"text":"These functions at large scales is critically important. That's been the revolution that's allowed us to break away from doing small kinds of problems to the large. And that's what we're going to cover over the next couple of weeks. But we'll start where the field started. What that boils down to is basically solving a set of these equations, that argmin that we talked about before. This is also called, as we'll talk about, a loss function.","start":1981.47,"end":2002.58},{"id":155,"text":"Being able to take a loss function and run an optimization procedure, fancy one called backprop that you'll learn in the course, underpins pretty much 99% of the models that you're likely to encounter today. So we're going to see the warm-ups to how you get to backprop, the simplest thing that starts there, which is the computation of a derivative. And then in this case, we'll also see how to solve these equations exactly. That's very unusual that you can do that.","start":2003.24,"end":2026.6},{"id":156,"text":"But it will basically be an exercise with some of that notation. So if I haven't made it clear, we'd really love you to use those Friday lectures. All right. I'm not getting paid if you go. I know you probably at this point, you're like, oh, you must be getting paid. No, no. I think it's good for you. All right. So let me solve these least squares problems. All right. So I'm going to draw a little picture here. All right. So let's take a function.","start":2027.32,"end":2050.73},{"id":157,"text":"This will be our quadratic, which is kind of like our classical function. And we'll look at this kind of bowl-shaped function. Now, when we compute the quadratic, so we'll take something here, which like we'll say it's x squared on my right here. So it's like x squared plus, I don't know, some theta 0, whatever, something right here. Now, I can make this call this 2x squared. I don't know, whatever you want. Now, this is f.","start":2051.37,"end":2079.07},{"id":158,"text":"You all remember how to compute derivatives for this, I hope. But if you don't, remember the picture. You pick a point. Let's say your first point here, which is going to be theta 0, which is going to be our first guess. You then pick this line, which is the gradient, the best linear approximation. You remember your Taylor expansion. You're going to be f of theta 0. And then you're going to be plus f prime of theta 0.","start":2079.57,"end":2107.22}],"notes":["本段主要讲解监督学习中训练集的作用，强调训练集反映真实世界的重要性，并指出模型在真实世界中的应用。同时，提到课程将介绍目标函数，包括回归和分类的典型目标函数。","本段讨论了机器学习中计算大规模函数的重要性，这是从解决小规模问题转向大规模问题的革命性突破。课程接下来几周将重点讲解如何解决这些方程，即求解argmin问题，这被称为损失函数。","本段强调了优化过程在现代机器学习中的核心地位，特别是反向传播算法。课程将从基础开始，讲解如何计算导数，并展示如何精确求解这些方程，这在实际中较为罕见。","本段提到周五的讲座，鼓励学生参加。虽然讲师未获得报酬，但认为这些讲座对学习有帮助。随后，讲师将讲解最小二乘问题，并通过图像展示二次函数及其导数的计算。","本段通过图像说明二次函数的形状，并引入参数θ₀作为初始猜测。接着，讲师提到梯度作为最佳线性近似，并使用泰勒展开来解释函数在θ₀处的值及其导数。","本段强调了导数计算在机器学习中的重要性，并通过图像和数学表达式说明如何利用梯度进行优化。这为后续反向传播算法的讲解奠定了基础。"],"formulas":[{"latex":"\\operatorname{argmin}","symbols":"最小化","explanation":"保留argmin，这是数学中常用的最小化操作符，无需修改。","evidence":"These functions at large scales is critically important. That's been the revolution that's allowed us to break away from doing small kinds of problems to the large. And that's what we're going to cover over the next couple of weeks. But we'll start where the field started. What that boils down to is basically solving a set of these equations, that argmin that we talked about before. This is also called, as we'll talk about, a loss function."}],"uncertainties":["Some theta 0, whatever, something right here"],"diagram":"none","start":1927.25,"end":2107.22,"asr_flags":[],"math_clarifications":["公式1无法核定，因为没有明确的数学恒等关系支持，且上下文未提供足够的信息来验证其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1927.25,"text":"This training set is somehow a reflection. It's captured the real world. You have to believe that. And then fitting on that data set is somehow going to carry out something nice in the real world. It's like the cornerstone of statistical estimation and inference. Cool. Great. We also talked a bunch about objective functions, Jay. We're going to see those over the next lecture. We're going to see the canonical one for regression today, and we'll see the canonical one for classification next week. OK."},{"start":1955.41,"text":"All right. Now, as I mentioned, and I'm biased here, so I should also tell you about that. So what I work on in research, as I mentioned, is I really like the problems of scaling up these models. We've done all kinds of things underneath the covers to do that, to make these large models that today run on GPUs. We've contributed our little brick to that out of my lab, which I'm very proud of. Wonderful students and collaborators. But one of the things that you'll see in machine learning is this ability to compute."},{"start":1981.47,"text":"These functions at large scales is critically important. That's been the revolution that's allowed us to break away from doing small kinds of problems to the large. And that's what we're going to cover over the next couple of weeks. But we'll start where the field started. What that boils down to is basically solving a set of these equations, that argmin that we talked about before. This is also called, as we'll talk about, a loss function."},{"start":2003.24,"text":"Being able to take a loss function and run an optimization procedure, fancy one called backprop that you'll learn in the course, underpins pretty much 99% of the models that you're likely to encounter today. So we're going to see the warm-ups to how you get to backprop, the simplest thing that starts there, which is the computation of a derivative. And then in this case, we'll also see how to solve these equations exactly. That's very unusual that you can do that."},{"start":2027.32,"text":"But it will basically be an exercise with some of that notation. So if I haven't made it clear, we'd really love you to use those Friday lectures. All right. I'm not getting paid if you go. I know you probably at this point, you're like, oh, you must be getting paid. No, no. I think it's good for you. All right. So let me solve these least squares problems. All right. So I'm going to draw a little picture here. All right. So let's take a function."},{"start":2051.37,"text":"This will be our quadratic, which is kind of like our classical function. And we'll look at this kind of bowl-shaped function. Now, when we compute the quadratic, so we'll take something here, which like we'll say it's x squared on my right here. So it's like x squared plus, I don't know, some theta 0, whatever, something right here. Now, I can make this call this 2x squared. I don't know, whatever you want. Now, this is f."},{"start":2079.57,"text":"You all remember how to compute derivatives for this, I hope. But if you don't, remember the picture. You pick a point. Let's say your first point here, which is going to be theta 0, which is going to be our first guess. You then pick this line, which is the gradient, the best linear approximation. You remember your Taylor expansion. You're going to be f of theta 0. And then you're going to be plus f prime of theta 0."}],"speech_gaps":[],"frame":"../frames/v049/012.webp","frame_time":1939.25},{"title":"梯度下降法与凸性","segments":[{"id":159,"text":"times x minus x theta, or theta. Whoa, that's bad. All right, I'm going to rewrite this. f of theta 0 plus f prime of theta 0. And then I was just trying to write theta minus theta 0. Nothing deep going on. This Taylor's rule for the first derivative. And that's that line that I've drawn there. And if you don't remember that, remember it's the secant that comes in and approximates the gradient. Slide it down in your head. OK, once we do that, we have the direction of maximal increase.","start":2108.07,"end":2136.13},{"id":160,"text":"And so then we plug that character in, this fun gradient here. We're going to plug that in in this notation. Now, j may have some higher dimensional structure. So this guy is not a derivative of one variable. It's a partial derivative. If you don't remember that thing, please go ahead and look it up. And the idea here is that what we're going to do is we're going to iterate and walk down in the direction until we get to the...","start":2136.9,"end":2164.68},{"id":161,"text":"bottom here. And so what's happening is we start with initial guess. I didn't start at zero. I should have slid this over at zero. We start with initial guess. Could be a random number. Could be zero. Interestingly, in modern models, where you start matters. Doesn't matter for least squares. Does matter in general. And then we're going to iterate these equations. We're going to start with our current guess. We're going to compute this gradient or derivative. And we're going to try and minimize it. So we're going to walk in the opposite direction. How far are we going to walk? This thing here is going to tell us. This is called a step size.","start":2165.26,"end":2194.85},{"id":162,"text":"This guy here is the step size. Now if you look at this and you're mathematically minded, you may think that this is horrifying. You're computing only first-order information. You're just looking at a gradient.","start":2196.92,"end":2209.83},{"id":163,"text":"You are only taking a step size that's not searching to the most minimal part you could get, what's called line search. You're not doing that. You're just kind of grabbing some information about the function locally and taking a quick step. And the reason that can be so disastrous, you may have been told in your calculus classes, is because you could have a function that looks like this. And then here, you walk down and you get stuck in a local regime. So hopefully this is familiar to you. By show of hands, do people understand the difference convexity, non-convexity? Awesome. Perfect. Okay.","start":2211.0,"end":2239.92},{"id":164,"text":"So that's how it looks. All right, fantastic. We do this for every single component and we update. That's how we solve it. All right. So when we do this, we get this learning rate or step size. You'll hear me say those terms mean the same thing. I wish that they were unified in my head, but I will use them interchangeably. Apologies in advance.","start":2240.86,"end":2264.25}],"notes":["本段讲解了梯度下降法的基本思想，即通过计算梯度并沿着负梯度方向进行迭代更新，以最小化目标函数。讲者提到梯度是偏导数，适用于多维情况，并强调了初始猜测的重要性，特别是在现代模型中，初始点的选择会影响收敛结果。","讲者指出，梯度下降法仅使用一阶信息（梯度），并采用固定步长进行更新，这可能导致陷入局部极小值。因此，讲者提到需要理解凸性和非凸性的区别，以避免算法失效。","讲者通过举例说明，如果目标函数是非凸的，梯度下降法可能无法找到全局最优解，而只能收敛到局部最优解。因此，理解函数的凸性对于选择合适的优化方法至关重要。","讲者提到，学习率（step size）是控制梯度下降步长的关键参数，它决定了每次迭代的更新幅度。学习率的选择对算法的收敛性和稳定性有重要影响。","讲者强调，虽然学习率和步长在语义上是相同的，但在实际应用中，这两个术语可能被交替使用，但讲者表示希望在自己的理解中统一这两个概念。","讲者最后提到，梯度下降法是一种基础的优化方法，广泛应用于机器学习中，但其局限性也需要被充分认识，特别是在处理非凸问题时。"],"formulas":[{"latex":"f(\\theta) \\text{ 的泰勒展开为 } f(\\theta_0) + f'(\\theta_0)(\\theta - \\theta_0)","symbols":"f(θ) 的泰勒展开式","explanation":"公式正确，表示函数在θ₀处的一阶泰勒展开，适用于可微函数。","evidence":"times x minus x theta, or theta. Whoa, that's bad. All right, I'm going to rewrite this. f of theta 0 plus f prime of theta 0. And then I was just trying to write theta minus theta 0. Nothing deep going on. This Taylor's rule for the first derivative. And that's that line that I've drawn there. And if you don't remember that, remember it's the secant that comes in and approximates the gradient. Slide it down in your head. OK, once we do that, we have the direction of maximal increase."},{"latex":"学习率（step size）控制更新幅度","symbols":"学习率","explanation":"描述正确，学习率控制梯度下降的更新幅度，适用于优化算法中的基本概念。","evidence":"bottom here. And so what's happening is we start with initial guess. I didn't start at zero. I should have slid this over at zero. We start with initial guess. Could be a random number. Could be zero. Interestingly, in modern models, where you start matters. Doesn't matter for least squares. Does matter in general. And then we're going to iterate these equations. We're going to start with our current guess. We're going to compute this gradient or derivative. And we're going to try and minimize it. So we're going to walk in the opposite direction. How far are we going to walk? This thing here is going to tell us. This is called a step size."}],"uncertainties":["可能的术语混淆：讲者提到 'learning rate' 和 'step size' 为同一概念，但未明确说明其数学定义是否完全一致。","未明确的函数形式：讲者提到函数可能具有非凸性，但未给出具体函数形式或数学表达式。","未明确的凸性定义：讲者提到凸性和非凸性的区别，但未给出数学定义或具体例子。"],"diagram":"none","start":2108.07,"end":2264.25,"asr_flags":[],"math_clarifications":["公式1中未明确step size的数学定义，且未说明其与梯度下降的关联，需进一步明确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2108.07,"text":"times x minus x theta, or theta.
