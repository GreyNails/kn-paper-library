xt-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】监督学习设定 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v049","title":"【斯坦福CS229】监督学习设定","course":"机器学习","pages":[{"title":"监督学习设定","segments":[{"id":0,"text":"So good afternoon. Welcome to CS 229. I'm sorry I didn't get a chance to see you all on Monday, but this next section of the course I'll be teaching, Teng, you and I are going to swap off as we go through the lecture.","start":5.26,"end":17.46},{"id":1,"text":"This next segment, we're going to cover the basics of machine learning and AI, which is supervised machine learning. As you're going to see, this is when you explicitly tell the machine what you want it to label. So you could show it an image of a cat or a dog and tell it to classify as a cat or a dog.","start":18.2,"end":34.9},{"id":2,"text":"We'll start off with something else that's called regression, which is just a little bit more kind of mathematically simple. And today we'll go through kind of all the building blocks of what a learning algorithm looks like, and hopefully something that makes a little bit of intuitive sense. And just by way of introduction, I've been working on machine learning and AI for most of my professional career. It's been really exciting to watch it grow from something that was very obscure to now something that has products in your hand that you can use. And so I'm super excited about that. So these classes are always really fun for me because...","start":35.29,"end":64.43},{"id":3,"text":"This stuff that we're teaching here, in some ways, is the foundation for so much of what now you use on a daily basis. So it's really exciting to do that. We're going to teach in a very abstract and mathematical style, I'm sure as Teng shared with you, so we can communicate really, really precisely. So a couple of disclaimers. Let me see if I can get this guy up.","start":64.68,"end":85.8},{"id":4,"text":"So I'm using this format with slides. So you can always download the slides online. I teched them all up, at least for my section. Please look at them. It's just because when we're doing things with math, there's all kinds of little I's and J's and indices. And it's just nice to have them all clean. If you see any bugs, please send them to me. These are like handwritten notes that have been passed down that I wrote a long time ago. But the best lecture for everything is Teng Yu's course notes. So if you get confused what's here, this is meant to be a subset of the course notes.","start":89.48,"end":119.1},{"id":5,"text":"course notes. And it's just meant to give you kind of the tune of what's going on. It's, you know, precise enough that you can understand how all the pieces get together. But if you want to go back and rigorously study, I would really suggest those notes, saying you work quite hard on getting those notes in shape.","start":119.08,"end":132.34},{"id":6,"text":"I'm in general worried that the lecture pacing will be too quick with these. I used to in antiquity give them on these whiteboards. I really like whiteboards because it forces me to slow down and talk and walk through it. So that's kind of another way of me asking you, please just go ahead and ask questions. Like I have given these lectures a bunch of times.","start":133.62,"end":150.52},{"id":7,"text":"These are topics that I've talked about. I would much rather talk to you. If I'm totally honest with you, as a faculty member, I do things outside the university. The reason I stay affiliated with Stanford is because I like mentoring students. It's a way to have a meaningful life. I also run companies and do other stuff in another life. But this is what I enjoy, is talking to you all. So please, please feel free to ask whatever questions you like as we go. I will do my best to answer them.","start":151.23,"end":177.45}],"notes":["本段介绍了课程的基本设定，包括监督学习的概念，即通过明确告诉机器期望的标签来进行学习。例如，通过展示猫或狗的图像并告诉机器进行分类。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.26,"end":177.45,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.26,"text":"So good afternoon. Welcome to CS 229. I'm sorry I didn't get a chance to see you all on Monday, but this next section of the course I'll be teaching, Teng, you and I are going to swap off as we go through the lecture."},{"start":18.2,"text":"This next segment, we're going to cover the basics of machine learning and AI, which is supervised machine learning. As you're going to see, this is when you explicitly tell the machine what you want it to label. So you could show it an image of a cat or a dog and tell it to classify as a cat or a dog."},{"start":35.29,"text":"We'll start off with something else that's called regression, which is just a little bit more kind of mathematically simple. And today we'll go through kind of all the building blocks of what a learning algorithm looks like, and hopefully something that makes a little bit of intuitive sense. And just by way of introduction, I've been working on machine learning and AI for most of my professional career. It's been really exciting to watch it grow from something that was very obscure to now something that has products in your hand that you can use. And so I'm super excited about that. So these classes are always really fun for me because..."},{"start":64.68,"text":"This stuff that we're teaching here, in some ways, is the foundation for so much of what now you use on a daily basis. So it's really exciting to do that. We're going to teach in a very abstract and mathematical style, I'm sure as Teng shared with you, so we can communicate really, really precisely. So a couple of disclaimers. Let me see if I can get this guy up."},{"start":89.48,"text":"So I'm using this format with slides. So you can always download the slides online. I teched them all up, at least for my section. Please look at them. It's just because when we're doing things with math, there's all kinds of little I's and J's and indices. And it's just nice to have them all clean. If you see any bugs, please send them to me. These are like handwritten notes that have been passed down that I wrote a long time ago. But the best lecture for everything is Teng Yu's course notes. So if you get confused what's here, this is meant to be a subset of the course notes."},{"start":119.08,"text":"course notes. And it's just meant to give you kind of the tune of what's going on. It's, you know, precise enough that you can understand how all the pieces get together. But if you want to go back and rigorously study, I would really suggest those notes, saying you work quite hard on getting those notes in shape."},{"start":133.62,"text":"I'm in general worried that the lecture pacing will be too quick with these. I used to in antiquity give them on these whiteboards. I really like whiteboards because it forces me to slow down and talk and walk through it. So that's kind of another way of me asking you, please just go ahead and ask questions. Like I have given these lectures a bunch of times."},{"start":151.23,"text":"These are topics that I've talked about. I would much rather talk to you. If I'm totally honest with you, as a faculty member, I do things outside the university. The reason I stay affiliated with Stanford is because I like mentoring students. It's a way to have a meaningful life. I also run companies and do other stuff in another life. But this is what I enjoy, is talking to you all. So please, please feel free to ask whatever questions you like as we go. I will do my best to answer them."}],"speech_gaps":[],"frame":"../frames/v049/001.webp","frame_time":17.259999999999998},{"title":"监督学习设定","segments":[{"id":8,"text":"I generally talk fast when I get excited. I'm not that excited right now, I guess, but I will be excited later. And when I get excited, I'll talk fast. Thank goodness that most of you will watch these on recordings and you can watch them at 50% speed. I'll do my best to slow down, but genetically it's been rough. All right, so let's get to it. So we're going to talk about our first...","start":177.72,"end":197.3},{"id":9,"text":"first kind of exposure to a formal learning algorithm. The hope is maybe you've seen some of these concepts before. So today is going to be a little bit heavier on notation. It's going to be heavier on kind of the basics that we're going to use. And we're going to talk about kind of the most classical learning algorithm, which predates machine learning by a lot, which is linear regression.","start":198.14,"end":216.68},{"id":10,"text":"Then we're going to see linear regression. We're going to see that this kind of way of fitting a line is actually quite interesting. It's actually a pretty robust technique. A lot of science was done on it. A lot of machine learning was done on it. And we're going to see elements that have really dominated a lot of what machine learning does now. So one of the big things that happened in machine learning were as kind of strange and bizarre as this is to say, we made the models a lot bigger. It's kind of that dumb. We made the models that bigger. And as they say, we made the GPUs go burn.","start":217.68,"end":246.46},{"id":11,"text":"and then we got AI. Now that version is not too far away. And I worked on it. You should see my Stanford job talk about making models bigger way back when.","start":246.48,"end":255.02},{"id":12,"text":"The workhorse algorithm we're going to cover today is this thing called batch and stochastic gradient descent. Now, if you look at these and you have kind of a mathematical mind or statistical mind, you're going to realize that these are really stupid algorithms, hopefully. They're really simple. But that simplicity is what allowed us to scale them up and run them on huge amounts of data and build these crazy models. And so like stochastic gradient descent, I've run in the last 24 hours for whatever it's worth. There are much more sophisticated algorithms that you may have seen in optimization classes.","start":256.16,"end":283.36},{"id":13,"text":"We're not going to cover those. And the last bit, I'm going to tell you a little bit about normal equations. The normal equations basically are an excuse for me to give you some notation about matrices and vectors. And that's because if this part of the section feels a little bit unclear to you, like it's just not kind of clicking to you, you kind of either vaguely remember it or maybe you haven't seen it.","start":284.02,"end":301.42},{"id":14,"text":"we have these wonderful classes on friday where you can practice things like this and you will have kind of a little bit of calculus over matrices and vectors you will end up by the end of this course using that kind of stuff as second hand but it can be mysterious so spend a little bit of time at the beginning and invest and use these great ta courses like this course one of the nice things about it you know the professors are kind of interchangeable but the course staff like what sets it up so that you have homeworks and you have great ta sections and all the rest","start":302.19,"end":330.27},{"id":15,"text":"Please avail yourself of that. We want everybody to get through and have a great time. Okay? All right. So that's what the last part is. In this part, if you find yourself being like, I don't understand what that symbol means, or I don't understand why that transformation, please, of course, feel free to ask. But if it's kind of not sticking with you, please take advantage of those Friday TA lectures and the rest of the resources that are out there. Okay? All right. Let's get started. Okay. So...","start":330.88,"end":354.64}],"notes":["本段主要讲解课程中涉及的矩阵和向量微积分内容，强调学生需要在课程初期投入时间学习这些基础知识。讲者提到周五的助教课程是练习这些内容的好机会，并指出课程设置包括作业和优秀的助教辅导，帮助学生掌握这些概念。","讲者提到矩阵和向量的微积分可能对部分学生来说比较神秘，因此建议学生在课程初期花时间学习这些内容，并利用助教课程和课程资源来加深理解。","讲者强调课程的结构设计，包括作业和助教辅导，旨在帮助学生掌握课程内容。同时，讲者指出教授之间可以互换，但课程团队的设置确保了学习资源的丰富性。","讲者鼓励学生充分利用课程提供的资源，包括助教课程和其他学习材料，以确保能够顺利通过课程并获得良好的学习体验。","讲者提到，虽然课程内容可能在初期显得复杂，但通过持续的学习和利用资源，学生可以逐步掌握这些概念。","讲者最后提醒学生，如果在学习过程中遇到不理解的符号或变换，应主动提问并利用课程提供的资源进行学习。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.72,"end":354.64,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":177.72,"text":"I generally talk fast when I get excited. I'm not that excited right now, I guess, but I will be excited later. And when I get excited, I'll talk fast. Thank goodness that most of you will watch these on recordings and you can watch them at 50% speed. I'll do my best to slow down, but genetically it's been rough. All right, so let's get to it. So we're going to talk about our first..."},{"start":198.14,"text":"first kind of exposure to a formal learning algorithm. The hope is maybe you've seen some of these concepts before. So today is going to be a little bit heavier on notation. It's going to be heavier on kind of the basics that we're going to use. And we're going to talk about kind of the most classical learning algorithm, which predates machine learning by a lot, which is linear regression."},{"start":217.68,"text":"Then we're going to see linear regression. We're going to see that this kind of way of fitting a line is actually quite interesting. It's actually a pretty robust technique. A lot of science was done on it. A lot of machine learning was done on it. And we're going to see elements that have really dominated a lot of what machine learning does now. So one of the big things that happened in machine learning were as kind of strange and bizarre as this is to say, we made the models a lot bigger. It's kind of that dumb. We made the models that bigger. And as they say, we made the GPUs go burn."},{"start":246.48,"text":"and then we got AI. Now that version is not too far away. And I worked on it. You should see my Stanford job talk about making models bigger way back when."},{"start":256.16,"text":"The workhorse algorithm we're going to cover today is this thing called batch and stochastic gradient descent. Now, if you look at these and you have kind of a mathematical mind or statistical mind, you're going to realize that these are really stupid algorithms, hopefully. They're really simple. But that simplicity is what allowed us to scale them up and run them on huge amounts of data and build these crazy models. And so like stochastic gradient descent, I've run in the last 24 hours for whatever it's worth. There are much more sophisticated algorithms that you may have seen in optimization classes."},{"start":284.02,"text":"We're not going to cover those. And the last bit, I'm going to tell you a little bit about normal equations. The normal equations basically are an excuse for me to give you some notation about matrices and vectors. And that's because if this part of the section feels a little bit unclear to you, like it's just not kind of clicking to you, you kind of either vaguely remember it or maybe you haven't seen it."},{"start":302.19,"text":"we have these wonderful classes on friday where you can practice things like this and you'll have kind of a little bit of calculus over matrices and vectors you will end up by the end of this course using that kind of stuff as second hand but it can be mysterious so spend a little bit of time at the beginning and invest and use these great ta courses like this course one of the nice things about it you know the professors are kind of interchangeable but the course staff like what sets it up so that you have homeworks and you have great ta sections and all the rest"},{"start":330.88,"text":"Please avail yourself of that. We want everybody to get through and have a great time. Okay? All right. So that's what the last part is. In this part, if you find yourself being like, I don't understand what that symbol means, or I don't understand why that transformation, please, of course, feel free to ask. But if it's kind of not sticking with you, please take advantage of those Friday TA lectures and the rest of the resources that are out there. Okay? All right. Let's get started. Okay. So..."}],"speech_gaps":[],"frame":"../frames/v049/002.webp","frame_time":189.72},{"title":"监督学习的基本设定","segments":[{"id":16,"text":"The basics of supervised learning is going to be a hypothesis. And this is just a function from some abstract set X to some abstract set Y that we're going to do. And it's that hypothesis or prediction. We'll talk a lot about what it means to make a good hypothesis or prediction, but let's look at some examples of kind of the types that we might deal with.","start":356.03,"end":375.05},{"id":17,"text":"So one example is we could have X being the space of all images, and then Y can be a fixed set of labels like, does it contain a cat or a dog or a horse or a person or a building, whatever. Those fixed set of labels are something that we could learn a function H that we hopefully apply to a bunch of images, and then learn when a new image comes that wasn't something that we saw ahead of time, we can still classify it as a horse or car or whatever. It can be text.","start":375.76,"end":402.96},{"id":18,"text":"It can be house data. In text, you could imagine classifying things, whether they're positive or negative, whether it was a positive review about a product, all the rest of it. When it's house data, we'll look at this. It could also be a price. So Y doesn't have to be just categorical labels. It doesn't have to be yes or no. It doesn't have to be cat or dog. It could be a real number. It could be a scalar value. It could be the price of a house or something like this. So this is kind of what we're doing. Now, what makes it supervised is this training set.","start":403.58,"end":434.73},{"id":19,"text":"So what we do is we imagine that we've collected some data. So we collect some data, which are these pairs, x and y pairs. And each one of them, as you can imagine, is some kind of image and some kind of label for that image. This is a picture. This is an image of a cat. This is an image. This is an image of a dog. The x is the image. The y is the label set that's there. Now, we'll use this notation.","start":435.24,"end":456.32},{"id":20,"text":"this kind of superscript notation, what that indicates is that's the first example, that's the nth example, if I ever want to refer to them. The ith example, the jth example, something like that. Now, I've been pretty vague. This is a pretty vague definition. I mean, it's a pretty general one. X is just some set and Y is just some set. But that's what's kind of exciting about supervised machine learning. It applies to a huge range of different data types and different things that you may want to do with it.","start":457.33,"end":481.93},{"id":21,"text":"Among all of those hypotheses that are out there, and if you've taken any kind of math classes, you know there's a huge range of hypotheses that go from one set X to another set Y, just potentially uncountably many if Y is some big continuous set. So the question is, what makes a good prediction?","start":488.88,"end":504.6},{"id":22,"text":"Now, this is a subtle problem. This is something we're going to talk about for a while. We're going to talk about good in several contexts and more refined notions of good over the next couple of weeks. But kind of intuitively what we're after in this modeling question is we want a function that, you know, to use a fancy word that you don't have to use now, we want it to generalize. So what we would like to do is that this X and Y that we're selecting here, we'd like it to come from some set that's representative in some way that we can make precise. And then later when we're shown new images that are not from that original set,","start":505.2,"end":533.74}],"notes":["本段介绍了监督学习的基本设定，即通过一个从输入空间X到输出空间Y的假设函数来进行预测。监督学习的核心在于利用训练集中的数据对模型进行训练，从而使得模型能够对新的输入数据做出准确的预测。","课程中举了多个例子来说明监督学习的应用场景，包括图像分类、文本分类以及房价预测等。这些例子展示了监督学习可以处理不同类型的输出，如分类标签或连续值。","监督学习的关键在于训练集的使用，训练集由输入-输出对组成，用于训练模型以学习从输入到输出的映射关系。这种映射关系可以是任意的，只要能够满足模型的泛化能力。","课程还提到，监督学习的定义非常广泛，适用于各种不同的数据类型和任务。这种广泛性使得监督学习成为机器学习中非常重要的方法之一。","在监督学习中，模型的目标是找到一个能够很好地泛化到新数据的假设函数。这意味着模型不仅要能够准确地拟合训练数据，还要能够对未见过的数据做出合理的预测。","课程最后提到，监督学习的定义虽然非常一般，但其应用范围非常广泛，这使得监督学习成为解决各种实际问题的重要工具。"],"formulas":[],"uncertainties":[],"diagram":"none","start":356.03,"end":533.74,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":356.03,"text":"The basics of supervised learning is going to be a hypothesis. And this is just a function from some abstract set X to some abstract set Y that we're going to do. And it's that hypothesis or prediction. We'll talk a lot about what it means to make a good hypothesis or prediction, but let's look at some examples of kind of the types that we might deal with."},{"start":375.76,"text":"So one example is we could have X being the space of all images, and then Y can be a fixed set of labels like, does it contain a cat or a dog or a horse or a person or a building, whatever. Those fixed set of labels are something that we could learn a function H that we hopefully apply to a bunch of images, and then learn when a new image comes that wasn't something that we saw ahead of time, we can still classify it as a horse or car or whatever. It can be text."},{"start":403.58,"text":"It can be house data. In text, you could imagine classifying things, whether they're positive or negative, whether it was a positive review about a product, all the rest of it. When it's house data, we'll look at this. It could also be a price. So Y doesn't have to be just categorical labels. It doesn't have to be yes or no. It doesn't have to be cat or dog. It could be a real number. It could be a scalar value. It could be the price of a house or something like this. So this is kind of what we're doing. Now, what makes it supervised is this training set."},{"start":435.24,"text":"So what we do is we imagine that we've collected some data. So we collect some data, which are these pairs, x and y pairs. And each one of them, as you can imagine, is some kind of image and some kind of label for that image. This is a picture. This is an image of a cat. This is an image. This is an image of a dog. The x is the image. The y is the label set that's there. Now, we'll use this notation."},{"start":457.33,"text":"this kind of superscript notation, what that indicates is that's the first example, that's the nth example, if I ever want to refer to them. The ith example, the jth example, something like that. Now, I've been pretty vague. This is a pretty vague definition. I mean, it's a pretty general one. X is just some set and Y is just some set. But that's what's kind of exciting about supervised machine learning. It applies to a huge range of different data types and different things that you may want to do with it."},{"start":488.88,"text":"Among all of those hypotheses that are out there, and if you've taken any kind of math classes, you know there's a huge range of hypotheses that go from one set X to another set Y, just potentially uncountably many if Y is some big continuous set. So the question is, what makes a good prediction?"},{"start":505.2,"text":"Now, this is a subtle problem. This is something we're going to talk about for a while. We're going to talk about good in several contexts and more refined notions of good over the next couple of weeks. But kind of intuitively what we're after in this modeling question is we want a function that, you know, to use a fancy word that you don't have to use now, we want it to generalize. So what we would like to do is that this X and Y that we're selecting here, we'd like it to come from some set that's representative in some way that we can make precise. And then later when we're shown new images that are not from that original set,"}],"speech_gaps":[],"frame":"../frames/v049/003.webp","frame_time":368.03},{"title":"监督学习设定","segments":[{"id":23,"text":"this thing is going to label it. It's going to be able to look at a new picture of a cat and say, yep, that's a cat, not a dog. And so that's something that's good, that generalization. That's going to be the heart of machine learning. I train on this training set. I look at that. I'm going to compute my age. And somehow, some properties of the training set and the hypothesis class, that is, the ages that I consider,","start":534.7,"end":552.55},{"id":24,"text":"are going to mean that I generalize to new and unseen things. And what I mentioned before, what we'll talk about first, there's H's that are really simple. And we can prove that if they're really simple, they have this kind of property that they will transfer. But what has been the revolution for the last 10 or so years, maybe more, is actually training H's that are really, really big. That means that they are encoded by huge programs, huge numbers of what are called weights. And we're going to talk about that as we get into more of the class. So this is the way it works. This is the basic setup.","start":553.26,"end":582.71},{"id":25,"text":"Please feel free to ask questions about it. But this is kind of how it works. And so we're going to study this. Now, you could say, what else would you do? Well, in the second half of the course, I'm going to tell you about what happens if you don't have any labels. So this is just one of many machine learning setups you can have. But this is by far one of the most common and kind of working. Actually, it's kind of interesting. In my career, this is a technology. You can reliably do this in a number of situations. You can make these functions that generalize. That's really exciting. All right.","start":583.53,"end":610.44},{"id":26,"text":"Now, a little bit of terminology here at the end. If Y is continuous, we call it a regression problem. That's real numbers, prices. We're going to look at regression today. The math for that is just easier. The derivatives, the things that we have to compute, they're just easier to compute by hand. They'll hopefully be a bit more familiar. If Y is discrete, then it's a classification problem. Classification problems are probably things that you end up solving more in machine learning these days for a variety of reasons.","start":611.26,"end":637.47},{"id":27,"text":"For example, the way your chat GPT works is that it actually has a classifier head at the end that is guessing what's the next word. That's the way this stuff works. We'll talk about how those systems work as well. Awesome. Let's look at a first example of this using probably the most canonical, the most widely used dataset out there, which is this housing dataset, the AIMS housing dataset. This is real data. You can pull it down and play with it.","start":638.41,"end":664.4},{"id":28,"text":"All right. So these are not Bay Area prices, but don't hold that against themselves. Now, what I've done here is I've just taken some data and I put it in a Python data frame. You can do the same. And then I just looked at the sale prices and the lot sizes and all the rest. And then on the right, I visualize the data. So just one thing in general, if you have the ability to do it, look at your data. I can't stress that enough. Look at your data. It's like...","start":666.25,"end":692.13},{"id":29,"text":"you're pretty good pattern recognizers take advantage of that okay even if you're building some complicated crazy ai system still look at your data you will discover things all right so we're looking at this data here we have the sale price we have the lot area and i've plotted it in some way there okay all right now","start":692.38,"end":708.97}],"notes":["本段介绍了监督学习的基本设定，即通过训练集训练模型，使其能够对新数据进行泛化。讲者提到，泛化能力是机器学习的核心，而模型的泛化能力取决于训练集和假设类的性质。","讲者指出，简单的假设类（H）可以证明其泛化能力，但近年来的突破在于训练非常大的假设类，这些假设类由大量参数（权重）编码，这在后续课程中会进一步讨论。","监督学习有两种主要类型：回归和分类。如果输出Y是连续的，称为回归问题，如房价预测；如果Y是离散的，则称为分类问题，如文本生成中的下一个词预测。","讲者以住房数据集为例，说明了如何使用Python数据框处理数据，并可视化数据。强调了在构建复杂模型之前，应先查看数据以发现潜在模式。","讲者提到，即使在构建复杂的AI系统时，也应查看数据，因为数据中可能包含有价值的信息，有助于模型的改进。","讲者最后提到，住房数据集并非湾区房价，但强调了数据可视化的重要性，并鼓励学生在处理数据时进行探索。"],"formulas":[],"uncertainties":["compute my age"],"diagram":"none","start":534.7,"end":708.97,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":534.7,"text":"this thing is going to label it. It's going to be able to look at a new picture of a cat and say, yep, that's a cat, not a dog. And so that's something that's good, that generalization. That's going to be the heart of machine learning. I train on this training set. I look at that. I'm going to compute my age. And somehow, some properties of the training set and the hypothesis class, that is, the ages that I consider,"},{"start":553.26,"text":"are going to mean that I generalize to new and unseen things. And what I mentioned before, what we'll talk about first, there's H's that are really simple. And we can prove that if they're really simple, they have this kind of property that they will transfer. But what has been the revolution for So these are not Bay Area prices, but don't hold that against themselves. Now, what I've done here is I've just taken some data and I put it in a Python data frame. You can do the same. And then I just looked at the sale prices and the lot sizes and all the rest. And then on the right, I visualize the data. So just one thing in general, if you have the ability to do it, look at your data. I can't stress that enough. Look at your data. It's like..."},{"start":692.38,"text":"you're pretty good pattern recognizers take advantage of that okay even if you're building some complicated crazy ai system still look at your data you will discover things all right so we're looking at this data here we have the sale price we have the lot area and i've plotted it in some way there okay all right now"}],"speech_gaps":[],"frame":"../frames/v049/004.webp","frame_time":546.7},{"title":"监督学习设定中的线性假设","segments":[{"id":30,"text":"We need to get one more character in our story. We need to get a hypothesis. So one popular choice are these linear hypotheses, right? And you may think that these linear hypotheses, you know, they seem relatively simple. That's the hope. But they're actually industrially used, right? These are kind of the workhorse of what we're going to do. These kind of linear classification models, they show up inside pretty much every model that you use. The last step is this linear model. So these are actually, in spite of their simplicity, pretty widely used.","start":709.94,"end":738.02},{"id":31,"text":"We call them linear. It's a little bit of an abusive terminology. You'll see why we do in a second. It's because of a convention. This is technically an affine function because it has this little offset here. The way it works is you feed me an x. So let's imagine x is a scalar. And then I'm going to multiply it here times that theta 1 and then add it to theta 0. And so this gives me something wherever my x is. This is a very simple function that's taking in scalars. But this is my hypothesis class.","start":738.41,"end":763.55},{"id":32,"text":"If you look at an example prediction here, let's say that you wanted to, in our setting, we have a bunch of x's that are right here that we want to predict. And we like to predict some function that goes from the size of the house to the price in whatever units. Don't worry. Don't think too hard about what size and price mean here. I don't know what reasonable mapping. I don't think I've actually been to Ames. But these are apparently real prices. All right. So we have to do this example prediction from size to price. So we want to get a function, a linear function.","start":768.65,"end":795.89},{"id":33,"text":"that takes this size in as the x, and then out comes a price. Clear enough what our goals are? All right. Man, that's got to stop. All right. So notice that this prediction now is instead of all the wild hypotheses that could be out there, right? There's a ton of things that go from functions that go from a set of real numbers to another set of real numbers. We've now really constrained it. It's entirely defined. The fancy word for this is parametrically. It's entirely defined by these two little parameters.","start":796.42,"end":825.15},{"id":34,"text":"No matter how many houses we see, we're only going to, as we'll say, learn those two parameters or estimate those two parameters. And that's going to be the way that we transfer.","start":825.93,"end":833.61},{"id":35,"text":"So it's a huge reduction in the space of functions that we've just done. So it seems like maybe not very much happened on the slide, but we went from uncountably many functions, we still have uncountably many functions, went to this really small class of lines. So what do these look like, by the way, just to draw them, just to make sure it's extra clear why we call them linear functions? Well, what is their value at 0? Well, that value of 0 is going to be theta 0.","start":834.55,"end":856.65},{"id":36,"text":"And then it's going to have a slope. And that slope at 1 is going to be here, theta 0 plus theta 1. This is 1. Hopefully, that's clear. All right, awesome. So with that, we're going to fit a line to this data. Now, which line are we going to fit? We're going to come to that in a second. But intuitively, what should that line, what would be a good line to fit? Well, it's one that when we give it an x, so I feed it in some x here, let's say this point.","start":857.33,"end":886.46}],"notes":["本段介绍了监督学习中线性假设的基本概念，强调了线性模型的简单性和广泛使用。线性模型虽然简单，但被广泛应用于各种模型中，是机器学习中的基础工具。","讲者指出，线性模型实际上是仿射函数，因为它包含了一个偏置项（theta 0）。这种模型通过将输入特征（x）乘以权重（theta 1）并加上偏置项（theta 0）来生成输出。","在实际应用中，线性模型被用来预测从输入特征（如房屋大小）到输出（如价格）的映射关系。虽然具体的映射意义可能不明确，但这些数据是真实的。","线性模型通过参数（theta 0 和 theta 1）完全定义，这使得模型的假设空间大大缩小，从无限多的函数减少到所有可能的直线。","讲者通过解释线性函数在0点的值（theta 0）和斜率（theta 0 + theta 1）来进一步说明线性模型的结构，强调了参数对模型行为的影响。","最后，讲者提到接下来将讨论如何选择合适的线性模型来拟合数据，这为后续的模型训练和优化奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":709.94,"end":886.46,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":709.94,"text":"We need to get one more character in our story. We need to get a hypothesis. So one popular choice are these linear hypotheses, right? And you may think that these linear hypotheses, you know, they seem relatively simple. That's the hope. But they're actually industrially used, right? These are kind of the workhorse of what we're going to do. These kind of linear classification models, they show up inside pretty much every model that you use. The last step is this linear model. So these are actually, in spite of their simplicity, pretty widely used. Okay, so what is age?"},{"start":738.41,"text":"We call them linear. It's a little bit of an abusive terminology. You'll see why we do in a second. It's because of a convention. This is technically an affine function because it has this little offset here. The way it works is you feed me an x. So let's imagine x is a scalar. And then I'm going to multiply it here times that theta 1 and then add it to theta 0. And so this gives me something wherever my x is. This is a very simple function that's taking in scalars. But this is my hypothesis class."},{"start":768.65,"text":"If you look at an example prediction here, let's say that you wanted to, in our setting, we have a bunch of x's that are right here that we want to predict. And we like to predict some function that goes from the size of the house to the price in whatever units. Don't worry. Don't think too hard about what size and price mean here. I don't know what reasonable mapping. I don't think I've actually been to Ames. But these are apparently real prices. All right. So we have to do this example prediction from size to price. So we want to get a function, a linear function."},{"start":796.42,"text":"that takes this size in as the x, and then out comes a price. Clear enough what our goals are? All right. Man, that's got to stop. All right. So notice that this prediction now is instead of all the wild hypotheses that could be out there, right? There's a ton of things that go from functions that go from a set of real numbers to another set of real numbers. We've now really constrained it. It's entirely defined. The fancy word for this is parametrically. It's entirely defined by these two little parameters."},{"start":825.93,"text":"No matter how many houses we see, we're only going to, as we'll say, learn those two parameters or estimate those two parameters. And that's going to be the way that we transfer."},{"start":834.55,"text":"So it's a huge reduction in the space of functions that we've just done. So it seems like maybe not very much happened on the slide, but we went from uncountably many functions, we still have uncountably many functions, went to this really small class of lines. So what do these look like, by the way, just to draw them, just to make sure it's extra clear why we call them linear functions? Well, what is their value at 0? Well, that value of 0 is going to be theta 0."},{"start":857.33,"text":"And then it's going to have a slope. And that slope at 1 is going to be here, theta 0 plus theta 1. This is 1. Hopefully, that's clear. All right, awesome. So with that, we're going to fit a line to this data. Now, which line are we going to fit? We're going to come to that in a second. But intuitively, what should that line, what would be a good line to fit? Well, it's one that when we give it an x, so I feed it in some x here, let's say this point."}],"speech_gaps":[],"frame":"../frames/v049/005.webp","frame_time":721.94},{"title":"监督学习设定中的预测与误差最小化","segments":[{"id":37,"text":"When I look at the line, my prediction is on the line. So if I fed it in something at 1200, my prediction would be this point here. If I could draw straight with this thing. Let me try to draw a little bit straighter. Anyway, my prediction would be on that line. Is that clear? When I take the x, I put it into the hypothesis, it gives me that line. Cool. Now, what would be good? Well, one thing that would be good is because we have this training set, is that every time we put a point into this data set, whether it's here, here we didn't do such a good job, right? We're really, really far from the line.","start":887.4,"end":914.58},{"id":38,"text":"Here and here, we seem to have done a really, really great job. And so that we're going to try and do those errors that we make. Those are how far off we are in the price. We're going to try and minimize those. This has a really fancy name. It's called empirical risk minimization. I don't think you need to know that name, but you'll sometimes hear me slip and say ERM. And that's what your empirical risk minimization means. Okay, cool.","start":915.29,"end":937.2},{"id":39,"text":"So here's a nicer picture that I generated where the function's behaving much more nicely. So each point here is one of those data points that we saw. And here, we're trying to minimize this little line through it. Now, the idea, of course, which is nice about the line is if you just had the training set, the way you would potentially do a prediction, there's actually not a bad way to do it. We won't talk about it too much today. You do what's called nearest neighbors. You take in an x. You kind of look in the neighbor of x. Maybe you average them.","start":938.56,"end":966.19},{"id":40,"text":"That could be an interesting prediction function. What's nice about H is it extends to every single value. And it extends in kind of a smooth way. And so hopefully what that means is that if there's lots of gyrations here, we capture that main trend. We get the main part of the prediction, which makes it kind of a good predictor overall. OK. All right. Now, one other thing which you can see from this. Oops. Let's get that guy up.","start":966.81,"end":996.04},{"id":41,"text":"There's a slight mismatch there. Sorry for that. So as we look through here, if you look at that line that I drew, you could argue that you should draw a different line. You're like, oh, I like this other line a little bit better. You know, it kind of goes, oops, let's go in here. It goes like this, all the way. Oh, I definitely don't like that line.","start":996.58,"end":1012.9},{"id":42,"text":"There's one line there. Maybe I draw like this. It's a terrible line. So how did I pick this one line that's in there? And that's what we're going to do, this ERM, this thing. We're going to look at the data, and we're going to have to be able to compute that. But the point is, is no line looks like it's absolutely perfect. And that's going to be a theme throughout most of what we do. Your data has a couple of different things in it. Sometimes...","start":1013.5,"end":1032.58},{"id":43,"text":"It's imperfect because we're not modeling something. So probably the rate that you're willing to pay for a house depends on more than the lot size. You don't just care how big the lot is. You may care if it's a nice house, if it's close to things you care about, all the rest. We'll come back in a minute to about how we incorporate that. But the other thing is, even if we added in all those features, usually, there will be some error. And so we're going to worry a lot in this class about the error.","start":1033.31,"end":1057.66}],"notes":["本段讲解了监督学习中预测模型的基本概念，即通过训练数据拟合一条直线，预测输入值对应的输出。讲者提到，预测结果会落在这条直线上，例如输入1200时，预测值为该点。同时，讲者指出，模型在某些点上表现良好，而在其他点上则存在较大误差。","讲者提到，误差最小化是监督学习中的核心目标之一，称为经验风险最小化（ERM）。虽然这个术语可能不需要特别记忆，但讲者会偶尔使用。讲者强调，ERM的目标是减少预测值与实际值之间的差距。","讲者进一步解释了预测函数的性质，即它能够扩展到所有可能的输入值，并以平滑的方式进行预测。这使得模型能够捕捉数据中的主要趋势，从而成为整体预测的有力工具。","讲者指出，模型在拟合数据时无法完美匹配所有点，这是监督学习中的一个普遍现象。数据本身可能包含多种因素，而模型无法完全捕捉所有影响因素，因此存在误差。","讲者以房价预测为例，说明模型可能无法完全反映所有影响房价的因素，如房屋质量、地理位置等。即使引入了这些特征，仍然可能存在误差，因此需要关注误差的建模和分析。","讲者强调，监督学习的核心目标之一是减少预测误差，而误差的存在是由于模型无法完全捕捉数据中的所有信息。因此，学习和建模过程需要关注如何有效减少误差。"],"formulas":[],"uncertainties":[],"diagram":"none","start":887.4,"end":1057.66,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":887.4,"text":"When I look at the line, my prediction is on the line. So if I fed it in something at 1200, my prediction would be this point here. If I could draw straight with this thing. Let me try to draw a little bit straighter. Anyway, my prediction would be on that line. Is that clear? When I take the x, I put it into the hypothesis, it gives me that line. Cool. Now, what would be good? Well, one thing that would be good is because we have this training set, is that every time we put a point into this data set, whether it's here, here we didn't do such a good job, right? We're really, really far from the line."},{"start":915.29,"text":"Here and here, we seem to have done a really, really great job. And so that we're going to try and do those errors that we make. Those are how far off we are in the price. We're going to try and minimize those. This has a really fancy name. It's called empirical risk minimization. I don't think you need to know that name, but you'll sometimes hear me slip and say ERM. And that's what your empirical risk minimization means. Okay, cool."},{"start":938.56,"text":"So here's a nicer picture that I generated where the function's behaving much more nicely. So each point here is one of those data points that we saw. And here, we're trying to minimize this little line through it. Now, the idea, of course, which is nice about the line is if you just had the training set, the way you would potentially do a prediction, there's actually not a bad way to do it. We won't talk about it too much today. You do what's called nearest neighbors. You take in an x. You kind of look in the neighbor of x. Maybe you average them."},{"start":966.81,"text":"That could be an interesting prediction function. What's nice about H is it extends to every single value. And it extends in kind of a smooth way. And so hopefully what that means is that if there's lots of gyrations here, we capture that main trend. We get the main part of the prediction, which makes it kind of a good predictor overall. OK. All right. Now, one other thing which you can see from this. Oops. Let's get that guy up."},{"start":996.58,"text":"There's a slight mismatch there. Sorry for that. So as we look through here, if you look at that line that I drew, you could argue that you should draw a different line. You're like, oh, I like this other line a little bit better. You know, it kind of goes, oops, let's go in here. It goes like this, all the way. Oh, I definitely don't like that line."},{"start":1013.5,"text":"There's one line there. Maybe I draw like this. It's a terrible line. So how did I pick this one line that's in there? And that's what we're going to do, this ERM, this thing. We're going to look at the data, and we're going to have to be able to compute that. But the point is, is no line looks like it's absolutely perfect. And that's going to be a theme throughout most of what we do. Your data has a couple of different things in it. Sometimes..."},{"start":1033.31,"text":"It's imperfect because we're not modeling something. So probably the rate that you're willing to pay for a house depends on more than the lot size. You don't just care how big the lot is. You may care if it's a nice house, if it's close to things you care about, all the rest. We'll come back in a minute to about how we incorporate that. But the other thing is, even if we added in all those features, usually, there will be some error. And so we're going to worry a lot in this class about the error."}],"speech_gaps":[],"frame":"../frames/v049/006.webp","frame_time":899.4},{"title":"监督学习设定中的线性模型与特征扩展","segments":[{"id":44,"text":"of how we do in these predictions and how well the error on our training sets manifest on what are called the test sets when we take it out into real life. All right. So look at something slightly more interesting. So here we're going to add in the number of bedrooms. So what do you think is going to happen? Well, now we need a function that can take in pairs instead of single values. So we need to change our hypothesis class a little bit.","start":1058.19,"end":1080.43},{"id":45,"text":"Lot size and size. I guess size refers to the house size. Apologies. Now we have this function here. So how does it work? Well, if you feed me an x, then I take this guy, put him here, put this one here, put this one here. And then I hopefully have weights now I'm parameterized by. Oh, that came all back. By just those weights now. So now my function is parameterized by four weights. And hopefully it's going to fit my data a little bit better.","start":1082.66,"end":1109.48},{"id":46,"text":"The reason it should be a little bit better is I could always set some of those weights to zero and get back to the case where I only had two weights. So it seems like it's a larger or more expressive class. But if lot size and bedrooms influence price, we would hope that this hypothesis class is richer is the terminology. And that would allow us to fit our data a little bit better.","start":1110.38,"end":1128.58},{"id":47,"text":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have.","start":1132.6,"end":1152.34},{"id":48,"text":"So that allows us to write a nice little form like this. h of x is just this nice little sum. We don't have to special case the theta 0 term. And we can easily extend from 3 to however many dimensions. Awesome. OK. So that all leads into, as I said, notation. So if this is unfamiliar to you, please go to the Friday.","start":1153.55,"end":1178.55},{"id":49,"text":"you know, sessions. A lot of this is us kind of recalling notation where you're like, oh, I know that I need to look at it, or oh, I need to go and, you know, avail myself of some of the extra resources. So this notation here, we'll write theta, but we really mean this vector, which will also live in R4. It's four real numbers, okay? Four scalars. This thing here, notice now this X1, we're writing the entire example in here, and this one is 1.","start":1179.5,"end":1206.42},{"id":50,"text":"Okay, so here's 1, here's 2104 here, 4, 4, 45, 45. Clear enough? Okay.","start":1207.03,"end":1215.91}],"notes":["本段讲解了监督学习中线性模型的构建过程，特别是如何通过引入更多特征（如卧室数量）来扩展模型的表达能力。讲者指出，当特征数量增加时，模型需要能够处理多维输入，因此需要调整假设空间，使其能够处理多个特征的组合。","讲者提到，当特征数量增加时，模型参数的数量也随之增加，这使得模型能够更灵活地拟合数据。但讲者也指出，如果某些特征对目标变量（如房价）没有影响，可以通过将对应参数设为零来简化模型，从而回到更简单的形式。","讲者强调了线性模型中一个重要的约定，即假设输入向量的第一个元素始终为1，这一约定在后续的推导和公式中被广泛使用。这一约定使得模型可以统一处理常数项（如截距项）和其他特征项。","讲者进一步说明了线性模型的表达形式，即通过将参数向量与输入向量进行点积来得到预测值。这种形式使得模型可以轻松地扩展到任意维度，而无需对特定参数（如截距项）进行特殊处理。","讲者提到，为了帮助学生理解这些概念，建议他们回顾相关的课程资料或参加周五的复习会。这表明课程内容较为复杂，需要学生主动查阅资料以加深理解。","讲者最后通过具体的数值示例（如1、2104、4、45等）来说明输入向量的结构，并指出其中某些元素对应的是特征值，而某些元素（如1）则用于表示模型中的常数项。"],"formulas":[{"latex":"h(x) = \\theta_0 x_0 + \\theta_1 x_1 + \\theta_2 x_2 + \\theta_3 x_3","symbols":"h(x) 表示预测值，θ 表示参数向量，x 表示输入向量","explanation":"公式正确，表示线性回归模型，其中x_0是输入向量的第一个元素，通常设为1以包含截距项。","evidence":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have."},{"latex":"x_0 = 1","symbols":"x_0 是输入向量的第一个元素，始终设为1","explanation":"公式正确，表示输入向量的第一个元素x_0始终设为1，以包含截距项。","evidence":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have."}],"uncertainties":["在段落45中，'size refers to the house size' 的表述可能存在歧义，但根据上下文可以推断为房屋面积。"],"diagram":"none","start":1058.19,"end":1215.91,"asr_flags":[],"math_clarifications":["公式正确，无需修改。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1058.19,"text":"of how we do in these predictions and how well the error on our training sets manifest on what are called the test sets when we take it out into real life. All right. So look at something slightly more interesting. So here we're going to add in the number of bedrooms. So what do you think is going to happen? Well, now we need a function that can take in pairs instead of single values. So we need to change our hypothesis class a little bit."},{"start":1082.66,"text":"Lot size and size. I guess size refers to the house size. Apologies. Now we have this function here. So how does it work? Well, if you feed me an x, then I take this guy, put him here, put this one here, put this one here. And then I hopefully have weights now I'm parameterized by. Oh, that came all back. By just those weights now. So now my function is parameterized by four weights. And hopefully it's going to fit my data a little bit better."},{"start":1110.38,"text":"The reason it should be a little bit better is I could always set some of those weights to zero and get back to the case where I only had two weights. So it seems like it's a larger or more expressive class. But if lot size and bedrooms influence price, we would hope that this hypothesis class is richer is the terminology. And that would allow us to fit our data a little bit better."},{"start":1132.6,"text":"This is one of the reasons we call these functions linear, not affine, is that we're going to operate under this nice little convention that we're going to always assume that x0 is 1 here, which we didn't even bother to write. And I highlight this convention because it's used throughout the notes. And when I deviate from it, I will explicitly tell you. But whenever we're doing regression or classification, this is what we have."},{"start":1153.55,"text":"So that allows us to write a nice little form like this. h of x is just this nice little sum. We don't have to special case the theta 0 term. And we can easily extend from 3 to however many dimensions. Awesome. OK. So that all leads into, as I said, notation. So if this is unfamiliar to you, please go to the Friday."},{"start":1179.5,"text":"you know, sessions. A lot of this is us kind of recalling notation where you're like, oh, I know that I need to look at it, or oh, I need to go and, you know, avail myself of some of the extra resources. So this notation here, we'll write theta, but we really mean this vector, which will also live in R4. It's four real numbers, okay? Four scalars. This thing here, notice now this X1, we're writing the entire example in here, and this one is 1."},{"start":1207.03,"text":"Okay, so here's 1, here's 2104 here, 4, 4, 45, 45. Clear enough? Okay."}],"speech_gaps":[],"frame":"../frames/v049/007.webp","frame_time":1070.19},{"title":"监督学习设定中的参数与特征","segments":[{"id":51,"text":"We're going to call these thetas here parameters. And these xi are going to be input or features. Remember when I talked to you about before, which I said you could add in these extra features of your problem? That's, for now, going to be a modeling decision. Later, we're going to see an interesting idea about how we can even learn those features. That was part of what was called the deep learning revolution, where you were able to actually impute the representation of your data just by throwing more data at it. We'll see that in a couple of weeks. But for now, it's a modeling decision. You come and write some rule, some piece of code that","start":1220.78,"end":1249.84},{"id":52,"text":"takes the number and puts it in as the feature. And it's not trivial. It normalized the lot size here. It said 45 instead of 45k. But in general, they could be even more interesting features of your problem. And the point is that extends naturally to linear models. So far, so good? All right.","start":1250.1,"end":1267.88},{"id":53,"text":"So X and Y has a fancy name, training example. It's an element of the training set. And the reason that we call it training is we're going to take that set and we're going to train our model on it. It's kind of the terminology for it. We're going to try and figure out among all the thetas, which are our predictions, which ones fit our data best. We've been vague about what data best means, but there's a lot of ways to do that, it turns out. But they all follow the same recipe. And then, as I said before, I just wanted to highlight the example again, that XI and YI are an individual example.","start":1268.68,"end":1296.38},{"id":54,"text":"All right. So in notation in the class, you will always see this is something that you will see. This is as convention. We'll always have n be the number of examples. So you should kind of get that in your mind. And d be the number of dimensions or features. So we'll consider these either d or d plus 1 dimensional, plus 1 because of that convention. Bless you. That x0 equals 1. Please.","start":1298.98,"end":1322.76},{"id":55,"text":"Yeah, so we will almost always use lowercase n. We will try not to abuse you by having upper and lowercase n's in the same lectures, but I cannot guarantee that because especially if they're copied from handwriting, often we'll use them. We'll try not to use them both in the lecture to mean two different things. So usually we'll be a little bit consistent. The other convention you'll sometimes see sneak in is p's for parameters, but that's like a stats convention, and it doesn't really matter. None of this will really matter. If you're confused, just ask. Cool. All right.","start":1326.51,"end":1354.51},{"id":56,"text":"All right, so what do these things look like, these linear models look like? Here's one in two dimensions. This is about as high as you can really reasonably look on your data set. So here we have a bunch of different points. We have price. We have bedrooms and square feet at the bottom. And I've plotted a plane here, an affine surface.","start":1355.6,"end":1373.24},{"id":57,"text":"You could imagine a classification that was some kind of crazy curve. We'll see how to do that later. There's all kinds of nice ways to do that. But for right now, we're looking at these big linear models. And you see this is kind of a good thing in the same way. So how would you define error? Well, how close is your prediction? If you took that point, that feature point, and you went into space, how far away are you from this plane? Now, we're going to consider, as we get here, like modern models, as I mentioned, just got bigger.","start":1374.36,"end":1399.12}],"notes":["本段主要讲解监督学习中的参数和特征的概念。参数（thetas）是模型中需要学习的变量，而特征（xi）是输入数据的属性。这些特征可以是用户手动添加的，也可以通过深度学习自动学习。在模型训练过程中，我们需要找到最佳的参数来拟合数据。","在监督学习中，训练示例（X和Y）是训练集中的元素，用于训练模型。模型的目标是找到能够最好地拟合数据的参数。虽然“最好”这个概念可能模糊，但不同的方法都遵循相同的训练流程。","课程中提到，n通常表示样本数量，d表示特征数量。在某些情况下，特征数量可能加上一个常数项（如x0=1），以方便计算。这种约定在机器学习中非常常见。","在讲解线性模型时，课程提到线性模型在二维空间中表现为一个平面，而在更高维空间中则表现为一个超平面。模型的误差可以通过预测值与真实值之间的距离来衡量。","课程还提到，线性模型虽然简单，但可以通过添加更多特征或使用更复杂的模型（如深度学习）来提高性能。这些概念为后续课程内容奠定了基础。","在讨论模型误差时，课程强调了如何衡量预测值与真实值之间的距离，这为后续的损失函数和优化方法提供了理论基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1220.78,"end":1399.12,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1220.78,"text":"We're going to call these thetas here parameters. And these xi are going to be input or features. Remember when I talked to you about before, which I said you could add in these extra features of your problem? That's, for now, going to be a modeling decision. Later, we're going to see an interesting idea about how we can even learn those features. That was part of what was called the deep learning revolution, where you were able to actually impute the representation of your data just by throwing more data at it. We'll see that in a couple of weeks. But for now, it's a modeling decision. You come and write some rule, some piece of code that"},{"start":1250.1,"text":"takes the number and puts it in as the feature. And it's not trivial. It normalized the lot size here. It said 45 instead of 45k. But in general, they could be even more interesting features of your problem. And the point is that extends naturally to linear models. So far, so good? All right."},{"start":1268.68,"text":"So X and Y has a fancy name, training example. It's an element of the training set. And the reason that we call it training is we're going to take that set and we're going to train our model on it. It's kind of the terminology for it. We're going to try and figure out among all the thetas, which are our predictions, which ones fit our data best. We've been vague about what data best means, but there's a lot of ways to do that, it turns out. But they all follow the same recipe. And then, as I said before, I just wanted to highlight the example again, that XI and YI are an individual example."},{"start":1298.98,"text":"All right. So in notation in the class, you will always see this is something that you will see. This is as convention. We'll always have n be the number of examples. So you should kind of get that in your mind. And d be the number of dimensions or features. So we'll consider these either d or d plus 1 dimensional, plus 1 because of that convention. Bless you. That x0 equals 1. Please."},{"start":1326.51,"text":"Yeah, so we will almost always use lowercase n. We will try not to abuse you by having upper and lowercase n's in the same lectures, but I cannot guarantee that because especially if they're copied from handwriting, often we'll use them. We'll try not to use them both in the lecture to mean two different things. So usually we'll be a little bit consistent. The other convention you'll sometimes see sneak in is p's for parameters, but that's like a stats convention, and it doesn't really matter. None of this will really matter. If you're confused, just ask. Cool. All right."},{"start":1355.6,"text":"All right, so what do these things look like, these linear models look like? Here's one in two dimensions. This is about as high as you can really reasonably look on your data set. So here we have a bunch of different points. We have price. We have bedrooms and square feet at the bottom. And I've plotted a plane here, an affine surface."},{"start":1374.36,"text":"You could imagine a classification that was some kind of crazy curve. We'll see how to do that later. There's all kinds of nice ways to do that. But for right now, we're looking at these big linear models. And you see this is kind of a good thing in the same way. So how would you define error? Well, how close is your prediction? If you took that point, that feature point, and you went into space, how far away are you from this plane? Now, we're going to consider, as we get here, like modern models, as I mentioned, just got bigger."}],"speech_gaps":[],"frame":"../frames/v049/008.webp","frame_time":1232.78},{"title":"监督学习设定与最小二乘法","segments":[{"id":58,"text":"They have thousands, hundreds of thousands, millions, billions, trillions of parameters. Some of the models now have trillions of parameters in them. They're not all fed into a line like this. But they'll conventionally have 10,000 dimensional spaces that are the last piece of the model. That's really hard to visualize. So we're going to use a lot of vector notation and other things to deal with it. And that's why we use this notation, so you can simplify and think about it and understand how to manipulate it. In one or two dimensions, you can kind of picture it. But high dimensional space is a weird thing. OK.","start":1400.11,"end":1431.22},{"id":59,"text":"All right. OK. So let's get back to it. So we want to choose some theta such that, as we talked about multiple times, h of x is approximately equal to y. If I give you an x and a new thing, you want to be approximately close. You'd like the price to be close and so on. So how do we do it? Well, here comes least squares. So maybe you've seen this before. I hope you've seen it before. By show of hands, who's seen least squares before? Awesome. Fantastic. All right. Good.","start":1432.48,"end":1463.35},{"id":60,"text":"Least squares, super conventional thing. If you haven't seen it before, please, again, Friday is a good place to look at it. We'll cover it again just in our notation to make sure everything is all right. Now, what happens? So you have this idea here, j theta. That's going to be the loss that you incur. And it's broken down into terms on every single element of the data set. And here you have h theta of xi minus yi. So this is the error.","start":1464.89,"end":1489.82},{"id":61,"text":"remember we kept drawing those pictures like this guy right here? These two things are the same.","start":1490.45,"end":1494.45},{"id":62,"text":"remember we kept drawing those pictures like this guy right here? These two things are the same.","start":1494.55,"end":1501.99},{"id":63,"text":"y i, that's the prediction error. Then what we do is we square it. And we square it because we want","start":1501.99,"end":1506.73},{"id":64,"text":"to have something that we have a positive or non-negative number there. It could be zero if","start":1506.73,"end":1511.07},{"id":65,"text":"it were exactly equal. And then what we're going to do is we're going to try and pick the theta","start":1511.07,"end":1514.61},{"id":66,"text":"that minimizes it, okay? Just by show of hands, how many people know the arg min notation?","start":1514.61,"end":1519.43},{"id":67,"text":"Perfect. All right, we're doing great. Okay, so then in that case you know","start":1520.87,"end":1524.69},{"id":68,"text":"exactly what goes on here. We're gonna solve over j theta and we're gonna try","start":1524.69,"end":1527.91},{"id":69,"text":"and pick the thing that minimizes this function. And so intuitively what that","start":1527.91,"end":1531.73},{"id":70,"text":"says is we're gonna pick the theta so that on average over all of our training","start":1531.73,"end":1535.15},{"id":71,"text":"points, we minimize that squared error. Okay, so we're gonna instead of measuring","start":1535.15,"end":1540.27},{"id":72,"text":"the error just as a sum, we're gonna square that distance. So things that are","start":1540.27,"end":1543.73},{"id":73,"text":"really close, they're gonna, you know, go down. Things are really big, we're gonna","start":1543.73,"end":1546.93},{"id":74,"text":"going to pay for.","start":1546.93,"end":1547.29},{"id":75,"text":"Now, why do we do squared error?","start":1548.81,"end":1550.29},{"id":76,"text":"Oh, go ahead.","start":1550.37,"end":1550.57},{"id":77,"text":"Sorry, I might be, you might be about to say it,","start":1551.39,"end":1556.33},{"id":78,"text":"but the squaring, presumably you could take another power.","start":1556.43,"end":1561.45},{"id":79,"text":"Yeah, yeah, sure thing.","start":1561.57,"end":1562.41},{"id":80,"text":"To even be even stricter on room picking.","start":1562.61,"end":1565.59},{"id":81,"text":"Yeah, exactly right.","start":1565.85,"end":1566.93},{"id":82,"text":"So the question is, is why did you pick two here?","start":1567.03,"end":1569.27},{"id":83,"text":"And why did you do it?","start":1569.49,"end":1570.79},{"id":84,"text":"That's a great question.","start":1571.11,"end":1571.77},{"id":85,"text":"So could you pick other values?","start":1571.91,"end":1573.29},{"id":86,"text":"Certainly, you could pick another power.","start":1573.39,"end":1574.95},{"id":87,"text":"You could pick the absolute value, right?","start":1575.05,"end":1576.71}],"notes":["本段讨论监督学习中模型的参数规模和高维空间的可视化问题，强调使用向量符号来处理高维数据。接着，课程转向最小二乘法，解释其基本思想：通过最小化预测误差的平方来选择最佳参数θ。","最小二乘法是一种常规方法，通过将预测误差平方来确保非负性，并选择使总误差最小的θ。课程还提到，虽然可以使用其他幂次（如绝对值），但平方误差是更常见的选择。","课程提到，平方误差的使用并非唯一选择，但其优势在于数学上的便利性，例如可以使用解析解求解。此外，课程还提到，平方误差的使用与对误差的严格性有关。","课程通过提问的方式引导学生思考为什么选择平方误差而不是其他形式，例如绝对值。这表明平方误差的选择有其理论依据，但具体原因需要进一步解释。","课程提到，虽然可以使用其他形式的误差函数，但平方误差在实际应用中更为常见，因为它允许解析解，并且在优化过程中更容易处理。","课程还提到，平方误差的使用与对误差的严格性有关，即通过平方来放大大误差的影响，从而鼓励模型更精确地拟合数据。"],"formulas":[],"uncertainties":["room picking"],"diagram":"none","start":1400.11,"end":1576.71,"asr_flags":[76],"math_clarifications":["原始片段中提到的最小化平方误差的目标未被正确表达为数学公式。公式中缺少了关键的平方误差项，且 'argmin' 和 'loss' 的使用不明确，无法准确反映最小化目标。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1400.11,"text":"They have thousands, hundreds of thousands, millions, billions, trillions of parameters. Some of the models now have trillions of paramete nd then what we're going to do is we're going to try and pick the theta"},{"start":1514.61,"text":"that minimizes it, okay? Just by show of hands, how many people know the arg min notation?"},{"start":1520.87,"text":"Perfect. All right, we're doing great. Okay, so then in that case you know"},{"start":1524.69,"text":"exactly what goes on here. We're gonna solve over j theta and we're gonna try"},{"start":1527.91,"text":"and pick the thing that minimizes this function. And so intuitively what that"},{"start":1531.73,"text":"says is we're gonna pick the theta so that on average over all of our training"},{"start":1535.15,"text":"points, we minimize that squared error. Okay, so we're gonna instead of measuring"},{"start":1540.27,"text":"the error just as a sum, we're gonna square that distance. So things that are"},{"start":1543.73,"text":"really close, they're gonna, you know, go down. Things are really big, we're gonna"},{"start":1546.93,"text":"going to pay for."},{"start":1548.81,"text":"Now, why do we do squared error?"},{"start":1550.37,"text":"Oh, go ahead."},{"start":1551.39,"text":"Sorry, I might be, you might be about to say it,"},{"start":1556.43,"text":"but the squaring, presumably you could take another power."},{"start":1561.57,"text":"Yeah, yeah, sure thing."},{"start":1562.61,"text":"To even be even stricter on room picking."},{"start":1565.85,"text":"Yeah, exactly right."},{"start":1567.03,"text":"So the question is, is why did you pick two here?"},{"start":1569.49,"text":"And why did you do it?"},{"start":1571.11,"text":"That's a great question."},{"start":1571.91,"text":"So could you pick other values?"},{"start":1573.39,"text":"Certainly, you could pick another power."},{"start":1575.05,"text":"You could pick the absolute value, right?"}],"speech_gaps":[],"frame":"../frames/v049/009.webp","frame_time":1412.11},{"title":"监督学习设定中的最小二乘法与优化","segments":[{"id":88,"text":"That's a fine thing to do as well. That's a value regression kind of thing.","start":1576.71,"end":1581.09},{"id":89,"text":"2 has a nice property, which we're cheating on for a lot of least squares.","start":1581.57,"end":1584.75},{"id":90,"text":"2 we can solve exactly. And that just turns out to be because 2 is, as you'll see in a second,","start":1585.03,"end":1589.81},{"id":91,"text":"when we compute all the derivatives and do all the nice things, the derivative has a really nice form","start":1589.85,"end":1594.03},{"id":92,"text":"or the gradient has a really nice form. And that's going to let us solve it exactly.","start":1594.03,"end":1597.27},{"id":93,"text":"Historically, also if you care, like","start":1598.11,"end":1599.79},{"id":94,"text":"many of the people who were doing science way back when, when Gauss was doing least squares, because of that computational advantage, they could predict all kinds of nice things. It was an easy problem. Now, you could look at that, and I will derive for you in the next class, I'll derive for you how that least squares comes up and relates to a fancy statistical assumption, which is that the errors are approximately normal, which we'll come in and talk about a little bit later.","start":1600.38,"end":1623.7},{"id":95,"text":"And so you'll be able to derive other regressions that are in there. But the special things about least squares are it's extremely popular.","start":1624.52,"end":1630.44},{"id":96,"text":"uh in like history not like you know i think it's great right now like it's extremely popular in history and it's very easy to solve okay and that the reason i hammer on this so hard is a lot of machine learning if you look at it and i think honestly i was guilty of this so i grew up as like a math person and so when i came to machine learning and ai i kind of had this idea that i was like well why are you doing like simple algorithms why are you like you know worried about these other things and i've come to realize that really what goes on in machine learning that makes it so powerful is this trade-off between kind of how we compute things and kind of how we predict them.","start":1631.03,"end":1660.33},{"id":97,"text":"compute things and kind of how we predict them. And actually, when machine learning to me really intellectually came into its own as a field was when it broke away a little bit from stats and started to train these crazy large models and understand more what were the computational limits of what kind of models we could have. So sorry for the long digression, but I love questions. So I'm just pumping, trying to get more. That was a wonderful question. Please.","start":1660.46,"end":1680.4},{"id":98,"text":"Yeah, the 1 half is there just by convention. So one of the things is, this arg min is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for.","start":1682.92,"end":1711.82},{"id":99,"text":"Please.","start":1712.31,"end":1712.61},{"id":100,"text":"With argument, like the data that you kind of put in,","start":1713.17,"end":1716.17},{"id":101,"text":"like are they discrete or?","start":1716.19,"end":1718.19},{"id":102,"text":"Oh, fantastic.","start":1718.89,"end":1719.53},{"id":103,"text":"Yeah.","start":1719.77,"end":1719.93},{"id":104,"text":"So one of the things is, is remember,","start":1719.99,"end":1721.41},{"id":105,"text":"our hypothesis class right now,","start":1721.53,"end":1723.07},{"id":106,"text":"the way we picked it was to be continuous.","start":1723.21,"end":1725.13},{"id":107,"text":"So these can be any real value that we want.","start":1725.25,"end":1727.15},{"id":108,"text":"And so when we plug these things in here,","start":1727.27,"end":1729.15},{"id":109,"text":"we're going to have continuous value.","start":1729.27,"end":1730.45},{"id":110,"text":"So we're going to do continuous optimization.","start":1730.57,"end":1731.75},{"id":111,"text":"Discrete optimization, you can do.","start":1732.81,"end":1734.39},{"id":112,"text":"There are procedures that people do,","start":1734.53,"end":1736.45},{"id":113,"text":"fancy ones, you know, integer linear programming, yada, yada, yada.","start":1736.59,"end":1738.89},{"id":114,"text":"yada, yada, yada.","start":1738.91,"end":1739.55},{"id":115,"text":"Those are generally pretty hard.","start":1739.89,"end":1741.37},{"id":116,"text":"Most modern machine learning, one of the tricks","start":1741.37,"end":1743.33},{"id":117,"text":"are, even when you have something that's discrete,","start":1743.33,"end":1745.23},{"id":118,"text":"like our models that work on words,","start":1745.39,"end":1747.01},{"id":119,"text":"underneath their covers, they're actually","start":1747.19,"end":1748.81},{"id":120,"text":"doing something continuous.","start":1748.81,"end":1749.77},{"id":121,"text":"And so the parameter space will almost always be continuous.","start":1749.99,"end":1752.39},{"id":122,"text":"So you can compute things like gradients and derivatives","start":1752.55,"end":1755.23}],"notes":["本段主要讲解了最小二乘法的计算优势，以及其在历史上的应用。教授提到，最小二乘法之所以受欢迎，是因为它计算简单，且在统计假设下（误差近似正态分布）具有良好的性质。此外，教授还强调了机器学习中计算与预测之间的权衡，以及现代机器学习如何通过连续优化来处理离散问题。"],"formulas":[{"latex":"arg\\min_{\\theta} \\frac{1}{2} \\sum_{i=1}^{n} (y_i - \\theta x_i)^2","symbols":"最小二乘法的目标函数","explanation":"公式正确，表示最小化均方误差的目标函数，其中1/2是为简化导数计算而引入的常数因子。","evidence":"Yeah, the 1 half is there just by convention. So one of the things is, this arg min is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for."},{"latex":"\\frac{\\partial}{\\partial \\theta} \\left(\\frac{1}{2} \\sum_{i=1}^{n} (y_i - \\theta x_i)^2\\right) = 0","symbols":"最小二乘法的导数为零","explanation":"公式正确，表示对目标函数求导并令其为零，以找到最小值点。","evidence":"Yeah, the 1 half is there just by convention. So one of the things is, this arg min is insensitive to constants. If I change this to 25 over 1 half, this would be totally unaffected. I'd get the same theta. So the constant doesn't matter. The reason we do this is, it's this convention when we compute the derivative in a minute, these things are going to cancel. And that just makes things a little bit nicer. It's kind of like the cooking show view of math, where we set it up so that it looks nice. And when you do it by yourself, it's always a gigantic mess. And then you clean it up later. That's all it's there for."}],"uncertainties":["1/2 的存在是否完全由惯例决定","离散优化的具体方法（如整数线性规划）是否被正确提及"],"diagram":"none","start":1576.71,"end":1755.23,"asr_flags":[],"math_clarifications":["公式中的1/2因子是为了简化导数计算，不影响最小值点的位置。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1576.71,"text":"That's a fine thing to do as well. That's a value regression kind of thing."},{"start":1581.57,"text":"2 has a nice property, which we're cheating on for a lot of least squares."},{"start":1585.03,"text":"2 we can solve exactly. And that just turns out to be because 2 is, as you'll see in a second,"},{"start":1589.85,"text":"when we compute all the derivatives and do all the nice things, the derivative has a really nice form"},{"start":1594.03,"text":"or the gradient has a really nice form. And that's going to let us solve it exactly."}
