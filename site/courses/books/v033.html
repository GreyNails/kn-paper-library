</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 6 Q学习（Q-Learning） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v033.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v033","title":"Lecture 6 Q学习（Q-Learning）","course":"强化学习","pages":[{"title":"Q学习（Q-Learning）","segments":[{"id":0,"text":"So as a recap for the last couple lectures, we talked a lot about value functions and key functions. We'll talk about them more today. And as a reminder, value functions and key functions are representing some of future expected rewards, starting at sub-state. And value functions will be future expected rewards to start at state with all the policies. And the key function is to start at the state to take an action against policy.","zh":"所以作为对最近几节课的回顾，我们讨论了很多价值函数和关键函数。今天我们会更详细地讨论它们。作为提醒，价值函数和关键函数代表了从子状态开始的一些未来预期奖励。价值函数是从状态开始，使用所有策略的未来预期奖励。而关键函数是从状态开始采取动作，按照策略进行。","start":4.98,"end":33.82},{"id":1,"text":"So you can write them down mathematically and expect them to keep their rewards. And you've seen these diagrams a couple of times where you can think about value as the sum of these two rewards, but state as two functions as the sum of these two rewards.","zh":"你可以用数学方式写出它们，并期望它们保持奖励。你已经见过几次这样的图示，可以将价值视为这两个奖励的总和，但状态作为两个函数，是这两个奖励的总和。","start":35.99,"end":61.8},{"id":2,"text":"We can think of it as trying to set samples for our policies and increasing the log likelihood of actions that have a higher reward in the future, where we subtract the baseline in order to encourage the policy to do more of the above-average things than it does before and less of the below-average things.","zh":"我们可以将其视为尝试为我们的策略设置样本，并增加那些未来奖励更高的动作的对数似然性，其中我们通过减去基线来鼓励策略比之前更多地执行高于平均水平的行为，而减少低于平均水平的行为。","start":62.37,"end":85.37},{"id":3,"text":"We then started to talk about actor-critic methods and in this part we introduced an additional step of this loop where we are first going to estimate the expected future reward for our policy and use that to improve the policy. So we have this revised form for our gradient for our policy.","zh":"然后我们开始讨论演员-评论家方法，并在这一部分中引入了这个循环中的额外步骤，即我们首先估计我们策略的预期未来奖励，并使用它来改进策略。因此，我们有了针对策略的梯度的修订形式。","start":86.73,"end":107.59},{"id":4,"text":"where we are still taking samples but increasing the likelihood on actions that we think are good and decreasing the likelihood on actions that we think are bad. So these are the methods that we've talked about so far. Last lecture focused a lot on how to do this actor-critic algorithm in an off-policy way. So instead of only using the data from the current iteration, trying to be able to use all of the past data from all past iterations.","zh":"我们仍然在进行采样，但增加我们认为好的动作的似然性，减少我们认为坏的动作的似然性。因此，这些是我们到目前为止讨论的方法。上节课重点讨论了如何以离策略的方式执行这种演员-评论家算法。因此，我们不仅仅使用当前迭代的数据，而是尝试使用所有过去迭代的所有历史数据。","start":108.14,"end":135.68},{"id":5,"text":"And to do that, we needed to be able to estimate a Q function from past policy data. And to do that, we were using the neural network. Half of them put a state in action and output the value. And we derived this equation that's defining the Q function recursively. Or we can think of the sum of future rewards as the reward at the first time step plus the Q function starting at the next state.","zh":"为了做到这一点，我们需要能够从过去的策略数据中估计Q函数。为了做到这一点，我们使用了神经网络。其中一半的网络输入状态和动作，并输出值。我们推导出了定义Q函数的递归方程。或者，我们可以将未来奖励的总和视为第一个时间步的奖励加上从下一个状态开始的Q函数。","start":136.46,"end":165.35}],"notes":["本段讲解了价值函数和关键函数的概念，它们分别表示从某个状态开始，按照不同策略所能获得的未来期望奖励。价值函数考虑所有策略，而关键函数则是在特定策略下采取动作。","课堂中提到价值函数和关键函数可以数学化表示，并且它们的奖励可以被保留。通过图示可以理解价值函数为未来奖励的总和，而状态函数则是两个函数的总和。","在方法部分，首先介绍了经验回放（experience replay）方法，该方法通过交替收集数据和改进策略来优化策略。通过增加高奖励动作的对数似然，同时减少低奖励动作的对数似然，来鼓励策略执行优于平均的动作。","随后引入了actor-critic方法，其中增加了对策略未来期望奖励的估计步骤，并用该估计值来改进策略。梯度公式被重新定义，以反映策略的改进。","课堂还提到，上一节课重点讨论了如何在非策略（off-policy）方式下实现actor-critic算法，即不仅使用当前迭代的数据，还使用所有过去迭代的数据。","为了实现这一点，需要从过去策略数据中估计Q函数，使用神经网络进行建模。神经网络输入状态和动作，输出价值。通过递归方式推导Q函数的方程，可以将未来奖励的总和视为当前奖励加上下一个状态的Q函数值。"],"formulas":[],"uncertainties":["Half of them put a state in action and output the value."],"diagram":"none","start":4.98,"end":165.35,"asr_flags":[],"math_clarifications":["公式中的Q函数定义需要明确折扣因子γ，并且应体现状态转移和动作选择的条件。标准的Q函数定义应为Q(s, a) = r + γ * E[Q(s', a') | s, a]，其中γ是折扣因子，E表示期望。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4.98,"text":"So as a recap for the last couple lectures, we talked a lot about value functions and key functions. We'll talk about them more today. And as a reminder, value functions and key functions are representing some of future expected rewards, starting at sub-state. And value functions will be future expected rewards to start at state with all the policies. And the key function is to start at the state to take an action against policy."},{"start":35.99,"text":"So you can write them down mathematically and expect them to keep their rewards. And you've seen these diagrams a couple of times where you can think about value as the sum of these two rewards, but state as two functions as the sum of these two rewards. We've talked about a couple of methods so far. The first method that we talked about was call experience."},{"start":62.37,"text":"where we alternate between collecting data and improving our policies. We can think of it as trying to set samples for our policies and increasing the log likelihood of actions that have a higher reward in the future, where we subtract the baseline in order to encourage the policy to do more of the above-average things than it does before and less of the below-average things."},{"start":86.73,"text":"We then started to talk about actor-critic methods and in this part we introduced an additional step of this loop where we are first going to estimate the expected future reward for our policy and use that to improve the policy. So we have this revised form for our gradient for our policy."},{"start":108.14,"text":"where we are still taking samples but increasing the likelihood on actions that we think are good and decreasing the likelihood on actions that we think are bad. So these are the methods that we've talked about so far. Last lecture focused a lot on how to do this actor-critic algorithm in an off-policy way. So instead of only using the data from the current iteration, trying to be able to use all of the past data from all past iterations."},{"start":136.46,"text":"And to do that, we needed to be able to estimate a Q function from past policy data. And to do that, we were using the neural network. Half of them put a state in action and output the value. And we derived this equation that's defining the Q function recursively. Or we can think of the sum of future rewards as the reward at the first time step plus the Q function starting at the next state."}],"speech_gaps":[],"frame":"../frames/v033/001.webp","frame_time":16.98},{"title":"Q学习（Q-Learning）","segments":[{"id":6,"text":"and f. We found that this equation holds for any state in axis and that means that we can use previous state action and next state pairs in order to try to learn a key function and specifically the way that we did that is we would sample a state action next state from our buffer of previous data. Then we'll sample a next action from the current policy rather than from the past policy.","zh":"并且 f。我们发现这个等式适用于轴上的任何状态，并且这意味着我们可以使用先前的状态-动作和下一个状态对，以尝试学习一个关键函数，具体来说，我们是这样做的：我们从之前的数据缓冲区中采样一个状态-动作-下一个状态，然后从当前策略中采样下一个动作，而不是从过去的策略中采样。","start":165.78,"end":193.46},{"id":7,"text":"And then we will try to do supervised learning on these targets, where the targets are using our estimate, our current estimate of the Q function for our policy, and half of them put the state, the action, the next state, and the next action, not the sample. So once we formulate this objective, using our QStrap values, then we can do supervised learning as an LP law to try to map the Q function.","zh":"然后我们尝试在这些目标上进行监督学习，其中目标使用我们对Q函数的当前估计，我们的策略的当前估计，其中一半的目标包含状态、动作、下一个状态和下一个动作，而不是采样。因此，一旦我们用QStrap值来定义这个目标，我们就可以通过监督学习作为LP法则来尝试映射Q函数。","start":194.19,"end":222.04},{"id":8,"text":"We also talked about for these YIs to be accurate, you need to have sufficient coverage in your data set to cover actions that your newest policy makes. So today we're going to be covering value-based RL methods, and specifically we'll be talking about what I think arguably was the very first key reinforcement learning method, and it was based on the Q-learning algorithm. And so we'll be talking about Q-learning, and we'll also be talking about how to implement Q-learning in practice.","zh":"我们还谈到，为了这些YIs准确，你需要在数据集中有足够的覆盖范围，以覆盖你最新策略所采取的动作。今天我们将讨论基于价值的强化学习方法，并且我们将具体讨论我认为可能是第一个关键的强化学习方法，它是基于Q学习算法的。因此，我们将讨论Q学习，并且还将讨论如何在实践中实现Q学习。","start":222.75,"end":251.36},{"id":9,"text":"how to make it stable, and the goal for today is to think about how Q-functions relate to policies, how to do RL without learning an explicit policy, and how to stabilize Q-learning if you're actively using it. We're going to start out with a thought exercise and a question for all of you to think about. So, say we have some policies, and for your policy you have a pretty good estimate of the Q-function.","zh":"如何使其稳定，今天的目标是思考Q函数与策略之间的关系，如何在不显式学习策略的情况下进行强化学习，以及如何稳定Q学习如果你正在积极使用它。我们将从一个思考练习和一个让大家思考的问题开始。因此，假设我们有一些策略，对于你的策略，你对Q函数有一个相当好的估计。","start":252.01,"end":283.27},{"id":10,"text":"And as a reminder, I'll put the definition of Q values up here, the future rewards for state and action. And an object that we're going to be thinking about a lot today is if you have some estimate of the Q function for, in this case, for a policy, then one thing you could do is you could try to...","zh":"作为提醒，我会在这里展示Q值的定义，即状态和动作的未来奖励。今天我们将频繁思考的一个对象是，如果你对某个策略的Q函数有一个估计，那么你可以尝试……","start":283.98,"end":309.36},{"id":11,"text":"instead of following some policy that you've already learned, you could potentially formulate a policy by choosing the action that maximizes your speed. So if you have a bunch of different candidate actions at a given state, instead of following your policy, you could pick the candidate action that has the highest speed up. So to continue on this...","zh":"而不是遵循你已经学习到的某个策略，你可能会通过选择最大化速度的动作来制定一个策略。因此，如果你在某个状态下有一系列不同的候选动作，而不是遵循你的策略，你可以选择具有最高速度提升的候选动作。所以继续这个思路...","start":310.72,"end":338.3}],"notes":["本段主要讲解了Q学习中如何利用目标值进行监督学习，强调了目标值的构成，包括当前状态、动作、下一个状态和下一个动作，而不是样本本身。同时提到使用QStrap值来构建目标，从而进行监督学习。","讲者指出，为了确保YIs（目标值）的准确性，数据集中需要覆盖新策略所采取的动作。这表明数据集的覆盖范围对Q学习的稳定性至关重要。","本段介绍了今天课程的重点内容，即基于值的强化学习方法，特别是Q学习算法。Q学习被认为是强化学习中第一个关键方法，因此课程将重点讲解其原理和实现。","讲者提到Q函数与策略之间的关系，以及如何在不显式学习策略的情况下进行强化学习。这表明Q函数可以作为策略的替代，通过最大化Q值来选择动作。","本段还涉及如何使Q学习稳定的问题，强调了在实际应用中需要考虑的稳定性问题。这包括如何通过调整策略或目标值来避免Q函数的不稳定性。","讲者通过一个思考练习引导学生思考Q函数与策略的关系，并提出一个假设：如果对Q函数有较好的估计，可以基于Q值来制定策略，而不是遵循已有的策略。"],"formulas":[],"uncertainties":["QStrap values"],"diagram":"none","start":165.78,"end":338.3,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":165.78,"text":"and f. We found that this equation holds for any state in axis and that means that we can use previous state action and next state pairs in order to try to learn a key function and specifically the way that we did that is we would sample a state action next state from our buffer of previous data. Then we'll sample a next action from the current policy rather than from the past policy."},{"start":194.19,"text":"And then we will try to do supervised learning on these targets, where the targets are using our estimate, our current estimate of the Q function for our policy, and half of them put the state, the action, the next state, and the next action, not the sample. So once we formulate this objective, using our QStrap values, then we can do supervised learning as an LP law to try to map the Q function."},{"start":222.75,"text":"We also talked about for these YIs to be accurate, you need to have sufficient coverage in your data set to cover actions that your newest policy makes. So today we're going to be covering value-based RL methods, and specifically we'll be talking about what I think arguably was the very first key reinforcement learning method, and it was based on the Q-learning algorithm. And so we'll be talking about Q-learning, and we'll also be talking about how to implement Q-learning in practice."},{"start":252.01,"text":"how to make it stable, and the goal for today is to think about how Q-functions relate to policies, how to do RL without learning an explicit policy, and how to stabilize Q-learning if you're actively using it. We're going to start out with a thought exercise and a question for all of you to think about. So, say we have some policies, and for your policy you have a pretty good estimate of the Q-function."},{"start":283.98,"text":"And as a reminder, I'll put the definition of Q values up here, the future rewards for state and action. And an object that we're going to be thinking about a lot today is if you have some estimate of the Q function for, in this case, for a policy, then one thing you could do is you could try to..."},{"start":310.72,"text":"instead of following some policy that you've already learned, you could potentially formulate a policy by choosing the action that maximizes your speed. So if you have a bunch of different candidate actions at a given state, instead of following your policy, you could pick the candidate action that has the highest speed up. So to continue on this..."}],"speech_gaps":[],"frame":"../frames/v033/002.webp","frame_time":177.78},{"title":"Q学习（Q-Learning）","segments":[{"id":12,"text":"We'll define a policy that does exactly that. That policy has a probability of 1 for taking the action that maximizes the p-value and has a probability of 0 otherwise. This is a deterministic policy that always follows what the p-value is telling you is the best. And then we'll look at this in the context of an example. So say that we have some 2D navigation problems. We're going to be starting somewhere in this blue box and our goal is to","zh":"我们将定义一个策略，它正是这样做的。该策略在采取使p值最大的动作时概率为1，在其他情况下概率为0。这是一个确定性策略，始终遵循p值告诉你的最佳动作。然后我们将在这个例子的背景下来看这个策略。假设我们有一些二维导航问题。我们将在这个蓝色框内的某个位置开始，我们的目标是","start":338.96,"end":369.25},{"id":13,"text":"To the star, you can move in 2D. The reward is 1 at the star and 0 at alpha, so very simple. And let's say that our current policy always goes to the right. And as one additional point of detail, if you're going to move up, it takes one time step to move about this distance, and it takes about two time steps to move this distance.","zh":"到达星星处。你可以在这个二维空间中移动。奖励在星星处为1，在alpha处为0，因此非常简单。假设我们当前的策略总是向右移动。作为额外的一个细节点，如果你向上移动，需要一个时间步来移动这段距离，而移动这段距离则需要大约两个时间步。","start":369.95,"end":401.06},{"id":14,"text":"So my question for you is, if you define this new policy, you have this current policy that always goes right. You have an accurate estimate of the key values for that policy. If you can find this new policy, is that better than the current policy? Is it worse than the current policy? Is it the same as the current policy? Is it the optimal policy? And why or why not? So I'll give you... Well, first, any questions about this example?","zh":"我的问题是，如果你定义这个新策略，你有一个当前策略，它总是向右移动。你对这个策略的关键值有准确的估计。如果你能找到这个新策略，它是否比当前策略更好？是否比当前策略更差？是否与当前策略相同？是否是最佳策略？为什么或为什么不？我将给你们……好吧，首先，有任何关于这个例子的问题吗？","start":402.69,"end":423.97},{"id":15,"text":"Okay, so I'll give you a few minutes to talk to your neighbor about these questions,","zh":"好的，我给你们几分钟时间与邻座讨论这些问题，","start":427.84,"end":433.08},{"id":16,"text":"and then we'll come back and talk through the answers.","zh":"然后我们将回来讨论答案。","start":433.34,"end":437.38},{"id":17,"text":"It seems like people are talking a little bit less, so maybe you can come back.","zh":"看起来人们谈话少了一些，所以也许你们可以回来。","start":442.66,"end":445.92},{"id":18,"text":"Who wants to share their thoughts?","zh":"谁想分享他们的想法？","start":446.48,"end":448.66},{"id":19,"text":"Yeah?","zh":"是的？","start":450.14,"end":450.54},{"id":20,"text":"So let's summarize that, and then we'll talk about whether it's the optimal policy.","zh":"那么让我们总结一下，然后我们将讨论它是否是最佳策略。","start":451.68,"end":454.76},{"id":21,"text":"So, to summarize, the old policy is going right, and so that is not optimal, because","zh":"总之，旧策略是向右移动，因此这不是最优的，因为","start":454.76,"end":461.42},{"id":22,"text":"if you're starting here, then you're not actually going to hit the star.","zh":"如果你从这里开始，你实际上不会碰到星星。","start":461.42,"end":464.22},{"id":23,"text":"And if you think about what q pi is for the old policy, kind of everything in this region","zh":"如果你考虑旧策略下的Q值，这个区域内的所有内容","start":464.96,"end":473.24},{"id":24,"text":"right here is going to have a q pi equal to 1 for all of these states in action.","zh":"这里的每一个状态在采取这个动作时，其Q值都等于1。","start":473.24,"end":482.9},{"id":25,"text":"And then if you start to think about what QPy looks like right here, this is actually","zh":"然后如果你开始考虑这里的Q值看起来是什么样子，这实际上是","start":486.0,"end":493.52},{"id":26,"text":"where it will... well, actually, sorry, take that back.","zh":"它会……抱歉，我刚才说错了。","start":493.52,"end":497.54},{"id":27,"text":"VPy is equal to 1 for everything in this row.","zh":"对于这一行中的所有状态，V值都等于1。","start":498.44,"end":500.44},{"id":28,"text":"It actually depends a little bit on the action, what the Q function actually is.","zh":"实际上，这在一定程度上取决于采取的动作，Q函数到底是什么。","start":500.66,"end":504.5},{"id":29,"text":"is, for this row, if the action is the same as the policy that said move right, then the","zh":"对于这一行来说，如果采取的动作与策略所说的向右移动相同，那么","start":504.5,"end":512.62},{"id":30,"text":"Q value is 1. If it actually does something else, if it goes up, for example, then it","zh":"Q值就是1。如果它实际上采取了其他动作，例如向上移动，那么它","start":512.62,"end":516.84}],"notes":["本段讲授了Q学习中的策略定义，即一个确定性策略，该策略总是选择最大化p值的动作。接着，通过一个二维导航问题的例子，说明了当前策略总是向右移动，但该策略并非最优，因为从起点无法到达目标星。"],"formulas":[],"uncertainties":["QPy","VPy"],"diagram":"none","start":338.96,"end":516.84,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":338.96,"text":"We'll define a policy that does exactly that. That policy has a probability of 1 for taking the action that maximizes the p-value and has a probability of 0 otherwise. This is a deterministic policy that always follows what the p-value is telling you is the best. And then we'll look at this in the context of an example. So say that we have some 2D navigation problems. We're going to be starting somewhere in this blue box and our goal is to"},{"start":369.95,"text":"To the star, you can move in 2D. The reward is 1 at the star and 0 at alpha, so very simple. And let's say that our current policy always goes to the right. And as one additional point of detail, if you're going to move up, it takes one time step to move about this distance, and it takes about two time steps to move this distance. So my question for you is, if you define this new policy,"},{"start":402.69,"text":"You have this current policy that always goes right. You have an accurate estimate of the key values for that policy. If you can find this new policy, is that better than the current policy? Is it worse than the current policy? Is it the same as the current policy? Is it the optimal policy? And why or why not? So I'll give you... Well, first, any questions about this example?"},{"start":427.84,"text":"Okay, so I'll give you a few minutes to talk to your neighbor about these questions,"},{"start":433.34,"text":"and then we'll come back and talk through the answers."},{"start":442.66,"text":"It seems like people are talking a little bit less, so maybe you can come back."},{"start":446.48,"text":"Who wants to share their thoughts?"},{"start":450.14,"text":"Yeah?"},{"start":451.68,"text":"So let's summarize that, and then we'll talk about whether it's the optimal policy."},{"start":454.76,"text":"So, to summarize, the old policy is going right, and so that is not optimal, because"},{"start":461.42,"text":"if you're starting here, then you're not actually going to hit the star."},{"start":464.96,"text":"And if you think about what q pi is for the old policy, kind of everything in this region"},{"start":473.24,"text":"right here is going to have a q pi equal to 1 for all of these states in action."},{"start":486.0,"text":"And then if you start to think about what QPy looks like right here, this is actually"},{"start":493.52,"text":"where it will... well, actually, sorry, take that back."},{"start":498.44,"text":"VPy is equal to 1 for everything in this row."},{"start":500.66,"text":"It actually depends a little bit on the action, what the Q function actually is."},{"start":504.5,"text":"is, for this row, if the action is the same as the policy that said move right, then the"},{"start":512.62,"text":"Q value is 1. If it actually does something else, if it goes up, for example, then it"}],"speech_gaps":[{"start":483.52,"end":485.6}],"frame":"../frames/v033/003.webp","frame_time":350.96},{"title":"Q学习中的策略更新与最优性讨论","segments":[{"id":31,"text":"might actually miss the star if it follows the policy after taking that action. Now if","zh":"如果它在采取该动作后遵循策略，可能会错过星星。现在如果你看一下这一行，","start":516.84,"end":523.08},{"id":32,"text":"you look at this row, for this row, Q pi of all the states in this row, for the action","zh":"对于这一行中的所有状态，对于这个动作","start":523.08,"end":530.72},{"id":33,"text":"instead of going right, is going to be zero.","zh":"而不是向右移动，其值将为零。","start":530.72,"end":532.66},{"id":34,"text":"But then if you look at...","zh":"但如果你再看……","start":534.3,"end":535.48},{"id":35,"text":"The Q pi for all the states here for the action of going up, what is the Q value for that?","zh":"对于这里的所有状态，对于向上移动的动作，Q值是多少？","start":535.98,"end":544.28},{"id":36,"text":"What is Q pi? One. Cool.","zh":"什么是Qπ？一。很好。","start":544.72,"end":547.08},{"id":37,"text":"And so that's because if we follow up and then follow the policy, we'll have a word of one.","zh":"这是因为如果我们向上移动，然后遵循策略，我们将得到一个值为一的单词。","start":547.24,"end":553.02},{"id":38,"text":"And then lastly, if we go to this row, if we have S and then going up, what is the Q value?","zh":"最后，如果我们移动到这一行，如果状态是S，然后向上移动，Q值是多少？","start":553.82,"end":561.68},{"id":39,"text":"zero. And so what this means is that we're going to get the new policy, what it's going","zh":"零。这意味着我们将得到新的策略，它将执行的操作是向右移动。","start":562.88,"end":568.36},{"id":40,"text":"to do is it's going to be going right here. And then for everything in this row, it will","zh":"然后对于这一行中的所有内容，它将选择具有最大q值的动作。","start":568.36,"end":575.46},{"id":41,"text":"it's going to be choosing the action that has the maximum value of q","zh":"但是对于这一行，所有的q值都是零，因为接下来的所有q值也都是零，因此如果默认使用之前的策略，它将继续向右移动。","start":576.08,"end":581.06},{"id":42,"text":"pi. But then for this row, all of the q values are zero because all of the q values for the","zh":"有人想讨论第二个问题，即这个是否是最优策略吗？","start":581.06,"end":589.24},{"id":43,"text":"the next ones are also 0, and so if you default to the previous behavior, it'll stay going","zh":"接下来的那些也是0，因此如果你默认使用之前的策略，它将继续执行下去","start":589.24,"end":597.98},{"id":44,"text":"to the right.","zh":"向右移动。","start":597.98,"end":598.56},{"id":45,"text":"And does anyone want to discuss the second question, like is this the optimal policy?","zh":"有人想讨论第二个问题吗？比如，这是否是最优策略？","start":600.34,"end":608.32},{"id":46,"text":"Yeah.","zh":"是的。","start":609.56,"end":610.08},{"id":47,"text":"the new policy is better than the old one, but it's not the optimal policy","zh":"新的策略比旧的策略更好，但它并不是最优策略","start":610.14,"end":616.14},{"id":48,"text":"because in these states the optimal, like the best policy, should be the one that also is going up in order to get to this point.","zh":"因为在这些状态下，最优的策略，也就是最好的策略，应该是那个能够向上移动以到达这个点的策略。","start":616.14,"end":623.9},{"id":49,"text":"the question was, if we iterate this and do it a couple times, this will become the optimal policy, right?","zh":"问题是，如果我们反复进行这样的迭代，做几次之后，这个策略就会变成最优策略，对吗？","start":624.74,"end":631.72},{"id":50,"text":"And yeah, you're a couple slides ahead, but we'll talk about doing this iteratively.","zh":"是的，你已经提前了几张幻灯片，但我们将会讨论如何迭代地进行这个过程。","start":631.84,"end":636.42},{"id":51,"text":"we'll get a reward of one here, which is great. But if we're starting at this initial state, we actually will just keep on going right. We won't go up after defining this new policy. And so therefore, it's not going to get a reward of one from all states.","zh":"我们在这里会得到一个奖励值1，这很好。但如果从这个初始状态开始，我们实际上只会一直向右移动。在定义了这个新策略之后，我们不会向上移动。因此，它不会从所有状态中获得奖励值1。","start":637.65,"end":654.67},{"id":52,"text":"the question is, is there a sense of, like, if you're getting closer to the star, the Q would be higher versus not?","zh":"问题是，是否存在一种意义，即如果你离星星越近，Q值就会越高，而不是更低？","start":656.4,"end":662.4},{"id":53,"text":"I actually didn't explicitly define this, but if you have a discount factor that is below 1, then it will get higher as you get closer.","zh":"我实际上没有明确地定义这一点，但如果折扣因子小于1，那么随着你离目标越近，Q值就会越高。","start":663.1,"end":671.92},{"id":54,"text":"Everything I've shown here is with a discount factor of 1 for simplicity.","zh":"在这里我所展示的一切都是以折扣因子为1来进行的，以简化问题。","start":673.1,"end":676.74},{"id":55,"text":"But if you use a discount factor of 0.9, for example, then the Q value here would be 1,","zh":"但如果使用一个折扣因子0.9，例如，那么这里的Q值将是1，","start":676.74,"end":682.64},{"id":56,"text":"then it would be 0.9 here, then 0.8 here, 0.7 here, and so forth.","zh":"然后这里将是0.9，然后这里将是0.8，这里将是0.7，依此类推。","start":682.76,"end":687.0}],"notes":["本段讨论了Q学习中策略更新的过程，指出当前策略并非最优策略，因为某些状态下的最优动作应为向上移动以获得更高的奖励。讲者提到，如果迭代执行策略更新，最终会得到最优策略，但当前策略仍存在局限。","讲者进一步解释了折扣因子（discount factor）对Q值的影响，指出当折扣因子小于1时，越接近目标（如星点）的Q值越高。这与当前使用的折扣因子为1的情况不同，因此Q值的分布会有所变化。","讲者通过举例说明，当折扣因子为0.9时，Q值会随着距离目标的远近而递减，例如从1递减到0.9、0.8、0.7等。这表明折扣因子对策略的长期收益评估有重要影响。","讲者强调，当前策略虽然比旧策略更好，但并非最优策略，因为某些状态下的最优动作未被正确选择。这说明Q学习需要多次迭代以逼近最优策略。","讲者提到，如果从初始状态开始，当前策略会持续向右移动，而不会向上移动，因此无法从所有状态获得奖励。这表明策略更新需要考虑所有状态的长期收益。","讲者最后指出，Q值的高低与距离目标的远近有关，但这一关系依赖于折扣因子的设定。这为后续讨论折扣因子对策略优化的影响提供了基础。"],"formulas":[],"uncertainties":["word of one"],"diagram":"none","start":516.84,"end":687.0,"asr_flags":[],"math_clarifications":["原始片段中没有明确的数学公式，因此无法进行有效的数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":26,"raw_segments":[{"start":516.84,"text":"might actually miss the star if it follows the policy after taking that action. Now if"},{"start":523.08,"text":"you look at this row, for this row, Q pi of all the states in this row, for the action"},{"start":530.72,"text":"instead of going right, is going to be zero."},{"start":534.3,"text":"But then if you look at..."},{"start":535.98,"text":"The Q pi for all the states here for the action of going up, what is the Q value for that?"},{"start":544.72,"text":"What is Q pi? One. Cool."},{"start":547.24,"text":"And so that's because if we follow up and then follow the policy, we'll have a word of one."},{"start":553.82,"text":"And then lastly, if we go to this row, if we have S and then going up, what is the Q value?"},{"start":562.88,"text":"zero. And so what this means is that we're going to get the new policy, what it's going"},{"start":568.36,"text":"to do is it's going to be going right here. And then for everything in this row, it will"},{"start":576.08,"text":"be going up because it's going to be choosing the action that has the maximum value of q"},{"start":581.06,"text":"pi. But then for this row, all of the q values are zero because all of the q values for the"},{"start":589.24,"text":"the next ones are also 0, and so if you default to the previous behavior, it'll stay going"},{"start":597.98,"text":"to the right."},{"start":600.34,"text":"And does anyone want to discuss the second question, like is this the optimal policy?"},{"start":609.56,"text":"Yeah."},{"start":610.14,"text":"So this policy, the new policy is better than the old one, but it's not the optimal policy"},{"start":616.14,"text":"because in these states the optimal, like the best policy, should be the one that also is going up in order to get to this point."},{"start":624.74,"text":"Yeah, so the question was, if we iterate this and do it a couple times, this will become the optimal policy, right?"},{"start":631.84,"text":"And yeah, you're a couple slides ahead, but we'll talk about doing this iteratively."},{"start":637.65,"text":"Yeah, so we can get a reward of one. The question was, why is this not the optimal policy? So we'll get a reward of one here, which is great. But if we're starting at this initial state, we actually will just keep on going right. We won't go up after defining this new policy. And so therefore, it's not going to get a reward of one from all states."},{"start":656.4,"text":"Yeah, so the question is, is there a sense of, like, if you're getting closer to the star, the Q would be higher versus not?"},{"start":663.1,"text":"I actually didn't explicitly define this, but if you have a discount factor that is below 1, then it will get higher as you get closer."},{"start":673.1,"text":"Everything I've shown here is with a discount factor of 1 for simplicity."},{"start":676.74,"text":"But if you use a discount factor of 0.9, for example, then the Q value here would be 1,"},{"start":682.76,"text":"then it would be 0.9 here, then 0.8 here, 0.7 here, and so forth."}],"speech_gaps":[],"frame":"../frames/v033/004.webp","frame_time":528.84},{"title":"Q学习中的策略迭代与策略改进","segments":[{"id":57,"text":"And then it would still be 0 for this entire row, just because you're still somewhat of a slug.","zh":"然后这一整行仍然会是0，仅仅是因为你仍然有点像一个缓慢移动的蜗牛。","start":687.2,"end":699.8},{"id":58,"text":"The other thing potentially to note here is that if your reward was denser,","zh":"另一个需要注意的潜在点是，如果你的奖励更密集，","start":700.88,"end":704.28},{"id":59,"text":"the reward function, instead of being 1 at the star and 0 elsewhere,","zh":"奖励函数，而不是在星号处为1而在其他地方为0，","start":704.28,"end":708.78},{"id":60,"text":"if it was, for example, the negative distance to the star,","zh":"例如，如果是负的到星号的距离，","start":708.86,"end":711.76},{"id":61,"text":"then you would actually...","zh":"那么你实际上会...","start":712.52,"end":713.66},{"id":62,"text":"I won't go through that on the board,","zh":"我不会在黑板上详细讲解这个，","start":714.28,"end":717.86},{"id":63,"text":"but if you go through that example,","zh":"但如果你去研究这个例子，","start":717.98,"end":719.18},{"id":64,"text":"you'll actually see that even in a single step,","zh":"你实际上会看到即使在单步的情况下，","start":719.38,"end":721.48},{"id":65,"text":"starting from this policy,","zh":"从这个策略开始，","start":723.02,"end":724.32},{"id":66,"text":"you would actually get a policy that goes to the star from elsewhere.","zh":"你实际上会得到一个从其他地方前往星星的策略。","start":724.56,"end":729.4},{"id":67,"text":"The question is, if I wanted to get the optimal policy, I would need to iteratively do this and reconsider the QPy for the latest policy every time.","zh":"问题是，如果我想得到最优策略，我需要迭代地这样做，并且每次重新考虑最新策略的QPy。","start":730.35,"end":739.71},{"id":68,"text":"Yeah, so in this example, the question is, is it always better? In this example, the new policy was better than the current policy. And this is actually always going to be the case. So it's always going to be at least as good as the previous policy. And it's never going to, well, assuming that QPy is accurate, it's always going to be as good as it is. It's never going to be worse. And now if QPy is already the optimal policy, then it will be the same. This is starting to think about, like, can we actually start omitting policies?","zh":"是的，所以在这个例子中，问题是，这是否总是更好？在这个例子中，新策略比当前策略更好。而这实际上总是会发生。因此，它总是至少和之前的策略一样好。而且，假设QPy是准确的，它总是和它一样好。它永远不会更差。现在，如果QPy已经是最优策略，那么它就会保持不变。这开始思考，我们是否实际上可以省略策略？","start":741.43,"end":770.61},{"id":69,"text":"Here is the expected reward. When we do this argmax, we're going to be taking the best action from state s if you then follow the policy afterwards. And this is going to be at least as good as any action that the policy would have taken. And regardless of what the policy is, this is going to be at least as good as what that policy would have taken.","zh":"这里展示的是预期奖励。当我们进行argmax操作时，我们会在状态s中选择最佳动作，然后遵循该策略。这将至少和策略中任何动作的预期奖励一样好。无论策略是什么，这都将至少和该策略所采取的动作一样好。","start":771.99,"end":796.17},{"id":70,"text":"You can see that because it's taking the action that has the maximum expected reward. So potentially we could actually just forget using policies and just do this, rather than actually explicitly learning a neural network for the policy. And so what this looks like as an iterative algorithm is we would run our policy to collect data, then we would fit a model to estimate q pi,","zh":"你可以看到，这是因为选择的是预期奖励最大的动作。因此，我们实际上可以完全忘记使用策略，而只是这样做，而不是显式地学习一个神经网络来表示策略。因此，作为迭代算法，我们会运行我们的策略来收集数据，然后根据最新的一批数据拟合一个模型来估计q pi，","start":797.2,"end":825.51},{"id":71,"text":"according to that latest batch of data. You could also do this in an off-policy way, like we talked about in the last lecture. And then, to improve your policy, you can just define the policy to be the policy that maximizes your QPi. And then, once you define that new policy, you can collect some new data, and then estimate, again, QPi, but in this case, QPi for your new policy and not your old policy.","zh":"根据该最新批次的数据。你也可以像我们在上一节课中讨论的那样，以离策略的方式进行操作。然后，为了改进你的策略，你可以将策略定义为最大化你的QPi的策略。一旦定义了这个新策略，你可以收集一些新的数据，然后再次估计QPi，但这次是针对你的新策略而不是旧策略。","start":826.17,"end":851.72}],"notes":["本段讨论了在Q学习中如何通过迭代更新策略以获得最优策略。讲者指出，为了得到最优策略，需要不断重新计算当前策略的Q值，并基于最新的Q值更新策略。这表明策略迭代过程的核心在于不断改进策略，使其至少与之前的策略一样好，甚至更好。","讲者提到，在这种情况下，新的策略总是至少和当前策略一样好，前提是Q值估计是准确的。这意味着策略改进过程具有单调性，不会出现策略变差的情况。如果当前策略已经是最优策略，那么更新后的策略将保持不变。","讲者进一步指出，这种策略迭代过程可以让我们思考是否可以省略显式的策略表示，例如不需要使用神经网络来显式学习策略。取而代之的是，可以通过直接最大化Q值来定义新的策略，从而简化策略学习的过程。","在迭代算法中，讲者描述了具体的步骤：首先运行当前策略以收集数据，然后根据最新数据拟合模型以估计Q值。这个过程可以是基于策略的（on-policy）或基于其他策略的（off-policy），如上一节课所讨论的。","讲者强调，通过不断更新策略并重新估计Q值，可以逐步逼近最优策略。这种迭代过程是Q学习的核心机制，它通过不断改进策略来实现最优解。","最后，讲者指出，这种策略迭代方法可以避免显式地学习复杂的策略函数，而是通过直接优化Q值来定义策略，从而简化了学习过程。"],"formulas":[],"uncertainties":["QPy"],"diagram":"none","start":687.2,"end":851.72,"asr_flags":[57],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":687.2,"text":"And then it would still be 0 for this entire row, just because you're still somewhat of a slug."},{"start":700.88,"text":"The other thing potentially to note here is that if your reward was denser,"},{"start":704.28,"text":"the reward function, instead of being 1 at the star and 0 elsewhere,"},{"start":708.86,"text":"if it was, for example, the negative distance to the star,"},{"start":712.52,"text":"then you would actually..."},{"start":714.28,"text":"I won't go through that on the board,"},{"start":717.98,"text":"but if you go through that example,"},{"start":719.38,"text":"you'll actually see that even in a single step,"},{"start":723.02,"text":"starting from this policy,"},{"start":724.56,"text":"you would actually get a policy that goes to the star from elsewhere."},{"start":730.35,"text":"The question is, if I wanted to get the optimal policy, I would need to iteratively do this and reconsider the QPy for the latest policy every time."},{"start":741.43,"text":"Yeah, so in this example, the question is, is it always better? In this example, the new policy was better than the current policy. And this is actually always going to be the case. So it's always going to be at least as good as the previous policy. And it's never going to, well, assuming that QPy is accurate, it's always going to be as good as it is. It's never going to be worse. And now if QPy is already the optimal policy, then it will be the same. This is starting to think about, like, can we actually start omitting policies?"},{"start":771.99,"text":"Here is the expected reward. When we do this argmax, we're going to be taking the best action from state s if you then follow the policy afterwards. And this is going to be at least as good as any action that the policy would have taken. And regardless of what the policy is, this is going to be at least as good as what that policy would have taken."},{"start":797.2,"text":"You can see that because it's taking the action that has the maximum expected reward. So potentially we could actually just forget using policies and just do this, rather than actually explicitly learning a neural network for the policy. And so what this looks like as an iterative algorithm is we would run our policy to collect data, then we would fit a model to estimate q pi,"},{"start":826.17,"text":"according to that latest batch of data. You could also do this in an off-policy way, like we talked about in the last lecture. And then, to improve your policy, you can just define the policy to be the policy that maximizes your QPi. And then, once you define that new policy, you can collect some new data, and then estimate, again, QPi, but in this case, QPi for your new policy and not your old policy."}],"speech_gaps":[],"frame":"../frames/v033/005.webp","frame_time":699.2},{"title":"Q学习（Q-Learning）中的策略表示与连续动作空间","segments":[{"id":72,"text":"The policy pi is equal to this, and so we're not learning a neural network for the policy pi. We're not explicitly representing it as a model, but it's helpful to have some notation to refer to the system. The only neural network here, the only model here, is this 2.2 memory.","zh":"策略π等于这个，因此我们并不是在为策略π学习一个神经网络。我们并没有显式地将其表示为一个模型，但拥有某种符号来指代这个系统是有帮助的。这里唯一的神经网络，唯一的模型，就是这个2.2记忆。","start":852.64,"end":872.26},{"id":73,"text":"Yeah, so the question is, how do we generalize this to continuous actions or more expressive action spaces? So this is generally going to be easiest when you have kind of a discrete set of actions that you might take, like going up, going to the right. If you have continuous actions, you actually can still use this algorithm, although you need to figure out how to perform that max operation. There's a couple ways that you can conceivably run this operation right here.","zh":"是的，问题是，我们如何将这种方法推广到连续动作或更丰富的动作空间？一般来说，当你有一组离散的动作可供选择时，比如向上或向右移动，这种方法会更容易。如果你有连续动作，你实际上仍然可以使用这个算法，尽管你需要想办法执行这个最大值操作。这里有一些可能的方法来运行这个操作。","start":873.19,"end":901.37},{"id":74,"text":"In principle, you can use something like gradient descent, although that turns out not to work very well. You can potentially... There's a variety of reasons why it cannot work very well. And if your actions are not very high-dimensional, then you can... It might actually be better just to simply try to sample a bunch of different actions and pick the one that has the highest p-value. You can also...","zh":"原则上，你可以使用类似梯度下降的方法，但事实证明这种方法效果并不好。你可能会有多种原因导致它无法很好地工作。如果你的动作空间不是非常高维，那么你就可以……实际上，直接尝试采样许多不同的动作并选择具有最高p值的那个可能更好。你也可以……","start":903.09,"end":924.03},{"id":75,"text":"sampling-based optimization algorithms where you can iteratively sample and refine your estimates from there. Yeah, so there's a couple things you can do there. If you have a discrete action space that's like text, for example, in principle you could do some sort of discrete search over things where the Q value is what you're trying to maximize and maximize. Yeah, how does this work in cases where the rewards are very sparse?","zh":"使用基于采样的优化算法，你可以从那里迭代地采样并改进你的估计。是的，因此你可以采取一些方法。如果你有一个像文本一样的离散动作空间，原则上你可以进行某种离散搜索，其中Q值是你想要最大化的目标。是的，当奖励非常稀疏时，这种情况是如何运作的？","start":925.96,"end":955.4},{"id":76,"text":"So we saw one example where the rewards are sparse and it can still work in this scenario. The thing that you need to be aware of when the rewards are sparse is that you may need to do this loop of resetting the policy potentially a large number of times because","zh":"我们看到一个例子，其中奖励是稀疏的，但这种方法仍然可以在这种情况下起作用。当你遇到奖励稀疏的情况时，需要注意的是，你可能需要重置策略的循环次数非常多，因为","start":955.84,"end":975.22},{"id":77,"text":"Each time you do this, you're actually, like the first time we only got a good policy here. And now if this environment was much bigger, that means that you need to kind of keep on doing it as you go down. And what is often referred to as a backup, you're sort of backing up the reward from here to the other state. And you'll need to do those backups for as long as the, especially full for as long as the horizon of the problem is. So you need to make sure that you're doing many iterations.","zh":"每次你这样做，实际上，就像我们第一次在这里只得到了一个好策略。而现在如果这个环境要大得多，这意味着你需要在往下进行的过程中继续这样做。通常所说的备份，你是在将这里的奖励备份到另一个状态。你需要在问题的时间范围之内持续进行这些备份，因此你必须确保进行许多次迭代。","start":976.78,"end":1004.54}],"notes":["本段讨论了Q学习中策略表示的问题，指出策略π并不需要通过神经网络显式建模，而是通过其他方式表示。同时，强调了在连续动作空间中使用Q学习的挑战，特别是如何执行max操作的问题。","在连续动作空间中，可以使用梯度下降等方法，但效果可能不佳。对于低维动作空间，采样不同动作并选择最大Q值可能更有效。此外，还可以使用基于采样的优化算法来迭代改进估计。","当奖励稀疏时，需要多次重置策略，因为稀疏奖励可能导致学习过程缓慢。每次重置策略后，需要进行多次迭代，以确保奖励能够有效地传播到其他状态。","在稀疏奖励的情况下，备份奖励的过程是关键，即从当前状态将奖励传播到其他状态。这一过程需要持续进行，直到问题的时间范围（horizon）结束。","本段还提到，对于较大的环境，需要持续进行策略重置和备份，以确保学习过程的有效性。这表明在稀疏奖励场景下，Q学习需要更多的迭代和更长的训练时间。","整体上，本段强调了Q学习在处理连续动作空间和稀疏奖励时的挑战，并提出了可能的解决方案，如采样、梯度下降和备份机制。"],"formulas":[],"uncertainties":["p-value"],"diagram":"none","start":852.64,"end":1004.54,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":852.64,"text":"The policy pi is equal to this, and so we're not learning a neural network for the policy pi. We're not explicitly representing it as a model, but it's helpful to have some notation to refer to the system. The only neural network here, the only model here, is this 2.2 memory."},{"start":873.19,"text":"Yeah, so the question is, how do we generalize this to continuous actions or more expressive action spaces? So this is generally going to be easiest when you have kind of a discrete set of actions that you might take, like going up, going to the right. If you have continuous actions, you actually can still use this algorithm, although you need to figure out how to perform that max operation. There's a couple ways that you can conceivably run this operation right here."},{"start":903.09,"text":"In principle, you can use something like gradient descent, although that turns out not to work very well. You can potentially... There's a variety of reasons why it cannot work very well. And if your actions are not very high-dimensional, then you can... It might actually be better just to simply try to sample a bunch of different actions and pick the one that has the highest p-value. You can also..."},{"start":925.96,"text":"sampling-based optimization algorithms where you can iteratively sample and refine your estimates from there. Yeah, so there's a couple things you can do there. If you have a discrete action space that's like text, for example, in principle you could do some sort of discrete search over things where the Q value is what you're trying to maximize and maximize. Yeah, how does this work in cases where the rewards are very sparse?"},{"start":955.84,"text":"So we saw one example where the rewards are sparse and it can still work in this scenario. The thing that you need to be aware of when the rewards are sparse is that you may need to do this loop of resetting the policy potentially a large number of times because"},{"start":976.78,"text":"Each time you do this, you're actually, like the first time we only got a good policy here. And now if this environment was much bigger, that means that you need to kind of keep on doing it as you go down. And what is often referred to as a backup, you're sort of backing up the reward from here to the other state. And you'll need to do those backups for as long as the, especially full for as long as the horizon of the problem is. So you need to make sure that you're doing many iterations."}],"speech_gaps":[],"frame":"../frames/v033/006.webp","frame_time":864.64},{"title":"Q学习（Q-Learning）","segments":[{"id":78,"text":"Cool. So let's see. We can write this down as an algorithm. And so we can take our off-policy-actual-critic algorithm that is fitting CPOD. And then instead of using this policy gradient update, simply define a new policy that's taking actions according to...","zh":"好的。那么我们可以将这个写成一个算法。因此，我们可以使用我们的离策略-实际-批评家算法来拟合CPOD。然后，而不是使用这个策略梯度更新，简单地定义一个新的策略，该策略根据...采取行动。","start":1010.68,"end":1034.49},{"id":79,"text":"You can think of this as really having two key steps, like what we talked about. One is estimating T5. This is often referred to as policy evaluation, because you're learning what the values are for a policy. And note that you can do multiple gradient steps here, because this isn't on policy. We're just trying to fit our target. And then the second step is improving our policy.","zh":"你可以将这视为有两个关键步骤，就像我们之前讨论的那样。一个是估计T5。这通常被称为策略评估，因为你正在学习一个策略的价值。请注意，你可以在这里进行多次梯度步骤，因为这不是在策略上进行的。我们只是试图拟合我们的目标。然后第二步是改进我们的策略。","start":1037.55,"end":1067.18},{"id":80,"text":"you refer to it as policy. And this sort of two-step iterative procedure is often called policy iteration. It's kind of on the way to an algorithm like this. So to write this out on the board, what this looks like is having a first step where you collect data.","zh":"你称之为策略。这种两步迭代过程通常被称为策略迭代。它有点接近这样的算法。因此，将这个写在黑板上，它看起来是有一个第一步，即收集数据。","start":1068.29,"end":1092.51},{"id":81,"text":"Oftentimes, you might collect data from pi. It might also be, it could actually potentially be from some other policy. Then you have a next step where you're going to try to fit your estimated key function for that policy. And that you can use the targets that we defined in the raw function of r of sa plus gamma.","zh":"通常，你可能会从pi中收集数据。它也可能是，实际上可能来自其他策略。然后你有一个下一步，即尝试拟合该策略的估计关键函数。并且你可以使用我们在原始函数r of sa加上gamma中定义的目标。","start":1096.4,"end":1127.21},{"id":82,"text":"where these are from the buffer and this is sampled from our policy and then","zh":"这些来自缓冲区，这是从我们的策略中采样的，然后","start":1129.67,"end":1140.27},{"id":83,"text":"lastly we'll improve our policies by defining a new policy as being one if","zh":"最后，我们将通过定义一个新策略来改进我们的策略，该策略为","start":1140.27,"end":1154.99},{"id":84,"text":"if the x is maximizing the p-value and 0 the other way.","zh":"如果x最大化p值，则为1，否则为0。","start":1154.99,"end":1158.01},{"id":85,"text":"The question is, is this policy deterministic?","zh":"问题是，这个策略是确定性的吗？","start":1170.07,"end":1172.15},{"id":86,"text":"Yes, this policy is deterministic.","zh":"是的，这个策略是确定性的。","start":1172.73,"end":1174.53},{"id":87,"text":"This is actually one reason why you might not want to","zh":"这实际上是你可能不想从这个策略中收集数据的一个原因，","start":1176.45,"end":1178.97},{"id":88,"text":"collect data from this policy because","zh":"因为","start":1178.97,"end":1180.31},{"id":89,"text":"you're not going to have that many","zh":"你不会拥有太多","start":1181.59,"end":1182.69},{"id":90,"text":"and we'll talk in a couple slides about what policy we might want to collect data from.","zh":"我们将在几页幻灯片后讨论我们可能想要从哪个策略中收集数据。","start":1182.69,"end":1188.93}],"notes":["本段讲解了Q学习算法的基本结构，包括两个关键步骤：策略评估和策略改进。策略评估是通过估计目标函数来学习策略的价值，而策略改进则是通过定义新的策略来优化当前策略。"],"formulas":[],"uncertainties":["p-value","T5","raw function of r of sa plus gamma","x is maximizing the p-value","one if","0 the other way"],"diagram":"none","start":1010.68,"end":1188.93,"asr_flags":[83],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":1010.68,"text":"Cool. So let's see. We can write this down as an algorithm. And so we can take our off-policy-actual-critic algorithm that is fitting CPOD. And then instead of using this policy gradient update, simply define a new policy that's taking actions according to..."},{"start":1037.55,"text":"You can think of this as really having two key steps, like what we talked about. One is estimating T5. This is often referred to as policy evaluation, because you're learning what the values are for a policy. And note that you can do multiple gradient steps here, because this isn't on policy. We're just trying to fit our target. And then the second step is improving our policy."},{"start":1068.29,"text":"you refer to it as policy. And this sort of two-step iterative procedure is often called policy iteration. It's kind of on the way to an algorithm like this. So to write this out on the board, what this looks like is having a first step where you collect data."},{"start":1096.4,"text":"Oftentimes, you might collect data from pi. It might also be, it could actually potentially be from some other policy. Then you have a next step where you're going to try to fit your estimated key function for that policy. And that you can use the targets that we defined in the raw function of r of sa plus gamma."},{"start":1129.67,"text":"where these are from the buffer and this is sampled from our policy and then"},{"start":1140.27,"text":"lastly we'll improve our policies by defining a new policy as being one if"},{"start":1154.99,"text":"if the x is maximizing the p-value and 0 the other way."},{"start":1170.07,"text":"The question is, is this policy deterministic?"},{"start":1172.73,"text":"Yes, this policy is deterministic."},{"start":1176.45,"text":"This is actually one reason why you might not want to"},{"start":1178.97,"text":"collect data from this policy because"},{"start":1181.59,"text":"you're not going to have that many"},{"start":1182.69,"text":"and we'll talk in a couple slides about what policy we might want to collect data from."}],"speech_gaps":[],"frame":"../frames/v033/007.webp","frame_time":1022.68},{"title":"Q学习中的目标函数设计","segments":[{"id":91,"text":"Yeah, so the question is, when we're fitting these targets, why are we sampling from A'","zh":"是的，所以问题是，当我们拟合这些目标值时，为什么我们要从A'中进行采样？","start":1190.31,"end":1195.77},{"id":92,"text":"and why not do a maximum over action or an average?","zh":"而不是对动作进行最大值运算或平均值运算呢？","start":1195.85,"end":1201.83},{"id":93,"text":"So there's a couple things here.","zh":"这里有几个要点。","start":1202.15,"end":1207.81},{"id":94,"text":"So first you can do an average and sample multiple times and that can give you a better estimate of the target value.","zh":"首先，你可以进行平均值运算，并多次采样，这可以为你提供更准确的目标值估计。","start":1207.81,"end":1217.01},{"id":95,"text":"The second thing is that you can actually, instead of sampling this from pi, you can actually do this improvement step in the Q function target itself.","zh":"第二个要点是，你实际上可以不用从策略π中进行采样，而是在Q函数的目标值本身中进行这种改进步骤。","start":1218.21,"end":1229.01},{"id":96,"text":"So you can actually, instead of defining yi this way, you could consider a target for","zh":"因此，你实际上可以不用这样定义yi，而是考虑将你的Q函数的目标值定义为","start":1229.01,"end":1239.69},{"id":97,"text":"your q function to be the reward plus gamma times the max over a prime of qs.","zh":"奖励加上γ乘以对a'的最大值的Q值。","start":1239.69,"end":1253.07},{"id":98,"text":"And what this looks like is something like this.","zh":"这看起来像这样。","start":1253.07,"end":1259.21},{"id":99,"text":"And this actually is what gets us...","zh":"而这实际上就是让我们……","start":1260.51,"end":1262.45},{"id":100,"text":"One way to think about this, there's a couple ways to think about this. The first is that these targets are actually your Q values for your new policy. So you're actually, you're already putting the improvement steps in your Q function update, and you're actually learning the Q values associated with the new policy that you're going to be defining. And there's actually another way to look at this as well.","zh":"有一种方法可以思考这个问题，其实有几种方法可以思考这个问题。第一种是，这些目标实际上是你新策略的Q值。因此，你实际上已经在Q函数更新中包含了改进步骤，你实际上是在学习与你即将定义的新策略相关的Q值。此外，还有另一种方式来看待这个问题。","start":1264.65,"end":1289.85},{"id":101,"text":"We previously defined this equation that's true for all states and actions. So we defined that the defunction is equal to the reward plus the defunction at the next state. This is true for all states and actions, and it's actually also true for any policy, including the optimal policy.","zh":"我们之前定义了一个方程，该方程对所有状态和动作都成立。因此，我们定义了该方程：defunction等于奖励加上下一个状态的defunction。这个方程对所有状态和动作都成立，实际上也适用于任何策略，包括最优策略。","start":1293.36,"end":1318.82},{"id":102,"text":"And you could actually write down another equation that is specifically for the optimal policy. And in particular, we know that the optimal policy is always going to be picking the actions that maximize our piece of reward. The optimal policy is always going to be, the action that it picks is always going to be the one that maximizes the key values. And so we can write down an equation that holds just for the optimal policy, which is the same equation as...","zh":"你实际上还可以写出一个专门针对最优策略的方程。特别是，我们知道最优策略总是会选择最大化我们奖励的部分的动作。最优策略总是会选择使关键值最大的动作。因此，我们可以写出一个仅适用于最优策略的方程，这个方程与……","start":1320.52,"end":1351.47}],"notes":["本段讨论了在Q学习中为何选择从动作空间A'中采样来构建目标值，而不是直接取最大值或平均值。讲者指出，采样可以提供更准确的目标值估计，因为多次采样能够减少方差，提高估计的稳定性。","讲者提到，另一种方法是直接在Q函数的目标中进行改进步骤，而不是从策略π中采样。这表明在Q函数的更新过程中，可以将目标值定义为奖励加上折扣因子乘以下一状态的最大Q值，从而实现策略的改进。","讲者还提到，这种目标函数设计实际上对应于新策略的Q值，意味着在更新Q函数时已经包含了策略改进的步骤，从而学习与新策略相关的Q值。"],"formulas":[],"uncertainties":["在第91段中，'A'可能被误识别为'A'，但根据上下文，应为动作空间A'。"],"diagram":"none","start":1190.31,"end":1351.47,"asr_flags":[93],"math_clarifications":["公式中的符号ρ应为γ，表示折扣因子。此外，公式未明确说明该目标值是基于当前策略还是最优策略，且未提及采样或平均的细节。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":1190.31,"text":"Yeah, so the question is, when we're fitting these targets, why are we sampling from A'"},{"start":1195.85,"text":"and why not do a maximum over action or an average?"},{"start":1202.15,"text":"So there's a couple things here."},{"start":1207.81,"text":"So first you can do an average and sample multiple times and that can give you a better estimate of the target value."},{"start":1218.21,"text":"The second thing is that you can actually, instead of sampling this from pi, you can actually do this improvement step in the Q function target itself."},{"start":1229.01,"text":"So you can actually, instead of defining yi this way, you could consider a target for"},{"start":1239.69,"text":"your q function to be the reward plus gamma times the max over a prime of qs."},{"start":1253.07,"text":"And what this looks like is something like this."},{"start":1260.51,"text":"And this actually is what gets us..."},{"start":1264.65,"text":"One way to think about this, there's a couple ways to think about this. The first is that these targets are actually your Q values for your new policy. So you're actually, you're already putting the improvement steps in your Q function update, and you're actually learning the Q values associated with the new policy that you're going to be defining. And there's actually another way to look at this as well."},{"start":1293.36,"text":"We previously defined this equation that's true for all states and actions. So we defined that the defunction is equal to the reward plus the defunction at the next state. This is true for all states and actions, and it's actually also true for any policy, including the optimal policy."},{"start":1320.52,"text":"And you could actually write down another equation that is specifically for the optimal policy. And in particular, we know that the optimal policy is always going to be picking the actions that maximize our piece of reward. The optimal policy is always going to be, the action that it picks is always going to be the one that maximizes the key values. And so we can write down an equation that holds just for the optimal policy, which is the same equation as..."}],"speech_gaps":[],"frame":"../frames/v033/008.webp","frame_time":1202.31},{"title":"Q学习中的Q函数与策略生成","segments":[{"id":103,"text":"the one there except instead of an expectation over the next action it's a maximization over the next action. So what that looks like is we're defining the key function as the reward at the current time step plus the sum of future rewards and for that sum of future rewards we have some expectation over the next state that will happen and then","zh":"除了这里，我们不是对下一个动作的期望，而是对下一个动作的最优化。因此，这看起来像是我们定义关键函数为当前时间步的奖励加上未来奖励的总和，而对于这个未来奖励的总和，我们有一些关于下一个状态会发生什么的期望，然后","start":1352.49,"end":1382.93},{"id":104,"text":"Because we know that the optimal policy or the best policy is going to be taking the action that is maximizing the p-value, then we can write this as the max of q at the next state. Yeah, so the question is why are we talking all about q and why not v? So you can actually also write down these equations for v in a very similar way.","zh":"因为我们知道最优策略或最佳策略将是采取最大化p值的动作，因此我们可以将其写成下一个状态的q的最大值。是的，所以问题是为什么我们一直在谈论q而不是v？实际上，你也可以以非常类似的方式为v写出这些方程。","start":1384.21,"end":1415.53},{"id":105,"text":"The thing that's very nice about Q is that we can actually get a policy out of it. So if we know what Q is, then we can do this argmax over action to get a policy that's better than our previous policy. Whereas with the value function, if we only know V , then we don't know which action will lead to higher .","zh":"Q的一个非常好的地方是我们实际上可以从它中得到一个策略。因此，如果我们知道Q是什么，那么我们就可以通过对动作进行argmax来得到一个比我们之前策略更好的策略。而与价值函数相比，如果我们只知道V，那么我们就不知道哪个动作会导致更高的值。","start":1416.04,"end":1440.86},{"id":106,"text":"in principle with the value function you could try to do some sort of look ahead like if you have a sense for what the dynamics are you could try to then you could try to predict what f prime is and take actions that are maximizing that and so what that would look like is trying to like pick actions that lead to an expectation","zh":"原则上，使用价值函数你也可以尝试进行某种前瞻，比如如果你对动态有某种了解，你就可以尝试预测f prime是什么，并采取最大化该值的动作。因此，这看起来像是尝试选择那些导致期望值","start":1442.73,"end":1471.16},{"id":107,"text":"a, like, a high feature value. You could, in principle, do something like this with v, but...","zh":"a，像一个高特征值的动作。原则上，你也可以用v来做类似的事情，但……","start":1474.87,"end":1486.49},{"id":108,"text":"We don't know what these dynamics are, and we can't necessarily predict what the next state will be as a consequence of our action. And so in general, it's a lot harder to get a policy out of a value function and to improve our policy ultimately with a value function than it is with a sequence. So now going back to this equation, this is true for the optimal policy. I'm going to write Q for the optimal policy here, where I'm writing pi star as the optimal policy.","zh":"我们不知道这些动态是什么，而且我们不能确定地预测我们的动作会导致什么样的下一个状态。因此，一般来说，从价值函数中得到一个策略并最终通过价值函数改进我们的策略要困难得多。现在回到这个方程，这是对最优策略成立的。我在这里将Q写为最优策略，其中我将pi star作为最优策略来写。","start":1488.01,"end":1519.48}],"notes":["本段讲解了Q函数与价值函数（V函数）之间的区别，强调Q函数的优势在于可以直接从Q值中推导出策略，而价值函数则无法直接得到策略。Q函数通过最大化下一状态的Q值来选择最优动作，而价值函数则需要额外的动态模型来预测下一状态。","在Q学习中，我们通过最大化下一状态的Q值来选择最优动作，而不是对下一动作进行期望计算。这使得Q函数能够直接用于策略生成，而价值函数则需要额外的步骤来推导策略。","价值函数在理论上也可以通过预测动态模型来生成策略，但实际中由于动态模型未知，这种方法难以实现。因此，Q函数在策略生成方面更具优势。","Q函数的定义包括当前时间步的奖励和未来奖励的期望，而未来奖励的期望则基于下一状态的分布。这种结构使得Q函数能够更直接地用于策略优化。","在Q学习中，我们通过最大化Q值来选择最优动作，而价值函数则需要额外的动态模型来预测下一状态。因此，Q函数在策略生成方面更为直接和有效。","本段还提到，Q函数可以用于定义最优策略，而价值函数则需要额外的步骤来推导策略。这说明Q函数在强化学习中的重要性，特别是在策略生成方面。"],"formulas":[],"uncertainties":["higher"],"diagram":"none","start":1352.49,"end":1519.48,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1352.49,"text":"the one there except instead of an expectation over the next action it's a maximization over the next action. So what that looks like is we're defining the key function as the reward at the current time step plus the sum of future rewards and for that sum of future rewards we have some expectation over the next state that will happen and then"},{"start":1384.21,"text":"Because we know that the optimal policy or the best policy is going to be taking the action that is maximizing the p-value, then we can write this as the max of q at the next state. Yeah, so the question is why are we talking all about q and why not v? So you can actually also write down these equations for v in a very similar way."},{"start":1416.04,"text":"The thing that's very nice about Q is that we can actually get a policy out of it. So if we know what Q is, then we can do this argmax over action to get a policy that's better than our previous policy. Whereas with the value function, if we only know V , then we don't know which action will lead to higher ."},{"start":1442.73,"text":"in principle with the value function you could try to do some sort of look ahead like if you have a sense for what the dynamics are you could try to then you could try to predict what f prime is and take actions that are maximizing that and so what that would look like is trying to like pick actions that lead to an expectation"},{"start":1474.87,"text":"a, like, a high feature value. You could, in principle, do something like this with v, but..."},{"start":1488.01,"text":"We don't know what these dynamics are, and we can't necessarily predict what the next state will be as a consequence of our action. And so in general, it's a lot harder to get a policy out of a value function and to improve our policy ultimately with a value function than it is with a sequence. So now going back to this equation, this is true for the optimal policy. I'm going to write Q for the optimal policy here, where I'm writing pi star as the optimal policy."}],"speech_gaps":[],"frame":"../frames/v033/009.webp","frame_time":1364.49},{"title":"Q学习中的贝尔曼方程与收敛性","segments":[{"id":109,"text":"and if you look at our update right here we're trying to fit a Q function that is predicting this and essentially with this equation you can think about it as this update is actually trying to make this equation true so we're trying to make the left side of the equation equal to the right side of the equation and when this equation is true that means our policy is valid","zh":"如果你看一下我们这里的更新，我们正在尝试拟合一个Q函数，它预测这个值，本质上，通过这个方程，你可以把它看作这个更新实际上是在尝试让这个方程成立，我们正在尝试让方程的左边等于右边，当这个方程成立时，这意味着我们的策略是有效的。","start":1521.44,"end":1549.91},{"id":110,"text":"So essentially one way to think about Q-learning is that when we're optimizing step 3, we're trying to find a Q-function such that it satisfies this equation, which is only true for the optimal policy. Yeah, sorry, this is, like, if and only if. So this only holds for the optimal policy, and if you have the optimal policy, then this.","zh":"所以，本质上，我们可以这样理解Q学习：当我们优化第三步时，我们正在尝试找到一个Q函数，使得它满足这个方程，这个方程只在最优策略下成立。是的，抱歉，这是充要条件。所以，这个只在最优策略下成立，如果你有最优策略，那么这个。","start":1552.5,"end":1576.2},{"id":111,"text":"Yeah, great question. So the question is, if we have really good estimates of Q, will this converge? We'll talk about this in one minute. So let's first just talk about some terminology really quick. Reinforcement learning has a ton of terminology. It's useful to know some of it so that if someone's talking to you about reinforcement learning or you're reading a paper, you know what they're talking about it. This first equation is often referred to as the Bellman equation.","zh":"是的，非常好的问题。问题是，如果我们对Q有非常好的估计，这个是否会收敛？我们会在一会儿讨论这个问题。所以，让我们先快速谈一些术语。强化学习有很多术语。了解一些术语是有用的，这样当你和别人讨论强化学习，或者你在读论文时，你知道他们在说什么。第一个方程通常被称为贝尔曼方程。","start":1577.5,"end":1602.96},{"id":112,"text":"It's a very useful object and it's what we were using to try to do policy evaluations for a policy. And the second equation is called the Bellman Optimality Equation because it's specifically for optimal policies. Sometimes people also informally might call the second one a Bellman Equation as well.","zh":"这是一个非常有用的工具，我们用它来尝试对一个策略进行策略评估。第二个方程被称为贝尔曼最优方程，因为它专门针对最优策略。有时人们也非正式地称第二个方程为贝尔曼方程。","start":1603.76,"end":1623.43},{"id":113,"text":"Officially, the first one is Bellman Equation, the second one is Bellman Optimality Equation. You can derive equations like this that are also for the value function b instead of the q function, and we'll also refer to those as Bellman Equation and Bellman Optimality Equation.","zh":"正式地说，第一个是贝尔曼方程，第二个是贝尔曼最优方程。你也可以推导出类似的方程，这些方程是针对值函数b而不是Q函数的，我们也会将这些称为贝尔曼方程和贝尔曼最优方程。","start":1626.53,"end":1655.68},{"id":114,"text":"The good news is that if you're in a very simple setting where you can actually store all of your key values in a table for every single state and action, this would be for a very small, discrete state and action state, and if you have sufficient exploration, then this algorithm will convert. So that's the good news. The bad news is that basically in any other scenario, it is not guaranteed to convert.","zh":"好消息是，如果你处于一个非常简单的设置中，可以将所有关键值存储在表格中，对于每一个状态和动作，这适用于非常小的离散状态和动作空间，如果你有足够的探索，那么这个算法会收敛。所以这是好消息。坏消息是，基本上在任何其他情况下，它都不能保证收敛。","start":1656.98,"end":1684.44}],"notes":["本段讨论了Q学习中贝尔曼方程与贝尔曼最优方程的区别，以及Q学习算法在不同场景下的收敛性问题。贝尔曼方程用于评估策略，而贝尔曼最优方程则用于最优策略。在简单离散状态和动作空间中，如果存在充分的探索，Q学习算法可以收敛到最优策略；但在其他复杂场景中，算法并不保证收敛。","讲者指出，贝尔曼方程和贝尔曼最优方程是强化学习中的核心概念，用于描述价值函数和最优策略之间的关系。贝尔曼最优方程仅在最优策略下成立，而贝尔曼方程则适用于任意策略。"],"formulas":[],"uncertainties":["convert"],"diagram":"none","start":1521.44,"end":1684.44,"asr_flags":[],"math_clarifications":["原始片段中未提供具体的数学公式，仅包含对Q值的描述性语言，因此无法进行数学校对。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1521.44,"text":"and if you look at our update right here we're trying to fit a Q function that is predicting this and essentially with this equation you can think about it as this update is actually trying to make this equation true so we're trying to make the left side of the equation equal to the right side of the equation and when this equation is true that means our policy is valid"},{"start":1552.5,"text":"So essentially one way to think about Q-learning is that when we're optimizing step 3, we're trying to find a Q-function such that it satisfies this equation, which is only true for the optimal policy. Yeah, sorry, this is, like, if and only if. So this only holds for the optimal policy, and if you have the optimal policy, then this."},{"start":1577.5,"text":"Yeah, great question. So the question is, if we have really good estimates of Q, will this converge? We'll talk about this in one minute. So let's first just talk about some terminology really quick. Reinforcement learning has a ton of terminology. It's useful to know some of it so that if someone's talking to you about reinforcement learning or you're reading a paper, you know what they're talking about it. This first equation is often referred to as the Bellman equation."},{"start":1603.76,"text":"It's a very useful object and it's what we were using to try to do policy evaluations for a policy. And the second equation is called the Bellman Optimality Equation because it's specifically for optimal policies. Sometimes people also informally might call the second one a Bellman Equation as well."},{"start":1626.53,"text":"Officially, the first one is Bellman Equation, the second one is Bellman Optimality Equation. You can derive equations like this that are also for the value function b instead of the q function, and we'll also refer to those as Bellman Equation and Bellman Optimality Equation. Okay, so getting back to the question, if we do this iteratively, will we convert to the optional policies? There's good news and bad news here."},{"start":1656.98,"text":"The good news is that if you're in a very simple setting where you can actually store all of your key values in a table for every single state and action, this would be for a very small, discrete state and action state, and if you have sufficient exploration, then this algorithm will convert. So that's the good news. The bad news is that basically in any other scenario, it is not guaranteed to convert."}],"speech_gaps":[],"frame":"../frames/v033/010.webp","frame_time":1533.44},{"title":"Q学习的收敛性与探索策略","segments":[{"id":115,"text":"and you can construct scenarios when it diverges, even with just linear two functions, which is kind of sad. I guess the flip side of that is that even though it can diverge in scenarios, it can be made to work very well, and we'll see some examples of it working very well at the end of the lesson.","zh":"你可以构造一些场景，即使只使用线性函数，它也会发散，这有点令人沮丧。我想，另一方面是，尽管它在某些场景中可能会发散，但也可以让它表现得非常好，我们将在课程结束时看到一些它表现非常好的例子。","start":1685.12,"end":1703.78},{"id":116,"text":"Yeah, so the question is, what does this mean? What does the statement mean? It is a bit vague. Specifically, it doesn't necessarily have to do with the accuracy of your key values, because you're actually going to be fitting your key values through this process. It's more a statement of the size of your state and action space. And if it's small enough that you can maintain this table,","zh":"是的，所以问题是，这意味着什么？这个陈述意味着什么？它有点模糊。具体来说，它并不一定与你的关键值的准确性有关，因为你会通过这个过程来拟合你的关键值。它更像是在陈述你的状态和动作空间的大小。如果它足够小，以至于你可以维护这个表格，","start":1704.65,"end":1730.13},{"id":117,"text":"And in particular, it might actually make a lot of sense for it to be broader than our current policy, because we're going to be doing this maximization over our key values. And so when we do this maximization, we're going to be considering a lot of different possible actions. If we have a discrete action space, we might actually just consider all of the possible actions. And when we do that, we would want our key values to be accurate when we're considering all of them. And if there's one action that we haven't collected data for,","zh":"特别是，它可能实际上比我们当前的策略更广泛，因为我们将在关键值上进行最大化操作。因此，当我们进行这个最大化操作时，我们会考虑很多不同的可能动作。如果我们有离散的动作空间，我们可能会直接考虑所有可能的动作。当我们这样做时，我们希望在考虑所有动作时，关键值是准确的。如果有一个动作我们没有收集数据，","start":1731.77,"end":1758.14},{"id":118,"text":"that we're going to be considering in this optimization, it might be erroneously high, because we didn't collect any data for it, and then you'll get an inaccurate target value when you are fitting your key. And so, instead of collecting data from our current policy, it'd be useful to collect data from some exploration policy, and specifically a policy that's collecting a broader set of actions than our deterministic policy. We want coverage for a lot of different actions, specifically for this term.","zh":"而在优化过程中被考虑，它可能会被错误地高估，因为我们没有为其收集任何数据，然后你在拟合关键值时会得到一个不准确的目标值。因此，与其从当前策略中收集数据，从某种探索策略中收集数据会更有用，特别是从一个收集比我们确定性策略更广泛动作集合的策略中。我们希望覆盖很多不同的动作，特别是针对这个项。","start":1759.18,"end":1784.58},{"id":119,"text":"And there's a couple choices here. One choice is to mostly follow our policy, like to follow our policy most of the time, but with some small probabilities, take a completely random action. And so what that would look like is a policy that with some probabilities, I would say maybe you can write it as like take a random action.","zh":"这里有几个选择。一种选择是主要遵循我们的策略，比如大多数时间遵循我们的策略，但以一些小的概率采取完全随机的动作。这看起来像是一种策略，其中以一定的概率，我可以说，你可以把它写成采取随机动作。","start":1785.1,"end":1817.23},{"id":120,"text":"And there's a couple choices here. One choice is to mostly follow our policy, like to follow our policy most of the time, but with some small probabilities, take a completely random action. And so what that would look like is a policy that with some probabilities, I would say maybe you can write it as like take a random action.","zh":"这里有几个选择。一种选择是主要遵循我们的策略，比如大多数时间遵循我们的策略，但以一些小的概率采取完全随机的动作。这样做出来的策略就是，以一定的概率，我可以说，你可以把它写成采取随机动作。","start":1817.94,"end":1847.27}],"notes":["本段讨论了Q学习的收敛性问题，指出即使在有限的函数空间中，Q学习也可能发散，但通过适当的探索策略可以使其有效工作。这强调了探索策略在Q学习中的重要性。","Q学习是off-policy算法，这意味着它不依赖于当前策略生成的数据，而是可以使用其他策略（如探索策略）的数据进行更新。这种特性使得Q学习能够考虑更广泛的行动空间。","在进行最大化操作时，需要确保所有可能的行动都被考虑，尤其是那些未被当前策略收集数据的行动。如果这些行动的Q值估计不准确，会导致目标值的偏差。","为了确保覆盖所有可能的行动，可以采用探索策略，如ε-greedy策略，即大部分时间遵循当前策略，但以一定概率随机选择行动。这种策略有助于平衡探索与利用。","探索策略的选择直接影响Q学习的收敛性和性能。如果探索不足，可能导致某些行动的Q值估计不准确，从而影响整体学习效果。","Q学习的收敛性依赖于状态和行动空间的大小，以及探索策略的有效性。因此，在实际应用中需要根据具体问题调整探索策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1685.12,"end":1847.27,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1685.12,"text":"and you can construct scenarios when it diverges, even with just linear two functions, which is kind of sad. I guess the flip side of that is that even though it can diverge in scenarios, it can be made to work very well, and we'll see some examples of it working very well at the end of the lesson."},{"start":1704.65,"text":"Yeah, so the question is, what does this mean? What does the statement mean? It is a bit vague. Specifically, it doesn't necessarily have to do with the accuracy of your key values, because you're actually going to be fitting your key values through this process. It's more a statement of the size of your state and action space. And if it's small enough that you can maintain this table,"},{"start":1731.77,"text":"And there's also a condition on explorations where you actually need to have full coverage of the state and actions in your data set, then it will complete. Okay, so one note about this is Q-learning is off-policy, and in particular, this equation holds for all states and actions, and it means that we don't have to have the actions coming from our current fault."},{"start":1759.18,"text":"And in particular, it might actually make a lot of sense for it to be broader than our current policy, because we're going to be doing this maximization over our key values. And so when we do this maximization, we're going to be considering a lot of different possible actions. If we have a discrete action space, we might actually just consider all of the possible actions. And when we do that, we would want our key values to be accurate when we're considering all of them. And if there's one action that we haven't collected data for,"},{"start":1785.1,"text":"that we're going to be considering in this optimization, it might be erroneously high, because we didn't collect any data for it, and then you'll get an inaccurate target value when you are fitting your key. And so, instead of collecting data from our current policy, it'd be useful to collect data from some exploration policy, and specifically a policy that's collecting a broader set of actions than our deterministic policy. We want coverage for a lot of different actions, specifically for this term."},{"start":1817.94,"text":"And there's a couple choices here. One choice is to mostly follow our policy, like to follow our policy most of the time, but with some small probabilities, take a completely random action. And so what that would look like is a policy that with some probabilities, I would say maybe you can write it as like take a random action."}],"speech_gaps":[],"frame":"../frames/v033/011.webp","frame_time":1697.12},{"title":"Q学习中的探索策略","segments":[{"id":121,"text":"with probability epsilon, and follow, maybe we can call this pi x-greedy, and follow the action, follow your current policy with probability one minus epsilon. And you can write that out slightly more formally up here.","zh":"以概率 epsilon，你可以称之为 pi x-greedy，然后按照当前策略以概率 1 减去 epsilon 执行动作。你可以在这里更正式地写出这个过程。","start":1849.13,"end":1878.75},{"id":122,"text":"And this can be a good choice because it means that when you take an action uniformly at random, it means that you'll get very good coverage of the actions that you consider. And oftentimes, as you proceed through training, you might start with a larger epsilon so that you have more exploration at the beginning of training. And then as your policy is getting better, and as you're getting a better estimate of your Q function, you can then make this smaller and explore less as you go through training.","zh":"这可能是一个不错的选择，因为它意味着当你随机均匀地采取动作时，你会很好地覆盖你考虑的所有动作。在训练过程中，你可能会一开始使用较大的 epsilon，以在训练初期进行更多的探索。随着策略变得更好，以及你对 Q 函数的估计更加准确，你可以逐渐减小 epsilon，减少探索。","start":1880.42,"end":1909.11},{"id":123,"text":"This is called epsilon-greed because you're being greedy some of the time, and epsilon-probability is the time you're not being greedy and just taking advantage. Okay, and then another choice that's also somewhat reasonable, although a little bit more complicated, is to take actions with probability that is proportional to the key values.","zh":"这被称为 epsilon-greedy，因为有时你会采取贪婪策略，而 epsilon 概率是你不采取贪婪策略，而是随机选择动作。好的，另一个也相当合理的做法，虽然稍微复杂一些，是根据关键值以与之成比例的概率采取动作。","start":1911.47,"end":1937.5},{"id":124,"text":"And so if you have actions that have a higher key value, then take those actions more frequently, and if you have actions with lower probability, then take those actions less frequently. One way to write this is you could exponentiate your key values so that they're all positive, and then normalize in order to get a probability distribution over that.","zh":"因此，如果你有关键值较高的动作，就更频繁地采取这些动作；如果你有关键值较低的动作，就较少地采取这些动作。一种写法是你可以将关键值指数化，使它们都为正，然后归一化以获得该动作上的概率分布。","start":1937.95,"end":1959.62},{"id":125,"text":"Sometimes this is called Boltzmann Exploration, named after the Boltzmann Distribution, where you exponentially among.","zh":"有时这种方法被称为 Boltzmann 探索，以 Boltzmann 分布命名，其中你按指数方式在动作之间进行选择。","start":1961.14,"end":1969.1},{"id":126,"text":"Yeah, so the question is how do you, if you have, it's pretty hard to do this with discrete actions,","zh":"是的，问题是，如果你有离散动作，如何做到这一点就相当困难，","start":1970.2,"end":1975.3},{"id":127,"text":"how do you do these kinds of approaches when you have continuous actions?","zh":"当你有连续动作时，如何实现这些方法？","start":1975.5,"end":1978.9},{"id":128,"text":"The first one is indeed a lot more common with discrete actions.","zh":"第一个方法确实更常用于离散动作。","start":1979.46,"end":1982.92},{"id":129,"text":"You could still do something like this with continuous actions,","zh":"你仍然可以这样做，即使使用连续动作，","start":1984.4,"end":1987.38},{"id":130,"text":"actions, but you would need to define some uniform-ish distribution over your continuous","zh":"动作，但你需要在连续动作上定义某种近似均匀的分布。","start":1987.38,"end":1992.9},{"id":131,"text":"actions. And for that you would need some sort of range or something. Instead you could","zh":"对于这一点，你需要某种范围或类似的东西。相反，你也可以","start":1992.9,"end":1997.46},{"id":132,"text":"also use a Gaussian distribution with a wide standard deviation in principle, where you","zh":"原则上使用一个具有较宽标准差的高斯分布，在其中进行采样。","start":1997.46,"end":2001.82},{"id":133,"text":"sample from that. I think in continuous action spaces this second option is a bit more common.","zh":"我认为在连续动作空间中，第二种选项更为常见。","start":2001.82,"end":2008.18},{"id":134,"text":"In terms of sampling from it, off the top of my head I actually can't remember the details","zh":"就如何从其中进行采样而言，说实话，我目前无法回忆起具体的细节，","start":2008.92,"end":2016.84},{"id":135,"text":"of how you would sample from this, but we can post on Ed's website.","zh":"但我们可以在Ed的网站上发帖讨论。","start":2016.84,"end":2021.12},{"id":136,"text":"It's possible that the way that you do it is actually just to try to fit a policy,","zh":"有可能，你实际采用的方法就是尝试拟合一个策略，","start":2022.62,"end":2025.84},{"id":137,"text":"but yeah, we can talk about it afterwards.","zh":"但对了，我们之后可以谈谈这个。","start":2026.94,"end":2028.64}],"notes":["本段讲解了Q学习中常用的探索策略，即ε-贪心策略。该策略在每次动作选择时，以概率ε随机选择动作，以概率1-ε遵循当前策略。这种策略有助于在训练初期增加探索，随着训练进行逐渐减少探索，提高收敛速度。","在探索策略中，还提到了另一种方法，即基于动作的键值（key values）进行概率分配，这被称为Boltzmann探索。该方法通过指数函数将键值转换为概率分布，从而实现对高键值动作的偏好。","对于离散动作空间，ε-贪心策略更为常见，而连续动作空间则需要不同的方法，如使用均匀分布或高斯分布进行采样。在连续动作空间中，使用高斯分布更为常见。","在连续动作空间中，如何进行采样是一个实际问题，但具体细节可能需要进一步讨论或查阅相关资源。这表明在实际应用中，探索策略的选择和实现需要根据具体问题进行调整。","课堂中提到的探索策略不仅涉及动作选择的概率分配，还涉及训练过程中探索与利用的平衡。这种平衡对于Q学习的收敛和性能至关重要。","在讨论探索策略时，教师强调了不同策略的适用场景和优缺点，例如ε-贪心策略在离散动作空间中的常见性，以及Boltzmann探索在连续动作空间中的潜在优势。"],"formulas":[],"uncertainties":["pi x-quartion","exponentially among"],"diagram":"none","start":1849.13,"end":2028.64,"asr_flags":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":1849.13,"text":"with probability epsilon, and follow, maybe we can call this pi x-quartion, and follow the action, follow your current policy with probability one minus epsilon. And you can write that out slightly more formally up here."},{"start":1880.42,"text":"And this can be a good choice because it means that when you take an action uniformly at random, it means that you'll get very good coverage of the actions that you consider. And oftentimes, as you proceed through training, you might start with a larger epsilon so that you have more exploration at the beginning of training. And then as your policy is getting better, and as you're getting a better estimate of your Q function, you can then make this smaller and explore less as you go through training."},{"start":1911.47,"text":"This is called epsilon-greed because you're being greedy some of the time, and epsilon-probability is the time you're not being greedy and just taking advantage. Okay, and then another choice that's also somewhat reasonable, although a little bit more complicated, is to take actions with probability that is propo
