rtional to the key values."},{"start":1937.95,"text":"And so if you have actions that have a higher key value, then take those actions more frequently, and if you have actions with lower probability, then take those actions less frequently. One way to write this is you could exponentiate your key values so that they're all positive, and then normalize in order to get a probability distribution over that."},{"start":1961.14,"text":"Sometimes this is called Boltzmann Exploration, named after the Boltzmann Distribution, where you exponentially among."},{"start":1970.2,"text":"Yeah, so the question is how do you, if you have, it's pretty hard to do this with discrete actions,"},{"start":1975.5,"text":"how do you do these kinds of approaches when you have continuous actions?"},{"start":1979.46,"text":"The first one is indeed a lot more common with discrete actions."},{"start":1984.4,"text":"You could still do something like this with continuous actions,"},{"start":1987.38,"text":"actions, but you would need to define some uniform-ish distribution over your continuous"},{"start":1992.9,"text":"actions. And for that you would need some sort of range or something. Instead you could"},{"start":1997.46,"text":"also use a Gaussian distribution with a wide standard deviation in principle, where you"},{"start":2001.82,"text":"sample from that. I think in continuous action spaces this second option is a bit more common."},{"start":2008.92,"text":"In terms of sampling from it, off the top of my head I actually can't remember the details"},{"start":2016.84,"text":"of how you would sample from this, but we can post on Ed's website."},{"start":2022.62,"text":"It's possible that the way that you do it is actually just to try to fit a policy,"},{"start":2026.94,"text":"but yeah, we can talk about it afterwards."}],"speech_gaps":[],"frame":"../frames/v033/012.webp","frame_time":1861.13},{"title":"Q学习算法的结构与数据收集策略","segments":[{"id":138,"text":"Okay, so putting the pieces together,","zh":"好的，那么把各个部分综合起来，","start":2029.72,"end":2031.18},{"id":139,"text":"what a full Q-learning algorithm looks like is","zh":"一个完整的Q学习算法看起来是","start":2032.52,"end":2035.06},{"id":140,"text":"we'll collect data using some policy,","zh":"我们使用某种策略来收集数据，","start":2035.58,"end":2037.74},{"id":141,"text":"we'll add that data to our replay buffer,","zh":"然后我们将这些数据添加到我们的回放缓冲区中，","start":2038.52,"end":2040.5},{"id":142,"text":"then we will sample a batch of data from our replay buffer,","zh":"接着我们会从回放缓冲区中均匀地采样一批数据，","start":2041.74,"end":2044.44},{"id":143,"text":"uniformly, and this is useful to sample about separately from what we just collected, so","zh":"这样做有助于从我们刚刚收集的数据中独立地进行采样，因此","start":2046.14,"end":2051.5},{"id":144,"text":"that we are de-correlating and sampling IIDs from our replay buffer. And then we will update","zh":"我们可以对回放缓冲区中的数据进行去相关处理，并进行独立同分布（IID）的采样。然后我们会通过计算L2损失的梯度来更新","start":2051.5,"end":2059.02},{"id":145,"text":"our skew function by taking the gradient of the L2 loss with the sector that we started.","zh":"我们通过取L2损失函数在初始扇区上的梯度来定义我们的偏斜函数。","start":2059.02,"end":2065.96},{"id":146,"text":"And so if you write that out, you'll get a gradient that looks like this, where if you're","zh":"因此，如果你把它写出来，你会得到一个梯度，看起来像这样，其中如果你在","start":2066.68,"end":2074.04},{"id":147,"text":"else to watch.","zh":"其他地方观看。","start":2074.04,"end":2074.52},{"id":148,"text":"then on the inside, this is the inside of the LP loss, and then you use the chain rule to get the second term right here that's back-propagating into your parameter. You can repeat these multiple times. So you can actually take multiple gradient subs after collecting about the data. In practice, it's actually pretty common to set k equal to 1.","zh":"那么在内部，这是线性规划损失函数的内部，然后你使用链式法则来得到这里的第二项，它会反向传播到你的参数中。你可以重复这些多次。因此，你实际上可以在收集完数据后多次进行梯度子步骤。在实践中，实际上非常常见的是将k设为1。","start":2076.12,"end":2100.53},{"id":149,"text":"But you can, it's more efficient, you're going to be more data efficient if you have a larger pay to take more gradient steps for a given box of data. And then you also iterate this process after you're done taking these pay gradient steps, then you can collect some more data and repeat. Yeah, so the question was, if you're collecting data from any policy, wouldn't that be less optimal than using a good policy, or at least using your current policy?","zh":"但你可以这样做，效率更高，如果你在一个数据框中进行更多的梯度步骤，你会更高效地利用数据。然后在你完成这些梯度步骤后，你也可以收集一些更多的数据并重复这个过程。是的，所以问题是，如果你从任何策略中收集数据，这不会比使用一个好的策略，或者至少使用你当前的策略更优吗？","start":2101.31,"end":2129.82},{"id":150,"text":"Yeah, so the reason why you might use a different policy is specifically to learn a more accurate Q function. And so it's actually going to help you learn a more optimal policy later.","zh":"是的，你可能会使用不同策略的原因是具体为了学习一个更准确的Q函数。因此，这实际上会帮助你后来学习一个更优的策略。","start":2130.39,"end":2147.99},{"id":151,"text":"And essentially there's a trade-off between collecting less optimal data at the beginning to help you be better later on. And one way to think about this is if you are, say your reinforcement learning agent is trying to help you pick a restaurant, if you haven't really explored that many restaurants to know what is a good restaurant, then at the beginning probably you want to explore and actually try things, even restaurants that might be suboptimal, in order to get a good estimate of what good restaurants are for a particular person.","zh":"本质上，存在一个权衡：在开始时收集较少最优的数据，以帮助你之后表现得更好。一种思考方式是，如果你的强化学习代理试图帮助你选择一家餐厅，如果你还没有探索很多餐厅来了解什么是好的餐厅，那么在开始时你可能想要探索并实际尝试一些事情，甚至可能是次优的餐厅，以便获得关于特定人好餐厅的良好估计。","start":2148.81,"end":2176.91},{"id":152,"text":"And then later on, once you have a good view function, once you have a good estimate for what good restaurants are, then you might want to then explore less. So kind of visually what this looks like is you have some environment. You'll initialize your replay buffer as empty. And then at the first step, you'll run your policy, like the Epsilon 3D policy that's exploring in the environment. You'll then get some transitions that you put into your replay buffer.","zh":"然后，一旦你有了一个好的价值函数，一旦你有了关于好餐厅的良好估计，你可能想要减少探索。这种视觉上看起来的样子是，你有一个环境。你将你的回放缓冲区初始化为空。然后在第一步，你运行你的策略，比如在环境中进行探索的Epsilon 3D策略。你将获得一些转移，并将它们放入你的回放缓冲区中。","start":2177.52,"end":2205.58}],"notes":["本段讲解了Q学习算法的结构，包括数据收集、存储、采样和更新过程。首先，使用某种策略收集数据并存储到回放缓冲区中，然后从缓冲区中均匀采样一批数据，以实现数据的独立同分布（IID）。接着，通过计算L2损失的梯度来更新Q函数，这涉及到链式法则的应用，将梯度传播到参数中。在实践中，通常设置k=1，即每次更新只进行一次梯度下降。","讲者提到，使用不同的策略收集数据可能有助于学习更准确的Q函数，从而在后续阶段学习更优的策略。这涉及一个权衡：在初期收集次优数据以帮助后期获得更好的结果。","通过类比餐厅选择的例子，讲者说明了探索与利用的权衡。在初期，由于缺乏经验，需要探索更多选项，即使这些选项可能不是最优的；而在后期，当对环境有了较好的估计后，可以减少探索，专注于利用已知的优质选项。","讲者还提到，初始化回放缓冲区为空，并在第一步运行探索策略（如ε-贪心策略），以获取初始的环境转移数据。这为后续的Q函数学习提供了基础数据。","在数据收集和更新过程中，讲者强调了数据效率的重要性，即通过增加梯度步数来提高模型性能，同时保持数据的独立性。","讲者指出，使用不同的策略（如探索策略）来收集数据，虽然在初期可能不是最优的，但有助于学习更准确的Q函数，从而在后续阶段获得更优的策略。"],"formulas":[],"uncertainties":["pay to take more gradient steps for a given box of data","good view function"],"diagram":"none","start":2029.72,"end":2205.58,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":2029.72,"text":"Okay, so putting the pieces together,"},{"start":2032.52,"text":"what a full Q-learning algorithm looks like is"},{"start":2035.58,"text":"we'll collect data using some policy,"},{"start":2038.52,"text":"we'll add that data to our replay buffer,"},{"start":2041.74,"text":"then we will sample a batch of data from our replay buffer,"},{"start":2046.14,"text":"uniformly, and this is useful to sample about separately from what we just collected, so"},{"start":2051.5,"text":"that we are de-correlating and sampling IIDs from our replay buffer. And then we will update"},{"start":2059.02,"text":"our skew function by taking the gradient of the L2 loss with the sector that we started."},{"start":2066.68,"text":"And so if you write that out, you'll get a gradient that looks like this, where if you're"},{"start":2074.04,"text":"else to watch."},{"start":2076.12,"text":"then on the inside, this is the inside of the LP loss, and then you use the chain rule to get the second term right here that's back-propagating into your parameter. You can repeat these multiple times. So you can actually take multiple gradient subs after collecting about the data. In practice, it's actually pretty common to set k equal to 1."},{"start":2101.31,"text":"But you can, it's more efficient, you're going to be more data efficient if you have a larger pay to take more gradient steps for a given box of data. And then you also iterate this process after you're done taking these pay gradient steps, then you can collect some more data and repeat. Yeah, so the question was, if you're collecting data from any policy, wouldn't that be less optimal than using a good policy, or at least using your current policy?"},{"start":2130.39,"text":"Yeah, so the reason why you might use a different policy is specifically to learn a more accurate Q function. And so it's actually going to help you learn a more optimal policy later."},{"start":2148.81,"text":"And essentially there's a trade-off between collecting less optimal data at the beginning to help you be better later on. And one way to think about this is if you are, say your reinforcement learning agent is trying to help you pick a restaurant, if you haven't really explored that many restaurants to know what is a good restaurant, then at the beginning probably you want to explore and actually try things, even restaurants that might be suboptimal, in order to get a good estimate of what good restaurants are for a particular person."},{"start":2177.52,"text":"And then later on, once you have a good view function, once you have a good estimate for what good restaurants are, then you might want to then explore less. So kind of visually what this looks like is you have some environment. You'll initialize your replay buffer as empty. And then at the first step, you'll run your policy, like the Epsilon 3D policy that's exploring in the environment. You'll then get some transitions that you put into your replay buffer."}],"speech_gaps":[],"frame":"../frames/v033/013.webp","frame_time":2041.72},{"title":"Q学习中的策略与经验回放","segments":[{"id":153,"text":"For this part, you'll then use your replay buffer to update your key function on the data that you see, with the goal of trying to get something that is not saying the key function of the auth. So the question is, when we combine this with one, can we still call this auth policy? It could be our collecting data, potentially from a policy that's very similar to our current policy. Because we're using a replay buffer of essentially all of our past experience,","zh":"对于这一部分，你将使用你的经验回放缓冲区来更新你的关键函数，以你所看到的数据为目标，目的是得到一个不直接说明认证函数的东西。因此问题是，当我们将其与一个结合时，我们还能称之为认证策略吗？这可能是我们收集数据，潜在地来自一个与当前策略非常相似的策略。因为我们使用的是基本上所有过去经验的经验回放缓冲区。","start":2208.38,"end":2238.2},{"id":154,"text":"When we do these updates, it's referred to as off-policy. That doesn't mean that none of the data is from our current policy. Some of the data in the replay buffer will be from the current policy. But essentially what off-policy means is that you're not only using that data, you're also using data from other policies. In practice, what is the sum policy? Yeah, so in practice, it's exactly what we talked about on the last slide. So it would either be something like epsilon greedy.","zh":"当我们进行这些更新时，被称为离策略。这并不意味着没有任何数据来自当前策略。经验回放缓冲区中的一些数据将来自当前策略。但本质上，离策略意味着你不仅使用这些数据，还使用其他策略的数据。在实践中，什么是总策略？是的，所以在实践中，它正是我们在上一张幻灯片中讨论的内容。因此可能是像 epsilon 贪婪这样的策略。","start":2239.02,"end":2267.92},{"id":155,"text":"where with some small probability you're taking a random action, and otherwise following the policy, or something where you're taking actions in proportions that are too large. As we talked about, it might actually change during training. You might actually change Epsilon during training so that you're doing more exploration at the beginning and less exploration later on. Yeah, so the question is, are we resetting our learning as speed iterations? Oftentimes you will keep your...","zh":"其中，以一定小概率采取随机动作，否则遵循策略，或者采取动作的比例过大。正如我们所讨论的，它可能在训练过程中发生变化。你实际上可能在训练过程中改变 epsilon，以便在开始时进行更多探索，之后进行更少探索。是的，因此问题是，我们是否在每次迭代中重置学习速度？通常你会保留你的旧 Q 参数，对其进行某种预热启动，并在之上继续训练。一个重要的点是，这个算法的结果是 Q，然后要从中提取策略，最终部署的策略是一个根据，尤其是仅采取最大化 Q 的动作的策略。","start":2268.66,"end":2298.36},{"id":156,"text":"old Q parameters around, kind of warm start them and keep on trading on top of them. One important thing, so the result in this algorithm is Q, and then to extract a policy out of that, the final policy that you would then deploy is a policy that is acting according to, especially just be acting greedily, where it's taking the actions that maximize your Q.","zh":"哦，如果经验回放缓冲区的大小是 1，比如一个数据点，那么这将是基于策略的。如果它很小，那么就是完全基于策略的。在实践中，这个经验回放缓冲区会大得多。哦，哦，哦，抱歉。对的。如果经验回放缓冲区的大小是 1，如果这个策略与这个不同，那么它仍然是离策略的，因为策略不同。这是一个好点。","start":2298.49,"end":2326.77},{"id":157,"text":"Oh, so if the size of the replay buffer is one, like one data point, then that would be on policy. So if it's tiny, then that's fully on policy. In practice, this replay buffer is a lot larger. Oh, oh, oh, sorry. Right. If the replay buffer size is one, if this policy is not the same as this, then that's still off policy because the policy is different. Good point.","zh":"哦，如果经验回放缓冲区的大小是 1，比如一个数据点，那么这将是基于策略的。如果它很小，那么就是完全基于策略的。在实践中，这个经验回放缓冲区会大得多。哦，哦，哦，抱歉。对的。如果经验回放缓冲区的大小是 1，如果这个策略与这个不同，那么它仍然是离策略的，因为策略不同。这是一个好点。","start":2327.82,"end":2356.37},{"id":158,"text":"So yeah, this policy might be different from the one that you're acting on. Yeah, so how do we manage our replay buffer, make sure that we're not over-sampling states and so forth? This is generally, it's actually an important consideration with Q-learning algorithms, and usually you will discard old data, so you'll have a first-in, first-out sensible, where this buffer is not infinitely large. Oftentimes with Q-learning it is pretty large, but you will, you can just pick a fixed size, and then once,","zh":"所以是的，这个策略可能和你实际采取的策略不同。是的，那么我们如何管理我们的经验回放缓冲区，确保我们不会过度采样状态等等？这通常是一个重要的考虑因素，特别是在Q学习算法中，通常你会丢弃旧数据，因此这个缓冲区会采用先进先出的方式，使得这个缓冲区并不是无限大的。在Q学习中，这个缓冲区通常相当大，但你可以简单地选择一个固定大小，一旦","start":2357.87,"end":2387.74}],"notes":["本段讨论了Q学习中经验回放（replay buffer）的作用，以及如何利用它来更新关键函数。讲者提到，当使用经验回放时，目标是获取一个不同于当前策略（auth policy）的策略。同时，讲者指出，当经验回放中包含来自不同策略的数据时，算法被称为off-policy。","讲者进一步解释了off-policy的含义，即算法不仅使用当前策略的数据，还使用其他策略的数据。在实践中，sum policy通常指的是epsilon-greedy策略，即以一定概率随机选择动作，其余时间遵循当前策略。","讲者提到，在训练过程中，epsilon值可能会发生变化，以实现探索与利用的平衡。在训练初期增加探索，后期减少探索。此外，讲者还提到，通常不会重置学习速度，而是保留旧的Q参数并进行微调。","讲者指出，最终部署的策略是基于Q值的贪婪策略，即选择最大化Q值的动作。同时，讲者提到，当经验回放的大小为1时，算法会变成on-policy，因为此时所有数据都来自当前策略。","讲者还讨论了经验回放的管理问题，指出需要避免对某些状态的过度采样。通常的做法是丢弃旧数据，采用先进先出（FIFO）的方式管理经验回放缓冲区，以防止缓冲区无限增长。","最后，讲者提到经验回放的大小通常较大，但可以设置为固定值，一旦达到上限，就会丢弃旧数据。这有助于保持数据的多样性，避免过时信息对学习过程的干扰。"],"formulas":[],"uncertainties":["auth policy","sum policy","trading on top of them"],"diagram":"none","start":2208.38,"end":2387.74,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2208.38,"text":"For this part, you'll then use your replay buffer to update your key function on the data that you see, with the goal of trying to get something that is not saying the key function of the auth. So the question is, when we combine this with one, can we still call this auth policy? It could be our collecting data, potentially from a policy that's very similar to our current policy. Because we're using a replay buffer of essentially all of our past experience,"},{"start":2239.02,"text":"When we do these updates, it's referred to as off-policy. That doesn't mean that none of the data is from our current policy. Some of the data in the replay buffer will be from the current policy. But essentially what off-policy means is that you're not only using that data, you're also using data from other policies. In practice, what is the sum policy? Yeah, so in practice, it's exactly what we talked about on the last slide. So it would either be something like epsilon greedy."},{"start":2268.66,"text":"where with some small probability you're taking a random action, and otherwise following the policy, or something where you're taking actions in proportions that are too large. As we talked about, it might actually change during training. You might actually change Epsilon during training so that you're doing more exploration at the beginning and less exploration later on. Yeah, so the question is, are we resetting our learning as speed iterations? Oftentimes you will keep your..."},{"start":2298.49,"text":"old Q parameters around, kind of warm start them and keep on trading on top of them. One important thing, so the result in this algorithm is Q, and then to extract a policy out of that, the final policy that you would then deploy is a policy that is acting according to, especially just be acting greedily, where it's taking the actions that maximize your Q."},{"start":2327.82,"text":"Oh, so if the size of the replay buffer is one, like one data point, then that would be on policy. So if it's tiny, then that's fully on policy. In practice, this replay buffer is a lot larger. Oh, oh, oh, sorry. Right. If the replay buffer size is one, if this policy is not the same as this, then that's still off policy because the policy is different. Good point."},{"start":2357.87,"text":"So yeah, this policy might be different from the one that you're acting on. Yeah, so how do we manage our replay buffer, make sure that we're not over-sampling states and so forth? This is generally, it's actually an important consideration with Q-learning algorithms, and usually you will discard old data, so you'll have a first-in, first-out sensible, where this buffer is not infinitely large. Oftentimes with Q-learning it is pretty large, but you will, you can just pick a fixed size, and then once,"}],"speech_gaps":[],"frame":"../frames/v033/014.webp","frame_time":2220.38},{"title":"Q学习中的经验回放与目标网络","segments":[{"id":159,"text":"you have filled it to that size, start discarding data, and discard the oldest data first. One other consideration is that at the very beginning of training, the replay buffer might be very small. Sometimes, to handle that, you might try to select more data the very first iteration, just repopulate it. There are also algorithms that we won't quite cover that do asynchronous.","zh":"当你将它填充到那个大小时，开始丢弃数据，并且优先丢弃最旧的数据。另一个需要考虑的是，在训练的最初阶段，经验回放缓冲区可能非常小。有时，为了处理这种情况，你可能会在第一次迭代中尝试选择更多的数据，仅仅是为了重新填充它。还有一些我们不会详细讲解的算法，它们是异步的。","start":2388.14,"end":2413.28},{"id":160,"text":"data collection and updates, because data collection takes time, updating a neural network takes time, and so you could actually have some threads that are actually adding to the replay buffer and other threads that are running updates on your key functions. With those asynchronous algorithms, it's actually especially important to think about how the replay buffer is managed so that you're not running like a thousand gradient steps on one data point and one gradient step on the other.","zh":"数据收集和更新之间存在时间上的差异，因为数据收集需要时间，更新神经网络也需要时间，因此你实际上可以有某些线程在向经验回放缓冲区添加数据，而其他线程则在运行你的关键函数的更新。在这些异步算法中，实际上特别重要的是要考虑经验回放缓冲区的管理方式，以确保你不会对一个数据点运行一千次梯度步骤，而对另一个数据点只运行一次梯度步骤。","start":2414.16,"end":2447.15},{"id":161,"text":"what happens in practice when you use these methods. So we talked about how Q-learning can diverge, and in general, when you run Q-learning with neural networks, it can be unstable. And one of the reasons for that is you have this moving target, this max of Q, and it means that our optimization process is very non-stationary, especially if K is 1.","zh":"当你实际使用这些方法时会发生什么。我们已经讨论过Q学习可能会发散，一般来说，当你使用神经网络运行Q学习时，它可能是不稳定的。其中一个原因是，你有一个移动的目标，即Q的最大值，这意味着我们的优化过程是非常非平稳的，尤其是当K等于1时。","start":2447.81,"end":2475.69},{"id":162,"text":"One trick is to try to slow down how often you change the target. So instead of having you target change every single time you change your parameters, one idea is you could freeze the parameters of your target network and only update them periodically, only update them once every hundred gradient steps.","zh":"一个技巧是尝试减缓你改变目标的频率。因此，而不是每次你改变参数时都改变目标，一个想法是你可以冻结目标网络的参数，只在定期的时候更新它们，例如每一百次梯度步骤更新一次。","start":2479.88,"end":2505.16},{"id":163,"text":"So what this looks like is we can save a separate neural network, another copy of our two function parameters. We'll call this five prime. And when we save this out, then just for this target right here, we can use these new parameters to use five prime.","zh":"这看起来像我们保存一个单独的神经网络，即我们两个函数参数的另一个副本。我们将称其为五 prime。当我们保存这个副本时，对于这个目标，我们可以使用这些新的参数来使用五 prime。","start":2508.11,"end":2536.63}],"notes":["本段讨论了在强化学习中使用经验回放和异步算法时需要注意的问题。在训练初期，经验回放缓冲区可能很小，因此需要在第一次迭代中选择更多数据以填充缓冲区。此外，异步算法中需要特别注意经验回放的管理，以避免对单个数据点进行过多梯度更新。","Q学习在使用神经网络时可能不稳定，其中一个原因是目标网络（max of Q）会不断变化，导致优化过程非常非平稳，尤其是在K=1的情况下。这种非平稳性可能导致Q值的发散。","为了解决目标网络变化过快的问题，可以减缓目标网络的更新频率。一种方法是冻结目标网络的参数，仅在每隔一定数量的梯度步骤后更新一次。这样可以减少目标网络的波动，提高训练的稳定性。","目标网络的实现方式是保存一个独立的神经网络，作为主网络参数的副本。这个副本被称为五素（five prime），在需要时使用这些参数来更新目标网络。这种方法有助于保持目标网络的稳定性，避免因频繁更新而导致的性能下降。"],"formulas":[],"uncertainties":["five prime"],"diagram":"none","start":2388.14,"end":2536.63,"asr_flags":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2388.14,"text":"you have filled it to that size, start discarding data, and discard the oldest data first. One other consideration is that at the very beginning of training, the replay buffer might be very small. Sometimes, to handle that, you might try to select more data the very first iteration, just repopulate it. There are also algorithms that we won't quite cover that do asynchronous."},{"start":2414.16,"text":"data collection and updates, because data collection takes time, updating a neural network takes time, and so you could actually have some threads that are actually adding to the replay buffer and other threads that are running updates on your key functions. With those asynchronous algorithms, it's actually especially important to think about how the replay buffer is managed so that you're not running like a thousand gradient steps on one data point and one gradient step on the other. So that's QA. Let's talk a little bit about"},{"start":2447.81,"text":"what happens in practice when you use these methods. So we talked about how Q-learning can diverge, and in general, when you run Q-learning with neural networks, it can be unstable. And one of the reasons for that is you have this moving target, this max of Q, and it means that our optimization process is very non-stationary, especially if K is 1."},{"start":2479.88,"text":"One trick is to try to slow down how often you change the target. So instead of having you target change every single time you change your parameters, one idea is you could freeze the parameters of your target network and only update them periodically, only update them once every hundred gradient steps."},{"start":2508.11,"text":"So what this looks like is we can save a separate neural network, another copy of our two function parameters. We'll call this five prime. And when we save this out, then just for this target right here, we can use these new parameters to use five prime."}],"speech_gaps":[],"frame":"../frames/v033/015.webp","frame_time":2400.14},{"title":"Q学习中的目标网络与稳定性改进","segments":[{"id":164,"text":"In our target. These parameters will be frozen, and so it means that inside this inner loop, the labels will not change. And so this inner loop is essentially going to be doing supervised learning with some data being added to the loop. Web offers. And this would be a lot more stable. Supervised learning is a lot more stable, generally. And then only periodically then update our target network parameters to be the same as our latest C++ script.","zh":"在我们的目标网络中，这些参数将被冻结，这意味着在这个内部循环中，标签不会发生变化。因此，这个内部循环实际上是在使用一些数据进行监督学习。这会更加稳定。监督学习通常更加稳定。然后，我们只在定期的时候更新我们的目标网络参数，使其与我们最新的C++脚本相同。","start":2538.06,"end":2569.41},{"id":165,"text":"So once you use a target network, this is referred to as the DQN algorithm. It was introduced in 2013. It was basically the first DQN method, at least in my opinion. And they found that you could actually train neural networks to play a variety of different Atari games. And it was one of the first examples of using reinforcement learning to train neural networks to do a pretty complicated task.","zh":"一旦你使用了目标网络，这就被称为DQN算法。它是在2013年提出的。它基本上是第一个DQN方法，至少在我的观点中是这样。他们发现实际上可以训练神经网络来玩各种不同的Atari游戏。这也是使用强化学习来训练神经网络完成一个相当复杂任务的第一个例子之一。","start":2572.14,"end":2599.82},{"id":166,"text":"And they were actually training it directly from the pixel observations from the game. And prior to that, a lot of the reinforcement learning examples were on very toy settings or very low-dimensional settings. If you save two tables of two values, will that be the same as this? Yeah, so that's actually not quite the case because you will actually be collecting new data.","zh":"他们实际上是从游戏的像素观测中直接进行训练的。在此之前，很多强化学习的例子都是在非常简单的环境或非常低维的环境中进行的。如果你保存两个表格的两个值，这会和这个情况一样吗？是的，实际上并不是这样，因为你实际上会收集新的数据。","start":2600.16,"end":2627.4},{"id":167,"text":"In this loop, and so you can't just store all the key values. You actually do have to store the parameters so that you can then compute the key values for the new data that you selected, the target key values for the new data. So you can't just store the key values. You have to store the data. Cool. And so this is one of the algorithms that you'll implement in almost everything. Okay, so that's the first trick, is use a target network that you only periodically update.","zh":"在这个循环中，你不能仅仅存储所有的键值。你实际上必须存储参数，以便之后计算新数据的键值，以及新数据的目标键值。因此，你不能仅仅存储键值，你必须存储数据。很好。因此，这就是你将在几乎所有事情中实现的算法之一。好的，所以第一个技巧就是使用一个只定期更新的目标网络。","start":2627.96,"end":2659.91},{"id":168,"text":"There's two more things that make Q-Learning work a lot better. And the first one is actually looking at the accuracy of the key values. So if you plot the reward over training, the reward goes up. That's good. This is a reward on the game of Breakout and the game of FIFA. And if you also plot the key values over the course of training, they're also going up.","zh":"还有两个因素使Q学习的效果更好。第一个因素是查看键值的准确性。如果你绘制奖励随训练的变化，奖励会上升。这是好的。这是Breakout和FIFA游戏的奖励。如果你也绘制键值随训练的变化，它们也会上升。","start":2661.08,"end":2687.17},{"id":169,"text":"And so that is definitely what you expect because the key values are representing your average reward. So that's good. One other thing to note, actually as a practical tip, is when you're looking at the loss function on your key values during training, when you train with DQN, the loss values will actually often go up through training. This is sometimes a little bit alarming because you're used to loss values going down.","zh":"因此，这正是你所期望的结果，因为这些关键值代表的是你的平均奖励。所以这是好的。另外，有一点需要注意，实际上作为一个实用的小贴士，当你在训练过程中查看关键值的损失函数时，使用DQN进行训练时，损失值实际上在训练过程中经常会升高。这有时会让人感到有些惊讶，因为通常我们习惯于损失值下降。","start":2687.65,"end":2713.89}],"notes":["本段讲解了在Q学习中使用目标网络（target network）以提高训练稳定性。目标网络的参数在一段时间内被冻结，仅在特定周期更新，从而减少训练过程中的波动。这种做法类似于监督学习，因为内部循环中的标签不会改变，从而使得训练更加稳定。","目标网络的引入是DQN（Deep Q-Network）算法的核心思想之一，该算法在2013年被提出，被认为是第一个成功应用深度强化学习进行游戏训练的方法。它展示了神经网络可以用于训练复杂任务，如Atari游戏。","在训练过程中，模型直接从游戏的像素观测中学习，而不是依赖于人工设计的特征。这与之前的强化学习方法不同，后者通常在低维或玩具环境中进行。这种直接从像素输入中学习的方式使得模型能够处理更复杂的任务。","在训练过程中，模型需要存储参数而不是仅仅存储关键值（key values），因为关键值是基于新数据计算的。因此，必须存储数据本身，以便在后续计算中使用。","在Q学习中，除了目标网络外，另一个改进是关注关键值的准确性。随着训练的进行，奖励和关键值都会增加，这表明模型正在学习更优的策略。","在训练过程中，损失函数的值可能会随着训练而增加，这与传统的监督学习不同。这种现象有时会让人感到困惑，但实际上是训练过程中正常的一部分。"],"formulas":[],"uncertainties":["DQN（Deep Q-Network）算法的名称在原文中被误识别为“D2M”或“D2N”，需确认正确名称。","“web offers”可能是误识别，需确认其实际含义。","“two tables of two values”可能指代某种数据结构，但具体含义不明确，需进一步澄清。","“key values”在上下文中可能指代Q值（Q-values），但未明确说明，需确认术语一致性。"],"diagram":"none","start":2538.06,"end":2713.89,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2538.06,"text":"in our target. These parameters will be frozen, and so it means that inside this inner loop, the labels will not change. And so this inner loop is essentially going to be doing supervised learning with some data being added to the loop web offers. And this would be a lot more stable. Supervised learning is a lot more stable, generally. And then only periodically then update our target network parameters to be the same as our latest C++ script."},{"start":2572.14,"text":"So once you use a target network, this is referred to as the D2M algorithm. It was introduced in 2013. It was basically the first P4L method, at least in my opinion. And they found that you could actually train neural networks to play a variety of different Atari games. And it was one of the first examples of using reinforcement learning to train neural networks to do a pretty complicated task."},{"start":2600.16,"text":"And they were actually training it directly from the pixel observations from the game. And prior to that, a lot of the reinforcement learning examples were on very toy settings or very low-dimensional settings. If you save two tables of two values, will that be the same as this? Yeah, so that's actually not quite the case because you will actually be collecting new data."},{"start":2627.96,"text":"in this loop, and so you can't just store all the key values. You actually do have to store the parameters so that you can then compute the key values for the new data that you selected, the target key values for the new data. So you can't just store the key values. You have to store the data. Cool. And so this is one of the algorithms that you'll implement in almost everything. Okay, so that's the first trick, is use a target network that you only periodically update."},{"start":2661.08,"text":"There's two more things that make Q-Learning work a lot better. And the first one is actually looking at the accuracy of the key values. So if you plot the reward over training, the reward goes up. That's good. This is a reward on the game of Breakout and the game of FIFA. And if you also plot the key values over the course of training, they're also going up."},{"start":2687.65,"text":"And so that is definitely what you expect because the key values are representing your average reward. So that's good. One other thing to note, actually as a practical tip, is when you're looking at the loss function on your key values during training, when you train with D2N, the loss values will actually often go up through training. This is sometimes a little bit alarming because you're used to loss values going down."}],"speech_gaps":[],"frame":"../frames/v033/016.webp","frame_time":2550.06},{"title":"Q学习中的损失函数与过估计问题","segments":[{"id":170,"text":"But the reason for that is you're collecting new data, and that new data has higher key values, and so the scale of your loss function is increasing throughout training. And at the very beginning, if you're getting like zero reward everywhere, it might be very easy to get a loss function. So yeah, don't be alarmed if your loss function is going up. Sometimes that means that the policy is starting to work. So cool, this looks pretty good. As I predicted, two increases, so this is the return.","zh":"但是，这是因为你在收集新的数据，而这些新数据具有更高的键值，因此在整个训练过程中，你的损失函数的尺度会不断增加。在训练的最开始，如果你在任何地方都得不到奖励，那么获得一个损失函数可能非常容易。所以是的，如果你的损失函数在上升，不要感到惊讶。有时候这表示策略开始起作用了。太棒了，看起来相当不错。正如我预测的，出现了两次增加，所以这就是回报。","start":2714.42,"end":2742.89},{"id":171,"text":"You can also look at the value over training, and you see that in the first case, the values right here are fairly uniform, but once you're in a state where you really have to go up, then the key value for the action of up is higher than going down or a no-up. Likewise, right here, it's really important to go up, and so the key value is higher for going up than the actions of going down or no-up.","zh":"你也可以查看训练过程中的值，你会发现，在第一种情况下，这些值在这里相当均匀，但一旦你处于必须向上移动的状态，那么向上移动的动作的键值就会比向下移动或不移动的键值更高。同样地，这里向上移动非常重要，因此向上移动的键值比向下移动或不移动的动作的键值更高。","start":2744.07,"end":2769.23},{"id":172,"text":"In the right case, it doesn't really matter because the ball is on the other side, on the opponent's side, and so the Q values are more uniform. So when you visualize the Q values, they look pretty reasonable, which is good. But then if you actually plot what the true returns are...","zh":"在右侧的情况下，这并不重要，因为球在对方的那一侧，因此Q值更加均匀。因此，当你可视化Q值时，它们看起来相当合理，这是好的。但如果你实际绘制真实的回报...","start":2769.6,"end":2789.46},{"id":173,"text":"The true returns are shown in red here on this red horizontal line. And the estimate of the values according to the Q network are shown as this upper line. And you actually see this very huge gap between the estimate, where the estimate is always a lot higher than the true value. And so it seems like we're seeing a lot of what's called overestimation, where our Q function is overestimating how good our policy is.","zh":"真实的回报在这里用红色水平线表示。而根据Q网络估计的值则用这条上边的线表示。你实际上可以看到估计值与真实值之间存在非常大的差距，其中估计值总是比真实值高很多。因此，这似乎表明我们看到了大量所谓的过估计现象，即我们的Q函数高估了策略的性能。","start":2791.21,"end":2821.81},{"id":174,"text":"And then there's this algorithm that was introduced called double DQM that's able to get a much more accurate defunction and is able to overestimate far far less than DQM. So let's talk a little bit about double DQM and overestimation in general. So our target value is let's say we're taking a max over action right here and when we take this max","zh":"然后有一种算法被引入，称为Double DQN，它能够获得更准确的函数，并且比DQN少得多地出现过估计。因此，让我们稍微讨论一下Double DQN和过估计问题。我们的目标值可以认为是我们在这里对动作取最大值。当我们取这个最大值时，","start":2823.11,"end":2854.43},{"id":175,"text":"We're choosing an action that maximizes this p-value. Another way to write this is you can think of it as... You can think about this quantity as u of pi of f evaluated at the action that is maximizing our p-pi.","zh":"我们选择的是最大化这个p值的动作。另一种写法是，你可以将这个量视为u的pi的f在最大化我们p-pi的动作处的值。","start":2855.02,"end":2889.58}],"notes":["本段主要讲解了Q学习中损失函数的变化及其背后的原因。在训练初期，由于奖励为零，损失函数可能较低，但随着新数据的收集，损失函数可能上升，这并不一定意味着模型表现变差，反而可能表示策略开始有效。","在训练过程中，Q值的变化可以反映策略的学习情况。在某些状态下，向上移动的Q值会比向下或不移动的Q值更高，这表明策略正在学习到更优的动作选择。","在某些情况下，Q值的分布可能较为均匀，这可能是因为状态本身对动作的选择影响较小。然而，当需要做出关键决策时，Q值的分布会更加明显地反映动作的价值差异。","在可视化Q值时，如果Q值估计与真实回报之间存在显著差距，这可能表明存在过估计问题。过估计会导致Q函数高估策略的实际效果，从而影响学习效率。","为了解决过估计问题，引入了Double DQN算法。该算法通过双重选择动作来减少估计偏差，从而显著降低过估计的程度。","在Double DQN中，目标值的计算涉及对动作的取最大值，这可以看作是对策略函数在最优动作上的评估。这种计算方式有助于更准确地估计Q值，减少过估计的影响。"],"formulas":[],"uncertainties":["defunction"],"diagram":"none","start":2714.42,"end":2889.58,"asr_flags":[],"math_clarifications":["公式中的等号不正确，因为Q(s, a)不能等于对a取最大值的结果。正确的表达应为Q(s, a) = E[...], 或者Q(s, a) = max_a Q'(s, a)，其中Q'是下一状态的Q值。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2714.42,"text":"But the reason for that is you're collecting new data, and that new data has higher key values, and so the scale of your loss function is increasing throughout training. And at the very beginning, if you're getting like zero reward everywhere, it might be very easy to get a loss function. So yeah, don't be alarmed if your loss function is going up. Sometimes that means that the policy is starting to work. So cool, this looks pretty good. As I predicted, two increases, so this is the return."},{"start":2744.07,"text":"You can also look at the value over training, and you see that in the first case, the values right here are fairly uniform, but once you're in a state where you really have to go up, then the key value for the action of up is higher than going down or a no-up. Likewise, right here, it's really important to go up, and so the key value is higher for going up than the actions of going down or no-up."},{"start":2769.6,"text":"In the right case, it doesn't really matter because the ball is on the other side, on the opponent's side, and so the Q values are more uniform. So when you visualize the Q values, they look pretty reasonable, which is good. But then if you actually plot what the true returns are..."},{"start":2791.21,"text":"The true returns are shown in red here on this red horizontal line. And the estimate of the values according to the Q network are shown as this upper line. And you actually see this very huge gap between the estimate, where the estimate is always a lot higher than the true value. And so it seems like we're seeing a lot of what's called overestimation, where our Q function is overestimating how good our policy is."},{"start":2823.11,"text":"And then there's this algorithm that was introduced called double DQM that's able to get a much more accurate defunction and is able to overestimate far far less than DQM. So let's talk a little bit about double DQM and overestimation in general. So our target value is let's say we're taking a max over action right here and when we take this max"},{"start":2855.02,"text":"We're choosing an action that maximizes this p-value. Another way to write this is you can think of it as... You can think about this quantity as u of pi of f evaluated at the action that is maximizing our p-pi."}],"speech_gaps":[],"frame":"../frames/v033/017.webp","frame_time":2726.42},{"title":"Q学习中的过估计问题与Double Q学习","segments":[{"id":176,"text":"And so we're both using an action that has a high key value and evaluating the key value of that action using the same key function. And this means that if there is noise in our key function, then it's very easy, this noise, it's very easy to basically pick actions that are using that noise to get a higher key value. And so this last term right here is what's causing overestimation.","zh":"因此，我们都在使用一个具有高键值的动作，并且使用相同的键函数来评估该动作的键值。这意味着，如果我们的键函数中存在噪声，那么这种噪声很容易被用来选择那些利用噪声获得更高键值的动作。因此，这里的最后一项就是导致高估的原因。","start":2894.79,"end":2925.79},{"id":177,"text":"It's not perfect, it has some noise in it, as neural networks generally do, and because the action selected according to Q is the same as what's being evaluated, then you can really exploit that noise and use actions that have higher value than they actually do because of the noise. Now, if you instead used a different Q function,","zh":"它并不完美，其中包含一些噪声，这通常是神经网络的常见现象。由于根据Q值选择的动作与被评估的动作是相同的，因此你可以真正利用这种噪声，选择那些由于噪声而实际价值更高的动作。现在，如果你使用不同的Q函数，","start":2926.57,"end":2958.71},{"id":178,"text":"for picking an action and evaluating it, then you can de-correlate the noise. If you had two different key functions, they would have naturally different noise and different errors that they're making. And so if you have a way to use different key values, you can actually then...","zh":"来选择动作和评估动作，那么你可以去相关噪声。如果你有两个不同的键函数，它们自然会有不同的噪声和不同的误差。因此，如果你有一种方法可以使用不同的键值，你实际上可以……","start":2959.68,"end":2979.41},{"id":179,"text":"eliminate this problem of overestimation by essentially de-correlating the noise by using a different Q function to estimate the key action here as to evaluate the action here. And so the key idea behind double Q learning is to use two different networks. One network, network A, for picking the action, and network B for evaluating.","zh":"通过使用不同的Q函数来估计这里的键动作和评估这里的动作，从而消除这种高估问题。因此，双Q学习的关键思想是使用两个不同的网络。一个网络，网络A，用于选择动作，另一个网络B用于评估。","start":2979.9,"end":3010.08},{"id":180,"text":"And then if they're noisy in different ways, then we're not going to then be kind of exploiting noise in our key values and then, as a result, not overestimate our key values.","zh":"如果它们以不同的方式产生噪声，那么我们就不会利用我们的键值中的噪声，从而不会高估我们的键值。","start":3015.95,"end":3025.31},{"id":181,"text":"The question is, can you guarantee that they don't have the same noise?","zh":"问题是，你能保证它们没有相同的噪声吗？","start":3026.07,"end":3029.53},{"id":182,"text":"I guess you definitely can't guarantee it, and there might be some noise that's a result of the architecture of the network.","zh":"我想你肯定不能保证这一点，而且可能有一些噪声是由于网络的结构造成的。","start":3031.91,"end":3038.79},{"id":183,"text":"work. But in practice, this ends up making a really, like, if you are using different","zh":"工作。但在实践中，这最终会带来一个非常显著的效果，如果你使用不同的","start":3038.79,"end":3046.73},{"id":184,"text":"neural networks for this, it generally does a very good job. There's still some overestimation,","zh":"对于这个问题，使用神经网络通常表现得非常好。仍然存在一些过估计，","start":3046.73,"end":3054.25},{"id":185,"text":"and if you looked at these values, like here in this game, the key values are still an","zh":"如果你查看这些值，比如在这个游戏中，关键值仍然存在一个","start":3054.39,"end":3058.85},{"id":186,"text":"overestimate, still an overestimate here, and also here as well, but it helps substantially","zh":"过估计，这里仍然存在过估计，同样在这里也是如此，但与不这样做相比，它有显著的帮助","start":3058.85,"end":3065.17},{"id":187,"text":"compared to not doing it. So it's not perfect, but it helps quite a bit.","zh":"。它并不是完美的，但帮助相当大。","start":3065.17,"end":3070.23}],"notes":["本段讨论了Q学习中由于使用同一个Q函数来选择和评估动作而导致的过估计问题。当Q函数中存在噪声时，这种噪声可能被用来选择具有更高键值的动作，从而导致过估计。"],"formulas":[],"uncertainties":["key value","key function","double Q learning","network A","network B"],"diagram":"none","start":2894.79,"end":3070.23,"asr_flags":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":2894.79,"text":"And so we're both using an action that has a high key value and evaluating the key value of that action using the same key function. And this means that if there is noise in our key function, then it's very easy, this noise, it's very easy to basically pick actions that are using that noise to get a higher key value. And so this last term right here is what's causing overestimation."},{"start":2926.57,"text":"It's not perfect, it has some noise in it, as neural networks generally do, and because the action selected according to Q is the same as what's being evaluated, then you can really exploit that noise and use actions that have higher value than they actually do because of the noise. Now, if you instead used a different Q function,"},{"start":2959.68,"text":"for picking an action and evaluating it, then you can de-correlate the noise. If you had two different key functions, they would have naturally different noise and different errors that they're making. And so if you have a way to use different key values, you can actually then..."},{"start":2979.9,"text":"eliminate this problem of overestimation by essentially de-correlating the noise by using a different Q function to estimate the key action here as to evaluate the action here. And so the key idea behind double Q learning is to use two different networks. One network, network A, for picking the action, and network B for evaluating."},{"start":3015.95,"text":"And then if they're noisy in different ways, then we're not going to then be kind of exploiting noise in our key values and then, as a result, not overestimate our key values."},{"start":3026.07,"text":"The question is, can you guarantee that they don't have the same noise?"},{"start":3031.91,"text":"I guess you definitely can't guarantee it, and there might be some noise that's a result of the architecture of the network."},{"start":3038.79,"text":"work. But in practice, this ends up making a really, like, if you are using different"},{"start":3046.73,"text":"neural networks for this, it generally does a very good job. There's still some overestimation,"},{"start":3054.39,"text":"and if you looked at these values, like here in this game, the key values are still an"},{"start":3058.85,"text":"overestimate, still an overestimate here, and also here as well, but it helps substantially"},{"start":3065.17,"text":"compared to not doing it. So it's not perfect, but it helps quite a bit."}],"speech_gaps":[],"frame":"../frames/v033/018.webp","frame_time":2906.79},{"title":"Q学习中的网络结构与噪声相关性","segments":[{"id":188,"text":"The question is, what if you did like triple DQN or quadruple DQN, like use even more networks?","zh":"问题是，如果你使用像三重DQN或四重DQN这样的方法，使用更多的网络呢？","start":3071.29,"end":3076.27},{"id":189,"text":"It's a good question. I could see that, yeah, perhaps that it's the noise correlation.","zh":"这是一个好问题。我可以看到，是的，也许这是因为噪声的相关性。","start":3079.45,"end":3086.01},{"id":190,"text":"If you're able to get like even more samples of noise, that could help.","zh":"如果你能够获得更多的噪声样本，这可能会有帮助。","start":3086.83,"end":3090.55},{"id":191,"text":"It could be interesting to try that in practice, if the noise is coming from, if it's instead","zh":"如果在实践中尝试这样做，如果噪声来自于一个保持不变的来源，比如神经网络的架构","start":3092.83,"end":3098.19},{"id":192,"text":"coming from a source that's like kept constant, like the architecture of the neural network","zh":"或者类似的东西，那么可能直到你开始引入这些因素之前都不会有帮助。","start":3098.19,"end":3102.19},{"id":193,"text":"or something like that, then it might not help until you start to introduce those.","zh":"而在实践中，使用超过两个神经网络是非常有效的。","start":3102.19,"end":3106.75},{"id":194,"text":"And then in practice, using more than two neural networks is very effective.","zh":"你如何确保它们不会发散？","start":3107.45,"end":3113.61},{"id":195,"text":"How do you ensure that they don't diverge?","zh":"你如何确保它们不会发散？","start":3114.75,"end":3116.31},{"id":196,"text":"So let's actually talk about what we actually do.","zh":"那么，我们实际上要讨论的是我们到底在做什么。","start":3116.33,"end":3119.17},{"id":197,"text":"So we're actually.","zh":"我们实际上。","start":3119.17,"end":3120.83},{"id":198,"text":"already using two neural networks. We have the current neural network and the target neural network that was just periodically frozen. And so what we can actually do is when we do our Q update, we can use the target network Q5 prime for evaluating and the current neural network for picking it up. And yeah, so that's...","zh":"已经使用了两个神经网络。我们有一个当前神经网络和一个被定期冻结的目标神经网络。因此，我们实际上可以这样做：当我们进行Q值更新时，我们可以使用目标网络Q5'来评估，而使用当前神经网络来选择动作。是的，所以这就是……","start":3123.51,"end":3153.05},{"id":199,"text":"Essentially what double queueing looks like where instead of using the target network for both of these, we're going to use the current network to pick the best action and then the target network for that one. Yeah, so your previous queue is always going to be your previous queue and so you can't size it yet.","zh":"双Q学习实际上就是这样的，我们不是用目标网络来执行这两个操作，而是用当前网络来选择最佳动作，然后用目标网络来进行评估。是的，所以你的前一个Q值始终是你的前一个Q值，因此你还不确定它的大小。","start":3153.57,"end":3168.56},{"id":200,"text":"Yeah, so the question is, why does this help, especially if the previous queue has the same noise? So the previous queue will be outdated, and the new queue will have gotten a lot of gradient updates since then, and they've seen new data points recently. And so oftentimes the noise isn't just about initialization, but it also has to do with what gradient updates were applied. And so, yeah, it helps a lot.","zh":"是的，问题是，为什么这样做会有帮助，尤其是如果前一个Q值具有相同的噪声？前一个Q值会过时，而新的Q值自那时以来已经经历了大量的梯度更新，并且最近看到了新的数据点。因此，通常噪声不仅仅与初始化有关，还与应用了哪些梯度更新有关。因此，这样做确实帮助很大。","start":3169.45,"end":3197.21},{"id":201,"text":"Okay, the last trick we'll talk about, which we've already talked about in the after-critic method, is MSTEP returns. So our Q-learning target looks like this, with the reward plus the max of Q. If your Q values are good, then this term is actually going to be really, really important in playing most of the role in the Q-learning update. But if your Q function is bad, like at the beginning of training,","zh":"好的，我们最后要讨论的技巧，我们在后批评方法中已经讨论过，是MSTEP回报。我们的Q学习目标看起来像这样，奖励加上Q值的最大值。如果你的Q值很好，那么这个项实际上在Q学习更新中会起到大部分作用。但如果Q函数不好，比如在训练初期，","start":3198.51,"end":3224.87},{"id":202,"text":"then these are really the only values that are going to matter, and these are the values that are going to be getting your learning algorithms fixed. And if you just have a single reward function here, then that might be a bit troublesome because just a single reward function might not tell you that much about how good your key value is. So if you remember when we talked about actual critic methods, we talked about...","zh":"那么这些就是唯一重要的值，这些值会帮助你的学习算法进行修正。如果你这里只有一个奖励函数，那么这可能会有点麻烦，因为单个奖励函数可能无法告诉你很多关于你的关键值好坏的信息。所以如果你还记得我们之前讨论的实际批评方法，我们讨论过……","start":3225.71,"end":3248.52}],"notes":["本段讨论了在深度Q网络（DQN）中使用多个神经网络的潜在好处，特别是噪声相关性的问题。讲者提到，如果使用更多的网络（如三重或四重DQN），可能会有助于减少噪声的影响，尤其是在噪声来源是固定的情况下，如神经网络的架构。讲者还提到，使用多个网络在实践中非常有效，但需要确保它们不会发散。","讲者进一步解释了双网络（Double DQN）的机制，即使用当前网络选择最佳动作，而使用目标网络进行评估。这种设计有助于减少过估计的问题，因为目标网络的更新频率较低，从而减少了噪声的影响。","讲者指出，如果Q值函数表现良好，那么Q学习的目标中的最大Q值项将起主要作用；但如果Q函数表现不佳，如训练初期，这些最大Q值项将成为学习算法修正的关键。因此，单一奖励函数可能不足以准确反映Q值的性能。","讲者提到，使用多个网络可以带来更多的样本噪声，这有助于提高模型的鲁棒性。然而，如果噪声来源是固定的，如网络架构，那么这种噪声可能不会带来显著的帮助，直到引入新的变化。","讲者还提到，双网络设计通过分离更新频率，使得目标网络的评估更加稳定，从而减少噪声对Q值估计的影响。这种设计在实践中被证明是有效的。","最后，讲者提到MSTEP返回（MSTEP returns）作为Q学习目标的一部分，强调了Q值在训练初期的重要性，以及单一奖励函数可能带来的局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3071.29,"end":3248.52,"asr_flags":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":3071.29,"text":"The question is, what if you did like triple DQN or quadruple DQN, like use even more networks?"},{"start":3079.45,"text":"It's a good question. I could see that, yeah, perhaps that it's the noise correlation."},{"start":3086.83,"text":"If you're able to get like even more samples of noise, that could help."},{"start":3092.83,"text":"It could be interesting to try that in practice, if the noise is coming from, if it's instead"},{"start":3098.19,"text":"coming from a source that's like kept constant, like the architecture of the neural network"},{"start":3102.19,"text":"or something like that, then it might not help until you start to introduce those."},{"start":3107.45,"text":"And then in practice, using more than two neural networks is very effective."},{"start":3114.75,"text":"How do you ensure that they don't diverge?"},{"start":3116.33,"text":"So let's actually talk about what we actually do."},{"start":3119.17,"text":"So we're actually."},{"start":3123.51,"text":"already using two neural networks. We have the current neural network and the target neural network that was just periodically frozen. And so what we can actually do is when we do our Q update, we can use the target network Q5 prime for evaluating and the current neural network for picking it up. And yeah, so that's..."},{"start":3153.57,"text":"Essentially what double queueing looks like where instead of using the target network for both of these, we're going to use the current network to pick the best action and then the target network for that one. Yeah, so your previous queue is always going to be your previous queue and so you can't size it yet."},{"start":3169.45,"text":"Yeah, so the question is, why does this help, especially if the previous queue has the same noise? So the previous queue will be outdated, and the new queue will have gotten a lot of gradient updates since then, and they've seen new data points recently. And so oftentimes the noise isn't just about initialization, but it also has to do with what gradient updates were applied. And so, yeah, it helps a lot."},{"start":3198.51,"text":"Okay, the last trick we'll talk about, which we've already talked about in the after-critic method, is MSTEP returns. So our Q-learning target looks like this, with the reward plus the max of Q. If your Q values are good, then this term is actually going to be really, really important in playing most of the role in the Q-learning update. But if your Q function is bad, like at the beginning of training,"},{"start":3225.71,"text":"then these are really the only values that are going to matter, and these are the values that are going to be getting your learning algorithms fixed. And if you just have a single reward function here, then that might be a bit troublesome because just a single reward function might not tell you that much about how good your key value is. So if you remember when we talked about actual critic methods, we talked about..."}],"speech_gaps":[{"start":3076.752,"end":3078.288}],"frame":"../frames/v033/019.webp","frame_time":3083.29},{"title":"Q学习中的n步回报与目标函数","segments":[{"id":203,"text":"using n-step returns. So to use this Monte Carlo, we would use the sum of rewards. If we use bootstrapping, we just do r plus b, like r at the current time step plus b at the next time step. And instead, we talked about this thing that we could do in the middle, where we sum the rewards over the next n time steps, and then use the value at the time step after that. We talked about how this has less variance and lower bias, and lower bias in the sense that it's your target.","zh":"使用n步回报。因此，如果我们使用蒙特卡洛方法，我们将使用奖励的总和。如果我们使用自举方法，我们只需做r加上b，比如当前时间步的r加上下一个时间步的b。相反，我们讨论了中间可以进行的操作，即在接下来的n个时间步内对奖励求和，然后在下一个时间步使用该值。我们讨论了这种方法具有更小的方差和更低的偏差，这里的偏差较低是指它作为目标的准确性。","start":3249.64,"end":3277.18},{"id":204,"text":"are bad, the reward function is going to be more accurate. So can we do this for key values? And what this would look like for key values is instead of having something like this, say this is the target for, you're trying to get the target for s, c, a, t, then you would define y, i to be r at the current time step plus","zh":"如果这些值不好，奖励函数将更加准确。那么我们能否对关键值进行这样的操作？对于关键值，这种操作看起来会是这样的：而不是像这样，比如说这是目标，你试图获得s、c、a、t的目标，那么你将定义y_i为当前时间步的r，","start":3277.8,"end":3309.25},{"id":205,"text":"are at the next time step up until r at t plus n minus 1 time step and then at the time step after that use the max of q of s t plus n a t plus n where this maximization is over a t plus n so this is what n-step returns","zh":"在下一个时间步到t加n减1时间步的奖励之和，然后在下一个时间步使用max q of s t加n a t加n，其中这个最大化是针对a t加n进行的，这就是n步回报。","start":3309.91,"end":3341.95},{"id":206,"text":"could look like for C-learning. Does anyone see any potential issue with using this target? Yeah, so if you're doing this off-policy, these R's will be coming from whatever policy you used in the replay buffer, rather than the optimal policy, which is what you're trying to estimate.","zh":"对于C学习，这看起来会是什么样子？有人能发现使用这个目标的潜在问题吗？是的，如果你在进行离策略学习，这些R将来自你在回放缓冲区中使用的任何策略，而不是你试图估计的最优策略。","start":3342.7,"end":3367.17},{"id":207,"text":"the downside is that these rewards are for the policy that collected the data, not for the optimal policy. And we're trying to estimate the key functions of the optimal policy. So this is kind of a downside when using NSTEP returns with learning.","zh":"缺点是这些奖励是用于收集数据的策略，而不是用于最优策略。而我们试图估计的是最优策略的关键函数。因此，当使用n步回报进行学习时，这会成为一个缺点。","start":3369.99,"end":3393.62},{"id":208,"text":"Now, and this is not an issue with n equals 1, because there the reward will just be a function of S and A, and we're estimating the Q value of S and A. Now, what should we do about this? Maybe the unsatisfying answer is that most commonly just ignore this, pretend it isn't true, and still use an n greater than 1. And separate terms truly are often like","zh":"现在，这并不是n等于1时的问题，因为在n等于1的情况下，奖励将只是S和A的函数，而我们估计的是S和A的Q值。那么我们应该怎么做呢？也许令人不满意的答案是，通常只是忽略这一点，假装它不成立，仍然使用n大于1的值。而分开的项通常确实像这样","start":3395.6,"end":3425.53}],"notes":["本段讨论了n步回报在Q学习中的应用，其中提到n步回报通过在接下来的n个时间步内对奖励进行求和，并在下一个时间步使用价值函数来计算目标值。这种做法相比蒙特卡洛方法具有更低的方差和偏差，但其目标值是基于数据收集策略而非最优策略。","在使用n步回报时，如果采用离策略学习（off-policy learning），那么奖励值将来自于回放缓冲区中使用的策略，而不是最优策略。这可能导致估计的Q函数与最优策略不一致，从而成为使用n步回报的一个潜在问题。","尽管n步回报在早期学习阶段可能更快收敛，但其缺点在于所使用的奖励值对应的是数据收集策略，而非最优策略。因此，当使用n步回报进行学习时，可能会导致对最优策略的Q函数估计不准确。","对于n=1的情况，奖励值仅依赖于当前状态和动作，因此不会出现上述问题。然而，对于n>1的情况，需要考虑如何处理这种不一致性。","一种常见的做法是忽略这一问题，继续使用n>1的n步回报进行学习，尽管这可能会影响最终的估计结果。","在实际应用中，n步回报的使用需要权衡其优势（如更低的方差和偏差）与潜在的不一致性问题。"],"formulas":[],"uncertainties":["n-step returns 的具体公式可能未被完全准确识别，例如折扣因子 β 是否被正确提及。"],"diagram":"none","start":3249.64,"end":3425.53,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3249.64,"text":"using n-step returns. So to use this Monte Carlo, we would use the sum of rewards. If we use bootstrapping, we just do r plus b, like r at the current time step plus b at the next time step. And instead, we talked about this thing that we could do in the middle, where we sum the rewards over the next n time steps, and then use the value at the time step after that. We talked about how this has less variance and lower bias, and lower bias in the sense that it's your target."},{"start":3277.8,"text":"are bad, the reward function is going to be more accurate. So can we do this for key values? And what this would look like for key values is instead of having something like this, say this is the target for, you're trying to get the target for s, c, a, t, then you would define y, i to be r at the current time step plus"},{"start":3309.91,"text":"are at the next time step up until r at t plus n minus 1 time step and then at the time step after that use the max of q of s t plus n a t plus n where this maximization is over a t plus n so this is what n-step returns"},{"start":3342.7,"text":"could look like for C-learning. Does anyone see any potential issue with using this target? Yeah, so if you're doing this off-policy, these R's will be coming from whatever policy you used in the replay buffer, rather than the optimal policy, which is what you're trying to estimate."},{"start":3369.99,"text":"So there's kind of pros and cons here. One is that it's a lot less biased, a lot faster to learn on, especially early on. But the downside is that these rewards are for the policy that collected the data, not for the optimal policy. And we're trying to estimate the key functions of the optimal policy. So this is kind of a downside when using NSTEP returns with learning."},{"start":3395.6,"text":"Now, and this is not an issue with n equals 1, because there the reward will just be a function of S and A, and we're estimating the Q value of S and A. Now, what should we do about this? Maybe the unsatisfying answer is that most commonly just ignore this, pretend it isn't true, and still use an n greater than 1. And separate terms truly are often like"}],"speech_gaps":[],"frame":"../frames/v033/020.webp","frame_time":3261.64},{"title":"Q学习（Q-Learning）的应用与成功案例","segments":[{"id":209,"text":"really very often improve the performance of the algorithm, the site being incorrect. That said, there are other things you can do. You can dynamically choose n and only use data that follows the current policy, basically looking at what actions were taken and seeing if those actions actually agree with the maximal key values. You could also, in principle, dynamically choose n and have n be smaller later in training, where your key values are likely to be more accurate.","zh":"真的非常经常可以提升算法的性能，但前提是站点是错误的。不过，还有其他你可以做的事情。你可以动态地选择n，并且只使用符合当前策略的数据，基本上就是查看采取了哪些动作，并检查这些动作是否实际上与最大键值一致。原则上，你也可以动态地选择n，并且在训练后期让n更小，因为在那时你的键值很可能更准确。","start":3426.06,"end":3454.34},{"id":210,"text":"Now for this particular choosing of n, you really would want to do this only if the action space is small and the data is mostly on policies. And you can also do important sampling as well and weight these rewards by some importance.","zh":"对于这种特定的n的选择，你真的只应在动作空间较小且数据主要来自策略的情况下进行。你也可以进行重要性采样，并通过某些重要性权重来调整这些奖励。","start":3456.23,"end":3484.16},{"id":211,"text":"Q-learning that have been very successful that I put on this slide. I think there's other examples too, but one of the most prominent examples was for playing games. And if you want to train an agent to play a game, either...","zh":"我在这一张幻灯片上展示了一些非常成功的Q学习案例。我认为还有其他例子，但最突出的一个例子是用于玩游戏。如果你想训练一个代理来玩游戏，无论是仅仅为了看看你能做到多好，还是为了与人类对战，Q学习都能在Atari游戏中超越大多数人。","start":3484.54,"end":3498.64},{"id":212,"text":"either just for the sake of seeing how well you can do, or to play against a human, Q-Learning was able to outperform most people on Atari games. So this bar right here, everything above this bar are the games that it is at human level or above human level performance, and everything below is worse than human level performance. And then it also was used to train a robot grasping system. So this is actually a case of continuous action.","zh":"这个条形图右边的所有游戏都是该系统达到或超过人类水平的表现，而条形图下方的所有游戏则表现得不如人类水平。此外，它还被用来训练一个机器人抓取系统。这实际上是一个连续动作的案例。","start":3499.72,"end":3528.66},{"id":213,"text":"And the robot on the right is using a Q function that was trained with Q-learning. And then it is doing a continuous optimization over actions that will try to find a good way to grasp the object.","zh":"右边的机器人使用了一个通过Q学习训练的Q函数。然后它会在动作上进行连续优化，以尝试找到一种好的方式来抓取物体。","start":3529.92,"end":3549.14},{"id":214,"text":"And we talked a bit last time about how with RL you can get much higher success rate and more reliable policies, and we see that here too where this system was able to get like a 96% success rate, so quite high at being able to draft objects. The other thing that's nice about using RL for this application is you end up, if in order to draft you need to","zh":"我们之前讨论过，使用强化学习可以实现更高的成功率和更可靠的策略，我们在这里也看到了这一点，该系统能够达到96%的成功率，这在抓取物体方面相当高。使用强化学习进行此应用的另一个优点是，如果你需要抓取物体，最终会","start":3550.63,"end":3578.52}],"notes":["本段讲解了Q学习中动态选择n值的策略，适用于动作空间较小且数据主要来自当前策略的情况。同时提到重要性采样，通过加权奖励来提升效果。","Q学习在游戏领域取得了显著成功，特别是在Atari游戏中，Q学习能够超越大多数人类玩家的表现。图表显示了Q学习在游戏中的表现水平，高于或等于人类水平的被标记在上方，低于的在下方。","Q学习还被用于训练机器人抓取系统，这是一个连续动作的案例。右侧的机器人使用Q函数进行训练，并通过连续优化动作来找到抓取物体的有效方法。","使用强化学习在机器人抓取任务中取得了96%的成功率，显示出其在实际应用中的高可靠性。此外，强化学习在该任务中能够有效解决抓取所需的复杂问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3426.06,"end":3578.52,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3426.06,"text":"really very often improve the performance of the algorithm, the site being incorrect. That said, there are other things you can do. You can dynamically choose n and only use data that follows the current policy, basically looking at what actions were taken and seeing if those actions actually agree with the maximal key values. You could also, in principle, dynamically choose n and have n be smaller later in training, where your key values are likely to be more accurate."},{"start":3456.23,"text":"Now for this particular choosing of n, you really would want to do this only if the action space is small and the data is mostly on policies. And you can also do important sampling as well and weight these rewards by some importance. Great, so those were the three tricks for accumulating in practice. There's a couple examples of..."},{"start":3484.54,"text":"Q-learning that have been very successful that I put on this slide. I think there's other examples too, but one of the most prominent examples was for playing games. And if you want to train an agent to play a game, either..."},{"start":3499.72,"text":"either just for the sake of seeing how well you can do, or to play against a human, Q-Learning was able to outperform most people on Atari games. So this bar right here, everything above this bar are the games that it is at human level or above human level performance, and everything below is worse than human level performance. And then it also was used to train a robot grasping system. So this is actually a case of continuous action."},{"start":3529.92,"text":"And the robot on the right is using a Q function that was trained with Q-learning. And then it is doing a continuous optimization over actions that will try to find a good way to grasp the object."},{"start":3550.63,"text":"And we talked a bit last time about how with RL you can get much higher success rate and more reliable policies, and we see that here too where this system was able to get like a 96% success rate, so quite high at being able to draft objects. The other thing that's nice about using RL for this application is you end up, if in order to draft you need to"}],"speech_gaps":[],"frame":"../frames/v033/021.webp","frame_time":3438.06},{"title":"Q学习（Q-Learning）","segments":[{"id":215,"text":"Not just go down and pick something up, but you actually need to move around the object. It's also able to learn how to do that using the reinforcement, because it's treating it as essential. One of the last things I figured I would cover is some of my advice on when to use one online URL algorithm versus another, since this is the last online URL method that we'll talk about.","zh":"不只是向下移动并捡起物体，你实际上需要围绕物体移动。它还能够通过强化学习来学习如何做到这一点，因为它将其视为至关重要的。我最后要讲的一些建议是关于何时使用一种在线URL算法而不是另一种，因为这是我们最后要讨论的在线URL方法。","start":3579.83,"end":3608.92},{"id":216,"text":"So we talked a bit about PPO, SAT, and DQN. Those are some of the three main tactical algorithms we talked about. For PPO, this is great when you care about stability and ease of use. It generally doesn't require too much tuning, but it's very data inefficient, and so it's great to use when you care about stability and ease of use, and you don't really care about data as a PC. DQN works quite well when you have discrete actions or low-dimensional continuous actions.","zh":"我们简要讨论了PPO、SAT和DQN。这些是我们讨论的三种主要战术算法。对于PPO，它非常适合你关注稳定性和易用性的情况。它通常不需要太多调参，但数据效率较低，因此当你关注稳定性和易用性，而不太在意数据时，它是一个很好的选择。DQN在你有离散动作或低维连续动作时表现相当不错。","start":3610.31,"end":3638.1},{"id":217,"text":"And so in those cases, it can be a great choice. It can be fairly data efficient, depending on some of the details of how off-polish you make it. And then soft-back to critic and variants of it are great when you care most about data efficiency, but require a bit more tuning and are a bit less stable than something like CTO.","zh":"在这些情况下，它可能是一个很好的选择。它在某些细节上，比如离策略程度的设置，可以相当数据高效。而soft-back critic及其变体则最适合你最关注数据效率的情况，但需要更多的调参，并且比像CTO这样的方法稍不稳定一些。","start":3638.77,"end":3659.67},{"id":218,"text":"What we talked about is Q-learning, also Q-learning in practice, the three-trigger target network, double DQN, and separate turns. We defined it like the Bellman equation and the Bellman optimality equation. Yeah, and that was like essentially an overview of how to do RL without learning an explicit policy. We're done with online reinforcement learning algorithms for now. And yeah, we covered a lot of the basics of different online reinforcement learning algorithms.","zh":"我们讨论了Q学习，也包括实际应用中的Q学习，三触发目标网络、双重DQN和分离网络。我们将其定义为贝尔曼方程和贝尔曼最优方程。是的，这基本上是对如何在不显式学习策略的情况下进行强化学习的概述。我们现在结束了在线强化学习算法的讨论。是的，我们已经涵盖了大部分在线强化学习算法的基本内容。","start":3664.82,"end":3693.85}],"notes":["本段主要讲解了Q学习的基本概念，包括其在强化学习中的应用，以及与其他在线强化学习算法（如PPO、DQN等）的对比。Q学习通过贝尔曼方程和贝尔曼最优方程来定义，强调了无需显式学习策略的特点。","讲者提到PPO适用于需要稳定性和易用性的场景，但数据效率较低；DQN适用于离散动作或低维连续动作的情况，且在某些情况下数据效率较高。Soft-back to critic及其变体则更注重数据效率，但需要更多调参且稳定性稍差。","讲者还提到Q学习在实践中的一些变体，如三触发目标网络、双重DQN和分离网络。这些变体旨在提高Q学习的稳定性和数据效率。","最后，讲者总结了在线强化学习算法的基本内容，并指出Q学习是其中的重要组成部分，强调了其在无需显式策略学习方面的优势。"],"formulas":[],"uncertainties":["off-polish","three-trigger target network","separate turns","CTO","soft-back to critic"],"diagram":"none","start":3579.83,"end":3693.85,"asr_flags":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":3579.83,"text":"not just go down and pick something up, but you actually need to move around the object. It's also able to learn how to do that using the reinforcement, because it's treating it as essential. One of the last things I figured I would cover is some of my advice on when to use one online URL algorithm versus another, since this is the last online URL method that we'll talk about."},{"start":3610.31,"text":"So we talked a bit about PPO, SAT, and DQN. Those are some of the three main tactical algorithms we talked about. For PPO, this is great when you care about stability and ease of use. It generally doesn't require too much tuning, but it's very data inefficient, and so it's great to use when you care about stability and ease of use, and you don't really care about data as a PC. DQN works quite well when you have discrete actions or low-dimensional continuous actions."},{"start":3638.77,"text":"And so in those cases, it can be a great choice. It can be fairly data efficient, depending on some of the details of how off-polish you make it. And then soft-back to critic and variants of it are great when you care most about data efficiency, but require a bit more tuning and are a bit less stable than something like CTO."},{"start":3664.82,"text":"What we talked about is Q-learning, also Q-learning in practice, the three-trigger target network, double DQN, and separate turns. We defined it like the Bellman equation and the Bellman optimality equation. Yeah, and that was like essentially an overview of how to do RL without learning an explicit policy. We're done with online reinforcement learning algorithms for now. And yeah, we covered a lot of the basics of different online reinforcement learning algorithms."}],"speech_gaps":[],"frame":"../frames/v033/022.webp","frame_time":3591.83}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v033.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}

by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
