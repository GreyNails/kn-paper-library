ess. So kind of visually what this looks like is you have some environment. You'll initialize your replay buffer as empty. And then at the first step, you'll run your policy, like the Epsilon 3D policy that's exploring in the environment. You'll then get some transitions that you put into your replay buffer."}],"speech_gaps":[],"frame":"../frames/v033/013.webp","frame_time":2041.72},{"title":"Q学习中的策略与经验回放","segments":[{"id":153,"text":"For this part, you'll then use your replay buffer to update your key function on the data that you see, with the goal of trying to get something that is not saying the key function of the auth. So the question is, when we combine this with one, can we still call this auth policy? It could be our collecting data, potentially from a policy that's very similar to our current policy. Because we're using a replay buffer of essentially all of our past experience,","start":2208.38,"end":2238.2},{"id":154,"text":"When we do these updates, it's referred to as off-policy. That doesn't mean that none of the data is from our current policy. Some of the data in the replay buffer will be from the current policy. But essentially what off-policy means is that you're not only using that data, you're also using data from other policies. In practice, what is the sum policy? Yeah, so in practice, it's exactly what we talked about on the last slide. So it would either be something like epsilon greedy.","start":2239.02,"end":2267.92},{"id":155,"text":"where with some small probability you're taking a random action, and otherwise following the policy, or something where you're taking actions in proportions that are too large. As we talked about, it might actually change during training. You might actually change Epsilon during training so that you're doing more exploration at the beginning and less exploration later on. Yeah, so the question is, are we resetting our learning as speed iterations? Oftentimes you will keep your...","start":2268.66,"end":2298.36},{"id":156,"text":"old Q parameters around, kind of warm start them and keep on trading on top of them. One important thing, so the result in this algorithm is Q, and then to extract a policy out of that, the final policy that you would then deploy is a policy that is acting according to, especially just be acting greedily, where it's taking the actions that maximize your Q.","start":2298.49,"end":2326.77},{"id":157,"text":"Oh, so if the size of the replay buffer is one, like one data point, then that would be on policy. So if it's tiny, then that's fully on policy. In practice, this replay buffer is a lot larger. Oh, oh, oh, sorry. Right. If the replay buffer size is one, if this policy is not the same as this, then that's still off policy because the policy is different. Good point.","start":2327.82,"end":2356.37},{"id":158,"text":"So yeah, this policy might be different from the one that you're acting on. Yeah, so how do we manage our replay buffer, make sure that we're not over-sampling states and so forth? This is generally, it's actually an important consideration with Q-learning algorithms, and usually you will discard old data, so you'll have a first-in, first-out sensible, where this buffer is not infinitely large. Oftentimes with Q-learning it is pretty large, but you will, you can just pick a fixed size, and then once,","start":2357.87,"end":2387.74}],"notes":["本段讨论了Q学习中经验回放（replay buffer）的作用，以及如何利用它来更新关键函数。讲者提到，当使用经验回放时，目标是获取一个不同于当前策略（auth policy）的策略。同时，讲者指出，当经验回放中包含来自不同策略的数据时，算法被称为off-policy。","讲者进一步解释了off-policy的含义，即算法不仅使用当前策略的数据，还使用其他策略的数据。在实践中，sum policy通常指的是epsilon-greedy策略，即以一定概率随机选择动作，其余时间遵循当前策略。","讲者提到，在训练过程中，epsilon值可能会发生变化，以实现探索与利用的平衡。在训练初期增加探索，后期减少探索。此外，讲者还提到，通常不会重置学习速度，而是保留旧的Q参数并进行微调。","讲者指出，最终部署的策略是基于Q值的贪婪策略，即选择最大化Q值的动作。同时，讲者提到，当经验回放的大小为1时，算法会变成on-policy，因为此时所有数据都来自当前策略。","讲者还讨论了经验回放的管理问题，指出需要避免对某些状态的过度采样。通常的做法是丢弃旧数据，采用先进先出（FIFO）的方式管理经验回放缓冲区，以防止缓冲区无限增长。","最后，讲者提到经验回放的大小通常较大，但可以设置为固定值，一旦达到上限，就会丢弃旧数据。这有助于保持数据的多样性，避免过时信息对学习过程的干扰。"],"formulas":[],"uncertainties":["auth policy","sum policy","trading on top of them"],"diagram":"none","start":2208.38,"end":2387.74,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2208.38,"text":"For this part, you'll then use your replay buffer to update your key function on the data that you see, with the goal of trying to get something that is not saying the key function of the auth. So the question is, when we combine this with one, can we still call this auth policy? It could be our collecting data, potentially from a policy that's very similar to our current policy. Because we're using a replay buffer of essentially all of our past experience,"},{"start":2239.02,"text":"When we do these updates, it's referred to as off-policy. That doesn't mean that none of the data is from our current policy. Some of the data in the replay buffer will be from the current policy. But essentially what off-policy means is that you're not only using that data, you're also using data from other policies. In practice, what is the sum policy? Yeah, so in practice, it's exactly what we talked about on the last slide. So it would either be something like epsilon greedy."},{"start":2268.66,"text":"where with some small probability you're taking a random action, and otherwise following the policy, or something where you're taking actions in proportions that are too large. As we talked about, it might actually change during training. You might actually change Epsilon during training so that you're doing more exploration at the beginning and less exploration later on. Yeah, so the question is, are we resetting our learning as speed iterations? Oftentimes you will keep your..."},{"start":2298.49,"text":"old Q parameters around, kind of warm start them and keep on trading on top of them. One important thing, so the result in this algorithm is Q, and then to extract a policy out of that, the final policy that you would then deploy is a policy that is acting according to, especially just be acting greedily, where it's taking the actions that maximize your Q."},{"start":2327.82,"text":"Oh, so if the size of the replay buffer is one, like one data point, then that would be on policy. So if it's tiny, then that's fully on policy. In practice, this replay buffer is a lot larger. Oh, oh, oh, sorry. Right. If the replay buffer size is one, if this policy is not the same as this, then that's still off policy because the policy is different. Good point."},{"start":2357.87,"text":"So yeah, this policy might be different from the one that you're acting on. Yeah, so how do we manage our replay buffer, make sure that we're not over-sampling states and so forth? This is generally, it's actually an important consideration with Q-learning algorithms, and usually you will discard old data, so you'll have a first-in, first-out sensible, where this buffer is not infinitely large. Oftentimes with Q-learning it is pretty large, but you will, you can just pick a fixed size, and then once,"}],"speech_gaps":[],"frame":"../frames/v033/014.webp","frame_time":2220.38},{"title":"Q学习中的经验回放与目标网络","segments":[{"id":159,"text":"you have filled it to that size, start discarding data, and discard the oldest data first. One other consideration is that at the very beginning of training, the replay buffer might be very small. Sometimes, to handle that, you might try to select more data the very first iteration, just repopulate it. There are also algorithms that we won't quite cover that do asynchronous.","start":2388.14,"end":2413.28},{"id":160,"text":"data collection and updates, because data collection takes time, updating a neural network takes time, and so you could actually have some threads that are actually adding to the replay buffer and other threads that are running updates on your key functions. With those asynchronous algorithms, it's actually especially important to think about how the replay buffer is managed so that you're not running like a thousand gradient steps on one data point and one gradient step on the other.","start":2414.16,"end":2447.15},{"id":161,"text":"what happens in practice when you use these methods. So we talked about how Q-learning can diverge, and in general, when you run Q-learning with neural networks, it can be unstable. And one of the reasons for that is you have this moving target, this max of Q, and it means that our optimization process is very non-stationary, especially if K is 1.","start":2447.81,"end":2475.69},{"id":162,"text":"One trick is to try to slow down how often you change the target. So instead of having you target change every single time you change your parameters, one idea is you could freeze the parameters of your target network and only update them periodically, only update them once every hundred gradient steps.","start":2479.88,"end":2505.16},{"id":163,"text":"So what this looks like is we can save a separate neural network, another copy of our two function parameters. We'll call this five prime. And when we save this out, then just for this target right here, we can use these new parameters to use five prime.","start":2508.11,"end":2536.63}],"notes":["本段讨论了在强化学习中使用经验回放和异步算法时需要注意的问题。在训练初期，经验回放缓冲区可能很小，因此需要在第一次迭代中选择更多数据以填充缓冲区。此外，异步算法中需要特别注意经验回放的管理，以避免对单个数据点进行过多梯度更新。","Q学习在使用神经网络时可能不稳定，其中一个原因是目标网络（max of Q）会不断变化，导致优化过程非常非平稳，尤其是在K=1的情况下。这种非平稳性可能导致Q值的发散。","为了解决目标网络变化过快的问题，可以减缓目标网络的更新频率。一种方法是冻结目标网络的参数，仅在每隔一定数量的梯度步骤后更新一次。这样可以减少目标网络的波动，提高训练的稳定性。","目标网络的实现方式是保存一个独立的神经网络，作为主网络参数的副本。这个副本被称为五素（five prime），在需要时使用这些参数来更新目标网络。这种方法有助于保持目标网络的稳定性，避免因频繁更新而导致的性能下降。"],"formulas":[],"uncertainties":["five prime"],"diagram":"none","start":2388.14,"end":2536.63,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2388.14,"text":"you have filled it to that size, start discarding data, and discard the oldest data first. One other consideration is that at the very beginning of training, the replay buffer might be very small. Sometimes, to handle that, you might try to select more data the very first iteration, just repopulate it. There are also algorithms that we won't quite cover that do asynchronous."},{"start":2414.16,"text":"data collection and updates, because data collection takes time, updating a neural network takes time, and so you could actually have some threads that are actually adding to the replay buffer and other threads that are running updates on your key functions. With those asynchronous algorithms, it's actually especially important to think about how the replay buffer is managed so that you're not running like a thousand gradient steps on one data point and one gradient step on the other. So that's QA. Let's talk a little bit about"},{"start":2447.81,"text":"what happens in practice when you use these methods. So we talked about how Q-learning can diverge, and in general, when you run Q-learning with neural networks, it can be unstable. And one of the reasons for that is you have this moving target, this max of Q, and it means that our optimization process is very non-stationary, especially if K is 1."},{"start":2479.88,"text":"One trick is to try to slow down how often you change the target. So instead of having you target change every single time you change your parameters, one idea is you could freeze the parameters of your target network and only update them periodically, only update them once every hundred gradient steps."},{"start":2508.11,"text":"So what this looks like is we can save a separate neural network, another copy of our two function parameters. We'll call this five prime. And when we save this out, then just for this target right here, we can use these new parameters to use five prime."}],"speech_gaps":[],"frame":"../frames/v033/015.webp","frame_time":2400.14},{"title":"Q学习中的目标网络与稳定性改进","segments":[{"id":164,"text":"In our target. These parameters will be frozen, and so it means that inside this inner loop, the labels will not change. And so this inner loop is essentially going to be doing supervised learning with some data being added to the loop. Web offers. And this would be a lot more stable. Supervised learning is a lot more stable, generally. And then only periodically then update our target network parameters to be the same as our latest C++ script.","start":2538.06,"end":2569.41},{"id":165,"text":"So once you use a target network, this is referred to as the DQN algorithm. It was introduced in 2013. It was basically the first DQN method, at least in my opinion. And they found that you could actually train neural networks to play a variety of different Atari games. And it was one of the first examples of using reinforcement learning to train neural networks to do a pretty complicated task.","start":2572.14,"end":2599.82},{"id":166,"text":"And they were actually training it directly from the pixel observations from the game. And prior to that, a lot of the reinforcement learning examples were on very toy settings or very low-dimensional settings. If you save two tables of two values, will that be the same as this? Yeah, so that's actually not quite the case because you will actually be collecting new data.","start":2600.16,"end":2627.4},{"id":167,"text":"In this loop, and so you can't just store all the key values. You actually do have to store the parameters so that you can then compute the key values for the new data that you selected, the target key values for the new data. So you can't just store the key values. You have to store the data. Cool. And so this is one of the algorithms that you'll implement in almost everything. Okay, so that's the first trick, is use a target network that you only periodically update.","start":2627.96,"end":2659.91},{"id":168,"text":"There's two more things that make Q-Learning work a lot better. And the first one is actually looking at the accuracy of the key values. So if you plot the reward over training, the reward goes up. That's good. This is a reward on the game of Breakout and the game of FIFA. And if you also plot the key values over the course of training, they're also going up.","start":2661.08,"end":2687.17},{"id":169,"text":"And so that is definitely what you expect because the key values are representing your average reward. So that's good. One other thing to note, actually as a practical tip, is when you're looking at the loss function on your key values during training, when you train with DQN, the loss values will actually often go up through training. This is sometimes a little bit alarming because you're used to loss values going down.","start":2687.65,"end":2713.89}],"notes":["本段讲解了在Q学习中使用目标网络（target network）以提高训练稳定性。目标网络的参数在一段时间内被冻结，仅在特定周期更新，从而减少训练过程中的波动。这种做法类似于监督学习，因为内部循环中的标签不会改变，从而使得训练更加稳定。","目标网络的引入是DQN（Deep Q-Network）算法的核心思想之一，该算法在2013年被提出，被认为是第一个成功应用深度强化学习进行游戏训练的方法。它展示了神经网络可以用于训练复杂任务，如Atari游戏。","在训练过程中，模型直接从游戏的像素观测中学习，而不是依赖于人工设计的特征。这与之前的强化学习方法不同，后者通常在低维或玩具环境中进行。这种直接从像素输入中学习的方式使得模型能够处理更复杂的任务。","在训练过程中，模型需要存储参数而不是仅仅存储关键值（key values），因为关键值是基于新数据计算的。因此，必须存储数据本身，以便在后续计算中使用。","在Q学习中，除了目标网络外，另一个改进是关注关键值的准确性。随着训练的进行，奖励和关键值都会增加，这表明模型正在学习更优的策略。","在训练过程中，损失函数的值可能会随着训练而增加，这与传统的监督学习不同。这种现象有时会让人感到困惑，但实际上是训练过程中正常的一部分。"],"formulas":[],"uncertainties":["DQN（Deep Q-Network）算法的名称在原文中被误识别为“D2M”或“D2N”，需确认正确名称。","“web offers”可能是误识别，需确认其实际含义。","“two tables of two values”可能指代某种数据结构，但具体含义不明确，需进一步澄清。","“key values”在上下文中可能指代Q值（Q-values），但未明确说明，需确认术语一致性。"],"diagram":"none","start":2538.06,"end":2713.89,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2538.06,"text":"in our target. These parameters will be frozen, and so it means that inside this inner loop, the labels will not change. And so this inner loop is essentially going to be doing supervised learning with some data being added to the loop web offers. And this would be a lot more stable. Supervised learning is a lot more stable, generally. And then only periodically then update our target network parameters to be the same as our latest C++ script."},{"start":2572.14,"text":"So once you use a target network, this is referred to as the D2M algorithm. It was introduced in 2013. It was basically the first P4L method, at least in my opinion. And they found that you could actually train neural networks to play a variety of different Atari games. And it was one of the first examples of using reinforcement learning to train neural networks to do a pretty complicated task."},{"start":2600.16,"text":"And they were actually training it directly from the pixel observations from the game. And prior to that, a lot of the reinforcement learning examples were on very toy settings or very low-dimensional settings. If you save two tables of two values, will that be the same as this? Yeah, so that's actually not quite the case because you will actually be collecting new data."},{"start":2627.96,"text":"in this loop, and so you can't just store all the key values. You actually do have to store the parameters so that you can then compute the key values for the new data that you selected, the target key values for the new data. So you can't just store the key values. You have to store the data. Cool. And so this is one of the algorithms that you'll implement in almost everything. Okay, so that's the first trick, is use a target network that you only periodically update."},{"start":2661.08,"text":"There's two more things that make Q-Learning work a lot better. And the first one is actually looking at the accuracy of the key values. So if you plot the reward over training, the reward goes up. That's good. This is a reward on the game of Breakout and the game of FIFA. And if you also plot the key values over the course of training, they're also going up."},{"start":2687.65,"text":"And so that is definitely what you expect because the key values are representing your average reward. So that's good. One other thing to note, actually as a practical tip, is when you're looking at the loss function on your key values during training, when you train with D2N, the loss values will actually often go up through training. This is sometimes a little bit alarming because you're used to loss values going down."}],"speech_gaps":[],"frame":"../frames/v033/016.webp","frame_time":2550.06},{"title":"Q学习中的损失函数与过估计问题","segments":[{"id":170,"text":"But the reason for that is you're collecting new data, and that new data has higher key values, and so the scale of your loss function is increasing throughout training. And at the very beginning, if you're getting like zero reward everywhere, it might be very easy to get a loss function. So yeah, don't be alarmed if your loss function is going up. Sometimes that means that the policy is starting to work. So cool, this looks pretty good. As I predicted, two increases, so this is the return.","start":2714.42,"end":2742.89},{"id":171,"text":"You can also look at the value over training, and you see that in the first case, the values right here are fairly uniform, but once you're in a state where you really have to go up, then the key value for the action of up is higher than going down or a no-up. Likewise, right here, it's really important to go up, and so the key value is higher for going up than the actions of going down or no-up.","start":2744.07,"end":2769.23},{"id":172,"text":"In the right case, it doesn't really matter because the ball is on the other side, on the opponent's side, and so the Q values are more uniform. So when you visualize the Q values, they look pretty reasonable, which is good. But then if you actually plot what the true returns are...","start":2769.6,"end":2789.46},{"id":173,"text":"The true returns are shown in red here on this red horizontal line. And the estimate of the values according to the Q network are shown as this upper line. And you actually see this very huge gap between the estimate, where the estimate is always a lot higher than the true value. And so it seems like we're seeing a lot of what's called overestimation, where our Q function is overestimating how good our policy is.","start":2791.21,"end":2821.81},{"id":174,"text":"And then there's this algorithm that was introduced called double DQM that's able to get a much more accurate defunction and is able to overestimate far far less than DQM. So let's talk a little bit about double DQM and overestimation in general. So our target value is let's say we're taking a max over action right here and when we take this max","start":2823.11,"end":2854.43},{"id":175,"text":"We're choosing an action that maximizes this p-value. Another way to write this is you can think of it as... You can think about this quantity as u of pi of f evaluated at the action that is maximizing our p-pi.","start":2855.02,"end":2889.58}],"notes":["本段主要讲解了Q学习中损失函数的变化及其背后的原因。在训练初期，由于奖励为零，损失函数可能较低，但随着新数据的收集，损失函数可能上升，这并不一定意味着模型表现变差，反而可能表示策略开始有效。","在训练过程中，Q值的变化可以反映策略的学习情况。在某些状态下，向上移动的Q值会比向下或不移动的Q值更高，这表明策略正在学习到更优的动作选择。","在某些情况下，Q值的分布可能较为均匀，这可能是因为状态本身对动作的选择影响较小。然而，当需要做出关键决策时，Q值的分布会更加明显地反映动作的价值差异。","在可视化Q值时，如果Q值估计与真实回报之间存在显著差距，这可能表明存在过估计问题。过估计会导致Q函数高估策略的实际效果，从而影响学习效率。","为了解决过估计问题，引入了Double DQN算法。该算法通过双重选择动作来减少估计偏差，从而显著降低过估计的程度。","在Double DQN中，目标值的计算涉及对动作的取最大值，这可以看作是对策略函数在最优动作上的评估。这种计算方式有助于更准确地估计Q值，减少过估计的影响。"],"formulas":[],"uncertainties":["defunction"],"diagram":"none","start":2714.42,"end":2889.58,"asr_flags":[],"math_clarifications":["公式中的等号不正确，因为Q(s, a)不能等于对a取最大值的结果。正确的表达应为Q(s, a) = E[...], 或者Q(s, a) = max_a Q'(s, a)，其中Q'是下一状态的Q值。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2714.42,"text":"But the reason for that is you're collecting new data, and that new data has higher key values, and so the scale of your loss function is increasing throughout training. And at the very beginning, if you're getting like zero reward everywhere, it might be very easy to get a loss function. So yeah, don't be alarmed if your loss function is going up. Sometimes that means that the policy is starting to work. So cool, this looks pretty good. As I predicted, two increases, so this is the return."},{"start":2744.07,"text":"You can also look at the value over training, and you see that in the first case, the values right here are fairly uniform, but once you're in a state where you really have to go up, then the key value for the action of up is higher than going down or a no-up. Likewise, right here, it's really important to go up, and so the key value is higher for going up than the actions of going down or no-up."},{"start":2769.6,"text":"In the right case, it doesn't really matter because the ball is on the other side, on the opponent's side, and so the Q values are more uniform. So when you visualize the Q values, they look pretty reasonable, which is good. But then if you actually plot what the true returns are..."},{"start":2791.21,"text":"The true returns are shown in red here on this red horizontal line. And the estimate of the values according to the Q network are shown as this upper line. And you actually see this very huge gap between the estimate, where the estimate is always a lot higher than the true value. And so it seems like we're seeing a lot of what's called overestimation, where our Q function is overestimating how good our policy is."},{"start":2823.11,"text":"And then there's this algorithm that was introduced called double DQM that's able to get a much more accurate defunction and is able to overestimate far far less than DQM. So let's talk a little bit about double DQM and overestimation in general. So our target value is let's say we're taking a max over action right here and when we take this max"},{"start":2855.02,"text":"We're choosing an action that maximizes this p-value. Another way to write this is you can think of it as... You can think about this quantity as u of pi of f evaluated at the action that is maximizing our p-pi."}],"speech_gaps":[],"frame":"../frames/v033/017.webp","frame_time":2726.42},{"title":"Q学习中的过估计问题与Double Q学习","segments":[{"id":176,"text":"And so we're both using an action that has a high key value and evaluating the key value of that action using the same key function. And this means that if there is noise in our key function, then it's very easy, this noise, it's very easy to basically pick actions that are using that noise to get a higher key value. And so this last term right here is what's causing overestimation.","start":2894.79,"end":2925.79},{"id":177,"text":"It's not perfect, it has some noise in it, as neural networks generally do, and because the action selected according to Q is the same as what's being evaluated, then you can really exploit that noise and use actions that have higher value than they actually do because of the noise. Now, if you instead used a different Q function,","start":2926.57,"end":2958.71},{"id":178,"text":"for picking an action and evaluating it, then you can de-correlate the noise. If you had two different key functions, they would have naturally different noise and different errors that they're making. And so if you have a way to use different key values, you can actually then...","start":2959.68,"end":2979.41},{"id":179,"text":"eliminate this problem of overestimation by essentially de-correlating the noise by using a different Q function to estimate the key action here as to evaluate the action here. And so the key idea behind double Q learning is to use two different networks. One network, network A, for picking the action, and network B for evaluating.","start":2979.9,"end":3010.08},{"id":180,"text":"And then if they're noisy in different ways, then we're not going to then be kind of exploiting noise in our key values and then, as a result, not overestimate our key values.","start":3015.95,"end":3025.31},{"id":181,"text":"The question is, can you guarantee that they don't have the same noise?","start":3026.07,"end":3029.53},{"id":182,"text":"I guess you definitely can't guarantee it, and there might be some noise that's a result of the architecture of the network.","start":3031.91,"end":3038.79},{"id":183,"text":"work. But in practice, this ends up making a really, like, if you are using different","start":3038.79,"end":3046.73},{"id":184,"text":"neural networks for this, it generally does a very good job. There's still some overestimation,","start":3046.73,"end":3054.25},{"id":185,"text":"and if you looked at these values, like here in this game, the key values are still an","start":3054.39,"end":3058.85},{"id":186,"text":"overestimate, still an overestimate here, and also here as well, but it helps substantially","start":3058.85,"end":3065.17},{"id":187,"text":"compared to not doing it. So it's not perfect, but it helps quite a bit.","start":3065.17,"end":3070.23}],"notes":["本段讨论了Q学习中由于使用同一个Q函数来选择和评估动作而导致的过估计问题。当Q函数中存在噪声时，这种噪声可能被用来选择具有更高键值的动作，从而导致过估计。"],"formulas":[],"uncertainties":["key value","key function","double Q learning","network A","network B"],"diagram":"none","start":2894.79,"end":3070.23,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2894.79,"text":"And so we're both using an action that has a high key value and evaluating the key value of that action using the same key function. And this means that if there is noise in our key function, then it's very easy, this noise, it's very easy to basically pick actions that are using that noise to get a higher key value. And so this last term right here is what's causing overestimation."},{"start":2926.57,"text":"It's not perfect, it has some noise in it, as neural networks generally do, and because the action selected according to Q is the same as what's being evaluated, then you can really exploit that noise and use actions that have higher value than they actually do because of the noise. Now, if you instead used a different Q function,"},{"start":2959.68,"text":"for picking an action and evaluating it, then you can de-correlate the noise. If you had two different key functions, they would have naturally different noise and different errors that they're making. And so if you have a way to use different key values, you can actually then..."},{"start":2979.9,"text":"eliminate this problem of overestimation by essentially de-correlating the noise by using a different Q function to estimate the key action here as to evaluate the action here. And so the key idea behind double Q learning is to use two different networks. One network, network A, for picking the action, and network B for evaluating."},{"start":3015.95,"text":"And then if they're noisy in different ways, then we're not going to then be kind of exploiting noise in our key values and then, as a result, not overestimate our key values."},{"start":3026.07,"text":"The question is, can you guarantee that they don't have the same noise?"},{"start":3031.91,"text":"I guess you definitely can't guarantee it, and there might be some noise that's a result of the architecture of the network."},{"start":3038.79,"text":"work. But in practice, this ends up making a really, like, if you are using different"},{"start":3046.73,"text":"neural networks for this, it generally does a very good job. There's still some overestimation,"},{"start":3054.39,"text":"and if you looked at these values, like here in this game, the key values are still an"},{"start":3058.85,"text":"overestimate, still an overestimate here, and also here as well, but it helps substantially"},{"start":3065.17,"text":"compared to not doing it. So it's not perfect, but it helps quite a bit."}],"speech_gaps":[],"frame":"../frames/v033/018.webp","frame_time":2906.79},{"title":"Q学习中的网络结构与噪声相关性","segments":[{"id":188,"text":"The question is, what if you did like triple DQN or quadruple DQN, like use even more networks?","start":3071.29,"end":3076.27},{"id":189,"text":"It's a good question. I could see that, yeah, perhaps that it's the noise correlation.","start":3079.45,"end":3086.01},{"id":190,"text":"If you're able to get like even more samples of noise, that could help.","start":3086.83,"end":3090.55},{"id":191,"text":"It could be interesting to try that in practice, if the noise is coming from, if it's instead","start":3092.83,"end":3098.19},{"id":192,"text":"coming from a source that's like kept constant, like the architecture of the neural network","start":3098.19,"end":3102.19},{"id":193,"text":"or something like that, then it might not help until you start to introduce those.","start":3102.19,"end":3106.75},{"id":194,"text":"And then in practice, using more than two neural networks is very effective.","start":3107.45,"end":3113.61},{"id":195,"text":"How do you ensure that they don't diverge?","start":3114.75,"end":3116.31},{"id":196,"text":"So let's actually talk about what we actually do.","start":3116.33,"end":3119.17},{"id":197,"text":"So we're actually.","start":3119.17,"end":3120.83},{"id":198,"text":"already using two neural networks. We have the current neural network and the target neural network that was just periodically frozen. And so what we can actually do is when we do our Q update, we can use the target network Q5 prime for evaluating and the current neural network for picking it up. And yeah, so that's...","start":3123.51,"end":3153.05},{"id":199,"text":"Essentially what double queueing looks like where instead of using the target network for both of these, we're going to use the current network to pick the best action and then the target network for that one. Yeah, so your previous queue is always going to be your previous queue and so you can't size it yet.","start":3153.57,"end":3168.56},{"id":200,"text":"Yeah, so the question is, why does this help, especially if the previous queue has the same noise? So the previous queue will be outdated, and the new queue will have gotten a lot of gradient updates since then, and they've seen new data points recently. And so oftentimes the noise isn't just about initialization, but it also has to do with what gradient updates were applied. And so, yeah, it helps a lot.","start":3169.45,"end":3197.21},{"id":201,"text":"Okay, the last trick we'll talk about, which we've already talked about in the after-critic method, is MSTEP returns. So our Q-learning target looks like this, with the reward plus the max of Q. If your Q values are good, then this term is actually going to be really, really important in playing most of the role in the Q-learning update. But if your Q function is bad, like at the beginning of training,","start":3198.51,"end":3224.87},{"id":202,"text":"then these are really the only values that are going to matter, and these are the values that are going to be getting your learning algorithms fixed. And if you just have a single reward function here, then that might be a bit troublesome because just a single reward function might not tell you that much about how good your key value is. So if you remember when we talked about actual critic methods, we talked about...","start":3225.71,"end":3248.52}],"notes":["本段讨论了在深度Q网络（DQN）中使用多个神经网络的潜在好处，特别是噪声相关性的问题。讲者提到，如果使用更多的网络（如三重或四重DQN），可能会有助于减少噪声的影响，尤其是在噪声来源是固定的情况下，如神经网络的架构。讲者还提到，使用多个网络在实践中非常有效，但需要确保它们不会发散。","讲者进一步解释了双网络（Double DQN）的机制，即使用当前网络选择最佳动作，而使用目标网络进行评估。这种设计有助于减少过估计的问题，因为目标网络的更新频率较低，从而减少了噪声的影响。","讲者指出，如果Q值函数表现良好，那么Q学习的目标中的最大Q值项将起主要作用；但如果Q函数表现不佳，如训练初期，这些最大Q值项将成为学习算法修正的关键。因此，单一奖励函数可能不足以准确反映Q值的性能。","讲者提到，使用多个网络可以带来更多的样本噪声，这有助于提高模型的鲁棒性。然而，如果噪声来源是固定的，如网络架构，那么这种噪声可能不会带来显著的帮助，直到引入新的变化。","讲者还提到，双网络设计通过分离更新频率，使得目标网络的评估更加稳定，从而减少噪声对Q值估计的影响。这种设计在实践中被证明是有效的。","最后，讲者提到MSTEP返回（MSTEP returns）作为Q学习目标的一部分，强调了Q值在训练初期的重要性，以及单一奖励函数可能带来的局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3071.29,"end":3248.52,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3071.29,"text":"The question is, what if you did like triple DQN or quadruple DQN, like use even more networks?"},{"start":3079.45,"text":"It's a good question. I could see that, yeah, perhaps that it's the noise correlation."},{"start":3086.83,"text":"If you're able to get like even more samples of noise, that could help."},{"start":3092.83,"text":"It could be interesting to try that in practice, if the noise is coming from, if it's instead"},{"start":3098.19,"text":"coming from a source that's like kept constant, like the architecture of the neural network"},{"start":3102.19,"text":"or something like that, then it might not help until you start to introduce those."},{"start":3107.45,"text":"And then in practice, using more than two neural networks is very effective."},{"start":3114.75,"text":"How do you ensure that they don't diverge?"},{"start":3116.33,"text":"So let's actually talk about what we actually do."},{"start":3119.17,"text":"So we're actually."},{"start":3123.51,"text":"already using two neural networks. We have the current neural network and the target neural network that was just periodically frozen. And so what we can actually do is when we do our Q update, we can use the target network Q5 prime for evaluating and the current neural network for picking it up. And yeah, so that's..."},{"start":3153.57,"text":"Essentially what double queueing looks like where instead of using the target network for both of these, we're going to use the current network to pick the best action and then the target network for that one. Yeah, so your previous queue is always going to be your previous queue and so you can't size it yet."},{"start":3169.45,"text":"Yeah, so the question is, why does this help, especially if the previous queue has the same noise? So the previous queue will be outdated, and the new queue will have gotten a lot of gradient updates since then, and they've seen new data points recently. And so oftentimes the noise isn't just about initialization, but it also has to do with what gradient updates were applied. And so, yeah, it helps a lot."},{"start":3198.51,"text":"Okay, the last trick we'll talk about, which we've already talked about in the after-critic method, is MSTEP returns. So our Q-learning target looks like this, with the reward plus the max of Q. If your Q values are good, then this term is actually going to be really, really important in playing most of the role in the Q-learning update. But if your Q function is bad, like at the beginning of training,"},{"start":3225.71,"text":"then these are really the only values that are going to matter, and these are the values that are going to be getting your learning algorithms fixed. And if you just have a single reward function here, then that might be a bit troublesome because just a single reward function might not tell you that much about how good your key value is. So if you remember when we talked about actual critic methods, we talked about..."}],"speech_gaps":[{"start":3076.752,"end":3078.288}],"frame":"../frames/v033/019.webp","frame_time":3083.29},{"title":"Q学习中的n步回报与目标函数","segments":[{"id":203,"text":"using n-step returns. So to use this Monte Carlo, we would use the sum of rewards. If we use bootstrapping, we just do r plus b, like r at the current time step plus b at the next time step. And instead, we talked about this thing that we could do in the middle, where we sum the rewards over the next n time steps, and then use the value at the time step after that. We talked about how this has less variance and lower bias, and lower bias in the sense that it's your target.","start":3249.64,"end":3277.18},{"id":204,"text":"are bad, the reward function is going to be more accurate. So can we do this for key values? And what this would look like for key values is instead of having something like this, say this is the target for, you're trying to get the target for s, c, a, t, then you would define y, i to be r at the current time step plus","start":3277.8,"end":3309.25},{"id":205,"text":"are at the next time step up until r at t plus n minus 1 time step and then at the time step after that use the max of q of s t plus n a t plus n where this maximization is over a t plus n so this is what n-step returns","start":3309.91,"end":3341.95},{"id":206,"text":"could look like for C-learning. Does anyone see any potential issue with using this target? Yeah, so if you're doing this off-policy, these R's will be coming from whatever policy you used in the replay buffer, rather than the optimal policy, which is what you're trying to estimate.","start":3342.7,"end":3367.17},{"id":207,"text":"the downside is that these rewards are for the policy that collected the data, not for the optimal policy. And we're trying to estimate the key functions of the optimal policy. So this is kind of a downside when using NSTEP returns with learning.","start":3369.99,"end":3393.62},{"id":208,"text":"Now, and this is not an issue with n equals 1, because there the reward will just be a function of S and A, and we're estimating the Q value of S and A. Now, what should we do about this? Maybe the unsatisfying answer is that most commonly just ignore this, pretend it isn't true, and still use an n greater than 1. And separate terms truly are often like","start":3395.6,"end":3425.53}],"notes":["本段讨论了n步回报在Q学习中的应用，其中提到n步回报通过在接下来的n个时间步内对奖励进行求和，并在下一个时间步使用价值函数来计算目标值。这种做法相比蒙特卡洛方法具有更低的方差和偏差，但其目标值是基于数据收集策略而非最优策略。","在使用n步回报时，如果采用离策略学习（off-policy learning），那么奖励值将来自于回放缓冲区中使用的策略，而不是最优策略。这可能导致估计的Q函数与最优策略不一致，从而成为使用n步回报的一个潜在问题。","尽管n步回报在早期学习阶段可能更快收敛，但其缺点在于所使用的奖励值对应的是数据收集策略，而非最优策略。因此，当使用n步回报进行学习时，可能会导致对最优策略的Q函数估计不准确。","对于n=1的情况，奖励值仅依赖于当前状态和动作，因此不会出现上述问题。然而，对于n>1的情况，需要考虑如何处理这种不一致性。","一种常见的做法是忽略这一问题，继续使用n>1的n步回报进行学习，尽管这可能会影响最终的估计结果。","在实际应用中，n步回报的使用需要权衡其优势（如更低的方差和偏差）与潜在的不一致性问题。"],"formulas":[],"uncertainties":["n-step returns 的具体公式可能未被完全准确识别，例如折扣因子 β 是否被正确提及。"],"diagram":"none","start":3249.64,"end":3425.53,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3249.64,"text":"using n-step returns. So to use this Monte Carlo, we would use the sum of rewards. If we use bootstrapping, we just do r plus b, like r at the current time step plus b at the next time step. And instead, we talked about this thing that we could do in the middle, where we sum the rewards over the next n time steps, and then use the value at the time step after that. We talked about how this has less variance and lower bias, and lower bias in the sense that it's your target."},{"start":3277.8,"text":"are bad, the reward function is going to be more accurate. So can we do this for key values? And what this would look like for key values is instead of having something like this, say this is the target for, you're trying to get the target for s, c, a, t, then you would define y, i to be r at the current time step plus"},{"start":3309.91,"text":"are at the next time step up until r at t plus n minus 1 time step and then at the time step after that use the max of q of s t plus n a t plus n where this maximization is over a t plus n so this is what n-step returns"},{"start":3342.7,"text":"could look like for C-learning. Does anyone see any potential issue with using this target? Yeah, so if you're doing this off-policy, these R's will be coming from whatever policy you used in the replay buffer, rather than the optimal policy, which is what you're trying to estimate."},{"start":3369.99,"text":"So there's kind of pros and cons here. One is that it's a lot less biased, a lot faster to learn on, especially early on. But the downside is that these rewards are for the policy that collected the data, not for the optimal policy. And we're trying to estimate the key functions of the optimal policy. So this is kind of a downside when using NSTEP returns with learning."},{"start":3395.6,"text":"Now, and this is not an issue with n equals 1, because there the reward will just be a function of S and A, and we're estimating the Q value of S and A. Now, what should we do about this? Maybe the unsatisfying answer is that most commonly just ignore this, pretend it isn't true, and still use an n greater than 1. And separate terms truly are often like"}],"speech_gaps":[],"frame":"../frames/v033/020.webp","frame_time":3261.64},{"title":"Q学习（Q-Learning）的应用与成功案例","segments":[{"id":209,"text":"really very often improve the performance of the algorithm, the site being incorrect. That said, there are other things you can do. You can dynamically choose n and only use data that follows the current policy, basically looking at what actions were taken and seeing if those actions actually agree with the maximal key values. You could also, in principle, dynamically choose n and have n be smaller later in training, where your key values are likely to be more accurate.","start":3426.06,"end":3454.34},{"id":210,"text":"Now for this particular choosing of n, you really would want to do this only if the action space is small and the data is mostly on policies. And you can also do important sampling as well and weight these rewards by some importance.","start":3456.23,"end":3484.16},{"id":211,"text":"Q-learning that have been very successful that I put on this slide. I think there's other examples too, but one of the most prominent examples was for playing games. And if you want to train an agent to play a game, either...","start":3484.54,"end":3498.64},{"id":212,"text":"either just for the sake of seeing how well you can do, or to play against a human, Q-Learning was able to outperform most people on Atari games. So this bar right here, everything above this bar are the games that it is at human level or above human level performance, and everything below is worse than human level performance. And then it also was used to train a robot grasping system. So this is actually a case of continuous action.","start":3499.72,"end":3528.66},{"id":213,"text":"And the robot on the right is using a Q function that was trained with Q-learning. And then it is doing a continuous optimization over actions that will try to find a good way to grasp the object.","start":3529.92,"end":3549.14},{"id":214,"text":"And we talked a bit last time about how with RL you can get much higher success rate and more reliable policies, and we see that here too where this system was able to get like a 96% success rate, so quite high at being able to draft objects. The other thing that's nice about using RL for this application is you end up, if in order to draft you need to","start":3550.63,"end":3578.52}],"notes":["本段讲解了Q学习中动态选择n值的策略，适用于动作空间较小且数据主要来自当前策略的情况。同时提到重要性采样，通过加权奖励来提升效果。","Q学习在游戏领域取得了显著成功，特别是在Atari游戏中，Q学习能够超越大多数人类玩家的表现。图表显示了Q学习在游戏中的表现水平，高于或等于人类水平的被标记在上方，低于的在下方。","Q学习还被用于训练机器人抓取系统，这是一个连续动作的案例。右侧的机器人使用Q函数进行训练，并通过连续优化动作来找到抓取物体的有效方法。","使用强化学习在机器人抓取任务中取得了96%的成功率，显示出其在实际应用中的高可靠性。此外，强化学习在该任务中能够有效解决抓取所需的复杂问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3426.06,"end":3578.52,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3426.06,"text":"really very often improve the performance of the algorithm, the site being incorrect. That said, there are other things you can do. You can dynamically choose n and only use data that follows the current policy, basically looking at what actions were taken and seeing if those actions actually agree with the maximal key values. You could also, in principle, dynamically choose n and have n be smaller later in training, where your key values are likely to be more accurate."},{"start":3456.23,"text":"Now for this particular choosing of n, you really would want to do this only if the action space is small and the data is mostly on policies. And you can also do important sampling as well and weight these rewards by some importance. Great, so those were the three tricks for accumulating in practice. There's a couple examples of..."},{"start":3484.54,"text":"Q-learning that have been very successful that I put on this slide. I think there's other examples too, but one of the most prominent examples was for playing games. And if you want to train an agent to play a game, either..."},{"start":3499.72,"text":"either just for the sake of seeing how well you can do, or to play against a human, Q-Learning was able to outperform most people on Atari games. So this bar right here, everything above this bar are the games that it is at human level or above human level performance, and everything below is worse than human level performance. And then it also was used to train a robot grasping system. So this is actually a case of continuous action."},{"start":3529.92,"text":"And the robot on the right is using a Q function that was trained with Q-learning. And then it is doing a continuous optimization over actions that will try to find a good way to grasp the object."},{"start":3550.63,"text":"And we talked a bit last time about how with RL you can get much higher success rate and more reliable policies, and we see that here too where this system was able to get like a 96% success rate, so quite high at being able to draft objects. The other thing that's nice about using RL for this application is you end up, if in order to draft you need to"}],"speech_gaps":[],"frame":"../frames/v033/021.webp","frame_time":3438.06},{"title":"Q学习（Q-Learning）","segments":[{"id":215,"text":"Not just go down and pick something up, but you actually need to move around the object. It's also able to learn how to do that using the reinforcement, because it's treating it as essential. One of the last things I figured I would cover is some of my advice on when to use one online URL algorithm versus another, since this is the last online URL method that we'll talk about.","start":3579.83,"end":3608.92},{"id":216,"text":"So we talked a bit about PPO, SAT, and DQN. Those are some of the three main tactical algorithms we talked about. For PPO, this is great when you care about stability and ease of use. It generally doesn't require too much tuning, but it's very data inefficient, and so it's great to use when you care about stability and ease of use, and you don't really care about data as a PC. DQN works quite well when you have discrete actions or low-dimensional continuous actions.","start":3610.31,"end":3638.1},{"id":217,"text":"And so in those cases, it can be a great choice. It can be fairly data efficient, depending on some of the details of how off-polish you make it. And then soft-back to critic and variants of it are great when you care most about data efficiency, but require a bit more tuning and are a bit less stable than something like CTO.","start":3638.77,"end":3659.67},{"id":218,"text":"What we talked about is Q-learning, also Q-learning in practice, the three-trigger target network, double DQN, and separate turns. We defined it like the Bellman equation and the Bellman optimality equation. Yeah, and that was like essentially an overview of how to do RL without learning an explicit policy. We're done with online reinforcement learning algorithms for now. And yeah, we covered a lot of the basics of different online reinforcement learning algorithms.","start":3664.82,"end":3693.85}],"notes":["本段主要讲解了Q学习的基本概念，包括其在强化学习中的应用，以及与其他在线强化学习算法（如PPO、DQN等）的对比。Q学习通过贝尔曼方程和贝尔曼最优方程来定义，强调了无需显式学习策略的特点。","讲者提到PPO适用于需要稳定性和易用性的场景，但数据效率较低；DQN适用于离散动作或低维连续动作的情况，且在某些情况下数据效率较高。Soft-back to critic及其变体则更注重数据效率，但需要更多调参且稳定性稍差。","讲者还提到Q学习在实践中的一些变体，如三触发目标网络、双重DQN和分离网络。这些变体旨在提高Q学习的稳定性和数据效率。","最后，讲者总结了在线强化学习算法的基本内容，并指出Q学习是其中的重要组成部分，强调了其在无需显式策略学习方面的优势。"],"formulas":[],"uncertainties":["off-polish","three-trigger target network","separate turns","CTO","soft-back to critic"],"diagram":"none","start":3579.83,"end":3693.85,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3579.83,"text":"not just go down and pick something up, but you actually need to move around the object. It's also able to learn how to do that using the reinforcement, because it's treating it as essential. One of the last things I figured I would cover is some of my advice on when to use one online URL algorithm versus another, since this is the last online URL method that we'll talk about."},{"start":3610.31,"text":"So we talked a bit about PPO, SAT, and DQN. Those are some of the three main tactical algorithms we talked about. For PPO, this is great when you care about stability and ease of use. It generally doesn't require too much tuning, but it's very data inefficient, and so it's great to use when you care about stability and ease of use, and you don't really care about data as a PC. DQN works quite well when you have discrete actions or low-dimensional continuous actions."},{"start":3638.77,"text":"And so in those cases, it can be a great choice. It can be fairly data efficient, depending on some of the details of how off-polish you make it. And then soft-back to critic and variants of it are great when you care most about data efficiency, but require a bit more tuning and are a bit less stable than something like CTO."},{"start":3664.82,"text":"What we talked about is Q-learning, also Q-learning in practice, the three-trigger target network, double DQN, and separate turns. We defined it like the Bellman equation and the Bellman optimality equation. Yeah, and that was like essentially an overview of how to do RL without learning an explicit policy. We're done with online reinforcement learning algorithms for now. And yeah, we covered a lot of the basics of different online reinforcement learning algorithms."}],"speech_gaps":[],"frame":"../frames/v033/022.webp","frame_time":3591.83}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
