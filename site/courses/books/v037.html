f these factors come back into play.","zh":"蒙特卡洛展开实际上是一种很多人使用的方法，因为在许多情况下，你的环境动态几乎是完美的，而且你的奖励信号，尤其是在数学或代码推理等领域，也会是完美的。因此，你不需要担心诸如动态方差之类的问题。但如果涉及到像代理领域或机器人领域这样的情况，这些因素就会重新变得重要。","start":1908.02,"end":1929.22},{"id":108,"text":"One other thing that dynamic programming gives you is this notion of stitching. And if we look at this maze environment on the left-hand side, you can kind of see an example of why this might be powerful. So let's say that we've collected through our policy two different trajectories, one that goes from A to B and another that goes from C to D.","zh":"动态规划还提供了一个概念，即缝合。如果我们看一下左边的迷宫环境，你可以大致看到为什么这可能很有用。例如，假设我们通过策略收集了两条不同的轨迹，一条是从A到B，另一条是从C到D。","start":1930.42,"end":1952.34},{"id":109,"text":"Through this one step of dynamic programming, what you will see is that you can actually find the optimal path from A to D because of the fact that at every step, you're looking like one step before it, and you can kind of stitch these trajectories together to form what the optimal path would be to the goal. So this kind of allows you to get better coverage of your space and allows these algorithms to potentially be somewhat more efficient. Any questions about this?","zh":"通过这一步动态规划，你会看到实际上可以找到从A到D的最优路径，因为每一步你都在查看前一步的情况，并且可以将这些轨迹缝合起来，形成到达目标的最优路径。这使得你能够更好地覆盖整个空间，并且让这些算法有可能更加高效。有任何问题吗？","start":1953.1,"end":1982.3},{"id":110,"text":"Okay, if not, then let's talk a little bit more about some of the practical design details that are needed to sort of get Q-learning to sort of stabilize. The first thing that we'll quickly talk about is this notion of a semi-gradient or target network.","zh":"好的，如果没有问题，那么让我们再谈谈一些实际的设计细节，这些细节有助于让Q学习稳定下来。我们首先快速讨论的是半梯度或目标网络的概念。","start":1989.3,"end":2005.36},{"id":111,"text":"and we're now going to look back at our Q-value estimate that we've been looking at so far, where we define it as the reward at the current time step plus the discounted Q-value at the next time step. We look at the max over all actions.","zh":"现在我们将回顾我们之前一直在研究的Q值估计，其中我们将其定义为当前时间步的奖励加上下一个时间步的折扣Q值，并在所有动作上取最大值。","start":2006.34,"end":2021.02},{"id":112,"text":"So one thing that what you'll see here is that the Q function on the left is going to be the same as the Q function on the right. But this will make optimization kind of very difficult, especially if you like propagate gradients through it. So one kind of trick that people do use is this notion of a semi-gradient, which allows you to sort of freeze your target network or not pass any gradients to it to make optimization a little bit more stable.","zh":"你会看到，左边的Q函数将与右边的Q函数相同。但这会使优化变得非常困难，尤其是当你通过它传播梯度时。因此，人们常用的一种技巧是半梯度的概念，它允许你冻结目标网络或不将任何梯度传递给它，从而使优化更加稳定。","start":2023.95,"end":2048.73},{"id":113,"text":"And that's defined as this equation, the second equation that I defined here.","zh":"这就是由这个方程定义的，也就是我在这里定义的第二个方程。","start":2049.7,"end":2054.0},{"id":114,"text":"Additionally, to further make things a little bit more stable, people add in this notion of a target network, which delays the updates of the right hand side to allow your Q function to regress to a more stable target. And there are two types of updates that people kind of use in this space. One is this notion of a hard target update, where at a fixed frequency, you allow the model to essentially update to the most recent model that you've used.","zh":"此外，为了进一步使情况更加稳定，人们引入了目标网络的概念，通过延迟右侧的更新，使你的Q函数能够回归到一个更稳定的目标上。在这个领域中，人们通常使用两种类型的更新方式。一种是硬目标更新，即在固定的频率下，允许模型更新到你最近使用的模型。","start":2055.93,"end":2082.67}],"notes":["本段讲解了Q学习中动态规划的缝合概念，即通过将不同轨迹连接起来，找到从起点到终点的最优路径。这种缝合机制允许算法更全面地覆盖状态空间，从而提高效率。","讲者提到，动态规划的缝合过程通过在每一步查看前一步的状态，将多个轨迹拼接起来，形成最优路径。这种机制在复杂环境中特别有用，因为它可以减少搜索空间。","在Q值估计中，讲者指出，如果直接使用当前奖励和下一时刻的Q值进行优化，可能会导致梯度传播困难。因此，引入半梯度（semi-gradient）和目标网络（target network）来稳定训练过程。","半梯度的概念允许冻结目标网络，避免将梯度传递到目标网络，从而减少优化难度。这种技巧在Q学习中被广泛使用，以提高算法的稳定性。","目标网络通过延迟更新右侧的Q值，使Q函数能够回归到更稳定的值。讲者还提到，有两种更新方式：硬目标更新和软目标更新，其中硬目标更新在固定频率下更新模型。","讲者强调，这些设计细节对于Q学习的稳定性和效率至关重要，特别是在处理复杂或高维状态空间时，这些方法能够显著提升算法性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1908.02,"end":2082.67,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":1908.02,"text":"Monte Carlo rollouts are actually the way that a lot of people do things, because in many cases, your environment dynamics are almost perfect, and your reward signal, especially in domains like math or code reasoning, are going to be perfect as well. So you don't have to worry about things like variance of your dynamics. But if you go to things like maybe agentic domains or robotic domains, a lot of these factors come back into play."},{"start":1930.42,"text":"One other thing that dynamic programming gives you is this notion of stitching. And if we look at this maze environment on the left-hand side, you can kind of see an example of why this might be powerful. So let's say that we've collected through our policy two different trajectories, one that goes from A to B and another that goes from C to D."},{"start":1953.1,"text":"Through this one step of dynamic programming, what you will see is that you can actually find the optimal path from A to D because of the fact that at every step, you're looking like one step before it, and you can kind of stitch these trajectories together to form what the optimal path would be to the goal. So this kind of allows you to get better coverage of your space and allows these algorithms to potentially be somewhat more efficient. Any questions about this?"},{"start":1989.3,"text":"Okay, if not, then let's talk a little bit more about some of the practical design details that are needed to sort of get Q-learning to sort of stabilize. The first thing that we'll quickly talk about is this notion of a semi-gradient or target network."},{"start":2006.34,"text":"and we're now going to look back at our Q-value estimate that we've been looking at so far, where we define it as the reward at the current time step plus the discounted Q-value at the next time step. We look at the max over all actions."},{"start":2023.95,"text":"So one thing that what you'll see here is that the Q function on the left is going to be the same as the Q function on the right. But this will make optimization kind of very difficult, especially if you like propagate gradients through it. So one kind of trick that people do use is this notion of a semi-gradient, which allows you to sort of freeze your target network or not pass any gradients to it to make optimization a little bit more stable."},{"start":2049.7,"text":"And that's defined as this equation, the second equation that I defined here."},{"start":2055.93,"text":"Additionally, to further make things a little bit more stable, people add in this notion of a target network, which delays the updates of the right hand side to allow your Q function to regress to a more stable target. And there are two types of updates that people kind of use in this space. One is this notion of a hard target update, where at a fixed frequency, you allow the model to essentially update to the most recent model that you've used."}],"speech_gaps":[],"frame":"../frames/v037/012.webp","frame_time":1920.02},{"title":"Q学习回顾与目标网络更新策略","segments":[{"id":115,"text":"Additionally, you can also use this notion of a soft target update or kind of an EMA or polyac style averaging technique, which allows you to smoothly interpolate between sort of the Q functions that you've seen so far with a decay parameter. In practice, people...","zh":"此外，你也可以使用这种软目标更新的概念，或者类似EMA（指数移动平均）或Polyak风格的平均技术，这允许你通过一个衰减参数，平滑地在你迄今为止看到的Q函数之间进行插值。在实践中，人们……","start":2083.87,"end":2098.61},{"id":116,"text":"I think, try to use the one on the right, that both of them kind of empirically have been seen to work somewhat well. And the reason that you kind of want to do this is that you want to make sure that when you're doing some amount of regression, your value function is a really stable target to kind of approach.","zh":"我认为，尝试使用右边的那个，两者在实证上都被观察到在某种程度上表现得相当不错。你之所以想要这样做，是因为当你进行一定程度的回归时，你希望你的价值函数是一个非常稳定的靶标，以便接近它。","start":2099.07,"end":2115.29},{"id":117,"text":"Some of these things, like removing the gradient on the right-hand side, as well as introducing a target network, makes the learning problem a lot easier. There are things that you'd have to consider in terms of how frequently you update your target network and things like that. But for most cases, people have stabilized this as a hyperparameter to around 0.99, for example, for the polyac averaging.","zh":"一些做法，比如移除右边的梯度，以及引入目标网络，会使学习问题变得容易得多。你需要考虑如何频繁地更新目标网络等事项。但在大多数情况下，人们将这种稳定化作为超参数，例如在Polyak平均中设置为约0.99。","start":2117.26,"end":2140.8},{"id":118,"text":"Typically, when you're learning a Q function, you would learn this through a regression style of technique, which would look something like this. So I'm just going to, again, do the value function update to match what we have there. So on this side here, this is going to basically be our loss quantity.","zh":"通常，当你学习一个Q函数时，你会通过一种回归风格的技术来学习，这看起来会像这样。因此，我再次将价值函数更新以匹配我们所拥有的内容。在这里，这基本上会成为我们的损失量。","start":2141.94,"end":2184.76},{"id":119,"text":"This is essentially just for a single sample estimate what our loss would be. And basically, we have a learned network on both sides of our MSE, which will be very unstable to basically learn from. What a stop gradient essentially does is that it prevents you from passing gradients to the right-hand side. So your target is going to be fixed when you can't pass any gradients to it, but you can pass gradients through your network on the left-hand side.","zh":"这基本上只是针对单个样本估计，我们的损失会是什么。基本上，我们在MSE的两侧都有一个学习网络，这会非常不稳定地进行学习。Stop gradient本质上所做的就是阻止你将梯度传递到右边。因此，当你无法将任何梯度传递给它时，你的目标将被固定，但你可以通过左侧的网络传递梯度。","start":2187.74,"end":2211.24},{"id":120,"text":"So in this case, when you do the semi-gradient trick, it's going to keep the same set of parameters but not pass gradients through it. But the target network is in a completely different set of parameters that is independent of the parameters that you've learned. And you then update them through this polyhack averaging, which I was showing here.","zh":"在这种情况下，当你进行半梯度技巧时，它将保持相同的参数集，但不会将梯度传递给它。但目标网络位于完全不同的参数集中，与你学习到的参数无关。然后你通过这种Polyak平均技术来更新它们，如我在这里所展示的。","start":2212.33,"end":2231.83},{"id":121,"text":"So you have these sets of weights, w prime, and w is maybe the weights of your current network. And every so often for a hard target update, you would update them. Or for your polyhack averaging, you would update them at every step, but with this soft ratio averaging. This one here? Yes. So this would be exactly the term that we were looking at here as our target. So this is our...","zh":"所以你有这些权重集合，w prime，而w可能是你当前网络的权重。每隔一段时间进行一次硬目标更新，你会更新它们。或者对于你的polyhack平均，你会在每一步都更新它们，但使用这种软比率平均。这个呢？是的。所以这将是我们在前面所讨论的目标项。所以这就是我们的...","start":2233.03,"end":2261.69}],"notes":["本段讲解了Q学习中使用软目标更新（soft target update）或指数移动平均（EMA）等技术，通过衰减参数平滑地插值已有的Q函数，以提高学习的稳定性。这些方法在实践中被广泛采用，因为它们能提供更稳定的值函数目标。","讲者提到，使用右侧的策略（如目标网络）在经验上表现良好，其目的是确保在进行回归时，值函数是一个稳定的更新目标。这有助于减少训练过程中的波动。","引入目标网络和移除右侧梯度是简化学习问题的关键步骤。讲者指出，更新频率是需要考虑的因素，但通常将衰减参数设置为0.99左右，以实现稳定的学习。","在Q函数学习中，通常采用回归技术，通过均方误差（MSE）来计算损失。讲者强调，目标网络的参数是独立于当前网络的，且通过软平均（如polyac）进行更新。","停止梯度（stop gradient）的作用是防止梯度传递到右侧，从而固定目标网络的参数。这使得左侧网络可以继续学习，而目标网络保持稳定。","讲者提到，半梯度技巧（semi-gradient trick）保持参数不变，但阻止梯度传递。目标网络的参数独立于当前网络，并通过软平均进行更新，这有助于提高训练的稳定性。"],"formulas":[],"uncertainties":["polyhack averaging"],"diagram":"none","start":2083.87,"end":2261.69,"asr_flags":[],"math_clarifications":["原始文本中并未明确提及或展示该公式，因此无法核定其正确性。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2083.87,"text":"Additionally, you can also use this notion of a soft target update or kind of an EMA or polyac style averaging technique, which allows you to smoothly interpolate between sort of the Q functions that you've seen so far with a decay parameter. In practice, people..."},{"start":2099.07,"text":"I think, try to use the one on the right, that both of them kind of empirically have been seen to work somewhat well. And the reason that you kind of want to do this is that you want to make sure that when you're doing some amount of regression, your value function is a really stable target to kind of approach."},{"start":2117.26,"text":"Some of these things, like removing the gradient on the right-hand side, as well as introducing a target network, makes the learning problem a lot easier. There are things that you'd have to consider in terms of how frequently you update your target network and things like that. But for most cases, people have stabilized this as a hyperparameter to around 0.99, for example, for the polyac averaging."},{"start":2141.94,"text":"Typically, when you're learning a Q function, you would learn this through a regression style of technique, which would look something like this. So I'm just going to, again, do the value function update to match what we have there. So on this side here, this is going to basically be our loss quantity."},{"start":2187.74,"text":"This is essentially just for a single sample estimate what our loss would be. And basically, we have a learned network on both sides of our MSE, which will be very unstable to basically learn from. What a stop gradient essentially does is that it prevents you from passing gradients to the right-hand side. So your target is going to be fixed when you can't pass any gradients to it, but you can pass gradients through your network on the left-hand side."},{"start":2212.33,"text":"So in this case, when you do the semi-gradient trick, it's going to keep the same set of parameters but not pass gradients through it. But the target network is in a completely different set of parameters that is independent of the parameters that you've learned. And you then update them through this polyhack averaging, which I was showing here."},{"start":2233.03,"text":"So you have these sets of weights, w prime, and w is maybe the weights of your current network. And every so often for a hard target update, you would update them. Or for your polyhack averaging, you would update them at every step, but with this soft ratio averaging. This one here? Yes. So this would be exactly the term that we were looking at here as our target. So this is our..."}],"speech_gaps":[],"frame":"../frames/v037/013.webp","frame_time":2095.87},{"title":"Q学习回顾（Review of Q-Learning）","segments":[{"id":122,"text":"Okay, let me be a little bit more precise. So let's say we have a target value, which looks as our reward at our current time step, plus the discounted value at our next time step.","zh":"好的，让我更精确一点。假设我们有一个目标值，它看起来像是我们当前时间步的奖励，加上下一个时间步的折现值。","start":2262.42,"end":2279.3},{"id":123,"text":"So this is kind of the one-step TD approach that we were taking there. And then our loss would look something like this. It's our value at our current time step minus y as like an MSC stall loss. So this is what the right-hand side sort of represents. This is like the TD loss here. Alrighty.","zh":"所以这基本上是我们之前采用的一种一步TD方法。然后我们的损失函数看起来会是这样的。它是我们当前时间步的值减去y，类似于一个MSC损失。所以右边的这一部分大致代表了这一点。这就是这里的TD损失。好的。","start":2280.43,"end":2305.49},{"id":124,"text":"So we're not done yet in terms of how to fix the gradients or making this a little bit more stable, unfortunately. There are a few other types of techniques people have used to kind of make this converge a little bit better. The first is gradient clipping, which you might have seen in things when you've trained networks in the past, where if you have a gradient that's too large, which unfortunately comes a lot of the time when you do updates like TD, you want to clip them a little bit to allow you to do optimization a little bit more stably.","zh":"不幸的是，我们还没有完成如何修正梯度或使这个过程更加稳定的讨论。人们还使用了其他几种技术来让这个过程收敛得更好一些。第一种是梯度裁剪，这可能你在过去训练网络时见过，当你的梯度太大时（不幸的是，当你进行像TD这样的更新时，这种情况经常发生），你希望对其进行裁剪，以便更稳定地进行优化。","start":2306.24,"end":2334.3},{"id":125,"text":"And here you can see kind of in this lost landscape, for example, on the left, if you don't do gradient clipping, you kind of go around the optimal parameters space. Whereas if you do some other gradient clipping, you can kind of smoothly approach it.","zh":"在这里你可以看到，在这个损失景观中，例如左边，如果不进行梯度裁剪，你会在最优参数空间周围徘徊。而如果你进行一些梯度裁剪，你就可以平滑地接近它。","start":2335.41,"end":2348.83},{"id":126,"text":"Additionally, you can use objectives other than MSC to kind of make this a little bit better. And one standard thing people have used is this notion of a Huber loss, which is like an interpolation between an L1 and L2 loss, where it allows you to not be affected by outliers through the L1 loss, which is this one in green. But then when you get close to the right... answer or the right value, you allow for an L2 loss to kind of kick in and kind of get you closer and closer to the target value. So this is the interpolation that you're essentially doing by this.","zh":"此外，你还可以使用除了MSC以外的目标函数来让这个过程更好一些。人们常用的一种标准方法是这种Huber损失的概念，它是在L1和L2损失之间的插值，它允许你不受异常值的影响，这通过L1损失实现，也就是图中绿色的那个。但当你接近正确答案或正确值时，你允许L2损失起作用，从而让你更接近目标值。这就是你通过这种插值所实现的。","start":2350.54,"end":2376.2},{"id":127,"text":"answer or the right value, you allow for an L2 loss to kind of kick in and kind of get you closer and closer to the target value. So this is the interpolation that you're essentially doing by this. There are other things that people have done, but these are some standard things that people have found to help with learning value functions. Okay, now let's get to replay buffers.","zh":"如果你允许L2损失发挥作用，它会逐渐将你拉近目标值。因此，你实际上是在进行这种插值。人们还做了其他事情，但这些是一些人们发现有助于学习价值函数的标准方法。好的，现在让我们进入经验回放缓冲区（replay buffers）的内容。","start":2377.84,"end":2400.93},{"id":128,"text":"One thing that you might have seen in lecture either today or last week was this notion of a replay buffer, which is a memory structure that you can use to store past experiences that have been seen by an agent. And the way that we like parameterize this is kind of in this buffer like format right here, where we have these tuples of state, action, rewards, and next states. And we store them individually as transitions instead of trajectories as a whole.","zh":"你可能在今天的课或上周的课上见过这个概念，即经验回放缓冲区（replay buffer），它是一种记忆结构，可以用来存储智能体曾经经历过的过去经验。我们通常以这种缓冲区格式来参数化它，其中包含状态、动作、奖励和下一个状态的元组。我们以单独的转移（transitions）形式存储它们，而不是以完整的轨迹（trajectories）形式存储。","start":2402.98,"end":2429.08}],"notes":["本段主要讲解了Q学习中的一步TD方法，即通过当前时间步的奖励加上下一个时间步的折扣值来更新价值函数。同时，提到了TD损失的计算方式，即当前价值与目标值y之间的差异。"],"formulas":[],"uncertainties":["MSC stall loss"],"diagram":"none","start":2262.42,"end":2429.08,"asr_flags":[],"math_clarifications":["公式中的TD损失 $ L = V_t - y $ 需要补充y的定义，例如 $ y = r + \beta V_{t+1} $，其中 $ r $ 是奖励，$ \beta $ 是折扣因子。此外，损失函数通常需要明确其数学形式，如均方误差或Huber损失等。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2262.42,"text":"Okay, let me be a little bit more precise. So let's say we have a target value, which looks as our reward at our current time step, plus the discounted value at our next time step."},{"start":2280.43,"text":"So this is kind of the one-step TD approach that we were taking there. And then our loss would look something like this. It's our value at our current time step minus y as like an MSC stall loss. So this is what the right-hand side sort of represents. This is like the TD loss here. Alrighty."},{"start":2306.24,"text":"So we're not done yet in terms of how to fix the gradients or making this a little bit more stable, unfortunately. There are a few other types of techniques people have used to kind of make this converge a little bit better. The first is gradient clipping, which you might have seen in things when you've trained networks in the past, where if you have a gradient that's too large, which unfortunately comes a lot of the time when you do updates like TD, you want to clip them a little bit to allow you to do optimization a little bit more stably."},{"start":2335.41,"text":"And here you can see kind of in this lost landscape, for example, on the left, if you don't do gradient clipping, you kind of go around the optimal parameters space. Whereas if you do some other gradient clipping, you can kind of smoothly approach it."},{"start":2350.54,"text":"Additionally, you can use objectives other than MSC to kind of make this a little bit better. And one standard thing people have used is this notion of a Huber loss, which is like an interpolation between an L1 and L2 loss, where it allows you to not be affected by outliers through the L1 loss, which is this one in green. But then when you get close to the right..."},{"start":2377.84,"text":"answer or the right value, you allow for an L2 loss to kind of kick in and kind of get you closer and closer to the target value. So this is the interpolation that you're essentially doing by this. There are other things that people have done, but these are some standard things that people have found to help with learning value functions. Okay, now let's get to replay buffers."},{"start":2402.98,"text":"One thing that you might have seen in lecture either today or last week was this notion of a replay buffer, which is a memory structure that you can use to store past experiences that have been seen by an agent. And the way that we like parameterize this is kind of in this buffer like format right here, where we have these tuples of state, action, rewards, and next states. And we store them individually as transitions instead of trajectories as a whole."}],"speech_gaps":[],"frame":"../frames/v037/014.webp","frame_time":2274.42},{"title":"Q学习回顾与经验回放机制","segments":[{"id":129,"text":"And the reason that we want to do it that way is that it allows us to break down the temporal correlations of our dataset and also allow us to prevent recency bias. So there are two things that kind of come into play. So the temporal correlations come from the fact that at every time step, we sample transitions rather than trajectories. And this can be across trajectories as well. So I can sample.","zh":"我们之所以想这样做的原因在于，它允许我们打破数据集中的时间相关性，并且允许我们防止近期偏差。因此，有两件事会发挥作用。时间相关性来自于这样一个事实：在每个时间步，我们采样的是转移（transitions）而不是轨迹（trajectories）。而且，这种采样也可以跨轨迹进行。因此，我可以采样。","start":2430.04,"end":2456.46},{"id":130,"text":"any set of indices across my entire data set, and they can be from trajectories one through n, which are the max number of trajectories I have in the data set.","zh":"我可以从我整个数据集中任意一组索引进行采样，这些索引可以来自轨迹1到轨迹n，即数据集中最多拥有的轨迹数量。","start":2457.27,"end":2471.31},{"id":131,"text":"I can avoid recency bias by making sure that I don't overfit to my current policy. Because one thing that Q functions benefit from is having a lot of coverage in the space. And this allows you to not narrow down the distribution by your current policy. And all of these kind of lead to better sample efficiency when you want to learn Q functions. And it allows the agent to kind of reuse this experience in an effective way.","zh":"我可以避免近期偏差，通过确保我不过度拟合当前策略。因为Q函数的一个优势在于它在空间中具有广泛的覆盖。这允许你避免通过当前策略来限制分布。所有这些都会在你想要学习Q函数时带来更好的样本效率，并且允许智能体以一种有效的方式重用这些经验。","start":2472.06,"end":2497.75},{"id":132,"text":"This is just going to denote that your replay buffer can sometimes have a max size, depending on how much capacity you have. Typically, this is not a concern, but if you do, you might want to either re-weigh or throw out parts of your buffer as needed.","zh":"这仅仅表示你的回放缓冲区有时可能会有一个最大容量，这取决于你拥有的容量。通常，这并不是一个问题，但如果你确实有，你可能需要根据需要重新加权或丢弃缓冲区中的部分内容。","start":2498.8,"end":2514.26},{"id":133,"text":"I think people have explored both RNN and even transformer-based architectures. There are works like Decision Transformer, for example, that do conditioning on long horizons to predict both actions and values and things like that. And they all have different amounts of trade-offs. For learning critics or Q functions, it's definitely very feasible to do so. For policies in language, for example, we do this by default. But in other places like robotics, where you might have","zh":"我认为人们已经探索了RNN甚至基于Transformer的架构。例如，有像Decision Transformer这样的工作，它们通过对长时间跨度进行条件建模来预测动作和值等。它们在学习批评家（critics）或Q函数时，显然是完全可行的。例如，在语言策略中，我们默认这样做。但在其他领域，如机器人学，你可能会有数据中的时间相关性，使用历史进行学习可能是一个更复杂的话题，实际上可能需要做出更多的设计决策才能更谨慎地进行。","start":2515.34,"end":2544.82},{"id":134,"text":"temporal correlations in your data, learning with history might be actually a more nuanced topic and can actually lead to more design decisions needing to be made to do this more carefully. But yeah, it's definitely an interesting area to consider of how can I keep in history all of the states and actions that I've seen so far, or maybe even from previous trials and things like that.","zh":"你数据中的时间相关性，使用历史进行学习可能实际上是一个更为复杂的话题，而且实际上可能需要做出更多的设计决策才能更仔细地处理。但没错，这确实是一个值得考虑的领域，即如何保留到目前为止所看到的所有状态和动作，或者甚至是从之前试验中获得的状态和动作等信息。","start":2544.85,"end":2565.37},{"id":135,"text":"I now want to quickly chat about Q-learning overestimation. So this is going to follow a derivation from using function approximation from RL. And again, we're going to look at, again, the Q-learning as like Bellman or TD backup as seen on the top. And one thing that you might notice here is that we have this like max operation on the right-hand side.","zh":"我现在想快速讨论一下Q学习的高估问题。这将基于强化学习中使用函数逼近的推导。同样，我们将再次关注Q学习，就像贝尔曼方程或TD备份在顶部所展示的一样。你可能会注意到，右边有一个最大操作。","start":2568.38,"end":2593.5}],"notes":["本段主要讲解了经验回放机制（replay buffer）的作用，包括打破时间相关性、防止近期偏差（recency bias）以及提升样本效率。通过从不同轨迹中随机采样，可以避免模型过度依赖当前策略，从而获得更广泛的覆盖。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2430.04,"end":2593.5,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2430.04,"text":"And the reason that we want to do it that way is that it allows us to break down the temporal correlations of our dataset and also allow us to prevent recency bias. So there are two things that kind of come into play. So the temporal correlations come from the fact that at every time step, we sample transitions rather than trajectories. And this can be across trajectories as well. So I can sample."},{"start":2457.27,"text":"any set of indices across my entire data set, and they can be from trajectories one through n, which are the max number of trajectories I have in the data set. Additionally, by having this buffer of past trajectories that I've visited,"},{"start":2472.06,"text":"I can avoid recency bias by making sure that I don't overfit to my current policy. Because one thing that Q functions benefit from is having a lot of coverage in the space. And this allows you to not narrow down the distribution by your current policy. And all of these kind of lead to better sample efficiency when you want to learn Q functions. And it allows the agent to kind of reuse this experience in an effective way."},{"start":2498.8,"text":"This is just going to denote that your replay buffer can sometimes have a max size, depending on how much capacity you have. Typically, this is not a concern, but if you do, you might want to either re-weigh or throw out parts of your buffer as needed."},{"start":2515.34,"text":"I think people have explored both RNN and even transformer-based architectures. There are works like Decision Transformer, for example, that do conditioning on long horizons to predict both actions and values and things like that. And they all have different amounts of trade-offs. For learning critics or Q functions, it's definitely very feasible to do so. For policies in language, for example, we do this by default. But in other places like robotics, where you might have"},{"start":2544.85,"text":"temporal correlations in your data, learning with history might be actually a more nuanced topic and can actually lead to more design decisions needing to be made to do this more carefully. But yeah, it's definitely an interesting area to consider of how can I keep in history all of the states and actions that I've seen so far, or maybe even from previous trials and things like that."},{"start":2568.38,"text":"I now want to quickly chat about Q-learning overestimation. So this is going to follow a derivation from using function approximation from RL. And again, we're going to look at, again, the Q-learning as like Bellman or TD backup as seen on the top. And one thing that you might notice here is that we have this like max operation on the right-hand side."}],"speech_gaps":[],"frame":"../frames/v037/015.webp","frame_time":2442.04},{"title":"Q学习中的噪声影响","segments":[{"id":136,"text":"And what happens essentially if we have some noise in our Q function when we try to learn it in this way? And this is what we're basically going to look at. So essentially when we are like parametrizing this Q function as a neural network, there can be noise in the estimation that we kind of incur.","zh":"如果我们尝试以这种方式学习Q函数时，Q函数中存在一些噪声，会发生什么情况？这就是我们接下来要探讨的内容。基本上，当我们用神经网络对Q函数进行参数化时，我们可能会引入一些估计误差。","start":2595.1,"end":2613.22},{"id":137,"text":"We're going to denote our Q function currently as approximate, which is the learned parameterization, and Q target here is the optimal Q function or the true underlying Q function. We're now also going to introduce this y parameter here that denotes some amount of noise that might be present due to things like modeling errors.","zh":"我们将当前的Q函数表示为近似值，即学习得到的参数化形式，而Q目标则是最优Q函数或真实的底层Q函数。我们现在还将引入一个y参数，表示由于建模误差等因素可能存在的噪声量。","start":2614.2,"end":2637.96},{"id":138,"text":"And what we'll kind of see is that if there is noise on the right-hand side when we're trying to predict the target, this actually transfers pretty badly to the left-hand side. So what we're actually looking at here on the left-hand side is kind of what would the Q values look like after one step of iteration? And how does that differ from the true target value? So Q of S prime A hat is going to be basically","zh":"我们将看到，如果在尝试预测目标值时，右边存在噪声，这种噪声实际上会很糟糕地传递到左边。左边我们实际上是在观察经过一步迭代后的Q值会是什么样子，以及它与真实目标值有何不同。Q(S'，A^)基本上就是","start":2639.57,"end":2667.09},{"id":139,"text":"what we see on the right-hand side there, and QTarget is what the true value would be. And what we're going to see here is that if we define even a noise that is a zero mean, eventually the noise on the left-hand side, which is going to be after one step of update, will have a positive mean, leading to our Q values to be sort of overestimated.","zh":"右边所看到的值，而Q目标则是真实值。我们将看到，如果我们定义的噪声具有零均值，那么经过一步更新后的左边噪声，其均值会变为正，导致我们的Q值被高估。","start":2667.93,"end":2691.66},{"id":140,"text":"So this results in us having to deal with this overestimation issue when we're trying to learn our critics. I think one thing that I mentioned here is that we're going to do a maximization over actions. There could be issues, for example, with sampling as well. Actually, I don't think that's necessarily the case.","zh":"因此，我们在学习批评家（critic）时，必须处理这种高估问题。我认为我在这里提到的一点是，我们将对动作进行最大化操作。例如，采样可能会有问题。实际上，我不认为这一定是这种情况。","start":2692.34,"end":2716.0},{"id":141,"text":"your true target value over all actions might be actually higher in that case than if you only look at a subset of your total actions. So in that case, then this property would not necessarily be an issue.","zh":"在这种情况下，所有动作的真实目标值可能实际上比只查看一部分动作时更高。因此，在这种情况下，这种性质不一定是问题。","start":2718.23,"end":2733.13},{"id":142,"text":"I think the main concern actually just comes from modeling errors, because in some cases you might actually overestimate your Q value on the right, and once you do multiple rounds of dynamic programming, this error will propagate through your entire state space and will compound, essentially.","zh":"我认为主要的担忧实际上来自于建模误差，因为在某些情况下，你可能会在右边高估Q值，一旦进行多轮动态规划，这种误差会通过整个状态空间传播并累积。","start":2733.9,"end":2750.24},{"id":143,"text":"Let me clarify a little bit. What I mean here by an error or an overestimation is actually in the Q function and not in the actions that were taken. Let's assume that we can enumerate all actions. We're in the discrete space that we're working in. And we look at the value for each of them. What the failure case I'm describing here is what the difference is between...","zh":"让我再澄清一下。我在这里所说的误差或高估实际上是指Q函数中的误差，而不是所采取的动作。假设我们可以枚举所有的动作。我们处于一个离散的空间中。我们检查每个动作对应的值。我在这里描述的失败情况是指……","start":2751.24,"end":2772.7}],"notes":["本段讨论了在Q学习中，当Q函数估计存在噪声时，这种噪声如何从右侧目标值传递到左侧的Q值估计。这可能导致Q值被高估，进而影响学习效果。","讲者指出，即使噪声是零均值的，经过一次更新后，左侧的噪声均值可能变为正，从而导致Q值的系统性高估。","讲者强调，主要的担忧来自于建模误差，因为这些误差在多次动态规划迭代中会累积并传播到整个状态空间。","讲者澄清了错误或高估的来源是Q函数本身，而不是采取的动作。在离散空间中，所有动作都可以枚举，并且需要比较每个动作的值。","讲者提到，如果考虑所有动作的真正目标值，可能会比只考虑部分动作时更高，因此这种高估问题可能并不总是存在。","讲者指出，当噪声存在于右侧目标值时，它会通过动态规划过程传播到左侧的Q值估计，从而导致整体的高估问题。"],"formulas":[],"uncertainties":["Q of S prime A hat"],"diagram":"none","start":2595.1,"end":2772.7,"asr_flags":[],"math_clarifications":["所有公式均为自然语言描述，未提供明确的数学表达式，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2595.1,"text":"And what happens essentially if we have some noise in our Q function when we try to learn it in this way? And this is what we're basically going to look at. So essentially when we are like parametrizing this Q function as a neural network, there can be noise in the estimation that we kind of incur."},{"start":2614.2,"text":"We're going to denote our Q function currently as approximate, which is the learned parameterization, and Q target here is the optimal Q function or the true underlying Q function. We're now also going to introduce this y parameter here that denotes some amount of noise that might be present due to things like modeling errors."},{"start":2639.57,"text":"And what we'll kind of see is that if there is noise on the right-hand side when we're trying to predict the target, this actually transfers pretty badly to the left-hand side. So what we're actually looking at here on the left-hand side is kind of what would the Q values look like after one step of iteration? And how does that differ from the true target value? So Q of S prime A hat is going to be basically"},{"start":2667.93,"text":"what we see on the right-hand side there, and QTarget is what the true value would be. And what we're going to see here is that if we define even a noise that is a zero mean, eventually the noise on the left-hand side, which is going to be after one step of update, will have a positive mean, leading to our Q values to be sort of overestimated."},{"start":2692.34,"text":"So this results in us having to deal with this overestimation issue when we're trying to learn our critics. I think one thing that I mentioned here is that we're going to do a maximization over actions. There could be issues, for example, with sampling as well. Actually, I don't think that's necessarily the case."},{"start":2718.23,"text":"your true target value over all actions might be actually higher in that case than if you only look at a subset of your total actions. So in that case, then this property would not necessarily be an issue."},{"start":2733.9,"text":"I think the main concern actually just comes from modeling errors, because in some cases you might actually overestimate your Q value on the right, and once you do multiple rounds of dynamic programming, this error will propagate through your entire state space and will compound, essentially."},{"start":2751.24,"text":"Let me clarify a little bit. What I mean here by an error or an overestimation is actually in the Q function and not in the actions that were taken. Let's assume that we can enumerate all actions. We're in the discrete space that we're working in. And we look at the value for each of them. What the failure case I'm describing here is what the difference is between..."}],"speech_gaps":[],"frame":"../frames/v037/016.webp","frame_time":2607.1},{"title":"Q学习中的过估计问题与解决方法","segments":[{"id":144,"text":"the Q function that we're learning versus the true or optimal Q function or Q star. And what can happen is that your Q function can be incorrectly modeled. Maybe due to some noise, it's higher than what the true target actually is. And what I'm saying is that even if that noise has zero mean, when you do these dynamic programming updates, it propagates to the left-hand side and allows you to essentially get non-zero mean noise that's being added due to this max operation.","zh":"我们正在学习的Q函数与真实的或最优的Q函数或Q星之间存在差异。可能发生的情况是，你的Q函数被错误地建模了。这可能是由于某些噪声，使得它高于真实目标的实际值。我想说的是，即使这种噪声的均值为零，在进行这些动态规划更新时，它会传播到等式左边，并允许你实际上得到由于这个最大操作而被添加的非零均值噪声。","start":2773.16,"end":2802.14},{"id":145,"text":"And this essentially propagates through your entire state space and makes your Q values sort of blow up, resulting in this sort of overestimation. Actually, I was going to go through this a little bit later, but we can talk about it now. So imagine that this is our state space. Sorry, there are a lot of columns in this figure. And we can look at each step, what the value estimate sort of looks like.","zh":"这种现象会通过你的整个状态空间传播，并使你的Q值变得过大，从而导致这种过估计。实际上，我原本打算稍后详细讲解这一点，但现在我们可以讨论它。想象一下，这就是我们的状态空间。抱歉，这张图有很多列。我们可以查看每一步，价值估计看起来是什么样的。","start":2802.64,"end":2825.02},{"id":146,"text":"What I am showing in the second column here is the difference in the estimate and the max value the Q function can essentially have. So you can look at the left-hand side and it's essentially telling you what the max at the next time step could essentially be. And the third here kind of shows like what the difference is between the true value and the value that we want to learn.","zh":"我在这里第二列所展示的是估计值与Q函数可能拥有的最大值之间的差异。你可以查看左边，它基本上告诉你下一个时间步的最大值可能是什么。而第三列则大致展示了真实值与我们想要学习的值之间的差异。","start":2826.57,"end":2851.83},{"id":147,"text":"And if you look at this like red figure or which is typical Q-learning style algorithms, we can see that there's a huge error bar just because of the fact that we're overestimating what the true value can be, and we're propagating that through all of the states. I'll talk about how we essentially fix this.","zh":"如果你看一下这个红色的图，或者典型的Q学习风格的算法，我们可以看到，仅仅因为我们在估计真实值时存在过估计，这种误差就会通过所有状态传播，导致巨大的误差范围。我将讲解我们如何解决这个问题。","start":2852.3,"end":2879.82},{"id":148,"text":"And we can then...","zh":"然后我们可以","start":2880.52,"end":2882.0},{"id":149,"text":"use all of these ensemble of networks and minimize over the ensemble to kind of get an underestimate of what the Q value should essentially be. The reason that this sort of works is that you can imagine that when you initialize your network, they're initialized in different ways and kind of the errors that they will get across states is also going to be very different. So you can kind of reduce the uncertainty or remove these like modeling errors by ensembling and then doing something like a min reduction over all of them.","zh":"使用所有这些网络的集合，并在集合上进行最小化，以获得Q值应有的低估。这种做法之所以有效，是因为你可以想象，当你初始化网络时，它们以不同的方式初始化，它们在各个状态下的误差也会非常不同。因此，通过集成并进行类似所有网络上的最小化操作，你可以减少不确定性或消除这些建模误差。","start":2882.55,"end":2909.91},{"id":150,"text":"And this has been shown to be effective in works like double queue learning, which I'll show in the next slide, as well as things like offline RL, which we'll talk about later, where essentially you can kind of increase your ensemble size quite a lot. And the distribution shift is actually mitigated because of like ensembling pretty heavily and learning an underestimation of what the queue value should essentially be, removing you from like getting an overestimation due to things like noise.","zh":"这已经被证明在像双重队列学习这样的工作中是有效的，我将在下一张幻灯片中展示，以及像离线强化学习这样的方法，我们稍后会讨论，其中你可以相当显著地增加集成的规模。实际上，由于大量集成和学习队列值的低估，分布偏移问题得到了缓解，从而避免了由于噪声等因素导致的高估问题。","start":2911.35,"end":2938.33}],"notes":["本段讨论了Q学习中可能出现的过估计问题，即由于噪声的存在，即使噪声的均值为零，动态规划更新过程中也会导致非零均值的噪声传播，从而使得Q值被高估。这种过估计会通过整个状态空间传播，导致Q值的显著增加。","讲者提到，这种过估计问题可以通过使用多个网络（即critic ensembling）来解决。通过使用多个网络，可以估计Q函数的表征不确定性，并通过最小化这些网络的输出来获得Q值的低估。","这种方法在双Q学习（double Q-learning）和离线强化学习（offline RL）中已被证明是有效的。通过增加网络的数量，可以缓解分布偏移问题，并学习到更准确的Q值估计。","讲者还提到，这种过估计问题的根源在于max操作，它会放大噪声的影响。通过使用多个网络并进行最小化操作，可以减少这种噪声的影响，从而提高Q值估计的准确性。","在讲授过程中，讲者强调了过估计问题的严重性以及其对整个状态空间的影响，并提出了通过critic ensembling来解决这一问题的思路。","最后，讲者提到这种方法在实际应用中已被验证有效，特别是在处理噪声和分布偏移问题时，能够显著提高Q值估计的稳定性。"],"formulas":[],"uncertainties":["queue value"],"diagram":"none","start":2773.16,"end":2938.33,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2773.16,"text":"the Q function that we're learning versus the true or optimal Q function or Q star. And what can happen is that your Q function can be incorrectly modeled. Maybe due to some noise, it's higher than what the true target actually is. And what I'm saying is that even if that noise has zero mean, when you do these dynamic programming updates, it propagates to the left-hand side and allows you to essentially get non-zero mean noise that's being added due to this max operation."},{"start":2802.64,"text":"And this essentially propagates through your entire state space and makes your Q values sort of blow up, resulting in this sort of overestimation. Actually, I was going to go through this a little bit later, but we can talk about it now. So imagine that this is our state space. Sorry, there are a lot of columns in this figure. And we can look at each step, what the value estimate sort of looks like."},{"start":2826.57,"text":"What I am showing in the second column here is the difference in the estimate and the max value the Q function can essentially have. So you can look at the left-hand side and it's essentially telling you what the max at the next time step could essentially be. And the third here kind of shows like what the difference is between the true value and the value that we want to learn. And if you look at this like red figure or"},{"start":2852.3,"text":"which is typical Q-learning style algorithms, we can see that there's a huge error bar just because of the fact that we're overestimating what the true value can be, and we're propagating that through all of the states. I'll talk about how we essentially fix this. And one approach that people have taken is this notion of critic ensembling, where we want to estimate the epistemic uncertainty of our Q function using an ensemble of networks."},{"start":2880.52,"text":"And we can then..."},{"start":2882.55,"text":"use all of these ensemble of networks and minimize over the ensemble to kind of get an underestimate of what the Q value should essentially be. The reason that this sort of works is that you can imagine that when you initialize your network, they're initialized in different ways and kind of the errors that they will get across states is also going to be very different. So you can kind of reduce the uncertainty or remove these like modeling errors by ensembling and then doing something like a min reduction over all of them."},{"start":2911.35,"text":"And this has been shown to be effective in works like double queue learning, which I'll show in the next slide, as well as things like offline RL, which we'll talk about later, where essentially you can kind of increase your ensemble size quite a lot. And the distribution shift is actually mitigated because of like ensembling pretty heavily and learning an underestimation of what the queue value should essentially be, removing you from like getting an overestimation due to things like noise."}],"speech_gaps":[],"frame":"../frames/v037/017.webp","frame_time":2785.16},{"title":"Q学习回顾与双Q学习的稳定性分析","segments":[{"id":151,"text":"So the figure that I described essentially goes through exactly this. And this is from the double Q-learning paper. And like what we see is that in the figure on the right, despite the red one, red curve here, which is like standard Q-learning having very large errors, just having ensemble size of two or doing double Q-learning allows you to kind of mitigate a lot of these overestimation errors for Q-learning and makes things a lot stable.","zh":"我所描述的图基本上就是这个样子的。这是来自双Q学习论文的图。我们可以看到，在右边的图中，尽管红色曲线代表标准Q学习，其误差非常大，但仅仅使用两个样本或进行双Q学习就可以在很大程度上缓解Q学习中的过估计误差，使结果更加稳定。","start":2939.98,"end":2964.54},{"id":152,"text":"So for online Q-learning algorithms, you can get away with just doing two. And for most intents and purposes, that works really well and beyond that kind of saturates. But you can definitely try to increase that for things like offline reinforcement learning, where kind of the problem setting that you're looking at there is that you have a static data set that you're sort of working with. And any errors that happen because you leave the support of your current state or action distribution allows your model to propagate these errors even more. So there, I think,","zh":"对于在线Q学习算法，只需使用两个样本就可以解决问题。在大多数情况下，这种方法效果非常好，但超过一定数量后效果会趋于饱和。不过，对于离线强化学习等场景，你可以尝试增加样本数量。因为在离线强化学习中，你面对的问题设置是静态数据集，你所处理的数据是固定的。任何由于超出当前状态或动作分布支持范围而产生的误差，都会被你的模型进一步传播。因此，我认为，","start":2965.93,"end":2995.21},{"id":153,"text":"being very careful about the distribution that you're in kind of matters a lot. And you can increase the ensemble size for like approaches like EDAC or SACN, for example, that do this.","zh":"你所处的分布情况非常重要。例如，在EDAC或SACN等方法中，你可以增加样本数量来应对这种情况。","start":2995.27,"end":3004.71},{"id":154,"text":"There are ways that have been looking at this in the context of language for reward modeling, because in reward modeling, you're going to face similar effects with maybe overestimation, potentially, and that reduces performance. So there have been papers that have come out that just do things like LoRa or make sure that you share the network for a large portion of your network. You share a lot of the layers of your network and have linear adapters or something beyond that. And those are parameter-efficient ways to learn something like this.","zh":"在语言奖励建模的背景下，人们也研究过类似的问题，因为在奖励建模中，你可能会遇到类似的过估计效应，这会降低性能。因此，已经有一些论文提出了类似LoRa的方法，或者确保你共享网络的大部分层。你共享网络的许多层，并使用线性适配器或其他方法。这些方法是参数高效的，可以用于学习类似的问题。","start":3005.52,"end":3032.92}],"notes":["本段主要回顾了Q学习的基本概念，并讨论了双Q学习在减少过估计误差方面的有效性。通过使用两个Q函数的集合，可以显著提高Q学习的稳定性，尤其是在在线强化学习中，使用两个Q函数已经足够有效。","在离线强化学习中，由于数据集是静态的，模型可能会在超出当前状态或动作分布的支持区域时传播误差。因此，需要特别注意分布的稳定性，并且可以通过增加集合大小来改善模型性能。","在语言建模和奖励建模中，类似的过估计问题也可能出现，从而影响模型性能。为此，一些研究提出了参数高效的解决方案，如LoRa，通过共享网络层并使用线性适配器来减少计算开销。","这些方法不仅适用于强化学习，还被扩展到其他领域，如自然语言处理，以解决类似的过估计问题。通过共享网络结构和使用适配器，可以在保持模型性能的同时减少参数数量。","双Q学习和参数高效的方法（如LoRa）都是应对过估计问题的有效策略，它们通过不同的机制来提高模型的稳定性和泛化能力。","在实际应用中，选择合适的集合大小和模型结构对于平衡模型性能和计算效率至关重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2939.98,"end":3032.92,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":4,"raw_segments":[{"start":2939.98,"text":"So the figure that I described essentially goes through exactly this. And this is from the double Q-learning paper. And like what we see is that in the figure on the right, despite the red one, red curve here, which is like standard Q-learning having very large errors, just having ensemble size of two or doing double Q-learning allows you to kind of mitigate a lot of these overestimation errors for Q-learning and makes things a lot stable."},{"start":2965.93,"text":"So for online Q-learning algorithms, you can get away with just doing two. And for most intents and purposes, that works really well and beyond that kind of saturates. But you can definitely try to increase that for things like offline reinforcement learning, where kind of the problem setting that you're looking at there is that you have a static data set that you're sort of working with. And any errors that happen because you leave the support of your current state or action distribution allows your model to propagate these errors even more. So there, I think,"},{"start":2995.27,"text":"being very careful about the distribution that you're in kind of matters a lot. And you can increase the ensemble size for like approaches like EDAC or SACN, for example, that do this."},{"start":3005.52,"text":"There are ways that have been looking at this in the context of language for reward modeling, because in reward modeling, you're going to face similar effects with maybe overestimation, potentially, and that reduces performance. So there have been papers that have come out that just do things like LoRa or make sure that you share the network for a large portion of your network. You share a lot of the layers of your network and have linear adapters or something beyond that. And those are parameter-efficient ways to learn something like this."}],"speech_gaps":[],"frame":"../frames/v037/018.webp","frame_time":2951.98}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v037.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){if(point.redraw_svg)return point.redraw_svg;let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>${point.visual_source?.verified?'原PPT提取与重绘':'讲解梳理 · 原PPT待核对'} · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p>${point.visual_source?.verified?`<section class="ppt-source"><h3>原PPT对照 · ${esc(point.visual_source.slide_number)}</h3><a href="${esc(point.visual_source.slide_image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.visual_source.slide_image)}" style="width:100%;border:1px solid #ccd9dd;border-radius:8px" alt="原PPT第${esc(point.visual_source.slide_number)}页"></a><p class="muted">已对照本讲视频 ${stamp(point.visual_source.video_time)} 的画面。<a href="${esc(point.visual_source.source_url)}" target="_blank" rel="noopener">原始讲义 PDF</a> · PDF 第 ${point.visual_source.pdf_page} 页</p><p><b>从原页提取：</b>${point.visual_source.items.map(esc).join('；')}</p></section>`:''}<div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(f=>'<p class="muted">'+esc(f.origin||'讲者讲述与既有整理')+'</p>'+formula(f)).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length,verified=data.pages.flatMap(p=>p.boards||[]).filter(b=>b.visual_source?.verified).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页含讲解画板 · '+verified+' 个已核对原PPT</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
