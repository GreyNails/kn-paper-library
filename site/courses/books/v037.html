</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Tutorial Session Q学习回顾（Review of Q-Learning） · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v037.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":true,"id":"v037","title":"Tutorial Session Q学习回顾（Review of Q-Learning）","course":"强化学习","pages":[{"title":"Q学习回顾（Review of Q-Learning）","segments":[{"id":0,"text":"My name is Aniket. I'm a TA here for CS224R, and I hope you guys are in the right place for the Q-learning lecture. So just as a general overview of what we're going to cover, we're going to start off by just doing a very, very brief overview of MDPs. Hopefully, at this point, you guys will be somewhat familiar with the notation. And then we're going to switch over to talking a little bit about a more...","zh":"我的名字是Aniket。我是CS224R课程的助教，希望你们都在Q学习讲座的正确地点。所以，作为一个总体的概述，我们将首先做一个非常、非常简短的MDP概述。希望此时你们对符号已经有所熟悉。然后我们将转而讨论一个更...","start":5.14,"end":30.48},{"id":1,"text":"the controlled or tabular problem where we're going to be looking at fitted Q iteration as an algorithm and how we can build up from the tabular setting to learn an effective Q function.","zh":"受控或表格问题，我们将探讨拟合Q迭代作为一种算法，以及如何从表格设置中构建，以学习一个有效的Q函数。","start":30.77,"end":41.67},{"id":2,"text":"And then we're going to move on to parametric Q learning, looking at the bias and various trade-off, learning from TD regression versus Monte Carlo rollouts. And then finally talk a little bit about some of the practical details that go into learning effective Q functions. So this includes things like the replay buffer that we just briefly chatted about, overestimation, and how to deal with the gradient effects of TD learning.","zh":"然后我们将继续讨论参数化Q学习，探讨偏差和各种权衡，从TD回归与蒙特卡洛展开中学习。最后，我们将简要讨论一些学习有效Q函数的实用细节。这包括我们刚刚简要讨论过的回放缓冲区、过估计以及如何处理TD学习的梯度效应。","start":42.75,"end":67.71},{"id":3,"text":"So an MDP or Markov decision process. So as you guys have been probably looking at in the last couple of lectures, we've kind of defined a kind of framework for us to look at RLS, where we have an agent on the right hand side that is interacting with an environment. And we define this framework of an MDP that's defined by a set of states and actions and also a transition dynamics function, which allows you to go from a certain state.","zh":"所以一个MDP或马尔可夫决策过程。正如你们在最近几节课中可能已经看到的，我们已经定义了一个框架来研究RLS，其中右侧有一个代理与环境进行交互。我们定义了一个MDP框架，它由一组状态和动作以及一个转移动力学函数组成，该函数允许你从某个状态","start":68.69,"end":95.81},{"id":4,"text":"take a particular action and go to the next state. You're also rewarded for a particular state in action that you take, as well as have different kind of metrics like the starting state, which tells you kind of where in the trajectory you're from, and things like the discount factor and horizon, which allow you to kind of encourage longer or shorter horizon trajectories where your horizon is the length of the trajectory.","zh":"采取特定动作并转移到下一个状态。你也会因为采取特定状态和动作而获得奖励，以及有不同种类的指标，如起始状态，它告诉你轨迹中的位置，以及折扣因子和地平线，这些可以鼓励更长或更短的地平线轨迹，其中地平线是轨迹的长度。","start":96.32,"end":121.66},{"id":5,"text":"In this lecture, we'll be talking a little bit about the grid world assignment. Sorry, this grid world problem on the top right, where we have this little robot that's trying to navigate to kind of this gem on the top right. And similar to kind of classes we've seen before, our goal is to maximize the expected return conditioned on a policy that we're trying to learn, where a policy is simply defined as a...","zh":"在本次课程中，我们将稍微谈谈网格世界作业的问题。抱歉，这是右上角的网格世界问题，其中有一个小机器人试图导航到右上角的宝石。这与我们之前见过的一些课程类似，我们的目标是最大化在尝试学习的策略下的期望回报，其中策略被简单地定义为...","start":123.18,"end":148.06},{"id":6,"text":"set of actions for each state in this tabular environment that should be taken to reach a particular goal. So in the past couple of lectures, we've been revisiting, looking at a certain set of objects, which we denote as value functions. So we'll start off by defining v pi of s, or a value function, that estimates the expected future reward when you start at a state s and follow your policy pi.","zh":"在该表格环境中，每个状态应采取的一组动作，以达到特定目标。在过去的几节课中，我们一直在回顾并查看一组特定的对象，我们将这些对象称为价值函数。因此，我们将首先定义 v^π(s)，或价值函数，它估计从状态 s 开始并遵循策略 π 时的期望未来奖励。","start":148.53,"end":174.39}],"notes":["本段介绍了课程将回顾Q学习的基本概念，并从MDP（马尔可夫决策过程）开始，讨论其在强化学习中的作用。讲者提到将从表格化问题（tabular problem）出发，介绍拟合Q迭代（fitted Q iteration）算法，以及如何从表格化设置扩展到学习有效的Q函数。","接下来，课程将讨论参数化Q学习，涉及偏差与各种权衡，以及从TD回归与蒙特卡洛展开（Monte Carlo rollouts）学习的比较。此外，还将涉及实际细节，如回放缓冲区（replay buffer）、过估计（overestimation）以及如何处理TD学习的梯度效应。","在MDP的定义中，讲者提到状态、动作、转移动态函数（transition dynamics function）以及奖励机制。状态和动作是环境的基本元素，转移动态函数允许从当前状态通过特定动作转移到下一个状态，同时奖励机制用于评估在特定状态和动作下的表现。","讲者还提到将讨论网格世界（grid world）问题，其中有一个小机器人试图导航到右上角的宝石。目标是最大化在给定策略下的预期回报，策略被定义为在表格化环境中每个状态应采取的动作集合。","最后，讲者提到将回顾价值函数（value functions）的概念，特别是vπ(s)，即从状态s开始并遵循策略π时的预期未来奖励。这为后续讨论Q函数和策略优化奠定了基础。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.14,"end":174.39,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.14,"text":"My name is Aniket. I'm a TA here for CS224R, and I hope you guys are in the right place for the Q-learning lecture. So just as a general overview of what we're going to cover, we're going to start off by just doing a very, very brief overview of MDPs. Hopefully, at this point, you guys will be somewhat familiar with the notation. And then we're going to switch over to talking a little bit about a more..."},{"start":30.77,"text":"the controlled or tabular problem where we're going to be looking at fitted queue iteration as an algorithm and how we can build up from the tabular setting to like learn an effective queue function."},{"start":42.75,"text":"And then we're going to move on to parametric Q learning, looking at the bias and various trade-off, learning from TD regression versus Monte Carlo rollouts. And then finally talk a little bit about some of the practical details that go into learning effective Q functions. So this includes things like the replay buffer that we just briefly chatted about, overestimation, and how to deal with the gradient effects of TD learning."},{"start":68.69,"text":"So an MDP or Markov decision process. So as you guys have been probably looking at in the last couple of lectures, we've kind of defined a kind of framework for us to look at RLS, where we have an agent on the right hand side that is interacting with an environment. And we define this framework of an MDP that's defined by a set of states and actions and also a transition dynamics function, which allows you to go from a certain state."},{"start":96.32,"text":"take a particular action and go to the next state. You're also rewarded for a particular state in action that you take, as well as have different kind of metrics like the starting state, which tells you kind of where in the trajectory you're from, and things like the discount factor and horizon, which allow you to kind of encourage longer or shorter horizon trajectories where your horizon is the length of the trajectory."},{"start":123.18,"text":"In this lecture, we'll be talking a little bit about the grid world assignment. Sorry, this grid world problem on the top right, where we have this little robot that's trying to navigate to kind of this gem on the top right. And similar to kind of classes we've seen before, our goal is to maximize the expected return conditioned on a policy that we're trying to learn, where a policy is simply defined as a..."},{"start":148.53,"text":"set of actions for each state in this tabular environment that should be taken to reach a particular goal. So in the past couple of lectures, we've been revisiting, looking at a certain set of objects, which we denote as value functions. So we'll start off by defining v pi of s, or a value function, that estimates the expected future reward when you start at a state s and follow your policy pi."}],"speech_gaps":[],"frame":"../frames/v037/001.webp","frame_time":17.14},{"title":"Q函数与贝尔曼方程回顾","segments":[{"id":7,"text":"We also have this other useful object called a Q function, where the distinction between a value function and a Q function is that now you additionally condition on an action and look at what the expected future reward looks like when you follow your policy.","zh":"我们还有一个有用的物体，称为Q函数，其中价值函数和Q函数的区别在于，现在你还会根据一个动作进行条件判断，并查看在遵循你的策略时，预期的未来奖励会是什么样子。","start":175.6,"end":189.16},{"id":8,"text":"Both of these quantities are kind of an estimate of how good either a current state is or a state and a particular action is to give you kind of guidance for your policy in terms of what actions I should potentially take.","zh":"这两个量在某种程度上都是对当前状态或某个特定动作下状态的好坏的估计，从而为你提供策略的指导，告诉你应该采取哪些潜在的动作。","start":191.22,"end":205.96},{"id":9,"text":"So if we look at, for example, a set of trajectories as seen here, your value function, which is only conditioned on a state, kind of estimates from a given state how well, if I follow my policy, will I do going forward. And a Q function gives you a little bit more information where you can kind of probe a particular action for like an immediate action that you can take and consider if I take this action versus another one, kind of what my value can sort of be.","zh":"例如，如果我们看一下这里看到的一组轨迹，价值函数仅根据状态进行条件判断，它估计从给定状态出发，如果遵循我的策略，我将如何表现。而Q函数则提供了一点额外的信息，你可以借此探测一个特定的动作，比如立即采取的动作，并考虑如果采取这个动作而不是另一个动作，我的价值会如何。","start":207.06,"end":234.66},{"id":10,"text":"And a useful relation to sort of know in this case is that your value function that you've learned on the left is like an expectation, the Q function that you'll learn on the right. Another useful quantity that you might have already seen is this notion of an advantage, which kind of estimates how useful it is to take a particular action A, then follow the policy at the current time step.","zh":"在这种情况下，一个有用的关联是，你左边学到的价值函数类似于一个期望值，而你右边学到的Q函数则是另一个有用的量，你可能已经见过这个概念，称为优势（advantage），它估计在当前时间步采取特定动作A并随后遵循策略的有用性。","start":235.88,"end":259.39},{"id":11,"text":"To kind of understand this, we kind of denote this, we define the advantage as the difference between the Q value and the value as seen on the bottom.","zh":"为了理解这一点，我们将其表示为，我们定义优势为Q值与底部看到的价值之间的差值。","start":261.41,"end":270.29},{"id":12,"text":"So to kind of explore how you can learn a Q function, we're going to go back to this tabular good world environment that we've been looking at and kind of see how we can learn a Q function through dynamic programming. So in class, you might have seen this Bellman equation as seen on this slide here, which is defined as the expected reward to go, where we look at the transition dynamics from a current state st.","zh":"为了探索如何学习Q函数，我们将回到我们一直在研究的表格式好世界环境，并看看如何通过动态规划学习Q函数。在课堂上，你可能已经见过这张幻灯片上的贝尔曼方程，它定义为预期的奖励，我们查看从当前状态st的转移动态。","start":275.66,"end":302.54},{"id":13,"text":"multiplied by the reward at the current time step when we take a particular action as well as the added to the max of the Q value at the next state. We can then convert this Bellman equation which gives you the optimal Q function into an iterative learning process where we are going to define our Q function at each time step as","zh":"当我们采取特定动作时，乘以当前时间步的奖励，并将该值加到下一状态的Q值最大值上。然后，我们可以将这个贝尔曼方程转换为一个迭代学习过程，在这个过程中，我们将在每个时间步定义我们的Q函数为","start":303.66,"end":327.72},{"id":14,"text":"iteratively starting from the queue time step at the previous time step and doing this same maximization procedure. So you'll start off with maybe an empty grid world, which is where your value function or queue function here is starting off at zeros at all steps.","zh":"从上一时间步的队列时间步开始迭代，并重复执行相同的最大化过程。因此，你可能会从一个空的网格世界开始，这是你的价值函数或队列函数在所有步骤中初始值为零的地方。","start":328.97,"end":344.51}],"notes":["本段讲解了Q函数与价值函数的区别，Q函数在价值函数的基础上进一步考虑了动作，用于评估在特定状态下采取特定动作的预期未来奖励。这为策略提供了更具体的指导。","Q函数与价值函数之间存在有用的关系，价值函数可以视为Q函数的期望值，而Q函数则提供了更详细的信息，允许对特定动作进行评估。","在讲解Q函数的学习方法时，课程回顾了贝尔曼方程，该方程用于定义最优Q函数，并将其转化为迭代学习过程。贝尔曼方程包括当前时间步的奖励和下一状态的Q值最大值。","课程提到，学习Q函数的过程从一个空的网格世界开始，初始的Q函数在所有步骤中都为零，这为后续的动态规划学习提供了起点。","贝尔曼方程的迭代过程从上一时间步的Q值开始，通过重复最大化过程逐步更新Q值，从而学习到最优策略。","课程强调了Q函数在强化学习中的重要性，它不仅提供了状态的价值，还提供了在特定状态下采取特定动作的价值，从而帮助策略选择更优的动作。"],"formulas":[],"uncertainties":["queue time step 可能是 'current time step' 的误听"],"diagram":"none","start":175.6,"end":344.51,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":175.6,"text":"We also have this other useful object called a Q function, where the distinction between a value function and a Q function is that now you additionally condition on an action and look at what the expected future reward looks like when you follow your policy."},{"start":191.22,"text":"Both of these quantities are kind of an estimate of how good either a current state is or a state and a particular action is to give you kind of guidance for your policy in terms of what actions I should potentially take."},{"start":207.06,"text":"So if we look at, for example, a set of trajectories as seen here, your value function, which is only conditioned on a state, kind of estimates from a given state how well, if I follow my policy, will I do going forward. And a Q function gives you a little bit more information where you can kind of probe a particular action for like an immediate action that you can take and consider if I take this action versus another one, kind of what my value can sort of be."},{"start":235.88,"text":"And a useful relation to sort of know in this case is that your value function that you've learned on the left is like an expectation, the Q function that you'll learn on the right. Another useful quantity that you might have already seen is this notion of an advantage, which kind of estimates how useful it is to take a particular action A, then follow the policy at the current time step."},{"start":261.41,"text":"To kind of understand this, we kind of denote this, we define the advantage as the difference between the Q value and the value as seen on the bottom."},{"start":275.66,"text":"So to kind of explore how you can learn a Q function, we're going to go back to this tabular good world environment that we've been looking at and kind of see how we can learn a Q function through dynamic programming. So in class, you might have seen this Bellman equation as seen on this slide here, which is defined as the expected reward to go, where we look at the transition dynamics from a current state st."},{"start":303.66,"text":"multiplied by the reward at the current time step when we take a particular action as well as the added to the max of the Q value at the next state. We can then convert this Bellman equation which gives you the optimal Q function into an iterative learning process where we are going to define our Q function at each time step as"},{"start":328.97,"text":"iteratively starting from the queue time step at the previous time step and doing this same maximization procedure. So you'll start off with maybe an empty grid world, which is where your value function or queue function here is starting off at zeros at all steps."}],"speech_gaps":[],"frame":"../frames/v037/002.webp","frame_time":187.6},{"title":"Q学习回顾（Review of Q-Learning）","segments":[{"id":15,"text":"And then you'll iteratively, starting from your terminal states, propagate reward from your terminal states back to all states within your grid world. So we'll see pictorially how that will happen. But this is like an iterative process that allows you to propagate value from any state to any terminal state to all states within your grid world. This is kind of the foundation of TD learning or Q learning in general.","zh":"然后，你将从终端状态开始，迭代地将奖励从终端状态传播到网格世界中的所有状态。我们将通过图像来展示这一过程。这是一种迭代过程，允许你将价值从任何状态传播到任何终端状态，进而传播到网格世界中的所有状态。这基本上是TD学习或Q学习的基础。","start":345.32,"end":370.18},{"id":16,"text":"is how we'll sort of visualize this in the next couple of slides. So in this grid-world environment that we're going to look at, we're going to have, again, this robot that's in this toy environment where it can have five different actions that it can take at every step. It can either stay in its current spot, move left, move right, move up, or move down.","zh":"接下来几张幻灯片中，我们将以这种方式来可视化这一过程。在我们即将观察的网格世界环境中，我们将再次看到一个机器人，它处于一个玩具环境中，每一步可以采取五个不同的动作。它可以留在当前位置，向左、向右、向上或向下移动。","start":371.53,"end":392.59},{"id":17,"text":"And we're going to be rewarding it if it lands in the top right square and penalizing it with a negative value if it lands in the square in the middle up here. Additionally, we have this notion of a discount factor to allow us to kind of encourage the robot to reach the goal state as quickly as it can and not do like spurious exploration.","zh":"如果机器人落在右上角的方块中，我们将给予它奖励；如果它落在中间上方的方块中，我们将对其进行惩罚，给予一个负值。此外，我们还引入了一个折扣因子的概念，以鼓励机器人尽可能快地到达目标状态，而不是进行无意义的探索。","start":393.42,"end":419.9},{"id":18,"text":"So we'll start off with the Q value function defined as the right here, where for every state, it's essentially going to be zero, except for the terminal states on the top right-hand side, where for the top right corner, it is plus one because it gets a plus one reward when you terminate there, and negative one for this lava square.","zh":"我们将从这里定义Q值函数开始，其中对于每个状态，其值基本上为零，除了右上角的终端状态。右上角的角落值为加一，因为当终止于此处时会获得加一的奖励，而中间的熔岩方块则为负一。","start":421.13,"end":442.89},{"id":19,"text":"And we can then run this propagation for the Q value over multiple iterations. And what we'll see is that in time step two, the sort of states very close to the top right seem to now get Q values due to their propagation. And eventually over multiple iterations, we're able to fill up the grid, leading us to like stable convergence over a Q function.","zh":"然后，我们可以在多个迭代中运行这个Q值的传播过程。我们会看到，在时间步长为二时，靠近右上角的状态似乎已经因为传播而获得了Q值。经过多次迭代后，我们能够填充整个网格，从而实现Q函数的稳定收敛。","start":445.48,"end":469.4},{"id":20,"text":"the difference between the Bauman equation and this equation? Yeah, that's a really good point. So let me go back to where I defined that. Sorry. So the Bauman equation here, as you can see on the top, has no subscript denoting what iteration you're kind of updating the policy. And all it's saying is that for the optimal policy, this relation will hold.","zh":"巴曼方程和这个方程之间的区别是什么？是的，这是一个非常好的问题。让我回到我定义该方程的地方。抱歉。这里的巴曼方程，如你所见，在顶部没有下标表示你正在更新策略的哪一次迭代。它只是在说，对于最优策略，这种关系将成立。","start":471.91,"end":499.05},{"id":21,"text":"And then kind of a natural derivation from there is that you can kind of do this iteratively, where you start from your terminal states, which already have a given reward, and you know what that would sort of be, and propagate information from that point to then learn the true Q function at every single state and action in your state space.","zh":"然后，从那里自然地推导出一种方法，即你可以迭代地进行这一过程，从终端状态开始，这些状态已经有给定的奖励，你已经知道这些奖励大致是什么，然后从这一点传播信息，从而在状态空间中的每一个状态和动作上学习真实的Q函数。","start":499.83,"end":524.91}],"notes":["本段讲解了Q学习的基本思想，即从终端状态开始，通过迭代传播奖励值，逐步计算每个状态和动作的Q值。这种传播过程是Q学习的核心，允许算法从终端状态向所有状态传播价值，从而学习到整个状态空间的Q函数。","课堂中提到的机器人环境包含五个可能的动作：保持原地、左移、右移、上移和下移。奖励机制设计为在右上角的终止状态给予+1奖励，而在中间的“熔岩”状态给予-1惩罚，这有助于引导机器人快速到达目标状态。","折扣因子（discount factor）被用来鼓励机器人尽快到达目标状态，避免不必要的探索。这一机制确保了算法在长期回报上的优化，而不是仅仅关注即时奖励。","Q值函数的初始定义中，所有非终端状态的Q值为0，而终端状态的Q值则根据其奖励进行设定。例如，右上角的终止状态Q值为+1，而熔岩状态的Q值为-1。","通过多次迭代传播，Q值会逐渐填充整个网格世界，最终达到稳定收敛。这一过程展示了Q学习如何逐步逼近最优策略。","课堂中提到的Bauman方程与当前讨论的Q学习方程存在差异，前者未标明迭代次数，而后者则强调了迭代更新过程，这反映了Q学习中策略迭代的特性。"],"formulas":[],"uncertainties":["Bauman equation的具体内容未被明确提及，因此无法确认其与Q学习方程的差异"],"diagram":"none","start":345.32,"end":524.91,"asr_flags":[],"math_clarifications":["原文中未提供具体的数学公式，仅描述了Q值函数、奖励函数和Q值函数的递归关系的概念，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":345.32,"text":"And then you'll iteratively, starting from your terminal states, propagate reward from your terminal states back to all states within your grid world. So we'll see pictorially how that will happen. But this is like an iterative process that allows you to propagate value from any state to any terminal state to all states within your grid world. This is kind of the foundation of TD learning or Q learning in general."},{"start":371.53,"text":"is how we'll sort of visualize this in the next couple of slides. So in this grid-world environment that we're going to look at, we're going to have, again, this robot that's in this toy environment where it can have five different actions that it can take at every step. It can either stay in its current spot, move left, move right, move up, or move down."},{"start":393.42,"text":"And we're going to be rewarding it if it lands in the top right square and penalizing it with a negative value if it lands in the square in the middle up here. Additionally, we have this notion of a discount factor to allow us to kind of encourage the robot to reach the goal state as quickly as it can and not do like spurious exploration."},{"start":421.13,"text":"So we'll start off with the Q value function defined as the right here, where for every state, it's essentially going to be zero, except for the terminal states on the top right-hand side, where for the top right corner, it is plus one because it gets a plus one reward when you terminate there, and negative one for this lava square."},{"start":445.48,"text":"And we can then run this propagation for the Q value over multiple iterations. And what we'll see is that in time step two, the sort of states very close to the top right seem to now get Q values due to their propagation. And eventually over multiple iterations, we're able to fill up the grid, leading us to like stable convergence over a Q function."},{"start":471.91,"text":"the difference between the Bauman equation and this equation? Yeah, that's a really good point. So let me go back to where I defined that. Sorry. So the Bauman equation here, as you can see on the top, has no subscript denoting what iteration you're kind of updating the policy. And all it's saying is that for the optimal policy, this relation will hold."},{"start":499.83,"text":"And then kind of a natural derivation from there is that you can kind of do this iteratively, where you start from your terminal states, which already have a given reward, and you know what that would sort of be, and propagate information from that point to then learn the true queue function at every single state and action in your state space."}],"speech_gaps":[],"frame":"../frames/v037/003.webp","frame_time":357.32},{"title":"Q学习回顾与动态规划算法","segments":[{"id":22,"text":"So this is now going to have a subscript k plus one or k that represents what iteration you're going to be looking at for each step. I guess the question or clarification was which one of these is like Monte Carlo or...","zh":"因此，现在这个将会带有下标 k 加 1 或 k，表示你在每个步骤中查看的是哪一次迭代。我想问题或澄清是，这些之中哪一个类似于蒙特卡洛方法或……","start":525.96,"end":540.56},{"id":23,"text":"dynamic programming. So right now we're going to be looking at a dynamic programming algorithm. And a quick way to sanity check that or get a heuristic sense of that is that if you see the Q function on both sides of your update, that will generally be a dynamic programming style of algorithm. Whereas for a Monte Carlo, you will sort of see strictly only rewards, at least for the Q learning updates and value function updates.","zh":"动态规划。现在我们将关注一个动态规划算法。快速进行合理性检查或获得启发式理解的一种方法是，如果你在更新的两边都看到 Q 函数，这通常会是一个动态规划风格的算法。而对于蒙特卡洛方法，你会看到严格只有奖励，至少在 Q 学习更新和价值函数更新中是这样。","start":542.1,"end":570.22},{"id":24,"text":"But right now, we're looking at a dynamic programming algorithm, and that is why we kind of start from these terminal states, as we see here on the right, and we then propagate value to all states within our grid.","zh":"但现在，我们正在查看一个动态规划算法，这就是为什么我们会从这些终端状态开始，如右边所示，然后将价值传播到我们网格中的所有状态。","start":571.69,"end":584.81},{"id":25,"text":"I'll start off by saying that, is the state space here kind of clear?","zh":"我先说一下，这里的状态空间是否清楚？","start":586.07,"end":589.75},{"id":26,"text":"Okay.","zh":"好的。","start":590.25,"end":590.73},{"id":27,"text":"And the actions are going up, down, left, right, and stay.","zh":"并且动作是上、下、左、右和停留。","start":591.01,"end":594.39},{"id":28,"text":"So these are just denoting each of the five directions.","zh":"这些只是表示每个方向的五个方向。","start":595.77,"end":600.41},{"id":29,"text":"So the Q value for being at this state and going up is the top value, and going left is the value on the left there.","zh":"因此，在这个状态向上移动的 Q 值是顶部的值，向左移动的值是左边的值。","start":600.41,"end":609.95},{"id":30,"text":"Is the initial state of the Q function just like something you made up?","zh":"Q函数的初始状态是不是你随便设定的？","start":610.71,"end":616.33},{"id":31,"text":"The initial state of the Q function? No, it's not something that I've made up.","zh":"Q函数的初始状态？不，这不是我随便设定的。","start":616.97,"end":621.65},{"id":32,"text":"up. So generally, oh, sorry, I haven't defined this here, but Q0 is defined as all zeros for","zh":"up。所以一般来说，哦，抱歉，我在这里还没有定义这个，但在你的表格设置中，Q0被定义为所有状态的值都为零。","start":621.65,"end":629.33},{"id":33,"text":"all states in your tabular setting. So you generally typically initialize your Q function","zh":"因此，你通常会将Q函数初始化为零。然后Q1只是使用上面的公式进行一次更新。","start":629.33,"end":634.79},{"id":34,"text":"as zeros. And then Q1 is just a single update using the equation above. And the reason that","zh":"对于这些状态，奖励是加一和减一，这是因为这些是终止状态。","start":634.79,"end":642.07},{"id":35,"text":"for these states, the reward is plus one and minus one is because these are terminal states.","zh":"然后你在这些状态下采取的任何动作","start":642.07,"end":648.91},{"id":36,"text":"and then from any action that you take at these states","zh":"都会导致奖励的产生。","start":648.91,"end":651.79},{"id":37,"text":"will result in the reward.","zh":"将会导致奖励。","start":651.79,"end":653.45},{"id":38,"text":"And then, so this is iteration one,","zh":"然后，这就是第一次迭代，","start":654.67,"end":657.13},{"id":39,"text":"and from there we just do the dynamic programming update","zh":"然后我们就这样进行动态规划更新，","start":658.13,"end":661.23},{"id":40,"text":"as seen on the top,","zh":"如顶部所示，","start":661.23,"end":662.25},{"id":41,"text":"and we see that the value essentially propagates","zh":"我们可以看到价值基本上从顶部状态传播到网格中的任何其他状态。","start":662.35,"end":664.81},{"id":42,"text":"from the top state to any other state in our grid.","zh":"好的，所以在课堂上我们一直在讨论，嗯，","start":664.81,"end":667.39},{"id":43,"text":"Alrighty. So in the class we've been discussing, um,","zh":"像符号这样的东西你可能感到有点被压垮了。因此，我想澄清一些你可能见过的量，并谈谈它们如何与我们一直在探索的当前网格角色相关。这里左上角，即V(S)，将是不依赖于动作的价值函数。你可以看到，对于每个状态，我们都会为其分配一个值。","start":668.62,"end":673.45},{"id":44,"text":"like notation is something that you probably are maybe getting overwhelmed with. So I want to maybe clarify a few different quantities that you might have seen and talk about how it relates to the current grid roles that we've been sort of exploring. So the top left here, which is V of S, is going to be the value function that is unconditional on the actions. And you can see that for every state, we kind of assign it.","zh":"像这样的符号可能是你可能感到有些困惑的地方。因此，我想澄清一些你可能见过的不同量，并谈谈它们与我们一直在探索的当前网格角色之间的关系。这里左上角的V(S)，将是不依赖于动作的值函数，你可以看到对于每一个状态，我们都会为其分配一个值。","start":674.48,"end":700.78}],"notes":["本段主要回顾了Q学习中的动态规划算法，强调了Q函数在更新过程中的作用。动态规划算法的特点是Q函数出现在更新的两边，而蒙特卡洛方法则只涉及奖励。课堂中还提到，动态规划算法从终端状态开始，将价值传播到所有状态。","课堂中讨论了状态空间和动作空间，其中动作包括上、下、左、右和停留。Q值表示在特定状态下采取特定动作的价值，例如上方向对应顶部的值，左方向对应左侧的值。","初始Q函数通常被初始化为零，这是在表格设置中的常见做法。Q0表示初始状态，而Q1是通过更新方程进行一次更新后的结果。终端状态的奖励为+1和-1，因为这些状态是终止状态。","课堂中还提到，动态规划更新过程从迭代一开始，将价值从顶部状态传播到网格中的其他状态。这展示了动态规划算法如何逐步更新所有状态的价值。","最后，讲者提到符号和表示可能让学习者感到困惑，因此需要澄清一些概念。例如，V(S)表示不依赖于动作的价值函数，而Q函数则依赖于状态和动作的组合。","课堂中通过具体的例子和图示帮助学生理解动态规划算法的运作方式，强调了Q函数在更新过程中的关键作用，以及如何从终端状态开始传播价值。"],"formulas":[],"uncertainties":[],"diagram":"none","start":525.96,"end":700.78,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":525.96,"text":"So this is now going to have a subscript k plus one or k that represents what iteration you're going to be looking at for each step. I guess the question or clarification was which one of these is like Monte Carlo or..."},{"start":542.1,"text":"dynamic programming. So right now we're going to be looking at a dynamic programming algorithm. And a quick way to sanity check that or get a heuristic sense of that is that if you see the Q function on both sides of your update, that will generally be a dynamic programming style of algorithm. Whereas for a Monte Carlo, you will sort of see strictly only rewards, at least for the Q learning updates and value function updates."},{"start":571.69,"text":"But right now, we're looking at a dynamic programming algorithm, and that is why we kind of start from these terminal states, as we see here on the right, and we then propagate value to all states within our grid."},{"start":586.07,"text":"I'll start off by saying that, is the state space here kind of clear?"},{"start":590.25,"text":"Okay."},{"start":591.01,"text":"And the actions are going up, down, left, right, and stay."},{"start":595.77,"text":"So these are just denoting each of the five directions."},{"start":600.41,"text":"So the Q value for being at this state and going up is the top value, and going left is the value on the left there."},{"start":610.71,"text":"Is the initial state of the Q function just like something you made up?"},{"start":616.97,"text":"The initial state of the Q function? No, it's not something that I've made up."},{"start":621.65,"text":"up. So generally, oh, sorry, I haven't defined this here, but Q0 is defined as all zeros for"},{"start":629.33,"text":"all states in your tabular setting. So you generally typically initialize your Q function"},{"start":634.79,"text":"as zeros. And then Q1 is just a single update using the equation above. And the reason that"},{"start":642.07,"text":"for these states, the reward is plus one and minus one is because these are terminal states."},{"start":648.91,"text":"and then from any action that you take at these states"},{"start":651.79,"text":"will result in the reward."},{"start":654.67,"text":"And then, so this is iteration one,"},{"start":658.13,"text":"and from there we just do the dynamic programming update"},{"start":661.23,"text":"as seen on the top,"},{"start":662.35,"text":"and we see that the value essentially propagates"},{"start":664.81,"text":"from the top state to any other state in our grid."},{"start":668.62,"text":"Alrighty. So in the class we've been discussing, um,"},{"start":674.48,"text":"like notation is something that you probably are maybe getting overwhelmed with. So I want to maybe clarify a few different quantities that you might have seen and talk about how it relates to the current grid roles that we've been sort of exploring. So the top left here, which is V of S, is going to be the value function that is unconditional on the actions. And you can see that for every state, we kind of assign it."}],"speech_gaps":[],"frame":"../frames/v037/004.webp","frame_time":537.96},{"title":"Q学习回顾与策略分析","segments":[{"id":45,"text":"a value. And we see that from the top right corner, which is the place where you get a reward, you essentially get a reward of plus one.","zh":"一个值。我们从右上角可以看到，那是你获得奖励的地方，你实际上获得了一个加一的奖励。","start":701.09,"end":710.37},{"id":46,"text":"And the discounting of 0.9 then applies for every state that is far away from it. So you can see that if you're one step away, you have a value of 0.9. If you're two steps, it would be 0.81, so on and so forth until you complete the full grid. Except for the lava state, you get a minus one reward for terminating. Additionally, there's the Q star.","zh":"然后折扣因子0.9会应用于每一个远离该点的状态。因此你可以看到，如果你离它一步远，你得到的值是0.9；如果你离它两步远，那将是0.81，依此类推，直到完成整个网格。除了熔岩状态，终止时你会得到一个减一的奖励。此外，还有Q星。","start":711.06,"end":735.38},{"id":47,"text":"which is the center thing that we were just looking at. And this is, you can either get this through convergence of the algorithm that we were just describing, or you can also calculate it analytically. Finally, there is the policy, and the policy is just going to be a deterministic.","zh":"这就是我们刚刚观察到的中心部分。你可以通过我们刚刚描述的算法的收敛来获得它，或者也可以通过解析计算得到它。最后，还有策略，而策略只是一个确定性的函数。","start":737.1,"end":754.91},{"id":48,"text":"function. That's primarily because for any MDP, without any partially observability, the policy is going to be a deterministic function that is defined as strictly the arcmax of the Q function. And as you can see here, it typically has a path towards the goal, and it's generally the shortest path for any state in your grid world. So these are all the optimal value, Q value, and policies.","zh":"这主要是因为对于任何MDP，如果没有部分可观测性，策略将是一个确定性的函数，它被定义为Q函数的严格argmax。你可以在这里看到，它通常有一条通向目标的路径，并且对于网格世界中的任何状态，它通常是该状态的最短路径。因此，这些都是最优值、Q值和策略。","start":756.42,"end":783.0},{"id":49,"text":"So I think, for me, looking at this, I think the policy is pretty much all I need. So what are the different advantages? Yeah, that's a good question. So you're saying that, okay, maybe these things seem really extra. I don't need to actually learn them. If I learn the policy, I'm going to be all good. That's a great question, and probably...","zh":"我觉得，从我来看，策略基本上就是我需要的全部。那么不同的优势是什么呢？是的，这是一个好问题。你是在说，也许这些看起来真的很多余。我实际上不需要去学习它们。如果我学习了策略，我就会很好。这是一个很好的问题，可能……","start":784.96,"end":808.62},{"id":50,"text":"worth thinking a little bit about. So what you can think about is that in this tabular domain, the way that we've extracted the policy is just by doing an argmax of our Q function. So we needed the Q function to sort of help us determine what are the values throughout the entire state space, and we were able to extract a policy from it.","zh":"值得花一点时间思考。你可以思考的是，在这个表格域中，我们提取策略的方式仅仅是通过对Q函数进行argmax。因此我们需要Q函数来帮助我们确定整个状态空间中的值，然后我们能够从它中提取出策略。","start":810.02,"end":830.26},{"id":51,"text":"There are also approaches that only utilize policy, such as policy gradient objectives, which you might have explored in the first couple of classes.","zh":"还有一些方法只利用策略，例如策略梯度目标，这可能你在前几节课中已经探讨过。","start":831.52,"end":839.98},{"id":52,"text":"but they do experience some amount of variance issues in your environment. We'll talk a little bit about this when we go to discuss the differences between Monte Carlo and TD. But essentially, once your environment ends up having a lot of variance, either in terms of the reward or the transition dynamics, that results in like...","zh":"但它们在你的环境中确实会经历一定程度的方差问题。当我们讨论蒙特卡洛方法和时序差分方法之间的差异时，我们会稍微谈谈这个问题。但基本上，一旦你的环境在奖励或转移动态方面具有很大的方差，就会导致类似...","start":840.97,"end":862.35}],"notes":["本段讲解了Q学习中的价值函数、折扣因子和策略的概念。价值函数通过折扣因子计算，例如距离奖励点越远，折扣后的价值越低。Q*表示最优Q值，可以通过算法收敛或解析计算得到。策略是确定性的，基于Q函数的argmax确定最优动作。","讲者提到在表格域中，策略是通过Q函数的argmax提取的，这需要先计算整个状态空间的价值。策略梯度方法仅使用策略，但可能面临环境方差问题，这将在后续讨论蒙特卡洛和TD方法时展开。","讲者强调策略的重要性，认为在某些情况下，仅学习策略就足够。然而，策略梯度方法可能因环境的奖励或转移动态的方差而产生问题，这需要进一步分析。","讲者提到策略是确定性的，因为对于任何MDP（无部分可观测性），策略是Q函数的argmax。这通常意味着策略会引导智能体沿着最短路径到达目标。","讲者指出，虽然策略是关键，但Q函数在提取策略时是必要的，因为它提供了整个状态空间的价值信息。","讲者提到策略梯度方法可能面临方差问题，这与环境的奖励或转移动态有关，这将在后续讨论蒙特卡洛和TD方法时进一步探讨。"],"formulas":[],"uncertainties":["arcmax"],"diagram":"none","start":701.09,"end":862.35,"asr_flags":[],"math_clarifications":["原文中未明确折扣因子的符号（通常为γ），且未明确状态价值的定义。公式中的'next reward'和'next next reward'等表述不严谨，应使用数学符号表示。","原文中未明确argmax的数学定义，且未说明Q函数的定义域和目标函数。'argmax'应使用数学符号表示，如\\arg\\max。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":701.09,"text":"a value. And we see that from the top right corner, which is the place where you get a reward, you essentially get a reward of plus one."},{"start":711.06,"text":"And the discounting of 0.9 then applies for every state that is far away from it. So you can see that if you're one step away, you have a value of 0.9. If you're two steps, it would be 0.81, so on and so forth until you complete the full grid. Except for the lava state, you get a minus one reward for terminating. Additionally, there's the Q star."},{"start":737.1,"text":"which is the center thing that we were just looking at. And this is, you can either get this through convergence of the algorithm that we were just describing, or you can also calculate it analytically. Finally, there is the policy, and the policy is just going to be a deterministic."},{"start":756.42,"text":"function. That's primarily because for any MDP, without any partially observability, the policy is going to be a deterministic function that is defined as strictly the arcmax of the Q function. And as you can see here, it typically has a path towards the goal, and it's generally the shortest path for any state in your grid world. So these are all the optimal value, Q value, and policies."},{"start":784.96,"text":"So I think, for me, looking at this, I think the policy is pretty much all I need. So what are the different advantages? Yeah, that's a good question. So you're saying that, okay, maybe these things seem really extra. I don't need to actually learn them. If I learn the policy, I'm going to be all good. That's a great question, and probably..."},{"start":810.02,"text":"worth thinking a little bit about. So what you can think about is that in this tabular domain, the way that we've extracted the policy is just by doing an argmax of our Q function. So we needed the Q function to sort of help us determine what are the values throughout the entire state space, and we were able to extract a policy from it."},{"start":831.52,"text":"There are also approaches that only utilize policy, such as policy gradient objectives, which you might have explored in the first couple of classes."},{"start":840.97,"text":"but they do experience some amount of variance issues in your environment. We'll talk a little bit about this when we go to discuss the differences between Monte Carlo and TD. But essentially, once your environment ends up having a lot of variance, either in terms of the reward or the transition dynamics, that results in like..."}],"speech_gaps":[],"frame":"../frames/v037/005.webp","frame_time":713.09},{"title":"Q学习回顾与优势函数概念","segments":[{"id":53,"text":"Policy gradient methods or Monte Carlo based methods to suffer a little bit because there's very high variance in your environment. So a Q value function can allow you to trade off that variance for bias and is like maybe another way to kind of deal with kind of those specific environment configurations.","zh":"策略梯度方法或基于蒙特卡洛的方法会受到一定影响，因为在环境中存在非常高的方差。因此，Q值函数可以让你在方差和偏差之间进行权衡，这可能是另一种处理特定环境配置的方法。","start":862.65,"end":886.07},{"id":54,"text":"So those are the optimal value, Q value, and policies. Additionally, as I discussed before, there's also a notion of an advantage, which gives us an estimate of how good a particular action is relative to the average action.","zh":"这些是最佳值、Q值和策略。此外，正如我之前讨论的，还有一个优势的概念，它为我们提供了一个估计，即某个特定动作相对于平均动作有多好。","start":887.21,"end":901.79},{"id":55,"text":"the action that your policy would essentially take. So for the optimal policy, the advantage should always be negative. And the reason for that is that your optimal policy, your policy is the optimal policy, so there's no action that's sort of better than it. And you can see this in the grid world on the right, where there are actions that are in red that go towards the lava state, for example, that are negative in nature.","zh":"这是你的策略实际上会采取的动作。因此，对于最佳策略，优势应该始终为负。原因在于，你的策略就是最佳策略，因此没有比它更好的动作。你可以在右边的网格世界中看到这一点，其中红色的动作指向熔岩状态，这些动作本质上是负的。","start":903.95,"end":927.23},{"id":56,"text":"And all of the actions that are from the policy are all going to have zero advantage because they're equivalent.","zh":"从策略中采取的所有动作都将具有零优势，因为它们是等效的。","start":927.89,"end":933.45},{"id":57,"text":"So, yes, the advantage is zero for actions from our current policy.","zh":"是的，我们当前策略采取的动作的优势为零。","start":934.57,"end":938.23},{"id":58,"text":"But for actions that are not from our current or from the optimal policy, they're going to be negative.","zh":"但对于不属于我们当前策略或最佳策略的动作，它们将为负。","start":938.49,"end":942.65},{"id":59,"text":"So that's why for every action that the optimal policy takes in the grid world on the top right, the advantage is going to be zero.","zh":"这就是为什么在右边的网格世界中，最佳策略采取的每个动作的优势都将为零。","start":943.75,"end":951.03},{"id":60,"text":"But for all other actions, the advantage will be negative because they can be worse performing than the optimal policy.","zh":"但对于所有其他动作，优势将是负的，因为它们可能比最佳策略表现得更差。","start":951.21,"end":956.95},{"id":61,"text":"because there could be, for example, two actions that lead to similar values,","zh":"因为可能存在这样的情况，例如，两个动作会导致相似的值","start":956.95,"end":960.79},{"id":62,"text":"which I think was an example, I think, in the state on 0, 0.","zh":"我认为这在状态(0, 0)上是一个例子","start":961.49,"end":971.41},{"id":63,"text":"So you can either go up or to the right from the state,","zh":"因此，你可以从该状态向上或向右移动","start":971.69,"end":974.77},{"id":64,"text":"and the advantage for both of them will be 0","zh":"这两个动作的优势值都会是0","start":974.87,"end":976.77},{"id":65,"text":"because they match to the optimal policy.","zh":"因为它们与最优策略相匹配","start":976.77,"end":978.63},{"id":66,"text":"But the optimal policy is deterministic,","zh":"但是最优策略是确定性的","start":979.61,"end":981.69},{"id":67,"text":"so you'll end up picking one of them as your policy.","zh":"因此，你会在这两个动作中选择其中一个作为你的策略","start":981.77,"end":984.31},{"id":68,"text":"see. So, so far we've been looking at the optimal policy, but what would it look like for your","zh":"看到。到目前为止，我们一直在讨论最优策略，但你的策略会是什么样子呢","start":984.31,"end":990.87},{"id":69,"text":"current policy or suboptimal one? So, here I'm going to show, again, Q star of SA and pi of A","zh":"当前策略或次优策略？因此，我将再次展示，Q星的SA和pi的A","start":990.87,"end":1000.03},{"id":70,"text":"given S and Q pi of SA and pi of A given S. So, as you can see, this is not a deterministic policy","zh":"给定S和Q pi的SA和pi的A给定S。因此，你可以看到，这不是一个确定性策略","start":1000.03,"end":1008.53},{"id":71,"text":"on the bottom, and in many cases actually does not lead you to the right","zh":"在底部，实际上在很多情况下并不会引导你采取正确的","start":1008.53,"end":1012.51},{"id":72,"text":"to the right set of actions to take. Sometimes even leading to like the lava state, for example. And we can see that here the Q function that's associated with it is also different from the optimal Q function. So you can learn a critic or Q function that is conditioned on a policy that tells you kind of","zh":"采取正确的一组动作。有时甚至会导致像熔岩状态这样的情况，例如。我们可以看到，这里的Q函数也与最优Q函数不同。因此，你可以学习一个评论家或Q函数，它依赖于一个策略，告诉你某种","start":1014.2,"end":1034.72}],"notes":["本段讲解了Q学习与策略梯度方法和蒙特卡洛方法的对比，指出Q值函数可以用来在方差和偏差之间进行权衡，从而应对特定环境配置。同时，介绍了优势函数的概念，即衡量特定动作相对于平均动作的优劣。","优势函数在最优策略下应始终为负，因为最优策略下没有比它更好的动作。在网格世界中，红色动作（如通往熔岩状态）具有负的优势，而来自当前策略的所有动作的优势为零，因为它们等价。","对于非当前或最优策略的动作，优势函数为负，因为它们可能不如最优策略表现好。例如，在状态(0,0)中，向上或向右的动作可能具有相似的值，但最优策略是确定性的，因此会从中选择一个作为策略。","当前策略或次优策略可能不是确定性的，因此可能导致错误的动作选择，例如进入熔岩状态。与最优Q函数相比，这些策略的Q函数也不同，因此可以学习一个基于策略的批评者或Q函数。"],"formulas":[{"latex":"A(s, a) = Q^*(s, a) - V^*(s)","symbols":"优势函数 = 最优Q值 - 最优状态值","explanation":"公式正确，优势函数定义为最优Q值与最优状态值的差，符合强化学习理论","evidence":"So those are the optimal value, Q value, and policies. Additionally, as I discussed before, there's also a notion of an advantage, which gives us an estimate of how good a particular action is relative to the average action."}],"uncertainties":["Q star of SA and pi of A given S"],"diagram":"none","start":862.65,"end":1034.72,"asr_flags":[],"math_clarifications":["公式0正确，优势函数定义为最优Q值与最优状态值的差，符合强化学习理论。其他公式未提供，无法核对。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":862.65,"text":"policy gradient methods or Monte Carlo based methods to suffer a little bit because there's very high variance in your environment. So a Q value function can allow you to trade off that variance for bias and is like maybe another way to kind of deal with kind of those specific environment configurations. So there are trade-offs to learning each of them and certain environment configurations allow you to learn a Q function better than others."},{"start":887.21,"text":"So those are the optimal value, Q value, and policies. Additionally, as I discussed before, there's also a notion of an advantage, which gives us an estimate of how good a particular action is relative to the average action."},{"start":903.95,"text":"the action that your policy would essentially take. So for the optimal policy, the advantage should always be negative. And the reason for that is that your optimal policy, your policy is the optimal policy, so there's no action that's sort of better than it. And you can see this in the grid world on the right, where there are actions that are in red that go towards the lava state, for example, that are negative in nature."},{"start":927.89,"text":"And all of the actions that are from the policy are all going to have zero advantage because they're equivalent."},{"start":934.57,"text":"So, yes, the advantage is zero for actions from our current policy."},{"start":938.49,"text":"But for actions that are not from our current or from the optimal policy, they're going to be negative."},{"start":943.75,"text":"So that's why for every action that the optimal policy takes in the grid world on the top right, the advantage is going to be zero."},{"start":951.21,"text":"But for all other actions, the advantage will be negative because they can be worse performing than the optimal policy."},{"start":956.95,"text":"because there could be, for example, two actions that lead to similar values,"},{"start":961.49,"text":"which I think was an example, I think, in the state on 0, 0."},{"start":971.69,"text":"So you can either go up or to the right from the state,"},{"start":974.87,"text":"and the advantage for both of them will be 0"},{"start":976.77,"text":"because they match to the optimal policy."},{"start":979.61,"text":"But the optimal policy is deterministic,"},{"start":981.77,"text":"so you'll end up picking one of them as your policy."},{"start":984.31,"text":"see. So, so far we've been looking at the optimal policy, but what would it look like for your"},{"start":990.87,"text":"current policy or suboptimal one? So, here I'm going to show, again, Q star of SA and pi of A"},{"start":1000.03,"text":"given S and Q pi of SA and pi of A given S. So, as you can see, this is not a deterministic policy"},{"start":1008.53,"text":"on the bottom, and in many cases actually does not lead you to the right"},{"start":1014.2,"text":"to the right set of actions to take. Sometimes even leading to like the lava state, for example. And we can see that here the Q function that's associated with it is also different from the optimal Q function. So you can learn a critic or Q function that is conditioned on a policy that tells you kind of"}],"speech_gaps":[],"frame":"../frames/v037/006.webp","frame_time":874.65},{"title":"Q学习回顾与价值函数表示","segments":[{"id":73,"text":"how close am I to the optimal policy and how can I improve using that? So if I wanted to learn an actor-critic style algorithm, for example, I could use this critic that's conditioned on a particular policy to tell me what are actions that might be better than the ones that I'm taking and use that to update the policy to then do one step of improvement.","zh":"我离最优策略有多远，以及如何利用这一点进行改进？例如，如果我想学习一个演员-评论家（actor-critic）风格的算法，我可以使用这个以特定策略为条件的评论家（critic），来告诉我哪些动作可能比我现在采取的动作更好，并利用这些信息来更新策略，从而进行一步改进。","start":1035.21,"end":1057.39},{"id":74,"text":"Q star, on the other hand, has been converged. So the optimal policy can no longer be updated because of that. This is just to kind of give you a sense of what the different notation sort of means. So Q pi just relates to the current policy, whereas Q star is the optimal one. If you guys would like to play around with some of these tabular environments, feel free to do so through the collab in the PDF that I shared.","zh":"另一方面，Q星（Q*）已经收敛。因此，最优策略无法再被更新。这只是为了让你大致了解不同符号的含义。Qπ与当前策略相关，而Q*是最佳策略。如果你们想在这些表格环境中进行一些实验，可以通过我分享的PDF中的Collab进行操作。","start":1058.43,"end":1083.55},{"id":75,"text":"We've been talking a little bit about these tabular environments, and it's great to play around with these grid roles and see how values and stuff propagate. But would something like this actually scale? And unfortunately, it doesn't seem to be the case, because a tabular value function, as your state or action space grows, will have thousands or millions of rows, and it will be really hard to learn that.","zh":"我们已经稍微讨论过这些表格环境，通过在网格角色中进行实验，观察值和相关量如何传播是非常有益的。但像这样的方法真的能扩展吗？不幸的是，似乎并非如此，因为随着状态或动作空间的增长，表格价值函数将会有成千上万甚至数百万行，学习起来将非常困难。","start":1084.7,"end":1107.42},{"id":76,"text":"Additionally, if you instead learn a parametric value function through like a neural network or something, you can allow for a kind of generalization to occur in a better way. So for example, if you have two states that are close to each other, either in a semantic sense or a literal sense, you would hope that their Q values are also very similar to each other. And this is like a property of smoothness that you get from the underlying representation that you've learned.","zh":"此外，如果你通过神经网络等方法学习一个参数化价值函数，就可以以更好的方式实现泛化。例如，如果你有两个状态在语义或字面意义上都很接近，你希望它们的Q值也非常相似。这种平滑性（smoothness）属性来自于你所学习的底层表示。","start":1108.59,"end":1133.51},{"id":77,"text":"And what we'll look at next is how to use regression techniques to learn a value function with a neural network in both continuous and discrete environments. So we'll go back to look at sort of these sort of figures on the right-hand side, where the first figure here is the value function that is not conditional on state. And this takes in as input the state and outputs a scalar, which is v pi of s. Additionally, there's now two types of...","zh":"接下来我们将探讨如何使用回归技术，通过神经网络在连续和离散环境中学习价值函数。我们将回到右侧的这些图表中，其中第一个图表是不依赖于状态的价值函数。它以状态作为输入，输出一个标量，即vπ(s)。此外，现在有两种类型的...","start":1134.99,"end":1162.69},{"id":78,"text":"Q functions that you'll look at. One is a continuous Q function, which takes in both a state and an action and outputs a scalar, as well as a discrete value function, which outputs for a given state a vector for all possible actions that you essentially have. To be fair, you could also use the left representation to learn the discrete Q value, but generally it's advisable to do this as long as your discrete space is tractable.","zh":"你将要研究的Q函数。一种是连续Q函数，它接受状态和动作作为输入，并输出一个标量；另一种是离散值函数，它对于给定的状态，输出一个向量，该向量对应于你所有可能的动作。公平地说，你也可以使用左侧的表示来学习离散的Q值，但只要你的离散空间是可处理的，通常建议这样做。","start":1162.94,"end":1191.88},{"id":79,"text":"because you have the ability to enumerate all actions in your space. Yeah, so there's a discrete Q function and a continuous Q function, but for the value function, it's kind of irrelevant to the action-like space, so there's only one general parameterization people use there.","zh":"因为你有能力枚举你在空间中的所有动作。是的，所以存在离散Q函数和连续Q函数，但对于值函数来说，它与动作空间的关系并不重要，因此在那里人们只使用一种通用的参数化方法。","start":1192.24,"end":1208.99}],"notes":["本段讨论了Q函数在离散和连续空间中的不同表示方式。讲者指出，离散Q函数需要枚举所有可能的动作，而连续Q函数则不需要。对于价值函数，其参数化方式与动作空间无关，因此通常只使用一种通用的参数化方式。","讲者提到，当动作空间是离散且可枚举时，可以使用离散Q函数，但通常建议使用连续Q函数，因为其更适用于大规模或连续动作空间。这反映了在强化学习中，选择合适的函数表示对于算法效率和可扩展性的重要性。","讲者强调了价值函数的参数化方式与动作空间无关，这表明在设计价值函数时，应关注状态空间的结构，而不是动作空间的类型。这种区分有助于理解不同强化学习算法的设计原理。","讲者提到，连续Q函数和离散Q函数在输入和输出上有所不同，前者需要同时输入状态和动作，而后者仅输入状态并输出所有可能动作的向量。这种差异反映了不同任务对函数表示的需求。","讲者指出，对于离散动作空间，虽然可以使用左图的表示方式，但通常建议使用右图的表示方式，因为右图更适用于连续或大规模动作空间。这说明了在实际应用中，选择合适的函数表示方式对算法性能有重要影响。","讲者最后提到，价值函数的参数化方式与动作空间无关，这表明在设计价值函数时，应关注状态空间的结构，而不是动作空间的类型。这种区分有助于理解不同强化学习算法的设计原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1035.21,"end":1208.99,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1035.21,"text":"how close am I to the optimal policy and how can I improve using that? So if I wanted to learn an actor-critic style algorithm, for example, I could use this critic that's conditioned on a particular policy to tell me what are actions that might be better than the ones that I'm taking and use that to update the policy to then do one step of improvement."},{"start":1058.43,"text":"Q star, on the other hand, has been converged. So the optimal policy can no longer be updated because of that. This is just to kind of give you a sense of what the different notation sort of means. So Q pi just relates to the current policy, whereas Q star is the optimal one. If you guys would like to play around with some of these tabular environments, feel free to do so through the collab in the PDF that I shared."},{"start":1084.7,"text":"We've been talking a little bit about these tabular environments, and it's great to play around with these grid roles and see how values and stuff propagate. But would something like this actually scale? And unfortunately, it doesn't seem to be the case, because a tabular value function, as your state or action space grows, will have thousands or millions of rows, and it will be really hard to learn that."},{"start":1108.59,"text":"Additionally, if you instead learn a parametric value function through like a neural network or something, you can allow for a kind of generalization to occur in a better way. So for example, if you have two states that are close to each other, either in a semantic sense or a literal sense, you would hope that their Q values are also very similar to each other. And this is like a property of smoothness that you get from the underlying representation that you've learned."},{"start":1134.99,"text":"And what we'll look at next is how to use regression techniques to learn a value function with a neural network in both continuous and discrete environments. So we'll go back to look at sort of these sort of figures on the right-hand side, where the first figure here is the value function that is not conditional on state. And this takes in as input the state and outputs a scalar, which is v pi of s. Additionally, there's now two types of..."},{"start":1162.94,"text":"Q functions that you'll look at. One is a continuous Q function, which takes in both a state and an action and outputs a scalar, as well as a discrete value function, which outputs for a given state a vector for all possible actions that you essentially have. To be fair, you could also use the left representation to learn the discrete Q value, but generally it's advisable to do this as long as your discrete space is tractable."},{"start":1192.24,"text":"because you have the ability to enumerate all actions in your space. Yeah, so there's a discrete queue function and a continuous queue function, but for the value function, it's kind of irrelevant to the action-like space, so there's only one general parameterization people use there."}],"speech_gaps":[],"frame":"../frames/v037/007.webp","frame_time":1047.21},{"title":"Q学习回顾（Review of Q-Learning）","segments":[{"id":80,"text":"So for the discrete Q function, what you can actually do is that you can predict the action, sorry, predict the Q value for all actions in your space. And then you can choose the particular one that you'd want to use. For example, let's say that there are four actions, like in the grid world that we had, like we had five actions. You can predict the Q value for like up, down, left, right, and stay.","zh":"因此，在离散的Q函数中，你可以实际做的是预测所有动作的Q值，然后选择你想要使用的特定动作。例如，假设存在四个动作，像我们在网格世界中那样，比如我们有五个动作。你可以预测上、下、左、右和停留这些动作的Q值。","start":1210.66,"end":1233.56},{"id":81,"text":"Whereas for a continuous space, it would be like really hard to enumerate all possible actions. So you generally take that as input instead. So in a continuous space, you typically condition on a action and output a scalar.","zh":"而对于连续空间，列举所有可能的动作会非常困难。因此，你通常将这些作为输入。在连续空间中，你通常根据一个动作进行条件建模，并输出一个标量。","start":1234.77,"end":1248.53},{"id":82,"text":"When you do an expectation calculation here, you typically sample actions from your policy in order to do so. We have this robotic policy, and you can see that we are predicting values for it at every single state. Whereas for a discrete case, you can output a value for each bin and then enumerate over all of them when you take an expectation.","zh":"当你在这里进行期望计算时，通常会从你的策略中采样动作来完成。我们有一个机器人策略，你可以看到我们在每个状态上都预测了值。而对于离散情况，你可以为每个区间输出一个值，然后在进行期望计算时遍历所有这些值。","start":1250.23,"end":1273.93},{"id":83,"text":"So an advantage of doing the bottom case is that if you're doing an expectation, you can kind of enumerate all actions and you'll get like an exact estimate of your expectation. Whereas on top, it's just a sample-based estimate. Alrighty, so let's dive a little bit into kind of how to actually do Q-learning as a regression problem. And I'll kind of use the whiteboard on the right here.","zh":"因此，进行底部情况的一个优势是，如果你在进行期望计算，你可以列举所有动作，并得到期望的精确估计。而顶部情况只是基于采样的估计。好的，那么让我们稍微深入探讨一下如何将Q学习作为回归问题来实际执行。我将在这里使用右侧的白板。","start":1275.11,"end":1298.27},{"id":84,"text":"So we're going to be working with basically v pi of s, and you can do a similar derivation for q of s as well. This is adapted from the Sutton and Bartow textbook.","zh":"我们将主要处理vπ(s)，你也可以对q(s)进行类似的推导。这是改编自Sutton和Bartow的教科书。","start":1299.58,"end":1312.0},{"id":85,"text":"So our value, as we've discussed, is going to be conditioned on a particular state, and it can be modeled or it represents the expected return to go from that particular state. So we're going to then write it now as an expectation under our policy pi of the return, RT, conditioned on our state S.","zh":"正如我们所讨论的，我们的值将基于特定状态进行条件建模，并且可以表示从该特定状态出发的预期回报。因此，我们现在将其写成在策略π下的期望值，条件在状态S上。","start":1313.69,"end":1340.53},{"id":86,"text":"So the return can be now kind of expanded a little bit to be equivalent to the sum of discounted rewards. So we're going to quickly do that. And this here is going to be... Sorry, I need to take into account k here. Gamma to the k.","zh":"因此，回报现在可以扩展为等价于折扣奖励的总和。我们将快速完成这一点。这里将是……抱歉，我需要考虑k。伽马的k次方。","start":1343.47,"end":1383.07}],"notes":["本段讲解了Q学习中返回值（return）的展开方式，指出返回值可以表示为折扣奖励的总和。讲者提到需要考虑k，这可能是指时间步k，用于计算折扣因子γ的幂次。"],"formulas":[],"uncertainties":["Gamma to the k"],"diagram":"none","start":1210.66,"end":1383.07,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1210.66,"text":"So for the discrete Q function, what you can actually do is that you can predict the action, sorry, predict the Q value for all actions in your space. And then you can choose the particular one that you'd want to use. For example, let's say that there are four actions, like in the grid world that we had, like we had five actions. You can predict the Q value for like up, down, left, right, and stay."},{"start":1234.77,"text":"Whereas for a continuous space, it would be like really hard to enumerate all possible actions. So you generally take that as input instead. So in a continuous space, you typically condition on a action and output a scalar."},{"start":1250.23,"text":"When you do an expectation calculation here, you typically sample actions from your policy in order to do so. We have this robotic policy, and you can see that we are predicting values for it at every single state. Whereas for a discrete case, you can output a value for each bin and then enumerate over all of them when you take an expectation."},{"start":1275.11,"text":"So an advantage of doing the bottom case is that if you're doing an expectation, you can kind of enumerate all actions and you'll get like an exact estimate of your expectation. Whereas on top, it's just a sample-based estimate. Alrighty, so let's dive a little bit into kind of how to actually do Q-learning as a regression problem. And I'll kind of use the whiteboard on the right here."},{"start":1299.58,"text":"So we're going to be working with basically v pi of s, and you can do a similar derivation for q of s as well. This is adapted from the Sutton and Bartow textbook."},{"start":1313.69,"text":"So our value, as we've discussed, is going to be conditioned on a particular state, and it can be modeled or it represents the expected return to go from that particular state. So we're going to then write it now as an expectation under our policy pi of the return, RT, conditioned on our state S."},{"start":1343.47,"text":"So the return can be now kind of expanded a little bit to be equivalent to the sum of discounted rewards. So we're going to quickly do that. And this here is going to be... Sorry, I need to take into account k here. Gamma to the k."}],"speech_gaps":[],"frame":"../frames/v037/008.webp","frame_time":1222.66},{"title":"Q学习回顾（Review of Q-Learning）","segments":[{"id":87,"text":"s_t plus k and a_t plus k given s_t equals s.","zh":"s_t 加 k 和 a_t 加 k 给定 s_t 等于 s。","start":1384.64,"end":1392.1},{"id":88,"text":"So what this is essentially saying is that from our current point in time, we're going to look at all of the rewards going forward, discount them by our discount factor, which is exponentiated according to how many times you are away from our current state, and look at what the summation of that would essentially be. This, as you asked about, is the Monte Carlo estimate of our value function, and it's denoted as a sum.","zh":"所以，这实际上是在说，从我们当前的时间点出发，我们会查看所有未来的奖励，通过我们的折扣因子进行折扣，这个折扣因子是根据我们当前状态与目标状态的距离的次数进行指数计算的，然后查看这些奖励的总和会是什么。正如你所问的，这就是我们价值函数的蒙特卡洛估计，它被表示为一个总和。","start":1394.28,"end":1423.06},{"id":89,"text":"So we can do now some algebra to convert this into a one-step TD estimate. And the way that we're going to do that is we're going to take this reward out of the summation here and kind of use it to go back to the value function definition that we'd had above. So the first thing that I'll do is that I'll remove R of STAT when k equals zero.","zh":"现在我们可以进行一些代数运算，将这个转换为一步的TD估计。我们将这样做：从这个总和中取出这个奖励，并使用它回到我们上面定义的价值函数。因此，我首先会做的是移除当k等于零时的R of STAT。","start":1424.97,"end":1451.79},{"id":90,"text":"and then also apply the discounting here. We're going to keep the summation again from k equals 0 to infinity, and now we're going to have one step of... we're going to have the summation again.","zh":"然后我们也会在这里应用折扣。我们将再次从k等于0到无穷大进行求和，现在我们将有一个步骤的……我们将再次进行求和。","start":1452.88,"end":1469.99},{"id":91,"text":"So this part on the right-hand side is just going to be an expansion. Sorry, this line here is just an expansion of the line above. We've just done some algebra so we can get it into a form similar to the MC definition that we have written above. And what you kind of notice here is that this looks a lot like a value function. But now instead of at the current state, it is going to be at the next state.","zh":"右边的这一部分只是一个展开。抱歉，这一行只是对上面一行的展开。我们已经进行了一些代数运算，以便将其转换为与我们上面写出的MC定义相似的形式。你可能会注意到，这看起来很像一个价值函数。但现在，它不是在当前状态，而是在下一个状态。","start":1487.6,"end":1512.84},{"id":92,"text":"So we can now write this as sort of the following. V of st plus one given st equals s. And by doing so, we have now arrived at our td function. So you might be asking, what is the difference between","zh":"因此，我们现在可以将其写成如下形式：V of st plus one given st equals s。通过这样做，我们现在到达了我们的TD函数。你可能会问，","start":1513.32,"end":1542.89},{"id":93,"text":"doing a Monte Carlo value estimate versus doing a TD estimate. And the main distinction here is that we're going to be representing the Monte Carlo estimate as the discounted sum of returns over our entire trajectory. So this is going to have no bias.","zh":"进行蒙特卡洛价值估计与进行TD估计有什么区别？主要的区别在于，我们将蒙特卡洛估计表示为我们整个轨迹上的折扣回报总和。因此，这将是没有偏差的。","start":1543.85,"end":1561.57}],"notes":["本段讲解了从蒙特卡洛估计转换为单步TD估计的过程。讲者提到，通过将奖励从求和中取出，并应用折扣因子，可以将无限求和转化为与当前状态相关的价值函数定义。这一步骤是将蒙特卡洛估计的无限求和形式转换为TD估计的关键。","讲者指出，转换后的表达式类似于价值函数，但此时是针对下一个状态而非当前状态。这表明TD估计的核心思想是利用当前状态和下一个状态之间的关系进行更新。","讲者进一步说明，蒙特卡洛估计是整个轨迹的折扣回报总和，因此没有偏差。而TD估计则通过单步更新来逼近价值函数，这使得它在计算上更高效，但可能引入偏差。","讲者提到，将奖励从求和中取出并应用折扣因子是转换过程中的关键步骤。这一步骤需要确保折扣因子的正确应用，以保持估计的准确性。","讲者强调，转换后的表达式与蒙特卡洛估计的定义相似，但形式上有所不同。这种差异反映了TD估计与蒙特卡洛估计在计算方法上的根本区别。","讲者最后提到，蒙特卡洛估计没有偏差，而TD估计可能有偏差。这表明在实际应用中，需要根据具体问题选择合适的估计方法。"],"formulas":[{"latex":"V(s_{t+1} \\mid s_t = s)","symbols":"V(s_{t+1} | s_t = s) 表示在当前状态 s_t = s 的情况下，下一个状态 s_{t+1} 的价值函数。","explanation":"公式正确表示了在当前状态 s_t = s 的情况下，下一个状态 s_{t+1} 的价值函数。","evidence":"So this part on the right-hand side is just going to be an expansion. Sorry, this line here is just an expansion of the line above. We've just done some algebra so we can get it into a form similar to the MC definition that we have written above. And what you kind of notice here is that this looks a lot like a value function. But now instead of at the current state, it is going to be at the next state."}],"uncertainties":["可能听不清的公式部分，如 'st plus k and at plus k given st equals s' 中的变量名称是否准确。"],"diagram":"none","start":1384.64,"end":1561.57,"asr_flags":[],"math_clarifications":["原始文本中未提供完整的数学公式，仅提及了 V(s_{t+1} | s_t = s) 的定义。因此，仅对已提供的公式进行校对，未发现明显错误。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1384.64,"text":"st plus k and at plus k given st equals s."},{"start":1394.28,"text":"So what this is essentially saying is that from our current point in time, we're going to look at all of the rewards going forward, discount them by our discount factor, which is exponentiated according to how many times you are away from our current state, and look at what the summation of that would essentially be. This, as you asked about, is the Monte Carlo estimate of our value function, and it's denoted as a sum."},{"start":1424.97,"text":"So we can do now some algebra to convert this into a one-step TD estimate. And the way that we're going to do that is we're going to take this reward out of the summation here and kind of use it to go back to the value function definition that we'd had above. So the first thing that I'll do is that I'll remove R of STAT when k equals zero."},{"start":1452.88,"text":"and then also apply the discounting here. We're going to keep the summation again from k equals 0 to infinity, and now we're going to have one step of... we're going to have the summation again."},{"start":1487.6,"text":"So this part on the right-hand side is just going to be an expansion. Sorry, this line here is just an expansion of the line above. We've just done some algebra so we can get it into a form similar to the MC definition that we have written above. And what you kind of notice here is that this looks a lot like a value function. But now instead of at the current state, it is going to be at the next state."},{"start":1513.32,"text":"So we can now write this as sort of the following. V of st plus one given st equals s. And by doing so, we have now arrived at our td function. So you might be asking, what is the difference between"},{"start":1543.85,"text":"doing a Monte Carlo value estimate versus doing a TD estimate. And the main distinction here is that we're going to be representing the Monte Carlo estimate as the discounted sum of returns over our entire trajectory. So this is going to have no bias."}],"speech_gaps":[],"frame":"../frames/v037/009.webp","frame_time":1396.64},{"title":"TD估计与n步回报的偏差-方差权衡","segments":[{"id":94,"text":"But instead here, when we look at the TD estimate, we're going to actually substitute our value function back in. And this is going to introduce some amount of bias because our value function here can be inaccurate, but it will reduce our variance because we're going to reduce the horizon of our trajectory. So we're going from like a horizon of H, which can be very, very large for a lot of problems to just the horizon of one. And this will reduce our variance significantly over the horizon.","zh":"但在这里，当我们查看TD估计时，我们将实际上将价值函数代入回去。这将引入一定量的偏差，因为此处的价值函数可能不准确，但会减少我们的方差，因为我们减少了轨迹的视界。因此，我们将从一个可能非常大的视界H，变为仅视界为1。这将在视界范围内显著减少我们的方差。","start":1562.88,"end":1589.14},{"id":95,"text":"So that is the TD learning estimate that we've described here. So notice here that k equals zero. So if I break up the summation into, let me just add this as a step below.","zh":"因此，这就是我们在这里描述的TD学习估计。请注意，这里k等于零。如果我将求和分解为，让我简单地添加这一步在下面。","start":1591.65,"end":1609.86},{"id":96,"text":"So if I look at the case where k equals 0, it's going to be r of st plus at plus the summation from k equals 1 to infinity of gamma to the k r of st plus k at plus k.","zh":"如果我查看k等于0的情况，它将是r的st加上at，加上从k等于1到无穷大的求和，gamma的k次方乘以r的st加上k at加上k。","start":1614.45,"end":1643.34},{"id":97,"text":"all given st equals s. Yeah, so that is how we remove that term. And you can just do some minor algebra to convert it from this step to the one on top.","zh":"所有这些都给定st等于s。是的，这就是我们如何去除该项。你可以通过一些简单的代数运算，将这一步转换为上面的那一步。","start":1644.76,"end":1656.81},{"id":98,"text":"So I'm going to quickly erase this, because I also want to talk about what an n-step return looks like. So right now, what we did is that we only expanded this once. But we can also do this expansion n times. And what this will allow us to do is to trade off between the bias and the variance. So the bias comes, again, from the value function parametrization. And the variance comes from the horizon of your trajectory, essentially.","zh":"我现在将快速擦除这个，因为我还想谈谈n步回报看起来是什么样子。目前，我们只进行了一次展开。但也可以进行n次这样的展开。这将使我们能够在偏差和方差之间进行权衡。偏差再次来自于价值函数的参数化，而方差则来自于轨迹的视界。","start":1657.64,"end":1684.86},{"id":99,"text":"As your reward function might be noisy or your transition dynamics might be noisy, you introduce a little bit of variance amongst all of the trajectories that you roll out. So let's look at what that would sort of be. I'm just going to quickly grab my iPad so I don't make a notation mistake.","zh":"由于你的奖励函数可能有噪声，或者你的转移动态可能有噪声，你将在所有展开的轨迹中引入一定量的方差。让我们看看这会是什么样子。我将快速拿起我的iPad，以免犯下记号错误。","start":1686.81,"end":1704.87}],"notes":["本段讲解了TD估计的推导过程，其中提到当k等于0时，TD估计可以表示为当前奖励加上从k=1到无穷大的γ^k乘以后续奖励的总和。这种形式通过代数运算可以转换为更简洁的表达式。","讲者指出，TD估计通过使用当前的值函数来替代完整的轨迹估计，从而引入了偏差，但显著降低了方差。这是因为轨迹的长度从H（可能非常大）缩短为1。","在讨论n步回报时，讲者提到可以将展开过程重复n次，从而在偏差和方差之间进行权衡。偏差来源于值函数的参数化，而方差则来源于轨迹的长度。","讲者进一步说明，由于奖励函数或转移动态可能具有噪声，所有展开的轨迹之间会引入一定的方差。这种方差是由于轨迹长度的不确定性导致的。","最后，讲者提到将使用iPad来避免记号错误，这表明在实际教学中，视觉辅助工具对于清晰表达数学概念非常重要。","整个段落强调了TD估计和n步回报在强化学习中的核心作用，即通过调整轨迹长度来平衡偏差和方差，从而优化学习过程。"],"formulas":[],"uncertainties":["可能无法准确识别出所有数学符号的完整形式，例如γ^k的正确表达方式"],"diagram":"none","start":1562.88,"end":1704.87,"asr_flags":[],"math_clarifications":["原文中提到的TD估计和n步回报的公式需要更精确的数学表达，包括明确的求和范围、条件和期望符号。当前公式缺少这些关键信息，无法准确表示数学含义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1562.88,"text":"But instead here, when we look at the TD estimate, we're going to actually substitute our value function back in. And this is going to introduce some amount of bias because our value function here can be inaccurate, but it will reduce our variance because we're going to reduce the horizon of our trajectory. So we're going from like a horizon of H, which can be very, very large for a lot of problems to just the horizon of one. And this will reduce our variance significantly over the horizon."},{"start":1591.65,"text":"So that is the TD learning estimate that we've described here. So notice here that k equals zero. So if I break up the summation into, let me just add this as a step below."},{"start":1614.45,"text":"So if I look at the case where k equals 0, it's going to be r of st plus at plus the summation from k equals 1 to infinity of gamma to the k r of st plus k at plus k."},{"start":1644.76,"text":"all given st equals s. Yeah, so that is how we remove that term. And you can just do some minor algebra to convert it from this step to the one on top."},{"start":1657.64,"text":"So I'm going to quickly erase this, because I also want to talk about what an n-step return looks like. So right now, what we did is that we only expanded this once. But we can also do this expansion n times. And what this will allow us to do is to trade off between the bias and the variance. So the bias comes, again, from the value function parametrization. And the variance comes from the horizon of your trajectory, essentially."},{"start":1686.81,"text":"As your reward function might be noisy or your transition dynamics might be noisy, you introduce a little bit of variance amongst all of the trajectories that you roll out. So let's look at what that would sort of be. I'm just going to quickly grab my iPad so I don't make a notation mistake."}],"speech_gaps":[],"frame":"../frames/v037/010.webp","frame_time":1574.88},{"title":"Q学习回顾与N步回报的讨论","segments":[{"id":100,"text":"So basically what we've done here is that we've done k steps of rolling out using the same expansion that we did for one step. And now our value function is discounted by k steps instead of one step. And we are now turning off between...","zh":"所以基本上我们在这里所做的就是执行了k步的展开，使用的是与一步展开相同的扩展方法。现在我们的价值函数被k步折扣，而不是一步折扣。我们现在关闭了……","start":1739.11,"end":1756.89},{"id":101,"text":"the Monte Carlo rollout, which is going to be the full discounted sum of rewards as well as this value function estimate that we do, allowing us to effectively trade off between TD and Monte Carlo. So let's take a look at how this would look in a visualization.","zh":"蒙特卡洛展开，这将是奖励的完整折扣总和，以及我们进行的价值函数估计，使我们能够有效地在TD和蒙特卡洛方法之间进行权衡。那么让我们看看这种可视化会是什么样子。","start":1757.35,"end":1775.43},{"id":102,"text":"So I'll put both of these up on the slides so we can compare one by one. But if you look at the left-hand side, what we're essentially doing is that from a particular state, we're going to let our policy roll out until it reaches a terminal state. And we're going to collect multiple of these rollouts to do essentially an update by...","zh":"我将在幻灯片上展示这两种方法，以便逐一进行比较。但如果你看左边，我们实际上是在某个特定状态下，让策略展开直到到达终止状态。然后我们收集多个这样的展开，以进行更新……","start":1776.78,"end":1795.46},{"id":103,"text":"collecting these rollouts, averaging the reward to go amongst them to calculate this value function estimate. And that can have a lot of variance because at every action, you introduce this amount of noise from your transition dynamics function or the reward. In contrast with this TD backup, we're only going to do one step of unrolling, but we're going to then use the value function estimate at the next state to then reduce","zh":"通过收集这些展开，对它们的奖励进行平均，以计算这个价值函数估计。这可能会有很大的方差，因为在每个动作中，你都会从转移动态函数或奖励中引入一定量的噪声。相比之下，对于这个TD备份，我们只进行一步的展开，但随后会使用下一个状态的价值函数估计来减少","start":1795.88,"end":1822.32},{"id":104,"text":"the variance of our estimate. But again, because our value function can be inaccurate, that leads to potential issues with bias. And both of these have some amount of trade-off. Yeah, so for tabular settings, both of these approaches should converge to the same resulting equation. But when you go beyond that, they don't seem to converge to the same thing.","zh":"我们估计的方差。但同样，由于我们的价值函数可能不准确，这会导致潜在的偏差问题。这两种方法都有一定的权衡。是的，对于表格设置，这两种方法应该收敛到相同的最终方程。但当你超出这个范围时，它们似乎不会收敛到同一个结果。","start":1822.89,"end":1846.31},{"id":105,"text":"And again, we're looking at sort of the N-step returns here as well, where we're going to allow the TD target to look N-steps in the future before being applied, so we could then trade off between the bias and variance here. And yeah, you can look at this table here to kind of look at what the trade-off of each of these would be, where the bootstrap depth of TD is going to be one step, for N-steps it's going to be N, and for Monte Carlo it's going to be the full episode.","zh":"同样，我们在这里查看的是N步回报，其中TD目标会在应用之前向前看N步，这样我们就可以在这两者之间进行偏差和方差的权衡。是的，你可以查看这张表格，大致了解每种方法的权衡，其中TD的引导深度为一步，对于N步则是N步，对于蒙特卡洛则是整个回合。","start":1849.96,"end":1879.86},{"id":106,"text":"the bias for something like TD is going to be high, whereas for N-steps, it's going to be somewhere in the middle, depending on how large your K is. And for Monte Carlo, you're not going to have any bias at all. And then the variance would be sort of the reverse of this, where TD has lower variance, with N-steps return being somewhere again in the middle, and Monte Carlo having high variance. Again, this also depends heavily on the environment that you're in. So for example, in language,","zh":"像TD方法这样的算法，其偏差将会很高，而对于N步回报来说，偏差则会介于中间，具体取决于你的K值有多大。而对于蒙特卡洛方法，你将完全没有偏差。至于方差，情况则与偏差相反，其中TD方法的方差较低，N步回报的方差再次处于中间位置，而蒙特卡洛方法的方差则很高。同样，这也非常依赖于你所处的环境。例如，在语言领域，","start":1880.81,"end":1907.27}],"notes":["本段讨论了Q学习中N步回报的概念，即通过k步展开来计算价值函数，并与单步TD和蒙特卡洛方法进行对比。讲者指出，N步回报允许在应用TD目标时查看未来k步，从而在偏差和方差之间进行权衡。","讲者提到，蒙特卡洛方法通过完整轨迹的折扣奖励总和来估计价值函数，而TD方法仅使用一步展开，利用下一个状态的价值函数估计来减少方差。然而，由于价值函数可能不准确，这可能导致偏差问题。","在表格中，讲者指出TD的回溯深度为一步，N步回报为k步，而蒙特卡洛方法为完整轨迹。偏差方面，TD的偏差较高，N步回报的偏差取决于k的大小，而蒙特卡洛方法没有偏差。方差方面，TD的方差较低，N步回报在中间，而蒙特卡洛方法的方差较高。","讲者强调，这种偏差和方差的权衡取决于具体环境。例如，在语言任务中，不同的环境可能需要不同的方法来平衡偏差和方差。","讲者还提到，对于表格设置，这两种方法会收敛到相同的方程，但在更复杂的情况下，它们可能不会收敛到相同的结果。","最后，讲者指出，N步回报允许在应用TD目标时查看未来k步，从而在偏差和方差之间进行权衡，这为实际应用提供了灵活性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1739.11,"end":1907.27,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1739.11,"text":"So basically what we've done here is that we've done k steps of rolling out using the same expansion that we did for one step. And now our value function is discounted by k steps instead of one step. And we are now turning off between..."},{"start":1757.35,"text":"the Monte Carlo rollout, which is going to be the full discounted sum of rewards as well as this value function estimate that we do, allowing us to effectively trade off between TD and Monte Carlo. So let's take a look at how this would look in a visualization."},{"start":1776.78,"text":"So I'll put both of these up on the slides so we can compare one by one. But if you look at the left-hand side, what we're essentially doing is that from a particular state, we're going to let our policy roll out until it reaches a terminal state. And we're going to collect multiple of these rollouts to do essentially an update by..."},{"start":1795.88,"text":"collecting these rollouts, averaging the reward to go amongst them to calculate this value function estimate. And that can have a lot of variance because at every action, you introduce this amount of noise from your transition dynamics function or the reward. In contrast with this TD backup, we're only going to do one step of unrolling, but we're going to then use the value function estimate at the next state to then reduce"},{"start":1822.89,"text":"the variance of our estimate. But again, because our value function can be inaccurate, that leads to potential issues with bias. And both of these have some amount of trade-off. Yeah, so for tabular settings, both of these approaches should converge to the same resulting equation. But when you go beyond that, they don't seem to converge to the same thing."},{"start":1849.96,"text":"And again, we're looking at sort of the N-step returns here as well, where we're going to allow the TD target to look N-steps in the future before being applied, so we could then trade off between the bias and variance here. And yeah, you can look at this table here to kind of look at what the trade-off of each of these would be, where the bootstrap depth of TD is going to be one step, for N-steps it's going to be N, and for Monte Carlo it's going to be the full episode."},{"start":1880.81,"text":"the bias for something like TD is going to be high, whereas for N-steps, it's going to be somewhere in the middle, depending on how large your K is. And for Monte Carlo, you're not going to have any bias at all. And then the variance would be sort of the reverse of this, where TD has lower variance, with N-steps return being somewhere again in the middle, and Monte Carlo having high variance. Again, this also depends heavily on the environment that you're in. So for example, in language,"}],"speech_gaps":[],"frame":"../frames/v037/011.webp","frame_time":1751.11},{"title":"Q学习回顾与动态规划的缝合概念","segments":[{"id":107,"text":"Monte Carlo rollouts are actually the way that a lot of people do things, because in many cases, your environment dynamics are almost perfect, and your reward signal, especially in domains like math or code reasoning, are going to be perfect as well. So you don't have to worry about things like variance of your dynamics. But if you go to things like maybe agentic domains or robotic domains, a lot o
