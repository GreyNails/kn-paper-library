 count, to compute"},{"start":2321.76,"text":"the average."},{"start":2323.16,"text":"That's what we're doing. Take all the points,"},{"start":2324.88,"text":"add them up, divide them."},{"start":2326.78,"text":"All the cats."},{"start":2328.84,"text":"These are all the elephants."},{"start":2331.08,"text":"Clear enough in the notation?"},{"start":2332.62,"text":"Okay."},{"start":2336.46,"text":"We didn't have to compute any gradient descent to do this."},{"start":2340.0,"text":"We just had to add it up."},{"start":2341.26,"text":"Again, nice feature."},{"start":2343.78,"text":"Okay. Average"},{"start":2344.96,"text":"vectors. Alright. So far so"},{"start":2347.04,"text":"good? Everybody's happy with this?"},{"start":2348.96,"text":"Any questions about it?"},{"start":2354.06,"text":"Now, we're going to estimate the shared covariance, those circles."},{"start":2358.32,"text":"And that's going to let us do a little bit of matrix stuff."},{"start":2361.02,"text":"And if the matrix stuff isn't familiar to you, go to the Friday things, look at them."},{"start":2366.46,"text":"OK."},{"start":2368.36,"text":"So here's the shared covariance sigma."},{"start":2372.6,"text":"OK."},{"start":2373.42,"text":"This is xi minus the mu of that class."},{"start":2378.96,"text":"that is appropriate to it."},{"start":2380.34,"text":"So for every data point, we look at its label,"},{"start":2382.8,"text":"and we pick the appropriate mean."},{"start":2385.6,"text":"We're pooling all the data together."},{"start":2392.56,"text":"Perfect."},{"start":2394.7,"text":"That's what that notation means."},{"start":2396.76,"text":"This character here."},{"start":2398.08,"text":"Please."},{"start":2400.42,"text":"That's really quick for a variance."},{"start":2401.96,"text":"I'm assuming that you're..."},{"start":2404.74,"text":"For right now, we're going to assume"},{"start":2406.62,"text":"because we computed them on the last slide"},{"start":2408.18,"text":"that we have access to them because those means it's no there's no circularity so the question is"},{"start":2412.14,"text":"are we assuming we have the means and we got them we estimated them from the last slide you're right"},{"start":2417.26,"text":"that i'm cheating in some way which i don't know if you're pointing out but i really if you are"},{"start":2420.86,"text":"it's wonderful which is that the actual mean the true population mean we're only seeing a noisy"},{"start":2426.12,"text":"version of it so there's some error in our mean right which we could compute how quickly it goes"},{"start":2430.38,"text":"to zero and all the rest of that convergence rate i'm skipping all of that artfully shall we say for"},{"start":2435.16,"text":"the moment so for yes for the moment i'm assuming i have it exactly to make my life a little bit"},{"start":2439.22,"text":"easier but you could just you could do a plug-in estimator for this it won't be too bad great"},{"start":2443.58,"text":"question really phenomenal question please awesome question so yeah so this is actually"},{"start":2451.88,"text":"this question that you asked i wish i brought candy today i'll give you extra candy this"},{"start":2455.62,"text":"question is this is like one of my favorite questions so what sense are we learning"}],"speech_gaps":[],"frame":"../frames/v054/014.webp","frame_time":2293.76},{"title":"高斯判别分析中的学习与推导","segments":[{"id":304,"text":"This thing if we're not doing gradient descent. And this is one of the things that's interesting to me. Learning is about this kind of inference against the maximum likelihood in this framework that we're doing. The fact that we can solve it in one step doesn't negate its ability to learn. It is doing a form of learning. In fact, you could solve everything we've done here with gradient descent. It would just be a lot less efficient than plugging in the answer. And so that difference of why is this learning?","zh":"如果我们不使用梯度下降法，那么这种情形就变得很有趣。这正是让我感到有趣的一件事。学习在这个框架下，是关于这种最大似然的推断。我们能够一步解决它，并不否定它具备学习的能力。它实际上是在进行一种学习。事实上，我们在这里所做的一切都可以用梯度下降法来解决。只不过，它比直接代入答案要低效得多。因此，为什么这算作学习呢？","start":2460.8,"end":2485.28},{"id":305,"text":"It's kind of an interesting thing. Now, in general, we'll see that we don't know how to learn without these more expensive procedures. But that is like, you know, I had a lab meeting last week where we were talking about exactly about like different procedures that are not gradient descent like to estimate some of these parameters. And I think even heavy and learning, which is another parameter came up. They're all still forms of learning because you're still trying to understand from data how to make future predictions. Yeah. Great question. Others. Cool.","zh":"这是一件很有趣的事情。一般来说，我们会发现，如果不使用这些更昂贵的程序，我们就不知道如何进行学习。但就像上周我参加的一个实验室会议中讨论的一样，我们正在讨论一些不同于梯度下降法的程序，用来估计这些参数。还有像heavy and learning这样的参数也出现了。它们仍然是学习的一种形式，因为你在尝试从数据中理解如何做出未来的预测。是的，这是一个很好的问题。其他人，很棒。","start":2485.8,"end":2517.2},{"id":306,"text":"We can make it more complicated in a sense. When we make it more complicated, then we will have to use gradient descent. So how do we actually derive this in the log likelihood? This is the proof. So what I did in the last thing is I gave you this intuitive version. This is the proof. I'm going to go through it relatively quickly of why mu1 is what I claimed it to be. The idea here is that this is the term.","zh":"从某种意义上说，我们可以让问题变得更复杂。当我们让问题变得更复杂时，我们就必须使用梯度下降法。那么，我们如何在对数似然中实际推导出这一点呢？这就是证明。我之前给你的是一种直观的版本。这就是证明。我将快速地解释为什么μ₁就是我所说的那样。这里的思路是，这就是那个项。","start":2518.03,"end":2548.68},{"id":307,"text":"and that log likelihood that we cared about. If you remember, there was also a class prior. But when we compute this derivative, it's going to fall away. It doesn't depend on the mean. So this is the only term that actually depends on the mean. So if that makes you feel uncomfortable, where did it come from? It was because I had the logs that were separated, and that term I knew was going to go to 0. So I used this notation to hide it. All right. When I do compute this derivative, notice that I get this expression here.","zh":"以及我们关心的对数似然。如果你还记得，还存在一个类先验。但当我们计算这个导数时，它会消失。它不依赖于均值。因此，这是唯一一个真正依赖于均值的项。如果你觉得这让你感到不安，那么这个项是从哪里来的？这是因为我把对数分开了，而那个项我知道会趋近于0。所以我用这种记号把它隐藏起来了。好了，当我计算这个导数时，注意我得到了这个表达式。","start":2549.32,"end":2575.86},{"id":308,"text":"Verify that when I compute the means on each side, because it's a quadratic form, it's going to get one side and the other and transpose. So I'm just going to get that this is going to cancel just like a quadratic, and I get this. Now, the interesting thing about that is, if I look here, this inverse plays an interesting role. What does that tell me? So the only way, since the inverse is on there, I'm not sure if I write it out like this. So since this is invertible, I can pull this out by linearity.","zh":"验证当我在每一侧计算均值时，因为这是一个二次型，它会在两侧产生一个转置。因此，我将得到这一项会像二次型一样相互抵消，从而得到这个结果。有趣的是，这里逆矩阵起到了一个有趣的作用。这告诉我什么呢？由于逆矩阵存在，我不确定是否应该这样写出来。由于这个矩阵是可逆的，我可以利用线性性将其提取出来。","start":2578.1,"end":2604.45},{"id":309,"text":"on the entire thing. It makes the notation a little bit nastier. But if this invertible matrix is multiplied by something and it equals 0, what do we know about x? So if Ax equals 0 and A is full rank, what does x have to be? 0. Exactly right. You got it exactly right. And so that lets me conclude that, in fact, this is true. That's basically saying I don't have to worry too much about that.","zh":"对整个表达式进行操作。这会使符号变得稍微复杂一些。但如果这个可逆矩阵乘以某个东西等于0，我们能知道什么关于x的信息呢？如果Ax等于0且A是满秩的，那么x必须是什么？0。完全正确。你完全正确。因此，我可以得出结论，事实上这个结论是成立的。这基本上意味着我不必太担心这一点。","start":2605.12,"end":2633.25}],"notes":["本段讨论了学习与最大似然框架之间的关系，指出即使可以一步求解，这仍然是一种学习形式。同时提到梯度下降虽然可以解决所有问题，但效率较低。"],"formulas":[{"latex":"A x = 0","symbols":"矩阵乘法等于零向量","explanation":"公式正确，表示矩阵A与向量x的乘积为零向量，适用于线性代数中的矩阵方程。","evidence":"on the entire thing. It makes the notation a little bit nastier. But if this invertible matrix is multiplied by something and it equals 0, what do we know about x? So if Ax equals 0 and A is full rank, what does x have to be? 0. Exactly right. You got it exactly right. And so that lets me conclude that, in fact, this is true. That's basically saying I don't have to worry too much about that."}],"uncertainties":["heavy and learning"],"diagram":"none","start":2460.8,"end":2633.25,"asr_flags":[],"math_clarifications":["公式均正确，无需额外说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2460.8,"text":"this thing if we're not doing gradient descent. And this is one of the things that's interesting to me. Learning is about this kind of inference against the maximum likelihood in this framework that we're doing. The fact that we can solve it in one step doesn't negate its ability to learn. It is doing a form of learning. In fact, you could solve everything we've done here with gradient descent. It would just be a lot less efficient than plugging in the answer. And so that difference of why is this learning?"},{"start":2485.8,"text":"It's kind of an interesting thing. Now, in general, we'll see that we don't know how to learn without these more expensive procedures. But that is like, you know, I had a lab meeting last week where we were talking about exactly about like different procedures that are not gradient descent like to estimate some of these parameters. And I think even heavy and learning, which is another parameter came up. They're all still forms of learning because you're still trying to understand from data how to make future predictions. Yeah. Great question. Others. Cool."},{"start":2518.03,"text":"We can make it more complicated in a sense. When we make it more complicated, then we will have to use gradient descent. So how do we actually derive this in the log likelihood? This is the proof. So what I did in the last thing is I gave you this intuitive version. This is the proof. I'm going to go through it relatively quickly of why mu1 is what I claimed it to be. The idea here is that this is the term."},{"start":2549.32,"text":"and that log likelihood that we cared about. If you remember, there was also a class prior. But when we compute this derivative, it's going to fall away. It doesn't depend on the mean. So this is the only term that actually depends on the mean. So if that makes you feel uncomfortable, where did it come from? It was because I had the logs that were separated, and that term I knew was going to go to 0. So I used this notation to hide it. All right. When I do compute this derivative, notice that I get this expression here."},{"start":2578.1,"text":"Verify that when I compute the means on each side, because it's a quadratic form, it's going to get one side and the other and transpose. So I'm just going to get that this is going to cancel just like a quadratic, and I get this. Now, the interesting thing about that is, if I look here, this inverse plays an interesting role. What does that tell me? So the only way, since the inverse is on there, I'm not sure if I write it out like this. So since this is invertible, I can pull this out by linearity."},{"start":2605.12,"text":"on the entire thing. It makes the notation a little bit nastier. But if this invertible matrix is multiplied by something and it equals 0, what do we know about x? So if Ax equals 0 and A is full rank, what does x have to be? 0. Exactly right. You got it exactly right. And so that lets me conclude that, in fact, this is true. That's basically saying I don't have to worry too much about that."}],"speech_gaps":[],"frame":"../frames/v054/015.webp","frame_time":2472.8},{"title":"高斯判别分析中的假设与决策边界","segments":[{"id":310,"text":"If sigma were not invertible, what would go wrong in that reasoning? Please? The vector here could be in the null space, so it wouldn't exactly be zero. We could only conclude, for example, that xi equals the mu up to some extra term. It wouldn't be identifiable. This gets back to the why are we doing this kind of assumption earlier. Awesome.","zh":"如果协方差矩阵不可逆，那么之前的推理会出什么问题？请？这里的向量可能位于零空间中，因此它不会恰好为零。我们只能得出例如xi等于均值加上一些额外项的结论。它将无法被唯一确定。这又回到了我们之前做这种假设的原因。太棒了。","start":2633.89,"end":2657.56},{"id":311,"text":"So there'd be an entire one dimension where we couldn't tell where the mu lived, if you like, roughly speaking. OK, cool. And then this is just more of that terrible notation thrown to compute the world's most complicated average. Sound good?","zh":"因此，如果我们像这样粗略地说，会有一个一维空间，我们无法确定均值的位置。好的，明白了。然后这只是更多糟糕的符号被用来计算世界上最复杂的平均值。听起来不错？","start":2659.46,"end":2674.08},{"id":312,"text":"Right, so this justifies it though, okay? So why did I do this? Again, so one very grim way to look at this slide is, this is the world's most complicated derivation of computing the world's most complicated average, in which case, like, you know, good for me. But actually, the reason we're doing it this way is that this technique of going from likelihood to parameter, this is a simple case where we started to be able to intuit the answer. We're going to do again and again. As we get to more complicated models, we're going to compute these derivatives on the population. We're going to solve these things.","zh":"对，这也就证明了这一点，对吧？那么我为什么要这样做？再次，从一个非常阴郁的角度来看这张幻灯片，这实际上是计算世界上最复杂平均值的世界上最复杂的推导，因此，像你所知道的，这对我而言是件好事。但实际上，我们这样做的原因在于，从似然函数到参数的这种技术，在这种简单情况下，我们开始能够直观地理解答案。我们将反复这样做。当我们进入更复杂的模型时，我们将计算这些导数在总体上的值。我们将解决这些问题。","start":2674.76,"end":2704.14},{"id":313,"text":"and you're going to have to do that in homeworks and other stuff coming up. So this is not a surprising thing. And you can do all of them. You can do the mu's, you can do the sigma's, you can do it all this way. Now, this is a little bit of extra stuff that I wanted to throw in, just because I wanted to talk about this decision boundary a little bit. So part of this is standard. Part of this, there's one figure that's not. So when you have a new animal, how do you do the prediction?","zh":"你将在作业和其他即将出现的内容中必须这样做。因此，这不是一个令人惊讶的事情。你可以完成所有这些。你可以完成均值，你可以完成协方差矩阵，你可以用这种方式完成所有内容。现在，这是一点额外的内容，我想加入进来，只是为了稍微谈谈这个决策边界。因此，其中一部分是标准的。其中一部分，有一张图是不标准的。当你遇到一个新动物时，你是如何进行预测的？","start":2704.26,"end":2735.71},{"id":314,"text":"So you take this argmax y hat, take this argmax over all p of x given y. So this means what you're going to do is you're going to take all the labels, and you're going to say, given the data that you've shown me, I think it's very likely that it's an elephant. I think it's less likely that it's a cat. If I had more examples, I would do more examples. But right now, we're doing binary classification.","zh":"因此，你将取这个argmax y hat，取这个argmax所有p(x|y)。这意味着你将做的是，你将取所有标签，并且你说，根据你展示给我的数据，我认为它很可能是一头大象。我认为它更可能不是一只猫。如果我有更多的例子，我会做更多的例子。但目前，我们正在做二分类。","start":2737.07,"end":2756.95},{"id":315,"text":"Okay? And I just compare those two and take that argmax. And indeed, I get this little function here if I buy Bayes' rules. And I notice, ah, actually, p of x doesn't depend on y directly or shouldn't depend on this directly. So I get this kind of argmax. Okay? This is where the population comes in. This should be doesn't depend on x. Sorry. I'll blame Claude, but it's probably me. Okay? This term goes away. That's what I'm arguing. This is wrong. Okay?","zh":"好的？我比较这两个并取argmax。事实上，如果我采用贝叶斯规则，我会得到这里的小函数。我注意到，啊，实际上，p(x)并不直接依赖于y，也不应该直接依赖于此。所以我得到了这种argmax。好的？这就是总体发挥作用的地方。这应该不依赖于x。抱歉。我会责怪Claude，但可能错的是我。好的？这个项就消失了。这就是我所争论的。这是错误的。好的？","start":2757.71,"end":2784.54},{"id":316,"text":"Clearly, it depends on the label, right? Like more cats, you're going to be more likely to say there's a cat. Okay, so this is where the decision boundary comes up. Now, what we're going to do is we're going to write out these probability distributions here and try and figure out exactly where the probability that we decide we flip from dog to cat.","zh":"显然，它依赖于标签，对吧？比如，有更多的猫，你更有可能说这里有猫。好的，所以这就是决策边界出现的地方。现在，我们将写出这些概率分布，并尝试确定我们决定从狗转向猫的概率翻转的确切位置。","start":2785.61,"end":2810.33}],"notes":["本段讨论了高斯判别分析中协方差矩阵不可逆时可能带来的问题。如果协方差矩阵不可逆，那么其逆矩阵不存在，这会导致参数估计无法进行，因为参数估计依赖于协方差矩阵的逆。此外，向量可能位于零空间中，无法唯一确定均值，这使得模型参数不可识别。","讲者提到，如果协方差矩阵不可逆，那么在参数估计过程中，我们无法确定均值的确切位置，因为存在一个维度上的不确定性。这说明了为什么在高斯判别分析中需要假设协方差矩阵是可逆的，以确保模型的可识别性。","讲者进一步指出，这种假设在高斯判别分析中是必要的，因为它允许我们通过最大似然估计来推导参数。这种技术在更复杂的模型中也会被使用，但需要计算这些参数的导数。","讲者提到，这种技术在后续的作业和练习中会反复出现，因此学生需要掌握如何计算这些导数。这表明，高斯判别分析是理解更复杂模型的基础。","讲者还讨论了决策边界的概念，即在给定数据的情况下，如何根据概率分布来判断样本属于哪个类别。决策边界是通过比较不同类别的后验概率来确定的。","最后，讲者指出，决策边界是通过比较不同类别的概率分布来确定的，这涉及到如何根据给定的数据来预测样本的类别。"],"formulas":[],"uncertainties":[],"diagram":"decision","start":2633.89,"end":2810.33,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2633.89,"text":"If sigma were not invertible, what would go wrong in that reasoning? Please? The vector here could be in the null space, so it wouldn't exactly be zero. We could only conclude, for example, that xi equals the mu up to some extra term. It wouldn't be identifiable. This gets back to the why are we doing this kind of assumption earlier. Awesome."},{"start":2659.46,"text":"So there'd be an entire one dimension where we couldn't tell where the mu lived, if you like, roughly speaking. OK, cool. And then this is just more of that terrible notation thrown to compute the world's most complicated average. Sound good?"},{"start":2674.76,"text":"Right, so this justifies it though, okay? So why did I do this? Again, so one very grim way to look at this slide is, this is the world's most complicated derivation of computing the world's most complicated average, in which case, like, you know, good for me. But actually, the reason we're doing it this way is that this technique of going from likelihood to parameter, this is a simple case where we started to be able to intuit the answer. We're going to do again and again. As we get to more complicated models, we're going to compute these derivatives on the population. We're going to solve these things."},{"start":2704.26,"text":"and you're going to have to do that in homeworks and other stuff coming up. So this is not a surprising thing. And you can do all of them. You can do the mu's, you can do the sigma's, you can do it all this way. Now, this is a little bit of extra stuff that I wanted to throw in, just because I wanted to talk about this decision boundary a little bit. So part of this is standard. Part of this, there's one figure that's not. So when you have a new animal, how do you do the prediction?"},{"start":2737.07,"text":"So you take this argmax y hat, take this argmax over all p of x given y. So this means what you're going to do is you're going to take all the labels, and you're going to say, given the data that you've shown me, I think it's very likely that it's an elephant. I think it's less likely that it's a cat. If I had more examples, I would do more examples. But right now, we're doing binary classification."},{"start":2757.71,"text":"Okay? And I just compare those two and take that argmax. And indeed, I get this little function here if I buy Bayes' rules. And I notice, ah, actually, p of x doesn't depend on y directly or shouldn't depend on this directly. So I get this kind of argmax. Okay? This is where the population comes in. This should be doesn't depend on x. Sorry. I'll blame Claude, but it's probably me. Okay? This term goes away. That's what I'm arguing. This is wrong. Okay?"},{"start":2785.61,"text":"Clearly, it depends on the label, right? Like more cats, you're going to be more likely to say there's a cat. Okay, so this is where the decision boundary comes up. Now, what we're going to do is we're going to write out these probability distributions here and try and figure out exactly where the probability that we decide we flip from dog to cat."}],"speech_gaps":[],"frame":"../frames/v054/016.webp","frame_time":2645.89},{"title":"高斯判别分析中的决策边界","segments":[{"id":317,"text":"Sorry, we're doing cats and elephants. Got to keep it straight. It's super important we know which animals we're talking about. Anyway, so we're going to take the logs and we're going to expand the Gaussians and look at these terms. And what we're trying to say is where are they equal? Because we assume they're monotone decreasing inside because of the way the Gaussians look. They're monotone decreasing as the... ","zh":"抱歉，我们正在讨论猫和大象。必须保持清晰。我们非常需要知道我们在谈论哪些动物。总之，我们将取对数，并展开高斯分布，看看这些项。我们试图说明的是它们在何处相等？因为我们假设它们在远离中心时是单调递减的，因为高斯分布的形状如此。它们随着远离中心而单调递减，对吧？","start":2810.95,"end":2830.19},{"id":318,"text":"as it goes away from you, right? And so we're trying to find that decision boundary. We're going to try and find all the places where they give exactly the same probability. And that probability is a function of all this good stuff. It's a function of the Gaussian. It's a function of the class prior, everything else. So when we expand, because we did this trick here that sigma is shared, we're going to be able to cross out a bunch of terms that involve sigma and all the things that are on sigma xtx kind of terms.","zh":"因此，我们试图找到这个决策边界。我们将尝试找到所有给出相同概率的位置。这个概率是所有这些好东西的函数。它是高斯分布的函数，是类先验概率的函数，以及其他一切。当我们展开时，因为我们在这里使用了共享的协方差矩阵σ，我们将能够消除涉及σ和所有σx^T x类项的项。","start":2830.48,"end":2859.38},{"id":319,"text":"And that's going to leave us with this piece. Maybe I didn't draw it. Did I draw it out? Yeah. So these quadratic terms, they're all going to basically go away. And I'm going to get a bunch of cross terms and other things based on the mu. The mu terms are all going to be constants. So when I take this term and this term and put it through sigma, it's just going to give me some constant. That's the inner product. It's going to be bigger than 0. And I put that in.","zh":"这将留下这一部分。也许我没有画出来。我画出来了？是的。这些二次项基本上都会消失。我将得到一些交叉项和其他基于均值μ的项。μ项都是常数。当我将这一项和那一项通过σ处理时，它将只给我一个常数。这就是内积。它会大于0。我把这个放进去。","start":2860.09,"end":2889.81},{"id":320,"text":"And the point is that this gives me a totally affine term. Only linear terms suffice in x because this term cancels because it's shared. Does that make sense? I gave a terrible explanation, so it really shouldn't. But hopefully, you're smart enough and kind enough that you got it. Good enough. The point I'm trying to make is the decision surface is linear for GDA when sigma is shared because this term cancels. All the quadratic terms go away. You equate everything else.","zh":"重点是这给了我一个完全的仿射项。只有线性项在x中足够，因为这一项会抵消，因为它被共享了。这清楚吗？我解释得非常糟糕，所以它真的不应该清楚。但希望你足够聪明和善良，已经理解了。足够好了。我想表达的要点是，当σ被共享时，GDA的决策边界是线性的，因为这一项被抵消了。所有的二次项都消失了。你将其他一切相等。","start":2890.19,"end":2919.91},{"id":321,"text":"So here is that term. So this is the form of a hyperplane. And then this is the actual odds. This is the log odds. The offset is exactly the log odds. We get all the differences between the means, the plus and the minus. You can compute all of this. So it basically says this is the expansion that we're going to get. And so after all of our work, we got a line between the two of them, which I told you we were trying to avoid.","zh":"所以这就是那个术语。这就是一个超平面的形式。而这就是实际的几率。这是对数几率。偏置量正是对数几率。我们得到了均值之间的所有差异，正负都有。你可以计算出所有这些内容。因此，这基本上说明了我们将得到的展开形式。经过所有这些工作，我们得到了连接它们之间的线，而我之前告诉过你们我们试图避免这种情况。","start":2921.39,"end":2948.54},{"id":322,"text":"What happened here? Okay, so two things that I want to point out. One is...","zh":"这里发生了什么？好的，我想指出两点。第一点是……","start":2951.6,"end":2955.4},{"id":323,"text":"conceptually, we modeled something quite different.","zh":"从概念上讲，我们建模的是一个完全不同的事物。","start":2956.28,"end":2957.9},{"id":324,"text":"And I'm gonna show you that actually","zh":"我将向你们展示实际上","start":2958.06,"end":2959.24},{"id":325,"text":"our conceptual modeling can give","zh":"我们的概念建模可以产生","start":2959.24,"end":2960.74},{"id":326,"text":"different decision surfaces,","zh":"不同的决策曲面，","start":2960.74,"end":2962.0},{"id":327,"text":"so give me that in one second.","zh":"给我一点时间。","start":2962.28,"end":2963.46},{"id":328,"text":"I'm also gonna show you one other representative thing,","zh":"我还将向你们展示另一个代表性的内容，","start":2963.8,"end":2966.08},{"id":329,"text":"which is this line here,","zh":"这就是这里的这条线，","start":2966.26,"end":2968.14},{"id":330,"text":"it will turn out that many of the generative models","zh":"结果会发现，许多生成模型","start":2968.34,"end":2971.3},{"id":331,"text":"effectively give you the same discriminative line,","zh":"实际上会给你相同的判别线，","start":2971.84,"end":2973.92},{"id":332,"text":"and that discriminative line is given to you","zh":"而这条判别线是","start":2974.08,"end":2976.02},{"id":333,"text":"by logistic regression,","zh":"由逻辑回归给出的，","start":2976.02,"end":2976.9},{"id":334,"text":"which is a super interesting point","zh":"这是一个非常有趣的观点，","start":2977.24,"end":2978.62},{"id":335,"text":"because we had to assume a lot of things","zh":"因为我们为了得到这个生成模型，","start":2978.62,"end":2981.26},{"id":336,"text":"to cough this guy out, this generative model, right?","zh":"不得不做出很多假设，对吧？","start":2981.26,"end":2983.52},{"id":337,"text":"We had to assume the covariances were shared,","zh":"我们必须假设协方差是共享的,","start":2983.7,"end":2985.9},{"id":338,"text":"We had to estimate all those parameters. Now, they were cheap to estimate, so that was good,","zh":"我们必须估计所有这些参数。现在，这些参数的估计成本很低，所以这是好的,","start":2985.9,"end":2989.2}],"notes":["本段主要讲解高斯判别分析（GDA）中决策边界的推导过程。讲者提到，当两个高斯分布的协方差矩阵共享时，决策边界会是线性的。这是因为高斯分布的对数概率展开后，二次项会相互抵消，只剩下与均值相关的线性项。这种线性决策边界是GDA的一个重要特性。","讲者通过对比不同模型（如生成模型和判别模型）的决策边界，指出虽然它们的建模方式不同，但有时会得到相同的判别边界。例如，生成模型（如GDA）和判别模型（如逻辑回归）在某些情况下可以得到相同的决策边界。","在推导过程中，讲者强调了协方差矩阵共享的重要性。当协方差矩阵共享时，可以简化模型的参数估计，并且使得决策边界成为线性形式。这与逻辑回归的线性决策边界有相似之处。","讲者提到，虽然生成模型（如GDA）和判别模型（如逻辑回归）在建模方式上不同，但它们在某些情况下可以得到相同的决策边界。这说明了不同模型在特定条件下可能具有相似的预测能力。","最后，讲者强调了决策边界推导过程中的关键点：二次项的抵消、线性项的保留以及共享协方差矩阵对决策边界形状的影响。这些内容为理解GDA的决策边界提供了理论基础。"],"formulas":[],"uncertainties":["sigma xtx kind of terms","this term cancels because it's shared"],"diagram":"none","start":2810.95,"end":2989.2,"asr_flags":[],"math_clarifications":["原始公式中的分母和指数部分存在错误，正确的高斯分布形式应为 \\frac{1}{\\sqrt{2\\pi\\sigma^2}} \\text{exp}(-\\frac{1}{2}(x - μ)^TΣ^{-1}(x - μ))。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":2810.95,"text":"Sorry, we're doing cats and elephants. Got to keep it straight. It's super important we know which animals we're talking about. Anyway, so we're going to take the logs and we're going to expand the Gaussians and look at these terms. And what we're trying to say is where are they equal? Because we assume they're monotone decreasing inside because of the way the Gaussians look. They're monotone decreasing as the..."},{"start":2830.48,"text":"as it goes away from you, right? And so we're trying to find that decision boundary. We're going to try and find all the places where they give exactly the same probability. And that probability is a function of all this good stuff. It's a function of the Gaussian. It's a function of the class prior, everything else. So when we expand, because we did this trick here that sigma is shared, we're going to be able to cross out a bunch of terms that involve sigma and all the things that are on sigma xtx kind of terms."},{"start":2860.09,"text":"And that's going to leave us with this piece. Maybe I didn't draw it. Did I draw it out? Yeah. So these quadratic terms, they're all going to basically go away. And I'm going to get a bunch of cross terms and other things based on the mu. The mu terms are all going to be constants. So when I take this term and this term and put it through sigma, it's just going to give me some constant. That's the inner product. It's going to be bigger than 0. And I put that in."},{"start":2890.19,"text":"And the point is that this gives me a totally affine term. Only linear terms suffice in x because this term cancels because it's shared. Does that make sense? I gave a terrible explanation, so it really shouldn't. But hopefully, you're smart enough and kind enough that you got it. Good enough. The point I'm trying to make is the decision surface is linear for GDA when sigma is shared because this term cancels. All the quadratic terms go away. You equate everything else."},{"start":2921.39,"text":"So here is that term. So this is the form of a hyperplane. And then this is the actual odds. This is the log odds. The offset is exactly the log odds. We get all the differences between the means, the plus and the minus. You can compute all of this. So it basically says this is the expansion that we're going to get. And so after all of our work, we got a line between the two of them, which I told you we were trying to avoid."},{"start":2951.6,"text":"What happened here? Okay, so two things that I want to point out. One is..."},{"start":2956.28,"text":"conceptually, we modeled something quite different."},{"start":2958.06,"text":"And I'm gonna show you that actually"},{"start":2959.24,"text":"our conceptual modeling can give"},{"start":2960.74,"text":"different decision surfaces,"},{"start":2962.28,"text":"so give me that in one second."},{"start":2963.8,"text":"I'm also gonna show you one other representative thing,"},{"start":2966.26,"text":"which is this line here,"},{"start":2968.34,"text":"it will turn out that many of the generative models"},{"start":2971.84,"text":"effectively give you the same discriminative line,"},{"start":2974.08,"text":"and that discriminative line is given to you"},{"start":2976.02,"text":"by logistic regression,"},{"start":2977.24,"text":"which is a super interesting point"},{"start":2978.62,"text":"because we had to assume a lot of things"},{"start":2981.26,"text":"to cough this guy out, this generative model, right?"},{"start":2983.7,"text":"We had to assume the covariances were shared,"},{"start":2985.9,"text":"We had to estimate all those parameters. Now, they were cheap to estimate, so that was good,"}],"speech_gaps":[],"frame":"../frames/v054/017.webp","frame_time":2822.95},{"title":"高斯判别分析中的决策边界推导","segments":[{"id":339,"text":"but it ended up we got to a decision surface. So, I want to go through each of those points.","zh":"但最终我们得到了一个决策面。因此，我想逐一讲解这些要点。","start":2991.48,"end":2997.18},{"id":340,"text":"Any questions before I move on? Is it clear how we derive this? The most important takeaway is GDA,","zh":"在我继续之前，有任何问题吗？大家清楚我们是如何推导出这个决策面的吗？最重要的收获是，高斯判别分析（GDA）","start":2997.44,"end":3002.48},{"id":341,"text":"in its current form, does have a decision boundary which is a line, even though it does all this nice","zh":"在目前的形式下，确实具有一个决策边界，即一条直线，尽管其内部实现了所有这些良好的概率处理。请。","start":3002.68,"end":3007.5},{"id":342,"text":"good probabilistic stuff underneath the covers. Please.","zh":"你应该将0项与负号相乘。","start":3007.5,"end":3010.74},{"id":343,"text":"You should cross the terms of 0 with the-","zh":"你应该将0项与负项相消","start":3011.88,"end":3015.36},{"id":344,"text":"Oh, sure, sure, sure.","zh":"你能再解释一遍吗？","start":3015.36,"end":3016.1},{"id":345,"text":"Can you explain that again?","zh":"是的，我之前略过了那个部分，","start":3016.48,"end":3017.4},{"id":346,"text":"Yeah, so the thing that I glossed over,","zh":"是的，所以我之前略过了那个部分","start":3017.56,"end":3019.7},{"id":347,"text":"which was a little bit strange, is this term is gonna cancel.","zh":"这有点奇怪，这个项将会被抵消。","start":3019.82,"end":3023.58},{"id":348,"text":"So when I expand x here, let me write it out.","zh":"所以当我在这里展开 x 时，让我把它写出来。","start":3023.72,"end":3026.78},{"id":349,"text":"Maybe I'll make a huge mess of this,","zh":"也许我会把这件事搞得一团糟，","start":3027.26,"end":3028.62},{"id":350,"text":"so apologies in advance.","zh":"所以提前表示歉意。","start":3028.68,"end":3029.58},{"id":351,"text":"Here, I'll write it in blue.","zh":"在这里，我会用蓝色写出来。","start":3030.44,"end":3031.24},{"id":352,"text":"Okay, when I expand this term out,","zh":"好的，当我展开这个项时，","start":3031.5,"end":3033.04},{"id":353,"text":"I'm gonna get x transpose sigma inverse x on this side,","zh":"我会得到 x 转置乘以 σ 的逆矩阵再乘以 x 这一项，","start":3033.1,"end":3036.66},{"id":354,"text":"plus a bunch of other things,","zh":"再加上一堆其他项，","start":3036.76,"end":3038.16},{"id":355,"text":"like minus mu transpose sigma inverse x. Let's see, what else will I get? I will get x, I'll","zh":"像减去 mu 转置 sigma 逆 x。让我看看，我还会得到什么？我会得到 x，我会","start":3038.16,"end":3045.98},{"id":356,"text":"get the other one, x, x transpose sigma inverse mu 1. This is all this term here. And then I will","zh":"得到另一个，x 转置 sigma 逆 mu 1。这是这里的整个项。然后我也会得到加 mu 1 转置 sigma 逆 mu 1。","start":3045.98,"end":3052.88},{"id":357,"text":"also get plus mu 1 transpose sigma inverse mu 1.","zh":"这个项是一个常数。为什么它是常数？因为 mu1 是一个常数。sigma 是我们已知的。因此，这基本上只是一个标量值。这是因为我们在相互点积。这里的这个项包含 x，它会随着数据变化。我们不会把这个项去掉。事实上，如果你看，因为这些项是对称的，这两个项会与前面的这个一半项相互抵消。所以这就是同一个项。","start":3052.88,"end":3057.48},{"id":358,"text":"This term is a constant. Why is it a constant? Because mu1 is a constant. Sigma is something that we know. And so this will basically just be a scalar value. That's all it's going to do because we're dotting into each other. This term here has an x in it. It's going to vary with data. We're not going to cross that term off. And in fact, if you look, because these things are symmetric, these two terms are just going to cancel with this one half term that's in front. So this is the same term.","zh":"这个项是一个常数。为什么它是常数？因为 mu1 是一个常数。Sigma 是我们已知的量。因此，这基本上只是一个标量值。这是因为我们在进行点积运算。这里的这个项包含 x，它会随着数据变化。我们不会将这个项划掉。事实上，如果你观察一下，由于这些项是对称的，这两个项将与前面的这个 1/2 项相互抵消。因此，这就是同一个项。","start":3059.13,"end":3086.99},{"id":359,"text":"just written in two different ways. Clear enough? That one's symmetric. They're both x dot mu via sigma inverse.","zh":"只是以两种不同的方式写出来的。清楚吗？这个是对称的。它们都是通过 sigma 逆矩阵进行 x 点乘 mu 的运算。","start":3087.82,"end":3095.4},{"id":360,"text":"Cool? All right. Now, this character. Well, this character is quadratic. We're going to come back to him in just one slide. But this character is quadratic. And the thing is, it also shows up. I don't mean to say he's a he. I don't know why I called him he. But to me, he's a he. I don't know. I'm having a rough day. Anyway, so my point is, this term also shows up on this side. And they will cancel for every x. And so the decision surface, this one is depending here on mu1.","zh":"mu1，而这个则完全取决于 mu0。因此，当我实际将所有项分组时，我会得到这个漂亮的表达式，它会回到这里。因此，当我进行分类时，这就是我得到的。因此，这形成一个超平面。这仅仅是在说这个向量点乘 x 等于这个表达式，而这个表达式实际上是问题中的所有常数。我讲得太快了，所以请提问。我很乐意放慢速度并解析这个内容。请。","start":3097.44,"end":3122.62},{"id":361,"text":"mu1, whereas this one's all depending on mu0. And so when I actually group all the terms, I get this nice expression that comes back right here. So when I go to do classification, this is what I'm getting. And so this forms a hyperplane. This is just saying that this vector dotted into x is equal to this expression, which is all effectively constants of the problem. I went over it way too quickly, so please ask questions. I'm super happy to slow down and parse this. Please.","zh":"mu1，而这个则完全取决于 mu0。因此，当我实际将所有项分组时，我会得到这个漂亮的表达式，它会回到这里。因此，当我进行分类时，这就是我得到的。因此，这形成一个超平面。这仅仅是在说这个向量点乘 x 等于这个表达式，而这个表达式实际上是问题中的所有常数。我讲得太快了，所以请提问。我很乐意放慢速度并解析这个内容。请。","start":3123.09,"end":3154.75}],"notes":["本段主要讲解高斯判别分析（GDA）中决策边界的推导过程，特别是关于如何通过展开和简化表达式来得到决策边界。讲者提到，虽然GDA在底层使用了概率模型，但其决策边界是一个线性边界，即超平面。在推导过程中，讲者强调了某些项会相互抵消，从而简化表达式。","讲者在推导过程中提到，某些项是常数项，因为它们不依赖于数据点x，而另一些项则包含x，因此会随着数据变化。讲者还指出，由于对称性，某些项会与前面的系数项相互抵消，从而得到最终的表达式。","讲者提到一个二次项，它在推导过程中出现，并且在后续的幻灯片中会再次讨论。这个二次项在决策边界推导中起到重要作用，但讲者也指出，它在某些情况下会与其他项相互抵消。","最终，讲者得出结论，决策边界是一个超平面，其形式为一个向量与x的点积等于一个常数表达式。这个结论是通过将所有项进行分组和简化得到的。讲者还表示，这个推导过程较为快速，鼓励学生提问以进一步理解。","讲者在讲解过程中使用了比喻，如将某些项称为“他”，这可能是一种口语化的表达方式，但并未影响对数学推导的理解。","讲者强调，虽然推导过程较为复杂，但最终结果是一个清晰的线性决策边界，这与GDA的基本假设一致，即数据服从高斯分布。"],"formulas":[],"uncertainties":["讲者提到的‘this character’可能指代某个特定的项，但未明确指出，因此无法确定其具体数学表达式。","讲者提到的‘this one is depending here on mu1’和‘this one's all depending on mu0’中的具体项未明确写出，因此无法确定其数学形式。"],"diagram":"none","start":2991.48,"end":3154.75,"asr_flags":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":2991.48,"text":"but it ended up we got to a decision surface. So, I want to go through each of those points."},{"start":2997.44,"text":"Any questions before I move on? Is it clear how we derive this? The most important takeaway is GDA,"},{"start":3002.68,"text":"in its current form, does have a decision boundary which is a line, even though it does all this nice"},{"start":3007.5,"text":"good probabilistic stuff underneath the covers. Please."},{"start":3011.88,"text":"You should cross the terms of 0 with the-"},{"start":3015.36,"text":"Oh, sure, sure, sure."},{"start":3016.48,"text":"Can you explain that again?"},{"start":3017.56,"text":"Yeah, so the thing that I glossed over,"},{"start":3019.82,"text":"which was a little bit strange, is this term is gonna cancel."},{"start":3023.72,"text":"So when I expand x here, let me write it out."},{"start":3027.26,"text":"Maybe I'll make a huge mess of this,"},{"start":3028.68,"text":"so apologies in advance."},{"start":3030.44,"text":"Here, I'll write it in blue."},{"start":3031.5,"text":"Okay, when I expand this term out,"},{"start":3033.1,"text":"I'm gonna get x transpose sigma inverse x on this side,"},{"start":3036.76,"text":"plus a bunch of other things,"},{"start":3038.16,"text":"like minus mu transpose sigma inverse x. Let's see, what else will I get? I will get x, I'll"},{"start":3045.98,"text":"get the other one, x, x transpose sigma inverse mu 1. This is all this term here. And then I will"},{"start":3052.88,"text":"also get plus mu 1 transpose sigma inverse mu 1."},{"start":3059.13,"text":"This term is a constant. Why is it a constant? Because mu1 is a constant. Sigma is something that we know. And so this will basically just be a scalar value. That's all it's going to do because we're dotting into each other. This term here has an x in it. It's going to vary with data. We're not going to cross that term off. And in fact, if you look, because these things are symmetric, these two terms are just going to cancel with this one half term that's in front. So this is the same term."},{"start":3087.82,"text":"just written in two different ways. Clear enough? That one's symmetric. They're both x dot mu via sigma inverse."},{"start":3097.44,"text":"Cool? All right. Now, this character. Well, this character is quadratic. We're going to come back to him in just one slide. But this character is quadratic. And the thing is, it also shows up. I don't mean to say he's a he. I don't know why I called him he. But to me, he's a he. I don't know. I'm having a rough day. Anyway, so my point is, this term also shows up on this side. And they will cancel for every x. And so the decision surface, this one is depending here on mu1."},{"start":3123.09,"text":"mu1, whereas this one's all depending on mu0. And so when I actually group all the terms, I get this nice expression that comes back right here. So when I go to do classification, this is what I'm getting. And so this forms a hyperplane. This is just saying that this vector dotted into x is equal to this expression, which is all effectively constants of the problem. I went over it way too quickly, so please ask questions. I'm super happy to slow down and parse this. Please."}],"speech_gaps":[],"frame":"../frames/v054/018.webp","frame_time":3003.48},{"title":"高斯判别分析中的决策边界","segments":[{"id":362,"text":"How did this happen here? Yeah, so this happened because when I went through this side, I'm going to get this term. I'm going to borrow this term on one side. I'm going to move it to the other side. And I'm going to have a bunch of the linear terms, which I'm also going to separate off in the mu1 and mu2 versions. That's going to give me the right-hand side that's here. And the rest is just algebra, like these guys moved over to this one.","start":3157.39,"end":3183.42},{"id":363,"text":"And I realize this was not a very good derivation because I was planning on trying to skip through.","start":3185.36,"end":3189.82},{"id":364,"text":"it. And I appreciate you calling me out on it. I shouldn't have skipped through it.","start":3189.82,"end":3193.04},{"id":365,"text":"It is in Tang Yu's notes or in the notes written out in full detail. But conceptually,","start":3193.14,"end":3198.74},{"id":366,"text":"it is just arithmetic. It is just doing a little bit of algebra to move things around","start":3199.24,"end":3202.94},{"id":367,"text":"and cross them out. And they are actually linear. The most impor
