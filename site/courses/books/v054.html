385.42,"text":"So I felt I had to vomit that out for you."},{"start":1390.93,"text":"The covariance itself does not give you that information nearly as readily. So if you look at that information, it's very difficult to say because independence requires a factorization, but the values can be non-zero."}],"speech_gaps":[],"frame":"../frames/v054/008.webp","frame_time":1236.18},{"title":"高斯判别分析的假设与模型","segments":[{"id":139,"text":"But here, once you normalize appropriately, you get zero entries in there. And this is actually very useful when you're looking at data sources to decide, are they approximately independent? If you look at their inverse covariance matrix, this is actually a pretty reasonable test, which is a lecture that I gave last year or two years ago but shelved this year so we could make more deep learning, which is more important. Cool. Awesome. That is just for your interest. This is not stuff you need to know. OK. All right. Back to GDA.","zh":"但是，一旦你适当归一化，你就会得到其中的零元素。实际上，当你查看数据源时，这非常有用，可以决定它们是否近似独立。如果你查看它们的逆协方差矩阵，这实际上是一个相当合理的测试方法。这是我去年或前年讲过的一堂课，但今年我把它搁置了，以便我们能更深入地进行深度学习，这更为重要。酷。太棒了。这只是供你参考。这并不是你需要知道的内容。好的。好了，回到高斯判别分析。","start":1403.31,"end":1432.69},{"id":140,"text":"There's a different mean with the same covariance. Now, you could say, what if we have different covariances? We'll come back to that later. You don't need to know that. But right now, we're thinking we just have different means, and we want to do this. So we want to find mu of elephant and mu of cat. But we're going to keep the spread and shape the same. All right, let's do it. The GDA model. OK, so given training data,","zh":"有一个不同的均值，但协方差相同。你现在可能会问，如果我们有不同的协方差怎么办？我们稍后再讨论这个问题。你不需要知道这一点。但目前，我们假设只是有不同的均值，并且我们想要这样做。因此，我们想要找到大象和猫的均值 mu。但我们保持分布的分散程度和形状相同。好的，让我们开始。高斯判别分析模型。好的，给定训练数据，","start":1434.84,"end":1461.16},{"id":141,"text":"xi and yi, like before, i lives in rd, yi lives in 01. We're going to assume as follows. We have y is going to be a class prior. This is our model of how we think about generating the data. How likely are cats versus elephants? If we have many, many elephants and a tiny number of cats or the other way around, we would encode that in this Bernoulli right here. That would be the weight that would come out. Then the idea is, intuitively, for the cats, which I'm making 0,","zh":"xi 和 yi，像之前一样，i 属于 rd，yi 属于 01。我们将假设如下。y 将作为类先验。这是我们对生成数据的模型。猫和大象哪个更可能？如果我们有很多大象和很少的猫，或者反过来，我们会在这个伯努利分布中编码这一点。这将是输出的权重。然后，直观的想法是，对于猫，我将其设为 0，","start":1462.81,"end":1492.31},{"id":142,"text":"We then draw according to the mu zero for the cats. So the cats are mu zero in this example, and they both have this fixed covariance. So they're drawing against that random model. This is how the data, as we talked about, we hypothesize a forward model, then we invert it. Perhaps not surprisingly, this is the distribution for the elephant features. The big difference is right here. They have different means. We wanted to wiggle the smallest amount possible.","zh":"我们根据猫的均值 mu 零进行抽样。在本例中，猫的均值是 mu 零，它们都有这个固定的协方差。因此，它们是在这个随机模型上进行抽样的。这就是我们之前讨论的数据，我们假设了一个前向模型，然后对其进行逆向处理。也许并不令人惊讶，这就是大象特征的分布。主要区别就在这里。它们有不同的均值。我们希望尽可能少地调整。","start":1493.18,"end":1522.24},{"id":143,"text":"That's pedagogical, not necessary.","zh":"这是教学性的，不是必要的。","start":1523.34,"end":1525.24},{"id":144,"text":"That's what GDA does.","zh":"这就是高斯判别分析所做的。","start":1525.58,"end":1526.62},{"id":145,"text":"Okay.","zh":"好的。","start":1527.9,"end":1528.42},{"id":146,"text":"So the takeaway assumption is the two classes share the same covariance,","zh":"所以，关键假设是两个类别共享相同的协方差，","start":1530.54,"end":1533.74},{"id":147,"text":"but they have different means, and now we want to find those means from data.","zh":"但它们有不同的均值，现在我们想从数据中找到这些均值。","start":1533.76,"end":1536.68},{"id":148,"text":"Okay, so let's write out the distributions.","zh":"好的，那么让我们写出这些分布。","start":1538.92,"end":1540.78},{"id":149,"text":"So here's the class prior.","zh":"这里是我们类别的先验概率。","start":1541.08,"end":1542.12},{"id":150,"text":"It says we're in the class with probability phi,","zh":"它表示我们以概率 phi 属于该类别，","start":1542.64,"end":1546.96},{"id":151,"text":"and we're in the other class with 1 minus phi,","zh":"以 1 减去 phi 的概率属于另一个类别，","start":1547.24,"end":1549.42},{"id":152,"text":"because it's Bernoulli.","zh":"因为这是伯努利分布。","start":1549.54,"end":1551.38},{"id":153,"text":"Here are the class conditional densities.","zh":"这里是类别条件密度。","start":1553.56,"end":1555.48},{"id":154,"text":"This is the next phase.","zh":"这是下一步。","start":1555.72,"end":1556.98},{"id":155,"text":"This is, say, for example, the cat.","zh":"比如说，这是猫。","start":1557.18,"end":1558.96},{"id":156,"text":"Why do I know it's the cat?","zh":"为什么我知道它是猫？","start":1559.14,"end":1560.02},{"id":157,"text":"Well, it's y given 0.","zh":"嗯，它是给定0的y。","start":1560.2,"end":1562.12},{"id":158,"text":"And then I have mu 0, mu 0.","zh":"然后我有mu 0，mu 0。","start":1563.08,"end":1564.68},{"id":159,"text":"Everything else is going to be the same when","zh":"当我接下来观察大象时，其他一切都会保持相同。","start":1565.08,"end":1566.5},{"id":160,"text":"I look at the elephant in a second.","zh":"到目前为止，一切顺利吗？","start":1566.5,"end":1567.98},{"id":161,"text":"So far, so good?","zh":"请。","start":1569.14,"end":1569.88},{"id":162,"text":"Please.","zh":"请。","start":1569.98,"end":1570.24},{"id":163,"text":"If I remember, if you have, like, the double circles","zh":"如果我记得没错，如果你有像两个圆圈这样的情况","start":1571.64,"end":1576.0},{"id":164,"text":"and like the ..","zh":"和像……","start":1576.0,"end":1576.78},{"id":165,"text":"So if you have the same covariates,","zh":"所以如果你有相同的协变量，","start":1577.26,"end":1578.94},{"id":166,"text":"maybe if you send those over, they have to be the same shape.","zh":"也许如果你把这些传递过去，它们的形状必须相同。","start":1578.96,"end":1581.2},{"id":167,"text":"Yeah, exactly right.","zh":"对，说得很对。","start":1581.56,"end":1582.48}],"notes":["本段主要介绍了高斯判别分析（GDA）的基本假设，即两个类别共享相同的协方差矩阵，但具有不同的均值。这是GDA模型的核心假设，用于区分不同类别的数据分布。","讲者提到，如果两个类别具有相同的协方差矩阵，那么它们的分布形状是相同的，只是均值不同。这种假设使得GDA模型在参数估计时更加简单，因为只需要估计均值和协方差矩阵。","讲者还提到，GDA模型的构建基于先验概率和条件概率的假设。先验概率表示数据属于某一类别的概率，而条件概率则描述了在给定类别标签的情况下，数据的分布。","在讲者举例中，他使用了猫和大象作为例子，说明如何通过均值和协方差矩阵来区分不同类别的数据。猫的均值为mu0，而大象的均值则不同。","讲者还提到，如果两个类别的协方差矩阵相同，那么它们的分布形状是相同的，只是位置不同。这种情况下，可以通过调整均值来区分不同类别。","最后，讲者提到，GDA模型的构建过程包括假设数据服从高斯分布，并通过最大似然估计来估计模型参数。"],"formulas":[],"uncertainties":["可能的术语错误：'double circles' 和 'like the ..' 可能是听不清或识别错误的术语。","可能的术语错误：'send those over' 可能是听不清或识别错误的术语。"],"diagram":"none","start":1403.31,"end":1582.48,"asr_flags":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":1403.31,"text":"But here, once you normalize appropriately, you get zero entries in there. And this is actually very useful when you're looking at data sources to decide, are they approximately independent? If you look at their inverse covariance matrix, this is actually a pretty reasonable test, which is a lecture that I gave last year or two years ago but shelved this year so we could make more deep learning, which is more important. Cool. Awesome. That is just for your interest. This is not stuff you need to know. OK. All right. Back to GDA."},{"start":1434.84,"text":"There's a different mean with the same covariance. Now, you could say, what if we have different covariances? We'll come back to that later. You don't need to know that. But right now, we're thinking we just have different means, and we want to do this. So we want to find mu of elephant and mu of cat. But we're going to keep the spread and shape the same. All right, let's do it. The GDA model. OK, so given training data,"},{"start":1462.81,"text":"xi and yi, like before, i lives in rd, yi lives in 01. We're going to assume as follows. We have y is going to be a class prior. This is our model of how we think about generating the data. How likely are cats versus elephants? If we have many, many elephants and a tiny number of cats or the other way around, we would encode that in this Bernoulli right here. That would be the weight that would come out. Then the idea is, intuitively, for the cats, which I'm making 0,"},{"start":1493.18,"text":"We then draw according to the mu zero for the cats. So the cats are mu zero in this example, and they both have this fixed covariance. So they're drawing against that random model. This is how the data, as we talked about, we hypothesize a forward model, then we invert it. Perhaps not surprisingly, this is the distribution for the elephant features. The big difference is right here. They have different means. We wanted to wiggle the smallest amount possible."},{"start":1523.34,"text":"That's pedagogical, not necessary."},{"start":1525.58,"text":"That's what GDA does."},{"start":1527.9,"text":"Okay."},{"start":1530.54,"text":"So the takeaway assumption is the two classes share the same covariance,"},{"start":1533.76,"text":"but they have different means, and now we want to find those means from data."},{"start":1538.92,"text":"Okay, so let's write out the distributions."},{"start":1541.08,"text":"So here's the class prior."},{"start":1542.64,"text":"It says we're in the class with probability phi,"},{"start":1547.24,"text":"and we're in the other class with 1 minus phi,"},{"start":1549.54,"text":"because it's Bernoulli."},{"start":1553.56,"text":"Here are the class conditional densities."},{"start":1555.72,"text":"This is the next phase."},{"start":1557.18,"text":"This is, say, for example, the cat."},{"start":1559.14,"text":"Why do I know it's the cat?"},{"start":1560.2,"text":"Well, it's y given 0."},{"start":1563.08,"text":"And then I have mu 0, mu 0."},{"start":1565.08,"text":"Everything else is going to be the same when"},{"start":1566.5,"text":"I look at the elephant in a second."},{"start":1569.14,"text":"So far, so good?"},{"start":1569.98,"text":"Please."},{"start":1571.64,"text":"If I remember, if you have, like, the double circles"},{"start":1576.0,"text":"and like the .."},{"start":1577.26,"text":"So if you have the same covariates,"},{"start":1578.96,"text":"maybe if you send those over, they have to be the same shape."},{"start":1581.56,"text":"Yeah, exactly right."}],"speech_gaps":[],"frame":"../frames/v054/009.webp","frame_time":1415.31},{"title":"高斯判别分析中的协方差与均值假设","segments":[{"id":168,"text":"Let me go back to that for one second just so I can show it to you. How do I do this?","zh":"让我再回到这一点，就一会儿，这样我就可以把它展示给你看。我是怎么做到的？","start":1582.48,"end":1586.32},{"id":169,"text":"I know why it's not working. Got it. It's 121. This is it.","zh":"我知道为什么它没起作用。明白了。它是121。这就是它。","start":1588.44,"end":1593.42},{"id":170,"text":"So what I'm saying here, this diagram did it implicitly. These contours and these contours","zh":"所以，我在这里想说的是，这张图已经隐含地完成了这个任务。这些等高线和这些等高线","start":1594.62,"end":1600.1},{"id":171,"text":"are meant to be the same because the covariance is the same. So both their orientation, how they're","zh":"本应是相同的，因为协方差是相同的。因此，它们的方向，旋转方式，以及主轴和其他轴的强度，大小都是一样的","start":1600.1,"end":1605.6},{"id":172,"text":"rotated, and the strength, the size of the principal and the other axes are the same","zh":"对于两者来说。而我们试图找到的只是这两个点，星号","start":1605.6,"end":1611.44},{"id":173,"text":"for both of them. And what we're trying to find are just these two points star,","zh":"非常好的问题。问题是，这看起来像是一个荒谬的假设。我知道你没有这么说，但没关系。这看起来像是一个荒谬的假设。比如，显然大象和猫有不同的变异。我会说，你说得对。但问题是，我们在这一练习中建模的是什么？现在我们建模的是它们的方差大致相同。存在某种方差，我们将进行拟合。这种方差在两者之间是相同的，我们将使用它。你将会看到这种假设在距离计算中如何体现。稍后我们会看到。","start":1611.44,"end":1615.06},{"id":174,"text":"Awesome question. So the question is, this seems like a ridiculous assumption. I know you didn't say that, but fine. This seems like a ridiculous assumption. Like clearly the elephants have different variants than the cats. And I would say, you're right. But it's a question for which, what are we modeling in this exercise? And right now we're modeling that they have about the same variance. There exists some variance that we're going to fit. That's the same across both, which we're going to use. And you'll see how this falls out in the distance. We'll see in a little bit.","zh":"正是因为你刚才提出的问题。如果我想有不同的协方差，这就需要我们在估计过程中添加几条额外的线。因此，是的，你可以建模这一点。但这是一种建模选择。你可能会决定这不值得。顺便说一句，拟合协方差并不便宜。它有很多参数，对吧？如果你有一个非常高维的特征向量，比如d非常大，那么协方差就是d平方。现在它就像d选2除以1，因为这是对称性假设，对吧？你不需要做那些下面的事情。","start":1615.22,"end":1617.16},{"id":175,"text":"exactly for the reason you just asked. What if I want to have different covariance? It's going to require a couple of extra lines that we put into the estimation procedure that we have. And so yes, you could model that. But it's a modeling choice. You may decide it's not worth it. And by the way, fitting the covariance is not cheap. It's got a lot of parameters, right? If you have a really high dimensional feature vector, like d is very, very large, then the covariance is d squared. Now it's like d choose 2 over 1 because this is the symmetry assumption, right? You don't have to do things below that.","zh":"正是你刚才所问的原因。如果我想有不同的协方差，这就需要我们在现有的估计过程中添加几行额外的代码。因此，是的，你可以建模这种情况。但这是一种建模选择。你可能会决定这并不值得。顺便说一句，拟合协方差并不便宜。它有很多参数，对吧？如果你有一个非常高维的特征向量，比如d非常大，那么协方差就是d平方。现在它类似于从d中选择2个元素除以1，因为这是对称性假设，对吧？你不需要处理低于那个的部分。","start":1622.06,"end":1644.72},{"id":176,"text":"exactly for the reason you just asked. What if I want to have different covariance? It's going to require a couple of extra lines that we put into the estimation procedure that we have. And so yes, you could model that. But it's a modeling choice. You may decide it's not worth it. And by the way, fitting the covariance is not cheap. It's got a lot of parameters, right? If you have a really high dimensional feature vector, like d is very, very large, then the covariance is d squared. Now it's like d choose 2 over 1 because this is the symmetry assumption, right? You don't have to do things below that.","zh":"正是因为你刚才问的原因。如果我想有不同的协方差，这就需要我们在估计过程中添加几行额外的代码。因此，是的，你可以建模这种情况。但这是一种建模选择。你可能会决定这不值得。顺便说一句，拟合协方差并不便宜。它有很多参数，对吧？如果你有一个非常高维的特征向量，比如d非常大，那么协方差就是d平方。现在它就像d选2除以1，因为这是对称性假设，对吧？你不需要做那些下面的事情。","start":1645.18,"end":1674.18},{"id":177,"text":"But there's still a lot more parameters. And the question is, is it worth it? And in many applications, the answer is maybe not. And so we're going to start with this one first. Wonderful question. Okay. Okay. All right. We're back here. Okay. All right. These are phenomenal questions. Please keep them coming. All right. Now...","zh":"但还有更多的参数。问题是，这是否值得？在许多应用中，答案可能是不值得。因此，我们将首先从这个模型开始。非常好的问题。好的。好的。我们回到这里。好的。好的。这些问题非常棒。请继续提问。好的。现在……","start":1675.18,"end":1698.61},{"id":178,"text":"Notice that because of this kind of cooking show and was highlighted that we're only changing this one mean, all that's changed are the entries of mu here, the means. But otherwise, these two distributions look the same. The other way they're asymmetric is this. We allow to have many more cats and many more elephants. Let's imagine you had a data set. Why would that happen intuitively? Let's imagine you have a data set where you have a million cats and one elephant.","zh":"请注意，由于这种烹饪节目和之前强调的，我们只改变了这个均值，因此这里改变的仅仅是mu的各个条目，即均值。否则，这两个分布看起来是一样的。它们不对称的另一种方式是这样的：我们允许有更多的猫和更多的大象。让我们想象你有一个数据集。为什么会这样呢？让我们想象你有一个数据集，其中有一百万只猫和一只大象。","start":1699.25,"end":1725.51},{"id":179,"text":"That was what you saw. The ratio is a million to one. So intuitively, if it's on the border.","zh":"这就是你所看到的。比例是一百万比一。因此，直观上，如果它处于猫和大象大小的边界上，你可能会认为它是猫，因为你会想，哦，几乎总是有猫。如果它甚至稍微不太可能，这两种事物之间的权重就会通过贝叶斯规则显现出来。所以请注意这一点。因此，这里发生的一种非平凡的事情就是这个。或者说，我所说的两种非平凡的事情是：均值不同，我们允许总体规模不同。这就是整个模型。","start":1727.15,"end":1732.93},{"id":180,"text":"between the elephant size and the cat size, you're probably going to think it's a cat because you're like, oh, there's almost always cats. If it's even remotely unlikely, that weighting between the two things will come out through Bayes' rule. And so pay attention to that. So that's the one kind of non-trivial thing that's happening here. Or I say the two non-trivial things are the means are different and we allow the population sizes to be different. And that's the whole model.","zh":"这就是你所看到的。比例是一百万比一。因此，直观上，如果它处于猫和大象大小的边界上，你可能会认为它是猫，因为你会想，哦，几乎总是有猫。如果它甚至稍微不太可能，这两种事物之间的权重就会通过贝叶斯规则显现出来。所以请注意这一点。因此，这里发生的一种非平凡的事情就是这个。或者说，我所说的两种非平凡的事情是：均值不同，我们允许总体规模不同。这就是整个模型。","start":1734.23,"end":1758.29}],"notes":["本段讨论了高斯判别分析中协方差矩阵的假设，即两个类别的协方差矩阵相同。这是模型的一个关键假设，但被指出可能不合理，例如大象和猫的变异可能不同。然而，这种假设简化了模型，使得参数估计更加容易。讲者提到，如果允许不同的协方差矩阵，需要在估计过程中增加额外的步骤，但这也增加了模型的复杂性和计算成本。","讲者进一步解释了在高维数据中，协方差矩阵的参数数量会显著增加，例如当特征维度d很大时，协方差矩阵的参数数量为d²。因此，是否采用这种更复杂的模型取决于具体应用场景，通常在实际应用中可能不值得。","此外，讲者还讨论了在高斯判别分析中，除了均值不同外，允许不同类别的样本数量不同。这种差异会影响贝叶斯规则中的权重，从而影响分类结果。例如，当一个类别样本数量远多于另一个类别时，即使样本特征相似，分类器也会倾向于将新样本归为样本数量较多的类别。","讲者通过一个例子说明了这种现象：假设数据集中有100万只猫和1只大象，那么即使新样本的特征在大象和猫之间，分类器也会倾向于将其归为猫，因为猫的样本数量远多于大象。这种现象是贝叶斯规则中先验概率影响分类结果的体现。","最后，讲者指出，高斯判别分析模型的核心假设包括：两个类别的协方差矩阵相同，均值不同，以及样本数量可能不同。这些假设使得模型在参数估计和分类过程中具有一定的简化和可解释性。","讲者鼓励学生继续提问，并强调了在实际应用中，模型选择和假设的合理性是需要权衡的，特别是在高维数据和复杂场景下。"],"formulas":[{"latex":"d^2","symbols":"特征维度d的平方","explanation":"保持原式，d的平方是正确的数学表达，用于表示协方差矩阵的参数数量。","evidence":"Awesome question. So the question is, this seems like a ridiculous assumption. I know you didn't say that, but fine. This seems like a ridiculous assumption. Like clearly the elephants have different variants than the cats. And I would say, you're right. But it's a question for which, what are we modeling in this exercise? And right now we're modeling that they have about the same variance. There exists some variance that we're going to fit. That's the same across both, which we're going to use. And you'll see how this falls out in the distance. We'll see in a little bit."}],"uncertainties":["cooking show"],"diagram":"none","start":1582.48,"end":1758.29,"asr_flags":[],"math_clarifications":["原文提到在对称性假设下，协方差矩阵的参数数量为d^2，但未明确说明组合数d choose 2与该参数数量的关系，因此无法核定该公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":13,"raw_segments":[{"start":1582.48,"text":"Let me go back to that for one second just so I can show it to you. How do I do this?"},{"start":1588.44,"text":"I know why it's not working. Got it. It's 121. This is it."},{"start":1594.62,"text":"So what I'm saying here, this diagram did it implicitly. These contours and these contours"},{"start":1600.1,"text":"are meant to be the same because the covariance is the same. So both their orientation, how they're"},{"start":1605.6,"text":"rotated, and the strength, the size of the principal and the other axes are the same"},{"start":1611.44,"text":"for both of them. And what we're trying to find are just these two points star,"},{"start":1615.22,"text":"the porn star and the gray star."},{"start":1622.06,"text":"Awesome question. So the question is, this seems like a ridiculous assumption. I know you didn't say that, but fine. This seems like a ridiculous assumption. Like clearly the elephants have different variants than the cats. And I would say, you're right. But it's a question for which, what are we modeling in this exercise? And right now we're modeling that they have about the same variance. There exists some variance that we're going to fit. That's the same across both, which we're going to use. And you'll see how this falls out in the distance. We'll see in a little bit."},{"start":1645.18,"text":"exactly for the reason you just asked. What if I want to have different covariance? It's going to require a couple of extra lines that we put into the estimation procedure that we have. And so yes, you could model that. But it's a modeling choice. You may decide it's not worth it. And by the way, fitting the covariance is not cheap. It's got a lot of parameters, right? If you have a really high dimensional feature vector, like d is very, very large, then the covariance is d squared. Now it's like d choose 2 over 1 because this is the symmetry assumption, right? You don't have to do things below that."},{"start":1675.18,"text":"But there's still a lot more parameters. And the question is, is it worth it? And in many applications, the answer is maybe not. And so we're going to start with this one first. Wonderful question. Okay. Okay. All right. We're back here. Okay. All right. These are phenomenal questions. Please keep them coming. All right. Now..."},{"start":1699.25,"text":"Notice that because of this kind of cooking show and was highlighted that we're only changing this one mean, all that's changed are the entries of mu here, the means. But otherwise, these two distributions look the same. The other way they're asymmetric is this. We allow to have many more cats and many more elephants. Let's imagine you had a data set. Why would that happen intuitively? Let's imagine you have a data set where you have a million cats and one elephant."},{"start":1727.15,"text":"That was what you saw. The ratio is a million to one. So intuitively, if it's on the border."},{"start":1734.23,"text":"between the elephant size and the cat size, you're probably going to think it's a cat because you're like, oh, there's almost always cats. If it's even remotely unlikely, that weighting between the two things will come out through Bayes' rule. And so pay attention to that. So that's the one kind of non-trivial thing that's happening here. Or I say the two non-trivial things are the means are different and we allow the population sizes to be different. And that's the whole model."}],"speech_gaps":[],"frame":"../frames/v054/010.webp","frame_time":1594.48},{"title":"高斯判别分析中的假设与模型能力","segments":[{"id":181,"text":"Please. Awesome question. Yeah, so the question is, do you assume if you're using Bayes' rule implicitly that this now is a higher assumption? So what are we assuming carries over? And we're really making some pretty strong assumptions here in terms of what carries over. But again, remember, they're not true or false. They're like, how bad are they? They're always going to be bad, but how bad are they?","zh":"请。非常好的问题。是的，所以问题是，如果你在隐式地使用贝叶斯规则，你是否假设现在有了更高的假设？那么我们假设什么会延续下来呢？我们在这些方面做了一些相当强的假设。但请记住，它们不是对错的问题，而是它们有多糟糕。它们总是会出错，但有多糟糕呢？","start":1759.2,"end":1781.22},{"id":182,"text":"So if, for example, we trained on a very skewed data set where we have that million cats and that one elephant, and then at test time, we're shown cats and elephants from a population that are effectively the same, we're going to make errors. We're going to make some class of errors when we get those elephants and cats that we're going to always assign in this example or more frequently assign them to the cat class, when honestly, we should have been more open-minded that they're just really small elephants.","zh":"例如，如果我们训练在一个非常偏斜的数据集上，其中有一百万只猫和一只大象，而在测试时，我们看到的猫和大象来自一个实际上几乎相同的种群，我们会犯错误。当我们遇到这些大象和猫时，我们会犯某一类错误，我们会总是将它们归类为猫，或者更频繁地归类为猫，而实际上，我们应该更开放地认为它们只是很小的大象。","start":1781.9,"end":1804.1},{"id":183,"text":"The other here is we have to assume that the means that we observe are somehow concentrating. There's a fancy word that basically means that what we're assuming in the distribution is we've seen enough to estimate these parameters appropriately. That means that our model, for example, even if it were shown a billion more elephants, it doesn't have the resolution potentially to move the center too much. It's not going to make too much of a difference. So the other implicit assumption in there is how much data do we have to actually learn from? And then to what extent does it count?","zh":"另一个方面是我们必须假设观察到的均值在某种程度上是集中的。有一个更专业的词，基本上意味着我们在分布中所做的假设是，我们已经看到足够多的数据来适当地估计这些参数。这意味着我们的模型，例如，即使它看到了十亿只更多的大象，它可能也没有足够的分辨能力来大幅移动中心。这不会产生太大的影响。因此，其中另一个隐含的假设是，我们需要多少数据才能真正学习到这些内容？以及这些数据在多大程度上是有效的？","start":1806.06,"end":1835.64},{"id":184,"text":"carry over. But those are the things that we're assuming. We assume that the training and test data sets are representative in that way. Wonderful points. Those are exactly the right questions to ask. What am I assuming about my train to test time? And then what capacity of model am I using, and why am I doing that? These are the absolute core questions in machine learning. Awesome. More questions? Please. There are maybe more caps than there are elephants. That's security .","zh":"延续下来。但这些都是我们所假设的。我们假设训练数据集和测试数据集在这一点上是具有代表性的。非常好的问题。这些正是应该提出的问题。我在训练到测试的时间上假设了什么？我使用了多大的模型容量，为什么这样做？这些是机器学习中的绝对核心问题。太棒了。还有更多问题吗？请。可能有比大象更多的模型容量。这是安全。","start":1835.66,"end":1865.6},{"id":185,"text":"It could, right? So the question is, where does that come up here? It comes up effectively in this class probability. So if you imagine, so the question is, what if there are a lot more cats? If there are a lot more cats, as we said, we're going to come out with a probability that we're in class. Our prior distribution that's in the class is just going to be a lot harder. That means intuitively, we should expect to have to take more evidence, all things being equal, that we're going to conclude a given point is an elephant. And although Bayes' rule, I think, when you kind of learn this stuff, feels like some mechanically strange... rule. That's the magic that it's doing. It's telling you how to weight those two evidence pieces in a Bayesian optimal way. Too much words. Just a fine way. It's a rule to do it.","zh":"对吧？所以问题是，这种情况在这里会出现吗？它实际上出现在这个类别的概率中。所以如果你想象一下，问题是，如果有更多的猫呢？正如我们所说，我们会得出一个我们处于某个类别的概率。我们在这个类别中的先验分布将会变得更为困难。也就是说，直观上，我们应当预期，在其他条件相同的情况下，我们需要更多的证据才能得出某个点是大象的结论。尽管贝叶斯规则，我想，当你学习这些内容时，会觉得它是一个有些机械奇怪的规则。这就是它的魔力所在。它告诉你如何以贝叶斯最优的方式权衡这两方面的证据。说得太多了。只是个精细的方法。它就是一个执行这个任务的规则。","start":1866.97,"end":1896.37},{"id":186,"text":"rule. That's the magic that it's doing. It's telling you how to weight those two evidence pieces in a Bayesian optimal way. Too much words. Just a fine way. It's a rule to do it. Perfect. Good questions. Others? Fantastic, folks. All right. Let's keep going. All right. Oh, I should have just scrolled to the next chart. I'm sorry. That was my mistake. You were asking about this question. I was right here. All right.","zh":"规则。这就是它所做的魔力。它告诉你如何以贝叶斯最优的方式权衡这两方面的证据。说得太多了。只是个精细的方法。它就是一个执行这个任务的规则。很好。好的问题。还有其他人吗？太棒了，大家。好的。我们继续吧。好的。哦，我应该直接滚动到下一个图表了。抱歉。那是我的错误。你是在问这个问题。我刚才就在这里。好的。","start":1896.42,"end":1922.04}],"notes":["本段讨论了高斯判别分析中隐含的假设，特别是关于数据集的代表性以及模型对参数估计的依赖性。讲者指出，模型假设训练数据和测试数据具有代表性，且在数据量足够时，模型能够准确估计参数。然而，模型的分辨率有限，即使在数据量增加的情况下，参数估计的变动也可能有限。","讲者进一步解释了先验分布对分类结果的影响，特别是在类别不平衡的情况下，如猫和大象的分布差异。当某一类样本数量远多于另一类时，模型的先验分布会偏向于该类，从而影响分类结果。","讲者提到贝叶斯规则的作用，即如何在分类过程中合理地权衡先验和似然信息。贝叶斯规则通过一种最优的方式，将先验和证据结合起来，从而做出分类决策。","讲者强调了模型容量和数据量之间的关系，指出模型需要足够的数据来学习并准确估计参数。同时，模型的容量决定了其对数据变化的敏感程度，即模型是否能够捕捉到数据中的细微差异。","讲者还提到，贝叶斯规则虽然在学习过程中可能显得机械或复杂，但其核心在于提供一种系统的方法来处理不确定性，从而在分类任务中做出最优决策。","最后，讲者指出，这些假设和问题构成了机器学习的核心，即模型在训练和测试阶段的假设，以及模型容量的选择，都是构建有效学习系统的关键因素。"],"formulas":[],"uncertainties":["carry over"],"diagram":"none","start":1759.2,"end":1922.04,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1759.2,"text":"Please. Awesome question. Yeah, so the question is, do you assume if you're using Bayes' rule implicitly that this now is a higher assumption? So what are we assuming carries over? And we're really making some pretty strong assumptions here in terms of what carries over. But again, remember, they're not true or false. They're like, how bad are they? They're always going to be bad, but how bad are they?"},{"start":1781.9,"text":"So if, for example, we trained on a very skewed data set where we have that million cats and that one elephant, and then at test time, we're shown cats and elephants from a population that are effectively the same, we're going to make errors. We're going to make some class of errors when we get those elephants and cats that we're going to always assign in this example or more frequently assign them to the cat class, when honestly, we should have been more open-minded that they're just really small elephants."},{"start":1806.06,"text":"That can definitely happen. The other here is we have to assume that the means that we observe are somehow concentrating. There's a fancy word that basically means that what we're assuming in the distribution is we've seen enough to estimate these parameters appropriately. That means that our model, for example, even if it were shown a billion more elephants, it doesn't have the resolution potentially to move the center too much. It's not going to make too much of a difference. So the other implicit assumption in there is how much data do we have to actually learn from? And then to what extent does it count?"},{"start":1835.66,"text":"carry over. But those are the things that we're assuming. We assume that the training and test data sets are representative in that way. Wonderful points. Those are exactly the right questions to ask. What am I assuming about my train to test time? And then what capacity of model am I using, and why am I doing that? These are the absolute core questions in machine learning. Awesome. More questions? Please. There are maybe more caps than there are elephants. That's security ."},{"start":1866.97,"text":"It could, right? So the question is, where does that come up here? It comes up effectively in this class probability. So if you imagine, so the question is, what if there are a lot more cats? If there are a lot more cats, as we said, we're going to come out with a probability that we're in class. Our prior distribution that's in the class is just going to be a lot harder. That means intuitively, we should expect to have to take more evidence, all things being equal, that we're going to conclude a given point is an elephant. And although Bayes' rule, I think, when you kind of learn this stuff, feels like some mechanically strange..."},{"start":1896.42,"text":"rule. That's the magic that it's doing. It's telling you how to weight those two evidence pieces in a Bayesian optimal way. Too much words. Just a fine way. It's a rule to do it. Perfect. Good questions. Others? Fantastic, folks. All right. Let's keep going. All right. Oh, I should have just scrolled to the next chart. I'm sorry. That was my mistake. You were asking about this question. I was right here. All right."}],"speech_gaps":[],"frame":"../frames/v054/011.webp","frame_time":1771.2},{"title":"高斯判别分析与概率模型","segments":[{"id":187,"text":"So this is what we're trying to do. We're trying to get mu0, the cats, this character, mu1, the elephants, this character, and just get the means. I raised a bunch of issues about this, so I'm not going to go through it again, but please feel free to do it. The fact that there's shared covariance means that you could cut and paste and recolor these ellipses that are around each of the means. Cool? All right, so we need to learn these four things. The class prior, what fraction are elephants, and implicitly, what fraction are cats, since we only have two classes.","zh":"所以这就是我们试图做的事情。我们试图得到mu0，也就是猫的均值，mu1，也就是大象的均值，仅仅得到这些均值。我之前已经提出了很多问题，所以我不再重复了，但请随时去做。存在共享协方差意味着你可以复制并重新着色围绕每个均值的椭圆。明白吗？好的，我们需要学习这四个内容。类别先验，也就是大象所占的比例，以及隐含地，猫所占的比例，因为我们只有两个类别。","start":1923.05,"end":1953.86},{"id":188,"text":"mu0, the mean of the cat features, mu1, the mean of the elephant features, and sigma, their shared covariance matrix. Now, compare this with logistic regression. Here, we had only these D plus 1 features. GDA models much, much more structure. And we're paying for that structure, as I alluded to earlier.","zh":"mu0，即猫特征的均值，mu1，即大象特征的均值，以及sigma，它们的共享协方差矩阵。现在，与逻辑回归相比，这里我们只有D加1个特征。GDA模型了更多的结构。正如我之前提到的，我们为此结构付出了代价。","start":1955.42,"end":1983.92},{"id":189,"text":"We're finding the means of each of these classes, okay?","zh":"我们正在寻找每个类别的均值，对吧？","start":1985.41,"end":1988.25},{"id":190,"text":"Those are like not very different.","zh":"这些差异不大。","start":1988.35,"end":1989.93},{"id":191,"text":"Those are like the thetas we had from before, roughly, right?","zh":"这些就像我们之前提到的theta，大致如此，对吧？","start":1989.99,"end":1992.03},{"id":192,"text":"They're about the same.","zh":"它们差不多。","start":1992.13,"end":1992.65},{"id":193,"text":"They are the same size and shape.","zh":"它们的大小和形状是一样的。","start":1992.71,"end":1993.67},{"id":194,"text":"Maybe differ by one because we don't have the plus one.","zh":"也许因为没有加一而相差一点。","start":1993.73,"end":1996.37},{"id":195,"text":"And we're also going to get this covariance matrix.","zh":"我们还将得到这个协方差矩阵。","start":1997.45,"end":1999.35},{"id":196,"text":"Why do we need...","zh":"为什么我们需要……","start":1999.57,"end":2000.43},{"id":197,"text":"I don't know what I just did.","zh":"我不知道我刚才做了什么。","start":2000.43,"end":2001.55},{"id":198,"text":"Took a picture.","zh":"拍了一张照片。","start":2001.69,"end":2002.37},{"id":199,"text":"I want to remember this moment forever, I guess.","zh":"我想永远记住这个时刻。","start":2002.51,"end":2005.27},{"id":200,"text":"What the heck?","zh":"见鬼了！","start":2006.15,"end":2006.83},{"id":201,"text":"All right, good.","zh":"好的，很好。","start":2006.97,"end":2007.49},{"id":202,"text":"I didn't know what gesture that is.","zh":"我不知道那个手势是什么意思。","start":2007.97,"end":2010.07},{"id":203,"text":"So if we do that again, we'll all be surprised and excited, all right?","zh":"所以如果我们再次这样做，我们都会感到惊讶和兴奋，对吧？","start":2010.13,"end":2013.27},{"id":204,"text":"Okay, so this covariance, why do we need that intuitively? Why can't we just use the means?","zh":"好的，那么这个协方差，我们为什么需要它呢？从直觉上讲，为什么不能只使用均值？","start":2013.27,"end":2021.09},{"id":205,"text":"Exactly right. The point is you can't get the shape to get a distribution. You have to when","zh":"你说得完全正确。关键是，你无法仅凭形状来获得一个分布。当你有两点存在，比如你的两个均值时，你想要有一种方法，让中间的点能够分配概率，从而进行概率估计。","start":2030.79,"end":2035.67},{"id":206,"text":"you have two points that are there, like your two means, you want to have some way of a point","zh":"当你有两个点存在，比如你的两个均值时，你想要有一种方法，让中间的点能够分配概率，从而进行概率估计。","start":2035.67,"end":2040.47},{"id":207,"text":"in the middle, being able to assign the probability to it so we can run our probabilistic estimate.","zh":"你可以在中间的点上分配概率，这样我们就可以进行概率估计。","start":2040.47,"end":2045.41},{"id":208,"text":"You could just take a distance, a flat distance. That would be what you would do if you did the","zh":"你可以简单地使用一个距离，一个平坦的距离。这将是如果你使用恒等函数所做的事。","start":2045.83,"end":2051.01},{"id":209,"text":"identity function. But since we want this probabilistic interpretation, that identity","zh":"但是因为我们想要这种概率解释，这个恒等函数实际上就是一个标准高斯分布。这就是它归结为的内容。我们希望它能够归一化。","start":2051.01,"end":2054.57},{"id":210,"text":"function is just a standard Gaussian. That's what it boils down to. We want it to normalize.","zh":"这就是它归结为的内容。我们希望它能够归一化。","start":2054.57,"end":2059.51},{"id":211,"text":"We want it to tail off. We want it to be bounded, all the rest. We don't have to decide. The Gaussian","zh":"我们希望它逐渐衰减。我们希望它是有界的，其余的不用考虑。我们不需要做出决定。高斯分布","start":2059.55,"end":2063.71},{"id":212,"text":"doesn't make us decide that it only works in a fixed range. You could say, I only want a","zh":"不会迫使我们决定它只在固定范围内起作用。你可以这样说，我只想有一个","start":2063.71,"end":2068.79},{"id":213,"text":"distribution over distances 0 to 5.","zh":"在距离0到5之间的分布。","start":2068.79,"end":2070.53},{"id":214,"text":"All kinds of weird things. The Gaussian is just kind of nice and simple.","zh":"各种奇怪的情况。高斯分布只是简单而优雅的。","start":2070.69,"end":2072.85},{"id":215,"text":"But it lets us then still","zh":"但这样我们仍然","start":2072.99,"end":2074.39},{"id":216,"text":"have a valid probability distribution.","zh":"可以有一个有效的概率分布。","start":2074.39,"end":2076.21},{"id":217,"text":"Okay.","zh":"好的。","start":2077.41,"end":2077.77},{"id":218,"text":"Alright.","zh":"好的。","start":2078.15,"end":2078.51},{"id":219,"text":"That was a potentially low class segue into maximum likelihood. The reason we needed the sigmas and all the rest is so we could have likelihood functions and run the probabilistic machinery. All right. All right. Here's that probabilistic machinery. You've seen this before. All right. Given data, XIYI, we're going to write a joint likelihood function.","zh":"那是一个潜在的低阶过渡，进入最大似然估计。我们需要这些sigma以及其他内容的原因是为了能够拥有似然函数并运行概率机制。好了。好了。这就是那个概率机制。你之前已经见过这个了。好了。给定数据XIYI，我们将写出一个联合似然函数。","start":2080.49,"end":2100.07}],"notes":["本段讨论了高斯判别分析（GDA）中协方差矩阵的必要性。讲者指出，仅使用均值无法捕捉数据分布的形状，因此需要协方差矩阵来描述数据的分布特性。讲者提到，如果仅使用均值，无法对中间点进行概率分配，从而无法进行概率估计。因此，协方差矩阵是构建概率模型的关键部分。","讲者进一步解释了为什么需要使用高斯分布来建模数据。他指出，使用高斯分布可以自然地引入概率解释，例如分布的尾部衰减和有界性。高斯分布的简单性和灵活性使其成为建模数据分布的首选方法。","讲者提到，高斯分布不需要人为限制其作用范围，这与某些其他分布不同。他指出，高斯分布可以自然地处理各种距离范围，而无需人为设定边界。","讲者强调，使用高斯分布可以确保概率分布的有效性。即使数据分布复杂，高斯分布也能提供一个合理的概率模型，从而支持后续的统计推断和机器学习任务。","讲者最后提到，高斯分布的使用使得模型能够处理各种数据分布情况，而不仅仅是固定范围内的数据。这种灵活性是高斯判别分析的一个重要优势。"],"formulas":[],"uncertainties":["you have two points that are there, like your two means, you want to have some way of a point","you could just take a distance, a flat distance. That would be what you would do if you did the","that identity function is just a standard Gaussian. That's what it boils down to. We want it to normalize."],"diagram":"none","start":1923.05,"end":2100.07,"asr_flags":[],"translation_complete":true,"translated_segments":33,"raw_segments":[{"start":1923.05,"text":"So this is what we're trying to do. We're trying to get mu0, the cats, this character, mu1, the elephants, this character, and just get the means. I raised a bunch of issues about this, so I'm not going to go through it again, but please feel free to do it. The fact that there's shared covariance means that you could cut and paste and recolor these ellipses that are around each of the means. Cool? All right, so we need to learn these four things. The class prior, what fraction are elephants, and implicitly, what fraction are cats, since we only have two classes."},{"start":1955.42,"text":"mu0, the mean of the cat features, mu1, the mean of the elephant features, and sigma, their shared covariance matrix. Now, compare this with logistic regression. Here, we had only these D plus 1 features. GDA models much, much more structure. And we're paying for that structure, as I alluded to earlier."},{"start":1985.41,"text":"We're finding the means of each of these classes, okay?"},{"start":1988.35,"text":"Those are like not very different."},{"start":1989.99,"text":"Those are like the thetas we had from before, roughly, right?"},{"start":1992.13,"text":"They're about the same."},{"start":1992.71,"text":"They are the same size and shape."},{"start":1993.73,"text":"Maybe differ by one because we don't have the plus one."},{"start":1997.45,"text":"And we're also going to get this covariance matrix."},{"start":1999.57,"text":"Why do we need..."},{"start":2000.43,"text":"I don't know what I just did."},{"start":2001.69,"text":"Took a picture."},{"start":2002.51,"text":"I want to remember this moment forever, I guess."},{"start":2006.15,"text":"What the heck?"},{"start":2006.97,"text":"All right, good."},{"start":2007.97,"text":"I didn't know what gesture that is."},{"start":2010.13,"text":"So if we do that again, we'll all be surprised and excited, all right?"},{"start":2013.27,"text":"Okay, so this covariance, why do we need that intuitively? Why can't we just use the means?"},{"start":2030.79,"text":"Exactly right. The point is you can't get the shape to get a distribution. You have to when"},{"start":2035.67,"text":"you have two points that are there, like your two means, you want to have some way of a point"},{"start":2040.47,"text":"in the middle, being able to assign the probability to it so we can run our probabilistic estimate."},{"start":2045.83,"text":"You could just take a distance, a flat distance. That would be what you would do if you did the"},{"start":2051.01,"text":"identity function. But since we want this probabilistic interpretation, that identity"},{"start":2054.57,"text":"function is just a standard Gaussian. That's what it boils down to. We want it to normalize."},{"start":2059.55,"text":"We want it to tail off. We want it to be bounded, all the rest. We don't have to decide. The Gaussian"},{"start":2063.71,"text":"doesn't make us decide that it only works in a fixed range. You could say, I only want a"},{"start":2068.79,"text":"distribution over distances 0 to 5."},{"start":2070.69,"text":"All kinds of weird things. The Gaussian is just kind of nice and simple."},{"start":2072.99,"text":"But it lets us then still"},{"start":2074.39,"text":"have a valid probability distribution."},{"start":2077.41,"text":"Okay."},{"start":2078.15,"text":"Alright."},{"start":2080.49,"text":"That was a potentially low class segue into maximum likelihood. The reason we needed the sigmas and all the rest is so we could have likelihood functions and run the probabilistic machinery. All right. All right. Here's that probabilistic machinery. You've seen this before. All right. Given data, XIYI, we're going to write a joint likelihood function."}],"speech_gaps":[{"start":2023.408,"end":2025.68},{"start":2028.4,"end":2030.39}],"frame":"../frames/v054/012.webp","frame_time":1935.05},{"title":"高斯判别分析中的联合分布与模型构建","segments":[{"id":220,"text":"Here's our likelihood function. What is it doing? It's taking all the parameters that are in there","zh":"这里是我们的似然函数。它在做什么？它正在根据该模型以某种方式对其中的所有参数进行评分。","start":2101.3,"end":2106.2},{"id":221,"text":"and it's scoring them in some way according to that model. And I've been a little bit remiss","zh":"我在这里有点疏忽了。我没有在参数旁边写出所有的分号。我之前已经提醒过你们，但请注意这些概率是相对于这些参数而言的。","start":2106.2,"end":2112.08},{"id":222,"text":"here. I didn't write all the semicolons with all the parameters on the side. I warned you","zh":"现在，为什么我们能够将它们写成一个乘积？独立同分布（IID）假设为我们做了很多工作，对吧？","start":2112.08,"end":2115.96},{"id":223,"text":"about this in advance, but be aware these probabilities are with respect to these","zh":"第二个，我们进行了这种分解。好吧，这就是贝叶斯法则，对吧？我们可以在每个项上这样做，不需要做任何假设。","start":2115.96,"end":2119.52},{"id":224,"text":"parameters. Now, why were we able to write them as a product? The IID assumption did a lot of","zh":"好的，我们将对 $ x $ 和 $ y $ 的联合分布 $ P $ 进行建模，而不仅仅是 $ P $ 的 $ y $，$ x $。","start":2119.52,"end":2129.62},{"id":225,"text":"work for us right there, okay? Second one, we did this factorization. Well, this is Bayes' rule,","zh":"这对我们来说就足够了，对吧？第二个，我们进行了这个分解。嗯，这就是贝叶斯法则，","start":2129.62,"end":2134.9},{"id":226,"text":"okay? We can do that every time on a term. We don't have to assume anything.","zh":"对吧？我们可以在每个项上这样做。我们不需要做任何假设。","start":2135.1,"end":2137.92},{"id":227,"text":"Okay, so we're going to model the joint distribution P of x, y, not just P of y, x,","zh":"好的，因此我们将对 x 和 y 的联合分布 P 进行建模，而不仅仅是 P(y|x)，","start":2140.88,"end":2147.66},{"id":228,"text":"okay? There is, just as an aside, if you look up in the literature, there are things called","zh":"好的？顺便提一下，在文献中，有一些被称为能量模型（energy models）的东西，它们直接建模这种关系，尤其是在像扩散（diffusion）这样的领域，","start":2147.72,"end":2151.68},{"id":229,"text":"energy models, which do model this directly, especially for things like diffusion, which is","zh":"这是一种非常流行的生成模型形式，我们在斯坦福非常喜爱。总的来说，","start":2151.68,"end":2156.4},{"id":230,"text":"a really popular form of generative models, which we love here at Stanford. And in general,","zh":"人们都非常喜欢它们。它们能生成出色的图像，最终也能生成文本。","start":2156.4,"end":2161.9},{"id":231,"text":"people love them. They make great images and eventually text as well.","zh":"但这就是为什么它有所不同。你是在建模整个世界。","start":2161.96,"end":2165.28},{"id":232,"text":"But this is why it's different. You're modeling the whole world.","zh":"我举的例子是如果你训练……实际上，我不会给出一个令人困惑的例子。但 P(X,Y) 实际上是在建模世界。你想要建模数据的可能性以及标签的可能性。","start":2165.92,"end":2168.7},{"id":233,"text":"And the kind of example I would use is if you trained... Actually, I'm not going to give a","zh":"以及它们一起出现的可能性。这就是我们在这里所追求的。不是","start":2169.18,"end":2173.02},{"id":234,"text":"confusing example. But PXY is actually modeling the world. You want to model how likely the data","zh":"令人困惑的例子。但PXY实际上是在建模这个世界。你想要建模数据和标签同时出现的可能性。","start":2173.02,"end":2177.26},{"id":235,"text":"are and how likely the labels are together. That's roughly what we're after here. Not","zh":"这就是我们在这里大致想要追求的目标。不是","start":2177.26,"end":2181.68},{"id":236,"text":"modeling just the conditional distribution.","zh":"仅建模条件分布。","start":2181.68,"end":2183.2},{"id":237,"text":"Okay. Okay, so let's do some arithmetic and some very basic stuff. Okay, so we're going to take","zh":"好的。好的，那么我们来做一些计算和一些非常基础的东西。好的，我们将取对数。这并不令人惊讶。为什么我们要取对数？因为线性化，我们将它们转化为正弦。","start":2185.8,"end":2190.14},{"id":238,"text":"logs. Not surprising. Why do we take logs? Because linearity and we turn them into sine.","zh":"我们现在有了这些对数似然，我们需要所有东西在这些似然上都是正的。因此它们分配了某种东西，这再次让高斯分布变得很nice，因为它们从不完全等于零。因此我们可以这样做。 Boom，Boom。好的，这是我们的先验分布。好的，我们将做标准的事情。因此我们可以用梯度下降来解决这个问题。没有理由不这样做。但会发生一些神奇的事情。","start":2190.14,"end":2193.84},{"id":239,"text":"We now have these log likelihoods, which we needed everything to be positive on them. So they assign something, which again makes Gaussians nice because they never go identically to zero. So we can do this. Boom, boom. Okay, this is our prior distribution. Okay, so we're going to do the standard thing. So we could solve this with gradient descent. No reason why not. But something magical happens.","zh":"会发生一些神奇的事情，即我们可以将导数设为零并求解，从而得到一个闭合形式的解。这在高斯模型中并不是必需的，但GDA具有这一nice特性。这是一个值得指出的特性，因为通常人们会在想要计算相对便宜的东西时使用这些生成模型。","start":2194.9,"end":2216.83},{"id":240,"text":"And something magical happens is we can set the derivatives to zero and solve it and get a closed form solution. This isn't necessary for Gaussian models, but GDA does have this nice feature. And that is a feature worth pointing out because often people would use these generative models in situations when they wanted to compute something relatively cheaply.","zh":"我们将在本讲座结束时看到这种典型的例子，称为朴素贝叶斯，这是一个非常好的初始模型。它是一个基于计数的模型。它是一个非常nice的模型，可以使用，而且构建和评估都非常便宜。好的，那么让我们找到这些闭合形式的解。好的，这里是类先验。让我看看。那么我们如何估计类先验？我们只需计数。这。","start":2217.44,"end":2235.66},{"id":241,"text":"And we'll see probably the archetype of this, something called naive Bayes at the end of this lecture, which is a very good first model. It's a count-based model. It's a very nice model that you can use, and it's dirt cheap to build and evaluate. OK, so let's find those closed form solutions. All right, here's the class prior. So let me see. So how do we estimate the class prior? We just count. This.","zh":"我们将会看到，这可能是这种模型的一个典型例子，也就是在本节课末尾介绍的朴素贝叶斯（naive Bayes），这是一个非常好的初始模型。它是一个基于计数的模型。它是一个非常不错的模型，可以用于实际，而且构建和评估它非常便宜。好的，那么让我们找到这些闭式解。好了，这里是类别先验。让我想想。那么我们如何估计类别先验呢？我们只需要计数。就是这样。","start":2235.89,"end":2262.46},{"id":242,"text":"You can look.","zh":"这正是最大似然估计。","start":2263.76,"end":2264.38},{"id":243,"text":"This is exactly the maximum likelihood estimate.","zh":"这正是最大似然估计。","start":2264.44,"end":2265.88},{"id":244,"text":"You'll see later that sometimes we'll do a very sophisticated","zh":"你以后会看到，有时我们会做非常复杂的","start":2266.48,"end":2269.4},{"id":245,"text":"trick.","zh":"技巧。","start":2269.4,"end":2269.82},{"id":246,"text":"It has a fancy name, Laplace priors.","zh":"它有一个花哨的名字，叫做拉普拉斯先验。","start":2269.98,"end":2272.02},{"id":247,"text":"Does anyone know what a Laplace priors is?","zh":"有人知道什么是拉普拉斯先验吗？","start":2272.12,"end":2273.22},{"id":248,"text":"Show of hands.","zh":"举手示意。","start":2273.26,"end":2273.7},{"id":249,"text":"You add one.","zh":"你加一。","start":2274.6,"end":2275.64},{"id":250,"text":"That's what you do.","zh":"这就是你要做的。","start":2276.16,"end":2276.88},{"id":251,"text":"You add in some debt accounts.","zh":"你加入一些债务账户。","start":2276.98,"end":2278.28}],"notes":["本段主要讲解了高斯判别分析（GDA）中联合分布P(x,y)的建模方法，强调了与仅建模条件分布P(y|x)的不同之处。教授指出，联合分布P(x,y)直接建模了数据和标签的联合概率，这与能量模型（energy models）类似，尤其在生成模型中广泛应用，如扩散模型。","教授提到，使用联合分布P(x,y)建模时，需要考虑独立同分布（IID）假设，这使得概率可以表示为乘积形式。此外，教授还提到，通过取对数可以将乘积转化为求和，从而简化计算。"],"formulas":[],"uncertainties":["log likelihoods, which we needed everything to be positive on them. So they assign something, which again makes Gaussians nice because they never go identically to zero."],"diagram":"none","start":2101.3,"end":2278.28,"asr_flags":[],"translation_complete":true,"translated_segments":32,"raw_segments":[{"start":2101.3,"text":"Here's our likelihood function. What is it doing? It's taking all the parameters that are in there"},{"start":2106.2,"text":"and it's scoring them in some way according to that model. And I've been a little bit remiss"},{"start":2112.08,"text":"here. I didn't write all the semicolons with all the parameters on the side. I warned you"},{"start":2115.96,"text":"about this in advance, but be aware these probabilities are with respect to these"},{"start":2119.52,"text":"parameters. Now, why were we able to write them as a product? The IID assumption did a lot of"},{"start":2129.62,"text":"work for us right there, okay? Second one, we did this factorization. Well, this is Bayes' rule,"},{"start":2135.1,"text":"okay? We can do that every time on a term. We don't have to assume anything."},{"start":2140.88,"text":"Okay, so we're going to model the joint distribution P of x, y, not just P of y, x,"},{"start":2147.72,"text":"okay? There is, just as an aside, if you look up in the literature, there are things called"},{"start":2151.68,"text":"energy models, which do model this directly, especially for things like diffusion, which is"},{"start":2156.4,"text":"a really popular form of generative models, which we love here at Stanford. And in general,"},{"start":2161.96,"text":"people love them. They make great images and eventually text as well."},{"start":2165.92,"text":"But this is why it's different. You're modeling the whole world."},{"start":2169.18,"text":"And the kind of example I would use is if you trained... Actually, I'm not going to give a"},{"start":2173.02,"text":"confusing example. But PXY is actually modeling the world. You want to model how likely the data"},{"start":2177.26,"text":"are and how likely the labels are together. That's roughly what we're after here. Not"},{"start":2181.68,"text":"modeling just the conditional distribution."},{"start":2185.8,"text":"Okay. Okay, so let's do some arithmetic and some very basic stuff. Okay, so we're going to take"},{"start":2190.14,"text":"logs. Not surprising. Why do we take logs? Because linearity and we turn them into sine."},{"start":2194.9,"text":"We now have these log likelihoods, which we needed everything to be positive on them. So they assign something, which again makes Gaussians nice because they never go identically to zero. So we can do this. Boom, boom. Okay, this is our prior distribution. Okay, so we're going to do the standard thing. So we could solve this with gradient descent. No reason why not. But something magical happens."},{"start":2217.44,"text":"And something magical happens is we can set the derivatives to zero and solve it and get a closed form solution. This isn't necessary for Gaussian models, but GDA does have this nice feature. And that is a feature worth pointing out because often people would use these generative models in situations when they wanted to compute something relatively cheaply."},{"start":2235.89,"text":"And we'll see probably the archetype of this, something called naive Bayes at the end of this lecture, which is a very good first model. It's a count-based model. It's a very nice model that you can use, and it's dirt cheap to build and evaluate. OK, so let's find those closed form solutions. All right, here's the class prior. So let me see. So how do we estimate the class prior? We just count. This."},{"start":2263.76,"text":"You can look."},{"start":2264.44,"text":"This is exactly the maximum likelihood estimate."},{"start":2266.48,"text":"You'll see later that sometimes we'll do a very sophisticated"},{"start":2269.4,"text":"trick."},{"start":2269.98,"text":"It has a fancy name, Laplace priors."},{"start":2272.12,"text":"Does anyone know what a Laplace priors is?"},{"start":2273.26,"text":"Show of hands."},{"start":2274.6,"text":"You add one."},{"start":2276.16,"text":"That's what you do."},{"start":2276.98,"text":"You add in some debt accounts."}],"speech_gaps":[],"frame":"../frames/v054/013.webp","frame_time":2113.3},{"title":"高斯判别分析中的均值与协方差估计","segments":[{"id":252,"text":"All right, what do our class means?","zh":"好的，我们的类均值是什么？","start":2281.76,"end":2284.08},{"id":253,"text":"What would you expect them to be?","zh":"你期望它们是什么？","start":2284.84,"end":2286.1},{"id":254,"text":"This fancy notation here, again, this one,","zh":"这里这个复杂的符号，再次强调，这个符号，","start":2286.94,"end":2289.32},{"id":255,"text":"just to make sure it's clear, this says,","zh":"只是为了确保清楚，这个符号表示，","start":2289.74,"end":2292.24},{"id":256,"text":"this only fires, it's 1 if the point is equal to 0, and 0 otherwise. So this just adds up","zh":"它只在点等于0时触发，如果是0则为1，否则为0。因此，这会把所有属于类别0的x相加","start":2292.24,"end":2299.88},{"id":257,"text":"all of the x's in class 0. And then it divides by the count of the number. So this is the","zh":"然后除以数量的计数。所以这是类别0的计数。然后它会消失。这就是它们的均值。这是你见过的最晦涩的","start":2299.88,"end":2306.92},{"id":258,"text":"count in class 0. And it'll disappear. And that's their mean. This is a most obfuscated","zh":"计算类别0中的计数。然后它就会消失。这就是它们的均值。这是你见过最晦涩的方式","start":2306.92,"end":2318.96},{"id":259,"text":"way you've ever seen to count, to compute","zh":"你用来计数、计算的方式","start":2318.96,"end":2321.14},{"id":260,"text":"the average.","zh":"平均值。","start":2321.76,"end":2322.48},{"id":261,"text":"That's what we're doing. Take all the points,","zh":"这就是我们正在做的事情。将所有点都取出来，","start":2323.16,"end":2324.74},{"id":262,"text":"add them up, divide them.","zh":"加起来，再除以它们的总数。","start":2324.88,"end":2326.04},{"id":263,"text":"All the cats.","zh":"所有猫的数据点。","start":2326.78,"end":2327.44},{"id":264,"text":"These are all the elephants.","zh":"这些都是所有大象的数据点。","start":2328.84,"end":2329.82},{"id":265,"text":"Clear enough in the notation?","zh":"这种表示方式清楚吗？","start":2331.08,"end":2331.96},{"id":266,"text":"Okay.","zh":"好的。","start":2332.62,"end":2332.98},{"id":267,"text":"We didn't have to compute any gradient descent to do this.","zh":"我们不需要计算梯度下降来完成这个步骤。","start":2336.46,"end":2338.68},{"id":268,"text":"We just had to add it up.","zh":"我们只需要把它们加起来。","start":2340.0,"end":2341.06},{"id":269,"text":"Again, nice feature.","zh":"再次，这是一个不错的特性。","start":2341.26,"end":2342.14},{"id":270,"text":"Okay. Average","zh":"好的。平均值","start":2343.78,"end":2344.96},{"id":271,"text":"vectors. Alright. So far so","zh":"向量。到目前为止一切顺利？","start":2344.96,"end":2347.04},{"id":272,"text":"good? Everybody's happy with this?","zh":"大家都对这个满意吗？","start":2347.04,"end":2348.12},{"id":273,"text":"Any questions about it?","zh":"对此有任何问题吗？","start":2348.96,"end":2350.16},{"id":274,"text":"Now, we're going to estimate the shared covariance, those circles.","zh":"现在，我们将估计共享的协方差，也就是那些圆圈。","start":2354.06,"end":2357.96},{"id":275,"text":"And that's going to let us do a little bit of matrix stuff.","zh":"这将让我们进行一些矩阵运算。","start":2358.32,"end":2360.78},{"id":276,"text":"And if the matrix stuff isn't familiar to you, go to the Friday things, look at them.","zh":"如果你对矩阵内容不熟悉，去周五的内容看看。","start":2361.02,"end":2365.66},{"id":277,"text":"OK.","zh":"好的。","start":2366.46,"end":2366.94},{"id":278,"text":"So here's the shared covariance sigma.","zh":"这里是我们共享的协方差矩阵σ。","start":2368.36,"end":2370.52},{"id":279,"text":"OK.","zh":"好的。","start":2372.6,"end":2373.08},{"id":280,"text":"This is xi minus the mu of that class.","zh":"这是xi减去该类别的均值mu。","start":2373.42,"end":2376.88},{"id":281,"text":"that is appropriate to it.","zh":"这是适合它的。","start":2378.96,"end":2380.26},{"id":282,"text":"So for every data point, we look at its label,","zh":"对于每一个数据点，我们查看它的标签，","start":2380.34,"end":2382.66},{"id":283,"text":"and we pick the appropriate mean.","zh":"并选择相应的均值。","start":2382.8,"end":2384.34},{"id":284,"text":"We're pooling all the data together.","zh":"我们将所有数据合并在一起。","start":2385.6,"end":2387.22},{"id":285,"text":"Perfect.","zh":"很好。","start":2392.56,"end":2393.04},{"id":286,"text":"That's what that notation means.","zh":"这就是这个符号的含义。","start":2394.7,"end":2395.9},{"id":287,"text":"This character here.","zh":"这里的这个字符。","start":2396.76,"end":2397.7},{"id":288,"text":"Please.","zh":"请。","start":2398.08,"end":2398.56},{"id":289,"text":"That's really quick for a variance.","zh":"这在方差上算得很快。","start":2400.42,"end":2401.86},{"id":290,"text":"I'm assuming that you're...","zh":"我假设你……","start":2401.96,"end":2403.86},{"id":291,"text":"For right now, we're going to assume","zh":"目前，我们将假设","start":2404.74,"end":2406.62},{"id":292,"text":"because we computed them on the last slide","zh":"因为我们是在上一张幻灯片上计算的","start":2406.62,"end":2408.18},{"id":293,"text":"that we have access to them because those means it's no there's no circularity so the question is","zh":"我们之所以能够访问它们，是因为这些均值，那里没有循环性，所以问题是","start":2408.18,"end":2412.14},{"id":294,"text":"are we assuming we have the means and we got them we estimated them from the last slide you're right","zh":"我们是否假设已经有了均值，并且我们确实从上一张幻灯片上估计得到了它们，你说得对","start":2412.14,"end":2417.26},{"id":295,"text":"that i'm cheating in some way which i don't know if you're pointing out but i really if you are","zh":"我在某种程度上是在作弊，我不知道你是否在指出这一点，但如果你是在指出的话","start":2417.26,"end":2420.86},{"id":296,"text":"it's wonderful which is that the actual mean the true population mean we're only seeing a noisy","zh":"这是非常好的一点，即真实的总体均值我们只能看到它的噪声版本","start":2420.86,"end":2426.12},{"id":297,"text":"version of it so there's some error in our mean right which we could compute how quickly it goes","zh":"因此我们的均值中存在一些误差，对吧，我们可以计算这种误差如何快速趋近于零，以及所有其他的收敛速率","start":2426.12,"end":2430.38},{"id":298,"text":"to zero and all the rest of that convergence rate i'm skipping all of that artfully shall we say for","zh":"我暂时巧妙地跳过了所有这些内容，暂且如此","start":2430.38,"end":2435.16},{"id":299,"text":"the moment so for yes for the moment i'm assuming i have it exactly to make my life a little bit","zh":"所以，暂且如此，我假设我能够精确地得到它，这样我的生活会轻松一点","start":2435.16,"end":2439.22},{"id":300,"text":"easier but you could just you could do a plug-in estimator for this it won't be too bad great","zh":"更容易，但你也可以直接使用一个插件估计量来处理，这不会太糟糕，很好","start":2439.22,"end":2443.58},{"id":301,"text":"question really phenomenal question please awesome question so yeah so this is actually","zh":"这个问题真的很棒，太棒了，所以是的，这个问题实际上","start":2443.58,"end":2451.88},{"id":302,"text":"this question that you asked i wish i brought candy today i'll give you extra candy this","zh":"你提出的问题，我真希望今天我带了糖果，我会给你额外的糖果，这个问题","start":2451.88,"end":2455.62},{"id":303,"text":"question is this is like one of my favorite questions so what sense are we learning","zh":"这个问题就像我最喜欢的问题之一，那么我们是在什么意义上学习的","start":2455.62,"end":2459.3}],"notes":["本段主要讲解了高斯判别分析中均值的计算方法，通过将类别0中的所有
