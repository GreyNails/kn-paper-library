."},{"start":3185.36,"text":"And I realize this was not a very good derivation because I was planning on trying to skip through"},{"start":3189.82,"text":"it. And I appreciate you calling me out on it. I shouldn't have skipped through it."},{"start":3193.14,"text":"It is in Tang Yu's notes or in the notes written out in full detail. But conceptually,"},{"start":3199.24,"text":"it is just arithmetic. It is just doing a little bit of algebra to move things around"},{"start":3202.94,"text":"and cross them out. And they are actually linear. The most important part I hope to get away from"},{"start":3207.32,"text":"without actually having to do the computation, which was that this term cancels on both sides."},{"start":3211.8,"text":"and so everything else is linear or constant in X. That's the actual message"},{"start":3216.04,"text":"of this and that tells you the decision surface is itself linear because it's"},{"start":3219.92,"text":"then going to be linear term or affine term equal to a constant. That is"},{"start":3226.36,"text":"a line. That's how you define a hyperplane. Cool. Awesome questions. Please."},{"start":3242.32,"text":"Yeah, wonderful question. So I'm going to come to that in one slide,"},{"start":3244.92,"text":"or as I skip to the next slide, and we'll get right there. Wonderful question. Please."},{"start":3254.96,"text":"Wonderful question. So the question is, how does this relate to the logistic regression?"},{"start":3257.96,"text":"And how does this change the decision surface? And both of those things are what we're going"},{"start":3261.42,"text":"to come to in exactly the next slide so give me three slides and let's come back to them these"},{"start":3265.06,"text":"are phenomenal questions they're exactly what's coming next yeah okay so the intuition by the way"},{"start":3271.3,"text":"is it's a line there's some kind of exponential going on underneath the covers we have a log"},{"start":3276.48,"text":"linear model logistic regression is more powerful than you think for log linear models that's kind"},{"start":3280.88,"text":"of the punchline you know it's not a sitcom i can reveal that early all right okay so let's get to"},{"start":3285.88,"text":"to the first question what happens if you don't have a share oh sorry right so"},{"start":3302.32,"text":"the decision matter this means if you remember we're going to do a decision"},{"start":3305.42,"text":"We're going to say, is this particular point more likely a cat or more likely an elephant? And we gave a rule to do that, which is consistent and that we can use, which is this Bayes rule that we ran through the model in a forward way. And so we got a score, 0.6 for one, 0.2 for the other. And we got those probabilities and we compared them. And all we looked at to find this line is, where are one of those two probabilities equal? And we said that was the moment that we would flip because we were doing this arg max. We would return the class boundary doing that. Now, we threw away all that information with the probability model."}],"speech_gaps":[{"start":3232.832,"end":3241.92},{"start":3249.168,"end":3251.312}],"frame":"../frames/v054/019.webp","frame_time":3169.39},{"title":"高斯判别分析与决策边界","segments":[{"id":385,"text":"which maybe we wanted, in which case this is a weird thing to do. But it was meant to highlight two things, which is so far we haven't changed the decision surface from what we did last time. I'm going to show you that we can change it in one second. And then two, I want to relate it to this point about logistic regression because there's a conceptual point underneath that will be more clear later. Wonderful question. Others? Awesome. All right. So here's the decision surface. And the point was made, which was a wonderful point.","start":3334.7,"end":3362.91},{"id":386,"text":"Well, I don't care. So what? I can still write out the decision surface. You just don't have to have the two sigmas cancel out. I can look at some other form there. It's just another quadratic form. I can solve that for zero. It's well-defined and all the rest. And you'd be right. And in particular, what happens is when that sigma term no longer cancels, you get these funny decision boundaries because they're now quadratic.","start":3363.42,"end":3385.06},{"id":387,"text":"And that's kind of interesting because their shapes are different.","start":3386.15,"end":3389.17},{"id":388,"text":"So the left is the linear GDA when you have a decision boundary.","start":3389.37,"end":3392.01},{"id":389,"text":"And the right is called QDA, which is the quadratic discriminant analysis.","start":3392.29,"end":3395.97},{"id":390,"text":"And indeed, that's a totally reasonable thing to do.","start":3396.93,"end":3399.97},{"id":391,"text":"And you can do the entire derivation and how we estimated every piece.","start":3400.09,"end":3403.03},{"id":392,"text":"How would you estimate the means in this model?","start":3403.27,"end":3405.15},{"id":393,"text":"Well, you already know.","start":3405.33,"end":3405.99},{"id":394,"text":"You estimate the means.","start":3406.07,"end":3406.89},{"id":395,"text":"How would you estimate the covariances?","start":3407.03,"end":3408.41},{"id":396,"text":"Rather than pooling the data, you would do them separately.","start":3408.51,"end":3410.81},{"id":397,"text":"Everything kind of works out.","start":3411.63,"end":3412.79},{"id":398,"text":"But in this model, I want to point out, if Claude is to be believed and my checking","start":3412.79,"end":3417.69},{"id":399,"text":"of it is to be believed, these are decision surfaces. You should check that out. You","start":3417.69,"end":3421.05},{"id":400,"text":"shouldn't trust me or the others. All right, good enough? All right, sure, sure.","start":3421.05,"end":3429.63},{"id":401,"text":"What does it mean that you have a situation where you could have a decision surface with no data points that are there?","start":3430.29,"end":3437.79},{"id":402,"text":"Oh, we have no data points that are there?","start":3439.21,"end":3441.25},{"id":403,"text":"What a wonderful question.","start":3441.37,"end":3442.19},{"id":404,"text":"So the observation is, wait, there's this weird thing that's way out from the data set","start":3442.43,"end":3446.69},{"id":405,"text":"where all of a sudden it's making what looked to be in this setting a pretty unjustified","start":3446.69,"end":3450.07},{"id":406,"text":"leap because it doesn't have this monotonicity.","start":3450.07,"end":3451.69},{"id":407,"text":"What you'll see when you start to get to decision surfaces that are more complicated, they will","start":3452.09,"end":3456.99},{"id":408,"text":"have these little knots and we'll come back to exactly that point in classification.","start":3456.99,"end":3459.93},{"id":409,"text":"You're thinking about it in the same way.","start":3460.37,"end":3461.71},{"id":410,"text":"I would point out it's maybe more intuitive, but the same thing happens way off the map","start":3461.95,"end":3466.23},{"id":411,"text":"over here right which is like when you get way way out from the data you're","start":3466.23,"end":3469.61},{"id":412,"text":"still using a linear model far from where you intended to use and so in the","start":3469.61,"end":3474.13},{"id":413,"text":"same way when you're away from all of your data bad things can happen this one","start":3474.13,"end":3477.77},{"id":414,"text":"just looks a little bit more visually anomalous wonderful insight all right so","start":3477.77,"end":3484.25},{"id":415,"text":"now for the point about logistic regression which we came to before so","start":3484.25,"end":3487.31},{"id":416,"text":"what do these things have to do with one","start":3487.31,"end":3488.51}],"notes":["本段讨论了高斯判别分析（GDA）和二次判别分析（QDA）之间的区别，强调了决策边界的变化。教授指出，GDA在某些情况下可能保持线性决策边界，而QDA则引入了二次形式，导致更复杂的决策边界。这与逻辑回归（logistic regression）的概念联系起来，说明了不同模型在处理分类问题时的差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3334.7,"end":3488.51,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3334.7,"text":"which maybe we wanted, in which case this is a weird thing to do. But it was meant to highlight two things, which is so far we haven't changed the decision surface from what we did last time. I'm going to show you that we can change it in one second. And then two, I want to relate it to this point about logistic regression because there's a conceptual point underneath that will be more clear later. Wonderful question. Others? Awesome. All right. So here's the decision surface. And the point was made, which was a wonderful point."},{"start":3363.42,"text":"Well, I don't care. So what? I can still write out the decision surface. You just don't have to have the two sigmas cancel out. I can look at some other form there. It's just another quadratic form. I can solve that for zero. It's well-defined and all the rest. And you'd be right. And in particular, what happens is when that sigma term no longer cancels, you get these funny decision boundaries because they're now quadratic."},{"start":3386.15,"text":"And that's kind of interesting because their shapes are different."},{"start":3389.37,"text":"So the left is the linear GDA when you have a decision boundary."},{"start":3392.29,"text":"And the right is called QDA, which is the quadratic discriminant analysis."},{"start":3396.93,"text":"And indeed, that's a totally reasonable thing to do."},{"start":3400.09,"text":"And you can do the entire derivation and how we estimated every piece."},{"start":3403.27,"text":"How would you estimate the means in this model?"},{"start":3405.33,"text":"Well, you already know."},{"start":3406.07,"text":"You estimate the means."},{"start":3407.03,"text":"How would you estimate the covariances?"},{"start":3408.51,"text":"Rather than pooling the data, you would do them separately."},{"start":3411.63,"text":"Everything kind of works out."},{"start":3412.79,"text":"But in this model, I want to point out, if Claude is to be believed and my checking"},{"start":3417.69,"text":"of it is to be believed, these are decision surfaces. You should check that out. You"},{"start":3421.05,"text":"shouldn't trust me or the others. All right, good enough? All right, sure, sure."},{"start":3430.29,"text":"What does it mean that you have a situation where you could have a decision surface with no data points that are there?"},{"start":3439.21,"text":"Oh, we have no data points that are there?"},{"start":3441.37,"text":"What a wonderful question."},{"start":3442.43,"text":"So the observation is, wait, there's this weird thing that's way out from the data set"},{"start":3446.69,"text":"where all of a sudden it's making what looked to be in this setting a pretty unjustified"},{"start":3450.07,"text":"leap because it doesn't have this monotonicity."},{"start":3452.09,"text":"What you'll see when you start to get to decision surfaces that are more complicated, they will"},{"start":3456.99,"text":"have these little knots and we'll come back to exactly that point in classification."},{"start":3460.37,"text":"You're thinking about it in the same way."},{"start":3461.95,"text":"I would point out it's maybe more intuitive, but the same thing happens way off the map"},{"start":3466.23,"text":"over here right which is like when you get way way out from the data you're"},{"start":3469.61,"text":"still using a linear model far from where you intended to use and so in the"},{"start":3474.13,"text":"same way when you're away from all of your data bad things can happen this one"},{"start":3477.77,"text":"just looks a little bit more visually anomalous wonderful insight all right so"},{"start":3484.25,"text":"now for the point about logistic regression which we came to before so"},{"start":3487.31,"text":"what do these things have to do with one"}],"speech_gaps":[],"frame":"../frames/v054/020.webp","frame_time":3346.7},{"title":"高斯判别分析与逻辑回归的关系","segments":[{"id":417,"text":"All right, so this is going to be a derivation. That's basically what it's going to show, is we're going to try and derive something that looks like the probability that y equals 1 given x, the discriminative version of what we did. We've been doing kind of the other way around, right? We were trying to get to the other way around. So we want to go the other way around, sorry, over here. So how do we get there? This is the discriminative one.","start":3489.56,"end":3514.99},{"id":418,"text":"Apparently, Claude decided it didn't want to do the algebra. No. So there is some algebra that can be done. And the basic message, though, maybe it's a homework problem. I don't remember. But either way, I mean, you can just see how to do it. It's hopefully not very challenging. Maybe you'll believe me. Maybe you won't. And we'll all be richer for it. Anyway, so the point is, is you'll have this. You can rewrite this in Bayes' rule. And that Bayes' rule allows you to write this probability of y given x, which is the discriminative rule. And that discriminative rule has exactly this functional form.","start":3516.63,"end":3545.99},{"id":419,"text":"Now, what that means, it doesn't mean that it's exactly the same. It means that there is some logistic regressor that captures that decision surface. And so in a weak sense before, as you talked about, there's some line that given those features fits them. In some way, this is a tautology. I don't really need to prove it to you because I already showed that there was a line that we saw before. And clearly, that decision line can be recognized by some kind of linear model. Might as well be this one.","start":3546.54,"end":3572.28},{"id":420,"text":"What the content is, is that the probabilities on both sides are the same. And that also shouldn't be too much of a stretch, but you should go through it. All right. Okay, so basically, GDA implies that logistic regression has the same, in a fancy terminology, posterior distribution has this sigmoidal form. Okay.","start":3572.98,"end":3603.64},{"id":421,"text":"Shared parameters, all the rest. And so it turns out that many different generative assumptions on your data lead to the same discriminative model, logistic regression. And it's not a coincidence. The reason it's not a coincidence is if your data fundamentally at the end when you do a classification rule is separated by a line.","start":3605.14,"end":3621.46},{"id":422,"text":"Shared parameters, all the rest. And so it turns out that many different generative assumptions on your data lead to the same discriminative model, logistic regression. And it's not a coincidence. The reason it's not a coincidence is if your data fundamentally at the end when you do a classification rule is separated by a line.","start":3622.17,"end":3641.24}],"notes":["本段主要讲解高斯判别分析（GDA）与逻辑回归之间的关系。讲者指出，GDA推导出的判别模型实际上可以表示为逻辑回归的形式，即后验概率具有S型（sigmoidal）函数形式。这表明，即使数据是通过生成模型（如高斯分布）生成的，最终的判别模型仍可以是逻辑回归。","讲者提到，GDA推导出的判别模型与逻辑回归之间的关系并非巧合，而是因为当数据在分类时被一条线分隔时，逻辑回归能够表示这种决策边界。这表明，逻辑回归可以捕捉到由生成模型所隐含的决策边界。","讲者还指出，不仅高斯分布，其他指数族分布（如泊松分布）也可以导致相同的判别模型——逻辑回归。这说明，逻辑回归的适用性不仅限于高斯分布，而是更广泛的指数族分布。","讲者强调，虽然GDA是生成模型，但其最终的判别模型与逻辑回归相同，这表明生成模型和判别模型之间存在一定的联系。这种联系使得逻辑回归能够捕捉到生成模型所隐含的决策边界。","讲者提到，逻辑回归的后验概率形式是S型函数，这与广义线性模型（GLMs）的结构一致。GLMs中的参数形式最终可以归结为逻辑回归的形式，这进一步说明了逻辑回归的广泛适用性。","讲者最后指出，当数据在分类时被一条线分隔时，逻辑回归能够表示这种决策边界。这表明，逻辑回归不仅适用于高斯分布，也适用于其他指数族分布，只要数据满足相应的条件。"],"formulas":[{"latex":"P(y|x) = \\frac{P(x|y)P(y)}{P(x)}","symbols":"P(y|x) 表示给定输入x时输出y的概率，P(x|y) 是条件概率，P(y) 是先验概率，P(x) 是边缘概率","explanation":"公式正确表达了贝叶斯规则，用于计算给定输入x时输出y的后验概率。","evidence":"Apparently, Claude decided it didn't want to do the algebra. No. So there is some algebra that can be done. And the basic message, though, maybe it's a homework problem. I don't remember. But either way, I mean, you can just see how to do it. It's hopefully not very challenging. Maybe you'll believe me. Maybe you won't. And we'll all be richer for it. Anyway, so the point is, is you'll have this. You can rewrite this in Bayes' rule. And that Bayes' rule allows you to write this probability of y given x, which is the discriminative rule. And that discriminative rule has exactly this functional form."}],"uncertainties":["logistic regression is going to be able to basically represent it."],"diagram":"none","start":3489.56,"end":3641.24,"asr_flags":[],"math_clarifications":["原始文本中提到的GDA（高斯判别分析）与逻辑回归的关系，以及指数族分布的讨论，未在公式中体现，因此无法核定。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3489.56,"text":"All right, so this is going to be a derivation. That's basically what it's going to show, is we're going to try and derive something that looks like the probability that y equals 1 given x, the discriminative version of what we did. We've been doing kind of the other way around, right? We were trying to get to the other way around. So we want to go the other way around, sorry, over here. So how do we get there? This is the discriminative one."},{"start":3516.63,"text":"Apparently, Claude decided it didn't want to do the algebra. No. So there is some algebra that can be done. And the basic message, though, maybe it's a homework problem. I don't remember. But either way, I mean, you can just see how to do it. It's hopefully not very challenging. Maybe you'll believe me. Maybe you won't. And we'll all be richer for it. Anyway, so the point is, is you'll have this. You can rewrite this in Bayes' rule. And that Bayes' rule allows you to write this probability of y given x, which is the discriminative rule. And that discriminative rule has exactly this functional form."},{"start":3546.54,"text":"Now, what that means, it doesn't mean that it's exactly the same. It means that there is some logistic regressor that captures that decision surface. And so in a weak sense before, as you talked about, there's some line that given those features fits them. In some way, this is a tautology. I don't really need to prove it to you because I already showed that there was a line that we saw before. And clearly, that decision line can be recognized by some kind of linear model. Might as well be this one."},{"start":3572.98,"text":"What the content is, is that the probabilities on both sides are the same. And that also shouldn't be too much of a stretch, but you should go through it. All right. Okay, so basically, GDA implies that logistic regression has the same, in a fancy terminology, posterior distribution has this sigmoidal form. Okay. Now it turns out, I won't prove this either, but it turns out that it's not just Gaussians. It's also other exponential families. Poissons."},{"start":3605.14,"text":"Shared parameters, all the rest. And so it turns out that many different generative assumptions on your data lead to the same discriminative model, logistic regression. And it's not a coincidence. The reason it's not a coincidence is if your data fundamentally at the end when you do a classification rule is separated by a line."},{"start":3622.17,"text":"logistic regression is going to be able to basically represent it. And if it's an exponential model, the posterior is going to be of the form that it's going to scale as a linear thing. And remember the way GLMs work. They had that term. They had those terms in the GLMs. All of them had this form where they would eventually be effectively logistic regression. Please."}],"speech_gaps":[],"frame":"../frames/v054/021.webp","frame_time":3501.56},{"title":"高斯判别分析与逻辑回归的联系","segments":[{"id":423,"text":"So it makes a GBA model and logistic regression is a linear decision boundary? Yeah, exactly right. So the question here is what links the two between the GLMs and logistic regression? It's the fact that they have two components. One is they have a linear decision boundary. And then the second is that they're in the class of exponential models. And that form, exponential form, if you looked at, always has a linear piece and then an extra term. That was the way GLMs work. And so all of them effectively are logistic regression.","start":3641.9,"end":3671.42},{"id":424,"text":"regression in disguise. Now, the reason why that may be quite surprising is, on one hand, it seems like, why the heck are we doing all these different generative models if they end up in the same spot? And so one pro for logistic regression, as I talked about before, is although it's making a very weak assumption, effectively, about the data, this discriminative assumption, that it can find some separator. It doesn't care how the data are generated at all. It's going to find that line, and it's going to get the probabilities close to that line in a good shape.","start":3671.44,"end":3698.22},{"id":425,"text":"On the other hand, what this kind of means is that if we're doing these kind of generative things, as we saw, you can get nonlinear decision boundaries, but you have to use extra and additional structure. So another way to say this, logistic regression became like the workhorse from data. So people really thought as a result of these results, like one thing that you would, if you were sitting in these seats 10 years ago, you're like, oh, I just need to know logistic regression. What's interesting is that a lot of the progress on AI and machine learning actually went in the other direction.","start":3699.41,"end":3726.27},{"id":426,"text":"So the two things that are potentially so strange is if you looked at stats, stats was very interested in, just as a small digression, label data, proving generalization, and proving certificates. Machine learning was interested in subtly different things. It was interested in how you predict, how the predictions look, didn't really care if you had the right values for the model. It looked about how to scale these things up, and so looked at these what are called overcomplete representations. We'll talk about that later in the week.","start":3726.78,"end":3753.62},{"id":427,"text":"And all of these led to actually all the progress. And they were really worried about clean label data. And actually, in two weeks, we'll talk about how to deal with unlabeled data. And it turned out that unlabeled generative data, which were the quirks, if you like, even 10 years ago, are where almost all the progress has been.","start":3754.24,"end":3770.7},{"id":428,"text":"The way that a GPT model works is it trains on huge amounts of unsupervised text during what's called pre-training. It tries to predict the next token, which brings a bunch of representations about it. It is a generative model underneath the covers, and it actually generates text, which is really what they mean when they say generative. Same idea.","start":3771.19,"end":3785.45},{"id":429,"text":"We scaled into regimes, as we'll see on Wednesday, which were like effectively no-go zones for stats. We would look at models that had many more parameters than they had data points. So I just highlight this because this assumption right here is true. It's correct that these generative models can collapse to this discriminative model. Interestingly enough, the progress came on the generative side over the last 10 years, 10, 15 years, in industry and otherwise. All right. Cool. All right.","start":3787.08,"end":3817.46}],"notes":["本段讨论了高斯判别分析（GBA）和逻辑回归之间的联系，指出它们都属于指数族模型（GLMs），并且具有线性决策边界。这表明，尽管它们在建模方式上不同，但它们在某些情况下可以归结为逻辑回归模型。","讲者提到，虽然逻辑回归是一种判别模型，它不关心数据是如何生成的，只关注找到一个分离线，并且能够很好地拟合概率分布。这与生成模型不同，生成模型需要额外的结构来获得非线性决策边界。","讲者还指出，统计学和机器学习在目标上有所不同。统计学关注于标签数据、泛化能力和证明证书，而机器学习更关注预测的性能和如何扩展模型，例如使用过完备表示。","讲者提到，过去十年中，生成模型在人工智能和机器学习领域取得了显著进展，尤其是在工业界。这表明，尽管生成模型在理论上可能不如判别模型直接，但它们在实际应用中具有重要价值。","讲者最后提到，GPT模型通过大规模的无监督文本预训练来工作，它试图预测下一个标记，并生成文本。这表明生成模型在实际应用中具有强大的能力。","讲者强调，生成模型可以扩展到统计学认为难以处理的领域，例如参数数量远多于数据点的模型。这表明生成模型在处理大规模数据和复杂任务方面具有优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3641.9,"end":3817.46,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3641.9,"text":"So it makes a GBA model and logistic regression is a linear decision boundary? Yeah, exactly right. So the question here is what links the two between the GLMs and logistic regression? It's the fact that they have two components. One is they have a linear decision boundary. And then the second is that they're in the class of exponential models. And that form, exponential form, if you looked at, always has a linear piece and then an extra term. That was the way GLMs work. And so all of them effectively are logistic regression."},{"start":3671.44,"text":"regression in disguise. Now, the reason why that may be quite surprising is, on one hand, it seems like, why the heck are we doing all these different generative models if they end up in the same spot? And so one pro for logistic regression, as I talked about before, is although it's making a very weak assumption, effectively, about the data, this discriminative assumption, that it can find some separator. It doesn't care how the data are generated at all. It's going to find that line, and it's going to get the probabilities close to that line in a good shape."},{"start":3699.41,"text":"On the other hand, what this kind of means is that if we're doing these kind of generative things, as we saw, you can get nonlinear decision boundaries, but you have to use extra and additional structure. So another way to say this, logistic regression became like the workhorse from data. So people really thought as a result of these results, like one thing that you would, if you were sitting in these seats 10 years ago, you're like, oh, I just need to know logistic regression. What's interesting is that a lot of the progress on AI and machine learning actually went in the other direction."},{"start":3726.78,"text":"So the two things that are potentially so strange is if you looked at stats, stats was very interested in, just as a small digression, label data, proving generalization, and proving certificates. Machine learning was interested in subtly different things. It was interested in how you predict, how the predictions look, didn't really care if you had the right values for the model. It looked about how to scale these things up, and so looked at these what are called overcomplete representations. We'll talk about that later in the week."},{"start":3754.24,"text":"And all of these led to actually all the progress. And they were really worried about clean label data. And actually, in two weeks, we'll talk about how to deal with unlabeled data. And it turned out that unlabeled generative data, which were the quirks, if you like, even 10 years ago, are where almost all the progress has been."},{"start":3771.19,"text":"The way that a GPT model works is it trains on huge amounts of unsupervised text during what's called pre-training. It tries to predict the next token, which brings a bunch of representations about it. It is a generative model underneath the covers, and it actually generates text, which is really what they mean when they say generative. Same idea."},{"start":3787.08,"text":"We scaled into regimes, as we'll see on Wednesday, which were like effectively no-go zones for stats. We would look at models that had many more parameters than they had data points. So I just highlight this because this assumption right here is true. It's correct that these generative models can collapse to this discriminative model. Interestingly enough, the progress came on the generative side over the last 10 years, 10, 15 years, in industry and otherwise. All right. Cool. All right."}],"speech_gaps":[],"frame":"../frames/v054/022.webp","frame_time":3653.9},{"title":"高斯判别分析与生成模型的对比","segments":[{"id":430,"text":"Yeah, it's also, by the way, not true in the other direction. Logistic regression does not mean it's GDA. They are not equivalent models. GDA is making more assumptions. There are some decision surfaces that GDA won't be able to recognize.","start":3819.59,"end":3830.61},{"id":431,"text":"And the takeaway is logistic regression assumes less and still gets the right answer for these kinds of problems. And so I wanted to counterbalance that with, because you may think, well, if it does, I don't have to know the generative stuff. And I was like, yeah, but then you would have given up on all this amazing AI richness over the last 10 years, which has been great. We've loved it. That's the way images are generated. That's the way text is generated. It's all generative stuff. All right. So logistic regression only assumes that the log odds is linear.","start":3831.95,"end":3855.65},{"id":432,"text":"And if you look actually all exponential family models, if you look underneath the covers, that's really what they're doing. They all are these log linear models in their parameters. And in fact, that comes from another even more basic assumption, which I'm happy to share with you, which has to do with maximum entropy in the discrete case. But they all have to have that form. Cool. All right.","start":3856.14,"end":3878.75},{"id":433,"text":"Now, the traditional thing we would say is GDA needs stronger assumptions, but is more efficient when data is correct, and it's fragile if it's wrong. And logistic regression needs weaker assumptions, but needs more data, but it's more robust.","start":3879.29,"end":3889.87},{"id":434,"text":"I would say this is a little bit misleading. This is the thing I'm supposed to tell you. It's like in the notes, all the rest. But it's a little bit misleading because of the story I just told you, which is it turned out that being able to model your data independent of class is a much more powerful idea over the last 10 years. Maybe that won't be true for the next 10 years, but at least recently, it's been much more powerful about what to do and build interesting models.","start":3891.4,"end":3910.14},{"id":435,"text":"All right, so here are some examples of modern AI uses. Diffusion models, you iteratively denoise from Gaussians. You assume that you have a Gaussian noise. Imagine I gave you an image. I noised it up with a series of adding Gaussian noise to it, and then I showed you the noisy model at the end. Could you go backwards from that and recover it? If you could do that, that model, what you can do is you can start with random noise that you pick appropriately and denoise it into images. And weirdly enough, that works.","start":3911.89,"end":3939.13},{"id":436,"text":"LLMs, Large Language Models, these have generative things.","start":3940.49,"end":3943.05},{"id":437,"text":"GANs, probably no one knows what a GAN is.","start":3943.43,"end":3945.05},{"id":438,"text":"They have these generative and discriminator models","start":3945.13,"end":3946.43},{"id":439,"text":"that were really popular in 2016.","start":3946.43,"end":3948.33},{"id":440,"text":"And they're still valuable, very cool models.","start":3949.83,"end":3951.95},{"id":441,"text":"But the takeaway is the probabilistic framework","start":3952.25,"end":3953.91},{"id":442,"text":"is the same.","start":3953.91,"end":3954.43},{"id":443,"text":"They model how the data is generated,","start":3954.73,"end":3956.33},{"id":444,"text":"then they use that model.","start":3956.45,"end":3957.33},{"id":445,"text":"And this is the simplest variant of this.","start":3957.53,"end":3959.23},{"id":446,"text":"And don't be worried that it doesn't do that well","start":3959.51,"end":3961.95},{"id":447,"text":"on linear kinds of problems.","start":3961.95,"end":3963.37},{"id":448,"text":"It shines much later, and that's why we teach it too.","start":3963.65,"end":3966.55},{"id":449,"text":"you okay so on that note any questions on on this part of the framework that","start":3966.55,"end":3973.05},{"id":450,"text":"was a little bit kind of conceptual and weird so I'm sure there are questions","start":3973.05,"end":3976.17},{"id":451,"text":"please fire away that's a good way to get no questions I guess no questions","start":3977.31,"end":3986.89},{"id":452,"text":"awesome we'll keep going all right all right so the next thing I want to show","start":3986.89,"end":3992.71},{"id":453,"text":"you the last issue is this naive Bayes model which is a generative model for","start":3992.71,"end":3996.13},{"id":454,"text":"discrete features so we're looking at things that were discrete oh question thank you thank you so","start":3996.13,"end":3999.35}],"notes":["本段主要讨论了生成模型与判别模型之间的对比，强调了生成模型在现代AI中的重要性。讲者指出，虽然逻辑回归假设较少，但生成模型如高斯判别分析（GDA）在数据正确时更高效，但对数据的假设更严格。同时，讲者提到生成模型在图像和文本生成中扮演了关键角色，如扩散模型、大型语言模型（LLMs）和生成对抗网络（GANs）等。","讲者还指出，生成模型的核心思想是建模数据是如何生成的，然后利用该模型进行预测或生成。这种思想在现代AI中非常强大，尤其是在处理复杂数据时。虽然逻辑回归在处理线性问题时可能表现不佳，但生成模型在更复杂的任务中表现优异。","讲者提到，生成模型的假设比判别模型更严格，但它们在数据正确时更高效。然而，如果数据不符合假设，生成模型可能会变得脆弱。因此，选择模型时需要权衡假设的强度和模型的鲁棒性。","讲者还提到，生成模型在现代AI中非常重要，如扩散模型通过逐步去噪生成图像，大型语言模型通过生成文本进行建模，生成对抗网络（GANs）通过生成器和判别器的对抗训练生成数据。这些模型都基于生成模型的思想。","讲者最后提到，虽然生成模型在某些情况下可能不如判别模型有效，但它们在更复杂的任务中表现优异，因此在课程中仍然被教授。讲者鼓励学生提问，但似乎没有学生提出问题。","讲者在结尾部分提到，生成模型的框架是相同的，即建模数据是如何生成的，然后利用该模型进行预测或生成。这种思想在现代AI中非常重要，尤其是在处理复杂数据时。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3819.59,"end":3999.35,"asr_flags":[451],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3819.59,"text":"Yeah, it's also, by the way, not true in the other direction. Logistic regression does not mean it's GDA. They are not equivalent models. GDA is making more assumptions. There are some decision surfaces that GDA won't be able to recognize."},{"start":3831.95,"text":"And the takeaway is logistic regression assumes less and still gets the right answer for these kinds of problems. And so I wanted to counterbalance that with, because you may think, well, if it does, I don't have to know the generative stuff. And I was like, yeah, but then you would have given up on all this amazing AI richness over the last 10 years, which has been great. We've loved it. That's the way images are generated. That's the way text is generated. It's all generative stuff. All right. So logistic regression only assumes that the log odds is linear."},{"start":3856.14,"text":"And if you look actually all exponential family models, if you look underneath the covers, that's really what they're doing. They all are these log linear models in their parameters. And in fact, that comes from another even more basic assumption, which I'm happy to share with you, which has to do with maximum entropy in the discrete case. But they all have to have that form. Cool. All right."},{"start":3879.29,"text":"Now, the traditional thing we would say is GDA needs stronger assumptions, but is more efficient when data is correct, and it's fragile if it's wrong. And logistic regression needs weaker assumptions, but needs more data, but it's more robust."},{"start":3891.4,"text":"I would say this is a little bit misleading. This is the thing I'm supposed to tell you. It's like in the notes, all the rest. But it's a little bit misleading because of the story I just told you, which is it turned out that being able to model your data independent of class is a much more powerful idea over the last 10 years. Maybe that won't be true for the next 10 years, but at least recently, it's been much more powerful about what to do and build interesting models."},{"start":3911.89,"text":"All right, so here are some examples of modern AI uses. Diffusion models, you iteratively denoise from Gaussians. You assume that you have a Gaussian noise. Imagine I gave you an image. I noised it up with a series of adding Gaussian noise to it, and then I showed you the noisy model at the end. Could you go backwards from that and recover it? If you could do that, that model, what you can do is you can start with random noise that you pick appropriately and denoise it into images. And weirdly enough, that works."},{"start":3940.49,"text":"LLMs, Large Language Models, these have generative things."},{"start":3943.43,"text":"GANs, probably no one knows what a GAN is."},{"start":3945.13,"text":"They have these generative and discriminator models"},{"start":3946.43,"text":"that were really popular in 2016."},{"start":3949.83,"text":"And they're still valuable, very cool models."},{"start":3952.25,"text":"But the takeaway is the probabilistic framework"},{"start":3953.91,"text":"is the same."},{"start":3954.73,"text":"They model how the data is generated,"},{"start":3956.45,"text":"then they use that model."},{"start":3957.53,"text":"And this is the simplest variant of this."},{"start":3959.51,"text":"And don't be worried that it doesn't do that well"},{"start":3961.95,"text":"on linear kinds of problems."},{"start":3963.65,"text":"It shines much later, and that's why we teach it too."},{"start":3966.55,"text":"you okay so on that note any questions on on this part of the framework that"},{"start":3973.05,"text":"was a little bit kind of conceptual and weird so I'm sure there are questions"},{"start":3977.31,"text":"please fire away that's a good way to get no questions I guess no questions"},{"start":3986.89,"text":"awesome we'll keep going all right all right so the next thing I want to show"},{"start":3992.71,"text":"you the last issue is this naive Bayes model which is a generative model for"},{"start":3996.13,"text":"discrete features so we're looking at things that were discrete oh question thank you thank you so"}],"speech_gaps":[],"frame":"../frames/v054/023.webp","frame_time":3831.59},{"title":"高斯判别分析的生成模型与应用","segments":[{"id":455,"text":"much for bailing me out there appreciate it like uh like one of the earlier slides it said that um","start":3999.35,"end":4006.07},{"id":456,"text":"like sigma sub ij greater than zero means positive correlation between","start":4006.07,"end":4011.15},{"id":457,"text":"should that be with the inverse yeah so that was in the specific case that they were 2d","start":4012.55,"end":4019.21},{"id":458,"text":"Yeah, yeah.","start":4019.81,"end":4020.45},{"id":459,"text":"Great question.","start":4020.61,"end":4021.37},{"id":460,"text":"Please.","start":4021.79,"end":4022.27},{"id":461,"text":"Can you explain the pro of GDA that wasn't on the slide that you mentioned","start":4022.79,"end":4027.01},{"id":462,"text":"and why it's been so common?","start":4027.01,"end":4028.85},{"id":463,"text":"Oh, yeah.","start":4029.57,"end":4030.25},{"id":464,"text":"Great question.","start":4030.33,"end":4030.85},{"id":465,"text":"So the question was, why has GDA actually taken off in this?","start":4030.99,"end":4034.07},{"id":466,"text":"And at one level, I was just asserting the fact that generative models","start":4034.19,"end":4037.93},{"id":467,"text":"are the things that are potentially the most exciting uses of machine learning","start":4037.93,"end":4042.63},{"id":468,"text":"over the last couple of years, generating text, generating images.","start":4042.63,"end":4045.29},{"id":469,"text":"And in some ways, that's basically saying that this line of thinking led to them.","start":4045.29,"end":4049.93},{"id":470,"text":"The places where it's better or worse, I guess what I wanted to get across there is it's","start":4050.61,"end":4055.57},{"id":471,"text":"very tempting when you take these kind of courses, we kind of put this very constrained","start":4055.57,"end":4059.17},{"id":472,"text":"box on you about how we're explaining their uses.","start":4059.17,"end":4061.45},{"id":473,"text":"And one use for machine learning is kind of the traditional statistics use.","start":4061.75,"end":4064.97},{"id":474,"text":"I want to take a bunch of data, I want to fit a model to it, then I want to predict","start":4065.19,"end":4069.23},{"id":475,"text":"back.","start":4069.23,"end":4069.49},{"id":476,"text":"And so in statistics, you care a lot about did I get the right parameters and all the","start":4069.83,"end":4073.43},{"id":477,"text":"rest.","start":4073.43,"end":4073.55},{"id":478,"text":"And what I want to say is one thing that I do like about machine learning and AI is that it's been fairly creative about how it's going.","start":4074.05,"end":4079.69},{"id":479,"text":"use the models. And so learning a large model to then go and generate a bunch of text is kind of an abhorrent thing to do by statistical standards. People ask questions like, well, how do you even know if it learns the same thing twice? And we're like, we don't know.","start":4079.95,"end":4092.37},{"id":480,"text":"But sometimes it generates cool text and pretty pictures. I remember once when there are these GANs and they first came out. There's a guy called Alyosha Efros, who's a professor at Berkeley. And we're having coffee. And he told me something. I don't know if you mind me repeating this, but it was a wonderful thing. So we were looking at the first... They're called Cycle GANs. He was a developer of these things called Cycle GANs. And he was showing me these pretty pictures on his laptop. This is like what...","start":4092.75,"end":4112.05},{"id":481,"text":"computer science nerds do. They're like, oh, let me show you my new model. So he showed me his new model. We're having coffee. And I was like, Alyosha, but how do you evaluate it? Like, it looks super cool. How are you evaluating it to try and like, you know, hill climb it and do all these things? He said, Chris.","start":4112.78,"end":4124.08},{"id":482,"text":"My girlfriend, she makes pretty pictures and I love her. And this model, it also makes pretty pictures and I love it. And I was like, done. I'm good. That was the best explanation I've ever heard. So the reason I say that is these generative models, they have this feel that's a little bit squishy to get your head around. They're not just valuable because they do a better job predicting something, but they have all these other capabilities. And fundamentally, like...","start":4125.44,"end":4146.5},{"id":483,"text":"Building models to understand how data are constructed has been an incredibly fruitful","start":4146.99,"end":4152.33},{"id":484,"text":"idea. Here, it seems like a stupid idea like,","start":4152.87,"end":4155.57},{"id":485,"text":"Oh, I fit the model and I just got a line out in the end.","start":4155.63,"end":4157.57},{"id":486,"text":"And so I feel bad. I'm doing you a disservice by saying,","start":4157.69,"end":4160.47},{"id":487,"text":"It's better here and not better there. Who cares? I don't care.","start":4160.55,"end":4163.25},{"id":488,"text":"I don't care if you fit your linear models of GDA or logistic regression.","start":4163.37,"end":4166.25},{"id":489,"text":"But look how amazing the LLMs and the nano banana and everything is. It's amazing.","start":4166.49,"end":4173.35},{"id":490,"text":"And that line of thinking of let's model the data led to it.","start":4173.53,"end":4176.19}],"notes":["本段讨论了高斯判别分析（GDA）作为生成模型的优势，强调了生成模型在机器学习中的重要性，特别是在文本和图像生成方面的应用。讲者提到，生成模型不仅仅是用于预测，还具有其他能力，如生成高质量的文本和图像。","讲者提到，生成模型在统计学中可能被视为不寻常，因为它们不依赖于精确的参数估计，而是通过模型生成数据。这种做法在传统统计学中可能被认为是不规范的，但在机器学习中却非常常见。","讲者以Cycle GANs为例，说明了生成模型的评估方式。他提到，生成模型的评估并不总是依赖于精确的预测，而是通过生成的输出是否具有吸引力或实用性来判断。","讲者强调，构建模型以理解数据的构造是一个非常有成果的想法。即使在看似简单的模型（如GDA）中，这种思想也能带来深远的影响。","讲者提到，生成模型的灵活性和创造性是其受欢迎的原因之一。它们不仅用于预测，还用于生成新的数据，这在现代机器学习中非常重要。","讲者最后指出，生成模型的思路（即建模数据）是推动现代机器学习发展的关键因素之一，如大型语言模型（LLMs）和生成对抗网络（GANs）的成功。"],"formulas":[],"uncertainties":["sigma sub ij greater than zero means positive correlation between","should that be with the inverse yeah so that was in the specific case that they were 2d"],"diagram":"none","start":3999.35,"end":4176.19,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3999.35,"text":"much for bailing me out there appreciate it like uh like one of the earlier slides it said that um"},{"start":4006.07,"text":"like sigma sub ij greater than zero means positive correlation between"},{"start":4012.55,"text":"should that be with the inverse yeah so that was in the specific case that they were 2d"},{"start":4019.81,"text":"Yeah, yeah."},{"start":4020.61,"text":"Great question."},{"start":4021.79,"text":"Please."},{"start":4022.79,"text":"Can you explain the pro of GDA that wasn't on the slide that you mentioned"},{"start":4027.01,"text":"and why it's been so common?"},{"start":4029.57,"text":"Oh, yeah."},{"start":4030.33,"text":"Great question."},{"start":4030.99,"text":"So the question was, why has GDA actually taken off in this?"},{"start":4034.19,"text":"And at one level, I was just asserting the fact that generative models"},{"start":4037.93,"text":"are the things that are potentially the most exciting uses of machine learning"},{"start":4042.63,"text":"over the last couple of years, generating text, generating images."},{"start":4045.29,"text":"And in some ways, that's basically saying that this line of thinking led to them."},{"start":4050.61,"text":"The places where it's better or worse, I guess what I wanted to get across there is it's"},{"start":4055.57,"text":"very tempting when you take these kind of courses, we kind of put this very constrained"},{"start":4059.17,"text":"box on you about how we're explaining their uses."},{"start":4061.75,"text":"And one use for machine learning is kind of the traditional statistics use."},{"start":4065.19,"text":"I want to take a bunch of data, I want to fit a model to it, then I want to predict"},{"start":4069.23,"text":"back."},{"start":4069.83,"text":"And so in statistics, you care a lot about did I get the right parameters and all the"},{"start":4073.43,"text":"rest."},{"start":4074.05,"text":"And what I want to say is one thing that I do like about machine learning and AI is that it's been fairly creative about how it's going."},{"start":4079.95,"text":"use the models. And so learning a large model to then go and generate a bunch of text is kind of an abhorrent thing to do by statistical standards. People ask questions like, well, how do you even know if it learns the same thing twice? And we're like, we don't know."},{"start":4092.75,"text":"But sometimes it generates cool text and pretty pictures. I remember once when there are these GANs and they first came out. There's a guy called Alyosha Efros, who's a professor at Berkeley. And we're having coffee. And he told me something. I don't know if you mind me repeating this, but it was a wonderful thing. So we were looking at the first... They're called Cycle GANs. He was a developer of these things called Cycle GANs. And he was showing me these pretty pictures on his laptop. This is like what..."},{"start":4112.78,"text":"computer science nerds do. They're like, oh, let me show you my new model. So he showed me his new model. We're having coffee. And I was like, Alyosha, but how do you evaluate it? Like, it looks super cool. How are you evaluating it to try and like, you know, hill climb it and do all these things? He said, Chris."},{"start":4125.44,"text":"My girlfriend, she makes pretty pictures and I love her. And this model, it also makes pretty pictures and I love it. And I was like, done. I'm good. That was the best explanation I've ever heard. So the reason I say that is these generative models, they have this feel that's a little bit squishy to get your head around. They're not just valuable because they do a better job predicting something, but they have all these other capabilities. And fundamentally, like..."},{"start":4146.99,"text":"Building models to understand how data are constructed has been an incredibly fruitful"},{"start":4152.87,"text":"idea. Here, it seems like a stupid idea like,"},{"start":4155.63,"text":"Oh, I fit the model and I just got a line out in the end."},{"start":4157.69,"text":"And so I feel bad. I'm doing you a disservice by saying,"},{"start":4160.55,"text":"It's better here and not better there. Who cares? I don't care."},{"start":4163.37,"text":"I don't care if you fit your linear models of GDA or logistic regression."},{"start":4166.49,"text":"But look how amazing the LLMs and the nano banana and everything is. It's amazing."},{"start":4173.53,"text":"And that line of thinking of let's model the data led to it."}],"speech_gaps":[],"frame":"../frames/v054/024.webp","frame_time":4011.35},{"title":"扩散模型与生成模型的对比","segments":[{"id":491,"text":"That's all I wanted to get across. I just really love this stuff. So like, yeah, please.","start":4176.19,"end":4179.55},{"id":492,"text":"Oh yeah, great question. So I think diffusion is actually later in the course.","start":4187.19,"end":4191.69},{"id":493,"text":"So I'll give you, I defer a full one to it, but it's much weirder than that.","start":4191.83,"end":4195.51},{"id":494,"text":"Okay. So actually the idea is that imagine that you magically had a process that was reversible","start":4195.69,"end":4202.49},{"id":495,"text":"that could take any image in the world and add noise to it and then you got it","start":4202.49,"end":4206.49},{"id":496,"text":"through a chain of events now imagine because you had that process and it","start":4206.49,"end":4209.81},{"id":497,"text":"existed that you could somehow invert it go backwards okay now what I'm gonna do","start":4209.81,"end":4215.11},{"id":498,"text":"instead of getting an image because I want to generate a novel images I'm","start":4215.11,"end":4218.35},{"id":499,"text":"gonna pick a random spot in the space that's just noisy and I'm gonna run that","start":4218.35,"end":4222.51},{"id":500,"text":"same process as if the real image had been noise to this spot conceptually and","start":4222.51,"end":4227.69},{"id":501,"text":"with that I will generate a high quality high resolution image and so originally","start":4227.69,"end":4231.61},{"id":502,"text":"like that is the idea and so it turns out the math underneath it","start":4231.61,"end":4235.03},{"id":503,"text":"Almost no one actually uses the real math. Underneath it are these things, stochastic differential equations I wrote a whole thing about. But no one uses that stuff, honestly. They use tricks now to get it to work. But that's the beautiful idea that has been most valuable under diffusion. That's how stable diffusion works, if you know what stable diffusion is, from way, way back.","start":4235.72,"end":4253.04},{"id":504,"text":"uh maybe five six years ago and many of the new image generation models are like that there are also text diffusion models that people have done stefano has a wonderful thing and volo and aaron lu wrote this wonderful paper a couple years trying to get text diffusion to work which has some really nice properties in code which is super cool uh thing as well you can also do it in any other environment yeah you do not need about diffusion for this yeah please can you please try to use all those as like a discriminator model","start":4253.42,"end":4278.68},{"id":505,"text":"Yeah, I think the thing is, you implicitly do, but you can do such more powerful things. You can, for example, have it write a piece of code that does a test, which is something you can't really imagine a logistic regressor doing. I guess there's some way to screen out to do it. But the generative use cases tend to be more like, write something to do it rather than use it. Now, when they first came out, this is a little bit by way of history, there were models that preceded the GPT models called BERT models. They were all named after BERT and ELMO and all the rest. And the first BERT models, they were these pre-trained models.","start":4281.7,"end":4311.44},{"id":506,"text":"trained models that are underneath the covers. And then people would run their sentences through them, then use those embeddings, the things that will come out, as we'll see at the end, to do classification. And so there's like kind of the idea that all the information was baked into the model, and then you could use a discriminator on top. And so those sometimes called adapters, people do use those all the times if you have a specific choice as a good representation. That is now also widely used in places like stock trading and other places that weirdly they started to use models that look like that, not models, but backbones to be able to have.","start":4311.24,"end":4340.4},{"id":507,"text":"a model which is trained generatively, gets a good representation of the space, and then the","start":4340.46,"end":4344.92},{"id":508,"text":"terminology is fine-tuned for the particular application. And I think we will do fine-tuning","start":4344.92,"end":4349.06},{"id":509,"text":"a model which is trained generatively, gets a good representation of the space, and then the","start":4349.06,"end":4353.8}],"notes":["本段主要讲解了扩散模型的基本思想，即通过在图像中添加噪声并逆向过程来生成高质量图像。讲者提到，虽然数学上涉及随机微分方程，但实际应用中使用的是技巧而非直接使用这些数学公式。此外，讲者还提到扩散模型在图像生成中的应用，如Stable Diffusion，并指出许多新的图像生成模型都基于这一思想。","讲者进一步讨论了扩散模型在文本生成中的应用，如文本扩散模型，并提到Stefano、Volo和Aaron Lu等人撰写的论文。这些模型在代码中具有良好的性质，且可以应用于任何环境。讲者还提到，扩散模型不需要特定的环境，但可以作为判别器模型使用。","讲者对比了扩散模型与传统的分类模型，如逻辑回归，指出扩散模型能够生成更强大的结果，例如编写代码进行测试。讲者还提到，早期的模型如BERT和ELMO在自然语言处理中被广泛使用，并且这些模型通过预训练获得良好的表示。","讲者提到，这些预训练模型可以用于分类任务，并且在模型顶部可以使用判别器。这些模型有时被称为适配器，被广泛用于特定任务中。讲者还提到，这些模型在股票交易等其他领域也被使用，作为模型的骨干结构。","讲者最后提到，生成模型可以训练以获得空间的良好表示，然后进行微调以适应特定应用。讲者表示将在课程的最后几周讨论微调，并指出这些概念已经得到了广泛的应用。","讲者强调了扩散模型的广泛应用，包括图像生成、文本生成以及在其他领域的应用。同时，讲者指出，虽然数学上涉及复杂的随机微分方程，但实际应用中使用的是技巧，而非直接使用这些数学公式。"],"formulas":[],"uncertainties":["stefano has a wonderful thing","volo and aaron lu wrote this wonderful paper a couple years","some really nice properties in code which is super cool uh thing as well","you do not need about diffusion for this","you can also do it in any other environment","you do not need about diffusion for this","you can also do it in any other environment","a model which is trained generatively, gets a good representation of the space, and then the"],"diagram":"none","start":4176.19,"end":4353.8,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4176.19,"text":"That's all I wanted to get across. I just really love this stuff. So like, yeah, please."},{"start":4187.19,"text":"Oh yeah, great question. So I think diffusion is actually later in the course."},{"start":4191.83,"text":"So I'll give you, I defer a full one to it, but it's much weirder t  how you set them up.","start":4413.98,"end":4418.1},{"id":531,"text":"same form. The models underneath the covers seem to require little bits of how you set them up.","start":4418.1,"end":4423.68},{"id":532,"text":"One is like these graphical models,","start":4424.08,"end":4425.46},{"id":533,"text":"which we'll talk about very briefly.","start":4425.64,"end":4426.9},{"id":534,"text":"And then others are these more complicated backends.","start":4427.06,"end":4428.14},{"id":535,"text":"So it doesn't have the kind of clean simplification","start":4428.96,"end":4431.78},{"id":536,"text":"So it doesn't have the kind of clean simplification","start":4431.88,"end":4433.6},{"id":537,"text":"can be kind of put in a nice bucket.","start":4433.6,"end":4435.46},{"id":538,"text":"Maybe it will in like five, 10 years,","start":4435.46,"end":4436.84},{"id":539,"text":"or someone still figure out like,","start":4437.2,"end":4438.8},{"id":540,"text":"hey, here's a nice way to view all of these things","start":4438.92,"end":4440.22},{"id":541,"text":"hey, here's a nice way to view all of these things","start":4440.3,"end":4442.4},{"id":542,"text":"But to my knowledge,","start":4442.4,"end":4443.08},{"id":543,"text":"there's nothing that's really a competitor there to do that.","start":4443.44,"end":4444.3},{"id":544,"text":"there's nothing that's really a competitor there to do that.","start":4444.38,"end":4446.78},{"id":545,"text":"Cool.","start":4446.88,"end":4447.58},{"id":546,"text":"Cool.","start":4448.68,"end":4449.04},{"id":547,"text":"Others?","start":4449.74,"end":4450.1},{"id":548,"text":"Awesome.","start":4451.16,"end":4451.52},{"id":549,"text":"All right.","start":4451.52,"end":4452.86},{"id":550,"text":"Okay, so back to the questions on discriminators. There are places that you would want to use this. This is one of the great places to use the models as we were just discussing before. You want to do spam or email classification, then using one of these BERT-style model "start":4428.96,"text":"And then others are these more complicated backends."},{"start":4431.88,"text":"So it doesn't have the kind of clean simplification"},{"start":4433.6,"text":"where all of that line of work"},{"start":4435.46,"text":"can be kind of put in a nice bucket."},{"start":4437.2,"text":"Maybe it will in like five, 10 years,"},{"start":4438.92,"text":"or someone still figure out like,"},{"start":4440.3,"text":"hey, here's a nice way to view all of these things"},{"start":4442.4,"text":"in the right abstraction."},{"start":4443.44,"text":"But to my knowledge,"},{"start":4444.38,"text":"there's nothing that's really a competitor there to do that."},{"start":4446.88,"text":"Wonderful observation."},{"start":4448.68,"text":"Cool."},{"start":4449.74,"text":"Others?"},{"start":4451.16,"text":"Awesome."},{"start":4451.52,"text":"All right."},{"start":4454.3,"text":"Okay, so back to the questions on discriminators. There are places that you would want to use this. This is one of the great places to use the models as we were just discussing before. You want to do spam or email classification, then using one of these BERT-style models, so-called bidirectional models, to go through and do an encoding and then do a classifier is actually a great representation. Sentiment analysis is positive or negative, but we'll talk about the simplest way to do it."},{"start":4478.37,"text":"Same rule, model Px given y, Py classified by Bayes rule. This will again be a dirt cheap way to do it."},{"start":4485.96,"text":"So the idea is we're going to build a dictionary of the top words from the training corpus. Think about top as most informative. So what does it mean for a word to be most informative? Well, it doesn't mean the most frequent, like the, a, and what are called stop words. You probably don't want to put into your vocabulary because they don't give you a lot of signal. But maybe there's words that are very highly loaded for various sentiment. I hate this thing, whatever. Claude's list of curse words. Whatever."},{"start":4515.56,"text":"that binary vector and that binary vector is is that each one you're going to put a one if it's"},{"start":4519.5,"text":"there which is called one hot or zero otherwise okay right all right so for example by by free"},{"start":4528.0,"text":"meeting g29 homework this is what you would get if these were your five words this is how you would"}],"speech_gaps":[{"start":4394.48,"end":4397.0}],"frame":"../frames/v054/026.webp","frame_time":4365.8},{"title":"高斯判别分析与文本特征化","segments":[{"id":556,"text":"Featurizing this last part is how you would featurize your text. Okay, now as pointed out earlier, the new","start":4532.96,"end":4539.88},{"id":557,"text":"way of doing this is that instead of having these zero one features, you would potentially have","start":4539.88,"end":4543.74},{"id":558,"text":"features that were learned or whatever, but this is the simple standard model. And by the way,","start":4543.74,"end":4547.74},{"id":559,"text":"it's not that bad of a model. One of the things that's amazing about the models of the ancients","start":4547.78,"end":4552.16},{"id":560,"text":"is that they work pretty well. Our new models sometimes work occasionally quite amazingly,","start":4552.16,"end":4556.96},{"id":561,"text":"sometimes make really dumb mistakes. So with d binary features, x could take 2 to the d possible","start":4557.16,"end":4567.24},{"id":562,"text":"values. So now you have a problem because if D has like 10,000 or 50,000 words","start":4567.24,"end":4573.74},{"id":563,"text":"well like what is it 2 to the 10 to the 300 so like 2 to the 600 like the number","start":4573.74,"end":4578.58},{"id":564,"text":"of atoms in the observable universe like we're toast we cannot represent this","start":4578.58,"end":4581.56},{"id":565,"text":"okay we can't write it down. So we can't possibly model this as a full","start":4581.56,"end":4588.52},{"id":566,"text":"multinomial. So what are we going to do? Well we're going to make a","start":4588.52,"end":4594.92},{"id":567,"text":"simplifying assumption about our data. We're going to assume that these words are emitted","start":4594.92,"end":4598.4},{"id":568,"text":"effectively independently. We make a different kind of independence assumption. And we're going","start":4598.4,"end":4602.96},{"id":569,"text":"to assume that they're developed conditionally. So what it's going to say is the probability that","start":4602.96,"end":4606.6},{"id":570,"text":"xi, x1, xd are actually emitted are going to be independent conditional on y. So given the class,","start":4606.6,"end":4615.12},{"id":571,"text":"given the center","start":4615.66,"end":4616.58},{"id":572,"text":"The words you use, you may pick which words to use independently. We're not going to make any assumption on that. And clearly, they're not independent. But we're going to assume that. And we're going to be able to factor the probability distribution in this really nice way. And that's going to let us go from having 2 to the d examples to having something much smaller, d. OK. So the chain rule says you can factor in this way, where you're continually adding context.","start":4617.49,"end":4646.3},{"id":573,"text":"But this drops all conditioning on other features. What it basically means is another way of saying you don't care about the probability that you use one word in another. So in particular, if you said, you know, you had some negation and they're not something, right? It's not the worst, right? It's not super positive, but it's the worst would get highlighted and the not would get highlighted and they would get multiplied together, right? And not you would probably drive because not has a valence to it. So it wouldn't fit into this. So you don't condition on those two features. Everything is treated.","start":4647.65,"end":4676.53},{"id":574,"text":"effectively conditionally independent. Now, how does this work? So you have some prior probability, the probability of spam in this case, right? That your likelihood is going to be there.","start":4677.1,"end":4688.3},{"id":575,"text":"You have exactly the same kinds of conditional distributions that we saw previously. Given that it's spam, what's the likelihood that it has a word? Spam has gotten much better, but whatever spam you've seen recently, I don't look that much in my spam folder. But if you look in there, you'll see what they're trying to sell you or whatever introduce you to or whoever, you'll be there. So you have those words.","start":4689.42,"end":4711.32}],"notes":["本段讨论了文本特征化的问题，指出当特征数量很大时，如10,000或50,000个单词，使用全多项式模型是不可行的，因为可能的组合数量极大，无法处理。因此，需要引入简化假设，如条件独立性假设。","讲者提到，虽然单词之间在现实中不是完全独立的，但可以假设它们在给定类别（如垃圾邮件）的条件下是独立的。这种假设使得概率分布可以被分解，从而大大减少模型的复杂度。","讲者通过举例说明，即使某些单词之间存在语义上的关联（如否定词和其修饰对象），在条件独立性假设下，这些关联不会被考虑，从而简化了模型。","讲者进一步指出，这种条件独立性假设允许使用链式法则来分解概率分布，从而将模型的复杂度从指数级降低到线性级。","讲者提到，这种模型在实际应用中表现良好，尽管有时会犯错误，但其简单性和有效性使其成为一种实用的方法。","最后，讲者以垃圾邮件分类为例，说明如何利用条件独立性假设来构建模型，包括先验概率和条件分布的使用。"],"formulas":[],"uncertainties":["2 to the 10 to the 300","2 to the 600"],"diagram":"none","start":4532.96,"end":4711.32,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4532.96,"text":"featurize this last part is how you would featurize your text okay now as pointed out earlier the new"},{"start":4539.88,"text":"way of doing this is that instead of having these zero one features you would potentially have"},{"start":4543.74,"text":"features that were learned or whatever, but this is the simple standard model. And by the way,"},{"start":4547.78,"text":"it's not that bad of a model. One of the things that's amazing about the models of the ancients"},{"start":4552.16,"text":"is that they work pretty well. Our new models sometimes work occasionally quite amazingly,"},{"start":4557.16,"text":"sometimes make really dumb mistakes. So with d binary features, x could take 2 to the d possible"},{"start":4567.24,"text":"values. So now you have a problem because if D has like 10,000 or 50,000 words"},{"start":4573.74,"text":"well like what is it 2 to the 10 to the 300 so like 2 to the 600 like the number"},{"start":4578.58,"text":"of atoms in the observable universe like we're toast we cannot represent this"},{"start":4581.56,"text":"okay we can't write it down. So we can't possibly model this as a full"},{"start":4588.52,"text":"multinomial. So what are we going to do? Well we're going to make a"},{"start":4594.92,"text":"simplifying assumption about our data. We're going to assume that these words are emitted"},{"start":4598.4,"text":"effectively independently. We make a different kind of independence assumption. And we're going"},{"start":4602.96,"text":"to assume that they're developed conditionally. So what it's going to say is the probability that"},{"start":4606.6,"text":"xi, x1, xd are actually emitted are going to be independent conditional on y. So given the class,"},{"start":4615.66,"text":"given the center"},{"start":4617.49,"text":"The words you use, you may pick which words to use independently. We're not going to make any assumption on that. And clearly, they're not independent. But we're going to assume that. And we're going to be able to factor the probability distribution in this really nice way. And that's going to let us go from having 2 to the d examples to having something much smaller, d. OK. So the chain rule says you can factor in this way, where you're continually adding context."},{"start":4647.65,"text":"But this drops all conditioning on other features. What it basically means is another way of saying you don't care about the probability that you use one word in another. So in particular, if you said, you know, you had some negation and they're not something, right? It's not the worst, right? It's not super positive, but it's the worst would get highlighted and the not would get highlighted and they would get multiplied together, right? And not you would probably drive because not has a valence to it. So it wouldn't fit into this. So you don't condition on those two features. Everything is treated."},{"start":4677.1,"text":"effectively conditionally independent. Now, how does this work? So you have some prior probability, the probability of spam in this case, right? That your likelihood is going to be there."},{"start":4689.42,"text":"You have exactly the same kinds of conditional distributions that we saw previously. Given that it's spam, what's the likelihood that it has a word? Spam has gotten much better, but whatever spam you've seen recently, I don't look that much in my spam folder. But if you look in there, you'll see what they're trying to sell you or whatever introduce you to or whoever, you'll be there. So you have those words."}],"speech_gaps":[],"frame":"../frames/v054/027.webp","frame_time":4544.96},{"title":"高斯判别分析与生成模型","segments":[{"id":576,"text":"And then you'll have a bunch of words that are in non-SPAM, right? Like, I don't know, faculty meeting. But they start putting that in SPAM, we're all toast. Anyway, okay. So this only has now order D parameters, 2D plus 1. Why? One parameter here, because there's two classes. And D parameters to represent each of these. Why D parameters? Because you need one weight for every term in every class, right? So you have D terms, two classes, 2D.","start":4713.04,"end":4742.08},{"id":577,"text":"instead of 2 to the d. So we've gone from exponential to linear. So far so good? All right. All right. So how are the estimates? Well, no surprise. How do you estimate the fraction of spam? You count the fraction of spam. How do you estimate how many words contain, you know, spam emails contain the word j? Well, you look at all the spam emails. You see how many contain the word j, and you divide. That's your fraction. And all of these are most likely estimates.","start":4742.63,"end":4774.66},{"id":578,"text":"It's just like GDA. It's dirt cheap to train even on huge corporates, and it's surprisingly accurate. It run inferences dirt cheap as well. You just look at the vectors, you look them up, multiply them, done, or you take the logs and add them, either way. Clear enough? This is a very efficient model. This is how you classify, just like that. You look at the two things, you take the logs, you add them up. We talked about Laplace smoothing. This is the magic.","start":4776.24,"end":4806.52},{"id":579,"text":"We add some ones. Feels good. All right.","start":4807.13,"end":4812.15},{"id":580,"text":"I can make a more fancy version of that. We're going to talk about regularization on Wednesday. But the basic thing here is what prevents zero probabilities, and it shrinks your confidence in estimates. And we'll talk about various forms of regularization that basically make the model less confident about what it's seeing. This is a very simple smoothing form that actually gives interesting, appreciable results. You can use other numbers there too. It's not a big deal. All right. So these are the two generative models that are there.","start":4813.34,"end":4841.68},{"id":581,"text":"And then I want to summarize and get you out of here on time. So we introduce these generative models. We classify the Bayes rule.","start":4842.67,"end":4848.95},{"id":582,"text":"We talked a little bit about Gaussians, 1D and 2D. We derived GDA, which was the Gaussian discriminative analysis, where everything was class conditional Gaussian. We then did class conditional naive Bayes on discrete features very briefly. And in both cases, we had these nice closed form maximum likelihood estimators. I did not derive the maximum likelihood estimators in the second case, but the proof is identically the same. You set up the logs, you compute the derivatives, and you get a bunch of equations that you can very easily solve. We did a little bit of matrix multiplication.","start":4849.55,"end":4878.63},{"id":583,"text":"and other stuff that was there. If that was unfamiliar to you, take a look at that. In the next class, we're going to look through data sets and other things there. And we're going to talk about training sets and test sets and all kinds of fun stuff. Have a great rest of your week.","start":4878.83,"end":4891.71}],"notes":["本段讲解了高斯判别分析（GDA）的基本思想，即通过参数化每个类别的条件概率分布来实现分类。其中提到，对于两个类别，参数数量为2D+1，其中D是特征数量，因为每个类别需要D个参数来表示其分布，而类别先验概率需要一个参数。","在估计过程中，讲者强调了使用频率统计的方法，例如通过计算垃圾邮件中某个词出现的频率来估计其概率。同时，提到了拉普拉斯平滑（Laplace smoothing）作为防止零概率的简单方法，这在实际应用中非常重要。","讲者还提到，GDA模型在训练和推理上都非常高效，因为其计算复杂度是线性的，而不是指数级的。这使得GDA在处理大规模数据集时具有优势。","在讨论生成模型时，讲者提到了两种主要的生成模型：基于高斯分布的GDA和基于离散特征的朴素贝叶斯。两者都具有闭合形式的最大似然估计器，这使得模型训练变得简单。","讲者还提到，将在下节课讨论训练集和测试集的划分，以及相关的评估方法。这表明课程内容将逐步深入到模型评估和验证的阶段。","最后，讲者总结了本节课的主要内容，并提醒学生在下节课中关注数据集和评估方法的相关内容。这表明课程结构清晰，逐步推进，从模型构建到评估。"],"formulas":[{"latex":"P(Y = c) = \\frac{N_c}{N}","symbols":"P(Y = c) 表示类别 c 的先验概率，N_c 是类别 c 的样本数量，N 是总样本数","explanation":"公式正确，表示类别先验概率的计算方式，符合朴素贝叶斯分类的基本原理。","evidence":"instead of 2 to the d. So we've gone from exponential to linear. So far so good? All right. All right. So how are the estimates? Well, no surprise. How do you estimate the fraction of spam? You count the fraction of spam. How do you estimate how many words contain, you know, spam emails contain the word j? Well, you look at all the spam emails. You see how many contain the word j, and you divide. That's your fraction. And all of these are most likely estimates."}],"uncertainties":["在讲者提到 '2 to the d' 时，可能指的是 2^d，但未明确说明 d 的含义，因此无法确定其具体数学表达式。","在讲者提到 'class conditional naive Bayes' 时，未明确说明其具体数学形式，因此无法列出完整的公式。","在讲者提到 'matrix multiplication' 时，未明确说明具体矩阵操作，因此无法列出完整的公式。"],"diagram":"none","start":4713.04,"end":4891.71,"asr_flags":[],"math_clarifications":["公式1正确，表示后验概率的贝叶斯公式，符合贝叶斯定理的基本形式。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4713.04,"text":"And then you'll have a bunch of words that are in non-SPAM, right? Like, I don't know, faculty meet  want to summarize and get you out of here on time. So we introduce these generative models. We classify the Bayes rule."},{"start":4849.55,"text":"We talked a little bit about Gaussians, 1D and 2D. We derived GDA, which was the Gaussian discriminative analysis, where everything was class conditional Gaussian. We then did class conditional naive Bayes on discrete features very briefly. And in both cases, we had these nice closed form maximum likelihood estimators. I did not derive the maximum likelihood estimators in the second case, but the proof is identically the same. You set up the logs, you compute the derivatives, and you get a bunch of equations that you can very easily solve. We did a little bit of matrix multiplication."},{"start":4878.83,"text":"and other stuff that was there. If that was unfamiliar to you, take a look at that. In the next class, we're going to look through data sets and other things there. And we're going to talk about training sets and test sets and all kinds of fun stuff. Have a great rest of your week."}],"speech_gaps":[],"frame":"../frames/v054/028.webp","frame_time":4725.04}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
