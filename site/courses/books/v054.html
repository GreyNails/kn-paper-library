<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>【斯坦福CS229】高斯判别分析</title><link rel="stylesheet" href="../assets/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】高斯判别分析 · 完整初稿</p><video id="video" hidden controls preload="none"></video><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v054","title":"【斯坦福CS229】高斯判别分析","course":"机器学习","pages":[{"title":"高斯判别分析简介与生成模型概述","segments":[{"id":0,"text":"Good afternoon. Welcome to CS229. This is going to be lecture five. We're going to talk about Gaussian discriminant analysis. So this is going to be our first foray into generative models. These generative models are pretty interesting because, you know, they're the G and GPT. So you hear the chat GPT, it's generative pre-trained transformers. We will maybe do pre-training a little bit later, maybe transformers a little bit later. But today we're getting our first example of a generative algorithm. And intuitively what goes on in a generative algorithm is you try"},{"id":1,"text":"to learn a representation of your data and you're going to see it in about the simplest form that we can do today so you can see what that means to learn a representation of your data or understand that piece and then how you can use that for discrimination so you'll see the things and we'll relate it back"},{"id":2,"text":"So our plan is roughly as follows. We're going to talk a little bit about this generative versus discriminative thing that I've just been mentioning. These are a different class of these algorithms. I would say one kind of side note, when we teach these lectures like, I don't know, six, seven years ago, whenever it was."},{"id":3,"text":"When you talk about these generative models, people weren't that interested in the generative models because they didn't seem like they got to state-of-the-art performance. But now they are responsible for a lot of the growth in AI. And this fact that they're learning these representations is actually quite valuable. We're then going to talk about the Gaussian distribution. We're going to talk about the difference between how we go from 1D to 2D functions. And we're going to introduce a bunch of notations. So hopefully this will be things that are familiar to you."},{"id":4,"text":"But if not, don't worry. There's going to be a bunch of pictures. Now, I should warn you, I let Claude rewrite a bunch of the pictures and generate a bunch of plots. I hope they're okay. I checked them. But we'll see how it goes. I gave you a bunch of visualizations. So we'll see how that goes. We'll then have enough information to do GDA, Gaussian Discriminant Analysis. And then we'll do maximum likelihood for GDA. What will be interesting about this, which is not a general fact, but is interesting for this, is we'll be able to do estimation without having to do a lot of learning."},{"id":5,"text":"And so in fact, in many cases, in traditional SGD learning, we'll be able to do something fairly quick and dirty. And we'll also get exposed to how these MLE parameters are actually estimated for generative models, which we'll use a lot as we go through and build up the rest of the hierarchy of Gaussian models. And so one thing I should just say about the kind of if you're picking up on how the course is taught, we start with the most kind of simple setting that we can. And we're kind of relaxing one assumption as we go."},{"id":6,"text":"one new moving piece in any lecture. But if you look back, you're like, wow, we've actually hopefully covered a fair amount of ground. I'm going to talk a little bit about the GDA decision boundary. I couldn't help myself here. There's one thing which is I don't think is in the notes, but I just added in, which has to do with these things called quadratic decision boundaries, because the question has come up every time I've ever taught it. So I just put in visualization. Then I'm going to talk about the difference between GDA and logistic regression."}],"notes":["本段介绍了课程的总体安排，包括生成模型与判别模型的区别，以及生成模型在AI发展中的重要性。课程将从最简单的设定开始，逐步放松假设，以帮助学生理解生成模型的基本概念。","课程提到生成模型在早期不被重视，因为它们在性能上不如判别模型，但如今它们在AI领域中扮演了重要角色，特别是在学习数据表示方面。","接下来的课程内容将涉及高斯分布，从一维到二维函数的转换，以及相关符号的引入。这些内容旨在帮助学生建立对高斯分布的理解。","课程还提到将使用可视化工具来辅助教学，包括由Claude生成的图表。这些图表将用于展示高斯判别分析（GDA）的相关概念。","在GDA中，最大似然估计（MLE）将被用于参数估计，这将帮助学生理解生成模型中参数的估计方法。","课程最后提到将讨论GDA的决策边界，特别是二次决策边界，以及GDA与逻辑回归（logistic regression）之间的区别。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.14,"end":176.7,"asr_flags":[],"raw_segments":[{"start":5.14,"text":"Good afternoon. Welcome to CS229. This is going to be lecture five. We're going to talk about Gaussian discriminant analysis. So this is going to be our first foray into generative models. These generative models are pretty interesting because, you know, they're the G and GPT. So you hear the chat GPT, it's generative pre-trained transformers. We will maybe do pre-training a little bit later, maybe transformers a little bit later. But today we're getting our first example of a generative algorithm. And intuitively what goes on in a generative algorithm is you try"},{"start":34.74,"text":"to learn a representation of your data and you're going to see it in about the simplest form that we can do today so you can see what that means to learn a representation of your data or understand that piece and then how you can use that for discrimination so you'll see the things and we'll relate it back"},{"start":49.52,"text":"So our plan is roughly as follows. We're going to talk a little bit about this generative versus discriminative thing that I've just been mentioning. These are a different class of these algorithms. I would say one kind of side note, when we teach these lectures like, I don't know, six, seven years ago, whenever it was."},{"start":65.97,"text":"When you talk about these generative models, people weren't that interested in the generative models because they didn't seem like they got to state-of-the-art performance. But now they are responsible for a lot of the growth in AI. And this fact that they're learning these representations is actually quite valuable. We're then going to talk about the Gaussian distribution. We're going to talk about the difference between how we go from 1D to 2D functions. And we're going to introduce a bunch of notations. So hopefully this will be things that are familiar to you."},{"start":96.09,"text":"But if not, don't worry. There's going to be a bunch of pictures. Now, I should warn you, I let Claude rewrite a bunch of the pictures and generate a bunch of plots. I hope they're okay. I checked them. But we'll see how it goes. I gave you a bunch of visualizations. So we'll see how that goes. We'll then have enough information to do GDA, Gaussian Discriminant Analysis. And then we'll do maximum likelihood for GDA. What will be interesting about this, which is not a general fact, but is interesting for this, is we'll be able to do estimation without having to do a lot of learning."},{"start":124.46,"text":"And so in fact, in many cases, in traditional SGD learning, we'll be able to do something fairly quick and dirty. And we'll also get exposed to how these MLE parameters are actually estimated for generative models, which we'll use a lot as we go through and build up the rest of the hierarchy of Gaussian models. And so one thing I should just say about the kind of if you're picking up on how the course is taught, we start with the most kind of simple setting that we can. And we're kind of relaxing one assumption as we go."},{"start":153.74,"text":"one new moving piece in any lecture. But if you look back, you're like, wow, we've actually hopefully covered a fair amount of ground. I'm going to talk a little bit about the GDA decision boundary. I couldn't help myself here. There's one thing which is I don't think is in the notes, but I just added in, which has to do with these things called quadratic decision boundaries, because the question has come up every time I've ever taught it. So I just put in visualization. Then I'm going to talk about the difference between GDA and logistic regression."}],"speech_gaps":[],"frame":"../frames/v054/001.webp","frame_time":17.14},{"title":"高斯判别分析与生成模型简介","segments":[{"id":7,"text":"These are the discriminative and generative versions. And we're going to see why classically people preferred logistic regression for many, many years. But as I said, that has switched in recent years. The importance of generative models, let's say, arguably dwarfs the discriminative from the point of view of excitement, maybe not of utility. And then we'll talk about naive Bayes, which is like..."},{"id":8,"text":"one of the simplest generative models. We'll do a spam filter because I think there's still some law that we have to teach you how to build a spam filter. All right. Anyway, so we're going to move at a high level. So that's the overarching idea. We're going to move from modeling p of y given x. That is, what is the probability of the label given the data point? That's what we've been doing discriminatively to modeling in the other direction."},{"id":9,"text":"What does the data distribution X look like given Y? I'll make that concrete over this. Awesome. This will be our first generative model."},{"id":10,"text":"So all the algorithms we have seen so far are discriminative. They basically say something like linear regression. P of y given x and theta was modeled as a Gaussian error, if you recall. Logistic regression, it was as a Bernoulli. But the important salient point of both of them is you were given x, you estimated some parameters, and then you then decided which class that it was."},{"id":11,"text":"All right, we learned the exponential family, and that was just a generalization of the same story. So all of them, everything you've seen so far was discriminative. And in each case, we learn this x given y. Now, intuitively, why does that make sense? Why are machine learning people so excited about that? Why do we do it? Well, it seems easier than learning p of x and y at the same time."},{"id":12,"text":"Now, why may that be? P of X and Y at the same time means the probability of your data and of the class. If your class, for example, is relatively simple to describe, like you're classifying two things which kind of couldn't be more different. They're really spread apart. You don't need to spend all your time learning the nooks and crannies of class A versus class B. And I'll come to an example of this in a second. You could probably learn how to separate them, right? That's what discriminators do all the time."},{"id":13,"text":"That's what a discriminative model would do. It tries to learn a separating boundary. We saw this again and again."},{"id":14,"text":"We're going to consider something else. Now, arguably, you should be able to tell the difference between cats and elephants pretty easily. And these are not actual data from cats and elephants. And I don't know why I picked cats and elephants. But I think it was dogs and elephants at one point. And then maybe Claude prefers cats to dogs and switched it before I redrafted these. All right. So here's what we're going to do. We're going to look at our generative model. And this is incredibly fictionalized. These are height and weight."},{"id":15,"text":"And we've plotted, apparently, a normalization, some very heavy cats and some very light elephants, I guess here, small elephants. But the idea here is that there's a bunch of cats, which are these circles that are orange. And there's a bunch of elephants, which are those gray squares over there. And this is our data. We want to model and do this."}],"notes":["本段讲解了生成模型与判别模型的区别，强调生成模型在某些情况下可能比判别模型更受关注。生成模型需要建模数据分布，而判别模型则专注于条件概率。","讲者提到生成模型在某些情况下可能比判别模型更有吸引力，但并不一定在实用性上更优。生成模型需要同时建模数据和类别，这在某些情况下可能更复杂。","讲者通过猫和大象的例子说明生成模型的建模思路，即通过数据分布来区分类别。虽然这个例子是虚构的，但有助于理解生成模型的基本思想。","讲者指出，生成模型需要建模数据和类别的联合分布，这可能比仅建模条件概率更复杂，但有时更有优势，尤其是在数据分布具有明显结构时。","讲者提到判别模型通过学习一个分离边界来区分类别，而生成模型则通过建模数据分布来实现分类。","讲者强调生成模型在某些情况下可能更受关注，但判别模型在实际应用中仍然广泛使用，这取决于具体任务和数据的特性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.53,"end":354.44,"asr_flags":[],"raw_segments":[{"start":177.53,"text":"These are the discriminative and generative versions. And we're going to see why classically people preferred logistic regression for many, many years. But as I said, that has switched in recent years. The importance of generative models, let's say, arguably dwarfs the discriminative from the point of view of excitement, maybe not of utility. And then we'll talk about naive Bayes, which is like..."},{"start":198.25,"text":"one of the simplest generative models. We'll do a spam filter because I think there's still some law that we have to teach you how to build a spam filter. All right. Anyway, so we're going to move at a high level. So that's the overarching idea. We're going to move from modeling p of y given x. That is, what is the probability of the label given the data point? That's what we've been doing discriminatively to modeling in the other direction."},{"start":223.69,"text":"What does the data distribution X look like given Y? I'll make that concrete over this. Awesome. This will be our first generative model."},{"start":234.21,"text":"So all the algorithms we have seen so far are discriminative. They basically say something like linear regression. P of y given x and theta was modeled as a Gaussian error, if you recall. Logistic regression, it was as a Bernoulli. But the important salient point of both of them is you were given x, you estimated some parameters, and then you then decided which class that it was."},{"start":257.64,"text":"All right, we learned the exponential family, and that was just a generalization of the same story. So all of them, everything you've seen so far was discriminative. And in each case, we learn this x given y. Now, intuitively, why does that make sense? Why are machine learning people so excited about that? Why do we do it? Well, it seems easier than learning p of x and y at the same time."},{"start":278.33,"text":"Now, why may that be? P of X and Y at the same time means the probability of your data and of the class. If your class, for example, is relatively simple to describe, like you're classifying two things which kind of couldn't be more different. They're really spread apart. You don't need to spend all your time learning the nooks and crannies of class A versus class B. And I'll come to an example of this in a second. You could probably learn how to separate them, right? That's what discriminators do all the time."},{"start":303.72,"text":"That's what a discriminative model would do. It tries to learn a separating boundary. We saw this again and again."},{"start":310.54,"text":"We're going to consider something else. Now, arguably, you should be able to tell the difference between cats and elephants pretty easily. And these are not actual data from cats and elephants. And I don't know why I picked cats and elephants. But I think it was dogs and elephants at one point. And then maybe Claude prefers cats to dogs and switched it before I redrafted these. All right. So here's what we're going to do. We're going to look at our generative model. And this is incredibly fictionalized. These are height and weight."},{"start":335.0,"text":"And we've plotted, apparently, a normalization, some very heavy cats and some very light elephants, I guess here, small elephants. But the idea here is that there's a bunch of cats, which are these circles that are orange. And there's a bunch of elephants, which are those gray squares over there. And this is our data. We want to model and do this."}],"speech_gaps":[],"frame":"../frames/v054/002.webp","frame_time":189.53},{"title":"高斯判别分析的生成方法","segments":[{"id":16,"text":"Now, the point I was just making is that in the discriminative case, so far we've used a lot of lines, linear models, to do this. We could use something else, too. We saw how to make something that was nonlinear look more like a line. But we would basically come up with a decision boundary. And intuitively, this makes sense. If you imagine, there's all kinds of weird subpopulations of elephants up into the right corner and cats to the left corner. And we didn't have to learn any of those. We just learned when a cat and an elephant are close,"},{"id":17,"text":"How do I tell them apart? Now, when I say that out loud, that sounds pretty ridiculous, like a cat and elephant are close, but hopefully you get what I mean. If you have two classes that are difficult to distinguish, you're kind of devoting all your horsepower right to that decision boundary, so both of the classes enter into it. But that's not the only way to do this, right? In the generative approach, what we're going to do, instead of finding that boundary, is we're going to model each class effectively independently. We'll come back to what we actually relax and practice."},{"id":18,"text":"But we're going to ask instead, what do the features look like for every class? So is there something about an elephant that is dramatically different than a cat? Maybe it has a trunk or whatever you think about. And then we'll also try and learn how likely each class is. So the prior distribution. And why do we need both? Well, if you think about this, we're going to probably do classification with Bayes' rule. So let's look at what this looks like in the example."},{"id":19,"text":"All right, here's the generative idea in pictures. So if you look, what we're going to do intuitively in this classification paradigm is we're going to learn one model, which are these gray circles, these ellipses that are over here. We'll come back to those if you don't remember. Those are going to be effectively Gaussians, if you like."},{"id":20,"text":"And this white thing. And then we're going to learn something in the orange. And we're going to kind of learn their center of mass. And in this very simple generative model, we're just going to learn their distribution. So basically what we've learned here is cats are smaller and weigh less, elephants weigh more, and they have some variance. And we're going to make the variance fixed for the point of view of the slides. We'll come back to that later. Or their covariance. And I'm going to talk about what covariance is if you're not familiar with it."},{"id":21,"text":"in just a couple slides, and this kind of visualization will make more precise sense."},{"id":22,"text":"But at this stage, all I want you to think about is really what we're going to do is"},{"id":23,"text":"somehow we're going to create a model, and the intent of the model is"},{"id":24,"text":"look at all the cats, build a model, look at all the elephants, build a model,"},{"id":25,"text":"and then we're going to classify a new data point, say this green point, how?"},{"id":26,"text":"By looking at how likely it is under model A and how likely it is under model B."},{"id":27,"text":"So if that p-value is higher, if you like, that probability value is higher"},{"id":28,"text":"under the elephant model, we're likely to say that with some probability it's an"},{"id":29,"text":"elephant. So far so good? And how we decide that is Bayes' rule, which"},{"id":30,"text":"we've done several times in this course and I just skipped over. At this"},{"id":31,"text":"level of abstraction, everything clear? Alright, awesome. Please go ahead ask me"}],"notes":["本段讲解了生成方法与判别方法的区别。生成方法通过建模每个类别的分布来实现分类，而不是直接寻找决策边界。这种方法需要学习每个类别的特征分布和先验概率，从而利用贝叶斯规则进行分类。","在生成方法中，我们假设每个类别服从某种概率分布（如高斯分布），并学习这些分布的参数。通过比较新数据点在不同类别模型下的概率，可以决定其所属类别。","生成方法的一个关键点是，它不仅考虑了类别的特征差异，还考虑了类别之间的先验概率。这使得模型能够更全面地处理类别之间的不确定性。","在讲解中，教授通过可视化手段（如椭圆和高斯分布）来说明生成方法的直观理解。这些图形帮助学生理解不同类别在特征空间中的分布情况。","教授提到，生成方法中会学习每个类别的分布参数，包括均值和协方差。这些参数决定了类别在特征空间中的位置和形状。","最后，教授强调了贝叶斯规则在生成方法中的核心作用，并指出在课程中已经多次讨论过这一概念，但在此处仅作为基础回顾。"],"formulas":[{"latex":"P(Y = k | X = x) = \\frac{P(X = x | Y = k)P(Y = k)}{P(X = x)}","symbols":"P(Y = k | X = x) 表示给定特征X=x时类别k的后验概率，P(X = x | Y = k) 是类别k的似然，P(Y = k) 是类别k的先验概率，P(X = x) 是边缘概率。","explanation":"公式正确表达了贝叶斯分类规则，符合贝叶斯定理的数学形式，适用于分类任务。","evidence":"But we're going to ask instead, what do the features look like for every class? So is there something about an elephant that is dramatically different than a cat? Maybe it has a trunk or whatever you think about. And then we'll also try and learn how likely each class is. So the prior distribution. And why do we need both? Well, if you think about this, we're going to probably do classification with Bayes' rule. So let's look at what this looks like in the example."}],"uncertainties":["p-value"],"diagram":"none","start":356.32,"end":529.72,"asr_flags":[],"math_clarifications":["公式中的概率分布形式正确，符合贝叶斯定理的数学表达。"],"raw_segments":[{"start":356.32,"text":"Now, the point I was just making is that in the discriminative case, so far we've used a lot of lines, linear models, to do this. We could use something else, too. We saw how to make something that was nonlinear look more like a line. But we would basically come up with a decision boundary. And intuitively, this makes sense. If you imagine, there's all kinds of weird subpopulations of elephants up into the right corner and cats to the left corner. And we didn't have to learn any of those. We just learned when a cat and an elephant are close,"},{"start":382.34,"text":"How do I tell them apart? Now, when I say that out loud, that sounds pretty ridiculous, like a cat and elephant are close, but hopefully you get what I mean. If you have two classes that are difficult to distinguish, you're kind of devoting all your horsepower right to that decision boundary, so both of the classes enter into it. But that's not the only way to do this, right? In the generative approach, what we're going to do, instead of finding that boundary, is we're going to model each class effectively independently. We'll come back to what we actually relax and practice."},{"start":412.63,"text":"But we're going to ask instead, what do the features look like for every class? So is there something about an elephant that is dramatically different than a cat? Maybe it has a trunk or whatever you think about. And then we'll also try and learn how likely each class is. So the prior distribution. And why do we need both? Well, if you think about this, we're going to probably do classification with Bayes' rule. So let's look at what this looks like in the example."},{"start":443.05,"text":"All right, here's the generative idea in pictures. So if you look, what we're going to do intuitively in this classification paradigm is we're going to learn one model, which are these gray circles, these ellipses that are over here. We'll come back to those if you don't remember. Those are going to be effectively Gaussians, if you like."},{"start":461.77,"text":"And this white thing. And then we're going to learn something in the orange. And we're going to kind of learn their center of mass. And then in this very simple generative model, we're just going to learn their distribution. So basically what we've learned here is cats are smaller and weigh less, elephants weigh more, and they have some variance. And we're going to make the variance fixed for the point of view of the slides. We'll come back to that later. Or their covariance. And I'm going to talk about what covariance is if you're not familiar with it."},{"start":484.22,"text":"in just a couple slides, and this kind of visualization will make more precise sense."},{"start":488.28,"text":"But at this stage, all I want you to think about is really what we're going to do is"},{"start":490.92,"text":"somehow we're going to create a model, and the intent of the model is"},{"start":495.02,"text":"look at all the cats, build a model, look at all the elephants, build a model,"},{"start":498.68,"text":"and then we're going to classify a new data point, say this green point, how?"},{"start":502.88,"text":"By looking at how likely it is under model A and how likely it is under model B."},{"start":508.28,"text":"So if that p-value is higher, if you like, that probability value is higher"},{"start":511.42,"text":"under the elephant model, we're likely to say that with some probability it's an"},{"start":516.12,"text":"elephant. So far so good? And how we decide that is Bayes' rule, which"},{"start":520.64,"text":"we've done several times in this course and I just skipped over. At this"},{"start":525.32,"text":"level of abstraction, everything clear? Alright, awesome. Please go ahead ask me"}],"speech_gaps":[],"frame":"../frames/v054/003.webp","frame_time":368.32},{"title":"高斯判别分析的基本概念","segments":[{"id":32,"text":"questions too. Okay, so this is the plan, just recapped. Find a distribution for"},{"id":33,"text":"for cats, find a distribution for the elephants."},{"id":34,"text":"When a new animal comes in, does it"},{"id":35,"text":"look more like a cat or an elephant?"},{"id":36,"text":"High level makes sense what we're doing?"},{"id":37,"text":"And mathematically, what's going on?"},{"id":38,"text":"Now, I will say in the way we apply generative models"},{"id":39,"text":"like in GPT, the difference is we devote a lot of horsepower"},{"id":40,"text":"to trying to learn how to generate text"},{"id":41,"text":"in that generative way."},{"id":42,"text":"We try and learn very complicated representations."},{"id":43,"text":"For the point of view of this lecture, GDA, we're going to take about the simplest version"},{"id":44,"text":"that we can get of a model that's still useful."},{"id":45,"text":"And surprisingly, even though this model is very simple, we'll see that you can build"},{"id":46,"text":"pretty reasonable things out of it."},{"id":47,"text":"And that's our plan for last week."},{"id":48,"text":"All right. So we have to do a little bit of a detour. These are the new Claude Matplotlib generated graphics. Let's see how we did. All right. So recall the one-dimensional Gaussian. Remember that it's written with this notation here. This means z is drawn according to a normal distribution. This mu is the mean. Let's write that on there. It's helpful. We call this character the mean. I'm sure you recall that. We've been using it a lot."},{"id":49,"text":"And this guy, the variance. I'm not going to write that. Get back to here. That has this distribution function here, which we've seen. z minus u squared, mu squared, over 2 sigma squared. All the normalization that we've typically done. This is the normalizing constant. So what I've charted here are a bunch of different values for sigma."},{"id":50,"text":"and how they affect what's going on. When sigma is small, it gets very, very spiky, right? Intuitively, it makes sense. If you have low variance, you're very concentrated across your mean. The heights are different. Why are the heights different? Exactly right. It has to integrate to 1. Exactly perfect. You have 0.5, you have 1, you have 2, and you're spreading that mass. And the integral underneath is normalized to 1. All good. All right."},{"id":51,"text":"All right, so let's imagine our fictitious example with the cats and elephants. Let's imagine we're just looking at their weight. Of course, this is like, who knows what units are in here? That's like me copping out. I mean, I don't know what axis you can put cats and elephants on the same weight. These are very large cats or very small elephants. Who knows?"},{"id":52,"text":"Doesn't really matter. You get the point. The point is in this alternate universe with cats and elephants, cats are lighter and elephants are heavier. And what that corresponds to is, of course, the mean of the cat is lower than the mean of the elephant."}],"notes":["本段介绍了高斯判别分析（GDA）的基本思想，即通过为不同类别（如猫和大象）建立概率分布模型，来判断新样本属于哪个类别。讲者提到，GDA是生成模型的一种简单形式，虽然模型简单，但可以构建出合理的分类器。","讲者通过猫和大象的体重对比，说明了不同类别的均值差异。猫的体重较低，大象的体重较高，这对应于不同类别分布的均值不同。这一例子帮助理解GDA中如何利用均值和方差来区分类别。","讲者还提到，高斯分布的方差会影响分布的形状。当方差较小时，分布会更加尖锐，集中在均值附近；而方差较大时，分布会更宽泛。这一特性在GDA中用于建模不同类别的数据分布。","讲者强调，GDA的目标是找到一个简单的模型，该模型在实际应用中仍然有用。虽然GDA模型简单，但通过合理的设计，可以实现有效的分类。","讲者提到，与生成模型（如GPT）相比，GDA更注重于建模数据的分布，而不是学习复杂的表示。这说明了GDA与生成模型在目标和方法上的不同。","最后，讲者通过图表展示了不同方差下的高斯分布，帮助学生直观理解方差对分布形状的影响。这一部分为后续讨论GDA的数学基础做了铺垫。"],"formulas":[],"uncertainties":["z minus u squared, mu squared, over 2 sigma squared"],"diagram":"none","start":529.72,"end":700.07,"asr_flags":[],"raw_segments":[{"start":529.72,"text":"questions too. Okay, so this is the plan, just recapped. Find a distribution for"},{"start":538.12,"text":"for cats, find a distribution for the elephants."},{"start":541.4,"text":"When a new animal comes in, does it"},{"start":543.36,"text":"look more like a cat or an elephant?"},{"start":546.4,"text":"High level makes sense what we're doing?"},{"start":547.86,"text":"And mathematically, what's going on?"},{"start":549.4,"text":"Now, I will say in the way we apply generative models"},{"start":553.3,"text":"like in GPT, the difference is we devote a lot of horsepower"},{"start":559.0,"text":"to trying to learn how to generate text"},{"start":560.82,"text":"in that generative way."},{"start":562.12,"text":"We try and learn very complicated representations."},{"start":565.38,"text":"For the point of view of this lecture, GDA, we're going to take about the simplest version"},{"start":571.06,"text":"that we can get of a model that's still useful."},{"start":573.6,"text":"And surprisingly, even though this model is very simple, we'll see that you can build"},{"start":577.46,"text":"pretty reasonable things out of it."},{"start":579.3,"text":"And that's our plan for last week."},{"start":585.87,"text":"All right. So we have to do a little bit of a detour. These are the new Claude Matplotlib generated graphics. Let's see how we did. All right. So recall the one-dimensional Gaussian. Remember that it's written with this notation here. This means z is drawn according to a normal distribution. This mu is the mean. Let's write that on there. It's helpful. We call this character the mean. I'm sure you recall that. We've been using it a lot."},{"start":614.44,"text":"And this guy, the variance. I'm not going to write that. Get back to here. That has this distribution function here, which we've seen. z minus u squared, mu squared, over 2 sigma squared. All the normalization that we've typically done. This is the normalizing constant. So what I've charted here are a bunch of different values for sigma."},{"start":637.98,"text":"and how they affect what's going on. When sigma is small, it gets very, very spiky, right? Intuitively, it makes sense. If you have low variance, you're very concentrated across your mean. The heights are different. Why are the heights different? Exactly right. It has to integrate to 1. Exactly perfect. You have 0.5, you have 1, you have 2, and you're spreading that mass. And the integral underneath is normalized to 1. All good. All right."},{"start":667.82,"text":"All right, so let's imagine our fictitious example with the cats and elephants. Let's imagine we're just looking at their weight. Of course, this is like, who knows what units are in here? That's like me copping out. I mean, I don't know what axis you can put cats and elephants on the same weight. These are very large cats or very small elephants. Who knows?"},{"start":687.09,"text":"Doesn't really matter. You get the point. The point is in this alternate universe with cats and elephants, cats are lighter and elephants are heavier. And what that corresponds to is, of course, the mean of the cat is lower than the mean of the elephant."}],"speech_gaps":[],"frame":"../frames/v054/004.webp","frame_time":541.72},{"title":"高斯判别分析中的多维高斯分布","segments":[{"id":53,"text":"All right. So now how do we do this? Well, we have this probability distribution function, this kind of likelihood function, and we can compare these two values when we get our new point here. So we have our new point, which is our new animal. We're unsure if it's an elephant or a cat. I guess it's possible that a cat is that big, but it's very unlikely. But this is like a pretty reasonable size for a small elephant. So far, so good? All right. All right. All right. We'll go into this in a second. All right."},{"id":54,"text":"Okay, but what happens when we generalize that simple example to two dimensions? There we need a little bit more notation. We haven't really had multidimensional Gaussians in the class, but they work hopefully like you would expect them to work. So we have an x, which is going to be an Rn. This n is going to be 2 in our example. That's the dimensions, but it could be higher."},{"id":55,"text":"We write x is distributed according to mu and sigma to mean the following. Mu is the mean vector. That's going to be the center. If you think back to the elephant diagram, these were the stars that I was drawing. These were the middles, the means, the average mass of what was going on. And then sigma is going to be this covariance matrix. And if you remember, that means that it's going to be symmetric. So the entries across each from each other are the same in the obvious way. It's positive definite."},{"id":56,"text":"OK? It means it has, what does a positive definite mean? You can't . Yeah, that's a great definition. So you gave me, wonderful. So the definition here has to do with if you take a vector and you dot it through sigma, you say sigma transpose sigma z, that's always going to be greater than or equal to 0 if it's positive semi-definite. And that's a function of the fact that its eigenvalues have a particular structure."},{"id":57,"text":"In this case, it's positive definite, so the ellipse is not flat. That's right. That's a great consequence. The statement was, because it's positive definite, the ellipse is not flat. That means that they actually have round values. There's no zero variance in any dimension. Please."},{"id":58,"text":"Fantastic. That was what I was looking for. The eigenvalues are all positive. It has eigenvalues because the matrix is symmetric. Not all matrices have these in a way that makes sense. But that's because these two things basically tell us that we can do all kinds of nice eigenvalue things. That will be the consequence. That fact will be used, actually not so much today, but in general about these matrices again and again. And this is the analog, by the way, of the variance being positive or non-negative."}],"notes":["本段讲解了正定矩阵的定义及其在高斯分布中的意义。正定矩阵意味着对于任意非零向量z，其与矩阵σ的乘积的二次型结果总是大于等于零。这是通过矩阵的特征值结构来定义的，正定矩阵的所有特征值都是正的。","正定矩阵的一个重要性质是它对应的椭圆（在二维情况下）不会是扁平的，这说明在各个维度上都没有零方差。这意味着数据在各个方向上都有一定的变化，而不是集中在某一点上。"],"formulas":[],"uncertainties":["You can't ."],"diagram":"none","start":701.87,"end":863.65,"asr_flags":[56],"raw_segments":[{"start":701.87,"text":"All right. So now how do we do this? Well, we have this probability distribution function, this kind of likelihood function, and we can compare these two values when we get our new point here. So we have our new point, which is our new animal. We're unsure if it's an elephant or a cat. I guess it's possible that a cat is that big, but it's very unlikely. But this is like a pretty reasonable size for a small elephant. So far, so good? All right. All right. All right. We'll go into this in a second. All right."},{"start":734.37,"text":"Okay, but what happens when we generalize that simple example to two dimensions? There we need a little bit more notation. We haven't really had multidimensional Gaussians in the class, but they work hopefully like you would expect them to work. So we have an x, which is going to be an Rn. This n is going to be 2 in our example. That's the dimensions, but it could be higher."},{"start":756.64,"text":"We write x is distributed according to mu and sigma to mean the following. Mu is the mean vector. That's going to be the center. If you think back to the elephant diagram, these were the stars that I was drawing. These were the middles, the means, the average mass of what was going on. And then sigma is going to be this covariance matrix. And if you remember, that means that it's going to be symmetric. So the entries across each from each other are the same in the obvious way. It's positive definite."},{"start":786.56,"text":"OK? It means it has, what does a positive definite mean? You can't . Yeah, that's a great definition. So you gave me, wonderful. So the definition here has to do with if you take a vector and you dot it through sigma, you say sigma transpose sigma z, that's always going to be greater than or equal to 0 if it's positive semi-definite. And that's a function of the fact that its eigenvalues have a particular structure."},{"start":821.58,"text":"In this case, it's positive definite, so the ellipse is not flat. That's right. That's a great consequence. The statement was, because it's positive definite, the ellipse is not flat. That means that they actually have round values. There's no zero variance in any dimension. Please."},{"start":837.93,"text":"Fantastic. That was what I was looking for. The eigenvalues are all positive. It has eigenvalues because the matrix is symmetric. Not all matrices have these in a way that makes sense. But that's because these two things basically tell us that we can do all kinds of nice eigenvalue things. That will be the consequence. That fact will be used, actually not so much today, but in general about these matrices again and again. And this is the analog, by the way, of the variance being positive or non-negative."}],"speech_gaps":[],"frame":"../frames/v054/005.webp","frame_time":713.87},{"title":"高斯判别分析中的协方差矩阵与距离函数","segments":[{"id":59,"text":"Zero variance means you're certain in that attribute. Okay, cool. All right. That also means I can write this. I can take the inverse. Because it has all positive eigenvalues, I can factor it however you like. Eigenvalue to composition, invert the eigenvalues, take transposes. It has that property. So in particular, that allows me to write this and this, and life is good. If it did not have that property, if it had zeros, I'd be in trouble, right?"},{"id":60,"text":"The zeros would kill me in both places. This wouldn't be defined. This is the determinant. So remember this expression here. This is the determinant, square root of the determinant. If that were a negative number, I would be in trouble. Determinant is the product of all the eigenvalues. The product of a bunch of positive numbers is positive. So I'm taking a square root. So that's important there. And then here, if there were a zero, well, this would no longer be well-defined. And I'll think about that like a distance. Now, you can get around that if you really care about the zero. But the negative stuff would cause you problems."},{"id":61,"text":"Sound good? All right. Okay, you don't have to know this name, but this basically you can regard as a distance function that is weighted by those eigenvalues. If this is unfamiliar to you, these use of eigenvalues, it won't be so bad today, but I'm warning you in the future that I'm going to use these quite aggressively. I think next week you get 10U. Isn't that a treat for all of you? And then the week after that, you get me back for a week, and then that week there will be a lot of eigenvalues. It's like eigenvalue week, okay? That's going to be everywhere. So I just want to highlight that if it's unfamiliar."},{"id":62,"text":"And this is a distance in the sense that it satisfies the properties of a distance, so that it's just scaled in a way. All right. So far, so good? Everyone understand all the definitions?"},{"id":63,"text":"Let's look at some pictures, make sure they sink in. All right, this is where a cloud really outdid itself. I used to draw these, and there was a lot of gesturing, so we're cutting all that down. Now we have matplotlib, like 1980s technology, to draw for you. Maybe 1990s technology. Anyway, this is what a 2D curve looks like. Instead of the bell curve, it looks like this and symmetric in all directions. It has this nice little cone, little circle in the middle. It's a surface and a contour. I prefer not to do this. I'm going to show you the contour version. This is one."},{"id":64,"text":"where the height in 3D tells you the value of p. And this is now in two dimensions, x1 and x2. This is the standard Gaussian. That means it's going to have a covariance function, which is the identity. All right, cool. Effectively, it means every dimension is independent."},{"id":65,"text":"Here's some more Gaussians. They have weirder shapes. So remember, in 1D, they can only be flat. They could be pointy. But now, when you have higher dimensions, you have more degrees of freedom. So these models get correspondingly richer. Here's one where you have sigma i. It's there. It's nice and round. If you make sigma diagonal,"}],"notes":["本段主要讲解了协方差矩阵的性质，特别是其逆矩阵和特征值的使用。当协方差矩阵的特征值全为正数时，可以对其进行逆运算，并且其行列式为正数，因此可以取平方根。如果协方差矩阵中存在零特征值，会导致行列式为零，从而无法进行某些计算，如距离函数的定义。","讲者提到，协方差矩阵的逆矩阵可以用于构建距离函数，该距离函数通过特征值加权。虽然当前课程中可能不会深入讨论，但未来课程中会频繁使用这一概念，因此需要提前了解。","讲者强调了协方差矩阵的逆矩阵在构建距离函数中的作用，并指出如果协方差矩阵的行列式为负数或零，会导致计算问题。因此，协方差矩阵的正定性非常重要。","讲者通过图像展示了二维高斯分布的形状，指出其与一维高斯分布的不同之处。二维高斯分布具有对称性，并且可以通过特征值和协方差矩阵来描述其形状。","讲者提到，高斯分布的协方差矩阵可以是单位矩阵，这意味着各个维度之间是独立的。如果协方差矩阵是单位矩阵，那么高斯分布的形状是圆形或球形。","讲者指出，随着维度的增加，高斯分布的形状会变得更加复杂，因为有更多的自由度。因此，高斯分布模型在高维空间中可以表示更丰富的形状。"],"formulas":[{"latex":"det(\\boldsymbol{\\Sigma}) = \\prod_{i} \\lambda_i","symbols":"行列式等于特征值的乘积","explanation":"原始公式正确表达了行列式等于特征值的乘积，但使用了更标准的数学符号\\prod_{i} \\lambda_i来表示乘积。","evidence":"The zeros would kill me in both places. This wouldn't be defined. This is the determinant. So remember this expression here. This is the determinant, square root of the determinant. If that were a negative number, I would be in trouble. Determinant is the product of all the eigenvalues. The product of a bunch of positive numbers is positive. So I'm taking a square root. So that's important there. And then here, if there were a zero, well, this would no longer be well-defined. And I'll think about that like a distance. Now, you can get around that if you really care about the zero. But the negative stuff would cause you problems."}],"uncertainties":["sigma i"],"diagram":"none","start":864.12,"end":1041.29,"asr_flags":[],"math_clarifications":["原始公式中的'product of eigenvalues'被正确转换为数学符号\\prod_{i} \\lambda_i，以符合数学表达规范。"],"raw_segments":[{"start":864.12,"text":"Zero variance means you're certain in that attribute. Okay, cool. All right. That also means I can write this. I can take the inverse. Because it has all positive eigenvalues, I can factor it however you like. Eigenvalue to composition, invert the eigenvalues, take transposes. It has that property. So in particular, that allows me to write this and this, and life is good. If it did not have that property, if it had zeros, I'd be in trouble, right?"},{"start":896.49,"text":"The zeros would kill me in both places. This wouldn't be defined. This is the determinant. So remember this expression here. This is the determinant, square root of the determinant. If that were a negative number, I would be in trouble. Determinant is the product of all the eigenvalues. The product of a bunch of positive numbers is positive. So I'm taking a square root. So that's important there. And then here, if there were a zero, well, this would no longer be well-defined. And I'll think about that like a distance. Now, you can get around that if you really care about the zero. But the negative stuff would cause you problems."},{"start":926.45,"text":"Sound good? All right. Okay, you don't have to know this name, but this basically you can regard as a distance function that is weighted by those eigenvalues. If this is unfamiliar to you, these use of eigenvalues, it won't be so bad today, but I'm warning you in the future that I'm going to use these quite aggressively. I think next week you get 10U. Isn't that a treat for all of you? And then the week after that, you get me back for a week, and then that week there will be a lot of eigenvalues. It's like eigenvalue week, okay? That's going to be everywhere. So I just want to highlight that if it's unfamiliar."},{"start":957.57,"text":"And this is a distance in the sense that it satisfies the properties of a distance, so that it's just scaled in a way. All right. So far, so good? Everyone understand all the definitions?"},{"start":970.76,"text":"Let's look at some pictures, make sure they sink in. All right, this is where a cloud really outdid itself. I used to draw these, and there was a lot of gesturing, so we're cutting all that down. Now we have matplotlib, like 1980s technology, to draw for you. Maybe 1990s technology. Anyway, this is what a 2D curve looks like. Instead of the bell curve, it looks like this and symmetric in all directions. It has this nice little cone, little circle in the middle. It's a surface and a contour. I prefer not to do this. I'm going to show you the contour version. This is one."},{"start":998.74,"text":"where the height in 3D tells you the value of p. And this is now in two dimensions, x1 and x2. This is the standard Gaussian. That means it's going to have a covariance function, which is the identity. All right, cool. Effectively, it means every dimension is independent."},{"start":1018.43,"text":"Here's some more Gaussians. They have weirder shapes. So remember, in 1D, they can only be flat. They could be pointy. But now, when you have higher dimensions, you have more degrees of freedom. So these models get correspondingly richer. Here's one where you have sigma i. It's there. It's nice and round. If you make sigma diagonal,"}],"speech_gaps":[],"frame":"../frames/v054/006.webp","frame_time":876.12},{"title":"高斯判别分析中的协方差矩阵与椭圆","segments":[{"id":66,"text":"And those diagonal elements better be positive, right? Because of the properties we just outlined. Then you're going to stretch each component in different directions. And I have to say, I'm not super impressed with what Claude did here because it looks kind of weird. But maybe I'll go back to my old ways of gesturing with my hands. That seems to be better. So imagine you have it axis-aligned. So you have it diagonal. So you have the diagonal is one and five. What's that going to look like? Well, I'm going to have one unit in this direction and five units in that way. And then I have the ellipse."},{"id":67,"text":"Oh, look at that. Look at that drawing technology. Amazing. I don't need Claude. Anyway, I love Claude. No, I'm just kidding. That's all going to be recorded in transcripts, and they're going to download all of it, and they're going to know exactly how good or bad we were to the AI. So don't curse at it if you saw. Don't curse at it. Anyway, so back to this. All right. Every lecture should include one unhinged conspiracy theory. I think that's a requirement going forward. Anyway, it does actually monitor. Claude Code does monitor, right, if you curse at it. So you shouldn't do it. It's just like you should say,"},{"id":68,"text":"Please and thank you. In any case, just be a good person. I don't know what's wrong with me. Anyway, all right. So this is full sigma. So what happens if it's not diagonal, okay? But it's actually a full positive definite matrix. Remember your linear algebra. What does that mean? It means its eigenvalues, again, have this stretch, but it's rotated the basis in some way. May have also flipped it, but that's a separate issue, okay?"},{"id":69,"text":"Does that make sense? Remember what orthogonal orthonormal transformations do? That's all it can do. So it will do it and all the rest. The center is given by the mean. There's this rotating behavior and this scaling behavior. And that's what Gaussians do. Pretty rich structures, especially in really, really high dimensions."},{"id":70,"text":"This is animation to say what I just said. Tilted, diagonal, so on. I actually prefer, rather than that fancy 3D version as I drew to you, when I have to fall back on explaining things, I prefer this contour version. And this is kind of like the version if you were to go left to right in 1D, where you would start to say how many sigma out are you. These lines here, these contours, these are level sets."},{"id":71,"text":"So all of them have the same value for p, the probability. That's what it means. That's what I mean by level set. If it's identity, then the level sets move at exactly the same rate. And I'm sampling them at some rate here. Maybe it's 1. In this case, when I have the diagonal 3 and 0.5, getting back to the earlier piece, it's axis aligned. That means that the axis that it's getting stretched are along those axes. It's getting stretched 0.5 and 3 in this direction."},{"id":72,"text":"So far, so good?"},{"id":73,"text":"All right."},{"id":74,"text":"Here's positive correlation, and here's the whole thing."},{"id":75,"text":"Shifted together in negative correlation."},{"id":76,"text":"Okay?"},{"id":77,"text":"Just does a shift and puts it in there."},{"id":78,"text":"All right."},{"id":79,"text":"We're in good shape."},{"id":80,"text":"Okay."},{"id":81,"text":"All right."},{"id":82,"text":"So we talked about the axis-aligned ellipses."},{"id":83,"text":"We talked about the rotated ellipses."}],"notes":["本段主要讲解了高斯判别分析中协方差矩阵的性质，特别是对角线元素必须为正，以及非对角线情况下的正定矩阵。讲者提到，正定矩阵的特征值决定了椭圆的拉伸程度，同时矩阵的旋转方向也会影响椭圆的形状。讲者还提到，正定矩阵的特征向量决定了椭圆的主轴方向，而特征值决定了椭圆的拉伸比例。","讲者通过举例说明了轴对齐的椭圆和旋转后的椭圆之间的区别。轴对齐的椭圆意味着拉伸方向与坐标轴一致，而非对角线的协方差矩阵会导致椭圆旋转。讲者还提到，正定矩阵的特征值和特征向量决定了椭圆的形状和方向。","讲者进一步解释了高斯分布的等高线（level sets）的概念，即在二维空间中，等高线表示的是概率密度函数的等值线。这些等高线在正定矩阵的情况下会形成椭圆，而在单位矩阵的情况下则形成圆形。","讲者提到，当协方差矩阵是对角矩阵时，椭圆的主轴方向与坐标轴一致，而当协方差矩阵是满矩阵时，椭圆会旋转。讲者还提到，正定矩阵的特征值决定了椭圆的拉伸比例，而特征向量决定了椭圆的主轴方向。","讲者通过动画和图示的方式，进一步说明了高斯分布的等高线形状。讲者指出，等高线的间距反映了概率密度的变化，而椭圆的形状和方向则由协方差矩阵决定。","讲者还提到，当协方差矩阵是对角矩阵时，椭圆的主轴方向与坐 ],"frame":"../frames/v054/007.webp","frame_time":1054.34},{"title":"高斯判别分析中的协方差矩阵与逆矩阵","segments":[{"id":84,"text":"And, yeah, we're in good shape."},{"id":85,"text":"Okay?"},{"id":86,"text":"Entries can be, oh that's one thing I want to say, sorry. Entries can be"},{"id":87,"text":"negative, but the eigenvalues are positive. Positive eigenvalues do not"},{"id":88,"text":"mean that all the entries are positive. People get confused. All right, controls"},{"id":89,"text":"the shape, size, and orientation of the Gaussian contours. Please."},{"id":90,"text":"Right, so in particular when you have a diagonal matrix because those"},{"id":91,"text":"are the products of the eigenvalues, you do have to do it. And even individually"},{"id":92,"text":"individually, they are the variance of that individual element, which will also be non-negative."},{"id":93,"text":"So they will be positive in these kind of matrices."},{"id":94,"text":"One test that you can kind of think about is diagonal dominance."},{"id":95,"text":"So this is a quick way if you were looking at a matrix to tell, which is if you look"},{"id":96,"text":"at the entries and all the other entries are smaller than the square of that entry, then"},{"id":97,"text":"you're looking at a positive definite matrix."},{"id":98,"text":"Yeah."},{"id":99,"text":"Wonderful question."},{"id":100,"text":"You guys got this perfectly."},{"id":101,"text":"Awesome."},{"id":102,"text":"But already in two, we're starting to see positive versus negative correlation, which"},{"id":103,"text":"which refers to the off-diagonal entries."},{"id":104,"text":"Can't really define that when you get above 2"},{"id":105,"text":"because you get these kind of"},{"id":106,"text":"Okay, actually, you know, there's one lecture which I did, which I'm not going to give,"},{"id":107,"text":"but I will just tell you one piece about it. The inverse of these matrices, especially the"},{"id":108,"text":"inverse of Gaussian matrices, have all kinds of interesting structure. In particular, if you"},{"id":109,"text":"invert a matrix, I'll just leave this as a challenge problem. Maybe I can write up how you"},{"id":110,"text":"prove it. It turns out if there are zeros in the inverse, that actually means the two variables"},{"id":111,"text":"are independent. Okay, it's interesting. The actual covariance matrix doesn't have that"},{"id":112,"text":"that information. The inverse does. That's why the inverse is in the formula. You can just write out"},{"id":113,"text":"what I'm saying from that. Anyway, this is like what if you take graphical models, this is basically"},{"id":114,"text":"what it's using. It's called Clifford-Hammerley theory. Doesn't matter for now. Anyway, but it's"},{"id":115,"text":"useful. Useful to know. Okay, so changing mu shifts the center, and the shape stays the same. Okay."},{"id":116,"text":"All right, so what we're going to do right now, please."},{"id":117,"text":"Please."},{"id":118,"text":"the inverse covariance matrix"},{"id":119,"text":"has information about whether or not"},{"id":120,"text":"two variables are independent?"},{"id":121,"text":"Oh, it's easiest to read in that matrix."},{"id":122,"text":"Yeah, great question."},{"id":123,"text":"So it's not that it's only there."},{"id":124,"text":"Clearly, information is summarized"},{"id":125,"text":"both in the mean and the covariance,"},{"id":126,"text":"but it's actually transparent."},{"id":127,"text":"And this is maybe a throwaway comment"},{"id":128,"text":"that I shouldn't have made and just kept to myself."},{"id":129,"text":"So apologies, but I'll explain it."},{"id":130,"text":"If you take the inverse and you look where xi and xj are"},{"id":131,"text":"independent, the inverse entry will be 0."},{"id":132,"text":"And this is a very famous theorem from stats from the late 70s, which gave rise to things"},{"id":133,"text":"called graphical models, where you write down which things are independent and which are"},{"id":134,"text":"conditionally independent."},{"id":135,"text":"And this is just a beautiful bit of structure that happens to be lurking in Gaussian random"},{"id":136,"text":"models, which in a past life I studied."},{"id":137,"text":"So I felt I had to vomit that out for you."},{"id":138,"text":"The covariance itself does not give you that information nearly as readily. So if you look at that information, it's very difficult to say because independence requires a factorization, but the values can be non-zero."}],"notes":["本段主要讲解了协方差矩阵的性质，特别是正定矩阵的判断方法。讲者指出，即使矩阵的元素为负数，其特征值仍可能为正，这说明正定性并不等同于所有元素为正。同时，讲者提到，协方差矩阵的逆矩阵包含了变量之间独立性的信息，这是通过逆矩阵中对应元素为零来体现的。","讲者进一步解释了协方差矩阵的逆矩阵在图形模型中的应用，指出逆矩阵中的零元素意味着变量之间独立。这一结论来源于统计学中的一个著名定理，该定理在20世纪70年代末被提出，并推动了图形模型的发展。","讲者还提到，协方差矩阵本身并不直接提供变量独立性的信息，因为独立性需要满足特定的因子化条件，而协方差矩阵中的元素可能非零，因此难以直接判断独立性。","讲者强调，协方差矩阵的逆矩阵在分析变量间关系时具有重要价值，特别是在图形模型中，它能够清晰地反映变量之间的独立性或条件独立性。","讲者还提到，协方差矩阵的逆矩阵的结构在高斯随机模型中具有特殊意义，这在讲者过去的研究中有所涉及，因此他选择分享这一内容。","讲者最后指出，协方差矩阵的逆矩阵在分析变量独立性时比协方差矩阵本身更为直接，因为独立性需要满足特定的数学条件，而逆矩阵能够更清晰地反映这些条件。"],"formulas":[],"uncertainties":["Can't really define that when you get above 2","because you get these kind of"],"diagram":"none","start":1224.18,"end":1402.87,"asr_flags":[117],"math_clarifications":["协方差为零仅表示两个随机变量不相关，但不意味着它们独立。独立性需要更严格的条件，如联合分布等于边缘分布的乘积。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1224.18,"text":"And, yeah, we're in good shape."},{"start":1226.18,"text":"Okay?"},{"start":1226.58,"text":"Entries can be, oh that's one thing I want to say, sorry. Entries can be"},{"start":1229.92,"text":"negative, but the eigenvalues are positive. Positive eigenvalues do not"},{"start":1233.94,"text":"mean that all the entries are positive. People get confused. All right, controls"},{"start":1241.78,"text":"the shape, size, and orientation of the Gaussian contours. Please."},{"start":1247.54,"text":"Right, so in particular when you have a diagonal matrix because those"},{"start":1252.92,"text":"are the products of the eigenvalues, you do have to do  this is like what if you take graphical models, this is basically"},{"start":1326.44,"text":"what it's using. It's called Clifford-Hammerley theory. Doesn't matter for now. Anyway, but it's"},{"start":1330.86,"text":"useful. Useful to know. Okay, so changing mu shifts the center, and the shape stays the same. Okay."},{"start":1338.34,"text":"All right, so what we're going to do right now, please."},{"start":1340.38,"text":"Please."},{"start":1342.62,"text":"the inverse covariance matrix"},{"start":1344.9,"text":"has information about whether or not"},{"start":1346.78,"text":"two variables are independent?"},{"start":1348.66,"text":"Oh, it's easiest to read in that matrix."},{"start":1350.62,"text":"Yeah, great question."},{"start":1351.4,"text":"So it's not that it's only there."},{"start":1352.6,"text":"Clearly, information is summarized"},{"start":1354.02,"text":"both in the mean and the covariance,"},{"start":1355.5,"text":"but it's actually transparent."},{"start":1357.26,"text":"And this is maybe a throwaway comment"},{"start":1358.6,"text":"that I shouldn't have made and just kept to myself."},{"start":1360.34,"text":"So apologies, but I'll explain it."},{"start":1362.12,"text":"If you take the inverse and you look where xi and xj are"},{"start":1366.76,"text":"independent, the inverse entry will be 0."},{"start":1368.94,"text":"And this is a very famous theorem from stats from the late 70s, which gave rise to things"},{"start":1374.02,"text":"called graphical models, where you write down which things are independent and which are"},{"start":1377.5,"text":"conditionally independent."},{"start":1378.52,"text":"And this is just a beautiful bit of structure that happens to be lurking in Gaussian random"},{"start":1383.04,"text":"models, which in a past life I studied."},{"start":1385.42,"text":"So I felt I had to vomit that out for you."},{"start":1390.93,"text":"The covariance itself does not give you that information nearly as readily. So if you look at that information, it's very difficult to say because independence requires a factorization, but the values can be non-zero."}],"speech_gaps":[],"frame":"../frames/v054/008.webp","frame_time":1236.18},{"title":"高斯判别分析的假设与模型","segments":[{"id":139,"text":"But here, once you normalize appropriately, you get zero entries in there. And this is actually very useful when you're looking at data sources to decide, are they approximately independent? If you look at their inverse covariance matrix, this is actually a pretty reasonable test, which is a lecture that I gave last year or two years ago but shelved this year so we could make more deep learning, which is more important. Cool. Awesome. That is just for your interest. This is not stuff you need to know. OK. All right. Back to GDA."},{"id":140,"text":"There's a different mean with the same covariance. Now, you could say, what if we have different covariances? We'll come back to that later. You don't need to know that. But right now, we're thinking we just have different means, and we want to do this. So we want to find mu of elephant and mu of cat. But we're going to keep the spread and shape the same. All right, let's do it. The GDA model. OK, so given training data,"},{"id":141,"text":"xi and yi, like before, i lives in rd, yi lives in 01. We're going to assume as follows. We have y is going to be a class prior. This is our model of how we think about generating the data. How likely are cats versus elephants? If we have many, many elephants and a tiny number of cats or the other way around, we would encode that in this Bernoulli right here. That would be the weight that would come out. Then the idea is, intuitively, for the cats, which I'm making 0,"},{"id":142,"text":"We then draw according to the mu zero for the cats. So the cats are mu zero in this example, and they both have this fixed covariance. So they're drawing against that random model. This is how the data, as we talked about, we hypothesize a forward model, then we invert it. Perhaps not surprisingly, this is the distribution for the elephant features. The big difference is right here. They have different means. We wanted to wiggle the smallest amount possible."},{"id":143,"text":"That's pedagogical, not necessary."},{"id":144,"text":"That's what GDA does."},{"id":145,"text":"Okay."},{"id":146,"text":"So the takeaway assumption is the two classes share the same covariance,"},{"id":147,"text":"but they have different means, and now we want to find those means from data."},{"id":148,"text":"Okay, so let's write out the distributions."},{"id":149,"text":"So here's the class prior."},{"id":150,"text":"It says we're in the class with probability phi,"},{"id":151,"text":"and we're in the other class with 1 minus phi,"},{"id":152,"text":"because it's Bernoulli."},{"id":153,"text":"Here are the class conditional densities."},{"id":154,"text":"This is the next phase."},{"id":155,"text":"This is, say, for example, the cat."},{"id":156,"text":"Why do I know it's the cat?"},{"id":157,"text":"Well, it's y given 0."},{"id":158,"text":"And then I have mu 0, mu 0."},{"id":159,"text":"Everything else is going to be the same when"},{"id":160,"text":"I look at the elephant in a second."},{"id":161,"text":"So far, so good?"},{"id":162,"text":"Please."},{"id":163,"text":"If I remember, if you have, like, the double circles"},{"id":164,"text":"and like the .."},{"id":165,"text":"So if you have the same covariates,"},{"id":166,"text":"maybe if you send those over, they have to be the same shape."},{"id":167,"text":"Yeah, exactly right."}],"notes":["本段主要介绍了高斯判别分析（GDA）的基本假设，即两个类别共享相同的协方差矩阵，但具有不同的均值。这是GDA模型的核心假设，用于区分不同类别的数据分布。","讲者提到，如果两个类别具有相同的协方差矩阵，那么它们的分布形状是相同的，只是均值不同。这种假设使得GDA模型在参数估计时更加简单，因为只需要估计均值和协方差矩阵。","讲者还提到，GDA模型的构建基于先验概率和条件概率的假设。先验概率表示数据属于某一类别的概率，而条件概率则描述了在给定类别标签的情况下，数据的分布。","在讲者举例中，他使用了猫和大象作为例子，说明如何通过均值和协方差矩阵来区分不同类别的数据。猫的均值为mu0，而大象的均值则不同。","讲者还提到，如果两个类别的协方差矩阵相同，那么它们的分布形状是相同的，只是位置不同。这种情况下，可以通过调整均值来区分不同类别。","最后，讲者提到，GDA模型的构建过程包括假设数据服从高斯分布
