 So what it's going to say is the probability that"},{"id":570,"text":"xi, x1, xd are actually emitted are going to be independent conditional on y. So given the class,"},{"id":571,"text":"given the center"},{"id":572,"text":"The words you use, you may pick which words to use independently. We're not going to make any assumption on that. And clearly, they're not independent. But we're going to assume that. And we're going to be able to factor the probability distribution in this really nice way. And that's going to let us go from having 2 to the d examples to having something much smaller, d. OK. So the chain rule says you can factor in this way, where you're continually adding context."},{"id":573,"text":"But this drops all conditioning on other features. What it basically means is another way of saying you don't care about the probability that you use one word in another. So in particular, if you said, you know, you had some negation and they're not something, right? It's not the worst, right? It's not super positive, but it's the worst would get highlighted and the not would get highlighted and they would get multiplied together, right? And not you would probably drive because not has a valence to it. So it wouldn't fit into this. So you don't condition on those two features. Everything is treated."},{"id":574,"text":"effectively conditionally independent. Now, how does this work? So you have some prior probability, the probability of spam in this case, right? That your likelihood is going to be there."},{"id":575,"text":"You have exactly the same kinds of conditional distributions that we saw previously. Given that it's spam, what's the likelihood that it has a word? Spam has gotten much better, but whatever spam you've seen recently, I don't look that much in my spam folder. But if you look in there, you'll see what they're trying to sell you or whatever introduce you to or whoever, you'll be there. So you have those words."}],"notes":["本段讨论了文本特征化的问题，指出当特征数量很大时，如10,000或50,000个单词，使用全多项式模型是不可行的，因为可能的组合数量极大，无法处理。因此，需要引入简化假设，如条件独立性假设。","讲者提到，虽然单词之间在现实中不是完全独立的，但可以假设它们在给定类别（如垃圾邮件）的条件下是独立的。这种假设使得概率分布可以被分解，从而大大减少模型的复杂度。","讲者通过举例说明，即使某些单词之间存在语义上的关联（如否定词和其修饰对象），在条件独立性假设下，这些关联不会被考虑，从而简化了模型。","讲者进一步指出，这种条件独立性假设允许使用链式法则来分解概率分布，从而将模型的复杂度从指数级降低到线性级。","讲者提到，这种模型在实际应用中表现良好，尽管有时会犯错误，但其简单性和有效性使其成为一种实用的方法。","最后，讲者以垃圾邮件分类为例，说明如何利用条件独立性假设来构建模型，包括先验概率和条件分布的使用。"],"formulas":[],"uncertainties":["2 to the 10 to the 300","2 to the 600"],"diagram":"none","start":4532.96,"end":4711.32,"asr_flags":[],"raw_segments":[{"start":4532.96,"text":"featurize this last part is how you would featurize your text okay now as pointed out earlier the new"},{"start":4539.88,"text":"way of doing this is that instead of having these zero one features you would potentially have"},{"start":4543.74,"text":"features that were learned or whatever, but this is the simple standard model. And by the way,"},{"start":4547.78,"text":"it's not that bad of a model. One of the things that's amazing about the models of the ancients"},{"start":4552.16,"text":"is that they work pretty well. Our new models sometimes work occasionally quite amazingly,"},{"start":4557.16,"text":"sometimes make really dumb mistakes. So with d binary features, x could take 2 to the d possible"},{"start":4567.24,"text":"values. So now you have a problem because if D has like 10,000 or 50,000 words"},{"start":4573.74,"text":"well like what is it 2 to the 10 to the 300 so like 2 to the 600 like the number"},{"start":4578.58,"text":"of atoms in the observable universe like we're toast we cannot represent this"},{"start":4581.56,"text":"okay we can't write it down. So we can't possibly model this as a full"},{"start":4588.52,"text":"multinomial. So what are we going to do? Well we're going to make a"},{"start":4594.92,"text":"simplifying assumption about our data. We're going to assume that these words are emitted"},{"start":4598.4,"text":"effectively independently. We make a different kind of independence assumption. And we're going"},{"start":4602.96,"text":"to assume that they're developed conditionally. So what it's going to say is the probability that"},{"start":4606.6,"text":"xi, x1, xd are actually emitted are going to be independent conditional on y. So given the class,"},{"start":4615.66,"text":"given the center"},{"start":4617.49,"text":"The words you use, you may pick which words to use independently. We're not going to make any assumption on that. And clearly, they're not independent. But we're going to assume that. And we're going to be able to factor the probability distribution in this really nice way. And that's going to let us go from having 2 to the d examples to having something much smaller, d. OK. So the chain rule says you can factor in this way, where you're continually adding context."},{"start":4647.65,"text":"But this drops all conditioning on other features. What it basically means is another way of saying you don't care about the probability that you use one word in another. So in particular, if you said, you know, you had some negation and they're not something, right? It's not the worst, right? It's not super positive, but it's the worst would get highlighted and the not would get highlighted and they would get multiplied together, right? And not you would probably drive because not has a valence to it. So it wouldn't fit into this. So you don't condition on those two features. Everything is treated."},{"start":4677.1,"text":"effectively conditionally independent. Now, how does this work? So you have some prior probability, the probability of spam in this case, right? That your likelihood is going to be there."},{"start":4689.42,"text":"You have exactly the same kinds of conditional distributions that we saw previously. Given that it's spam, what's the likelihood that it has a word? Spam has gotten much better, but whatever spam you've seen recently, I don't look that much in my spam folder. But if you look in there, you'll see what they're trying to sell you or whatever introduce you to or whoever, you'll be there. So you have those words."}],"speech_gaps":[],"frame":"../frames/v054/027.webp","frame_time":4544.96},{"title":"高斯判别分析与生成模型","segments":[{"id":576,"text":"And then you'll have a bunch of words that are in non-SPAM, right? Like, I don't know, faculty meeting. But they start putting that in SPAM, we're all toast. Anyway, okay. So this only has now order D parameters, 2D plus 1. Why? One parameter here, because there's two classes. And D parameters to represent each of these. Why D parameters? Because you need one weight for every term in every class, right? So you have D terms, two classes, 2D."},{"id":577,"text":"instead of 2 to the d. So we've gone from exponential to linear. So far so good? All right. All right. So how are the estimates? Well, no surprise. How do you estimate the fraction of spam? You count the fraction of spam. How do you estimate how many words contain, you know, spam emails contain the word j? Well, you look at all the spam emails. You see how many contain the word j, and you divide. That's your fraction. And all of these are most likely estimates."},{"id":578,"text":"It's just like GDA. It's dirt cheap to train even on huge corporates, and it's surprisingly accurate. It run inferences dirt cheap as well. You just look at the vectors, you look them up, multiply them, done, or you take the logs and add them, either way. Clear enough? This is a very efficient model. This is how you classify, just like that. You look at the two things, you take the logs, you add them up. We talked about Laplace smoothing. This is the magic."},{"id":579,"text":"We add some ones. Feels good. All right."},{"id":580,"text":"I can make a more fancy version of that. We're going to talk about regularization on Wednesday. But the basic thing here is what prevents zero probabilities, and it shrinks your confidence in estimates. And we'll talk about various forms of regularization that basically make the model less confident about what it's seeing. This is a very simple smoothing form that actually gives interesting, appreciable results. You can use other numbers there too. It's not a big deal. All right. So these are the two generative models that are there."},{"id":581,"text":"And then I want to summarize and get you out of here on time. So we introduce these generative models. We classify the Bayes rule."},{"id":582,"text":"We talked a little bit about Gaussians, 1D and 2D. We derived GDA, which was the Gaussian discriminative analysis, where everything was class conditional Gaussian. We then did class conditional naive Bayes on discrete features very briefly. And in both cases, we had these nice closed form maximum likelihood estimators. I did not derive the maximum likelihood estimators in the second case, but the proof is identically the same. You set up the logs, you compute the derivatives, and you get a bunch of equations that you can very easily solve. We did a little bit of matrix multiplication."},{"id":583,"text":"and other stuff that was there. If that was unfamiliar to you, take a look at that. In the next class, we're going to look through data sets and other things there. And we're going to talk about training sets and test sets and all kinds of fun stuff. Have a great rest of your week."}],"notes":["本段讲解了高斯判别分析（GDA）的基本思想，即通过参数化每个类别的条件概率分布来实现分类。其中提到，对于两个类别，参数数量为2D+1，其中D是特征数量，因为每个类别需要D个参数来表示其分布，而类别先验概率需要一个参数。","在估计过程中，讲者强调了使用频率统计的方法，例如通过计算垃圾邮件中某个词出现的频率来估计其概率。同时，提到了拉普拉斯平滑（Laplace smoothing）作为防止零概率的简单方法，这在实际应用中非常重要。","讲者还提到，GDA模型在训练和推理上都非常高效，因为其计算复杂度是线性的，而不是指数级的。这使得GDA在处理大规模数据集时具有优势。","在讨论生成模型时，讲者提到了两种主要的生成模型：基于高斯分布的GDA和基于离散特征的朴素贝叶斯。两者都具有闭合形式的最大似然估计器，这使得模型训练变得简单。","讲者还提到，将在下节课讨论训练集和测试集的划分，以及相关的评估方法。这表明课程内容将逐步深入到模型评估和验证的阶段。","最后，讲者总结了本节课的主要内容，并提醒学生在下节课中关注数据集和评估方法的相关内容。这表明课程结构清晰，逐步推进，从模型构建到评估。"],"formulas":[{"latex":"P(Y = c) = \\frac{N_c}{N}","symbols":"P(Y = c) 表示类别 c 的先验概率，N_c 是类别 c 的样本数量，N 是总样本数","explanation":"公式正确，表示类别先验概率的计算方式，符合朴素贝叶斯分类的基本原理。" . It run inferences dirt cheap as well. You just look at the vectors, you look them up, multiply them, done, or you take the logs and add them, either way. Clear enough? This is a very efficient model. This is how you classify, just like that. You look at the two things, you take the logs, you add them up. We talked about Laplace smoothing. This is the magic."},{"start":4807.13,"text":"We add some ones. Feels good. All right."},{"start":4813.34,"text":"I can make a more fancy version of that. We're going to talk about regularization on Wednesday. But the basic thing here is what prevents zero probabilities, and it shrinks your confidence in estimates. And we'll talk about various forms of regularization that basically make the model less confident about what it's seeing. This is a very simple smoothing form that actually gives interesting, appreciable results. You can use other numbers there too. It's not a big deal. All right. So these are the two generative models that are there."},{"start":4842.67,"text":"And then I want to summarize and get you out of here on time. So we introduce these generative models. We classify the Bayes rule."},{"start":4849.55,"text":"We talked a little bit about Gaussians, 1D and 2D. We derived GDA, which was the Gaussian discriminative analysis, where everything was class conditional Gaussian. We then did class conditional naive Bayes on discrete features very briefly. And in both cases, we had these nice closed form maximum likelihood estimators. I did not derive the maximum likelihood estimators in the second case, but the proof is identically the same. You set up the logs, you compute the derivatives, and you get a bunch of equations that you can very easily solve. We did a little bit of matrix multiplication."},{"start":4878.83,"text":"and other stuff that was there. If that was unfamiliar to you, take a look at that. In the next class, we're going to look through data sets and other things there. And we're going to talk about trai else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details><summary>校订后的讲者原文（英文，保留完整片段）</summary>${p.segments.map(s=>'<p class="segment">'+esc(s.text)+'</p>').join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
