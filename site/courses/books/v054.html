<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>【斯坦福CS229】高斯判别分析</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】高斯判别分析 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v054","title":"【斯坦福CS229】高斯判别分析","course":"机器学习","pages":[{"title":"高斯判别分析简介与生成模型概述","segments":[{"id":0,"text":"Good afternoon. Welcome to CS229. This is going to be lecture five. We're going to talk about Gaussian discriminant analysis. So this is going to be our first foray into generative models. These generative models are pretty interesting because, you know, they're the G and GPT. So you hear the chat GPT, it's generative pre-trained transformers. We will maybe do pre-training a little bit later, maybe transformers a little bit later. But today we're getting our first example of a generative algorithm. And intuitively what goes on in a generative algorithm is you try","zh":"下午好。欢迎来到CS229。这将是第五讲。我们将讨论高斯判别分析。因此，这将是我们在生成模型方面的首次探索。这些生成模型非常有趣，因为，你知道的，它们是G和GPT。所以你听到聊天GPT，它是生成式预训练转换器。我们可能会稍后做一点预训练，可能稍后做一点转换器。但今天我们将看到生成算法的第一个例子。从直觉上讲，生成算法中发生的事情是，你试图学习数据的表示，你将在今天可以做到的最简单形式中看到这一点，以便理解学习数据表示的意义，以及如何利用这一点进行判别，你将看到这些内容，并将其与之前的内容联系起来。","start":5.14,"end":34.66},{"id":1,"text":"to learn a representation of your data and you're going to see it in about the simplest form that we can do today so you can see what that means to learn a representation of your data or understand that piece and then how you can use that for discrimination so you'll see the things and we'll relate it back","zh":"因此，我们的计划大致如下。我们将稍微讨论一下我刚刚提到的生成与判别之间的区别。这些是不同类别的算法。我想说，这是一个小小的附注，当我们教授这些课程时，比如，六、七年前，无论什么时候。","start":34.74,"end":49.0},{"id":2,"text":"So our plan is roughly as follows. We're going to talk a little bit about this generative versus discriminative thing that I've just been mentioning. These are a different class of these algorithms. I would say one kind of side note, when we teach these lectures like, I don't know, six, seven years ago, whenever it was.","zh":"当你谈论这些生成模型时，人们并不太关注生成模型，因为它们似乎无法达到最先进的性能。但现在它们对AI的发展做出了很大贡献。它们学习这些表示这一事实实际上非常有价值。然后我们将讨论高斯分布。我们将讨论从1D到2D函数的差异。我们将介绍一堆符号。希望这些内容对你来说是熟悉的。","start":49.52,"end":65.3},{"id":3,"text":"When you talk about these generative models, people weren't that interested in the generative models because they didn't seem like they got to state-of-the-art performance. But now they are responsible for a lot of the growth in AI. And this fact that they're learning these representations is actually quite valuable. We're then going to talk about the Gaussian distribution. We're going to talk about the difference between how we go from 1D to 2D functions. And we're going to introduce a bunch of notations. So hopefully this will be things that are familiar to you.","zh":"当你谈到这些生成模型时，人们以前并不太关注生成模型，因为它们似乎无法达到最先进的性能。但现在它们对AI的发展起到了很大的推动作用。它们学习这些表示这一事实实际上非常有价值。接下来我们将讨论高斯分布。我们将讨论如何从一维函数扩展到二维函数的不同之处。我们还将引入一系列符号。希望这些内容对你来说是熟悉的。","start":65.97,"end":95.72},{"id":4,"text":"But if not, don't worry. There's going to be a bunch of pictures. Now, I should warn you, I let Claude rewrite a bunch of the pictures and generate a bunch of plots. I hope they're okay. I checked them. But we'll see how it goes. I gave you a bunch of visualizations. So we'll see how that goes. We'll then have enough information to do GDA, Gaussian Discriminant Analysis. And then we'll do maximum likelihood for GDA. What will be interesting about this, which is not a general fact, but is interesting for this, is we'll be able to do estimation without having to do a lot of learning.","zh":"但如果不行，也别担心。接下来会有很多图片。现在，我得提醒你们，我让Claude重写了大部分的图片并生成了一些图表。我希望它们没问题。我检查过它们。但我们会看看情况如何。我给你们提供了一些可视化内容。那么我们来看看情况如何。之后我们将拥有足够的信息来进行高斯判别分析（GDA）。然后我们将对GDA进行最大似然估计。这将很有趣，这并不是一个普遍的事实，但对这个情况来说很有趣，我们将能够进行估计而不需要进行大量的学习。","start":96.09,"end":124.09},{"id":5,"text":"And so in fact, in many cases, in traditional SGD learning, we'll be able to do something fairly quick and dirty. And we'll also get exposed to how these MLE parameters are actually estimated for generative models, which we'll use a lot as we go through and build up the rest of the hierarchy of Gaussian models. And so one thing I should just say about the kind of if you're picking up on how the course is taught, we start with the most kind of simple setting that we can. And we're kind of relaxing one assumption as we go.","zh":"事实上，在许多情况下，在传统的随机梯度下降（SGD）学习中，我们将能够快速而粗略地完成一些事情。我们还将接触到如何为生成模型实际估计这些最大似然参数，这将在我们逐步构建高斯模型的整个层次结构时被大量使用。因此，我想简单说明一下课程的授课方式。我们从最简单的设置开始，然后在进行过程中逐步放松一个假设。","start":124.46,"end":152.9},{"id":6,"text":"one new moving piece in any lecture. But if you look back, you're like, wow, we've actually hopefully covered a fair amount of ground. I'm going to talk a little bit about the GDA decision boundary. I couldn't help myself here. There's one thing which is I don't think is in the notes, but I just added in, which has to do with these things called quadratic decision boundaries, because the question has come up every time I've ever taught it. So I just put in visualization. Then I'm going to talk about the difference between GDA and logistic regression.","zh":"每次讲座中都会有一个新的变化点。但如果你回顾一下，你会觉得，我们实际上已经覆盖了相当多的内容。我将稍微谈谈GDA的决策边界。我忍不住要讲这一点。有一个东西我认为不在讲义中，但我刚刚添加了，它与所谓的二次决策边界有关，因为每次我教这门课时，这个问题都会被提出。所以我添加了可视化内容。然后我将谈谈GDA与逻辑回归之间的区别。","start":153.74,"end":176.7}],"notes":["本段介绍了课程的总体安排，包括生成模型与判别模型的区别，以及生成模型在AI发展中的重要性。课程将从最简单的设定开始，逐步放松假设，以帮助学生理解生成模型的基本概念。","课程提到生成模型在早期不被重视，因为它们在性能上不如判别模型，但如今它们在AI领域中扮演了重要角色，特别是在学习数据表示方面。","接下来的课程内容将涉及高斯分布，从一维到二维函数的转换，以及相关符号的引入。这些内容旨在帮助学生建立对高斯分布的理解。","课程还提到将使用可视化工具来辅助教学，包括由Claude生成的图表。这些图表将用于展示高斯判别分析（GDA）的相关概念。","在GDA中，最大似然估计（MLE）将被用于参数估计，这将帮助学生理解生成模型中参数的估计方法。","课程最后提到将讨论GDA的决策边界，特别是二次决策边界，以及GDA与逻辑回归（logistic regression）之间的区别。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.14,"end":176.7,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.14,"text":"Good afternoon. Welcome to CS229. This is going to be lecture five. We're going to talk about Gaussian discriminant analysis. So this is going to be our first foray into generative models. These generative models are pretty interesting because, you know, they're the G and GPT. So you hear the chat GPT, it's generative pre-trained transformers. We will maybe do pre-training a little bit later, maybe transformers a little bit later. But today we're getting our first example of a generative algorithm. And intuitively what goes on in a generative algorithm is you try"},{"start":34.74,"text":"to learn a representation of your data and you're going to see it in about the simplest form that we can do today so you can see what that means to learn a representation of your data or understand that piece and then how you can use that for discrimination so you'll see the things and we'll relate it back"},{"start":49.52,"text":"So our plan is roughly as follows. We're going to talk a little bit about this generative versus discriminative thing that I've just been mentioning. These are a different class of these algorithms. I would say one kind of side note, when we teach these lectures like, I don't know, six, seven years ago, whenever it was."},{"start":65.97,"text":"When you talk about these generative models, people weren't that interested in the generative models because they didn't seem like they got to state-of-the-art performance. But now they are responsible for a lot of the growth in AI. And this fact that they're learning these representations is actually quite valuable. We're then going to talk about the Gaussian distribution. We're going to talk about the difference between how we go from 1D to 2D functions. And we're going to introduce a bunch of notations. So hopefully this will be things that are familiar to you."},{"start":96.09,"text":"But if not, don't worry. There's going to be a bunch of pictures. Now, I should warn you, I let Claude rewrite a bunch of the pictures and generate a bunch of plots. I hope they're okay. I checked them. But we'll see how it goes. I gave you a bunch of visualizations. So we'll see how that goes. We'll then have enough information to do GDA, Gaussian Discriminant Analysis. And then we'll do maximum likelihood for GDA. What will be interesting about this, which is not a general fact, but is interesting for this, is we'll be able to do estimation without having to do a lot of learning."},{"start":124.46,"text":"And so in fact, in many cases, in traditional SGD learning, we'll be able to do something fairly quick and dirty. And we'll also get exposed to how these MLE parameters are actually estimated for generative models, which we'll use a lot as we go through and build up the rest of the hierarchy of Gaussian models. And so one thing I should just say about the kind of if you're picking up on how the course is taught, we start with the most kind of simple setting that we can. And we're kind of relaxing one assumption as we go."},{"start":153.74,"text":"one new moving piece in any lecture. But if you look back, you're like, wow, we've actually hopefully covered a fair amount of ground. I'm going to talk a little bit about the GDA decision boundary. I couldn't help myself here. There's one thing which is I don't think is in the notes, but I just added in, which has to do with these things called quadratic decision boundaries, because the question has come up every time I've ever taught it. So I just put in visualization. Then I'm going to talk about the difference between GDA and logistic regression."}],"speech_gaps":[],"frame":"../frames/v054/001.webp","frame_time":17.14},{"title":"高斯判别分析与生成模型简介","segments":[{"id":7,"text":"These are the discriminative and generative versions. And we're going to see why classically people preferred logistic regression for many, many years. But as I said, that has switched in recent years. The importance of generative models, let's say, arguably dwarfs the discriminative from the point of view of excitement, maybe not of utility. And then we'll talk about naive Bayes, which is like...","zh":"这些是判别式和生成式版本。我们将看到为什么在很多年里人们更倾向于使用逻辑回归。但正如我所说，近年来这一趋势已经发生了变化。从兴奋度的角度来看，生成式模型的重要性可能超过了判别式模型，尽管可能在实用性上并非如此。然后我们将讨论朴素贝叶斯，这是一种……","start":177.53,"end":198.05},{"id":8,"text":"one of the simplest generative models. We'll do a spam filter because I think there's still some law that we have to teach you how to build a spam filter. All right. Anyway, so we're going to move at a high level. So that's the overarching idea. We're going to move from modeling p of y given x. That is, what is the probability of the label given the data point? That's what we've been doing discriminatively to modeling in the other direction.","zh":"一种最简单的生成式模型。我们将做一个垃圾邮件过滤器，因为我觉得我们仍然有必要教你们如何构建一个垃圾邮件过滤器。好吧，无论如何，我们将以高层次的方式进行。这就是总体思路。我们将从建模给定x的y的概率开始。也就是说，给定数据点，标签的概率是多少？这是我们之前判别式建模所做的事情，现在我们将转向相反的方向。","start":198.25,"end":222.65},{"id":9,"text":"What does the data distribution X look like given Y? I'll make that concrete over this. Awesome. This will be our first generative model.","zh":"给定Y，数据分布X看起来是什么样子？我将在接下来的内容中具体说明。太棒了。这将是我们第一个生成式模型。","start":223.69,"end":232.51},{"id":10,"text":"So all the algorithms we have seen so far are discriminative. They basically say something like linear regression. P of y given x and theta was modeled as a Gaussian error, if you recall. Logistic regression, it was as a Bernoulli. But the important salient point of both of them is you were given x, you estimated some parameters, and then you then decided which class that it was.","zh":"我们到目前为止所看到的所有算法都是判别式的。它们基本上是这样说的，比如线性回归。给定x和θ，p(y|x)被建模为高斯误差，如果你还记得的话。逻辑回归则是作为伯努利分布。但两者的重要共同点是，你被给定x，你估计了一些参数，然后你决定它属于哪个类别。","start":234.21,"end":256.17},{"id":11,"text":"All right, we learned the exponential family, and that was just a generalization of the same story. So all of them, everything you've seen so far was discriminative. And in each case, we learn this x given y. Now, intuitively, why does that make sense? Why are machine learning people so excited about that? Why do we do it? Well, it seems easier than learning p of x and y at the same time.","zh":"好吧，我们学习了指数族，这仅仅是同一故事的推广。因此，到目前为止，你们所见到的一切都是判别式的。在每种情况下，我们学习的是x给定y。直观上，为什么这样做有意义？为什么机器学习人员如此兴奋？我们为什么要这样做？因为这似乎比同时学习p(x)和p(y)更容易。","start":257.64,"end":278.06},{"id":12,"text":"Now, why may that be? P of X and Y at the same time means the probability of your data and of the class. If your class, for example, is relatively simple to describe, like you're classifying two things which kind of couldn't be more different. They're really spread apart. You don't need to spend all your time learning the nooks and crannies of class A versus class B. And I'll come to an example of this in a second. You could probably learn how to separate them, right? That's what discriminators do all the time.","zh":"那么，为什么这可能呢？X和Y同时发生的概率意味着你的数据和类别的概率。例如，如果你的类别相对容易描述，比如你在分类两种几乎完全不同的事物。它们真的彼此分开得很远。你不需要花很多时间去学习类别A和类别B之间的每一个细节。我稍后会举一个这样的例子。你可能可以学会如何将它们分开，对吧？这就是判别器一直在做的事情。","start":278.33,"end":302.85},{"id":13,"text":"That's what a discriminative model would do. It tries to learn a separating boundary. We saw this again and again.","zh":"这就是判别模型所做的。它试图学习一个分隔边界。我们反复看到这一点。","start":303.72,"end":308.02},{"id":14,"text":"We're going to consider something else. Now, arguably, you should be able to tell the difference between cats and elephants pretty easily. And these are not actual data from cats and elephants. And I don't know why I picked cats and elephants. But I think it was dogs and elephants at one point. And then maybe Claude prefers cats to dogs and switched it before I redrafted these. All right. So here's what we're going to do. We're going to look at our generative model. And this is incredibly fictionalized. These are height and weight.","zh":"我们将考虑其他内容。可以说，你应该能够很容易地区分猫和大象。但这些并不是来自猫和大象的实际数据。我不知道为什么我选了猫和大象。但我想一开始可能是狗和大象。然后也许Claude更喜欢猫而不是狗，所以在我不重新起草这些内容之前就把它改了。好吧。那么我们接下来要做什么呢？我们将看一下我们的生成模型。这非常虚构化。这些是身高和体重。","start":310.54,"end":334.58},{"id":15,"text":"And we've plotted, apparently, a normalization, some very heavy cats and some very light elephants, I guess here, small elephants. But the idea here is that there's a bunch of cats, which are these circles that are orange. And there's a bunch of elephants, which are those gray squares over there. And this is our data. We want to model and do this.","zh":"我们显然绘制了一些归一化数据，一些非常重的猫和一些非常轻的大象，我想这里是指小象。但这里的思路是，有一群猫，这些是橙色的圆圈。还有一群大象，这些是那边的灰色方块。这就是我们的数据。我们想要建模并做到这一点。","start":335.0,"end":354.44}],"notes":["本段讲解了生成模型与判别模型的区别，强调生成模型在某些情况下可能比判别模型更受关注。生成模型需要建模数据分布，而判别模型则专注于条件概率。","讲者提到生成模型在某些情况下可能比判别模型更有吸引力，但并不一定在实用性上更优。生成模型需要同时建模数据和类别，这在某些情况下可能更复杂。","讲者通过猫和大象的例子说明生成模型的建模思路，即通过数据分布来区分类别。虽然这个例子是虚构的，但有助于理解生成模型的基本思想。","讲者指出，生成模型需要建模数据和类别的联合分布，这可能比仅建模条件概率更复杂，但有时更有优势，尤其是在数据分布具有明显结构时。","讲者提到判别模型通过学习一个分离边界来区分类别，而生成模型则通过建模数据分布来实现分类。","讲者强调生成模型在某些情况下可能更受关注，但判别模型在实际应用中仍然广泛使用，这取决于具体任务和数据的特性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.53,"end":354.44,"asr_flags":[],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":177.53,"text":"These are the discriminative and generative versions. And we're going to see why classically people preferred logistic regression for many, many years. But as I said, that has switched in recent years. The importance of generative models, let's say, arguably dwarfs the discriminative from the point of view of excitement, maybe not of utility. And then we'll talk about naive Bayes, which is like..."},{"start":198.25,"text":"one of the simplest generative models. We'll do a spam filter because I think there's still some law that we have to teach you how to build a spam filter. All right. Anyway, so we're going to move at a high level. So that's the overarching idea. We're going to move from modeling p of y given x. That is, what is the probability of the label given the data point? That's what we've been doing discriminatively to modeling in the other direction."},{"start":223.69,"text":"What does the data distribution X look like given Y? I'll make that concrete over this. Awesome. This will be our first generative model."},{"start":234.21,"text":"So all the algorithms we have seen so far are discriminative. They basically say something like linear regression. P of y given x and theta was modeled as a Gaussian error, if you recall. Logistic regression, it was as a Bernoulli. But the important salient point of both of them is you were given x, you estimated some parameters, and then you then decided which class that it was."},{"start":257.64,"text":"All right, we learned the exponential family, and that was just a generalization of the same story. So all of them, everything you've seen so far was discriminative. And in each case, we learn this x given y. Now, intuitively, why does that make sense? Why are machine learning people so excited about that? Why do we do it? Well, it seems easier than learning p of x and y at the same time."},{"start":278.33,"text":"Now, why may that be? P of X and Y at the same time means the probability of your data and of the class. If your class, for example, is relatively simple to describe, like you're classifying two things which kind of couldn't be more different. They're really spread apart. You don't need to spend all your time learning the nooks and crannies of class A versus class B. And I'll come to an example of this in a second. You could probably learn how to separate them, right? That's what discriminators do all the time."},{"start":303.72,"text":"That's what a discriminative model would do. It tries to learn a separating boundary. We saw this again and again."},{"start":310.54,"text":"We're going to consider something else. Now, arguably, you should be able to tell the difference between cats and elephants pretty easily. And these are not actual data from cats and elephants. And I don't know why I picked cats and elephants. But I think it was dogs and elephants at one point. And then maybe Claude prefers cats to dogs and switched it before I redrafted these. All right. So here's what we're going to do. We're going to look at our generative model. And this is incredibly fictionalized. These are height and weight."},{"start":335.0,"text":"And we've plotted, apparently, a normalization, some very heavy cats and some very light elephants, I guess here, small elephants. But the idea here is that there's a bunch of cats, which are these circles that are orange. And there's a bunch of elephants, which are those gray squares over there. And this is our data. We want to model and do this."}],"speech_gaps":[],"frame":"../frames/v054/002.webp","frame_time":189.53},{"title":"高斯判别分析的生成方法","segments":[{"id":16,"text":"Now, the point I was just making is that in the discriminative case, so far we've used a lot of lines, linear models, to do this. We could use something else, too. We saw how to make something that was nonlinear look more like a line. But we would basically come up with a decision boundary. And intuitively, this makes sense. If you imagine, there's all kinds of weird subpopulations of elephants up into the right corner and cats to the left corner. And we didn't have to learn any of those. We just learned when a cat and an elephant are close,","zh":"现在，我刚才想说的是，在判别式情况下，到目前为止我们使用了很多直线、线性模型来做这件事。我们也可以使用其他方法。我们已经看到如何让一些非线性的东西看起来更像一条直线。但基本上我们会得出一个决策边界。从直觉上讲，这很有道理。如果你想象一下，有各种各样的大象子群体分布在右上角，而猫则分布在左下角。我们并不需要学习这些子群体。我们只需要学习当猫和大象接近时，","start":356.32,"end":381.54},{"id":17,"text":"How do I tell them apart? Now, when I say that out loud, that sounds pretty ridiculous, like a cat and elephant are close, but hopefully you get what I mean. If you have two classes that are difficult to distinguish, you're kind of devoting all your horsepower right to that decision boundary, so both of the classes enter into it. But that's not the only way to do this, right? In the generative approach, what we're going to do, instead of finding that boundary, is we're going to model each class effectively independently. We'll come back to what we actually relax and practice.","zh":"如何区分它们？当我大声说出这句话时，听起来有点荒谬，比如猫和大象接近，但希望你能明白我的意思。如果你有两个难以区分的类别，你基本上会把所有的计算能力都投入到这个决策边界上，因此这两个类别都会参与其中。但这并不是唯一的方法，对吧？在生成式方法中，我们将不做的是寻找这个边界，而是分别对每个类别进行建模。我们之后会回到我们实际上放松和练习的内容。","start":382.34,"end":411.87},{"id":18,"text":"But we're going to ask instead, what do the features look like for every class? So is there something about an elephant that is dramatically different than a cat? Maybe it has a trunk or whatever you think about. And then we'll also try and learn how likely each class is. So the prior distribution. And why do we need both? Well, if you think about this, we're going to probably do classification with Bayes' rule. So let's look at what this looks like in the example.","zh":"但我们将会问的是，每个类别下的特征是什么样的？所以，大象和猫之间是否有显著的不同之处？也许大象有鼻子，或者其他你认为的特征。我们还将尝试学习每个类别的可能性。也就是先验分布。为什么我们需要两者？如果你想想，我们可能会用贝叶斯规则来进行分类。让我们看看这个例子中的情况。","start":412.63,"end":440.94},{"id":19,"text":"All right, here's the generative idea in pictures. So if you look, what we're going to do intuitively in this classification paradigm is we're going to learn one model, which are these gray circles, these ellipses that are over here. We'll come back to those if you don't remember. Those are going to be effectively Gaussians, if you like.","zh":"好了，这里有一个生成式方法的图示。如果你看，我们在这种分类范式中直观上要做的事情是学习一个模型，也就是这些灰色圆圈，这些椭圆在这里。如果你忘记了，我们之后会回到这些内容。这些将会是有效的高斯分布，如果你喜欢的话。","start":443.05,"end":460.36},{"id":20,"text":"And this white thing. And then we're going to learn something in the orange. And we're going to kind of learn their center of mass. And in this very simple generative model, we're just going to learn their distribution. So basically what we've learned here is cats are smaller and weigh less, elephants weigh more, and they have some variance. And we're going to make the variance fixed for the point of view of the slides. We'll come back to that later. Or their covariance. And I'm going to talk about what covariance is if you're not familiar with it.","zh":"并且这个白色的东西。然后我们将学习橙色部分的内容。我们将大致学习它们的质心。在这个非常简单的生成模型中，我们只是学习它们的分布。基本上，我们在这里学到的是，猫的体型更小，体重更轻，而大象的体重更重，并且它们有一定的方差。为了幻灯片的视角，我们将方差固定下来。我们之后会再回到这一点。或者它们的协方差。如果你们不熟悉协方差，我将解释什么是协方差。","start":461.77,"end":483.73},{"id":21,"text":"in just a couple slides, and this kind of visualization will make more precise sense.","zh":"在接下来的几张幻灯片中，这种可视化将更加精确地表达。","start":484.22,"end":488.08},{"id":22,"text":"But at this stage, all I want you to think about is really what we're going to do is","zh":"但在这个阶段，我只希望你们思考的是，我们将要做什么是","start":488.28,"end":490.92},{"id":23,"text":"somehow we're going to create a model, and the intent of the model is","zh":"某种方式创建一个模型，而这个模型的意图是","start":490.92,"end":494.22},{"id":24,"text":"look at all the cats, build a model, look at all the elephants, build a model,","zh":"观察所有的猫，构建一个模型，观察所有的大象，构建一个模型，","start":495.02,"end":498.6},{"id":25,"text":"and then we're going to classify a new data point, say this green point, how?","zh":"然后我们将如何对一个新的数据点进行分类，比如说这个绿色的点？","start":498.68,"end":502.02},{"id":26,"text":"By looking at how likely it is under model A and how likely it is under model B.","zh":"通过查看它在模型A下的可能性以及在模型B下的可能性。","start":502.88,"end":507.28},{"id":27,"text":"So if that p-value is higher, if you like, that probability value is higher","zh":"所以如果这个p值更高，或者说这个概率值更高","start":508.28,"end":511.42},{"id":28,"text":"under the elephant model, we're likely to say that with some probability it's an","zh":"在大象模型下，我们可能会说，以某种概率它是大象。到目前为止还清楚吗？","start":511.42,"end":516.12},{"id":29,"text":"elephant. So far so good? And how we decide that is Bayes' rule, which","zh":"我们决定这一点的方式是贝叶斯规则，我们在本课程中已经做过几次，我刚才只是跳过了。","start":516.12,"end":520.64},{"id":30,"text":"we've done several times in this course and I just skipped over. At this","zh":"在这一抽象层次上，一切都清楚吗？好的，太棒了。请继续问我","start":520.64,"end":525.32},{"id":31,"text":"level of abstraction, everything clear? Alright, awesome. Please go ahead ask me","zh":"任何问题。","start":525.32,"end":529.72}],"notes":["本段讲解了生成方法与判别方法的区别。生成方法通过建模每个类别的分布来实现分类，而不是直接寻找决策边界。这种方法需要学习每个类别的特征分布和先验概率，从而利用贝叶斯规则进行分类。","在生成方法中，我们假设每个类别服从某种概率分布（如高斯分布），并学习这些分布的参数。通过比较新数据点在不同类别模型下的概率，可以决定其所属类别。","生成方法的一个关键点是，它不仅考虑了类别的特征差异，还考虑了类别之间的先验概率。这使得模型能够更全面地处理类别之间的不确定性。","在讲解中，教授通过可视化手段（如椭圆和高斯分布）来说明生成方法的直观理解。这些图形帮助学生理解不同类别在特征空间中的分布情况。","教授提到，生成方法中会学习每个类别的分布参数，包括均值和协方差。这些参数决定了类别在特征空间中的位置和形状。","最后，教授强调了贝叶斯规则在生成方法中的核心作用，并指出在课程中已经多次讨论过这一概念，但在此处仅作为基础回顾。"],"formulas":[{"latex":"P(Y = k | X = x) = \\frac{P(X = x | Y = k)P(Y = k)}{P(X = x)}","symbols":"P(Y = k | X = x) 表示给定特征X=x时类别k的后验概率，P(X = x | Y = k) 是类别k的似然，P(Y = k) 是类别k的先验概率，P(X = x) 是边缘概率。","explanation":"公式正确表达了贝叶斯分类规则，符合贝叶斯定理的数学形式，适用于分类任务。","evidence":"But we're going to ask instead, what do the features look like for every class? So is there something about an elephant that is dramatically different than a cat? Maybe it has a trunk or whatever you think about. And then we'll also try and learn how likely each class is. So the prior distribution. And why do we need both? Well, if you think about this, we're going to probably do classification with Bayes' rule. So let's look at what this looks like in the example."}],"uncertainties":["p-value"],"diagram":"none","start":356.32,"end":529.72,"asr_flags":[],"math_clarifications":["公式中的概率分布形式正确，符合贝叶斯定理的数学表达。"],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":356.32,"text":"Now, the point I was just making is that in the discriminative case, so far we've used a lot of lines, linear models, to do this. We could use something else, too. We saw how to make something that was nonlinear look more like a line. But we would basically come up with a decision boundary. And intuitively, this makes sense. If you imagine, there's all kinds of weird subpopulations of elephants up into the right corner and cats to the left corner. And we didn't have to learn any of those. We just learned when a cat and an elephant are close,"},{"start":382.34,"text":"How do I tell them apart? Now, when I say that out loud, that sounds pretty ridiculous, like a cat and elephant are close, but hopefully you get what I mean. If you have two classes that are difficult to distinguish, you're kind of devoting all your horsepower right to that decision boundary, so both of the classes enter into it. But that's not the only way to do this, right? In the generative approach, what we're going to do, instead of finding that boundary, is we're going to model each class effectively independently. We'll come back to what we actually relax and practice."},{"start":412.63,"text":"But we're going to ask instead, what do the features look like for every class? So is there something about an elephant that is dramatically different than a cat? Maybe it has a trunk or whatever you think about. And then we'll also try and learn how likely each class is. So the prior distribution. And why do we need both? Well, if you think about this, we're going to probably do classification with Bayes' rule. So let's look at what this looks like in the example."},{"start":443.05,"text":"All right, here's the generative idea in pictures. So if you look, what we're going to do intuitively in this classification paradigm is we're going to learn one model, which are these gray circles, these ellipses that are over here. We'll come back to those if you don't remember. Those are going to be effectively Gaussians, if you like."},{"start":461.77,"text":"And this white thing. And then we're going to learn something in the orange. And we're going to kind of learn their center of mass. And then in this very simple generative model, we're just going to learn their distribution. So basically what we've learned here is cats are smaller and weigh less, elephants weigh more, and they have some variance. And we're going to make the variance fixed for the point of view of the slides. We'll come back to that later. Or their covariance. And I'm going to talk about what covariance is if you're not familiar with it."},{"start":484.22,"text":"in just a couple slides, and this kind of visualization will make more precise sense."},{"start":488.28,"text":"But at this stage, all I want you to think about is really what we're going to do is"},{"start":490.92,"text":"somehow we're going to create a model, and the intent of the model is"},{"start":495.02,"text":"look at all the cats, build a model, look at all the elephants, build a model,"},{"start":498.68,"text":"and then we're going to classify a new data point, say this green point, how?"},{"start":502.88,"text":"By looking at how likely it is under model A and how likely it is under model B."},{"start":508.28,"text":"So if that p-value is higher, if you like, that probability value is higher"},{"start":511.42,"text":"under the elephant model, we're likely to say that with some probability it's an"},{"start":516.12,"text":"elephant. So far so good? And how we decide that is Bayes' rule, which"},{"start":520.64,"text":"we've done several times in this course and I just skipped over. At this"},{"start":525.32,"text":"level of abstraction, everything clear? Alright, awesome. Please go ahead ask me"}],"speech_gaps":[],"frame":"../frames/v054/003.webp","frame_time":368.32},{"title":"高斯判别分析的基本概念","segments":[{"id":32,"text":"questions too. Okay, so this is the plan, just recapped. Find a distribution for","zh":"还有一些问题。好的，所以这就是我们的计划，刚刚回顾了一下。为猫找到一个分布","start":529.72,"end":538.12},{"id":33,"text":"for cats, find a distribution for the elephants.","zh":"为大象找到一个分布。","start":538.12,"end":540.92},{"id":34,"text":"When a new animal comes in, does it","zh":"当一个新的动物进来时，它","start":541.4,"end":543.36},{"id":35,"text":"look more like a cat or an elephant?","zh":"看起来更像猫还是大象？","start":543.36,"end":545.24},{"id":36,"text":"High level makes sense what we're doing?","zh":"高层次上我们正在做的事情是否清楚？","start":546.4,"end":547.8},{"id":37,"text":"And mathematically, what's going on?","zh":"在数学上，又在发生什么？","start":547.86,"end":548.92},{"id":38,"text":"Now, I will say in the way we apply generative models","zh":"现在，我要说在我们应用生成模型","start":549.4,"end":553.3},{"id":39,"text":"like in GPT, the difference is we devote a lot of horsepower","zh":"像在GPT中，区别在于我们投入了很多计算资源","start":553.3,"end":558.38},{"id":40,"text":"to trying to learn how to generate text","zh":"试图学习如何生成文本","start":559.0,"end":560.82},{"id":41,"text":"in that generative way.","zh":"以这种生成的方式","start":560.82,"end":561.92},{"id":42,"text":"We try and learn very complicated representations.","zh":"我们尝试学习非常复杂的表示方法","start":562.12,"end":565.38},{"id":43,"text":"For the point of view of this lecture, GDA, we're going to take about the simplest version","zh":"从本节课的角度来看，高斯判别分析（GDA），我们将讨论可以得到的最简单的版本","start":565.38,"end":571.06},{"id":44,"text":"that we can get of a model that's still useful.","zh":"仍然有用的模型","start":571.06,"end":573.4},{"id":45,"text":"And surprisingly, even though this model is very simple, we'll see that you can build","zh":"令人惊讶的是，尽管这个模型非常简单，我们会看到你可以从中构建出相当合理的模型","start":573.6,"end":577.46},{"id":46,"text":"pretty reasonable things out of it.","zh":"这就是我们上周的计划","start":577.46,"end":579.28},{"id":47,"text":"And that's our plan for last week.","zh":"这就是我们上周的计划。","start":579.3,"end":580.4},{"id":48,"text":"All right. So we have to do a little bit of a detour. These are the new Claude Matplotlib generated graphics. Let's see how we did. All right. So recall the one-dimensional Gaussian. Remember that it's written with this notation here. This means z is drawn according to a normal distribution. This mu is the mean. Let's write that on there. It's helpful. We call this character the mean. I'm sure you recall that. We've been using it a lot.","zh":"好的。所以我们需要稍微偏离一下主题。这些是新生成的Claude Matplotlib图形。让我们看看我们做得怎么样。好的。那么回想一下一维高斯分布。记得这里用的是这种记号。这意味着z是根据正态分布抽取的。这个mu是均值。让我们把它写在这里。这很有帮助。我们称这个符号为均值。我相信你们都记得。我们一直在使用它。","start":585.87,"end":613.17},{"id":49,"text":"And this guy, the variance. I'm not going to write that. Get back to here. That has this distribution function here, which we've seen. z minus u squared, mu squared, over 2 sigma squared. All the normalization that we've typically done. This is the normalizing constant. So what I've charted here are a bunch of different values for sigma.","zh":"而这个，是方差。我不会把它写出来。回到这里。这里有一个分布函数，我们已经见过。z减去mu的平方，mu的平方，除以2倍的sigma平方。所有我们通常所做的归一化处理。这是归一化常数。所以在这里我绘制的是sigma的不同值。","start":614.44,"end":637.3},{"id":50,"text":"and how they affect what's going on. When sigma is small, it gets very, very spiky, right? Intuitively, it makes sense. If you have low variance, you're very concentrated across your mean. The heights are different. Why are the heights different? Exactly right. It has to integrate to 1. Exactly perfect. You have 0.5, you have 1, you have 2, and you're spreading that mass. And the integral underneath is normalized to 1. All good. All right.","zh":"以及它们对情况的影响。当sigma很小时，它会变得非常尖锐，对吧？直观上讲，这很有道理。如果你方差很低，你就会在均值周围高度集中。高度是不同的。为什么高度不同？完全正确。它必须积分等于1。完全正确。你有0.5，你有1，你有2，你在分散这些质量。而积分下方的值被归一化为1。一切正常。好的。","start":637.98,"end":664.93},{"id":51,"text":"All right, so let's imagine our fictitious example with the cats and elephants. Let's imagine we're just looking at their weight. Of course, this is like, who knows what units are in here? That's like me copping out. I mean, I don't know what axis you can put cats and elephants on the same weight. These are very large cats or very small elephants. Who knows?","zh":"好的，让我们想象一个虚构的例子，关于猫和大象。让我们想象我们只关注它们的体重。当然，这里的单位谁知道呢？这就像我推脱一样。我的意思是，我不知道你能把猫和大象放在同一个体重轴上。这些是非常大的猫或非常小的大象。谁知道呢？","start":667.82,"end":686.26},{"id":52,"text":"Doesn't really matter. You get the point. The point is in this alternate universe with cats and elephants, cats are lighter and elephants are heavier. And what that corresponds to is, of course, the mean of the cat is lower than the mean of the elephant.","zh":"这并不重要。你们明白要点。要点是在这个猫和大象的平行宇宙中，猫更轻，大象更重。而这一点对应的是，当然，猫的均值低于大象的均值。","start":687.09,"end":700.07}],"notes":["本段介绍了高斯判别分析（GDA）的基本思想，即通过为不同类别（如猫和大象）建立概率分布模型，来判断新样本属于哪个类别。讲者提到，GDA是生成模型的一种简单形式，虽然模型简单，但可以构建出合理的分类器。","讲者通过猫和大象的体重对比，说明了不同类别的均值差异。猫的体重较低，大象的体重较高，这对应于不同类别分布的均值不同。这一例子帮助理解GDA中如何利用均值和方差来区分类别。","讲者还提到，高斯分布的方差会影响分布的形状。当方差较小时，分布会更加尖锐，集中在均值附近；而方差较大时，分布会更宽泛。这一特性在GDA中用于建模不同类别的数据分布。","讲者强调，GDA的目标是找到一个简单的模型，该模型在实际应用中仍然有用。虽然GDA模型简单，但通过合理的设计，可以实现有效的分类。","讲者提到，与生成模型（如GPT）相比，GDA更注重于建模数据的分布，而不是学习复杂的表示。这说明了GDA与生成模型在目标和方法上的不同。","最后，讲者通过图表展示了不同方差下的高斯分布，帮助学生直观理解方差对分布形状的影响。这一部分为后续讨论GDA的数学基础做了铺垫。"],"formulas":[],"uncertainties":["z minus u squared, mu squared, over 2 sigma squared"],"diagram":"none","start":529.72,"end":700.07,"asr_flags":[],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":529.72,"text":"questions too. Okay, so this is the plan, just recapped. Find a distribution for"},{"start":538.12,"text":"for cats, find a distribution for the elephants."},{"start":541.4,"text":"When a new animal comes in, does it"},{"start":543.36,"text":"look more like a cat or an elephant?"},{"start":546.4,"text":"High level makes sense what we're doing?"},{"start":547.86,"text":"And mathematically, what's going on?"},{"start":549.4,"text":"Now, I will say in the way we apply generative models"},{"start":553.3,"text":"like in GPT, the difference is we devote a lot of horsepower"},{"start":559.0,"text":"to trying to learn how to generate text"},{"start":560.82,"text":"in that generative way."},{"start":562.12,"text":"We try and learn very complicated representations."},{"start":565.38,"text":"For the point of view of this lecture, GDA, we're going to take about the simplest version"},{"start":571.06,"text":"that we can get of a model that's still useful."},{"start":573.6,"text":"And surprisingly, even though this model is very simple, we'll see that you can build"},{"start":577.46,"text":"pretty reasonable things out of it."},{"start":579.3,"text":"And that's our plan for last week."},{"start":585.87,"text":"All right. So we have to do a little bit of a detour. These are the new Claude Matplotlib generated graphics. Let's see how we did. All right. So recall the one-dimensional Gaussian. Remember that it's written with this notation here. This means z is drawn according to a normal distribution. This mu is the mean. Let's write that on there. It's helpful. We call this character the mean. I'm sure you recall that. We've been using it a lot."},{"start":614.44,"text":"And this guy, the variance. I'm not going to write that. Get back to here. That has this distribution function here, which we've seen. z minus u squared, mu squared, over 2 sigma squared. All the normalization that we've typically done. This is the normalizing constant. So what I've charted here are a bunch of different values for sigma."},{"start":637.98,"text":"and how they affect what's going on. When sigma is small, it gets very, very spiky, right? Intuitively, it makes sense. If you have low variance, you're very concentrated across your mean. The heights are different. Why are the heights different? Exactly right. It has to integrate to 1. Exactly perfect. You have 0.5, you have 1, you have 2, and you're spreading that mass. And the integral underneath is normalized to 1. All good. All right."},{"start":667.82,"text":"All right, so let's imagine our fictitious example with the cats and elephants. Let's imagine we're just looking at their weight. Of course, this is like, who knows what units are in here? That's like me copping out. I mean, I don't know what axis you can put cats and elephants on the same weight. These are very large cats or very small elephants. Who knows?"},{"start":687.09,"text":"Doesn't really matter. You get the point. The point is in this alternate universe with cats and elephants, cats are lighter and elephants are heavier. And what that corresponds to is, of course, the mean of the cat is lower than the mean of the elephant."}],"speech_gaps":[],"frame":"../frames/v054/004.webp","frame_time":541.72},{"title":"高斯判别分析中的多维高斯分布","segments":[{"id":53,"text":"All right. So now how do we do this? Well, we have this probability distribution function, this kind of likelihood function, and we can compare these two values when we get our new point here. So we have our new point, which is our new animal. We're unsure if it's an elephant or a cat. I guess it's possible that a cat is that big, but it's very unlikely. But this is like a pretty reasonable size for a small elephant. So far, so good? All right. All right. All right. We'll go into this in a second. All right.","zh":"好的。那么现在我们该如何进行呢？我们有一个概率分布函数，这种似然函数，当我们得到这个新点时，我们可以比较这两个值。我们有这个新点，也就是我们的新动物。我们不确定它是大象还是猫。我想猫这么大也是有可能的，但可能性非常低。但这个尺寸对于小象来说还是比较合理的。到目前为止，还行吗？好的。好的。好的。我们稍后再详细讨论。好的。","start":701.87,"end":731.78},{"id":54,"text":"Okay, but what happens when we generalize that simple example to two dimensions? There we need a little bit more notation. We haven't really had multidimensional Gaussians in the class, but they work hopefully like you would expect them to work. So we have an x, which is going to be an Rn. This n is going to be 2 in our example. That's the dimensions, but it could be higher.","zh":"好的，但当我们把这个简单的例子推广到二维时会发生什么呢？这时候我们需要一些更多的符号表示。我们还没有在课堂上讨论过多维高斯分布，但它们应该像你预期的那样工作。我们有一个x，它属于Rn。在这个例子中，n将是2。这是维度，但也可以更高。","start":734.37,"end":754.32},{"id":55,"text":"We write x is distributed according to mu and sigma to mean the following. Mu is the mean vector. That's going to be the center. If you think back to the elephant diagram, these were the stars that I was drawing. These were the middles, the means, the average mass of what was going on. And then sigma is going to be this covariance matrix. And if you remember, that means that it's going to be symmetric. So the entries across each from each other are the same in the obvious way. It's positive definite.","zh":"我们写x服从均值为mu和协方差矩阵为sigma的分布，意思是以下内容。mu是均值向量，也就是中心点。回想一下大象的示意图，这些就是我画的星星，这些是中间点，也就是均值，也就是所发生事情的平均质量。然后sigma是这个协方差矩阵。如果你还记得，这意味着它是对称的。因此，每个对角线上的元素在明显的方式下是相同的。它是正定的。","start":756.64,"end":785.28},{"id":56,"text":"OK? It means it has, what does a positive definite mean? You can't . Yeah, that's a great definition. So you gave me, wonderful. So the definition here has to do with if you take a vector and you dot it through sigma, you say sigma transpose sigma z, that's always going to be greater than or equal to 0 if it's positive semi-definite. And that's a function of the fact that its eigenvalues have a particular structure.","zh":"明白吗？正定意味着什么？你不能……是的，这是一个很好的定义。你给了我，太棒了。这里的定义与如果你取一个向量并将其点乘sigma有关。你可以说sigma转置乘以sigma乘以z，如果它是半正定的，那么这个值总是大于或等于0。这是其特征值具有特定结构的结果。","start":786.56,"end":820.07},{"id":57,"text":"In this case, it's positive definite, so the ellipse is not flat. That's right. That's a great consequence. The statement was, because it's positive definite, the ellipse is not flat. That means that they actually have round values. There's no zero variance in any dimension. Please.","zh":"在这种情况下，它是正定的，因此椭圆不是扁平的。没错。这是一个很好的结果。陈述是，因为它是正定的，椭圆不是扁平的。这意味着它们实际上具有圆形的值。任何维度都没有零方差。请。","start":821.58,"end":836.2},{"id":58,"text":"Fantastic. That was what I was looking for. The eigenvalues are all positive. It has eigenvalues because the matrix is symmetric. Not all matrices have these in a way that makes sense. But that's because these two things basically tell us that we can do all kinds of nice eigenvalue things. That will be the consequence. That fact will be used, actually not so much today, but in general about these matrices again and again. And this is the analog, by the way, of the variance being positive or non-negative.","zh":"太棒了。这就是我想要的。所有的特征值都是正的。它有特征值，因为这个矩阵是对称的。并不是所有矩阵都有这样的性质。但这是因为这两个性质基本上告诉我们我们可以进行各种漂亮的特征值运算。这将是一个结果。实际上，这个事实今天不会用到太多，但是一般来说，这些矩阵会反复用到这一点。顺便说一句，这与方差为正或非负的情况是相对应的。","start":837.93,"end":863.65}],"notes":["本段讲解了正定矩阵的定义及其在高斯分布中的意义。正定矩阵意味着对于任意非零向量z，其与矩阵σ的乘积的二次型结果总是大于等于零。这是通过矩阵的特征值结构来定义的，正定矩阵的所有特征值都是正的。","正定矩阵的一个重要性质是它对应的椭圆（在二维情况下）不会是扁平的，这说明在各个维度上都没有零方差。这意味着数据在各个方向上都有一定的变化，而不是集中在某一点上。"],"formulas":[],"uncertainties":["You can't ."],"diagram":"none","start":701.87,"end":863.65,"asr_flags":[56],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":701.87,"text":"All right. So now how do we do this? Well, we have this probability distribution function, this kind of likelihood function, and we can compare these two values when we get our new point here. So we have our new point, which is our new animal. We're unsure if it's an elephant or a cat. I guess it's possible that a cat is that big, but it's very unlikely. But this is like a pretty reasonable size for a small elephant. So far, so good? All right. All right. All right. We'll go into this in a second. All right."},{"start":734.37,"text":"Okay, but what happens when we generalize that simple example to two dimensions? There we need a little bit more notation. We haven't really had multidimensional Gaussians in the class, but they work hopefully like you would expect them to work. So we have an x, which is going to be an Rn. This n is going to be 2 in our example. That's the dimensions, but it could be higher."},{"start":756.64,"text":"We write x is distributed according to mu and sigma to mean the following. Mu is the mean vector. That's going to be the center. If you think back to the elephant diagram, these were the stars that I was drawing. These were the middles, the means, the average mass of what was going on. And then sigma is going to be this covariance matrix. And if you remember, that means that it's going to be symmetric. So the entries across each from each other are the same in the obvious way. It's positive definite."},{"start":786.56,"text":"OK? It means it has, what does a positive definite mean? You can't . Yeah, that's a great definition. So you gave me, wonderful. So the definition here has to do with if you take a vector and you dot it through sigma, you say sigma transpose sigma z, that's always going to be greater than or equal to 0 if it's positive semi-definite. And that's a function of the fact that its eigenvalues have a particular structure."},{"start":821.58,"text":"In this case, it's positive definite, so the ellipse is not flat. That's right. That's a great consequence. The statement was, because it's positive definite, the ellipse is not flat. That means that they actually have round values. There's no zero variance in any dimension. Please."},{"start":837.93,"text":"Fantastic. That was what I was looking for. The eigenvalues are all positive. It has eigenvalues because the matrix is symmetric. Not all matrices have these in a way that makes sense. But that's because these two things basically tell us that we can do all kinds of nice eigenvalue things. That will be the consequence. That fact will be used, actually not so much today, but in general about these matrices again and again. And this is the analog, by the way, of the variance being positive or non-negative."}],"speech_gaps":[],"frame":"../frames/v054/005.webp","frame_time":713.87},{"title":"高斯判别分析中的协方差矩阵与距离函数","segments":[{"id":59,"text":"Zero variance means you're certain in that attribute. Okay, cool. All right. That also means I can write this. I can take the inverse. Because it has all positive eigenvalues, I can factor it however you like. Eigenvalue to composition, invert the eigenvalues, take transposes. It has that property. So in particular, that allows me to write this and this, and life is good. If it did not have that property, if it had zeros, I'd be in trouble, right?","zh":"零方差意味着你在该属性上是确定的。好的，不错。那么这也意味着我可以写下这个。我可以取逆矩阵。因为它所有的特征值都是正的，我可以以任何方式对其进行分解。特征值到组成，反转特征值，取转置。它具有这种性质。因此，特别是这允许我写出这两个表达式，生活很美好。如果没有这种性质，如果有零值，我就会遇到麻烦，对吧？","start":864.12,"end":895.66},{"id":60,"text":"The zeros would kill me in both places. This wouldn't be defined. This is the determinant. So remember this expression here. This is the determinant, square root of the determinant. If that were a negative number, I would be in trouble. Determinant is the product of all the eigenvalues. The product of a bunch of positive numbers is positive. So I'm taking a square root. So that's important there. And then here, if there were a zero, well, this would no longer be well-defined. And I'll think about that like a distance. Now, you can get around that if you really care about the zero. But the negative stuff would cause you problems.","zh":"零值会在两个地方导致问题。这个表达式将不再定义。这是行列式。所以记住这里的这个表达式。这是行列式，行列式的平方根。如果这个数是负数，我就会遇到麻烦。行列式是所有特征值的乘积。一堆正数的乘积是正的。所以我取平方根。这一点很重要。在这里，如果有零值，那么这个表达式将不再良好定义。我会把它想成一种距离。现在，如果你真的关心零值，你可以绕过这个问题。但负数会导致你遇到麻烦。","start":896.49,"end":925.31},{"id":61,"text":"Sound good? All right. Okay, you don't have to know this name, but this basically you can regard as a distance function that is weighted by those eigenvalues. If this is unfamiliar to you, these use of eigenvalues, it won't be so bad today, but I'm warning you in the future that I'm going to use these quite aggressively. I think next week you get 10U. Isn't that a treat for all of you? And then the week after that, you get me back for a week, and then that week there will be a lot of eigenvalues. It's like eigenvalue week, okay? That's going to be everywhere. So I just want to highlight that if it's unfamiliar.","zh":"听起来不错吗？好的。你不需要知道这个名字，但基本上你可以将它视为一种由这些特征值加权的距离函数。如果你对此不熟悉，今天使用特征值的这些方法不会太糟糕，但我警告你，将来我会非常频繁地使用这些方法。我想下周你们会得到10U。这不是对你们的奖励吗？然后下一周，你们会再见到我一周，然后那一周会有大量的特征值。就像特征值周，对吧？这会无处不在。所以我只是想强调，如果你们对此不熟悉。","start":926.45,"end":957.13},{"id":62,"text":"And this is a distance in the sense that it satisfies the properties of a distance, so that it's just scaled in a way. All right. So far, so good? Everyone understand all the definitions?","zh":"这是一种距离，因为它满足距离的性质，只是被缩放了一下。到目前为止，一切顺利吗？每个人都理解所有的定义吗？","start":957.57,"end":969.8},{"id":63,"text":"Let's look at some pictures, make sure they sink in. All right, this is where a cloud really outdid itself. I used to draw these, and there was a lot of gesturing, so we're cutting all that down. Now we have matplotlib, like 1980s technology, to draw for you. Maybe 1990s technology. Anyway, this is what a 2D curve looks like. Instead of the bell curve, it looks like this and symmetric in all directions. It has this nice little cone, little circle in the middle. It's a surface and a contour. I prefer not to do this. I'm going to show you the contour version. This is one.","zh":"让我们看看一些图片，确保它们能够深入人心。好了，这就是一个云朵真正发挥出色的地方。我以前会画这些图，而且会有很多手势，所以我们现在把这些都省略了。现在我们有matplotlib，像1980年代的技术，来为你绘制图形。也许更像是1990年代的技术。不管怎样，这就是一个二维曲线的样子。而不是钟形曲线，它看起来像这样，并且在所有方向上都是对称的。它有一个漂亮的锥形，中间有一个小圆圈。它是一个曲面和一个等高线。我不喜欢这样做。我要向你们展示等高线版本。这是其中一个。","start":970.76,"end":997.84},{"id":64,"text":"where the height in 3D tells you the value of p. And this is now in two dimensions, x1 and x2. This is the standard Gaussian. That means it's going to have a covariance function, which is the identity. All right, cool. Effectively, it means every dimension is independent.","zh":"其中，三维高度告诉你p的值。现在这是二维的，x1和x2。这是标准高斯分布。这意味着它将具有一个协方差函数，即单位矩阵。好了，很酷。实际上，这意味着每个维度都是独立的。","start":998.74,"end":1016.54},{"id":65,"text":"Here's some more Gaussians. They have weirder shapes. So remember, in 1D, they can only be flat. They could be pointy. But now, when you have higher dimensions, you have more degrees of freedom. So these models get correspondingly richer. Here's one where you have sigma i. It's there. It's nice and round. If you make sigma diagonal,","zh":"这里还有一些其他的高斯分布。它们有更奇怪的形状。所以记住，在一维情况下，它们只能是平坦的。它们可以是尖的。但现在，当你有更高维数时，你有更多的自由度。因此，这些模型相应地变得更加丰富。这里有一个例子，其中你有sigma i。它在那里。它看起来很圆。如果你让sigma对角化，","start":1018.43,"end":1041.29}],"notes":["本段主要讲解了协方差矩阵的性质，特别是其逆矩阵和特征值的使用。当协方差矩阵的特征值全为正数时，可以对其进行逆运算，并且其行列式为正数，因此可以取平方根。如果协方差矩阵中存在零特征值，会导致行列式为零，从而无法进行某些计算，如距离函数的定义。","讲者提到，协方差矩阵的逆矩阵可以用于构建距离函数，该距离函数通过特征值加权。虽然当前课程中可能不会深入讨论，但未来课程中会频繁使用这一概念，因此需要提前了解。","讲者强调了协方差矩阵的逆矩阵在构建距离函数中的作用，并指出如果协方差矩阵的行列式为负数或零，会导致计算问题。因此，协方差矩阵的正定性非常重要。","讲者通过图像展示了二维高斯分布的形状，指出其与一维高斯分布的不同之处。二维高斯分布具有对称性，并且可以通过特征值和协方差矩阵来描述其形状。","讲者提到，高斯分布的协方差矩阵可以是单位矩阵，这意味着各个维度之间是独立的。如果协方差矩阵是单位矩阵，那么高斯分布的形状是圆形或球形。","讲者指出，随着维度的增加，高斯分布的形状会变得更加复杂，因为有更多的自由度。因此，高斯分布模型在高维空间中可以表示更丰富的形状。"],"formulas":[{"latex":"det(\\boldsymbol{\\Sigma}) = \\prod_{i} \\lambda_i","symbols":"行列式等于特征值的乘积","explanation":"原始公式正确表达了行列式等于特征值的乘积，但使用了更标准的数学符号\\prod_{i} \\lambda_i来表示乘积。","evidence":"The zeros would kill me in both places. This wouldn't be defined. This is the determinant. So remember this expression here. This is the determinant, square root of the determinant. If that were a negative number, I would be in trouble. Determinant is the product of all the eigenvalues. The product of a bunch of positive numbers is positive. So I'm taking a square root. So that's important there. And then here, if there were a zero, well, this would no longer be well-defined. And I'll think about that like a distance. Now, you can get around that if you really care about the zero. But the negative stuff would cause you problems."}],"uncertainties":["sigma i"],"diagram":"none","start":864.12,"end":1041.29,"asr_flags":[],"math_clarifications":["原始公式中的'product of eigenvalues'被正确转换为数学符号\\prod_{i} \\lambda_i，以符合数学表达规范。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":864.12,"text":"Zero variance means you're certain in that attribute. Okay, cool. All right. That also means I can write this. I can take the inverse. Because it has all positive eigenvalues, I can factor it however you like. Eigenvalue to composition, invert the eigenvalues, take transposes. It has that property. So in particular, that allows me to write this and this, and life is good. If it did not have that property, if it had zeros, I'd be in trouble, right?"},{"start":896.49,"text":"The zeros would kill me in both places. This wouldn't be defined. This is the determinant. So remember this expression here. This is the determinant, square root of the determinant. If that were a negative number, I would be in trouble. Determinant is the product of all the eigenvalues. The product of a bunch of positive numbers is positive. So I'm taking a square root. So that's important there. And then here, if there were a zero, well, this would no longer be well-defined. And I'll think about that like a distance. Now, you can get around that if you really care about the zero. But the negative stuff would cause you problems."},{"start":926.45,"text":"Sound good? All right. Okay, you don't have to know this name, but this basically you can regard as a distance function that is weighted by those eigenvalues. If this is unfamiliar to you, these use of eigenvalues, it won't be so bad today, but I'm warning you in the future that I'm going to use these quite aggressively. I think next week you get 10U. Isn't that a treat for all of you? And then the week after that, you get me back for a week, and then that week there will be a lot of eigenvalues. It's like eigenvalue week, okay? That's going to be everywhere. So I just want to highlight that if it's unfamiliar."},{"start":957.57,"text":"And this is a distance in the sense that it satisfies the properties of a distance, so that it's just scaled in a way. All right. So far, so good? Everyone understand all the definitions?"},{"start":970.76,"text":"Let's look at some pictures, make sure they sink in. All right, this is where a cloud really outdid itself. I used to draw these, and there was a lot of gesturing, so we're cutting all that down. Now we have matplotlib, like 1980s technology, to draw for you. Maybe 1990s technology. Anyway, this is what a 2D curve looks like. Instead of the bell curve, it looks like this and symmetric in all directions. It has this nice little cone, little circle in the middle. It's a surface and a contour. I prefer not to do this. I'm going to show you the contour version. This is one."},{"start":998.74,"text":"where the height in 3D tells you the value of p. And this is now in two dimensions, x1 and x2. This is the standard Gaussian. That means it's going to have a covariance function, which is the identity. All right, cool. Effectively, it means every dimension is independent."},{"start":1018.43,"text":"Here's some more Gaussians. They have weirder shapes. So remember, in 1D, they can only be flat. They could be pointy. But now, when you have higher dimensions, you have more degrees of freedom. So these models get correspondingly richer. Here's one where you have sigma i. It's there. It's nice and round. If you make sigma diagonal,"}],"speech_gaps":[],"frame":"../frames/v054/006.webp","frame_time":876.12},{"title":"高斯判别分析中的协方差矩阵与椭圆","segments":[{"id":66,"text":"And those diagonal elements better be positive, right? Because of the properties we just outlined. Then you're going to stretch each component in different directions. And I have to say, I'm not super impressed with what Claude did here because it looks kind of weird. But maybe I'll go back to my old ways of gesturing with my hands. That seems to be better. So imagine you have it axis-aligned. So you have it diagonal. So you have the diagonal is one and five. What's that going to look like? Well, I'm going to have one unit in this direction and five units in that way. And then I have the ellipse.","zh":"这些对角线元素必须是正数，对吧？因为这是我们刚刚列出的性质。然后你会在不同的方向上拉伸每个分量。我必须说，我对Claude在这里的表现不是很满意，因为它看起来有点奇怪。但也许我会回到我以前用手势表达的方式。这似乎更好。想象一下，你有一个轴对齐的情况。你有一个对角线矩阵。对角线是1和5。这会是什么样子呢？我将在这个方向上有1个单位，在那个方向上有5个单位，然后你就有了这个椭圆。","start":1042.34,"end":1070.96},{"id":67,"text":"Oh, look at that. Look at that drawing technology. Amazing. I don't need Claude. Anyway, I love Claude. No, I'm just kidding. That's all going to be recorded in transcripts, and they're going to download all of it, and they're going to know exactly how good or bad we were to the AI. So don't curse at it if you saw. Don't curse at it. Anyway, so back to this. All right. Every lecture should include one unhinged conspiracy theory. I think that's a requirement going forward. Anyway, it does actually monitor. Claude Code does monitor, right, if you curse at it. So you shouldn't do it. It's just like you should say,","zh":"哦，看看这个。看看这个绘图技术。太棒了。我不需要Claude。不管怎样，我喜爱Claude。不，我只是在开玩笑。所有这些都会被记录在转录本中，他们会下载所有内容，并且会确切地知道我们对AI的表现是好还是坏。如果你看到了就不要咒骂它。不要咒骂它。不管怎样，回到这个话题。好的。每一节课都应该包含一个疯狂的阴谋论。我认为这是未来的硬性要求。不管怎样，它确实会监控。Claude Code会监控，对吧，如果你咒骂它的话。所以你不应该这样做。就像你应该说，","start":1071.29,"end":1100.37},{"id":68,"text":"Please and thank you. In any case, just be a good person. I don't know what's wrong with me. Anyway, all right. So this is full sigma. So what happens if it's not diagonal, okay? But it's actually a full positive definite matrix. Remember your linear algebra. What does that mean? It means its eigenvalues, again, have this stretch, but it's rotated the basis in some way. May have also flipped it, but that's a separate issue, okay?","zh":"请和谢谢。无论如何，只需做个好人。我不知道我怎么了。不管怎样，好的。这就是完整的协方差矩阵。那么如果它不是对角线形式会怎样呢？但其实它是一个完整的正定矩阵。记得你的线性代数知识吗？这意味着它的特征值再次具有这种拉伸效果，但它以某种方式旋转了基底。也可能翻转了它，但这是一个不同的问题，对吧？","start":1100.59,"end":1121.43},{"id":69,"text":"Does that make sense? Remember what orthogonal orthonormal transformations do? That's all it can do. So it will do it and all the rest. The center is given by the mean. There's this rotating behavior and this scaling behavior. And that's what Gaussians do. Pretty rich structures, especially in really, really high dimensions.","zh":"这有意义吗？记得正交或正交变换会做什么吗？这就是它能做的全部。它会这样做，以及所有其他事情。中心由均值给出。存在这种旋转行为和这种缩放行为。这就是高斯分布所做的。结构相当丰富，尤其是在非常高维的情况下。","start":1122.13,"end":1138.74},{"id":70,"text":"This is animation to say what I just said. Tilted, diagonal, so on. I actually prefer, rather than that fancy 3D version as I drew to you, when I have to fall back on explaining things, I prefer this contour version. And this is kind of like the version if you were to go left to right in 1D, where you would start to say how many sigma out are you. These lines here, these contours, these are level sets.","zh":"这是一个动画，用来说明我刚才所说的内容。倾斜的、对角的，等等。实际上，当我在解释问题时不得不回退到这种解释方式，我更喜欢这种等高线版本，而不是我之前画给你的那种复杂的3D版本。这种等高线版本类似于在一维情况下从左到右移动时，你会开始说你离均值有多少个标准差。这些线，这些等高线，它们是水平集。","start":1143.38,"end":1166.68},{"id":71,"text":"So all of them have the same value for p, the probability. That's what it means. That's what I mean by level set. If it's identity, then the level sets move at exactly the same rate. And I'm sampling them at some rate here. Maybe it's 1. In this case, when I have the diagonal 3 and 0.5, getting back to the earlier piece, it's axis aligned. That means that the axis that it's getting stretched are along those axes. It's getting stretched 0.5 and 3 in this direction.","zh":"所有这些都具有相同的概率值 p。这就是它的含义。这就是我所说的水平集的意思。如果协方差矩阵是单位矩阵，那么这些水平集以完全相同的速度移动。在这里，我以某种速率采样这些水平集。也许这个速率是1。在这种情况下，当协方差矩阵是对角线形式的3和0.5时，回到之前的例子，这些水平集是轴对齐的。这意味着它被拉伸的轴沿着这些轴方向。在这个方向上，它被拉伸了0.5和3倍。","start":1167.2,"end":1194.6},{"id":72,"text":"So far, so good?","zh":"到目前为止，没问题吗？","start":1197.22,"end":1197.98},{"id":73,"text":"All right.","zh":"好的。","start":1198.64,"end":1199.2},{"id":74,"text":"Here's positive correlation, and here's the whole thing.","zh":"这里是正相关，这里是整个情况。","start":1200.94,"end":1203.98},{"id":75,"text":"Shifted together in negative correlation.","zh":"在负相关的情况下整体移动。","start":1204.96,"end":1206.34},{"id":76,"text":"Okay?","zh":"好的吗？","start":1208.2,"end":1208.6},{"id":77,"text":"Just does a shift and puts it in there.","zh":"只是进行一次平移并将其放入其中。","start":1209.68,"end":1211.1},{"id":78,"text":"All right.","zh":"好的。","start":1211.36,"end":1211.92},{"id":79,"text":"We're in good shape.","zh":"我们目前状况良好。","start":1212.14,"end":1212.88},{"id":80,"text":"Okay.","zh":"好的。","start":1214.78,"end":1215.18},{"id":81,"text":"All right.","zh":"好的。","start":1217.78,"end":1218.58},{"id":82,"text":"So we talked about the axis-aligned ellipses.","zh":"因此，我们讨论了轴对齐的椭圆。","start":1218.6,"end":1220.14},{"id":83,"text":"We talked about the rotated ellipses.","zh":"我们还讨论了旋转的椭圆。","start":1220.14,"end":1221.82}],"notes":["本段主要讲解了高斯判别分析中协方差矩阵的性质，特别是对角线元素必须为正，以及非对角线情况下的正定矩阵。讲者提到，正定矩阵的特征值决定了椭圆的拉伸程度，同时矩阵的旋转方向也会影响椭圆的形状。讲者还提到，正定矩阵的特征向量决定了椭圆的主轴方向，而特征值决定了椭圆的拉伸比例。","讲者通过举例说明了轴对齐的椭圆和旋转后的椭圆之间的区别。轴对齐的椭圆意味着拉伸方向与坐标轴一致，而非对角线的协方差矩阵会导致椭圆旋转。讲者还提到，正定矩阵的特征值和特征向量决定了椭圆的形状和方向。","讲者进一步解释了高斯分布的等高线（level sets）的概念，即在二维空间中，等高线表示的是概率密度函数的等值线。这些等高线在正定矩阵的情况下会形成椭圆，而在单位矩阵的情况下则形成圆形。","讲者提到，当协方差矩阵是对角矩阵时，椭圆的主轴方向与坐标轴一致，而当协方差矩阵是满矩阵时，椭圆会旋转。讲者还提到，正定矩阵的特征值决定了椭圆的拉伸比例，而特征向量决定了椭圆的主轴方向。","讲者通过动画和图示的方式，进一步说明了高斯分布的等高线形状。讲者指出，等高线的间距反映了概率密度的变化，而椭圆的形状和方向则由协方差矩阵决定。","讲者还提到，当协方差矩阵是对角矩阵时，椭圆的主轴方向与坐标轴一致，而当协方差矩阵是满矩阵时，椭圆会旋转。讲者还提到，正定矩阵的特征值和特征向量决定了椭圆的形状和方向。"],"formulas":[],"uncertainties":["可能听不清的公式或术语"],"diagram":"none","start":1042.34,"end":1221.82,"asr_flags":[],"math_clarifications":["原文中未明确给出任何具体的数学公式或定义，因此无法核定任何数学公式。所有提到的数学概念如协方差矩阵、特征值、特征向量和概率密度函数均未被具体化或定义，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":18,"raw_segments":[{"start":1042.34,"text":"And those diagonal elements better be positive, right? Because the properties that we just outlined. Then you're going to stretch each component in different ones. And I have to say, I'm not super impressed with what Claude did here because it looks kind of weird. But maybe I'll go back to my old ways of gesturing with my hands. That seems to be better. So imagine you have it axis aligned. So you have it diagonal. So you have the diagonal is one and five. What's that going to look like? Well, I'm going to have one unit in this direction and five units in that way. And then I have the ellipse."},{"start":1071.29,"text":"Oh, look at that. Look at that drawing technology. Amazing. I don't need Claude. Anyway, I love Claude. No, I'm just kidding. That's all going to be recorded in transcripts, and they're going to download all of it, and they're going to know exactly how good or bad we were to the AI. So don't curse at it if you saw. Don't curse at it. Anyway, so back to this. All right. Every lecture should include one unhinged conspiracy theory. I think that's a requirement going forward. Anyway, it does actually monitor. Claude Code does monitor, right, if you curse at it. So you shouldn't do it. It's just like you should say,"},{"start":1100.59,"text":"Please and thank you. In any case, just be a good person. I don't know what's wrong with me. Anyway, all right. So this is full sigma. So what happens if it's not diagonal, okay? But it's actually a full positive 70 definite matrix. Remember your linear algebra. What does that mean? It means its eigenvalues, again, have this stretch, but it's rotated the basis in some way. May have also flipped it, but that's a separate issue, okay?"},{"start":1122.13,"text":"Does that make sense? Remember what orthogonal orthonormal transformations do? That's all it can do. So it will do it and all the rest. The center is given by the mean. There's this rotating behavior and this scaling behavior. And that's what Gaussians do. Pretty rich structures, especially in really, really high dimensions."},{"start":1143.38,"text":"This is animation to say what I just said. Tilted, diagonal, so on. I actually prefer, rather than that fancy 3D version as I drew to you, when I have to fall back on explaining things, I prefer this contour version. And this is kind of like the version if you were to go left to right in 1D, where you would start to say how many sigma out are you. These lines here, these contours, these are level sets."},{"start":1167.2,"text":"So all of them have the same value for p, the probability. That's what it means. That's what I mean by level set. If it's identity, then the level sets move at exactly the same rate. And I'm sampling them at some rate here. Maybe it's 1. In this case, when I have the diagonal 3 and 0.5, getting back to the earlier piece, it's axis aligned. That means that the axis that it's getting stretched are along those axes. It's getting stretched 0.5 and 3 in this direction."},{"start":1197.22,"text":"So far, so good?"},{"start":1198.64,"text":"All right."},{"start":1200.94,"text":"Here's positive correlation, and here's the whole thing."},{"start":1204.96,"text":"Shifted together in negative correlation."},{"start":1208.2,"text":"Okay?"},{"start":1209.68,"text":"Just does a shift and puts it in there."},{"start":1211.36,"text":"All right."},{"start":1212.14,"text":"We're in good shape."},{"start":1214.78,"text":"Okay."},{"start":1217.78,"text":"All right."},{"start":1218.6,"text":"So we talked about the axis-aligned ellipses."},{"start":1220.14,"text":"We talked about the rotated ellipses."}],"speech_gaps":[],"frame":"../frames/v054/007.webp","frame_time":1054.34},{"title":"高斯判别分析中的协方差矩阵与逆矩阵","segments":[{"id":84,"text":"And, yeah, we're in good shape.","zh":"而且，是的，我们状态很好。","start":1224.18,"end":1225.78},{"id":85,"text":"Okay?","zh":"好吧？","start":1226.18,"end":1226.58},{"id":86,"text":"Entries can be, oh that's one thing I want to say, sorry. Entries can be","zh":"条目可以是，哦，这是我想说的一件事，抱歉。条目可以是","start":1226.58,"end":1229.92},{"id":87,"text":"negative, but the eigenvalues are positive. Positive eigenvalues do not","zh":"负数，但特征值是正的。正的特征值并不","start":1229.92,"end":1233.94},{"id":88,"text":"mean that all the entries are positive. People get confused. All right, controls","zh":"意味着所有条目都是正的。人们常常会混淆。好了，控制","start":1233.94,"end":1241.78},{"id":89,"text":"the shape, size, and orientation of the Gaussian contours. Please.","zh":"着高斯轮廓的形状、大小和方向。请记住。","start":1241.78,"end":1245.16},{"id":90,"text":"Right, so in particular when you have a diagonal matrix because those","zh":"对，特别是当你有一个对角矩阵，因为那些","start":1247.54,"end":1252.92},{"id":91,"text":"are the products of the eigenvalues, you do have to do it. And even individually","zh":"是特征值的乘积，你确实需要这么做。即使单独","start":1252.92,"end":1256.04},{"id":92,"text":"individually, they are the variance of that individual element, which will also be non-negative.","zh":"单独来看，它们是该元素的方差，这也一定是非负的。","start":1256.04,"end":1260.02},{"id":93,"text":"So they will be positive in these kind of matrices.","zh":"因此，在这些矩阵中，它们将是正的。","start":1260.1,"end":1261.64},{"id":94,"text":"One test that you can kind of think about is diagonal dominance.","zh":"你可以考虑的一种测试是主对角线占优。","start":1262.58,"end":1265.36},{"id":95,"text":"So this is a quick way if you were looking at a matrix to tell, which is if you look","zh":"因此，如果你在查看一个矩阵时，想要快速判断它是否为正定矩阵，","start":1265.6,"end":1269.1},{"id":96,"text":"at the entries and all the other entries are smaller than the square of that entry, then","zh":"你可以查看各个元素，如果其他所有元素都小于该元素的平方，那么","start":1269.1,"end":1272.78},{"id":97,"text":"you're looking at a positive definite matrix.","zh":"你所看到的就是一个正定矩阵。","start":1273.26,"end":1274.76},{"id":98,"text":"Yeah.","zh":"是的。","start":1275.46,"end":1275.82},{"id":99,"text":"Wonderful question.","zh":"非常好的问题。","start":1276.04,"end":1276.7},{"id":100,"text":"You guys got this perfectly.","zh":"你们完全理解了。","start":1276.82,"end":1277.86},{"id":101,"text":"Awesome.","zh":"太棒了。","start":1279.48,"end":1279.84},{"id":102,"text":"But already in two, we're starting to see positive versus negative correlation, which","zh":"但早在二维时，我们就开始看到正相关与负相关的区别，这","start":1280.08,"end":1283.38},{"id":103,"text":"which refers to the off-diagonal entries.","zh":"指的是非对角线上的元素。","start":1283.38,"end":1285.02},{"id":104,"text":"Can't really define that when you get above 2","zh":"当维度超过2时，就无法定义这种相关性了","start":1286.34,"end":1288.1},{"id":105,"text":"because you get these kind of","zh":"因为你会得到这种","start":1288.1,"end":1289.64},{"id":106,"text":"Okay, actually, you know, there's one lecture which I did, which I'm not going to give,","zh":"好吧，实际上，我曾经上过一节课，但我不打算再讲了，","start":1291.48,"end":1294.46},{"id":107,"text":"but I will just tell you one piece about it. The inverse of these matrices, especially the","zh":"不过我会告诉你其中一点。这些矩阵的逆，尤其是","start":1294.56,"end":1299.44},{"id":108,"text":"inverse of Gaussian matrices, have all kinds of interesting structure. In particular, if you","zh":"高斯矩阵的逆矩阵具有各种有趣的结构。特别是，如果你","start":1299.44,"end":1303.14},{"id":109,"text":"invert a matrix, I'll just leave this as a challenge problem. Maybe I can write up how you","zh":"求逆一个矩阵，我暂时就把它作为挑战问题。也许我之后可以写出如何证明","start":1303.14,"end":1306.42},{"id":110,"text":"prove it. It turns out if there are zeros in the inverse, that actually means the two variables","zh":"它的方法。事实上，如果逆矩阵中存在零，这意味着两个变量","start":1306.42,"end":1310.68},{"id":111,"text":"are independent. Okay, it's interesting. The actual covariance matrix doesn't have that","zh":"是独立的。好吧，这很有趣。实际的协方差矩阵并不包含这个","start":1310.68,"end":1317.58},{"id":112,"text":"that information. The inverse does. That's why the inverse is in the formula. You can just write out","zh":"信息，而逆矩阵却包含。这就是为什么逆矩阵出现在公式中。你只需从这个角度来理解","start":1317.58,"end":1321.88},{"id":113,"text":"what I'm saying from that. Anyway, this is like what if you take graphical models, this is basically","zh":"我的说法。总之，这类似于如果你考虑图模型，这就是它所使用的。它被称为克利福德-哈默利理论。现在不重要。总之，这","start":1321.88,"end":1326.44},{"id":114,"text":"what it's using. It's called Clifford-Hammerley theory. Doesn't matter for now. Anyway, but it's","zh":"是有用的。知道这一点是有用的。好吧，所以改变均值会移动中心，而形状保持不变。好吧。","start":1326.44,"end":1330.86},{"id":115,"text":"useful. Useful to know. Okay, so changing mu shifts the center, and the shape stays the same. Okay.","zh":"有用。知道这一点很有用。好的，所以改变μ会移动中心，而形状保持不变。好的。","start":1330.86,"end":1337.42},{"id":116,"text":"All right, so what we're going to do right now, please.","zh":"好的，现在我们要做什么，请。","start":1338.34,"end":1340.38},{"id":117,"text":"Please.","zh":"请。","start":1340.38,"end":1340.48},{"id":118,"text":"the inverse covariance matrix","zh":"逆协方差矩阵","start":1342.62,"end":1344.9},{"id":119,"text":"has information about whether or not","zh":"包含有关","start":1344.9,"end":1346.78},{"id":120,"text":"two variables are independent?","zh":"两个变量是否独立的信息吗？","start":1346.78,"end":1348.22},{"id":121,"text":"Oh, it's easiest to read in that matrix.","zh":"哦，最容易在那个矩阵中读出。","start":1348.66,"end":1350.5},{"id":122,"text":"Yeah, great question.","zh":"是的，非常好的问题。","start":1350.62,"end":1351.2},{"id":123,"text":"So it's not that it's only there.","zh":"所以并不是只有在那里。","start":1351.4,"end":1352.46},{"id":124,"text":"Clearly, information is summarized","zh":"显然，信息被总结在均值和协方差中","start":1352.6,"end":1354.02},{"id":125,"text":"both in the mean and the covariance,","zh":"但其实这是很透明的","start":1354.02,"end":1355.44},{"id":126,"text":"but it's actually transparent.","zh":"并且这可能是一个随意的评论","start":1355.5,"end":1356.92},{"id":127,"text":"And this is maybe a throwaway comment","zh":"我本不应该说出来的，应该保持沉默","start":1357.26,"end":1358.6},{"id":128,"text":"that I shouldn't have made and just kept to myself.","zh":"所以抱歉，但我会解释一下","start":1358.6,"end":1360.14},{"id":129,"text":"So apologies, but I'll explain it.","zh":"所以抱歉，但我会解释一下。","start":1360.34,"end":1361.86},{"id":130,"text":"If you take the inverse and you look where xi and xj are","zh":"如果你取逆矩阵并观察xi和xj是否独立","start":1362.12,"end":1366.76},{"id":131,"text":"independent, the inverse entry will be 0.","zh":"那么逆矩阵中的对应项将会是0","start":1366.76,"end":1368.94},{"id":132,"text":"And this is a very famous theorem from stats from the late 70s, which gave rise to things","zh":"这是一项来自统计学领域、上世纪70年代末的著名定理，它催生了诸如图形模型等概念。","start":1368.94,"end":1374.02},{"id":133,"text":"called graphical models, where you write down which things are independent and which are","zh":"在这些模型中，你写下哪些变量是独立的，哪些变量是条件独立的。","start":1374.02,"end":1377.5},{"id":134,"text":"conditionally independent.","zh":"这是一段非常优美的结构，恰好隐藏在高斯随机模型中，这是我过去研究过的内容。","start":1377.5,"end":1378.2},{"id":135,"text":"And this is just a beautiful bit of structure that happens to be lurking in Gaussian random","zh":"因此，我觉得有必要把它讲给你听。","start":1378.52,"end":1383.04},{"id":136,"text":"models, which in a past life I studied.","zh":"协方差本身并不容易提供这种信息。因此，如果你查看这些信息，就很难判断，因为独立性需要分解，但数值可以是非零的。","start":1383.04,"end":1385.3},{"id":137,"text":"So I felt I had to vomit that out for you.","zh":"所以我感觉我必须把这些内容吐给你。","start":1385.42,"end":1387.34},{"id":138,"text":"The covariance itself does not give you that information nearly as readily. So if you look at that information, it's very difficult to say because independence requires a factorization, but the values can be non-zero.","zh":"协方差矩阵本身并不容易提供这些信息。因此，如果你查看这些信息，就很难判断，因为独立性需要分解因子，但这些值可以是非零的。","start":1390.93,"end":1402.87}],"notes":["本段主要讲解了协方差矩阵的性质，特别是正定矩阵的判断方法。讲者指出，即使矩阵的元素为负数，其特征值仍可能为正，这说明正定性并不等同于所有元素为正。同时，讲者提到，协方差矩阵的逆矩阵包含了变量之间独立性的信息，这是通过逆矩阵中对应元素为零来体现的。","讲者进一步解释了协方差矩阵的逆矩阵在图形模型中的应用，指出逆矩阵中的零元素意味着变量之间独立。这一结论来源于统计学中的一个著名定理，该定理在20世纪70年代末被提出，并推动了图形模型的发展。","讲者还提到，协方差矩阵本身并不直接提供变量独立性的信息，因为独立性需要满足特定的因子化条件，而协方差矩阵中的元素可能非零，因此难以直接判断独立性。","讲者强调，协方差矩阵的逆矩阵在分析变量间关系时具有重要价值，特别是在图形模型中，它能够清晰地反映变量之间的独立性或条件独立性。","讲者还提到，协方差矩阵的逆矩阵的结构在高斯随机模型中具有特殊意义，这在讲者过去的研究中有所涉及，因此他选择分享这一内容。","讲者最后指出，协方差矩阵的逆矩阵在分析变量独立性时比协方差矩阵本身更为直接，因为独立性需要满足特定的数学条件，而逆矩阵能够更清晰地反映这些条件。"],"formulas":[],"uncertainties":["Can't really define that when you get above 2","because you get these kind of"],"diagram":"none","start":1224.18,"end":1402.87,"asr_flags":[117],"math_clarifications":["协方差为零仅表示两个随机变量不相关，但不意味着它们独立。独立性需要更严格的条件，如联合分布等于边缘分布的乘积。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":55,"raw_segments":[{"start":1224.18,"text":"And, yeah, we're in good shape."},{"start":1226.18,"text":"Okay?"},{"start":1226.58,"text":"Entries can be, oh that's one thing I want to say, sorry. Entries can be"},{"start":1229.92,"text":"negative, but the eigenvalues are positive. Positive eigenvalues do not"},{"start":1233.94,"text":"mean that all the entries are positive. People get confused. All right, controls"},{"start":1241.78,"text":"the shape, size, and orientation of the Gaussian contours. Please."},{"start":1247.54,"text":"Right, so in particular when you have a diagonal matrix because those"},{"start":1252.92,"text":"are the products of the eigenvalues, you do have to do it. And even individually"},{"start":1256.04,"text":"individually, they are the variance of that individual element, which will also be non-negative."},{"start":1260.1,"text":"So they will be positive in these kind of matrices."},{"start":1262.58,"text":"One test that you can kind of think about is diagonal dominance."},{"start":1265.6,"text":"So this is a quick way if you were looking at a matrix to tell, which is if you look"},{"start":1269.1,"text":"at the entries and all the other entries are smaller than the square of that entry, then"},{"start":1273.26,"text":"you're looking at a positive definite matrix."},{"start":1275.46,"text":"Yeah."},{"start":1276.04,"text":"Wonderful question."},{"start":1276.82,"text":"You guys got this perfectly."},{"start":1279.48,"text":"Awesome."},{"start":1280.08,"text":"But already in two, we're starting to see positive versus negative correlation, which"},{"start":1283.38,"text":"which refers to the off-diagonal entries."},{"start":1286.34,"text":"Can't really define that when you get above 2"},{"start":1288.1,"text":"because you get these kind of"},{"start":1291.48,"text":"Okay, actually, you know, there's one lecture which I did, which I'm not going to give,"},{"start":1294.56,"text":"but I will just tell you one piece about it. The inverse of these matrices, especially the"},{"start":1299.44,"text":"inverse of Gaussian matrices, have all kinds of interesting structure. In particular, if you"},{"start":1303.14,"text":"invert a matrix, I'll just leave this as a challenge problem. Maybe I can write up how you"},{"start":1306.42,"text":"prove it. It turns out if there are zeros in the inverse, that actually means the two variables"},{"start":1310.68,"text":"are independent. Okay, it's interesting. The actual covariance matrix doesn't have that"},{"start":1317.58,"text":"that information. The inverse does. That's why the inverse is in the formula. You can just write out"},{"start":1321.88,"text":"what I'm saying from that. Anyway, this is like what if you take graphical models, this is basically"},{"start":1326.44,"text":"what it's using. It's called Clifford-Hammerley theory. Doesn't matter for now. Anyway, but it's"},{"start":1330.86,"text":"useful. Useful to know. Okay, so changing mu shifts the center, and the shape stays the same. Okay."},{"start":1338.34,"text":"All right, so what we're going to do right now, please."},{"start":1340.38,"text":"Please."},{"start":1342.62,"text":"the inverse covariance matrix"},{"start":1344.9,"text":"has information about whether or not"},{"start":1346.78,"text":"two variables are independent?"},{"start":1348.66,"text":"Oh, it's easiest to read in that matrix."},{"start":1350.62,"text":"Yeah, great question."},{"start":1351.4,"text":"So it's not that it's only there."},{"start":1352.6,"text":"Clearly, information is summarized"},{"start":1354.02,"text":"both in the mean and the covariance,"},{"start":1355.5,"text":"but it's actually transparent."},{"start":1357.26,"text":"And this is maybe a throwaway comment"},{"start":1358.6,"text":"that I shouldn't have made and just kept to myself."},{"start":1360.34,"text":"So apologies, but I'll explain it."},{"start":1362.12,"text":"If you take the inverse and you look where xi and xj are"},{"start":1366.76,"text":"independent, the inverse entry will be 0."},{"start":1368.94,"text":"And this is a very famous theorem from stats from the late 70s, which gave rise to things"},{"start":1374.02,"text":"called graphical models, where you write down which things are independent and which are"},{"start":1377.5,"text":"conditionally independent."},{"start":1378.52,"text":"And this is just a beautiful bit of structure that happens to be lurking in Gaussian random"},{"start":1383.04,"text":"models, which in a past life I studied."},{"start":1
