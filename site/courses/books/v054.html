ypothesize a forward model, then we invert it. Perhaps not surprisingly, this is the distribution for the elephant features. The big difference is right here. They have different means. We wanted to wiggle the smallest amount possible."},{"start":1523.34,"text":"That's pedagogical, not necessary."},{"start":1525.58,"text":"That's what GDA does."},{"start":1527.9,"text":"Okay."},{"start":1530.54,"text":"So the takeaway assumption is the two classes share the same covariance,"},{"start":1533.76,"text":"but they have different means, and now we want to find those means from data."},{"start":1538.92,"text":"Okay, so let's write out the distributions."},{"start":1541.08,"text":"So here's the class prior."},{"start":1542.64,"text":"It says we're in the class with probability phi,"},{"start":1547.24,"text":"and we're in the other class with 1 minus phi,"},{"start":1549.54,"text":"because it's Bernoulli."},{"start":1553.56,"text":"Here are the class conditional densities."},{"start":1555.72,"text":"This is the next phase."},{"start":1557.18,"text":"This is, say, for example, the cat."},{"start":1559.14,"text":"Why do I know it's the cat?"},{"start":1560.2,"text":"Well, it's y given 0."},{"start":1563.08,"text":"And then I have mu 0, mu 0."},{"start":1565.08,"text":"Everything else is going to be the same when"},{"start":1566.5,"text":"I look at the elephant in a second."},{"start":1569.14,"text":"So far, so good?"},{"start":1569.98,"text":"Please."},{"start":1571.64,"text":"If I remember, if you have, like, the double circles"},{"start":1576.0,"text":"and like the .."},{"start":1577.26,"text":"So if you have the same covariates,"},{"start":1578.96,"text":"maybe if you send those over, they have to be the same shape."},{"start":1581.56,"text":"Yeah, exactly right."}],"speech_gaps":[],"frame":"../frames/v054/009.webp","frame_time":1415.31},{"title":"高斯判别分析中的协方差与均值假设","segments":[{"id":168,"text":"Let me go back to that for one second just so I can show it to you. How do I do this?"},{"id":169,"text":"I know why it's not working. Got it. It's 121. This is it."},{"id":170,"text":"So what I'm saying here, this diagram did it implicitly. These contours and these contours"},{"id":171,"text":"are meant to be the same because the covariance is the same. So both their orientation, how they're"},{"id":172,"text":"rotated, and the strength, the size of the principal and the other axes are the same"},{"id":173,"text":"for both of them. And what we're trying to find are just these two points star,"},{"id":174,"text":"Awesome question. So the question is, this seems like a ridiculous assumption. I know you didn't say that, but fine. This seems like a ridiculous assumption. Like clearly the elephants have different variants than the cats. And I would say, you're right. But it's a question for which, what are we modeling in this exercise? And right now we're modeling that they have about the same variance. There exists some variance that we're going to fit. That's the same across both, which we're going to use. And you'll see how this falls out in the distance. We'll see in a little bit."},{"id":175,"text":"exactly for the reason you just asked. What if I want to have different covariance? It's going to require a couple of extra lines that we put into the estimation procedure that we have. And so yes, you could model that. But it's a modeling choice. You may decide it's not worth it. And by the way, fitting the covariance is not cheap. It's got a lot of parameters, right? If you have a really high dimensional feature vector, like d is very, very large, then the covariance is d squared. Now it's like d choose 2 over 1 because this is the symmetry assumption, right? You don't have to do things below that."},{"id":176,"text":"exactly for the reason you just asked. What if I want to have different covariance? It's going to require a couple of extra lines that we put into the estimation procedure that we have. And so yes, you could model that. But it's a modeling choice. You may decide it's not worth it. And by the way, fitting the covariance is not cheap. It's got a lot of parameters, right? If you have a really high dimensional feature vector, like d is very, very large, then the covariance is d squared. Now it's like d choose 2 over 1 because this is the symmetry assumption, right? You don't have to do things below that."},{"id":177,"text":"But there's still a lot more parameters. And the question is, is it worth it? And in many applications, the answer is maybe not. And so we're going to start with this one first. Wonderful question. Okay. Okay. All right. We're back here. Okay. All right. These are phenomenal questions. Please keep them coming. All right. Now..."},{"id":178,"text":"Notice that because of this kind of cooking show and was highlighted that we're only changing this one mean, all that's changed are the entries of mu here, the means. But otherwise, these two distributions look the same. The other way they're asymmetric is this. We allow to have many more cats and many more elephants. Let's imagine you had a data set. Why would that happen intuitively? Let's imagine you have a data set where you have a million cats and one elephant."},{"id":179,"text":"That was what you saw. The ratio is a million to one. So intuitively, if it's on the border."},{"id":180,"text":"between the elephant size and the cat size, you're probably going to think it's a cat because you're like, oh, there's almost always cats. If it's even remotely unlikely, that weighting between the two things will come out through Bayes' rule. And so pay attention to that. So that's the one kind of non-trivial thing that's happening here. Or I say the two non-trivial things are the means are different and we allow the population sizes to be different. And that's the whole model."}],"notes":["本段讨论了高斯判别分析中协方差矩阵的假设，即两个类别的协方差矩阵相同。这是模型的一个关键假设，但被指出可能不合理，例如大象和猫的变异可能不同。然而，这种假设简化了模型，使得参数估计更加容易。讲者提到，如果允许不同的协方差矩阵，需要在估计过程中增加额外的步骤，但这也增加了模型的复杂性和计算成本。","讲者进一步解释了在高维数据中，协方差矩阵的参数数量会显著增加，例如当特征维度d很大时，协方差矩阵的参数数量为d²。因此，是否采用这种更复杂的模型取决于具体应用场景，通常在实际应用中可能不值得。","此外，讲者还讨论了在高斯判别分析中，除了均值不同外，允许不同类别的样本数量不同。这种差异会影响贝叶斯规则中的权重，从而影响分类结果。例如，当一个类别样本数量远多于另一个类别时，即使样本特征相似，分类器也会倾向于将新样本归为样本数量较多的类别。","讲者通过一个例子说明了这种现象：假设数据集中有100万只猫和1只大象，那么即使新样本的特征在大象和猫之间，分类器也会倾向于将其归为猫，因为猫的样本数量远多于大象。这种现象是贝叶斯规则中先验概率影响分类结果的体现。","最后，讲者指出，高斯判别分析模型的核心假设包括：两个类别的协方差矩阵相同，均值不同，以及样本数量可能不同。这些假设使得模型在参数估计和分类过程中具有一定的简化和可解释性。","讲者鼓励学生继续提问，并强调了在实际应用中，模型选择和假设的合理性是需要权衡的，特别是在高维数据和复杂场景下。"],"formulas":[{"latex":"d^2","symbols":"特征维度d的平方","explanation":"保持原式，d的平方是正确的数学表达，用于表示协方差矩阵的参数数量。","evidence":"Awesome question. So the question is, this seems like a ridiculous assumption. I know you didn't say that, but fine. This seems like a ridiculous assumption. Like clearly the elephants have different variants than the cats. And I would say, you're right. But it's a question for which, what are we modeling in this exercise? And right now we're modeling that they have about the same variance. There exists some variance that we're going to fit. That's the same across both, which we're going to use. And you'll see how this falls out in the distance. We'll see in a little bit."}],"uncertainties":["cooking show"],"diagram":"none","start":1582.48,"end":1758.29,"asr_flags":[],"math_clarifications":["原文提到在对称性假设下，协方差矩阵的参数数量为d^2，但未明确说明组合数d choose 2与该参数数量的关系，因此无法核定该公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1582.48,"text":"Let me go back to that for one second just so I can show it to you. How do I do this?"},{"start":1588.44,"text":"I know why it's not working. Got it. It's 121. This is it."},{"start":1594.62,"text":"So what I'm saying here, this diagram did it implicitly. These contours and these contours"},{"start":1600.1,"text":"are meant to be the same because the covariance is the same. So both their orientation, how they're"},{"start":1605.6,"text":"rotated, and the strength, the size of the principal and the other axes are the same"},{"start":1611.44,"text":"for both of them. And what we're trying to find are just these two points star,"},{"start":1615.22,"text":"the porn star and the gray star."},{"start":1622.06,"text":"Awesome question. So the question is, this seems like a ridiculous assumption. I know you didn't say that, but fine. This seems like a ridiculous assumption. Like clearly the elephants have different variants than the cats. And I would say, you're right. But it's a question for which, what are we modeling in this exercise? And right now we're modeling that they have about the same variance. There exists some variance that we're going to fit. That's the same across both, which we're going to use. And you'll see how this falls out in the distance. We'll see in a little bit."},{"start":1645.18,"text":"exactly for the reason you just asked. What if I want to have different covariance? It's going to require a couple of extra lines that we put into the estimation procedure that we have. And so yes, you could model that. But it's a modeling choice. You may decide it's not worth it. And by the way, fitting the covariance is not cheap. It's got a lot of parameters, right? If you have a really high dimensional feature vector, like d is very, very large, then the covariance is d squared. Now it's like d choose 2 over 1 because this is the symmetry assumption, right? You don't have to do things below that."},{"start":1675.18,"text":"But there's still a lot more parameters. And the question is, is it worth it? And in many applications, the answer is maybe not. And so we're going to start with this one first. Wonderful question. Okay. Okay. All right. We're back here. Okay. All right. These are phenomenal questions. Please keep them coming. All right. Now..."},{"start":1699.25,"text":"Notice that because of this kind of cooking show and was highlighted that we're only changing this one mean, all that's changed are the entries of mu here, the means. But otherwise, these two distributions look the same. The other way they're asymmetric is this. We allow to have many more cats and many more elephants. Let's imagine you had a data set. Why would that happen intuitively? Let's imagine you have a data set where you have a million cats and one elephant."},{"start":1727.15,"text":"That was what you saw. The ratio is a million to one. So intuitively, if it's on the border."},{"start":1734.23,"text":"between the elephant size and the cat size, you're probably going to think it's a cat because you're like, oh, there's almost always cats. If it's even remotely unlikely, that weighting between the two things will come out through Bayes' rule. And so pay attention to that. So that's the one kind of non-trivial thing that's happening here. Or I say the two non-trivial things are the means are different and we allow the population sizes to be different. And that's the whole model."}],"speech_gaps":[],"frame":"../frames/v054/010.webp","frame_time":1594.48},{"title":"高斯判别分析中的假设与模型能力","segments":[{"id":181,"text":"Please. Awesome question. Yeah, so the question is, do you assume if you're using Bayes' rule implicitly that this now is a higher assumption? So what are we assuming carries over? And we're really making some pretty strong assumptions here in terms of what carries over. But again, remember, they're not true or false. They're like, how bad are they? They're always going to be bad, but how bad are they?"},{"id":182,"text":"So if, for example, we trained on a very skewed data set where we have that million cats and that one elephant, and then at test time, we're shown cats and elephants from a population that are effectively the same, we're going to make errors. We're going to make some class of errors when we get those elephants and cats that we're going to always assign in this example or more frequently assign them to the cat class, when honestly, we should have been more open-minded that they're just really small elephants."},{"id":183,"text":"The other here is we have to assume that the means that we observe are somehow concentrating. There's a fancy word that basically means that what we're assuming in the distribution is we've seen enough to estimate these parameters appropriately. That means that our model, for example, even if it were shown a billion more elephants, it doesn't have the resolution potentially to move the center too much. It's not going to make too much of a difference. So the other implicit assumption in there is how much data do we have to actually learn from? And then to what extent does it count?"},{"id":184,"text":"carry over. But those are the things that we're assuming. We assume that the training and test data sets are representative in that way. Wonderful points. Those are exactly the right questions to ask. What am I assuming about my train to test time? And then what capacity of model am I using, and why am I doing that? These are the absolute core questions in machine learning. Awesome. More questions? Please. There are maybe more caps than there are elephants. That's security ."},{"id":185,"text":"It could, right? So the question is, where does that come up here? It comes up effectively in this class probability. So if you imagine, so the question is, what if there are a lot more cats? If there are a lot more cats, as we said, we're going to come out with a probability that we're in class. Our prior distribution that's in the class is just going to be a lot harder. That means intuitively, we should expect to have to take more evidence, all things being equal, that we're going to conclude a given point is an elephant. And although Bayes' rule, I think, when you kind of learn this stuff, feels like some mechanically strange... rule. That's the magic that it's doing. It's telling you how to weight those two evidence pieces in a Bayesian optimal way. Too much words. Just a fine way. It's a rule to do it."},{"id":186,"text":"rule. That's the magic that it's doing. It's telling you how to weight those two evidence pieces in a Bayesian optimal way. Too much words. Just a fine way. It's a rule to do it. Perfect. Good questions. Others? Fantastic, folks. All right. Let's keep going. All right. Oh, I should have just scrolled to the next chart. I'm sorry. That was my mistake. You were asking about this question. I was right here. All right."}],"notes":["本段讨论了高斯判别分析中隐含的假设，特别是关于数据集的代表性以及模型对参数估计的依赖性。讲者指出，模型假设训练数据和测试数据具有代表性，且在数据量足够时，模型能够准确估计参数。然而，模型的分辨率有限，即使在数据量增加的情况下，参数估计的变动也可能有限。","讲者进一步解释了先验分布对分类结果的影响，特别是在类别不平衡的情况下，如猫和大象的分布差异。当某一类样本数量远多于另一类时，模型的先验分布会偏向于该类，从而影响分类结果。","讲者提到贝叶斯规则的作用，即如何在分类过程中合理地权衡先验和似然信息。贝叶斯规则通过一种最优的方式，将先验和证据结合起来，从而做出分类决策。","讲者强调了模型容量和数据量之间的关系，指出模型需要足够的数据来学习并准确估计参数。同时，模型的容量决定了其对数据变化的敏感程度，即模型是否能够捕捉到数据中的细微差异。","讲者还提到，贝叶斯规则虽然在学习过程中可能显得机械或复杂，但其核心在于提供一种系统的方法来处理不确定性，从而在分类任务中做出最优决策。","最后，讲者指出，这些假设和问题构成了机器学习的核心，即模型在训练和测试阶段的假设，以及模型容量的选择，都是构建有效学习系统的关键因素。"],"formulas":[],"uncertainties":["carry over"],"diagram":"none","start":1759.2,"end":1922.04,"asr_flags":[],"raw_segments":[{"start":1759.2,"text":"Please. Awesome question. Yeah, so the question is, do you assume if you're using Bayes' rule implicitly that this now is a higher assumption? So what are we assuming carries over? And we're really making some pretty strong assumptions here in terms of what carries over. But again, remember, they're not true or false. They're like, how bad are they? They're always going to be bad, but how bad are they?"},{"start":1781.9,"text":"So if, for example, we trained on a very skewed data set where we have that million cats and that one elephant, and then at test time, we're shown cats and elephants from a population that are effectively the same, we're going to make errors. We're going to make some class of errors when we get those elephants and cats that we're going to always assign in this example or more frequently assign them to the cat class, when honestly, we should have been more open-minded that they're just really small elephants."},{"start":1806.06,"text":"That can definitely happen. The other here is we have to assume that the means that we observe are somehow concentrating. There's a fancy word that basically means that what we're assuming in the distribution is we've seen enough to estimate these parameters appropriately. That means that our model, for example, even if it were shown a billion more elephants, it doesn't have the resolution potentially to move the center too much. It's not going to make too much of a difference. So the other implicit assumption in there is how much data do we have to actually learn from? And then to what extent does it count?"},{"start":1835.66,"text":"carry over. But those are the things that we're assuming. We assume that the training and test data sets are representative in that way. Wonderful points. Those are exactly the right questions to ask. What am I assuming about my train to test time? And then what capacity of model am I using, and why am I doing that? These are the absolute core questions in machine learning. Awesome. More questions? Please. There are maybe more caps than there are elephants. That's security ."},{"start":1866.97,"text":"It could, right? So the question is, where does that come up here? It comes up effectively in this class probability. So if you imagine, so the question is, what if there are a lot more cats? If there are a lot more cats, as we said, we're going to come out with a probability that we're in class. Our prior distribution that's in the class is just going to be a lot harder. That means intuitively, we should expect to have to take more evidence, all things being equal, that we're going to conclude a given point is an elephant. And although Bayes' rule, I think, when you kind of learn this stuff, feels like some mechanically strange..."},{"start":1896.42,"text":"rule. That's the magic that it's doing. It's telling you how to weight those two evidence pieces in a Bayesian optimal way. Too much words. Just a fine way. It's a rule to do it. Perfect. Good questions. Others? Fantastic, folks. All right. Let's keep going. All right. Oh, I should have just scrolled to the next chart. I'm sorry. That was my mistake. You were asking about this question. I was right here. All right."}],"speech_gaps":[],"frame":"../frames/v054/011.webp","frame_time":1771.2},{"title":"高斯判别分析与概率模型","segments":[{"id":187,"text":"So this is what we're trying to do. We're trying to get mu0, the cats, this character, mu1, the elephants, this character, and just get the means. I raised a bunch of issues about this, so I'm not going to go through it again, but please feel free to do it. The fact that there's shared covariance means that you could cut and paste and recolor these ellipses that are around each of the means. Cool? All right, so we need to learn these four things. The class prior, what fraction are elephants, and implicitly, what fraction are cats, since we only have two classes."},{"id":188,"text":"mu0, the mean of the cat features, mu1, the mean of the elephant features, and sigma, their shared covariance matrix. Now, compare this with logistic regression. Here, we had only these D plus 1 features. GDA models much, much more structure. And we're paying for that structure, as I alluded to earlier."},{"id":189,"text":"We're finding the means of each of these classes, okay?"},{"id":190,"text":"Those are like not very different."},{"id":191,"text":"Those are like the thetas we had from before, roughly, right?"},{"id":192,"text":"They're about the same."},{"id":193,"text":"They are the same size and shape."},{"id":194,"text":"Maybe differ by one because we don't have the plus one."},{"id":195,"text":"And we're also going to get this covariance matrix."},{"id":196,"text":"Why do we need..."},{"id":197,"text":"I don't know what I just did."},{"id":198,"text":"Took a picture."},{"id":199,"text":"I want to remember this moment forever, I guess."},{"id":200,"text":"What the heck?"},{"id":201,"text":"All right, good."},{"id":202,"text":"I didn't know what gesture that is."},{"id":203,"text":"So if we do that again, we'll all be surprised and excited, all right?"},{"id":204,"text":"Okay, so this covariance, why do we need that intuitively? Why can't we just use the means?"},{"id":205,"text":"Exactly right. The point is you can't get the shape to get a distribution. You have to when"},{"id":206,"text":"you have two points that are there, like your two means, you want to have some way of a point"},{"id":207,"text":"in the middle, being able to assign the probability to it so we can run our probabilistic estimate."},{"id":208,"text":"You could just take a distance, a flat distance. That would be what you would do if you did the"},{"id":209,"text":"identity function. But since we want this probabilistic interpretation, that identity"},{"id":210,"text":"function is just a standard Gaussian. That's what it boils down to. We want it to normalize."},{"id":211,"text":"We want it to tail off. We want it to be bounded, all the rest. We don't have to decide. The Gaussian"},{"id":212,"text":"doesn't make us decide that it only works in a fixed range. You could say, I only want a"},{"id":213,"text":"distribution over distances 0 to 5."},{"id":214,"text":"All kinds of weird things. The Gaussian is just kind of nice and simple."},{"id":215,"text":"But it lets us then still"},{"id":216,"text":"have a valid probability distribution."},{"id":217,"text":"Okay."},{"id":218,"text":"Alright."},{"id":219,"text":"That was a potentially low class segue into maximum likelihood. The reason we needed the sigmas and all the rest is so we could have likelihood functions and run the probabilistic machinery. All right. All right. Here's that probabilistic machinery. You've seen this before. All right. Given data, XIYI, we're going to write a joint likelihood function."}],"notes":["本段讨论了高斯判别分析（GDA）中协方差矩阵的必要性。讲者指出，仅使用均值无法捕捉数据分布的形状，因此需要协方差矩阵来描述数据的分布特性。讲者提到，如果仅使用均值，无法对中间点进行概率分配，从而无法进行概率估计。因此，协方差矩阵是构建概率模型的关键部分。","讲者进一步解释了为什么需要使用高斯分布来建模数据。他指出，使用高斯分布可以自然地引入概率解释，例如分布的尾部衰减和有界性。高斯分布的简单性和灵活性使其成为建模数据分布的首选方法。","讲者提到，高斯分布不需要人为限制其作用范围，这与某些其他分布不同。他指出，高斯分布可以自然地处理各种距离范围，而无需人为设定边界。","讲者强调，使用高斯分布可以确保概率分布的有效性。即使数据分布复杂，高斯分布也能提供一个合理的概率模型，从而支持后续的统计推断和机器学习任务。","讲者最后提到，高斯分布的使用使得模型能够处理各种数据分布情况，而不仅仅是固定范围内的数据。这种灵活性是高斯判别分析的一个重要优势。"],"formulas":[],"uncertainties":["you have two points that are there, like your two means, you want to have some way of a point","you could just take a distance, a flat distance. That would be what you would do if you did the","that identity function is just a standard Gaussian. That's what it boils down to. We want it to normalize."],"diagram":"none","start":1923.05,"end":2100.07,"asr_flags":[],"raw_segments":[{"start":1923.05,"text":"So this is what we're trying to do. We're trying to get mu0, the cats, this character, mu1, the elephants, this character, and just get the means. I raised a bunch of issues about this, so I'm not going to go through it again, but please feel free to do it. The fact that there's shared covariance means that you could cut and paste and recolor these ellipses that are around each of the means. Cool? All right, so we need to learn these four things. The class prior, what fraction are elephants, and implicitly, what fraction are cats, since we only have two classes."},{"start":1955.42,"text":"mu0, the mean of the cat features, mu1, the mean of the elephant features, and sigma, their shared covariance matrix. Now, compare this with logistic regression. Here, we had only these D plus 1 features. GDA models much, much more structure. And we're paying for that structure, as I alluded to earlier."},{"start":1985.41,"text":"We're finding the means of each of these classes, okay?"},{"start":1988.35,"text":"Those are like not very different."},{"start":1989.99,"text":"Those are like the thetas we had from before, roughly, right?"},{"start":1992.13,"text":"They're about the same."},{"start":1992.71,"text":"They are the same size and shape."},{"start":1993.73,"text":"Maybe differ by one because we don't have the plus one."},{"start":1997.45,"text":"And we're also going to get this covariance matrix."},{"start":1999.57,"text":"Why do we need..."},{"start":2000.43,"text":"I don't know what I just did."},{"start":2001.69,"text":"Took a picture."},{"start":2002.51,"text":"I want to remember this moment forever, I guess."},{"start":2006.15,"text":"What the heck?"},{"start":2006.97,"text":"All right, good."},{"start":2007.97,"text":"I didn't know what gesture that is."},{"start":2010.13,"text":"So if we do that again, we'll all be surprised and excited, all right?"},{"start":2013.27,"text":"Okay, so this covariance, why do we need that intuitively? Why can't we just use the means?"},{"start":2030.79,"text":"Exactly right. The point is you can't get the shape to get a distribution. You have to when"},{"start":2035.67,"text":"you have two points that are there, like your two means, you want to have some way of a point"},{"start":2040.47,"text":"in the middle, being able to assign the probability to it so we can run our probabilistic estimate."},{"start":2045.83,"text":"You could just take a distance, a flat distance. That would be what you would do if you did the"},{"start":2051.01,"text":"identity function. But since we want this probabilistic interpretation, that identity"},{"start":2054.57,"text":"function is just a standard Gaussian. That's what it boils down to. We want it to normalize."},{"start":2059.55,"text":"We want it to tail off. We want it to be bounded, all the rest. We don't have to decide. The Gaussian"},{"start":2063.71,"text":"doesn't make us decide that it only works in a fixed range. You could say, I only want a"},{"start":2068.79,"text":"distribution over distances 0 to 5."},{"start":2070.69,"text":"All kinds of weird things. The Gaussian is just kind of nice and simple."},{"start":2072.99,"text":"But it lets us then still"},{"start":2074.39,"text":"have a valid probability distribution."},{"start":2077.41,"text":"Okay."},{"start":2078.15,"text":"Alright."},{"start":2080.49,"text":"That was a potentially low class segue into maximum likelihood. The reason we needed the sigmas and all the rest is so we could have likelihood functions and run the probabilistic machinery. All right. All right. Here's that probabilistic machinery. You've seen this before. All right. Given data, XIYI, we're going to write a joint likelihood function."}],"speech_gaps":[{"start":2023.408,"end":2025.68},{"start":2028.4,"end":2030.39}],"frame":"../frames/v054/012.webp","frame_time":1935.05},{"title":"高斯判别分析中的联合分布与模型构建","segments":[{"id":220,"text":"Here's our likelihood function. What is it doing? It's taking all the parameters that are in there"},{"id":221,"text":"and it's scoring them in some way according to that model. And I've been a little bit remiss"},{"id":222,"text":"here. I didn't write all the semicolons with all the parameters on the side. I warned you"},{"id":223,"text":"about this in advance, but be aware these probabilities are with respect to these"},{"id":224,"text":"parameters. Now, why were we able to write them as a product? The IID assumption did a lot of"},{"id":225,"text":"work for us right there, okay? Second one, we did this factorization. Well, this is Bayes' rule,"},{"id":226,"text":"okay? We can do that every time on a term. We don't have to assume anything."},{"id":227,"text":"Okay, so we're going to model the joint distribution P of x, y, not just P of y, x,"},{"id":228,"text":"okay? There is, just as an aside, if you look up in the literature, there are things called"},{"id":229,"text":"energy models, which do model this directly, especially for things like diffusion, which is"},{"id":230,"text":"a really popular form of generative models, which we love here at Stanford. And in general,"},{"id":231,"text":"people love them. They make great images and eventually text as well."},{"id":232,"text":"But this is why it's different. You're modeling the whole world."},{"id":233,"text":"And the kind of example I would use is if you trained... Actually, I'm not going to give a"},{"id":234,"text":"confusing example. But PXY is actually modeling the world. You want to model how likely the data"},{"id":235,"text":"are and how likely the labels are together. That's roughly what we're after here. Not"},{"id":236,"text":"modeling just the conditional distribution."},{"id":237,"text":"Okay. Okay, so let's do some arithmetic and some very basic stuff. Okay, so we're going to take"},{"id":238,"text":"logs. Not surprising. Why do we take logs? Because linearity and we turn them into sine."},{"id":239,"text":"We now have these log likelihoods, which we needed everything to be positive on them. So they assign something, which again makes Gaussians nice because they never go identically to zero. So we can do this. Boom, boom. Okay, this is our prior distribution. Okay, so we're going to do the standard thing. So we could solve this with gradient descent. No reason why not. But something magical happens."},{"id":240,"text":"And something magical happens is we can set the derivatives to zero and solve it and get a closed form solution. This isn't necessary for Gaussian models, but GDA does have this nice feature. And that is a feature worth pointing out because often people would use these generative models in situations when they wanted to compute something relatively cheaply."},{"id":241,"text":"And we'll see probably the archetype of this, something called naive Bayes at the end of this lecture, which is a very good first model. It's a count-based model. It's a very nice model that you can use, and it's dirt cheap to build and evaluate. OK, so let's find those closed form solutions. All right, here's the class prior. So let me see. So how do we estimate the class prior? We just count. This."},{"id":242,"text":"You can look."},{"id":243,"text":"This is exactly the maximum likelihood estimate."},{"id":244,"text":"You'll see later that sometimes we'll do a very sophisticated"},{"id":245,"text":"trick."},{"id":246,"text":"It has a fancy name, Laplace priors."},{"id":247,"text":"Does anyone know what a Laplace priors is?"},{"id":248,"text":"Show of hands."},{"id":249,"text":"You add one."},{"id":250,"text":"That's what you do."},{"id":251,"text":"You add in some debt accounts."}],"notes":["本段主要讲解了高斯判别分析（GDA）中联合分布P(x,y)的建模方法，强调了与仅建模条件分布P(y|x)的不同之处。教授指出，联合分布P(x,y)直接建模了数据和标签的联合概率，这与能量模型（energy models）类似，尤其在生成模型中广泛应用，如扩散模型。","教授提到，使用联合分布P(x,y)建模时，需要考虑独立同分布（IID）假设，这使得概率可以表示为乘积形式。此外，教授还提到，通过取对数可以将乘积转化为求和，从而简化计算。"],"formulas":[],"uncertainties":["log likelihoods, which we needed everything to be positive on them. So they assign something, which again makes Gaussians nice because they never go identically to zero."],"diagram":"none","start":2101.3,"end":2278.28,"asr_flags":[],"raw_segments":[{"start":2101.3,"text":"Here's our likelihood function. What is it doing? It's taking all the parameters that are in there"},{"start":2106.2,"text":"and it's scoring them in some way according to that model. And I've been a little bit remiss"},{"start":2112.08,"text":"here. I didn't write all the semicolons with all the parameters on the side. I warned you"},{"start":2115.96,"text":"about this in advance, but be aware these probabilities are with respect to these"},{"start":2119.52,"text":"parameters. Now, why were we able to write them as a product? The IID assumption did a lot of"},{"start":2129.62,"text":"work for us right there, okay? Second one, we did this factorization. Well, this is Bayes' rule,"},{"start":2135.1,"text":"okay? We can do that every time on a term. We don't have to assume anything."},{"start":2140.88,"text":"Okay, so we're going to model the joint distribution P of x, y, not just P of y, x,"},{"start":2147.72,"text":"okay? There is, just as an aside, if you look up in the literature, there are things called"},{"start":2151.68,"text":"energy models, which do model this directly, especially for things like diffusion, which is"},{"start":2156.4,"text":"a really popular form of generative models, which we love here at Stanford. And in general,"},{"start":2161.96,"text":"people love them. They make great images and eventually text as well."},{"start":2165.92,"text":"But this is why it's different. You're modeling the whole world."},{"start":2169.18,"text":"And the kind of example I would use is if you trained... Actually, I'm not going to give a"},{"start":2173.02,"text":"confusing example. But PXY is actually modeling the world. You want to model how likely the data"},{"start":2177.26,"text":"are and how likely the labels are together. That's roughly what we're after here. Not"},{"start":2181.68,"text":"modeling just the conditional distribution."},{"start":2185.8,"text":"Okay. Okay, so let's do some arithmetic and some very basic stuff. Okay, so we're going to take"},{"start":2190.14,"text":"logs. Not surprising. Why do we take logs? Because linearity and we turn them into sine."},{"start":2194.9,"text":"We now have these log likelihoods, which we needed everything to be positive on them. So they assign something, which again makes Gaussians nice because they never go identically to zero. So we can do this. Boom, boom. Okay, this is our prior distribution. Okay, so we're going to do the standard thing. So we could solve this with gradient descent. No reason why not. But something magical happens."},{"start":2217.44,"text":"And something magical happens is we can set the derivatives to zero and solve it and get a closed form solution. This isn't necessary for Gaussian models, but GDA does have this nice feature. And that is a feature worth pointing out because often people would use these generative models in situations when they wanted to compute something relatively cheaply."},{"start":2235.89,"text":"And we'll see probably the archetype of this, something called naive Bayes at the end of this lecture, which is a very good first model. It's a count-based model. It's a very nice model that you can use, and it's dirt ch  compute these derivatives on the population. We're going to solve these things."},{"id":313,"text":"and you're going to have to do that in homeworks and other stuff coming up. So this is not a surprising thing. And you can do all of them. You can do the mu's, you can do the sigma's, you can do it all this way. Now, this is a little bit of extra stuff that I wanted to throw in, just because I wanted to talk about this decision boundary a little bit. So part of this is standard. Part of this, there's one figure that's not. So when you have a new animal, how do you do the prediction?"},{"id":314,"text":"So you take this argmax y hat, take this argmax over all p of x given y. So this means what you're going to do is you're going to take all the labels, and you're going to say, given the data that you've shown me, I think it's very likely that it's an elephant. I think it's less likely that it's a cat. If I had more examples, I would do more examples. But right now, we're doing binary classification."},{"id":315,"text":"Okay? And I just compare those two and take that argmax. And indeed, I get this little function here if I buy Bayes' rules. And I notice, ah, actually, p of x doesn't depend on y directly or shouldn't depend on this directly. So I get this kind of argmax. Okay? This is where the population comes in. This should be doesn't depend on x. Sorry. I'll blame Claude, but it's probably me. Okay? This term goes away. That's what I'm arguing. This is wrong. Okay?"},{"id":316,"text":"Clearly, it depends on the label, right? Like more cats, you're going to be more likely to say there's a cat. Okay, so this is where the decision boundary comes up. Now, what we're going to do is we're going to write out these probability distributions here and try and figure out exactly where the probability that we decide we flip from dog to cat."}],"notes":["本段讨论了高斯判别分析中协方差矩阵不可逆时可能带来的问题。如果协方差矩阵不可逆，那么其逆矩阵不存在，这会导致参数估计无法进行，因为参数估计依赖于协方差矩阵的逆。此外，向量可能位于零空间中，无法唯一确定均值，这使得模型参数不可识别。","讲者提到，如果协方差矩阵不可逆，那么在参数估计过程中，我们无法确定均值的确切位置，因为存在一个维度上的不确定性。这说明了为什么在高斯判别分析中需要假设协方差矩阵是可逆的，以确保模型的可识别性。","讲者进一步指出，这种假设在高斯判别分析中是必要的，因为它允许我们通过最大似然估计来推导参数。这种技术在更复杂的模型中也会被使用，但需要计算这些参数的导数。","讲者提到，这种技术在后续的作业和练习中会反复出现，因此学生需要掌握如何计算这些导数。这表明，高斯判别分析是理解更复杂模型的基础。","讲者还讨论了决策边界的概念，即在给定数据的情况下，如何根据概率分布来判断样本属于哪个类别。决策边界是通过比较不同类别的后验概率来确定的。","最后，讲者指出，决策边界是通过比较不同类别的概率分布来确定的，这涉及到如何根据给定的数据来预测样本的类别。"],"formulas":[],"uncertainties":[],"diagram":"decision","start":2633.89,"end":2810.33,"asr_flags":[],"raw_segments":[{"start":2633.89,"text":"If sigma were not invertible, what would go wrong in that reasoning? Please? The vector here could be in the null space, so it wouldn't exactly be zero. We could only conclude, for example, that xi equals the mu up to some extra term. It wouldn't be identifiable. This gets back to the why are we doing this kind of assumption earlier. Awesome."},{"start":2659.46,"text":"So there'd be an entire one dimension where we couldn't tell where the mu lived, if you like, roughly speaking. OK, cool. And then this is just more of that terrible notation thrown to compute the world's most complicated average. Sound good?"},{"start":2674.76,"text":"Right, so this justifies it though, okay? So why did I do this? Again, so one very grim way to look at this slide is, this is the world's most complicated derivation of computing the world's most complicated average, in which case, like, you know, good for me. But actually, the reason we're doing it this way is that this technique of going from likelihood to parameter, this is a simple case where we started to be able to intuit the answer. We're going to do again and again. As we get to more complicated models, we're going to compute these derivatives on the population. We're going to solve these things."},{"start":2704.26,"text":"and you're going to have to do that in homeworks and other stuff coming up. So this is not a surprising thing. And you can do all of them. You can do the mu's, you can do the sigma's, you can do it all this way. No rk, we got a line between the two of them, which I told you we were trying to avoid."},{"id":322,"text":"What happened here? Okay, so two things that I want to point out. One is..."},{"id":323,"text":"conceptually, we modeled something quite different."},{"id":324,"text":"And I'm gonna show you that actually"},{"id":325,"text":"our conceptual modeling can give"},{"id":326,"text":"different decision surfaces,"},{"id":327,"text":"so give me that in one second."},{"id":328,"text":"I'm also gonna show you one other representative thing,"},{"id":329,"text":"which is this line here,"},{"id":330,"text":"it will turn out that many of the generative models"},{"id":331,"text":"effectively give you the same discriminative line,"},{"id":332,"text":"and that discriminative line is given to you"},{"id":333,"text":"by logistic regression,"},{"id":334,"text":"which is a super interesting point"},{"id":335,"text":"because we had to assume a lot of things"},{"id":336,"text":"to cough this guy out, this generative model, right?"},{"id":337,"text":"We had to assume the covariances were shared,"},{"id":338,"text":"We had to estimate all those parameters. Now, they were cheap to estimate, so that was good,"}],"notes":["本段主要讲解高斯判别分析（GDA）中决策边界的推导过程。讲者提到，当两个高斯分布的协方差矩阵共享时，决策边界会是线性的。这是因为高斯分布的对数概率展开后，二次项会相互抵消，只剩下与均值相关的线性项。这种线性决策边界是GDA的一个重要特性。","讲者通过对比不同模型（如生成模型和判别模型）的决策边界，指出虽然它们的建模方式不同，但有时会得到相同的判别边界。例如，生成模型（如GDA）和判别模型（如逻辑回归）在某些情况下可以得到相同的决策边界。","在推导过程中，讲者强调了协方差矩阵共享的重要性。当协方差矩阵共享时，可以简化模型的参数估计，并且使得决策边界成为线性形式。这与逻辑回归的线性决策边界有相似之处。","讲者提到，虽然生成模型（如GDA）和判别模型（如逻辑回归）在建模方式上不同，但它们在某些情况下可以得到相同的决策边界。这说明了不同模型在特定条件下可能具有相似的预测能力。","最后，讲者强调了决策边界推导过程中的关键点：二次项的抵消、线性项的保留以及共享协方差矩阵对决策边界形状的影响。这些内容为理解GDA的决策边界提供了理论基础。"],"formulas":[],"uncertainties":["sigma xtx kind of terms","this term cancels because it's shared"],"diagram":"none","start":2810.95,"end":2989.2,"asr_flags":[],"math_clarifications":["原始公式中的分母和指数部分存在错误，正确的高斯分布形式应为 \\frac{1}{\\sqrt{2\\pi\\sigma^2}} \\text{exp}(-\\frac{1}{2}(x - μ)^TΣ^{-1}(x - μ))。","部分公式候选未通 ard way. And so we got a score, 0.6 for one, 0.2 for the other. And we got those probabilities and we compared them. And all we looked at to find this line is, where are one of those two probabilities equal? And we said that was the moment that we would flip because we were doing this arg max. We would return the class boundary doing that. Now, we threw away all that information with the probability model."}],"notes":["本段主要讨论高斯判别分析中决策边界的推导过程，强调通过代数运算将非线性项消除，从而得到线性决策边界。讲者承认之前的推导过程不够严谨，但指出其本质是简单的代数操作，最终得到的决策边界是线性的，即超平面。","讲者提到决策边界与逻辑回归的关系，指出两者在决策表面上的相似性，但强调高斯判别分析的决策边界是线性的，而逻辑回归的决策边界是线性或非线性的，取决于模型的结构。","讲者通过一个具体的例子说明如何通过比较两个类别的后验概率来确定决策边界，即当两个概率相等时，该点即为决策边界。这一过程涉及最大后验概率（arg max）的计算。","讲者提到在高斯判别分析中，决策边界是线性的，因为最终的表达式是线性项或仿射项等于常数，这符合超平面的定义。","讲者还提到，虽然高斯判别分析的推导过程可能显得复杂，但其核心思想是通过代数操作简化问题，从而得到线性决策边界。"],"formulas":[],"uncertainties":["the decision matter","the share","the punchline"],"diagram":"none","start":3157.39,"end":3334.32,"asr_flags":[382],"raw_segments":[{"start":3157.39,"text":"How did this happen here? Yeah, so this happened because when I went through this side, I'm going to get this term. I'm going to borrow this term on one side. I'm going to move it to the other side. And I'm going to have a bunch of the linear terms, which I'm also going to separate off in the mu1 and mu2 versions. That's going to give me the right-hand side that's here. And the rest is just algebra, like these guys moved over to this one."},{"start":3185.36,"text":"And I realize this was not a very good derivation because I was planning on trying to skip through"},{"start":3189.82,"text":"it. And I appreciate you calling me out on it. I shouldn't have skipped through it."},{"start":3193.14,"text":"It is in Tang Yu's notes or in the notes written out in full detail. But conceptually,"},{"start":3199.24,"text":"it is just arithmetic. It is just doing a little bit of algebra to move things around"},{"start":3202.94,"text":"and cross them out. And they are actually linear. The most important part I hope to get away from"},{"start":3207.32,"text":"without actually having to do the computation, which was that this term cancels on both sides."},{"start":3211.8,"text":"and so everything else is linear or constant in X. That's the actual message"},{"start":3216.04,"text":"of this and that tells you the decision surface is itself linear because it's"},{"start":3219.92,"text":"then going to be linear term or affine term equal to a constant. That is"},{"start":3226.36,"text":"a line. That's how you define a hyperplane. Cool. Awesome questions. Please."},{"start":3242.32,"text":"Yeah, wonderful question. So I'm going to come to that in one slide,"},{"start":3244.92,"text":"or as I skip to the next slide, and we'll get right there. Wonderful question. Please."},{"start":3254.96,"text":"Wonderful question. So the question is, how does this relate to the logistic regression?"},{"start":3257.96,"text":"And how does this change the decision surface? And both of those things are what we're going"},{"start":3261.42,"text":"to come to in exactly the next slide so give me three slides and let's come back to them these"},{"start":3265.06,"text":"are phenomenal questions they're exactly what's coming next yeah okay so the intuition by the way"},{"start":3271.3,"text":"is it's a line there's some kind of exponential going on underneath the covers we have a log"},{"start":3276.48,"text":"linear model logistic regression is more powerful than you think for log linear models that's kind"},{"start":3280.88,"text":"of the punchline you know it's not a sitcom i can reveal that early all right okay so let's get to"},{"start":3285.88,"text":"to the first question what happens if you don't have a share oh sorry right so"},{"start":3302.32,"text":"the decision matter this means if you remember we're going to do a decision"},{"start":3305.42,"text":"We're going to say, is this particular point more likely a cat or more likely an elephant? And we gave a rule to do that, which is consistent and that we can use, which is this Bayes rule that we ran through the model in a forward way. And so we got a score, 0.6 for one, 0.2 for the other. And we got those probabilities and we compared them. And all we looked at to find this line is, where are one of those two probabilities equal? And we said that was the moment that we would flip because we were doing this arg max. We would return the class boundary doing that. Now, we threw away all that information with the probability model."}],"speech_gaps":[{"start":3232.832,"end":3241.92},{"start":3249.168,"end":3251.312}],"frame":"../frames/v054/019.webp","frame_time":3169.39},{"title":"高斯判别分析与决策边界","segments":[{"id":385,"text":"which maybe we wanted, in which case this is a weird thing to do. But it was meant to highlight two things, which is so far we haven't changed the decision surface from what we did last time. I'm going to show you that we can change it in one second. And then two, I want to relate it to this point about logistic regression because there's a conceptual point underneath that will be more clear later. Wonderful question. Others? Awesome. All right. So here's the decision surface. And the point was made, which was a wonderful point."},{"id":386,"text":"Well, I don't care. So what? I can still write out the decision surface. You just don't have to have the two sigmas cancel out. I can look at some other form there. It's just another quadratic form. I can solve that for zero. It's well-defined and all the rest. And you'd be right. And in particular, what happens is when that sigma term no longer cancels, you get these funny decision boundaries because they're now quadratic."},{"id":387,"text":"And that's kind of interesting because their shapes are different."},{"id":388,"text":"So the left is the linear GDA when you have a decision boundary."},{"id":389,"text":"And the right is called QDA, which is the quadratic discriminant analysis."},{"id":390,"text":"And indeed, that's a totally reasonable thing to do."},{"id":391,"text":"And you can do the entire derivation and how we estimated every piece."},{"id":392,"text":"How would you estimate the means in this model?"},{"id":393,"text":"Well, you already know."},{"id":394,"text":"You estimate the means."},{"id":395,"text":"How would you estimate the covariances?"},{"id":396,"text":"Rather than pooling the data, you would do them separately."},{"id":397,"text":"Everything kind of works out."},{"id":398,"text":"But in this model, I want to point out, if Claude is to be believed and my checking"},{"id":399,"text":"of it is to be believed, these are decision surfaces. You should check that out. You"},{"id":400,"text":"shouldn't trust me or the others. All right, good enough? All right, sure, sure."},{"id":401,"text":"What does it mean that you have a situation where you could have a decision surface with no data points that are there?"},{"id":402,"text":"Oh, we have no data points that are there?"},{"id":403,"text":"What a wonderful question."},{"id":404,"text":"So the observation is, wait, there's this weird thing that's way out from the data set"},{"id":405,"text":"where all of a sudden it's making what looked to be in this setting a pretty unjustified"},{"id":406,"text":"leap because it doesn't have this monotonicity."},{"id":407,"text":"What you'll see when you start to get to decision surfaces that are more complicated, they will"},{"id":408,"text":"have these little knots and we'll come back to exactly that point in classification."},{"id":409,"text":"You're thinking about it in the same way."},{"id":410,"text":"I would point out it's maybe more intuitive, but the same thing happens way off the map"},{"id":411,"text":"over here right which is like when you get way way out from the data you're"},{"id":412,"text":"still using a linear model far from where you intended to use and so in the"},{"id":413,"text":"same way when you're away from all of your data bad things can happen this one"},{"id":414,"text":"just looks a little bit more visually anomalous wonderful insight all right so"},{"id":415,"text":"now for the point about logistic regression which we came to before so"},{"id":416,"text":"what do these things have to do with one"}],"notes":["本段讨论了高斯判别分析（GDA）和二次判别分析（QDA）之间的区别，强调了决策边界的变化。教授指出，GDA在某些情况下可能保持线性决策边界，而QDA则引入了二次形式，导致更复杂的决策边界。这与逻辑回归（logistic regression）的概念联系起来，说明了不同模型在处理分类问题时的差异。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3334.7,"end":3488.51,"asr_flags":[],"raw_segments":[{"start":3334.7,"text":"which maybe we wanted, in which case this is a weird thing to do. But it was meant to highlight two things, which is so far we haven't changed the decision surface from what we did last time. I'm going to show you that we can change it in one second. And then two, I want to relate it to this point about logistic regression because there's a conceptual point underneath that will be more clear later. Wonderful question. Others? Awesome. All right. So here's the decision surface. And the point was made, which was a wonderful point."},{"start":3363.42,"text":"Well, I don't care. So what? I can still write out the decision surface. You just don't have to have the two sigmas cancel out. I can look at some other form there. It's just another quadratic form. I can solve that for zero. It's well-defined and all the rest. And you'd be right. And in particular, what happens is when that sigma term no longer cancels, you get these funny decision boundaries because they're now quadratic."},{"start":3386.15,"text":"And that's kind of interesting because their shapes are different."},{"start":3389.37,"text":"So the left is the linear GDA when you have a decision boundary."},{"start":3392.29,"text":"And the right is called QDA, which is the quadratic discriminant analysis."},{"start":3396.93,"text":"And indeed, that's a totally reasonable thing to do."},{"start":3400.09,"text":"And you can do the entire derivation and how we estimated every piece."},{"start":3403.27,"text":"How would you estimate the means in this model?"},{"start":3405.33,"text":"Well, you already know."},{"start":3406.07,"text":"You estimate the means."},{"start":3407.03,"text":"How would you estimate the covariances?"},{"start":3408.51,"text":"Rather than pooling the data, you would do them separately."},{"start":3411.63,"text":"Everything kind of works out."},{"start":3412.79,"text":"But in this model, I want to point out, if Claude is to be believed and my checking"},{"start":3417.69,"text":"of it is to be believed, these are decision surfaces. You should check that out. You"},{"start":3421.05,"text":"shouldn't trust me or the others. All right, good enough? All right, sure, sure."},{"start":3430.29,"text":"What does it mean that you have a situation where you could have a decision surface with no data points that are there?"},{"start":3439.21,"text":"Oh, we have no data points that are there?"},{"start":3441.37,"text":"What a wonderful question."},{"start":3442.43,"text":"So the observation is, wait, there's this weird thing that's way out from the data set"},{"start":3446.69,"text":"where all of a sudden it's making what looked to be in this setting a pretty unjustified"},{"start":3450.07,"text":"leap because it doesn't have this monotonicity."},{"start":3452.09,"text":"What you'll see when you start to get to decision surfaces that are more complicated, they will"},{"start":3456.99,"text":"have these little knots and we'll come back to exactly that point in classification."},{"start":3460.37,"text":"You're thinking about it in the same way."},{"start":3461.95,"text":"I would point out it's maybe more intuitive, but the same thing happens way off the map"},{"start":3466.23,"text":"over here right which is like when you get way way out from the data you're"},{"start":3469.61,"text":"still using a linear model far from where you intended to use and so in the"},{"start":3474.13,"text":"same way when you're away from all of your data bad things can happen this one"},{"start":3477.77,"text":"just looks a little bit more visually anomalous wonderful insight all right so"},{"start":3484.25,"text":"now for the point about logistic regression which we came to before so"},{"start":3487.31,"text":"what do these things have to do with one"}],"speech_gaps":[],"frame":"../frames/v054/020.webp","frame_time":3346.7},{"title":"高斯判别分析与逻辑回归的关系","segments":[{"id":417,"text":"All right, so this is going to be a derivation. That's basically what it's going to show, is we're going to try and derive something that looks like the probability that y equals 1 given x, the discriminative version of what we did. We've been doing kind of the other way around, right? We were trying to get to the other way around. So we want to go the other way around, sorry, over here. So how do we get there? This is the discriminative one."},{"id":418,"text":"Apparently, Claude decided it didn't want to do the algebra. No. So there is some algebra that can be done. And the basic message, though, maybe it's a homework problem. I don't remember. But either way, I mean, you can just see how to do it. It's hopefully not very challenging. Maybe you'll believe me. Maybe you won't. And we'll all be richer for it. Anyway, so the point is, is you'll have this. You can rewrite this in Bayes' rule. And that Bayes' rule allows you to write this probability of y given x, which is the discriminative rule. And that discriminative rule has exactly this functional form."},{"id":419,"text":"Now, what that means, it doesn't mean that it's exactly the same. It means that there is some logistic regressor that captures that decision surface. And so in a weak sense before, as you talked about, there's some line that given those features fits them. In some way, this is a tautology. I don't really need to prove it to you because I already showed that there was a line that we saw before. And clearly, that decision line can be recognized by some kind of linear model. Might as well be this one."},{"id":420,"text":"What the content is, is that the probabilities on both sides are the same. And that also shouldn't be too much of a stretch, but you should go through it. All right. Okay, so basically, GDA implies that logistic regression has the same, in a fancy terminology, posterior distribution has this sigmoidal form. Okay."},{"id":421,"text":"Shared parameters, all the rest. And so it turns out that many different generative assumptions on your data lead to the same discriminative model, logistic regression. And it's not a coincidence. The reason it's not a coincidence is if your data fundamentally at the end when you do a classification rule is separated by a line."},{"id":422,"text":"Shared parameters, all the rest. And so it turns out that many different generative assumptions on your data lead to the same discriminative model, logistic regression. And it's not a coincidence. The reason it's not a coincidence is if your data fundamentally at the end when you do a classification rule is separated by a line."}],"notes":["本段主要讲解高斯判别分析（GDA）与逻辑回归之间的关系。讲者指出，GDA推导出的判别模型实际上可以表示为逻辑回归的形式，即后验概率具有S型（sigmoidal）函数形式。这表明，即使数据是通过生成模型（如高斯分布）生成的，最终的判别模型仍可以是逻辑回归。","讲者提到，GDA推导出的判别模型与逻辑回归之间的关系并非巧合，而是因为当数据在分类时被一条线分隔时，逻辑回归能够表示这种决策边界。这表明，逻辑回归可以捕捉到由生成模型所隐含的决策边界。","讲者还指出，不仅高斯分布，其他指数族分布（如泊松分布）也可以导致相同的判别模型——逻辑回归。这说明，逻辑回归的适用性不仅限于高斯分布，而是更广泛的指数族分布。","讲者强调，虽然GDA是生成模型，但其最终的判别模型与逻辑回归相同，这表明生成模型和判别模型之间存在一定的联系。这种联系使得逻辑回归能够捕捉到生成模型所隐含的决策边界。","讲者提到，逻辑回归的后验概率形式是S型函数，这与广义线性模型（GLMs）的结构一致。GLMs中的参数形式最终可以归结为逻辑回归的形式，这进一步说明了逻辑回归的广泛适用性。","讲者最后指出，当数据在分类时被一条线分隔时，逻辑回归能够表示这种决策边界。这表明，逻辑回归不仅适用于高斯分布，也适用于其他指数族分布，只要数据满足相应的条件。"],"formulas":[{"latex":"P(y|x) = \\frac{P(x|y)P(y)}{P(x)}","symbols":"P(y|x) 表示给定输入x时输出y的概率，P(x|y) 是条件概率，P(y) 是先验概率，P(x) 是边缘概率","explanation":"公式正确表达了贝叶斯规则，用于计算给定输入x时输出y的后验概率。","evidence":"Apparently, Claude decided it didn't want to do the algebra. No. So there is some algebra that can be done. And the basic message, though, maybe it's a homework problem. I don't remember. But either way, I mean, you can just see how to do it. It's hopefully not very challenging. Maybe you'll believe me. Maybe you won't. And we'll all be richer for it. Anyway, so the point is, is you'll have this. You can rewrite this in Bayes' rule. And that Bayes' rule allows you to write this probability of y given x, which is the discriminative rule. And that discriminative rule has exactly this functional form."}],"uncertainties":["logistic regression is going to be able to basically represent it."],"diagram":"none","start":3489.56,"end":3641.24,"asr_flags":[],"math_clarifications":["原始文本中提到的GDA（高斯判别分析）与逻辑回归的关系，以及指数族分布的讨论，未在公式中体现，因此无法核定。"],"raw_segments":[{"start":3489.56,"text":"All right, so this is going to be a derivation. That's basically what it's going to show, is we're going to try and derive something that looks like the probability that y equals 1 given x, the discriminative version of what we did. We've been doing kind of the other way around, right? We were trying to get to the other way around. So we want to go the other way around, sorry, over here. So how do we get there? This is the discriminative one."},{"start":3516.63,"text":"Apparently, Claude decided it didn't want to do the algebra. No. So there is some algebra that can be done. And the basic message, though, maybe it's a homework problem. I don't remember. But either way, I mean, you can just see how to do it. It's hopefully not very challenging. Maybe you'll believe me. Maybe you won't. And we'll all be richer for it. Anyway, so the point is, is you'll have this. You can rewrite this in Bayes' rule. And that Bayes' rule allows you to write this probability of y given x, which is the discriminative rule. And that discriminative rule has exactly this functional form."},{"start":3546.54,"text":"Now, what that means, it doesn't mean that it's exactly the same. It means that there is some logistic regressor that captures that decision surface. And so in a weak sense before, as you talked about, there's some line that given those features fits them. In some way, this is a tautology. I don't really need to prove it to you because I already showed that there was a line that we saw before. And clearly, that decision line can be recognized by some kind of linear model. Might as well be this one."},{"start":3572.98,"text":"What the content is, is that the probabilities on both sides are the same. And that also shouldn't be too much of a stretch, but you should go through it. All right. Okay, so basically, GDA implies that logistic regression has the same, in a fancy terminology, posterior distribution has this sigmoidal form. Okay. Now it turns out, I won't prove this either, but it turns out that it's not just Gaussians. It's also other exponential families. Poissons."},{"start":3605.14,"text":"Shared parameters, all the rest. And so it turns out that many different generative assumptions on your data lead to the same discriminative model, logistic regression. And it's not a coincidence. The reason it's not a coincidence is if your data fundamentally at the end when you do a classification rule is separated by a line."},{"start":3622.17,"text":"logistic regression is going to be able to basically represent it. And if it's an exponential model, the posterior is going to be of the form that it's going to scale as a linear thing. And remember the way GLMs work. They had that term. They had those terms in the GLMs. All of them had this form where they would eventually be effectively logistic regression. Please."}],"speech_gaps":[],"frame":"../frames/v054/021.webp","frame_time":3501.56},{"title":"高斯判别分析与逻辑回归的联系","segments":[{"id":423,"text":"So it makes a GBA model and logistic regression is a linear decision boundary? Yeah, exactly right. So the question here is what links the two between the GLMs and logistic regression? It's the fact that they have two components. One is they have a linear decision boundary. And then the second is that they're in the class of exponential models. And that form, exponential form, if you looked at, always has a linear piece and then an extra term. That was the way GLMs work. And so all of them effectively are logistic regression."},{"id":424,"text":"regression in disguise. Now, the reason why that may be quite surprising is, on one hand, it seems like, why the heck are we doing all these different generative models if they end up in the same spot? And so one pro for logistic regression, as I talked about before, is although it's making a very weak assumption, effectively, about the data, this discriminative assumption, that it can find some separator. It doesn't care how the data are generated at all. It's going to find that line, and it's going to get the probabilities close to that line in a good shape."},{"id":425,"text":"On the other hand, what this kind of means is that if we're doing these kind of generative things, as we saw, you can get nonlinear decision boundaries, but you have to use extra and additional structure. So another way to say this, logistic regression became like the workhorse from data. So people really thought as a result of these results, like one thing that you would, if you were sitting in these seats 10 years ago, you're like, oh, I just need to know logistic regression. What's interesting is that a lot of the progress on AI and machine learning actually went in the other direction."},{"id":426,"text":"So the two things that are potentially so strange is if you looked at stats, stats was very interested in, just as a small digression, label data, proving generalization, and proving certificates. Machine learning was interested in subtly different things. It was interested in how you predict, how the predictions look, didn't really care if you had the right values for the model. It looked about how to scale these things up, and so looked at these what are called overcomplete representations. We'll talk about that later in the week."},{"id":427,"text":"And all of these led to actually all the progress. And they were really worried about clean label data. And actually, in two weeks, we'll talk about how to deal with unlabeled data. And it turned out that unlabeled generative data, which were the quirks, if you like, even 10 years ago, are where almost all the progress has been."},{"id":428,"text":"The way that a GPT model works is it trains on huge amounts of unsupervised text during what's called pre-training. It tries to predict the next token, which brings a bunch of representations about it. It is a generative model underneath the covers, and it actually generates text, which is really what they mean when they say generative. Same idea."},{"id":429,"text":"We scaled into regimes, as we'll see on Wednesday, which were like effectively no-go zones for stats. We would look at models that had many more parameters than they had data points. So I just highlight this because this assumption right here is true. It's correct that these generative models can collapse to this discriminative model. Interestingly enough, the progress came on the generative side over the last 10 years, 10, 15 years, in industry and otherwise. All right. Cool. All right."}],"notes":["本段讨论了高斯判别分析（GBA）和逻辑回归之间的联系，指出它们都属于指数族模型（GLMs），并且具有线性决策边界。这表明，尽管它们在建模方式上不同，但它们在某些情况下可以归结为逻辑回归模型。","讲者提到，虽然逻辑回归是一种判别模型，它不关心数据是如何生成的，只关注找到一个分离线，并且能够很好地拟合概率分布。这与生成模型不同，生成模型需要额外的结构来获得非线性决策边界。","讲者还指出，统计学和机器学习在目标上有所不同。统计学关注于标签数据、泛化能力和证明证书，而机器学习更关注预测的性能和如何扩展模型，例如使用过完备表示。","讲者提到，过去十年中，生成模型在人工智能和机器学习领域取得了显著进展，尤其是在工业界。这表明，尽管生成模型在理论上可能不如判别模型直接，但它们在实际应用中具有重要价值。","讲者最后提到，GPT模型通过大规模的无监督文本预训练来工作，它试图预测下一个标记，并生成文本。这表明生成模型在实际应用中具有强大的能力。","讲者强调，生成模型可以扩展到统计学认为难以处理的领域，例如参数数量远多于数据点的模型。这表明生成模型在处理大规模数据和复杂任务方面具有优势。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3641.9,"end":3817.46,"asr_flags":[],"raw_segments":[{"start":3641.9,"text":"So it makes a GBA model and logistic regression is a linear decision boundary? Yeah, exactly right. So the question here is what links the two between the GLMs and logistic regression? It's the fact that they have two components. One is they have a linear decision boundary. And then the second is that they're in the class of exponential models. And that form, exponential form, if you looked at, always has a linear piece and then an extra term. That was the way GLMs work. And so all of them effectively are logistic regression."},{"start":3671.44,"text":"regression in disguise. Now, the reason why that may be quite surprising is, on one hand, it seems like, why the heck are we doing all these different generative models if they end up in the same spot? And so one pro for logistic regression, as I talked about before, is although it's making a very weak assumption, effectively, about the data, this discriminative assumption, that it can find some separator. It doesn't care how the data are generated at all. It's going to find that line, and it's going to get the probabilities close to that line in a good shape."},{"start":3699.41,"text":"On the other hand, what this kind of means is that if we're doing these kind of generative things, as we saw, you can get nonlinear decision boundaries, but you have to use extra and additional structure. So another way to say this, logistic regression became like the workhorse from data. So people really thought as a result of these results, like one thing that you would, if you were sitting in these seats 10 years ago, you're like, oh, I just need to know logistic regression. What's interesting is that a lot of the progress on AI and machine learning actually went in the other direction."},{"start":3726.78,"text":"So the two things that are potentially so strange is if you looked at stats, stats was very interested in, just as a small digression, label data, proving generalization, and proving certificates. Machine learning was interested in subtly different things. It was interested in how you predict, how the predictions look, didn't really care if you had the right values for the model. It looked about how to scale these things up, and so looked at these what are called overcomplete representations. We'll talk about that later in the week."},{"start":3754.24,"text":"And all of these led to actually all the progress. And they were really worried about clean label data. And actually, in two weeks, we'll talk about how to deal with unlabeled data. And it turned out that unlabeled generative data, which were the quirks, if you like, even 10 years ago, are where almost all the progress has been."},{"start":3771.19,"text":"The way that a GPT model works is it trains on huge amounts of unsupervised text during what's called pre-training. It tries to predict the next token, which brings a bunch of representations about it. It is a generative model underneath the covers, and it actually generates text, which is really what they mean when they say generative. Same idea."},{"start":3787.08,"text":"We scaled into regimes, as we'll see on Wednesday, which were like effectively no-go zones for stats. We would look at models that had many more parameters than they had data points. So I just highlight this because this assumption right here is true. It's correct that these generative models can collapse to this discriminative model. Interestingly enough, the progress came on the generative side over the last 10 years, 10, 15 years, in industry and otherwise. All right. Cool. All right."}],"speech_gaps":[],"frame":"../frames/v054/022.webp","frame_time":3653.9},{"title":"高斯判别分析与生成模型的对比","segments":[{"id":430,"text":"Yeah, it's also, by the way, not true in the other direction. Logistic regression does not mean it's GDA. They are not equivalent models. GDA is making more assumptions. There are some decision surfaces that GDA won't be able to recognize."},{"id":431,"text":"And the takeaway is logistic regression assumes less and still gets the right answer for these kinds of problems. And so I wanted to counterbalance that with, because you may think, well, if it does, I don't have to know the generative stuff. And I was like, yeah, but then you would have given up on all this amazing AI richness over the last 10 years, which has been great. We've loved it. That's the way images are generated. That's the way text is generated. It's all generative stuff. All right. So logistic regression only assumes that the log odds is linear."},{"id":432,"text":"And if you look actually all exponential family models, if you look underneath the covers, that's really what they're doing. They all are these log linear models in their parameters. And in fact, that comes from another even more basic assumption, which I'm happy to share with you, which has to do with maximum entropy in the discrete case. But they all have to have that form. Cool. All right."},{"id":433,"text":"Now, the traditional thing we would say is GDA needs stronger assumptions, but is more efficient when data is correct, and it's fragile if it's wrong. And logistic regression needs weaker assumptions, but needs more data, but it's more robust."},{"id":434,"text":"I would say this is a little bit misleading. This is the thing I'm supposed to tell you. It's like in the notes, all the rest. But it's a little bit misleading because of the story I just told you, which is it turned out that being able to model your data independent of class is a much more powerful idea over the last 10 years. Maybe that won't be true for the next 10 years, but at least recently, it's been much more powerful about what to do and build interesting models."},{"id":435,"text":"All right, so here are some examples of modern AI uses. Diffusion models, you iteratively denoise from Gaussians. You assume that you have a Gaussian noise. Imagine I gave you an image. I noised it up with a series of adding Gaussian noise to it, and then I showed you the noisy model at the end. Could you go backwards from that and recover it? If you could do that, that model, what you can do is you can start with random noise that 因此在课程中仍然被教授。讲者鼓励学生提问，但似乎没有学生提出问题。","讲者在结尾部分提到，生成模型的框架是相同的，即建模数据是如何生成的，然后利用该模型进行预测或生成。这种思想在现代AI中非常重要，尤其是在处理复杂数据时。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3819.59,"end":3999.35,"asr_flags":[451],"raw_segments":[{"start":3819.59,"text":"Yeah, it's also, by the way, not true in the other direction. Logistic regression does not mean it's GDA. They are not equivalent models. GDA is making more assumptions. There are some decision surfaces that GDA won't be able to recognize."},{"start":3831.95,"text":"And the takeaway is logistic regression assumes less and still gets the right answer for these kinds of problems. And so I wanted to counterbalance that with, because you may think, well, if it does, I don't have to know the generative stuff. And I was like, yeah, but then you would have given up on all this amazing AI richness over the last 10 years, which has been great. We've loved it. That's the way images are generated. That's the way text is generated. It's all generative stuff. All right. So logistic regression only assumes that the log odds is linear."},{"start":3856.14,"text":"And if you look actually all exponential family models, if you look underneath the covers, that's really what they're doing. They all are these log linear models in their parameters. And in fact, that comes from another even more basic assumption, which I'm happy to share with you, which has to do with maximum entropy in the discrete case. But they all have to have that form. Cool. All right."},{"start":3879.29,"text":"Now, the traditional thing we would say is GDA needs stronger assumptions, but is more efficient when data is correct, and it's fragile if it's wrong. And logistic regression needs weaker assumptions, but needs more data, but it's more robust."},{"start":3891.4,"text":"I would say this is a little bit misleading. This is the thing I'm supposed to tell you. It's like in the notes, all the rest. But it's a little bit misleading because of the story I just told to fit a model to it, then I want to predict"},{"id":475,"text":"back."},{"id":476,"text":"And so in statistics, you care a lot about did I get the right parameters and all the"},{"id":477,"text":"rest."},{"id":478,"text":"And what I want to say is one thing that I do like about machine learning and AI is that it's been fairly creative about how it's going."},{"id":479,"text":"use the models. And so learning a large model to then go and generate a bunch of text is kind of an abhorrent thing to do by statistical standards. People ask questions like, well, how do you even know if it learns the same thing twice? And we're like, we don't know."},{"id":480,"text":"But sometimes it generates cool text and pretty pictures. I remember once when there are these GANs and they first came out. There's a guy called Alyosha Efros, who's a professor at Berkeley. And we're having coffee. And he told me something. I don't know if you mind me repeating this, but it was a wonderful thing. So we were looking at the first... They're called Cycle GANs. He was a developer of these things called Cycle GANs. And he was showing me these pretty pictures on his laptop. This is like what..."},{"id":481,"text":"computer science nerds do. They're like, oh, let me show you my new model. So he showed me his new model. We're having coffee. And I was like, Alyosha, but how do you evaluate it? Like, it looks super cool. How are you evaluating it to try and like, you know, hill climb it and do all these things? He said, Chris."},{"id":482,"text":"My girlfriend, she makes pretty pictures and I love her. And this model, it also makes pretty pictures and I love it. And I was like, done. I'm good. That was the best explanation I've ever heard. So the reason I say that is these generative models, they have this feel that's a little bit squishy to get your head around. They're not just valuable because they do a better job predicting something, but they have all these other capabilities. And fundamentally, like..."},{"id":483,"text":"Building models to understand how data are constructed has been an incredibly fruitful"},{"id":484,"text":"idea. Here, it seems like a stupid idea like,"},{"id":485,"text":"Oh, I fit the model and I just got a line out in the end."},{"id":486,"text":"And so I feel bad. I'm doing you a disservice by saying,"},{"id":487,"text":"It's better here and not better there. Who cares? I don't care."},{"id":488,"text":"I don't care if you fit your linear models of GDA or logistic regression."},{"id":489,"text":"But look how amazing the LLMs and the nano banana and everything is. It's amazing."},{"id":490,"text":"And that line of thinking of let's model the data led to it."}],"notes":["本段讨论了高斯判别分析（GDA）作为生成模型的优势，强调了生成模型在机器学习中的重要性，特别是在文本和图像生成方面的应用。讲者提到，生成模型不仅仅是用于预测，还具有其他能力，如生成高质量的文本和图像。","讲者提到，生成模型在统计学中可能被视为不寻常，因为它们不依赖于精确的参数估计，而是通过模型生成数据。这种做法在传统统计学中可能被认为是不规范的，但在机器学习中却非常常见。","讲者以Cycle GANs为例，说明了生成模型的评估方式。他提到，生成模型的评估并不总是依赖于精确的预测，而是通过生成的输出是否具有吸引力或实用性来判断。","讲者强调，构建模型以理解数据的构造是一个非常有成果的想法。即使在看似简单的模型（如GDA）中，这种思想也能带来深远的影响。","讲者提到，生成模型的灵活性和创造性是其受欢迎的原因之一。它们不仅用于预测，还用于生成新的数据，这在现代机器学习中非常重要。","讲者最后指出，生成模型的思路（即建模数据）是推动现代机器学习发展的关键因素之一，如大型语言模型（LLMs）和生成对抗网络（GANs）的成功。"],"formulas":[],"uncertainties":["sigma sub ij greater than zero means positive correlation between","should that be with the inverse yeah so that was in the specific case that they were 2d"],"diagram":"none","start":3999.35,"end":4176.19,"asr_flags":[],"raw_segments":[{"start":3999.35,"text":"much for bailing me out there appreciate it like uh like one of the earlier slides it said that um"},{"start":4006.07,"text":"like sigma sub ij greater than zero means positive correlation between"},{"start":4012.55,"text":"should that be with the inverse yeah so that was in the specific case that they were 2d"},{"start":4019.81,"text":"Yeah, yeah."},{"start":4020.61,"text":"Great question."},{"start":4021.79,"text":"Please."},{"start":4022.79,"text":"Can you explain the pro of GDA that wasn't on the slide that you mentioned"},{"start":4027.01,"text":"and why it's been so common?"},{"start":4029.57,"text":"Oh, yeah."},{"start":4030.33,"text":"Great question."},{"start":4030.99,"text":"So the question was, why has GDA actually taken off in this?"},{"start":4034.19,"text":"And at one level, I was just asserting the fact that generative models"},{"start":4037.93,"text":"are the things that are potentially the most exciting uses of machine learning"},{"start":4042.63,"text":"over the last couple of years, generating text, generating images."},{"start":4045.29,"text":"And in some ways, that's basically saying that this line of thinking led to them."},{"start":4050.61,"text":"The places where it's better or worse, I guess what I wanted to get across there is it's"},{"start":4055.57,"text":"very tempting when you take these kind of courses, we kind of put this very constrained"},{"start":4059.17,"text":"box on you about how we're explaining their uses."},{"start":4061.75,"text":"And one use for machine learning is kind of the traditional statistics use."},{"start":4065.19,"text":"I want to take a bunch of data, I want to fit a model to it, then I want to predict"},{"start":4069.23,"text":"back."},{"start":4069.83,"text":"And so in statistics, you care a lot about did I get the right parameters and all the"},{"start":4073.43,"text":"rest."},{"start":4074.05,"text":"And what I want to say is one thing that I do like about machine learning and AI is that it's been fairly creative about how it's going."},{"start":4079.95,"text":"use the models. And so learning a large model to then go and generate a bunch of text is kind of an abhorrent thing to do by statistical standards. People ask questions like, well, how do you even know if it learns the same thing twice? And we're like, we don't know."},{"start":4092.75,"text":"But sometimes it generates cool text and pretty pictures. I remember once when there are these GANs and they first came out. There's a guy called Alyosha Efros, who's a professor at Berkeley. And we're having coffee. And he told me something. I don't know if you mind me repeating this, but it was a wonderful thing. So we were looking at the first... They're called Cycle GANs. He was a developer of these things called Cycle GANs. And he was showing me these pretty pictures on his laptop. This is like what..."},{"start":4112.78,"text":"computer science nerds do. They're like, oh, let me show you my new model. So he showed me his new model. We're having coffee. And I was like, Alyosha, but how do you evaluate it? Like, it looks super cool. How are you evaluating it to try and like, you know, hill climb it and do all these things? He said, Chris."},{"start":4125.44,"text":"My girlfriend, she makes pretty pictures and I love her. And this model, it also makes pretty pictures and I love it. And I was like, done. I'm good. That was the best explanation I've ever heard. So the reason I say that is these generative models, they have this feel that's a little bit squishy to get your head around. They're not just valuable because they do a better job predicting something, but they have all these other capabilities. And fundamentally, like..."},{"start":4146.99,"text":"Building models to understand how data are constructed has been an incredibly fruitful"},{"start":4152.87,"text":"idea. Here, it seems like a stupid idea like,"},{"start":4155.63,"text":"Oh, I fit the model and I just got a line out in the end."},{"start":4157.69,"text":"And so I feel bad. I'm doing you a disservice by saying,"},{"start":4160.55,"text":"It's better here and not better there. Who cares? I don't care."},{"start":4163.37,"text":"I don't care if you fit your linear models of GDA or logistic regression."},{"start":4166.49,"text":"But look how amazing the LLMs and the nano banana and everything is. It's amazing."},{"start":4173.53,"text":"And that line of thinking of let's model the data led to it."}],"speech_gaps":[],"frame":"../frames/v054/024.webp","frame_time":4011.35},{
