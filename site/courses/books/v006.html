rse of eta...","start":3036.91,"end":3062.29},{"id":157,"text":"it's going to be positive, right? Because eta is like 0.85 and stuff. Oh, actually, if eta is less than 50%, if eta is less than 50%, phi inverse of eta is negative, right? If I have a standard Gaussian and I say, what's the inverse CDF of 0.3? I don't know what it is, but it's like minus a half or something, roughly. I just made that up, but still.","start":3062.71,"end":3091.09},{"id":158,"text":"probability that the constraints hold is more than 50%, then you can actually multiply out this thing bigger than or equal to phi inverse of eta, and you multiply it out like this, and lo and behold, it's an SOCP. Oh, actually, it's only an SOCP if this thing is bigger than a half. Because otherwise this is negative, and then you're sitting on the wrong side of the inequality there.","start":3091.98,"end":3120.6},{"id":159,"text":"If someone came up to you and said, please help me solve this robust problem. And you go, what does he go? Well, the thing is, I don't know the constraints and they vary. And I'd say, well, how with what probability would you like your constraints to hold? And if they said something like, oh, 15 percent would be good for me. Like you would say, go away.","start":3122.07,"end":3140.88},{"id":160,"text":"I mean, you'd check or whatever, but you'd send them away. And as they're leaving, right, you can shout out. It says, not only is that stupid, but you can't even solve it. That's what I would say to that person. That's as they're leaving. Okay, everybody got that? I mean, there are weird cases where you might have risk-seeking things.","start":3141.44,"end":3170.57},{"id":161,"text":"The closest I've ever come to hearing somebody describe risk-seeking something was, okay, not socially positive, but it was somebody who was designing missile controllers. And they said, well, if you have high probability of making a kill, do it. But we'll take 10% because otherwise you already launched it, it's on its way, and it's not coming home and you're not going to use it again. I don't know if everybody got that. And I think I even quasi-accept that as an actual application, if not a socially positive one. But anyway, okay. Okay.","start":3172.14,"end":3195.74}],"notes":["本段讲解了概率约束与SOCP（二次约束规划）之间的关系。当约束满足的概率大于50%时，可以将概率约束转换为SOCP形式。但需要注意的是，只有当phi逆函数的值大于0.5时，才能保证不等式成立，否则会处于不等式的错误一侧。","讲者通过一个实际例子说明了概率约束的转换过程。当概率要求过低（如15%）时，问题变得不可解，因为无法满足约束条件。这表明在实际应用中，需要合理设定约束满足的概率阈值。","讲者提到风险寻求（risk-seeking）的概念，这在导弹控制系统设计中有所体现。设计者倾向于在高概率下执行任务，但为了确保任务成功，可能选择较低的概率阈值，如10%。","讲者强调了概率约束转换为SOCP的条件，即概率必须大于50%。这与phi逆函数的性质密切相关，因为当概率小于50%时，phi逆函数的值会为负，导致不等式方向错误。","讲者通过幽默的方式指出，当概率要求过低时，问题无法解决，因此需要合理设定概率阈值。这表明在实际应用中，概率约束的设定需要权衡风险与可行性。","讲者提到风险寻求在导弹控制系统中的应用，尽管这可能不是社会积极的案例，但说明了在某些工程场景中，风险寻求策略是合理的。"],"formulas":[{"latex":"P(constraints\\ hold) > 50%","symbols":"约束满足的概率大于50%","explanation":"该公式正确表达了约束满足概率的条件，无需修改。","evidence":"probability that the constraints hold is more than 50%, then you can actually multiply out this thing bigger than or equal to phi inverse of eta, and you multiply it out like this, and lo and behold, it's an SOCP. Oh, actually, it's only an SOCP if this thing is bigger than a half. Because otherwise this is negative, and then you're sitting on the wrong side of the inequality there. Everybody see that? So, now..."}],"uncertainties":["phi inverse of eta is negative, right? If I have a standard Gaussian and I say, what's the inverse CDF of 0.3? I don't know what it is, but it's like minus a half or something, roughly."],"diagram":"none","start":3036.91,"end":3195.74,"asr_flags":[],"math_clarifications":["公式phi^{-1}(eta) > 0.5未提供phi函数的具体定义，无法验证其正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3036.91,"text":"It's pretty straightforward. What we want to do is we want to say that this thing is bigger than or equal to eta, right? Eta is 0.95. There you go. But this phi is monotone, right? So this says this expression is bigger than phi inverse of eta. Everybody got that? Okay, now phi inverse of eta..."},{"start":3062.71,"text":"it's going to be positive, right? Because eta is like 0.85 and stuff. Oh, actually, if eta is less than 50%, if eta is less than 50%, phi inverse of eta is negative, right? If I have a standard Gaussian and I say, what's the inverse CDF of 0.3? I don't know what it is, but it's like minus a half or something, roughly. I just made that up, but still. Everybody got this, right? So provided that you're required..."},{"start":3091.98,"text":"probability that the constraints hold is more than 50%, then you can actually multiply out this thing bigger than or equal to phi inverse of eta, and you multiply it out like this, and lo and behold, it's an SOCP. Oh, actually, it's only an SOCP if this thing is bigger than a half. Because otherwise this is negative, and then you're sitting on the wrong side of the inequality there. Everybody see that? So, now..."},{"start":3122.07,"text":"If someone came up to you and said, please help me solve this robust problem. And you go, what does he go? Well, the thing is, I don't know the constraints and they vary. And I'd say, well, how with what probability would you like your constraints to hold? And if they said something like, oh, 15 percent would be good for me. Like you would say, go away."},{"start":3141.44,"text":"I mean, you'd check or whatever, but you'd send them away. And as they're leaving, right, you can shout out. It says, not only is that stupid, but you can't even solve it. That's what I would say to that person. That's as they're leaving. Okay, everybody got that? I mean, there are weird cases where you might have risk-seeking things. The closest I've ever come to hearing somebody describe risk-seeking something was, okay, not socially positive, but it was somebody who was designing missile controllers."},{"start":3172.14,"text":"And they said, well, if you have high probability of making a kill, do it. But we'll take 10% because otherwise you already launched it, it's on its way, and it's not coming home and you're not going to use it again. I don't know if everybody got that. And I think I even quasi-accept that as an actual application, if not a socially positive one. But anyway, okay. Okay."}],"speech_gaps":[],"frame":"../frames/v006/019.webp","frame_time":3048.91},{"title":"几何规划简介","segments":[{"id":162,"text":"Next up in our tour. So next topic is geometric programming. So you're seeing a lot of stuff. This is very cool. This goes back into the 1940s and actually, weirdly, it persisted. Well, let me explain what it is. So it's a class of optimization problems where we are going to apply.","start":3198.76,"end":3222.54},{"id":163,"text":"It is absolutely not a convex problem. There's no doubt about it. We'll look at it in a minute. It's very weird. But it's not a convex problem. But what we're going to do is we're going to make a transformation. We're going to change the variables and change a few other things. That's all. And now it's going to become convex under this change of variables.","start":3223.5,"end":3242.16},{"id":164,"text":"Now you can solve it. It scales to gigantic problems and all sorts of other stuff. Okay, so that's this is an example of that. We're gonna see others in statistics. We're gonna see them. We're gonna see them in other areas too, right? So Okay, so and it's got its own weird language. Oh what the other thing I was gonna say was","start":3243.08,"end":3261.93},{"id":165,"text":"This was an entire field. People talked about it. People wrote books about it from the 60s. All sorts of stuff. It wasn't until like around 1980s that people actually realized it was convex. Sorry, it's not convex. Can be reduced to an equivalent convex problem and therefore scaled. Right. In fact, you don't even have to say anything at that point. You just stop and you say, it's done. Okay?","start":3262.52,"end":3288.29},{"id":166,"text":"Although some of my friends who were in Moscow in the 60s said, oh, we all knew that. Like, oh, so I'm hardly surprised in the West they didn't know that. Anyway, so everybody got this? Okay, so here it is. And it's got its own secret language, which you should never use these words in the wrong situation because you will sound like an idiot. Unless other people know the background and things like that. So here's what it is. If I have a product,","start":3289.91,"end":3318.89},{"id":167,"text":"These are positive variables, and I raise them to various powers. But the powers are just real numbers. They can be minus 1.3, plus 2.6, minus 3.5. Everybody got that? So it's a product. By the way, I think people talk about this as a scaling law in a lot of engineering fields, right? Like, how does this go with Reynolds number and all that kind of stuff? It's a scaling law. So I think some people are familiar with things that look like that.","start":3319.5,"end":3346.75},{"id":168,"text":"Anyway, so in this field of geometric programming, they decided to call this a monomial. However, unfortunately, there is a definition of monomial in math, which has been used since like 1820 or something like that, and it is absolutely standard. It's like min. There is no doubt what a monomial is. A monomial is one and only one thing. It is a product of variables.","start":3348.18,"end":3374.29}],"notes":["本段介绍了几何规划的基本概念，指出它是一种优化问题，虽然最初被认为是非凸的，但通过变量变换可以转化为凸问题。讲者提到几何规划在60年代是一个独立的领域，直到1980年代才被认识到其凸性。","讲者强调了几何规划中的一些术语，如monomial（单项式），并指出数学中已有标准定义，与几何规划中的定义不同。这说明术语的使用需要谨慎，以避免混淆。","讲者提到几何规划中的乘积形式，变量可以是正数，并且可以被提升到任意实数次幂，如-1.3、+2.6、-3.5等。这种形式在工程领域被称为缩放定律（scaling law），例如与雷诺数相关。","讲者指出，几何规划中的monomial与数学中的monomial定义不同，数学中的monomial是变量的乘积，而几何规划中的monomial可能包含其他形式。这说明术语的使用需要根据上下文来理解。","讲者提到，几何规划在统计学和其他领域都有应用，但需要特别注意术语的使用，以避免误解。这表明几何规划是一个跨学科的领域，需要特定的语言和术语。","讲者提到，虽然几何规划在60年代是一个独立的领域，但直到1980年代才被认识到其凸性，这说明该领域的研究经历了长期的发展和演变。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3198.76,"end":3374.29,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3198.76,"text":"Next up in our tour. So next topic is geometric programming. So you're seeing a lot of stuff. This is very cool. This goes back into the 1940s and actually, weirdly, it persisted. Well, let me explain what it is. So it's a class of optimization problems where we are going to apply."},{"start":3223.5,"text":"It is absolutely not a convex problem. There's no doubt about it. We'll look at it in a minute. It's very weird. But it's not a convex problem. But what we're going to do is we're going to make a transformation. We're going to change the variables and change a few other things. That's all. And now it's going to become convex under this change of variables."},{"start":3243.08,"text":"Now you can solve it it scales to gigantic problems and all sorts of other stuff. Okay, so that's this is an example of that We're gonna see others in statistics. We're gonna see them. We're gonna see them in other areas too, right? So Okay, so and it's got its own weird language. Oh what the other thing I was gonna say was"},{"start":3262.52,"text":"This was an entire field. People talked about it. People wrote books about it from the 60s. All sorts of stuff. It wasn't until like around 1980s that people actually realized it was convex. Sorry, it's not convex. Can be reduced to an equivalent convex problem and therefore scaled. Right. In fact, you don't even have to say anything at that point. You just stop and you say, it's done. Okay?"},{"start":3289.91,"text":"Although some of my friends who were in Moscow in the 60s said, oh, we all knew that. Like, oh, so I'm hardly surprised in the West they didn't know that. Anyway, so everybody got this? Okay, so here it is. And it's got its own secret language, which you should never use these words in the wrong situation because you will sound like an idiot. Unless other people know the background and things like that. So here's what it is. If I have a product,"},{"start":3319.5,"text":"These are positive variables, and I raise them to various powers. But the powers are just real numbers. They can be minus 1.3, plus 2.6, minus 3.5. Everybody got that? So it's a product. By the way, I think people talk about this as a scaling law in a lot of engineering fields, right? Like, how does this go with Reynolds number and all that kind of stuff? It's a scaling law. So I think some people are familiar with things that look like that."},{"start":3348.18,"text":"Anyway, so in this field of geometric programming, they decided to call this a monomial. However, unfortunately, there is a definition of monomial in math, which has been used since like 1820 or something like that, and it is absolutely standard. It's like min. There is no doubt what a monomial is. A monomial is one and only one thing. It is a product of variables."}],"speech_gaps":[],"frame":"../frames/v006/020.webp","frame_time":3210.76},{"title":"几何规划中的多项式与凸性","segments":[{"id":169,"text":"with integer exponents, and the coefficient in front can be anything, positive or negative. Everybody got that? So, minus 3 x1 cubed times x squared times x5, that's a monomial that you can say outside this room.","start":3375.12,"end":3392.81},{"id":170,"text":"But only in the context of geometric programming would you call this a monomial. So this is just a heads up. Because if you say, if you use, you know that's a monomial, and there's anybody around who doesn't know about geometric programming, they'll think you're an idiot. Okay? So, okay.","start":3393.78,"end":3419.68},{"id":171,"text":"Okay, that's called a posi. And I think it's supposed to be like positive and monomial. Forget the fact that their use of monomial is not the absolutely standard use, right? So anyway, whatever. That's posinomial. And then a geometric program looks like this. It says you have positive variables. That's implicit. And you minimize a posinomial subject to, and don't say posinomial.","start":3420.62,"end":3447.32},{"id":172,"text":"Okay, that's called a posi. And I think it's supposed to be like positive and monomial. Forget the fact that their use of monomial is not the absolutely standard use, right? So anyway, whatever. That's posinomial. And then a geometric program looks like this. It says you have positive variables. That's implicit. And you minimize a posinomial subject to, and don't say posinomial.","start":3448.56,"end":3469.9},{"id":173,"text":"You know, this is not remotely convex. I mean, these are highly nonlinear, right? I mean, here's an example of this. You know, x1 to the 1.3 times x2 to the minus 0.3 is equal to 1. Well, that is not affine. Last time I checked, it's not even close. Everybody got that? Okay, that's a GP. And books were written about this in the 60s. People solved them by hand. I'm not kidding.","start":3470.46,"end":3499.34},{"id":174,"text":"When they were easy enough, it's got kind of weird. But then here's what was discovered in the West in the 80s. And supposedly in Moscow, everybody knew this in the 60s. So here it is. What you do is you change variables. They're positive variables. So I'm going to work with the logs. I call those y, right? That's a change of variables. So I'm going to have yi. And then when I have a monomial, what does that convert to? Well, it's the log.","start":3500.58,"end":3528.97}],"notes":["本段讲解了几何规划中的多项式概念，特别是单项式（monomial）和正项式（posinomial）的定义。单项式是形如 $ x_1^a x_2^b \times \text{常数} $ 的表达式，而正项式是多个单项式的和。在几何规划中，单项式和正项式有特定的定义，但这些术语在标准数学中可能不完全一致。","讲者强调了在使用这些术语时的注意事项，特别是在非几何规划领域的人可能误解这些术语。因此，讲者建议在使用这些术语时要确保听众了解其背景，否则可能会引起误解。","几何规划（GP）是一种非凸优化问题，其约束条件和目标函数通常是非线性的。例如，$ x_1^{1.3} x_2^{-0.3} = 1 $ 是一个典型的几何规划问题，它不是仿射的，因此不满足凸性条件。","在20世纪60年代，几何规划被广泛研究，人们通过手工方法求解这些问题。然而，到了80年代，西方学者发现了将几何规划转换为凸优化问题的方法，即通过变量替换（如取对数）将非凸问题转化为凸问题。","变量替换是解决几何规划问题的关键步骤。通过将正变量取对数，可以将单项式转换为线性形式，从而将非凸问题转化为凸问题。这种方法使得几何规划问题可以通过凸优化技术求解。","讲者提到，虽然几何规划在西方直到80年代才被广泛研究，但在莫斯科等地区，这一方法可能早在60年代就已经被熟知。这表明不同地区在数学研究上的发展可能存在差异。"],"formulas":[{"latex":"x_1^{1.3} x_2^{-0.3} = 1","symbols":"x₁的1.3次方乘以x₂的-0.3次方等于1","explanation":"该公式是几何规划中的一个例子，展示了非线性约束条件，其中x₁和x₂是正变量。","evidence":"You know, this is not remotely convex. I mean, these are highly nonlinear, right? I mean, here's an example of this. You know, x1 to the 1.3 times x2 to the minus 0.3 is equal to 1. Well, that is not affine. Last time I checked, it's not even close. Everybody got that? Okay, that's a GP. And books were written about this in the 60s. People solved them by hand. I'm not kidding."},{"latex":"y_i = \\text{log}(x_i)","symbols":"y_i = log(x_i)","explanation":"该公式表示变量变换，将正变量x_i转换为对数变量y_i，这是解决几何规划问题的常用方法。","evidence":"When they were easy enough, it's got kind of weird. But then here's what was discovered in the West in the 80s. And supposedly in Moscow, everybody knew this in the 60s. So here it is. What you do is you change variables. They're positive variables. So I'm going to work with the logs. I call those y, right? That's a change of variables. So I'm going to have yi. And then when I have a monomial, what does that convert to? Well, it's the log."}],"uncertainties":[],"diagram":"none","start":3375.12,"end":3528.97,"asr_flags":[],"math_clarifications":["公式中的指数1.3和-0.3是实数，符合几何规划中允许的非整数指数。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3375.12,"text":"with integer exponents, and the coefficient in front can be anything, positive or negative. Everybody got that? So, minus 3 x1 cubed times x squared times x5, that's a monomial that you can say outside this room."},{"start":3393.78,"text":"But only in the context of geometric programming would you call this a monomial. So this is just a heads up. Because if you say, if you use, you know that's a monomial, and there's anybody around who doesn't know about geometric programming, they'll think you're an idiot. Okay? So, okay. And this is even worse. A posinomial. And I'm sorry, we didn't make this up. This is simply the name assigned to it in the 1960s. It's a sum of monomials."},{"start":3420.62,"text":"Okay, that's called a posi. And I think it's supposed to be like positive and monomial. Forget the fact that their use of monomial is not the absolutely standard use, right? So anyway, whatever. That's posinomial. And then a geometric program looks like this. It says you have positive variables. That's implicit. And you minimize a posinomial subject to, and don't say posinomial."},{"start":3448.56,"text":"if you say that make sure everybody around you within any hearing distance knows about gp and knows that you know about gp otherwise don't say that word uh because i mean you can try it just walk over to the math department and see what happens but anyway um okay and then you and you have equality constraints right so"},{"start":3470.46,"text":"You know, this is not remotely convex. I mean, these are highly nonlinear, right? I mean, here's an example of this. You know, x1 to the 1.3 times x2 to the minus 0.3 is equal to 1. Well, that is not affine. Last time I checked, it's not even close. Everybody got that? Okay, that's a GP. And books were written about this in the 60s. People solved them by hand. I'm not kidding."},{"start":3500.58,"text":"When they were easy enough, it's got kind of weird. But then here's what was discovered in the West in the 80s. And supposedly in Moscow, everybody knew this in the 60s. So here it is. What you do is you change variables. They're positive variables. So I'm going to work with the logs. I call those y, right? That's a change of variables. So I'm going to have yi. And then when I have a monomial, what does that convert to? Well, it's the log."}],"speech_gaps":[],"frame":"../frames/v006/021.webp","frame_time":3387.12},{"title":"几何规划与凸优化的等价性","segments":[{"id":175,"text":"Oh, sorry, yeah, let's see what it is. If you have f, right, this transforms to, these are exponentials, actually to the exponential of an affine function, right? If I take the log of a monomial, I get an affine function, okay? Then a posinomial is going to transform into a log sum exp of an affine function, and they're convex, right? So that means...","start":3529.51,"end":3556.66},{"id":176,"text":"The geometric program over here, which is not remotely convex, is actually exactly equivalent to this problem. And this problem is convex, because look at this. This is log sum exp of an affine function. Log sum exp is convex, and convex of affine is convex. So we're all these. That's linear. Affine. Whatever. However you want to say it. Everybody got this?","start":3556.98,"end":3584.38},{"id":177,"text":"So it's actually pretty cool. It's even cooler because every time when you look at a practical field where people use geometric programming, you will find out that they already, either implicitly or not, figured out you should be working with logs. I'll give you an example. A lot of times there's power control for wireless systems or actually for cables, right? And actually, so engineers there, they use decibels to talk about powers. Well, guess what? That's the log.","start":3584.91,"end":3613.31},{"id":178,"text":"If you go to circuit design and you'd say, well, tell me about my library. What sizes do these come in? And they go, oh, yeah, you can get that, you know, that whatever, that NAND gate. You can get it in the size 0.5, size 1, 1.4, 2, you know, 4, 8, 16. Sound familiar?","start":3614.39,"end":3634.1},{"id":179,"text":"What it means is they already knew in their hearts that basically you should not work with the size, you should work with the log of the size, right? Because that's what those numbers are. Yeah? Is it always the same k in the objective and the inequality? Let me think. Let me think about that. Sorry.","start":3635.49,"end":3660.1},{"id":180,"text":"It is let me it may not be actually let me think I don't think it is you're right because these are different Yeah, there's something there's something the K doesn't have to be the same No, it does not have to be so yeah Okay, so that's GP I'll I'll go in one exam. I'm not gonna go through the details I mean actually the real truth is I couldn't even defend the details","start":3662.2,"end":3694.39}],"notes":["本段讲解了几何规划（GP）与凸优化之间的等价性。几何规划本身是非凸的，但通过取对数变换，可以将其转化为凸优化问题。具体来说，单项式（monomial）的对数是仿射函数，而拟单项式（posinomial）的对数则转化为log-sum-exp形式，这是凸函数。因此，几何规划问题可以通过对数变换转化为凸优化问题。","讲者提到，几何规划在实际应用中经常被使用，例如无线系统中的功率控制和电路设计中的元件尺寸选择。这些实际应用中，工程师们已经隐式地使用了对数变换，例如使用分贝（dB）表示功率，这本质上是对数的使用。","讲者还指出，在几何规划中，目标函数和约束条件中的参数k不一定相同。虽然在某些情况下k可能相同，但通常并不需要保持一致。这一点在实际应用中可能需要根据具体问题进行调整。","讲者最后提到，虽然几何规划的细节可能较为复杂，但其核心思想是通过对数变换将非凸问题转化为凸问题，从而利用凸优化的高效求解方法。"],"formulas":[],"uncertainties":["It is let me it may not be actually let me think I don't think it is you're right because these are different Yeah, there's something there's something the K doesn't have to be the same No, it does not have to be so yeah Okay, so that's GP I'll I'll go in one exam. I'm not gonna go through the details I mean actually the real truth is I couldn't even defend the details"],"diagram":"none","start":3529.51,"end":3694.39,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3529.51,"text":"Oh, sorry, yeah, let's see what it is. If you have f, right, this transforms to, these are exponentials, actually to the exponential of an affine function, right? If I take the log of a monomial, I get an affine function, okay? Then a posinomial is going to transform into a log sum exp of an affine function, and they're convex, right? So that means..."},{"start":3556.98,"text":"The geometric program over here, which is not remotely convex, is actually exactly equivalent to this problem. And this problem is convex, because look at this. This is log sum exp of an affine function. Log sum exp is convex, and convex of affine is convex. So we're all these. That's linear. Affine. Whatever. However you want to say it. Everybody got this?"},{"start":3584.91,"text":"So it's actually pretty cool. It's even cooler because every time when you look at a practical field where people use geometric programming, you will find out that they already, either implicitly or not, figured out you should be working with logs. I'll give you an example. A lot of times there's power control for wireless systems or actually for cables, right? And actually, so engineers there, they use decibels to talk about powers. Well, guess what? That's the log."},{"start":3614.39,"text":"If you go to circuit design and you'd say, well, tell me about my library. What sizes do these come in? And they go, oh, yeah, you can get that, you know, that whatever, that NAND gate. You can get it in the size 0.5, size 1, 1.4, 2, you know, 4, 8, 16. Sound familiar?"},{"start":3635.49,"text":"What it means is they already knew in their hearts that basically you should not work with the size, you should work with the log of the size, right? Because that's what those numbers are. Yeah? Is it always the same k in the objective and the inequality? Let me think. Let me think about that. Sorry."},{"start":3662.2,"text":"It is let me it may not be actually let me think I don't think it is you're right because these are different Yeah, there's something there's something the K doesn't have to be the same No, it does not have to be so yeah Okay, so that's GP I'll I'll go in one exam. I'm not gonna go through the details I mean actually the real truth is I couldn't even defend the details"}],"speech_gaps":[],"frame":"../frames/v006/022.webp","frame_time":3541.51},{"title":"凸优化中的工程设计问题","segments":[{"id":181,"text":"But I will tell you a funny story about it. I found this in a book on optimization for engineering design. And this example was held up as an example. They said, oh, here's a problem that is not convex. And that was literally the point of the example. That's a true statement.","start":3695.17,"end":3717.65},{"id":182,"text":"You do the right sneaky change of variables, and it is convex. So the problem is this. You're going to design this cantilever beam, and what you can do is you can change the length. That's this thing that you can see here, but also the width, which you can't see. That's how wide it is over here.","start":3719.42,"end":3739.98},{"id":183,"text":"And so that's what this is. And then we're going to put a force at the tip. And of course, I mean, you don't have to know any mechanical engineering to know it's going to deflect, right? And if you make yourself a giant thick thing where this is steel or something like that, it's going to be very stiff.","start":3742.26,"end":3761.88},{"id":184,"text":"Right. Because then when you push, you put a lot of newtons on it, it's barely going to budge. Right. Or I could make it sort of this flimsy small thing and I press it and it's going to really bend. Right. So that's that's kind of that means. And again, you don't have to know any mechanical engineering to know this. I mean, I don't know any. So that's fine. So it's fine. But that's just that's the rough idea. Right. And so your design problem is something like, you know, minimize the total weight.","start":3762.43,"end":3786.71},{"id":185,"text":"subject to, I mean, these are just, you know, this could even be manufacturing constraints, right? That you just, there's just limits to these. You could have an upper, that's a geometric constraint. You could have an upper bound on the stress in each segment.","start":3787.74,"end":3801.9},{"id":186,"text":"That's a reasonable model of failure. And then you want an upper bound and deflection of the beam at the end. So what you're saying is if I load this with 10 kilonewtons, I don't want it to sag more than 3 centimeters. That would be your spec. Everybody got it? By the way, problems like this, but simpler, were already being solved in the early 1950s in aerospace.","start":3802.48,"end":3825.3},{"id":187,"text":"They were doing exact, and they were using linear programming and mostly linear programming in aerospace, right? Pretty cool, right? Because you're, you know, if you design a bridge that people are going to drive over for 100 years, you build a lot of margin into it and stuff like that. If you're doing aerospace stuff, you can't engineer stuff 5x over, right? Because it just weighs too much, and congratulations, now you have no payload, right?","start":3826.35,"end":3850.11}],"notes":["本段介绍了凸优化在工程设计中的应用，以悬臂梁设计为例。讲者提到，虽然问题最初看起来是非凸的，但通过变量替换可以将其转化为凸问题。这说明了凸优化在实际工程中的重要性，即通过数学变换将复杂问题简化为可解的形式。","讲者描述了悬臂梁的设计问题，包括长度和宽度的调整，以及施加在末端的力。他指出，梁的刚度与其材料和尺寸有关，较厚的梁更不容易弯曲。这体现了物理直觉在工程设计中的作用，即使没有专业知识也能理解基本原理。","讲者提到设计目标是使梁的总重量最小化，同时满足制造约束和应力限制。这说明了优化问题中目标函数和约束条件的结合，以及如何通过数学建模来处理实际工程问题。","讲者进一步说明了对梁挠度的限制，即在施加10千牛的力时，挠度不能超过3厘米。这体现了工程设计中的规范要求，以及如何将这些要求转化为数学约束。","讲者提到在1950年代，航空航天领域已经开始使用线性规划解决类似问题。这说明了凸优化方法在实际工程中的历史应用，以及其在不同领域的适应性。","讲者指出，航空航天设计需要在重量和性能之间取得平衡，不能过度设计。这反映了工程优化中的权衡问题，即在满足性能要求的同时，尽可能减少资源消耗。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3695.17,"end":3850.11,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3695.17,"text":"But I will tell you a funny story about it. I found this in a book on optimization for engineering design. And this example was held up as an example. They said, oh, here's a problem that is not convex. And that was literally the point of the example. That's a true statement."},{"start":3719.42,"text":"You do the right sneaky change of variables, and it is convex. So the problem is this. You're going to design this cantilever beam, and what you can do is you can change the length. That's this thing that you can see here, but also the width, which you can't see. That's how wide it is over here."},{"start":3742.26,"text":"And so that's what this is. And then we're going to put a force at the tip. And of course, I mean, you don't have to know any mechanical engineering to know it's going to deflect, right? And if you make yourself a giant thick thing where this is steel or something like that, it's going to be very stiff."},{"start":3762.43,"text":"Right. Because then when you push, you put a lot of newtons on it, it's barely going to budge. Right. Or I could make it sort of this flimsy small thing and I press it and it's going to really bend. Right. So that's that's kind of that means. And again, you don't have to know any mechanical engineering to know this. I mean, I don't know any. So that's fine. So it's fine. But that's just that's the rough idea. Right. And so your design problem is something like, you know, minimize the total weight."},{"start":3787.74,"text":"subject to, I mean, these are just, you know, this could even be manufacturing constraints, right? That you just, there's just limits to these. You could have an upper, that's a geometric constraint. You could have an upper bound on the stress in each segment."},{"start":3802.48,"text":"That's a reasonable model of failure. And then you want an upper bound and deflection of the beam at the end. So what you're saying is if I load this with 10 kilonewtons, I don't want it to sag more than 3 centimeters. That would be your spec. Everybody got it? By the way, problems like this, but simpler, were already being solved in the early 1950s in aerospace."},{"start":3826.35,"text":"They were doing exact, and they were using linear programming and mostly linear programming in aerospace, right? Pretty cool, right? Because you're, you know, if you design a bridge that people are going to drive over for 100 years, you build a lot of margin into it and stuff like that. If you're doing aerospace stuff, you can't engineer stuff 5x over, right? Because it just weighs too much, and congratulations, now you have no payload, right?"}],"speech_gaps":[],"frame":"../frames/v006/023.webp","frame_time":3707.17},{"title":"非凸优化问题与凸性分析","segments":[{"id":188,"text":"There, it's delicate. You want things to be absolutely as light as possible, but still actually satisfy all the requirements that it's actually going to work. Which means that it's got to be stiff enough, it's got to handle all sorts of dynamic loads, all that kind of stuff. So stuff like this is done all the time. In fact, there's a whole field. It doesn't matter. I'll talk about that later. Okay, so that's it.","start":3851.89,"end":3877.87},{"id":189,"text":"Okay, so here it is in English. And then, you know, in words to work out what these things are, I'm going to just talk about a few of the things and then not, I don't want to focus on it because it's not that critical to us. But here's the total weight. The variables, remember, are W and H. And I would like to ask you, what kind of function is that? I mean, aside from it being a polynomial, which you should never say in public. But what kind of function is this of W and H? Again, pretend you're in public.","start":3878.48,"end":3905.97},{"id":190,"text":"So you can use words that you're allowed to say in public. What kind of function is that? It's what? I missed that. Dot product. It's a dot product, right? It's an inner product between W and H. Is it convex in W and H? No. It's a quadratic form, right? It's the quadratic form with matrix 0, like I, I, 0. Right? So this is not convex. So you know already we are not solving a convex problem.","start":3906.62,"end":3939.4},{"id":191,"text":"Or, yeah, well, when we get around to solving this, we'll do this change of variables, and it will become a convex problem. Okay, so these various ratios are monomials, and the maximum stress is a monomial, so those are fine to handle. The vertical deflection comes from, again,","start":3939.96,"end":3957.77},{"id":192,"text":"I couldn't defend this, but this is, I mean, I suppose it's just like elementary, you know, baby physics and mechanics or whatever. But it's just, you start at the tip and you go back and it's just a recursion that tells you this. What's kind of cool about this is you look.","start":3958.35,"end":3972.03},{"id":193,"text":"at various things here. But what you'll see is that each of these, right, if you start, you can actually, by applying the rules, oh, I should say, there's a full other set. You can transcribe all the rules you know for convex functions, and they will have analogs for, like, posinomials and monomials. And I'll give you some example, right? Let's just go back. I mean, okay.","start":3972.51,"end":4000.31}],"notes":["本段讨论了非凸优化问题，指出目标函数是W和H的点积，即内积，属于二次型，而非凸函数。因此，该问题不是凸优化问题。但通过变量替换，可以将其转化为凸问题。","讲者提到各种比值是单项式，最大应力也是单项式，这些在处理时是可行的。垂直挠度的计算涉及递归关系，但具体细节未展开。","讲者强调，虽然问题本身是非凸的，但通过变量替换可以将其转化为凸问题，这在优化中是一个重要的转换技巧。","讲者提到凸函数的规则可以推广到单项式和拟单调式（posinomials），并举例说明这些规则的类比关系。","讲者指出，虽然问题涉及物理和力学的基本概念，但重点在于数学结构和优化方法的分析，而非物理细节。","讲者提到，通过应用规则，可以将凸函数的性质推广到非凸函数，如单项式和拟单调式，这为处理非凸问题提供了理论基础。"],"formulas":[{"latex":"x^T A x","symbols":"二次型","explanation":"该公式表示一个二次型，其中 $ x $ 是向量，$ A $ 是矩阵。二次型通常用于描述二次函数的结构，但需要确认矩阵 $ A $ 是否为对称矩阵以确保其正确性。","evidence":"So you can use words that you're allowed to say in public. What kind of function is that? It's what? I missed that. Dot product. It's a dot product, right? It's an inner product between W and H. Is it convex in W and H? No. It's a quadratic form, right? It's the quadratic form with matrix 0, like I, I, 0. Right? So this is not convex. So you know already we are not solving a convex problem."},{"latex":"f(x) = x^k","symbols":"单项式","explanation":"该公式表示一个单项式函数，其中 $ x $ 是变量，$ k $ 是指数。单项式是多项式的一种，但需要确认 $ k $ 是否为常数且 $ x $ 是否为实数变量。","evidence":"Or, yeah, well, when we get around to solving this, we'll do this change of variables, and it will become a convex problem. Okay, so these various ratios are monomials, and the maximum stress is a monomial, so those are fine to handle. The vertical deflection comes from, again,"}],"uncertainties":["matrix 0, like I, I, 0"],"diagram":"none","start":3851.89,"end":4000.31,"asr_flags":[],"math_clarifications":["二次型 $ x^T A x $ 需要确认矩阵 $ A $ 是否为对称矩阵，以确保其正确性。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3851.89,"text":"There, it's delicate. You want things to be absolutely as light as possible, but still actually satisfy all the requirements that it's actually going to work. Which means that it's got to be stiff enough, it's got to handle all sorts of dynamic loads, all that kind of stuff. So stuff like this is done all the time. In fact, there's a whole field. It doesn't matter. I'll talk about that later. Okay, so that's it."},{"start":3878.48,"text":"Okay, so here it is in English. And then, you know, in words to work out what these things are, I'm going to just talk about a few of the things and then not, I don't want to focus on it because it's not that critical to us. But here's the total weight. The variables, remember, are W and H. And I would like to ask you, what kind of function is that? I mean, aside from it being a polynomial, which you should never say in public. But what kind of function is this of W and H? Again, pretend you're in public."},{"start":3906.62,"text":"So you can use words that you're allowed to say in public. What kind of function is that? It's what? I missed that. Dot product. It's a dot product, right? It's an inner product between W and H. Is it convex in W and H? No. It's a quadratic form, right? It's the quadratic form with matrix 0, like I, I, 0. Right? So this is not convex. So you know already we are not solving a convex problem."},{"start":3939.96,"text":"Or, yeah, well, when we get around to solving this, we'll do this change of variables, and it will become a convex problem. Okay, so these various ratios are monomials, and the maximum stress is a monomial, so those are fine to handle. The vertical deflection comes from, again,"},{"start":3958.35,"text":"I couldn't defend this, but this is, I mean, I suppose it's just like elementary, you know, baby physics and mechanics or whatever. But it's just, you start at the tip and you go back and it's just a recursion that tells you this. What's kind of cool about this is you look."},{"start":3972.51,"text":"at various things here. But what you'll see is that each of these, right, if you start, you can actually, by applying the rules, oh, I should say, there's a full other set. You can transcribe all the rules you know for convex functions, and they will have analogs for, like, posinomials and monomials. And I'll give you some example, right? Let's just go back. I mean, okay."}],"speech_gaps":[],"frame":"../frames/v006/024.webp","frame_time":3863.89},{"title":"几何规划与凸优化的转换","segments":[{"id":194,"text":"Okay, here we go. I want to do this. Talk to me about the product of monomials. What is that? Product of two monomials. Yes, sir. I have two monomial functions. Again, not in the math sense, in the geometric programming sense. I have two monomial functions, and I take the product. What is it? It's a monomial. It's a monomial, right? What's the sum of two monomials? It's a posinomial. Right, okay. What's the product of two posinomials?","start":4003.22,"end":4034.58},{"id":195,"text":"All right. What is a polynomial divided by a monomial? It's a polynomial. It's fine. What's a polynomial divided by a polynomial? Right. The answer is nothing. We don't know. Okay. So I'm just saying there's a bunch of these rules that you're going to use.","start":4036.61,"end":4065.03},{"id":196,"text":"And down here, I don't want to go into the details, but you just argue that a sum of posinomials is posinomial or whatever, that kind of thing. And what you'll end up finding is that these things are just posinomial functions. They're quite complicated, but they are posinomial functions, right? Anyway, then you reassemble everything to look like this. And there it is in this standard GP form, right? By the way...","start":4066.38,"end":4092.7},{"id":197,"text":"You don't have to do this, right? Because what's clear is that you can actually write these out in some object-oriented, in some domain-specific language, and then something would do all of this stuff for you. And the truth is, you shouldn't even look at this any more than you should look if you actually, the way you should look at, like, after you compile something, why would you look at the bytecode or something like that, right? I mean, you could. A very small number of people have to, because that's what they do.","start":4094.23,"end":4121.13},{"id":198,"text":"But the rest of us should never look at that. You know what I'm saying? And I think the same is kind of true for this, right? So, okay. I think I'll skip this one. This is just some advanced topics. And I'll talk about a couple more things. Just two more main topics. Okay. Oh, to finish up the other one. Geometric programming is your first example of a wide class of...","start":4121.61,"end":4151.38},{"id":199,"text":"non-convex problems that can be transformed to equivalent convex problems and therefore solved. So that's the main point about it. We're going to see plenty of others. We'll see it also happening in statistics and it happens in control and other areas. In fact, I'll even tell you a story. I used to go around and give talks. This was a long, long time ago.","start":4151.64,"end":4175.28}],"notes":["本段主要讲解几何规划中的基本概念，包括单项式（monomials）和多项式（posinomials）的乘积与和的性质。单个单项式的乘积仍然是单项式，而两个单项式的和则形成多项式。同样，两个多项式的乘积仍然是多项式，而两个多项式的和则无法确定，因此需要进一步分析。","讲者提到，几何规划是将非凸问题转换为等效凸问题的一个例子，从而可以使用凸优化方法求解。这种转换在统计学、控制理论和其他领域都有应用。","讲者还提到，虽然这些转换规则在理论上成立，但在实际应用中，通常不需要手动进行这些转换，而是通过编程语言或工具自动完成，类似于编译后的字节码不需要手动查看。","讲者强调，对于大多数用户来说，不需要深入理解这些转换的细节，只需要了解其存在和应用即可。","讲者提到，几何规划是凸优化课程中介绍的一个重要主题，它展示了如何将非凸问题转化为凸问题，从而可以使用现有的凸优化算法进行求解。","最后，讲者提到，几何规划是广泛应用于多个领域的工具，包括统计学、控制理论等，并提到他过去曾多次进行相关讲座，说明这一主题的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4003.22,"end":4175.28,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4003.22,"text":"Okay, here we go. I want to do this. Talk to me about the product of monomials. What is that? Product of two monomials. Yes, sir. I have two monomial functions. Again, not in the math sense, in the geometric programming sense. I have two monomial functions, and I take the product. What is it? It's a monomial. It's a monomial, right? What's the sum of two monomials? It's a posinomial. Right, okay. What's the product of two posinomials?"},{"start":4036.61,"text":"All right. What is a polynomial divided by a monomial? It's a polynomial. It's fine. What's a polynomial divided by a polynomial? Right. The answer is nothing. We don't know. Okay. So I'm just saying there's a bunch of these rules that you're going to use."},{"start":4066.38,"text":"And down here, I don't want to go into the details, but you just argue that a sum of posinomials is posinomial or whatever, that kind of thing. And what you'll end up finding is that these things are just posinomial functions. They're quite complicated, but they are posinomial functions, right? Anyway, then you reassemble everything to look like this. And there it is in this standard GP form, right? By the way..."},{"start":4094.23,"text":"You don't have to do this, right? Because what's clear is that you can actually write these out in some object-oriented, in some domain-specific language, and then something would do all of this stuff for you. And the truth is, you shouldn't even look at this any more than you should look if you actually, the way you should look at, like, after you compile something, why would you look at the bytecode or something like that, right? I mean, you could. A very small number of people have to, because that's what they do."},{"start":4121.61,"text":"But the rest of us should never look at that. You know what I'm saying? And I think the same is kind of true for this, right? So, okay. I think I'll skip this one. This is just some advanced topics. And I'll talk about a couple more things. Just two more main topics. Okay. Oh, to finish up the other one. Geometric programming is your first example of a wide class of..."},{"start":4151.64,"text":"non-convex problems that can be transformed to equivalent convex problems and therefore solved. So that's the main point about it. We're going to see plenty of others. We'll see it also happening in statistics and it happens in control and other areas. In fact, I'll even tell you a story. I used to go around and give talks. This was a long, long time ago."}],"speech_gaps":[],"frame":"../frames/v006/025.webp","frame_time":4015.22},{"title":"凸优化中的锥形式问题与半定规划","segments":[{"id":200,"text":"And I would say, look, here's a problem in control. Oh, it's convex. Here's another problem in control. Oh, look, it's convex. And I said, I had a slide that was like, I said, here's an example of a problem. And I said, I don't think it's convex, right? So anyway, so I went around, gave that talk to several thousand people. I was at Berkeley. I gave the talk. A colleague of mine came up to me afterwards and he said, oh, you see that problem that you just said was probably non-convex? I was like, yeah.","start":4176.16,"end":4202.0},{"id":201,"text":"And he said, can I show you something? I was like, sure. Anyway, he had some completely sick, demented change of variables. Like instead of this positive definite matrix, we're going to work in the inverse. And instead of these, we're going to work in the inverse of this times that. And I was like, Andy, why would anyone do that? And he goes, watch this. Two lines later, it's convex. And I step away and I'm like, oh no, oh no. I've been telling people all over the world that it was not convex. Then we looked at my slide and it was really awesome.","start":4202.5,"end":4231.08},{"id":202,"text":"it says it says a problem that's not convex and there was a little footnote and it said probably so i was safe then by the way after that i told that story every time so i said so yeah so basically you should be very careful because this this anyway so okay fine back to this one now we're back to honest convex problems okay so","start":4231.67,"end":4252.82},{"id":203,"text":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k","start":4254.58,"end":4281.58},{"id":204,"text":"is the non-negative orthant. This is just a pedantic way to write down an LP, right? But the cool part is K could be other cones. And then you get, like, if I make K a product of second order cones, this is SOCP. But I can have other things too. And a very famous one is so-called semi-definite programming. So that's something you will see. This is probably, it's not bad to have heard it.","start":4282.27,"end":4307.29},{"id":205,"text":"People talk about it in actually a whole bunch of fields now, right? So in theoretical computer science, people blabber about it. People in physics use it. So it's become mainstream in the last 20, 25 years. Here it is. You minimize a linear function subject to equality constraint, linear equality. And then you have a single inequality.","start":4307.88,"end":4328.16},{"id":206,"text":"which looks like this. In fact, it looks like a linear inequality. If these were scalars, and that was ordinary less than or equal to, this would be a single linear inequality. It would be a silly LP. But here, these are symmetric matrices, and this says this linear combination, this affine function, which is a symmetric matrix, has to be negative semi-definite. So that's called a semi-definite program.","start":4328.96,"end":4353.95}],"notes":["本段主要讲述凸优化中锥形式问题的引入，强调了从标量不等式约束到向量约束的转变。讲者提到锥形式问题的一个著名例子是锥形式问题（cone form problem），并指出当锥K为非负正交锥时，这实际上是一种线性规划（LP）的写法。此外，还提到K可以是其他锥，如二次锥（SOCP）或半正定锥（SDP），并指出半正定规划在多个领域中已成为主流。","讲者通过一个例子说明了半正定规划的定义：在约束中，对称矩阵的线性组合必须是负半定的。这表明半正定规划是凸优化的一个重要子类，其约束条件涉及矩阵的半正定性，而不仅仅是标量不等式。","讲者提到，半正定规划在理论计算机科学和物理学等领域中被广泛讨论，并且在过去20到25年中已成为主流。这表明半正定规划在实际应用中具有广泛的适用性。","讲者通过一个具体的例子说明了半正定规划的约束形式：对称矩阵的线性组合必须是负半定的。这表明半正定规划的约束条件比一般的线性规划更为复杂，但仍然是凸优化问题。","讲者强调了在凸优化中，从标量不等式约束到向量约束的转变，以及锥形式问题的重要性。这表明在凸优化中，锥形式问题是一个重要的研究方向，其应用范围广泛。","讲者通过一个具体的例子说明了半正定规划的约束形式，并指出这种形式在实际应用中具有重要意义。这表明半正定规划是凸优化中的一个重要子类，其约束条件涉及矩阵的半正定性。"],"formulas":[{"latex":"minimize c^T x","symbols":"目标函数为线性函数","explanation":"目标函数为线性函数，符合凸优化问题的常见形式。","evidence":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k"},{"latex":"Ax + b \\text{ is in } K","symbols":"约束条件为向量约束","explanation":"约束条件为向量约束，其中K表示锥体，符合锥形问题的定义。","evidence":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k"},{"latex":"A x = b","symbols":"等式约束","explanation":"等式约束，符合凸优化问题的常见形式。","evidence":"People talk about it in actually a whole bunch of fields now, right? So in theoretical computer science, people blabber about it. People in physics use it. So it's become mainstream in the last 20, 25 years. Here it is. You minimize a linear function subject to equality constraint, linear equality. And then you have a single inequality."},{"latex":"F x + g \\text{ is negative semi-definite}","symbols":"半正定约束","explanation":"半正定约束，符合半正定规划的定义。","evidence":"which looks like this. In fact, it looks like a linear inequality. If these were scalars, and that was ordinary less than or equal to, this would be a single linear inequality. It would be a silly LP. But here, these are symmetric matrices, and this says this linear combination, this affine function, which is a symmetric matrix, has to be negative semi-definite. So that's called a semi-definite program."}],"uncertainties":[],"diagram":"none","start":4176.16,"end":4353.95,"asr_flags":[],"math_clarifications":["所有公式均符合凸优化问题的常见形式，未发现明显的数学错误。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4176.16,"text":"And I would say, look, here's a problem in control. Oh, it's convex. Here's another problem in control. Oh, look, it's convex. And I said, I had a slide that was like, I said, here's an example of a problem. And I said, I don't think it's convex, right? So anyway, so I went around, gave that talk to several thousand people. I was at Berkeley. I gave the talk. A colleague of mine came up to me afterwards and he said, oh, you see that problem that you just said was probably non-convex? I was like, yeah."},{"start":4202.5,"text":"And he said, can I show you something? I was like, sure. Anyway, he had some completely sick, demented change of variables. Like instead of this positive definite matrix, we're going to work in the inverse. And instead of these, we're going to work in the inverse of this times that. And I was like, Andy, why would anyone do that? And he goes, watch this. Two lines later, it's convex. And I step away and I'm like, oh no, oh no. I've been telling people all over the world that it was not convex. Then we looked at my slide and it was really awesome."},{"start":4231.67,"text":"it says it says a problem that's not convex and there was a little footnote and it said probably so i was safe then by the way after that i told that story every time so i said so yeah so basically you should be very careful because this this anyway so okay fine back to this one now we're back to honest convex problems okay so"},{"start":4254.58,"text":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k"},{"start":4282.27,"text":"is the non-negative orthant. This is just a pedantic way to write down an LP, right? But the cool part is K could be other cones. And then you get, like, if I make K a product of second order cones, this is SOCP. But I can have other things too. And a very famous one is so-called semi-definite programming. So that's something you will see. This is probably, it's not bad to have heard it."},{"start":4307.88,"text":"People talk about it in actually a whole bunch of fields now, right? So in theoretical computer science, people blabber about it. People in physics use it. So it's become mainstream in the last 20, 25 years. Here it is. You minimize a linear function subject to equality constraint, linear equality. And then you have a single inequality."},{"start":4328.96,"text":"which looks like this. In fact, it looks like a linear inequality. If these were scalars, and that was ordinary less than or equal to, this would be a single linear inequality. It would be a silly LP. But here, these are symmetric matrices, and this says this linear combination, this affine function, which is a symmetric matrix, has to be negative semi-definite. So that's called a semi-definite program."}],"speech_gaps":[],"frame":"../frames/v006/026.webp","frame_time":4188.16},{"title":"线性矩阵不等式与半定规划","segments":[{"id":207,"text":"And, oh, this thing is called an LMI, a linear matrix inequality. It's like a linear inequality, except it's a matrix inequality. So, okay. And, you know, there's things that you do. This says you only have one, but you could jus 源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4532.6,"text":"with these coefficients, right? And I'd like you to choose x1 through xn to minimize the maximum eigenvalue of that matrix. Now, we already discussed this. You know that's convex, right? But that doesn't mean it's obvious how to solve that problem. It turns out it's just an SDP, and it literally looks like that. It's really dumb. This is, by the way, that's an epigraph."},{"start":4554.85,"text":"for the maximum eigenvalue, right? That the maximum eigenvalue is less than something if and only if that matrix is less than or equal to times t to the identity, right? Okay, so that's the idea. By the way, how many people here have encountered or heard of SDP somewhere else? Just for fun. You did? Cool. Where? What context? Theoretical computer science. Ah, there we go. Awesome. Right."},{"start":4581.7,"text":"Did anyone know that you could actually solve them except for theoretically? No, not really. Okay, yeah, I thought so. Okay, that's fine. That's cool. Totally cool. I have lots of friends who do that. There was another one who saw it. Yes? What? These statistics. These statistics. Okay, cool. Yeah. Okay, good. So it's getting, I mean, it's obviously not totally mainstream or half the class would have raised their hand, but, you know, it's getting there. It's not like, it's not crazy stuff anymore."},{"start":4611.49,"text":"Okay. Oh, here's an interesting one. Like minimize the, this is a two norm. So that's the induced two norm. It's the maximum singular value, right? Of a matrix. And it says, please like minimize that over some affine set. And this too, you do the same, you do the same thing. You express this as a, as a, an LMI. And then, then everything works out. And the conclusion is you, we could just solve these problems now. We just, we can just solve them."},{"start":4642.03,"text":"So it's actually, it's kind of interesting and cool. Yeah, so, okay. And I think what we'll do is we're going to quit here. We have one more very important topic on optimization next week. And next week we're going to do duality, which is actually super interesting. It's still theoretical, but it's actually super practical."}],"speech_gaps":[],"frame":"../frames/v006/028.webp","frame_time":4544.6}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
