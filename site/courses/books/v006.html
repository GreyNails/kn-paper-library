}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">06 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 6 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v006","title":"06 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 6","course":"凸优化","pages":[{"title":"凸优化中的拟凸函数与子水平集","segments":[{"id":0,"text":"So today, we're going to finish this whirlwind tour through problems, different types of problems and formulations and things like that, and some named problem classes. So last time, I think we quit right around here on quasi-convex optimization. So that's when you minimize a quasi-convex objective.","start":5.3,"end":27.44},{"id":1,"text":"Here, you have to be, I mean, you should be a little bit worried because, in fact, the basic, you know, probably the most important fact about convex problems is that you can't have a local minimum that's not a global minimum, right? But for quasi-convex optimization, that's false. You can have that, right? So you have to be a little bit more careful. Not that much careful. It's not that hard to solve. So the way you do this...","start":31.54,"end":58.24},{"id":2,"text":"is if a function is quasi-convex, it means its sublevel sets are convex. And so what we introduce is a function whose zero sublevel set is the t sublevel set of your function.","start":58.57,"end":72.97},{"id":3,"text":"And so this function has to be convex. And how you construct phi t, there's completely generic constructions of it. They're not useful, but when people ask you, how do you come up with that phi of t? You can always do it. Often it just is suggested by the problem. We looked at an example last time that was this. I mean, here's an interesting one. It's the ratio of...","start":75.08,"end":99.58},{"id":4,"text":"of a non-negative over a positive function, the numerator is convex and the denominator is concave, right? So this function here, it is definitely not convex necessarily, but it is quasi-convex. And to check that, what you do is you look at the sub-level set of this. When is it true that p of x divided by q of x is less than or equal to t? If t is negative,","start":100.03,"end":127.57},{"id":5,"text":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?","start":128.92,"end":151.74},{"id":6,"text":"Now the critical part. This is a convex function of x provided t is positive. That's because q is concave, right? So you're just using one of these simple rules in your head. That's concave multiplied by t positive, still concave, minus, now it's convex. And then it's a sum, right? So this is the example. And what this allows you to do is really cool. It says that if I wanted to check","start":152.21,"end":179.33}],"notes":["本段讲解了拟凸函数的定义及其子水平集的性质。拟凸函数的子水平集是凸集，这是判断函数是否为拟凸的重要依据。同时，通过一个具体的例子，即两个函数的比值（分子为凸函数，分母为凹函数），说明了如何判断该函数是否为拟凸。"],"formulas":[{"latex":"p(x)/q(x) \\text{ 是拟凸函数}","symbols":"p(x) 是凸函数，q(x) 是凹函数，它们的比值是拟凸函数","explanation":"该公式正确描述了当分子是凸函数、分母是凹函数时，它们的比值是拟凸函数的数学性质。","evidence":"of a non-negative over a positive function, the numerator is convex and the denominator is concave, right? So this function here, it is definitely not convex necessarily, but it is quasi-convex. And to check that, what you do is you look at the sub-level set of this. When is it true that p of x divided by q of x is less than or equal to t? If t is negative,"},{"latex":"p(x)/q(x) \\text{ 小于等于 } t","symbols":"当 t 为负数时，该不等式成立的子水平集为空集，因此是凸集","explanation":"该公式正确描述了当 t 为负数时，p(x)/q(x) ≤ t 的子水平集为空集，因此是凸集。","evidence":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?"},{"latex":"p(x) - t q(x) \\text{ 小于等于零}","symbols":"当 t 为正数时，该不等式等价于 p(x)/q(x) \\text{ 小于等于 } t","explanation":"该公式正确描述了当 t 为正数时，p(x)/q(x) ≤ t 等价于 p(x) - t q(x) ≤ 0 的数学关系。","evidence":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?"}],"uncertainties":[],"diagram":"none","start":5.3,"end":179.33,"asr_flags":[],"math_clarifications":["公式中的符号和数学关系均符合拟凸函数的定义和性质，无需进一步修正。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.3,"text":"So today, we're going to finish this whirlwind tour through problems, different types of problems and formulations and things like that, and some named problem classes. So last time, I think we quit right around here on quasi-convex optimization. So that's when you minimize a quasi-convex objective."},{"start":31.54,"text":"Here, you have to be, I mean, you should be a little bit worried because, in fact, the basic, you know, probably the most important fact about convex problems is that you can't have a local minimum that's not a global minimum, right? But for quasi-convex optimization, that's false. You can have that, right? So you have to be a little bit more careful. Not that much careful. It's not that hard to solve. So the way you do this..."},{"start":58.57,"text":"is if a function is quasi-convex, it means its sublevel sets are convex. And so what we introduce is a function whose zero sublevel set is the t sublevel set of your function."},{"start":75.08,"text":"And so this function has to be convex. And how you construct phi t, there's completely generic constructions of it. They're not useful, but when people ask you, how do you come up with that phi of t? You can always do it. Often it just is suggested by the problem. We looked at an example last time that was this. I mean, here's an interesting one. It's the ratio of..."},{"start":100.03,"text":"of a non-negative over a positive function, the numerator is convex and the denominator is concave, right? So this function here, it is definitely not convex necessarily, but it is quasi-convex. And to check that, what you do is you look at the sub-level set of this. When is it true that p of x divided by q of x is less than or equal to t? If t is negative,"},{"start":128.92,"text":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?"},{"start":152.21,"text":"Now the critical part. This is a convex function of x provided t is positive. That's because q is concave, right? So you're just using one of these simple rules in your head. That's concave multiplied by t positive, still concave, minus, now it's convex. And then it's a sum, right? So this is the example. And what this allows you to do is really cool. It says that if I wanted to check"}],"speech_gaps":[],"frame":"../frames/v006/001.webp","frame_time":17.3},{"title":"凸优化中的二分法与线性规划简介","segments":[{"id":7,"text":"Does there exist an x for which f0 of x is less than t? I can check it by solving a convex feasibility problem, right? So that's kind of the idea here, which is really cool. And then, of course, what you could do is you can just do bisection, right? You just say, well, can you find an x where f0 of x is less than 1.5? And if the answer is yes, then you go, cool. And by the way, you now have a feasible point with an objective value of 1.5 or better.","start":179.81,"end":205.45},{"id":8,"text":"Then you'd say, all right, how about 1? Or how about 0.5? Or how about minus 1? This kind of thing. So, I mean, not minus 1 in this case, but still. Anyway, that's just bisection. And that actually works. So, you know, the algorithm is actually just what I said. I start with an upper and a lower bound on the optimal value of the objective. I just query. I ask.","start":206.72,"end":233.48},{"id":9,"text":"what I do is I take the midpoint of that interval and I ask, I solve a convex feasibility problem to find out if these inequalities hold. If they do, then that tells you that P star is less than or equal to that value, right? It means you're above. And by the way, now I update my upper bound. I pull it down to this halfway mark.","start":234.13,"end":256.45},{"id":10,"text":"If it goes the other way around, I take my lower bound and I pull it up to the halfway mark. And what this tells you is that your, let's see, your interval of ignorance about the optimal value, right? P star is in some interval. That interval shrinks by a factor of two every iteration, right? Or you could even say this. You could say that you obtain one bit of information.","start":257.1,"end":281.4},{"id":11,"text":"about P star every time you solve one of these convex feasibility problems, right? And by one bit, I mean that you actually reduce your uncertainty exactly by a factor of two, okay? So that's it. And this is kind of standard and it works and so on. So that's quasi-convex optimization. Okay, what we're gonna do now is we're gonna talk about a whole bunch of different problems. Some of them actually have names. So there's named problem classes.","start":283.0,"end":310.96},{"id":12,"text":"I'm just trying to think, you know, it's maybe much less important these days that you know these,","start":312.46,"end":316.66},{"id":13,"text":"but things like this is just basic, and there'll be people who don't know other stuff,","start":317.42,"end":321.42},{"id":14,"text":"and they'll know these, so you just have to know these names, right?","start":321.54,"end":325.46},{"id":15,"text":"So, linear program is a famous one, that's LP, and we already encountered this a couple of weeks ago.","start":325.58,"end":333.6},{"id":16,"text":"It's minimize an affine function subject to a set of affine inequality constraints here,","start":333.84,"end":340.52},{"id":17,"text":"here, and an equality constraint. Or another way to say it is, you know, the d doesn't","start":340.52,"end":345.26},{"id":18,"text":"matter here. If I remove d, this becomes an equivalent problem. It's not the same, it's","start":345.26,"end":349.86},{"id":19,"text":"equivalent. It's an equivalent problem. And so it basically says minimize a linear function","start":349.86,"end":354.4},{"id":20,"text":"over a polyhedron. So that's actually another way to state what a linear program is.","start":354.4,"end":359.72}],"notes":["本段讲解了凸优化中使用二分法寻找最优值的思路，通过不断缩小上下界区间来逼近最优值。每次通过求解一个凸可行性问题来判断当前中间值是否可行，若可行则更新上界，否则更新下界。这种方法每次迭代将不确定性区间缩小一半，相当于获得一个比特的信息。","接下来，课程转向介绍不同类型的优化问题，特别是线性规划（LP）。线性规划是最著名的优化问题之一，其目标是最小化一个仿射函数，约束条件包括一组仿射不等式约束和一个等式约束。","讲者提到，线性规划可以等价地表述为最小化一个线性函数，约束条件为一个凸多面体。这种等价性说明了线性规划问题的结构特点，即目标函数和约束函数都是线性的。","讲者还指出，虽然这些命名的问题可能在现代课程中不如以前重要，但它们仍然是基础内容，某些人可能更熟悉这些名称，因此需要掌握这些术语。","最后，讲者强调了线性规划的定义，即最小化一个线性函数在凸多面体上的问题，这为后续讨论其他优化问题（如二次规划、半定规划等）奠定了基础。","整个段落展示了凸优化中二分法的应用和线性规划的基本概念，强调了其在优化理论中的重要性。"],"formulas":[],"uncertainties":["d doesn't matter here. If I remove d, this becomes an equivalent problem."],"diagram":"none","start":179.81,"end":359.72,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":179.81,"text":"Does there exist an x for which f0 of x is less than t? I can check it by solving a convex feasibility problem, right? So that's kind of the idea here, which is really cool. And then, of course, what you could do is you can just do bisection, right? You just say, well, can you find an x where f0 of x is less than 1.5? And if the answer is yes, then you go, cool. And by the way, you now have a feasible point with an objective value of 1.5 or better."},{"start":206.72,"text":"Then you'd say, all right, how about 1? Or how about 0.5? Or how about minus 1? This kind of thing. So, I mean, not minus 1 in this case, but still. Anyway, that's just bisection. And that actually works. So, you know, the algorithm is actually just what I said. I start with an upper and a lower bound on the optimal value of the objective. I just query. I ask."},{"start":234.13,"text":"what I do is I take the midpoint of that interval and I ask, I solve a convex feasibility problem to find out if these inequalities hold. If they do, then that tells you that P star is less than or equal to that value, right? It means you're above. And by the way, now I update my upper bound. I pull it down to this halfway mark."},{"start":257.1,"text":"If it goes the other way around, I take my lower bound and I pull it up to the halfway mark. And what this tells you is that your, let's see, your interval of ignorance about the optimal value, right? P star is in some interval. That interval shrinks by a factor of two every iteration, right? Or you could even say this. You could say that you obtain one bit of information."},{"start":283.0,"text":"about P star every time you solve one of these convex feasibility problems, right? And by one bit, I mean that you actually reduce your uncertainty exactly by a factor of two, okay? So that's it. And this is kind of standard and it works and so on. So that's quasi-convex optimization. Okay, what we're gonna do now is we're gonna talk about a whole bunch of different problems. Some of them actually have names. So there's named problem classes."},{"start":312.46,"text":"I'm just trying to think, you know, it's maybe much less important these days that you know these,"},{"start":317.42,"text":"but things like this is just basic, and there'll be people who don't know other stuff,"},{"start":321.54,"text":"and they'll know these, so you just have to know these names, right?"},{"start":325.58,"text":"So, linear program is a famous one, that's LP, and we already encountered this a couple of weeks ago."},{"start":333.84,"text":"It's minimize an affine function subject to a set of affine inequality constraints here,"},{"start":340.52,"text":"here, and an equality constraint. Or another way to say it is, you know, the d doesn't"},{"start":345.26,"text":"matter here. If I remove d, this becomes an equivalent problem. It's not the same, it's"},{"start":349.86,"text":"equivalent. It's an equivalent problem. And so it basically says minimize a linear function"},{"start":354.4,"text":"over a polyhedron. So that's actually another way to state what a linear program is."}],"speech_gaps":[],"frame":"../frames/v006/002.webp","frame_time":191.81},{"title":"线性规划的历史与基本概念","segments":[{"id":21,"text":"So actually, the modern history starts in around the 40s for linear programming, but","start":362.66,"end":369.38},{"id":22,"text":"But in fact, I think Fourier wrote a paper","start":369.38,"end":371.48},{"id":23,"text":"about linear programming.","start":371.48,"end":372.5},{"id":24,"text":"So that tells you it's not totally new.","start":372.82,"end":376.18},{"id":25,"text":"It became a whole lot more interesting","start":377.94,"end":380.04},{"id":26,"text":"when you could actually compute stuff.","start":380.76,"end":382.24},{"id":27,"text":"So that would be after the age of computers.","start":382.48,"end":384.54},{"id":28,"text":"So, okay.","start":384.92,"end":385.72},{"id":29,"text":"So a picture looks like this, right?","start":386.46,"end":388.16},{"id":30,"text":"Here's your feasible set.","start":388.26,"end":389.26},{"id":31,"text":"It's a polyhedron.","start":389.34,"end":390.26},{"id":32,"text":"Each of these faces is a row, a single linear inequality.","start":390.34,"end":394.94},{"id":33,"text":"So that's what this is.","start":395.32,"end":396.42},{"id":34,"text":"And so these are the feasible points.","start":396.54,"end":398.02},{"id":35,"text":"points, and there's a vector c, it points this direction. These dashed lines show you","start":398.02,"end":404.42},{"id":36,"text":"the level curves of the objective, which is c transpose x. Obviously, it's going to be","start":404.42,"end":409.5},{"id":37,"text":"orthogonal. They're orthogonal to c.","start":409.5,"end":411.7},{"id":38,"text":"What it says is, you know, this might be 3, 2, 1, 0. Okay? Like, and so on. I mean, there'd be minus 1, minus 2, and so on, right? And so your job is to basically slide in this thing, go this direction as far as you possibly can. And that would be like this point here, right? So, I mean, this is very, I mean, this picture is not a bad one to have in your mind because it explains what an LP is. You know, obviously...","start":413.77,"end":441.26},{"id":39,"text":"We are not interested in solving LPs with two variables because you can do it with your eyeball. Okay. So what we're interested in is solving LPs with 10,000 variables and 30,000 constraints. Okay. People do that all like right now. I guarantee you a lot of those are being done right now. It's used for all sorts of things like scheduling, supply chain stuff. It's just used everywhere. So like in my opinion, everyone should know about it. Okay. This is linear programming.","start":441.8,"end":470.98},{"id":40,"text":"So actually, the first example is historical. And I think that's it's kind of cool because it's but it's just part respecting history anyway. So this is from maybe from maybe 1940s or 50s. And it's the diet problem. So I think it allegedly was supposed to be from the military. Like, how do you how do you how do you construct a diet that will keep?","start":473.23,"end":497.48},{"id":41,"text":"And what we'll have is we have a bunch of foods. So food J, when you get one unit of it, doesn't matter what a unit is, but one unit of it is going to have an amount AIJ of nutrient I. So we care about a bunch of nutrients, right? Like you're, you know, you're maybe 10 or 20 or five or something like that, various nutrients. And a healthy diet is going to require nutrient I.","start":497.85,"end":513.61},{"id":42,"text":"And what we'll have is we have a bunch of foods. So food J, when you get one unit of it, doesn't matter what a unit is, but one unit of it is going to have an amount AIJ of nutrient I. So we care about a bunch of nutrients, right? Like you're, you know, you're maybe 10 or 20 or five or something like that, various nutrients. And a healthy diet is going to require nutrient I.","start":515.73,"end":541.9}],"notes":["本段介绍了线性规划的一个历史实例，即饮食问题。该问题起源于20世纪40年代或50年代，最初用于军事领域，目的是以最低成本维持士兵的健康。问题中涉及多种食物和营养素，每种食物含有不同数量的营养素，目标是选择食物的组合，以满足所有营养需求且成本最低。","讲者提到，线性规划问题通常涉及大量变量和约束条件，例如10,000个变量和30,000个约束，这类问题需要计算机求解，而不能仅靠人工计算。这说明了线性规划在实际应用中的重要性，如调度、供应链管理等。","在讲者描述的饮食问题中，每种食物对应一个变量，表示该食物的摄入量，且变量必须是非负的。每种营养素的摄入量由食物的组合决定，目标是满足所有营养需求，同时最小化总成本。","讲者还提到，线性规划的几何解释中，可行集是一个多面体，目标函数的等高线与目标向量正交。这说明了线性规划的优化过程是沿着目标方向寻找可行解的最优点。","讲者强调，线性规划是凸优化的一个重要子领域，其目标函数和约束条件都是线性的，因此问题具有全局最优解的性质。这使得线性规划在实际应用中非常可靠。","最后，讲者指出，线性规划在现代社会中被广泛使用，涉及多个领域，如工业、经济、军事等。因此，掌握线性规划的基本概念和方法对学习者来说是非常重要的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":362.66,"end":541.9,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":362.66,"text":"So actually, the modern history starts in around the 40s for linear programming, but"},{"start":369.38,"text":"But in fact, I think Fourier wrote a paper"},{"start":371.48,"text":"about linear programming."},{"start":372.82,"text":"So that tells you it's not totally new."},{"start":377.94,"text":"It became a whole lot more interesting"},{"start":380.76,"text":"when you could actually compute stuff."},{"start":382.48,"text":"So that would be after the age of computers."},{"start":384.92,"text":"So, okay."},{"start":386.46,"text":"So a picture looks like this, right?"},{"start":388.26,"text":"Here's your feasible set."},{"start":389.34,"text":"It's a polyhedron."},{"start":390.34,"text":"Each of these faces is a row, a single linear inequality."},{"start":395.32,"text":"So that's what this is."},{"start":396.54,"text":"And so these are the feasible points."},{"start":398.02,"text":"points, and there's a vector c, it points this direction. These dashed lines show you"},{"start":404.42,"text":"the level curves of the objective, which is c transpose x. Obviously, it's going to be"},{"start":409.5,"text":"orthogonal. They're orthogonal to c."},{"start":413.77,"text":"What it says is, you know, this might be 3, 2, 1, 0. Okay? Like, and so on. I mean, there'd be minus 1, minus 2, and so on, right? And so your job is to basically slide in this thing, go this direction as far as you possibly can. And that would be like this point here, right? So, I mean, this is very, I mean, this picture is not a bad one to have in your mind ly as matrix stuffing.","start":726.91,"end":746.68},{"id":51,"text":"Yeah, because, yeah. Actually, I think actually that doesn't even fit our general, you know, our general form was very restricted. It was like, you know, fi is less than or equal to zero and stuff. So, but for sure, even if, I mean, yeah, when you do these small transformations, which keep everything equivalent, the thing you transform something or reduce something to, to use the computer science term, is not the same problem. It is equivalent. Yeah, so, okay.","start":747.4,"end":777.56},{"id":52,"text":"All right, so back to, oh, so that's our, here's our healthiest diet thing. What if I had an upper limit on a nutrient? I mean, could we handle it? Yeah, it's kind of something similar. The answer's sure, that would be. We could certainly do that. What if there were supply availability issues and some of these goods, some of these foods are only available up to some current limit of supply?","start":778.39,"end":810.7},{"id":53,"text":"Of course you could handle that. So once you start figuring out how to do this, you can see that it's very expressive. There's a lot of stuff you could do with it. So this is just a very famous historical example. I think it's probably one of the first ones that people ever talked about.","start":811.72,"end":827.2},{"id":54,"text":"Next up, for fun, is piecewise linear minimization. So this is a piecewise linear function, right, expressed as the maximum of a bunch of affine functions. So each one of those has a graph that's like a plane, and then you just intersect them, and that's your piecewise linear function, right? And then you want to minimize it, right? And so the way this would work is if I walk up to you and I said, is that an LP?","start":829.52,"end":851.3}],"notes":["本段讨论了线性规划在实际应用中的挑战，例如手动处理和调试线性规划问题的困难，以及将其转换为标准形式的繁琐过程。讲者提到这种过程被称为'matrix stuffing'，是一种带有讽刺意味的说法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":699.92,"end":851.3,"asr_flags" 's a lot of stuff you could do with it. So this is just a very famous historical example. I think it's probably one of the first ones that people ever talked about."},{"start":829.52,"text":"Next up, for fun, is piecewise linear minimization. So this is a piecewise linear function, right, expressed as the maximum of a bunch of affine functions. So each one of those has a graph that's like a plane, and then you just intersect them, and that's your piecewise linear function, right? And then you want to minimize it, right? And so the way this would work is if I walk up to you and I said, is that an LP?"}],"speech_gaps":[],"frame":"../frames/v006/005.webp","frame_time":711.92},{"title":"线性规划与Chebyshev中心","segments":[{"id":55,"text":"You would have to say no, because, I mean, to check if something is an LP or a linear program, the first thing you do is you check, is the objective linear or affine? It's not, right? I mean, if m is more than 1, it's not affine, right? Okay, so, but in fact, this easily converts to an LP, and you do that by the epigraph form. So you just introduce a new variable t here, and then these constraints here basically say,","start":852.09,"end":880.85},{"id":56,"text":"that xt is in the epigraph of that function. Or you could just think of it this way. It just says that t is an upper bound on the max of these things. So this would typically, this would actually, this problem here says, minimize the upper bound on the max, but also mess with the x's, right? And so you can quickly argue, you could easily, it's not, I mean, someone has to do it, but you could show that these are actually equivalent. Actually, quite specifically, if you solve that, that's an LP, that's an honest LP.","start":881.4,"end":909.82},{"id":57,"text":"Right there. That is a linear objective. And these are like linear constraints. Okay, fine. If you wanted to, put the T on the other side. Right? But that's sort of in that thing, and I'm not going to show that type of thing. Everybody got this? So it's kind of cool. And this already is actually kind of useful. Just the ability to... And by the way, most people... Let's see. If you're actually doing this kind of stuff, if you came up with this, and someone said...","start":910.26,"end":938.67},{"id":58,"text":"Well, cool, but how do I solve that? People just look at you and go like, it's an LP. So people would expect you to know that. Or cool people would anyway. Other people would. God only knows what they would do. I do know some of the things they would do. Okay. So we're looking at another example, again, of linear programming. Actually, I think it's actually our first glimpse at...","start":939.0,"end":965.03},{"id":59,"text":"this issue of finding a point that's... Actually, I'll start second. Find a point that's deep inside a set, like a center. I think we talked about... We already found... We already encountered it once. It was the yield center. It says, here's your region of stuff that works. Dial up the machines to get a target so that your yield is maximized. So that was one notion of the center. This is another one. It's a Chebyshev center.","start":966.02,"end":990.28},{"id":60,"text":"Here's my polyhedron described by linear inequalities. And your job is this. You want to find the largest inscribed ball. Inscribed means it's inside the polyhedron. Basically, you want to find the largest ball that fits inside the polyhedron. Everybody got it? That's the question. Let me just mention one thing right here, because it's probably worth mentioning.","start":991.52,"end":1019.88}],"notes":["本段讨论了如何将非线性规划问题转换为线性规划问题。首先，讲者指出，判断一个问题是线性规划的关键在于目标函数是否为线性或仿射函数。如果目标函数不是线性或仿射函数，则不能直接归类为线性规划。但通过引入新的变量t，并使用上确界形式（epigraph form），可以将问题转换为线性规划问题。","讲者进一步解释了上确界形式的含义，即t是这些函数的最大值的上界。因此，问题转化为最小化这个上界，同时还要处理变量x。讲者指出，这种转换是可行的，并且最终得到的优化问题是一个标准的线性规划问题。","接下来，讲者提到线性规划的一个应用是寻找集合中的中心点，特别是Chebyshev中心。Chebyshev中心指的是在给定的多面体（由线性不等式描述）中，能够容纳最大球体的中心点。这个球体必须完全包含在多面体内部。","讲者强调，寻找Chebyshev中心的问题可以通过线性规划来解决。具体来说，目标是找到 eel.","start":1576.67,"end":1600.17},{"id":99,"text":"various other things, and, you know, that it produces cars, like just as an example. Okay, so what this says is, so AX, when you multiply the matrix A by the vector X, what you get is the vector of, you get what is produced this year.","start":1601.89,"end":1623.32},{"id":100,"text":"That's the set of goods that were produced this year. And the model here is very simple. If this is year, quarters, or months, it doesn't matter. The idea is that what's produced this year, we kind of imagine, is not immediately fed into, but it's almost as if, well, we do this in discrete time.","start":1624.38,"end":1640.86},{"id":101,"text":"So what's produced now is kind of held in escrow for a year. And then on January 1st, everything starts up again and you use those. So what this says is that's the vector of resources consumed by economic activity next year.","start":1641.3,"end":1654.38},{"id":102,"text":"And it says that is less than or equal to what you produced this year. And there's tons of variations on this, right? We could do all sorts of variations on this. We could have, for example, we could do this for 10 periods and have a running, you know, a stockpile of stuff, right? So, okay. Everybody, but this is the basic one. It makes sense? Okay. And this is just immediately a generalized linear fractional problem. A few things here. I'm maximizing a min.","start":1655.03,"end":1684.11},{"id":103,"text":"Whereas this thing should say minimize a maximum. But you just flip the sign and everything's cool. Everybody got it? And by the way, things like this, these are not obvious things. I guarantee you with 10 sectors, you could not figure this out by hand. I mean, it's just absolutely out of the question. So, I mean, but of course...","start":1684.67,"end":1706.93}],"notes":["本段讲授了经济活动水平的优化问题，重点在于如何通过凸优化方法最大化最小增长。讲者首先通过钢铁制造业增长6%的例子，说明了如何将百分比变化转化为数值，如1.06表示增长6%。接着，讲者指出如果数值为0.93，则表示收缩7%。这为后续的优化问题提供了背景。","讲者进一步说明了优化的目标是确定合适的经济活动水平，以最大化各经济部门的最小增长。这涉及到一个约束条件，即资源消耗不能超过生产量。讲者提到，这种问题可以建模为一个线性分数规划问题，但需要通过凸优化方法来解决。","讲者强调了这种问题的复杂性，特别是当涉及多个部门时，手动计算几乎是不可能的。因此，需要借助凸优化方法来处理。讲者还提到，这种问题的结构可以扩展到多个时间段，例如10个周期，并且可以考虑库存的累积。","讲者指出，这种问题的优化目标是最大化最小增长，但通常在数学上，这需要将问题转化为最小化最大损失，通过翻转符号即可实现。这说明了凸优化问题中目标函数和约束条件的转换关系。","讲者还提到，这种问题的结构和解法并不是显而易见的，特别是在涉及多个部门和复杂约束时。因此，凸优化方法在处理这类问题时具有重要的应用价值。","最后，讲者强调了凸优化方法在处理经济活动优化问题中的必要性，特别是在大规模和复杂系统中，手动计算是不可行的，必须依赖数学工具和算法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1531.87,"end":1706.93,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1531.87,"text":"I don't know, you know, steel manufacturing went up 6%, it means that this number is 1.06."},{"start":1538.51,"text":"If it's 0.93, it means that it actually contracted 7%. Everybody got it? Okay, so here's what we want."},{"start":1547.25,"text":"We want to figure out what would be the right economic activity levels to maximize the minimum"},{"start":1555.23,"text":"growth in sectors across the economy that's that's this right okay okay here"},{"start":1564.09,"text":"are the constraints here's how X and X plus are constrained they're constrained"},{"start":1568.33,"text":"this way we have two matrices we have a number of goods that are consumed"},{"start":1576.67,"text":"that are consumed and also produced by economic activity. So one unit of economic activity in sector I might consume a bunch of things. Actually, it's going to have positive and negative sides. Because if it's consuming, it'll have all sorts of stuff that it's maybe consuming, but it's also producing stuff. Like manufacturing automobiles, it consumes steel."},{"start":1601.89,"text":"various other things, and, you know, that it produces cars, like just as an example. Okay, so what this says is, so AX, when you multiply the matrix A by the vector X, what you get is the vector of, you get what is produced this year."},{"start":1624.38,"text":"That's the set of goods that were produced this year. And the model here is very simple. If this is year, quarters, or months, it doesn't matter. The idea is that what's produced this year, we kind of imagine, is not immediately fed into, but it's almost as if, well, we do this in discrete time."},{"start":1641.3,"text":"So what's produced now is kind of held in escrow for a year. And then on January 1st, everything starts up again and you use those. So what this says is that's the vector of resources consumed by economic activity next year."},{"start":1655.03,"text":"And it says that is less than or equal to what you produced this year. And there's tons of variations on this, right? We could do all sorts of variations on this. We could have, for example, we could do this for 10 periods and have a running, you know, a stockpile of stuff, right? So, okay. Everybody, but this is the basic one. It makes sense? Okay. And this is just immediately a generalized linear fractional problem. A few things here. I'm maximizing a min."},{"start":1684.67,"text":"Whereas this thing should say minimize a maximum. But you just flip the sign and everything's cool. Everybody got it? And by the way, things like this, these are not obvious things. I guarantee you with 10 sectors, you could not figure this out by hand. I mean, it's just absolutely out of the question. So, I mean, but of course..."}],"speech_gaps":[],"frame":"../frames/v006/010.webp","frame_time":1543.87},{"title":"二次规划简介","segments":[{"id":104,"text":"We can solve a problem like that with 10,000 sectors. Like, with no problem at all. Like, you could, let me put it that way. Right? So, everybody got this? So, it's kind of cool. Okay. Next up, we're probably early 1950s, is the so-called quadratic program. This is like linear programming. This is actually a problem class that you need to know about. Just because...","start":1707.26,"end":1735.02},{"id":105,"text":"You know, it's a thing. People talk about it. I guarantee when you go various places, I don't care the field. Someone will say, how do you do that? And someone will say, it's a QP or something like that, right? So quadratic program is this. The constraints are still linear, just like an LP. So we have a polyhedron as your feasible set. But the objective is a convex quadratic.","start":1735.44,"end":1757.42},{"id":106,"text":"Okay, so that's the idea. And here, the only thing that changes is, here's your polyhedron, which is this thing, and the sublevel sets, remember in an LP, they're just, not sublevel sets, well, sublevel sets are half spaces. The level sets were hyperplanes. Now the level sets are actually the surfaces of ellipsoids. I mean, if P is positive definite. If it's not, then it's the surface of a, I don't know, whatever, I don't know what people call it, degenerate ellipsoid or something like that.","start":1758.4,"end":1785.58},{"id":107,"text":"Okay, so and this is the picture right you you want to go downhill here to the minimum and You know while staying in here and here you'll find out it's right here And actually you can see our optimality condition here that when you're optimal the the negative gradient which is pointing you towards You know towards the unconstrained minimum running roughly here is actually an outward normal of the feasible set, right?","start":1786.03,"end":1812.85},{"id":108,"text":"By the way, if that were not the case, I could wiggle X and do a little bit better. Right? Everybody got that? So this is a good picture. I mean, what this doesn't tell you is that, I mean, and the point here, you should have this picture in your mind for sure. But I guess the main point here is that we can solve QPs with 50, you can solve QPs with 50,000 variables and it's just, it's nothing. It's just nothing.","start":1813.41,"end":1838.06},{"id":109,"text":"It can be done so reliably that you can actually have this embedded in control systems and have this done 100 times a second with a failure rate of zero. Okay? Just, okay? So that's, yeah. So everyone see the, like ? Okay, so that's an example. So a robust LP with ellipsoidal uncertainty is in fact an SOCP. Okay, we can also do the same thing with a statistical model and it works just fine.","start":2941.22,"end":2962.24},{"id":153,"text":"Weirdly, you also end up with an SOCP. So here I say, no, you know what? I don't know. I took enough statistics and stuff. So AI is Gaussian with a mean A bar. That's a vector and a covariance matrix, right? So that means that this linear function of it, that's also Gaussian.","start":2963.51,"end":2976.75},{"id":154,"text":"right? Because linear function of a Gaussian vector is Gaussian. And it's got a mean a bar transpose x, and it's got a variance x transpose sigma x. And that means, you know, the probability that, it means that this is just a, that's just a Gaussian, so a scalar Gaussian. The probability of scalar Gaussian is less than a number is equal to this, right? You, you know, you subtract the mean, and then you divide by the standard deviation, you get an n01 variable, and then you, then you look at the CDF. So that's, that's the CDF.","start":2977.16,"end":3006.2},{"id":155,"text":"of a of a gaussian okay everybody following this um yeah by the way it's not looking super good here because these are replaced with uh the the these now you do know some things about that for example that's a log concave function the gaussian cdf right so but doesn't sound like this is going to end up as a second order cone program right because you know it just doesn't sound quadratic or something like that so but it is and the reason","start":3006.47,"end":3035.75}],"notes":["本段讲解了如何将具有椭球不确定性鲁棒线性规划问题转换为二阶锥规划（SOCP）。讲者指出，当不确定性被建模为椭球时，可以通过将矩阵A替换为中间值A bar来构造一个线性规划问题，但为了应对A的不确定性，需要引入一个安全边际。这个安全边际的大小由P的大小决定，P较大时应避免X在该方向上，这实际上是一个函数，取决于X的选择。","接着，讲者转向概率模型，指出当A服从高斯分布时，其线性函数也服从高斯分布。高斯分布的均值为a bar transpose x，方差为x transpose sigma x。概率计算涉及将随机变量标准化为标准正态分布，然后使用累积分布函数（CDF）进行计算。","讲者提到，虽然高斯CDF看起来不像二次函数，但它实际上可以表示为二阶锥规划。这是因为高斯CDF是凹函数，而二阶锥规划可以处理此类问题。讲者强调，尽管表面上看起来不像是二次规划，但通过适当的转换，确实可以将其转化为SOCP。","讲者还指出，这种转换的关键在于理解高斯分布的性质，以及如何将概率约束转化为凸约束。这涉及到将概率不等式转换为关于均值和方差的约束，从而确保问题保持凸性。","最后，讲者提到，虽然这种转换可能看起来不直观，但通过数学推导可以证明其有效性。这展示了凸优化在处理不确定性问题中的强大能力，尤其是在概率模型和鲁棒优化之间建立联系。","整个段落强调了如何将不确定性建模为椭球或高斯分布，并通过凸优化技术将其转化为可解的SOCP问题。这为后续讨论更复杂的优化问题奠定了基础。"],"formulas":[],"uncertainties":["the the these now you do know some things about that for example that's a log concave function the gaussian cdf right so but doesn't sound like this is going to end up as a second order cone program right because you know it just doesn't sound quadratic or something like that so but it is and the reason"],"diagram":"none","start":2864.47,"end":3035.75,"asr_flags":[],"math_clarifications":["公式中未明确说明Ax的分布类型，且未提及标准差的计算方式。此外，CDF的输入应为标准化后的变量，但未明确说明标准化过程。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2864.47,"text":"Here, though, we have to be careful. So you look at the problem. That's linear. That's cool. And this objective is indeed a second order cone constraint. People say an SOC constraint here, right? Actually, it's super interesting, right? Like if you just said, you just said, you know what? I don't care about those uncertainty stuff. I don't believe it."},{"start":2886.31,"text":"Besides, this stuff is only off by plus minus 5%. I don't care. Then what you do is you just replace the A with AI bar, which is kind of the middle value, right? So you just do that. If you do that, you get this problem here. That's an LP. But then you'd say, yeah, but you know there's uncertainty, so I would like a little bit of margin in my..."},{"start":2910.58,"text":"in my inequality just to cover me when A wiggles around, right? What's interesting is this tells you exactly how much margin to use, right? So what this says is wherever P is big, you should avoid having X in that direction. It makes sense. In fact, you could literally flag that number and call that the margin. And the cool part is it's a function of X.
