</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>凸优化</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">06 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 6 · 完整初稿</p><video id="video" hidden controls preload="none" src="https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v006.mp4"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频已同步，点击本页回看按钮即可定位。</p><details class="knowledge-map" id="knowledge-map"></details><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v006","title":"06 - Stanford EE364A Convex Optimization I Stephen Boyd I 2023 I Lecture 6","course":"凸优化","pages":[{"title":"凸优化中的拟凸函数与子水平集","segments":[{"id":0,"text":"So today, we're going to finish this whirlwind tour through problems, different types of problems and formulations and things like that, and some named problem classes. So last time, I think we quit right around here on quasi-convex optimization. So that's when you minimize a quasi-convex objective.","zh":"今天，我们将结束这次快速浏览各种问题、不同类型的问题和表述等内容，以及一些有名的问题类别。我认为上一次我们刚好在这里结束了拟凸优化的内容。这就是当你最小化一个拟凸目标函数时的情况。","start":5.3,"end":27.44},{"id":1,"text":"Here, you have to be, I mean, you should be a little bit worried because, in fact, the basic, you know, probably the most important fact about convex problems is that you can't have a local minimum that's not a global minimum, right? But for quasi-convex optimization, that's false. You can have that, right? So you have to be a little bit more careful. Not that much careful. It's not that hard to solve. So the way you do this...","zh":"在这里，你必须有点担心，因为事实上，凸问题最基本的、可能最重要的性质是，你不能有一个局部最小值不是全局最小值，对吧？但对于拟凸优化来说，这个性质是不成立的。你可以有这样的情况，对吧？所以你必须稍微小心一点。不过也不需要太小心。解决它并不难。所以你这样做……","start":31.54,"end":58.24},{"id":2,"text":"is if a function is quasi-convex, it means its sublevel sets are convex. And so what we introduce is a function whose zero sublevel set is the t sublevel set of your function.","zh":"就是如果一个函数是拟凸的，这意味着它的子水平集是凸的。因此，我们引入一个函数，其零子水平集是你的函数的t子水平集。","start":58.57,"end":72.97},{"id":3,"text":"And so this function has to be convex. And how you construct phi t, there's completely generic constructions of it. They're not useful, but when people ask you, how do you come up with that phi of t? You can always do it. Often it just is suggested by the problem. We looked at an example last time that was this. I mean, here's an interesting one. It's the ratio of...","zh":"因此，这个函数必须是凸的。而如何构造phi t，存在完全通用的构造方法。它们可能没有用，但当人们问你，如何得出这个phi of t时，你总是可以做到这一点。通常，它只是由问题本身提示出来的。我们上次看的一个例子就是这种情况。也就是说，这里有一个有趣的例子。它是非负函数与正函数的比值，分子是凸的，分母是凹的，对吧？所以这个函数，它不一定一定是凸的，但它一定是拟凸的。要验证这一点，你所做的就是检查这个函数的子水平集。什么时候p of x除以q of x小于等于t？如果t是负数，","start":75.08,"end":99.58},{"id":4,"text":"of a non-negative over a positive function, the numerator is convex and the denominator is concave, right? So this function here, it is definitely not convex necessarily, but it is quasi-convex. And to check that, what you do is you look at the sub-level set of this. When is it true that p of x divided by q of x is less than or equal to t? If t is negative,","zh":"那么这就很简单，对吧？因为此时子水平集是空集，而空集是凸的。所以这很有趣。因此，我们真正需要担心的只是t为正数的情况。所以如果t为正数，那么p of x除以q of x小于t。这在t为正数的情况下成立，当且仅当p of x减去t乘以q of x小于等于零。明白吗？","start":100.03,"end":127.57},{"id":5,"text":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?","zh":"那么这就很简单，对吧？因为此时子水平集是空集，而且是凸的。所以这很酷。所以我们真正需要担心的只是T为正数的情况。如果T为正数，那么P(X)除以Q(X)小于T。其实，这在T为正数的情况下也是成立的。当且仅当P(X)减去T乘以Q(X)小于等于零时才成立。好的？","start":128.92,"end":151.74},{"id":6,"text":"Now the critical part. This is a convex function of x provided t is positive. That's because q is concave, right? So you're just using one of these simple rules in your head. That's concave multiplied by t positive, still concave, minus, now it's convex. And then it's a sum, right? So this is the example. And what this allows you to do is really cool. It says that if I wanted to check","zh":"现在关键的部分。这是关于x的凸函数，前提是t是正的。这是因为q是凹的，对吧？所以你只是在脑海中使用其中一个简单的规则。凹函数乘以正的t，仍然是凹的，减去，现在变成凸的。然后它是一个和，对吧？这就是这个例子。而这一点允许你做的事情真的很酷。它说明如果我想检查","start":152.21,"end":179.33}],"notes":["本段讲解了拟凸函数的定义及其子水平集的性质。拟凸函数的子水平集是凸集，这是判断函数是否为拟凸的重要依据。同时，通过一个具体的例子，即两个函数的比值（分子为凸函数，分母为凹函数），说明了如何判断该函数是否为拟凸。"],"formulas":[{"latex":"p(x)/q(x) \\text{ 是拟凸函数}","symbols":"p(x) 是凸函数，q(x) 是凹函数，它们的比值是拟凸函数","explanation":"该公式正确描述了当分子是凸函数、分母是凹函数时，它们的比值是拟凸函数的数学性质。","evidence":"of a non-negative over a positive function, the numerator is convex and the denominator is concave, right? So this function here, it is definitely not convex necessarily, but it is quasi-convex. And to check that, what you do is you look at the sub-level set of this. When is it true that p of x divided by q of x is less than or equal to t? If t is negative,"},{"latex":"p(x)/q(x) \\text{ 小于等于 } t","symbols":"当 t 为负数时，该不等式成立的子水平集为空集，因此是凸集","explanation":"该公式正确描述了当 t 为负数时，p(x)/q(x) ≤ t 的子水平集为空集，因此是凸集。","evidence":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?"},{"latex":"p(x) - t q(x) \\text{ 小于等于零}","symbols":"当 t 为正数时，该不等式等价于 p(x)/q(x) \\text{ 小于等于 } t","explanation":"该公式正确描述了当 t 为正数时，p(x)/q(x) ≤ t 等价于 p(x) - t q(x) ≤ 0 的数学关系。","evidence":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?"}],"uncertainties":[],"diagram":"none","start":5.3,"end":179.33,"asr_flags":[],"math_clarifications":["公式中的符号和数学关系均符合拟凸函数的定义和性质，无需进一步修正。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.3,"text":"So today, we're going to finish this whirlwind tour through problems, different types of problems and formulations and things like that, and some named problem classes. So last time, I think we quit right around here on quasi-convex optimization. So that's when you minimize a quasi-convex objective."},{"start":31.54,"text":"Here, you have to be, I mean, you should be a little bit worried because, in fact, the basic, you know, probably the most important fact about convex problems is that you can't have a local minimum that's not a global minimum, right? But for quasi-convex optimization, that's false. You can have that, right? So you have to be a little bit more careful. Not that much careful. It's not that hard to solve. So the way you do this..."},{"start":58.57,"text":"is if a function is quasi-convex, it means its sublevel sets are convex. And so what we introduce is a function whose zero sublevel set is the t sublevel set of your function."},{"start":75.08,"text":"And so this function has to be convex. And how you construct phi t, there's completely generic constructions of it. They're not useful, but when people ask you, how do you come up with that phi of t? You can always do it. Often it just is suggested by the problem. We looked at an example last time that was this. I mean, here's an interesting one. It's the ratio of..."},{"start":100.03,"text":"of a non-negative over a positive function, the numerator is convex and the denominator is concave, right? So this function here, it is definitely not convex necessarily, but it is quasi-convex. And to check that, what you do is you look at the sub-level set of this. When is it true that p of x divided by q of x is less than or equal to t? If t is negative,"},{"start":128.92,"text":"then this is simple, right? Because then the sublevel set is empty and that's convex. So that's cool. So we really only have to worry about T positive. So if T is positive, then P of X over Q of X is less than T. Well, this is true without the T positive. That's true if and only if P of X minus T Q of X is less than or equal to zero. Okay?"},{"start":152.21,"text":"Now the critical part. This is a convex function of x provided t is positive. That's because q is concave, right? So you're just using one of these simple rules in your head. That's concave multiplied by t positive, still concave, minus, now it's convex. And then it's a sum, right? So this is the example. And what this allows you to do is really cool. It says that if I wanted to check"}],"speech_gaps":[],"frame":"../frames/v006/001.webp","frame_time":17.3},{"title":"凸优化中的二分法与线性规划简介","segments":[{"id":7,"text":"Does there exist an x for which f0 of x is less than t? I can check it by solving a convex feasibility problem, right? So that's kind of the idea here, which is really cool. And then, of course, what you could do is you can just do bisection, right? You just say, well, can you find an x where f0 of x is less than 1.5? And if the answer is yes, then you go, cool. And by the way, you now have a feasible point with an objective value of 1.5 or better.","zh":"是否存在一个x，使得f0(x)小于t？我可以通过求解一个凸可行性问题来检查，对吧？所以这就是这个想法，真的很酷。然后，当然，你可以直接进行二分法，对吧？你可以说，是否存在一个x，使得f0(x)小于1.5？如果答案是肯定的，那么你可以说，很好。顺便说一下，你现在有一个可行点，其目标值为1.5或更好。","start":179.81,"end":205.45},{"id":8,"text":"Then you'd say, all right, how about 1? Or how about 0.5? Or how about minus 1? This kind of thing. So, I mean, not minus 1 in this case, but still. Anyway, that's just bisection. And that actually works. So, you know, the algorithm is actually just what I said. I start with an upper and a lower bound on the optimal value of the objective. I just query. I ask.","zh":"然后你会说，好吧，那试一下1？或者试一下0.5？或者试一下-1？这种情形。我的意思是，这里不是-1，但还是类似的。不管怎样，这就是二分法。而且这实际上有效。所以，算法其实就是我刚才说的。我开始时有一个目标值的上界和下界。我只需查询，我询问。","start":206.72,"end":233.48},{"id":9,"text":"what I do is I take the midpoint of that interval and I ask, I solve a convex feasibility problem to find out if these inequalities hold. If they do, then that tells you that P star is less than or equal to that value, right? It means you're above. And by the way, now I update my upper bound. I pull it down to this halfway mark.","zh":"我的做法是取这个区间的中点，然后我询问，我通过求解一个凸可行性问题来判断这些不等式是否成立。如果成立，那么这就告诉你P星小于或等于这个值，对吧？这意味着你处于上方。顺便说一下，现在我更新我的上界，将其拉低到这个中点。","start":234.13,"end":256.45},{"id":10,"text":"If it goes the other way around, I take my lower bound and I pull it up to the halfway mark. And what this tells you is that your, let's see, your interval of ignorance about the optimal value, right? P star is in some interval. That interval shrinks by a factor of two every iteration, right? Or you could even say this. You could say that you obtain one bit of information.","zh":"如果情况相反，我会将我的下界拉高到中点。这告诉你的就是，你对最优值P星的无知区间，对吧？P星位于某个区间内。这个区间每次迭代都会缩小一半，对吧？或者说，你可以说，每次求解一个这样的凸可行性问题，你获得了一比特的信息。","start":257.1,"end":281.4},{"id":11,"text":"about P star every time you solve one of these convex feasibility problems, right? And by one bit, I mean that you actually reduce your uncertainty exactly by a factor of two, okay? So that's it. And this is kind of standard and it works and so on. So that's quasi-convex optimization. Okay, what we're gonna do now is we're gonna talk about a whole bunch of different problems. Some of them actually have names. So there's named problem classes.","zh":"关于P星，对吧？而一比特的意思是，你实际上将不确定性精确地减少了一半，对吧？就是这样。而且这基本上是标准的做法，而且有效，等等。这就是准凸优化。好的，我们现在要做的事情是，我们要讨论一系列不同的问题。其中一些问题实际上有名称。所以存在命名的问题类别。","start":283.0,"end":310.96},{"id":12,"text":"I'm just trying to think, you know, it's maybe much less important these days that you know these,","zh":"我只是在想，你知道的，现在也许知道这些就不太重要了，","start":312.46,"end":316.66},{"id":13,"text":"but things like this is just basic, and there'll be people who don't know other stuff,","zh":"但像这样的内容只是基础，会有不熟悉其他内容的人。","start":317.42,"end":321.42},{"id":14,"text":"and they'll know these, so you just have to know these names, right?","zh":"他们已经知道这些术语了，所以你只需要记住这些名称，对吧？","start":321.54,"end":325.46},{"id":15,"text":"So, linear program is a famous one, that's LP, and we already encountered this a couple of weeks ago.","zh":"因此，线性规划是一个著名的例子，简称LP，我们几周前就已经接触过了。","start":325.58,"end":333.6},{"id":16,"text":"It's minimize an affine function subject to a set of affine inequality constraints here,","zh":"它是在一组仿射不等式约束下最小化一个仿射函数，","start":333.84,"end":340.52},{"id":17,"text":"here, and an equality constraint. Or another way to say it is, you know, the d doesn't","zh":"在这里，还有一个等式约束。或者说，这里的d并不","start":340.52,"end":345.26},{"id":18,"text":"matter here. If I remove d, this becomes an equivalent problem. It's not the same, it's","zh":"重要。如果我移除d，这个问题就变成了等价的问题。它并不是完全相同的问题，","start":345.26,"end":349.86},{"id":19,"text":"equivalent. It's an equivalent problem. And so it basically says minimize a linear function","zh":"而是等价的。因此，它基本上是在一个多面体上最小化一个线性函数。","start":349.86,"end":354.4},{"id":20,"text":"over a polyhedron. So that's actually another way to state what a linear program is.","zh":"所以，这实际上是另一种表述线性规划的方式。","start":354.4,"end":359.72}],"notes":["本段讲解了凸优化中使用二分法寻找最优值的思路，通过不断缩小上下界区间来逼近最优值。每次通过求解一个凸可行性问题来判断当前中间值是否可行，若可行则更新上界，否则更新下界。这种方法每次迭代将不确定性区间缩小一半，相当于获得一个比特的信息。","接下来，课程转向介绍不同类型的优化问题，特别是线性规划（LP）。线性规划是最著名的优化问题之一，其目标是最小化一个仿射函数，约束条件包括一组仿射不等式约束和一个等式约束。","讲者提到，线性规划可以等价地表述为最小化一个线性函数，约束条件为一个凸多面体。这种等价性说明了线性规划问题的结构特点，即目标函数和约束函数都是线性的。","讲者还指出，虽然这些命名的问题可能在现代课程中不如以前重要，但它们仍然是基础内容，某些人可能更熟悉这些名称，因此需要掌握这些术语。","最后，讲者强调了线性规划的定义，即最小化一个线性函数在凸多面体上的问题，这为后续讨论其他优化问题（如二次规划、半定规划等）奠定了基础。","整个段落展示了凸优化中二分法的应用和线性规划的基本概念，强调了其在优化理论中的重要性。"],"formulas":[],"uncertainties":["d doesn't matter here. If I remove d, this becomes an equivalent problem."],"diagram":"none","start":179.81,"end":359.72,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":179.81,"text":"Does there exist an x for which f0 of x is less than t? I can check it by solving a convex feasibility problem, right? So that's kind of the idea here, which is really cool. And then, of course, what you could do is you can just do bisection, right? You just say, well, can you find an x where f0 of x is less than 1.5? And if the answer is yes, then you go, cool. And by the way, you now have a feasible point with an objective value of 1.5 or better."},{"start":206.72,"text":"Then you'd say, all right, how about 1? Or how about 0.5? Or how about minus 1? This kind of thing. So, I mean, not minus 1 in this case, but still. Anyway, that's just bisection. And that actually works. So, you know, the algorithm is actually just what I said. I start with an upper and a lower bound on the optimal value of the objective. I just query. I ask."},{"start":234.13,"text":"what I do is I take the midpoint of that interval and I ask, I solve a convex feasibility problem to find out if these inequalities hold. If they do, then that tells you that P star is less than or equal to that value, right? It means you're above. And by the way, now I update my upper bound. I pull it down to this halfway mark."},{"start":257.1,"text":"If it goes the other way around, I take my lower bound and I pull it up to the halfway mark. And what this tells you is that your, let's see, your interval of ignorance about the optimal value, right? P star is in some interval. That interval shrinks by a factor of two every iteration, right? Or you could even say this. You could say that you obtain one bit of information."},{"start":283.0,"text":"about P star every time you solve one of these convex feasibility problems, right? And by one bit, I mean that you actually reduce your uncertainty exactly by a factor of two, okay? So that's it. And this is kind of standard and it works and so on. So that's quasi-convex optimization. Okay, what we're gonna do now is we're gonna talk about a whole bunch of different problems. Some of them actually have names. So there's named problem classes."},{"start":312.46,"text":"I'm just trying to think, you know, it's maybe much less important these days that you know these,"},{"start":317.42,"text":"but things like this is just basic, and there'll be people who don't know other stuff,"},{"start":321.54,"text":"and they'll know these, so you just have to know these names, right?"},{"start":325.58,"text":"So, linear program is a famous one, that's LP, and we already encountered this a couple of weeks ago."},{"start":333.84,"text":"It's minimize an affine function subject to a set of affine inequality constraints here,"},{"start":340.52,"text":"here, and an equality constraint. Or another way to say it is, you know, the d doesn't"},{"start":345.26,"text":"matter here. If I remove d, this becomes an equivalent problem. It's not the same, it's"},{"start":349.86,"text":"equivalent. It's an equivalent problem. And so it basically says minimize a linear function"},{"start":354.4,"text":"over a polyhedron. So that's actually another way to state what a linear program is."}],"speech_gaps":[],"frame":"../frames/v006/002.webp","frame_time":191.81},{"title":"线性规划的历史与基本概念","segments":[{"id":21,"text":"So actually, the modern history starts in around the 40s for linear programming, but","zh":"实际上，线性规划的现代历史始于20世纪40年代左右，但","start":362.66,"end":369.38},{"id":22,"text":"But in fact, I think Fourier wrote a paper","zh":"但事实上，我认为傅里叶写过一篇论文","start":369.38,"end":371.48},{"id":23,"text":"about linear programming.","zh":"关于线性规划。","start":371.48,"end":372.5},{"id":24,"text":"So that tells you it's not totally new.","zh":"这说明它并不是完全新的。","start":372.82,"end":376.18},{"id":25,"text":"It became a whole lot more interesting","zh":"当你实际上能够进行计算时，它变得有趣得多。","start":377.94,"end":380.04},{"id":26,"text":"when you could actually compute stuff.","zh":"这应该是在计算机时代之后。","start":380.76,"end":382.24},{"id":27,"text":"So that would be after the age of computers.","zh":"所以，好吧。","start":382.48,"end":384.54},{"id":28,"text":"So, okay.","zh":"所以，好吧。","start":384.92,"end":385.72},{"id":29,"text":"So a picture looks like this, right?","zh":"所以，图像看起来像这样，对吧？","start":386.46,"end":388.16},{"id":30,"text":"Here's your feasible set.","zh":"这里是你的可行集。","start":388.26,"end":389.26},{"id":31,"text":"It's a polyhedron.","zh":"它是一个多面体。","start":389.34,"end":390.26},{"id":32,"text":"Each of these faces is a row, a single linear inequality.","zh":"每一个这样的面都对应一行，即一个单一的线性不等式。","start":390.34,"end":394.94},{"id":33,"text":"So that's what this is.","zh":"这就是这个图像所表示的内容。","start":395.32,"end":396.42},{"id":34,"text":"And so these are the feasible points.","zh":"因此，这些就是可行点。","start":396.54,"end":398.02},{"id":35,"text":"points, and there's a vector c, it points this direction. These dashed lines show you","zh":"这些点，还有一个向量 c，它指向这个方向。这些虚线显示的是","start":398.02,"end":404.42},{"id":36,"text":"the level curves of the objective, which is c transpose x. Obviously, it's going to be","zh":"目标函数的等高线，即 c 转置 x。显然，它会是","start":404.42,"end":409.5},{"id":37,"text":"orthogonal. They're orthogonal to c.","zh":"正交。它们与c正交。","start":409.5,"end":411.7},{"id":38,"text":"What it says is, you know, this might be 3, 2, 1, 0. Okay? Like, and so on. I mean, there'd be minus 1, minus 2, and so on, right? And so your job is to basically slide in this thing, go this direction as far as you possibly can. And that would be like this point here, right? So, I mean, this is very, I mean, this picture is not a bad one to have in your mind because it explains what an LP is. You know, obviously...","zh":"它说的是，你知道的，这可能是3, 2, 1, 0。好的？比如，还有-1, -2，依此类推，对吧？你的任务基本上就是沿着这个方向尽可能地滑动，滑到最远的地方。这就是这里的这个点，对吧？所以，我意思是，这张图在你的脑海中有一个不错的印象，因为它解释了什么是线性规划。你知道的，显然……","start":413.77,"end":441.26},{"id":39,"text":"We are not interested in solving LPs with two variables because you can do it with your eyeball. Okay. So what we're interested in is solving LPs with 10,000 variables and 30,000 constraints. Okay. People do that all like right now. I guarantee you a lot of those are being done right now. It's used for all sorts of things like scheduling, supply chain stuff. It's just used everywhere. So like in my opinion, everyone should know about it. Okay. This is linear programming.","zh":"我们不感兴趣用两个变量来解线性规划问题，因为你可以用眼睛来解决。好的。我们感兴趣的是用10,000个变量和30,000个约束条件来解线性规划问题。好的。人们现在就做这些事情。我保证你，很多这样的问题现在正在被解决。它被用于各种各样的事情，比如调度、供应链等。它被用在各个地方。所以，在我看来，每个人都应该了解它。好的。这就是线性规划。","start":441.8,"end":470.98},{"id":40,"text":"So actually, the first example is historical. And I think that's it's kind of cool because it's but it's just part respecting history anyway. So this is from maybe from maybe 1940s or 50s. And it's the diet problem. So I think it allegedly was supposed to be from the military. Like, how do you how do you how do you construct a diet that will keep?","zh":"实际上，第一个例子是历史性的。我认为这有点酷，因为它尊重历史，不管怎样。这个例子可能来自1940年代或1950年代。这是饮食问题。我认为它据说是从军队来的。比如，如何构造一个饮食，以保持……","start":473.23,"end":497.48},{"id":41,"text":"And what we'll have is we have a bunch of foods. So food J, when you get one unit of it, doesn't matter what a unit is, but one unit of it is going to have an amount AIJ of nutrient I. So we care about a bunch of nutrients, right? Like you're, you know, you're maybe 10 or 20 or five or something like that, various nutrients. And a healthy diet is going to require nutrient I.","zh":"我们将有一系列食物。食物J，当你获得一个单位时，不管单位是什么，一个单位的食物J将含有AIJ量的营养素I。我们关心一系列营养素，对吧？比如，你可能有10个、20个或5个之类的各种营养素。一个健康的饮食将需要营养素I。","start":497.85,"end":513.61},{"id":42,"text":"And what we'll have is we have a bunch of foods. So food J, when you get one unit of it, doesn't matter what a unit is, but one unit of it is going to have an amount AIJ of nutrient I. So we care about a bunch of nutrients, right? Like you're, you know, you're maybe 10 or 20 or five or something like that, various nutrients. And a healthy diet is going to require nutrient I.","zh":"我们将拥有一系列食物。食物J，当你获取其中一单位时，不管一单位具体指什么，这一单位将含有I种营养素的AIJ量。我们关注多种营养素，对吧？比如你可能需要10种、20种或5种之类的各种营养素。而一个健康的饮食将需要营养素I。","start":515.73,"end":541.9}],"notes":["本段介绍了线性规划的一个历史实例，即饮食问题。该问题起源于20世纪40年代或50年代，最初用于军事领域，目的是以最低成本维持士兵的健康。问题中涉及多种食物和营养素，每种食物含有不同数量的营养素，目标是选择食物的组合，以满足所有营养需求且成本最低。","讲者提到，线性规划问题通常涉及大量变量和约束条件，例如10,000个变量和30,000个约束，这类问题需要计算机求解，而不能仅靠人工计算。这说明了线性规划在实际应用中的重要性，如调度、供应链管理等。","在讲者描述的饮食问题中，每种食物对应一个变量，表示该食物的摄入量，且变量必须是非负的。每种营养素的摄入量由食物的组合决定，目标是满足所有营养需求，同时最小化总成本。","讲者还提到，线性规划的几何解释中，可行集是一个多面体，目标函数的等高线与目标向量正交。这说明了线性规划的优化过程是沿着目标方向寻找可行解的最优点。","讲者强调，线性规划是凸优化的一个重要子领域，其目标函数和约束条件都是线性的，因此问题具有全局最优解的性质。这使得线性规划在实际应用中非常可靠。","最后，讲者指出，线性规划在现代社会中被广泛使用，涉及多个领域，如工业、经济、军事等。因此，掌握线性规划的基本概念和方法对学习者来说是非常重要的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":362.66,"end":541.9,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":362.66,"text":"So actually, the modern history starts in around the 40s for linear programming, but"},{"start":369.38,"text":"But in fact, I think Fourier wrote a paper"},{"start":371.48,"text":"about linear programming."},{"start":372.82,"text":"So that tells you it's not totally new."},{"start":377.94,"text":"It became a whole lot more interesting"},{"start":380.76,"text":"when you could actually compute stuff."},{"start":382.48,"text":"So that would be after the age of computers."},{"start":384.92,"text":"So, okay."},{"start":386.46,"text":"So a picture looks like this, right?"},{"start":388.26,"text":"Here's your feasible set."},{"start":389.34,"text":"It's a polyhedron."},{"start":390.34,"text":"Each of these faces is a row, a single linear inequality."},{"start":395.32,"text":"So that's what this is."},{"start":396.54,"text":"And so these are the feasible points."},{"start":398.02,"text":"points, and there's a vector c, it points this direction. These dashed lines show you"},{"start":404.42,"text":"the level curves of the objective, which is c transpose x. Obviously, it's going to be"},{"start":409.5,"text":"orthogonal. They're orthogonal to c."},{"start":413.77,"text":"What it says is, you know, this might be 3, 2, 1, 0. Okay? Like, and so on. I mean, there'd be minus 1, minus 2, and so on, right? And so your job is to basically slide in this thing, go this direction as far as you possibly can. And that would be like this point here, right? So, I mean, this is very, I mean, this picture is not a bad one to have in your mind because it explains what an LP is. You know, obviously..."},{"start":441.8,"text":"We are not interested in solving LPs with two variables because you can do it with your eyeball. Okay. So what we're interested in is solving LPs with 10,000 variables and 30,000 constraints. Okay. People do that all like right now. I guarantee you a lot of those are being done right now. It's used for all sorts of things like scheduling, supply chain stuff. It's just used everywhere. So like in my opinion, everyone should know about it. Okay. This is linear programming."},{"start":473.23,"text":"So actually, the first example is historical. And I think that's it's kind of cool because it's but it's just part respecting history anyway. So this is from maybe from maybe 1940s or 50s. And it's the diet problem. So I think it allegedly was supposed to be from the military. Like, how do you how do you how do you construct a diet that will keep?"},{"start":497.85,"text":"soldiers alive and as cheap as possible or something like that right so i mean whatever so it's a perfectly good problem here it is uh so you're gonna you have a bunch of foods and you're gonna choose some quantities these are going to be uh non-negative they can't be negative"},{"start":515.73,"text":"And what we'll have is we have a bunch of foods. So food J, when you get one unit of it, doesn't matter what a unit is, but one unit of it is going to have an amount AIJ of nutrient I. So we care about a bunch of nutrients, right? Like you're, you know, you're maybe 10 or 20 or five or something like that, various nutrients. And a healthy diet is going to require nutrient I."}],"speech_gaps":[],"frame":"../frames/v006/003.webp","frame_time":374.66},{"title":"线性规划的等价形式转换","segments":[{"id":43,"text":"in at least a quantity of BI. So that's your sort of, let's say that's your minimum daily advised, blah, blah, blah, whatever it is, right? Okay, so then immediately, well, not quite immediately, but I'll explain something here. So to find the cheapest healthy diet, you minimize, that's the cost of the foodstuffs. And then you could even annotate, you can imagine annotating the constraints, which would be really good. So if I annotated that, that's not a constraint, I'd annotate that as that's the cost, total cost.","zh":"至少需要一定数量的BI。所以这就是你所谓的每日建议量，不管它是什么，对吧？好的，那么接下来，虽然不是立刻，但我会解释一些内容。为了找到最便宜的健康饮食，你需要最小化食物的成本。你甚至可以注释这些约束条件，这会很有帮助。如果你注释了这一点，那不是约束条件，你可以注释为这是总成本。","start":542.52,"end":571.46},{"id":44,"text":"This says the amounts have to be non, they have to be, they can't be negative, right? And each line of this you could annotate and say, this line says that's the minimum amount of protein in a diet, right? That's the something like that, right? Now, technically speaking, if you look at this and then compare it to what we defined an LP to be like this, it's not the same.","zh":"这里说的是数量必须是非负的，对吧？每一行你都可以注释并说明，这一行表示饮食中蛋白质的最小含量，对吧？这就是类似的东西，对吧？从技术上讲，如果你看一下这个，然后将其与我们定义的线性规划形式进行比较，它并不完全相同。","start":572.09,"end":597.11},{"id":45,"text":"Right? But here we're going to start doing things where once you're, you know, once I think at this point in the class and moving forward, you can do a couple of quick transformations of the problem without even mentioning it. So anyone would look at that and say that's an LP. It doesn't have exactly the right form. There's a few silly things like, for example, here.","zh":"对吧？但在这里，我们将开始做一些转换，一旦你理解了这一点，接下来在课堂上，你可以进行一些快速的转换，而无需提及。任何人都会看到这一点并说这是一个线性规划问题。它并不完全具有正确的形式。有一些愚蠢的地方，例如这里。","start":597.93,"end":619.15},{"id":46,"text":"you know, the inequalities are, they go the wrong way. In fact, both of them go the wrong way. So I'll just do this once and then never again. So what's going to happen is you have, you know, AX bigger than B, and also X is bigger than zero. And then we're going to write, we're going to end up writing that, let me get my notation down here. So the notation is GX less than H. So we're going to somehow write this.","zh":"你知道，不等式的方向是错误的。事实上，两者的方向都是错误的。所以我现在就做一次，之后就不再重复了。接下来会发生的是，你有AX大于B，同时X大于零。然后我们将写出，我们将最终写出这样的形式，让我在这里写下符号。所以符号是GX小于H。我们将以某种方式写出这个。","start":620.12,"end":646.14},{"id":47,"text":"as gx less than h, right? Anybody got some suggestions? Minus sign? Yeah, minus sign. I like it. Okay, so we'll start by doing this. We'll have like minus a. So this thing is equivalent to minus ax is less than or equal to minus b. And this one is equivalent to this.","zh":"作为gx小于h，对吧？有人有建议吗？负号？是的，负号。我喜欢这个。好的，我们将从这里开始。我们将有类似负a的东西。这个等价于负ax小于等于负b。而这一行也等价于这个。","start":647.75,"end":671.23},{"id":48,"text":"that zero is the same as minus zero. Everybody cool on that? That was step one. Then step two is you just stack, right? So you just do this, and that's less than, okay, b and zero, okay? So here's g, and here's h, okay? So everybody got that? So yeah, we'll never do that again. I'll never do that again. Let's put it that way. And the truth is you don't have to either, because...","zh":"零和负零是相同的。大家明白这一点吗？这是第一步。第二步就是你只需要堆叠，对吧？所以你只需要这样做，然后小于，好吧，b和零，好吧？所以这里是g，这里是h，好吧？大家明白了吗？所以是的，我们再也不这样做了。我再也不这样做了。我们可以这么说。事实上，你也不必这样做，因为……","start":672.32,"end":699.45}],"notes":["本段讲解了如何将不等式方向错误的线性规划问题转换为标准形式。讲者指出，原始问题中的不等式方向与标准形式相反，因此需要通过乘以-1来改变方向，同时保持不等式成立。这一步骤是将原始问题转换为标准线性规划形式的关键。","讲者通过举例说明了如何将AX ≥ B和X ≥ 0这样的不等式转换为标准形式GX ≤ H。具体来说，通过将不等式两边同时乘以-1，可以将AX ≥ B转换为-AX ≤ -B，同时X ≥ 0可以保持不变。这种转换是线性规划问题标准化过程中的常见操作。","讲者强调了标准化过程中的两个步骤：第一步是通过乘以-1改变不等式方向，第二步是将所有不等式合并为一个矩阵形式GX ≤ H。这种转换使得问题符合标准线性规划的定义，便于后续的求解和分析。","讲者指出，虽然这种转换过程可能看起来繁琐，但它是线性规划问题标准化的重要步骤。通过这种方式，原始问题可以被转换为标准形式，从而可以应用现有的线性规划求解方法。","讲者还提到，这种转换并不需要每次都重复进行，因为一旦完成，就可以直接使用标准形式进行后续的计算和分析。这表明标准化过程是线性规划问题求解中的一个关键步骤。","最后，讲者指出，虽然标准化过程可能看起来复杂，但它是线性规划问题求解中的必要步骤。通过这种方式，原始问题可以被转换为标准形式，从而可以应用现有的线性规划求解方法。"],"formulas":[{"latex":"X \\text{ bigger than } 0","symbols":"X ≥ 0","explanation":"该公式正确表示变量非负约束，无需修改。","evidence":"you know, the inequalities are, they go the wrong way. In fact, both of them go the wrong way. So I'll just do this once and then never again. So what's going to happen is you have, you know, AX bigger than B, and also X is bigger than zero. And then we're going to write, we're going to end up writing that, let me get my notation down here. So the notation is GX less than H. So we're going to somehow write this."},{"latex":"-AX \\text{ less than or equal to } -B","symbols":"-AX ≤ -B","explanation":"该公式正确表示原不等式 AX ≥ B 的等价形式，无需修改。","evidence":"as gx less than h, right? Anybody got some suggestions? Minus sign? Yeah, minus sign. I like it. Okay, so we'll start by doing this. We'll have like minus a. So this thing is equivalent to minus ax is less than or equal to minus b. And this one is equivalent to this."},{"latex":"GX \\text{ less than } H","symbols":"GX ≤ H","explanation":"该公式正确表示转换后的约束形式，无需修改。","evidence":"that zero is the same as minus zero. Everybody cool on that? That was step one. Then step two is you just stack, right? So you just do this, and that's less than, okay, b and zero, okay? So here's g, and here's h, okay? So everybody got that? So yeah, we'll never do that again. I'll never do that again. Let's put it that way. And the truth is you don't have to either, because..."}],"uncertainties":[],"diagram":"none","start":542.52,"end":699.45,"asr_flags":[],"math_clarifications":["原始片段中提到不等式方向错误，因此需要移除原始不等式 AX ≥ B。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_co
