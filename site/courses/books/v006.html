约束","explanation":"约束条件为向量约束，其中K表示锥体，符合锥形问题的定义。","evidence":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k"},{"latex":"A x = b","symbols":"等式约束","explanation":"等式约束，符合凸优化问题的常见形式。","evidence":"People talk about it in actually a whole bunch of fields now, right? So in theoretical computer science, people blabber about it. People in physics use it. So it's become mainstream in the last 20, 25 years. Here it is. You minimize a linear function subject to equality constraint, linear equality. And then you have a single inequality."},{"latex":"F x + g \\text{ is negative semi-definite}","symbols":"半正定约束","explanation":"半正定约束，符合半正定规划的定义。","evidence":"which looks like this. In fact, it looks like a linear inequality. If these were scalars, and that was ordinary less than or equal to, this would be a single linear inequality. It would be a silly LP. But here, these are symmetric matrices, and this says this linear combination, this affine function, which is a symmetric matrix, has to be negative semi-definite. So that's called a semi-definite program."}],"uncertainties":[],"diagram":"none","start":4176.16,"end":4353.95,"asr_flags":[],"math_clarifications":["所有公式均符合凸优化问题的常见形式，未发现明显的数学错误。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4176.16,"text":"And I would say, look, here's a problem in control. Oh, it's convex. Here's another problem in control. Oh, look, it's convex. And I said, I had a slide that was like, I said, here's an example of a problem. And I said, I don't think it's convex, right? So anyway, so I went around, gave that talk to several thousand people. I was at Berkeley. I gave the talk. A colleague of mine came up to me afterwards and he said, oh, you see that problem that you just said was probably non-convex? I was like, yeah."},{"start":4202.5,"text":"And he said, can I show you something? I was like, sure. Anyway, he had some completely sick, demented change of variables. Like instead of this positive definite matrix, we're going to work in the inverse. And instead of these, we're going to work in the inverse of this times that. And I was like, Andy, why would anyone do that? And he goes, watch this. Two lines later, it's convex. And I step away and I'm like, oh no, oh no. I've been telling people all over the world that it was not convex. Then we looked at my slide and it was really awesome."},{"start":4231.67,"text":"it says it says a problem that's not convex and there was a little footnote and it said probably so i was safe then by the way after that i told that story every time so i said so yeah so basically you should be very careful because this this anyway so okay fine back to this one now we're back to honest convex problems okay so"},{"start":4254.58,"text":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k"},{"start":4282.27,"text":"is the non-negative orthant. This is just a pedantic way to write down an LP, right? But the cool part is K could be other cones. And then you get, like, if I make K a product of second order cones, this is SOCP. But I can have other things too. And a very famous one is so-called semi-definite programming. So that's something you will see. This is probably, it's not bad to have heard it."},{"start":4307.88,"text":"People talk about it in actually a whole bunch of fields now, right? So in theoretical computer science, people blabber about it. People in physics use it. So it's become mainstream in the last 20, 25 years. Here it is. You minimize a linear function subject to equality constraint, linear equality. And then you have a single inequality."},{"start":4328.96,"text":"which looks like this. In fact, it looks like a linear inequality. If these were scalars, and that was ordinary less than or equal to, this would be a single linear inequality. It would be a silly LP. But here, these are symmetric matrices, and this says this linear combination, this affine function, which is a symmetric matrix, has to be negative semi-definite. So that's called a semi-definite program."}],"speech_gaps":[],"frame":"../frames/v006/026.webp","frame_time":4188.16},{"title":"线性矩阵不等式与半定规划","segments":[{"id":207,"text":"And, oh, this thing is called an LMI, a linear matrix inequality. It's like a linear inequality, except it's a matrix inequality. So, okay. And, you know, there's things that you do. This says you only have one, but you could just diagonally stack them like this. Yeah. Oh, any suggestion? How would I make, how would I represent an LP as an SDP?","zh":"哦，这个东西叫做LMI，即线性矩阵不等式。它类似于线性不等式，只是这里是矩阵不等式。所以，好吧。你知道，有一些事情你可以做。这里说你只有一个，但你可以像这样对角堆叠它们。对的。哦，有什么建议吗？我该如何将，我该如何将一个LP表示为一个SDP？","start":4356.39,"end":4380.11},{"id":208,"text":"Any idea? You have multiple, I have 10 linear inequalities on X scalar. How do I, yeah? Yeah, you make these matrices all diagonal and that's diagonal. And then it's silly because a diagonal matrix is less than or equal to zero, right? I mean, if and only if all the entries are, right? So this extends LP, you would say, right? So, okay, this is a semi-definite program.","zh":"有什么想法吗？你有多个，我有10个关于X标量的线性不等式。我该如何，是的？是的，你把这些矩阵都设为对角矩阵，这样整体也是对角矩阵。然后这就很傻了，因为一个对角矩阵小于等于零，对吧？我的意思是，当且仅当所有元素都满足，对吧？所以这可以扩展LP，你会这么说，对吧？所以，好吧，这就是一个半定规划。","start":4382.66,"end":4410.2},{"id":209,"text":"Okay. And as I said, you can easily represent these things. It also extends SOCP. And that's also interesting, not obvious at all. And in fact, that goes through something called the sure complement, which is... Ooh, should put that on one of the next coming homeworks. Yeah. Okay. Sorry. Okay. Okay. So sure complement, it's this. This says...","zh":"好吧。正如我所说，你可以很容易地表示这些内容。它还扩展了SOCP。这也是很有趣，但一点也不明显。事实上，这涉及到一种叫做sure complement的东西，即...哦，应该把它放在下一个作业中。是的。好吧。抱歉。好吧。好吧。sure complement，它就是这个。它说...","start":4412.22,"end":4441.37},{"id":210,"text":"It has to do with a block matrix. By the way, this is not a... Everyone here has seen Sure Compliment. It's just...","zh":"它与一个分块矩阵有关。顺便说一句，这不是一个...在座的每个人都知道Sure Compliment。它只是...","start":4442.17,"end":4447.65},{"id":211,"text":"people didn't use that name right so you know if you're in statistics or probability i mean either you are or you took those classes i hope then this is conditioning on a gaussian but it's tons of other stuff in mechanical electrical engineering it means you take a an electrical circuit and you terminate a bunch of the ports like you short those and you open circuit those and then you ask what does the rest of it look like this is all the all these things are sure complements right so","zh":"人们没有正确使用这个名字，所以你知道，如果你在统计学或概率论领域，我的意思是，你或者你上过这些课，我希望如此，那么这就是在高斯分布上进行条件分析，但机械、电气工程中还有许多其他内容，它意味着你取一个电气电路，并终止一些端口，比如你短路这些端口，开路这些端口，然后你问剩下的部分看起来像什么。所有这些内容都是sure complements，对吧？","start":4447.93,"end":4473.41},{"id":212,"text":"Here it is. It says that a matrix, I mean, I'm not going to go into it now, but this inequality, which notice is like nonlinear, it's got this two norm, is equivalent to this thing, and that's a matrix which is affine in x, right? And the argument is this thing is positive semi-definite if and only if that's bigger than or equal to zero, and sort of this thing minus that times the inverse of that times that is going to be less than or equal to...","zh":"这里它说，一个矩阵，我的意思是，我现在不深入讲解，但这个不等式，注意它是非线性的，它包含一个二范数，等价于这个东西，而这个矩阵是关于x的仿射函数，对吧？论证是这个东西是正半定的，当且仅当那个东西大于等于零，而这个东西减去那个东西乘以那个东西的逆再乘以那个东西，将小于等于...","start":4474.22,"end":4502.92},{"id":213,"text":"a zero, right? So that, or bigger than or equal to zero, that here, right? So that's, so I won't go into that detail, but it's, it's interesting. So I'll do an example. Here's an example. You know, and these are like, we're already in the domain of like, these are not obvious problems, right? So here's one. I have a bunch of symmetric matrices. I'm going to form an affine combination of them. No, I mean, I'm going to form, this is an affine function.","zh":"一个零，对吧？所以，或者大于等于零，这里，对吧？所以，我不会深入讨论这些细节，但这是很有趣的。我将举一个例子。这里有一个例子。你知道的，这些已经处于一个不太明显的领域，对吧？所以这里有一个例子。我有一组对称矩阵。我要对它们形成一个仿射组合。不，我的意思是，我要形成，这是一个仿射函数。","start":4503.8,"end":4531.93}],"notes":["本段介绍了线性矩阵不等式（LMI）的概念，它是一种矩阵不等式，类似于线性不等式。LMI可以用来表示半定规划（SDP），通过将多个线性不等式转换为对角矩阵形式，从而将线性规划（LP）扩展为SDP。","讲者提到，LMI可以扩展到二次约束规划（SOCP），并涉及一个称为sure complement的概念。这个概念在后续的作业中会提到，但讲者没有详细展开。","sure complement涉及块矩阵，它在统计学、概率论以及机械和电气工程中有不同的含义。在电气工程中，它指的是对电路端口进行短路或开路处理后，分析剩余部分的特性。","讲者提到，一个矩阵的不等式（包含二范数）等价于一个关于变量x的仿射矩阵，并且该矩阵是正半定的当且仅当其满足特定的不等式条件。","讲者指出，这些概念涉及复杂的数学关系，例如矩阵的正半定性、仿射函数以及矩阵不等式的等价性，这些都需要进一步的数学推导和验证。","讲者通过一个例子说明了这些概念的应用，即通过形成对称矩阵的仿射组合来构造一个仿射函数，这展示了LMI和SDP在实际问题中的应用。"],"formulas":[],"uncertainties":["sure complement的具体定义和应用","矩阵不等式的等价性推导过程","二范数在矩阵不等式中的具体作用"],"diagram":"none","start":4356.39,"end":4531.93,"asr_flags":[],"math_clarifications":["原句中的数学表述存在不严谨之处，正半定矩阵的定义和矩阵等价性的描述需要更准确的数学定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4356.39,"text":"And, oh, this thing is called an LMI, a linear matrix inequality. It's like a linear inequality, except it's a matrix inequality. So, okay. And, you know, there's things that you do. This says you only have one, but you could just diagonally stack them like this. Yeah. Oh, any suggestion? How would I make, how would I represent an LP as an SDP?"},{"start":4382.66,"text": won't go into that detail, but it's, it's interesting. So I'll do an example. Here's an example. You know, and these are like, we're already in the domain of like, these are not obvious problems, right? So here's one. I have a bunch of symmetric matrices. I'm going to form an affine combination of them. No, I mean, I'm going to form, this is an affine function."}],"speech_gaps":[],"frame":"../frames/v006/027.webp","frame_time":4368.39},{"title":"凸优化中的半定规划与对偶性","segments":[{"id":214,"text":"with these coefficients, right? And I'd like you to choose x1 through xn to minimize the maximum eigenvalue of that matrix. Now, we already discussed this. You know that's convex, right? But that doesn't mean it's obvious how to solve that problem. It turns out it's just an SDP, and it literally looks like that. It's really dumb. This is, by the way, that's an epigraph.","zh":"用这些系数，对吧？我想让你选择x1到xn来最小化这个矩阵的最大特征值。我们之前已经讨论过这个问题。你知道这是凸的，对吧？但这并不意味着解决这个问题是显而易见的。事实上，它只是一个半定规划（SDP），看起来就是这样的。它真的很简单。顺便说一句，这就是所谓的上图（epigraph）。","start":4532.6,"end":4553.52},{"id":215,"text":"for the maximum eigenvalue, right? That the maximum eigenvalue is less than something if and only if that matrix is less than or equal to times t to the identity, right? Okay, so that's the idea. By the way, how many people here have encountered or heard of SDP somewhere else? Just for fun. You did? Cool. Where? What context? Theoretical computer science. Ah, there we go. Awesome. Right.","zh":"关于最大特征值，对吧？最大特征值小于某个值，当且仅当该矩阵小于或等于该值乘以单位矩阵，对吧？好的，这就是这个想法。顺便问一句，这里有多少人曾经听说过或接触过半定规划（SDP）？只是为了好玩。你们知道吗？太棒了。在哪里？什么背景？理论计算机科学。啊，明白了。太棒了。","start":4554.85,"end":4580.84},{"id":216,"text":"Did anyone know that you could actually solve them except for theoretically? No, not really. Okay, yeah, I thought so. Okay, that's fine. That's cool. Totally cool. I have lots of friends who do that. There was another one who saw it. Yes? What? These statistics. These statistics. Okay, cool. Yeah. Okay, good. So it's getting, I mean, it's obviously not totally mainstream or half the class would have raised their hand, but, you know, it's getting there. It's not like, it's not crazy stuff anymore.","zh":"有没有人知道除了理论上之外，你实际上可以解决这些问题？不，真的没有。好的，是的，我想也是这样。没关系。这很酷。完全酷。我有很多朋友就是这样做的。还有一个看到过的人。是吗？什么？这些统计数据。这些统计数据。好的，酷。是的。好的。所以它正在变得，我的意思是，显然不是完全主流，否则一半的同学会举手，但你知道的，它正在接近主流。它不像以前那样疯狂了。","start":4581.7,"end":4610.09},{"id":217,"text":"Okay. Oh, here's an interesting one. Like minimize the, this is a two norm. So that's the induced two norm. It's the maximum singular value, right? Of a matrix. And it says, please like minimize that over some affine set. And this too, you do the same, you do the same thing. You express this as a, as a, an LMI. And then, then everything works out. And the conclusion is you, we could just solve these problems now. We just, we can just solve them.","zh":"好的。哦，这里有一个有趣的例子。比如最小化这个，这是一个二范数。所以这是诱导的二范数。它是矩阵的最大奇异值，对吧？它说，请在某个仿射集合上最小化这个值。同样，你做同样的事情。你将其表达为一个线性矩阵不等式（LMI）。然后，一切都会顺利进行。结论是我们现在可以解决这些问题。我们只需要解决它们。","start":4611.49,"end":4641.03},{"id":218,"text":"So it's actually, it's kind of interesting and cool. Yeah, so, okay. And I think what we'll do is we're going to quit here. We have one more very important topic on optimization next week. And next week we're going to do duality, which is actually super interesting. It's still theoretical, but it's actually super practical.","zh":"实际上，这有点有趣和酷。是的，所以，好的。我想我们在这里就结束了。下周我们还有一个非常重要的优化主题。下周我们将讨论对偶性，这实际上非常有趣。它仍然是理论性的，但实际上是超级实用的。","start":4642.03,"end":4663.59}],"notes":["本段主要讲解了如何将最大特征值问题转化为半定规划（SDP）问题。通过引入一个标量t，使得矩阵小于等于t倍的单位矩阵，从而将原问题转化为一个半定规划问题。这种转化是凸优化中的常见技巧，因为半定规划问题具有良好的理论性质和求解方法。","讲者提到，虽然半定规划在理论上是可行的，但在实际应用中，很多人可能没有接触过。这表明半定规划在实际应用中可能还不够普及，但正在逐渐被接受和使用。","讲者还提到，最小化矩阵的诱导2范数（即最大奇异值）的问题也可以通过将问题转化为线性矩阵不等式（LMI）来解决。这种转化方法使得问题可以被有效地求解，从而展示了半定规划在实际问题中的应用价值。","讲者指出，虽然半定规划在理论上是可行的，但在实际应用中，很多人可能没有接触过。这表明半定规划在实际应用中可能还不够普及，但正在逐渐被接受和使用。","讲者提到，接下来的课程将讨论对偶性，这是优化理论中的一个重要主题。对偶性不仅在理论上具有重要意义，而且在实际应用中也非常实用，这表明对偶性是凸优化中的一个核心概念。","讲者通过多个例子和问题，展示了如何将不同的优化问题转化为半定规划问题，并强调了半定规划在实际应用中的重要性。这些例子和问题帮助学生理解如何将实际问题转化为数学模型，并利用现有的优化方法进行求解。"],"formulas":[{"latex":"||A||_2 = \\text{max singular value of } A","symbols":"矩阵A的诱导2范数等于其最大奇异值","explanation":"该公式正确表达了矩阵的诱导2范数与最大奇异值的关系，无需修改。","evidence":"Okay. Oh, here's an interesting one. Like minimize the, this is a two norm. So that's the induced two norm. It's the maximum singular value, right? Of a matrix. And it says, please like minimize that over some affine set. And this too, you do the same, you do the same thing. You express this as a, as a, an LMI. And then, then everything works out. And the conclusion is you, we could just solve these problems now. We just, we can just solve them."}],"uncertainties":["t to the identity"],"diagram":"none","start":4532.6,"end":4663.59,"asr_flags":[],"math_clarifications":["公式0的表述不完整，缺少必要的数学条件和符号，无法确定其正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":4532.6,"text":"with these coefficients, right? And I'd like you to choose x1 through xn to minimize the maximum eigenvalue of that matrix. Now, we already discussed this. You know that's convex, right? But that doesn't mean it's obvious how to solve that problem. It turns out it's just an SDP, and it literally looks like that. It's really dumb. This is, by the way, that's an epigraph."},{"start":4554.85,"text":"for the maximum eigenvalue, right? That the maximum eigenvalue is less than something if and only if that matrix is less than or equal to times t to the identity, right? Okay, so that's the idea. By the way, how many people here have encountered or heard of SDP somewhere else? Just for fun. You did? Cool. Where? What context? Theoretical computer science. Ah, there we go. Awesome. Right."},{"start":4581.7,"text":"Did anyone know that you could actually solve them except for theoretically? No, not really. Okay, yeah, I thought so. Okay, that's fine. That's cool. Totally cool. I have lots of friends who do that. There was another one who saw it. Yes? What? These statistics. These statistics. Okay, cool. Yeah. Okay, good. So it's getting, I mean, it's obviously not totally mainstream or half the class would have raised their hand, but, you know, it's getting there. It's not like, it's not crazy stuff anymore."},{"start":4611.49,"text":"Okay. Oh, here's an interesting one. Like minimize the, this is a two norm. So that's the induced two norm. It's the maximum singular value, right? Of a matrix. And it says, please like minimize that over some affine set. And this too, you do the same, you do the same thing. You express this as a, as a, an LMI. And then, then everything works out. And the conclusion is you, we could just solve these problems now. We just, we can just solve them."},{"start":4642.03,"text":"So it's actually, it's kind of interesting and cool. Yeah, so, okay. And I think what we'll do is we're going to quit here. We have one more very important topic on optimization next week. And next week we're going to do duality, which is actually super interesting. It's still theoretical, but it's actually super practical."}],"speech_gaps":[],"frame":"../frames/v006/028.webp","frame_time":4544.6}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v006.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
