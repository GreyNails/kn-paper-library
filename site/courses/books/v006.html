have like minus a. So this thing is equivalent to minus ax is less than or equal to minus b. And this one is equivalent to this."},{"start":672.32,"text":"that zero is the same as minus zero. Everybody cool on that? That was step one. Then step two is you just stack, right? So you just do this, and that's less than, okay, b and zero, okay? So here's g, and here's h, okay? So everybody got that? So yeah, we'll never do that again. I'll never do that again. Let's put it that way. And the truth is you don't have to either, because..."}],"speech_gaps":[],"frame":"../frames/v006/004.webp","frame_time":554.52},{"title":"线性规划与凸优化的表达能力","segments":[{"id":49,"text":"you know, modern languages, which you'll be using shortly to do this. We'll do all this stuff for you. Okay. So, so you don't have to know, but you know, in the old days or every, actually every now and then you might meet a colleague, you might be at an internship or something like that. Find someone who's using linear programming or something like that. And they would, they'd say, you know, how long did it take you to do? And they would say, oh, it was huge pain. Took me like weeks and weeks and weeks because they had to convert their problem.","zh":"你知道，现代语言，你很快就会用它们来完成这些工作。我们会为你完成所有这些内容。好的。所以，你不需要知道这些，但你知道，在过去或者现在偶尔你可能会遇到一位同事，你可能在实习或者类似的情况下。找到一个正在使用线性规划或类似方法的人。他们会问，你知道，你花了多长时间？他们会说，哦，这真的很痛苦。花了我好几个星期，好几个星期，好几个星期，因为他们必须将他们的问题转换成这种形式。","start":699.92,"end":726.2},{"id":50,"text":"to they had to do this kind of stuff and keep track of everything, right? And then to debug that is not fun and so on. So we refer to that, I guess, kind of derisively as matrix stuffing.","zh":"他们必须做这种事并跟踪所有内容，对吧？然后去调试这些内容并不有趣，等等。因此，我们戏称为矩阵填充。","start":726.91,"end":746.68},{"id":51,"text":"Yeah, because, yeah. Actually, I think actually that doesn't even fit our general, you know, our general form was very restricted. It was like, you know, fi is less than or equal to zero and stuff. So, but for sure, even if, I mean, yeah, when you do these small transformations, which keep everything equivalent, the thing you transform something or reduce something to, to use the computer science term, is not the same problem. It is equivalent. Yeah, so, okay.","zh":"是的，因为，是的。实际上，我认为这甚至不符合我们的一般形式。你知道，我们的一般形式非常受限。比如，fi 小于等于零之类的。所以，但肯定的是，即使，我的意思是，是的，当你进行这些小的转换，这些转换保持所有内容等价时，你转换或减少到的问题，用计算机科学的术语来说，并不是同一个问题。它等价。是的，所以，好的。","start":747.4,"end":777.56},{"id":52,"text":"All right, so back to, oh, so that's our, here's our healthiest diet thing. What if I had an upper limit on a nutrient? I mean, could we handle it? Yeah, it's kind of something similar. The answer's sure, that would be. We could certainly do that. What if there were supply availability issues and some of these goods, some of these foods are only available up to some current limit of supply?","zh":"好的，那么回到，哦，这就是我们最健康的饮食问题。如果我有一个营养素的上限呢？我的意思是，我们能处理吗？是的，这有点类似。答案肯定是的，那会是。我们当然可以做到这一点。如果存在供应可用性问题，一些这些商品，一些这些食物只能供应到当前的供应上限呢？","start":778.39,"end":810.7},{"id":53,"text":"Of course you could handle that. So once you start figuring out how to do this, you can see that it's very expressive. There's a lot of stuff you could do with it. So this is just a very famous historical example. I think it's probably one of the first ones that people ever talked about.","zh":"当然你可以处理这种情况。一旦你开始弄清楚如何做这些，你就能看到它非常有表达力。你可以用它做很多事情。因此，这只是一个非常著名的例子。我想这可能是人们第一次谈论的例子之一。","start":811.72,"end":827.2},{"id":54,"text":"Next up, for fun, is piecewise linear minimization. So this is a piecewise linear function, right, expressed as the maximum of a bunch of affine functions. So each one of those has a graph that's like a plane, and then you just intersect them, and that's your piecewise linear function, right? And then you want to minimize it, right? And so the way this would work is if I walk up to you and I said, is that an LP?","zh":"接下来，为了好玩，我们讨论分段线性最小化问题。所以这是一个分段线性函数，对吧，它被表示为多个仿射函数的最大值。所以每个仿射函数的图像都像一个平面，然后你将它们相交，就得到了这个分段线性函数，对吧？然后你想要最小化它，对吧？所以这种情况下，如果我走到你面前问你，这是否是一个线性规划问题？","start":829.52,"end":851.3}],"notes":["本段讨论了线性规划在实际应用中的挑战，例如手动处理和调试线性规划问题的困难，以及将其转换为标准形式的繁琐过程。讲者提到这种过程被称为'matrix stuffing'，是一种带有讽刺意味的说法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":699.92,"end":851.3,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":699.92,"text":"you know, modern languages, which you'll be using shortly to do this. We'll do all this stuff for you. Okay. So, so you don't have to know, but you know, in the old days or every, actually every now and then you might meet a colleague, you might be at an internship or something like that. Find someone who's using linear programming or something like that. And they would, they'd say, you know, how long did it take you to do? And they would say, oh, it was huge pain. Took me like weeks and weeks and weeks because they had to convert their problem."},{"start":726.91,"text":"to they had to do this kind of stuff and keep track of everything, right? And then to debug that is not fun and so on. So we refer to that, I guess, kind of derisively as matrix stuffing. So, right. The question? Okay, good question. These are actually equivalent."},{"start":747.4,"text":"Yeah, because, yeah. Actually, I think actually that doesn't even fit our general, you know, our general form was very restricted. It was like, you know, fi is less than or equal to zero and stuff. So, but for sure, even if, I mean, yeah, when you do these small transformations, which keep everything equivalent, the thing you transform something or reduce something to, to use the computer science term, is not the same problem. It is equivalent. Yeah, so, okay."},{"start":778.39,"text":"All right, so back to, oh, so that's our, here's our healthiest diet thing. What if I had an upper limit on a nutrient? I mean, could we handle it? Yeah, it's kind of something similar. The answer's sure, that would be. We could certainly do that. What if there were supply availability issues and some of these goods, some of these foods are only available up to some current limit of supply?"},{"start":811.72,"text":"Of course you could handle that. So once you start figuring out how to do this, you can see that it's very expressive. There's a lot of stuff you could do with it. So this is just a very famous historical example. I think it's probably one of the first ones that people ever talked about."},{"start":829.52,"text":"Next up, for fun, is piecewise linear minimization. So this is a piecewise linear function, right, expressed as the maximum of a bunch of affine functions. So each one of those has a graph that's like a plane, and then you just intersect them, and that's your piecewise linear function, right? And then you want to minimize it, right? And so the way this would work is if I walk up to you and I said, is that an LP?"}],"speech_gaps":[],"frame":"../frames/v006/005.webp","frame_time":711.92},{"title":"线性规划与Chebyshev中心","segments":[{"id":55,"text":"You would have to say no, because, I mean, to check if something is an LP or a linear program, the first thing you do is you check, is the objective linear or affine? It's not, right? I mean, if m is more than 1, it's not affine, right? Okay, so, but in fact, this easily converts to an LP, and you do that by the epigraph form. So you just introduce a new variable t here, and then these constraints here basically say,","zh":"你必须说不，因为，我的意思是，要检查某件事是否是线性规划或线性规划问题，首先要做的是检查目标函数是否是线性或仿射的？它不是，对吧？我的意思是，如果m大于1，它就不是仿射的，对吧？好的，所以，实际上，这很容易转换成一个线性规划问题，你通过上境域形式来做这件事。所以你在这里引入一个新的变量t，然后这些约束基本上说明，","start":852.09,"end":880.85},{"id":56,"text":"that xt is in the epigraph of that function. Or you could just think of it this way. It just says that t is an upper bound on the max of these things. So this would typically, this would actually, this problem here says, minimize the upper bound on the max, but also mess with the x's, right? And so you can quickly argue, you could easily, it's not, I mean, someone has to do it, but you could show that these are actually equivalent. Actually, quite specifically, if you solve that, that's an LP, that's an honest LP.","zh":"xt位于该函数的上境域中。或者你可以这样想，它只是说t是这些项的最大值的上界。因此，这个问题通常会说，最小化这个最大值的上界，同时还要处理x的值，对吧？因此你可以很快地论证，你可以很容易地证明，这些实际上是等价的。实际上，非常具体地说，如果你解决这个问题，它就是一个线性规划问题，这是一个真正的线性规划问题。","start":881.4,"end":909.82},{"id":57,"text":"Right there. That is a linear objective. And these are like linear constraints. Okay, fine. If you wanted to, put the T on the other side. Right? But that's sort of in that thing, and I'm not going to show that type of thing. Everybody got this? So it's kind of cool. And this already is actually kind of useful. Just the ability to... And by the way, most people... Let's see. If you're actually doing this kind of stuff, if you came up with this, and someone said...","zh":"就在那里。这是一个线性目标函数。这些是线性约束。好的。如果你想的话，可以把T放到另一边。对吧？但那是其中的一部分，我不会展示这种类型的东西。大家明白了吗？所以这有点酷。而且这实际上已经很有用了。仅仅具备这种能力……顺便说一句，大多数人……让我们看看。如果你实际上在做这种事，如果你提出了这个问题，而有人问……","start":910.26,"end":938.67},{"id":58,"text":"Well, cool, but how do I solve that? People just look at you and go like, it's an LP. So people would expect you to know that. Or cool people would anyway. Other people would. God only knows what they would do. I do know some of the things they would do. Okay. So we're looking at another example, again, of linear programming. Actually, I think it's actually our first glimpse at...","zh":"嗯，不错，但我要怎么解决这个问题呢？人们只是看着你，然后说，这是一个线性规划问题。所以人们会期望你知道这一点。或者，至少是那些酷的人会知道。其他人也会知道。上帝才知道他们会怎么做。我知道一些他们可能会做的事情。好的。我们现在又在看一个线性规划的例子。实际上，我想这实际上是我们的第一个瞥见……","start":939.0,"end":965.03},{"id":59,"text":"this issue of finding a point that's... Actually, I'll start second. Find a point that's deep inside a set, like a center. I think we talked about... We already found... We already encountered it once. It was the yield center. It says, here's your region of stuff that works. Dial up the machines to get a target so that your yield is maximized. So that was one notion of the center. This is another one. It's a Chebyshev center.","zh":"这个问题是寻找一个位于集合内部深处的点，比如中心。实际上，我将从第二个角度开始。寻找一个位于集合内部深处的点，比如中心。我想我们已经讨论过这个问题。我们已经遇到过一次。它被称为产出中心。它表示，这里是能够工作的材料区域。调整机器以达到目标，从而使产出最大化。因此，这是中心的一个概念。这是另一个中心的概念，称为切比雪夫中心。","start":966.02,"end":990.28},{"id":60,"text":"Here's my polyhedron described by linear inequalities. And your job is this. You want to find the largest inscribed ball. Inscribed means it's inside the polyhedron. Basically, you want to find the largest ball that fits inside the polyhedron. Everybody got it? That's the question. Let me just mention one thing right here, because it's probably worth mentioning.","zh":"这里是我的由线性不等式描述的多面体。你的任务是这个：你想要找到最大的内切球。内切意味着它位于多面体内部。基本上，你想要找到一个能够完全放入多面体内的最大球体。大家明白了吗？这是问题。让我在这里提一下，因为这可能值得提及。","start":991.52,"end":1019.88}],"notes":["本段讨论了如何将非线性规划问题转换为线性规划问题。首先，讲者指出，判断一个问题是线性规划的关键在于目标函数是否为线性或仿射函数。如果目标函数不是线性或仿射函数，则不能直接归类为线性规划。但通过引入新的变量t，并使用上确界形式（epigraph form），可以将问题转换为线性规划问题。","讲者进一步解释了上确界形式的含义，即t是这些函数的最大值的上界。因此，问题转化为最小化这个上界，同时还要处理变量x。讲者指出，这种转换是可行的，并且最终得到的优化问题是一个标准的线性规划问题。","接下来，讲者提到线性规划的一个应用是寻找集合中的中心点，特别是Chebyshev中心。Chebyshev中心指的是在给定的多面体（由线性不等式描述）中，能够容纳最大球体的中心点。这个球体必须完全包含在多面体内部。","讲者强调，寻找Chebyshev中心的问题可以通过线性规划来解决。具体来说，目标是找到一个点，使得该点到多面体边界的所有点的距离最小化，从而最大化球体的半径。这种问题在实际应用中非常有用，例如在优化和工程设计中。","此外，讲者提到，寻找Chebyshev中心是线性规划的一个典型应用，也是课程中首次提到的关于中心点的概念。这与之前提到的“产量中心”（yield center）不同，产量中心关注的是最大化产量，而Chebyshev中心关注的是最大化球体的半径。","最后，讲者指出，寻找Chebyshev中心的问题可以通过线性规划来解决，并且这是一个重要的概念，值得进一步探讨。"],"formulas":[],"uncertainties":[],"diagram":"none","start":852.09,"end":1019.88,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":852.09,"text":"You would have to say no, because, I mean, to check if something is an LP or a linear program, the first thing you do is you check, is the objective linear or affine? It's not, right? I mean, if m is more than 1, it's not affine, right? Okay, so, but in fact, this easily converts to an LP, and you do that by the epigraph form. So you just introduce a new variable t here, and then these constraints here basically say,"},{"start":881.4,"text":"that xt is in the epigraph of that function. Or you could just think of it this way. It just says that t is an upper bound on the max of these things. So this would typically, this would actually, this problem here says, minimize the upper bound on the max, but also mess with the x's, right? And so you can quickly argue, you could easily, it's not, I mean, someone has to do it, but you could show that these are actually equivalent. Actually, quite specifically, if you solve that, that's an LP, that's an honest LP."},{"start":910.26,"text":"Right there. That is a linear objective. And these are like linear constraints. Okay, fine. If you wanted to, put the T on the other side. Right? But that's sort of in that thing, and I'm not going to show that type of thing. Everybody got this? So it's kind of cool. And this already is actually kind of useful. Just the ability to... And by the way, most people... Let's see. If you're actually doing this kind of stuff, if you came up with this, and someone said..."},{"start":939.0,"text":"Well, cool, but how do I solve that? People just look at you and go like, it's an LP. So people would expect you to know that. Or cool people would anyway. Other people would. God only knows what they would do. I do know some of the things they would do. Okay. So we're looking at another example, again, of linear programming. Actually, I think it's actually our first glimpse at..."},{"start":966.02,"text":"this issue of finding a point that's... Actually, I'll start second. Find a point that's deep inside a set, like a center. I think we talked about... We already found... We already encountered it once. It was the yield center. It says, here's your region of stuff that works. Dial up the machines to get a target so that your yield is maximized. So that was one notion of the center. This is another one. It's a Chebyshev center."},{"start":991.52,"text":"Here's my polyhedron described by linear inequalities. And your job is this. You want to find the largest inscribed ball. Inscribed means it's inside the polyhedron. Basically, you want to find the largest ball that fits inside the polyhedron. Everybody got it? That's the question. Let me just mention one thing right here, because it's probably worth mentioning."}],"speech_gaps":[],"frame":"../frames/v006/006.webp","frame_time":864.09},{"title":"线性规划与二次规划的视觉区分","segments":[{"id":61,"text":"If someone comes up to you and says, I mean, if we're talking about linear programming, then here are the things. First of all, a part of your brain should light up. On the geometric side, you should see pictures of affine functions. Maybe you should also see pictures of piecewise affine functions. Those are the things that should light up when I say linear programming to you in your brain. We know this. We actually do take students, put them in MRI machines, and check these things.","zh":"如果有人走到你面前说，我指的是，如果我们谈论的是线性规划，那么这里有一些东西。首先，你大脑的一部分应该会亮起来。从几何的角度来看，你应该看到仿射函数的图像。也许你也应该看到分段仿射函数的图像。这些就是当你在脑海中听到线性规划时应该亮起来的部分。我们知道这一点。实际上，我们确实会带学生去核磁共振仪里，检查这些情况。","start":1021.9,"end":1050.7},{"id":62,"text":"Actually, we don't, but we could. If we did, then every time after that, I could actually honestly say we did this. So I may even think, I'll think about it. Okay. All right. So what I was saying is that the minute you get to a two norm, a rather different part of your brain should light up.","zh":"实际上，我们并没有这么做，但我们可以这么做。如果我们这么做，那么之后每次我都可以诚实地告诉你我们确实做过这件事。所以我可能会想，我会考虑一下。好的。那么我刚才说的是，一旦你涉及到二范数，应该有另一部分大脑亮起来。","start":1051.6,"end":1073.04},{"id":63,"text":"Because when I say 2-norm to you, visually, here's what should be showing up. Things that are round, balls, Euclidean distances, right? Which should not be stored anywhere near the part of your brain that lights up when I say linear program. Which should be piecewise linear things, flat things, affine things, that kind of thing. Everybody following this? So, honestly, when you're listening and you see that, and you just see this ball here, you should say, there's no way.","zh":"因为当我对你说二范数时，从视觉上来看，这里应该出现的东西是圆形的，球体，欧几里得距离，对吧？这些不应该存储在当你听到线性规划时亮起来的大脑部分附近。这些应该是分段线性的、平坦的、仿射的那些东西。大家都能跟上吗？所以，诚实地讲，当你在听的时候，看到这些，看到这个球体，你应该说，这不可能。","start":1073.98,"end":1101.82},{"id":64,"text":"that something involving a quadratic is going to end up as a linear program. I'm just, I mean, obviously it does because right here on the slide, but the point is, I'm just, I'm just saying it's a little bit surprising, right? So, okay. All right. So how do you solve that? How do you find the, how do you find the ball, the largest ball that fits inside a polyhedron?","zh":"涉及到二次的东西最终会变成一个线性规划，我指的是，显然它确实如此，因为就在这张幻灯片上，但重点是，我只是说这有点令人惊讶，对吧？好的。那么，好吧。那么你是怎么解决这个问题的？你是怎么找到那个最大的球体，它能完全包含在一个多面体内的？","start":1102.42,"end":1125.33},{"id":65,"text":"Well, here's what you do. What you do, the first thing you ask is, when is it true that a ball is in a half space? Because then to say a ball is in a polyhedron is to say it's in all of these half spaces, because the polyhedron is the intersection of the half spaces. Okay, so when is a ball in a half space? And the answer is kind of interesting. We parameterize the ball by its center and its radius. That's a vector and it's not a positive scalar, okay? Okay, so here it is.","zh":"好吧，这里是你该怎么做。你首先应该问的是，什么时候一个球体位于一个半空间内？因为然后说一个球体位于一个多面体内，就是说它位于所有这些半空间内，因为多面体是这些半空间的交集。好的，那么什么时候一个球体位于一个半空间内？答案有点有趣。我们通过球体的中心和半径来参数化它。这是一个向量，它不是一个正标量，对吧？好的，那么这里就是。","start":1125.87,"end":1154.39},{"id":66,"text":"When is it true? What you want to do is you want to maximize this over the ball, and you want that maximum to be less than bi. But that we can solve. If I ask you to maximize an inner product over a ball, it's easy. We can do that exactly, right? Because it's, first of all, there's the Cauchy-Schwartz inequality. Basically, the Cauchy-Schwartz inequality is tight. That's what happens, right? And so it turns out this thing, that's the maximum value of this thing over a ball.","zh":"什么时候这是正确的？你想要做的事情是，在这个球体上最大化这个值，并且你希望这个最大值小于bi。但我们可以解决这个问题。如果我让你在球体上最大化一个内积，这是很容易的。我们可以精确地做到这一点，对吧？因为首先，柯西-施瓦茨不等式是紧的。基本上，这就是会发生的情况，对吧？结果发现，这个值就是在这个球体上的最大值。","start":1155.03,"end":1182.49}],"notes":["本段讲解了如何判断一个球是否包含在半空间内，这是解决球体在多面体内的关键步骤。通过参数化球体的中心和半径，可以将问题转化为最大化内积的问题，这可以通过柯西-施瓦茨不等式来解决。柯西-施瓦茨不等式在此处被强调为一个紧致的不等式，即等号成立的情况。","在判断球是否在半空间内时，需要确保球体的最大内积小于等于半空间的边界值。这一步骤是将几何问题转化为优化问题的核心。","通过最大化内积，可以确定球体是否完全位于半空间内。这一过程展示了如何将几何直观转化为数学优化问题，是凸优化中的典型例子。","柯西-施瓦茨不等式在此处被明确提及，并且强调其在该问题中的紧致性，即等号成立的情况。这表明该不等式在该问题中具有决定性作用。","本段还暗示了球体与半空间之间的关系，以及如何通过优化方法来判断这种关系。这为后续讨论球体在多面体内的问题奠定了基础。","通过将几何问题转化为数学优化问题，本段展示了凸优化在实际问题中的应用，特别是如何利用不等式和优化技术来解决几何约束问题。"],"formulas":[{"latex":"max_{x \\text{ in ball}} x^T a","symbols":"最大化内积","explanation":"公式正确，表示在球内最大化向量x与向量a的内积。","evidence":"When is it true? What you want to do is you want to maximize this over the ball, and you want that maximum to be less than bi. But that we can solve. If I ask you to maximize an inner product over a ball, it's easy. We can do that exactly, right? Because it's, first of all, there's the Cauchy-Schwartz inequality. Basically, the Cauchy-Schwartz inequality is tight. That's what happens, right? And so it turns out this thing, that's the maximum value of this thing over a ball."},{"latex":"x^T a \\text{ is maximized at } x = \\frac{a}{\\|a\\|} r","symbols":"内积最大值的计算","explanation":"公式正确，表示在球内最大化内积时，x取方向与a相同，长度为r。","evidence":"When is it true? What you want to do is you want to maximize this over the ball, and you want that maximum to be less than bi. But that we can solve. If I ask you to maximize an inner product over a ball, it's easy. We can do that exactly, right? Because it's, first of all, there's the Cauchy-Schwartz inequality. Basically, the Cauchy-Schwartz inequality is tight. That's what happens, right? And so it turns out this thing, that's the maximum value of this thing over a ball."},{"latex":"x^T a \\text{ is bounded by } \\|x\\| \\|a\\| \\text{ by Cauchy-Schwarz inequality}","symbols":"柯西-施瓦茨不等式","explanation":"公式正确，表示内积的上界由柯西-施瓦茨不等式给出。","evidence":"When is it true? What you want to do is you want to maximize this over the ball, and you want that maximum to be less than bi. But that we can solve. If I ask you to maximize an inner product over a ball, it's easy. We can do that exactly, right? Because it's, first of all, there's the Cauchy-Schwartz inequality. Basically, the Cauchy-Schwartz inequality is tight. That's what happens, right? And so it turns out this thing, that's the maximum value of this thing over a ball."}],"uncertainties":[],"diagram":"none","start":1021.9,"end":1182.49,"asr_flags":[],"math_clarifications":["所有公式均正确，无需额外说明。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1021.9,"text":"If someone comes up to you and says, I mean, if we're talking about linear programming, then here are the things. First of all, a part of your brain should light up. On the geometric side, you should see pictures of affine functions. Maybe you should also see pictures of piecewise affine functions. Those are the things that should light up when I say linear programming to you in your brain. We know this. We actually do take students, put them in MRI machines, and check these things."},{"start":1051.6,"text":"Actually, we don't, but we could. If we did, then every time after that, I could actually honestly say we did this. So I may even think, I'll think about it. Okay. All right. So what I was saying is that the minute you get to a two norm, a rather different part of your brain should light up."},{"start":1073.98,"text":"Because when I say 2-norm to you, visually, here's what should be showing up. Things that are round, balls, Euclidean distances, right? Which should not be stored anywhere near the part of your brain that lights up when I say linear program. Which should be piecewise linear things, flat things, affine things, that kind of thing. Everybody following this? So, honestly, when you're listening and you see that, and you just see this ball here, you should say, there's no way."},{"start":1102.42,"text":"that something involving a quadratic is going to end up as a linear program. I'm just, I mean, obviously it does because right here on the slide, but the point is, I'm just, I'm just saying it's a little bit surprising, right? So, okay. All right. So how do you solve that? How do you find the, how do you find the ball, the largest ball that fits inside a polyhedron?"},{"start":1125.87,"text":"Well, here's what you do. What you do, the first thing you ask is, when is it true that a ball is in a half space? Because then to say a ball is in a polyhedron is to say it's in all of these half spaces, because the polyhedron is the intersection of the half spaces. Okay, so when is a ball in a half space? And the answer is kind of interesting. We parameterize the ball by its center and its radius. That's a vector and it's not a positive scalar, okay? Okay, so here it is."},{"start":1155.03,"text":"When is it true? What you want to do is you want to maximize this over the ball, and you want that maximum to be less than bi. But that we can solve. If I ask you to maximize an inner product over a ball, it's easy. We can do that exactly, right? Because it's, first of all, there's the Cauchy-Schwartz inequality. Basically, the Cauchy-Schwartz inequality is tight. That's what happens, right? And so it turns out this thing, that's the maximum value of this thing over a ball."}],"speech_gaps":[],"frame":"../frames/v006/007.webp","frame_time":1033.9},{"title":"凸优化中的Chebyshev中心与线性分数规划","segments":[{"id":67,"text":"of this, oh sorry, yeah, that's right. That's the maximum value of this over the ball, and it's equal to ai transpose xc, that's this term, plus, and then over here we have ai transpose u, but u is less than r, and so by Cauchy-Schwarz, that's definitely, that's an upper bound, but in fact, it's equal, if I take u the right way. Right, so, in fact, u would be ai appropriately scaled. Okay? So, it says that you get that","zh":"关于这个，哦抱歉，对的，这就是这个球上的最大值，等于ai转置xc，这是这个项，再加上，然后在这里我们有ai转置u，但u小于r，因此根据柯西-施瓦茨不等式，这显然是一个上界，但实际上，如果以正确的方式选择u，它就等于。对的，实际上，u应该是适当缩放的ai。明白吗？所以，它说明了你得到这个结果","start":1183.1,"end":1210.78},{"id":68,"text":"B is a subset of P if and only if this holds for each i. So that's this constraint here. Now, when you look at this, again, you see a two norm here. And so there should be like at least a yellow light flashing somewhere. Like this is not going to be an LP because it's got a two norm. It'd be the same if there was an X or a sine or a cosine.","zh":"B是P的子集，当且仅当对于每个i，这个条件成立。所以这就是这里的约束条件。现在，当你看这个时，再次看到这里有一个二范数。因此，应该会有某种黄色警示灯亮起。比如，这不会是一个线性规划问题，因为它包含了一个二范数。如果这里有一个X或正弦或余弦，结果也是一样的。","start":1212.26,"end":1234.21},{"id":69,"text":"you would say, doesn't sound like LP to me. But you just got to be very careful here and take a look at this. The variables are r and xc. And the objective is linear. That's cool. And then we look at these constraints. Again, the two norm is causing this, you know, either discomfort or yellow flashing light, right? Which is warning, warning, may not be, need not be LP ahead.","zh":"你会说，这听起来不像线性规划。但你必须非常小心地看一下这个。变量是r和xc。目标函数是线性的，这很好。然后我们再看这些约束条件。同样，二范数导致了这种不适或黄色警示灯，对吧？这在警告，警告，可能不是，不一定是一个线性规划问题。","start":1234.8,"end":1259.29},{"id":70,"text":"But that's AI is given data. It describes a face of the polyhedron. So that's just a positive number. What kind of what kind of constraint is that in the variables which are X, C and R? It's just linear. OK, so I mean, maybe I made too big a deal out of it. Anyway, so by the way, practical conclusion is you can solve this problem even at enormous scales. OK, so there you go. By the way, is the Chebyshev center of a polyhedron, is it unique?","zh":"但这里的AI是给定的数据。它描述了多面体的一个面。所以这只是一个正数。在变量X、C和R中，这是什么类型的约束？它只是一个线性约束。好的，我的意思是，也许我太在意这个了。无论如何，一个实际的结论是你可以在非常大的规模上解决这个问题。好的，所以就是这样。顺便问一句，多面体的Chebyshev中心是唯一的吗？","start":1260.64,"end":1290.62},{"id":71,"text":"Is it? I see some people saying no. How come? What's an example? A rectangle would have a bottom. I like it. Okay, so here's a rectangle, right? This is going to come out terribly, but okay, that's a, if that were inside, that would have been a Chebyshev, that would have been a Chebyshev, a solution to the Chebyshev problem, but so is this. Okay? So, right? So, so that, anyway, so it's not.","zh":"是吗？我看到有些人说不是。为什么会这样？举个例子？一个矩形会有底部。我喜欢这个例子。好的，这里有一个矩形，对吧？这会得出非常糟糕的结果，但没关系，如果这个矩形在内部，那就会是一个Chebyshev中心，也就是Chebyshev问题的解，但这个也是。明白吗？所以，对的，所以它不是唯一的。","start":1292.54,"end":1319.84},{"id":72,"text":"By the way, this is already kind of quite useful here, right? Because it's already, I mean, this already has like just immediate applications, right? So, okay. Next up, I think we're at around 1950 or something like that. So here we are. This is, yeah, so part of this is also historical, but it's not bad to know these names, right? So here's one. So linear fractional program, that looks like this.","zh":"顺便说一下，这在这里已经相当有用了吧，对吧？因为这已经，我的意思是，这已经有直接的应用了，对吧？所以，好的。接下来，我想我们到了大约1950年左右。所以，我们现在在这里。这是，没错，这也有一定的历史背景，但知道这些名字也不坏，对吧？这里有一个例子。所以，线性分数规划，看起来像这样。","start":1322.14,"end":1352.29}],"notes":["本段讨论了凸优化中Chebyshev中心的定义及其与球体最大值的关系。通过Cauchy-Schwarz不等式，说明了如何通过适当缩放向量u来达到最大值。同时，指出Chebyshev中心可能不唯一，以矩形为例说明了这一点。","本段强调了凸优化问题中二范数的存在对问题性质的影响。虽然二范数的存在可能让人误以为是非线性规划（LP），但通过分析变量和目标函数的线性性质，可以确定该问题仍然是线性规划。","本段提到Chebyshev中心在实际应用中的重要性，指出即使在大规模问题中也可以求解。同时，通过讨论Chebyshev中心的唯一性，进一步加深了对凸优化问题的理解。","本段引入了历史背景，提到1950年代左右的线性分数规划（linear fractional program）的概念，并指出了解这类问题的必要性。","本段通过具体例子（如矩形）说明了Chebyshev中心可能不唯一，强调了凸优化中约束条件和目标函数的几何意义。","本段总结了Chebyshev中心的计算方法及其在实际问题中的应用价值，同时引出了后续关于线性分数规划的内容，为后续课程内容做了铺垫。"],"formulas":[{"latex":"a_i^T x_c","symbols":"a_i^T x_c","explanation":"保持原式，该式为向量a_i与向量x_c的点积，符合数学记号规范。","evidence":"of this, oh sorry, yeah, that's right. That's the maximum value of this over the ball, and it's equal to ai transpose xc, that's this term, plus, and then over here we have ai transpose u, but u is less than r, and so by Cauchy-Schwarz, that's definitely, that's an upper bound, but in fact, it's equal, if I take u the right way. Right, so, in fact, u would be ai appropriately scaled. Okay? So, it says that you get that"},{"latex":"a_i^T u","symbols":"a_i^T u","explanation":"保持原式，该式为向量a_i与向量u的点积，符合数学记号规范。","evidence":"of this, oh sorry, yeah, that's right. That's the maximum value of this over the ball, and it's equal to ai transpose xc, that's this term, plus, and then over here we have ai transpose u, but u is less than r, and so by Cauchy-Schwarz, that's definitely, that's an upper bound, but in fact, it's equal, if I take u the right way. Right, so, in fact, u would be ai appropriately scaled. Okay? So, it says that you get that"},{"latex":"||u||_2 \u003c r","symbols":"||u||_2 \u003c r","explanation":"保持原式，该式表示向量u的2-范数小于r，符合数学记号规范。","evidence":"B is a subset of P if and only if this holds for each i. So that's this constraint here. Now, when you look at this, again, you see a two norm here. And so there should be like at least a yellow light flashing somewhere. Like this is not going to be an LP because it's got a two norm. It'd be the same if there was an X or a sine or a cosine."},{"latex":"||x||_2","symbols":"||x||_2","explanation":"保持原式，该式表示向量x的2-范数，符合数学记号规范。","evidence":"B is a subset of P if and only if this holds for each i. So that's this constraint here. Now, when you look at this, again, you see a two norm here. And so there should be like at least a yellow light flashing somewhere. Like this is not going to be an LP because it's got a two norm. It'd be the same if there was an X or a sine or a cosine."}],"uncertainties":["AI is given data"],"diagram":"none","start":1183.1,"end":1352.29,"asr_flags":[],"math_clarifications":["所有公式均符合数学记号规范，未发现需要移除或修改的公式。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1183.1,"text":"of this, oh sorry, yeah, that's right. That's the maximum value of this over the ball, and it's equal to ai transpose xc, that's this term, plus, and then over here we have ai transpose u, but u is less than r, and so by Cauchy-Schwarz, that's definitely, that's an upper bound, but in fact, it's equal, if I take u the right way. Right, so, in fact, u would be ai appropriately scaled. Okay? So, it says that you get that"},{"start":1212.26,"text":"B is a subset of P if and only if this holds for each i. So that's this constraint here. Now, when you look at this, again, you see a two norm here. And so there should be like at least a yellow light flashing somewhere. Like this is not going to be an LP because it's got a two norm. It'd be the same if there was an X or a sine or a cosine."},{"start":1234.8,"text":"you would say, doesn't sound like LP to me. But you just got to be very careful here and take a look at this. The variables are r and xc. And the objective is linear. That's cool. And then we look at these constraints. Again, the two norm is causing this, you know, either discomfort or yellow flashing light, right? Which is warning, warning, may not be, need not be LP ahead."},{"start":1260.64,"text":"But that's AI is given data. It describes a face of the polyhedron. So that's just a positive number. What kind of what kind of constraint is that in the variables which are X, C and R? It's just linear. OK, so I mean, maybe I made too big a deal out of it. Anyway, so by the way, practical conclusion is you can solve this problem even at enormous scales. OK, so there you go. By the way, is the Chebyshev center of a polyhedron, is it unique?"},{"start":1292.54,"text":"Is it? I see some people saying no. How come? What's an example? A rectangle would have a bottom. I like it. Okay, so here's a rectangle, right? This is going to come out terribly, but okay, that's a, if that were inside, that would have been a Chebyshev, that would have been a Chebyshev, a solution to the Chebyshev problem, but so is this. Okay? So, right? So, so that, anyway, so it's not."},{"start":1322.14,"text":"By the way, this is already kind of quite useful here, right? Because it's already, I mean, this already has like just immediate applications, right? So, okay. Next up, I think we're at around 1950 or something like that. So here we are. This is, yeah, so part of this is also historical, but it's not bad to know these names, right? So here's one. So linear fractional program, that looks like this."}],"speech_gaps":[],"frame":"../frames/v006/008.webp","frame_time":1195.1},{"title":"线性分式问题与凸优化","segments":[{"id":73,"text":"You minimize a linear fractional function. That's a ratio of two affine functions where, actually by convention, we assume the domain is where the denominator is positive. Okay? That's what that is. And then set just over a polyhedron. That's all.","zh":"你最小化一个线性分式函数。这是一个两个仿射函数的比值，实际上按照惯例，我们假设定义域是分母为正的区域。好吗？这就是它的定义。然后是在一个多面体上进行优化。这就是全部。","start":1352.78,"end":1369.78},{"id":74,"text":"Okay, now it's a quasi-convex problem, and we just talked about how to solve them. So you can always solve a linear fractional problem by doing bisection, where you're calling an LP solver in each step, right? So that's part of the generic thing.","zh":"好的，现在这是一个拟凸问题，我们刚刚讨论了如何解决这类问题。因此，你可以通过二分法来解决线性分式问题，其中每一步都会调用一个线性规划求解器，对吧？这就是通用方法的一部分。","start":1370.19,"end":1385.11},{"id":75,"text":"But what's cool here, and this was figured out maybe also in maybe the 50s or early 60s, I don't remember exactly. It turns out you can solve this problem as a single LP. And I won't get into the details, but it's something where you can look in the book, look here. It's not totally obvious how to do this. Yeah, you introduce some new variables. I think I won't go into it. And you re-parameterize. And in fact, it has to do with this perspective transformation.","zh":"但这里有趣的是，这可能在50年代或60年代初就已经被发现了，我不记得确切的时间。结果发现你可以将这个问题转化为一个单一的线性规划问题。我不会深入细节，但这是某种需要查阅书籍或参考资料才能理解的方法。并不是完全显而易见的。是的，你引入一些新的变量。我想我不会详细讲解。然后你重新参数化。事实上，这与所谓的透视变换有关。","start":1386.11,"end":1412.97},{"id":76,"text":"I'm not going to say anything. So, by the way, you should not, there's no way a person can look at that with this and then say, look at this and go, oh, yeah, no, I totally see it. So, this is an example of a problem transformation that's not obvious. And I think I'm not going to take the time to go into it. So, the others have all been obvious, right? Like, you know, you can take an inequality that's bigger than or equal to, multiply everything by minus one, and now it's less than or equal to, right? This one is not.","zh":"我什么都不说。顺便说一句，你不要指望有人能看着这个并说，哦，是的，我完全明白了。所以，这是一个不明显的优化问题转换的例子。我想我不会花时间去讲解它。其他的都比较明显，对吧？比如，你知道，你可以将一个大于等于的不等式乘以负一，然后就变成了小于等于的不等式，对吧？这个就不明显。","start":1413.58,"end":1441.65},{"id":77,"text":"Actually, there's a whole bunch that are not, which we'll get to. Okay. Now, a generalization of that is this so-called, people call it generalized linear fractional problem. That's a maximum of a bunch of these. These are actually quasi-convex, and the maximum of a bunch of quasi-convex functions is quasi-convex. So that's quasi-convex. And in fact, for this problem, the only way to solve it is in fact by bisection, as far as I know. I mean, not that it matters, right? But, okay.","zh":"实际上，还有一大类这样的问题，我们之后会讲到。好的。这种问题的一般化被称为所谓的广义线性分式问题。这是这些函数的最大值。实际上，这些函数是拟凸的，多个拟凸函数的最大值也是拟凸的。因此，这是拟凸的。事实上，据我所知，解决这类问题的唯一方法就是二分法。虽然这可能并不重要，对吧？好吧。","start":1443.46,"end":1471.88},{"id":78,"text":"And it's the von Neumann model of a growing economy, right?","zh":"这是冯·诺伊曼提出的经济增长模型，对吧？","start":1472.29,"end":1476.77},{"id":79,"text":"So let me explain what it is.","zh":"让我解释一下这是什么。","start":1476.87,"end":1478.29},{"id":80,"text":"We have two sets of variables, x and x plus.","zh":"我们有两个变量集合，x和x加。","start":1478.47,"end":1481.85},{"id":81,"text":"And each of those, they're non-negative, and they represent, hey, wait a minute.","zh":"其中每一个都是非负的，它们代表，等等，等等。","start":1481.99,"end":1488.35},{"id":82,"text":"Do we have x?","zh":"我们有x吗？","start":1488.45,"end":1489.19},{"id":83,"text":"Hey, shouldn't I have x bigger than or equal to 0 here?","zh":"嘿，我这里不应该有x大于等于0吗？","start":1489.99,"end":1493.19},{"id":84,"text":"Yeah, we should.","zh":"是的，我们应该有。","start":1496.11,"end":1497.17},{"id":85,"text":"Or maybe it's absorbed in the denominator of this.","zh":"或者它可能已经被包含在这个分母中了。","start":1497.35,"end":1501.87},{"id":86,"text":"Sorry, okay, I confused myself momentarily. My confusion is over now though. So everything's cool. Okay","zh":"抱歉，好的，我刚才有点混乱。不过我的困惑现在已经解除了。所以一切都没问题。好的","start":1501.87,"end":1507.37},{"id":87,"text":"Here it is","zh":"这里就是","start":1507.37,"end":1509.65},{"id":88,"text":"Okay, so X plus is the economic activity across n sectors of an economy","zh":"好的，所以X加号代表一个经济体中n个部门的经济活动","start":1510.27,"end":1516.33},{"id":89,"text":"X is the current economic activity across n sectors in an economy, right?","zh":"X 表示经济中 n 个部门当前的经济活动，对吗？","start":1517.21,"end":1522.17},{"id":90,"text":"Xi plus over xi is","zh":"Xi 加上 over xi 是","start":1524.31,"end":1526.77},{"id":91,"text":"Literally the growth in that sector of the economy. So you would say","zh":"字面上就是该部门经济的增长。因此你会说","start":1527.43,"end":1531.37}],"notes":["本段讲解了线性分式问题的求解方法，指出这类问题可以通过二分法求解，每次调用线性规划求解器。同时提到，虽然这种方法是通用的，但还有一种更高效的方法，即通过引入新变量和重新参数化，将问题转化为单个线性规划问题，这涉及到透视变换。"],"formulas":[],"uncertainties":["Xi plus over xi is"],"diagram":"none","start":1352.78,"end":1531.37,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":1352.78,"text":"You minimize a linear fractional function. That's a ratio of two affine functions where, actually by convention, we assume the domain is where the denominator is positive. Okay? That's what that is. And then set just over a polyhedron. That's all."},{"start":1370.19,"text":"Okay, now it's a quasi-convex problem, and we just talked about how to solve them. So you can always solve a linear fractional problem by doing bisection, where you're calling an LP solver in each step, right? So that's part of the generic thing."},{"start":1386.11,"text":"But what's cool here, and this was figured out maybe also in maybe the 50s or early 60s, I don't remember exactly. It turns out you can solve this problem as a single LP. And I won't get into the details, but it's something where you can look in the book, look here. It's not totally obvious how to do this. Yeah, you introduce some new variables. I think I won't go into it. And you re-parameterize. And in fact, it has to do with this perspective transformation."},{"start":1413.58,"text":"I'm not going to say anything. So, by the way, you should not, there's no way a person can look at that with this and then say, look at this and go, oh, yeah, no, I totally see it. So, this is an example of a problem transformation that's not obvious. And I think I'm not going to take the time to go into it. So, the others have all been obvious, right? Like, you know, you can take an inequality that's bigger than or equal to, multiply everything by minus one, and now it's less than or equal to, right? This one is not."},{"start":1443.46,"text":"Actually, there's a whole bunch that are not, which we'll get to. Okay. Now, a generalization of that is this so-called, people call it generalized linear fractional problem. That's a maximum of a bunch of these. These are actually quasi-convex, and the maximum of a bunch of quasi-convex functions is quasi-convex. So that's quasi-convex. And in fact, for this problem, the only way to solve it is in fact by bisection, as far as I know. I mean, not that it matters, right? But, okay. And here's a very famous example that's from von Neumann."},{"start":1472.29,"text":"And it's the von Neumann model of a growing economy, right?"},{"start":1476.87,"text":"So let me explain what it is."},{"start":1478.47,"text":"We have two sets of variables, x and x plus."},{"start":1481.99,"text":"And each of those, they're non-negative, and they represent, hey, wait a minute."},{"start":1488.45,"text":"Do we have x?"},{"start":1489.99,"text":"Hey, shouldn't I have x bigger than or equal to 0 here?"},{"start":1496.11,"text":"Yeah, we should."},{"start":1497.35,"text":"Or maybe it's absorbed in the denominator of this."},{"start":1501.87,"text":"Sorry, okay, I confused myself momentarily. My confusion is over now though. So everything's cool. Okay"},{"start":1507.37,"text":"Here it is"},{"start":1510.27,"text":"Okay, so X plus is the economic activity across n sectors of an economy"},{"start":1517.21,"text":"X is the current economic activity across n sectors in an economy, right?"},{"start":1524.31,"text":"Xi plus over xi is"},{"start":1527.43,"text":"Literally the growth in that sector of the economy. So you would say"}],"speech_gaps":[],"frame":"../frames/v006/009.webp","frame_time":1364.78},{"title":"经济活动水平与凸优化问题","segments":[{"id":92,"text":"I don't know, you know, steel manufacturing went up 6%, it means that this number is 1.06.","zh":"我不知道，你知道的，钢铁制造业增长了6%，这意味着这个数字是1.06。","start":1531.87,"end":1537.79},{"id":93,"text":"If it's 0.93, it means that it actually contracted 7%. Everybody got it? Okay, so here's what we want.","zh":"如果它是0.93，这意味着它实际上收缩了7%。大家明白了吗？好的，那么我们想要的是什么。","start":1538.51,"end":1547.17},{"id":94,"text":"We want to figure out what would be the right economic activity levels to maximize the minimum","zh":"我们想要确定什么样的经济活动水平能够最大化各个经济部门的最小增长","start":1547.25,"end":1555.23},{"id":95,"text":"growth in sectors across the economy that's that's this right okay okay here","zh":"经济增长在经济各部门中的增长，就是这个，好的，好的，这里有什么约束呢？","start":1555.23,"end":1564.09},{"id":96,"text":"are the constraints here's how X and X plus are constrained they're constrained","zh":"这里是约束条件，X和X加上是如何被约束的，它们被这样约束","start":1564.09,"end":1568.33},{"id":97,"text":"this way we have two matrices we have a number of goods that are consumed","zh":"我们有两个矩阵，我们有被经济活动消耗和生产的产品数量","start":1568.33,"end":1575.09},{"id":98,"text":"that are consumed and also produced by economic activity. So one unit of economic activity in sector I might consume a bunch of things. Actually, it's going to have positive and negative sides. Because if it's consuming, it'll have all sorts of stuff that it's maybe consuming, but it's also producing stuff. Like manufacturing automobiles, it consumes steel.","zh":"这些产品被经济活动所消耗和生产。因此，一个部门的单位经济活动可能会消耗很多东西。实际上，它会有正负两面。因为如果它在消耗，它可能会消耗各种东西，但它也在生产东西。例如，制造汽车会消耗钢铁。","start":1576.67,"end":1600.17},{"id":99,"text":"various other things, and, you know, that it produces cars, like just as an example. Okay, so what this says is, so AX, when you multiply the matrix A by the vector X, what you get is the vector of, you get what is produced this year.","zh":"各种其他东西，并且，你知道的，它也会生产汽车，就像一个例子。好的，那么这说明的是，当我们将矩阵A乘以向量X时，得到的是今年生产的向量。","start":1601.89,"end":1623.32},{"id":100,"text":"That's the set of goods that were produced this year. And the model here is very simple. If this is year, quarters, or months, it doesn't matter. The idea is that what's produced this year, we kind of imagine, is not immediately fed into, but it's almost as if, well, we do this in discrete time.","zh":"这是今年生产的产品集合。这里的模型非常简单。无论这是年、季度还是月份，都不重要。想法是，今年生产的产品并不会立即被投入使用，几乎就像是，我们是在离散时间中进行操作。","start":1624.38,"end":1640.86},{"id":101,"text":"So what's produced now is kind of held in escrow for a year. And then on January 1st, everything starts up again and you use those. So what this says is that's the vector of resources consumed by economic activity next year.","zh":"因此，现在生产的产品会被暂时存放一年。然后在1月1日，一切重新开始，并使用这些产品。因此，这表示的是明年经济活动所消耗的资源向量。","start":1641.3,"end":1654.38},{"id":102,"text":"And it says that is less than or equal to what you produced this year. And there's tons of variations on this, right? We could do all sorts of variations on this. We could have, for example, we could do this for 10 periods and have a running, you know, a stockpile of stuff, right? So, okay. Everybody, but this is the basic one. It makes sense? Okay. And this is just immediately a generalized linear fractional problem. A few things here. I'm maximizing a min.","zh":"它表示的是这个向量小于或等于今年生产的总量。而且这种形式有很多变种，对吧？我们可以对这种形式进行各种变化。例如，我们可以对10个时期进行操作，并积累一些库存，对吧？好的，大家，但这是最基本的一种。这有道理吗？好的。这实际上是一个广义的线性分数规划问题。几点需要注意：我是在最大化一个最小值。","start":1655.03,"end":1684.11},{"id":103,"text":"Whereas this thing should say minimize a maximum. But you just flip the sign and everything's cool. Everybody got it? And by the way, things like this, these are not obvious things. I guarantee you with 10 sectors, you could not figure this out by hand. I mean, it's just absolutely out of the question. So, I mean, but of course...","zh":"而这个应该表示的是最小化一个最大值。但你只需翻转符号，一切就都解决了。大家明白了吗？顺便说一句，这类问题并不是显而易见的。我保证，如果有10个部门，你不可能手动推导出这个结果。我的意思是，这根本不可能做到。所以，我意思是，当然……","start":1684.67,"end":1706.93}],"notes":["本段讲授了经济活动水平的优化问题，重点在于如何通过凸优化方法最大化最小增长。讲者首先通过钢铁制造业增长6%的例子，说明了如何将百分比变化转化为数值，如1.06表示增长6%。接着，讲者指出如果数值为0.93，则表示收缩7%。这为后续的优化问题提供了背景。","讲者进一步说明了优化的目标是确定合适的经济活动水平，以最大化各经济部门的最小增长。这涉及到一个约束条件，即资源消耗不能超过生产量。讲者提到，这种问题可以建模为一个线性分数规划问题，但需要通过凸优化方法来解决。","讲者强调了这种问题的复杂性，特别是当涉及多个部门时，手动计算几乎是不可能的。因此，需要借助凸优化方法来处理。讲者还提到，这种问题的结构可以扩展到多个时间段，例如10个周期，并且可以考虑库存的累积。","讲者指出，这种问题的优化目标是最大化最小增长，但通常在数学上，这需要将问题转化为最小化最大损失，通过翻转符号即可实现。这说明了凸优化问题中目标函数和约束条件的转换关系。","讲者还提到，这种问题的结构和解法并不是显而易见的，特别是在涉及多个部门和复杂约束时。因此，凸优化方法在处理这类问题时具有重要的应用价值。","最后，讲者强调了凸优化方法在处理经济活动优化问题中的必要性，特别是在大规模和复杂系统中，手动计算是不可行的，必须依赖数学工具和算法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1531.87,"end":1706.93,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":12,"raw_segments":[{"start":1531.87,"text":"I don't know, you know, steel manufacturing went up 6%, it means that this number is 1.06."},{"start":1538.51,"text":"If it's 0.93, it means that it actually contracted 7%. Everybody got it? Okay, so here's what we want."},{"start":1547.25,"text":"We want to figure out what would be the right economic activity levels to maximize the minimum"},{"start":1555.23,"text":"growth in sectors across the economy that's that's this right okay okay here"},{"start":1564.09,"text":"are the constraints here's how X and X plus are constrained they're constrained"},{"start":1568.33,"text":"this way we have two matrices we have a number of goods that are consumed"},{"start":1576.67,"text":"that are consumed and also produced by economic activity. So one unit of economic activity in sector I might consume a bunch of things. Actually, it's going to have positive and negative sides. Because if it's consuming, it'll have all sorts of stuff that it's maybe consuming, but it's also producing stuff. Like manufacturing automobiles, it consumes steel."},{"start":1601.89,"text":"various other things, and, you know, that it produces cars, like just as an example. Okay, so what this says is, so AX, when you multiply the matrix A by the vector X, what you get is the vector of, you get what is produced this year."},{"start":1624.38,"text":"That's the set of goods that were produced this year. And the model here is very simple. If this is year, quarters, or months, it doesn't matter. The idea is that what's produced this year, we kind of imagine, is not immediately fed into, but it's almost as if, well, we do this in discrete time."},{"start":1641.3,"text":"So what's produced now is kind of held in escrow for a year. And then on January 1st, everything starts up again and you use those. So what this says is that's the vector of resources consumed by economic activity next year."},{"start":1655.03,"text":"And it says that is less than or equal to what you produced this year. And there's tons of variations on this, right? We could do all sorts of variations on this. We could have, for example, we could do this for 10 periods and have a running, you know, a stockpile of stuff, right? So, okay. Everybody, but this is the basic one. It makes sense? Okay. And this is just immediately a generalized linear fractional problem. A few things here. I'm maximizing a min."},{"start":1684.67,"text":"Whereas this thing should say minimize a maximum. But you just flip the sign and everything's cool. Everybody got it? And by the way, things like this, these are not obvious things. I guarantee you with 10 sectors, you could not figure this out by hand. I mean, it's just absolutely out of the question. So, I mean, but of course..."}],"speech_gaps":[],"frame":"../frames/v006/010.webp","frame_time":1543.87},{"title":"二次规划简介","segments":[{"id":104,"text":"We can solve a problem like that with 10,000 sectors. Like, with no problem at all. Like, you could, let me put it that way. Right? So, everybody got this? So, it's kind of cool. Okay. Next up, we're probably early 1950s, is the so-called quadratic program. This is like linear programming. This is actually a problem class that you need to know about. Just because...","start":1707.26,"end":1735.02},{"id":105,"text":"You know, it's a thing. People talk about it. I guarantee when you go various places, I don't care the field. Someone will say, how do you do that? And someone will say, it's a QP or something like that, right? So quadratic program is this. The constraints are still linear, just like an LP. So we have a polyhedron as your feasible set. But the objective is a convex quadratic.","start":1735.44,"end":1757.42},{"id":106,"text":"Okay, so that's the idea. And here, the only thing that changes is, here's your polyhedron, which is this thing, and the sublevel sets, remember in an LP, they're just, not sublevel sets, well, sublevel sets are half spaces. The level sets were hyperplanes. Now the level sets are actually the surfaces of ellipsoids. I mean, if P is positive definite. If it's not, then it's the surface of a, I don't know, whatever, I don't know what people call it, degenerate ellipsoid or something like that.","start":1758.4,"end":1785.58},{"id":107,"text":"Okay, so and this is the picture right you you want to go downhill here to the minimum and You know while staying in here and here you'll find out it's right here And actually you can see our optimality condition here that when you're optimal the the negative gradient which is pointing you towards You know towards the unconstrained minimum running roughly here is actually an outward normal of the feasible set, right?","start":1786.03,"end":1812.85},{"id":108,"text":"By the way, if that were not the case, I could wiggle X and do a little bit better. Right? Everybody got that? So this is a good picture. I mean, what this doesn't tell you is that, I mean, and the point here, you should have this picture in your mind for sure. But I guess the main point here is that we can solve QPs with 50, you can solve QPs with 50,000 variables and it's just, it's nothing. It's just nothing.","start":1813.41,"end":1838.06},{"id":109,"text":"It can be done so reliably that you can actually have this embedded in control systems and have this done 100 times a second with a failure rate of zero. Okay? Just, okay? So that's, yeah. So everyone see the, like the Falcon 9 first stages land? Right? That's running multiple QPs all the time. One is running at 1,000 times a second.","start":1838.65,"end":1866.36}],"notes":["本段讲解了二次规划（QP）的基本概念，指出其约束仍然是线性的，但目标函数是凸二次函数。与线性规划（LP）不同，QP的可行集是多面体，而目标函数的等值线是椭球面（当P为正定矩阵时）。这使得QP在优化问题中具有更复杂的结构。","讲者强调了QP的优化条件，即在最优解处，负梯度方向应与可行集的外法向量一致。这意味着在最优解处，梯度方向与可行集边界垂直，从而确保无法通过微小扰动来获得更好的解。","讲者还提到，QP问题可以处理非常大的规模，例如50,000个变量的问题，且计算效率极高，甚至可以嵌入到控制系统中，以每秒100次的频率可靠运行，失败率几乎为零。","讲者以Falcon 9火箭第一级着陆为例，说明QP在实际工程中的广泛应用，指出其在实时控制中的重要性，例如每秒运行1,000次的QP计算。","本段还强调了QP在优化问题中的重要性，指出它是一个需要掌握的问题类别，因为其在多个领域都有广泛应用，如控制、信号处理和机器学习。","讲者通过直观的几何解释，帮助学生理解QP的优化条件和可行性集的结构，从而加深对凸优化问题的理解。"],"formulas":[],"uncertainties":["the the negative gradient which is pointing you towards You know towards the unconstrained minimum running roughly here is actually an outward normal of the feasible set"],"diagram":"none","start":1707.26,"end":1866.36,"asr_flags":[],"math_clarifications":["P在上下文中未被明确定义为矩阵，且未被赋予具体数学表达式，因此无法确认其数学类型和符号使用是否正确。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1707.26,"text":"We can solve a problem like that with 10,000 sectors. Like, with no problem at all. Like, you could, let me put it that way. Right? So, everybody got this? So, it's kind of cool. Okay. Next up, we're probably early 1950s, is the so-called quadratic program. This is like linear programming. This is actually a problem class that you need to know about. Just because..."},{"start":1735.44,"text":"You know, it's a thing. People talk about it. I guarantee when you go various places, I don't care the field. Someone will say, how do you do that? And someone will say, it's a QP or something like that, right? So quadratic program is this. The constraints are still linear, just like an LP. So we have a polyhedron as your feasible set. But the objective is a convex quadratic."},{"start":1758.4,"text":"Okay, so that's the idea. And here, the only thing that changes is, here's your polyhedron, which is this thing, and the sublevel sets, remember in an LP, they're just, not sublevel sets, well, sublevel sets are half spaces. The level sets were hyperplanes. Now the level sets are actually the surfaces of ellipsoids. I mean, if P is positive definite. If it's not, then it's the surface of a, I don't know, whatever, I don't know what people call it, degenerate ellipsoid or something like that."},{"start":1786.03,"text":"Okay, so and this is the picture right you you want to go downhill here to the minimum and You know while staying in here and here you'll find out it's right here And actually you can see our optimality condition here that when you're optimal the the negative gradient which is pointing you towards You know towards the unconstrained minimum running roughly here is actually an outward normal of the feasible set, right?"},{"start":1813.41,"text":"By the way, if that were not the case, I could wiggle X and do a little bit better. Right? Everybody got that? So this is a good picture. I mean, what this doesn't tell you is that, I mean, and the point here, you should have this picture in your mind for sure. But I guess the main point here is that we can solve QPs with 50, you can solve QPs with 50,000 variables and it's just, it's nothing. It's just nothing."},{"start":1838.65,"text":"It can be done so reliably that you can actually have this embedded in control systems and have this done 100 times a second with a failure rate of zero. Okay? Just, okay? So that's, yeah. So everyone see the, like the Falcon 9 first stages land? Right? That's running multiple QPs all the time. One is running at 1,000 times a second."}],"speech_gaps":[],"frame":"../frames/v006/011.webp","frame_time":1719.26},{"title":"二次规划在金融中的应用","segments":[{"id":110,"text":"and it does not fail. So people use, I'd say, just QP alone is running probably, I would say more than half of all quantitative hedge funds just run QPs, period, period. So what that means is there are many trillions of dollars trading right now on...","zh":"而且它不会失败。因此，我认为人们使用，大概，仅仅使用二次规划（QP）来运行，我估计超过一半的量化对冲基金只是运行QP，就这么简单，就这么简单。这意味着目前有数万亿美元的资产正在通过……","start":1867.1,"end":1892.31},{"id":111,"text":"on just a QP that's being solved. So, okay. So I'm just saying it's not bad to know about. Okay. Let's look at some examples. Here's a really simple one. Without constraints, you would get things like just least squares, right? So, yeah, we know how to solve that. That's just linear algebra. But here's what's cool is you can add linear constraints now. So, I mean, and this is, I mean, you can add linear constraints. And actually the,","zh":"仅仅通过解决一个QP问题来进行交易。所以，好吧。我只是想说，了解这一点并不坏。好吧。让我们来看一些例子。这里有一个非常简单的例子。如果没有约束条件，你会得到像最小二乘法这样的结果，对吧？是的，我们知道如何解决这个问题。这仅仅是线性代数的问题。但真正有趣的是你现在可以添加线性约束条件。我是说，而且，我是说，你可以添加线性约束条件。实际上，","start":1892.76,"end":1922.9},{"id":112,"text":"You can add linear constraints, but the critical part of that is to say, if you add linear constraints, the problem is still entirely tractable. And I guarantee you there are fields where they do not know that.","zh":"你可以添加线性约束条件，但关键的部分在于说明，如果你添加线性约束条件，这个问题仍然是完全可处理的。我可以向你保证，在某些领域，他们并不知道这一点。","start":1923.57,"end":1936.68},{"id":113,"text":"Every year, I have people say like, oh yeah, we're fitting these parameters and we do these very complicated experiments or long computations. But some of the parameters have to be in ranges. Some of them have to be non-negative. And then they'll invent some unbelievably complicated, terrible method for iteratively doing stuff. And you're like, the right answer is, dude, that's a QP. Just solve it. Just be quiet. It's done kind of thing, right?","zh":"每年，我都会遇到一些人说，哦，是的，我们在拟合这些参数，并进行这些非常复杂的实验或长时间的计算。但其中一些参数必须处于特定范围内，一些参数必须是非负的。然后他们会发明一些令人难以置信的复杂、糟糕的方法来进行迭代处理。而你就会想，正确的答案是，伙计，这其实就是一个二次规划问题。直接解决它，安静点，事情就完成了，对吧？","start":1937.91,"end":1967.15},{"id":114,"text":"Every year, I have people say like, oh yeah, we're fitting these parameters and we do these very complicated experiments or long computations. But some of the parameters have to be in ranges. Some of them have to be non-negative. And then they'll invent some unbelievably complicated, terrible method for iteratively doing stuff. And you're like, the right answer is, dude, that's a QP. Just solve it. Just be quiet. It's done kind of thing, right?","zh":"每年，我都会遇到一些人说，哦，是的，我们在拟合这些参数，并进行这些非常复杂的实验或长时间的计算。但其中一些参数必须处于特定范围内，一些参数必须是非负的。然后他们会发明一些令人难以置信的复杂、糟糕的方法来进行迭代处理。而你就会想，正确的答案是，伙计，这其实就是一个二次规划问题。直接解决它，安静点，事情就完成了，对吧？","start":1968.13,"end":1994.3},{"id":115,"text":"So if a jet engine is running, then we'll just assume that, you know, if I pull it apart and go in there and like start measuring all my critical clearances, I'm not going to, after it runs another 10,000 hours of flight, I'm not going to find that it's in better shape than it was before. Right there. So that would be, so that's by the way, a whole field in statistics, I think it's called isotonic regression or something like that. There's whole books written on it.","zh":"所以，如果喷气发动机正在运行，那么我们就会假设，你知道的，如果我把它拆开并进入里面开始测量所有关键间隙，我不会在它再运行了10,000小时飞行之后发现它的状况比之前更好。就在那里。所以，顺便说一句，这其实是一个统计学的领域，我想它叫做等变回归（isotonic regression）或者类似的东西。关于这个主题已经写了很多书。","start":1994.72,"end":2020.06},{"id":116,"text":"Like, so it's, which I find kind of humorous, right? Because, because it's, because here's how we do it. It's so, I mean, for us, it's just really simple. It's like, excuse me, it's a QP. Like, that's what it is. So, and so what it means is you don't, you don't, you should not, and you do not need to talk about how to solve it.","zh":"比如，我觉得这有点好笑，对吧？因为，因为这就是我们如何处理它的方式。对我们来说，这真的很简单。它就是一个二次规划（QP）。这就是它的本质。因此，这意味着你不需要，你不要，你也不应该谈论如何解决它。","start":2020.46,"end":2038.84}],"notes":["本段主要讨论二次规划（QP）在金融领域的广泛应用，特别是量化对冲基金中超过一半使用QP进行交易。这表明QP在实际应用中具有高度的可操作性和实用性。","讲者指出，即使在添加线性约束的情况下，QP问题仍然是完全可解的，这在某些领域可能未被充分认识到。这强调了QP在处理约束优化问题时的高效性。","讲者通过一个例子说明，当需要确保变量非递减时，可以使用QP来建模，例如在飞机发动机磨损分析中，变量随时间非递减的特性可以通过QP来实现。","该例子还涉及统计学中的等变回归（isotonic regression），这表明QP不仅在工程和金融中应用广泛，也在统计学中具有重要地位。","讲者强调，对于QP问题，不需要复杂的求解方法，因为其本身就是一个标准的优化问题，可以通过现有的算法直接求解。","讲者以幽默的方式指出，某些领域的人可能因为不了解QP的简单性而采用复杂的求解方法，这反映了对QP理论理解的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1867.1,"end":2038.84,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1867.1,"text":"and it does not fail. So people use, I'd say, just QP alone is running probably, I would say more than half of all quantitative hedge funds just run QPs, period, period. So what that means is there are many trillions of dollars trading right now on..."},{"start":1892.76,"text":"on just a QP that's being solved. So, okay. So I'm just saying it's not bad to know about. Okay. Let's look at some examples. Here's a really simple one. Without constraints, you would get things like just least squares, right? So, yeah, we know how to solve that. That's just linear algebra. But here's what's cool is you can add linear constraints now. So, I mean, and this is, I mean, you can add linear constraints. And actually the,"},{"start":1923.57,"text":"You can add linear constraints, but the critical part of that is to say, if you add linear constraints, the problem is still entirely tractable. And I guarantee you there are fields where they do not know that."},{"start":1937.91,"text":"Every year, I have people say like, oh yeah, we're fitting these parameters and we do these very complicated experiments or long computations. But some of the parameters have to be in ranges. Some of them have to be non-negative. And then they'll invent some unbelievably complicated, terrible method for iteratively doing stuff. And you're like, the right answer is, dude, that's a QP. Just solve it. Just be quiet. It's done kind of thing, right?"},{"start":1968.13,"text":"Okay, so, yeah, I mean, and there's lots of interesting, I mean, even just this one, there's whole, so, oh, here's a fun one. To do least squares where I insist, I'm going to insist that the entries of x are non-decreasing. Everybody got that? So x1 is less than or equal to x2, is less than or equal to x3, and so on. That, by the way, would be a really good model of, like, wear and tear and damage in the system."},{"start":1994.72,"text":"So if a jet engine is running, then we'll just assume that, you know, if I pull it apart and go in there and like start measuring all my critical clearances, I'm not going to, after it runs another 10,000 hours of flight, I'm not going to find that it's in better shape than it was before. Right there. So that would be, so that's by the way, a whole field in statistics, I think it's called isotonic regression or something like that. There's whole books written on it."},{"start":2020.46,"text":"Like, so it's, which I find kind of humorous, right? Because, because it's, because here's how we do it. It's so, I mean, for us, it's just really simple. It's like, excuse me, it's a QP. Like, that's what it is. So, and so what it means is you don't, you don't, you should not, and you do not need to talk about how to solve it."}],"speech_gaps":[],"frame":"../frames/v006/012.webp","frame_time":1879.1},{"title":"鲁棒性与随机成本的线性规划","segments":[{"id":117,"text":"I mean, you can't have an intelligent conversation about it if you want to do it at super big scale, if you want to do it and embed it in some safety-critical thing so that its failure rate has to be zero, right? Then we can have a sensible conversation. But other than that, it's silly. That's for you. Starting next week, it's, I believe, one line of Python. Two. Fine. Two. Right? So it's nothing. Okay. Everybody got this?","zh":"我的意思是，如果你想在超大规模上进行操作，并且想将它嵌入到一些安全关键的系统中，使得其故障率必须为零，那么你无法进行智能的讨论，对吧？在这种情况下，我们才能进行有意义的讨论。除此之外，这都是愚蠢的。这是你们的任务。从下周开始，我相信只需要一行Python代码。两行。好吧。两行。对吧？所以这根本不值一提。好的。大家明白了吗？","start":2039.46,"end":2066.68},{"id":118,"text":"So these are useful things right here. So here's one. Let's do linear program with random cost. And it's actually kind of interesting. So that's a huge area. It's called robustness, right? And what it says is it acknowledges the fact. So here's a, okay, let's step back and I'll give you the big picture on robustness. When people use optimization,","zh":"所以这些是非常有用的东西。这里有一个例子。让我们做一个具有随机成本的线性规划问题。实际上这相当有趣。这是一个巨大的领域，它被称为鲁棒性，对吧？它承认了一个事实。所以这里有一个，让我们后退一步，我会给你们一个关于鲁棒性的大图景。当人们使用优化方法时，","start":2067.18,"end":2093.8},{"id":119,"text":"They, you know, you're assuming like your constraints and your objective and all that, they're sort of like quote accurate to like eight significant figures. That's kind of what you're doing. And you're modeling everything by floats and things like that, right? So it's not, you know, it shouldn't take much if you've done anything in engineering or anything actually in any kind of real field. You would know that, of course, they don't know the coefficients.","zh":"他们，你知道的，假设你的约束条件和目标函数以及所有这些内容，都是像有八位有效数字那样准确。这就是你在做的事情。你用浮点数和其他东西来建模一切，对吧？所以这并不像你在工程领域或任何实际领域做任何事情时那样，应该不会需要太多精确度。当然，你也会知道，他们并不知道这些系数。","start":2095.46,"end":2120.72},{"id":120,"text":"Like in our diet problem, every number, like the costs, it's because you ask somebody or you check some market or something, but maybe the costs have changed in the last two days. You know what I'm saying, right? If I have a model of a mechanical system, maybe I'm manufacturing it really well, but you don't know the third digit of the Young's modulus. That's ridiculous. It's absurd, in fact, right? In finance, I guess my friends say about their models.","zh":"比如在我们的饮食问题中，每一个数字，比如成本，是因为你询问某人或检查某个市场，但也许成本在过去的两天里已经发生了变化。你知道我的意思，对吧？如果我有一个机械系统的模型，也许我制造得非常好，但你并不知道杨氏模量的第三位数字。这很荒谬。事实上，这很荒唐，对吧？在金融领域，我想我的朋友们会说他们的模型。","start":2121.53,"end":2150.35},{"id":121,"text":"They said, we're happy if we get the sign right, right? Strongly suggesting that, I mean, everyone knows that their digit is like just a complete joke, right? The second digit is actually kind of a joke too, right? So they're worried about the leading sign, right? So, okay. Anyway, so there's lots of ways that people handle this. We're going to come back and talk about this in great detail later. It's actually the entirety of like regularization. It comes up in statistics and model fitting there. It comes up everywhere, right?","zh":"他们说，只要符号正确，我们就满足了，对吧？这强烈暗示着，我的意思是，大家都知道他们的数字就像一个完全的笑话，对吧？第二个数字其实也有些像笑话，对吧？所以他们担心的是前面的符号，对吧？所以，好吧。总之，人们处理这个问题有很多方法。我们稍后会详细讨论这个问题。实际上，这正是正则化的核心内容。它在统计学和模型拟合中出现。它在各个地方都会出现，对吧？","start":2150.91,"end":2178.71},{"id":122,"text":"Okay, so this will be our first foray into it. So what we're going to do is we're just going to say that the cost is random. So the way this problem is going to go like this, it says when you choose an x, we don't even speak to you if x is not feasible. So it has to sound like x equals bgx less than h. So let's say I construct a diet, right? And then the problem is now the cost. I'd say, how much is it going to cost me? And they're like, I don't know. It's a random variable.","zh":"好的，所以这将是我们的第一次探索。我们将做的是，假设成本是随机的。这个问题的处理方式如下，当你选择一个x时，我们甚至不会告诉你x是否可行。所以它必须满足x等于bgx小于h。让我们说，我构造了一个饮食计划，对吧？现在的问题变成了成本。我会说，这会花费我多少钱？而他们则说，我不知道。这是一个随机变量。","start":2179.78,"end":2208.52}],"notes":["本段讨论了鲁棒性在优化问题中的重要性，特别是在实际应用中，模型参数往往存在不确定性。讲者指出，人们通常假设约束和目标函数的精度很高，但实际上这些参数可能并不准确，甚至存在较大的误差。例如，在饮食问题中，成本可能在短时间内发生变化，而在机械系统中，材料属性如杨氏模量的精度也可能有限。"],"formulas":[],"uncertainties":["bgx less than h"],"diagram":"none","start":2039.46,"end":2208.52,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2039.46,"text":"I mean, you can't have an intelligent conversation about it if you want to do it at super big scale, if you want to do it and embed it in some safety-critical thing so that its failure rate has to be zero, right? Then we can have a sensible conversation. But other than that, it's silly. That's for you. Starting next week, it's, I believe, one line of Python. Two. Fine. Two. Right? So it's nothing. Okay. Everybody got this?"},{"start":2067.18,"text":"So these are useful things right here. So here's one. Let's do linear program with random cost. And it's actually kind of interesting. So that's a huge area. It's called robustness, right? And what it says is it acknowledges the fact. So here's a, okay, let's step back and I'll give you the big picture on robustness. When people use optimization,"},{"start":2095.46,"text":"They, you know, you're assuming like your constraints and your objective and all that, they're sort of like quote accurate to like eight significant figures. That's kind of what you're doing. And you're modeling everything by floats and things like that, right? So it's not, you know, it shouldn't take much if you've done anything in engineering or anything actually in any kind of real field. You would know that, of course, they don't know the coefficients."},{"start":2121.53,"text":"Like in our diet problem, every number, like the costs, it's because you ask somebody or you check some market or something, but maybe the costs have changed in the last two days. You know what I'm saying, right? If I have a model of a mechanical system, maybe I'm manufacturing it really well, but you don't know the third digit of the Young's modulus. That's ridiculous. It's absurd, in fact, right? In finance, I guess my friends say about their models."},{"start":2150.91,"text":"They said, we're happy if we get the sign right, right? Strongly suggesting that, I mean, everyone knows that their digit is like just a complete joke, right? The second digit is actually kind of a joke too, right? So they're worried about the leading sign, right? So, okay. Anyway, so there's lots of ways that people handle this. We're going to come back and talk about this in great detail later. It's actually the entirety of like regularization. It comes up in statistics and model fitting there. It comes up everywhere, right?"},{"start":2179.78,"text":"Okay, so this will be our first foray into it. So what we're going to do is we're just going to say that the cost is random. So the way this problem is going to go like this, it says when you choose an x, we don't even speak to you if x is not feasible. So it has to sound like x equals bgx less than h. So let's say I construct a diet, right? And then the problem is now the cost. I'd say, how much is it going to cost me? And they're like, I don't know. It's a random variable."}],"speech_gaps":[],"frame":"../frames/v006/013.webp","frame_time":2051.46},{"title":"风险调整成本与凸二次规划","segments":[{"id":123,"text":"You go, oh, okay. And so, you know, you could do things like just minimize the mean on average. I mean, and if you're going to do this every 10 seconds for like the next year, you know, the argument would be everything would average out and that'd be cool. But you might also care about the, for example, the variance. And by the way, this can get way fancier and we'll do that later. So here, this is a very traditional thing is this is, that's the cost. That's the mean cost.","zh":"你去吧，哦，好的。所以，你知道，你可以做一些事情，比如仅仅在平均意义上最小化均值。我的意思是，如果你每隔10秒就做一次，比如接下来的一年，论点就是一切都会平均出来，这样就很好。但你可能也会关心，比如方差。顺便说一下，这可以变得非常复杂，我们之后会这么做。所以在这里，这是一个非常传统的事情，这就是成本。这就是均值成本。","start":2209.45,"end":2233.85},{"id":124,"text":"And then gamma is a positive number. That's called the risk aversion parameter. Sigma is the covariance of C. And so this is the variance of the cost induced by your choice of X. So that's the idea. And then this people would call the risk-adjusted cost. That's what that would be called.","zh":"然后 gamma 是一个正数。这被称为风险规避参数。sigma 是 C 的协方差。因此，这是由你选择的 X 所诱导的成本的方差。这就是这个想法。然后人们会称这个为风险调整成本。这就是它被称作的东西。","start":2234.58,"end":2258.35},{"id":125,"text":"right like say and you'd probably quote it and i mean it's probably honestly you'd probably take this square a more sensible thing would be to take a square root here but this is fine right because then they're on the same units right but anyway so that's what this is it's called risk adjusted cost um oh and you","zh":"对，比如说，你会引用它，我的意思是，老实说，你可能会采取平方，更合理的事情是在这里采取平方根，但这样也没关系，因为这样它们的单位就一致了，不管怎样，这就是这个东西，它被称为风险调整成本，嗯，还有你","start":2258.93,"end":2275.33},{"id":126,"text":"In principle, okay, so anyway, when you do this, that's a QP, right? Because that's a convex quadratic function. Oh, provided gamma is positive, right? If gamma is negative, that's interesting. In fact, if someone's doing, if you want to minimize a risk-adjusted cost with a gamma negative, that's called risk-seeking. And, okay.","zh":"原则上，好的，所以不管怎样，当你这样做时，这就是一个二次规划问题，对吧？因为这是一个凸二次函数。哦，前提是 gamma 是正数，对吧？如果 gamma 是负数，那就很有趣了。事实上，如果有人在做，如果你想最小化一个风险调整成本，而 gamma 是负数，这就被称为风险寻求。好的。","start":2275.87,"end":2298.59},{"id":127,"text":"but just a couple of things about solving about that problem a it's a really stupid thing to do because you're saying like i mean unless it's like some thrill secret you can imagine something where you're like yeah i'd like the same mean but i'd like the variance to be way bigger it just doesn't make it so number one it's a stupid thing to do number two let's talk about the computational complexity if someone says no no no no no you don't understand","zh":"但关于解决这个问题的一些事情，它是一个非常愚蠢的事情，因为你是在说，我的意思是，除非它是某种刺激的秘密，你可以想象一个情况，你想要同样的均值，但你想要方差大得多，这并不合理，第一点，这样做是愚蠢的，第二点，让我们谈谈计算复杂度，如果有人说，不，不，不，不，不，你不懂","start":2299.21,"end":2323.37},{"id":128,"text":"i really i'm designing i'm doing some entertainment thing it has to it has to be there has to be some thrills in there so i want gamma to be minus 0.1 um is that a qp no it's not because this becomes no longer it's no longer convex right so anyway so this actually occurs a lot","zh":"我真的很在设计，我在做一些娱乐的事情，它必须存在，必须有一些刺激在里面，所以我想要 gamma 是 -0.1，嗯，这是否是一个二次规划问题？不，它不是，因为这不再是一个凸问题，对吧？所以不管怎样，这实际上经常发生。","start":2323.93,"end":2346.14},{"id":129,"text":"where you have something where there's a box with the things that, these are the problems that are easy to solve, these are the problems that are hard to solve, these are the problems that are sensible to solve, and these are the problems that are really stupid to solve. And it doesn't split up 25, 25, 25, 25 all the time. I mean, it's actually quite, it's very usual that the problem you should be solving is actually the one that's solvable. And then the other problem,","zh":"其中你有一个盒子，里面装着一些东西，这些是容易解决的问题，这些是难以解决的问题，这些是合理的问题，而这些则是非常愚蠢的问题。它并不是总是将问题分成25%、25%、25%、25%。我的意思是，实际上非常常见的是，你应该解决的问题实际上是可以解决的。然后是另一个问题，","start":2346.74,"end":2374.16}],"notes":["本段讨论了风险调整成本的概念，即在优化问题中同时考虑均值和方差。讲者指出，风险调整成本通常通过引入风险厌恶参数γ来调整成本函数，使得优化目标不仅关注平均成本，还考虑了成本的方差。这种调整可以使得决策更加稳健，但需要γ为正数，否则会导致风险寻求行为，即追求更高的方差。","讲者提到，虽然风险调整成本是一个传统的方法，但其形式可以更加复杂，例如通过引入平方根来调整单位一致性。然而，这种调整并不总是必要的，因为均值和方差本身可能具有相同的单位。此外，当γ为负数时，问题会变得非凸，从而难以求解。","讲者进一步指出，追求高方差的决策通常是不合理的，因为这会增加不确定性，导致决策变得不可靠。同时，从计算复杂性的角度来看，非凸问题通常比凸问题更难求解，因此需要谨慎处理。","在实际应用中，讲者强调了问题的可解性与合理性之间的关系。通常，应该解决的问题是那些可以被有效求解的问题，而那些难以求解的问题往往并不合理。因此，在设计优化问题时，需要权衡问题的复杂性和实际意义。","讲者还提到，风险调整成本的应用场景可能包括娱乐或刺激性设计，例如在某些系统中需要引入一定的不确定性以增加趣味性。然而，这种设计需要仔细考虑γ的取值，以确保问题的可解性和合理性。","最后，讲者指出，风险调整成本的优化问题通常属于凸二次规划（QP）问题，但当γ为负数时，问题会变得非凸，从而失去凸优化的优势。因此，在实际应用中，需要确保γ为正数以保持问题的可解性和稳定性。"],"formulas":[{"latex":"E[C] = \\text{mean of the cost}","symbols":"期望值（均值）","explanation":"公式正确，表示成本的期望值（均值）。","evidence":"And then gamma is a positive number. That's ca ecause then they're on the same units right but anyway so that's what this is it's called risk adjusted cost um oh and you"},{"start":2275.87,"text":"In principle, okay, so anyway, when you do this, that's a QP, right? Because that's a convex quadratic function. Oh, provided gamma is positive, right? If gamma is negative, that's interesting. In fact, if someone's doing, if you want to minimize a risk-adjusted cost with a gamma negative, that's called risk-seeking. And, okay."},{"start":2299.21,"text":"but just a couple of things about solving about that problem a it's a really stupid thing to do because you're saying like i mean unless it's like some thrill secret you can imagine something where you're like yeah i'd like the same mean but i'd like the variance to be way bigger it just doesn't make it so number one it's a stupid thing to do number two let's talk about the computational complexity if someone says no no no no no you don't understand"},{"start":2323.93,"text":"i really i'm designing i'm doing some entertainment thing it has to it has to be there has to be some thrills in there so i want gamma to be minus 0.1 um is that a qp no it's not because this becomes no longer it's no longer convex right so anyway so this actually occurs a lot"},{"start":2346.74,"text":"where you have something where there's a box with the things that, these are the problems that are easy to solve, these are the problems that are hard to solve, these are the problems that are sensible to solve, and these are the problems that are really stupid to solve. And it doesn't split up 25, 25, 25, 25 all the time. I mean, it's actually quite, it's very usual that the problem you should be solving is actually the one that's solvable. And then the other problem,"}],"speech_gaps":[],"frame":"../frames/v006/014.webp","frame_time":2221.45},{"title":"二次锥规划与凸优化的扩展","segments":[{"id":130,"text":"The other types of problems are ones that, A, you should not be solving, and B, that's just fine because you can't do it anyway. So anyway, it's just weird, and that's just how it works out. Okay. Oh, this leads us to another one. Yeah, you don't hear so much about this anymore, but you still do, is QCQP. And so this is where, wow, you know, instead of having linear inequalities, you now have...","zh":"其他类型的问题是那些你本不应该去解决的问题，或者即使你想要解决，你也无法做到的问题。总之，这很奇怪，事情就是这样。好的。哦，这又引出了另一个问题。是的，你现在已经不太常听到这个了，但你仍然会遇到，那就是二次锥规划（QCQP）。这就是说，与其有线性不等式，你现在有……","start":2374.87,"end":2399.31},{"id":131,"text":"convex quadratic, okay? So this is, that's a so-called QCQP. And you'll still hear some people talk about that. Okay, now we get to something that's kind of modern, meaning it's from the last 25 years, okay? And it looks just like QCQP or something like that, but it's not. And it's also like an incredible, it's an innocent-looking problem. It's truly unbelievable what problems can be reduced to this.","zh":"凸二次约束，对吧？所以这就是所谓的QCQP。你仍然会听到一些人谈论这个问题。好的，现在我们进入一个比较现代的内容，意思是它来自过去的25年，对吧？看起来就像QCQP或类似的东西，但它不是。而且它看起来也非常简单，是一个看似无害的问题。真正令人难以置信的是，有多少问题可以被归约到这种形式。","start":2399.52,"end":2428.51},{"id":132,"text":"Okay, so let's take a look at it. It's, you minimize a linear function. That's cool. That's like linear programming. You have linear equality constraints. And then you have a bunch of constraints that, by the way, if this was just, if I made A and B zero, this would be zero. This would be a general LP. So what that says is whatever second order cone programming is, it generalizes LP for sure. Because any LP I can solve with SOCP, right?","zh":"好的，让我们来看看它。你最小化一个线性函数。这很酷。这就像线性规划。你有线性等式约束。然后你有一系列约束，顺便说一句，如果我把A和B设为零，那么这就会变成零。这就会变成一个一般的线性规划。这说明无论二次锥规划是什么，它肯定推广了线性规划。因为任何线性规划问题我都可以用二次锥规划来解决，对吧？","start":2428.99,"end":2455.6},{"id":133,"text":"and it just looks like this and so it's a it's a two norm by the way this is two norm and it is not two norm squared right so that's one of the things you have to fight um that because of our collective training and and hundreds of years of math before us whenever you see a two norm you square it","zh":"而且它看起来就是这样，顺便说一句，这是二范数。对的，这不是二范数的平方。这就是你必须与之斗争的一点，因为我们的集体训练以及我们之前数百年的数学知识，每当看到二范数时，你就会把它平方。","start":2456.06,"end":2477.23},{"id":134,"text":"Right? We all know this, right? Everybody does that. And there might be some good reasons, right? Like now you get this analytical solution. I don't know. Now it's differentiable. I don't know. But mostly it's because it's historical. That's really why it is. Why we square it. So anyway, very important point. This is not squared. Okay? Okay.","zh":"对吧？我们都知道这一点，对吧？每个人都这么做。可能有一些很好的理由，对吧？比如，你现在得到了一个解析解。我不知道。现在它是可微的。我不知道。但主要原因是历史原因。这才是为什么我们要平方它。总之，这是一个非常重要的点。这不是平方的，对吧？","start":2478.25,"end":2507.08},{"id":135,"text":"says that the image under an affine mapping is in the second order cone. That's what it says, right? Because second order cone is all things of the form, you know, two norm of U is less than V. U is a vector, V is a scalar. And that's exactly what this is. This says the two norm of that is less than that. And that's exactly what this is, right? So that's it. And this includes like QCQP, LP. Actually, weird secret.","zh":"说明了在仿射映射下的像属于二阶锥。这就是它所说的，对吧？因为二阶锥是所有形如，你知道的，U的二范数小于V的集合。U是一个向量，V是一个标量。而这正是这个例子所描述的。这里说的是那个向量的二范数小于那个标量。而这正是这个例子所描述的，对吧？所以就是这样。这包括像二次约束二次规划（QCQP）和线性规划（LP）。实际上，这是一个奇怪的秘密。","start":2507.75,"end":2535.83}],"notes":["本段讨论了二次锥规划（SOCP）与线性规划（LP）之间的关系，指出SOCP是LP的扩展。讲者强调了SOCP中约束条件的形式，即向量的二范数小于等于一个标量，这与QCQP和LP的约束形式不同。","讲者指出，尽管在数学中通常将二范数平方，但在SOCP中，约束条件是直接使用二范数而非其平方。这与传统习惯不同，需要特别注意。","讲者提到，这种做法的历史原因主要是因为传统习惯，而非数学上的必然性。虽然平方形式可能带来解析解或可微性等优势，但SOCP中使用的是原始的二范数形式。","讲者强调了SOCP的约束条件与二阶锥的定义一致，即向量的二范数小于等于一个标量，这使得SOCP能够涵盖QCQP和LP等更简单的优化问题。","讲者指出，SOCP的约束形式是通过仿射映射将变量映射到二阶锥中，这使得SOCP能够处理更广泛的优化问题。","讲者提到，SOCP的约束形式虽然看起来简单，但其应用范围广泛，能够涵盖许多实际问题，包括QCQP和LP等。"],"formulas":[],"uncertainties":["it's a it's a two norm by the way this is two norm and it is not two norm squared right so that's one of the things you have to fight um that because of our collective training and and hundreds of years of
