 math before us whenever you see a two norm you square it"],"diagram":"none","start":2374.87,"end":2535.83,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2374.87,"text":"The other types of problems are ones that, A, you should not be solving, and B, that's just fine because you can't do it anyway. So anyway, it's just weird, and that's just how it works out. Okay. Oh, this leads us to another one. Yeah, you don't hear so much about this anymore, but you still do, is QCQP. And so this is where, wow, you know, instead of having linear inequalities, you now have..."},{"start":2399.52,"text":"convex quadratic, okay? So this is, that's a so-called QCQP. And you'll still hear some people talk about that. Okay, now we get to something that's kind of modern, meaning it's from the last 25 years, okay? And it looks just like QCQP or something like that, but it's not. And it's also like an incredible, it's an innocent-looking problem. It's truly unbelievable what problems can be reduced to this."},{"start":2428.99,"text":"Okay, so let's take a look at it. It's, you minimize a linear function. That's cool. That's like linear programming. You have linear equality constraints. And then you have a bunch of constraints that, by the way, if this was just, if I made A and B zero, this would be zero. This would be a general LP. So what that says is whatever second order cone programming is, it generalizes LP for sure. Because any LP I can solve with SOCP, right?"},{"start":2456.06,"text":"and it just looks like this and so it's a it's a two norm by the way this is two norm and it is not two norm squared right so that's one of the things you have to fight um that because of our collective training and and hundreds of years of math before us whenever you see a two norm you square it"},{"start":2478.25,"text":"Right? We all know this, right? Everybody does that. And there might be some good reasons, right? Like now you get this analytical solution. I don't know. Now it's differentiable. I don't know. But mostly it's because it's historical. That's really why it is. Why we square it. So anyway, very important point. This is not squared. Okay? Okay. So that's the second order cone program. And why? Because basically this constraint here"},{"start":2507.75,"text":"says that the image under an affine mapping is in the second order cone. That's what it says, right? Because second order cone is all things of the form, you know, two norm of U is less than V. U is a vector, V is a scalar. And that's exactly what this is. This says the two norm of that is less than that. And that's exactly what this is, right? So that's it. And this includes like QCQP, LP. Actually, weird secret."}],"speech_gaps":[],"frame":"../frames/v006/015.webp","frame_time":2386.87},{"title":"凸优化中的鲁棒线性规划","segments":[{"id":136,"text":"It actually includes probably 95% of any problem you would ever want to solve from 100 different fields. So you will start using CVXPy. You will write down weird functions like quadratic over lin and all sorts of other crazy stuff, really complicated geometric means, all sorts of weird stuff. They will be reduced to an SOCP and solved.","zh":"它实际上包含了你从100个不同领域中想要解决的任何问题的约95%。因此，你们将开始使用CVXPy。你们将写出像二次函数除以线性函数这样的奇怪函数，以及各种其他疯狂的东西，真正复杂的几何平均数，各种奇怪的东西。它们将被归约为一个SOCP并求解。","start":2536.41,"end":2561.11},{"id":137,"text":"Okay, so this is kind of the, yeah, this is the idea. And this is, you know, like I said, this is kind of relatively new. It's also, I think, for a broad group of problems.","zh":"嗯，这就是这个想法，对吧。而且，正如我所说，这在某种程度上是相对较新的。它也是，我认为，适用于广泛的问题组。","start":2562.19,"end":2574.81},{"id":138,"text":"It's almost like this is kind of the low-level language. This is like the three-byte code of convex optimization, roughly, for a reasonable fraction of it, right? What it is is you write a problem in a high-level form, it gets compiled into a second-order cone program, and then it gets solved. And what's nice about that arrangement is it means that people all over the world right now are working on solvers for second-order cone programs. Why? Because...","zh":"这几乎就像是低级语言。这像是凸优化的三字代码，大致上适用于其中相当大的一部分。它的运作方式是，你们以高级形式写出问题，它被编译成一个二次锥规划，然后被求解。这种安排的好处是，目前世界各地的人们都在为二次锥规划开发求解器。为什么？因为……","start":2575.51,"end":2603.93},{"id":139,"text":"A much larger group of people is actually solving problems that they don't even know can be reduced to second-order cone programs. So it all works out very well. Let's do an example. We'll do robust linear programming. And here's the way it's going to work. So this time, before we said the objective is uncertain. Now we're going to make the inequalities uncertain.","zh":"实际上，一个更大规模的人群正在解决他们甚至不知道可以归约为二次锥规划的问题。因此，一切运作得非常好。让我们举一个例子。我们将做鲁棒线性规划。这里就是它的工作方式。这次，之前我们说目标是不确定的。现在我们将让不等式变得不确定。","start":2604.42,"end":2632.51},{"id":140,"text":"Um, and what we're going to do is, uh, we will, we'll look at what happens. We're going to look at just what happens when AI is uncertain. Right. So, and you know, look at our diet problem that says, oh, how much, you know, how much, how many nutrients do you get, uh, per gram of this food stuff? Right.","zh":"嗯，我们将做的是，嗯，我们将看看会发生什么。我们将看看当人工智能不确定时会发生什么。对吧。因此，你们知道，看看我们的饮食问题，它说，哦，有多少，你知道的，每克这种食物中你能获得多少营养？对吧。","start":2634.08,"end":2655.18},{"id":141,"text":"Like, you know, we yanked a cup. Actually, you know, in June they're slightly different, you know, and whatever. And by the way, Friday's batch is different from Thursday's. I mean, not grossly, but it could easily be considerable, right? So anyway, so you do that. By the way, then you fit an ellipsoid to those. And then what you're doing is you're saying, please construct me a diet that satisfies, you know, these minimum, like, health requirements.","zh":"比如，你知道的，我们拿了一杯。实际上，你知道的，在六月它们略有不同，你知道的，不管怎样。顺便说一句，周五的一批和周四的不同。我的意思是，不是非常严重，但很容易有相当大的差异，对吧。总之，你们这么做。顺便说一句，然后你们将这些拟合成一个椭球体。然后你们所做的就是，请求构造一个饮食方案，满足这些最低的健康要求。","start":2655.74,"end":2680.96},{"id":142,"text":"And you'd say, oh, but I want this diet. That should work no matter what gets delivered to us with different amounts of nutrients per foodstuff. Everybody following this? That's the robust solution to that, right? So, okay, so that looks like this. Okay.","zh":"你会说，哦，但是我想吃这个饮食。不管食物中营养成分的含量如何变化，这都应该有效。大家明白了吗？这就是对这个问题的鲁棒解，对吧？所以，好的，那看起来是这样的。好的。","start":2681.71,"end":2698.54}],"notes":["本段讲解了鲁棒线性规划的概念，即在不完全确定的情况下，如何构造一个满足最低健康要求的饮食方案。讲者通过饮食问题作为例子，说明了在营养成分不确定时，如何通过构建鲁棒解来应对不同批次食品的营养差异。","讲者提到，当营养成分存在不确定性时，可以通过拟合椭球体来构建鲁棒解，确保无论实际交付的营养成分如何，所选的饮食方案都能满足最低健康要求。","讲者强调，鲁棒解的关键在于确保解决方案在所有可能的不确定性情况下都有效，而不是仅在平均或典型情况下有效。","通过饮食问题的例子，讲者展示了鲁棒优化的实际应用场景，即在面对不确定性和变化时，如何通过数学建模和优化方法找到稳健的解决方案。","讲者指出，鲁棒优化的挑战在于如何将不确定性建模为数学约束，并将其转化为可解的优化问题，例如通过椭球体约束。","最后，讲者提到鲁棒解的构建过程，即通过拟合椭球体并确保所选方案在所有可能的营养成分变化下都有效，从而实现鲁棒性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2536.41,"end":2698.54,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2536.41,"text":"It actually includes probably 95% of any problem you would ever want to solve from 100 different fields. So you will start using CVXPy. You will write down weird functions like quadratic over lin and all sorts of other crazy stuff, really complicated geometric means, all sorts of weird stuff. They will be reduced to an SOCP and solved."},{"start":2562.19,"text":"Okay, so this is kind of the, yeah, this is the idea. And this is, you know, like I said, this is kind of relatively new. It's also, I think, for a broad group of problems."},{"start":2575.51,"text":"It's almost like this is kind of the low-level language. This is like the three-byte code of convex optimization, roughly, for a reasonable fraction of it, right? What it is is you write a problem in a high-level form, it gets compiled into a second-order cone program, and then it gets solved. And what's nice about that arrangement is it means that people all over the world right now are working on solvers for second-order cone programs. Why? Because..."},{"start":2604.42,"text":"A much larger group of people is actually solving problems that they don't even know can be reduced to second-order cone programs. So it all works out very well. Let's do an example. We'll do robust linear programming. And here's the way it's going to work. So this time, before we said the objective is uncertain. Now we're going to make the inequalities uncertain."},{"start":2634.08,"text":"Um, and what we're going to do is, uh, we will, we'll look at what happens. We're going to look at just what happens when AI is uncertain. Right. So, and you know, look at our diet problem that says, oh, how much, you know, how much, how many nutrients do you get, uh, per gram of this food stuff? Right. And the answer is, I don't know, depends on the shipment."},{"start":2655.74,"text":"Like, you know, we yanked a cup. Actually, you know, in June they're slightly different, you know, and whatever. And by the way, Friday's batch is different from Thursday's. I mean, not grossly, but it could easily be considerable, right? So anyway, so you do that. By the way, then you fit an ellipsoid to those. And then what you're doing is you're saying, please construct me a diet that satisfies, you know, these minimum, like, health requirements."},{"start":2681.71,"text":"And you'd say, oh, but I want this diet. That should work no matter what gets delivered to us with different amounts of nutrients per foodstuff. Everybody following this? That's the robust solution to that, right? So, okay, so that looks like this. Okay."}],"speech_gaps":[],"frame":"../frames/v006/016.webp","frame_time":2548.41},{"title":"概率约束与确定性模型","segments":[{"id":143,"text":"And another one is the stochastic model. In the stochastic model, you'd say, oh, yeah, you know what? The AIs are random. They're Gaussian or whatever. They have some distribution. And you'd say, yeah, I want the probability that the constraint holds to be greater than some number. You know, typical numbers of eta would be 0.9. That's pretty loose. 0.95, 0.99. It could be 0.99999 or something like that.","zh":"另一个是随机模型。在随机模型中，你会说，哦，对了，你知道吗？人工智能是随机的。它们可能是高斯分布或者其他什么分布。它们具有某种分布。然后你会说，是的，我希望约束成立的概率大于某个数值。典型的eta值可能是0.9。这相当宽松。0.95、0.99。它甚至可能是0.99999之类的。","start":2699.93,"end":2727.45},{"id":144,"text":"And that's okay as long as you understand what you're doing when you solve that problem. Yeah, if someone said, yeah, no, no, no, we make sure it works, you know, for like, you know, that the probability is bigger than 99.9%. Of course, the question there is, there's no one in any field that I'm aware of who actually knows the distribution of something, the tail of their distribution that well. This is just, sorry, this is just a weird rant, but I'm just...","zh":"只要你在解决这个问题时理解自己在做什么，这就可以了。是的，如果有人会说，不，不，不，我们要确保它能工作，你知道的，比如，概率要大于99.9%。当然，问题在于，我所知道的任何领域中，没有人真正了解某个事物的分布，更不用说其尾部分布了。这只是一个奇怪的抱怨，但我就是……","start":2728.51,"end":2754.86},{"id":145,"text":"I'm doing it anyway. Like there's no such thing, right? If you go to anywhere and someone says, oh, you know, we want the probability to be more than 99.9%, it's hilarious to me, right? It's just ridiculous. Okay, so, okay. However, it's actually still a perfectly good problem to solve because when someone looks at your code and it says the probability should be bigger than 99.9%, you're like, wow.","zh":"我还是要这么做。像这样的东西根本不存在，对吧？如果你去任何地方，有人会说，哦，你知道的，我们希望概率大于99.9%，对我来说这很可笑，对吧？这完全是荒谬的。好的，那么，好的。然而，实际上，解决这个问题仍然是一个完全合理的问题，因为当有人查看你的代码并说概率应该大于99.9%时，你会想，哇。","start":2755.14,"end":2780.34},{"id":146,"text":"You must really have a good handle on the tails of that distribution. And then here's the correct answer. You go, yeah, no, we have terrible models of the tail distribution. And you go, but your probability... And you go, that just means, like, really? Please, I want this to hold. That's what it means. It doesn't mean anything more than that. So, okay. Everybody got that? Well, that was weird. That was a weird rant. Okay, so, fine.","zh":"你一定对那个分布的尾部有非常好的把握。然后这里就是正确的答案。你会说，不，我们对尾部分布的模型非常糟糕。然后你会说，但你的概率……然后你会说，这到底意味着什么？请，我想要这个成立。这就是它的意思。它并不意味着更多东西。所以，好的。大家明白了吗？好吧，那是一个奇怪的抱怨。那是一个奇怪的抱怨。好的，那么，好吧。","start":2781.06,"end":2804.68},{"id":147,"text":"Okay, so let's do the deterministic one. That's going to turn into an SOCP. How do you do that? Well, we write the ellipsoids as a center plus here a matrix, a linear mapping of the unit ball. So P tells me the ellipsoid, which axis is it big in and stuff like that. By the way, that's one of several representations of an ellipsoid. That's what we're going to use here. Okay, so we do this.","zh":"好的，那么我们来做确定性的情况。这将转化为一个SOCP。你是怎么做到的呢？我们把椭球表示为一个中心加上一个矩阵，一个单位球的线性映射。P告诉我椭球的形状，它在哪个轴上更大，等等。顺便说一句，这是几种椭球表示方法之一。这是我们在这里要使用的。好的，那么我们这样做。","start":2806.49,"end":2835.5},{"id":148,"text":"And here, if you want to know, we really have to work out what is the maximum of this expression over that ellipsoid, and then you would just end up with this, right? And now, again, we sit down. We actually, with Chebyshev's center, we encountered something with a two norm, but the argument of it was data, and therefore it was a constant, and it was just a red flag, and your yellow flashing light in your brain didn't matter.","zh":"在这里，如果你想了解，我们必须计算这个表达式在该椭球体上的最大值，然后你就会得到这个结果，对吧？现在，我们再次坐下。实际上，当我们遇到切比雪夫中心时，我们遇到了一个与二范数相关的问题，但它的参数是数据，因此它是一个常数，这只是一个红色警示灯，而你大脑中的黄色闪烁灯则无关紧要。","start":2836.82,"end":2863.6}],"notes":["本段讨论了概率约束模型，其中讲者指出在概率约束中，我们希望约束满足的概率大于某个阈值，如0.9、0.95、0.99等。然而，讲者强调，实际上很少有人能准确知道分布的尾部情况，因此这种模型可能并不实际。讲者认为，尽管如此，这种模型仍然是一个有效的优化问题，因为它可以引导我们对分布的尾部有更深入的理解。","讲者进一步指出，当有人声称概率必须大于99.9%时，这实际上意味着我们对分布的尾部有非常高的要求，但现实中很难满足。讲者认为，这种要求可能并不现实，但仍然可以作为一个有效的优化问题来处理，因为它可以促使我们更仔细地分析分布的尾部。","接下来，讲者转向确定性模型，指出这种模型会转化为一个二次约束规划（SOCP）问题。讲者解释了如何将椭球表示为一个中心加上一个线性映射的单位球，并指出这是椭球的几种表示方法之一。","讲者还提到，在确定性模型中，我们需要计算表达式在椭球上的最大值，这与Chebyshev中心的问题类似，但此时的参数是数据，因此是一个常数，这可能是一个警示信号，但并不一定需要特别处理。","讲者强调，虽然概率约束模型可能并不实际，但仍然是一个有效的优化问题，因为它可以引导我们对分布的尾部有更深入的理解。同时，确定性模型的处理方式则更加直接，可以通过将椭球表示为线性映射的单位球来实现。","最后，讲者指出，在确定性模型中，我们需要计算表达式在椭球上的最大值，这可能涉及到一些复杂的计算，但最终可以转化为一个标准的SOCP问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2699.93,"end":2863.6,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2699.93,"text":"And another one is the stochastic model. In the stochastic model, you'd say, oh, yeah, you know what? The AIs are random. They're Gaussian or whatever. They have some distribution. And you'd say, yeah, I want the probability that the constraint holds to be greater than some number. You know, typical numbers of eta would be 0.9. That's pretty loose. 0.95, 0.99. It could be 0.99999 or something like that."},{"start":2728.51,"text":"And that's okay as long as you understand what you're doing when you solve that problem. Yeah, if someone said, yeah, no, no, no, we make sure it works, you know, for like, you know, that the probability is bigger than 99.9%. Of course, the question there is, there's no one in any field that I'm aware of who actually knows the distribution of something, the tail of their distribution that well. This is just, sorry, this is just a weird rant, but I'm just..."},{"start":2755.14,"text":"I'm doing it anyway. Like there's no such thing, right? If you go to anywhere and someone says, oh, you know, we want the probability to be more than 99.9%, it's hilarious to me, right? It's just ridiculous. Okay, so, okay. However, it's actually still a perfectly good problem to solve because when someone looks at your code and it says the probability should be bigger than 99.9%, you're like, wow."},{"start":2781.06,"text":"You must really have a good handle on the tails of that distribution. And then here's the correct answer. You go, yeah, no, we have terrible models of the tail distribution. And you go, but your probability... And you go, that just means, like, really? Please, I want this to hold. That's what it means. It doesn't mean anything more than that. So, okay. Everybody got that? Well, that was weird. That was a weird rant. Okay, so, fine."},{"start":2806.49,"text":"Okay, so let's do the deterministic one. That's going to turn into an SOCP. How do you do that? Well, we write the ellipsoids as a center plus here a matrix, a linear mapping of the unit ball. So P tells me the ellipsoid, which axis is it big in and stuff like that. By the way, that's one of several representations of an ellipsoid. That's what we're going to use here. Okay, so we do this."},{"start":2836.82,"text":"And here, if you want to know, we really have to work out what is the maximum of this expression over that ellipsoid, and then you would just end up with this, right? And now, again, we sit down. We actually, with Chebyshev's center, we encountered something with a two norm, but the argument of it was data, and therefore it was a constant, and it was just a red flag, and your yellow flashing light in your brain didn't matter."}],"speech_gaps":[],"frame":"../frames/v006/017.webp","frame_time":2711.93},{"title":"鲁棒线性规划与概率模型的SOCP转换","segments":[{"id":149,"text":"Here, though, we have to be careful. So you look at the problem. That's linear. That's cool. And this objective is indeed a second order cone constraint. People say an SOC constraint here, right? Actually, it's super interesting, right? Like if you just said, you just said, you know what? I don't care about those uncertainty stuff. I don't believe it.","start":2864.47,"end":2885.97},{"id":150,"text":"Besides, this stuff is only off by plus minus 5%. I don't care. Then what you do is you just replace the A with AI bar, which is kind of the middle value, right? So you just do that. If you do that, you get this problem here. That's an LP. But then you'd say, yeah, but you know there's uncertainty, so I would like a little bit of margin in my...","start":2886.31,"end":2910.11},{"id":151,"text":"in my inequality just to cover me when A wiggles around, right? What's interesting is this tells you exactly how much margin to use, right? So what this says is wherever P is big, you should avoid having X in that direction. It makes sense. In fact, you could literally flag that number and call that the margin. And the cool part is it's a function of X. It's a function of your choice.","start":2910.58,"end":2939.78},{"id":152,"text":"Everybody got this? Okay, so that's an example. So a robust LP with ellipsoidal uncertainty is in fact an SOCP. Okay, we can also do the same thing with a statistical model and it works just fine.","start":2941.22,"end":2962.24},{"id":153,"text":"Weirdly, you also end up with an SOCP. So here I say, no, you know what? I don't know. I took enough statistics and stuff. So AI is Gaussian with a mean A bar. That's a vector and a covariance matrix, right? So that means that this linear function of it, that's also Gaussian.","start":2963.51,"end":2976.75},{"id":154,"text":"right? Because linear function of a Gaussian vector is Gaussian. And it's got a mean a bar transpose x, and it's got a variance x transpose sigma x. And that means, you know, the probability that, it means that this is just a, that's just a Gaussian, so a scalar Gaussian. The probability of scalar Gaussian is less than a number is equal to this, right? You, you know, you subtract the mean, and then you divide by the standard deviation, you get an n01 variable, and then you, then you look at the CDF. So that's, that's the CDF.","start":2977.16,"end":3006.2},{"id":155,"text":"of a of a gaussian okay everybody following this um yeah by the way it's not looking super good here because these are replaced with uh the the these now you do know some things about that for example that's a log concave function the gaussian cdf right so but doesn't sound like this is going to end up as a second order cone program right because you know it just doesn't sound quadratic or something like that so but it is and the reason","start":3006.47,"end":3035.75}],"notes":["本段讲解了如何将具有椭球不确定性鲁棒线性规划问题转换为二阶锥规划（SOCP）。讲者指出，当不确定性被建模为椭球时，可以通过将矩阵A替换为中间值A bar来构造一个线性规划问题，但为了应对A的不确定性，需要引入一个安全边际。这个安全边际的大小由P的大小决定，P较大时应避免X在该方向上，这实际上是一个函数，取决于X的选择。","接着，讲者转向概率模型，指出当A服从高斯分布时，其线性函数也服从高斯分布。高斯分布的均值为a bar transpose x，方差为x transpose sigma x。概率计算涉及将随机变量标准化为标准正态分布，然后使用累积分布函数（CDF）进行计算。","讲者提到，虽然高斯CDF看起来不像二次函数，但它实际上可以表示为二阶锥规划。这是因为高斯CDF是凹函数，而二阶锥规划可以处理此类问题。讲者强调，尽管表面上看起来不像是二次规划，但通过适当的转换，确实可以将其转化为SOCP。","讲者还指出，这种转换的关键在于理解高斯分布的性质，以及如何将概率约束转化为凸约束。这涉及到将概率不等式转换为关于均值和方差的约束，从而确保问题保持凸性。","最后，讲者提到，虽然这种转换可能看起来不直观，但通过数学推导可以证明其有效性。这展示了凸优化在处理不确定性问题中的强大能力，尤其是在概率模型和鲁棒优化之间建立联系。","整个段落强调了如何将不确定性建模为椭球或高斯分布，并通过凸优化技术将其转化为可解的SOCP问题。这为后续讨论更复杂的优化问题奠定了基础。"],"formulas":[],"uncertainties":["the the these now you do know some things about that for example that's a log concave function the gaussian cdf right so but doesn't sound like this is going to end up as a second order cone program right because you know it just doesn't sound quadratic or something like that so but it is and the reason"],"diagram":"none","start":2864.47,"end":3035.75,"asr_flags":[],"math_clarifications":["公式中未明确说明Ax的分布类型，且未提及标准差的计算方式。此外，CDF的输入应为标准化后的变量，但未明确说明标准化过程。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2864.47,"text":"Here, though, we have to be careful. So you look at the problem. That's linear. That's cool. And this objective is indeed a second order cone constraint. People say an SOC constraint here, right? Actually, it's super interesting, right? Like if you just said, you just said, you know what? I don't care about those uncertainty stuff. I don't believe it."},{"start":2886.31,"text":"Besides, this stuff is only off by plus minus 5%. I don't care. Then what you do is you just replace the A with AI bar, which is kind of the middle value, right? So you just do that. If you do that, you get this problem here. That's an LP. But then you'd say, yeah, but you know there's uncertainty, so I would like a little bit of margin in my..."},{"start":2910.58,"text":"in my inequality just to cover me when A wiggles around, right? What's interesting is this tells you exactly how much margin to use, right? So what this says is wherever P is big, you should avoid having X in that direction. It makes sense. In fact, you could literally flag that number and call that the margin. And the cool part is it's a function of X. It's a function of your choice."},{"start":2941.22,"text":"Everybody got this? Okay, so that's an example. So a robust LP with ellipsoidal uncertainty is in fact an SOCP. Okay, we can also do the same thing with a statistical model and it works just fine."},{"start":2963.51,"text":"Weirdly, you also end up with an SOCP. So here I say, no, you know what? I don't know. I took enough statistics and stuff. So AI is Gaussian with a mean A bar. That's a vector and a covariance matrix, right? So that means that this linear function of it, that's also Gaussian."},{"start":2977.16,"text":"right? Because linear function of a Gaussian vector is Gaussian. And it's got a mean a bar transpose x, and it's got a variance x transpose sigma x. And that means, you know, the probability that, it means that this is just a, that's just a Gaussian, so a scalar Gaussian. The probability of scalar Gaussian is less than a number is equal to this, right? You, you know, you subtract the mean, and then you divide by the standard deviation, you get an n01 variable, and then you, then you look at the CDF. So that's, that's the CDF."},{"start":3006.47,"text":"of a of a gaussian okay everybody following this um yeah by the way it's not looking super good here because these are replaced with uh the the these now you do know some things about that for example that's a log concave function the gaussian cdf right so but doesn't sound like this is going to end up as a second order cone program right because you know it just doesn't sound quadratic or something like that so but it is and the reason"}],"speech_gaps":[],"frame":"../frames/v006/018.webp","frame_time":2876.47},{"title":"概率约束与SOCP的转换","segments":[{"id":156,"text":"It's pretty straightforward. What we want to do is we want to say that this thing is bigger than or equal to eta, right? Eta is 0.95. There you go. But this phi is monotone, right? So this says this expression is bigger than phi inverse of eta. Everybody got that? Okay, now phi inverse of eta...","zh":"这很简单。我们想要说的是，这个量要大于或等于eta，对吧？eta是0.95。明白了。但这个phi是单调的，对吧？所以这说明这个表达式要大于等于phi的逆函数在eta处的值。大家明白了吗？好的，现在phi的逆函数在eta处的值...","start":3036.91,"end":3062.29},{"id":157,"text":"it's going to be positive, right? Because eta is like 0.85 and stuff. Oh, actually, if eta is less than 50%, if eta is less than 50%, phi inverse of eta is negative, right? If I have a standard Gaussian and I say, what's the inverse CDF of 0.3? I don't know what it is, but it's like minus a half or something, roughly. I just made that up, but still.","zh":"它会是正的，对吧？因为eta大概是0.85之类的。哦，实际上，如果eta小于50%，如果eta小于50%，那么phi的逆函数在eta处的值是负的，对吧？如果我有一个标准高斯分布，我说，0.3的逆累积分布函数是多少？我不知道具体数值，但大概是负的一半左右。我只是随便说的，但依然如此。","start":3062.71,"end":3091.09},{"id":158,"text":"probability that the constraints hold is more than 50%, then you can actually multiply out this thing bigger than or equal to phi inverse of eta, and you multiply it out like this, and lo and behold, it's an SOCP. Oh, actually, it's only an SOCP if this thing is bigger than a half. Because otherwise this is negative, and then you're sitting on the wrong side of the inequality there.","zh":"如果概率约束成立的概率超过50%，那么你实际上可以将这个量大于或等于phi的逆函数在eta处的值，然后像这样展开，结果就会是一个SOCP。哦，实际上，只有当这个量大于一半时，它才是一个SOCP。否则这个值是负的，你就坐在不等式错误的一边了。","start":3091.98,"end":3120.6},{"id":159,"text":"If someone came up to you and said, please help me solve this robust problem. And you go, what does he go? Well, the thing is, I don't know the constraints and they vary. And I'd say, well, how with what probability would you like your constraints to hold? And if they said something like, oh, 15 percent would be good for me. Like you would say, go away.","zh":"如果有人走过来对你说，请帮我解决这个鲁棒问题。你就会问，他想要什么？实际上，我不知道约束条件，而且它们还会变化。我会说，你希望你的约束条件以多大的概率成立呢？如果他们说，比如15%就可以了，你就会说，走吧。","start":3122.07,"end":3140.88},{"id":160,"text":"I mean, you'd check or whatever, but you'd send them away. And as they're leaving, right, you can shout out. It says, not only is that stupid, but you can't even solve it. That's what I would say to that person. That's as they're leaving. Okay, everybody got that? I mean, there are weird cases where you might have risk-seeking things.","zh":"我的意思是，你可能会检查一下，但你会让他们离开。当他们离开的时候，你可以说，这不仅很愚蠢，而且你甚至无法解决这个问题。这就是我会对那个人说的话。当他们离开的时候。好的，大家明白了吗？我的意思是，有一些奇怪的情况，你可能会有风险寻求的行为。","start":3141.44,"end":3170.57},{"id":161,"text":"The closest I've ever come to hearing somebody describe risk-seeking something was, okay, not socially positive, but it was somebody who was designing missile controllers. And they said, well, if you have high probability of making a kill, do it. But we'll take 10% because otherwise you already launched it, it's on its way, and it's not coming home and you're not going to use it again. I don't know if everybody got that. And I think I even quasi-accept that as an actual application, if not a socially positive one. But anyway, okay. Okay.","zh":"我曾经听过有人描述风险寻求行为，大概就是这样的情况：虽然这在社会上并不积极，但那是设计导弹控制器的人。他们说，如果你有很高的概率成功击中目标，就去执行。但我们会选择10%的概率，因为一旦发射出去，导弹已经飞出去了，无法返回，而且你也不会再使用它了。我不确定每个人是否都理解了这一点。我认为我甚至在某种程度上接受这个作为实际应用，尽管它可能不是一种社会积极的行为。不过，好吧，好吧。","start":3172.14,"end":3195.74}],"notes":["本段讲解了概率约束与SOCP（二次约束规划）之间的关系。当约束满足的概率大于50%时，可以将概率约束转换为SOCP形式。但需要注意的是，只有当phi逆函数的值大于0.5时，才能保证不等式成立，否则会处于不等式的错误一侧。","讲者通过一个实际例子说明了概率约束的转换过程。当概率要求过低（如15%）时，问题变得不可解，因为无法满足约束条件。这表明在实际应用中，需要合理设定约束满足的概率阈值。","讲者提到风险寻求（risk-seeking）的概念，这在导弹控制系统设计中有所体现。设计者倾向于在高概率下执行任务，但为了确保任务成功，可能选择较低的概率阈值，如10%。","讲者强调了概率约束转换为SOCP的条件，即概率必须大于50%。这与phi逆函数的性质密切相关，因为当概率小于50%时，phi逆函数的值会为负，导致不等式方向错误。","讲者通过幽默的方式指出，当概率要求过低时，问题无法解决，因此需要合理设定概率阈值。这表明在实际应用中，概率约束的设定需要权衡风险与可行性。","讲者提到风险寻求在导弹控制系统中的应用，尽管这可能不是社会积极的案例，但说明了在某些工程场景中，风险寻求策略是合理的。"],"formulas":[{"latex":"P(constraints\\ hold) > 50%","symbols":"约束满足的概率大于50%","explanation":"该公式正确表达了约束满足概率的条件，无需修改。","evidence":"probability that the constraints hold is more than 50%, then you can actually multiply out this thing bigger than or equal to phi inverse of eta, and you multiply it out like this, and lo and behold, it's an SOCP. Oh, actually, it's only an SOCP if this thing is bigger than a half. Because otherwise this is negative, and then you're sitting on the wrong side of the inequality there. Everybody see that? So, now..."}],"uncertainties":["phi inverse of eta is negative, right? If I have a standard Gaussian and I say, what's the inverse CDF of 0.3? I don't know what it is, but it's like minus a half or something, roughly."],"diagram":"none","start":3036.91,"end":3195.74,"asr_flags":[],"math_clarifications":["公式phi^{-1}(eta) > 0.5未提供phi函数的具体定义，无法验证其正确性，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3036.91,"text":"It's pretty straightforward. What we want to do is we want to say that this thing is bigger than or equal to eta, right? Eta is 0.95. There you go. But this phi is monotone, right? So this says this expression is bigger than phi inverse of eta. Everybody got that? Okay, now phi inverse of eta..."},{"start":3062.71,"text":"it's going to be positive, right? Because eta is like 0.85 and stuff. Oh, actually, if eta is less than 50%, if eta is less than 50%, phi inverse of eta is negative, right? If I have a standard Gaussian and I say, what's the inverse CDF of 0.3? I don't know what it is, but it's like minus a half or something, roughly. I just made that up, but still. Everybody got this, right? So provided that you're required..."},{"start":3091.98,"text":"probability that the constraints hold is more than 50%, then you can actually multiply out this thing bigger than or equal to phi inverse of eta, and you multiply it out like this, and lo and behold, it's an SOCP. Oh, actually, it's only an SOCP if this thing is bigger than a half. Because otherwise this is negative, and then you're sitting on the wrong side of the inequality there. Everybody see that? So, now..."},{"start":3122.07,"text":"If someone came up to you and said, please help me solve this robust problem. And you go, what does he go? Well, the thing is, I don't know the constraints and they vary. And I'd say, well, how with what probability would you like your constraints to hold? And if they said something like, oh, 15 percent would be good for me. Like you would say, go away."},{"start":3141.44,"text":"I mean, you'd check or whatever, but you'd send them away. And as they're leaving, right, you can shout out. It says, not only is that stupid, but you can't even solve it. That's what I would say to that person. That's as they're leaving. Okay, everybody got that? I mean, there are weird cases where you might have risk-seeking things. The closest I've ever come to hearing somebody describe risk-seeking something was, okay, not socially positive, but it was somebody who was designing missile controllers."},{"start":3172.14,"text":"And they said, well, if you have high probability of making a kill, do it. But we'll take 10% because otherwise you already launched it, it's on its way, and it's not coming home and you're not going to use it again. I don't know if everybody got that. And I think I even quasi-accept that as an actual application, if not a socially positive one. But anyway, okay. Okay."}],"speech_gaps":[],"frame":"../frames/v006/019.webp","frame_time":3048.91},{"title":"几何规划简介","segments":[{"id":162,"text":"Next up in our tour. So next topic is geometric programming. So you're seeing a lot of stuff. This is very cool. This goes back into the 1940s and actually, weirdly, it persisted. Well, let me explain what it is. So it's a class of optimization problems where we are going to apply.","zh":"接下来我们继续游览。所以下一个主题是几何规划。你们看到很多内容。这非常酷。这可以追溯到1940年代，实际上，奇怪的是它一直延续下来。嗯，让我解释一下它是什么。它是一类优化问题，我们将要应用。","start":3198.76,"end":3222.54},{"id":163,"text":"It is absolutely not a convex problem. There's no doubt about it. We'll look at it in a minute. It's very weird. But it's not a convex problem. But what we're going to do is we're going to make a transformation. We're going to change the variables and change a few other things. That's all. And now it's going to become convex under this change of variables.","zh":"它绝对不是凸问题。毫无疑问。我们稍后会看一下。它非常奇怪。但它不是凸问题。但我们将要做的是进行变量变换，并改变一些其他内容。全部。现在在进行这种变量变换后，它将变为凸问题。","start":3223.5,"end":3242.16},{"id":164,"text":"Now you can solve it. It scales to gigantic problems and all sorts of other stuff. Okay, so that's this is an example of that. We're gonna see others in statistics. We're gonna see them. We're gonna see them in other areas too, right? So Okay, so and it's got its own weird language. Oh what the other thing I was gonna say was","zh":"现在你可以解决它了。它可以扩展到巨大的问题和其他各种内容。好的，所以这就是一个例子。我们将在统计学中看到其他例子。我们将会看到它们。我们也会在其他领域看到它们，对吧？所以，好的，还有我原本要说的另一件事是","start":3243.08,"end":3261.93},{"id":165,"text":"This was an entire field. People talked about it. People wrote books about it from the 60s. All sorts of stuff. It wasn't until like around 1980s that people actually realized it was convex. Sorry, it's not convex. Can be reduced to an equivalent convex problem and therefore scaled. Right. In fact, you don't even have to say anything at that point. You just stop and you say, it's done. Okay?","zh":"这曾经是一个完整的领域。人们谈论它。从60年代起，人们甚至为此写了书籍。各种各样的内容。直到大约1980年代，人们才真正意识到它是凸的。抱歉，它本身并不是凸的。但它可以被转化为一个等价的凸问题，因此可以扩展。对的。事实上，你甚至在那一点上都不需要说任何话。你只需停下来并说，已经完成了。好的？","start":3262.52,"end":3288.29},{"id":166,"text":"Although some of my friends who were in Moscow in the 60s said, oh, we all knew that. Like, oh, so I'm hardly surprised in the West they didn't know that. Anyway, so everybody got this? Okay, so here it is. And it's got its own secret language, which you should never use these words in the wrong situation because you will sound like an idiot. Unless other people know the background and things like that. So here's what it is. If I have a product,","zh":"尽管一些在我60年代在莫斯科的朋友说，哦，我们都知道这一点。比如，哦，所以我在西方他们不知道这一点我并不感到惊讶。不管怎样，大家都明白了吗？好的，所以这里就是。它有自己的一套秘密语言，你绝不能在错误的情境下使用这些词汇，否则你会听起来像个傻瓜。除非其他人了解背景和类似的事情。所以这就是它的内容。如果我有一个乘积，","start":3289.91,"end":3318.89},{"id":167,"text":"These are positive variables, and I raise them to various powers. But the powers are just real numbers. They can be minus 1.3, plus 2.6, minus 3.5. Everybody got that? So it's a product. By the way, I think people talk about this as a scaling law in a lot of engineering fields, right? Like, how does this go with Reynolds number and all that kind of stuff? It's a scaling law. So I think some people are familiar with things that look like that.","zh":"这些都是正变量，我将它们提升到各种幂次。但这些幂次只是实数。它们可以是-1.3，+2.6，-3.5。大家明白了吗？所以这是一个乘积。顺便说一下，我认为在很多工程领域，人们会将这种形式称为标度律（scaling law），对吧？比如，这与雷诺数之类的东西之间有什么关系？这就是一种标度律。因此，我认为有些人已经熟悉这种形式了。","start":3319.5,"end":3346.75},{"id":168,"text":"Anyway, so in this field of geometric programming, they decided to call this a monomial. However, unfortunately, there is a definition of monomial in math, which has been used since like 1820 or something like that, and it is absolutely standard. It's like min. There is no doubt what a monomial is. A monomial is one and only one thing. It is a product of variables.","zh":"总之，在几何规划这个领域，他们决定将这种形式称为单项式（monomial）。然而不幸的是，数学中有一个单项式的定义，自1820年左右以来一直沿用，而且是绝对标准的。就像最小值（min）一样，什么是单项式是毫无疑问的。单项式只有一种定义，它是一个变量的乘积。","start":3348.18,"end":3374.29}],"notes":["本段介绍了几何规划的基本概念，指出它是一种优化问题，虽然最初被认为是非凸的，但通过变量变换可以转化为凸问题。讲者提到几何规划在60年代是一个独立的领域，直到1980年代才被认识到其凸性。","讲者强调了几何规划中的一些术语，如monomial（单项式），并指出数学中已有标准定义，与几何规划中的定义不同。这说明术语的使用需要谨慎，以避免混淆。","讲者提到几何规划中的乘积形式，变量可以是正数，并且可以被提升到任意实数次幂，如-1.3、+2.6、-3.5等。这种形式在工程领域被称为缩放定律（scaling law），例如与雷诺数相关。","讲者指出，几何规划中的monomial与数学中的monomial定义不同，数学中的monomial是变量的乘积，而几何规划中的monomial可能包含其他形式。这说明术语的使用需要根据上下文来理解。","讲者提到，几何规划在统计学和其他领域都有应用，但需要特别注意术语的使用，以避免误解。这表明几何规划是一个跨学科的领域，需要特定的语言和术语。","讲者提到，虽然几何规划在60年代是一个独立的领域，但直到1980年代才被认识到其凸性，这说明该领域的研究经历了长期的发展和演变。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3198.76,"end":3374.29,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3198.76,"text":"Next up in our tour. So next topic is geometric programming. So you're seeing a lot of stuff. This is very cool. This goes back into the 1940s and actually, weirdly, it persisted. Well, let me explain what it is. So it's a class of optimization problems where we are going to apply."},{"start":3223.5,"text":"It is absolutely not a convex problem. There's no doubt about it. We'll look at it in a minute. It's very weird. But it's not a convex problem. But what we're going to do is we're going to make a transformation. We're going to change the variables and change a few other things. That's all. And now it's going to become convex under this change of variables."},{"start":3243.08,"text":"Now you can solve it it scales to gigantic problems and all sorts of other stuff. Okay, so that's this is an example of that We're gonna see others in statistics. We're gonna see them. We're gonna see them in other areas too, right? So Okay, so and it's got its own weird language. Oh what the other thing I was gonna say was"},{"start":3262.52,"text":"This was an entire field. People talked about it. People wrote books about it from the 60s. All sorts of stuff. It wasn't until like around 1980s that people actually realized it was convex. Sorry, it's not convex. Can be reduced to an equivalent convex problem and therefore scaled. Right. In fact, you don't even have to say anything at that point. You just stop and you say, it's done. Okay?"},{"start":3289.91,"text":"Although some of my friends who were in Moscow in the 60s said, oh, we all knew that. Like, oh, so I'm hardly surprised in the West they didn't know that. Anyway, so everybody got this? Okay, so here it is. And it's got its own secret language, which you should never use these words in the wrong situation because you will sound like an idiot. Unless other people know the background and things like that. So here's what it is. If I have a product,"},{"start":3319.5,"text":"These are positive variables, and I raise them to various powers. But the powers are just real numbers. They can be minus 1.3, plus 2.6, minus 3.5. Everybody got that? So it's a product. By the way, I think people talk about this as a scaling law in a lot of engineering fields, right? Like, how does this go with Reynolds number and all that kind of stuff? It's a scaling law. So I think some people are familiar with things that look like that."},{"start":3348.18,"text":"Anyway, so in this field of geometric programming, they decided to call this a monomial. However, unfortunately, there is a definition of monomial in math, which has been used since like 1820 or something like that, and it is absolutely standard. It's like min. There is no doubt what a monomial is. A monomial is one and only one thing. It is a product of variables."}],"speech_gaps":[],"frame":"../frames/v006/020.webp","frame_time":3210.76},{"title":"几何规划中的多项式与凸性","segments":[{"id":169,"text":"with integer exponents, and the coefficient in front can be anything, positive or negative. Everybody got that? So, minus 3 x1 cubed times x squared times x5, that's a monomial that you can say outside this room.","zh":"带有整数指数，前面的系数可以是任何数，正数或负数。大家明白了吗？比如，-3x1的立方乘以x的平方乘以x5，这就是一个可以在房间里外说出来的单项式。","start":3375.12,"end":3392.81},{"id":170,"text":"But only in the context of geometric programming would you call this a monomial. So this is just a heads up. Because if you say, if you use, you know that's a monomial, and there's anybody around who doesn't know about geometric programming, they'll think you're an idiot. Okay? So, okay.","zh":"但只有在几何规划的语境下，你才会称这个为单项式。这是一个提醒。如果你说，如果你使用，你知道这是单项式，而有任何人不知道几何规划，他们会认为你是个傻子。好吗？好的。","start":3393.78,"end":3419.68},{"id":171,"text":"Okay, that's called a posi. And I think it's supposed to be like positive and monomial. Forget the fact that their use of monomial is not the absolutely standard use, right? So anyway, whatever. That's posinomial. And then a geometric program looks like this. It says you have positive variables. That's implicit. And you minimize a posinomial subject to, and don't say posinomial.","zh":"好的，这被称为posi。我想它应该是像正数和单项式。别管他们对单项式的使用不是绝对标准的用法，对吧？总之，不管怎样，这就是posinomial。然后一个几何规划看起来像这样。它说你有正数变量。这是隐含的。并且你最小化一个posinomial，不要说posinomial。","start":3420.62,"end":3447.32},{"id":172,"text":"Okay, that's called a posi. And I think it's supposed to be like positive and monomial. Forget the fact that their use of monomial is not the absolutely standard use, right? So anyway, whatever. That's posinomial. And then a geometric program looks like this. It says you have positive variables. That's implicit. And you minimize a posinomial subject to, and don't say posinomial.","zh":"好的，这被称为posi。我想它应该是像正数和单项式。别管他们对单项式的使用不是绝对标准的用法，对吧？总之，不管怎样，这就是posinomial。然后一个几何规划看起来像这样。它说你有正数变量。这是隐含的。并且你最小化一个posinomial，不要说posinomial。","start":3448.56,"end":3469.9},{"id":173,"text":"You know, this is not remotely convex. I mean, these are highly nonlinear, right? I mean, here's an example of this. You know, x1 to the 1.3 times x2 to the minus 0.3 is equal to 1. Well, that is not affine. Last time I checked, it's not even close. Everybody got that? Okay, that's a GP. And books were written about this in the 60s. People solved them by hand. I'm not kidding.","zh":"你知道，这根本不是凸的。我的意思是，这些是非常非线性的，对吧？比如，这里有一个例子。你知道，x1的1.3次方乘以x2的-0.3次方等于1。这显然不是仿射的。上次我检查的时候，它甚至不接近。大家明白了吗？好的，这就是一个几何规划。在60年代，关于这个写了很多书。人们用手动方法解决它们。我可不是开玩笑。","start":3470.46,"end":3499.34},{"id":174,"text":"When they were easy enough, it's got kind of weird. But then here's what was discovered in the West in the 80s. And supposedly in Moscow, everybody knew this in the 60s. So here it is. What you do is you change variables. They're positive variables. So I'm going to work with the logs. I call those y, right? That's a change of variables. So I'm going to have yi. And then when I have a monomial, what does that convert to? Well, it's the log.","zh":"当它们足够简单的时候，它有点奇怪。但后来在80年代，西方发现了这一点。据说在莫斯科，大家在60年代就知道了这一点。所以这里就是。你所做的就是改变变量。它们是正数变量。所以我将使用对数。我称它们为y，对吧？这就是变量替换。所以我将有yi。当有一个单项式时，它会转换成什么？嗯，它是对数。","start":3500.58,"end":3528.97}],"notes":["本段讲解了几何规划中的多项式概念，特别是单项式（monomial）和正项式（posinomial）的定义。单项式是形如 $ x_1^a x_2^b \times \text{常数} $ 的表达式，而正项式是多个单项式的和。在几何规划中，单项式和正项式有特定的定义，但这些术语在标准数学中可能不完全一致。","讲者强调了在使用这些术语时的注意事项，特别是在非几何规划领域的人可能误解这些术语。因此，讲者建议在使用这些术语时要确保听众了解其背景，否则可能会引起误解。","几何规划（GP）是一种非凸优化问题，其约束条件和目标函数通常是非线性的。例如，$ x_1^{1.3} x_2^{-0.3} = 1 $ 是一个典型的几何规划问题，它不是仿射的，因此不满足凸性条件。","在20世纪60年代，几何规划被广泛研究，人们通过手工方法求解这些问题。然而，到了80年代，西方学者发现了将几何规划转换为凸优化问题的方法，即通过变量替换（如取对数）将非凸问题转化为凸问题。","变量替换是解决几何规划问题的关键步骤。通过将正变量取对数，可以将单项式转换为线性形式，从而将非凸问题转化为凸问题。这种方法使得几何规划问题可以通过凸优化技术求解。","讲者提到，虽然几何规划在西方直到80年代才被广泛研究，但在莫斯科等地区，这一方法可能早在60年代就已经被熟知。这表明不同地区在数学研究上的发展可能存在差异。"],"formulas":[{"latex":"x_1^{1.3} x_2^{-0.3} = 1","symbols":"x₁的1.3次方乘以x₂的-0.3次方等于1","explanation":"该公式是几何规划中的一个例子，展示了非线性约束条件，其中x₁和x₂是正变量。","evidence":"You know, this is not remotely convex. I mean, these are highly nonlinear, right? I mean, here's an example of this. You know, x1 to the 1.3 times x2 to the minus 0.3 is equal to 1. Well, that is not affine. Last time I checked, it's not even close. Everybody got that? Okay, that's a GP. And books were written about this in the 60s. People solved them by hand. I'm not kidding."},{"latex":"y_i = \\text{log}(x_i)","symbols":"y_i = log(x_i)","explanation":"该公式表示变量变换，将正变量x_i转换为对数变量y_i，这是解决几何规划问题的常用方法。","evidence":"When they were easy enough, it's got kind of weird. But then here's what was discovered in the West in the 80s. And supposedly in Moscow, everybody knew this in the 60s. So here it is. What you do is you change variables. They're positive variables. So I'm going to work with the logs. I call those y, right? That's a change of variables. So I'm going to have yi. And then when I have a monomial, what does that convert to? Well, it's the log."}],"uncertainties":[],"diagram":"none","start":3375.12,"end":3528.97,"asr_flags":[],"math_clarifications":["公式中的指数1.3和-0.3是实数，符合几何规划中允许的非整数指数。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3375.12,"text":"with integer exponents, and the coefficient in front can be anything, positive or negative. Everybody got that? So, minus 3 x1 cubed times x squared times x5, that's a monomial that you can say outside this room."},{"start":3393.78,"text":"But only in the context of geometric programming would you call this a monomial. So this is just a heads up. Because if you say, if you use, you know that's a monomial, and there's anybody around who doesn't know about geometric programming, they'll think you're an idiot. Okay? So, okay. And this is even worse. A posinomial. And I'm sorry, we didn't make this up. This is simply the name assigned to it in the 1960s. It's a sum of monomials."},{"start":3420.62,"text":"Okay, that's called a posi. And I think it's supposed to be like positive and monomial. Forget the fact that their use of monomial is not the absolutely standard use, right? So anyway, whatever. That's posinomial. And then a geometric program looks like this. It says you have positive variables. That's implicit. And you minimize a posinomial subject to, and don't say posinomial."},{"start":3448.56,"text":"if you say that make sure everybody around you within any hearing distance knows about gp and knows that you know about gp otherwise don't say that word uh because i mean you can try it just walk over to the math department and see what happens but anyway um okay and then you and you have equality constraints right so"},{"start":3470.46,"text":"You know, this is not remotely convex. I mean, these are highly nonlinear, right? I mean, here's an example of this. You know, x1 to the 1.3 times x2 to the minus 0.3 is equal to 1. Well, that is not affine. Last time I checked, it's not even close. Everybody got that? Okay, that's a GP. And books were written about this in the 60s. People solved them by hand. I'm not kidding."},{"start":3500.58,"text":"When they were easy enough, it's got kind of weird. But then here's what was discovered in the West in the 80s. And supposedly in Moscow, everybody knew this in the 60s. So here it is. What you do is you change variables. They're positive variables. So I'm going to work with the logs. I call those y, right? That's a change of variables. So I'm going to have yi. And then when I have a monomial, what does that convert to? Well, it's the log."}],"speech_gaps":[],"frame":"../frames/v006/021.webp","frame_time":3387.12},{"title":"几何规划与凸优化的等价性","segments":[{"id":175,"text":"Oh, sorry, yeah, let's see what it is. If you have f, right, this transforms to, these are exponentials, actually to the exponential of an affine function, right? If I take the log of a monomial, I get an affine function, okay? Then a posinomial is going to transform into a log sum exp of an affine function, and they're convex, right? So that means...","zh":"哦，抱歉，是的，我们来看看这是什么。如果你有 f，对吧，这些实际上是指数函数，具体来说是指数函数的仿射函数。如果你对单项式取对数，你会得到一个仿射函数，对吧？那么一个 posinomial 将会转换为一个对数求和指数函数的仿射函数，而且它们是凸的，对吧？所以这意味着……","start":3529.51,"end":3556.66},{"id":176,"text":"The geometric program over here, which is not remotely convex, is actually exactly equivalent to this problem. And this problem is convex, because look at this. This is log sum exp of an affine function. Log sum exp is convex, and convex of affine is convex. So we're all these. That's linear. Affine. Whatever. However you want to say it. Everybody got this?","zh":"这里的几何规划，看起来根本不凸，实际上却与这个问题完全等价。这个问题是凸的，因为看这里。这是对数求和指数函数的仿射函数。对数求和指数函数是凸的，而凸函数的仿射函数也是凸的。所以这些都是一样的。那是线性的。仿射的。无论你怎么说。大家明白了吗？","start":3556.98,"end":3584.38},{"id":177,"text":"So it's actually pretty cool. It's even cooler because every time when you look at a practical field where people use geometric programming, you will find out that they already, either implicitly or not, figured out you should be working with logs. I'll give you an example. A lot of times there's power control for wireless systems or actually for cables, right? And actually, so engineers there, they use decibels to talk about powers. Well, guess what? That's the log.","zh":"所以这实际上非常酷。甚至更酷的是，每次你看到人们在实际领域中使用几何规划时，你会发现他们已经，无论是显式还是隐式地，意识到你应该使用对数来工作。我给你一个例子。很多时候在无线系统或实际上电缆中的功率控制中，工程师们会用分贝来谈论功率。猜猜看？这就是对数。","start":3584.91,"end":3613.31},{"id":178,"text":"If you go to circuit design and you'd say, well, tell me about my library. What sizes do these come in? And they go, oh, yeah, you can get that, you know, that whatever, that NAND gate. You can get it in the size 0.5, size 1, 1.4, 2, you know, 4, 8, 16. Sound familiar?","zh":"如果你去电路设计，然后问：告诉我关于我的库。这些元件的尺寸有哪些？他们会说：哦，是的，你可以得到那个，你知道的，那个什么，那个与非门。你可以得到尺寸 0.5、1、1.4、2、你知道的，4、8、16。听起来熟悉吗？","start":3614.39,"end":3634.1},{"id":179,"text":"What it means is they already knew in their hearts that basically you should not work with the size, you should work with the log of the size, right? Because that's what those numbers are. Yeah? Is it always the same k in the objective and the inequality? Let me think. Let me think about that. Sorry.","zh":"这意味着他们内心已经知道，基本上你不应该直接使用尺寸，而应该使用尺寸的对数，对吧？因为这些数字就是对数。对吗？目标函数和不等式中的 k 是否总是相同的？让我想想。让我想想这个问题。抱歉。","start":3635.49,"end":3660.1},{"id":180,"text":"It is let me it may not be actually let me think I don't think it is you're right because these are different Yeah, there's something there's something the K doesn't have to be the same No, it does not have to be so yeah Okay, so that's GP I'll I'll go in one exam. I'm not gonna go through the details I mean actually the real truth is I couldn't even defend the details","zh":"是的，让我想想，它可能并不相同，让我想想，我不认为是的，你是对的，因为这些是不同的。是的，那里有东西，k 不一定相同。不，它不一定相同。是的，好的，所以这就是 GP。我会在一次考试中讲一下。我不会详细讲解，我的意思是，实际上真实的真相是，我甚至无法捍卫这些细节。","start":3662.2,"end":3694.39}],"notes":["本段讲解了几何规划（GP）与凸优化之间的等价性。几何规划本身是非凸的，但通过取对数变换，可以将其转化为凸优化问题。具体来说，单项式（monomial）的对数是仿射函数，而拟单项式（posinomial）的对数则转化为log-sum-exp形式，这是凸函数。因此，几何规划问题可以通过对数变换转化为凸优化问题。","讲者提到，几何规划在实际应用中经常被使用，例如无线系统中的功率控制和电路设计中的元件尺寸选择。这些实际应用中，工程师们已经隐式地使用了对数变换，例如使用分贝（dB）表示功率，这本质上是对数的使用。","讲者还指出，在几何规划中，目标函数和约束条件中的参数k不一定相同。虽然在某些情况下k可能相同，但通常并不需要保持一致。这一点在实际应用中可能需要根据具体问题进行调整。","讲者最后提到，虽然几何规划的细节可能较为复杂，但其核心思想是通过对数变换将非凸问题转化为凸问题，从而利用凸优化的高效求解方法。"],"formulas":[],"uncertainties":["It is let me it may not be actually let me think I don't think it is you're right because these are different Yeah, there's something there's something the K doesn't have to be the same No, it does not have to be so yeah Okay, so that's GP I'll I'll go in one exam. I'm not gonna go through the details I mean actually the real truth is I couldn't even defend the details"],"diagram":"none","start":3529.51,"end":3694.39,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3529.51,"text":"Oh, sorry, yeah, let's see what it is. If you have f, right, this transforms to, these are exponentials, actually to the exponential of an affine function, right? If I take the log of a monomial, I get an affine function, okay? Then a posinomial is going to transform into a log sum exp of an affine function, and they're convex, right? So that means..."},{"start":3556.98,"text":"The geometric program over here, which is not remotely convex, is actually exactly equivalent to this problem. And this problem is convex, because look at this. This is log sum exp of an affine function. Log sum exp is convex, and convex of affine is convex. So we're all these. That's linear. Affine. Whatever. However you want to say it. Everybody got this?"},{"start":3584.91,"text":"So it's actually pretty cool. It's even cooler because every time when you look at a practical field where people use geometric programming, you will find out that they already, either implicitly or not, figured out you should be working with logs. I'll give you an example. A lot of times there's power control for wireless systems or actually for cables, right? And actually, so engineers there, they use decibels to talk about powers. Well, guess what? That's the log."},{"start":3614.39,"text":"If you go to circuit design and you'd say, well, tell me about my library. What sizes do these come in? And they go, oh, yeah, you can get that, you know, that whatever, that NAND gate. You can get it in the size 0.5, size 1, 1.4, 2, you know, 4, 8, 16. Sound familiar?"},{"start":3635.49,"text":"What it means is they already knew in their hearts that basically you should not work with the size, you should work with the log of the size, right? Because that's what those numbers are. Yeah? Is it always the same k in the objective and the inequality? Let me think. Let me think about that. Sorry."},{"start":3662.2,"text":"It is let me it may not be actually let me think I don't think it is you're right because these are different Yeah, there's something there's something the K doesn't have to be the same No, it does not have to be so yeah Okay, so that's GP I'll I'll go in one exam. I'm not gonna go through the details I mean actually the real truth is I couldn't even defend the details"}],"speech_gaps":[],"frame":"../frames/v006/022.webp","frame_time":3541.51},{"title":"凸优化中的工程设计问题","segments":[{"id":181,"text":"But I will tell you a funny story about it. I found this in a book on optimization for engineering design. And this example was held up as an example. They said, oh, here's a problem that is not convex. And that was literally the point of the example. That's a true statement.","zh":"但我会给你们讲一个关于这个问题的有趣故事。我在一本关于工程设计的优化书籍中找到了这个例子。这个例子被当作一个例子提出来。他们说，哦，这里有一个非凸的问题。而这正是这个例子的要点。这是个真实的陈述。","start":3695.17,"end":3717.65},{"id":182,"text":"You do the right sneaky change of variables, and it is convex. So the problem is this. You're going to design this cantilever beam, and what you can do is you can change the length. That's this thing that you can see here, but also the width, which you can't see. That's how wide it is over here.","zh":"你做正确的巧妙变量替换，它就会变成凸的。所以问题就是这样的。你要设计这个悬臂梁，你可以改变长度。这就是你在这里能看到的这个东西，但也可以改变宽度，这是你在这里看不到的。这是它在这里的宽度。","start":3719.42,"end":3739.98},{"id":183,"text":"And so that's what this is. And then we're going to put a force at the tip. And of course, I mean, you don't have to know any mechanical engineering to know it's going to deflect, right? And if you make yourself a giant thick thing where this is steel or something like that, it's going to be very stiff.","zh":"这就是这个例子的内容。然后我们会在末端施加一个力。当然，你不需要知道任何机械工程知识就能知道它会弯曲，对吧？如果你做一个巨大的厚实的结构，比如用钢之类的材料，它就会非常坚硬。","start":3742.26,"end":3761.88},{"id":184,"text":"Right. Because then when you push, you put a lot of newtons on it, it's barely going to budge. Right. Or I could make it sort of this flimsy small thing and I press it and it's going to really bend. Right. So that's that's kind of that means. And again, you don't have to know any mechanical engineering to know this. I mean, I don't know any. So that's fine. So it's fine. But that's just that's the rough idea. Right. And so your design problem is something like, you know, minimize the total weight.","zh":"对的。因为当你施加力时，你施加了很多牛顿，它几乎不会移动。对的。或者我可以做一个比较脆弱的小结构，当我按压它时，它会弯曲很多。对的。这就是这个意思。而且，你不需要知道任何机械工程知识就能明白这一点。我的意思是，我并不懂。所以没关系。所以这只是个大概的想法。对的。因此，你的设计问题是这样的，比如，最小化总重量。","start":3762.43,"end":3786.71},{"id":185,"text":"subject to, I mean, these are just, you know, this could even be manufacturing constraints, right? That you just, there's just limits to these. You could have an upper, that's a geometric constraint. You could have an upper bound on the stress in each segment.","zh":"受约束于，我的意思是，这些只是，你知道的，这甚至可以是制造约束，对吧？也就是说，这些变量是有一定限制的。你可以有一个上限，这是几何约束。你也可以对每个段的应力有一个上限。","start":3787.74,"end":3801.9},{"id":186,"text":"That's a reasonable model of failure. And then you want an upper bound and deflection of the beam at the end. So what you're saying is if I load this with 10 kilonewtons, I don't want it to sag more than 3 centimeters. That would be your spec. Everybody got it? By the way, problems like this, but simpler, were already being solved in the early 1950s in aerospace.","zh":"这是一个合理的失效模型。然后你想要一个上界和梁末端的挠度。所以你的意思是，如果我对这个梁施加10千牛的载荷，我不希望它下垂超过3厘米。这就是你的规格。大家明白了吗？顺便说一句，类似这样的问题，但更简单，早在1950年代初的航空航天领域就已经被解决了。","start":3802.48,"end":3825.3},{"id":187,"text":"They were doing exact, and they were using linear programming and mostly linear programming in aerospace, right? Pretty cool, right? Because you're, you know, if you design a bridge that people are going to drive over for 100 years, you build a lot of margin into it and stuff like that. If you're doing aerospace stuff, you can't engineer stuff 5x over, right? Because it just weighs too much, and congratulations, now you have no payload, right?","zh":"他们进行的是精确计算，并且主要使用线性规划，尤其是在航空航天领域，对吧？这很酷，对吧？因为如果你设计一座人们要使用100年的桥梁，你会在其中加入很多安全余量等等。但如果你在做航空航天相关的工作，你就不能把设计放大五倍，对吧？因为这样重量会太大，恭喜你，现在你的有效载荷就没了，对吧？","start":3826.35,"end":3850.11}],"notes":["本段介绍了凸优化在工程设计中的应用，以悬臂梁设计为例。讲者提到，虽然问题最初看起来是非凸的，但通过变量替换可以将其转化为凸问题。这说明了凸优化在实际工程中的重要性，即通过数学变换将复杂问题简化为可解的形式。","讲者描述了悬臂梁的设计问题，包括长度和宽度的调整，以及施加在末端的力。他指出，梁的刚度与其材料和尺寸有关，较厚的梁更不容易弯曲。这体现了物理直觉在工程设计中的作用，即使没有专业知识也能理解基本原理。","讲者提到设计目标是使梁的总重量最小化，同时满足制造约束和应力限制。这说明了优化问题中目标函数和约束条件的结合，以及如何通过数学建模来处理实际工程问题。","讲者进一步说明了对梁挠度的限制，即在施加10千牛的力时，挠度不能超过3厘米。这体现了工程设计中的规范要求，以及如何将这些要求转化为数学约束。","讲者提到在1950年代，航空航天领域已经开始使用线性规划解决类似问题。这说明了凸优化方法在实际工程中的历史应用，以及其在不同领域的适应性。","讲者指出，航空航天设计需要在重量和性能之间取得平衡，不能过度设计。这反映了工程优化中的权衡问题，即在满足性能要求的同时，尽可能减少资源消耗。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3695.17,"end":3850.11,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3695.17,"text":"But I will tell you a funny story about it. I found this in a book on optimization for engineering design. And this example was held up as an example. They said, oh, here's a problem that is not convex. And that was literally the point of the example. That's a true statement."},{"start":3719.42,"text":"You do the right sneaky change of variables, and it is convex. So the problem is this. You're going to design this cantilever beam, and what you can do is you can change the length. That's this thing that you can see here, but also the width, which you can't see. That's how wide it is over here."},{"start":3742.26,"text":"And so that's what this is. And then we're going to put a force at the tip. And of course, I mean, you don't have to know any mechanical engineering to know it's going to deflect, right? And if you make yourself a giant thick thing where this is steel or something like that, it's going to be very stiff."},{"start":3762.43,"text":"Right. Because then when you push, you put a lot of newtons on it, it's barely going to budge. Right. Or I could make it sort of this flimsy small thing and I press it and it's going to really bend. Right. So that's that's kind of that means. And again, you don't have to know any mechanical engineering to know this. I mean, I don't know any. So that's fine. So it's fine. But that's just that's the rough idea. Right. And so your design problem is something like, you know, minimize the total weight."},{"start":3787.74,"text":"subject to, I mean, these are just, you know, this could even be manufacturing constraints, right? That you just, there's just limits to these. You could have an upper, that's a geometric constraint. You could have an upper bound on the stress in each segment."},{"start":3802.48,"text":"That's a reasonable model of failure. And then you want an upper bound and deflection of the beam at the end. So what you're saying is if I load this with 10 kilonewtons, I don't want it to sag more than 3 centimeters. That would be your spec. Everybody got it? By the way, problems like this, but simpler, were already being solved in the early 1950s in aerospace."},{"start":3826.35,"text":"They were doing exact, and they were using linear programming and mostly linear programming in aerospace, right? Pretty cool, right? Because you're, you know, if you design a bridge that people are going to drive over for 100 years, you build a lot of margin into it and stuff like that. If you're doing aerospace stuff, you can't engineer stuff 5x over, right? Because it just weighs too much, and congratulations, now you have no payload, right?"}],"speech_gaps":[],"frame":"../frames/v006/023.webp","frame_time":3707.17},{"title":"非凸优化问题与凸性分析","segments":[{"id":188,"text":"There, it's delicate. You want things to be absolutely as light as possible, but still actually satisfy all the requirements that it's actually going to work. Which means that it's got to be stiff enough, it's got to handle all sorts of dynamic loads, all that kind of stuff. So stuff like this is done all the time. In fact, there's a whole field. It doesn't matter. I'll talk about that later. Okay, so that's it.","zh":"在那里，它很微妙。你希望事物尽可能轻，但仍然实际满足所有它能正常工作的要求。这意味着它必须足够坚硬，能够处理各种动态载荷，诸如此类的事情。这类事情经常被做。事实上，有一个完整的领域。不管怎样，我稍后会谈到这个。好的，这就是全部。","start":3851.89,"end":3877.87},{"id":189,"text":"Okay, so here it is in English. And then, you know, in words to work out what these things are, I'm going to just talk about a few of the things and then not, I don't want to focus on it because it's not that critical to us. But here's the total weight. The variables, remember, are W and H. And I would like to ask you, what kind of function is that? I mean, aside from it being a polynomial, which you should never say in public. But what kind of function is this of W and H? Again, pretend you're in public.","zh":"好的，这就是英文版。然后，为了弄清楚这些是什么，我会简单谈谈其中的一些内容，然后就不深入了，我不想专注于它，因为它对我们来说并不那么关键。但这是总重量。变量是 W 和 H。我想问你，这个是什么类型的函数？我是说，除了它是一个多项式，这在公共场合你永远不能说。但 W 和 H 的这个函数是什么类型的？再次，假装你是在公共场合。","start":3878.48,"end":3905.97},{"id":190,"text":"So you can use words that you're allowed to say in public. What kind of function is that? It's what? I missed that. Dot product. It's a dot product, right? It's an inner product between W and H. Is it convex in W and H? No. It's a quadratic form, right? It's the quadratic form with matrix 0, like I, I, 0. Right? So this is not convex. So you know already we are not solving a convex problem.","zh":"所以你可以使用在公共场合可以说的词语。这个是什么类型的函数？它是？我错过了。点积。它是 W 和 H 的点积，对吧？它是 W 和 H 之间的内积。它在 W 和 H 上是凸的吗？不。它是二次型，对吧？它是以矩阵 0 为系数的二次型，比如 I, I, 0。对吧？所以这不是凸函数。你已经知道我们不是在解决一个凸问题。","start":3906.62,"end":3939.4},{"id":191,"text":"Or, yeah, well, when we get around to solving this, we'll do this change of variables, and it will become a convex problem. Okay, so these various ratios are monomials, and the maximum stress is a monomial, so those are fine to handle. The vertical deflection comes from, again,","zh":"或者，是的，当我们解决这个问题时，我们会进行变量替换，它就会变成一个凸问题。好的，这些各种比率是单项式，最大应力也是一个单项式，因此这些是可以处理的。垂直挠度来自于，再次，","start":3939.96,"end":3957.77},{"id":192,"text":"I couldn't defend this, but this is, I mean, I suppose it's just like elementary, you know, baby physics and mechanics or whatever. But it's just, you start at the tip and you go back and it's just a recursion that tells you this. What's kind of cool about this is you look.","zh":"我无法为这个辩护，但这是，我是说，我想这就像基础的物理和力学，或者随便什么。但它是这样的，你从尖端开始，然后往回走，它只是一个递归，告诉你这个。这个很酷的地方在于你观察。","start":3958.35,"end":3972.03},{"id":193,"text":"at various things here. But what you'll see is that each of these, right, if you start, you can actually, by applying the rules, oh, I should say, there's a full other set. You can transcribe all the rules you know for convex functions, and they will have analogs for, like, posinomials and monomials. And I'll give you some example, right? Let's just go back. I mean, okay.","zh":"这里有很多内容。但你会看到的是，每一个，对吧，如果你开始，你实际上可以通过应用规则，哦，我应该说，还有一整套其他的规则。你可以把所有你了解的凸函数的规则都转录下来，并且它们会有类似的形式，比如posinomials和monomials。我会给你一些例子，对吧？我们先回到之前的内容。我是说，好吧。","start":3972.51,"end":4000.31}],"notes":["本段讨论了非凸优化问题，指出目标函数是W和H的点积，即内积，属于二次型，而非凸函数。因此，该问题不是凸优化问题。但通过变量替换，可以将其转化为凸问题。","讲者提到各种比值是单项式，最大应力也是单项式，这些在处理时是可行的。垂直挠度的计算涉及递归关系，但具体细节未展开。","讲者强调，虽然问题本身是非凸的，但通过变量替换可以将其转化为凸问题，这在优化中是一个重要的转换技巧。","讲者提到凸函数的规则可以推广到单项式和拟单调式（posinomials），并举例说明这些规则的类比关系。","讲者指出，虽然问题涉及物理和力学的基本概念，但重点在于数学结构和优化方法的分析，而非物理细节。","讲者提到，通过应用规则，可以将凸函数的性质推广到非凸函数，如单项式和拟单调式，这为处理非凸问题提供了理论基础。"],"formulas":[{"latex":"x^T A x","symbols":"二次型","explanation":"该公式表示一个二次型，其中 $ x $ 是向量，$ A $ 是矩阵。二次型通常用于描述二次函数的结构，但需要确认矩阵 $ A $ 是否为对称矩阵以确保其正确性。","evidence":"So you can use words that you're allowed to say in public. What kind of function is that? It's what? I missed that. Dot product. It's a dot product, right? It's an inner product between W and H. Is it convex in W and H? No. It's a quadratic form, right? It's the quadratic form with matrix 0, like I, I, 0. Right? So this is not convex. So you know already we are not solving a convex problem."},{"latex":"f(x) = x^k","symbols":"单项式","explanation":"该公式表示一个单项式函数，其中 $ x $ 是变量，$ k $ 是指数。单项式是多项式的一种，但需要确认 $ k $ 是否为常数且 $ x $ 是否为实数变量。","evidence":"Or, yeah, well, when we get around to solving this, we'll do this change of variables, and it will become a convex problem. Okay, so these various ratios are monomials, and the maximum stress is a monomial, so those are fine to handle. The vertical deflection comes from, again,"}],"uncertainties":["matrix 0, like I, I, 0"],"diagram":"none","start":3851.89,"end":4000.31,"asr_flags":[],"math_clarifications":["二次型 $ x^T A x $ 需要确认矩阵 $ A $ 是否为对称矩阵，以确保其正确性。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3851.89,"text":"There, it's delicate. You want things to be absolutely as light as possible, but still actually satisfy all the requirements that it's actually going to work. Which means that it's got to be stiff enough, it's got to handle all sorts of dynamic loads, all that kind of stuff. So stuff like this is done all the time. In fact, there's a whole field. It doesn't matter. I'll talk about that later. Okay, so that's it."},{"start":3878.48,"text":"Okay, so here it is in English. And then, you know, in words to work out what these things are, I'm going to just talk about a few of the things and then not, I don't want to focus on it because it's not that critical to us. But here's the total weight. The variables, remember, are W and H. And I would like to ask you, what kind of function is that? I mean, aside from it being a polynomial, which you should never say in public. But what kind of function is this of W and H? Again, pretend you're in public."},{"start":3906.62,"text":"So you can use words that you're allowed to say in public. What kind of function is that? It's what? I missed that. Dot product. It's a dot product, right? It's an inner product between W and H. Is it convex in W and H? No. It's a quadratic form, right? It's the quadratic form with matrix 0, like I, I, 0. Right? So this is not convex. So you know already we are not solving a convex problem."},{"start":3939.96,"text":"Or, yeah, well, when we get around to solving this, we'll do this change of variables, and it will become a convex problem. Okay, so these various ratios are monomials, and the maximum stress is a monomial, so those are fine to handle. The vertical deflection comes from, again,"},{"start":3958.35,"text":"I couldn't defend this, but this is, I mean, I suppose it's just like elementary, you know, baby physics and mechanics or whatever. But it's just, you start at the tip and you go back and it's just a recursion that tells you this. What's kind of cool about this is you look."},{"start":3972.51,"text":"at various things here. But what you'll see is that each of these, right, if you start, you can actually, by applying the rules, oh, I should say, there's a full other set. You can transcribe all the rules you know for convex functions, and they will have analogs for, like, posinomials and monomials. And I'll give you some example, right? Let's just go back. I mean, okay."}],"speech_gaps":[],"frame":"../frames/v006/024.webp","frame_time":3863.89},{"title":"几何规划与凸优化的转换","segments":[{"id":194,"text":"Okay, here we go. I want to do this. Talk to me about the product of monomials. What is that? Product of two monomials. Yes, sir. I have two monomial functions. Again, not in the math sense, in the geometric programming sense. I have two monomial functions, and I take the product. What is it? It's a monomial. It's a monomial, right? What's the sum of two monomials? It's a posinomial. Right, okay. What's the product of two posinomials?","zh":"好的，我们开始吧。我想这么做。和我谈谈单项式的乘积。什么是单项式的乘积？两个单项式的乘积。是的，先生。我有两个单项式函数。再次强调，不是数学意义上的，而是几何规划意义上的。我有两个单项式函数，我取它们的乘积。那会是什么？它是一个单项式。对吧？两个单项式的和是什么？它是一个posinomial。对，好的。两个posinomial的乘积是什么？","start":4003.22,"end":4034.58},{"id":195,"text":"All right. What is a polynomial divided by a monomial? It's a polynomial. It's fine. What's a polynomial divided by a polynomial? Right. The answer is nothing. We don't know. Okay. So I'm just saying there's a bunch of these rules that you're going to use.","zh":"好的。多项式除以单项式是什么？它是一个多项式。没问题。多项式除以多项式呢？对。答案是无解。我们不知道。好的。我只是说，你会用到很多这样的规则。","start":4036.61,"end":4065.03},{"id":196,"text":"And down here, I don't want to go into the details, but you just argue that a sum of posinomials is posinomial or whatever, that kind of thing. And what you'll end up finding is that these things are just posinomial functions. They're quite complicated, but they are posinomial functions, right? Anyway, then you reassemble everything to look like this. And there it is in this standard GP form, right? By the way...","zh":"在这里，我不想深入细节，但你只需论证posinomial的和仍然是posinomial，或者其他类似的情况。你会发现，这些函数其实就是posinomial函数。它们相当复杂，但它们是posinomial函数，对吧？无论如何，你最终会把所有内容重新组合成这样的形式。然后它就以这种标准的几何规划形式呈现出来，对吧？顺便说一句……","start":4066.38,"end":4092.7},{"id":197,"text":"You don't have to do this, right? Because what's clear is that you can actually write these out in some object-oriented, in some domain-specific language, and then something would do all of this stuff for you. And the truth is, you shouldn't even look at this any more than you should look if you actually, the way you should look at, like, after you compile something, why would you look at the bytecode or something like that, right? I mean, you could. A very small number of people have to, because that's what they do.","zh":"你不需要这么做，对吧？因为很明显，你可以把这些内容写成某种面向对象的、某种领域特定语言的形式，然后有某种工具会为你完成所有这些操作。事实上，你甚至不应该比查看编译后的字节码更频繁地查看这些内容，对吧？我的意思是，你当然可以。只有极少数的人需要这么做，因为这就是他们的工作。","start":4094.23,"end":4121.13},{"id":198,"text":"But the rest of us should never look at that. You know what I'm saying? And I think the same is kind of true for this, right? So, okay. I think I'll skip this one. This is just some advanced topics. And I'll talk about a couple more things. Just two more main topics. Okay. Oh, to finish up the other one. Geometric programming is your first example of a wide class of...","zh":"但其余的人永远不应该查看这些内容。你知道我的意思吗？我认为对于这个也是如此。所以，好的。我想跳过这个话题。这只是些高级主题。我会再讲几个内容。再讲两个主要话题。好的。哦，为了完成另一个话题。几何规划是你遇到的第一个广泛类别……","start":4121.61,"end":4151.38},{"id":199,"text":"non-convex problems that can be transformed to equivalent convex problems and therefore solved. So that's the main point about it. We're going to see plenty of others. We'll see it also happening in statistics and it happens in control and other areas. In fact, I'll even tell you a story. I used to go around and give talks. This was a long, long time ago.","zh":"可以转换为等价凸问题从而求解的非凸问题。这就是其主要观点。我们将看到很多其他例子。我们也会在统计学和控制以及其他领域看到这种情况。事实上，我甚至会给你讲个故事。我以前经常到处做演讲。那是很久很久以前的事了。","start":4151.64,"end":4175.28}],"notes":["本段主要讲解几何规划中的基本概念，包括单项式（monomials）和多项式（posinomials）的乘积与和的性质。单个单项式的乘积仍然是单项式，而两个单项式的和则形成多项式。同样，两个多项式的乘积仍然是多项式，而两个多项式的和则无法确定，因此需要进一步分析。","讲者提到，几何规划是将非凸问题转换为等效凸问题的一个例子，从而可以使用凸优化方法求解。这种转换在统计学、控制理论和其他领域都有应用。","讲者还提到，虽然这些转换规则在理论上成立，但在实际应用中，通常不需要手动进行这些转换，而是通过编程语言或工具自动完成，类似于编译后的字节码不需要手动查看。","讲者强调，对于大多数用户来说，不需要深入理解这些转换的细节，只需要了解其存在和应用即可。","讲者提到，几何规划是凸优化课程中介绍的一个重要主题，它展示了如何将非凸问题转化为凸问题，从而可以使用现有的凸优化算法进行求解。","最后，讲者提到，几何规划是广泛应用于多个领域的工具，包括统计学、控制理论等，并提到他过去曾多次进行相关讲座，说明这一主题的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4003.22,"end":4175.28,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4003.22,"text":"Okay, here we go. I want to do this. Talk to me about the product of monomials. What is that? Product of two monomials. Yes, sir. I have two monomial functions. Again, not in the math sense, in the geometric programming sense. I have two monomial functions, and I take the product. What is it? It's a monomial. It's a monomial, right? What's the sum of two monomials? It's a posinomial. Right, okay. What's the product of two posinomials?"},{"start":4036.61,"text":"All right. What is a polynomial divided by a monomial? It's a polynomial. It's fine. What's a polynomial divided by a polynomial? Right. The answer is nothing. We don't know. Okay. So I'm just saying there's a bunch of these rules that you're going to use."},{"start":4066.38,"text":"And down here, I don't want to go into the details, but you just argue that a sum of posinomials is posinomial or whatever, that kind of thing. And what you'll end up finding is that these things are just posinomial functions. They're quite complicated, but they are posinomial functions, right? Anyway, then you reassemble everything to look like this. And there it is in this standard GP form, right? By the way..."},{"start":4094.23,"text":"You don't have to do this, right? Because what's clear is that you can actually write these out in some object-oriented, in some domain-specific language, and then something would do all of this stuff for you. And the truth is, you shouldn't even look at this any more than you should look if you actually, the way you should look at, like, after you compile something, why would you look at the bytecode or something like that, right? I mean, you could. A very small number of people have to, because that's what they do."},{"start":4121.61,"text":"But the rest of us should never look at that. You know what I'm saying? And I think the same is kind of true for this, right? So, okay. I think I'll skip this one. This is just some advanced topics. And I'll talk about a couple more things. Just two more main topics. Okay. Oh, to finish up the other one. Geometric programming is your first example of a wide class of..."},{"start":4151.64,"text":"non-convex problems that can be transformed to equivalent convex problems and therefore solved. So that's the main point about it. We're going to see plenty of others. We'll see it also happening in statistics and it happens in control and other areas. In fact, I'll even tell you a story. I used to go around and give talks. This was a long, long time ago."}],"speech_gaps":[],"frame":"../frames/v006/025.webp","frame_time":4015.22},{"title":"凸优化中的锥形式问题与半定规划","segments":[{"id":200,"text":"And I would say, look, here's a problem in control. Oh, it's convex. Here's another problem in control. Oh, look, it's convex. And I said, I had a slide that was like, I said, here's an example of a problem. And I said, I don't think it's convex, right? So anyway, so I went around, gave that talk to several thousand people. I was at Berkeley. I gave the talk. A colleague of mine came up to me afterwards and he said, oh, you see that problem that you just said was probably non-convex? I was like, yeah.","zh":"我想说，看，这里有一个控制问题。哦，它是凸的。这里还有一个控制问题。哦，看，它是凸的。我说，我有一张幻灯片，上面写着，我说，这里有一个问题的例子。我说，我不认为它是凸的，对吧？总之，我到处演讲，给几千人听了。我在伯克利。我做了演讲。之后，我的一位同事走过来对我说，哦，你刚才说的那个问题，你认为可能不是凸的？我像，是的。","start":4176.16,"end":4202.0},{"id":201,"text":"And he said, can I show you something? I was like, sure. Anyway, he had some completely sick, demented change of variables. Like instead of this positive definite matrix, we're going to work in the inverse. And instead of these, we're going to work in the inverse of this times that. And I was like, Andy, why would anyone do that? And he goes, watch this. Two lines later, it's convex. And I step away and I'm like, oh no, oh no. I've been telling people all over the world that it was not convex. Then we looked at my slide and it was really awesome.","zh":"他说，我能给你展示一些东西吗？我像，当然可以。总之，他有一些完全疯狂、疯狂的变量替换。比如，而不是这个正定矩阵，我们要在它的逆矩阵上工作。而不是这些，我们要在这些的逆矩阵乘以那个上工作。我像，安迪，为什么有人会这么做？他说，看这个。两行之后，它就变成凸的了。我走开后，我像，哦不，哦不。我一直在告诉全世界的人，它不是凸的。然后我们看了我的幻灯片，它真的很棒。","start":4202.5,"end":4231.08},{"id":202,"text":"it says it says a problem that's not convex and there was a little footnote and it said probably so i was safe then by the way after that i told that story every time so i said so yeah so basically you should be very careful because this this anyway so okay fine back to this one now we're back to honest convex problems okay so","zh":"它说，这是一个非凸的问题，而且有一个小脚注，说可能是这样。因此，我当时是安全的。顺便说一句，在那之后，我每次都会讲这个故事。我说，是的，所以基本上你应该非常小心，因为这个这个，总之，好的，回到这个。现在我们回到诚实的凸问题，好的，所以","start":4231.67,"end":4252.82},{"id":203,"text":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k","zh":"好的，这里我们所做的只是将约束条件从标量不等式改为向量约束，对吧？你都知道，一个非常著名的例子叫做锥形式问题或锥形问题，对吧？它看起来像这样。你最小化一个线性函数，满足 fx 加 g 小于等于零，但这是相对于某个锥 k 和 ax 等于 b。有趣的是，如果 k","start":4254.58,"end":4281.58},{"id":204,"text":"is the non-negative orthant. This is just a pedantic way to write down an LP, right? But the cool part is K could be other cones. And then you get, like, if I make K a product of second order cones, this is SOCP. But I can have other things too. And a very famous one is so-called semi-definite programming. So that's something you will see. This is probably, it's not bad to have heard it.","zh":"是非负正交锥。这只是一个繁琐的方式来写出一个线性规划问题，对吧？但有趣的是，k 可以是其他锥。然后你得到，比如，如果我让 k 成为二阶锥的乘积，这就是 SOCP。但我也可以有其他东西。一个非常著名的例子是所谓的半定规划。所以你会看到这个。这可能是，听这个不会太糟糕。","start":4282.27,"end":4307.29},{"id":205,"text":"People talk about it in actually a whole bunch of fields now, right? So in theoretical computer science, people blabber about it. People in physics use it. So it's become mainstream in the last 20, 25 years. Here it is. You minimize a linear function subject to equality constraint, linear equality. And then you have a single inequality.","zh":"人们现在实际上在很多领域都在谈论这个问题，对吧？所以在理论计算机科学中，人们经常谈论它。物理学家也使用它。因此，它在过去20到25年里已经成为主流。这里就是。你最小化一个线性函数，受到等式约束，即线性等式约束。然后你有一个不等式。","start":4307.88,"end":4328.16},{"id":206,"text":"which looks like this. In fact, it looks like a linear inequality. If these were scalars, and that was ordinary less than or equal to, this would be a single linear inequality. It would be a silly LP. But here, these are symmetric matrices, and this says this linear combination, this affine function, which is a symmetric matrix, has to be negative semi-definite. So that's called a semi-definite program.","zh":"它看起来像这样。事实上，它看起来像一个线性不等式。如果这些是标量，而那个是普通的小于或等于，那么这将是一个单一的线性不等式。这将是一个很无聊的线性规划问题。但在这里，这些是对称矩阵，这个说法表示这个线性组合，这个仿射函数，即一个对称矩阵，必须是负半定的。这就是所谓的半定规划。","start":4328.96,"end":4353.95}],"notes":["本段主要讲述凸优化中锥形式问题的引入，强调了从标量不等式约束到向量约束的转变。讲者提到锥形式问题的一个著名例子是锥形式问题（cone form problem），并指出当锥K为非负正交锥时，这实际上是一种线性规划（LP）的写法。此外，还提到K可以是其他锥，如二次锥（SOCP）或半正定锥（SDP），并指出半正定规划在多个领域中已成为主流。","讲者通过一个例子说明了半正定规划的定义：在约束中，对称矩阵的线性组合必须是负半定的。这表明半正定规划是凸优化的一个重要子类，其约束条件涉及矩阵的半正定性，而不仅仅是标量不等式。","讲者提到，半正定规划在理论计算机科学和物理学等领域中被广泛讨论，并且在过去20到25年中已成为主流。这表明半正定规划在实际应用中具有广泛的适用性。","讲者通过一个具体的例子说明了半正定规划的约束形式：对称矩阵的线性组合必须是负半定的。这表明半正定规划的约束条件比一般的线性规划更为复杂，但仍然是凸优化问题。","讲者强调了在凸优化中，从标量不等式约束到向量约束的转变，以及锥形式问题的重要性。这表明在凸优化中，锥形式问题是一个重要的研究方向，其应用范围广泛。","讲者通过一个具体的例子说明了半正定规划的约束形式，并指出这种形式在实际应用中具有重要意义。这表明半正定规划是凸优化中的一个重要子类，其约束条件涉及矩阵的半正定性。"],"formulas":[{"latex":"minimize c^T x","symbols":"目标函数为线性函数","explanation":"目标函数为线性函数，符合凸优化问题的常见形式。","evidence":"Okay, so all we do here is the constraints, we're going to have vector constraints instead of just scalar inequalities, right? You know, a very famous example of that is called a conic form problem or a cone form problem, right? And that looks like this. You minimize a linear function subject to fx plus g is less than or equal to zero, but that's with respect to some cone k and ax equals b. What's cool is if k"},{"latex":"Ax + b \\text{ is in } K","symbols":"约束条件为向量
