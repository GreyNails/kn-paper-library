<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 9 大语言模型中的强化学习（RL for LLMs）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 9 大语言模型中的强化学习（RL for LLMs） · 生成中：以下仅为已完成部分</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v036","title":"Lecture 9 大语言模型中的强化学习（RL for LLMs）","course":"强化学习","pages":[{"title":"强化学习在大语言模型中的应用","segments":[{"id":0,"text":"Today, I'm going to cover primarily preference optimization, and I think Aviral is going to cover some things related to reasoning. So let's get started.","start":5.23,"end":14.93},{"id":1,"text":"I guess like the one clear trend in the last five to ten years has been that we've been like building larger and larger models and we've been putting far more compute into them. This is like a very consistent trend. And if you're familiar with or if you have like some people are even making predictions about like AGI 2027 and they are like predicting that we're going to keep putting more and more floating point operations into these models.","start":19.63,"end":46.47},{"id":2,"text":"But the question today we're going to try to answer is, how do we get from these large language models, which are pre-trained to predict text, and get these really nice chatbots that some of them you might have used?","start":48.81,"end":61.71},{"id":3,"text":"So I'm going to very briefly talk about, this is not an NLP course and you should probably take one if you're interested in learning more about pre-training. It's a very, very deep topic. But I'm going to quickly touch upon what we learn in pre-training and why that doesn't necessarily translate into the kind of chatbots we use. So in pre-training large language models, they are trained on this gigantic corpus of internet texts.","start":62.63,"end":89.69},{"id":4,"text":"And the way they're trained is roughly predicting what the next word or the next token in the sentence is going to be. So, for example, if you have a sentence, Stanford University is located in blank California. So like the model will learn to predict what this text is. And you can imagine that you're learning to predict this text. You're learning a lot of facts. You're learning a lot of trivia. But you're also starting to learn something about the syntax of how language operates.","start":90.15,"end":119.15},{"id":5,"text":"And we can look at many different examples here. Iroh went to the kitchen to make some tea. Standing next to Iroh, Zuko pondered his destiny. Zuko left the... So yeah, like the model will learn to predict the next token, which implicitly requires it to know some facts, know syntax, and also maybe even reason about what word should come next. While this may like predicting next token, you learn language, but...","start":120.13,"end":144.54},{"id":6,"text":"Predicting next token ends up learning a lot more. And there's some evidence that it ends up learning some notion of how the world operates. So this is a very nice example where we ask the model to predict the next set of tokens. And here the example is PadWatch is a demonstration of a bowling ball and a leaf being dropped at the same time in a vacuum chamber.","start":145.62,"end":167.46}],"notes":["本段主要讨论大语言模型在预训练过程中如何通过预测下一个词来学习语言的语法和一些事实知识。讲者提到，虽然模型的主要任务是预测下一个词，但这一过程也隐含了对语言结构和世界运作方式的理解。","讲者通过举例说明模型如何通过预测下一个词来学习语言，例如通过句子中的上下文来推断下一个词。这表明模型不仅学习语言的语法，还可能具备一定的推理能力。","讲者提到，预测下一个词的学习过程可能使模型获得对世界运作方式的一些理解。这表明预训练过程不仅仅是学习语言，还可能涉及更深层次的知识获取。","讲者举了PadWatch的例子，说明模型可以预测下一个词组，这表明模型能够处理更复杂的语言任务，如理解物理现象。","讲者强调，虽然预训练模型主要学习语言，但其学习过程可能涉及更广泛的知识，如事实、语法和推理能力，这为后续的强化学习应用奠定了基础。","讲者指出，预训练模型的学习过程可能隐含了对世界运作方式的理解，这为后续的强化学习任务提供了潜在的基础，但需要进一步探索如何将这些能力转化为实际应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":167.46,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.23,"text":"Today, I'm going to cover primarily preference optimization, and I think Aviral is going to cover some things related to reasoning. So let's get started."},{"start":19.63,"text":"I guess like the one clear trend in the last five to ten years has been that we've been like building larger and larger models and we've been putting far more compute into them. This is like a very consistent trend. And if you're familiar with or if you have like some people are even making predictions about like AGI 2027 and they are like predicting that we're going to keep putting more and more floating point operations into these models."},{"start":48.81,"text":"But the question today we're going to try to answer is, how do we get from these large language models, which are pre-trained to predict text, and get these really nice chatbots that some of them you might have used?"},{"start":62.63,"text":"So I'm going to very briefly talk about, this is not an NLP course and you should probably take one if you're interested in learning more about pre-training. It's a very, very deep topic. But I'm going to quickly touch upon what we learn in pre-training and why that doesn't necessarily translate into the kind of chatbots we use. So in pre-training large language models, they are trained on this gigantic corpus of internet texts."},{"start":90.15,"text":"And the way they're trained is roughly predicting what the next word or the next token in the sentence is going to be. So, for example, if you have a sentence, Stanford University is located in blank California. So like the model will learn to predict what this text is. And you can imagine that you're learning to predict this text. You're learning a lot of facts. You're learning a lot of trivia. But you're also starting to learn something about the syntax of how language operates."},{"start":120.13,"text":"And we can look at many different examples here. Iroh went to the kitchen to make some tea. Standing next to Iroh, Zuko pondered his destiny. Zuko left the... So yeah, like the model will learn to predict the next token, which implicitly requires it to know some facts, know syntax, and also maybe even reason about what word should come next. While this may like predicting next token, you learn language, but..."},{"start":145.62,"text":"Predicting next token ends up learning a lot more. And there's some evidence that it ends up learning some notion of how the world operates. So this is a very nice example where we ask the model to predict the next set of tokens. And here the example is PadWatch is a demonstration of a bowling ball and a leaf being dropped at the same time in a vacuum chamber."}],"speech_gaps":[],"frame":"../frames/v036/001.webp","frame_time":17.23},{"title":"强化学习在大语言模型中的应用","segments":[{"id":7,"text":"Pat, who is a physicist, predicts that. And now the model is asked to predict the next set of tokens or the next set of words here. And to predict these next set of words, you implicitly have to understand what the text was. And in some way, you have to understand how the world operates as well to be able to answer. And it's very interesting. If you change the prompt, you'll get a different behavior out of the model as well.","start":168.58,"end":191.48},{"id":8,"text":"The point here being that language models don't just learn syntax, don't just learn words, but they learn a lot more about how the world operates as well. And similarly, we can ask them to do math questions. We can ask them to generate code. We can ask them to have fairly reasonable medical understanding as well. And more importantly, we can start transforming these models into assistants now.","start":191.95,"end":216.79},{"id":9,"text":"So the question now we'll get back to is like, okay, pre-training gave us all that. So how do we actually make this into assistance? So today's lecture, we'll try to cover roughly two or three kinds of techniques to do so. First is instruction fine-tuning. Second is RLHF. And third is DPO. And then we'll talk about some limitations about what is missing, where are we going wrong, and so on. All right.","start":219.61,"end":248.11},{"id":10,"text":"So the first thing to understand is when we pre-train models, we're modeling language. And yes, that learns more than language. It learns something about the world, but that's still not equivalent to assisting users. So this is an example from GPT-3 where the prompt says, explain the moon landing to a six-year-old in a few sentences. And the model completes it with what it thinks should be the next set of tokens. According to the distribution of text, it has seen...","start":248.78,"end":275.0},{"id":11,"text":"corpus. So it starts off, explain the theory of gravity to a six-year-old, explain the theory of relativity to a six-year-old in a few sentences. And this isn't like, this is not what I expect my assistant to do. It's just a language model predicting the next token. What we do want it to do is actually give an explanation or a story where it like, giant rocket ship blasted off the earth carrying astronauts to the moon. So some kind of an explanation, which was the original intent of the question and not just the text it has seen on the internet.","start":275.34,"end":306.22},{"id":12,"text":"And that's where the discrepancy arises between language modeling and assisting users. The first set of techniques that were developed for this was fine tuning. And we're going to talk a little bit about this. So the general paradigm, even to this date, has been to first pre-train a language model on a large corpus of text and then fine tune for a specific task.","start":306.77,"end":329.91}],"notes":["本段讨论了预训练语言模型在理解世界和协助用户之间的差距。预训练模型虽然能学习语言和世界知识，但其本质仍是语言建模，无法直接作为助手。以GPT-3为例，当用户要求解释登月时，模型只是根据文本分布预测下一个词，而非提供符合用户意图的解释。","讲者指出，语言模型的输出可能与用户的真实需求不符。例如，当用户要求解释登月时，模型可能只是重复已有的文本，而不是提供一个符合用户期望的解释，如火箭发射等具体场景。","讲者强调，语言建模和实际协助用户之间存在显著差异。语言模型的输出是基于文本分布的预测，而用户期望的是有意义的解释或故事，这需要模型具备更深层次的理解能力。","讲者提到，为解决这一问题，需要引入特定的训练方法，如指令微调（instruction fine-tuning）、强化学习人类反馈（RLHF）和直接偏好优化（DPO）。这些方法旨在将语言模型转化为有效的助手。","讲者指出，当前的训练范式是先在大规模文本语料上预训练语言模型，再针对特定任务进行微调。这种方法虽然有效，但仍有局限性，需要进一步探索。","讲者最后提到，当前的研究重点是探索如何将语言模型转化为真正的助手，包括改进训练方法、解决模型理解不足的问题，以及探索新的技术路径。"],"formulas":[],"uncertainties":[],"diagram":"none","start":168.58,"end":329.91,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":168.58,"text":"Pat, who is a physicist, predicts that. And now the model is asked to predict the next set of tokens or the next set of words here. And to predict these next set of words, you implicitly have to understand what the text was. And in some way, you have to understand how the world operates as well to be able to answer. And it's very interesting. If you change the prompt, you'll get a different behavior out of the model as well."},{"start":191.95,"text":"The point here being that language models don't just learn syntax, don't just learn words, but they learn a lot more about how the world operates as well. And similarly, we can ask them to do math questions. We can ask them to generate code. We can ask them to have fairly reasonable medical understanding as well. And more importantly, we can start transforming these models into assistants now."},{"start":219.61,"text":"So the question now we'll get back to is like, okay, pre-training gave us all that. So how do we actually make this into assistance? So today's lecture, we'll try to cover roughly two or three kinds of techniques to do so. First is instruction fine-tuning. Second is RLHF. And third is DPO. And then we'll talk about some limitations about what is missing, where are we going wrong, and so on. All right."},{"start":248.78,"text":"So the first thing to understand is when we pre-train models, we're modeling language. And yes, that learns more than language. It learns something about the world, but that's still not equivalent to assisting users. So this is an example from GPT-3 where the prompt says, explain the moon landing to a six-year-old in a few sentences. And the model completes it with what it thinks should be the next set of tokens. According to the distribution of text, it has seen..."},{"start":275.34,"text":"corpus. So it starts off, explain the theory of gravity to a six-year-old, explain the theory of relativity to a six-year-old in a few sentences. And this isn't like, this is not what I expect my assistant to do. It's just a language model predicting the next token. What we do want it to do is actually give an explanation or a story where it like, giant rocket ship blasted off the earth carrying astronauts to the moon. So some kind of an explanation, which was the original intent of the question and not just the text it has seen on the internet."},{"start":306.77,"text":"And that's where the discrepancy arises between language modeling and assisting users. The first set of techniques that were developed for this was fine tuning. And we're going to talk a little bit about this. So the general paradigm, even to this date, has been to first pre-train a language model on a large corpus of text and then fine tune for a specific task."}],"speech_gaps":[],"frame":"../frames/v036/002.webp","frame_time":180.58},{"title":"强化学习在大语言模型中的应用","segments":[{"id":13,"text":"How does fine tuning work? You collect a set of inputs and you have some target outputs and then you improve the log likelihood of these target outputs. So in this step two, you have this input, which was the movie was something, something. And then you have some target output, which is good or bad. And the model learns to predict whether the output was good or bad.","start":331.48,"end":355.5},{"id":14,"text":"And that's really the main difference between fine tuning and pre-training. As we realize, like, I mean, these pre-training models are good for many more things. We started scaling up the number of tasks we can fine tune on. So the previous example was maybe something like sentiment prediction. But really, these models can be fine tuned for many, many different tasks at the same time.","start":355.93,"end":380.74},{"id":15,"text":"Broadly, this can be seen as collecting a set of instruction and output pairs. So, for example, if the instruction is, please answer the following question, what is the boiling point of nitrogen? We'll have some answer like minus 320.4. And we want to be able to predict this answer conditioned on the input. And once we collect a corpus of such instruction output pairs, we can then evaluate them on many, many unseen tasks.","start":384.86,"end":411.28},{"id":16,"text":"Can Jeffrey Hinton have a conversation with George Washington? Give the rationale before answering. And the model will produce a reasonable output here. So what if we fine-tune different scale language models on the same kind of corpus? So one thing that was observed in a lot of prior work is that as you increase the model parameter size,","start":412.39,"end":438.14},{"id":17,"text":"they actually start generalizing a lot better. So even taking a very small corpus of such instruction output data sets, you start seeing a lot more generalization. So to explain the table a little bit, the Big Bench and MLU are like question-answer pairs of the kind you just saw in the previous slide.","start":438.63,"end":457.29},{"id":18,"text":"One thing to note here is that the bigger the parameters or larger the model is, the larger the gain is after instruction fine-tuning. So what this suggests to us is that the models start responding and generalizing to questions even with very small corpus of data as well. So to give an example of what the models look before and after instruction fine-tuning.","start":458.95,"end":485.31}],"notes":["本段主要讨论了在大语言模型中进行指令微调（instruction fine-tuning）的过程，强调了微调与预训练之间的主要区别。微调是通过收集输入和目标输出对，使模型能够根据输入预测目标输出，而预训练模型则用于更广泛的任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":331.48,"end":485.31,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":331.48,"text":"How does fine tuning work? You collect a set of inputs and you have some target outputs and then you improve the log likelihood of these target outputs. So in this step two, you have this input, which was the movie was something, something. And then you have some target output, which is good or bad. And the model learns to predict whether the output was good or bad."},{"start":355.93,"text":"And that's really the main difference between fine tuning and pre-training. As we realize, like, I mean, these pre-training models are good for many more things. We started scaling up the number of tasks we can fine tune on. So the previous example was maybe something like sentiment prediction. But really, these models can be fine tuned for many, many different tasks at the same time."},{"start":384.86,"text":"Broadly, this can be seen as collecting a set of instruction and output pairs. So, for example, if the instruction is, please answer the following question, what is the boiling point of nitrogen? We'll have some answer like minus 320.4. And we want to be able to predict this answer conditioned on the input. And once we collect a corpus of such instruction output pairs, we can then evaluate them on many, many unseen tasks."},{"start":412.39,"text":"Can Jeffrey Hinton have a conversation with George Washington? Give the rationale before answering. And the model will produce a reasonable output here. So what if we fine-tune different scale language models on the same kind of corpus? So one thing that was observed in a lot of prior work is that as you increase the model parameter size,"},{"start":438.63,"text":"they actually start generalizing a lot better. So even taking a very small corpus of such instruction output data sets, you start seeing a lot more generalization. So to explain the table a little bit, the Big Bench and MLU are like question-answer pairs of the kind you just saw in the previous slide."},{"start":458.95,"text":"One thing to note here is that the bigger the parameters or larger the model is, the larger the gain is after instruction fine-tuning. So what this suggests to us is that the models start responding and generalizing to questions even with very small corpus of data as well. So to give an example of what the models look before and after instruction fine-tuning."}],"speech_gaps":[],"frame":"../frames/v036/003.webp","frame_time":343.48}],"complete":false,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}
function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
