"text":"So the question is, are there intelligent ways to choose prompts such that we get preferences over things that the model is bad at? That's a great question. Yeah, so there are works which try to look into it. This touches upon active exploration. You want to get preference signal explicitly where the model is confused, right?","start":2105.13,"end":2128.49},{"id":92,"text":"I think there's things which touch upon, like, we want to maximize information gain such that the model will learn the best.","start":2130.37,"end":2136.73},{"id":93,"text":"Is there a well-established standard?","start":2138.13,"end":2140.55},{"id":94,"text":"I don't think so, but this is, like, a good problem to look into.","start":2140.77,"end":2143.29},{"id":95,"text":"Okay, I will start with direct preference optimization next.","start":2144.25,"end":2147.35}],"notes":["本段讨论了人类偏好学习中的非传递性问题，即人类偏好可能不满足传递性，例如A优于B，B优于C，但C又优于A。这种非传递性在实际数据中很常见，且偏好数据通常带有大量噪声。这表明传统的二分类任务（如偏好学习）可能不足以准确捕捉人类的复杂偏好。","讲者指出，尽管偏好学习通常可以达到90%或95%的准确率，但语言模型和奖励模型的准确率通常只有65%到70%，这表明当前的模型在捕捉人类偏好方面仍有很大提升空间。","讲者提到，即使准确率不高，仍然可以带来显著的性能提升。这表明，即使在不完全准确的情况下，模型仍能通过优化策略获得改进。","讲者进一步讨论了如何使模型在非传递性偏好下进行优化，指出这与强化学习中的策略梯度有关，但并不需要将奖励函数直接微分。这表明，强化学习的梯度估计可以独立于奖励函数的微分。","讲者提到KL散度的性质，即其总是大于或等于0，并建议学生自行证明这一性质。这表明KL散度在优化过程中作为正则化项的作用。","最后，讲者提出了一些关于如何选择提示以获取模型在弱项上的偏好信号的问题，并提到这涉及主动探索和最大化信息增益，以帮助模型更好地学习。"],"formulas":[],"uncertainties":["P theta RL is less than P theta PD"],"diagram":"none","start":1968.59,"end":2147.35,"asr_flags":[],"math_clarifications":["原文中提到KL散度总是大于或等于0，但未提供数学证明或公式推导，且未明确指出其数学性质或适用条件，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1968.59,"text":"The question is, are there models for human preferences which are not just binary and account for fuzzy? I think this is a very hard question which goes into... So it is known that human preferences can often be intransitive. So what do I mean by that? Let's say we prefer A over B, then we prefer B over C, and then we prefer C over A."},{"start":1995.24,"text":"this doesn't make any sense. Because ideally, if you prefer A over B and B over C, you should prefer A over C. But we get lots of scenarios where humans prefer A over C as well. And you will, unfortunately, observe some noise in the data like that where the preferences... In fact, the preferences we observe in real life are very, very noisy."},{"start":2019.2,"text":"And I don't think we have a great solution for this. To even ground this, preference learning is a binary classification task. We're just trying to predict which sample is winning. So it's a binary classification task. Most binary classifications, you can reach an accuracy of 90%, 95%. But for most of our language model and reward models, we reach an accuracy of 65% to 70%. So we're barely doing better than chance."},{"start":2046.66,"text":"But even that is still enough to give us pretty large improvements in performance. The question is, what changed to make this differentiable? We did not make anything differentiable. That's the reason why we started doing RL, is to be able to take the policy gradient. This estimator, this does not require us to be able to... So that just requires the gradient to be with the log probabilities of the model."},{"start":2075.4,"text":"It does not backpropagate into the reward at all. So the question is, what if the P theta RL is less than P theta PD? And wouldn't that encourage the model to go in those directions? It's good to know. So the expectation is broken down here into more explicitly. But it's good to know a property about KL divergence that is always greater than or equal to 0. I'll leave that as an exercise for you to prove that. So the penalty is always positive."},{"start":2105.13,"text":"So the question is, are there intelligent ways to choose prompts such that we get preferences over things that the model is bad at? That's a great question. Yeah, so there are works which try to look into it. This touches upon active exploration. You want to get preference signal explicitly where the model is confused, right?"},{"start":2130.37,"text":"I think there's things which touch upon, like, we want to maximize information gain such that the model will learn the best."},{"start":2138.13,"text":"Is there a well-established standard?"},{"start":2140.77,"text":"I don't think so, but this is, like, a good problem to look into."},{"start":2144.25,"text":"Okay, I will start with direct preference optimization next."}],"speech_gaps":[],"frame":"../frames/v036/013.webp","frame_time":1980.59},{"title":"直接偏好优化（Direct Preference Optimization）","segments":[{"id":96,"text":"So, there will be a little bit more math, but it's very fun.","start":2147.53,"end":2151.41},{"id":97,"text":"So, we're going to talk a little bit about direct preference optimization.","start":2153.15,"end":2155.91},{"id":98,"text":"optimization. So the RLHF pipeline I described, some of you might find it complex or some of you","start":2155.91,"end":2163.21},{"id":99,"text":"might find it easy. But in practice, when we try to do this at very large scale models,","start":2163.21,"end":2167.45},{"id":100,"text":"it can be quite expensive. So let's say you're like training a hundred billion parameter model,","start":2167.69,"end":2176.07},{"id":101,"text":"maybe a trillion parameter model. You have to sample every answer and then query a reward model.","start":2176.91,"end":2183.55},{"id":102,"text":"and depending on the RL algorithm you use um you you have to compute like value functions and like","start":2183.55,"end":2193.23},{"id":103,"text":"other things just to optimize the model and you don't have to understand this figure i put it","start":2193.23,"end":2199.67},{"id":104,"text":"specifically to scare you guys um so here like there's just like a whole flow of things that","start":2199.67,"end":2206.49},{"id":105,"text":"in practice can be fairly hard to get right and the more parameters you have in the system the","start":2206.49,"end":2211.95},{"id":106,"text":"the harder it is to get it right.","start":2211.95,"end":2213.09},{"id":107,"text":"So RLHF can be pretty complex.","start":2214.89,"end":2216.71},{"id":108,"text":"So when we were looking into diet preference optimization,","start":2218.69,"end":2221.63},{"id":109,"text":"our goal was to, like, can we make this a lot simpler?","start":2221.89,"end":2224.37},{"id":110,"text":"And yeah, as I said, they have some initial pipeline","start":2226.63,"end":2231.15},{"id":111,"text":"which we fit in RMV, like, take an instruction-tuned model","start":2231.15,"end":2235.57},{"id":112,"text":"and produce a final RLHF model.","start":2235.57,"end":2237.13},{"id":113,"text":"But if you look at the whole process,","start":2238.45,"end":2240.73},{"id":114,"text":"like we have a language model","start":2240.73,"end":2242.51},{"id":115,"text":"and we're collecting some preferences","start":2242.51,"end":2243.65},{"id":116,"text":"Why can we just not directly train on the preference data and directly optimize the parameter models? Why do we have to learn this intermediate quantity, like a reward model? And why can't we just directly go from preferences and optimize our language model? So that's really why it's called direct preference optimization, is that we find a way to go from preferences to optimizing the language model. And the way we do it is that at a very high level,","start":2244.49,"end":2272.53},{"id":117,"text":"We want to be able to write the reward model in terms of our language model itself. Why do we want to do that? Because we fit our reward model to the preference data through a fairly simple classification loss, the Bradley-Terry loss we discussed. If we can just connect the reward model and the language model, instead of having a separate process, we can just take the language model parameters and fit it through the loss directly.","start":2272.94,"end":2299.24},{"id":118,"text":"And that's really the high-level motivation for direct preference optimization. So this part of the math gets a little bit slightly intense, so I'll go through this slowly. So we discussed the scale-constrained RL objective in the last few slides, where we want to maximize the expected reward.","start":2299.9,"end":2325.26}],"notes":["本段讲解了强化学习在大规模语言模型训练中的复杂性，指出传统RLHF流程在实际应用中可能非常昂贵，尤其是在训练参数量巨大的模型时，需要进行大量采样和计算，如价值函数等，这使得流程难以正确实现。","讲者提到直接偏好优化（Direct Preference Optimization）的目标是简化这一流程，通过直接使用偏好数据来训练语言模型，而不是通过中间的奖励模型。","讲者解释了为什么需要奖励模型，以及为何不能直接从偏好数据优化语言模型，强调了直接偏好优化的核心思想是将奖励模型与语言模型直接连接，从而简化流程。","讲者提到使用Bradley-Terry损失函数来拟合奖励模型，这是一种简单的分类损失，可以将奖励模型与语言模型直接连接，从而避免了中间步骤。","最后，讲者提到接下来将讨论一个与尺度约束的强化学习目标相关的数学部分，强调了最大化期望奖励的目标。"],"formulas":[],"uncertainties":["um you you have to compute like value functions and like","i put it specifically to scare you guys um so here like there's just like a whole flow of things that","the more parameters you have in the system the the harder it is to get it right."],"diagram":"none","start":2147.53,"end":2325.26,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2147.53,"text":"So, there will be a little bit more math, but it's very fun."},{"start":2153.15,"text":"So, we're going to talk a little bit about direct preference optimization."},{"start":2155.91,"text":"optimization. So the RLHF pipeline I described, some of you might find it complex or some of you"},{"start":2163.21,"text":"might find it easy. But in practice, when we try to do this at very large scale models,"},{"start":2167.69,"text":"it can be quite expensive. So let's say you're like training a hundred billion parameter model,"},{"start":2176.91,"text":"maybe a trillion parameter model. You have to sample every answer and then query a reward model."},{"start":2183.55,"text":"and depending on the rl algorithm you use um you you have to compute like value functions and like"},{"start":2193.23,"text":"other things just to optimize the model and you don't have to understand this figure i put it"},{"start":2199.67,"text":"specifically to scare you guys um so here like there's just like a whole flow of things that"},{"start":2206.49,"text":"in practice can be fairly hard to get right and the more parameters you have in the system the"},{"start":2211.95,"text":"the harder it is to get it right."},{"start":2214.89,"text":"So RLHF can be pretty complex."},{"start":2218.69,"text":"So when we were looking into diet preference optimization,"},{"start":2221.89,"text":"our goal was to, like, can we make this a lot simpler?"},{"start":2226.63,"text":"And yeah, as I said, they have some initial pipeline"},{"start":2231.15,"text":"which we fit in RMV, like, take an instruction-tuned model"},{"start":2235.57,"text":"and produce a final RLHF model."},{"start":2238.45,"text":"But if you look at the whole process,"},{"start":2240.73,"text":"like we have a language model"},{"start":2242.51,"text":"and we're collecting some preferences"},{"start":2244.49,"text":"Why can we just not directly train on the preference data and directly optimize the parameter models? Why do we have to learn this intermediate quantity, like a reward model? And why can't we just directly go from preferences and optimize our language model? So that's really why it's called direct preference optimization, is that we find a way to go from preferences to optimizing the language model. And the way we do it is that at a very high level,"},{"start":2272.94,"text":"We want to be able to write the reward model in terms of our language model itself. Why do we want to do that? Because we fit our reward model to the preference data through a fairly simple classification loss, the Bradley-Terry loss we discussed. If we can just connect the reward model and the language model, instead of having a separate process, we can just take the language model parameters and fit it through the loss directly."},{"start":2299.9,"text":"And that's really the high-level motivation for direct preference optimization. So this part of the math gets a little bit slightly intense, so I'll go through this slowly. So we discussed the scale-constrained RL objective in the last few slides, where we want to maximize the expected reward."}],"speech_gaps":[],"frame":"../frames/v036/014.webp","frame_time":2159.53},{"title":"强化学习在大语言模型中的应用","segments":[{"id":119,"text":"with some KL penalties such that the model should not drift away from the instruction fine-tuned model a lot. So this, again, the parameters we're going to optimize is P theta RL, P pre-trained, and RM are fixed. And for now, we can like, yeah, we're just assuming some kind of a reward model here. It turns out that this equation actually has a closed-form solution.","start":2326.28,"end":2348.12},{"id":120,"text":"And this is not possible if you're doing just the regular expected reward maximization. But once you add a KL constraint, it turns out that you can write out a closed form solution to this equation, which is really cool. It's rare to find such things. And the solution looks something like this. This is the optimal policy. P star, we're going to compute probabilities over y hat conditioned over x.","start":2349.97,"end":2373.49},{"id":121,"text":"Roughly, this optimal quantity says that we ignore the zx for now. We have our pre-trained model p pre-trained y hat given x. And we're going to multiply the log probabilities with the exponentiated reward. So very simply put, if a sentence has a higher reward, so if y hat has a higher reward,","start":2375.23,"end":2401.91},{"id":122,"text":"we're going to upweight the probabilities under the optimal distribution by an exponentiated reward by beta. High reward, high exponent, higher probability under the optimal policy. If the reward is low, it's going to be downweighted by exponential reward as well. And zx here is just a normalizing factor, which ensures that this quantity is a probability distribution. So really, you only need to focus on the numerator, and that's it.","start":2402.64,"end":2431.97},{"id":123,"text":"You'll have to take my word for that this is the optimal solution for the above equation. Maybe I can share something later on, like how to derive this. But yeah, cool. Now, this is like where the key observation comes in, is that because we have this optimal solution to the above equation, we can rewrite the reward model in terms of the optimal policy itself. So this lower equation is just like a rearrangement of the terms.","start":2432.88,"end":2462.21},{"id":124,"text":"The reward model can be written as beta log P star upon PPT. And we have some beta log ZX term, which is a constant over Y. So again, just to make sure this makes sense intuitively as well, if a completion Y hat should have a high score, it will typically have a high probability under P star as well.","start":2463.18,"end":2489.65}],"notes":["本段讲解了在强化学习中如何通过引入KL散度惩罚项来约束模型偏离指令微调模型的程度。讲者指出，这种约束使得原本无法求解的期望奖励最大化问题可以得到闭式解，这在强化学习中是较为罕见的。","讲者进一步解释了最优策略的计算方式，即在预训练模型的基础上，通过将对数概率乘以指数化的奖励来调整概率分布。高奖励的句子会被赋予更高的概率，而低奖励的句子则会被降低权重。zx是一个归一化因子，确保最终结果是一个概率分布。","讲者提到，最优策略的计算仅需关注分子部分，归一化因子不影响最终的概率分布。这简化了计算过程，使得模型可以更高效地进行优化。","讲者指出，奖励模型可以表示为β乘以最优策略与预训练模型的对数比值。其中β是一个控制奖励权重的参数，而zx项是一个与Y无关的常数项。","最后，讲者强调，如果一个完成的句子Y hat应该具有高得分，那么它通常也会在最优策略P star下具有较高的概率。这表明奖励模型和最优策略之间存在紧密的联系。","讲者提到，虽然当前没有详细推导过程，但后续可能会分享如何推导这一结果。这表明该公式是通过某种数学推导得到的，而不是直接假设的。"],"formulas":[{"latex":"P^*(\\hat{y} | x) = \\frac{\\exp(\\beta R(\\hat{y}, x)) P_{\\text{pre-trained}}(\\hat{y} | x)}{Z_x}","symbols":"P^*(\\hat{y} | x) 表示最优策略下的条件概率，R(\\hat{y}, x) 是奖励函数，β 是奖励的权重参数，Z_x 是归一化因子。","explanation":"公式正确，表示最优策略下的条件概率，通过指数奖励函数和预训练模型的条件概率的乘积，除以归一化因子 Z_x。","evidence":"Roughly, this optimal quantity says that we ignore the zx for now. We have our pre-trained model p pre-trained y hat given x. And we're going to multiply the log probabilities with the exponentiated reward. So very simply put, if a sentence has a higher reward, so if y hat has a higher reward, we're going to upweight the probabilities under the optimal distribution by an exponentiated reward by beta. High reward, high exponent, higher probability under the optimal policy. If the reward is low, it's going to be downweighted by exponential reward as well. And zx here is just a normalizing factor, which ensures that this quantity is a probability distribution. So really, you only need to focus on the numerator, and that's it."},{"latex":"R(\\hat{y}, x) = \\beta \\log \\frac{P^*(\\hat{y} | x)}{P_{\\text{pre-trained}}(\\hat{y} | x)}","symbols":"R(\\hat{y}, x) 是奖励函数，β 是奖励的权重参数，P^*(\\hat{y} | x) 是最优策略下的条件概率，P_{\\text{pre-trained}}(\\hat{y} | x) 是预训练模型的条件概率。","explanation":"公式正确，表示奖励函数 R(\\hat{y}, x) 与最优策略和预训练模型的条件概率之间的关系，通过 β 乘以对数比值。","evidence":"The reward model can be written as beta log P star upon PPT. And we have some beta log ZX term, which is a constant over Y. So again, just to make sure this makes sense intuitively as well, if a completion Y hat should have a high score, it will typically have a high probability under P star as well."}],"uncertainties":["PPT 可能是 P_pre-trained 的缩写，但需要确认是否为正确术语。","beta log ZX term 中的 ZX 是否为 Z_x 的缩写，需要进一步确认。"],"diagram":"none","start":2326.28,"end":2489.65,"asr_flags":[],"math_clarifications":["公式中的归一化因子 Z_x 应确保整个表达式是一个有效的概率分布，即所有条件概率之和为 1。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2326.28,"text":"with some KL penalties such that the model should not drift away from the instruction fine-tuned model a lot. So this, again, the parameters we're going to optimize is P theta RL, P pre-trained, and RM are fixed. And for now, we can like, yeah, we're just assuming some kind of a reward model here. It turns out that this equation actually has a closed-form solution."},{"start":2349.97,"text":"And this is not possible if you're doing just the regular expected reward maximization. But once you add a KL constraint, it turns out that you can write out a closed form solution to this equation, which is really cool. It's rare to find such things. And the solution looks something like this. This is the optimal policy. P star, we're going to compute probabilities over y hat conditioned over x."},{"start":2375.23,"text":"Roughly, this optimal quantity says that we ignore the zx for now. We have our pre-trained model p pre-trained y hat given x. And we're going to multiply the log probabilities with the exponentiated reward. So very simply put, if a sentence has a higher reward, so if y hat has a higher reward,"},{"start":2402.64,"text":"we're going to upweight the probabilities under the optimal distribution by an exponentiated reward by beta. High reward, high exponent, higher probability under the optimal policy. If the reward is low, it's going to be downweighted by exponential reward as well. And zx here is just a normalizing factor, which ensures that this quantity is a probability distribution. So really, you only need to focus on the numerator, and that's it."},{"start":2432.88,"text":"You'll have to take my word for that this is the optimal solution for the above equation. Maybe I can share something later on, like how to derive this. But yeah, cool. Now, this is like where the key observation comes in, is that because we have this optimal solution to the above equation, we can rewrite the reward model in terms of the optimal policy itself. So this lower equation is just like a rearrangement of the terms."},{"start":2463.18,"text":"The reward model can be written as beta log P star upon PPT. And we have some beta log ZX term, which is a constant over Y. So again, just to make sure this makes sense intuitively as well, if a completion Y hat should have a high score, it will typically have a high probability under P star as well."}],"speech_gaps":[],"frame":"../frames/v036/015.webp","frame_time":2338.28},{"title":"强化学习在大语言模型中的应用","segments":[{"id":125,"text":"And PPT is something that's fixed. So beta log will be high whenever the reward model gives a high score. And similarly, like if a reward model assigns a poor score to Y hat, our optimal policy will typically assign a low probability to Y hat. And typically the beta log P star by PT will also be low. So the relationship sort of makes sense and we can ignore ZX for now. Cool.","start":2490.66,"end":2520.29},{"id":126,"text":"The main argument here is that this isn't just true for the optimal policy. You can always plug in some reward model p theta, and it will be optimal for some kind of reward model. And that's really like the observation you make here. And yeah, so we've just replaced p star with some kind of a learnable policy, given that our parameters theta represent the optimal policy for some kind of a reward model.","start":2522.13,"end":2551.67},{"id":127,"text":"And after that, it's simple. Given the relationship we have derived so far, we know this is how we fit our reward model through the Bradley-Terry laws. We want to make sure that the reward for the winning completion is higher than the reward for the losing completion. And so far, I've been asking you to ignore the partition function, but that was for a reason. The reason is that because the objective only optimizes for the difference between the rewards,","start":2552.65,"end":2583.07},{"id":128,"text":"the partition function zx just simply cancels out. So maybe I can write this out on the board. We started with the relation rm theta x comma y w and we had beta log p theta y w given x where y w is the winning completion and p","start":2583.6,"end":2613.61},{"id":129,"text":"p, d, y, w, given x. So this is the relation we used with beta log zx. And we're going to rewrite the same thing for the losing completion as well. So x, y, l, beta log p of theta, which is the current parameters we're optimizing, y, l is our losing completion, conditioned on the input x, divided by the log probabilities under the pre-trained model.","start":2614.86,"end":2652.55}],"notes":["本段讨论了强化学习在大语言模型中的应用，特别是如何通过奖励模型和最优策略之间的关系来调整模型行为。讲者提到，当奖励模型给出高分时，β log 会较高，而当奖励模型给出低分时，最优策略会赋予低概率。这表明奖励模型的评分直接影响策略的输出概率。","讲者进一步指出，这种关系不仅适用于最优策略，还可以通过任意奖励模型来实现。这意味着，只要给定一个奖励模型，就可以找到一个最优策略，这为模型的训练和优化提供了理论基础。","接下来，讲者提到如何通过 Bradley-Terry 法则来拟合奖励模型，确保胜利完成的奖励高于失败完成的奖励。同时，讲者指出，由于目标仅优化奖励之间的差异，因此分区函数可以忽略，因为它在计算中会自动抵消。","讲者提到，他们将从关系 rm(theta, x, y_w) 开始，其中 y_w 是胜利完成，p(theta, y_w | x) 是给定输入 x 时的条件概率。然后，他们将为失败完成重新写出相同的关系，即 x, y_l, beta log p(theta, y_l | x) 除以预训练模型下的对数概率。","这些内容展示了如何通过奖励模型和策略之间的相互作用来优化大语言模型的行为，特别是在生成文本时如何确保生成的文本符合预期的奖励标准。"],"formulas":[{"latex":"\\frac{\\beta \\log P(\\theta, y_l | x)}{\\log P_{\\text{pretrained}}(y_l | x)}","symbols":"β log P(θ, y_l | x) / log P_pretrained(y_l | x)","explanation":"该公式在上下文中被提及，且其结构符合概率比的表达方式，因此保留。","evidence":"p, d, y, w, given x. So this is the relation we used with beta log zx. And we're going to rewrite the same thing for the losing completion as well. So x, y, l, beta log p of theta, which is the current parameters we're optimizing, y, l is our losing completion, conditioned on the input x, divided by the log probabilities under the pre-trained model."}],"uncertainties":["rm(theta, x, y_w) 的具体定义和形式未明确，可能涉及奖励模型的参数化方式。","P(theta, y_w | x) 的具体形式和计算方式未明确，可能涉及策略的参数化方式。","log P_pretrained(y_l | x) 的具体形式和计算方式未明确，可能涉及预训练模型的对数概率计算方式。"],"diagram":"none","start":2490.66,"end":2652.55,"asr_flags":[],"math_clarifications":["P* 未被定义，且 β log P* 无法与上下文中的其他公式建立明确的数学关系，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2490.66,"text":"And PPT is something that's fixed. So beta log will be high whenever the reward model gives a high score. And similarly, like if a reward model assigns a poor score to Y hat, our optimal policy will typically assign a low probability to Y hat. And typically the beta log P star by PT will also be low. So the relationship sort of makes sense and we can ignore ZX for now. Cool."},{"start":2522.13,"text":"The main argument here is that this isn't just true for the optimal policy. You can always plug in s . It's not something we can...","start":2653.11,"end":2684.89},{"id":131,"text":"compute for real. So we get this relation that you can see over here. The difference between the reward models is simply the difference between the beta log ratios. So taking this identity, which we have just derived, we simply plug it into the original Bradley-Terry loss and we get something super nice.","start":2685.28,"end":2712.32},{"id":132,"text":"is that we'll have a dataset of, again, input, winning output, losing output, and we're going to optimize this objective directly for the language model parameters. And this is a classification objective, by the way. So we're not doing any RL loop anymore. We are going directly from the preference dataset and optimizing the language parameter models themselves.","start":2712.97,"end":2738.09},{"id":133,"text":"Yes. So initially, they'll be the same, but the gradient would only back-propagate through the p-thetas.","start":2739.11,"end":2746.31},{"id":134,"text":"PPD will remain the same throughout, and it will increase the probability of the winning completion and decrease the probability of the losing completion.","start":2746.91,"end":2756.07},{"id":135,"text":"So let's spend a little bit of time here again.","start":2756.97,"end":2760.13},{"id":136,"text":"gain. This objective will try to encourage the RM theta for the winning completion to go up","start":2760.13,"end":2766.67},{"id":137,"text":"and RM theta for the losing completion to go down. But the way to increase RM theta is to increase","start":2766.67,"end":2773.65},{"id":138,"text":"the probability of YW under the current model and decrease the probability of the losing one","start":2773.65,"end":2780.23},{"id":139,"text":"under the current model. It's a very intuitive objective, right? Like good thing go up, bad thing","start":2780.23,"end":2784.91},{"id":140,"text":"go down and finally you can do it without RL or like any like complexity so the question is can","start":2784.91,"end":2791.91},{"id":141,"text":"we do something like distillation without instead of this the question is like so for the reward","start":2791.91,"end":2801.31},{"id":142,"text":"model like you first have to get a reward model somehow right no one's there's no like easy way","start":2801.31,"end":2807.63},{"id":143,"text":"to get it so you have to collect some kind of preference data to even begin with to get a reward","start":2807.63,"end":2812.85},{"id":144,"text":"model and that's where dpo comes in is that like if you have collected a preference data instead","start":2812.85,"end":2818.29},{"id":145,"text":"of fitting an explicit reward model you can optimize your language model parameters directly","start":2818.29,"end":2822.29},{"id":146,"text":"yeah so the question is like there's a penalty for pre-trained model with not drifting too far from","start":2824.21,"end":2829.69}],"notes":["本段讲解了在强化学习中如何利用奖励模型进行优化，通过比较奖励模型的差异，可以简化计算。输入文本相同，因此在计算时可以相互抵消，从而避免计算难以处理的zx项。这种简化使得优化过程更加高效。","讲者提到，通过将推导出的等式代入原始的Bradley-Terry损失函数，可以得到一个非常简洁的优化目标。这表明，通过数学推导可以简化复杂的优化过程。","讲者指出，优化目标是一个分类任务，直接从偏好数据集优化语言模型参数，而不再需要进行强化学习循环。这表明，这种方法可以避免复杂的强化学习过程。","讲者提到，梯度仅通过p-theta传播，这表明在优化过程中，模型参数的更新仅依赖于特定部分的梯度，而不是整个模型。","讲者强调，PPD（概率分布）在整个过程中保持不变，但会增加获胜完成的概率，降低失败完成的概率。这表明，优化目标是通过调整概率分布来实现的。","讲者提到，可以通过收集偏好数据来构建奖励模型，而无需显式地拟合奖励模型。这表明，DPO（Direct Preference Optimization）方法可以替代传统的奖励模型构建过程。"],"formulas":[],"uncertainties":["beta log zx","RM theta","YW"],"diagram":"none","start":2653.11,"end":2829.69,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2653.11,"text":"y, l, condition of x, and beta log zx. Now notice that the reward model is like, the input is the same to the reward model. So we're using the same text, and we're summarizing the same text, so the input is actually the same. So when we're going to subtract this, we're going to subtract these and this, and this is just simply going to cancel out. The reason why canceling out of this is important is that zx is actually intractable to compute. It's not something we can..."},{"start":2685.28,"text":"compute for real. So we get this relation that you can see over here. The difference between the reward models is simply the difference between the beta log ratios. So taking this identity, which we have just derived, we simply plug it into the original Bradley-Terry loss and we get something super nice."},{"start":2712.97,"text":"is that we'll have a dataset of, again, input, winning output, losing output, and we're going to optimize this objective directly for the language model parameters. And this is a classification objective, by the way. So we're not doing any RL loop anymore. We are going directly from the preference dataset and optimizing the language parameter models themselves."},{"start":2739.11,"text":"Yes. So initially, they'll be the same, but the gradient would only back-propagate through the p-thetas."},{"start":2746.91,"text":"PPD will remain the same throughout, and it will increase the probability of the winning completion and decrease the probability of the losing completion."},{"start":2756.97,"text":"So let's spend a little bit of time here again."},{"start":2760.13,"text":"gain. This objective will try to encourage the RM theta for the winning completion to go up"},{"start":2766.67,"text":"and RM theta for the losing completion to go down. But the way to increase RM theta is to increase"},{"start":2773.65,"text":"the probability of YW under the current model and decrease the probability of the losing one"},{"start":2780.23,"text":"under the current model. It's a very intuitive objective, right? Like good thing go up, bad thing"},{"start":2784.91,"text":"go down and finally you can do it without RL or like any like complexity so the question is can"},{"start":2791.91,"text":"we do something like distillation without instead of this the question is like so for the reward"},{"start":2801.31,"text":"model like you first have to get a reward model somehow right no one's there's no like easy way"},{"start":2807.63,"text":"to get it so you have to collect some kind of preference data to even begin with to get a reward"},{"start":2812.85,"text":"model and that's where dpo comes in is that like if you have collected a preference data instead"},{"start":2818.29,"text":"of fitting an explicit reward model you can optimize your language model parameters directly"},{"start":2824.21,"text":"yeah so the question is like there's a penalty for pre-trained model with not drifting too far from"}],"speech_gaps":[],"frame":"../frames/v036/017.webp","frame_time":2665.11},{"title":"强化学习在大语言模型中的应用","segments":[{"id":147,"text":"the pre-trained model actually does this, so this is a good question, so","start":2829.69,"end":2834.35},{"id":148,"text":"our loss function is set up as a log sigmoid, so one property with the sigmoid is that the gradients","start":2835.07,"end":2840.55},{"id":149,"text":"vanish when the difference becomes","start":2840.55,"end":2842.73},{"id":150,"text":"is already sufficiently large","start":2842.73,"end":2844.63},{"id":151,"text":"and the difference becomes sufficiently large","start":2844.63,"end":2846.93},{"id":152,"text":"like faster than the","start":2846.93,"end":2847.91},{"id":153,"text":"so the beta parameter actually","start":2847.91,"end":2850.59},{"id":154,"text":"controls how quickly the difference","start":2850.59,"end":2852.53},{"id":155,"text":"becomes large","start":2852.53,"end":2853.09},{"id":156,"text":"So if you have a very high beta, even a small discrepancy would suddenly saturate the sigmoid and it would not change the parameters a lot. The question is, is the main advantage of DPO that you don't have to train a reward model? The way I would say it is that you are training a reward model because you're using the same objective.","start":2854.31,"end":2875.87},{"id":157,"text":"The DPO provides a connection between the reward model and the corresponding optimal policy for it. So you don't have to do an explicit RL loop to go from the reward model to an optimal policy for it. We have cleverly parameterized the reward model in terms of the language model itself. So when you fit a reward model to the preference data, you are optimizing the language model itself.","start":2876.73,"end":2903.63},{"id":158,"text":"So the question is, do we still need to do RLHF or not, given this is cheaper? I think it depends a lot on situation. I think there's still some purported benefits to RLHF because you can expect some kind of generalization from the reward model, which allows you to grade generations which might not have been seen in preference data.","start":2904.68,"end":2929.34},{"id":159,"text":"So there's still some benefit to it. So it depends upon your budget and what you want to achieve. So the question I get is that the KL divergence, why are we relying on the sigmoid when initially the KL divergence was not related to the sigmoid? To be more clear or precise, I think it's the beta term, which controls how fast, how much you're allowed to drift away. And even in the original RL objective,","start":2930.37,"end":2960.15},{"id":160,"text":"this beta term is what controls the divergence between, allow divergence between our current model and the pre-trained model. So if the beta is really high, you are not allowed to diverge at all because you'll be penalized a lot more. Yes. So like the beta controls the strength or the weight on this divergence.","start":2961.66,"end":2983.68}],"notes":["本段讨论了DPO（Direct Preference Optimization）方法，强调其不需要显式训练奖励模型，而是通过参数化奖励模型来优化语言模型本身。同时，讲者提到DPO通过β参数控制模型与预训练模型之间的差异，β值越高，允许的差异越小，从而影响梯度消失的问题。","讲者进一步解释了β参数的作用，指出它控制了模型与预训练模型之间的发散程度。当β值很高时，模型不能偏离预训练模型太多，否则会受到较大的惩罚。这与使用sigmoid函数时的梯度消失现象相关，β参数在原始强化学习目标中也起到类似作用。","讲者还提到，尽管DPO方法在计算上更高效，但仍然可能需要使用RLHF（Reward Modeling + Human Feedback）来获得更好的泛化能力，特别是在处理未见过的生成内容时。","在讨论KL散度与sigmoid函数的关系时，讲者指出β参数是连接两者的关键，它控制了模型允许偏离的程度。这表明在强化学习目标中，KL散度与sigmoid函数的使用并非完全独立，而是通过β参数进行调节。","讲者强调，β参数的设置对模型训练至关重要，它决定了模型在优化过程中对差异的容忍度。这影响了梯度的传播和模型的最终性能。","最后，讲者指出，DPO方法虽然简化了训练流程，但其效果仍依赖于β参数的合理设置，以及对奖励模型的正确参数化。这表明在实际应用中，需要权衡计算成本与模型性能之间的关系。"],"formulas":[{"latex":"KL(q||p) = \\text{E}_q[\\log \\frac{q(x)}{p(x)}]","symbols":"KL散度表示两个概率分布之间的差异","explanation":"公式正确，KL散度的定义符合数学规范，使用了正确的期望符号和对数形式。","evidence":"So there's still some benefit to it. So it depends upon your budget and what you want to achieve. So the question I get is that the KL divergence, why are we relying on the sigmoid when initially the KL divergence was not related to the sigmoid? To be more clear or precise, I think it's the beta term, which controls how fast, how much you're allowed to drift away. And even in the original RL objective,"}],"uncertainties":["the difference becomes sufficiently large","like faster than the"],"diagram":"none","start":2829.69,"end":2983.68,"asr_flags":[],"math_clarifications":["损失函数中的log和sigmoid函数的组合需要更明确的数学定义，例如是否为对数似然或对数概率。KL散度的使用需要更详细的上下文，如分布的定义和参数的说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2829.69,"text":"the pre-trained model actually this does do that so this is this is a good question so"},{"start":2835.07,"text":"our loss function is set up as a log sigmoid so one property with the sigmoid is that the gradients"},{"start":2840.55,"text":"vanish when the difference becomes"},{"start":2842.73,"text":"is already sufficiently large"},{"start":2844.63,"text":"and the difference becomes sufficiently large"},{"start":2846.93,"text":"like faster than the"},{"start":2847.91,"text":"so the beta parameter actually"},{"start":2850.59,"text":"controls how quickly the difference"},{"start":2852.53,"text":"becomes large"},{"start":2854.31,"text":"So if you have a very high beta, even a small discrepancy would suddenly saturate the sigmoid and it would not change the parameters a lot. The question is, is the main advantage of DPO that you don't have to train a reward model? The way I would say it is that you are training a reward model because you're using the same objective."},{"start":2876.73,"text":"The DPO provides a connection between the reward model and the corresponding optimal policy for it. So you don't have to do an explicit RL loop to go from the reward model to an optimal policy for it. We have cleverly parameterized the reward model in terms of the language model itself. So when you fit a reward model to the preference data, you are optimizing the language model itself."},{"start":2904.68,"text":"So the question is, do we still need to do RLHF or not, given this is cheaper? I think it depends a lot on situation. I think there's still some purported benefits to RLHF because you can expect some kind of generalization from the reward model, which allows you to grade generations which might not have been seen in preference data."},{"start":2930.37,"text":"So there's still some benefit to it. So it depends upon your budget and what you want to achieve. So the question I get is that the KL divergence, why are we relying on the sigmoid when initially the KL divergence was not related to the sigmoid? To be more clear or precise, I think it's the beta term, which controls how fast, how much you're allowed to drift away. And even in the original RL objective,"},{"start":2961.66,"text":"this beta term is what controls the divergence between, allow divergence between our current model and the pre-trained model. So if the beta is really high, you are not allowed to diverge at all because you'll be penalized a lot more. Yes. So like the beta controls the strength or the weight on this divergence."}],"speech_gaps":[],"frame":"../frames/v036/018.webp","frame_time":2841.69},{"title":"强化学习在大语言模型中的应用","segments":[{"id":161,"text":"That's a good question. Yeah. So there's two kinds of sampling involved right now. First, we want to create a preference data set where humans label their preferences. And then during the RL optimization itself, we want to sample to get a score under some kind of an external or explicit reward model. And then we score and then we optimize. So we are taking care of the second sampling step, but the first sampling step is still needed.","start":2984.68,"end":3011.12},{"id":162,"text":"Yeah, that's a good question. So when you're doing online RL or some kind of RLHF procedure, you don't only need the prompts. You don't need a preference data set. So typically, the set of prompts which is used during RL is larger than the set of prompts you use during preference training. Yeah, that's a good question. So I think the question basically tries to ask, can we take into account the strength of the preference and not just a binary label?","start":3012.01,"end":3039.56},{"id":163,"text":"I think this is a limitation for both RLHF and DPO, I think. So giving more insight, typically when we collect preference data sets, we ask annotators to give a strength for their preferences, and we only keep the preferences which are strong. But this isn't a resolved problem. How to learn from noisy data and low preferences or high strength preferences is still an undersolved problem.","start":3040.3,"end":3069.24},{"id":164,"text":"And yeah, like these are some of the results for direct preference optimization. We showed like a theoretical equivalence between doing the DPO objective and doing a KL-constrained RL procedure. And in practice, when we try to look at the summarization task and try to measure win rates like we were doing earlier, we do actually find that like it does similar or better. But this is like a debatable question. So like, yeah, but like in general.","start":3070.16,"end":3098.4},{"id":165,"text":"It does pretty well. The beta parameter that... Do you see this beta parameter here? That corresponds exactly to the beta parameter, which is the extra hyperparameter. So I'm just going to summarize what we have learned so far, and then we'll move on to where things are missing and so on.","start":3099.05,"end":3120.65},{"id":166,"text":"We want to optimize for human preferences because, first of all, it's more aligned with the objectives we want. The way we use these models are more closely aligned with improving human engagement or satisfying human preferences. So we want to optimize for that directly as well. And instead of relying on uncalibrated scores from different annotators, we try to collect preferences and then learn a reward model of some form, either through DPO or through RLHF, and improve the model through that.","start":3122.7,"end":3151.41}],"notes":["本段讨论了在强化学习（RL）中如何处理人类偏好数据的问题。讲者指出，在进行在线强化学习或RLHF（强化学习与人类反馈）过程中，除了需要提示（prompts）外，还需要偏好数据集。通常，用于强化学习的提示集比用于偏好训练的提示集更大。此外，讲者提到，当前的偏好数据集收集方法通常要求标注者提供偏好强度，并仅保留强度较高的偏好，但如何从噪声数据或低强度偏好中学习仍然是一个未解决的问题。","讲者进一步指出，直接偏好优化（DPO）与KL约束的强化学习过程在理论上是等价的。在实践中，当评估摘要任务的胜率时，DPO表现得与传统方法相似或更好。然而，这一结论仍存在争议，因此需要进一步研究。","讲者提到，β参数在DPO中扮演重要角色，它是一个额外的超参数。通过总结当前的学习成果，讲者指出，优化人类偏好是更符合目标的，因为这与提高人类参与度或满足人类偏好更一致。因此，应直接优化人类偏好，而不是依赖不同标注者的未校准评分。","讲者强调，通过收集偏好并学习奖励模型（如DPO或RLHF），可以改进模型。这种方法避免了依赖未校准的评分，而是通过直接优化人类偏好来提升模型性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2984.68,"end":3151.41,"asr_flags":[],"math_clarifications":["原文中提到的KL-constrained RL和β参数没有提供具体的数学公式或定义，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2984.68,"text":"That's a good question. Yeah. So there's two kinds of sampling involved right now. First, we want to create a preference data set where humans label their preferences. And then during the RL optimization itself, we want to sample to get a score under some kind of an external or explicit reward model. And then we score and then we optimize. So we are taking care of the second sampling step, but the first sampling step is still needed."},{"start":3012.01,"text":"Yeah, that's a good question. So when you're doing online RL or some kind of RLHF procedure, you don't only need the prompts. You don't need a preference data set. So typically, the set of prompts which is used during RL is larger than the set of prompts you use during preference training. Yeah, that's a good question. So I think the question basically tries to ask, can we take into account the strength of the preference and not just a binary label?"},{"start":3040.3,"text":"I think this is a limitation for both RLHF and DPO, I think. So giving more insight, typically when we collect preference data sets, we ask annotators to give a strength for their preferences, and we only keep the preferences which are strong. But this isn't a resolved problem. How to learn from noisy data and low preferences or high strength preferences is still an undersolved problem."},{"start":3070.16,"text":"And yeah, like these are some of the results for direct preference optimization. We showed like a theoretical equivalence between doing the DPO objective and doing a KL-constrained RL procedure. And in practice, when we try to look at the summarization task and try to measure win rates like we were doing earlier, we do actually find that like it does similar or better. But this is like a debatable question. So like, yeah, but like in general."},{"start":3099.05,"text":"It does pretty well. The beta parameter that... Do you see this beta parameter here? That corresponds exactly to the beta parameter, which is the extra hyperparameter. So I'm just going to summarize what we have learned so far, and then we'll move on to where things are missing and so on."},{"start":3122.7,"text":"We want to optimize for human preferences because, first of all, it's more aligned with the objectives we want. The way we use these models are more closely aligned with improving human engagement or satisfying human preferences. So we want to optimize for that directly as well. And instead of relying on uncalibrated scores from different annotators, we try to collect preferences and then learn a reward model of some form, either through DPO or through RLHF, and improve the model through that."}],"speech_gaps":[],"frame":"../frames/v036/019.webp","frame_time":2996.68},{"title":"强化学习在大语言模型中的应用","segments":[{"id":167,"text":"In our LHF, we learn an explicit reward model, which gives an explicit score for every completion we sample, and we use that to optimize the language model parameters. And we typically impose some kind of KL constraint to make sure that our model does not drift too far from where it was initialized. It's very effective, maybe sometimes even more effective than DPO, but can be a little tricky to get right, and it's computationally expensive because of the sampling procedure that needs to be done.","start":3153.42,"end":3181.49},{"id":168,"text":"And in direct preference optimization, we can completely skip the sampling part and optimize directly on the preference data by posing it as a binary classification problem. Cool. And it's very simple and effective and does not require an online step. So where does this all lead us? We have discussed all the RLHF and DPO stuff.","start":3182.58,"end":3205.96},{"id":169,"text":"These are roughly how the chatbots are built, by the way. So this is the InstructGPD pipeline. This was like one of the first like instruction, like first chatbots, which was available to public and they interacted with it. And it worked pretty well. Like it can do a lot of tasks. It can answer general purpose questions. And yeah, InstructGPD like...","start":3207.29,"end":3233.81},{"id":170,"text":"This is a comparison between what the pre-trained model gives as an answer versus what an instruction tuned or an RLHF model gives as an answer. And yeah, these are some examples. And yeah, we have optimized these models for dialogue. It's not just summaries, I want to say. We can optimize them for many, many general purpose tasks.","start":3234.36,"end":3258.25},{"id":171,"text":"The more data you collect, more tasks you cover, the better these models are going to do, the better they're going to understand the intent, and the better they're going to respond to all of our needs. And yeah, DPO has been used a lot in the open source community ever since it was launched. It's fairly cheap, works, it's pretty performant. And at some point, all LLMs were using DPO to get their alignment with human feedback.","start":3259.71,"end":3289.04},{"id":172,"text":"LAMA and Mistel models, if you've heard of them, were also post-trained using DPO. And I guess this is an interesting example where it's a good question to ask. What is the difference between instruction-tuned model and RLHF models? And one clear stylistic difference that emerges is that","start":3291.47,"end":3313.93}],"notes":["本段介绍了强化学习在大语言模型中的应用，特别是LHF（Language Model with Human Feedback）和DPO（Direct Preference Optimization）方法。LHF通过显式奖励模型优化语言模型参数，并使用KL约束防止模型偏离初始状态。DPO则通过将问题转化为二分类任务，跳过采样步骤，简化了训练过程。","讲者提到，这些方法是构建聊天机器人的基础，例如InstructGPD管道，这是早期的指令式聊天机器人之一，能够处理多种任务，如回答一般性问题。这表明，通过指令调优或强化学习方法，模型可以更好地理解和回应用户需求。","讲者指出，随着数据量的增加和任务覆盖范围的扩大，模型的表现会更好，理解意图的能力也会增强。DPO在开源社区中被广泛使用，因为它成本较低、效果良好且性能优越，许多LLM都曾使用DPO来实现与人类反馈的一致性。","讲者还提到LAMA和Mistel模型也是通过DPO进行微调的，这表明DPO方法在实际应用中具有广泛的适用性。最后，讲者提出了一个关键问题：指令调优模型和RLHF模型之间的区别，指出两者在风格上存在明显差异。","讲者强调，DPO方法在实际应用中具有优势，如无需在线步骤、成本低、效果好，但LHF方法在某些情况下可能更有效。这表明，选择合适的方法取决于具体的应用场景和需求。","讲者通过比较预训练模型与指令调优或RLHF模型的回答，展示了不同方法在实际任务中的表现差异，这有助于理解不同训练方法对模型性能的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3153.42,"end":3313.93,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3153.42,"text":"In our LHF, we learn an explicit reward model, which gives an explicit score for every completion we sample, and we use that to optimize the language model parameters. And we typically impose some kind of KL constraint to make sure that our model does not drift too far from where it was initialized. It's very effective, maybe sometimes even more effective than DPO, but can be a little tricky to get right, and it's computationally expensive because of the sampling procedure that needs to be done."},{"start":3182.58,"text":"And in direct preference optimization, we can completely skip the sampling part and optimize directly on the preference data by posing it as a binary classification problem. Cool. And it's very simple and effective and does not require an online step. So where does this all lead us? We have discussed all the RLHF and DPO stuff."},{"start":3207.29,"text":"These are roughly how the chatbots are built, by the way. So this is the InstructGPD pipeline. This was like one of the first like instruction, like first chatbots, which was available to public and they interacted with it. And it worked pretty well. Like it can do a lot of tasks. It can answer general purpose questions. And yeah, InstructGPD like..."},{"start":3234.36,"text":"This is a comparison between what the pre-trained model gives as an answer versus what an instruction tuned or an RLHF model gives as an answer. And yeah, these are some examples. And yeah, we have optimized these models for dialogue. It's not just summaries, I want to say. We can optimize them for many, many general purpose tasks."},{"start":3259.71,"text":"The more data you collect, more tasks you cover, the better these models are going to do, the better they're going to understand the intent, and the better they're going to respond to all of our needs. And yeah, DPO has been used a lot in the open source community ever since it was launched. It's fairly cheap, works, it's pretty performant. And at some point, all LLMs were using DPO to get their alignment with human feedback."},{"start":3291.47,"text":"LAMA and Mistel models, if you've heard of them, were also post-trained using DPO. And I guess this is an interesting example where it's a good question to ask. What is the difference between instruction-tuned model and RLHF models? And one clear stylistic difference that emerges is that"}],"speech_gaps":[],"frame":"../frames/v036/020.webp","frame_time":3165.42},{"title":"强化学习在大语言模型中的应用","segments":[{"id":173,"text":"They tend to give more detailed answers, well-formatted answers, and they tend to align more with the kind of text that humans find easier to read. So the question here are like, what are the five most common causes of stress among people? And if you just do instruction fine-tuning with a very small data set, you get a good answer. The five most common causes of stress among people are work, money, relationships, health, and family.","start":3314.65,"end":3335.91},{"id":174,"text":"But then you do some kind of a PPO procedure. You get a much clearer, longer answer with a very well-formatted list. And these are all emergent properties. This is what the model has discovered that humans like and prefer. And that's why they tend to generate answers of that form. I love the question. I had a slide on this towards the end. But yes, the question is, can we trust people's feedback? And what do we do if people don't know what they want?","start":3336.67,"end":3365.06},{"id":175,"text":"Again, that's a very hard boundary to go to. And I think what happens is that there's a misalignment between short-term incentives and long-term incentives. There are certain behaviors which look good in short-term, and people give feedback based on short-term incentives. But sometimes behaviors are very undesirable in the long-term. And that is truly a hard problem to solve within the RLHF pipeline.","start":3365.76,"end":3391.46},{"id":176,"text":"That's a good question. The question is, like, do we rank, like, two answers or multiple answers? And do we train on NC2 pairs or, yeah. So I think, like...","start":3392.55,"end":3404.51},{"id":177,"text":"Yeah, you can roughly like just for efficiency purposes, people typically rank more than one answer and you get more learning data out of it that way because you get NC2 pairs, preference pairs. But you can, there's something called the placket loose family, which is like a generalization of Bradley-Terry that allows you to directly train on ranked completions as well beyond just preference pairs too. So you can do either of those. They probably both work fine.","start":3404.87,"end":3430.51},{"id":178,"text":"Yeah, that's a really good question. So I think our company is incentivized to give preferences to engagement which are not aligned with human. This goes well beyond the scope of this lecture and be like, I don't know what I can say about this. But we can look back at history, right? So this is not an issue that was just true for LLMs. For example, YouTube had a lot of issues with recommendation systems and people were engaging with YouTube way more than they wanted it to.","start":3431.38,"end":3459.12},{"id":179,"text":"So in some ways, this is a broader problem on how technology should be interfaced with people and societies. But if I briefly recall from that incident, it was actually YouTube's incentive to make sure that the consumers have long-term healthy engagement.","start":3459.74,"end":3479.96}],"notes":["本段讨论了在强化学习中如何处理多个答案的排名问题，以及如何利用NC2对和偏好对进行训练。讲者提到，为了提高效率，人们通常会对多个答案进行排名，从而获得更多的学习数据。此外，还提到了一种称为Plackett-Luce家族的模型，它是Bradley-Terry模型的扩展，允许直接在排序完成上进行训练，而不仅仅是偏好对。","讲者指出，Plackett-Luce家族模型可以用于训练，而不仅仅是偏好对。这表明在强化学习中，可以采用不同的方法来处理排序问题，从而提高模型的性能。","讲者还提到，两种方法（偏好对和排序完成）可能都有效，这表明在实际应用中，可以根据具体情况选择合适的方法。","此外，讲者提到，公司可能会倾向于给予与人类不一致的偏好，这表明在设计强化学习系统时，需要考虑如何对齐人类的偏好。","讲者还提到，YouTube的推荐系统曾出现过类似的问题，这表明技术与人类社会的接口设计是一个更广泛的问题。","最后，讲者提到，YouTube的激励机制是为了确保消费者的长期健康参与，这表明在设计激励机制时，需要考虑长期和短期目标之间的平衡。"],"formulas":[],"uncertainties":["placket loose family"],"diagram":"none","start":3314.65,"end":3479.96,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3314.65,"text":"They tend to give more detailed answers, well-formatted answers, and they tend to align more with the kind of text that humans find easier to read. So the question here are like, what are the five most common causes of stress among people? And if you just do instruction fine-tuning with a very small data set, you get a good answer. The five most common causes of stress among people are work, money, relationships, health, and family."},{"start":3336.67,"text":"But then you do some kind of a PPO procedure. You get a much clearer, longer answer with a very well-formatted list. And these are all emergent properties. This is what the model has discovered that humans like and prefer. And that's why they tend to generate answers of that form. I love the question. I had a slide on this towards the end. But yes, the question is, can we trust people's feedback? And what do we do if people don't know what they want?"},{"start":3365.76,"text":"Again, that's a very hard boundary to go to. And I think what happens is that there's a misalignment between short-term incentives and long-term incentives. There are certain behaviors which look good in short-term, and people give feedback based on short-term incentives. But sometimes behaviors are very undesirable in the long-term. And that is truly a hard problem to solve within the RLHF pipeline."},{"start":3392.55,"text":"That's a good question. The question is, like, do we rank, like, two answers or multiple answers? And do we train on NC2 pairs or, yeah. So I think, like..."},{"start":3404.87,"text":"Yeah, you can roughly like just for efficiency purposes, people typically rank more than one answer and you get more learning data out of it that way because you get NC2 pairs, preference pairs. But you can, there's something called the placket loose family, which is like a generalization of Bradley-Terry that allows you to directly train on ranked completions as well beyond just preference pairs too. So you can do either of those. They probably both work fine."},{"start":3431.38,"text":"Yeah, that's a really good question. So I think our company is incentivized to give preferences to engagement which are not aligned with human. This goes well beyond the scope of this lecture and be like, I don't know what I can say about this. But we can look back at history, right? So this is not an issue that was just true for LLMs. For example, YouTube had a lot of issues with recommendation systems and people were engaging with YouTube way more than they wanted it to."},{"start":3459.74,"text":"So in some ways, this is a broader problem on how technology should be interfaced with people and societies. But if I briefly recall from that incident, it was actually YouTube's incentive to make sure that the consumers have long-term healthy engagement."}],"speech_gaps":[],"frame":"../frames/v036/021.webp","frame_time":3326.65},{"title":"强化学习在大语言模型中的应用与挑战","segments":[{"id":180,"text":"So, which means like if they're like spending 20 hours a day on YouTube, that's probably not good for the product as well. So they probably want to make sure that they're not spending way too much time. So if you do optimize for long-term engagement, that should ideally address, that should not fall to like the sycophantic behaviors that we saw from GPT-40 because that is more short-term behavior. But yeah, cool.","start":3481.0,"end":3506.61},{"id":181,"text":"And yeah, this is basically all we've talked about. And I wanted to bring up a couple of things. Let me just jump ahead to this slide, because we've already talked about it. This is a very fast-evolving topic. This is touching our lives right now when we are deciding how to interface chatbots with humans.","start":3509.84,"end":3534.84},{"id":182,"text":"And for people who might not be familiar with this incident, but like GPT-4 became fairly psychophantic due to a model update that was pushed. And suddenly it was like endorsing all good and bad ideas from their users in a way that everyone deemed was unhealthy. So I don't work at OpenAI and I'm not making any comments, but like these issues, like these are very real.","start":3536.1,"end":3562.56},{"id":183,"text":"And we're still trying to understand how does our feedback data affect our final model's emergent behaviors. And this affects how we use our products as well. And yeah, a lot of great questions came up in the class. And those are active problems people are working on. And we don't necessarily have the answers to all of them. So you guys should go look more into it.","start":3563.12,"end":3586.86},{"id":184,"text":"It's a very common problem in RL when you have proxy rewards instead of true rewards that you care about. And this is generally true for machine learning as well. So yeah, this affects our ability to scale reinforcement learning too because if you start hacking, you have to stop training at some point. And this is like an active optimization problem that people are trying to address. Yeah, I think the field is evolving quite a lot.","start":3588.39,"end":3614.11},{"id":185,"text":"It's a very common problem in RL when you have proxy rewards instead of true rewards that you care about. And this is generally true for machine learning as well. So yeah, this affects our ability to scale reinforcement learning too because if you start hacking, you have to stop training at some point. And this is like an active optimization problem that people are trying to address. Yeah, I think the field is evolving quite a lot. So like it goes beyond like,","start":3616.02,"end":3645.57},{"id":186,"text":"People are moving towards more rubric-based things where we score them for several different aspects.","start":3645.93,"end":3653.71}],"notes":["本段讨论了强化学习在大语言模型中的应用，特别是长期参与度优化与短期行为偏差之间的关系。讲者指出，如果模型过度优化短期行为，可能会导致类似GPT-40的谄媚行为，这表明需要在长期目标和短期行为之间取得平衡。","讲者提到GPT-4因模型更新而表现出心理偏差，这表明模型更新可能带来不可预见的行为变化。这种现象说明了模型与人类偏好之间的对齐问题，是当前研究的重要挑战。","讲者强调了奖励黑客（reward hacking）问题，即当模型使用代理奖励而非真实奖励时，可能会偏离人类真正想要的目标。这在强化学习和机器学习中都是常见问题，影响模型的可扩展性。","讲者指出，奖励黑客问题使得在训练过程中需要在某个点停止训练，这表明这是一个需要主动优化的问题。当前研究正在努力解决这一问题，以提高模型的稳定性和对齐性。","讲者提到人们正在转向基于评分标准的方法，以评估模型在多个方面的表现。这表明当前研究正在探索更系统化的方法来评估和优化模型行为。","讲者强调了强化学习在大语言模型中的重要性，以及当前研究的活跃性和挑战性。这表明该领域仍在快速发展，需要进一步的研究和探索。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3481.0,"end":3653.71,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3481.0,"text":"So, which means like if they're like spending 20 hours a day on YouTube, that's probably not good for the product as well. So they probably want to make sure that they're not spending way too much time. So if you do optimize for long-term engagement, that should ideally address, that should not fall to like the sycophantic behaviors that we saw from GPT-40 because that is more short-term behavior. But yeah, cool."},{"start":3509.84,"text":"And yeah, this is basically all we've talked about. And I wanted to bring up a couple of things. Let me just jump ahead to this slide, because we've already talked about it. This is a very fast-evolving topic. This is touching our lives right now when we are deciding how to interface chatbots with humans."},{"start":3536.1,"text":"And for people who might not be familiar with this incident, but like GPT-4 became fairly psychophantic due to a model update that was pushed. And suddenly it was like endorsing all good and bad ideas from their users in a way that everyone deemed was unhealthy. So I don't work at OpenAI and I'm not making any comments, but like these issues, like these are very real."},{"start":3563.12,"text":"And we're still trying to understand how does our feedback data affect our final model's emergent behaviors. And this affects how we use our products as well. And yeah, a lot of great questions came up in the class. And those are active problems people are working on. And we don't necessarily have the answers to all of them. So you guys should go look more into it."},{"start":3588.39,"text":"Yeah, and the other main thing that I do want to touch upon, which is a limitation of the current paradigm, is that there's this phenomenon of reward hacking, which again touches upon misalignment as well, is that when we train on these learned reward models, they do align with human preferences up to a certain point. But as you train progressively against them, they tend to start drifting away from what we truly want."},{"start":3616.02,"text":"It's a very common problem in RL when you have proxy rewards instead of true rewards that you care about. And this is generally true for machine learning as well. So yeah, this affects our ability to scale reinforcement learning too because if you start hacking, you have to stop training at some point. And this is like an active optimization problem that people are trying to address. Yeah, I think the field is evolving quite a lot. So like it goes beyond like,"},{"start":3645.93,"text":"People are moving towards more rubric-based things where we score them for several different aspects."}],"speech_gaps":[],"frame":"../frames/v036/022.webp","frame_time":3493.0},{"title":"强化学习在大语言模型中的应用","segments":[{"id":187,"text":"But yes, you typically do want to collect many different kinds of data to teach the model what kind of behaviors we want to install and what's the right way to respond to certain situations. It's very hard to cover every situation a chatbot might ever encounter. So we are relying on the model to generalize from what kind of data we're teaching.","start":3655.51,"end":3676.09},{"id":188,"text":"These things break all the time, and there are certain unexpected behaviors that come out of these models in ways where we could not anticipate. Yeah, I've already touched a little bit upon this, but it's a very fast evolving field, many, many areas still to improve. Preference data is still expensive to collect, and as we have maybe discussed, it's not necessarily representative of what kind of model behaviors we want. So we are looking for better ways to improve the feedback.","start":3677.05,"end":3706.15},{"id":189,"text":"I think you listen to a lot more about very cool evolving things in reasoning space where the models are generating their own outputs from and are being graded by verifiable rewards. And that's like one of the coolest topics we're looking at as well in post-training and reasoning as well. And something that I personally find very interesting is that language models are aligned to the aggregate preferences of humans, but like...","start":3708.09,"end":3735.81},{"id":190,"text":"We are interacting one-on-one. We're not interacting with the entire internet. So we do want to eventually make sure that the models are aligned to our needs and not just everybody's needs. So personalizing language models and having more contextual input about us and our preferences is something that's also a fairly nice evolving field. And yeah, we talk a little bit about hallucinations and uncontrolled emergent behaviors, and these are all still active problems we work on. And that's all for today.","start":3736.49,"end":3764.82}],"notes":["本段讨论了在大语言模型中使用强化学习时，收集多种类型数据的重要性。由于聊天机器人可能遇到的情况非常多，因此需要依赖模型从教学数据中进行泛化。","讲者提到，模型可能会出现意想不到的行为，这使得该领域发展迅速，但仍有许多需要改进的地方。偏好数据的收集成本较高，且可能无法代表我们希望模型具备的行为。","讲者提到，当前研究的一个重要方向是推理空间中的强化学习，即模型生成输出并由可验证的奖励进行评估。这被认为是后训练和推理阶段的一个重要研究方向。","讲者还提到，语言模型需要与人类的总体偏好对齐，但目前的模型交互是基于一对一的，而不是整个互联网。因此，个性化语言模型和增加上下文输入以反映用户偏好是一个重要的发展方向。","讲者还提到，幻觉和不受控制的涌现行为仍然是当前研究中的活跃问题，需要进一步解决。","最后，讲者总结了今天的内容，指出这些仍然是当前研究中的重点问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3655.51,"end":3764.82,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3655.51,"text":"But yes, you typically do want to collect many different kinds of data to teach the model what kind of behaviors we want to install and what's the right way to respond to certain situations. It's very hard to cover every situation a chatbot might ever encounter. So we are relying on the model to generalize from what kind of data we're teaching."},{"start":3677.05,"text":"These things break all the time, and there are certain unexpected behaviors that come out of these models in ways where we could not anticipate. Yeah, I've already touched a little bit upon this, but it's a very fast evolving field, many, many areas still to improve. Preference data is still expensive to collect, and as we have maybe discussed, it's not necessarily representative of what kind of model behaviors we want. So we are looking for better ways to improve the feedback."},{"start":3708.09,"text":"I think you listen to a lot more about very cool evolving things in reasoning space where the models are generating their own outputs from and are being graded by verifiable rewards. And that's like one of the coolest topics we're looking at as well in post-training and reasoning as well. And something that I personally find very interesting is that language models are aligned to the aggregate preferences of humans, but like..."},{"start":3736.49,"text":"We are interacting one-on-one. We're not interacting with the entire internet. So we do want to eventually make sure that the models are aligned to our needs and not just everybody's needs. So personalizing language models and having more contextual input about us and our preferences is something that's also a fairly nice evolving field. And yeah, we talk a little bit about hallucinations and uncontrolled emergent behaviors, and these are all still active problems we work on. And that's all for today."}],"speech_gaps":[],"frame":"../frames/v036/023.webp","frame_time":3667.51}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
