ome news articles. And if you look at the blue curve, it's the pre-training curve, which as the model size increases, the fraction of summaries preferred over the baseline increases.","zh":"曲线基本上是，x轴是模型大小，y轴是摘要在多大程度上被偏好于某些新闻文章的真实摘要。如果你看蓝色曲线，它是预训练曲线，随着模型大小的增加，摘要优于基线的比例也在增加。","start":1914.85,"end":1938.42},{"id":85,"text":"And then you have SFT or instruction fine tuning, which gives an improvement over the pre-trained model. But when you look at the RL curve, this is the first model which actually exceeds the human written summaries. So now we are generating summaries, even at a small size, which are preferred over human summaries. And that's just like one of the earlier results in RLHF, which shows like the power of optimizing for preferences directly.","zh":"然后你有监督微调（SFT）或指令微调，这在预训练模型的基础上带来了改进。但当你观察强化学习的曲线时，这是第一个实际超过人类撰写摘要的模型。现在我们即使在较小的规模下生成的摘要，也比人类撰写的摘要更受青睐。这仅仅是RLHF早期的一个结果，展示了直接优化偏好所带来的强大效果。","start":1939.36,"end":1967.58}],"notes":["本段讲解了在强化学习中引入KL罚项（KL penalty）的动机和作用。KL罚项通过在奖励函数中加入KL散度，确保优化后的模型不会偏离预训练模型太远，从而避免奖励模型的不准确性带来的问题。","KL罚项的数学表达为β乘以KL散度，其中Pθ是当前优化的语言模型，P_pre-trained是初始的预训练模型。KL散度衡量的是当前模型分布与初始模型分布之间的差异，当差异过大时，罚项会降低奖励分数。","引入KL罚项的目的是为了确保模型在优化过程中保持与初始模型的相似性，尤其是在奖励模型不完美的情况下。这有助于防止模型在优化过程中偏离人类偏好分布。","在实际应用中，KL罚项是RLHF（强化学习与人类反馈）中的一个关键组件，它帮助模型在优化过程中保持与人类偏好的一致性，同时避免过拟合或偏离初始分布。","通过实验曲线可以看出，随着模型规模的增加，预训练模型的总结质量逐渐提高，而经过指令微调（SFT）和强化学习优化后的模型在小规模时就能超越人类编写的总结。","这些结果展示了直接优化人类偏好在强化学习中的有效性，表明通过引入KL罚项可以显著提升模型在特定任务上的表现。"],"formulas":[{"latex":"KL(P_{\\theta} \\parallel P_{\\text{pre-trained}})","symbols":"KL散度，衡量当前模型分布与初始模型分布之间的差异","explanation":"公式正确，KL散度用于衡量两个概率分布之间的差异，符合数学定义。","evidence":"And roughly speaking, whenever a probability distribution deviates from the pre-trained distribution, we get a penalty. So we get a lower score if we are deviating too much from the pre-trained model. And if you work out the math, this thing is exactly the KL divergence between our distribution or our language model that we are optimizing right now and the language model we started with."}],"uncertainties":["beta log P theta by P pre-trained"],"diagram":"none","start":1798.3,"end":1967.58,"asr_flags":[],"math_clarifications":["公式1是正确的KL散度表达式，用于衡量当前模型分布与初始模型分布之间的差异。公式2不完整，缺少必要的运算符，无法正确表达KL罚项。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1798.3,"text":"assume that they'll give us a perfect score. After all, they have been fit to human preferences on a certain distribution. We don't want to assume that they'll give us a good score for every single input and output. And if you do naive optimization like we described so far, you will get models which have the reward model, and we'll see some plots for that later as well. So one another thing we add is something called the KL penalty or the callback library divergence."},{"start":1826.13,"text":"And what the KL penalty basically says is, so it's added to the reward where we have beta log P theta by P pre-trained. So P theta is the quantity we are optimizing right now. This is the language model, which is currently assigning the probabilities to token Y hat. And P pre-trained is the model we started with. So it could be instruction fine-tuned, and these are the probabilities under those models."},{"start":1855.69,"text":"And roughly speaking, whenever a probability distribution deviates from the pre-trained distribution, we get a penalty. So we get a lower score if we are deviating too much from the pre-trained model. And if you work out the math, this thing is exactly the KL divergence between our distribution or our language model that we are optimizing right now and the language model we started with."},{"start":1887.42,"text":"The reason why we want to do this is that, as I said, the reward model is imperfect. We know it's more accurate on a distribution of preferences that we trained on, and we want to make sure the model stays close to where it started off from. So this is one of the first examples of RLHF where it worked quite well. So this is a summarization task itself."},{"start":1914.85,"text":"And the curve basically, the x-axis is the model size and the y-axis is how often is the summary preferred over some ground truth summary for some news articles. And if you look at the blue curve, it's the pre-training curve, which as the model size increases, the fraction of summaries preferred over the baseline increases."},{"start":1939.36,"text":"And then you have SFT or instruction fine tuning, which gives an improvement over the pre-trained model. But when you look at the RL curve, this is the first model which actually exceeds the human written summaries. So now we are generating summaries, even at a small size, which are preferred over human summaries. And that's just like one of the earlier results in RLHF, which shows like the power of optimizing for preferences directly."}],"speech_gaps":[],"frame":"../frames/v036/012.webp","frame_time":1810.3},{"title":"偏好学习中的非传递性与挑战","segments":[{"id":86,"text":"The question is, are there models for human preferences which are not just binary and account for fuzzy? I think this is a very hard question which goes into... So it is known that human preferences can often be intransitive. So what do I mean by that? Let's say we prefer A over B, then we prefer B over C, and then we prefer C over A.","zh":"问题是，是否存在能够捕捉人类偏好且不仅仅是二元的模型？我认为这是一个非常困难的问题，涉及…… 已知人类的偏好常常是非传递性的。那么，我所说的非传递性是什么意思呢？比如说，我们偏好A胜过B，然后偏好B胜过C，接着又偏好C胜过A。","start":1968.59,"end":1994.27},{"id":87,"text":"this doesn't make any sense. Because ideally, if you prefer A over B and B over C, you should prefer A over C. But we get lots of scenarios where humans prefer A over C as well. And you will, unfortunately, observe some noise in the data like that where the preferences... In fact, the preferences we observe in real life are very, very noisy.","zh":"这在逻辑上是不合理的。理想情况下，如果你偏好A胜过B，又偏好B胜过C，那么你应该偏好A胜过C。但我们会遇到很多人类偏好A胜过C的情况。不幸的是，你会在数据中观察到一些噪声，例如这些偏好…… 事实上，我们在现实生活中观察到的偏好是非常嘈杂的。","start":1995.24,"end":2017.88},{"id":88,"text":"And I don't think we have a great solution for this. To even ground this, preference learning is a binary classification task. We're just trying to predict which sample is winning. So it's a binary classification task. Most binary classifications, you can reach an accuracy of 90%, 95%. But for most of our language model and reward models, we reach an accuracy of 65% to 70%. So we're barely doing better than chance.","zh":"我认为我们还没有很好的解决方案来应对这个问题。为了进一步说明这一点，偏好学习是一个二元分类任务。我们只是试图预测哪个样本是胜出的。因此，这是一个二元分类任务。大多数二元分类任务，你可以达到90%、95%的准确率。但对我们大多数语言模型和奖励模型来说，准确率只有65%到70%。因此，我们 barely（勉强）做得比随机好。","start":2019.2,"end":2045.32},{"id":89,"text":"But even that is still enough to give us pretty large improvements in performance. The question is, what changed to make this differentiable? We did not make anything differentiable. That's the reason why we started doing RL, is to be able to take the policy gradient. This estimator, this does not require us to be able to... So that just requires the gradient to be with the log probabilities of the model.","zh":"但即使如此，这仍然足以带来相当大的性能提升。问题是，是什么让这个过程变得可微？我们并没有让任何东西变得可微。这就是我们开始进行强化学习的原因，是为了能够使用策略梯度。这个估计量并不需要我们能够…… 所以这只需要模型的对数概率的梯度。","start":2046.66,"end":2074.8},{"id":90,"text":"It does not backpropagate into the reward at all. So the question is, what if the P theta RL is less than P theta PD? And wouldn't that encourage the model to go in those directions? It's good to know. So the expectation is broken down here into more explicitly. But it's good to know a property about KL divergence that is always greater than or equal to 0. I'll leave that as an exercise for you to prove that. So the penalty is always positive.","zh":"它根本不会反向传播到奖励中。因此，问题是，如果P_theta RL 小于 P_theta PD，那是否会让模型朝着这些方向发展？这很有帮助。因此，这里的期望被更明确地分解了。但了解KL散度的一个性质是有帮助的，即它总是大于或等于0。我将把这个作为你们的一个练习题来证明。因此，惩罚总是正的。","start":2075.4,"end":2104.05},{"id":91,"text":"So the question is, are there intelligent ways to choose prompts such that we get preferences over things that the model is bad at? That's a great question. Yeah, so there are works which try to look into it. This touches upon active exploration. You want to get preference signal explicitly where the model is confused, right?","zh":"那么问题是，有没有智能的方法来选择提示，使得我们能够获得模型不擅长的事物上的偏好？这是一个非常好的问题。是的，有一些工作尝试探讨这个问题。这涉及到主动探索。你希望在模型感到困惑的地方明确获取偏好信号，对吧？","start":2105.13,"end":2128.49},{"id":92,"text":"I think there's things which touch upon, like, we want to maximize information gain such that the model will learn the best.","zh":"我认为有一些内容涉及到，比如，我们希望最大化信息增益，使得模型能够学到最好的知识。","start":2130.37,"end":2136.73},{"id":93,"text":"Is there a well-established standard?","zh":"是否存在一个公认的准则？","start":2138.13,"end":2140.55},{"id":94,"text":"I don't think so, but this is, like, a good problem to look into.","zh":"我不认为有，但这是一个值得研究的好问题。","start":2140.77,"end":2143.29},{"id":95,"text":"Okay, I will start with direct preference optimization next.","zh":"好的，我接下来将从直接偏好优化开始。","start":2144.25,"end":2147.35}],"notes":["本段讨论了人类偏好学习中的非传递性问题，即人类偏好可能不满足传递性，例如A优于B，B优于C，但C又优于A。这种非传递性在实际数据中很常见，且偏好数据通常带有大量噪声。这表明传统的二分类任务（如偏好学习）可能不足以准确捕捉人类的复杂偏好。","讲者指出，尽管偏好学习通常可以达到90%或95%的准确率，但语言模型和奖励模型的准确率通常只有65%到70%，这表明当前的模型在捕捉人类偏好方面仍有很大提升空间。","讲者提到，即使准确率不高，仍然可以带来显著的性能提升。这表明，即使在不完全准确的情况下，模型仍能通过优化策略获得改进。","讲者进一步讨论了如何使模型在非传递性偏好下进行优化，指出这与强化学习中的策略梯度有关，但并不需要将奖励函数直接微分。这表明，强化学习的梯度估计可以独立于奖励函数的微分。","讲者提到KL散度的性质，即其总是大于或等于0，并建议学生自行证明这一性质。这表明KL散度在优化过程中作为正则化项的作用。","最后，讲者提出了一些关于如何选择提示以获取模型在弱项上的偏好信号的问题，并提到这涉及主动探索和最大化信息增益，以帮助模型更好地学习。"],"formulas":[],"uncertainties":["P theta RL is less than P theta PD"],"diagram":"none","start":1968.59,"end":2147.35,"asr_flags":[],"math_clarifications":["原文中提到KL散度总是大于或等于0，但未提供数学证明或公式推导，且未明确指出其数学性质或适用条件，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":10,"raw_segments":[{"start":1968.59,"text":"The question is, are there models for human preferences which are not just binary and account for fuzzy? I think this is a very hard question which goes into... So it is known that human preferences can often be intransitive. So what do I mean by that? Let's say we prefer A over B, then we prefer B over C, and then we prefer C over A."},{"start":1995.24,"text":"this doesn't make any sense. Because ideally, if you prefer A over B and B over C, you should prefer A over C. But we get lots of scenarios where humans prefer A over C as well. And you will, unfortunately, observe some noise in the data like that where the preferences... In fact, the preferences we observe in real life are very, very noisy."},{"start":2019.2,"text":"And I don't think we have a great solution for this. To even ground this, preference learning is a binary classification task. We're just trying to predict which sample is winning. So it's a binary classification task. Most binary classifications, you can reach an accuracy of 90%, 95%. But for most of our language model and reward models, we reach an accuracy of 65% to 70%. So we're barely doing better than chance."},{"start":2046.66,"text":"But even that is still enough to give us pretty large improvements in performance. The question is, what changed to make this differentiable? We did not make anything differentiable. That's the reason why we started doing RL, is to be able to take the policy gradient. This estimator, this does not require us to be able to... So that just requires the gradient to be with the log probabilities of the model."},{"start":2075.4,"text":"It does not backpropagate into the reward at all. So the question is, what if the P theta RL is less than P theta PD? And wouldn't that encourage the model to go in those directions? It's good to know. So the expectation is broken down here into more explicitly. But it's good to know a property about KL divergence that is always greater than or equal to 0. I'll leave that as an exercise for you to prove that. So the penalty is always positive."},{"start":2105.13,"text":"So the question is, are there intelligent ways to choose prompts such that we get preferences over things that the model is bad at? That's a great question. Yeah, so there are works which try to look into it. This touches upon active exploration. You want to get preference signal explicitly where the model is confused, right?"},{"start":2130.37,"text":"I think there's things which touch upon, like, we want to maximize information gain such that the model will learn the best."},{"start":2138.13,"text":"Is there a well-established standard?"},{"start":2140.77,"text":"I don't think so, but this is, like, a good problem to look into."},{"start":2144.25,"text":"Okay, I will start with direct preference optimization next."}],"speech_gaps":[],"frame":"../frames/v036/013.webp","frame_time":1980.59},{"title":"直接偏好优化（Direct Preference Optimization）","segments":[{"id":96,"text":"So, there will be a little bit more math, but it's very fun.","zh":"所以，会有一些更多的数学内容，但非常有趣。","start":2147.53,"end":2151.41},{"id":97,"text":"So, we're going to talk a little bit about direct preference optimization.","zh":"所以，我们将稍微谈谈直接偏好优化。","start":2153.15,"end":2155.91},{"id":98,"text":"optimization. So the RLHF pipeline I described, some of you might find it complex or some of you","zh":"优化。所以，我描述的RLHF流程，有些人可能会觉得复杂，有些人可能会觉得简单。","start":2155.91,"end":2163.21},{"id":99,"text":"might find it easy. But in practice, when we try to do this at very large scale models,","zh":"但在实践中，当我们试图在非常大的模型规模上进行这种操作时，可能会相当昂贵。","start":2163.21,"end":2167.45},{"id":100,"text":"it can be quite expensive. So let's say you're like training a hundred billion parameter model,","zh":"比如说，你正在训练一个一百亿参数的模型，也许是一个万亿参数的模型。","start":2167.69,"end":2176.07},{"id":101,"text":"maybe a trillion parameter model. You have to sample every answer and then query a reward model.","zh":"你必须采样每一个答案，然后查询一个奖励模型。","start":2176.91,"end":2183.55},{"id":102,"text":"and depending on the RL algorithm you use um you you have to compute like value functions and like","zh":"并且，根据你使用的强化学习算法，你必须计算价值函数和其他东西，只是为了优化模型，而你不需要理解我展示的这张图。","start":2183.55,"end":2193.23},{"id":103,"text":"other things just to optimize the model and you don't have to understand this figure i put it","zh":"我把它放在这里","start":2193.23,"end":2199.67},{"id":104,"text":"specifically to scare you guys um so here like there's just like a whole flow of things that","zh":"特别是为了吓唬你们，这里就像有一连串的事情","start":2199.67,"end":2206.49},{"id":105,"text":"in practice can be fairly hard to get right and the more parameters you have in the system the","zh":"在实践中，要正确处理这些事情可能相当困难，系统中的参数越多","start":2206.49,"end":2211.95},{"id":106,"text":"the harder it is to get it right.","zh":"就越难正确处理。","start":2211.95,"end":2213.09},{"id":107,"text":"So RLHF can be pretty complex.","zh":"因此，强化学习与人类反馈（RLHF）可以相当复杂。","start":2214.89,"end":2216.71},{"id":108,"text":"So when we were looking into diet preference optimization,","zh":"因此，当我们研究饮食偏好优化时，","start":2218.69,"end":2221.63},{"id":109,"text":"our goal was to, like, can we make this a lot simpler?","zh":"我们的目标是，像这样，能否让这个过程变得简单得多？","start":2221.89,"end":2224.37},{"id":110,"text":"And yeah, as I said, they have some initial pipeline","zh":"是的，正如我所说，他们有一些初始流程","start":2226.63,"end":2231.15},{"id":111,"text":"which we fit in RMV, like, take an instruction-tuned model","zh":"我们用RMV进行拟合，比如，使用一个指令微调的模型","start":2231.15,"end":2235.57},{"id":112,"text":"and produce a final RLHF model.","zh":"并产生一个最终的RLHF模型。","start":2235.57,"end":2237.13},{"id":113,"text":"But if you look at the whole process,","zh":"但如果纵观整个过程，","start":2238.45,"end":2240.73},{"id":114,"text":"like we have a language model","zh":"比如我们有一个语言模型","start":2240.73,"end":2242.51},{"id":115,"text":"and we're collecting some preferences","zh":"我们正在收集一些偏好数据","start":2242.51,"end":2243.65},{"id":116,"text":"Why can we just not directly train on the preference data and directly optimize the parameter models? Why do we have to learn this intermediate quantity, like a reward model? And why can't we just directly go from preferences and optimize our language model? So that's really why it's called direct preference optimization, is that we find a way to go from preferences to optimizing the language model. And the way we do it is that at a very high level,","zh":"为什么我们不能直接在偏好数据上进行训练，并直接优化参数模型呢？为什么我们必须学习这样一个中间量，比如奖励模型？为什么我们不能直接从偏好数据出发，优化我们的语言模型呢？这就是为什么它被称为直接偏好优化，因为我们找到了一种从偏好数据到优化语言模型的方法。我们实现这一目标的方式是，在一个非常高的层次上，","start":2244.49,"end":2272.53},{"id":117,"text":"We want to be able to write the reward model in terms of our language model itself. Why do we want to do that? Because we fit our reward model to the preference data through a fairly simple classification loss, the Bradley-Terry loss we discussed. If we can just connect the reward model and the language model, instead of having a separate process, we can just take the language model parameters and fit it through the loss directly.","zh":"我们希望能够将奖励模型用我们的语言模型本身来表达。我们为什么要这样做呢？因为我们通过一个相对简单的分类损失——我们之前讨论过的Bradley-Terry损失——来拟合我们的奖励模型到偏好数据上。如果我们能够将奖励模型和语言模型连接起来，而不是通过一个独立的过程，我们就可以直接使用语言模型的参数并通过损失函数进行拟合。","start":2272.94,"end":2299.24},{"id":118,"text":"And that's really the high-level motivation for direct preference optimization. So this part of the math gets a little bit slightly intense, so I'll go through this slowly. So we discussed the scale-constrained RL objective in the last few slides, where we want to maximize the expected reward.","zh":"这就是直接偏好优化的高层次动机。所以这部分数学内容会稍微有些复杂，我会慢慢讲解。我们之前在几张幻灯片中讨论了尺度约束的强化学习目标，其中我们希望最大化预期奖励。","start":2299.9,"end":2325.26}],"notes":["本段讲解了强化学习在大规模语言模型训练中的复杂性，指出传统RLHF流程在实际应用中可能非常昂贵，尤其是在训练参数量巨大的模型时，需要进行大量采样和计算，如价值函数等，这使得流程难以正确实现。","讲者提到直接偏好优化（Direct Preference Optimization）的目标是简化这一流程，通过直接使用偏好数据来训练语言模型，而不是通过中间的奖励模型。","讲者解释了为什么需要奖励模型，以及为何不能直接从偏好数据优化语言模型，强调了直接偏好优化的核心思想是将奖励模型与语言模型直接连接，从而简化流程。","讲者提到使用Bradley-Terry损失函数来拟合奖励模型，这是一种简单的分类损失，可以将奖励模型与语言模型直接连接，从而避免了中间步骤。","最后，讲者提到接下来将讨论一个与尺度约束的强化学习目标相关的数学部分，强调了最大化期望奖励的目标。"],"formulas":[],"uncertainties":["um you you have to compute like value functions and like","i put it specifically to scare you guys um so here like there's just like a whole flow of things that","the more parameters you have in the system the the harder it is to get it right."],"diagram":"none","start":2147.53,"end":2325.26,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":23,"raw_segments":[{"start":2147.53,"text":"So, there will be a little bit more math, but it's very fun."},{"start":2153.15,"text":"So, we're going to talk a little bit about direct preference optimization."},{"start":2155.91,"text":"optimization. So the RLHF pipeline I described, some of you might find it complex or some of you"},{"start":2163.21,"text":"might find it easy. But in practice, when we try to do this at very large scale models,"},{"start":2167.69,"text":"it can be quite expensive. So let's say you're like training a hundred billion parameter model,"},{"start":2176.91,"text":"maybe a trillion parameter model. You have to sample every answer and then query a reward model."},{"start":2183.55,"text":"and depending on the rl algorithm you use um you you have to compute like value functions and like"},{"start":2193.23,"text":"other things just to optimize the model and you don't have to understand this figure i put it"},{"start":2199.67,"text":"specifically to scare you guys um so here like there's just like a whole flow of things that"},{"start":2206.49,"text":"in practice can be fairly hard to get right and the more parameters you have in the system the"},{"start":2211.95,"text":"the harder it is to get it right."},{"start":2214.89,"text":"So RLHF can be pretty complex."},{"start":2218.69,"text":"So when we were looking into diet preference optimization,"},{"start":2221.89,"text":"our goal was to, like, can we make this a lot simpler?"},{"start":2226.63,"text":"And yeah, as I said, they have some initial pipeline"},{"start":2231.15,"text":"which we fit in RMV, like, take an instruction-tuned model"},{"start":2235.57,"text":"and produce a final RLHF model."},{"start":2238.45,"text":"But if you look at the whole process,"},{"start":2240.73,"text":"like we have a language model"},{"start":2242.51,"text":"and we're collecting some preferences"},{"start":2244.49,"text":"Why can we just not directly train on the preference data and directly optimize the parameter models? Why do we have to learn this intermediate quantity, like a reward model? And why can't we just directly go from preferences and optimize our language model? So that's really why it's called direct preference optimization, is that we find a way to go from preferences to optimizing the language model. And the way we do it is that at a very high level,"},{"start":2272.94,"text":"We want to be able to write the reward model in terms of our language model itself. Why do we want to do that? Because we fit our reward model to the preference data through a fairly simple classification loss, the Bradley-Terry loss we discussed. If we can just connect the reward model and the language model, instead of having a separate process, we can just take the language model parameters and fit it through the loss directly."},{"start":2299.9,"text":"And that's really the high-level motivation for direct preference optimization. So this part of the math gets a little bit slightly intense, so I'll go through this slowly. So we discussed the scale-constrained RL objective in the last few slides, where we want to maximize the expected reward."}],"speech_gaps":[],"frame":"../frames/v036/014.webp","frame_time":2159.53},{"title":"强化学习在大语言模型中的应用","segments":[{"id":119,"text":"with some KL penalties such that the model should not drift away from the instruction fine-tuned model a lot. So this, again, the parameters we're going to optimize is P theta RL, P pre-trained, and RM are fixed. And for now, we can like, yeah, we're just assuming some kind of a reward model here. It turns out that this equation actually has a closed-form solution.","zh":"带有一些KL惩罚项，使得模型不应该偏离指令微调模型太多。因此，我们所要优化的参数是P theta RL，而P pre-trained和RM是固定的。现在，我们可以假设某种奖励模型。结果发现，这个方程实际上有一个闭式解。","start":2326.28,"end":2348.12},{"id":120,"text":"And this is not possible if you're doing just the regular expected reward maximization. But once you add a KL constraint, it turns out that you can write out a closed form solution to this equation, which is really cool. It's rare to find such things. And the solution looks something like this. This is the optimal policy. P star, we're going to compute probabilities over y hat conditioned over x.","zh":"如果你只是进行常规的期望奖励最大化，这是不可能的。但一旦你加入KL约束，结果发现你可以写出这个方程的闭式解，这真的很棒。很难找到这样的东西。这个解看起来像这样。这是最优策略P star，我们将计算在给定x条件下y hat的概率。","start":2349.97,"end":2373.49},{"id":121,"text":"Roughly, this optimal quantity says that we ignore the zx for now. We have our pre-trained model p pre-trained y hat given x. And we're going to multiply the log probabilities with the exponentiated reward. So very simply put, if a sentence has a higher reward, so if y hat has a higher reward,","zh":"大致来说，这个最优量表示我们现在忽略zx。我们有预训练模型p pre-trained y hat给定x。我们将对数概率与指数化奖励相乘。非常简单地说，如果一个句子的奖励更高，即如果y hat的奖励更高，","start":2375.23,"end":2401.91},{"id":122,"text":"we're going to upweight the probabilities under the optimal distribution by an exponentiated reward by beta. High reward, high exponent, higher probability under the optimal policy. If the reward is low, it's going to be downweighted by exponential reward as well. And zx here is just a normalizing factor, which ensures that this quantity is a probability distribution. So really, you only need to focus on the numerator, and that's it.","zh":"我们将在最优分布下的概率上通过一个指数化奖励乘以beta来加权。高奖励意味着高指数，从而在最优策略下有更高的概率。如果奖励较低，也会通过指数化奖励进行降权。这里的zx只是一个归一化因子，确保这个量是一个概率分布。因此，你只需要关注分子部分，就可以了。","start":2402.64,"end":2431.97},{"id":123,"text":"You'll have to take my word for that this is the optimal solution for the above equation. Maybe I can share something later on, like how to derive this. But yeah, cool. Now, this is like where the key observation comes in, is that because we have this optimal solution to the above equation, we can rewrite the reward model in terms of the optimal policy itself. So this lower equation is just like a rearrangement of the terms.","zh":"你得相信我，这是上述方程的最优解。也许我之后可以分享如何推导这个解。但总之，很棒。现在，关键观察点在于，因为我们有上述方程的最优解，我们可以将奖励模型用最优策略本身来重写。所以这个下式只是对项的重新排列。","start":2432.88,"end":2462.21},{"id":124,"text":"The reward model can be written as beta log P star upon PPT. And we have some beta log ZX term, which is a constant over Y. So again, just to make sure this makes sense intuitively as well, if a completion Y hat should have a high score, it will typically have a high probability under P star as well.","zh":"奖励模型可以表示为 beta log P 星号除以 PPT。我们还有一些 beta log ZX 项，这在 Y 上是一个常数。因此，再次确保从直觉上也能理解，如果一个完成 Y 帽应该具有高得分，那么它通常也会在 P 星号下具有高概率。","start":2463.18,"end":2489.65}],"notes":["本段讲解了在强化学习中如何通过引入KL散度惩罚项来约束模型偏离指令微调模型的程度。讲者指出，这种约束使得原本无法求解的期望奖励最大化问题可以得到闭式解，这在强化学习中是较为罕见的。","讲者进一步解释了最优策略的计算方式，即在预训练模型的基础上，通过将对数概率乘以指数化的奖励来调整概率分布。高奖励的句子会被赋予更高的概率，而低奖励的句子则会被降低权重。zx是一个归一化因子，确保最终结果是一个概率分布。","讲者提到，最优策略的计算仅需关注分子部分，归一化因子不影响最终的概率分布。这简化了计算过程，使得模型可以更高效地进行优化。","讲者指出，奖励模型可以表示为β乘以最优策略与预训练模型的对数比值。其中β是一个控制奖励权重的参数，而zx项是一个与Y无关的常数项。","最后，讲者强调，如果一个完成的句子Y hat应该具有高得分，那么它通常也会在最优策略P star下具有较高的概率。这表明奖励模型和最优策略之间存在紧密的联系。","讲者提到，虽然当前没有详细推导过程，但后续可能会分享如何推导这一结果。这表明该公式是通过某种数学推导得到的，而不是直接假设的。"],"formulas":[{"latex":"P^*(\\hat{y} | x) = \\frac{\\exp(\\beta R(\\hat{y}, x)) P_{\\text{pre-trained}}(\\hat{y} | x)}{Z_x}","symbols":"P^*(\\hat{y} | x) 表示最优策略下的条件概率，R(\\hat{y}, x) 是奖励函数，β 是奖励的权重参数，Z_x 是归一化因子。","explanation":"公式正确，表示最优策略下的条件概率，通过指数奖励函数和预训练模型的条件概率的乘积，除以归一化因子 Z_x。","evidence":"Roughly, this optimal quantity says that we ignore the zx for now. We have our pre-trained model p pre-trained y hat given x. And we're going to multiply the log probabilities with the exponentiated reward. So very simply put, if a sentence has a higher reward, so if y hat has a higher reward, we're going to upweight the probabilities under the optimal distribution by an exponentiated reward by beta. High reward, high exponent, higher probability under the optimal policy. If the reward is low, it's going to be downweighted by exponential reward as well. And zx here is just a normalizing factor, which ensures that this quantity is a probability distribution. So really, you only need to focus on the numerator, and that's it."},{"latex":"R(\\hat{y}, x) = \\beta \\log \\frac{P^*(\\hat{y} | x)}{P_{\\text{pre-trained}}(\\hat{y} | x)}","symbols":"R(\\hat{y}, x) 是奖励函数，β 是奖励的权重参数，P^*(\\hat{y} | x) 是最优策略下的条件概率，P_{\\text{pre-trained}}(\\hat{y} | x) 是预训练模型的条件概率。","explanation":"公式正确，表示奖励函数 R(\\hat{y}, x) 与最优策略和预训练模型的条件概率之间的关系，通过 β 乘以对数比值。","evidence":"The reward model can be written as beta log P star upon PPT. And we have some beta log ZX term, which is a constant over Y. So again, just to make sure this makes sense intuitively as well, if a completion Y hat should have a high score, it will typically have a high probability under P star as well."}],"uncertainties":["PPT 可能是 P_pre-trained 的缩写，但需要确认是否为正确术语。","beta log ZX term 中的 ZX 是否为 Z_x 的缩写，需要进一步确认。"],"diagram":"none","start":2326.28,"end":2489.65,"asr_flags":[],"math_clarifications":["公式中的归一化因子 Z_x 应确保整个表达式是一个有效的概率分布，即所有条件概率之和为 1。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2326.28,"text":"with some KL penalties such that the model should not drift away from the instruction fine-tuned model a lot. So this, again, the parameters we're going to optimize is P theta RL, P pre-trained, and RM are fixed. And for now, we can like, yeah, we're just assuming some kind of a reward model here. It turns out that this equation actually has a closed-form solution."},{"start":2349.97,"text":"And this is not possible if you're doing just the regular expected reward maximization. But once you add a KL constraint, it turns out that you can write out a closed form solution to this equation, which is really cool. It's rare to find such things. And the solution looks something like this. This is the optimal policy. P star, we're going to compute probabilities over y hat conditioned over x."},{"start":2375.23,"text":"Roughly, this optimal quantity says that we ignore the zx for now. We have our pre-trained model p pre-trained y hat given x. And we're going to multiply the log probabilities with the exponentiated reward. So very simply put, if a sentence has a higher reward, so if y hat has a higher reward,"},{"start":2402.64,"text":"we're going to upweight the probabilities under the optimal distribution by an exponentiated reward by beta. High reward, high exponent, higher probability under the optimal policy. If the reward is low, it's going to be downweighted by exponential reward as well. And zx here is just a normalizing factor, which ensures that this quantity is a probability distribution. So really, you only need to focus on the numerator, and that's it."},{"start":2432.88,"text":"You'll have to take my word for that this is the optimal solution for the above equation. Maybe I can share something later on, like how to derive this. But yeah, cool. Now, this is like where the key observation comes in, is that because we have this optimal solution to the above equation, we can rewrite the reward model in terms of the optimal policy itself. So this lower equation is just like a rearrangement of the terms."},{"start":2463.18,"text":"The reward model can be written as beta log P star upon PPT. And we have some beta log ZX term, which is a constant over Y. So again, just to make sure this makes sense intuitively as well, if a completion Y hat should have a high score, it will typically have a high probability under P star as well."}],"speech_gaps":[],"frame":"../frames/v036/015.webp","frame_time":2338.28},{"title":"强化学习在大语言模型中的应用","segments":[{"id":125,"text":"And PPT is something that's fixed. So beta log will be high whenever the reward model gives a high score. And similarly, like if a reward model assigns a poor score to Y hat, our optimal policy will typically assign a low probability to Y hat. And typically the beta log P star by PT will also be low. So the relationship sort of makes sense and we can ignore ZX for now. Cool.","zh":"并且PPT是固定的。因此，每当奖励模型给出高分时，beta log将会很高。同样地，如果奖励模型对Y hat给出差的评分，我们的最优策略通常会赋予Y hat较低的概率。通常情况下，beta log P star by PT也会很低。因此，这种关系在某种程度上是有道理的，我们现在可以暂时忽略ZX。酷。","start":2490.66,"end":2520.29},{"id":126,"text":"The main argument here is that this isn't just true for the optimal policy. You can always plug in some reward model p theta, and it will be optimal for some kind of reward model. And that's really like the observation you make here. And yeah, so we've just replaced p star with some kind of a learnable policy, given that our parameters theta represent the optimal policy for some kind of a reward model.","zh":"这里的主论点是，这不仅仅适用于最优策略。你总可以将某个奖励模型p theta代入，它会成为某种奖励模型的最优策略。而这正是你在这里观察到的。是的，因此我们已经将p star替换为某种可学习的策略，鉴于我们的参数theta代表了某种奖励模型的最优策略。","start":2522.13,"end":2551.67},{"id":127,"text":"And after that, it's simple. Given the relationship we have derived so far, we know this is how we fit our reward model through the Bradley-Terry laws. We want to make sure that the reward for the winning completion is higher than the reward for the losing completion. And so far, I've been asking you to ignore the partition function, but that was for a reason. The reason is that because the objective only optimizes for the difference between the rewards,","zh":"之后就很简单了。根据我们迄今为止推导出的关系，我们知道这是如何通过Bradley-Terry定律来拟合我们的奖励模型的。我们希望确保胜利完成的奖励高于失败完成的奖励。到目前为止，我一直在让你忽略分区函数，但这有其原因。原因是由于目标函数仅优化奖励之间的差异，","start":2552.65,"end":2583.07},{"id":128,"text":"the partition function zx just simply cancels out. So maybe I can write this out on the board. We started with the relation rm theta x comma y w and we had beta log p theta y w given x where y w is the winning completion and p","zh":"分区函数ZX会简单地被抵消掉。因此，也许我可以把它写在黑板上。我们从关系rm theta x comma y w开始，并且有beta log p theta y w given x，其中y w是胜利完成，p","start":2583.6,"end":2613.61},{"id":129,"text":"p, d, y, w, given x. So this is the relation we used with beta log zx. And we're going to rewrite the same thing for the losing completion as well. So x, y, l, beta log p of theta, which is the current parameters we're optimizing, y, l is our losing completion, conditioned on the input x, divided by the log probabilities under the pre-trained model.","zh":"p, d, y, w, given x。因此，这是我们使用beta log zx的关系。我们将同样地为失败完成重写这一关系。因此，x, y, l, beta log p of theta，这是当前我们正在优化的参数，y, l是我们失败的完成，条件在输入x上，除以预训练模型下的对数概率。","start":2614.86,"end":2652.55}],"notes":["本段讨论了强化学习在大语言模型中的应用，特别是如何通过奖励模型和最优策略之间的关系来调整模型行为。讲者提到，当奖励模型给出高分时，β log 会较高，而当奖励模型给出低分时，最优策略会赋予低概率。这表明奖励模型的评分直接影响策略的输出概率。","讲者进一步指出，这种关系不仅适用于最优策略，还可以通过任意奖励模型来实现。这意味着，只要给定一个奖励模型，就可以找到一个最优策略，这为模型的训练和优化提供了理论基础。","接下来，讲者提到如何通过 Bradley-Terry 法则来拟合奖励模型，确保胜利完成的奖励高于失败完成的奖励。同时，讲者指出，由于目标仅优化奖励之间的差异，因此分区函数可以忽略，因为它在计算中会自动抵消。","讲者提到，他们将从关系 rm(theta, x, y_w) 开始，其中 y_w 是胜利完成，p(theta, y_w | x) 是给定输入 x 时的条件概率。然后，他们将为失败完成重新写出相同的关系，即 x, y_l, beta log p(theta, y_l | x) 除以预训练模型下的对数概率。","这些内容展示了如何通过奖励模型和策略之间的相互作用来优化大语言模型的行为，特别是在生成文本时如何确保生成的文本符合预期的奖励标准。"],"formulas":[{"latex":"\\frac{\\beta \\log P(\\theta, y_l | x)}{\\log P_{\\text{pretrained}}(y_l | x)}","symbols":"β log P(θ, y_l | x) / log P_pretrained(y_l | x)","explanation":"该公式在上下文中被提及，且其结构符合概率比的表达方式，因此保留。","evidence":"p, d, y, w, given x. So this is the relation we used with beta log zx. And we're going to rewrite the same thing for the losing completion as well. So x, y, l, beta log p of theta, which is the current parameters we're optimizing, y, l is our losing completion, conditioned on the input x, divided by the log probabilities under the pre-trained model."}],"uncertainties":["rm(theta, x, y_w) 的具体定义和形式未明确，可能涉及奖励模型的参数化方式。","P(theta, y_w | x) 的具体形式和计算方式未明确，可能涉及策略的参数化方式。","log P_pretrained(y_l | x) 的具体形式和计算方式未明确，可能涉及预训练模型的对数概率计算方式。"],"diagram":"none","start":2490.66,"end":2652.55,"asr_flags":[],"math_clarifications":["P* 未被定义，且 β log P* 无法与上下文中的其他公式建立明确的数学关系，因此移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":2490.66,"text":"And PPT is something that's fixed. So beta log will be high whenever the reward model gives a high score. And similarly, like if a reward model assigns a poor score to Y hat, our optimal policy will typically assign a low probability to Y hat. And typically the beta log P star by PT will also be low. So the relationship sort of makes sense and we can ignore ZX for now. Cool."},{"start":2522.13,"text":"The main argument here is that this isn't just true for the optimal policy. You can always plug in some reward model p theta, and it will be optimal for some kind of reward model. And that's really like the observation you make here. And yeah, so we've just replaced p star with some kind of a learnable policy, given that our parameters theta represent the optimal policy for some kind of a reward model."},{"start":2552.65,"text":"And after that, it's simple. Given the relationship we have derived so far, we know this is how we fit our reward model through the Bradley-Terry laws. We want to make sure that the reward for the winning completion is higher than the reward for the losing completion. And so far, I've been asking you to ignore the partition function, but that was for a reason. The reason is that because the objective only optimizes for the difference between the rewards,"},{"start":2583.6,"text":"the partition function zx just simply cancels out. So maybe I can write this out on the board. We started with the relation rm theta x comma y w and we had beta log p theta y w given x where y w is the winning completion and p"},{"start":2614.86,"text":"p, d, y, w, given x. So this is the relation we used with beta log zx. And we're going to rewrite the same thing for the losing completion as well. So x, y, l, beta log p of theta, which is the current parameters we're optimizing, y, l is our losing completion, conditioned on the input x, divided by the log probabilities under the pre-trained model."}],"speech_gaps":[],"frame":"../frames/v036/016.webp","frame_time":2502.66},{"title":"强化学习在大语言模型中的应用","segments":[{"id":130,"text":"y, l, condition of x, and beta log zx. Now notice that the reward model is like, the input is the same to the reward model. So we're using the same text, and we're summarizing the same text, so the input is actually the same. So when we're going to subtract this, we're going to subtract these and this, and this is just simply going to cancel out. The reason why canceling out of this is important is that zx is actually intractable to compute. It's not something we can...","zh":"y, l, x 的条件，以及 beta log zx。现在请注意，奖励模型的输入与奖励模型本身是相同的。因此，我们使用的是相同的文本，并对相同的文本进行总结，因此输入实际上是一样的。当我们进行减法操作时，我们将减去这些部分和这部分，而这部分将简单地相互抵消。之所以抵消这部分很重要，是因为 zx 实际上是难以计算的。这不是我们能够真正计算的东西。","start":2653.11,"end":2684.89},{"id":131,"text":"compute for real. So we get this relation that you can see over here. The difference between the reward models is simply the difference between the beta log ratios. So taking this identity, which we have just derived, we simply plug it into the original Bradley-Terry loss and we get something super nice.","zh":"因此，我们得到了这样一个关系，如你在这里所看到的。奖励模型之间的差异仅仅是 beta 对数比率之间的差异。因此，利用我们刚刚推导出的这个恒等式，我们将其直接代入原始的 Bradley-Terry 损失函数，我们就能得到一个非常漂亮的结果。","start":2685.28,"end":2712.32},{"id":132,"text":"is that we'll have a dataset of, again, input, winning output, losing output, and we're going to optimize this objective directly for the language model parameters. And this is a classification objective, by the way. So we're not doing any RL loop anymore. We are going directly from the preference dataset and optimizing the language parameter models themselves.","zh":"这是因为我们将有一个数据集，包括输入、获胜输出和失败输出，我们将直接针对语言模型参数优化这个目标。顺便说一句，这是一个分类目标。因此，我们不再进行任何强化学习循环。我们直接从偏好数据集中出发，优化语言参数模型本身。","start":2712.97,"end":2738.09},{"id":133,"text":"Yes. So initially, they'll be the same, but the gradient would only back-propagate through the p-thetas.","zh":"是的。因此，初始时它们会相同，但梯度只会通过 p-thetas 进行反向传播。","start":2739.11,"end":2746.31},{"id":134,"text":"PPD will remain the same throughout, and it will increase the probability of the winning completion and decrease the probability of the losing completion.","zh":"PPD 将在整个过程中保持不变，并且会增加获胜完成的概率，同时降低失败完成的概率。","start":2746.91,"end":2756.07},{"id":135,"text":"So let's spend a little bit of time here again.","zh":"因此，我们在这里再花一点时间。","start":2756.97,"end":2760.13},{"id":136,"text":"gain. This objective will try to encourage the RM theta for the winning completion to go up","zh":"收益。这个目标将试图鼓励获胜完成的 RM theta 上升","start":2760.13,"end":2766.67},{"id":137,"text":"and RM theta for the losing completion to go down. But the way to increase RM theta is to increase","zh":"并使失败完成的 RM theta 下降。但提高 RM theta 的方法是提高","start":2766.67,"end":2773.65},{"id":138,"text":"the probability of YW under the current model and decrease the probability of the losing one","zh":"在当前模型下，提高YW的概率并降低失败一方的概率","start":2773.65,"end":2780.23},{"id":139,"text":"under the current model. It's a very intuitive objective, right? Like good thing go up, bad thing","zh":"在当前模型下。这是一个非常直观的目标，对吧？比如好的事情上升，坏的事情","start":2780.23,"end":2784.91},{"id":140,"text":"go down and finally you can do it without RL or like any like complexity so the question is can","zh":"下降，最后你可以不用强化学习或者任何复杂的步骤，所以问题是，我们能否做类似蒸馏的事情，而不是这个？问题是，对于奖励模型，","start":2784.91,"end":2791.91},{"id":141,"text":"we do something like distillation without instead of this the question is like so for the reward","zh":"你首先必须以某种方式获得奖励模型，对吧？没有人存在，没有像那么容易的方法","start":2791.91,"end":2801.31},{"id":142,"text":"model like you first have to get a reward model somehow right no one's there's no like easy way","zh":"来获得它，因此你必须收集某种偏好数据，才能开始获得奖励","start":2801.31,"end":2807.63},{"id":143,"text":"to get it so you have to collect some kind of preference data to even begin with to get a reward","zh":"模型，这就是DPO的作用，即如果你已经收集了偏好数据，而不是拟合一个显式的奖励模型，你可以直接优化语言模型的参数","start":2807.63,"end":2812.85},{"id":144,"text":"model and that's where dpo comes in is that like if you have collected a preference data instead","zh":"直接优化语言模型的参数","start":2812.85,"end":2818.29},{"id":145,"text":"of fitting an explicit reward model you can optimize your language model parameters directly","zh":"在拟合显式奖励模型的情况下，你可以直接优化语言模型的参数","start":2818.29,"end":2822.29},{"id":146,"text":"yeah so the question is like there's a penalty for pre-trained model with not drifting too far from","zh":"是的，所以问题是，对于没有偏离太远的预训练模型，会有一个惩罚项","start":2824.21,"end":2829.69}],"notes":["本段讲解了在强化学习中如何利用奖励模型进行优化，通过比较奖励模型的差异，可以简化计算。输入文本相同，因此在计算时可以相互抵消，从而避免计算难以处理的zx项。这种简化使得优化过程更加高效。","讲者提到，通过将推导出的等式代入原始的Bradley-Terry损失函数，可以得到一个非常简洁的优化目标。这表明，通过数学推导可以简化复杂的优化过程。","讲者指出，优化目标是一个分类任务，直接从偏好数据集优化语言模型参数，而不再需要进行强化学习循环。这表明，这种方法可以避免复杂的强化学习过程。","讲者提到，梯度仅通过p-theta传播，这表明在优化过程中，模型参数的更新仅依赖于特定部分的梯度，而不是整个模型。","讲者强调，PPD（概率分布）在整个过程中保持不变，但会增加获胜完成的概率，降低失败完成的概率。这表明，优化目标是通过调整概率分布来实现的。","讲者提到，可以通过收集偏好数据来构建奖励模型，而无需显式地拟合奖励模型。这表明，DPO（Direct Preference Optimization）方法可以替代传统的奖励模型构建过程。"],"formulas":[],"uncertainties":["beta log zx","RM theta","YW"],"diagram":"none","start":2653.11,"end":2829.69,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":2653.11,"text":"y, l, condition of x, and beta log zx. Now notice that the reward model is like, the input is the same to the reward model. So we're using the same text, and we're summarizing the same text, so the input is actually the same. So when we're going to subtract this, we're going to subtract these and this, and this is just simply going to cancel out. The reason why canceling out of this is important is that zx is actually intractable to compute. It's not something we can..."},{"start":2685.28,"text":"compute for real. So we get this relation that you can see over here. The difference between the reward models is simply the difference between the beta log ratios. So taking this identity, which we have just derived, we simply plug it into the original Bradley-Terry loss and we get something super nice."},{"start":2712.97,"text":"is that we'll have a dataset of, again, input, winning output, losing output, and we're going to optimize this objective directly for the language model parameters. And this is a classification objective, by the way. So we're not doing any RL loop anymore. We are going directly from the preference dataset and optimizing the language parameter models themselves."},{"start":2739.11,"text":"Yes. So initially, they'll be the same, but the gradient would only back-propagate through the p-thetas."},{"start":2746.91,"text":"PPD will remain the same throughout, and it will increase the probability of the winning completion and decrease the probability of the losing completion."},{"start":2756.97,"text":"So let's spend a little bit of time here again."},{"start":2760.13,"text":"gain. This objective will try to encourage the RM theta for the winning completion to go up"},{"start":2766.67,"text":"and RM theta for the losing completion to go down. But the way to increase RM theta is to increase"},{"start":2773.65,"text":"the probability of YW under the current model and decrease the probability of the losing one"},{"start":2780.23,"text":"under the current model. It's a very intuitive objective, right? Like good thing go up, bad thing"},{"start":2784.91,"text":"go down and finally you can do it without RL or like any like complexity so the question is can"},{"start":2791.91,"text":"we do something like distillation without instead of this the question is like so for the reward"},{"start":2801.31,"text":"model like you first have to get a reward model somehow right no one's there's no like easy way"},{"start":2807.63,"text":"to get it so you have to collect some kind of preference data to even begin with to get a reward"},{"start":2812.85,"text":"model and that's where dpo comes in is that like if you have collected a preference data instead"},{"start":2818.29,"text":"of fitting an explicit reward model you can optimize your language model parameters directly"},{"start":2824.21,"text":"yeah so the question is like there's a penalty for pre-trained model with not drifting too far from"}],"speech_gaps":[],"frame":"../frames/v036/017.webp","frame_time":2665.11},{"title":"强化学习在大语言模型中的应用","segments":[{"id":147,"text":"the pre-trained model actually does this, so this is a good question, so","zh":"预训练模型实际上就是这样做的，所以这是一个好问题，所以","start":2829.69,"end":2834.35},{"id":148,"text":"our loss function is set up as a log sigmoid, so one property with the sigmoid is that the gradients","zh":"我们的损失函数设置为对数sigmoid函数，因此，sigmoid函数的一个特性是，当差异变得","start":2835.07,"end":2840.55},{"id":149,"text":"vanish when the difference becomes","zh":"足够大时，梯度会消失","start":2840.55,"end":2842.73},{"id":150,"text":"is already sufficiently large","zh":"已经足够大","start":2842.73,"end":2844.63},{"id":151,"text":"and the difference becomes sufficiently large","zh":"并且差异变得足够大","start":2844.63,"end":2846.93},{"id":152,"text":"like faster than the","zh":"比","start":2846.93,"end":2847.91},{"id":153,"text":"so the beta parameter actually","zh":"所以beta参数实际上","start":2847.91,"end":2850.59},{"id":154,"text":"controls how quickly the difference","zh":"控制差异变化的速度","start":2850.59,"end":2852.53},{"id":155,"text":"becomes large","zh":"变得很大","start":2852.53,"end":2853.09},{"id":156,"text":"So if you have a very high beta, even a small discrepancy would suddenly saturate the sigmoid and it would not change the parameters a lot. The question is, is the main advantage of DPO that you don't have to train a reward model? The way I would say it is that you are training a reward model because you're using the same objective.","zh":"因此，如果你有一个非常高的 beta 值，即使是很小的差异也会突然使 sigmoid 饱和，并且不会对参数产生很大变化。问题是，DPO 的主要优势是否在于你不需要训练奖励模型？我的说法是，你实际上是在训练奖励模型，因为你使用的是相同的优化目标。","start":2854.31,"end":2875.87},{"id":157,"text":"The DPO provides a connection between the reward model and the corresponding optimal policy for it. So you don't have to do an explicit RL loop to go from the reward model to an optimal policy for it. We have cleverly parameterized the reward model in terms of the language model itself. So when you fit a reward model to the preference data, you are optimizing the language model itself.","zh":"DPO 为奖励模型和对应的最优策略之间建立了联系。因此，你不需要显式的强化学习循环，就可以从奖励模型得到对应的最优策略。我们巧妙地将奖励模型参数化为语言模型本身。因此，当你将奖励模型拟合到偏好数据时，你实际上是在优化语言模型本身。","start":2876.73,"end":2903.63},{"id":158,"text":"So the question is, do we still need to do RLHF or not, given this is cheaper? I think it depends a lot on situation. I think there's still some purported benefits to RLHF because you can expect some kind of generalization from the reward model, which allows you to grade generations which might not have been seen in preference data.","zh":"问题是，考虑到这更便宜，我们是否仍然需要进行 RLHF？我认为这取决于具体情况。我认为 RLHF 仍然有一些潜在的好处，因为你可以期望从奖励模型中获得某种泛化能力，这使你能够评估那些在偏好数据中没有出现的生成内容。","start":2904.68,"end":2929.34},{"id":159,"text":"So there's still some benefit to it. So it depends upon your budget and what you want to achieve. So the question I get is that the KL divergence, why are we relying on the sigmoid when initially the KL divergence was not related to the sigmoid? To be more clear or precise, I think it's the beta term, which controls how fast, how much you're allowed to drift away. And even in the original RL objective,","zh":"因此，它仍然有一些好处。因此，这取决于你的预算和你想实现的目标。我经常被问到的问题是，KL 散度，为什么我们最初与 sigmoid 无关的情况下，现在却依赖于 sigmoid？更明确或准确地说，我认为是 beta 项，它控制着你允许偏离的速度和程度。甚至在原始的强化学习目标中，","start":2930.37,"end":2960.15},{"id":160,"text":"this beta term is what controls the divergence between, allow divergence between our current model and the pre-trained model. So if the beta is really high, you are not allowed to diverge at all because you'll be penalized a lot more. Yes. So like the beta controls the strength or the weight on this divergence.","zh":"这个 beta 项就是控制当前模型与预训练模型之间差异的。因此，如果 beta 值非常高，你将完全不允许偏离，因为你会受到更多的惩罚。是的。因此，beta 控制着这种差异的强度或权重。","start":2961.66,"end":2983.68}],"notes":["本段讨论了DPO（Direct Preference Optimization）方法，强调其不需要显式训练奖励模型，而是通过参数化奖励模型来优化语言模型本身。同时，讲者提到DPO通过β参数控制模型与预训练模型之间的差异，β值越高，允许的差异越小，从而影响梯度消失的问题。","讲者进一步解释了β参数的作用，指出它控制了模型与预训练模型之间的发散程度。当β值很高时，模型不能偏离预训练模型太多，否则会受到较大的惩罚。这与使用sigmoid函数时的梯度消失现象相关，β参数在原始强化学习目标中也起到类似作用。","讲者还提到，尽管DPO方法在计算上更高效，但仍然可能需要使用RLHF（Reward Modeling + Human Feedback）来获得更好的泛化能力，特别是在处理未见过的生成内容时。","在讨论KL散度与sigmoid函数的关系时，讲者指出β参数是连接两者的关键，它控制了模型允许偏离的程度。这表明在强化学习目标中，KL散度与sigmoid函数的使用并非完全独立，而是通过β参数进行调节。","讲者强调，β参数的设置对模型训练至关重要，它决定了模型在优化过程中对差异的容忍度。这影响了梯度的传播和模型的最终性能。","最后，讲者指出，DPO方法虽然简化了训练流程，但其效果仍依赖于β参数的合理设置，以及对奖励模型的正确参数化。这表明在实际应用中，需要权衡计算成本与模型性能之间的关系。"],"formulas":[{"latex":"KL(q||p) = \\text{E}_q[\\log \\frac{q(x)}{p(x)}]","symbols":"KL散度表示两个概率分布之间的差异","explanation":"公式正确，KL散度的定义符合数学规范，使用了正确的期望符号和对数形式。","evidence":"So there's still some benefit to it. So it depends upon your budget and what you want to achieve. So the question I get is that the KL divergence, why are we relying on the sigmoid when initially the KL divergence was not related to the sigmoid? To be more clear or precise, I think it's the beta term, which controls how fast, how much you're allowed to drift away. And even in the original RL objective,"}],"uncertainties":["the difference becomes sufficiently large","like faster than the"],"diagram":"none","start":2829.69,"end":2983.68,"asr_flags":[],"math_clarifications":["损失函数中的log和sigmoid函数的组合需要更明确的数学定义，例如是否为对数似然或对数概率。KL散度的使用需要更详细的上下文，如分布的定义和参数的说明。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":14,"raw_segments":[{"start":2829.69,"text":"the pre-trained model actually this does do that so this is this is a good question so"},{"start":2835.07,"text":"our loss function is set up as a log sigmoid so one property with the sigmoid is that the gradients"},{"start":2840.55,"text":"vanish when the difference becomes"},{"start":2842.73,"text":"is already sufficiently large"},{"start":2844.63,"text":"and the difference becomes sufficiently large"},{"start":2846.93,"text":"like faster than the"},{"start":2847.91,"text":"so the beta parameter actually"},{"start":2850.59,"text":"controls how quickly the difference"},{"start":2852.53,"text":"becomes large"},{"start":2854.31,"text":"So if you have a very high beta, even a small discrepancy would suddenly saturate the sigmoid and it would not change the parameters a lot. The question is, is the main advantage of DPO that you don't have to train a reward model? The way I would say it is that you are training a reward model because you're using the same objective."},{"start":2876.73,"text":"The DPO provides a connection between the reward model and the corresponding optimal policy for it. So you don't have to do an explicit RL loop to go from the reward model to an optimal policy for it. We have cleverly parameterized the reward model in terms of the language model itself. So when you fit a reward model to the preference data, you are optimizing the language model itself."},{"start":2904.68,"text":"So the question is, do we still need to do RLHF or not, given this is cheaper? I think it depends a lot on situation. I think there's still some purported benefits to RLHF because you can expect some kind of generalization from the reward model, which allows you to grade generations which might not have been seen in preference data."},{"start":2930.37,"text":"So there's still some benefit to it. So it depends upon your budget and what you want to achieve. So the question I get is that the KL divergence, why are we relying on the sigmoid when initially the KL divergence was not related to the sigmoid? To be more clear or precise, I think it's the beta term, which controls how fast, how much you're allowed to drift away. And even in the original RL objective,"},{"start":2961.66,"text":"this beta term is what controls the divergence between, allow divergence between our current model and the pre-trained model. So if the beta is really high, you are not allowed to diverge at all because you'll be penalized a lot more. Yes. So like the beta controls the strength or the weight on this divergence."}],"speech_gaps":[],"frame":"../frames/v036/018.webp","frame_time":2841.69},{"title":"强化学习在大语言模型中的应用","segments":[{"id":161,"text":"That's a good question. Yeah. So there's two kinds of sampling involved right now. First, we want to create a preference data set where humans label their preferences. And then during the RL optimization itself, we want to sample to get a score under some kind of an external or explicit reward model. And then we score and then we optimize. So we are taking care of the second sampling step, but the first sampling step is still needed.","zh":"这是一个好问题。是的。目前涉及两种类型的采样。首先，我们想要创建一个偏好数据集，其中人类标注他们的偏好。然后在强化学习优化过程中，我们想要进行采样以在某种外部或显式的奖励模型下获得一个得分。然后我们进行评分，然后进行优化。因此，我们处理了第二步的采样，但第一步的采样仍然是必需的。","start":2984.68,"end":3011.12},{"id":162,"text":"Yeah, that's a good question. So when you're doing online RL or some kind of RLHF procedure, you don't only need the prompts. You don't need a preference data set. So typically, the set of prompts which is used during RL is larger than the set of prompts you use during preference training. Yeah, that's a good question. So I think the question basically tries to ask, can we take into account the strength of the preference and not just a binary label?","zh":"是的，这是一个好问题。当你进行在线强化学习或某种强化学习与人类反馈（RLHF）过程时，你不仅需要提示（prompts）。你不需要一个偏好数据集。因此，通常在强化学习过程中使用的提示集合比在偏好训练过程中使用的提示集合更大。是的，这是一个好问题。我认为这个问题基本上是在问，我们能否考虑偏好的强度，而不仅仅是二元标签？","start":3012.01,"end":3039.56},{"id":163,"text":"I think this is a limitation for both RLHF and DPO, I think. So giving more insight, typically when we collect preference data sets, we ask annotators to give a strength for their preferences, and we only keep the preferences which are strong. But this isn't a resolved problem. How to learn from noisy data and low preferences or high strength preferences is still an undersolved problem.","zh":"我认为这是RLHF和DPO的共同限制。通常，当我们收集偏好数据集时，我们会要求标注者给出他们偏好的强度，并且我们只保留强度较高的偏好。但这个问题仍未得到解决。如何从嘈杂的数据和低强度偏好或高强度偏好中进行学习仍然是一个未解决的问题。","start":3040.3,"end":3069.24},{"id":164,"text":"And yeah, like these are some of the results for direct preference optimization. We showed like a theoretical equivalence between doing the DPO objective and doing a KL-constrained RL procedure. And in practice, when we try to look at the summarization task and try to measure win rates like we were doing earlier, we do actually find that like it does similar or better. But this is like a debatable question. So like, yeah, but like in general.","zh":"是的，这些是一些直接偏好优化（DPO）的结果。我们展示了在执行DPO目标和执行KL约束的强化学习过程之间存在理论上的等价性。在实践中，当我们尝试查看摘要任务并尝试测量胜率（如我们之前所做的）时，我们确实发现它表现得相似或更好。但这是一个有争议的问题。因此，总的来说。","start":3070.16,"end":3098.4},{"id":165,"text":"It does pretty well. The beta parameter that... Do you see this beta parameter here? That corresponds exactly to the beta parameter, which is the extra hyperparameter. So I'm just going to summarize what we have learned so far, and then we'll move on to where things are missing and so on.","zh":"它表现得相当不错。这里的beta参数……你们看到这个beta参数了吗？它正好对应于额外的超参数beta。因此，我将总结到目前为止我们所学到的内容，然后我们继续讨论缺失的部分等等。","start":3099.05,"end":3120.65},{"id":166,"text":"We want to optimize for human preferences because, first of all, it's more aligned with the objectives we want. The way we use these models are more closely aligned with improving human engagement or satisfying human preferences. So we want to optimize for that directly as well. And instead of relying on uncalibrated scores from different annotators, we try to collect preferences and then learn a reward model of some form, either through DPO or through RLHF, and improve the model through that.","zh":"我们希望优化以符合人类偏好，因为首先，这更符合我们想要实现的目标。我们使用这些模型的方式更贴近于提升人类参与度或满足人类偏好。因此，我们也希望直接优化这一点。而不是依赖不同标注者提供的未经校准的得分，我们尝试收集偏好，然后学习某种形式的奖励模型，无论是通过DPO还是通过RLHF，并通过这种方式改进模型。","start":3122.7,"end":3151.41}],"notes":["本段讨论了在强化学习（RL）中如何处理人类偏好数据的问题。讲者指出，在进行在线强化学习或RLHF（强化学习与人类反馈）过程中，除了需要提示（prompts）外，还需要偏好数据集。通常，用于强化学习的提示集比用于偏好训练的提示集更大。此外，讲者提到，当前的偏好数据集收集方法通常要求标注者提供偏好强度，并仅保留强度较高的偏好，但如何从噪声数据或低强度偏好中学习仍然是一个未解决的问题。","讲者进一步指出，直接偏好优化（DPO）与KL约束的强化学习过程在理论上是等价的。在实践中，当评估摘要任务的胜率时，DPO表现得与传统方法相似或更好。然而，这一结论仍存在争议，因此需要进一步研究。","讲者提到，β参数在DPO中扮演重要角色，它是一个额外的超参数。通过总结当前的学习成果，讲者指出，优化人类偏好是更符合目标的，因为这与提高人类参与度或满足人类偏好更一致。因此，应直接优化人类偏好，而不是依赖不同标注者的未校准评分。","讲者强调，通过收集偏好并学习奖励模型（如DPO或RLHF），可以改进模型。这种方法避免了依赖未校准的评分，而是通过直接优化人类偏好来提升模型性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2984.68,"end":3151.41,"asr_flags":[],"math_clarifications":["原文中提到的KL-constrained RL和β参数没有提供具体的数学公式或定义，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2984.68,"text":"That's a good question. Yeah. So there's two kinds of sampling involved right now. First, we want to create a preference data set where humans label their preferences. And then during the RL optimization itself, we want to sample to get a score under some kind of an external or explicit reward model. And then we score and then we optimize. So we are taking care of the second sampling step, but the first sampling step is still needed."},{"start":3012.01,"text":"Yeah, that's a good question. So when you're doing online RL or some kind of RLHF procedure, you don't only need the prompts. You don't need a preference data set. So typically, the set of prompts which is used during RL is larger than the set of prompts you use during preference training. Yeah, that's a good question. So I think the question basically tries to ask, can we take into account the strength of the preference and not just a binary label?"},{"start":3040.3,"text":"I think this is a limitation for both RLHF and DPO, I think. So giving more insight, typically when we collect preference data sets, we ask annotators to give a strength for their preferences, and we only keep the preferences which are strong. But this isn't a resolved problem. How to learn from noisy data and low preferences or high strength preferences is still an undersolved problem."},{"start":3070.16,"text":"And yeah, like these are some of the results for direct preference optimization. We showed like a theoretical equivalence between doing the DPO objective and doing a KL-constrained RL procedure. And in practice, when we try to look at the summarization task and try to measure win rates like we were doing earlier, we do actually find that like it does similar or better. But this is like a debatable question. So like, yeah, but like in general."},{"start":3099.05,"text":"It does pretty well. The beta parameter that... Do you see this beta parameter here? That corresponds exactly to the beta parameter, which is the extra hyperparameter. So I'm just going to summarize what we have learned so far, and then we'll move on to where things are missing and so on."},{"start":3122.7,"text":"We want to optimize for human preferences because, first of all, it's more aligned with the objectives we want. The way we use these models are more closely aligned with improving human engagement or satisfying human preferences. So we want to optimize for that directly as well. And instead of relying on uncalibrated scores from different annotators, we try to collect preferences and then learn a reward model of some form, either through DPO or through RLHF, and improve the model through that."}],"speech_gaps":[],"frame":"../frames/v036/019.webp","frame_time":2996.68},{"title":"强化学习在大语言模型中的应用","segments":[{"id":167,"text":"In our LHF, we learn an explicit reward model, which gives an explicit score for every completion we sample, and we use that to optimize the language model parameters. And we typically impose some kind of KL constraint to make sure that our model does not drift too far from where it was initialized. It's very effective, maybe sometimes even more effective than DPO, but can be a little tricky to get right, and it's computationally expensive because of the sampling procedure that needs to be done.","zh":"在我们的LHF中，我们学习一个显式的奖励模型，该模型为每个我们采样的完成项提供一个显式的得分，并且我们使用该得分来优化语言模型的参数。我们通常施加某种KL约束，以确保我们的模型不会偏离初始化的位置太远。这种方法非常有效，有时甚至比DPO更有效，但要正确实现可能有点棘手，并且由于需要进行采样过程，计算成本较高。","start":3153.42,"end":3181.49},{"id":168,"text":"And in direct preference optimization, we can completely skip the sampling part and optimize directly on the preference data by posing it as a binary classification problem. Cool. And it's very simple and effective and does not require an online step. So where does this all lead us? We have discussed all the RLHF and DPO stuff.","zh":"而在直接偏好优化中，我们可以完全跳过采样部分，通过将问题建模为二分类问题，直接在偏好数据上进行优化。很酷。这种方法非常简单且有效，并且不需要在线步骤。那么这一切将引导我们走向何方？我们已经讨论了所有关于RLHF和DPO的内容。","start":3182.58,"end":3205.96},{"id":169,"text":"These are roughly how the chatbots are built, by the way. So this is the InstructGPD pipeline. This was like one of the first like instruction, like first chatbots, which was available to public and they interacted with it. And it worked pretty well. Like it can do a lot of tasks. It can answer general purpose questions. And yeah, InstructGPD like...","zh":"顺便说一句，这些就是聊天机器人的大致构建方式。这就是InstructGPD流程。这类似于第一个指令型、第一个聊天机器人，它向公众开放，并且可以与之互动。它表现得相当不错。它可以完成许多任务。它可以回答通用问题。是的，InstructGPD就像……","start":3207.29,"end":3233.81},{"id":170,"text":"This is a comparison between what the pre-trained model gives as an answer versus what an instruction tuned or an RLHF model gives as an answer. And yeah, these are some examples. And yeah, we have optimized these models for dialogue. It's not just summaries, I want to say. We can optimize them for many, many general purpose tasks.","zh":"这是比较预训练模型给出的答案与指令微调或RLHF模型给出的答案。是的，这些都是一些例子。是的，我们已经针对对话对这些模型进行了优化。这不仅仅是摘要，我想说的是。我们可以针对许多、许多通用任务对它们进行优化。","start":3234.36,"end":3258.25},{"id":171,"text":"The more data you collect, more tasks you cover, the better these models are going to do, the better they're going to understand the intent, and the better they're going to respond to all of our needs. And yeah, DPO has been used a lot in the open source community ever since it was launched. It's fairly cheap, works, it's pretty performant. And at some point, all LLMs were using DPO to get their alignment with human feedback.","zh":"你收集的数据越多，覆盖的任务越多，这些模型的表现就会越好，它们对意图的理解也会越深入，并且能够更好地满足我们的各种需求。是的，自从DPO发布以来，它在开源社区中被广泛使用。它成本相对较低，效果良好，性能也相当不错。在某个时候，所有的LLM都使用DPO来获取与人类反馈的一致性。","start":3259.71,"end":3289.04},{"id":172,"text":"LAMA and Mistel models, if you've heard of them, were also post-trained using DPO. And I guess this is an interesting example where it's a good question to ask. What is the difference between instruction-tuned model and RLHF models? And one clear stylistic difference that emerges is that","zh":"LAMA和Mistel模型，如果你听说过的话，也是使用DPO进行后训练的。我想这提供了一个有趣的问题，值得我们去思考。指令调优模型和RLHF模型之间有什么区别？一个明显的表现差异是","start":3291.47,"end":3313.93}],"notes":["本段介绍了强化学习在大语言模型中的应用，特别是LHF（Language Model with Human Feedback）和DPO（Direct Preference Optimization）方法。LHF通过显式奖励模型优化语言模型参数，并使用KL约束防止模型偏离初始状态。DPO则通过将问题转化为二分类任务，跳过采样步骤，简化了训练过程。","讲者提到，这些方法是构建聊天机器人的基础，例如InstructGPD管道，这是早期的指令式聊天机器人之一，能够处理多种任务，如回答一般性问题。这表明，通过指令调优或强化学习方法，模型可以更好地理解和回应用户需求。","讲者指出，随着数据量的增加和任务覆盖范围的扩大，模型的表现会更好，理解意图的能力也会增强。DPO在开源社区中被广泛使用，因为它成本较低、效果良好且性能优越，许多LLM都曾使用DPO来实现与人类反馈的一致性。","讲者还提到LAMA和Mistel模型也是通过DPO进行微调的，这表明DPO方法在实际应用中具有广泛的适用性。最后，讲者提出了一个关键问题：指令调优模型和RLHF模型之间的区别，指出两者在风格上存在明显差异。","讲者强调，DPO方法在实际应用中具有优势，如无需在线步骤、成本低、效果好，但LHF方法在某些情况下可能更有效。这表明，选择合适的方法取决于具体的应用场景和需求。","讲者通过比较预训练模型与指令调优或RLHF模型的回答，展示了不同方法在实际任务中的表现差异，这有助于理解不同训练方法对模型性能的影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3153.42,"end":3313.93,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3153.42,"text":"In our LHF, we learn an explicit reward model, which gives an explicit score for every completion we sample, and we use that to optimize the language model parameters. And we typically impose some kind of KL constraint to make sure that our model does not drift too far from where it was initialized. It's very effective, maybe sometimes even more effective than DPO, but can be a little tricky to get right, and it's computationally expensive because of the sampling procedure that needs to be done."},{"start":3182.58,"text":"And in direct preference optimization, we can completely skip the sampling part and optimize directly on the preference data by posing it as a binary classification problem. Cool. And it's very simple and effective and does not require an online step. So where does this all lead us? We have discussed all the RLHF and DPO stuff."},{"start":3207.29,"text":"These are roughly how the chatbots are built, by the way. So this is the InstructGPD pipeline. This was like one of the first like instruction, like first chatbots, which was available to public and they interacted with it. And it worked pretty well. Like it can do a lot of tasks. It can answer general purpose questions. And yeah, InstructGPD like..."},{"start":3234.36,"text":"This is a comparison between what the pre-trained model gives as an answer versus what an instruction tuned or an RLHF model gives as an answer. And yeah, these are some examples. And yeah, we have optimized these models for dialogue. It's not just summaries, I want to say. We can optimize them for many, many general purpose tasks."},{"start":3259.71,"text":"The more data you collect, more tasks you cover, the better these models are going to do, the better they're going to understand the intent, and the better they're going to respond to all of our needs. And yeah, DPO has been used a lot in the open source community ever since it was launched. It's fairly cheap, works, it's pretty performant. And at some point, all LLMs were using DPO to get their alignment with human feedback."},{"start":3291.47,"text":"LAMA and Mistel models, if you've heard of them, were also post-trained using DPO. And I guess this is an interesting example where it's a good question to ask. What is the difference between instruction-tuned model and RLHF models? And one clear stylistic difference that emerges is that"}],"speech_gaps":[],"frame":"../frames/v036/020.webp","frame_time":3165.42},{"title":"强化学习在大语言模型中的应用","segments":[{"id":173,"text":"They tend to give more detailed answers, well-formatted answers, and they tend to align more with the kind of text that humans find easier to read. So the question here are like, what are the five most common causes of stress among people? And if you just do instruction fine-tuning with a very small data set, you get a good answer. The five most common causes of stress among people are work, money, relationships, health, and family.","zh":"它们倾向于给出更详细的答案，格式良好的答案，并且更倾向于与人类更容易阅读的文本类型一致。因此，这里的问题是，人们压力最常见的五个原因是什么？如果你仅使用一个非常小的数据集进行指令微调，你就能得到一个不错的答案。人们压力最常见的五个原因是工作、金钱、人际关系、健康和家庭。","start":3314.65,"end":3335.91},{"id":174,"text":"But then you do some kind of a PPO procedure. You get a much clearer, longer answer with a very well-formatted list. And these are all emergent properties. This is what the model has discovered that humans like and prefer. And that's why they tend to generate answers of that form. I love the question. I had a slide on this towards the end. But yes, the question is, can we trust people's feedback? And what do we do if people don't know what they want?","zh":"但随后你进行某种PPO（策略优化）过程。你会得到一个更清晰、更长的答案，并且列表格式非常良好。这些都是涌现的特性。这是模型发现人类喜欢和偏好的内容。这也是为什么它们倾向于生成这种形式的答案。我喜欢这个问题。我在最后的幻灯片上有一个关于这个问题的幻灯片。但是的，问题是，我们能否信任人们的反馈？如果人们不知道自己想要什么，我们该怎么办？","start":3336.67,"end":3365.06},{"id":175,"text":"Again, that's a very hard boundary to go to. And I think what happens is that there's a misalignment between short-term incentives and long-term incentives. There are certain behaviors which look good in short-term, and people give feedback based on short-term incentives. But sometimes behaviors are very undesirable in the long-term. And that is truly a hard problem to solve within the RLHF pipeline.","zh":"再次，这是一条很难跨越的界限。我认为发生的情况是，短期激励与长期激励之间存在不匹配。某些行为在短期内看起来很好，人们基于短期激励给出反馈。但有时这些行为在长期内是非常不理想的。这在RLHF（人类反馈强化学习）流程中确实是一个真正难以解决的问题。","start":3365.76,"end":3391.46},{"id":176,"text":"That's a good question. The question is, like, do we rank, like, two answers or multiple answers? And do we train on NC2 pairs or, yeah. So I think, like...","zh":"这是一个好问题。问题是，我们是否对两个答案或多个答案进行排序？我们是使用NC2对进行训练，还是其他方式？我认为，就像……","start":3392.55,"end":3404.51},{"id":177,"text":"Yeah, you can roughly like just for efficiency purposes, people typically rank more than one answer and you get more learning data out of it that way because you get NC2 pairs, preference pairs. But you can, there's something called the placket loose family, which is like a generalization of Bradley-Terry that allows you to directly train on ranked completions as well beyond just preference pairs too. So you can do either of those. They probably both work fine.","zh":"是的，你可以大致为了效率目的，人们通常对多个答案进行排序，并且通过这种方式你可以获得更多的学习数据，因为你可以得到NC2对，即偏好对。但你也可以使用一种称为Plackett-Luce族的方法，这是Bradley-Terry模型的推广，允许你直接在排序完成的结果上进行训练，而不仅仅是偏好对。因此，你可以选择这两种方法中的一种。它们可能都效果良好。","start":3404.87,"end":3430.51},{"id":178,"text":"Yeah, that's a really good question. So I think our company is incentivized to give preferences to engagement which are not aligned with human. This goes well beyond the scope of this lecture and be like, I don't know what I can say about this. But we can look back at history, right? So this is not an issue that was just true for LLMs. For example, YouTube had a lot of issues with recommendation systems and people were engaging with YouTube way more than they wanted it to.","zh":"是的，这是一个非常好的问题。我认为我们公司被激励去给予与人类意愿不一致的参与偏好。这已经超出了本节课的范围，我也不确定我能说什么。但我们可以回顾一下历史，对吧？所以这并不是一个仅适用于大语言模型（LLMs）的问题。例如，YouTube 曾经在推荐系统方面有很多问题，人们在 YouTube 上的参与度远高于他们原本希望的。","start":3431.38,"end":3459.12},{"id":179,"text":"So in some ways, this is a broader problem on how technology should be interfaced with people and societies. But if I briefly recall from that incident, it was actually YouTube's incentive to make sure that the consumers have long-term healthy engagement.","zh":"从某种意义上说，这是一个关于技术应该如何与人们和社会互动的更广泛问题。但若我简要回忆那次事件，实际上 YouTube 的激励机制是为了确保消费者能够长期保持健康的参与度。","start":3459.74,"end":3479.96}],"notes":["本段讨论了在强化学习中如何处理多个答案的排名问题，以及如何利用NC2对和偏好对进行训练。讲者提到，为了提高效率，人们通常会对多个答案进行排名，从而获得更多的学习数据。此外，还提到了一种称为Plackett-Luce家族的模型，它是Bradley-Terry模型的扩展，允许直接在排序完成上进行训练，而不仅仅是偏好对。","讲者指出，Plackett-Luce家族模型可以用于训练，而不仅仅是偏好对。这表明在强化学习中，可以采用不同的方法来处理排序问题，从而提高模型的性能。","讲者还提到，两种方法（偏好对和排序完成）可能都有效，这表明在实际应用中，可以根据具体情况选择合适的方法。","此外，讲者提到，公司可能会倾向于给予与人类不一致的偏好，这表明在设计强化学习系统时，需要考虑如何对齐人类的偏好。","讲者还提到，YouTube的推荐系统曾出现过类似的问题，这表明技术与人类社会的接口设计是一个更广泛的问题。","最后，讲者提到，YouTube的激励机制是为了确保消费者的长期健康参与，这表明在设计激励机制时，需要考虑长期和短期目标之间的平衡。"],"formulas":[],"uncertainties":["placket loose family"],"diagram":"none","start":3314.65,"end":3479.96,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3314.65,"text":"They tend to give more detailed answers, well-formatted answers, and they tend to align more with the kind of text that humans find easier to read. So the question here are like, what are the five most common causes of stress among people? And if you just do instruction fine-tuning with a very small data set, you get a good answer. The five most common causes of stress among people are work, money, relationships, health, and family."},{"start":3336.67,"text":"But then you do some kind of a PPO procedure. You get a much clearer, longer answer with a very well-formatted list. And these are all emergent properties. This is what the model has discovered that humans like and prefer. And that's why they tend to generate answers of that form. I love the question. I had a slide on this towards the end. But yes, the question is, can we trust people's feedback? And what do we do if people don't know what they want?"},{"start":3365.76,"text":"Again, that's a very hard boundary to go to. And I think what happens is that there's a misalignment between short-term incentives and long-term incentives. There are certain behaviors which look good in short-term, and people give feedback based on short-term incentives. But sometimes behaviors are very undesirable in the long-term. And that is truly a hard problem to solve within the RLHF pipeline."},{"start":3392.55,"text":"That's a good question. The question is, like, do we rank, like, two answers or multiple answers? And do we train on NC2 pairs or, yeah. So I think, like..."},{"start":3404.87,"text":"Yeah, you can roughly like just for efficiency purposes, people typically rank more than one answer and you get more learning data out of it that way because you get NC2 pairs, preference pairs. But you can, there's something called the placket loose family, which is like a generalization of Bradley-Terry that allows you to directly train on ranked completions as well beyond just preference pairs too. So you can do either of those. They probably both work fine."},{"start":3431.38,"text":"Yeah, that's a really good question. So I think our company is incentivized to give preferences to engagement which are not aligned with human. This goes well beyond the scope of this lecture and be like, I don't know what I can say about this. But we can look back at history, right? So this is not an issue that was just true for LLMs. For example, YouTube had a lot of issues with recommendation systems and people were engaging with YouTube way more than they wanted it to."},{"start":3459.74,"text":"So in some ways, this is a broader problem on how technology should be interfaced with people and societies. But if I briefly recall from that incident, it was actually YouTube's incentive to make sure that the consumers have long-term healthy engagement."}],"speech_gaps":[],"frame":"../frames/v036/021.webp","frame_time":3326.65},{"title":"强化学习在大语言模型中的应用与挑战","segments":[{"id":180,"text":"So, which means like if they're like spending 20 hours a day on YouTube, that's probably not good for the product as well. So they probably want to make sure that they're not spending way too much time. So if you do optimize for long-term engagement, that should ideally address, that should not fall to like the sycophantic behaviors that we saw from GPT-40 because that is more short-term behavior. But yeah, cool.","zh":"所以，这意味着如果他们每天花20个小时在YouTube上，这对产品来说可能也不是好事。因此，他们可能希望确保自己不会花太多时间。所以，如果你优化的是长期参与度，这应该理想地解决这个问题，不应该出现像GPT-40中我们看到的那种谄媚行为，因为那是更短期的行为。但总之，挺酷的。","start":3481.0,"end":3506.61},{"id":181,"text":"And yeah, this is basically all we've talked about. And I wanted to bring up a couple of things. Let me just jump ahead to this slide, because we've already talked about it. This is a very fast-evolving topic. This is touching our lives right now when we are deciding how to interface chatbots with humans.","zh":"而且，总之，我们刚才谈到的就是这些。我想提几个要点。让我直接跳到这张幻灯片，因为我们已经讨论过它了。这是一个非常快速发展的主题。它现在正影响着我们的生活，当我们决定如何将聊天机器人与人类进行交互时。","start":3509.84,"end":3534.84},{"id":182,"text":"And for people who might not be familiar with this incident, but like GPT-4 became fairly psychophantic due to a model update that was pushed. And suddenly it was like endorsing all good and bad ideas from their users in a way that everyone deemed was unhealthy. So I don't work at OpenAI and I'm not making any comments, but like these issues, like these are very real.","zh":"对于可能不熟悉这个事件的人来说，GPT-4由于一次模型更新而变得相当谄媚。突然之间，它以一种所有人都认为不健康的方式，支持了用户的所有好与坏的想法。我不在OpenAI工作，也不发表任何评论，但这些问题确实非常真实。","start":3536.1,"end":3562.56},{"id":183,"text":"And we're still trying to understand how does our feedback data affect our final model's emergent behaviors. And this affects how we use our products as well. And yeah, a lot of great questions came up in the class. And those are active problems people are working on. And we don't necessarily have the answers to all of them. So you guys should go look more into it.","zh":"我们仍在努力理解我们的反馈数据如何影响最终模型的涌现行为。这也影响着我们如何使用我们的产品。而且，课堂上提出了很多很好的问题。这些都是人们正在积极研究的问题。我们并不一定对所有这些问题都有答案。所以你们应该进一步去了解它们。","start":3563.12,"end":3586.86},{"id":184,"text":"It's a very common problem in RL when you have proxy rewards instead of true rewards that you care about. And this is generally true for machine learning as well. So yeah, this affects our ability to scale reinforcement learning too because if you start hacking, you have to stop training at some point. And this is like an active optimization problem that people are trying to address. Yeah, I think the field is evolving quite a lot.","zh":"在强化学习中，当你使用代理奖励而不是你真正关心的真实奖励时，这是一个非常常见的问题。这在机器学习中也是一般性的。因此，这也影响我们扩展强化学习的能力，因为一旦你开始进行黑客式调整，就必须在某个时候停止训练。这是一个人们正在努力解决的活跃优化问题。我认为这个领域正在发生相当大的变化。","start":3588.39,"end":3614.11},{"id":185,"text":"It's a very common problem in RL when you have proxy rewards instead of true rewards that you care about. And this is generally true for machine learning as well. So yeah, this affects our ability to scale reinforcement learning too because if you start hacking, you have to stop training at some point. And this is like an active optimization problem that people are trying to address. Yeah, I think the field is evolving quite a lot. So like it goes beyond like,","zh":"在强化学习中，当你使用代理奖励而非你真正关心的真实奖励时，这是一个非常常见的问题。这种情况在机器学习中也普遍存在。因此，这也影响了我们扩展强化学习的能力，因为一旦你开始进行一些调整，就必须在某个时候停止训练。这就像一个主动的优化问题，人们正在努力解决。是的，我认为这个领域正在发生很多变化。所以，它超越了诸如，","start":3616.02,"end":3645.57},{"id":186,"text":"People are moving towards more rubric-based things where we score them for several different aspects.","zh":"人们正朝着更加基于评分标准的方向发展，我们在多个不同方面对他们进行评分。","start":3645.93,"end":3653.71}],"notes":["本段讨论了强化学习在大语言模型中的应用，特别是长期参与度优化与短期行为偏差之间的关系。讲者指出，如果模型过度优化短期行为，可能会导致类似GPT-40的谄媚行为，这表明需要在长期目标和短期行为之间取得平衡。","讲者提到GPT-4因模型更新而表现出心理偏差，这表明模型更新可能带来不可预见的行为变化。这种现象说明了模型与人类偏好之间的对齐问题，是当前研究的重要挑战。","讲者强调了奖励黑客（reward hacking）问题，即当模型使用代理奖励而非真实奖励时，可能会偏离人类真正想要的目标。这在强化学习和机器学习中都是常见问题，影响模型的可扩展性。","讲者指出，奖励黑客问题使得在训练过程中需要在某个点停止训练，这表明这是一个需要主动优化的问题。当前研究正在努力解决这一问题，以提高模型的稳定性和对齐性。","讲者提到人们正在转向基于评分标准的方法，以评估模型在多个方面的表现。这表明当前研究正在探索更系统化的方法来评估和优化模型行为。","讲者强调了强化学习在大语言模型中的重要性，以及当前研究的活跃性和挑战性。这表明该领域仍在快速发展，需要进一步的研究和探索。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3481.0,"end":3653.71,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3481.0,"text":"So, which means like if they're like spending 20 hours a day on YouTube, that's probably not good for the product as well. So they probably want to make sure that they're not spending way too much time. So if you do optimize for long-term engagement, that should ideally address, that should not fall to like the sycophantic behaviors that we saw from GPT-40 because that is more short-term behavior. But yeah, cool."},{"start":3509.84,"text":"And yeah, this is basically all we've talked about. And I wanted to bring up a couple of things. Let me just jump ahead to this slide, because we've already talked about it. This is a very fast-evolving topic. This is touching our lives right now when we are deciding how to interface chatbots with humans."},{"start":3536.1,"text":"And for people who might not be familiar with this incident, but like GPT-4 became fairly psychophantic due to a model update that was pushed. And suddenly it was like endorsing all good and bad ideas from their users in a way that everyone deemed was unhealthy. So I don't work at OpenAI and I'm not making any comments, but like these issues, like these are very real."},{"start":3563.12,"text":"And we're still trying to understand how does our feedback data affect our final model's emergent behaviors. And this affects how we use our products as well. And yeah, a lot of great questions came up in the class. And those are active problems people are working on. And we don't necessarily have the answers to all of them. So you guys should go look more into it."},{"start":3588.39,"text":"Yeah, and the other main thing that I do want to touch upon, which is a limitation of the current paradigm, is that there's this phenomenon of reward hacking, which again touches upon misalignment as well, is that when we train on these learned reward models, they do align with human preferences up to a certain point. But as you train progressively against them, they tend to start drifting awa
