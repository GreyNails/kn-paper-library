<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 9 大语言模型中的强化学习（RL for LLMs）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 9 大语言模型中的强化学习（RL for LLMs） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v036","title":"Lecture 9 大语言模型中的强化学习（RL for LLMs）","course":"强化学习","pages":[{"title":"强化学习在大语言模型中的应用","segments":[{"id":0,"text":"Today, I'm going to cover primarily preference optimization, and I think Aviral is going to cover some things related to reasoning. So let's get started.","start":5.23,"end":14.93},{"id":1,"text":"I guess like the one clear trend in the last five to ten years has been that we've been like building larger and larger models and we've been putting far more compute into them. This is like a very consistent trend. And if you're familiar with or if you have like some people are even making predictions about like AGI 2027 and they are like predicting that we're going to keep putting more and more floating point operations into these models.","start":19.63,"end":46.47},{"id":2,"text":"But the question today we're going to try to answer is, how do we get from these large language models, which are pre-trained to predict text, and get these really nice chatbots that some of them you might have used?","start":48.81,"end":61.71},{"id":3,"text":"So I'm going to very briefly talk about, this is not an NLP course and you should probably take one if you're interested in learning more about pre-training. It's a very, very deep topic. But I'm going to quickly touch upon what we learn in pre-training and why that doesn't necessarily translate into the kind of chatbots we use. So in pre-training large language models, they are trained on this gigantic corpus of internet texts.","start":62.63,"end":89.69},{"id":4,"text":"And the way they're trained is roughly predicting what the next word or the next token in the sentence is going to be. So, for example, if you have a sentence, Stanford University is located in blank California. So like the model will learn to predict what this text is. And you can imagine that you're learning to predict this text. You're learning a lot of facts. You're learning a lot of trivia. But you're also starting to learn something about the syntax of how language operates.","start":90.15,"end":119.15},{"id":5,"text":"And we can look at many different examples here. Iroh went to the kitchen to make some tea. Standing next to Iroh, Zuko pondered his destiny. Zuko left the... So yeah, like the model will learn to predict the next token, which implicitly requires it to know some facts, know syntax, and also maybe even reason about what word should come next. While this may like predicting next token, you learn language, but...","start":120.13,"end":144.54},{"id":6,"text":"Predicting next token ends up learning a lot more. And there's some evidence that it ends up learning some notion of how the world operates. So this is a very nice example where we ask the model to predict the next set of tokens. And here the example is PadWatch is a demonstration of a bowling ball and a leaf being dropped at the same time in a vacuum chamber.","start":145.62,"end":167.46}],"notes":["本段主要讨论大语言模型在预训练过程中如何通过预测下一个词来学习语言的语法和一些事实知识。讲者提到，虽然模型的主要任务是预测下一个词，但这一过程也隐含了对语言结构和世界运作方式的理解。","讲者通过举例说明模型如何通过预测下一个词来学习语言，例如通过句子中的上下文来推断下一个词。这表明模型不仅学习语言的语法，还可能具备一定的推理能力。","讲者提到，预测下一个词的学习过程可能使模型获得对世界运作方式的一些理解。这表明预训练过程不仅仅是学习语言，还可能涉及更深层次的知识获取。","讲者举了PadWatch的例子，说明模型可以预测下一个词组，这表明模型能够处理更复杂的语言任务，如理解物理现象。","讲者强调，虽然预训练模型主要学习语言，但其学习过程可能涉及更广泛的知识，如事实、语法和推理能力，这为后续的强化学习应用奠定了基础。","讲者指出，预训练模型的学习过程可能隐含了对世界运作方式的理解，这为后续的强化学习任务提供了潜在的基础，但需要进一步探索如何将这些能力转化为实际应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":167.46,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.23,"text":"Today, I'm going to cover primarily preference optimization, and I think Aviral is going to cover some things related to reasoning. So let's get started."},{"start":19.63,"text":"I guess like the one clear trend in the last five to ten years has been that we've been like building larger and larger models and we've been putting far more compute into them. This is like a very consistent trend. And if you're familiar with or if you have like some people are even making predictions about like AGI 2027 and they are like predicting that we're going to keep putting more and more floating point operations into these models."},{"start":48.81,"text":"But the question today we're going to try to answer is, how do we get from these large language models, which are pre-trained to predict text, and get these really nice chatbots that some of them you might have used?"},{"start":62.63,"text":"So I'm going to very briefly talk about, this is not an NLP course and you should probably take one if you're interested in learning more about pre-training. It's a very, very deep topic. But I'm going to quickly touch upon what we learn in pre-training and why that doesn't necessarily translate into the kind of chatbots we use. So in pre-training large language models, they are trained on this gigantic corpus of internet texts."},{"start":90.15,"text":"And the way they're trained is roughly predicting what the next word or the next token in the sentence is going to be. So, for example, if you have a sentence, Stanford University is located in blank California. So like the model will learn to predict what this text is. And you can imagine that you're learning to predict this text. You're learning a lot of facts. You're learning a lot of trivia. But you're also starting to learn something about the syntax of how language operates."},{"start":120.13,"text":"And we can look at many different examples here. Iroh went to the kitchen to make some tea. Standing next to Iroh, Zuko pondered his destiny. Zuko left the... So yeah, like the model will learn to predict the next token, which implicitly requires it to know some facts, know syntax, and also maybe even reason about what word should come next. While this may like predicting next token, you learn language, but..."},{"start":145.62,"text":"Predicting next token ends up learning a lot more. And there's some evidence that it ends up learning some notion of how the world operates. So this is a very nice example where we ask the model to predict the next set of tokens. And here the example is PadWatch is a demonstration of a bowling ball and a leaf being dropped at the same time in a vacuum chamber."}],"speech_gaps":[],"frame":"../frames/v036/001.webp","frame_time":17.23},{"title":"强化学习在大语言模型中的应用","segments":[{"id":7,"text":"Pat, who is a physicist, predicts that. And now the model is asked to predict the next set of tokens or the next set of words here. And to predict these next set of words, you implicitly have to understand what the text was. And in some way, you have to understand how the world operates as well to be able to answer. And it's very interesting. If you change the prompt, you'll get a different behavior out of the model as well.","start":168.58,"end":191.48},{"id":8,"text":"The point here being that language models don't just learn syntax, don't just learn words, but they learn a lot more about how the world operates as well. And similarly, we can ask them to do math questions. We can ask them to generate code. We can ask them to have fairly reasonable medical understanding as well. And more importantly, we can start transforming these models into assistants now.","start":191.95,"end":216.79},{"id":9,"text":"So the question now we'll get back to is like, okay, pre-training gave us all that. So how do we actually make this into assistance? So today's lecture, we'll try to cover roughly two or three kinds of techniques to do so. First is instruction fine-tuning. Second is RLHF. And third is DPO. And then we'll talk about some limitations about what is missing, where are we going wrong, and so on. All right.","start":219.61,"end":248.11},{"id":10,"text":"So the first thing to understand is when we pre-train models, we're modeling language. And yes, that learns more than language. It learns something about the world, but that's still not equivalent to assisting users. So this is an example from GPT-3 where the prompt says, explain the moon landing to a six-year-old in a few sentences. And the model completes it with what it thinks should be the next set of tokens. According to the distribution of text, it has seen...","start":248.78,"end":275.0},{"id":11,"text":"corpus. So it starts off, explain the theory of gravity to a six-year-old, explain the theory of relativity to a six-year-old in a few sentences. And this isn't like, this is not what I expect my assistant to do. It's just a language model predicting the next token. What we do want it to do is actually give an explanation or a story where it like, giant rocket ship blasted off the earth carrying astronauts to the moon. So some kind of an explanation, which was the original intent of the question and not just the text it has seen on the internet.","start":275.34,"end":306.22},{"id":12,"text":"And that's where the discrepancy arises between language modeling and assisting users. The first set of techniques that were developed for this was fine tuning. And we're going to talk a little bit about this. So the general paradigm, even to this date, has been to first pre-train a language model on a large corpus of text and then fine tune for a specific task.","start":306.77,"end":329.91}],"notes":["本段讨论了预训练语言模型在理解世界和协助用户之间的差距。预训练模型虽然能学习语言和世界知识，但其本质仍是语言建模，无法直接作为助手。以GPT-3为例，当用户要求解释登月时，模型只是根据文本分布预测下一个词，而非提供符合用户意图的解释。","讲者指出，语言模型的输出可能与用户的真实需求不符。例如，当用户要求解释登月时，模型可能只是重复已有的文本，而不是提供一个符合用户期望的解释，如火箭发射等具体场景。","讲者强调，语言建模和实际协助用户之间存在显著差异。语言模型的输出是基于文本分布的预测，而用户期望的是有意义的解释或故事，这需要模型具备更深层次的理解能力。","讲者提到，为解决这一问题，需要引入特定的训练方法，如指令微调（instruction fine-tuning）、强化学习人类反馈（RLHF）和直接偏好优化（DPO）。这些方法旨在将语言模型转化为有效的助手。","讲者指出，当前的训练范式是先在大规模文本语料上预训练语言模型，再针对特定任务进行微调。这种方法虽然有效，但仍有局限性，需要进一步探索。","讲者最后提到，当前的研究重点是探索如何将语言模型转化为真正的助手，包括改进训练方法、解决模型理解不足的问题，以及探索新的技术路径。"],"formulas":[],"uncertainties":[],"diagram":"none","start":168.58,"end":329.91,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":168.58,"text":"Pat, who is a physicist, predicts that. And now the model is asked to predict the next set of tokens or the next set of words here. And to predict these next set of words, you implicitly have to understand what the text was. And in some way, you have to understand how the world operates as well to be able to answer. And it's very interesting. If you change the prompt, you'll get a different behavior out of the model as well."},{"start":191.95,"text":"The point here being that language models don't just learn syntax, don't just learn words, but they learn a lot more about how the world operates as well. And similarly, we can ask them to do math questions. We can ask them to generate code. We can ask them to have fairly reasonable medical understanding as well. And more importantly, we can start transforming these models into assistants now."},{"start":219.61,"text":"So the question now we'll get back to is like, okay, pre-training gave us all that. So how do we actually make this into assistance? So today's lecture, we'll try to cover roughly two or three kinds of techniques to do so. First is instruction fine-tuning. Second is RLHF. And third is DPO. And then we'll talk about some limitations about what is missing, where are we going wrong, and so on. All right."},{"start":248.78,"text":"So the first thing to understand is when we pre-train models, we're modeling language. And yes, that learns more than language. It learns something about the world, but that's still not equivalent to assisting users. So this is an example from GPT-3 where the prompt says, explain the moon landing to a six-year-old in a few sentences. And the model completes it with what it thinks should be the next set of tokens. According to the distribution of text, it has seen..."},{"start":275.34,"text":"corpus. So it starts off, explain the theory of gravity to a six-year-old, explain the theory of relativity to a six-year-old in a few sentences. And this isn't like, this is not what I expect my assistant to do. It's just a language model predicting the next token. What we do want it to do is actually give an explanation or a story where it like, giant rocket ship blasted off the earth carrying astronauts to the moon. So some kind of an explanation, which was the original intent of the question and not just the text it has seen on the internet."},{"start":306.77,"text":"And that's where the discrepancy arises between language modeling and assisting users. The first set of techniques that were developed for this was fine tuning. And we're going to talk a little bit about this. So the general paradigm, even to this date, has been to first pre-train a language model on a large corpus of text and then fine tune for a specific task."}],"speech_gaps":[],"frame":"../frames/v036/002.webp","frame_time":180.58},{"title":"强化学习在大语言模型中的应用","segments":[{"id":13,"text":"How does fine tuning work? You collect a set of inputs and you have some target outputs and then you improve the log likelihood of these target outputs. So in this step two, you have this input, which was the movie was something, something. And then you have some target output, which is good or bad. And the model learns to predict whether the output was good or bad.","start":331.48,"end":355.5},{"id":14,"text":"And that's really the main difference between fine tuning and pre-training. As we realize, like, I mean, these pre-training models are good for many more things. We started scaling up the number of tasks we can fine tune on. So the previous example was maybe something like sentiment prediction. But really, these models can be fine tuned for many, many different tasks at the same time.","start":355.93,"end":380.74},{"id":15,"text":"Broadly, this can be seen as collecting a set of instruction and output pairs. So, for example, if the instruction is, please answer the following question, what is the boiling point of nitrogen? We'll have some answer like minus 320.4. And we want to be able to predict this answer conditioned on the input. And once we collect a corpus of such instruction output pairs, we can then evaluate them on many, many unseen tasks.","start":384.86,"end":411.28},{"id":16,"text":"Can Jeffrey Hinton have a conversation with George Washington? Give the rationale before answering. And the model will produce a reasonable output here. So what if we fine-tune different scale language models on the same kind of corpus? So one thing that was observed in a lot of prior work is that as you increase the model parameter size,","start":412.39,"end":438.14},{"id":17,"text":"they actually start generalizing a lot better. So even taking a very small corpus of such instruction output data sets, you start seeing a lot more generalization. So to explain the table a little bit, the Big Bench and MLU are like question-answer pairs of the kind you just saw in the previous slide.","start":438.63,"end":457.29},{"id":18,"text":"One thing to note here is that the bigger the parameters or larger the model is, the larger the gain is after instruction fine-tuning. So what this suggests to us is that the models start responding and generalizing to questions even with very small corpus of data as well. So to give an example of what the models look before and after instruction fine-tuning.","start":458.95,"end":485.31}],"notes":["本段主要讨论了在大语言模型中进行指令微调（instruction fine-tuning）的过程，强调了微调与预训练之间的主要区别。微调是通过收集输入和目标输出对，使模型能够根据输入预测目标输出，而预训练模型则用于更广泛的任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":331.48,"end":485.31,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":331.48,"text":"How does fine tuning work? You collect a set of inputs and you have some target outputs and then you improve the log likelihood of these target outputs. So in this step two, you have this input, which was the movie was something, something. And then you have some target output, which is good or bad. And the model learns to predict whether the output was good or bad."},{"start":355.93,"text":"And that's really the main difference between fine tuning and pre-training. As we realize, like, I mean, these pre-training models are good for many more things. We started scaling up the number of tasks we can fine tune on. So the previous example was maybe something like sentiment prediction. But really, these models can be fine tuned for many, many different tasks at the same time."},{"start":384.86,"text":"Broadly, this can be seen as collecting a set of instruction and output pairs. So, for example, if the instruction is, please answer the following question, what is the boiling point of nitrogen? We'll have some answer like minus 320.4. And we want to be able to predict this answer conditioned on the input. And once we collect a corpus of such instruction output pairs, we can then evaluate them on many, many unseen tasks."},{"start":412.39,"text":"Can Jeffrey Hinton have a conversation with George Washington? Give the rationale before answering. And the model will produce a reasonable output here. So what if we fine-tune different scale language models on the same kind of corpus? So one thing that was observed in a lot of prior work is that as you increase the model parameter size,"},{"start":438.63,"text":"they actually start generalizing a lot better. So even taking a very small corpus of such instruction output data sets, you start seeing a lot more generalization. So to explain the table a little bit, the Big Bench and MLU are like question-answer pairs of the kind you just saw in the previous slide."},{"start":458.95,"text":"One thing to note here is that the bigger the parameters or larger the model is, the larger the gain is after instruction fine-tuning. So what this suggests to us is that the models start responding and generalizing to questions even with very small corpus of data as well. So to give an example of what the models look before and after instruction fine-tuning."}],"speech_gaps":[],"frame":"../frames/v036/003.webp","frame_time":343.48},{"title":"强化学习在大语言模型中的应用","segments":[{"id":19,"text":"It's a fairly simple question. In the following sentences, explain the antecedent to the pronoun and state that it is ambiguous. So you get something which represents more like the raw language model, which will start generating text on the right side. The reporter and the chef will discuss their favorite dishes and so on. But after instruction fine-tuning, it will give us what the user perhaps intended from the question, which is to give the correct answer. Cool.","start":486.03,"end":517.27},{"id":20,"text":"So instruction fine-tuning is fairly simple. There's nothing very complicated going on here. So I'll take a second. Just reflect for yourself. Do you see some limitations to something like this? One limitation that obviously comes up is that it's expensive to collect such data. You have to collect questions and the labels for those questions.","start":518.28,"end":546.0},{"id":21,"text":"And that's hard. As you start increasing the hardness of the questions, there's very few people who can answer those questions. So it's expensive to scale such data collections where the humans have to sit down and write down the answer to every question.","start":546.75,"end":569.52},{"id":22,"text":"And this is like a lot of the use cases of language models. A lot of the use cases of language models are creative. So if I ask a language model to write a story about a dog and her pet grasshopper, there's no right answer for this. I cannot sit down and say, oh, this is the exact story I want to hear every single time a person asks this question. The second point is a little subtle, but...","start":570.03,"end":594.8},{"id":23,"text":"In instruction fine-tuning, we have a predefined answer. So the mistakes are penalized equally. So there's no good or right answer. We're not necessarily saying that this was the mistake. We are basically saying your entire answer is wrong or your entire answer is correct, which is often not necessarily true for a specific question.","start":596.65,"end":619.63},{"id":24,"text":"So this is an example of this. If we have a statement like avatar is a fantasy TV show, it's not that the sentence entirely is correct or incorrect, but it would have been better to describe the avatar as an adventure TV show rather than a fantasy TV show. I think this is like a problem that has emerged recently is that.","start":621.1,"end":642.03}],"notes":["本段讨论了指令微调（instruction fine-tuning）的局限性，特别是数据收集的高昂成本。随着问题难度的增加，找到能够回答这些问题的人变得困难，因此需要大量人力来编写答案，这使得数据收集过程昂贵且难以扩展。","接下来，讲者指出某些任务本身没有明确的正确答案，例如让语言模型创作一个关于狗和其宠物蚱蜢的故事。这种情况下，不存在一个标准答案，因此指令微调可能无法有效处理这类任务。","在指令微调中，通常预设一个正确答案，所有错误都会被同等惩罚。然而，这种设定并不总是适用，因为某些问题的答案可能不是完全正确或错误，而是存在更优的表达方式。","讲者举了一个例子，说明即使句子整体不完全正确或错误，也可能存在更合适的表达方式。例如，将《Avatar》描述为冒险类电视剧而非奇幻类电视剧可能更准确。这种问题在最近才逐渐显现出来。","这些讨论表明，指令微调虽然在某些任务中有效，但其局限性在于无法处理没有明确答案的任务，且对答案的判断可能过于二元化。","因此，讲者强调需要更灵活的方法来处理语言模型的输出，特别是在涉及创造性任务时，不能简单地将答案视为正确或错误。"],"formulas":[],"uncertainties":[],"diagram":"none","start":486.03,"end":642.03,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":486.03,"text":"It's a fairly simple question. In the following sentences, explain the antecedent to the pronoun and state that it is ambiguous. So you get something which represents more like the raw language model, which will start generating text on the right side. The reporter and the chef will discuss their favorite dishes and so on. But after instruction fine-tuning, it will give us what the user perhaps intended from the question, which is to give the correct answer. Cool."},{"start":518.28,"text":"So instruction fine-tuning is fairly simple. There's nothing very complicated going on here. So I'll take a second. Just reflect for yourself. Do you see some limitations to something like this? One limitation that obviously comes up is that it's expensive to collect such data. You have to collect questions and the labels for those questions."},{"start":546.75,"text":"And that's hard. As you start increasing the hardness of the questions, there's very few people who can answer those questions. So it's expensive to scale such data collections where the humans have to sit down and write down the answer to every question. But then if you look beyond that, there's certain tasks which don't even have a right answer. So if I..."},{"start":570.03,"text":"And this is like a lot of the use cases of language models. A lot of the use cases of language models are creative. So if I ask a language model to write a story about a dog and her pet grasshopper, there's no right answer for this. I cannot sit down and say, oh, this is the exact story I want to hear every single time a person asks this question. The second point is a little subtle, but..."},{"start":596.65,"text":"In instruction fine-tuning, we have a predefined answer. So the mistakes are penalized equally. So there's no good or right answer. We're not necessarily saying that this was the mistake. We are basically saying your entire answer is wrong or your entire answer is correct, which is often not necessarily true for a specific question."},{"start":621.1,"text":"So this is an example of this. If we have a statement like avatar is a fantasy TV show, it's not that the sentence entirely is correct or incorrect, but it would have been better to describe the avatar as an adventure TV show rather than a fantasy TV show. I think this is like a problem that has emerged recently is that."}],"speech_gaps":[],"frame":"../frames/v036/004.webp","frame_time":498.03},{"title":"强化学习在大语言模型中的应用","segments":[{"id":25,"text":"The language models truly are better at generating answers than humans. So if we rely on humans to generate the answers and generate the labels for our questions, we are going to be limited by how good the humans can answer the question. And finally, like one big mismatch is that LLM objectives, there's a bit of a misalignment between what we want our models to do, which is to engage well with humans, which is to like,","start":642.62,"end":672.74},{"id":26,"text":"which is to follow their intent. Whereas our fine tuning objective basically says predict this answer really well. So there's a little bit of a mismatch in our training objective when we are doing instruction fine tuning. Cool. So this leads us to the paradigm of reinforcement learning from human preferences. So the question is that","start":673.92,"end":700.63},{"id":27,"text":"How much of the improvement from instruction fine-tuning comes from following a format or actually teaching some new knowledge? I think most of the work suggests that it actually is teaching largely formatting. And most of the knowledge actually comes from the base language model itself. And there's a very clear way to do this. You can experiment this by just training the model wrong answers. And it still does quite well on the downstream tasks.","start":702.25,"end":728.17},{"id":28,"text":"So it tells us that it's actually teaching formatting more than the knowledge itself.","start":729.31,"end":733.63},{"id":29,"text":"The question was, are the corpuses always question-answer format because that's what we want out of chatbots?","start":734.99,"end":742.73},{"id":30,"text":"Not anymore.","start":743.29,"end":744.37},{"id":31,"text":"I think this was very early days of LLM fine-tuning, and we were focused more on question-answering.","start":744.65,"end":750.03},{"id":32,"text":"But the corpus for instruction fine-tuning are very, very diverse now.","start":750.13,"end":755.43},{"id":33,"text":"these LLMs are used for a wide variety of tasks, function calling tools, and it's not just like","start":755.43,"end":763.17},{"id":34,"text":"assistance like means many different things. So it's not question answers. It could be just","start":763.17,"end":768.47},{"id":35,"text":"anything. Great. So now we'll like get into reinforcement learning from human preferences,","start":768.47,"end":773.89},{"id":36,"text":"which addresses some of the limitations which we discussed here. So in throughout this like","start":773.99,"end":782.53},{"id":37,"text":"section, we'll use summarization as an example because there's not necessarily a good summary","start":782.53,"end":787.69},{"id":38,"text":"that we can often train on. And for notation, we'll assume that we are given an instruction","start":787.69,"end":794.65},{"id":39,"text":"x and the language model will generate some sample y. And we'll pretend that we have a way","start":794.65,"end":803.19},{"id":40,"text":"for a human to give us some kind of a reward score for a given summary conditioned on some","start":803.19,"end":808.03},{"id":41,"text":"input x and like summary y. So we have some news article which is San Francisco, California,","start":808.03,"end":814.45},{"id":42,"text":"magnitude of 4.2 earthquake shook the San Francisco bubble.","start":814.63,"end":817.91}],"notes":["本段讨论了大语言模型（LLMs）在生成答案方面优于人类，因此依赖人类生成答案和标签会受到人类能力的限制。同时，指出LLM的目标与人类意图之间存在一定的不匹配，这导致了在指令微调过程中训练目标的不一致。","讲者提到，大多数改进来自于格式的遵循，而非新知识的传授，这表明模型主要是在学习如何按照特定格式生成答案，而不是学习新的知识。通过训练模型生成错误答案，仍然可以在下游任务中表现良好，进一步支持了这一观点。","讲者指出，早期的LLM微调主要集中在问答格式上，但现在的指令微调语料库更加多样化，涵盖了多种任务，如函数调用工具等，而不仅仅是问答。","讲者提到，现在讨论的是基于人类偏好的强化学习（RLHF），它能够解决之前提到的一些限制。在本节中，以摘要任务为例，说明如何通过人类提供的奖励分数来训练模型。","讲者假设给定一个输入x，语言模型会生成一个样本y，并且假设存在一种方式让人类为给定的摘要提供奖励分数。这为后续的强化学习框架提供了基础。","讲者以旧金山地震的新闻文章为例，说明输入x和生成的摘要y之间的关系，为后续的强化学习模型训练提供了具体场景。"],"formulas":[],"uncertainties":[],"diagram":"none","start":642.62,"end":817.91,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":642.62,"text":"The language models truly are better at generating answers than humans. So if we rely on humans to generate the answers and generate the labels for our questions, we are going to be limited by how good the humans can answer the question. And finally, like one big mismatch is that LLM objectives, there's a bit of a misalignment between what we want our models to do, which is to engage well with humans, which is to like,"},{"start":673.92,"text":"which is to follow their intent. Whereas our fine tuning objective basically says predict this answer really well. So there's a little bit of a mismatch in our training objective when we are doing instruction fine tuning. Cool. So this leads us to the paradigm of reinforcement learning from human preferences. So the question is that"},{"start":702.25,"text":"How much of the improvement from instruction fine-tuning comes from following a format or actually teaching some new knowledge? I think most of the work suggests that it actually is teaching largely formatting. And most of the knowledge actually comes from the base language model itself. And there's a very clear way to do this. You can experiment this by just training the model wrong answers. And it still does quite well on the downstream tasks."},{"start":729.31,"text":"So it tells us that it's actually teaching formatting more than the knowledge itself."},{"start":734.99,"text":"The question was, are the corpuses always question-answer format because that's what we want out of chatbots?"},{"start":743.29,"text":"Not anymore."},{"start":744.65,"text":"I think this was very early days of LLM fine-tuning, and we were focused more on question-answering."},{"start":750.13,"text":"But the corpus for instruction fine-tuning are very, very diverse now."},{"start":755.43,"text":"these LLMs are used for a wide variety of tasks, function calling tools, and it's not just like"},{"start":763.17,"text":"assistance like means many different things. So it's not question answers. It could be just"},{"start":768.47,"text":"anything. Great. So now we'll like get into reinforcement learning from human preferences,"},{"start":773.99,"text":"which addresses some of the limitations which we discussed here. So in throughout this like"},{"start":782.53,"text":"section, we'll use summarization as an example because there's not necessarily a good summary"},{"start":787.69,"text":"that we can often train on. And for notation, we'll assume that we are given an instruction"},{"start":794.65,"text":"x and the language model will generate some sample y. And we'll pretend that we have a way"},{"start":803.19,"text":"for a human to give us some kind of a reward score for a given summary conditioned on some"},{"start":808.03,"text":"input x and like summary y. So we have some news article which is San Francisco, California,"},{"start":814.63,"text":"magnitude of 4.2 earthquake shook the San Francisco bubble."}],"speech_gaps":[],"frame":"../frames/v036/005.webp","frame_time":654.62},{"title":"强化学习在大语言模型中的应用","segments":[{"id":43,"text":"And we have one summary, which is earthquake hit San Francisco. There was minor property damage, but no injuries. And we have another one, which is Bay Area has good weather, but it is prone to earthquakes and wildfires. Clearly, one of the summaries is a little better than the other. So let's say like our reward function gives us a score of 8.0 and the other summary gets a score of 1.2. Roughly speaking, we want to set up the objective such that","start":819.1,"end":845.04},{"id":44,"text":"we want to maximize the expected reward. So conditioned on some input instruction X, we want our language model to generate summaries Y such that the expected reward will be high. Fairly simple standard RL objective that you've probably seen in the class before.","start":845.8,"end":861.68},{"id":45,"text":"This is the core of how chatbots are trained. And the rough pipeline looks as the following, which is from the InstructGPT paper, is that we'll first do some instruction fine-tuning. We collect some demonstration data to condition, just to get the formatting right, as we discussed earlier. Second step and the third step, which we'll go a lot more into, is to set up how to first get a reward model.","start":864.77,"end":889.93},{"id":46,"text":"which allows us to align with human intent, and then we maximize the reward model. So these are the three steps we typically follow. Great. So let's just pretend for now that we have a reward model where we want to maximize this. And yeah, I'm presuming you all are familiar with this gradient descent idea. So yeah, the way we would change the LM parameters to maximize this is...","start":890.5,"end":921.4},{"id":47,"text":"Something you've seen before, like some form of gradient descent. Usually there's more complicated optimizers, but we can pretend that is not required right now. For now, we'll just assume a generic RL formulation where we are generating some sample S hat for some distribution P theta S. We want to change the parameters theta such that the samples S hat are high reward under the reward function R.","start":921.8,"end":947.06},{"id":48,"text":"The main issues, and this is why we do RL, is our reward functions are often non-differentiable. So if you ask me to give a number, my human mind is not differentiable. So we cannot back-propagate through them. So this is why we resort to RL. So this is where policy gradient methods that I think Chelsea has covered very early in the course come in, is that they allow us to maximize non-differentiable reward functions. And we can estimate and optimize this objective.","start":951.62,"end":977.52}],"notes":["本段介绍了强化学习在大语言模型中的应用，通过对比两个摘要的得分，说明了如何通过奖励函数来评估生成结果的质量。课程中提到，强化学习的目标是最大化期望奖励，这与之前课堂中讲授的标准强化学习目标一致。","课程中提到，训练聊天机器人的核心是通过强化学习框架，包括指令微调、收集演示数据以及构建奖励模型三个步骤。其中，奖励模型的构建是关键，因为它允许模型对齐人类意图。","在强化学习中，奖励函数通常是不可微的，这使得传统的反向传播方法无法直接应用。因此，课程中提到需要使用策略梯度方法，这些方法允许最大化不可微的奖励函数，并通过估计和优化目标来实现。","课程中还提到，强化学习的框架假设我们生成样本S hat服从分布P theta S，并希望通过调整参数theta使得样本在奖励函数R下具有高奖励。这与标准的强化学习目标一致。","课程中强调，虽然通常会使用更复杂的优化器，但在当前的讨论中可以假设使用梯度下降方法。这表明课程中关注的是基本的强化学习框架，而不是复杂的优化技术。","最后，课程指出，策略梯度方法是解决不可微奖励函数问题的关键，这些方法在课程早期由Chelsea讲解过。这表明课程内容是连贯的，并且强调了策略梯度方法在强化学习中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":819.1,"end":977.52,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":819.1,"text":"And we have one summary, which is earthquake hit San Francisco. There was minor property damage, but no injuries. And we have another one, which is Bay Area has good weather, but it is prone to earthquakes and wildfires. Clearly, one of the summaries is a little better than the other. So let's say like our reward function gives us a score of 8.0 and the other summary gets a score of 1.2. Roughly speaking, we want to set up the objective such that"},{"start":845.8,"text":"we want to maximize the expected reward. So conditioned on some input instruction X, we want our language model to generate summaries Y such that the expected reward will be high. Fairly simple standard RL objective that you've probably seen in the class before."},{"start":864.77,"text":"This is the core of how chatbots are trained. And the rough pipeline looks as the following, which is from the InstructGPT paper, is that we'll first do some instruction fine-tuning. We collect some demonstration data to condition, just to get the formatting right, as we discussed earlier. Second step and the third step, which we'll go a lot more into, is to set up how to first get a reward model."},{"start":890.5,"text":"which allows us to align with human intent, and then we maximize the reward model. So these are the three steps we typically follow. Great. So let's just pretend for now that we have a reward model where we want to maximize this. And yeah, I'm presuming you all are familiar with this gradient descent idea. So yeah, the way we would change the LM parameters to maximize this is..."},{"start":921.8,"text":"Something you've seen before, like some form of gradient descent. Usually there's more complicated optimizers, but we can pretend that is not required right now. For now, we'll just assume a generic RL formulation where we are generating some sample S hat for some distribution P theta S. We want to change the parameters theta such that the samples S hat are high reward under the reward function R."},{"start":951.62,"text":"The main issues, and this is why we do RL, is our reward functions are often non-differentiable. So if you ask me to give a number, my human mind is not differentiable. So we cannot back-propagate through them. So this is why we resort to RL. So this is where policy gradient methods that I think Chelsea has covered very early in the course come in, is that they allow us to maximize non-differentiable reward functions. And we can estimate and optimize this objective."}],"speech_gaps":[],"frame":"../frames/v036/006.webp","frame_time":831.1},{"title":"强化学习在大语言模型中的应用","segments":[{"id":49,"text":"And I'll do a brief recap here because it's important, and we'll slowly lead into the RLHF pipeline as well. But I presume you have seen this before. Great. So in this generic objective, when we want to estimate, the quantity that we want is the gradient of the expected reward, where we want the sample's S-hat to have a high reward under R.","start":978.54,"end":1004.41},{"id":50,"text":"So this can be written down. This is just algebra at this point where the expectation can be written down as a summation of RS multiplied by P theta S. And we have the gradient here. So this is a definition of expectation. And now we're going to propagate the gradient forward simply by linearity of the gradient.","start":1004.93,"end":1027.73},{"id":51,"text":"I assume you have seen this, but I'm going to go over this. But this is a log derivative trick, which is we can rewrite the gradient of p theta as p theta times gradient of log p theta. So to see that this is simply from the chain rule is that the gradient of log p theta simply can be written as one by p theta and gradient multiplied by gradients of p theta. Cool.","start":1032.65,"end":1058.77},{"id":52,"text":"So we can rewrite this as to get this identity where the gradient of p theta can be rewritten as p theta gradient log p theta. Cool. So the quantities in yellow is what we want to substitute back. And if we plug this back in, we get the following equation, which is reward of gradient of p theta is the same as expectation under p theta, our gradient of log p theta. All right.","start":1059.45,"end":1093.19},{"id":53,"text":"Why did we do all this? Typically, like when we're computing expectation over sentences, it's really not possible to enumerate every single sentence possible. It's just simply like intractable to even try to do that. So you want to be able to estimate the gradient somehow.","start":1094.94,"end":1112.06},{"id":54,"text":"And we want to be able to create some kind of a stochastic estimator so that we can get the gradient out. So this log derivative trick is what allows us to take this gradient and convert it into an expectation, which we can sample and then approximate. And this is what we get as a final result, is that it's again an expectation of a reward-multiplied gradient of log p theta.","start":1112.88,"end":1135.59}],"notes":["本段讲解了强化学习中梯度估计的基本方法，即通过log derivative trick将期望梯度转换为可采样的形式。讲者提到，当计算句子上的期望时，由于句子数量庞大，无法枚举所有可能的句子，因此需要使用随机估计器来近似梯度。","讲者强调了log derivative trick的核心思想，即利用链式法则将梯度表达为概率分布乘以对数概率的梯度。这一技巧使得原本难以计算的期望梯度可以转化为可采样的形式。","在推导过程中，讲者指出，最终的梯度估计结果仍然是一个期望值，该期望值由奖励乘以对数概率的梯度组成。这表明，强化学习中的梯度估计本质上是通过采样来近似期望值。","讲者提到，这种转换方法允许我们使用随机估计器来估计梯度，从而避免了直接计算所有可能句子的期望值。这种方法在大语言模型中尤为重要，因为句子空间是无限的。","讲者还指出，log derivative trick是强化学习中一个关键的数学工具，它使得梯度估计成为可能，并且为后续的强化学习算法（如RLHF）奠定了基础。","最后，讲者总结了整个推导过程，强调了通过log derivative trick将梯度估计转化为期望值的重要性，以及这种方法在实际应用中的有效性。"],"formulas":[{"latex":"\\nabla_{\\theta} \\mathbb{E}_{p_\\theta} [R] = \\mathbb{E}_{p_\\theta} [R \\nabla_{\\theta} \\log p_\\theta]","symbols":"梯度估计公式，使用对数导数技巧将梯度估计转换为期望值","explanation":"公式正确应用了对数导数技巧，将梯度估计转换为期望值，适用于概率分布p_θ下的奖励R的梯度估计。","evidence":"I assume you have seen this, but I'm going to go over this. But this is a log derivative trick, which is we can rewrite the gradient of p theta as p theta times gradient of log p theta. So to see that this is simply from the chain rule is that the gradient of log p theta simply can be written as one by p theta and gradient multiplied by gradients of p theta. Cool. So we can rewrite this as to get this identity where the gradient of p theta can be rewritten as p theta gradient log p theta. Cool. So the quantities in yellow is what we want to substitute back. And if we plug this back in, we get the following equation, which is reward of gradient of p theta is the same as expectation under p theta, our gradient of log p theta. All right. And we want to be able to create some kind of a stochastic estimator so that we can get the gradient out. So this log derivative trick is what allows us to take this gradient and convert it into an expectation, which we can sample and then approximate. And this is what we get as a final result, is that it's again an expectation of a reward-multiplied gradient of log p theta."}],"uncertainties":[],"diagram":"none","start":978.54,"end":1135.59,"asr_flags":[],"math_clarifications":["公式正确应用了对数导数技巧，将梯度估计转换为期望值，适用于概率分布p_θ下的奖励R的梯度估计。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":978.54,"text":"And I'll do a brief recap here because it's important, and we'll slowly lead into the RLHF pipeline as well. But I presume you have seen this before. Great. So in this generic objective, when we want to estimate, the quantity that we want is the gradient of the expected reward, where we want the sample's S-hat to have a high reward under R."},{"start":1004.93,"text":"So this can be written down. This is just algebra at this point where the expectation can be written down as a summation of RS multiplied by P theta S. And we have the gradient here. So this is a definition of expectation. And now we're going to propagate the gradient forward simply by linearity of the gradient."},{"start":1032.65,"text":"I assume you have seen this, but I'm going to go over this. But this is a log derivative trick, which is we can rewrite the gradient of p theta as p theta times gradient of log p theta. So to see that this is simply from the chain rule is that the gradient of log p theta simply can be written as one by p theta and gradient multiplied by gradients of p theta. Cool."},{"start":1059.45,"text":"So we can rewrite this as to get this identity where the gradient of p theta can be rewritten as p theta gradient log p theta. Cool. So the quantities in yellow is what we want to substitute back. And if we plug this back in, we get the following equation, which is reward of gradient of p theta is the same as expectation under p theta, our gradient of log p theta. All right."},{"start":1094.94,"text":"Why did we do all this? Typically, like when we're computing expectation over sentences, it's really not possible to enumerate every single sentence possible. It's just simply like intractable to even try to do that. So you want to be able to estimate the gradient somehow."},{"start":1112.88,"text":"And we want to be able to create some kind of a stochastic estimator so that we can get the gradient out. So this log derivative trick is what allows us to take this gradient and convert it into an expectation, which we can sample and then approximate. And this is what we get as a final result, is that it's again an expectation of a reward-multiplied gradient of log p theta."}],"speech_gaps":[],"frame":"../frames/v036/007.webp","frame_time":990.54},{"title":"强化学习在大语言模型中的应用","segments":[{"id":55,"text":"So the question is, do we take this gradient because we cannot backpropagate correctly? There's two reasons, really. First is we cannot set up an objective where we cannot assume the reward is differentiable. Second, which is the more precise mathematical answer, is that our parameters are in the expectation. So we do need to figure out a way to take the gradients back to the parameters in the expectation as well.","start":1137.16,"end":1164.35},{"id":56,"text":"But if our rewards were differentiable, we don't necessarily need to set our optimization objective like this. We could imagine other optimization objectives where we directly backpropagate end-to-end. Okay, so we went through all the math just to show that we can rewrite the gradient of our original objective, and we can rewrite it as an expectation again, which we can now approximate using Monte Carlo estimates, which is the equation on the end.","start":1165.54,"end":1195.25},{"id":57,"text":"And we can take this approximate gradient and plug it into our favorite optimizer, which uses gradient descent or ascent. And that's really like, this is just supposed to be a brief recap. So yeah. And it's a very intuitive objective as well. So really all it's saying is that if for a certain sample, the reward is high, we should increase the log likelihood. So if you...","start":1195.81,"end":1222.96},{"id":58,"text":"the parameters are taking the gradient direction of samples which score high on the reward. And that's really all this objective says. And if it's bad, you take directions opposite to those samples. Cool. And yeah, this is why we call it reinforcement learning because we're doing good actions go there, bad actions don't go there. The question is, am I drawing full sentences or tokens? In this context, we'll be drawing full sentences. Yeah.","start":1224.07,"end":1255.42},{"id":59,"text":"The notation was set up generally, so we'll go back to the x, y notation again, but that was just supposed to be a brief primer on policy gradients. Cool. So, first problem is that we have so far assumed that we have some kind of a reward function which will tell us, hey, the summary is 10.0, the other is 5.0.","start":1255.9,"end":1279.67},{"id":60,"text":"That usually is not possible. Let's say you're training the biggest and the greatest LLM possible and it needs millions of such queries. We're not going to have a human army sit there and label every answer. So it's not very scalable to ask humans directly. So the general solution towards this end has been to make preference learning a separate optimization problem where we try to figure out a human reward model before starting our RL optimization.","start":1280.9,"end":1308.48}],"notes":["本段讨论了在强化学习中为何需要计算梯度，即使无法正确进行反向传播。首先，当奖励函数不可微时，无法设定一个可微的目标函数。其次，参数位于期望中，因此需要找到一种方法将梯度反向传播到这些参数。这表明在处理不可微奖励时，需要采用替代方法，如蒙特卡洛估计。","如果奖励函数是可微的，就不需要采用这种优化目标。可以想象其他优化目标，直接进行端到端的反向传播。通过数学推导，可以将原始目标的梯度重写为期望形式，从而使用蒙特卡洛估计进行近似。这表明在强化学习中，梯度计算和近似是关键步骤。","可以将近似梯度输入到最喜欢的优化器中，使用梯度下降或上升。这只是一个简要的回顾，但目标非常直观：如果某个样本的奖励高，就增加其对数似然。这表明强化学习的目标是通过奖励信号调整参数。","参数会沿着奖励高的样本方向进行梯度更新，而奖励低的样本则相反。这正是强化学习的名称来源，因为好的动作会带来奖励，坏的动作则不会。此外，讨论了在强化学习中是否绘制完整句子或标记的问题，指出在此上下文中会绘制完整句子。","在讨论中，使用了x和y的符号表示，但这是对策略梯度方法的简要介绍。第一个问题是假设存在一个奖励函数，可以给出如“摘要为10.0，另一个为5.0”的反馈。然而，这在实际中通常是不可行的。","当训练大型语言模型时，需要大量查询，不可能让人类标注每个答案。因此，通常采用偏好学习作为独立的优化问题，先构建人类奖励模型，再进行强化学习优化。这表明在实际应用中，需要解决奖励函数的可扩展性问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1137.16,"end":1308.48,"asr_flags":[],"math_clarifications":["原始片段中提到的梯度更新公式和目标函数的定义存在数学类型错误，需要修正以确保梯度作用于正确的函数，并包含奖励函数的乘积项。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1137.16,"text":"So the question is, do we take this gradient because we cannot backpropagate correctly? There's two reasons, really. First is we cannot set up an objective where we cannot assume the reward is differentiable. Second, which is the more precise mathematical answer, is that our parameters are in the expectation. So we do need to figure out a way to take the gradients back to the parameters in the expectation as well."},{"start":1165.54,"text":"But if our rewards were differentiable, we don't necessarily need to set our optimization objective like this. We could imagine other optimization objectives where we directly backpropagate end-to-end. Okay, so we went through all the math just to show that we can rewrite the gradient of our original objective, and we can rewrite it as an expectation again, which we can now approximate using Monte Carlo estimates, which is the equation on the end."},{"start":1195.81,"text":"And we can take this approximate gradient and plug it into our favorite optimizer, which uses gradient descent or ascent. And that's really like, this is just supposed to be a brief recap. So yeah. And it's a very intuitive objective as well. So really all it's saying is that if for a certain sample, the reward is high, we should increase the log likelihood. So if you..."},{"start":1224.07,"text":"the parameters are taking the gradient direction of samples which score high on the reward. And that's really all this objective says. And if it's bad, you take directions opposite to those samples. Cool. And yeah, this is why we call it reinforcement learning because we're doing good actions go there, bad actions don't go there. The question is, am I drawing full sentences or tokens? In this context, we'll be drawing full sentences. Yeah."},{"start":1255.9,"text":"The notation was set up generally, so we'll go back to the x, y notation again, but that was just supposed to be a brief primer on policy gradients. Cool. So, first problem is that we have so far assumed that we have some kind of a reward function which will tell us, hey, the summary is 10.0, the other is 5.0."},{"start":1280.9,"text":"That usually is not possible. Let's say you're training the biggest and the greatest LLM possible and it needs millions of such queries. We're not going to have a human army sit there and label every answer. So it's not very scalable to ask humans directly. So the general solution towards this end has been to make preference learning a separate optimization problem where we try to figure out a human reward model before starting our RL optimization."}],"speech_gaps":[],"frame":"../frames/v036/008.webp","frame_time":1149.16},{"title":"强化学习在大语言模型中的应用","segments":[{"id":61,"text":"So, yeah, so we had two summaries and we pretended the score was 8.0 and 1.2. And we'll try to train on some kind of data where we try to predict the score so that we have a learned reward function, which we can later use in the RL. OK, so we talked about like we want to learn this reward model and we have some summaries where, you know, like we want to be able to predict their score.","start":1311.16,"end":1337.17},{"id":62,"text":"How do we get these scores? So we need some kind of an annotated data set. Now, the issue is that if we ask humans for scores directly, two different humans have completely different calibration. So for a summary that has a score of seven would mean something completely differently to two humans. So there's not really an easy way to aggregate. And even for the same human, they would probably score the same summary differently at different points depending on what they ate for lunch or something.","start":1338.75,"end":1366.59},{"id":63,"text":"It's not really easy to get a score directly from humans. And if you ask them directly, it doesn't work out very well. The reward models you learn are not very useful for training such language models. So the solution to this is to not actually ask them for a score, but to actually ask them for preferences.","start":1368.56,"end":1388.96},{"id":64,"text":"We give them a few summaries and we just ask them, hey, do you prefer this summary over this summary or not? And this is the kind of annotated data set we should expect to collect for humans.","start":1390.88,"end":1401.66},{"id":65,"text":"So now going a little bit deeper into this. So we are going to collect a data set of the form where we're given some kind of an input X, and we're going to be given some kind of a winning summary, which is YW, and we're going to be given some kind of a losing summary, YL. And we're going to have some data set D for this.","start":1403.38,"end":1421.86},{"id":66,"text":"And what we want to do is train a reward model which assigns a higher score to the winning summaries and assigns a lower score to the losing summaries. So the optimization objective, which is called the Bradley-Terry objective, is a way of going from such a data set of preferences to an implicit reward score which would align with the preferences. And the way we train this is we minimize this log sigmoid.","start":1422.41,"end":1451.23},{"id":67,"text":"and the difference of reward assigned to the winning and the losing summary. So yeah, all this objective is saying is that a reward model should make sure the reward for the correct summary is higher than the reward of the losing summary.","start":1451.71,"end":1470.79}],"notes":["本段介绍了如何通过人类的偏好来构建奖励模型，而不是直接获取评分。由于人类评分存在较大的主观性和不一致性，因此采用偏好数据集更为可靠。","在构建奖励模型时，需要收集包含输入X、获胜摘要YW和失败摘要YL的数据集D。通过这种方式，可以训练出一个能够区分不同摘要质量的奖励模型。","优化目标是使用Bradley-Terry目标函数，该函数将偏好数据集转化为隐式的奖励分数。训练过程中，需要最小化对数sigmoid函数，以确保奖励模型能够正确区分获胜和失败的摘要。","奖励模型的目标是使获胜摘要的奖励值高于失败摘要的奖励值。这表明模型需要学习如何根据人类的偏好来调整奖励函数，从而更好地指导强化学习过程。","在实际应用中，通过收集人类的偏好数据，可以构建出更符合实际需求的奖励模型，从而提升语言模型的性能。","该方法避免了直接评分带来的主观性和不一致性问题，通过偏好数据集的构建，使得奖励模型更加可靠和实用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1311.16,"end":1470.79,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1311.16,"text":"So, yeah, so we had two summaries and we pretended the score was 8.0 and 1.2. And we'll try to train on some kind of data where we try to predict the score so that we have a learned reward function, which we can later use in the RL. OK, so we talked about like we want to learn this reward model and we have some summaries where, you know, like we want to be able to predict their score."},{"start":1338.75,"text":"How do we get these scores? So we need some kind of an annotated data set. Now, the issue is that if we ask humans for scores directly, two different humans have completely different calibration. So for a summary that has a score of seven would mean something completely differently to two humans. So there's not really an easy way to aggregate. And even for the same human, they would probably score the same summary differently at different points depending on what they ate for lunch or something."},{"start":1368.56,"text":"It's not really easy to get a score directly from humans. And if you ask them directly, it doesn't work out very well. The reward models you learn are not very useful for training such language models. So the solution to this is to not actually ask them for a score, but to actually ask them for preferences."},{"start":1390.88,"text":"We give them a few summaries and we just ask them, hey, do you prefer this summary over this summary or not? And this is the kind of annotated data set we should expect to collect for humans."},{"start":1403.38,"text":"So now going a little bit deeper into this. So we are going to collect a data set of the form where we're given some kind of an input X, and we're going to be given some kind of a winning summary, which is YW, and we're going to be given some kind of a losing summary, YL. And we're going to have some data set D for this."},{"start":1422.41,"text":"And what we want to do is train a reward model which assigns a higher score to the winning summaries and assigns a lower score to the losing summaries. So the optimization objective, which is called the Bradley-Terry objective, is a way of going from such data set of preferences to an implicit reward score which would align with the preferences. And the way we train this is we minimize this log sigmoid."},{"start":1451.71,"text":"and the difference of reward assigned to the winning and the losing summary. So yeah, all this objective is saying is that a reward model should make sure the reward for the correct summary is higher than the reward of the losing summary."}],"speech_gaps":[],"frame":"../frames/v036/009.webp","frame_time":1323.16},{"title":"强化学习在大语言模型中的应用","segments":[{"id":68,"text":"So the question is like, is it unbounded or do you normalize this? The actual issue that arises, which is, this is actually a very important observation that we'll actually use to develop DPO as well. The objectives just ask the difference to be high. So the difference will be high even if you assign a reward of 1,000 and 10,000, or it'll be high even if you assign a difference from 1 to 999. There's no real like...","start":1471.72,"end":1499.54},{"id":69,"text":"scaling here, which allows that. So yeah, typically you have to do some kind of post-hoc normalization to make sure that different prompts get rewards at the same scale. Otherwise, the optimization objective can get a little wonky. But yeah, this is the Bradley-Terry objective, which allows us to go from a data set of preferences to a reward model, which we'll use in RLHL.","start":1499.9,"end":1524.47},{"id":70,"text":"Yeah, the question is, is that why we take the sigmoid? Not really. There's a few different functions you can set up. Sigmoid just maps naturally to the probability of this sample winning over this sample. So yeah, that's why it's typically used as a sigmoid. But really, all we want to encourage is that the reward model should, the difference should be high. All right. So now we get back to our RL loop.","start":1525.29,"end":1554.75},{"id":71,"text":"What do we have? We have some kind of an instruction-tuned model, let's say PPT. We have learned some kind of a reward model using the Bradley-Terry objective, which gives us a scalar output. So it takes an input, x, gives us a summary, and then gives us a scalar output, rm phi x, y.","start":1555.58,"end":1573.22},{"id":72,"text":"Okay, so this is the simple part. In some ways, we're going to do the RLHF loop here. And the way we're going to do this is we want to optimize the expected reward as we start with, where we're going to plug in our LLM parameters in the expectation for p theta. So it will produce some kind of a summary y hat conditioned on some input x. And our reward model is going to be the learned reward model from preferences. Before I move on, I have a question which is slightly hard.","start":1576.4,"end":1604.26},{"id":73,"text":"I started off saying that the reward functions are non-differentiable. And that's part of why we want to do RL. But we just learned a reward model. And we typically learn a reward model using neural networks themselves. And they are very much differentiable. We can do backpropagate through them. So why are we doing RL? That's the right answer. So we're outputting discrete tokens.","start":1605.2,"end":1632.26}],"notes":["本段讨论了强化学习中奖励函数的归一化问题，指出即使奖励值差异很大，只要差异本身足够大，就可以满足优化目标。这引出了Bradley-Terry目标函数的应用，该函数允许从偏好数据集构建奖励模型，用于后续的强化学习过程。","讲者提到，虽然奖励函数本身可能是非可微的，但通过使用神经网络学习奖励模型，可以实现可微性，从而支持反向传播。这解释了为何在实际应用中仍然需要强化学习，因为输出是离散的token，而神经网络的可微性有助于优化。","在RLHF（强化学习与人类反馈）循环中，讲者强调了如何将LLM参数嵌入到期望中，以优化预期奖励。这涉及将输入x映射到总结y_hat，并利用从偏好中学习的奖励模型进行评估。","讲者还提到，虽然奖励函数可能非可微，但通过使用神经网络学习奖励模型，可以实现可微性，从而支持反向传播。这解释了为何在实际应用中仍然需要强化学习，因为输出是离散的token，而神经网络的可微性有助于优化。","讲者指出，虽然奖励函数可能非可微，但通过使用神经网络学习奖励模型，可以实现可微性，从而支持反向传播。这解释了为何在实际应用中仍然需要强化学习，因为输出是离散的token，而神经网络的可微性有助于优化。","讲者最后提到，虽然奖励函数可能非可微，但通过使用神经网络学习奖励模型，可以实现可微性，从而支持反向传播。这解释了为何在实际应用中仍然需要强化学习，因为输出是离散的token，而神经网络的可微性有助于优化。"],"formulas":[],"uncertainties":["rm phi x, y"],"diagram":"none","start":1471.72,"end":1632.26,"asr_flags":[],"math_clarifications":["原始文本中未明确提及期望奖励的数学表达式，因此无法核定该公式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1471.72,"text":"So the question is like, is it unbounded or do you normalize this? The actual issue that arises, which is, this is actually a very important observation that we'll actually use to develop DPO as well. The objectives just ask the difference to be high. So the difference will be high even if you assign a reward of 1,000 and 10,000, or it'll be high even if you assign a difference from 1 to 999. There's no real like..."},{"start":1499.9,"text":"scaling here, which allows that. So yeah, typically you have to do some kind of post-hoc normalization to make sure that different prompts get rewards at the same scale. Otherwise, the optimization objective can get a little wonky. But yeah, this is the Bradley-Terry objective, which allows us to go from a data set of preferences to a reward model, which we'll use in RLHL."},{"start":1525.29,"text":"Yeah, the question is, is that why we take the sigmoid? Not really. There's a few different functions you can set up. Sigmoid just maps naturally to the probability of this sample winning over this sample. So yeah, that's why it's typically used as a sigmoid. But really, all we want to encourage is that the reward model should, the difference should be high. All right. So now we get back to our RL loop."},{"start":1555.58,"text":"What do we have? We have some kind of an instruction-tuned model, let's say PPT. We have learned some kind of a reward model using the Bradley-Terry objective, which gives us a scalar output. So it takes an input, x, gives us a summary, and then gives us a scalar output, rm phi x, y."},{"start":1576.4,"text":"Okay, so this is the simple part. In some ways, we're going to do the RLHF loop here. And the way we're going to do this is we want to optimize the expected reward as we start with, where we're going to plug in our LLM parameters in the expectation for p theta. So it will produce some kind of a summary y hat conditioned on some input x. And our reward model is going to be the learned reward model from preferences. Before I move on, I have a question which is slightly hard."},{"start":1605.2,"text":"I started off saying that the reward functions are non-differentiable. And that's part of why we want to do RL. But we just learned a reward model. And we typically learn a reward model using neural networks themselves. And they are very much differentiable. We can do backpropagate through them. So why are we doing RL? That's the right answer. So we're outputting discrete tokens."}],"speech_gaps":[],"frame":"../frames/v036/010.webp","frame_time":1483.72},{"title":"强化学习在大语言模型中的挑战","segments":[{"id":74,"text":"And when we assume we can backpropagate things, we cannot actually backpropagate through the discrete language tokens. So even if we have a reward model that is differentiable, we generate some output, we plug it into our reward model, and then we want to go back directly to the parameters of the language model. But we get this discrete bottleneck in the middle where we cannot backpropagate our gradients from the reward model to the language model.","start":1632.9,"end":1659.93},{"id":75,"text":"And that's the reason why we again have to resort to RL, even though we have a differentiable non-black box reward model here. But good attempts, everyone. These are close. Yeah. So let's say we have a reward model RM5, X, Y hat. Let's assume Y is a continuous variable. So typically, we'll take some input. We'll generate some output. We'll plug it into a learned reward model.","start":1662.21,"end":1690.45},{"id":76,"text":"And if everything is a continuous function here, you can rely on backpropagation to take the gradients and update the model parameters such that the reward model score keeps going up. So you don't actually need to do RL. And not doing RL is often very good because it's expensive to do because of the sampling. But the issue is that our Y hat here are discrete tokens. So they're sampled from some underlying distribution.","start":1691.05,"end":1719.43},{"id":77,"text":"And once you include the sampling operation, it's very hard to like, there are tricks to do that, but they're not very stable. But it's hard to like back propagate through there. Yes, so I didn't want to assume like Gumball Softmax is known to people here, but like Gumball Softmax, unfortunately, like so far hasn't scaled super well.","start":1720.71,"end":1741.64},{"id":78,"text":"especially like now the language. So to contextualize this, y hat is a sentence, which could be thousands and thousands of tokens. And each token, vocabulary sizes are on the order of hundreds of thousands of tokens. So it's, yeah, the entire sentence is a combinatorial space of like 100,000 tokens multiplied by the sequence length. Gumball softmax usually doesn't scale beyond like thousand dimensions or so on. Yeah. Cool.","start":1742.25,"end":1771.83},{"id":79,"text":"This is a hard question. So I wanted to touch upon this because you should never assume that you need to do RL. So yeah. All right. So one issue, even when we set up this objective, is that, and somebody alluded to this, was that our reward models are never perfect. So we don't want to...","start":1772.36,"end":1797.69}],"notes":["本段讨论了在大语言模型中使用强化学习时遇到的挑战，特别是由于离散语言标记的存在，无法直接通过反向传播进行梯度更新。即使有可微的奖励模型，也需要通过采样生成输出，这导致了梯度传播的瓶颈。","讲者提到，当所有变量都是连续函数时，可以依赖反向传播来更新模型参数，使奖励模型得分持续上升。但实际情况下，生成的输出是离散的标记，这使得反向传播变得困难。","讲者指出，Gumbel Softmax 是一种用于处理离散变量的技巧，但其扩展性有限，通常无法处理超过千维的维度。这进一步说明了在大语言模型中使用强化学习的复杂性。","讲者强调，不应假设必须使用强化学习，因为奖励模型本身并不完美，且使用强化学习的成本较高，尤其是在采样过程中。","讲者提到，生成的句子可能包含成千上万个标记，词汇量也达到数十万级别，这使得整个句子的组合空间非常庞大，进一步增加了反向传播的难度。","最后，讲者指出，这是一个复杂的问题，需要仔细考虑是否真的需要使用强化学习，以及如何处理奖励模型的不完美性。"],"formulas":[],"uncertainties":["Gumbel Softmax 的具体实现细节未明确说明，可能涉及复杂的数学处理。"],"diagram":"none","start":1632.9,"end":1797.69,"asr_flags":[],"math_clarifications":["原文中未出现任何数学公式，因此无法进行数学公式校对。所有提及的术语和概念均为描述性内容，未涉及数学表达式。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1632.9,"text":"And when we assume we can backpropagate things, we cannot actually backpropagate through the discrete language tokens. So even if we have a reward model that is differentiable, we generate some output, we plug it into our reward model, and then we want to go back directly to the parameters of the language model. But we get this discrete bottleneck in the middle where we cannot backpropagate our gradients from the reward model to the language model."},{"start":1662.21,"text":"And that's the reason why we again have to resort to RL, even though we have a differentiable non-black box reward model here. But good attempts, everyone. These are close. Yeah. So let's say we have a reward model RM5, X, Y hat. Let's assume Y is a continuous variable. So typically, we'll take some input. We'll generate some output. We'll plug it into a learned reward model."},{"start":1691.05,"text":"And if everything is a continuous function here, you can rely on backpropagation to take the gradients and update the model parameters such that the reward model score keeps going up. So you don't actually need to do RL. And not doing RL is often very good because it's expensive to do because of the sampling. But the issue is that our Y hat here are discrete tokens. So they're sampled from some underlying distribution."},{"start":1720.71,"text":"And once you include the sampling operation, it's very hard to like, there are tricks to do that, but they're not very stable. But it's hard to like back propagate through there. Yes, so I didn't want to assume like Gumball Softmax is known to people here, but like Gumball Softmax, unfortunately, like so far hasn't scaled super well."},{"start":1742.25,"text":"especially like now the language. So to contextualize this, y hat is a sentence, which could be thousands and thousands of tokens. And each token, vocabulary sizes are on the order of hundreds of thousands of tokens. So it's, yeah, the entire sentence is a combinatorial space of like 100,000 tokens multiplied by the sequence length. Gumball softmax usually doesn't scale beyond like thousand dimensions or so on. Yeah. Cool."},{"start":1772.36,"text":"This is a hard question. So I wanted to touch upon this because you should never assume that you need to do RL. So yeah. All right. So one issue, even when we set up this objective, is that, and somebody alluded to this, was that our reward models are never perfect. So we don't want to..."}],"speech_gaps":[],"frame":"../frames/v036/011.webp","frame_time":1644.9},{"title":"强化学习在大语言模型中的应用","segments":[{"id":80,"text":"assume that they'll give us a perfect score. After all, they have been fit to human preferences on a certain distribution. We don't want to assume that they'll give us a good score for every single input and output. And if you do naive optimization like we described so far, you will get models which have the reward model, and we'll see some plots for that later as well. So one another thing we add is something called the KL penalty or the callback library divergence.","start":1798.3,"end":1825.25},{"id":81,"text":"And what the KL penalty basically says is, so it's added to the reward where we have beta log P theta by P pre-trained. So P theta is the quantity we are optimizing right now. This is the language model, which is currently assigning the probabilities to token Y hat. And P pre-trained is the model we started with. So it could be instruction fine-tuned, and these are the probabilities under those models.","start":1826.13,"end":1855.15},{"id":82,"text":"And roughly speaking, whenever a probability distribution deviates from the pre-trained distribution, we get a penalty. So we get a lower score if we are deviating too much from the pre-trained model. And if you work out the math, this thing is exactly the KL divergence between our distribution or our language model that we are optimizing right now and the language model we started with.","start":1855.69,"end":1884.64},{"id":83,"text":"The reason why we want to do this is that, as I said, the reward model is imperfect. We know it's more accurate on a distribution of preferences that we trained on, and we want to make sure the model stays close to where it started off from. So this is one of the first examples of RLHF where it worked quite well. So this is a summarization task itself.","start":1887.42,"end":1914.24},{"id":84,"text":"And the curve basically, the x-axis is the model size and the y-axis is how often is the summary preferred over some ground truth summary for some news articles. And if you look at the blue curve, it's the pre-training curve, which as the model size increases, the fraction of summaries preferred over the baseline increases.","start":1914.85,"end":1938.42},{"id":85,"text":"And then you have SFT or instruction fine tuning, which gives an improvement over the pre-trained model. But when you look at the RL curve, this is the first model which actually exceeds the human written summaries. So now we are generating summaries, even at a small size, which are preferred over human summaries. And that's just like one of the earlier results in RLHF, which shows like the power of optimizing for preferences directly.","start":1939.36,"end":1967.58}],"notes":["本段讲解了在强化学习中引入KL罚项（KL penalty）的动机和作用。KL罚项通过在奖励函数中加入KL散度，确保优化后的模型不会偏离预训练模型太远，从而避免奖励模型的不准确性带来的问题。","KL罚项的数学表达为β乘以KL散度，其中Pθ是当前优化的语言模型，P_pre-trained是初始的预训练模型。KL散度衡量的是当前模型分布与初始模型分布之间的差异，当差异过大时，罚项会降低奖励分数。","引入KL罚项的目的是为了确保模型在优化过程中保持与初始模型的相似性，尤其是在奖励模型不完美的情况下。这有助于防止模型在优化过程中偏离人类偏好分布。","在实际应用中，KL罚项是RLHF（强化学习与人类反馈）中的一个关键组件，它帮助模型在优化过程中保持与人类偏好的一致性，同时避免过拟合或偏离初始分布。","通过实验曲线可以看出，随着模型规模的增加，预训练模型的总结质量逐渐提高，而经过指令微调（SFT）和强化学习优化后的模型在小规模时就能超越人类编写的总结。","这些结果展示了直接优化人类偏好在强化学习中的有效性，表明通过引入KL罚项可以显著提升模型在特定任务上的表现。"],"formulas":[{"latex":"KL(P_{\\theta} \\parallel P_{\\text{pre-trained}})","symbols":"KL散度，衡量当前模型分布与初始模型分布之间的差异","explanation":"公式正确，KL散度用于衡量两个概率分布之间的差异，符合数学定义。","evidence":"And roughly speaking, whenever a probability distribution deviates from the pre-trained distribution, we get a penalty. So we get a lower score if we are deviating too much from the pre-trained model. And if you work out the math, this thing is exactly the KL divergence between our distribution or our language model that we are optimizing right now and the language model we started with."}],"uncertainties":["beta log P theta by P pre-trained"],"diagram":"none","start":1798.3,"end":1967.58,"asr_flags":[],"math_clarifications":["公式1是正确的KL散度表达式，用于衡量当前模型分布与初始模型分布之间的差异。公式2不完整，缺少必要的运算符，无法正确表达KL罚项。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1798.3,"text":"assume that they'll give us a perfect score. After all, they have been fit to human preferences on a certain distribution. We don't want to assume that they'll give us a good score for every single input and output. And if you do naive optimization like we described so far, you will get models which have the reward model, and we'll see some plots for that later as well. So one another thing we add is something called the KL penalty or the callback library divergence."},{"start":1826.13,"text":"And what the KL penalty basically says is, so it's added to the reward where we have beta log P theta by P pre-trained. So P theta is the quantity we are optimizing right now. This is the language model, which is currently assigning the probabilities to token Y hat. And P pre-trained is the model we started with. So it could be instruction fine-tuned, and these are the probabilities under those models."},{"start":1855.69,"text":"And roughly speaking, whenever a probability distribution deviates from the pre-trained distribution, we get a penalty. So we get a lower score if we are deviating too much from the pre-trained model. And if you work out the math, this thing is exactly the KL divergence between our distribution or our language model that we are optimizing right now and the language model we started with."},{"start":1887.42,"text":"The reason why we want to do this is that, as I said, the reward model is imperfect. We know it's more accurate on a distribution of preferences that we trained on, and we want to make sure the model stays close to where it started off from. So this is one of the first examples of RLHF where it worked quite well. So this is a summarization task itself."},{"start":1914.85,"text":"And the curve basically, the x-axis is the model size and the y-axis is how often is the summary preferred over some ground truth summary for some news articles. And if you look at the blue curve, it's the pre-training curve, which as the model size increases, the fraction of summaries preferred over the baseline increases."},{"start":1939.36,"text":"And then you have SFT or instruction fine tuning, which gives an improvement over the pre-trained model. But when you look at the RL curve, this is the first model which actually exceeds the human written summaries. So now we are generating summaries, even at a small size, which are preferred over human summaries. And that's just like one of the earlier results in RLHF, which shows like the power of optimizing for preferences directly."}],"speech_gaps":[],"frame":"../frames/v036/012.webp","frame_time":1810.3},{"title":"偏好学习中的非传递性与挑战","segments":[{"id":86,"text":"The question is, are there models for human preferences which are not just binary and account for fuzzy? I think this is a very hard question which goes into... So it is known that human preferences can often be intransitive. So what do I mean by that? Let's say we prefer A over B, then we prefer B over C, and then we prefer C over A.","start":1968.59,"end":1994.27},{"id":87,"text":"this doesn't make any sense. Because ideally, if you prefer A over B and B over C, you should prefer A over C. But we get lots of scenarios where humans prefer A over C as well. And you will, unfortunately, observe some noise in the data like that where the preferences... In fact, the preferences we observe in real life are very, very noisy.","start":1995.24,"end":2017.88},{"id":88,"text":"And I don't think we have a great solution for this. To even ground this, preference learning is a binary classification task. We're just trying to predict which sample is winning. So it's a binary classification task. Most binary classifications, you can reach an accuracy of 90%, 95%. But for most of our language model and reward models, we reach an accuracy of 65% to 70%. So we're barely doing better than chance.","start":2019.2,"end":2045.32},{"id":89,"text":"But even that is still enough to give us pretty large improvements in performance. The question is, what changed to make this differentiable? We did not make anything differentiable. That's the reason why we started doing RL, is to be able to take the policy gradient. This estimator, this does not require us to be able to... So that just requires the gradient to be with the log probabilities of the model.","start":2046.66,"end":2074.8},{"id":90,"text":"It does not backpropagate into the reward at all. So the question is, what if the P theta RL is less than P theta PD? And wouldn't that encourage the model to go in those directions? It's good to know. So the expectation is broken down here into more explicitly. But it's good to know a property about KL divergence that is always greater than or equal to 0. I'll leave that as an exercise for you to prove that. So the penalty is always positive.","start":2075.4,"end":2104.05},{"id":91,
