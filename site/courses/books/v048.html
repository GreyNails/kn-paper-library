od. All right. Now, So what we had is we had, remember, we had t u1 was the entire line. t is an element of r. And then here, alpha u1 is some particular point on there. So alpha would be, we're ranging over alpha as ranging over this line. Yeah, some scalar."}],"uncertainties":["在讲者提到 't is an element of r' 时，'r' 的具体含义不明确，可能是实数集或某个特定的集合，需要进一步澄清。","讲者提到 'the norm is squared'，但未明确指出是哪个向量的范数，可能需要结合上下文进一步确认。","讲者提到 'this is a nice convex function in alpha'，但未明确说明凸函数的具体性质，可能需要进一步解释。"],"diagram":"none","start":3420.17,"end":3588.25,"asr_flags":[],"math_clarifications":["无需要特别说明的数学修复，所有公式均符合数学规范。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3420.17,"text":"All right. Now, how am I thinking about this line? I'm going to write this whole thing out by hand, and then it'll be easier to do. So the formula for the line is, it's the set of t u1 such that t is an element of r. That's what it means to be the line and direction u1. I just take all the t's that are possible, and I just multiply them by. So far, so good. All right. Now,"},{"start":3452.97,"text":"All right, so now let's figure out exactly how this works. So the first thing to remember about this component is I can rewrite this, this term here as x square plus alpha square u1 minus two times alpha u1 x. Okay, please. Yes, good catch."},{"start":3486.03,"text":"Perfect. Thank you. The norm is squared. Okay. Now, in my head, that doesn't matter too much because it's 1. But yeah, awesome. u1 is 1, but you're exactly right. That was a mistake syntactically to be 1. So that one goes away. When I'm minimizing this character, what is my trick? Oh, yeah. This is the inner product. Sorry, we don't use annotation. Sorry, sorry, sorry. u1 transpose x. Cool."},{"start":3520.54,"text":"Okay. So when we differentiate this character, what happens? Well, what we're minimizing over is alpha. So what do we get when all is said and done? Well, I have it on the next line. So is it clear enough what we're doing? We look across all the points here on this line. We try and pick one that is the smallest distance away. We've written the form of this. We've just put in the form here. And now we're going to try and solve for alpha, which is going to be taking a derivative because this is a nice convex function in alpha."},{"start":3562.38,"text":"Alpha is the scalar. It's the index. It's the T in my last notation. So here's the picture another way."},{"start":3572.32,"text":"So what we had is we had, remember, we had t u1 was the entire line. t is an element of r. And then here, alpha u1 is some particular point on there. So alpha would be, we're ranging over alpha as ranging over this line. Yeah, some scalar."}],"speech_gaps":[{"start":3550.608,"end":3552.144},{"start":3553.536,"end":3555.44},{"start":3555.44,"end":3561.98}],"frame":"../frames/v048/021.webp","frame_time":3432.17},{"title":"投影与残差在主成分分析中的作用","segments":[{"id":382,"text":"Why is this more efficient than just computing the orthogonal projection of each of these points on the line? Great question. First, what we're going to do is right now what we're deriving is just the nature of how to do the closest point to the line. What you will see in a second is this guy is the orthogonal projector. It's just going to fall out from our analysis that this one is the piece that we're after. It's the same. Awesome.","zh":"为什么这种方法比直接计算这些点在直线上的正交投影更高效？这是个好问题。首先，我们现在推导的内容只是关于如何找到离直线最近的点的本质。你马上就会看到，这个就是正交投影器。从我们的分析中会自然得出，这就是我们想要的部分。它是一样的。很棒。","start":3591.61,"end":3617.09},{"id":383,"text":"Cool. So when we computed this derivative and set the derivative equal to 0 and use u squared equals 1, we got this expression. So this is 1. We got 2 alpha. We got minus 2 u2. Set it equal to 0. Boom. We get that. Clear enough? Ask a question if not. Just computing that piece. And then as was pointed out, which is great, is suppose we have u1, uk, element of Rd.","zh":"好。当我们计算了这个导数并将导数设为0，同时使用了u平方等于1，我们得到了这个表达式。所以这是1。我们得到了2 alpha。我们得到了减去2 u2。设为0。Boom。我们得到了这个结果。清楚吗？如果不清楚，请提问。只是计算了这一部分。正如所指出的，这很好，假设我们有u1, uk，属于Rd。","start":3617.61,"end":3644.23},{"id":384,"text":"We have to use this fact that they are orthogonal here. How does that help us? Well, the closest point to the subspace, so now in a higher dimension, say you have, instead of a line, you have a plane, or you have a hyperplane or something like that. You want to compute the closest point. Then you use exactly the same decomposition, and boom, you get exactly these minimizers. But for this decomposition to work, you have to use that they're orthogonal.","zh":"我们必须使用它们正交这一事实。这对我们有什么帮助呢？嗯，离子空间最近的点，现在在更高维空间中，比如说，而不是一条线，你有一个平面，或者一个超平面之类的。你想要计算最近的点。然后你使用完全相同的分解，Boom，你就会得到这些最小化器。但为了这个分解有效，你必须使用它们正交这一性质。","start":3644.98,"end":3674.92},{"id":385,"text":"So hopefully, this is review. If not, please ask question. Oh, don't worry about that. All right. Sounds good. So this is exactly as I pointed out, which is wonderful. This is the process of projecting onto the set of vectors spanned by mu u1 to uk. Sorry if I keep saying mu on accident. Just wired into my brain right now. I mean u in this section. There's not yet a mu. And it will always be 0 in this section. Good enough? Cool.","zh":"所以希望这对你来说是复习内容。如果不是，请提问。哦，不用担心。好吧。听起来不错。这正是我指出的，这很好。这就是将投影到由mu u1到uk张成的向量集的过程。抱歉如果我不断说mu。这现在已经刻进我的脑子里了。我的意思是，这个章节中的u。这里还没有mu。而且在这个章节中，它总是0。够好吗？酷。","start":3675.45,"end":3704.57},{"id":386,"text":"Now, the other bit of terminology is this is called the residual. This is the distance to the line or the plane, the residual to residual square. So let me show you a picture. Here's data points. Here's a line through them. Here's some residuals. So maximizing the projected variance equals minimizing the perpendicular residuals. Those two things are actually the same.","zh":"现在，另一个术语是，这被称为残差。这是到直线或平面的距离，残差的平方。让我给你展示一个图。这里有数据点。这里有穿过它们的一条线。这里有一些残差。最大化投影方差等于最小化垂直残差。这两者实际上是相同的。","start":3705.34,"end":3728.78},{"id":387,"text":"We were maximizing how much we explained it away, right? We could also minimize, we could either minimize the residual or we could maximize the explained variance. Okay, let me be more concrete. So we can maximize the projected subspace of the data. In this case, we sweep over every u, we look over all of the data, we dot it into xi squared, and we try and maximize that quantity. This says as I sweep u through it,","zh":"我们是在最大化我们对数据的解释程度，对吧？我们也可以最小化，我们既可以最小化残差，也可以最大化解释的方差。好的，让我更具体一些。因此，我们可以最大化数据的投影子空间。在这种情况下，我们遍历每一个u，我们查看所有的数据，将其与xi的平方点乘，然后尝试最大化这个量。这句话的意思是，当我遍历u时，","start":3729.74,"end":3758.01}],"notes":["本段讲解了投影到直线上的方法为何比单独计算每个点的正交投影更高效。首先，通过求导并令导数为零，结合单位向量的条件，可以得到正交投影的结果。这表明正交投影是所求的最短距离点，且该结果自然地从分析中得出。","接着，讲者指出在更高维空间中，如平面或超平面，同样可以使用相同的分解方法来计算最近点。这种分解方法依赖于向量之间的正交性，这是关键的数学前提。","讲者提到，如果这些向量不是正交的，那么这种分解方法将无法有效工作。因此，正交性是确保该方法正确性的必要条件。","随后，讲者解释了残差的概念，即数据点到直线或平面的距离。最大化投影方差等价于最小化垂直残差，这是主成分分析中的核心思想。","最后，讲者指出，最大化投影方差和最小化残差是同一问题的两种不同表述，这为后续的主成分分析提供了理论基础。","讲者还提到，可以通过遍历所有可能的向量u，并计算数据点与u的点积平方，来最大化投影方差。这为后续的主成分分析算法提供了具体的计算步骤。"],"formulas":[{"latex":"2\\alpha - 2u_2 = 0","symbols":"导数为零的条件","explanation":"该公式表示在求导并令导数为零时得到的方程，用于确定最优解。","evidence":"Cool. So when we computed this derivative and set the derivative equal to 0 and use u squared equals 1, we got this expression. So this is 1. We got 2 alpha. We got minus 2 u2. Set it equal to 0. Boom. We get that. Clear enough? Ask a question if not. Just computing that piece. And then as was pointed out, which is great, is suppose we have u1, uk, element of Rd."},{"latex":"u^T u = 1","symbols":"单位向量的条件","explanation":"该公式表示向量u是单位向量，这是优化问题中的约束条件。","evidence":"Cool. So when we computed this derivative and set the derivative equal to 0 and use u squared equals 1, we got this expression. So this is 1. We got 2 alpha. We got minus 2 u2. Set it equal to 0. Boom. We get that. Clear enough? Ask a question if not. Just computing that piece. And then as was pointed out, which is great, is suppose we have u1, uk, element of Rd."},{"latex":"\\text{Maximize } \\sum_{i=1}^n (x_i^T u)^2","symbols":"最大化投影方差","explanation":"该公式表示最大化数据点在向量u上的投影方差，这是主成分分析中的核心目标。","evidence":"We were maximizing how much we explained it away, right? We could also minimize, we could either minimize the residual or we could maximize the explained variance. Okay, let me be more concrete. So we can maximize the projected subspace of the data. In this case, we sweep over every u, we look over all of the data, we dot it into xi squared, and we try and maximize that quantity. This says as I sweep u through it,"},{"latex":"\\text{Minimize } \\sum_{i=1}^n ||x_i - \\hat{x}_i||^2","symbols":"最小化残差平方","explanation":"该公式表示最小化数据点与投影点之间的残差平方和，这是另一种等价的优化目标。","evidence":"Now, the other bit of terminology is this is called the residual. This is the distance to the line or the plane, the residual to residual square. So let me show you a picture. Here's data points. Here's a line through them. Here's some residuals. So maximizing the projected variance equals minimizing the perpendicular residuals. Those two things are actually the same."}],"uncertainties":["u squared equals 1"],"diagram":"none","start":3591.61,"end":3758.01,"asr_flags":[],"math_clarifications":["公式中的导数为零的条件和单位向量的条件是优化问题中的关键约束，确保解的正确性。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3591.61,"text":"Why is this more efficient than just computing the orthogonal projection of each of these points on the line? Great question. First, what we're going to do is right now what we're deriving is just the nature of how to do the closest point to the line. What you will see in a second is this guy is the orthogonal projector. It's just going to fall out from our analysis that this one is the piece that we're after. It's the same. Awesome."},{"start":3617.61,"text":"Cool. So when we computed this derivative and set the derivative equal to 0 and use u squared equals 1, we got this expression. So this is 1. We got 2 alpha. We got minus 2 u2. Set it equal to 0. Boom. We get that. Clear enough? Ask a question if not. Just computing that piece. And then as was pointed out, which is great, is suppose we have u1, uk, element of Rd."},{"start":3644.98,"text":"We have to use this fact that they are orthogonal here. How does that help us? Well, the closest point to the subspace, so now in a higher dimension, say you have, instead of a line, you have a plane, or you have a hyperplane or something like that. You want to compute the closest point. Then you use exactly the same decomposition, and boom, you get exactly these minimizers. But for this decomposition to work, you have to use that they're orthogonal."},{"start":3675.45,"text":"So hopefully, this is review. If not, please ask question. Oh, don't worry about that. All right. Sounds good. So this is exactly as I pointed out, which is wonderful. This is the process of projecting onto the set of vectors spanned by mu u1 to uk. Sorry if I keep saying mu on accident. Just wired into my brain right now. I mean u in this section. There's not yet a mu. And it will always be 0 in this section. Good enough? Cool."},{"start":3705.34,"text":"Now, the other bit of terminology is this is called the residual. This is the distance to the line or the plane, the residual to residual square. So let me show you a picture. Here's data points. Here's a line through them. Here's some residuals. So maximizing the projected variance equals minimizing the perpendicular residuals. Those two things are actually the same."},{"start":3729.74,"text":"We were maximizing how much we explained it away, right? We could also minimize, we could either minimize the residual or we could maximize the explained variance. Okay, let me be more concrete. So we can maximize the projected subspace of the data. In this case, we sweep over every u, we look over all of the data, we dot it into xi squared, and we try and maximize that quantity. This says as I sweep u through it,"}],"speech_gaps":[],"frame":"../frames/v048/022.webp","frame_time":3603.61},{"title":"主成分分析中的特征向量与特征值","segments":[{"id":388,"text":"I try and find the direction that hits as many of the Xi's as possible in my data. That's why if some of the Xi's had really big scalar values, they would contribute quite a bit to this, like that feet example where all of a sudden they're all multiplied by approximately 5,000. That would make them skew a lot in that direction. That's why we have to compensate earlier by normalization. This term also looks a heck of a lot like a covariance matrix.","zh":"我试图找到一个方向，使得在我的数据中尽可能多地命中Xi。这就是为什么如果某些Xi具有非常大的标量值，它们会对这一点贡献很大，比如那个脚的例子，所有数据突然都乘以了大约5000。这会使它们在该方向上产生很大的偏差。这就是为什么我们必须通过归一化来补偿。这个术语看起来也像一个协方差矩阵。","start":3758.49,"end":3788.74},{"id":389,"text":"And we'll build that up in a second. You can also minimize a residual. So let's look at some linear algebra to solve this character in general. Clear enough? Right. Now, by show of hands, who remembers eigenvalue decompositions? Which matrices have them? All matrices? No matrices? What? Symmetric. Yeah, yeah. If someone asks you, there are notions of eigenvalues for non-symmetric matrices, you should run from them.","zh":"我们稍后会逐步构建这一点。你也可以最小化残差。让我们通过一些线性代数来解决这个问题。清楚吗？对的。现在，举手示意，谁还记得特征值分解？哪些矩阵具有特征值分解？所有矩阵？没有矩阵？什么？对称矩阵。是的，是的。如果有人问你，非对称矩阵也有特征值的概念，你应该避开它们。","start":3789.64,"end":3821.67},{"id":390,"text":"They're weird. Anyway, for our point of view, everything's symmetric, so it doesn't matter. So A is a symmetric and square matrix. Then there exists these two characters who have the following properties. Lambda U transpose equals A. So decomposition. These characters are orthonormal. That is, they equal I. And they're unit normalized. And lambda is a diagonal.","zh":"它们很奇怪。不管怎样，从我们的角度来看，所有东西都是对称的，所以没关系。A是一个对称且方阵。那么存在这两个具有以下性质的特征。Lambda U的转置等于A。这就是分解。这些特征是正交归一化的。也就是说，它们等于单位矩阵I。它们是单位归一化的。而lambda是一个对角矩阵。","start":3821.98,"end":3851.83},{"id":391,"text":"Those lambdas, the lambda i's, little lambda i's that are on the diagonal are the eigenvalues. And by convention, we order them in this way. So you'll typically sort them, principal eigenvalue down to the rest. If you recall, every eigenvalue is associated with an eigenvector. That eigenvector is the ui, is the eigenvector associated with lambda i. And this is just showing you that if you multiply a times ui,","zh":"这些lambda，即对角线上的lambda_i，是特征值。按照惯例，我们以这种方式排序。你通常会将它们排序，从主特征值到其余特征值。如果你记得，每个特征值都与一个特征向量相关联。这个特征向量是u_i，是与lambda_i相关的特征向量。这仅仅是在告诉你，如果你将A乘以u_i，","start":3856.89,"end":3884.3},{"id":392,"text":"So you have A times Ui. This character is going to be exactly Ei, which is the standard basis, times lambda, which is then going to give you a lambda i because that's the only term that survived. Boom, boom, boom. All done. And then you get back lambda of Ui. So it just says A times Ui equals lambda of Ui. This is the traditional eigenvalue equation, the pencil equation.","zh":"所以你有A乘以U_i。这个特征将等于E_i，即标准基，乘以lambda，这将给你一个lambda_i，因为这是唯一保留下来的项。砰，砰，砰。完成。然后你得到lambda乘以U_i。因此，它只是说A乘以U_i等于lambda乘以U_i。这是传统的特征值方程，即笔方程。","start":3885.05,"end":3914.19}],"notes":["本段讲解了主成分分析（PCA）中寻找数据主要方向的过程，强调了数据中异常大的标量值可能对方向产生显著影响，因此需要提前进行归一化处理。同时，指出该过程与协方差矩阵的结构相似。","讲者提到特征值分解（eigenvalue decomposition）的概念，指出对称矩阵具有特征值和特征向量的分解形式，并强调对称性在PCA中的重要性。","讲者进一步解释了特征值和特征向量的定义，指出特征值是矩阵对角线上的元素，特征向量是与之对应的正交向量，并说明了特征值的排序方式。","讲者通过矩阵与特征向量相乘的示例，展示了特征值方程的成立，即矩阵乘以特征向量等于特征值乘以该特征向量，这是特征值问题的核心定义。"],"formulas":[],"uncertainties":["The phrase 'these two characters' may refer to eigenvalues and eigenvectors, but the exact meaning is ambiguous."],"diagram":"none","start":3758.49,"end":3914.19,"asr_flags":[],"math_clarifications":["在原始文本中提到的特征值被错误地表示为 θ_i，应更正为 λ_i。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":5,"raw_segments":[{"start":3758.49,"text":"I try and find the direction that hits as many of the Xi's as possible in my data. That's why if some of the Xi's had really big scalar values, they would contribute quite a bit to this, like that feet example where all of a sudden they're all multiplied by approximately 5,000. That would make them skew a lot in that direction. That's why we have to compensate earlier by normalization. This term also looks a heck of a lot like a covariance matrix."},{"start":3789.64,"text":"And we'll build that up in a second. You can also minimize a residual. So let's look at some linear algebra to solve this character in general. Clear enough? Right. Now, by show of hands, who remembers eigenvalue decompositions? Which matrices have them? All matrices? No matrices? What? Symmetric. Yeah, yeah. If someone asks you, there are notions of eigenvalues for non-symmetric matrices, you should run from them."},{"start":3821.98,"text":"They're weird. Anyway, for our point of view, everything's symmetric, so it doesn't matter. So A is a symmetric and square matrix. Then there exists these two characters who have the following properties. Lambda U transpose equals A. So decomposition. These characters are orthonormal. That is, they equal I. And they're unit normalized. And lambda is a diagonal."},{"start":3856.89,"text":"Those lambdas, the lambda i's, little lambda i's that are on the diagonal are the eigenvalues. And by convention, we order them in this way. So you'll typically sort them, principal eigenvalue down to the rest. If you recall, every eigenvalue is associated with an eigenvector. That eigenvector is the ui, is the eigenvector associated with lambda i. And this is just showing you that if you multiply a times ui,"},{"start":3885.05,"text":"So you have A times Ui. This character is going to be exactly Ei, which is the standard basis, times lambda, which is then going to give you a lambda i because that's the only term that survived. Boom, boom, boom. All done. And then you get back lambda of Ui. So it just says A times Ui equals lambda of Ui. This is the traditional eigenvalue equation, the pencil equation. All right. So again, evoking pictures you've seen earlier in this course, phenomenal plot lib pictures."}],"speech_gaps":[],"frame":"../frames/v048/023.webp","frame_time":3770.49},{"title":"主成分分析中的预处理与缺失数据处理","segments":[{"id":393,"text":"If you have all the eigenvalues, one, you get something that kind of looks unit circle-like, the stretch. This is the level sets of the linear function. And you get these nice ellipses if you make them tilted in some way. OK? Please. Two questions. One, are we doing a z-scoring for each one of the values? And two, what do we do with missing data?","zh":"如果你拥有所有的特征值，那么你会得到一个看起来类似单位圆的拉伸效果。这是线性函数的等高线。如果你以某种方式倾斜这些等高线，你会得到这些优美的椭圆。明白吗？请提问。第一个问题是，我们是否会对每个值进行z-score标准化？第二个问题是，我们如何处理缺失数据？","start":3915.44,"end":3944.19},{"id":394,"text":"Yeah, wonderful question. So the question is, are we going to do a z-scoring here? You don't need to. It's a nice pre-processing technique. Here, what we're doing to make everything go through are basically two pieces, which is we're sliding back to the origin so that we actually don't have that problem where there's something off in this direction. We just get the direction to the body rather than the component of variation. Think about this as, as I said, it's the variation distance. So that is quite important.","zh":"是的，这是一个非常好的问题。问题是，我们是否在这里进行z-score标准化？其实不需要。这是一种不错的预处理技术。在这里，我们所做的主要是将数据滑动回原点，这样就不会出现某个方向上存在偏移的问题。我们只关注方向，而不是变化的分量。可以将这视为变化距离。这一点非常重要。","start":3944.72,"end":3970.4},{"id":395,"text":"The second one that I highlighted is, if you have different scales, you typically will normalize them by taking the empirically variance in that direction and scaling them. So that one unit of variance in one direction means the same as another unit of variance in the other direction, roughly speaking. This is important in data and comes up quite a bit. It's actually technically not necessary. Neither of them are necessary. If you're asking, are there other pre-processing techniques that you could use to indeed get better or more confident answers from them? Absolutely. But these are the basics.","zh":"我强调的第二个问题是，如果你有不同的尺度，通常你会通过取该方向上的经验方差并进行缩放来对其进行标准化。这样，一个方向上的一个方差单位就大致等同于另一个方向上的一个方差单位。这一点在数据处理中非常重要，经常出现。实际上，这在技术上并不是必需的。两者都不是必需的。如果你问，是否有其他预处理技术可以用来获得更准确或更有信心的结果？当然有。但这些是基础。","start":3970.85,"end":4000.11},{"id":396,"text":"that you need that people seem to run into most of the time. And what was your second question? Sorry. Oh, missing data. Yeah, this doesn't do anything about missing data. If you have a data imputation problem, typically what people will do is estimate some data and then go back and compute it. That's one way to do with it. More egregiously, people will drop that data on the floor and then go on. But missing data is in general a hard problem, which unfortunately we don't talk too much about in this course, but is an important real-life problem. But this data we imagine is complete.","zh":"这是人们经常遇到的问题。你第二个问题是什么？抱歉。哦，是缺失数据。是的，这不会处理缺失数据。如果你有一个数据填补的问题，通常人们会估计一些数据，然后回去计算。这是处理的一种方式。更严重的是，人们会直接丢弃这些数据，然后继续进行。但缺失数据是一个普遍存在的难题，不幸的是我们在本课程中讨论得不多，但在现实生活中却非常重要。但我们可以想象这些数据是完整的。","start":4000.17,"end":4027.03},{"id":397,"text":"You mentioned that the bigger the residual, the less the variance. I feel it's kind of the opposite. Oh, no, no. So if you have a large residual, you have a large variance. Why is minimizing the residual the same as maximizing the variance? Maximizing the amount that was explained.","zh":"你提到残差越大，方差越小。我觉得这似乎相反。哦，不，不。如果你有较大的残差，那么你就有较大的方差。为什么最小化残差等同于最大化方差？最大化被解释的部分。","start":4028.36,"end":4043.12},{"id":398,"text":"So remember, when we did the maximization, maybe I said something that was confusing, so I want to make sure this is clear. When we go back to this min versus max, we went to this one. What we were maximizing is the explanation of this. How much did you actually take as it was going, which in some ways is one piece, versus minimizing the residual on top of both of them. And so we were maximizing the amount of data that's in the projected subspace in the first piece.","zh":"所以请记住，当我们进行最大化时，也许我说了一些令人困惑的话，所以我希望确保这一点是清晰的。当我们回到最小化与最大化之间的对比时，我们选择了这个。我们正在最大化的是对这个的解释。你实际上在过程中所取的部分，从某种意义上说是一个部分，与在这两者之上最小化残差相对比。因此，我们在第一部分中最大化了投影子空间中数据的量。","start":4044.24,"end":4071.72}],"notes":["本段讨论了主成分分析（PCA）中的预处理步骤，包括是否进行z-score标准化和如何处理不同尺度的数据。讲者指出，虽然z-score标准化和尺度归一化是常见的预处理方法，但它们并非严格必要，而是为了使不同方向上的方差具有可比性。","讲者提到，当数据存在缺失值时，通常的处理方法包括数据插补和直接删除缺失值。但讲者强调，缺失数据是一个复杂的问题，课程中并未深入讨论，但在实际应用中非常重要。","在讨论残差与方差的关系时，讲者澄清了残差越大意味着方差越大，而最小化残差等价于最大化方差，因为这是对数据解释量的优化。","讲者进一步解释了在主成分分析中，最大化解释量与最小化残差之间的关系，强调了在投影子空间中保留尽可能多的数据信息的重要性。"],"formulas":[{"latex":"Var(X) = E[(X - \\bar{X})^2]","symbols":"方差是数据与均值差的平方的期望","explanation":"公式正确，方差定义为数据点与均值差的平方的期望，符合数学定义。","evidence":"The second one that I highlighted is, if you have different scales, you typically will normalize them by taking the empirically variance in that direction and scaling them. So that one unit of variance in one direction means the same as another unit of variance in the other direction, roughly speaking. This is important in data and comes up quite a bit. It's actually technically not necessary. Neither of them are necessary. If you're asking, are there other pre-processing techniques that you could use to indeed get better or more confident answers from them? Absolutely. But these are the basics."},{"latex":"Residual = Y - \\text{Predicted } Y","symbols":"残差是实际值与预测值之间的差","explanation":"公式正确，残差定义为实际观测值与预测值之间的差，符合统计学定义。","evidence":"You mentioned that the bigger the residual, the less the variance. I feel it's kind of the opposite. Oh, no, no. So if you have a large residual, you have a large variance. Why is minimizing the residual the same as maximizing the variance? Maximizing the amount that was explained."}],"uncertainties":["the bigger the residual, the less the variance"],"diagram":"none","start":3915.44,"end":4071.72,"asr_flags":[],"math_clarifications":["公式2中的等号关系不成立，最大化解释方差与最小化残差是相关但不等价的概念，不能直接等同。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3915.44,"text":"If you have all the eigenvalues, one, you get something that kind of looks unit circle-like, the stretch. This is the level sets of the linear function. And you get these nice ellipses if you make them tilted in some way. OK? Please. Two questions. One, are we doing a z-scoring for each one of the values? And two, what do we do with missing data?"},{"start":3944.72,"text":"Yeah, wonderful question. So the question is, are we going to do a z-scoring here? You don't need to. It's a nice pre-processing technique. Here, what we're doing to make everything go through are basically two pieces, which is we're sliding back to the origin so that we actually don't have that problem where there's something off in this direction. We just get the direction to the body rather than the component of variation. Think about this as, as I said, it's the variation distance. So that is quite important."},{"start":3970.85,"text":"The second one that I highlighted is, if you have different scales, you typically will normalize them by taking the empirically variance in that direction and scaling them. So that one unit of variance in one direction means the same as another unit of variance in the other direction, roughly speaking. This is important in data and comes up quite a bit. It's actually technically not necessary. Neither of them are necessary. If you're asking, are there other pre-processing techniques that you could use to indeed get better or more confident answers from them? Absolutely. But these are the basics."},{"start":4000.17,"text":"that you need that people seem to run into most of the time. And what was your second question? Sorry. Oh, missing data. Yeah, this doesn't do anything about missing data. If you have a data imputation problem, typically what people will do is estimate some data and then go back and compute it. That's one way to do with it. More egregiously, people will drop that data on the floor and then go on. But missing data is in general a hard problem, which unfortunately we don't talk too much about in this course, but is an important real-life problem. But this data we imagine is complete."},{"start":4028.36,"text":"You mentioned that the bigger the residual, the less the variance. I feel it's kind of the opposite. Oh, no, no. So if you have a large residual, you have a large variance. Why is minimizing the residual the same as maximizing the variance? Maximizing the amount that was explained."},{"start":4044.24,"text":"So remember, when we did the maximization, maybe I said something that was confusing, so I want to make sure this is clear. When we go back to this min versus max, we went to this one. What we were maximizing is the explanation of this. How much did you actually take as it was going, which in some ways is one piece, versus minimizing the residual on top of both of them. And so we were maximizing the amount of data that's in the projected subspace in the first piece."}],"speech_gaps":[],"frame":"../frames/v048/024.webp","frame_time":3927.44},{"title":"主成分分析中的特征值分解","segments":[{"id":399,"text":"If I said something less cautious than that, then please let me know. OK. So let's go to eigenvalue compositions. So remember, we can take a vector x, and we can decompose it in this nice, beautiful way, which is a wonderful thing, by the way. It happens in linear space. It doesn't happen in a lot of spaces. But it's nice that it happens in the ones we care about. And as before, we can compute this x transpose x. This is what we want to do. So how are we going to do it?","zh":"如果我说得不够谨慎，那么请告诉我。好的，那么我们来谈谈特征值分解。请记住，我们可以将一个向量 x 分解成这种优美、漂亮的形式，这是一件非常好的事情。这种分解发生在线性空间中，而不是很多其他空间中。但好在它发生在我们关心的空间中。和之前一样，我们可以计算这个 x 转置 x。这就是我们想要做的事情。那么我们该如何进行呢？","start":4072.72,"end":4099.18},{"id":400,"text":"So we write x in this form. We multiply by a scalar. So because it's now in this nice basis form, it's in the scalar. The scalar changes the weight. We get back the x that's there. And boom, when we do the dot product of x into this, because x can be decomposed, we get this nice form. We get lambda j times the alpha j squares.","zh":"因此，我们将 x 写成这种形式。我们乘以一个标量。因为现在它处于这种优美的基底形式中，所以它变成了一个标量。这个标量会改变权重。我们得到的就是原本存在的 x。然后，当我们对 x 与这个向量做点积时，因为 x 可以被分解，我们得到了这种优美的形式。我们得到了 lambda j 乘以 alpha j 的平方。","start":4100.04,"end":4129.63},{"id":401,"text":"Okay, so just to make sure it's clear, all I've done here is I've taken X, I've plugged it in in two spots.","zh":"好的，为了确保清楚，我在这里所做的只是将 X 代入了两个位置。","start":4130.54,"end":4136.08},{"id":402,"text":"I use the fact that when I multiply U in either direction times U, I get out this nice equality to get the EIs and EJs.","zh":"我利用了当我在两个方向上乘以 U 时，会得到这种优美的等式，从而得到 EIs 和 EJs。","start":4137.82,"end":4145.1},{"id":403,"text":"I use the EI, EJ times a diagonal matrix is lambda J.","zh":"我利用了 EI、EJ 与对角矩阵相乘得到 lambda J。","start":4145.44,"end":4150.18},{"id":404,"text":"And indeed, I get out this nice, beautiful form here, okay?","zh":"确实，我得到了这种优美、漂亮的形式，对吧？","start":4150.92,"end":4153.58},{"id":405,"text":"Which has many more, many fewer free parameters than my original A's and all the rest, right?","zh":"这种形式比原来的 A 和其他所有参数具有更多或更少的自由参数，对吧？","start":4154.44,"end":4158.96},{"id":406,"text":"Just very few parameters in general.","zh":"总的来说，参数非常少。","start":4158.96,"end":4160.78},{"id":407,"text":"Cool. So why did I tell you all that?","zh":"好。那我之前告诉你们那些是为什么？","start":4161.7,"end":4166.88},{"id":408,"text":"So now we can write maximizing this function as a scalar over this.","zh":"现在我们可以将最大化这个函数表示为一个标量在这个表达式上。","start":4168.08,"end":4175.14},{"id":409,"text":"This is a much potentially easier expression because it's now","zh":"这是一个潜在更容易的表达式，因为它现在","start":4176.12,"end":4179.78},{"id":410,"text":"maximizing over all the Alpha that are unit norm over this square term.","zh":"是在所有单位范数的Alpha上最大化这个平方项。","start":4180.3,"end":4186.78},{"id":411,"text":"Okay, please.","zh":"好的，请继续。","start":4189.36,"end":4190.4},{"id":412,"text":"So that's basically what this is doing.","zh":"所以这就是它基本上在做的事情。","start":4206.56,"end":4208.52},{"id":413,"text":"So what's going on right now is we're showing how when we actually get the desiderata that we had,","zh":"现在的情况是，我们正在展示当实际上我们得到所需的条件时，","start":4208.72,"end":4214.34},{"id":414,"text":"had, which was to maximize the subspace or to minimize the residual, which we'll show","zh":"也就是要最大化子空间或最小化残差，我们将会展示","start":4214.34,"end":4217.6},{"id":415,"text":"later. Those things boil down to basically this eigenvalue decomposition, and we're making","zh":"稍后。这些内容基本上归结为这种特征值分解，我们确保这个过程真的清晰。","start":4217.6,"end":4222.44},{"id":416,"text":"sure that that process is really clear. There's practical things that you have to do to do","zh":"你必须做一些实际的事情来进行标准化，但在这里突出的是我们现在把这个过程简化为","start":4222.44,"end":4226.24},{"id":417,"text":"normalization, but what's popping out right here is now we reduce this to something that","zh":"某种东西，即这个XTX，所有解释方差的最大值实际上只是某种","start":4226.24,"end":4230.48},{"id":418,"text":"is this XTX, this maximum over all the explained variance is actually just something in terms","zh":"与特征值相关的东西","start":4230.48,"end":4237.76},{"id":419,"text":"of the eigen","zh":"的表达式","start":4237.76,"end":4238.1}],"notes":["本段讲解了主成分分析（PCA）中特征值分解的应用。讲者首先回顾了向量x的分解方式，即通过特征向量基底和对应的特征值进行表示。这种分解方式在特定的线性空间中有效，且能简化计算。讲者提到，通过这种分解，可以将向量x的点积转化为特征值和特征向量的组合形式，即lambda_j乘以alpha_j的平方。","接着，讲者强调了特征值分解在PCA中的重要性，即通过这种分解可以将原本复杂的参数空间简化为更少的参数。讲者指出，这种分解方式能够减少自由参数的数量，从而简化问题。","讲者进一步说明，通过特征值分解，可以将最大化方差的问题转化为对特征值的计算。这种转换使得问题更容易处理，因为只需要考虑特征值和对应的特征向量。","此外，讲者提到在实际应用中，需要进行归一化处理，以确保计算的准确性。但核心思想是通过特征值分解将问题简化为对特征值的计算。","最后，讲者指出，最大化方差的问题可以转化为对特征值的计算，这在PCA中是关键的一步。通过这种分解，可以找到能够解释最多方差的主成分。"],"formulas":[],"uncertainties":["EI, EJ 的具体含义未明确，可能是特征向量或特征值的缩写"],"diagram":"none","start":4072.72,"end":4238.1,"asr_flags":[],"math_clarifications":["原始片段中提到的特征值分解和相关公式缺乏必要的上下文信息，例如U和V的具体定义，以及lambda的排列方式，因此无法确定其正确性。","x^T x 是向量的模长平方，而lambda_j alpha_j^2 是特征值与特征向量系数的乘积，两者在数学上并不相等。正确的表达式应为 x^T x = sum_{j} lambda_j alpha_j^2。","x^T x 是向量的模长平方，而max lambda_j 是特征值的最大值，两者在数学上并不相等。正确的表达式应为 x^T x = sum_{j} lambda_j alpha_j^2，其中lambda_j是特征值，alpha_j是特征向量的系数。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":4072.72,"text":"If I said something less cautious than that, then please let me know. OK. So let's go to eigenvalue compositions. So remember, we can take a vector x, and we can decompose it in this nice, beautiful way, which is a wonderful thing, by the way. It happens in linear space. It doesn't happen in a lot of spaces. But it's nice that it happens in the ones we care about. And as before, we can compute this x transpose x. This is what we want to do. So how are we going to do it?"},{"start":4100.04,"text":"So we write x in this form. We multiply by a scalar. So because it's now in this nice basis form, it's in the scalar. The scalar changes the weight. We get back the x that's there. And boom, when we do the dot product of x into this, because x can be decomposed, we get this nice form. We get lambda j times the alpha j squares."},{"start":4130.54,"text":"Okay, so just to make sure it's clear, all I've done here is I've taken X, I've plugged it in in two spots."},{"start":4137.82,"text":"I use the fact that when I multiply U in either direction times U, I get out this nice equality to get the EIs and EJs."},{"start":4145.44,"text":"I use the EI, EJ times a diagonal matrix is lambda J."},{"start":4150.92,"text":"And indeed, I get out this nice, beautiful form here, okay?"},{"start":4154.44,"text":"Which has many more, many fewer free parameters than my original A's and all the rest, right?"},{"start":4158.96,"text":"Just very few parameters in general."},{"start":4161.7,"text":"Cool. So why did I tell you all that?"},{"start":4168.08,"text":"So now we can write maximizing this function as a scalar over this."},{"start":4176.12,"text":"This is a much potentially easier expression because it's now"},{"start":4180.3,"text":"maximizing over all the Alpha that are unit norm over this square term."},{"start":4189.36,"text":"Okay, please."},{"start":4206.56,"text":"So that's basically what this is doing."},{"start":4208.72,"text":"So what's going on right now is we're showing how when we actually get the desiderata that we had,"},{"start":4214.34,"text":"had, which was to maximize the subspace or to minimize the residual, which we'll show"},{"start":4217.6,"text":"later. Those things boil down to basically this eigenvalue decomposition, and we're making"},{"start":4222.44,"text":"sure that that process is really clear. There's practical things that you have to do to do"},{"start":4226.24,"text":"normalization, but what's popping out right here is now we reduce this to something that"},{"start":4230.48,"text":"is this XTX, this maximum over all the explained variance is actually just something in terms"},{"start":4237.76,"text":"of the eigen"}],"speech_gaps":[{"start":4192.4,"end":4196.976}],"frame":"../frames/v048/025.webp","frame_time":4084.72},{"title":"主成分分析（PCA）与特征值分解","segments":[{"id":420,"text":"So now we have a quantity in terms of the eigenvalues, so we can understand exactly what's going to happen, where the principal component is going to be in this case, and then by proxy in many other cases. We're proving that your intuition about we should do a decomposition on the eigenvalue of the covariance matrix is actually kind of what PCA is doing. Those are the principal components of variation, and they're the eigenvectors of the underlying matrix after you do this transformation. Yeah, that's the content.","start":4238.26,"end":4267.76},{"id":421,"text":"You got it right. Perfect. Awesome. So which x attains the maximum here? Someone tell me? In this language. So among all these alphas, which one do I pick over here to maximize this quantity? Lambda 1 to lambda 2 are in decreasing order. You put all the mass on 1, right? You pick an eigenvalue. Now, what if lambda 1 equals lambda 2? The first one was? Take u1. It works.","start":4268.85,"end":4306.81},{"id":422,"text":"What happens if lambda1 equals lambda2? Well, that answer still works, but so do many others. In the first case, if they are strictly separated, if lambda1 is 1 and lambda2 is 0.5, then if you don't put all your math on U1, you lose. You don't actually solve the max. If lambda1 and lambda2 equal each other, then picking any vector in that subspace, any combination of U1 and U2 is also a maximizer, correct?","start":4307.66,"end":4334.02},{"id":423,"text":"Because they both have the same lambda1 and lambda2, so I can move around all over the place. Why is that weird for PCA? If I want the principal component of variation and lambda1 and lambda2 are equal to each other, there isn't a single direction. There's an entire subspace. And worse, what happens on my data is if lambda1 and lambda2 are close together, I can get a potential instability. Is it clear why?","start":4334.62,"end":4365.09},{"id":424,"text":"Because as they get together, I'm maximizing, I'm getting something where the separation between those eigenvalues is implicitly what I'm looking at in my data. If the third eigenvalue is much longer than the fourth eigenvalue, then it's possible that's a good separation. I can reliably identify the top three. But if they're close together, the top three eigenvalues are all close together, the coordinates that I get back don't make sense.","start":4366.05,"end":4388.97}],"notes":["本段讲解了主成分分析（PCA）中特征值分解的核心思想，即通过特征值的大小来确定数据的主要变化方向。在特征值严格递减的情况下，最大特征值对应的特征向量即为第一主成分。当两个特征值相等时，任何该子空间内的向量都可以作为主成分，这导致了方向的不确定性。","当特征值非常接近时，PCA可能会出现不稳定性，因为特征值之间的分离度较小，难以准确识别主要成分。这种情况下，得到的坐标可能无法反映数据的真实结构，从而影响分析结果。","在特征值分解中，特征值的大小反映了数据在对应方向上的方差大小。较大的特征值对应的方向包含更多的数据变异信息，因此在PCA中优先选择这些方向。","当特征值相等时，PCA无法确定唯一的主成分方向，而是选择该子空间内的任意向量。这种情况下，数据的主成分方向可能不唯一，需要进一步的分析或约束条件来确定。","特征值的分离度对PCA的稳定性至关重要。如果特征值之间的差异较大，PCA可以可靠地识别主要成分；但如果特征值接近，PCA可能会出现不稳定，导致分析结果不可靠。","在实际应用中，PCA通常选择特征值最大的前几个方向作为主成分，以减少数据的维度并保留主要信息。然而，当特征值接近时，需要谨慎处理，以避免因方向不确定性导致的分析偏差。"],"formulas":[{"latex":"\\text{argmax}_{x} \\frac{x^T \\text{Cov}(X) x}{x^T x}","symbols":"x: 数据向量, Cov(X): 协方差矩阵","explanation":"该公式正确表达了在单位向量约束下最大化方差的表达式，符合PCA的数学定义。","evidence":"You got it right. Perfect. Awesome. So which x attains the maximum here? Someone tell me? In this language. So among all these alphas, which one do I pick over here to maximize this quantity? Lambda 1 to lambda 2 are in decreasing order. You put all the mass on 1, right? You pick an eigenvalue. Now, what if lambda 1 equals lambda 2? The first one was? Take u1. It works. What happens if lambda1 equals lambda2? Well, that answer still works, but so do many others. In the first case, if they are strictly separated, if lambda1 is 1 and lambda2 is 0.5, then if you don't put all your math on U1, you lose. You don't actually solve the max. If lambda1 and lambda2 equal each other, then picking any vector in that subspace, any combination of U1 and U2 is also a maximizer, correct? Because they both have the same lambda1 and lambda2, so I can move around all over the place. Why is that weird for PCA? If I want the principal component of variation and lambda1 and lambda2 are equal to each other, there isn't a single direction. There's an entire subspace. And worse, what happens on my data is if lambda1 and lambda2 are close together, I can get a potential instability. Is it clear why? Because as they get together, I'm maximizing, I'm getting something where the separation between those eigenvalues is implicitly what I'm looking at in my data. If the third eigenvalue is much longer than the fourth eigenvalue, then it's possible that's a good separation. I can reliably identify the top three. But if they're close together, the top three eigenvalues are all close together, the coordinates that I get back don't make sense."}],"uncertainties":[],"diagram":"none","start":4238.26,"end":4388.97,"asr_flags":[],"math_clarifications":["公式0和公式2缺少归一化项，未明确单位向量约束，不符合PCA的标准数学表达。公式1正确表达了在单位向量约束下最大化方差的表达式，符合PCA的数学定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4238.26,"text":"So now we have a quantity in terms of the eigenvalues, so we can understand exactly what's going to happen, where the principal component is going to be in this case, and then by proxy in many other cases. We're proving that your intuition about we should do a decomposition on the eigenvalue of the covariance matrix is actually kind of what PCA is doing. Those are the principal components of variation, and they're the eigenvectors of the underlying matrix after you do this transformation. Yeah, that's the content."},{"start":4268.85,"text":"You got it right. Perfect. Awesome. So which x attains the maximum here? Someone tell me? In this language. So among all these alphas, which one do I pick over here to maximize this quantity? Lambda 1 to lambda 2 are in decreasing order. You put all the mass on 1, right? You pick an eigenvalue. Now, what if lambda 1 equals lambda 2? The first one was? Take u1. It works."},{"start":4307.66,"text":"What happens if lambda1 equals lambda2? Well, that answer still works, but so do many others. In the first case, if they are strictly separated, if lambda1 is 1 and lambda2 is 0.5, then if you don't put all your math on U1, you lose. You don't actually solve the max. If lambda1 and lambda2 equal each other, then picking any vector in that subspace, any combination of U1 and U2 is also a maximizer, correct?"},{"start":4334.62,"text":"Because they both have the same lambda1 and lambda2, so I can move around all over the place. Why is that weird for PCA? If I want the principal component of variation and lambda1 and lambda2 are equal to each other, there isn't a single direction. There's an entire subspace. And worse, what happens on my data is if lambda1 and lambda2 are close together, I can get a potential instability. Is it clear why?"},{"start":4366.05,"text":"Because as they get together, I'm maximizing, I'm getting something where the separation between those eigenvalues is implicitly what I'm looking at in my data. If the third eigenvalue is much longer than the fourth eigenvalue, then it's possible that's a good separation. I can reliably identify the top three. But if they're close together, the top three eigenvalues are all close together, the coordinates that I get back don't make sense."}],"speech_gaps":[],"frame":"../frames/v048/026.webp","frame_time":4250.26},{"title":"主成分分析（PCA）的数学基础与潜在问题","segments":[{"id":425,"text":"Does that make sense? I will have mass, for example, on the first three coordinates, u1, u2, u3, conceptually. They're not the basis coordinates, but in the u coordinates. And then the rest may be 0, that I can say. But their actual values, if I were to feed them into your machine learning algorithm, and you had some linear classifier, there's no reason run after run they would get the same information. So if you had a weight on one feature versus another feature, you would have a problem. Does that make sense? All right.","start":4390.26,"end":4420.75},{"id":426,"text":"Okay, so this slide basically shows, as we go through maximizing this original quantity that we cared about, those were just facts about eigenvalues, that we can expand this character. And this thing here, after pushing all the values, is the covariance data because we subtracted off the mean. So back when we talked about it as motivating all these bad things would happen.","start":4422.45,"end":4446.74},{"id":427,"text":"If we want to interpret this matrix as a covariance matrix, we have to subtract off the mean because otherwise these guys need to be x minus mu, right? There is a mu. Hence, it reared its head. It's 0 because we whitened by it. Does that make sense? So we are estimating the covariance when we do the PCA. That's all that's happening. And the first eigenvalue of the data covariance matrix is the principal component.","start":4447.27,"end":4471.89},{"id":428,"text":"Now, I hope by giving you this detour through what the underlying math is, you can see some of the ways that it goes wrong now. It goes wrong if you don't whiten it, potentially you won't get a principal component. It goes wrong if the scales are different in some way, and if your underlying data doesn't have an eigenvalue spectrum that is separated, you're toast.","start":4473.46,"end":4492.42},{"id":429,"text":"So again, this is the way people use it. And so this is one of the things, as you mentioned, people will often do this dimensionality reduction. It really only makes sense if you have all those vectors to be distinct and separated. Otherwise, when you run it again and again, you're just picking potentially something in the subspace.","start":4499.2,"end":4517.08},{"id":430,"text":"That can be quite problematic on your data. You send out your data, you do PCA on it, you learn some model, you come in with new data, you do PCA. Because of the fact that they're not separated, you get different answers, different coordinates. Your machine learning model may not work on top of that if you use it. Using it for dimensionality reduction, I'm not a super fan of. You have to be careful about that if you do it. Multiple dimensions, I won't go through. It's the same argument with matrices instead of vectors.","start":4518.15,"end":4544.81},{"id":431,"text":"And one thing that I did want to say, which usually comes up is you can actually measure","start":4546.48,"end":4551.16},{"id":432,"text":"these sums. How can you measure this sum? If I told you to compute this sum of a matrix","start":4551.68,"end":4558.66},{"id":433,"text":"and I give you the matrix, it's some wild, nasty matrix. How could you compute this character","start":4558.66,"end":4562.84},{"id":434,"text":"efficiently? Anyone remember the trace? I just sum the diagonal elements. So this one, I can","start":4562.84,"end":4569.42}],"notes":["本段讲解了主成分分析（PCA）中协方差矩阵的计算和解释。教授指出，为了将矩阵解释为协方差矩阵，必须减去均值，否则矩阵中的元素应为x减去均值。这一步骤是PCA的核心，因为协方差矩阵的特征值对应于主成分，而特征向量对应于主成分的方向。","教授进一步说明了PCA的潜在问题，包括如果不进行白化（whitening）可能导致无法获得真正的主成分，以及当数据的尺度不同或特征值谱未分离时，PCA可能失效。这表明PCA的正确应用需要满足一定的前提条件。","教授还提到，PCA在实际应用中可能存在问题，例如当数据未被正确分离时，重复运行PCA可能会得到不同的结果，从而影响后续的机器学习模型性能。因此，使用PCA进行降维时需要谨慎。","最后，教授提到如何高效计算矩阵的迹（trace），即对角线元素之和。这为后续的数学计算提供了基础，说明了如何通过简单的操作来计算复杂的矩阵特征。","教授强调了PCA的数学基础，包括协方差矩阵、特征值和特征向量的概念，以及它们在降维中的作用。这些概念是理解PCA如何工作的关键。","教授还指出，PCA的正确应用需要确保数据的特征值谱是分离的，否则降维结果可能不稳定，影响后续模型的性能。这表明PCA的使用需要结合具体的数据特征进行判断。"],"formulas":[{"latex":"E[\\boldsymbol{v}^T \\boldsymbol{v}] = \\text{trace}(\\boldsymbol{v} \\boldsymbol{v}^T)","symbols":"向量的迹计算","explanation":"公式正确，表示向量v的平方和等于其外积矩阵的迹。","evidence":"and I give you the matrix, it's some wild, nasty matrix. How could you compute this character"}],"uncertainties":["character"],"diagram":"none","start":4390.26,"end":4569.42,"asr_flags":[],"math_clarifications":["公式0和公式1存在数学定义错误，需要移除。公式0错误地将协方差矩阵定义为标量x的函数，而应为向量x的函数。公式1错误地将协方差矩阵与方差直接关联，而协方差矩阵是方差和协方差的扩展。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4390.26,"text":"Does that make sense? I will have mass, for example, on the first three coordinates, u1, u2, u3, conceptually. They're not the basis coordinates, but in the u coordinates. And then the rest may be 0, that I can say. But their actual values, if I were to feed them into your machine learning algorithm, and you had some linear classifier, there's no reason run after run they would get the same information. So if you had a weight on one feature versus another feature, you would have a problem. Does that make sense? All right."},{"start":4422.45,"text":"Okay, so this slide basically shows, as we go through maximizing this original quantity that we cared about, those were just facts about eigenvalues, that we can expand this character. And this thing here, after pushing all the values, is the covariance data because we subtracted off the mean. So back when we talked about it as motivating all these bad things would happen."},{"start":4447.27,"text":"If we want to interpret this matrix as a covariance matrix, we have to subtract off the mean because otherwise these guys need to be x minus mu, right? There is a mu. Hence, it reared its head. It's 0 because we whitened by it. Does that make sense? So we are estimating the covariance when we do the PCA. That's all that's happening. And the first eigenvalue of the data covariance matrix is the principal component."},{"start":4473.46,"text":"Now, I hope by giving you this detour through what the underlying math is, you can see some of the ways that it goes wrong now. It goes wrong if you don't whiten it, potentially you won't get a principal component. It goes wrong if the scales are different in some way, and if your underlying data doesn't have an eigenvalue spectrum that is separated, you're toast."},{"start":4499.2,"text":"So again, this is the way people use it. And so this is one of the things, as you mentioned, people will often do this dimensionality reduction. It really only makes sense if you have all those vectors to be distinct and separated. Otherwise, when you run it again and again, you're just picking potentially something in the subspace."},{"start":4518.15,"text":"That can be quite problematic on your data. You send out your data, you do PCA on it, you learn some model, you come in with new data, you do PCA. Because of the fact that they're not separated, you get different answers, different coordinates. Your machine learning model may not work on top of that if you use it. Using it for dimensionality reduction, I'm not a super fan of. You have to be careful about that if you do it. Multiple dimensions, I won't go through. It's the same argument with matrices instead of vectors."},{"start":4546.48,"text":"And one thing that I did want to say, which usually comes up is you can actually measure"},{"start":4551.68,"text":"these sums. How can you measure this sum? If I told you to compute this sum of a matrix"},{"start":4558.66,"text":"and I give you the matrix, it's some wild, nasty matrix. How could you compute this character"},{"start":4562.84,"text":"efficiently? Anyone remember the trace? I just sum the diagonal elements. So this one, I can"}],"speech_gaps":[],"frame":"../frames/v048/027.webp","frame_time":4402.26},{"title":"主成分分析（PCA）与降维动机","segments":[{"id":435,"text":"compute quite a bit. And this, I can also estimate once I have the directions that I've actually","start":4569.42,"end":4574.42},{"id":436,"text":"compute it. So in particular, I can compute this without having to compute all n squared things.","start":4574.42,"end":4578.86},{"id":437,"text":"If my k that I pick is like 3, I can look and find those three directions. I can compute their eigen","start":4579.0,"end":4584.74},{"id":438,"text":"values because I now have their orthogonalization. I multiply them by the matrix. They will be of the","start":4584.74,"end":4589.2},{"id":439,"text":"form lambda times ui. So I can get all those values. So I can get lambda 1 lambda 2. And this","start":4589.2,"end":4598.7},{"id":440,"text":"Just to understand, why do you want to reduce dimensions again?","start":4598.7,"end":4601.32},{"id":441,"text":"Like why don't you want to keep all these different...","start":4601.52,"end":4604.8},{"id":442,"text":"Oh, great question. So part of what goes on when you have high dimensions is if you have many high","start":4604.8,"end":4609.22},{"id":443,"text":"dimensions that are... So there's a couple of situations where you want to do dimensionality","start":4609.22,"end":4612.64},{"id":444,"text":"reduction. One, as we talked about, is you're analyzing your data and you just have a sea of","start":4612.64,"end":4617.06},{"id":445,"text":"numbers about various things that look the same. The high city versus highway miles per gallon was","start":4617.06,"end":4623.32},{"id":446,"text":"an example of like, I'm not sure I really care about that. I just want a car that gives me good","start":4623.32,"end":4627.28},{"id":447,"text":"miles per gallon or something then you're that's a data reduction thing where you want to take many","start":4627.28,"end":4631.78},{"id":448,"text":"variables and that was a simple example but in general you may say look underneath my data","start":4631.78,"end":4636.22},{"id":449,"text":"there are really only three things i care about three directions or three kind of pseudo features","start":4636.22,"end":4640.52},{"id":450,"text":"that explain almost all of my data if that's the case then your data instead of living in a wild","start":4640.52,"end":4644.84},{"id":451,"text":"n-dimensional space or d-dimensional space that's there right it has all these vectors it actually","start":4644.84,"end":4649.66},{"id":452,"text":"only lives in this subspace then you can make stronger inferences about it and so when we do","start":4649.66,"end":4654.2},{"id":453,"text":"dimensionality reduction there's a lot of both theory and practice that says","start":4654.2,"end":4656.96},{"id":454,"text":"when your data lives in this huge high dimensional space but actually has a","start":4657.56,"end":4660.56},{"id":455,"text":"subspace on it, finding that smaller subspace allows you to exploit it.","start":4660.94,"end":4664.96},{"id":456,"text":"We've used this, this is kind of the capstone to a bunch of stuff that we've done over the last week or two, where we've said there exists some structure. And what I was trying to point out here is, here we're making kind of, although everyone uses PCA, it's really making an assumption that the subspaces are well separated in your covariance. That is mathematically what it's doing. So that may not seem particularly strange to you, like, oh, I just compute the variance and throw stuff away. But that's when it makes sense. In contrast, the stuff we were doing with EM was, oh, we assume that there's some latent structure that's there, these sources.","start":4665.39,"end":4693.79},{"id":457,"text":"the shape of gaussians and we don't know the exact parameters but there's still assumptions. So those assumptions are the quite important thing to me. But why we reduce dimensionality is because we think that that makes things more predictable and so a lot of classical machine learning is about doing, you know, from the wild sea of measurements finding the most important. Yeah, exactly right. So what I'm showing here is as you increase","start":4694.54,"end":4723.04}],"notes":["本段主要讲解主成分分析（PCA）的基本原理，即通过找到数据的主要方向（特征向量）来降低维度。讲者提到，当选择k个方向时，可以通过计算这些方向的特征值来确定其重要性。PCA的核心思想是通过正交化处理，将数据投影到低维子空间，从而保留数据的主要信息。"],"formulas":[{"latex":"A u_i = \\lambda u_i","symbols":"A 是协方差矩阵，u_i 是特征向量，lambda 是对应的特征值","explanation":"公式正确，描述了特征值分解的基本形式，其中A是协方差矩阵，u_i是特征向量，lambda是对应的特征值。","evidence":"values because I now have their orthogonalization. I multiply them by the matrix. They will be of the form lambda times ui. So I can get all those values. So I can get lambda 1 lambda 2. And this"}],"uncertainties":["lambda 1 lambda 2"],"diagram":"none","start":4569.42,"end":4723.04,"asr_flags":[],"math_clarifications":["公式A u_i = \\lambda u_i是正确的特征值分解形式，适用于协方差矩阵的特征向量和特征值计算。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4569.42,"text":"compute quite a bit. And this, I can also estimate once I have the directions that I've actually"},{"start":4574.42,"text":"compute it. So in particular, I can compute this without having to compute all n squared things."},{"start":4579.0,"text":"If my k that I pick is like 3, I can look and find those three directions. I can compute their eigen"},{"start":4584.74,"text":"values because I now have their orthogonalization. I multiply them by the matrix. They will be of the"},{"start":4589.2,"text":"form lambda times ui. So I can get all those values. So I can get lambda 1 lambda 2. And this"},{"start":4598.7,"text":"Just to understand, why do you want to reduce dimensions again?"},{"start":4601.52,"text":"Like why don't you want to  that the subspaces are well separated in your covariance. That is mathematically what it's doing. So that may not seem particularly strange to you, like, oh, I just compute the variance and throw stuff away. But that's when it makes sense. In contrast, the stuff we were doing with EM was, oh, we assume that there's some latent structure that's there, these sources."},{"start":4694.54,"text":"the shape of gaussians and we don't know the exact parameters but there's still assumptions. So those assumptions are the quite important thing to me. But why we reduce dimensionality is because we think that that makes things more predictable and so a lot of classical machine learning is about doing, you know, from the wild sea of measurements finding the most important. Yeah, exactly right. So what I'm showing here is as you increase"}],"speech_gaps":[],"frame":"../frames/v048/028.webp","frame_time":4581.42},{"title":"主成分分析与EM算法的总结","segments":[{"id":458,"text":"In these plots, as you increase the number of components, the amount of variance tails off. So one natural phenomenon that happens is you often only have a couple of components that really explain the entire dataset if you're doing anything that's sufficiently large and coarse-grained. And so you can manipulate only those five components and your conclusions depend on those and maybe not the rest of the dataset. So that data compression teaches you something about the structure of the problem. These are awesome questions. So","start":4723.54,"end":4752.91},{"id":459,"text":"I'm going to skip to the last slide. We were only one slide away. We only skipped one beautiful picture of denoising. Look how beautiful it is. You got everything from it. So we saw the famous EM algorithm. This is something I wanted to show you because you decompose these things in latent variables. It's the workhorse that people use all the time. It's kind of the fallback that people are going to use there. We saw PCA, which is a workhorse of dimensionality reduction. The substructure for PCA was subspaces. The substructure for EM were these latent variables.","start":4753.89,"end":4783.25},{"id":460,"text":"probabilistic model that we were able to solve. With that, I just want to say you folks have been phenomenal. This was a great quarter for me. I'm gone. This is my last class. And I thank you so much for all the sweet of you to say, but thank you so much for making this job so much fun. So please take some extra candy and have a great rest of your day. Thanks guys.","start":4784.17,"end":4799.03}],"notes":["本段讨论了主成分分析（PCA）中数据压缩的原理，指出随着主成分数量的增加，方差逐渐趋于稳定，因此通常只需要少数几个主成分就能解释大部分数据的结构。这种压缩不仅有助于简化问题，还能揭示数据的潜在结构。","接着，讲者跳过了最后一张幻灯片，提到一张关于去噪的美丽图像，并强调了EM算法的重要性。EM算法通过引入隐变量来分解复杂模型，是处理概率模型的常用方法，尤其在处理缺失数据或隐变量问题时非常有效。","讲者还对比了PCA和EM算法的子结构：PCA基于子空间，而EM基于隐变量。这说明了不同方法在处理数据降维和模型分解时的不同思路，也体现了两种方法在机器学习中的广泛应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4723.54,"end":4799.03,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4723.54,"text":"these plots, as you increase the number of components, the amount of variance tails off. So one natural phenomenon that happens is you often only have a couple of components that really explain the entire dataset if you're doing anything that's sufficiently large and coarse-grained. And so you can manipulate only those five components and your conclusions depend on those and maybe not the rest of the dataset. So that data compression teaches you something about the structure of the problem. These are awesome questions. So"},{"start":4753.89,"text":"I'm going to skip to the last slide. We were only one slide away. We only skipped one beautiful picture of denoising. Look how beautiful it is. You got everything from it. So we saw the famous EM algorithm. This is something I wanted to show you because you decompose these things in latent variables. It's the workhorse that people use all the time. It's kind of the fallback that people are going to use there. We saw PCA, which is a workhorse of dimensionality reduction. The substructure for PCA was subspaces. The substructure for EM were these latent variables."},{"start":4784.17,"text":"probabilistic model that we were able to solve. With that, I just want to say you folks have been phenomenal. This was a great quarter for me. I'm gone. This is my last class. And I thank you so much for all the sweet of you to say, but thank you so much for making this job so much fun. So please take some extra candy and have a great rest of your day. Thanks guys."}],"speech_gaps":[],"frame":"../frames/v048/029.webp","frame_time":4735.54}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>
