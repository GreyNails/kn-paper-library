ng:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】混合高斯模型（EM）与主成分分析 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v048","title":"【斯坦福CS229】混合高斯模型（EM）与主成分分析","course":"机器学习","pages":[{"title":"混合高斯模型（EM）与主成分分析","segments":[{"id":0,"text":"Welcome to Lecture 10, CS229. Happy Wednesday. It's really nice outside. I hope you're getting some time outside today. It's pretty nice. This is like the California you were promised. A little too cold for me, but I enjoy it. We're going to try copy-paste again today. I would like to say that before we started recording, I did show that it actually works. It's just a very disturbing delay. So we'll see how that goes. Today, we're going to continue in unsupervised learning. We're going to see the details of the EM algorithm. And then we're going to transition.","zh":"欢迎来到第10讲，CS229。星期三快乐。外面天气真不错。我希望你们今天能花点时间到户外去。天气相当不错。这就像你们承诺的加州一样。对我来说有点太冷了，但我还是喜欢。今天我们又要尝试复制粘贴。在开始录制之前，我想说的是我确实演示过它确实能工作。只是有一个非常令人不安的延迟。我们来看看会怎样。今天，我们将继续进行无监督学习。我们将看到EM算法的细节。然后我们将过渡。","start":5.1,"end":34.46},{"id":1,"text":"to its non-probabilistic analog, PCA. And PCA is a workhorse algorithm. I use it all the time. One of my graduate students sent me plots for PCA last night about something. And so it is a workhorse canonical algorithm that you should have in your toolkit. OK.","zh":"到它的非概率类比，PCA。PCA是一个常用算法。我经常使用它。我其中一个研究生昨晚给我发了一些关于PCA的图表。因此，这是一个你应该放在工具箱中的常用经典算法。好的。","start":34.7,"end":50.6},{"id":2,"text":"So we'll first discover this EM that discovers our ad hoc algorithm that we did before. This GMM algorithm, we're going to explain how this is a principled element of what we're doing. Then we're going to talk about this classic dimensionality reduction idea PCA. And that's going to be our entire lecture. All right. So last time, remember, just to motivate you and give you a little bit of time to look at the slide, I'm going to draw some pictures. And this is the picture we drew last time, roughly speaking. We were given","zh":"因此，我们将首先发现这个EM算法，它发现了我们之前做的那个自定义算法。这个GMM算法，我们将解释这是我们在做的事情的一个有原则的组成部分。然后我们将讨论这个经典的降维思想PCA。这就是我们整个课程的内容。好的。所以上次课，记得吗，只是为了激励你们并给你们一点时间看看幻灯片，我将画一些图。这就是我们上次大致画的图。我们被给予了一堆这些光子计数。记得这是我们在举起来的那块板子。","start":51.9,"end":80.12},{"id":3,"text":"a bunch of these photon counts. Remember this was some plate that we held up.","zh":"这些是单个光子。这些x是单个光子。我们试图弄清楚它们来自哪些光源。我们不知道光源。我们不知道每个光源有多少个点。我们也不知道它们的形状。记得我们之前讨论过，我们想要得到这些形状。对于GMM的想法是，我们基本上有一个潜在变量zi，它表示它对应哪个光源。","start":81.26,"end":85.62},{"id":4,"text":"And these were individual photons. These x's are individual photons. And we were trying to figure out what sources they came from. And we don't know the sources. We don't know how many points come from every source. And we don't know the shapes of them. Remember, we talked about before, we wanted to get these shapes. And the idea that we saw for GMM was we basically had this latent variable, zi, which was which source it would correspond to.","zh":"这些是单个的光子。这些x值是单个的光子。我们试图弄清楚它们来自哪些光源。但我们不知道光源。我们不知道每个光源对应多少个点。我们也不知道它们的形状。还记得之前我们讨论过的内容，我们想要获取这些形状。在GMM中我们看到的思路是，我们基本上有一个隐变量zi，它表示该点对应的是哪一个光源。","start":88.01,"end":113.41},{"id":5,"text":"And the difference between what we saw in k-means was that it was a soft assignment. So we would have a point, for example, here. Let's imagine that currently we think there are two sources in our algorithm. This point we may say is 50% in this source and 50% in this source, whereas this one we're fairly confident that this point belongs to call this source to. And that's what Zij is actually going to be. So that was the clustering strength. But it was a soft clustering. So we're going to look at that.","zh":"我们之前在k均值中看到的不同之处在于，它是一种软分配。例如，我们有一个点，假设目前我们认为算法中有两个来源。我们可能会说这个点有50%属于这个来源，50%属于另一个来源，而这个点我们则比较确定它属于某个来源。这就是Z_ij实际上所代表的内容。这就是聚类强度。但它是一种软聚类。因此，我们将要关注这一点。","start":114.14,"end":141.18},{"id":6,"text":"And then what we did is after we assigned all the points, and we said, okay, all these points are probabilistically assigned with their various weights, we then refit the parameters intuitively, the mu j's and the sigma's. So they would fit, for example, both their mean, and then some, I'm drawing a bad version of it here, but they would fit some ellipse. Why was it an ellipse? What the ellipse kind of look like? What does the ellipse represent when I draw it?","zh":"然后我们所做的就是，在分配完所有点之后，我们说，这些点以各种权重概率性地被分配了，接着我们直观地重新拟合参数，即μ_j和σ_j。例如，它们会拟合这两个均值，以及一些椭圆。为什么是椭圆？椭圆看起来是什么样的？当我画出椭圆时，它代表什么？","start":142.22,"end":165.62}],"notes":["本段介绍了课程的结构，包括今天将讲解的EM算法和主成分分析（PCA）。课程强调EM算法是无监督学习中的一种重要方法，而PCA是用于降维的经典算法，被广泛使用。","讲者提到EM算法是通过引入隐变量来处理数据的分布问题，与k-means算法相比，EM算法使用软分配（soft assignment）来表示数据点属于不同源的概率，而不是硬分配。","在讲解GMM时，讲者提到每个数据点都有一个隐变量zi，表示它属于哪个源。这种软聚类方法允许数据点同时属于多个源，权重由概率决定。","讲者还提到在完成隐变量的分配后，需要重新估计模型参数，如均值μj和协方差σj。这些参数的估计是通过最大化似然函数来完成的。","最后，讲者提到在绘制椭圆时，椭圆代表了数据点的分布形状，椭圆的形状和大小与协方差矩阵有关，反映了数据的方差和相关性。","讲者通过实际例子（如光子计数）来说明EM算法的应用，强调了隐变量在建模中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.1,"end":165.62,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":5.1,"text":"Welcome to Lecture 10, CS229. Happy Wednesday. It's really nice outside. I hope you're getting some time outside today. It's pretty nice. This is like the California you were promised. A little too cold for me, but I enjoy it. We're going to try copy-paste again today. I would like to say that before we started recording, I did show that it actually works. It's just a very disturbing delay. So we'll see how that goes. Today, we're going to continue in unsupervised learning. We're going to see the details of the EM algorithm. And then we're going to transition."},{"start":34.7,"text":"to its non-probabilistic analog, PCA. And PCA is a workhorse algorithm. I use it all the time. One of my graduate students sent me plots for PCA last night about something. And so it is a workhorse canonical algorithm that you should have in your toolkit. OK."},{"start":51.9,"text":"So we'll first discover this EM that discovers our ad hoc algorithm that we did before. This GMM algorithm, we're going to explain how this is a principled element of what we're doing. Then we're going to talk about this classic dimensionality reduction idea PCA. And that's going to be our entire lecture. All right. So last time, remember, just to motivate you and give you a little bit of time to look at the slide, I'm going to draw some pictures. And this is the picture we drew last time, roughly speaking. We were given"},{"start":81.26,"text":"a bunch of these photon counts. Remember this was some plate that we held up."},{"start":88.01,"text":"And these were individual photons. These x's are individual photons. And we were trying to figure out what sources they came from. And we don't know the sources. We don't know how many points come from every source. And we don't know the shapes of them. Remember, we talked about before, we wanted to get these shapes. And the idea that we saw for GMM was we basically had this latent variable, zi, which was which source it would correspond to."},{"start":114.14,"text":"And the difference between what we saw in k-means was that it was a soft assignment. So we would have a point, for example, here. Let's imagine that currently we think there are two sources in our algorithm. This point we may say is 50% in this source and 50% in this source, whereas this one we're fairly confident that this point belongs to call this source to. And that's what Zij is actually going to be. So that was the clustering strength. But it was a soft clustering. So we're going to look at that."},{"start":142.22,"text":"And then what we did is after we assigned all the points, and we said, okay, all these points are probabilistically assigned with their various weights, we then refit the parameters intuitively, the mu j's and the sigma's. So they would fit, for example, both their mean, and then some, I'm drawing a bad version of it here, but they would fit some ellipse. Why was it an ellipse? What the ellipse kind of look like? What does the ellipse represent when I draw it?"}],"speech_gaps":[],"frame":"../frames/v048/001.webp","frame_time":17.1},{"title":"混合高斯模型（EM）与主成分分析","segments":[{"id":7,"text":"Exactly. It's a multivariant Gaussian. And so those are its level sets. So those were all the equal probability, equal density things were on an ellipse. And the reason they're ellipse is those are the dimensions, if you like, of the covariance. Those are the eigenvectors of the covariance. Then we also refit this phi, which we'll get to in a second. This is just a review from last time, which has the proportion.","zh":"没错。这是一个多元高斯分布。这些就是它的等高线。因此，所有概率相等、密度相等的点都位于椭圆上。它们之所以是椭圆，是因为这些是协方差矩阵的维度，或者说，这些是协方差矩阵的特征向量。我们还会重新拟合这个phi，稍后我们会讲到。这只是对上次课内容的复习，其中包含了比例的概念。","start":174.91,"end":198.01},{"id":8,"text":"which was the estimated fraction that we had. And we had ad hoc estimates for that last time. If you don't remember them, please don't worry about it. We're going to re-derive them now. But this is a way we could derive them in general. Last time, we kind of squinted at it and said, hey, this was where the mean should be. This is where the variance should look like. This is what the fraction is. We do this kind of fractional count based on population statistics.","zh":"这是我们估计的分数比例。上次课中，我们采用了某种经验性的估计方法。如果你不记得它们，也请不要担心。我们现在将重新推导它们。但这也是一种在一般情况下推导它们的方法。上次课中，我们大致看了一眼，说，嘿，这个应该是均值所在的位置。这个应该是方差的样子。这个就是比例。我们基于总体统计信息进行这种比例计数。","start":199.08,"end":220.68},{"id":9,"text":"Today, we're going to derive that. And that derivation is going to be the example for this EM algorithm, which is a very general algorithm.","zh":"今天，我们将推导这个比例。这个推导过程将作为EM算法的一个例子，而EM算法是一个非常通用的算法。","start":221.38,"end":228.48},{"id":10,"text":"Then as we talked about, it was repetitive. So hopefully this is review for Monday. This looks exactly like k-means except for the difference from k-means was in k-means we had a hard assignment, here we have a soft assignment. In k-means, if you remember, we picked our new points. They said, hey, these are the points we think are in cluster 1 and cluster 2. We computed the means or their centers, then we iterated. Here instead of just picking their centers, which are the mus, we also pick some statistical parameters, their variances or their covariances, and we fit their proportions.","zh":"正如我们之前讨论的，这个过程是重复性的。因此，希望这对你周一的复习有帮助。这看起来和k均值算法几乎一样，唯一的不同之处在于，k均值中我们有硬分配，而这里我们有软分配。在k均值中，如果你还记得，我们选择新的点，说，嘿，这些是我们认为属于簇1和簇2的点。我们计算它们的均值或中心，然后进行迭代。在这里，我们不仅选择它们的中心（即mu），还选择一些统计参数，它们的方差或协方差，并拟合它们的比例。","start":229.64,"end":257.68},{"id":11,"text":"Otherwise, it's the same. We went from a hard assignment, soft assignment, and probabilistic. Cool. All right. We walked through last time Jensen's inequality, and we're going to use it for concave functions. So I'll only state it for concave functions. That's a terrible line. So this is x, and then we have a function here. Here's 0. We have something, you know, this kind of log x kind of looking function. Here's 1. So it looks like this.","zh":"否则，它是一样的。我们从硬分配、软分配，再到概率分配。很好。上次课我们讲解了Jensen不等式，我们将用它来处理凹函数。我只会对凹函数进行陈述。这是一条糟糕的线。这是x轴，然后我们有一个函数在这里。这里是0。我们有某种类似于log x的函数。这里是1。看起来像这样。","start":258.76,"end":285.6},{"id":12,"text":"This is log x. This is log x. And remember the picture here. When we want to look at g of z, so if we take any point g of z, we take two other points, a and b. So this a and this b. And we draw the line between them, which I'm going to highlight here. If I can do it. This green is this green here. That's the line. Lambda is the line between them.","zh":"这是log x。这是log x。请记住这里的图像。当我们想查看g of z时，即如果我们取任意一点g of z，我们取另外两个点a和b。所以这是a和这是b。然后我们画出它们之间的线，我在这里会高亮显示。如果我能做到的话。这条绿色的线就是这条绿色的线。这就是这条线。Lambda是它们之间的线。","start":286.47,"end":310.07},{"id":13,"text":"And then that is because it's a concave function below the line. That is the definition, if you like, of a concave function that no matter how we draw that chord, it's going to live below the line. We're going to use that estimate quite a bit. And the form that we're going to use that fact in that we saw looks mysterious because of the notation is right here.","zh":"然后这是因为它是位于直线下方的凹函数。换句话说，这就是凹函数的定义：无论我们如何画这条弦，它都会位于直线的下方。我们会频繁使用这个估计。我们会用到这个事实的形式，我们之前看到的看起来有些神秘，这是因为符号的使用，而它就在这里。","start":311.43,"end":328.59}],"notes":["本段讲解了Jensen不等式及其在凹函数中的应用。讲者提到，Jensen不等式用于凹函数时，函数图像始终位于连接任意两点的线段下方。这是凹函数的定义，也是后续推导中将使用的重要性质。","讲者通过图像说明了Jensen不等式的几何意义，即对于任意两点a和b，函数g(z)在连接a和b的线段下方。这种性质在后续的EM算法推导中将被频繁使用。","讲者提到，虽然Jensen不等式的表达式看起来复杂，但其核心思想是利用凹函数的性质来推导期望值的下界，这在EM算法中用于构建下界函数（ELBO）。","讲者强调，Jensen不等式的应用需要明确函数的凹凸性，以及如何选择点a和b来构造线段。这些细节将在后续的EM算法推导中进一步展开。","本段内容为EM算法的推导做铺垫，特别是通过Jensen不等式来构建下界函数，从而实现对参数的迭代优化。","讲者指出，Jensen不等式的应用需要结合具体的函数形式和参数选择，这将在后续的EM算法推导中具体体现。"],"formulas":[{"latex":"g(z) \\text{ 是凹函数} \\rightarrow g(\\text{凸组合 of } a \\text{ 和 } b) \\text{ 小于等于 凸组合 of } g(a) \\text{ 和 } g(b)","symbols":"凹函数的性质：函数值在任意两点的凸组合处小于等于函数值的凸组合","explanation":"保持原公式，修正了中文符号和表达，使其更符合数学表述习惯。","evidence":"This is log x. This is log x. And remember the picture here. When we want to look at g of z, so if we take any point g of z, we take two other points, a and b. So this a and this b. And we draw the line between them, which I'm going to highlight here. If I can do it. This green is this green here. That's the line. Lambda is the line between them. And then that is because it's a concave function below the line. That is the definition, if you like, of a concave function that no matter how we draw that chord, it's going to live below the line. We're going to use that estimate quite a bit. And the form that we're going to use that fact in that we saw looks mysterious because of the notation is right here."}],"uncertainties":[],"diagram":"none","start":174.91,"end":328.59,"asr_flags":[],"math_clarifications":["公式本身是正确的，描述了凹函数的定义，即函数值在任意两点的凸组合处小于等于函数值的凸组合。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":174.91,"text":"Exactly. It's a multivariant Gaussian. And so those are its level sets. So those were all the equal probability, equal density things were on an ellipse. And the reason they're ellipse is those are the dimensions, if you like, of the covariance. Those are the eigenvectors of the covariance. Then we also refit this phi, which we'll get to in a second. This is just a review from last time, which has the proportion."},{"start":199.08,"text":"which was the estimated fraction that we had. And we had ad hoc estimates for that last time. If you don't remember them, please don't worry about it. We're going to re-derive them now. But this is a way we could derive them in general. Last time, we kind of squinted at it and said, hey, this was where the mean should be. This is where the variance should look like. This is what the fraction is. We do this kind of fractional count based on population statistics."},{"start":221.38,"text":"Today, we're going to derive that. And that derivation is going to be the example for this EM algorithm, which is a very general algorithm."},{"start":229.64,"text":"Then as we talked about, it was repetitive. So hopefully this is review for Monday. This looks exactly like k-means except for the difference from k-means was in k-means we had a hard assignment, here we have a soft assignment. In k-means, if you remember, we picked our new points. They said, hey, these are the points we think are in cluster 1 and cluster 2. We computed the means or their centers, then we iterated. Here instead of just picking their centers, which are the mus, we also pick some statistical parameters, their variances or their covariances, and we fit their proportions."},{"start":258.76,"text":"Otherwise, it's the same. We went from a hard assignment, soft assignment, and probabilistic. Cool. All right. We walked through last time Jensen's inequality, and we're going to use it for concave functions. So I'll only state it for concave functions. That's a terrible line. So this is x, and then we have a function here. Here's 0. We have something, you know, this kind of log x kind of looking function. Here's 1. So it looks like this."},{"start":286.47,"text":"This is log x. This is log x. And remember the picture here. When we want to look at g of z, so if we take any point g of z, we take two other points, a and b. So this a and this b. And we draw the line between them, which I'm going to highlight here. If I can do it. This green is this green here. That's the line. Lambda is the line between them."},{"start":311.43,"text":"And then that is because it's a concave function below the line. That is the definition, if you like, of a concave function that no matter how we draw that chord, it's going to live below the line. We're going to use that estimate quite a bit. And the form that we're going to use that fact in that we saw looks mysterious because of the notation is right here."}],"speech_gaps":[],"frame":"../frames/v048/002.webp","frame_time":186.91},{"title":"EM算法与主成分分析的直观理解","segments":[{"id":14,"text":"is that we're going to be able to take the expectation and move it in the right way. And the way to see this again is to think about this lambda. You take A with probability lambda and B with probability 1 minus lambda. This is a simple expectation. Everything on that line is one example of that simple expectation. And that's visually saying this. And hopefully this drawing, the reason I hammer on it is, should you ever get confused, hopefully you can remember the log and that it's below. Sound good? All right.","zh":"这是因为我们将能够计算期望值，并以正确的方式进行移动。再次理解这一点的方法是考虑这个lambda。你以概率lambda选择A，以概率1减去lambda选择B。这是一个简单的期望值。该线上的一切都是这种简单期望值的一个例子。这在视觉上表示的是这个意思。希望这个图示能帮助你们理解，如果你们将来感到困惑，希望你们能记住对数函数及其位于下方的特性。听起来不错吗？好的。","start":329.19,"end":357.58},{"id":15,"text":"Okay, so this is all review from last time. This is kind of where we left off. If any questions bubbled up, please feel free to ask. Otherwise, we're going to keep going through the EM algorithm. Okay, cool. All right, so this was the picture we drew of the EM algorithm. And I want to go through it again because I want to make sure it's fresh in your mind. It's a weird one to look at. So here we have some parameter theta. What are the thetas? Do people remember what the thetas are, what I'm drawing here? What does theta represent?","zh":"好的，这些都是我们上次课复习的内容。我们大致停留在这里。如果有任何问题浮现出来，请随时提问。否则，我们将继续讲解EM算法。好的，很好。好的，这是我们之前画出的EM算法的图示。我想再讲解一遍，以确保它在你们的脑海中是清晰的。这是一个有点奇怪的图示。在这里，我们有一些参数theta。大家还记得theta是什么吗？我在这里画的是什么？theta代表什么？","start":358.52,"end":386.65},{"id":16,"text":"Yeah, please. It's the vector containing all the parameters. Exactly right. It's the vector containing all the parameters. In general, it will be for whatever we're interested in. Here, it's all the mus, the sigmas, and the phi in particular. It's all the parameters. So it's this abstract thing. I'm going to draw it as a one-dimensional curve because it makes my life easier, not because that's really what's going on. And the curve that we drew last time had this illustrative shape.","zh":"是的，请。它是一个包含所有参数的向量。完全正确。它是一个包含所有参数的向量。一般来说，它会是我们在关注的任何事物的参数。在这里，它包括所有的均值mu、方差sigma和特定的phi。它包括所有的参数。因此，这是一个抽象的概念。我将其画成一条一维曲线，因为这样对我更容易处理，而不是因为这真的就是实际情况。我们上次画的曲线具有这种具有代表性的形状。","start":391.19,"end":416.68},{"id":17,"text":"And I picked this illustrative shape for a couple of reasons. One is that it has this nice kind of multiple bumps we talked about last time that there's... You're going to do kind of a local search inside this. Okay? Alright. So this is the way the algorithm actually looks. The way it works is that we start with a guess here. Theta, I'm going to call it theta t. And then this point, this is just definitional, is L of theta t. Okay? Because this curve is L of theta.","zh":"我选择这种具有代表性的形状有几个原因。其中一个原因是它具有我们上次讨论的那种漂亮的多个波峰，你们将在其中进行某种局部搜索。明白吗？好的。因此，这就是该算法实际的外观。它的运作方式是，我们从这里开始猜测，称为theta t。然后这个点，这只是定义上的，是L(theta t)。明白吗？因为这条曲线就是L(theta)。","start":417.93,"end":446.28},{"id":18,"text":"That's our likelihood function, our loss function. All right, so what do we do? We're going to talk about how to construct this object in a second, but I want a picture in your head as we go through it because there's going to be a bunch of math, and then you could get lost in the math, but the picture is what's going to hopefully save you. It's kind of the intuitive way to understand it. What we're going to do is we're going to create this new function, L of t, where it depends on t. This t and this t are the same.","zh":"这就是我们的似然函数，我们的损失函数。好了，那么我们接下来要做什么呢？我们一会儿会讨论如何构造这个对象，但在我们进行的过程中，我希望你们脑海中有一个图像，因为接下来会有很多数学内容，你们可能会在数学中迷失，但图像将有望拯救你们。这是一种直观理解它的方式。我们将要做的就是创建这个新的函数 L(t)，它依赖于 t。这里的 t 和这里的 t 是相同的。","start":447.2,"end":474.49},{"id":19,"text":"So it's a different curve that depends on that point. And that L of t is going to be a function of theta as well. And this is a curve. I've just drawn a piece of it. This curve continues. There's no reason it doesn't continue. I'm just lazy when I've drawn it. We only care about this is the region of interest that I'm drawing here. But it's a full curve. It's a full curve. Now, what are the properties of this L of t?","zh":"因此，这是一个依赖于该点的不同曲线。而 L(t) 也将是 theta 的函数。这是一个曲线。我只画了其中一部分。这条曲线会继续延伸。没有理由它不能继续延伸。我只是在画的时候比较懒惰。我们只关心这个区域，这是我在这里绘制的感兴趣区域。但这是一个完整的曲线。这是一个完整的曲线。那么，这个 L(t) 有什么性质呢？","start":475.21,"end":503.99}],"notes":["本段主要回顾了EM算法的直观理解，强调了期望最大化过程中的关键概念。讲者提到，EM算法通过将参数空间中的点（theta）与似然函数（L(theta)）联系起来，形成一个直观的图像，帮助理解算法的运作方式。讲者还提到，EM算法的运作方式是通过一个初始猜测（theta_t）来开始，并通过构造一个依赖于t的新函数L(t)来逐步优化参数。","讲者强调了图像在理解EM算法中的重要性，指出在数学推导过程中，图像可以帮助避免迷失在复杂的数学公式中。讲者提到，EM算法的运作方式是通过在参数空间中进行局部搜索，逐步优化参数，以最大化似然函数。","讲者提到，L(theta)是似然函数，也是损失函数，用于衡量当前参数猜测与数据之间的匹配程度。讲者还提到，构造L(t)的过程是EM算法的关键步骤之一，它依赖于当前的参数猜测（theta_t）。","讲者指出，L(t)是一个依赖于t的新函数，它与当前的参数猜测（theta_t）相关联。讲者还提到，L(t)是一个完整的曲线，而不仅仅是图像中所展示的部分，这表明EM算法的优化过程是连续的。","讲者强调了EM算法的直观理解，指出在参数空间中进行局部搜索是EM算法的核心思想。讲者还提到，EM算法的运作方式是通过构造一个依赖于当前参数猜测的新函数，逐步优化参数，以最大化似然函数。","讲者提到，EM算法的运作方式是通过一个初始猜测（theta_t）来开始，并通过构造一个依赖于t的新函数L(t)来逐步优化参数。讲者还指出，L(t)是一个完整的曲线，而不仅仅是图像中所展示的部分，这表明EM算法的优化过程是连续的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":329.19,"end":503.99,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":329.19,"text":"is that we're going to be able to take the expectation and move it in the right way. And the way to see this again is to think about this lambda. You take A with probability lambda and B with probability 1 minus lambda. This is a simple expectation. Everything on that line is one example of that simple expectation. And that's visually saying this. And hopefully this drawing, the reason I hammer on it is, should you ever get confused, hopefully you can remember the log and that it's below. Sound good? All right."},{"start":358.52,"text":"Okay, so this is all review from last time. This is kind of where we left off. If any questions bubbled up, please feel free to ask. Otherwise, we're going to keep going through the EM algorithm. Okay, cool. All right, so this was the picture we drew of the EM algorithm. And I want to go through it again because I want to make sure it's fresh in your mind. It's a weird one to look at. So here we have some parameter theta. What are the thetas? Do people remember what the thetas are, what I'm drawing here? What does theta represent?"},{"start":391.19,"text":"Yeah, please. It's the vector containing all the parameters. Exactly right. It's the vector containing all the parameters. In general, it will be for whatever we're interested in. Here, it's all the mus, the sigmas, and the phi in particular. It's all the parameters. So it's this abstract thing. I'm going to draw it as a one-dimensional curve because it makes my life easier, not because that's really what's going on. And the curve that we drew last time had this illustrative shape."},{"start":417.93,"text":"And I picked this illustrative shape for a couple of reasons. One is that it has this nice kind of multiple bumps we talked about last time that there's... You're going to do kind of a local search inside this. Okay? Alright. So this is the way the algorithm actually looks. The way it works is that we start with a guess here. Theta, I'm going to call it theta t. And then this point, this is just definitional, is L of theta t. Okay? Because this curve is L of theta."},{"start":447.2,"text":"That's our likelihood function, our loss function. All right, so what do we do? We're going to talk about how to construct this object in a second, but I want a picture in your head as we go through it because there's going to be a bunch of math, and then you could get lost in the math, but the picture is what's going to hopefully save you. It's kind of the intuitive way to understand it. What we're going to do is we're going to create this new function, L of t, where it depends on t. This t and this t are the same."},{"start":475.21,"text":"So it's a different curve that depends on that point. And that L of t is going to be a function of theta as well. And this is a curve. I've just drawn a piece of it. This curve continues. There's no reason it doesn't continue. I'm just lazy when I've drawn it. We only care about this is the region of interest that I'm drawing here. But it's a full curve. It's a full curve. Now, what are the properties of this L of t?"}],"speech_gaps":[],"frame":"../frames/v048/003.webp","frame_time":341.19},{"title":"EM算法与凸替代函数","segments":[{"id":20,"text":"We'll talk about it in a second. But one property that's true from the picture is that L of theta of t, that is at this point theta t, equals L theta of t. So they meet at this point, which I'll refer to as being tight. That's the name of that property, tight. The other one is that it lives below L theta. So this is...","zh":"我们稍后会谈到这一点。但从图中可以看出的一个性质是，L在theta t处的值，也就是在这个点theta t处的L(theta t)，等于L(theta t)。因此它们在这个点相遇，我称之为紧性。这就是这个性质的名称，紧性。另一个性质是它位于L(theta)的下方。所以这是……","start":504.59,"end":534.13},{"id":21,"text":"L of t theta is less than L of theta. So those are the defining qualities of that curve. What I'm going to do, the other kind of non-definitional but hopeful quantity of that is what? What do we care about L t of theta? Do you remember from last time? What are we going to do with it? Awesome. It's concave. We're going to optimize on it. We're going to try and crawl up this thing and get a new optimal value here. It's exactly right.","zh":"L(t theta)小于L(theta)。因此这些是该曲线的定义特征。接下来我要说的是，另一种非定义性但有希望的量是什么？我们关心L(t of theta)是什么？你们还记得上次的内容吗？我们要如何使用它？太棒了。它是凹函数。我们要在它上面进行优化。我们要尝试爬升这个函数，以获得一个新的最优值。这完全正确。","start":536.06,"end":563.77},{"id":22,"text":"And this will be, say, this is the optimal here, which I'm going to call this point theta t plus 1. And then you see what's going on right here. It's the arg max of this. It's the local max. So that's why I only drew this piece, because it's going to go down from there. It's going to have to be some nice concave function. And then we're going to repeat the process. This becomes, oops. We're going to repeat the process. And this is going to be l theta of t plus 1.","zh":"这将是这里的最优值，我称之为这个点theta t加1。然后你就会看到这里发生了什么。它是这个函数的最大值点。它是局部最大值。因此我只画了这一部分，因为它会从那里下降。它必须是一个很好的凹函数。然后我们将重复这个过程。这将成为，哦，我们要重复这个过程。这将是l(theta t加1)。","start":565.68,"end":595.96},{"id":23,"text":"Okay? And this is our guess. We've gone from theta t to theta t plus 1.","zh":"明白了吗？这是我们对theta t到theta t加1的猜测。","start":596.53,"end":599.67},{"id":24,"text":"Okay? The E-step is given theta t defining this curve to begin with.","zh":"明白了吗？E步是给定theta t，首先定义这条曲线。","start":599.81,"end":604.83},{"id":25,"text":"That's what we're going to do first. And then the second team is once we've had that curve,","zh":"这就是我们首先要做的事情。然后第二步是，一旦我们有了这条曲线，","start":605.73,"end":609.47},{"id":26,"text":"we're going to optimize over that surrogate over all the theta t plus 1.","zh":"我们将在这条替代函数上对所有theta t加1进行优化。","start":609.59,"end":613.91},{"id":27,"text":"Okay? All the theta and that's going to give us theta t plus 1.","zh":"明白了吗？所有theta都会给出theta t加1。","start":614.17,"end":616.49},{"id":28,"text":"Clear enough what the program is? Awesome.","zh":"刚才的程序清楚了吗？太棒了。","start":617.21,"end":619.71},{"id":29,"text":"All right. Now intuitively, what's going on is we're taking little convex surrogates or","zh":"好的。现在直观地说，我们正在使用一些小的凸替代函数或","start":621.11,"end":625.39},{"id":30,"text":"little concave surrogates, and we're walking our way up to try and get to a maximum. Do we expect","zh":"小的凹替代函数，逐步向上走，试图达到一个最大值。我们是否期望","start":625.39,"end":631.25},{"id":31,"text":"that it gets to an absolute maximum? No. This is by my beautiful drawing. It makes it obvious","zh":"它能够达到一个绝对最大值？不。这是通过我漂亮的画图来说明的。这很明显","start":631.25,"end":637.23},{"id":32,"text":"because this g could go spiraling off into infinity. We don't know. We don't know anything","zh":"因为这个 g 可能会螺旋式地趋向于无穷大。我们不知道。我们对这一点一无所知","start":637.79,"end":641.55},{"id":33,"text":"about that. That's a property of L overall. But this, we're going to see, actually does converge.","zh":"。这是整个 L 的性质。但这个，我们将会看到，实际上会收敛。","start":641.55,"end":647.25},{"id":34,"text":"verge. There's a question. Yeah. So let's, when we walk through this, see what's going to happen","zh":"收敛。有一个问题。是的。所以当我们逐步分析这个过程时，看看会发生什么","start":647.25,"end":658.61},{"id":35,"text":"when you do that kind of thing. What this is going to allow us, EM is one algorithm. You could have","zh":"当你这样做时。这将允许我们，EM 是一种算法。你也可以有","start":658.61,"end":663.33},{"id":36,"text":"other algorithms to solve it. That's one of one answer. Here, what we're doing is we're taking","zh":"其他算法来解决这个问题。这是其中一个可能的答案。在这里，我们所做的就是利用","start":663.33,"end":667.01},{"id":37,"text":"advantage of the fact that it's a latent variable model, and this is allowing us to instantiate it","zh":"它是一个潜在变量模型的事实，这使我们能够以这种方式实例化它。因此，当你可以直接使用潜在变量模型并用某种算法来解决","start":667.01,"end":671.09},{"id":38,"text":"in that way. So there are situations when you could just take a latent variable model and solve","zh":"这些问题时，这就是一种不同的算法来解决这些问题。并且","start":671.09,"end":676.37},{"id":39,"text":"solve that on an algorithm, this is a different algorithm for solving those problems. And","zh":"解决这些问题的方法，这是解决这些问题的不同算法。","start":676.37,"end":681.95}],"notes":["本段主要讲解EM算法中的E步和M步，以及凸替代函数的概念。在E步中，给定当前参数θ_t，构造一个关于θ的下界函数L(θ)，该函数在θ_t处与原目标函数L(θ)相等，并且在其他点处低于L(θ)。这个下界函数被称为tight，因为它在θ_t处与原函数相切。在M步中，对这个下界函数进行最大化，得到新的参数估计θ_{t+1}。","EM算法通过交替进行E步和M步来优化目标函数。E步构造一个关于θ的下界函数，M步则最大化这个下界函数。这种交替过程使得目标函数在每次迭代中单调增加，最终收敛到局部最优解。然而，由于目标函数可能不是严格凸的，因此无法保证收敛到全局最优解。","在讲解过程中，提到EM算法适用于隐变量模型，利用隐变量的分布来构造下界函数。这种构造方法使得EM算法能够处理复杂的概率模型，如混合高斯模型（GMM）。EM算法是一种迭代优化方法，通过构造和优化下界函数来逐步逼近目标函数的最优解。","在讨论过程中，还提到EM算法并不是唯一的方法，其他优化算法也可以用于解决相同的问题。EM算法的优势在于其结构清晰，易于实现，并且在许多实际问题中表现良好。然而，EM算法的收敛性依赖于目标函数的性质，例如目标函数是否是凸函数。","在讲解过程中，还提到EM算法的收敛性问题。虽然目标函数可能不是严格凸的，但EM算法的下界函数在每次迭代中单调增加，因此可以保证收敛到局部最优解。然而，由于目标函数可能具有多个局部最优解，因此无法保证收敛到全局最优解。","最后，课程提到EM算法适用于隐变量模型，但并不是唯一的方法。EM算法的结构使得它能够处理复杂的概率模型，如混合高斯模型。然而，EM算法的收敛性依赖于目标函数的性质，因此在实际应用中需要谨慎选择模型和参数。"],"formulas":[],"uncertainties":["verge"],"diagram":"none","start":504.59,"end":681.95,"asr_flags":[],"math_clarifications":["所有公式均未提供明确的数学表达式，无法进行有效的数学复核，因此均被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":504.59,"text":"We'll talk about it in a second. But one property that's true from the picture is that L of theta of t, that is at this point theta t, equals L theta of t. So they meet at this point, which I'll refer to as being tight. That's the name of that property, tight. The other one is that it lives below L theta. So this is..."},{"start":536.06,"text":"L of t theta is less than L of theta. So those are the defining qualities of that curve. What I'm going to do, the other kind of non-definitional but hopeful quantity of that is what? What do we care about L t of theta? Do you remember from last time? What are we going to do with it? Awesome. It's concave. We're going to optimize on it. We're going to try and crawl up this thing and get a new optimal value here. It's exactly right."},{"start":565.68,"text":"And this will be, say, this is the optimal here, which I'm going to call this point theta t plus 1. And then you see what's going on right here. It's the arg max of this. It's the local max. So that's why I only drew this piece, because it's going to go down from there. It's going to have to be some nice concave function. And then we're going to repeat the process. This becomes, oops. We're going to repeat the process. And this is going to be l theta of t plus 1."},{"start":596.53,"text":"Okay? And this is our guess. We've gone from theta t to theta t plus 1."},{"start":599.81,"text":"Okay? The E-step is given theta t defining this curve to begin with."},{"start":605.73,"text":"That's what we're going to do first. And then the second team is once we've had that curve,"},{"start":609.59,"text":"we're going to optimize over that surrogate over all the theta t plus 1."},{"start":614.17,"text":"Okay? All the theta and that's going to give us theta t plus 1."},{"start":617.21,"text":"Clear enough what the program is? Awesome."},{"start":621.11,"text":"All right. Now intuitively, what's going on is we're taking little convex surrogates or"},{"start":625.39,"text":"little concave surrogates, and we're walking our way up to try and get to a maximum. Do we expect"},{"start":631.25,"text":"that it gets to an absolute maximum? No. This is by my beautiful drawing. It makes it obvious"},{"start":637.79,"text":"because this g could go spiraling off into infinity. We don't know. We don't know anything"},{"start":641.55,"text":"about that. That's a property of L overall. But this, we're going to see, actually does converge."},{"start":647.25,"text":"verge. There's a question. Yeah. So let's, when we walk through this, see what's going to happen"},{"start":658.61,"text":"when you do that kind of thing. What this is going to allow us, EM is one algorithm. You could have"},{"start":663.33,"text":"other algorithms to solve it. That's one of one answer. Here, what we're doing is we're taking"},{"start":667.01,"text":"advantage of the fact that it's a latent variable model, and this is allowing us to instantiate it"},{"start":671.09,"text":"in that way. So there are situations when you could just take a latent variable model and solve"},{"start":676.37,"text":"solve that on an algorithm, this is a different algorithm for solving those problems. And"}],"speech_gaps":[],"frame":"../frames/v048/004.webp","frame_time":516.5899999999999},{"title":"EM算法与主成分分析的对比","segments":[{"id":40,"text":"In that, you would have to marginalize out overall disease. So I would try and write","zh":"在这种情况下，你必须对整体疾病进行边缘化处理。因此，我会尝试写出你提出的算法，然后你会看到为什么在这里会出现这种分解。","start":681.95,"end":685.83},{"id":41,"text":"down the algorithm that you propose, and then you'll see why this decomposes in there.","zh":"但目前，我认为只需说，这是一个不同的算法。","start":685.83,"end":689.53},{"id":42,"text":"But for the moment, I think just say, this is a different algorithm.","zh":"这不是不是基于家庭的，比如，这样它就是什么？","start":689.69,"end":691.97},{"id":43,"text":"Is that not...isn't it not home-based, like, okay, so this is what it is?","zh":"是的，这个函数在所有地方都可能很糟糕，但这个函数会是友好的。我们只在这个局部替代函数上进行最大化操作。","start":693.47,"end":697.95},{"id":44,"text":"Yeah, so this function could be nasty everywhere, but this function will be nice. We're only","zh":"因此，权衡在于，可能存在一个我们了解不多的糟糕算法，但有一个函数在局部上对我们来说会是友好的。因此回到之前的问题，直观地说，我们在这里所做的，如果它可行的话，就是我们有一些糟糕的问题。我们以某种有趣的方式对其进行分解。然后它在局部上分解为一个友好且更容易解决的问题，这就是我们的LT theta替代函数。我们会这样做。这是我们交替方法的第一个例子。我们解决一个问题，得到一个新的估计值。然后我们来回切换。","start":698.23,"end":705.33},{"id":45,"text":"arg maxing on this local surrogate.","zh":"来回切换，来回切换。它有效。它与你为了解决K均值问题所采用的完全相同的方法是精确的类比。对吧？非常好的问题。是的。但另一个函数，就像K均值一样，如果你还记得上次的内容，它是NP难的，而且也是一个难以精确求解的困难函数。因此，底层函数，它将是一个近似，因为我们希望从中得到一个良好的解。我们可能没有任何保证。这些问题非常出色。还有其他人吗？好的。","start":705.33,"end":706.71},{"id":46,"text":"So the trade-off is there's a nasty algorithm, potentially that we don't know too much about, but there's a function that is locally going to be nice for us. And so back to the other question, intuitively what we're doing here, if it were, and this is just like what we kind of hope works, is that we have some problem which is nasty. We decompose it in some interesting way. And then it decomposes locally as something that's nice and easier to solve, which is what our LT theta surrogate is going to be. And we're going to do it. This is our first example of alternating kind of methods. We solve one thing, gives us a new estimate. We go back and forth.","zh":"因此，这里存在一种权衡：我们可能会有一个我们不太了解的复杂算法，但存在一个在局部范围内对我们来说会比较友好的函数。回到之前的问题，直观地讲，我们在这里所做的，如果它能像我们所希望的那样工作的话，就是我们有一个复杂的问题。我们以某种有趣的方式对其进行分解。然后，它在局部范围内会分解成一个更易于求解的、友好的问题，这就是我们的LT theta代理函数。我们将这样做。这是我们交替方法的第一个例子。我们解决一个问题，得到一个新的估计值。然后我们来回切换。","start":707.51,"end":736.93},{"id":47,"text":"Back and forth and back and forth. It works. It's like the exact analog of how you would solve K-means for exactly the same reasons. Right? Fantastic question. Yeah. But the other function, just like K-means, was NP-hard, if you remember last time, but also was a hard function to solve exactly. So the underlying function, it's going to be an approximation in the sense that we hope to get a good solution out of this. We may not have any guarantees. These are phenomenal questions. Others? All right.","zh":"来回切换，来回切换。它有效。这与你为了解决K均值问题所采用的完全相同的原因。对吧？非常好的问题。是的。但另一个函数，就像K均值一样，如果你还记得上次的内容，它是NP难的，而且也是一个难以精确求解的困难函数。因此，底层函数，它将是一个近似，因为我们希望从中得到一个不错的解。我们可能没有任何保证。这些问题非常精彩。还有其他人吗？好的。","start":737.07,"end":768.76},{"id":48,"text":"So now let's get into doing it. Let's figure out how we construct LT, capital LT. All right. All right. So now what I'm going to do is if I do my job well, there will be a lot of symbols that I can't avoid. But the manipulations will actually strike you as quite simple. Okay. All right. So how do we construct L of T?","zh":"现在让我们开始实际操作。让我们弄清楚如何构造LT，大写的LT。好的。好的。现在我将要做的事情是，如果我做得好，就会有很多符号无法避免。但这些操作实际上会显得相当简单。好的。好的。那么我们如何构造L(T)呢？","start":769.7,"end":793.41},{"id":49,"text":"So what I'm going to do right now is I'm going to examine a single data point. And the reason this is so critical is it lets me drop those scripts everywhere, superscripts. That's really all I'm doing. At the end, we're going to sum over all the data points. This just makes my life easier on this. I don't have to maintain a bunch of sums. So I'm looking at one individual data point right now. Because of the kind of IID assumption, doing that, I can just scale it by a summation later.","zh":"现在我要做的事情是，我将检查一个单一的数据点。而这样做之所以如此关键，是因为它让我可以省略掉所有那些脚标和上标。这其实就是我所做的事情。最后，我们将对所有数据点求和。这仅仅是为了让我的工作更容易。我不必维护一堆求和项。现在我正在查看一个单独的数据点。由于独立同分布的假设，这样做之后，我只需在之后通过求和来对其进行缩放。","start":794.01,"end":816.11},{"id":50,"text":"All right. So as we looked at, we want to have this log likelihood that was there before. And our log likelihood function decomposes in this format. So I was asked earlier about the SGD piece. Well, this sum over Z could be quite nasty if we had to do the entire decomposition of it. Z could be big. For now, I'm going to imagine it's discrete because it makes my life easier, but it could be a big continuous thing. So this is a way of dealing with these hidden variable models where we don't see Z.","zh":"好的。正如我们所看到的，我们希望拥有之前存在的对数似然。我们的对数似然函数以这种格式分解。我之前被问及SGD的部分。那么，如果必须对整个分解进行求和，这个关于Z的求和可能会相当麻烦。Z可能会很大。现在，我将想象它是离散的，因为这让我更容易处理，但它可能是一个很大的连续变量。因此，这是一种处理这些隐藏变量模型的方法，其中我们看不到Z。","start":817.09,"end":843.17}],"notes":["本段讨论了EM算法与K-means算法的相似性，指出EM算法通过将复杂问题分解为局部可解的问题来简化计算。讲者提到，EM算法中的目标函数可能很复杂，但通过使用局部近似函数，可以更容易地进行优化。这种交替优化的方法是EM算法的核心思想之一。","讲者强调了EM算法与K-means算法在处理复杂问题时的相似性，即通过分解问题并使用局部近似函数来简化计算。同时，讲者指出，虽然EM算法可能无法保证得到最优解，但通常可以得到一个较好的近似解。","在讨论如何构造LT（log-likelihood）时，讲者提到需要考虑单个数据点的情况，并利用独立同分布（IID）的假设来简化计算。通过分析单个数据点，可以避免处理复杂的求和操作，从而简化问题。","讲者指出，对于隐藏变量模型，直接计算对数似然函数可能非常困难，因此需要使用EM算法来处理。EM算法通过引入隐变量并分两步进行优化（E步和M步），从而逐步逼近最优解。","在讨论EM算法的实现时，讲者提到需要处理隐藏变量Z的求和问题，这可能非常复杂。因此，讲者建议先假设Z是离散的，以便简化计算，但同时也指出，Z也可以是连续的。","讲者强调了EM算法在处理隐藏变量模型时的重要性，并指出EM算法是一种交替优化方法，通过逐步优化局部目标函数来逼近全局最优解。这种方法在处理复杂模型时非常有效。"],"formulas":[],"uncertainties":[],"diagram":"none","start":681.95,"end":843.17,"asr_flags":[],"math_clarifications":["原文中提到的L(T)未明确其数学定义，无法确定其具体形式，因此该公式需移除。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":681.95,"text":"in that, you would have to marginalize out overall disease. So I would try and write"},{"start":685.83,"text":"down the algorithm that you propose, and then you'll see why this decompasses in there."},{"start":689.69,"text":"But for the moment, I think just say, this is a different algorithm."},{"start":693.47,"text":"Is that not...isn't it not home-based, like, okay, so this is what it is?"},{"start":698.23,"text":"Yeah, so this function could be nasty everywhere, but this function will be nice. We're only"},{"start":705.33,"text":"arg maxing on this local surrogate."},{"start":707.51,"text":"So the trade-off is there's a nasty algorithm, potentially that we don't know too much about, but there's a function that is locally going to be nice for us. And so back to the other question, intuitively what we're doing here, if it were, and this is just like what we kind of hope works, is that we have some problem which is nasty. We decompose it in some interesting way. And then it decomposes locally as something that's nice and easier to solve, which is what our LT theta surrogate is going to be. And we're going to do it. This is our first example of alternating kind of methods. We solve one thing, gives us a new estimate. We go back and forth."},{"start":737.07,"text":"back and forth and back and forth. It works. It's like the exact analog of how you would solve K-means for exactly the same reasons. Right? Fantastic question. Yeah. But the other function, just like K-means, was NP-hard, if you remember last time, but also was a hard function to solve exactly. So the underlying function, it's going to be an approximation in the sense that we hope to get a good solution out of this. We may not have any guarantees. These are phenomenal questions. Others? All right."},{"start":769.7,"text":"So now let's get into doing it. Let's figure out how we construct LT, capital LT. All right. All right. So now what I'm going to do is if I do my job well, there will be a lot of symbols that I can't avoid. But the manipulations will actually strike you as quite simple. Okay. All right. So how do we construct L of T?"},{"start":794.01,"text":"So what I'm going to do right now is I'm going to examine a single data point. And the reason this is so critical is it lets me drop those scripts everywhere, superscripts. That's really all I'm doing. At the end, we're going to sum over all the data points. This just makes my life easier on this. I don't have to maintain a bunch of sums. So I'm looking at one individual data point right now. Because of the kind of IID assumption, doing that, I can just scale it by a summation later."},{"start":817.09,"text":"All right. So as we looked at, we want to have this log likelihood that was there before. And our log likelihood function decomposes in this format. So I was asked earlier about the SGD piece. Well, this sum over Z could be quite nasty if we had to do the entire decomposition of it. Z could be big. For now, I'm going to imagine it's discrete because it makes my life easier, but it could be a big continuous thing. So this is a way of dealing with these hidden variable models where we don't see Z."}],"speech_gaps":[],"frame":"../frames/v048/005.webp","frame_time":693.95},{"title":"EM算法与概率分布的重写技巧","segments":[{"id":51,"text":"Okay, cool. Not to say you can't do something about it, but this is just one way to decompose it. Okay, so back to it. If you look here, what we've done is we're going to do this thing that looks like an insane trick, okay? What we're going to do is we're going to say that for any q of z that we pick, okay? Non-zero, so it kind of makes sense, okay? And even that you can relax, by the way, even to greater than or equal to zero.","zh":"好的，很酷。不是说你不能做些什么，但这是分解它的一种方式。好的，那我们回到这里。如果你看这里，我们所做的就是做一件看起来像一个疯狂技巧的事情，对吧？我们要说的是，对于任何我们选择的q(z)，对吧？非零，所以这在某种程度上是有意义的，对吧？而且，顺便说一句，你甚至可以放松这个条件，甚至大于等于零。","start":843.74,"end":870.39},{"id":52,"text":"This holds. Why does this hold? Well, Q over Q is 1. This is like a pretty dumb thing to do, to be honest. But we're going to make Q mean something in a second. Intuitively, it's going to be a reweighting. If you look at this, you're like, okay, you're going to be up to something with the reweighting. So the way we're going to pick Q among all of them is, we're going to pick Q so that it has these properties. And what does that property remind you of?","zh":"这个等式成立。为什么成立呢？因为Q除以Q等于1。老实说，这是一件相当愚蠢的事情。但我们现在要让Q具有某种意义。直观上，它会是一个重新加权的过程。如果你看这里，你会觉得你正在用重新加权做些什么。因此，我们要在所有这些Q中选择一个Q，使得它具有这些性质。这让你联想到什么性质？","start":872.06,"end":897.84},{"id":53,"text":"It's a probability distribution. So q of z is going to sum to 1 and be non-negative. This allows us to do something completely notational. Sometimes people argue, it's completely notational. We write this expression. What happened here? Nothing.","zh":"这是一个概率分布。因此，q(z)将总和为1且非负。这允许我们做一些完全符号性的操作。有时人们争论，这完全是符号性的。我们写下这个表达式。这里发生了什么？什么都没有。","start":898.44,"end":916.78},{"id":54,"text":"Q of Z, I made a distribution, and I made the expected value go over Z being distributed as Q of Z. And then I also divided by the Q of Z, which is a scalar. I kind of treated it in two ways. Kind of a weird thing to do, right? But this allows me to think about this as an expectation. And we have tools to deal with expectations.","zh":"Q(z)，我创建了一个分布，并让期望值在Z按照Q(z)分布的情况下进行。然后我还除以了Q(z)，这是一个标量。我以两种方式对待它。这是一种奇怪的做法，对吧？但这样允许我将它视为一个期望值。而我们有处理期望值的工具。","start":917.33,"end":937.55},{"id":55,"text":"All right, we have exactly one tool to deal with expectations. So this shouldn't come as a surprise. There are not 10 other tools. I guess we have linearity. We could use linearity, which we're going to use a little bit later. We have Jensen, the last slide. And now what this allows us to do is switch the log.","zh":"好了，我们处理期望值只有一种工具。因此，这不应该令人惊讶。并不是有10种其他工具。我想我们有线性性。我们稍后会用到它。我们还有Jensen不等式，上一张幻灯片。现在，这允许我们交换对数。","start":941.26,"end":964.17},{"id":56,"text":"This, because it's concave, somehow it's that underestimate property we were just talking about. So we have the direction of this. We had the original function, which was this, and we just used Jensen. So now it has that underestimate kind of quality. And then, well, we stop pretending that it was an expectation. We bring it back out.","zh":"这是因为它是凹函数，所以它具有我们刚刚讨论的低估性质。因此，我们有这个方向。我们有原来的函数，它就是这个，我们刚刚使用了Jensen不等式。因此，现在它具有低估的性质。然后，我们停止假装它是一个期望值。我们将它带回来。","start":966.38,"end":985.49},{"id":57,"text":"Now, why did we do this?","zh":"现在，我们为什么要这样做？","start":986.42,"end":988.32},{"id":58,"text":"Well, this is a nice clever trick to be able to use the mechanism we already have.","zh":"嗯，这是一个很聪明的技巧，能够利用我们已经拥有的机制。","start":988.4,"end":992.06},{"id":59,"text":"This isn't like why it's true,","zh":"这并不是在解释为什么它是正确的，","start":992.16,"end":993.54},{"id":60,"text":"maybe you think it was why true.","zh":"也许你会认为它是在解释为什么是正确的。","start":993.62,"end":994.5},{"id":61,"text":"There's another proof, but this is a really slick one that just uses Jensen.","zh":"还有一个其他的证明方法，但这个证明方法非常巧妙，仅仅使用了Jensen不等式。","start":994.66,"end":997.64},{"id":62,"text":"That's it. Cool. Now, we have this function,","zh":"就是这样。很酷。现在，我们有了这个函数，","start":999.6,"end":1004.94},{"id":63,"text":"which is a natural candidate to be our L of t,","zh":"这自然是一个我们称为L(t)的候选函数，","start":1005.04,"end":1008.52},{"id":64,"text":"and we did it per point.","zh":"并且我们是按每个点来处理的。","start":1008.68,"end":1010.1},{"id":65,"text":"This piece here holds for any choice of q subject to this,","zh":"这里的内容对于任何满足这个条件的q的选择都是成立的。","start":1010.36,"end":1016.0},{"id":66,"text":"And we select the Q per point. So if Q had a script on it, this I would have to put them","zh":"并且我们按每个点选择Q。所以如果Q上面有脚本，我需要把它们放上去","start":1016.0,"end":1022.54}],"notes":["本段讲解了EM算法中使用概率分布进行重写的方法。讲者提到，通过选择一个非零的概率分布q(z)，可以将期望值转换为关于q(z)的期望，从而利用Jensen不等式进行处理。这种技巧允许将复杂的对数期望转换为更易处理的形式，同时保持其数学性质。"],"formulas":[],"uncertainties":["maybe you think it was why true."],"diagram":"none","start":843.74,"end":1022.54,"asr_flags":[],"translation_complete":true,"translated_segments":16,"raw_segments":[{"start":843.74,"text":"Okay, cool. Not to say you can't do something about it, but this is just one way to decompose it. Okay, so back to it. If you look here, what we've done is we're going to do this thing that looks like an insane trick, okay? What we're going to do is we're going to say that for any q of z that we pick, okay? Non-zero, so it kind of makes sense, okay? And even that you can relax, by the way, even to greater than or equal to zero."},{"start":872.06,"text":"This holds. Why does this hold? Well, Q over Q is 1. This is like a pretty dumb thing to do, to be honest. But we're going to make Q mean something in a second. Intuitively, it's going to be a reweighting. If you look at this, you're like, okay, you're going to be up to something with the reweighting. So the way we're going to pick Q among all of them is, we're going to pick Q s
