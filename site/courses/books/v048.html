r point."},{"start":1010.36,"text":"This piece here holds for any choice of q subject to this,"},{"start":1016.0,"text":"And we select the Q per point. So if Q had a script on it, this I would have to put them"}],"speech_gaps":[],"frame":"../frames/v048/006.webp","frame_time":855.74},{"title":"EM算法与Q函数的构造","segments":[{"id":67,"text":"everywhere. XI, ZI, but I would also have QI. So every point is going to get to select its own","zh":"到处都是。XI，ZI，但我也会有QI。所以每个点都将选择自己的权重。","start":1022.54,"end":1029.36},{"id":68,"text":"weighting. That's going to be important in what we do next. That's why I highlight it so strongly.","zh":"这将在我们接下来的工作中非常重要。这就是我强调它的原因。","start":1029.36,"end":1033.24},{"id":69,"text":"Because you don't think it's like one Q that's chosen for all of them. Please.","zh":"因为你不会认为这是一个为所有点选择的单一Q函数。请。","start":1033.4,"end":1036.94},{"id":70,"text":"I have a question. How can we be certain that this function has a different part in our","zh":"我有一个问题。我们如何能确定这个函数在我们的批次中有一个不同的部分，对应于我们最初选择的theta以外的另一个theta？","start":1036.94,"end":1044.2},{"id":71,"text":"batch that corresponds to a different theta than the theta we initially chose?","zh":"非常好的问题。你现在提出的问题，让我们先通过算法来处理，然后再回到它。你提出的问题是，为什么我们知道这个方法一定会带来进展？我们稍后会回到这一点。","start":1044.2,"end":1048.32},{"id":72,"text":"Great question. So the question you're raising right now, let's get through the algorithm and","zh":"为什么这个替代函数能够保证带来任何进展？我们稍后会再讨论这个问题。","start":1048.46,"end":1052.7},{"id":73,"text":"come back to it. The question you're raising is, why do we know that this is guaranteed to make","zh":"为什么这个替代函数能够保证带来任何进展？我们稍后会再讨论这一点。","start":1052.7,"end":1056.76},{"id":74,"text":"any progress? And we'll come back to that in a little bit. Why is it that this surrogate that","zh":"有任何进展吗？我们稍后会再回到这一点。为什么这个替代函数","start":1056.76,"end":1061.0},{"id":75,"text":"we have here is going to make any progress underneath it? It's clear that it will be no","zh":"我们在这里是否能在其下取得任何进展？显然，它不会更糟","start":1061.0,"end":1065.14},{"id":76,"text":"No worse.","zh":"不会更糟。","start":1065.14,"end":1065.36},{"id":77,"text":"Why is it clear that it'll be no worse?","zh":"为什么显然它不会更糟？","start":1065.54,"end":1066.68},{"id":78,"text":"Because it's tight.","zh":"因为它是紧的。","start":1071.06,"end":1071.98},{"id":79,"text":"Exactly right.","zh":"完全正确。","start":1072.08,"end":1072.56},{"id":80,"text":"We know that it takes at least the value of the L","zh":"我们知道它至少取当前点的L值","start":1072.72,"end":1075.64},{"id":81,"text":"theta at the current point.","zh":"theta值。","start":1075.64,"end":1076.64},{"id":82,"text":"And so when we do the argmax, the argmax","zh":"因此当我们进行argmax时，argmax","start":1076.9,"end":1079.0},{"id":83,"text":"will be at least that point and potentially higher.","zh":"将会至少达到该点，甚至可能更高。","start":1079.0,"end":1081.08},{"id":84,"text":"So unless it's exactly at the top of this curve,","zh":"除非它正好位于这条曲线的顶部，","start":1081.74,"end":1084.78},{"id":85,"text":"we'll see what happens when it's exactly at the top","zh":"我们将看看它正好位于这条曲线顶部时会发生什么，","start":1085.6,"end":1087.1},{"id":86,"text":"of this curve, what that means, then we're","zh":"这意味着什么，然后我们将","start":1087.1,"end":1089.48},{"id":87,"text":"going to make some progress because the argmax will","zh":"取得一些进展，因为最大值点会严格改善。","start":1089.48,"end":1090.84},{"id":88,"text":"strictly improve.","zh":"非常好的问题。","start":1090.84,"end":1091.32},{"id":89,"text":"Wonderful question.","zh":"我在思考完全正确的事情。","start":1091.76,"end":1092.46},{"id":90,"text":"I'm thinking about exactly the right things.","zh":"我在思考完全正确的事情。","start":1092.52,"end":1093.64},{"id":91,"text":"We haven't got, yeah, so it's the argmax from the last slide.","zh":"我们还没有得到，是的，所以它是上一张幻灯片中的argmax。","start":1095.28,"end":1097.54},{"id":92,"text":"Right, right.","zh":"对，对。","start":1097.86,"end":1098.5},{"id":93,"text":"So it's monochrome.","zh":"所以它是单色的。","start":1098.54,"end":1099.18},{"id":94,"text":"So yeah, so the theta will be monotonically increasing in the way that we've done here. Exactly right. The L of theta surrogate. Cool. And that should also tell you something else, that it will eventually terminate after some point. Yeah? Could you repeat at a high level why we did this Z-tree?","zh":"所以是的，所以θ会以我们在这里所做的方式单调递增。完全正确。L的θ的替代函数。很好。这也应该告诉你一些其他的事情，即它会在某个点之后最终终止。对吗？你能从高层次上重复一下我们为什么这样做Z树吗？","start":1100.6,"end":1116.01},{"id":95,"text":"Oh, great. Yeah. So there's two things. The question is, why do we do this Q of Z trick? So one, the real principle reason is it allows us to use this technology, which is the Jensen piece right here, right? So it allows us to use Jensen's inequality. Q allows us, with this particular selection, says you actually can regard this function.","zh":"哦，很好。是的。这里有两件事。问题是，为什么我们要这样做Q of Z的技巧？首先，真正的原理原因是它允许我们使用这项技术，也就是这里的Jensen片段，对吧？所以它允许我们使用Jensen不等式。Q允许我们，通过这种特定的选择，说你实际上可以把这个函数视为期望。","start":1116.46,"end":1134.2},{"id":96,"text":"as an expectation. And so that gives us a natural surrogate to construct the lower bound.","zh":"因此，这为我们构造一个下界提供了自然的替代函数。","start":1134.86,"end":1140.66},{"id":97,"text":"So the reason we picked Q like it seems very strange to pick it,","zh":"所以我们选择Q的原因似乎非常奇怪，","start":1140.88,"end":1144.36},{"id":98,"text":"it's because it allows us to do exactly this step. So it's really an operational reason.","zh":"是因为它允许我们进行这一步。所以这实际上是一个操作上的原因。","start":1144.38,"end":1148.92},{"id":99,"text":"Now, if you're asking a deeper question, why these surrogates? This is... If you look at it,","zh":"现在，如果你问一个更深层次的问题，为什么选择这些替代函数？这……如果你仔细观察，","start":1149.18,"end":1154.7},{"id":100,"text":"you'll see in a second the way we picked this. This is just a local surrogate that satisfies","zh":"你很快就会看到我们是如何选择这种替代函数的。这只是一个局部替代函数，它恰好满足","start":1154.72,"end":1159.02},{"id":101,"text":"exactly that. It's called an evidence-based lower bound. You're going to see when we get through","zh":"这一点。它被称为基于证据的下界。当你看完这部分后，你会明白这个特定的选择具有某些良好的特性，特别是我们刚才提到的紧致性。","start":1159.02,"end":1163.1},{"id":102,"text":"this that this particular choice has some nice characteristics in particular what we were just","zh":"我们知道如何使它变得紧致，你将在接下来的几张幻灯片中看到这一点，但我们现在选择 q 的目的是为了将其转化为一个期望值，从而能够使用","start":1163.1,"end":1168.2},{"id":103,"text":"talking about in tightness we know how to make it tight and you'll see that happen in the next","zh":"Jensen 不等式。是的，接下来我们就会最大化它，完全正确。这就是针对单个点的 lt，我们将在另一张幻灯片中回来，实际进行并确保","start":1168.2,"end":1171.88},{"id":104,"text":"couple slides but so we picked q so that we could turn into an expectation so that we could use","zh":"我们确实需要验证这两个条件。","start":1171.88,"end":1176.94},{"id":105,"text":"jensen yeah go ahead is what we maximize exactly right so this is lt for one point and we'll come","zh":"jensen 是的，继续说，这就是我们最大化的内容，完全正确，所以这是针对一个点的lt，我们会在另一张幻灯片中再回来，并实际进行操作，确保我们确实需要验证那两个","start":1176.94,"end":1186.82},{"id":106,"text":"back in another slide and actually go and make sure we have to make sure and verify those two","zh":"条件","start":1186.82,"end":1191.32},{"id":107,"text":"properties the tightness and this elbow piece then we're going to write the sum i'm just foreshadowing","zh":"这些性质的紧密性以及这个肘部部分，然后我们将写出总和，我这只是在预示一下","start":1191.32,"end":1196.12},{"id":108,"text":"that will come in like three four slides you'll see how it's put together so this is just right","zh":"这将在接下来的三到四张幻灯片中出现，你们会看到它是如何组合在一起的，所以这只是大致上","start":1196.12,"end":1200.06}],"notes":["本段讨论了EM算法中Q函数的构造及其重要性。讲者强调Q函数允许我们将目标函数视为期望，从而构造出一个下界，这为后续的优化提供了基础。Q函数的选择并非随意，而是为了能够应用Jensen不等式，从而实现对目标函数的近似。"],"formulas":[],"uncertainties":["lt for one point"],"diagram":"none","start":1022.54,"end":1200.06,"asr_flags":[],"translation_complete":true,"translated_segments":42,"raw_segments":[{"start":1022.54,"text":"everywhere. XI, ZI, but I would also have QI. So every point is going to get to select its own"},{"start":1029.36,"text":"weighting. That's going to be important in what we do next. That's why I highlight it so strongly."},{"start":1033.4,"text":"Because you don't think it's like one Q that's chosen for all of them. Please."},{"start":1036.94,"text":"I have a question. How can we be certain that this function has a different part in our"},{"start":1044.2,"text":"batch that corresponds to a different theta than the theta we initially chose?"},{"start":1048.46,"text":"Great question. So the question you're raising right now, let's get through the algorithm and"},{"start":1052.7,"text":"come back to it. The question you're raising is, why do we know that this is guaranteed to make"},{"start":1056.76,"text":"any progress? And we'll come back to that in a little bit. Why is it that this surrogate that"},{"start":1061.0,"text":"we have here is going to make any progress underneath it? It's clear that it will be no"},{"start":1065.14,"text":"No worse."},{"start":1065.54,"text":"Why is it clear that it'll be no worse?"},{"start":1071.06,"text":"Because it's tight."},{"start":1072.08,"text":"Exactly right."},{"start":1072.72,"text":"We know that it takes at least the value of the L"},{"start":1075.64,"text":"theta at the current point."},{"start":1076.9,"text":"And so when we do the argmax, the argmax"},{"start":1079.0,"text":"will be at least that point and potentially higher."},{"start":1081.74,"text":"So unless it's exactly at the top of this curve,"},{"start":1085.6,"text":"we'll see what happens when it's exactly at the top"},{"start":1087.1,"text":"of this curve, what that means, then we're"},{"start":1089.48,"text":"going to make some progress because the argmax will"},{"start":1090.84,"text":"strictly improve."},{"start":1091.76,"text":"Wonderful question."},{"start":1092.52,"text":"I'm thinking about exactly the right things."},{"start":1095.28,"text":"We haven't got, yeah, so it's the argmax from the last slide."},{"start":1097.86,"text":"Right, right."},{"start":1098.54,"text":"So it's monochrome."},{"start":1100.6,"text":"So yeah, so the theta will be monotonically increasing in the way that we've done here. Exactly right. The L of theta surrogate. Cool. And that should also tell you something else, that it will eventually terminate after some point. Yeah? Could you repeat at a high level why we did this Z-tree?"},{"start":1116.46,"text":"Oh, great. Yeah. So there's two things. The question is, why do we do this Q of Z trick? So one, the real principle reason is it allows us to use this technology, which is the Jensen piece right here, right? So it allows us to use Jensen's inequality. Q allows us, with this particular selection, says you actually can regard this function."},{"start":1134.86,"text":"as an expectation. And so that gives us a natural surrogate to construct the lower bound."},{"start":1140.88,"text":"So the reason we picked Q like it seems very strange to pick it,"},{"start":1144.38,"text":"it's because it allows us to do exactly this step. So it's really an operational reason."},{"start":1149.18,"text":"Now, if you're asking a deeper question, why these surrogates? This is... If you look at it,"},{"start":1154.72,"text":"you'll see in a second the way we picked this. This is just a local surrogate that satisfies"},{"start":1159.02,"text":"exactly that. It's called an evidence-based lower bound. You're going to see when we get through"},{"start":1163.1,"text":"this that this particular choice has some nice characteristics in particular what we were just"},{"start":1168.2,"text":"talking about in tightness we know how to make it tight and you'll see that happen in the next"},{"start":1171.88,"text":"couple slides but so we picked q so that we could turn into an expectation so that we could use"},{"start":1176.94,"text":"jensen yeah go ahead is what we maximize exactly right so this is lt for one point and we'll come"},{"start":1186.82,"text":"back in another slide and actually go and make sure we have to make sure and verify those two"},{"start":1191.32,"text":"properties the tightness and this elbow piece then we're going to write the sum i'm just foreshadowing"},{"start":1196.12,"text":"that will come in like three four slides you'll see how it's put together so this is just right"}],"speech_gaps":[],"frame":"../frames/v048/007.webp","frame_time":1034.54},{"title":"EM算法与紧致性","segments":[{"id":109,"text":"now lt defined for one thing we haven't done the arg max yet but you're thinking about exactly the","zh":"现在我们还没有做arg max，但你正在考虑的就是这个","start":1200.06,"end":1205.04},{"id":110,"text":"right ways how are we going to use it and when you say tightness you mean that it touches once at","zh":"正确的方向，我们打算如何使用它，当你提到紧致性时，你是说它在","start":1205.04,"end":1209.8},{"id":111,"text":"at L of theta, the original one, and is underneath it","zh":"L(theta)处，也就是原始的那个点，接触一次，并且在其他所有点处都在其下方","start":1210.96,"end":1215.38},{"id":112,"text":"at all the other points.","zh":"在所有其他点上。","start":1215.38,"end":1216.76},{"id":113,"text":"Tightness refers to just the first of those processes,","zh":"紧致性指的是这第一个过程，","start":1217.04,"end":1219.22},{"id":114,"text":"which is this thing here, which are exactly","zh":"也就是这里的这个过程，它们在那个点处完全相等","start":1220.14,"end":1222.6},{"id":115,"text":"equal at that one point.","zh":"在那个点上相等。","start":1223.16,"end":1224.32},{"id":116,"text":"And what was beautifully pointed out earlier","zh":"正如之前优美地指出的那样","start":1224.68,"end":1226.98},{"id":117,"text":"was because of that tightness, when we do the argmax of this,","zh":"这是因为紧致性，当我们对这个进行argmax时，","start":1226.98,"end":1229.78},{"id":118,"text":"this is a lower bound because it's on the curve.","zh":"这是一个下界，因为它位于曲线上。","start":1230.62,"end":1233.36},{"id":119,"text":"And so the argmax will give us a better value of the L.","zh":"因此，argmax将为我们提供L的一个更好的值。","start":1233.52,"end":1236.26},{"id":120,"text":"That's geometrically what's going on.","zh":"这是几何上发生的事情。","start":1236.62,"end":1237.98},{"id":121,"text":"Awesome questions. You guys got this perfectly.","zh":"非常好的问题。你们完全理解了。","start":1238.6,"end":1240.36},{"id":122,"text":"Others? Cool.","zh":"其他人呢？很好。","start":1242.9,"end":1244.02},{"id":123,"text":"All right. Okay, so how do we make this thing actually tight?","zh":"好的。那么，我们如何让这个东西变得真正紧致呢？","start":1246.28,"end":1250.88},{"id":124,"text":"All right, so here is an observation about Jensen's.","zh":"好的，这里有一个关于Jensen不等式的观察。","start":1252.82,"end":1257.2},{"id":125,"text":"If we pick p over q , this quantity,","zh":"如果我们选择 p 在 q 上，这个量，","start":1259.34,"end":1265.64},{"id":126,"text":"so that it's a constant with respect to Z. It does not change as Z changes. Then Jensen is an equality. Okay? I'm saying something trivial with a lot of words. Why is that? So if the random variable's distribution no longer depends on Z, imagine this happens for a second, then they're tight. Why is that? Well, this thing equals C.","zh":"使得它相对于 Z 是一个常数。它不会随着 Z 的变化而变化。那么 Jensen 不等式就变成了等式。好吗？我在用很多词说一个很平凡的事情。为什么是这样？所以如果随机变量的分布不再依赖于 Z，想象一下这种情况发生了一秒，那么它们就是紧致的。为什么是这样？嗯，这个量等于 C。","start":1266.72,"end":1290.58},{"id":127,"text":"Right? I said if this thing equals C, it equals C. Nothing down here. Log of C equals log of C. The expectation doesn't change that. The expectation of a constant is that constant. Okay? On the other hand, the expectation of this constant, also a constant, is C and equals log C. So the way we're going to get to tightness here is somehow we have to pick Q of Z so that... Oops. So that... Oops. So that...","zh":"对吧？我说如果这个量等于 C，它就等于 C。下面什么都没有。C 的对数等于 C 的对数。期望值不会改变这一点。常数的期望值就是这个常数。好吗？另一方面，这个常数的期望值，也是常数，等于 C 并且等于 log C。因此，我们在这里要达到紧致性的方法是，某种方式选择 Q(Z)，使得……哎呀。所以……哎呀。所以……","start":1291.28,"end":1322.55},{"id":128,"text":"Oops, that was not what I wanted to reveal. Now you saw it. Okay, anyway. Ignore the other slides. Anyway, so how are we going to pick that? So the idea is to pick this so that it doesn't depend on z, and how would you do that? So I did show you. So the idea here is to pick it as a conditional probability. So if we pick it in such a way that it removes the information of z, so that q is equal to p of x,","zh":"哎呀，那不是我想展示的内容。现在你看到了。好吧，不管怎样。忽略其他幻灯片。总之，我们如何选择这个？所以想法是选择这个使得它不依赖于 z，你会怎么做呢？所以我已经展示给你了。所以这里的想法是选择它作为条件概率。如果我们以这样的方式选择它，使得它消除了 z 的信息，使得 q 等于 p(x)，","start":1323.46,"end":1351.32},{"id":129,"text":"then that is equal everywhere for all the different choices of z. It is equal to exactly xθ. So we get to pick all those q's. Now, qz is going to depend on θ and x, but not on z. So we're going to select it for each point xi.","zh":"那么它对于所有不同的 z 选择来说都是相等的。它等于确切的 xθ。因此，我们可以选择所有这些 q。现在，qz 将依赖于 θ 和 x，但不依赖于 z。因此，我们将为每个点 xi 来选择它。","start":1352.35,"end":1371.66}],"notes":["本段讨论了EM算法中紧致性的概念，即下界函数在某个点与原函数相切，且在其他点位于其下方。这种紧致性是通过Jensen不等式实现的，当随机变量的分布不再依赖于隐变量Z时，Jensen不等式变为等式，从而实现紧致性。","讲者指出，为了实现紧致性，需要选择Q(Z)使得其不依赖于Z，这样可以将Q(Z)设为条件概率，从而去除Z的信息。这样，Q(Z)可以依赖于参数θ和观测数据x，但不依赖于Z本身。","讲者提到，当Q(Z)等于p(x)时，它在所有Z的取值下都保持一致，从而使得下界函数与原函数在该点相切，实现紧致性。","讲者强调，选择Q(Z)为条件概率是实现紧致性的关键步骤，这使得Q(Z)能够独立于Z，从而满足Jensen不等式变为等式的条件。","讲者还提到，当Q(Z)不依赖于Z时，其期望值为常数，从而使得下界函数与原函数在该点相等，实现紧致性。","讲者最后指出，选择Q(Z)为条件概率是实现紧致性的有效方法，这使得Q(Z)能够独立于Z，从而满足Jensen不等式变为等式的条件。"],"formulas":[],"uncertainties":["p over q","xθ"],"diagram":"none","start":1200.06,"end":1371.66,"asr_flags":[],"math_clarifications":["公式中未明确说明期望的定义域和分布，且未提及具体条件，无法确定其数学恒等关系。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":21,"raw_segments":[{"start":1200.06,"text":"now lt defined for one thing we haven't done the arg max yet but you're thinking about exactly the"},{"start":1205.04,"text":"right ways how are we going to use it and when you say tightness you mean that it touches once at"},{"start":1210.96,"text":"at L of theta, the original one, and is underneath it"},{"start":1215.38,"text":"at all the other points."},{"start":1217.04,"text":"Tightness refers to just the first of those processes,"},{"start":1220.14,"text":"which is this thing here, which are exactly"},{"start":1223.16,"text":"equal at that one point."},{"start":1224.68,"text":"And what was beautifully pointed out earlier"},{"start":1226.98,"text":"was because of that tightness, when we do the argmax of this,"},{"start":1230.62,"text":"this is a lower bound because it's on the curve."},{"start":1233.52,"text":"And so the argmax will give us a better value of the L."},{"start":1236.62,"text":"That's geometrically what's going on."},{"start":1238.6,"text":"Awesome questions. You guys got this perfectly."},{"start":1242.9,"text":"Others? Cool."},{"start":1246.28,"text":"All right. Okay, so how do we make this thing actually tight?"},{"start":1252.82,"text":"All right, so here is an observation about Jensen's."},{"start":1259.34,"text":"If we pick p over q , this quantity,"},{"start":1266.72,"text":"so that it's a constant with respect to Z. It does not change as Z changes. Then Jensen is an equality. Okay? I'm saying something trivial with a lot of words. Why is that? So if the random variable's distribution no longer depends on Z, imagine this happens for a second, then they're tight. Why is that? Well, this thing equals C."},{"start":1291.28,"text":"Right? I said if this thing equals C, it equals C. Nothing down here. Log of C equals log of C. The expectation doesn't change that. The expectation of a constant is that constant. Okay? On the other hand, the expectation of this constant, also a constant, is C and equals log C. So the way we're going to get to tightness here is somehow we have to pick Q of Z so that... Oops. So that... Oops. So that..."},{"start":1323.46,"text":"Oops, that was not what I wanted to reveal. Now you saw it. Okay, anyway. Ignore the other slides. Anyway, so how are we going to pick that? So the idea is to pick this so that it doesn't depend on z, and how would you do that? So I did show you. So the idea here is to pick it as a conditional probability. So if we pick it in such a way that it removes the information of z, so that q is equal to p of x,"},{"start":1352.35,"text":"then that is equal everywhere for all the different choices of z. It is equal to exactly xθ. So we get to pick all those q's. Now, qz is going to depend on θ and x, but not on z. So we're going to select it for each point xi."}],"speech_gaps":[],"frame":"../frames/v048/008.webp","frame_time":1212.06},{"title":"EM算法与ELBO的性质","segments":[{"id":130,"text":"Okay, so for all choices of Z, we can make this decision. It depends on the Xi's that are fed into it. It depends on the Theta's that are sped into it. But we can do this and the end result is because Jensen was the only thing we used in our argument. Sorry to flip back and forth so much. But the only thing we use is this. This has become a quality and that means it's tight. Okay. All right. So this thing that we've just defined,","zh":"好的，对于所有Z的选择，我们都可以做出这个决定。它取决于输入的Xi。它也取决于输入的Theta。但我们能做到这一点，最终结果是因为我们在论证中只使用了Jensen不等式。抱歉来回翻来覆去这么多。但我们只使用了这一点。这已经成为一个性质，这意味着它是紧的。好的。那么我们刚刚定义的东西，","start":1373.06,"end":1402.85},{"id":131,"text":"we now know has this tightness quality. And we've actually shown something else. We've actually shown the full elbow thing, the first two properties. I didn't highlight it, but you caught on to it right away, which is that L theta is less than or equal to this as we sum. Why? Because it's true term by term. Right? Term by term, we showed every Xi is actually less than or equal to for any Q that we pick, no matter how we pick the Q for this.","zh":"我们现在知道具有这种紧性性质。而且我们实际上展示了一些其他内容。我们实际上展示了完整的肘部（ELBO）性质，前两个属性。我没有特别强调，但你很快就明白了，即L(theta)在求和时小于或等于这个值。为什么？因为每一项都是成立的。对吧？每一项，我们展示了对于任何我们选择的Q，无论我们如何选择这个Q，每个Xi实际上都小于或等于。","start":1403.74,"end":1428.68},{"id":132,"text":"And for the particular choice of QI above and theta t, we showed this.","zh":"对于上述特定的Q_i和theta_t的选择，我们展示了这一点。","start":1431.38,"end":1436.92},{"id":133,"text":"So it matches the picture that I showed you earlier.","zh":"这与我之前展示的图像是一致的。","start":1438.2,"end":1440.5},{"id":134,"text":"So if you've gotten lost in the symbols, the symbols are unfortunately heavy.","zh":"如果你在符号中迷失了，符号确实很繁重。","start":1440.8,"end":1443.52},{"id":135,"text":"That's just how they are.","zh":"这就是它们的本来样子。","start":1443.68,"end":1444.58},{"id":136,"text":"This is a famous thing, the evidence-based lower bound.","zh":"这是一个著名的概念，称为基于证据的下界（evidence lower bound）。","start":1444.72,"end":1447.12},{"id":137,"text":"It is a concept that people use again and again.","zh":"这是一个人们反复使用的概念。","start":1447.98,"end":1450.86},{"id":138,"text":"As I mentioned to you, one of my graduate students was writing the evidence-based lower","zh":"正如我之前告诉你们的，我的一个研究生正在为他们特定的潜在变量模型撰写基于证据的下界，用于一篇即将下周发表的论文。","start":1451.04,"end":1453.92},{"id":139,"text":"bound for their particular latent variable model for a paper that's going to go out next","zh":"如果你在做扩散模型，你会在覆盖下做肘部，它们都在那里。","start":1453.92,"end":1457.6},{"id":140,"text":"week.","zh":"周。","start":1457.6,"end":1457.94},{"id":141,"text":"If you do diffusion models, you do elbows underneath the covers, they all have them in there.","zh":"这是一种基于典型下界的技术。","start":1457.94,"end":1462.36},{"id":142,"text":"This is a kind of a canonical-based lower bounding technique.","zh":"并不是说没有其他方法，也不是说没有更好的方法，","start":1463.38,"end":1467.0},{"id":143,"text":"Not to say they're not others, not to say there aren't better ones,","zh":"但这是其中一种典型的方法，它只是利用了Jensen不等式和局部凹性中的信息。","start":1467.62,"end":1470.1},{"id":144,"text":"but this is a canonical one that just uses this information that's in Jensen's","zh":"但这是一个经典的例子，它仅仅利用了Jensen不等式中的信息。","start":1470.32,"end":1474.24},{"id":145,"text":"and the local concavity.","zh":"以及局部凹性。","start":1474.24,"end":1475.26},{"id":146,"text":"Please.","zh":"请。","start":1475.8,"end":1476.26},{"id":147,"text":"Do we have something like how wide are these distributions between...","zh":"我们有没有类似这些分布之间有多宽这样的东西？","start":1477.24,"end":1484.4},{"id":148,"text":"Oh, wonderful question.","zh":"哦，非常好的问题。","start":1484.4,"end":1485.32},{"id":149,"text":"Yeah. So the question here... All right. Okay. Oops. I just want to get the conclusion on the","zh":"是的。所以这个问题……好的。好的。哎呀。我只是想在幻灯片上得出结论。所以问题是，我们有没有什么……所以那些我们之前认为的L的T，现在实际上是这个肘部函数。它是这些肘部函数的总和。所以问题是，我们有没有什么","start":1486.0,"end":1492.08},{"id":150,"text":"slide. So the question is, do we have anything... So those L of T's that we thought are actually","zh":"在这里使L变得好或坏的因素是什么？以及这里的情况是为什么它是基于证据的，因为我们只是对每一项使用了局部条件概率。","start":1492.08,"end":1497.28},{"id":151,"text":"this elbow function now. It's the sum of these elbows. So the question is, do we have anything","zh":"这个肘部函数现在。它是这些肘部函数的总和。因此问题是，我们有什么","start":1497.28,"end":1502.6},{"id":152,"text":"What makes a good or a bad L here? And what's going on here, why it's evidence-based","zh":"什么使得这里的L是好的或坏的？这里发生了什么，为什么它是基于证据的","start":1502.6,"end":1507.6},{"id":153,"text":"is we're just using the local conditional probabilities for every term.","zh":"是因为我们只是为每一项使用了局部的条件概率。","start":1507.6,"end":1510.8},{"id":154,"text":"So this is the best we can do by looking term by term and looking at that conditional probability with Q, roughly speaking. That's an informal statement, but hopefully that makes sense. Another way to say is, no, we don't have any control in this approach of whether or not L is going to work. That's actually a function of the underlying problem and its shape and curvature. So an example of why this is similar is in gradient descent, if you have a really sharp function, maybe it's easier to get to the bottom. Or if you have a really wide function, you can get down close to the bottom. Those are properties.","zh":"因此，通过逐项查看并考虑与Q相关的条件概率，这是我们能做的最好的事情。这是一个非正式的说法，但希望这能让你明白。另一种说法是，不，我们在这种做法中对L是否有效是没有控制力的。实际上，这是底层问题及其形状和曲率的函数。一个类似的例子是梯度下降，如果你有一个非常陡峭的函数，可能更容易到达底部；或者如果你有一个非常宽的函数，你可以接近底部。这些都是函数的性质。","start":1511.22,"end":1540.42}],"notes":["本段主要讨论了EM算法中ELBO（证据下界）的性质，强调了其紧致性（tightness）以及如何通过Jensen不等式推导出ELBO的上界。讲者指出，ELBO的上界是通过逐项比较得出的，且对于任何选择的Q分布都成立。这表明ELBO是一个有效的下界，能够用于优化问题。","讲者提到ELBO是证据下界，是机器学习中一个常用的概念，特别是在处理隐变量模型时。他举了一个研究生正在为论文撰写ELBO的例子，说明其在实际应用中的重要性。","讲者进一步解释了ELBO的性质，指出它是一个基于证据的下界，其有效性取决于问题本身的形状和曲率。例如，在梯度下降中，函数的尖锐程度会影响收敛速度。","讲者强调，ELBO的构造并不提供对L函数的直接控制，而是依赖于问题本身的特性。这表明ELBO的性能与问题的结构密切相关。","最后，讲者通过梯度下降的例子，说明了函数的形状（如尖锐或宽泛）如何影响优化过程，从而进一步解释了ELBO的性质和应用背景。"],"formulas":[],"uncertainties":["QI above and theta t","evidence-based lower"],"diagram":"none","start":1373.06,"end":1540.42,"asr_flags":[],"math_clarifications":["原始公式中的KL散度项错误地使用了条件分布 $ q(z|x) $，而正确的形式应为 $ q(z) $。此外，ELBO的定义应明确为 $ \\log p_{\\theta}(x) $ 的下界，且不能将负KL散度直接作为损失函数进行最小化。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":1373.06,"text":"Okay, so for all choices of Z, we can make this decision. It depends on the Xi's that are fed into it. It depends on the Theta's that are sped into it. But we can do this and the end result is because Jensen was the only thing we used in our argument. Sorry to flip back and forth so much. But the only thing we use is this. This has become a quality and that means it's tight. Okay. All right. So this thing that we've just defined,"},{"start":1403.74,"text":"we now know has this tightness quality. And we've actually shown something else. We've actually shown the full elbow thing, the first two properties. I didn't highlight it, but you caught on to it right away, which is that L theta is less than or equal to this as we sum. Why? Because it's true term by term. Right? Term by term, we showed every Xi is actually less than or equal to for any Q that we pick, no matter how we pick the Q for this."},{"start":1431.38,"text":"And for the particular choice of QI above and theta t, we showed this."},{"start":1438.2,"text":"So it matches the picture that I showed you earlier."},{"start":1440.8,"text":"So if you've gotten lost in the symbols, the symbols are unfortunately heavy."},{"start":1443.68,"text":"That's just how they are."},{"start":1444.72,"text":"This is a famous thing, the evidence-based lower bound."},{"start":1447.98,"text":"It is a concept that people use again and again."},{"start":1451.04,"text":"As I mentioned to you, one of my graduate students was writing the evidence-based lower"},{"start":1453.92,"text":"bound for their particular latent variable model for a paper that's going to go out next"},{"start":1457.6,"text":"week."},{"start":1457.94,"text":"If you do diffusion models, you do elbows underneath the covers, they all have them in there."},{"start":1463.38,"text":"This is a kind of a canonical-based lower bounding technique."},{"start":1467.62,"text":"Not to say they're not others, not to say there aren't better ones,"},{"start":1470.32,"text":"but this is a canonical one that just uses this information that's in Jensen's"},{"start":1474.24,"text":"and the local concavity."},{"start":1475.8,"text":"Please."},{"start":1477.24,"text":"Do we have something like how wide are these distributions between..."},{"start":1484.4,"text":"Oh, wonderful question."},{"start":1486.0,"text":"Yeah. So the question here... All right. Okay. Oops. I just want to get the conclusion on the"},{"start":1492.08,"text":"slide. So the question is, do we have anything... So those L of T's that we thought are actually"},{"start":1497.28,"text":"this elbow function now. It's the sum of these elbows. So the question is, do we have anything"},{"start":1502.6,"text":"that manages? What makes a good or a bad L here? And what's going on here, why it's evidence-based"},{"start":1507.6,"text":"is we're just using the local conditional probabilities for every term."},{"start":1511.22,"text":"So this is the best we can do by looking term by term and looking at that conditional probability with Q, roughly speaking. That's an informal statement, but hopefully that makes sense. Another way to say is, no, we don't have any control in this approach of whether or not L is going to work. That's actually a function of the underlying problem and its shape and curvature. So an example of why this is similar is in gradient descent, if you have a really sharp function, maybe it's easier to get to the bottom. Or if you have a really wide function, you can get down close to the bottom. Those are properties."}],"speech_gaps":[],"frame":"../frames/v048/009.webp","frame_time":1385.06},{"title":"混合高斯模型（EM）与主成分分析中的假设与建模选择","segments":[{"id":155,"text":"of the loss function, not properties of the algorithm here. Everything was almost deterministic from the time we turned the crank. There was randomness. The randomness was in the initial selection that we had. This exactly mirrors k-means. So hopefully right now all the pieces click together. You're like, oh, that looks like a lot of unnecessary needless math. Fine. I admit that. But it's precise. And what it tells you is each one of those blocks fits in exactly the same way. Cool. Please.","zh":"这是关于损失函数的，而不是算法本身的性质。从我们启动计算的那一刻起，几乎所有过程都是确定性的。存在随机性，但这种随机性来自于初始选择。这与k均值算法完全对应。希望现在所有的部分都连贯起来了。你可能会想，这看起来像是很多不必要的数学。好吧，我承认这一点。但它是精确的。它告诉你的就是每一个模块都以完全相同的方式契合在一起。很好。请。","start":1540.53,"end":1570.36},{"id":156,"text":"I'm trying to understand, for any distribution, can we do it with a lower bound? Yeah, wonderful question. So you asked, the question was, can we do this for any distribution? So another way to turn that question around is, what assumptions are we making about this distribution? And one which I think","zh":"我试图理解，对于任何分布，我们是否可以用一个下界来实现？是的，这是一个很好的问题。你问的问题是，我们是否可以对任何分布这样做？另一种方式来思考这个问题是，我们对这个分布做了哪些假设？其中一种假设就是","start":1572.07,"end":1589.65},{"id":157,"text":"I think over time... I think when I was starting out as an undergrad student, you would seek some assumptions and they would feel mild to you and other assumptions would seem strong. When you see someone write something that says the probability function has the following form, that's usually a fairly strong assumption because it means there's some deep factorization. And we did a deep factorization here. I don't want to scroll all the way back. So I'll just write it and erase it. We assumed that p broke out in a particular form. That it looked like our...","zh":"我认为随着时间的推移……我认为当我刚开始作为本科生的时候，你会寻求一些假设，这些假设对你来说会感觉很温和，而其他假设则看起来很强烈。当你看到有人写某个概率函数具有如下形式时，这通常是一个相当强的假设，因为它意味着存在某种深层次的分解。在这里我们也进行了深层次的分解。我不想回滚到那么远的地方。所以我只是写下来然后擦掉。我们假设p以一种特定的形式分解。它看起来像我们的……","start":1590.1,"end":1619.46},{"id":158,"text":"probability of x was the probability of x of theta, we assumed, had this latent structure that we knew, which was this thing over z that said xz of theta.","zh":"x的概率是x的θ概率，我们假设它具有我们已知的这种潜在结构，即关于z的这个表达式，表示xz的θ。","start":1619.5,"end":1630.48},{"id":159,"text":"And we knew what Z was and we had information about it. That's a relatively strong assumption because it rules out lots of models. If you know it's there, like for example, you know there's some clustering or you know there's some point sources, then that's a fair assumption. There's a Z that has the following shapes. But we have to know a lot of information about Z. Here we had to completely characterize it. We had to know roughly. We had to know that it had a number of point sources. We had to know that they had particular shapes. And so that factorization, a lot pulled into it.","zh":"我们知道Z是什么，并且有关于它的信息。这是一个相对较强的假设，因为它排除了大量模型。如果你知道它存在，例如，你知道存在某种聚类或某种点源，那么这是一个合理的假设。存在一个具有如下形状的Z。但我们必须知道很多关于Z的信息。在这里，我们必须完全描述它。我们必须知道大致情况。我们必须知道它具有若干个点源。我们必须知道它们具有特定的形状。因此，这种分解包含了大量信息。","start":1631.31,"end":1659.13},{"id":160,"text":"Now that said, so that's one answer that says, well, this is actually fairly specific in the class canon of all functions that are out there in the world.","zh":"既然如此，这就是一个答案，它说，实际上，这在所有存在于世界上的函数类中是非常具体的。","start":1659.34,"end":1666.64},{"id":161,"text":"In practice, or in machine learning experience,","zh":"在实践中，或者在机器学习经验中，","start":1667.51,"end":1671.29},{"id":162,"text":"there are a lot of light latent variable models where","zh":"有很多轻量级的潜在变量模型，","start":1671.85,"end":1674.51},{"id":163,"text":"you decompose in this way and it gives you some amount of information.","zh":"你以这种方式进行分解，它会给你一些信息。","start":1674.51,"end":1677.67},{"id":164,"text":"This assumption may seem narrow from my description,","zh":"这个假设从我的描述来看可能显得狭窄，","start":1677.99,"end":1681.07},{"id":165,"text":"but actually there are a ton of models that basically said,","zh":"但实际上有很多模型基本上都说，","start":1681.27,"end":1683.55},{"id":166,"text":"no, we're willing to assume this about the underlying substructure,","zh":"不，我们愿意对底层子结构做出这个假设，","start":1683.65,"end":1687.17},{"id":167,"text":"and that allows us to then do much better inference.","zh":"这使我们能够进行更好的推理。","start":1687.29,"end":1689.39},{"id":168,"text":"Again, it's a modeling choice.","zh":"同样，这也是一个建模的选择。","start":1689.79,"end":1690.83},{"id":169,"text":"How much you're willing to assume you know about the Z and put in there,","zh":"你愿意假设自己对Z了解多少，并将其放入模型中，","start":1691.07,"end":1694.99},{"id":170,"text":"then tells you how well your model has fidelity, and then tells you whether or","zh":"然后会告诉你你的模型的保真度如何，然后会告诉你这种方法是否适用于它。是的，请注意。","start":1694.99,"end":1698.39},{"id":171,"text":"not this method is applicable to it. Yeah, please.","zh":"哦，回想一下Z是什么。在这个例子中，Z将是一种告诉你所有潜在或未观测结构的信息。","start":1698.39,"end":1701.47},{"id":172,"text":"Oh, recall what Z is. So Z in this example is going to be kind of the information that tells","zh":"所以，那些你无法直接测量的事物。","start":1704.39,"end":1712.19},{"id":173,"text":"you all the latent or unobserved structure. So the things that you can't directly measure,","zh":"你们所有的潜在或未观测到的结构。因此，那些你们无法直接测量的事物，","start":1712.19,"end":1716.23}],"notes":["本段讨论了在建模过程中对分布的假设问题，强调了对分布形式的假设通常是一个较强的假设，因为它意味着存在某种深层的分解结构。例如，假设概率函数具有特定形式，通常意味着存在某种隐变量结构，这在混合高斯模型中体现为对Z的假设。","讲者指出，虽然这种假设可能看起来狭窄，但实际上有很多模型都愿意做出类似的假设，即对潜在子结构进行假设，从而允许进行更有效的推理。这种建模选择决定了模型的适用性和推理能力。","讲者提到，对Z的了解程度决定了模型的保真度，即模型对数据的拟合程度，以及该方法是否适用于特定问题。这表明建模选择直接影响模型的性能。","讲者强调，Z代表的是隐变量或未观测结构，这些是无法直接测量的，但通过假设其存在和形式，可以构建更复杂的模型。这种假设是建模过程中的关键部分。","讲者还提到，对于分布的假设可能因人而异，有些假设看起来温和，有些则显得较强。这取决于建模者的经验和对问题的理解。","讲者最后提醒听众回忆Z的定义，强调Z在模型中的作用是提供关于未观测结构的信息，这是构建混合高斯模型等模型的基础。"],"formulas":[],"uncertainties":["xz of theta"],"diagram":"none","start":1540.53,"end":1716.23,"asr_flags":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":1540.53,"text":"of the loss function, not properties of the algorithm here. Everything was almost deterministic from the time we turned the crank. There was randomness. The randomness was in the initial selection that we had. This exactly mirrors k-means. So hopefully right now all the pieces click together. You're like, oh, that looks like a lot of unnecessary needless math. Fine. I admit that. But it's precise. And what it tells you is each one of those blocks fits in exactly the same way. Cool. Please."},{"start":1572.07,"text":"I'm trying to understand, for any distribution, can we do it with a lower bound? Yeah, wonderful question. So you asked, the question was, can we do this for any distribution? So another way to turn that question around is, what assumptions are we making about this distribution? And one which I think"},{"start":1590.1,"text":"I think over time... I think when I was starting out as an undergrad student, you would seek some assumptions and they would feel mild to you and other assumptions would seem strong. When you see someone write something that says the probability function has the following form, that's usually a fairly strong assumption because it means there's some deep factorization. And we did a deep factorization here. I don't want to scroll all the way back. So I'll just write it and erase it. We assumed that p broke out in a particular form. That it looked like our..."},{"start":1619.5,"text":"probability of x was the probability of x of theta, we assumed, had this latent structure that we knew, which was this thing over z that said xz of theta."},{"start":1631.31,"text":"And we knew what Z was and we had information about it. That's a relatively strong assumption because it rules out lots of models. If you know it's there, like for example, you know there's some clustering or you know there's some point sources, then that's a fair assumption. There's a Z that has the following shapes. But we have to know a lot of information about Z. Here we had to completely characterize it. We had to know roughly. We had to know that it had a number of point sources. We had to know that they had particular shapes. And so that factorization, a lot pulled into it."},{"start":1659.34,"text":"Now that said, so that's one answer that says, well, this is actually fairly specific in the class canon of all functions that are out there in the world."},{"start":1667.51,"text":"In practice, or in machine learning experience,"},{"start":1671.85,"text":"there are a lot of light latent variable models where"},{"start":1674.51,"text":"you decompose in this way and it gives you some amount of information."},{"start":1677.99,"text":"This assumption may seem narrow from my description,"},{"start":1681.27,"text":"but actually there are a ton of models that basically said,"},{"start":1683.65,"text":"no, we're willing to assume this about the underlying substructure,"},{"start":1687.29,"text":"and that allows us to then do much better inference."},{"start":1689.79,"text":"Again, it's a modeling choice."},{"start":1691.07,"text":"How much you're willing to assume you know about the Z and put in there,"},{"start":1694.99,"text":"then tells you how well your model has fidelity, and then tells you whether or"},{"start":1698.39,"text":"not this method is applicable to it. Yeah, please."},{"start":1704.39,"text":"Oh, recall what Z is. So Z in this example is going to be kind of the information that tells"},{"start":1712.19,"text":"you all the latent or unobserved structure. So the things that you can't directly measure,"}],"speech_gaps":[],"frame":"../frames/v048/010.webp","frame_time":1552.53},{"title":"隐变量与EM算法的E步","segments":[{"id":174,"text":"like in particular, when we run through it, it's going to be like the strength of the sources of","zh":"比如，当我们进行计算时，它会类似于源的强度","start":1716.35,"end":1721.21},{"id":175,"text":"the clusters and all that other kind of good stuff, like the cluster assignments themselves,","zh":"聚类以及所有其他好的内容，比如聚类分配本身，","start":1721.21,"end":1724.57},{"id":176,"text":"cells were Z in our example.","zh":"在我们的例子中，单元格是Z。","start":1724.57,"end":1726.37},{"id":177,"text":"So it's just something that's not directly observable to us.","zh":"因此，这对我们来说是无法直接观察到的。","start":1726.71,"end":1729.97},{"id":178,"text":"No one ever comes at the end and tells us, yep,","zh":"没有人会在最后告诉我们，比如，","start":1730.03,"end":1732.23},{"id":179,"text":"you got cluster five correct.","zh":"你正确地得到了第五个聚类。","start":1732.37,"end":1734.51},{"id":180,"text":"So Z is the latent structure, the hidden structure from us.","zh":"因此，Z是潜在的结构，是我们所隐藏的结构。","start":1734.81,"end":1737.45},{"id":181,"text":"So how are we identifying ?","zh":"那么我们是如何识别它的？","start":1738.35,"end":1740.35},{"id":182,"text":"OK, so the thing that we've shown here","zh":"好的，所以我们在这里展示的是","start":1742.07,"end":1745.23},{"id":183,"text":"So Z is not something that is... So Z is hidden from us. That means we can't measure it. But when we're running our procedure, we have a guess for where Z is. In the same way that... So you have a hypothesis of where it is. So you say it exists. This soft clustering exists. And then you have an instantiation. And based on that instantiation, we make an estimate. And then we estimate the rest of the parameters, the non-latent, the observed parameters. That's the next state. And then we update and say, oh, how would that have changed our Z?","zh":"所以Z并不是我们能够……所以Z是隐藏的。这意味着我们无法测量它。但在我们运行程序时，我们有一个关于Z位置的猜测。就像……你有一个关于它位置的假设。所以你说它存在。这种软聚类存在。然后你有一个具体实例。基于这个实例，我们做出估计。然后我们估计其余的参数，即非潜变量的、可观测的参数。这是下一步。然后我们更新并问，这会如何改变我们的Z？","start":1746.3,"end":1774.14},{"id":184,"text":"That's the loop that we're going through kind of again and again and again here. The QI of Z is going to be based on the data we have and our current guess of the parameters. That is, the parameters we talked about, the sigmas and all the rest of that stuff. What do we think the clustering actually is that we don't observe? And then back and forth.","zh":"这就是我们反复进行的循环。Z的QI将基于我们拥有的数据和我们对参数的当前猜测。也就是说，我们之前讨论的参数，如σ和所有其他相关的内容。我们认为那些未观测到的聚类实际上是什么？然后来回进行这个过程。","start":1775.04,"end":1792.02},{"id":185,"text":"So like Z here, this probability distribution over Z, think about how we estimated it previously.","zh":"所以像这里的Z，这个关于Z的概率分布，想想我们之前是如何估计它的。","start":1794.55,"end":1800.73},{"id":186,"text":"You had two Gaussians that were sitting there and you had a point.","zh":"你有两个高斯分布，它们在那里，还有一个点。","start":1801.25,"end":1804.07},{"id":187,"text":"And you said, well, I think given my current guess of where the means and those Gaussians are and their width,","zh":"你说，好吧，考虑到我当前对均值和这些高斯分布位置及其宽度的猜测，","start":1804.19,"end":1809.47},{"id":188,"text":"I think it's 50% or 60% likely it goes to cluster one and 40% likely cluster two.","zh":"我认为它有50%或60%的可能性属于第一个聚类，有40%的可能性属于第二个聚类。","start":1809.97,"end":1814.61},{"id":189,"text":"Now, at this point in the algorithm, I have a handle on Z and I can use it to actually set QZ.","zh":"现在，在算法的这个阶段，我对Z有了把握，可以利用它来实际设置QZ。","start":1815.09,"end":1820.19},{"id":190,"text":"So it's unobserved, but it exists during the run of the algorithm.","zh":"它是不可观测的，但在算法运行过程中是存在的。","start":1820.77,"end":1823.41},{"id":191,"text":"Okay? We make a guess at it. And that hypothesis that there's structure,","zh":"好的？我们对此做一个假设。这种结构的存在，就是让我们能够运行整个算法的关键。非常好的问题。请继续。","start":1824.55,"end":1827.25},{"id":192,"text":"that's what let us run the whole thing. Awesome question. Go ahead.","zh":"我只是想理解一下。比如说，如果我们有两个聚类，","start":1827.43,"end":1830.81},{"id":193,"text":"So I'm just trying to understand. So, like, if we have two clusters,","zh":"我们可能会说，这个是其中一个的50%。抱歉，这个点是另一个的50%。","start":1831.25,"end":1836.21},{"id":194,"text":"and we're like, well, this is like 50% of this one. Sorry, this point is 50% of this one.","zh":"我们说，这个点大约是这个点的50%。抱歉，这个点是这个点的50%。","start":1836.45,"end":1840.97},{"id":195,"text":"What is z in that situation?","zh":"它是一个包含两个数字0.5和0.5的向量。","start":1842.07,"end":1843.29},{"id":196,"text":"It's a vector that has two numbers, 0.5 and 0.5.","zh":"这是一个包含两个数字0.5和0.5的向量。","start":1843.81,"end":1846.71},{"id":197,"text":"Okay. It's saying which cluster it is.","zh":"好的。它是在说这个点属于哪个聚类。","start":1846.77,"end":1848.13},{"id":198,"text":"Exactly right. Yeah, yeah. Because it's the probability over the clusters.","zh":"完全正确。是的，是的。因为这是在聚类上的概率。","start":1848.13,"end":1851.49},{"id":199,"text":"clusters. Good job. Yeah. Thanks. Sorry. Sorry. Very good. All right. So this is exactly,","zh":"聚类。做得很好。是的。谢谢。抱歉。抱歉。非常好。好了，所以这正是，","start":1851.85,"end":1857.17},{"id":200,"text":"this is phenomenal. You guys, you guys fixed all my bugs on a fly, by the way, as I said,","zh":"这太棒了。你们，你们刚才在飞快地修复了我的所有错误，正如我所说，","start":1857.29,"end":1861.39},{"id":201,"text":"I will try and copy paste later. So you will not be able to fix that. So it'll be unfixable","zh":"我稍后会尝试复制粘贴。所以你们将无法修复那个错误。之后它将无法修复","start":1861.41,"end":1864.81},{"id":202,"text":"bugs later.","zh":"的错误。","start":1864.81,"end":1865.29},{"id":203,"text":"Okay. But this is phenomenal. What you have, the E-step is we're going to fix exactly those","zh":"好的。但这是非常棒的。你们所拥有的，E步是修复这些确切的","start":1865.43,"end":1869.91},{"id":204,"text":"QIs. We're going to do this conditional probability. That's going to guess the clustering, the,","zh":"QIs。我们将进行这个条件概率。这将猜测聚类，即，","start":1869.91,"end":1874.05},{"id":205,"text":"which clusters they're in, just like we did in k-means, right? In k-means we guessed,","zh":"它们属于哪个聚类，就像我们在k均值中所做的那样，对吧？在k均值中我们猜测，","start":1874.15,"end":1878.23},{"id":206,"text":"hey these guys are in cluster one these are in cluster two then we computed the mean","zh":"嘿，这些点属于簇一，这些点属于簇二，然后我们计算了均值","start":1878.23,"end":1881.89},{"id":207,"text":"Instead of just computing the means,","zh":"我们不只是计算均值，","start":1882.67,"end":1884.15},{"id":208,"text":"which could have also been written as an argmax,","zh":"这也可以写成一个argmax","start":1884.29,"end":1885.93},{"id":209,"text":"we're going to compute this likelihood argmax,","zh":"我们现在要计算这个似然的argmax，","start":1886.29,"end":1888.45},{"id":210,"text":"and it's going to be a little bit more sophisticated","zh":"这会稍微复杂一点","start":1888.59,"end":1889.95},{"id":211,"text":"because our model instead of just saying whichever one is closer,","zh":"因为我们的模型现在不是简单地说哪个更近，","start":1889.95,"end":1893.65},{"id":212,"text":"now has a probabilistic interpretation under the covers.","zh":"而是在内部具有概率解释。","start":1893.79,"end":1896.19}],"notes":["本段讲解了隐变量Z的概念，它代表了数据中的隐藏结构，无法直接观测。在EM算法中，Z是通过概率分布进行估计的，而不是确定的类别标签。"],"formulas":[],"uncertainties":["QI of Z"],"diagram":"none","start":1716.35,"end":1896.19,"asr_flags":[],"translation_complete":true,"translated_segments":39,"raw_segments":[{"start":1716.35,"text":"like in particular, when we run through it, it's going to be like the strength of the sources of"},{"start":1721.21,"text":"the clusters and all that other kind of good stuff, like the cluster assignments themselves,"},{"start":1724.57,"text":"cells were Z in our example."},{"start":1726.71,"text":"So it's just something that's not directly observable to us."},{"start":1730.03,"text":"No one ever comes at the end and tells us, yep,"},{"start":1732.37,"text":"you got cluster five correct."},{"start":1734.81,"text":"So Z is the latent structure, the hidden structure from us."},{"start":1738.35,"text":"So how are we identifying ?"},{"start":1742.07,"text":"OK, so the thing that we've shown here"},{"start":1746.3,"text":"So Z is not something that is... So Z is hidden from us. That means we can't measure it. But when we're running our procedure, we have a guess for where Z is. In the same way that... So you have a hypothesis of where it is. So you say it exists. This soft clustering exists. And then you have an instantiation. And based on that instantiation, we make an estimate. And then we estimate the rest of the parameters, the non-latent, the observed parameters. That's the next state. And then we update and say, oh, how would that have changed our Z?"},{"start":1775.04,"text":"That's the loop that we're going through kind of again and again and again here. The QI of Z is going to be based on the data we have and our current guess of the parameters. is phenomenal. What you have, the E-step is we're going to fix exactly those"},{"start":1869.91,"text":"QIs. We're going to do this conditional probability. That's going to guess the clustering, the,"},{"start":1874.15,"text":"which clusters they're in, just like we did in k-means, right? In k-means we guessed,"},{"start":1878.23,"text":"hey this these guys are in cluster one these are in cluster two then we computed the mean"},{"start":1882.67,"text":"Instead of just computing the means,"},{"start":1884.29,"text":"which could have also been written as an argmax,"},{"start":1886.29,"text":"we're going to compute this likelihood argmax,"},{"start":1888.59,"text":"and it's going to be a little bit more sophisticated"},{"start":1889.95,"text":"because our model instead of just saying whichever one is closer,"},{"start":1893.79,"text":"now has a probabilistic interpretation under the covers."}],"speech_gaps":[],"frame":"../frames/v048/011.webp","frame_time":1728.35},{"title":"EM算法的局限性与混合高斯模型的步骤","segments":[{"id":213,"text":"Why does it terminate? Well,","zh":"为什么它会终止？嗯，","start":1898.29,"end":1899.53},{"id":214,"text":"this was exactly the monotonicity discussion.","zh":"这正是我们之前讨论的单调性问题。","start":1899.59,"end":1901.11},{"id":215,"text":"You guys already nailed this, so you're way ahead of me.","zh":"你们已经理解得很好了，所以你们比我领先很多。","start":1901.37,"end":1902.83},{"id":216,"text":"The second is, is it globally optimal?","zh":"第二个问题是，它是否是全局最优的？","start":1903.59,"end":1905.07},{"id":217,"text":"No, because I told you I could draw whatever I wanted over here.","zh":"不，因为我告诉过你们，我可以在那边画出任何我想画的东西。","start":1905.17,"end":1907.27},{"id":218,"text":"It's a local method. Cool.","zh":"它是一个局部方法。很好。","start":1907.95,"end":1910.77},{"id":219,"text":"All right, let's see it in action.","zh":"好的，让我们看看实际效果。","start":1910.77,"end":1914.43},{"id":220,"text":"All right, so let me see, I want to do this.","zh":"好的，让我想想，我想这么做。","start":1917.69,"end":1923.73},{"id":221,"text":"All right, please.","zh" s according to cluster 1, cluster 2, and we normalized."},{"start":2178.67,"text":"Ask me a question if that's not clear, and I'll write out the entire math. We can go back and do it. But we did that last time. Good enough, right? It was just the comparison between the two, right? So basically, you looked at, you computed, you know, z... I don't know what that did. Awesome. Want that off the screen. All right. So..."},{"start":2201.0,"text":"So you would compute zi equals 1, let's say, given all the rest. And how you would do it is you would compute then p, I'm going to just do it for this simple one here. We would compute and normalize by p of z1 given 1, blah, blah, blah, plus p z1 given, or zi, sorry, zi equals 2, blah, blah, blah."},{"start":2224.85,"text":"We would just look at the normalized ratio of these, and this is what Bayes' rule told us to do last time. There's nothing mysterious here. It's just comparing those densities that we had. This may be disturbing to some of you because these are densities that I'm comparing, but that's okay. Those numbers are meaningful. If that bothers you, I would say go back, check it out. By your faces, maybe some of you are bothered. You could also ask me questions and I'll tell you more about it. Does this make sense? This is how I assign the value. How do I compute this thing?"}],"speech_gaps":[],"frame":"../frames/v048/013.webp","frame_time":2086.85},{"title":"混合高斯模型（EM）与主成分分析","segments":[{"id":272,"text":"How do I compute the probability that's in one of the clusters? Exactly right. I just take that P of Z that we have with all the X, one over square root of two pi, blah, blah, blah, blah, blah, covariance, monohobless distance, all that junk that I'm trying to avoid desperately writing on the thing. If you make me, I'll do it. Okay? And that gives me a number. That's this number. Then I do the same thing for Z2. Now I have those numbers and I just compare them. And that's the distribution. If I had five of these,","zh":"我如何计算属于其中一个聚类的概率？完全正确。我只需要用我们已经有的关于所有X的P(Z)，除以根号下2π，然后一堆诸如协方差、单峰距离之类的垃圾，我拼命想避免在上面写出来。如果你逼我，我会写的。好吗？这样我就得到了一个数值。这就是这个数值。然后我为Z2做同样的事情。现在我有了这些数值，我只需要进行比较。这就是分布。如果我有五个这样的情况，","start":2258.84,"end":2288.05},{"id":273,"text":"Sources, I would get five numbers from the different five different clusters and I would go back and do it. Please.","zh":"来源，我会从五个不同的聚类中得到五个数值，然后回去做同样的事情。请。","start":2288.86,"end":2295.06},{"id":274,"text":"Awesome. Right. So here, when we did this decomposition, there are two factors that go into the probability distribution. One is the normal distribution that comes under here. And then as we multiply it by how likely it is. So for example, in the case where PZ of one equals blah, blah, blah, blah, blah, and all the rest, its probability would have baked into it when we did the decomposition, right? So the source, the mu and the sigma are kind of independent of the phi one, which was the term that's...","zh":"太棒了。对的。在这里，当我们进行这种分解时，概率分布中有两个因素。一个是这里的正态分布。然后我们乘以它出现的可能性。例如，在PZ为1等于一堆东西的情况下，其余的都包含在分解过程中，对吧？所以来源、均值和标准差基本上与phi这一项是独立的，而phi这一项是……","start":2301.72,"end":2327.94},{"id":275,"text":"said, how many are in this particular thing? And we would multiply against it. And so then this term would become like multiplied by 1,000. And so we would have those two would go back and forth. It would enter linearly in the way that happened. And that was exactly what Bayes' rule told us last time. Sound good?","zh":"所说的，这个聚类中有多少个？然后我们乘以它。因此，这一项会变成乘以1000。因此，这两个因素会来回变化。它会以线性的方式进入。这正是我们上次贝叶斯规则告诉我们的。听起来不错？","start":2327.94,"end":2344.03},{"id":276,"text":"I think the notation makes this obscure. I think if you just write out, what I would suggest to do is just write out what the numbers are and actually try and plug it in, like code up some Python that does it once, then it locks in your brain. These are all just vectors that have horrible notation. You just add them up and do them and life is good. And it makes a lot more sense that way. Maybe not the best advice for a teacher to give you, but whatever. Just do it and it'll be good. Anyway, let's get back to it.","zh":"我认为这种符号让这个问题变得模糊。我认为如果你只是写出这些数值，我建议你做的是写出这些数值并实际尝试代入，比如编写一段Python代码来实现它，这样就能让你的大脑记住。这些都是只是具有糟糕符号的向量。你只需要把它们加起来并进行计算，生活就会很美好。这样理解起来会更清楚。也许这不是老师给你的最佳建议，但不管怎样，你去做吧，这样会很好的。总之，我们回到主题上。","start":2344.8,"end":2372.24},{"id":277,"text":"Let's go to the second step. So what we got out of the first step, just so we're clear, is we estimated all those QIs for each one of them. And hopefully this answers the questions that came before. Hey, now we have an actual guess for every Z of how likely each individual point is. We never observed that, but we now know for any point Xi, we have a probability distribution that we've constructed, which is our guess, our soft assignment. Just like in K-means, when we guessed, sometimes we were wrong, sometimes we were right. We're wrong and right here too, right? It's going to converge over time.","zh":"让我们进入第二步。所以，我们从第一步得到的是，我们为每一个QI都进行了估计。希望这能回答之前的问题。现在，我们对每一个Z都有了一个实际的猜测，即每个数据点的可能性有多大。我们从未直接观察到这一点，但现在我们知道，对于任何一个数据点Xi，我们已经构建了一个概率分布，这是我们对它的软分配的猜测。就像在K均值中，我们有时猜错了，有时猜对了。在这里也是如此，我们也会有时猜错，有时猜对，随着时间推移，它会逐渐收敛。","start":2373.7,"end":2403.16},{"id":278,"text":"time. This isn't a statement about the world. It's a statement about the algorithm's current belief. Good enough? Awesome. All right. So now we're given all these clusters, and we're going to estimate everything here. The phi, the mu's, the sigma's, everything. I'm sorry that the sigma's changed, but conventionally they do, and I can't do much about it.","zh":"时间。这不是对世界的陈述，而是对算法当前信念的陈述。够好吗？太棒了。现在我们有了所有这些聚类，我们将在这里估计所有内容。包括phi、mu、sigma，一切。很抱歉sigma发生了变化，但这是惯例，我对此无能为力。","start":2403.18,"end":2425.58},{"id":279,"text":"All right. So here, the dimension greater than 1, i.e. d goes greater than 1. So mu j is going","zh":"好的。在这里，维度大于1，即d大于1。所以mu j将存在于Rd中。","start":2427.46,"end":2431.46},{"id":280,"text":"to live in Rd. And sigma j is going to live in Rd by d. If d is equal to 1, we confusingly write","zh":"sigma j也将存在于Rd by d中。如果d等于1，我们会令人困惑地写成","start":2431.46,"end":2436.94}],"notes":["本段讲解了如何计算属于某个聚类的概率，通过计算每个聚类的P(Z)并进行比较，得到分布。讲者提到，如果存在多个聚类，会得到多个概率值，并进行比较。这体现了EM算法中E步的核心思想，即通过隐变量的后验概率来计算软分配。","讲者强调了概率分布的两个组成部分：一个是正态分布，另一个是该分布的权重。这两个部分相乘得到最终的概率分布。这与贝叶斯规则中的先验和似然相乘得到后验分布的思想一致。","讲者指出，虽然符号可能让问题变得复杂，但通过实际计算和编程实现，可以更好地理解这些概念。这表明在学习过程中，动手实践和代码实现是理解理论的重要手段。","在第二步中，讲者提到通过第一步估计了所有QI（可能指Q值），并指出这些估计值可以回答之前的问题。这说明EM算法的E步和M步是交替进行的，E步估计隐变量的后验分布，M步则基于这些估计值更新参数。","讲者提到，虽然这些估计值是基于当前算法的信念，而不是真实世界的情况，但它们会随着迭代逐渐收敛。这表明EM算法的收敛性依赖于迭代过程中的逐步优化。","最后，讲者讨论了在高维空间中，均值向量和协方差矩阵的维度变化。这说明在处理多维数据时，需要考虑参数的维度，例如均值向量在d维空间中，协方差矩阵是d×d的矩阵。"],"formulas":[],"uncertainties":["monohobless distance","QIs"],"diagram":"none","start":2258.84,"end":2436.94,"asr_flags":[272,274],"translation_complete":true,"translated_segments":9,"raw_segments":[{"start":2258.84,"text":"How do I compute the probability that's in one of the clusters? Exactly right. I just take that P of Z that we have with all the X, one over square root of two pi, blah, blah, blah, blah, blah, covariance, monohobless distance, all that junk that I'm trying to avoid desperately writing on the thing. If you make me, I'll do it. Okay? And that gives me a number. That's this number. Then I do the same thing for Z2. Now I have those numbers and I just compare them. And that's the distribution. If I had five of these,"},{"start":2288.86,"text":"Sources, I would get five numbers from the different five different clusters and I would go back and do it. Please."},{"start":2301.72,"text":"Awesome. Right. So here, when we did this decomposition, there are two factors that go into the probability distribution. One is the normal distribution that comes under here. And then as we multiply it by how likely it is. So for example, in the case where PZ of one equals blah, blah, blah, blah, blah, and all the rest, its probability would have baked into it when we did the decomposition, right? So the source, the mui and the sigma are kind of independent of the phi one, which was the term that's..."},{"start":2327.94,"text":"said, how many are in this particular thing? And we would multiply against it. And so then this term would become like multiplied by 1,000. And so we would have those two would go back and forth. It would enter linearly in the way that happened. And that was exactly what Bayes' rule told us last time. Sound good?"},{"start":2344.8,"text":"I think the notation makes this obscure. I think if you just write out, what I would suggest to do is just write out what the numbers are and actually try and plug it in, like code up some Python that does it once, then it locks in your brain. These are all just vectors that have horrible notation. You just add them up and do them and life is good. And it makes a lot more sense that way. Maybe not the best advice for a teacher to give you, but whatever. Just do it and it'll be good. Anyway, let's get back to it."},{"start":2373.7,"text":"Let's go to the second step. So what we got out of the first step, just so we're clear, is we estimated all those QIs for each one of them. And hopefully this answers the questions that came before. Hey, now we have an actual guess for every Z of how likely each individual point is. We never observed that, but we now know for any point Xi, we have a probability distribution that we've constructed, which is our guess, our soft assignment. Just like in K-means, when we guessed, sometimes we were wrong, sometimes we were right. We're wrong and right here too, right? It's going to converge over time."},{"start":2403.18,"text":"time. This isn't a statement about the world. It's a statement about the algorithm's current belief. Good enough? Awesome. All right. So now we're given all these clusters, and we're going to estimate everything here. The phi, the mu's, the sigma's, everything. I'm sorry that the sigma's changed, but conventionally they do, and I can't do much about it."},{"start":2427.46,"text":"All right. So here, the dimension greater than 1, i.e. d goes greater than 1. So mu j is going"},{"start":2431.46,"text":"to live in Rd. And sigma j is going to live in Rd by d. If d is equal to 1, we confusingly write"}],"speech_gaps":[{"start":2298.352,"end":2301.32}],"frame":"../frames/v048/014.webp","frame_time":2270.84},{"title":"混合高斯模型（EM）与主成分分析","segments":[{"id":281,"text":"this as the lowercase sigma. But I'm going to write it in the uppercase sigma because it's","zh":"这用小写σ表示。但我要用大写σ来写，因为它","start":2436.94,"end":2440.18},{"id":282,"text":"going to make the math a little bit more transparent what goes on and eliminate a","zh":"会让数学表达更加清晰，有助于理解其中的原理，并消除你将来可能遇到的障碍，我希望如此。记住，这些协方差矩阵是半正定的，并且是对称的，对吧？很好。那么，我们现在来做M步。这本质上","start":2440.18,"end":2443.66},{"id":283,"text":"stumbling block, I hope, when you get there. Remember, these covariance matrices are positive","zh":"就是计算一系列导数，对吧？好吧，这并不太令人愉快。我不会骗你。这一节对我们俩来说都不好玩，但如果我们坚持下去，我们就会理解它，到时候大家都会开心。也许吧。我不知道你的快乐是否深深依赖于理解这个。","start":2443.66,"end":2447.8},{"id":284,"text":"semi-definite and they are symmetric, okay? Cool. All right, so let's do the M-step. It boils down","zh":"那么，这个过程促使我们构建并优化一个替代函数的动机是什么？","start":2447.8,"end":2459.72},{"id":285,"text":"to computing a bunch of derivatives, okay? All right, it's not super pleasant. I'm not going","zh":"这归结为计算一堆导数，对吧？","start":2459.72,"end":2465.24},{"id":286,"text":"to lie to you. This section is not fun for either of us, but if we go through it, we'll understand","zh":"这并不太令人愉快。我不会骗你。这一节对我们俩来说都不好玩，但如果我们坚持下去，我们就会理解它，到时候大家都会开心。也许吧。我不知道你的快乐是否深深依赖于理解这个。","start":2465.24,"end":2470.36},{"id":287,"text":"it and we'll all be happy. Maybe. I don't know if your happiness is deeply tied to understanding","zh":"也许吧。我不知道你的快乐是否深深依赖于理解这个。","start":2470.36,"end":2474.64},{"id":288,"text":"this. What about this process motivated the need to construct and optimize a surrogate function","zh":"那么，这个过程促使我们构建并优化一个替代函数的动机是什么？","start":2474.64,"end":2482.72},{"id":289,"text":"as opposed to what we've been doing before? Awesome, yeah. So this is a great question.","zh":"与我们之前所做的有什么不同？太棒了，是的。所以这是一个非常好的问题。","start":2483.94,"end":2487.98},{"id":290,"text":"So this has come up. So if we, for example, so there's two things, two ways to understand it.","zh":"这个问题已经出现了。所以，例如，有两种理解方式。","start":2488.08,"end":2492.62},{"id":291,"text":"One is here we have extra structure about the function. We know that there exists these huge set","zh":"一种是我们在这里对函数有额外的结构了解。我们知道存在一个巨大的隐藏变量集合","start":2492.68,"end":2497.98},{"id":292,"text":"of hidden variables that we're going to optimize. And so we have to come up with an assignment for","zh":"，我们将对其进行优化。因此，我们必须以某种方式为它们分配值。","start":2497.98,"end":2503.6},{"id":293,"text":"them in some way. So if you go and try and write down gradient descent for this, and you have this","zh":"如果你尝试写出这个的梯度下降算法，并且你有一个巨大的概率分布，你就会遇到","start":2503.6,"end":2507.9},{"id":294,"text":"big probability distribution, you have this gigantic marginalization where you have to do","zh":"一个巨大的边缘化问题，其中你需要处理Z变量内部的情况。这并不是说你不能处理Z变量。","start":2507.9,"end":2511.48},{"id":295,"text":"something about the Z's internally. This is not to say you couldn't do something about the Z's.","zh":"但这是处理我们已知概率分布这一事实的一种方式","start":2511.48,"end":2515.54},{"id":296,"text":"But this is one way of handling the fact that we know the probability distribution","zh":"但这是处理我们已知概率分布的一种方式","start":2515.64,"end":2518.76},{"id":297,"text":"factors in this way that you kind of","zh":"以这种方式进行的因子，你大概","start":2519.36,"end":2521.06},{"id":298,"text":"doing it. It's the same way you could say, why can't I just run gradient descent to solve the least squares cost for k-means? I guess, in essence, you could. But by hypothesizing where you switch and score, that gives you this extra little bit of structure. You've got it perfectly, I think. Cool. Awesome. Other questions? Fantastic. OK. So it's all computing derivatives. Recall, we just","zh":"在做这件事。这和你可以说为什么不能直接运行梯度下降来解决k均值的最小二乘代价是一样的。我想，本质上你是可以的。但通过假设你在何处切换和评分，这给了你一点额外的结构。我认为你已经完全理解了。很好。太棒了。还有其他问题吗？太好了。好的。所以这一切都是在计算导数。回想一下，我们刚刚","start":2522.19,"end":2549.99},{"id":299,"text":"computed this stuff. This is just the definition. Xi, once I give you the cluster, this is just a fancy way to say it has that nice Gaussian shape on it. And this is the weight, the strength. This is how often we see each one of the clusters. So this is just reminding you of the model. Nothing's happened. Now, in a previous lecture, I wrote this out. Hopefully, you remember this monstrosity. What is this?","zh":"计算了这些内容。这只是定义。Xi，一旦我给你一个聚类，这只是一个 fancy 的说法，表示它在该聚类上具有这种漂亮的高斯形状。而这就是权重，强度。这就是我们看到每个聚类的频率。所以这只是在提醒你模型。什么都没发生。现在，在之前的课程中，我写出了这个表达式。希望你还记得这个怪物。这是什么？","start":2550.54,"end":2572.77},{"id":300,"text":"Yeah, it's a multivariant Gaussian distribution in all of its beautiful glory. So I try to hide this from you as long as possible, but here it rears its head. And why it rears its head is you have to compute some stuff. So we're going to compute some derivatives on this. And I'm going to do a little bit of sleight of hand to try and make it a little bit more cooking show-like so that you do it, but hopefully this makes sense.","zh":"是的，这是它以全部美丽辉煌的多变量高斯分布。我尽量长时间地隐藏它，但在这里它出现了。它出现的原因是你必须计算一些内容。因此，我们将在这上面计算一些导数。我会做一点小把戏，试图让它更像烹饪节目，让你去做，但希望这能让你明白。","start":2575.76,"end":2594.66}],"notes":["本段主要讨论混合高斯模型（EM算法）中的M步，强调计算导数的必要性以及其在优化过程中的作用。讲者指出，M步涉及大量导数计算，虽然过程繁琐，但通过理解这些计算可以加深对算法的理解。此外，讲者还提到，EM算法中使用了隐变量（Z）的结构，这使得直接对原始概率分布进行梯度下降变得困难，因此需要构造替代函数进行优化。"],"formulas":[],"uncertainties":["可能的术语错误：'multivariant' 应为 'multivariate'"],"diagram":"none","start":2436.94,"end":2594.66,"asr_flags":[],"math_clarifications":["原始片段中未提及任何具体的协方差矩阵计算公式，因此无法核定该公式是否正确。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":20,"raw_segments":[{"start":2436.94,"text":"this as the lowercase sigma. But I'm going to write it in the uppercase sigma because it's"},{"start":2440.18,"text":"going to make the math a little bit more transparent what goes on and eliminate a"},{"start ou this extra little bit of structure. You've got it perfectly, I think. Cool. Awesome. Other questions? Fantastic. OK. So it's all computing derivatives. Recall, we just"},{"start":2550.54,"text":"computed this stuff. This is just the definition. Xi, once I give you the cluster, this is just a fancy way to say it has that nice Gaussian shape on it. And this is the weight, the strength. This is how often we see each one of the clusters. So this is just reminding you of the model. Nothing's happened. Now, in a previous lecture, I wrote this out. Hopefully, you remember this monstrosity. What is this?"},{"start":2575.76,"text":"Yeah, it's a multivariant Gaussian distribution in all of its beautiful glory. So I try to hide this from you as long as possible, but here it rears its head. And why it rears its head is you have to compute some stuff. So we're going to compute some derivatives on this. And I'm going to do a little bit of sleight of hand to try and make it a little bit more cooking show-like so that you do it, but hopefully this makes sense."}],"speech_gaps":[],"frame":"../frames/v048/015.webp","frame_time":2448.94},{"title":"计算EM算法中的梯度与协方差矩阵","segments":[{"id":301,"text":"All right, so how are we going to do this? So to compute the value of that argmax, we have a good tool in our tool case, tool set, which is we are going to compute gradients. And we're going to look for critical points. That is, for example, for one of the parameters we want to estimate, mu j, the means, which are there, we are going to compute a derivative here. Now, from the last lecture, what I did was the cooking show version. I was like, oh, mu is probably like I weighted some stuff, and then I weighted some other stuff, and I got this expression.","zh":"好的，那么我们该如何进行呢？为了计算这个argmax的值，我们有一个很好的工具，那就是计算梯度。我们将寻找临界点。例如，对于我们要估计的一个参数μ_j（均值），我们在这里计算导数。从上一节课的内容来看，我采用了烹饪节目式的讲解。我心想，μ可能像是对某些东西加权，然后对其他东西加权，从而得到了这个表达式。","start":2595.81,"end":2623.97},{"id":302,"text":"we will get the same expression.
