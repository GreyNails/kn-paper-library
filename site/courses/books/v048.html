 am I able to take the... Why does sigma J not appear in this expression?","zh":"我得到了所有的权重。这里的权重告诉我什么？它告诉你你处于该聚类中的可能性有多大，对吧？我们已经标记了Z值，完成了这个步骤。好的，很好。因此，这个过程继续下去。我们得到了σ_j。我在这里拿出σ_j。我希望它等于什么？我大概想把这个东西设为等于什么？零。完美。然后就完成了。为什么我能对……为什么σ_j在这个表达式中没有出现？","start":2689.65,"end":2718.32},{"id":306,"text":"I get all these weights. What is the weight telling me here? It's telling you how likely you are to be in that cluster, right? We ticked the Zs, we did that. All right, cool. So that follows through. We get the sigma J. I pull out sigma J here. I want it to be equal to what? What do I probably want to set this thing equal to? Zero. Perfect. And then boom. Why am I able to take the... Why does sigma J not appear in this expression?","zh":"我得到了所有的权重。这些权重在这里告诉我什么？它告诉你你处于该聚类中的可能性有多大，对吧？我们勾选了Z值，我们已经完成了。好的，很好。因此，这会继续下去。我们得到了sigma J。我在这里拿出sigma J。我希望它等于什么？我大概想把这个设为等于什么？零。完美。然后就出现了。为什么我能够取……为什么sigma J在这个表达式中没有出现？","start":2719.31,"end":2754.62}],"notes":["本段讲解了在计算混合高斯模型（EM算法）中参数的梯度时，如何处理协方差矩阵。讲者提到，对于均值参数μ_j，需要计算其导数，并指出协方差矩阵σ_j是针对第j个中心的，表示该中心的协方差。权重表示每个数据点属于第j个簇的概率，这与Z变量有关。","讲者强调，计算梯度时，需要将对数似然函数中的项进行求导，并识别出与参数相关的项。对于μ_j，其导数的计算涉及对所有数据点的加权求和，权重由概率分布决定。而协方差矩阵σ_j在计算中可能不会直接出现，因为其导数可能为零。","讲者提到，权重表示数据点属于某个簇的概率，这与EM算法中的隐变量Z有关。在计算梯度时，权重会影响均值和协方差矩阵的更新，但协方差矩阵的导数可能为零，因此在某些情况下不会出现在最终的梯度表达式中。","讲者通过举例说明，如何处理协方差矩阵的导数问题。他指出，虽然协方差矩阵在计算中可能被涉及，但其导数可能为零，因此在某些情况下不会出现在最终的梯度表达式中。这表明在计算过程中需要仔细处理每个参数的导数。","讲者提到，计算梯度的过程虽然繁琐，但有助于理解模型的结构和参数的更新方式。通过手动计算，可以验证软件工具的正确性，并加深对EM算法的理解。","讲者最后提到，虽然手动计算梯度可能不具实用性，但通过这种方式可以更好地理解模型的内部机制，并为后续的复杂问题打下基础。"],"formulas":[],"uncertainties":["可能的术语错误：'tool case' 可能应为 'tool set' 或 'tool kit'，但根据上下文，'tool case' 可能是讲者口语化的表达，因此保留原词。"],"diagram":"none","start":2595.81,"end":2754.62,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2595.81,"text":"All right, so how are we going to do this? So to compute the value of that argmax, we have a good tool in our tool case, tool set, which is we are going to compute gradients. And we're going to look for critical points. That is, for example, for one of the parameters we want to estimate, mu j, the means, which are there, we are going to compute a derivative here. Now, from the last lecture, what I did was the cooking show version. I was like, oh, mu is probably like I weighted some stuff, and then I weighted some other stuff, and I got this expression."},{"start":2624.78,"text":"we will get the same expression. It will just be more painful. But the good thing about suffering on this thing is that you will then be able to suffer in many other instances to compute this when it's not so obvious. And you'll be able to check your work. But we're not going to do anything complicated. You're going to have to compute derivatives of mu. Again, not the most pleasant thing. And we do have software that does this for you."},{"start":2648.2,"text":"It's of questionable utility. I don't know. I don't know why me do... I guess I'm having a real-time debate of why it's valuable for me to do this with you. But I think it's to vamp so you can ask me questions. Okay? So that's my rationalization for doing this."},{"start":2661.48,"text":"Okay, so we sum, we're going to compute the derivative. We put the log in, we cross this guy out. This one has no mu j to speak of, right? So we knock that one out, computing a mu j vector. And then I've pulled out all the weights and all the rest. Maybe this should have been divided. Maybe that's a, oh no, this is this wj. Good, good, good. Okay, all right. Life is mostly good. That should have been crossed out, but it doesn't matter. Okay, now we have this character here."},{"start":2689.65,"text":"And we're going to compute mu j. Now, you've seen that character three, four times in this course already. So hopefully, this is familiar when I do the next two steps, which is I'm going to take a derivative. I'm going to get that this character, this covariance matrix is there. Why is the covariance matrix sub j? What does that mean? It's the covariance for the j-th center. So remember, we had j sources. It's the j-th one."},{"start":2719.31,"text":"I get all these weights. What is the weight telling me here? It's telling you how likely you are to be in that cluster, right? We ticked the Zs, we did that. All right, cool. So that follows through. We get the sigma J. I pull out sigma J here. I want it to be equal to what? What do I probably want to set this thing equal to? Zero. Perfect. And then boom. Why am I able to take the... Why does sigma J not appear in this expression?"}],"speech_gaps":[],"frame":"../frames/v048/016.webp","frame_time":2607.81},{"title":"EM算法与约束优化中的拉格朗日乘数","segments":[{"id":307,"text":"At the end, what was I doing here and here? Multiply both sides by sigma j. And because I can do it on the left, but because it's full rank, it means this term must be 0. If this were rank deficient, there could be non-zero elements here. So I've concluded that this thing has to identically be 0, which gets me back. Everybody more or less happy with that?","zh":"最后，我在这里和这里做了什么？两边都乘以σ_j。因为可以在左边进行操作，但由于它是满秩的，这意味着这个项必须为0。如果秩不足，这里可能会有非零元素。因此，我得出结论，这个东西必须恒等于0，这让我回到了原点。大家对这个结论还比较满意吗？","start":2755.36,"end":2789.04},{"id":308,"text":"Ask me to slow down if not. You've seen this derivation. You saw it in GDA. You saw it probably in least squares in some way. The variant that came in is we added in these weights, and the weights were tracked everywhere. This gives us exactly the thing that we intuitively reasoned about earlier. Cool. So far, so good? All right.","zh":"如果不满意，就请让我放慢速度。你们已经见过这个推导过程。你们在GDA中见过它，在最小二乘法中也见过。变化在于我们加入了这些权重，并且这些权重在各处都被跟踪。这正好是我们之前直观推理得到的结果。到目前为止，大家都还满意吗？好的。","start":2791.02,"end":2813.85},{"id":309,"text":"Okay, I want to highlight one other one for you. So the rest of this goes exactly as you would expect. I'm not going to compute the rest of the derivatives, I hope. Just checking my notes to make sure that's not a lie. So I'm not going to compute the rest of the derivatives. You can do all of them. Let me pull out one thing that seems to get you if you took calculus in high school and you forgot about calculus stuff, all the rest, is by show of hands, who remembers Lagrange multipliers?","zh":"好的，我想再强调一个点。其余的部分将完全如你所预期的那样进行。我不会计算其余的导数，我希望。我只是检查一下笔记，确保这不是谎言。因此，我不会计算其余的导数。你们都可以自己完成。让我拿出一个似乎会让你们困惑的点，如果你在高中学过微积分但忘记了相关内容，那么通过举手示意，谁还记得拉格朗日乘数法？","start":2815.91,"end":2837.73},{"id":310,"text":"Oh, awesome. Then you don't need to do any of this crap. All right, cool. All right. So Lagrange multipliers, you multiply by lambda. I can derive this for you, approve it if you want. It's not a big deal. But you have to do it when you're dealing with constraints. And the phi's are constrained. If you drop that, you'll get weird answers. You can see exactly how they'll be weird. But you would have an extra degree of freedom if you didn't put in the Lagrange multiplier.","zh":"哦，太棒了。那么你们就不需要做任何这些麻烦事了。好的，很好。好的。拉格朗日乘数法，你乘以λ。我可以为你们推导这个，你们也可以批准这个。这并不是什么大问题。但当你处理约束条件时，就必须这样做。而φ是受约束的。如果你忽略了这一点，就会得到奇怪的结果。你们可以清楚地看到这些结果会有多奇怪。但如果你没有加入拉格朗日乘数，就会多出一个自由度。","start":2838.83,"end":2862.75},{"id":311,"text":"The TAs have notes. I also have a proof of this, which I think no one cares about, but I'm happy to show you. But remember this one, since you all raised your hands, just remember that you have to do this when you have constrained variables. Cool.","zh":"助教们有笔记。我也有一份这个的证明，我认为没人关心，但我很乐意展示给你们看。但请记住这一点，因为你们都举了手，记住当你有受约束的变量时，就必须这样做。很好。","start":2864.64,"end":2878.12},{"id":312,"text":"All right. So the message is EM recovered our ad hoc algorithm. It was still the same gradients and set things to zero and all the rest. You guys got the great overarching picture, right? The great overarching picture is big L Thetas in the background. We construct these LTs. We did it in such a weird way that we could use Jensen so we could pass from the original function to this lower bound. We knew exactly when it was tight, which is how we picked these QZs that were exactly the conditional probabilities. That was another way of saying that those were our best guess of clusters given all...","zh":"好的。所以信息是EM算法恢复了我们之前设计的启发式算法。它仍然是相同的梯度，将各项设为零以及所有其他步骤。大家有没有理解到整体的框架？整体的框架是背景中的大Lθ。我们构造了这些LT。我们以一种奇怪的方式这样做，以便能够使用Jensen不等式，从而从原始函数转移到这个下界。我们知道什么时候这个下界是紧的，这正是我们选择这些QZs的方式，这些QZs恰好是条件概率。这也意味着这些是我们根据所有信息对聚类的最佳猜测。","start":2879.34,"end":2908.68}],"notes":["本段主要讨论了在推导过程中如何通过矩阵的满秩性来证明某个项必须为零。讲者指出，如果矩阵是满秩的，那么该项必须为零，否则如果矩阵秩不足，可能会有非零元素。这表明在推导过程中，矩阵的秩是一个关键条件。","讲者提到，这种推导方法在广义线性模型（GDA）和最小二乘法中都有出现，但在这里加入了权重项，并且这些权重项在推导过程中被跟踪。这使得推导结果与之前直观推理的结果一致。","讲者强调了拉格朗日乘数法在处理约束优化问题中的重要性。当变量受到约束时，必须使用拉格朗日乘数法，否则会导致结果异常。讲者还提到，如果不使用拉格朗日乘数法，会引入额外的自由度。","讲者指出，EM算法实际上恢复了之前提出的启发式算法，其核心仍然是计算梯度并将其设为零。讲者还提到，EM算法通过构造一个下界函数，并利用Jensen不等式来推导出该下界，从而实现优化。","讲者强调了在处理约束变量时必须使用拉格朗日乘数法，否则会导致结果不准确。讲者还提到，EM算法通过构造这些下界函数，并利用Jensen不等式来推导出该下界，从而实现优化。","讲者总结了EM算法的核心思想，即通过构造一个下界函数，并利用Jensen不等式来推导出该下界，从而实现优化。这表明EM算法是一种有效的优化方法，能够处理复杂的约束条件。"],"formulas":[{"latex":"Lagrange \\text{ multipliers} \\rightarrow \\text{constraint handling}","symbols":"拉格朗日乘数用于处理约束条件","explanation":"该公式正确表达了拉格朗日乘数用于处理约束条件的数学概念，无需修改。","evidence":"Oh, awesome. Then you don't need to do any of this crap. All right, cool. All right. So Lagrange multipliers, you multiply by lambda. I can derive this for you, approve it if you want. It's not a big deal. But you have to do it when you're dealing with constraints. And the phi's are constrained. If you drop that, you'll get weird answers. You can see exactly how they'll be weird. But you would have an extra degree of freedom if you didn't put in the Lagrange multiplier."}],"uncertainties":[],"diagram":"none","start":2755.36,"end":2908.68,"asr_flags":[],"math_clarifications":["公式0和公式2缺少具体的数学表达式，无法判断其数学含义，因此移除。公式1正确表达了拉格朗日乘数用于处理约束条件的数学概念，无需修改。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2755.36,"text":"At the end, what was I doing here and here? Multiply both sides by sigma j. And because I can do it on the left, but because it's full rank, it means this term must be 0. If this were rank deficient, there could be non-zero elements here. So I've concluded that this thing has to identically be 0, which gets me back. Everybody more or less happy with that?"},{"start":2791.02,"text":"Ask me to slow down if not. You've seen this derivation. You saw it in GDA. You saw it probably in least squares in some way. The variant that came in is we added in these weights, and the weights were tracked everywhere. This gives us exactly the thing that we intuitively reasoned about earlier. Cool. So far, so good? All right."},{"start":2815.91,"text":"Okay, I want to highlight one other one for you. So the rest of this goes exactly as you would expect. I'm not going to compute the rest of the derivatives, I hope. Just checking my notes to make sure that's not a lie. So I'm not going to compute the rest of the derivatives. You can do all of them. Let me pull out one thing that seems to get you if you took calculus in high school and you forgot about calculus stuff, all the rest, is by show of hands, who remembers Lagrange multipliers?"},{"start":2838.83,"text":"Oh, awesome. Then you don't need to do any of this crap. All right, cool. All right. So Lagrange multipliers, you multiply by lambda. I can derive this for you, approve it if you want. It's not a big deal. But you have to do it when you're dealing with constraints. And the phi's are constrained. If you drop that, you'll get weird answers. You can see exactly how they'll be weird. But you would have an extra degree of freedom if you didn't put in the Lagrange multiplier."},{"start":2864.64,"text":"The TAs have notes. I also have a proof of this, which I think no one cares about, but I'm happy to show you. But remember this one, since you all raised your hands, just remember that you have to do this when you have constrained variables. Cool."},{"start":2879.34,"text":"All right. So the message is EM recovered our ad hoc algorithm. It was still the same gradients and set things to zero and all the rest. You guys got the great overarching picture, right? The great overarching picture is big L Thetas in the background. We construct these LTs. We did it in such a weird way that we could use Jensen so we could pass from the original function to this lower bound. We knew exactly when it was tight, which is how we picked these QZs that were exactly the conditional probabilities. That was another way of saying that those were our best guess of clusters given all..."}],"speech_gaps":[],"frame":"../frames/v048/017.webp","frame_time":2767.36},{"title":"混合高斯模型（EM）与主成分分析","segments":[{"id":313,"text":"all the information we have. So there's a sense in which you're just using Bayes' rule, and you're like, oh, that's simple. But that's also reassuring. You're not doing something outside the bounds. You're just saying, given my current guess of parameters, this is my best guess of the clustering. And then I go back and forth. It's just formalizing exactly what you saw in k-means, exactly what you saw in other places. Cool. Awesome. Time to move to our last topic. Principal components.","zh":"我们所拥有的所有信息。因此，从某种意义上说，你只是在使用贝叶斯法则，你会想，哦，这很简单。但这也很令人安心。你没有做超出范围的事情。你只是说，根据我当前对参数的猜测，这是我对聚类的最佳猜测。然后我来回切换。它正是你在k均值算法中看到的，也是你在其他地方看到的。酷。太棒了。现在是时候转向我们最后一个主题了。主成分分析。","start":2908.69,"end":2936.1},{"id":314,"text":"Right. As I mentioned, PCA is a workhorse. It's often misapplied, but that's only because it's applied so often. People use this everywhere. It's a very good dimensionality reduction technique. Sometimes you can use it to visualize your data. Sometimes people use it for featurization. It has all kinds of uses that people have tried for it. I'm going to try and motivate the components for it right now. I found it to be something that I use quite frequently, candidly. I just run PCA. And you can compute it much cheaper than you...","zh":"对的。正如我之前提到的，主成分分析（PCA）是一种常用的方法。它经常被误用，但这只是因为它被应用得如此频繁。人们在各个领域都使用它。它是一种非常好的降维技术。有时你可以用它来可视化你的数据。有时人们用它来进行特征提取。它有各种各样的用途，人们都尝试过。我现在将尝试为它推导出主成分。坦白说，我发现它是我经常使用的一种方法。我只需运行PCA。而且你可以在比你意识到的更便宜的成本上计算它，甚至在大数据集上也是如此。因此，即使在大型数据集上，你也可以以合理高效的方式计算出所谓的薄PCA。好的。现在我们来看看这些数据。我们被给予汽车，我们将拥有这些汽车的成对数据。好的。所以这里的思路是，哦，这不是一个非常好的坐标轴。这是城市英里每加仑。","start":2937.83,"end":2964.35},{"id":315,"text":"realize, even on big data sets. So it's like, even on large data sets, you can compute a PCA, a small, what's called a thin PCA reasonably efficiently. All right. So here's the data that we have. So we're given cars and we're going to have, we're given pairs of these cars. Okay. And so the idea here is we have, oops, not a very good axis. This is going to be city miles per gallon.","zh":"高速公路。我必须说，我真的喜欢内燃机汽车。所以如果你是电动车爱好者，我可能无意中冒犯了你，不过没关系。我喜欢发动机的声音。不管怎样，这无关紧要。只是一个小小的事实。好的，回到这个话题。好的，下面是什么样的汽车？什么样的汽车在高速公路上的英里每加仑表现很差？","start":2965.42,"end":2995.49},{"id":316,"text":"Highway. I have to say, I really like ICE cars. So if you're an EV person, I don't mean to offend you, I guess. But I like the way an engine sounds. Anyway, neither here nor there. Just a small fact. All right, back to this. OK, so down here are what kind of cars? What kind of cars have terrible highway miles per gallon?","zh":"这是一个关于世界的普遍事实，而不是机器学习的事实。这些是SUV、卡车之类的东西。好极了。然后你有一系列经济型汽车在这里和那里。你有这些混合动力汽车在这里，它们的英里每加仑表现非常出色。现在，其中一些汽车因为城市与高速公路的不同，有些在高速公路上的英里每加仑表现相当不错，但在城市中的表现并不出色。正如我所说，这些汽车，我不知道，可能是混合动力汽车。","start":2998.85,"end":3018.84},{"id":317,"text":"This is a general fact about the world. It's not a machine learning fact. These are SUVs, trucks, things like that. Good enough. Then you have a bunch of economy cars there and here. You have these hybrids over here, which have great miles per gallon. Now, a couple of these things, because they're city versus highway, some have pretty good highway miles per gallon, but not great city miles per gallon. As I said, these characters, I don't know, these are hybrids maybe.","zh":"这是一个关于世界的普遍事实。这不是一个机器学习的事实。这些都是SUV、卡车之类的东西。已经足够好了。然后你在那里和这里有一堆经济型轿车。你在这里有这些混合动力车，它们的每加仑英里数很高。现在，其中一些车辆，因为它们是城市与高速公路的不同用途，有些具有相当不错的高速公路每加仑英里数，但城市每加仑英里数并不出色。正如我所说，这些车辆，我也不确定，也许它们是混合动力车。","start":3019.5,"end":3039.94},{"id":318,"text":"This doesn't really matter. I don't know why I insist on telling you these stories, but you know, these are, that's a terrible color. These are SUVs, okay? All right.","zh":"这其实并不重要。我不知道为什么我坚持要告诉你这些故事，但你知道的，这些颜色真的很糟糕。这些都是SUV，好吧。好的。","start":3040.92,"end":3049.32},{"id":319,"text":"All right. We're very happy with ourselves. All right. So the question we're after is, give me the principal component. That's the way we're going to phrase it. By the way, this is one of those annoying terms. If you hang out with machine learning people too much, they'll say things like the ideas are orthogonal all the time. It's very irritating, but they'll say that. They'll also talk about the principal component of how we're selling something. They mean this. But they don't usually use it correctly. So it doesn't really matter. Now, intuitively,","zh":"好的。我们对自己很满意。好的。我们的问题是，给我主成分。这就是我们要表达的方式。顺便说一句，这是一个令人讨厌的术语。如果你和太多机器学习的人打交道，他们会经常说一些像‘这些想法总是正交的’这样的话。这非常令人恼火，但他们确实会这么说。他们也会谈论我们如何销售某样东西的主成分。他们指的是这个意思。但他们通常不会正确使用这个词。所以其实并不重要。现在，从直觉上来说，","start":3049.89,"end":3075.51}],"notes":["本段主要讲解主成分分析（PCA）的基本概念和应用场景。讲者指出PCA是一种常用的降维技术，广泛应用于数据可视化和特征提取。他提到PCA的计算效率较高，即使在大数据集上也能有效运行。此外，讲者还通过汽车数据集举例说明了PCA的直观意义，即寻找数据中最重要的方向（主成分）。","讲者通过汽车数据集的实例，说明了不同类型的汽车在城市和高速行驶中的燃油效率差异。SUV和卡车通常具有较差的高速燃油效率，而经济型车和混合动力车则表现较好。这种差异为PCA的主成分分析提供了直观的背景。","讲者指出，PCA的主成分是数据中最重要的方向，能够捕捉数据的主要变化。他提到，虽然机器学习领域中“主成分”这一术语被频繁使用，但有时使用不当，因此需要明确其定义。","讲者强调，PCA的计算效率较高，即使在大规模数据集上也能有效运行。他提到“thin PCA”是一种计算效率较高的方法，适用于实际应用。","讲者通过汽车数据集的实例，说明了PCA的直观意义，即寻找数据中最重要的方向（主成分）。他指出，虽然PCA在机器学习中被广泛使用，但有时使用不当，因此需要明确其定义。","讲者提到，PCA的主成分是数据中最重要的方向，能够捕捉数据的主要变化。他指出，虽然机器学习领域中“主成分”这一术语被频繁使用，但有时使用不当，因此需要明确其定义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2908.69,"end":3075.51,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2908.69,"text":"all the information we have. So there's a sense in which you're just using Bayes' rule, and you're like, oh, that's simple. But that's also reassuring. You're not doing something outside the bounds. You're just saying, given my current guess of parameters, this is my best guess of the clustering. And then I go back and forth. It's just formalizing exactly what you saw in k-means, exactly what you saw in other places. Cool. Awesome. Time to move to our last topic. Principal components."},{"start":2937.83,"text":"Right. As I mentioned, PCA is a workhorse. It's often misapplied, but that's only because it's applied so often. People use this everywhere. It's a very good dimensionality reduction technique. Sometimes you can use it to visualize your data. Sometimes people use it for featurization. It has all kinds of uses that people have tried for it. I'm going to try and motivate the components for it right now. I found it to be something that I use quite frequently, candidly. I just run PCA. And you can compute it much cheaper than you..."},{"start":2965.42,"text":"realize, even on big data sets. So it's like, even on large data sets, you can compute a PCA, a small, what's called a thin PCA reasonably efficiently. All right. So here's the data that we have. So we're given cars and we're going to have, we're given pairs of these cars. Okay. And so the idea here is we have, oops, not a very good axis. This is going to be city miles per gallon."},{"start":2998.85,"text":"Highway. I have to say, I really like ICE cars. So if you're an EV person, I don't mean to offend you, I guess. But I like the way an engine sounds. Anyway, neither here nor there. Just a small fact. All right, back to this. OK, so down here are what kind of cars? What kind of cars have terrible highway miles per gallon?"},{"start":3019.5,"text":"This is a general fact about the world. It's not a machine learning fact. These are SUVs, trucks, things like that. Good enough. Then you have a bunch of economy cars there and here. You have these hybrids over here, which have great miles per gallon. Now, a couple of these things, because they're city versus highway, some have pretty good highway miles per gallon, but not great city miles per gallon. As I said, these characters, I don't know, these are hybrids maybe."},{"start":3040.92,"text":"This doesn't really matter. I don't know why I insist on telling you these stories, but you know, these are, that's a terrible color. These are SUVs, okay? All right."},{"start":3049.89,"text":"All right. We're very happy with ourselves. All right. So the question we're after is, give me the principal component. That's the way we're going to phrase it. By the way, this is one of those annoying terms. If you hang out with machine learning people too much, they'll say things like the ideas are orthogonal all the time. It's very irritating, but they'll say that. They'll also talk about the principal component of how we're selling something. They mean this. But they don't usually use it correctly. So it doesn't really matter. Now, intuitively,"}],"speech_gaps":[],"frame":"../frames/v048/018.webp","frame_time":2920.69},{"title":"主成分分析（PCA）的中心化与方向选择","segments":[{"id":320,"text":"We kind of want to find out this direction, right? That looks like the kind of direction of there. So how do we pick that direction or vector? And that's what we're going to get out. We want to know the direction of kind of maximal things. On this data set, hopefully it's pretty easy to see. There's some cars that are better at burning gas efficiently and some that are poor at doing it. We want to pull that axis out. Okay.","zh":"我们基本上想找出这个方向，对吧？看起来这就是那个方向。那么我们如何选择这个方向或向量呢？这就是我们要得到的结果。我们想要知道那些最大变化的方向。在这个数据集上，希望很容易看出。有些车在燃油效率方面表现更好，有些则表现较差。我们想要提取出这个轴。好的。","start":3076.45,"end":3097.27},{"id":321,"text":"So what we're going to do is we're going to center the data. That's the terminology. And this is what","zh":"因此，我们将对数据进行中心化。这是术语。这就是","start":3098.19,"end":3102.09},{"id":322,"text":"centering means. We're going to take this data back and we're going to move it to the origin.","zh":"中心化意味着什么。我们将把数据带回并将其移动到原点。","start":3102.09,"end":3105.81},{"id":323,"text":"And the reason is, is that we're going to think about PCA is going to look for","zh":"原因在于，我们将认为PCA会寻找","start":3105.95,"end":3109.49},{"id":324,"text":"the directions of maximal variance. And so this is basically making sure that our data intuitively","zh":"最大方差的方向。因此，这基本上是在确保我们的数据直观上","start":3109.49,"end":3114.67},{"id":325,"text":"has zero mean. This is operationally why we're doing it is to make the math work, but we'll see.","zh":"具有零均值。我们这样做的操作性原因是让数学计算可行，但我们会看到。","start":3114.67,"end":3119.55},{"id":326,"text":"Alright, so we take all of them, we add them up, and I think the mean is somewhere around here.","zh":"好的，我们把所有数据加起来，我认为均值大约在这里。","start":3119.73,"end":3122.93},{"id":327,"text":"So let's see if I can draw that thing here. So we're going to draw these axes.","zh":"那么让我看看能否在这里画出这个东西。我们将画出这些坐标轴。","start":3123.11,"end":3126.65},{"id":328,"text":"these oops well whatever things happen we did we it was fun while it lasted","zh":"这些啊，不管发生什么，我们已经做了，它持续了一段时间还挺有趣的","start":3126.65,"end":3132.15},{"id":329,"text":"alright so here is our new mean we just shifted everything okay I don't have a","zh":"好的，这是我们新的均值，我们刚刚把所有数据都移动了一下，嗯，我没有什么","start":3132.15,"end":3138.53},{"id":330,"text":"great animation but you should just picture it shifting all back to zero","zh":"很棒的动画，但你应该想象一下，所有数据都移回到零点","start":3138.53,"end":3141.23},{"id":331,"text":"via this transformation okay so this is now mu I should try I took the original","zh":"通过这个变换，好的，现在这是mu，我应该尝试，我用了原始数据，我应该减去了它，这就是我所做的，听起来对吧","start":3141.23,"end":3145.23},{"id":332,"text":"data and I should I subtracted it off and that's what I did sound good right","zh":"现在，问题将会是，","start":3145.23,"end":3151.05},{"id":333,"text":"Now, the problem will be,","zh":"正如我们将要看到的，如果我们没有捕捉到，","start":3151.05,"end":3155.51},{"id":334,"text":"as we'll see, if we don't capture,","zh":"这仅仅是一些生成的数据，","start":3155.55,"end":3157.97},{"id":335,"text":"this is just some generated data,","zh":"这只是一个生成的数据，","start":3158.09,"end":3159.41},{"id":336,"text":"if we don't center,","zh":"如果我们不进行中心化，","start":3159.57,"end":3160.65},{"id":337,"text":"then we're going to get these weird variations","zh":"我们会得到这些奇怪的变化","start":3160.83,"end":3162.99},{"id":338,"text":"that they're going to point towards the mean of","zh":"它们会指向簇的均值，而不是变化的方向。","start":3163.57,"end":3165.11},{"id":339,"text":"the cluster instead of the components of variation.","zh":"所以如果你看这里，","start":3165.11,"end":3166.87},{"id":340,"text":"So if you look here,","zh":"这个特征沿着这个轴变化，","start":3167.41,"end":3168.23},{"id":341,"text":"this character varies along this axis,","zh":"但由于它离得非常远，","start":3168.39,"end":3171.51},{"id":342,"text":"but because it's way far away,","zh":"你就会计算出错误的向量。","start":3171.83,"end":3174.87},{"id":343,"text":"you just compute the wrong vectors.","zh":"你只是计算了错误的向量。","start":3175.01,"end":3179.09},{"id":344,"text":"vectors. So this is just to say like if you don't center, it will go wrong.","zh":"向量。所以这只是在说，如果你不进行中心化，就会出错。","start":3179.09,"end":3184.05},{"id":345,"text":"that the data are centered and that's going to be important in all of our analysis as","zh":"数据已经被中心化，这将在我们所有分析中都很重要，","start":3184.05,"end":3187.47},{"id":346,"text":"we think through it, that the data are mean zero. So often people will run what look like","zh":"当我们逐步思考时，数据的均值为零。因此，人们常常运行看起来像PCA计算的过程，却忘记对数据进行中心化，从而导致问题。好的，明白了。","start":3187.47,"end":3191.35},{"id":347,"text":"a PCA computation, forget to center their data, and they'll have a problem. Okay, cool.","zh":"好的，那么接下来我们将怎么做。","start":3191.35,"end":3196.41},{"id":348,"text":"All right, so here's how it's going to be.","zh":"这是我们之前画的图。我们将尝试找到两个单位向量，u1和u2。它们将是单位向量，u直观上是第一个主成分。我会更精确地定义这一点，但它将试图捕捉数据集中最大的变化量。然后mu2将捕捉数据集中的第二变化量，mu3，依此类推。","start":3197.79,"end":3201.39},{"id":349,"text":"Here's our drawing from before. What we're going to try and do is we're going to try and find two unit vectors, u1 and u2. They're going to be unit vectors, and u is going to be intuitively the first principal component. I'll make this precise, but it's going to try and capture the maximum amount of variation in the dataset. Then mu2 is going to capture the second amount of variation in the dataset, mu3, and so on.","zh":"这是我们之前画的图。我们想要尝试做的事情是找到两个单位向量u1和u2。它们将是单位向量，而u直观上将是第一个主成分。我会对此进行精确定义，但它的目标是捕捉数据集中最大的变化量。然后mu2将捕捉数据集中的第二变化量，mu3，依此类推。","start":3202.1,"end":3225.02},{"id":350,"text":"Intuitively, these are going to look like eigenvalues of a particular matrix. In fact, we'll show that in a second. That's basically what they're capturing of the underlying PSD matrix. Now recall, when we do our analysis and derive this, that any point can be written in an orthogonal basis in those coordinates. So if I have u1 and u2 that are indeed those orthogonal unit vectors, so it's an orthonormal basis, I can write alpha1 and alpha2 to exactly recover x.","zh":"直观上，这些将类似于某个特定矩阵的特征值。事实上，我们稍后将展示这一点。它们基本上捕捉了底层半正定矩阵的变化。现在回想一下，当我们进行分析并推导出这一点时，任何点都可以在这些坐标下的正交基中表示。因此，如果我确实有u1和u2作为这些正交单位向量，即构成一个正交基，那么我可以使用alpha1和alpha2精确地恢复x。","start":3225.83,"end":3252.07}],"notes":["在中心化之后，PCA的目标是找到两个单位向量u1和u2，它们分别对应于数据集中的最大和次大的变异方向。u1是第一个主成分，u2是第二个主成分，以此类推。","讲者指出，这些主成分向量可以看作是某个特定矩阵的特征值。这些特征值对应于数据的协方差矩阵的特征值，而这些特征值反映了数据在不同方向上的变异程度。","最后，讲者提到，任何数据点都可以在由这些正交单位向量构成的正交基下表示。这意味着，通过这些主成分向量，可以准确地重构原始数据点。","讲者强调，中心化是PCA分析中的关键步骤，如果忽略中心化，可能会导致PCA结果的错误，因此在实际应用中必须注意这一点。"],"formulas":[{"latex":"u_1, u_2, \\text{...} \\text{ are orthonormal vectors}","symbols":"u1, u2, ... 是正交单位向量","explanation":"公式中的符号和数学类型正确，描述了正交单位向量，适用于PCA中寻找主成分的正交基底。","evidence":"Here's our drawing from before. What we're going to try and do is we're going to try and find two unit vectors, u1 and u2. They're going to be unit vectors, and u is going to be intuitively the first principal component. I'll make this precise, but it's going to try and capture the maximum amount of variation in the dataset. Then mu2 is going to capture the second amount of variation in the dataset, mu3, and so on."},{"latex":"X = \\text{centered data matrix}","symbols":"X 表示中心化后的数据矩阵","explanation":"公式中的符号和数学类型正确，描述了中心化后的数据矩阵，适用于PCA的数学推导。","evidence":"centering means. We're going to take this data back and we're going to move it to the origin. has zero mean. This is operationally why we're doing it is to make the math work, but we'll see."}],"uncertainties":["the problem will be","if we don't capture","this is just some generated data","if we don't center","that they're going to point towards the mean of"],"diagram":"none","start":3076.45,"end":3252.07,"asr_flags":[],"math_clarifications":["原文中提到的PCA过程需要中心化数据，以确保数学推导的正确性，但未提供具体的数学公式或推导过程。"],"translation_complete":true,"translated_segments":31,"raw_segments":[{"start":3076.45,"text":"We kind of want to find out this direction, right? That looks like the kind of direction of there. So how do we pick that direction or vector? And that's what we're going to get out. We want to know the direction of kind of maximal things. On this data set, hopefully it's pretty easy to see. There's some cars that are better at burning gas efficiently and some that are poor at doing it. We want to pull that axis out. Okay."},{"start":3098.19,"text":"So what we're going to do is we're going to center the data. That's the terminology. And this is what"},{"start":3102.09,"text":"centering means. We're going to take this data back and we're going to move it to the origin."},{"start":3105.95,"text":"And the reason is, is that we're going to think about PCA is going to look for"},{"start":3109.49,"text":"the directions of maximal variance. And so this is basically making sure that our data intuitively"},{"start":3114.67,"text":"has zero mean. This is operationally why we're doing it is to make the math work, but we'll see."},{"start":3119.73,"text":"Alright, so we take all of them, we add them up, and I think the mean is somewhere around here."},{"start":3123.11,"text":"So let's see if I can draw that thing here. So we're going to draw these axes."},{"start":3126.65,"text":"these oops well whatever things happen we did we it was fun while it lasted"},{"start":3132.15,"text":"alright so here is our new mean we just shifted everything okay I don't have a"},{"start":3138.53,"text":"great animation but you should just picture it shifting all back to zero"},{"start":3141.23,"text":"via this transformation okay so this is now mu I should try I took the original"},{"start":3145.23,"text":"data and I should I subtracted it off and that's what I did sound good right"},{"start":3151.05,"text":"Now, the problem will be,"},{"start":3155.55,"text":"as we'll see, if we don't capture,"},{"start":3158.09,"text":"this is just some generated data,"},{"start":3159.57,"text":"if we don't center,"},{"start":3160.83,"text":"then we're going to get these weird variations"},{"start":3163.57,"text":"that they're going to point towards the mean of"},{"start":3165.11,"text":"the cluster instead of the components of variation."},{"start":3167.41,"text":"So if you look here,"},{"start":3168.39,"text":"this character varies along this axis,"},{"start":3171.83,"text":"but because it's way far away,"},{"start":3175.01,"text":"you just compute the wrong vectors."},{"start":3179.09,"text":"vectors. So this is just to say like if you don't center, it will go wrong. So we assume"},{"start":3184.05,"text":"that the data are centered and that's going to be important in all of our analysis as"},{"start":3187.47,"text":"we think through it, that the data are mean zero. So often people will run what look like"},{"start":3191.35,"text":"a PCA computation, forget to center their data, and they'll have a problem. Okay, cool."},{"start":3197.79,"text":"All right, so here's how it's going to be."},{"start":3202.1,"text":"Here's our drawing from before. What we're going to try and do is we're going to try and find two unit vectors, u1 and u2. They're going to be unit vectors, and u is going to be intuitively the first principal component. I'll make this precise, but it's going to try and capture the maximum amount of variation in the dataset. Then mu2 is going to capture the second amount of variation in the dataset, mu3, and so on."},{"start":3225.83,"text":"Intuitively, these are going to look like eigenvalues of a particular matrix. In fact, we'll show that in a second. That's basically what they're capturing of the underlying PSD matrix. Now recall, when we do our analysis and derive this, that any point can be written in an orthogonal basis in those coordinates. So if I have u1 and u2 that are indeed those orthogonal unit vectors, so it's an orthonormal basis, I can write alpha1 and alpha2 to exactly recover x."}],"speech_gaps":[],"frame":"../frames/v048/019.webp","frame_time":3088.45},{"title":"主成分分析（PCA）的预处理与方向选择","segments":[{"id":351,"text":"Now, when we're in high dimensions, we can write a huge string of them, one per dimension. We're often going to chop them off and take the top three, and we're going to have to pick which of those components we want. The question we have now are, how do we find those directions? I'll tell you about some caveats about how to use this, and then we'll talk about reducing dimensions, like 1,000 down to 10.","zh":"现在，在高维空间中，我们可以写出一串很长的特征，每个维度一个。我们通常会将它们截断，只保留前三个，然后我们必须决定要选择哪些成分。现在的问题是，我们如何找到这些方向？我会告诉你一些关于如何使用这些方法的注意事项，然后我们会讨论如何降维，例如将1,000维降到10维。","start":3252.89,"end":3274.79},{"id":352,"text":"Now, one other bit of pre-processing is this kind of re-scaling behavior that we have.","zh":"另一个预处理步骤是这种重新缩放的行为。","start":3279.39,"end":3283.57},{"id":353,"text":"And I'll kind of illustrate it here because I want to give you caveats that are useful to you","zh":"我在这里会稍微说明一下，因为我想要给你们一些有用的注意事项。","start":3283.87,"end":3287.97},{"id":354,"text":"So, the other pre-processing we will typically do is we will re-scale the data.","zh":"因此，我们通常会进行的另一个预处理步骤是重新缩放数据。","start":3287.97,"end":3293.43},{"id":355,"text":"So, if we have X1 to Xn that are in RD, we first center the data. So, we remove the mean.","zh":"因此，如果我们有在RD中的X1到Xn，我们首先会进行中心化处理，也就是去除均值。","start":3293.53,"end":3299.01},{"id":356,"text":"And then two, we then re-scale the data so that if we had things like feet per gallon or miles","zh":"其次，我们会重新缩放数据，以便像每加仑英里数或每加仑英尺数这样的单位，我们实际上会进行相应的处理。","start":3299.83,"end":3305.73},{"id":357,"text":"gallon, we actually do it. Now, the way we do that is we compute the variance per component,","zh":"我们这样做的方式是计算每个成分的方差，然后将它们按方差进行缩放。这样它们在尺度上大致相同。","start":3305.73,"end":3310.71},{"id":358,"text":"and we scale them by the variance. So they all have about the same scale on them.","zh":"我们这样做的方式是计算每个成分的方差，然后将它们按方差进行缩放。这样它们在尺度上大致相同。","start":3310.83,"end":3315.17},{"id":359,"text":"If you had feet versus miles, you would unfortunately think that miles was a huge","zh":"如果你用英尺和英里来比较，你可能会不幸地认为英里是变化的一个巨大成分。","start":3315.25,"end":3320.09},{"id":360,"text":"component of variation. Or feet was a huge component of variation because there's so many","zh":"或者英尺是变化的一个巨大成分，因为英尺的数量很多。","start":3320.09,"end":3324.25},{"id":361,"text":"feet. It's pushed out in a huge number. And so you would get that incorrectly. So you normalize","zh":"它会被推得非常大，因此你会得到错误的结论。所以你需要进行标准化，使得给定坐标的距离大致相同。请。","start":3324.25,"end":3329.69},{"id":362,"text":"so they're all about the same distance for the coordinates that you're given. Please.","zh":"抱歉，刚才只是几页之前。你能解释一下你所说的U2是第二个大致差异是什么意思吗？","start":3329.69,"end":3334.05},{"id":363,"text":"Sorry, just a couple slides back. Can you explain what you mean by","zh":"哦，U2。","start":3334.81,"end":3338.01},{"id":364,"text":"U2 is the second roughly the difference?","zh":"是的，U2将是变化的第二个成分。在这里，它将是","start":3338.71,"end":3340.59},{"id":365,"text":"Oh, U2.","zh":"哦，U2。","start":3341.01,"end":3341.61},{"id":366,"text":"Yeah, so U2 is going to be the second component of variation. So here, what it's going to be is","zh":"是的，所以U2将是变化的第二个成分。因此，这里它将是","start":3341.89,"end":3347.05},{"id":367,"text":"it's going to be in the example. So that was
