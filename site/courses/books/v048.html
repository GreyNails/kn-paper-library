the data, we dot it into xi squared, and we try and maximize that quantity. This says as I sweep u through it,"}],"speech_gaps":[],"frame":"../frames/v048/022.webp","frame_time":3603.61},{"title":"主成分分析中的特征向量与特征值","segments":[{"id":388,"text":"I try and find the direction that hits as many of the Xi's as possible in my data. That's why if some of the Xi's had really big scalar values, they would contribute quite a bit to this, like that feet example where all of a sudden they're all multiplied by approximately 5,000. That would make them skew a lot in that direction. That's why we have to compensate earlier by normalization. This term also looks a heck of a lot like a covariance matrix."},{"id":389,"text":"And we'll build that up in a second. You can also minimize a residual. So let's look at some linear algebra to solve this character in general. Clear enough? Right. Now, by show of hands, who remembers eigenvalue decompositions? Which matrices have them? All matrices? No matrices? What? Symmetric. Yeah, yeah. If someone asks you, there are notions of eigenvalues for non-symmetric matrices, you should run from them."},{"id":390,"text":"They're weird. Anyway, for our point of view, everything's symmetric, so it doesn't matter. So A is a symmetric and square matrix. Then there exists these two characters who have the following properties. Lambda U transpose equals A. So decomposition. These characters are orthonormal. That is, they equal I. And they're unit normalized. And lambda is a diagonal."},{"id":391,"text":"Those lambdas, the lambda i's, little lambda i's that are on the diagonal are the eigenvalues. And by convention, we order them in this way. So you'll typically sort them, principal eigenvalue down to the rest. If you recall, every eigenvalue is associated with an eigenvector. That eigenvector is the ui, is the eigenvector associated with lambda i. And this is just showing you that if you multiply a times ui,"},{"id":392,"text":"So you have A times Ui. This character is going to be exactly Ei, which is the standard basis, times lambda, which is then going to give you a lambda i because that's the only term that survived. Boom, boom, boom. All done. And then you get back lambda of Ui. So it just says A times Ui equals lambda of Ui. This is the traditional eigenvalue equation, the pencil equation."}],"notes":["本段讲解了主成分分析（PCA）中寻找数据主要方向的过程，强调了数据中异常大的标量值可能对方向产生显著影响，因此需要提前进行归一化处理。同时，指出该过程与协方差矩阵的结构相似。","讲者提到特征值分解（eigenvalue decomposition）的概念，指出对称矩阵具有特征值和特征向量的分解形式，并强调对称性在PCA中的重要性。","讲者进一步解释了特征值和特征向量的定义，指出特征值是矩阵对角线上的元素，特征向量是与之对应的正交向量，并说明了特征值的排序方式。","讲者通过矩阵与特征向量相乘的示例，展示了特征值方程的成立，即矩阵乘以特征向量等于特征值乘以该特征向量，这是特征值问题的核心定义。"],"formulas":[],"uncertainties":["The phrase 'these two characters' may refer to eigenvalues and eigenvectors, but the exact meaning is ambiguous."],"diagram":"none","start":3758.49,"end":3914.19,"asr_flags":[],"math_clarifications":["在原始文本中提到的特征值被错误地表示为 θ_i，应更正为 λ_i。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3758.49,"text":"I try and find the direction that hits as many of the Xi's as possible in my data. That's why if some of the Xi's had really big scalar values, they would contribute quite a bit to this, like that feet example where all of a sudden they're all multiplied by approximately 5,000. That would make them skew a lot in that direction. That's why we have to compensate earlier by normalization. This term also looks a heck of a lot like a covariance matrix."},{"start":3789.64,"text":"And we'll build that up in a second. You can also minimize a residual. So let's look at some linear algebra to solve this character in general. Clear enough? Right. Now, by show of hands, who remembers eigenvalue decompositions? Which matrices have them? All matrices? No matrices? What? Symmetric. Yeah, yeah. If someone asks you, there are notions of eigenvalues for non-symmetric matrices, you should run from them."},{"start":3821.98,"text":"They're weird. Anyway, for our point of view, everything's symmetric, so it doesn't matter. So A is a symmetric and square matrix. Then there exists these two characters who have the following properties. Lambda U transpose equals A. So decomposition. These characters are orthonormal. That is, they equal I. And they're unit normalized. And lambda is a diagonal."},{"start":3856.89,"text":"Those lambdas, the lambda i's, little lambda i's that are on the diagonal are the eigenvalues. And by convention, we order them in this way. So you'll typically sort them, principal eigenvalue down to the rest. If you recall, every eigenvalue is associated with an eigenvector. That eigenvector is the ui, is the eigenvector associated with lambda i. And this is just showing you that if you multiply a times ui,"},{"start":3885.05,"text":"So you have A times Ui. This character is going to be exactly Ei, which is the standard basis, times lambda, which is then going to give you a lambda i because that's the only term that survived. Boom, boom, boom. All done. And then you get back lambda of Ui. So it just says A times Ui equals lambda of Ui. This is the traditional eigenvalue equation, the pencil equation. All right. So again, evoking pictures you've seen earlier in this course, phenomenal plot lib pictures."}],"speech_gaps":[],"frame":"../frames/v048/023.webp","frame_time":3770.49},{"title":"主成分分析中的预处理与缺失数据处理","segments":[{"id":393,"text":"If you have all the eigenvalues, one, you get something that kind of looks unit circle-like, the stretch. This is the level sets of the linear function. And you get these nice ellipses if you make them tilted in some way. OK? Please. Two questions. One, are we doing a z-scoring for each one of the values? And two, what do we do with missing data?"},{"id":394,"text":"Yeah, wonderful question. So the question is, are we going to do a z-scoring here? You don't need to. It's a nice pre-processing technique. Here, what we're doing to make everything go through are basically two pieces, which is we're sliding back to the origin so that we actually don't have that problem where there's something off in this direction. We just get the direction to the body rather than the component of variation. Think about this as, as I said, it's the variation distance. So that is quite important."},{"id":395,"text":"The second one that I highlighted is, if you have different scales, you typically will normalize them by taking the empirically variance in that direction and scaling them. So that one unit of variance in one direction means the same as another unit of variance in the other direction, roughly speaking. This is important in data and comes up quite a bit. It's actually technically not necessary. Neither of them are necessary. If you're asking, are there other pre-processing techniques that you could use to indeed get better or more confident answers from them? Absolutely. But these are the basics."},{"id":396,"text":"that you need that people seem to run into most of the time. And what was your second question? Sorry. Oh, missing data. Yeah, this doesn't do anything about missing data. If you have a data imputation problem, typically what people will do is estimate some data and then go back and compute it. That's one way to do with it. More egregiously, people will drop that data on the floor and then go on. But missing data is in general a hard problem, which unfortunately we don't talk too much about in this course, but is an important real-life problem. But this data we imagine is complete."},{"id":397,"text":"You mentioned that the bigger the residual, the less the variance. I feel it's kind of the opposite. Oh, no, no. So if you have a large residual, you have a large variance. Why is minimizing the residual the same as maximizing the variance? Maximizing the amount that was explained."},{"id":398,"text":"So remember, when we did the maximization, maybe I said something that was confusing, so I want to make sure this is clear. When we go back to this min versus max, we went to this one. What we were maximizing is the explanation of this. How much did you actually take as it was going, which in some ways is one piece, versus minimizing the residual on top of both of them. And so we were maximizing the amount of data that's in the projected subspace in the first piece."}],"notes":["本段讨论了主成分分析（PCA）中的预处理步骤，包括是否进行z-score标准化和如何处理不同尺度的数据。讲者指出，虽然z-score标准化和尺度归一化是常见的预处理方法，但它们并非严格必要，而是为了使不同方向上的方差具有可比性。","讲者提到，当数据存在缺失值时，通常的处理方法包括数据插补和直接删除缺失值。但讲者强调，缺失数据是一个复杂的问题，课程中并未深入讨论，但在实际应用中非常重要。","在讨论残差与方差的关系时，讲者澄清了残差越大意味着方差越大，而最小化残差等价于最大化方差，因为这是对数据解释量的优化。","讲者进一步解释了在主成分分析中，最大化解释量与最小化残差之间的关系，强调了在投影子空间中保留尽可能多的数据信息的重要性。"],"formulas":[{"latex":"Var(X) = E[(X - \\bar{X})^2]","symbols":"方差是数据与均值差的平方的期望","explanation":"公式正确，方差定义为数据点与均值差的平方的期望，符合数学定义。","evidence":"The second one that I highlighted is, if you have different scales, you typically will normalize them by taking the empirically variance in that direction and scaling them. So that one unit of variance in one direction means the same as another unit of variance in the other direction, roughly speaking. This is important in data and comes up quite a bit. It's actually technically not necessary. Neither of them are necessary. If you're asking, are there other pre-processing techniques that you could use to indeed get better or more confident answers from them? Absolutely. But these are the basics."},{"latex":"Residual = Y - \\text{Predicted } Y","symbols":"残差是实际值与预测值之间的差","explanation":"公式正确，残差定义为实际观测值与预测值之间的差，符合统计学定义。","evidence":"You mentioned that the bigger the residual, the less the variance. I feel it's kind of the opposite. Oh, no, no. So if you have a large residual, you have a large variance. Why is minimizing the residual the same as maximizing the variance? Maximizing the amount that was explained."}],"uncertainties":["the bigger the residual, the less the variance"],"diagram":"none","start":3915.44,"end":4071.72,"asr_flags":[],"math_clarifications":["公式2中的等号关系不成立，最大化解释方差与最小化残差是相关但不等价的概念，不能直接等同。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3915.44,"text":"If you have all the eigenvalues, one, you get something that kind of looks unit circle-like, the stretch. This is the level sets of the linear function. And you get these nice ellipses if you make them tilted in some way. OK? Please. Two questions. One, are we doing a z-scoring for each one of the values? And two, what do we do with missing data?"},{"start":3944.72,"text":"Yeah, wonderful question. So the question is, are we going to do a z-scoring here? You don't need to. It's a nice pre-processing technique. Here, what we're doing to make everything go through are basically two pieces, which is we're sliding back to the origin so that we actually don't have that problem where there's something off in this direction. We just get the direction to the body rather than the component of variation. Think about this as, as I said, it's the variation distance. So that is quite important."},{"start":3970.85,"text":"The second one that I highlighted is, if you have different scales, you typically will normalize them by taking the empirically variance in that direction and scaling them. So that one unit of variance in one direction means the same as another unit of variance in the other direction, roughly speaking. This is important in data and comes up quite a bit. It's actually technically not necessary. Neither of them are necessary. If you're asking, are there other pre-processing techniques that you could use to indeed get better or more confident answers from them? Absolutely. But these are the basics."},{"start":4000.17,"text":"that you need that people seem to run into most of the time. And what was your second question? Sorry. Oh, missing data. Yeah, this doesn't do anything about missing data. If you have a data imputation problem, typically what people will do is estimate some data and then go back and compute it. That's one way to do with it. More egregiously, people will drop that data on the floor and then go on. But missing data is in general a hard problem, which unfortunately we don't talk too much about in this course, but is an important real-life problem. But this data we imagine is complete."},{"start":4028.36,"text":"You mentioned that the bigger the residual, the less the variance. I feel it's kind of the opposite. Oh, no, no. So if you have a large residual, you have a large variance. Why is minimizing the residual the same as maximizing the variance? Maximizing the amount that was explained."},{"start":4044.24,"text":"So remember, when we did the maximization, maybe I said something that was confusing, so I want to make sure this is clear. When we go back to this min versus max, we went to this one. What we were maximizing is the explanation of this. How much did you actually take as it was going, which in some ways is one piece, versus minimizing the residual on top of both of them. And so we were maximizing the amount of data that's in the projected subspace in the first piece."}],"speech_gaps":[],"frame":"../frames/v048/024.webp","frame_time":3927.44},{"title":"主成分分析中的特征值分解","segments":[{"id":399,"text":"If I said something less cautious than that, then please let me know. OK. So let's go to eigenvalue compositions. So remember, we can take a vector x, and we can decompose it in this nice, beautiful way, which is a wonderful thing, by the way. It happens in linear space. It doesn't happen in a lot of spaces. But it's nice that it happens in the ones we care about. And as before, we can compute this x transpose x. This is what we want to do. So how are we going to do it?"},{"id":400,"text":"So we write x in this form. We multiply by a scalar. So because it's now in this nice basis form, it's in the scalar. The scalar changes the weight. We get back the x that's there. And boom, when we do the dot product of x into this, because x can be decomposed, we get this nice form. We get lambda j times the alpha j squares."},{"id":401,"text":"Okay, so just to make sure it's clear, all I've done here is I've taken X, I've plugged it in in two spots."},{"id":402,"text":"I use the fact that when I multiply U in either direction times U, I get out this nice equality to get the EIs and EJs."},{"id":403,"text":"I use the EI, EJ times a diagonal matrix is lambda J."},{"id":404,"text":"And indeed, I get out this nice, beautiful form here, okay?"},{"id":405,"text":"Which has many more, many fewer free parameters than my original A's and all the rest, right?"},{"id":406,"text":"Just very few parameters in general."},{"id":407,"text":"Cool. So why did I tell you all that?"},{"id":408,"text":"So now we can write maximizing this function as a scalar over this."},{"id":409,"text":"This is a much potentially easier expression because it's now"},{"id":410,"text":"maximizing over all the Alpha that are unit norm over this square term."},{"id":411,"text":"Okay, please."},{"id":412,"text":"So that's basically what this is doing."},{"id":413,"text":"So what's going on right now is we're showing how when we actually get the desiderata that we had,"},{"id":414,"text":"had, which was to maximize the subspace or to minimize the residual, which we'll show"},{"id":415,"text":"later. Those things boil down to basically this eigenvalue decomposition, and we're making"},{"id":416,"text":"sure that that process is really clear. There's practical things that you have to do to do"},{"id":417,"text":"normalization, but what's popping out right here is now we reduce this to something that"},{"id":418,"text":"is this XTX, this maximum over all the explained variance is actually just something in terms"},{"id":419,"text":"of the eigen"}],"notes":["本段讲解了主成分分析（PCA）中特征值分解的应用。讲者首先回顾了向量x的分解方式，即通过特征向量基底和对应的特征值进行表示。这种分解方式在特定的线性空间中有效，且能简化计算。讲者提到，通过这种分解，可以将向量x的点积转化为特征值和特征向量的组合形式，即lambda_j乘以alpha_j的平方。","接着，讲者强调了特征值分解在PCA中的重要性，即通过这种分解可以将原本复杂的参数空间简化为更少的参数。讲者指出，这种分解方式能够减少自由参数的数量，从而简化问题。","讲者进一步说明，通过特征值分解，可以将最大化方差的问题转化为对特征值的计算。这种转换使得问题更容易处理，因为只需要考虑特征值和对应的特征向量。","此外，讲者提到在实际应用中，需要进行归一化处理，以确保计算的准确性。但核心思想是通过特征值分解将问题简化为对特征值的计算。","最后，讲者指出，最大化方差的问题可以转化为对特征值的计算，这在PCA中是关键的一步。通过这种分解，可以找到能够解释最多方差的主成分。"],"formulas":[],"uncertainties":["EI, EJ 的具体含义未明确，可能是特征向量或特征值的缩写"],"diagram":"none","start":4072.72,"end":4238.1,"asr_flags":[],"math_clarifications":["原始片段中提到的特征值分解和相关公式缺乏必要的上下文信息，例如U和V的具体定义，以及lambda的排列方式，因此无法确定其正确性。","x^T x 是向量的模长平方，而lambda_j alpha_j^2 是特征值与特征向量系数的乘积，两者在数学上并不相等。正确的表达式应为 x^T x = sum_{j} lambda_j alpha_j^2。","x^T x 是向量的模长平方，而max lambda_j 是特征值的最大值，两者在数学上并不相等。正确的表达式应为 x^T x = sum_{j} lambda_j alpha_j^2，其中lambda_j是特征值，alpha_j是特征向量的系数。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4072.72,"text":"If I said something less cautious than that, then please let me know. OK. So let's go to eigenvalue compositions. So remember, we can take a vector x, and we can decompose it in this nice, beautiful way, which is a wonderful thing, by the way. It happens in linear space. It doesn't happen in a lot of spaces. But it's nice that it happens in the ones we care about. And as before, we can compute this x transpose x. This is what we want to do. So how are we going to do it?"},{"start":4100.04,"text":"So we write x in this form. We multiply by a scalar. So because it's now in this nice basis form, it's in the scalar. The scalar changes the weight. We get back the x that's there. And boom, when we do the dot product of x into this, because x can be decomposed, we get this nice form. We get lambda j times the alpha j squares."},{"start":4130.54,"text":"Okay, so just to make sure it's clear, all I've done here is I've taken X, I've plugged it in in two spots."},{"start":4137.82,"text":"I use the fact that when I multiply U in either direction times U, I get out this nice equality to get the EIs and EJs."},{"start":4145.44,"text":"I use the EI, EJ times a diagonal matrix is lambda J."},{"start":4150.92,"text":"And indeed, I get out this nice, beautiful form here, okay?"},{"start":4154.44,"text":"Which has many more, many fewer free parameters than my original A's and all the rest, right?"},{"start":4158.96,"text":"Just very few parameters in general."},{"start":4161.7,"text":"Cool. So why did I tell you all that?"},{"start":4168.08,"text":"So now we can write maximizing this function as a scalar over this."},{"start":4176.12,"text":"This is a much potentially easier expression because it's now"},{"start":4180.3,"text":"maximizing over all the Alpha that are unit norm over this square term."},{"start":4189.36,"text":"Okay, please."},{"start":4206.56,"text":"So that's basically what this is doing."},{"start":4208.72,"text":"So what's going on right now is we're showing how when we actually get the desiderata that we had,"},{"start":4214.34,"text":"had, which was to maximize the subspace or to minimize the residual, which we'll show"},{"start":4217.6,"text":"later. Those things boil down to basically this eigenvalue decomposition, and we're making"},{"start":4222.44,"text":"sure that that process is really clear. There's practical things that you have to do to do"},{"start":4226.24,"text":"normalization, but what's popping out right here is now we reduce this to something that"},{"start":4230.48,"text":"is this XTX, this maximum over all the explained variance is actually just something in terms"},{"start":4237.76,"text":"of the eigen"}],"speech_gaps":[{"start":4192.4,"end":4196.976}],"frame":"../frames/v048/025.webp","frame_time":4084.72},{"title":"主成分分析（PCA）与特征值分解","segments":[{"id":420,"text":"So now we have a quantity in terms of the eigenvalues, so we can understand exactly what's going to happen, where the principal component is going to be in this case, and then by proxy in many other cases. We're proving that your intuition about we should do a decomposition on the eigenvalue of the covariance matrix is actually kind of what PCA is doing. Those are the principal components of variation, and they're the eigenvectors of the underlying matrix after you do this transformation. Yeah, that's the content."},{"id":421,"text":"You got it right. Perfect. Awesome. So which x attains the maximum here? Someone tell me? In this language. So among all these alphas, which one do I pick over here to maximize this quantity? Lambda 1 to lambda 2 are in decreasing order. You put all the mass on 1, right? You pick an eigenvalue. Now, what if lambda 1 equals lambda 2? The first one was? Take u1. It works."},{"id":422,"text":"What happens if lambda1 equals lambda2? Well, that answer still works, but so do many others. In the first case, if they are strictly separated, if lambda1 is 1 and lambda2 is 0.5, then if you don't put all your math on U1, you lose. You don't actually solve the max. If lambda1 and lambda2 equal each other, then picking any vector in that subspace, any combination of U1 and U2 is also a maximizer, correct?"},{"id":423,"text":"Because they both have the same lambda1 and lambda2, so I can move around all over the place. Why is that weird for PCA? If I want the principal component of variation and lambda1 and lambda2 are equal to each other, there isn't a single direction. There's an entire subspace. And worse, what happens on my data is if lambda1 and lambda2 are close together, I can get a potential instability. Is it clear why?"},{"id":424,"text":"Because as they get together, I'm maximizing, I'm getting something where the separation between those eigenvalues is implicitly what I'm looking at in my data. If the third eigenvalue is much longer than the fourth eigenvalue, then it's possible that's a good separation. I can reliably identify the top three. But if they're close together, the top three eigenvalues are all close together, the coordinates that I get back don't make sense."}],"notes":["本段讲解了主成分分析（PCA）中特征值分解的核心思想，即通过特征值的大小来确定数据的主要变化方向。在特征值严格递减的情况下，最大特征值对应的特征向量即为第一主成分。当两个特征值相等时，任何该子空间内的向量都可以作为主成分，这导致了方向的不确定性。","当特征值非常接近时，PCA可能会出现不稳定性，因为特征值之间的分离度较小，难以准确识别主要成分。这种情况下，得到的坐标可能无法反映数据的真实结构，从而影响分析结果。","在特征值分解中，特征值的大小反映了数据在对应方向上的方差大小。较大的特征值对应的方向包含更多的数据变异信息，因此在PCA中优先选择这些方向。","当特征值相等时，PCA无法确定唯一的主成分方向，而是选择该子空间内的任意向量。这种情况下，数据的主成分方向可能不唯一，需要进一步的分析或约束条件来确定。","特征值的分离度对PCA的稳定性至关重要。如果特征值之间的差异较大，PCA可以可靠地识别主要成分；但如果特征值接近，PCA可能会出现不稳定，导致分析结果不可靠。","在实际应用中，PCA通常选择特征值最大的前几个方向作为主成分，以减少数据的维度并保留主要信息。然而，当特征值接近时，需要谨慎处理，以避免因方向不确定性导致的分析偏差。"],"formulas":[{"latex":"\\text{argmax}_{x} \\frac{x^T \\text{Cov}(X) x}{x^T x}","symbols":"x: 数据向量, Cov(X): 协方差矩阵","explanation":"该公式正确表达了在单位向量约束下最大化方差的表达式，符合PCA的数学定义。","evidence":"You got it right. Perfect. Awesome. So which x attains the maximum here? Someone tell me? In this language. So among all these alphas, which one do I pick over here to maximize this quantity? Lambda 1 to lambda 2 are in decreasing order. You put all the mass on 1, right? You pick an eigenvalue. Now, what if lambda 1 equals lambda 2? The first one was? Take u1. It works. What happens if lambda1 equals lambda2? Well, that answer still works, but so do many others. In the first case, if they are strictly separated, if lambda1 is 1 and lambda2 is 0.5, then if you don't put all your math on U1, you lose. You don't actually solve the max. If lambda1 and lambda2 equal each other, then picking any vector in that subspace, any combination of U1 and U2 is also a maximizer, correct? Because they both have the same lambda1 and lambda2, so I can move around all over the place. Why is that weird for PCA? If I want the principal component of variation and lambda1 and lambda2 are equal to each other, there isn't a single direction. There's an entire subspace. And worse, what happens on my data is if lambda1 and lambda2 are close together, I can get a potential instability. Is it clear why? Because as they get together, I'm maximizing, I'm getting something where the separation between those eigenvalues is implicitly what I'm looking at in my data. If the third eigenvalue is much longer than the fourth eigenvalue, then it's possible that's a good separation. I can reliably identify the top three. But if they're close together, the top three eigenvalues are all close together, the coordinates that I get back don't make sense."}],"uncertainties":[],"diagram":"none","start":4238.26,"end":4388.97,"asr_flags":[],"math_clarifications":["公式0和公式2缺少归一化项，未明确单位向量约束，不符合PCA的标准数学表达。公式1正确表达了在单位向量约束下最大化方差的表达式，符合PCA的数学定义。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4238.26,"text":"So now we have a quantity in terms of the eigenvalues, so we can understand exactly what's going to happen, where the principal component is going to be in this case, and then by proxy in many other cases. We're proving that your intuition about we should do a decomposition on the eigenvalue of the covariance matrix is actually kind of what PCA is doing. Those are the principal components of variation, and they're the eigenvectors of the underlying matrix after you do this transformation. Yeah, that's the content."},{"start":4268.85,"text":"You got it right. Perfect. Awesome. So which x attains the maximum here? Someone tell me? In this language. So among all these alphas, which one do I pick over here to maximize this quantity? Lambda 1 to lambda 2 are in decreasing order. You put all the mass on 1, right? You pick an eigenvalue. Now, what if lambda 1 equals lambda 2? The first one was? Take u1. It works."},{"start":4307.66,"text":"What happens if lambda1 equals lambda2? Well, that answer still works, but so do many others. In the first case, if they are strictly separated, if lambda1 is 1 and lambda2 is 0.5, then if you don't put all your math on U1, you lose. You don't actually solve the max. If lambda1 and lambda2 equal each other, then picking any vector in that subspace, any combination of U1 and U2 is also a maximizer, correct?"},{"start":4334.62,"text":"Because they both have the same lambda1 and lambda2, so I can move around all over the place. Why is that weird for PCA? If I want the principal component of variation and lambda1 and lambda2 are equal to each other, there isn't a single direction. There's an entire subspace. And worse, what happens on my data is if lambda1 and lambda2 are close together, I can get a potential instability. Is it clear why?"},{"start":4366.05,"text":"Because as they get together, I'm maximizing, I'm getting something where the separation between those eigenvalues is implicitly what I'm looking at in my data. If the third eigenvalue is much longer than the fourth eigenvalue, then it's possible that's a good separation. I can reliably identify the top three. But if they're close together, the top three eigenvalues are all close together, the coordinates that I get back don't make sense."}],"speech_gaps":[],"frame":"../frames/v048/026.webp","frame_time":4250.26},{"title":"主成分分析（PCA）的数学基础与潜在问题","segments":[{"id":425,"text":"Does that make sense? I will have mass, for example, on the first three coordinates, u1, u2, u3, conceptually. They're not the basis coordinates, but in the u coordinates. And then the rest may be 0, that I can say. But their actual values, if I were to feed them into your machine learning algorithm, and you had some linear classifier, there's no reason run after run they would get the same information. So if you had a weight on one feature versus another feature, you would have a problem. Does that make sense? All right."},{"id":426,"text":"Okay, so this slide basically shows, as we go through maximizing this original quantity that we cared about, those were just facts about eigenvalues, that we can expand this character. And this thing here, after pushing all the values, is the covariance data because we subtracted off the mean. So back when we talked about it as motivating all these bad things would happen."},{"id":427,"text":"If we want to interpret this matrix as a covariance matrix, we have to subtract off the mean because otherwise these guys need to be x minus mu, right? There is a mu. Hence, it reared its head. It's 0 because we whitened by it. Does that make sense? So we are estimating the covariance when we do the PCA. That's all that's happening. And the first eigenvalue of the data covariance matrix is the principal component."},{"id":428,"text":"Now, I hope by giving you this detour through what the underlying math is, you can see some of the ways that it goes wrong now. It goes wrong if you don't whiten it, potentially you won't get a principal component. It goes wrong if the scales are different in some way, and if your underlying data doesn't have an eigenvalue spectrum that is separated, you're toast."},{"id":429,"text":"So again, this is the way people use it. And so this is one of the things, as you mentioned, people will often do this dimensionality reduction. It really only makes sense if you have all those vectors to be distinct and separated. Otherwise, when you run it again and again, you're just picking potentially something in the subspace."},{"id":430,"text":"That can be quite problematic on your data. You send out your data, you do PCA on it, you learn some model, you come in with new data, you do PCA. Because of the fact that they're not separated, you get different answers, different coordinates. Your machine learning model may not work on top of that if you use it. Using it for dimensionality reduction, I'm not a super fan of. You have to be careful about that if you do it. Multiple dimensions, I won't go through. It's the same argument with matrices instead of vectors."},{"id":431,"text":"And one thing that I did want to say, which usually comes up is you can actually measure"},{"id":432,"text":"these sums. How can you measure this sum? If I told you to compute this sum of a matrix"},{"id":433,"text":"and I give you the matrix, it's some wild, nasty matrix. How could you compute this character"},{"id":434,"text":"efficiently? Anyone remember the trace? I just sum the diagonal elements. So this one, I can"}],"notes":["本段讲解了主成分分析（PCA）中协方差矩阵的计算和解释。教授指出，为了将矩阵解释为协方差矩阵，必须减去均值，否则矩阵中的元素应为x减去均值。这一步骤是PCA的核心，因为协方差矩阵的特征值对应于主成分，而特征向量对应于主成分的方向。","教授进一步说明了PCA的潜在问题，包括如果不进行白化（whitening）可能导致无法获得真正的主成分，以及当数据的尺度不同或特征值谱未分离时，PCA可能失效。这表明PCA的正确应用需要满足一定的前提条件。","教授还提到，PCA在实际应用中可能存在问题，例如当数据未被正确分离时，重复运行PCA可能会得到不同的结果，从而影响后续的机器学习模型性能。因此，使用PCA进行降维时需要谨慎。","最后，教授提到如何高效计算矩阵的迹（trace），即对角线元素之和。这为后续的数学计算提供了基础，说明了如何通过简单的操作来计算复杂的矩阵特征。","教授强调了PCA的数学基础，包括协方差矩阵、特征值和特征向量的概念，以及它们在降维中的作用。这些概念是理解PCA如何工作的关键。","教授还指出，PCA的正确应用需要确保数据的特征值谱是分离的，否则降维结果可能不稳定，影响后续模型的性能。这表明PCA的使用需要结合具体的数据特征进行判断。"],"formulas":[{"latex":"E[\\boldsymbol{v}^T \\boldsymbol{v}] = \\text{trace}(\\boldsymbol{v} \\boldsymbol{v}^T)","symbols":"向量的迹计算","explanation":"公式正确，表示向量v的平方和等于其外积矩阵的迹。","evidence":"and I give you the matrix, it's some wild, nasty matrix. How could you compute this character"}],"uncertainties":["character"],"diagram":"none","start":4390.26,"end":4569.42,"asr_flags":[],"math_clarifications":["公式0和公式1存在数学定义错误，需要移除。公式0错误地将协方差矩阵定义为标量x的函数，而应为向量x的函数。公式1错误地将协方差矩阵与方差直接关联，而协方差矩阵是方差和协方差的扩展。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":4390.26,"text":"Does that make sense? I will have mass, for example, on the first three coordinates, u1, u2, u3, conceptually. They're not the basis coordinates, but in the u coordinates. And then the rest may be 0, that I can say. But their actual values, if I were to feed them into your machine learning algorithm, and you had some linear classifier, there's no reason run after run they would get the same information. So if you had a weight on one feature versus another feature, you would have a problem. Does that make sense? All right."},{"start":4422.45,"text":"Okay, so this slide basically shows, as we go through maximizing this original quantity that we cared about, those were just facts about eigenvalues, that we can expand this character. And this thing here, after pushing all the values, is the covariance data because we subtracted off the mean. So back when we talked about it as motivating all these bad things would happen."},{"start":4447.27,"text":"If we want to interpret this matrix as a covariance matrix, we have to subtract off the mean because otherwise these guys need to be x minus mu, right? There is a mu. Hence, it reared its head. It's 0 because we whitened by it. Does that make sense? So we are estimating the covariance when we do the PCA. That's all that's happening. And the first eigenvalue of the data covariance matrix is the principal component."},{"start":4473.46,"text":"Now, I hope by giving you this detour through what the underlying math is, you can see some of the ways that it goes wrong now. It goes wrong if you don't whiten it, potentially you won't get a principal component. It goes wrong if the scales are different in some way, and if your underlying data doesn't have an eigenvalue spectrum that is separated, you're toast."},{"start":4499.2,"text":"So again, this is the way people use it. And so this is one of the things, as you mentioned, people will often do this dimensionality reduction. It really only makes sense if you have all those vectors to be distinct and separated. Otherwise, when you run it again and again, you're just picking potentially something in the subspace."},{"start":4518.15,"text":"That can be quite problematic on your data. You send out your data, you do PCA on it, you learn some model, you come in with new data, you do PCA. Because of the fact that they're not separated, you get different answers, different coordinates. Your machine learning model may not work on top of that if you use it. Using it for dimensionality reduction, I'm not a super fan of. You have to be careful about that if you do it. Multiple dimensions, I won't go through. It's the same argument with matrices instead of vectors."},{"start":4546.48,"text":"And one thing that I did want to say, which usually comes up is you can actually measure"},{"start":4551.68,"text":"these sums. How can you measure this sum? If I told you to compute this sum of a matrix"},{"start":4558.66,"text":"and I give you the matrix, it's some wild, nasty matrix. How could you compute this character"},{"start":4562.84,"text":"efficiently? Anyone remember the trace? I just sum the diagonal elements. So this one, I can"}],"speech_gaps":[],"frame":"../frames/v048/027.webp","frame_time":4402.26},{"title":"主成分分析（PCA）与降维动机","segments":[{"id":435,"text":"compute quite a bit. And this, I can also estimate once I have the directions that I've actually"},{"id":436,"text":"compute it. So in particular, I can compute this without having to compute all n squared things."},{"id":437,"text":"If my k that I pick is like 3, I can look and find those three directions. I can compute their eigen"},{"id":438,"text":"values because I now have their orthogonalization. I multiply them by the matrix. They will be of the"},{"id":439,"text":"form lambda times ui. So I can get all those values. So I can get lambda 1 lambda 2. And this"},{"id":440,"text":"Just to understand, why do you want to reduce dimensions again?"},{"id":441,"text":"Like why don't you want to keep all these different..."},{"id":442,"text":"Oh, great question. So part of what goes on when you have high dimensions is if you have many high"},{"id":443,"text":"dimensions that are... So there's a couple of situations where you want to do dimensionality"},{"id":444,"text":"reduction. One, as we talked about, is you're analyzing your data and you just have a sea of"},{"id":445,"text":"numbers about various things that look the same. The high city versus highway miles per gallon was"},{"id":446,"text":"an example of like, I'm not sure I really care about that. I just want a car that gives me good"},{"id":447,"text":"miles per gallon or something then you're that's a data reduction thing where you want to take many"},{"id":448,"text":"variables and that was a simple example but in general you may say look underneath my data"},{"id":449,"text":"there are really only three things i care about three directions or three kind of pseudo features"},{"id":450,"text":"that explain almost all of my data if that's the case then your data instead of living in a wild"},{"id":451,"text":"n-dimensional space or d-dimensional space that's there right it has all these vectors it actually"},{"id":452,"text":"only lives in this subspace then you can make stronger inferences about it and so when we do"},{"id":453,"text":"dimensionality reduction there's a lot of both theory and practice that says"},{"id":454,"text":"when your data lives in this huge high dimensional space but actually has a"},{"id":455,"text":"subspace on it, finding that smaller subspace allows you to exploit it."},{"id":456,"text":"We've used this, this is kind of the capstone to a bunch of stuff that we've done over the last week or two, where we've said there exists some structure. And what I was trying to point out here is, here we're making kind of, although everyone uses PCA, it's really making an assumption that the subspaces are well separated in your covariance. That is mathematically what it's doing. So that may not seem particularly strange to you, like, oh, I just compute the variance and throw stuff away. But that's when it makes sense. In contrast, the stuff we were doing with EM was, oh, we assume that there's some latent structure that's there, these sources."},{"id":457,"text":"the shape of gaussians and we don't know the exact parameters but there's still assumptions. So those assumptions are the quite important thing to me. But why we reduce dimensionality is because we think that that makes things more predictable and so a lot of classical machine learning is about doing, you know, from the wild sea of measurements finding the most important. Yeah, exactly right. So what I'm showing here is as you increase"}],"notes":["本段主要讲解主成分分析（PCA）的基本原理，即通过找到数据的主要方向（特征向量）来降低维度。讲者提到，当选择k个方向时，可以通过计算这些方向的特征值来确定其重要性。PCA的核心思想是通过正交化处理，将数据投影到低维子空间，从而保留数据的主要信息。"],"formulas":[{"latex":"A u_i = \\lambda u_i","symbols":"A 是协方差矩阵，u_i 是特征向量，lambda 是对应的特征值","explanation":"公式正确，描述了特征值分解的基本形式，其中A是协方差矩阵，u_i是特征向量， eduction thing where you want to take many"},{"start":4631.78,"text":"variables and that was a simple example but in general you may say look underneath my data"},{"start":4636.22,"text":"there are really only three things i care about three directions or three kind of pseudo features"},{"start":4640.52,"text":"that explain almost all of my data if that's the case then your data instead of living in a wild"},{"start":4644.84,"text":"n-dimensional space or d-dimensional space that's there right it has all these vectors it actually"},{"start":4649.66,"text":"only lives in this subspace then you can make stronger inferences about it and so when we do"},{"start":4654.2,"text":"dimensionality reduction there's a lot of both theory and practice that says"},{"start":4657.56,"text":"when your data lives in this huge high dimensional space but actually has a"},{"start":4660.94,"text":"subspace on it, finding that smaller subspace allows you to exploit it."},{"start":4665.39,"text":"We've used this, this is kind of the capstone to a bunch of stuff that we've done over the last week or two, where we've said there exists some structure. And what I was trying to point out here is, here we're making kind of, although everyone uses PCA, it's really making an assumption that the subspaces are well separated in your covariance. That is mathematically what it's doing. So that may not seem particularly strange to you, like, oh, I just compute the variance and throw stuff away. But that's when it makes sense. In contrast, the stuff we were doing with EM was, oh, we assume that there's some latent structure that's there, these sources."},{"start":4694.54,"text":"the shape of gaussians and we don't know the exact parameters but there's still assumptions. So those assumptions are the quite important thing to me. But why we reduce dimensionality is because we think that that makes things more predictable and so a lot of classical machine learning is about doing, you know, from the wild sea of measurements finding the most important. Yeah, exactly right. So what I'm showing here is as you increase"}],"speech_gaps":[],"frame":"../frames/v048/028.webp","frame_time":4581.42},{"title":"主成分分析与EM算法的总结","segments":[{"id":458,"text":"In these plots, as you increase the number of components, the amount of variance tails off. So one natural phenomenon that happens is you often only have a couple of components that really explain the entire dataset if you're doing anything that's sufficiently large and coarse-grained. And so you can manipulate only those five components and your conclusions depend on those and maybe not the rest of the dataset. So that data compression teaches you something about the structure of the problem. These are awesome questions. So"},{"id":459,"text":"I'm going to skip to the last slide. We were only one slide away. We only skipped one beautiful picture of denoising. Look how beautiful it is. You got everything from it. So we saw the famous EM algorithm. This is something I wanted to show you because you decompose these things in latent variables. It's the workhorse that people use all the time. It's kind of the fallback that people are going to use there. We saw PCA, which is a workhorse of dimensionality reduction. The substructure for PCA was subspaces. The substructure for EM were these latent variables."},{"id":460,"text":"probabilistic model that we were able to solve. With that, I just want to say you folks have been phenomenal. This was a great quarter for me. I'm gone. This is my last class. And I thank you so much for all the sweet of you to say, but thank you so much for making this job so much fun. So please take some extra candy and have a great rest of your day. Thanks guys."}],"notes":["本段讨论了主成分分析（PCA）中数据压缩的原理，指出随着主成分数量的增加，方差逐渐趋于稳定，因此通常只需要少数几个主成分就能解释大部分数据的结构。这种压缩不仅有助于简化问题，还能揭示数据的潜在结构。","接着，讲者跳过了最后一张幻灯片，提到一张关于去噪的美丽图像，并强调了EM算法的重要性。EM算法通过引入隐变量来分解复杂模型，是处理概率模型的常用方法，尤其在处理缺失数据或隐变量问题时非常有效。","讲者还对比了PCA和EM算法的子结构：PCA基于子空间，而EM基于隐变量。这说明了不同方法在处理数据降维和模型分解时的不同思路，也体现了两种方法在机器学习中的广泛应用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4723.54,"end":4799.03,"asr_flags":[],"raw_segments":[{"start":4723.54,"text":"these plots, as you increase the number of components, the amount of variance tails off. So one natural phenomenon that happens is you often only have a couple of components that really explain the entire dataset if you're doing anything that's sufficiently large and coarse-grained. And so you can manipulate only those five components and your conclusions depend on those and maybe not the rest of the dataset. So that data compression teaches you something about the structure of the problem. These are awesome questions. So"},{"start":4753.89,"text":"I'm going to skip to the last slide. We were only one slide away. We only skipped one beautiful picture of denoising. Look how beautiful it is. You got everything from it. So we saw the famous EM algorithm. This is something I wanted to show you because you decompose these things in latent variables. It's the workhorse that people use all the time. It's kind of the fallback that people are going to use there. We saw PCA, which is a workhorse of dimensionality reduction. The substructure for PCA was subspaces. The substructure for EM were these latent variables."},{"start":4784.17,"text":"probabilistic model that we were able to solve. With that, I just want to say you folks have been phenomenal. This was a great quarter for me. I'm gone. This is my last class. And I thank you so much for all the sweet of you to say, but thank you so much for making this job so much fun. So please take some extra candy and have a great rest of your day. Thanks guys."}],"speech_gaps":[],"frame":"../frames/v048/029.webp","frame_time":4735.54}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

ogress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
