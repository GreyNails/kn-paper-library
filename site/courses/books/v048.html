splay:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>机器学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">【斯坦福CS229】混合高斯模型（EM）与主成分分析 · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"id":"v048","title":"【斯坦福CS229】混合高斯模型（EM）与主成分分析","course":"机器学习","pages":[{"title":"混合高斯模型（EM）与主成分分析","segments":[{"id":0,"text":"Welcome to Lecture 10, CS229. Happy Wednesday. It's really nice outside. I hope you're getting some time outside today. It's pretty nice. This is like the California you were promised. A little too cold for me, but I enjoy it. We're going to try copy-paste again today. I would like to say that before we started recording, I did show that it actually works. It's just a very disturbing delay. So we'll see how that goes. Today, we're going to continue in unsupervised learning. We're going to see the details of the EM algorithm. And then we're going to transition."},{"id":1,"text":"to its non-probabilistic analog, PCA. And PCA is a workhorse algorithm. I use it all the time. One of my graduate students sent me plots for PCA last night about something. And so it is a workhorse canonical algorithm that you should have in your toolkit. OK."},{"id":2,"text":"So we'll first discover this EM that discovers our ad hoc algorithm that we did before. This GMM algorithm, we're going to explain how this is a principled element of what we're doing. Then we're going to talk about this classic dimensionality reduction idea PCA. And that's going to be our entire lecture. All right. So last time, remember, just to motivate you and give you a little bit of time to look at the slide, I'm going to draw some pictures. And this is the picture we drew last time, roughly speaking. We were given"},{"id":3,"text":"a bunch of these photon counts. Remember this was some plate that we held up."},{"id":4,"text":"And these were individual photons. These x's are individual photons. And we were trying to figure out what sources they came from. And we don't know the sources. We don't know how many points come from every source. And we don't know the shapes of them. Remember, we talked about before, we wanted to get these shapes. And the idea that we saw for GMM was we basically had this latent variable, zi, which was which source it would correspond to."},{"id":5,"text":"And the difference between what we saw in k-means was that it was a soft assignment. So we would have a point, for example, here. Let's imagine that currently we think there are two sources in our algorithm. This point we may say is 50% in this source and 50% in this source, whereas this one we're fairly confident that this point belongs to call this source to. And that's what Zij is actually going to be. So that was the clustering strength. But it was a soft clustering. So we're going to look at that."},{"id":6,"text":"And then what we did is after we assigned all the points, and we said, okay, all these points are probabilistically assigned with their various weights, we then refit the parameters intuitively, the mu j's and the sigma's. So they would fit, for example, both their mean, and then some, I'm drawing a bad version of it here, but they would fit some ellipse. Why was it an ellipse? What the ellipse kind of look like? What does the ellipse represent when I draw it?"}],"notes":["本段介绍了课程的结构，包括今天将讲解的EM算法和主成分分析（PCA）。课程强调EM算法是无监督学习中的一种重要方法，而PCA是用于降维的经典算法，被广泛使用。","讲者提到EM算法是通过引入隐变量来处理数据的分布问题，与k-means算法相比，EM算法使用软分配（soft assignment）来表示数据点属于不同源的概率，而不是硬分配。","在讲解GMM时，讲者提到每个数据点都有一个隐变量zi，表示它属于哪个源。这种软聚类方法允许数据点同时属于多个源，权重由概率决定。","讲者还提到在完成隐变量的分配后，需要重新估计模型参数，如均值μj和协方差σj。这些参数的估计是通过最大化似然函数来完成的。","最后，讲者提到在绘制椭圆时，椭圆代表了数据点的分布形状，椭圆的形状和大小与协方差矩阵有关，反映了数据的方差和相关性。","讲者通过实际例子（如光子计数）来说明EM算法的应用，强调了隐变量在建模中的重要性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.1,"end":165.62,"asr_flags":[],"raw_segments":[{"start":5.1,"text":"Welcome to Lecture 10, CS229. Happy Wednesday. It's really nice outside. I hope you're getting some time outside today. It's pretty nice. This is like the California you were promised. A little too cold for me, but I enjoy it. We're going to try copy-paste again today. I would like to say that before we started recording, I did show that it actually works. It's just a very disturbing delay. So we'll see how that goes. Today, we're going to continue in unsupervised learning. We're going to see the details of the EM algorithm. And then we're going to transition."},{"start":34.7,"text":"to its non-probabilistic analog, PCA. And PCA is a workhorse algorithm. I use it all the time. One of my graduate students sent me plots for PCA last night about something. And so it is a workhorse canonical algorithm that you should have in your toolkit. OK."},{"start":51.9,"text":"So we'll first discover this EM that discovers our ad hoc algorithm that we did before. This GMM algorithm, we're going to explain how this is a principled element of what we're doing. Then we're going to talk about this classic dimensionality reduction idea PCA. And that's going to be our entire lecture. All right. So last time, remember, just to motivate you and give you a little bit of time to look at the slide, I'm going to draw some pictures. And this is the picture we drew last time, roughly speaking. We were given"},{"start":81.26,"text":"a bunch of these photon counts. Remember this was some plate that we held up."},{"start":88.01,"text":"And these were individual photons. These x's are individual photons. And we were trying to figure out what sources they came from. And we don't know the sources. We don't know how many points come from every source. And we don't know the shapes of them. Remember, we talked about before, we wanted to get these shapes. And the idea that we saw for GMM was we basically had this latent variable, zi, which was which source it would correspond to."},{"start":114.14,"text":"And the difference between what we saw in k-means was that it was a soft assignment. So we would have a point, for example, here. Let's imagine that currently we think there are two sources in our algorithm. This point we may say is 50% in this source and 50% in this source, whereas this one we're fairly confident that this point belongs to call this source to. And that's what Zij is actually going to be. So that was the clustering strength. But it was a soft clustering. So we're going to look at that."},{"start":142.22,"text":"And then what we did is after we assigned all the points, and we said, okay, all these points are probabilistically assigned with their various weights, we then refit the parameters intuitively, the mu j's and the sigma's. So they would fit, for example, both their mean, and then some, I'm drawing a bad version of it here, but they would fit some ellipse. Why was it an ellipse? What the ellipse kind of look like? What does the ellipse represent when I draw it?"}],"speech_gaps":[],"frame":"../frames/v048/001.webp","frame_time":17.1},{"title":"混合高斯模型（EM）与主成分分析","segments":[{"id":7,"text":"Exactly. It's a multivariant Gaussian. And so those are its level sets. So those were all the equal probability, equal density things were on an ellipse. And the reason they're ellipse is those are the dimensions, if you like, of the covariance. Those are the eigenvectors of the covariance. Then we also refit this phi, which we'll get to in a second. This is just a review from last time, which has the proportion."},{"id":8,"text":"which was the estimated fraction that we had. And we had ad hoc estimates for that last time. If you don't remember them, please don't worry about it. We're going to re-derive them now. But this is a way we could derive them in general. Last time, we kind of squinted at it and said, hey, this was where the mean should be. This is where the variance should look like. This is what the fraction is. We do this kind of fractional count based on population statistics."},{"id":9,"text":"Today, we're going to derive that. And that derivation is going to be the example for this EM algorithm, which is a very general algorithm."},{"id":10,"text":"Then as we talked about, it was repetitive. So hopefully this is review for Monday. This looks exactly like k-means except for the difference from k-means was in k-means we had a hard assignment, here we have a soft assignment. In k-means, if you remember, we picked our new points. They said, hey, these are the points we think are in cluster 1 and cluster 2. We computed the means or their centers, then we iterated. Here instead of just picking their centers, which are the mus, we also pick some statistical parameters, their variances or their covariances, and we fit their proportions."},{"id":11,"text":"Otherwise, it's the same. We went from a hard assignment, soft assignment, and probabilistic. Cool. All right. We walked through last time Jensen's inequality, and we're going to use it for concave functions. So I'll only state it for concave functions. That's a terrible line. So this is x, and then we have a function here. Here's 0. We have something, you know, this kind of log x kind of looking function. Here's 1. So it looks like this."},{"id":12,"text":"This is log x. This is log x. And remember the picture here. When we want to look at g of z, so if we take any point g of z, we take two other points, a and b. So this a and this b. And we draw the line between them, which I'm going to highlight here. If I can do it. This green is this green here. That's the line. Lambda is the line between them."},{"id":13,"text":"And then that is because it's a concave function below the line. That is the definition, if you like, of a concave function that no matter how we draw that chord, it's going to live below the line. We're going to use that estimate quite a bit. And the form that we're going to use that fact in that we saw looks mysterious because of the notation is right here."}],"notes":["本段讲解了Jensen不等式及其在凹函数中的应用。讲者提到，Jensen不等式用于凹函数时，函数图像始终位于连接任意两点的线段下方。这是凹函数的定义，也是后续推导中将使用的重要性质。","讲者通过图像说明了Jensen不等式的几何意义，即对于任意两点a和b，函数g(z)在连接a和b的线段下方。这种性质在后续的EM算法推导中将被频繁使用。","讲者提到，虽然Jensen不等式的表达式看起来复杂，但其核心思想是利用凹函数的性质来推导期望值的下界，这在EM算法中用于构建下界函数（ELBO）。","讲者强调，Jensen不等式的应用需要明确函数的凹凸性，以及如何选择点a和b来构造线段。这些细节将在后续的EM算法推导中进一步展开。","本段内容为EM算法的推导做铺垫，特别是通过Jensen不等式来构建下界函数，从而实现对参数的迭代优化。","讲者指出，Jensen不等式的应用需要结合具体的函数形式和参数选择，这将在后续的EM算法推导中具体体现。"],"formulas":[{"latex":"g(z) \\text{ 是凹函数} \\rightarrow g(\\text{凸组合 of } a \\text{ 和 } b) \\text{ 小于等于 凸组合 of } g(a) \\text{ 和 } g(b)","symbols":"凹函数的性质：函数值在任意两点的凸组合处小于等于函数值的凸组合","explanation":"保持原公式，修正了中文符号和表达，使其更符合数学表述习惯。","evidence":"This is log x. This is log x. And remember the picture here. When we want to look at g of z, so if we take any point g of z, we take two other points, a and b. So this a and this b. And we draw the line between them, which I'm going to highlight here. If I can do it. This green is this green here. That's the line. Lambda is the line between them. And then that is because it's a concave function below the line. That is the definition, if you like, of a concave function that no matter how we draw that chord, it's going to live below the line. We're going to use that estimate quite a bit. And the form that we're going to use that fact in that we saw looks mysterious because of the notation is right here."}],"uncertainties":[],"diagram":"none","start":174.91,"end":328.59,"asr_flags":[],"math_clarifications":["公式本身是正确的，描述了凹函数的定义，即函数值在任意两点的凸组合处小于等于函数值的凸组合。"],"raw_segments":[{"start":174.91,"text":"Exactly. It's a multivariant Gaussian. And so those are its level sets. So those were all the equal probability, equal density things were on an ellipse. And the reason they're ellipse is those are the dimensions, if you like, of the covariance. Those are the eigenvectors of the covariance. Then we also refit this phi, which we'll get to in a second. This is just a review from last time, which has the proportion."},{"start":199.08,"text":"which was the estimated fraction that we had. And we had ad hoc estimates for that last time. If you don't remember them, please don't worry about it. We're going to re-derive them now. But this is a way we could derive them in general. Last time, we kind of squinted at it and said, hey, this was where the mean should be. This is where the variance should look like. This is what the fraction is. We do this kind of fractional count based on population statistics."},{"start":221.38,"text":"Today, we're going to derive that. And that derivation is going to be the example for this EM algorithm, which is a very general algorithm."},{"start":229.64,"text":"Then as we talked about, it was repetitive. So hopefully this is review for Monday. This looks exactly like k-means except for the difference from k-means was in k-means we had a hard assignment, here we have a soft assignment. In k-means, if you remember, we picked our new points. They said, hey, these are the points we think are in cluster 1 and cluster 2. We computed the means or their centers, then we iterated. Here instead of just picking their centers, which are the mus, we also pick some statistical parameters, their variances or their covariances, and we fit their proportions."},{"start":258.76,"text":"Otherwise, it's the same. We went from a hard assignment, soft assignment, and probabilistic. Cool. All right. We walked through last time Jensen's inequality, and we're going to use it for concave functions. So I'll only state it for concave functions. That's a terrible line. So this is x, and then we have a function here. Here's 0. We have something, you know, this kind of log x kind of looking function. Here's 1. So it looks like this."},{"start":286.47,"text":"This is log x. This is log x. And remember the picture here. When we want to look at g of z, so if we take any point g of z, we take two other points, a and b. So this a and this b. And we draw the line between them, which I'm going to highlight here. If I can do it. This green is this green here. That's the line. Lambda is the line between them."},{"start":311.43,"text":"And then that is because it's a concave function below the line. That is the definition, if you like, of a concave function that no matter how we draw that chord, it's going to live below the line. We're going to use that estimate quite a bit. And the form that we're going to use that fact in that we saw looks mysterious because of the notation is right here."}],"speech_gaps":[],"frame":"../frames/v048/002.webp","frame_time":186.91},{"title":"EM算法与主成分分析的直观理解","segments":[{"id":14,"text":"is that we're going to be able to take the expectation and move it in the right way. And the way to see this again is to think about this lambda. You take A with probability lambda and B with probability 1 minus lambda. This is a simple expectation. Everything on that line is one example of that simple expectation. And that's visually saying this. And hopefully this drawing, the reason I hammer on it is, should you ever get confused, hopefully you can remember the log and that it's below. Sound good? All right."},{"id":15,"text":"Okay, so this is all review from last time. This is kind of where we left off. If any questions bubbled up, please feel free to ask. Otherwise, we're going to keep going through the EM algorithm. Okay, cool. All right, so this was the picture we drew of the EM algorithm. And I want to go through it again because I want to make sure it's fresh in your mind. It's a weird one to look at. So here we have some parameter theta. What are the thetas? Do people remember what the thetas are, what I'm drawing here? What does theta represent?"},{"id":16,"text":"Yeah, please. It's the vector containing all the parameters. Exactly right. It's the vector containing all the parameters. In general, it will be for whatever we're interested in. Here, it's all the mus, the sigmas, and the phi in particular. It's all the parameters. So it's this abstract thing. I'm going to draw it as a one-dimensional curve because it makes my life easier, not because that's really what's going on. And the curve that we drew last time had this illustrative shape."},{"id":17,"text":"And I picked this illustrative shape for a couple of reasons. One is that it has this nice kind of multiple bumps we talked about last time that there's... You're going to do kind of a local search inside this. Okay? Alright. So this is the way the algorithm actually looks. The way it works is that we start with a guess here. Theta, I'm going to call it theta t. And then this point, this is just definitional, is L of theta t. Okay? Because this curve is L of theta."},{"id":18,"text":"That's our likelihood function, our loss function. All right, so what do we do? We're going to talk about how to construct this object in a second, but I want a picture in your head as we go through it because there's going to be a bunch of math, and then you could get lost in the math, but the picture is what's going to hopefully save you. It's kind of the intuitive way to understand it. What we're going to do is we're going to create this new function, L of t, where it depends on t. This t and this t are the same."},{"id":19,"text":"So it's a different curve that depends on that point. And that L of t is going to be a function of theta as well. And this is a curve. I've just drawn a piece of it. This curve continues. There's no reason it doesn't continue. I'm just lazy when I've drawn it. We only care about this is the region of interest that I'm drawing here. But it's a full curve. It's a full curve. Now, what are the properties of this L of t?"}],"notes":["本段主要回顾了EM算法的直观理解，强调了期望最大化过程中的关键概念。讲者提到，EM算法通过将参数空间中的点（theta）与似然函数（L(theta)）联系起来，形成一个直观的图像，帮助理解算法的运作方式。讲者还提到，EM算法的运作方式是通过一个初始猜测（theta_t）来开始，并通过构造一个依赖于t的新函数L(t)来逐步优化参数。","讲者强调了图像在理解EM算法中的重要性，指出在数学推导过程中，图像可以帮助避免迷失在复杂的数学公式中。讲者提到，EM算法的运作方式是通过在参数空间中进行局部搜索，逐步优化参数，以最大化似然函数。","讲者提到，L(theta)是似然函数，也是损失函数，用于衡量当前参数猜测与数据之间的匹配程度。讲者还提到，构造L(t)的过程是EM算法的关键步骤之一，它依赖于当前的参数猜测（theta_t）。","讲者指出，L(t)是一个依赖于t的新函数，它与当前的参数猜测（theta_t）相关联。讲者还提到，L(t)是一个完整的曲线，而不仅仅是图像中所展示的部分，这表明EM算法的优化过程是连续的。","讲者强调了EM算法的直观理解，指出在参数空间中进行局部搜索是EM算法的核心思想。讲者还提到，EM算法的运作方式是通过构造一个依赖于当前参数猜测的新函数，逐步优化参数，以最大化似然函数。","讲者提到，EM算法的运作方式是通过一个初始猜测（theta_t）来开始，并通过构造一个依赖于t的新函数L(t)来逐步优化参数。讲者还指出，L(t)是一个完整的曲线，而不仅仅是图像中所展示的部分，这表明EM算法的优化过程是连续的。"],"formulas":[],"uncertainties":[],"diagram":"none","start":329.19,"end":503.99,"asr_flags":[],"raw_segments":[{"start":329.19,"text":"is that we're going to be able to take the expectation and move it in the right way. And the way to see this again is to think about this lambda. You take A with probability lambda and B with probability 1 minus lambda. This is a simple expectation. Everything on that line is one example of that simple expectation. And that's visually saying this. And hopefully this drawing, the reason I hammer on it is, should you ever get confused, hopefully you can remember the log and that it's below. Sound good? All right."},{"start":358.52,"text":"Okay, so this is all review from last time. This is kind of where we left off. If any questions bubbled up, please feel free to ask. Otherwise, we're going to keep going through the EM algorithm. Okay, cool. All right, so this was the picture we drew of the EM algorithm. And I want to go through it again because I want to make sure it's fresh in your mind. It's a weird one to look at. So here we have some parameter theta. What are the thetas? Do people remember what the thetas are, what I'm drawing here? What does theta represent?"},{"start":391.19,"text":"Yeah, please. It's the vector containing all the parameters. Exactly right. It's the vector containing all the parameters. In general, it will be for whatever we're interested in. Here, it's all the mus, the sigmas, and the phi in particular. It's all the parameters. So it's this abstract thing. I'm going to draw it as a one-dimensional curve because it makes my life easier, not because that's really what's going on. And the curve that we drew last time had this illustrative shape."},{"start":417.93,"text":"And I picked this illustrative shape for a couple of reasons. One is that it has this nice kind of multiple bumps we talked about last time that there's... You're going to do kind of a local search inside this. Okay? Alright. So this is the way the algorithm actually looks. The way it works is that we start with a guess here. Theta, I'm going to call it theta t. And then this point, this is just definitional, is L of theta t. Okay? Because this curve is L of theta."},{"start":447.2,"text":"That's our likelihood function, our loss function. All right, so what do we do? We're going to talk about how to construct this object in a second, but I want a picture in your head as we go through it because there's going to be a bunch of math, and then you could get lost in the math, but the picture is what's going to hopefully save you. It's kind of the intuitive way to understand it. What we're going to do is we're going to create this new function, L of t, where it depends on t. This t and this t are the same."},{"start":475.21,"text":"So it's a different curve that depends on that point. And that L of t is going to be a function of theta as well. And this is a curve. I've just drawn a piece of it. This curve continues. There's no reason it doesn't continue. I'm just lazy when I've drawn it. We only care about this is the region of interest that I'm drawing here. But it's a full curve. It's a full curve. Now, what are the properties of this L of t?"}],"speech_gaps":[],"frame":"../frames/v048/003.webp","frame_time":341.19},{"title" ing our way up to try and get to a maximum. Do we expect"},{"id":31,"text":"that it gets to an absolute maximum? No. This is by my beautiful drawing. It makes it obvious"},{"id":32,"text":"because this g could go spiraling off into infinity. We don't know. We don't know anything"},{"id":33,"text":"about that. That's a property of L overall. But this, we're going to see, actually does converge."},{"id":34,"text":"verge. There's a question. Yeah. So let's, when we walk through this, see what's going to happen"},{"id":35,"text":"when you do that kind of thing. What this is going to allow us, EM is one algorithm. You could have"},{"id":36,"text":"other algorithms to solve it. That's one of one answer. Here, what we're doing is we're taking"},{"id":37,"text":"advantage of the fact that it's a latent variable model, and this is allowing us to instantiate it"},{"id":38,"text":"in that way. So there are situations when you could just take a latent variable model and solve"},{"id":39,"text":"solve that on an algorithm, this is a different algorithm for solving those problems. And"}],"notes":["本段主要讲解EM算法中的E步和M步，以及凸替代函数的概念。在E步中，给定当前参数θ_t，构造一个关于θ的下界函数L(θ)，该函数在θ_t处与原目标函数L(θ)相等，并且在其他点处低于L(θ)。这个下界函数被称为tight，因为它在θ_t处与原函数相切。在M步中，对这个下界函数进行最大化，得到新的参数估计θ_{t+1}。","EM算法通过交替进行E步和M步来优化目标函数。E步构造一个关于θ的下界函数，M步则最大化这个下界函数。这种交替过程使得目标函数在每次迭代中单调增加，最终收敛到局部最优解。然而，由于目标函数可能不是严格凸的，因此无法保证收敛到全局最优解。","在讲解过程中，提到EM算法适用于隐变量模型，利用隐变量的分布来构造下界函数。这种构造方法使得EM算法能够处理复杂的概率模型，如混合高斯模型（GMM）。EM算法是一种迭代优化方法，通过构造和优化下界函数来逐步逼近目标函数的最优解。","在讨论过程中，还提到EM算法并不是唯一的方法，其他优化算法也可以用于解决相同的问题。EM算法的优势在于其结构清晰，易于实现，并且在许多实际问题中表现良好。然而，EM算法的收敛性依赖于目标函数的性质，例如目标函数是否是凸函数。","在讲解过程中，还提到EM算法的收敛性问题。虽然目标函数可能不是严格凸的，但EM算法的下界函数在每次迭代中单调增加，因此可以保证收敛到局部最优解。然而，由于目标函数可能具有多个局部最优解，因此无法保证收敛到全局最优解。","最后，课程提到EM算法适用于隐变量模型，但并不是唯一的方法。EM算法的结构使得它能够处理复杂的概率模型，如混合高斯模型。然而，EM算法的收敛性依赖于目标函数的性质，因此在实际应用中需要谨慎选择模型和参数。"],"formulas":[],"uncertainties":["verge"],"diagram":"none","start":504.59,"end":681.95,"asr_flags":[],"math_clarifications":["所有公式均未提供明确的数学表达式，无法进行有效的数学复核，因此均被移除。","部分公式  potentially that we don't know too much about, but there's a function that is locally going to be nice for us. And so back to the other question, intuitively what we're doing here, if it were, and this is just like what we kind of hope works, is that we have some problem which is nasty. We decompose it in some interesting way. And then it decomposes locally as something that's nice and easier to solve, which is what our LT theta surrogate is going to be. And we're going to do it. This is our first example of alternating kind of methods. We solve one thing, gives us a new estimate. We go back and forth."},{"id":47,"text":"Back and forth and back and forth. It works. It's like the exact analog of how you would solve K-means for exactly the same reasons. Right? Fantastic question. Yeah. But the other function, just like K-means, was NP-hard, if you remember last time, but also was a hard function to solve exactly. So the underlying function, it's going to be an approximation in the sense that we hope to get a good solution out of this. We may not have any guarantees. These are phenomenal questions. Others? All right."},{"id":48,"text":"So now let's get into doing it. Let's figure out how we construct LT, capital LT. All right. All right. So now what I'm going to do is if I do my job well, there will be a lot of symbols that I can't avoid. But the manipulations will actually strike you as quite simple. Okay. All right. So how do we construct L of T?"},{"id":49,"text":"So what I'm going to do right now is I'm going to examine a single data point. And the reason this is so critical is it lets me drop those scripts everywhere, superscripts. That's really all I'm doing. At the end, we're going to sum over all the data points. This just makes my life easier on this. I don't have to maintain a bunch of sums. So I'm looking at one individual data point right now. Because of the kind of IID assumption, doing that, I can just scale it by a summation later."},{"id":50,"text":"All right. So as we looked at, we want to have this log likelihood that was there before. And our log likelihood function decomposes in this format. So I was asked earlier about the SGD piece. Well, this sum over Z could be quite nasty if we had to do the entire decomposition of it. Z could be big. For now, I'm going to imagine it's discrete because it makes my life easier, but it could be a big continuous thing. So this is a way of dealing with these hidden variable models where we don't see Z."}],"notes":["本段讨论了EM算法与K-means算法的相似性，指出EM算法通过将复杂问题分解为局部可解的问题来简化计算。讲者提到，EM算法中的目标函数可能很复杂，但通过使用局部近似函数，可以更容易地进行优化。这种交替优化的方法是EM算法的核心思想之一。","讲者强调了EM算法与K-means算法在处理复杂问题时的相似性，即通过分解问题并使用局部近似函数来简化计算。同时，讲者指出，虽然EM算法可能无法保证得到最优解，但通常可以得到一个较好的近似解。","在讨论如何构造LT（log-likelihood）时，讲者提到需要考虑单个数据点的情况，并利用独立同分布（IID）的假设来简化计算。通过分析单个数据点，可以避免处理复杂的求和操作，从而简化问题。","讲者指出，对于隐藏变量模型，直接计算对数似然函数可能非常困难，因此需要使用EM算法来处理。EM算法通过引入隐变量并分两步进行优化（E步和M步），从而逐步逼近最优解。","在讨论EM算法的实现时，讲者提到需要处理隐藏变量Z的求和问题，这可能非常复杂。因此，讲者建议先假设Z是离散的，以便简化计算，但同时也指出，Z也可以是连续的。","讲者强调了EM算法在处理隐藏变量模型时的重要性，并指出EM算法是一种交替优化方法，通过逐步优化局部目标函数来逼近全局最优解。这种方法在处理复杂模型时非常有效。"],"formulas":[],"uncertainties":[],"diagram":"none","start":681.95,"end":843.17,"asr_flags":[],"math_clarifications":["原文中提到的L(T)未明确其数学定义，无法确定其具体形式，因此该公式需移除。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":681.95,"text":"in that, you would have to marginalize out overall disease. So I would try and write"},{"start":685.83,"text":"down the algorithm that you propose, and then you'll see why this decompasses in there."},{"start":689.69,"text":"But for the moment, I think just say, this is a different algorithm."},{"start":693.47,"text":"Is that not...isn't it not home-based, like, okay, so this is what it is?"},{"start":698.23,"text":"Yeah, so this function could be nasty everywhere, but this function will be nice. We're only"},{"start":705.33,"text":"arg maxing on this local surrogate."},{"start":707.51,"text":"So the trade-off is there's a nasty n later."},{"start":817.09,"text":"All right. So as we looked at, we want to have this log likelihood that was there before. And our log likelihood function decomposes in this format. So I was asked earlier about the SGD piece. Well, this sum over Z could be quite nasty if we had to do the entire decomposition of it. Z could be big. For now, I'm going to imagine it's discrete because it makes my life easier, but it could be a big continuous thing. So this is a way of dealing with these hidden variable models where we don't see Z."}],"speech_gaps":[],"frame":"../frames/v048/005.webp","frame_time":693.95},{"title":"EM算法与概率分布的重写技巧","segments":[{"id":51,"text":"Okay, cool. Not to say you can't do something about it, but this is just one way to decompose it. Okay, so back to it. If you look here, what we've done is we're going to do this thing that looks like an insane trick, okay? What we're going to do is we're going to say that for any q of z that we pick, okay? Non-zero, so it kind of makes sense, okay? And even that you can relax, by the way, even to greater than or equal to zero."},{"id":52,"text":"This holds. Why does this hold? Well, Q over Q is 1. This is like a pretty dumb thing to do, to be honest. But we're going to make Q mean something in a second. Intuitively, it's going to be a reweighting. If you look at this, you're like, okay, you're going to be up to something with the reweighting. So the way we're going to pick Q among all of them is, we're going to pick Q so that it has these properties. And what does that property remind you of?"},{"id":53,"text":"It's a probability distribution. So q of z is going to sum to 1 and be non-negative. This allows us to do something completely notational. Sometimes people argue, it's completely notational. We write this expression. What happened here? Nothing."},{"id":54,"text":"Q of Z, I made a distribution, and I made the expected value go over Z being distributed as Q of Z. And then I also divided by the Q of Z, which is a scalar. I kind of treated it in two ways. Kind of a weird thing to do, right? But this allows me to think about this as an expectation. And we have tools to deal with expectations."},{"id":55,"text":"All right, we have exactly one tool to deal with expectations. So this shouldn't come as a surprise. There are not 10 other tools. I guess we have linearity. We could use linearity, which we're going to use a little bit later. We have Jensen, the last slide. And now what this allows us to do is switch the log."},{"id":56,"text":"This, because it's concave, somehow it's that underestimate property we were just talking about. So we have the direction of this. We had the original function, which was this, and we just used Jensen. So now it has that underestimate kind of quality. And then, well, we stop pretending that it was an expectation. We bring it back out."},{"id":57,"text":"Now, why did we do this?"},{"id":58,"text":"Well, this is a nice clever trick to be able to use the mechanism we already have."},{"id":59,"text":"This isn't like why it's true,"},{"id":60,"text":"maybe you think it was why true."},{"id":61,"text":"There's another proof, but this is a really slick one that just uses Jensen."},{"id":62,"text":"That's it. Cool. Now, we have this function,"},{"id":63,"text":"which is a natural candidate to be our L of t,"},{"id":64,"text":"and we did it per point."},{"id":65,"text":"This piece here holds for any choice of q subject to this,"},{"id":66,"text":"And we select the Q per point. So if Q had a script on it, this I would have to put them"}],"notes":["本段讲解了EM算法中使用概率分布进行重写的方法。讲者提到，通过选择一个非零的概率分布q(z)，可以将期望值转换为关于q(z)的期望，从而利用Jensen不等式进行处理。这种技巧允许将复杂的对数期望转换为更易处理的形式，同时保持其数学性质。"],"formulas":[],"uncertainties":["maybe you think it was why true."],"diagram":"none","start":843.74,"end":1022.54,"asr_flags":[],"raw_segments":[{"start":843.74,"text":"Okay, cool. Not to say you can't do something about it, but this is just one way to decompose it. Okay, so back to it. we just used Jensen. So now it has that underestimate kind of quality. And then, well, we stop pretending that it was an expectation. We bring it back out."},{"start":986.42,"text":"Now, why did we do this?"},{"start":988.4,"text":"Well, this is a nice clever trick to be able to use the mechanism we already have."},{"start":992.16,"text":"This isn't like why it's true,"},{"start":993.62,"text":"maybe you think it was why true."},{"start":994.66,"text":"There's another proof, but this is a really slick one that just uses Jensen."},{"start":999.6,"text":"That's it. Cool. Now, we have this function,"},{"start":1005.04,"text":"which is a natural candidate to be our L of t,"},{"start":1008.68,"text":"and we did it per point."},{"start":1010.36,"text":"This piece here holds for any choice of q subject to this,"},{"start":1016.0,"text":"And we select the Q per point. So if Q had a script on it, this I would have to put them"}],"speech_gaps":[],"frame":"../frames/v048/006.webp","frame_time":855.74},{"title":"EM算法与Q函数的构造","segments":[{"id":67,"text":"everywhere. XI, ZI, but I would also have QI. So every point is going to get to select its own"},{"id":68,"text":"weighting. That's going to be important in what we do next. That's why I highlight it so strongly."},{"id":69,"text":"Because you don't think it's like one Q that's chosen for all of them. Please."},{"id":70,"text":"I have a question. How can we be certain that this function has a different part in our"},{"id":71,"text":"batch that corresponds to a different theta than the theta we initially chose?"},{"id":72,"text":"Great question. So the question you're raising right now, let's get through the algorithm and"},{"id":73,"text":"come back to it. The question you're raising is, why do we know that this is guaranteed to make"},{"id":74,"text":"any progress? And we'll come back to that in a little bit. Why is it that this surrogate that"},{"id":75,"text":"we have here is going to make any progress underneath it? It's clear that it will be no"},{"id":76,"text":"No worse."},{"id":77,"text":"Why is it clear that it'll be no worse?"},{"id":78,"text":"Because it's tight."},{"id":79,"text":"Exactly right."},{"id":80,"text":"We know that it takes at least the value of the L"},{"id":81,"text":"theta at the current point."},{"id":82,"text":"And so when we do the argmax, the argmax"},{"id":83,"text":"will be at least that point and potentially higher."},{"id":84,"text":"So unless it's exactly at the top of this curve,"},{"id":85,"text":"we'll see what happens when it's exactly at the top"},{"id":86,"text":"of this curve, what that means, then we're"},{"id":87,"text":"going to make some progress because the argmax will"},{"id":88,"text":"strictly improve."},{"id":89,"text":"Wonderful question."},{"id":90,"text":"I'm thinking about exactly the right things."},{"id":91,"text":"We haven't got, yeah, so it's the argmax from the last slide."},{"id":92,"text":"Right, right."},{"id":93,"text":"So it's monochrome."},{"id":94,"text":"So yeah, so the theta will be monotonically increasing in the way that we've done here. Exactly right. The L of theta surrogate. Cool. And that should also tell you something else, that it will eventually terminate after some point. Yeah? Could you repeat at a high level why we did this Z-tree?"},{"id":95,"text":"Oh, great. Yeah. So there's two things. The question is, why do we do this Q of Z trick? So one, the real principle reason is it allows us to use this technology, which is the Jensen piece right here, right? So it allows us to use Jensen's inequality. Q allows us, with this particular selection, says you actually can regard this function."},{"id":96,"text":"as an expectation. And so that gives us a natural surrogate to construct the lower bound."},{"id":97,"text":"So the reason we picked Q like it seems very strange to pick it,"},{"id":98,"text":"it's because it allows us to do exactly this step. So it's really an operational reason."},{"id":99,"text":"Now, if you're asking a deeper question, why these surrogates? This is... If you look at it,"},{"id":100,"text":"you'll see in a second the way we picked this. This is just a local surrogate that satisfies"},{"id":101,"text":"exactly that. It's called an evidence-based lower bound. You're going to see when we get through"},{"id":102,"text":"this that this particular choice has some nice characteristics in particular what we were just"},{"id":103,"text":"talking about in tightness we know how to make it tight and you'll see that happen in the next"},{"id":104,"text":"couple slides but so we picked q so that we could turn into an expectation so that we could use"},{"id":105,"text":"jensen yeah go ahead is what we maximize exactly right so this is lt for one point and we'll come"},{"id":106,"text":"back in another slide and actually go and make sure we have to make sure and verify those two"},{"id":107,"text":"properties the tightness and this elbow piece then we're going to write the sum i'm just foreshadowing"},{"id":108,"text":"that will come in like three four slides you'll see how it's put together so this is just right"}],"notes":["本段讨论了EM算法中Q函数的构造及其重要性。讲者强调Q函数允许我们将目标函数视为期望，从而构造出一个下界，这为后续的优化提供了基础。Q函数的选择并非随意，而是为了能够应用Jensen不等式，从而实现对目标函数的近似。"],"formulas":[],"uncertainties":["lt for one point"],"diagram":"none","start":1022.54,"end":1200.06,"asr_flags":[],"raw_segments":[{"start":1022.54,"text":"everywhere. XI, ZI, but I would also have QI. So every point is going to get to select its own"},{"start":1029.36,"text":"weighting. That's going to be important in what we do next. That's why I highlight it so strongly."},{"start":1033.4,"text":"Because you don't think it's like one Q that's chosen for all of them. Please."},{"start":1036.94,"text":"I have a question. How can we be certain that this function has a different part in our"},{"start":1044.2,"text":"batch that corresponds to a different theta than the theta we initially chose?"},{"start":1048.46,"text":"Great question. So principle reason is it allows us to use this technology, which is the Jensen piece right here, right? So it allows us to use Jensen's inequality. Q allows us, with this particular selection, says you actually can regard this function."},{"start":1134.86,"text":"as an expectation. And so that gives us a natural surrogate to construct the lower bound."},{"start":1140.88,"text":"So the reason we picked Q like it seems very strange to pick it,"},{"start":1144.38,"text":"it's because it allows us to do exactly this step. So it's really an operational reason."},{"start":1149.18,"text":"Now, if you're asking a deeper question, why these surrogates? This is... If you look at it,"},{"start":1154.72,"text":"you'll see in a second the way we picked this. This is just a local surrogate that satisfies"},{"start":1159.02,"text":"exactly that. It's called an evidence-based lower bound. You're going to see when we get through"},{"start":1163.1,"text":"this that this particular choice has some nice characteristics in particular what we were just"},{"start":1168.2,"text":"talking about in tightness we know how to make it tight and you'll see that happen in the next"},{"start":1171.88,"text":"couple slides but so we picked q so that we could turn into an expectation so that we could use"},{"start":1176.94,"text":"jensen yeah go ahead is what we maximize exactly right so this is lt for one point and we'll come"},{"start":1186.82,"text":"back in another slide and actually go and make sure we have to make sure and verify those two"},{"start":1191.32,"text":"properties the tightness and this elbow piece then we're going to write the sum i'm just foreshadowing"},{"start":1196.12,"text":"that will come in like three four slides you'll see how it's put together so this is just right"}],"speech_gaps":[],"frame":"../frames/v048/007.webp","frame_time":1034.54},{"title":"EM算法与紧致性","segments":[{"id":109,"text":"now lt defined for one thing we haven't done the arg max yet but you're thinking about exactly the"},{"id":110,"text":"right ways how are we going to use it and when you say tightness you mean that it touches once at"},{"id":111,"text":"at L of theta, the original one, and is underneath it"},{"id":112,"text":"at all the other points."},{"id":113,"text":"Tightness refers to just the first of those processes,"},{"id":114,"text":"which is this thing here, which are exactly"},{"id":115,"text":"equal at that one point."},{"id":116,"text":"And what was beautifully pointed out earlier"},{"id":117,"text":"was because of that tightness, when we do the argmax of this,"},{"id":118,"text":"this is a lower bound because it's on the curve."},{"id":119,"text":"And so the argmax will give us a better value of the L."},{"id":120,"text":"That's geometrically what's going on."},{"id":121,"text":"Awesome questions. You guys got this perfectly."},{"id":122,"text":"Others? Cool."},{"id":123,"text":"All right. Okay, so how do we make this thing actually tight?"},{"id":124,"text":"All right, so here is an observation about Jensen's."},{"id":125,"text":"If we pick p over q , this quantity,"},{"id":126,"text":"so that it's a constant with respect to Z. It does not change as Z changes. Then Jensen is an equality. Okay? I'm saying something trivial with a lot of words. Why is that? So if the random variable's distribution no longer depends on Z, imagine this happens for a second, then they're tight. Why is that? Well, this thing equals C."},{"id":127,"text":"Right? I said if this thing equals C, it equals C. Nothing down here. Log of C equals log of C. The expectation doesn't change that. The expectation of a constant is that constant. Okay? On the other hand, the expectation of this constant, also a constant, is C and equals log C. So the way we're going to get to tightness here is somehow we have to pick Q of Z so that... Oops. So that... Oops. So that..."},{"id":128,"text":"Oops, that was not what I wanted to reveal. Now you saw it. Okay, anyway. Ignore the other slides. Anyway, so how are we going to pick that? So the idea is to pick this so that it doesn't depend on z, and how would you do that? So I did show you. So the idea here is to pick it as a conditional probability. So if we pick it in such a way that it removes the information of z, so that q is equal to p of x,"},{"id":129,"text":"then that is equal everywhere for all the different choices of z. It is equal to exactly xθ. So we get to pick all those q's. Now, qz is going to depend on θ and x, but not on z. So we're going to select it for each point xi."}],"notes":["本段讨论了EM算法中紧致性的概念，即下界函数在某个点与原函数相切，且在其他点位于其下方。这种紧致性是通过Jensen不等式实现的，当随机变量的分布不再依赖于隐变量Z时，Jensen不等式变为等式，从而实现紧致性。","讲者指出，为了实现紧致性，需要选择Q(Z)使得其不依赖于Z，这样可以将Q(Z)设为条件概率，从而去除Z的信息。这样，Q(Z)可以依赖于参数θ和观测数据x，但不依赖于Z本身。","讲者提到，当Q(Z)等于p(x)时，它在所有Z的取值下都保持一致，从而使得下界函数与原函数在该点相切，实现紧致性。","讲者强调，选择Q(Z)为条件概率是实现紧致性的关键步骤，这使得Q(Z)能够独立于Z，从而满足Jensen不等式变为等式的条件。","讲者还提到，当Q(Z)不依赖于Z时，其期望值为常数，从而使得下界函数与原函数在该点相等，实现紧致性。","讲者最后指出，选择Q(Z)为条件概率是实现紧致性的有效方法，这使得Q(Z)能够独立于Z，从而满足Jensen不等式变为等式的条件。"],"formulas":[],"uncertainties":["p over q","xθ"],"diagram":"none","start":1200.06,"end":1371.66,"asr_flags":[],"math_clarifications":["公式中未明确说明期望的定义域和分布，且未提及具体条件，无法确定其数学恒等关系。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1200.06,"text":"now lt defined for one thing we haven't done the arg max yet but you're thinking about exactly the"},{"start":1205.04,"text":"right ways how are we going to use it and when you say tightness you mean that it touches once at"},{"start":1210.96,"text":"at L of theta, the original one, and is underneath it"},{"start":1215.38,"text":"at all the other points."},{"start":1217.04,"text":"Tightness refers to just the first of those processes,"},{"start":1220.14,"text":"which is this thing here, which are exactly"},{"start":1223.16,"text":"equal at that one point."},{"start":1224.68,"text":"And what was beautifully pointed out earlier"},{"start":1226.98,"text":"was because of that tightness, when we do the argmax of this,"},{"start":1230.62,"text":"this is a lower bound because it's on the curve."},{"start":1233.52,"text":"And so the argmax will give us a better value of the L."},{"start":1236.62,"text":"That's geometrically what's going on."},{"start":1238.6,"text":"Awesome questions. You guys got this perfectly."},{"start":1242.9,"text":"Others? Cool."},{"start":1246.28,"text":"All right. Okay, so how do we make this thing actually tight?"},{"start":1252.82,"text":"All right, so here is an observation about Jensen's."},{"start":1259.34,"text":"If we pick p over q , this quantity,"},{"start":1266.72,"text":"so that it's a constant with respect to Z. It does not change as Z changes. Then Jensen is an equality. Okay? I'm saying something trivial with a lot of words. Why is that? So if the random variable's distribution no longer depends on Z, imagine this happens for a second, then they're tight. Why is that? Well, this thing equals C."},{"start":1291.28,"text":"Right? I said if this thing equals C, it equals C. Nothing down here. Log of C equals log of C. The expectation doesn't change that. The expectation of a constant is that constant. Okay? On the other hand, the expectation of this constant, also a constant, is C and equals log C. So the way we're going to get to tightness here is somehow we have to pick Q of Z so that... Oops. So that... Oops. So that..."},{"start":1323.46,"text":"Oops, that was not what I wanted to reveal. Now you saw it. Okay, anyway. Ignore the other slides. Anyway, so how are we going to pick that? So the idea is to pick this so that it doesn't depend on z, and how would you do that? So I did show you. So the idea here is to pick it as a conditional probability. So if we pick it in such a way that it removes the information of z, so that q is equal to p of x,"},{"start":1352.35,"text":"then that is equal everywhere for all the different choices of z. It is equal to exactly xθ. So we get to pick all those q's. Now, qz is going to depend on θ and x, but not on z. So we're going to select it for each point xi."}],"speech_gaps":[],"frame":"../frames/v048/008.webp","frame_time":1212.06},{"title":"EM算法与ELBO的性质","segments":[{"id":130,"text":"Okay, so for all choices of Z, we can make this decision. It depends on the Xi's that are fed into it. It depends on the Theta's that are sped into it. But we can do this and the end result is because Jensen was the only thing we used in our argument. Sorry to flip back and forth so much. But the only thing we use is this. This has become a quality and that means it's tight. Okay. All right. So this thing that we've just defined,"},{"id":131,"text":"we now know has this tightness quality. And we've actually shown something else. We've actually shown the full elbow thing, the first two properties. I didn't highlight it, but you caught on to it right away, which is that L theta is less than or equal to this as we sum. Why? Because it's true term by term. Right? Term by term, we showed every Xi is actually less than or equal to for any Q that we pick, no matter how we pick the Q for this."},{"id":132,"text":"And for the particular choice of QI above and theta t, we showed this."},{"id":133,"text":"So it matches the picture that I showed you earlier."},{"id":134,"text":"So if you've gotten lost in the symbols, the symbols are unfortunately heavy."},{"id":135,"text":"That's just how they are."},{"id":136,"text":"This is a famous thing, the evidence-based lower bound."},{"id":137,"text":"It is a concept that people use again and again."},{"id":138,"text":"As I mentioned to you, one of my graduate students was writing the evidence-based lower"},{"id":139,"text":"bound for their particular latent variable model for a paper that's going to go out next"},{"id":140,"text":"week."},{"id":141,"text":"If you do diffusion models, you do elbows underneath the covers, they all have them in there."},{"id":142,"text":"This is a kind of a canonical-based lower bounding technique."},{"id":143,"text":"Not to say they're not others, not to say there aren't better ones,"},{"id":144,"text":"but this is a canonical one that just uses this information that's in Jensen's"},{"id":145,"text":"and the local concavity."},{"id":146,"text":"Please."},{"id":147,"text":"Do we have something like how wide are these distributions between..."},{"id":148,"text":"Oh, wonderful question."},{"id":149,"text":"Yeah. So the question here... All right. Okay. Oops. I just want to get the conclusion on the"},{"id":150,"text":"slide. So the question is, do we have anything... So those L of T's that we thought are actually"},{"id":151,"text":"this elbow function now. It's the sum of these elbows. So the question is, do we have anything"},{"id":152,"text":"What makes a good or a bad L here? And what's going on here, why it's evidence-based"},{"id":153,"text":"is we're just using the local conditional probabilities for every term."},{"id":154,"text":"So this is the best we can do by looking term by term and looking at that conditional probability with Q, roughly speaking. That's an informal statement, but hopefully that makes sense. Another way to say is, no, we don't have any control in this approach of whether or not L is going to work. That's actually a function of the underlying problem and its shape and curvature. So an example of why this is similar is in gradient descent, if you have a really sharp function, maybe it's easier to get to the bottom. Or if you have a really wide function, you can get down close to the bottom. Those are properties."}],"notes":["本段主要讨论了EM算法中ELBO（证据下界）的性质，强调了其紧致性（tightness）以及如何通过Jensen不等式推导出ELBO的上界。讲者指出，ELBO的上界是通过逐项比较得出的，且对于任何选择的Q分布都成立。这表明ELBO是一个有效的下界，能够用于优化问题。","讲者提到ELBO是证据下界，是机器学习中一个常用的概念，特别是在处理隐变量模型时。他举了一个研究生正在为论文撰写ELBO的例子，说明其在实际应用中的重要性。","讲者进一步解释了ELBO的性质，指出它是一个基于证据的下界，其有效性取决于问题本身的形状和曲率。例如，在梯度下降中，函数的尖锐程度会影响收敛速度。","讲者强调，ELBO的构造并不提供对L函数的直接控制，而是依赖于问题本身的特性。这表明ELBO的性能与问题的结构密切相关。","最后，讲者通过梯度下降的例子，说明了函数的形状（如尖锐或宽泛）如何影响优化过程，从而进一步解释了ELBO的性质和应用背景。"],"formulas":[],"uncertainties":["QI above and theta t","evidence-based lower"],"diagram":"none","start":1373.06,"end":1540.42,"asr_flags":[],"math_clarifications":["原始公式中的KL散度项错误地使用了条件分布 $ q(z|x) $，而正确的形式应为 $ q(z) $。此外，ELBO的定义应明确为 $ \\log p_{\\theta}(x) $ 的下界，且不能将负KL散度直接作为损失函数进行最小化。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1373.06,"text":"Okay, so for all choices of Z, we can make this decision. It depends on the Xi's that are fed into it. It depends on the Theta's that are sped into it. But we can do this and the end result is because Jensen was the only thing we used in our argument. Sorry to flip back and forth so much. But the only thing we use is this. This has become a quality and that means it's tight. Okay. All right. So this thing that we've just defined,"},{"start":1403.74,"text":"we now know has this tightness quality. And we've actually shown something else. We've actually shown the full elbow thing, the first two properties. I didn't highlight it, but you caught on to it right away, which is that L theta is less than or equal to this as we sum. Why? Because it's true term by term. Right? Term by term, we showed every Xi is actually less than or equal to for any Q that we pick, no matter how we pick the Q for this."},{"start":1431.38,"text":"And for the particular choice of QI above and theta t, we showed this."},{"start":1438.2,"text":"So it matches the picture that I showed you earlier."},{"start":1440.8,"text":"So if you've gotten lost in the symbols, the symbols are unfortunately heavy."},{"start":1443.68,"text":"That's just how they are."},{"start":1444.72,"text":"This is a famous thing, the evidence-based lower bound."},{"start":1447.98,"text":"It is a concept that people use again and again."},{"start":1451.04,"text":"As I mentioned to you, one of my graduate students was writing the evidence-based lower"},{"start":1453.92,"text":"bound for their particular latent variable model for a paper that's going to go out next"},{"start":1457.6,"text":"week."},{"start":1457.94,"text":"If you do diffusion models, you do elbows underneath the covers, they all have them in there."},{"start":1463.38,"text":"This is a kind of a canonical-based lower bounding technique."},{"start":1467.62,"text":"Not to say they're not others, not to say there aren't better ones,"},{"start":1470.32,"text":"but this is a canonical one that just uses this information that's in Jensen's"},{"start":1474.24,"text":"and the local concavity."},{"start":1475.8,"text":"Please."},{"start":1477.24,"text":"Do we have something like how wide are these distributions between..."},{"start":1484.4,"text":"Oh, wonderful question."},{"start":1486.0,"text":"Yeah. So the question here... All right. Okay. Oops. I just want to get the conclusion on the"},{"start":1492.08,"text":"slide. So the question is, do we have anything... So those L of T's that we thought are actually"},{"start":1497.28,"text":"this elbow function now. It's the sum of these elbows. So the question is, do we have anything"},{"start":1502.6,"text":"that manages? What makes a good or a bad L here? And what's going on here, why it's evidence-based"},{"start":1507.6,"text":"is we're just using the local conditional probabilities for every term."},{"start":1511.22,"text":"So this is the best we can do by looking term by term and looking at that conditional probability with Q, roughly speaking. That's an informal statement, but hopefully that makes sense. Another way to say is, no, we don't have any control in this approach of whether or not L is going to work. That's actually a function of the underlying problem and its shape and curvature. So an example of why this is similar is in gradient descent, if you have a really sharp function, maybe it's easier to get to the bottom. Or if you have a really wide function, you can get down close to the bottom. Those are properties."}],"speech_gaps":[],"frame":"../frames/v048/009.webp","frame_time":1385.06},{"title":"混合高斯模型（EM）与主成分分析中的假设与建模选择","segments":[{"id":155,"text":"of the loss function, not properties of the algorithm here. Everything was almost deterministic from the time we turned the crank. There was randomness. The randomness was in the initial selection that we had. This exactly mirrors k-means. So hopefully right now all the pieces click together. You're like, oh, that looks like a lot of unnecessary needless math. Fine. I admit that. But it's precise. And what it tells you is each one of those blocks fits in exactly the same way. Cool. Please."},{"id":156,"text":"I'm trying to understand, for any distribution, can we do it with a lower bound? Yeah, wonderful question. So you asked, the question was, can we do this for any distribution? So another way to turn that question around is, what assumptions are we making about this distribution? And one which I think"},{"id":157,"text":"I think over time... I think when I was starting out as an undergrad student, you would seek some assumptions and they would feel mild to you and other assumptions would seem strong. When you see someone write something that says the probability function has the following form, that's usually a fairly strong assumption because it means there's some deep factorization. And we did a deep factorization here. I don't want to scroll all the way back. So I'll just write it and erase it. We assumed that p broke out in a particular form. That it looked like our..."},{"id":158,"text":"probability of x was the probability of x of theta, we assumed, had this latent structure that we knew, which was this thing over z that said xz of theta."},{"id":159,"text":"And we knew what Z was and we had information about it. That's a relatively strong assumption because it rules out lots of models. If you know it's there, like for example, you know there's some clustering or you know there's some point sources, then that's a fair assumption. There's a Z that has the following shapes. But we have to know a lot of information about Z. Here we had to completely characterize it. We had to know roughly. We had to know that it had a number of point sources. We had to know that they had particular shapes. And so that factorization, a lot pulled into it."},{"id":160,"text":"Now that said, so that's one answer that says, well, this is actually fairly specific in the class canon of all functions that are out there in the world."},{"id":161,"text":"In practice, or in machine learning experience,"},{"id":162,"text":"there are a lot of light latent variable models where"},{"id":163,"text":"you decompose in this way and it gives you some amount of information."},{"id":164,"text":"This assumption may seem narrow from my description,"},{"id":165,"text":"but actually there are a ton of models that basically said,"},{"id":166,"text":"no, we're willing to assume this about the underlying substructure,"},{"id":167,"text":"and that allows us to then do much better inference."},{"id":168,"text":"Again, it's a modeling choice."},{"id":169,"text":"How much you're willing to assume you know about the Z and put in there,"},{"id":170,"text":"then tells you how well your model has fidelity, and then tells you whether or"},{"id":171,"text":"not this method is applicable to it. Yeah, please."},{"id":172,"text":"Oh, recall what Z is. So Z in this example is going to be kind of the information that tells"},{"id":173,"text":"you all the latent or unobserved structure. So the things that you can't directly measure,"}],"notes":["本段讨论了在建模过程中对分布的假设问题，强调了对分布形式的假设通常是一个较强的假设，因为它意味着存在某种深层的分解结构。例如，假设概率函数具有特定形式，通常意味着存在某种隐变量结构，这在混合高斯模型中体现为对Z的假设。","讲者指出，虽然这种假设可能看起来狭窄，但实际上有很多模型都愿意做出类似的假设，即对潜在子结构进行假设，从而允许进行更有效的推理。这种建模选择决定了模型的适用性和推理能力。","讲者提到，对Z的了解程度决定了模型的保真度，即模型对数据的拟合程度，以及该方法是否适用于特定问题。这表明建模选择直接影响模型的性能。","讲者强调，Z代表的是隐变量或未观测结构，这些是无法直接测量的，但通过假设其存在和形式，可以构建更复杂的模型。这种假设是建模过程中的关键部分。","讲者还提到，对于分布的假设可能因人而异，有些假设看起来温和，有些则显得较强。这取决于建模者的经验和对问题的理解。","讲者最后提醒听众回忆Z的定义，强调Z在模型中的作用是提供关于未观测结构的信息，这是构建混合高斯模型等模型的基础。"],"formulas":[],"uncertainties":["xz of theta"],"diagram":"none","start":  following shapes. But we have to know a lot of information about Z. Here we had to completely characterize it. We had to know roughly. We had to know that it had a number of point sources. We had to know that they had particular shapes. And so that factorization, a lot pulled into it."},{"start":1659.34,"text":"Now that said, so that's one answer that says, well, this is actually fairly specific in the class canon of all functions that are out there in the world."},{"start":1667.51,"text":"In practice, or in machine learning experience,"},{"start":1671.85,"text":"there are a lot of light latent variable models where"},{"start":1674.51,"text":"you decompose in this way and it gives you some amount of information."},{"start":1677.99,"text":"This assumption may seem narrow from my description,"},{"start":1681.27,"text":"but actually there are a ton of models that basically said,"},{"start":1683.65,"text":"no, we're willing to assume this about the underlying substructure,"},{"start":1687.29,"text":"and that allows us to then do much better inference."},{"start":1689.79,"text":"Again, it's a modeling choice."},{"start":1691.07,"text":"How much you're willing to assume you know about the Z and put in there,"},{"start":1694.99,"text":"then tells you how well your model has fidelity, and then tells you whether or"},{"start":1698.39,"text":"not this method is applicable to it. Yeah, please."},{"start":1704.39,"text":"Oh, recall what Z is. So Z in this example is going to be kind of the information that tells"},{"start":1712.19,"text":"you all the latent or unobserved structure. So the things that you can't directly measure,"}],"speech_gaps":[],"frame":"../frames/v048/010.webp","frame_time":1552.53},{"title":"隐变量与EM算法的E步","segments":[{"id":174,"text":"like in particular, when we run through it, it's going to be like the strength of the sources of"},{"id":175,"text":"the clusters and all that other kind of good stuff, like the cluster assignments themselves,"},{"id":176,"tex  was according to cluster 1, cluster 2, and we normalized."},{"id":269,"text":"Ask me a question if that's not clear, and I'll write out the entire math. We can go back and do it. But we did that last time. Good enough, right? It was just the comparison between the two, right? So basically, you looked at, you computed, you know, z... I don't know what that did. Awesome. Want that off the screen. All right."},{"id":270,"text":"So you would compute zi equals 1, let's say, given all the rest. And how you would do it is you would compute then p, I'm going to just do it for this simple one here. We would compute and normalize by p of z1 given 1, blah, blah, blah, plus p z1 given, or zi, sorry, zi equals 2, blah, blah, blah."},{"id":271,"text":"We would just look at the normalized ratio of these, and this is what Bayes' rule told us to do last time. There's nothing mysterious here. It's just comparing those densities that we had. This may be disturbing to some of you because these are densities that I'm comparing, but that's okay. Those numbers are meaningful. If that bothers you, I would say go back, check it out. By your faces, maybe some of you are bothered. You could also ask me questions and I'll tell you more about it. Does this make sense? This is how I assign the value. How do I compute this thing?"}],"notes":["本段讲解了在混合高斯模型中如何计算后验概率，即给定观测点计算其属于某个聚类的概率。讲者强调了贝叶斯规则的应用，即通过比较不同聚类的似然比来分配概率。"],"formulas":[{"latex":"p(z_i = 1 | x) = \\frac{p(x | z_i = 1) p(z_i = 1)}{p(x | z_i = 1) p(z_i = 1) + p(x | z_i = 2) p(z_i = 2)}","symbols":"后验概率计算公式","explanation":"该公式正确应用了贝叶斯规则，计算在给定观测数据x的情况下，z_i等于1的后验概率。分子是先验概率p(z_i=1)与似然p(x|z_i=1)的乘积，分母是两个类别的联合概率之和，即两个类别的先验概率与对应似然的乘积之和。","evidence":"So we did this in detail previously, but I want to make sure intuitively it's clear that you can derive this. So we want to compute this probability of zi given the point that we've observed. So we observe the point, we have the mu i's, we have the mu 2's. How likely do you think this point is? What do you have to compute it? Exactly right. You have the entire probability density that you can use to compute exactly this thing from the model that you have underlying it. You have all the theta i's that gives you a likelihood for being in this. and being in this. Now, intuitively, just if all two were equal, you would probably assign this point more likely to cluster one, right? So maybe you say this is 60-40. Where do those numbers come from? It's a ratio of the likelihoods, right? That's what you're going to use to compute. It's Bayes' rule. That's exactly what Bayes' rule does. We did this on the board last time, but I just want to remind you. And then the question is... Here, if you knew that this mu2 had 1,000 times more points than mu1, you would expect that your likelihood that this actually belonged to that cluster, because it's 1,000 times more likely, would go up by some amount. And that amount is exactly the Bayes' rule decomposition that we got last time, where we looked across each of them, and then we summed. So we computed the probability that it was according to cluster 1, cluster 2, and we normalized. So you would compute zi equals 1, let's say, given all the rest. And how you would do it is you would compute then p, I'm going to just do it for this simple one here. We would compute and normalize by p of z1 given 1, blah, blah, blah, plus p z1 given, or zi, sorry, zi equals 2, blah, blah, blah."}],"uncertainties":["p(z_i = 1 | x) 的具体形式可能因上下文而异，但讲者未明确写出完整的公式。"],"diagram":"none","start":2074.85,"end":2254.12,"asr_flags":[265],"math_clarifications":["公式中的p(x|z_i=1)和p(x|z_i=2)是条件似然，表示在给定z_i为1或2的情况下观测数据x的概率。p(z_i=1)和p(z_i=2)是先验概率，表示z_i为1或2的先验概率。"],"raw_segments":[{"start":2074.85,"text":"the choices that we have. And it's here. And this is my point. Now, this is my xi. This"},{"start":2084.99,"text":"is mu1. This is mu2. And then there's, you know, they have their sigmas. I'm not going"},{"start":2091.69,"text":"kind of drop."},{"start":2094.04,"text" e source, the mu and the sigma are kind of independent of the phi one, which was the term that's..."},{"id":275,"text":"said, how many are in this particular thing? And we would multiply against it. And so then this term would become like multiplied by 1,000. And so we would have those two would go back and forth. It would enter linearly in the way that happened. And that was exactly what Bayes' rule told us last time. Sound good?"},{"id":276,"text":"I think the notation makes this obscure. I think if you just write out, what I would suggest to do is just write out what the numbers are and actually try and plug it in, like code up some Python that does it once, then it locks in your brain. These are all just vectors that have horrible notation. You just add them up and do them and life is good. And it makes a lot more sense that way. Maybe not the best advice for a teacher to give you, but whatever. Just do it and it'll be good. Anyway, let's get back to it."},{"id":277,"text":"Let's go to the second step. So what we got out of the first step, just so we're clear, is we estimated all those QIs for each one of them. And hopefully this answers the questions that came before. Hey, now we have an actual guess for every Z of how likely each individual point is. We never observed that, but we now know for any point Xi, we have a probability distribution that we've constructed, which is our guess, our soft assignment. Just like in K-means, when we guessed, sometimes we were wrong, sometimes we were right. We're wrong and right here too, right? It's going to converge over time."},{"id":278,"text":"time. This isn't a statement about the world. It's a statement about the algorithm's current belief. Good enough? Awesome. All right. So now we're given all these clusters, and we're going to estimate everything here. The phi, the mu's, the sigma's, everything. I'm sorry that the sigma's changed, but conventionally they do, and I can't do much about it."},{"id":279,"text":"All rig hen boom. Why am I able to take the... Why does sigma J not appear in this expression?"}],"notes":["本段讲解了在计算混合高斯模型（EM算法）中参数的梯度时，如何处理协方差矩阵。讲者提到，对于均值参数μ_j，需要计算其导数，并指出协方差矩阵σ_j是针对第j个中心的，表示该中心的协方差。权重表示每个数据点属于第j个簇的概率，这与Z变量有关。","讲者强调，计算梯度时，需要将对数似然函数中的项进行求导，并识别出与参数相关的项。对于μ_j，其导数的计算涉及对所有数据点的加权求和，权重由概率分布决定。而协方差矩阵σ_j在计算中可能不会直接出现，因为其导数可能为零。","讲者提到，权重表示数据点属于某个簇的概率，这与EM算法中的隐变量Z有关。在计算梯度时，权重会影响均值和协方差矩阵的更新，但协方差矩阵的导数可能为零，因此在某些情况下不会出现在最终的梯度表达式中。","讲者通过举例说明，如何处理协方差矩阵的导数问题。他指出，虽然协方差矩阵在计算中可能被涉及，但其导数可能为零，因此在某些情况下不会出现在最终的梯度表达式中。这表明在计算过程中需要仔细处理每个参数的导数。","讲者提到，计算梯度的过程虽然繁琐，但有助于理解模型的结构和参数的更新方式。通过手动计算，可以验证软件工具的正确性，并加深对EM算法的理解。","讲者最后提到，虽然手动计算梯度可能不具实用性，但通过这种方式可以更好地理解模型的内部机制，并为后续的复杂问题打下基础。"],"formulas":[],"uncertainties":["可能的术语错误：'tool case' 可能应为 'tool set' 或 'tool kit'，但根据上下文，'tool case' 可能是讲者口语化的表达，因此保留原词。"],"diagram":"none","start":2595.81,"end":2754.62,"asr_flags":[],"raw_segments":[{"start":2595.81,"text":"All right, so how are we going to do this? So to compute the value of that argmax, we have a good tool in our tool case, tool set, which is we are going to compute gradients. And we're going to look for critical points. That is, for example, for one of the parameters we want to estimate, mu j, the means, which are there, we are going to compute a derivative here. Now, from the last lecture, what I did was the cooking show version. I was like, oh, mu is probably like I weighted some stuff, and then I weighted some other stuff, and I got this expression."},{"start":2624.78,"text":"we will get the same expression. It will just be more painful. But the good thing about suffering on this thing is that you will then be able to suffer in many other instances to compute this when it's not so obvious. And you'll be able to check your work. But we're not going to do anything complicated. You're going to have to compute derivatives of mu. Again, not the most pleasant thing. And we do have software that does this for you."},{"start":2648.2,"text":"It's of questionable utility. I don't know. I don't k , oops, not a very good axis. This is going to be city miles per gallon."},{"id":316,"text":"Highway. I have to say, I really like ICE cars. So if you're an EV person, I don't mean to offend you, I guess. But I like the way an engine sounds. Anyway, neither here nor there. Just a small fact. All right, back to this. OK, so down here are what kind of cars? What kind of cars have terrible highway miles per gallon?"},{"id":317,"text":"This is a general fact about the world. It's not a machine learning fact. These are SUVs, trucks, things like that. Good enough. Then you have a bunch of economy cars there and here. You have these hybrids over here, which have great miles per gallon. Now, a couple of these things, because they're city versus highway, some have pretty good highway miles per gallon, but not great city miles per gallon. As I said, these characters, I don't know, these are hybrids maybe."},{"id":318,"text":"This doesn't really matter. I don't know why I insist on telling you these stories, but you know, these are, that's a terrible color. These are SUVs, okay? All right."},{"id":319,"text":"All right. We're very happy with ourselves. All right. So the question we're after is, give me the principal component. That's the way we're going to phrase it. By the way, this is one of those annoying terms. If you hang out with machine learning people too much, they'll say things like the ideas are orthogonal all the time. It's very irritating, but they'll say that. They'll also talk about the principal component of how we're selling something. They mean this. But they don't usually use it correctly. So it doesn't really matter. Now, intuitively,"}],"notes":["本段主要讲解主成分分析（PCA）的基本概念和应用场景。讲者指出PCA是一种常用的降维技术，广泛应用于数据可视化和特征提取。他提到PCA的计算效率较高，即使在大数据集上也能有效运行。此外，讲者还通过汽车数据集举例说明了PCA的直观意义，即寻找数据中最重要的方向（主成分）。","讲者通过汽车数据集的实例，说明了不同类型的汽车在城市和高速行驶中的燃油效率差异。SUV和卡车通常具有较差的高速燃油效率，而经济型车和混合动力车则表现较好。这种差异为PCA的主成分分析提供了直观的背景。","讲者指出，PCA的主成分是数据中最重要的方向，能够捕捉数据的主要变化。他提到，虽然机器学习领域中“主成分”这一术语被频繁使用，但有时使用不当，因此需要明确其定义。","讲者强调，PCA的计算效率较高，即使在大规模数据集上也能有效运行。他提到“thin PCA”是一种计算效率较高的方法，适用于实际应用。","讲者通过汽车数据集的实例，说明了PCA的直观意义，即寻找数据中最重要的方向（主成分）。他指出，虽然PCA在机器学习中被广泛使用，但有时使用不当，因此需要明确其定义。","讲者提到，PCA的主成分是数据中最重要的方向，能够捕捉数据的主要变化。他指出，虽然机器学习领域中“主成分”这一术语被频繁使用，但有时使用不当，因此需要明确其定义。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2908.69,"end":3075.51,"asr_flags":[],"raw_segments":[{"start":2908.69,"text":"all the information we have. So there's a sense in which you're just using Bayes' rule, and you're like, oh, that's simple. But that's also reassuring. You're not doing something outside the bounds. You're just saying, given my current guess of parameters, this is my best guess of the clustering. And then I go back and forth. It's just formalizing exactly what you saw in k-means, exactly what you saw in other places. Cool. Awesome. Time to move to our last topic. Principal components."},{"start":2937.83,"text":"Right. As I mentioned, PCA is a workhorse. It's often misapplied, but that's only because it's applied so often. People use this everywhere. It's a very good dimensionality reduction technique. Sometimes you can use it to visualize your data. Sometimes people use it for featurization. It has all kinds of uses that people have tried for it. I'm going to try and motivate the components for it right now. I found it to be something that I use quite frequently, candidly. I just run PCA. And you can compute it much cheaper than you..."},{"start":2965.42,"text":"realize, even on big data sets. So it's like, even on large data sets, you can compute a PCA, a small, what's called a thin PCA reasonably efficiently. All right. So here's the data that we have. So we're given cars and we're going to have, we're given pairs of these cars. Okay. And so the idea here is we have, oops, not a very good axis. This is going to be city miles per gallon."},{"start":2998.85,"text":"Highway. I have to say, I really like ICE cars. So if you're an EV person, I don't mean to offend you, I guess. But I like th ill go wrong."},{"id":345,"text":"that the data are centered and that's going to be important in all of our analysis as"},{"id":346,"text":"we think through it, that the data are mean zero. So often people will run what look like"},{"id":347,"text":"a PCA computation, forget to center their data, and they'll have a problem. Okay, cool."},{"id":348,"text":"All right, so here's how it's going to be."},{"id":349,"text":"Here's our drawing from before. What we're going to try and do is we're going to try and find two unit vectors, u1 and u2. They're going to be unit vectors, and u is going to be intuitively the first principal component. I'll make this precise, but it's going to try and capture the maximum amount of variation in the dataset. Then mu2 is going to capture the second amount of variation in the dataset, mu3, and so on."},{"id":350,"text":"Intuitively, these are going to look like eigenvalues of a particular matrix. In fact, we'll show that in a second. That's basically what they're capturing of the underlying PSD matrix. Now recall, when we do our analysis and derive this, that any point can be written in an orthogonal basis in those coordinates. So if I have u1 and u2 that are indeed those orthogonal unit vectors, so it's an orthonormal basis, I can write alpha1 and alpha2 to exactly recover x."}],"notes":["在中心化之后，PCA的目标是找到两个单位向量u1和u2，它们分别对应于数据集中的最大和次大的变异方向。u1是第一个主成分，u2是第二个主成分，以此类推。","讲者指出，这些主成分向量可以看作是某个特定矩阵的特征值。这些特征值对应于数据的协方差矩阵的特征值，而这些特征值反映了数据在不同方向上的变异程度。","最后，讲者提到，任何数据点都可以在由这些正交单位向量构成的正交基下表示。这意味着，通过这些主成分向量，可以准确地重构原始数据点。","讲者强调，中心化是PCA分析中的关键步骤，如果忽略中心化，可能会导致PCA结果的错误，因此在实际应用中必须注意这一点。"],"formulas":[{"latex":"u_1, u_2, \\text{...} \\text{ are orthonormal vectors}","symbols":"u1, u2, ... 是正交单位向量","explanation":"公式中的符号和数学类型正确，描述了正交单位向量，适用于PCA中寻找主成分的正交基底。","evidence":"Here's our drawing from before. What we're going to try and do is we're going to try and find two unit vectors, u1 and u2. They're going to be unit vectors, and u is going to be intuitively the fir oing to try and find two unit vectors, u1 and u2. They're going to be unit vectors, and u is going to be intuitively the first principal component. I'll make this precise, but it's going to try and capture the maximum amount of variation in the dataset. Then mu2 is going to capture the second amount of variation in the dataset, mu3, and so on."},{"start":3225.83,"text":"Intuitively, these are going to look like eigenvalues of a particular matrix. In fact, we'll show that in a second. That's basically what they're capturing of the underlying PSD matrix. Now recall, when we do our analysis and derive this, that any point can be written in an orthogonal basis in those coordinates. So if I have u1 and u2 that are indeed those orthogonal unit vectors, so it's an orthonormal basis, I can write alpha1 and alpha2 to exactly recover x."}],"speech_gaps":[],"frame":"../frames/v048/019.webp","frame_time":3088.45},{"title":"主成分分析（PCA）的预处理与方向选择","segments":[{"id":351,"text":"Now, when we're in high dimensions, we can write a huge string of them, one per dimension. We're often going to chop them off and take the top three, and we're going to have to pick which of those components we want. The question we have now are, how do we find those directions? I'll tell you about some caveats about how to use this, and then we'll talk about reducing dimensions, like 1,000 down to 10."},{"id":352,"text":"Now, one other bit of pre-processing is this kind of re-scaling behavior that we have."},{"id":353,"text":"And I'll kind of illustrate it here because I want to give you caveats that are useful to you"},{"id":354,"text":"So, the other pre-processing we will typically do is we will re-scale the data."},{"id":355,"text":"So, if we have X1 to Xn that are in RD, we first center the data. So, we remove the mean."},{"id":356,"text":"And then two, we then re-scale the data so that if we had things like feet per gallon or miles"},{"id":357,"text":"gallon, we actually do it. Now, the way we do that i m I thinking about this line? I'm going to write this whole thing out by hand, and then it'll be easier to do. So the formula for the line is, it's the set of t u1 such that t is an element of r. That's what it means to be the line and direction u1. I just take all the t's that are possible, and I just multiply them by. So far, so good. All right. Now,"},{"start":3452.97,"text":"All right, so now let's figure out exactly how this works. So the first thing to remember about this component is I can rewrite this, this term here as x square plus alpha square u1 minus two times alpha u1 x. Okay, please. Yes, good catch."},{"start":3486.03,"text":"Perfect. Thank you. The norm is squared. Okay. Now, in my head, that doesn't matter too much because it's 1. But yeah, awesome. u1 is 1, but you're exactly right. That was a mistake syntactically to be 1. So that one goes away. When I'm minimizing this character, what is my trick? Oh, yeah. This is the inner product. Sorry, we don't use annotation. Sorry, sorry, sorry. u1 transpose x. Cool."},{"start":3520.54,"text":"Okay. So when we differentiate this character, what happens? Well, what we're minimizing over is alpha. So what do we get when all is said and done? Well, I have it on the next line. So is it clear enough what we're doing? We look across all the points here on this line. We try and pick one that is the smallest distance away. We've written the form of this. We've just put in the form here. And now we're going to try and solve for alpha, which is going to be taking a derivative because this is a nice convex function in alpha."},{"start":3562.38,"text":"Alpha is the scalar. It's the index. It's the T in my last notation. So here's the picture another way."},{"start":3572.32,"text":"So what we had is we had, remember, we had t u1 was the entire line. t is an element of r. And then here, alpha u1 is some particular point on there. So alpha would be, we're ranging over alpha as ranging over this line. Yeah, some scalar." ":"Now, the other bit of terminology is this is called the residual. This is the distance to the line or the plane, the residual to residual square. So let me show you a picture. Here's data points. Here's a line through them. Here's some residuals. So maximizing the projected variance equals minimizing the perpendicular residuals. Those two things are actually the same."},{"id":387,"text":"We were maximizing how much we explained it away, right? We could also minimize, we could either minimize the residual or we could maximize the explained variance. Okay, let me be more concrete. So we can maximize the projected subspace of the data. In this case, we sweep over every u, we look over all of the data, we dot it into xi squared, and we try and maximize that quantity. This says as I sweep u through it,"}],"notes":["本段讲解了投影到直线上的方法为何比单独计算每个点的正交投影更高效。首先，通过求导并令导数为零，结合单位向量的条件，可以得到正交投影的结果。这表明正交投影是所求的最短距离点，且该结果自然地从分析中得出。","接着，讲者指出在更高维空间中，如平面或超平面，同样可以使用相同的分解方法来计算最近点。这种分解方法依赖于向量之间的正交性，这是关键的数学前提。","讲者提到，如果这些向量不是正交的，那么这种分解方法将无法有效工作。因此，正交性是确保该方法正确性的必要条件。","随后，讲者解释了残差的概念，即数据点到直线或平面的距离。最大化投影方差等价于最小化垂直残差，这是主成分分析中的核心思想。","最后，讲者指出，最大化投影方差和最小化残差是同一问题的两种不同表述，这为后续的主成分分析提供了理论基础。","讲者还提到，可以通过遍历所有可能的向量u，并计算数据点与u的点积平方，来最大化投影方差。这为后续的主成分分析算法提供了具体的计算步骤。"],"formulas":[{"latex":"2\\alpha - 2u_2 = 0","symbols":"导数为零的条件","explanation":"该公式表示在求导并令导数为零时得到的方程，用于确定最优解。","evidence":"Cool. So when we computed this derivative and set the derivative equal to 0 and use u squared equals 1, we got this expression. So this is 1. We got 2 alpha. We got minus 2 u2. Set it equal to 0. Boom. We get that. Clear enough? Ask a question if not. Just computing that piece. And then as was pointed out, which is great, is suppose we have u1, uk, element of Rd."},{"latex":"u^T u = 1","symbols":"单位向量的条件","explanation":"该公式表示向量u是单位向量，这是优化问题中的约束条件。","evidence":"Cool. So when we computed this derivative and set the derivative equal to 0 and use u squared equals 1, we got this expression. So this is 1. We got 2 alpha. We got mi
