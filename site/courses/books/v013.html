建，一直到顶部。这门课最终会以你实现自己的线性规划求解器或类似的东西结束。我们还没有完全确定，但无论如何，它会以你实现一个求解器作为结束。顺便说一句，这只是为了消除一些神秘感。","start":5.23,"end":33.91},{"id":1,"text":"Right. Just so when someone looks at you sometime in the future and says, oh, my God, you can't write your own LP solver. That's really complicated. And you could say, oh, contraire, I did it. Right. So that's the main thing, the main reason. But also there's interesting stuff. Right now we're at the bottom level, which is linear algebra. And actually, in some ways, it's by far the most important level. And my own feeling is.","zh":"对的。这样将来当有人在未来某一天看着你说，天啊，你写不出自己的线性规划求解器，那真的非常复杂。而你可以说，哦，相反，我做过了。对的。这就是主要的事情，主要的原因。但还有其他有趣的内容。我们现在处于最底层，也就是线性代数的层面。实际上，从某种意义上说，这是最重要的层面。我个人的感觉是。","start":34.2,"end":59.28},{"id":2,"text":"Everybody, certainly anybody in this class needs to know this material. Do you need to know a whole 10-week course that you would take on computational linear algebra? Maybe, actually. But certainly you need to be familiar with the ideas. And that's unlike, you don't have to know about computer architecture, even though everything we do is thanks to the people who design and build.","zh":"每个人，特别是这门课上的任何人，都需要了解这些内容。你们是否需要知道一个为期十周的计算线性代数课程的全部内容？也许，实际上。但至少你们需要熟悉这些概念。这与你们不需要了解计算机架构不同，尽管我们所做的一切都得益于那些设计和制造计算机的人。","start":59.74,"end":87.32},{"id":3,"text":"you know, computers and stuff. So, but this you actually should know. Okay. So back to the numerical linear algebra. And today, actually, we're going to cover material that is like, some of you may know, rest of you probably don't. And it is, I'd listed in the top 10 of the things you need to know from this course, even though it's not technically part of the course. So, okay. So here it is. Last time we talked about, you know, how do you solve a set of equations AX equals B?","zh":"你们知道，计算机和相关的东西。所以，但这些内容你们实际上应该了解。好的。那么回到数值线性代数。实际上，今天我们将要讲的内容，有些你们可能已经知道，而其他你们可能还不知道。它是我列出的这门课程中需要掌握的十大内容之一，尽管它并不严格属于课程内容。好的。那么，这里就是。上一次我们讨论了，你们知道，如何解一个方程组 AX 等于 B？","start":88.72,"end":117.22},{"id":4,"text":"And, you know, there are several ways. There's ones we're not going to talk about. There are iterative methods to do this, which are used for like super large scale problems. If you've got like a billion variables or if that represents like a PDE you're solving. Right. We're not going to talk about those. We're going to talk about these are what are called direct methods. I don't know where that name came from, but they're called direct. And the way they work is they take the matrix A and they first factor it into a product.","zh":"而且，你知道，有几种方法。有一些我们不会讨论。有迭代方法来做这件事，它们用于像超级大规模的问题。如果你有十亿个变量，或者它代表你正在解决的偏微分方程。对的。我们不会讨论这些。我们要讨论的是这些被称为直接方法。我不知道这个名字是怎么来的，但它们被称为直接方法。它们的工作方式是将矩阵A分解成一个乘积。","start":119.01,"end":146.79},{"id":5,"text":"of matrices, each of which, quote, is easy to invert, unquote. So that's the first step,","zh":"矩阵的乘积，其中每一个矩阵，引号，都是容易求逆的，引号。所以这是第一步，","start":147.26,"end":154.3},{"id":6,"text":"right? You've seen some of these factorizations, you know, like SVD, eigen decomposition.","zh":"对吧？你已经见过一些这样的分解，你知道，比如奇异值分解，特征值分解。","start":154.9,"end":158.7},{"id":7,"text":"You've probably seen a couple of the others as well. So an easy to invert is actually just,","zh":"你也可能见过其他的一些。所以容易求逆实际上只是，","start":159.22,"end":165.9},{"id":8,"text":"that's dialect for it's easy to solve equations with that coefficient matrix.","zh":"这是一种说法，意思是用该系数矩阵解方程很容易。","start":166.6,"end":172.86},{"id":9,"text":"it really means because no one is inverting anything, right?","zh":"它实际上意味着没有人真正求逆，对吧？","start":172.86,"end":178.32},{"id":10,"text":"good numerical work for anybody to actually form the inverse of a matrix. There are cases where","zh":"对任何人来说，实际形成矩阵的逆都是良好的数值工作。在某些情况下","start":178.32,"end":183.98}],"notes":["本段主要讲解课程的整体结构，强调通过从底层线性代数逐步构建到高层优化方法，最终目标是让学生能够实现一个线性规划求解器。这不仅是为了让学生理解算法的实现细节，也是为了在将来面对类似问题时能够自信地应对。","讲者指出，线性代数是课程中最重要的一环，所有后续内容都建立在对线性代数的理解之上。虽然学生可能不需要掌握完整的10周计算线性代数课程，但必须熟悉其核心概念。","讲者强调，线性代数的重要性不仅在于其本身，还在于它为后续的优化方法提供了基础。虽然课程内容不涉及计算机架构，但所有计算都依赖于计算机硬件的设计。","本段还提到，今天将讲解直接求解线性方程组的方法，这些方法是数值线性代数的重要组成部分。虽然这些方法可能对部分学生来说是已知的，但对其他人来说可能是新的内容。","讲者指出，直接方法的核心思想是将矩阵分解为易于求解的子矩阵，而不是直接计算矩阵的逆。这种分解方法在实际计算中更为高效和稳定。","讲者强调，在数值计算中，很少有人会显式地计算矩阵的逆，而是通过分解矩阵来求解线性方程组。这种做法不仅提高了计算效率，还减少了数值误差。"],"formulas":[],"uncertainties":["It is unbelievably rare in"],"diagram":"none","start":5.23,"end":183.98,"asr_flags":[],"translation_complete":true,"translated_segments":11,"raw_segments":[{"start":5.23,"text":"Let me, I'll explain where we are sort of in the whole course. In the next maybe two and a half, three weeks, we're actually going to be, we build up and we're going from the bottom up to the top. So this will finish when you'll actually implement your own like solver for an LP solver or something like that. We haven't quite figured out, but you'll, anyway, it'll finish with you implementing like a solver. So you mostly, by the way, just to demystify it."},{"start":34.2,"text":"Right. Just so when someone looks at you sometime in the future and says, oh, my God, you can't write your own LP solver. That's really complicated. And you could say, oh, contraire, I did it. Right. So that's the main thing, the main reason. But also there's interesting stuff. Right now we're at the bottom level, which is linear algebra. And actually, in some ways, it's by far the most important level. And my own feeling is."},{"start":59.74,"text":"Everybody, certainly anybody in this class needs to know this material. Do you need to know a whole 10-week course that you would take on computational linear algebra? Maybe, actually. But certainly you need to be familiar with the ideas. And that's unlike, you don't have to know about computer architecture, even though everything we do is thanks to the people who design and build."},{"start":88.72,"text":"you know, computers and stuff. So, but this you actually should know. Okay. So back to the numerical linear algebra. And today, actually, we're going to cover material that is like, some of you may know, rest of you probably don't. And it is, I'd listed in the top 10 of the things you need to know from this course, even though it's not technically part of the course. So, okay. So here it is. Last time we talked about, you know, how do you solve a set of equations AX equals B?"},{"start":119.01,"text":"And, you know, there are several ways. There's ones we're not going to talk about. There are iterative methods to do this, which are used for like super large scale problems. If you've got like a billion variables or if that represents like a PDE you're solving. Right. We're not going to talk about those. We're going to talk about these are what are called direct methods. I don't know where that name came from, but they're called direct. And the way they work is they take the matrix A and they first factor it into a product."},{"start":147.26,"text":"of matrices, each of which, quote, is easy to invert, unquote. So that's the first step,"},{"start":154.9,"text":"right? You've seen some of these factorizations, you know, like SVD, eigen decomposition."},{"start":159.22,"text":"You've probably seen a couple of the others as well. So an easy to invert is actually just,"},{"start":166.6,"text":"that's dialect for it's easy to solve equations with that coefficient matrix. So that's what it"},{"start":172.86,"text":"it really means because no one is inverting anything, right? It is unbelievably rare in"},{"start":178.32,"text":"good numerical work for anybody to actually form the inverse of a matrix. There are cases where"}],"speech_gaps":[],"frame":"../frames/v013/001.webp","frame_time":17.23},{"title":"矩阵分解与求解线性方程","segments":[{"id":11,"text":"people do, but it's very rare, right? So, okay. So what you do then, once you've factored your","zh":"人们确实会这么做，但非常罕见，对吧？所以，好的。那么，一旦你将矩阵分解成一些你所谓的‘容易求逆’的乘积，你接下来该怎么做呢？","start":183.98,"end":192.58},{"id":12,"text":"matrix into a product of things which are, you know, quote, easy to invert, unquote, you have","zh":"你必须正确地解释这一点，然后你所做的就是写出逆矩阵，而逆矩阵是逆的乘积顺序，然后你","start":192.58,"end":197.52},{"id":13,"text":"have to interpret that correctly then you what you do is you then write out you know the inverse","zh":"实际上只是通过先计算你所谓的 a1 的逆乘以 b，这是一件事，然后你","start":197.52,"end":203.2},{"id":14,"text":"and the inverse is the product is is the product of the inverse is in reverse order and then you","zh":"当然，这实际上意味着人们写 a 和 a1 逆乘以 b，他们真正想表达的是你调用这个","start":203.2,"end":208.4},{"id":15,"text":"literally just evaluate this by first evaluating you know a1 inverse b that's one thing and and","zh":"你调用 solve(a1, b)，这就是它的真正含义，所以你解这个方程，然后你","start":208.4,"end":214.32},{"id":16,"text":"of course what that means is people write a and a1 inverse b what they really mean is you call this","zh":"将这个解传递给下一步？","start":214.32,"end":218.68},{"id":17,"text":"you call solve a1 comma b that's what that that's what it really means so you solve that then you","zh":"你调用 solve a1，b，这就是它的意思，这就是它真正意味着的，所以你解这个，然后你","start":218.68,"end":225.36},{"id":18,"text":"you pass this solution to the next thing?","zh":"你把这个解传递给下一个步骤吗？","start":225.36,"end":227.46},{"id":19,"text":"which is A2 inverse times X1. And so you solve A2 X2 equals X1. And that gives you the second one. And you keep going until you get to the end. So again, it's like completely straightforward. Like, okay, like, so what? Last time we talked about some very interesting things, which is that if you want to solve a set of equations with the same coefficient matrix, but different right-hand sides,","zh":"这相当于 A2 的逆乘以 X1。因此，你解 A2 X2 等于 X1。这样你就得到了第二个解。然后你继续下去，直到最后。所以，这又是一个完全直接的过程。比如，那么，什么？上一次我们讨论了一些非常有趣的内容，即如果你想解一组具有相同系数矩阵但不同右侧的方程，","start":228.03,"end":257.06},{"id":20,"text":"Then, in fact, what you can do is you factor once and you cache the factorization, and then you simply use the solve method. This is called the solve. The first one is called factor, and this is called solve. So you simply call the solve method on your multiple right-hand sides. And you get to some stunning, you get to surprising conclusions in some cases. I'll get to that in a minute.","zh":"事实上，你可以进行一次因式分解并缓存这个分解结果，然后只需使用求解方法。这被称为求解。第一个步骤称为因式分解，这一步称为求解。因此，你只需在多个右侧上调用求解方法。在某些情况下，你会得到一些令人惊讶的结论。我稍后会讲到这一点。","start":257.7,"end":284.88},{"id":21,"text":"Alright, so this is the one that you probably saw a variation of this, like in high school or something, the first time you saw linear equations, it's called Gaussian elimination, it's called lots of things.","zh":"好的，所以这可能是你第一次在高中或类似的地方看到这种变体，第一次看到线性方程，它被称为高斯消元法，还有许多其他名称。","start":285.82,"end":296.18},{"id":22,"text":"But here's what it is, if you have a non-singular matrix, you can factor it as a permutation times a lower triangular matrix, it's a lower triangular and u is upper triangular, and they're all invertible.","zh":"但这里的关键是，如果你有一个非奇异矩阵，你可以将其分解为一个排列矩阵乘以一个下三角矩阵，它是一个下三角矩阵，u 是一个上三角矩阵，它们都是可逆的。","start":296.92,"end":310.54},{"id":23,"text":"Of course, actually, if any one of them weren't, then a would not be, right?","zh":"当然，实际上，如果其中任何一个不可逆，那么 A 本身也不可逆，对吧？","start":310.6,"end":313.56},{"id":24,"text":"it's actually not that difficult, but the cost is order n cubed flops. Okay. So that's what that","zh":"这实际上并不太难，但其计算成本是 n 的立方次浮点运算。好的。所以这就是这个","start":313.56,"end":319.88},{"id":25,"text":"it's actually not that difficult, but the cost is order n cubed flops. Okay. So that's what that","zh":"这实际上并不太难，但其计算成本是 n 的立方次浮点运算。好的。所以这就是这个","start":319.98,"end":327.04},{"id":26,"text":"is. And so this is what it looks like to solve linear equations. You factor A, that means you","zh":"的样子。因此，解线性方程的过程看起来就是这样。你对 A 进行因式分解，这意味着你","start":327.04,"end":334.44},{"id":27,"text":"get P, L, and U. Then these three steps, like two, three, four, this is factor, and then this is","zh":"得到 P、L 和 U。然后这三个步骤，比如两、三、四，这是分解，然后这就是","start":334.44,"end":340.84},{"id":28,"text":"is solve. So again, all you do is you just solve them in reverse order. Now solving this one,","zh":"求解。所以再次，你所做的只是按相反的顺序来解。现在解这个","start":340.84,"end":348.04},{"id":29,"text":"solving the permutator, this is silly. It's just you multiply by p transpose, right? Roughly,","zh":"解置换矩阵，这很傻。你只需要乘以 P 的转置，对吧？大致","start":348.06,"end":352.52},{"id":30,"text":"right? It's the inverse permutator. You just unpermute them, right? So this is easy. The","zh":"对吧？这就是置换矩阵的逆。你只需要将它们解置换，对吧？所以这很容易。第","start":352.52,"end":357.74},{"id":31,"text":"second one, L is lower triangular. And so for that, you use forward substitution, which we saw","zh":"二个，L 是下三角矩阵。因此，你使用前向替换法，我们之前看到","start":357.74,"end":362.58},{"id":32,"text":"as an order n squared alpha.","zh":"这是时间复杂度为 n² α 的方法。","start":362.58,"end":363.78}],"notes":["本段讲解了如何通过矩阵分解来求解线性方程组。当矩阵被分解为易于求逆的因子时，求逆过程可以通过将逆矩阵的乘积按相反顺序计算来实现。例如，若矩阵A分解为A = P L U，那么A的逆可以通过计算U^{-1} L^{-1} P^{-1}来得到。求解线性方程组时，可以先对矩阵进行分解，然后依次求解每个步骤，从而提高效率。","在实际操作中，分解后的矩阵可以通过调用solve方法来求解多个右侧向量。例如，分解矩阵A后，可以使用solve方法对多个右侧向量进行求解，而无需重复分解矩阵。这种方法被称为缓存分解，可以显著减少计算时间。","矩阵分解的计算复杂度为O(n³)，这在实际应用中可能成为瓶颈。然而，分解后的求解过程复杂度较低，通常为O(n²)。因此，分解矩阵的代价虽然较高，但后续求解多个方程组的效率提升是值得的。","在分解矩阵的过程中，如果矩阵A是奇异的，那么分解后的因子P、L、U中至少有一个是奇异的。因此，分解前需要确保矩阵A是非奇异的，否则分解过程无法完成。","对于分解后的矩阵，求解过程分为三个步骤：首先求解置换矩阵P的逆，然后求解下三角矩阵L的逆，最后求解上三角矩阵U的逆。每个步骤的计算方法不同，例如，求解置换矩阵的逆可以通过乘以P的转置来实现。","在实际应用中，求解下三角矩阵L的逆可以通过前向替换（forward substitution）来完成，这种方法的计算复杂度为O(n²)。前向替换是一种高效的算法，适用于下三角矩阵的求解。"],"formulas":[{"latex":"A = P L U","symbols":"A 是原矩阵，P 是置换矩阵，L 是下三角矩阵，U 是上三角矩阵","explanation":"公式正确，表示矩阵 A 可以分解为置换矩阵 P、下三角矩阵 L 和上三角矩阵 U 的乘积。","evidence":"But here's what it is, if you have a non-singular matrix, you can factor it as a permutation times a lower triangular matrix, it's a lower triangular and u is upper triangular, and they're all invertible."},{"latex":"P^{-1} = P^T","symbols":"置换矩阵 P 的逆等于其转置矩阵 P^T","explanation":"公式正确，置换矩阵的逆确实等于其转置矩阵。","evidence":"solving the permutator, this is silly. It's just you multiply by p transpose, right? Roughly, right? It's the inverse permutator. You just unpermute them, right? So this is easy. The"}],"uncertainties":["可能无法准确判断某些术语的完整表达，例如 'solve a1 comma b' 的具体含义。","关于 'order n squared alpha' 的具体含义，可能需要进一步澄清。"],"diagram":"none","start":183.98,"end":363.78,"asr_flags":[],"math_clarifications":["公式 $ A^{-1} = U^{-1} L^{-1} P^{-1} $ 的逆矩阵顺序错误，正确的顺序应为 $ A^{-1} = P^{-1} L^{-1} U^{-1} $。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":22,"raw_segments":[{"start":183.98,"text":"people do, but it's very rare, right? So, okay. So what you do then, once you've factored your"},{"start":192.58,"text":"matrix into a product of things which are, you know, quote, easy to invert, unquote, you have"},{"start":197.52,"text":"have to interpret that correctly then you what you do is you then write out you know the inverse"},{"start":203.2,"text":"and the inverse is the product is is the product of the inverse is in reverse order and then you"},{"start":208.4,"text":"literally just evaluate this by first evaluating you know a1 inverse b that's one thing and and"},{"start":214.32,"text":"of course what that means is people write a and a1 inverse b what they really mean is you call this"},{"start":218.68,"text":"you call solve a1 comma b that's what that that's what it really means so you solve that then you"},{"start":225.36,"text":"you pass this solution to the next thing?"},{"start":228.03,"text":"which is A2 inverse times X1. And so you solve A2 X2 equals X1. And that gives you the second one. And you keep going until you get to the end. So again, it's like completely straightforward. Like, okay, like, so what? Last time we talked about some very interesting things, which is that if you want to solve a set of equations with the same coefficient matrix, but different right-hand sides,"},{"start":257.7,"text":"Then, in fact, what you can do is you factor once and you cache the factorization, and then you simply use the solve method. This is called the solve. The first one is called factor, and this is called solve. So you simply call the solve method on your multiple right-hand sides. And you get to some stunning, you get to surprising conclusions in some cases. I'll get to that in a minute."},{"start":285.82,"text":"Alright, so this is the one that you probably saw a variation of this, like in high school or something, the first time you saw linear equations, it's called Gaussian elimination, it's called lots of things."},{"start":296.92,"text":"But here's what it is, if you have a non-singular matrix, you can factor it as a permutation times a lower triangular matrix, it's a lower triangular and u is upper triangular, and they're all invertible."},{"start":310.6,"text":"Of course, actually, if any one of them weren't, then a would not be, right?"},{"start":313.56,"text":"Right. So the cost of that factorization, which we're not going to go into how that's done,"},{"start":319.98,"text":"it's actually not that difficult, but the cost is order n cubed flops. Okay. So that's what that"},{"start":327.04,"text":"is. And so this is what it looks like to solve linear equations. You factor A, that means you"},{"start":334.44,"text":"get P, L, and U. Then these three steps, like two, three, four, this is factor, and then this is"},{"start":340.84,"text":"is solve. So again, all you do is you just solve them in reverse order. Now solving this one,"},{"start":348.06,"text":"solving the permutator, this is silly. It's just you multiply by p transpose, right? Roughly,"},{"start":352.52,"text":"right? It's the inverse permutator. You just unpermute them, right? So this is easy. The"},{"start":357.74,"text":"second one, L is lower triangular. And so for that, you use forward substitution, which we saw"},{"start":362.58,"text":"as an order n squared alpha."}],"speech_gaps":[],"frame":"../frames/v013/002.webp","frame_time":195.98},{"title":"后向替换与求解复杂度","segments":[{"id":33,"text":"Backward substitution is when you have U, because U is upper triangular. And you start, if you'll recall, by first solving for the last entry, then the second last, then the third last, and so on. That's backward substitution. And that's also N squared flops. And if you add these up, what you find out is something kind of weird.","zh":"后向替换是指你已经有了U，因为U是上三角矩阵。你会先从最后一个元素开始求解，然后是倒数第二个元素，接着是倒数第三个元素，依此类推。这就是后向替换。这也是N平方次浮点运算。如果你把这些加起来，你会发现一些相当奇怪的事情。","start":365.39,"end":381.49},{"id":34,"text":"It's that the factor is order n cubed and the solve is order n squared. And so I think last time I finished by asking you a question, which is like, how long does it take to solve, I don't know, on my laptop, a set of linear equations with, you know, let's say a thousand by thousand matrix, right? Which I could make sound pretty impressive, right? I could say, you know, my problem has more than a million coefficients in it, which is true. Thousand by thousand matrix does.","zh":"这是因为分解的阶数是n的立方，而求解的阶数是n的平方。因此，我上次结束时问了你们一个问题，就是，解一个线性方程组需要多长时间，比如说在我的笔记本电脑上，一个一千乘一千的矩阵，对吧？这听起来可能相当 impressive，对吧？我可以这么说，我的问题中有超过一百万个系数，这是真的。一千乘一千的矩阵就是这样。","start":381.95,"end":410.09},{"id":35,"text":"And then you could say, you know, the n cubed, the factorization is order n cubed. You know, that's like a billion flops, right? Of course, that's a joke now, right? And the answer is, like, I can do that in 100 milliseconds. Okay? So can you. My phone can do it in something on that order magnitude, right? So, which is actually kind of stunning. I think then I asked the following question. I asked...","zh":"然后你可以说，n的立方，分解的阶数是n的立方。你知道，这大概是十亿次浮点运算，对吧？当然，现在这只是一个玩笑，对吧？答案是，像我这样可以在100毫秒内完成。对吧？你也可以。我的手机可以在这个数量级上完成，对吧？这实际上相当令人惊讶。然后我问了下一个问题。我问……","start":410.74,"end":438.97},{"id":36,"text":"How long does it take you, if it takes 100 milliseconds to solve, let's say, one set of 1,000 by 1,000 equations, right? 1,000 equations, 1,000 unknowns. How long does it take to solve 10? For that matter, you know, even 100. How long does it take? If it takes a tenth of a second to do one, the answer is surprising. It's this. It's a tenth of a second. Everybody got that?","zh":"如果你知道解一个一千乘一千的方程组需要100毫秒，对吧？一千个方程，一千个未知数。解十个需要多长时间？说到解一百个，需要多长时间？如果解一个需要十分之一秒，答案是令人惊讶的。它就是十分之一秒。大家明白了吗？","start":439.45,"end":461.23},{"id":37,"text":"So not that many people appreciate this, right, or understand this. And this is actually, this is used throughout a lot of numerical stuff. A lot of it, well, you use it all the time, you just don't know it. So all the solvers that you use when you call CVXPy, almost all of them, will use things like this, right? So the most typical methods to solve things like SOCPs, STPs, these things, or for that matter, even LPs, involve...","zh":"并不是很多人理解这一点，对吧？实际上，这在很多数值计算中都被广泛使用。很多情况下，你一直在使用它，只是不知道而已。所以当你调用CVXPy时使用的几乎所有求解器，都会使用像这样的方法，对吧？解决像SOCPs、STPs这样的问题，或者说到底，甚至LPs，都涉及……","start":461.69,"end":487.01},{"id":38,"text":"Other people. Yeah. Is no is no one else impressed or like shouldn't you be? I mean, I'm maybe it's maybe too early, but people should be going like, that's awesome. Like, really? But I'm not getting that feeling. But that's OK. That's fine. OK, good. But there we go. All right. Now, sparse LU factorization. This is super interesting. This is something everybody should know about.","zh":"其他人。是的。是不是没有人觉得印象深刻，或者你不应该这样？我是说，也许这还太早了，但人们应该会说，这太棒了。真的吗？但我不觉得有这种感觉。不过没关系。这样也很好。好的，但就是这样。好吧。现在，稀疏LU分解。这非常有趣。这是每个人都应该了解的事情。","start":487.26,"end":514.78},{"id":39,"text":"Other people. Yeah. Is no is no one else impressed or like shouldn't you be? I mean, I'm maybe it's maybe too early, but people should be going like, that's awesome. Like, really? But I'm not getting that feeling. But that's OK. That's fine. OK, good. But there we go. All right. Now, sparse LU factorization. This is super interesting. This is something everybody should know about.","zh":"其他人。是的。是不是没有人觉得印象深刻，或者你不应该这样？我是说，也许这还太早了，但人们应该会说，这太棒了。真的吗？但我不觉得有这种感觉。不过没关系。这样也很好。好的，但就是这样。好吧。现在，稀疏LU分解。这非常有趣。这是每个人都应该了解的事情。","start":515.67,"end":541.25}],"notes":["本段主要讨论了后向替换的计算复杂度，以及求解线性方程组时的计算时间。教授提到，对于一个1000x1000的矩阵，虽然理论上需要进行n³次浮点运算，但实际上现代计算机可以在100毫秒内完成，这表明实际计算效率远高于理论估计。教授还通过提问的方式，引导学生思考如何利用已有的因子化结果来求解多个不同右侧向量的线性方程组，强调了这种技术在实际应用中的重要性。","教授进一步指出，虽然求解一个线性方程组需要n³次运算，但求解多个方程组时，由于因子化只需进行一次，因此总计算量主要由因子化决定，而求解部分的复杂度仅为n²。这种优化在实际计算中非常关键，尤其是在使用如CVXPy等工具时，这些方法通常会利用这种技术来提高效率。","教授还提到，对于1000x1000的矩阵，即使需要求解10个不同的方程组，计算时间仍然只需要100毫秒，这表明现代计算机的计算能力远超传统估计。这种高效性在数值计算和优化问题中具有广泛的应用，例如在求解SOCP、STP、LP等问题时，通常会使用类似的求解策略。","教授最后提到，稀疏LU分解是一种非常重要的技术，它在处理大规模稀疏矩阵时具有显著的优势。稀疏矩阵的分解可以显著减少计算量，因此是数值计算和优化算法中的核心内容。教授强调，这种技术是所有现代求解器的基础，值得所有学习者掌握。","教授通过提问的方式，引导学生思考如何利用已有的因子化结果来求解多个不同右侧向量的线性方程组，强调了这种技术在实际应用中的重要性。这种技术在数值计算和优化问题中具有广泛的应用，例如在求解SOCP、STP、LP等问题时，通常会使用类似的求解策略。","教授还提到，虽然求解一个线性方程组需要n³次运算，但求解多个方程组时，由于因子化只需进行一次，因此总计算量主要由因子化决定，而求解部分的复杂度仅为n²。这种优化在实际计算中非常关键，尤其是在使用如CVXPy等工具时，这些方法通常会利用这种技术来提高效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":365.39,"end":541.25,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":365.39,"text":"Backward substitution is when you have U, because U is upper triangular. And you start, if you'll recall, by first solving for the last entry, then the second last, then the third last, and so on. That's backward substitution. And that's also N squared flops. And if you add these up, what you find out is something kind of weird."},{"start":381.95,"text":"It's that the factor is order n cubed and the solve is order n squared. And so I think last time I finished by asking you a question, which is like, how long does it take to solve, I don't know, on my laptop, a set of linear equations with, you know, let's say a thousand by thousand matrix, right? Which I could make sound pretty impressive, right? I could say, you know, my problem has more than a million coefficients in it, which is true. Thousand by thousand matrix does."},{"start":410.74,"text":"And then you could say, you know, the n cubed, the factorization is order n cubed. You know, that's like a billion flops, right? Of course, that's a joke now, right? And the answer is, like, I can do that in 100 milliseconds. Okay? So can you. My phone can do it in something on that order magnitude, right? So, which is actually kind of stunning. I think then I asked the following question. I asked..."},{"start":439.45,"text":"How long does it take you, if it takes 100 milliseconds to solve, let's say, one set of 1,000 by 1,000 equations, right? 1,000 equations, 1,000 unknowns. How long does it take to solve 10? For that matter, you know, even 100. How long does it take? If it takes a tenth of a second to do one, the answer is surprising. It's this. It's a tenth of a second. Everybody got that?"},{"start":461.69,"text":"So not that many people appreciate this, right, or understand this. And this is actually, this is used throughout a lot of numerical stuff. A lot of it, well, you use it all the time, you just don't know it. So all the solvers that you use when you call CVXPy, almost all of them, will use things like this, right? So the most typical methods to solve things like SOCPs, STPs, these things, or for that matter, even LPs, involve..."},{"start":487.26,"text":"two solves right and that's done in the same basically the factorization dominates and and that's that's the that's the point there okay so all right actually i'm just curious how many people have seen this before how many people knew that you could solve 10 equations with a thousand variables thousand unknowns same coefficient matrix different right hand sides uh you could do that you could solve 10 and the amount of time it takes you to solve one you knew come on"},{"start":515.67,"text":"Other people. Yeah. Is no is no one else impressed or like shouldn't you be? I mean, I'm maybe it's maybe too early, but people should be going like, that's awesome. Like, really? But I'm not getting that feeling. But that's OK. That's fine. OK, good. But there we go. All right. Now, sparse LU factorization. This is super interesting. This is something everybody should know about."}],"speech_gaps":[],"frame":"../frames/v013/003.webp","frame_time":377.39},{"title":"稀疏矩阵的存储与分解","segments":[{"id":40,"text":"Right, so um, there's since I guess it's been developed since about the 1960s is uh basically stuff on sparse matrices right, and so everything you know, first of all, you know how do you what are the data structures used to store them and then basically there's a whole parallel universe of doing all the stuff you would do with so-called dense matrices which are just stored as arrays.","zh":"对，所以嗯，自从大约1960年代以来，基本上都是关于稀疏矩阵的内容，对吧。首先，你知道如何存储稀疏矩阵，然后基本上有一整个平行世界，用来处理所有你通常会用所谓的密集矩阵所做的事情，而密集矩阵只是以数组形式存储。","start":541.63,"end":562.85},{"id":41,"text":"How do you do this for sparse matrices? Including factorizations, back solves, all these kinds of things. Everything you can do. Eigen decompositions, singular value decompositions. There's a whole field where people have made this efficient for sparse matrices. And this is something like...","zh":"如何对稀疏矩阵进行这些操作？包括分解、回代，所有这些类型的事情。你所能做的所有事情。特征值分解，奇异值分解。有一个完整的领域，人们已经为稀疏矩阵高效地实现了这些方法。这就像……","start":563.53,"end":580.77},{"id":42,"text":"everybody needs to know about, like everyone, because if you do any kind of computation, you need to know about this, right? Because there will be, again, there will be surprising statements we'll make about what you can solve and not solve. Okay, so if A is sparse, the typical factorization is going to have four factors. It's going to have a P1 is a permutation in front.","zh":"每个人都需要了解这些，就像每个人一样，因为如果你进行任何类型的计算，你都需要了解这些，对吧。因为我们会做出一些令人惊讶的陈述，说明你可以解决和不能解决的问题。好的，如果A是稀疏的，典型的分解会有四个因子。它会有一个P1，在前面是一个排列。","start":581.34,"end":606.74},{"id":43,"text":"P2 is a permutation in back, and then L and U are the lower triangular and upper triangular. So the idea here is, mathematically, you don't need P2. You do need P1. It is false that any non-singular matrix can be factored as LU.","zh":"P2是在后面的一个排列，然后L和U是下三角和上三角矩阵。这里的思路是，数学上你不需要P2，你需要P1。并不是任何非奇异矩阵都可以分解为LU。","start":607.25,"end":628.73},{"id":44,"text":"You do need that initial permutation, but you don't need that second one. So the second one is there, and by the way, P1 is also there, so that when you carry out this LU factorization...","zh":"你需要这个初始排列，但你不需要第二个排列。所以第二个排列存在，顺便说一句，P1也存在，这样当你进行LU分解时……","start":629.54,"end":642.6},{"id":45,"text":"L and U will also be sparse. Because if you do this, if you're not careful about doing this, your matrix A will be sparse, but L and U will be dense. When that happens, it's referred to as you have fill-in. You have lots of entries in L and U that weren't there in A. And this is very important for everybody to know. Here would be an example. It's extremely common to work all the time with, let's say,","zh":"L和U也会是稀疏的。如果你不注意地进行这个操作，矩阵A会是稀疏的，但L和U会是密集的。当这种情况发生时，被称为填充（fill-in）。L和U中有很多条目在A中是没有的。这对于每个人来说都是非常重要的知识。这里有一个例子。非常常见的是，一直工作于比如说，一百万乘一百万的稀疏矩阵。这根本就不是一个问题，对吧？我在我的笔记本电脑上就能处理这样的事情，对吧？你知道，非零元素的数量不会是……","start":643.37,"end":671.13},{"id":46,"text":"you know, a million by million sparse matrix. It is simply not a problem, right? I can do stuff like that on my laptop, right? You know, the number of non-zeros is not going to be...","zh":"你明白，百万乘百万的稀疏矩阵。这根本就不是一个问题，对吧？我在我的笔记本电脑上就能处理这样的事情，对吧？你知道，非零元素的数量不会是……","start":671.96,"end":684.4},{"id":47,"text":"10 to the 12, which would be a dense one, you know, it's going to be something reasonable. Like, I don't know, it's got 50, you know, 20, 30, a hundred non-zeros per row. Even that is not that big a deal because it's a hundred million and it's a hundred million coefficients. If there's a, if there's a hundred non-zeros per row and you multiply that by about 10. So even in doubles, it's like a gig, which is just like","zh":"10的12次方，这将是一个密集矩阵，你知道的，它会是一个合理的数值。比如，我不知道，每行有50，你知道的，20、30、100个非零元素。即使这样也不是什么大问题，因为是一亿个系数，是一亿个系数。如果每行有100个非零元素，并乘以大约10。所以在双精度下，大概是一吉字节，这只是一个","start":684.63,"end":704.03}],"notes":["本段介绍了稀疏矩阵的存储结构和与稠密矩阵的对比，强调了稀疏矩阵在计算中的重要性。讲者提到稀疏矩阵的存储方式与稠密矩阵不同，需要专门的数据结构来处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":541.63,"end":704.03,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":541.63,"text":"right so um there's since i guess it's been developed since about the 1960s is uh basically stuff on sparse matrices right and so everything you know first of all you know how do you what are the data structures used to store them and then basically there's a whole parallel universe of doing all the stuff you would do with so-called dense matrices which are just stored as arrays"},{"start":563.53,"text":"How do you do this for sparse matrices? Including factorizations, back solves, all these kinds of things. Everything you can do. Eigen decompositions, singular value decompositions. There's a whole field where people have made this efficient for sparse matrices. And this is something like..."},{"start":581.34,"text":"everybody needs to know about, like everyone, because if you do any kind of computation, you need to know about this, right? Because there will be, again, there will be surprising statements we'll make about what you can solve and not solve. Okay, so if A is sparse, the typical factorization is going to have four factors. It's going to have a P1 is a permutation in front."},{"start":607.25,"text":"P2 is a permutation in back, and then L and U are the lower triangular and upper triangular. So the idea here is, mathematically, you don't need P2. You do need P1. It is false that any non-singular matrix can be factored as LU."},{"start":629.54,"text":"You do need that initial permutation, but you don't need that second one. So the second one is there, and by the way, P1 is also there, so that when you carry out this LU factorization..."},{"start":643.37,"text":"L and U will also be sparse. Because if you do this, if you're not careful about doing this, your matrix A will be sparse, but L and U will be dense. When that happens, it's referred to as you have fill-in. You have lots of entries in L and U that weren't there in A. And this is very important for everybody to know. Here would be an example. It's extremely common to work all the time with, let's say,"},{"start":671.96,"text":"you know, a million by million sparse matrix. It is simply not a problem, right? I can do stuff like that on my laptop, right? You know, the number of non-zeros is not going to be..."},{"start":684.63,"text":"10 to the 12, which would be a dense one, you know, it's going to be something reasonable. Like, I don't know, it's got 50, you know, 20, 30, a hundred non-zeros per row. Even that is not that big a deal because it's a hundred million and it's a hundred million coefficients. If there's a, if there's a hundred non-zeros per row and you multiply that by about 10. So even in doubles, it's like a gig, which is just like"}],"speech_gaps":[],"frame":"../frames/v013/004.webp","frame_time":553.63},{"title":"稀疏矩阵与带状矩阵的存储与分解","segments":[{"id":48,"text":"It's a reasonably small amount of memory. Okay. So anyway, so what happens is if you have your million by million matrix and you call a solver like this, if you choose P1 and P2 poorly, then what will happen is like L will be like a dense lower triangular matrix, right? You can't even store it because it's a million by million, right? So it's 10 to the 12 divided by two things. I mean, you can't. Let's just leave it that way. Okay.","zh":"这是一小部分内存。好的。总之，如果你有一个百万乘百万的矩阵，并调用这样的求解器，如果你选择的P1和P2不好，那么会发生的是L会像一个密集的下三角矩阵，对吧？你甚至无法存储它，因为它是一个百万乘百万的矩阵，对吧？所以是10的12次方除以两个数。我的意思是，你根本无法做到。我们就这样留着吧。好的。","start":704.61,"end":733.43},{"id":49,"text":"Making sense? So the P1 and P2 are chosen heuristically. And people have been doing this since the 60s. It's actually very cool. You can ask questions like, oh, find me the P1 and P2 that minimize the number of non-zeros in L and U. That's a perfectly nice problem to come up with. And it is NP-hard. But who cares? It's silly. There are unbelievably good heuristics for doing this, right?","zh":"听起来有道理吗？所以P1和P2是启发式选择的。人们从60年代就开始这样做。实际上非常酷。你可以提出这样的问题，比如，找到使L和U中非零元素数量最小的P1和P2。这是一个非常好的问题。而且这个问题是NP难的。但谁在乎呢？这很傻。对于这个问题，有令人难以置信的好启发式方法，对吧？","start":733.93,"end":763.3},{"id":50,"text":"that all of us benefit from. So this is great. Okay. And so what happens with sparse matrices is the factor and solve times, whatever they are, they are less than two-thirds n cubed. And I'm going to give you a very important special case right now, and then we'll encounter others, right? So here's a super important special case. It's a so-called banded matrix.","zh":"我们所有人都能从中受益。所以这很棒。好的。所以对于稀疏矩阵，不管因子分解和求解的时间是多少，它们都小于三分之二乘以n的立方。我现在要给你一个非常重要的特殊情况，之后我们还会遇到其他情况，对吧？所以这是一个超级重要的特殊情况。它被称为带状矩阵。","start":763.74,"end":792.46},{"id":51,"text":"So a banded matrix looks like this. Well, of course, there's just a band here like this. You know, maybe this is k entries wide, right? And basically, this is non-zero. And everything out here is that zero and that zero. So that's a banded matrix, right? So I can store a banded matrix on my laptop easily if it's a million by million. And the bandwidth is, let's say, 10 or 20, right? So everybody, so that's a banded matrix.","zh":"所以带状矩阵看起来像这样。当然，这里只有一条带状区域，对吧？也许这个带状区域有k个元素宽，对吧？基本上，这部分是非零的，而外面的都是零。所以这就是一个带状矩阵，对吧？所以如果带状矩阵的带宽是10或20，那么即使是一个百万乘百万的矩阵，我也可以轻松地在我的笔记本电脑上存储它。","start":793.6,"end":822.25},{"id":52,"text":"Nope, that's fine. So it turns out when you, here, well, this is a case where you don't need P1 and P2, right? But if you simply do the LU factorization here, the L and the U are going to be basically the same. They're also going to be banded. So I'll just write down L. L is lower triangular. So, whoops, this goes down to there, right? And then it simply looks like that.","zh":"不，这样也没问题。事实上，当在这里进行LU分解时，你会发现你不需要P1和P2，对吧？但如果你直接进行LU分解，那么L和U基本上会是相同的。它们也会是带状的。所以我只需要写下L。L是下三角矩阵。哦，对了，它会延伸到那里，对吧？然后它看起来就那样。","start":823.11,"end":848.35},{"id":53,"text":"That's k over 2. And this is what L looks like. And you look similarly, right?","zh":"这是k除以2。这就是L的样子。你同样可以这样观察，对吧？","start":848.93,"end":854.51},{"id":54,"text":"So, by the way, sometimes a banded matrix comes to you looking like that, but sometimes it's been permuted by the app, by whoever formed the problem. They decide, well, I'm going to list all my states first, then all my controls, then all this in an optimal control problem. And then it comes out with some crazy sparsity pattern. And any method would be able, any methods used to heuristically choose P1 and P2 will permute it to look banded.","zh":"所以，顺便提一下，有时一个带状矩阵看起来会是那样的，但有时它已经被应用程序或形成问题的人进行了置换。他们决定，好吧，我先列出所有状态，然后是所有控制量，然后是这个最优控制问题中的其他内容。结果就会出现一些奇怪的稀疏模式。任何方法，任何用于启发式选择P1和P2的方法，都能将其置换为带状形式。","start":855.85,"end":881.13}],"notes":["本段讲解了稀疏矩阵的存储与分解问题，特别是当矩阵规模很大时，如果选择的P1和P2不合适，会导致存储困难。稀疏矩阵的分解时间复杂度低于n³的三分之二，这在实际应用中非常重要。","带状矩阵是一种特殊的稀疏矩阵，其非零元素集中在主对角线附近，形成一个带状结构。带状矩阵的存储和分解效率非常高，即使在百万阶矩阵的情况下，只要带宽较小，也能轻松存储。","带状矩阵的LU分解结果仍然是带状的，因此不需要进行复杂的置换操作。然而，实际应用中，矩阵可能由于问题结构而呈现出复杂的稀疏模式，此时需要通过置换操作将其转化为带状形式。","P1和P2的选择是启发式的，虽然寻找最优的P1和P2是一个NP难问题，但存在非常有效的启发式方法。这些方法在实际中被广泛应用，使得稀疏矩阵的处理成为可能。","带状矩阵的带宽k决定了其存储和计算效率，较小的带宽意味着更高效的存储和更快的计算。因此，在设计问题时，应尽量使矩阵呈现带状结构。","带状矩阵的分解和存储是稀疏矩阵处理中的一个重要特例，它展示了如何通过结构化矩阵的特性来优化计算资源的使用。"],"formulas":[{"latex":"O(n^3)","symbols":"时间复杂度","explanation":"保持原公式，时间复杂度O(n^3)是正确的，适用于稀疏矩阵的因子和求解时间的描述。","evidence":"that all of us benefit from. So this is great. Okay. And so what happens with sparse matrices is the factor and solve times, whatever they are, they are less than two-thirds n cubed. And I'm going to give you a very important special case right now, and then we'll encounter others, right? So here's a super important special case. It's a so-called banded matrix."},{"latex":"k","symbols":"带宽","explanation":"保持原公式，k表示带宽，是带状矩阵的宽度参数，描述非零元素的分布范围。","evidence":"So a banded matrix looks like this. Well, of course, there's just a band here like this. You know, maybe this is k entries wide, right? And basically, this is non-zero. And everything out here is that zero and that zero. So that's a banded matrix, right? So I can store a banded matrix on my laptop easily if it's a million by million. And the bandwidth is, let's say, 10 or 20, right? So everybody, so that's a banded matrix."}],"uncertainties":[],"diagram":"none","start":704.61,"end":881.13,"asr_flags":[],"math_clarifications":["公式O(n^3)和k在上下文中是正确的，分别表示时间复杂度和带宽，没有数学错误。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":704.61,"text":"very small. It's a reasonably small amount of memory. Okay. So anyway, so what happens is if you have your million by million matrix and you call a solver like this, if you choose P1 and P2 poorly, then what will happen is like L will be like a dense lower triangular matrix, right? You can't even store it because it's a million by million, right? So it's 10 to the 12 divided by two things. I mean, you can't. Let's just leave it that way. Okay."},{"start":733.93,"text":"Making sense? So the P1 and P2 are chosen heuristically. And people have been doing this since the 60s. It's actually very cool. You can ask questions like, oh, find me the P1 and P2 that minimize the number of non-zeros in L and U. That's a perfectly nice problem to come up with. And it is NP-hard. But who cares? It's silly. There are unbelievably good heuristics for doing this, right?"},{"start":763.74,"text":"that all of us benefit from. So this is great. Okay. And so what happens with sparse matrices is the factor and solve times, whatever they are, they are less than two-thirds n cubed. And I'm going to give you a very important special case right now, and then we'll encounter others, right? So here's a super important special case. It's a so-called banded matrix."},{"start":793.6,"text":"So a banded matrix looks like this. Well, of course, there's just a band here like this. You know, maybe this is k entries wide, right? And basically, this is non-zero. And everything out here is that zero and that zero. So that's a banded matrix, right? So I can store a banded matrix on my laptop easily if it's a million by million. And the bandwidth is, let's say, 10 or 20, right? So everybody, so that's a banded matrix."},{"start":823.11,"text":"Nope, that's fine. So it turns out when you, here, well, this is a case where you don't need P1 and P2, right? But if you simply do the LU factorization here, the L and the U are going to be basically the same. They're also going to be banded. So I'll just write down L. L is lower triangular. So, whoops, this goes down to there, right? And then it simply looks like that."},{"start":848.93,"text":"That's k over 2. And this is what L looks like. And you look similarly, right?"},{"start":855.85,"text":"So, by the way, sometimes a banded matrix comes to you looking like that, but sometimes it's been permuted by the app, by whoever formed the problem. They decide, well, I'm going to list all my states first, then all my controls, then all this in an optimal control problem. And then it comes out with some crazy sparsity pattern. And any method would be able, any methods used to heuristically choose P1 and P2 will permute it to look banded."}],"speech_gaps":[],"frame":"../frames/v013/005.webp","frame_time":716.61},{"title":"带状矩阵的分解与求解","segments":[{"id":55,"text":"Okay, so what happens in a banded factorization is, first of all, the factorization time is n k squared. And then the back solve is n k. So these are stunningly smaller than n cubed and n squared. So what this tells you is you can solve a million by million equations if the bandwidth is 10.","zh":"好的，那么在带状矩阵分解中，首先，分解的时间是n乘以k的平方。然后回代的时间是n乘以k。这些时间比n的立方和n的平方小得多。这告诉你们的是，如果带宽是10，你们可以解决百万乘百万的方程组。","start":881.45,"end":911.22},{"id":56,"text":"Like super easily, and it's going to be so fast it's not even funny. Everybody following this? Which is kind of shocking, right? Because someone said, what are you doing? You say, I'm solving a set of a million equations for a million variables. Each equation involves 10 of the variables. You're like, whoa, that sounds like it's hard. Right? The answer is, it's unbelievable. This is a millisecond operation. Everyone follow? It's just, this is completely insane.","zh":"这操作超级容易，而且速度快得不像是真的。大家跟上了吗？这有点令人震惊，对吧？因为有人会问，你在做什么？你说，我在为百万个变量解百万个方程。每个方程涉及10个变量。你会说，哇，这听起来很难。对吧？答案是，这简直难以置信。这只是一个毫秒级的操作。大家跟上了吗？这完全不可思议。","start":912.23,"end":936.6},{"id":57,"text":"But this is things you absolutely need to know this, right? Because this is the trick to many, many things. Okay. So what's, you know, by the way, what's interesting here is the factor solve ratio is not that high anymore. Now it's K. It used to be N. And so that says, if I say, how long does it take to solve a million by million equations banded with a bandwidth of 10? It's some number, which is shockingly small. Then you say, how about 10 of them?","zh":"但这是你们绝对必须知道的事情，对吧？因为这是许多许多事情的关键。好的。顺便说一下，有趣的是，这里的分解求解比例不再那么高了。现在是k，以前是n。因此，如果说，解一个百万乘百万的带宽为10的方程组需要多长时间？这是一个令人震惊的小数字。然后你会说，那解10个这样的方程组呢？","start":937.23,"end":963.89},{"id":58,"text":"Okay, how about two of them? And you say it's only a little tiny bit more. Everybody following this? Okay, so by the way, what you'll be doing in the next week, two weeks, is you will start to recognize matrix structure, like sparsity. You're going to see some others later today, like block arrow and weird other ones. And you will start recognizing them. They're super important because two things. Number one,","zh":"好的，那解两个这样的方程组呢？你会说，这仅仅只是稍微多一点。大家跟上了吗？顺便说一下，接下来的一周或两周里，你们将开始识别矩阵结构，比如稀疏性。今天稍后你们还会看到一些其他的结构，比如块箭头和一些奇怪的结构。你们将开始识别它们。它们非常重要，因为有两个原因。第一个原因，","start":964.25,"end":991.41},{"id":59,"text":"you'll start recognizing structures that you can exploit to solve extremely fast. That's number one. But number two, on the other end, you're going to start recognizing practical problems that will result in matrices with that structure. I'm going to mention one right now. All of control. All of signal processing. Just looks like that. Every last bit of it.","zh":"你们将开始识别可以用来快速求解的结构。这是第一个原因。但第二个原因，另一方面，你们将开始识别实际问题，这些问题会导致具有这种结构的矩阵。我现在就提到一个。全部的控制理论。全部的信号处理。看起来都像这样。每一个细节都是如此。","start":991.82,"end":1016.41},{"id":60,"text":"That means if I ask you to, you've solved problems, you know, little control problems and things like that. But what this says is, if someone says, I have to compute, I have to solve a control problem with, you know, 20,000 time steps and a state dimension of 20 and 10 actuators, and someone say, wow, that sounds like it's going to be complicated. You just laugh and say, are you kidding?","zh":"这意味着如果你让我做，你已经解决过一些小的控制问题，诸如此类的问题。但这里说的是，如果有人告诉你，我必须计算，我必须解决一个具有20,000个时间步和20个状态维度以及10个执行器的控制问题，然后有人说，哇，这听起来会很复杂。你只需笑着回答，你开玩笑吗？","start":1018.39,"end":1040.56}],"notes":["本段讲解了带状矩阵分解的计算复杂度，指出带状矩阵的分解时间复杂度为n k²，回代时间为n k，远低于常规的n³和n²复杂度。这表明即使对于百万阶的方程组，只要带宽k较小，求解过程将非常高效。","讲者通过举例说明带状矩阵的求解速度之快，甚至可以达到毫秒级。这表明带状矩阵的结构使得大规模问题的求解变得容易，与直觉上认为的困难形成鲜明对比。","讲者提到带状矩阵的求解比一般矩阵的求解快得多，因为其结构使得计算复杂度显著降低。这说明在实际应用中，识别并利用矩阵的结构可以极大提升计算效率。","讲者指出，接下来的学习内容将涉及识别矩阵的结构，如稀疏性、块箭头结构等。这些结构在控制和信号处理等领域中非常常见，因此识别这些结构对于实际问题的求解至关重要。","讲者通过一个具体的例子说明带状矩阵在控制问题中的应用，指出即使对于大规模的控制问题，只要矩阵具有带状结构，求解过程将变得非常高效。","讲者强调，识别矩阵结构并利用其特性是解决实际问题的关键，这不仅有助于提高计算效率，还能帮助理解实际问题的数学本质。"],"formulas":[],"uncertainties":[],"diagram":"none","start":881.45,"end":1040.56,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":881.45,"text":"Okay, so what happens in a banded factorization is, first of all, the factorization time is n k squared. And then the back solve is n k. So these are stunningly smaller than n cubed and n squared. So what this tells you is you can solve a million by million equations if the bandwidth is 10."},{"start":912.23,"text":"Like super easily, and it's going to be so fast it's not even funny. Everybody following this? Which is kind of shocking, right? Because someone said, what are you doing? You say, I'm solving a set of a million equations for a million variables. Each equation involves 10 of the variables. You're like, whoa, that sounds like it's hard. Right? The answer is, it's unbelievable. This is a millisecond operation. Everyone follow? It's just, this is completely insane."},{"start":937.23,"text":"But this is things you absolutely need to know this, right? Because this is the trick to many, many things. Okay. So what's, you know, by the way, what's interesting here is the factor solve ratio is not that high anymore. Now it's K. It used to be N. And so that says, if I say, how long does it take to solve a million by million equations banded with a bandwidth of 10? It's some number, which is shockingly small. Then you say, how about 10 of them?"},{"start":964.25,"text":"Okay, how about two of them? And you say it's only a little tiny bit more. Everybody following this? Okay, so by the way, what you'll be doing in the next week, two weeks, is you will start to recognize matrix structure, like sparsity. You're going to see some others later today, like block arrow and weird other ones. And you will start recognizing them. They're super important because two things. Number one,"},{"start":991.82,"text":"you'll start recognizing structures that you can exploit to solve extremely fast. That's number one. But number two, on the other end, you're going to start recognizing practical problems that will result in matrices with that structure. I'm going to mention one right now. All of control. All of signal processing. Just looks like that. Every last bit of it."},{"start":1018.39,"text":"That means if I ask you to, you've solved problems, you know, little control problems and things like that. But what this says is, if someone says, I have to compute, I have to solve a control problem with, you know, 20,000 time steps and a state dimension of 20 and 10 actuators, and someone say, wow, that sounds like it's going to be complicated. You just laugh and say, are you kidding?"}],"speech_gaps":[],"frame":"../frames/v013/006.webp","frame_time":893.45},{"title":"Cholesky分解及其在凸优化中的应用","segments":[{"id":61,"text":"Like, I can do that on my phone. And, of course, that's the key to, you know, actually putting these things into a lot of control systems, right? So a lot of them actually do this. Okay. That's the big picture. So this is just, like, super cool to know about. Okay. This brings us to a very famous factorization. It's about 100 years old. It's the Cholesky factorization.","zh":"比如，我可以在手机上做到这一点。当然，这就是把这些东西应用到很多控制系统中的关键，对吧？所以很多系统实际上都会这么做。好的。这就是大体情况。知道这一点真的很酷。好的。这引出了一个非常著名的分解方法。它大约有一百年历史了，就是Cholesky分解。","start":1041.01,"end":1067.49},{"id":62,"text":"So if you have a positive definite matrix, you can write it as just LL transpose. And if you insist that the entries of the diagonal entries of L are positive, then it's unique.","zh":"如果你有一个正定矩阵，你可以把它写成LL的转置。如果你坚持要求L的对角线元素为正，那么这种分解是唯一的。","start":1068.09,"end":1079.63},{"id":63,"text":"So there's no choice. There's just one factorization, period. That's it. There's one way to write A as LL transpose. And how do you solve, you know, how do you solve AX equals B where A is positive definite? That's called a positive definite system of equations, right? So how do you do that? You do a Cholesky factorization and you do a forward and a backward substitution with L and L transpose.","zh":"所以没有选择，只有一种分解方式，就是这么简单。这就是唯一的方式，把A写成LL的转置。那么，如何求解AX等于B，其中A是正定矩阵？这被称为正定方程组，对吧？那么如何求解呢？你进行Cholesky分解，然后用L和L的转置进行前向和后向代入。","start":1080.38,"end":1102.66},{"id":64,"text":"Okay. So, so that's, that's it. And, you know, actually it's one third n cubed as opposed to two n cubed for general matrices. And, you know, that kind of makes sense. I mean, first, number one, no one cares about a factor of two in a flop count estimate because these are so crude, right? What really matters is like the people who actually wrote the micro code and all that kind of stuff. And how's it blocked? And how many cores is it using? All sorts of crazy stuff internal that we don't have to, most of us don't, all of us, I'm guessing should not.","zh":"好的。所以，这就是全部。实际上，它的计算量是n的立方的三分之一，而一般的矩阵是两倍的n的立方。你知道，这种差异其实并不令人惊讶。我的意思是，首先，没有人会在浮点运算次数的估计中关心两倍的因子，因为这些估计都很粗略，对吧？真正重要的是那些编写微代码的人，以及所有这些复杂的东西。还有它是如何被分块的？它使用了多少个核心？所有这些内部的复杂情况，我们大多数人不需要，我猜我们都不应该去关心。","start":1103.31,"end":1131.39},{"id":65,"text":"and do not have to worry about, right? But we should also all be very grateful that there are people who do, right? So yeah, so there it's a factor of two, which is not unsurprising, it's symmetric. So roughly speaking, there's a redundancy of two. Or you can even look at this and say, hey, that's an LU factorization with U equals L. And you know why? Because the matrix is symmetric, that's why, right? So it's not, anyway, not too surprising.","zh":"我们不需要去担心这些，对吧？但我们也应该非常感激有这样的人，对吧？所以，是的，这里有一个两倍的因子，这并不令人意外，因为它是对称的。粗略地说，存在两倍的冗余。或者你甚至可以这样想，这就是一个LU分解，其中U等于L。你知道为什么吗？因为矩阵是对称的，这就是原因，对吧？所以，无论如何，这并不令人意外。","start":1131.83,"end":1158.35},{"id":66,"text":"We will see very shortly where positive definite systems of equations arise. Actually, they arise by themselves in a lot of applications. But specifically in convex optimization, we'll see they're at the heart of a lot of stuff. And now we get the sparse Cholesky factorization. And here I'll tell you something super interesting about it, I think. So here, it turns out...","zh":"我们很快就会看到正定方程组出现在哪里。实际上，它们在很多应用中本身就自然出现。但特别是在凸优化中，我们会看到它们是很多内容的核心。现在我们将介绍稀疏Cholesky分解。在这里，我想告诉你一个非常有趣的事情。所以这里，事实证明……","start":1159.88,"end":1185.86},{"id":67,"text":"This is basically the same as calling a Cholesky factorization on P transpose AP, right? Because take that equation, just multiplying the left by P transpose on the right by P. So what it basically says is permute your matrix, your positive definite matrix, and then do a Cholesky factorization where there is no creativity. It's just, there's a unique Cholesky factorization. Everybody got this?","zh":"这基本上等同于对 $ P^\top A P $ 进行Cholesky分解，对吧？因为取那个方程，左边乘以 $ P^\top $，右边乘以 $ P $。所以它基本上说的是，重新排列你的矩阵，也就是你的正定矩阵，然后进行Cholesky分解，不需要任何创造性的步骤。它只是存在唯一的Cholesky分解。大家明白了吗？","start":1186.18,"end":1209.7}],"notes":["本段讲解了Cholesky分解的基本概念，即对于正定矩阵，可以唯一地分解为LL^T的形式，其中L是一个下三角矩阵且对角线元素为正。这种分解在求解正定线性方程组时非常有用，可以通过Cholesky分解后进行前向和后向替换来求解。","Cholesky分解的计算复杂度为O(n³/3)，比一般矩阵的O(n³)要低，这主要是因为正定矩阵的对称性减少了计算冗余。虽然实际计算中还有许多细节如并行处理和微码优化，但这种复杂度的差异在理论分析中是重要的。","由于正定矩阵的对称性，Cholesky分解可以看作是一种特殊的LU分解，其中U等于L。这种对称性使得分解过程更加高效且唯一。","在凸优化中，正定系统方程是许多算法的核心，例如在求解二次规划问题时，Cholesky分解被广泛用于处理Hessian矩阵的分解。此外，稀疏Cholesky分解在处理大规模稀疏矩阵时具有重要应用。","Cholesky分解的唯一性保证了其在数值计算中的稳定性，这对于求解线性方程组和优化问题至关重要。同时，通过置换矩阵P，可以对原矩阵进行重新排列，从而进一步优化分解过程。","本段还提到，虽然Cholesky分解的计算复杂度在理论上较低，但实际应用中仍需考虑许多实现细节，如并行计算和硬件优化，这些细节通常由底层开发者处理，而用户只需关注算法的理论性质。"],"formulas":[{"latex":"A = LL^\\text{T}","symbols":"A 是正定矩阵，L 是下三角矩阵，其对角线元素为正","explanation":"公式正确，表示正定矩阵 A 可以分解为下三角矩阵 L 与其转置的乘积，且 L 的对角线元素为正。","evidence":"So there's no choice. There's just one factorization, period. That's it. There's one way to write A as LL transpose. And how do you solve, you know, how do you solve AX equals B where A is positive definite? That's called a positive definite system of equations, right? So how do you do that? You do a Cholesky factorization and you do a forward and a backward substitution with L and L transpose."},{"latex":"AX = B","symbols":"正定系统方程，其中 A 是正定矩阵，X 和 B 是未知向量","explanation":"公式正确，表示正定矩阵 A 与向量 X 的乘积等于向量 B，这是正定系统方程的标准形式。","evidence":"So there's no choice. There's just one factorization, period. That's it. There's one way to write A as LL transpose. And how do you solve, you know, how do you solve AX equals B where A is positive definite? That's called a positive definite system of equations, right? So how do you do that? You do a Cholesky factorization and you do a forward and a backward substitution with L and L transpose."},{"latex":"P^T A P","symbols":"通过置换矩阵 P 对正定矩阵 A 进行重新排列","explanation":"公式正确，表示通过置换矩阵 P 对正定矩阵 A 进行重新排列，这是进行稀疏 Cholesky 分解的前提。","evidence":"This is basically the same as calling a Cholesky factorization on P transpose AP, right? Because take that equation, just multiplying the left by P transpose on the right by P. So what it basically says is permute your matrix, your positive definite matrix, and then do a Cholesky factorization where there is no creativity. It's just, there's a unique Cholesky factorization. Everybody got this?"}],"uncertainties":[],"diagram":"none","start":1041.01,"end":1209.7,"asr_flags":[],"math_clarifications":["公式 A = LL^T 正确表示正定矩阵的 Cholesky 分解，且 L 的对角线元素为正，这是唯一分解的条件。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1041.01,"text":"Like, I can do that on my phone. And, of course, that's the key to, you know, actually putting these things into a lot of control systems, right? So a lot of them actually do this. Okay. That's the big picture. So this is just, like, super cool to know about. Okay. This brings us to a very famous factorization. It's about 100 years old. It's the Cholesky factorization."},{"start":1068.09,"text":"So if you have a positive definite matrix, you can write it as just LL transpose. And if you insist that the entries of the diagonal entries of L are positive, then it's unique."},{"start":1080.38,"text":"So there's no choice. There's just one factorization, period. That's it. There's one way to write A as LL transpose. And how do you solve, you know, how do you solve AX equals B where A is positive definite? That's called a positive definite system of equations, right? So how do you do that? You do a Cholesky factorization and you do a forward and a backward substitution with L and L transpose."},{"start":1103.31,"text":"Okay. So, so that's, that's it. And, you know, actually it's one third n cubed as opposed to two n cubed for general matrices. And, you know, that kind of makes sense. I mean, first, number one, no one cares about a factor of two in a flop count estimate because these are so crude, right? What really matters is like the people who actually wrote the micro code and all that kind of stuff. And how's it blocked? And how many cores is it using? All sorts of crazy stuff internal that we don't have to, most of us don't, all of us, I'm guessing should not."},{"start":1131.83,"text":"and do not have to worry about, right? But we should also all be very grateful that there are people who do, right? So yeah, so there it's a factor of two, which is not unsurprising, it's symmetric. So roughly speaking, there's a redundancy of two. Or you can even look at this and say, hey, that's an LU factorization with U equals L. And you know why? Because the matrix is symmetric, that's why, right? So it's not, anyway, not too surprising."},{"start":1159.88,"text":"We will see very shortly where positive definite systems of equations arise. Actually, they arise by themselves in a lot of applications. But specifically in convex optimization, we'll see they're at the heart of a lot of stuff. And now we get the sparse Cholesky factorization. And here I'll tell you something super interesting about it, I think. So here, it turns out..."},{"start":1186.18,"text":"This is basically the same as calling a Cholesky factorization on P transpose AP, right? Because take that equation, just multiplying the left by P transpose on the right by P. So what it basically says is permute your matrix, your positive definite matrix, and then do a Cholesky factorization where there is no creativity. It's just, there's a unique Cholesky factorization. Everybody got this?"}],"speech_gaps":[],"frame":"../frames/v013/007.webp","frame_time":1053.01},{"title":"稀疏矩阵与Cholesky分解的结构影响","segments":[{"id":68,"text":"When you do that, you will find some stunning things out. You will find out that if you choose a good permutation, the L is going to be super sparse. If you choose a bad permutation, it's going to be dense. And I'll give you sort of a famous example of this. So it would be something like this. If I gave you this.","zh":"当你这样做时，你会发现一些令人惊叹的事情。你会发现，如果你选择一个好的排列，L 将会非常稀疏。如果你选择了一个不好的排列，它就会变得密集。我将给你一个这个现象的著名例子。所以它会是这样的。如果我给你这个矩阵。","start":1210.27,"end":1234.11},{"id":69,"text":"matrix here. So I'm going to draw a, here, I just make it this way. So it's got first row and column and a diagonal. Okay. So by the way, that's, that's called like an up, what do they call it? It's an arrow matrix, right? Because if you blur your eyes, it looks like an arrow or something. I don't know. Anyway, that's an upper arrow matrix. Everybody got, it's super sparse, right? Number of non-zeros per row and column, you know, except for the first row and column, it's like two, right?","zh":"这里我将画一个，这里我这样画出来。它有第一行和第一列以及对角线。好的。顺便说一下，这被称为上箭头矩阵，对吧？因为如果你眯起眼睛看，它看起来像一支箭头或者类似的东西。我不知道。总之，这是一个上箭头矩阵。大家明白了吗？它非常稀疏，对吧？每行和每列的非零元素数量，除了第一行和第一列，都是两个，对吧？","start":1235.0,"end":1261.76},{"id":70,"text":"So, okay, so that's an example of a, that is an example of a structure you should never ever see again and not have an emotional response to. Ever, right, because this is super important. Okay, so, okay, if I do a Cholesky factorization on that, here's, I'm going to show you the sparsity pattern of L. It's this, ready? It's completely dense. There, completely dense.","zh":"好的，所以这是一个例子，这是一个你永远不应该再看到并且不应该有情感反应的结构。永远，对吧，因为这非常重要。好的，所以，如果我在这样的矩阵上进行 Cholesky 分解，这里我将展示你得到的 L 的稀疏模式。它是这样的，准备好了吗？它是完全密集的。那里，完全密集。","start":1262.37,"end":1288.13},{"id":71,"text":"Okay, so this of course ruins everything, right? For one thing, you can't even store that much, right? Because if you started with a million by million, you know, upper arrow matrix called Cholesky on it, at some point your OS would say, no, I'm not going to allocate that amount of memory, no. So everybody got this? Okay, so now it turns out all you need to do with this is permute the first and last columns.","zh":"好的，这当然毁掉了所有事情，对吧？首先，你甚至无法存储这么多数据，对吧？因为如果你从一个百万乘百万的上箭头矩阵开始，对其进行 Cholesky 分解，操作系统会在某个时候说，不，我不会分配这么多内存，不。大家明白了吗？好的，现在事实证明，你只需要将第一列和最后一列进行排列，","start":1288.89,"end":1317.13},{"id":72,"text":"and first and last rows and columns, and then you end up with this matrix, and that, that's called a, you know, like a, I don't know, it's a whatever, that's called an arrow structure, right? We'll get to others, but anyway, that's one. Okay, if I do a Cholesky factorization on this, I will show you the sparsity pattern you get. You get this, and that's all, okay? So...","zh":"以及第一行和最后一行和最后一列，然后你就会得到这个矩阵，这个就是所谓的箭头结构，对吧？我们之后会看到其他结构，但无论如何，这就是其中一个。好的，如果我在这样的矩阵上进行 Cholesky 分解，我将展示你得到的稀疏模式。你会得到这个，而且这就是全部，对吧？","start":1318.05,"end":1345.83},{"id":73,"text":"What it means is, you know, it means that the permutation that permuted this into this was super important, at least from a sparsity point of view. Okay, everybody got it? So what this means is, if you had that set of equations to solve, actually, if you just called a sparse solver on your behalf, you wouldn't even know it, but the permutation would change it to this, factor that, and then your factor time is going to be order n.","zh":"这意味着，你知道的，这意味着将这个矩阵转换为这个形式的排列非常重要，至少从稀疏性的角度来看。好的，大家明白了吗？所以这意味着，如果你有一组方程需要求解，实际上，如果你只是调用一个稀疏求解器来为你处理，你甚至不会意识到这一点，但排列会将其转换为这种形式，进行分解，然后你的分解时间将与n的阶数成比例。","start":1346.6,"end":1374.86}],"notes":["本段讲解了稀疏矩阵在Cholesky分解中的重要性，指出如果选择不当的排列，会导致分解后的矩阵变得密集，从而影响存储和计算效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1210.27,"end":1374.86,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1210.27,"text":"When you do that, you will find some stunning things out. You will find out that if you choose a good permutation, the L is going to be super sparse. If you choose a bad permutation, it's going to be dense. And I'll give you sort of a famous example of this. So it would be something like this. If I gave you this."},{"start":1235.0,"text":"matrix here. So I'm going to draw a, here, I just make it this way. So it's got first row and column and a diagonal. Okay. So by the way, that's, that's called like an up, what do they call it? It's an arrow matrix, right? Because if you blur your eyes, it looks like an arrow or something. I don't know. Anyway, that's an upper arrow matrix. Everybody got, it's super sparse, right? Number of non-zeros per row and column, you know, except for the first row and column, it's like two, right?"},{"start":1262.37,"text":"So, okay, so that's an example of a, that is an example of a structure you should never ever see again and not have an emotional response to. Ever, right, because this is super important. Okay, so, okay, if I do a Cholesky factorization on that, here's, I'm going to show you the sparsity pattern of L. It's this, ready? It's completely dense. There, completely dense."},{"start":1288.89,"text":"Okay, so this of course ruins everything, right? For one thing, you can't even store that much, right? Because if you started with a million by million, you know, upper arrow matrix called Cholesky on it, at some point your OS would say, no, I'm not going to allocate that amount of memory, no. So everybody got this? Okay, so now it turns out all you need to do with this is permute the first and last columns."},{"start":1318.05,"text":"and first and last rows and columns, and then you end up with this matrix, and that, that's called a, you know, like a, I don't know, it's a whatever, that's called an arrow structure, right? We'll get to others, but anyway, that's one. Okay, if I do a Cholesky factorization on this, I will show you the sparsity pattern you get. You get this, and that's all, okay? So..."},{"start":1346.6,"text":"What it means is, you know, it means that the permutation that permuted this into this was super important, at least from a sparsity point of view. Okay, everybody got it? So what this means is, if you had that set of equations to solve, actually, if you just called a sparse solver on your behalf, you wouldn't even know it, but the permutation would change it to this, factor that, and then your factor time is going to be order n."}],"speech_gaps":[],"frame":"../frames/v013/008.webp","frame_time":1222.27},{"title":"求解器的运行时间与符号计算","segments":[{"id":74,"text":"And your solve time will be order end, right? So everybody following this? So that's it. So this is, fortunately for a lot of those things, you don't have to worry about it. That's all based inside. All of you have benefited from this probably a million times just so far in this class. Because every time CVXPy calls a solver.","zh":"你们的求解时间会是阶数的量级，对吧？所以大家都跟上来了吗？所以就是这样。所以对于很多这些事情，你们不用担心。这一切都是基于内部的。你们可能在这一节课中已经受益了数百万次。因为每次CVXPy调用一个求解器。","start":1375.55,"end":1396.28},{"id":75,"text":"This is what's happening. This is the kind of stuff that's happening on your behalf many, many times every time you call solve on something. Okay? So it doesn't matter. I mean, but just now you know. Okay. Does this make sense? Yeah. How much time does it take for a solver to find that P? That's a...","zh":"这就是正在发生的事情。这就是你们每次调用solve时，背后发生的事情。明白吗？所以没关系。我是说，但你们现在知道了。好吧。这有没有道理？是的。求解器找到那个P需要多长时间？这……","start":1396.75,"end":1416.13},{"id":76,"text":"Maybe that's a perfect question. I should have said it. So the question is how long, you know, so yeah, if I, if I say, oh man, are you kidding? I can do this for you. Not a problem. I'm going to find a permutation like that. And then I can solve this in 10th of a second. And you go, cool. How long did it take you to find the permutation? You go a couple of days, you know, it's just not. Yeah. So the general rule of thumb is people use heuristics for finding P that are, they hope on the order of magnitude.","zh":"也许这是一个完美的问题。我应该早点说的。问题是，你知道，所以是的，如果我说，天啊，你开玩笑吗？我可以为你们做这个。没问题。我要找到这样一个排列。然后我可以在这个问题上用十分之一秒就解决它。然后你们说，酷。你花多长时间找到这个排列？你们说，花几天时间，你知道的，这根本不是。是的。所以一般的经验法则是，人们使用寻找P的启发式方法，他们希望这个时间量级。","start":1416.73,"end":1445.33},{"id":77,"text":"of the amount of time it takes to actually do the numerical factorization. So that's what they do. Now there are applications where people will run, they'll take more time to actually work out a better permutation because they're going to use this a gazillion times. So this would be the case for embedded systems, like for control.","zh":"与实际进行数值分解所需的时间量级相当。这就是他们所做的。现在有一些应用中，人们会花更多时间来找出更好的排列，因为他们会使用这个数以万次。这在嵌入式系统中会出现，比如在控制中。","start":1446.11,"end":1467.64},{"id":78,"text":"So if you're doing control and you're going to put this into, let's say, a rocket or something like that, and you know it's going to run at 100 hertz for the entire mission or whatever it is, that's a lot of time.","zh":"所以如果你在做控制，并且要把这个放进火箭或者其他东西中，你知道它在整个任务中会以100赫兹的频率运行，这会花费很多时间。","start":1468.28,"end":1482.04},{"id":79,"text":"It's worth, you can take it, you could definitely take an evening to come up with a better permutation. But this is not what most people doing numeric, most people doing numeric, who work on the, you know, solution of sparse linear equations, don't do that. They just stick with heuristics that are fast. And by the way, that portion is called the symbolic, sometimes they call that the symbolic solve, or the permutation phase. There's lots of names for it.","zh":"这值得，你可以花一个晚上来找出更好的排列。但大多数人做数值计算，那些在解决稀疏线性方程上工作的人，不会这么做。他们只是使用快速的启发式方法。顺便说一句，这一部分有时被称为符号计算，有时也称为符号求解，或者排列阶段。有很多不同的名称。","start":1482.5,"end":1507.28},{"id":80,"text":"Right? And you can tell if you actually, if you do things like, if you actually look at it to see what it's actually doing, you will find out that it's spending a whole bunch of time and it's doing graph calculations. There's no floating point numbers involved. Okay? Then when floating point number operations start up, that means you're actually doing the numerical factorization. That's a good question. Okay.","zh":"对吧？而且如果你实际去做一些事情，比如仔细查看它在做什么，你会发现它花费了大量的时间在进行图计算。这其中并没有涉及浮点数运算。明白了吗？当浮点数运算开始执行时，这意味着你实际上正在进行数值分解。这是一个好问题。好的。","start":1508.25,"end":1534.37}],"notes":["本段主要讲解了求解器运行时间的构成，特别是符号计算和数值分解两个阶段。符号计算阶段主要涉及排列（permutation）和图计算，不涉及浮点运算，而数值分解阶段则涉及实际的数值计算。","在符号计算阶段，人们通常使用启发式方法来寻找排列，这些方法的时间复杂度通常与数值分解的时间复杂度在同一数量级。对于某些应用，如嵌入式系统或控制系统，可能需要更优化的排列以提高效率。","在控制系统中，如果求解器需要在任务期间频繁运行（如火箭控制），则优化排列可能值得投入更多时间。然而，大多数数值计算人员通常使用快速启发式方法，而不是花费大量时间优化排列。","符号计算阶段有时被称为符号求解或排列阶段，涉及图计算等操作，而数值分解阶段则涉及浮点运算，标志着实际的数值计算开始。","这些内容帮助学生理解求解器内部的工作机制，以及如何优化计算过程，特别是在实际应用中如何权衡计算时间和效率。","通过这些讲解，学生可以更好地理解数值计算中的符号和数值阶段的区别，以及如何在实际问题中应用这些知识。"],"formulas":[],"uncertainties":["order end"],"diagram":"none","start":1375.55,"end":1534.37,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1375.55,"text":"And your solve time will be order end, right? So everybody following this? So that's it. So this is, fortunately for a lot of those things, you don't have to worry about it. That's all based inside. All of you have benefited from this probably a million times just so far in this class. Because every time CVXPy calls a solver."},{"start":1396.75,"text":"This is what's happening. This is the kind of stuff that's happening on your behalf many, many times every time you call solve on something. Okay? So it doesn't matter. I mean, but just now you know. Okay. Does this make sense? Yeah. How much time does it take for a solver to find that P? That's a..."},{"start":1416.73,"text":"Maybe that's a perfect question. I should have said it. So the question is how long, you know, so yeah, if I, if I say, oh man, are you kidding? I can do this for you. Not a problem. I'm going to find a permutation like that. And then I can solve this in 10th of a second. And you go, cool. How long did it take you to find the permutation? You go a couple of days, you know, it's just not. Yeah. So the general rule of thumb is people use heuristics for finding P that are, they hope on the order of magnitude."},{"start":1446.11,"text":"of the amount of time it takes to actually do the numerical factorization. So that's what they do. Now there are applications where people will run, they'll take more time to actually work out a better permutation because they're going to use this a gazillion times. So this would be the case for embedded systems, like for control."},{"start":1468.28,"text":"So if you're doing control and you're going to put this into, let's say, a rocket or something like that, and you know it's going to run at 100 hertz for the entire mission or whatever it is, that's a lot of time."},{"start":1482.5,"text":"It's worth, you can take it, you could definitely take an evening to come up with a better permutation. But this is not what most people doing numeric, most people doing numeric, who work on the, you know, solution of sparse linear equations, don't do that. They just stick with heuristics that are fast. And by the way, that portion is called the symbolic, sometimes they call that the symbolic solve, or the permutation phase. There's lots of names for it."},{"start":1508.25,"text":"Right? And you can tell if you actually, if you do things like, if you actually look at it to see what it's actually doing, you will find out that it's spending a whole bunch of time and it's doing graph calculations. There's no floating point numbers involved. Okay? Then when floating point number operations start up, that means you're actually doing the numerical factorization. That's a good question. Okay."}],"speech_gaps":[],"frame":"../frames/v013/009.webp","frame_time":1387.55},{"title":"稀疏矩阵的Cholesky分解与图论","segments":[{"id":81,"text":"So I know I'm not able to, I mean, I realize for many of you, if this is the first time you've seen it, that's fine. You should just get the high level picture of it. And you could read this a little bit more in the appendix in the book. There's an appendix on this. And this is just something you should know about. So I don't know, sci-fi, you could poke around in sci-fi or something. Once you know about this, you can't unknow about it. And it's kind of, you will have like incredible powers. Yes.","zh":"我知道我做不到，我的意思是，我意识到对很多人来说，如果这是你们第一次看到这个，那也没关系。你们只需要大致了解它的概念就可以了。你们可以在书的附录里再读一些相关内容。书里有一个关于这个主题的附录。这只是你们应该知道的一些事情。所以，我不确定，你们可以去科幻小说里找找看或者做些其他事情。一旦你们了解了这个，就再也无法忘记它了。它有点像，你们会拥有不可思议的力量。是的。","start":1535.03,"end":1558.83},{"id":82,"text":"Well, yeah, they do. So some are kind of greedy. I'd have to tell you actually how you actually do the factorization to actually explain the heuristics. But a lot of them are just constructed one by one. What they do is they say, p is going to permute something to the top row. And they'd say, I'm going to find which entry I should permute to the top.","zh":"是的，它们确实如此。所以有些方法是有点贪婪的。我实际上需要告诉你们如何进行分解，才能解释这些启发式方法。但很多方法只是逐个构造的。它们的做法是，p会将某个元素放到第一行。然后它们会说，我要找到应该放到第一行的元素。","start":1561.37,"end":1583.83},{"id":83,"text":"then who gets permuted to the second top, then third top and fourth top, things like that. But that's greedy. But that's the kind of things people use. And they have lots of names, and it's worth knowing a little bit about them. Yeah? Sorry for finding the best one, but are there, like, approximation guarantees? No, there's no approximation guarantees whatsoever. No. Right, so, yeah, no one has... Yeah, so, yeah, it's one of those things where, you know, we can ask, of course...","zh":"然后谁会被放到第二行，第三行，第四行，等等。但这是贪婪的。但这就是人们通常使用的方法。它们有很多名字，了解一些也是有帮助的。是的？抱歉，我找不到最好的方法，但有没有近似保证呢？不，完全没有近似保证。不，对的，所以，是的，没有人会……是的，是的，这就是那种事情，你们当然可以问……","start":1584.37,"end":1612.0},{"id":84,"text":"Right, so that, if you know what a chordal graph is, that's one of them. That's actually kind of useless, frankly, in practice, because the real question is not whether there exists one, the question is whether our heuristics find it. And the answer is, all decent heuristics will find that one.","zh":"对的，所以，如果你们知道什么是弦图，那就是其中之一。坦白说，这在实践中其实有点用处，因为真正的问题不是是否存在这样的结构，而是我们的启发式方法能否找到它。答案是，所有合理的启发式方法都能找到它。","start":1612.26,"end":1640.34},{"id":85,"text":"Right, so that, if you know what a chordal graph is, that's one of them. That's actually kind of useless, frankly, in practice, because the real question is not whether there exists one, the question is whether our heuristics find it. And the answer is, all decent heuristics will find that one. So, yeah. Do these factorizations have required that we know the matrix is non-singular, that it's positively definite? No, so it turns out most of the, so in this one,","zh":"对的，所以，如果你们知道什么是弦图，那就是其中之一。坦白说，这在实践中其实有点用处，因为真正的问题不是是否存在这样的结构，而是我们的启发式方法能否找到它。答案是，所有合理的启发式方法都能找到它。所以，是的。这些分解是否要求我们事先知道矩阵是非奇异的，或者它是正定的？不，事实上，大多数情况下，","start":1641.55,"end":1668.68},{"id":86,"text":"To find the permutation for Cholesky factorization, you actually don't have to know the entries in A. You simply have to know their locations. That's actually a super important, more advanced, but you...","zh":"为了找到Cholesky分解的排列，实际上你并不需要知道矩阵A中的元素值。你只需要知道这些元素的位置。这实际上是一个非常重要的、更高级的概念，但你……","start":1669.18,"end":1680.62},{"id":87,"text":"You brought it up. So what this means is we can do this ahead of time. So for example, if we're solving an optimal control problem or something like that, we can do the permutation once and for all offline. And then when this thing is actually running a jet engine or something like that, then we don't have to do it. If we're doing finance and we want to do an insanely fast back test, we would first do the factorization. And then after that, every solve is going to be really fast.","zh":"你提到了这一点。这意味着我们可以在事前完成这个步骤。例如，如果我们正在解决一个最优控制问题或者类似的问题，我们可以一次性离线完成排列。当这个系统实际运行，比如在运行喷气发动机时，就不需要再进行这个步骤了。如果我们从事金融领域，并希望进行极其快速的回测，我们首先会进行分解。之后，每次求解都会非常快速。","start":1680.99,"end":1710.11}],"notes":["本段讲解了稀疏矩阵Cholesky分解中关于图论的应用。当矩阵A的稀疏模式对应的图是弦图（chordal graph）时，存在一种排列方式，使得分解过程中不会引入新的非零元素（zero fill-in），即分解后的下三角矩阵L的非零元素数量等于原矩阵A的非零元素数量的一半。然而，这种理论在实际应用中价值有限，因为关键问题在于启发式方法是否能找到这种排列方式，而所有合理的启发式方法都能找到它。","本段还提到，进行Cholesky分解时，不需要知道矩阵A的具体元素值，只需要知道它们的位置。这在实际应用中非常重要，因为可以提前进行排列，从而在后续的求解过程中节省计算时间。","在实际应用中，例如最优控制问题或金融回测，可以提前进行Cholesky分解的排列，从而在运行时（如飞机引擎运行或金融回测）节省计算资源。这种预处理步骤在需要快速求解的场景中非常有用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1535.03,"end":1710.11,"asr_flags":[],"math_clarifications":["该公式错误地假设了Cholesky分解后下三角矩阵L的非零元素数量与原矩阵A的非零元素数量之间的关系，这种关系并不成立。正确的非零元素数量取决于矩阵的稀疏结构和分解过程中的填充情况。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1535.03,"text":"So I know I'm not able to, I mean, I realize for many of you, if this is the first time you've seen it, that's fine. You should just get the high level picture of it. And you could read this a little bit more in the appendix in the book. There's an appendix on this. And this is just something you should know about. So I don't know, sci-fi, you could poke around in sci-fi or something. Once you know about this, you can't unknow about it. And it's kind of, you will have like incredible powers. Yes."},{"start":1561.37,"text":"Well, yeah, they do. So some are kind of greedy. I'd have to tell you actually how you actually do the factorization to actually explain the heuristics. But a lot of them are just constructed one by one. What they do is they say, p is going to permute something to the top row. And they'd say, I'm going to find which entry I should permute to the top."},{"start":1584.37,"text":"then who gets permuted to the second top, then third top and fourth top, things like that. But that's greedy. But that's the kind of things people use. And they have lots of names, and it's worth knowing a little bit about them. Yeah? Sorry for finding the best one, but are there, like, approximation guarantees? No, there's no approximation guarantees whatsoever. No. Right, so, yeah, no one has... Yeah, so, yeah, it's one of those things where, you know, we can ask, of course..."},{"start":1612.26,"text":"These are all graph calculations. These are just questions about graphs, right? Oh, there is one exception. There's one theory of it. That's this. If the graph represented by the sparsity pattern of A is chordal, then it turns out there is a permutation. It's guaranteed there exists a permutation which has zero fill-in, meaning the number of non-zeros in L will be identical to the number of non-zeros in A divided by 2."},{"start":1641.55,"text":"Right, so that, if you know what a chordal graph is, that's one of them. That's actually kind of useless, frankly, in practice, because the real question is not whether there exists one, the question is whether our heuristics find it. And the answer is, all decent heuristics will find that one. So, yeah. Do these factorizations have required that we know the matrix is non-singular, that it's positively definite? No, so it turns out most of the, so in this one,"},{"start":1669.18,"text":"To find the permutation for Cholesky factorization, you actually don't have to know the entries in A. You simply have to know their locations. That's actually a super important, more advanced, but you..."},{"start":1680.99,"text":"You brought it up. So what this means is we can do this ahead of time. So for example, if we're solving an optimal control problem or something like that, we can do the permutation once and for all offline. And then when this thing is actually running a jet engine or something like that, then we don't have to do it. If we're doing finance and we want to do an insanely fast back test, we would first do the factorization. And then after that, every solve is going to be really fast."}],"speech_gaps":[],"frame":"../frames/v013/010.webp","frame_time":1547.03},{"title":"Cholesky分解与LDL转置分解","segments":[{"id":88,"text":"So that's how that works. So you don't know, you don't have to know. If A is not positive definite and you call a Cholesky factorization on it, it will fail at some point. At some point it's going to attempt to take the square root of a negative number. And then it'll throw an exception to you of some kind. But that's the only time you would ever know.","zh":"这就是它的运作方式。你不需要知道，也不必知道。如果矩阵A不是正定的，当你调用Cholesky分解时，它会在某个时候失败。在某个时候，它会尝试对负数开平方，然后会向你抛出某种异常。但这是你唯一会知道的时候。","start":1711.01,"end":1734.69},{"id":89,"text":"When does the solver know what to stop? What kind of criterion? All of these are finite algorithms. And in infinite precision, they just solve. When I say it's order n cubed, it means I can tell you for this, you're going to do 1 billion, blah, blah, blah, blah, blah, multiplies 1.3 billion ads. When it's done,","zh":"求解器什么时候知道该停止？使用什么样的标准？所有这些都是有限算法。在无限精度下，它们会直接求解。当我提到它的复杂度是n的立方次方时，这意味着我可以告诉你，对于这个问题，你将进行10亿次，等等，等等，等等，乘法运算13亿次。当它完成时，","start":1737.53,"end":1760.27},{"id":90,"text":"Okay, if you did everything in infinite precision, you would have the answer. End of story. There's no stopping criterion. There's nothing like that. No
