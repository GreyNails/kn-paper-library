w, of course, you're doing this in finite precision, right? So since you asked, there are methods to do something. It's called iterative refinement. And what that does is you compute a solution that's approximate, and then you can actually do, you can iterate to get a better solution.","zh":"如果你在无限精度下完成所有计算，你就会得到答案。故事到此结束。没有停止标准。没有这样的东西。当然，你是在有限精度下进行这些计算的，对吧？既然你问了，有一些方法可以做到这一点。这被称为迭代精炼。它的做法是，你计算一个近似解，然后你可以迭代以得到更好的解。","start":1761.22,"end":1788.42},{"id":91,"text":"And people know about that, but that's a little bit beyond what we're talking about here. But it's good to know about too. Okay. Okay. So LDL transpose factorization. This is any non-singular symmetric matrix, right? By the way, we'll see examples of where these come up.","zh":"人们知道这一点，但这稍微超出了我们在这里讨论的范围。但了解它也是有好处的。好的。好的。LDL转置分解。这是任何非奇异对称矩阵，对吧？顺便说一句，我们将会看到这些矩阵出现的例子。","start":1789.0,"end":1810.85},{"id":92,"text":"maybe next week, in fact. So here, it's like L, it's like an LDL transpose factorization, but D is diagonal, and it's either one by one or two by two blocks. So that's just a mathematical fact that you might need to have these two by two blocks. But the point is, those are all easily inverted matrices. Permutations, yes. Lower triangular, yes. A block diagonal matrix with one by one and two by two blocks, I think we know how to invert that.","zh":"事实上，可能在下周。在这里，它类似于LDL转置分解，但D是对角线的，且由一个一个块或两个两个块组成。这只是一个数学事实，你可能需要这些两个两个块。但关键是，这些都是很容易求逆的矩阵。排列矩阵，是的。下三角矩阵，是的。一个由一个一个块和两个两个块组成的块对角矩阵，我想我们知道如何求逆。","start":1811.43,"end":1839.01},{"id":93,"text":"That one we actually literally know how to invert. But we can certainly solve equations like that, right? So, okay. So this is the LDL transpose factorization. And now we're going to talk about something. This is something probably many of you have seen in other contexts. It comes up in pretty much all fields. So it's something called the Schur complement.","zh":"我们实际上确切知道如何求逆。但我们可以确定地解这样的方程，对吧？所以，好的。这就是LDL转置分解。现在我们将谈论一些东西。这可能是你们在其他上下文中见过的东西。它几乎出现在所有领域中。这被称为Schur补。","start":1839.39,"end":1863.93},{"id":94,"text":"is the name of it. And I think you've already seen it early on in the class or something like that. But I can't think of a legitimate field where it doesn't come up.","zh":"这是它的名称。我想你们可能在课堂早期就已经见过它了，或者类似的情况。但我想不到有任何一个合法的领域它不会出现。","start":1864.54,"end":1873.94}],"notes":["本段主要讲解了Cholesky分解的失败条件，即当矩阵A不是正定矩阵时，分解过程会失败，因为会尝试对负数开平方。这种失败是唯一能被检测到的情况。此外，还提到在无限精度下，算法会直接求解，没有停止准则，但在有限精度下，需要使用迭代修正方法来提高解的精度。","LDL转置分解适用于任何非奇异对称矩阵，其分解形式为L、D和L的转置，其中D是主对角线矩阵，可能包含1×1或2×2的块。这种分解形式的矩阵容易求逆，因为其结构简单，可以分解为排列矩阵、下三角矩阵和块对角矩阵。","Schur补是一个在多个领域中广泛应用的概念，它在处理矩阵分解和优化问题时非常有用。虽然本段没有详细展开Schur补的定义和应用，但提到了它在不同学科中的普遍性。","在讲解过程中，强调了数值计算中的精度问题，指出在实际计算中，由于有限精度的限制，必须采用迭代修正等方法来提高解的准确性。这反映了数值计算中常见的挑战和解决方案。","本段还提到，LDL转置分解的结构使得求解线性方程组变得容易，因为其分解后的矩阵具有良好的数值性质，便于求逆和求解。","Schur补的概念虽然在本段中没有详细展开，但其重要性被强调，说明它在多个学科中的广泛应用，这为后续课程内容的展开提供了背景。"],"formulas":[{"latex":"A = LDL^\\text{T}","symbols":"A 是一个非奇异对称矩阵，L 是下三角矩阵，D 是对角矩阵","explanation":"公式正确，符合LDL^T分解的定义，其中A是一个非奇异对称矩阵，L是下三角矩阵，D是对角矩阵。","evidence":"maybe next week, in fact. So here, it's like L, it's like an LDL transpose factorization, but D is diagonal, and it's either one by one or two by two blocks. So that's just a mathematical fact that you might need to have these two by two blocks. But the point is, those are all easily inverted matrices. Permutations, yes. Lower triangular, yes. A block diagonal matrix with one by one and two by two blocks, I think we know how to invert that."}],"uncertainties":[],"diagram":"none","start":1711.01,"end":1873.94,"asr_flags":[89],"math_clarifications":["公式A = LDL^T是正确的LDL^T分解形式，其中L是下三角矩阵，D是对角矩阵，适用于非奇异对称矩阵。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":1711.01,"text":"So that's how that works. So you don't know, you don't have to know. If A is not positive definite and you call a Cholesky factorization on it, it will fail at some point. At some point it's going to attempt to take the square root of a negative number. And then it'll throw an exception to you of some kind. But that's the only time you would ever know."},{"start":1737.53,"text":"When does the solver know what to stop? What kind of criterion? All of these are finite algorithms. And in infinite precision, they just solve. When I say it's order n cubed, it means I can tell you for this, you're going to do 1 billion, blah, blah, blah, blah, blah, multiplies 1.3 billion ads. When it's done,"},{"start":1761.22,"text":"Okay, if you did everything in infinite precision, you would have the answer. End of story. There's no stopping criterion. There's nothing like that. Now, of course, you're doing this in finite precision, right? So since you asked, there are methods to do something. It's called iterative refinement. And what that does is you compute a solution that's approximate, and then you can actually do, you can iterate to get a better solution."},{"start":1789.0,"text":"And people know about that, but that's a little bit beyond what we're talking about here. But it's good to know about too. Okay. Okay. So LDL transpose factorization. This is any non-singular symmetric matrix, right? By the way, we'll see examples of where these come up."},{"start":1811.43,"text":"maybe next week, in fact. So here, it's like L, it's like an LDL transpose factorization, but D is diagonal, and it's either one by one or two by two blocks. So that's just a mathematical fact that you might need to have these two by two blocks. But the point is, those are all easily inverted matrices. Permutations, yes. Lower triangular, yes. A block diagonal matrix with one by one and two by two blocks, I think we know how to invert that."},{"start":1839.39,"text":"That one we actually literally know how to invert. But we can certainly solve equations like that, right? So, okay. So this is the LDL transpose factorization. And now we're going to talk about something. This is something probably many of you have seen in other contexts. It comes up in pretty much all fields. So it's something called the Schur complement."},{"start":1864.54,"text":"is the name of it. And I think you've already seen it early on in the class or something like that. But I can't think of a legitimate field where it doesn't come up."}],"speech_gaps":[],"frame":"../frames/v013/011.webp","frame_time":1723.01},{"title":"块矩阵与条件问题","segments":[{"id":95,"text":"right? So in statistics, it's conditioning a Gaussian on some entries, right? In mechanics, it's actually what happens when you impose the boundary conditions on something and ask where everything else is. In electrical engineering, you take a network and I put a termination on some of the ports on the network and I ask what's happening with the rest of them, right? So all fields have this. Okay. And the idea is actually embarrassingly simple. So it goes like this. We're going to","zh":"对吧？所以在统计学中，这是对高斯分布的一些条目进行条件化，对吧？在力学中，这是当你对某个物体施加边界条件并询问其余部分的情况时所发生的事情。在电气工程中，你有一个网络，我在这个网络的一些端口上加上终止器，然后询问其余部分的情况，对吧？所以所有领域都有这种情况。好的。而这个想法实际上非常简单。它是这样的。我们将写 AX 等于 B。我们将把 A 分成一些块，比如 A11。我将让 A11 和 A22 是方阵，对吧？我也会将 X 和 B 一致地分成块。它们将被称为 X1 堆叠在 X2 上，B1 堆叠在 B2 上，对吧？好的。现在，什么都没发生。我只是决定用这种方式命名。我只是以一种奇怪的方式将其分开了。好的。","start":1874.35,"end":1903.15},{"id":96,"text":"write AX equals B. We're going to block A into some blocks, like A11. And I'm going to have A11 and A22 be square, right? And I'll also conformally block X and B. So they're going to be called X1 stacked on X2 and B1 stacked on B2, right? Okay. Now, nothing has happened. I just decided to name it this way. So I just divided it in some weird way. Okay.","zh":"现在，你实际上会做的是，我指的是，你做的是你可能在高中学过的事情，只是那些是数字而不是矩阵。因此，你所做的就是我们只需以一种奇怪的方式解决这个问题。所以第一个方程，块方程，是 a11 x1 加上 a12 x2 等于 b1，对吧？我们将在这里做一个假设，即 a11 是可逆的。","start":1904.48,"end":1932.01},{"id":97,"text":"What happens now is you do actually, I mean, you do kind of what you learned in maybe high school, except those were numbers and not matrices. And so what you do is you just, we just work out, we can actually just solve this in a weird way. So the first equation, block equation, is a11 x1 plus a12 x2 equals b1, right? And we're going to assume here, we're going to make an assumption that a11 is invertible.","zh":"现在的情况是，你实际上做了你可能在高中时学到的东西，只不过那时处理的是数字而不是矩阵。因此，我们只需以一种奇怪的方式进行计算。第一个方程，块方程，是 a11 x1 加上 a12 x2 等于 b1，对吧？我们将在这里做一个假设，即 a11 是可逆的。","start":1933.07,"end":1960.83},{"id":98,"text":"OK, then. So what that says is, well, I can I could do this. This is minus a one to X two. Right. That's that's that. Right. And then I'll just put an a one one inverse here. OK, so there we go. Like that. OK. Yeah. By the way, already when you see this, this is hinting that this is going to be interesting when a one one is easy to invert.","zh":"所以这将是有趣的部分。好的，但我们先不急着到达那里。好的，我将这个表达式代入第二个方程，第二个方程是 a21x1 加上 a22x2 等于 b2。我将这个表达式代入其中。","start":1961.86,"end":1989.32},{"id":99,"text":"So that's going to be the interesting part. Okay, but we'll get there. Okay, I plug this into the second equation, and the second equation is like a21x1 plus a22x2 equals b2. And I plug this expression in here.","zh":"我将得到类似这样的结果，你知道的，A21 A11 逆乘以 B1 减去 A12 X2 加上 A22 X2 等于 B2，对吧？这很合理，对吧？然后我只需重新排列这个式子，使其看起来像这里的方程。","start":1989.76,"end":2008.85},{"id":100,"text":"And I'm going to get something like, you know, A21 A11 inverse times B1 minus A12 X2 plus A22 X2 equals B2, right? So, makes sense, okay? And then I just, I rearrange that to look like this equation here.","zh":"所以，这将是有趣的部分。好的，但我们先不急着到达那里。好的，我将这个表达式代入第二个方程，第二个方程是 a21x1 加上 a22x2 等于 b2。我将这个表达式代入其中。","start":2009.58,"end":2031.84}],"notes":["本段讲解了块矩阵的求解方法，通过将矩阵和向量分成块，利用已知块的可逆性来求解未知块。讲者提到，当块矩阵的某个子块容易求逆时，这种方法会变得特别有用。","讲者通过将矩阵A分成A11和A22两个块，并将向量X和B也分成X1、X2和B1、B2，从而将原问题转化为两个方程组。通过假设A11可逆，可以将第一个方程解出X1，再代入第二个方程求解X2。","在求解过程中，讲者强调了矩阵块的结构和可逆性的重要性，指出当A11容易求逆时，整个求解过程会更加高效。","讲者还提到，通过将第一个方程的解代入第二个方程，可以得到一个关于X2的方程，从而进一步求解整个问题。这种分块求解的方法在处理大规模矩阵时非常有用。","讲者通过具体的例子说明了块矩阵的求解过程，强调了矩阵块的结构和可逆性在求解过程中的关键作用。","最后，讲者指出，这种分块求解的方法在多个领域都有应用，如统计学、力学和电气工程，说明了其广泛的应用价值。"],"formulas":[{"latex":"A_{11}X_1 + A_{12}X_2 = B_1","symbols":"A_{11}X_1 + A_{12}X_2 = B_1","explanation":"该公式表示矩阵方程的块形式，其中A11和A12是矩阵块，X1和X2是未知向量块，B1是已知向量块。","evidence":"What happens now is you do actually, I mean, you do kind of what you learned in maybe high school, except those were numbers and not matrices. And so what you do is you just, we just work out, we can actually just solve this in a weird way. So the first equation, block equation, is a11 x1 plus a12 x2 equals b1, right? And we're going to assume here, we're going to make an assumption that a11 is invertible."},{"latex":"A_{21}X_1 + A_{22}X_2 = B_2","symbols":"A_{21}X_1 + A_{22}X_2 = B_2","explanation":"该公式表示矩阵方程的另一个块形式，其中A21和A22是矩阵块，X1和X2是未知向量块，B2是已知向量块。","evidence":"So that's going to be the interesting part. Okay, but we'll get there. Okay, I plug this into the second equation, and the second equation is like a21x1 plus a22x2 equals b2. And I plug this expression in here."},{"latex":"A_{21}A_{11}^{-1}B_1 - A_{12}X_2 + A_{22}X_2 = B_2","symbols":"A_{21}A_{11}^{-1}B_1 - A_{12}X_2 + A_{22}X_2 = B_2","explanation":"该公式表示将第一个方程的解代入第二个方程后得到的表达式，其中A11^{-1}表示A11的逆矩阵，X2是未知向量块，B2是已知向量块。","evidence":"And I'm going to get something like, you know, A21 A11 inverse times B1 minus A12 X2 plus A22 X2 equals B2, right? So, makes sense, okay? And then I just, I rearrange that to look like this equation here."}],"uncertainties":["a one to X two"],"diagram":"none","start":1874.35,"end":2031.84,"asr_flags":[],"math_clarifications":["公式中的矩阵块和向量块的命名方式符合线性代数的标准表示法，且所有操作都基于矩阵的块分解和逆矩阵的计算。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1874.35,"text":"right? So in statistics, it's conditioning a Gaussian on some entries, right? In mechanics, it's actually what happens when you impose the boundary conditions on something and ask where everything else is. In electrical engineering, you take a network and I put a termination on some of the ports on the network and I ask what's happening with the rest of them, right? So all fields have this. Okay. And the idea is actually embarrassingly simple. So it goes like this. We're going to"},{"start":1904.48,"text":"write AX equals B. We're going to block A into some blocks, like A11. And I'm going to have A11 and A22 be square, right? And I'll also conformally block X and B. So they're going to be called X1 stacked on X2 and B1 stacked on B2, right? Okay. Now, nothing has happened. I just decided to name it this way. So I just divided it in some weird way. Okay."},{"start":1933.07,"text":"What happens now is you do actually, I mean, you do kind of what you learned in maybe high school, except those were numbers and not matrices. And so what you do is you just, we just work out, we can actually just solve this in a weird way. So the first equation, block equation, is a11 x1 plus a12 x2 equals b1, right? And we're going to assume here, we're going to make an assumption that a11 is invertible."},{"start":1961.86,"text":"OK, then. So what that says is, well, I can I could do this. This is minus a one to X two. Right. That's that's that. Right. And then I'll just put an a one one inverse here. OK, so there we go. Like that. OK. Yeah. By the way, already when you see this, this is hinting that this is going to be interesting when a one one is easy to invert."},{"start":1989.76,"text":"So that's going to be the interesting part. Okay, but we'll get there. Okay, I plug this into the second equation, and the second equation is like a21x1 plus a22x2 equals b2. And I plug this expression in here."},{"start":2009.58,"text":"And I'm going to get something like, you know, A21 A11 inverse times B1 minus A12 X2 plus A22 X2 equals B2, right? So, makes sense, okay? And then I just, I rearrange that to look like this equation here."}],"speech_gaps":[],"frame":"../frames/v013/012.webp","frame_time":1886.35},{"title":"关于块矩阵的Schur补及其应用","segments":[{"id":101,"text":"I just put, and that's another equation in X2. This matrix here is famous, and it's called the Schur complement of the original matrix. I can't remember if it's with respect to the 1-1 or 2-2 block, but it's one of those two, and I don't remember which it is. It doesn't matter. It's a Schur complement. Okay? And you've probably seen it before or something in some, yeah, anyway. That's it. Okay. Okay.","zh":"我刚刚写下了一个方程，这是关于X2的另一个方程。这里的矩阵很有名，它被称为原始矩阵的Schur补。我不记得它是相对于1-1块还是2-2块，但它是这两个中的一个，我不记得具体是哪一个。没关系，它就是一个Schur补。明白吗？你可能在之前的学习中见过它，或者在某些地方听说过，总之就是这样。好的。好的。","start":2032.28,"end":2058.1},{"id":102,"text":"Okay, so you could use these calculations to solve the original thing. And that generic algorithm looks like this. It says first you should form A11 inverse A12. I mean, because that's this thing, right? And A11 inverse B1, right? Oh, by the way, let's talk about how we would do that. So the way you would do that is you'd factor A11, okay? To compute this, you would do a solve.","zh":"好的，你可以使用这些计算来求解原始问题。这个通用的算法看起来像这样。它说首先你应该计算A11的逆乘以A12。我的意思是，因为这就是这个东西，对吧？还有A11的逆乘以B1，对吧？顺便说一下，我们来谈谈如何进行这些计算。你进行这些计算的方法是先对A11进行分解，对吧？为了计算这个，你会进行一次求解。","start":2059.43,"end":2089.1},{"id":103,"text":"Right? Because you factored it, and now you do a solve. To calculate this, you do a solve on each column of A12. Everybody got that? So, this could be, that could end up being quite, that's quite efficient, right? So, the way, you know, this, if I were to double click on that and expand it, it would look like this. Factor A11, then solve with B1, and solve with each column of A12.","zh":"对吧？因为你已经分解了它，现在你进行求解。为了计算这个，你对A12的每一列进行求解。大家明白吗？所以，这可能会非常高效，对吧？也就是说，如果你双击这个并展开它，它看起来会像这样。分解A11，然后用B1进行求解，再对A12的每一列进行求解。","start":2089.8,"end":2118.37},{"id":104,"text":"That gives me these two matrices. Next step is I form S, that's the Schur complement, which is this thing.","zh":"这给了我这两个矩阵。下一步是形成S，也就是Schur补，即这个矩阵。","start":2119.05,"end":2126.59},{"id":105,"text":"and I form this b tilde thing over here, which is the right hand side of this equation, right? So this equation up here is s x2 equals b tilde, and then what I do is I'm going to, I find x, what here is I solve, I do a factor on s, then a back solve, and then I can reassemble, this gives me x2 directly, and I can get x1 from like this equation here. And by the way, when I solve this equation, I already factored a11, so this is a back, this is a solve.","zh":"并且我形成这个右边的b tilde，也就是这个方程的右边，对吧？所以这里的方程是s乘以x2等于b tilde，然后我所做的就是找到x，这里的步骤是，我进行分解，然后进行回代，然后我可以重新组合，这会直接给我x2，我可以通过这里的方程得到x1。顺便说一下，当我解这个方程时，我已经对A11进行了分解，所以这就是一个回代，这就是一个求解。","start":2128.09,"end":2157.21},{"id":106,"text":"Okay. Right. This is the, okay. So that's, that's the idea now. Okay. Now it's a drum roll to find out, is this faster? Is it better? And it's actually kind of interesting. So if in step one, you have F is going to be the factor cost for A11. S is the solve cost. So in the first case,","zh":"好的。对的。这就是，好的。这就是现在的想法。好的。现在要鼓掌来找出，这是否更快？是否更好？实际上这很有趣。所以在第一步，F将是A11的分解成本。S是求解成本。所以在第一种情况下，","start":2157.71,"end":2182.75},{"id":107,"text":"You factor A11 once, and then you solve for all the columns of A12. And so that's N2S. So that's the cost of step one. Step two, and...","zh":"你对A11进行一次分解，然后对A12的所有列进行求解。因此，这是N2S。这就是第一步的成本。第二步，和……","start":2183.32,"end":2195.46}],"notes":["本段讲解了块矩阵的Schur补及其在求解线性系统中的应用。Schur补是矩阵分解中的一个重要概念，用于简化大规模矩阵的求解过程。Schur补可以是相对于1-1块或2-2块的，具体取决于矩阵的结构，但无论哪种情况，它都具有重要的计算优势。","在计算过程中，首先需要对A11进行因式分解，然后利用该分解结果对A12的每一列进行求解。这种方法可以显著提高计算效率，因为因式分解只需要进行一次，而求解过程可以并行处理多个列。","接下来，通过构造Schur补矩阵S和右侧向量b_tilde，可以进一步求解x2。通过因式分解S并进行回代，可以直接得到x2的值，而x1则可以通过原始方程求得。这种方法在计算上具有较高的效率。","在计算成本方面，第一步的因式分解和求解过程的总成本为N2S，其中N是A12的列数，S是求解的代价。这种计算方式在处理大规模矩阵时具有显著的优势。","Schur补的应用不仅限于线性系统，还广泛用于优化问题和数值计算中。通过合理利用Schur补，可以有效减少计算复杂度，提高算法的效率。","在实际应用中，Schur补的构造和求解需要考虑矩阵的结构和条件，确保分解和求解过程的稳定性。此外，还需要注意因式分解和求解的顺序，以确保计算的正确性和效率。"],"formulas":[{"latex":"S = A_{22} - A_{21} A_{11}^{-1} A_{12}","symbols":"S是矩阵A的Schur补，由A_{22}减去A_{21}乘以A_{11}的逆再乘以A_{12}得到","explanation":"公式正确，Schur补的定义符合线性代数标准形式，无需修改。","evidence":"I just put, and that's another equation in X2. This matrix here is famous, and it's called the sure complement of the original matrix. I can't remember if it's with respect to the 1-1 or 2-2 block, but it's one of those two, and I don't remember which it is. It doesn't matter. It's a sure complement. Okay? And you've probably seen it before or something in some, yeah, anyway. That's it. Okay. Okay."},{"latex":"A_{11}^{-1} A_{12}","symbols":"A_{11}的逆乘以A_{12}，用于构造Schur补","explanation":"公式正确，表示A_{11}的逆与A_{12}的乘积，符合Schur补的计算步骤。","evidence":"Okay, so you could use these calculations to solve the original thing. And that generic algorithm looks like this. It says first you should form A11 inverse A12. I mean, because that's this thing, right? And A11 inverse B1, right? Oh, by the way, let's talk about how we would do that. So the way you would do that is you'd factor A11, okay? To compute this, you would do a solve."},{"latex":"A_{11}^{-1} B_1","symbols":"A_{11}的逆乘以B_1，用于求解过程","explanation":"公式正确，表示A_{11}的逆与B_1的乘积，符合求解步骤。","evidence":"Okay, so you could use these calculations to solve the original thing. And that generic algorithm looks like this. It says first you should form A11 inverse A12. I mean, because that's this thing, right? And A11 inverse B1, right? Oh, by the way, let's talk about how we would do that. So the way you would do that is you'd factor A11, okay? To compute this, you would do a solve."},{"latex":"s x_2 = \\tilde{b}","symbols":"Schur补矩阵s乘以x2等于右侧向量b_tilde","explanation":"公式正确，表示Schur补矩阵s与变量x2的乘积等于右侧向量b_tilde，符合线性方程组的结构。","evidence":"and I form this b tilde thing over here, which is the right hand side of this equation, right? So this equation up here is s x2 equals b tilde, and then what I do is I'm going to, I find x, what here is I solve, I do a factor on s, then a back solve, and then I can reassemble, this gives me x2 directly, and I can get x1 from like this equation here. And by the way, when I solve this equation, I already factored a11, so this is a back, this is a solve."}],"uncertainties":["Schur补是相对于1-1块还是2-2块"],"diagram":"none","start":2032.28,"end":2195.46,"asr_flags":[],"math_clarifications":["Schur补的定义和计算步骤在公式中正确呈现，无需进一步修改。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2032.28,"text":"I just put, and that's another equation in X2. This matrix here is famous, and it's called the sure complement of the original matrix. I can't remember if it's with respect to the 1-1 or 2-2 block, but it's one of those two, and I don't remember which it is. It doesn't matter. It's a sure complement. Okay? And you've probably seen it before or something in some, yeah, anyway. That's it. Okay. Okay."},{"start":2059.43,"text":"Okay, so you could use these calculations to solve the original thing. And that generic algorithm looks like this. It says first you should form A11 inverse A12. I mean, because that's this thing, right? And A11 inverse B1, right? Oh, by the way, let's talk about how we would do that. So the way you would do that is you'd factor A11, okay? To compute this, you would do a solve."},{"start":2089.8,"text":"Right? Because you factored it, and now you do a solve. To calculate this, you do a solve on each column of A12. Everybody got that? So, this could be, that could end up being quite, that's quite efficient, right? So, the way, you know, this, if I were to double click on that and expand it, it would look like this. Factor A11, then solve with B1, and solve with each column of A12."},{"start":2119.05,"text":"That gives me these two matrices. Next step is I form S, that's the sure complement, which is this thing."},{"start":2128.09,"text":"and I form this b tilde thing over here, which is the right hand side of this equation, right? So this equation up here is s x2 equals b tilde, and then what I do is I'm going to, I find x, what here is I solve, I do a factor on s, then a back solve, and then I can reassemble, this gives me x2 directly, and I can get x1 from like this equation here. And by the way, when I solve this equation, I already factored a11, so this is a back, this is a solve."},{"start":2157.71,"text":"Okay. Right. This is the, okay. So that's, that's the idea now. Okay. Now it's a drum roll to find out, is this faster? Is it better? And it's actually kind of interesting. So if in step one, you have F is going to be the factor cost for A11. S is the solve cost. So in the first case,"},{"start":2183.32,"text":"You factor A11 once, and then you solve for all the columns of A12. And so that's N2S. So that's the cost of step one. Step two, and..."}],"speech_gaps":[],"frame":"../frames/v013/013.webp","frame_time":2044.28},{"title":"Schur补矩阵与稀疏性","segments":[{"id":108,"text":"Here, that's actually just forming the Schur complement matrix. And what we're going to do is we're going to imagine that we're not going to exploit any structure in the Schur complement, although one could, but we're not going to. We're just going to treat it as dense. And then step three is going to be N2 cubed, because it's just to factor and solve it. And so the total is this number up here. It's F plus N2S plus blah, blah, blah. Okay. All right.","zh":"在这里，实际上只是形成了Schur补矩阵。我们将想象不利用Schur补矩阵中的任何结构，尽管可以这么做，但我们不会这么做。我们只是将其视为稠密矩阵。然后第三步将是N2的立方，因为它只是进行分解和求解。因此总的操作次数就是上面这个数字。它是F加上N2S加上其他项。好的。好了。","start":2196.66,"end":2224.46},{"id":109,"text":"So, let's just throw in a general A11 and see what happens. When you do, I mean, hardly surprising, but actually down to the flop, it's identical. And you've done, congratulations, you've done a bunch of algebra and analysis, and it did absolutely nothing. Okay? So, everybody... Oh, by the way, it does nothing in terms of flop count.","zh":"那么，我们随便代入一个一般的A11，看看会发生什么。当你这么做时，几乎不出所料，但事实上在浮点运算次数上是完全一样的。你已经完成了，恭喜你，你做了一堆代数和分析，但什么也没做。明白吗？所以，大家……顺便说一句，它在浮点运算次数上什么也没做。","start":2225.3,"end":2246.2},{"id":110,"text":"In reality, it does do things, right? So in fact, people use these block, this sort of block elimination method. They actually use these for dense matrices. And the reason is you would choose N1 and N2 so that one of these solve methods could be done at some level of cache, right? And therefore done quickly. So that actually happens. But again, all of us are blissfully unaware of those details. So, okay. Now it gets interesting.","zh":"实际上，它确实做了些事情，对吧？事实上，人们使用这种块消除方法，用于稠密矩阵。原因是你会选择N1和N2，使得其中一个求解方法可以在某个缓存级别上执行，从而快速完成。所以实际上就是这样。但再次强调，我们所有人都对这些细节一无所知。好的。现在事情变得有趣了。","start":2246.59,"end":2273.74},{"id":111,"text":"It's interesting precisely when f is small compared to n1 cubed. So I'm going to give you, here's a great example, is diagonal. So the factor cost for a diagonal is zero. I mean, whatever, or n if you want to, whatever, it doesn't matter. L is going to be the matrix itself, and u will be the identity there at zero.","zh":"当f比n1的立方小的时候，事情变得有趣。我将给你们一个很好的例子，就是对角矩阵。对角矩阵的分解成本为零。我意思是，不管怎样，或者说是n，无所谓，这并不重要。L将是矩阵本身，而u在零处将是单位矩阵。","start":2274.19,"end":2296.23},{"id":112,"text":"So here, it's actually really interesting. You get 2n2 squared n1, right, plus 2 thirds nq. What's amazing about that is that's linear in n1. So now I'm going to show you some equation. I'll show you some sparsity patterns. And here it is. Actually, I was just showing you one. I had one right there. Here's one. Remember this one? That's this downward arrow pattern. Someone suggest a blocking of it.","zh":"在这里，它实际上非常有趣。你会得到2n2平方乘以n1，对吧，加上三分之二nq。令人惊讶的是，这在n1上是线性的。现在我要给你们展示一些方程。我会展示一些稀疏模式。这里它就是。实际上，我刚刚给你们展示了一个。我刚才就在那里。这里还有一个。还记得这个吗？这是这个向下的箭头模式。有人建议对它进行分块。","start":2300.49,"end":2332.33},{"id":113,"text":"Like, what would be A11? Do you see a leading matrix here that is easy to invert? Diagonal? Yeah, yeah. So here's A11. It looks like this, right? Right? It just looks like that, right? So this is A11. Diagonal, you know, actually I was going to say matrices don't come easier to invert than diagonal. That's false. Here's one that's easier. It's a multiple of the identity.","zh":"比如，A11会是什么？你们能看到这里有一个容易求逆的主矩阵吗？对角矩阵？是的，是的。所以这里是A11。它看起来像这样，对吧？对吧？它看起来就是这样，对吧？所以这就是A11。对角矩阵，你知道的，其实我本来想说没有比对角矩阵更容易求逆的矩阵了。这是错误的。这里有一个更容易的。它是单位矩阵的倍数。","start":2333.12,"end":2359.22}],"notes":["本段讨论了Schur补矩阵的计算复杂度，指出当f远小于n1³时，计算复杂度会显著降低。这表明在处理稀疏矩阵时，通过适当的块划分可以显著减少计算量。","讲者提到，对于对角矩阵，其因子分解成本为零，这说明对角矩阵的计算效率极高，因为其结构简单，可以直接使用。","讲者还提到，当矩阵具有稀疏性时，可以通过块划分来优化计算过程，使得某些子问题可以在缓存中快速处理，从而提高整体效率。","在讨论稀疏模式时，讲者展示了向下的箭头模式，并建议如何进行块划分，以进一步优化计算过程。","讲者强调，块划分的选择会影响计算效率，因此需要根据具体问题选择合适的块大小，以充分利用缓存和计算资源。","最后，讲者指出，对角矩阵是最容易求逆的矩阵之一，因为其结构简单，可以直接使用单位矩阵进行求逆。"],"formulas":[{"latex":"2n_2^2 n_1 + \\frac{2}{3} n_q","symbols":"2n2²n1 + 2/3nq","explanation":"公式中的符号和数学类型正确，未发现明显的转写或整理错误。","evidence":"It's interesting precisely when f is small compared to n1 cubed. So I'm going to give you, here's a great example, is diagonal. So the factor cost for a diagonal is zero. I mean, whatever, or n if you want to, whatever, it doesn't matter. L is going to be the matrix itself, and u will be the identity there at zero."}],"uncertainties":["nq的具体含义未明确，可能指其他参数或变量。"],"diagram":"none","start":2196.66,"end":2359.22,"asr_flags":[],"math_clarifications":["无法核定的数学修复说明：无。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2196.66,"text":"Here, that's actually just forming the Schur complement matrix. And what we're going to do is we're going to imagine that we're not going to exploit any structure in the Schur complement, although one could, but we're not going to. We're just going to treat it as dense. And then step three is going to be N2 cubed, because it's just to factor and solve it. And so the total is this number up here. It's F plus N2S plus blah, blah, blah. Okay. All right."},{"start":2225.3,"text":"So, let's just throw in a general A11 and see what happens. When you do, I mean, hardly surprising, but actually down to the flop, it's identical. And you've done, congratulations, you've done a bunch of algebra and analysis, and it did absolutely nothing. Okay? So, everybody... Oh, by the way, it does nothing in terms of flop count."},{"start":2246.59,"text":"In reality, it does do things, right? So in fact, people use these block, this sort of block elimination method. They actually use these for dense matrices. And the reason is you would choose N1 and N2 so that one of these solve methods could be done at some level of cache, right? And therefore done quickly. So that actually happens. But again, all of us are blissfully unaware of those details. So, okay. Now it gets interesting."},{"start":2274.19,"text":"It's interesting precisely when f is small compared to n1 cubed. So I'm going to give you, here's a great example, is diagonal. So the factor cost for a diagonal is zero. I mean, whatever, or n if you want to, whatever, it doesn't matter. L is going to be the matrix itself, and u will be the identity there at zero."},{"start":2300.49,"text":"So here, it's actually really interesting. You get 2n2 squared n1, right, plus 2 thirds nq. What's amazing about that is that's linear in n1. So now I'm going to show you some equation. I'll show you some sparsity patterns. And here it is. Actually, I was just showing you one. I had one right there. Here's one. Remember this one? That's this downward arrow pattern. Someone suggest a blocking of it."},{"start":2333.12,"text":"Like, what would be A11? Do you see a leading matrix here that is easy to invert? Diagonal? Yeah, yeah. So here's A11. It looks like this, right? Right? It just looks like that, right? So this is A11. Diagonal, you know, actually I was going to say matrices don't come easier to invert than diagonal. That's false. Here's one that's easier. It's a multiple of the identity."}],"speech_gaps":[],"frame":"../frames/v013/014.webp","frame_time":2208.66},{"title":"稀疏性与块消元法","segments":[{"id":114,"text":"That's pretty straightforward. Actually, I think in terms of flops, it's the same anyway, so it doesn't even matter. But anyway, here it is. Okay, so here's one where instead of this, so n1 is, I don't know, let's suppose the original thing was n. It's n minus 1, and n2 is 1, because this thing is 1 by 1, right?","zh":"这很直接。实际上，从浮点运算次数来看，它本质上是一样的，所以根本没有什么差别。不过，这里它就是这样的。好的，这里有一个例子，其中n1不是这个数值，假设原来的数值是n，那么n1是n减1，而n2是1，因为这个部分是一个1乘1的矩阵，对吧？","start":2361.31,"end":2379.91},{"id":115,"text":"down here. Um, and so in this case, it turns out you're going to get a stunning, uh, reduction, right? Because you're going to be able to, you can invert this fast. And in that case, you would get exactly this number over here. You'd get, you know, two and two squared and one, right? So, okay. That's, that's one example, but I'll show you, I'll show you some others, right? Um, what it means is if you saw, yeah, what if you saw a, uh, a sparsity pattern that looked like this?","zh":"在这里。在这种情况下，你会发现你会得到一个惊人的减少，对吧？因为你能够快速地求逆这个部分。在这种情况下，你会得到这边的这个数值。你会得到，比如说，二和二的平方以及一，对吧？所以，这是一个例子，但我会展示给你一些其他的例子，对吧？嗯，这意味着如果你看到，是的，如果你看到一个看起来像这样的稀疏模式，会怎么样？","start":2380.39,"end":2409.44},{"id":116,"text":"right? This is banded, and then over here, these are like dense, this is called dense rows and columns. Everybody got that? So, actually, it's just a block arrow matrix, but with a thicker weight on the things, because they're wide, right? That's banded, and then this is a whole chunk of stuff over here, right? Everybody got that?","zh":"对吧？这个是带状的，而这边这些是密集的，这被称为密集行和列。大家明白了吗？实际上，它只是一个块箭头矩阵，但这些部分的权重更厚，因为它们更宽，对吧？这是带状的，而这边是一整块内容，对吧？大家明白了吗？","start":2410.57,"end":2435.15},{"id":117,"text":"So what this says is that this block elimination method here will solve that. Well, it's actually insane. It's actually going to be linear in the dimension. If this width, if this doesn't grow this way, and if the bandwidth doesn't change, this gets bigger and bigger and we can solve it, right? So anyway, it's pretty cool, right? So, and that means if you see that,","zh":"这说明这里的块消元法可以解决这个问题。实际上，这非常惊人。它实际上在维度上是线性的。如果这个宽度，如果它不以这种方式增长，而且带宽不变，这个会越来越大，但我们仍然可以解决它，对吧？所以不管怎样，这非常酷，对吧？因此，如果你看到这样的情况，","start":2435.84,"end":2463.06},{"id":118,"text":"You should smile. We'll put it that way. Or you're not going to see that, probably, because someone would already have to know. But the way it's really going to work is someone's going to be talking about a problem. It's going to be some weird, complicated problem. Who knows what... It doesn't matter. They're going to be talking about some complicated thing. While they're talking, you will be forming in your mind what the sparsity pattern of the associated matrices look like. When that image comes to mind, you will smile.","zh":"你应该露出笑容。我们会这样说。或者你可能不会看到这种情况，因为有人已经必须知道。但真正起作用的方式是，有人会谈论一个问题。这会是一个奇怪而复杂的问题。谁知道呢……这无关紧要。他们会谈论一些复杂的东西。在他们谈论的时候，你将在脑海中形成与这些矩阵相关的稀疏模式的图像。当这个图像出现在你脑海中时，你就会露出笑容。","start":2463.63,"end":2491.96},{"id":119,"text":"And you will say, I can solve that problem in half a second. And they said, I can't even load it into memory. And you'd say, just chill, and I'll show you what we're going to do, right? Everybody following this? So these are incredibly useful things, right? And, you know, we can think about what this is. This is basically a set of equations where banded means that equation, you know, 50.","zh":"你会说，我可以在半秒钟内解决这个问题。而他们会说，我甚至无法将其加载到内存中。你就会说，别紧张，我将向你们展示我们将怎么做，对吧？大家都能跟上吗？这些是非常有用的东西，对吧？你们可以想想这到底是什么。这基本上是一组方程，其中带状意味着方程，你知道的，50。","start":2492.62,"end":2522.11}],"notes":["本段主要讲解了稀疏性模式在矩阵中的表现及其对计算效率的影响。讲者提到，当矩阵具有带状结构时，可以通过块消元法快速求解，这比处理密集矩阵要高效得多。例如，当矩阵的带宽固定时，计算复杂度可以线性增长，而不是指数增长。","讲者进一步说明，当面对复杂问题时，理解矩阵的稀疏性模式非常重要。如果能够识别出矩阵的稀疏结构，就可以快速找到解决方法，甚至在内存不足的情况下也能处理。这种能力在实际应用中非常关键。","讲者通过举例说明，如果矩阵的稀疏性模式是带状的，那么可以利用块消元法进行求解。这种结构的矩阵在实际中很常见，例如在有限元分析或网络流问题中。","讲者强调，识别稀疏性模式的能力是解决复杂问题的关键。当听到问题描述时，应该在脑海中形成矩阵的稀疏性图像，从而快速判断如何求解。","讲者提到，带状矩阵的稀疏性模式可以显著减少计算量，使得问题可以在短时间内解决。这种能力在实际工程和科学计算中非常有用。","最后，讲者指出，带状矩阵的稀疏性模式可以被看作是一组方程，其中每个方程的非零元素集中在对角线附近，这种结构使得块消元法成为一种高效的求解方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2361.31,"end":2522.11,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2361.31,"text":"That's pretty straightforward. Actually, I think in terms of flops, it's the same anyway, so it doesn't even matter. But anyway, here it is. Okay, so here's one where instead of this, so n1 is, I don't know, let's suppose the original thing was n. It's n minus 1, and n2 is 1, because this thing is 1 by 1, right?"},{"start":2380.39,"text":"down here. Um, and so in this case, it turns out you're going to get a stunning, uh, reduction, right? Because you're going to be able to, you can invert this fast. And in that case, you would get exactly this number over here. You'd get, you know, two and two squared and one, right? So, okay. That's, that's one example, but I'll show you, I'll show you some others, right? Um, what it means is if you saw, yeah, what if you saw a, uh, a sparsity pattern that looked like this?"},{"start":2410.57,"text":"right? This is banded, and then over here, these are like dense, this is called dense rows and columns. Everybody got that? So, actually, it's just a block arrow matrix, but with a thicker weight on the things, because they're wide, right? That's banded, and then this is a whole chunk of stuff over here, right? Everybody got that?"},{"start":2435.84,"text":"So what this says is that this block elimination method here will solve that. Well, it's actually insane. It's actually going to be linear in the dimension. If this width, if this doesn't grow this way, and if the bandwidth doesn't change, this gets bigger and bigger and we can solve it, right? So anyway, it's pretty cool, right? So, and that means if you see that,"},{"start":2463.63,"text":"You should smile. We'll put it that way. Or you're not going to see that, probably, because someone would already have to know. But the way it's really going to work is someone's going to be talking about a problem. It's going to be some weird, complicated problem. Who knows what... It doesn't matter. They're going to be talking about some complicated thing. While they're talking, you will be forming in your mind what the sparsity pattern of the associated matrices look like. When that image comes to mind, you will smile."},{"start":2492.62,"text":"And you will say, I can solve that problem in half a second. And they said, I can't even load it into memory. And you'd say, just chill, and I'll show you what we're going to do, right? Everybody following this? So these are incredibly useful things, right? And, you know, we can think about what this is. This is basically a set of equations where banded means that equation, you know, 50."}],"speech_gaps":[],"frame":"../frames/v013/015.webp","frame_time":2373.31},{"title":"矩阵更新与低秩扰动","segments":[{"id":120,"text":"only references, let's say, variables 40 to 60. And that would be here. Then you say, but there's some special variables here which affect everybody. So that's what this is. So you're going to want to be making those... To be fully developed, I would say here's what you want. You want to be able to get a feel for when applications involve matrices that look like that.","zh":"只参考一些变量，比如说变量40到60。然后你会在这里看到。接着你说，但这里有一些特殊的变量，影响所有人。这就是这个意思。所以你想要做的是，要充分发展这些……我认为在这里应该这样：你想要能够感受到，当应用涉及看起来像这样的矩阵时，你会有什么样的感觉。","start":2522.73,"end":2552.07},{"id":121,"text":"then you're going to be happy because you're going to know something other people in the room don't because you're going to know that you can solve that in linear time. Right. So that's why people say like, well, I have to find this whole trajectory. It's like, it's, it's, you know, it's a hundred thousand time points, you know, and you're like, so, but I mean, do you have a phone or whatever? It's just not going to be that complicated. Right. Again, if you know what you're doing. Okay. So, okay. Um, okay. So now","zh":"然后你会很高兴，因为你知道其他在房间里的人不知道的事情，因为你将知道你可以在线性时间内解决这个问题。对吧。这就是为什么人们会说，比如，我必须找到整个轨迹。这就像，这就像，你知道的，这是一万个时间点，你知道的，然后你会说，但是，我的意思是，你有手机吗？这不会那么复杂。对吧。再次强调，如果你知道你在做什么。好的。嗯，好的。嗯，好的。现在","start":2553.45,"end":2579.83},{"id":122,"text":"This leads us to, and this probably people have seen. It's got lots of names. It depends on where you're from. I think it's called like Sherman, Morrison, Woodbury. Sometimes it's called the Woodbury thing. Sometimes it's called the matrix inversion lemma. And I have a friend who can actually tell where someone learned their linear algebra.","zh":"这引导我们到，而且人们可能已经见过。它有很多名字。这取决于你来自哪里。我认为它被称为Sherman、Morrison、Woodbury。有时它被称为Woodbury方法。有时它被称为矩阵求逆引理。我有一个朋友，他实际上能通过别人学习线性代数的地方来判断。","start":2581.26,"end":2603.3},{"id":123,"text":"Because they use different terms. They even use different terms, I believe, at Oxford and Cambridge, just so you know. So this is like someone can, just by asking someone what they call this and a couple of other questions, you can figure out that they got their PhD at Oxford or Cambridge or something or Harvard or whatever, or MIT or something.","zh":"因为他们使用不同的术语。我相信在牛津大学和剑桥大学甚至使用不同的术语，所以你得知道这一点。所以，通过问某人他们怎么称呼这个，以及几个其他问题，你就能判断出他们是在牛津大学、剑桥大学，或者哈佛大学，或者其他像麻省理工学院这样的地方获得的博士学位。","start":2603.9,"end":2627.62},{"id":124,"text":"In fact, some people call this a low-rank perturbation of A. I mean, that's not fair because no one said that B and C are small. But if B had small columns, if B had just a handful of columns and C had a handful of rows, this would indeed be what people would call low-rank update to A. So we want to solve a matrix that looks like that. In fact, an extreme case would be things like,","zh":"事实上，有些人称这个为矩阵A的低秩扰动。我的意思是，这不公平，因为没有人说过B和C是小的。但如果B的列很小，如果B只有少数几列，而C只有少数几行，那么这确实会被人们称为对A的低秩更新。因此，我们想要解决看起来像这样的矩阵。事实上，一个极端情况是像这样的东西：","start":2629.69,"end":2657.97},{"id":125,"text":"Here's one you hear all the time. Diagonal plus low rank. There, A is diagonal, and B and C are small. So B has got a small number of columns, C has got a small number of rows. That's super common. That's also something you will, I would hope, never ever forget. Diagonal plus low rank. And it's all related. Here's how it's related.","zh":"这里有一个你经常听到的说法。对角线加上低秩。在那里，A是对角线矩阵，B和C都是小矩阵。所以B的列数很少，C的行数也很少。这非常常见。这也是你希望永远都不会忘记的一个概念。对角线加上低秩。它们之间是有关联的。这里是它们之间的关联方式。","start":2658.35,"end":2682.19}],"notes":["本段主要讲解了矩阵更新和低秩扰动的概念，特别是矩阵的低秩更新在实际应用中的重要性。讲者提到，当矩阵A被低秩矩阵BC的扰动所改变时，这种结构可以被用来高效地求解线性系统。这种结构被称为低秩扰动，但需要注意的是，B和C的大小并不一定小，只有当它们的列数和行数较少时，才被称为低秩更新。","讲者还提到，低秩扰动在实际应用中非常常见，例如矩阵A是对角矩阵，而B和C是小矩阵的情况，这种结构被称为对角加低秩。这种结构在许多领域都有应用，例如信号处理和机器学习。","讲者强调了对角加低秩结构的重要性，并指出这种结构在实际应用中非常常见，应该被记住。这种结构与矩阵的低秩更新密切相关，可以用于高效地求解线性系统。","讲者还提到，不同大学对矩阵更新的术语有不同的称呼，例如Sherman-Morrison-Woodbury公式、矩阵求逆引理等。这些术语的差异反映了不同学术背景下的术语习惯。","讲者通过举例说明了低秩扰动的应用场景，例如当矩阵A被低秩矩阵BC的扰动所改变时，这种结构可以被用来高效地求解线性系统。这种结构在实际应用中非常常见，例如在信号处理和机器学习中。","讲者还提到，低秩扰动的结构可以被用来高效地求解线性系统，这在实际应用中非常重要。这种结构的高效性来自于其低秩特性，使得求解过程可以被优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2522.73,"end":2682.19,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2522.73,"text":"only references, let's say, variables 40 to 60. And that would be here. Then you say, but there's some special variables here which affect everybody. So that's what this is. So you're going to want to be making those... To be fully developed, I would say here's what you want. You want to be able to get a feel for when applications involve matrices that look like that."},{"start":2553.45,"text":"then you're going to be happy because you're going to know something other people in the room don't because you're going to know that you can solve that in linear time. Right. So that's why people say like, well, I have to find this whole trajectory. It's like, it's, it's, you know, it's a hundred thousand time points, you know, and you're like, so, but I mean, do you have a phone or whatever? It's just not going to be that complicated. Right. Again, if you know what you're doing. Okay. So, okay. Um, okay. So now"},{"start":2581.26,"text":"This leads us to, and this probably people have seen. It's got lots of names. It depends on where you're from. I think it's called like Sherman, Morrison, Woodbury. Sometimes it's called the Woodbury thing. Sometimes it's called the matrix inversion lemma. And I have a friend who can actually tell where someone learned their linear algebra."},{"start":2603.9,"text":"Because they use different terms. They even use different terms, I believe, at Oxford and Cambridge, just so you know. So this is like someone can, just by asking someone what they call this and a couple of other questions, you can figure out that they got their PhD at Oxford or Cambridge or something or Harvard or whatever, or MIT or something. Okay, so here it is. You start with A plus BC times X equals B."},{"start":2629.69,"text":"In fact, some people call this a low-rank perturbation of A. I mean, that's not fair because no one said that B and C are small. But if B had small columns, if B had just a handful of columns and C had a handful of rows, this would indeed be what people would call low-rank update to A. So we want to solve a matrix that looks like that. In fact, an extreme case would be things like,"},{"start":2658.35,"text":"Here's one you hear all the time. Diagonal plus low rank. There, A is diagonal, and B and C are small. So B has got a small number of columns, C has got a small number of rows. That's super common. That's also something you will, I would hope, never ever forget. Diagonal plus low rank. And it's all related. Here's how it's related."}],"speech_gaps":[],"frame":"../frames/v013/016.webp","frame_time":2534.73},{"title":"因子模型与协方差矩阵的稀疏性","segments":[{"id":126,"text":"Yeah, actually, let's just talk about this in the case where A was diagonal and B and C have modest number of columns, right? So in fact, let's make, in fact, here's one. So basically, all of quantitative finance uses a risk model where the covariance matrix is diagonal plus low rank. And it's called a factor model, right? So there, C is B transpose.","zh":"是的，实际上，让我们在A是对角矩阵，而B和C的列数相对较少的情况下讨论这个问题，对吧？事实上，让我们举一个例子。基本上，所有量化金融都使用一种风险模型，其中协方差矩阵是主对角线加上低秩矩阵。这种模型被称为因子模型，对吧？在这种情况下，C等于B的转置。","start":2684.68,"end":2708.28},{"id":127,"text":"And if this were like a Gaussian or something, if this is the covariance of a Gaussian, if you understand what I'm saying, that's fine. If you don't, that's also cool. But this is just completely universal, right? What it would mean is it's even got a Bayesian model, and it basically says that the returns of all these assets is driven by, let's say, B and C. Typically, B is about a width of 100. That would be very typical.","zh":"如果这是高斯分布的协方差，如果你明白我的意思，那没问题。如果你不明白，也没关系。但这一点是完全通用的，对吧？这意味着它甚至还有一个贝叶斯模型，基本上说明所有这些资产的回报是由B和C驱动的。通常，B的宽度大约是100。这非常典型。","start":2709.71,"end":2735.19},{"id":128,"text":"C would have a high, well, C is B transpose, right? So you'd say, look, I don't know what these 8,000 returns are doing, but they're mostly driven by...","zh":"C的列数会很高，因为C等于B的转置，对吧？所以你会说，我不知道这些8000个回报值在做什么，但它们主要由……","start":2736.41,"end":2748.43},{"id":129,"text":"These hundred factors, right? Which are actually... So that's the underlying... That's what's actually driving the returns. And then the A is diagonal, and they have a beautiful name for it. It's called idiosyncratic. So that's the idiosyncratic risk. It's the amount by which, you know, Google or, you know, whatever, Coca-Cola or whatever it is, Chevron, goes up and down. It's the part... In fact, the way they would say it, this is dialect, is you'd say...","zh":"这100个因子驱动，对吧？这些因子实际上是……这就是底层……这就是真正驱动回报的部分。然后A是对角矩阵，它们有一个很美的名称，叫做特异性。这就是特异性风险。这是指像谷歌或者可口可乐或者雪佛龙这样的公司股价上下波动的部分。这是……事实上，他们所说的，用方言来说，你会说……","start":2748.85,"end":2775.31},{"id":130,"text":"That is the part of the variance not explained by the factors. Everyone got that? So that's it. And the factors are actually kind of interesting. Sorry, this is just a weird aside, but since we're here, I'll just continue. The factors are interesting. Some are handcrafted. So they're literally matrices with zeros and ones and weird stuff like that. What region are you in?","zh":"这就是未被因子解释的方差部分。大家明白了吗？这就是它。而这些因子实际上很有趣。抱歉，这只是一个奇怪的插曲，但既然我们在这里，我将继续。这些因子很有趣。有些是人工设计的。它们实际上是包含零和一以及一些奇怪内容的矩阵。你所在的地区是哪里？","start":2775.69,"end":2798.61},{"id":131,"text":"Are you a pharmaceuticals company? Do you do defense? Do you do that kind of thing? Others are actually crafted by people using numerical algorithms. So, okay. That was just a small story about this. Okay.","zh":"你是制药公司吗？你是做国防的吗？你是做那种事情的吗？其他的一些因子实际上是人们使用数值算法设计出来的。好的。这只是关于这个的小故事。好的。","start":2799.01,"end":2813.13},{"id":132,"text":"Oh, if I have a if I have something that looks like that A is diagonal and B and C are small, I can store that like no problem. Right. That's that's even for very big. Like if I do, I want to you want to run a fund that is looking at a universe. I'm using dialect of, let's say, 100000 assets right across the whole world.","zh":"哦，如果我有一个看起来像这样的矩阵，A是对角矩阵，而B和C都很小，我就可以轻松地存储它。对的。即使对于非常大的情况也是如此。比如，我想运行一个基金，研究整个世界的资产组合。假设我使用的是100000种资产的方言，横跨整个世界。","start":2814.56,"end":2833.86},{"id":133,"text":"I know people who do that. So you do that. So the covariance matrix is 100,000 by 100,000 matrix. For something like that, you might, someone say, well, Heidi, what's your risk model? And they would say, oh, I have a 200 factor model. And that means their covariance matrix is expressed as a diagonal matrix, right? Which is whatever it is, 100,000 by 100,000.","zh":"我知道有这样做的人士。所以你们也会这样做。那么协方差矩阵就是一个100,000乘100,000的矩阵。对于这种情况，有人可能会问：海迪，你的风险模型是什么？他们可能会回答：哦，我有一个200因子模型。这意味着他们的协方差矩阵被表示为一个对角矩阵，对吧？不管怎样，它就是一个100,000乘100,000的矩阵。","start":2834.34,"end":2858.66}],"notes":["本段讲解了因子模型在量化金融中的应用，其中协方差矩阵被表示为对角矩阵加上低秩矩阵。这种模型被称为因子模型，其中C是B的转置。这种结构允许在处理大规模资产时减少存储和计算的复杂性。","因子模型中的A矩阵是对角矩阵，代表资产的特有风险（idiosyncratic risk），即无法通过因子解释的资产特定波动。B和C矩阵代表因子，这些因子通常数量较少，但能解释大部分资产的波动。","因子可以是人工构建的，例如与行业或地区相关的矩阵，也可以是通过数值算法生成的。这种模型在处理大规模资产时非常有用，因为其稀疏性大大降低了计算和存储需求。","在实际应用中，协方差矩阵可能非常大，例如100,000×100,000的矩阵，但通过因子模型，可以将其表示为对角矩阵加上低秩部分，从而简化计算。","因子模型的结构使得风险模型的构建更加高效，特别是在处理全球范围内的资产时，这种模型能够有效捕捉资产之间的相关性。","因子模型的使用不仅限于金融领域，也可以应用于其他需要处理高维数据和稀疏结构的领域。"],"formulas":[],"uncertainties":["在段落132中，'I'm using dialect of, let's say, 100000 assets' 中的 'dialect' 可能是误听，实际应为 'model' 或 'framework'，但无法确定具体含义。"],"diagram":"none","start":2684.68,"end":2858.66,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":2684.68,"text":"Yeah, actually, let's just talk about this in the case where A was diagonal and B and C have modest number of columns, right? So in fact, let's make, in fact, here's one. So basically, all of quantitative finance uses a risk model where the covariance matrix is diagonal plus low rank. And it's called a factor model, right? So there, C is B transpose."},{"start":2709.71,"text":"And if this were like a Gaussian or something, if this is the covariance of a Gaussian, if you understand what I'm saying, that's fine. If you don't, that's also cool. But this is just completely universal, right? What it would mean is it's even got a Bayesian model, and it basically says that the returns of all these assets is driven by, let's say, B and C. Typically, B is about a width of 100. That would be very typical."},{"start":2736.41,"text":"C would have a high, well, C is B transpose, right? So you'd say, look, I don't know what these 8,000 returns are doing, but they're mostly driven by..."},{"start":2748.85,"text":"These hundred factors, right? Which are actually... So that's the underlying... That's what's actually driving the returns. And then the A is diagonal, and they have a beautiful name for it. It's called idiosyncratic. So that's the idiosyncratic risk. It's the amount by which, you know, Google or, you know, whatever, Coca-Cola or whatever it is, Chevron, goes up and down. It's the part... In fact, the way they would say it, this is dialect, is you'd say..."},{"start":2775.69,"text":"That is the part of the variance not explained by the factors. Everyone got that? So that's it. And the factors are actually kind of interesting. Sorry, this is just a weird aside, but since we're here, I'll just continue. The factors are interesting. Some are handcrafted. So they're literally matrices with zeros and ones and weird stuff like that. What region are you in?"},{"start":2799.01,"text":"Are you a pharmaceuticals company? Do you do defense? Do you do that kind of thing? Others are actually crafted by people using numerical algorithms. So, okay. That was just a small story about this. Okay."},{"start":2814.56,"text":"Oh, if I have a if I have something that looks like that A is diagonal and B and C are small, I can store that like no problem. Right. That's that's even for very big. Like if I do, I want to you want to run a fund that is looking at a universe. I'm using dialect of, let's say, 100000 assets right across the whole world."},{"start":2834.34,"text":"I know people who do that. So you do that. So the covariance matrix is 100,000 by 100,000 matrix. For something like that, you might, someone say, well, Heidi, what's your risk model? And they would say, oh, I have a 200 factor model. And that means their covariance matrix is expressed as a diagonal matrix, right? Which is whatever it is, 100,000 by 100,000."}],"speech_gaps":[],"frame":"../frames/v013/017.webp","frame_time":2696.68},{"title":"反消除与块消除","segments":[{"id":134,"text":"And then they have 200 factors. And all of that is completely storable and stuff like that. And you'll see, in fact, not only can you store, you can actually solve problems super fast and things like that. Okay. That was all a weird aside. So let's keep going. So now what you do here is something that is actually a little bit unintuitive. It's called you un-eliminate. We did this before in duality. And it turned out well there.","zh":"然后它们有200个因子。所有这些都可以完全存储，诸如此类。你会看到，实际上你不仅可以存储，还可以以非常快的速度解决问题，诸如此类。好的。那都是一个奇怪的插曲。那么继续，现在你在这里要做的事情是，实际上有点反直觉的。它被称为反消除。我们在对偶性中做过这个，而且当时效果很好。","start":2859.62,"end":2885.42},{"id":135,"text":"What you do to uneliminate means to introduce new variables, right? Right. To eliminate variables means to, you know, solve for them, get rid of them, and then substitute back their values into the rest. That's elimination, right? That sounds good, especially to an amateur or somebody first seeing this material because, you know, someone, what are you doing? So I'm eliminating some very, why? Because I like to solve smaller sets of equations. Everybody, I mean, everyone like that's, it makes perfect sense, right?","zh":"反消除意味着引入新变量，对吧？对的。消除变量意味着解出它们，把它们去掉，然后将它们的值代入其余部分。这就是消除，对吧？这听起来很好，尤其是对初学者或第一次看到这个材料的人来说，因为，你知道，有人会问：你在做什么？为什么消除一些变量？因为我想解更小的方程组。每个人，我意思是，每个人都觉得这很合理，对吧？","start":2885.88,"end":2912.84},{"id":136,"text":"And they would say, like, why? Anyway, and the answer is, you'll see why in a minute, right? So we write this this way. We just introduce a new variable, which is y, which is cx, right? So, and I write that second equation as this bottom row, which is cx minus y equals zero, right? So the second system of equations is bigger, and it is completely equivalent to the first one, right?","zh":"他们会问，为什么？不管怎样，答案是，你马上就会明白，对吧？所以我们这样写。我们只是引入了一个新变量，即y，它等于c乘以x，对吧？然后我把第二个方程写成这一行，即cx减去y等于零，对吧？第二个方程组更大，但它与第一个方程组完全等价，对吧？","start":2913.53,"end":2942.14},{"id":137,"text":"And they would say, like, why? Anyway, and the answer is, you'll see why in a minute, right? So we write this this way. We just introduce a new variable, which is y, which is cx, right? So, and I write that second equation as this bottom row, which is cx minus y equals zero, right? So the second system of equations is bigger, and it is completely equivalent to the first one, right? Okay, now let's talk about this.","zh":"他们会问，为什么？不管怎样，答案是，你马上就会明白，对吧？所以我们这样写。我们只是引入了一个新变量，即y，它等于c乘以x，对吧？然后我把第二个方程写成这一行，即cx减去y等于零，对吧？第二个方程组更大，但它与第一个方程组完全等价，对吧？好的，现在让我们谈谈这个。","start":2942.66,"end":2971.76},{"id":138,"text":"When you see a matrix like that, you just encountered all this so far just a few minutes ago, so I don't expect you to have this response now. But hopefully within a week or two, you should have the following response. You will see a block there, a minus i, and your i will go to it because it's really easily inverted.","zh":"当你看到这样的矩阵时，你刚才才几分钟前才遇到这些内容，所以我不期望你现在有这种反应。但希望在一周或两周内，你会有以下反应。你会看到一个块，一个减去i，而你的i会去那里，因为它很容易被求逆。","start":2973.3,"end":2994.44},{"id":139,"text":"and you're going to see a block, and you're going to say, well, you're going to have an urge to do block elimination on this, right? And so what you would do is you'd say, oh, you know, I know what I'm going to do. I'm going to permute the i, the minus i, up to the top, and then I'm going to use block elimination from the previous stuff, right? Everybody got that? And then you eliminate it, and you'll end up then forming the Schroeder complement equations, and it will be a plus bcx equals b. So you'll be right back where you started.","zh":"你会看到一个块，然后你会想，嗯，你有冲动想要对这个块进行块消除，对吧？那么你将会说，哦，我知道我要怎么做。我要把i、-i一直到顶部进行置换，然后我会使用之前的内容进行块消除，对吧？大家明白了吗？然后你进行消除，最终会形成Schroeder补集方程，形式为加上bcx等于b。于是你又回到了起点。","start":2995.16,"end":3023.54}],"notes":["本段讲解了反消除（unelimination）的概念，即通过引入新变量和方程来扩大原问题的规模。这与消除（elimination）相反，消除是通过解方程并代入值来简化问题，而反消除则是通过增加变量和方程来构建更大的系统，但保持等价性。","反消除的目的是为了后续进行块消除（block elimination），这在处理矩阵结构时非常有用。通过将某些块移动到顶部，可以利用之前学到的消除技巧，从而简化问题。","在反消除过程中，引入的新变量和方程使得系统变得更复杂，但这种复杂性有助于后续的块消除操作，最终可以回到原始问题，从而验证反消除的正确性。","块消除是一种处理矩阵块结构的方法，通过重新排列和消除某些块，可以简化整个系统的求解过程。这种技术在处理大规模系统时尤为重要。","反消除和块消除是凸优化中处理复杂系统的重要工具，它们允许在保持等价性的前提下，通过引入新变量和方程来简化问题的结构。","在实际应用中，反消除和块消除的结合可以有效处理大规模的线性系统，使得原本难以直接求解的问题变得可行。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2859.62,"end":3023.54,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2859.62,"text":"And then they have 200 factors. And all of that is completely storable and stuff like that. And you'll see, in fact, not only can you store, you can actually solve problems super fast and things like that. Okay. That was all a weird aside. So let's keep going. So now what you do here is something that is actually a little bit unintuitive. It's called you un-eliminate. We did this before in duality. And it turned out well there."},{"start":2885.88,"text":"What you do to uneliminate means to introduce new variables, right? Right. To eliminate variables means to, you know, solve for them, get rid of them, and then substitute back their values into the rest. That's elimination, right? That sounds good, especially to an amateur or somebody first seeing this material because, you know, someone, what are you doing? So I'm eliminating some very, why? Because I like to solve smaller sets of equations. Everybody, I mean, everyone like that's, it makes perfect sense, right?"},{"start":2913.53,"text":"It's completely and totally wrong. That's not how you should be doing linear algebra, but it does sound good and people can fall for that, right? Okay, unelimination is the opposite. You say, thank you for your set of equations. If you don't mind, I'm going to introduce new variables and equations and make it a bigger one. And someone's like, why would you do that? Everyone see what I'm saying? You'd say, thank you for your, you know, thousand by thousand set of equations. If you don't mind, I'm going to expand it to a 10,000 by 10,000 set of equations, if it's okay with you, right?"},{"start":2942.66,"text":"And they would say, like, why? Anyway, and the answer is, you'll see why in a minute, right? So we write this this way. We just introduce a new variable, which is y, which is cx, right? So, and I write that second equation as this bottom row, which is cx minus y equals zero, right? So the second system of equations is bigger, and it is completely equivalent to the first one, right? Okay, now let's talk about this."},{"start":2973.3,"text":"When you see a matrix like that, you just encountered all this so far just a few minutes ago, so I don't expect you to have this response now. But hopefully within a week or two, you should have the following response. You will see a block there, a minus i, and your i will go to it because it's really easily inverted."},{"start":2995.16,"text":"and you're going to see a block, and you're going to say, well, you're going to have an urge to do block elimination on this, right? And so what you would do is you'd say, oh, you know, I know what I'm going to do. I'm going to permute the i, the minus i, up to the top, and then I'm going to use block elimination from the previous stuff, right? Everybody got that? And then you eliminate it, and you'll end up then forming the Schroeder complement equations, and it will be a plus bcx equals b. So you'll be right back where you started."}],"speech_gaps":[],"frame":"../frames/v013/018.webp","frame_time":2871.62},{"title":"矩阵求逆技巧与矩阵求逆引理","segments":[{"id":140,"text":"Okay, so here's what you do instead. You resist the urge here to eliminate the minus i, even though it is a very attractive target for elimination because it's easily inverted, right? You resist that urge, and instead you eliminate a. And you will end up with a sure complement equation that looks like this. Okay.","zh":"好的，那么你该怎么做呢。你在这里要抵制住消除负i的冲动，尽管它是一个非常吸引人的消除目标，因为它很容易求逆，对吧？你要抵制这种冲动，转而消除a。你最终会得到一个确定的互补方程，看起来像这样。好的。","start":3024.39,"end":3047.46},{"id":141,"text":"And this allows you to get y. Here you solve for y. Then from that, you plug it back in and get x. And you end up with a formula that's called the matrix inversion lemma. That's the neutral version. It says that a plus bc inverse is this horrible formula over here. Yeah, so that's it. This gets interesting if a is diagonal or something like that. Anyway, a lot of things would come out of that.","zh":"这让你能够求得y。在这里，你解出y。然后将它代入，得到x。你最终得到的公式被称为矩阵求逆引理。这是中性版本。它表示a加上bc的逆等于这个可怕的公式。是的，就是这样。如果a是对角矩阵或者类似的情况，这会变得有趣起来。不管怎样，很多东西都会由此而来。","start":3048.72,"end":3076.48},{"id":142,"text":"How many people have seen like matrix inversion lemma or something before, or, or some Sherman-Morrison and Woodbury? It's the same. Okay. Uh, any other names for it? I, uh, I used to know at least one or two others, but anyway, anybody else know another name for that? It's a thing in linear algebra and how you call it depends on where you came from. So, okay. Okay. So I think actually I'll, uh, oh yeah, well, here's an example like a diagonal and B and C are dense.","zh":"有多少人以前见过矩阵求逆引理或者类似的东西，或者一些Sherman-Morrison和Woodbury公式？其实是一样的。好的。还有其他的名字吗？我，呃，我以前至少知道一两个其他的，但不管怎样，还有其他人知道这个的其他名字吗？这是线性代数中的一个概念，你叫它什么取决于你从哪里学来的。所以，好的。好的。我想其实我打算，呃，哦对了，这里有一个例子，比如a是对角矩阵，而B和C是密集的。","start":3077.24,"end":3108.49},{"id":143,"text":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?","zh":"这基本上就是你形成D等于A加上BC。这是如果你用笨办法做的，对吧？你只是把它写成一个密集矩阵并求解。在这种情况下，你会得到一个复杂度为PN平方，抱歉，是N立方的结果。而如果你用正确的方法，你会得到一个与N线性相关的复杂度，对吧？这些差别非常大，对吧？","start":3110.22,"end":3134.76},{"id":144,"text":"By the way, a lot of this stuff subsumes things that were taught in the 60s, 70s, and 80s. And sometimes in the 90s by people who learned it from people who learned it in the 60s and 70s. So, for example, if you teach a course on control, you might... I've done this. I haven't done it for a long time. I won't do it again.","zh":"顺便说一句，很多这些内容都涵盖了60年代、70年代和80年代教过的内容，有时甚至在90年代，由那些从60年代和70年代学过的人那里学来的。例如，如果你上一门控制课程，你可能会……我做过这个。我已经很久没做了，我不会再重复了。","start":3137.41,"end":3156.95},{"id":145,"text":"But you go through a long derivation of what, like, the Kalman filter is, or how to solve an optimal control problem, right? And it's very clever, and you have little parts in this Bellman equation, and blah, blah, blah, and you get a... And yeah, you end up with stuff that actually works. It's great. A very funny thing happens. If you simply take the problem represented by an optimal control problem or a Kalman filter and just throw it at a sparse solver, guess what?","zh":"但是你可能会经历一个漫长的推导过程，比如卡尔曼滤波器是什么，或者如何解决一个最优控制问题，对吧？而且这些方法非常巧妙，你在贝尔曼方程中有一些小的部分， blah, blah, blah，然后你得到一些……嗯，你最终得到的东西其实能正常工作。这很棒。发生了一件非常有趣的事情。如果你只是把一个由最优控制问题或卡尔曼滤波器所表示的问题直接交给一个稀疏求解器，猜猜会怎么样？","start":3157.4,"end":3182.92}],"notes":["本段讲解了矩阵求逆引理（Matrix Inversion Lemma）的使用方法，强调了在处理矩阵求逆问题时，应避免直接消除某些项，而是通过消除其他变量来得到更简洁的表达式。引理的核心思想是通过引入中间变量，将复杂的矩阵求逆问题转化为更易处理的形式。","矩阵求逆引理在实际应用中非常重要，尤其是在处理大规模矩阵时，它能够显著减少计算复杂度。例如，当矩阵A是稀疏的，而B和C是密集的时，直接计算A + BC的逆矩阵会非常耗时，而通过引理可以将计算复杂度从O(N³)降低到O(N)。","引理的名称在不同文献中可能有所不同，如Sherman-Morrison-Woodbury公式，但它们本质上是同一个数学关系。这种差异反映了线性代数中术语的多样性，取决于不同的学术背景和来源。","本段还提到，许多现代的优化方法和控制理论中的技术，如卡尔曼滤波和贝尔曼方程，实际上可以追溯到20世纪60年代至80年代的数学发展。这些方法在现代计算中仍然具有重要价值，但有时需要借助更高效的算法来实现。","最后，课程指出，将传统的控制理论问题（如卡尔曼滤波）直接输入稀疏求解器可能会产生意想不到的结果，这说明了在实际应用中需要对算法进行适当的调整和优化。","整体而言，本段强调了矩阵求逆引理在优化和控制理论中的重要性，并通过具体例子说明了其在实际计算中的优势。"],"formulas":[{"latex":"A + BC","symbols":"矩阵A加上矩阵B和矩阵C的乘积","explanation":"公式正确，表示矩阵A与矩阵B和矩阵C的乘积之和。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"latex":"D = A + BC","symbols":"矩阵D等于矩阵A加上矩阵B和矩阵C的乘积","explanation":"公式正确，表示矩阵D等于矩阵A与矩阵B和矩阵C的乘积之和。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"latex":"O(N^3)","symbols":"计算复杂度为O(N³)","explanation":"公式正确，表示计算复杂度为O(N³)。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"latex":"O(N)","symbols":"计算复杂度为O(N)","explanation":"公式正确，表示计算复杂度为O(N)。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"}],"uncertainties":["PN squared"],"diagram":"none","start":3024.39,"end":3182.92,"asr_flags":[],"math_clarifications":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3024.39,"text":"Okay, so here's what you do instead. You resist the urge here to eliminate the minus i, even though it is a very attractive target for elimination because it's easily inverted, right? You resist that urge, and instead you eliminate a. And you will end up with a sure complement equation that looks like this. Okay."},{"start":3048.72,"text":"And this allows you to get y. Here you solve for y. Then from that, you plug it back in and get x. And you end up with a formula that's called the matrix inversion limit. That's the neutral version. It says that a plus bc inverse is this horrible formula over here. Yeah, so that's it. This gets interesting if a is diagonal or something like that. Anyway, a lot of things would come out of that."},{"start":3077.24,"text":"How many people have seen like matrix inversion lemma or something before, or, or some Sherman Morris and Woodbury? It's the same. Okay. Uh, any other names for it? I, uh, I used to know at least one or two others, but anyway, anybody else know another name for that? It's a thing in linear algebra and how you call it depends on where you came from. So, okay. Okay. So I think actually I'll, uh, oh yeah, well, here's an example like a diagonal and B and C are dense."},{"start":3110.22,"text":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"start":3137.41,"text":"By the way, a lot of this stuff subsumes things that were taught in the 60s, 70s, and 80s. And sometimes in the 90s by people who learned it from people who learned it in the 60s and 70s. So, for example, if you teach a course on control, you might... I've done this. I haven't done it for a long time. I won't do it again."},{"start":3157.4,"text":"But you go through a long derivation of what, like, the Kalman filter is, or how to solve an optimal control problem, right? And it's very clever, and you have little parts in this Bellman equation, and blah, blah, blah, and you get a... And yeah, you end up with stuff that actually works. It's great. A very funny thing happens. If you simply take the problem represented by an optimal control problem or a Kalman filter and just throw it at a sparse solver, guess what?"}],"speech_gaps":[],"frame":"../frames/v013/019.webp","frame_time":3036.39},{"title":"凸优化中的线性代数与无约束最小化","segments":[{"id":146,"text":"It'll be just as it'll do it. It'll do it. So basically all of those lectures were useless is what I'm saying as a practical matter, which is kind of embarrassing, but whatever. So I don't teach that anymore. So I don't teach that way anymore. I just say you get a giant set of linear equations and you solve it using sparse methods. Done. That is the correct way to do it. It gives you a lot of stuff, right? So this isn't a lot of fields.","zh":"它会像它会做的那样去做。它会去做。所以基本上我是在说，从实际角度来看，所有的那些讲座都是没用的，这有点令人尴尬，但不管怎样。所以我现在不再教这些了。我也不再用这种方式来教了。我只是说你会得到一组巨大的线性方程，然后用稀疏方法来求解。搞定。这就是正确的方法。它会给你很多内容，对吧？所以这并不是很多领域的事情。","start":3183.81,"end":3210.37},{"id":147,"text":"Yeah, I think probably I'm almost certain in statistics, there'd be many, many papers written on if you had a factor model. So that's a covariance matrix is diagonal plus low rank. And it would be all sorts of things about very intensely clever ways. I could condition, suppose I gave you 80% of the entries of a vector. And I said, please compute the conditional means of the remaining ones. Everybody follow this? That's like a conditional mean imputation task.","zh":"是的，我想在统计学中，如果有一个因子模型，肯定会有许多、许多论文讨论这个问题。也就是说，协方差矩阵是对角线加上低秩的。这会涉及各种非常巧妙的方法。比如，假设我给你一个向量的80%的条目，然后说，请计算剩余条目的条件均值。大家明白这个意思吗？这就是一个条件均值插补任务。","start":3211.47,"end":3234.95},{"id":148,"text":"right? So I'm sure there's whole papers written on this and clever methods for doing this and blah. Anyway, the answer is you form the covariance matrix, literally write down the equations you want to solve, and then you do nothing but pass it to a sparse solver. And it'll be just as fancy, probably more general than all those papers. So, okay. It's embarrassing, but true. Okay. All right.","zh":"对吧？所以我相信肯定有整篇论文专门讨论这个问题，以及各种巧妙的方法来处理它，等等。不管怎样，答案是：你构建协方差矩阵，直接写出你想要求解的方程，然后你所做的只是将它传递给一个稀疏求解器。它会和那些论文一样复杂，甚至可能更通用。所以，好吧。这很尴尬，但这是事实。好吧。好了。","start":3235.59,"end":3263.33},{"id":149,"text":"I'm not going to go into this. There's a whole lot more I haven't told you about linear algebra, but these are the main points. Right now, this is just sort of hanging here. Now you just know about linear algebra, but I promise in the next week, we're going to connect it to optimization problems, and that will have a connection to applications. And then you will start being able to listen to a problem.","zh":"我不会深入讨论这个。关于线性代数，我还有很多没告诉你们的内容，但这些是主要的要点。现在，这只是一个悬而未决的问题。现在你只是知道了一些线性代数的内容，但我保证在接下来的一周里，我们会将它与优化问题联系起来，这将与实际应用相关联。然后你将开始能够理解一个问题。","start":3265.92,"end":3293.2},{"id":150,"text":"a practical problem and say i can solve that like i can solve that super fast right so everybody uh getting this right so i mean there's people where this is all they do right if you do scientific computation this is kind of a lot of the stuff you do so okay so now now we're going to start um unconstrained minimization um","zh":"一个实际的问题，并说我可以解决它，我可以非常快速地解决它。所以大家明白这个意思吗？我的意思是，有些人就是靠这个谋生的。如果你从事科学计算，这基本上就是你做的一部分内容。所以，现在我们开始进入无约束最小化的问题。","start":3294.0,"end":3314.58},{"id":151,"text":"And we'll, like I say, we're building slowly up at the lowest level. Well, at the lowest level are, you know, computers, compilers, microcode, things like that, which we're not going to look at. Next level up, the bottom floor is what we just covered was linear algebra. Now, the next floor is how do you solve, like, you know, smooth, unconstrained problems. So we'll look at that first.","zh":"我们会像我刚才说的那样，从最低层逐步构建起来。最低层包括计算机、编译器、微代码等，这些我们不会去考虑。下一层是刚刚我们讲过的线性代数。再往上一层是，如何解决光滑的无约束问题。因此，我们首先会研究这个问题。","start":3315.34,"end":3338.08},{"id":152,"text":"and we'll build slowly up, then we'll get equality constraints, then we'll pull in inequality constraints, and then we're there, right? So, okay. So here's what it looks like. We're going to minimize a function, f, here, that is, we're going to assume it's smooth and twice continuously differentiable, right?","zh":"然后我们会逐步构建起来，接着处理等式约束，再引入不等式约束，最后就完成了，对吧？好的。那么，这就是它的样子。我们要最小化一个函数 f，我们假设它是光滑的，并且二阶连续可导，对吧？","start":3340.92,"end":3358.06}],"notes":["本段主要讨论了线性代数在实际问题中的应用，指出通过稀疏方法求解大规模线性方程组是更有效的方法，而不是依赖复杂的统计模型。讲者提到，虽然统计学中有很多关于因子模型的论文，但实际操作中只需构建协方差矩阵并使用稀疏求解器即可，这种方法比那些论文中的方法更通用。","讲者进一步说明了线性代数在优化问题中的重要性，并提到接下来的课程将逐步引入优化问题，从无约束最小化开始，逐步引入等式约束和不等式约束，最终形成完整的优化框架。","讲者强调了无约束最小化是优化问题的基础，接下来的课程将从最低层次（如计算机、编译器等）开始，逐步上升到线性代数，再进一步讨论如何求解光滑无约束问题。","讲者提到，优化问题的解决需要假设目标函数是光滑且二阶可微的，这是后续讨论无约束最小化问题的基础。","讲者还提到，线性代数是连接优化问题与实际应用的桥梁，接下来的课程将展示如何将线性代数的知识应用于优化问题中。","讲者指出，虽然线性代数是基础，但其在优化问题中的应用需要进一步的深入，包括如何构建和求解优化问题，以及如何将这些方法应用于实际问题中。"],"formulas":[],"uncertainties":["a practical problem and say i can solve that like i can solve that super fast right so everybody uh getting this right so i mean there's people where this is all they do right if you do scientific computation this is kind of a lot of the stuff you do so okay so now now we're going to start um unconstrained minimization um"],"diagram":"none","start":3183.81,"end":3358.06,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3183.81,"text":"It'll be just as it'll do it. It'll do it. So basically all of those lectures were useless is what I'm saying as a practical matter, which is kind of embarrassing, but whatever. So I don't teach that anymore. So I don't teach that way anymore. I just say you get a giant set of linear equations and you solve it using sparse methods. Done. That is the correct way to do it. It gives you a lot of stuff, right? So this isn't a lot of fields."},{"start":3211.47,"text":"Yeah, I think probably I'm almost certain in statistics, there'd be many, many papers written on if you had a factor model. So that's a covariance matrix is diagonal plus low rank. And it would be all sorts of things about very intensely clever ways. I could condition, suppose I gave you 80% of the entries of a vector. And I said, please compute the conditional means of the remaining ones. Everybody follow this? That's like a conditional mean imputation task."},{"start":3235.59,"text":"right? So I'm sure there's whole papers written on this and clever methods for doing this and blah. Anyway, the answer is you form the covariance matrix, literally write down the equations you want to solve, and then you do nothing but pass it to a sparse solver. And it'll be just as fancy, probably more general than all those papers. So, okay. It's embarrassing, but true. Okay. All right."},{"start":3265.92,"text":"I'm not going to go into this. There's a whole lot more I haven't told you about linear algebra, but these are the main points. Right now, this is just sort of hanging here. Now you just know about linear algebra, but I promise in the next week, we're going to connect it to optimization problems, and that will have a connection to applications. And then you will start being able to listen to a problem."},{"start":3294.0,"text":"a practical problem and say i can solve that like i can solve that super fast right so everybody uh getting this right so i mean there's people where this is all they do right if you do scientific computation this is kind of a lot of the stuff you do so okay so now now we're going to start um unconstrained minimization um"},{"start":3315.34,"text":"And we'll, like I say, we're building slowly up at the lowest level. Well, at the lowest level are, you know, computers, compilers, microcode, things like that, which we're not going to look at. Next level up, the bottom floor is what we just covered was linear algebra. Now, the next floor is how do you solve, like, you know, smooth, unconstrained problems. So we'll look at that first."},{"start":3340.92,"text":"and we'll build slowly up, then we'll get equality constraints, then we'll pull in inequality constraints, and then we're there, right? So, okay. So here's what it looks like. We're going to minimize a function, f, here, that is, we're going to assume it's smooth and twice continuously differentiable, right?"}],"speech_gaps":[],"frame":"../frames/v013/020.webp","frame_time":3195.81},{"title":"迭代方法与收敛性","segments":[{"id":153,"text":"And we'll assume that, you know, the optimal value is achieved, right? So there's at least an optimal point, right? Now, by the way, a lot of problems like that that we want to solve in this class, problems you have already solved, don't satisfy this, right? Like if you did an L1 fitting problem, you would minimize the L1 norm of AX minus B, and that doesn't count. That's not here because that's not differentiable, okay? Okay, so this is what we're going to do.","zh":"我们将假设，你知道的，最优值是可以达到的，对吧？所以至少存在一个最优解点，对吧？顺便说一句，我们这门课中想要解决的很多这类问题，你已经解决过的问题，都不满足这个条件，对吧？比如如果你做过L1拟合问题，你会最小化AX减B的L1范数，而这种情况就不适用。因为那不是可微的，对吧？好的，所以这就是我们要做的事情。","start":3359.74,"end":3386.79},{"id":154,"text":"In general, except for a very important set of problems we will see shortly, there are no analytical solutions to this.","zh":"一般来说，除了我们很快就会看到的一个非常重要的问题集合外，这些问题都没有解析解。","start":3388.24,"end":3395.22},{"id":155,"text":"Instead, we're going to have iterative methods. And an iterative method is going to generate an x. It's going to query something about f and then generate a new x and so on, a new x and a new x. And what's going to happen is those x's are going to converge to hopefully a solution of this problem. And what we'll do is the typical thing you're going to get is something like this sequence.","zh":"相反，我们将使用迭代方法。迭代方法将生成一个x。它将查询关于f的一些信息，然后生成一个新的x，如此反复，生成新的x和新的x。而发生的事情是，这些x将收敛到这个问题的一个解。而我们将做的通常是得到这样的一个序列。","start":3399.11,"end":3425.19},{"id":156,"text":"is going to have the function values converge to the optimal value. And another way to say it is that the gradient, you're going to have a sequence of points where the gradient gets smaller and smaller. And then when you deem it to be small enough, you asked earlier about stopping criteria. Here you have stopping criteria. For the direct methods, you don't have stopping criteria. Well, it just stops. It's like after n cubed over three steps, you've got the Cholesky factor. There is no stopping criterion. Here there is.","zh":"这个序列的函数值将收敛到最优值。另一种说法是，你将得到一个点序列，其中梯度会越来越小。然后当你认为足够小时，你之前问过停止准则的问题。这里就是停止准则。对于直接方法，你没有停止准则。好吧，它只是停止。比如在n立方除以三步之后，你就得到了Cholesky因子。这里没有停止准则。这里是有。","start":3425.82,"end":3454.14},{"id":157,"text":"Okay, so we'll make some assumptions. I don't want to get too technical about it because it quickly gets kind of boring and stuff like that. And by the way, there's entire classes that cover nothing but this material and hideous, full mathematical detail. So, I mean, they're interesting, but I don't know. I think some people grow out of it. Anyway, I'll stop here. Okay, that's fine. Okay.","zh":"好的，我们将做一些假设。我不想太技术性地讨论这个问题，因为它很快就会变得有点无聊，诸如此类。顺便说一句，有整个课程只讲这方面的内容和可怕的、完整的数学细节。所以，我意思是，它们很有趣，但我不知道。我想有些人会从中走出来。不管怎样，我在这里停下来。好的，这样就可以了。好的。","start":3455.8,"end":3483.89},{"id":158,"text":"So we're going to assume that the sublevel sets are closed. And one condition for that is pretty common, is that the function f is closed. If you do convex analysis, which is the mathematics of convex optimization and convexity, this is a central concept. It just means that the epigraph is closed. And one example would be if you had a...","zh":"因此，我们将假设次梯度水平集是闭合的。满足这一条件的一个常见情况是函数 f 是闭合的。如果你学习凸分析，也就是凸优化和凸性的数学理论，这是一个核心概念。它仅仅意味着上境图是闭合的。一个例子就是如果你有一个……","start":3487.02,"end":3510.92}],"notes":["本段主要讨论凸优化问题中迭代方法的使用，强调在没有解析解的情况下，需要依赖迭代方法来逼近最优解。讲者指出，许多实际问题（如L1拟合）由于不可微性，无法直接求解，因此需要迭代方法。","讲者提到，迭代方法通过生成一系列点，逐步逼近最优解，这些点的函数值会收敛到最优值，同时梯度也会逐渐减小。当梯度足够小时，可以作为停止条件。","讲者还提到，直接方法（如Cholesky分解）没有明确的停止条件，而迭代方法则有明确的停止条件，这在实际应用中非常重要。","讲者指出，虽然凸优化的理论非常深入，但课程中不会深入探讨所有数学细节，因为这会变得枯燥。他提到，有些课程专门讲授这些内容，但并非所有人都对这些内容感兴趣。","最后，讲者提到将假设函数的次级集是闭合的，这是凸分析中的一个核心概念，意味着上图是闭合的。例如，如果函数是连续的，那么它的次级集就是闭合的。","讲者提到，凸分析是凸优化的数学基础，涉及许多核心概念，如闭合性、上图等，这些概念在后续课程中会进一步展开。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3359.74,"end":3510.92,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3359.74,"text":"And we'll assume that, you know, the optimal value is achieved, right? So there's at least an optimal point, right? Now, by the way, a lot of problems like that that we want to solve in this class, problems you have already solved, don't satisfy this, right? Like if you did an L1 fitting problem, you would minimize the L1 norm of AX minus B, and that doesn't count. That's not here because that's not differentiable, okay? Okay, so this is what we're going to do."},{"start":3388.24,"text":"In general, except for a very important set of problems we will see shortly, there are no analytical solutions to this."},{"start":3399.11,"text":"Instead, we're going to have iterative methods. And an iterative method is going to generate an x. It's going to query something about f and then generate a new x and so on, a new x and a new x. And what's going to happen is those x's are going to converge to hopefull
