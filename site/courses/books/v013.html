y a solution of this problem. And what we'll do is the typical thing you're going to get is something like this sequence."},{"start":3425.82,"text":"is going to have the function values converge to the optimal value. And another way to say it is that the gradient, you're going to have a sequence of points where the gradient gets smaller and smaller. And then when you deem it to be small enough, you asked earlier about stopping criteria. Here you have stopping criteria. For the direct methods, you don't have stopping criteria. Well, it just stops. It's like after n cubed over three steps, you've got the Cholesky factor. There is no stopping criterion. Here there is."},{"start":3455.8,"text":"Okay, so we'll make some assumptions. I don't want to get too technical about it because it quickly gets kind of boring and stuff like that. And by the way, there's entire classes that cover nothing but this material and hideous, full mathematical detail. So, I mean, they're interesting, but I don't know. I think some people grow out of it. Anyway, I'll stop here. Okay, that's fine. Okay."},{"start":3487.02,"text":"So we're going to assume that the sublevel sets are closed. And one condition for that is pretty common, is that the function f is closed. If you do convex analysis, which is the mathematics of convex optimization and convexity, this is a central concept. It just means that the epigraph is closed. And one example would be if you had a..."}],"speech_gaps":[],"frame":"../frames/v013/021.webp","frame_time":3371.74},{"title":"闭函数与最小曲率条件","segments":[{"id":159,"text":"Here's some examples of some closed functions, right? Log sum x. This is because the domain of this is anything, right? So this would count here. Here's another one. This is weird because you might say, but there's a constraint. The constraint is that x lies in the interior of this polyhedron. Because otherwise, I mean, so there's an embedded constraint here. And you might say, no, I don't like that. But this one is perfectly good. All the sublevel sets are closed. And the reason is that the function value goes to infinity as you approach the boundary.","zh":"这里有一些闭函数的例子，对吧？对数求和函数。这是因为这个函数的定义域是任何值，对吧？所以这个例子在这里是适用的。这里还有一个例子。这有点奇怪，因为你可能会说，但这里有一个约束条件。约束条件是x位于这个多面体的内部。否则的话，我的意思是，这里有一个嵌入的约束条件。你可能会说，不，我不喜欢这个。但这个例子是完全合理的。所有的次级水平集都是闭的。原因在于，当接近边界时，函数值会趋向于无穷大。","start":3511.81,"end":3539.97},{"id":160,"text":"So we'll get to that. These are technical conditions, I think, not super-duper important. People sometimes assume something like a minimum curvature. So what that says is, for example, the minimum eigenvalue of the Hessian is bigger than some number m, which is positive. That gives you a minimum curvature to the function. That'll allow you to say all sorts of things.","zh":"我们之后会讲到这些。我认为这些是技术性的条件，不是特别重要。人们有时会假设某种最小曲率。也就是说，例如，Hessian矩阵的最小特征值大于某个正数m。这会给你一个函数的最小曲率。这将允许你得出各种结论。","start":3540.48,"end":3571.03},{"id":161,"text":"Yeah, now you could ask questions like, how would you know what the minimum curvature is? Like, it's a good question, right? And the answer is in most cases, you would have absolutely no idea. There are cases where you do. Oh, here's one. If I do, let's say I do multinomial logistic regression and I add quadratic regularization to it, then I just, I don't even count the curvature that comes from the multinomial logistic regression loss.","zh":"是的，你现在可能会问一些问题，比如，你怎么知道最小曲率是多少？比如，这是一个好问题，对吧？答案是，在大多数情况下，你根本不知道。有一些情况你是知道的。哦，这里有一个例子。如果我做多项式逻辑回归，并且加上二次正则化，那么我甚至不会考虑来自多项式逻辑回归损失的曲率。","start":3572.72,"end":3600.88},{"id":162,"text":"And just the quadratic regularization alone gives me a minimum curvature. Everybody follow me? But these are kind of rare, right? But that is an example where you actually would know a candidate value for m, right? Which is literally the, it's going to be the regularization, the ridge regression parameter. Okay, so if this is the case, then this says that f minus m","zh":"仅仅是二次正则化本身就能给我一个最小曲率。大家都能跟上吗？但这些情况其实相当罕见，对吧？但这是一个实际知道m候选值的例子，对吧？这个值就是正则化参数，也就是岭回归参数。好的，如果这种情况成立，那么这就意味着f减去m","start":3601.61,"end":3627.75},{"id":163,"text":"times the norm of, you know, x squared is actually convex. And if you apply that, if you then apply the basic convexity formula to that, you'll find out, it's really cool, you get a strengthened Jensen, you know, I guess it's not Jensen, whatever, you know, this first part, this up to here, that's true, this is true for any convex function, this part.","zh":"乘以x的范数平方实际上是凸的。如果你应用这个，然后应用基本的凸性公式，你会发现，这真的很酷，你会得到一个加强版的Jensen不等式，你知道的，也许不是Jensen，不管怎样，这部分，直到这里，这是对任何凸函数都成立的，这部分。","start":3628.38,"end":3652.32},{"id":164,"text":"That's the basic inequality. What this says is, oh yeah, well it applies with a little bit more. That's the minimum curvature constraint. So it strengthens that basic inequality we saw six weeks ago or whenever it was, seven weeks ago, six. And this means all sorts of cool things because, for example, I could minimize both of these equations over y. On the left,","zh":"这就是基本不等式。它说的是，哦，对了，它还适用于更广泛的情况。这就是最小曲率约束。因此，它加强了我们六周前或七周前看到的那个基本不等式。这意味着各种有趣的事情，例如，我可以对y同时最小化这两个方程。在左边，","start":3652.78,"end":3679.97}],"notes":["本段讨论了闭函数的定义及其与约束条件的关系。讲者指出，闭函数的子水平集必须是闭集，而函数值在接近边界时趋于无穷大。此外，讲者提到在某些情况下，如多分类逻辑回归加上二次正则化时，可以确定最小曲率的下界，这有助于分析函数的凸性。","讲者进一步解释了最小曲率条件的应用，即函数的Hessian矩阵的最小特征值大于某个正数m，这为函数提供了最小曲率。这种条件允许进行更深入的分析，例如加强Jensen不等式。","讲者提到，虽然在大多数情况下无法确定最小曲率，但在某些特殊情况下，如使用岭回归正则化时，可以明确知道m的候选值。这表明正则化参数直接影响函数的最小曲率。","讲者指出，当函数满足最小曲率条件时，可以将函数减去m乘以范数的平方视为凸函数。应用基本凸性公式后，可以得到一个加强的Jensen不等式，这在凸优化中具有重要意义。","讲者提到，这种加强的不等式可以用于优化问题，例如同时最小化两个方程。这表明最小曲率条件在实际应用中具有广泛的用途。","讲者强调，这些条件虽然技术性较强，但并非至关重要。它们为分析函数的性质提供了额外的工具，有助于更深入地理解凸优化问题。"],"formulas":[],"uncertainties":["f minus m times the norm of, you know, x squared is actually convex"],"diagram":"none","start":3511.81,"end":3679.97,"asr_flags":[],"math_clarifications":["原始片段中提到的公式未提供足够的上下文来确认其数学性质，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3511.81,"text":"Here's some examples of some closed functions, right? Log sum x. This is because the domain of this is anything, right? So this would count here. Here's another one. This is weird because you might say, but there's a constraint. The constraint is that x lies in the interior of this polyhedron. Because otherwise, I mean, so there's an embedded constraint here. And you might say, no, I don't like that. But this one is perfectly good. All the sublevel sets are closed. And the reason is that the function value goes to infinity as you approach the boundary."},{"start":3540.48,"text":"So we'll get to that. These are technical conditions, I think, not super-duper important. People sometimes assume something like a minimum curvature. So what that says is, for example, the minimum eigenvalue of the Hessian is bigger than some number m, which is positive. That gives you a minimum curvature to the function. That'll allow you to say all sorts of things."},{"start":3572.72,"text":"Yeah, now you could ask questions like, how would you know what the minimum curvature is? Like, it's a good question, right? And the answer is in most cases, you would have absolutely no idea. There are cases where you do. Oh, here's one. If I do, let's say I do multinomial logistic regression and I add quadratic regularization to it, then I just, I don't even count the curvature that comes from the multinomial logistic regression loss."},{"start":3601.61,"text":"And just the quadratic regularization alone gives me a minimum curvature. Everybody follow me? But these are kind of rare, right? But that is an example where you actually would know a candidate value for m, right? Which is literally the, it's going to be the regularization, the ridge regression parameter. Okay, so if this is the case, then this says that f minus m"},{"start":3628.38,"text":"times the norm of, you know, x squared is actually convex. And if you apply that, if you then apply the basic convexity formula to that, you'll find out, it's really cool, you get a strengthened Jensen, you know, I guess it's not Jensen, whatever, you know, this first part, this up to here, that's true, this is true for any convex function, this part."},{"start":3652.78,"text":"That's the basic inequality. What this says is, oh yeah, well it applies with a little bit more. That's the minimum curvature constraint. So it strengthens that basic inequality we saw six weeks ago or whenever it was, seven weeks ago, six. And this means all sorts of cool things because, for example, I could minimize both of these equations over y. On the left,"}],"speech_gaps":[],"frame":"../frames/v013/022.webp","frame_time":3523.81},{"title":"梯度下降法与停止准则","segments":[{"id":165,"text":"I get p star, because it's just the minimum f of y. On the right, this is a quadratic function in y. I set the gradient equal to zero, I minimize it, and you get a number, which is actually, it's going to be, anyway, you end up with something that looks like this. You end up with this inequality, right? And so this is kind of cool, because this says that if you wanted a stopping criterion, you would run the algorithm, you'd evaluate the gradient, and when the gradient gets small enough, you quit. And someone says, why are you quitting?","zh":"我得到了p星，因为它就是y的最小值f。在右边，这是一个关于y的二次函数。我把梯度设为零，进行最小化，得到一个数值，实际上，不管怎样，你最终会得到一个看起来像这样的结果。你最终会得到这样一个不等式，对吧？所以这有点酷，因为这说明如果你想要一个停止准则，你就会运行算法，评估梯度，当梯度足够小时，你就停止。有人会问，为什么你要停止？","start":3680.53,"end":3709.53},{"id":166,"text":"And you'd say, well, the gradient is less than something. And they go, yeah, but how far am I from optimal? And then you would say, oh, good question. I can actually bound it. I can say that here's how far you are from the optimal value. No more than 1 over 2m times this. Of course, then, in general, someone would say, how do you know m? And the answer is you don't and blah, blah, blah. But this is the justification you would have for stopping when the gradient is small.","zh":"你会说，梯度小于某个值。他们问，那我离最优解有多远？然后你会说，这是个好问题。我实际上可以对它进行界估计。我可以说明你离最优值的距离不超过1除以2m乘以这个值。当然，一般来说，有人会问，你怎么知道m是多少？答案是你不知道，等等。但这就是当你梯度足够小时停止的理论依据。","start":3711.16,"end":3735.5},{"id":167,"text":"So we'll say a little bit about descent methods. These are super widely used. And they all have a generic form. And it looks like this. In each step of a descent method, you're going to find something called delta x. And that's called the step or the search direction. Here.","zh":"我们稍作介绍下降方法。这些方法被广泛使用。它们都有一个通用的形式。看起来像这样。在下降方法的每一步中，你都会找到一个称为delta x的量。这被称为步长或搜索方向。","start":3739.73,"end":3762.35},{"id":168,"text":"And so, you know, basically what happens is at iteration k, you have xk, you make some queries to f about, like, what's the gradient or something like that, and then you form this search direction. So you stop and you ask for directions, and it says, well, you're here, you want to minimize, you know, you should kind of go that direct. That's delta x. That's this direction.","zh":"所以，基本上，在第k次迭代中，你有xk，你向f做一些查询，比如梯度之类的，然后形成这个搜索方向。你停下来并询问方向，它会说，你在这里，你想最小化，你应该朝着那个方向走。这就是delta x。这就是这个方向。","start":3763.63,"end":3783.57},{"id":169,"text":"Then what you do is you're going to go in that direction, but with an amount that you're going to then choose. And that amount is scaled by this factor t, which is positive. And this is, that's called sometimes the step size or the step length, even though it need not be, it's not really the length unless the norm of the gradient is equal to one, right? But still people call it the step length or the step size or something like that. So, okay, that's what you do.","zh":"接下来，你会朝着这个方向走，但走的距离是你随后选择的一个量。这个量被这个正数因子t所缩放。这有时被称为步长或步长长度，尽管它不一定代表长度，除非梯度的范数等于1。但人们仍然称它为步长长度或步长大小之类的。所以，好的，这就是你要做的事情。","start":3784.16,"end":3810.94},{"id":170,"text":"And it turns out if the direction you move in has a negative inner product with the gradient, then it turns out, and if you choose the step size correctly, the new point will actually have a function value less than the original point. That's good. That's called the descent method because you're kind of descending, right? And you end up with a function value that's lower. Okay? So here's like a generic version of it.","zh":"事实上，如果移动的方向与梯度的内积为负，那么如果选择合适的步长，新的点实际上会具有比原点更低的函数值。这是好的，这被称为下降方法，因为你在逐渐下降，对吧？最终你会得到一个更低的函数值。明白吗？这里是一个通用版本。","start":3812.49,"end":3839.76}],"notes":["本段讲解了梯度下降法的基本思想，即通过计算梯度并沿着负梯度方向移动来寻找函数的最小值。当梯度足够小时，可以作为停止准则。这为算法的终止提供了理论依据。","在停止准则的讨论中，讲者提到梯度的大小可以用来判断是否接近最优解，并且可以给出一个上界来估计当前点与最优值之间的距离。然而，这个上界中的参数m通常是未知的，因此实际应用中需要权衡。","讲者介绍了下降方法的通用形式，即在每一步中计算搜索方向（delta x），并根据梯度信息确定移动方向。搜索方向的选择是下降方法的核心。","在移动方向确定后，需要选择一个合适的步长（t）来控制移动的幅度。步长的选择会影响算法的收敛速度和稳定性，但通常不直接等同于梯度的长度。","讲者指出，如果搜索方向与梯度的内积为负，则在适当选择步长的情况下，新的函数值会比原点的函数值更低。这正是下降方法的名称来源。","最后，讲者总结了下降方法的通用形式，强调了其在优化问题中的广泛应用和基本原理。"],"formulas":[{"latex":"f(x_{k+1}) \u003c f(x_k)","symbols":"新的函数值小于原函数值，表示下降","explanation":"该公式正确表达了下降方法的核心思想，即在每一步迭代中，新的函数值小于原函数值。","evidence":"And it turns out if the direction you move in has a negative inner product with the gradient, then it turns out, and if you choose the step size correctly, the new point will actually have a function value less than the original point. That's good. That's called the descent method because you're kind of descending, right? And you end up with a function value that's lower. Okay? So here's like a generic version of it."}],"uncertainties":[],"diagram":"none","start":3680.53,"end":3839.76,"asr_flags":[],"math_clarifications":["公式 0 的表达不完整且没有提供有效的数学信息，因此被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":3680.53,"text":"I get p star, because it's just the minimum f of y. On the right, this is a quadratic function in y. I set the gradient equal to zero, I minimize it, and you get a number, which is actually, it's going to be, anyway, you end up with something that looks like this. You end up with this inequality, right? And so this is kind of cool, because this says that if you wanted a stopping criterion, you would run the algorithm, you'd evaluate the gradient, and when the gradient gets small enough, you quit. And someone says, why are you quitting?"},{"start":3711.16,"text":"And you'd say, well, the gradient is less than something. And they go, yeah, but how far am I from optimal? And then you would say, oh, good question. I can actually bound it. I can say that here's how far you are from the optimal value. No more than 1 over 2m times this. Of course, then, in general, someone would say, how do you know m? And the answer is you don't and blah, blah, blah. But this is the justification you would have for stopping when the gradient is small."},{"start":3739.73,"text":"So we'll say a little bit about descent methods. These are super widely used. And they all have a generic form. And it looks like this. In each step of a descent method, you're going to find something called delta x. And that's called the step or the search direction. Here."},{"start":3763.63,"text":"And so, you know, basically what happens is at iteration k, you have xk, you make some queries to f about, like, what's the gradient or something like that, and then you form this search direction. So you stop and you ask for directions, and it says, well, you're here, you want to minimize, you know, you should kind of go that direct. That's delta x. That's this direction."},{"start":3784.16,"text":"Then what you do is you're going to go in that direction, but with an amount that you're going to then choose. And that amount is scaled by this factor t, which is positive. And this is, that's called sometimes the step size or the step length, even though it need not be, it's not really the length unless the norm of the gradient is equal to one, right? But still people call it the step length or the step size or something like that. So, okay, that's what you do."},{"start":3812.49,"text":"And it turns out if the direction you move in has a negative inner product with the gradient, then it turns out, and if you choose the step size correctly, the new point will actually have a function value less than the original point. That's good. That's called the descent method because you're kind of descending, right? And you end up with a function value that's lower. Okay? So here's like a generic version of it."}],"speech_gaps":[],"frame":"../frames/v013/023.webp","frame_time":3692.53},{"title":"梯度下降法中的搜索方向与步长选择","segments":[{"id":171,"text":"To make this a real algorithm, we have to fill in things. We have to figure out how do you find the descent direction? And then we have to figure out how do you choose the step length, right? And that's the whole thing, right? And the stopping criterion could be some norm of the gradient. Usually it's not. Usually it's something that is computed as a byproduct of these two steps in here. So this is going to be like hundreds of different methods with different names are going to have exactly this form.","zh":"为了使这成为一个真正的算法，我们必须填充一些内容。我们必须弄清楚如何找到下降方向？然后我们必须弄清楚如何选择步长，对吧？这就是整个问题所在，对吧？停止准则可以是梯度的某种范数。通常不是这样。通常它是这些两个步骤中的一个副产品计算出来的。因此，这将会有数百种不同的方法，有不同的名称，但它们都将具有完全相同的这种形式。","start":3841.45,"end":3868.42},{"id":172,"text":"And they differ in what's the search direction and they differ in what is the line search. So that's the idea. So for line searches, there's a bunch. I mean, here's one. One is an exact line search. That says once you've decided that you're here and you're going in that direction, you actually look at the function restricted to that ray.","zh":"它们在搜索方向上有所不同，它们在线搜索上也有所不同。这就是这个想法。对于线搜索，有很多种方法。我的意思是，这里有一种。一种是精确线搜索。它说，一旦你决定你现在在这里并且你沿着这个方向前进，你实际上会查看该函数在该射线上的限制。","start":3868.86,"end":3895.18},{"id":173,"text":"And then you look for the point where along that ray you have the smallest value. So that's called an exact line search. And you can do this in some cases, right? Where you can actually work this out analytically or you can compute it cheaply or something like that, right? So that's one place where you might do this, right?","zh":"然后你寻找沿着这条射线上的最小值点。这就是所谓的精确线搜索。你可以在某些情况下这样做，对吧？当你能够分析地计算出这个值，或者可以廉价地计算出这个值，或者其他类似的情况，对吧？因此，这可能是你这样做的一种情况，对吧？","start":3895.92,"end":3914.18},{"id":174,"text":"Another one, which sounds much cruder, is called a backtracking line search. And this has many, many names, again, depending on where you came from. It's called an Armijo line search. It's got all sorts of names for it. Armijo condition is at least one of those. I forget what it is in Russian, but they have a different name for it. So there are lots of different names for this. So this has been rediscovered, I don't know, a couple hundred times. Here's the way it works.","zh":"另一种方法听起来要粗糙得多，被称为回溯线搜索。这种方法有很多、很多不同的名称，这取决于你来自哪里。它被称为Armijo线搜索。它有各种各样的名称。Armijo条件至少是其中之一。我不记得俄语中它是什么，但他们有另一个名称。因此，这种方法有很多不同的名称。这种方法已经被重新发现，我猜，大约有两百次。这就是它的工作方式。","start":3915.51,"end":3940.21},{"id":175,"text":"It's actually, it's called backtracking, and it goes like this. You start with t equals 1. So you try x plus delta x. Then what you're going to do is you're going to check whether f has gone down, and this is critical, enough.","zh":"它实际上被称为回溯，它的工作方式如下。你从t等于1开始。因此，你尝试x加上delta x。然后你将检查f是否下降了，这很关键，足够下降。","start":3941.47,"end":3956.65},{"id":176,"text":"By the way, if it went up, that's really bad, right? In fact, you can even be out of domain. So that would be like a very, you know, that would be it went up a lot because it went up to plus infinity, right? So, okay. So here's what this looks like. Here's t here. Here is the function restricted to t. This would be...","zh":"顺便说一句，如果它上升了，那真的很糟糕，对吧？事实上，你甚至可能超出定义域。这就像一个非常，你知道的，它上升了很多，因为它上升到正无穷大，对吧？所以，好的。这就是它看起来的样子。这里是t。这里是函数在t上的限制。这将是……","start":3957.34,"end":3982.0},{"id":177,"text":"the exact line search number. That's the exact step length you would take. You'd take this to minimize this, right? So the way this works is you look at this basic inequality here. That basic inequality is this line right here, right? This dashed line. And what it says is if I put alpha equals one in that equation, I can reverse that inequality. Because basically when I continue this linear thing, this is a lower bound on this.","zh":"精确线搜索的步长。这就是你要采取的精确步长。你会采取这个来最小化这个，对吧？所以这个方法是通过观察这里的这个基本不等式。这个基本不等式就是这里的这条直线，对吧？这条虚线。它表示的是，如果我在那个等式中将α设为1，我就可以反转这个不等式。因为基本上当我继续这个线性关系时，这个是这个的下界。","start":3982.28,"end":4010.9}],"notes":["本段讲解了梯度下降法中如何将基本框架转化为实际算法，需要确定下降方向和步长选择。停止准则通常不是梯度范数，而是由这两个步骤的副产品计算得出。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3841.45,"end":4010.9,"asr_flags":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":3841.45,"text":"To make this a real algorithm, we have to fill in things. We have to figure out how do you find the descent direction? And then we have to figure out how do you choose the step length, right? And that's the whole thing, right? And the stopping criterion could be some norm of the gradient. Usually it's not. Usually it's something that is computed as a byproduct of these two steps in here. So this is going to be like hundreds of different methods with different names are going to have exactly this form."},{"start":3868.86,"text":"And they differ in what's the search direction and they differ in what is the line search. So that's the idea. So for line searches, there's a bunch. I mean, here's one. One is an exact line search. That says once you've decided that you're here and you're going in that direction, you actually look at the function restricted to that ray."},{"start":3895.92,"text":"And then you look for the point where along that ray you have the smallest value. So that's called an exact line search. And you can do this in some cases, right? Where you can actually work this out analytically or you can compute it cheaply or something like that, right? So that's one place where you might do this, right?"},{"start":3915.51,"text":"Another one, which sounds much cruder, is called a backtracking line search. And this has many, many names, again, depending on where you came from. It's called an Armijo line search. It's got all sorts of names for it. Armijo condition is at least one of those. I forget what it is in Russian, but they have a different name for it. So there are lots of different names for this. So this has been rediscovered, I don't know, a couple hundred times. Here's the way it works."},{"start":3941.47,"text":"It's actually, it's called backtracking, and it goes like this. You start with t equals 1. So you try x plus delta x. Then what you're going to do is you're going to check whether f has gone down, and this is critical, enough."},{"start":3957.34,"text":"By the way, if it went up, that's really bad, right? In fact, you can even be out of domain. So that would be like a very, you know, that would be it went up a lot because it went up to plus infinity, right? So, okay. So here's what this looks like. Here's t here. Here is the function restricted to t. This would be..."},{"start":3982.28,"text":"the exact line search number. That's the exact step length you would take. You'd take this to minimize this, right? So the way this works is you look at this basic inequality here. That basic inequality is this line right here, right? This dashed line. And what it says is if I put alpha equals one in that equation, I can reverse that inequality. Because basically when I continue this linear thing, this is a lower bound on this."}],"speech_gaps":[],"frame":"../frames/v013/024.webp","frame_time":3853.45},{"title":"线搜索与步长选择","segments":[{"id":178,"text":"Right? So the actual function value could never be below this, if the function's convex, right? So here's what you do. We put an alpha in there, which is a number that's less than one. Yeah, actually, in fact, it's less than half for weird reasons. I mean, it turns out it's not going to matter what it is, too much. And then we degrade the slope by multiplying by alpha. So here alpha is maybe a third. I just made it up. And that would be this line.","zh":"对吧？所以，如果函数是凸的，那么实际的函数值永远不会低于这条线，对吧？所以这里我们放入一个alpha，它是一个小于1的数。实际上，出于一些奇怪的原因，它甚至小于一半。我的意思是，结果发现它具体是多少并不会太重要。然后我们通过乘以alpha来降低斜率。所以这里的alpha可能是三分之一，我只是随便说的。这就是这条线。","start":4011.46,"end":4038.84},{"id":179,"text":"So if you take a really small step length, you're definitely below this line. Because if you take a really small step length here, this is actually a really good approximation of how much the function is going to go down. And then the rule is you have to be below this dashed line, this degraded predicted line. And so the way that works is you might start here.","zh":"所以如果你采取一个非常小的步长，你肯定会在这条线的下方。因为如果你在这里采取一个非常小的步长，这实际上是函数下降多少的一个非常好的近似。规则是你必须位于这条虚线的下方，也就是这条被降低的预测线。所以运作方式是，你可能会从这里开始。","start":4040.36,"end":4062.68},{"id":180,"text":"and query the function and find this value, and you're above this. In fact, the most dramatic one is you'd start way out here, and you're over here. And actually, when you do x plus delta x in that case, you actually have a higher value than f of x. Everybody see that? So that would be a particularly poor choice of step length, right? So what you do then is you multiply this by some factor beta. Beta is typically like a half.","zh":"然后查询函数并找到这个值，你会发现它在上方。事实上，最极端的情况是你从这里开始，然后你在这里。实际上，当在这种情况下进行x加上delta x时，你得到的值实际上比f(x)更大。大家明白这一点吗？所以这就是一个特别糟糕的步长选择，对吧？所以接下来你所做的就是将这个值乘以某个因子beta。beta通常像0.5这样。","start":4063.32,"end":4090.08},{"id":181,"text":"you know people use that they use point one so you you simply say okay that was too much so you you go back by half and you land here you try this one you get this value it's less than this thing and you accept it so you take the first one you accept that's that's backtracking um it looks now you know that your intuition actually the story of a lot of this um unconstrained minimization is i guess there'll be several times when something you would think","zh":"人们使用0.1这样的数值，所以你可以说，那个步长太大了，于是你退回一半，然后你在这里着陆，你尝试这个步长，得到这个值，它小于这个值，于是你接受它。因此你采用第一个被接受的步长。这就是回溯法，现在你明白你的直觉实际上，这个故事中的很多无约束最小化问题，我想，会有几次你认为是正确的，但实际上是完全错误的。","start":4090.6,"end":4117.09},{"id":182,"text":"is right, is just wrong, completely wrong. So now I'll tell you the first one. You would look at this and you'd say, it's obviously, clearly it's better to do an exact line search. That's totally obvious, right? Because you're actually minimizing the function along this line, right? This makes sense. And this crude thing that stops when you've gotten like some acceptable, by the way, people use numbers like alpha equals 0.01.","zh":"现在我将告诉你第一个例子。你会看到这个并说，显然，很明显，进行精确的线搜索更好。这完全显而易见，对吧？因为你实际上是在这条线上最小化函数，对吧？这很合理。而且这种粗糙的方法在你得到一个可接受的步长时就停止，顺便说一句，人们使用像alpha等于0.01这样的数值。","start":4117.93,"end":4141.67},{"id":183,"text":"Right? Meaning, if you get even just the slightest decrease, like, good, fine, thanks, we'll take it. So, everybody see what I'm saying? So, looks very unsophisticated, right? Anyway, all right, now I'll tell you the punchline. The punchline is, it doesn't make any difference. That, in fact, exact line search is not only not better in practice, it's often worse. And the simple dumb thing actually works just fine, thank you. This is not obvious, right?","zh":"对吧？意思是，如果你哪怕只获得一点点下降，比如，好，行，谢谢，我们就接受。所以，大家明白我的意思了吗？所以，看起来非常不复杂，对吧？不管怎样，现在我告诉你们关键点。关键点是，其实没有区别。事实上，精确线搜索不仅在实践中并不更好，反而常常更差。而这个简单的、愚蠢的方法实际上工作得非常好，谢谢。这并不明显，对吧？","start":4142.76,"end":4171.85}],"notes":["本段讨论了线搜索中步长选择的问题，特别是使用回溯法（backtracking）来确定合适的步长。讲者提到，当步长过大时，函数值可能高于预测的下降线，因此需要回退并尝试更小的步长。回溯法通常使用一个因子（如0.5）来调整步长，直到找到一个满足条件的步长。","讲者指出，虽然精确线搜索（exact line search）在理论上是更优的，因为它沿着搜索方向精确地最小化函数，但在实践中，这种方法并不总是更好，甚至可能更差。这与直觉相悖，因为精确线搜索似乎更合理。","讲者强调，简单的、看似粗糙的步长选择方法（如使用一个较小的步长或回溯法）在实际应用中往往表现良好。这表明，虽然精确线搜索在理论上更优，但在实际优化问题中，简单的策略可能更有效。","讲者提到，人们通常使用一个较小的alpha值（如0.01）来判断是否接受一个步长。如果函数值有轻微的下降，就认为该步长是可接受的。这表明，实际应用中对“足够好”的定义可能较为宽松。","讲者指出，精确线搜索的缺点可能在于计算成本较高，而简单的步长选择方法则更高效。因此，在实际优化问题中，可能更倾向于使用简单的策略，而不是精确的线搜索。","讲者最后总结说，精确线搜索在实践中并不总是更好，甚至可能更差，这与直觉相悖，因此需要进一步理解其背后的数学原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4011.46,"end":4171.85,"asr_flags":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4011.46,"text":"Right? So the actual function value could never be below this, if the function's convex, right? So here's what you do. We put an alpha in there, which is a number that's less than one. Yeah, actually, in fact, it's less than half for weird reasons. I mean, it turns out it's not going to matter what it is, too much. And then we degrade the slope by multiplying by alpha. So here alpha is maybe a third. I just made it up. And that would be this line."},{"start":4040.36,"text":"So if you take a really small step length, you're definitely below this line. Because if you take a really small step length here, this is actually a really good approximation of how much the function is going to go down. And then the rule is you have to be below this dashed line, this degraded predicted line. And so the way that works is you might start here."},{"start":4063.32,"text":"and query the function and find this value, and you're above this. In fact, the most dramatic one is you'd start way out here, and you're over here. And actually, when you do x plus delta x in that case, you actually have a higher value than f of x. Everybody see that? So that would be a particularly poor choice of step length, right? So what you do then is you multiply this by some factor beta. Beta is typically like a half."},{"start":4090.6,"text":"you know people use that they use point one so you you simply say okay that was too much so you you go back by half and you land here you try this one you get this value it's less than this thing and you accept it so you take the first one you accept that's that's backtracking um it looks now you know that your intuition actually the story of a lot of this um unconstrained minimization is i guess there'll be several times when something you would think"},{"start":4117.93,"text":"is right, is just wrong, completely wrong. So now I'll tell you the first one. You would look at this and you'd say, it's obviously, clearly it's better to do an exact line search. That's totally obvious, right? Because you're actually minimizing the function along this line, right? This makes sense. And this crude thing that stops when you've gotten like some acceptable, by the way, people use numbers like alpha equals 0.01."},{"start":4142.76,"text":"Right? Meaning, if you get even just the slightest decrease, like, good, fine, thanks, we'll take it. So, everybody see what I'm saying? So, looks very unsophisticated, right? Anyway, all right, now I'll tell you the punchline. The punchline is, it doesn't make any difference. That, in fact, exact line search is not only not better in practice, it's often worse. And the simple dumb thing actually works just fine, thank you. This is not obvious, right?"}],"speech_gaps":[],"frame":"../frames/v013/025.webp","frame_time":4023.46},{"title":"梯度下降法的基本概念","segments":[{"id":184,"text":"So, okay. Now we get to a gradient descent method. This is the simplest one. Remember, we had to choose a direction. I mean, I would hope it would be the first, it should be the first thing you would think of. Someone says, make me an iterative method. I'm at F, I'm at X, and I evaluate F at that point, and I evaluate a gradient. Now, gradient is pointing in the direction.","zh":"好的，现在我们进入梯度下降法。这是最简单的一种。还记得，我们需要选择一个方向。我的意思是，我希望这是第一个想到的，它应该是你首先会想到的事情。有人问，给我一个迭代方法。我在点F，我在点X，我评估F在该点的值，并评估梯度。梯度指向的是函数增加最快的方向。","start":4173.76,"end":4199.57},{"id":185,"text":"of fastest increase of f. If I move in that direction, f goes up as fast as possible. If I move in the negative gradient descent direction, f goes down as quickly as possible. And not only would you come up with this, but you'd also ask yourself, why would you do anything else? I mean, you realize what... Think about if you didn't do the gradient method...","zh":"如果我沿着这个方向移动，函数会尽可能快地增加。如果我沿着负梯度方向移动，函数会尽可能快地减少。你不仅会想到这一点，还会问自己，为什么要做其他事情？我的意思是，你意识到……想想如果你不使用梯度法会怎样？","start":4200.41,"end":4226.29},{"id":186,"text":"What happens is you arrive here and someone says, where's the negative gradient? You go, that direction. You'd say, well, what does that mean? You go, if you go in that direction, you're going to go down as quickly as possible. And you go, cool. Which way do you recommend I go? And you go, uh, that way. You're like, what? Like, why would you recommend that? Anyway, you will shortly see why, but it's kind of non-intuitive, right? But we'll get to it. Anyway, so gradient method is the most intuitive one. It looks like this.","zh":"会发生的是，你来到这里，有人问，负梯度方向在哪里？你会说，那个方向。你会说，那是什么意思？你会说，如果你沿着那个方向移动，你会尽可能快地减少。你会说，好。你推荐我往哪个方向走？你会说，嗯，那个方向。你会说，什么？为什么你会推荐那个方向？无论如何，你很快就会看到原因，但这有点非直观，对吧？不过我们会讲到。总之，梯度法是最直观的一种。它看起来像这样。","start":4226.53,"end":4252.78},{"id":187,"text":"It doesn't matter what line search you use. And here it is. And you can prove convergence of this and all that kind of stuff. That's fine. It turns out this is often unbelievably slow. So in fact, we'll see what other search directions can actually dramatically improve this, but this is slow. Very weird. And we'll look at a picture to understand it. So I just take a quadratic. Looks like this, right? And here's some level curves of the quadratic.","zh":"不管使用什么线搜索方法，这里就是。你可以证明这种方法的收敛性以及所有这些内容。这没问题。事实上，这种方法通常慢得令人难以置信。因此，我们会看到其他搜索方向实际上可以显著改进这一点，但这种方法很慢。非常奇怪。我们会通过一张图来理解它。所以我只是取一个二次函数。看起来像这样，对吧？这里是二次函数的等高线。","start":4254.11,"end":4282.34},{"id":188,"text":"Down here and gamma is a number. Oh, yeah, let's see. So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1, this is 1/2 X1 squared plus X2 squared. Oh, yeah, by the way, what's the gradient in that case if the level sets are just circles? You're here. What is the gradient look like? What is the gradient?","zh":"在这里，gamma 是一个数字。哦，对了，让我们看看。所以 gamma 允许我改变等高线的偏心率，对吧？如果 gamma 等于 1，这就是 1/2 X1 平方加上 X2 平方。哦，对了，顺便问一下，如果等高线只是圆的话，梯度是什么样的？你在这里。梯度看起来是什么样的？梯度是什么？","start":4283.43,"end":4310.47},{"id":189,"text":"In that case, I'll draw this, it's fine. So here's your function. Here are the level sets. Here's zero, right? These are level sets. You're here. The gradient points directly out like that, and the negative gradient points directly towards zero, which is the minimizer. So if I asked you to minimize x1 squared plus x2 squared using the gradient method with an exact line search,","zh":"在这种情况下，我会画出来，没关系。这是你的函数。这里是等值线。这里是零点，对吧？这些都是等值线。你现在在这里。梯度指向那个方向，而负梯度则直接指向零点，也就是最小值点。如果我让你使用梯度法并进行精确线搜索来最小化x1平方加上x2平方，","start":4313.33,"end":4342.73}],"notes":["本段讲解了梯度下降法的基本思想，即通过计算函数在某一点的梯度，沿着负梯度方向进行迭代更新，以达到最小化目标函数的目的。讲者提到梯度方向是函数值上升最快的方向，而负梯度方向则是下降最快的方向，这是梯度下降法的核心思想。","讲者通过一个二次函数的例子来说明梯度下降法的直观理解。当目标函数是二次函数时，其等高线是圆形，梯度方向指向远离最小值点，而负梯度方向则指向最小值点。这说明梯度下降法在这样的问题中具有直观的几何解释。","讲者提到梯度下降法虽然直观，但其收敛速度可能非常慢，因此需要考虑其他搜索方向以提高效率。这表明梯度下降法在某些情况下可能不是最优选择，需要进一步优化。","讲者还提到通过改变参数gamma可以调整等高线的形状，从而影响梯度下降法的收敛过程。这说明梯度下降法的性能可能受到目标函数形状的影响。","讲者在讲解过程中多次强调梯度下降法的直观性和基础性，这表明该方法是优化问题中最基本的算法之一，是理解更复杂优化方法的基础。","讲者通过提问和举例的方式引导学生思考梯度下降法的原理和应用，这有助于加深学生对梯度下降法的理解。"],"formulas":[{"latex":"f(x) = \\frac{1}{2}x_1^2 + x_2^2","symbols":"目标函数为二次函数","explanation":"公式正确，目标函数为二次函数，符合上下文描述的二次函数形式。","evidence":"Down here and gamma is a number. Oh, yeah, let's see So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1 This is 1 half X 1 square plus X 2 squared. Oh, yeah, by the way What's the gradient in that case if the so the level sets are just circles? You're here What what what is the gradient look like? What is the gradient?"},{"latex":"g(x) = \\nabla f(x)","symbols":"梯度","explanation":"公式正确，表示梯度，符合上下文描述的梯度方向。","evidence":"Down here and gamma is a number. Oh, yeah, let's see So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1 This is 1 half X 1 square plus X 2 squared. Oh, yeah, by the way What's the gradient in that case if the so the level sets are just circles? You're here What what what is the gradient look like? What is the gradient?"},{"latex":"-g(x) = -\\nabla f(x)","symbols":"负梯度","explanation":"公式正确，表示负梯度方向，符合上下文描述的负梯度方向。","evidence":"Down here and gamma is a number. Oh, yeah, let's see So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1 This is 1 half X 1 square plus X 2 squared. Oh, yeah, by the way What's the gradient in that case if the so the level sets are just circles? You're here What what what is the gradient look like? What is the gradient?"}],"uncertainties":["gamma equals 1 This is 1/2 X1 squared plus X2 squared"],"diagram":"none","start":4173.76,"end":4342.73,"asr_flags":[],"math_clarifications":["公式中的目标函数为二次函数，符合上下文描述的二次函数形式。"],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":4173.76,"text":"So, okay. Now we get to a gradient descent method. This is the simplest one. Remember, we had to choose a direction. I mean, I would hope it would be the first, it should be the first thing you would think of. Someone says, make me an iterative method. I'm at F, I'm at X, and I evaluate F at that point, and I evaluate a gradient. Now, gradient is pointing in the direction."},{"start":4200.41,"text":"of fastest increase of f. If I move in that direction, f goes up as fast as possible. If I move in the negative gradient descent direction, f goes down as quickly as possible. And not only would you come up with this, but you'd also ask yourself, why would you do anything else? I mean, you realize what... Think about if you didn't do the gradient method..."},{"start":4226.53,"text":"What happens is you arrive here and someone says, where's the negative gradient? You go, that direction. You'd say, well, what does that mean? You go, if you go in that direction, you're going to go down as quickly as possible. And you go, cool. Which way do you recommend I go? And you go, uh, that way. You're like, what? Like, why would you recommend that? Anyway, you will shortly see why, but it's kind of non-intuitive, right? But we'll get to it. Anyway, so gradient method is the most intuitive one. It looks like this."},{"start":4254.11,"text":"It doesn't matter what line search you use. And here it is. And you can prove convergence of this and all that kind of stuff. That's fine. It turns out this is often unbelievably slow. So in fact, we'll see what other search directions can actually dramatically improve this, but this is slow. Very weird. And we'll look at a picture to understand it. So I just take a quadratic. Looks like this, right? And here's some level curves of the quadratic."},{"start":4283.43,"text":"Down here and gamma is a number. Oh, yeah, let's see So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1 This is 1 half X 1 square plus X 2 squared. Oh, yeah, by the way What's the gradient in that case if the so the level sets are just circles? You're here What what what is the gradient look like? What is the gradient?"},{"start":4313.33,"text":"In that case, I'll draw this, it's fine. So here's your function. Here are the level sets. Here's zero, right? These are level sets. You're here. The gradient points directly out like that, and the negative gradient points directly towards zero, which is the minimizer. So if I asked you to minimize x1 squared plus x2 squared using the gradient method with an exact line search,"}],"speech_gaps":[],"frame":"../frames/v013/026.webp","frame_time":4185.76},{"title":"梯度下降法的局限性与改进方法","segments":[{"id":190,"text":"Tell me about how well that algorithm's going to work. Like, yeah, very well, like in one step, right? It's going to say, which way should I go? You say steepest descent, which just happens in this case to aim directly at the solution, right? Then you do an exact line search and it's game over. Everybody got that? Okay, so, but now, that makes sense. And in fact, someone who was proposing like, you know, a gradient method would say,","zh":"告诉我这个算法表现如何。比如说，非常好，在一步之内，对吧？它会说，我应该往哪个方向走？你说最陡下降法，恰好在这个情况下直接指向了解，对吧？然后你进行精确的线搜索，游戏就结束了。大家明白了吗？好的，所以，这其实是合理的。事实上，提出梯度方法的人会说，","start":4343.37,"end":4370.42},{"id":191,"text":"Yeah, look how well that works. That's great. Like, why would you not do that? Why would you go in a crazy direction like that, right? But we can actually control the eccentricity by making gamma either really big or really small.","zh":"是的，看看这个方法表现得多好。太棒了。为什么你不这么做呢？为什么你要往那么奇怪的方向走呢，对吧？但实际上，我们可以通过让伽马（gamma）非常大或非常小来控制这种偏心程度。","start":4370.93,"end":4386.61},{"id":192,"text":"And in this case, you can actually work out analytically what the iterates are, right? And you get something that looks like this. It's actually a very good picture to have in your mind. Of course, it's totally silly because we don't care about two-dimensional problems. We care about problems with a minimum dimension of 200, 2,000, 20,000, 2 million. But nevertheless...","zh":"在这种情况下，你实际上可以解析地计算出迭代值，对吧？你会得到一个看起来像这样的结果。这其实是一个非常好的画面，存放在你的脑海中。当然，这完全是个玩笑，因为我们不关心二维问题。我们关心的是至少有200维、2000维、20000维、200万维的问题。但不管怎样……","start":4388.51,"end":4406.91},{"id":193,"text":"This gives you the picture. So here, this is when it's just slightly eccentric, and these are the level curves, and so the negative gradient is just simply, the gradient, these are orthogonal to the level curves, and it says go in that direction. This is the minimum, because we're doing exact line search, and then it says which way should I go, and you go like that. Everybody?","zh":"这给你一个画面。在这里，这是当它略微偏心的情况，这些是等高线，负梯度只是简单的梯度，这些与等高线正交，它说往那个方向走。这是最小值，因为我们进行了精确的线搜索，然后它说，我应该往哪个方向走，你往那个方向走。大家明白了吗？","start":4407.34,"end":4430.16},{"id":194,"text":"So this has got, people refer to this as zigzagging. We can make it arbitrarily bad, right? We can take gamma equals 1,000, and you'll find out that this thing's basically going like this. And actually, I think there's even a name in Western optimization, it's called the Muratos effect, right? But it's just, the other thing I like is it's just called zigzagging. Everybody got this? So, by the way, you know, when you see this picture, you can kind of...","zh":"这被称为锯齿现象。我们可以让这种情况变得任意糟糕，对吧？我们可以取伽马等于1000，你会发现这个过程基本上是这样进行的。实际上，我认为在西方优化领域，这甚至有一个名字，叫做Muratos效应，对吧？但另一个我喜欢的是，它只是被称为锯齿现象。大家明白了吗？顺便说一句，当你看到这个画面时，你可以大致……","start":4430.92,"end":4459.97},{"id":195,"text":"Figure out some things immediately. That would be pretty good, right? So if you're in EE or some of any other field you would say You're kind of going in the right direction on average","zh":"立刻得出一些结论。这会非常好，对吧？所以如果你在电子工程或任何其他领域，你会说，你基本上在平均意义上往正确的方向走。","start":4460.4,"end":4471.28},{"id":196,"text":"Right? I mean, the problem is you're just doing this weird thermal thing up and down like this, whereas you want to really kind of be going that way. And so you'd say, you know what? You should run those search directions through a low-pass filter or something. I mean, again, I'm speaking dialect. Or if you do physics, you'd say, yeah, you know, add some momentum to it or something like that. Or viscosity. Add a viscosity term.","zh":"对吧？我的意思是，问题是你只是在上下做这种奇怪的热运动，而你真正想要的是朝着那个方向前进。因此你会说，你知道吗？你应该把这些搜索方向通过一个低通滤波器或者类似的东西来处理。我的意思是，再次强调，我是在用方言说话。或者如果你学物理的话，你会说，是的，你知道吗，给它加上一些动量或者类似的东西。或者粘性。加上一个粘性项。","start":4473.12,"end":4493.88},{"id":197,"text":"So that you would kind of, then you'd do something that would go right like that and head towards the solution. And those are all methods. We're not going to look at those, but that's kind of the idea. So even this baby example tells us that, oh, but actually we get some really good intuition here. The gradient method works really well when the sublevel sets of your function have low condition number, or they are round.","zh":"这样你就会做些事情，朝着那个方向前进，然后朝向解的方向。这些都是方法。我们不会去研究这些方法，但这就是大致的想法。所以即使这个简单的例子也告诉我们，哦，但实际上我们在这里获得了一些非常好的直觉。梯度法在你的函数的次级等值集具有低条件数，或者它们是圆形的时候，效果非常好。","start":4494.25,"end":4523.3}],"notes":["本段讨论了梯度下降法在特定情况下的表现，特别是当步长选择不当导致算法出现‘锯齿’现象时的情况。讲者指出，当步长γ过大或过小时，算法会表现出极端的不稳定性，这种现象被称为‘zigzagging’。讲者还提到，这种现象在优化领域有特定的名称，如‘Muratos effect’，但更常见的称呼是‘zigzagging’。","讲者通过二维示意图解释了梯度下降法的运作机制，指出负梯度方向与等高线垂直，并且在精确线搜索下，算法会直接朝向最优解。然而，当问题维度较高时，这种二维示意图并不适用，但其提供的直观理解仍然具有价值。","讲者进一步指出，当函数的子水平集具有低条件数或接近圆形时，梯度下降法表现良好。然而，当子水平集的条件数较高时，算法会表现出较差的收敛性，导致‘zigzagging’现象。","讲者提到，为了改善梯度下降法的性能，可以引入低通滤波器、动量项或粘滞项等方法。这些方法通过调整搜索方向，减少算法在优化过程中的震荡，从而提高收敛速度。","讲者强调，虽然这些改进方法在实际应用中非常重要，但本课程不会深入探讨这些方法的具体实现。然而，通过这个简单的例子，学生可以获得关于梯度下降法局限性和改进方向的直观理解。","讲者最后指出，梯度下降法的性能与函数的几何特性密切相关，特别是子水平集的形状和条件数。这些因素决定了算法在实际应用中的收敛速度和稳定性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4343.37,"end":4523.3,"asr_flags":[],"translation_complete":true,"translated_segments":8,"raw_segments":[{"start":4343.37,"text":"Tell me about how well that algorithm's going to work. Like, yeah, very well, like in one step, right? It's going to say, which way should I go? You say steepest descent, which just happens in this case to aim directly at the solution, right? Then you do an exact line search and it's game over. Everybody got that? Okay, so, but now, that makes sense. And in fact, someone who was proposing like, you know, a gradient method would say,"},{"start":4370.93,"text":"Yeah, look how well that works. That's great. Like, why would you not do that? Why would you go in a crazy direction like that, right? But we can actually control the eccentricity by making gamma either really big or really small."},{"start":4388.51,"text":"And in this case, you can actually work out analytically what the iterates are, right? And you get something that looks like this. It's actually a very good picture to have in your mind. Of course, it's totally silly because we don't care about two-dimensional problems. We care about problems with a minimum dimension of 200, 2,000, 20,000, 2 million. But nevertheless..."},{"start":4407.34,"text":"This gives you the picture. So here, this is when it's just slightly eccentric, and these are the level curves, and so the negative gradient is just simply, the gradient, these are orthogonal to the level curves, and it says go in that direction. This is the minimum, because we're doing exact line search, and then it says which way should I go, and you go like that. Everybody?"},{"start":4430.92,"text":"So this has got, people refer to this as zigzagging. We can make it arbitrarily bad, right? We can take gamma equals 1,000, and you'll find out that this thing's basically going like this. And actually, I think there's even a name in Western optimization, it's called the Muratos effect, right? But it's just, the other thing I like is it's just called zigzagging. Everybody got this? So, by the way, you know, when you see this picture, you can kind of..."},{"start":4460.4,"text":"Figure out some things immediately. That would be pretty good, right? So if you're in EE or some of any other field you would say You're kind of going in the right direction on average"},{"start":4473.12,"text":"Right? I mean, the problem is you're just doing this weird thermal thing up and down like this, whereas you want to really kind of be going that way. And so you'd say, you know what? You should run those search directions through a low-pass filter or something. I mean, again, I'm speaking dialect. Or if you do physics, you'd say, yeah, you know, add some momentum to it or something like that. Or viscosity. Add a viscosity term."},{"start":4494.25,"text":"So that you would kind of, then you'd do something that would go right like that and head towards the solution. And those are all methods. We're not going to look at those, but that's kind of the idea. So even this baby example tells us that, oh, but actually we get some really good intuition here. The gradient method works really well when the sublevel sets of your function have low condition number, or they are round."}],"speech_gaps":[],"frame":"../frames/v013/027.webp","frame_time":4355.37},{"title":"线性收敛与线搜索方法","segments":[{"id":198,"text":"Because if they're round, the negative gradient points directly to the solution and you're going to go there quickly. If it has high condition number or if the sublevel sets are weirdly squished out like this, that kind of thing is going to happen. Everybody got that? So that's kind of the picture here.","zh":"因为如果它们是圆形的，负梯度会直接指向解，你会很快到达那里。如果它具有高条件数或者如果子水平集被奇怪地压扁，像这样，就会发生这种情况。大家明白了吗？所以这就是这里的画面。","start":4524.78,"end":4545.46},{"id":199,"text":"That's actually super important observation because we're going to use that. That's actually the segue to basically Thursday's topic, right? So, okay. All right. So here's just some examples. This is a silly function that's non-quadratic. And this happens if you use like a backtracking line search. And here's an exact line search. And you'd look at these two and you'd go like, well, I told you exact line search was way better. But this just shows you kind of the idea.","zh":"这实际上是一个非常重要的观察，因为我们将会用到这一点。这实际上是我们过渡到星期四主题的引子，对吧？所以，好的。好了，这里是一些例子。这是一个非二次的愚蠢函数。这种情况发生在你使用回溯线搜索的时候。这里是精确线搜索。你会看到这两个例子，并会想，好吧，我告诉过你精确线搜索要好得多。但这就展示了这个想法。","start":4547.21,"end":4576.3},{"id":200,"text":"But it shows you that in real examples, you're actually getting this Moratos or zigzagging effect, right? And then we can look at that over here and see what that looks like. So this looks like this, right? And let me explain what this is. These are the iterations, right? This is a log scale telling you actually your sub-optimality, right?","zh":"但它展示了在实际例子中，你实际上会得到这种Moratos或锯齿效应，对吧？然后我们可以在这里查看并看到它是什么样子。看起来像这样，对吧？让我解释一下这是什么。这些是迭代步骤，对吧？这是一个对数刻度，告诉你实际的次优性，对吧？","start":4577.08,"end":4602.66},{"id":201,"text":"And what you can see is all sorts of, you see all sorts of weird things here, right? Like the first thing is that actually between zero and like 100 iterations, for whatever reason, the backtracking line search was doing better. Like, I don't know why, but it was. And this is kind of common, right? So this is what it looks like. The other thing you see is that this kind of gets, this gets kind of linear. And that's referred to as linear convergence. But that's a weird use of linear because","zh":"你可以看到这里有很多奇怪的现象，对吧？比如第一件事是，在零到大约100次迭代之间，无论出于什么原因，回溯线搜索表现得更好。比如，我不知道为什么，但它确实如此。这在某种程度上是常见的，对吧？这就是它的样子。你还会看到的是，这种效果会逐渐变得线性。这被称为线性收敛。但这是一个奇怪的用法，因为","start":4603.62,"end":4629.77},{"id":202,"text":"It's linear on a log or a semi-log plot, right? So it means, because this is a log thing, what linear convergence here means is that each step you do, each iteration, reduces the error by some factor. It's pretty small, frankly, but we can work out what it is, right? If you...","zh":"它在对数或半对数图上是线性的，对吧？这意味着，因为这是一个对数问题，这里的线性收敛意味着每次迭代，你都会将误差减少某个因子。说实话，这个因子相当小，但我们可以通过计算得出它，对吧？如果你……","start":4630.86,"end":4651.7},{"id":203,"text":"if you divided it by, well, let's just say that hit here. So let's take, to go from one to 10 to the minus four, that took you 170 iterations, right? Then that tells you you take 10 to the four and you take that to the one 175th power and that tells you how much your error gets smaller each step, right? So that tells you roughly what it is, right? Okay, so that's called linear convergence.","zh":"如果你把它除以，嗯，让我们这么说，这里有个例子。让我们从1到10的负四次方，这需要你进行170次迭代，对吧？然后这就告诉你，你将10的四次方提升到175次方，这告诉你每一步你的误差会减少多少，对吧？所以这就告诉你大致的情况，对吧？好的，所以这被称为线性收敛。","start":4652.11,"end":4680.31},{"id":204,"text":"Okay, I think maybe what we'll do is, I won't even start the next section, but this is a good place to stop. And we'll continue next time.","zh":"好的，我想也许我们接下来会这么做，我甚至不会开始下一节，但这是一个很好的地方停下来。我们下次继续。","start":4682.28,"end":4693.98}],"notes":["本段讲解了线性收敛的概念，指出线性收敛在对数或半对数图中表现为直线，意味着每次迭代都会以固定比例减少误差。这与函数的条件数和子水平集的形状有关，例如高条件数或子水平集被压缩的情况可能导致收敛变慢。","讲者通过具体例子说明了线搜索方法（如回溯线搜索和精确线搜索）在实际应用中的表现差异。回溯线搜索在某些情况下可能比精确线搜索表现更好，但整体上精确线搜索更优。","讲者提到线性收敛的定义是每次迭代减少误差的固定比例，这可以通过对数图中的斜率来估计。例如，从1到10^-4需要170次迭代，这表明每次迭代的误差减少比例约为10^(-4/170)。","讲者强调线性收敛的术语使用可能让人困惑，因为“线性”在这里指的是对数图中的直线，而不是误差随迭代次数呈线性减少。这种术语的使用需要特别注意。","讲者指出，线性收敛的定义是基于对数图的，因此每次迭代的误差减少比例可以通过计算对数图的斜率来确定。这种分析方法在实际应用中非常重要。","讲者最后提到，线性收敛是优化算法中常见的收敛类型，特别是在处理高条件数问题时，线性收敛的特性可以帮助评估算法的性能。"],"formulas":[{"latex":"e_{k+1} = e_k \\times r","symbols":"e_k: 第k次迭代的误差，r: 每次迭代的误差减少比例","explanation":"公式正确，描述了线性收敛的误差递减关系，适用于迭代算法中误差随迭代次数线性减少的情况。","evidence":"It's linear on a log or a semi-log plot, right? So it means, because this is a log thing, what linear convergence here means is that each step you do, each iteration, reduces the error by some factor. It's pretty small, frankly, but we can work out what it is, right? If you..."}],"uncertainties":["10 to the one 175th power"],"diagram":"none","start":4524.78,"end":4693.98,"asr_flags":[],"math_clarifications":["公式中的误差减少比例r是基于对数尺度的线性收敛特性，即每次迭代将误差乘以一个固定比例因子。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":4524.78,"text":"Because if they're round, the negative gradient points directly to the solution and you're going to go there quickly. If it has high condition number or if the sublevel sets are weirdly squished out like this, that kind of thing is going to happen. Everybody got that? So that's kind of the picture here."},{"start":4547.21,"text":"That's actually super important observation because we're going to use that. That's actually the segue to basically Thursday's topic, right? So, okay. All right. So here's just some examples. This is a silly function that's non-quadratic. And this happens if you use like a backtracking line search. And here's an exact line search. And you'd look at these two and you'd go like, well, I told you exact line search was way better. But this just shows you kind of the idea."},{"start":4577.08,"text":"But it shows you that in real examples, you're actually getting this Moratos or zigzagging effect, right? And then we can look at that over here and see what that looks like. So this looks like this, right? And let me explain what this is. These are the iterations, right? This is a log scale telling you actually your sub-optimality, right?"},{"start":4603.62,"text":"And what you can see is all sorts of, you see all sorts of weird things here, right? Like the first thing is that actually between zero and like 100 iterations, for whatever reason, the backtracking line search was doing better. Like, I don't know why, but it was. And this is kind of common, right? So this is what it looks like. The other thing you see is that this kind of gets, this gets kind of linear. And that's referred to as linear convergence. But that's a weird use of linear because"},{"start":4630.86,"text":"It's linear on a log or a semi-log plot, right? So it means, because this is a log thing, what linear convergence here means is that each step you do, each iteration, reduces the error by some factor. It's pretty small, frankly, but we can work out what it is, right? If you..."},{"start":4652.11,"text":"if you divided it by, well, let's just say that hit here. So let's take, to go from one to 10 to the minus four, that took you 170 iterations, right? Then that tells you you take 10 to the four and you take that to the one 175th power and that tells you how much your error gets smaller each step, right? So that tells you roughly what it is, right? Okay, so that's called linear convergence."},{"start":4682.28,"text":"Okay, I think maybe what we'll do is, I won't even start the next section, but this is a good place to stop. And we'll continue next time."}],"speech_gaps":[],"frame":"../frames/v013/028.webp","frame_time":4536.78}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v013.mp4"}</script><script src="../assets/katex.min.js"></script><script>

function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}

function speakerPair(s){return `<article class="speaker-pair" data-source-id="${s.id}"><span class="lang-label">EN${typeof s.start==='number'?' · '+stamp(s.start):''}</span><p class="speaker-en" lang="en">${esc(s.text)}</p><span class="lang-label">中文</span>${s.zh?`<p class="speaker-zh" lang="zh-CN">${translatedProse(s.zh)}</p>`:'<p class="translation-pending">对应中文全文翻译正在生成。</p>'}</article>`}
function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
