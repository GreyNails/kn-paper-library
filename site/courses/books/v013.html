take on computational linear algebra? Maybe, actually. But certainly you need to be familiar with the ideas. And that's unlike, you don't have to know about computer architecture, even though everything we do is thanks to the people who design and build."},{"id":3,"text":"you know, computers and stuff. So, but this you actually should know. Okay. So back to the numerical linear algebra. And today, actually, we're going to cover material that is like, some of you may know, rest of you probably don't. And it is, I'd listed in the top 10 of the things you need to know from this course, even though it's not technically part of the course. So, okay. So here it is. Last time we talked about, you know, how do you solve a set of equations AX equals B?"},{"id":4,"text":"And, you know, there are several ways. There's ones we're not going to talk about. There are iterative methods to do this, which are used for like super large scale problems. If you've got like a billion variables or if that represents like a PDE you're solving. Right. We're not going to talk about those. We're going to talk about these are what are called direct methods. I don't know where that name came from, but they're called direct. And the way they work is they take the matrix A and they first factor it into a product."},{"id":5,"text":"of matrices, each of which, quote, is easy to invert, unquote. So that's the first step,"},{"id":6,"text":"right? You've seen some of these factorizations, you know, like SVD, eigen decomposition."},{"id":7,"text":"You've probably seen a couple of the others as well. So an easy to invert is actually just,"},{"id":8,"text":"that's dialect for it's easy to solve equations with that coefficient matrix."},{"id":9,"text":"it really means because no one is inverting anything, right?"},{"id":10,"text":"good numerical work for anybody to actually form the inverse of a matrix. There are cases where"}],"notes":["本段主要讲解课程的整体结构，强调通过从底层线性代数逐步构建到高层优化方法，最终目标是让学生能够实现一个线性规划求解器。这不仅是为了让学生理解算法的实现细节，也是为了在将来面对类似问题时能够自信地应对。","讲者指出，线性代数是课程中最重要的一环，所有后续内容都建立在对线性代数的理解之上。虽然学生可能不需要掌握完整的10周计算线性代数课程，但必须熟悉其核心概念。","讲者强调，线性代数的重要性不仅在于其本身，还在于它为后续的优化方法提供了基础。虽然课程内容不涉及计算机架构，但所有计算都依赖于计算机硬件的设计。","本段还提到，今天将讲解直接求解线性方程组的方法，这些方法是数值线性代数的重要组成部分。虽然这些方法可能对部分学生来说是已知的，但对其他人来说可能是新的内容。","讲者指出，直接方法的核心思想是将矩阵分解为易于求解的子矩阵，而不是直接计算矩阵的逆。这种分解方法在实际计算中更为高效和稳定。","讲者强调，在数值计算中，很少有人会显式地计算矩阵的逆，而是通过分解矩阵来求解线性方程组。这种做法不仅提高了计算效率，还减少了数值误差。"],"formulas":[],"uncertainties":["It is unbelievably rare in"],"diagram":"none","start":5.23,"end":183.98,"asr_flags":[],"raw_segments":[{"start":5.23,"text":"Let me, I'll explain where we are sort of in the whole course. In the next maybe two and a half, three weeks, we're actually going to be, we build up and we're going from the bottom up to the top. So this will finish when you'll actually implement your own like solver for an LP solver or something like that. We haven't quite figured out, but you'll, anyway, it'll finish with you implementing like a solver. So you mostly, by the way, just to demystify it."},{"start":34.2,"text":"Right. Just so when someone looks at you sometime in the future and says, oh, my God, you can't write your own LP solver. That's really complicated. And you could say, oh, contraire, I did it. Right. So that's the main thing, the main reason. But also there's interesting stuff. Right now we're at the bottom level, which is linear algebra. And actually, in some ways, it's by far the most important level. And my own feeling is."},{"start":59.74,"text":"Everybody, certainly anybody in this class needs to know this material. Do you need to know a whole 10-week course that you would take on computational linear algebra? Maybe, actually. But certainly you need to be familiar with the ideas. And that's unlike, you don't have to know about computer architecture, even though everything we do is thanks to the people who design and build."},{"start":88.72,"text":"you know, computers and stuff. So, but this you actually should know. Okay. So back to the numerical linear algebra. And today, actually, we're going to cover material that is like, some of you may know, rest of you probably don't. And it is, I'd listed in the top 10 of the things you need to know from this course, even though it's not technically part of the course. So, okay. So here it is. Last time we talked about, you know, how do you solve a set of equations AX equals B?"},{"start":119.01,"text":"And, you know, there are several ways. There's ones we're not going to talk about. There are iterative methods to do this, which are used for like super large scale problems. If you've got like a billion variables or if that represents like a PDE you're solving. Right. We're not going to talk about those. We're going to talk about these are what are called direct methods. I don't know where that name came from, but they're called direct. And the way they work is they take the matrix A and they first factor it into a product."},{"start":147.26,"text":"of matrices, each of which, quote, is easy to invert, unquote. So that's the first step,"},{"start":154.9,"text":"right? You've seen some of these factorizations, you know, like SVD, eigen decomposition."},{"start":159.22,"text":"You've probably seen a couple of the others as well. So an easy to invert is actually just,"},{"start":166.6,"text":"that's dialect for it's easy to solve equations with that coefficient matrix. So that's what it"},{"start":172.86,"text":"it really means because no one is inverting anything, right? It is unbelievably rare in"},{"start":178.32,"text":"good numerical work for anybody to actually form the inverse of a matrix. There are cases where"}],"speech_gaps":[],"frame":"../frames/v013/001.webp","frame_time":17.23},{"title":"矩阵分解与求解线性方程","segments":[{"id":11,"text":"people do, but it's very rare, right? So, okay. So what you do then, once you've factored your"},{"id":12,"text":"matrix into a product of things which are, you know, quote, easy to invert, unquote, you have"},{"id":13,"text":"have to interpret that correctly then you what you do is you then write out you know the inverse"},{"id":14,"text":"and the inverse is the product is is the product of the inverse is in reverse order and then you"},{"id":15,"text":"literally just evaluate this by first evaluating you know a1 inverse b that's one thing and and"},{"id":16,"text":"of course what that means is people write a and a1 inverse b what they really mean is you call this"},{"id":17,"text":"you call solve a1 comma b that's what that that's what it really means so you solve that then you"},{"id":18,"text":"you pass this solution to the next thing?"},{"id":19,"text":"which is A2 inverse times X1. And so you solve A2 X2 equals X1. And that gives you the second one. And you keep going until you get to the end. So again, it's like completely straightforward. Like, okay, like, so what? Last time we talked about some very interesting things, which is that if you want to solve a set of equations with the same coefficient matrix, but different right-hand sides,"},{"id":20,"text":"Then, in fact, what you can do is you factor once and you cache the factorization, and then you simply use the solve method. This is called the solve. The first one is called factor, and this is called solve. So you simply call the solve method on your multiple right-hand sides. And you get to some stunning, you get to surprising conclusions in some cases. I'll get to that in a minute."},{"id":21,"text":"Alright, so this is the one that you probably saw a variation of this, like in high school or something, the first time you saw linear equations, it's called Gaussian elimination, it's called lots of things."},{"id":22,"text":"But here's what it is, if you have a non-singular matrix, you can factor it as a permutation times a lower triangular matrix, it's a lower triangular and u is upper triangular, and they're all invertible."},{"id":23,"text":"Of course, actually, if any one of them weren't, then a would not be, right?"},{"id":24,"text":"it's actually not that difficult, but the cost is order n cubed flops. Okay. So that's what that"},{"id":25,"text":"it's actually not that difficult, but the cost is order n cubed flops. Okay. So that's what that"},{"id":26,"text":"is. And so this is what it looks like to solve linear equations. You factor A, that means you"},{"id":27,"text":"get P, L, and U. Then these three steps, like two, three, four, this is factor, and then this is"},{"id":28,"text":"is solve. So again, all you do is you just solve them in reverse order. Now solving this one,"},{"id":29,"text":"solving the permutator, this is silly. It's just you multiply by p transpose, right? Roughly,"},{"id":30,"text":"right? It's the inverse permutator. You just unpermute them, right? So this is easy. The"},{"id":31,"text":"second one, L is lower triangular. And so for that, you use forward substitution, which we saw"},{"id":32,"text":"as an order n squared alpha."}],"notes":["本段讲解了如何通过矩阵分解来求解线性方程组。当矩阵被分解为易于求逆的因子时，求逆过程可以通过将逆矩阵的乘积按相反顺序计算来实现。例如，若矩阵A分解为A = P L U，那么A的逆可以通过计算U^{-1} L^{-1} P^{-1}来得到。求解线性方程组时，可以先对矩阵进行分解，然后依次求解每个步骤，从而提高效率。","在实际操作中，分解后的矩阵可以通过调用solve方法来求解多个右侧向量。例如，分解矩阵A后，可以使用solve方法对多个右侧向量进行求解，而无需重复分解矩阵。这种方法被称为缓存分解，可以显著减少计算时间。","矩阵分解的计算复杂度为O(n³)，这在实际应用中可能成为瓶颈。然而，分解后的求解过程复杂度较低，通常为O(n²)。因此，分解矩阵的代价虽然较高，但后续求解多个方程组的效率提升是值得的。","在分解矩阵的过程中，如果矩阵A是奇异的，那么分解后的因子P、L、U中至少有一个是奇异的。因此，分解前需要确保矩阵A是非奇异的，否则分解过程无法完成。","对于分解后的矩阵，求解过程分为三个步骤：首先求解置换矩阵P的逆，然后求解下三角矩阵L的逆，最后求解上三角矩阵U的逆。每个步骤的计算方法不同，例如，求解置换矩阵的逆可以通过乘以P的转置来实现。","在实际应用中，求解下三角矩阵L的逆可以通过前向替换（forward substitution）来完成，这种方法的计算复杂度为O(n²)。前向替换是一种高效的算法，适用于下三角矩阵的求解。"],"formulas":[{"latex":"A = P L U","symbols":"A 是原矩阵，P 是置换矩阵，L 是下三角矩阵，U 是上三角矩阵","explanation":"公式正确，表示矩阵 A 可以分解为置换矩阵 P、下三角矩阵 L 和上三角矩阵 U 的乘积。","evidence":"But here's what it is, if you have a non-singular matrix, you can factor it as a permutation times a lower triangular matrix, it's a lower triangular and u is upper triangular, and they're all invertible."},{"latex":"P^{-1} = P^T","symbols":"置换矩阵 P 的逆等于其转置矩阵 P^T","explanation":"公式正确，置换矩阵的逆确实等于其转置矩阵。","evidence":"solving the permutator, this is silly. It's just you multiply by p transpose, right? Roughly, right? It's the inverse permutator. You just unpermute them, right? So this is easy. The"}],"uncertainties":["可能无法准确判断某些术语的完整表达，例如 'solve a1 comma b' 的具体含义。","关于 'order n squared alpha' 的具体含义，可能需要进一步澄清。"],"diagram":"none","start":183.98,"end":363.78,"asr_flags":[],"math_clarifications":["公式 $ A^{-1} = U^{-1} L^{-1} P^{-1} $ 的逆矩阵顺序错误，正确的顺序应为 $ A^{-1} = P^{-1} L^{-1} U^{-1} $。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":183.98,"text":"people do, but it's very rare, right? So, okay. So what you do then, once you've factored your"},{"start":192.58,"text":"matrix into a product of things which are, you know, quote, easy to invert, unquote, you have"},{"start":197.52,"text":"have to interpret that correctly then you what you do is you then write out you know the inverse"},{"start":203.2,"text":"and the inverse is the product is is the product of the inverse is in reverse order and then you"},{"start":208.4,"text":"literally just evaluate this by first evaluating you know a1 inverse b that's one thing and and"},{"start":214.32,"text":"of course what that means is people write a and a1 inverse b what they really mean is you call this"},{"start":218.68,"text":"you call solve a1 comma b that's what that that's what it really means so you solve that then you"},{"start":225.36,"text":"you pass this solution to the next thing?"},{"start":228.03,"text":"which is A2 inverse times X1. And so you solve A2 X2 equals X1. And that gives you the second one. And you keep going until you get to the end. So again, it's like completely straightforward. Like, okay, like, so what? Last time we talked about some very interesting things, which is that if you want to solve a set of equations with the same coefficient matrix, but different right-hand sides,"},{"start":257.7,"text":"Then, in fact, what you can do is you factor once and you cache the factorization, and then you simply use the solve method. This is called the solve. The first one is called factor, and this is called solve. So you simply call the solve method on your multiple right-hand sides. And you get to some stunning, you get to surprising conclusions in some cases. I'll get to that in a minute."},{"start":285.82,"text":"Alright, so this is the one that you probably saw a variation of this, like in high school or something, the first time you saw linear equations, it's called Gaussian elimination, it's called lots of things."},{"start":296.92,"text":"But here's what it is, if you have a non-singular matrix, you can factor it as a permutation times a lower triangular matrix, it's a lower triangular and u is upper triangular, and they're all invertible."},{"start":310.6,"text":"Of course, actually, if any one of them weren't, then a would not be, right?"},{"start":313.56,"text":"Right. So the cost of that factorization, which we're not going to go into how that's done,"},{"start":319.98,"text":"it's actually not that difficult, but the cost is order n cubed flops. Okay. So that's what that"},{"start":327.04,"text":"is. And so this is what it looks like to solve linear equations. You factor A, that means you"},{"start":334.44,"text":"get P, L, and U. Then these three steps, like two, three, four, this is factor, and then this is"},{"start":340.84,"text":"is solve. So again, all you do is you just solve them in reverse order. Now solving this one,"},{"start":348.06,"text":"solving the permutator, this is silly. It's just you multiply by p transpose, right? Roughly,"},{"start":352.52,"text":"right? It's the inverse permutator. You just unpermute them, right? So this is easy. The"},{"start":357.74,"text":"second one, L is lower triangular. And so for that, you use forward substitution, which we saw"},{"start":362.58,"text":"as an order n squared alpha."}],"speech_gaps":[],"frame":"../frames/v013/002.webp","frame_time":195.98},{"title":"后向替换与求解复杂度","segments":[{"id":33,"text":"Backward substitution is when you have U, because U is upper triangular. And you start, if you'll recall, by first solving for the last entry, then the second last, then the third last, and so on. That's backward substitution. And that's also N squared flops. And if you add these up, what you find out is something kind of weird."},{"id":34,"text":"It's that the factor is order n cubed and the solve is order n squared. And so I think last time I finished by asking you a question, which is like, how long does it take to solve, I don't know, on my laptop, a set of linear equations with, you know, let's say a thousand by thousand matrix, right? Which I could make sound pretty impressive, right? I could say, you know, my problem has more than a million coefficients in it, which is true. Thousand by thousand matrix does."},{"id":35,"text":"And then you could say, you know, the n cubed, the factorization is order n cubed. You know, that's like a billion flops, right? Of course, that's a joke now, right? And the answer is, like, I can do that in 100 milliseconds. Okay? So can you. My phone can do it in something on that order magnitude, right? So, which is actually kind of stunning. I think then I asked the following question. I asked..."},{"id":36,"text":"How long does it take you, if it takes 100 milliseconds to solve, let's say, one set of 1,000 by 1,000 equations, right? 1,000 equations, 1,000 unknowns. How long does it take to solve 10? For that matter, you know, even 100. How long does it take? If it takes a tenth of a second to do one, the answer is surprising. It's this. It's a tenth of a second. Everybody got that?"},{"id":37,"text":"So not that many people appreciate this, right, or understand this. And this is actually, this is used throughout a lot of numerical stuff. A lot of it, well, you use it all the time, you just don't know it. So all the solvers that you use when you call CVXPy, almost all of them, will use things like this, right? So the most typical methods to solve things like SOCPs, STPs, these things, or for that matter, even LPs, involve..."},{"id":38,"text":"Other people. Yeah. Is no is no one else impressed or like shouldn't you be? I mean, I'm maybe it's maybe too early, but people should be going like, that's awesome. Like, really? But I'm not getting that feeling. But that's OK. That's fine. OK, good. But there we go. All right. Now, sparse LU factorization. This is super interesting. This is something everybody should know about."},{"id":39,"text":"Other people. Yeah. Is no is no one else impressed or like shouldn't you be? I mean, I'm maybe it's maybe too early, but people should be going like, that's awesome. Like, really? But I'm not getting that feeling. But that's OK. That's fine. OK, good. But there we go. All right. Now, sparse LU factorization. This is super interesting. This is something everybody should know about."}],"notes":["本段主要讨论了后向替换的计算复杂度，以及求解线性方程组时的计算时间。教授提到，对于一个1000x1000的矩阵，虽然理论上需要进行n³次浮点运算，但实际上现代计算机可以在100毫秒内完成，这表明实际计算效率远高于理论估计。教授还通过提问的方式，引导学生思考如何利用已有的因子化结果来求解多个不同右侧向量的线性方程组，强调了这种技术在实际应用中的重要性。","教授进一步指出，虽然求解一个线性方程组需要n³次运算，但求解多个方程组时，由于因子化只需进行一次，因此总计算量主要由因子化决定，而求解部分的复杂度仅为n²。这种优化在实际计算中非常关键，尤其是在使用如CVXPy等工具时，这些方法通常会利用这种技术来提高效率。","教授还提到，对于1000x1000的矩阵，即使需要求解10个不同的方程组，计算时间仍然只需要100毫秒，这表明现代计算机的计算能力远超传统估计。这种高效性在数值计算和优化问题中具有广泛的应用，例如在求解SOCP、STP、LP等问题时，通常会使用类似的求解策略。","教授最后提到，稀疏LU分解是一种非常重要的技术，它在处理大规模稀疏矩阵时具有显著的优势。稀疏矩阵的分解可以显著减少计算量，因此是数值计算和优化算法中的核心内容。教授强调，这种技术是所有现代求解器的基础，值得所有学习者掌握。","教授通过提问的方式，引导学生思考如何利用已有的因子化结果来求解多个不同右侧向量的线性方程组，强调了这种技术在实际应用中的重要性。这种技术在数值计算和优化问题中具有广泛的应用，例如在求解SOCP、STP、LP等问题时，通常会使用类似的求解策略。","教授还提到，虽然求解一个线性方程组需要n³次运算，但求解多个方程组时，由于因子化只需进行一次，因此总计算量主要由因子化决定，而求解部分的复杂度仅为n²。这种优化在实际计算中非常关键，尤其是在使用如CVXPy等工具时，这些方法通常会利用这种技术来提高效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":365.39,"end":541.25,"asr_flags":[],"raw_segments":[{"start":365.39,"text":"Backward substitution is when you have U, because U is upper triangular. An hings, or for that matter, even LPs, involve..."},{"start":487.26,"text":"two solves right and that's done in the same basically the factorization dominates and and that's that's the that's the point there okay so all right actually i'm just curious how many people have seen this before how many people knew that you could solve 10 equations with a thousand variables thousand unknowns same coefficient matrix different right hand sides uh you could do that you could solve 10 and the amount of time it takes you to solve one you knew come on"},{"start":515.67,"text":"Other people. Yeah. Is no is no one else impressed or like shouldn't you be? I mean, I'm maybe it's maybe too early, but people should be going like, that's awesome. Like, really? But I'm not getting that feeling. But that's OK. That's fine. OK, good. But there we go. All right. Now, sparse LU factorization. This is super interesting. This is something everybody should know about."}],"speech_gaps":[],"frame":"../frames/v013/003.webp","frame_time":377.39},{"title":"稀疏矩阵的存储与分解","segments":[{"id":40,"text":"Right, so um, there's since I guess it's been developed since about the 1960s is uh basically stuff on sparse matrices right, and so everything you know, first of all, you know how do you what are the data structures used to store them and then basically there's a whole parallel universe of doing all the stuff you would do with so-called dense matrices which are just stored as arrays."},{"id":41,"text":"How do you do this for sparse matrices? Including factorizations, back solves, all these kinds of things. Everything you can do. Eigen decompositions, singular value decompositions. There's a whole field where people have made this efficient for sparse matrices. And this is something like..."},{"id":42,"text":"everybody needs to know about, like everyone, because if you do any kind of computation, you need to know about this, right? Because there will be, again, there will be surprising statements we'll make about what you can solve and not solve. Okay, so if A is sparse, the typical factorization is going to have four factors. It's going to have a P1 is a permutation in front."},{"id":43,"text":"P2 is a permutation in back, and then L and U are the lower triangular and upper triangular. So the idea here is, mathematically, you don't need P2. You do need P1. It is false that any non-singular matrix can be factored as LU."},{"id":44,"text":"You do need that initial permutation, but you don't need that second one. So the second one is there, and by the way, P1 is also there, so that when you carry out this LU factorization..."},{"id":45,"text":"L and U will also be sparse. Because if you do this, if you're not careful about doing this, your matrix A will be sparse, but L and U will be dense. When that happens, it's referred to as you have fill-in. You have lots of entries in L and U that weren't there in A. And this is very important for everybody to know. Here would be an example. It's extremely common to work all the time with, let's say,"},{"id":46,"text":"you know, a million by million sparse matrix. It is simply not a problem, right? I can do stuff like that on my laptop, right? You know, the number of non-zeros is not going to be..."},{"id":47,"text":"10 to the 12, which would be a dense one, you know, it's going to be something reasonable. Like, I don't know, it's got 50, you know, 20, 30, a hundred non-zeros per row. Even that is not that big a deal because it's a hundred million and it's a hundred million coefficients. If there's a, if there's a hundred non-zeros per row and you multiply that by about 10. So even in doubles, it's like a gig, which is just like"}],"notes":["本段介绍了稀疏矩阵的存储结构和与稠密矩阵的对比，强调了稀疏矩阵在计算中的重要性。讲者提到稀疏矩阵的存储方式与稠密矩阵不同，需要专门的数据结构来处理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":541.63,"end":704.03,"asr_flags":[],"raw_segments":[{"start":541.63,"text":"right so um there's since i guess it's been developed since about the 1960s is uh basically stuff on sparse matrices right and so everything you know first of all you know how do you what are the data structures used to store them and then basically there's a whole parallel universe of doing all the stuff you would do with so-called dense matrices which are just stored as arrays"},{"start":563.53,"text":"How do you do this for sparse matrices? Including factorizations, back solves, all these kinds of things. Everything you can do. Eigen decompositions, singular value decompositions. There's a whole field where people have made this efficient for sparse matrices. And this is something like..."},{"start":581.34,"text":"everybody needs to know about, like everyone, because if you do any kind of computation, you need to know about this, right? Because there will be, again, there will be surprising statements we'll make about what you can solve and not solve. Okay, so if A is sparse, the typical factorization is going to have four factors. It's going to have a P1 is a permutation in front."},{"start":607.25,"text":"P2 is a permutation in back, and then L and U are the lower triangular and upper triangular. So the idea here is, mathematically, you don't need P2. You do need P1. It is false that any non-singular matrix can be factored as LU."},{"start":629.54,"text":"You do need that initial permutation, but you don't need that second one. So the second one is there, and by the way, P1 is also there, so that when you carry out this LU factorization..."},{"start":643.37,"text":"L and U will also be sparse. Because if you do this, if you're not careful about doing this, your matrix A will be sparse, but L and U will be dense. When that happens, it's referred to as you have fill-in. You have lots of entries in L and U that weren't there in A. And this is very important for everybody to know. Here would be an example. It's extremely common to work all the time with, let's say,"},{"start":671.96,"text":"you know, a million by million sparse matrix. It is simply not a problem, right? I can do stuff like that on my laptop, right? You know, the number of non-zeros is not going to be..."},{"start":684.63,"text":"10 to the 12, which would be a dense one, you know, it's going to be something reasonable. Like, I don't know, it's got 50, you know, 20, 30, a hundred non-zeros per row. Even that is not that big a deal because it's a hundred million and it's a hundred million coefficients. If there's a, if there's a hundred non-zeros per row and you multiply that by about 10. So even in doubles, it's like a gig, which is just like"}],"speech_gaps":[],"frame":"../frames/v013/004.webp","frame_time":553.63},{"title":"稀疏矩阵与带状矩阵的存储与分解","segments":[{"id":48,"text":"It's a reasonably small amount of memory. Okay. So anyway, so what happens is if you have your million by million matrix and you call a solver like this, if you choose P1 and P2 poorly, then what will happen is like L will be like a dense lower triangular matrix, right? You can't even store it because it's a million by million, right? So it's 10 to the 12 divided by two things. I mean, you can't. Let's just leave it that way. Okay."},{"id":49,"text":"Making sense? So the P1 and P2 are chosen heuristically. And people have been doing this since the 60s. It's actually very cool. You can ask questions like, oh, find me the P1 and P2 that minimize the number of non-zeros in L and U. That's a perfectly nice problem to come up with. And it is NP-hard. But who cares? It's silly. There are unbelievably good heuristics for doing this, right?"},{"id":50,"text":"that all of us benefit from. So this is great. Okay. And so what happens with sparse matrices is the factor and solve times, whatever they are, they are less than two-thirds n cubed. And I'm going to give you a very important special case right now, and then we'll encounter others, right? So here's a super important special case. It's a so-called banded matrix."},{"id":51,"text":"So a banded matrix looks like this. Well, of course, there's just a band here like this. You know, maybe this is k entries wide, right? And basically, this is non-zero. And everything out here is that zero and that zero. So that's a banded matrix, right? So I can store a banded matrix on my laptop easily if it's a million by million. And the bandwidth is, let's say, 10 or 20, right? So everybody, so that's a banded matrix."},{"id":52,"text":"Nope, that's fine. So it turns out when you, here, well, this is a case where you don't need P1 and P2, right? But if you simply do the LU factorization here, the L and the U are going to be basically the same. They're also going to be banded. So I'll just write down L. L is lower triangular. So, whoops, this goes down to there, right? And then it simply looks like that."},{"id":53,"text":"That's k over 2. And this is what L looks like. And you look similarly, right?"},{"id":54,"text":"So, by the way, sometimes a banded matrix comes to you looking like that, but sometimes it's been permuted by the app, by whoever formed the problem. They decide, well, I'm going to list all my states first, then all my controls, then all this in an optimal control problem. And then it comes out with some crazy sparsity pattern. And any method would be able, any methods used to heuristically choose P1 and P2 will permute it to look banded."}],"notes":["本段讲解了稀疏矩阵的存储与分解问题，特别是当矩阵规模很大时，如果选择的P1和P2不合适，会导致存储困难。稀疏矩阵的分解时间复杂度低于n³的三分之二，这在实际应用中非常重要。","带状矩阵是一种特殊的稀疏矩阵，其非零元素集中在主对角线附近，形成一个带状结构。带状矩阵的存储和分解效率非常高，即使在百万阶矩阵的情况下，只要带宽较小，也能轻松存储。","带状矩阵的LU分解结果仍然是带状的，因此不需要进行复杂的置换操作。然而，实际应用中，矩阵可能由于问题结构而呈现出复杂的稀疏模式，此时需要通过置换操作将其转化为带状形式。","P1和P2的选择是启发式的，虽然寻找最优的P1和P2是一个NP难问题，但存在非常有效的启发式方法。这些方法在实际中被广泛应用，使得稀疏矩阵的处理成为可能。","带状矩阵的带宽k决定了其存储和计算效率，较小的带宽意味着更高效的存储和更快的计算。因此，在设计问题时，应尽量使矩阵呈现带状结构。","带状矩阵的分解和存储是稀疏矩阵处理中的一个重要特例，它展示了如何通过结构化矩阵的特性来优化计算资源的使用。"],"formulas":[{"latex":"O(n^3)","symbols":"时间复杂度","explanation":"保持原公式，时间复杂度O(n^3)是正确的，适用于稀疏矩阵的因子和求解时间的描述。","evidence":"that all of us benefit from. So this is great. Okay. And so what happens w d solve times, whatever they are, they are less than two-thirds n cubed. And I'm going to give you a very important special case right now, and then we'll encounter others, right? So here's a super important special case. It's a so-called banded matrix."},{"start":793.6,"text":"So a banded matrix looks like this. Well, of course, there's just a band here like this. You know, maybe this is k entries wide, right? And basically, this is non-zero. And everything out here is that zero and that zero. So that's a banded matrix, right? So I can store a banded matrix on my laptop easily if it's a million by million. And the bandwidth is, let's say, 10 or 20, right? So everybody, so that's a banded matrix."},{"start":823.11,"text":"Nope, that's fine. So it turns out when you, here, well, this is a case where you don't need P1 and P2, right? But if you simply do the LU factorization here, the L and the U are going to be basically the same. They're also going to be banded. So I'll just write down L. L is lower triangular. So, whoops, this goes down to there, right? And then it simply looks like that."},{"start":848.93,"text":"That's k over 2. And this is what L looks like. And you look similarly, right?"},{"start":855.85,"text":"So, by the way, sometimes a banded matrix comes to you looking like that, but sometimes it's been permuted by the app, by whoever formed the problem. They decide, well, I'm going to list all my states first, then all my controls, then all this in an optimal control problem. And then it comes out with some crazy sparsity pattern. And any method would be able, any methods used to heuristically choose P1 and P2 will permute it to look banded."}],"speech_gaps":[],"frame":"../frames/v013/005.webp","frame_time":716.61},{"title":"带状矩阵的分解与求解","segments":[{"id":55,"text":"Okay, so what happens in a banded factorization is, first of all, the factorization time is n k squared. And then the back solve is n k. So these are stunningly smaller than n cubed and n squared. So what this tells you is you can solve a million by million equations if the bandwidth is 10."},{"id":56,"text":"Like super easily, and it's going to be so fast it's not even funny. Everybody following this? Which is kind of shocking, right? Because someone said, what are you doing? You say, I'm solving a set of a million equations for a million variables. Each equation involves 10 of the variables. You're like, whoa, that sounds like it's hard. Right? The answer is, it's unbelievable. This is a millisecond operation. Everyone follow? It's just, this is completely insane."},{"id":57,"text":"But this is things you absolutely need to know this, right? Because this is the trick to many, many things. Okay. So what's, you know, by the way, what's interesting here is the factor solve ratio is not that high anymore. Now it's K. It used to be N. And so that says, if I say, how long does it take to solve a million by million equations banded with a bandwidth of 10? It's some number, which is shockingly small. Then you say, how about 10 of them?"},{"id":58,"text":"Okay, how about two of them? And you say it's only a little tiny bit more. Everybody following this? Okay, so by the way, what you'll be doing in the next week, two weeks, is you will start to recognize matrix structure, like sparsity. You're going to see some others later today, like block arrow and weird other ones. And you will start recognizing them. They're super important because two things. Number one,"},{"id":59,"text":"you'll start recognizing structures that you can exploit to solve extremely fast. That's number one. But number two, on the other end, you're going to start recognizing practical problems that will result in matrices with that structure. I'm going to mention one right now. All of control. All of signal processing. Just looks like that. Every last bit of it."},{"id":60,"text":"That means if I ask you to, you've solved problems, you know, little control problems and things like that. But what this says is, if someone says, I have to compute, I have to solve a control problem with, you know, 20,000 time steps and a state dimension of 20 and 10 actuators, and someone say, wow, that sounds like it's going to be complicated. You just laugh and say, are you kidding?"}],"notes":["本段讲解了带状矩阵分解的计算复杂度，指出带状矩阵的分解时间复杂度为n k²，回代时间为n k，远低于常规的n³和n²复杂度。这表明即使对于百万阶的方程组，只要带宽k较小，求解过程将非常高效。","讲者通过举例说明带状矩阵的求解速度之快，甚至可以达到毫秒级。这表明带状矩阵的结构使得大规模问题的求解变得容易，与直觉上认为的困难形成鲜明对比。","讲者提到带状矩阵的求解比一般矩阵的求解快得多，因为其结构使得计算复杂度显著降低。这说明在实际应用中，识别并利用矩阵的结构可以极大提升计算效率。","讲者指出，接下来的学习内容将涉及识别矩阵的结构，如稀疏性、块箭头结构等。这些结构在控制和信号处理等领域中非常常见，因此识别这些结构对于实际问题的求解至关重要。","讲者通过一个具体的例子说明带状矩阵在控制问题中的应用，指出即使对于大规模的控制问题，只要矩阵具有带状结构，求解过程将变得非常高效。","讲者强调，识别矩阵结构并利用其特性是解决实际问题的关键，这不仅有助于提高计算效率，还能帮助理解实际问题的数学本质。"],"formulas":[],"uncertainties":[],"diagram":"none","start":881.45,"end":1040.56,"asr_flags":[],"raw_segments":[{"start":881.45,"text":"Okay, so what happens in a banded factorization is, first of all, the factorization time is n k squared. And then the back solve is n k. So these are stunningly smaller than n cubed and n squared. So what this tells you is you can solve a million by million equations if the bandwidth is 10."},{"start":912.23,"text":"Like super easily, and it's going to be so fast it's not even funny. Everybody following this? Which is kind of shocking, right? Because someone said, what are you doing? You say, I'm solving a set of a million equations for a million variables. Each equation involves 10 of the variables. You're like, whoa, that sounds like it's hard. Right? The answer is, it's unbelievable. This is a millisecond operation. Everyone follow? It's just, this is completely insane."},{"start":937.23,"text":"But this is things you absolutely need to know this, right? Because this is the trick to many, many things. Okay. So what's, you know, by the way, what's interesting here is the factor solve ratio is not that high anymore. Now it's K. It used to be N. And so that says, if I say, how long does it take to solve a million by million equations banded with a bandwidth of 10? It's some number, which is shockingly small. Then you say, how about 10 of them?"},{"start":964.25,"text":"Okay, how about two of them? And you say it's only a little tiny bit more. Everybody following this? Okay, so by the way, what you'll be doing in the next week, two weeks, is you will start to recognize matrix structure, like sparsity. You're going to see some others later today, like block arrow and weird other ones. And you will start recognizing them. They're super important because two things. Number one,"},{"start":991.82,"text":"you'll start recognizing structures that you can exploit to solve extremely fast. That's number one. But number two, on the other end, you're going to start recognizing practical problems that will result in matrices with that structure. I'm going to mention one right now. All of control. All of signal processing. Just looks like that. Every last bit of it."},{"start":1018.39,"text":"That means if I ask you to, you've solved problems, you know, little control problems and things like that. But what this says is, if someone says, I have to compute, I have to solve a control problem with, you know, 20,000 time steps and a state dimension of 20 and 10 actuators, and someone say, wow, that sounds like it's going to be complicated. You just laugh and say, are you kidding?"}],"speech_gaps":[],"frame":"../frames/v013/006.webp","frame_time":893.45},{"title":"Cholesky分解及其在凸优化中的应用","segments":[{"id":61,"text":"Like, I can do that on my phone. And, of course, that's the key to, you know, actually putting these things into a lot of control systems, right? So a lot of them actually do this. Okay. That's the big picture. So this is just, like, super cool to know about. Okay. This brings us to a very famous factorization. It's about 100 years old. It's the Cholesky factorization."},{"id":62,"text":"So if you have a positive definite matrix, you can write it as just LL transpose. And if you insist that the entries of the diagonal entries of L are positive, then it's unique."},{"id":63,"text":"So there's no choice. There's just one factorization, period. That's it. There's one way to write A as LL transpose. And how do you solve, you know, how do you solve AX equals B where A is positive definite? That's called a positive definite system of equations, right? So how do you do that? You do a Cholesky factorization and you do a forward and a backward substitution with L and L transpose."},{"id":64,"text":"Okay. So, so that's, that's it. And, you know, actually it's one third n cubed as opposed to two n cubed for general matrices. And, you know, that kind of makes sense. I mean, first, number one, no one cares about a factor of two in a flop count estimate because these are so crude, right? What really matters is like the people who actually wrote the micro code and all that kind of stuff. And how's it blocked? And how many cores is it using? All sorts of crazy stuff internal that we don't have to, most of us don't, all of us, I'm guessing should not."},{"id":65,"text":"and do not have to worry about, right? But we should also all be very grateful that there are people who do, right? So yeah, so there it's a factor of two, which is not unsurprising, it's symmetric. So roughly speaking, there's a redundancy of two. Or you can even look at this and say, hey, that's an LU factorization with U equals L. And you know why? Because the matrix is symmetric, that's why, right? So it's not, anyway, not too surprising."},{"id":66,"text":"We will see very shortly where positive definite systems of equations arise. Actually, they arise by themselves in a lot of applications. But specifically in convex optimization, we'll see they're at the heart of a lot of stuff. And now we get the sparse Cholesky factorization. And here I'll tell you something super interesting about it, I think. So here, it turns out..."},{"id":67,"text":"This is basically the same as calling a Cholesky factorization on P transpose AP, right? Because take that equation, just multiplying the left by P transpose on the right by P. So what it basically says is permute your matrix, your positive definite matrix, and then do a Cholesky factorization where there is no creativity. It's just, there's a unique Cholesky factorization. Everybody got this?"}],"notes":["本段讲解了Cholesky分解的基本概念，即对于正定矩阵，可以唯一地分解为LL^T的形式，其中L是一个下三角矩阵且对角线元素为正。这种分解在求解正定线性方程组时非常有用，可以通过Cholesky分解后进行前向和后向替换来求解。","Cholesky分解的计算复杂度为O(n³/3)，比一般矩阵的O(n³)要低，这主要是因为正定矩阵的对称性减少了计算冗余。虽然实际计算中还有许多细节如并行处理和微码优化，但这种复杂度的差异在理论分析中是重要的。","由于正定矩阵的对称性，Cholesky分解可以看作是一种特殊的LU分解，其中U等于L。这种对称性使得分解过程更加高效且唯一。","在凸优化中，正定系统方程是许多算法的核心，例如在求解二次规划问题时，Cholesky分解被广泛用于处理Hessian矩阵的分解。此外，稀疏Cholesky分解在处理大规模稀疏矩阵时具有重要应用。","Cholesky分解的唯一性保证了其在数值计算中的稳定性，这对于求解线性方程组和优化问题至关重要。同时，通过置换矩阵P，可以对原矩阵进行重新排列，从而进一步优化分解过程。","本段还提到，虽然Cholesky分解的计算复杂度在理论上较低，但实际应用中仍需考虑许多实现细节，如并行计算和硬件优化，这些细节通常由底层开发者处理，而用户只需关注算法的理论性质。"],"formulas":[{"latex":"A = LL^\\text{T}","symbols":"A 是正定矩阵，L 是下三角矩阵，其对角线元素为正","explanation":"公式正确，表示正定矩阵 A 可以分解为下三角矩阵 L 与其转置的乘积，且 L 的对角线元素为正。","evidence":"So there's no choice. There's just one factorization, period. That's it. There's one way to write A as LL transpose. And how do you solve, you know, how do you solve AX equals B where A is positive definite? That's called a positive definite system of equations, right? So how do you do that? You do a Cholesky factorization and you do a forward and a backward substitution with L and L transpose."},{"latex":"AX = B","symbols":"正定系统方程，其中 A 是正定矩阵，X 和 B 是未知向量","explanation":"公式正确，表示正定矩阵 A 与向量 X 的乘积等于向量 B，这是正定系统方程的标准形式。","evidence":"So there's no choice. There's just one factorization, period. That's it. There's one way to write A as LL transpose. And how do you solve, you know, how do you solve AX equals B where A is positive definite? That's called a positive definite system of equations, right? So how do you do that? You do a Cholesky factorization and you do a forward and a backward substitut 'm not going to allocate that amount of memory, no. So everybody got this? Okay, so now it turns out all you need to do with this is permute the first and last columns."},{"start":1318.05,"text":"and first and last rows and columns, and then you end up with this matrix, and that, that's called a, you know, like a, I don't know, it's a whatever, that's called an arrow structure, right? We'll get to others, but anyway, that's one. Okay, if I do a Cholesky factorization on this, I will show you the sparsity pattern you get. You get this, and that's all, okay? So..."},{"start":1346.6,"text":"What it means is, you know, it means that the permutation that permuted this into this was super important, at least from a sparsity point of view. Okay, everybody got it? So what this means is, if you had that set of equations to solve, actually, if you just called a sparse solver on your behalf, you wouldn't even know it, but the permutation would change it to this, factor that, and then your factor time is going to be order n."}],"speech_gaps":[],"frame":"../frames/v013/008.webp","frame_time":1222.27},{"title":"求解器的运行时间与符号计算","segments":[{"id":74,"text":"And your solve time will be order end, right? So everybody following this? So that's it. So this is, fortunately for a lot of those things, you don't have to worry about it. That's all based inside. All of you have benefited from this probably a million times just so far in this class. Because every time CVXPy calls a solver."},{"id":75,"text":"This is what's happening. This is the kind of stuff that's happening on your behalf many, many times every time you call solve on something. Okay? So it doesn't matter. I mean, but just now you know. Okay. Does this make sense? Yeah. How much time does it take for a solver to find that P? That's a..."},{"id":76,"text":"Maybe that's a perfect question. I should have said it. So the question is how long, you know, so yeah, if I, if I say, oh man, are you kidding? I can do this for you. Not a 应用，如嵌入式系统或控制系统，可能需要更优化的排列以提高效率。","在控制系统中，如果求解器需要在任务期间频繁运行（如火箭控制），则优化排列可能值得投入更多时间。然而，大多数数值计算人员通常使用快速启发式方法，而不是花费大量时间优化排列。","符号计算阶段有时被称为符号求解或排列阶段，涉及图计算等操作，而数值分解阶段则涉及浮点运算，标志着实际的数值计算开始。","这些内容帮助学生理解求解器内部的工作机制，以及如何优化计算过程，特别是在实际应用中如何权衡计算时间和效率。","通过这些讲解，学生可以更好地理解数值计算中的符号和数值阶段的区别，以及如何在实际问题中应用这些知识。"],"formulas":[],"uncertainties":["order end"],"diagram":"none","start":1375.55,"end":1534.37,"asr_flags":[],"raw_segments":[{"start":1375.55,"text":"And your solve time will be order end, right? So everybody following this? So that's it. So this is, fortunately for a lot of those things, you don't have to worry about it. That's all based inside. All of you have benefited from this probably a million times just so far in this class. Because every time CVXPy calls a solver."},{"start":1396.75,"text":"This is what's happening. This is the kind of stuff that's happening on your behalf many, many times every time you call solve on something. Okay? So it doesn't matter. I mean, but just now you know. Okay. Does this make sense? Yeah. How much time does it take for a solver to find that P? That's a..."},{"start":1416.73,"text":"Maybe that's a perfect question. I should have said it. So the question is how long, you know, so yeah, if I, if I say, oh man, are you kidding? I can do this for you. Not a problem. I'm going to find a permutation like that. And then I can solve this in 10th of a second. And you go, cool. How long did it take you to find the permutation? You go a couple of days, you know, it's just not. Yeah. So the general rule of thumb is people use heuristics for finding P that are, they hope on the order of magnitude."},{"start":1446.11,"text":"of the amount of time it takes to actually do the numerical factorization. So that's what they do. Now there are applications where people will run, they'll take more time to actually work out a better permutation because they're going to use this a gazillion times. So this would be the case for embedded systems, like for control."},{"start":1468.28,"text":"So if you're doing control and you're going to put this into, let's say, a rocket or something like that, and you know it's going to run at 100 hertz for the entire mission or whatever it is, that's a lot of time."},{"start":1482.5,"text":"It's worth, you can take it, you could definitely take an evening to come up with a better permutation. But this is not what most people doing numeric, most people doing numeric, who work on the, you know, solution of sparse linear equations, don't do that. They just stick with heuristics that are fast. And by the way, that portion is called the symbolic, sometimes they call that the symbolic solve, or the permutation phase. There's lots of names for it."},{"start":1508.25,"text":"Right? And you can tell if you actually, if you do things like, if you actually look at it to see what it's actually doing, you will find out that it's spending a whole bunch of time and it's doing graph calculations. There's no floating point numbers involved. Okay? Then when floating point number operations start up, that means you're actually doing the numerical factorization. That's a good question. Okay."}],"speech_gaps":[],"frame":"../frames/v013/009.webp","frame_time":1387.55},{"title":"稀疏矩阵的Cholesky分解与图论","segments":[{"id":81,"text":"So I know I'm not able to, I mean, I realize for many of you, if this is the first time you've seen it, that's fine. You should just get the high level picture of it. And you could read this a little bit more in the appendix in the book. There's an appendix on this. And this is just something you should know about. So I don't know, sci-fi, you could poke around in sci-fi or something. Once you know about this, you can't unknow about it. And it's kind of, you will have like incredible powers. Yes."},{"id":82,"text":"Well, yeah, they do. So some are kind of greedy. I'd have to tell you actually how you actually do the factorization to actually explain the heuristics. But a lot of them are just constructed one by one. What they do is they say, p is going to permute something to the top row. And they'd say, I'm going to find which entry I should permute to the top."},{"id":83,"text":"then who gets permuted to the second top, then third top and fourth top, things like that. But that's greedy. But that's the kind of things people use. And they have lots of names, and it's worth knowing a little bit about them. Yeah? Sorry for finding the best one, but are there, like, approximation guarantees? No, there's no approximation guarantees whatsoever. No. Right, so, yeah, no one has... Yeah, so, yeah, it's one of those things where, you know, we can ask, of course..."},{"id":84,"text":"Right, so that, if you know what a chordal graph is, that's one of them. That's actually kind of useless, frankly, in practice, because the real question is not whether there exists one, the question is whether our heuristics find it. And the answer is, all decent heuristics will find that one."},{"id":85,"text":"Right, so that, if you know what a chordal graph is, that's one of them. That's actually kind of useless, frankly, in practice, because the real question is not whether there exists one, the question is whether our heuristics find it. And the answer is, all decent heuristics will find that one. So, yeah. Do these factorizations have required that we know the matrix is non-singular, that it's positively definite? No, so it turns out most of the, so in this one,"},{"id":86,"text":"To find the permutation for Cholesky factorization, you actually don't have to know the entries in A. You simply have to know their locations. That's actually a super important, more advanced, but you..."},{"id":87,"text":"You brought it up. So what this means is we can do this ahead of time. So for example, if we're solving an optimal control problem or something like that, we can do the permutation once and for all offline. And then when this thing is actually running a jet engine or something like that, then we don't have to do it. If we're doing finance and we want to do an insanely fast back test, we would first do the factorization. And then after that, every solve is going to be really fast."}],"notes":["本段讲解了稀疏矩阵Cholesky分解中关于图论的应用。当矩阵A的稀疏模式对应的图是弦图（chordal graph）时，存在一种排列方式，使得分解过程中不会引入新的非零元素（zero fill-in），即分解后的下三角矩阵L的非零元素数量等于原矩阵A的非零元素数量的一半。然而，这种理论在实际应用中价值有限，因为关键问题在于启发式方法是否能找到这种排列方式，而所有合理的启发式方法都能找到它。","本段还提到，进行Cholesky分解时，不需要知道矩阵A的具体元素值，只需要知道它们的位置。这在实际应用中非常重要，因为可以提前进行排列，从而在后续的求解过程中节省计算时间。","在实际应用中，例如最优控制问题或金融回测，可以提前进行Cholesky分解的排列，从而在运行时（如飞机引擎运行或金融回测）节省计算资源。这种预处理步骤在需要快速求解的场景中非常有用。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1535.03,"end":1710.11,"asr_flags":[],"math_clarifications":["该公式错误地假设了Cholesky分解后下三角矩阵L的非零元素数量与原矩阵A的非零元素数量之间的关系，这种关系并不成立。正确的非零元素数量取决于矩阵的稀疏结构和分解过程中的填充情况。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":1535.03,"text":"So I know I'm not able to, I mean, I realize for many of you, if this is the first time you've seen it, that's fine. You should just get the high level picture of it. And you could read this a little bit more in the appendix in the book. There's an appendix on this. And this is just something you should know about. So I don't know, sci-fi, you could poke around in sci-fi or something. Once you know about this, you can't unknow about it. And it's kind of, you will have like incredible powers. Yes."},{"start":1561.37,"text":"Well, yeah, they do. So some are kind of greedy. I'd have to tell you actually how you actually do the factorization to actually explain the heuristics. But a lot of them are just constructed one by one. What they do is they say, p is going to permute something to the top row. And they'd say, I'm going to find which entry I should permute to the top."},{"start":1584.37,"text":"then who gets permuted to the second top, then third top and fourth top, things like that. But that's greedy. But that's the kind of things people use. And they have lots of names, and it's worth knowing a little bit about them. Yeah? Sorry for finding the best one, but are there, like, approximation guarantees? No, there's no approximation guarantees whatsoever. No. Right, so, yeah, no one has... Yeah, so, yeah, it's one of those things where, you know, we can ask, of course..."},{"start":1612.26,"text":"These are all graph calculations. These are just questions about graphs, right? Oh, there is one exception. There's one theory of it. That's this. If the graph represented by the sparsity pattern of A is chordal, then it turns out there is a permutation. It's guaranteed there exists a permutation which has zero fill-in, meaning the number of non-zeros in L will be identical to the number of non-zeros in A divided by 2."},{"start":1641.55,"text":"Right, so that, if you know what a chordal graph is, that's one of them. That's actually kind of useless, frankly, in practice, because the real question is not whether there exists one, the question is whether our heuristics find it. And the answer is, all decent heuristics will find that one. So, yeah. Do these factorizations have required that we know the matrix is non-singular, that it's positively definite? No, so it turns out most of the, so in this one,"},{"start":1669.18,"text":"To find the permutation for Cholesky factorization, you actually don't have to know the entries in A. You simply have to know their locations. That's actually a super important, more advanced, but you..."},{"start":1680.99,"text":"You brought it up. So what this means is we can do this ahead of time. So for example, if we're solving an optimal control problem or something like that, we can do the permutation once and for all offline. And then when this thing is actually running a jet engine or something like that, then we don't have to do it. If we're doing finance and we want to do an insanely fast back test, we would first do the factorization. And then after that, every solve is going to be really fast."}],"speech_gaps":[],"frame":"../frames/v013/010.webp","frame_time":1547.03},{"title":"Cholesky分解与LDL转置分解","segments":[{"id":88,"text":"So that's how that works. So you don't know, you don't have to know. If A is not positive definite and you call a Cholesky factorization on it, it will fail at some point. At some point it's going to attempt to take the square root of a negative number. And then it'll throw an exception to you of some kind. But that's the only time you would ever know."},{"id":89,"text":"When does the solver know what to stop? What kind of criterion? All of these are finite algorithms. And in infinite precision, they just solve. When I say it's order n cubed, it means I can tell you for this, you're going to do 1 billion, blah, blah, blah, blah, blah, multiplies 1.3 billion ads. When it's done,"},{"id":90,"text":"Okay, if you did everything in infinite precision, you would have the answer. End of story. There's no stopping criterion. There's nothing like that. Now, of course, you're doing this in finite precision, right? So since you asked, there are methods to do something. It's called iterative refinement. And what that does is you compute a solution that's approximate, and then you can actually do, you can iterate to get a better solution."},{"id":91,"text":"And people know about that, but that's a little bit beyond what we're talking about here. But it's good to know about too. Okay. Okay. So LDL transpose factorization. This is any non-singular symmetric matrix, right? By the way, we'll see examples of where these come up."},{"id":92,"text":"maybe next week, in fact. So here, it's like L, it's like an LDL transpose factorization, but D is diagonal, and it's either one by one or two by two blocks. So that's just a mathematical fact that you might need to have these two by two blocks. But the point is, those are all easily inverted matrices. Permutations, yes. Lower triangular, yes. A block diagonal matrix with one by one and two by two blocks, I think we know how to invert that."},{"id":93,"text":"That one we actually literally know how to invert. But we can certainly solve equations like that, right? So, okay. So this is the LDL transpose factorization. And now we're going to talk about something. This is something probably many of you have seen in other contexts. It comes up in pretty much all fields. So it's something called the Schur complement."},{"id":94,"text":"is the name of it. And I think you've already seen it early on in the class or something like that. But I can't think of a legitimate field where it doesn't come up."}],"notes":["本段主要讲解了Cholesky分解的失败条件，即当矩阵A不是正定矩阵时，分解过程会失败，因为会尝试对负数开平方。这种失败是唯一能被检测到的情况。此外，还提到在无限精度下，算法会直接求解，没有停止准则，但在有限精度下，需要使用迭代修正方法来提高解的精度。","LDL转置分解适用于任何非奇异对称矩阵，其分解形式为L、D和L的转置，其中D是主对角线矩阵，可能包含1×1或2×2的块。这种分解形式的矩阵容易求逆，因为其结构简单，可以分解为排列矩阵、下三角矩阵和块对角矩阵。","Schur补是一个在多个领域中广泛应用的概念，它在处理矩阵分解和优化问题时非常有用。虽然本段没有详细展开Schur补的定义和应用，但提到了它在不同学科中的普遍性。","在讲解过程中，强调了数值计算中的精度问题，指出在实际计算中，由于有限精度的限制，必须采用迭代修正等方法来提高解的准确性。这反映了数值计算中常见的挑战和解决方案。","本段还提到，LDL转置分解的结构使得求解线性方程组变得容易，因为其分解后的矩阵具有良好的数值性质，便于求逆和求解。","Schur补的概念虽然在本段中没有详细展开，但其重要性被强调，说明它在多个学科中的广泛应用，这为后续课程内容的展开提供了背景。"],"formulas":[{"latex":"A = LDL^\\text{T}","symbols":"A 是一个非奇异对称矩阵，L 是下三角矩阵，D 是对角矩阵","explanation":"公式正确，符合LDL^T分解的定义，其中A是一个非奇异对称矩阵，L是下三角矩阵，D是对角矩阵。","evidence":"maybe next week, in fact. So here, it's like L, it's like an LDL transpose factorization, but D is diagonal, and it's either one by one or two by two blocks. So that's just a mathematical fact that you might need to have these two by two blocks. But the point is, those are all easily inverted matrices. Permutations, yes. Lower triangular, yes. A block diagonal matrix with one by one and two by two blocks, I think we know how to invert that."}],"uncertainties":[],"diagram":"none","start":1711.01,"end":1873.94,"asr_flags":[89],"math_clarifications":["公式A = LDL^T是正确的LDL^T分解形式，其中L是下三角矩阵，D是对角矩阵，适用于非奇异对称矩阵。"],"raw_segments":[{"start":1711.01,"text":"So that's how that works. So you don't know, you don't have to know. If A is not positive definite and you call a Cholesky factorization on it, it will fail at some point. At some point it's going to attempt to take the square root of a negative number. And then it'll throw an exception to you of some kind. But that's the only time you would ever know."},{"start":1737.53,"text":"When does the solver know what to stop? What kind of criterion? All of these are finite algorithms. And in infinite precision, they just solve. When I say it's order n cubed, it means I can tell you for this, you're going to do 1 billion, blah, blah, blah, blah, blah, multiplies 1.3 billion ads. When it's done,"},{"start":1761.22,"text":"Okay, if you did everything in infinite precision, you would have the answer. End of story. There's no stopping criterion. There's nothing like that. Now, of course, you're doing this in finite precision, right? So since you asked, there are methods to do something. It's called iterative refinement. And what that does is you compute a solution that's approximate, and then you can actually do, you can iterate to get a better solution."},{"start":1789.0,"text":"And people know about that, but that's a little bit beyond what we're talking about here. But it's good to know about too. Okay. Okay. So LDL transpose factorization. This is any non-singular symmetric matrix, right? By the way, we'll see examples of where these come up."},{"start":1811.43,"text":"maybe next week, in fact. So here, it's like L, it's like an LDL transpose factorization, but D is diagonal, and it's either one by one or two by two blocks. So that's just a mathematical fact that you might need to have these two by two blocks. But the point is, those are all easily inverted matrices. Permutations, yes. Lower triangular, yes. A block diagonal matrix with one by one and two by two blocks, I think we know how to invert that."},{"start":1839.39,"text":"That one we actually literally know how to invert. But we can certainly solve equations like that, right? So, okay. So this ay, you know, this, if I were to double click on that and expand it, it would look like this. Factor A11, then solve with B1, and solve with each column of A12."},{"id":104,"text":"That gives me these two matrices. Next step is I form S, that's the Schur complement, which is this thing."},{"id":105,"text":"and I form this b tilde thing over here, which is the right hand side of this equation, right? So this equation up here is s x2 equals b tilde, and then what I do is I'm going to, I find x, what here is I solve, I do a factor on s, then a back solve, and then I can reassemble, this gives me x2 directly, and I can get x1 from like this equation here. And by the way, when I solve this equation, I already factored a11, so this is a back, this is a solve."},{"id":106,"text":"Okay. Right. This is the, okay. So that's, that's the idea now. Okay. Now it's a drum roll to find out, is this faster? Is it better? And it's actually kind of interesting. So if in step one, you have F is going to be the factor cost for A11. S is the solve cost. So in the first case,"},{"id":107,"text":"You factor A11 once, and then you solve for all the columns of A12. And so that's N2S. So that's the cost of step one. Step two, and..."}],"notes":["本段讲解了块矩阵的Schur补及其在求解线性系统中的应用。Schur补是矩阵分解中的一个重要概念，用于简化大规模矩阵的求解过程。Schur补可以是相对于1-1块或2-2块的，具体取决于矩阵的结构，但无论哪种情况，它都具有重要的计算优势。","在计算过程中，首先需要对A11进行因式分解，然后利用该分解结果对A12的每一列进行求解。这种方法可以显著提高计算效率，因为因式分解只需要进行一次，而求解过程可以并行处理多个列。","接下来，通过构造Schur补矩阵S和右侧向量b_tilde，可以进一步求解x2。通过因式分解S并进行回代，可以直接得到x2的值，而x1则可以通过原始方程求得。这种方法在计算上具有较高的效率。","在计算成本方面，第一步的因式分解和求解过程的总成本为N2S，其中N是A12的列数，S是求解的代价。这种计算方式在处理大规模矩阵时具有显著的优势。","Schur补的应用不仅限于线性系统，还广泛用于优化问题和数值计算中。通过合理利用Schur补，可以有效减少计算复杂度，提高算法的效率。","在实际应用中，Schur补的构造和求解需要考虑矩阵的结构和条件，确保分解和求解过程的稳定性。此外，还需要注意因式分解和求解的顺序，以确保计算的正确性和效率。"],"formulas":[{"latex":"S = A_{22} - A_{21} A_{11}^{-1} A_{12}","symbols":"S是矩阵A的Schur补，由A_{22}减去A_{21}乘以A_{11}的逆再乘以A_{12}得到","explanation":"公式正确，Schur补的定义符合线性代数标准形式，无需修改。","evidence":"I just put, and that's another equation in sn't grow this way, and if the bandwidth doesn't change, this gets bigger and bigger and we can solve it, right? So anyway, it's pretty cool, right? So, and that means if you see that,"},{"id":118,"text":"You should smile. We'll put it that way. Or you're not going to see that, probably, because someone would already have to know. But the way it's really going to work is someone's going to be talking about a problem. It's going to be some weird, complicated problem. Who knows what... It doesn't matter. They're going to be talking about some complicated thing. While they're talking, you will be forming in your mind what the sparsity pattern of the associated matrices look like. When that image comes to mind, you will smile."},{"id":119,"text":"And you will say, I can solve that problem in half a second. And they said, I can't even load it into memory. And you'd say, just chill, and I'll show you what we're going to do, right? Everybody following this? So these are incredibly useful things, right? And, you know, we can think about what this is. This is basically a set of equations where banded means that equation, you know, 50."}],"notes":["本段主要讲解了稀疏性模式在矩阵中的表现及其对计算效率的影响。讲者提到，当矩阵具有带状结构时，可以通过块消元法快速求解，这比处理密集矩阵要高效得多。例如，当矩阵的带宽固定时，计算复杂度可以线性增长，而不是指数增长。","讲者进一步说明，当面对复杂问题时，理解矩阵的稀疏性模式非常重要。如果能够识别出矩阵的稀疏结构，就可以快速找到解决方法，甚至在内存不足的情况下也能处理。这种能力在实际应用中非常关键。","讲者通过举例说明，如果矩阵的稀疏性模式是带状的，那么可以利用块消元法进行求解。这种结构的矩阵在实际中很常见，例如在有限元分析或网络流问题中。","讲者强调，识别稀疏性模式的能力是解决复杂问题的关键。当听到问题描述时，应该在脑海中形成矩阵的稀疏性图像，从而快速判断如何求解。","讲者提到，带状矩阵的稀疏性模式可以显著减少计算量，使得问题可以在短时间内解决。这种能力在实际工程和科学计算中非常有用。","最后，讲者指出，带状矩阵的稀疏性模式可以被看作是一组方程，其中每个方程的非零元素集中在对角线附近，这种结构使得块消元法成为一种高效的求解方法。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2361.31,"end":2522.11,"asr_flags":[],"raw_segments":[{"start":2361.31,"text":"That's pretty straightforward. Actually, I think in terms of flops, it's the same anyway, so it doesn't even matter. But anyway, here it is. Okay, so here's one where instead of this, so n1 is, I don't know, let's suppose the orig
