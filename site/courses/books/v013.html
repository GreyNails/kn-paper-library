id, I can't even load it into memory. And you'd say, just chill, and I'll show you what we're going to do, right? Everybody following this? So these are incredibly useful things, right? And, you know, we can think about what this is. This is basically a set of equations where banded means that equation, you know, 50."}],"speech_gaps":[],"frame":"../frames/v013/015.webp","frame_time":2373.31},{"title":"矩阵更新与低秩扰动","segments":[{"id":120,"text":"only references, let's say, variables 40 to 60. And that would be here. Then you say, but there's some special variables here which affect everybody. So that's what this is. So you're going to want to be making those... To be fully developed, I would say here's what you want. You want to be able to get a feel for when applications involve matrices that look like that."},{"id":121,"text":"then you're going to be happy because you're going to know something other people in the room don't because you're going to know that you can solve that in linear time. Right. So that's why people say like, well, I have to find this whole trajectory. It's like, it's, it's, you know, it's a hundred thousand time points, you know, and you're like, so, but I mean, do you have a phone or whatever? It's just not going to be that complicated. Right. Again, if you know what you're doing. Okay. So, okay. Um, okay. So now"},{"id":122,"text":"This leads us to, and this probably people have seen. It's got lots of names. It depends on where you're from. I think it's called like Sherman, Morrison, Woodbury. Sometimes it's called the Woodbury thing. Sometimes it's called the matrix inversion lemma. And I have a friend who can actually tell where someone learned their linear algebra."},{"id":123,"text":"Because they use different terms. They even use different terms, I believe, at Oxford and Cambridge, just so you know. So this is like someone can, just by asking someone what they call this and a couple of other questions, you can figure out that they got their PhD at Oxford or Cambridge or something or Harvard or whatever, or MIT or something."},{"id":124,"text":"In fact, some people call this a low-rank perturbation of A. I mean, that's not fair because no one said that B and C are small. But if B had small columns, if B had just a handful of columns and C had a handful of rows, this would indeed be what people would call low-rank update to A. So we want to solve a matrix that looks like that. In fact, an extreme case would be things like,"},{"id":125,"text":"Here's one you hear all the time. Diagonal plus low rank. There, A is diagonal, and B and C are small. So B has got a small number of columns, C has got a small number of rows. That's super common. That's also something you will, I would hope, never ever forget. Diagonal plus low rank. And it's all related. Here's how it's related."}],"notes":["本段主要讲解了矩阵更新和低秩扰动的概念，特别是矩阵的低秩更新在实际应用中的重要性。讲者提到，当矩阵A被低秩矩阵BC的扰动所改变时，这种结构可以被用来高效地求解线性系统。这种结构被称为低秩扰动，但需要注意的是，B和C的大小并不一定小，只有当它们的列数和行数较少时，才被称为低秩更新。","讲者还提到，低秩扰动在实际应用中非常常见，例如矩阵A是对角矩阵，而B和C是小矩阵的情况，这种结构被称为对角加低秩。这种结构在许多领域都有应用，例如信号处理和机器学习。","讲者强调了对角加低秩结构的重要性，并指出这种结构在实际应用中非常常见，应该被记住。这种结构与矩阵的低秩更新密切相关，可以用于高效地求解线性系统。","讲者还提到，不同大学对矩阵更新的术语有不同的称呼，例如Sherman-Morrison-Woodbury公式、矩阵求逆引理等。这些术语的差异反映了不同学术背景下的术语习惯。","讲者通过举例说明了低秩扰动的应用场景，例如当矩阵A被低秩矩阵BC的扰动所改变时，这种结构可以被用来高效地求解线性系统。这种结构在实际应用中非常常见，例如在信号处理和机器学习中。","讲者还提到，低秩扰动的结构可以被用来高效地求解线性系统，这在实际应用中非常重要。这种结构的高效性来自于其低秩特性，使得求解过程可以被优化。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2522.73,"end":2682.19,"asr_flags":[],"raw_segments":[{"start":2522.73,"text":"only references, let's say, variables 40 to 60. And that would be here. Then you say, but there's some special variables here which affect everybody. So that's what this is. So you're going to want to be making those... To be fully developed, I would say here's what you want. You want to be able to get a feel for when applications involve matrices that look like that."},{"start":2553.45,"text":"then you're going to be happy because you're going to know something other people in the room don't because you're going to know that you can solve that in linear time. Right. So that's why people say like, well, I have to find this whole trajectory. It's like, it's, it's, you know, it's a hundred thousand time points, you know, and you're like, so, but I mean, do you have a phone or whatever? It's just not going to be that complicated. Right. Again, if you know what you're doing. Okay. So, okay. Um, okay. So now"},{"start":2581.26,"text":"This leads us to, and this probably people have seen. It's got lots of names. It depends on where you're from. I think it's called like Sherman, Morrison, Woodbury. Sometimes it's called the Woodbury thing. Sometimes it's called the matrix inversion lemma. And I have a friend who can actually tell where someone learned their linear algebra."},{"start":2603.9,"text":"Because they use different terms. They even use different terms, I believe, at Oxford and Cambridge, just so you know. So this is like someone can, just by asking someone what they call this and a couple of other questions, you can figure out that they got their PhD at Oxford or Cambridge or something or Harvard or whatever, or MIT or something. Okay, so here it is. You start with A plus BC times X equals B."},{"start":2629.69,"text":"In fact, some people call this a low-rank perturbation of A. I mean, that's not fair because no one said that B and C are small. But if B had small columns, if B had just a handful of columns and C had a handful of rows, this would indeed be what people would call low-rank update to A. So we want to solve a matrix that looks like that. In fact, an extreme case would be things like,"},{"start":2658.35,"text":"Here's one you hear all the time. Diagonal plus low rank. There, A is diagonal, and B and C are small. So B has got a small number of columns, C has got a small number of rows. That's super common. That's also something you will, I would hope, never ever forget. Diagonal plus low rank. And it's all related. Here's how it's related."}],"speech_gaps":[],"frame":"../frames/v013/016.webp","frame_time":2534.73},{"title":"因子模型与协方差矩阵的稀疏性","segments":[{"id":126,"text":"Yeah, actually, let's just talk about this in the case where A was diagonal and B and C have modest number of columns, right? So in fact, let's make, in fact, here's one. So basically, all of quantitative finance uses a risk model where the covariance matrix is diagonal plus low rank. And it's called a factor model, right? So there, C is B transpose."},{"id":127,"text":"And if this were like a Gaussian or something, if this is the covariance of a Gaussian, if you understand what I'm saying, that's fine. If you don't, that's also cool. But this is just completely universal, right? What it would mean is it's even got a Bayesian model, and it basically says that the returns of all these assets is driven by, let's say, B and C. Typically, B is about a width of 100. That would be very typical."},{"id":128,"text":"C would have a high, well, C is B transpose, right? So you'd say, look, I don't know what these 8,000 returns are doing, but they're mostly driven by..."},{"id":129,"text":"These hundred factors, right? Which are actually... So that's the underlying... That's what's actually driving the returns. And then the A is diagonal, and they have a beautiful name for it. It's called idiosyncratic. So that's the idiosyncratic risk. It's the amount by which, you know, Google or, you know, whatever, Coca-Cola or whatever it is, Chevron, goes up and down. It's the part... In fact, the way they would say it, this is dialect, is you'd say..."},{"id":130,"text":"That is the part of the variance not explained by the factors. Everyone got that? So that's it. And the factors are actually kind of interesting. Sorry, this is just a weird aside, but since we're here, I'll just continue. The factors are interesting. Some are handcrafted. So they're literally matrices with zeros and ones and weird stuff like that. What region are you in?"},{"id":131,"text":"Are you a pharmaceuticals company? Do you do defense? Do you do that kind of thing? Others are actually crafted by people using numerical algorithms. So, okay. That was just a small story about this. Okay."},{"id":132,"text":"Oh, if I have a if I have something that looks like that A is diagonal and B and C are small, I can store that like no problem. Right. That's that's even for very big. Like if I do, I want to you want to run a fund that is looking at a universe. I'm using dialect of, let's say, 100000 assets right across the whole world."},{"id":133,"text":"I know people who do that. So you do that. So the covariance matrix is 100,000 by 100,000 matrix. For something like that, you might, someone say, well, Heidi, what's your risk model? And they would say, oh, I have a 200 factor model. And that means their covariance matrix is expressed as a diagonal matrix, right? Which is whatever it is, 100,000 by 100,000."}],"notes":["本段讲解了因子模型在量化金融中的应用，其中协方差矩阵被表示为对角矩阵加上低秩矩阵。这种模型被称为因子模型，其中C是B的转置。这种结构允许在处理大规模资产时减少存储和计算的复杂性。","因子模型中的A矩阵是对角矩阵，代表资产的特有风险（idiosyncratic risk），即无法通过因子解释的资产特定波动。B和C矩阵代表因子，这些因子通常数量较少，但能解释大部分资产的波动。","因子可以是人工构建的，例如与行业或地区相关的矩阵，也可以是通过数值算法生成的。这种模型在处理大规模资产时非常有用，因为其稀疏性大大降低了计算和存储需求。","在实际应用中，协方差矩阵可能非常大，例如100,000×100,000的矩阵，但通过因子模型，可以将其表示为对角矩阵加上低秩部分，从而简化计算。","因子模型的结构使得风险模型的构建更加高效，特别是在处理全球范围内的资产时，这种模型能够有效捕捉资产之间的相关性。","因子模型的使用不仅限于金融领域，也可以应用于其他需要处理高维数据和稀疏结构的领域。"],"formulas":[],"uncertainties":["在段落132中，'I'm using dialect of, let's say, 100000 assets' 中的 'dialect' 可能是误听，实际应为 'model' 或 'framework'，但无法确定具体含义。"],"diagram":"none","start":2684.68,"end":2858.66,"asr_flags":[],"raw_segments":[{"start":2684.68,"text":"Yeah, actually, let's just talk about this in the case where A was diagonal and B and C have modest number of columns, right? So in fact, let's make, in fact, here's one. So basically, all of quantitative finance uses a risk model where the covariance matrix is diagonal plus low rank. And it's called a factor model, right? So there, C is B transpose."},{"start":2709.71,"text":"And if this were like a Gaussian or something, if this is the covariance of a Gaussian, if you understand what I'm saying, that's fine. If you don't, that's also cool. But this is just completely universal, right? What it would mean is it's even got a Bayesian model, and it basically says that the returns of all these assets is driven by, let's say, B and C. Typically, B is about a width of 100. That would be very typical."},{"start":2736.41,"text":"C would have a high, well, C is B transpose, right? So you'd say, look, I don't know what these 8,000 returns are doing, but they're mostly driven by..."},{"start":2748.85,"text":"These hundred factors, right? Which are actually... So that's the underlying... That's what's actually driving the returns. And then the A is diagonal, and they have a beautiful name for it. It's called idiosyncratic. So that's the idiosyncratic risk. It's the amount by which, you know, Google or, you know, whatever, Coca-Cola or whatever it is, Chevron, goes up and down. It's the part... In fact, the way they would say it, this is dialect, is you'd say..."},{"start":2775.69,"text":"That is the part of the variance not explained by the factors. Everyone got that? So that's it. And the factors are actually kind of interesting. Sorry, this is just a weird aside, but since we're here, I'll just continue. The factors are interesting. Some are handcrafted. So they're literally matrices with zeros and ones and weird stuff like that. What region are you in?"},{"start":2799.01,"text":"Are you a pharmaceuticals company? Do you do defense? Do you do that kind of thing? Others are actually crafted by people using numerical algorithms. So, okay. That was just a small story about this. Okay."},{"start":2814.56,"text":"Oh, if I have a if I have something that looks like that A is diagonal and B and C are small, I can store that like no problem. Right. That's that's even for very big. Like if I do, I want to you want to run a fund that is looking at a universe. I'm using dialect of, let's say, 100000 assets right across the whole world."},{"start":2834.34,"text":"I know people who do that. So you do that. So the covariance matrix is 100,000 by 100,000 matrix. For something like that, you might, someone say, well, Heidi, what's your risk model? And they would say, oh, I have a 200 factor model. And that means their covariance matrix is expressed as a diagonal matrix, right? Which is whatever it is, 100,000 by 100,000."}],"speech_gaps":[],"frame":"../frames/v013/017.webp","frame_time":2696.68},{"title":"反消除与块消除","segments":[{"id":134,"text":"And then they have 200 factors. And all of that is completely storable and stuff like that. And you'll see, in fact, not only can you store, you can actually solve problems super fast and things like that. Okay. That was all a weird aside. So let's keep going. So now what you do here is something that is actually a little bit unintuitive. It's called you un-eliminate. We did this before in duality. And it turned out well there."},{"id":135,"text":"What you do to uneliminate means to introduce new variables, right? Right. To eliminate variables means to, you know, solve for them, get rid of them, and then substitute back their values into the rest. That's elimination, right? That sounds good, especially to an amateur or somebody first seeing this material because, you know, someone, what are you doing? So I'm eliminating some very, why? Because I like to solve smaller sets of equations. Everybody, I mean, everyone like that's, it makes perfect sense, right?"},{"id":136,"text":"And they would say, like, why? Anyway, and the answer is, you'll see why in a minute, right? So we write this this way. We just introduce a new variable, which is y, which is cx, right? So, and I write that second equation as this bottom row, which is cx minus y equals zero, right? So the second system of equations is bigger, and it is completely equivalent to the first one, right?"},{"id":137,"text":"And they would say, like, why? Anyway, and the answer is, you'll see why in a minute, right? So we write this this way. We just introduce a new variable, which is y, which is cx, right? So, and I write that second equation as this bottom row, which is cx minus y equals zero, right? So the second system of equations is bigger, and it is completely equivalent to the first one, right? Okay, now let's talk about this."},{"id":138,"text":"When you see a matrix like that, you just encountered all this so far just a few minutes ago, so I don't expect you to have this response now. But hopefully within a week or two, you should have the following response. You will see a block there, a minus i, and your i will go to it because it's really easily inverted."},{"id":139,"text":"and you're going to see a block, and you're going to say, well, you're going to have an urge to do block elimination on this, right? And so what you would do is you'd say, oh, you know, I know what I'm going to do. I'm going to permute the i, the minus i, up to the top, and then I'm going to use block elimination from the previous stuff, right? Everybody got that? And then you eliminate it, and you'll end up then forming the Schroeder complement equations, and it will be a plus bcx equals b. So you'll be right back where you started."}],"notes":["本段讲解了反消除（unelimination）的概念，即通过引入新变量和方程来扩大原问题的规模。这与消除（elimination）相反，消除是通过解方程并代入值来简化问题，而反消除则是通过增加变量和方程来构建更大的系统，但保持等价性。","反消除的目的是为了后续进行块消除（block elimination），这在处理矩阵结构时非常有用。通过将某些块移动到顶部，可以利用之前学到的消除技巧，从而简化问题。","在反消除过程中，引入的新变量和方程使得系统变得更复杂，但这种复杂性有助于后续的块消除操作，最终可以回到原始问题，从而验证反消除的正确性。","块消除是一种处理矩阵块结构的方法，通过重新排列和消除某些块，可以简化整个系统的求解过程。这种技术在处理大规模系统时尤为重要。","反消除和块消除是凸优化中处理复杂系统的重要工具，它们允许在保持等价性的前提下，通过引入新变量和方程来简化问题的结构。","在实际应用中，反消除和块消除的结合可以有效处理大规模的线性系统，使得原本难以直接求解的问题变得可行。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2859.62,"end":3023.54,"asr_flags":[],"raw_segments":[{"start":2859.62,"text":"And then they have 200 factors. And all of that is completely storable and stuff like that. And you'll see, in fact, not only can you store, you can actually solve problems super fast and things like that. Okay. That was all a weird aside. So let's keep going. So now what you do here is something that is actually a little bit unintuitive. It's called you un-eliminate. We did this before in duality. And it turned out well there."},{"start":2885.88,"text":"What you do to uneliminate means to introduce new variables, right? Right. To eliminate variables means to, you know, solve for them, get rid of them, and then substitute back their values into the rest. That's elimination, right? That sounds good, especially to an amateur or somebody first seeing this material because, you know, someone, what are you doing? So I'm eliminating some very, why? Because I like to solve smaller sets of equations. Everybody, I mean, everyone like that's, it makes perfect sense, right?"},{"start":2913.53,"text":"It's completely and totally wrong. That's not how you should be doing linear algebra, but it does sound good and people can fall for that, right? Okay, unelimination is the opposite. You say, thank you for your set of equations. If you don't mind, I'm going to introduce new variables and equations and make it a bigger one. And someone's like, why would you do that? Everyone see what I'm saying? You'd say, thank you for your, you know, thousand by thousand set of equations. If you don't mind, I'm going to expand it to a 10,000 by 10,000 set of equations, if it's okay with you, right?"},{"start":2942.66,"text":"And they would say, like, why? Anyway, and the answer is, you'll see why in a minute, right? So we write this this way. We just introduce a new variable, which is y, which is cx, right? So, and I write that second equation as this bottom row, which is cx minus y equals zero, right? So the second system of equations is bigger, and it is completely equivalent to the first one, right? Okay, now let's talk about this."},{"start":2973.3,"text":"When you see a matrix like that, you just encountered all this so far just a few minutes ago, so I don't expect you to have this response now. But hopefully within a week or two, you should have the following response. You will see a block there, a minus i, and your i will go to it because it's really easily inverted."},{"start":2995.16,"text":"and you're going to see a block, and you're going to say, well, you're going to have an urge to do block elimination on this, right? And so what you would do is you'd say, oh, you know, I know what I'm going to do. I'm going to permute the i, the minus i, up to the top, and then I'm going to use block elimination from the previous stuff, right? Everybody got that? And then you eliminate it, and you'll end up then forming the Schroeder complement equations, and it will be a plus bcx equals b. So you'll be right back where you started."}],"speech_gaps":[],"frame":"../frames/v013/018.webp","frame_time":2871.62},{"title":"矩阵求逆技巧与矩阵求逆引理","segments":[{"id":140,"text":"Okay, so here's what you do instead. You resist the urge here to eliminate the minus i, even though it is a very attractive target for elimination because it's easily inverted, right? You resist that urge, and instead you eliminate a. And you will end up with a sure complement equation that looks like this. Okay."},{"id":141,"text":"And this allows you to get y. Here you solve for y. Then from that, you plug it back in and get x. And you end up with a formula that's called the matrix inversion lemma. That's the neutral version. It says that a plus bc inverse is this horrible formula over here. Yeah, so that's it. This gets interesting if a is diagonal or something like that. Anyway, a lot of things would come out of that."},{"id":142,"text":"How many people have seen like matrix inversion lemma or something before, or, or some Sherman-Morrison and Woodbury? It's the same. Okay. Uh, any other names for it? I, uh, I used to know at least one or two others, but anyway, anybody else know another name for that? It's a thing in linear algebra and how you call it depends on where you came from. So, okay. Okay. So I think actually I'll, uh, oh yeah, well, here's an example like a diagonal and B and C are dense."},{"id":143,"text":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"id":144,"text":"By the way, a lot of this stuff subsumes things that were taught in the 60s, 70s, and 80s. And sometimes in the 90s by people who learned it from people who learned it in the 60s and 70s. So, for example, if you teach a course on control, you might... I've done this. I haven't done it for a long time. I won't do it again."},{"id":145,"text":"But you go through a long derivation of what, like, the Kalman filter is, or how to solve an optimal control problem, right? And it's very clever, and you have little parts in this Bellman equation, and blah, blah, blah, and you get a... And yeah, you end up with stuff that actually works. It's great. A very funny thing happens. If you simply take the problem represented by an optimal control problem or a Kalman filter and just throw it at a sparse solver, guess what?"}],"notes":["本段讲解了矩阵求逆引理（Matrix Inversion Lemma）的使用方法，强调了在处理矩阵求逆问题时，应避免直接消除某些项，而是通过消除其他变量来得到更简洁的表达式。引理的核心思想是通过引入中间变量，将复杂的矩阵求逆问题转化为更易处理的形式。","矩阵求逆引理在实际应用中非常重要，尤其是在处理大规模矩阵时，它能够显著减少计算复杂度。例如，当矩阵A是稀疏的，而B和C是密集的时，直接计算A + BC的逆矩阵会非常耗时，而通过引理可以将计算复杂度从O(N³)降低到O(N)。","引理的名称在不同文献中可能有所不同，如Sherman-Morrison-Woodbury公式，但它们本质上是同一个数学关系。这种差异反映了线性代数中术语的多样性，取决于不同的学术背景和来源。","本段还提到，许多现代的优化方法和控制理论中的技术，如卡尔曼滤波和贝尔曼方程，实际上可以追溯到20世纪60年代至80年代的数学发展。这些方法在现代计算中仍然具有重要价值，但有时需要借助更高效的算法来实现。","最后，课程指出，将传统的控制理论问题（如卡尔曼滤波）直接输入稀疏求解器可能会产生意想不到的结果，这说明了在实际应用中需要对算法进行适当的调整和优化。","整体而言，本段强调了矩阵求逆引理在优化和控制理论中的重要性，并通过具体例子说明了其在实际计算中的优势。"],"formulas":[{"latex":"A + BC","symbols":"矩阵A加上矩阵B和矩阵C的乘积","explanation":"公式正确，表示矩阵A与矩阵B和矩阵C的乘积之和。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"latex":"D = A + BC","symbols":"矩阵D等于矩阵A加上矩阵B和矩阵C的乘积","explanation":"公式正确，表示矩阵D等于矩阵A与矩阵B和矩阵C的乘积之和。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"latex":"O(N^3)","symbols":"计算复杂度为O(N³)","explanation":"公式正确，表示计算复杂度为O(N³)。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"latex":"O(N)","symbols":"计算复杂度为O(N)","explanation":"公式正确，表示计算复杂度为O(N)。","evidence":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"}],"uncertainties":["PN squared"],"diagram":"none","start":3024.39,"end":3182.92,"asr_flags":[],"math_clarifications":[],"raw_segments":[{"start":3024.39,"text":"Okay, so here's what you do instead. You resist the urge here to eliminate the minus i, even though it is a very attractive target for elimination because it's easily inverted, right? You resist that urge, and instead you eliminate a. And you will end up with a sure complement equation that looks like this. Okay."},{"start":3048.72,"text":"And this allows you to get y. Here you solve for y. Then from that, you plug it back in and get x. And you end up with a formula that's called the matrix inversion limit. That's the neutral version. It says that a plus bc inverse is this horrible formula over here. Yeah, so that's it. This gets interesting if a is diagonal or something like that. Anyway, a lot of things would come out of that."},{"start":3077.24,"text":"How many people have seen like matrix inversion lemma or something before, or, or some Sherman Morris and Woodbury? It's the same. Okay. Uh, any other names for it? I, uh, I used to know at least one or two others, but anyway, anybody else know another name for that? It's a thing in linear algebra and how you call it depends on where you came from. So, okay. Okay. So I think actually I'll, uh, oh yeah, well, here's an example like a diagonal and B and C are dense."},{"start":3110.22,"text":"This is, you just, you basically form, you're going to form D is A plus BC. This is if you do it the dumb way, right? You just write it out as a dense matrix and solve. In this case, then you get something that's PN squared, sorry, N cubed. And if you do it the right way, you get something that's linear in N, right? And these make a big difference, right?"},{"start":3137.41,"text":"By the way, a lot of this stuff subsumes things that were taught in the 60s, 70s, and 80s. And sometimes in the 90s by people who learned it from people who learned it in the 60s and 70s. So, for example, if you teach a course on control, you might... I've done this. I haven't done it for a long time. I won't do it again."},{"start":3157.4,"text":"But you go through a long derivation of what, like, the Kalman filter is, or how to solve an optimal control problem, right? And it's very clever, and you have little parts in this Bellman equation, and blah, blah, blah, and you get a... And yeah, you end up with stuff that actually works. It's great. A very funny thing happens. If you simply take the problem represented by an optimal control problem or a Kalman filter and just throw it at a sparse solver, guess what?"}],"speech_gaps":[],"frame":"../frames/v013/019.webp","frame_time":3036.39},{"title":"凸优化中的线性代数与无约束最小化","segments":[{"id":146,"text":"It'll be just as it'll do it. It'll do it. So basically all of those lectures were useless is what I'm saying as a practical matter, which is kind of embarrassing, but whatever. So I don't teach that anymore. So I don't teach that way anymore. I just say you get a giant set of linear equations and you solve it using sparse methods. Done. That is the correct way to do it. It gives you a lot of stuff, right? So this isn't a lot of fields."},{"id":147,"text":"Yeah, I think probably I'm almost certain in statistics, there'd be many, many papers written on if you had a factor model. So that's a covariance matrix is diagonal plus low rank. And it would be all sorts of things about very intensely clever ways. I could condition, suppose I gave you 80% of the entries of a vector. And I said, please compute the conditional means of the remaining ones. Everybody follow this? That's like a conditional mean imputation task."},{"id":148,"text":"right? So I'm sure there's whole papers written on this and clever methods for doing this and blah. Anyway, the answer is you form the covariance matrix, literally write down the equations you want to solve, and then you do nothing but pass it to a sparse solver. And it'll be just as fancy, probably more general than all those papers. So, okay. It's embarrassing, but true. Okay. All right."},{"id":149,"text":"I'm not going to go into this. There's a whole lot more I haven't told you about linear algebra, but these are the main points. Right now, this is just sort of hanging here. Now you just know about linear algebra, but I promise in the next week, we're going to connect it to optimization problems, and that will have a connection to applications. And then you will start being able to listen to a problem."},{"id":150,"text":"a practical problem and say i can solve that like i can solve that super fast right so everybody uh getting this right so i mean there's people where this is all they do right if you do scientific computation this is kind of a lot of the stuff you do so okay so now now we're going to start um unconstrained minimization um"},{"id":151,"text":"And we'll, like I say, we're building slowly up at the lowest level. Well, at the lowest level are, you know, computers, compilers, microcode, things like that, which we're not going to look at. Next level up, the bottom floor is what we just covered was linear algebra. Now, the next floor is how do you solve, like, you know, smooth, unconstrained problems. So we'll look at that first."},{"id":152,"text":"and we'll build slowly up, then we'll get equality constraints, then we'll pull in inequality constraints, and then we're there, right? So, okay. So here's what it looks like. We're going to minimize a function, f, here, that is, we're going to assume it's smooth and twice continuously differentiable, right?"}],"notes":["本段主要讨论了线性代数在实际问题中的应用，指出通过稀疏方法求解大规模线性方程组是更有效的方法，而不是依赖复杂的统计模型。讲者提到，虽然统计学中有很多关于因子模型的论文，但实际操作中只需构建协方差矩阵并使用稀疏求解器即可，这种方法比那些论文中的方法更通用。","讲者进一步说明了线性代数在优化问题中的重要性，并提到接下来的课程将逐步引入优化问题，从无约束最小化开始，逐步引入等式约束和不等式约束，最终形成完整的优化框架。","讲者强调了无约束最小化是优化问题的基础，接下来的课程将从最低层次（如计算机、编译器等）开始，逐步上升到线性代数，再进一步讨论如何求解光滑无约束问题。","讲者提到，优化问题的解决需要假设目标函数是光滑且二阶可微的，这是后续讨论无约束最小化问题的基础。","讲者还提到，线性代数是连接优化问题与实际应用的桥梁，接下来的课程将展示如何将线性代数的知识应用于优化问题中。","讲者指出，虽然线性代数是基础，但其在优化问题中的应用需要进一步的深入，包括如何构建和求解 now, this is just sort of hanging here. Now you just know about linear algebra, but I promise in the next week, we're going to connect it to optimization problems, and that will have a connection to applications. And then you will start being able to listen to a problem."},{"start":3294.0,"text":"a practical problem and say i can solve that like i can solve that super fast right so everybody uh getting this right so i mean there's people where this is all they do right if you do scientific computation this is kind of a lot of the stuff you do so okay so now now we're going to start um unconstrained minimization um"},{"start":3315.34,"text":"And we'll, like I say, we're building slowly up at the lowest level. Well, at the lowest level are, you know, computers, compilers, microcode, things like that, which we're not going to look at. Next level up, the bottom floor is what we just covered was linear algebra. Now, the next floor is how do you solve, like, you know, smooth, unconstrained problems. So we'll look at that first."},{"start":3340.92,"text":"and we'll build slowly up, then we'll get equality constraints, then we'll pull in inequality constraints, and then we're there, right? So, okay. So here's what it looks like. We're going to minimize a function, f, here, that is, we're going to assume it's smooth and twice continuously differentiable, right?"}],"speech_gaps":[],"frame":"../frames/v013/020.webp","frame_time":3195.81},{"title":"迭代方法与收敛性","segments":[{"id":153,"text":"And we'll assume that, you know, the optimal value is achieved, right? So there's at least an optimal point, right? Now, by the way, a lot of problems like that that we want to solve in this class, problems you have already solved, don't satisfy this, right? Like if you did an L1 fitting problem, you would minimize the L1 norm of AX minus B, and that doesn't count. That's not here because that's not differentiable, okay? Okay, so this is what we're going to do."},{"id":154,"text":"In general, except for a very important set of problems we will see shortly, there are no analytical solutions to this."},{"id":155,"text":"Instead, we're going to have iterative methods. And an iterative method is going to generate an x. It's going to query something about f and then generate a new x and so on, a new x and a new x. And what's going to happen is those x's are going to converge to hopefully a solution of this problem. And what we'll do is the typical thing you're going to get is something like this sequence."},{"id":156,"text":"is going to have the function values converge to the optimal value. And another way to say it is that the gradient, you're going to have a sequence of points where the gradient gets smaller and smaller. And then when you deem it to be small enough, you asked earlier about stopping criteria. Here you have stopping criteria. For the direct methods, you don't have stopping criteria. Well, it just stops. It's like after n cubed over three steps, you've got the Cholesky factor. There is no stopping criterion. Here there is."},{"id":157,"text":"Okay, so we'll make some assumptions. I don't want to get too technical about it because it quickly gets kind of boring and stuff like that. And by the way, there's entire classes that cover nothing but this material and hideous, full mathematical detail. So, I mean, they're interesting, but I don't know. I think some people grow out of it. Anyway, I'll stop here. Okay, that's fine. Okay."},{"id":158,"text":"So we're going to assume that the sublevel sets are closed. And one condition for that is pretty common, is that the function f is closed. If you do convex analysis, which is the mathematics of convex optimization and convexity, this is a central concept. It just means that the epigraph is closed. And one example would be if you had a..."}],"notes":["本段主要讨论凸优化问题中迭代方法的使用，强调在没有解析解的情况下，需要依赖迭代方法来逼近最优解。讲者指出，许多实际问题（如L1拟合）由于不可微性，无法直接求解，因此需要迭代方法。","讲者提到，迭代方法通过生成一系列点，逐步逼近最优解，这些点的函数值会收敛到最优值，同时梯度也会逐渐减小。当梯度足够小时，可以作为停止条件。","讲者还提到，直接方法（如Cholesky分解）没有明确的停止条件，而迭代方法则有明确的停止条件，这在实际应用中非常重要。","讲者指出，虽然凸优化的理论非常深入，但课程中不会深入探讨所有数学细节，因为这会变得枯燥。他提到，有些课程专门讲授这些内容，但并非所有人都对这些内容感兴趣。","最后，讲者提到将假设函数的次级集是闭合的，这是凸分析中的一个核心概念，意味着上图是闭合的。例如，如果函数是连续的，那么它的次级集就是闭合的。","讲者提到，凸分析是凸优化的数学基础，涉及许多核心概念，如闭合性、上图等，这些概念在后续课程中会进一步展开。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3359.74,"end":3510.92,"asr_flags":[],"raw_segments":[{"start":3359.74,"text":"And we'll assume that, you know, the optimal value is achieved, right? So there's at least an optimal point, right? Now, by the way, a lot of problems like that that we want to solve in this class, problems you have already solved, don't satisfy this, right? Like if you did an L1 fitting problem, you would minimize the L1 norm of AX minus B, and that doesn't count. That's not here because that's not differentiable, okay? Okay, so this is what we're going to do."},{"start":3388.24,"text":"In general, except for a very important set of problems we will see shortly, there are no analytical solutions to this."},{"start":3399.11,"text":"Instead, we're going to have iterative methods. And an iterative method is going to generate an x. It's going to query something about f and then generate a new x and so on, a new x and a new x. And what's going to happen is those x's are going to converge to hopefully a solution of this problem. And what we'll do is the typical thing you're going to get is something like this sequence."},{"start":3425.82,"text":"is going to have the function values converge to the optimal value. And another way to say it is that the gradient, you're going to have a sequence of points where the gradient gets smaller and smaller. And then when you deem it to be small enough, you asked earlier about stopping criteria. Here you have stopping criteria. For the direct methods, you don't have stopping criteria. Well, it just stops. It's like after n cubed over three steps, you've got the Cholesky factor. There is no stopping criterion. Here there is."},{"start":3455.8,"text":"Okay, so we'll make some assumptions. I don't want to get too technical about it because it quickly gets kind of boring and stuff like that. And by the way, there's entire classes that cover nothing but this material and hideous, full mathematical detail. So, I mean, they're interesting, but I don't know. I think some people grow out of it. Anyway, I'll stop here. Okay, that's fine. Okay."},{"start":3487.02,"text":"So we're going to assume that the sublevel sets are closed. And one condition for that is pretty common, is that the function f is closed. If you do convex analysis, which is the mathematics of convex optimization and convexity, this is a central concept. It just means that the epigraph is closed. And one example would be if you had a..."}],"speech_gaps":[],"frame":"../frames/v013/021.webp","frame_time":3371.74},{"title":"闭函数与最小曲率条件","segments":[{"id":159,"text":"Here's some examples of some closed functions, right? Log sum x. This is because the domain of this is anything, right? So this would count here. Here's another one. This is weird because you might say, but there's a constraint. The constraint is that x lies in the interior of this polyhedron. Because otherwise, I mean, so there's an embedded constraint here. And you might say, no, I don't like that. But this one is perfectly good. All the sublevel sets are closed. And the reason is that the function value goes to infinity as you approach the boundary."},{"id":160,"text":"So we'll get to that. These are technical conditions, I think, not super-duper important. People sometimes assume something like a minimum curvature. So what that says is, for example, the minimum eigenvalue of the Hessian is bigger than some number m, which is positive. That gives you a minimum curvature to the function. That'll allow you to say all sorts of things."},{"id":161,"text":"Yeah, now you could ask questions like, how would you know what the minimum curvature is? Like, it's a good question, right? And the answer is in most cases, you would have absolutely no idea. There are cases where you do. Oh, here's one. If I do, let's say I do multinomial logistic regression and I add quadratic regularization to it, then I just, I don't even count the curvature that comes from the multinomial logistic regression loss."},{"id":162,"text":"And just the quadratic regularization alone gives me a minimum curvature. Everybody follow me? But these are kind of rare, right? But that is an example where you actually would know a candidate value for m, right? Which is literally the, it's going to be the regularization, the ridge regression parameter. Okay, so if this is the case, then this says that f minus m"},{"id":163,"text":"times the norm of, you know, x squared is actually convex. And if you apply that, if you then apply the basic convexity formula to that, you'll find out, it's really cool, you get a strengthened Jensen, you know, I guess it's not Jensen, whatever, you know, this first part, this up to here, that's true, this is true for any convex function, this part."},{"id":164,"text":"That's the basic inequality. What this says is, oh yeah, well it applies with a little bit more. That's the minimum curvature constraint. So it strengthens that basic inequality we saw six weeks ago or whenever it was, seven weeks ago, six. And this means all sorts of cool things because, for example, I could minimize both of these equations over y. On the left,"}],"notes":["本段讨论了闭函数的定义及其与约束条件的关系。讲者指出，闭函数的子水平集必须是闭集，而函数值在接近边界时趋于无穷大。此外，讲者提到在某些情况下，如多分类逻辑回归加上二次正则化时，可以确定最小曲率的下界，这有助于分析函数的凸性。","讲者进一步解释了最小曲率条件的应用，即函数的Hessian矩阵的最小特征值大于某个正数m，这为函数提供了最小曲率。这种条件允许进行更深入的分析，例如加强Jensen不等式。","讲者提到，虽然在大多数情况下无法确定最小曲率，但在某些特殊情况下，如使用岭回归正则化时，可以明确知道m的候选值。这表明正则化参数直接影响函数的最小曲率。","讲者指出，当函数满足最小曲率条件时，可以将函数减去m乘以范数的平方视为凸函数。应用基本凸性公式后，可以得到一个加强的Jensen不等式，这在凸优化中具有重要意义。","讲者提到，这种加强的不等式可以用于优化问题，例如同时最小化两个方程。这表明最小曲率条件在实际应用中具有广泛的用途。","讲者强调，这些条件虽然技术性较强，但并非至关重要。它们为分析函数的性质提供了额外的工具，有助于更深入地理解凸优化问题。"],"formulas":[],"uncertainties":["f minus m times the norm of, you know, x squared is actually convex"],"diagram":"none","start":3511.81,"end":3679.97,"asr_flags":[],"math_clarifications":["原始片段中提到的公式未提供足够的上下文来确认其数学性质，因此无法核定。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3511.81,"text":"Here's some examples of some closed functions, right? Log sum x. This is because the domain of this is anything, right? So this would count here. Here's another one. This is weird because you might say, but there's a constraint. The constraint is that x lies in the interior of this polyhedron. Because otherwise, I mean, so there's an embedded constraint here. And you might say, no, I don't like that. But this one is perfectly good. All the sublevel sets are closed. And the reason is that the function value goes to infinity as you approach the boundary."},{"start":3540.48,"text":"So we'll get to that. These are technical conditions, I think, not super-duper important. People sometimes assume something like a minimum curvature. So what that says is, for example, the minimum eigenvalue of the Hessian is bigger than some number m, which is positive. That gives you a minimum curvature to the function. That'll allow you to say all sorts of things."},{"start":3572.72,"text":"Yeah, now you could ask questions like, how would you know what the minimum curvature is? Like, it's a good question, right? And the answer is in most cases, you would have absolutely no idea. There are cases where you do. Oh, here's one. If I do, let's say I do multinomial logistic regression and I add quadratic regularization to it, then I just, I don't even count the curvature that comes from the multinomial logistic regression loss."},{"start":3601.61,"text":"And just the quadratic regularization alone gives me a minimum curvature. Everybody follow me? But these are kind of rare, right? But that is an example where you actually would know a candidate value for m, right? Which is literally the, it's going to be the regularization, the ridge regression parameter. Okay, so if this is the case, then this says that f minus m"},{"start":3628.38,"text":"times the norm of, you know, x squared is actually convex. And if you apply that, if you then apply the basic convexity formula to that, you'll find out, it's really cool, you get a strengthened Jensen, you know, I guess it's not Jensen, whatever, you know, this first part, this up to here, that's true, this is true for any convex function, this part."},{"start":3652.78,"text":"That's the basic inequality. What this says is, oh yeah, well it applies with a little bit more. That's the minimum curvature constraint. So it strengthens that basic inequality we saw six weeks ago or whenever it was, seven weeks ago, six. And this means all sorts of cool things because, for example, I could minimize both of these equations over y. On the left,"}],"speech_gaps":[],"frame":"../frames/v013/022.webp","frame_time":3523.81},{"title":"梯度下降法与停止准则","segments":[{"id":165,"text":"I get p star, because it's just the minimum f of y. On the right, this is a quadratic function in y. I set the gradient equal to zero, I minimize it, and you get a number, which is actually, it's going to be, anyway, you end up with something that looks like this. You end up with this inequality, right? And so this is kind of cool, because this says that if you wanted a stopping criterion, you would run the algorithm, you'd evaluate the gradient, and when the gradient gets small enough, you quit. And someone says, why are you quitting?"},{"id":166,"text":"And you'd say, well, the gradient is less than something. And they go, yeah, but how far am I from optimal? And then you would say, oh, good question. I can actually bound it. I can say that here's how far you are from the optimal value. No more than 1 over 2m times this. Of course, then, in general, someone would say, how do you know m? And the answer is you don't and blah, blah, blah. But this is the justification you would have for stopping when the gradient is small."},{"id":167,"text":"So we'll say a little bit about descent methods. These are super widely used. And they all have a generic form. And it looks like this. In each step of a descent method, you're going to find something called delta x. And that's called the step or the search direction. Here."},{"id":168,"text":"And so, you know, basically what happens is at iteration k, you have xk, you make some queries to f about, like, what's the gradient or something like that, and then you form this search direction. So you stop and you ask for directions, and it says, well, you're here, you want to minimize, you know, you should kind of go that direct. That's delta x. That's this direction."},{"id":169,"text":"Then what you do is you're going to go in that direction, but with an amount that you're going to then choose. And that amount is scaled by this factor t, which is positive. And this is, that's called sometimes the step size or the step length, even though it need not be, it's not really the length unless the norm of the gradient is equal to one, right? But still people call it the step length or the step size or something like that. So, okay, that's what you do."},{"id":170,"text":"And it turns out if the direction you move in has a negative inner product with the gradient, then it turns out, and if you choose the step size correctly, the new point will actually have a function value less than the original point. That's good. That's called the descent method because you're kind of descending, right? And you end up with a function value that's lower. Okay? So here's like a generic version of it."}],"notes":["本段讲解了梯度下降法的基本思想，即通过计算梯度并沿着负梯度方向移动来寻找函数的最小值。当梯度足够小时，可以作为停止准则。这为算法的终止提供了理论依据。","在停止准则的讨论中，讲者提到梯度的大小可以用来判断是否接近最优解，并且可以给出一个上界来估计当前点与最优值之间的距离。然而，这个上界中的参数m通常是未知的，因此实际应用中需要权衡。","讲者介绍了下降方法的通用形式，即在每一步中计算搜索方向（delta x），并根据梯度信息确定移动方向。搜索方向的选择是下降方法的核心。","在移动方向确定后，需要选择一个合适的步长（t）来控制移动的幅度。步长的选择会影响算法的收敛速度和稳定性，但通常不直接等同于梯度的长度。","讲者指出，如果搜索方向与梯度的内积为负，则在适当选择步长的情况下，新的函数值会比原点的函数值更低。这正是下降方法的名称来源。","最后，讲者总结了下降方法的通用形式，强调了其在优化问题中的广泛应用和基本原理。"],"formulas":[{"latex":"f(x_{k+1}) \u003c f(x_k)","symbols":"新的函数值小于原函数值，表示下降","explanation":"该公式正确表达了下降方法的核心思想，即在每一步迭代中，新的函数值小于原函数值。","evidence":"And it turns out if the direction you move in has a negative inner product with the gradient, then it turns out, and if you choose the step size correctly, the new point will actually have a function value less than the original point. That's good. That's called the descent method because you're kind of descending, right? And you end up with a function value that's lower. Okay? So here's like a generic version of it."}],"uncertainties":[],"diagram":"none","start":3680.53,"end":3839.76,"asr_flags":[],"math_clarifications":["公式 0 的表达不完整且没有提供有效的数学信息，因此被移除。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"raw_segments":[{"start":3680.53,"text":"I get p star, because it's just the minimum f of y. On the right, this is a quadratic function in y. I set the gradient equal to zero, I minimize it, and you get a number, which is actually, it's going to be, anyway, you end up with something that looks like this. You end up with this inequality, right? And so this is kind of cool, because this says that if you wanted a stopping criterion, you would run the algorithm, you'd evaluate the gradient, and when the gradient gets small enough, you quit. And someone says, why are you quitting?"},{"start":3711.16,"text":"And you'd say, well, the gradient is less than something. And they go, yeah, but how far am I from optimal? And then you would say, oh, good question. I can actually bound it. I can say that here's how far you are from the optimal value. No more than 1 over 2m times this. Of course, then, in general, someone would say, how do you know m? And the answer is you don't and blah, blah, blah. But this is the justification you would have for stopping when the gradient is small."},{"start":3739.73,"text":"So we'll say a little bit about descent methods. These are super widely used. And they all have a generic form. And it looks like this. In each step of a descent method, you're going to find something called delta x. And that's called the step or the search direction. Here."},{"start":3763.63,"text":"And so, you know, basically what happens is at iteration k, you have xk, you make some queries to f about, like, what's the gradient or something like that, and then you form this search direction. So you stop and you ask for directions, and it says, well, you're here, you want to minimize, you know, you should kind of go that direct. That's delta x. That's this direction."},{"start":3784.16,"text":"Then what you do is you're going to go in that direction, but with an amount that you're going to then choose. And that amount is scaled by this factor t, which is positive. And this is, that's called sometimes the step size or the step length, even though it need not be, it's not really the length unless the norm of the gradient is equal to one, right? But still people call it the step length or the step size or something like that. So, okay, that's what you do."},{"start":3812.49,"text":"And it turns out if the direction you move in has a negative inner product with the gradient, then it turns out, and if you choose the step size correctly, the new point will actually have a function value less than the original point. That's good. That's called the descent method because you're kind of descending, right? And you end up with a function value that's lower. Okay? So here's like a generic version of it."}],"speech_gaps":[],"frame":"../frames/v013/023.webp","frame_time":3692.53},{"title":"梯度下降法中的搜索方向与步长选择","segments":[{"id":171,"text":"To make this a real algorithm, we have to fill in things. We have to figure out how do you find the descent direction? And then we have to figure out how do you choose the step length, right? And that's the whole thing, right? And the stopping criterion could be some norm of the gradient. Usually it's not. Usually it's something that is computed as a byproduct of these two steps in here. So this is going to be like hundreds of different methods with different names are going to have exactly this form."},{"id":172,"text":"And they differ in what's the search direction and they differ in what is the line search. So that's the idea. So for line searches, there's a bunch. I mean, here's one. One is an exact line search. That says once you've decided that you're here and you're going in that direction, you actually look at the function restricted to that ray."},{"id":173,"text":"And then you look for the point where along that ray you have the smallest value. So that's called an exact line search. And you can do this in some cases, right? Where you can actually work this out analytically or you can compute it cheaply or something like that, right? So that's one place where you might do this, right?"},{"id":174,"text":"Another one, which sounds much cruder, is called a backtracking line search. And this has many, many names, again, depending on where you came from. It's called an Armijo line search. It's got all sorts of names for it. Armijo condition is at least one of those. I forget what it is in Russian, but they have a different name for it. So there are lots of different names for this. So this has been rediscovered, I don't know, a couple hundred times. Here's the way it works."},{"id":175,"text":"It's actually, it's called backtracking, and it goes like this. You start with t equals 1. So you try x plus delta x. Then what you're going to do is you're going to check whether f has gone down, and this is critical, enough."},{"id":176,"text":"By the way, if it went up, that's really bad, right? In fact, you can even be out of domain. So that would be like a very, you know, that would be it went up a lot because it went up to plus infinity, right? So, okay. So here's what this looks like. Here's t here. Here is the function restricted to t. This would be..."},{"id":177,"text":"the exact line search number. That's the exact step length you would take. You'd take this to minimize this, right? So the way this works is you look at this basic inequality here. That basic inequality is this line right here, right? This dashed line. And what it says is if I put alpha equals one in that equation, I can reverse that inequality. Because basically when I continue this linear thing, this is a lower bound on this."}],"notes":["本段讲解了梯度下降法中如何将基本框架转化为实际算法，需要确定下降方向和步长选择。停止准则通常不是梯度范数，而是由这两个步骤的副产品计算得出。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3841.45,"end":4010.9,"asr_flags":[],"raw_segments":[{"start":3841.45,"text":"To make this a real algorithm, we have to fill in things. We have to figure out how do you find the descent direction? And then we have to figure out how do you choose the step length, right? And that's the whole thing, right? And the stopping criterion could be some norm of the gradient. Usually it's not. Usually it's something that is computed as a byproduct of these two steps in here. So this is going to be like hundreds of different methods with different names are going to have exactly this form."},{"start":3868.86,"text":"And they differ in what's the search direction and they differ in what is the line search. So that's the idea. So for line searches, there's a bunch. I mean, here's one. One is an exact line search. That says once you've decided that you're here and you're going in that direction, you actually look at the function restricted to that ray."},{"start":3895.92,"text":"And then you look for the point where along that ray you have the smallest value. So that's called an exact line search. And you can do this in some cases, right? Where you can actually work this out analytically or you can compute it cheaply or something like that, right? So that's one place where you might do this, right?"},{"start":3915.51,"text":"Another one, which sounds much cruder, is called a backtracking line search. And this has many, many names, again, depending on where you came from. It's called an Armijo line search. It's got all sorts of names for it. Armijo condition is at least one of those. I forget what it is in Russian, but they have a different name for it. So there are lots of different names for this. So this has been rediscovered, I don't know, a couple hundred times. Here's the way it works."},{"start":3941.47,"text":"It's actually, it's called backtracking, and it goes like this. You start with t equals 1. So you try x plus delta x. Then what you're going to do is you're going to check whether f has gone down, and this is critical, enough."},{"start":3957.34,"text":"By the way, if it went up, that's really bad, right? In fact, you can even be out of domain. So that would be like a very, you know, that would be it went up a lot because it went up to plus infinity, right? So, okay. So here's what this looks like. Here's t here. Here is the function restricted to t. This would be..."},{"start":3982.28,"text":"the exact line search number. That's the exact step length you would take. You'd take this to minimize this, right? So the way this works is you look at this basic inequality here. That basic inequality is this line right here, right? This dashed line. And what it says is if I put alpha equals one in that equation, I can reverse that inequality. Because basically when I continue this linear thing, this is a lower bound on this."}],"speech_gaps":[],"frame":"../frames/v013/024.webp","frame_time":3853.45},{"title":"线搜索与步长选择","segments":[{"id":178,"text":"Right? So the actual function value could never be below this, if the function's convex, right? So here's what you do. We put an alpha in there, which is a number that's less than one. Yeah, actually, in fact, it's less than half for weird reasons. I mean, it turns out it's not going to matter what it is, too much. And then we degrade the slope by multiplying by alpha. So here alpha is maybe a third. I just made it up. And that would be this line."},{"id":179,"text":"So if you take a really small step length, you're definitely below this line. Because if you take a really small step length here, this is actually a really good approximation of how much the function is going to go down. And then the rule is you have to be below this dashed line, this degraded predicted line. And so the way that works is you might start here."},{"id":180,"text":"and query the function and find this value, and you're above this. In fact, the most dramatic one is you'd start way out here, and you're over here. And actually, when you do x plus delta x in that case, you actually have a higher value than f of x. Everybody see that? So that would be a particularly poor choice of step length, right? So what you do then is you multiply this by some factor beta. Beta is typically like a half."},{"id":181,"text":"you know people use that they use point one so you you simply say okay that was too much so you you go back by half and you land here you try this one you get this value it's less than this thing and you accept it so you take the first one you accept that's that's backtracking um it looks now you know that your intuition actually the story of a lot of this um unconstrained minimization is i guess there'll be several times when something you would think"},{"id":182,"text":"is right, is just wrong, completely wrong. So now I'll tell you the first one. You would look at this and you'd say, it's obviously, clearly it's better to do an exact line search. That's totally obvious, right? Because you're actually minimizing the function along this line, right? This makes sense. And this crude thing that stops when you've gotten like some acceptable, by the way, people use numbers like alpha equals 0.01."},{"id":183,"text":"Right? Meaning, if you get even just the slightest decrease, like, good, fine, thanks, we'll take it. So, everybody see what I'm saying? So, looks very unsophisticated, right? Anyway, all right, now I'll tell you the punchline. The punchline is, it doesn't make any difference. That, in fact, exact line search is not only not better in practice, it's often worse. And the simple dumb thing actually works just fine, thank you. This is not obvious, right?"}],"notes":["本段讨论了线搜索中步长选择的问题，特别是使用回溯法（backtracking）来确定合适的步长。讲者提到，当步长过大时，函数值可能高于预测的下降线，因此需要回退并尝试更小的步长。回溯法通常使用一个因子（如0.5）来调整步长，直到找到一个满足条件的步长。","讲者指出，虽然精确线搜索（exact line search）在理论上是更优的，因为它沿着搜索方向精确地最小化函数，但在实践中，这种方法并不总是更好，甚至可能更差。这与直觉相悖，因为精确线搜索似乎更合理。","讲者强调，简单的、看似粗糙的步长选择方法（如使用一个较小的步长或回溯法）在实际应用中往往表现良好。这表明，虽然精确线搜索在理论上更优，但在实际优化问题中，简单的策略可能更有效。","讲者提到，人们通常使用一个较小的alpha值（如0.01）来判断是否接受一个步长。如果函数值有轻微的下降，就认为该步长是可接受的。这表明，实际应用中对“足够好”的定义可能较为宽松。","讲者指出，精确线搜索的缺点可能在于计算成本较高，而简单的步长选择方法则更高效。因此，在实际优化问题中，可能更倾向于使用简单的策略，而不是精确的线搜索。","讲者最后总结说，精确线搜索在实践中并不总是更好，甚至可能更差，这与直觉相悖，因此需要进一步理解其背后的数学原理。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4011.46,"end":4171.85,"asr_flags":[],"raw_segments":[{"start":4011.46,"text":"Right? So the actual function value could never be below this, if the function's convex, right? So here's what you do. We put an alpha in there, which is a number that's less than one. Yeah, actually, in fact, it's less than half for weird reasons. I mean, it turns out it's not going to matter what it is, too much. And then we degrade the slope by multiplying by alpha. So here alpha is maybe a third. I just made it up. And that would be this line."},{"start":4040.36,"text":"So if you take a really small step length, you're definitely below this line. Because if you take a really small step length here, this is actually a really good approximation of how much the function is going to go down. And then the rule is you have to be below this dashed line, this degraded predicted line. And so the way that works is you might start here."},{"start":4063.32,"text":"and query the function and find this value, and you're above this. In fact, the most dramatic one is you'd start way out here, and you're over here. uld be the first thing you would think of. Someone says, make me an iterative method. I'm at F, I'm at X, and I evaluate F at that point, and I evaluate a gradient. Now, gradient is pointing in the direction."},{"id":185,"text":"of fastest increase of f. If I move in that direction, f goes up as fast as possible. If I move in the negative gradient descent direction, f goes down as quickly as possible. And not only would you come up with this, but you'd also ask yourself, why would you do anything else? I mean, you realize what... Think about if you didn't do the gradient method..."},{"id":186,"text":"What happens is you arrive here and someone says, where's the negative gradient? You go, that direction. You'd say, well, what does that mean? You go, if you go in that direction, you're going to go down as quickly as possible. And you go, cool. Which way do you recommend I go? And you go, uh, that way. You're like, what? Like, why would you recommend that? Anyway, you will shortly see why, but it's kind of non-intuitive, right? But we'll get to it. Anyway, so gradient method is the most intuitive one. It looks like this."},{"id":187,"text":"It doesn't matter what line search you use. And here it is. And you can prove convergence of this and all that kind of stuff. That's fine. It turns out this is often unbelievably slow. So in fact, we'll see what other search directions can actually dramatically improve this, but this is slow. Very weird. And we'll look at a picture to understand it. So I just take a quadratic. Looks like this, right? And here's some level curves of the quadratic."},{"id":188,"text":"Down here and gamma is a number. Oh, yeah, let's see. So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1, this is 1/2 X1 squared plus X2 squared. Oh, yeah, by the way, what's the gradient in that case if the level sets are just circles? You're here. What is the gradient look like? What is the gradient?"},{"id":189,"text":"In that case, I'll draw this, it's fine. So here's your function. Here are the level sets. Here's zero, right? These are level sets. You're here. The gradient points directly out like that, and the negative gradient points directly towards zero, which is the minimizer. So if I asked you to minimize x1 squared plus x2 squared using the gradient method with an exact line search,"}],"notes":["本段讲解了梯度下降法的基本思想，即通过计算函数在某一点的梯度，沿着负梯度方向进行迭代更新，以达到最小化目标函数的目的。讲者提到梯度方向是函数值上升最快的方向，而负梯度方向则是下降最快的方向，这是梯度下降法的核心思想。","讲者通过一个二次函数的例子来说明梯度下降法的直观理解。当目标函数是二次函数时，其等高线是圆形，梯度方向指向远离最小值点，而负梯度方向则指向最小值点。这说明梯度下降法在这样的问题中具有直观的几何解释。","讲者提到梯度下降法虽然直观，但其收敛速度可能非常慢，因此需要考虑其他搜索方向以提高效率。这表明梯度下降法在某些情况下可能不是最优选择，需要进一步优化。","讲者还提到通过改变参数gamma可以调整等高线的形状，从而影响梯度下降法的收敛过程。这说明梯度下降法的性能可能受到目标函数形状的影响。","讲者在讲解过程中多次强调梯度下降法的直观性和基础性，这表明该方法是优化问题中最基本的算法之一，是理解更复杂优化方法的基础。","讲者通过提问和举例的方式引导学生思考梯度下降法的原理和应用，这有助于加深学生对梯度下降法的理解。"],"formulas":[{"latex":"f(x) = \\frac{1}{2}x_1^2 + x_2^2","symbols":"目标函数为二次函数","explanation":"公式正确，目标函数为二次函数，符合上下文描述的二次函数形式。","evidence":"Down here and gamma is a number. Oh, yeah, let's see So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1 This is 1 half X 1 square plus X 2 squared. Oh, yeah, by the way What's the gradient in that case if the so the level sets are just circles? You're here What what what is the gradient look like? What is the gradient?"},{"latex":"g(x) = \\nabla f(x)","symbols":"梯度","explanation":"公式正确，表示梯度，符合上下文描述的梯度方向。","evidence":"Down here and gamma is a number. Oh, yeah, let's see So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1 This is 1 half X 1 square plus X 2 squared. Oh, yeah, by the way What's the gradient in that case if the so the level sets are just circles? You're here What what what is the gradient look like? What is the gradient?"},{"latex":"-g(x) = -\\nabla f(x)","symbols":"负梯度","explanation":"公式正确，表示负梯度方向，符合上下文描述的负梯度方向。","evidence":"Down here and gamma is a number. Oh, yeah, let's see So gamma allows me to change the eccentricity of the level sets, right? So if gamma equals 1 This is 1 half X 1 square plus X 2 squared. Oh, yeah, by the way What's the gradient in that case if the so the level sets are just circles? You're here What what what is the gradient look like? What is the gradient?"}],"uncertainties":["gamma equals 1 This is 1/2 X1 squared plus X2 squared"],"diagram":"none","start":4173.76,"end":4342.73,"asr_flags":[],"math_clarifications":["公式中的目标函数为二次函数，符合上下文描述的二次函数形式。"],"raw_segments":[{"start":4173.76,"text":"So, okay. Now we get to a gradient descent method. This is the simplest one. Remember, we had to choose a direction. I mean, I would hope it would be the first, it should be the first thing you would think of. Someone says, make me an iterative method. I'm at F, I'm at X, and I evaluate F at that point, and I evaluate a gradient. Now, gradient is pointing in the direction."},{"start":4200.41,"text":"of fastest increase of f. If I move in that direction, f goes up as fast as possible. If I move in the negative gradient descent direction, f goes down as quickly as possible. And not only would you come up with this, but you'd also ask yourself, why would you do anything else? I mean, you realize what... Think about if you didn't do the gradient method..."},{"start":4226.53,"text":"What happens is you arrive here and someone says, where's the negative gradient? You go, that direction. You'd say, well, what does that mean? You go, if you go in that direction, you're going to go down as quickly as possible. And you go, cool. Which way do you recommend I go? And you go, uh, that way. You're like, what? Like, why would you recommend that? Anyway, you will shortly see why, but it's kind of non-intuitive, right? But we'll get to it. Anyway, so gradient method is the most intuitive one. It looks like this."},{"start":4254.11,"text":"It doesn't matter what line search you use. And here it is. And you can prove convergence of this and all that kind of stuff. rk out analytically what the iterates are, right? And you get something that looks like this. It's actually a very good picture to have in your mind. Of course, it's totally silly because we don't care about two-dimensional problems. We care about problems with a minimum dimension of 200, 2,000, 20,000, 2 million. But nevertheless..."},{"id":193,"text":"This gives you the picture. So here, this is when it's just slightly eccentric, and these are the level curves, and so the negative gradient is just simply, the gradient, these are orthogonal to the level curves, and it says go in that direction. This is the minimum, because we're doing exact line search, and then it says which way should I go, and you go like that. Everybody?"},{"id":194,"text":"So this has got, people refer to this as zigzagging. We can make it arbitrarily bad, right? We can take gamma equals 1,000, and you'll find out that this thing's basically going like this. And actually, I think there's even a name in Western optimization, it's called the Muratos effect, right? But it's just, the other thing I like is it's just called zigzagging. Everybody got this? So, by the way, you know, when you see this picture, you can kind of..."},{"id":195,"text":"Figure out some things immediately. That would be pretty good, right? So if you're in EE or some of any other field you would say You're kind of going in the right direction on average"},{"id":196,"text":"Right? I mean, the problem is you're just doing this weird thermal thing up and down like this, whereas you want to really kind of be going that way. And so you'd say, you know what? You should run those search directions through a low-pass filter or something. I mean, again, I'm speaking dialect. Or if you do physics, you'd say, yeah, you know, add some momentum to it or something like that. Or viscosity. Add a viscosity term."},{"id":197,"text":"So that you would kind of, then you'd do something that would go right like that and head towards the solution. And those are all methods. We're not going to look at those, but that's kind of the idea. So even this baby example tells us that, oh, but actually we get some really good intuition here. The gradient method works really well when the sublevel sets of your function have low condition number, or they are round."}],"notes":["本段讨论了梯度下降法在特定情况下的表现，特别是当步长选择不当导致算法出现‘锯齿’现象时的情况。讲者指出，当步长γ过大或过小时，算法会表现出极端的不稳定性，这种现象被称为‘zigzagging’。讲者还提到，这种现象在优化领域有特定的名称，如‘Muratos effect’，但更常见的称呼是‘zigzagging’。","讲者通过二维示意图解释了梯度下降法的运作机制，指出负梯度方向与等高线垂直，并且在精确线搜索下，算法会直接朝向最优解。然而，当问题维度较高时，这种二维示意图并不适用，但其提供的直观理解仍然具有价值。","讲者进一步指出，当函数的子水平集具有低条件数或接近圆形时，梯度下降法表现良好。然而，当子水平集的条件数较高时，算法会表现出较差的收敛性，导致‘zigzagging’现象。","讲者提到，为了改善梯度下降法的性能，可以引入低通滤波器、动量项或粘滞项等方法。这些方法通过调整搜索方向，减少算法在优化过程中的震荡，从而提高收敛速度。","讲者强调，虽然这些改进方法在实际应用中非常重要，但本课程不会深入探讨这些方法的具体实现。然而，通过这个简单的例子，学生可以获得关于梯度下降法局限性和改进方向的直观理解。","讲者最后指出，梯度下降法的性能与函数的几何特性密切相关，特别是子水平集的形状和条件数。这些因素决定了算法在实际应用中的收敛速度和稳定性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4343.37,"end":4523.3,"asr_flags":[],"raw_segments":[{"start":4343.37,"text":"Tell me about how well that algorithm's going to work. Like, yeah, very well, like in one step, right? It's going to say, which way should I go? You say steepest descent, which just happens in this case to aim directly at the solution, right? Then you do an exact line search and it's game over. Everybody got that? Okay, so, but now, that makes sense. And in fact, someone who was proposing like, you know, a gradient method would say,"},{"start":4370.93,"text":"Yeah, look how well that works. That's great. Like, why would you not do that? Why would you go in a crazy direction like that, right? But we can actually control the eccentricity by making gamma either really big or really small."},{"start":4388.51,"text":"And in this case, you can actually work out analytically what the iterates are, right? And you get something that looks like this. It's actually a very good picture to have in your mind. Of course, it's totally silly because we don't care about two-dimensional problems. We care about problems with a minimum dimension of 200, 2,000, 20,000, 2 million. But nevertheless..."},{"start":4407.34,"text":"This gives you the picture. So here, this is when it's just slightly eccentric, and these are the level curves, and so the negative gradient is just simply, the gradient, these are orthogonal to the level curves, and it says go in that direction. This is the minimum, because we're doing exact line search, and then it says which way should I go, and you go like that. Everybody?"},{"start":4430.92,"text":"So this has got, people refer to this as zigzagging. We can make it arbitrarily bad, right? We can take gamma equals 1,000, and you'll find out that this thing's basically going like this. And actually, I think there's even a name in Western optimization, it's called the Muratos effect, right? But it's just, the other thing I like is it's just called zigzagging. Everybody got this? So, by the way, you know, when you see this picture, you can kind of..."},{"start":4460.4,"text":"Figure out some things immediately. That would be pretty good, right? So if you're in EE or some of any other field you would say You're kind of going in the right direction on average"},{"start":4473.12,"text":"Right? I mean, the problem is you're just doing this weird thermal thing up and down like this, whereas you want to really kind of be going that way. And so you'd say, you know what? You should run those search directions through a low-pass filter or something. I mean, again, I'm speaking dialect. Or if you do physics, you'd say, yeah, you know, add some momentum to it or something like that. Or viscosity. Add a viscosity term."},{"start":4494.25,"text":"So that you would kind of, then you'd do something that would go right like that and head towards the solution. And those are all methods. We're not going to look at those, but that's kind of the idea. So even this baby example tells us that, oh, but actually we get some really good intuition here. The gradient method works really well when the sublevel sets of your function have low condition number, or they are round."}],"speech_gaps":[],"frame":"../frames/v013/027.webp","frame_time":4355.37},{"title":"线性收敛与线搜索方法","segments":[{"id":198,"text":"Because if they're round, the negative gradient points directly to the solution and you're going to go there quickly. If it has high condition number or if the sublevel sets are weirdly squished out like this, that kind of thing is going to happen. Everybody got that? So that's kind of the picture here."},{"id":199,"text":"That's actually super important observation because we're going to use that. That's actually the segue to basically Thursday's topic, right? So, okay. All right. So here's just some examples. This is a silly function that's non-quadratic. And this happens if you use like a backtracking line search. And here's an exact line search. And you'd look at these two and you'd go like, well, I told you exact line search was way better. But this just shows you kind of the idea."},{"id":200,"text":"But it shows you that in real examples, you're actually getting this Moratos or zigzagging effect, right? And then we can look at that over here and see what that looks like. So this looks like this, right? And let me explain what this is. These are the iterations, right? This is a log scale telling you actually your sub-optimality, right?"},{"id":201,"text":"And what you can see is all sorts of, you see all sorts of weird things here, right? Like the first thing is that actually between zero and like 100 iterations, for whatever reason, the backtracking line search was doing better. Like, I don't know why, but it was. And this is kind of common, right? So this is what it looks like. The other thing you see is that this kind of gets, this gets kind of linear. And that's referred to as linear convergence. But that's a weird use of linear because"},{"id":202,"text":"It's linear on a log or a semi-log plot, right? So it means, because this is a log thing, what linear convergence here means is that each step you do, each iteration, reduces the error by some factor. It's pretty small, frankly, but we can work out what it is, right? If you..."},{"id":203,"text":"if you divided it by, well, let's just say that hit here. So let's take, to go from one to 10 to the minus four, that took you 170 iterations, right? Then that tells you you take 10 to the four and you take that to the one 175th power and that tells you how much your error gets smaller each step, right? So that tells you roughly what it is, right? Okay, so that's called linear convergence."},{"id":204,"text":"Okay, I think maybe what we'll do is, I won't even start the next section, but this is a good place to stop. And we'll continue next time."}],"notes":["本段讲解了线性收敛的概念，指出线性收敛在对数或半对数图中表现为直线，意味着每次迭代都会以固定比例减少误差。这与函数的条件数和子水平集的形状有关，例如高条件数或子水平集被压缩的情况可能导致收敛变慢。","讲者通过具体例子说明了线搜索方法（如回溯线搜索和精确线搜索）在实际应用中的表现差异。回溯线搜索在某些情况下可能比精确线搜索表现更好，但整体上精确线搜索更优。","讲者提到线性收敛的定义是每次迭代减少误差的固定比例，这可以通过对数图中的斜率来估计。例如，从1到10^-4需要170次迭代，这表明每次迭代的误差减少比例约为10^(-4/170)。","讲者强调线性收敛的术语使用可能让人困惑，因为“线性”在这里指的是对数图中的直线，而不是误差随迭代次数呈线性减少。这种术语的使用需要特别注意。","讲者指出，线性收敛的定义是基于对数图的，因此每次迭代的误差减少比例可以通过计算对数图的斜率来确定。这种分析方法在实际应用中非常重要。","讲者最后提到，线性收敛是优化算法中常见的收敛类型，特别是在处理高条件数问题时，线性收敛的特性可以帮助评估算法的性能。"],"formulas":[{"latex":"e_{k+1} = e_k \\times r","symbols":"e_k: 第k次迭代的误差，r: 每次迭代的误差减少比例","explanation":"公式正确，描述了线性收敛的误差递减关系，适用于迭代算法中误差随迭代次数线性减少的情况。","evidence":"It's linear on a log or a semi-log plot, right? So it means, because this is a log thing, what linear convergence here means is that each step you do, each iteration, reduces the error by some factor. It's pretty small, frankly, but we can work out what it is, right? If you..."}],"uncertainties":["10 to the one 175th power"],"diagram":"none","start":4524.78,"end":4693.98,"asr_flags":[],"math_clarifications":["公式中的误差减少比例r是基于对数尺度的线性收敛特性，即每次迭代将误差乘以一个固定比例因子。","部分公式没有返回完整复核结果，已暂时隐藏其自动整理表达；原始讲述仍可展开查看。","部分公式候选未通过数学或来源检查，已  small, frankly, but we can work out what it is, right? If you..."},{"start":4652.11,"text":"if you divided it by, well, let's just say that hit here. So let's take, to go from one to 10 to the minus four, that took you 170 iterations, right? Then that tells you you take 10 to the four and you take that to the one 175th power and that tells you how much your error gets smaller each step, right? So that tells you roughly what it is, right? Okay, so that's called linear convergence."},{"start":4682.28,"text":"Okay, I think maybe what we'll do is, I won't even start the next section, but this is a good place to stop. And we'll continue next time."}],"speech_gaps":[],"frame":"../frames/v013/028.webp","frame_time":4536.78}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
