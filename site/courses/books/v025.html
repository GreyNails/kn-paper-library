<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 15 分层强化学习与模仿学习（Hierarchical RL and IL）</title><link rel="stylesheet" href="../assets/katex.min.css"><style>.speaker-pair{margin:22px 0;padding:16px;border-left:3px solid #4d9995;background:#f8faf9;border-radius:8px}.speaker-en{font-size:15px;color:#526771;line-height:1.7;margin:5px 0 10px}.speaker-zh{font-size:17px;line-height:1.9;color:#163d44;margin:8px 0}.lang-label{font-size:12px;font-weight:700;color:#39817c;letter-spacing:.08em}.translation-pending{color:#77868a;font-size:14px}.bilingual .katex{font-size:1.05em}*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#182d38;font:17px/1.85 system-ui,sans-serif}header{position:sticky;top:0;background:#123c46;color:white;padding:12px 4%;z-index:3;display:flex;align-items:center;gap:14px}a{color:#087885}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 18px}.sheet{background:white;padding:clamp(22px,4vw,55px);border-radius:16px;box-shadow:0 7px 30px #193b4610;min-height:70vh}h1{font-size:27px;line-height:1.4}h2{font-size:23px}p{margin:1em 0}.muted{color:#62777e;font-size:14px}button,select,input{font:inherit;padding:7px 12px;border:1px solid #bccdd1;border-radius:8px;background:white;color:#183d47}button{cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:12px;align-items:center;justify-content:center;margin:24px 0}.formula{padding:20px;background:#f2f7f5;border-left:4px solid #27817d;margin:20px 0;overflow:auto}.diagram{background:#f3f7fa;border-radius:12px;padding:20px}.diagram svg{width:100%;max-height:340px}details{margin:20px 0;padding:12px;border:1px solid #dae2e5;border-radius:8px}summary{cursor:pointer;font-weight:600}.segment{margin:10px 0;font-size:15px}video{width:100%;max-height:65vh;background:#000;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:22px;text-decoration:none;color:inherit}.card:hover{outline:2px solid #5c9999}.tag{font-size:13px;color:#397076}.warning{border-left:4px solid #d8a23f;background:#fff8e7;padding:12px}#toc{max-width:50vw}.sr{position:absolute;left:-10000px}@media(max-width:600px){header{flex-wrap:wrap}.sheet{padding:22px}#toc{max-width:92vw;width:100%}nav{gap:5px}h1{font-size:23px}}@media print{header,nav,video,button,select{display:none}.sheet{box-shadow:none}}</style><header><a href="../../">论文库</a><a href="../index.html">课程目录</a><span>强化学习</span><select id="toc" aria-label="选择知识页"></select><progress id="progress"></progress></header><main><p class="muted">Lecture 15 分层强化学习与模仿学习（Hierarchical RL and IL） · 完整初稿</p><video id="video" hidden controls preload="none"></video><label class="muted">使用对应课程的本地视频 <input id="local-video" type="file" accept="video/*"></label><p id="video-status" class="muted">原视频正在同步，可先阅读本页讲义。</p><article class="sheet" id="sheet"></article><nav><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></main><script type="application/json" id="data">{"bilingual_complete":false,"id":"v025","title":"Lecture 15 分层强化学习与模仿学习（Hierarchical RL and IL）","course":"强化学习","pages":[{"title":"分层强化学习与模仿学习","segments":[{"id":0,"text":"Hi, everyone. Let's get started. In the past couple lectures, we've been talking about training RL and imitation learning systems that can do multiple different tasks. And we first looked at this from the lens of multitask imitation and reinforcement learning, where you condition a policy or a Q function, not just on the state, but also on some sort of descriptor of the task.","start":5.23,"end":28.97},{"id":1,"text":"There are also scenarios in the goal condition setting where that descriptor could actually be a state itself, like a goal state that you're trying to reach. And then more recently, we were talking about meta reinforcement learning, where you could think of that instead of kind of conditioning on a description of the task you want to do, you actually need to figure out from a few examples.","start":30.41,"end":49.07},{"id":2,"text":"and a little bit of experience with rewards, what the task is. And you're trying to train this sort of like few shot policy that can adapt with a small amount of experience. Now, today, we'll be kind of building on some of these concepts and trying to not just train a policy to do multiple tasks, but to actually string together behaviors for multiple tasks into a longer horizon task.","start":49.87,"end":76.76},{"id":3,"text":"So this is where we're going to be talking about where hierarchy might be helpful for solving long-horizon tasks. And then we'll be talking about some of the key design choices behind hierarchical imitation and reinforcement learning methods, including how to represent skills and goals, when to move on from one goal or task to another, and the supervision for the different levels of the hierarchy.","start":78.36,"end":102.42},{"id":4,"text":"So this is where we're going to be talking about where hierarchy might be helpful for solving long-horizon tasks. And then we'll be talking about some of the key design choices behind hierarchical imitation and reinforcement learning methods, including how to represent skills and goals, when to move on from one goal or task to another, and the supervision for the different levels of the hierarchy.","start":104.01,"end":125.55},{"id":5,"text":"subtasks or a number of different steps that you need to take in some sort of sequence or order in order to complete it successfully. So this could be something like cooking a meal. It could be for a robot system. For an LLM agent, it could be trying to fix a bug that's causing a neural network training loss to explode. For an autonomous vehicle, it could be driving to Yosemite. For a different sort of LLM, it could be giving feedback.","start":126.3,"end":155.08},{"id":6,"text":"on a long report. And for these tasks, you can think about how there are oftentimes different steps that you need to complete. Some of those steps might be interdependent on one another, where it makes sense to do one before the other. And other tasks might be something where they're less interdependent and it's actually OK to do those in parallel.","start":155.5,"end":175.33}],"notes":["本段介绍了分层强化学习（Hierarchical RL）和模仿学习（IL）的基本概念，强调了在长时域任务中分层结构的潜在优势。讲者提到，分层方法可以将多个子任务或步骤组合成一个更长的序列，从而更有效地处理复杂任务。","讲者指出，分层强化学习的关键设计选择包括如何表示技能和目标、何时从一个目标或任务转移到另一个，以及不同层级的监督机制。这些设计选择对于构建有效的分层系统至关重要。","在讲授过程中，讲者通过多个例子说明了长时域任务的多样性，包括烹饪、机器人系统、LLM修复神经网络训练损失、自动驾驶和反馈生成等。这些例子展示了分层系统在不同应用场景中的适用性。","讲者还提到，某些步骤之间可能存在依赖关系，需要按顺序执行，而其他步骤则可以并行处理。这种对任务结构的分析有助于设计更高效的分层策略。","讲者强调，分层方法不仅适用于强化学习，也适用于模仿学习，这表明分层结构可以跨不同学习范式进行应用。","最后，讲者指出，分层系统的具体实现方式多种多样，这为后续的深入讨论和实验提供了广泛的可能性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":5.23,"end":175.33,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.23,"text":"Hi, everyone. Let's get started. In the past couple lectures, we've been talking about training RL and imitation learning systems that can do multiple different tasks. And we first looked at this from the lens of multitask imitation and reinforcement learning, where you condition a policy or a Q function, not just on the state, but also on some sort of descriptor of the task."},{"start":30.41,"text":"There are also scenarios in the goal condition setting where that descriptor could actually be a state itself, like a goal state that you're trying to reach. And then more recently, we were talking about meta reinforcement learning, where you could think of that instead of kind of conditioning on a description of the task you want to do, you actually need to figure out from a few examples."},{"start":49.87,"text":"and a little bit of experience with rewards, what the task is. And you're trying to train this sort of like few shot policy that can adapt with a small amount of experience. Now, today, we'll be kind of building on some of these concepts and trying to not just train a policy to do multiple tasks, but to actually string together behaviors for multiple tasks into a longer horizon task."},{"start":78.36,"text":"So this is where we're going to be talking about where hierarchy might be helpful for solving long-horizon tasks. And then we'll be talking about some of the key design choices behind hierarchical imitation and reinforcement learning methods, including how to represent skills and goals, when to move on from one goal or task to another, and the supervision for the different levels of the hierarchy."},{"start":104.01,"text":"And then lastly, we'll go through a couple of examples of what these systems could actually look like because there are a variety of different ways that you could design these hierarchical systems. So the tasks that we'll be talking about today are long horizon tasks. And by long horizon tasks, I mean tasks that take a while to complete and might consist of a number of different"},{"start":126.3,"text":"subtasks or a number of different steps that you need to take in some sort of sequence or order in order to complete it successfully. So this could be something like cooking a meal. It could be for a robot system. For an LLM agent, it could be trying to fix a bug that's causing a neural network training loss to explode. For an autonomous vehicle, it could be driving to Yosemite. For a different sort of LLM, it could be giving feedback."},{"start":155.5,"text":"on a long report. And for these tasks, you can think about how there are oftentimes different steps that you need to complete. Some of those steps might be interdependent on one another, where it makes sense to do one before the other. And other tasks might be something where they're less interdependent and it's actually OK to do those in parallel."}],"speech_gaps":[],"frame":"../frames/v025/001.webp","frame_time":17.23},{"title":"分层强化学习与模仿学习","segments":[{"id":7,"text":"These are really hard problems for AI systems to solve in general. And the reason for that is, there's kind of a number of reasons for that. So the first is that when you are doing a task that takes a long time, you're visiting a large number of states along the way to get there. And every new state that you visit, you need to be able to make decisions for. So you basically just have a much","start":177.38,"end":205.44},{"id":8,"text":"broader distribution that your policy needs to be successful on. There's also a lot of different opportunities to make mistakes. And if you make a mistake, you need to be able to recover from that mistake, if it's something that you can actually recover from. And separate from mistakes, there's also just opportunities to get stuck. For example, if there's one kind of mistake that might, for example, not lead you to actually make progress on the task, and","start":206.05,"end":232.69},{"id":9,"text":"If you're not making progress, then you'll actually just end up in the same state again. And you'll keep on making that same mistake over and over again and essentially just get stuck at performing the task. And these kinds of mistakes are kind of particularly gnarly because when you end up in the same state again, your policy will keep on kind of deterministically staying in that state and never making forward progress towards the goal.","start":234.04,"end":256.75},{"id":10,"text":"And then what's the main idea behind hierarchy? So we've talked about multitask policies where you have some... Actually, let me draw this further to the right. We have some policy that takes as input some state.","start":257.65,"end":276.19},{"id":11,"text":"maybe the state at some time step. And it also takes us and put some task or some goal. I'm going to write this as G for now because this task or goal could take a number of different forms. And this is passed into your policy to produce actions that are trying to address that particular goal. The idea for trying to solve long horizon tasks is if we have a policy that can do a number of different things.","start":276.81,"end":306.2},{"id":12,"text":"Then we could try to break up a bigger task into different subtasks and then use one policy to actually tell this policy what task it should be doing at any given point in time. So for example, you could have another policy here that's actually outputting the goals to be doing.","start":306.73,"end":335.03},{"id":13,"text":"And this policy should also have information about the state as input so that it knows where it is and what goal makes sense for the agent to do. And then optionally, this is often called a low-level policy, or we'll use PI.","start":335.58,"end":354.08}],"notes":["本段讨论了分层强化学习（Hierarchical RL）的基本思想，即通过将复杂任务分解为多个子任务，并使用高层策略来指导低层策略执行特定子任务。高层策略需要根据当前状态和目标来决定执行哪个子任务，而低层策略则专注于完成具体的子任务。","讲者提到，高层策略（称为PI）需要接收状态信息作为输入，以确保它能够根据当前环境状况选择合适的子任务。这种分层结构有助于处理长时序任务，因为低层策略可以专注于短期目标，而高层策略则负责协调整体任务的执行。","在分层强化学习中，高层策略和低层策略的分工是关键。高层策略负责任务分解和目标设定，而低层策略负责具体动作的生成。这种结构可以提高策略的效率和可扩展性，特别是在处理复杂任务时。","讲者还提到，分层强化学习的一个重要优势是能够处理长期任务中的状态空间问题。通过将任务分解为多个子任务，可以减少每个子任务的状态空间复杂度，从而提高学习效率。","此外，讲者强调了分层策略中信息传递的重要性。高层策略需要根据当前状态和目标来生成子任务，而低层策略则需要根据这些子任务来生成具体的动作。这种信息流确保了策略的协调性和一致性。","最后，讲者提到，分层强化学习中的低层策略通常被称为PI（Policy），这表明在分层结构中，不同层次的策略有不同的命名和功能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":177.38,"end":354.08,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":177.38,"text":"These are really hard problems for AI systems to solve in general. And the reason for that is, there's kind of a number of reasons for that. So the first is that when you are doing a task that takes a long time, you're visiting a large number of states along the way to get there. And every new state that you visit, you need to be able to make decisions for. So you basically just have a much"},{"start":206.05,"text":"broader distribution that your policy needs to be successful on. There's also a lot of different opportunities to make mistakes. And if you make a mistake, you need to be able to recover from that mistake, if it's something that you can actually recover from. And separate from mistakes, there's also just opportunities to get stuck. For example, if there's one kind of mistake that might, for example, not lead you to actually make progress on the task, and"},{"start":234.04,"text":"If you're not making progress, then you'll actually just end up in the same state again. And you'll keep on making that same mistake over and over again and essentially just get stuck at performing the task. And these kinds of mistakes are kind of particularly gnarly because when you end up in the same state again, your policy will keep on kind of deterministically staying in that state and never making forward progress towards the goal."},{"start":257.65,"text":"And then what's the main idea behind hierarchy? So we've talked about multitask policies where you have some... Actually, let me draw this further to the right. We have some policy that takes as input some state."},{"start":276.81,"text":"maybe the state at some time step. And it also takes us and put some task or some goal. I'm going to write this as G for now because this task or goal could take a number of different forms. And this is passed into your policy to produce actions that are trying to address that particular goal. The idea for trying to solve long horizon tasks is if we have a policy that can do a number of different things."},{"start":306.73,"text":"Then we could try to break up a bigger task into different subtasks and then use one policy to actually tell this policy what task it should be doing at any given point in time. So for example, you could have another policy here that's actually outputting the goals to be doing."},{"start":335.58,"text":"And this policy should also have information about the state as input so that it knows where it is and what goal makes sense for the agent to do. And then optionally, this is often called a low-level policy, or we'll use PI."}],"speech_gaps":[],"frame":"../frames/v025/002.webp","frame_time":189.38},{"title":"分层强化学习与模仿学习","segments":[{"id":14,"text":"This is kind of the low-level policy. This is doing shorter tasks. And we can refer to this as a high-level policy that's outputting goals for the low-level policy to accomplish. In this policy, it can have a task. You may also... Sorry, I wrote this as low-level. This should be high-level.","start":355.31,"end":371.21},{"id":15,"text":"If you want your policy to be able to do multiple long-horizon tasks, then this high-level policy could also have some sort of task descriptor as input as well, or some sort of goal as input. And so we, for example, could have goal high-level as input to this policy if you want to be completing not just one long-horizon task, but multiple long-horizon tasks.","start":373.87,"end":395.85},{"id":16,"text":"like not just driving to Yosemite, but also being able to drive to the Grand Canyon or L.A. or Seattle or something like that. And the kind of crux underlying this idea is that if we can break up a really long task into smaller parts, then we might be able to better address the problem.","start":396.33,"end":419.46},{"id":17,"text":"Say for example, your long horizon task is to bake a cheesecake. This is a really, really hard problem and if you just tried to train a robot policy to output motor commands for doing this task, it's really hard to figure out what you should be doing at any given point in time.","start":420.96,"end":436.86},{"id":18,"text":"But if you're just starting out, you can think about, okay, what's the first step for accomplishing this? Maybe you need to buy ingredients. Okay, then what's the first step of buying ingredients? Well, maybe you need to go to the store. And how do you get to the store? Well, maybe you need to walk to the door. To walk to the door, you might take a step. How do you take a step? You might contract a muscle. And so you can basically break down a bigger task into a much smaller task. And these smaller tasks are a lot easier to train systems to do.","start":437.79,"end":465.41},{"id":19,"text":"And if you can train systems to do the smaller tasks, then you can try to compose them with a higher level policy to be able to accomplish that more challenging task. So what we can do is for the bake a cheesecake task, we could pass this with a stator observation into a high level policy, which is going to predict an intermediate step, like, for example, go to the store or go to the door.","start":465.79,"end":492.67},{"id":20,"text":"And then that intermediate step, along with the stator observation, will be passed to the low-level policy to predict an action. Now, a couple notes here. So one note is that this low-level policy, this needs to be acting at the original kind of frequency. So if you're...","start":493.21,"end":516.49}],"notes":["本段讲解了分层强化学习的基本概念，即通过将复杂任务分解为多个子任务，利用高层策略来设定目标，低层策略来执行具体动作。高层策略负责规划任务的步骤，而低层策略则专注于完成每个子任务。","讲者提到，高层策略可以接受任务描述或目标作为输入，以完成多个长时域任务。例如，从前往Yosemite开车，也可以扩展到前往大峡谷、洛杉矶或西雅图等不同地点。","讲者以制作芝士蛋糕为例，说明了如何将复杂任务分解为更小的步骤，如购买材料、去商店、走到门口、迈步、收缩肌肉等，这些子任务更容易训练系统完成。","讲者进一步指出，如果能够训练系统完成这些子任务，就可以通过高层策略将它们组合起来，以完成更复杂的任务。例如，将‘去商店’作为中间步骤，传递给低层策略来执行具体动作。","讲者还提到，低层策略需要以原始频率执行动作，即在时间步长上与环境交互的频率一致，以确保任务的连贯性。","讲者最后提到，关于低层策略的更多细节，如如何与高层策略交互，可能在后续内容中进一步展开。"],"formulas":[],"uncertainties":["stator observation"],"diagram":"none","start":355.31,"end":516.49,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":355.31,"text":"This is kind of the low-level policy. This is doing shorter tasks. And we can refer to this as a high-level policy that's outputting goals for the low-level policy to accomplish. In this policy, it can have a task. You may also... Sorry, I wrote this as low-level. This should be high-level."},{"start":373.87,"text":"If you want your policy to be able to do multiple long-horizon tasks, then this high-level policy could also have some sort of task descriptor as input as well, or some sort of goal as input. And so we, for example, could have goal high-level as input to this policy if you want to be completing not just one long-horizon task, but multiple long-horizon tasks."},{"start":396.33,"text":"like not just driving to Yosemite, but also being able to drive to the Grand Canyon or L.A. or Seattle or something like that. And the kind of crux underlying this idea is that if we can break up a really long task into smaller parts, then we might be able to better address the problem."},{"start":420.96,"text":"Say for example, your long horizon task is to bake a cheesecake. This is a really, really hard problem and if you just tried to train a robot policy to output motor commands for doing this task, it's really hard to figure out what you should be doing at any given point in time."},{"start":437.79,"text":"But if you're just starting out, you can think about, okay, what's the first step for accomplishing this? Maybe you need to buy ingredients. Okay, then what's the first step of buying ingredients? Well, maybe you need to go to the store. And how do you get to the store? Well, maybe you need to walk to the door. To walk to the door, you might take a step. How do you take a step? You might contract a muscle. And so you can basically break down a bigger task into a much smaller task. And these smaller tasks are a lot easier to train systems to do."},{"start":465.79,"text":"And if you can train systems to do the smaller tasks, then you can try to compose them with a higher level policy to be able to accomplish that more challenging task. So what we can do is for the bake a cheesecake task, we could pass this with a stator observation into a high level policy, which is going to predict an intermediate step, like, for example, go to the store or go to the door."},{"start":493.21,"text":"And then that intermediate step, along with the stator observation, will be passed to the low-level policy to predict an action. Now, a couple notes here. So one note is that this low-level policy, this needs to be acting at the original kind of frequency. So if you're..."}],"speech_gaps":[],"frame":"../frames/v025/003.webp","frame_time":367.31},{"title":"分层强化学习与模仿学习","segments":[{"id":21,"text":"If you're controlling a robot, maybe this is operating at like 20 hertz. If you're controlling a language model, then this is going to be outputting like word by word. Whereas the high-level policy, it could actually predict goals for the low-level policy at a coarser time scale. And so, for example, it could be outputting goals after you've completed a paragraph for a language model or after you've completed that, like going to the store, for example. It could then give a new goal for the low-level policy to perform.","start":518.25,"end":547.25},{"id":22,"text":"And so we have a high-level policy that predicts intermediate goals, and then the low-level policy tries to accomplish those intermediate goals by predicting actions. Typically, the low-level policy is operating at a higher frequency than the high-level policy. And I should note that I'll refer to these as goals or subtasks.","start":548.26,"end":569.02},{"id":23,"text":"a number of other names for these as well like skills or options. You could also think about these as high-level actions. So these are actions but for a different policy that's operating at a higher level of abstraction than the original policy.","start":570.72,"end":584.72},{"id":24,"text":"And then the other thing here is that this is kind of like a two level hierarchy. But you could also imagine having more than two levels of hierarchy as well. And for example, the baking a cheesecake, you could have maybe one level of hierarchy could be like things like go to the store, like buy the things, bring them back. And a different level of hierarchy might actually be controlling like the motors on a robot in order to accomplish those tasks.","start":587.12,"end":615.2},{"id":25,"text":"And then once we have this sort of hierarchical policy, how do we actually roll it out if we can do these things? So specifically, if we're at, say, we'll start at t equals 1, then...","start":617.3,"end":629.8},{"id":26,"text":"The first step is to predict, or another kind of way to think about kind of predicting a goal is planning. Like we're trying to think forward what is the next step that we should do. So we could try to plan a goal, and this will be by sampling from our high-level policy based off of the current state and optionally some sort of high-level goal.","start":630.32,"end":657.28},{"id":27,"text":"And then we'll be repeatedly sampling from our low-level policy. And so we could repeat first sample an action from the low-level policy using this goal as input. So sample A from high-low level with the state and this goal, the goal from the high level as input.","start":658.76,"end":688.79}],"notes":["本段讲解了分层强化学习中低层策略如何根据高层策略设定的目标进行动作采样。讲者提到，低层策略会重复采样动作，使用当前状态和高层目标作为输入，这表明了分层策略的执行过程。","讲者指出，高层策略负责预测中间目标，而低层策略则负责完成这些目标。低层策略通常以更高的频率运行，这与高层策略的较慢时间尺度形成对比。","讲者提到，分层策略可以有多个层级，例如在制作芝士蛋糕的例子中，高层策略可能包括去商店购买材料，而低层策略则涉及控制机器人的电机完成具体任务。","讲者还提到，高层策略可以被称为技能（skills）或选项（options），这些是更高层次的抽象动作，与原始策略不同。","在执行分层策略时，第一步是预测目标，这可以通过规划（planning）来实现，即根据当前状态和可能的高层目标进行预测。","最后，讲者提到低层策略会重复采样动作，使用当前状态和高层目标作为输入，这表明了分层策略的执行流程。"],"formulas":[],"uncertainties":["high-low level"],"diagram":"none","start":518.25,"end":688.79,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":518.25,"text":"If you're controlling a robot, maybe this is operating at like 20 hertz. If you're controlling a language model, then this is going to be outputting like word by word. Whereas the high-level policy, it could actually predict goals for the low-level policy at a coarser time scale. And so, for example, it could be outputting goals after you've completed a paragraph for a language model or after you've completed that, like going to the store, for example. It could then give a new goal for the low-level policy to perform."},{"start":548.26,"text":"And so we have a high-level policy that predicts intermediate goals, and then the low-level policy tries to accomplish those intermediate goals by predicting actions. Typically, the low-level policy is operating at a higher frequency than the high-level policy. And I should note that I'll refer to these as goals or subtasks."},{"start":570.72,"text":"a number of other names for these as well like skills or options. You could also think about these as high-level actions. So these are actions but for a different policy that's operating at a higher level of abstraction than the original policy."},{"start":587.12,"text":"And then the other thing here is that this is kind of like a two level hierarchy. But you could also imagine having more than two levels of hierarchy as well. And for example, the baking a cheesecake, you could have maybe one level of hierarchy could be like things like go to the store, like buy the things, bring them back. And a different level of hierarchy might actually be controlling like the motors on a robot in order to accomplish those tasks."},{"start":617.3,"text":"And then once we have this sort of hierarchical policy, how do we actually roll it out if we can do these things? So specifically, if we're at, say, we'll start at t equals 1, then..."},{"start":630.32,"text":"The first step is to predict, or another kind of way to think about kind of predicting a goal is planning. Like we're trying to think forward what is the next step that we should do. So we could try to plan a goal, and this will be by sampling from our high-level policy based off of the current state and optionally some sort of high-level goal."},{"start":658.76,"text":"And then we'll be repeatedly sampling from our low-level policy. And so we could repeat first sample an action from the low-level policy using this goal as input. So sample A from high-low level with the state and this goal, the goal from the high level as input."}],"speech_gaps":[],"frame":"../frames/v025/004.webp","frame_time":530.25},{"title":"分层强化学习与模仿学习中的目标规划与策略分工","segments":[{"id":28,"text":"we'll actually execute that action and get the next state. So basically, at that point, t will now become t plus 1, and we'll observe st then again with the same goal as before, but the new state will then be sampling a new action, repeating this process.","start":690.73,"end":715.23},{"id":29,"text":"And then at some point after we have, and we'll talk a little bit about how we decide when to get a new goal, but when we have decided that we're either done with the goal or enough time has passed, then we'll move back to step one to replan a new goal based off of the latest state. Yeah, so the question is...","start":716.41,"end":735.27},{"id":30,"text":"So let's walk through this, and then I'll get to your question in a minute. So is there some initial state or observation? Plan a new goal. Until a new goal is selected, we're going to execute a predicted action according to our low-level policy based off of that predicted goal. And then we'll observe a new observation. Now, why might hierarchy help? Which I think is kind of getting at your question. There's a couple reasons for this. So the first is that typically...","start":736.31,"end":763.77},{"id":31,"text":"We're going to be training this low-level policy to reach goals and this high-level policy to maximize rewards or reach some high-level goals. And this means that the objective for this policy is different than the overall objective of completing the long horizon task. And so this is actually getting different supervision. And this intermediate supervision signal for how to complete intermediate goals or tasks can be useful for guiding the policy towards completing the long horizon task.","start":764.94,"end":792.82},{"id":32,"text":"So you can think about it potentially, it kind of depends on the setup, but you can think about it as a way to leverage intermediate supervision. Now, you can always have intermediate supervision when training a big flat policy as well, where you give it shaped rewards and you give it rewards for completing individual subtasks. But compared to that, the other difference here is that this low-level multitask policy is going to be able to more explicitly share knowledge across the different subtasks.","start":793.34,"end":820.44},{"id":33,"text":"So because, for example, it has this goal as input, it's kind of targeting a particular subtask. And if two subtasks are quite similar to one another, then this policy will be able to kind of share data across those tasks in order to more efficiently learn compared to if you were just to try to train a single policy across the long horizon task.","start":821.33,"end":847.41}],"notes":["本段讲解了分层强化学习中目标规划的过程，包括如何根据当前状态重新规划新目标，以及如何通过低层策略执行动作。讲者提到，当完成当前目标或时间足够时，系统会回到初始步骤重新规划新目标。","讲者进一步解释了分层策略的优势，即低层策略专注于完成子任务，而高层策略则负责最大化奖励或完成高层目标。这种分工使得不同策略可以获取不同的监督信号，从而更有效地完成长期任务。","讲者指出，分层策略的一个关键优势是能够跨子任务共享知识。例如，当两个子任务相似时，低层策略可以通过共享数据更高效地学习，而无需单独训练一个覆盖整个长期任务的单一策略。","讲者提到，虽然在训练单一策略时也可以使用中间监督信号，但分层策略的优势在于其更明确的知识共享机制，这有助于提高学习效率。","讲者强调，分层强化学习的结构依赖于具体任务的设置，但其核心思想是通过分层策略实现更高效的子任务完成和长期目标的实现。","讲者最后指出，分层策略的效率提升来源于其对子任务的针对性处理和知识共享，这在处理复杂、长期任务时尤为重要。"],"formulas":[],"uncertainties":[],"diagram":"none","start":690.73,"end":847.41,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":690.73,"text":"we'll actually execute that action and get the next state. So basically, at that point, t will now become t plus 1, and we'll observe st then again with the same goal as before, but the new state will then be sampling a new action, repeating this process."},{"start":716.41,"text":"And then at some point after we have, and we'll talk a little bit about how we decide when to get a new goal, but when we have decided that we're either done with the goal or enough time has passed, then we'll move back to step one to replan a new goal based off of the latest state. Yeah, so the question is..."},{"start":736.31,"text":"So let's walk through this, and then I'll get to your question in a minute. So is there some initial state or observation? Plan a new goal. Until a new goal is selected, we're going to execute a predicted action according to our low-level policy based off of that predicted goal. And then we'll observe a new observation. Now, why might hierarchy help? Which I think is kind of getting at your question. There's a couple reasons for this. So the first is that typically..."},{"start":764.94,"text":"We're going to be training this low-level policy to reach goals and this high-level policy to maximize rewards or reach some high-level goals. And this means that the objective for this policy is different than the overall objective of completing the long horizon task. And so this is actually getting different supervision. And this intermediate supervision signal for how to complete intermediate goals or tasks can be useful for guiding the policy towards completing the long horizon task."},{"start":793.34,"text":"So you can think about it potentially, it kind of depends on the setup, but you can think about it as a way to leverage intermediate supervision. Now, you can always have intermediate supervision when training a big flat policy as well, where you give it shaped rewards and you give it rewards for completing individual subtasks. But compared to that, the other difference here is that this low-level multitask policy is going to be able to more explicitly share knowledge across the different subtasks."},{"start":821.33,"text":"So because, for example, it has this goal as input, it's kind of targeting a particular subtask. And if two subtasks are quite similar to one another, then this policy will be able to kind of share data across those tasks in order to more efficiently learn compared to if you were just to try to train a single policy across the long horizon task."}],"speech_gaps":[],"frame":"../frames/v025/005.webp","frame_time":702.73},{"title":"分层强化学习与模仿学习中的目标与策略结构","segments":[{"id":34,"text":"In reinforcement learning specifically, you can also think about benefits in terms of exploration. And in particular, when this high-level policy is proposing goals to reach, that's structuring the exploration process to encourage it to explore not just in the original action space, but also in this higher-level goal space. And lastly...","start":848.36,"end":871.78},{"id":35,"text":"There can also be sometimes practical benefits as well. So for example, if you're thinking about this task of making a cheesecake, for example, you might need to be reasoning through the steps for how to do that. And if you have a single policy, then you need to reason through those steps every single time step with that flat policy.","start":873.11,"end":891.05},{"id":36,"text":"So if your robot is operating at 20 hertz, for example, you're going to be reasoning through what is the next thing I should be doing and the way to get there with my action at every single time step, where here we can run this reasoning computation at a lower frequency than the low-level policy. So that can be a practical benefit in terms of compute costs.","start":892.75,"end":912.43},{"id":37,"text":"Yeah, so the question is, can we elaborate on the first point and how the supervision for the low-level policy is different for the high-level policy? So the high-level policy, its goal is to complete the long horizon task. So its goal is to bake the cheesecake, and it gets rewards when the cheesecake is baked. The low-level policy...","start":913.48,"end":933.4},{"id":38,"text":"it gets rewards for completing intermediate subtasks. And so when it, for example, finds the ingredients, pre-heats the oven, that sort of thing, it's getting rewards for completing those tasks. And that sort of intermediate supervision guides it towards completing the long horizon task.","start":934.52,"end":951.04},{"id":39,"text":"Yeah, so the question is, what if you need to be doing multiple tasks at once?","start":951.99,"end":955.55},{"id":40,"text":"So in that case, unless your low-level agent has, I don't know, 10 arms or something,","start":956.25,"end":963.93},{"id":41,"text":"or can output things in parallel, you do need to pick some order for that.","start":964.03,"end":968.33},{"id":42,"text":"Now, the goal of the high-level policy is to figure out whether that order matters or not.","start":968.57,"end":974.05},{"id":43,"text":"And so if it figures out that the order is really important, then it will get rewards.","start":974.23,"end":980.19},{"id":44,"text":"it'll be better able to predict those goals if it predicts the correct order. In other circumstances, if the order doesn't matter, then","start":980.19,"end":986.45},{"id":45,"text":"it should be able to learn that and figure out that it doesn't really matter and it'll just pick one arbitrarily.","start":987.61,"end":994.93},{"id":46,"text":"Now,","start":996.59,"end":997.01},{"id":47,"text":"there's also a question of","start":998.21,"end":999.47},{"id":48,"text":"whether or not we actually need multiple policies in order to get some of these benefits.","start":1000.27,"end":1003.97},{"id":49,"text":"And on the last time we talked about kind of the benefits of what you might get with a hierarchical approach versus just what's called a flat policy with no hierarchy, which is kind of the typical pass in the long horizon task and the state and predict the action.","start":1003.97,"end":1020.29}],"notes":["本段讨论了分层强化学习中是否需要多个策略来获得某些优势的问题。讲者指出，虽然分层策略可以带来结构化探索和计算成本降低等好处，但是否需要多个策略取决于任务的具体需求。例如，在需要同时完成多个任务时，如果没有并行处理能力，就需要确定任务顺序，而高阶策略需要判断顺序是否重要。","讲者提到，如果任务顺序非常重要，高阶策略会通过奖励机制来引导正确顺序的预测；如果顺序不重要，策略可以随意选择一个顺序。这说明了高阶策略在任务规划中的关键作用。","此外，讲者还提到，是否需要多个策略取决于任务的复杂性。在某些情况下，单一策略可能已经足够，但在需要结构化探索或计算效率优化时，分层策略的优势会更加明显。","讲者通过制作芝士蛋糕的例子，说明了分层策略如何将任务分解为子任务，并通过不同层级的策略来处理。这有助于降低计算成本，并提高探索效率。","在讨论任务顺序时，讲者指出，如果低阶策略无法并行处理多个任务，就需要高阶策略来决定任务的执行顺序。这体现了分层策略在任务调度中的重要性。","最后，讲者提到，分层策略与扁平策略的对比，强调了分层结构在处理长时任务时的优势，如结构化探索、计算效率和任务分解等。"],"formulas":[],"uncertainties":[],"diagram":"none","start":848.36,"end":1020.29,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":848.36,"text":"In reinforcement learning specifically, you can also think about benefits in terms of exploration. And in particular, when this high-level policy is proposing goals to reach, that's structuring the exploration process to encourage it to explore not just in the original action space, but also in this higher-level goal space. And lastly..."},{"start":873.11,"text":"There can also be sometimes practical benefits as well. So for example, if you're thinking about this task of making a cheesecake, for example, you might need to be reasoning through the steps for how to do that. And if you have a single policy, then you need to reason through those steps every single time step with that flat policy."},{"start":892.75,"text":"So if your robot is operating at 20 hertz, for example, you're going to be reasoning through what is the next thing I should be doing and the way to get there with my action at every single time step, where here we can run this reasoning computation at a lower frequency than the low-level policy. So that can be a practical benefit in terms of compute costs."},{"start":913.48,"text":"Yeah, so the question is, can we elaborate on the first point and how the supervision for the low-level policy is different for the high-level policy? So the high-level policy, its goal is to complete the long horizon task. So its goal is to bake the cheesecake, and it gets rewards when the cheesecake is baked. The low-level policy..."},{"start":934.52,"text":"it gets rewards for completing intermediate subtasks. And so when it, for example, finds the ingredients, pre-heats the oven, that sort of thing, it's getting rewards for completing those tasks. And that sort of intermediate supervision guides it towards completing the long horizon task."},{"start":951.99,"text":"Yeah, so the question is, what if you need to be doing multiple tasks at once?"},{"start":956.25,"text":"So in that case, unless your low-level agent has, I don't know, 10 arms or something,"},{"start":964.03,"text":"or can output things in parallel, you do need to pick some order for that."},{"start":968.57,"text":"Now, the goal of the high-level policy is to figure out whether that order matters or not."},{"start":974.23,"text":"And so if it figures out that the order is really important, then it will get rewards."},{"start":980.19,"text":"it'll be better able to predict those goals if it predicts the correct order. In other circumstances, if the order doesn't matter, then"},{"start":987.61,"text":"it should be able to learn that and figure out that it doesn't really matter and it'll just pick one arbitrarily."},{"start":996.59,"text":"Now,"},{"start":998.21,"text":"there's also a question of"},{"start":1000.27,"text":"whether or not we actually need multiple policies in order to get some of these benefits."},{"start":1003.97,"text":"And on the last time we talked about kind of the benefits of what you might get with a hierarchical approach versus just what's called a flat policy with no hierarchy, which is kind of the typical pass in the long horizon task and the state and predict the action."}],"speech_gaps":[],"frame":"../frames/v025/006.webp","frame_time":860.36},{"title":"分层强化学习与模仿学习中的中间方法","segments":[{"id":50,"text":"There's actually also an intermediate approach that you can take as well that actually retains a lot of the benefits of hierarchy and actually in some ways has a lot of the same design choices.","start":1021.41,"end":1031.33},{"id":51,"text":"which is something that's a little bit like chain of thought in language models,","start":1032.07,"end":1036.23},{"id":52,"text":"if you're familiar with that, which is that if you have some long-horizon task,","start":1036.43,"end":1040.91},{"id":53,"text":"you could have the policy first reason through what goal or what subtask it should be completing","start":1041.19,"end":1047.97},{"id":54,"text":"and then predict the low-level action.","start":1047.97,"end":1050.55},{"id":55,"text":"So this is kind of combining these two policies into one. But now you're just kind of predicting them in sequence. You're first predicting the goal and then the action. This sort of approach can actually retain a fair number of the benefits. So it can benefit from the same sort of intermediate supervision.","start":1051.23,"end":1067.93},{"id":56,"text":"It also might have some practical downsides. So this doesn't have the practical computational benefits of separating them into two, because then you still have to run this at the full frequency.","start":1069.32,"end":1080.1},{"id":57,"text":"There isn't entirely a conclusion yet, empirically, on whether this is just as good as a hierarchical approach. And you could imagine that there might be benefits in terms of sharing some knowledge with low-level policies versus with a combined approach. So this is an open area of research on whether or not you could just do this. And the only really conclusive downside would be the kind of...","start":1081.83,"end":1105.23},{"id":58,"text":"the computational upside of having reasoning at a lower frequency than taking actions for the first one. So the question is, why is having intermediate supervision helpful? There is a couple of reasons. So if you're in a reinforcement learning setting and your goal is to make a cheesecake and you only get rewards when the cheesecake is baked versus not, then those rewards are going to be really sparse and not","start":1105.61,"end":1129.6},{"id":59,"text":"actually allow you to progress. The second is that even if you say you're in an imitation learning setting and you're just predicting actions, like imitating actions for making a cheesecake, then","start":1130.06,"end":1144.52},{"id":60,"text":"Sometimes if the policy isn't explicitly thinking about what part of that task it might be doing, it might oscillate between different subtasks, especially if it doesn't have a history of past observations. So there's also even benefits in imitation learning settings as well.","start":1146.18,"end":1171.05},{"id":61,"text":"The first is that we've kind of abstractly been talking about these different goals. And we need to think about how to actually represent those different goals.","start":1172.89,"end":1182.85}],"notes":["本段讨论了分层强化学习中的一种中间方法，该方法结合了高层策略和低层策略，通过先预测目标再预测动作来实现任务。这种方法保留了部分分层方法的优势，但可能在计算效率上不如完全分层的方法。","该方法在实际应用中可能有缺点，例如需要在高频下运行，无法享受分层方法带来的计算优势。目前尚无明确的实证结论表明这种方法是否与分层方法效果相当。","中间监督在强化学习和模仿学习中都有帮助。在强化学习中，稀疏奖励可能导致学习困难；在模仿学习中，策略可能在子任务之间震荡，特别是在缺乏历史观察的情况下。","中间监督有助于策略在任务的不同阶段进行更有效的学习，特别是在长期任务中，通过明确目标和子任务可以提高学习效率。","本段还提到，中间方法在模仿学习中也有优势，因为它可以帮助策略更好地理解任务的结构，从而避免在子任务之间震荡。","接下来的讨论将涉及设计选择，包括如何表示不同的目标，这将回答之前提出的一些问题。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1021.41,"end":1182.85,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1021.41,"text":"There's actually also an intermediate approach that you can take as well that actually retains a lot of the benefits of hierarchy and actually in some ways has a lot of the same design choices."},{"start":1032.07,"text":"which is something that's a little bit like chain of thought in language models,"},{"start":1036.43,"text":"if you're familiar with that, which is that if you have some long-horizon task,"},{"start":1041.19,"text":"you could have the policy first reason through what goal or what subtask it should be completing"},{"start":1047.97,"text":"and then predict the low-level action."},{"start":1051.23,"text":"So this is kind of combining these two policies into one. But now you're just kind of predicting them in sequence. You're first predicting the goal and then the action. This sort of approach can actually retain a fair number of the benefits. So it can benefit from the same sort of intermediate supervision."},{"start":1069.32,"text":"It also might have some practical downsides. So this doesn't have the practical computational benefits of separating them into two, because then you still have to run this at the full frequency."},{"start":1081.83,"text":"There isn't entirely a conclusion yet, empirically, on whether this is just as good as a hierarchical approach. And you could imagine that there might be benefits in terms of sharing some knowledge with low-level policies versus with a combined approach. So this is an open area of research on whether or not you could just do this. And the only really conclusive downside would be the kind of..."},{"start":1105.61,"text":"the computational upside of having reasoning at a lower frequency than taking actions for the first one. So the question is, why is having intermediate supervision helpful? There is a couple of reasons. So if you're in a reinforcement learning setting and your goal is to make a cheesecake and you only get rewards when the cheesecake is baked versus not, then those rewards are going to be really sparse and not"},{"start":1130.06,"text":"actually allow you to progress. The second is that even if you say you're in an imitation learning setting and you're just predicting actions, like imitating actions for making a cheesecake, then"},{"start":1146.18,"text":"Sometimes if the policy isn't explicitly thinking about what part of that task it might be doing, it might oscillate between different subtasks, especially if it doesn't have a history of past observations. So there's also even benefits in imitation learning settings as well. So now let's dive into some of the design choices. This will also start to answer some of the questions that have come up as well."},{"start":1172.89,"text":"The first is that we've kind of abstractly been talking about these different goals. And we need to think about how to actually represent those different goals."}],"speech_gaps":[],"frame":"../frames/v025/007.webp","frame_time":1033.4099999999999},{"title":"分层强化学习与模仿学习中的中间目标表示","segments":[{"id":62,"text":"And I actually want to start with this as an exercise for you all to think about what different representations might make sense for different problems. And so I'll give you a few different example problems. And then the goal for you is just kind of think through for that particular problem, what would be kind of sensible intermediate steps for the agent? And how would you actually represent those different intermediate steps?","start":1184.13,"end":1209.49},{"id":63,"text":"So the first task is a robot that wants to learn how to cook Italian dishes like focaccia.","start":1210.3,"end":1215.6},{"id":64,"text":"what would kind of the intermediate steps for those cooking tasks look like if it needs to kind of control its motors to complete that task and the representation for that. The second one is maybe you're developing an autonomous driving bike and you want it to break down kind of navigation and biking to various locations on campus. The third is a language model that is drafting legal briefs, which is also a rather complex and involved.","start":1217.1,"end":1245.16},{"id":65,"text":"process, and then the last is maybe a web agent that needs to plan and book one-week vacations for users. So I'll give you a couple minutes to pick one of these, discuss with your neighbor what intermediate goals would look like, and then we'll come back and discuss. Does anyone want to share what they discussed?","start":1245.59,"end":1266.91},{"id":66,"text":"Cool. Yeah. So for number two, one way that you could address it is the different intermediate goals could be kind of like waypoints towards that particular goal location that you want to reach. And then the representation for that could be GPS coordinates. And the reward for the low-level policy would be like, how close are you to those GPS coordinates? So yeah, something like that makes sense. Anyone else want to share? Either for that problem or a different problem?","start":1268.2,"end":1293.69},{"id":67,"text":"Yeah, cool. So for the fourth one, there's a few different ways you could think about it. You could think about it as like intermediate goals are like booking day one, booking day two, booking day three. Or you could have a more course-defined approach where you're like booking travel, booking, I don't know, hotels or whatever, and then specific activities. One other part of this that I would imagine you need to do is like kind of just generally figuring out what does the user want from their vacation. And so doing kind of high-level research first. And that could be like kind of,","start":1294.65,"end":1323.59},{"id":68,"text":"Also an intermediate goal as part of completing the task. Did anyone pick one or three? Okay, so the intermediate goal are things like opening the cabinet, beating the eggs, and then, sorry, the representation for those goals?","start":1323.85,"end":1335.29}],"notes":["本段讨论了在不同问题中，如何为智能体设计合理的中间目标表示。例如，在烹饪任务中，智能体需要控制其运动以完成任务，中间目标可能包括打开橱柜、打蛋等步骤，而这些目标的表示可能涉及具体的动作序列或状态变量。","在自主驾驶自行车的任务中，中间目标可以是导航到特定位置的路径点（waypoints），其表示可以是GPS坐标，而奖励函数则基于智能体与这些坐标之间的距离。","对于语言模型起草法律简报的任务，中间目标可能涉及理解法律条款、组织论点结构等，而表示可能包括文本片段或逻辑结构。","在规划和预订一周假期的任务中，中间目标可以是按天预订行程，或按类别（如住宿、活动）进行预订，而表示可能涉及用户需求分析和任务分解。","本段强调了中间目标设计的灵活性，不同问题可能需要不同的表示方式，且需要结合任务的具体需求和智能体的能力进行设计。","此外，本段还提到在设计中间目标时，需要考虑如何将高阶目标分解为可执行的子任务，并通过奖励函数引导智能体完成这些子任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1184.13,"end":1335.29,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1184.13,"text":"And I actually want to start with this as an exercise for you all to think about what different representations might make sense for different problems. And so I'll give you a few different example problems. And then the goal for you is just kind of think through for that particular problem, what would be kind of sensible intermediate steps for the agent? And how would you actually represent those different intermediate steps?"},{"start":1210.3,"text":"So the first task is a robot that wants to learn how to cook Italian dishes like focaccia."},{"start":1217.1,"text":"what would kind of the intermediate steps for those cooking tasks look like if it needs to kind of control its motors to complete that task and the representation for that. The second one is maybe you're developing an autonomous driving bike and you want it to break down kind of navigation and biking to various locations on campus. The third is a language model that is drafting legal briefs, which is also a rather complex and involved."},{"start":1245.59,"text":"process, and then the last is maybe a web agent that needs to plan and book one-week vacations for users. So I'll give you a couple minutes to pick one of these, discuss with your neighbor what intermediate goals would look like, and then we'll come back and discuss. Does anyone want to share what they discussed?"},{"start":1268.2,"text":"Cool. Yeah. So for number two, one way that you could address it is the different intermediate goals could be kind of like waypoints towards that particular goal location that you want to reach. And then the representation for that could be GPS coordinates. And the reward for the low-level policy would be like, how close are you to those GPS coordinates? So yeah, something like that makes sense. Anyone else want to share? Either for that problem or a different problem?"},{"start":1294.65,"text":"Yeah, cool. So for the fourth one, there's a few different ways you could think about it. You could think about it as like intermediate goals are like booking day one, booking day two, booking day three. Or you could have a more course-defined approach where you're like booking travel, booking, I don't know, hotels or whatever, and then specific activities. One other part of this that I would imagine you need to do is like kind of just generally figuring out what does the user want from their vacation. And so doing kind of high-level research first. And that could be like kind of,"},{"start":1323.85,"text":"Also an intermediate goal as part of completing the task. Did anyone pick one or three? Okay, so the intermediate goal are things like opening the cabinet, beating the eggs, and then, sorry, the representation for those goals?"}],"speech_gaps":[],"frame":"../frames/v025/008.webp","frame_time":1196.13},{"title":"目标表示与抽象层次的选择","segments":[{"id":69,"text":"All right. Didn't quite get to that. So, but one thing is a few things that you could do for the representation for that is it could just be a natural language. So it could be like literally like the string beat the eggs or open the cabinet. If, for example, if you're cooking something where you want to look in a particular way, you could even have an image as an intermediate goal representation as well, saying like, I want the bread to look like this or that sort of thing. So you could imagine like multimodal goal representations as well.","start":1341.92,"end":1369.24},{"id":70,"text":"So one of the things that I kind of wanted to convey with this exercise is that oftentimes the goal representation that you might pick likely depends on the particular domain or the particular problem. For example, like for biking, it might be something like GPS coordinates, whereas for cooking, it might be language. For booking a vacation, it might also be in language. There might also be images involved and so forth.","start":1370.83,"end":1395.75},{"id":71,"text":"And in terms of what these goal representations might look like, oftentimes you'll want it to be, if you're kind of developing something for many different subtasks, you want it to be fairly expressive. Like if you're trying to cook lots of different meals, natural language is something that's quite expressive and can describe a number of different low-level behaviors. Ideally, it also has some structure.","start":1396.84,"end":1421.0},{"id":72,"text":"And so, for example, if your different goals are just like do subtask one, do subtask two, it's going to be kind of hard for your low-level policy to figure out how those relate to one another. Whereas if you have something like GPS coordinates, then two GPS coordinates that are very close to each other are going to have similar actions. And that sort of structure will make the learning problem a lot easier for the low-level policy.","start":1421.79,"end":1445.83},{"id":73,"text":"And then the third thing is also picking an appropriate level of abstraction. So for the biking task, for example, you can have a level of abstraction that's potentially too low level. So you could have something that's kind of...","start":1447.71,"end":1465.0},{"id":74,"text":"You could also have something too high level, which is like go to the quad or something,","start":1465.37,"end":1470.89},{"id":75,"text":"which might not be particularly helpful in terms of breaking the problem down into smaller steps.","start":1471.07,"end":1476.21},{"id":76,"text":"which might not be particularly helpful in terms of breaking the problem down into smaller steps.","start":1476.35,"end":1480.55},{"id":77,"text":"And choosing the right level of abstraction is often somewhat tricky and can also be domain dependent,","start":1481.07,"end":1489.77},{"id":78,"text":"depending on the particular kind of details of the problem and the application area.","start":1489.77,"end":1495.95},{"id":79,"text":"So the question is, should we also abstract the state space for each layer?","start":1497.31,"end":1500.41},{"id":80,"text":"This depends on whether or not you have access to that sort of abstraction layer.","start":1501.89,"end":1509.87},{"id":81,"text":"Let's see.","start":1513.77,"end":1514.53},{"id":82,"text":"Oftentimes, even for the high-level policy,","start":1514.63,"end":1517.15}],"notes":["本段讨论了目标表示的抽象层次选择问题，指出在强化学习中，选择合适的抽象层次对于任务分解和策略学习至关重要。讲者提到，如果抽象层次过低，例如精确控制踏板速度，可能会导致策略难以处理复杂的任务；而如果抽象层次过高，例如直接命令‘去四轮车’，则可能无法有效分解问题。因此，选择合适的抽象层次是任务设计中的关键问题。","讲者进一步指出，抽象层次的选择通常依赖于具体问题的性质和应用领域。例如，在骑行任务中，过低的抽象层次可能涉及精确的速度控制，而过高的抽象层次可能无法提供足够的细节来指导策略执行。因此，抽象层次的选择需要根据任务的具体需求进行调整。","讲者还提到，是否对每一层的状态空间进行抽象化，取决于是否具备相应的抽象层。这表明，在设计多层强化学习系统时，需要考虑各层之间的信息传递和抽象层次的匹配性，以确保策略的有效性和可学习性。","此外，讲者强调，抽象层次的选择是一个具有挑战性的问题，通常需要结合具体任务的细节和应用领域进行权衡。这表明，在实际应用中，可能需要通过实验和调整来找到最优的抽象层次，以平衡任务分解的效率和策略学习的复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1341.92,"end":1517.15,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1341.92,"text":"All right. Didn't quite get to that. So, but one thing is a few things that you could do for the representation for that is it could just be a natural language. So it could be like literally like the string beat the eggs or open the cabinet. If, for example, if you're cooking something where you want to look in a particular way, you could even have an image as an intermediate goal representation as well, saying like, I want the bread to look like this or that sort of thing. So you could imagine like multimodal goal representations as well."},{"start":1370.83,"text":"So one of the things that I kind of wanted to convey with this exercise is that oftentimes the goal representation that you might pick likely depends on the particular domain or the particular problem. For example, like for biking, it might be something like GPS coordinates, whereas for cooking, it might be language. For booking a vacation, it might also be in language. There might also be images involved and so forth."},{"start":1396.84,"text":"And in terms of what these goal representations might look like, oftentimes you'll want it to be, if you're kind of developing something for many different subtasks, you want it to be fairly expressive. Like if you're trying to cook lots of different meals, natural language is something that's quite expressive and can describe a number of different low-level behaviors. Ideally, it also has some structure."},{"start":1421.79,"text":"And so, for example, if your different goals are just like do subtask one, do subtask two, it's going to be kind of hard for your low-level policy to figure out how those relate to one another. Whereas if you have something like GPS coordinates, then two GPS coordinates that are very close to each other are going to have similar actions. And that sort of structure will make the learning problem a lot easier for the low-level policy."},{"start":1447.71,"text":"And then the third thing is also picking an appropriate level of abstraction. So for the biking task, for example, you can have a level of abstraction that's potentially too low level. So you could have something that's kind of..."},{"start":1465.37,"text":"pedal, I don't know, like current, like exact velocity for the next second."},{"start":1471.07,"text":"You could also have something too high level, which is like go to the quad or something,"},{"start":1476.35,"text":"which might not be particularly helpful in terms of breaking the problem down into smaller steps."},{"start":1481.07,"text":"And choosing the right level of abstraction is often somewhat tricky and can also be domain dependent,"},{"start":1489.77,"text":"depending on the particular kind of details of the problem and the application area."},{"start":1497.31,"text":"So the question is, should we also abstract the state space for each layer?"},{"start":1501.89,"text":"This depends on whether or not you have access to that sort of abstraction layer."},{"start":1513.77,"text":"Let's see."},{"start":1514.63,"text":"Oftentimes, even for the high-level policy,"}],"speech_gaps":[{"start":1510.27,"end":1512.528}],"frame":"../frames/v025/009.webp","frame_time":1353.92},{"title":"分层强化学习与模仿学习中的监督与示例","segments":[{"id":83,"text":"it's helpful for it to have all of the information about the current state in order to make kind of even high-level goal predictions.","start":1517.15,"end":1524.27},{"id":84,"text":"But, yeah, there are kind of some things that you can do.","start":1526.81,"end":1529.81},{"id":85,"text":"For example, you could, for example, like ask a language model to summarize kind of the high-level information about a state","start":1529.89,"end":1535.59},{"id":86,"text":"and have a high-level policy use that information.","start":1535.59,"end":1538.13},{"id":87,"text":"But generally in practice, you'll often use like the same low-level, like the full state information.","start":1539.65,"end":1546.71},{"id":88,"text":"You don't lose too much from doing that as well.","start":1547.19,"end":1549.01},{"id":89,"text":"Now let's talk a little bit about the supervision for each level.","start":1550.53,"end":1553.13},{"id":90,"text":"And for this, I think it's helpful to kind of go through, to kind of consider an example.","start":1553.31,"end":1558.79},{"id":91,"text":"So let's consider an example where you're making...","start":1560.49,"end":1566.61},{"id":92,"text":"And I chose this to be a slightly simpler long horizon task. And you could imagine there being a few steps involved for doing this. And we can kind of abstractly think about the state space for this task and reaching different intermediate steps for this. So, for example, maybe, let's see, let's say that this is your kind of initial state distribution.","start":1567.66,"end":1591.44},{"id":93,"text":"And the steps for making pasta is that you'll need to get out a pot and pasta with some ingredients. You'll need to boil the water, and you'll also need to pour the pasta into the boiling water. Maybe there's also a straining step, but maybe we can skip that for now. And we can think about the...","start":1592.25,"end":1616.59},{"id":94,"text":"Imagine the set of states where you have, for example, you have taken out a pot. So find a pot before actually putting any water into it. You could have some states where you've now have boiled the water. Another set of states where you have found the pasta.","start":1618.8,"end":1647.15},{"id":95,"text":"And then some other states where the pasta is cooked. And let's say that if we have kind of our low-level policy, it's going to be trying to figure out how do I take actions to reach these kinds of states? And then the high-level policy is trying to predict if I'm in a given state, what command should I use to tell the low-level policy what to do?","start":1649.26,"end":1679.3}],"notes":["本段讨论了分层强化学习中监督机制的设计，强调了在不同层级上如何利用信息进行决策。讲者提到，可以使用语言模型对状态的高层信息进行总结，供高层策略使用，但实际应用中通常使用完整的状态信息。","讲者通过制作意大利面的例子，说明了任务的分层结构，包括从初始状态到完成任务的多个中间步骤。这些步骤被抽象为不同的状态空间，如取出锅、烧水、放入意大利面等。","在分层强化学习中，低层策略负责执行具体动作以达到中间状态，而高层策略则负责根据当前状态决定应采取的高层命令。这种分层结构有助于简化复杂任务的决策过程。","讲者提到，高层策略需要预测在给定状态下应使用何种命令来指导低层策略，这体现了分层强化学习中高层与低层策略之间的交互机制。","在实际应用中，虽然可以使用高层信息进行决策，但通常仍会使用完整的状态信息，因为这样不会损失太多信息。","通过这个例子，讲者展示了分层强化学习如何将复杂任务分解为多个子任务，并通过不同层级的策略进行协调，从而提高学习效率。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1517.15,"end":1679.3,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1517.15,"text":"it's helpful for it to have all of the information about the current state in order to make kind of even high-level goal predictions."},{"start":1526.81,"text":"But, yeah, there are kind of some things that you can do."},{"start":1529.89,"text":"For example, you could, for example, like ask a language model to summarize kind of the high-level information about a state"},{"start":1535.59,"text":"and have a high-level policy use that information."},{"start":1539.65,"text":"But generally in practice, you'll often use like the same low-level, like the full state information."},{"start":1547.19,"text":"You don't lose too much from doing that as well."},{"start":1550.53,"text":"Now let's talk a little bit about the supervision for each level."},{"start":1553.31,"text":"And for this, I think it's helpful to kind of go through, to kind of consider an example."},{"start":1560.49,"text":"So let's consider an example where you're making..."},{"start":1567.66,"text":"And I chose this to be a slightly simpler long horizon task. And you could imagine there being a few steps involved for doing this. And we can kind of abstractly think about the state space for this task and reaching different intermediate steps for this. So, for example, maybe, let's see, let's say that this is your kind of initial state distribution."},{"start":1592.25,"text":"And the steps for making pasta is that you'll need to get out a pot and pasta with some ingredients. You'll need to boil the water, and you'll also need to pour the pasta into the boiling water. Maybe there's also a straining step, but maybe we can skip that for now. And we can think about the..."},{"start":1618.8,"text":"Imagine the set of states where you have, for example, you have taken out a pot. So find a pot before actually putting any water into it. You could have some states where you've now have boiled the water. Another set of states where you have found the pasta."},{"start":1649.26,"text":"And then some other states where the pasta is cooked. And let's say that if we have kind of our low-level policy, it's going to be trying to figure out how do I take actions to reach these kinds of states? And then the high-level policy is trying to predict if I'm in a given state, what command should I use to tell the low-level policy what to do?"}],"speech_gaps":[],"frame":"../frames/v025/010.webp","frame_time":1529.15},{"title":"分层强化学习与模仿学习中的监督与策略设计","segments":[{"id":96,"text":"And generally, as we've talked about a bit before, for the low-level policy, it's going to be getting rewards that are based off of the low-level tasks. And the goal of something like this would be something where you're kind of moving towards finding a pot. Maybe then you kind of try to boil the water, then you try to find the pasta, and then you try to cook the pasta.","start":1680.14,"end":1706.32},{"id":97,"text":"One thing that we talked about a little bit before is, so this is actually deviating from this example a little bit, we'll come back to it, is we could also just train the high-level policy and the low-level policy end-to-end without any intermediate goal representation. And so we would just, for example, we'd have some sort of kind of latent goal representation that's just the activations of the neural network. And we could kind of train all of these just for the high-level task and the rewards of completing the task.","start":1708.84,"end":1735.94},{"id":98,"text":"Now, one important thing that is good to know about the supervision is that if you do that, that's basically just a flat policy with a particular architecture that has some activations when you feed in the observation twice. You can just think about that as basically a single neural network architecture that's basically the same as a flat policy.","start":1736.87,"end":1759.39},{"id":99,"text":"And the reason why it's important to recognize this is that when designing these kinds of systems, it's important to think about where the benefits are coming from, whether it's coming from additional supervision, whether it's coming from structured exploration. And if you don't think carefully about this, you could end up in a situation where kind of.","start":1761.26,"end":1778.88},{"id":100,"text":"Intuitively, if you haven't thought about it, it's like, ideally, my high-level policy will do this, my low-level policy will do this, without actually seeing benefits compared to just naively training things with a single policy.","start":1779.47,"end":1790.77},{"id":101,"text":"And it's actually also, for those of you that are doing research, it's also just generally something that's good to do in any kind of research because you never really know if the systems that you're developing or the methods that you're developing are going to improve over some existing kind of state-of-the-art method. And if you're very honest with yourself about what might go wrong and why you might not actually see benefits from your new idea, then you can think more critically about what sorts of things will actually improve the final results.","start":1791.7,"end":1820.82},{"id":102,"text":"Cool. So supervising each level. So we have the low-level policy, and the low-level policy will be trained to accomplish the goal, not the original task. And so when you're passing in the string of find pot, it's going to be giving you a reward that is trying to maximize reward for getting to the states where you have found the pot.","start":1822.06,"end":1846.62}],"notes":["本段讨论了分层强化学习中监督策略的重要性，指出如果直接训练高层和低层策略而不使用中间目标表示，实际上等同于一个扁平策略。这种设计可能不会带来额外的好处，因此需要仔细考虑监督来源和结构化探索的作用。","讲者强调在设计分层系统时，必须明确好处的来源，是来自额外的监督还是结构化的探索。如果不仔细思考，可能会导致系统无法有效提升性能。","讲者提到，对于研究人员来说，诚实评估新方法是否可能优于现有方法是重要的。这有助于更批判性地思考哪些因素能真正提升最终结果。","讲者指出，低层策略应被训练以完成目标，而不是原始任务。例如，当输入“find pot”时，奖励机制会鼓励系统进入找到水壶的状态。","讲者还提到，即使在没有中间目标表示的情况下，直接训练高层和低层策略可能不会带来好处，因此需要仔细分析监督和探索的结构。","讲者强调，研究人员应保持诚实，评估新方法可能失败的原因，并据此更深入地思考如何改进系统。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1680.14,"end":1846.62,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1680.14,"text":"And generally, as we've talked about a bit before, for the low-level policy, it's going to be getting rewards that are based off of the low-level tasks. And the goal of something like this would be something where you're kind of moving towards finding a pot. Maybe then you kind of try to boil the water, then you try to find the pasta, and then you try to cook the pasta."},{"start":1708.84,"text":"One thing that we talked about a little bit before is, so this is actually deviating from this example a little bit, we'll come back to it, is we could also just train the high-level policy and the low-level policy end-to-end without any intermediate goal representation. And so we would just, for example, we'd have some sort of kind of latent goal representation that's just the activations of the neural network. And we could kind of train all of these just for the high-level task and the rewards of completing the task."},{"start":1736.87,"text":"Now, one important thing that is good to know about the supervision is that if you do that, that's basically just a flat policy with a particular architecture that has some activations when you feed in the observation twice. You can just think about that as basically a single neural network architecture that's basically the same as a flat policy."},{"start":1761.26,"text":"And the reason why it's important to recognize this is that when designing these kinds of systems, it's important to think about where the benefits are coming from, whether it's coming from additional supervision, whether it's coming from structured exploration. And if you don't think carefully about this, you could end up in a situation where kind of."},{"start":1779.47,"text":"Intuitively, if you haven't thought about it, it's like, ideally, my high-level policy will do this, my low-level policy will do this, without actually seeing benefits compared to just naively training things with a single policy."},{"start":1791.7,"text":"And it's actually also, for those of you that are doing research, it's also just generally something that's good to do in any kind of research because you never really know if the systems that you're developing or the methods that you're developing are going to improve over some existing kind of state-of-the-art method. And if you're very honest with yourself about what might go wrong and why you might not actually see benefits from your new idea, then you can think more critically about what sorts of things will actually improve the final results."},{"start":1822.06,"text":"Cool. So supervising each level. So we have the low-level policy, and the low-level policy will be trained to accomplish the goal, not the original task. And so when you're passing in the string of find pot, it's going to be giving you a reward that is trying to maximize reward for getting to the states where you have found the pot."}],"speech_gaps":[],"frame":"../frames/v025/011.webp","frame_time":1692.14},{"title":"分层强化学习中的子任务协调与策略连接","segments":[{"id":103,"text":"And the high level policy, its goal is to predict the subtasks so that you end up in the final state of the pasta being cooked. So this is kind of trying to accomplish the original goal. Now, there's a couple of things that can be a little bit tricky about this. So say that you're training these separately and say that you've kind of trained.","start":1848.02,"end":1875.71},{"id":104,"text":"You could, for example, think about training a policy to find the pot. And maybe you've gotten to a good policy that's really good at finding the pot and getting to the state really reliably. And then say, for example, when you have... And then maybe, for example, when you train the policy for finding the pasta, if you did this...","start":1877.71,"end":1901.34},{"id":105,"text":"If you weren't exactly careful with how you did this, maybe you would think about, okay, maybe I could actually just start from this state and also try to find the pasta from this state over here. And that's not taking into account that actually when it's finding the pasta, according to the high-level policy, if the high-level policy actually wanted to find the pasta after boiling the water, when you're at the stove, then we actually try to string together this low-level policy with the low-level policy for these two.","start":1903.15,"end":1931.49},{"id":106,"text":"it'll actually then struggle to transition from going to the stove over to finding where the pasta is. This is basically like a mismatch when you're training these modular systems, and you're training them completely independently, you might not actually get a system that works effectively if they're not actually at some point connected together and trained such that this skill is starting from states where the high-level policy will actually start commanding that task.","start":1932.06,"end":1961.69},{"id":107,"text":"Essentially, when you're training the low-level policy, you have your low-level policy actions given states and goals. You want this policy to work for the set of states where the high-level policy is going to command this particular goal. Another way to think about this is that","start":1962.67,"end":1985.4},{"id":108,"text":"I guess the other thing here is also you want it to be able to pick the goals that actually the high-level policy would predict. So for different distributions of goals and different distributions of states, ideally, that low-level policy would work for whatever states and goals the high-level policy will output. Now, if we haven't actually learned the high-level policy yet, this puts things in a bit of a tricky situation. Likewise, for the high-level policy,","start":1987.24,"end":2016.64}],"notes":["本段讨论了分层强化学习中低级策略与高级策略之间的协调问题。当训练低级策略时，必须确保其能够处理高级策略所指定的目标和状态。如果低级策略没有在高级策略所期望的状态下进行训练，可能会导致策略之间的不匹配，从而影响整体系统的有效性。","高级策略负责预测子任务，而低级策略则负责执行这些子任务。然而，如果低级策略的训练没有考虑到高级策略所指定的上下文，例如在特定状态下执行任务，那么低级策略可能无法正确地与高级策略协同工作。","在训练低级策略时，需要确保其能够适应不同分布的目标和状态。这意味着低级策略必须具备一定的泛化能力，以应对高级策略可能输出的各种状态和目标组合。","如果高级策略尚未训练完成，那么低级策略的训练可能会陷入困境，因为低级策略需要依赖高级策略来确定其目标和状态。这种相互依赖关系使得训练过程更加复杂。","因此，在设计分层强化学习系统时，必须确保低级策略和高级策略之间存在某种形式的连接或协调，以保证整个系统的有效性和一致性。","这种协调问题在模块化系统中尤为明显，因为模块之间通常是独立训练的，缺乏直接的交互机制。因此，需要在训练过程中引入某种形式的连接，以确保策略之间的兼容性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1848.02,"end":2016.64,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1848.02,"text":"And the high level policy, its goal is to predict the subtasks so that you end up in the final state of the pasta being cooked. So this is kind of trying to accomplish the original goal. Now, there's a couple of things that can be a little bit tricky about this. So say that you're training these separately and say that you've kind of trained."},{"start":1877.71,"text":"You could, for example, think about training a policy to find the pot. And maybe you've gotten to a good policy that's really good at finding the pot and getting to the state really reliably. And then say, for example, when you have... And then maybe, for example, when you train the policy for finding the pasta, if you did this..."},{"start":1903.15,"text":"If you weren't exactly careful with how you did this, maybe you would think about, okay, maybe I could actually just start from this state and also try to find the pasta from this state over here. And that's not taking into account that actually when it's finding the pasta, according to the high-level policy, if the high-level policy actually wanted to find the pasta after boiling the water, when you're at the stove, then we actually try to string together this low-level policy with the low-level policy for these two."},{"start":1932.06,"text":"it'll actually then struggle to transition from going to the stove over to finding where the pasta is. This is basically like a mismatch when you're training these modular systems, and you're training them completely independently, you might not actually get a system that works effectively if they're not actually at some point connected together and trained such that this skill is starting from states where the high-level policy will actually start commanding that task."},{"start":1962.67,"text":"Essentially, when you're training the low-level policy, you have your low-level policy actions given states and goals. You want this policy to work for the set of states where the high-level policy is going to command this particular goal. Another way to think about this is that"},{"start":1987.24,"text":"I guess the other thing here is also you want it to be able to pick the goals that actually the high-level policy would predict. So for different distributions of goals and different distributions of states, ideally, that low-level policy would work for whatever states and goals
