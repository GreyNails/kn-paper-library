 replace hierarchy.","zh":"我们之前讨论过，思维链可以替代层次结构。","start":3567.81,"end":3571.09},{"id":241,"text":"And there's also approaches that have developed chain of thought versions of this where you can have some high-level tasks and the current observation.","zh":"还有一些方法发展出了思维链版本的这种结构，其中你可以包含一些高层任务和当前的观察结果。","start":3571.35,"end":3578.09},{"id":242,"text":"And it actually output either sub-goal images or subtasks.","zh":"它实际上会输出子目标图像或子任务。","start":3578.35,"end":3582.23},{"id":243,"text":"You can also have other representations like bounding boxes or waypoints.","zh":"你也可以使用其他表示方式，例如边界框或路标点。","start":3582.23,"end":3585.21},{"id":244,"text":"And then output the action.","zh":"然后输出动作。","start":3586.09,"end":3587.81},{"id":245,"text":"And there are some recent approaches from the last one year, basically, quite recent, that do something like that.","zh":"有一些最近一年内出现的方法，基本上是相当新的，它们会做类似的事情。","start":3588.11,"end":3597.31},{"id":246,"text":"The other thing to note is that this is with imitation learning.","zh":"需要注意的另一点是，这是在模仿学习的框架下进行的。","start":3600.25,"end":3602.95},{"id":247,"text":"And we'll talk about reinforcement learning in a minute.","zh":"然后我们稍后会谈到强化学习。","start":3603.23,"end":3605.59},{"id":248,"text":"it. But generally, for these large-scale systems, to date, for the most part, they use imitation","zh":"它。但总体而言，对于这些大规模系统，到目前为止，大部分情况下都是使用模仿学习，而不是强化学习。","start":3605.59,"end":3611.35},{"id":249,"text":"learning more so than reinforcement learning. And fine-tuning them with reinforcement learning","zh":"并通过强化学习进行微调。在某种程度上，这仍然是一个开放性的研究问题，即如何找到最佳的配方来实现大规模技能的学习？","start":3611.35,"end":3615.79},{"id":250,"text":"in some ways an open kind of research question for like, what is the best recipe for accomplishing that at large skills?","zh":"在某些方面，这是一个开放性的研究问题，比如，如何在大规模技能中实现最佳的配方？","start":3618.59,"end":3624.19},{"id":251,"text":"And it's also a pretty important research direction because if we think about this slide right here, the kind of performance of these systems is still not like super, super reliable. And these are, I should mention, these are in pretty challenging situations with like held out objects that the robot hasn't seen before. So that is kind of out of distribution compared to what it saw during training. But if we had a way to train these with reinforcement learning, then we should be able to get these performances to be much higher compared to using imitation learning.","zh":"因此，问题是，比如我们谈到个性化推荐系统，层次结构是否对它有用？一般来说，我不能说，这并不是我之前见过的东西，而且通常当我看到层次结构时，它通常是用于较长的视野问题和更复杂的任务。在语言建模中，它被用于……","start":3626.15,"end":3653.63},{"id":252,"text":"So the question is, like, we talked about personalized recommendation systems, and could hierarchy be useful for that? Generally, I can't, like, it's not something that I've seen before, and generally when I've seen hierarchy, it's usually been for, like, pretty, like, longer horizon problems and tasks that are more complicated. In, like, language modeling, it's been used for...","zh":"用于数学问题，本质上，以及那些需要多个步骤来完成任务的情况。是的，我可以思考一下。是的，因此在这种情况下，高层策略是一个图像生成模型。它所做的就是，它被训练为以图像观察和某种高层目标作为输入。","start":3654.54,"end":3678.64},{"id":253,"text":"for math problems, essentially, and things where you need to have multiple steps for completing something. Yeah, I could think about it. Yeah, so in this case, the high-level policy is an image generative model. And what it does is it's going to take as input, it's trained to take as input an image observation and some sort of high-level goal.","zh":"对于数学问题，以及需要完成某事的多个步骤的问题，我可以说，我能够思考这个问题。是的，在这种情况下，高层策略是一个图像生成模型。它的作用是将输入作为图像观测和某种高层目标进行训练。","start":3680.91,"end":3708.55}],"notes":["本段讨论了在大规模系统中，模仿学习相较于强化学习的使用情况。讲者指出，目前这些系统主要依赖模仿学习，而通过强化学习进行微调则是一个开放的研究问题，涉及如何在复杂技能中找到最佳的训练方法。","讲者提到，模仿学习的性能在某些挑战性场景下仍不够可靠，特别是当系统面对训练时未见过的对象时。这表明模仿学习在分布外数据上的泛化能力有限，而强化学习可能提供更高的性能。","讲者进一步探讨了分层强化学习在个性化推荐系统中的潜在应用。虽然讲者表示目前尚未见到相关应用，但指出分层方法通常适用于长周期任务和复杂任务，例如数学问题解决，这需要多步骤完成。","讲者提到，高阶策略可以是一个图像生成模型，它接受图像观察和高阶目标作为输入，这表明分层方法可以结合生成模型来实现更复杂的任务分解。","讲者强调，模仿学习和强化学习的结合仍然是一个活跃的研究方向，特别是在如何有效利用两者优势以提升系统性能方面。","讲者指出，模仿学习在面对分布外数据时表现不稳定，而强化学习可能提供更可靠的性能提升，但如何在实际应用中平衡两者仍是研究重点。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3553.93,"end":3708.55,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":3553.93,"text":"And if you add videos of humans for training the high-level policy, you get an increase in performance compared to just using the robot data to train the policies."},{"start":3567.81,"text":"Now, we talked earlier about how chain of thought can replace hierarchy."},{"start":3571.35,"text":"And there's also approaches that have developed chain of thought versions of this where you can have some high-level tasks and the current observation."},{"start":3578.35,"text":"And it actually output either sub-goal images or subtasks."},{"start":3582.23,"text":"You can also have other representations like bounding boxes or waypoints."},{"start":3586.09,"text":"And then output the action."},{"start":3588.11,"text":"And there are some recent approaches from the last one year, basically, quite recent, that do something like that."},{"start":3600.25,"text":"The other thing to note is that this is with imitation learning."},{"start":3603.23,"text":"And we'll talk about reinforcement learning in a minute."},{"start":3605.59,"text":"it. But generally, for these large-scale systems, to date, for the most part, they use imitation"},{"start":3611.35,"text":"learning more so than reinforcement learning. And fine-tuning them with reinforcement learning"},{"start":3618.59,"text":"in some ways an open kind of research question for like, what is the best recipe for accomplishing that at large skills?"},{"start":3626.15,"text":"And it's also a pretty important research direction because if we think about this slide right here, the kind of performance of these systems is still not like super, super reliable. And these are, I should mention, these are in pretty challenging situations with like held out objects that the robot hasn't seen before. So that is kind of out of distribution compared to what it saw during training. But if we had a way to train these with reinforcement learning, then we should be able to get these performances to be much higher compared to using imitation learning."},{"start":3654.54,"text":"So the question is, like, we talked about personalized recommendation systems, and could hierarchy be useful for that? Generally, I can't, like, it's not something that I've seen before, and generally when I've seen hierarchy, it's usually been for, like, pretty, like, longer horizon problems and tasks that are more complicated. In, like, language modeling, it's been used for..."},{"start":3680.91,"text":"for math problems, essentially, and things where you need to have multiple steps for completing something. Yeah, I could think about it. Yeah, so in this case, the high-level policy is an image generative model. And what it does is it's going to take as input, it's trained to take as input an image observation and some sort of high-level goal."}],"speech_gaps":[{"start":3565.648,"end":3567.41},{"start":3597.71,"end":3599.85}],"frame":"../frames/v025/022.webp","frame_time":3565.93},{"title":"分层强化学习与模仿学习中的图像生成与表示","segments":[{"id":254,"text":"like, goal high level, and then you have a neural network, and that neural network is going to be trained to output OT plus K. And so it's going to be trained to generate an image of a future image. Yeah, trained to generate a future image. And you can get this as if you have videos, then you don't need language annotations to get this image.","zh":"比如，目标是高层次的，然后你有一个神经网络，这个神经网络将被训练以输出OT加上K。因此，它将被训练以生成一幅未来图像。是的，被训练以生成未来图像。你可以将这种图像视为如果你有视频，那么你就不需要语言注释来获得这种图像。","start":3709.65,"end":3736.67},{"id":255,"text":"In terms of the architecture, it's using a diffusion model to generate these images. That's why you saw the noise kind of moving into the image. Yeah. In the direction of the goal. Yeah. So this particular goal might be on the horizon of like, I don't know, like a minute. And this sub goal could be in the direction, it could just be like, I don't know, 10 seconds in the future, something like that.","zh":"就架构而言，它使用扩散模型来生成这些图像。这就是你看到噪声逐渐融入图像的原因。是的，在目标的方向上。是的。这个特定的目标可能是在像一分钟这样的时间范围内。而这个子目标可能是在方向上，它可能只是像十秒后的未来那样，类似这样的情况。","start":3738.21,"end":3761.83},{"id":256,"text":"Yeah. So in terms of using image editing models, that sort of general pre-training can be useful","zh":"是的。就使用图像编辑模型而言，这种一般的预训练可能是有用的","start":3762.64,"end":3767.34},{"id":257,"text":"because it teaches the model how to generate images in general. And then the videos that are","zh":"因为它教会了模型如何一般性地生成图像。然后使用的视频","start":3767.34,"end":3771.74},{"id":258,"text":"used, they're actually videos of people doing different tasks that have a single language","zh":"实际上是人们执行不同任务的视频，这些视频有一个单一的语言注释，用于描述整个视频中人物正在做的事情。因此，这些视频特别有用，因为它们相当相关。如果相反你使用YouTube上的随机视频","start":3771.74,"end":3777.02},{"id":259,"text":"annotation for what the person is doing in the whole video. And so those videos are especially","zh":"视频，会有点困难，但可能仍然能教会它一些","start":3777.02,"end":3782.84},{"id":260,"text":"useful to include because they're kind of pretty relevant. If instead you included random videos","zh":"关于如果存在某些","start":3782.84,"end":3787.82},{"id":261,"text":"videos on YouTube, it's a little bit harder, but it might still teach it about like if there's some","zh":"YouTube上的视频，它有点难，但可能仍然能教它一些","start":3787.82,"end":3793.42},{"id":262,"text":"like future thing, what are kind of, what are images that could happen in the future? And that","zh":"比如未来的事情，什么样的图像可能会在未来发生？并且","start":3793.42,"end":3797.94},{"id":263,"text":"is useful pre-training for this kind of task. Yeah. So you're asking like, what if the language","zh":"这对于这种任务来说是有用的预训练。是的。所以你在问，如果语言不够准确的话，","start":3797.94,"end":3803.06},{"id":264,"text":"isn't accurate? And what if the, this is like a sketch instead of like a real image? So good","zh":"如果这只是一个草图而不是真实的图像，那会怎么样？这很好","start":3803.06,"end":3812.22},{"id":265,"text":"Good question.","zh":"好问题。","start":3812.22,"end":3812.56},{"id":266,"text":"I guess first, if you wanted to use sketches here,","zh":"我想首先，如果你想要在这里使用草图，","start":3813.34,"end":3816.16},{"id":267,"text":"you would just want to ideally train a low-level policy","zh":"你理想情况下会训练一个低层次的策略","start":3816.62,"end":3819.08},{"id":268,"text":"to be able to use that sort of thing.","zh":"以能够使用这种类型的输入。","start":3819.08,"end":3820.36},{"id":269,"text":"And there are actually approaches","zh":"实际上有一些方法","start":3820.78,"end":3821.9},{"id":270,"text":"that have taken images, and you can convert them","zh":"这些已经处理过图像，你可以将它们转换","start":3821.9,"end":3823.88},{"id":271,"text":"into a sketch and train a low-level policy to do that.","zh":"为草图，并训练一个低级策略来执行此任务。","start":3823.88,"end":3826.28},{"id":272,"text":"And you don't actually necessarily","zh":"实际上你并不一定","start":3827.42,"end":3829.46},{"id":273,"text":"need this to be a full image.","zh":"需要这个是一个完整的图像。","start":3829.46,"end":3830.64},{"id":274,"text":"And these are just kind of, I should mention,","zh":"这些都是大致的，我应该提到，","start":3831.02,"end":3832.68},{"id":275,"text":"two example representations.","zh":"两种示例表示方法。","start":3832.86,"end":3834.36},{"id":276,"text":"And language is actually particularly popular","zh":"实际上语言作为中间表示特别流行","start":3834.86,"end":3836.48},{"id":277,"text":"as an intermediate representation.","zh":"这一点。","start":3836.9,"end":3838.18},{"id":278,"text":"But there's lots of other representations you could use,","zh":"但你可以使用许多其他表示方法，","start":3838.76,"end":3840.9},{"id":279,"text":"including sketches, including a trace of where you want the robot to go or something like that.","zh":"包括草图，包括你希望机器人去往的位置的轨迹之类的内容。","start":3840.9,"end":3847.36},{"id":280,"text":"And then in cases where the language isn't accurate, if it is describing something that's different, then oftentimes the robot will then follow that different task until it's been told to do something different. And so if the high-level policy is predicting language that is bad, then the system will suffer.","zh":"在语言描述不够准确的情况下，如果它描述的是不同的任务，机器人通常会继续执行这个不同的任务，直到被指示执行其他任务。因此，如果高层策略预测的语言质量较差，系统将会受到影响。","start":3849.18,"end":3867.48}],"notes":["本段主要讨论分层强化学习中使用图像生成模型来预测未来图像，以及如何利用视频数据进行预训练。教师提到使用扩散模型生成图像，并指出目标和子目标的时间范围。此外，还提到使用视频数据进行预训练时，语言注释的重要性，以及使用随机视频可能带来的挑战。","教师进一步讨论了图像生成模型的预训练方法，指出使用视频数据可以提供更相关的训练信息，而随机视频可能难以提供足够的信息。同时，教师提到如果语言不准确，系统可能会执行错误的任务，从而影响整体性能。","教师提到可以使用草图作为另一种表示形式，并指出可以训练低级策略来处理草图。此外，教师还提到语言是常用的中间表示，但也可以使用其他形式，如轨迹信息。","教师强调了语言在分层强化学习中的重要性，但也指出其他表示形式的可行性。同时，教师提到如果语言不准确，系统可能会执行错误的任务，直到被纠正，这说明了语言准确性对系统性能的影响。","教师还提到，即使语言不准确，系统仍然可以执行任务，但可能会导致性能下降。这表明语言作为中间表示的可靠性问题，以及如何处理不准确的语言输入。","教师最后总结了不同表示形式的使用，包括图像、草图和语言，并指出语言是特别流行的中间表示，但其他形式也可以使用。这表明在分层强化学习中，表示形式的选择对系统性能有重要影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3709.65,"end":3867.48,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":27,"raw_segments":[{"start":3709.65,"text":"like, goal high level, and then you have a neural network, and that neural network is going to be trained to output OT plus K. And so it's going to be trained to generate an image of a future image. Yeah, trained to generate a future image. And you can get this as if you have videos, then you don't need language annotations to get this image."},{"start":3738.21,"text":"In terms of the architecture, it's using a diffusion model to generate these images. That's why you saw the noise kind of moving into the image. Yeah. In the direction of the goal. Yeah. So this particular goal might be on the horizon of like, I don't know, like a minute. And this sub goal could be in the direction, it could just be like, I don't know, 10 seconds in the future, something like that."},{"start":3762.64,"text":"Yeah. So in terms of using image editing models, that sort of general pre-training can be useful"},{"start":3767.34,"text":"because it teaches the model how to generate images in general. And then the videos that are"},{"start":3771.74,"text":"used, they're actually videos of people doing different tasks that have a single language"},{"start":3777.02,"text":"annotation for what the person is doing in the whole video. And so those videos are especially"},{"start":3782.84,"text":"useful to include because they're kind of pretty relevant. If instead you included random videos"},{"start":3787.82,"text":"videos on YouTube, it's a little bit harder, but it might still teach it about like if there's some"},{"start":3793.42,"text":"like future thing, what are kind of, what are images that could happen in the future? And that"},{"start":3797.94,"text":"is useful pre-training for this kind of task. Yeah. So you're asking like, what if the language"},{"start":3803.06,"text":"isn't accurate? And what if the, this is like a sketch instead of like a real image? So good"},{"start":3812.22,"text":"Good question."},{"start":3813.34,"text":"I guess first, if you wanted to use sketches here,"},{"start":3816.62,"text":"you would just want to ideally train a low-level policy"},{"start":3819.08,"text":"to be able to use that sort of thing."},{"start":3820.78,"text":"And there are actually approaches"},{"start":3821.9,"text":"that have taken images, and you can convert them"},{"start":3823.88,"text":"into a sketch and train a low-level policy to do that."},{"start":3827.42,"text":"And you don't actually necessarily"},{"start":3829.46,"text":"need this to be a full image."},{"start":3831.02,"text":"And these are just kind of, I should mention,"},{"start":3832.86,"text":"two example representations."},{"start":3834.86,"text":"And language is actually particularly popular"},{"start":3836.9,"text":"as an intermediate representation."},{"start":3838.76,"text":"But there's lots of other representations you could use,"},{"start":3840.9,"text":"including sketches, including a trace of where you want the robot to go or something like that."},{"start":3849.18,"text":"And then in cases where the language isn't accurate, if it is describing something that's different, then oftentimes the robot will then follow that different task until it's been told to do something different. And so if the high-level policy is predicting language that is bad, then the system will suffer."}],"speech_gaps":[],"frame":"../frames/v025/023.webp","frame_time":3721.65},{"title":"分层强化学习与模仿学习中的低级策略与目标设定","segments":[{"id":281,"text":"There are some cases where the low-level policy might also ignore the high-level policy and still, like, if you would kind of give it gibberish, it might just kind of have some sort of, in some ways, like, kind of default behavior because it was trained to output actions, and it often, like, will, like, for, like, different states.","zh":"在某些情况下，低级策略可能会忽略高级策略，例如，如果你给它一些无意义的输入，它可能会表现出某种默认行为，因为它被训练来输出动作，并且在不同的状态下，通常会执行类似的操作。","start":3869.36,"end":3895.7},{"id":282,"text":"For example, if it is in, if it's, like, holding the pasta right here, then even regardless of any sort of language input, chances are the next action is actually to pour it. And so if you don't give it a language instruction or if you give it a noisy language instruction, it might still continue to pour it just because it knows that for that state, typically that's what you do next.","zh":"例如，如果它正在这里拿着意大利面，那么不管有没有语言输入，下一步的动作很可能是把它倒掉。因此，如果你不给它语言指令，或者给它一个嘈杂的语言指令，它仍然可能会继续倒掉意大利面，因为它知道在该状态下，通常下一步就是这么做。","start":3896.62,"end":3922.95},{"id":283,"text":"quite recent. And I don't have too many, I think, exciting examples or examples that I was excited","zh":"这还不是很近的事。我认为我并没有太多令人兴奋的例子，或者我曾经感到兴奋的例子","start":3923.38,"end":3930.74},{"id":284,"text":"quite recent. And I don't have too many, I think, exciting examples or examples that I was excited","zh":"这还不是很近的事。我认为我并没有太多令人兴奋的例子，或者我曾经感到兴奋的例子","start":3930.74,"end":3936.26},{"id":285,"text":"about with regard to hierarchical reinforcement learning. But there are a few example systems","zh":"关于分层强化学习。但有一些示例系统","start":3936.26,"end":3940.24},{"id":286,"text":"that you can look at. And I think that generally getting these kinds of systems to work really","zh":"你可以参考。我认为，一般来说，让这些系统正常工作，尤其是在初始化的分层模仿学习系统之上，","start":3940.24,"end":3944.62},{"id":287,"text":"well, like potentially on top of the initialized hierarchical imitation learning systems is","zh":"是一件非常令人兴奋且重要的事情去探索。但总的来说，在这方面","start":3944.62,"end":3949.48},{"id":288,"text":"something that would be, I think, really exciting and important to explore. But generally, in terms","zh":"我认为，这将是一个真正令人兴奋且重要的研究方向。但就总体而言，在方面","start":3949.48,"end":3953.48},{"id":289,"text":"terms of like what has been done and what exists. You can do hierarchical reinforcement learning","zh":"在谈论已经完成的事情和现有事物的术语中。你可以进行分层强化学习","start":3953.48,"end":3959.86},{"id":290,"text":"with trying to reach different states. And this can be the relative target position of some agents","zh":"以尝试达到不同的状态。这可以是某些代理或某些物体的相对目标位置","start":3959.86,"end":3969.36},{"id":291,"text":"or some objects. And kind of one cool work that does this is it has this like four-legged ant","zh":"有一种相当酷的工作是这样做的，它有一个像四足蚂蚁这样的代理","start":3969.36,"end":3976.76},{"id":292,"text":"agent that you might have worked with in homework one. And its goal is to get over here. And to get","zh":"你可能在第一次作业中使用过这个代理。它的目标是到达这里。为了到达这里，","start":3976.76,"end":3982.46},{"id":293,"text":"get over there, it actually needs to push this object to the right and then move there as a","zh":"它实际上需要将这个物体向右推，然后作为结果移动到这里。然后还有一个例子，","start":3982.46,"end":3986.96},{"id":294,"text":"result. And then there's also this example where it needs to get over here. If it tries to go","zh":"它需要到达这里。如果它直接前往那里，它会掉进这个裂缝中。相反，它需要推动并","start":3986.96,"end":3992.4},{"id":295,"text":"directly there, it will fall in this crevasse. And instead, it needs to push and make a little","zh":"为自己搭建一个小桥，然后走过去到达这里。这些都是相当长的时域","start":3992.4,"end":3999.06},{"id":296,"text":"bridge for itself and then walk over and walk over here. And these are pretty long horizon","zh":"为自己搭建一座桥，然后走过去并走到这里。这些时间跨度相当长","start":3999.06,"end":4002.62},{"id":297,"text":"and so the work trained a goal condition policy","zh":"因此，该工作训练了一个目标条件策略","start":4003.82,"end":4007.04},{"id":298,"text":"and so the work trained a goal condition policy","zh":"因此，该工作训练了一个目标条件策略","start":4007.64,"end":4009.04},{"id":299,"text":"with a reward of reaching those goal states","zh":"并给予到达这些目标状态的奖励","start":4009.58,"end":4011.86},{"id":300,"text":"with a reward of reaching those goal states","zh":"并给予到达这些目标状态的奖励","start":4011.86,"end":4013.56},{"id":301,"text":"and then it trained a high-level policy","zh":"然后它训练了一个高层策略","start":4013.56,"end":4015.0},{"id":302,"text":"and those kind of goal states are the high-level actions.","zh":"这些类型的目标状态就是高层动作","start":4015.0,"end":4017.56},{"id":303,"text":"It actually also used hindsight relabeling for the high-level policy to kind of actually relabel high-level actions or to relabel the goals that the high-level policy should output in certain circumstances.","zh":"它实际上还使用了回顾性重贴标签（hindsight relabeling）来为高层策略进行某种形式的重贴标签，或者重新标记高层策略在某些情况下应该输出的目标","start":4018.7,"end":4034.04},{"id":304,"text":"And it used an off-policy algorithm to train this in order to allow it to work effectively.","zh":"并且它使用了一个离策略算法来训练这个策略，以便使其能够有效工作","start":4034.44,"end":4040.36},{"id":305,"text":"And it used an off-policy algorithm to train this in order to allow it to work effectively.","zh":"并且它使用了一个离策略算法来训练这个策略，以便能够有效运作。","start":4043.82,"end":4049.12}],"notes":["本段讨论了低级策略在忽略高级策略时可能表现出的默认行为，例如在没有语言指令的情况下，仍然执行特定动作。这说明了低级策略在训练过程中学习了某些状态下的典型行为。","接着，课程简要介绍了分层强化学习（Hierarchical RL）的概念，并提到模仿学习系统（Hierarchical Imitation Learning）是相对较新的领域，目前缺乏令人兴奋的实例。","课程提到，尽管目前缺乏令人兴奋的例子，但存在一些可以参考的系统。这些系统通常需要在初始化的分层模仿学习系统基础上进一步优化，以实现更好的性能。","课程还举了两个例子，说明分层强化学习在解决复杂任务中的应用。例如，四足蚂蚁代理需要推动物体并移动到目标位置，或者需要构建桥梁以避免掉入裂缝。","这些任务具有长时间跨度，如果仅采用贪婪策略，可能无法达到目标。因此，研究者训练了目标条件策略，并使用了离策略算法来提高效果。","最后，课程提到另一个分层强化学习的工作使用了语言目标，这表明分层强化学习可以与语言指令结合，以实现更复杂的任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3869.36,"end":4049.12,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":25,"raw_segments":[{"start":3869.36,"text":"There are some cases where the low-level policy might also ignore the high-level policy and still, like, if you would kind of give it gibberish, it might just kind of have some sort of, in some ways, like, kind of default behavior because it was trained to output actions, and it often, like, will, like, for, like, different states. For example, if it is in, if it's, like,"},{"start":3896.62,"text":"holding the pasta right here, then even regardless of any sort of language input, chances are the next action is actually to pour it. And so if you don't give it a language instruction or if you give it a noisy language instruction, it might still continue to pour it just because it knows that for that state, typically that's what you do next. Now let's talk briefly about hierarchical reinforcement learning. So when I was bringing up examples of this, I think that the hierarchical imitation learning systems are like..."},{"start":3923.38,"text":"quite recent. And I don't have too many, I think, exciting examples or examples that I was excited"},{"start":3930.74,"text":"about with regard to hierarchical reinforcement learning. But there are a few example systems"},{"start":3936.26,"text":"that you can look at. And I think that generally getting these kinds of systems to work really"},{"start":3940.24,"text":"well, like potentially on top of the initialized hierarchical imitation learning systems is"},{"start":3944.62,"text":"something that would be, I think, really exciting and important to explore. But generally, in terms"},{"start":3949.48,"text":"terms of like what has been done and what exists. You can do hierarchical reinforcement learning"},{"start":3953.48,"text":"with trying to reach different states. And this can be the relative target position of some agents"},{"start":3959.86,"text":"or some objects. And kind of one cool work that does this is it has this like four-legged ant"},{"start":3969.36,"text":"agent that you might have worked with in homework one. And its goal is to get over here. And to get"},{"start":3976.76,"text":"get over there, it actually needs to push this object to the right and then move there as a"},{"start":3982.46,"text":"result. And then there's also this example where it needs to get over here. If it tries to go"},{"start":3986.96,"text":"directly there, it will fall in this crevasse. And instead, it needs to push and make a little"},{"start":3992.4,"text":"bridge for itself and then walk over and walk over here. And these are pretty long horizon"},{"start":3999.06,"text":"problems where if you just try to take actions greedily, you won't be able to get to the goal."},{"start":4003.82,"text":"and so the work trained a goal condition policy"},{"start":4007.64,"text":"conditioned on goal states"},{"start":4009.58,"text":"with a reward of reaching those goal states"},{"start":4011.86,"text":"and then it trained a high-level policy"},{"start":4013.56,"text":"to output goal states"},{"start":4015.0,"text":"and those kind of goal states are the high-level actions."},{"start":4018.7,"text":"It actually also used hindsight relabeling for the high-level policy to kind of actually relabel high-level actions or to relabel the goals that the high-level policy should output in certain circumstances."},{"start":4034.44,"text":"And it used an off-policy algorithm to train this in order to allow it to work effectively."},{"start":4043.82,"text":"And then another work that does hierarchical reinforcement learning uses language goals."}],"speech_gaps":[],"frame":"../frames/v025/024.webp","frame_time":3881.36},{"title":"分层强化学习与模仿学习","segments":[{"id":306,"text":"So you could do goal states.","zh":"因此，你可以进行目标状态的设定。","start":4049.28,"end":4050.44},{"id":307,"text":"You could also do language goals.","zh":"你也可以进行语言目标的设定。","start":4050.54,"end":4052.14},{"id":308,"text":"This trains a language condition policy.","zh":"这会训练一个语言条件策略。","start":4053.02,"end":4055.08},{"id":309,"text":"It uses language relabeling.","zh":"它使用语言重标记的方法。","start":4055.32,"end":4058.4},{"id":310,"text":"So instead of goal relabeling, it does hindsight relabeling in language space.","zh":"因此，它不是进行目标重标记，而是在语言空间中进行回顾性重标记。","start":4058.52,"end":4062.0},{"id":311,"text":"And then the high-level policy is trained to output language, which is actually a pretty difficult task.","zh":"然后，高层策略被训练以输出语言，这实际上是一个相当困难的任务。","start":4062.54,"end":4068.36},{"id":312,"text":"and it again this this is a work that's not too recent and so it's from like 2019 and so the","zh":"而且，这项工作并不是最近的，大约是2019年的，因此","start":4069.4,"end":4075.9},{"id":313,"text":"tasks are relatively simple where it's trying to be able to arrange these different objects","zh":"任务相对简单，它试图能够排列这些不同的物体","start":4075.9,"end":4080.46},{"id":314,"text":"tasks are relatively simple where it's trying to be able to arrange these different objects","zh":"任务相对简单，其中需要将这些不同的物体排列成特定的顺序","start":4080.46,"end":4084.26},{"id":315,"text":"in particular order where you need to like push the green object push the red object the blue","zh":"比如，你需要像推动绿色物体、红色物体、蓝色物体等这样操作","start":4084.26,"end":4092.3},{"id":316,"text":"object and so forth cool and the last thing that I'll mention is that we've talked about these","zh":"物体等等，很酷。最后我要提到的是，我们已经讨论过这些","start":4092.3,"end":4096.8},{"id":317,"text":"scenarios where you're supervising the low-level policy to like reach some goals and the high-level","zh":"场景，其中你是在监督低层策略以达到某些目标，而高层","start":4096.8,"end":4104.52},{"id":318,"text":"a policy to output those goals. Now, there's, in some ways, like a really cool research direction","zh":"策略则输出这些目标。在某些方面，这其实是一个非常酷的研究方向","start":4104.52,"end":4109.08},{"id":319,"text":"of instead of actually supervising it to do certain goals, can you actually discover","zh":"即，而不是实际监督它去完成某些目标，你能否实际上发现","start":4110.38,"end":4116.26},{"id":320,"text":"intermediate, like discover subtasks or discover skills that might be useful without requiring","zh":"中间的子任务或发现可能有用的技能，而无需对这些低层技能进行监督？","start":4116.26,"end":4124.46},{"id":321,"text":"supervision on those low-level skills? And here's one example of a work that studies that where it,","zh":"这里有一个研究该问题的工作示例，其中它","start":4124.46,"end":4128.42},{"id":322,"text":"But in this kind of simple half cheetah agent that you might have also seen in one of your","zh":"但在你可能在某次作业中见过的这种简单的半猎豹代理中，它能够学习诸如后退、向前行走等技能，","start":4128.42,"end":4135.22},{"id":323,"text":"homeworks, it's able to learn skills like backing up, walking forward, doing I think","zh":"我认为","start":4135.22,"end":4137.54},{"id":324,"text":"And then in principle, if you discovered skills without supervision, then you could try to","zh":"然后，原则上，如果你在没有监督的情况下发现了这些技能，你可以尝试将它们按顺序组合起来完成更复杂的任务。","start":4137.98,"end":4141.96},{"id":325,"text":"sequence those together to do harder tasks.","zh":"但总的来说，这仍然是一个活跃的研究领域，而且在扩展到非常大的","start":4141.96,"end":4144.04},{"id":326,"text":"But this is generally still an active research area and something that's pretty challenging","zh":"要扩展到非常大的","start":4145.02,"end":4149.0},{"id":327,"text":"to scale up, especially in very large","zh":"状态空间时，仍然相当具有挑战性。","start":4149.0,"end":4151.86},{"id":328,"text":"to scale up, especially in very large","zh":"状态空间时，仍然相当具有挑战性。","start":4151.86,"end":4152.46},{"id":329,"text":"state spaces.","zh":"状态空间时，仍然相当具有挑战性。","start":4154.3,"end":4154.9},{"id":330,"text":"That's it, and next time we'll be talking","zh":"好了，下次我们将讨论","start":4155.62,"end":4157.7},{"id":331,"text":"about reinforcement learning for robotics,","zh":"关于机器人领域的强化学习，","start":4157.7,"end":4159.36},{"id":332,"text":"specifically learning with autonomy,","zh":"特别是自主学习，","start":4159.64,"end":4160.9},{"id":333,"text":"and a guest lecture","zh":"以及一个特邀讲座","start":4161.7,"end":4163.88},{"id":334,"text":"from Ashish Kumar on the Tesla Optimist","zh":"由Ashish Kumar主讲的特斯拉乐观主义","start":4163.88,"end":4166.14}],"notes":["本段讨论了分层强化学习中使用语言目标进行训练的方法，其中提到通过语言重贴标签（language relabeling）替代目标重贴标签（goal relabeling），并指出高阶策略输出语言任务的难度。此外，还提到一些研究工作，如2019年的成果，这些任务相对简单，涉及对不同物体进行特定顺序的排列。","讲者进一步指出，除了监督低阶策略以达到某些目标外，还可以探索发现中间的子任务或技能，而无需对这些低阶技能进行监督。例如，一个简单的半猎豹代理（half cheetah agent）能够学习如后退、向前行走、前空翻等技能。","讲者提到，如果能够无监督地发现技能，就可以将这些技能组合起来完成更复杂的任务。然而，这一方向仍然是一个活跃的研究领域，尤其是在大规模状态空间中扩展仍面临挑战。","最后，讲者预告了下一次课程将讨论强化学习在机器人学中的应用，特别是自主学习，并将由Ashish Kumar进行客座讲座，介绍特斯拉的乐观主义（Tesla Optimist）相关内容。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4049.28,"end":4166.14,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":29,"raw_segments":[{"start":4049.28,"text":"So you could do goal states."},{"start":4050.54,"text":"You could also do language goals."},{"start":4053.02,"text":"This trains a language condition policy."},{"start":4055.32,"text":"It uses language relabeling."},{"start":4058.52,"text":"So instead of goal relabeling, it does hindsight relabeling in language space."},{"start":4062.54,"text":"And then the high-level policy is trained to output language, which is actually a pretty difficult task."},{"start":4069.4,"text":"and it again this this is a work that's not too recent and so it's from like 2019 and so the"},{"start":4075.9,"text":"tasks are relatively simple where it's trying to be able to arrange these different objects"},{"start":4080.46,"text":"in particular order where you need to like push the green object push the red object the blue"},{"start":4084.26,"text":"object and so forth cool and the last thing that I'll mention is that we've talked about these"},{"start":4092.3,"text":"scenarios where you're supervising the low-level policy to like reach some goals and the high-level"},{"start":4096.8,"text":"a policy to output those goals. Now, there's, in some ways, like a really cool research direction"},{"start":4104.52,"text":"of instead of actually supervising it to do certain goals, can you actually discover"},{"start":4110.38,"text":"intermediate, like discover subtasks or discover skills that might be useful without requiring"},{"start":4116.26,"text":"supervision on those low-level skills? And here's one example of a work that studies that where it,"},{"start":4124.46,"text":"But in this kind of simple half cheetah agent that you might have also seen in one of your"},{"start":4128.42,"text":"homeworks, it's able to learn skills like backing up, walking forward, doing I think"},{"start":4135.22,"text":"a front flip, and so forth."},{"start":4137.98,"text":"And then in principle, if you discovered skills without supervision, then you could try to"},{"start":4141.96,"text":"sequence those together to do harder tasks."},{"start":4145.02,"text":"But this is generally still an active research area and something that's pretty challenging"},{"start":4149.0,"text":"to scale up, especially in very large"},{"start":4151.86,"text":"state spaces."},{"start":4154.3,"text":"Cool."},{"start":4155.62,"text":"That's it, and next time we'll be talking"},{"start":4157.7,"text":"about reinforcement learning for robotics,"},{"start":4159.64,"text":"specifically learning with autonomy,"},{"start":4161.7,"text":"and a guest lecture"},{"start":4163.88,"text":"from Ashish Kumar on the Tesla Optimist"}],"speech_gaps":[],"frame":"../frames/v025/025.webp","frame_time":4061.28}],"complete":true,"video_url":"https://github.com/GreyNails/kn-paper-library/releases/download/study-course-videos/v025.mp4"}</script><script src="../assets/katex.min.js"></script><script>
function boardGraph(point){let y=20,parts=[],centers=[];const wrap=(s,n)=>{let a=Array.from(String(s)),out=[];while(a.length)out.push(a.splice(0,n).join(''));return out};for(const node of point.nodes){let title=wrap(node.title,30),body=wrap(node.text,34),h=38+title.length*29+body.length*28;centers.push([y,h]);parts.push(`<rect x="30" y="${y}" width="760" height="${h}" rx="12" fill="white" stroke="#9cbfc6" stroke-width="2"/>`);let ty=y+32;for(const t of title){parts.push(`<text x="55" y="${ty}" font-size="23" font-weight="650" fill="#164854">${esc(t)}</text>`);ty+=29}ty+=7;for(const t of body){parts.push(`<text x="55" y="${ty}" font-size="21" fill="#304e58">${esc(t)}</text>`);ty+=28}y+=h+46}for(let i=0;i<centers.length-1;i++){let a=centers[i][0]+centers[i][1],b=centers[i+1][0];parts.push(`<path d="M410 ${a+5} V${b-9}" stroke="#4c8c99" stroke-width="3" fill="none" ${point.relation==='推导顺序'?'marker-end="url(#arrow-'+esc(point.id)+')"':''}/>`)}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 ${y}" role="img" aria-label="${esc(point.title+'：'+point.relation)}"><title>${esc(point.title)}</title><defs><marker id="arrow-${esc(point.id)}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#4c8c99"/></marker></defs>${parts.join('')}</svg>`}
function knowledgeBoard(point){return `<section class="knowledge-board" id="${esc(point.id)}"><header class="board-head" style="position:static;display:block"><span>知识点画板 · ${stamp(point.start)}–${stamp(point.end)}</span><h2>${esc(point.title)}</h2></header><div class="board-body"><p class="board-summary">${translatedProse(point.summary)}</p><div class="board-source"><figure><a href="${esc(point.frame)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(point.frame)}" alt="${esc(point.title)}对应原视频截图"></a><figcaption>原视频截图 · ${stamp(point.frame_time)} · 点击查看图片</figcaption></figure><div><h3>理解路径</h3><ol class="board-steps">${point.steps.map(t=>'<li>'+translatedProse(t)+'</li>').join('')}</ol><button class="board-seek" data-time="${point.start}">回看本知识点 ${stamp(point.start)}</button></div></div><h3>重绘图解 · ${esc(point.relation)}</h3><div class="board-graph">${boardGraph(point)}</div>${(point.formulas||[]).length?'<h3>公式与符号</h3>'+point.formulas.map(formula).join(''):''}${point.conditions?'<p class="board-conditions"><b>适用条件：</b>'+translatedProse(point.conditions)+'</p>':''}${point.pitfall?'<p><b>理解时注意：</b>'+translatedProse(point.pitfall)+'</p>':''}<details><summary>核对讲者依据</summary>${point.source_ids.map(id=>{let s=data.pages.flatMap(p=>p.segments).find(s=>s.id===id);return s?speakerPair(s):''}).join('')}</details></div></section>`}
function seekBoard(t){let v=by('video');if(!v.getAttribute('src')){by('video-status')?.scrollIntoView();return}v.hidden=false;let seek=()=>{v.currentTime=t;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.scrollIntoView({behavior:'smooth'})}
function boardMap(){let target=by('knowledge-map');if(!target)return;let ready=data.pages.filter(p=>p.boards?.length).length;target.innerHTML='<summary>本堂课知识点梳理 · '+ready+' / '+data.pages.length+' 页已配画板</summary>'+data.pages.map((p,i)=>'<details><summary>'+esc(p.title)+'</summary>'+(p.boards?.length?p.boards.map(b=>`<button data-page="${i}" data-point="${esc(b.id)}">${stamp(b.start)} · ${esc(b.title)}</button>`).join(''):'<p class="muted">本时段知识点画板正在整理。</p>')+'</details>').join('');target.querySelectorAll('button').forEach(b=>b.onclick=()=>{go(Number(b.dataset.page));document.getElementById(b.dataset.point)?.scrollIntoView({behavior:'smooth',block:'start'})})}

const data=JSON.parse(document.getElementById('data').textContent),key='study-book-'+data.id;let index=Math.max(0,Math.min(data.pages.length-1,Number(location.hash.slice(1)||localStorage.getItem(key)||0)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=t=>new Date(t*1000).toISOString().slice(11,19);const by=id=>document.getElementById(id);let videoTime=0;
function formula(f){return `<section class="formula"><div class="math" data-latex="${esc(f.latex)}"></div><p>${esc(f.symbols)}</p><p>${esc(f.explanation)}</p><details><summary>公式的讲述依据</summary>${esc(f.evidence)}</details></section>`}
function draw(kind){let x=Number(by('param').value)/100,s='';const line=(a,b,c,d,color='#147e82')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${color}" stroke-width="3"/>`;const text=(a,b,t)=>`<text x="${a}" y="${b}" font-size="17" fill="#24434c">${t}</text>`;const circle=(a,b,r=7)=>`<circle cx="${a}" cy="${b}" r="${r}" fill="#d78036"/>`;const path=points=>`<polyline points="${points.join(' ')}" fill="none" stroke="#147e82" stroke-width="3"/>`;let cap='';
if(kind==='convex'||kind==='gradient'){let pts=[];for(let i=0;i<=100;i++){let t=-2+4*i/100;pts.push(`${70+i*4.6},${270-t*t*48}`)}s=line(50,280,550,280)+path(pts);if(kind==='convex'){let a=70,b=530,y=78;let p=a+x*(b-a),q=270-Math.pow(-2+4*x,2)*48;s+=line(a,y,b,y,'#d78036')+circle(p,y)+circle(p,q)+line(p,y,p,q,'#aaa')+text(80,40,'f(λa+(1−λ)b) ≤ λf(a)+(1−λ)f(b)');cap='抛物线示例：函数上的点位于弦的下方或弦上。滑块改变两端点的混合比例 λ。'}else{let t=1.7,eta=x*.95,next=t-eta*2*t;s+=circle(300+t*115,270-t*t*48)+circle(300+next*115,270-next*next*48)+line(300+t*115,270-t*t*48,300+next*115,270-next*next*48,'#d78036')+text(80,40,'x′ = x − η ∇f(x),  f(x)=x²');cap='教学函数 x²：滑块改变步长 η；橙色连线连接更新前后的参数。步长过大时可能越过最小值。'}}
else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}
else if(kind==='gaussian'){let pts=[],mu=(x-.5)*4;for(let i=0;i<=140;i++){let z=-5+i/14;pts.push(`${30+i*4},${280-200*Math.exp(-.5*(z-mu)**2)}`)}s=path(pts)+line(30,280,590,280)+text(70,35,'N(μ,1)：改变均值 μ');cap='滑块只改变均值，方差保持为 1；概率密度曲线整体平移，形状不变。'}
else if(kind==='policy'||kind==='attention'){let logits=[2*x,1-2*x,.2],e=logits.map(Math.exp),z=e.reduce((a,b)=>a+b),p=e.map(a=>a/z);p.forEach((v,i)=>{s+=`<rect x="${100+150*i}" y="${270-v*220}" width="85" height="${v*220}" fill="#278780"/>`+text(100+150*i,300,(kind==='policy'?'动作 ':'位置 ')+(i+1))+text(100+150*i,255-v*220,v.toFixed(2))});s+=text(70,35,'pᵢ = exp(zᵢ) / Σⱼ exp(zⱼ)');cap='归一化权重的简化示例：改变输入分数，所有权重始终非负且总和为 1。实际策略或注意力分数由模型决定。'}
else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}
else if(kind==='network'){for(let i=0;i<3;i++)for(let j=0;j<3;j++)s+=line(110,80+80*i,300,80+80*j,`rgba(20,126,130,${.15+.8*x})`)+line(300,80+80*i,490,80+80*j,'#95b3b9');for(let a of [110,300,490])for(let j=0;j<3;j++)s+=circle(a,80+j*80,15);s+=text(55,35,'输入 → 隐藏表示 → 输出');cap='网络结构示意；滑块仅改变第一组连线的显示强度，帮助识别层间连接，不模拟真实训练。'}
else if(kind==='diffusion'){for(let i=0;i<18;i++)for(let j=0;j<12;j++){let clean=Math.exp(-((i-8.5)**2+(j-5.5)**2)/20),noise=((Math.sin(i*127+j*311)*43758)%1+1)%1,v=(1-x)*clean+x*noise;s+=`<rect x="${115+i*20}" y="${35+j*20}" width="20" height="20" fill="rgb(${Math.round(255*v)},${Math.round(255*v)},${Math.round(255*v)})"/>`;}cap='固定噪声的线性混合示意：滑块增加噪声占比，展示信号逐渐被淹没。它不是 DDPM 的精确前向方差日程，也不执行去噪采样。'}
by('plot').innerHTML=s;by('graph-caption').textContent=cap;by('value').textContent=x.toFixed(2)}
function translatedProse(text){return String(text).split(/(\$[^$\n]+\$)/g).map(t=>{if(t.startsWith('$')&&t.endsWith('$')){try{return katex.renderToString(t.slice(1,-1),{throwOnError:false,strict:'warn'})}catch(e){return esc(t)}}return esc(t)}).join('')}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.boards?.length?p.boards.map(knowledgeBoard).join(''):'<p class="muted">本页知识点画板正在整理。</p>'}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.board-seek').forEach(b=>b.onclick=()=>seekBoard(Number(b.dataset.time)));if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
