 you do next.","start":3896.62,"end":3922.95},{"id":283,"text":"quite recent. And I don't have too many, I think, exciting examples or examples that I was excited","start":3923.38,"end":3930.74},{"id":284,"text":"quite recent. And I don't have too many, I think, exciting examples or examples that I was excited","start":3930.74,"end":3936.26},{"id":285,"text":"about with regard to hierarchical reinforcement learning. But there are a few example systems","start":3936.26,"end":3940.24},{"id":286,"text":"that you can look at. And I think that generally getting these kinds of systems to work really","start":3940.24,"end":3944.62},{"id":287,"text":"well, like potentially on top of the initialized hierarchical imitation learning systems is","start":3944.62,"end":3949.48},{"id":288,"text":"something that would be, I think, really exciting and important to explore. But generally, in terms","start":3949.48,"end":3953.48},{"id":289,"text":"terms of like what has been done and what exists. You can do hierarchical reinforcement learning","start":3953.48,"end":3959.86},{"id":290,"text":"with trying to reach different states. And this can be the relative target position of some agents","start":3959.86,"end":3969.36},{"id":291,"text":"or some objects. And kind of one cool work that does this is it has this like four-legged ant","start":3969.36,"end":3976.76},{"id":292,"text":"agent that you might have worked with in homework one. And its goal is to get over here. And to get","start":3976.76,"end":3982.46},{"id":293,"text":"get over there, it actually needs to push this object to the right and then move there as a","start":3982.46,"end":3986.96},{"id":294,"text":"result. And then there's also this example where it needs to get over here. If it tries to go","start":3986.96,"end":3992.4},{"id":295,"text":"directly there, it will fall in this crevasse. And instead, it needs to push and make a little","start":3992.4,"end":3999.06},{"id":296,"text":"bridge for itself and then walk over and walk over here. And these are pretty long horizon","start":3999.06,"end":4002.62},{"id":297,"text":"and so the work trained a goal condition policy","start":4003.82,"end":4007.04},{"id":298,"text":"and so the work trained a goal condition policy","start":4007.64,"end":4009.04},{"id":299,"text":"with a reward of reaching those goal states","start":4009.58,"end":4011.86},{"id":300,"text":"with a reward of reaching those goal states","start":4011.86,"end":4013.56},{"id":301,"text":"and then it trained a high-level policy","start":4013.56,"end":4015.0},{"id":302,"text":"and those kind of goal states are the high-level actions.","start":4015.0,"end":4017.56},{"id":303,"text":"It actually also used hindsight relabeling for the high-level policy to kind of actually relabel high-level actions or to relabel the goals that the high-level policy should output in certain circumstances.","start":4018.7,"end":4034.04},{"id":304,"text":"And it used an off-policy algorithm to train this in order to allow it to work effectively.","start":4034.44,"end":4040.36},{"id":305,"text":"And it used an off-policy algorithm to train this in order to allow it to work effectively.","start":4043.82,"end":4049.12}],"notes":["本段讨论了低级策略在忽略高级策略时可能表现出的默认行为，例如在没有语言指令的情况下，仍然执行特定动作。这说明了低级策略在训练过程中学习了某些状态下的典型行为。","接着，课程简要介绍了分层强化学习（Hierarchical RL）的概念，并提到模仿学习系统（Hierarchical Imitation Learning）是相对较新的领域，目前缺乏令人兴奋的实例。","课程提到，尽管目前缺乏令人兴奋的例子，但存在一些可以参考的系统。这些系统通常需要在初始化的分层模仿学习系统基础上进一步优化，以实现更好的性能。","课程还举了两个例子，说明分层强化学习在解决复杂任务中的应用。例如，四足蚂蚁代理需要推动物体并移动到目标位置，或者需要构建桥梁以避免掉入裂缝。","这些任务具有长时间跨度，如果仅采用贪婪策略，可能无法达到目标。因此，研究者训练了目标条件策略，并使用了离策略算法来提高效果。","最后，课程提到另一个分层强化学习的工作使用了语言目标，这表明分层强化学习可以与语言指令结合，以实现更复杂的任务。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3869.36,"end":4049.12,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3869.36,"text":"There are some cases where the low-level policy might also ignore the high-level policy and still, like, if you would kind of give it gibberish, it might just kind of have some sort of, in some ways, like, kind of default behavior because it was trained to output actions, and it often, like, will, like, for, like, different states. For example, if it is in, if it's, like,"},{"start":3896.62,"text":"holding the pasta right here, then even regardless of any sort of language input, chances are the next action is actually to pour it. And so if you don't give it a language instruction or if you give it a noisy language instruction, it might still continue to pour it just because it knows that for that state, typically that's what you do next. Now let's talk briefly about hierarchical reinforcement learning. So when I was bringing up examples of this, I think that the hierarchical imitation learning systems are like..."},{"start":3923.38,"text":"quite recent. And I don't have too many, I think, exciting examples or examples that I was excited"},{"start":3930.74,"text":"about with regard to hierarchical reinforcement learning. But there are a few example systems"},{"start":3936.26,"text":"that you can look at. And I think that generally getting these kinds of systems to work really"},{"start":3940.24,"text":"well, like potentially on top of the initialized hierarchical imitation learning systems is"},{"start":3944.62,"text":"something that would be, I think, really exciting and important to explore. But generally, in terms"},{"start":3949.48,"text":"terms of like what has been done and what exists. You can do hierarchical reinforcement learning"},{"start":3953.48,"text":"with trying to reach different states. And this can be the relative target position of some agents"},{"start":3959.86,"text":"or some objects. And kind of one cool work that does this is it has this like four-legged ant"},{"start":3969.36,"text":"agent that you might have worked with in homework one. And its goal is to get over here. And to get"},{"start":3976.76,"text":"get over there, it actually needs to push this object to the right and then move there as a"},{"start":3982.46,"text":"result. And then there's also this example where it needs to get over here. If it tries to go"},{"start":3986.96,"text":"directly there, it will fall in this crevasse. And instead, it needs to push and make a little"},{"start":3992.4,"text":"bridge for itself and then walk over and walk over here. And these are pretty long horizon"},{"start":3999.06,"text":"problems where if you just try to take actions greedily, you won't be able to get to the goal."},{"start":4003.82,"text":"and so the work trained a goal condition policy"},{"start":4007.64,"text":"conditioned on goal states"},{"start":4009.58,"text":"with a reward of reaching those goal states"},{"start":4011.86,"text":"and then it trained a high-level policy"},{"start":4013.56,"text":"to output goal states"},{"start":4015.0,"text":"and those kind of goal states are the high-level actions."},{"start":4018.7,"text":"It actually also used hindsight relabeling for the high-level policy to kind of actually relabel high-level actions or to relabel the goals that the high-level policy should output in certain circumstances."},{"start":4034.44,"text":"And it used an off-policy algorithm to train this in order to allow it to work effectively."},{"start":4043.82,"text":"And then another work that does hierarchical reinforcement learning uses language goals."}],"speech_gaps":[],"frame":"../frames/v025/024.webp","frame_time":3881.36},{"title":"分层强化学习与模仿学习","segments":[{"id":306,"text":"So you could do goal states.","start":4049.28,"end":4050.44},{"id":307,"text":"You could also do language goals.","start":4050.54,"end":4052.14},{"id":308,"text":"This trains a language condition policy.","start":4053.02,"end":4055.08},{"id":309,"text":"It uses language relabeling.","start":4055.32,"end":4058.4},{"id":310,"text":"So instead of goal relabeling, it does hindsight relabeling in language space.","start":4058.52,"end":4062.0},{"id":311,"text":"And then the high-level policy is trained to output language, which is actually a pretty difficult task.","start":4062.54,"end":4068.36},{"id":312,"text":"and it again this this is a work that's not too recent and so it's from like 2019 and so the","start":4069.4,"end":4075.9},{"id":313,"text":"tasks are relatively simple where it's trying to be able to arrange these different objects","start":4075.9,"end":4080.46},{"id":314,"text":"tasks are relatively simple where it's trying to be able to arrange these different objects","start":4080.46,"end":4084.26},{"id":315,"text":"in particular order where you need to like push the green object push the red object the blue","start":4084.26,"end":4092.3},{"id":316,"text":"object and so forth cool and the last thing that I'll mention is that we've talked about these","start":4092.3,"end":4096.8},{"id":317,"text":"scenarios where you're supervising the low-level policy to like reach some goals and the high-level","start":4096.8,"end":4104.52},{"id":318,"text":"a policy to output those goals. Now, there's, in some ways, like a really cool research direction","start":4104.52,"end":4109.08},{"id":319,"text":"of instead of actually supervising it to do certain goals, can you actually discover","start":4110.38,"end":4116.26},{"id":320,"text":"intermediate, like discover subtasks or discover skills that might be useful without requiring","start":4116.26,"end":4124.46},{"id":321,"text":"supervision on those low-level skills? And here's one example of a work that studies that where it,","start":4124.46,"end":4128.42},{"id":322,"text":"But in this kind of simple half cheetah agent that you might have also seen in one of your","start":4128.42,"end":4135.22},{"id":323,"text":"homeworks, it's able to learn skills like backing up, walking forward, doing I think","start":4135.22,"end":4137.54},{"id":324,"text":"And then in principle, if you discovered skills without supervision, then you could try to","start":4137.98,"end":4141.96},{"id":325,"text":"sequence those together to do harder tasks.","start":4141.96,"end":4144.04},{"id":326,"text":"But this is generally still an active research area and something that's pretty challenging","start":4145.02,"end":4149.0},{"id":327,"text":"to scale up, especially in very large","start":4149.0,"end":4151.86},{"id":328,"text":"to scale up, especially in very large","start":4151.86,"end":4152.46},{"id":329,"text":"state spaces.","start":4154.3,"end":4154.9},{"id":330,"text":"That's it, and next time we'll be talking","start":4155.62,"end":4157.7},{"id":331,"text":"about reinforcement learning for robotics,","start":4157.7,"end":4159.36},{"id":332,"text":"specifically learning with autonomy,","start":4159.64,"end":4160.9},{"id":333,"text":"and a guest lecture","start":4161.7,"end":4163.88},{"id":334,"text":"from Ashish Kumar on the Tesla Optimist","start":4163.88,"end":4166.14}],"notes":["本段讨论了分层强化学习中使用语言目标进行训练的方法，其中提到通过语言重贴标签（language relabeling）替代目标重贴标签（goal relabeling），并指出高阶策略输出语言任务的难度。此外，还提到一些研究工作，如2019年的成果，这些任务相对简单，涉及对不同物体进行特定顺序的排列。","讲者进一步指出，除了监督低阶策略以达到某些目标外，还可以探索发现中间的子任务或技能，而无需对这些低阶技能进行监督。例如，一个简单的半猎豹代理（half cheetah agent）能够学习如后退、向前行走、前空翻等技能。","讲者提到，如果能够无监督地发现技能，就可以将这些技能组合起来完成更复杂的任务。然而，这一方向仍然是一个活跃的研究领域，尤其是在大规模状态空间中扩展仍面临挑战。","最后，讲者预告了下一次课程将讨论强化学习在机器人学中的应用，特别是自主学习，并将由Ashish Kumar进行客座讲座，介绍特斯拉的乐观主义（Tesla Optimist）相关内容。"],"formulas":[],"uncertainties":[],"diagram":"none","start":4049.28,"end":4166.14,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":4049.28,"text":"So you could do goal states."},{"start":4050.54,"text":"You could also do language goals."},{"start":4053.02,"text":"This trains a language condition policy."},{"start":4055.32,"text":"It uses language relabeling."},{"start":4058.52,"text":"So instead of goal relabeling, it does hindsight relabeling in language space."},{"start":4062.54,"text":"And then the high-level policy is trained to output language, which is actually a pretty difficult task."},{"start":4069.4,"text":"and it again this this is a work that's not too recent and so it's from like 2019 and so the"},{"start":4075.9,"text":"tasks are relatively simple where it's trying to be able to arrange these different objects"},{"start":4080.46,"text":"in particular order where you need to like push the green object push the red object the blue"},{"start":4084.26,"text":"object and so forth cool and the last thing that I'll mention is that we've talked about these"},{"start":4092.3,"text":"scenarios where you're supervising the low-level policy to like reach some goals and the high-level"},{"start":4096.8,"text":"a policy to output those goals. Now, there's, in some ways, like a really cool research direction"},{"start":4104.52,"text":"of instead of actually supervising it to do certain goals, can you actually discover"},{"start":4110.38,"text":"intermediate, like discover subtasks or discover skills that might be useful without requiring"},{"start":4116.26,"text":"supervision on those low-level skills? And here's one example of a work that studies that where it,"},{"start":4124.46,"text":"But in this kind of simple half cheetah agent that you might have also seen in one of your"},{"start":4128.42,"text":"homeworks, it's able to learn skills like backing up, walking forward, doing I think"},{"start":4135.22,"text":"a front flip, and so forth."},{"start":4137.98,"text":"And then in principle, if you discovered skills without supervision, then you could try to"},{"start":4141.96,"text":"sequence those together to do harder tasks."},{"start":4145.02,"text":"But this is generally still an active research area and something that's pretty challenging"},{"start":4149.0,"text":"to scale up, especially in very large"},{"start":4151.86,"text":"state spaces."},{"start":4154.3,"text":"Cool."},{"start":4155.62,"text":"That's it, and next time we'll be talking"},{"start":4157.7,"text":"about reinforcement learning for robotics,"},{"start":4159.64,"text":"specifically learning with autonomy,"},{"start":4161.7,"text":"and a guest lecture"},{"start":4163.88,"text":"from Ashish Kumar on the Tesla Optimist"}],"speech_gaps":[],"frame":"../frames/v025/025.webp","frame_time":4061.28}],"complete":true,"video_url":null}</script><script src="../assets/katex.min.js"></script><script>

else if(kind==='domain'){let t=x,c=1-2*t,pos=310+180*c;s=`<rect x="310" y="55" width="270" height="210" fill="#daf1e9"/>`+line(40,210,580,210)+line(310,55,310,265,'#a74b35')+text(320,80,'可行域：x &gt; 0')+text(290,295,'0')+circle(490,210)+text(460,250,'x = 1')+circle(pos,175)+text(45,35,`x + tv = 1 − 2t = ${c.toFixed(2)}`)+line(490,210,pos,175,'#d78036');cap=`示例 x=1、方向 v=−2。当前步长 t=${t.toFixed(2)}，候选点${c>0?'仍在定义域内':'已超出严格正定义域，必须缩小步长'}。边界 x=0 也不允许。应先检查定义域，再计算残差。`;}

else if(kind==='bellman'){let g=x;s=text(45,60,'两步确定性示例：奖励分别为 1 和 2')+text(45,115,'V(终点) = 0')+text(45,170,'V(后继) = 2')+text(45,225,`V(起点) = 1 + γ × 2 = ${(1+g*2).toFixed(2)}`)+text(45,285,`折扣因子 γ = ${g.toFixed(2)}`);cap='滑块改变折扣因子。该示例只演示回报递推，不代表任意环境下完整的最优价值计算。'}

function render(){if(!data.pages.length){by('sheet').innerHTML='<h1>正在生成本讲校订稿</h1><p>转写与校订完成后会自动加入目录，请稍后刷新。</p>';return}let p=data.pages[index];by('sheet').innerHTML=`<div class="muted">${esc(data.course)} · ${stamp(p.start)}–${stamp(p.end)} · 第 ${index+1} / ${data.pages.length} 页</div><h1>${esc(p.title)}</h1>${p.frame?`<figure style="margin:0"><img src="${esc(p.frame)}" style="width:100%;border-radius:10px" alt="原视频课堂画面"><figcaption class="muted">原视频画面 · ${stamp(p.frame_time)}，可对照板书和演示。</figcaption></figure>`:''}${p.notes.map(t=>'<p>'+esc(t)+'</p>').join('')}${(p.formulas||[]).map(formula).join('')}${p.diagram&&p.diagram!=='none'?'<section class="diagram"><h2>交互图解</h2><p class="muted">补充教学示意，参数与数据用于解释概念。</p><label>示例参数 <input id="param" type="range" min="0" max="100" value="50"><output id="value"></output></label><svg id="plot" viewBox="0 0 620 330" role="img" aria-label="交互知识图解"></svg><p id="graph-caption"></p></section>':''}${p.speech_gaps?.length?'<aside class="warning">本页时间轴有 '+p.speech_gaps.length+' 处疑似语音覆盖缺口，建议回看原视频核对。</aside>':''}${p.asr_flags?.length?'<p class="muted">本页有 '+p.asr_flags.length+' 个原始识别片段触发自动质量提示，建议结合原视频复核。</p>':''}${p.math_clarifications?.length?'<aside class="formula"><b>数学复核说明</b>'+p.math_clarifications.map(t=>'<p>'+esc(t)+'</p>').join('')+'</aside>':''}${p.uncertainties?.length?'<aside class="warning"><b>待核对</b>'+p.uncertainties.map(esc).join('；')+'</aside>':''}<button id="jump">从 ${stamp(p.start)} 回看视频</button><details class="bilingual" open><summary>讲者原文 · 中英逐段对照</summary>${p.segments.map(speakerPair).join('')}</details><details><summary>原始识别与校订对照</summary>${p.raw_segments.map(s=>'<p class="segment"><b>'+stamp(s.start)+'</b> '+esc(s.text)+'</p>').join('')}</details><p class="muted">中文说明依据本时段整理；自动识别和校订仍可能有误。公式附有讲述依据，可回看视频核对。</p>`;by('counter').textContent=`${index+1} / ${data.pages.length}`;by('prev').disabled=index===0;by('next').disabled=index===data.pages.length-1;by('toc').value=index;by('progress').value=index+1;by('progress').max=data.pages.length;localStorage.setItem(key,index);history.replaceState(null,'','#'+index);by('jump').disabled=!data.video_url;if(!data.video_url)by('jump').textContent='原视频正在同步';by('jump').onclick=()=>{let v=by('video');v.hidden=false;let seek=()=>{v.currentTime=p.start;v.play().catch(()=>{})};if(v.readyState>=1)seek();else{v.addEventListener('loadedmetadata',seek,{once:true});v.load()}v.onerror=()=>{by('video-status').innerHTML='暂时无法播放，可 <a target="_blank" rel="noopener" href="'+esc(data.video_url)+'">打开原视频</a> 后重试。'};v.scrollIntoView({behavior:'smooth'})};if(by('param')){by('param').oninput=()=>draw(p.diagram);draw(p.diagram)}document.querySelectorAll('.math').forEach(e=>{try{katex.render(e.dataset.latex,e,{displayMode:true,throwOnError:false,strict:'warn'})}catch(x){e.textContent=e.dataset.latex}})}
by('toc').innerHTML=data.pages.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.title)}</option>`).join('');by('toc').onchange=e=>go(Number(e.target.value));function go(i){index=Math.max(0,Math.min(data.pages.length-1,i));render();window.scrollTo(0,0)}by('prev').onclick=()=>go(index-1);by('next').onclick=()=>go(index+1);document.getElementById('local-video').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(data.video_url&&data.video_url.startsWith('blob:'))URL.revokeObjectURL(data.video_url);data.video_url=URL.createObjectURL(file);const v=by('video');v.src=data.video_url;v.hidden=false;v.onerror=()=>{by('video-status').textContent='当前浏览器无法读取所选视频，请检查文件格式或使用其他浏览器。'};v.load();by('video-status').textContent='已选择 '+file.name+'，可按本页时间定位观看。';render()});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script></html>
