self about what might go wrong and why you might not actually see benefits from your new idea, then you can think more critically about what sorts of things will actually improve the final results."},{"start":1822.06,"text":"Cool. So supervising each level. So we have the low-level policy, and the low-level policy will be trained to accomplish the goal, not the original task. And so when you're passing in the string of find pot, it's going to be giving you a reward that is trying to maximize reward for getting to the states where you have found the pot."}],"speech_gaps":[],"frame":"../frames/v025/011.webp","frame_time":1692.14},{"title":"分层强化学习中的子任务协调与策略连接","segments":[{"id":103,"text":"And the high level policy, its goal is to predict the subtasks so that you end up in the final state of the pasta being cooked. So this is kind of trying to accomplish the original goal. Now, there's a couple of things that can be a little bit tricky about this. So say that you're training these separately and say that you've kind of trained.","zh":"而高层策略的目标是预测子任务，以便最终达到煮面完成的状态。因此，这在某种程度上是在尝试完成原始目标。不过，关于这一点有一些事情可能会有点棘手。比如说，如果你分别训练这些策略，并且你已经大致训练好了。","start":1848.02,"end":1875.71},{"id":104,"text":"You could, for example, think about training a policy to find the pot. And maybe you've gotten to a good policy that's really good at finding the pot and getting to the state really reliably. And then say, for example, when you have... And then maybe, for example, when you train the policy for finding the pasta, if you did this...","zh":"例如，你可以考虑训练一个策略来找到锅。也许你已经得到了一个非常擅长找到锅并可靠地到达该状态的优秀策略。然后，比如说，当你训练寻找意大利面的策略时，如果你这样做……","start":1877.71,"end":1901.34},{"id":105,"text":"If you weren't exactly careful with how you did this, maybe you would think about, okay, maybe I could actually just start from this state and also try to find the pasta from this state over here. And that's not taking into account that actually when it's finding the pasta, according to the high-level policy, if the high-level policy actually wanted to find the pasta after boiling the water, when you're at the stove, then we actually try to string together this low-level policy with the low-level policy for these two.","zh":"如果你在执行这个过程时不够小心，你可能会认为，也许我可以从这个状态开始，并且也尝试从这边的状态寻找意大利面。但这样没有考虑到，实际上当它在寻找意大利面时，根据高层策略，如果高层策略实际上希望在烧水之后寻找意大利面，当你在炉子旁边时，我们实际上需要将这两个的低层策略连接起来。","start":1903.15,"end":1931.49},{"id":106,"text":"it'll actually then struggle to transition from going to the stove over to finding where the pasta is. This is basically like a mismatch when you're training these modular systems, and you're training them completely independently, you might not actually get a system that works effectively if they're not actually at some point connected together and trained such that this skill is starting from states where the high-level policy will actually start commanding that task.","zh":"这会导致系统在从前往炉子过渡到寻找意大利面的位置时遇到困难。这基本上就像在训练这些模块化系统时出现的不匹配问题，如果你完全独立地训练它们，你可能不会得到一个有效的系统，除非它们在某种程度上被连接起来，并且以这样的方式训练，使得这个技能能够从高层策略实际开始命令该任务的状态开始。","start":1932.06,"end":1961.69},{"id":107,"text":"Essentially, when you're training the low-level policy, you have your low-level policy actions given states and goals. You want this policy to work for the set of states where the high-level policy is going to command this particular goal. Another way to think about this is that","zh":"本质上，当你训练低层策略时，你有低层策略的动作，给定状态和目标。你希望这个策略能够适用于高层策略将要命令该特定目标的一组状态。另一种思考方式是：","start":1962.67,"end":1985.4},{"id":108,"text":"I guess the other thing here is also you want it to be able to pick the goals that actually the high-level policy would predict. So for different distributions of goals and different distributions of states, ideally, that low-level policy would work for whatever states and goals the high-level policy will output. Now, if we haven't actually learned the high-level policy yet, this puts things in a bit of a tricky situation. Likewise, for the high-level policy,","zh":"我想这里还有另一件事，就是你希望它能够选择那些高层策略实际上会预测的目标。对于不同的目标分布和不同的状态分布，理想情况下，低层策略应该能够适用于高层策略输出的任何状态和目标。现在，如果我们还没有实际学习到高层策略，这就使情况变得有点棘手。同样地，对于高层策略，","start":1987.24,"end":2016.64}],"notes":["本段讨论了分层强化学习中低级策略与高级策略之间的协调问题。当训练低级策略时，必须确保其能够处理高级策略所指定的目标和状态。如果低级策略没有在高级策略所期望的状态下进行训练，可能会导致策略之间的不匹配，从而影响整体系统的有效性。","高级策略负责预测子任务，而低级策略则负责执行这些子任务。然而，如果低级策略的训练没有考虑到高级策略所指定的上下文，例如在特定状态下执行任务，那么低级策略可能无法正确地与高级策略协同工作。","在训练低级策略时，需要确保其能够适应不同分布的目标和状态。这意味着低级策略必须具备一定的泛化能力，以应对高级策略可能输出的各种状态和目标组合。","如果高级策略尚未训练完成，那么低级策略的训练可能会陷入困境，因为低级策略需要依赖高级策略来确定其目标和状态。这种相互依赖关系使得训练过程更加复杂。","因此，在设计分层强化学习系统时，必须确保低级策略和高级策略之间存在某种形式的连接或协调，以保证整个系统的有效性和一致性。","这种协调问题在模块化系统中尤为明显，因为模块之间通常是独立训练的，缺乏直接的交互机制。因此，需要在训练过程中引入某种形式的连接，以确保策略之间的兼容性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1848.02,"end":2016.64,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":1848.02,"text":"And the high level policy, its goal is to predict the subtasks so that you end up in the final state of the pasta being cooked. So this is kind of trying to accomplish the original goal. Now, there's a couple of things that can be a little bit tricky about this. So say that you're training these separately and say that you've kind of trained."},{"start":1877.71,"text":"You could, for example, think about training a policy to find the pot. And maybe you've gotten to a good policy that's really good at finding the pot and getting to the state really reliably. And then say, for example, when you have... And then maybe, for example, when you train the policy for finding the pasta, if you did this..."},{"start":1903.15,"text":"If you weren't exactly careful with how you did this, maybe you would think about, okay, maybe I could actually just start from this state and also try to find the pasta from this state over here. And that's not taking into account that actually when it's finding the pasta, according to the high-level policy, if the high-level policy actually wanted to find the pasta after boiling the water, when you're at the stove, then we actually try to string together this low-level policy with the low-level policy for these two."},{"start":1932.06,"text":"it'll actually then struggle to transition from going to the stove over to finding where the pasta is. This is basically like a mismatch when you're training these modular systems, and you're training them completely independently, you might not actually get a system that works effectively if they're not actually at some point connected together and trained such that this skill is starting from states where the high-level policy will actually start commanding that task."},{"start":1962.67,"text":"Essentially, when you're training the low-level policy, you have your low-level policy actions given states and goals. You want this policy to work for the set of states where the high-level policy is going to command this particular goal. Another way to think about this is that"},{"start":1987.24,"text":"I guess the other thing here is also you want it to be able to pick the goals that actually the high-level policy would predict. So for different distributions of goals and different distributions of states, ideally, that low-level policy would work for whatever states and goals the high-level policy will output. Now, if we haven't actually learned the high-level policy yet, this puts things in a bit of a tricky situation. Likewise, for the high-level policy,"}],"speech_gaps":[],"frame":"../frames/v025/012.webp","frame_time":1860.02},{"title":"分层强化学习中的低层策略与高层策略的衔接","segments":[{"id":109,"text":"If we assume that our low-level policy is really great, then we might not realize that it actually has some deficiencies and that we need to, for example, continue to command something in certain states until you've actually reached a state that a different skill can operate in. Yeah.","zh":"如果我们假设我们的低层策略非常出色，那么我们可能不会意识到它实际上存在一些缺陷，我们需要在某些状态下继续发出指令，直到真正到达一个不同技能可以操作的状态。是的。","start":2017.67,"end":2037.29},{"id":110,"text":"Yeah, so if the low-level policy works from particular sequences of states, then the high-level policy can learn that it should kind of walk the low-level policy through those states. So you don't necessarily need your low-level policy to work from every state. It just needs to work for the state goal combinations that the high-level policy is going to command. Now, you might have a situation where, say that your low-level policy...","zh":"是的，如果低层策略能够在特定状态序列中运行，那么高层策略可以学习到它应该引导低层策略经过这些状态。因此，你并不需要低层策略在每一个状态下都能运行，它只需要在高层策略将要指挥的状态目标组合中有效即可。现在，你可能会遇到一种情况，比如说你的低层策略……","start":2037.81,"end":2059.05},{"id":111,"text":"kind of knows how to do kind of something like this. So it knows how to go from here to here. It knows how to go from here to here and maybe knows how to go from here to here.","zh":"大致知道如何执行类似这样的操作。它知道如何从这里到那里。它知道如何从这里到那里，也许还知道如何从这里到那里。","start":2060.61,"end":2069.59},{"id":112,"text":"like with some boiled water, then you might have some sort of gap where to actually find the pasta, you need to kind of go back to these states. And if you don't have like a command or some way to get from here to here, then you're going to basically have a gap in the states that you're visiting and the high-level policy will struggle to actually get to this state here.","zh":"比如在有煮沸的水的情况下，你可能会遇到某种间隙，要实际找到意大利面，你需要回到这些状态。如果你没有指令或某种方式从这里到那里，那么你实际上访问的状态就会出现间隙，高层策略将难以到达这个状态。","start":2071.41,"end":2091.71},{"id":113,"text":"So basically, one way to think about it is you need to make sure that there's at least some overlap in the states from one skill to the next. And ideally, that overlap has some buffer. Because if, for example, when you're trying to find the pasta, it only works if you're standing exactly in front of the boiled water and not if you're a little bit to the right. Then if your policy ends up deciding to boil the water, standing a little bit to the right of it, then you'll get a brittle finding.","zh":"所以基本上，一种思考方式是，你需要确保从一个技能到下一个技能的状态之间至少有一些重叠。理想情况下，这种重叠应该有一些缓冲。例如，当你试图找到意大利面时，它只在你正好站在煮沸的水前面时才有效，而不是稍微偏右一点。如果你的策略最终决定煮水，而你站在它稍微偏右的位置，那么你将得到一个脆弱的发现。","start":2092.3,"end":2121.6},{"id":114,"text":"final result where it will kind of struggle in that case. So the way to think about that is that, I guess one way to think about it is that if this low-level policy only works from this part of the states where the water is being boiled and the high-level policy gets you here, or the previous low-level policy gets you here, then you're going to have a little bit of a gap between here and here. And that sort of gap can lead to brittle performance on the full long horizon task.","zh":"最终结果是在这种情况下它会有些挣扎。所以，思考这个问题的一种方式是，我想，一种思考方式是，如果这个低层策略只能在这些状态中起作用，即水正在被烧开的部分，而高层策略将你带到此处，或者之前的低层策略将你带到此处，那么你就会在这两者之间出现一点差距。而这种差距可能导致在完整的长时域任务中表现脆弱。","start":2121.61,"end":2152.33},{"id":115,"text":"Yeah, so the question is, does it have to be a fixed sequence? And can you learn if one sequence is more efficient than another? And yeah, so absolutely, the high-level policy can actually decide which sequence it wants to do. And that sequence might depend on what's the most efficient. It might also depend on where these...","zh":"是的，问题是，是否必须是一个固定的序列？你能否学习到一个序列是否比另一个更高效？是的，所以绝对地，高层策略实际上可以决定它想要执行的序列。这个序列可能取决于哪个最高效。它也可能取决于这些……","start":2153.33,"end":2170.63}],"notes":["本段讨论了分层强化学习中低层策略与高层策略之间的衔接问题。讲者指出，如果低层策略在某些状态下表现不佳，高层策略可能需要继续指挥以确保能够到达适合其他技能操作的状态。这表明，低层策略并不需要在所有状态下都有效，只需要在高层策略命令的目标状态组合中有效。","讲者进一步说明，如果低层策略在某些状态之间存在间隙，例如在寻找意大利面时需要回到特定状态，但缺乏从当前状态到目标状态的命令或路径，那么高层策略将难以到达目标状态。这强调了状态覆盖的重要性，以及在不同技能之间保持状态重叠的必要性。","讲者提到，为了防止性能脆弱，低层策略在状态之间的重叠应具有缓冲区。例如，如果低层策略只能在精确的位置（如正对煮沸的水）才能有效，而高层策略可能将代理带到稍偏的位置，那么低层策略将无法有效执行任务，导致性能下降。","讲者还指出，这种状态间隙可能导致在长期任务中出现脆弱的性能表现。因此，设计低层策略时需要确保其在不同技能之间有良好的状态覆盖，以避免因状态不连续而导致的失败。","最后，讲者提到高层策略可以决定使用哪种序列，并且该序列可能取决于效率或当前状态。这表明，高层策略在选择低层策略序列时具有一定的灵活性，可以根据任务需求进行调整。","整体而言，本段强调了分层强化学习中低层策略与高层策略之间的衔接问题，以及状态覆盖和缓冲区设计的重要性，以确保任务的稳定性和高效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2017.67,"end":2170.63,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2017.67,"text":"If we assume that our low-level policy is really great, then we might not realize that it actually has some deficiencies and that we need to, for example, continue to command something in certain states until you've actually reached a state that a different skill can operate in. Yeah."},{"start":2037.81,"text":"Yeah, so if the low-level policy works from particular sequences of states, then the high-level policy can learn that it should kind of walk the low-level policy through those states. So you don't necessarily need your low-level policy to work from every state. It just needs to work for the state goal combinations that the high-level policy is going to command. Now, you might have a situation where, say that your low-level policy..."},{"start":2060.61,"text":"kind of knows how to do kind of something like this. So it knows how to go from here to here. It knows how to go from here to here and maybe knows how to go from here to here."},{"start":2071.41,"text":"like with some boiled water, then you might have some sort of gap where to actually find the pasta, you need to kind of go back to these states. And if you don't have like a command or some way to get from here to here, then you're going to basically have a gap in the states that you're visiting and the high-level policy will struggle to actually get to this state here."},{"start":2092.3,"text":"So basically, one way to think about it is you need to make sure that there's at least some overlap in the states from one skill to the next. And ideally, that overlap has some buffer. Because if, for example, when you're trying to find the pasta, it only works if you're standing exactly in front of the boiled water and not if you're a little bit to the right. Then if your policy ends up deciding to boil the water, standing a little bit to the right of it, then you'll get a brittle finding."},{"start":2121.61,"text":"final result where it will kind of struggle in that case. So the way to think about that is that, I guess one way to think about it is that if this low-level policy only works from this part of the states where the water is being boiled and the high-level policy gets you here, or the previous low-level policy gets you here, then you're going to have a little bit of a gap between here and here. And that sort of gap can lead to brittle performance on the full long horizon task."},{"start":2153.33,"text":"Yeah, so the question is, does it have to be a fixed sequence? And can you learn if one sequence is more efficient than another? And yeah, so absolutely, the high-level policy can actually decide which sequence it wants to do. And that sequence might depend on what's the most efficient. It might also depend on where these..."}],"speech_gaps":[],"frame":"../frames/v025/013.webp","frame_time":2029.67},{"title":"分层强化学习与模仿学习中的策略协作","segments":[{"id":116,"text":"where the low-level policy is most successful. And so one of the reasons why I wanted to pick this example is actually these two steps can be done in any order, and the high-level policy could decide that when you're here, it actually wants to command you to go here. And as long as the low-level policy knows how to find the pasta from these states, then that might be more efficient overall. There's also worlds where maybe this would be more efficient because maybe while you're boiling the water, you're just waiting, and you can find the pasta in the meantime.","zh":"在低层策略最成功的状态下。因此，我之所以想选择这个例子，其中一个原因实际上是这两个步骤可以以任何顺序执行，高层策略可以决定当你处于这里时，实际上想要命令你去那里。只要低层策略知道如何从这些状态中找到意大利面，这可能在整体上更高效。还有一些世界中，这可能更高效，因为在你烧水的时候，你只是在等待，同时你可以在这段时间找到意大利面。","start":2172.45,"end":2198.75},{"id":117,"text":"And so I guess there's also a pouring water and turning on the stove and so forth, so there's more steps involved. But yeah, the high-level policy can decide which order it wants to take. Okay, so generally the way to address this is that you can first train them potentially completely separately, but it's important for at least one policy to be adapted to.","zh":"因此，我想还有倒水和打开炉子等步骤，所以涉及更多的步骤。但总之，高层策略可以决定采取哪种顺序。好的，通常解决这个问题的方法是，你可以先分别训练它们，但至少有一个策略需要进行适应。","start":2200.84,"end":2223.08},{"id":118,"text":"the other. And ideally, even both could be jointly adapted with each other to optimize reward or optimize some complete objective. Cool. One other side note, I guess, that I think is worth mentioning is that even for problems that are not traditionally LLM problems, LLM problems are actually often","zh":"另一个策略。理想情况下，甚至两者都可以相互联合适应，以优化奖励或优化某个完整的目标。酷。另一个附带说明，我想值得提及的是，即使对于传统上不是大语言模型（LLM）问题的问题，大语言模型问题实际上常常","start":2223.85,"end":2252.29},{"id":119,"text":"And so, for example, if you know that you want to cook pasta, if you ask a language model, what are the steps involved with that? Oftentimes they can actually give you that. And so this is one way where you could actually kind of train the high level policy completely separately from the low level policy and then potentially fine tune them because the language model, for example, might not know that.","zh":"例如，如果你知道你想煮意大利面，如果你问一个语言模型，涉及哪些步骤？通常它们实际上可以给你这些步骤。因此，这是你可以在完全不依赖低层策略的情况下训练高层策略的一种方式，然后潜在地进行微调，因为例如语言模型可能并不知道。","start":2253.36,"end":2277.42},{"id":120,"text":"kind of which order the low-level policy is best suited for, or other things about the capabilities of the low-level policy.","zh":"关于低层策略最适合的步骤顺序，或其他有关低层策略能力的事情。","start":2278.83,"end":2288.05},{"id":121,"text":"And so that sort of adaptation process, even though language models are pretty good, that sort of adaptation process is really important. Also, if you ask, if a robot is in front of a coffee machine and you ask the robot to get some coffee for you, if the language model doesn't actually pay attention to that image, it might tell the robot, oh, can you go out and buy coffee at Starbucks or something? And the robot might not have that sort of affordance, that sort of ability to do that. And so kind of adapting these two together, that's another example where adapting these two high-level and low-level policies.","zh":"因此，这种适应过程，即使语言模型表现得相当不错，这种适应过程仍然非常重要。此外，如果你问一个机器人站在咖啡机前面，并让你机器人帮你取咖啡，如果语言模型没有真正关注到那张图像，它可能会告诉机器人，哦，你能去星巴克买杯咖啡吗？而机器人可能不具备这种能力，这种能力去执行这样的任务。因此，将这两种策略结合起来进行适应，是另一个例子，说明在高层次和低层次策略之间进行适应的重要性。","start":2288.93,"end":2318.33},{"id":122,"text":"together is quite important. Okay, the last key design choice that we haven't talked about yet is when to move from one task to another. So we outlined this process here and we didn't really spend that much time thinking about like how long do you repeat sampling from your low-level policy to accomplish a goal.","zh":"将它们结合起来是非常重要的。好的，我们尚未讨论的最后一个关键设计选择是何时从一个任务转移到另一个任务。我们在这里概述了这个过程，但并没有花太多时间去思考，比如你需要重复从低层次策略中采样多长时间才能完成一个目标。","start":2318.38,"end":2343.12}],"notes":["本段讨论了分层强化学习中高层策略和低层策略之间的协作关系，强调了高层策略可以决定任务执行的顺序，而低层策略需要具备完成特定子任务的能力。例如，在煮意大利面的过程中，高层策略可以决定先烧水还是先找意大利面，而低层策略需要知道如何从当前状态找到意大利面。","讲者提到，虽然语言模型在高层次推理方面表现良好，但它们可能不了解低层策略的具体能力，因此需要对高层和低层策略进行联合适应。例如，如果机器人面对咖啡机，语言模型可能建议去星巴克买咖啡，而机器人可能不具备这种能力。","此外，讲者指出，高层策略和低层策略的联合适应非常重要，特别是在涉及具体任务执行时，如机器人需要根据环境信息调整策略。这表明在实际应用中，策略之间的协同和适应是关键。","最后，讲者提到尚未讨论的一个关键设计选择是何时从一个任务切换到另一个任务。这涉及到低层策略重复采样的时间长度，以完成特定目标。这表明在实际系统设计中，任务切换的时机和策略的执行效率是需要考虑的重要因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2172.45,"end":2343.12,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2172.45,"text":"where the low-level policy is most successful. And so one of the reasons why I wanted to pick this example is actually these two steps can be done in any order, and the high-level policy could decide that when you're here, it actually wants to command you to go here. And as long as the low-level policy knows how to find the pasta from these states, then that might be more efficient overall. There's also worlds where maybe this would be more efficient because maybe while you're boiling the water, you're just waiting, and you can find the pasta in the meantime."},{"start":2200.84,"text":"And so I guess there's also a pouring water and turning on the stove and so forth, so there's more steps involved. But yeah, the high-level policy can decide which order it wants to take. Okay, so generally the way to address this is that you can first train them potentially completely separately, but it's important for at least one policy to be adapted to."},{"start":2223.85,"text":"the other. And ideally, even both could be jointly adapted with each other to optimize reward or optimize some complete objective. Cool. One other side note, I guess, that I think is worth mentioning is that even for problems that are not traditionally LLM problems, LLM problems are actually often"},{"start":2253.36,"text":"pretty good at some of the higher level reasoning that you might want to do. And so, for example, if you know that you want to cook pasta, if you ask a language model, what are the steps involved with that? Oftentimes they can actually give you that. And so this is one way where you could actually kind of train the high level policy completely separately from the low level policy and then potentially fine tune them because the language model, for example, might not know that."},{"start":2278.83,"text":"kind of which order the low-level policy is best suited for, or other things about the capabilities of the low-level policy."},{"start":2288.93,"text":"And so that sort of adaptation process, even though language models are pretty good, that sort of adaptation process is really important. Also, if you ask, if a robot is in front of a coffee machine and you ask the robot to get some coffee for you, if the language model doesn't actually pay attention to that image, it might tell the robot, oh, can you go out and buy coffee at Starbucks or something? And the robot might not have that sort of affordance, that sort of ability to do that. And so kind of adapting these two together, that's another example where adapting these two high-level and low-level policies."},{"start":2318.38,"text":"together is quite important. Okay, the last key design choice that we haven't talked about yet is when to move from one task to another. So we outlined this process here and we didn't really spend that much time thinking about like how long do you repeat sampling from your low-level policy to accomplish a goal."}],"speech_gaps":[],"frame":"../frames/v025/014.webp","frame_time":2184.45},{"title":"分层强化学习中的目标查询策略","segments":[{"id":123,"text":"And essentially, it's like how often do we re-query a new goal from the high-level policy to pass to the low-level policy? So basically, yeah, this step right here. So there's two natural options for this. The first natural option is...","zh":"本质上，这就像我们多久重新查询一次新的目标，从高层策略传递给低层策略？所以基本上，就是这一步。因此，这里有两种自然的选择。第一种自然的选择是...","start":2344.39,"end":2367.15},{"id":124,"text":"to re-query the high-level policy whenever the low-level policy has completed the goal. So when it has boiled the water, that's when you tell it to go find the pasta, for example. And the way that this would look like is, at this point, your low-level policy not only needs to predict action, but it also needs to predict whether or not it successfully completed the task.","zh":"每当低层策略完成目标时，重新查询高层策略。例如，当它把水煮沸时，这时你告诉它去寻找意大利面。这种情况下，你的低层策略不仅需要预测动作，还需要预测是否成功完成了任务。","start":2367.58,"end":2392.69},{"id":125,"text":"And this could be either with some sort of binary indicator or through some sort of progress indicator. You could think about this done, not done, sort of as a success classifier for the task. And then the other option that's a bit simpler, but maybe less elegant in some ways, is just to simply re-query the high-level policy after some fixed number of time steps.","zh":"这可以通过某种二元指示器，或者通过某种进度指示器来实现。你可以将这种完成、未完成视为任务的成功分类器。另一种选择则更简单，但可能在某些方面不够优雅，就是简单地在固定数量的时间步后重新查询高层策略。","start":2393.35,"end":2420.6},{"id":126,"text":"You query the low-level policy at 50 hertz, and you query the high-level policy once every second. So then you would be querying the high-level policy after 50 timestamps. So there's pros and cons of each of these two options.","zh":"你以50赫兹的频率查询低层策略，而每秒查询一次高层策略。因此，你会在50个时间步后查询高层策略。这两种选择各有优缺点。","start":2422.7,"end":2440.6},{"id":127,"text":"For the first case where we're doing something after we've completed a goal, this is actually ideal. If you're to do this well, this should be the most compute efficient because you're waiting for the low-level policy and you don't need to rethink how you're doing the task while the low-level policy is executing.","zh":"对于第一种情况，即在完成目标后执行某些操作，这实际上是理想的选择。如果你能很好地实现这一点，这应该是计算效率最高的，因为你在等待低层策略执行，不需要在低层策略执行过程中重新思考任务的执行方式。","start":2442.6,"end":2459.5},{"id":128,"text":"There's a couple of things that are tricky about this, though. The first is that it can actually be hard to estimate when you're done with a task. It's definitely not trivial to do this. And the second is that you actually need to account for mistakes that require actually redoing some past goal.","zh":"不过，这种做法也有一些棘手的问题。首先是，实际上很难估计何时完成任务。这绝不是一件简单的事情。其次是，你实际上需要考虑那些需要重新执行某些过去目标的错误。","start":2462.47,"end":2481.47},{"id":129,"text":"So, for example, if you are trying to, I don't know, organize some things on a table, you go grab something, and then you accidentally drop it on the ground, your subgoal should no longer be, like, put that object on the table, and instead it should be to pick it up off the ground. And this means that actually you need to now estimate not just when you're done, but also whether or not you've actually, like, kind of exited the states in which that subtask makes sense.","zh":"例如，如果你正在尝试，比如说，把一些东西整理到桌子上，你去拿东西，然后不小心把它掉在地上，那么你的子目标就不再应该是把那个物体放到桌子上，而是应该变成从地上捡起它。这意味着你实际上需要估计的不仅仅是何时完成任务，还包括你是否已经离开了那个子任务有意义的状态。","start":2482.32,"end":2511.38}],"notes":["本段讨论了在分层强化学习中，如何判断低级策略是否完成任务，从而决定是否重新查询高级策略。讲者提到，可以通过二元指示器或进度指示器来判断任务是否完成，这类似于一个任务成功的分类器。此外，还举了一个例子，说明如果在执行子任务过程中出现错误，例如将物品掉落，那么子目标需要从‘将物品放在桌子上’变为‘捡起物品’，这表明需要判断是否已经退出了子任务适用的状态。","讲者进一步指出，判断任务是否完成并不是一件容易的事情，尤其是在需要重新执行之前的目标时，这会增加系统的复杂性。因此，设计一个可靠的完成判断机制是分层强化学习中的一个关键挑战。","在例子中，讲者通过一个具体的场景说明了子目标的动态调整过程，即当子任务执行失败时，系统需要重新设定子目标。这表明，除了判断任务是否完成外，还需要判断是否已经脱离了子任务适用的状态，从而确保子目标的正确性。","讲者还提到，两种常见的目标查询策略：一种是在低级策略完成任务后重新查询高级策略，另一种是固定时间步长后重新查询。前者更高效，但需要准确判断任务完成；后者更简单，但可能不够灵活。","在讨论完成判断的挑战时，讲者强调了任务完成判断的非平凡性，以及需要处理错误导致的子目标重置问题。这表明，设计一个鲁棒的完成判断机制对于分层强化学习的成功至关重要。","最后，讲者通过一个具体的例子说明了子目标的动态调整过程，这有助于理解分层强化学习中目标查询策略的实际应用和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2344.39,"end":2511.38,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":7,"raw_segments":[{"start":2344.39,"text":"And essentially, it's like how often do we re-query a new goal from the high-level policy to pass to the low-level policy? So basically, yeah, this step right here. So there's two natural options for this. The first natural option is..."},{"start":2367.58,"text":"to re-query the high-level policy whenever the low-level policy has completed the goal. So when it has boiled the water, that's when you tell it to go find the pasta, for example. And the way that this would look like is, at this point, your low-level policy not only needs to predict action, but it also needs to predict whether or not it successfully completed the task."},{"start":2393.35,"text":"And this could be either with some sort of binary indicator or through some sort of progress indicator. You could think about this done, not done, sort of as a success classifier for the task. And then the other option that's a bit simpler, but maybe less elegant in some ways, is just to simply re-query the high-level policy after some fixed number of time steps."},{"start":2422.7,"text":"You query the low-level policy at 50 hertz, and you query the high-level policy once every second. So then you would be querying the high-level policy after 50 timestamps. So there's pros and cons of each of these two options."},{"start":2442.6,"text":"For the first case where we're doing something after we've completed a goal, this is actually ideal. If you're to do this well, this should be the most compute efficient because you're waiting for the low-level policy and you don't need to rethink how you're doing the task while the low-level policy is executing."},{"start":2462.47,"text":"There's a couple of things that are tricky about this, though. The first is that it can actually be hard to estimate when you're done with a task. It's definitely not trivial to do this. And the second is that you actually need to account for mistakes that require actually redoing some past goal."},{"start":2482.32,"text":"So, for example, if you are trying to, I don't know, organize some things on a table, you go grab something, and then you accidentally drop it on the ground, your subgoal should no longer be, like, put that object on the table, and instead it should be to pick it up off the ground. And this means that actually you need to now estimate not just when you're done, but also whether or not you've actually, like, kind of exited the states in which that subtask makes sense."}],"speech_gaps":[],"frame":"../frames/v025/015.webp","frame_time":2356.39},{"title":"分层强化学习中的时间步长与错误影响","segments":[{"id":130,"text":"Then kind of going back to the fixed number of time steps, this is less ideal because we're going to be probably wasting some compute, and there's going to be a tradeoff between spending more compute thinking through what the next goal should be.","zh":"然后回到固定的时间步数，这不太理想，因为我们可能会浪费一些计算资源，并且在考虑下一步目标应该是什么时，需要在花费更多计算资源之间进行权衡。","start":2514.92,"end":2529.6},{"id":131,"text":"Versus if this n is too long, then you're going to be delayed in transitioning to the new goal,","zh":"与之相反，如果这个n太长，那么你就会在转换到新目标时出现延迟，","start":2531.82,"end":2537.38},{"id":132,"text":"where your agent will be, for example, maybe it's kind of found the pot,","zh":"例如，你的代理可能已经找到了锅，","start":2537.5,"end":2542.32},{"id":133,"text":"it's taken out the pot, and it's waiting for a new goal.","zh":"已经把锅拿出来了，正在等待新的目标。","start":2542.48,"end":2544.48},{"id":134,"text":"It might just be, if n is too long, it's just going to be sitting there with the pot,","zh":"如果n太长，它可能只是坐在那里拿着锅，","start":2544.62,"end":2547.6},{"id":135,"text":"because it's like, okay, I found the pot, and that's the goal that it's getting.","zh":"因为它会想，哦，我找到了锅，这就是它要完成的目标。","start":2547.7,"end":2550.52},{"id":136,"text":"And there'll be some delay before it then moves on to actually finding the pasta","zh":"然后在它真正去寻找意大利面或往锅里倒水之前，会有一些延迟。","start":2551.1,"end":2554.34},{"id":137,"text":"or pouring water into the pot.","zh":"或者往锅里倒水。","start":2554.34,"end":2556.24},{"id":138,"text":"So there's this kind of trade-off between how long n should be.","zh":"因此，存在一种关于n应该多长的权衡。","start":2557.04,"end":2559.96},{"id":139,"text":"Generally, because you don't want these really long delays,","zh":"通常，因为你不想有太长的延迟，","start":2560.92,"end":2563.82},{"id":140,"text":"you'll pick n to be fairly small or fairly frequent.","zh":"你会选择n相对较小或较为频繁。","start":2564.08,"end":2567.16},{"id":141,"text":"But when it is smaller,","zh":"但当n更小时，","start":2569.34,"end":2571.42},{"id":142,"text":"you're then going to be placing more burden","zh":"你就会给高层策略带来更大的负担，","start":2571.7,"end":2573.28},{"id":143,"text":"on your high-level policy","zh":"因为它需要在更多的状态下更频繁地做出准确的目标预测。","start":2573.28,"end":2574.22},{"id":144,"text":"because it needs to be making accurate goal predictions","zh":"因此，你就会给高层策略带来更大的负担，","start":2574.78,"end":2577.8},{"id":145,"text":"more frequently on more states.","zh":"因为它需要在更多的状态下更频繁地做出准确的目标预测。","start":2578.48,"end":2580.84},{"id":146,"text":"And you'll be spending more compute as well.","zh":"你也会花费更多的计算资源。","start":2581.9,"end":2583.88},{"id":147,"text":"So both of these have pros and cons.","zh":"因此，这两者都有优缺点。","start":2586.14,"end":2587.96},{"id":148,"text":"So in general, if we wanted to think about how these pros and cons relate to each other,","zh":"一般来说，如果我们想要思考这些优缺点之间的关系，","start":2590.04,"end":2598.74},{"id":149,"text":"we can think about how these pros and cons lead to different downstream performance.","zh":"我们可以思考这些优缺点如何导致不同的后续性能表现。","start":2598.9,"end":2602.82},{"id":150,"text":"And with regard to estimating when you're done and accounting for mistakes,","zh":"关于估计何时完成以及如何处理错误，","start":2605.24,"end":2609.22},{"id":151,"text":"if you actually make a mistake in estimating when you're done,","zh":"如果你在估计何时完成时犯了错误，","start":2609.46,"end":2612.32},{"id":152,"text":"then you could actually end up in a situation where the agent is perpetually stuck.","zh":"你实际上可能会陷入一个代理永远无法摆脱的情况。","start":2613.4,"end":2617.36},{"id":153,"text":"If it thinks that it's if it thinks that it's not done, but it is actually done, then it will actually just stay in that state because the low level policy will kind of keep on predicting this, like won't actually be making any more further progress on the task.","zh":"如果它认为自己还没完成，但实际上已经完成了，那么它就会一直停留在那个状态，因为低层策略会持续预测这个状态，实际上不会在任务上取得任何进一步的进展。","start":2617.36,"end":2630.96},{"id":154,"text":"So this actually is a pretty kind of rough outcome for these kinds of errors, even if they're infrequent.","zh":"所以，这种结果对于这类错误来说其实相当粗糙，即使这些错误并不频繁。","start":2632.26,"end":2639.24},{"id":155,"text":"And then for option two.","zh":"然后是第二种选择。","start":2641.16,"end":2642.32},{"id":156,"text":"If you make a mistake in predicting the subtask because you're querying the high-level policy more frequently, this also has a bad outcome, which is that the low-level policy might kind of stop making progress on the final task and might be taking the wrong actions for end steps until you get, hopefully, a more accurate goal prediction. And generally, between these two things, these errors are more fatal.","zh":"如果你在预测子任务时犯了错误，因为你在更频繁地查询高层策略，这也导致了一个糟糕的结果，即低层策略可能会在最终任务上停止取得进展，并且在最后几步采取错误的动作，直到你希望得到一个更准确的目标预测。通常来说，在这两种情况之间，这些错误更为致命。","start":2642.89,"end":2666.26},{"id":157,"text":"And as a result, typically a lot of the hierarchical systems out there opt for choosing option two because of the simplicity and because some of the mistakes that the high-level policy might make when it's queried more frequently are less fatal than mistakes with regard to estimating when you're done and whether or not you should kind of re-account.","zh":"因此，通常很多现有的分层系统会选择第二种方案，因为其简单性，以及当高层策略被更频繁查询时所犯的一些错误，相较于估计何时完成任务以及是否应该重新计算的错误来说，可能不那么致命。","start":2668.01,"end":2689.31}],"notes":["本段讨论了分层强化学习中时间步长n的选择对系统性能的影响。当n太长时，代理可能会在完成当前任务后长时间等待新目标，导致延迟。而当n太短时，高层策略需要更频繁地做出准确的目标预测，这会增加计算负担。"],"formulas":[],"uncertainties":["if it thinks that it's if it thinks that it's not done"],"diagram":"none","start":2514.92,"end":2689.31,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":28,"raw_segments":[{"start":2514.92,"text":"Then kind of going back to the fixed number of time steps, this is less ideal because we're going to be probably wasting some compute, and there's going to be a tradeoff between spending more compute thinking through what the next goal should be."},{"start":2531.82,"text":"Versus if this n is too long, then you're going to be delayed in transitioning to the new goal,"},{"start":2537.5,"text":"where your agent will be, for example, maybe it's kind of found the pot,"},{"start":2542.48,"text":"it's taken out the pot, and it's waiting for a new goal."},{"start":2544.62,"text":"It might just be, if n is too long, it's just going to be sitting there with the pot,"},{"start":2547.7,"text":"because it's like, okay, I found the pot, and that's the goal that it's getting."},{"start":2551.1,"text":"And there'll be some delay before it then moves on to actually finding the pasta"},{"start":2554.34,"text":"or pouring water into the pot."},{"start":2557.04,"text":"So there's this kind of trade-off between how long n should be."},{"start":2560.92,"text":"Generally, because you don't want these really long delays,"},{"start":2564.08,"text":"you'll pick n to be fairly small or fairly frequent."},{"start":2569.34,"text":"But when it is smaller,"},{"start":2571.7,"text":"you're then going to be placing more burden"},{"start":2573.28,"text":"on your high-level policy"},{"start":2574.78,"text":"because it needs to be making accurate goal predictions"},{"start":2578.48,"text":"more frequently on more states."},{"start":2581.9,"text":"And you'll be spending more compute as well."},{"start":2586.14,"text":"So both of these have pros and cons."},{"start":2590.04,"text":"So in general, if we wanted to think about how these pros and cons relate to each other,"},{"start":2598.9,"text":"we can think about how these pros and cons lead to different downstream performance."},{"start":2605.24,"text":"And with regard to estimating when you're done and accounting for mistakes,"},{"start":2609.46,"text":"if you actually make a mistake in estimating when you're done,"},{"start":2613.4,"text":"then you could actually end up in a situation where the agent is perpetually stuck."},{"start":2617.36,"text":"If it thinks that it's if it thinks that it's not done, but it is actually done, then it will actually just stay in that state because the low level policy will kind of keep on predicting this, like won't actually be making any more further progress on the task."},{"start":2632.26,"text":"So this actually is a pretty kind of rough outcome for these kinds of errors, even if they're infrequent."},{"start":2641.16,"text":"And then for option two."},{"start":2642.89,"text":"If you make a mistake in predicting the subtask because you're querying the high-level policy more frequently, this also has a bad outcome, which is that the low-level policy might kind of stop making progress on the final task and might be taking the wrong actions for end steps until you get, hopefully, a more accurate goal prediction. And generally, between these two things, these errors are more fatal."},{"start":2668.01,"text":"And as a result, typically a lot of the hierarchical systems out there opt for choosing option two because of the simplicity and because some of the mistakes that the high-level policy might make when it's queried more frequently are less fatal than mistakes with regard to estimating when you're done and whether or not you should kind of re-account."}],"speech_gaps":[],"frame":"../frames/v025/016.webp","frame_time":2526.92},{"title":"分层强化学习与模仿学习中的系统设计","segments":[{"id":158,"text":"for past goals. It's also worth mentioning that you could potentially combine these where you try to estimate progress, but then if it's been a long period of time, then you re-query anyway. But yeah, the takeaway is that generally option two is typically what people do where you just query at a fixed lower frequency.","zh":"对于过去的任务目标。值得一提的是，你也可以尝试将这些方法结合起来，用来估计进展，但如果已经经过了很长一段时间，你仍然会重新查询。不过总的来说，通常人们采用的是第二种方法，即以固定的较低频率进行查询。","start":2689.66,"end":2705.82},{"id":159,"text":"Cool. So let's look at some example systems. And I guess one thing that I'll mention is that hierarchy is pretty popular these days. So here are four systems that were all...","zh":"很好。现在让我们看看一些示例系统。我想提到的一点是，分层结构如今非常流行。以下列出的四个系统都是在最近大约五个月内、四个月内宣布的，它们实际上都使用了分层系统。","start":2707.57,"end":2721.89},{"id":160,"text":"kind of announced in the last like five months, four months. And they actually all use hierarchical systems. So these are all like fairly long horizon tasks where you're like cleaning a bedroom, putting like handing over objects and kind of pouring them or putting them into bins, putting away objects into a fridge, putting fruit into bowls.","zh":"这些系统都是处理较长时间跨度的任务，例如打扫卧室、传递物体、倒出或放入容器、将物品放入冰箱、将水果放入碗中等。","start":2722.95,"end":2741.75},{"id":161,"text":"If you look at the architectures for these things, they all have some higher-level model that's predicting intermediate goals and some lower-level model that is predicting low-level actions.","zh":"如果你观察这些系统的架构，它们都包含一个较高层次的模型，用于预测中间目标，以及一个较低层次的模型，用于预测低层次动作。","start":2742.99,"end":2756.17},{"id":162,"text":"These are in robotics domains, likewise in language model domains, things like chain of thought, where you're kind of reasoning through intermediate steps, and then actually outputting tokens for those steps is also really popular for completing more challenging language tasks.","zh":"这些系统应用于机器人领域，同样也应用于语言模型领域，例如思维链（chain of thought），其中你通过中间步骤进行推理，然后实际输出这些步骤的标记，这种方法在完成更具挑战性的语言任务时也非常流行。","start":2757.33,"end":2772.99},{"id":163,"text":"Cool. So I want to cover a few examples of these systems. And I picked examples that I think","zh":"很好。我想介绍一些这些系统的例子。我挑选的例子是我认为","start":2776.49,"end":2783.49},{"id":164,"text":"illustrate a few different design choices that are helpful and actually have comparisons on those","zh":"能够说明一些有帮助的设计选择，并且这些设计选择之间还有比较。","start":2783.49,"end":2788.21},{"id":165,"text":"design choices that kind of elucidate some of the benefits of one design choice versus another.","zh":"这些设计选择在某种程度上阐明了某种设计选择相对于另一种设计选择的优势。","start":2788.21,"end":2793.11},{"id":166,"text":"So let's start with talking about hierarchical imitation learning systems.","zh":"那么，我们首先来谈谈分层模仿学习系统。","start":2794.85,"end":2797.65},{"id":167,"text":"systems. And we'll start with language subgoals. And let's first talk about what the data would","zh":"系统。我们将从语言子目标开始。首先，我们来谈谈用于训练具有语言子目标的分层模仿学习系统的数据会是什么样子。","start":2797.65,"end":2807.17},{"id":168,"text":"look like for training a hierarchical imitation learning system with language subgoals.","zh":"数据，这将是一个真实机器人示例。数据的样子实际上是","start":2807.17,"end":2810.37},{"id":169,"text":"So the data, this will be kind of a real robot example. And what the data looks like is actually","zh":"它将使用完成完整长时域任务的长时域演示数据。因此，在这种情况下，任务是制作混合坚果并将其放入袋子里。","start":2812.23,"end":2819.67},{"id":170,"text":"it's going to use data of a long horizon demonstration of completing the complete","zh":"有了这个完整任务的长时域演示，它将被分割成","start":2819.67,"end":2824.61},{"id":171,"text":"long horizon task. And so this case, the task is to make trail mix and put the trail mix into a bag.","zh":"每个段落都有语言标签。在这种情况下，数据中的段落可以具有一个","start":2824.61,"end":2830.81},{"id":172,"text":"And with this long horizon demonstration for the full task, it will then be segmented into","zh":"数据中的段落可以具有一个","start":2832.57,"end":2838.55},{"id":173,"text":"with language labels for each segment. And in this case, the segments in the data can have a","zh":"数据中的段落可以具有一个","start":2839.45,"end":2846.93},{"id":174,"text":"variable length so variable like you might kind of if for example the kind of","zh":"变量长度所以变量像你可能会比如说这种类型的","start":2846.93,"end":2855.59}],"notes":["本段讨论了分层模仿学习系统中语言子目标的数据形式。讲者提到，数据是长时域任务的演示，例如制作混合坚果并放入袋中。数据被分割成带有语言标签的片段，每个片段的长度可以变化。这表明系统需要处理不同长度的子任务，并通过语言标签进行指导。","讲者进一步说明，这些系统在机器人领域和语言模型领域都有应用。例如，在语言模型中，链式推理（chain of thought）通过中间步骤进行推理，然后输出对应的标记，这在完成复杂语言任务时非常流行。","讲者提到，他选择了一些系统作为例子，这些例子展示了不同的设计选择，并且这些设计选择之间有比较。这表明在分层系统设计中，不同的选择会影响系统的性能和适用性。","讲者开始讨论分层模仿学习系统，并以语言子目标为例。他提到，训练数据需要包含长时域任务的演示，并且这些演示被分割成带有语言标签的片段。这表明系统需要能够处理不同长度的子任务，并通过语言标签进行指导。","讲者提到，这些系统在机器人领域和语言模型领域都有应用。例如，在语言模型中，链式推理（chain of thought）通过中间步骤进行推理，然后输出对应的标记，这在完成复杂语言任务时非常流行。","讲者提到，他选择了一些系统作为例子，这些例子展示了不同的设计选择，并且这些设计选择之间有比较。这表明在分层系统设计中，不同的选择会影响系统的性能和适用性。"],"formulas":[],"uncertainties":["variable length so variable like you might kind of if for example the kind of"],"diagram":"none","start":2689.66,"end":2855.59,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":17,"raw_segments":[{"start":2689.66,"text":"for past goals. It's also worth mentioning that you could potentially combine these where you try to estimate progress, but then if it's been a long period of time, then you re-query anyway. But yeah, the takeaway is that generally option two is typically what people do where you just query at a fixed lower frequency."},{"start":2707.57,"text":"Cool. So let's look at some example systems. And I guess one thing that I'll mention is that hierarchy is pretty popular these days. So here are four systems that were all..."},{"start":2722.95,"text":"kind of announced in the last like five months, four months. And they actually all use hierarchical systems. So these are all like fairly long horizon tasks where you're like cleaning a bedroom, putting like handing over objects and kind of pouring them or putting them into bins, putting away objects into a fridge, putting fruit into bowls."},{"start":2742.99,"text":"If you look at the architectures for these things, they all have some higher-level model that's predicting intermediate goals and some lower-level model that is predicting low-level actions."},{"start":2757.33,"text":"These are in robotics domains, likewise in language model domains, things like chain of thought, where you're kind of reasoning through intermediate steps, and then actually outputting tokens for those steps is also really popular for completing more challenging language tasks."},{"start":2776.49,"text":"Cool. So I want to cover a few examples of these systems. And I picked examples that I think"},{"start":2783.49,"text":"illustrate a few different design choices that are helpful and actually have comparisons on those"},{"start":2788.21,"text":"design choices that kind of elucidate some of the benefits of one design choice versus another."},{"start":2794.85,"text":"So let's start with talking about hierarchical imitation learning systems."},{"start":2797.65,"text":"systems. And we'll start with language subgoals. And let's first talk about what the data would"},{"start":2807.17,"text":"look like for training a hierarchical imitation learning system with language subgoals."},{"start":2812.23,"text":"So the data, this will be kind of a real robot example. And what the data looks like is actually"},{"start":2819.67,"text":"it's going to use data of a long horizon demonstration of completing the complete"},{"start":2824.61,"text":"long horizon task. And so this case, the task is to make trail mix and put the trail mix into a bag."},{"start":2832.57,"text":"And with this long horizon demonstration for the full task, it will then be segmented into"},{"start":2839.45,"text":"with language labels for each segment. And in this case, the segments in the data can have a"},{"start":2846.93,"text":"variable length so variable like you might kind of if for example the kind of"}],"speech_gaps":[],"frame":"../frames/v025/017.webp","frame_time":2701.66},{"title":"分层强化学习与模仿学习中的数据标注与策略结构","segments":[{"id":175,"text":"the robot trajectory looks something like this, then you might have the first subtask is something like this. The second subtask is maybe shorter. The third subtask is maybe longer. So you'll have variable frequency in the data, but the actual system will later be using a fixed frequency where it's kind of re-querying more frequently than the typical segment length in the data. So these are different language labels. These labels can either be","zh":"机器人的轨迹看起来像这样，那么你可能会有第一个子任务像这样。第二个子任务可能是更短的。第三个子任务可能是更长的。因此，数据中会有变化的频率，但实际系统之后会使用固定的频率，其中它会比数据中的典型段长度更频繁地重新查询。因此，这些是不同的语言标签。这些标签可以在数据收集期间记录，你实际上会说，我要捡起袋子，然后演示捡起袋子的动作，然后说我要捡起中间的勺子，按顺序演示这个动作。或者你可以在事后进行标注，即先收集完整的演示，然后使用标注界面，将像这样的段标记为捡起袋子，这样的段标记为捡起中间的勺子，这样的段标记为获取M&Ms，依此类推。","start":2856.3,"end":2886.28},{"id":176,"text":"kind of recorded during data collection, where you're actually saying, I'm going to pick up the bag and then do a demonstration of picking up the bag, then say I'm going to pick up the middle scoop, do a demonstration of that in sequence. Or you can do it post-hoc, where you just collect the full demonstration, and then with a labeling interface, label like this segment is picking up the bag, this segment is picking up the middle scoop, this segment is getting M&Ms, and so forth.","zh":"因此，我们有带有相关语言指令的分段演示。这里有一个这样的例子，这表明一个段可能在捡起一片奶酪时更长。另一个段可能在将奶酪放在面包上时更短。很酷。一旦我们有了这些数据，我们将使用模仿学习训练一个高层策略和一个低层策略。高层策略将从观察中输出语言标签。","start":2887.89,"end":2911.31},{"id":177,"text":"So we have segmented demonstrations with the associated language command. Here's another example of what this would look like where, and this kind of shows that like one segment might be longer for picking up a slice of cheese. A different segment might be shorter for putting the cheese on the bread and so forth. Cool. And then once we have this data, we'll train a high-level policy and a low-level policy with imitation learning. And the high-level policy will be outputting the language labels from the observations.","zh":"低层策略将根据语言标签和观察结果预测动作。这看起来是将一个图像观察（例如RGB图像）输入到一个高层策略中，该策略被训练以预测语言标签。然后你将有一个低层策略，它除了观察结果外还接受语言标签。在这种情况下……","start":2913.5,"end":2943.71},{"id":178,"text":"And the low-level will be taking the language labels and the observations and predicting the actions. So what this looks like is taking an image observation, so an RGB image, passes into a high-level policy that's trained to predict the language label. And then you'll have a low-level policy that takes the language in addition to the observations. In this case...","zh":"低层策略将根据语言标签和观察结果预测动作。这看起来是将一个图像观察（例如RGB图像）输入到一个高层策略中，该策略被训练以预测语言标签。然后你将有一个低层策略，它除了观察结果外还接受语言标签。在这种情况下……","start":2944.51,"end":2970.76},{"id":179,"text":"The work chooses to use not just RGB images, but also joint angles as input to the low-level policy. And generally, it's okay to have actually this sort of mismatch between observations for the high-level and the low-level policy. And then the low-level policy outputs joint commands. And the low-level policy operates at 50 hertz. And I can't remember the exact frequency of the high-level policy, but I think it's something around 1 hertz. Cool.","zh":"这项工作选择不仅使用RGB图像，还使用关节角度作为低级策略的输入。通常来说，高低级策略之间的观测数据存在这种不匹配是可以接受的。然后，低级策略输出关节指令。低级策略以50赫兹的频率运行。我不记得高级策略的确切频率，但认为大约是1赫兹。不错。","start":2972.1,"end":3003.31},{"id":180,"text":"So that's the general setup. Now, we also learned about Dagger. And you can think about if we just do imitation learning on the offline data, we might have issues where we're training these somewhat independently, although the data is at least of the full long horizon task. And we can actually use Dagger with these systems on both the low-level policy and the high-level policy.","zh":"这就是总体的设置。我们还学习了Dagger方法。你可以这样思考，如果我们仅在离线数据上进行模仿学习，可能会遇到问题，即这些策略在某种程度上是独立训练的，尽管数据至少涵盖了完整的长时任务。实际上，我们可以将Dagger方法应用于这些系统，无论是低级策略还是高级策略。","start":3004.75,"end":3032.2}],"notes":["本段讲解了分层强化学习中如何对机器人轨迹进行子任务划分，并通过语言标签进行标注。数据中子任务的频率可能不同，但系统在运行时会使用固定频率进行查询，该频率高于数据中的典型段长度。语言标签可以是在数据收集过程中记录，也可以在事后通过标注界面进行标注。","在分层强化学习中，高阶策略负责输出语言标签，低阶策略则根据语言标签和观测预测动作。高阶策略通常使用图像观测（如RGB图像）来预测语言标签，而低阶策略则结合语言标签和观测进行动作预测。","低阶策略的输入不仅包括图像，还包括关节角度，这可能导致高阶和低阶策略之间的观测不匹配。低阶策略以50赫兹的频率运行，而高阶策略的频率大约为1赫兹。","在模仿学习中，Dagger算法可以用于训练高阶和低阶策略。如果仅使用离线数据进行模仿学习，可能会出现策略训练独立的问题，但Dagger可以缓解这一问题，特别是在处理长时序任务时。","分层强化学习的结构包括高阶策略和低阶策略的协同工作，其中高阶策略负责任务分解和语言标签生成，低阶策略负责具体动作的执行。这种结构有助于提高复杂任务的可学习性和效率。","在实际应用中，分层强化学习需要考虑数据标注的准确性以及策略之间的协调性。语言标签的生成方式（如实时标注或事后标注）会影响系统的训练效果和最终性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2856.3,"end":3032.2,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":6,"raw_segments":[{"start":2856.3,"text":"the robot trajectory looks something like this, then you might have the first subtask is something like this. The second subtask is maybe shorter. The third subtask is maybe longer. So you'll have variable frequency in the data, but the actual system will later be using a fixed frequency where it's kind of re-querying more frequently than the typical segment length in the data. So these are different language labels. These labels can either be"},{"start":2887.89,"text":"kind of recorded during data collection, where you're actually saying, I'm going to pick up the bag and then do a demonstration of picking up the bag, then say I'm going to pick up the middle scoop, do a demonstration of that in sequence. Or you can do it post-hoc, where you just collect the full demonstration, and then with a labeling interface, label like this segment is picking up the bag, this segment is picking up the middle scoop, this segment is getting M&Ms, and so forth."},{"start":2913.5,"text":"So we have segmented demonstrations with the associated language command. Here's another example of what this would look like where, and this kind of shows that like one segment might be longer for picking up a slice of cheese. A different segment might be shorter for putting the cheese on the bread and so forth. Cool. And then once we have this data, we'll train a high-level policy and a low-level policy with imitation learning. And the high-level policy will be outputting the language labels from the observations."},{"start":2944.51,"text":"And the low-level will be taking the language labels and the observations and predicting the actions. So what this looks like is taking an image observation, so an RGB image, passes into a high-level policy that's trained to predict the language label. And then you'll have a low-level policy that takes the language in addition to the observations. In this case..."},{"start":2972.1,"text":"The work chooses to use not just RGB images, but also joint angles as input to the low-level policy. And generally, it's okay to have actually this sort of mismatch between observations for the high-level and the low-level policy. And then the low-level policy outputs joint commands. And the low-level policy operates at 50 hertz. And I can't remember the exact frequency of the high-level policy, but I think it's something around 1 hertz. Cool."},{"start":3004.75,"text":"So that's the general setup. Now, we also learned about Dagger. And you can think about if we just do imitation learning on the offline data, we might have issues where we're training these somewhat independently, although the data is at least of the full long horizon task. And we can actually use Dagger with these systems on both the low-level policy and the high-level policy."}],"speech_gaps":[],"frame":"../frames/v025/018.webp","frame_time":2868.3},{"title":"分层强化学习与模仿学习中的语言监督","segments":[{"id":181,"text":"Now, one thing that's pretty cool is that actually for the high-level policy, we can actually update the high-level policy with language supervision. And so Dagger on the high-level policy is actually in language space, not in joint space. And so...","zh":"现在，一件很酷的事情是，实际上我们可以用语言监督来更新高层策略。因此，在高层策略上进行Dagger实际上是发生在语言空间中，而不是联合空间中。因此...","start":3033.53,"end":3049.35},{"id":182,"text":"In this particular approach, in principle, you can do Dagger on both low level and high level. In this particular approach, if you were to do it on the high level with freezing the low level, you would kind of be running the policy, the full system, and then you would then kind of type or speak a language command that is going to override the high-level policy. And then...","zh":"在这一特定方法中，原则上你可以在低层和高层都进行Dagger。在这一特定方法中，如果你在高层进行Dagger并冻结低层，你实际上是在运行整个系统策略，然后你可能会输入或说出一个语言指令，以覆盖高层策略。然后...","start":3051.14,"end":3075.12},{"id":183,"text":"then continue collecting data and at some point you might give control back to the high-level policy. Then from there, you can fine-tune and actually do gradient steps on data that has these kinds of language interventions to actually fine-tune the high-level policy. When you do this together with the high-level policy and the low-level policy acting as one system, then you can actually adapt the high-level policy to deficiencies in the low-level policy.","zh":"然后继续收集数据，并在某个时候将控制权交还给高层策略。从那时起，你可以进行微调，并在包含这些语言干预的数据上进行梯度更新，从而真正微调高层策略。当你将高层策略和低层策略作为一个系统一起运行时，你实际上可以将高层策略适应于低层策略的缺陷。","start":3075.82,"end":3104.36},{"id":184,"text":"So, for example, if there's one language command that the low-level policy makes a mistake on, then you could actually issue some corrections to help compensate for that mistake.","zh":"例如，如果有一个语言指令，低层策略在该指令上犯了错误，那么你实际上可以发出一些纠正指令来帮助弥补这个错误。","start":3105.0,"end":3116.6},{"id":185,"text":"So, yeah, I guess to summarize, we can train the high-level policy and the low-level policy both with imitation and then freeze the low-level policy and update the high-level policy with Dagger by supervising on language corrections.","zh":"所以，总结一下，我们可以用模仿学习来训练高层策略和低层策略，然后冻结低层策略，并通过语言纠正来监督更新高层策略。","start":3119.02,"end":3132.06},{"id":186,"text":"And so as a video of what this looks like, these yellow commands are showing the output of the high-level policy.","zh":"作为一个视频示例，这些黄色指令展示了高层策略的输出。","start":3135.0,"end":3141.9},{"id":187,"text":"And then the robot motions are showing the output of the low-level policy.","zh":"然后机器人的动作展示了低层策略的输出。","start":3142.74,"end":3145.98},{"id":188,"text":"And so at the beginning, the high-level policy is saying pick up spoon.","zh":"因此，在开始时，高层策略说的是“拿起勺子”。","start":3148.3,"end":3153.8},{"id":189,"text":"The robot picks up the spoon.","zh":"机器人拿起勺子。","start":3153.94,"end":3154.84},{"id":190,"text":"Move the spoon towards me.","zh":"将勺子向我移动。","start":3155.36,"end":3156.56},{"id":191,"text":"So then it says I want some peanuts.","zh":"然后它说我想吃一些花生。","start":3156.68,"end":3157.84},{"id":192,"text":"So then the low-level policy scoops peanuts.","zh":"然后低层策略开始舀花生。","start":3157.98,"end":3159.64},{"id":193,"text":"Then the high-level policy says move the scoop into the bag.","zh":"接着高层策略说将舀子放进袋子里。","start":3159.92,"end":3162.04},{"id":194,"text":"The low-level policy starts to do that.","zh":"低层策略开始执行这个动作。","start":3162.2,"end":3163.82},{"id":195,"text":"At this point, you'll actually notice that the robot's about to make a mistake.","zh":"此时，你实际上会注意到机器人即将犯错。","start":3163.82,"end":3167.0},{"id":196,"text":"And so that's when you can intervene.","zh":"这时你就可以进行干预。","start":3167.36,"end":3168.78},{"id":197,"text":"And instead of telling the robot, move the scoop in the bag,","zh":"而不是告诉机器人将勺子放入袋子里，","start":3170.02,"end":3172.74},{"id":198,"text":"because it seems like the low-level policy isn't going to do that correctly,","zh":"因为看起来低层策略不会正确地执行这个动作，","start":3172.94,"end":3175.6},{"id":199,"text":"you could then intervene and say, move the scoop into the bag.","zh":"你可以干预并说，将勺子放入袋子里。","start":3176.42,"end":3182.6},{"id":200,"text":"Sorry, instead of saying move the scoop into the bag, you say move the left arm to the left,","zh":"抱歉，而不是说将勺子放入袋子里，你说将左臂向左移动，","start":3182.74,"end":3185.78},{"id":201,"text":"go higher, move the scoop into the bag then.","zh":"再抬高一些，然后将勺子放入袋子里。","start":3186.78,"end":3190.42},{"id":202,"text":"then. And so these user commands are overriding the high-level policy. And then at this point,","zh":"然后，这些用户指令会覆盖高层策略。然后在这个时候，","start":3190.42,"end":3195.94},{"id":203,"text":"you can give control back to the high-level policy, and the high-level policy predicts","zh":"你可以将控制权交还给高层策略，而高层策略会预测","start":3195.98,"end":3200.98},{"id":204,"text":"pour into the bag and get some banana chips and so forth. So that's kind of what this sort of","zh":"倒入袋子并获取一些香蕉片等。所以这就是这种类型的","start":3200.98,"end":3210.98}],"notes":["本段讲解了在分层强化学习中如何利用语言监督来更新高层策略。Dagger算法可以应用于高层和低层策略，但通常在高层策略中使用语言监督，而不是联合空间。当高层策略执行时，如果发现低层策略有错误，可以通过语言干预来纠正，然后将控制权交还给高层策略，从而优化高层策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3033.53,"end":3210.98,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":24,"raw_segments":[{"start":3033.53,"text":"Now, one thing that's pretty cool is that actually for the high-level policy, we can actually update the high-level policy with language supervision. And so Dagger on the high-level policy is actually in language space, not in joint space. And so..."},{"start":3051.14,"text":"In this particular approach, in principle, you can do Dagger on both low level and high level. In this particular approach, if you were to do it on the high level with freezing the low level, you would kind of be running the policy, the full system, and then you would then kind of type or speak a language command that is going to override the high level policy. And then..."},{"start":3075.82,"text":"then continue collecting data and at some point you might give control back to the high-level policy. Then from there, you can fine-tune and actually do gradient steps on data that has these kinds of language interventions to actually fine-tune the high-level policy. When you do this together with the high-level policy and the low-level policy acting as one system, then you can actually adapt the high-level policy to deficiencies in the low-level policy."},{"start":3105.0,"text":"So, for example, if there's one language command that the low-level policy makes a mistake on, then you could actually issue some corrections to help compensate for that mistake."},{"start":3119.02,"text":"So, yeah, I guess to summarize, we can train the high-level policy and the low-level policy both with imitation and then freeze the low-level policy and update the high-level policy with Dagger by supervising on language corrections."},{"start":3135.0,"text":"And so as a video of what this looks like, these yellow commands are showing the output of the high-level policy."},{"start":3142.74,"text":"And then the robot motions are showing the output of the low-level policy."},{"start":3148.3,"text":"And so at the beginning, the high-level policy is saying pick up spoon."},{"start":3153.94,"text":"The robot picks up the spoon."},{"start":3155.36,"text":"Move the spoon towards me."},{"start":3156.68,"text":"So then it says I want some peanuts."},{"start":3157.98,"text":"So then the low-level policy scoops peanuts."},{"start":3159.92,"text":"Then the high-level policy says move the scoop into the bag."},{"start":3162.2,"text":"The low-level policy starts to do that."},{"start":3163.82,"text":"At this point, you'll actually notice that the robot's about to make a mistake."},{"start":3167.36,"text":"And so that's when you can intervene."},{"start":3170.02,"text":"And instead of telling the robot, move the scoop in the bag,"},{"start":3172.94,"text":"because it seems like the low-level policy isn't going to do that correctly,"},{"start":3176.42,"text":"you could then intervene and say, move the scoop into the bag."},{"start":3182.74,"text":"Sorry, instead of saying move the scoop into the bag, you say move the left arm to the left,"},{"start":3186.78,"text":"go higher, move the scoop into the bag then."},{"start":3190.42,"text":"then. And so these user commands are overriding the high-level policy. And then at this point,"},{"start":3195.98,"text":"you can give control back to the high-level policy, and the high-level policy predicts"},{"start":3200.98,"text":"pour into the bag and get some banana chips and so forth. So that's kind of what this sort of"}],"speech_gaps":[],"frame":"../frames/v025/019.webp","frame_time":3045.53},{"title":"分层强化学习与模仿学习中的自适应策略","segments":[{"id":205,"text":"dagger intervention looks like in the high-level space. And then after you fine-tune the high-level","zh":"dagger干预在高层空间中看起来是什么样子的。然后你在微调高层","start":3210.98,"end":3216.1},{"id":206,"text":"and know that the low-level policy is making a mistake","zh":"并且知道低层策略正在犯错误","start":3216.1,"end":3220.2},{"id":207,"text":"where it was about to make kind of the same sort of mistake again.","zh":"它即将再次犯类似的错误。","start":3220.2,"end":3222.62},{"id":208,"text":"And then the high-level policy says go higher","zh":"然后高层策略说向上移动","start":3222.62,"end":3225.64},{"id":209,"text":"and then move the scoop into the bag","zh":"然后将勺子移入袋子中","start":3225.94,"end":3228.32},{"id":210,"text":"to kind of prevent that sort of mistake.","zh":"以防止这种类型的错误。","start":3228.98,"end":3230.62},{"id":211,"text":"And so this is an example of like the high-level","zh":"因此，这是一个高层","start":3230.62,"end":3233.46},{"id":212,"text":"and low-level policy adapting together","zh":"和低层策略共同适应的例子","start":3233.62,"end":3235.0},{"id":213,"text":"to account for deficiencies.","zh":"以弥补不足。","start":3235.0,"end":3236.78},{"id":214,"text":"Cool.","zh":"不错。","start":3238.06,"end":3240.36},{"id":215,"text":"Now we've talked about hierarchy versus flat policies.","zh":"现在我们已经讨论了层次结构策略与扁平策略之间的区别。","start":3241.96,"end":3242.32},{"id":216,"text":"You could ask, like you could actually do a comparison.","zh":"你可以提问，比如你实际上可以做一个比较。","start":3243.66,"end":3245.76},{"id":217,"text":"You could ask, like you could actually do a comparison.","zh":"你可以提问，比如你实际上可以做一个比较。","start":3246.12,"end":3247.94},{"id":218,"text":"Like in this particular setup, does hierarchy compare, like outperform using a single flat policy to do the long horizon task?","zh":"例如在这个特定的设置中，层次结构策略是否比使用单一扁平策略来完成长时域任务表现更好？","start":3247.94,"end":3255.8},{"id":219,"text":"And you can also actually compare Dagger to imitation learning for the high-level policy. And you can also see that there's an improvement from using Dagger compared to just using vanilla imitation learning. And this is the sort of improvement that you get from adapting the policies together. Cool. And then generally with hierarchy, the nice thing about hierarchy is you can do longer horizon tasks. And so with this full system, you can, for example...","zh":"你也可以实际比较Dagger与模仿学习在高层策略中的表现。你也可以看到，使用Dagger相比单纯的模仿学习有所改进。这种改进来自于同时适应策略。不错。一般来说，层次结构的优势在于可以处理更长的时域任务。因此，使用这个完整的系统，例如你可以让机器人将三个物体放入Ziploc袋中，这通常是一个相当困难的任务，尤其是在一次操作中完成。同样地，使用类似的系统，你也可以让机器人执行诸如‘打扫卧室’的高层指令，而低层策略则会输出诸如‘捡起衬衫’、‘将衬衫放入篮子’等具体动作。","start":3258.26,"end":3279.88},{"id":220,"text":"get the robot to put three objects into a Ziploc bag, which is traditionally a pretty difficult task to do, especially in one go. And likewise, with a similar system, you can also get a robot to... The high-level command is clean the bedroom, and then the low-level policy will output things like pick up shirt, put shirt in basket, pick up shirt, put shirt in basket.","zh":"让机器人一次性将三个物体放入Ziploc袋中，这通常是一个相当困难的任务，尤其是要一次性完成。同样地，使用类似的系统，你也可以让机器人去……高层指令是打扫卧室，然后低层策略会输出诸如拿起衬衫、把衬衫放入篮子、拿起衬衫、把衬衫放入篮子等动作。","start":3281.69,"end":3309.25},{"id":221,"text":"And later, pick up the pillow, adjust the blanket, put the pillow at the top of the bed, adjust the pillow, pick up tissue, put the tissue in the trash can, and so forth. And so these are things that would be very hard to do if you just trained a single flat policy. So instead of using language, we could also use images as an intermediate representation. And so what this would look like is instead of having the high-level policy output language, you would output a goal image.","zh":"之后，拿起枕头，调整被子，把枕头放在床的顶部，调整枕头，拿起纸巾，把纸巾放进垃圾桶，等等。这些事情如果只是训练一个单一的平坦策略，将会非常难以完成。因此，除了使用语言，我们也可以使用图像作为中间表示。具体来说，就是让高层策略输出目标图像，而不是输出语言。","start":3310.56,"end":3332.74},{"id":222,"text":"So it'd be like this is the kind of an image of what I want you to accomplish in the future. In practice, you can use a generative model like an image editing model to do this that takes as input the image of the current step and then edits that to look like an image at a future time step that you want the robot to achieve.","zh":"这就像一张图像，表示我希望你在未来完成的任务。实际上，你可以使用生成模型，例如图像编辑模型来实现这一点，该模型以当前步骤的图像作为输入，然后将其编辑成一个你希望机器人在未来时间步达到的图像。","start":3334.52,"end":3363.12},{"id":223,"text":"So it'd be like this is the kind of an image of what I want you to accomplish in the future. In practice, you can use a generative model like an image editing model to do this that takes as input the image of the current step and then edits that to look like an image at a future time step that you want the robot to achieve.","zh":"这就像一张图像，表示我希望你在未来完成的任务。实际上，你可以使用生成模型，例如图像编辑模型来实现这一点，该模型以当前步骤的图像作为输入，然后将其编辑成一个你希望机器人在未来时间步达到的图像。","start":3363.97,"end":3379.63}],"notes":["本段讲解了分层强化学习中高阶策略和低阶策略如何通过Dagger算法进行自适应调整，以纠正低阶策略的错误。高阶策略通过干预和微调，能够识别低阶策略即将重复的错误，并采取措施防止错误再次发生。这种自适应机制是分层策略的一个关键优势。","讲者提到，分层策略在任务进度和指令遵循方面相比单一的平坦策略有显著提升，例如在任务进度上提升了34%。这表明分层策略在处理长时域任务时具有更好的表现。","Dagger算法与模仿学习的比较显示，使用Dagger可以提升高阶策略的性能。这种提升来自于策略之间的协同适应，即高阶策略和低阶策略共同优化，以提高整体任务完成的准确性。","分层策略的一个重要优势是能够处理更长的时域任务。例如，机器人可以完成将三个物体放入Ziploc袋的任务，这在单一策略下是难以实现的。此外，分层策略还可以用于更复杂的任务，如清洁卧室，其中低阶策略会执行具体的动作，如捡起衣物、放入篮子等。","讲者还提到，除了使用语言作为中间表示，还可以使用图像作为中间表示。高阶策略可以输出目标图像，而低阶策略则根据该图像执行具体动作。这种图像表示可以通过生成模型（如图像编辑模型）实现，输入当前图像并编辑为未来目标图像。","这些例子说明了分层强化学习和模仿学习在实际应用中的潜力，特别是在复杂任务和长时域任务中的优势。通过高阶策略和低阶策略的协同工作，可以显著提高任务完成的效率和准确性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3210.98,"end":3379.63,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":19,"raw_segments":[{"start":3210.98,"text":"dagger intervention looks like in the high-level space. And then after you fine-tune the high-level"},{"start":3216.1,"text":"policy on those kinds of interventions, the high-level policy can then self-correct"},{"start":3220.2,"text":"and know that the low-level policy is making a mistake"},{"start":3222.62,"text":"where it was about to make kind of the same sort of mistake again."},{"start":3225.94,"text":"And then the high-level policy says go higher"},{"start":3228.98,"text":"and then move the scoop into the bag"},{"start":3230.62,"text":"to kind of prevent that sort of mistake."},{"start":3233.62,"text":"And so this is an example of like the high-level"},{"start":3235.0,"text":"and low-level policy adapting together"},{"start":3238.06,"text":"to account for deficiencies."},{"start":3241.96,"text":"Cool."},{"start":3243.66,"text":"Now we've talked about hierarchy versus flat policies."},{"start":3246.12,"text":"You could ask, like you could actually do a comparison."},{"start":3247.94,"text":"Like in this particular setup, does hierarchy compare, like outperform using a single flat policy to do the long horizon task?"},{"start":3258.26,"text":"This comparison is actually from a different research paper, but it has basically the same approach. And it finds that in terms of task progress, there's a 34% improvement from using hierarchy versus training a single policy to do the full long horizon imitation learning task. And in terms of following instructions, there's also a gap. This is kind of this instruction accuracy metric."},{"start":3281.69,"text":"And you can also actually compare Dagger to imitation learning for the high-level policy. And you can also see that there's an improvement from using Dagger compared to just using vanilla imitation learning. And this is the sort of improvement that you get from adapting the policies together. Cool. And then generally with hierarchy, the nice thing about hierarchy is you can do longer horizon tasks. And so with this full system, you can, for example..."},{"start":3310.56,"text":"get the robot to put three objects into a Ziploc bag, which is traditionally a pretty difficult task to do, especially in one go. And likewise, with a similar system, you can also get a robot to... The high-level command is clean the bedroom, and then the low-level policy will output things like pick up shirt, put shirt in basket, pick up shirt, put shirt in basket."},{"start":3334.52,"text":"And later, pick up the pillow, adjust the blanket, put the pillow at the top of the bed, adjust the pillow, pick up tissue, put the tissue in the trash can, and so forth. And so these are things that would be very hard to do if you just trained a single flat policy. So instead of using language, we could also use images as an intermediate representation. And so what this would look like is instead of having the high-level policy output language, you would output a goal image."},{"start":3363.97,"text":"So it'd be like this is the kind of an image of what I want you to accomplish in the future. In practice, you can use a generative model like an image editing model to do this that takes as input the image of the current step and then edits that to look like an image at a future time step that you want the robot to achieve."}],"speech_gaps":[{"start":3256.2,"end":3257.86}],"frame":"../frames/v025/020.webp","frame_time":3222.98},{"title":"分层强化学习与模仿学习中的图像条件策略","segments":[{"id":224,"text":"And then the low-level policy would no longer be language conditioned, but would rather be a goal image conditioned policy. And so you can think of this as a kind of like an inverse, like a multi-step inverse model that takes as input the current image, some future image, and then outputs the actions that you can take to get to that goal image. And then both of these will be trained again with imitation learning.","zh":"然后，低级策略将不再由语言条件决定，而是由目标图像条件决定的策略。你可以将这种想法视为一种逆向模型，它以当前图像和某个未来图像作为输入，输出可以到达该目标图像的动作。然后，这两种策略都会再次使用模仿学习进行训练。","start":3381.92,"end":3404.48},{"id":225,"text":"And one of the things that's pretty nice is that you no longer need to segment videos with language annotations to do this. You just need the videos of the long horizon task. And to train this high-level policy, you can train it on robot data and predict future images in the trajectory, like from one second or five seconds into the future or 10 seconds in the future. But you can also actually train this high-level policy using YouTube videos or something like that.","zh":"其中一件很不错的便是，你不再需要使用带有语言注释的视频片段来完成这个任务。你只需要长期任务的视频。为了训练这个高级策略，你可以在机器人数据上进行训练，并预测轨迹中未来某一时刻的图像，例如一秒钟、五秒钟或十秒钟之后的图像。你也可以使用YouTube视频或其他类似的视频来训练这个高级策略。","start":3405.73,"end":3433.51},{"id":226,"text":"to predict what are future images that might accomplish some long-term goal. And so that sort of unlabeled video data can be helpful, especially if data from the robot is more sparse. So then an example of what this looks like is, say the task is to move the wooden bowl to the top of the table. You pass that into the high-level policy that then generates images, which are shown with the pink border.","zh":"以预测可能实现长期目标的未来图像。因此，这种无标签的视频数据可能很有帮助，特别是当机器人数据较为稀疏时。例如，假设任务是将木碗移动到桌子顶部。你将这个任务输入到高级策略中，该策略生成图像，这些图像会以粉色边框显示。","start":3433.9,"end":3463.26},{"id":227,"text":"And then that generated subgoal image with the pink border is passed as input to the low-level policy, which then predicts actions. And both of these policies, again, are trained with imitation learning on demonstration data and potentially also if the high-level policy can be trained.","zh":"然后，带有粉色边框的生成子目标图像会被作为输入传递给低级策略，该策略随后预测动作。这两种策略再次使用模仿学习在演示数据上进行训练，如果高级策略也可以被训练的话，还可以使用视频数据进行训练。","start":3463.96,"end":3480.62},{"id":228,"text":"on video data as well. So this one is putting the toothpaste in the wooden bowl. You can see that it generates these subgoal images of like, for example, holding the toothpaste above the bowl. It then reaches that. Then it generates a subgoal of like lowering the arm. And so the robot lowers the arm to complete the task.","zh":"例如，这个例子是将牙膏放入木碗中。你可以看到它生成这些子目标图像，例如将牙膏举在碗上方。然后它完成该动作。接着它生成一个子目标，例如降低手臂。因此，机器人降低手臂以完成任务。","start":3481.12,"end":3498.52},{"id":229,"text":"And then this last example, the goal is to open the drawer. The first subgoal is to put the gripper on the handle. Then the next subgoal is to move the gripper to the right so that it opens, and so forth. Another thing that's nice about this sort of approach is that if your policy sees objects that it's never seen before that are hard to describe in language, then you...","zh":"然后这个最后一个例子，目标是打开抽屉。第一个子目标是将夹爪放在把手上面。接下来的子目标是将夹爪向右移动，以便打开抽屉，依此类推。这种方法的一个优点是，如果你的策略看到之前从未见过的物体，而这些物体很难用语言描述，那么你……","start":3500.53,"end":3525.39},{"id":230,"text":"That's something that it can more easily describe in images","zh":"它可以用图像更轻松地描述这些内容","start":3526.53,"end":3529.45},{"id":231,"text":"because it can more easily generalize across the objects that it's seeing","zh":"因为它可以更容易地在所看到的物体之间进行泛化","start":3529.45,"end":3533.65},{"id":232,"text":"and generate pixels for those images","zh":"并为这些图像生成像素","start":3533.65,"end":3535.15},{"id":233,"text":"if it doesn't know what the semantic name for that object is.","zh":"即使它不知道这些物体的语义名称。","start":3535.15,"end":3538.15},{"id":234,"text":"Cool.","zh":"很酷。","start":3539.51,"end":3539.99},{"id":235,"text":"And then for this sort of thing, you can also do a comparison on, like,","zh":"对于这种情形，你也可以进行比较，例如，","start":3540.93,"end":3544.39},{"id":236,"text":"is it helpful to include those unlabeled videos","zh":"是否包含那些无标签的视频是有帮助的","start":3544.93,"end":3547.57},{"id":237,"text":"for training the high-level policy?","zh":"为了训练高层策略？","start":3547.57,"end":3549.39},{"id":238,"text":"And if you only use robot data, you get performance that looks like this.","zh":"如果你只使用机器人数据，你得到的性能看起来像这样。","start":3550.39,"end":3553.93}],"notes":["本段讲解了分层强化学习中图像条件策略的构建方式，其中低层策略不再依赖语言条件，而是基于目标图像条件。这种策略可以视为一种多步逆模型，输入当前图像和未来图像，输出实现目标的行动。这种策略通过模仿学习进行训练，不需要语言标注的视频数据，只需长期任务的视频数据。","高阶策略可以使用机器人数据或YouTube视频等未标注数据进行训练，以预测未来图像。这种策略在处理稀疏机器人数据时特别有用。例如，任务是将木碗移动到桌子顶部，高阶策略生成目标图像，低阶策略根据这些图像生成动作。","这种分层策略的一个优势是，当策略遇到无法用语言描述的新物体时，可以通过图像更方便地进行描述和泛化。例如，如果不知道物体的语义名称，策略可以生成该物体的像素图像。","此外，还可以通过比较实验来评估未标注视频数据对高阶策略训练的帮助。如果仅使用机器人数据，性能表现如图所示。","课堂中提到的分层策略结合了高阶和低阶策略，其中高阶策略生成子目标图像，低阶策略根据这些图像生成具体动作。这种策略在处理复杂任务时具有良好的扩展性。","课堂中还提到，这种策略可以处理未标注的视频数据，这在机器人数据稀疏时尤为重要。同时，图像条件策略能够更灵活地处理新物体，避免语言描述的局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3381.92,"end":3553.93,"asr_flags":[],"boards":[],"translation_complete":true,"translated_segments":15,"raw_segments":[{"start":3381.92,"text":"And then the low-level policy would no longer be language conditioned, but would rather be a goal image condition policy. And so you can think of this as a kind of like an inverse, like a multi-step inverse model that takes as input the current image, some future image, and then outputs the actions that you can take to get to that goal image. And then both of these will be trained again with imitation learning."},{"start":3405.73,"text":"And one of the things that's pretty nice is that you no longer need to segment videos with language annotations to do this. You just need the videos of the long horizon task. And to train this high-level policy, you can train it on robot data and predict future images in the trajectory, like from one second or five seconds into the future or 10 seconds in the future. But you can also actually train this high-level policy using YouTube videos or something like that."},{"start":3433.9,"text":"to predict what are future images that might accomplish some long-term goal. And so that sort of unlabeled video data can be helpful, especially if data from the robot is more sparse. So then an example of what this looks like is, say the task is to move the wooden bowl to the top of the table. You pass that into the high-level policy that then generates images, which are shown with the pink border."},{"start":3463.96,"text":"And then that generated subgoal image with the pink border is passed as input to the low-level policy, which then predicts actions. And both of these policies, again, are trained with imitation learning on demonstration data and potentially also if the high-level policy can be trained."},{"start":3481.12,"text":"on video data as well. So this one is putting the toothpaste in the wooden bowl. You can see that it generates these subgoal images of like, for example, holding the toothpaste above the bowl. It then reaches that. Then it generates a subgoal of like lowering the arm. And so the robot lowers the arm to complete the task."},{"start":3500.53,"text":"And then this last example, the goal is to open the drawer. The first subgoal is to put the gripper on the handle. Then the next subgoal is to move the gripper to the right so that it opens, and so forth. Another thing that's nice about this sort of approach is that if your policy sees objects that it's never seen before that are hard to describe in language, then you..."},{"start":3526.53,"text":"That's something that it can more easily describe in images"},{"start":3529.45,"text":"because it can more easily generalize across the objects that it's seeing"},{"start":3533.65,"text":"and generate pixels for those images"},{"start":3535.15,"text":"if it doesn't know what the semantic name for that object is."},{"start":3539.51,"text":"Cool."},{"start":3540.93,"text":"And then for this sort of thing, you can also do a comparison on, like,"},{"start":3544.93,"text":"is it helpful to include those unlabeled videos"},{"start":3547.57,"text":"for training the high-level policy?"},{"start":3550.39,"text":"And if you only use robot data, you get performance that looks like this."}],"speech_gaps":[],"frame":"../frames/v025/021.webp","frame_time":3393.92},{"title":"分层强化学习与模仿学习的结合与应用","segments":[{"id":239,"text":"And if you add videos of humans for training the high-level policy, you get an increase in performance compared to just using the robot data to train the policies.","zh":"如果你在训练高层策略时加入人类的视频数据，与仅使用机器人数据来训练策略相比，性能会有提升。","start":3553.93,"end":3564.35},{"id":240,"text":"Now, we talked earlier about how chain of thought can
