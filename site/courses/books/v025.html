the high-level policy will output. Now, if we haven't actually learned the high-level policy yet, this puts things in a bit of a tricky situation. Likewise, for the high-level policy,"}],"speech_gaps":[],"frame":"../frames/v025/012.webp","frame_time":1860.02},{"title":"分层强化学习中的低层策略与高层策略的衔接","segments":[{"id":109,"text":"If we assume that our low-level policy is really great, then we might not realize that it actually has some deficiencies and that we need to, for example, continue to command something in certain states until you've actually reached a state that a different skill can operate in. Yeah.","start":2017.67,"end":2037.29},{"id":110,"text":"Yeah, so if the low-level policy works from particular sequences of states, then the high-level policy can learn that it should kind of walk the low-level policy through those states. So you don't necessarily need your low-level policy to work from every state. It just needs to work for the state goal combinations that the high-level policy is going to command. Now, you might have a situation where, say that your low-level policy...","start":2037.81,"end":2059.05},{"id":111,"text":"kind of knows how to do kind of something like this. So it knows how to go from here to here. It knows how to go from here to here and maybe knows how to go from here to here.","start":2060.61,"end":2069.59},{"id":112,"text":"like with some boiled water, then you might have some sort of gap where to actually find the pasta, you need to kind of go back to these states. And if you don't have like a command or some way to get from here to here, then you're going to basically have a gap in the states that you're visiting and the high-level policy will struggle to actually get to this state here.","start":2071.41,"end":2091.71},{"id":113,"text":"So basically, one way to think about it is you need to make sure that there's at least some overlap in the states from one skill to the next. And ideally, that overlap has some buffer. Because if, for example, when you're trying to find the pasta, it only works if you're standing exactly in front of the boiled water and not if you're a little bit to the right. Then if your policy ends up deciding to boil the water, standing a little bit to the right of it, then you'll get a brittle finding.","start":2092.3,"end":2121.6},{"id":114,"text":"final result where it will kind of struggle in that case. So the way to think about that is that, I guess one way to think about it is that if this low-level policy only works from this part of the states where the water is being boiled and the high-level policy gets you here, or the previous low-level policy gets you here, then you're going to have a little bit of a gap between here and here. And that sort of gap can lead to brittle performance on the full long horizon task.","start":2121.61,"end":2152.33},{"id":115,"text":"Yeah, so the question is, does it have to be a fixed sequence? And can you learn if one sequence is more efficient than another? And yeah, so absolutely, the high-level policy can actually decide which sequence it wants to do. And that sequence might depend on what's the most efficient. It might also depend on where these...","start":2153.33,"end":2170.63}],"notes":["本段讨论了分层强化学习中低层策略与高层策略之间的衔接问题。讲者指出，如果低层策略在某些状态下表现不佳，高层策略可能需要继续指挥以确保能够到达适合其他技能操作的状态。这表明，低层策略并不需要在所有状态下都有效，只需要在高层策略命令的目标状态组合中有效。","讲者进一步说明，如果低层策略在某些状态之间存在间隙，例如在寻找意大利面时需要回到特定状态，但缺乏从当前状态到目标状态的命令或路径，那么高层策略将难以到达目标状态。这强调了状态覆盖的重要性，以及在不同技能之间保持状态重叠的必要性。","讲者提到，为了防止性能脆弱，低层策略在状态之间的重叠应具有缓冲区。例如，如果低层策略只能在精确的位置（如正对煮沸的水）才能有效，而高层策略可能将代理带到稍偏的位置，那么低层策略将无法有效执行任务，导致性能下降。","讲者还指出，这种状态间隙可能导致在长期任务中出现脆弱的性能表现。因此，设计低层策略时需要确保其在不同技能之间有良好的状态覆盖，以避免因状态不连续而导致的失败。","最后，讲者提到高层策略可以决定使用哪种序列，并且该序列可能取决于效率或当前状态。这表明，高层策略在选择低层策略序列时具有一定的灵活性，可以根据任务需求进行调整。","整体而言，本段强调了分层强化学习中低层策略与高层策略之间的衔接问题，以及状态覆盖和缓冲区设计的重要性，以确保任务的稳定性和高效性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2017.67,"end":2170.63,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2017.67,"text":"If we assume that our low-level policy is really great, then we might not realize that it actually has some deficiencies and that we need to, for example, continue to command something in certain states until you've actually reached a state that a different skill can operate in. Yeah."},{"start":2037.81,"text":"Yeah, so if the low-level policy works from particular sequences of states, then the high-level policy can learn that it should kind of walk the low-level policy through those states. So you don't necessarily need your low-level policy to work from every state. It just needs to work for the state goal combinations that the high-level policy is going to command. Now, you might have a situation where, say that your low-level policy..."},{"start":2060.61,"text":"kind of knows how to do kind of something like this. So it knows how to go from here to here. It knows how to go from here to here and maybe knows how to go from here to here."},{"start":2071.41,"text":"like with some boiled water, then you might have some sort of gap where to actually find the pasta, you need to kind of go back to these states. And if you don't have like a command or some way to get from here to here, then you're going to basically have a gap in the states that you're visiting and the high-level policy will struggle to actually get to this state here."},{"start":2092.3,"text":"So basically, one way to think about it is you need to make sure that there's at least some overlap in the states from one skill to the next. And ideally, that overlap has some buffer. Because if, for example, when you're trying to find the pasta, it only works if you're standing exactly in front of the boiled water and not if you're a little bit to the right. Then if your policy ends up deciding to boil the water, standing a little bit to the right of it, then you'll get a brittle finding."},{"start":2121.61,"text":"final result where it will kind of struggle in that case. So the way to think about that is that, I guess one way to think about it is that if this low-level policy only works from this part of the states where the water is being boiled and the high-level policy gets you here, or the previous low-level policy gets you here, then you're going to have a little bit of a gap between here and here. And that sort of gap can lead to brittle performance on the full long horizon task."},{"start":2153.33,"text":"Yeah, so the question is, does it have to be a fixed sequence? And can you learn if one sequence is more efficient than another? And yeah, so absolutely, the high-level policy can actually decide which sequence it wants to do. And that sequence might depend on what's the most efficient. It might also depend on where these..."}],"speech_gaps":[],"frame":"../frames/v025/013.webp","frame_time":2029.67},{"title":"分层强化学习与模仿学习中的策略协作","segments":[{"id":116,"text":"where the low-level policy is most successful. And so one of the reasons why I wanted to pick this example is actually these two steps can be done in any order, and the high-level policy could decide that when you're here, it actually wants to command you to go here. And as long as the low-level policy knows how to find the pasta from these states, then that might be more efficient overall. There's also worlds where maybe this would be more efficient because maybe while you're boiling the water, you're just waiting, and you can find the pasta in the meantime.","start":2172.45,"end":2198.75},{"id":117,"text":"And so I guess there's also a pouring water and turning on the stove and so forth, so there's more steps involved. But yeah, the high-level policy can decide which order it wants to take. Okay, so generally the way to address this is that you can first train them potentially completely separately, but it's important for at least one policy to be adapted to.","start":2200.84,"end":2223.08},{"id":118,"text":"the other. And ideally, even both could be jointly adapted with each other to optimize reward or optimize some complete objective. Cool. One other side note, I guess, that I think is worth mentioning is that even for problems that are not traditionally LLM problems, LLM problems are actually often","start":2223.85,"end":2252.29},{"id":119,"text":"And so, for example, if you know that you want to cook pasta, if you ask a language model, what are the steps involved with that? Oftentimes they can actually give you that. And so this is one way where you could actually kind of train the high level policy completely separately from the low level policy and then potentially fine tune them because the language model, for example, might not know that.","start":2253.36,"end":2277.42},{"id":120,"text":"kind of which order the low-level policy is best suited for, or other things about the capabilities of the low-level policy.","start":2278.83,"end":2288.05},{"id":121,"text":"And so that sort of adaptation process, even though language models are pretty good, that sort of adaptation process is really important. Also, if you ask, if a robot is in front of a coffee machine and you ask the robot to get some coffee for you, if the language model doesn't actually pay attention to that image, it might tell the robot, oh, can you go out and buy coffee at Starbucks or something? And the robot might not have that sort of affordance, that sort of ability to do that. And so kind of adapting these two together, that's another example where adapting these two high-level and low-level policies.","start":2288.93,"end":2318.33},{"id":122,"text":"together is quite important. Okay, the last key design choice that we haven't talked about yet is when to move from one task to another. So we outlined this process here and we didn't really spend that much time thinking about like how long do you repeat sampling from your low-level policy to accomplish a goal.","start":2318.38,"end":2343.12}],"notes":["本段讨论了分层强化学习中高层策略和低层策略之间的协作关系，强调了高层策略可以决定任务执行的顺序，而低层策略需要具备完成特定子任务的能力。例如，在煮意大利面的过程中，高层策略可以决定先烧水还是先找意大利面，而低层策略需要知道如何从当前状态找到意大利面。","讲者提到，虽然语言模型在高层次推理方面表现良好，但它们可能不了解低层策略的具体能力，因此需要对高层和低层策略进行联合适应。例如，如果机器人面对咖啡机，语言模型可能建议去星巴克买咖啡，而机器人可能不具备这种能力。","此外，讲者指出，高层策略和低层策略的联合适应非常重要，特别是在涉及具体任务执行时，如机器人需要根据环境信息调整策略。这表明在实际应用中，策略之间的协同和适应是关键。","最后，讲者提到尚未讨论的一个关键设计选择是何时从一个任务切换到另一个任务。这涉及到低层策略重复采样的时间长度，以完成特定目标。这表明在实际系统设计中，任务切换的时机和策略的执行效率是需要考虑的重要因素。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2172.45,"end":2343.12,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2172.45,"text":"where the low-level policy is most successful. And so one of the reasons why I wanted to pick this example is actually these two steps can be done in any order, and the high-level policy could decide that when you're here, it actually wants to command you to go here. And as long as the low-level policy knows how to find the pasta from these states, then that might be more efficient overall. There's also worlds where maybe this would be more efficient because maybe while you're boiling the water, you're just waiting, and you can find the pasta in the meantime."},{"start":2200.84,"text":"And so I guess there's also a pouring water and turning on the stove and so forth, so there's more steps involved. But yeah, the high-level policy can decide which order it wants to take. Okay, so generally the way to address this is that you can first train them potentially completely separately, but it's important for at least one policy to be adapted to."},{"start":2223.85,"text":"the other. And ideally, even both could be jointly adapted with each other to optimize reward or optimize some complete objective. Cool. One other side note, I guess, that I think is worth mentioning is that even for problems that are not traditionally LLM problems, LLM problems are actually often"},{"start":2253.36,"text":"pretty good at some of the higher level reasoning that you might want to do. And so, for example, if you know that you want to cook pasta, if you ask a language model, what are the steps involved with that? Oftentimes they can actually give you that. And so this is one way where you could actually kind of train the high level policy completely separately from the low level policy and then potentially fine tune them because the language model, for example, might not know that."},{"start":2278.83,"text":"kind of which order the low-level policy is best suited for, or other things about the capabilities of the low-level policy."},{"start":2288.93,"text":"And so that sort of adaptation process, even though language models are pretty good, that sort of adaptation process is really important. Also, if you ask, if a robot is in front of a coffee machine and you ask the robot to get some coffee for you, if the language model doesn't actually pay attention to that image, it might tell the robot, oh, can you go out and buy coffee at Starbucks or something? And the robot might not have that sort of affordance, that sort of ability to do that. And so kind of adapting these two together, that's another example where adapting these two high-level and low-level policies."},{"start":2318.38,"text":"together is quite important. Okay, the last key design choice that we haven't talked about yet is when to move from one task to another. So we outlined this process here and we didn't really spend that much time thinking about like how long do you repeat sampling from your low-level policy to accomplish a goal."}],"speech_gaps":[],"frame":"../frames/v025/014.webp","frame_time":2184.45},{"title":"分层强化学习中的目标查询策略","segments":[{"id":123,"text":"And essentially, it's like how often do we re-query a new goal from the high-level policy to pass to the low-level policy? So basically, yeah, this step right here. So there's two natural options for this. The first natural option is...","start":2344.39,"end":2367.15},{"id":124,"text":"to re-query the high-level policy whenever the low-level policy has completed the goal. So when it has boiled the water, that's when you tell it to go find the pasta, for example. And the way that this would look like is, at this point, your low-level policy not only needs to predict action, but it also needs to predict whether or not it successfully completed the task.","start":2367.58,"end":2392.69},{"id":125,"text":"And this could be either with some sort of binary indicator or through some sort of progress indicator. You could think about this done, not done, sort of as a success classifier for the task. And then the other option that's a bit simpler, but maybe less elegant in some ways, is just to simply re-query the high-level policy after some fixed number of time steps.","start":2393.35,"end":2420.6},{"id":126,"text":"You query the low-level policy at 50 hertz, and you query the high-level policy once every second. So then you would be querying the high-level policy after 50 timestamps. So there's pros and cons of each of these two options.","start":2422.7,"end":2440.6},{"id":127,"text":"For the first case where we're doing something after we've completed a goal, this is actually ideal. If you're to do this well, this should be the most compute efficient because you're waiting for the low-level policy and you don't need to rethink how you're doing the task while the low-level policy is executing.","start":2442.6,"end":2459.5},{"id":128,"text":"There's a couple of things that are tricky about this, though. The first is that it can actually be hard to estimate when you're done with a task. It's definitely not trivial to do this. And the second is that you actually need to account for mistakes that require actually redoing some past goal.","start":2462.47,"end":2481.47},{"id":129,"text":"So, for example, if you are trying to, I don't know, organize some things on a table, you go grab something, and then you accidentally drop it on the ground, your subgoal should no longer be, like, put that object on the table, and instead it should be to pick it up off the ground. And this means that actually you need to now estimate not just when you're done, but also whether or not you've actually, like, kind of exited the states in which that subtask makes sense.","start":2482.32,"end":2511.38}],"notes":["本段讨论了在分层强化学习中，如何判断低级策略是否完成任务，从而决定是否重新查询高级策略。讲者提到，可以通过二元指示器或进度指示器来判断任务是否完成，这类似于一个任务成功的分类器。此外，还举了一个例子，说明如果在执行子任务过程中出现错误，例如将物品掉落，那么子目标需要从‘将物品放在桌子上’变为‘捡起物品’，这表明需要判断是否已经退出了子任务适用的状态。","讲者进一步指出，判断任务是否完成并不是一件容易的事情，尤其是在需要重新执行之前的目标时，这会增加系统的复杂性。因此，设计一个可靠的完成判断机制是分层强化学习中的一个关键挑战。","在例子中，讲者通过一个具体的场景说明了子目标的动态调整过程，即当子任务执行失败时，系统需要重新设定子目标。这表明，除了判断任务是否完成外，还需要判断是否已经脱离了子任务适用的状态，从而确保子目标的正确性。","讲者还提到，两种常见的目标查询策略：一种是在低级策略完成任务后重新查询高级策略，另一种是固定时间步长后重新查询。前者更高效，但需要准确判断任务完成；后者更简单，但可能不够灵活。","在讨论完成判断的挑战时，讲者强调了任务完成判断的非平凡性，以及需要处理错误导致的子目标重置问题。这表明，设计一个鲁棒的完成判断机制对于分层强化学习的成功至关重要。","最后，讲者通过一个具体的例子说明了子目标的动态调整过程，这有助于理解分层强化学习中目标查询策略的实际应用和复杂性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2344.39,"end":2511.38,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2344.39,"text":"And essentially, it's like how often do we re-query a new goal from the high-level policy to pass to the low-level policy? So basically, yeah, this step right here. So there's two natural options for this. The first natural option is..."},{"start":2367.58,"text":"to re-query the high-level policy whenever the low-level policy has completed the goal. So when it has boiled the water, that's when you tell it to go find the pasta, for example. And the way that this would look like is, at this point, your low-level policy not only needs to predict action, but it also needs to predict whether or not it successfully completed the task."},{"start":2393.35,"text":"And this could be either with some sort of binary indicator or through some sort of progress indicator. You could think about this done, not done, sort of as a success classifier for the task. And then the other option that's a bit simpler, but maybe less elegant in some ways, is just to simply re-query the high-level policy after some fixed number of time steps."},{"start":2422.7,"text":"You query the low-level policy at 50 hertz, and you query the high-level policy once every second. So then you would be querying the high-level policy after 50 timestamps. So there's pros and cons of each of these two options."},{"start":2442.6,"text":"For the first case where we're doing something after we've completed a goal, this is actually ideal. If you're to do this well, this should be the most compute efficient because you're waiting for the low-level policy and you don't need to rethink how you're doing the task while the low-level policy is executing."},{"start":2462.47,"text":"There's a couple of things that are tricky about this, though. The first is that it can actually be hard to estimate when you're done with a task. It's definitely not trivial to do this. And the second is that you actually need to account for mistakes that require actually redoing some past goal."},{"start":2482.32,"text":"So, for example, if you are trying to, I don't know, organize some things on a table, you go grab something, and then you accidentally drop it on the ground, your subgoal should no longer be, like, put that object on the table, and instead it should be to pick it up off the ground. And this means that actually you need to now estimate not just when you're done, but also whether or not you've actually, like, kind of exited the states in which that subtask makes sense."}],"speech_gaps":[],"frame":"../frames/v025/015.webp","frame_time":2356.39},{"title":"分层强化学习中的时间步长与错误影响","segments":[{"id":130,"text":"Then kind of going back to the fixed number of time steps, this is less ideal because we're going to be probably wasting some compute, and there's going to be a tradeoff between spending more compute thinking through what the next goal should be.","start":2514.92,"end":2529.6},{"id":131,"text":"Versus if this n is too long, then you're going to be delayed in transitioning to the new goal,","start":2531.82,"end":2537.38},{"id":132,"text":"where your agent will be, for example, maybe it's kind of found the pot,","start":2537.5,"end":2542.32},{"id":133,"text":"it's taken out the pot, and it's waiting for a new goal.","start":2542.48,"end":2544.48},{"id":134,"text":"It might just be, if n is too long, it's just going to be sitting there with the pot,","start":2544.62,"end":2547.6},{"id":135,"text":"because it's like, okay, I found the pot, and that's the goal that it's getting.","start":2547.7,"end":2550.52},{"id":136,"text":"And there'll be some delay before it then moves on to actually finding the pasta","start":2551.1,"end":2554.34},{"id":137,"text":"or pouring water into the pot.","start":2554.34,"end":2556.24},{"id":138,"text":"So there's this kind of trade-off between how long n should be.","start":2557.04,"end":2559.96},{"id":139,"text":"Generally, because you don't want these really long delays,","start":2560.92,"end":2563.82},{"id":140,"text":"you'll pick n to be fairly small or fairly frequent.","start":2564.08,"end":2567.16},{"id":141,"text":"But when it is smaller,","start":2569.34,"end":2571.42},{"id":142,"text":"you're then going to be placing more burden","start":2571.7,"end":2573.28},{"id":143,"text":"on your high-level policy","start":2573.28,"end":2574.22},{"id":144,"text":"because it needs to be making accurate goal predictions","start":2574.78,"end":2577.8},{"id":145,"text":"more frequently on more states.","start":2578.48,"end":2580.84},{"id":146,"text":"And you'll be spending more compute as well.","start":2581.9,"end":2583.88},{"id":147,"text":"So both of these have pros and cons.","start":2586.14,"end":2587.96},{"id":148,"text":"So in general, if we wanted to think about how these pros and cons relate to each other,","start":2590.04,"end":2598.74},{"id":149,"text":"we can think about how these pros and cons lead to different downstream performance.","start":2598.9,"end":2602.82},{"id":150,"text":"And with regard to estimating when you're done and accounting for mistakes,","start":2605.24,"end":2609.22},{"id":151,"text":"if you actually make a mistake in estimating when you're done,","start":2609.46,"end":2612.32},{"id":152,"text":"then you could actually end up in a situation where the agent is perpetually stuck.","start":2613.4,"end":2617.36},{"id":153,"text":"If it thinks that it's if it thinks that it's not done, but it is actually done, then it will actually just stay in that state because the low level policy will kind of keep on predicting this, like won't actually be making any more further progress on the task.","start":2617.36,"end":2630.96},{"id":154,"text":"So this actually is a pretty kind of rough outcome for these kinds of errors, even if they're infrequent.","start":2632.26,"end":2639.24},{"id":155,"text":"And then for option two.","start":2641.16,"end":2642.32},{"id":156,"text":"If you make a mistake in predicting the subtask because you're querying the high-level policy more frequently, this also has a bad outcome, which is that the low-level policy might kind of stop making progress on the final task and might be taking the wrong actions for end steps until you get, hopefully, a more accurate goal prediction. And generally, between these two things, these errors are more fatal.","start":2642.89,"end":2666.26},{"id":157,"text":"And as a result, typically a lot of the hierarchical systems out there opt for choosing option two because of the simplicity and because some of the mistakes that the high-level policy might make when it's queried more frequently are less fatal than mistakes with regard to estimating when you're done and whether or not you should kind of re-account.","start":2668.01,"end":2689.31}],"notes":["本段讨论了分层强化学习中时间步长n的选择对系统性能的影响。当n太长时，代理可能会在完成当前任务后长时间等待新目标，导致延迟。而当n太短时，高层策略需要更频繁地做出准确的目标预测，这会增加计算负担。"],"formulas":[],"uncertainties":["if it thinks that it's if it thinks that it's not done"],"diagram":"none","start":2514.92,"end":2689.31,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2514.92,"text":"Then kind of going back to the fixed number of time steps, this is less ideal because we're going to be probably wasting some compute, and there's going to be a tradeoff between spending more compute thinking through what the next goal should be."},{"start":2531.82,"text":"Versus if this n is too long, then you're going to be delayed in transitioning to the new goal,"},{"start":2537.5,"text":"where your agent will be, for example, maybe it's kind of found the pot,"},{"start":2542.48,"text":"it's taken out the pot, and it's waiting for a new goal."},{"start":2544.62,"text":"It might just be, if n is too long, it's just going to be sitting there with the pot,"},{"start":2547.7,"text":"because it's like, okay, I found the pot, and that's the goal that it's getting."},{"start":2551.1,"text":"And there'll be some delay before it then moves on to actually finding the pasta"},{"start":2554.34,"text":"or pouring water into the pot."},{"start":2557.04,"text":"So there's this kind of trade-off between how long n should be."},{"start":2560.92,"text":"Generally, because you don't want these really long delays,"},{"start":2564.08,"text":"you'll pick n to be fairly small or fairly frequent."},{"start":2569.34,"text":"But when it is smaller,"},{"start":2571.7,"text":"you're then going to be placing more burden"},{"start":2573.28,"text":"on your high-level policy"},{"start":2574.78,"text":"because it needs to be making accurate goal predictions"},{"start":2578.48,"text":"more frequently on more states."},{"start":2581.9,"text":"And you'll be spending more compute as well."},{"start":2586.14,"text":"So both of these have pros and cons."},{"start":2590.04,"text":"So in general, if we wanted to think about how these pros and cons relate to each other,"},{"start":2598.9,"text":"we can think about how these pros and cons lead to different downstream performance."},{"start":2605.24,"text":"And with regard to estimating when you're done and accounting for mistakes,"},{"start":2609.46,"text":"if you actually make a mistake in estimating when you're done,"},{"start":2613.4,"text":"then you could actually end up in a situation where the agent is perpetually stuck."},{"start":2617.36,"text":"If it thinks that it's if it thinks that it's not done, but it is actually done, then it will actually just stay in that state because the low level policy will kind of keep on predicting this, like won't actually be making any more further progress on the task."},{"start":2632.26,"text":"So this actually is a pretty kind of rough outcome for these kinds of errors, even if they're infrequent."},{"start":2641.16,"text":"And then for option two."},{"start":2642.89,"text":"If you make a mistake in predicting the subtask because you're querying the high-level policy more frequently, this also has a bad outcome, which is that the low-level policy might kind of stop making progress on the final task and might be taking the wrong actions for end steps until you get, hopefully, a more accurate goal prediction. And generally, between these two things, these errors are more fatal."},{"start":2668.01,"text":"And as a result, typically a lot of the hierarchical systems out there opt for choosing option two because of the simplicity and because some of the mistakes that the high-level policy might make when it's queried more frequently are less fatal than mistakes with regard to estimating when you're done and whether or not you should kind of re-account."}],"speech_gaps":[],"frame":"../frames/v025/016.webp","frame_time":2526.92},{"title":"分层强化学习与模仿学习中的系统设计","segments":[{"id":158,"text":"for past goals. It's also worth mentioning that you could potentially combine these where you try to estimate progress, but then if it's been a long period of time, then you re-query anyway. But yeah, the takeaway is that generally option two is typically what people do where you just query at a fixed lower frequency.","start":2689.66,"end":2705.82},{"id":159,"text":"Cool. So let's look at some example systems. And I guess one thing that I'll mention is that hierarchy is pretty popular these days. So here are four systems that were all...","start":2707.57,"end":2721.89},{"id":160,"text":"kind of announced in the last like five months, four months. And they actually all use hierarchical systems. So these are all like fairly long horizon tasks where you're like cleaning a bedroom, putting like handing over objects and kind of pouring them or putting them into bins, putting away objects into a fridge, putting fruit into bowls.","start":2722.95,"end":2741.75},{"id":161,"text":"If you look at the architectures for these things, they all have some higher-level model that's predicting intermediate goals and some lower-level model that is predicting low-level actions.","start":2742.99,"end":2756.17},{"id":162,"text":"These are in robotics domains, likewise in language model domains, things like chain of thought, where you're kind of reasoning through intermediate steps, and then actually outputting tokens for those steps is also really popular for completing more challenging language tasks.","start":2757.33,"end":2772.99},{"id":163,"text":"Cool. So I want to cover a few examples of these systems. And I picked examples that I think","start":2776.49,"end":2783.49},{"id":164,"text":"illustrate a few different design choices that are helpful and actually have comparisons on those","start":2783.49,"end":2788.21},{"id":165,"text":"design choices that kind of elucidate some of the benefits of one design choice versus another.","start":2788.21,"end":2793.11},{"id":166,"text":"So let's start with talking about hierarchical imitation learning systems.","start":2794.85,"end":2797.65},{"id":167,"text":"systems. And we'll start with language subgoals. And let's first talk about what the data would","start":2797.65,"end":2807.17},{"id":168,"text":"look like for training a hierarchical imitation learning system with language subgoals.","start":2807.17,"end":2810.37},{"id":169,"text":"So the data, this will be kind of a real robot example. And what the data looks like is actually","start":2812.23,"end":2819.67},{"id":170,"text":"it's going to use data of a long horizon demonstration of completing the complete","start":2819.67,"end":2824.61},{"id":171,"text":"long horizon task. And so this case, the task is to make trail mix and put the trail mix into a bag.","start":2824.61,"end":2830.81},{"id":172,"text":"And with this long horizon demonstration for the full task, it will then be segmented into","start":2832.57,"end":2838.55},{"id":173,"text":"with language labels for each segment. And in this case, the segments in the data can have a","start":2839.45,"end":2846.93},{"id":174,"text":"variable length so variable like you might kind of if for example the kind of","start":2846.93,"end":2855.59}],"notes":["本段讨论了分层模仿学习系统中语言子目标的数据形式。讲者提到，数据是长时域任务的演示，例如制作混合坚果并放入袋中。数据被分割成带有语言标签的片段，每个片段的长度可以变化。这表明系统需要处理不同长度的子任务，并通过语言标签进行指导。","讲者进一步说明，这些系统在机器人领域和语言模型领域都有应用。例如，在语言模型中，链式推理（chain of thought）通过中间步骤进行推理，然后输出对应的标记，这在完成复杂语言任务时非常流行。","讲者提到，他选择了一些系统作为例子，这些例子展示了不同的设计选择，并且这些设计选择之间有比较。这表明在分层系统设计中，不同的选择会影响系统的性能和适用性。","讲者开始讨论分层模仿学习系统，并以语言子目标为例。他提到，训练数据需要包含长时域任务的演示，并且这些演示被分割成带有语言标签的片段。这表明系统需要能够处理不同长度的子任务，并通过语言标签进行指导。","讲者提到，这些系统在机器人领域和语言模型领域都有应用。例如，在语言模型中，链式推理（chain of thought）通过中间步骤进行推理，然后输出对应的标记，这在完成复杂语言任务时非常流行。","讲者提到，他选择了一些系统作为例子，这些例子展示了不同的设计选择，并且这些设计选择之间有比较。这表明在分层系统设计中，不同的选择会影响系统的性能和适用性。"],"formulas":[],"uncertainties":["variable length so variable like you might kind of if for example the kind of"],"diagram":"none","start":2689.66,"end":2855.59,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2689.66,"text":"for past goals. It's also worth mentioning that you could potentially combine these where you try to estimate progress, but then if it's been a long period of time, then you re-query anyway. But yeah, the takeaway is that generally option two is typically what people do where you just query at a fixed lower frequency."},{"start":2707.57,"text":"Cool. So let's look at some example systems. And I guess one thing that I'll mention is that hierarchy is pretty popular these days. So here are four systems that were all..."},{"start":2722.95,"text":"kind of announced in the last like five months, four months. And they actually all use hierarchical systems. So these are all like fairly long horizon tasks where you're like cleaning a bedroom, putting like handing over objects and kind of pouring them or putting them into bins, putting away objects into a fridge, putting fruit into bowls."},{"start":2742.99,"text":"If you look at the architectures for these things, they all have some higher-level model that's predicting intermediate goals and some lower-level model that is predicting low-level actions."},{"start":2757.33,"text":"These are in robotics domains, likewise in language model domains, things like chain of thought, where you're kind of reasoning through intermediate steps, and then actually outputting tokens for those steps is also really popular for completing more challenging language tasks."},{"start":2776.49,"text":"Cool. So I want to cover a few examples of these systems. And I picked examples that I think"},{"start":2783.49,"text":"illustrate a few different design choices that are helpful and actually have comparisons on those"},{"start":2788.21,"text":"design choices that kind of elucidate some of the benefits of one design choice versus another."},{"start":2794.85,"text":"So let's start with talking about hierarchical imitation learning systems."},{"start":2797.65,"text":"systems. And we'll start with language subgoals. And let's first talk about what the data would"},{"start":2807.17,"text":"look like for training a hierarchical imitation learning system with language subgoals."},{"start":2812.23,"text":"So the data, this will be kind of a real robot example. And what the data looks like is actually"},{"start":2819.67,"text":"it's going to use data of a long horizon demonstration of completing the complete"},{"start":2824.61,"text":"long horizon task. And so this case, the task is to make trail mix and put the trail mix into a bag."},{"start":2832.57,"text":"And with this long horizon demonstration for the full task, it will then be segmented into"},{"start":2839.45,"text":"with language labels for each segment. And in this case, the segments in the data can have a"},{"start":2846.93,"text":"variable length so variable like you might kind of if for example the kind of"}],"speech_gaps":[],"frame":"../frames/v025/017.webp","frame_time":2701.66},{"title":"分层强化学习与模仿学习中的数据标注与策略结构","segments":[{"id":175,"text":"the robot trajectory looks something like this, then you might have the first subtask is something like this. The second subtask is maybe shorter. The third subtask is maybe longer. So you'll have variable frequency in the data, but the actual system will later be using a fixed frequency where it's kind of re-querying more frequently than the typical segment length in the data. So these are different language labels. These labels can either be","start":2856.3,"end":2886.28},{"id":176,"text":"kind of recorded during data collection, where you're actually saying, I'm going to pick up the bag and then do a demonstration of picking up the bag, then say I'm going to pick up the middle scoop, do a demonstration of that in sequence. Or you can do it post-hoc, where you just collect the full demonstration, and then with a labeling interface, label like this segment is picking up the bag, this segment is picking up the middle scoop, this segment is getting M&Ms, and so forth.","start":2887.89,"end":2911.31},{"id":177,"text":"So we have segmented demonstrations with the associated language command. Here's another example of what this would look like where, and this kind of shows that like one segment might be longer for picking up a slice of cheese. A different segment might be shorter for putting the cheese on the bread and so forth. Cool. And then once we have this data, we'll train a high-level policy and a low-level policy with imitation learning. And the high-level policy will be outputting the language labels from the observations.","start":2913.5,"end":2943.71},{"id":178,"text":"And the low-level will be taking the language labels and the observations and predicting the actions. So what this looks like is taking an image observation, so an RGB image, passes into a high-level policy that's trained to predict the language label. And then you'll have a low-level policy that takes the language in addition to the observations. In this case...","start":2944.51,"end":2970.76},{"id":179,"text":"The work chooses to use not just RGB images, but also joint angles as input to the low-level policy. And generally, it's okay to have actually this sort of mismatch between observations for the high-level and the low-level policy. And then the low-level policy outputs joint commands. And the low-level policy operates at 50 hertz. And I can't remember the exact frequency of the high-level policy, but I think it's something around 1 hertz. Cool.","start":2972.1,"end":3003.31},{"id":180,"text":"So that's the general setup. Now, we also learned about Dagger. And you can think about if we just do imitation learning on the offline data, we might have issues where we're training these somewhat independently, although the data is at least of the full long horizon task. And we can actually use Dagger with these systems on both the low-level policy and the high-level policy.","start":3004.75,"end":3032.2}],"notes":["本段讲解了分层强化学习中如何对机器人轨迹进行子任务划分，并通过语言标签进行标注。数据中子任务的频率可能不同，但系统在运行时会使用固定频率进行查询，该频率高于数据中的典型段长度。语言标签可以是在数据收集过程中记录，也可以在事后通过标注界面进行标注。","在分层强化学习中，高阶策略负责输出语言标签，低阶策略则根据语言标签和观测预测动作。高阶策略通常使用图像观测（如RGB图像）来预测语言标签，而低阶策略则结合语言标签和观测进行动作预测。","低阶策略的输入不仅包括图像，还包括关节角度，这可能导致高阶和低阶策略之间的观测不匹配。低阶策略以50赫兹的频率运行，而高阶策略的频率大约为1赫兹。","在模仿学习中，Dagger算法可以用于训练高阶和低阶策略。如果仅使用离线数据进行模仿学习，可能会出现策略训练独立的问题，但Dagger可以缓解这一问题，特别是在处理长时序任务时。","分层强化学习的结构包括高阶策略和低阶策略的协同工作，其中高阶策略负责任务分解和语言标签生成，低阶策略负责具体动作的执行。这种结构有助于提高复杂任务的可学习性和效率。","在实际应用中，分层强化学习需要考虑数据标注的准确性以及策略之间的协调性。语言标签的生成方式（如实时标注或事后标注）会影响系统的训练效果和最终性能。"],"formulas":[],"uncertainties":[],"diagram":"none","start":2856.3,"end":3032.2,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":2856.3,"text":"the robot trajectory looks something like this, then you might have the first subtask is something like this. The second subtask is maybe shorter. The third subtask is maybe longer. So you'll have variable frequency in the data, but the actual system will later be using a fixed frequency where it's kind of re-querying more frequently than the typical segment length in the data. So these are different language labels. These labels can either be"},{"start":2887.89,"text":"kind of recorded during data collection, where you're actually saying, I'm going to pick up the bag and then do a demonstration of picking up the bag, then say I'm going to pick up the middle scoop, do a demonstration of that in sequence. Or you can do it post-hoc, where you just collect the full demonstration, and then with a labeling interface, label like this segment is picking up the bag, this segment is picking up the middle scoop, this segment is getting M&Ms, and so forth."},{"start":2913.5,"text":"So we have segmented demonstrations with the associated language command. Here's another example of what this would look like where, and this kind of shows that like one segment might be longer for picking up a slice of cheese. A different segment might be shorter for putting the cheese on the bread and so forth. Cool. And then once we have this data, we'll train a high-level policy and a low-level policy with imitation learning. And the high-level policy will be outputting the language labels from the observations."},{"start":2944.51,"text":"And the low-level will be taking the language labels and the observations and predicting the actions. So what this looks like is taking an image observation, so an RGB image, passes into a high-level policy that's trained to predict the language label. And then you'll have a low-level policy that takes the language in addition to the observations. In this case..."},{"start":2972.1,"text":"The work chooses to use not just RGB images, but also joint angles as input to the low-level policy. And generally, it's okay to have actually this sort of mismatch between observations for the high-level and the low-level policy. And then the low-level policy outputs joint commands. And the low-level policy operates at 50 hertz. And I can't remember the exact frequency of the high-level policy, but I think it's something around 1 hertz. Cool."},{"start":3004.75,"text":"So that's the general setup. Now, we also learned about Dagger. And you can think about if we just do imitation learning on the offline data, we might have issues where we're training these somewhat independently, although the data is at least of the full long horizon task. And we can actually use Dagger with these systems on both the low-level policy and the high-level policy."}],"speech_gaps":[],"frame":"../frames/v025/018.webp","frame_time":2868.3},{"title":"分层强化学习与模仿学习中的语言监督","segments":[{"id":181,"text":"Now, one thing that's pretty cool is that actually for the high-level policy, we can actually update the high-level policy with language supervision. And so Dagger on the high-level policy is actually in language space, not in joint space. And so...","start":3033.53,"end":3049.35},{"id":182,"text":"In this particular approach, in principle, you can do Dagger on both low level and high level. In this particular approach, if you were to do it on the high level with freezing the low level, you would kind of be running the policy, the full system, and then you would then kind of type or speak a language command that is going to override the high-level policy. And then...","start":3051.14,"end":3075.12},{"id":183,"text":"then continue collecting data and at some point you might give control back to the high-level policy. Then from there, you can fine-tune and actually do gradient steps on data that has these kinds of language interventions to actually fine-tune the high-level policy. When you do this together with the high-level policy and the low-level policy acting as one system, then you can actually adapt the high-level policy to deficiencies in the low-level policy.","start":3075.82,"end":3104.36},{"id":184,"text":"So, for example, if there's one language command that the low-level policy makes a mistake on, then you could actually issue some corrections to help compensate for that mistake.","start":3105.0,"end":3116.6},{"id":185,"text":"So, yeah, I guess to summarize, we can train the high-level policy and the low-level policy both with imitation and then freeze the low-level policy and update the high-level policy with Dagger by supervising on language corrections.","start":3119.02,"end":3132.06},{"id":186,"text":"And so as a video of what this looks like, these yellow commands are showing the output of the high-level policy.","start":3135.0,"end":3141.9},{"id":187,"text":"And then the robot motions are showing the output of the low-level policy.","start":3142.74,"end":3145.98},{"id":188,"text":"And so at the beginning, the high-level policy is saying pick up spoon.","start":3148.3,"end":3153.8},{"id":189,"text":"The robot picks up the spoon.","start":3153.94,"end":3154.84},{"id":190,"text":"Move the spoon towards me.","start":3155.36,"end":3156.56},{"id":191,"text":"So then it says I want some peanuts.","start":3156.68,"end":3157.84},{"id":192,"text":"So then the low-level policy scoops peanuts.","start":3157.98,"end":3159.64},{"id":193,"text":"Then the high-level policy says move the scoop into the bag.","start":3159.92,"end":3162.04},{"id":194,"text":"The low-level policy starts to do that.","start":3162.2,"end":3163.82},{"id":195,"text":"At this point, you'll actually notice that the robot's about to make a mistake.","start":3163.82,"end":3167.0},{"id":196,"text":"And so that's when you can intervene.","start":3167.36,"end":3168.78},{"id":197,"text":"And instead of telling the robot, move the scoop in the bag,","start":3170.02,"end":3172.74},{"id":198,"text":"because it seems like the low-level policy isn't going to do that correctly,","start":3172.94,"end":3175.6},{"id":199,"text":"you could then intervene and say, move the scoop into the bag.","start":3176.42,"end":3182.6},{"id":200,"text":"Sorry, instead of saying move the scoop into the bag, you say move the left arm to the left,","start":3182.74,"end":3185.78},{"id":201,"text":"go higher, move the scoop into the bag then.","start":3186.78,"end":3190.42},{"id":202,"text":"then. And so these user commands are overriding the high-level policy. And then at this point,","start":3190.42,"end":3195.94},{"id":203,"text":"you can give control back to the high-level policy, and the high-level policy predicts","start":3195.98,"end":3200.98},{"id":204,"text":"pour into the bag and get some banana chips and so forth. So that's kind of what this sort of","start":3200.98,"end":3210.98}],"notes":["本段讲解了在分层强化学习中如何利用语言监督来更新高层策略。Dagger算法可以应用于高层和低层策略，但通常在高层策略中使用语言监督，而不是联合空间。当高层策略执行时，如果发现低层策略有错误，可以通过语言干预来纠正，然后将控制权交还给高层策略，从而优化高层策略。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3033.53,"end":3210.98,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3033.53,"text":"Now, one thing that's pretty cool is that actually for the high-level policy, we can actually update the high-level policy with language supervision. And so Dagger on the high-level policy is actually in language space, not in joint space. And so..."},{"start":3051.14,"text":"In this particular approach, in principle, you can do Dagger on both low level and high level. In this particular approach, if you were to do it on the high level with freezing the low level, you would kind of be running the policy, the full system, and then you would then kind of type or speak a language command that is going to override the high level policy. And then..."},{"start":3075.82,"text":"then continue collecting data and at some point you might give control back to the high-level policy. Then from there, you can fine-tune and actually do gradient steps on data that has these kinds of language interventions to actually fine-tune the high-level policy. When you do this together with the high-level policy and the low-level policy acting as one system, then you can actually adapt the high-level policy to deficiencies in the low-level policy."},{"start":3105.0,"text":"So, for example, if there's one language command that the low-level policy makes a mistake on, then you could actually issue some corrections to help compensate for that mistake."},{"start":3119.02,"text":"So, yeah, I guess to summarize, we can train the high-level policy and the low-level policy both with imitation and then freeze the low-level policy and update the high-level policy with Dagger by supervising on language corrections."},{"start":3135.0,"text":"And so as a video of what this looks like, these yellow commands are showing the output of the high-level policy."},{"start":3142.74,"text":"And then the robot motions are showing the output of the low-level policy."},{"start":3148.3,"text":"And so at the beginning, the high-level policy is saying pick up spoon."},{"start":3153.94,"text":"The robot picks up the spoon."},{"start":3155.36,"text":"Move the spoon towards me."},{"start":3156.68,"text":"So then it says I want some peanuts."},{"start":3157.98,"text":"So then the low-level policy scoops peanuts."},{"start":3159.92,"text":"Then the high-level policy says move the scoop into the bag."},{"start":3162.2,"text":"The low-level policy starts to do that."},{"start":3163.82,"text":"At this point, you'll actually notice that the robot's about to make a mistake."},{"start":3167.36,"text":"And so that's when you can intervene."},{"start":3170.02,"text":"And instead of telling the robot, move the scoop in the bag,"},{"start":3172.94,"text":"because it seems like the low-level policy isn't going to do that correctly,"},{"start":3176.42,"text":"you could then intervene and say, move the scoop into the bag."},{"start":3182.74,"text":"Sorry, instead of saying move the scoop into the bag, you say move the left arm to the left,"},{"start":3186.78,"text":"go higher, move the scoop into the bag then."},{"start":3190.42,"text":"then. And so these user commands are overriding the high-level policy. And then at this point,"},{"start":3195.98,"text":"you can give control back to the high-level policy, and the high-level policy predicts"},{"start":3200.98,"text":"pour into the bag and get some banana chips and so forth. So that's kind of what this sort of"}],"speech_gaps":[],"frame":"../frames/v025/019.webp","frame_time":3045.53},{"title":"分层强化学习与模仿学习中的自适应策略","segments":[{"id":205,"text":"dagger intervention looks like in the high-level space. And then after you fine-tune the high-level","start":3210.98,"end":3216.1},{"id":206,"text":"and know that the low-level policy is making a mistake","start":3216.1,"end":3220.2},{"id":207,"text":"where it was about to make kind of the same sort of mistake again.","start":3220.2,"end":3222.62},{"id":208,"text":"And then the high-level policy says go higher","start":3222.62,"end":3225.64},{"id":209,"text":"and then move the scoop into the bag","start":3225.94,"end":3228.32},{"id":210,"text":"to kind of prevent that sort of mistake.","start":3228.98,"end":3230.62},{"id":211,"text":"And so this is an example of like the high-level","start":3230.62,"end":3233.46},{"id":212,"text":"and low-level policy adapting together","start":3233.62,"end":3235.0},{"id":213,"text":"to account for deficiencies.","start":3235.0,"end":3236.78},{"id":214,"text":"Cool.","start":3238.06,"end":3240.36},{"id":215,"text":"Now we've talked about hierarchy versus flat policies.","start":3241.96,"end":3242.32},{"id":216,"text":"You could ask, like you could actually do a comparison.","start":3243.66,"end":3245.76},{"id":217,"text":"You could ask, like you could actually do a comparison.","start":3246.12,"end":3247.94},{"id":218,"text":"Like in this particular setup, does hierarchy compare, like outperform using a single flat policy to do the long horizon task?","start":3247.94,"end":3255.8},{"id":219,"text":"And you can also actually compare Dagger to imitation learning for the high-level policy. And you can also see that there's an improvement from using Dagger compared to just using vanilla imitation learning. And this is the sort of improvement that you get from adapting the policies together. Cool. And then generally with hierarchy, the nice thing about hierarchy is you can do longer horizon tasks. And so with this full system, you can, for example...","start":3258.26,"end":3279.88},{"id":220,"text":"get the robot to put three objects into a Ziploc bag, which is traditionally a pretty difficult task to do, especially in one go. And likewise, with a similar system, you can also get a robot to... The high-level command is clean the bedroom, and then the low-level policy will output things like pick up shirt, put shirt in basket, pick up shirt, put shirt in basket.","start":3281.69,"end":3309.25},{"id":221,"text":"And later, pick up the pillow, adjust the blanket, put the pillow at the top of the bed, adjust the pillow, pick up tissue, put the tissue in the trash can, and so forth. And so these are things that would be very hard to do if you just trained a single flat policy. So instead of using language, we could also use images as an intermediate representation. And so what this would look like is instead of having the high-level policy output language, you would output a goal image.","start":3310.56,"end":3332.74},{"id":222,"text":"So it'd be like this is the kind of an image of what I want you to accomplish in the future. In practice, you can use a generative model like an image editing model to do this that takes as input the image of the current step and then edits that to look like an image at a future time step that you want the robot to achieve.","start":3334.52,"end":3363.12},{"id":223,"text":"So it'd be like this is the kind of an image of what I want you to accomplish in the future. In practice, you can use a generative model like an image editing model to do this that takes as input the image of the current step and then edits that to look like an image at a future time step that you want the robot to achieve.","start":3363.97,"end":3379.63}],"notes":["本段讲解了分层强化学习中高阶策略和低阶策略如何通过Dagger算法进行自适应调整，以纠正低阶策略的错误。高阶策略通过干预和微调，能够识别低阶策略即将重复的错误，并采取措施防止错误再次发生。这种自适应机制是分层策略的一个关键优势。","讲者提到，分层策略在任务进度和指令遵循方面相比单一的平坦策略有显著提升，例如在任务进度上提升了34%。这表明分层策略在处理长时域任务时具有更好的表现。","Dagger算法与模仿学习的比较显示，使用Dagger可以提升高阶策略的性能。这种提升来自于策略之间的协同适应，即高阶策略和低阶策略共同优化，以提高整体任务完成的准确性。","分层策略的一个重要优势是能够处理更长的时域任务。例如，机器人可以完成将三个物体放入Ziploc袋的任务，这在单一策略下是难以实现的。此外，分层策略还可以用于更复杂的任务，如清洁卧室，其中低阶策略会执行具体的动作，如捡起衣物、放入篮子等。","讲者还提到，除了使用语言作为中间表示，还可以使用图像作为中间表示。高阶策略可以输出目标图像，而低阶策略则根据该图像执行具体动作。这种图像表示可以通过生成模型（如图像编辑模型）实现，输入当前图像并编辑为未来目标图像。","这些例子说明了分层强化学习和模仿学习在实际应用中的潜力，特别是在复杂任务和长时域任务中的优势。通过高阶策略和低阶策略的协同工作，可以显著提高任务完成的效率和准确性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3210.98,"end":3379.63,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3210.98,"text":"dagger intervention looks like in the high-level space. And then after you fine-tune the high-level"},{"start":3216.1,"text":"policy on those kinds of interventions, the high-level policy can then self-correct"},{"start":3220.2,"text":"and know that the low-level policy is making a mistake"},{"start":3222.62,"text":"where it was about to make kind of the same sort of mistake again."},{"start":3225.94,"text":"And then the high-level policy says go higher"},{"start":3228.98,"text":"and then move the scoop into the bag"},{"start":3230.62,"text":"to kind of prevent that sort of mistake."},{"start":3233.62,"text":"And so this is an example of like the high-level"},{"start":3235.0,"text":"and low-level policy adapting together"},{"start":3238.06,"text":"to account for deficiencies."},{"start":3241.96,"text":"Cool."},{"start":3243.66,"text":"Now we've talked about hierarchy versus flat policies."},{"start":3246.12,"text":"You could ask, like you could actually do a comparison."},{"start":3247.94,"text":"Like in this particular setup, does hierarchy compare, like outperform using a single flat policy to do the long horizon task?"},{"start":3258.26,"text":"This comparison is actually from a different research paper, but it has basically the same approach. And it finds that in terms of task progress, there's a 34% improvement from using hierarchy versus training a single policy to do the full long horizon imitation learning task. And in terms of following instructions, there's also a gap. This is kind of this instruction accuracy metric."},{"start":3281.69,"text":"And you can also actually compare Dagger to imitation learning for the high-level policy. And you can also see that there's an improvement from using Dagger compared to just using vanilla imitation learning. And this is the sort of improvement that you get from adapting the policies together. Cool. And then generally with hierarchy, the nice thing about hierarchy is you can do longer horizon tasks. And so with this full system, you can, for example..."},{"start":3310.56,"text":"get the robot to put three objects into a Ziploc bag, which is traditionally a pretty difficult task to do, especially in one go. And likewise, with a similar system, you can also get a robot to... The high-level command is clean the bedroom, and then the low-level policy will output things like pick up shirt, put shirt in basket, pick up shirt, put shirt in basket."},{"start":3334.52,"text":"And later, pick up the pillow, adjust the blanket, put the pillow at the top of the bed, adjust the pillow, pick up tissue, put the tissue in the trash can, and so forth. And so these are things that would be very hard to do if you just trained a single flat policy. So instead of using language, we could also use images as an intermediate representation. And so what this would look like is instead of having the high-level policy output language, you would output a goal image."},{"start":3363.97,"text":"So it'd be like this is the kind of an image of what I want you to accomplish in the future. In practice, you can use a generative model like an image editing model to do this that takes as input the image of the current step and then edits that to look like an image at a future time step that you want the robot to achieve."}],"speech_gaps":[{"start":3256.2,"end":3257.86}],"frame":"../frames/v025/020.webp","frame_time":3222.98},{"title":"分层强化学习与模仿学习中的图像条件策略","segments":[{"id":224,"text":"And then the low-level policy would no longer be language conditioned, but would rather be a goal image conditioned policy. And so you can think of this as a kind of like an inverse, like a multi-step inverse model that takes as input the current image, some future image, and then outputs the actions that you can take to get to that goal image. And then both of these will be trained again with imitation learning.","start":3381.92,"end":3404.48},{"id":225,"text":"And one of the things that's pretty nice is that you no longer need to segment videos with language annotations to do this. You just need the videos of the long horizon task. And to train this high-level policy, you can train it on robot data and predict future images in the trajectory, like from one second or five seconds into the future or 10 seconds in the future. But you can also actually train this high-level policy using YouTube videos or something like that.","start":3405.73,"end":3433.51},{"id":226,"text":"to predict what are future images that might accomplish some long-term goal. And so that sort of unlabeled video data can be helpful, especially if data from the robot is more sparse. So then an example of what this looks like is, say the task is to move the wooden bowl to the top of the table. You pass that into the high-level policy that then generates images, which are shown with the pink border.","start":3433.9,"end":3463.26},{"id":227,"text":"And then that generated subgoal image with the pink border is passed as input to the low-level policy, which then predicts actions. And both of these policies, again, are trained with imitation learning on demonstration data and potentially also if the high-level policy can be trained.","start":3463.96,"end":3480.62},{"id":228,"text":"on video data as well. So this one is putting the toothpaste in the wooden bowl. You can see that it generates these subgoal images of like, for example, holding the toothpaste above the bowl. It then reaches that. Then it generates a subgoal of like lowering the arm. And so the robot lowers the arm to complete the task.","start":3481.12,"end":3498.52},{"id":229,"text":"And then this last example, the goal is to open the drawer. The first subgoal is to put the gripper on the handle. Then the next subgoal is to move the gripper to the right so that it opens, and so forth. Another thing that's nice about this sort of approach is that if your policy sees objects that it's never seen before that are hard to describe in language, then you...","start":3500.53,"end":3525.39},{"id":230,"text":"That's something that it can more easily describe in images","start":3526.53,"end":3529.45},{"id":231,"text":"because it can more easily generalize across the objects that it's seeing","start":3529.45,"end":3533.65},{"id":232,"text":"and generate pixels for those images","start":3533.65,"end":3535.15},{"id":233,"text":"if it doesn't know what the semantic name for that object is.","start":3535.15,"end":3538.15},{"id":234,"text":"Cool.","start":3539.51,"end":3539.99},{"id":235,"text":"And then for this sort of thing, you can also do a comparison on, like,","start":3540.93,"end":3544.39},{"id":236,"text":"is it helpful to include those unlabeled videos","start":3544.93,"end":3547.57},{"id":237,"text":"for training the high-level policy?","start":3547.57,"end":3549.39},{"id":238,"text":"And if you only use robot data, you get performance that looks like this.","start":3550.39,"end":3553.93}],"notes":["本段讲解了分层强化学习中图像条件策略的构建方式，其中低层策略不再依赖语言条件，而是基于目标图像条件。这种策略可以视为一种多步逆模型，输入当前图像和未来图像，输出实现目标的行动。这种策略通过模仿学习进行训练，不需要语言标注的视频数据，只需长期任务的视频数据。","高阶策略可以使用机器人数据或YouTube视频等未标注数据进行训练，以预测未来图像。这种策略在处理稀疏机器人数据时特别有用。例如，任务是将木碗移动到桌子顶部，高阶策略生成目标图像，低阶策略根据这些图像生成动作。","这种分层策略的一个优势是，当策略遇到无法用语言描述的新物体时，可以通过图像更方便地进行描述和泛化。例如，如果不知道物体的语义名称，策略可以生成该物体的像素图像。","此外，还可以通过比较实验来评估未标注视频数据对高阶策略训练的帮助。如果仅使用机器人数据，性能表现如图所示。","课堂中提到的分层策略结合了高阶和低阶策略，其中高阶策略生成子目标图像，低阶策略根据这些图像生成具体动作。这种策略在处理复杂任务时具有良好的扩展性。","课堂中还提到，这种策略可以处理未标注的视频数据，这在机器人数据稀疏时尤为重要。同时，图像条件策略能够更灵活地处理新物体，避免语言描述的局限性。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3381.92,"end":3553.93,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3381.92,"text":"And then the low-level policy would no longer be language conditioned, but would rather be a goal image condition policy. And so you can think of this as a kind of like an inverse, like a multi-step inverse model that takes as input the current image, some future image, and then outputs the actions that you can take to get to that goal image. And then both of these will be trained again with imitation learning."},{"start":3405.73,"text":"And one of the things that's pretty nice is that you no longer need to segment videos with language annotations to do this. You just need the videos of the long horizon task. And to train this high-level policy, you can train it on robot data and predict future images in the trajectory, like from one second or five seconds into the future or 10 seconds in the future. But you can also actually train this high-level policy using YouTube videos or something like that."},{"start":3433.9,"text":"to predict what are future images that might accomplish some long-term goal. And so that sort of unlabeled video data can be helpful, especially if data from the robot is more sparse. So then an example of what this looks like is, say the task is to move the wooden bowl to the top of the table. You pass that into the high-level policy that then generates images, which are shown with the pink border."},{"start":3463.96,"text":"And then that generated subgoal image with the pink border is passed as input to the low-level policy, which then predicts actions. And both of these policies, again, are trained with imitation learning on demonstration data and potentially also if the high-level policy can be trained."},{"start":3481.12,"text":"on video data as well. So this one is putting the toothpaste in the wooden bowl. You can see that it generates these subgoal images of like, for example, holding the toothpaste above the bowl. It then reaches that. Then it generates a subgoal of like lowering the arm. And so the robot lowers the arm to complete the task."},{"start":3500.53,"text":"And then this last example, the goal is to open the drawer. The first subgoal is to put the gripper on the handle. Then the next subgoal is to move the gripper to the right so that it opens, and so forth. Another thing that's nice about this sort of approach is that if your policy sees objects that it's never seen before that are hard to describe in language, then you..."},{"start":3526.53,"text":"That's something that it can more easily describe in images"},{"start":3529.45,"text":"because it can more easily generalize across the objects that it's seeing"},{"start":3533.65,"text":"and generate pixels for those images"},{"start":3535.15,"text":"if it doesn't know what the semantic name for that object is."},{"start":3539.51,"text":"Cool."},{"start":3540.93,"text":"And then for this sort of thing, you can also do a comparison on, like,"},{"start":3544.93,"text":"is it helpful to include those unlabeled videos"},{"start":3547.57,"text":"for training the high-level policy?"},{"start":3550.39,"text":"And if you only use robot data, you get performance that looks like this."}],"speech_gaps":[],"frame":"../frames/v025/021.webp","frame_time":3393.92},{"title":"分层强化学习与模仿学习的结合与应用","segments":[{"id":239,"text":"And if you add videos of humans for training the high-level policy, you get an increase in performance compared to just using the robot data to train the policies.","start":3553.93,"end":3564.35},{"id":240,"text":"Now, we talked earlier about how chain of thought can replace hierarchy.","start":3567.81,"end":3571.09},{"id":241,"text":"And there's also approaches that have developed chain of thought versions of this where you can have some high-level tasks and the current observation.","start":3571.35,"end":3578.09},{"id":242,"text":"And it actually output either sub-goal images or subtasks.","start":3578.35,"end":3582.23},{"id":243,"text":"You can also have other representations like bounding boxes or waypoints.","start":3582.23,"end":3585.21},{"id":244,"text":"And then output the action.","start":3586.09,"end":3587.81},{"id":245,"text":"And there are some recent approaches from the last one year, basically, quite recent, that do something like that.","start":3588.11,"end":3597.31},{"id":246,"text":"The other thing to note is that this is with imitation learning.","start":3600.25,"end":3602.95},{"id":247,"text":"And we'll talk about reinforcement learning in a minute.","start":3603.23,"end":3605.59},{"id":248,"text":"it. But generally, for these large-scale systems, to date, for the most part, they use imitation","start":3605.59,"end":3611.35},{"id":249,"text":"learning more so than reinforcement learning. And fine-tuning them with reinforcement learning","start":3611.35,"end":3615.79},{"id":250,"text":"in some ways an open kind of research question for like, what is the best recipe for accomplishing that at large skills?","start":3618.59,"end":3624.19},{"id":251,"text":"And it's also a pretty important research direction because if we think about this slide right here, the kind of performance of these systems is still not like super, super reliable. And these are, I should mention, these are in pretty challenging situations with like held out objects that the robot hasn't seen before. So that is kind of out of distribution compared to what it saw during training. But if we had a way to train these with reinforcement learning, then we should be able to get these performances to be much higher compared to using imitation learning.","start":3626.15,"end":3653.63},{"id":252,"text":"So the question is, like, we talked about personalized recommendation systems, and could hierarchy be useful for that? Generally, I can't, like, it's not something that I've seen before, and generally when I've seen hierarchy, it's usually been for, like, pretty, like, longer horizon problems and tasks that are more complicated. In, like, language modeling, it's been used for...","start":3654.54,"end":3678.64},{"id":253,"text":"for math problems, essentially, and things where you need to have multiple steps for completing something. Yeah, I could think about it. Yeah, so in this case, the high-level policy is an image generative model. And what it does is it's going to take as input, it's trained to take as input an image observation and some sort of high-level goal.","start":3680.91,"end":3708.55}],"notes":["本段讨论了在大规模系统中，模仿学习相较于强化学习的使用情况。讲者指出，目前这些系统主要依赖模仿学习，而通过强化学习进行微调则是一个开放的研究问题，涉及如何在复杂技能中找到最佳的训练方法。","讲者提到，模仿学习的性能在某些挑战性场景下仍不够可靠，特别是当系统面对训练时未见过的对象时。这表明模仿学习在分布外数据上的泛化能力有限，而强化学习可能提供更高的性能。","讲者进一步探讨了分层强化学习在个性化推荐系统中的潜在应用。虽然讲者表示目前尚未见到相关应用，但指出分层方法通常适用于长周期任务和复杂任务，例如数学问题解决，这需要多步骤完成。","讲者提到，高阶策略可以是一个图像生成模型，它接受图像观察和高阶目标作为输入，这表明分层方法可以结合生成模型来实现更复杂的任务分解。","讲者强调，模仿学习和强化学习的结合仍然是一个活跃的研究方向，特别是在如何有效利用两者优势以提升系统性能方面。","讲者指出，模仿学习在面对分布外数据时表现不稳定，而强化学习可能提供更可靠的性能提升，但如何在实际应用中平衡两者仍是研究重点。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3553.93,"end":3708.55,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3553.93,"text":"And if you add videos of humans for training the high-level policy, you get an increase in performance compared to just using the robot data to train the policies."},{"start":3567.81,"text":"Now, we talked earlier about how chain of thought can replace hierarchy."},{"start":3571.35,"text":"And there's also approaches that have developed chain of thought versions of this where you can have some high-level tasks and the current observation."},{"start":3578.35,"text":"And it actually output either sub-goal images or subtasks."},{"start":3582.23,"text":"You can also have other representations like bounding boxes or waypoints."},{"start":3586.09,"text":"And then output the action."},{"start":3588.11,"text":"And there are some recent approaches from the last one year, basically, quite recent, that do something like that."},{"start":3600.25,"text":"The other thing to note is that this is with imitation learning."},{"start":3603.23,"text":"And we'll talk about reinforcement learning in a minute."},{"start":3605.59,"text":"it. But generally, for these large-scale systems, to date, for the most part, they use imitation"},{"start":3611.35,"text":"learning more so than reinforcement learning. And fine-tuning them with reinforcement learning"},{"start":3618.59,"text":"in some ways an open kind of research question for like, what is the best recipe for accomplishing that at large skills?"},{"start":3626.15,"text":"And it's also a pretty important research direction because if we think about this slide right here, the kind of performance of these systems is still not like super, super reliable. And these are, I should mention, these are in pretty challenging situations with like held out objects that the robot hasn't seen before. So that is kind of out of distribution compared to what it saw during training. But if we had a way to train these with reinforcement learning, then we should be able to get these performances to be much higher compared to using imitation learning."},{"start":3654.54,"text":"So the question is, like, we talked about personalized recommendation systems, and could hierarchy be useful for that? Generally, I can't, like, it's not something that I've seen before, and generally when I've seen hierarchy, it's usually been for, like, pretty, like, longer horizon problems and tasks that are more complicated. In, like, language modeling, it's been used for..."},{"start":3680.91,"text":"for math problems, essentially, and things where you need to have multiple steps for completing something. Yeah, I could think about it. Yeah, so in this case, the high-level policy is an image generative model. And what it does is it's going to take as input, it's trained to take as input an image observation and some sort of high-level goal."}],"speech_gaps":[{"start":3565.648,"end":3567.41},{"start":3597.71,"end":3599.85}],"frame":"../frames/v025/022.webp","frame_time":3565.93},{"title":"分层强化学习与模仿学习中的图像生成与表示","segments":[{"id":254,"text":"like, goal high level, and then you have a neural network, and that neural network is going to be trained to output OT plus K. And so it's going to be trained to generate an image of a future image. Yeah, trained to generate a future image. And you can get this as if you have videos, then you don't need language annotations to get this image.","start":3709.65,"end":3736.67},{"id":255,"text":"In terms of the architecture, it's using a diffusion model to generate these images. That's why you saw the noise kind of moving into the image. Yeah. In the direction of the goal. Yeah. So this particular goal might be on the horizon of like, I don't know, like a minute. And this sub goal could be in the direction, it could just be like, I don't know, 10 seconds in the future, something like that.","start":3738.21,"end":3761.83},{"id":256,"text":"Yeah. So in terms of using image editing models, that sort of general pre-training can be useful","start":3762.64,"end":3767.34},{"id":257,"text":"because it teaches the model how to generate images in general. And then the videos that are","start":3767.34,"end":3771.74},{"id":258,"text":"used, they're actually videos of people doing different tasks that have a single language","start":3771.74,"end":3777.02},{"id":259,"text":"annotation for what the person is doing in the whole video. And so those videos are especially","start":3777.02,"end":3782.84},{"id":260,"text":"useful to include because they're kind of pretty relevant. If instead you included random videos","start":3782.84,"end":3787.82},{"id":261,"text":"videos on YouTube, it's a little bit harder, but it might still teach it about like if there's some","start":3787.82,"end":3793.42},{"id":262,"text":"like future thing, what are kind of, what are images that could happen in the future? And that","start":3793.42,"end":3797.94},{"id":263,"text":"is useful pre-training for this kind of task. Yeah. So you're asking like, what if the language","start":3797.94,"end":3803.06},{"id":264,"text":"isn't accurate? And what if the, this is like a sketch instead of like a real image? So good","start":3803.06,"end":3812.22},{"id":265,"text":"Good question.","start":3812.22,"end":3812.56},{"id":266,"text":"I guess first, if you wanted to use sketches here,","start":3813.34,"end":3816.16},{"id":267,"text":"you would just want to ideally train a low-level policy","start":3816.62,"end":3819.08},{"id":268,"text":"to be able to use that sort of thing.","start":3819.08,"end":3820.36},{"id":269,"text":"And there are actually approaches","start":3820.78,"end":3821.9},{"id":270,"text":"that have taken images, and you can convert them","start":3821.9,"end":3823.88},{"id":271,"text":"into a sketch and train a low-level policy to do that.","start":3823.88,"end":3826.28},{"id":272,"text":"And you don't actually necessarily","start":3827.42,"end":3829.46},{"id":273,"text":"need this to be a full image.","start":3829.46,"end":3830.64},{"id":274,"text":"And these are just kind of, I should mention,","start":3831.02,"end":3832.68},{"id":275,"text":"two example representations.","start":3832.86,"end":3834.36},{"id":276,"text":"And language is actually particularly popular","start":3834.86,"end":3836.48},{"id":277,"text":"as an intermediate representation.","start":3836.9,"end":3838.18},{"id":278,"text":"But there's lots of other representations you could use,","start":3838.76,"end":3840.9},{"id":279,"text":"including sketches, including a trace of where you want the robot to go or something like that.","start":3840.9,"end":3847.36},{"id":280,"text":"And then in cases where the language isn't accurate, if it is describing something that's different, then oftentimes the robot will then follow that different task until it's been told to do something different. And so if the high-level policy is predicting language that is bad, then the system will suffer.","start":3849.18,"end":3867.48}],"notes":["本段主要讨论分层强化学习中使用图像生成模型来预测未来图像，以及如何利用视频数据进行预训练。教师提到使用扩散模型生成图像，并指出目标和子目标的时间范围。此外，还提到使用视频数据进行预训练时，语言注释的重要性，以及使用随机视频可能带来的挑战。","教师进一步讨论了图像生成模型的预训练方法，指出使用视频数据可以提供更相关的训练信息，而随机视频可能难以提供足够的信息。同时，教师提到如果语言不准确，系统可能会执行错误的任务，从而影响整体性能。","教师提到可以使用草图作为另一种表示形式，并指出可以训练低级策略来处理草图。此外，教师还提到语言是常用的中间表示，但也可以使用其他形式，如轨迹信息。","教师强调了语言在分层强化学习中的重要性，但也指出其他表示形式的可行性。同时，教师提到如果语言不准确，系统可能会执行错误的任务，直到被纠正，这说明了语言准确性对系统性能的影响。","教师还提到，即使语言不准确，系统仍然可以执行任务，但可能会导致性能下降。这表明语言作为中间表示的可靠性问题，以及如何处理不准确的语言输入。","教师最后总结了不同表示形式的使用，包括图像、草图和语言，并指出语言是特别流行的中间表示，但其他形式也可以使用。这表明在分层强化学习中，表示形式的选择对系统性能有重要影响。"],"formulas":[],"uncertainties":[],"diagram":"none","start":3709.65,"end":3867.48,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":3709.65,"text":"like, goal high level, and then you have a neural network, and that neural network is going to be trained to output OT plus K. And so it's going to be trained to generate an image of a future image. Yeah, trained to generate a future image. And you can get this as if you have videos, then you don't need language annotations to get this image."},{"start":3738.21,"text":"In terms of the architecture, it's using a diffusion model to generate these images. That's why you saw the noise kind of moving into the image. Yeah. In the direction of the goal. Yeah. So this particular goal might be on the horizon of like, I don't know, like a minute. And this sub goal could be in the direction, it could just be like, I don't know, 10 seconds in the future, something like that."},{"start":3762.64,"text":"Yeah. So in terms of using image editing models, that sort of general pre-training can be useful"},{"start":3767.34,"text":"because it teaches the model how to generate images in general. And then the videos that are"},{"start":3771.74,"text":"used, they're actually videos of people doing different tasks that have a single language"},{"start":3777.02,"text":"annotation for what the person is doing in the whole video. And so those videos are especially"},{"start":3782.84,"text":"useful to include because they're kind of pretty relevant. If instead you included random videos"},{"start":3787.82,"text":"videos on YouTube, it's a little bit harder, but it might still teach it about like if there's some"},{"start":3793.42,"text":"like future thing, what are kind of, what are images that could happen in the future? And that"},{"start":3797.94,"text":"is useful pre-training for this kind of task. Yeah. So you're asking like, what if the language"},{"start":3803.06,"text":"isn't accurate? And what if the, this is like a sketch instead of like a real image? So good"},{"start":3812.22,"text":"Good question."},{"start":3813.34,"text":"I guess first, if you wanted to use sketches here,"},{"start":3816.62,"text":"you would just want to ideally train a low-level policy"},{"start":3819.08,"text":"to be able to use that sort of thing."},{"start":3820.78,"text":"And there are actually approaches"},{"start":3821.9,"text":"that have taken images, and you can convert them"},{"start":3823.88,"text":"into a sketch and train a low-level policy to do that."},{"start":3827.42,"text":"And you don't actually necessarily"},{"start":3829.46,"text":"need this to be a full image."},{"start":3831.02,"text":"And these are just kind of, I should mention,"},{"start":3832.86,"text":"two example representations."},{"start":3834.86,"text":"And language is actually particularly popular"},{"start":3836.9,"text":"as an intermediate representation."},{"start":3838.76,"text":"But there's lots of other representations you could use,"},{"start":3840.9,"text":"including sketches, including a trace of where you want the robot to go or something like that."},{"start":3849.18,"text":"And then in cases where the language isn't accurate, if it is describing something that's different, then oftentimes the robot will then follow that different task until it's been told to do something different. And so if the high-level policy is predicting language that is bad, then the system will suffer."}],"speech_gaps":[],"frame":"../frames/v025/023.webp","frame_time":3721.65},{"title":"分层强化学习与模仿学习中的低级策略与目标设定","segments":[{"id":281,"text":"There are some cases where the low-level policy might also ignore the high-level policy and still, like, if you would kind of give it gibberish, it might just kind of have some sort of, in some ways, like, kind of default behavior because it was trained to output actions, and it often, like, will, like, for, like, different states.","start":3869.36,"end":3895.7},{"id":282,"text":"For example, if it is in, if it's, like, holding the pasta right here, then even regardless of any sort of language input, chances are the next action is actually to pour it. And so if you don't give it a language instruction or if you give it a noisy language instruction, it might still continue to pour it just because it knows that for that state, typically that's what
