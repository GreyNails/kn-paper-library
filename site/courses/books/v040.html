},{"id":2,"text":"that we're going to go over them. Now, hopefully, as we go through these two, we're going to learn this idea of expectation maximization, this EM algorithm. I will tell you EM in general is kind of an algorithm you run not as a last resort, but you run it typically because you have only a very weak knowledge of the structure. Often, and for some of these problems, you can find another method to solve them if you know more about it or are willing to make stronger assumptions.","start":43.21,"end":68.71},{"id":3,"text":"We're going to see it because it's like a classical algorithm. One of my graduate students was just writing for his submission next week. He's going to write what's called an ELBO. If you don't know what an ELBO is, you'll learn soon for his particular diffusion style estimator. Now, we're going to talk about k-means and its probabilistic analog, GMM. K-means is going to be hopefully intuitive to think about. It's going to be out-hawked, though, in the way we think about it. Then we'll see Gaussian mixture models, which are a softer version of this clustering.","start":69.62,"end":97.06},{"id":4,"text":"And those are going to be kind of the duality. Now, the techniques and ideas here are pretty useful on their own. As I mentioned to you, unsupervised algorithms have had a renaissance over the last 10 years. But more than anything, the reason pedagogically I like this section and the section that we're going into is it forces you to wrestle with some pretty basic questions in machine learning.","start":97.47,"end":117.57},{"id":5,"text":"What are we modeling? How are we putting structure into our models? What are we pulling out of it? And so we'll get a taste of that. And that's really the pedagogical goal. Like the algorithms, you could just look up in five minutes. But why we think about these algorithms, why we pick them, that's what I want you thinking about during this lecture and next. All right. So here is kind of the picture that should go in your head. Very, very basic kind of picture. Let me get this guy going. So you have some axis.","start":118.33,"end":148.5},{"id":6,"text":"In supervised learning, how did it work? Well, we had some points here, and then maybe we had some positive points there, and then maybe we had some negative characters over here, and our goal was draw some line that separated them. So this is the supervised world is what I'm talking about. And here we had these labels, the positive and the negative were our labels. Now in the unsupervised,","start":149.55,"end":180.94}],"notes":["本段介绍了本节课的主要内容，即讨论无监督学习中的两个常见算法：K-Means 和混合高斯模型（GMM）。课程强调了这些算法与期望最大化（EM）算法的关系，并指出EM算法通常用于结构知识较弱的情况。此外，还提到学生将学习ELBO（证据下界）的概念，这在扩散模型中尤为重要。","课程提到K-Means算法虽然直观，但在某些情况下可能不如其他方法有效，而GMM则提供了一种更柔和的聚类方式。这些算法的对比和联系是本段的重点。","本段还强调了无监督学习的重要性，特别是在过去十年中，无监督算法经历了复兴。课程的目标是让学生思考如何建模、如何在模型中引入结构以及如何从数据中提取信息。","课程指出，虽然这些算法可以快速查找，但理解为什么选择这些算法以及它们的适用性才是学习的重点。这有助于学生深入理解算法背后的原理。","在讲解过程中，教师通过对比监督学习和无监督学习的差异，帮助学生建立对两种学习范式的理解。监督学习中使用标签进行分类，而无监督学习则没有标签，需要从数据中发现结构。","最后，教师提到将通过一个简单的图示来帮助学生理解这些概念，这有助于学生形成直观的认识。"],"formulas":[],"uncertainties":["out-hawked"],"diagram":"none","start":5.17,"end":180.94,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":5.17,"text":"Hello. Welcome to 2.29. This is Lecture 9. We're going to talk about a couple of unsupervised algorithms."},{"start":13.92,"text":"Most of the focus for this week is going to be about algorithms where we don't actually have any labels, but we still want to do a bunch of machine learning. As we talked about before, this direction of using weaker labels or unlabeled data and understanding structure has uncorked a whole bunch of applications in machine learning over time. We're going to see two of the most common unsupervised algorithms, or popular, which are very closely related, which are k-means and the Gaussian mixture model. These are just kind of the canonical set. That's why"},{"start":43.21,"text":"that we're going to go over them. Now, hopefully, as we go through these two, we're going to learn this idea of expectation maximization, this EM algorithm. I will tell you EM in general is kind of an algorithm you run not as a last resort, but you run it typically because you have only a very weak knowledge of the structure. Often, and for some of these problems, you can find another method to solve them if you know more about it or are willing to make stronger assumptions."},{"start":69.62,"text":"We're going to see it because it's like a classical algorithm. One of my graduate students was just writing for his submission next week. He's going to write what's called an ELBO. If you don't know what an ELBO is, you'll learn soon for his particular diffusion style estimator. Now, we're going to talk about k-means and its probabilistic analog, GMM. K-means is going to be hopefully intuitive to think about. It's going to be out-hawked, though, in the way we think about it. Then we'll see Gaussian mixture models, which are a softer version of this clustering."},{"start":97.47,"text":"And those are going to be kind of the duality. Now, the techniques and ideas here are pretty useful on their own. As I mentioned to you, unsupervised algorithms have had a renaissance over the last 10 years. But more than anything, the reason pedagogically I like this section and the section that we're going into is it forces you to wrestle with some pretty basic questions in machine learning."},{"start":118.33,"text":"What are we modeling? How are we putting structure into our models? What are we pulling out of it? And so we'll get a taste of that. And that's really the pedagogical goal. Like the algorithms, you could just look up in five minutes. But why we think about these algorithms, why we pick them, that's what I want you thinking about during this lecture and next. All right. So here is kind of the picture that should go in your head. Very, very basic kind of picture. Let me get this guy going. So you have some axis."},{"start":149.55,"text":"In supervised learning, how did it work? Well, we had some points here, and then maybe we had some positive points there, and then maybe we had some negative characters over here, and our goal was draw some line that separated them. So this is the supervised world is what I'm talking about. And here we had these labels, the positive and the negative were our labels. Now in the unsupervised,"}],"speech_gaps":[],"frame":"../frames/v040/001.webp","frame_time":17.17},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":7,"text":"we're going to get rid of the labels. Here's the same dataset, roughly speaking. I should have drawn them to be isomorphic, just me being a terrible drawer. There'll be a lot of drawing in this lecture because I used to give this on the whiteboard and I like doing it. I'm not sure that it's super effective, so we'll see. I don't know. This is unsupervised. There are no labels.","start":185.25,"end":204.88},{"id":8,"text":"That bit of structure, that label, the fact that we had pluses and minuses here, let us actually give a pretty strong characterization of what we were after, right? We wanted something that would exactly separate the sets. There was kind of one canonical version of what we were after. In this unsupervised regime,","start":210.91,"end":227.33},{"id":9,"text":"It's not clear what a model means. We talked about a little bit in GDA where we remember in GDA, you had two different labels and you tried to learn a model of the labels. Here somehow we want to learn a model that describes the dataset, the clusters that are inside it, some qualitative structure of it that could help us classify. The point that I'm making is that's a pretty unstructured problem, and so we're going to have to make","start":228.2,"end":251.38},{"id":10,"text":"accept weaker guarantees. We're not going to be able to say things about the perfect line that does it. So we're going to have to think a lot about modeling. And we're going to have to make potentially stronger assumptions to say, oh, our data is generated by this process. And so we could potentially recover it if we saw it in some way. And the assumptions we have to make there are just intuitively going to be a lot stronger.","start":252.43,"end":274.44},{"id":11,"text":"The unsupervised learning here is going to be harder than the supervised, and so we'll make stronger assumptions and accept weaker guarantees. All right. So far, so good. All right. Please.","start":276.5,"end":286.18},{"id":12,"text":"It's possible that some of the things, in fact, the algorithm that we're going to point to today, actually finding the optimum will be harder. I meant in a more qualitative sense. So harder in the fact that actually getting the optimum for k-means will be NP-hard. And so in a formal sense, it is actually more challenging computationally. It doesn't mean that every instance of how we solve it is going to take more time.","start":289.28,"end":309.72},{"id":13,"text":"That's not the case. But intuitively, it will be more challenging. That's what I want to get across to you. Because we've dropped some assumptions. We've dropped some very important structure. We don't know the positive and the negative class. We don't know the class labels. Good question. Awesome. Are there others?","start":310.03,"end":327.41},{"id":14,"text":"All right. Now, by the way, I should also say, if you really miss my hand drawings, a better version of them should be online in the notes so you can actually see what I'm intending to draw. And then you can laugh about what's in the notes and then what shows up when I scribble it here. So what we're going to do today, we are going to talk about the k-means algorithm, which will be hopefully intuitive. It should be, if I do my job right, you'll kind of understand how it works. It may feel a little ad hoc. It may feel a little bit heuristic, but we'll see. We'll talk about a probabilistic method for the Gaussian","start":328.27,"end":357.73}],"notes":["本段讨论了无监督学习与监督学习之间的区别，指出无监督学习的问题更加复杂，因为没有标签，因此需要做出更强的假设并接受较弱的保证。讲者提到，K-Means 算法在寻找最优解时是 NP 难的，这意味着在计算上更具挑战性，但并不意味着每个实例的求解时间都会增加。","讲者强调了在无监督学习中，我们无法像监督学习那样明确地定义正负类，因此需要通过其他方式来建模数据的结构。这导致了对数据生成过程的假设必须更加直观和强烈，以便能够从数据中恢复出这些结构。","讲者提到 K-Means 算法的优化过程是 NP 难的，这表明在理论上，找到最优解是计算上困难的。然而，这并不意味着所有实例的求解时间都会增加，只是在形式上更具挑战性。","讲者指出，由于我们失去了监督学习中的结构，因此需要接受更弱的保证。这意味着我们无法保证找到完美的分割线，而是需要在建模过程中做出更强的假设。","讲者提到，K-Means 算法可能看起来有些随意或启发式，但会通过概率方法（如混合高斯模型）来提供更直观的理解。","讲者最后提到，如果学生对他的手绘图感兴趣，可以查看课程笔记中的更清晰版本，以便更好地理解他所讲的内容。"],"formulas":[],"uncertainties":[],"diagram":"none","start":185.25,"end":357.73,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":185.25,"text":"we're going to get rid of the labels. Here's the same dataset, roughly speaking. I should have drawn them to be isomorphic, just me being a terrible drawer. There'll be a lot of drawing in this lecture because I used to give this on the whiteboard and I like doing it. I'm not sure that it's super effective, so we'll see. I don't know. This is unsupervised. There are no labels."},{"start":210.91,"text":"That bit of structure, that label, the fact that we had pluses and minuses here, let us actually give a pretty strong characterization of what we were after, right? We wanted something that would exactly separate the sets. There was kind of one canonical version of what we were after. In this unsupervised regime,"},{"start":228.2,"text":"It's not clear what a model means. We talked about a little bit in GDA where we remember in GDA, you had two different labels and you tried to learn a model of the labels. Here somehow we want to learn a model that describes the dataset, the clusters that are inside it, some qualitative structure of it that could help us classify. The point that I'm making is that's a pretty unstructured problem, and so we're going to have to make"},{"start":252.43,"text":"accept weaker guarantees. We're not going to be able to say things about the perfect line that does it. So we're going to have to think a lot about modeling. And we're going to have to make potentially stronger assumptions to say, oh, our data is generated by this process. And so we could potentially recover it if we saw it in some way. And the assumptions we have to make there are just intuitively going to be a lot stronger."},{"start":276.5,"text":"The unsupervised learning here is going to be harder than the supervised, and so we'll make stronger assumptions and accept weaker guarantees. All right. So far, so good. All right. Please."},{"start":289.28,"text":"Yeah, so it's possible that some of the things, in fact, the algorithm that we're going to point to today, actually finding the optimum will be harder. I meant in a more qualitative sense. So harder in the fact that actually getting the optimum for k-means will be NP-hard. And so in a formal sense, it is actually more challenging computationally. It doesn't mean that every instance of how we solve it is going to take more time."},{"start":310.03,"text":"That's not the case. But intuitively, it will be more challenging. That's what I want to get across to you. Because we've dropped some assumptions. We've dropped some very important structure. We don't know the positive and the negative class. We don't know the class labels. Good question. Awesome. Are there others?"},{"start":328.27,"text":"All right. Now, by the way, I should also say, if you really miss my hand drawings, a better version of them should be online in the notes so you can actually see what I'm intending to draw. And then you can laugh about what's in the notes and then what shows up when I scribble it here. So what we're going to do today, we are going to talk about the k-means algorithm, which will be hopefully intuitive. It should be, if I do my job right, you'll kind of understand how it works. It may feel a little ad hoc. It may feel a little bit heuristic, but we'll see. We'll talk about a probabilistic method for the Gaussian"}],"speech_gaps":[],"frame":"../frames/v040/002.webp","frame_time":197.25},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":15,"text":"and mixture models, which we talked about will be this nice relaxation. And then I probably, if we have time, will talk about Jensen's inequality in pictures. By show of hands, who knows Jensen's inequality? OK, about half. All right, fantastic. You'll see it in pictures in a nice, hopefully simple way that it will click in your head. The reason those pictures are important is that turns out to be the core of this algorithm, EM, that we're going to see in the last half of the lecture and into the next lecture. That's our structure.","start":357.87,"end":385.55},{"id":16,"text":"Okay, so let's get to k-means. All right, so in k-means, we're going to have this k equals 2. So what are we given in this setup? So here we have some data. So this is what we're given. There's our data. And just as we talked about before, there are some points. And I've drawn the points here.","start":386.26,"end":408.31},{"id":17,"text":"Now, what the k equals two is talking for, that's what this k is, says that I want two clusters. So you could ask, why two clusters? Why not four clusters? That'll turn out to be a modeling parameter. For now, just imagine that two is the thing that we're after. What we want to do somehow is, and I would say the best two clusters, and we'll talk about what best means in a second. Maybe these characters are a nice cluster, and these characters over here are a nice cluster.","start":409.16,"end":438.34},{"id":18,"text":"Now, you can think about what that means, that these points are a nice cluster. One way to do it, one thing that we want to do it is, we're going to be given these integer k and these points. This is x1, for example. This is say x1, this is x2.","start":440.28,"end":458.88},{"id":19,"text":"And we're going to assign each of them mathematically to one of the k clusters. So uality? OK, about half. All right, fantastic. You'll see it in pictures in a nice, hopefully simple way that it will click in your head. The reason those pictures are important is that turns out to be the core of this algorithm, EM, that we're going to see in the last half of the lecture and into the next lecture. That's our structure."},{"start":386.26,"text":"Okay, so let's get to k-means. All right, so in k-means, we're going to have this k equals 2. So what are we given in this setup? So here we have some data. So this is what we're given. There's our data. And just as we talked about before, there are some points. And I've drawn the points here."},{"start":409.16,"text":"Now, what the k equals two is talking for, that's what this k is, says that I want two clusters. So you could ask, why two clusters? Why not four clusters? That'll turn out to be a modeling parameter. For now, just imagine that two is the thing that we're after. What we want to do somehow is, and I would say the best two clusters, and we'll talk about what best means in a second. Maybe these characters are a nice cluster, and these characters over here are a nice cluster."},{"start":440.28,"text":"Now, you can think about what that means, that these points are a nice cluster. One way to do it, one thing that we want to do it is, we're going to be given these integer k and these points. This is x1, for example. This is say x1, this is x2."},{"start":459.75,"text":"And we're going to assign each of them mathematically to one of the k clusters. So that's what this ci equals j is going to mean. It says point i goes to cluster j. So all these points here are going to cluster 1, and all these points here are going to cluster 2. So that's what we are given in the do. We're given the points without any labels, and our job is to come up with this assignment, which I've drawn and scribbled with my blue and my pinkish orangish color on there."},{"start":484.2,"text":"But really, mathematically, it's going to do here. And I don't actually know. So I'll make C2 should be over here. So I'm going to change the label. I'll make this guy C4 to align with this. And I'll move X2 over here to align with this. Clear enough with the mapping mates? OK, cool."},{"start":505.58,"text":"All right, so how do we find these clusters? We're going to give one particular algorithm to do it, and it's going to be an iterative algorithm, as you've seen many times in the course. So how do we do this? All right, so this will be a little painful without copy-paste, but we'll make do with it. So we have these three points, and what we do is we initialize randomly some center mu1 and some center mu2."}],"speech_gaps":[],"frame":"../frames/v040/003.webp","frame_time":369.87},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":22,"text":"Now, when I said that we're going to get out this assignment, I just introduced this new notion, which are these cluster centers. They're going to be points in the space, and the idea is that for every point that I'm going to say is in cluster 1, if it's closer to mu1, then it's closer to mu2. And I'm going to try and move these points.","start":535.62,"end":553.66},{"id":23,"text":"so that they're at the cluster center. And so the means here refers to the mean of their cluster. So if I were to give you all the points in the cluster, say this point here, you'd expect the mean is right there. That's where mu2 should end up. And the mean of this cluster, mu1, should end up right in their middle. Intuitively clear what we're after? That's the object that we're going to solve for. That's how we're going to get to the clustering. So far so good? Okay. So now what I've just described,","start":554.67,"end":583.94},{"id":24,"text":"I'm going to try copy paste again because I'm a glutton for punishment. It should work. It worked earlier. Let's try it. Copy. Oh, so tempting. No, does not work. All right. Awesome. Okay. We will then put all these up here and I will draw it 现过程中可能会遇到一些技术问题，例如复制粘贴操作失败，但表示会重新绘制示意图以帮助理解。这表明在实际操作中可能会遇到一些挑战，但通过反复尝试可以解决。","讲者详细描述了算法的执行步骤，包括计算每个数据点到各个聚类中心的距离，并根据距离将数据点分配到最近的聚类中心。同时，讲者提到在比较距离时，虽然使用了平方距离，但并不影响最终的聚类结果，因为只需要确定最近的聚类中心。","讲者进一步说明了算法的迭代过程，即在每次迭代中，首先根据当前的聚类中心分配数据点，然后重新计算聚类中心的位置。这一过程会不断重复，直到聚类中心不再显著变化为止。","讲者提到在算法实现中，聚类中心的更新是基于所有分配到该聚类的数据点的均值。这表明算法的核心思想是通过不断优化聚类中心的位置来最小化聚类误差，从而达到最佳的聚类效果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":535.62,"end":705.32,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":535.62,"text":"Now, when I said that we're going to get out this assignment, I just introduced this new notion, which are these cluster centers. They're going to be points in the space, and the idea is that for every point that I'm going to say is in cluster 1, if it's closer to mu1, then it's closer to mu2. And I'm going to try and move these points."},{"start":554.67,"text":"so that they're at the cluster center. And so the means here refers to the mean of their cluster. So if I were to give you all the points in the cluster, say this point here, you'd expect the mean is right there. That's where mu2 should end up. And the mean of this cluster, mu1, should end up right in their middle. Intuitively clear what we're after? That's the object that we're going to solve for. That's how we're going to get to the clustering. So far so good? Okay. So now what I've just described,"},{"start":584.49,"text":"I'm going to try copy paste again because I'm a glutton for punishment. It should work. It worked earlier. Let's try it. Copy. Oh, so tempting. No, does not work. All right. Awesome. Okay. We will then put all these up here and I will draw it one more illustrative time to do this. I don't know why it doesn't work in this mode now. All right. So how does this work? So I'm going to take those points. Here's my very critically drawn thing."},{"start":613.86,"text":"I'm going to have my current guess of the mui. So here, I probably switched colors. I apologize if I did that. Shouldn't really matter. But I'm not going to be consistent about that, I guess. Here's my points. The first thing I do is I compute. This is the line I set out on. For every point, I figure out which one is closer to. So this point is closer to mu1 than it's closer to mu2. So this is going to be a mu1. So let me color that character blue."},{"start":644.29,"text":"Okay, this point looks to me to be closer to mu1 than mu2, just barely. This one, I don't know, kind of seems a little closer to mu2. Clear what I'm doing? I'm comparing this distance and this distance. All right, now in this way, I go through and I start to compare all of them. Maybe I'll make this character closer to mu1, right? Okay, so this is me implementing this line right here."},{"start":674.83,"text":"When I say closer, I'm looking at the distance. You could say, does it matter that it's squared? Not really, but I'll use the square later in a convenience because it's just a minimum, right? Just saying which points am I closer to. Don't let the square bother you. Euclidean distance. Cool. All right. Now, when I do this, I have to do the second point. I have to compute new cluster center. So what's my algorithm going to be? I start with guesses. And hopefully, as we said, mu1 is going to migrate down here and mu2 is going to go up there."}],"speech_gaps":[],"frame":"../frames/v040/004.webp","frame_time":547.62},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":28,"text":"Now, what if, by the way, this is a thing. What if mu2 migrated over here and mu1 migrated over there? Would that be bad or good or indifferent? Please. It wouldn't matter. And this is the key point in unsupervised. I don't know which cluster is mu1 or which cluster is mu2. There are no labels. What I care about is that I got centers that were at the right spot, whatever their labels are. Okay? All right. Excellent. Oops. Monkey. All right.","start":705.99,"end":735.92},{"id":29,"text":"I've got to stop drawing in 敛。","讲者提到，当聚类中心不再变化时，算法会停止。这是判断算法是否收敛的标准，即如果再次运行算法后，聚类分配没有变化，则中心也不会变化，算法终止。","讲者最后提出一个问题，即K-Means算法是否一定会终止。这表明算法的终止性是一个需要进一步思考的问题，尽管在实际应用中，算法通常会收敛。","讲者通过举例说明了算法的迭代过程，强调了聚类中心的更新和聚类分配的循环过程，以及如何判断算法是否达到稳定状态。","讲者在讲解过程中使用了直观的图示和例子，帮助学生理解K-Means算法的运作机制，包括聚类中心的迁移、计算平均值的过程以及算法的终止条件。"],"formulas":[],"uncertainties":[],"diagram":"none","start":705.99,"end":867.0,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":705.99,"text":"Now, what if, by the way, this is a thing. What if mu2 migrated over here and mu1 migrated over there? Would that be bad or good or indifferent? Please. It wouldn't matter. And this is the key point in unsupervised. I don't know which cluster is mu1 or which cluster is mu2. There are no labels. What I care about is that I got centers that were at the right spot, whatever their labels are. Okay? All right. Excellent. Oops. Monkey. All right."},{"start":736.62,"text":"I've got to stop drawing in weird ways. All right, we'll get there. Okay, so now the next part of my iteration is this character. I want to compute the new cluster centers. So what I'll do is I'll look at all these points, let's say for the blue characters, and I'll compute their mean. And so their mean probably lives somewhere right there. This is going to be mu1 at time 2, I'm going to call it. Clear enough? It's the average of these points, computed however visually crudely."},{"start":768.11,"text":"Right? How do I compute it? Well, I just add all of them and divide by the number that are there. It is really their arithmetic average. Mu2, we'll get a similar one. Now, if I did my job correctly, that's all a big if. Now, notice mu2, I'll put two here to denote it. These characters have all gotten closer. Now, when I do this, I then have to loop back. It's an iterative algorithm."},{"start":800.04,"text":"Now if I look here, all of these three points are now closer to the mu character and all three of these are closer to the mu character. So all of these would be blue and all of these would be red. And then where is their mean? Right where I claim they should be after I run the next step. How do I know at the next time to stop? Exactly right. If I run this algorithm again and I get exactly the same information, the cluster assignments are the same across time step,"},{"start":834.54,"text":"then it's not going to change the center. So this algorithm would just loop forever if I continue to run it, so I'll stop it then. That's the cluster that I got out of this. Is that intuitively clear? Awesome. So now you know k-means. Now, a couple of questions. Does it terminate? It's actually not obvious, but guesses. Please."}],"speech_gaps":[],"frame":"../frames/v040/005.webp","frame_time":717.99},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":33,"text":"Yeah, great, good intuition. So the intuition is, hey, the underlying clustering is deterministic. And so potentially, you could just only explore all of them after some point in time. The challenge with that is it could oscillate back and forth. So I think you're thinking in the right way. But you were going to say? I was going to ask, what if you have a situation in which you have a ridiculously scattered amount of data, and it's very difficult to assign any kind of cluster or boundary? Awesome question. Are you just going to end up in a sequence of...","start":873.65,"end":901.25},{"id":34,"text":"constantly changing the view to deliver some value yeah wonderful question so both of you are thinking about this in exactly a very interesting way and i think you both have kind of the right intuition so the question is what if i have points just to kind of go as you said what if there doesn't really exist a good clustering","start":901.31,"end":914.53},{"id":35,"text":"We're going to come back to that in just one minute. So I want to come back to that. It's a really important point that you're making. The second one, when I think about, and that's the right example to think about, what would happen in kind of the bad case of what would bounce around with the Muse. Now, the thing that would really unsettle the Muse is somehow if they weren't kind of making incremental progress in some way. So if they're just flipping values.","start":914.8,"end":935.52},{"id":36,"text":"That's kind of too discrete progress. That could actually oscillate forever. It turns out that underneath the covers, which is kind of amazing, is this functional, this least squares functional, this is actually monotonically decreasing. So it means over time, if you think about why, you should go through the arguments in the notes. Over time, that average, that L2 distance is shrinking. But it doesn't say the rate at which it's shrinking.","start":937.33,"end":962.62},{"id":37,"text":"It could shrink very slowly. And both of these examples are really good ones. If you have something which is really spread out, maybe it's just kind of fighting about one point, right? There's these points which like when I move the centers, like there's a big mass and then there's these things around the edge. The worry would be that those, you know, kind of points that are very distant are kind of pulling the cluster centers and they're kind of fighting about this point, but the mass doesn't let them, you know, cleanly solve it on each iteration. That's the picture. And this says, that really doesn't happen. It actually still goes cleanly. Now,","start":964.36,"end":993.04},{"id":38,"text":"It could go really, really slowly. It doesn't say anything about the rate. Here's another question. Does it find the global minimum? It is an NP-hard problem. So it'd be super suspicious. So one of two things would have to be true. Either it would decrease so slowly, because it's an NP-hard problem, that it would take an exponential number of steps. Or it could find not the right answer. Both of those are possible from the first thing.","start":993.77,"end":1025.91}],"notes":["本段讨论了K-Means算法在面对数据分布不明确时的挑战，特别是当数据点非常分散且难以划分聚类时的情况。讲者指出，这种情况下算法可能会在不同聚类之间反复切换，导致无法稳定收敛。同时，讲者提到，K-Means的损失函数实际上是单调递减的，这意味着平均L2距离会随着时间推移而减少，但并未说明减少的速度。","讲者进一步解释了当数据点分布非常广泛时，算法可能会在某些点上反复调整聚类中心，导致无法清晰地解决每个迭代步骤中的问题。然而，讲者指出，这种现象实际上不会发生，算法仍然能够稳定地进行。","讲者还提到，K-Means算法的收敛速度可能非常缓慢，但并未说明具体的速度。此外，讲者指出，由于K-Means是一个NP难问题，因此无法保证找到全局最优解，可能需要指数级的步骤，或者可能无法找到正确的答案。","讲者通过这些例子强调了K-Means算法在实际应用中的局限性，特别是在数据分布复杂或难以划分聚类的情况下。同时，讲者也指出，尽管存在这些挑战，算法仍然能够稳定地进行，但可能需要较长的时间才能收敛。","讲者还提到，K-Means的损失函数是单调递减的，这意味着算法在迭代过程中会不断减少误差，但无法保证找到全局最优解。这与NP难问题的性质相关，因此需要权衡算法的收敛速度和结果的准确性。","最后，讲者通过这些讨论强调了K-Means算法在实际应用中的重要性，同时也指出了其局限性，特别是在处理复杂数据分布时的挑战。"],"formulas":[],"uncertainties":["the Muse"],"diagram":"none","start":873.65,"end":1025.91,"asr_flags":[],"math_clarifications":["原始片段中未提供具体的数学公式，仅提及了L2距离的概念，因此无法进行数学复核。","部分公式候选未通过数学或来源检查，已移除；可结合本页原视频核对尚未明确的关系。"],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":873.65,"text":"Yeah, great, good intuition. So the intuition is, hey, the underlying clustering is deterministic. And so potentially, you could just only explore all of them after some point in time. The challenge with that is it could oscillate back and forth. So I think you're thinking in the right way. But you were going to say? I was going to ask, what if you have a situation in which you have a ridiculously scattered amount of data, and it's very difficult to assign any kind of cluster or boundary? Awesome question. Are you just going to end up in a sequence of..."},{"start":901.31,"text":"constantly changing the view to deliver some value yeah wonderful question so both of you are thinking about this in exactly a very interesting way and i think you both have kind of the right intuition so the question is what if i have points just to kind of go as you said what if there doesn't really exist a good clustering"},{"start":914.8,"text":"We're going to come back to that in just one minute. So I want to come back to that. It's a really important point that you're making. The second one, when I think about, and that's the right example to think about, what would happen in kind of the bad case of what would bounce around with the Muse. Now, the thing that would really unsettle the Muse is somehow if they weren't kind of making incremental progress in some way. So if they're just flipping values."},{"start":937.33,"text":"That's kind of too discrete progress. That could actually oscillate forever. It turns out that underneath the covers, which is kind of amazing, is this functional, this least squares functional, this is actually monotonically decreasing. So it means over time, if you think about why, you should go through the arguments in the notes. Over time, that average, that L2 distance is shrinking. But it doesn't say the rate at which it's shrinking."},{"start":964.36,"text":"it could shrink very slowly. And both of these examples are really good ones. If you have something which is really spread out, maybe it's just kind of fighting about one point, right? There's these points which like when I move the centers, like there's a big mass and then there's these things around the edge. The worry would be that those, you know, kind of points that are very distant are kind of pulling the cluster centers and they're kind of fighting about this point, but the mass doesn't let them, you know, cleanly solve it on each iteration. That's the picture. And this says, that really doesn't happen. It actually still goes cleanly. Now,"},{"start":993.77,"text":"It could go really, really slowly. It doesn't say anything about the rate. Here's another question. Does it find the global minimum? It is an NP-hard problem. So it'd be super suspicious. So one of two things would have to be true. Either it would decrease so slowly, because it's an NP-hard problem, that it would take an exponential number of steps. Or it could find not the right answer. Both of those are possible from the first thing."}],"speech_gaps":[],"frame":"../frames/v040/006.webp","frame_time":885.65},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":39,"text":"It picks not the right answer. We'll come back to that in a second. There's another question. What is an NP-hard problem? Oh, sorry. So NP-hard problem is a notion from complexity. You don't need to know it for this class. It means that it's expected that a problem is easy to verify in polynomial time, but takes potentially much longer to get the right answer. So it's a notion of being a computationally hard problem. It just means something that's unlikely to have a simple, efficient solution. Great question. Sorry about that.","start":1026.38,"end":1054.4},{"id":40,"text":"The NP-hard problem gives you some clue that this thing won't have a minimum,","start":1055.66,"end":1059.08},{"id":41,"text":"and indeed it does not. Please, you had another question.","start":1060.38,"end":1064.86},{"id":42,"text":"Awesome question, yeah. Are there multiple local minima? So because it converges,","start":1066.52,"end":1070.64},{"id":43,"text":"and because you have that it's not finding a global minimum, you suspect that in fact there","start":1070.64,"end":1074.5},{"id":44,"text":"are these local minima that it can get locked into, and indeed there can be multiple of them.","start":1074.5,"end":1078.4},{"id":45,"text":"And sort of what can happen here is this kind of thing that we're talking about that","start":1078.6,"end":1081.56},{"id":46,"text":"But indeed, yes, there are multiple local minima.","start":1081.56,"end":1084.08},{"id":47,"text":"And it's not well-defined.","start":1084.12,"end":1085.5},{"id":48,"text":"Go ahead.","start":1085.72,"end":1086.0},{"id":49,"text":"Yeah.","start":1086.12,"end":1086.26},{"id":50,"text":"Jump around to start from different starting points.","start":1086.72,"end":1089.78},{"id":51,"text":"Exactly right.","start":1089.78,"end":1090.36},{"id":52,"text":"At the end of the lower local minima.","start":1090.44,"end":1092.3},{"id":53,"text":"Exactly right.","start":1092.6,"end":1093.42},{"id":54,"text":"So the intuition is, because you have these local minima,","start":1093.5,"end":1096.72},{"id":55,"text":"the initialization matters quite a bit.","start":1096.82,"end":1098.76},{"id":56,"text":"Because if you looked, you say, if you think, OK,","start":1098.92,"end":1101.58},{"id":57,"text":"it's potentially going to end in a different solution.","start":1101.7,"end":1103.78},{"id":58,"text":"But every step we had in the algorithm, let it go back,","start":1103.98,"end":1107.24},{"id":59,"text":"was deterministic.","start":1107.44,"end":1108.24},{"id":60,"text":"So how is it ending up somewhere else?","start":1109.26,"end":1110.94},{"id":61,"text":"Well, there's one thing that we didn't talk about, which is this part here.","start":1110.94,"end":1114.92},{"id":62,"text":"Randomly initialize the centers. That point of where you start the mu1s and the mu2s can have","start":1118.18,"end":1123.7},{"id":63,"text":"a difference on what kind of solution you get at the end. Perfect. You guys have this intuition","start":1123.7,"end":1127.0},{"id":64,"text":"exactly right. All right. Now, it turns out that a while back, there were some great folks from","start":1127.0,"end":1132.92},{"id":65,"text":"Stanford, folks. They were graduate students at Stanford. And they came up with this algorithm","start":1132.92,"end":1136.14},{"id":66,"text":"algorithm that they called K-Means++.","start":1136.14,"end":1137.64},{"id":67,"text":"And it's one of my favorite kind of algorithms.","start":1137.92,"end":1139.6},{"id":68,"text":"And they basically showed that they could get a great approximation ratio by weighting where you started those points. So they could show that there was an initialization that no matter what your data is, they would do a pretty good job. Because with NP-hard, they couldn't prove that you would get an optimal solution, but they proved that starting with that right solution...","start":1140.46,"end":1160.82},{"id":69,"text":"that would be actually the way to do it. And interestingly enough, if you use this package, which is like a very common Python package for traditional machine learning called sklearn, it's actually implemented there, and it is actually the default now. And they, you know, Vasily did it when they were grad students, and there's a little Wikipedia page about it, which doesn't render too well. Please. Yeah, so an approximation ratio means, basically, I'm going to tell you that my solution...","start":1161.92,"end":1186.0},{"id":70,"text":"has some fraction, some ratio to the true solution.","start":1186.45,"end":1189.35},{"id":71,"text":"So the optimal has some cost, if you like.","start":1189.47,"end":1193.41},{"id":72,"text":"And an approximation ratio means I can bound what that cost is.","start":1193.55,"end":1196.85},{"id":73,"text":"It just means that.","start":1196.97,"end":1197.71},{"id":74,"text":"Now you could say, why do I care about the cost?","start":1197.75,"end":1200.15},{"id":75,"text":"That's a separate issue, right?","start":1200.45,"end":1201.75},{"id":76,"text":"Like the cost may not be a meaningful structure.","start":1201.89,"end":1203.63}],"notes":["本段讨论了K-Means算法中局部极小值的问题，指出由于算法收敛性，可能存在多个局部极小值，而初始化点的选择会影响最终结果。这说明了K-Means算法对初始中心点的敏感性，以及为何需要随机初始化或使用改进的初始化方法如K-Means++。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1026.38,"end":1203.63,"asr_flags":[],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1026.38,"text":"It picks not the right answer. We'll come back to that in a second. There's another question. What is an NP-hard problem? Oh, sorry. So NP-hard problem is a notion from complexity. You don't need to know it for this class. It means that it's expected that a problem is easy to verify in polynomial time, but takes potentially much longer to get the right answer. So it's a notion of being a computationally hard problem. It just means something that's unlikely to have a simple, efficient solution. Great question. Sorry about that."},{"start":1055.66,"text":"The NP-hard problem gives you some clue that this thing won't have a minimum,"},{"start":1060.38,"text":"and indeed it does not. Please, you had another question."},{"start":1066.52,"text":"Awesome question, yeah. Are there multiple local minima? So because it converges,"},{"start":1070.64,"text":"and because you have that it's not finding a global minimum, you suspect that in fact there"},{"start":1074.5,"text":"are these local minima that it can get locked into, and indeed there can be multiple of them."},{"start":1078.6,"text":"And sort of what can happen here is this kind of thing that we're talking about that"},{"start":1081.56,"text":"But indeed, yes, there are multiple local minima."},{"start":1084.12,"text":"And it's not well-defined."},{"start":1085.72,"text":"Go ahead."},{"start":1086.12,"text":"Yeah."},{"start":1086.72,"text":"Jump around to start from different starting points."},{"start":1089.78,"text":"Exactly right."},{"start":1090.44,"text":"At the end of the lower local minima."},{"start":1092.6,"text":"Exactly right."},{"start":1093.5,"text":"So the intuition is, because you have these local minima,"},{"start":1096.82,"text":"the initialization matters quite a bit."},{"start":1098.92,"text":"Because if you looked, you say, if you think, OK,"},{"start":1101.7,"text":"it's potentially going to end in a different solution."},{"start":1103.98,"text":"But every step we had in the algorithm, let it go back,"},{"start":1107.44,"text":"was deterministic."},{"start":1109.26,"text":"So how is it ending up somewhere else?"},{"start":1110.94,"text":"Well, there's one thing that we didn't talk about, which is this part here."},{"start":1118.18,"text":"Randomly initialize the centers. That point of where you start the mu1s and the mu2s can have"},{"start":1123.7,"text":"a difference on what kind of solution you get at the end. Perfect. You guys have this intuition"},{"start":1127.0,"text":"exactly right. All right. Now, it turns out that a while back, there were some great folks from"},{"start":1132.92,"text":"Stanford, folks. They were graduate students at Stanford. And they came up with this algorithm"},{"start":1136.14,"text":"algorithm that they called K-Means++."},{"start":1137.92,"text":"And it's one of my favorite kind of algorithms."},{"start":1140.46,"text":"And they basically showed that they could get a great approximation ratio by weighting where you started those points. So they could show that there was an initialization that no matter what your data is, they would do a pretty good job. Because with NP-hard, they couldn't prove that you would get an optimal solution, but they proved that starting with that right solution..."},{"start":1161.92,"text":"that would be actually the way to do it. And interestingly enough, if you use this package, which is like a very common Python package for traditional machine learning called sklearn, it's actually implemented there, and it is actually the default now. And they, you know, Vasily did it when they were grad students, and there's a little Wikipedia page about it, which doesn't render too well. Please. Yeah, so an approximation ratio means, basically, I'm going to tell you that my solution..."},{"start":1186.45,"text":"has some fraction, some ratio to the true solution."},{"start":1189.47,"text":"So the optimal has some cost, if you like."},{"start":1193.55,"text":"And an approximation ratio means I can bound what that cost is."},{"start":1196.97,"text":"It just means that."},{"start":1197.75,"text":"Now you could say, why do I care about the cost?"},{"start":1200.45,"text":"That's a separate issue, right?"},{"start":1201.89,"text":"Like the cost may not be a meaningful structure."}],"speech_gaps":[],"frame":"../frames/v040/007.webp","frame_time":1038.38},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":77,"text":"What it really says qualitatively is initialization matters.","start":1203.95,"end":1207.45},{"id":78,"text":"And there's a smart way to do it.","start":1207.81,"end":1209.45},{"id":79,"text":"And some wonderful, smart Stanford people like you","start":1209.53,"end":1211.51},{"id":80,"text":"who took some precursor to 229 or 229 itself figured out how to solve it.","start":1211.51,"end":1215.75},{"id":81,"text":"That's what I cared to get across. Awesome questions. Please.","start":1215.75,"end":1219.51},{"id":82,"text":"At the bottom of the previous slide, you said repeat. Can you explain exactly what's going on?","start":1220.57,"end":1226.97},{"id":83,"text":"Oh, yeah. So this repeat until the cluster stayed the same? This is what we talked about verbally. So","start":1227.61,"end":1233.43},{"id":84,"text":"there's no additional content. But as we talked about these two steps, assign to a cluster and","start":1233.43,"end":1238.99},{"id":85,"text":"compute a new cluster, we're going to iterate again and again. And what we thought about is","start":1238.99,"end":1243.15},{"id":86,"text":"is there's nothing in here that says to stop iterating.","start":1243.15,"end":1246.41},{"id":87,"text":"But there's a natural condition to stop iterating.","start":1246.77,"end":1249.13},{"id":88,"text":"There's one natural condition, actually,","start":1249.57,"end":1251.21},{"id":89,"text":"which we use in practice.","start":1251.25,"end":1251.97},{"id":90,"text":"Run some number of steps and call it a day.","start":1252.67,"end":1254.35},{"id":91,"text":"You're all familiar with this condition.","start":1254.51,"end":1256.15},{"id":92,"text":"A second one that is traditionally run","start":1256.67,"end":1258.85},{"id":93,"text":"is, well, the clusters are eventually going to get fixed.","start":1258.85,"end":1261.55},{"id":94,"text":"You're getting stuck at a minimum.","start":1262.17,"end":1264.01},{"id":95,"text":"And then you just stop when the assignments are there.","start":1264.41,"end":1267.11},{"id":96,"text":"So we're not repeating that initialize.","start":1267.59,"end":1270.17},{"id":97,"text":"We're using the cluster.","start":1270.17,"end":1270.87},{"id":98,"text":"Exactly right.","start":1270.87,"end":1271.45},{"id":99,"text":"Yeah.","start":1271.51,"end":1271.61},{"id":100,"text":"Yeah, this part is the part from the, yeah, as you said, that you're initializing.","start":1271.61,"end":1275.11},{"id":101,"text":"We're not reinitializing on every step.","start":1275.19,"end":1276.77},{"id":102,"text":"Wonderful questions.","start":1276.93,"end":1277.59},{"id":103,"text":"Please.","start":1278.47,"end":1278.99},{"id":104,"text":"Some lectures ago, we got this intuition that in very high dimensions,","start":1279.29,"end":1285.43},{"id":105,"text":"it's kind of hard to think about non-complex, non-complexities.","start":1286.23,"end":1290.85},{"id":106,"text":"So does it apply here?","start":1291.15,"end":1292.59},{"id":107,"text":"If you have many dimensions, it would be probably easier to have a...","start":1292.75,"end":1296.51},{"id":108,"text":"This is a phenomenal, phenomenal question.","start":1296.51,"end":1298.67},{"id":109,"text":"question. Let me see if I have it on the next piece. No, no. Okay. So the question, there's","start":1298.67,"end":1305.45},{"id":110,"text":"two questions that I want to get to here. So the kind of repeating as you went back","start":1305.45,"end":1309.09},{"id":111,"text":"to is one of the things we discussed earlier is that your intuition about what happens","start":1309.09,"end":1313.11},{"id":112,"text":"with points in high dimensions is a little bit weird, right? It doesn't look like three","start":1313.11,"end":1316.55},{"id":113,"text":"dimensions. And so weird things can happen in high dimensions with random points, your","start":1316.55,"end":1320.21},{"id":114,"text":"nearest neighbor and your farthest neighbor about the same distance, stuff like that.","start":1320.21,"end":1323.53},{"id":115,"text":"Like if you sample from the sphere, you get like the shell, you know, if you sample inside","start":1323.59,"end":1327.05},{"id":116,"text":"the sphere kind of thing.","start":1327.05,"end":1327.79},{"id":117,"text":"Okay, so this relates back to your point about this random scattered data that's out there. If your data has no structure in it and it's random, then running k-means on it is kind of a bizarre thing to do.","start":1328.11,"end":1338.91},{"id":118,"text":"And the reason it's bizarre is what k-means has to have underneath it is some meaningful structure. And this is exactly, you're both thinking exactly the same way. If your data has latent clusters, you believe it has latent clusters. I was at a talk earlier today where someone was talking about clusters in gene type, different gene types for different expression.","start":1339.4,"end":1358.46}],"notes":["本段讨论了K-Means算法中迭代停止的条件。讲者指出，虽然算法中没有明确的停止条件，但实践中通常会设定一个迭代次数上限，或者当聚类结果不再变化时停止。此外，还提到当算法陷入局部最优解时，也会停止迭代。","讲者进一步探讨了高维数据对K-Means算法的影响。他指出，在高维空间中，数据点之间的距离变得难以区分，这可能导致算法表现不佳。这种现象与之前提到的高维数据的‘诅咒’有关，即在高维空间中，最近邻和最远邻的距离可能非常接近。","讲者提到，当数据没有结构时，运行K-Means算法可能并不合适。这是因为K-Means依赖于数据中潜在的聚类结构。如果数据是随机的，没有明显的聚类，那么K-Means的结果可能没有实际意义。","讲者还提到，他之前在讨论中提到过，高维数据中随机点的性质可能导致一些奇怪的现象，例如最近邻和最远邻的距离相近。这种现象在高维空间中尤为明显，因为数据点的分布变得稀疏。","讲者以基因类型为例，说明了数据中潜在结构的重要性。他提到，如果数据中存在潜在的聚类（如不同基因类型的表达模式），那么K-Means算法可能有效；但如果数据是随机的，那么算法可能无法提供有意义的结果。"],"formulas":[],"uncertainties":[],"diagram":"none","start":1203.95,"end":1358.46,"asr_flags":[99],"translation_complete":false,"translated_segments":0,"raw_segments":[{"start":1203.95,"text":"What it really says qualitatively is initialization matters."},{"start":1207.81,"text":"And there's a smart way to do it."},{"start":1209.53,"text":"And some wonderful, smart Stanford people like you"},{"start":1211.51,"text":"who took some precursor to 229 or 229 itself figured out how to solve it."},{"start":1215.75,"text":"That's what I cared to get across. Awesome questions. Please."},{"start":1220.57,"text":"At the bottom of the previous slide, you said repeat. Can you explain exactly what's going on?"},{"start":1227.61,"text":"Oh, yeah. So this repeat until the cluster stayed the same? This is what we talked about verbally. So"},{"start":1233.43,"text":"there's no additional content. But as we talked about these two steps, assign to a cluster and"},{"start":1238.99,"text":"compute a new cluster, we're going to iterate again and again. And what we thought about is"},{"start":1243.15,"text":"is there's nothing in here that says to stop iterating."},{"start":1246.77,"text":"But there's a natural condition to stop iterating."},{"start":1249.57,"text":"There's one natural condition, actually,"},{"start":1251.25,"text":"which we use in practice."},{"start":1252.67,"text":"Run some number of steps and call it a day."},{"start":1254.51,"text":"You're all familiar with this condition."},{"start":1256.67,"text":"A second one that is traditionally run"},{"start":1258.85,"text":"is, well, the clusters are eventually going to get fixed."},{"start":1262.17,"text":"You're getting stuck at a minimum."},{"start":1264.41,"text":"And then you just stop when the assignments are there."},{"start":1267.59,"text":"So we're not repeating that initialize."},{"start":1270.17,"text":"We're using the cluster."},{"start":1270.87,"text":"Exactly right."},{"start":1271.51,"text":"Yeah."},{"start":1271.61,"text":"Yeah, this part is the part from the, yeah, as you said, that you're initializing."},{"start":1275.19,"text":"We're not reinitializing on every step."},{"start":1276.93,"text":"Wonderful questions."},{"start":1278.47,"text":"Please."},{"start":1279.29,"text":"Some lectures ago, we got this intuition that in very high dimensions,"},{"start":1286.23,"text":"it's kind of hard to think about non-complex, non-complexities."},{"start":1291.15,"text":"So does it apply here?"},{"start":1292.75,"text":"If you have many dimensions, it would be probably easier to have a..."},{"start":1296.51,"text":"This is a phenomenal, phenomenal question."},{"start":1298.67,"text":"question. Let me see if I have it on the next piece. No, no. Okay. So the question, there's"},{"start":1305.45,"text":"two questions that I want to get to here. So the kind of repeating as you went back"},{"start":1309.09,"text":"to is one of the things we discussed earlier is that your intuition about what happens"},{"start":1313.11,"text":"with points in high dimensions is a little bit weird, right? It doesn't look like three"},{"start":1316.55,"text":"dimensions. And so weird things can happen in high dimensions with random points, your"},{"start":1320.21,"text":"nearest neighbor and your farthest neighbor about the same distance, stuff like that."},{"start":1323.59,"text":"Like if you sample from the sphere, you get like the shell, you know, if you sample inside"},{"start":1327.05,"text":"the sphere kind of thing."},{"start":1328.11,"text":"Okay, so this relates back to your point about this random scattered data that's out there. If your data has no structure in it and it's random, then running k-means on it is kind of a bizarre thing to do."},{"start":1339.4,"text":"And the reason it's bizarre is what k-means has to have underneath it is some meaningful structure. And this is exactly, you're both thinking exactly the same way. If your data has latent clusters, you believe it has latent clusters. I was at a talk earlier today where someone was talking about clusters in gene type, different gene types for different expression."}],"speech_gaps":[],"frame":"../frames/v040/008.webp","frame_time":1215.95},{"title":"K-Means 与混合高斯模型（非 EM）","segments":[{"id":119,"text":"The clusters we believe are meaningful, we believe there are homologues, we believe there are genes that look kind of the same and they should actually cluster. K-means is designed to say if the data look like that, we should be able to pull it up, and even if it looks like that, we may not be able to pull it out because of all the caveats that I put here. But that's the intuition if it makes sense. So it has to be some structure, and in general, this structure is quite rare as you were thinking about before. If you have a spray of points that have no structure to them, k-means will return something.","start":1359.47,"end":1388.6},{"id":120,"text":"But it won't be meaningful. And so this type of algorithm, these unsupervised, which you guys are phenomenal, you got right away, they really only make sense if you take that data in this incarnation and actually examine it or check it in some other way. And so a lot of the places where you use unsupervised algorithms are to get a descriptive feel of your data, or if you know there actually are clusters inside it and that this is something that's meaningful to pull out, like in the biology example.","start":1389.24,"end":1414.0},{"id":121,"text":"We'll see another one later, maybe it's the next lecture, where people are looking for data from particular stars. And the stars have various different emission patterns. And so they know that that data is meaningful, and they have a different way of checking it. But that's kind of the mental model of how you use it. And you have to see there's a lot of just raw modeling. Another one which people always ask rightly is, how do you pick K?","start":1414.52,"end":1441.02},{"id":122,"text":"So we talked about K being equal to 2. But this conversation, as we talked about, you could make K 5, 10, 20. How do you pick it? Well, it turns out that when you pick K, you are making another modeling assumption. You have to have some intuition about how many K are actually in your data set, how many clusters are in your data set. If we go back and look, I'll draw this picture. So let's say that I have these points. How many different clusters are here?","start":1442.03,"end":1475.23},{"id":123,"text":"Well, you could say maybe there's two.","start":1475.78,"end":1477.08},{"id":124,"text":"You say, no, no, I think there's four.","start":1478.94,"end":1480.16},{"id":125,"text":"Both of those are kind of correct.","start":1484.1,"end":1485.64},{"id":126,"text":"Three gets a little wonky, right?","start":1486.26,"end":1488.14},{"id":127,"text":"Three, if you try and think about what it looks like,","start":1488.3,"end":1490.02},{"id":128,"text":"you're like, which three do I pick, right?","start":1490.06,"end":1491.86},{"id":129,"text":"Maybe I pick two and one, I don't know.","start":1491.9,"end":1493.14},{"id":130,"text":"Maybe I pick these two.","start":1493.22,"end":1494.08},{"id":131,"text":"The point is that this is actually very underspecified.","start":1495.76,"end":1499.1},{"id":132,"text":"And so at first, the reason I like this so much is","start":1499.7,"end":1502.34},{"id":133,"text":"it's a simple enough algorithm to think through","start":1502.34,"end":1504.24},{"id":134,"text":"effectively all of these issues. That's like one of the real challenges when you","start":1504.24,"end":1508.26},{"id":135,"text":"start to do more unsupervised modeling is that it forced you to think about","start":1508.26,"end":1511.52},{"id":136,"text":"modeling challenges because otherwise the answer doesn't make sense. Which","start":1511.52,"end":1514.96},{"id":137,"text":"sometimes if you're doing kind of a linear model, you don't think as much","start":1514.96,"end":1518.24},{"id":138,"text":"about what the modeling assumptions you're making are, but they're still","start":1518.24,"end":1521.54},{"id":139,"text":"there. Machine learning only works under assumptions. That's the trade.","start":1521.54,"end":1525.94},{"id":140,"text":"That's the idea.","start":1526.1,"end":1526.84},{"id":141,"text":"Yeah.","start":1526.84,"end":1526.92},{"id":142,"text":"Fantastic.","start":1527.76,"end":1528.16},{"id":143,"text":"Please.","start":1528.26,"end":1528.44},{"id":144,"text":"Can you just run these with different k-means?","start":1528.76,"end":1530.78},{"id":145,"text":"But also have original.","start":1531.8,"end":1532.98},{"id":146,"text":"Yeah, yeah.","start":1533.3,"end":1533.82},{
